teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Recapitulare: ora, dimineața, după-amiaza, seara, noaptea, la'
    gloss: ora, dimineața, după-amiaza, seara, noaptea, la (timp general)
    note: O scurtă recapitulare a cuvintelor despre timp din unitatea 4 -- această unitate le folosește intens.
    example_gloss:
    - Acum este ora 8 dimineața.
    - Noaptea nu se țin cursuri.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Mă trezesc
    gloss: mă trezesc (vorbitor bărbat / vorbitoare femeie)
    note: Primul verb la prezentul habitual din această unitate -- extinde tiparul -ta/-tee văzut în unitatea 5 (rahta hai/rahtee hai) la persoana întâi, cu hoon.
    example_gloss:
    - Mă trezesc la 7 dimineața.
    - Mă trezesc la 6 dimineața.
  hi.a1.unit10.lesson01.teach.roz:
    title: În fiecare zi
    gloss: în fiecare zi
    note: Un adverb nou pentru a descrie rutina zilnică.
    example_gloss: Mă trezesc în fiecare dimineață.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Mă iau micul dejun
    gloss: Iau micul dejun (vorbește un bărbat / o femeie)
    note: „Nashta” (micul dejun) se combină cu „karta/kartee hoon” (fac).
    example_gloss:
    - Dimineața iau micul dejun.
    - Dimineața iau micul dejun.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Merg la serviciu
    gloss: Merg la serviciu (vorbește un bărbat / o femeie)
    note: „Kaam par jaana” (a merge la serviciu) cere cuvântul „par” (pe/la) – o expresie fixă, spre deosebire de „school jaana” mai târziu în această unitate, care nu cere niciun cuvânt în plus.
    example_gloss:
    - Apoi merg la serviciu.
    - Apoi merg la serviciu.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Structura prezentului obișnuit
    gloss: 'Pentru a descrie un obicei zilnic, verbul primește -ta/-tee/-te, iar în funcție de subiect se adaugă hoon/ho/hai/hain: eu mă trezesc (bărbat/femeie) „hoon”, tu te trezești „ho”, el/ea se trezește „hai”, ei se trezesc „hain”.'
    note: Prezintă de la început întregul tipar (întrezărit deja în dialogul din unitatea 1 și formalizat pentru persoana a treia în unitatea 5), ca exercițiile din această lecție să nu ceară ghicirea unei forme nepredate.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Dimineața mea, pas cu pas
    gloss: În fiecare dimineață mă trezesc la 7, apoi iau micul dejun, apoi merg la serviciu.
    note: Combină cele trei verbe de rutină din această lecție într-o singură propoziție firească, cu pași în succesiune.
  hi.a1.unit10.lesson02.teach.sona:
    title: Dorm
    gloss: Dorm (vorbește un bărbat / o femeie)
    note: Același tipar -ta/-tee + hoon, aplicat unui verb nou.
    example_gloss:
    - Noaptea mă culc la 11.
    - Noaptea mă culc la 10.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Merg la școală
    gloss: Merg la școală (vorbește un bărbat / o femeie)
    note: Spre deosebire de „kaam par jaana”, „school jaana” nu cere niciun cuvânt înaintea lui „jaana”.
    example_gloss:
    - În fiecare dimineață merg la școală la 8.
    - În fiecare dimineață merg la școală la 8.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'Forma cu tum: -te/-tee + ho'
    gloss: 'Cu „tum” (tu, informal), verbul primește -te/-tee și „ho”: te trezești (întrebi un bărbat) / te trezești (întrebi o femeie), dormi (întrebi un bărbat) / dormi (întrebi o femeie).'
    note: Partea de persoana a doua din același tipar introdus în prima lecție.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Cu genul cui se acordă forma cu tum?
    gloss: 'Verbul la forma cu tum se acordă cu genul persoanei întrebate, nu al vorbitorului – când o întrebi pe Priya: „Când te trezești?” (formă feminină); când îl întrebi pe Arjun: „Când te trezești?” (formă masculină).'
    note: Un punct ușor de ratat, verificat în toate replicile cu forma tum din dialogul lecției 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Când te trezești?
    gloss: Când te trezești? (întrebi un bărbat)
    note: O întrebare gata de folosit, cu noua formă tum din această lecție.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Întâi mă trezesc, apoi iau micul dejun
    gloss: Întâi mă trezesc, apoi iau micul dejun.
    note: Reia „pahle”/„phir” (întâi/apoi) din succesiunea indicațiilor de direcție din unitatea 9, acum pentru pașii rutinei.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par față de school
    gloss: „Kaam par jaana” (a merge la serviciu) cere „par”, dar „school jaana” (a merge la școală) nu cere niciun cuvânt în plus – ambele sunt corecte și frecvente.
    note: O diferență idiomatică reală, nu o regulă generală cu o excepție.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Înapoi
    gloss: înapoi
    note: Se folosește cu „aana” (a veni) pentru „a se întoarce”.
    example_gloss: Mă întorc.
  hi.a1.unit10.lesson03.teach.aana:
    title: Vin
    gloss: Vin (vorbește un bărbat / o femeie)
    note: Un verb nou, care urmează același tipar al prezentului obișnuit, deja stabilit.
    example_gloss:
    - Mă întorc seara.
    - Mă întorc seara.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Mănânc (mâncare)
    gloss: Mănânc (vorbește un bărbat / o femeie)
    note: „Khana” substantivul (mâncare, din unitatea 6) plus „khana” verbul (a mânca) – o dublare firească în hindi, nu o greșeală de scriere.
    example_gloss:
    - Noaptea mănânc.
    - Noaptea mănânc.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Cina
    gloss: 'cină (literal: „mâncarea nopții”)'
    note: Reia „raat” (noapte), „ka” (posesiv) și „khana” (mâncare), toate predate deja.
    example_gloss: Cina este foarte gustoasă.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun o întreabă pe Priya când se trezește
    gloss: Arjun o întreabă pe Priya la ce oră se trezește în fiecare zi.
    note: Folosește forma feminină cu tum, adresându-se corect Priyei.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Priya răspunde
    gloss: 'Priya spune: În fiecare dimineață mă trezesc la 6. Apoi iau micul dejun.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun își povestește propria rutină
    gloss: 'Arjun spune: Foarte bine! Eu mă trezesc la 7. Iau și eu micul dejun, apoi merg la serviciu.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya îl întreabă pe Arjun când se întoarce
    gloss: Priya îl întreabă pe Arjun când se întoarce.
    note: Folosește forma masculină cu tum, adresându-se corect lui Arjun. Introduce „vaapas aana” în context.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun își descrie seara
    gloss: 'Arjun spune: Mă întorc seara la 6. Apoi mănânc cina, apoi dorm.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya își descrie seara
    gloss: 'Priya spune: Și eu mă întorc seara, apoi mănânc.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun o întreabă pe Priya când se culcă
    gloss: Arjun o întreabă pe Priya la ce oră se culcă.
    note: Din nou forma feminină cu tum, adresându-se corect Priyei.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya răspunde și încheie
    gloss: 'Priya spune: Noaptea mă culc la 11. Bine, ne vedem mâine!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun încheie
    gloss: 'Arjun spune: Bine, ne vedem mai târziu!'
