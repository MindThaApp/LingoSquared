answer_policy:
  gender_agreement: 'This unit''s central grammar point (habitual present, verb stem + -ता/-ती/-ते + हूँ/हो/है/हैं) is grammatically gendered by the subject. For any exercise where the subject is a NAMED character with an established gender (Arjun: masculine: Priya: feminine), `accepted_answers` contains only that character''s single correct gendered form. For any exercise where the subject is the LEARNER themselves (a self-description prompt phrased with "तुम"/"अपनी"), `accepted_answers` deliberately includes BOTH the masculine and the feminine conjugated forms as equally correct -- the app has no signal of the learner''s own gender, and marking only one form correct would wrongly fail roughly half of all learners regardless of which gendered form the exercise happened to be authored around first.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized form used anywhere in this unit is हूँ, reused unchanged from its already-settled unit01 spelling. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation, nasalization marks, or (for self-description prompts) which grammatically correct gendered form the learner produces.
