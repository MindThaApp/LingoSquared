teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Recapitulare: ocupat'
    gloss: ocupat
    note: O scurtă recapitulare a adjectivului din unitatea 11. În această unitate îl refolosim ca să exersăm noul timp trecut al copulei.
    example_gloss: Arjun este ocupat.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Era (masculin / feminin)
    gloss: era
    note: Trecutul copulei (a fi), corespondentul la trecut al formelor hai/hoon/hain. „Tha” se acordă cu un subiect masculin, „thi” cu un subiect feminin.
    example_gloss:
    - Arjun a fost ocupat ieri.
    - Priya a fost ocupată ieri.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha și thi
    gloss: '„Tha” se folosește cu un subiect masculin, „thi” cu un subiect feminin. Stau acolo unde stă „hai”, dar, spre deosebire de „hai”, se schimbă după gen: Arjun este ocupat, Arjun a fost ocupat, Priya a fost ocupată.'
    note: Prezintă explicit regula acordului în gen, extinzând paradigma deja cunoscută a copulei la timpul trecut.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Recapitulare: ieri'
    gloss: ieri
    note: Cuvântul a fost introdus în unitatea 4, unde s-a arătat că „kal” înseamnă și „mâine”, și „ieri”, iar diferența o face doar timpul verbului. Aceasta este prima unitate din curs care folosește sensul de trecut („ieri”).
    example_gloss: Ieri a fost sâmbătă.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Cum (masculin)
    gloss: cum
    note: 'Completează o paradigmă din care cunoșteai deja două forme: „kaise” și „kaisi” (din „ce mai faci?” din unitatea 1). Aceasta este forma lipsă de masculin singular, folosită cu subiecte ca „din” (zi).'
    example_gloss: Cum a fost ziua?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Cum a fost ieri?
    gloss: Cum a fost ieri?
    note: Întrebarea centrală a acestei unități, care reunește toate cuvintele învățate până acum în lecție.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: Ziua a fost bună.
    gloss: Ziua a fost bună.
    note: Un răspuns gata de folosit la „Cum a fost ieri?”, cu forma de masculin (din este masculin).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Filmul a fost bun.
    gloss: Filmul a fost bun.
    note: Același tipar, cu un subiect feminin (film este feminin în hindi), cu referire la vocabularul din unitatea 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: „Kaisa” se folosește cu un subiect masculin singular (Cum a fost ziua?), „kaisi” cu unul feminin (Cum a fost ceaiul?), iar „kaise” se folosește cu aap/tum când întrebi un bărbat (Ce mai faci?; unei femei îi spui „aap kaisi hain?”). Toate trei sunt forme ale aceluiași cuvânt.
    note: 'Reunește pentru prima dată întreaga paradigmă: kaise/kaisi erau cunoscute din unitatea 1, kaisa este noutatea acestei lecții.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Recapitulare: eu, Arjun, Priya'
    gloss: eu, Arjun, Priya
    note: O scurtă recapitulare înaintea primelor exemple la trecut cu persoana întâi.
    example_gloss:
    - Eu sunt Arjun.
    - Eu sunt Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: A mers (masculin / feminin)
    gloss: a mers
    note: Trecutul verbului „jaana” (a merge), aceeași rădăcină ca imperativul „jao” (mergi!) din unitatea 9. Se acordă în gen cu subiectul, la fel ca „tha”/„thi”.
    example_gloss:
    - Arjun a mers la piață.
    - Priya a mers acasă.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = trecutul lui jaana
    gloss: „Gaya”/„gai” este trecutul verbului „jaana” (a merge, jao în unitatea 9) și se schimbă după genul subiectului, exact ca „tha”/„thi”.
    note: Leagă explicit noul trecut de rădăcina de imperativ deja cunoscută.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Recapitulare: piață, acasă'
    gloss: piață, acasă
    note: O scurtă recapitulare a două cuvinte pentru locuri din unitățile 7/8, necesare ca să spui unde a mers cineva.
    example_gloss:
    - Aceasta este piața.
    - Aceasta este casa.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: A întâlnit (masculin / feminin)
    gloss: a întâlnit
    note: Trecutul verbului „milna” (a se întâlni), aceeași rădăcină ca forma obișnuită „milte hain” din formulele de încheiere din unitățile 1/4/10/11. Se acordă în gen cu subiectul.
    example_gloss:
    - Arjun s-a întâlnit cu Priya.
    - Priya s-a întâlnit cu Arjun.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = „cu” aici, nu „din”
    gloss: 'Aici „se” nu înseamnă „din”: „X se milna” înseamnă „a se întâlni CU X”, în timp ce în „main Bharat se hoon” același cuvânt „se” însemna „din”.'
    note: Este o dublă utilizare reală a unui cuvânt deja învățat, explicată deschis.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Recapitulare: acolo'
    gloss: acolo
    note: O scurtă recapitulare din unitățile 8/9, folosită aici ca să spui unde a avut loc o întâlnire.
    example_gloss: Școala este acolo.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Ieri am fost la piață.
    gloss: Ieri am fost la piață.
    note: Combină noul timp trecut din această lecție cu „kal” din prima lecție.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Acolo m-am întâlnit cu Priya.
    gloss: Acolo m-am întâlnit cu Priya.
    note: Combină „mila” din această lecție cu „se” („cu”) și „wahan” (acolo).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Recapitulare: împreună'
    gloss: împreună
    note: O scurtă recapitulare din unitatea 11.
    example_gloss: Bem ceai împreună.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Recapitulare: ceai, magazin, mâncare'
    gloss: ceai, magazin, mâncare
    note: O scurtă recapitulare a trei substantive din unitățile 6/7, necesare pentru dialogul și nota de lectură din această lecție.
    example_gloss:
    - Ceaiul este bun.
    - Magazinul este bun.
    - Mâncarea este bună.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Recapitulare: „al/a/ai/ale” (ka), cum (feminin)'
    gloss: al / a (ka), cum (feminin, kaisi)
    note: „Ka” (din „kitne ka” și din „raat ka khana” din unitatea 10) și „kaisi” (învățat anterior) sunt refolosite aici; nu sunt gramatică nouă.
    example_gloss:
    - Ziua de ieri a fost bună.
    - Cum a fost ceainăria?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun întreabă cum a fost ieri
    gloss: Priya, cum a fost ieri?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya spune că a fost bine
    gloss: Foarte bine! Ne-am întâlnit.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun amintește de piață
    gloss: Da! Mai întâi am fost și la piață.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya întreabă despre piață
    gloss: Aha! Ce era la piață?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun răspunde
    gloss: Mâncarea era bună.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya întreabă despre ceainărie
    gloss: Aha! Și cum era ceainăria?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun răspunde
    gloss: Ceainăria era foarte bună.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya încheie conversația
    gloss: Bine! Atunci ne vedem din nou mâine?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve folosesc forma de plural la trecut
    gloss: '„Tum”, „hum” și „ve” primesc la trecut aceeași formă pe care o au la prezent cu „-te”: „the” (în loc de „tha”), „gaye” (în loc de „gaya”), „mile” (în loc de „mila”) -- la fel ca „hum milte hain” care devine „hum mile”.'
    note: Prezintă paradigma completă pentru o înțelegere corectă, deși în exercițiile acestei unități se exersează activ doar „mile”; „the” și „gaye” sunt doar de recunoscut și apar numai în explicația acestei note.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Biletul Priyei
    gloss: Arjun, ziua de ieri a fost foarte bună. Mâncarea a fost bună, iar ceainăria a fost și ea bună. - Priya
    note: Un bilet scurt care reia faptele stabilite chiar în dialog, fără vocabular nou.
    glosses:
      कल: ieri
      दिन: zi
      अच्छा: bun (masculin)
      था: a fost (masculin)
      खाना: mâncare
      दुकान: magazin
      अच्छी: bună (feminin)
      थी: a fost (feminin)
