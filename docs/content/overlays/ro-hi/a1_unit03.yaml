teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Astăzi
    gloss: astăzi
    note: Cuvântul pe care îl vei folosi în aproape fiecare propoziție din această lecție.
    example_gloss: Azi vremea este frumoasă.
  hi.a1.unit03.lesson01.teach.somvar:
    title: luni
    gloss: luni
    note: Își trage numele de la सोम (Luna) – ca în română luni, ziua Lunii.
    example_gloss: Ora de yoga este luni.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Marți
    gloss: marți
    note: Își trage numele de la मंगल (Marte), același model pe care îl urmează majoritatea numelor zilelor în hindi.
    example_gloss: Astăzi este marți.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Miercuri
    gloss: miercuri
    note: Își trage numele de la बुध (Mercur).
    example_gloss: Astăzi este miercuri.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Joi
    gloss: joi
    note: Își trage numele de la गुरु (Jupiter).
    example_gloss: Astăzi este joi.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Vineri
    gloss: vineri
    note: Își trage numele de la शुक्र (Venus).
    example_gloss: Vineri nu este oră de yoga.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: sâmbătă
    gloss: sâmbătă
    note: Își trage numele de la शनि (Saturn).
    example_gloss: Astăzi este sâmbătă.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: duminică
    gloss: duminică
    note: Își trage numele de la रवि, un nume sanscrit al Soarelui – spre deosebire de română, unde duminica vine de la „ziua Domnului”.
    example_gloss: Astăzi este duminică.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Cum întrebi ce zi este
    gloss: Ce zi este azi?
    note: '*Kaun sa* („care”) se acordă cu substantivul masculin *din* („zi”) – forma feminină, *kaun si*, o vei vedea mai târziu cu substantive feminine.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Cum spui că un eveniment are loc într-o anumită zi
    gloss: Ora de yoga este luni.
    note: '*Ko* după numele unei zile arată momentul – *somvar ko* înseamnă „luni”, același tipar pentru toate zilele săptămânii.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Cum spui că un eveniment nu are loc într-o anumită zi
    gloss: Vineri nu este oră de yoga.
    note: Nahin neagă propoziția; ko marchează în continuare ziua, aici așezată chiar la început pentru accent.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Ianuarie, februarie, martie
    gloss: ianuarie, februarie, martie
    note: Numele lunilor în hindi sunt în mare parte împrumutate și ușor de recunoscut după ce știi tiparul – nicio gramatică nouă aici, doar vocabular.
    example_gloss:
    - Ziua mea de naștere este în ianuarie.
    - Următoarea sărbătoare este în februarie.
    - Ziua mea de naștere este în martie.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Aprilie, mai, iunie
    gloss: aprilie, mai, iunie
    note: Același tipar ușor de recunoscut ca la primele trei luni.
    example_gloss:
    - Următoarea sărbătoare este în aprilie.
    - Ziua mea de naștere este în mai.
    - Următoarea sărbătoare este în iunie.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Iulie, august, septembrie
    gloss: iulie, august, septembrie
    note: Sitambar este scris aici cu anusvara (सितंबर); scrierea cu m jumătate (सितम्बर) este și ea frecventă și la fel de corectă.
    example_gloss:
    - Ziua mea de naștere este în iulie.
    - Următoarea sărbătoare este în august.
    - Ziua mea de naștere este în septembrie.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Octombrie, noiembrie, decembrie
    gloss: octombrie, noiembrie, decembrie
    note: Navambar și disambar folosesc aceeași scriere cu anusvara ca sitambar; नवम्बर și दिसम्बर (cu m jumătate) sunt și ele frecvente și la fel de corecte.
    example_gloss:
    - Următoarea sărbătoare este în octombrie.
    - Ziua mea de naștere este în noiembrie.
    - Următoarea sărbătoare este în decembrie.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Data
    gloss: dată
    note: '*Tareekh* este un substantiv feminin – cuvântul interogativ ia forma feminină (*kitni tareekh*, niciodată *kitna tareekh*), același tipar de acord pe care l-a învățat unitatea 2 cu *keemat* și *umra*.'
    example_gloss: Azi este trei.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: În (cu o lună)
    gloss: în – se folosește cu numele unei luni
    note: '*Mein* marchează o lună așa cum *ko* marchează o zi: *janvari mein* înseamnă „în ianuarie”, niciodată *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Cum întrebi data
    gloss: Ce dată este astăzi?
    note: Literal „câte este data de azi” – kitni se acordă cu femininul tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Cum spui data, doar cu un număr
    gloss: Azi este trei.
    note: În hindi data se exprimă printr-un numeral cardinal simplu (*teen*, „trei”), la fel ca în română, unde spunem „azi este trei”; nu trebuie învățat un cuvânt special pentru dată, doar numerele pe care le știi deja.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Cum spui data, cu luna
    gloss: Azi este trei ianuarie.
    note: Același tipar cu numeral cardinal, acum cu numele lunii adăugat după el.
  hi.a1.unit03.lesson03.teach.kab:
    title: Când
    gloss: când
    note: Un cuvânt interogativ simplu și foarte frecvent.
    example_gloss: Când este următoarea oră?
  hi.a1.unit03.lesson03.teach.agli:
    title: Următoarea
    gloss: următoarea
    note: '*Agli* este forma feminină – *class* (क्लास) este tratat ca substantiv feminin în hindi-ul de zi cu zi, deci ia *agli*, nu masculinul *agla*.'
    example_gloss: Următoarea oră este marți.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Zece
    gloss: zece
    note: Reluat din unitatea 2 – necesar aici pentru o dată reală.
    example_gloss: Următoarea oră este pe zece.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Ziua de naștere
    gloss: ziua de naștere
    note: Substantiv masculin – mera janmadin, niciodată meri janmadin.
    example_gloss: Ziua mea de naștere este în decembrie.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Cum întrebi informal când e ziua cuiva
    gloss: Când e ziua ta de naștere? (informal)
    note: Tumhara se acordă cu masculinul janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Cum spui când e ziua ta
    gloss: Ziua mea de naștere este în ianuarie.
    note: Răspunsul complet firesc la Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Cum întrebi când e următoarea oră
    gloss: Când este următoarea oră?
    note: Îmbină agli (feminin, acordat cu class) cu kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Cum spui ziua și data completă
    gloss: Următoarea oră este marți, zece martie.
    note: Ziua și data se leagă împreună ca în română – mai întâi ziua săptămânii, apoi numărul și luna; în hindi se adaugă și ko la final.
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre următoarea oră
    gloss: Arjun întreabă când este următoarea oră de yoga.
    note: Reia întocmai întrebarea din această lecție, cu yog adăugat pentru claritate.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya spune ziua și data
    gloss: Priya spune că următoarea oră este marți, zece martie.
    note: Reia întocmai propoziția cu ziua și data din această lecție.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun îi mulțumește
    gloss: Arjun spune „bine, mulțumesc”.
    note: Theek hai și shukriya reiau vocabularul din unitatea 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya răspunde
    gloss: Priya spune că nu e nicio problemă.
    note: Koi baat nahin este o formulă foarte frecventă și firească pentru „cu plăcere” sau „nicio problemă”.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun o întreabă când e ziua lui Priya
    gloss: Arjun întreabă când e ziua de naștere a lui Priya.
    note: Reia întocmai întrebarea informală despre ziua de naștere din această lecție.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya răspunde
    gloss: Priya spune că ziua ei de naștere este în ianuarie.
    note: Reia întocmai propoziția-răspuns din această lecție.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reacționează și o spune pe a lui
    gloss: Arjun reacționează pozitiv, apoi spune că ziua lui de naștere este în decembrie.
    note: Accha reia vocabularul din unitatea 1; decembrie a fost învățat deja în lecția 2 a acestei unități.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya încheie conversația
    gloss: Priya încuviințează și spune un „pe curând” informal.
    note: Theek hai și phir milte hain reiau amândouă vocabularul de rămas-bun din unitatea 1.
