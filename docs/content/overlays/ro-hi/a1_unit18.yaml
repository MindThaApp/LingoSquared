teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Recapitulare: casă / acasă'
    gloss: casă / acasă
    note: Predat prima dată în unitatea 8 -- cuvântul tematic al întregii unități.
    example_gloss: Aceasta este o casă.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Recapitulare: în / la'
    gloss: în / la
    note: Predat prima dată în unitatea 1 -- folosit în toată unitatea pentru a localiza camerele și obiectele.
    example_gloss: Lucrez la birou.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Recapitulare: este, sunt'
    gloss: este (singular), sunt (plural)
    note: Perechea de copule la singular și plural de care depinde tot tiparul de cantitate al unității.
    example_gloss:
    - Aceasta este o casă.
    - Bunicul meu locuiește în Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Recapitulare: câți / câte, unu, doi, trei'
    gloss: câți / câte, unu, doi, trei
    note: Predate prima dată în unitățile 2/7 -- refolosite aici pentru a număra camerele.
    example_gloss:
    - Am trei frați.
    - Câte camere are casa?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Cameră (singular / plural)
    gloss: cameră, camere
    note: 'Un substantiv nou. Atenție la plural: *kamra* (una) devine *kamre* (mai multe) -- vezi nota de gramatică a acestei lecții.'
    example_gloss:
    - În casă este o cameră.
    - În casă sunt trei camere.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 'Masculin: plural -a -> -e'
    gloss: 'Substantivele masculine care se termină în ''-a'' trec la ''-e'' la plural -- ''kamra'' (una) devine ''kamre'' (mai multe). Și verbul se schimbă după număr: ''hai'' pentru unu, ''hain'' pentru mai multe -- de exemplu ''ghar mein ek kamra hai'', dar ''ghar mein teen kamre hain''.'
    note: Prima regulă de plural al substantivelor predată oficial în acest curs, prezentată înainte ca vreun exercițiu să se bazeze pe ea.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Bucătărie
    gloss: bucătărie
    note: Un substantiv nou, primul cuvânt pentru o cameră din această unitate.
    example_gloss: În casă este o bucătărie.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Baie
    gloss: baie
    note: Cuvânt împrumutat din engleză, foarte frecvent în hindi vorbită, după același tipar ca *doctor*/*engineer* (unitățile 16/17).
    example_gloss: În casă este o baie.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Dormitor
    gloss: dormitor
    note: Tot un cuvânt împrumutat uzual, invariabil ca *bathroom* -- nu primește sufix propriu de plural, ci doar tiparul numeral + *hain*.
    example_gloss: În casă sunt două dormitoare.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: Câte camere are casa?
    gloss: Câte camere are casa?
    note: Întrebarea cu care începe această lecție.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: Casa are trei camere.
    gloss: Casa are trei camere.
    note: Un răspuns model la întrebarea de la începutul lecției.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Recapitulare: și'
    gloss: și
    note: Predat prima dată în unitatea 1 -- refolosit aici pentru a enumera mobila.
    example_gloss: Și mie mi-a plăcut, și ție?
  hi.a1.unit18.lesson02.teach.mez:
    title: Masă
    gloss: masă
    note: Un substantiv nou, folosit doar la singular în exercițiile acestei unități (regula lui de plural nu a fost încă predată).
    example_gloss: În bucătărie este o masă.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Scaun (singular / plural)
    gloss: scaun, scaune
    note: 'Un substantiv nou. Atenție la plural: *kursi* (unul) devine *kursiyan* (mai multe) -- o regulă diferită de *kamra*/*kamre*, vezi nota de gramatică a acestei lecții.'
    example_gloss:
    - În bucătărie este un scaun.
    - În bucătărie sunt patru scaune.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Recapitulare: patru'
    gloss: patru
    note: Predat prima dată în unitatea 2 -- refolosit aici pentru a număra scaunele.
    example_gloss: În bucătărie sunt patru scaune.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 'Feminin: plural -i -> -iyan'
    gloss: Substantivele feminine care se termină în '-i' trec la '-iyan' la plural -- 'kursi' (unul) devine 'kursiyan' (mai multe), la fel cum 'kamra' a devenit 'kamre' mai devreme în această unitate, după regula masculinului -- dar regula de aici este diferită, deoarece cuvântul este feminin și se termină în '-i'.
    note: A doua regulă de plural din această unitate, predată intenționat imediat după prima, ca să fie ușor de văzut contrastul.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Pat
    gloss: pat
    note: Un substantiv nou, folosit doar la singular în exercițiile din această unitate.
    example_gloss: În dormitor este un pat.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Fereastră (singular / plural)
    gloss: fereastră, ferestre
    note: Urmează aceeași regulă a pluralului feminin „-i” -> „-iyan” ca *kursi*/*kursiyan*.
    example_gloss:
    - În dormitor este o fereastră.
    - În dormitor sunt două ferestre.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: În bucătărie este o masă.
    gloss: În bucătărie este o masă.
    note: Structura loc + obiect aplicată la bucătărie.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: În dormitor este un pat.
    gloss: În dormitor este un pat.
    note: Structura loc + obiect aplicată la dormitor.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Recapitulare: cum / de ce fel'
    gloss: cum / de ce fel
    note: Învățat prima dată în unitatea 12 -- reluat aici pentru a întreba despre o locuință.
    example_gloss: Cum este casa ta?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Recapitulare: mare, mic'
    gloss: mare (masc.), mare (fem.), mic (masc.), mică (fem.)
    note: 'Învățat prima dată în unitatea 14 -- reluat aici pentru a descrie o locuință. Se acordă cu genul substantivului: masculinul *ghar* cere *bada*/*chota*, femininul *rasoi* cere *badi*.'
    example_gloss:
    - Casa mea este mică.
    - Aceasta este o bucătărie mare.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 'Recapitulare: sau'
    gloss: sau
    note: Învățat prima dată în unitatea 14 -- reluat aici pentru a pune o întrebare cu alegere.
    example_gloss: Casa ta este mare sau mică?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 'Recapitulare: Arjun, Priya'
    gloss: Arjun, Priya
    note: O reamintire a numelor celor două personaje, înainte ca exercițiile de ordonare a cuvintelor și de gramatică din această lecție să le folosească pentru a spune a cui locuință este descrisă.
    example_gloss:
    - Numele meu este Arjun.
    - Numele meu este Priya.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 'Recapitulare: posesivul „al/a lui”'
    gloss: al / a lui (posesiv, substantiv masculin)
    note: Învățat prima dată în unitățile 7/10/12/14/15 -- reluat aici pentru a spune a cui este casa descrisă; în toată unitatea rămâne în forma simplă, de nominativ.
    example_gloss: Casa Priyei este mică.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: Arjun o întreabă pe Priya despre casa ei
    gloss: Priya, casa ta este mare sau mică?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Priya spune că locuința ei este mică
    gloss: 'Casa mea este mică. În casă sunt două camere: o bucătărie și o baie.'
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: Priya îi pune lui Arjun aceeași întrebare
    gloss: Și casa ta, Arjun?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: Arjun spune că locuința lui este mare
    gloss: Casa mea este mare. În casă sunt trei dormitoare și o bucătărie mare.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: Priya întreabă ce este în dormitor
    gloss: Uau! Ce este în dormitor?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: Arjun descrie dormitorul
    gloss: În dormitor sunt un pat și două ferestre.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Priya reacționează
    gloss: Foarte frumos!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: Arjun îi mulțumește
    gloss: Mulțumesc!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale unității: (1) „[loc] + mein + [număr] + [substantiv] + hai/hain” spune ce se află într-o casă și câte; (2) substantivele masculine care se termină în „-a” fac pluralul în „-e” (kamra -> kamre); (3) substantivele feminine care se termină în „-i” fac pluralul în „-iyan” (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Un rezumat final care leagă gramatica întregii unități, ca notele de gramatică cu paradigme din unitățile 15-17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Citim despre două locuințe
    gloss: 'Casa Priyei este mică. În casă sunt două camere: o bucătărie și o baie. Casa lui Arjun este mare. În casă sunt trei dormitoare și o bucătărie mare.'
    note: Un profil scurt și direct, fără cadru narativ nou, care reia exact faptele din dialog, fără informații noi -- servește direct obiectivul de a citi o scurtă descriere a unei locuințe.
    glosses:
      घर: casă / locuință
      छोटा: mic
      कमरे: camere
      रसोई: bucătărie
      बाथरूम: baie
      बड़ा: mare
      बेडरूम: dormitoare
      बड़ी: mare (feminin)
