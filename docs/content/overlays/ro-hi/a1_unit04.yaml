teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Ora (fixă)
    gloss: ora (pentru două sau mai multe)
    note: Se folosește cu orice oră, în afară de unu -- vezi forma specială pentru *ora unu* mai târziu în această lecție.
    example_gloss: Acum este ora cinci.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Acum
    gloss: acum
    note: Un cuvânt simplu de timp pe care îl vei folosi mereu când spui ce oră este.
    example_gloss: Acum este ora zece.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Unu, doi, trei
    gloss: unu, doi, trei
    note: Refolosite din unitatea 2, necesare aici pentru a spune ora -- observă că *ek* cere forma specială *baja*, iar *do* și *teen* cer forma obișnuită *baje*.
    example_gloss:
    - Acum este ora unu.
    - Acum este ora două.
    - Acum este ora trei.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Patru, cinci, șase
    gloss: patru, cinci, șase
    note: Refolosite din unitatea 2 -- toate trei cer forma obișnuită *baje*.
    example_gloss:
    - Acum este ora patru.
    - Acum este ora cinci.
    - Acum este ora șase.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Șapte, opt, nouă
    gloss: șapte, opt, nouă
    note: Refolosite din unitatea 2.
    example_gloss:
    - Acum este ora șapte.
    - Acum este ora opt.
    - Acum este ora nouă.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Zece, unsprezece, doisprezece
    gloss: zece, unsprezece, doisprezece
    note: Refolosite din unitatea 2 -- ultimele numere de oră de care ai nevoie.
    example_gloss:
    - Acum este ora zece.
    - Acum este ora unsprezece.
    - Acum este ora douăsprezece.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja și baje
    gloss: '*Baja* se folosește cu *unu*, iar *baje* cu toate celelalte numere: *ek baja hai*, *do baje hain*.'
    note: O excepție reală de acord, nu o simplificare -- *ek baja hai* este singura oră care folosește forma de singular.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Cum întrebi cât este ceasul
    gloss: Cât este ceasul?
    note: Literal „câte ore bat” -- modul standard de a întreba ce oră este.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Cum spunem ora
    gloss: Acum este ora cinci.
    note: Răspunsul firesc, într-o propoziție completă, la *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Curs de yoga
    gloss: curs de yoga
    note: Refolosit din unitatea 1 -- exemplul din această lecție pentru programare.
    example_gloss: Cursul de yoga este astăzi.
  hi.a1.unit04.lesson02.teach.subah:
    title: Dimineața
    gloss: dimineață
    note: Unul dintre cele patru cuvinte pentru momentele zilei din această lecție.
    example_gloss: Cursul de yoga este dimineața.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: După-amiaza / prânzul
    gloss: după-amiază, prânz
    note: Acoperă atât mijlocul zilei (prânzul), cât și începutul după-amiezii.
    example_gloss: După-amiaza nu este curs.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Seara
    gloss: seară
    note: Intervalul zilei de după *dopahar* și dinainte de *raat*.
    example_gloss: Următorul curs este la cinci seara.
  hi.a1.unit04.lesson02.teach.raat:
    title: Noaptea
    gloss: noapte
    note: Ultimul dintre cele patru cuvinte pentru momentele zilei.
    example_gloss: Noaptea nu este curs.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko cu un moment general al zilei
    gloss: '*Ko* se folosește cu un cuvânt care denumește o parte a zilei, când nu se precizează o oră exactă: *dopahar ko*, *raat ko*.'
    note: Același *ko* care marchează o zi a săptămânii (lecția 3) marchează acum o perioadă generală a zilei. Este o construcție reală și naturală, dar nu singura pe care o înveți în această unitate (vezi nota următoare pentru forma cu oră exactă).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Numele părții zilei chiar înaintea lui baje
    gloss: 'Pentru o oră exactă, cuvântul care denumește partea zilei stă chiar înaintea lui *baje*, fără niciun alt cuvânt între ele: *subah saat baje*, *shaam paanch baje*.'
    note: 'Aici nu se folosește *ko*: acesta este rezervat unei perioade generale, fără oră exactă, după cum explică nota anterioară.'
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Cum întrebi când este cursul
    gloss: La ce oră este cursul?
    note: Același tipar *kitne baje* din lecția 1, folosit acum pentru a întreba despre un eveniment, nu despre ora curentă.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Cum spui ora unui eveniment
    gloss: Cursul este la șapte dimineața.
    note: Îl îmbină pe *subah* direct cu *saat baje*, conform notei de gramatică de mai sus.
  hi.a1.unit04.lesson03.teach.kal:
    title: Mâine / ieri
    gloss: mâine, ieri
    note: Hindi folosește un singur cuvânt pentru ambele sensuri; contextul (și timpul verbului) arată care este cel dorit. În această lecție înseamnă întotdeauna „mâine”.
    example_gloss: Mâine cursul este la cinci după-amiaza.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Următor
    gloss: următor, următoare
    note: 'Reluat din unitatea 3: formă de feminin, care se acordă cu substantivul feminin *class*.'
    example_gloss: Următorul curs este mâine.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Bine, mulțumesc
    gloss: Bine, mulțumesc!
    note: Ambele cuvinte sunt reluate din vocabularul de salut și rămas-bun al unității 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Ne vedem / ne întâlnim
    gloss: ne vedem / ne întâlnim
    note: Reluat din formula de rămas-bun a unității 3, acum împreună cu *kal* pentru „ne vedem mâine”.
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Cum întrebi când este următorul curs
    gloss: La ce oră este următorul curs?
    note: Îl îmbină pe *agli* (feminin, acordat cu «class») cu tiparul *kitne baje* al acestei unități.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Cum spui ora următorului curs
    gloss: Următorul curs este la cinci după-amiaza.
    note: Răspunsul complet și firesc la întrebarea de mai sus.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Încheierea cu planul de a ne vedea mâine
    gloss: Bine, ne vedem mâine!
    note: Modul firesc de a încheia o conversație după ce s-a stabilit ora.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre următorul curs
    gloss: Arjun întreabă la ce oră este următorul curs.
    note: Reia exact întrebarea din această lecție.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya spune ora
    gloss: Priya spune că următorul curs este la cinci după-amiaza.
    note: Reia exact propoziția-răspuns din această lecție.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun îi mulțumește
    gloss: Arjun spune „bine, mulțumesc”.
    note: Reluat din vocabularul unității 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya încheie conversația
    gloss: Priya este de acord și spune „ne vedem mâine”.
    note: Reia exact replica de încheiere din această lecție.
