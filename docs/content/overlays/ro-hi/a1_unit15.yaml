units:
  hi.a1.unit15.travel:
    title: Călătorie
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Trebuie să merg la gară
  hi.a1.unit15.lesson02.platform_samay:
    title: Numărul peronului și ora
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya și Arjun: la gară'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Recapitulare: gară, mie, este'
    gloss: gară, mie / pentru mine, este
    note: O scurtă recapitulare a substantivului de loc și a copulei necesare pentru construcția obligației din această lecție.
    example_gloss:
    - Gara este aici.
    - Am treabă.
  hi.a1.unit15.lesson01.teach.jaana:
    title: A merge
    gloss: a merge (infinitiv)
    note: Infinitivul verbului cunoscut deja ca imperativ *jao* pentru तुम (unitatea 9) -- această lecție introduce infinitivul propriu-zis.
    example_gloss: Trebuie să merg.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + verb + hai = trebuie să
    gloss: '''Mujhe'' a fost învățat deja cu ''chahiye'' (unitatea 6, cu un substantiv) și cu ''hai'' (unitatea 11, ca în ''mujhe kaam hai'', am treabă). Acum apare și cu un verb: ''mujhe jana hai'' înseamnă „trebuie să merg”. Atenție -- cu ''jana'', ''hai'' rămâne neschimbat, nu devine niciodată ''hain'': nu se acordă cu vorbitorul.'
    note: Prezintă a treia utilizare a unui tipar deja învățat, pronume + copulă, menționând cele două utilizări anterioare după numărul unității, înainte de introducerea noului verb.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Trebuie să merg la gară.
    gloss: Trebuie să merg la gară.
    note: Primul exemplu complet al construcției obligației din această unitate.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Biletul
    gloss: bilet
    note: Un substantiv nou, necesar în toată această unitate despre călătorii.
    example_gloss: Unde este biletul meu?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Recapitulare: a vrea / a avea nevoie'
    gloss: a vrea / a avea nevoie
    note: Introdus prima dată în lecția 6, cu băuturile, și refolosit aici cu biletul.
    example_gloss: Aș dori un ceai.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Am nevoie de un bilet.
    gloss: Am nevoie de un bilet.
    note: Structura deja cunoscută *mujhe...chahiye*, aplicată substantivului nou al acestei unități.
  hi.a1.unit15.lesson01.teach.train:
    title: Tren
    gloss: tren
    note: Un substantiv nou.
    example_gloss: Trenul este mare.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Recapitulare: Delhi, de / al'
    gloss: Delhi, de / al (marcă a posesiei)
    note: Delhi a fost introdus în unitatea 5; marca posesivă *ka* a fost folosită în tot cursul (de ex. unitățile 5-14) și aici servește la indicarea destinației unui bilet.
    example_gloss:
    - Fratele meu locuiește în Delhi.
    - Aceasta este geanta lui Arjun.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Am nevoie de un bilet pentru Delhi.
    gloss: Am nevoie de un bilet pentru Delhi.
    note: Combină substantivul din această lecție cu structura posesivă pentru a numi o destinație precisă.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Recapitulare: unde, ție'
    gloss: unde, ție / pentru tine
    note: Ambele au fost deja învățate (unitatea 8 și unitatea 6) și sunt refolosite aici pentru a întreba încotro trebuie să meargă cineva.
    example_gloss:
    - Unde este banca?
    - Ce ai dori?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Recapitulare: număr'
    gloss: număr
    note: Introdus prima dată în unitatea 2 pentru numerele de telefon și refolosit aici pentru numărul peronului.
    example_gloss: Care este numărul tău de telefon?
  hi.a1.unit15.lesson02.teach.platform:
    title: Peronul
    gloss: peron
    note: Un substantiv nou, cuvântul hindi obișnuit pentru peronul din gară (un împrumut frecvent din engleză, ca *phone* în unitatea 2).
    example_gloss: Peronul este mare.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Care este numărul peronului?
    gloss: Care este numărul peronului?
    note: Refolosește structura deja cunoscută a întrebării cu *kya hai* (de ex. număr de telefon, preț, vârstă) pentru un subiect nou.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Peronul numărul 3.
    gloss: Numărul peronului este 3.
    note: Răspunsul firesc, într-o propoziție completă, la întrebarea de mai sus.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (acord la feminin)
    gloss: '''Jaati hai'' aplică regula -ta/-ti/-te + hai/hain din unitatea 10, cu verbul nou ''jana''. ''Train'' (trenul) este feminin în hindi, de aceea se spune ''jaati hai'', nu ''jaata hai''.'
    note: O extindere directă și explicită a modelului de acord al prezentului habitual, deja cunoscut, aplicată unui verb nou și unui substantiv nou (feminin în hindi).
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Recapitulare: din / de la'
    gloss: din / de la
    note: Introdus prima dată în unitatea 9, pentru indicații de orientare, și refolosit aici pentru peronul de la care pleacă trenul.
    example_gloss: Mergi drept de aici.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Trenul pleacă de la peronul 3.
    gloss: Trenul pleacă de la peronul 3.
    note: Combină forma verbală a prezentului habitual din această lecție cu postpoziția „de la”, deja învățată.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Recapitulare: la ce oră'
    gloss: la ce oră
    note: Introdus prima dată în unitatea 4, pentru spunerea orei, și refolosit aici pentru a întreba ora plecării.
    example_gloss: Cât este ceasul?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: La ce oră pleacă trenul?
    gloss: La ce oră pleacă trenul?
    note: Întrebarea „la ce oră” aplicată unei plecări programate, nu orei de acum.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Trenul pleacă la ora 6.
    gloss: Trenul pleacă la ora 6.
    note: Răspunsul firesc, într-o propoziție completă, cu forma de plural *baje* din unitatea 4 (șase nu este excepția *baja*, care se aplică doar pentru ora unu).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Cât costă biletul?
    gloss: Cât costă biletul?
    note: Refolosește întrebarea despre preț *kitne ka/ki* din unitatea 7. *Tikat* este considerat de obicei masculin (*ka*); mulți vorbitori îl folosesc și la feminin (*kitne ki*), ceea ce este de asemenea corect.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Recapitulare: rupii, cincizeci'
    gloss: rupii, cincizeci
    note: Ambele au fost introduse în unitatea 2, pentru prețuri și cantități, și sunt refolosite aici pentru prețul unui bilet.
    example_gloss: Am cincizeci de rupii.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Biletul costă 50 de rupii.
    gloss: Biletul costă 50 de rupii.
    note: Răspunsul firesc, într-o propoziție completă, la întrebarea despre preț de mai sus.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Noi, nouă
    gloss: noi, nouă / pentru noi
    note: '''Hum'' (noi) a fost introdus în unitatea 11 ca primul pronume de persoana I plural al cursului; ''hamein'' este forma sa de dativ, necesară aici pentru dialogul despre o călătorie în comun.'
    example_gloss:
    - Noi suntem bine.
    - Trebuie să mergem la gară.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: al patrulea pronume la dativ'
    gloss: '''Hamein'' este forma de dativ a lui ''hum'' (unitatea 11), ca ''mujhe'' (main) și ''tumhein'' (tum). Și aici, cu ''jana'', ''hai'' rămâne neschimbat și nu devine ''hain'' -- nu se acordă cu ''hum''/''hamein''.'
    note: Numește cele trei pronume la dativ de până acum, cu numărul unității, înainte de al patrulea, și reia observația din prima notă de gramatică a lecției privind acordul lui „hai” cu verbul.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Trebuie să mergem la gară.
    gloss: Trebuie să mergem la gară.
    note: Construcția obligației cu noul pronume la dativ plural.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Recapitulare: de / al (feminin)'
    gloss: de / al (marcă a posesiei, feminin)
    note: Introdus prima dată în unitatea 7, alături de *ka*/*kitne*, și refolosit aici deoarece „trenul” este feminin în hindi, deci forma posesivă este 'ki', nu 'ka'.
    example_gloss: Acesta este trenul de Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun spune că trebuie să meargă
    gloss: Priya, trebuie să mergem la gară.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya are nevoie de un bilet pentru Delhi
    gloss: Bine. Am nevoie de un bilet pentru Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun întreabă prețul
    gloss: Și eu. Cât costă biletul?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya spune prețul
    gloss: Biletul costă 50 de rupii.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun întreabă ora plecării
    gloss: Bine. La ce oră pleacă trenul?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya spune ora și peronul
    gloss: Trenul pleacă la ora 6, de la peronul 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun a înțeles și spune să plecăm
    gloss: Am înțeles. Hai să mergem!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya este de acord
    gloss: Hai să mergem!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale unității: (1) ''mujhe/tumhein/hamein + verb + hai'' înseamnă „trebuie să ___”; (2) ''X kitne ka/ki hai?'' întreabă prețul; (3) ''X [oră] baje [loc] se jaati hai'' spune ora și locul plecării.'
    note: Un rezumat final care leagă gramatica întregii unități, ca nota de gramatică a unității 14, care reunea paradigmele.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Citirea unui bilet
    gloss: 'Bilet: Delhi. Peronul numărul 3. Ora 6.'
    note: Un text scurt, fragmentar, ca de pe un bilet (fără propoziții complete, așa cum arată un bilet real), care reia exact faptele din dialog, fără informații noi.
    glosses:
      टिकट: bilet
      प्लेटफ़ॉर्म: peron
      नंबर: număr
      बजे: ora
