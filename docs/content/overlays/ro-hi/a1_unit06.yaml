units:
  hi.a1.unit06.food:
    title: Mâncare și băutură
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: Aș dori...
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: Mâncare și cantități
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
