teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Mâncare
    gloss: mâncare, masă
    note: Cuvântul general pentru mâncare, folosit în toată această unitate.
    example_gloss: Mâncarea mea este gata acum.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Ceai, cafea
    gloss: ceai, cafea
    note: Două băuturi obișnuite, folosite în toată această unitate pentru a exersa structura *mujhe ... chahiye*.
    example_gloss:
    - Aș dori un ceai.
    - Aș dori o cafea.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Apă, suc
    gloss: apă, suc
    note: Încă două băuturi obișnuite; nu e nevoie de acord în gen, deoarece *chahiye* este invariabil.
    example_gloss:
    - Aș dori apă.
    - Aș dori suc.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* înseamnă „aș dori ...”. Nu se schimbă după genul vorbitorului (spre deosebire de *chahta/chahti*) și nu este urmat niciodată de *hai*.'
    note: Punctul gramatical central al unității -- o greșeală foarte frecventă a cursanților este să adauge *hai* după *chahiye*, deoarece aproape toate celelalte propoziții învățate până acum se termină așa. *Chahiye* este deja un predicat complet de unul singur.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Ce doriți? (formal)
    gloss: Ce doriți?
    note: Întrebarea formală, cu *aap*, pe care o folosește un chelner sau o gazdă când se adresează politicos cuiva.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Ce vrei? (informal)
    gloss: Ce doriți?
    note: Pronumele în dativ pentru registrul informal cu *tum*, paralel cu *mujhe* și cu *tumhara/tumhari* din unitatea 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Aș dori un ceai, mulțumesc
    gloss: Aș dori un ceai, mulțumesc.
    note: Un răspuns firesc și politicos la comandă, care reia *shukriya* din unitățile anterioare.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Foarte
    gloss: foarte, mult
    note: Un intensificator frecvent, folosit în toată unitatea pentru a descrie mâncarea și băuturile.
    example_gloss: Ceaiul acesta este foarte bun.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Delicios
    gloss: delicios, gustos
    note: Un cuvânt util pentru a reacționa la mâncare -- vezi nota de gramatică din lecția 3 a acestei unități despre motivul pentru care nu se schimbă niciodată după gen.
    example_gloss: Mâncarea aceasta este foarte delicioasă.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Lipie, orez
    gloss: lipie, orez
    note: Două alimente de bază ale unei mese indiene obișnuite.
    example_gloss:
    - Aș dori lipie.
    - Aș dori orez.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Preparat din legume, linte
    gloss: preparat din legume, linte (dal)
    note: Încă două preparate de bază, care se mănâncă de obicei împreună cu roti și orez.
    example_gloss:
    - Aș dori preparatul din legume.
    - Aș dori linte.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Ceașcă, pahar, farfurie
    gloss: ceașcă, pahar, farfurie
    note: Recipiente obișnuite, folosite împreună cu *ek* („unu/un”) pentru a preciza cantitatea când comanzi.
    example_gloss:
    - Aș dori o ceașcă de ceai.
    - Aș dori un pahar cu apă.
    - Aș dori o farfurie de orez.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Vă rog
    gloss: vă rog
    note: Un cuvânt simplu de politețe pentru o cerere. Apare cel mai des la început (*kripya mujhe ...*), dar îl vei auzi și adăugat la sfârșit.
    example_gloss: Aș dori o ceașcă de ceai, vă rog.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Altceva?
    gloss: Altceva? / Doriți ceva în plus?
    note: Întrebarea firească pe care o pune un chelner după ce a luat o parte din comandă.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Nu, atât, mulțumesc
    gloss: Nu, asta e tot, mulțumesc.
    note: O modalitate firească și politicoasă de a încheia o comandă, care reia *nahin* și *shukriya* din unitățile anterioare.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Mâncarea aceasta de legume este foarte gustoasă
    gloss: Mâncarea aceasta de legume este foarte gustoasă.
    note: Reia cuvintele *bahut* și *swadisht* din această unitate cu un substantiv nou despre mâncare, pregătind nota de gramatică din lecția 3 despre faptul că *swadisht* nu se schimbă după gen.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Hai să mâncăm ceva!
    gloss: Hai să mâncăm ceva!
    note: Un mod prietenos și fix de a propune să mâncați împreună; deschide dialogul final al unității.
  hi.a1.unit06.lesson03.teach.ya:
    title: Sau
    gloss: sau
    note: Un cuvânt simplu de legătură, folosit pentru a oferi o alegere între două lucruri.
    example_gloss: Vrei ceai sau cafea?
  hi.a1.unit06.lesson03.teach.haan:
    title: Da
    gloss: da
    note: Un răspuns afirmativ simplu, reluat în dialogul final al unității.
    example_gloss: Da, aș vrea un ceai.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht nu se schimbă
    gloss: '*Swadisht* rămâne la fel atât cu cuvinte masculine, cât și cu cele feminine -- nu se schimbă ca *achha/achhi*.'
    note: 'O excepție importantă: spre deosebire de adjectivele care se acordă, deja învățate (achha/achhi, bada/badi, mera/meri), adjectivele terminate în consoană, precum *swadisht*, nu se flexionează după gen.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Bine, ne vedem din nou
    gloss: Bine! Ne vedem mai târziu.
    note: O formulă prietenoasă de încheiere, reluată din vocabularul de rămas-bun din unitățile anterioare.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Bine, ne vedem curând
    gloss: Bine, ne vedem curând!
    note: Răspunsul informal la formula de încheiere de mai sus, în ton cu schimburile de replici finale din unitățile anterioare.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun propune să mănânce
    gloss: 'Arjun spune: hai să mâncăm ceva.'
    note: Reia fraza de început a acestei unități.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya îl întreabă ce vrea
    gloss: Priya este de acord și îl întreabă pe Arjun ce ar dori.
    note: Reia întrebarea informală *tumhein kya chahiye* din lecția 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun comandă mâncare
    gloss: Arjun spune că ar dori o farfurie de roti și de mâncare de legume.
    note: Combină substantivele despre mâncare din această unitate, structura cu recipient *ek plate* și *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya oferă o alegere de băuturi
    gloss: Priya spune „bine” și îl întreabă pe Arjun dacă ar dori ceai sau cafea.
    note: Folosește cuvântul *ya* din această unitate pentru a oferi o alegere între două băuturi.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun alege cafeaua
    gloss: Arjun spune că ar dori o cafea, te rog.
    note: Reia cuvântul *kripya* din lecția 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya comentează mâncarea
    gloss: Priya spune „bine” și că mâncarea aceasta este foarte gustoasă.
    note: Reia expresia *bahut swadisht* din lecția 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun este de acord
    gloss: Arjun spune „da” și mulțumește foarte mult.
    note: Reia cuvintele *haan* și *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya încheie conversația
    gloss: Priya spune „bine, ne vedem mai târziu”.
    note: Reia fraza de încheiere din această lecție.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun răspunde
    gloss: Arjun este de acord și spune „ne vedem curând”.
    note: Reia fraza de răspuns din această lecție.
