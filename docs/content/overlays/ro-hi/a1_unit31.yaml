teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*लंबा* și *छोटा* descriu înălțimea și merg de obicei cu *कद* („înălțime”): *नेहा का कद लंबा है*. Se termină în *-ा* pentru un substantiv masculin și în *-ी* pentru unul feminin.'
    example_gloss:
    - Neha este înaltă.
    - Vikram este scund.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: '*बूढ़ा* și *जवान* descriu cât de în vârstă pare cineva, fără a da un număr.'
    example_gloss:
    - Bunicul este bătrân.
    - Arjun este tânăr.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र și बूढ़ा
    gloss: Câți ani ai? Bunicul este bătrân.
    note: Pentru a întreba vârsta exactă, hindi folosește *उम्र* („vârstă”), în timp ce *बूढ़ा* descrie o persoană în vârstă, fără număr.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha este înaltă, iar Vikram este scund
    gloss: Neha este înaltă, iar Vikram este scund.
    note: '*और* („și”) leagă cele două descrieri, iar fiecare *का कद* se acordă cu substantivul masculin *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Părul
    gloss: părul
    note: '*बाल* („păr”) este în hindi substantiv masculin plural, deci cuvintele care îl descriu se termină în *-े*: *लंबे बाल*.'
    example_gloss: Arjun are părul scurt și negru.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, brun și alb
    gloss: blond / brun / alb
    note: 'Trei culori ale părului: *सुनहरे*, *भूरे* și *सफ़ेद*; înaintea lui *बाल* se termină în *-े*.'
    example_gloss:
    - Priya are părul blond.
    - Vikram are părul brun.
    - Bunicul are părul alb.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*लंबे* („lung”) și *छोटे* („scurt”) descriu părul și se termină în *-े* pentru că *बाल* este la plural.'
    example_gloss:
    - Neha are părul lung.
    - Vikram are părul scurt.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Adjective înaintea lui बाल
    gloss: Păr lung, păr scurt, păr blond, păr brun, păr alb, păr negru.
    note: '*बाल* este masculin plural, deci adjectivul dinaintea lui se termină în *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: al lui sau al ei'
    gloss: Părul lui sau părul ei este lung.
    note: '*उसके* înseamnă și „al lui”, și „al ei”, deci doar contextul arată care e sensul; aici se acordă cu pluralul *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun are părul scurt și negru
    gloss: Arjun are părul scurt și negru.
    note: '*काले* apare din nou, acum pentru păr, și se termină în *-े* pentru că *बाल* este la plural.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya are părul lung și blond
    gloss: Priya are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Ochii
    gloss: ochii
    note: '*आँखें* („ochi”) este un substantiv feminin plural; singularul este *आँख*.'
    example_gloss: Arjun are ochii căprui.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: 'Trei culori ale ochilor: *नीला*, *भूरा* și *हरा*; înaintea lui *आँखें*, care e feminin, devin *नीली*, *भूरी* și *हरी*.'
    example_gloss:
    - Priya are ochii albaștri.
    - Vikram are ochii căprui.
    - Neha are ochii verzi.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Adjective înaintea lui आँखें
    gloss: Ochi albaștri, ochi căprui, ochi verzi.
    note: '*आँखें* este feminin, deci adjectivul dinaintea lui se termină în *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Cum arată Priya?
    gloss: Cum arată Priya?
    note: '*कैसी दिखती है?* („cum arată ea?”) este întrebarea de bază: *कैसी* și *दिखती* sunt la feminin pentru o femeie, iar *कैसा* și *दिखता* sunt la masculin pentru un bărbat.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya are părul lung și blond și ochii albaștri
    gloss: Priya are părul lung și blond și ochii albaștri.
    note: 'Un răspuns model: părul și ochii sunt legați cu *और*. Posesorul primește *के* pentru pluralul *बाल* și *की* pentru femininul *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya o prezintă pe Nina
    gloss: 'Priya: O fată nouă vine la cafeneaua de limbi. O cheamă Nina.'
    note: '*आ रही है* („vine”) introduce pe cineva nou, iar *उसका नाम ... है* spune numele.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun întreabă cum arată ea
    gloss: 'Arjun: Bine! Cum arată?'
    note: '*वह देखने में कैसी है?* întreabă „cum arată la vedere”; *वह* înseamnă și „el”, și „ea”.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya descrie înălțimea și părul Ninei
    gloss: 'Priya: Este scundă și are părul scurt și blond.'
    note: 'Aici se leagă înălțimea și părul: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun întreabă despre ochii ei
    gloss: 'Arjun: Și ochii ei?'
    note: '*उसकी आँखें* înseamnă „ochii ei”; *उसकी* este la feminin pentru a se acorda cu *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya descrie ochii Ninei
    gloss: 'Priya: Are ochii verzi.'
    note: '*हरी* se termină în *-ी* pentru că *आँखें* este feminin.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun o va recunoaște
    gloss: 'Arjun: Mulțumesc! Atunci o voi recunoaște.'
    note: '*पहचान लूँगा* („voi recunoaște”) este viitorul verbului *पहचानना*, iar *उसे* înseamnă „pe ea”.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Comparația dintre Vikram și Neha
    gloss: Vikram și Neha sunt frate și soră, dar arată diferit. Vikram este scund și are părul scurt și brun și ochii căprui. Neha este mai înaltă decât Vikram și are părul lung și brun și ochii verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      भाई: frate
      बहन: soră
      दिखते: a arăta
      अलग: diferit
      छोटा: scund
      छोटे: scund
      भूरे: castaniu
      बाल: păr
      भूरी: castaniu
      आँखें: ochi
      लंबी: mai înalt
      लंबे: lung
      हरी: verde
      कैसे: cum (ca în „cum arăți”)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Comparația cu से
    gloss: Vikram este mai scund decât Neha.
    note: '*से* înseamnă aici „decât” și se pune după persoana cu care se compară: *नेहा से छोटा*, iar adjectivul stă chiar înaintea verbului.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha are părul mai lung decât Vikram
    gloss: Neha are părul mai lung decât Vikram.
    note: '*लंबे* se acordă cu pluralul *बाल*, iar *विक्रम से* exprimă comparația.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: '*मेरे बाल छोटे और भूरे हैं* („părul meu este scurt și brun”) este o propoziție model pentru a te descrie pe tine; *मेरे* se acordă cu pluralul *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun o zărește pe Nina
    gloss: 'Arjun: Uite, ea este Nina? Are părul scurt și blond și ochii verzi.'
    note: '*देखो* („uită-te”) este imperativul informal, adresat unui prieten.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya confirmă
    gloss: 'Priya: Da, ea este Nina!'
    note: O confirmare scurtă și naturală.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina îl salută pe Arjun
    gloss: 'Nina: Salut, ești Arjun?'
    note: '*क्या तुम अर्जुन हो?* este o întrebare simplă, informală, adresată cuiva de aceeași vârstă cu tine.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun o salută la rândul lui pe Nina
    gloss: 'Arjun: Da! Încântat de cunoștință, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* este formula obișnuită când cunoști pe cineva pentru prima dată; în hindi, sentimentul „se întâmplă” cuiva, așa că nu este nevoie de cuvântul pentru „eu”.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Arjun a recunoscut-o pe Nina după descrierea făcută mai devreme de Priya.'
