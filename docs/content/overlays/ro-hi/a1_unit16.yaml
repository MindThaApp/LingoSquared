teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Recapitulare: tu, bine, ești'
    gloss: tu (informal), bine / în regulă, ești
    note: O scurtă recapitulare a cuvintelor necesare pentru a întreba un prieten cum se simte.
    example_gloss: Ce mai faci?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Recapitulare: mie, este'
    gloss: mie / pentru mine, este
    note: Verbul copulativ necesar pentru construcția simptomelor din această lecție.
    example_gloss: Am de lucru.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Ești bine?
    gloss: Ești bine?
    note: Întrebarea cu care începe unitatea, folosită pentru a vedea cum se simte un prieten.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Recapitulare: eu, sunt, nu'
    gloss: eu, sunt, nu
    note: Necesar pentru a răspunde negativ la „Ești bine?”.
    example_gloss: Sunt bine.
  hi.a1.unit16.lesson01.teach.sir:
    title: Capul
    gloss: cap
    note: Un substantiv nou, necesar pentru primul simptom al unității.
    example_gloss: Capul meu este mare.
  hi.a1.unit16.lesson01.teach.dard:
    title: Durere
    gloss: durere
    note: Un substantiv nou. Combinat cu o parte a corpului, denumește o durere anume -- vezi nota de gramatică a acestei unități.
    example_gloss: Am dureri.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Am dureri de cap.
    gloss: Mă doare capul.
    note: Prima propoziție completă despre un simptom din această unitate.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + simptom + hai
    gloss: '''Mujhe + substantiv + hai'' a fost învățat deja în unitatea 11 (''mujhe kaam hai'' = am de lucru). Acum se folosește și pentru simptome: ''mujhe sir dard hai'' înseamnă ''am dureri de cap'' -- ''sir dard'' (sir = cap, dard = durere) formează împreună „durerea de cap”. Nu este o gramatică nouă, ci același tipar ca înainte.'
    note: A doua utilizare a tiparului deja învățat (dativ + substantiv + hai), din unitatea 11, aplicat acum simptomelor.
    target_text: '''मुझे + संज्ञा + है'' a fost învățat mai devreme, în unitatea 11 (''मुझे काम है'' = Am de lucru). Acum se folosește și pentru a spune simptome: ''मुझे सिर दर्द है'' înseamnă „Am dureri de cap” -- ''सिर दर्द'' (सिर = cap, दर्द = durere) împreună formează „durere de cap”. Nu este o gramatică nouă, ci același tipar vechi.'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Febră
    gloss: febră
    note: Un substantiv nou, al doilea simptom al acestei unități.
    example_gloss: Ai febră?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Am febră.
    gloss: Am febră.
    note: Același tipar dativ + substantiv + hai, aplicat celui de-al doilea simptom al lecției.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Recapitulare: ție, a merge'
    gloss: ție / pentru tine, a merge
    note: Ambele au fost învățate deja (unitatea 6 și unitatea 15) -- sunt reluate aici pentru a vorbi despre mersul la doctor.
    example_gloss:
    - Ce ai dori?
    - Trebuie să merg la gară.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Recapitulare: lângă / la'
    gloss: lângă / la (un loc)
    note: Învățat prima dată în unitatea 8 -- reluat aici, cu un al treilea sens în nota de gramatică a acestei lecții.
    example_gloss: Banca este lângă școală.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Medic
    gloss: doctor
    note: Un substantiv nou, tema principală a acestei lecții.
    example_gloss: Doctorul este bun.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Trebuie să merg la doctor.
    gloss: Trebuie să merg la doctor.
    note: Combină *ke paas* cu construcția obligației *mujhe...jana hai* din unitatea 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: al treilea sens'
    gloss: 'Primele două sensuri ale lui ''ke paas'' au fost învățate mai devreme -- aproape de (unitatea 8: ''bank school ke paas hai'') și posesia (unitatea 2: ''mere paas ek kitab hai''). Acum apare a treia utilizare: a merge la o PERSOANĂ, adică a o vizita -- ''doctor ke paas jana hai'' înseamnă ''trebuie să merg la doctor''. Este reluat și tiparul ''mujhe...jana hai'' din unitatea 15.'
    note: Amintește ambele sensuri anterioare, cu numărul unității, înainte de al treilea, și reia construcția obligației din unitatea 15.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Odihnă
    gloss: odihnă
    note: Un substantiv nou, primul sfat din această unitate.
    example_gloss: Am nevoie de odihnă.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Recapitulare: vreau / am nevoie'
    gloss: vreau / am nevoie de
    note: Învățat prima dată în unitatea 6, reluat aici pentru a spune de ce are cineva nevoie.
    example_gloss: Aș vrea un ceai.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Ai nevoie de odihnă.
    gloss: Ai nevoie de odihnă.
    note: Tiparul deja cunoscut *tumhein...chahiye*, aplicat noului substantiv din această lecție.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Medicament
    gloss: medicament
    note: Un substantiv nou, al doilea sfat din această unitate.
    example_gloss: Am nevoie de medicament.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Ai nevoie de medicament.
    gloss: Ai nevoie de medicament.
    note: Același tipar cu *chahiye*, aplicat medicamentului.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Recapitulare: mergi!, și'
    gloss: mergi!, și
    note: Ambele au fost învățate deja (unitatea 9 și unitatea 1/2) -- sunt reluate aici pentru a lega două sfaturi.
    example_gloss:
    - Mergi drept înainte.
    - Aș vrea un ceai și o cafea.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: regula imperativului în -o, reluată'
    gloss: '''Karo'' urmează aceeași regulă a imperativului cu tum, învățată mai devreme (''jao'', ''muro'', ''batao'', ''gino'' -- toate se termină în ''-o''). Aici se formează de la ''karna'' (din ''maaf karna'', unitatea 11): tema ''kar'' + ''-o'' dă ''karo'', adică „fă!”. ''Aaraam karo'' înseamnă „Odihnește-te!”'
    note: O extindere directă a regulii imperativului deja învățate, aplicată unui verb pe care îl cunoști deja la infinitiv.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Odihnește-te!
    gloss: Odihnește-te!
    note: Noul imperativ, aplicat primului sfat din această unitate.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Odihnește-te și mergi la doctor.
    gloss: Odihnește-te și mergi la doctor.
    note: Îmbină cele două sfaturi ale lecției într-o singură indicație firească și anunță cardul de citire din lecția 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya îl întreabă pe Arjun dacă se simte bine
    gloss: Arjun, ești bine?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun spune că are dureri de cap și febră
    gloss: Nu, am dureri de cap și febră.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya spune că el are nevoie de odihnă
    gloss: Nu e bine. Ai nevoie de odihnă.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun are nevoie și de medicament
    gloss: Da, dar am nevoie și de medicament.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya spune că el trebuie să meargă la doctor
    gloss: Bine. Trebuie să mergi la doctor.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun îi mulțumește Priyei
    gloss: Bine, mulțumesc.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya îi spune să se odihnească
    gloss: Odihnește-te!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun este de acord
    gloss: Bine.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale unității: (1) ''mujhe/tumhein + simptom + hai'' exprimă o problemă de sănătate (de ex. ''mujhe bukhar hai''); (2) ''tumhein/mujhe + lucru + chahiye'' exprimă o nevoie (de ex. ''tumhein aaraam chahiye''); (3) ''X ke paas jana hai'' arată la cine trebuie să mergi (de ex. ''doctor ke paas jana hai'').'
    note: Un rezumat final care leagă toată gramatica unității, ca nota de gramatică de la sfârșitul unității 15.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Citim câteva sfaturi
    gloss: Odihnește-te. Mergi la doctor.
    note: O indicație scurtă și directă, ca în sfaturile spuse în viața reală, care reia exact faptele din dialog, fără nimic nou.
    glosses:
      आराम: a se odihni
      करो: fă (imperativ, de la करना)
      डॉक्टर: doctor
      जाओ: mergi (imperativ, de la जाना)
