teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby: *lesen* (czytać), *Sport treiben* (uprawiać sport) i *kochen* (gotować). Sport to rzeczownik, dlatego piszemy go wielką literą.'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Czas wolny
    gloss: czas wolny
    note: '*Die Freizeit* to rzeczownik rodzaju żeńskiego: zawsze ucz się go z rodzajnikiem die. To słowo kluczowe, gdy mówisz o hobby.'
    example_gloss: W wolnym czasie lubię czytać.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Lese* to forma ich czasownika *lesen* (czytać). Zdanie zaczyna się okolicznikiem czasu, więc czasownik nadal stoi na drugim miejscu: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Jeszcze trzy zwroty o hobby: *Musik hören* (słuchać muzyki), *zeichnen* (rysować) i *Videospiele spielen* (grać w gry wideo). Musik i Videospiele to rzeczowniki, więc piszemy je wielką literą.'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: 'Po niemiecku mówi się *Musik hören* bez przyimka: czasownik hören łączy się z muzyką bezpośrednio, podobnie jak w polskim „słuchać muzyki” po czasowniku nie ma żadnego dodatkowego słowa.'
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: '*Mit Freunden* (z przyjaciółmi): po mit zawsze stoi celownik (Dativ), dlatego Freunde zmienia się w Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: 'Cztery podstawowe przysłówki częstotliwości: immer, oft, manchmal, nie. Zwykle stoją zaraz po czasowniku: ich spiele nie.'
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*Jede Woche* i *jedes Wochenende* znaczą „każdy”, ale końcówka zmienia się zależnie od rodzaju rzeczownika: zobacz następną kartę.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede czy jedes
    gloss: Die Woche jest rodzaju żeńskiego, więc mówimy jede Woche. Das Wochenende jest rodzaju nijakiego, więc mówimy jedes Wochenende.
    note: '*Woche* jest rodzaju żeńskiego (*die Woche*), więc występuje z *jede*; *Wochenende* jest rodzaju nijakiego (*das Wochenende*), więc występuje z *jedes*. Ucz się każdego rzeczownika z rodzajnikiem, a będziesz znać końcówkę.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna zaczyna rozmowę o hobby
    gloss: 'Anna: Często razem chodzimy na spacery. A co jeszcze robisz w wolnym czasie, Felix?'
    note: '*Wir gehen oft zusammen spazieren* zawiera gehen i drugi czasownik: odmieniony gehen stoi na drugim miejscu, a bezokolicznik spazieren idzie na koniec.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Hobby Felixa
    gloss: 'Felix: Lubię gotować, także w domu. I często uprawiam sport.'
    note: '*Auch zu Hause* (także w domu) wyjaśnia, że Felix gotuje dla przyjemności, a nie tylko w pracy w restauracji.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna jest zaskoczona
    gloss: 'Anna: Gotujesz też w domu? Przecież w pracy gotujesz już cały dzień!'
    note: '*Den ganzen Tag* (cały dzień) stoi w bierniku (Akkusativ), dlatego der Tag zmienia się w den Tag. Okresy czasu tego rodzaju wymagają biernika.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix wyjaśnia
    gloss: 'Felix: Tak, ale gotowanie uważam za relaksujące. A ty, co lubisz robić?'
    note: W zdaniu *Kochen finde ich entspannend* na początku stoi Kochen dla podkreślenia. Czasownik nadal jest na drugim miejscu, więc ich przesuwa się za niego.
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Hobby Anny
    gloss: 'Anna: Lubię czytać i często słucham muzyki.'
    note: Łączy dwa czasowniki o hobby z lekcji 01–02 w jednym zdaniu za pomocą *und* (i).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix pyta o gry
    gloss: 'Felix: A grasz też w gry wideo?'
    note: 'Krótkie pytanie rozstrzygnięcia (tak/nie): czasownik stoi na początku, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Odpowiedź Anny
    gloss: 'Anna: Nie, nigdy nie gram w gry wideo. Ale czasami rysuję!'
    note: '*Nie* (nigdy) i *manchmal* (czasami) z lekcji 03, zestawione w jednej odpowiedzi. Oba stoją zaraz po czasowniku.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Porównujemy hobby
    gloss: Felix i ja często razem chodzimy na spacery. Ale mamy też inne hobby. Felix lubi gotować, także w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasami rysuję, ale nigdy nie gram w gry wideo. Co ty lubisz robić w wolnym czasie?
    note: Wiadomość Anny podsumowuje fakty z lekcji 04 i kończy się głównym pytaniem tej lekcji, skierowanym do czytelnika.
    glosses:
      spazieren: spacerować
      oft: często
      zusammen: razem
      andere: inne
      kocht: gotuje
      gern: chętnie
      Hause: w domu
      Sport: uprawia (sport)
      lese: czytam
      höre: słucham
      Musik: muzyka
      zeichne: rysuję
      manchmal: czasami
      spiele: gram w gry wideo
      nie: nigdy
      freien: wolny
      Zeit: czas
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix pyta o weekend
    gloss: 'Felix: Co robisz w ten weekend?'
    note: '*Dieses Wochenende* (w ten weekend) ma końcówkę rodzaju nijakiego -es, ponieważ das Wochenende jest rodzaju nijakiego.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna się waha
    gloss: 'Anna: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść na dwór.'
    note: '*Nach draußen* (na zewnątrz, dosłownie „na zewnątrz”) to częsty sposób, by powiedzieć, że chcesz wyjść z domu.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix proponuje plan
    gloss: 'Felix: Pójdziemy razem na spacer? Potem ugotuję dla nas.'
    note: '*Danach* (potem) stoi na początku, więc czasownik jest zaraz za nim, a podmiot dopiero po nim: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna się zgadza
    gloss: 'Anna: Dobry pomysł! Lubię chodzić na spacery i lubię też gotować.'
    note: '*Gern* po czasowniku pokazuje, że coś lubisz robić: ich gehe gern spazieren, ich koche gern. Pasuje do prawie każdego czasownika.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix potwierdza
    gloss: 'Felix: Świetnie. W takim razie widzimy się w sobotę!'
    note: 'Przyjazne zakończenie, potwierdzające plan na *Samstag* (sobotę). Dni tygodnia łączą się z *am*: am Samstag.'
