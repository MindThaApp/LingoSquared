teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: cześć
    note: '*Hallo* to swobodne, uniwersalne powitanie, którego możesz użyć o każdej porze dnia, podobnie jak polskiego „cześć”.'
    example_gloss: Cześć, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: dzień dobry (rano)
    note: '*Guten Morgen* mówi się rano, mniej więcej do późnego przedpołudnia.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: dzień dobry
    note: '*Guten Tag* to standardowe, nieco bardziej formalne powitanie w ciągu dnia, od późnego przedpołudnia przez całe popołudnie.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: dobry wieczór
    note: '*Guten Abend* mówi się, gdy wieczorem dokądś przychodzisz. To powitanie, a nie pożegnanie.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: pa
    note: '*Tschüss* to swobodne, bardzo częste pożegnanie wśród przyjaciół i znajomych.'
    example_gloss: Pa, do zobaczenia wkrótce!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: do widzenia
    note: '*Auf Wiedersehen* dosłownie znaczy „do ponownego zobaczenia”. To standardowe, bardziej formalne pożegnanie, odpowiednie wobec nieznajomych lub w sytuacjach służbowych.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: do zobaczenia wkrótce
    note: '*Bis bald* to przyjazne pożegnanie, gdy spodziewasz się wkrótce znów zobaczyć tę osobę.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: do zobaczenia później
    note: '*Bis später* mówisz, gdy zobaczysz tę osobę jeszcze tego samego dnia.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: dobranoc
    note: '*Gute Nacht* mówi się, gdy ktoś idzie spać lub kończy dzień. W przeciwieństwie do *Guten Abend* to pożegnanie, nie powitanie.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: Pan / Pani / Państwo
    note: '*Sie* to forma grzecznościowa „Pan/Pani”, pisana wielką literą także w środku zdania. Używa się jej wobec nieznajomych, osób starszych i w sytuacjach formalnych lub służbowych. W niemieckim ta forma ma postać odrębnej zaimkowej formy czasownika w 3. osobie liczby mnogiej, inaczej niż w polskim, gdzie mówi się „proszę Pana”.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: ty
    note: '*du* to nieformalne „ty”, używane wobec przyjaciół, rodziny i dzieci. Zwrócenie się per *du* do obcej osoby może zabrzmieć zbyt poufale, a nawet niegrzecznie.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Jak się Pan/Pani miewa?
    note: Formalny sposób zapytania, jak się ktoś czuje. *Ihnen* to formalny celownik od „Pan/Pani”, pasujący do formy *Sie*.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Co słychać? / Jak leci?
    note: '*Wie geht''s* to skrócona forma *Wie geht es*. To codzienny, nieformalny sposób zapytania, jak się ktoś ma.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Dobrze, dziękuję.
    note: Prosta, neutralna odpowiedź, której możesz użyć w obu rejestrach.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Bardzo dobrze, dziękuję.
    note: Bardziej entuzjastyczna odpowiedź niż *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: A Panu/Pani?
    note: Formalny sposób zwrócenia pytania, pasujący do formy *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: A tobie?
    note: Nieformalny sposób zwrócenia pytania. *dir* to nieformalny celownik od „ty”, pasujący do formy *du*.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: dzięki / dziękuję
    note: '*Danke* pojawiło się już we wcześniejszych odpowiedziach. Tutaj jest samodzielnym słowem.'
    example_gloss: Bardzo dziękuję!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: proszę / nie ma za co
    note: '*Bitte* ma dwa częste znaczenia zależnie od kontekstu: „proszę”, gdy o coś prosisz, albo „nie ma za co”, gdy odpowiadasz na podziękowanie. Kontekst podpowiada, o które chodzi. To nie przypadek ani błąd, oba użycia są w pełni poprawne.'
    example_gloss:
    - Poproszę kawę.
    - Bardzo proszę! / Nie ma za co!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: przepraszam
    note: '*Entschuldigung* mówi się zarówno po to, by uprzejmie zwrócić czyjąś uwagę, jak i by krótko przeprosić.'
    example_gloss: Przepraszam, gdzie jest toaleta?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: nie ma problemu
    note: Swobodna, przyjazna odpowiedź, podobna w tonie do polskiego „nie ma problemu”.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: nie ma za co
    note: Pełniejszy, bardziej wyraźny sposób powiedzenia „nie ma za co” niż krótkie *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna wita Felixa
    gloss: 'Anna mówi: Dzień dobry!'
    note: Anna i Felix poznają się jako sąsiedzi w bloku.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix odwzajemnia powitanie i pyta, jak się miewa
    gloss: 'Felix mówi: Dzień dobry! Jak się Pani miewa?'
    note: Felix używa formy grzecznościowej *Sie*, bo dopiero się poznali.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna odpowiada i pyta nawzajem
    gloss: 'Anna mówi: Dziękuję, dobrze. A Panu?'
    note: Anna odpowiada i zwraca pytanie w formie grzecznościowej, tak jak Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix odpowiada
    gloss: 'Felix mówi: Bardzo dobrze, dziękuję.'
    note: Nieco bardziej entuzjastyczna odpowiedź niż zwykłe *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna żegna się
    gloss: 'Anna mówi: Do widzenia!'
    note: Anna używa bardziej formalnego pożegnania, zgodnie z formą *Sie*, której używali przez całą rozmowę.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix żegna się i mówi „do zobaczenia wkrótce”
    gloss: 'Felix mówi: Do widzenia, do zobaczenia wkrótce!'
    note: Felix łączy formalne pożegnanie z „do zobaczenia wkrótce”, zachowując formę *Sie*, której oboje używali podczas tego pierwszego spotkania.
