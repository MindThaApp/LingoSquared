    note: '*Krankenhaus* dosłownie znaczy „dom chorych” – rzeczownik rodzaju nijakiego, *das Krankenhaus*.'
    example_gloss: Mój przyjaciel jest w szpitalu.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: apteka
    note: '*Apotheke* oznacza aptekę – rzeczownik rodzaju żeńskiego, *die Apotheke*.'
    example_gloss: Apteka jest dziś otwarta.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: park
    note: '*Park* oznacza park – rzeczownik rodzaju męskiego, *der Park*.'
    example_gloss: Lubimy spacerować po parku.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: restauracja
    note: '*Restaurant* oznacza restaurację – rzeczownik rodzaju nijakiego, *das Restaurant*.'
    example_gloss: W tej restauracji jest dobre jedzenie.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: Apteka jest obok parku.
    note: '*neben* znaczy „obok”. To przyimek dwukierunkowy – przy określaniu stałego miejsca (jak tutaj) wymaga celownika, więc *der Park* (rodzaj męski) zmienia się w *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: Apteka jest naprzeciwko szpitala.
    note: '*gegenüber von* znaczy „naprzeciwko”. *vom* to standardowe zlanie się *von dem* (celownik rodzaju nijakiego, *das Krankenhaus*), używane zarówno w mowie, jak i w piśmie.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: Apteka jest między bankiem a parkiem.
    note: '*zwischen* znaczy „między”. Zwróć uwagę na obie formy celownika: *der Bank* (rodzaj żeński) i *dem Park* (rodzaj męski).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Restauracja jest za bankiem.
    note: '*hinter* znaczy „za” – *der Bank* to forma celownika rodzaju żeńskiego.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Park jest przed szpitalem.
    note: '*vor* znaczy „przed” – *dem Krankenhaus* to forma celownika rodzaju nijakiego.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Gdzie jest bank?
    note: '*Wo ist...?* to standardowy sposób zapytania, gdzie coś jest.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Jest obok parku.
    note: '*Sie* oznacza tu rzecz, o której mowa (*die Bank*, rodzaj żeński). Wielką literą jest tylko dlatego, że zaczyna zdanie. Czasownik *ist* pokazuje, że nie chodzi o grzecznościowe „Pan/Pani”, które brzmiałoby *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: Czy to daleko stąd?
    note: '*weit* znaczy „daleko”. *es* jest tu ogólnym podmiotem odnoszącym się do sytuacji i nie zależy od rodzaju żadnego konkretnego rzeczownika.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: Nie, to niedaleko.
    note: '*nicht* neguje przysłówek *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Przepraszam, gdzie jest apteka?
    note: '*Entschuldigung* poznałeś(-aś) już wcześniej jako „przepraszam” – tutaj grzecznie otwiera pytanie.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix pyta o drogę
    gloss: 'Felix mówi: Przepraszam, gdzie jest apteka?'
    note: To samo uprzejme otwarcie co w samodzielnej frazie powyżej, tym razem w prawdziwej rozmowie.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna podaje położenie
    gloss: 'Anna mówi: Jest naprzeciwko szpitala.'
    note: Pełna odpowiedź podaje położenie apteki względem znanego punktu orientacyjnego.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix pyta, jak daleko to jest
    gloss: 'Felix mówi: Czy to daleko stąd?'
    note: Naturalne pytanie dodatkowe, gdy znasz już ogólny kierunek.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna odpowiada w sprawie odległości
    gloss: 'Anna mówi: Nie, to niedaleko. Jest między bankiem a parkiem.'
    note: Pełna odpowiedź uspokaja co do odległości, a potem podaje drugi, dokładniejszy punkt orientacyjny.
