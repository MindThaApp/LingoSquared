teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: zero, jeden, dwa, trzy, cztery
    note: Niemieckie cyfry od 0 do 4.
    example_gloss:
    - Mam zero jabłek.
    - Jestem numerem jeden!
    - Mam dwa jabłka.
    - Mam trzy jabłka.
    - Mam cztery jabłka.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: pięć, sześć, siedem, osiem, dziewięć, dziesięć
    note: Niemieckie cyfry od 5 do 10.
    example_gloss:
    - Mam pięć jabłek.
    - Mam sześć jabłek.
    - Mam siedem jabłek.
    - Mam osiem jabłek.
    - Mam dziewięć jabłek.
    - Mam dziesięć jabłek.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: jedenaście, dwanaście
    note: '*elf* i *zwölf* są nieregularne – podobnie jak w polskim „jedenaście” i „dwanaście” nie tworzą wzoru, który obowiązuje od 13 wzwyż.'
    example_gloss:
    - Mój numer domu to jedenaście.
    - Mój numer domu to dwanaście.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: trzynaście, czternaście, piętnaście, szesnaście
    note: 'Od 13 wzwyż niemieckie liczebniki tworzy się z podstawowej cyfry + *-zehn* (po polsku odpowiada temu końcówka -naście; por. angielskie *-teen*). Zwróć uwagę: *sechzehn*, a nie *sechszehn* – głoska *s* wypada.'
    example_gloss:
    - Mój numer domu to trzynaście.
    - Mój numer domu to czternaście.
    - Mój numer domu to piętnaście.
    - Mój numer domu to szesnaście.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: siedemnaście, osiemnaście, dziewiętnaście, dwadzieścia
    note: 'Uwaga: *siebzehn*, a nie *siebenzehn* – przed *-zehn* znika końcówka *-en* z *sieben*.'
    example_gloss:
    - Mój numer domu to siedemnaście.
    - Mój numer domu to osiemnaście.
    - Mój numer domu to dziewiętnaście.
    - Mój numer domu to dwadzieścia.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: trzydzieści, czterdzieści, pięćdziesiąt
    note: 'Uwaga: *dreißig*, a nie *dreizig* – 30 kończy się na *-ßig*, a nie na *-zig* (20, czyli *zwanzig*, też jest nieregularne).'
    example_gloss:
    - To kosztuje trzydzieści euro.
    - To kosztuje czterdzieści euro.
    - To kosztuje pięćdziesiąt euro.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: sześćdziesiąt, siedemdziesiąt, osiemdziesiąt, dziewięćdziesiąt
    note: 'Od 40 wzwyż wzór jest regularny: cyfra + *-zig* (z takimi samymi skróceniami *sech-* i *sieb-* jak w liczbach od 13 do 19).'
    example_gloss:
    - To kosztuje sześćdziesiąt euro.
    - To kosztuje siedemdziesiąt euro.
    - To kosztuje osiemdziesiąt euro.
    - To kosztuje dziewięćdziesiąt euro.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: sto
    note: '*hundert* samo oznacza „sto” – nie potrzeba przed nim *ein* (możliwe jest też *einhundert*, ale w codziennej mowie rzadziej się go używa).'
    example_gloss: To kosztuje sto euro.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: dwadzieścia jeden
    note: 'W niemieckich liczbach złożonych od 21 do 99 kolejność jest odwrotna niż w polskim: najpierw jednostki, potem *und* („i”), potem dziesiątki – wszystko jako JEDNO słowo. *einundzwanzig* = *ein* (jeden) + *und* (i) + *zwanzig* (dwadzieścia), dosłownie „jeden-i-dwadzieścia”.'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: trzydzieści dwa
    note: 'Ten sam wzór: *zwei* (dwa) + *und* + *dreißig* (trzydzieści) = „dwa-i-trzydzieści” = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Ile Pan/Pani ma lat?
    note: '*alt* znaczy „stary” – dosłownie „jak stary jest Pan/Pani”.'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Ile masz lat?
    note: Wersja nieformalna, z użyciem *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Mam dwadzieścia osiem lat.
    note: '*Jahre alt* („lat”) zawsze stoi po liczbie. Po niemiecku wiek podaje się dosłownie: „jestem [liczba] lat stary”, inaczej niż po polsku, gdzie mówimy „mam … lat”.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix pyta Annę o wiek
    gloss: 'Felix mówi: Ile Pani ma lat, jeśli wolno zapytać?'
    note: '*wenn ich fragen darf* („jeśli wolno zapytać”) łagodzi pytanie, które mogłoby zabrzmieć zbyt bezpośrednio – to uprzejmy dodatek, pasujący do ich nadal formalnej formy *Sie*.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna odpowiada i pyta o to samo
    gloss: 'Anna mówi: Mam dwadzieścia osiem lat. A Pan?'
    note: Anna podaje swój wiek i zadaje to samo pytanie z powrotem, tak jak w lekcji 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix odpowiada
    gloss: 'Felix mówi: Mam trzydzieści jeden lat.'
    note: Z tego wynika, że Felix jest o trzy lata starszy od Anny.
