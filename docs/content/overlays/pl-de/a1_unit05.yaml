teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: Która jest godzina?
    note: Dosłownie „Jak późno jest?” – standardowy sposób pytania o godzinę.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Jest trzecia.
    note: '*Uhr* = „godzina” w podawaniu pełnej godziny. Pełne godziny to liczebnik + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Jest wpół do czwartej (3:30).
    note: 'Niemiecki, podobnie jak polski „wpół do czwartej”, nazywa pół godziny od godziny, ku której zmierza: *halb vier* = 3:30, a nie 4:30.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Jest piąta.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Jest kwadrans po trzeciej (3:15).
    note: '*Viertel* = „kwadrans”; *nach* = „po”.'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Jest za kwadrans czwarta (3:45).
    note: '*vor* = „przed, do”.'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Jest dziesięć po czwartej (4:10).
    note: Minuty + *nach* + godzina – tak samo jak po polsku „dziesięć po czwartej”.
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Jest za dziesięć piąta (4:50).
    note: Minuty + *vor* + następna godzina – tak samo jak po polsku „dziesięć do piątej”.
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: rano
    note: '*Morgen* to rzeczownik oznaczający poranek, mniej więcej od 6:00 do 12:00.'
    example_gloss: Dzień dobry, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: południe
    note: '*Mittag* to samo południe, środek dnia między Morgen a Nachmittag.'
    example_gloss: Jest południe.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: popołudnie
    note: '*Nachmittag* obejmuje mniej więcej godziny od 12:00 do 18:00.'
    example_gloss: Pracuję po południu.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: wieczór
    note: '*Abend* obejmuje mniej więcej godziny od 18:00 do 22:00.'
    example_gloss: Dobry wieczór, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: noc
    note: '*Nacht* obejmuje mniej więcej godziny od 22:00 do 6:00.'
    example_gloss: Dobranoc, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: północ
    note: '*Mitternacht* to dokładnie godzina 24:00 / 0 Uhr.'
    example_gloss: Impreza kończy się o północy.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: osiemnaście
    note: '*achtzehn* = 18; tu w zegarze 24-godzinnym, używanym w oficjalnych godzinach otwarcia (achtzehn Uhr = 18:00).'
    example_gloss: Sklep zamyka się o 18:00.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: Sklep otwiera się o dziewiątej rano.
    note: '*um* + godzina = „o” danej godzinie; *morgens* = „rano”.'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: Sklep zamyka się o 18:00.
    note: '*schließt* = „zamyka się”. Oficjalne godziny otwarcia podaje się w systemie 24-godzinnym.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: kiedy
    note: '*Wann* otwiera pytanie o czas.'
    example_gloss: Kiedy przyjdziesz?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: otwiera
    note: '*öffnet* to 3. osoba liczby pojedynczej od *öffnen* (otwierać); *die* to rodzajnik określony rodzaju żeńskiego (i liczby mnogiej), pasujący do *die Bibliothek*.'
    example_gloss: Kiedy otwierają bibliotekę?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteka
    note: '*Bibliothek* to rzeczownik rodzaju żeńskiego (*die Bibliothek*), to samo miejsce, które poznałeś w lekcji 4.'
    example_gloss: Idę do biblioteki.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: ona / ono / oni (małą literą)
    note: Tutaj *sie* to zaimek 3. osoby zastępujący rzeczownik żeński *die Bibliothek* – znaczy „ona”. Nie myl go z *Sie* pisanym wielką literą (formalne „Pan/Pani”), którego używają wobec siebie Anna i Felix.
    example_gloss: Lubię bibliotekę. Często do niej chodzę.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: wtedy
    note: '*dann* występuje tu w pożegnaniu *Bis dann!* („do zobaczenia wtedy!”).'
    example_gloss: Do zobaczenia!
  de.a1.unit05.lesson04.teach.line01:
    title: Felix pyta o bibliotekę
    gloss: 'Felix mówi: Kiedy otwierają bibliotekę?'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna odpowiada
    gloss: 'Anna mówi: Otwierają o dziewiątej rano.'
    note: '*Sie* oznacza tu „ona” – odnosi się do *die Bibliothek*; wielką literą jest tylko dlatego, że stoi na początku zdania.'
  de.a1.unit05.lesson04.teach.line03:
    title: Felix dopytuje
    gloss: 'Felix mówi: A kiedy ją zamykają?'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna odpowiada ponownie
    gloss: 'Anna mówi: Zamykają o osiemnastej.'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix się żegna
    gloss: 'Felix mówi: Dobrze, do zobaczenia!'
  de.a1.unit05.lesson04.teach.schild:
    title: Kartka na drzwiach
    gloss: 'Godziny otwarcia: od 9:00 do 18:00.'
    note: '*Öffnungszeiten* = „godziny otwarcia”; *bis* = „do”.'
