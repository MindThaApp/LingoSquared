  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*Er heißt Pico* używa czasownika *heißen* (nazywać się) z pierwszej lekcji. Er odnosi się do der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix reaguje
    gloss: 'Felix: Jak miło! Co robisz z nim codziennie?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Felix też kocha ptaki
    gloss: 'Felix: Ja też kocham ptaki.'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna kończy rozmowę
    gloss: 'Anna: Fajnie, że my troje kochamy zwierzęta!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
