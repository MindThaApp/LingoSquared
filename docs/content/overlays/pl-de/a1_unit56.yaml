    title: Felix pyta, jak wygląda zwierzę
    gloss: 'Felix: Jak on wygląda?'
    note: 'Znowu pytanie *Wie sieht ... aus?* z lekcji o wyglądzie, tym razem o zwierzę: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
