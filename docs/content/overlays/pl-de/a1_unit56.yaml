  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Tier* to ogólne słowo oznaczające zwierzę; *Haustier* (dosłownie „zwierzę domowe”) oznacza konkretnie zwierzę domowe, czyli pupila.'
    example_gloss:
