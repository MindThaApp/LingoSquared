    title: Anna opisuje swoją rutynę
    gloss: 'Anna: Tak, codziennie z nim wychodzę i daję mu jeść.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena i Jonas o zwierzętach
    gloss: 'Felix i Lena oboje kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Felix kocha psy, a Lena kocha koty. Jonas ma zwierzę domowe: kota. Często bawi się ze swoim kotem i codziennie daje mu jeść. Masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      lieben: kochać
      beide: oboje
      Tiere: zwierzęta
      beiden: oboje
      Haustier: zwierzę domowe
      Hunde: psy
      Katzen: koty
      Katze: kot
      spielt: bawi się
      gibt: daje
      jeden: każdy
      Futter: karma
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas często bawi się ze swoim kotem
    gloss: Jonas często bawi się ze swoim kotem.
    note: '*Oft* stoi zwykle zaraz po czasowniku: Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
