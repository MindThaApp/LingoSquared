  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn przy zwierzętach
    gloss: 'U zwierząt decyduje rodzaj gramatyczny słowa: der Hund to er (on), die Katze to sie (ona).'
    note: 'Niemieckie zaimki zależą od rodzaju gramatycznego rzeczownika: der Hund -> er (biernik: ihn), die Katze -> sie, das Tier -> es.'
