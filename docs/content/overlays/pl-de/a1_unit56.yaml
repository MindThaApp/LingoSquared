  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: 'Ten sam wzór pytania *Hast du ...?* znasz już z wcześniejszych lekcji: czasownik stoi na początku.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: '*Kein* neguje rzeczownik *ein Haustier*: zobacz notatkę gramatyczną.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: negacja rzeczownika'
    gloss: 'Kein neguje rzeczownik, przy którym stałoby ein-: Ich habe einen Hund, ale Ich habe kein Haustier.'
    note: 'W zdaniu przeczącym *kein* zastępuje *ein* i ma takie same końcówki: ein Haustier zmienia się w kein Haustier, einen Hund w keinen Hund. Przy czasownikach i przymiotnikach używasz zamiast tego *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: Czasownik rozdzielnie złożony – zobacz notatkę gramatyczną.
    example_gloss: Codziennie wyprowadzam psa na spacer.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen jest rozdzielne
    gloss: 'Ausführen jest rozdzielne, tak jak aufstehen: ich führe den Hund aus.'
    note: 'Ten sam wzór co przy czasownikach rozdzielnych z codziennej rutyny: odmieniony czasownik + reszta zdania + przedrostek na końcu.'
  de.a1.unit56.lesson02.teach.futter_geben:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Jonas bawi się ze swoim kotem.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: Połączenie *ausführen* z *jeden Tag* (codziennie). *Jeden* ma końcówkę -en, bo Tag jest rodzaju męskiego i stoi w bierniku.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: 'Połączenie *Futter geben* z *jeden Tag*. Zwierzę stoi w celowniku: der Katze (kotu).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Liczba mnoga w niemieckim bywa różna: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Ucz się liczby mnogiej razem z każdym rzeczownikiem.'
    note: 'Pierwsze przykłady liczby mnogiej w niemieckim, na nazwach zwierząt: końcówki -e, -n oraz przegłos.'
