teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: Jak się Pan/Pani nazywa? (oficjalnie)
    note: '*Wie heißen Sie?* dosłownie pyta „jak Pan/Pani się nazywa”, z oficjalnym *Sie* z lekcji 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Nazywam się Anna.
    note: '*heißen* znaczy „nazywać się” – to standardowy sposób podania swojego imienia.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: Jak masz na imię? (nieformalnie)
    note: Wersja nieformalna, z *du* z lekcji 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Nazywam się Felix.
    note: Ta sama konstrukcja co *Ich heiße Anna*, tylko inne imię.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Miło mi.
    note: Krótki, częsty sposób powiedzenia, że miło ci kogoś poznać; pasuje w obu rejestrach.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Wzajemnie. / Mnie również jest miło.
    note: Naturalna odpowiedź na *Freut mich* – dosłownie „w pełni z mojej strony”.
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: ja
    note: '*ich* pisze się małą literą, chyba że stoi na początku zdania (jak w *Ich bin Anna.*) – podobnie jak polskie „ja”.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: ty (nieformalnie)
    note: Poznane już w lekcji 1 – tutaj powtórka jako podmiot pełnego zdania.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Jestem Anna.
    note: '*bin* to forma *ich* czasownika *sein* („być”).'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Jesteś Felix.
    note: '*bist* to forma *du* czasownika *sein*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Niemcy
    note: Nazwy krajów zwykle nie mają w niemieckim rodzajnika – po prostu *Deutschland*, a nie *das Deutschland*.
    example_gloss: Pochodzę z Niemiec.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Anglia
    note: Po niemiecku England to Anglia; słowo czyta się według niemieckiej wymowy.
    example_gloss: Pochodzę z Anglii.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Francja
    note: 'Zwróć uwagę: niemiecka nazwa tego kraju wygląda inaczej niż francuska *France* i polska „Francja”.'
    example_gloss: Pochodzę z Francji.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: Włochy
    note: Wymowa mniej więcej „i-TA-li-en”.
    example_gloss: Pochodzę z Włoch.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: Hiszpania
    note: Wymowa mniej więcej „SZPA-ni-en”.
    example_gloss: Pochodzę z Hiszpanii.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: Rosja
    note: Zbudowane z *Russ-* + *-land*, tak jak *Deutschland*.
    example_gloss: Pochodzę z Rosji.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: Skąd Pan/Pani pochodzi? (oficjalnie)
    note: '*Woher* znaczy „skąd” – podobnie jak w polskim, znaczenie „z” jest już zawarte w tym jednym słowie.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Pochodzę z Niemiec.
    note: '*aus* + nazwa kraju oznacza pochodzenie – na tym etapie nie potrzeba słów określających narodowość.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: Skąd jesteś? (nieformalnie)
    note: Wersja nieformalna, z *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: Pochodzę z Anglii.
    note: Ta sama konstrukcja co *Ich komme aus Deutschland*, tylko inny kraj.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: A Pan/Pani? (oficjalnie)
    note: Krótki sposób, by oddać pytanie, zgodny z rejestrem *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix wita Annę
    gloss: 'Felix mówi: Dzień dobry!'
    note: Felix i Anna są sąsiadami, którzy spotkali się już raz (w lekcji 1), ale nie przedstawili się sobie z imienia. Znów na siebie wpadli, tym razem na przystanku autobusowym.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna odwzajemnia powitanie i pyta o jego imię
    gloss: 'Anna mówi: Dzień dobry! Jak Pan ma na imię?'
    note: Anna używa formy grzecznościowej *Sie*, podobnie jak w lekcji 1, gdy byli sobie obcy.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix podaje swoje imię i pyta o jej imię
    gloss: 'Felix mówi: Mam na imię Felix. A Pani?'
    note: Felix odpowiada i w formie grzecznościowej zadaje to samo pytanie.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna podaje swoje imię
    gloss: 'Anna mówi: Mam na imię Anna. Miło mi.'
    note: Anna odpowiada tak samo i dodaje zwrot grzecznościowy.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix odpowiada i pyta, skąd ona pochodzi
    gloss: 'Felix mówi: Wzajemnie. Skąd Pani pochodzi?'
    note: Felix odwzajemnia uprzejmość i zmienia temat rozmowy na pochodzenie.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna odpowiada i pyta o to samo
    gloss: 'Anna mówi: Pochodzę z Niemiec. A Pan?'
    note: Z tego wynika, że Anna jest Niemką, co pasuje do tego, że oboje są sąsiadami w niemieckojęzycznym mieście.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix odpowiada
    gloss: 'Felix mówi: Pochodzę z Anglii.'
    note: Teraz dowiadujemy się, że Felix pochodzi z Anglii, czyli jest Anglikiem mieszkającym w Niemczech.
  de.a1.unit02.lesson05.teach.line08:
    title: Anna się żegna
    gloss: 'Anna mówi: Do widzenia!'
    note: Formalne pożegnanie z lekcji 1, zgodne z dalszym używaniem formy *Sie*.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix się żegna
    gloss: 'Felix mówi: Do widzenia!'
    note: Felix kończy rozmowę tak samo, zachowując ten sam styl przez całe spotkanie.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Krótki profil na piśmie
    gloss: 'Imię: Felix. Kraj: Anglia.'
    note: Prosta karta profilu z imieniem i jedną informacją o osobie, czyli tym samym, co Felix powiedział wcześniej w dialogu.
