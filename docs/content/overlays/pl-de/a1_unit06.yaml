  de.a1.unit06.lesson04.teach.line02:
    title: Anna przedstawia rodziców
    gloss: 'Anna mówi: Tak. To jest moja matka, a to jest mój ojciec.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix pyta, kto to jest
