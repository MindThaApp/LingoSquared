units:
  de.a1.unit10.wegbeschreibungen:
    title: Pytanie o drogę i wskazywanie drogi
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Proszę skręcić w lewo.
    note: '*abbiegen* (skręcać) to czasownik rozdzielnie złożony – przedrostek *ab* przechodzi na sam koniec zdania: *Biegen Sie... ab*, a nie *Sie biegen ab* ani *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Proszę skręcić w prawo.
    note: Ten sam wzór czasownika rozdzielnie złożonego co przy *links abbiegen*, tylko z *rechts* (w prawo).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Proszę iść prosto.
    note: '*geradeaus* znaczy „prosto”. Tu nie ma rozdzielnego przedrostka – to prostszy grzecznościowy tryb rozkazujący.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Proszę się tu zatrzymać.
    note: '*anhalten* (zatrzymać się) też jest rozdzielnie złożony – *an* przechodzi na koniec, tak jak w *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: róg
    note: '*Ecke* znaczy „róg” – rzeczownik rodzaju żeńskiego, *die Ecke*.'
    example_gloss: Na rogu skręć w lewo.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Jak dojść do banku?
    note: '*zur* to zlepek *zu der* (celownik rodzaju żeńskiego, die Bank) – taki sam wzór jak *vom* (von + dem) z lekcji 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Proszę iść prosto, a potem na rogu skręcić w lewo.
    note: '*dann* (potem) łączy dwa kroki wskazówek; *an der Ecke* (na rogu) ma rodzajnik żeński w celowniku, tak jak we wzorze przyimków miejsca z lekcji 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: Czy to daleko?
    note: '*weit* znaczy „daleko”.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: To tylko dwie minuty stąd.
    note: '*nur* znaczy „tylko”.'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Nie sposób tego nie zauważyć.
    note: '*verfehlen* znaczy „chybić, nie trafić” – dosłownie: „To mogą Państwo nie chybić”.'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Proszę wybrać pierwszą ulicę w lewo.
    note: '*erste* znaczy „pierwszy” – to liczebnik porządkowy, który przed rzeczownikiem przyjmuje końcówkę, podobnie jak po polsku zmienia się w zależności od rodzaju.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Proszę wybrać drugą ulicę w prawo.
    note: '*zweite* znaczy „drugi”.'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: Wskazówki dojścia do apteki
    note: Krótki zestaw pisemnych wskazówek łączący kilka poznanych już zwrotów.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix pyta o drogę
    gloss: 'Felix: Przepraszam, jak dojść do banku?'
    note: To samo uprzejme otwarcie co w lekcji 9, tym razem z pytaniem o trasę, a nie tylko o położenie.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna wskazuje trasę
    gloss: 'Anna: Proszę iść prosto, a potem na rogu skręcić w lewo.'
    note: Pełna odpowiedź łączy dwa kroki za pomocą *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix potwierdza i dopytuje
    gloss: 'Felix: Na rogu w lewo, dobrze. Czy to daleko?'
    note: Felix powtarza wskazówkę, aby upewnić się, że zrozumiał, a potem zadaje naturalne pytanie dodatkowe.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna odpowiada, jak daleko to jest
    gloss: 'Anna: Nie, to tylko dwie minuty stąd. Nie sposób tego nie zauważyć.'
    note: Pełna, uspokajająca odpowiedź.
