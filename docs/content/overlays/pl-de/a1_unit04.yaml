teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: poniedziałek
    note: W krajach niemieckojęzycznych *Montag* jest pierwszym dniem tygodnia, tak jak w Polsce.
    example_gloss: W poniedziałek mam czas.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: wtorek
    note: '*Dienstag* jest drugim dniem tygodnia.'
    example_gloss: We wtorek mam czas.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: środa
    note: '*Mittwoch* dosłownie znaczy „środek tygodnia”. Podobnie jak polska „środa” (środek), to naprawdę środkowy dzień tygodnia.'
    example_gloss: W środę mam czas.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: czwartek
    note: '*Donnerstag* wziął nazwę od germańskiego boga Donara (Thora).'
    example_gloss: W czwartek mam czas.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: piątek
    note: '*Freitag* wziął nazwę od germańskiej bogini Frigg.'
    example_gloss: W piątek mam czas.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: sobota
    note: '*Samstag* to standardowe słowo oznaczające sobotę w większości Niemiec; *Sonnabend* to regionalna alternatywa (północne i wschodnie Niemcy).'
    example_gloss: W sobotę mam czas.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: niedziela
    note: '*Sonntag* dosłownie znaczy „dzień słońca”.'
    example_gloss: W niedzielę mam czas.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Jaki dziś dzień?
    note: '*heute* znaczy „dziś”; *Welcher Tag* = „jaki dzień”.'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: styczeń
    note: '*Januar* jest pierwszym miesiącem roku.'
    example_gloss: Moje urodziny są w styczniu.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: marzec
    note: '*März* jest trzecim miesiącem roku.'
    example_gloss: Moje urodziny są w marcu.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: maj
    note: '*Mai* jest krótkie i łatwe do zapamiętania, a brzmi prawie jak polski „maj”.'
    example_gloss: Moje urodziny są w maju.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: lipiec
    note: '*Juli* jest siódmym miesiącem roku.'
    example_gloss: Moje urodziny są w lipcu.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: wrzesień
    note: '*September* w niemieckim to nazwa miesiąca pochodzenia łacińskiego, a nie słowiańskiego, jak polski „wrzesień”.'
    example_gloss: Moje urodziny są we wrześniu.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: grudzień
    note: '*Dezember* jest ostatnim miesiącem roku.'
    example_gloss: Moje urodziny są w grudniu.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Który jest miesiąc?
    note: '*Monat* znaczy „miesiąc”; *es* = „to”.'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Którego dziś mamy?
    note: Dosłownie „który z kolei jest dziś?”. To standardowy sposób pytania o datę po niemiecku.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Dziś jest 7 lipca.
    note: 'Po niemiecku, podobnie jak po polsku, najpierw podaje się dzień, potem miesiąc: *der siebte Juli* = „siódmy lipca”. Naucz się *der siebte Juli* jako całej frazy.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Dziś jest wtorek, 7 lipca.
    note: Dzień tygodnia dodaj przed datą i oddziel go przecinkiem.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: Można to też zapisać jako 7.7.
    note: 'W niemieckim zapisie liczbowym najpierw podaje się dzień, potem miesiąc, a po każdym stawia się kropkę: 7.7. = 7 lipca.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Kiedy ma Pan/Pani urodziny?
    note: Dosłownie „Kiedy ma Pan/Pani urodziny?”. Po niemiecku, podobnie jak po polsku, mówi się, że się urodziny *ma*.
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Moje urodziny są 3 marca.
    note: '*Mein Geburtstag* = „moje urodziny”; *der dritte März* = „3 marca” (najpierw dzień, potem miesiąc).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: otwiera
    note: '*öffnet* to forma 3. osoby liczby pojedynczej od *öffnen* (otwierać); używana w znaczeniu „coś się otwiera”, np. sklep lub biblioteka.'
    example_gloss: Sklep otwiera się w poniedziałek.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: znowu
    note: '*wieder* znaczy „znowu”; tu użyte w pytaniu o to, kiedy coś zostanie ponownie otwarte.'
    example_gloss: Biblioteka znowu otwiera się w poniedziałek.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: rodzajnik określony (rodzaj żeński / liczba mnoga)
    note: '*die* to rodzajnik określony rzeczowników rodzaju żeńskiego w liczbie pojedynczej oraz wszystkich rzeczowników w liczbie mnogiej; tu stoi przy rzeczowniku żeńskim *Bibliothek*.'
    example_gloss: Biblioteka jest duża.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteka
    note: '*Bibliothek* jest rzeczownikiem rodzaju żeńskiego (*die Bibliothek*).'
    example_gloss: Idę do biblioteki.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: w / na (skrót od „an dem”)
    note: '*am* to skrót od *an dem*, używany przed dniami tygodnia i datami (*am Montag* = „w poniedziałek”).'
    example_gloss: W poniedziałek pracuję.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: rodzajnik określony (rodzaj męski, biernik)
    note: '*den* to forma biernika rodzaju męskiego od *der*. Pojawia się w pełnych datach po dniu tygodnia, jak w *am Donnerstag, den neunten Juli*. Naucz się tego jako stałego wzoru, nie analizuj teraz przypadku. (Spotkasz też *dem* po *am*, co jest równie poprawne.)'
    example_gloss: Spotykamy się w czwartek, dziewiątego lipca.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: dziewiąty
    note: '*neunten* to odmieniona forma liczebnika porządkowego od *neun* (dziewięć), używana w datach: *der neunte Juli* (mianownik) w pełnej dacie zmienia się w *den neunten Juli*.'
    example_gloss: Moje urodziny są dziewiątego lipca.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix pyta o datę
    gloss: 'Felix mówi: Którego dziś mamy?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna podaje datę
    gloss: 'Anna mówi: Dziś jest wtorek, 7 lipca.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix pyta o bibliotekę
    gloss: 'Felix mówi: Kiedy biblioteka znów się otwiera?'
  de.a1.unit04.lesson04.teach.line04:
    title: Odpowiedź Anny
    gloss: 'Anna mówi: Otwiera się znów w czwartek, 9 lipca.'
    note: '*Sie* oznacza tu „ona” (biblioteka) – odnosi się do *die Bibliothek*, rzeczownika rodzaju żeńskiego.'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix się żegna
    gloss: 'Felix mówi: Dobrze, do czwartku.'
    note: '*bis Donnerstag* = „do czwartku” – częsty sposób pożegnania się na kilka dni, np. „do zobaczenia w czwartek”.'
  de.a1.unit04.lesson04.teach.notiz:
    title: Kartka na drzwiach
    gloss: Zamknięte do czwartku, 9 lipca.
    note: '*Geschlossen* znaczy „zamknięty”.'
