  de.a1.unit57.lesson03.teach.du_kennst_sport:
    title: Sport treiben a spielen / machen
    gloss: 'Sport treiben znasz już z lekcji o hobby (Ich treibe samstags Sport). Przy konkretnym sporcie podajesz jego nazwę z czasownikiem spielen lub machen: Ich spiele Fußball. Obie wersje są poprawne.'
    note: '*Sport treiben* wraca z lekcji o hobby i nie jest nowością. To ogólny sposób mówienia o uprawianiu sportu, a spielen, machen i gehen określają konkretną dyscyplinę.'
