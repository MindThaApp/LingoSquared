    title: Mal pro Woche a jeden Tag / oft
    gloss: Znasz już jeden Tag (codziennie) i oft (często). Zwei Mal pro Woche (dwa razy w tygodniu) to nowy, dokładniejszy sposób na powiedzenie, jak często coś robisz.
    note: Rozszerza słownictwo dotyczące częstotliwości, które poznałeś(-aś) w lekcji o hobby.
