    title: Jaki czasownik pasuje do sportu
    gloss: 'Czasownik zależy od sportu: spielen przy piłce nożnej, machen przy jodze, gehen z bezokolicznikiem przy pływaniu i bieganiu.'
    note: Na tym poziomie nie musisz uczyć się osobnego czasownika do każdego sportu; wystarczy zapamiętać kilka schematów.
