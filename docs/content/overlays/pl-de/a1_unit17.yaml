    title: Felix pyta, jak się czuje Anna
    gloss: 'Felix: Pani Anno, czy czuje się Pani dobrze?'
    note: 'Felix zwraca się do Anny formalnie: *Ihnen*.'
  de.a1.unit17.lesson02.teach.line02:
