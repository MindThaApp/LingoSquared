units:
  de.a1.unit08.einkaufen:
    title: 'Zakupy: ceny i ilości'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: funt jabłek
    note: '*Pfund* jest w Niemczech nadal potocznie używany; niemiecki *Pfund* to dokładnie 500 g (pół kilo), choć kraj oficjalnie stosuje system metryczny.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: tuzin jajek
    note: '*Dutzend* oznacza tuzin (dwanaście).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: butelka wody
    note: '*Flasche* oznacza butelkę.'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: torebka ryżu
    note: '*Tüte* oznacza torebkę.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: kilo pomidorów
    note: '*Kilo* to standardowa metryczna jednostka wagi, używana znacznie częściej niż *Pfund* poza potocznymi, codziennymi ilościami.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Ile kosztują jabłka?
    note: '*kosten* znaczy „kosztować” – dosłownie: „Co kosztują jabłka?”'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Kosztują dwa euro za funt.
    note: '*Sie* oznacza tu „one” (o jabłkach), a nie grzecznościowe „Pan/Pani”. Formalne *Sie* i *sie* w liczbie mnogiej („one/oni”) mają dokładnie tę samą formę czasownika (*kosten*), a na początku zdania oba piszemy wielką literą, więc rozstrzyga tylko kontekst: mowa jest o jabłkach, nie o osobie.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Czy mogę prosić dwa funty?
    note: Uprzejma forma prośby, podobna do *Ich möchte..., bitte* z lekcji 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: Czy to jest świeże?
    note: '*frisch* znaczy „świeży”. *es* pasuje tu do rzeczownika rodzaju nijakiego (jak das Brot); pytając o rodzaj męski, powiesz *Ist er frisch?* (der Reis), a o żeński *Ist sie frisch?* (die Milch) – zaimek zmienia się zależnie od rodzaju rzeczownika i nie zawsze jest to *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: za funt
    note: '*pro* znaczy „za/na” – używane zarówno na cenówkach, jak i w mowie.'
    example_gloss: Jabłka kosztują dwa euro za funt.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Cennik na targu
    note: Prosty cennik z trzema produktami i cenami jednostkowymi.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: To będzie osiem euro.
    note: '*Das macht...* to standardowy sposób podawania sumy, znany już z lekcji 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix pyta o cenę
    gloss: 'Felix mówi: Ile kosztują jabłka?'
    note: To samo pytanie co w lekcji 2, tym razem w prawdziwej rozmowie.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna podaje cenę
    gloss: 'Anna mówi: Kosztują dwa euro za funt.'
    note: Pełna odpowiedź podaje cenę za jednostkę.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix zamawia
    gloss: 'Felix mówi: Dobrze, czy mogę prosić dwa funty?'
    note: '*Gut* znaczy tu „dobrze/okej” – zgoda na cenę przed złożeniem zamówienia.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna pyta, czy coś jeszcze
    gloss: 'Anna mówi: Oczywiście. Coś jeszcze?'
    note: '*Natürlich* znaczy „oczywiście”.'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix zamawia więcej
    gloss: 'Felix mówi: Tak, także tuzin jajek.'
    note: '*auch* znaczy „też/także”.'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna podaje sumę
    gloss: 'Anna mówi: To będzie osiem euro.'
    note: Dwa funty jabłek (4 €) plus tuzin jajek (4 €) dają razem osiem euro.
