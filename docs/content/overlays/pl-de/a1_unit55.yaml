course:
  title: Niemiecki A1
  description: 'Niemiecki dla początkujących: opisywanie podstawowego wyglądu osoby, czyli wrażenia wzrostu i wieku, koloru włosów i oczu, podstawowego pytania Wie sieht ... aus? oraz porównywania wyglądu dwóch osób.'
units:
  de.a1.unit55.aussehen:
    title: Opisywanie wyglądu
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Wysoki, niski, stary i młody
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Opisywanie włosów
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Oczy i jak ktoś wygląda?
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna opisuje Ninę
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Porównanie Jonasa i Leny
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix rozpoznaje Ninę
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Groß* opisuje osobę wysoką, a *klein* niską. O ludziach po niemiecku mówi się groß (duży), a nie lang (długi).'
    example_gloss:
    - Lena jest wysoka.
    - Jonas jest niski.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Stary i młody
    gloss: stary / młody
    note: '*Alt* i *jung* opisują tu ogólne wrażenie wieku, a nie dokładną liczbę lat.'
    example_gloss:
    - Dziadek jest stary.
    - Felix jest młody.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: liczba lub wrażenie'
    gloss: Alt może łączyć się z liczbą lat, jak w Ich bin dreißig Jahre alt, albo oznaczać ogólne wrażenie, jak w Opa ist alt.
    note: 'O dokładny wiek zapytasz: *Wie alt bist du?* Tutaj *alt* opisuje, jak ktoś WYGLĄDA, bez podawania liczby.'
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena jest wysoka, a Jonas niski
    gloss: Lena jest wysoka, a Jonas jest niski.
    note: Proste zdanie złożone ze spójnikiem *und* (i), które przygotowuje bezpośrednie porównanie w lekcji 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Włosy
    gloss: włosy
    note: '*Haare* to rzeczownik w liczbie mnogiej: *die Haare*, podobnie jak polskie „włosy”. W niemieckim istnieje też liczba pojedyncza das Haar, ale o włosach na głowie zwykle mówi się Haare.'
    example_gloss: Felix ma krótkie czarne włosy.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'Trzy kolory włosów: blond, braun, grau. Przed rzeczownikiem w liczbie mnogiej bez rodzajnika mają końcówkę -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna ma blond włosy.
    - Jonas ma brązowe włosy.
    - Dziadek ma siwe włosy.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Kurz* (krótki) i *lang* (długi) opisują długość włosów. Znowu końcówka -e: kurze Haare, lange Haare.'
    example_gloss:
    - Lena ma długie włosy.
    - Jonas ma krótkie włosy.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare ma końcówkę -e
    gloss: 'Haare to liczba mnoga bez rodzajnika, więc przymiotnik ma końcówkę -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Bez rodzajnika przymiotnik przed rzeczownikiem w liczbie mnogiej ma końcówkę -e. To ten sam wzorzec co przy *Augen* w lekcji 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: jej'
    gloss: 'Ihre znaczy tu „jej”: ihre Haare = jej włosy. Anna ma długie włosy, a jej włosy są blond.'
    note: '*Ihre* (pisane małą literą) to zaimek dzierżawczy „jej” i zgadza się z rzeczownikiem w liczbie mnogiej Haare. Pisane wielką literą, *Ihre* znaczy „Pana/Pani” (formalnie).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix ma krótkie czarne włosy
    gloss: Felix ma krótkie czarne włosy.
    note: 'Powtórka słowa *schwarz* (czarny), tym razem o włosach: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna ma długie blond włosy
    gloss: Anna ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Oczy
    gloss: oczy
    note: '*Augen* to liczba mnoga od *das Auge*. Po niemiecku zwykle używa się liczby mnogiej, bo mamy dwoje oczu.'
    example_gloss: Felix ma brązowe oczy.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: 'Kolory: blau (niebieski), braun (brązowy) i grün (zielony).'
    example_gloss:
    - Anna ma niebieskie oczy.
    - Jonas ma brązowe oczy.
    - Lena ma zielone oczy.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen ma końcówkę -e
    gloss: 'Augen to liczba mnoga, więc przymiotnik ma końcówkę -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Ta sama zasada co przy Haare: brak rodzajnika i rzeczownik w liczbie mnogiej dają końcówkę -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Jak wygląda Anna?
    gloss: Jak wygląda Anna?
    note: '*Wie sieht ... aus?* to główne pytanie tej jednostki. Czasownik *aussehen* jest rozdzielnie złożony: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna ma długie blond włosy i niebieskie oczy
    gloss: Anna ma długie blond włosy i niebieskie oczy.
    note: Wzorcowa odpowiedź łącząca włosy i oczy w jednym zdaniu ze spójnikiem *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna przedstawia Ninę
    gloss: 'Anna: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*Ein neues Mädchen kommt* wprowadza kogoś nowego. Po *kommt* określenie kierunku *ins* (in das) Sprachcafé wymaga biernika.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix pyta, jak ona wygląda
    gloss: 'Felix: Okej! Jak ona wygląda?'
    note: 'Wraca główne pytanie tej jednostki, tym razem z *sie* (ona) zamiast imienia: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna opisuje wzrost i włosy Niny
    gloss: 'Anna: Jest niska i ma krótkie blond włosy.'
    note: 'Łączy *klein* ze słownictwem o włosach z lekcji 02. Drugie *sie* jest pominięte: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix pyta o jej oczy
    gloss: 'Felix: A jej oczy?'
    note: '*Ihre* oznacza tu „jej” (zaimek dzierżawczy), a nie jest formą od „Pan/Pani”. Zgadza się z liczbą mnogą Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna opisuje oczy Niny
    gloss: 'Anna: Ma zielone oczy.'
    note: Powtórka wyrażenia *grüne Augen* z lekcji 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix ją rozpozna
    gloss: 'Felix: Dzięki! W takim razie na pewno ją rozpoznam.'
    note: '*Dann erkenne ich sie bestimmt* znaczy „wtedy na pewno ją rozpoznam”. Po *dann* czasownik stoi na drugim miejscu: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Porównanie Jonasa i Leny
    gloss: Jonas i Lena są rodzeństwem – bratem i siostrą – ale wyglądają inaczej. Jonas jest niski, ma krótkie brązowe włosy i brązowe oczy. Lena jest wyższa od Jonasa, ma długie brązowe włosy i zielone oczy. A jak ty wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      Bruder: brat
      Schwester: siostra
      sehen: wyglądać
      unterschiedlich: różnie
      klein: niski
      kurze: niski
      braune: brązowy
      Haare: włosy
      Augen: oczy
      größer: wyższy
      lange: długi
      grüne: zielony
      aus: (część czasownika 'aussehen' = wyglądać)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: Znowu stopień wyższy
    gloss: 'Znasz już schemat: przymiotnik + -er + als (niż, od). Tu używamy go w odniesieniu do osób: Lena jest wyższa od Jonasa.'
    note: 'Ten sam schemat *-er + als* co w lekcji o porównaniach. Groß zmienia się w größer: samogłoska dostaje umlaut.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena ma dłuższe włosy niż Jonas
    gloss: Lena ma dłuższe włosy niż Jonas.
    note: '*Längere Haare*: länger przyjmuje końcówkę -e przed rzeczownikiem w liczbie mnogiej bez rodzajnika, a lang w stopniu wyższym dostaje umlaut.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: Wzorcowe zdanie w pierwszej osobie z konstrukcją *Ich habe ...*, które możesz wykorzystać, opisując własny wygląd.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix zauważa Ninę
    gloss: 'Felix: Patrz, czy to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*Schau mal* (spójrz) to przyjazny sposób zwrócenia na coś uwagi. To forma rozkazująca dla „ty” (du).'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna potwierdza
    gloss: 'Anna: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina wita się z Felixem
    gloss: 'Nina: Cześć, jesteś Felix?'
    note: 'Proste nieformalne pytanie: *bist du ...?* (czy jesteś ...?). Bist to forma czasownika sein dla „ty” (du).'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix też się wita
    gloss: 'Felix: Tak! Miło mi, Nina.'
    note: '*Freut mich* to standardowe wyrażenie przy pierwszym spotkaniu, jak w lekcji 2. Do kogoś, kogo już znasz, powiesz *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Kończy dialog – Felix rozpoznał Ninę dzięki wcześniejszemu opisowi Anny.
