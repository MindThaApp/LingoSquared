    note: '*frühstücken* jest czasownikiem regularnym oznaczającym jedzenie śniadania.'
    example_gloss: Kiedy Pan/Pani je śniadanie?
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: pracować
    note: '*arbeiten* przyjmuje zwykłą końcówkę *ich*: *ich arbeite*.'
    example_gloss: 'W kontekście: Pracuję po południu.'
