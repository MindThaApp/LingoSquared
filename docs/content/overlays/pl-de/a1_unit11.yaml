  de.a1.unit11.lesson02.teach.line01:
    title: Felix pyta o rozkład dnia
    gloss: 'Felix: Kiedy Pan/Pani wstaje?'
    note: Felix pyta Annę o jej rozkład dnia w formie grzecznościowej.
  de.a1.unit11.lesson02.teach.line02:
    title: Anna opisuje swój poranek
    gloss: 'Anna: Wstaję o siódmej. Potem jem śniadanie.'
    note: Dwie codzienne czynności po kolei.
    example_gloss: 'W kontekście: Wstaję o siódmej.'
  de.a1.unit11.lesson02.teach.line03:
    title: Felix pyta o pracę
    gloss: 'Felix: Czy Pan/Pani dzisiaj pracuje?'
    note: Forma grzecznościowa *Sie* z formą czasownika *arbeiten*.
  de.a1.unit11.lesson02.teach.line04:
    title: Anna opisuje resztę swojego dnia
    gloss: 'Anna: Tak, po południu pracuję w kawiarni. Wieczorem uczę się niemieckiego, a o dziesiątej idę spać.'
    note: Cały rozkład dnia można opisać kilkoma krótkimi zdaniami.
    example_gloss: 'W kontekście: Tak, po południu pracuję w kawiarni.'
