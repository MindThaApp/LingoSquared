    title: Wann stehen Sie auf?
    gloss: Kiedy Pan/Pani wstaje?
    note: Pytanie w formie grzecznościowej z *Sie*; rozdzielny przedrostek *auf* zostaje na końcu.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: Wstaję o siódmej.
    note: '*um* wskazuje godzinę.'
  de.a1.unit11.lesson02.teach.am_nachmittag:
