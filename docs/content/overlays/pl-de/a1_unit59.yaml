    title: Kto czego używa?
    gloss: Anna codziennie dzwoni do Felixa. Używa telefonu, nie aplikacji. Felix nie ma w domu komputera, ale korzysta z internetu w telefonie. Jonas każdego ranka sprawdza prognozę pogody. Potem idzie pobiegać. Lena często wysyła Annie wiadomość. A ty też codziennie używasz telefonu?
