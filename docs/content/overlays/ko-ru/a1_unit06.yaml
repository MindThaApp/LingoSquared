teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: 저는 ...이(가) 있어요
    note: 직역하면 "나에게 (...이) 있다"예요. 러시아어에서 "가지고 있다/있다"를 말하는 기본 표현이에요. 3단원의 У меня два брата도 같은 У меня 구조였어요. 몇 명인지 말할 때는 есть를 보통 생략해요.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: 이 사람은 ...이에요 / 이것은 ...이에요
    note: Это는 사람이나 사물을 소개하거나 가리킬 때 쓰며, 그 대상의 문법적 성(性)에 관계없이 똑같이 써요.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: 어머니, 아버지
    note: мать는 연음 부호(-ь)로 끝나는 러시아어의 소수 여성 명사 중 하나예요.
    example_gloss:
    - 이분은 제 어머니예요.
    - 이분은 제 아버지예요.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: 남자 형제, 여자 형제
    note: брат는 3단원에서 숫자와 함께 썼던 단어("У меня два брата")이고, сестра는 그에 대응하는 여성형이에요.
    example_gloss:
    - 이 사람은 제 남자 형제예요.
    - 저는 여자 형제가 한 명 있어요.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: 나의 (남성), 나의 (여성)
    note: мой는 отец, брат 같은 남성 명사와 함께 쓰고, моя는 мать, сестра 같은 여성 명사와 함께 써요.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: 할머니, 할아버지
    note: 둘 다 -а로 끝나지만 дедушка는 남자를 가리키므로 남성으로 취급해요. 그래서 мой дедушка, моя бабушка라고 해요.
    example_gloss:
    - 이분은 제 할머니예요.
    - 이분은 제 할아버지예요.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: 남편, 아내
    note: муж는 남성, жена는 여성이며, 성별에 따른 일반적인 어미 규칙을 따라요.
    example_gloss:
    - 이 사람은 제 남편이에요.
    - 이 사람은 제 아내예요.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: 아들, 딸
    note: дочь도 мать처럼 연음 부호(-ь)로 끝나는 여성 명사예요.
    example_gloss: 저는 아들과 딸이 있어요.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: 자녀들
    note: дети는 ребёнок("아이")의 불규칙 복수형이에요. 단수와 복수가 완전히 다른 단어예요.
    example_gloss: 자녀가 있으세요?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: '...이(가) 있으세요? (정중한 표현)'
    note: 2단원에서 배운 вы 높임 표현에 맞춰 정중한 вас를 써요.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: 이 사람은 누구예요?
    note: 사진을 볼 때처럼, 어떤 사람이 누구인지 물을 때 쓰는 기본 표현이에요.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: 그녀의 이름은 안나예요.
    note: 직역하면 "사람들이 그녀를 안나라고 부른다"예요. Её("그녀를")는 동사 зовут의 목적어이고 주어가 아니에요.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: 막심이 사진에 대해 물어봐요
    gloss: '막심: 사진 속 이 사람은 누구예요?'
    note: 막심은 사진을 가리키며 Кто это на фото?라고 물으면서 대화를 시작해요.
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: 올가가 가족을 소개해요
    gloss: '올가: 제 가족이에요.'
    note: Это моя семья에서 семья("가족")는 여성 명사이므로 моя가 여기에 맞춰져 있어요.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: 올가가 세 명의 가족을 말해요
    gloss: '올가: 여기 제 아버지, 어머니, 그리고 남자 형제예요.'
    note: Вот("여기 ...이 있다")가 나열을 시작하고, 소유 표현(мой/моя)은 각각 뒤에 오는 명사의 성에 맞춰요.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: 막심이 소녀에 대해 물어봐요
    gloss: '막심: 그런데 저 여자아이는 누구예요?'
    note: А는 막심이 사진 속 네 번째 사람에 대해 이어서 자연스럽게 질문할 때 쓰는 말이에요.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: 올가가 딸을 소개해요
    gloss: '올가: 제 딸이에요. 이름은 안나예요.'
    note: 올가는 моя дочь라고 답한 뒤, Её зовут Анна로 이름을 말해요.
