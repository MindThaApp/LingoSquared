    title: Давай пойдём...
    gloss: ~하러 가자
    note: Давай는 친근하게 제안할 때 쓰는 표현("~하자")이고, пойдём은 "가다"의 "우리" 미래형이에요. 둘을 함께 써서 활동을 제안해요.
