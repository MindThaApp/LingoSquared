    example_gloss: 내일 영화 보러 가자.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: 좋아요, 동의해요.
    note: согласен("동의해요")은 남성 화자가 쓰는 말이고, 여성 화자는 согласна라고 말해요.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: 유감이지만 못 가요.
    note: К сожалению("유감이지만")은 거절을 부드럽게 해 주고, не могу는 "할 수 없어요"라는 뜻이에요.
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: 몇 시에 만날까요?
    note: Во сколько는 시각을 물을 때 쓰고, встретимся는 "만나다"의 "우리" 미래형이에요.
    example_gloss: 7시로 해요.
