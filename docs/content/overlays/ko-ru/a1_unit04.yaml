    note: октябрь의 생격 형태예요. января/апреля처럼 날짜 뒤에 쓰는 형태예요.
    example_gloss: 오늘은 10월 5일이에요.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: 오늘은 며칠이에요?
    note: 날짜를 물을 때 쓰는 기본 표현이에요.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: 화요일에
    note: '발음하기 쉽게 전치사 в가 вторник 앞에서는 во로 바뀌어요. вторник 자체는 여기서 형태가 변하지 않아요. (여성형 요일은 변해요: в среду, в пятницу, в субботу)'
