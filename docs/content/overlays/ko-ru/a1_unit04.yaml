    note: 날짜 뒤에서는 월 이름이 생격으로 바뀌어요. 그래서 январь는 января, апрель는 апреля가 돼요.
    example_gloss:
    - 오늘은 1월 3일이에요.
    - 오늘은 4월 10일이에요.
  ru.a1.unit04.lesson02.teach.oktyabrya:
