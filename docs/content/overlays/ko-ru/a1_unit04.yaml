    title: встреча
    gloss: 회의, 만남
    note: 예정된 회의나 약속을 가리키는 흔한 명사예요.
    example_gloss: 회의는 화요일이에요.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: 안나가 요일을 물어요
    gloss: '안나: 오늘 무슨 요일이에요?'
    note: 안나는 lesson01에서 배운 день 질문으로 대화를 시작해요.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: 빅토르가 요일과 날짜로 대답해요
    gloss: '빅토르: 오늘은 수요일, 1월 3일이에요.'
    note: 빅토르는 요일과 서수 날짜를 함께 말해요. 월 이름은 생격 형태인 января를 써요.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: 안나가 화요일을 제안해요
    gloss: '안나: 좋아요. 회의는 화요일인가요?'
    note: Хорошо는 빅토르의 대답을 받아들이는 말이고, 그다음에 안나가 이어서 질문해요.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: 빅토르가 날짜를 확인해 줘요
    gloss: '빅토르: 네, 화요일 1월 9일이에요.'
    note: 'Да로 확인한 뒤 빅토르가 요일과 날짜를 다시 말해요. 어떤 날짜에 일이 일어나는지 말할 때는 서수 자체가 생격이 돼요: девятого января("1월 9일에"). Сегодня девятое января("오늘은 1월 9일이에요")와 비교해 보세요.'
