  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: 오늘은 무슨 요일이에요?
    note: Какой는 남성 명사 день("날, 요일")에 맞춘 형태예요.
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: 월요일, 화요일
    note: 러시아어에서는 요일 이름을 대문자로 쓰지 않아요. 한국어는 대소문자 구분이 없지만, 러시아어는 문장 처음이 아니면 요일을 소문자로 써요.
    example_gloss:
    - 오늘은 월요일이에요.
    - 오늘은 화요일이에요.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: 수요일, 목요일
    note: 러시아어의 모든 요일 이름처럼 среда와 четверг도 소문자로 쓰고, 문장 맨 앞에서만 대문자로 써요.
    example_gloss:
    - 오늘은 수요일이에요.
    - 오늘은 목요일이에요.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: 금요일, 토요일
    note: суббота에는 б가 두 번 들어가요. 철자를 자주 틀리는 부분이에요.
    example_gloss:
    - 오늘은 금요일이에요.
    - 오늘은 토요일이에요.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: 일요일
    note: 러시아어 요일 목록의 마지막 요일이에요.
    example_gloss: 오늘은 일요일이에요.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: 오늘은 ...이에요.
    note: 한국어의 "~이에요"와 달리, Сегодня 뒤에 요일 이름이 오면 연결하는 동사가 필요 없어요.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: 오늘은 며칠이에요?
    note: Какое는 위의 какой день과 달리 중성 명사 число("날짜, 수")에 맞춘 형태예요.
