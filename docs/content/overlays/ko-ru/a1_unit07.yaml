    example_gloss: 웨이트리스는 식당에서 일해요.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: 이 테이블 비어 있나요?
    note: столик은 стол("테이블")의 지소형으로, 식당 테이블을 말할 때 흔히 써요. свободен("비어 있는")은 남성명사에 맞춘 형태예요.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: 네, 앉으세요.
    note: садитесь는 садиться("앉다")의 존칭/복수 명령형으로, вы에게 써요.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: 무엇을 주문하시겠어요?
    note: будете заказывать는 미래 시제 표현("주문할 것이다")으로, 웨이터가 손님에게 무엇을 원하는지 물을 때 써요.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: ~을(를) 원해요 / ~주세요
    note: хочу는 хотеть("원하다")의 1인칭 단수형으로, 음식과 음료를 주문할 때 써요.
