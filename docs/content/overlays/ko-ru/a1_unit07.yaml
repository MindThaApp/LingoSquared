    note: 웨이트리스가 Что будете заказывать?라고 물으며 대화를 시작해요.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: 관광객이 음식을 주문해요
    gloss: '관광객: 보르시와 샐러드를 먹고 싶어요.'
    note: Турист("관광객")가 Я хочу борщ и салат.라고 대답해요.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: 웨이트리스가 음료를 물어요
    gloss: '웨이트리스: 음료는 무엇으로 하시겠어요?'
    note: пить("마시다")는 будете와 함께 쓰여요. 앞의 заказывать 질문과 같은 구조예요.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
