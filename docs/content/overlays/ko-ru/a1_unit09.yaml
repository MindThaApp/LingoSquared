teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: 어디
    note: где는 위치를 물을 때 쓰고, 보통 находится와 함께 써요.
    example_gloss: 가게가 어디에 있어요?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: 위치해 있다
    note: находится는 находиться("위치하다")의 3인칭 단수형이에요. магазин처럼 단수 주어와 함께 써요.
    example_gloss: 가게는 어디에 위치해 있어요?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: 거리
    note: улица는 여성 명사예요. на Тверской улице("트베르스카야 거리에")처럼 на 뒤에서는 전치격을 써요.
    example_gloss: 가게는 트베르스카야 거리에 있어요.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: 가게는 어디에 위치해 있어요?
    note: 어떤 장소든 위치를 물을 때 쓰는 기본 질문 형태예요.
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: 은행, 약국
    note: банк는 남성 명사이고 аптека는 여성 명사예요. 둘 다 동네에서 흔히 볼 수 있는 장소예요.
    example_gloss:
    - 은행은 어디에 있어요?
    - 약국은 어디에 있어요?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: 기차역, 호텔
    note: вокзал은 남성 명사이고 гостиница는 여성 명사예요.
    example_gloss:
    - 기차역은 어디에 있어요?
    - 호텔은 어디에 있어요?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: 식당, 도서관
    note: ресторан은 남성 명사이고 библиотека는 여성 명사예요. Чайковского, Пушкина 같은 거리 이름은 улица 뒤에서 생격으로 나와요.
    example_gloss:
    - 식당은 어디에 있어요?
    - 도서관은 어디에 있어요?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: 당신의 거리에는 무엇이 있어요?
    note: вашей는 존칭 "당신의"에 해당하는 소유 표현이에요. 전치격 여성 명사 улице에 맞춰 형태가 바뀌었어요.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: 안나가 거리에 대해 물어요
    gloss: '안나: 당신의 거리에는 무엇이 있어요?'
    note: 안나가 Что есть на вашей улице?로 대화를 시작해요.
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: 빅토르가 세 곳을 말해요
    gloss: '빅토르: 우리 동네 거리에는 가게, 도서관, 은행이 있어요.'
    note: На моей улице есть는 есть("있다")로 있는 것을 나열하는 표현이고, 항목은 и로 이어요.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: 안나가 은행이 어디 있는지 물어요
    gloss: '안나: 그런데 은행은 어디에 있어요?'
    note: А는 빅토르가 말한 장소 중 하나에 대한 안나의 이어지는 질문을 자연스럽게 연결해 줘요.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: 빅토르가 은행이 있는 거리를 말해요
    gloss: '빅토르: 은행은 푸시킨 거리에 있어요.'
    note: 빅토르는 Банк на улице Пушкина라고 답해요. улице 뒤에 생격 Пушкина가 쓰였어요.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: 안나가 빅토르에게 고마워해요
    gloss: '안나: 정말 고맙습니다.'
    note: Спасибо большое는 спасибо에 большое("큰")를 붙여 강조한 말로, "정말 고맙습니다"라고 할 때 흔히 써요.
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: 빅토르가 대답해요
    gloss: '빅토르: 천만에요.'
    note: Пожалуйста는 спасибо에 대한 대답으로 "천만에요"라는 뜻이에요.
