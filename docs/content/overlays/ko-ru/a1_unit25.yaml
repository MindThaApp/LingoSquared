teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '자주 쓰는 취미 동사 세 가지예요: *читать*(읽다), *заниматься спортом*(운동하다), *готовить*(요리하다).'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: 여가 시간
    gloss: 시간
    note: '*Свободное время*은 취미를 말할 때 꼭 필요한 표현이에요. 형용사 *свободное*는 *время*에 맞춰 *-ое*로 끝나요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Люблю*는 *любить*(좋아하다, 사랑하다)의 *я* 형태예요. 그 뒤의 두 번째 동사는 원형을 그대로 써요: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 세 가지를 더 배워요: *слушать музыку*(음악을 듣다), *рисовать*(그림을 그리다), *играть в игры*(게임을 하다).'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Слушать*는 목적어를 바로 취해요. *музыку*는 *музыка*의 대격이고 어미가 *-у*예요.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*С друзьями*(친구들과): 전치사 *с* 뒤에는 조격이 와서 *друзьями*가 돼요.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '기본 빈도 부사 네 가지예요: *всегда*, *часто*, *иногда*, *никогда*. 형태가 변하지 않아요.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Каждую неделю*와 *каждые выходные*는 둘 다 ''매~''라는 뜻이지만, 어미는 명사에 따라 달라요. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '''매~'': 여성형과 복수형'
    gloss: '*Неделя*는 여성 명사라서 *каждую неделю*가 돼요. *Выходные*는 복수라서 *каждые выходные*가 돼요.'
    note: '*Каждый*는 다른 형용사처럼 명사에 맞춰 변해요: *каждый день*(남성), *каждую неделю*(여성, 대격), *каждые выходные*(복수).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: 나스탸가 취미 이야기를 꺼내요
    gloss: '나스탸: 우리는 자주 같이 산책해요. 그런데 디마, 여가 시간에 또 뭘 해요?'
    note: '*Мы часто гуляем вместе*: *мы*(우리)는 동사 어미가 *-ем*이 되고, *гулять*는 즐기려고 산책한다는 뜻이에요.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: 디마의 취미
    gloss: '디마: 저는 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*И дома тоже*(집에서도): *и ... тоже*는 디마가 일할 때만이 아니라 즐기려고도 요리한다는 걸 보여 줘요.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: 나스탸가 놀라요
    gloss: '나스탸: 집에서도 요리해요? 직장에서 하루 종일 요리하잖아요!'
    note: '*Весь день*(하루 종일)은 디마가 직장에서 이미 요리를 많이 한다는 점을 강조해요. *Весь*는 남성 명사 *день*에 맞춘 형태예요.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: 디마의 설명
    gloss: '디마: 응, 그래도 나는 요리하면 마음이 편해져. 너는? 너는 뭐 하는 걸 좋아해?'
    note: '*Готовить меня расслабляет*는 하는 일을 먼저 말해요. 직역하면 ''요리하는 것이 나를 편하게 한다''이고, *меня*는 대격이에요.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: 나스탸의 취미
    gloss: '나스탸: 나는 책 읽는 걸 좋아하고 음악도 자주 들어.'
    note: '앞에서 배운 취미 동사 두 개를 *и*(그리고)로 이어요: *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: 디마가 게임에 대해 묻기
    gloss: '디마: 너도 게임해?'
    note: '짧은 예/아니요 질문이에요. 러시아어는 어순을 그대로 두고 억양만 올려요: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: 나스탸의 대답
    gloss: '나스탸: 아니, 나는 게임은 전혀 안 해. 대신 가끔 그림을 그려!'
    note: '*Никогда не*(전혀 ~않다)은 동사 앞에 *не*을 하나 더 써야 해요. *Иногда*(가끔)는 대조를 나타내요.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: 취미 비교하기
    gloss: 나는 디마와 자주 함께 산책해요. 하지만 다른 취미도 있어요. 디마는 요리를 좋아해요. 집에서도요. 그리고 운동도 자주 해요. 나는 책 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만 게임은 전혀 하지 않아요. 너는 자유 시간에 뭐 하는 걸 좋아해?
    note: 나스탸의 메시지는 앞에서 배운 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      гуляем: 산책하다
      часто: 자주
      вместе: 함께
      другие: 다른
      готовить: 요리하다
      любит: 즐겨
      дома: 집에서
      занимается: 운동하다
      читать: 읽다
      слушаю: 듣다
      музыку: 음악
      рисую: 그리다
      иногда: 가끔
      играю: 게임하다
      никогда: 전혀 하지 않다
      свободное: 자유로운
      время: 시간
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: 디마가 주말 계획을 묻기
    gloss: '디마: 이번 주말에 뭐 해?'
    note: '*В эти выходные*(이번 주말): *выходные*는 복수라서 *эти*도 복수이고, 시간을 나타내는 *в* 뒤에는 대격을 써요.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: 나스탸는 아직 못 정했어요
    gloss: '나스탸: 아직 몰라. 책 읽는 것도 좋아하지만 밖에도 나가고 싶어.'
    note: '*Хочу ещё выйти на улицу*는 ''밖에도 나가고 싶어요''라는 뜻이에요. *Хочу*는 *хотеть*의 *я* 형태예요.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: 디마의 제안
    gloss: '디마: 같이 산책할래? 그다음에 내가 우리 먹을 걸 만들게.'
    note: '*Давай погуляем*은 함께 무언가 하자고 제안할 때 쓰는 흔한 표현이고, *потом*(그다음에)은 다음 순서를 알려 줘요.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: 나스탸의 동의
    gloss: '나스탸: 좋은 생각이야! 나는 산책하는 것도 요리하는 것도 좋아해.'
    note: '*Мне нравится*는 직역하면 ''나에게 마음에 든다''예요. 좋아하는 사람은 여격(*мне*)으로 쓰고, 좋아하는 대상이 뒤따라요.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: 디마의 확인
    gloss: '디마: 좋아. 그럼 토요일에 보자!'
    note: '*Увидимся в субботу*(토요일에 봐요): 요일 앞의 *в*는 대격을 써서 *суббота*가 *субботу*가 돼요.'
