teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: 가게
    note: магазин은 가게나 상점을 뜻하는 남성 명사예요.
    example_gloss: 우리는 가게에 가요.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: 얼마
    note: сколько는 수량이나 가격을 물을 때 쓰고, 보통 стоит와 함께 써요.
    example_gloss: 빵은 얼마예요?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: 값이 ~이다
    note: стоит는 стоить("값이 나가다")의 3인칭 단수형이고, хлеб처럼 단수 주어와 함께 써요.
    example_gloss: 빵은 100루블이에요.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: 루블
    note: рубль는 러시아의 화폐 단위예요. сто("100") 뒤에는 복수 생격 рублей를 써요.
    example_gloss: 빵은 100루블이에요.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: 빵, 우유
    note: хлеб는 남성 명사이고 молоко는 중성 명사예요. 둘 다 일상적인 식료품이에요.
    example_gloss:
    - 빵은 얼마예요?
    - 우유는 얼마예요?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: ~ 주세요
    note: Дайте는 дать("주다")의 공손한 명령형(복수형)으로, вы에게 말할 때 써요.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: 킬로그램
    note: килограмм은 채소나 빵을 무게로 살 때 쓰는 기본 단위예요.
    example_gloss: 1킬로그램 주세요.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: 반 킬로
    note: полкило는 пол-("절반")과 кило(килограмм의 구어체 줄임말)가 합쳐진 말이에요.
    example_gloss: 반 킬로 주세요.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: 개(낱개)
    note: штука는 낱개를 셀 때 써요. пять штук에서는 숫자 пять 뒤에 복수 생격을 써요.
    example_gloss:
    - 한 개 주세요.
    - 다섯 개 주세요.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: 토마토, 오이
    note: 둘 다 복수형 채소 명사예요. помидоры와 огурцы는 모두 남성 명사예요.
    example_gloss:
    - 토마토 있어요?
    - 오이 있어요?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: 감자, 양배추
    note: картофель는 남성 집합 명사(셀 수 없는 명사처럼 씀)이고 капуста는 여성 명사예요.
    example_gloss:
    - 감자 있어요?
    - 양배추 있어요?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: 사과, 오렌지
    note: кило яблок("사과 1킬로")처럼 кило 뒤에는 복수 생격 яблок을 써요. кило апельсинов도 같은 방식이에요.
    example_gloss:
    - 사과 1킬로에 얼마예요?
    - 오렌지 1킬로에 얼마예요?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: …이 있어요? (격식)
    note: 격식을 갖춘 вас를 쓰며, 가게 주인에게 물건이 있는지 물을 때 쓰는 기본 표현이에요.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: 네, …이 있어요.
    note: 'У меня есть(직역: "내게 있다")는 "나는 ~을 가지고 있다"라고 말하는 기본 표현으로, 가게 주인이 대답할 때 써요.'
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: 손님이 토마토가 있는지 물어요
    gloss: '손님: 토마토 있어요?'
    note: 손님은 정중한 У вас есть ...? 질문으로 말을 시작해요.
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: 판매원이 있다고 대답해요
    gloss: '판매원: 네, 있어요.'
    note: Да, есть는 물건 이름을 반복하지 않고 쓰는 짧고 일상적인 대답으로, 직역하면 "네, 있어요"예요.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: 손님이 가격을 물어요
    gloss: '손님: 사과 1킬로에 얼마예요?'
    note: кило 뒤에는 яблок처럼 복수 생격이 와요.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: 판매원이 가격을 말해요
    gloss: '판매원: 200루블이에요.'
    note: Двести는 "200"이라는 뜻이고, сто처럼 뒤에 복수 생격 рублей가 와요.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: 손님이 1킬로를 사요
    gloss: '손님: 사과 1킬로그램 주세요.'
    note: lesson02에서 배운 Дайте ..., пожалуйста에 килограмм яблок("사과 1킬로그램")을 붙인 표현이에요.
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: 판매원이 물건을 건네줘요
    gloss: '판매원: 네, 여기 있어요.'
    note: 여기서 Пожалуйста는 판매원이 물건을 건네며 하는 "여기 있어요"라는 뜻이에요. "부탁합니다"가 아니에요.
