teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: ~까지 어떻게 가요?
    note: Как дойти до...?는 낯선 사람에게 목적지로 가는 길을 정중하게 물을 때 쓰는 기본 표현이에요. 뒤에 목적지를 생격으로 써요.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: 박물관
    note: музей는 남성 명사예요. музея는 그 생격형으로, до('~까지') 뒤에서 쓰여요.
    example_gloss: 박물관에 어떻게 가나요?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: 똑바로
    note: прямо는 곧장 가는 것을 나타내요. Идите는 '가세요'라는 뜻의 정중한 명령형이에요.
    example_gloss: 곧장 가세요.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: 오른쪽으로
    note: направо는 이동 방향(오른쪽으로 가거나 도는 것)을 나타내요. потом은 '그다음에'라는 뜻이에요.
    example_gloss: 직진하다가 그다음에 오른쪽으로 가세요.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: 왼쪽으로
    note: налево도 이동 방향을 나타내며, направо의 반대예요.
    example_gloss: 왼쪽으로 도세요.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: 돌아 주세요 (정중한 명령)
    note: поверните는 повернуть('돌다')의 정중한 명령형이에요. за углом은 '모퉁이를 돌아서'라는 뜻이에요.
    example_gloss: 모퉁이를 돌아서 왼쪽으로 가세요.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: 블록, 멀리
    note: квартал은 도시의 한 구획(블록)이에요. два 뒤에서는 квартала가 돼요. далеко는 '멀리'라는 뜻이고, отсюда는 '여기서'라는 뜻이에요.
    example_gloss:
    - 두 블록 가세요.
    - 여기서 먼가요?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: 관광객이 길을 물어요
    gloss: '관광객: 실례합니다, 박물관에 어떻게 가나요?'
    note: Турист는 Простите('실례합니다')로 말을 시작한 다음 Как дойти до музея?라고 물어요.
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: 행인이 길을 알려 줘요
    gloss: '행인: 아주 간단해요. 두 블록 직진하신 다음 오른쪽으로 도세요.'
    note: Прохожий는 Это очень просто라고 답한 다음, Идите와 поверните로 두 단계 안내를 해요.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: 관광객이 먼지 물어요
    gloss: '관광객: 여기서 먼가요?'
    note: Это далеко отсюда?는 걸어갈 거리를 확인하는 후속 질문이에요.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: 행인이 걸리는 시간을 알려 줘요
    gloss: '행인: 아니요, 걸어서 5분이에요.'
    note: Прохожий는 Нет, пять минут пешком('걸어서')라고 답해요.
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: 관광객이 행인에게 감사해요
    gloss: '관광객: 정말 감사합니다.'
    note: Спасибо большое로 대화를 공손하게 마무리해요.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: 행인이 대답해요
    gloss: '행인: 천만에요.'
    note: Пожалуйста는 спасибо에 대한 '천만에요'라는 대답이에요.
