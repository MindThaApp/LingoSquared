teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: 성함이 어떻게 되세요? (격식); 이름이 뭐니? (편한 말)
    note: Как вас зовут?는 격식 있는 вас를 쓰며, 낯선 사람이나 공손해야 하는 자리에서 써요. Как тебя зовут?는 편한 тебя를 쓰며, 친구, 어린이, 또래에게 써요.
    example_gloss:
    - 안녕하세요! 성함이 어떻게 되세요?
    - 안녕! 이름이 뭐야?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: 제 이름은 빅토르예요.
    note: Меня зовут(직역하면 "사람들이 저를 ~라고 불러요")는 말투와 상관없이 러시아어로 이름을 말하는 기본 표현이에요.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: 제 이름은 안나예요.
    note: 이름만 다를 뿐 같은 Меня зовут ... 형태예요. 이 표현은 말하는 사람의 성별에 따라 바뀌지 않아요.
  ru.a1.unit02.lesson01.teach.register_note:
    title: 알맞은 질문 고르기
    gloss: Как вас зовут?는 공손하게 묻거나 낯선 사람에게 쓰고, Как тебя зовут?는 친구, 어린이, 또래에게 써요.
    note: 여기서의 격식/비격식 구분은 lesson02에서 자세히 배우는 вы/ты의 구분과 같아요. вас와 тебя는 각각 вы와 ты의 목적격 형태예요.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: 당신/여러분 (격식); 너 (편한 말)
    note: 한국어에도 존댓말과 반말의 구분이 있듯이 러시아어도 "너"를 둘로 나눠요. вы는 낯선 사람, 윗사람, 업무 자리에서 쓰고, ты는 친구, 가족, 어린이에게 써요. 다만 한국어처럼 동사 어미 전체가 아니라 주로 대명사와 동사 인칭 형태가 달라져요.
    example_gloss:
    - 어디에서 오셨어요? (격식)
    - 어디에서 왔어? (편한 말)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: 각각 언제 쓸까요?
    gloss: Вы는 격식체로, 낯선 사람, 직장, 윗사람에게 써요. Ты는 편한 말로, 친구, 가족, 어린이에게 써요.
    note: вы를 기대하는 사람에게 ты를 쓰면 너무 허물없거나 무례하게 들릴 수 있어요. 확실하지 않으면 вы로 시작하세요.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: 우리 말을 편하게 놓아도 될까요? (ты)
    note: 사이가 충분히 친해졌을 때 격식체 вы에서 편한 ты로 바꾸자고 공손하게 제안하는 표현이에요.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: 우리 말을 편하게 놓아요. (ты)
    note: Можно на ты?와 같은 말투 전환을 조금 더 직접적으로, 권하듯이 제안하는 표현이에요.
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: 어디에서 오셨어요?
    note: 격식체 вы를 써서, 첫 만남이나 업무 자리의 말투에 어울려요.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: 어디에서 왔어?
    note: 편한 말 형태로, 이미 잘 아는 사람에게 써요.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: 저는 캐나다에서 왔어요.
    note: Из("~에서")는 생격을 취해서 여기서는 Канада가 Канады로 바뀌어요. 격 문법은 나중에 자세히 배우지만, 출신을 말할 때 쓰는 이 생격 형태를 눈여겨보세요.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: 저는 모스크바에서 왔어요.
    note: Я из Канады와 같은 출신 생격 형태예요. из 뒤에서 Москва가 Москвы로 바뀌어요.
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: 우리 서로 소개해요.
    note: 처음 만난 사람들이 자기소개를 시작할 때 흔히 쓰는 공손한 표현이에요.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: 만나서 반갑습니다
    note: 상대가 막 이름을 말했을 때 하는 기본적이고 공손한 대답이에요.
    example_gloss: 제 이름은 존이에요. -- 만나서 반갑습니다.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: 이리나 페트로브나가 소개를 시작해요
    gloss: '이리나 페트로브나: 안녕하세요! 서로 소개해요. 제 이름은 이리나 페트로브나예요.'
    note: 이리나 페트로브나는 격식 있는 사무실에서 존을 처음 만나기 때문에 공손한 Здравствуйте를 쓰고 처음부터 끝까지 вы 말투를 써요.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: 존이 이름으로 답해요
    gloss: '존: 만나서 반갑습니다. 제 이름은 존이에요.'
    note: 존은 Очень приятно로 이리나 페트로브나의 격식 있고 공손한 말투에 맞춰요.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: 이리나 페트로브나가 존의 출신을 물어요
    gloss: '이리나 페트로브나: 존, 어디에서 오셨어요?'
    note: 사무실이라는 상황에 맞게 격식 있는 Откуда вы를 써요.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: 존이 대답하고 되물어요
    gloss: '존: 저는 캐나다에서 왔어요. 당신은 어디에서 오셨어요?'
    note: 존은 출신을 말하고 А вы откуда?로 공손하게 되물어요.
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: 이리나 페트로브나가 대답해요
    gloss: '이리나 페트로브나: 저는 모스크바에서 왔어요.'
    note: lesson02에서 배운 출신 생격 형태를 써서 대화를 마무리해요.
