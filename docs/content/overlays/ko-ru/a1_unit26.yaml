    correct_option: Лена высокая а Игорь невысокий
    accepted_answers:
    - value: Лена высокая а Игорь невысокий
      status: correct
    feedback: Лена высокая, а Игорь невысокий.
  ru.a1.unit26.lesson01.exercise05.listen_dedushka_staryy:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Дедушка старый
    accepted_answers:
    - value: Дедушка старый
      status: correct
    feedback: 완성된 문장은 Дедушка старый.예요.
  ru.a1.unit26.lesson01.exercise06.translate_molodoy:
    instruction: '러시아어로 번역하세요: 젊은.'
    accepted_answers:
    - value: молодой
      status: correct
    feedback: Молодой는 '젊은'이라는 뜻이에요.
    prompt_blocks:
