teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Высокий*는 키가 큰 사람을, *невысокий*는 키가 작은 사람을 나타내요(직역하면 ''크지 않은''). 어미는 성에 따라 바뀌어요: *высокая*, *невысокая*.'
    example_gloss:
    - 레나는 키가 커요.
    - 이고르는 키가 작아요.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: 여기서 *Старый*와 *молодой*는 정확한 나이가 아니라 전반적인 나이 인상을 나타내요.
    example_gloss:
    - 할아버지는 나이가 많으세요.
    - 디마는 젊어요.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: 형용사는 성에 따라 바뀌어요
    gloss: '형용사는 사람에 맞춰 형태가 바뀌어요: *он высокий, она высокая*; *он старый, она старая*.'
    note: 남성 형용사는 *-ый*, *-ий*, *-ой*로 끝나요(*высокий*, *молодой*). 여성 형용사는 *-ая*로 끝나요(*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: 레나는 키가 크고 이고르는 키가 작아요
    gloss: 레나는 키가 크고 이고르는 키가 작아요.
    note: '두 문장을 *а*(''반면에, 그리고'')로 나란히 놓아요: *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: 머리카락
    gloss: 머리카락
    note: '러시아어에서 *Волосы*(머리카락)는 복수예요: *У Насти светлые волосы*처럼 쓰고, 단수 명사로는 쓰지 않아요.'
    example_gloss: 디마는 짧은 검은 머리예요.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: '*волосы*에 맞춰 복수형으로 쓰는 머리카락 색깔 세 가지예요: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - 나스탸는 금발이에요.
    - 이고르는 갈색 머리예요.
    - 할아버지는 백발이에요.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Длинные*(긴)와 *короткие*(짧은)도 복수 *волосы*에 맞춰 복수형으로 써요.'
    example_gloss:
    - 레나는 머리가 길어요.
    - 이고르는 짧은 머리예요.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: 형용사는 волосы에 맞춰요
    gloss: '*Волосы*는 복수여서 형용사도 복수예요: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: 복수 형용사는 *-ые* 또는 *-ие*로 끝나요. 다음 수업의 *глаза*에서도 같은 어미가 나와요.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У + 생격
    gloss: '*у* 뒤에서 소유자는 생격이 돼요: *у Насти*(나스탸에게 있다), *у Димы*(디마에게 있다), *у неё*(그녀에게 있다).'
    note: '러시아어는 이렇게 ''가지고 있다''를 표현해요: *у* + 생격 + 소유물. ''가지다''에 해당하는 동사는 쓰지 않아요.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: 디마는 검은 짧은 머리예요
    gloss: 디마는 짧은 검은 머리예요.
    note: '*Чёрные*(검은)는 복수 *волосы*에 맞춘 형태예요. 이 과정에서는 글자 *ё*를 항상 표기해요.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: 나스탸는 긴 금발이에요
    gloss: 나스탸는 긴 금발이에요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  ru.a1.unit26.lesson03.teach.glaza:
    title: 눈
    gloss: 눈
    note: '*Глаза*(눈)는 *глаз*의 복수형이에요. 복수 어미는 *-а*예요.'
    example_gloss: 디마는 갈색 눈을 가졌어요.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '*Голубые*는 하늘색, *карие*는 눈에만 쓰는 갈색, *зелёные*는 초록색이에요. 세 단어 모두 복수예요.'
    example_gloss:
    - 나스탸는 파란 눈이에요.
    - 이고르는 갈색 눈을 가졌어요.
    - 레나는 눈이 초록색이에요.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: 형용사는 глаза에 맞춰요
    gloss: '*Глаза*는 복수여서 형용사도 복수예요: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 갈색 눈은 *коричневые*가 아니라 *карие*라고 하고, 갈색 머리는 *каштановые*라고 해요. 러시아어는 눈과 머리카락에 서로 다른 단어를 써요.
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: 나스탸는 어떻게 생겼어요?
    gloss: 나스탸는 어떻게 생겼어요?
    note: '*Как выглядит ...?*는 이 단원의 핵심 질문이에요. 동사 *выглядит*는 단수 주어에 맞춘 형태예요.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: 나스탸는 긴 금발에 파란 눈이에요
    gloss: 나스탸는 긴 금발에 파란 눈이에요.
    note: '모범 답안은 머리카락과 눈을 *и*로 이어요: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: 나스탸가 니나를 소개해요
    gloss: '나스탸: 어학 카페에 새로운 여자애가 올 거야. 이름은 니나야.'
    note: '*Придёт*(올 것이다)는 완료상 미래형이에요. *Её зовут Нина*는 직역하면 ''사람들이 그녀를 니나라고 불러요''예요.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: 디마가 어떻게 생겼는지 물어봐요
    gloss: '디마: 좋아! 그 애는 어떻게 생겼어?'
    note: 같은 핵심 질문인데, 이번에는 이름 대신 *она*(그녀)를 써요.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: 나스탸가 니나의 키와 머리카락을 묘사해요
    gloss: '나스탸: 키가 작고 짧은 금발이야.'
    note: 1과의 *невысокая*와 2과의 머리카락 단어를 합친 문장이에요. *И у неё*로 두 번째 정보를 덧붙여요.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: 디마가 눈에 대해 물어봐요
    gloss: '디마: 그럼 눈은 어때?'
    note: '*Какие у неё глаза?*에는 *у неё*(''그녀에게 있다'')를 써요. *Неё*는 전치사 *у* 뒤에 오는 *она*의 형태예요.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: 나스탸가 니나의 눈을 묘사해요
    gloss: '나스탸: 초록색 눈이야.'
    note: 3과의 *зелёные глаза*를 다시 쓰고, '그녀에게 있다'는 *у неё*로 표현해요.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: 디마가 그녀를 알아볼 거예요
    gloss: '디마: 고마워! 그럼 알아볼 수 있겠다.'
    note: '*Я её узнаю*(나는 그녀를 알아볼 거예요): 니나가 목적어이므로 *её*는 *она*의 대격이에요.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: 이고르와 레나 비교하기
    gloss: 이고르와 레나는 오빠와 여동생(또는 남매)이지만 생김새가 서로 달라요. 이고르는 키가 작고 짧은 갈색 머리에 갈색 눈이에요. 레나는 이고르보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 너는 어떻게 생겼어?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      брат: 남자 형제
      сестра: 여자 형제
      выглядят: ~해 보이다
      по-разному: 다른
      невысокий: 키가 작은
      короткие: 키가 작은
      каштановые: 갈색의
      волосы: 머리카락
      карие: 갈색의
      глаза: 눈
      выше: 키가 더 큰
      длинные: 긴
      зелёные: 초록색
      выглядишь: 너는 ~처럼 보여요 / 생겼어요 (как ты выглядишь?에서처럼)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: выше로 비교하기
    gloss: '*выше*(더 큰) 뒤에서는 비교 대상이 생격이 돼요: *Лена выше Игоря*.'
    note: 비교급 *выше*는 성에 따라 바뀌지 않아요. 비교 대상은 생격으로 쓰거나 *чем* 뒤에 와요.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: 레나는 이고르보다 머리가 길어요
    gloss: 레나는 이고르보다 머리가 길어요.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее*는 형태가 바뀌지 않고, *чем*(~보다)이 두 번째 부분을 이끌어요.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '자신의 외모를 말하는 모범 문장이에요: *У меня*(''나에게 있다'') + 형용사 + 명사.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: 디마가 니나를 발견해요
    gloss: '디마: 봐, 저 애가 니나야? 짧은 금발에 초록색 눈이야.'
    note: '*Смотри*(봐)는 친구 사이에 쓰는 명령형이고, 앞선 대화에서도 같은 방식으로 썼어요.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: 나스탸가 확인해 줘요
    gloss: '나스탸: 응, 니나 맞아!'
    note: 짧고 자연스러운 확인 표현이에요.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: 니나가 디마에게 인사해요
    gloss: '니나: 안녕, 네가 디마야?'
    note: 간단한 반말 질문이에요. 러시아어에는 'be' 동사가 필요 없어서 *Ты Дима?*라고만 해요.
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: 디마도 니나에게 인사해요
    gloss: '디마: 응! 만나서 반가워, 니나.'
    note: '*Приятно познакомиться*는 처음 만난 사람에게 하는 기본 인사말이에요. *Познакомиться*는 새로운 사람과 알게 된다는 뜻이에요.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화의 마무리예요. 디마는 나스탸의 설명 덕분에 니나를 잘 알아봤어요.
