  ru.a1.unit01.lesson01.script_ramp:
    title: 키릴 문자 만나기
  ru.a1.unit01.lesson02.vremya_dnya:
    title: 시간대별 인사말
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: 안부 묻기와 작별 인사
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: 읽는 방향
    gloss: 러시아어 알파벳은 한국어처럼 왼쪽에서 오른쪽으로 읽어요.
    note: 러시아어(키릴 문자)는 한국어와 같은 방향으로 읽어요. 그래서 새로운 읽기 방향에 익숙해질 필요 없이 새 글자의 모양과 소리만 익히면 돼요.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: 글자 З (즈)
    note: 영어 "zoo"의 "z"처럼 발음해요. 소문자 з는 숫자 3과 비슷하게 생겼어요.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: 글자 Д (드)
    note: 영어 "door"의 "d"처럼 발음해요. 소문자 д는 대문자를 작게 만든 모양에 줄 아래로 짧은 "발"이 있어요. 라틴 문자 "d"와는 전혀 닮지 않았으니 새 모양으로 익히세요.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: 글자 Р (르)
    note: 혀를 굴려 내는 "r" 소리예요. 한국어 "ㄹ"보다 혀를 더 떨어 주세요. 라틴 문자 "P"와 똑같이 생겼지만 "p" 소리가 아니니 주의하세요.
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: 글자 А (아)
    note: 한국어 "ㅏ"처럼 발음해요. 라틴 문자 "A/a"와 모양도 같고 소리도 비슷해요.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: 글자 В (브)
    note: 영어 "van"의 "v"처럼 윗니를 아랫입술에 대고 발음해요. 라틴 문자 "B"와 똑같이 생겼으니 헷갈리지 마세요.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: 글자 С (스)
    note: '"sun"의 "s"처럼 발음해요. 라틴 문자 "C/c"와 모양이 같지만 러시아어에서는 "k" 소리가 나지 않아요.'
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: 글자 Т (트)
    note: '"top"의 "t"처럼 발음해요. 소문자 т는 손글씨에서 작은 "m"처럼 쓰기도 하지만, 우선 여기 나온 인쇄체 모양부터 익히세요.'
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: 글자 У (우)
    note: 한국어 "ㅜ"처럼 발음해요. 라틴 문자 "y"와 닮았지만 소리는 전혀 달라요.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: 글자 Е (예)
    note: 단어나 음절의 처음에서는 "예"처럼 발음해요. 라틴 문자 "E/e"와 모양이 같지만 소리는 꽤 달라요.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ와 ь: 경음 부호와 연음 부호'
    gloss: 경음 부호 ъ와 연음 부호 ь는 자기 소리가 없어요. 옆에 있는 글자의 발음을 바꿔 줄 뿐이에요.
    note: 이 두 부호는 혼자서는 소리를 내지 않아요. ь는 앞의 자음을 부드럽게 하고, ъ는 소리를 확실히 끊어 줘요. 실제 단어에서 다시 나올 거예요.
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: 글자 Й (짧은 이)
    note: 영어 "boy"의 "y"처럼 발음해요. 완전한 모음이 아니라 짧게 스치는 소리예요. 이 수업의 목표 단어인 Здравствуйте에 들어 있어요.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: 안녕하세요 (격식)
    note: 격식을 갖춘 완전한 인사말이에요. 길고 자음이 많아 보이지만, 모든 글자를 이 수업에서 이미 배웠어요.
    example_gloss: 안녕하세요! 제 이름은 빅토르예요.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: 안녕하세요 (격식); 안녕 (편한 말투)
    note: Здравствуйте는 하루 중 언제나, 처음 보는 사람에게도 쓸 수 있는 안전한 격식 인사예요. Привет은 친구나 또래에게 쓰는 편한 인사예요.
    example_gloss:
    - 안녕하세요! 잘 지내세요? (격식)
    - 안녕! 잘 지내? (편한 말투)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: 좋은 아침이에요
    note: 아침, 대략 늦은 아침까지 쓰는 인사예요.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: 안녕하세요
    note: 낮에 쓰는 기본 인사로, 늦은 아침부터 오후까지 쓸 수 있어요.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: 좋은 저녁이에요
    note: 저녁에 어딘가에 도착했을 때 쓰는 인사예요. 만났을 때 하는 인사이고, 헤어질 때 하는 말이 아니에요.
  ru.a1.unit01.lesson02.teach.register_note:
    title: 인사말 고르기
    gloss: Здравствуйте는 하루 중 언제나, 공손하게 말해야 하는 자리에서도 쓸 수 있어요. Привет은 친구 사이에서 쓰는 편한 인사예요.
    note: 시간대나 상대가 헷갈릴 때는 Здравствуйте가 늘 안전해요. Привет은 이미 잘 아는 사람에게만 쓰세요.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: 잘 지내? (편한 말투)
    note: 친구나 또래에게 안부를 묻는 일상적인 편한 표현이에요.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: 어떻게 지내세요?
    note: 안부를 묻는 격식 있는 표현으로, вы를 쓰는 말투에 맞아요.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: 좋아요, 고마워요
    note: 격식·비격식 모두 쓸 수 있는 간단하고 긍정적인 대답이에요.
    example_gloss: 잘 지내? — 좋아, 고마워.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: 그저 그래요
    note: 아주 좋지도 나쁘지도 않을 때 쓰는, 중립적이거나 약간 부정적인 대답이에요.
    example_gloss: 잘 지내? — 그저 그래.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: 너는?
    note: 상대방에게 같은 질문을 되묻는 편한 표현으로, ты를 쓰는 말투에 맞아요.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: 안녕히 계세요 (중립/격식)
    note: 어디서나 쓰는 기본 작별 인사예요. 글자 그대로는 "다시 만날 때까지"에 가까워요.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: 잘 가 (편한 말투)
    note: 친구나 아는 사람 사이에서 아주 흔히 쓰는 편한 작별 인사예요.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: 내일 봐요
    note: 다음 날 다시 만날 사람에게 하는 다정한 작별 인사예요.
  ru.a1.unit01.lesson03.teach.anna:
    title: 안나가 막심에게 인사해요
    gloss: '안나: 안녕하세요! 잘 지내요?'
    note: 안나와 막심은 낮에 인사를 나누는 동료예요. дела가 쓰였으니 편한 말투예요.
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: 막심이 대답하고 되물어요
    gloss: '막심: 좋아요, 고마워요. 당신은요?'
    note: 막심이 대답한 뒤 안나의 말투에 맞춰 편하게 되물어요.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: 안나가 대화를 마무리해요
    gloss: '안나: 저도 좋아요. 그럼, 내일 봐요!'
    note: 안나가 가벼운 대화를 마치고 다정하게 작별 인사를 해요.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: 막심이 작별 인사를 해요
    gloss: '막심: 내일 봐요!'
    note: 막심이 안나의 작별 인사를 따라 하며 대화를 마무리해요.
