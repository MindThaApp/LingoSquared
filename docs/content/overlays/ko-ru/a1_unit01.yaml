course:
  title: 러시아어 A1
  description: 일상적인 인사와 짧은 사교 대화에 쓰이는 A1 수준의 러시아어를 배워요. 키릴 문자와 вы/ты 존칭 구분을 한국어로 자세히 설명해 드려요.
units:
