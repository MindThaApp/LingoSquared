  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: 지금 1시예요.
    note: '"Час"만 쓰면 "1시"라는 뜻이에요. 러시아어에서는 2 이상의 숫자 규칙과 달리 여기서 "один час"라고 하지 않아요.'
