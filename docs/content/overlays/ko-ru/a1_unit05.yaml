    note: 승객은 역 직원에게 말을 걸기에 알맞은 Скажите, пожалуйста로 공손하게 시작해요.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: 직원이 대답해요
    gloss: '직원: 지금 아침 7시예요.'
    note: Сейчас семь часов утра는 утра("아침에")를 붙여 현재 시각을 분명하게 말해요.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: 승객이 기차에 대해 물어요
    gloss: '승객: 그럼 기차는 언제 떠나요?'
    note: А는 승객의 이어지는 질문을 자연스럽게 시작해 줘요.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: 직원이 출발 시각을 알려 줘요
    gloss: '직원: 아침 8시에요.'
    note: В восемь часов утра는 전치사 в에 시각과 시간대 단어를 붙여 대답한 거예요.
