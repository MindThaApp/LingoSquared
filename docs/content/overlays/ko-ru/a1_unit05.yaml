    gloss: 저녁에, 밤에
    note: утром/днём과 같은 조격 부사 형태예요.
    example_gloss:
    - 저녁에 저는 집에 있어요.
    - 밤에 저는 자요.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: 오후 2시에요.
    note: 시각 뒤에 дня(день의 생격)를 붙이면 새벽 2시가 아니라 오후 2시라는 뜻이 분명해져요.
    example_gloss: 회의가 몇 시예요? — 오후 2시예요.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: 저녁 7시에요.
    note: вечера(вечер의 생격)는 이 7시가 저녁 7시라는 것을 분명히 해 줘요.
    example_gloss: 상점은 저녁 7시에 문을 닫아요.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: 실례지만, 지금 몇 시예요?
    note: Скажите, пожалуйста는 질문을 부드럽게 해 줘요. 모르는 사람에게 물을 때 알맞아요.
