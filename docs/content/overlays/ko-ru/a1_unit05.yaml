  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: 2시, 3시
    note: два와 три 뒤에서는 час가 단수 생격형 часа가 돼요. 3과에서 배운 수사와 명사의 규칙과 같아요.
    example_gloss:
    - 지금 2시예요.
    - 지금 3시예요.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: 5시, 10시
    note: пять부터는 час가 복수 생격형 часов로 바뀌어요. 이것도 3과의 5 이상 규칙과 같아요.
    example_gloss:
    - 지금 5시예요.
    - 지금 10시예요.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: 몇 시에요?
