  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: 아침에, 낮에
    note: утро와 день의 부사형(조격)이에요. 전치사 없이 써요.
    example_gloss:
    - 아침에 저는 커피를 마셔요.
    - 낮에 저는 일해요.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
