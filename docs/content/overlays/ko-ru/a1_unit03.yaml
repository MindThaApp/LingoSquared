teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: 저는 ~이(가) 있어요
    note: 직역하면 "내 곁에 ~이(가) 있다"는 뜻이에요. 러시아어에서 "가지고 있다"를 나타내는 표준 표현이고, 한국어의 "나에게 ~이 있다"와 비슷해요.
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: 하나, 둘
    note: два 뒤에서는 명사가 단수 생격 형태가 돼요. брат(남자 형제)는 복수형이 아니라 брата가 돼요.
    example_gloss:
    - 저는 남자 형제가 한 명 있어요.
    - 형제가 두 명 있어요.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: 셋, 넷
    note: Три와 четыре도 два처럼 명사가 단수 생격 형태가 돼요. книга(책)는 два/три/четыре 뒤에서 книги가 돼요.
    example_gloss:
    - 저는 책이 세 권 있어요.
    - 저는 책이 네 권 있어요.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: 오
    note: пять(5)부터는 명사가 복수 생격 형태가 돼요. рубль(루블)는 рубли가 아니라 рублей가 돼요.
    example_gloss: 저는 5루블이 있어요.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: 남자 형제; 남자 형제들 (2~4 뒤)
    note: брата는 два, три, четыре 뒤에서만 쓰는 단수 생격 형태예요. 일반적인 복수형이 아니에요.
    example_gloss: 형제가 두 명 있어요.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: 책; 책들 (2~4 뒤)
    note: книги는 брата와 같은 단수 생격 형태로, два, три, четыре 뒤에서 써요.
    example_gloss: 저는 책이 세 권 있어요.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: 루블; 루블들 (5 이상)
    note: рублей는 пять(5) 이상의 수 뒤에서 쓰는 복수 생격 형태예요.
    example_gloss: 저는 5루블이 있어요.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: 여섯, 일곱
    note: пять처럼 шесть와 семь 뒤에서도 명사는 복수 생격 형태가 돼요.
    example_gloss:
    - 여섯 시예요.
    - 저는 7루블이 있어요.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: 여덟, 아홉
    note: 둘 다 복수 생격 패턴이 이어져요. книга는 книг가 되고, рубль는 рублей가 돼요.
    example_gloss:
    - 저는 책이 여덟 권 있어요.
    - 저는 9루블이 있어요.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: 십
    note: '나이를 말할 때도 써요. 예: Мне десять лет ("저는 열 살이에요").'
    example_gloss: 저는 열 살이에요.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: 책들 (복수 생격, 5 이상)
    note: книга의 복수 생격 형태로 пять 이상의 수 뒤에서 써요. 끝의 모음이 완전히 없어진다는 점이 два/три/четыре 뒤의 книги와 달라요.
    example_gloss: 저는 책이 아홉 권 있어요.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: 저는 열 살이에요.
    note: 러시아어에서는 나이를 "~이다" 같은 동사 없이, 여격 мне("나에게") + 숫자 + лет("년"의 복수 생격)으로 나타내요.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: 연세가 어떻게 되세요?
    note: 격식을 갖춘 여격 вам을 써서, 2과에서 배운 вы 말투와 맞아요.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: 이건 얼마예요?
    note: 물건 하나의 가격을 물을 때 쓰는 표준 표현이에요. стоит("값이 나가다", 단수)를 써요.
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: 사과는 얼마예요?
    note: яблоки("사과들")가 복수라서 стоит가 아니라 복수형 стоят를 써요. Сколько это стоит?의 단수 стоит와 달라요.
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: 루블 (1); 루블 (2~4); 루블 (5 이상)
    note: '"루블"이라는 단어는 앞의 숫자에 따라 형태가 바뀌어요. 1 뒤에는 рубль, два/три/четыре 뒤에는 рубля, пять 이상 뒤에는 рублей를 써요.'
    example_gloss:
    - 이것은 1루블이에요.
    - 이것은 2루블이에요.
    - 이것은 5루블이에요.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: 손님이 판매자에게 인사해요
    gloss: '손님: 안녕하세요! 사과는 얼마예요?'
    note: 시장 가판대의 손님은 가격을 묻기 전에 Здравствуйте로 공손하게 말을 시작해요.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: 판매자가 대답해요
    gloss: '판매자: 3루블이에요.'
    note: Три рубля는 три에 맞춰 "루블"의 2~4용 단수 생격 형태를 써요.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: 손님이 빵 가격을 물어봐요
    gloss: '손님: 그럼 빵은 얼마예요?'
    note: 손님은 А("그럼, 그리고")를 써서 두 번째 물건에 대해 자연스럽게 이어서 물어봐요.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: 판매원이 다시 대답해요
    gloss: '판매원: 6루블이에요.'
    note: Шесть рублей는 шесть에 맞게 5 이상에 쓰는 복수 생격형을 써요.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: 손님이 공손하게 마무리해요
    gloss: '손님: 좋아요, 감사합니다!'
    note: Хорошо, спасибо!는 인사 단원에서 배운 어휘를 다시 써서 시장 대화를 훈훈하게 마무리해요.
