teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: 동물, 반려동물
    gloss: 동물 / 반려동물
    note: '*Животное*는 ''동물''을 뜻하는 일반적인 말이에요. *Домашнее животное*(직역하면 ''집 동물'')는 특히 ''반려동물''을 뜻해요.'
    example_gloss:
    - 개는 동물이에요.
    - 개는 반려동물이기도 해요.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: 개와 고양이
    gloss: 개 / 고양이
    example_gloss:
    - 나스탸에게는 개가 있어요.
    - 이고르에게는 고양이가 있어요.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: 물고기와 새
    gloss: 물고기 / 새
    example_gloss:
    - 할아버지에게는 물고기가 있어요.
    - Nina에게는 새가 있어요.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: '*У тебя есть ...?*는 ''~이 있어요?''라고 묻는 표현이에요: *у тебя*(''너에게'') + *есть* + 대상.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: 이 단원의 새 어휘를 사용한 간단한 긍정 대답이에요.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: '*Нет* + 생격은 무언가가 없다는 뜻이에요: *у меня нет домашнего животного*. 문법 설명을 참고하세요.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет와 생격
    gloss: '*нет* 뒤에서 없는 것은 생격이 돼요: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: '긍정문과 비교해 보세요: *у меня есть собака*(주격)이지만 *у меня нет собаки*(생격)예요.'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: '*Гулять с собакой*는 *с*와 조격 *собакой*를 써요. 문법 설명을 참고하세요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С와 조격
    gloss: '*с*(~와 함께) 뒤에서 명사는 조격이 돼요: *гулять с собакой*, *играть с кошкой*.'
    note: '여성 명사의 조격은 *-ой* 또는 *-ей*로 끝나요: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: 먹이를 주다
    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: 이고르는 자기 고양이와 놀아요.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: '*Каждый день*(매일)는 전치사 없이 쓰는 시간 표현이에요: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: '*Кормить*는 동물을 대격 직접 목적어로 취해요: *кошка*가 *кошку*가 돼요.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: любить 뒤의 동물
    gloss: '*любить* 뒤에서 동물 명사는 대격이 되는데, 유정 명사의 복수 대격은 생격 복수와 같아요: *собак*, *кошек*, *птиц*, *рыб*.'
    note: 동물 명사를 예로 들어 처음 소개하는 러시아어의 규칙적인 복수형 패턴이에요.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: 개와 고양이
    gloss: 개들 / 고양이들
    example_gloss:
    - 디마는 개를 좋아해요.
    - 레나는 고양이를 아주 좋아해요.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: 물고기와 새 (복수)
    gloss: 물고기들 / 새들
    example_gloss:
    - 저는 물고기를 아주 좋아해요.
    - 할아버지는 새를 아주 좋아하세요.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: 저는 동물을 아주 좋아해요
    gloss: 저는 동물을 정말 좋아해요.
    note: '*Люблю* + 대격: *Я люблю животных*. 유정 복수 명사의 대격은 생격과 같은 모양이에요.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: 레나는 고양이를 좋아하지만 반려동물이 없어요
    gloss: 레나는 고양이를 아주 좋아하지만 반려동물은 없어요.
    note: 이 단원의 읽기 글에 나오는 대비를 미리 보여 주는 문장이에요.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: 디마가 반려동물에 대해 물어요
    gloss: '디마: 나스탸, 너 반려동물 있어?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: 나스탸에게는 개가 있어요
    gloss: '나스탸: 응, 나는 개가 있어.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: 디마가 어떻게 생겼는지 물어요
    gloss: '디마: 어떻게 생겼어?'
    note: '*Как он выглядит?*라는 질문은 동물에게도 쓸 수 있어요. 수컷 반려동물에게는 *он*(그)을 써요.'
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: 나스탸가 자기 개를 묘사해요
    gloss: '나스탸: 갈색 털이고 작아.'
    note: 외모 단원에서 배운 머리 색과 크기 표현을 이번에는 사람의 머리카락이 아니라 동물의 털을 설명하는 데 써요.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: 동물에게 쓰는 он과 она
    gloss: '반려동물도 사람처럼 *он* 또는 *она*가 될 수 있어요: *У меня собака, он маленький*.'
    note: 문법적으로 *собака*는 여성이지만, 러시아 사람들은 반려동물이 수컷인 걸 알면 *он*이라고 자주 말해요.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: 디마가 산책에 대해 물어요
    gloss: '디마: 매일 그 애랑 산책해요?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: 나스탸가 일과를 이야기해요
    gloss: '나스탸: 네, 매일 그 애랑 산책하고 먹이도 줘요.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: 동물에 대한 디마, 레나, 이고르의 이야기
    gloss: 디마와 레나는 둘 다 동물을 좋아하지만, 둘 다 반려동물이 없어요. 디마는 개를 좋아하고 레나는 고양이를 좋아해요. 그런데 이고르에게는 반려동물이 있어요. 바로 고양이예요. 이고르는 고양이와 자주 놀고 매일 먹이를 줘요. 당신은 반려동물이 있어요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      любят: 사랑해요
      оба: 둘 다
      животных: 동물들
      обоих: 둘 다
      домашнего: 반려동물
      собак: 개들
      кошек: 고양이들
      кошка: 고양이
      играет: 놀아요
      даёт: 줘요
      каждый: 매
      корм: 먹이
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: 이고르는 자주 고양이와 놀아요
    gloss: 이고르는 자기 고양이와 자주 놀아요.
    note: '*Со своей кошкой*: *со*는 자음이 연달아 올 때 *с* 대신 쓰는 형태이고, *своей*는 주어를 다시 가리키는 ''자기 자신의''라는 뜻이에요.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: 저는 개를 좋아해요. 반려동물은 없어요.
    gloss: 저는 개를 좋아해요. 반려동물은 없어요.
    note: 이 단원의 쓰기 과제에 그대로 쓸 수 있는 두 문장짜리 모범 답안이에요.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: 나스탸가 니나에게 물어요
    gloss: '나스탸: 니나, 너도 반려동물 있어요?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: 니나에게는 피코라는 새가 있어요
    gloss: '니나: 응, 새를 키워. 이름은 피코야.'
    note: '*Его зовут Пико*는 직역하면 ''사람들이 그를 피코라고 불러요''예요. 러시아어에서 이름을 말하는 방식이에요.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: 디마가 반응해요
    gloss: '디마: 정말 좋겠어요! 매일 그 애랑 뭐 해요?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: 니나가 매일 먹이를 줘요
    gloss: '니나: 매일 먹이를 줘.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: 디마도 새를 좋아해요
    gloss: '디마: 저도 새를 좋아해요.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: 나스탸가 대화를 마무리해요
    gloss: '나스탸: 우리 셋 다 동물을 좋아하다니 정말 좋아요!'
    note: 이 단원에 나온 세 사람의 동물 이야기를 하나로 마무리해요.
