    note: '*Desayunar* प्रतिवाचक नहीं है: *Desayuno*, *me* के बिना।'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: काम करना
    gloss: काम करना → मैं काम करता/करती हूँ
    note: '*Trabajar* नियमित -ar क्रिया है: इसका *yo* रूप -o पर समाप्त होता है, *trabajo*।'
  es.a1.unit49.lesson01.teach.comer_como:
    title: खाना
    gloss: खाना → मैं खाता/खाती हूँ
    note: '*Comer* नियमित -er क्रिया है: इसका *yo* रूप -o पर समाप्त होता है, *como*।'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: बर्तन धोना
    gloss: बर्तन धोना → मैं बर्तन धोता/धोती हूँ
    note: '*Lavar los platos* प्रतिवाचक नहीं है: *Lavo los platos*। कर्म *los platos* क्रिया के बाद ही रहता है।'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: सोना
    gloss: सोना → मैं सोता/सोती हूँ
    note: '*Dormir* के *yo* रूप में स्वर बदल जाता है: *duermo* (o की जगह ue)।'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: प्रतिवाचक ढाँचा
    gloss: 'levantarse और vestirse के साथ सर्वनाम क्रिया से पहले आता है: levantarse → Me levanto।'
    note: 'प्रतिवाचक क्रियाओं में *me* को रूपांतरित क्रिया से पहले रखिए: *Me levanto* कहिए, *Levanto me* नहीं।'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: वाक्य में Levantarse
    gloss: 'उठना: मैं सात बजे उठता/उठती हूँ।'
    note: 'समय बताने वाला अंश क्रिया के बाद आता है: *Me levanto a las siete*।'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: वाक्य में Vestirse
    gloss: 'कपड़े पहनना: मैं कपड़े पहनता/पहनती हूँ।'
    note: 'ढाँचा है *me* + *visto*: सर्वनाम क्रिया के ठीक पहले रहता है।'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: वाक्य में Lavar los platos
    gloss: 'बर्तन धोना: मैं खाने के बाद बर्तन धोता/धोती हूँ।'
    note: '*Después de comer* ("खाने के बाद") में *de* के साथ क्रिया का मूल रूप आता है और यह वाक्य के अंत में आ सकता है।'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: me के बिना क्रियाएँ
    gloss: 'सर्वनाम के बिना: मैं नाश्ता करता/करती हूँ। मैं काम करता/करती हूँ। मैं सोता/सोती हूँ। ये क्रियाएँ प्रतिवाचक नहीं हैं।'
    note: '*Desayuno*, *trabajo* और *duermo* में *me* नहीं है: ये क्रियाएँ प्रतिवाचक नहीं हैं।'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: साढ़े सात बजे उठना
    gloss: मैं 7:30 बजे उठता/उठती हूँ।
    note: 'स्पेनिश में "साढ़े" के लिए *y media* कहते हैं: *las siete y media* यानी 07:30। समय से पहले *a las* लगाइए।'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: पौने आठ बजे कपड़े पहनना
    gloss: मैं 7:45 बजे कपड़े पहनता/पहनती हूँ।
    note: '*Las ocho menos cuarto* अगले घंटे से पीछे गिनता है: 07:45।'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: आठ बजे नाश्ता करना
    gloss: मैं आठ बजे नाश्ता करता/करती हूँ।
    note: 'समय से पहले *a las* लगाइए: *a las ocho*। एक बजे के लिए *a la una* होता है।'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: नौ से पाँच तक काम करना
    gloss: मैं नौ बजे से पाँच बजे तक काम करता/करती हूँ।
    note: '*De ... a ...* शुरू और खत्म होने का समय बताता है: *de nueve a cinco*।'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: साढ़े छह बजे खाना
    gloss: मैं शाम 6:30 बजे खाना खाता/खाती हूँ।
    note: '*De la tarde* शाम को स्पष्ट कर देता है, इसलिए यहाँ *las seis y media* का मतलब 18:30 है।'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: ग्यारह बजे सोना
    gloss: मैं ग्यारह बजे सोता/सोती हूँ।
    note: 'समय से पहले *a las* लगाइए: *a las once*।'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: पहले, फिर, उसके बाद
    gloss: पहले, फिर, उसके बाद
    note: '*Primero* पहला काम बताता है, *luego* अगला काम और *después* उसके बाद का काम।'
    example_gloss:
    - पहले मैं उठता/उठती हूँ।
    - फिर मैं कपड़े पहनता/पहनती हूँ।
    - उसके बाद मैं नाश्ता करता/करती हूँ।
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: तीन चरणों की सुबह
    gloss: पहले मैं उठता/उठती हूँ। फिर मैं कपड़े पहनता/पहनती हूँ। उसके बाद मैं नाश्ता करता/करती हूँ।
    note: 'प्रतिवाचक क्रियाओं में *me* क्रिया के आगे रहता है: *me levanto*, *me visto*।'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: क्रम बताने वाले शब्द
    gloss: 'Primero, luego और después आपके कामों को क्रम में रखते हैं; क्रिया का रूप नहीं बदलता: Después desayuno।'
    note: 'क्रम बताने वाले शब्द वाक्य के शुरू में आते हैं और क्रिया का रूप नहीं बदलता: *Después desayuno*।'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: मेरा दिन
    gloss: मेरा दिन — मैं 7:30 बजे उठता/उठती हूँ। उसके बाद मैं कपड़े पहनता/पहनती हूँ और आठ बजे नाश्ता करता/करती हूँ। मैं नौ से पाँच तक काम करता/करती हूँ। शाम 6:30 बजे मैं खाना खाता/खाती हूँ। उसके बाद मैं बर्तन धोता/धोती हूँ। ग्यारह बजे मैं सोता/सोती हूँ।
    note: गतिविधियों के क्रम और उनके समय, दोनों पर ध्यान देकर पढ़िए। *me levanto* और *me visto* में *me* को देखिए।
    glosses:
      Mi: मेरा
      día: दिन
      levanto: उठना (me levanto)
      media: साढ़े (y media = साढ़े)
      ocho: आठ
      Después: उसके बाद
      visto: कपड़े पहनना (me visto)
      las: '(घड़ी के समय से पहले आने वाला शब्द: las ocho)'
      desayuno: नाश्ता करना
      Trabajo: काम
      nueve: नौ
      cinco: पाँच
      siete: सात
      tarde: शाम को
      como: खाना
      lavo: बर्तन धोना (lavo los platos)
      once: ग्यारह
      duermo: सोना
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: दिन के बारे में पूछना
    gloss: 'एलेना: मातेओ, तुम्हारा दिन कैसा होता है?'
    note: '*¿Cómo es tu día?* किसी से उसके दिन का हाल बताने को कहने का अनौपचारिक तरीका है; *tu* का मतलब "तुम्हारा" है।'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: मातेओ की सुबह
    gloss: 'मातेओ: मैं साढ़े सात बजे उठता हूँ। उसके बाद मैं कपड़े पहनता हूँ और आठ बजे नाश्ता करता हूँ।'
    note: मातेओ *después* और *y* से सुबह के तीन काम जोड़ता है।
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: मातेओ का कामकाजी दिन
    gloss: 'एलेना: तुम कब काम करते हो? मातेओ: मैं नौ से पाँच बजे तक काम करता हूँ।'
    note: 'एलेना और मातेओ आपस में अनौपचारिक *tú* रूप इस्तेमाल करते हैं: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: मातेओ की शाम
    gloss: 'मातेओ: शाम को साढ़े छह बजे मैं खाना खाता हूँ। उसके बाद मैं बर्तन धोता हूँ। ग्यारह बजे मैं सोता हूँ।'
    note: '*Después* वाक्य की शुरुआत में आता है, फिर भी क्रिया का रूप वही रहता है: *después lavo*।'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: एलेना की सुबह
    gloss: 'एलेना: मैं छह बजे उठती हूँ, लेकिन साढ़े छह बजे तक नाश्ता नहीं करती।'
    note: '*No ... hasta* का मतलब है "...तक नहीं"। एलेना अपने उठने के समय और नाश्ते के समय की तुलना करती है।'
