teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: बाज़ार
    gloss: बाज़ार
    note: '*Mercado* पुल्लिंग है।'
    example_gloss: चलिए बाज़ार चलते हैं।
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: फल, सब्ज़ी
    gloss: फल, सब्ज़ियाँ
    note: '*Verdura* का मतलब आम तौर पर सब्ज़ियाँ (अक्सर हरी) है; यह स्त्रीलिंग एकवचन संज्ञा है, जो सामूहिक अर्थ में भी इस्तेमाल होती है, जैसे हिंदी में "सब्ज़ी" एक साथ कई सब्ज़ियों के लिए कहा जाता है।'
    example_gloss:
    - मैं फल खरीदना चाहता हूँ।
    - सब्ज़ियाँ ताज़ा हैं।
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: अंडे, रोटी
    gloss: अंडे, रोटी
    note: '*Huevos* पहले से बहुवचन है (एकवचन *huevo* है); *pan* (रोटी) रोज़मर्रा के अर्थ में अगणनीय संज्ञा है, जिसका सामान्यतः कोई बहुवचन नहीं होता।'
    example_gloss:
    - मुझे अंडे चाहिए।
    - रोटी आज सुबह की है।
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: कीमत पूछिए
    gloss: इसकी कीमत कितनी है?
    note: '*Cuesta* क्रिया *costar* (कीमत होना) का अन्य पुरुष एकवचन रूप है; यह इस यूनिट की नई क्रिया है।'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: कीमत पूछना, दूसरा रूप
    gloss: यह कितने का है?
    note: इसकी *¿Cuánto cuesta?* से तुलना अगले ग्रामर नोट में देखिए।
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: कीमत बताना
    gloss: इसकी कीमत दो है।
    note: कीमत का एक छोटा, पूरा उत्तर -- मुद्रा या इकाई संदर्भ से समझ ली जाती है, जैसे हिंदी में भी खरीदारी में अक्सर सिर्फ़ संख्या बोल दी जाती है।
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta बनाम Cuánto es
    gloss: कीमत पूछने के दो समान रूप से स्वाभाविक तरीके।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*¿Cuánto cuesta?* (इसकी कीमत कितनी है?) और *¿Cuánto es?* (यह कितने का है?) दोनों कीमत पूछने के स्वाभाविक तरीके हैं -- रोज़ की खरीदारी में इन्हें एक-दूसरे की जगह इस्तेमाल किया जा सकता है।'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: एक दर्जन अंडे माँगिए
    gloss: एक दर्जन अंडे, कृपया।
    note: स्पेनिश में *docena* (दर्जन) संज्ञा है, जिसके बाद हमेशा *de* और वस्तु आती है; हिंदी के "एक दर्जन अंडे" से अलग, जहाँ बीच में कोई शब्द नहीं आता।
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: एक किलो टमाटर माँगिए
    gloss: एक किलो टमाटर, कृपया।
    note: '*Kilo* भी *docena* की तरह *de* और वस्तु वाला ढाँचा अपनाता है।'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: आधा किलो
    gloss: आधा किलो
    note: '*Medio* (आधा) जिस संज्ञा की विशेषता बताता है उससे पहले आता है और लिंग के अनुसार बदलता है (*medio kilo* पुल्लिंग; *media docena* स्त्रीलिंग होगा)।'
    example_gloss: आधा किलो रोटी, कृपया।
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: थोड़ा सा
    gloss: थोड़ा सा
    note: '*Un poco de* अनिश्चित थोड़ी मात्रा के लिए इस्तेमाल होता है, जब सटीक मात्रा बताने की ज़रूरत नहीं होती।'
    example_gloss: मुझे थोड़ा सा फल चाहिए।
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: पूछिए कि और कुछ चाहिए या नहीं
    gloss: क्या आपको और कुछ चाहिए?
    note: '*Necesita*, *necesitar* का *usted* रूप है, यानी वह शिष्ट रूप जो दुकानदार आम तौर पर ग्राहक से बोलता है।'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: कहिए कि सब कुछ आ गया
    gloss: नहीं, मुझे लगता है हमारे पास सब कुछ आ गया है।
    note: '*Creo que* (मुझे लगता है कि) बात को नरम करके कहने का आम तरीका है; यहाँ यह पुष्टि करता है कि खरीदारी की सूची पूरी हो गई है।'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: दुकानदार को धन्यवाद कहिए
    gloss: बहुत बढ़िया, धन्यवाद।
    note: खरीदारी की बातचीत का एक छोटा, स्वाभाविक अंत।
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: कीमत के लेबल पढ़ना
    gloss: 'रोसा की दुकान: टमाटर, दो प्रति किलो। अंडे, चार प्रति दर्जन। रोटी, छह। रोज़ ताज़ा फल।'
    note: 'बाज़ार की दुकान का एक विशिष्ट कीमत-लेबल: पहले चीज़, फिर कीमत, फिर वह इकाई जिसके लिए कीमत है (*el kilo*, *la docena*)। *Puesto* बाज़ार की दुकान या स्टॉल है; यह रोसा चलाती है।'
    glosses:
      Puesto: स्टॉल / दुकान
      tomates: टमाटर
      kilo: किलो
      Huevos: अंडे
      docena: दर्जन
      Pan: रोटी
      Fruta: फल
      fresca: ताज़ा
      todos: हर
      días: दिन
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo यानी "प्रति किलो"
    gloss: कीमत के बाद इकाई शब्द का मतलब उस इकाई "प्रति" कैसे होता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: कीमत के बाद *el kilo* ("tomates, dos el kilo") का मतलब है "प्रति किलो" -- यह कीमत आपके खरीदे हर किलो पर लागू होती है।
  es.a1.unit07.lesson06.teach.line01:
    title: बाज़ार जाने का प्रस्ताव रखना
    gloss: एलेना अगली क्लास की सामग्री के लिए बाज़ार जाने का प्रस्ताव रखती है।
    note: '*Para la próxima clase* का मतलब है "अगली क्लास के लिए" -- यानी कुकिंग वर्कशॉप के अगले सत्र के लिए।'
  es.a1.unit07.lesson06.teach.line02:
    title: सहमति जताएँ और पूछें कि क्या चाहिए
    gloss: मातेओ सहमत होता है और पूछता है कि उन्हें क्या चाहिए।
    note: '*¿Qué necesitamos?* में *necesitar* का *nosotros* रूप है, जो हिंदी के "हमें चाहिए" से मेल खाता है।'
  es.a1.unit07.lesson06.teach.line03:
    title: ताज़े टमाटरों की ओर इशारा करें
    gloss: एलेना कहती है कि पहले सब्ज़ियाँ लेंगे, और बताती है कि टमाटर कितने ताज़े दिख रहे हैं।
    note: '*¡Qué tomates tan frescos!* (कितने ताज़े टमाटर!) *qué* वाला विस्मयादिबोधक वाक्य है, जैसे यूनिट 3 का *¡Qué bonito!*, पर यहाँ संज्ञा के साथ: *qué* + संज्ञा + *tan* + विशेषण।'
  es.a1.unit07.lesson06.teach.line04:
    title: विक्रेता मात्रा पूछता है
    gloss: विक्रेता एलेना से पूछता है कि उसे कितना चाहिए।
    note: '*Señorita* किसी युवा महिला को आदरपूर्वक संबोधित करने का तरीका है, जो ग्राहक के प्रति विक्रेता के *usted* वाले शिष्ट रूप से मेल खाता है (आजकल कुछ लोगों को यह थोड़ा पुराने ढंग का लगता है)।'
  es.a1.unit07.lesson06.teach.line05:
    title: एक किलो मँगवाएँ और दाम पूछें
    gloss: एलेना एक किलो माँगती है और दाम पूछती है।
    note: इस यूनिट में पहले आए *un kilo* और *¿Cuánto cuesta?* को एक स्वाभाविक बातचीत में जोड़ा गया है।
  es.a1.unit07.lesson06.teach.line06:
    title: दाम बताएँ
    gloss: विक्रेता कहता है कि इसकी कीमत दो है।
    note: '*Cuesta dos* -- दाम बताने का छोटा उत्तर, जिसमें मुद्रा संदर्भ से समझी जाती है।'
  es.a1.unit07.lesson06.teach.line07:
    title: मातेओ अंडे और ब्रेड माँगता है
    gloss: मातेओ कहता है कि उसे एक दर्जन अंडे और ब्रेड चाहिए।
    note: इस यूनिट के *huevos*/*pan* को *una docena de* के साथ जोड़ा गया है; *yo* ज़रूरी नहीं है, यह थोड़ा ज़ोर देता है ("मुझे चाहिए...")।
  es.a1.unit07.lesson06.teach.line08:
    title: विक्रेता दोनों के दाम बताता है
    gloss: विक्रेता कहता है कि अंडे चार के हैं और ब्रेड छह की।
    note: '*Cuestan* (बहुवचन, "उनकी कीमत है") बहुवचन कर्ता *los huevos* के अनुसार आता है, जबकि टमाटर के लिए एकवचन *cuesta* था।'
  es.a1.unit07.lesson06.teach.line09:
    title: विक्रेता को धन्यवाद कहें
    gloss: मातेओ कहता है कि बढ़िया, धन्यवाद।
    note: यह वही छोटा समापन है जो इस यूनिट में पहले आया था।
  es.a1.unit07.lesson06.teach.line10:
    title: दोस्त से पूछें कि कुछ और चाहिए क्या
    gloss: एलेना मातेओ से पूछती है कि क्या उसे कुछ और चाहिए।
    note: '*¿Necesitas...?* दोस्त के लिए *tú* रूप है; विक्रेता का *¿Necesita...?* *usted* रूप है।'
  es.a1.unit07.lesson06.teach.line11:
    title: कहें कि सब कुछ है
    gloss: मातेओ कहता है कि नहीं, उसे लगता है उनके पास सब कुछ पहले से है।
    note: '*Creo que* (मुझे लगता है कि) उत्तर को नरम बनाता है; *ya* का अर्थ है "पहले से"।'
