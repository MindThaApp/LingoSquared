teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: टिकट
    gloss: टिकट
    note: '*El billete* पुल्लिंग है, इसलिए इसके साथ *un billete* आता है, *una* नहीं।'
    example_gloss: मुझे टोलेडो का एक टिकट चाहिए।
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: टिकट माँगना
    gloss: मुझे टोलेडो का एक टिकट चाहिए।
    note: '*Quisiera* ("मैं चाहूँगा/चाहूँगी") अनुरोध को नरम बनाता है और *quiero* से अधिक विनम्र है।'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: कर्मचारी पूछता है कि कौन-सा टिकट
    gloss: आप एकतरफ़ा टिकट लेंगे या आने-जाने का?
    note: '*Quiere*, *querer* का औपचारिक *usted* रूप है, जो यहाँ अनजान स्टेशन कर्मचारी के लिए प्रयोग हुआ है।'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: विनम्रता से उत्तर देना
    gloss: आने-जाने का, कृपया।
    note: '*Por favor* से "कृपया" कहा जाता है; अनुरोध विनम्र और छोटा रहता है।'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: काउंटर पर संबोधन
    gloss: काउंटर पर आमतौर पर आदरसूचक रूप का प्रयोग होता है।
    note: सेवा देने वाले अजनबियों को *usted* कहकर संबोधित किया जाता है, *tú* नहीं।
  es.a1.unit51.lesson02.teach.el_anden:
    title: प्लेटफ़ॉर्म
    gloss: प्लेटफ़ॉर्म
    note: '*El andén* पुल्लिंग है: *un andén*, *el andén*।'
    example_gloss: टोलेडो की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: प्लेटफ़ॉर्म पूछना
    gloss: टोलेडो की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
    note: '*¿De qué andén ...?* खास तौर पर प्लेटफ़ॉर्म के बारे में पूछता है, किसी आम जगह के बारे में नहीं।'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: रवानगी की जानकारी देना
    gloss: ट्रेन पौने दस बजे प्लेटफ़ॉर्म पाँच से जाती है।
    note: '*Las diez menos cuarto* में समय वाले पाठ का "पौने" वाला पैटर्न दोबारा आया है।'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: पहुँचने का समय पूछना
    gloss: ट्रेन किस समय पहुँचती है?
    note: '*¿A qué hora llega ...?* पहुँचने का समय पूछता है; *llegar* नियमित क्रिया है और समय से पहले *a las* आता है।'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: पहुँचने का समय बताना
    gloss: ट्रेन ग्यारह बजे पहुँचती है।
    note: '*Llega a las once* में *llegar* (पहुँचना) के साथ समय से पहले *a las* आता है।'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: समय पर / देरी
    gloss: समय पर; देरी
    note: '*A tiempo* तय समय के अनुसार कुछ होने के लिए एक पक्की अभिव्यक्ति है। *El retraso* (देरी) पुल्लिंग है।'
    example_gloss:
    - ट्रेन समय पर नहीं जाती।
    - 'ध्यान दीजिए: टोलेडो की ट्रेन देरी से चल रही है।'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: एक घोषणा
    gloss: 'ध्यान दीजिए: टोलेडो की ट्रेन देरी से चल रही है।'
    note: '*Atención* स्टेशन की घोषणा की शुरुआत में आता है, जैसे हिंदी में "यात्रीगण कृपया ध्यान दें"।'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: '"समय पर" का निषेध'
    gloss: ट्रेन समय पर नहीं जाती।
    note: '*No* क्रिया से ठीक पहले आता है और पूरे वाक्य को नकारात्मक बना देता है: *no sale a tiempo*।'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: प्लेटफ़ॉर्म में बदलाव
    gloss: ट्रेन प्लेटफ़ॉर्म पाँच की जगह प्लेटफ़ॉर्म तीन से जाती है।
    note: '*En lugar de* का अर्थ है "की जगह"।'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: देरी की अवधि बताना
    gloss: ट्रेन दस मिनट देरी से चल रही है।
    note: '*Lleva retraso* (शाब्दिक अर्थ "देरी लिए हुए है") किसी के देरी से चलने को कहने का स्वाभाविक तरीका है।'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: प्रवेश, निकास, प्रतीक्षालय
    gloss: प्रवेश; निकास; प्रतीक्षालय
    note: '*La entrada*, *la salida* और *la sala de espera* तीनों स्त्रीलिंग संज्ञाएँ हैं।'
    example_gloss:
    - प्रवेश द्वार कहाँ है?
    - निकास कहाँ है?
    - प्रतीक्षालय कहाँ है?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: प्लेटफ़ॉर्म कहाँ है, पूछना
    gloss: प्लेटफ़ॉर्म सात कहाँ है?
    note: यह रास्ता पूछने वाले पाठों के *¿Dónde está ...?* पैटर्न का ही दोहराव है।
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: रास्ता बताना
    gloss: सीधे जाइए और फिर दाएँ।
    note: '*Todo recto* और *a la derecha* रास्ता बताने वाले पाठों के दिशा-वाक्यांश हैं, जो यहाँ स्टेशन में दोबारा आए हैं।'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: प्रतीक्षालय के बारे में पूछना
    gloss: प्रतीक्षालय कहाँ है?
    note: वही प्रश्न-पैटर्न, एक नई जगह के लिए।
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: छपा हुआ टिकट पढ़ना
    gloss: 'टिकट: मैड्रिड अतोचा से टोलेडो। रवानगी: दस बजकर दस मिनट, प्लेटफ़ॉर्म सात। आगमन: ग्यारह बजने में दस मिनट। आना-जाना। कीमत: बारह यूरो चालीस सेंट।'
    note: रवानगी का समय और प्लेटफ़ॉर्म, आगमन का समय, टिकट का प्रकार और कीमत पर ध्यान दीजिए।
    glosses:
      Billete: टिकट
      Salida: रवानगी
      diez: दस
      andén: प्लेटफ़ॉर्म
      siete: सात
      Llegada: आगमन
      once: ग्यारह
      vuelta: आने-जाने का टिकट
      Precio: कीमत
      doce: बारह
      euros: यूरो
      cuarenta: चालीस
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: मातेओ योजना बताता है
    gloss: 'मातेओ: हमें प्लेटफ़ॉर्म सात पर जाना है। ट्रेन दस बजकर दस मिनट पर जाती है।'
    note: '*Tenemos que* + क्रिया का मूल रूप ("हमें ... करना है") किसी व्यावहारिक ज़रूरत को बताता है।'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: एलेना बोर्ड पढ़ती है
    gloss: 'एलेना: देखो, वह रहा बोर्ड: देरी, दस मिनट।'
    note: '*Ahí está* ("वह रहा") बोर्ड की ओर इशारा करता है; *el panel* सूचना-पट्ट है।'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: मातेओ शांत रहता है
    gloss: 'मातेओ: कोई बात नहीं, अभी हमारे पास कॉफ़ी के लिए समय है।'
    note: '*No hay problema* भरोसा दिलाने का एक आम, बोलचाल वाला तरीका है।'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: ट्रेन आ जाती है
    gloss: 'एलेना: अच्छा विचार है। अरे, ट्रेन तो आ भी गई! प्लेटफ़ॉर्म सात, बिल्कुल सही!'
    note: '*Ya* ("पहले ही") बताता है कि अभी-अभी घोषित देरी को देखते हुए ट्रेन उम्मीद से जल्दी आ गई।'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: वे ट्रेन में चढ़ते हैं
    gloss: 'मातेओ: चलो, सब चढ़ रहे हैं! टोलेडो, लो हम चले!'
    note: '*Suben* ("वे चढ़ते हैं") *subir* से बना है, जिसका अर्थ है सवार होना; *¡Allá vamos!* "लो, हम चले!" कहने का स्वाभाविक तरीका है।'
