    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*Me encantan* बहुवचन में है क्योंकि *los animales* बहुवचन है: क्रिया उस चीज़ के अनुसार बदलती है जो आपको पसंद है।'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía को बिल्लियाँ पसंद हैं, पर उसके पास पालतू जानवर नहीं है
