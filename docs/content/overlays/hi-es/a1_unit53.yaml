      da: देता है
      todos: हर
      comer: खाना
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Diego अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*a menudo* (अक्सर) पहले की यूनिट से दोहराया गया है।'
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena Nina से पूछती है
    gloss: 'Elena: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Se llama* ("कहलाता है") पहली ही यूनिट का नाम बताने वाला वाक्यांश दोहराता है।'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Mateo प्रतिक्रिया देता है
    gloss: 'Mateo: वाह, कितना अच्छा! तुम रोज़ उसके साथ क्या करती हो?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo को भी पक्षी पसंद हैं
    gloss: 'Mateo: मुझे भी पक्षी बहुत पसंद हैं।'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena बातचीत समाप्त करती है
    gloss: 'Elena: कितना अच्छा! हम तीनों को जानवर बहुत पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
