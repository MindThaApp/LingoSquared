    gloss: 'Mateo: क्या तुम उसे रोज़ टहलाने ले जाती हो?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena अपनी दिनचर्या बताती है
    gloss: 'Elena: हाँ, मैं उसे रोज़ टहलाने ले जाती हूँ और उसे खाना खिलाती हूँ।'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: जानवरों के बारे में Mateo, Lucía और Diego
    gloss: 'Mateo और Lucía दोनों को जानवर बहुत पसंद हैं, पर दोनों में से किसी के पास पालतू जानवर नहीं है। Mateo को कुत्ते पसंद हैं और Lucía को बिल्लियाँ। Diego के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और रोज़ उसे खाना खिलाता है। क्या आपके पास कोई पालतू जानवर है?'
