    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: '*No tengo mascota* में बस क्रिया से पहले *no* लगता है; व्याकरण नोट देखिए।'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: यह कहना कि आपके पास कुछ नहीं है'
    gloss: 'यह कहने के लिए कि आपके पास कुछ नहीं है, tengo से पहले no लगाइए: No tengo tiempo, no tengo mascota.'
    note: '*No tengo* का वही ढाँचा, जो *No tengo tiempo* में पहले सिखाया जा चुका है; सिर्फ़ संज्ञा नई है।'
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
