    gloss: Él और lo का प्रयोग जानवर के लिए भी हो सकता है, सिर्फ़ व्यक्ति के लिए नहीं।
    note: इस कोर्स में *él* का हर पिछला प्रयोग किसी व्यक्ति के लिए था; यहाँ साफ़ बताया गया है कि यह जानवरों पर भी लागू होता है, साथ में कर्म सर्वनाम *lo* ("उसे") भी।
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
