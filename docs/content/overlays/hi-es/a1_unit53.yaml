    gloss: 'Mateo: वह कैसा है?'
    note: '*¿Cómo es?* रूप-रंग वाली पिछली यूनिट से दोहराया गया है, अब किसी जानवर के बारे में पूछा गया है।'
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena अपने कुत्ते का वर्णन करती है
    gloss: 'Elena: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  es.a1.unit53.lesson04.teach.el_y_lo:
