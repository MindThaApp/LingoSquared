    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear और व्यक्तिवाचक a
    gloss: 'जब कर्म कोई जानवर या व्यक्ति हो, तो उसके आगे a लगता है: saco al perro a pasear.'
    note: पिछले कार्ड का *saco al perro* यहाँ फिर आया है; व्यक्तिवाचक *a* जानवरों या अपनों जैसे लोगों से पहले आता है।
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: खाना खिलाना
