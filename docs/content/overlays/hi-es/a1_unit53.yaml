    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo पालतू जानवर के बारे में पूछता है
    gloss: 'Mateo: Elena, क्या तुम्हारे पास कोई पालतू जानवर है?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
