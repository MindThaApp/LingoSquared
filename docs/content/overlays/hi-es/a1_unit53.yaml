  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: '*Sacar a pasear* के साथ *todos los días* (रोज़) जुड़ता है, जो पहले की यूनिट में आ चुका है; *a* + *el* मिलकर *al* बन जाता है।'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: '*Dar de comer* ("खाने को देना") का मतलब है खाना खिलाना; *le* जानवर की ओर इशारा करता है: *le doy de comer al gato*।'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'बहुवचन -s पर खत्म होता है: perro → perros, gato → gatos. व्यंजन के बाद -es लगता है: animal → animales.'
