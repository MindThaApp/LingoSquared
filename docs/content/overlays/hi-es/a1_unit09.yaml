course:
  title: स्पेनिश A1
  description: रास्ता पूछना और बुनियादी रास्ते समझकर उनका पालन करना, एलेना और मातेओ की कहानी को आगे बढ़ाते हुए, जिसमें एलेना यूनिट 8 के पुस्तकालय तक मातेओ को रास्ता बताती है। इसमें खास तौर पर बताया गया है कि doblar/girar क्षेत्र के अनुसार एक-दूसरे की जगह इस्तेमाल होने वाले रूप हैं, उनके अर्थ में कोई अंतर नहीं है।
