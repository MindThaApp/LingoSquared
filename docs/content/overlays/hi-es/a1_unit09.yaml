teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: सड़क
    gloss: सड़क
    note: '*Calle* स्त्रीलिंग है।'
    example_gloss: मैं इस सड़क पर रहता हूँ।
  es.a1.unit09.lesson01.teach.la_esquina:
    title: मोड़ / नुक्कड़
    gloss: नुक्कड़
    note: '*Esquina* स्त्रीलिंग है।'
    example_gloss: बैंक नुक्कड़ पर है।
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: सीधे जाइए
    gloss: सीधे चलो।
    note: '*Sigue*, *seguir* (पीछे चलना/जारी रखना) का अनौपचारिक आज्ञार्थक रूप है, जो इस यूनिट के रास्ते बताने में बार-बार आता है।'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: बाएँ मुड़ें
    gloss: बाएँ मुड़ो।
    note: '*Dobla*, *doblar* (मुड़ना) का अनौपचारिक आज्ञार्थक रूप है। *doblar* और *girar* पर आगे का व्याकरण नोट देखिए।'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: दाएँ मुड़ें
    gloss: दाएँ मुड़ो।
    note: '*Gira*, *girar* (मुड़ना) का अनौपचारिक आज्ञार्थक रूप है, जिसे *doblar* की जगह पूरी तरह इस्तेमाल किया जा सकता है।'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: सड़क पार करें
    gloss: सड़क पार करो।
    note: '*Cruza*, *cruzar* (पार करना) का अनौपचारिक आज्ञार्थक रूप है।'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar बनाम girar
    gloss: '"मुड़ना" के लिए दो समान रूप से स्वाभाविक शब्द।'
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Doblar* और *girar* दोनों का अर्थ "मुड़ना" है और यहाँ दोनों पूरी तरह एक-दूसरे की जगह इस्तेमाल हो सकते हैं -- यह क्षेत्र की पसंद का मामला है, शिष्टता-स्तर या अर्थ का अंतर नहीं। इस यूनिट में दोनों का प्रयोग हुआ है।'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: कहीं पहुँचने का रास्ता पूछें
    gloss: मैं पुस्तकालय कैसे पहुँचूँ?
    note: '*Cómo llego a* (मैं ... कैसे पहुँचूँ) किसी खास जगह का रास्ता पूछने का आम तरीका है।'
  es.a1.unit09.lesson03.teach.es_facil:
    title: कहें कि यह आसान है
    gloss: यह आसान है।
    note: रास्ता बताने से पहले कहा जाने वाला एक आम, तसल्ली देने वाला वाक्य।
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: इस सड़क पर सीधे जाइए
    gloss: इस सड़क पर सीधे चलो।
    note: '*Por esta calle* (इस सड़क पर/से होकर) बताता है कि किस सड़क पर चलना है।'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: नुक्कड़ पर बाएँ मुड़ें
    gloss: नुक्कड़ पर बाएँ मुड़ो।
    note: '*En la esquina* (नुक्कड़ पर) बताता है कि मोड़ कहाँ लेना है।'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: पुष्टि के लिए पूछें
    gloss: क्या यह ठीक है?
    note: '*¿Está bien así?* (क्या ऐसे ठीक है?) रास्ता दोहराने के बाद यह जाँचने के लिए पूछा जाता है कि आपने सही समझा या नहीं।'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: पुष्टि करें
    gloss: हाँ, सही है।
    note: '*Así es* (ऐसा ही है) पुष्टि करने का स्वाभाविक, छोटा तरीका है।'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: खो मत जाना
    gloss: खो मत जाना!
    note: '*No te pierdas*, *perderse* (खो जाना) का अनौपचारिक निषेधात्मक आज्ञार्थक रूप है; विदा करते समय कहा जाने वाला एक आत्मीय, सहज वाक्य।'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: लिखे हुए रास्ते को पढ़ना
    gloss: 'बाज़ार से पुस्तकालय पहुँचने के लिए: इस सड़क पर सीधे चलो। नुक्कड़ पर बाएँ मुड़ो। फिर सड़क पार करो। पुस्तकालय दाएँ तरफ़ है।'
    note: 'लिखे हुए रास्ते में चरण क्रम से होते हैं: *Para llegar a...* (... पहुँचने के लिए) मंज़िल बताता है, फिर हर चरण *tú* वाला आदेश होता है (*sigue*, *dobla*, *cruza*), और *después* (फिर) चरणों को जोड़ता है।'
    glosses:
      llegar: पहुँचना
      biblioteca: पुस्तकालय
      desde: से
      mercado: बाज़ार
      sigue: चलते रहो (seguir से)
      derecho: सीधे
      calle: सड़क
      Dobla: मुड़ो (doblar से)
      izquierda: बायाँ
      esquina: नुक्कड़
      Después: फिर / उसके बाद
      cruza: पार करो (cruzar से)
      está: स्थित है (estar से)
      derecha: दायाँ
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (से)
    gloss: desde रास्ते की शुरुआती जगह कैसे बताता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Desde* (से) रास्ते का शुरुआती बिंदु बताता है, और गंतव्य के लिए *a* (तक/को) के साथ आता है -- *desde el mercado* ... *a la biblioteca*।'
  es.a1.unit09.lesson06.teach.line01:
    title: रास्ता पूछें
    gloss: मातेओ एलेना से पूछता है कि बाज़ार से पुस्तकालय कैसे पहुँचे।
    note: 'यूनिट में पहले आया वही *¿Cómo llego a...?* सवाल, अब शुरुआती जगह के साथ: *desde el mercado* (बाज़ार से)।'
  es.a1.unit09.lesson06.teach.line02:
    title: पहला चरण बताएँ
    gloss: एलेना कहती है कि यह आसान है और पहला निर्देश देती है।
    note: '*Es fácil* (यह आसान है) पहला चरण बताने से पहले तसल्ली देता है।'
  es.a1.unit09.lesson06.teach.line03:
    title: दोहराएँ और आगे पूछें
    gloss: मातेओ निर्देश दोहराता है और पूछता है कि आगे क्या करना है।
    note: '*Sigo derecho* (मैं सीधे जा रहा हूँ) *seguir* का उत्तम पुरुष रूप है, जिससे मातेओ साथ-साथ पुष्टि करता चलता है।'
  es.a1.unit09.lesson06.teach.line04:
    title: दूसरा चरण बताएँ
    gloss: एलेना उसे नुक्कड़ पर बाएँ मुड़ने को कहती है।
    note: '*Dobla* (मुड़ो) — यहाँ *gira* का भी यही अर्थ होता।'
  es.a1.unit09.lesson06.teach.line05:
    title: दोहराएँ और पुष्टि करें
    gloss: मातेओ मोड़ दोहराता है और पूछता है कि क्या यह सही है।
    note: '*Doblo* (मैं मुड़ता हूँ) उसके पहले के *Sigo derecho* जैसा ही है — मातेओ जाँचने के लिए हर चरण *yo* रूप में दोहराता है।'
  es.a1.unit09.lesson06.teach.line06:
    title: पुष्टि करें और आख़िरी चरण बताएँ
    gloss: एलेना पुष्टि करती है, फिर सड़क पार करने को कहती है — पुस्तकालय दाएँ तरफ़ होगा।
    note: '*Sí, así es* (हाँ, सही है) पुष्टि करता है, फिर *después* (फिर) रास्ते के आख़िरी चरण शुरू करता है।'
  es.a1.unit09.lesson06.teach.line07:
    title: एलेना को धन्यवाद दें
    gloss: मातेओ एलेना को दिल से धन्यवाद देता है।
    note: '*Muchas gracias* (बहुत धन्यवाद) सादे *gracias* से ज़्यादा आत्मीय रूप है।'
  es.a1.unit09.lesson06.teach.line08:
    title: जवाब दें और विदा करें
    gloss: एलेना कहती है कि कोई बात नहीं और उसे खो न जाने को कहती है।
    note: '*De nada* (कोई बात नहीं) *gracias* का सामान्य उत्तर है।'
