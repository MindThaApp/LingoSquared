teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: माँ
    gloss: माँ
    note: '*Madre* स्त्रीलिंग है। परिवार में रोज़ की बोलचाल में *mamá* ज़्यादा चलता है, जबकि *madre* तटस्थ शब्द है और इस कोर्स की शब्द-सूचियों में इस्तेमाल होता है।'
  es.a1.unit03.lesson01.teach.padre:
    title: पिता
    gloss: पिता
    note: '*Padre* पुल्लिंग है। *Papá* रोज़मर्रा का शब्द है, जैसे *madre* के लिए *mamá*।'
  es.a1.unit03.lesson01.teach.hermano:
    title: भाई
    gloss: भाई
    note: '*Hermano* पुल्लिंग एकवचन है।'
  es.a1.unit03.lesson01.teach.hermana:
    title: बहन
    gloss: बहन
    note: '*Hermana* स्त्रीलिंग एकवचन है।'
  es.a1.unit03.lesson01.teach.hijo:
    title: बेटा
    gloss: बेटा
    note: '*Hijo* पुल्लिंग एकवचन है।'
  es.a1.unit03.lesson01.teach.hija:
    title: बेटी
    gloss: बेटी
    note: '*Hija* स्त्रीलिंग एकवचन है।'
  es.a1.unit03.lesson01.teach.padres:
    title: माता-पिता
    gloss: माता-पिता
    note: '*Padres* (पुल्लिंग बहुवचन) माँ और पिता दोनों के लिए प्रयोग होता है। स्पैनिश में जब समूह में कम से कम एक पुरुष हो, तो यही पुल्लिंग बहुवचन चलता है।'
  es.a1.unit03.lesson01.teach.hermanos:
    title: भाई-बहन
    gloss: भाई-बहन; भाई (बहुवचन)
    note: '*Hermanos* का अर्थ "भाई" (सब पुरुष) या "भाई-बहन" (मिला-जुला समूह) हो सकता है, *padres* वाले उसी नियम के अनुसार कि पुल्लिंग बहुवचन मिश्रित समूह को भी दर्शाता है।'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: मेरा परिवार
    gloss: मेरा परिवार
    note: '*Mi* (बिना एक्सेंट के) अधिकार-सूचक विशेषण "मेरा" है; यह लिंग के अनुसार नहीं बदलता, केवल वचन के अनुसार बदलता है (बहुवचन संज्ञाओं के लिए *mis*)।'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: तुम्हारा परिवार (अनौपचारिक)
    gloss: तुम्हारा परिवार
    note: '*Tu* (बिना एक्सेंट के, सर्वनाम *tú* से अलग) अनौपचारिक "तुम्हारा" है, जो यूनिट 1 के *tú* वाले रूप से मेल खाता है।'
  es.a1.unit03.lesson02.teach.su_familia:
    title: आपका / उसका / उसकी परिवार (औपचारिक या अन्य पुरुष)
    gloss: उसका / उसकी / आपका परिवार
    note: '*Su* का अर्थ "उसका", "उसकी" और औपचारिक "आपका" (*usted*) तीनों हो सकता है। स्पैनिश में अकेले इस शब्द से इनमें फ़र्क़ नहीं होता; संदर्भ से अर्थ साफ़ हो जाता है।'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: भाई-बहनों के बारे में पूछिए
    gloss: क्या तुम्हारे भाई-बहन हैं?
    note: '*Tienes* क्रिया *tener* का *tú* वाला रूप है, वही क्रिया जो यूनिट 2 में उम्र के लिए आई थी।'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: भाई-बहनों की संख्या बताइए
    gloss: मेरी दो बहनें हैं।
    note: 'भाई-बहनों के बारे में बताने का सामान्य तरीका है: *Tengo* (मेरे पास है) + संख्या + पारिवारिक संज्ञा।'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: पूछिए कि परिवार बड़ा है या नहीं
    gloss: क्या तुम्हारा परिवार बड़ा है?
    note: '*Grande* (बड़ा) लिंग के अनुसार नहीं बदलता, केवल वचन के अनुसार बदलता है (*grandes*)।'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: छोटे परिवार का वर्णन कीजिए
    gloss: मेरा परिवार छोटा है।
    note: '*Pequeña* स्त्रीलिंग संज्ञा *familia* के अनुसार बदला है; पुल्लिंग संज्ञा के साथ पुल्लिंग रूप *pequeño* आता है।'
  es.a1.unit03.lesson03.teach.abuelo:
    title: दादा / नाना
    gloss: दादा / नाना
    note: '*Abuelo* पुल्लिंग एकवचन है।'
  es.a1.unit03.lesson03.teach.abuela:
    title: दादी / नानी
    gloss: दादी / नानी
    note: '*Abuela* स्त्रीलिंग एकवचन है।'
  es.a1.unit03.lesson03.teach.abuelos:
    title: दादा-दादी / नाना-नानी
    gloss: दादा-दादी / नाना-नानी
    note: '*Abuelos* (पुल्लिंग बहुवचन) में दादा-दादी या नाना-नानी का जोड़ा भी आ जाता है, ठीक *padres* और *hermanos* की तरह।'
  es.a1.unit03.lesson03.teach.tio:
    title: चाचा / मामा
    gloss: चाचा / मामा
    note: '*Tío* में लिखित एक्सेंट इसलिए है कि बल *í* पर पड़ता है, जिससे यह अन्यथा बनने वाला द्विस्वर नहीं रहता।'
  es.a1.unit03.lesson03.teach.tia:
    title: चाची / मौसी / बुआ
    gloss: चाची / मौसी / बुआ
    note: '*Tía* में भी *tío* जैसा ही एक्सेंट है, और उसी कारण से।'
  es.a1.unit03.lesson03.teach.primo:
    title: चचेरा भाई (ममेरा/फुफेरा/मौसेरा भाई)
    gloss: चचेरा भाई
    note: '*Primo* पुल्लिंग एकवचन है; स्पेनिश में चचेरे-ममेरे भाई-बहन के लिंग के अनुसार शब्द बदलता है (primo / prima)।'
  es.a1.unit03.lesson03.teach.prima:
    title: चचेरी बहन (ममेरी/फुफेरी/मौसेरी बहन)
    gloss: चचेरी बहन
    note: '*Prima* स्त्रीलिंग एकवचन है।'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: मेरे दादा-दादी
    gloss: मेरे दादा-दादी
    note: '*Mis*, *mi* का बहुवचन रूप है। संज्ञा बहुवचन हो तो यही आता है, चाहे संज्ञा का लिंग कुछ भी हो।'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: भाई-बहनों की संख्या पूछना
    gloss: आपके कितने भाई-बहन हैं?
    note: '*Cuántos* (पुल्लिंग बहुवचन, क्योंकि *hermanos* में भाई-बहन मिले-जुले समूह के रूप में भी आते हैं) उसी संज्ञा के अनुरूप होता है जिसके बारे में पूछा जा रहा है।'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: घर के सदस्यों की संख्या बताना
    gloss: हम घर में पाँच लोग हैं।
    note: घर के कुल सदस्यों की संख्या बताने के लिए स्पेनिश में *Somos* (हम हैं) कहना स्वाभाविक है; यह किसी शब्द-दर-शब्द अनुवाद जैसा नहीं है।
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: बड़े परिवार का वर्णन करना
    gloss: मेरा परिवार बड़ा है।
    note: यहाँ *Grande*, *familia* (स्त्रीलिंग) के साथ आया है, फिर भी पुल्लिंग संज्ञाओं की तरह उसका रूप *grande* ही रहता है, क्योंकि *grande* जैसे -e वाले विशेषण लिंग के अनुसार नहीं बदलते।
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: बताना कि आपके बहुत से चचेरे-ममेरे भाई-बहन हैं
    gloss: मेरे बहुत से चचेरे-ममेरे भाई-बहन हैं।
    note: '*Muchos* (पुल्लिंग बहुवचन) इसलिए आया है कि *primos*, *hermanos* और *padres* की तरह, लड़के-लड़कियों के मिले-जुले समूह के लिए भी प्रयोग हो सकता है।'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: माता-पिता के पास रहने के बारे में पूछना
    gloss: क्या आप अपने माता-पिता के पास रहते हैं?
    note: '*Tus*, *tu* का बहुवचन है; यह इसलिए ज़रूरी है कि *padres* बहुवचन है।'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: बताना कि आप किसके साथ रहते हैं
    gloss: मैं अपने दादा-दादी के साथ रहता/रहती हूँ।
    note: '*Con* (के साथ) उन लोगों का परिचय देता है जिनके साथ कोई रहता है; *vivo*, *vivir* का *yo* रूप है, जो यूनिट 1 के *vivo en Londres* में पहले आ चुका है।'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: एलेना के परिवार का परिचय
    gloss: 'मेरा नाम एलेना है। मैं इकतीस साल की हूँ और स्पेन में अपने दादा-दादी के साथ रहती हूँ। मेरे माता-पिता बार्सिलोना में रहते हैं। मेरी एक बहन और एक भाई है: हम घर में पाँच लोग हैं। मेरी छोटी बहन का नाम सोफ़िया है और वह बीस साल की है।'
    note: 'इस परिचय में पाठ 1-4 की शब्दावली और संरचनाएँ अलग-अलग वाक्यों की जगह एक जुड़े हुए छोटे पाठ में दोहराई गई हैं। यही इस यूनिट के पढ़ने के आकलन में परखा जाने वाला कौशल है: कौन कौन है, यह समझना।'
    glosses:
      llamo: कहलाता/कहलाती हूँ (llamarse से)
      Tengo: मैं हूँ / मेरे पास है (tener से)
      treinta: तीस
      años: वर्ष (उम्र)
      vivo: रहते हैं (vivir से)
      abuelos: दादा-दादी
      madre: माँ
      padre: पिता
      viven: रहते हैं (vivir से)
      hermana: बहन
      hermano: भाई
      somos: हम हैं (ser से)
      cinco: पाँच
      casa: घर
      menor: छोटी
      tiene: है / की उम्र है (tener से)
      veinte: बीस
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: छोटी बहन
    gloss: छोटी बहन
    note: '*Menor* (छोटी/छोटा) उस संज्ञा के बाद आता है जिसका वह वर्णन करता है, और लिंग के अनुसार उसका रूप नहीं बदलता।'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: रहता/रहती है (अन्य पुरुष)
    gloss: रहता/रहती है
    note: '*Vive*, *vivir* का अन्य पुरुष एकवचन रूप है। इसका प्रयोग किसी और के बारे में बात करने के लिए होता है (*Elena vive*...), अपने बारे में कहने के लिए नहीं (*vivo*, जो यूनिट 1 के पाठ 4 में और इस यूनिट के पाठ 4 में भी आया है)।'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: उसका/उनका (बहुवचन संज्ञा के साथ)
    gloss: उसके/उनके
    note: '*Sus*, *su* का बहुवचन है। जैसे *su* एकवचन संज्ञा के साथ "उसका, उनका, आपका (औपचारिक)" तीनों के लिए चलता है, वैसे ही *sus abuelos* का अर्थ, एलेना के बारे में बात करते हुए, "उसके दादा-दादी" है।'
  es.a1.unit03.lesson06.teach.line01:
    title: परिवार की तस्वीरें दिखाना
    gloss: एलेना मातेओ को एक तस्वीर दिखाती है और अपने माता-पिता तथा छोटी बहन से मिलवाती है।
    note: '*Estos son* (ये हैं, पुल्लिंग/मिश्रित बहुवचन) माता-पिता का परिचय कराता है; *esta es* (यह है, स्त्रीलिंग एकवचन) बहन का परिचय कराता है।'
  es.a1.unit03.lesson06.teach.line02:
    title: प्रतिक्रिया देना और भाई-बहनों के बारे में पूछना
    gloss: मातेओ गर्मजोशी से प्रतिक्रिया देता है और पूछता है कि क्या उसके और भाई-बहन हैं।
    note: तस्वीर देखकर *Qué bonito* कहना एक स्वाभाविक, आत्मीय प्रतिक्रिया है, जो यूनिट 1 के *Qué bien* जैसा ही काम करती है।
  es.a1.unit03.lesson06.teach.line03:
    title: घर के सदस्यों की संख्या बताना और वही सवाल लौटाना
    gloss: एलेना कहती है कि उसकी एक बहन और एक भाई है, यानी घर में पाँच लोग हैं, फिर वह मातेओ के परिवार के बारे में पूछती है।
    note: '*Somos cinco en casa* घर के कुल सदस्यों की संख्या बताता है, और यह पाठ 4 के ढाँचे को आगे बढ़ाता है।'
  es.a1.unit03.lesson06.teach.line04:
    title: छोटे परिवार का वर्णन करना
    gloss: 'मातेओ कहता है कि उसका परिवार छोटा है, सिर्फ़ तीन लोग: उसके माता-पिता और वह, पर उसके बहुत से चचेरे-ममेरे भाई-बहन हैं।'
    note: '*Pero* (लेकिन) छोटे सगे परिवार और बहुत से दूर के रिश्तेदारों के बीच का अंतर दिखाता है।'
  es.a1.unit03.lesson06.teach.line05:
    title: माता-पिता से दूरी के बारे में पूछना
    gloss: एलेना पूछती है कि क्या मातेओ अपने माता-पिता के पास रहता है।
    note: '*Cerca de* (के पास) किसी की भौतिक निकटता बताने का आम तरीका है।'
  es.a1.unit03.lesson06.teach.line06:
    title: दूरी समझाना और संपर्क में रहना बताना
    gloss: मातेओ कहता है कि नहीं, वे कोलंबिया में रहते हैं, और वे हर हफ़्ते फ़ोन पर बात करते हैं।
    note: यह यूनिट 1 की उस बात को आगे बढ़ाता है कि मातेओ कोलंबिया का है पर लंदन में रहता है; उसके माता-पिता कोलंबिया में ही हैं।
  es.a1.unit03.lesson06.teach.line07:
    title: सहानुभूति जताना और अपनी स्थिति बताना
    gloss: एलेना कहती है कि वह समझती है, और वह यहाँ स्पेन में अपने दादा-दादी के साथ रहती है।
    note: '*Entiendo* (मैं समझता/समझती हूँ) किसी की बात को संक्षेप में स्वीकार करने का स्वाभाविक तरीका है, इसके बाद आप अपनी संबंधित बात जोड़ सकते हैं।'
  es.a1.unit03.lesson06.teach.line08:
    title: आत्मीय टिप्पणी के साथ समापन
    gloss: मातेओ कहता है कि परिवार का पास होना कितना अच्छा है।
    note: '*Qué bien tener a la familia cerca* बातचीत को एक आत्मीय, चिंतनशील बात पर समाप्त करता है, और पूरे संवाद में आए *qué bien* / *qué bonito* के ढाँचे को दोहराता है।'
