  description: 'नज़दीकी और विस्तृत परिवार की शब्दावली, अधिकार-सूचक विशेषण और घर-परिवार का वर्णन, यूनिट 01-02 की एलेना और मातेओ की कुकिंग-वर्कशॉप की कहानी को आगे बढ़ाते हुए। हिंदी भाषियों के लिए विशेष ध्यान: अधिकार-सूचक विशेषणों (mi/tu/su) का रूप और लिंग के अनुसार पारिवारिक संज्ञाएँ।'
