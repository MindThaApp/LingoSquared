    title: Por eso (इसीलिए)
    gloss: por eso कारण को परिणाम से कैसे जोड़ता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Por eso* (इसी कारण) किसी कारण को उसके परिणाम से जोड़ता है -- छोटी रसोई ही वजह है कि माटेओ घर बदलना चाहता है; कारण और परिणाम का यही तर्क आप *porque* में पहले देख चुके हैं।'
  es.a1.unit15.lesson06.teach.line01:
    title: पूछिए कि क्या उसने देख लिया
    gloss: एलेना पूछती है कि क्या माटेओ ने नया अपार्टमेंट देख लिया है।
    note: '*¿Ya viste...?* (क्या तुमने पहले ही देख लिया...?) भूतकाल का एक नया प्रश्न-रूप है।'
  es.a1.unit15.lesson06.teach.line02:
    title: पुष्टि कीजिए कि वह बड़ा है
    gloss: माटेओ बताता है कि नया अपार्टमेंट पुराने से बड़ा है, रसोई समेत।
    note: '*más...que* (से ज़्यादा) की तुलना, जिसे *la cocina también* (रसोई भी) से आगे बढ़ाया गया है।'
  es.a1.unit15.lesson06.teach.line03:
    title: पूछिए कि कौन-सा छोटा है
    gloss: एलेना पूछती है कि तो फिर कौन-सा अपार्टमेंट छोटा है।
    note: '*Entonces* (तो / फिर) एक तार्किक संयोजक है जो आप पहले देख चुके हैं; प्रश्न *¿Cuál...?* ढाँचे का है, जिसमें *grande* की जगह *pequeño* है।'
  es.a1.unit15.lesson06.teach.line04:
    title: उत्तर दीजिए और कारण बताइए
    gloss: माटेओ कहता है कि पुराना अपार्टमेंट छोटा है, इसीलिए वह घर बदलना चाहता है।
    note: '*El viejo es más pequeño que el nuevo* और उसके साथ *por eso quiero mudarme* (इसीलिए मैं घर बदलना चाहता हूँ)।'
  es.a1.unit15.lesson06.teach.line05:
    title: सहमति जताइए कि यह ठीक लगता है
    gloss: एलेना कहती है कि यह तर्कसंगत है -- नए में खाना पकाने की ज़्यादा जगह है।
    note: '*Tiene mucho sentido* (यह बहुत तर्कसंगत है) सहमति का एक नया वाक्यांश है; *más espacio para cocinar* का अर्थ है खाना पकाने के लिए ज़्यादा जगह।'
  es.a1.unit15.lesson06.teach.line06:
    title: तर्क को आगे बढ़ाइए
    gloss: माटेओ सहमत होता है और जोड़ता है कि एलेना भी उसी जितना अच्छा खाना पकाती है, इसलिए दोनों के लिए जगह चाहिए।
    note: '*Tan bien como* (जितना अच्छा), अब बातचीत में *tú cocinas* (तुम खाना पकाते/पकाती हो) के साथ।'
  es.a1.unit15.lesson06.teach.line07:
    title: तारीफ़ लौटाइए
    gloss: एलेना उत्साह से सहमत होती है और कहती है कि माटेओ भी उसी जितना अच्छा खाना पकाता है।
    note: '*¡Es verdad!* (यह सच है!) + *tú cocinas tan bien como yo* (तुम मेरे जितना अच्छा खाना पकाते हो) -- वही *tan bien como* तुलना, अब माटेओ की ओर मोड़ी गई।'
  es.a1.unit15.lesson06.teach.line08:
    title: टीम भावना के साथ समापन कीजिए
    gloss: माटेओ निष्कर्ष देता है कि वे एक अच्छी टीम हैं।
    note: '*Somos un buen equipo* (हम एक अच्छी टीम हैं) संवाद का समापन करता है।'
