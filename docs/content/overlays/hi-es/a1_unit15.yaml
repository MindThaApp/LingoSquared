  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: दोनों अपार्टमेंट की तुलना
    gloss: माटेओ के पुराने अपार्टमेंट में छोटी रसोई है। नया अपार्टमेंट बड़ा है, और रसोई भी बड़ी है। पुराना अपार्टमेंट नए से छोटा है, इसीलिए माटेओ घर बदलना चाहता है। नए में खाना पकाने के लिए ज़्यादा जगह है।
    note: दोनों अपार्टमेंट की तुलना का एक वास्तविक सारांश।
