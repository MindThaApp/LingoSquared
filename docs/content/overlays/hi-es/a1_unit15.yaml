      pequeña: छोटा
      nuevo: नया
      grande: बड़ा
      también: भी
      pequeño: छोटा
      eso: कि / जो
      quiere: चाहता है (querer से)
      mudarse: घर बदलना
      espacio: जगह
      cocinar: खाना पकाना
