    note: '*Camisa* स्त्रीलिंग है।'
    example_gloss: मुझे यह शर्ट पसंद है।
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: पैंट
    gloss: पैंट
    note: '*Pantalón* स्पेनिश में व्याकरण की दृष्टि से एकवचन है, जैसे हिंदी में "पैंट"।'
    example_gloss: पैंट की कीमत बीस है।
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: जैकेट
    gloss: जैकेट
    note: '*Chaqueta* स्त्रीलिंग है।'
    example_gloss: मुझे सर्दियों के लिए एक जैकेट चाहिए।
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: जूते
    gloss: जूते
    note: '*Zapatos* बहुवचन है, जैसे हिंदी में "जूते"।'
    example_gloss: ये जूते आरामदायक हैं।
  es.a1.unit11.lesson01.teach.el_delantal:
    title: एप्रन
    gloss: एप्रन
    note: '*Delantal* पुल्लिंग है — यही वह चीज़ है जो एलेना और माटेओ को कार्यशाला के लिए चाहिए।'
    example_gloss: हमें कार्यशाला के लिए एक एप्रन चाहिए।
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: साइज़ पूछना
    gloss: आप कौन-सा साइज़ पहनते हैं?
    note: '*¿Qué talla usas?* किसी का कपड़ों का साइज़ पूछने का सामान्य तरीका है।'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: अपना साइज़ बताना
    gloss: मैं मीडियम साइज़ पहनता/पहनती हूँ।
    note: '*Uso* (मैं पहनता/पहनती हूँ) + *la talla* (साइज़) + स्वयं साइज़ का शब्द।'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: कहना कि ठीक आता है
    gloss: यह मुझे ठीक आता है।
    note: '*Me queda bien* में *quedar* (फ़िट होना/जँचना) क्रिया है — अगला व्याकरण नोट देखिए।'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: कहना कि ठीक नहीं आता
    gloss: यह मुझे ठीक नहीं आता।
    note: यह *me queda bien* का उलटा है, जिसमें *bien* की जगह *mal* आता है।
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: quedar फ़िटिंग कैसे बताता है, सामान्य गुणवत्ता नहीं।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Me queda bien* (यह मुझे ठीक आता है) में *quedar* (फ़िट होना/जँचना) क्रिया है, जो *ser* या *estar* से अलग है — शाब्दिक अर्थ है "यह मुझ पर अच्छी तरह टिकता है।" यहाँ *bien* और *mal* फ़िटिंग बताते हैं, गुणवत्ता नहीं।'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: एप्रन की कीमत पूछना
    gloss: इस एप्रन की कीमत कितनी है?
    note: '*¿Cuánto cuesta?* पैटर्न का प्रयोग, जिसमें *este* (यह) से किसी खास चीज़ का नाम लिया गया है।'
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: कीमत बताना
    gloss: इसकी कीमत बारह है।
    note: '*Cuesta* + संख्या कीमत बताता है।'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este और esta
    gloss: संकेतवाचक शब्द संज्ञा के लिंग के अनुसार कैसे बदलता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Este* (यह, पुल्लिंग) *el delantal* के साथ आता है; *esta* (यह, स्त्रीलिंग) *esta camisa* के साथ आता है — संज्ञा के लिंग के अनुसार संकेतवाचक शब्द बदलता है, जैसे किसी भी अन्य विशेषण में।'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: कहना कि यह वाला पसंद है
    gloss: मुझे यह वाला पसंद है।
    note: यहाँ *Este* अकेले सर्वनाम की तरह आया है ("यह वाला") और अभी-अभी बताई गई चीज़ की ओर इशारा करता है।
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: कहें कि आप इसे खरीदेंगे
    gloss: मैं इसे खरीदने वाला/वाली हूँ।
    note: '*Voy a* + क्रिया का मूल रूप निकट भविष्य बनाता है; *comprarlo* में कर्म सर्वनाम *lo* (इसे) क्रिया *comprar* के अंत में जुड़ा है।'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: कहें कि आप दो खरीद रहे हैं
    gloss: हम दो खरीद रहे हैं।
    note: '*Compramos* (हम खरीदते हैं/खरीद रहे हैं) *nosotros* का रूप है, जो तब बोला जाता है जब Elena और Mateo मिलकर फ़ैसला करते हैं।'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: क़ीमतों की सूची पढ़ना
    gloss: 'इस दुकान में कमीज़ पंद्रह की है, पैंट बीस की है, जैकेट तीस की है और जूते पच्चीस के हैं। एप्रन सबसे सस्ता है: उसकी क़ीमत सिर्फ़ बारह है।'
    note: 'दुकान की क़ीमत-सूची: एक चीज़ के लिए *cuesta* (क़ीमत है), और *los zapatos* जैसी बहुवचन चीज़ों के लिए *cuestan*।'
    glosses:
      tienda: दुकान
      camisa: कमीज़
      cuesta: क़ीमत है (costar से)
      quince: पंद्रह
      pantalón: पैंट
      veinte: बीस
      chaqueta: जैकेट
      treinta: तीस
      zapatos: जूते
      cuestan: क़ीमत है (costar से, बहुवचन)
      veinticinco: पच्चीस
      delantal: एप्रन
      barato: सस्ता
      solo: सिर्फ़
      doce: बारह
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (सबसे सस्ता)
    gloss: el/la + más + विशेषण से "सबसे ..." वाला रूप कैसे बनता है।
    note: कार्ड का अपना पाठ देखें।
    target_text: '*El más barato* (सबसे सस्ता) उत्तमावस्था का रूप है — *el/la* + *más* + विशेषण, और जिस समूह से तुलना हो, उसे *de/en* से बताया जाता है। इस यूनिट में तुलना का पूरा पैटर्न नहीं सिखाया गया है, सिर्फ़ खरीदारी का यह एक आम वाक्यांश है।'
  es.a1.unit11.lesson06.teach.line01:
    title: ज़रूरत बताएँ
    gloss: Elena कहती है कि उन्हें वर्कशॉप के लिए एप्रन चाहिए।
    note: '*Delantales*, *el delantal* का बहुवचन है।'
  es.a1.unit11.lesson06.teach.line02:
    title: सहमति जताएँ और दुकान सुझाएँ
    gloss: Mateo सहमत होता है और उस दुकान पर चलने को कहता है।
    note: '*Tienes razón* का अर्थ है "आप सही हैं"; *esa tienda* का अर्थ है "वह दुकान"।'
  es.a1.unit11.lesson06.teach.line03:
    title: दुकानदार उनका अभिवादन करता है
    gloss: दुकानदार अभिवादन करता है और मदद की पेशकश करता है।
    note: '*¿Los ayudo?* (क्या मैं आप दोनों की मदद करूँ?) दुकानदार का आम अभिवादन है, जो Elena और Mateo दोनों से एक साथ कहा गया है।'
  es.a1.unit11.lesson06.teach.line04:
    title: बताएँ कि आप क्या ढूँढ रहे हैं
    gloss: Elena हाँ कहती है और बताती है कि वे एप्रन ढूँढ रहे हैं।
    note: '*Buscamos* (हम ढूँढ रहे हैं) *buscar* का *nosotros* रूप है।'
  es.a1.unit11.lesson06.teach.line05:
    title: दुकानदार विकल्प दिखाता है और साइज़ पूछता है
    gloss: दुकानदार कुछ एप्रन दिखाता है और उनका साइज़ पूछता है।
    note: '*¿Qué talla usan?* में बहुवचन *usan* (आप सब पहनते हैं) है, जो दोनों से पूछा गया है; एकवचन *usas* इससे अलग है।'
  es.a1.unit11.lesson06.teach.line06:
    title: साइज़ बताएँ
    gloss: Mateo कहता है कि वह मीडियम साइज़ पहनता है।
    note: '*Uso la talla mediana*, *¿Qué talla usan?* का उसका अपना उत्तर है।'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena सहमत होती है
    gloss: Elena कहती है कि उसका भी वही साइज़ है।
    note: '*Yo también* का अर्थ है "मैं भी"।'
  es.a1.unit11.lesson06.teach.line07:
    title: क़ीमत पूछें
    gloss: Mateo पूछता है कि एप्रन कितने का है।
    note: '*Este* (यह) उसके सामने रखे एप्रन की ओर इशारा करता है।'
  es.a1.unit11.lesson06.teach.line07b:
    title: क़ीमत बताएँ
    gloss: दुकानदार कहता है कि यह बारह का है।
    note: '*Cuesta* + संख्या से क़ीमत बताई जाती है।'
  es.a1.unit11.lesson06.teach.line08:
    title: फ़िटिंग बताएँ और खरीदने का फ़ैसला करें
    gloss: Elena कहती है कि यह ठीक आता है, उसे पसंद है और वह इसे खरीदेगी।
    note: यह *me queda bien*, *me gusta este* और *voy a comprarlo* को क्रम से जोड़ता है।
  es.a1.unit11.lesson06.teach.line09:
    title: सहमति जताएँ और दो खरीदें
    gloss: Mateo कहता है कि उसे भी ठीक आता है, और वे दो खरीदते हैं।
    note: '*A mí también* (मुझे भी, ज़ोर देकर) में *también* वाला सहमति का ढाँचा है, जिसके साथ ज़ोर देने वाला सर्वनाम जुड़ा है; *compramos dos* दृश्य को समाप्त करता है।'
