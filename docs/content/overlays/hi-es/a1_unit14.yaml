  es.a1.unit14.lesson01.teach.la_sala:
    title: बैठक
    gloss: बैठक
    note: '*Sala* स्त्रीलिंग शब्द है।'
    example_gloss: हम बैठक में टीवी देखते हैं।
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: कमरा या खाना पकाना'
    gloss: la cocina (रसोई) और cocinar (खाना पकाना) में क्या अंतर है।
    note: कार्ड का अपना पाठ देखें।
    target_text: 'यहाँ *La cocina* का अर्थ "रसोई" (घर का एक कमरा) है, जो इस पूरी कहानी में कार्यशाला के लिए इस्तेमाल हुए *cocina*/*cocinar* (खाना बनाना) से अलग अर्थ है। संदर्भ से फ़र्क पता चलता है: *taller de cocina* में इसका अर्थ पाक-कला है; घर या अपार्टमेंट की *la cocina* एक कमरा है; *cocinar* क्रिया है, यानी "खाना बनाना"।'
  es.a1.unit14.lesson02.teach.alquilar:
    title: किराए पर लेना
    gloss: किराए पर लेना
    note: यह क्रिया का मूल रूप है, जो *quiero alquilar* (मैं किराए पर लेना चाहता/चाहती हूँ) में आया है।
  es.a1.unit14.lesson02.teach.el_edificio:
    title: इमारत
    gloss: इमारत
    note: '*Edificio* पुल्लिंग शब्द है।'
    example_gloss: इमारत पार्क के पास है।
  es.a1.unit14.lesson02.teach.desocupado:
    title: ख़ाली / उपलब्ध
    gloss: ख़ाली / उपलब्ध
    note: '*Desocupado* उस किराये की जगह के लिए कहा जाता है जो अभी ख़ाली है और उपलब्ध है।'
  es.a1.unit14.lesson02.teach.grande:
    title: बड़ा
    gloss: बड़ा
    note: '*Grande* का रूप लिंग के अनुसार नहीं बदलता (-o/-a वाले विशेषणों से अलग)।'
  es.a1.unit14.lesson02.teach.pequeno:
    title: छोटा
    gloss: छोटा
    note: '*Pequeño/pequeña*, यानी *grande* का उलटा।'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: शयनकक्षों की संख्या पूछें
    gloss: इसमें कितने शयनकक्ष हैं?
    note: '*¿Cuántos...tiene?* (कितने... हैं?) किसी जगह की विशेषताएँ पूछने का सामान्य वाक्य-ढाँचा है।'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: शयनकक्ष और रसोई का वर्णन करें
    gloss: इसमें दो शयनकक्ष और एक बड़ी रसोई है।
    note: '*Tiene* (इसमें है) + संख्या + संज्ञा, यहाँ *dormitorio*, *cocina* और *grande* के साथ।'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: घर का लक्ष्य बताएँ
    gloss: मैं बड़ी रसोई वाला अपार्टमेंट किराए पर लेना चाहता/चाहती हूँ।
    note: '*Quiero* (मैं चाहता/चाहती हूँ) + क्रिया का मूल रूप *alquilar*, और *con* (के साथ/वाला) चाही गई विशेषता बताता है।'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: फ़ायदा समझाएँ
    gloss: इस तरह आप घर पर भी खाना बना सकते हैं।
    note: '*Así* (इस तरह) + *puedes* (आप कर सकते हैं) + क्रिया का मूल रूप; यह घर के लक्ष्य को पूरी कहानी की खाना पकाने वाली बात से जोड़ता है।'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: अपार्टमेंट का विज्ञापन पढ़ना
    gloss: पार्क के पास एक इमारत में ख़ाली अपार्टमेंट। इसमें दो शयनकक्ष, एक स्नानघर, एक बैठक और एक बड़ी रसोई है। घर पर खाना बनाना चाहने वाले किसी व्यक्ति के लिए एकदम सही।
    note: वर्गीकृत विज्ञापन जैसा एक वास्तविक विज्ञापन।
    glosses:
      desocupado: ख़ाली / उपलब्ध
      edificio: इमारत
      cerca: पास / नज़दीक
      parque: पार्क
      Tiene: है (tener से)
      dormitorios: शयनकक्ष (बहुवचन)
      baño: स्नानघर
      sala: बैठक
      grande: बड़ी
      perfecto: एकदम सही
      quiere: चाहता/चाहती है (querer से)
      cocinar: खाना पकाना
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: आदर्श किराएदार का वर्णन करने वाला उपवाक्य कैसे बनता है।
    note: कार्ड का अपना पाठ देखें।
    target_text: '*Para alguien que quiere* (किसी ऐसे व्यक्ति के लिए जो चाहता है) में *alguien* (कोई) + *que* (जो) से एक संबंधसूचक उपवाक्य शुरू होता है -- आदर्श किरायेदार का वर्णन करने वाले विज्ञापनों में यह आम ढाँचा है।'
  es.a1.unit14.lesson06.teach.line01:
    title: समस्या और लक्ष्य बताएँ
    gloss: मातेओ कहता है कि उसकी रसोई बहुत छोटी है और वह बड़ी रसोई वाला अपार्टमेंट किराए पर लेना चाहता है।
    note: इसमें *mi cocina es muy pequeña* (मेरी रसोई बहुत छोटी है) और लक्ष्य वाला वाक्य *quiero alquilar un apartamento con una cocina grande* साथ आए हैं।
  es.a1.unit14.lesson06.teach.line02:
    title: विज्ञापन देखने का सुझाव दें
    gloss: एलेना अख़बार देखने का सुझाव देती है, क्योंकि उसमें बहुत सारे विज्ञापन हैं।
    note: '*El periódico* (अख़बार) और *anuncios* (विज्ञापन) वर्गीकृत विज्ञापनों से जुड़े नए शब्द हैं।'
  es.a1.unit14.lesson06.teach.line03:
    title: विज्ञापन ढूँढें
    gloss: मातेओ को एक इमारत मिलती है जिसमें एक अपार्टमेंट उपलब्ध है।
    note: '*Este edificio* (यह इमारत) और *desocupado* (ख़ाली, उपलब्ध)।'
  es.a1.unit14.lesson06.teach.line04:
    title: शयनकक्षों के बारे में पूछें
    gloss: एलेना पूछती है कि इसमें कितने शयनकक्ष हैं।
    note: किसी जगह की विशेषताएँ पूछने का सामान्य प्रश्न।
  es.a1.unit14.lesson06.teach.line05:
    title: ब्योरे के साथ उत्तर दें
    gloss: मातेओ बताता है कि इसमें दो शयनकक्ष और एक बड़ी रसोई है।
    note: '*Tiene* (इसमें है) + संख्या + संज्ञा।'
  es.a1.unit14.lesson06.teach.line06:
    title: और विशेषताओं की पुष्टि करें
    gloss: एलेना ख़ुश हो जाती है और कहती है कि इसमें एक स्नानघर और एक बैठक भी है।
    note: '*Baño* (स्नानघर) और *sala* (बैठक) से कमरों की सूची पूरी होती है; *también* (भी) अंत में आता है।'
  es.a1.unit14.lesson06.teach.line07:
    title: फ़ोन करने का निर्णय लें
    gloss: मातेओ तय करता है कि वह आज ही एजेंसी को फ़ोन करेगा।
    note: '*Voy a llamar* (मैं फ़ोन करने वाला/वाली हूँ) + *hoy mismo* (आज ही); *la agencia* किराये की एजेंसी है।'
  es.a1.unit14.lesson06.teach.line08:
    title: सहमति दें और बात पूरी करें
    gloss: एलेना सहमत होती है और कहती है कि इस तरह वह घर पर भी खाना बना सकता है।
    note: '*Así puedes cocinar en casa también* (इस तरह आप घर पर भी खाना बना सकते हैं) से दृश्य पूरा होता है।'
