  description: 'किसी व्यक्ति की बुनियादी शक्ल-सूरत बताने के लिए शुरुआती स्पैनिश: कद और उम्र का अंदाज़ा, बालों और आँखों का रंग, मुख्य सवाल ¿Cómo es ...?, और दो लोगों की शक्ल-सूरत की तुलना।'
