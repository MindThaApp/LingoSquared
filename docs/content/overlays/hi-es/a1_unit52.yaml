teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Alto* लंबे व्यक्ति के लिए और *bajo* नाटे व्यक्ति के लिए आता है; दोनों व्यक्ति के अनुसार बदलते हैं: *alta*, *baja*।'
    example_gloss:
    - लूसिया लंबी है।
    - दिएगो नाटा है।
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: '*Mayor* और *joven* उम्र का आम अंदाज़ा देते हैं, सालों की सटीक संख्या नहीं।'
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - माटेओ जवान है।
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: अंदाज़ा, संख्या नहीं'
    gloss: सटीक उम्र के लिए tener años कहते हैं, जैसे ¿Cuántos años tienes?; mayor बिना संख्या के आम अंदाज़ा देता है, जैसे El abuelo es mayor.
    note: 'सटीक उम्र के लिए *tener años* कहते हैं: *¿Cuántos años tienes?* *Mayor* सिर्फ़ आम अंदाज़ा देता है, संख्या नहीं।'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: लूसिया लंबी है और दिएगो नाटा है
    gloss: लूसिया लंबी है और दिएगो नाटा है।
    note: '*y* ("और") से जुड़ा एक सरल वाक्य, जो आगे के पाठ में सीधी तुलना की तैयारी करता है।'
  es.a1.unit52.lesson02.teach.el_pelo:
    title: बाल
    gloss: बाल
    note: '*El pelo* पुल्लिंग है और किसी के सारे बालों की बात करते समय एकवचन ही रहता है।'
    example_gloss: माटेओ के छोटे काले बाल हैं।
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: 'बालों के तीन रंग: *rubio* (सुनहरा), *castaño* (भूरा) और *gris* (स्लेटी)। *Rubio* संज्ञा के अनुसार बदलता है: *pelo rubio*, *melena rubia*।'
    example_gloss:
    - एलेना के बाल सुनहरे हैं।
    - दिएगो के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  es.a1.unit52.lesson02.teach.largo_corto:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Largo* (लंबा) कद वाले पाठ से दोबारा आया है, अब बालों की लंबाई के लिए; *corto* (छोटा) नया है: *el pelo largo*, *el pelo corto*।'
    example_gloss:
    - लूसिया के लंबे बाल हैं।
    - दिएगो के छोटे बाल हैं।
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: विशेषण संज्ञा के बाद आता है
    gloss: 'स्पैनिश में विशेषण संज्ञा के बाद आता है: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro।'
    note: 'स्पैनिश में विशेषण संज्ञा के बाद आता है और उसके अनुसार बदलता है: *el pelo corto*, *el pelo rubio*। हिंदी में विशेषण संज्ञा से पहले आता है ("छोटे बाल"), इसलिए क्रम उलटा है।'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo और cabello
    gloss: 'Pelo और cabello का मतलब एक ही है। इस कोर्स में हम pelo कहते हैं: el pelo largo।'
    note: रोज़ की स्पैनिश में *pelo* और *cabello* दोनों का मतलब "बाल" है; इस कोर्स में *pelo* इस्तेमाल होता है।
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: माटेओ के छोटे काले बाल हैं
    gloss: माटेओ के छोटे काले बाल हैं।
    note: कपड़ों वाली इकाई का शब्द *negro* (काला) यहाँ दोबारा आया है।
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: एलेना के लंबे सुनहरे बाल हैं
    gloss: एलेना के लंबे सुनहरे बाल हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  es.a1.unit52.lesson03.teach.los_ojos:
    title: आँखें
    gloss: आँखें
    note: '*Los ojos*, *el ojo* का बहुवचन है; दोनों पुल्लिंग हैं।'
    example_gloss: माटेओ की आँखें भूरी हैं।
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: '*Azul* (नीला) और *verde* (हरा) का रूप दोनों लिंगों के लिए एक ही रहता है; आँखों के रंग के लिए *marrón* (भूरा) आम शब्द है, जबकि बालों के लिए *castaño* कहते हैं।'
    example_gloss:
    - एलेना की आँखें नीली हैं।
    - दिएगो की आँखें भूरी हैं।
    - लूसिया की आँखें हरी हैं।
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos के साथ बहुवचन विशेषण आता है
    gloss: 'ojos (बहुवचन) के साथ विशेषण भी बहुवचन में आता है: ojos azules, ojos marrones, ojos verdes।'
    note: 'विशेषण वचन में संज्ञा के अनुसार बदलते हैं: *ojos* बहुवचन है, इसलिए *azules*, *marrones*, *verdes*।'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: एलेना कैसी दिखती है?
    gloss: एलेना कैसी दिखती है?
    note: '*¿Cómo es ...?* इस इकाई का मुख्य सवाल है; किसी की भी शक्ल-सूरत पूछने के लिए इसे दोबारा इस्तेमाल करें।'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: एलेना के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: एलेना के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: '*y* की मदद से बाल और आँखों को एक वाक्य में जोड़ने वाला नमूना उत्तर।'
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: एलेना नीना का परिचय देती है
    gloss: 'एलेना: भाषा-कैफ़े में एक नई लड़की आ रही है। उसका नाम नीना है।'
    note: '*Viene* ("आ रही है") किसी नए व्यक्ति का परिचय देता है; *se llama* का मतलब "नाम है" है।'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: माटेओ पूछता है वह कैसी दिखती है
    gloss: 'माटेओ: बढ़िया! वह कैसी दिखती है?'
    note: 'इस इकाई का मुख्य सवाल यहाँ बिना नाम के आया है: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: एलेना नीना का कद और बाल बताती है
    gloss: 'एलेना: वह नाटी है और उसके छोटे सुनहरे बाल हैं।'
    note: पहले पाठ का *baja* बालों की शब्दावली के साथ जुड़ा है; *baja* स्त्रीलिंग है क्योंकि नीना लड़की है।
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: माटेओ उसकी आँखों के बारे में पूछता है
    gloss: 'माटेओ: और आँखें?'
    note: '*¿Y los ojos?* में विषय निश्चयवाचक उपपद (los) से उठाया गया है; स्पैनिश में यहाँ "उसकी" के लिए *sus* की ज़रूरत नहीं होती।'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: एलेना नीना की आँखें बताती है
    gloss: 'एलेना: उसकी आँखें हरी हैं।'
    note: आँखों वाले पाठ का *los ojos verdes* यहाँ दोबारा आया है।
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: माटेओ उसे पहचान लेगा
    gloss: 'माटेओ: शुक्रिया! तब मैं उसे पहचान लूँगा।'
    note: '*La reconoceré* ("मैं उसे पहचान लूँगा") भविष्य काल का रूप है; *la* का मतलब "उसे" है और यह क्रिया से पहले आता है।'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: दिएगो और लूसिया की तुलना
    gloss: दिएगो और लूसिया भाई-बहन हैं, पर दोनों अलग दिखते हैं। दिएगो नाटा है और उसके छोटे भूरे बाल और भूरी आँखें हैं। लूसिया दिएगो से लंबी है और उसके लंबे भूरे बाल और हरी आँखें हैं। और आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      hermano: भाई
      hermana: बहन
      eres: दिखना
      diferentes: अलग
      bajo: छोटा
      corto: छोटा
      castaño: भूरा
      pelo: बाल
      marrones: भूरा
      ojos: आँखें
      alta: ज़्यादा लंबा
      largo: लंबा
      verdes: हरा
      cómo: (‘... कैसा/कैसी है’ का हिस्सा)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: तुलना वाले पैटर्न का फिर से उपयोग
    gloss: 'आप तुलना का पैटर्न पहले से जानते हैं: más + adjetivo + que। यहाँ आप इसे लोगों के लिए इस्तेमाल करते हैं: Lucía, Diego से ज़्यादा लंबी है।'
    note: तुलना वाली इकाई का *más + adjective + que* पैटर्न, अब वस्तुओं की जगह लोगों के लिए इस्तेमाल हो रहा है।
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía के बाल Diego से ज़्यादा लंबे हैं
    gloss: Lucía के बाल Diego से ज़्यादा लंबे हैं।
    note: '*Más largo que* दो चीज़ों की तुलना करता है: *el pelo más largo que Diego*; *largo* पुल्लिंग ही रहता है क्योंकि *pelo* पुल्लिंग है।'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*tengo* वाला उत्तम पुरुष का आदर्श वाक्य, जिसे आप अपना वर्णन करते समय दोबारा इस्तेमाल कर सकते हैं।'
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo को Nina दिखती है
    gloss: 'Mateo: देखो, क्या वह Nina है? उसके बाल छोटे और सुनहरे हैं और आँखें हरी हैं।'
    note: '*Mira* (“देखो”) *mirar* का अनौपचारिक आदेश-रूप है, जिसे यहाँ किसी की ओर इशारा करने के लिए इस्तेमाल किया गया है।'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena पुष्टि करती है
    gloss: 'Elena: हाँ, वह Nina ही है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina, Mateo का अभिवादन करती है
    gloss: 'Nina: नमस्ते, क्या तुम Mateo हो?'
    note: 'एक सरल अनौपचारिक अभिवादन-प्रश्न: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo भी Nina का अभिवादन करता है
    gloss: 'Mateo: हाँ! तुमसे मिलकर खुशी हुई, Nina।'
    note: '*Encantado de conocerte* पहली मुलाकात का सामान्य वाक्यांश है; महिला *Encantada* कहती है।'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद का अंत -- Mateo ने Elena के पहले दिए विवरण से Nina को सही पहचान लिया।
exercises:
