teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: घबराया हुआ
    gloss: घबराया हुआ
    note: '*Nervioso* (पुल्लिंग) / *nerviosa* (स्त्रीलिंग) -- -o/-a वाली सामान्य विशेषण जोड़ी।'
