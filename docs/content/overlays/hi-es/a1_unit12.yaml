  es.a1.unit12.lesson01.teach.contento:
    title: खुश
    gloss: खुश / संतुष्ट
    note: '*Contento/contenta* खुशी या संतुष्टि महसूस करने को बताता है, किसी स्थायी गुण को नहीं।'
    example_gloss:
    - माटेओ खुश है।
    - एलेना खुश है।
  es.a1.unit12.lesson01.teach.cansado:
    title: थका हुआ
    gloss: थका हुआ
    note: '*Cansado/cansada*, *cansar* (थकाना) से बना है।'
    example_gloss:
    - वर्कशॉप के बाद मैं थका हुआ हूँ। (पुल्लिंग)
    - वर्कशॉप के बाद मैं थकी हुई हूँ। (स्त्रीलिंग)
  es.a1.unit12.lesson01.teach.preocupado:
    title: चिंतित
    gloss: चिंतित
    note: '*Preocupado/preocupada*, *preocupar* (चिंता करना) से बना है।'
    example_gloss:
    - माटेओ चिंतित है।
    - एलेना चिंतित है।
  es.a1.unit12.lesson01.teach.orgulloso:
    title: गर्वित
    gloss: गर्वित
    note: '*Orgulloso/orgullosa* -- *estoy orgulloso/a de...* (मुझे ... पर गर्व है) में जिस चीज़ पर गर्व हो, उससे पहले *de* आता है।'
    example_gloss:
    - मुझे तुम पर गर्व है। (पुल्लिंग)
    - मुझे तुम पर गर्व है। (स्त्रीलिंग)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: मैं घबराया हुआ हूँ (पुल्लिंग)
    gloss: मैं घबराया हुआ हूँ।
    note: '*Estoy* (मैं हूँ, *estar* से) + विशेषण का पुल्लिंग रूप।'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: मैं घबराई हुई हूँ (स्त्रीलिंग)
    gloss: मैं घबराई हुई हूँ।
    note: वही बनावट, विशेषण के स्त्रीलिंग रूप के साथ।
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: मैं खुश हूँ (पुल्लिंग)
    gloss: मैं खुश हूँ।
    note: '*Estoy contento* -- वही *estar* + विशेषण वाली बनावट।'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: भावनाओं के लिए estar, ser नहीं
    gloss: भावनाओं के लिए आमतौर पर ser नहीं, estar क्यों चलता है।
    note: कार्ड का अपना पाठ देखें।
    target_text: '*Estar* + विशेषण किसी अस्थायी अवस्था या भावना को बताता है (estoy nervioso -- मैं [अभी] घबराया हुआ हूँ), जबकि स्थायी गुण के लिए *ser* + विशेषण आता है। भावनाओं के लिए आमतौर पर *estar* ही चलता है।'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: पूछें कि कोई कैसा महसूस कर रहा है
    gloss: आप कैसा महसूस कर रहे हैं?
    note: '*¿Cómo te sientes?* में *sentirse* (महसूस करना) क्रिया है, जो आत्मवाचक है और *estar* + विशेषण से अलग है।'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: मिली-जुली भावना बताएँ
    gloss: मैं थोड़ा घबराया हुआ हूँ, लेकिन खुश हूँ।
    note: '*Me siento* (मैं महसूस करता हूँ) + विशेषण, और *pero* (लेकिन) एक साथ दो भावनाओं को जोड़ता है -- *¿Cómo te sientes?* का स्वाभाविक उत्तर।'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: कुछ जल रहा है
    gloss: कुछ जल रहा है!
    note: '*Se quema*, *quemar* (जलाना) का आत्मवाचक रूप है -- "यह खुद जलता है" -- यह बताए बिना कि कौन कर रहा है, "कुछ जल रहा है" कहने का स्वाभाविक तरीका।'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: मैं चिंतित हूँ (पुल्लिंग)
    gloss: मैं चिंतित हूँ।
    note: '*estoy* + विशेषण वाली बनावट में *Preocupado*।'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: चिंता मत कीजिए
    gloss: चिंता मत करो।
    note: अगला व्याकरण नोट देखें।
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: फिर से शुरू करने का सुझाव दें
    gloss: हम फिर से शुरू कर सकते हैं।
    note: '*Podemos* (हम सकते हैं) + क्रिया का मूल रूप; *de nuevo* (फिर से) किसी काम को दोबारा करने के लिए आम वाक्यांश है।'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: '"चिंता मत करो" के पीछे की निषेधात्मक आदेश वाली बनावट।'
    note: कार्ड का अपना पाठ देखें।
    target_text: '*No te preocupes* (चिंता मत करो) एक निषेधात्मक अनौपचारिक आदेश है, जो *no* + आत्मवाचक सर्वनाम (*te*) + क्रिया से बनता है।'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: क्लास पर एक नज़र
    gloss: क्लास से पहले एलेना और माटेओ थोड़े घबराए हुए थे। क्लास के दौरान कुछ जल गया और दोनों चिंतित हो गए। लेकिन उन्होंने फिर से शुरू किया, और आख़िर में केक एकदम बढ़िया बना। अब दोनों को बहुत गर्व है और वे खुश हैं।
    note: '*Estaban* (वे थे) बताता है कि तब उन्हें कैसा लग रहा था; *están* (वे हैं) बताता है कि अब कैसा लग रहा है।'
    glosses:
      Antes: पहले
      clase: क्लास
      estaban: थे (estar से)
      poco: थोड़ा
      nerviosos: घबराया हुआ
      Durante: के दौरान
      algo: कुछ
      quemó: जल गया
      dos: दोनों
      preocupados: चिंतित
      Pero: लेकिन
      empezaron: शुरू किया
      nuevo: फिर से
      final: अंत
      pastel: केक
      salió: बना
      perfecto: एकदम सही
      Ahora: अब
      están: हैं
      orgullosos: गर्वित
      contentos: खुश
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: विशेषण का बहुवचन रूप
    gloss: मिले-जुले लिंग वाले समूह के लिए पुल्लिंग बहुवचन विशेषण क्यों लगता है।
    note: कार्ड का अपना पाठ देखें।
    target_text: एलेना और माटेओ का एक साथ वर्णन करते समय विशेषण पुल्लिंग बहुवचन रूप लेते हैं (nerviosos, preocupados, orgullosos, contentos) -- यह स्पेनिश का सामान्य नियम है कि समूह में कम से कम एक पुरुष हो तो पुल्लिंग रूप चलता है।
  es.a1.unit12.lesson06.teach.line01:
    title: पूछें कि मातेओ कैसा महसूस कर रहा है
    gloss: एलेना मातेओ से पूछती है कि क्लास से पहले वह कैसा महसूस कर रहा है।
    note: '*¿Cómo te sientes?* पूछता है कि कोई कैसा महसूस कर रहा है।'
  es.a1.unit12.lesson06.teach.line02:
    title: मिली-जुली भावना के साथ जवाब दें
    gloss: मातेओ कहता है कि वह थोड़ा घबराया हुआ है, लेकिन खुश है।
    note: मातेओ पुल्लिंग रूप *nervioso* और *contento* का प्रयोग करता है।
  es.a1.unit12.lesson06.teach.line03:
    title: गड़बड़ी पर प्रतिक्रिया दें
    gloss: एलेना सहमत होती है, फिर देखती है कि कुछ जल रहा है।
    note: '*¡Ay, no!* (अरे नहीं!) घबराहट में कही जाने वाली आम पुकार है।'
  es.a1.unit12.lesson06.teach.line04:
    title: चिंता जताएँ
    gloss: मातेओ कहता है कि वह चिंतित है और पूछता है कि क्या करें।
    note: '*¿Qué hacemos?* (हम क्या करें?) एक व्यावहारिक सवाल है।'
  es.a1.unit12.lesson06.teach.line05:
    title: तसल्ली दें और हल सुझाएँ
    gloss: एलेना उससे कहती है कि चिंता मत करो, हम फिर से शुरू कर सकते हैं।
    note: इसमें *no te preocupes* और *podemos empezar de nuevo* साथ आते हैं।
  es.a1.unit12.lesson06.teach.line06:
    title: सहमत हों और दोबारा कोशिश करें
    gloss: मातेओ सहमत होता है और दोबारा कोशिश करने को कहता है।
    note: '*Vamos a intentarlo otra vez* (चलो इसे फिर से आज़माते हैं) में पिछली इकाइयों वाला *vamos a* + क्रिया का रूप है, अब कर्म सर्वनाम *lo* के साथ।'
  es.a1.unit12.lesson06.teach.line07:
    title: सफलता की घोषणा करें
    gloss: एलेना बताती है कि केक अब एकदम सही बना है।
    note: '*¡Mira!* (देखो!) ध्यान खींचने वाला शब्द है; *el pastel* (केक) वही चीज़ है जिसके साथ गड़बड़ हुई थी।'
  es.a1.unit12.lesson06.teach.line08:
    title: जश्न मनाएँ और गर्व जताएँ
    gloss: मातेओ खुशी मनाता है और कहता है कि उसे दोनों पर गर्व है।
    note: '*¡Qué bien!* (कितना बढ़िया!) में *¡Qué...!* वाला विस्मयादिबोधक ढाँचा है, जैसे *¡Qué calor!*; *de nosotros* (हम पर) *estoy orgulloso de ti* को समूह तक बढ़ाता है।'
  es.a1.unit12.lesson06.teach.line09:
    title: गर्व साझा करें
    gloss: एलेना सहमत है कि उसे भी गर्व है — उन्होंने यह साथ मिलकर किया।
    note: '*Lo logramos juntos* (हमने इसे साथ मिलकर कर दिखाया) एक स्वाभाविक अंतिम वाक्य है, जिसमें पहली बार *lograr* (हासिल करना/कर पाना) आया है।'
