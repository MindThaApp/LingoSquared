course:
  title: स्पेनिश A1
  description: मोहल्ले की आम जगहें और स्थान बताने वाले शब्द। एलेना और माटेओ की कहानी आगे बढ़ती है, जिसमें इस इलाके में नए माटेओ मोहल्ले के बारे में पूछता है। यहाँ स्थान बताने वाले पाँचों शब्दों को अलग-अलग संबंध समझें; इन्हें एक-दूसरे की जगह इस्तेमाल नहीं किया जा सकता।
