    note: '*Biblioteca* स्त्रीलिंग है।'
    example_gloss: मैं पुस्तकालय में पढ़ाई करता हूँ।
  es.a1.unit08.lesson02.teach.cerca_de:
    title: पास
    gloss: रेस्तराँ बाज़ार के पास है।
    note: '*Cerca de* (के पास) में संदर्भ वाली जगह से पहले हमेशा *de* आता है।'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: से दूर
    gloss: पार्क बाज़ार से दूर है।
    note: '*Lejos de* (से दूर) का अर्थ *cerca de* के उलट है।'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: के बगल में
    gloss: बैंक बाज़ार के बगल में है।
    note: '*Al lado de* (के बगल में) एक तय मुहावरा है (*al* = *a* + *el lado*)। *mercado* जैसी पुल्लिंग संज्ञा से पहले *de* + *el* मिलकर *del* बन जाता है: *al lado del mercado*।'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: के सामने
    gloss: दवाखाना बाज़ार के सामने है।
    note: '*Enfrente de* (के सामने) किसी चीज़, जैसे सड़क, के आमने-सामने की दो जगहों को बताता है।'
  es.a1.unit08.lesson02.teach.entre:
    title: के बीच में
    gloss: पुस्तकालय बैंक और पार्क के बीच में है।
    note: '*Entre* (के बीच में) के लिए दो संदर्भ-स्थान चाहिए; यहाँ उन्हें *y* (और) से जोड़ा गया है।'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: पूछिए कि बैंक कहाँ है
    gloss: बैंक कहाँ है?
    note: '*Dónde está* (कहाँ है) किसी जगह का पता पूछने का सामान्य वाक्य-ढाँचा है।'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: स्थान बताकर उत्तर दीजिए
    gloss: यह बाज़ार के बगल में है।
    note: पुल्लिंग *mercado* से पहले *de* + *el* मिलकर *del* बनता है।
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: पूछिए कि दवाखाना कहाँ है
    gloss: दवाखाना कहाँ है?
    note: वही प्रश्न-ढाँचा, इस बार स्त्रीलिंग संज्ञा के साथ; लिंग के कारण प्रश्न नहीं बदलता।
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'उत्तर: सामने'
    gloss: यह बाज़ार के सामने है।
    note: '*Enfrente de* + *el mercado* मिलकर *enfrente del mercado* बनता है, ठीक वही *del* संकुचन जो *al lado del mercado* में है।'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: पूछिए कि क्या यह दूर है
    gloss: क्या यह दूर है?
    note: एक छोटा अनुवर्ती प्रश्न, जिसमें कर्ता छोड़ दिया गया है क्योंकि संदर्भ से स्पष्ट है।
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'उत्तर: नहीं, पास है'
    gloss: नहीं, यह पास है।
    note: किसी नामित जगह के साथ पूरा *cerca de* आता है, पर छोटे उत्तर में अकेला *cerca* (बिना *de* के) चलता है।
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'उत्तर: हाँ, काफ़ी दूर'
    gloss: हाँ, यह काफ़ी दूर है।
    note: '*Bastante* (काफ़ी) *lejos* को बढ़ाता है, पर *muy* (बहुत) जितना ज़ोरदार नहीं होता।'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: मोहल्ले के बारे में पढ़ना
    gloss: इस मोहल्ले में कई काम की जगहें हैं। बैंक बाज़ार के बगल में है। दवाखाना बाज़ार के सामने है। पार्क दूर है, लेकिन पुस्तकालय बैंक और पार्क के बीच में है। रेस्तराँ बाज़ार के बहुत पास है।
    note: यह छोटा पाठ इस इकाई के स्थान बताने वाले सभी वाक्यांशों को मोहल्ले के एक वर्णन में एक साथ लाता है।
    glosses:
      barrio: मोहल्ला
      hay: हैं (haber से)
      muchos: कई, बहुत से
      lugares: जगहें
      útiles: काम का, उपयोगी
      banco: बैंक
      está: स्थित है (estar से)
      lado: बगल, किनारा
      mercado: बाज़ार
      farmacia: दवाखाना
      enfrente: सामने
      parque: पार्क
      lejos: दूर
      biblioteca: पुस्तकालय
      entre: के बीच में
      restaurante: रेस्तराँ
      cerca: पास
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (है/हैं)
    gloss: hay एकवचन या बहुवचन के अनुसार क्यों नहीं बदलता।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Hay* (है/हैं) एकवचन या बहुवचन के अनुसार नहीं बदलता: *hay un banco* और *hay muchos lugares* दोनों में एक ही शब्द आता है।'
  es.a1.unit08.lesson06.teach.line01:
    title: पूछिए कि बैंक कहाँ है
    gloss: माटेओ एलेना से पूछता है कि बैंक कहाँ है।
    note: इस इकाई में पहले आया वही *¿Dónde está...?* प्रश्न, जिसकी शुरुआत एलेना का ध्यान खींचने के लिए उसके नाम से हुई है।
  es.a1.unit08.lesson06.teach.line02:
    title: उत्तर दें और बाज़ार का ज़िक्र करें
    gloss: एलेना बताती है कि यह बाज़ार के बगल में है, जहाँ उन्होंने अंडे खरीदे थे।
    note: '*Donde compramos los huevos* (जहाँ हमने अंडे खरीदे) इकाई 7 की उनकी खरीदारी की ओर इशारा करता है।'
  es.a1.unit08.lesson06.teach.line03:
    title: दवाखाने के बारे में पूछिए
    gloss: माटेओ बात समझकर दवाखाने के बारे में पूछता है।
    note: '*Ah, sí* (अच्छा, हाँ) अगला प्रश्न पूछने से पहले सहमति जताने का स्वाभाविक छोटा तरीका है।'
  es.a1.unit08.lesson06.teach.line04:
    title: 'उत्तर: सामने'
    gloss: एलेना कहती है कि यह बाज़ार के सामने है।
    note: 'छोटा उत्तर: कर्ता (*la farmacia*) छोड़ दिया गया है, क्योंकि वह प्रश्न से साफ़ पता चल जाता है।'
  es.a1.unit08.lesson06.teach.line05:
    title: पार्क के बारे में पूछिए
    gloss: मातेओ पार्क के बारे में पूछता है, और यह भी कि क्या वह पास है।
    note: एक ही बार में दो सवाल पूछे गए हैं, जो आम बातचीत में स्वाभाविक है।
  es.a1.unit08.lesson06.teach.line06:
    title: 'जवाब: दूर है, फिर पुस्तकालय का ज़िक्र'
    gloss: एलेना कहती है कि पार्क दूर है, लेकिन पुस्तकालय बैंक और पार्क के बीच में है।
    note: '*Pero* (लेकिन) पार्क की दूरी और पुस्तकालय की ज़्यादा सुविधाजनक जगह के बीच अंतर दिखाता है।'
  es.a1.unit08.lesson06.teach.line07:
    title: धन्यवाद कहिए और रेस्तराँ के बारे में पूछिए
    gloss: मातेओ एलेना को धन्यवाद देता है और उस रेस्तराँ के बारे में पूछता है जहाँ उन्होंने खाना खाया था।
    note: '*El restaurante donde comimos* (वह रेस्तराँ जहाँ हमने खाया) यूनिट 6 के उनके दोपहर के खाने की ओर इशारा करता है।'
  es.a1.unit08.lesson06.teach.line08:
    title: पुष्टि कीजिए कि वह बहुत पास है
    gloss: एलेना पुष्टि करती है कि वह बाज़ार के बहुत पास है।
    note: '*Muy cerca* (बहुत पास): *muy* (बहुत) का असर *bastante* (काफ़ी) से ज़्यादा है, जैसे *bastante lejos* (काफ़ी दूर) में।'
