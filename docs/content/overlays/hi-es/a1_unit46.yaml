teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: तबीयत ठीक न होना
    gloss: मेरी तबीयत ठीक नहीं है।
    note: '*Sentirse* स्पैनिश में प्रतिवाचक क्रिया है (*me siento*, *te sientes*); *no me siento bien* यह कहने का सामान्य, हल्का तरीका है कि कुछ ठीक नहीं लग रहा।'
  es.a1.unit46.lesson01.teach.enfermo:
    title: बीमार
    gloss: बीमार
    note: 'एक बुनियादी विशेषण, जो अवस्था बताने वाली क्रिया *estar* के साथ आता है: *estoy enfermo*।'
    example_gloss: मैं बीमार हूँ।
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: बीमार होना
    gloss: मैं बीमार हूँ।
    note: '*Enfermo* *no me siento bien* से अधिक सामान्य और गंभीर अवस्था बताता है; बोलने वाले के लिंग के अनुसार यह बदलता है (*enferma*)।'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: सिरदर्द
    gloss: सिरदर्द
    note: 'हिंदी में "मुझे सिरदर्द है" कहते हैं, और स्पैनिश में भी *tener* के साथ बिना अदरक की तरह किसी अनिवार्य उपसर्ग के नहीं, बल्कि बिना उपपद के *dolor de cabeza* आता है: *tengo dolor de cabeza*।'
    example_gloss: मेरे सिर में दर्द है।
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: सिरदर्द होना
    gloss: मेरे सिर में दर्द है।
    note: 'लक्षण *tener* (होना/रखना) के साथ आते हैं: *tengo dolor de cabeza*, जैसे हिंदी में "मुझे सिरदर्द है"।'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: पेट दर्द
    gloss: पेट दर्द
    note: '*dolor de cabeza* जैसा ही ढाँचा, बिना उपपद के: *dolor de estómago*।'
    example_gloss: मेरे पेट में दर्द है।
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: पेट दर्द होना
    gloss: मेरे पेट में दर्द है।
    note: यह *dolor de cabeza* जैसे ही *tener* वाले ढाँचे पर चलता है।
  es.a1.unit46.lesson02.teach.que_pasa:
    title: सामान्य रूप से पूछना
    gloss: क्या हुआ?
    note: यह पूछने का एक सामान्य, हर जगह चलने वाला तरीका है कि कोई परेशानी तो नहीं है।
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: एक प्रचलित मुहावरा
    gloss: तुम्हें क्या हुआ?
    note: '*¿Qué te pasa?* पूछने का स्वाभाविक तरीका है कि क्या परेशानी है (शाब्दिक अर्थ "तुम्हारे साथ क्या होता है?"); इसका शब्दशः अनुवाद न करें।'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: गले में दर्द
    gloss: गले में दर्द
    note: '*dolor de cabeza* और *dolor de estómago* जैसा ही ढाँचा: *dolor de garganta*।'
    example_gloss: मेरे गले में दर्द है।
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: गले में दर्द होना
    gloss: मेरे गले में दर्द है।
    note: यह दूसरे लक्षणों की तरह *tener* वाले ढाँचे पर चलता है।
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: किसी का हालचाल पूछना
    gloss: क्या तुम ठीक हो? नहीं, मेरी तबीयत ठीक नहीं है।
    note: '*¿Estás bien?* दोस्तों के बीच पूछा जाने वाला बहुत आम, अनौपचारिक सवाल है; जिसे आप *usted* कहते हैं, उससे *¿Está bien?* पूछा जाता है।'
  es.a1.unit46.lesson03.teach.fiebre:
    title: बुखार
    gloss: बुखार
    note: 'दूसरे लक्षणों की तरह *tener* के बाद बिना उपपद के आता है: *tengo fiebre*।'
    example_gloss: मुझे बुखार है।
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: बुखार होना
    gloss: मुझे बुखार है।
    note: यह *tener* वाले ढाँचे पर चलता है।
  es.a1.unit46.lesson03.teach.resfriado:
    title: जुकाम होना
    gloss: जुकाम होना / जुकाम से पीड़ित
    note: '*Resfriado* एक विशेषण है जो *estar* के साथ आता है; संज्ञा *resfriado* के साथ *tengo un resfriado* भी कह सकते हैं।'
    example_gloss: मुझे जुकाम है।
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: जुकाम होने की बात कहना
    gloss: मुझे जुकाम है।
    note: हिंदी में "मुझे जुकाम है" कहते हैं, जबकि स्पैनिश में *estoy resfriado* (विशेषण) कहा जा सकता है; यह विशेषण बोलने वाले के लिंग के अनुसार बदलता है (*resfriada*)।
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: estar या tener, यह शब्द के प्रकार पर निर्भर है
    gloss: 'Enfermo और resfriado विशेषण हैं और estar के साथ आते हैं: मैं बीमार हूँ, मुझे जुकाम है। Fiebre और dolor de cabeza संज्ञाएँ हैं और tener के साथ आती हैं: मुझे बुखार है, मेरे सिर में दर्द है।'
    note: '*estar* और *tener* का चुनाव शब्द के प्रकार से तय होता है: विशेषण (*enfermo*, *resfriado*) *estar* लेते हैं, और लक्षण वाली संज्ञाएँ (*fiebre*, *dolor de cabeza*) *tener* लेती हैं।'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: दवाखाना
    gloss: दवाखाना
    note: 'एक स्त्रीलिंग संज्ञा: *la farmacia*।'
    example_gloss: मैं दवाखाने जा रहा हूँ।
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: दवाखाने में स्वागत का सवाल
    gloss: मैं आपकी क्या मदद कर सकता हूँ?
    note: '*¿En qué puedo ayudarle?* सेवा देते समय पूछा जाने वाला मानक औपचारिक सवाल है; *ayudarle* में औपचारिक *usted* का कर्म सर्वनाम *le* है।'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: किसी लक्षण की दवा माँगना
    gloss: क्या आपके पास सिरदर्द की कोई दवा है?
    note: '*Algo para* + लक्षण, उपाय माँगने का स्वाभाविक तरीका है: *algo para el dolor de cabeza*।'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: एक गोली
    gloss: एक गोली
    note: 'एक स्त्रीलिंग संज्ञा: *la pastilla*; *una pastilla* का मतलब एक गोली या टैबलेट है।'
    example_gloss: मैं एक गोली लेता हूँ।
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: दवा लेने के निर्देश
    gloss: दिन में दो बार एक गोली लो।
    note: '*Toma*, *tomar* (लेना) का अनौपचारिक आज्ञार्थ रूप है, जो निर्देश देने में आता है।'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: फ़ार्मेसी में बोलने का तरीक़ा
    gloss: फ़ार्मेसी में आप आदरसूचक रूप usted का प्रयोग करते हैं।
    note: 'फ़ार्मासिस्ट सेवा देने वाला एक अपरिचित वयस्क होता है, इसलिए आप *usted* का प्रयोग करते हैं: *¿Tienes algo...?* के बजाय *¿Tiene algo...?*।'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: दवा की सलाह का पर्चा पढ़िए
    gloss: 'सलाह: दिन में दो बार पानी के साथ एक गोली लें। अच्छी तरह आराम करें और खूब पानी पिएँ। क्या तीन दिन बाद भी आप ठीक महसूस नहीं कर रहे? तो डॉक्टर के पास जाएँ।'
    note: खुराक, दवा के अलावा दो सुझाव और डॉक्टर के पास कब जाना है, इन पर ध्यान दीजिए।
    glosses:
      Consejo: सलाह
      toma: लो / लीजिए
      veces: बार
      día: दिन
      pastilla: गोली
      Descansa: आराम करो
      bebe: पियो
      sentirte: महसूस करना
      sigues: अब भी
      bien: अच्छा / अच्छी तरह
      médico: डॉक्टर
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: एलेना हाल पूछती है
    gloss: 'एलेना: हाय मातेओ, कैसे हो? क्या अब तुम बेहतर महसूस कर रहे हो?'
    note: '*Ya* (अब तक) दिखाता है कि एलेना पूछ रही है कि पिछली बातचीत के बाद मातेओ की तबीयत सुधरी या नहीं; *te sientes*, *sentirse* का अनौपचारिक *tú* रूप है।'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: मातेओ अब भी बीमार है
    gloss: 'मातेओ: अभी तक ज़्यादा ठीक नहीं हूँ। सिरदर्द अब भी है और मैं थका हुआ हूँ।'
    note: '*Sigo con* (अब भी है) बताता है कि सिरदर्द गया नहीं है; *cansado* (थका हुआ) एक नया, उपयोगी विशेषण है जो लिंग के अनुसार बदलता है (*cansada*)।'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: एलेना दवा के बारे में पूछती है
    gloss: 'एलेना: क्या तुमने गोली ली?'
    note: '*Has tomado* पूर्ण वर्तमान काल है: *has* + कृदंत *tomado*, ठीक वैसा ही ढाँचा जैसा *me has ayudado* में है।'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: मातेओ हामी भरता है
    gloss: 'मातेओ: हाँ, मैंने एक गोली ली है। अब मैं आराम करने जा रहा हूँ।'
    note: '*Voy a descansar* (मैं आराम करने जा रहा हूँ) निकट भविष्य के ढाँचे *ir a* + क्रिया के मूल रूप का प्रयोग करता है।'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: एलेना शुभकामना देती है
    gloss: 'एलेना: अच्छा विचार है। अच्छी तरह आराम करो। जल्दी ठीक हो जाओ!'
    note: '*¡Que te mejores!* किसी के जल्दी स्वस्थ होने की कामना करने का प्रचलित बँधा हुआ वाक्यांश है; इसमें संभावनार्थक रूप *mejores* आता है।'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: मातेओ विदा लेता है
    gloss: 'मातेओ: शुक्रिया, कल मिलते हैं!'
    note: '*Hasta mañana*, *hasta luego* जैसे विदाई के वाक्यांशों के *hasta* + समय वाले ढाँचे पर बना है।'
