    title: कौन क्या इस्तेमाल करता है?
    gloss: एलेना रोज़ माटेओ को फ़ोन करती है। वह अपना फ़ोन इस्तेमाल करती है, ऐप नहीं। माटेओ के घर में कंप्यूटर नहीं है, लेकिन वह अपने फ़ोन पर इंटरनेट इस्तेमाल करता है। दिएगो हर सुबह मौसम का पूर्वानुमान खोजता है। फिर वह दौड़ने जाता है। लूसिया अक्सर एलेना को संदेश भेजती है। क्या आप भी रोज़ अपना फ़ोन इस्तेमाल करते हैं?
