    note: '*prefiero* (मैं ज़्यादा पसंद करता/करती हूँ) पहले आ चुका है: *Prefiero nadar* में क्रिया के बाद क्रिया का मूल रूप आता है।'
  es.a1.unit56.lesson06.teach.elena_que_bien:
    title: एलेना बातचीत समाप्त करती है
    gloss: 'एलेना: बहुत बढ़िया! शनिवार को पार्क में मिलते हैं!'
