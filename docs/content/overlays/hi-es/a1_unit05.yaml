teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: '*Qué hora* (कौन-सा घंटा) घड़ी का समय पूछता है, जबकि *qué fecha* कैलेंडर की तारीख पूछता है।'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: एक बजा है
    gloss: एक बजा है।
    note: सिर्फ़ एक बजे के लिए *es* (*son* नहीं) क्यों आता है, यह अगले व्याकरण नोट में देखिए।
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: समय के लिए Es और son
    gloss: एक बजा बाकी सभी घंटों से अलग क्यों है।
    note: '*Es la una* (एकवचन), लेकिन *son las dos, son las tres...* (बहुवचन)।'
    target_text: एक बजे के लिए एकवचन क्रिया *es* आती है (Es la una), जबकि बाकी सभी घंटों के लिए बहुवचन *son* आती है (Son las dos, Son las tres...), क्योंकि *la una* एकवचन है ("एक [बजा]") जबकि *las dos*, *las tres* आदि बहुवचन हैं।
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: दो, चार, पाँच, सात बजे
    gloss: दो बजे हैं, चार बजे हैं, पाँच बजे हैं, सात बजे हैं।
    note: एक बजे को छोड़कर हर घंटे के लिए *Son las...* (बहुवचन) का प्रयोग होता है, जैसा पिछले व्याकरण नोट में बताया गया है।
    example_gloss:
    - दो बजे हैं।
    - चार बजे हैं।
    - पाँच बजे हैं।
    - सात बजे हैं।
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: सवा
    gloss: सवा चार बजे हैं (चार बजकर पंद्रह मिनट)।
    note: '*Y cuarto* (और एक चौथाई) बताए गए घंटे में पंद्रह मिनट जोड़ता है।'
  es.a1.unit05.lesson02.teach.y_media:
    title: साढ़े
    gloss: साढ़े सात बजे हैं (सात बजकर तीस मिनट)।
    note: '*Y media* (और आधा) बताए गए घंटे में तीस मिनट जोड़ता है।'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: पौने
    gloss: पौने पाँच बजे हैं (चार बजकर पैंतालीस मिनट)।
    note: '*menos* अगले घंटे तक के मिनट कैसे गिनता है, इसके लिए अगला व्याकरण नोट देखें।'
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (घंटे से पहले/पौने)
    gloss: स्पेनिश में अगले घंटे से पहले के मिनट कैसे गिने जाते हैं, जैसे हिंदी में "पौने" कहते हैं।
    note: '*Las cinco menos cuarto* = पौने पाँच (4:45)।'
    target_text: '*Menos* (घटा, कम) अगले घंटे तक की उलटी गिनती करता है: *las cinco menos cuarto* यानी 4:45, जिसे "पौने पाँच" पढ़ा जाता है; हिंदी के "पौने" जैसा ही तर्क।'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: सुबह, दोपहर बाद, रात
    gloss: सुबह, दोपहर/शाम को, रात को
    note: '*De la mañana/tarde/noche* समय के बाद जोड़कर साफ़ करता है कि AM है या PM, जैसे हिंदी में हम "सुबह", "शाम" या "रात" जोड़ते हैं।'
    example_gloss:
    - सुबह के आठ बजे हैं।
    - वर्कशॉप दोपहर बाद चार बजे शुरू होती है।
    - रात के दस बजे हैं।
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: वर्कशॉप चार बजे शुरू होती है
    gloss: वर्कशॉप दोपहर बाद चार बजे शुरू होती है।
    note: '*Empieza* (शुरू होता/होती है) क्रिया *empezar* का अन्य पुरुष रूप है, जो इस यूनिट में नई क्रिया है।'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: पूछें कि कुछ कितने बजे शुरू होता है
    gloss: वर्कशॉप कितने बजे शुरू होती है?
    note: '*A qué hora* (किस समय) किसी खास आयोजन का समय पूछने का सामान्य तरीका है। यह सामान्य *qué hora es* (अभी क्या समय हुआ है) से अलग है।'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: मिलने का समय पूछें
    gloss: हम कितने बजे मिलें?
    note: '*Nos vemos* (हम एक-दूसरे को देखते हैं / हम मिलेंगे) किसी से मिलने की योजना बनाते समय प्रयोग होने वाला प्रतिवर्ती-जैसा रूप है।'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: मिलने का समय सुझाएँ
    gloss: क्या हम साढ़े तीन बजे मिलें?
    note: यह *y media* और *nos vemos* को जोड़कर एक खास समय सुझाता है।
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: वर्कशॉप से पहले
    gloss: वह वर्कशॉप से पहले है।
    note: '*Antes de* (से पहले) का उलटा *después* (के बाद) है।'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: सहमत / ठीक है
    gloss: सहमत / ठीक है
    note: '*De acuerdo* योजना की पुष्टि करने का स्वाभाविक और छोटा तरीका है, जो काम में *Muy bien* जैसा है।'
    example_gloss: ठीक है, हम साढ़े तीन बजे मिलेंगे।
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: दिन का कार्यक्रम पढ़ना
    gloss: वर्कशॉप दोपहर बाद चार बजे शुरू होती है। उससे पहले एलेना और मातेओ साढ़े तीन बजे मिलते हैं। वर्कशॉप छह बजे खत्म होती है। अगले दिन वे दोपहर का खाना खाने के लिए एक बजे मिलते हैं।
    note: 'दिन का एक छोटा कार्यक्रम: मुलाकात, वर्कशॉप और अगले दिन का दोपहर का खाना।'
    glosses:
      taller: वर्कशॉप
      empieza: शुरू होती है (empezar से)
      cuatro: चार
      tarde: दोपहर बाद
      Antes: पहले
      ven: मिलते हैं (verse से)
      tres: तीन
      media: आधा
      termina: खत्म होती है (terminar से)
      seis: छह
      día: दिन
      siguiente: अगला
      almorzar: दोपहर का खाना खाना
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: अगले दिन
    gloss: अगले दिन / उसके अगले दिन
    note: '*Al día siguiente* (अगले दिन) कहानी को नए दिन में आगे बढ़ाने का आम तरीका है। यह *la próxima clase* (अगली कक्षा, यानी कोई खास आयोजन, कैलेंडर का दिन नहीं) से अलग है।'
  es.a1.unit05.lesson06.teach.line01:
    title: वर्कशॉप के बाद खाने के बारे में पूछें
    gloss: मातेओ कहता है कि वर्कशॉप छह बजे खत्म होती है और एलेना से पूछता है कि क्या उसके बाद उसे भूख लगी होगी।
    note: '*Tienes hambre* (क्या तुम्हें भूख लगी है) एक नया मुहावरा है। शाब्दिक अर्थ है "तुम्हारे पास भूख है", यानी वही tener वाली संरचना जो *tener ... años* और *tener hermanos* में है।'
  es.a1.unit05.lesson06.teach.line02:
    title: हामी भरें और अगले दिन का सुझाव दें
    gloss: एलेना कहती है कि हाँ, थोड़ी, और इसके बदले अगले दिन खाने का सुझाव देती है।
    note: '*¿Comemos mañana?* वर्कशॉप के ठीक बाद की जगह कल का प्रस्ताव रखता है, जिससे आगे किसी खास समय की बातचीत की भूमिका बनती है।'
  es.a1.unit05.lesson06.teach.line03:
    title: सहमति दें और समय पूछें
    gloss: मातेओ सहमत होता है कि यह अच्छा विचार है और समय पूछता है।
    note: '*Buena idea* (अच्छा विचार) किसी सुझाव से सहमत होने का स्वाभाविक और छोटा तरीका है।'
  es.a1.unit05.lesson06.teach.line04:
    title: एक बजे का सुझाव दें
    gloss: एलेना एक बजे मिलने का सुझाव देती है।
    note: '*A la una* (एक बजे) में एकवचन *la una* आता है, जैसे *Es la una* में।'
  es.a1.unit05.lesson06.teach.line05:
    title: पुष्टि करें और एक रेस्टोरेंट का ज़िक्र करें
    gloss: मातेओ पुष्टि करता है कि एक बजे ठीक है और पास के एक रेस्टोरेंट का ज़िक्र करता है।
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (के पास), जैसे *cerca de tus padres* में, यहाँ किसी जगह के लिए प्रयोग हुआ है।'
  es.a1.unit05.lesson06.teach.line06:
    title: गर्मजोशी से विदा लें
    gloss: एलेना खुशी से प्रतिक्रिया देती है और कहती है कि कल मिलते हैं।
    note: '*¡Genial!* (बढ़िया!) बातचीत को उत्साह के साथ समाप्त करता है, जो काम में *¡Qué bien!* जैसा है।'
