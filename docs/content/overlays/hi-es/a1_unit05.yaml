course:
  title: स्पेनिश A1
  description: घड़ी का समय बताना और पूछना, दिन के हिस्से, और मिलने का समय तय करना; इकाई 01-04 से चल रही एलेना और माटेओ की खाना पकाने की कार्यशाला की कहानी आगे बढ़ती है। es/son के एकवचन-बहुवचन वाले अपवाद और cuarto/media/menos जैसे भिन्न बताने वाले शब्दों पर खास ध्यान दिया गया है।
