teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: फ़ोन करना
    gloss: फ़ोन करना
    note: फ़ोन कॉल करने वाली क्रिया का मूल रूप (क्रिया का मूल रूप)।
    example_gloss: मुझे तुम्हें फ़ोन करना है।
  es.a1.unit47.lesson01.teach.te_llamo:
    title: फ़ोन करने की बात कहना
    gloss: मैं तुम्हें फ़ोन करूँगा।
    note: '*Llamo*, *llamar* का *yo* रूप है; *te* के साथ इसका शाब्दिक अर्थ है "मैं तुम्हें फ़ोन करता हूँ"। स्पेनिश में ऐसे भविष्य के इरादे के लिए वर्तमान काल का प्रयोग होता है।'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: फ़ोन उठाना
    gloss: नमस्ते, मैं Elena बोल रही हूँ।
    note: स्पेनिश में फ़ोन पर अपना परिचय *soy* + नाम (शाब्दिक अर्थ "मैं हूँ") से दिया जाता है।
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo भी उसी तरह जवाब देता है
    gloss: नमस्ते, मैं Mateo बोल रहा हूँ।
    note: वही *soy* + नाम का ढाँचा, जो *Hola, soy Elena* में है।
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: पूछना कि फ़ोन किसका है
    gloss: मैं किससे बात कर रहा हूँ?
    note: जब आप न जानते हों कि फ़ोन किसने किया है, तब *¿Con quién hablo?* पूछने का सामान्य वाक्य है।
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: औपचारिक ढंग से अपना परिचय देना
    gloss: आप Elena से बात कर रहे हैं।
    note: '*Habla con* + नाम में *hablar* का औपचारिक *usted* रूप है: यह *soy* + नाम का विनम्र रूप है।'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: बात दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: '*¿Puedes...?* (क्या तुम ... सकते हो?) + *repetir* (दोहराना) + *eso* (यह/वह)।'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: किसी से धीरे बोलने को कहना
    gloss: कृपया इतनी तेज़ मत बोलो।
    note: '*No hables*, *hablar* का अनौपचारिक निषेधात्मक आदेश रूप है; *tan rápido* (इतना तेज़) गति की मात्रा बताता है।'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: कहना कि आवाज़ ठीक से नहीं आ रही
    gloss: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    note: '*Oír* (सुनना) के साथ *no ... bien* (ठीक से नहीं) सुनाई न देने की समस्या बताता है, जो *entender* (समझना) से अलग है; *te oigo* का अर्थ है "मुझे तुम्हारी आवाज़ सुनाई दे रही है"।'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट मैसेज
    note: 'पुल्लिंग संज्ञा: *el mensaje*। स्पेनिश भाषी *el SMS* या *el texto* भी कहते हैं, पर *mensaje* सबसे सामान्य विकल्प है।'
    example_gloss: मैसेज एलेना की ओर से है।
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: टेक्स्ट भेजने की बात कहना
    gloss: मैं तुम्हें मैसेज भेज दूँगा।
    note: '*Enviar* (भेजना) सर्वनाम *te* (तुम्हें) के बाद आता है: *te envío un mensaje*।'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: वापस कॉल करने की बात कहना
    gloss: मैं तुम्हें बाद में वापस कॉल करूँगा।
    note: '*Más tarde* (बाद में) वाक्य के अंत में आता है: *te llamo más tarde*।'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: टेक्स्ट बातचीत पढ़ें
    gloss: 'मातेओ: हाय एलेना, क्या तुम मुझे कॉल कर सकती हो? मुझे तुम्हें कुछ बताना है। एलेना: हाँ, ज़रूर, मैं पाँच मिनट में वापस कॉल करती हूँ।'
    note: ध्यान दें कि मातेओ क्या माँगता है, क्यों माँगता है, और एलेना कब वापस कॉल करने को कहती है।
    glosses:
      Hola: हाय
      puedes: सकते हो
      llamarme: कॉल करना
      Tengo: करना होगा
      algo: कुछ
      contarte: बताना
      claro: ज़रूर
      llamada: कॉल करना
      cinco: पाँच
      minutos: मिनट
      devuelvo: वापस
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: मातेओ कॉल उठाता है
    gloss: 'मातेओ: हैलो, मैं मातेओ बोल रहा हूँ।'
    note: 'पहले पाठ का *soy* + नाम वाला ढाँचा अब असली फ़ोन कॉल में: फ़ोन उठाने वाला पहले बोलता है और अपना नाम बताता है।'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: एलेना अपना परिचय देती है
    gloss: 'एलेना: हाय मातेओ, मैं एलेना बोल रही हूँ। मातेओ: कॉल करने के लिए शुक्रिया!'
    note: '*Gracias por llamar* (कॉल करने के लिए शुक्रिया) में *gracias por* + क्रिया का मूल रूप (क्रिया का मूल रूप) आता है।'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: एलेना शिफ़्ट के बारे में पूछती है
    gloss: 'एलेना: तुम्हारी पहली शिफ़्ट कैसी रही?'
    note: '*Ha ido* क्रिया *ir* का वर्तमान पूर्ण काल रूप है (यहाँ "रहना/बीतना" के अर्थ में): *ha* + भूतकृदंत *ido*।'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: मातेओ अच्छी ख़बर देता है
    gloss: 'मातेओ: बहुत अच्छी रही, उम्मीद से भी बेहतर।'
    note: '*Ha ido muy bien* में प्रश्न वाला वर्तमान पूर्ण काल ही दोहराया गया है; *mejor de lo esperado* (उम्मीद से बेहतर) में तुलना *de lo* से होती है।'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado अपने मूल क्रिया रूप के साथ
    gloss: ha ido → ir (जाना), es → ser (होना), esperado → esperar (उम्मीद करना)
    note: '*Ha ido*, *es* और *esperado* अपने मूल रूपों के साथ दिखाए गए हैं: *ir*, *ser*, *esperar*। अभी *ha ido muy bien* को एक तयशुदा वाक्यांश मानें; वर्तमान पूर्ण काल का अभ्यास आगे ठीक से होगा।'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: एलेना को गर्व है
    gloss: 'एलेना: यह सुनकर कितना अच्छा लगा! मुझे तुम पर गर्व है।'
    note: '*Orgulloso/a de* (...पर गर्व करना) *de* के साथ बना स्थिर मेल है; विशेषण बोलने वाले के अनुसार बदलता है (एलेना के लिए *orgullosa*)।'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: मातेओ भावुक है
    gloss: 'मातेओ: बहुत शुक्रिया, यह मेरे लिए बहुत मायने रखता है।'
    note: '*Significa* क्रिया *significar* (मतलब होना) का अन्य पुरुष एकवचन रूप है; *para mí* (मेरे लिए) बताता है कि यह किसके लिए मायने रखता है।'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: उसका
    gloss: उसकी पहली शिफ़्ट बहुत अच्छी रही।
    note: यहाँ *Su* का अर्थ "उसका/उसकी" है (*usted* के साथ "आपका" भी); किसका है, यह संदर्भ से पता चलता है।
