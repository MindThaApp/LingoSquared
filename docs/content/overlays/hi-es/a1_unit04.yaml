  description: सप्ताह के दिन, साल के महीने, तथा कैलेंडर की तारीख़ और जन्मदिन पूछना और बताना; यूनिट 01-03 से Elena और Mateo की खाना पकाने की कार्यशाला की कहानी आगे बढ़ती है। तारीख़ बताने में गिनती वाली संख्या और दिन-de-महीना के क्रम पर ख़ास ध्यान दिया गया है।
