teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: सोमवार से शुक्रवार
    gloss: सोमवार, मंगलवार, बुधवार, गुरुवार, शुक्रवार
    note: वाक्य की शुरुआत को छोड़कर स्पेनिश में सप्ताह के दिनों के नाम छोटे अक्षरों से लिखे जाते हैं, बड़े अक्षर से नहीं।
    example_gloss:
    - कुकिंग वर्कशॉप हर मंगलवार को होती है।
    - गुरुवार को मैं स्पेनिश पढ़ता/पढ़ती हूँ।
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: शनिवार, रविवार
    gloss: शनिवार, रविवार
    note: '*Sábado* और *domingo* सप्ताह के केवल दो ऐसे दिन हैं जो बहुवचन में -s लेते हैं (*los sábados*, *los domingos*); बाकी दिनों के नाम एकवचन और बहुवचन में एक जैसे रहते हैं।'
    example_gloss:
    - शनिवार को मैं बाज़ार जाता/जाती हूँ।
    - रविवार को मैं आराम करता/करती हूँ।
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: आज शुक्रवार है
    gloss: आज शुक्रवार है।
    note: '*Hoy* (आज) + *es* (है) + दिन का नाम सीधे आज का दिन बताता है; इसमें किसी उपपद की ज़रूरत नहीं होती।'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: वर्कशॉप मंगलवार को होती है
    gloss: कुकिंग वर्कशॉप हर मंगलवार को होती है।
    note: '*Los martes* (बहुवचन उपपद *los* के साथ) का अर्थ है "हर मंगलवार को", यानी नियमित कार्यक्रम; यह किसी एक खास मंगलवार के लिए नहीं है।'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: जनवरी–जून
    gloss: जनवरी, फ़रवरी, मार्च, अप्रैल, मई, जून
    note: स्पेनिश में दिनों की तरह महीनों के नाम भी छोटे अक्षरों (लोअरकेस) में लिखे जाते हैं, जब तक वे वाक्य की शुरुआत में न हों।
    example_gloss:
    - मेरा जन्मदिन मार्च में है।
    - जून में गर्मी होती है।
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: जुलाई–दिसंबर
    gloss: जुलाई, अगस्त, सितंबर, अक्टूबर, नवंबर, दिसंबर
    note: स्पेनिश में ज़्यादातर महीनों के नाम (जैसे *septiembre*) हिंदी में प्रचलित सितंबर, अक्टूबर, नवंबर, दिसंबर जैसे नामों से काफ़ी मिलते-जुलते हैं, इसलिए उन्हें याद रखना आसान है।
    example_gloss:
    - कुकिंग वर्कशॉप जुलाई में शुरू होती है।
    - दिसंबर में मैं अपने परिवार से मिलने जाता/जाती हूँ।
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: मेरा जन्मदिन मार्च में है
    gloss: मेरा जन्मदिन मार्च में है।
    note: जब केवल महीने का नाम बताना हो और कोई खास तारीख़ न हो, तब *en* (में) का प्रयोग होता है।
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: आज की तारीख़ पूछना
    gloss: आज की तारीख़ क्या है?
    note: '*Qué fecha* (कौन-सी तारीख़) कैलेंडर की तारीख़ पूछने का सामान्य तरीका है। यह *qué hora* (क्या समय हुआ है) से अलग है, जो आगे की एक यूनिट में आएगा।'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: तारीख़ बताना
    gloss: आज बाईस जुलाई है।
    note: '*El veintidós de julio* का शाब्दिक अर्थ है "जुलाई का बाईस"। स्पेनिश में तारीख़ के लिए साधारण संख्या (बाईस) का प्रयोग होता है, क्रमसूचक संख्या (बाईसवाँ) का नहीं। हिंदी में भी "22 जुलाई" इसी तरह कहा जाता है।'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: स्पेनिश में तारीख़ कहने का तरीका
    gloss: स्पेनिश में कैलेंडर की तारीख़ें कैसे बताई जाती हैं।
    note: साधारण संख्या + de + महीना। महीने की पहली तारीख़ के लिए *el primero* आम है (खासकर लैटिन अमेरिका में), और *el uno* भी प्रयोग होता है, खासकर स्पेन में।
    target_text: 'हिंदी की तरह स्पेनिश में भी तारीख़ के लिए सामान्य गिनती वाली संख्या आती है, और क्रम भी वही है: दिन, फिर महीना, बीच में de। el veintidós de julio का शाब्दिक अर्थ है "जुलाई का बाईस"। महीने के पहले दिन के लिए बहुत-से लोग (ख़ासकर लैटिन अमेरिका में) *el primero* कहते हैं; *el uno* भी आम है, ख़ासकर स्पेन में।'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: पूछना कि वर्कशॉप कब है
    gloss: वर्कशॉप कब है?
    note: '*Cuándo* (कब) सामान्य रूप से समय के बारे में पूछता है; *qué fecha* (इस पाठ का दूसरा प्रश्न) खास तौर पर कैलेंडर की तारीख़ पूछता है। यहाँ दोनों स्वाभाविक हैं।'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: वर्कशॉप की तारीख़ बताना
    gloss: वर्कशॉप बाईस जुलाई को है।
    note: यह वही तारीख़ वाला ढाँचा है जो *hoy es el veintidós de julio* में था, बस कर्ता अलग है (*el taller*)।
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: किसी का जन्मदिन पूछना
    gloss: आपका जन्मदिन कब है?
    note: '*Tu cumpleaños* (आपका/तुम्हारा जन्मदिन) में अनौपचारिक *tú* का रूप है, जो दोस्तों के लिए प्रयोग होता है।'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: अपना जन्मदिन बताना
    gloss: मेरा जन्मदिन दस मार्च को है।
    note: '*En marzo* (मार्च में, केवल महीना) के विपरीत, पूरी जन्मतिथि बताने के लिए *el* और तारीख़ की संख्या आती है, ठीक *el veintidós de julio* वाले ढाँचे की तरह।'
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: किसी तीसरे व्यक्ति का जन्मदिन बताना
    gloss: मातेओ का जन्मदिन बाईस अगस्त को है।
    note: '*El cumpleaños de Mateo* (मातेओ का जन्मदिन) में स्वामित्व दिखाने के लिए *de* आता है, ठीक *la familia de Elena* की तरह।'
  es.a1.unit04.lesson04.teach.felicidades:
    title: बधाई!
    gloss: बधाई हो! / जन्मदिन मुबारक!
    note: '*¡Felicidades!* बधाई देने का आम शब्द है, जो जन्मदिन के साथ-साथ दूसरी खुशखबरी पर भी कहा जाता है।'
    example_gloss: बधाई हो, एलेना! आज तुम्हारा जन्मदिन है।
  es.a1.unit04.lesson05.teach.horario_reading:
    title: वर्कशॉप का कार्यक्रम पढ़ना
    gloss: कुकिंग वर्कशॉप हर मंगलवार को होती है। अगली कक्षा बाईस जुलाई को है। उसके बाद उनतीस जुलाई को एक कक्षा है। वर्कशॉप बारह अगस्त को समाप्त होती है।
    note: इस छोटे कार्यक्रम में, एक ही पाठ में, आपके सीखे हुए दिनों के नाम और तारीख़ का ढाँचा इस्तेमाल हुआ है।
    glosses:
      taller: वर्कशॉप
      cocina: खाना पकाना
      martes: हर मंगलवार को
      próxima: अगली
      clase: कक्षा
      veintidós: बाईस
      julio: जुलाई
      Después: उसके बाद
      hay: है (मौजूद है)
      veintinueve: उनतीस
      termina: समाप्त होती है
      doce: बारह
      agosto: अगस्त
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: अगली कक्षा
    gloss: अगली कक्षा
    note: '*Próxima* (अगली) स्त्रीलिंग संज्ञा *clase* के अनुसार बदला हुआ रूप है; पुल्लिंग रूप *próximo* होता है।'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (बाद में)
    gloss: '*Después* घटनाओं को क्रम में कैसे जोड़ता है।'
    note: '*Después* = बाद में, उसके बाद।'
    target_text: '*Después* (बाद में) दो घटनाओं को क्रम से जोड़ता है: पहले एक बात, फिर अगली।'
  es.a1.unit04.lesson06.teach.line01:
    title: अगली कक्षा के बारे में पूछना
    gloss: मातेओ एलेना से पूछता है कि वर्कशॉप की अगली कक्षा कब है।
    note: '*La próxima clase del taller* = वर्कशॉप की अगली कक्षा।'
  es.a1.unit04.lesson06.teach.line02:
    title: तारीख़ बताना
    gloss: एलेना बताती है कि वह बाईस जुलाई है, एक मंगलवार।
    note: एलेना तारीख़ के बाद *un martes* (एक मंगलवार) जोड़ती है, जिससे पक्का होता है कि कक्षा वर्कशॉप के नियमित दिन, मंगलवार को है।
  es.a1.unit04.lesson06.teach.line03:
    title: पूछना कि वर्कशॉप कब समाप्त होती है
    gloss: मातेओ पूछता है कि वर्कशॉप कब समाप्त होती है।
    note: '*Perfecto* (बिल्कुल ठीक) अगला सवाल पूछने से पहले सहमति जताने का एक छोटा, स्वाभाविक तरीका है।'
  es.a1.unit04.lesson06.teach.line04:
    title: समाप्ति की तारीख़ बताना
    gloss: एलेना कहती है कि वह बारह अगस्त को समाप्त होती है।
    note: यह वही समाप्ति की तारीख़ है जो छपे हुए कार्यक्रम में है।
  es.a1.unit04.lesson06.teach.line05:
    title: बातचीत के बीच जन्मदिन पूछना
    gloss: मातेओ "वैसे" कहकर पूछता है कि एलेना का जन्मदिन कब है।
    note: '*Por cierto* (वैसे) चलती बातचीत में विषय बदलने का स्वाभाविक तरीका है।'
  es.a1.unit04.lesson06.teach.line06:
    title: तारीख़ बताना और सवाल लौटाना
    gloss: एलेना कहती है दस मार्च, फिर पूछती है "और आपका?"
    note: '*¿Y el tuyo?* (और आपका/तुम्हारा?) में स्वामित्व वाला सर्वनाम *tuyo* है। यह पहले से कही गई चीज़ (*cumpleaños*, पुल्लिंग, इसलिए *tuyo*, *tuya* नहीं) के बारे में सवाल लौटाने का छोटा रूप है।'
  es.a1.unit04.lesson06.teach.line07:
    title: मातेओ का जन्मदिन बताना
    gloss: मातेओ कहता है बाईस अगस्त।
    note: यह एक छोटा, पूरा उत्तर है जो "मेरा जन्मदिन है" दोहराए बिना सीधे तारीख़ बताता है; तेज़ बोलचाल में यह स्वाभाविक लगता है।
  es.a1.unit04.lesson06.teach.line08:
    title: प्रतिक्रिया देना और समय बताना
    gloss: एलेना खुश होकर प्रतिक्रिया देती है और बताती है कि उसका जन्मदिन वर्कशॉप खत्म होने के बाद पड़ता है।
    note: '*Es después del taller* (यह वर्कशॉप के बाद है): 22 अगस्त, वर्कशॉप के खत्म होने की तारीख़ 12 अगस्त के बाद आता है।'
