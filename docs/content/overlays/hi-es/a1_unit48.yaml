teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'शौक़ों की तीन आम क्रियाएँ: *leer* (पढ़ना), *hacer deporte* (कसरत या खेलकूद करना) और *cocinar* (खाना पकाना)।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*El tiempo libre* पुल्लिंग संज्ञा-पद है और शौक़ों के बारे में बात करने का मुख्य पद है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Me gusta leer* (मुझे पढ़ना पसंद है) में *gustar* के साथ क्रिया का मूल रूप आता है; किसी भी गतिविधि के लिए *me gusta* वैसा ही रहता है।'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'शौक़ों की तीन और क्रियाएँ: *escuchar música* (संगीत सुनना), *dibujar* (चित्र बनाना) और *jugar videojuegos* (वीडियो गेम खेलना)।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Escuchar* अपनी कर्म-वस्तु के साथ सीधे आता है, बीच में कोई पूर्वसर्ग नहीं लगता: *escuchar música*।'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Con amigos* (दोस्तों के साथ) में पिछले पाठों का शब्द *con* फिर से आया है।'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'आवृत्ति बताने वाले चार मुख्य क्रियाविशेषण: *siempre* (हमेशा), *a menudo* (अक्सर), *a veces* (कभी-कभी), *nunca* (कभी नहीं)। ये आमतौर पर क्रिया से पहले या वाक्य की शुरुआत में आते हैं।'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Cada semana* और *cada fin de semana* दोनों का अर्थ "हर" है; *cada* का रूप कभी नहीं बदलता।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada कभी नहीं बदलता
    gloss: 'Cada वही रहता है: cada semana, cada fin de semana।'
    note: '*Cada* कभी नहीं बदलता: यह स्त्रीलिंग (*semana*) और पुल्लिंग (*fin de semana*) दोनों संज्ञाओं से पहले एक जैसा रहता है।'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: एलेना शौक़ की बात छेड़ती है
    gloss: 'एलेना: हम अक्सर साथ टहलते हैं। लेकिन माटेओ, तुम अपने खाली समय में और क्या करते हो?'
    note: '*A menudo paseamos juntos* (हम अक्सर साथ टहलते हैं): *paseamos*, *pasear* का *nosotros* रूप है।'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: माटेओ के शौक़
    gloss: 'माटेओ: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर कसरत करता हूँ।'
    note: '*También en casa* (घर पर भी) बताता है कि माटेओ सिर्फ़ रेस्तराँ की नौकरी में ही नहीं, शौक़ से भी खाना बनाता है।'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: एलेना हैरान है
    gloss: 'एलेना: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही काम पर पूरा दिन खाना बनाते हो!'
    note: '*Todo el día* (पूरा दिन) दिखाता है कि माटेओ काम पर पहले ही कितना खाना बनाता है।'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: माटेओ समझाता है
    gloss: 'माटेओ: हाँ, लेकिन मुझे खाना बनाना सुकून देने वाला लगता है। और तुम्हें क्या करना पसंद है?'
    note: '*Cocinar me parece relajante* का शाब्दिक अर्थ है "खाना बनाना मुझे सुकून देने वाला लगता है": *me parece* + विशेषण अपनी राय देने का स्वाभाविक तरीक़ा है।'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: एलेना के शौक़
    gloss: 'एलेना: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: पिछले पाठों की दो शौक़ वाली क्रियाएँ *y* (और) से एक वाक्य में जुड़ी हैं।
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: माटेओ वीडियो गेम के बारे में पूछता है
    gloss: 'माटेओ: क्या तुम भी वीडियो गेम खेलती हो?'
    note: पाठ 2 के *jugar videojuegos* वाला एक छोटा हाँ/नहीं प्रश्न; *tú también* (तुम भी) में अनौपचारिक *tú* है।
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: एलेना जवाब देती है
    gloss: 'एलेना: नहीं, मैं कभी वीडियो गेम नहीं खेलती। लेकिन कभी-कभी चित्र बनाती हूँ!'
    note: पाठ 3 के *nunca* (कभी नहीं) और *a veces* (कभी-कभी) एक ही जवाब में आमने-सामने हैं।
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: शौक़ों की तुलना
    gloss: माटेओ और मैं अक्सर साथ टहलते हैं। लेकिन हमारे और भी शौक़ हैं। माटेओ को खाना बनाना पसंद है, घर पर भी, और वह अक्सर कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, लेकिन कभी वीडियो गेम नहीं खेलती। आपको अपने खाली समय में क्या करना पसंद है?
    note: एलेना का संदेश पिछले पाठ की बातें दोहराता है और पाठक से इस इकाई का मुख्य प्रश्न पूछकर ख़त्म होता है।
    glosses:
      paseamos: टहलना
      menudo: अक्सर
      juntos: साथ-साथ
      otras: दूसरे
      cocinar: खाना बनाता है
      gusta: पसंद है
      casa: घर पर
      deporte: कसरत करता है
      leer: पढ़ना
      escucho: सुनना
      música: संगीत
      dibujo: चित्र बनाती हूँ
      veces: कभी-कभी
      videojuegos: वीडियो गेम खेलना
      nunca: कभी नहीं
      libre: खाली
      tiempo: समय
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: माटेओ सप्ताहांत के बारे में पूछता है
    gloss: 'माटेओ: तुम इस सप्ताहांत क्या कर रही हो?'
    note: '*Este fin de semana* (इस सप्ताहांत) में पुल्लिंग संज्ञा *fin de semana* के साथ *este* आता है।'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: एलेना अभी तय नहीं कर पाई
    gloss: 'एलेना: अभी पता नहीं। मुझे पढ़ना पसंद है, लेकिन बाहर भी जाना चाहती हूँ।'
    note: '*Quiero salir* (मैं बाहर जाना चाहती हूँ) घर से बाहर निकलने की इच्छा बताने का आम तरीक़ा है।'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: माटेओ योजना सुझाता है
    gloss: 'माटेओ: साथ टहलें? उसके बाद मैं हमारे लिए खाना बनाऊँगा।'
    note: '*Después* (उसके बाद) क्रम बताने वाला शब्द है: *primero*, *luego*, *después*।'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: एलेना मान जाती है
    gloss: 'एलेना: अच्छा विचार है! मुझे दोनों चीज़ें पसंद हैं: टहलना और खाना बनाना।'
    note: '*Las dos cosas* (दोनों चीज़ें) दिखाता है कि एलेना को दोनों बराबर पसंद हैं, एक दूसरे से ज़्यादा नहीं।'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: माटेओ पक्का करता है
    gloss: 'माटेओ: बढ़िया! तो शनिवार को मिलते हैं!'
    note: योजना पक्की करने वाली एक मित्रतापूर्ण समापन पंक्ति, *el sábado* (शनिवार को) के लिए; किसी खास दिन से पहले स्पेनिश में *el* लगता है।
