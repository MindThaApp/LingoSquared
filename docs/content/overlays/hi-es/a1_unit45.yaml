teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: कुल कीमत पूछना
    gloss: कुल मिलाकर कितना होता है?
    note: '*En total* से साफ़ होता है कि आप पूरी जोड़ी हुई कीमत जानना चाहते हैं, किसी एक चीज़ की कीमत नहीं।'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: कुल कीमत बताना
    gloss: कुल मिलाकर पच्चीस यूरो होता है।
    note: '*Cuesta*, *costar* (कीमत होना) का एकवचन अन्य पुरुष रूप है; जब स्वर पर बल पड़ता है तो धातु का *o* बदलकर *ue* हो जाता है।'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: कार्ड या नकद से भुगतान करना
    gloss: कार्ड से भुगतान करना, नकद भुगतान करना
    note: '*Pagar con tarjeta* (कार्ड से भुगतान करना) और *pagar en efectivo* (नकद भुगतान करना) में अलग-अलग पूर्वसर्ग आते हैं: साधन के लिए *con*, पैसे के रूप के लिए *en*।'
    example_gloss:
    - क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    - मैं नकद भुगतान कर रहा हूँ।
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: कार्ड से भुगतान की संभावना पूछना
    gloss: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    note: '*Puedo* (मैं सकता हूँ) *poder* का *yo* रूप है; *aquí* (यहाँ) से सवाल उसी जगह के बारे में हो जाता है जहाँ आप हैं।'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: भुगतान की पसंद पूछना
    gloss: आप नकद भुगतान करना चाहेंगे या कार्ड से?
    note: '*Quiere*, *querer* का आदरसूचक *usted* रूप है, जिसे यहाँ अपरिचित कैशियर इस्तेमाल करता है; दोस्त से आप *¿quieres pagar...?* कहेंगे।'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: बिल
    gloss: बिल
    note: 'स्त्रीलिंग संज्ञा: *la cuenta*। रेस्तराँ में इसका मतलब बिल है; बैंक में इसका मतलब खाता है।'
    example_gloss: क्या हम बिल बाँट लें?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: बिल बाँटने का सुझाव देना
    gloss: क्या हम बिल बाँट लें?
    note: '*¿Dividimos...?* में सुझाव देने के लिए *nosotros* रूप आता है; हिंदी में यही बात "क्या हम ... लें?" से कही जाती है।'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: अलग-अलग भुगतान करने को कहना
    gloss: क्या मैं अलग से भुगतान कर सकता हूँ?
    note: '*Por separado* (अलग से) बताता है कि आप कैसे भुगतान करते हैं; *pagar* (भुगतान करना) इसके लिए रोज़मर्रा की क्रिया है।'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: बाकी पैसे
    gloss: बाकी पैसे
    note: 'पुल्लिंग संज्ञा: *el cambio*। इसका मतलब किसी भी तरह का बदलाव भी है, जैसे *un cambio de planes*।'
    example_gloss: ये रहे आपके बाकी पैसे।
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: बाकी पैसे लौटाना
    gloss: ये रहे आपके बाकी पैसे।
    note: '*Su* आदरसूचक *usted* के साथ आने वाला अधिकारवाचक शब्द है ("आपका"); *Aquí tiene* कुछ थमाते समय कहा जाने वाला आम विनम्र वाक्य है।'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: बाकी पैसे लेने से मना करना
    gloss: मुझे बाकी पैसे नहीं चाहिए।
    note: '*Necesitar* (ज़रूरत होना) अपनी वस्तु सीधे लेता है, बिना किसी पूर्वसर्ग के: *necesito cambio*; *no* क्रिया को नकारात्मक बना देता है।'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: पैंतीस
    gloss: पैंतीस
    note: '*Treinta y cinco* (पैंतीस): 31 से 99 तक स्पेनिश में दहाई और इकाई को *y* से जोड़ा जाता है और उन्हें अलग-अलग शब्दों में लिखा जाता है।'
    example_gloss: इसकी कीमत पैंतीस यूरो है।
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: रेस्तराँ का बिल पढ़िए
    gloss: 'बिल: दो मुख्य व्यंजन और दो कॉफ़ी। कुल: पैंतीस यूरो। कार्ड से भुगतान किया गया।'
    note: देखिए कि क्या मँगाया गया, कुल कितना हुआ और भुगतान कैसे किया गया।
    glosses:
      Cuenta: बिल
      dos: दो
      platos: मुख्य व्यंजन
      cafés: कॉफ़ी
      Total: कुल
      treinta: पैंतीस
      euros: यूरो
      Pagado: चुकाया गया
      tarjeta: कार्ड
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: एलेना बिल माँगती है
    gloss: 'एलेना: क्या हम बिल माँग लें?'
    note: '*Pedir* (माँगना, ऑर्डर करना) का सीधा कर्म *la cuenta* है: *pedimos la cuenta* (हम बिल माँगते हैं)।'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: मातेओ कुल कीमत पूछता है
    gloss: 'मातेओ: हाँ, अच्छा विचार है। कुल मिलाकर कितना होता है?'
    note: यहाँ पहले पाठ का सवाल *¿cuánto cuesta en total?* फिर से आया है।
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: एलेना कुल रकम बताती है
    gloss: 'एलेना: पैंतीस यूरो हैं। क्या हम बाँट लें?'
    note: 'रकम बताने के लिए *son* आता है: *son treinta y cinco euros* में बहुवचन क्रिया है क्योंकि रकम बहुवचन है।'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: मातेओ भुगतान करने पर अड़ा है
    gloss: 'मातेओ: नहीं, आज मुझे चुकाने दो। तुमने मेरी बहुत मदद की है।'
    note: '*Deja que pague yo* (मुझे चुकाने दो) में *que* के बाद संभावनार्थ रूप *pague* आता है; अभी इसे एक पक्के प्रस्ताव की तरह सीखिए। *Me has ayudado* पूर्ण वर्तमान है (तुमने मेरी मदद की है)।'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: एलेना भावुक हो जाती है
    gloss: 'एलेना: तुम कितने भले हो! बहुत धन्यवाद।'
    note: '*¡Qué amable eres!* (तुम कितने दयालु हो!) में *qué* + विशेषण से किसी उदार भाव पर आत्मीय प्रतिक्रिया दी जाती है; *muchas gracias* ज़्यादा ज़ोरदार *धन्यवाद* है।'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: मातेओ कार्ड से भुगतान के बारे में पूछता है
    gloss: 'मातेओ: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?'
    note: यहाँ दूसरे पाठ का सवाल *¿puedo pagar con tarjeta aquí?* फिर आया है, इस बार असली रेस्तराँ में।
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: अन्य पुरुष एकवचन रूप'
    gloss: मातेओ बिल चुकाता है।
    note: '*Paga*, *pagar* (भुगतान करना) का एकवचन अन्य पुरुष रूप है: *Mateo paga la cuenta*।'
