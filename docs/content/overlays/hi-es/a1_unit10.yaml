  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: तीन ढाँचे'
    gloss: मौसम बताने के तीन अलग व्याकरणिक ढाँचे।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*hace* वाले मौसम के वाक्यांश (hace calor, hace frío, hace sol) एक स्थिर मुहावरा हैं, जिनका शाब्दिक अर्थ है "यह गर्मी/ठंड/धूप करता है"। *Llueve* (बारिश होती है) अपना ही क्रिया-रूप है, और *está nublado* (बादल छाए हैं) में *estar* + विशेषण आता है -- एक ही बात, मौसम का वर्णन, के लिए तीन अलग रचनाएँ।'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: मौसम के बारे में पूछिए
    gloss: आज मौसम कैसा है?
    note: '*¿Qué tiempo hace hoy?* मौजूदा मौसम पूछने का सामान्य तरीका है, जिसमें *el tiempo* (मौसम) का प्रयोग होता है।'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: गर्म और धूप वाले मौसम का वर्णन कीजिए
    gloss: बहुत गर्मी है और धूप खिली है।
    note: इसमें *hace* वाले दो वाक्यांश *y* (और) से जुड़े हैं।
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: गर्म और हवादार मौसम का वर्णन कीजिए
    gloss: गर्मी है, पर हवा चल रही है।
    note: '*Pero* (पर) दो मौसमी बातों में अंतर दिखाता है -- गर्मी और हवा; हवा के लिए *hay* + संज्ञा का प्रयोग होता है, जैसे *hay mucho viento*।'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: मैड्रिड की सर्दी के बारे में बात कीजिए
    gloss: सर्दियों में मैड्रिड में बहुत ठंड होती है।
    note: '*En invierno* (सर्दियों में) में ऋतु का नाम आता है, जिसकी तुलना नीचे *en julio* से की गई है।'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: जुलाई की गर्मी के बारे में बात कीजिए
    gloss: जुलाई में बहुत ज़्यादा गर्मी होती है।
    note: '*Demasiado* (ज़रूरत से ज़्यादा) *calor* को सामान्य *mucho* (बहुत) से भी अधिक तीव्र बना देता है।'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: बताइए कि आपको पानी क्यों चाहिए
    gloss: हमें पानी चाहिए क्योंकि गर्मी है।
    note: '*Porque* (क्योंकि) ज़रूरत को मौसम के कारण से जोड़ता है; यह वर्कशॉप के लिए काम का व्यावहारिक वाक्य है।'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: मौसम का पूर्वानुमान पढ़ना
    gloss: आज, 22 जुलाई को, बहुत गर्मी है और धूप खिली है। आसमान में एक भी बादल नहीं है। थोड़ी हवा भी चल रही है। कुकिंग वर्कशॉप में जाने के लिए अच्छा दिन है, लेकिन पानी साथ ले जाना ज़रूरी है।
    note: 22 जुलाई का एक छोटा पूर्वानुमान, यानी कुकिंग क्लास वाले दिन का।
    glosses:
