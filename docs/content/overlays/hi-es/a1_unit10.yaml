      sol: धूप / सूरज
      hay: है (haber से)
      nube: बादल
      También: भी
      poco: थोड़ा
      viento: हवा
      buen: अच्छा
      día: दिन
      ir: जाना
      taller: वर्कशॉप
      cocina: खाना पकाना
      importante: ज़रूरी
      llevar: साथ ले जाना
      agua: पानी
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (थोड़ा-सा)
    gloss: un poco de थोड़ी मात्रा कैसे बताता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*Un poco de* (थोड़ा-सा) खाने की मात्राओं के साथ आता है, और यहाँ हवा की थोड़ी मात्रा बताता है -- वही रचना, नई संज्ञा के साथ।'
  es.a1.unit10.lesson06.teach.line01:
    title: गर्मी पर टिप्पणी कीजिए
    gloss: एलेना कहती है कि आज कितनी गर्मी है।
    note: '*¡Qué calor hace hoy!* (आज कितनी गर्मी है!) *hace calor* वाले मुहावरे का विस्मयादिबोधक प्रयोग है।'
  es.a1.unit10.lesson06.teach.line02:
    title: सहमत होइए और बात जोड़िए
    gloss: मातेओ सहमत होता है और कहता है कि एक भी बादल नहीं है।
    note: इसमें *hace mucho calor y hace sol* और *no hay ni una nube* एक साथ आए हैं।
  es.a1.unit10.lesson06.teach.line03:
    title: पानी ले चलने का सुझाव दीजिए
    gloss: एलेना कहती है कि रास्ते के लिए उन्हें पानी चाहिए।
    note: '*El camino* (रास्ता) वर्कशॉप तक उनके पैदल सफ़र को दर्शाता है।'
  es.a1.unit10.lesson06.teach.line04:
    title: सहमत होइए और दुकान बताइए
    gloss: मातेओ सहमत होता है और पास की एक दुकान का ज़िक्र करता है।
    note: '*Cerca de aquí* (यहाँ के पास) में स्थान बताने वाला वाक्यांश *cerca de* (के पास) आया है।'
  es.a1.unit10.lesson06.teach.line05:
    title: सर्दी और गर्मी की तुलना कीजिए
    gloss: एलेना मैड्रिड की ठंडी सर्दियों की तुलना जुलाई की आज की अत्यधिक गर्मी से करती है।
    note: इसमें दो मौसमी वाक्य *en invierno hace mucho frío* और *en julio hace demasiado calor* जुड़े हैं।
  es.a1.unit10.lesson06.teach.line06:
    title: अपनी पसंद बताइए
    gloss: मातेओ कहता है कि उसे गर्मी ज़्यादा पसंद है -- लंदन में लगभग हर दिन बारिश होती है।
    note: '*Prefiero* (मैं ज़्यादा पसंद करता/करती हूँ) उत्तम पुरुष का नया क्रिया-रूप है; *casi todos los días* (लगभग हर दिन) आवृत्ति बताने वाला काम का वाक्यांश है।'
  es.a1.unit10.lesson06.teach.line07:
    title: सहमत होइए और जल्दी कीजिए
    gloss: एलेना सहमत होती है और कहती है कि चलना चाहिए, वरना क्लास में देर हो जाएगी।
    note: '*Es verdad* का अर्थ है "यह सच है"; यहाँ *o* (या) का मतलब है "वरना", यानी नतीजे का संकेत।'
  es.a1.unit10.lesson06.teach.line08:
    title: सहमत होइए और चलिए
    gloss: मातेओ मानता है कि वह सही कह रही है और वे चल पड़ते हैं।
    note: '*Tienes razón* (तुम सही हो) सहमति जताने का आम वाक्यांश है।'
