course:
  title: स्पेनिश A1
  description: संख्याएँ 0 से 100 तक, उम्र, फ़ोन नंबर और रेसिपी की मात्राएँ, यूनिट 1 के कुकिंग वर्कशॉप में एलेना और माटेओ के साथ। उम्र बताने वाले tener के वाक्यों और मात्रा वाले वाक्यांशों में लिंग के मेल पर खास ध्यान दिया गया है।
