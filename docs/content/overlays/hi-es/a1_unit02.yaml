teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: शून्य
    gloss: शून्य
    note: '*Cero* का प्रयोग संख्या के रूप में भी होता है और अंकों की कड़ी ज़ोर से पढ़ते समय एक अंक के रूप में भी।'
  es.a1.unit02.lesson01.teach.uno:
    title: एक
    gloss: एक
    note: '*Uno* पुल्लिंग एकवचन संज्ञा से पहले *un* बन जाता है (*un huevo*, एक अंडा) और स्त्रीलिंग संज्ञा से पहले *una* (*una taza*, एक कप)। अकेले, जैसे गिनती में, यह *uno* ही रहता है।'
  es.a1.unit02.lesson01.teach.dos:
    title: दो
    gloss: दो
    note: '*Dos* संज्ञा के लिंग के अनुसार कभी नहीं बदलता।'
  es.a1.unit02.lesson01.teach.tres:
    title: तीन
    gloss: तीन
    note: '*Tres* भी *dos* की तरह नहीं बदलता।'
  es.a1.unit02.lesson01.teach.cuatro:
    title: चार
    gloss: चार
    note: '*Cuatro* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.cinco:
    title: पाँच
    gloss: पाँच
    note: '*Cinco* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.seis:
    title: छह
    gloss: छह
    note: '*Seis* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.siete:
    title: सात
    gloss: सात
    note: '*Siete* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.ocho:
    title: आठ
    gloss: आठ
    note: '*Ocho* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.nueve:
    title: नौ
    gloss: नौ
    note: '*Nueve* नहीं बदलता।'
  es.a1.unit02.lesson01.teach.diez:
    title: दस
    gloss: दस
    note: '*Diez* नहीं बदलता।'
  es.a1.unit02.lesson02.teach.once:
    title: ग्यारह
    gloss: ग्यारह
    note: '*Once* से *quince* (11-15) तक हर संख्या एक अलग शब्द है, इन्हें एक समूह के रूप में सीखें; सोलह से उन्नीस तक की संख्याएँ *diez* से बनती हैं (*dieciséis*, *diecisiete*...)।'
  es.a1.unit02.lesson02.teach.doce:
    title: बारह
    gloss: बारह
    note: '*Doce* एक अलग शब्द है; यह *dos* जैसा लगता है, पर इसकी वर्तनी अपनी है।'
  es.a1.unit02.lesson02.teach.trece:
    title: तेरह
    gloss: तेरह
    note: '*Trece* एक अलग शब्द है; यह *tres* जैसा लगता है, पर इसकी वर्तनी अपनी है।'
  es.a1.unit02.lesson02.teach.catorce:
    title: चौदह
    gloss: चौदह
    note: '*Catorce* एक अलग शब्द है; यह *cuatro* जैसा लगता है, पर इसकी वर्तनी अपनी है।'
  es.a1.unit02.lesson02.teach.quince:
    title: पंद्रह
    gloss: पंद्रह
    note: '*Quince* इन एक-शब्द वाली संख्याओं में आखिरी है; सोलह से पैटर्न बदल जाता है।'
  es.a1.unit02.lesson02.teach.veinte:
    title: बीस
    gloss: बीस
    note: '*Veinte* अपना अलग शब्द है। *veintiuno* (21) से उनतीस तक दहाई और इकाई जुड़कर एक ही शब्द में लिखी जाती हैं; यह पैटर्न इस कोर्स में पाठ 3 में *veintiocho* के साथ फिर आएगा।'
  es.a1.unit02.lesson02.teach.treinta:
    title: तीस
    gloss: तीस
    note: तीस के बाद दहाई और इकाई *y* (और) से जुड़ती हैं और तीन अलग शब्दों में लिखी जाती हैं; बीस वाली संख्याओं की तरह एक शब्द में नहीं जुड़तीं।
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: चौंतीस
    gloss: चौंतीस
    note: '*Treinta y cuatro* तीन अलग शब्दों में लिखा जाता है: दहाई, *y* और इकाई।'
  es.a1.unit02.lesson02.teach.cien:
    title: सौ
    gloss: सौ
    note: ठीक 100 को अकेले कहने के लिए *cien* का प्रयोग होता है; संख्या इससे आगे बढ़ने पर *ciento* आता है (*ciento uno*, 101), जो इस यूनिट में अभी नहीं सिखाया गया है।
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: अनौपचारिक रूप से उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: स्पेनिश में शाब्दिक रूप से पूछा जाता है “तुम्हारे पास कितने साल हैं?”, यानी यहाँ *tener* (रखना) का प्रयोग होता है, *ser* या *estar* का नहीं।
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: अपनी उम्र बताना
    gloss: मैं अट्ठाईस साल का/की हूँ।
    note: '*Tengo*, *tener* का yo रूप है। पूरे उत्तर में आमतौर पर *años* (साल) होता है; जब उम्र ही बातचीत का विषय हो, तो उसे छोड़ा जा सकता है, जैसे *Tengo treinta y uno*।'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: औपचारिक रूप से उम्र पूछना
    gloss: आपकी उम्र कितनी है?
    note: '*Tiene*, *tener* का *usted* रूप है, जो यूनिट 1 में बताए गए औपचारिक रूप से मेल खाता है।'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: मिश्रित संख्या में उम्र बताना
    gloss: मैं इकतीस साल का/की हूँ।
    note: यहाँ *treinta y uno* में *un* की जगह *uno* ही रहता है, क्योंकि इस उत्तर में इसके ठीक बाद कोई संज्ञा नहीं आती।
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: उम्र का सवाल लौटाना
    gloss: और आप/तुम, कितने साल के हो?
    note: विषय पहले से तय हो तो *años* दोहराए बिना सिर्फ़ *Tienes* कहना स्वाभाविक और आम संक्षिप्त रूप है।
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: फ़ोन नंबर पूछना
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: जब किसी से कई संभावनाओं में से कोई एक ख़ास चीज़, जैसे फ़ोन नंबर, पूछनी हो, तो *qué* की जगह *cuál* का प्रयोग स्वाभाविक है।
  es.a1.unit02.lesson04.teach.numero_elena:
    title: अंक-दर-अंक पढ़ा गया नंबर
    gloss: छह, एक, पाँच, शून्य, दो, नौ, सात, तीन
    note: फ़ोन नंबर एक-एक अंक करके पढ़ा जा सकता है, जैसे यहाँ। हिंदी की तरह स्पेनिश में भी कई लोग अंकों को जोड़ियों में बोलते हैं, इसलिए दोनों तरीक़े ध्यान से सुनें।
  es.a1.unit02.lesson04.teach.es_el:
    title: नंबर की शुरुआत करना
    gloss: यह है...
    note: यहाँ *El* (पुल्लिंग उपपद) इसलिए आता है कि *número* पुल्लिंग संज्ञा है।
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: दोहराने को कहना
    gloss: क्या आप/तुम दोहरा सकते हो, कृपया?
    note: '*Puedes*, *poder* (सकना) का *tú* रूप है। जब बोला गया नंबर बहुत तेज़ निकल जाए, तब यह काम आता है।'
  es.a1.unit02.lesson04.teach.claro:
    title: सहजता से हामी भरना
    gloss: ज़रूर; बिल्कुल
    note: किसी अनुरोध पर सहमति जताने का *Claro* एक आम और दोस्ताना तरीक़ा है।
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: ज़रूरी मात्रा बताना
    gloss: मुझे तीन अंडे चाहिए।
    note: '*Necesito*, *necesitar* (ज़रूरत होना) का yo रूप है। एक से ज़्यादा किसी भी संख्या के बाद *huevos* (अंडे) बहुवचन ही रहता है।'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: पूछना कि कितने चाहिए
    gloss: आपको कितने अंडे चाहिए?
    note: '*Cuántos* उसी संज्ञा के लिंग और वचन के अनुसार बदलता है जिसके बारे में पूछा जा रहा है। *huevos* पुल्लिंग बहुवचन है, इसलिए *cuántas* नहीं, *cuántos* आता है।'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: मापी हुई मात्रा बताना
    gloss: दो कप आटा
    note: '*De* मापने की इकाई (*tazas*, कप) को मापी जाने वाली चीज़ (*harina*, आटा) से जोड़ता है, जैसे हिंदी में "का/की" या सीधे "दो कप आटा" कहा जाता है।'
  es.a1.unit02.lesson05.teach.media_taza:
    title: आधी मात्रा बताना
    gloss: आधा कप चीनी
    note: '*Media* स्त्रीलिंग संज्ञा *taza* के अनुसार बदलता है; पुल्लिंग संज्ञाओं के साथ पुल्लिंग रूप *medio* आता है।'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: बताना कि पास में क्या है
    gloss: मेरे पास मेज़ पर चार अंडे हैं।
    note: '*Tengo* (मेरे पास है) बताता है कि क्या पहले से उपलब्ध है, जबकि *necesito* (मुझे चाहिए) बताता है कि अभी क्या कम है।'
  es.a1.unit02.lesson06.teach.line01:
    title: पूछना कि कितने अंडे चाहिए
    gloss: एलेना मातेओ से पूछती है कि रेसिपी के लिए उसे कितने अंडे चाहिए।
    note: यहाँ दोनों हमउम्र साथियों के बीच यूनिट 1 की तरह *tú* वाला अनौपचारिक रूप जारी है।
  es.a1.unit02.lesson06.teach.line02:
    title: सामग्री बताना
    gloss: मातेओ कहता है कि उसे तीन अंडे और दो कप आटा चाहिए।
    note: '*Necesito* बताता है कि रेसिपी के लिए अभी क्या चाहिए।'
  es.a1.unit02.lesson06.teach.line03:
    title: जो पास है वह बताना
    gloss: एलेना कहती है कि उसके पास मेज़ पर चार अंडे हैं और पूछती है कि क्या उसे चीनी भी चाहिए।
    note: '*Tengo* बताता है कि एलेना के पास पहले से क्या है, जो मातेओ की ज़रूरत से अलग है।'
  es.a1.unit02.lesson06.teach.line04:
    title: थोड़ी मात्रा की पुष्टि करना
    gloss: मातेओ कहता है हाँ, थोड़ी सी -- लगभग आधा कप।
    note: यहाँ *Como* का अर्थ "लगभग" या "क़रीब" है, न कि इसका ज़्यादा आम अर्थ "जैसा" या "की तरह"।
  es.a1.unit02.lesson06.teach.line05:
    title: फ़ोन नंबर माँगना
    gloss: एलेना कहती है बहुत अच्छा, फिर मातेओ का फ़ोन नंबर माँगती है ताकि अगली क्लास के लिए उसे मैसेज कर सके।
    note: '*Así te escribo* ("ताकि मैं तुम्हें लिख सकूँ") बताता है कि वह नंबर क्यों माँग रही है। संपर्क जानकारी माँगने से पहले कारण बताना बातचीत की स्वाभाविक आदत है।'
  es.a1.unit02.lesson06.teach.line06:
    title: फ़ोन नंबर बताना
    gloss: मातेओ अपना नंबर एक-एक अंक करके पढ़ता है।
    note: '*Es el* नंबर की शुरुआत करता है और पुल्लिंग संज्ञा *número* के अनुरूप है।'
  es.a1.unit02.lesson06.teach.line07:
    title: धन्यवाद देकर उम्र पूछना
    gloss: 'एलेना धन्यवाद कहती है, फिर एक और सवाल पूछती है: उसकी उम्र कितनी है।'
    note: '*Una pregunta más* ("एक और सवाल") उसी बातचीत में विषय बदलने का स्वाभाविक संकेत है।'
  es.a1.unit02.lesson06.teach.line08:
    title: उसकी उम्र बताना
    gloss: मातेओ कहता है कि वह अट्ठाईस साल का है और एलेना से भी यही सवाल पूछता है।
    note: '*Tengo veintiocho años* में बीस वाली संख्याओं का जुड़ा हुआ रूप आता है, जो इस पाठ के अपने पैटर्न के अनुरूप है।'
  es.a1.unit02.lesson06.teach.line09:
    title: उसकी उम्र बताना
    gloss: एलेना कहती है कि वह इकतीस साल की है।
    note: '*Tengo treinta y uno* में *años* छूट जाता है, क्योंकि संदर्भ से साफ़ है कि बात उम्र की है। यह स्वाभाविक संक्षिप्त रूप है, जैसे सवाल लौटाते समय भी *años* दोहराया नहीं जाता।'
