course:
  title: स्पेनिश A1
  description: सामान्य पैन-हिस्पैनिक अभिवादन, परिचय और पहली मुलाकात की व्यावहारिक बातचीत सीखें। मार्गदर्शन में स्पेनिश के औपचारिक-अनौपचारिक रूप, लिंग-वचन के मेल, कर्ता के लोप और क्रिया-रूपों पर विशेष ध्यान दिया गया है।
