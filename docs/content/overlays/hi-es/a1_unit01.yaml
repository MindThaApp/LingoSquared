teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: सम्मानसूचक "आप"
    gloss: आप (औपचारिक, सम्मानसूचक)
    note: हिंदी में "आप" और "तुम" का भेद होता है, और स्पेनिश भी अक्सर यही सामाजिक चुनाव दिखाती है। Usted किसी अपरिचित वयस्क के साथ या सम्मानजनक लहजे में काम आता है। इसका अर्थ "आप" है, फिर भी इसके साथ क्रिया का वही रूप आता है जो él या ella के साथ आता है।
  es.a1.unit01.lesson01.teach.tu:
    title: अनौपचारिक "तुम"
    gloss: तुम (अनौपचारिक, एकवचन)
    note: Tú का प्रयोग किसी एक दोस्त, हमउम्र, बच्चे या ऐसे व्यक्ति के साथ होता है जिससे संबंध अनौपचारिक हो। एक्सेंट वाला tú सर्वनाम है, जबकि बिना एक्सेंट का tu स्वामित्व सूचक है, जिसका अर्थ "तुम्हारा" है।
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: औपचारिक हालचाल पूछना
    gloss: आप कैसे हैं?
    note: Está, estar का usted वाला रूप है। किसी की वर्तमान स्थिति बताने के लिए स्पेनिश यहाँ estar का प्रयोग करती है। Cómo पर एक्सेंट होता है क्योंकि यह प्रश्नवाचक शब्द है।
  es.a1.unit01.lesson01.teach.como_estas:
    title: अनौपचारिक हालचाल पूछना
    gloss: तुम कैसे हो?
    note: Estás, estar का tú वाला रूप है। हिंदी में जैसे "आप कैसे हैं" और "तुम कैसे हो" में क्रिया बदलती है, वैसे ही स्पेनिश में संबोधित व्यक्ति के अनुसार está बदलकर estás हो जाता है।
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: संक्षिप्त उत्तर
    gloss: ठीक हूँ, धन्यवाद।
    note: स्पेनिश में बिना कर्ता या क्रिया दोहराए केवल bien कहकर भी उत्तर दिया जा सकता है।
  es.a1.unit01.lesson01.teach.muy_bien:
    title: सकारात्मक उत्तर
    gloss: बहुत अच्छा हूँ, धन्यवाद।
    note: Muy, bien को और ज़ोरदार बनाता है और खुद नहीं बदलता।
  es.a1.unit01.lesson01.teach.and_usted:
    title: औपचारिक प्रश्न लौटाना
    gloss: और आप?
    note: जब प्रश्न सम्मानपूर्वक पूछा गया हो, तो उसे लौटाते समय भी usted ही रखें।
  es.a1.unit01.lesson01.teach.and_tu:
    title: अनौपचारिक प्रश्न लौटाना
    gloss: और तुम?
    note: बातचीत अनौपचारिक हो तो tú का प्रयोग करें। लिखित एक्सेंट ज़रूरी है, क्योंकि बिना एक्सेंट का tu "तुम्हारा" होता है।
  es.a1.unit01.lesson02.teach.hola:
    title: हर मौके का अभिवादन
    gloss: नमस्ते; हैलो
    note: Hola दिन के किसी भी समय और औपचारिक व अनौपचारिक दोनों मुलाकातों में चलता है।
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: सुबह का अभिवादन
    gloss: सुप्रभात
    note: हिंदी की तरह स्पेनिश संज्ञाओं का भी व्याकरणिक लिंग होता है। Días पुल्लिंग बहुवचन है, इसलिए विशेषण buenos रूप में आता है।
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: दोपहर बाद का अभिवादन
    gloss: शुभ अपराह्न
    note: Tardes स्त्रीलिंग बहुवचन है, इसलिए buenas उसके साथ मेल खाता है। buenos से buenas होना व्याकरणिक मेल है, शिष्टता में कोई बदलाव नहीं।
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: शाम या रात का अभिवादन
    gloss: शुभ संध्या; शुभ रात्रि
    note: Noches स्त्रीलिंग बहुवचन है, इसलिए इसके साथ buenas आता है। इस वाक्यांश से रात में किसी का अभिवादन भी किया जा सकता है और सोने से पहले विदा भी ली जा सकती है।
  es.a1.unit01.lesson02.teach.adios:
    title: सीधी विदाई
    gloss: अलविदा
    note: Adiós तटस्थ है, पर "फिर मिलेंगे" जैसे भाव वाले वाक्यांश की तुलना में अधिक अंतिम लग सकता है।
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: फिर मिलेंगे
    gloss: बाद में मिलते हैं
    note: Hasta luego एक प्रचलित विदाई है; इसे शब्द-दर-शब्द अर्थ में पढ़ना ज़रूरी नहीं।
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: दोस्ताना विदाई
    gloss: फिर मिलते हैं
    note: शाब्दिक रूप से nos vemos "हम एक-दूसरे को देखते हैं" के करीब है।
  es.a1.unit01.lesson02.teach.good_day:
    title: शिष्ट विदाई की शुभकामना
    gloss: आपका दिन शुभ हो।
    note: इस शिष्ट शुभकामना में tenga, usted वाला रूप है। Buen, día से पहले आने वाला bueno का संक्षिप्त पुल्लिंग एकवचन रूप है।
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: औपचारिक रूप से नाम पूछना
    gloss: आपका नाम क्या है?
    note: स्पेनिश में इसे लगभग "आप अपने को क्या कहते हैं" की तरह कहा जाता है। Se औपचारिक usted वाले रूप llama के साथ आता है। हिंदी में "आपका नाम क्या है" के लिए यह बनावट अलग है।
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: अपना नाम बताना
    gloss: मेरा नाम लूसिया है।
    note: Me llamo का शाब्दिक अर्थ "मैं अपने को ... कहता/कहती हूँ" है। क्रिया का अंत ही बोलने वाले को बता देता है, इसलिए स्पेनिश में यहाँ आमतौर पर yo छोड़ दिया जाता है।
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: अनौपचारिक रूप से नाम पूछना
    gloss: तुम्हारा नाम क्या है?
    note: Te अनौपचारिक tú के साथ आता है, और llamas में tú वाला अंत -as है। औपचारिक se llama और अनौपचारिक te llamas की तुलना करें।
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: ser से अपना परिचय देना
    gloss: मैं दिएगो हूँ।
    note: Soy, ser का उत्तम पुरुष एकवचन रूप है। पहचान बताने के लिए स्पेनिश ser का प्रयोग करती है। हिंदी में पहचान और कई अस्थायी स्थितियों, दोनों के लिए "हूँ" चलता है, जबकि स्पेनिश में इन प्रयोगों को ser और estar में बाँटा गया है।
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: मिलकर खुशी जताना
    gloss: आपसे मिलकर खुशी हुई।
    note: Mucho gusto एक स्थिर, व्यापक रूप से समझी जाने वाली अभिव्यक्ति है। encantado या encantada जैसे विशेषणों के विपरीत, यह बोलने वाले के लिंग के अनुसार नहीं बदलती।
  es.a1.unit01.lesson03.teach.igualmente:
    title: वही भाव लौटाना
    gloss: मुझे भी।
    note: Igualmente, Mucho gusto का संक्षिप्त उत्तर है।
  es.a1.unit01.lesson03.teach.este_carlos:
    title: किसी पुरुष से परिचय कराना
    gloss: ये कार्लोस हैं।
    note: हिंदी में "यह" का रूप लिंग के अनुसार नहीं बदलता, पर स्पेनिश में बदलता है। जिस व्यक्ति या संज्ञा की ओर इशारा हो, वह व्याकरणिक रूप से पुल्लिंग हो तो este आता है।
  es.a1.unit01.lesson03.teach.esta_ana:
    title: किसी महिला से परिचय कराना
    gloss: ये आना हैं।
    note: स्त्रीलिंग के लिए esta का प्रयोग करें। यहाँ esta पर एक्सेंट नहीं है; एक्सेंट वाला está, estar का रूप है और "है" या "स्थित है" के अर्थ में आता है।
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: औपचारिक रूप से मूल स्थान पूछना
    gloss: आप कहाँ से हैं?
    note: Es, ser का usted वाला रूप है। मूल स्थान बताने के लिए स्पेनिश में estar नहीं, ser का प्रयोग होता है। सीधे प्रश्न में dónde पर एक्सेंट होता है।
  es.a1.unit01.lesson04.teach.from_mexico:
    title: अपना मूल स्थान बताना
    gloss: मैं मेक्सिको से हूँ।
    note: Soy, ser का yo वाला रूप है। कर्ता yo की ज़रूरत नहीं होती, क्योंकि soy से ही बोलने वाला पहचाना जाता है।
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: अनौपचारिक रूप से मूल स्थान पूछना
    gloss: तुम कहाँ से हो?
    note: Eres, ser का tú वाला रूप है। औपचारिक es usted और अनौपचारिक eres की तुलना करें। हिंदी में भी "आप ... हैं" और "तुम ... हो" अलग-अलग होते हैं।
  es.a1.unit01.lesson04.teach.from_colombia:
    title: मूल स्थान का एक और कथन
    gloss: मैं कोलंबिया से हूँ।
    note: मूल स्थान बताने के लिए soy de के बाद स्थान का नाम लगाएँ।
  es.a1.unit01.lesson04.teach.live_london:
    title: बताना कि आप कहाँ रहते हैं
    gloss: मैं लंदन में रहता/रहती हूँ।
    note: Vivo, vivir का yo वाला रूप है। स्पेनिश में yo की ज़रूरत नहीं पड़ती, क्योंकि -o अंत से बोलने वाला पहचाना जाता है।
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: औपचारिक रूप से स्पेनिश के बारे में पूछना
    gloss: क्या आप स्पेनिश बोलते हैं?
    note: स्पेनिश में यह हाँ-या-नहीं वाला प्रश्न "क्या" जैसे किसी अलग शब्द के बिना बनता है। Habla, usted वाला रूप है; प्रश्न स्वर-शैली और प्रश्नचिह्न से पहचाना जाता है।
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: सीमित जानकारी
    gloss: हाँ, थोड़ी-सी।
    note: एक्सेंट वाला sí का अर्थ "हाँ" है। बिना एक्सेंट का si "अगर" होता है, हालाँकि A1 स्तर पर टाइप करते समय यहाँ बिना एक्सेंट की वर्तनी भी स्वीकार की जाती है।
  es.a1.unit01.lesson04.teach.still_learning:
    title: चल रही स्थिति बताना
    gloss: मैं अभी भी सीख रहा/रही हूँ।
    note: Estoy, estar का yo वाला रूप है। यहाँ estar चल रही क्रिया को जोड़ता है, जबकि Soy de Colombia में soy मूल स्थान या पहचान बताता है। हिंदी में दोनों जगह "हूँ" आता है, पर स्पेनिश इन दोनों के लिए अलग क्रियाएँ इस्तेमाल करती है।
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: औपचारिक रूप से पहली यात्रा के बारे में पूछना
    gloss: क्या आप यहाँ पहली बार आए हैं?
    note: Su का अर्थ "आपका" है, जब usted कहकर संबोधित किया जा रहा हो। हिंदी में "आपका" और "तुम्हारा" संबंध की औपचारिकता बताते हैं; वैसे ही स्पेनिश में su और tu औपचारिक या अनौपचारिक चुनाव को बनाए रखते हैं।
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: अनौपचारिक रूप से पहली यात्रा के बारे में पूछना
    gloss: क्या तुम यहाँ पहली बार आए हो?
    note: बिना एक्सेंट का tu अनौपचारिक स्वामित्व सूचक "तुम्हारा" है। इसकी तुलना सर्वनाम tú से करें, जिस पर एक्सेंट होता है।
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: पुष्टि करना कि यह पहली यात्रा है
    gloss: हाँ, यह मेरी पहली बार है।
    note: Primera स्त्रीलिंग है क्योंकि वह vez के साथ मेल खाता है। हिंदी में भी विशेषण संज्ञा के लिंग के अनुसार बदलते हैं, जैसे "पहला" और "पहली"।
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: अपना गंतव्य बताना
    gloss: मैं कुकिंग वर्कशॉप के लिए आया/आई हूँ।
    note: Vengo, venir का yo वाला रूप है, जिसका अर्थ "मैं आता/आती हूँ" या "मैं आ रहा/रही हूँ" है। Al, a और el का अनिवार्य संकुचित रूप है।
  es.a1.unit01.lesson05.teach.me_too:
    title: वही स्थिति साझा करना
    gloss: मैं भी।
    note: Yo también तब काम आता है जब दूसरे व्यक्ति की बात आप पर भी लागू होती हो।
  es.a1.unit01.lesson05.teach.like_cooking:
    title: किसी रुचि के बारे में पूछना
    gloss: क्या आपको खाना बनाना पसंद है?
    note: Gustar में पसंद करने वाले व्यक्ति को te दर्शाता है, और cocinar वह चीज़ है जो पसंद आती है। क्रिया gusta ही रहती है, क्योंकि यहाँ गतिविधि को एकवचन माना जाता है।
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: गहरी रुचि जताना
    gloss: हाँ, बहुत।
    note: Mucho मात्रा वाले प्रश्न का उत्तर देता है और यहाँ अपना रूप नहीं बदलता।
  es.a1.unit01.lesson05.teach.thats_good:
    title: सकारात्मक प्रतिक्रिया
    gloss: यह तो बहुत अच्छा है।
    note: इस विस्मयादिबोधक वाक्य में Qué पर एक्सेंट लगता है। यह प्रश्न नहीं पूछता, बल्कि सकारात्मक प्रतिक्रिया शुरू करता है।
  es.a1.unit01.lesson06.teach.line01:
    title: मुलाक़ात की शुरुआत
    gloss: एलेना मातेओ को नमस्ते कहती है और पूछती है कि क्या वह यहाँ पहली बार आया है।
    note: दोनों बोलने वाले अनौपचारिक tú रूपों का प्रयोग करते हैं, क्योंकि वे एक ही गतिविधि में बराबरी के साथी के रूप में मिल रहे हैं।
  es.a1.unit01.lesson06.teach.line02:
    title: मुलाक़ात की शुरुआत, उत्तर
    gloss: मातेओ कहता है कि हाँ, वह पहली बार आया है, और बताता है कि वह खाना पकाने की कार्यशाला के लिए आया है।
    note: Vengo al taller वहाँ होने का कारण बताता है; यहाँ वर्तमान काल चल रही स्थिति के लिए प्रयुक्त है।
  es.a1.unit01.lesson06.teach.line03:
    title: नामों का आदान-प्रदान
    gloss: एलेना कहती है कि वह भी पहली बार आई है, अपना नाम बताती है और मातेओ का नाम पूछती है।
    note: Me llamo नाम बताने का स्वाभाविक तरीका है; स्पेनिश में आमतौर पर yo छोड़ दिया जाता है, क्योंकि क्रिया का रूप ही बता देता है कि बोलने वाला कौन है।
  es.a1.unit01.lesson06.teach.line04:
    title: नामों का आदान-प्रदान, उत्तर
    gloss: मातेओ अपना नाम बताता है और कहता है कि उससे मिलकर ख़ुशी हुई।
    note: Soy नाम बताने का एक और स्वाभाविक तरीका है; इसमें स्ववाचक क्रिया llamarse की जगह ser का प्रयोग होता है।
  es.a1.unit01.lesson06.teach.line05:
    title: मूल स्थान के बारे में पूछना
    gloss: एलेना भी शिष्टाचार लौटाती है (मुझे भी) और पूछती है कि मातेओ कहाँ का रहने वाला है।
    note: De dónde eres अनौपचारिक tú रूप में मूल स्थान के बारे में पूछता है।
  es.a1.unit01.lesson06.teach.line06:
    title: मूल स्थान के बारे में पूछना, उत्तर
    gloss: मातेओ कोलंबिया का है लेकिन लंदन में रहता है, फिर वही सवाल एलेना से पूछता है।
    note: Soy de मूल स्थान बताता है, जबकि vivo en वर्तमान निवास बताता है। Pero इन दोनों तथ्यों के अंतर को जोड़ता है।
  es.a1.unit01.lesson06.teach.line07:
    title: किसी रुचि पर बात करना
    gloss: एलेना कहती है कि वह स्पेन की है और पूछती है कि क्या मातेओ को खाना बनाना पसंद है।
    note: Soy मूल स्थान बताता है, वही पैटर्न जो मातेओ ने अभी प्रयोग किया।
  es.a1.unit01.lesson06.teach.line08:
    title: किसी रुचि पर बात करना, उत्तर
    gloss: मातेओ कहता है कि उसे खाना बनाना बहुत पसंद है, पर वह अभी सीख रहा है।
    note: Estoy aprendiendo अभी चल रही गतिविधि को बताता है, जैसे हिंदी में "सीख रहा हूँ" चालू क्रिया दिखाता है।
  es.a1.unit01.lesson06.teach.line09:
    title: बातचीत समाप्त करना
    gloss: एलेना कहती है कि वह भी सीख रही है और बोलती है कि वे अंदर मिलेंगे।
    note: Nos vemos बाद में होने वाली मुलाक़ात का संकेत देता है, और dentro बताता है कि कहाँ।
  es.a1.unit01.lesson06.teach.line10:
    title: बातचीत समाप्त करना, उत्तर
    gloss: मातेओ सहमत होता है और पक्का करता है कि वे मिलेंगे।
    note: Sí पहले एलेना के सुझाव की पुष्टि करता है, फिर nos vemos दोहराया जाता है।
