teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: सैंडविच, सलाद
    gloss: सैंडविच, सलाद
    note: दोनों संज्ञाएँ दूसरी भाषा से ली गई या ढाली गई हैं -- *sándwich* सीधे उधार लिया गया शब्द है, जिसमें बलाघात वाले अक्षर को दिखाने के लिए accent लगाया जाता है।
    example_gloss:
    - मुझे एक सैंडविच चाहिए।
    - सलाद में टमाटर है।
  es.a1.unit06.lesson01.teach.sopa:
    title: सूप
    gloss: सूप
    note: '*Sopa* स्त्रीलिंग है, जैसे -a पर खत्म होने वाली अधिकतर स्पेनिश संज्ञाएँ।'
    example_gloss: सूप बहुत अच्छा है।
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: पानी, कॉफ़ी
    gloss: पानी, कॉफ़ी
    note: '*Agua* व्याकरण में स्त्रीलिंग है, फिर भी एकवचन में इसके साथ पुल्लिंग उपपद *el* (*la* नहीं) आता है, क्योंकि यह बलाघात वाली *a* ध्वनि से शुरू होता है -- यह स्पेनिश की असली अनियमितता है, टाइपिंग की गलती नहीं।'
    example_gloss:
    - मुझे पानी चाहिए, कृपया।
    - मेरे लिए एक कॉफ़ी।
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: मुझे एक सैंडविच चाहिए
    gloss: मुझे एक सैंडविच चाहिए।
    note: '*Quiero* (मुझे चाहिए) क्रिया *querer* का उत्तम पुरुष रूप है, जो इस यूनिट की नई क्रिया है।'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: मेरे लिए एक कॉफ़ी
    gloss: मेरे लिए एक कॉफ़ी।
    note: '*Para mí* (मेरे लिए) ऑर्डर देने का दूसरा आम वाक्यांश है, जिसमें क्रिया दोहराए बिना चीज़ का नाम लिया जाता है -- आगे का व्याकरण नोट देखिए।'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: पूछिए कि कोई क्या खाना चाहता है
    gloss: तुम क्या खाना चाहते हो?
    note: '*Quieres*, *querer* का *tú* रूप है, जो दोस्तों के बीच इस्तेमाल होने वाला अनौपचारिक रूप है।'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero बनाम Para mí
    gloss: ऑर्डर देने के दो समान रूप से स्वाभाविक तरीके।
    note: ऑर्डर देते समय *Quiero un café* और *Para mí, un café* दोनों ठीक हैं।
    target_text: '*Quiero* ("मुझे चाहिए") और *Para mí* ("मेरे लिए", जो चीज़ का नाम लेने से पहले कहा जाता है) दोनों अनौपचारिक माहौल में ऑर्डर देने के स्वाभाविक और समान रूप से विनम्र तरीके हैं -- कोई भी दूसरे से अधिक सही नहीं है।'
  es.a1.unit06.lesson03.teach.el_menu:
    title: मेन्यू
    gloss: मेन्यू
    note: '*Menú* में लिखित accent होता है क्योंकि बलाघात अंतिम अक्षर पर पड़ता है।'
    example_gloss: क्या हम मेन्यू देख सकते हैं?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: मेन्यू देखने को कहिए
    gloss: क्या हम मेन्यू देख सकते हैं?
    note: '*Podemos* (हम सकते हैं) क्रिया *poder* का उत्तम पुरुष बहुवचन रूप है, जो इस यूनिट की नई क्रिया है।'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: ये लीजिए
    gloss: ये लीजिए।
    note: '*Aquí tiene* वह सामान्य वाक्यांश है जो वेटर ग्राहक को कुछ देते समय कहता है। इसमें अन्यथा अनौपचारिक बातचीत में भी आदरसूचक *usted* क्रिया रूप आता है -- यह एक स्थिर शिष्टाचार वाक्यांश है, शैली का बदलाव नहीं।'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: भोजन का आनंद लीजिए
    gloss: भोजन का आनंद लीजिए
    note: '*Buen provecho* किसी के खाना शुरू करने से पहले कहा जाने वाला आम वाक्यांश है, जो हिंदी के "भोजन शुरू कीजिए, आनंद लीजिए" जैसे अवसर पर बोला जाता है।'
    example_gloss: लीजिए। भोजन का आनंद लीजिए।
  es.a1.unit06.lesson04.teach.el_postre:
    title: मिठाई
    gloss: मिठाई
    note: '*Postre* पुल्लिंग है।'
    example_gloss: मिठाई में मुझे केक चाहिए।
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: मिठाई ऑर्डर करना
    gloss: मिठाई में मुझे केक चाहिए।
    note: '*De postre* (मिठाई में) से बताया जाता है कि भोजन के अंत में आप क्या मँगवाना चाहते हैं। यह वैसा ही ढाँचा है जैसे *para mí* मुख्य ऑर्डर बताने के लिए आता है।'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: बिल माँगना
    gloss: बिल दीजिए, कृपया।
    note: '*La cuenta* (बिल) भोजन के अंत में भुगतान करने के लिए कहने का सामान्य तरीका है।'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: मेन्यू पढ़ना
    gloss: 'मेन्यू: सैंडविच, पाँच। सलाद, आठ। सूप, तीन। कॉफ़ी या पानी, शामिल। मिठाई: केक।'
    note: छपे हुए मेन्यू का वास्तविक रूप, जिसमें इस इकाई के खाने के शब्द कीमतों के साथ आते हैं।
    glosses:
      Menú: मेन्यू
      sándwich: सैंडविच
      Ensalada: सलाद
      Sopa: सूप
      Café: कॉफ़ी
      agua: पानी
      incluido: शामिल
      Postre: मिठाई
      pastel: केक
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (शामिल)
    gloss: जब किसी पेय पर "शामिल" लिखा हो तो उसका क्या मतलब होता है।
    note: '*Incluido* = शामिल, कोई अतिरिक्त शुल्क नहीं।'
    target_text: '*Incluido* (शामिल) बताता है कि भोजन के साथ पेय मुफ़्त मिलता है, अलग से पैसे नहीं लगते।'
  es.a1.unit06.lesson06.teach.line01:
    title: अभिवादन और ऑर्डर पूछना
    gloss: वेटर एलेना और माटेओ का अभिवादन करता है और पूछता है कि वे क्या खाना चाहते हैं।
    note: '*Buenas tardes* (नमस्कार, दोपहर के बाद का अभिवादन) दोपहर से आगे इस्तेमाल होता है, इसलिए यह दोपहर के भोजन के समय ठीक बैठता है।'
  es.a1.unit06.lesson06.teach.line02:
    title: एलेना ऑर्डर देती है
    gloss: एलेना कृपया एक सलाद और पानी ऑर्डर करती है।
    note: '*Una ensalada y agua* = एक सलाद और पानी।'
  es.a1.unit06.lesson06.teach.line03:
    title: माटेओ ऑर्डर देता है
    gloss: माटेओ अपने लिए एक सैंडविच और एक कॉफ़ी ऑर्डर करता है।
    note: यहाँ *Quiero* दोहराने के बजाय *Para mí* का प्रयोग हुआ है।
  es.a1.unit06.lesson06.teach.line04:
    title: मिठाई के बारे में पूछना
    gloss: वेटर सहमति जताता है और पूछता है कि क्या वे कुछ मिठाई लेंगे।
    note: '*¿Algo de postre?* (मिठाई में कुछ?) मिठाई के लिए पूछने का स्वाभाविक और छोटा तरीका है।'
  es.a1.unit06.lesson06.teach.line05:
    title: साझा करने के लिए मिठाई मँगवाना
    gloss: एलेना हाँ कहती है, दोनों के लिए एक केक।
    note: '*Para los dos* (हम दोनों के लिए) से दोनों के बीच एक मिठाई साझा की जाती है, जो असल ज़िंदगी में एक स्वाभाविक चुनाव है।'
  es.a1.unit06.lesson06.teach.line06:
    title: सहमत होना और बिल माँगना
    gloss: माटेओ सहमत होता है और बिल माँगता है।
    note: '*La cuenta, por favor* = बिल दीजिए, कृपया।'
  es.a1.unit06.lesson06.teach.line07:
    title: बिल थमाना
    gloss: वेटर उन्हें बिल देता है।
    note: '*Aquí tiene* कुछ थमाते समय कहा जाता है।'
  es.a1.unit06.lesson06.teach.line08:
    title: आत्मीयता से विदा लेना
    gloss: एलेना वेटर को धन्यवाद देती है और कहती है कि खाना कितना अच्छा था।
    note: '*¡Qué buena comida!* में वही *¡Qué ...!* विस्मयादिबोधक ढाँचा है जो *¡Qué bien!* और *¡Qué bonito!* में है।'
