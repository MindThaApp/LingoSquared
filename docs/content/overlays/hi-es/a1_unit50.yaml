    accepted_answers:
    - value: कॉफ़ी पीना
      status: correct
    feedback: वक्ता tomar un café का प्रस्ताव रखता है।
  es.a1.unit50.lesson01.exercise03.choose_feel_like:
    instruction: वह स्पेनिश प्रश्न चुनिए जिसका अर्थ है 'क्या आपका फ़िल्म देखने जाने का मन है?'
    correct_option: ¿Tienes ganas de ir al cine?
    distractors:
    - ¿Tomamos un café?
    - ¿A qué hora empieza la película?
    - ¿Vas al café de idiomas?
    accepted_answers:
    - value: ¿Tienes ganas de ir al cine?
      status: correct
    feedback: '*¿Tienes ganas de ...?* पूछता है कि किसी का वह काम करने का मन है या नहीं।'
  es.a1.unit50.lesson01.exercise04.match_proposals:
    instruction: हर स्पेनिश प्रस्ताव-पैटर्न को उसके हिंदी अर्थ से मिलाइए।
