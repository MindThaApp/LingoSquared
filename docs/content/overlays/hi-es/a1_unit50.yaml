    pairs:
    - left: ¿Tomamos ...?
      right: क्या हम ... लें/करें?
    - left: ¿Tienes ganas de ...?
      right: क्या तुम्हारा ... का मन है?
  es.a1.unit50.lesson01.exercise05.order_coffee:
    instruction: शब्दों को सही क्रम में लगाइए ताकि कॉफ़ी पीने का प्रस्ताव बने।
    correct_option: Tomamos un café
