teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: साथ में
    gloss: साथ में
    note: '*Juntos* स्पष्ट करता है कि लोग गतिविधि साथ मिलकर करते हैं; यह लोगों के अनुसार बदलता है (सभी महिलाएँ हों तो *juntas*)।'
    example_gloss: क्या हम साथ में कॉफ़ी पिएँ?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: कॉफ़ी पीना
    gloss: कॉफ़ी पीना
    note: स्पैनिश में *tomar un café* (शाब्दिक अर्थ "एक कॉफ़ी लेना") कहा जाता है, "कॉफ़ी पीना" जैसी क्रिया नहीं।
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: फ़िल्म देखने जाना
    gloss: फ़िल्म देखने जाना
    note: '*Ir al cine* ("सिनेमा जाना") फ़िल्म देखने जाने को कहने का सामान्य तरीका है; *al* यानी *a* + *el*।'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: क्या हम कॉफ़ी पिएँ?
    gloss: क्या हम कॉफ़ी पिएँ?
    note: '*¿Tomamos ...?* में साथ मिलकर कुछ करने का प्रस्ताव रखने के लिए *nosotros* का वर्तमान काल रूप प्रयुक्त होता है।'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: ¿Tomamos ...? का प्रयोग
    gloss: ¿Tomamos + कुछ? साथ मिलकर कुछ करने का प्रस्ताव रखने का सामान्य तरीका है।
    note: '*nosotros* रूप (*tomamos*) हिंदी के "क्या हम ... लें?" की तरह काम करता है: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: क्या तुम्हारा फ़िल्म देखने जाने का मन है?
    gloss: क्या तुम्हारा फ़िल्म देखने जाने का मन है?
    note: '*¿Tienes ganas de ...?* अनौपचारिक रूप से पूछता है कि किसी का कुछ करने का मन है या नहीं; *de* के बाद क्रिया का मूल रूप (क्रिया का मूल रूप) आता है।'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: हाँ, बढ़िया!
    gloss: हाँ, बढ़िया!
    note: '*¡Sí, qué bien!* उत्साह के साथ छोटे रूप में हामी भरने का तरीका है।'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: अच्छा विचार
    gloss: अच्छा विचार है!
    note: '*¡Buena idea!* प्रस्ताव की तारीफ़ करके उसे स्वीकार करता है।'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: यह एक अच्छी योजना है
    gloss: यह एक अच्छी योजना है।
    note: यह सकारात्मक उत्तर का थोड़ा विस्तृत रूप है।
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: कारण बताकर मना करना
    gloss: माफ़ कीजिए, मैं नहीं आ सकता, क्योंकि मैं काम कर रहा हूँ।
    note: '*Lo siento* इनकार को नरम बनाता है, और *porque* छोटा-सा कारण जोड़ता है।'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: मेरे पास समय नहीं है
    gloss: मेरे पास समय नहीं है।
    note: '*No tengo tiempo* मना करने का सीधा पर सामान्य कारण है; *no* क्रिया से पहले आता है।'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: विनम्रता से मना करना
    gloss: Lo siento + no puedo + छोटा-सा कारण = विनम्र इनकार।
    note: बातचीत में कारण बताना ज़रूरी नहीं है, पर इससे यह नमूना उपयोगी और विनम्र बन जाता है।
  es.a1.unit50.lesson03.teach.quedar:
    title: मिलने का समय तय करना
    gloss: मिलने का समय तय करना
    note: '*Quedar* का अर्थ है मिलने की योजना बनाना: *¿Quedamos el viernes?* कई लैटिन अमेरिकी लोग इसकी जगह *¿Nos vemos el viernes?* कहते हैं।'
    example_gloss: क्या हम शुक्रवार को 2:30 बजे मिलें?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: शुक्रवार को ढाई बजे मिलना
    gloss: क्या हम शुक्रवार को 2:30 बजे मिलें?
    note: इसमें सप्ताह का दिन *el viernes* और *a las* के साथ समय जुड़ा है।
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media का अर्थ है साढ़े
    gloss: las dos y media = 2:30; a las dos y media मिलने का समय बताता है।
    note: 'स्पैनिश बीत चुके घंटे से गिनती करती है: *las dos y media* यानी 2:30, शाब्दिक अर्थ "दो और आधा"। हिंदी में "ढाई" एक अलग शब्द है, जबकि स्पैनिश में यह इसी तरह बनता है।'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: तारीख़ और समय
    gloss: शुक्रवार 17 अप्रैल को 3:15 बजे
    note: 'स्पैनिश में सप्ताह के दिन और महीनों के नाम छोटे अक्षरों में लिखे जाते हैं, और तारीख़ में *de* आता है: *el viernes 17 de abril*।'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: समय की पुष्टि करना
    gloss: हाँ, शुक्रवार को 2:30 बजे ठीक रहेगा।
    note: '*Me viene bien* ("मुझे सूट करता है") पुष्टि करता है कि प्रस्तावित समय ठीक है।'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: संदेश, निमंत्रण, भाषा कैफ़े
    gloss: संदेश, निमंत्रण, भाषा कैफ़े
    note: '*Un mensaje* छोटा लिखित या डिजिटल संदेश है, *una invitación* किसी को गतिविधि में शामिल होने के लिए बुलाती है, और *el café de idiomas* समूह के मिलने की जगह है।'
    example_gloss:
    - मेरे पास एलेना का एक संदेश है।
    - यह भाषा कैफ़े का निमंत्रण है।
    - हम भाषा कैफ़े में कॉफ़ी पी रहे हैं।
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: एलेना का निमंत्रण
    gloss: नमस्ते माटेओ, क्या शनिवार 18 अप्रैल को 2:30 बजे भाषा कैफ़े में कॉफ़ी पीने का मन है? शुभकामनाओं सहित, एलेना।
    note: 'चार बातों पर ध्यान देकर पढ़िए: गतिविधि, तारीख़, समय और जगह।'
    glosses:
      Hola: नमस्ते
      ganas: इच्छा (tener ganas de = मन होना)
      sábado: शनिवार
      abril: अप्रैल
      media: साढ़े (y media = आधा घंटा बीता)
      dos: दो
      café: कॉफ़ी
      tomar: पीना / लेना
      idiomas: भाषा कैफ़े
      saludo: शुभकामनाएँ
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: प्रस्ताव वाला संदेश
    gloss: नमस्ते Mateo, क्या हम शुक्रवार को 2:30 बजे कॉफ़ी पिएँ? सादर, Elena।
    note: संदेश में अभिवादन, गतिविधि, दिन, समय और समापन शामिल हैं।
    glosses:
      Hola: नमस्ते
      vamos: क्या हम
      viernes: शुक्रवार
      media: साढ़े
      dos: दो
      café: कॉफ़ी
      tomar: पीना / लेना
      saludo: सादर
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: पुष्टि का संदेश
    gloss: नमस्ते Elena, हाँ, बहुत बढ़िया! शुक्रवार को 2:30 बजे मेरे लिए ठीक है। शुक्रवार को मिलते हैं! Mateo।
    note: जवाब में प्रस्ताव स्वीकार किया गया है और पुष्टि के लिए समय-सारणी दोहराई गई है।
    glosses:
      Hola: नमस्ते
      bien: बढ़िया / वाह
      viernes: शुक्रवार
      media: साढ़े
      dos: दो
      viene: ठीक / सुविधाजनक
      Hasta: तक / फिर मिलते हैं
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: संदेश में क्या होता है
    gloss: एक छोटे संदेश में गतिविधि, दिन या तारीख़ और समय बताया जाता है।
    note: अभिवादन और समापन उपयोगी होते हैं, पर सबसे ज़रूरी बातें गतिविधि और उसका समय हैं।
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena कॉफ़ी का प्रस्ताव रखती है
    gloss: 'Elena: क्या हम शुक्रवार को कॉफ़ी पिएँ? Mateo: हाँ, बहुत बढ़िया! किस समय?'
    note: Mateo समय पूछने से पहले प्रस्ताव स्वीकार करता है।
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Elena का पहला समय
    gloss: 'Elena: 2:30 बजे।'
    note: '*Las dos y media* का अर्थ 2:30 है, जैसा समय बताने वाले पाठ में देखा था।'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo दूसरा समय सुझाता है
    gloss: 'Mateo: माफ़ कीजिए, 2:30 बजे मैं नहीं आ सकता। क्या 3:15 बजे हो सकता है?'
    note: '*¿Puede ser a ...?* यह पूछने का संक्षिप्त तरीक़ा है कि कोई दूसरा समय चलेगा या नहीं।'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: वे अंतिम योजना पक्की करते हैं
    gloss: 'Elena: हाँ, 3:15 बजे मेरे लिए ठीक है। Mateo: अच्छी योजना। तो हम शुक्रवार को 3:15 बजे मिलते हैं।'
    note: यहाँ *quedamos* फिर से *nosotros* का रूप है, जो अब योजना पक्की कर रहा है।
exercises:
  es.a1.unit50.lesson01.exercise01.choose_joint_proposal:
    instruction: वह मानक स्पेनिश प्रस्ताव चुनिए जिसका अर्थ है 'क्या हम कॉफ़ी पिएँ?'
