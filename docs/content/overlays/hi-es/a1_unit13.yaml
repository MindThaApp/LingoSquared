  es.a1.unit13.lesson01.teach.el_escritorio:
    title: डेस्क / मेज़
    gloss: डेस्क / मेज़
    note: '*Escritorio* पुल्लिंग है।'
    example_gloss: यह मेरी डेस्क है।
  es.a1.unit13.lesson01.teach.la_escuela:
    title: स्कूल
    gloss: स्कूल
    note: '*Escuela* स्त्रीलिंग है।'
    example_gloss: मैं एक स्कूल में पढ़ाता/पढ़ाती हूँ।
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: छात्र
    gloss: छात्र
    note: '*Estudiante* पुरुष और महिला दोनों के लिए एक ही रूप है; बहुवचन *los estudiantes* मिले-जुले समूह के लिए भी चलता है।'
    example_gloss: मेरे बीस छात्र हैं।
  es.a1.unit13.lesson02.teach.trabajar:
    title: काम करना
    gloss: काम करना
    note: क्रिया का मूल रूप, जो *me gusta trabajar* (मुझे काम करना पसंद है) जैसे वाक्यों में आता है।
  es.a1.unit13.lesson02.teach.soy_contador:
    title: बताइए कि आप अकाउंटेंट हैं
    gloss: मैं अकाउंटेंट हूँ।
    note: पेशे के लिए *ser* + पेशा आता है, बिना उपपद के -- नीचे व्याकरण नोट देखिए।
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: बताइए कि आप शिक्षिका हैं (स्त्रीलिंग)
    gloss: मैं शिक्षिका हूँ।
    note: '*Profesora*, *profesor* का स्त्रीलिंग रूप है।'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: बताइए कि आप कहाँ पढ़ाते हैं
    gloss: मैं एक स्कूल में पढ़ाता/पढ़ाती हूँ।
    note: '*Enseño* (मैं पढ़ाता/पढ़ाती हूँ) क्रिया *enseñar* का उत्तम पुरुष रूप है, और *escuela* का अर्थ स्कूल है।'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: ser के साथ पेशे के नाम
    gloss: स्पेनिश में पेशा बिना उपपद के कैसे बताया जाता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: 'पेशे बताने के लिए *ser* + पेशा आता है, बिना उपपद के: *soy contador* (मैं अकाउंटेंट हूँ), *soy un contador* नहीं। *Contador* का स्त्रीलिंग रूप *contadora* है; "शिक्षक" के लिए *profesor/profesora* भी ऐसी ही पुल्लिंग/स्त्रीलिंग जोड़ी है (स्त्री के लिए *-a* जोड़ें)।'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: किसी से उसका काम पूछिए
    gloss: आप काम क्या करते हैं?
    note: '*¿En qué trabajas?* (शाब्दिक अर्थ: "आप किसमें काम करते हैं?") किसी का पेशा पूछने का सामान्य तरीका है।'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: अपने काम के साथ जवाब दीजिए
    gloss: मैं एक दफ़्तर में काम करता/करती हूँ। मैं अकाउंटेंट हूँ।
    note: '*oficina* और *soy contador* को जोड़कर दो वाक्यों का स्वाभाविक जवाब बनता है।'
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: बताइए कि आपको अपना काम पसंद है
    gloss: मुझे अपना काम पसंद है।
    note: '*gustar* वाली संरचना फिर से, *mi trabajo* (मेरा काम) के साथ।'
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: अपनी पसंद बताइए
    gloss: लेकिन मैं खाना बनाना ज़्यादा पसंद करता/करती हूँ।
    note: '*Prefiero* (मैं ज़्यादा पसंद करता/करती हूँ) रूप आप पहले देख चुके हैं; *cocinar* (खाना बनाना) इस पूरी कहानी की मुख्य गतिविधि का क्रिया-मूल रूप है।'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: बताइए कि आप दोनों को यह ज़्यादा पसंद है
    gloss: हम दोनों को यह ज़्यादा पसंद है।
    note: '*Preferimos*, *preferir* का *nosotros* (हम) रूप है, जो तब आता है जब एलेना और मातेओ साथ में सहमत होते हैं।'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: उनके काम के बारे में पढ़ना
    gloss: मातेओ लंदन में एक दफ़्तर में काम करता है। वह अकाउंटेंट है। एलेना एक स्कूल में पढ़ाती है। वह शिक्षिका है और उसके बीस छात्र हैं। दोनों को अपना काम पसंद है, पर वे मंगलवार को साथ खाना बनाना ज़्यादा पसंद करते हैं।
    note: मातेओ और एलेना के रोज़ के काम का छोटा सारांश।
    glosses:
      trabaja: काम करता है (trabajar से)
      oficina: दफ़्तर
      contador: अकाउंटेंट
      enseña: पढ़ाती/पढ़ाता है (enseñar से)
      escuela: स्कूल
      profesora: शिक्षिका
      tiene: के पास है (tener से)
      veinte: बीस
      estudiantes: छात्र
      gusta: पसंद है (gustar से)
      trabajo: काम
      prefieren: ज़्यादा पसंद करते हैं (preferir से)
      cocinar: खाना बनाना
      juntos: साथ में
      martes: मंगलवार को
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: gustar बहुवचन अप्रत्यक्ष कर्म के साथ कैसे चलता है।
    note: कार्ड का अपना पाठ देखिए।
    target_text: '*A los dos les gusta* (दोनों को पसंद है) *gustar* वाली संरचना (जो आप पहले से जानते हैं) को बहुवचन अप्रत्यक्ष कर्म तक बढ़ाता है -- *me/te* (मुझे/तुम्हें) की जगह *les* (उन्हें)।'
  es.a1.unit13.lesson06.teach.line01:
    title: मातेओ का काम पूछिए
    gloss: एलेना मातेओ से पूछती है कि वह काम क्या करता है।
    note: यह वही सवाल है जो आपने पहले सीखा था, अब नाम लेकर मातेओ से पूछा जा रहा है।
  es.a1.unit13.lesson06.teach.line02:
    title: उसके काम के साथ जवाब दीजिए
    gloss: मातेओ कहता है कि वह एक दफ़्तर में अकाउंटेंट के तौर पर काम करता है।
    note: 'वही पूरा जवाब जो आपने पहले सीखा था: पहले वह कहाँ काम करता है, फिर उसका पेशा।'
  es.a1.unit13.lesson06.teach.line03:
    title: प्रतिक्रिया दीजिए और अपना काम बताइए
    gloss: एलेना को यह दिलचस्प लगता है और वह बताती है कि वह शिक्षिका है।
    note: '*Interesante* (दिलचस्प) एक नया मिलता-जुलता शब्द है; बाकी *soy profesora* और *enseño en una escuela* है, जो आप पहले से जानते हैं।'
  es.a1.unit13.lesson06.teach.line04:
    title: पूछिए कि क्या उसे पढ़ाना पसंद है
    gloss: मातेओ पूछता है कि क्या उसे पढ़ाना पसंद है।
    note: '*¿Te gusta enseñar?* में *gustar* वाला जाना-पहचाना प्रश्न-ढाँचा क्रिया के मूल रूप *enseñar* के साथ जुड़ा है।'
  es.a1.unit13.lesson06.teach.line05:
    title: हाँ कहिए और अपनी पसंद जोड़िए
    gloss: एलेना कहती है कि उसे यह बहुत पसंद है, लेकिन वह मंगलवार को उसके साथ खाना बनाना ज़्यादा पसंद करती है।
    note: '*Contigo* (तुम्हारे साथ) con और सर्वनाम से बना एक नया संयुक्त रूप है; *los martes* (हर मंगलवार) में नियमित साप्ताहिक दिन के लिए बहुवचन उपपद आता है।'
  es.a1.unit13.lesson06.teach.line06:
    title: उसी पसंद से सहमति जताइए
    gloss: मातेओ कहता है कि उसे भी अपना काम पसंद है, पर वह खाना बनाना ज़्यादा पसंद करता है।
    note: '*A mí también* (मुझे भी) *gustar* के साथ सहमति जताने का ज़ोरदार ढाँचा है: *a mí* इस बात पर ज़ोर देता है कि किसे पसंद है।'
  es.a1.unit13.lesson06.teach.line07:
    title: निष्कर्ष निकालिए
    gloss: एलेना निष्कर्ष निकालती है कि दोनों को यही (साथ खाना बनाना) ज़्यादा पसंद है।
    note: '*Entonces* (तो/फिर) एक नया तार्किक जोड़ने वाला शब्द है; बाकी *los dos preferimos esto* (हम दोनों इसे ज़्यादा पसंद करते हैं) है।'
  es.a1.unit13.lesson06.teach.line08:
    title: उत्साह से हामी भरिए
    gloss: 'मातेओ सहमत है: बिल्कुल।'
    note: '*Definitivamente* (बिल्कुल) एक नया मिलता-जुलता क्रियाविशेषण है, जो दृश्य को समाप्त करता है।'
