  description: 'अपने काम के बारे में बताना: 22 जुलाई की वर्कशॉप क्लास के ब्रेक में एलेना और मातेओ की कहानी आगे बढ़ती है। वे अपने रोज़ के काम के बारे में बात करते हैं -- मातेओ अकाउंटेंट है और एलेना शिक्षिका -- और मानते हैं कि दोनों को साथ खाना बनाना ज़्यादा पसंद है।'
