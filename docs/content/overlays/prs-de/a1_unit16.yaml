    gloss: 'کارمند: ریل ساعت نُه از پلت‌فارم سه حرکت می‌کند.'
    note: معلومات مهم سفر، وقت و پلت‌فارم است.
  de.a1.unit16.lesson02.teach.line05:
    title: فیلیکس می‌پرسد پلت‌فارم کجاست
    gloss: 'فیلیکس: تشکر. پلت‌فارم سه کجاست؟'
    note: یک سوال عملی بعدی در ایستگاه.
    example_gloss: 'در متن: پلت‌فارم سه کجاست؟'
  de.a1.unit16.lesson02.teach.line06:
    title: کارمند راه را نشان می‌دهد
    gloss: 'کارمند: مستقیم بروید و بعد به طرف راست.'
    note: در سفر می‌توان عبارت‌های جهت را که در واحد ۱۰ خواندید دوباره به کار برد.
