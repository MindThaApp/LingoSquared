    title: Das Hemd passt.
    gloss: پیراهن اندازه است.
    note: '*passt* در مورد لباس یعنی اندازه یا برابر بودن.'
    example_gloss: 'در جمله: بلی، پیراهن اندازه است.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: من یک پیراهن آبی، اندازهٔ M می‌خواهم.
    note: در این درخواست جنس، رنگ و اندازه گفته می‌شود.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: برچسب لباس
    note: برچسب لباس می‌تواند رنگ، اندازه و قیمت را نشان بدهد.
    example_gloss: 'رنگ: آبی. اندازه: M.'
  de.a1.unit21.lesson02.teach.line01:
    title: فروشنده می‌پرسد
    gloss: 'فروشنده: روز بخیر. چه می‌خواهین؟'
    note: فروشنده از مشتری می‌پرسد که چه می‌خواهد.
    example_gloss: چه می‌خواهین؟
  de.a1.unit21.lesson02.teach.line02:
    title: فیلیکس جنس، رنگ و اندازه را می‌گوید
    gloss: 'فیلیکس: من یک پیراهن آبی، اندازهٔ M می‌خواهم.'
    note: فیلیکس هر سه معلومات خواسته‌شده را می‌دهد.
  de.a1.unit21.lesson02.teach.line03:
    title: فروشنده پیراهن را پیشنهاد می‌کند
    gloss: 'فروشنده: بفرمایید. می‌خواهین آن را بخرین؟'
    note: '*Sie* رسمی صحبت در دکان را مؤدبانه نگه می‌دارد.'
    example_gloss: می‌خواهین آن را بخرین؟
  de.a1.unit21.lesson02.teach.line04:
    title: فیلیکس اندازه را امتحان می‌کند و قیمت را می‌پرسد
    gloss: 'فیلیکس: بلی، پیراهن اندازه است. قیمتش چند است؟'
    note: فیلیکس می‌گوید اندازه است و قیمت را می‌پرسد.
    example_gloss: 'در جمله: بلی، پیراهن اندازه است.'
