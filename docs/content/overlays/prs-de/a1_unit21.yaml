    example_gloss: اندازهٔ M، لطفاً.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: آبی
    note: در آلمانی برای گفتن رنگ می‌شود *in Blau* گفت؛ یعنی «به رنگ آبی».
    example_gloss: من یک پیراهن آبی می‌خواهم.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: سرخ
    note: '*rot* یعنی سرخ.'
