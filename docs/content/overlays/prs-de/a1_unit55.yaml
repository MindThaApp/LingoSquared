  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: آنا نینا را توصیف می‌کند
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: مقایسهٔ یوناس و لینا
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: فیلکس نینا را می‌شناسد
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Groß* برای شخص قدبلند و *klein* برای شخص کوتاه‌قد است. برای آدم‌ها در آلمانی groß (بزرگ) گفته می‌شود، نه lang (دراز).'
    example_gloss:
    - لینا قدبلند است.
    - یوناس کوتاه‌قد است.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Alt* و *jung* در اینجا تصور عمومی از سن را می‌رسانند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - بابه کلان پیر است.
    - فیلکس جوان است.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: عدد یا تصور'
    gloss: Alt می‌تواند با تعداد سال بیاید، مثل Ich bin dreißig Jahre alt، یا یک تصور عمومی بدهد، مثل Opa ist alt.
    note: سن دقیق کسی را با *Wie alt bist du?* می‌پرسید. اینجا *alt* می‌گوید کسی چقدر پیر به نظر می‌رسد، بدون عدد.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: لینا قدبلند است و یوناس کوتاه‌قد
    gloss: لینا قدبلند است و یوناس کوتاه‌قد است.
    note: یک جملهٔ ساده با *und* (و) که زمینه را برای مقایسهٔ مستقیم در درس پنجم آماده می‌کند.
  de.a1.unit55.lesson02.teach.die_haare:
    title: مو
    gloss: مو
    note: '*Haare* اسم جمع است: *die Haare*. در آلمانی مفرد آن das Haar هم هست، اما برای موی سر معمولاً Haare می‌گویند.'
    example_gloss: فیلکس موهای کوتاه سیاه دارد.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'سه رنگ مو: blond، braun، grau. پیش از اسم جمع بدون حرف تعریف، آخرشان -e می‌گیرد: blonde، braune، graue Haare.'
    example_gloss:
    - آنا موهای بور دارد.
    - یوناس موهای قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Kurz* (کوتاه) و *lang* (دراز) طول مو را می‌رسانند. باز هم پسوند -e: kurze Haare، lange Haare.'
    example_gloss:
    - لینا موهای دراز دارد.
    - یوناس موهای کوتاه دارد.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare پسوند -e می‌گیرد
    gloss: 'Haare جمع است و حرف تعریف ندارد، پس صفت به -e ختم می‌شود: kurze Haare، lange Haare، blonde Haare، braune Haare، graue Haare، schwarze Haare.'
    note: وقتی حرف تعریف نباشد، صفتِ پیش از اسم جمع -e می‌گیرد. این همان الگوی *Augen* در درس سوم است.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: مال او (زن)'
    gloss: 'Ihre در اینجا یعنی «مال او (زن)»: ihre Haare = موهای او. آنا موهای دراز دارد و موهایش بور است.'
    note: '*Ihre* (با i کوچک) ضمیر ملکی «مال او (زن)» است و با اسم جمع Haare هماهنگ می‌شود. با I بزرگ، *Ihre* یعنی «مال شما» (رسمی).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: فیلکس موهای کوتاه سیاه دارد
    gloss: فیلکس موهای کوتاه سیاه دارد.
    note: 'کلمهٔ *schwarz* (سیاه) دوباره می‌آید، این بار برای مو: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: آنا موهای دراز بور دارد
    gloss: آنا موهای دراز بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  de.a1.unit55.lesson03.teach.die_augen:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Augen* جمع *das Auge* است. در آلمانی معمولاً شکل جمع را به کار می‌برند، چون ما دو چشم داریم.'
    example_gloss: فیلکس چشم‌های قهوه‌یی دارد.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: 'رنگ‌ها: blau (آبی)، braun (قهوه‌یی) و grün (سبز).'
    example_gloss:
    - آنا چشم‌های آبی دارد.
    - یوناس چشم‌های قهوه‌یی دارد.
    - لینا چشم‌های سبز دارد.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen پسوند -e می‌گیرد
    gloss: 'Augen جمع است، پس صفت به -e ختم می‌شود: blaue Augen، braune Augen، grüne Augen.'
    note: 'همان قاعدهٔ Haare: بدون حرف تعریف و با اسم جمع، پسوند -e می‌آید.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: آنا چه شکلی است؟
    gloss: آنا چه شکلی است؟
    note: '*Wie sieht ... aus?* سؤال اصلی این بخش است. فعل *aussehen* جداشدنی است: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: آنا موهای دراز بور و چشم‌های آبی دارد
    gloss: آنا موهای دراز بور و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *und* در یک جمله می‌آورد.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: آنا نینا را معرفی می‌کند
    gloss: 'آنا: یک دختر تازه به کافهٔ زبان می‌آید. نامش نینا است.'
    note: '*Ein neues Mädchen kommt* یک نفر تازه را معرفی می‌کند. بعد از *kommt*، جهت *ins* (in das) Sprachcafé حالت مفعولی (Akkusativ) می‌گیرد.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: فیلکس می‌پرسد او چه شکلی است
    gloss: 'فیلکس: خوب! او چه شکلی است؟'
    note: 'سؤال اصلی این بخش دوباره می‌آید، این بار با *sie* (او، زن) به جای نام: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: آنا قد و موهای نینا را توصیف می‌کند
    gloss: 'آنا: او کوتاه‌قد است و موهای کوتاه بور دارد.'
    note: '*klein* با واژه‌های مو از درس دوم ترکیب شده است. *sie* دوم حذف می‌شود: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: فیلکس دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'فیلکس: و چشم‌هایش؟'
    note: '*Ihre* در اینجا یعنی «مال او (زن)» (ضمیر ملکی)، نه شکلی از «شما». با اسم جمع Augen هماهنگ است.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: آنا چشم‌های نینا را توصیف می‌کند
    gloss: 'آنا: او چشم‌های سبز دارد.'
    note: '*grüne Augen* از درس ۰۳ دوباره آمده است.'
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: فیلیکس او را می‌شناسد
    gloss: 'فیلیکس: تشکر! پس حتماً او را می‌شناسم.'
    note: '*Dann erkenne ich sie bestimmt* یعنی «پس حتماً او را می‌شناسم». بعد از *dann* فعل در جای دوم می‌آید: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: مقایسهٔ یوناس و لینا
    gloss: یوناس و لینا برادر و خواهر استند، اما ظاهرشان فرق دارد. یوناس قدکوتاه است و موهای کوتاه قهوه‌یی و چشم‌های قهوه‌یی دارد. لینا از یوناس قدبلندتر است و موهای بلند قهوه‌یی و چشم‌های سبز دارد. تو چه شکلی استی؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      Bruder: برادر
      Schwester: خواهر
      sehen: ظاهر شدن، به نظر آمدن
      unterschiedlich: فرق دار
      klein: کوتاه
      kurze: کوتاه
      braune: قهوه‌یی
      Haare: مو
      Augen: چشم‌ها
      größer: قدبلندتر
      lange: دراز
      grüne: سبز
      aus: (بخشی از فعل 'aussehen' = ظاهر داشتن)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: صفت تفضیلی، دوباره
    gloss: 'الگوی صفت + -er + als (از) را از قبل می‌دانی. این‌جا برای اشخاص به کار می‌رود: Lena ist größer als Jonas.'
    note: 'همان الگوی *-er + als* که در درس مقایسه‌ها بود. Groß می‌شود größer: مصوت اُمlaut می‌گیرد.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: موهای لینا از موهای یوناس درازتر است
    gloss: موهای لینا از موهای یوناس درازتر است.
    note: '*Längere Haare*: länger پیش از اسم جمع بدون حرف تعریف، -e می‌گیرد و lang در صفت تفضیلی اُمlaut می‌گیرد.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جملهٔ نمونه با *Ich habe ...*؛ وقتی ظاهر خودت را توصیف می‌کنی می‌توانی از آن استفاده کنی.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: فیلیکس نینا را می‌بیند
    gloss: 'فیلیکس: ببین، این نینا است؟ او موهای کوتاه بلوند و چشم‌های سبز دارد.'
    note: '*Schau mal* (یک نگاه کن) راه دوستانه‌یی است برای نشان دادن چیزی. این شکل امری برای du است.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: آنا تأیید می‌کند
    gloss: 'آنا: بلی، این نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: نینا به فیلیکس سلام می‌دهد
    gloss: 'نینا: سلام، تو فیلیکس استی؟'
    note: 'یک سوال ساده و دوستانه: *bist du ...?* (تو ... استی؟). Bist شکل du فعل sein است.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: فیلیکس هم به نینا سلام می‌دهد
    gloss: 'فیلیکس: بلی! از دیدنت خوش شدم، نینا.'
    note: '*Freut mich* عبارت معمول برای اولین دیدار است، مثل درس ۲. برای کسی که از قبل می‌شناسی می‌گویی *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را تمام می‌کند؛ فیلیکس نینا را از روی توصیف آنا درست شناخت.
