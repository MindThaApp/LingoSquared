course:
  title: آلمانی A1
  description: 'آلمانی ابتدایی برای توصیف ظاهر اولیهٔ یک شخص: قد و تصور از سن، رنگ مو و چشم، سؤال اصلی Wie sieht ... aus? و مقایسهٔ ظاهر دو نفر.'
units:
  de.a1.unit55.aussehen:
    title: توصیف ظاهر
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: قدبلند، قدکوتاه، پیر و جوان
  de.a1.unit55.lesson02.haare_beschreiben:
    title: توصیف مو
  de.a1.unit55.lesson03.augen_und_wie_jemand:
