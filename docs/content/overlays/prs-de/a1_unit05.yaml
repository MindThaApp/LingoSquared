teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: ساعت چند است؟
    note: یعنی تحت‌اللفظی «چقدر دیر است؟» -- راه معمول برای پرسیدن وقت.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: ساعت سه است.
    note: '*Uhr* = «ساعت». ساعت تمام عدد + *Uhr* است.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: ساعت سه و نیم است (3:30).
    note: 'در آلمانی نیم ساعت نسبت به ساعتی گفته می‌شود که به طرفش می‌رویم: *halb vier* = «نیم به طرف چهار» = 3:30، نه 4:30.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: ساعت پنج است.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: ساعت سه و ربع است (3:15).
    note: '*Viertel* = «ربع»؛ *nach* = «بعد از».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: ساعت چهار ربع کم است (3:45).
    note: '*vor* = «پیش از / کم».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: ساعت چهار و ده دقیقه است (4:10).
    note: 'اول دقیقه، بعد *nach* و بعد ساعت می‌آید: ده دقیقه بعد از ساعت چهار.'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: ساعت پنج ده دقیقه کم است (4:50).
    note: 'اول دقیقه، بعد *vor* و بعد ساعت آینده می‌آید: ده دقیقه به ساعت پنج.'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: صبح
    note: '*Morgen* اسم صبح است، تقریباً از ساعت 6 تا 12 قبل از چاشت.'
    example_gloss: صبح بخیر، فیلکس!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: چاشت
    note: '*Mittag* خود وقت چاشت (ظهر) است، میان Morgen و Nachmittag.'
    example_gloss: وقت چاشت است.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: بعدازظهر
    note: '*Nachmittag* تقریباً از ساعت 12 تا 6 را در بر می‌گیرد.'
    example_gloss: من بعدازظهر کار می‌کنم.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: شام (شب‌هنگام)
    note: '*Abend* تقریباً از ساعت 6 تا 10 شب را در بر می‌گیرد.'
    example_gloss: شام بخیر، آنا!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: شب
    note: '*Nacht* تقریباً از ساعت 10 شب تا 6 صبح را در بر می‌گیرد.'
    example_gloss: شب بخیر، فیلکس!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: نیمه‌شب
    note: '*Mitternacht* دقیقاً ساعت 12 شب / 0 Uhr است.'
    example_gloss: مهمانی در نیمه‌شب ختم می‌شود.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: هجده
    note: '*achtzehn* = 18؛ این‌جا در ساعت 24 ساعته برای ساعات رسمی کار استفاده شده است (achtzehn Uhr = ساعت 6 شام).'
    example_gloss: دکان ساعت 18:00 (6 شام) بسته می‌شود.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: دکان ساعت نُه صبح باز می‌شود.
    note: '*um* + وقت = «در ساعت»؛ *morgens* = «صبح‌ها / در وقت صبح».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: دکان ساعت 18:00 (6 شام) بسته می‌شود.
    note: '*schließt* = «بسته می‌شود». ساعات رسمی کار با ساعت 24 ساعته گفته می‌شود.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: کی
    note: '*Wann* پرسش دربارهٔ وقت را شروع می‌کند.'
    example_gloss: شما کی می‌آیید؟
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: باز می‌شود
    note: '*öffnet* شکل سوم شخص مفرد فعل *öffnen* (باز کردن / باز شدن) است؛ *die* حرف تعریف مؤنث و جمع است و با *die Bibliothek* می‌آید.'
    example_gloss: کتابخانه کی باز می‌شود؟
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: کتابخانه
    note: '*Bibliothek* اسم مؤنث است (*die Bibliothek*)، همان جایی که در واحد 4 آمد.'
    example_gloss: من به کتابخانه می‌روم.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: آن / او (مؤنث) / آن‌ها (با حرف کوچک)
    note: این‌جا *sie* ضمیر سوم شخص است و به جای اسم مؤنث *die Bibliothek* آمده -- یعنی «آن». با *Sie* (با حرف بزرگ، «شما» به شکل محترمانه) که آنا و فیلکس با هم استفاده می‌کنند اشتباه نشود.
    example_gloss: من کتابخانه را دوست دارم. من اکثر اوقات به آن می‌روم.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: بعد / آن وقت
    note: '*dann* این‌جا در خداحافظی *Bis dann!* آمده است («تا آن وقت، به امید دیدار!»).'
    example_gloss: تا آن وقت!
  de.a1.unit05.lesson04.teach.line01:
    title: فیلیکس دربارهٔ کتابخانه می‌پرسد
    gloss: 'فیلیکس می‌گوید: کتابخانه چه وقت باز می‌شود؟'
  de.a1.unit05.lesson04.teach.line02:
    title: آنا جواب می‌دهد
    gloss: 'آنا می‌گوید: ساعت نه صبح باز می‌شود.'
    note: '*Sie* در اینجا یعنی «آن» و به *die Bibliothek* اشاره می‌کند؛ فقط به خاطر این که اول جمله آمده، با حرف بزرگ نوشته شده است.'
  de.a1.unit05.lesson04.teach.line03:
    title: فیلیکس سوال دیگر می‌پرسد
    gloss: 'فیلیکس می‌گوید: و چه وقت بسته می‌شود؟'
  de.a1.unit05.lesson04.teach.line04:
    title: آنا دوباره جواب می‌دهد
    gloss: 'آنا می‌گوید: ساعت ۱۸:۰۰ (شش بجه شام) بسته می‌شود.'
  de.a1.unit05.lesson04.teach.line05:
    title: فیلیکس خداحافظی می‌کند
    gloss: 'فیلیکس می‌گوید: خوب، تا آن وقت!'
  de.a1.unit05.lesson04.teach.schild:
    title: یک تخته بالای دروازه
    gloss: 'اوقات کار: از ساعت ۹:۰۰ تا ۱۸:۰۰.'
    note: '*Öffnungszeiten* = «اوقات کار»؛ *bis* = «تا».'
