teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: نام شما چیست؟ (رسمی)
    note: '*Wie heißen Sie?* در اصل می‌پرسد «چطور صدا زده می‌شوید»، با شکل رسمی *Sie* از واحد ۱.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: نام من Anna است.
    note: '*heißen* یعنی «نامیده شدن»؛ راه معمول گفتن نام خود همین است.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: نام تو چیست؟ (غیررسمی)
    note: شکل غیررسمی، با *du* از واحد ۱.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: نام من Felix است.
    note: ساختار مثل *Ich heiße Anna* است، فقط نام فرق دارد.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: خوش شدم.
    note: راه کوتاه و رایج برای گفتن اینکه از آشنایی با کسی خوش شدی؛ در هر دو شکل رسمی و غیررسمی به کار می‌رود.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: من هم. / خوشی از من است.
    note: جواب طبیعی به *Freut mich*؛ در اصل یعنی «کاملاً از طرف من».
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: من
    note: '*ich* در آلمانی جز در آغاز جمله (مثل *Ich bin Anna.*) با حرف کوچک نوشته می‌شود.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: تو (غیررسمی)
    note: در واحد ۱ معرفی شد؛ اینجا به حیث فاعل یک جملهٔ کامل مرور می‌شود.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: من Anna استم.
    note: '*bin* شکل *ich* فعل *sein* (بودن) است.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: تو Felix استی.
    note: '*bist* شکل *du* فعل *sein* است.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: آلمان
    note: نام کشورها در آلمانی معمولاً آرتیکل نمی‌خواهند؛ فقط *Deutschland*، نه *das Deutschland*.
    example_gloss: من از آلمان استم.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: انگلستان
    note: نام این کشور با آواهای آلمانی تلفظ می‌شود.
    example_gloss: من از انگلستان استم.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: فرانسه
    note: املای آلمانی نام این کشور با نام فرانسوی آن، *France*، فرق دارد.
    example_gloss: من از فرانسه استم.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: ایتالیا
    note: تقریباً «ایتالیئن» تلفظ می‌شود.
    example_gloss: من از ایتالیا استم.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: هسپانیه
    note: تقریباً «شپانیئن» تلفظ می‌شود.
    example_gloss: من از هسپانیه استم.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: روسیه
    note: از *Russ-* + *-land* ساخته شده، مثل *Deutschland*.
    example_gloss: من از روسیه استم.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: شما از کجا استید؟ (رسمی)
    note: '*Woher* یعنی «از کجا»؛ معنای «از» در خود این کلمه شامل است.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: من از آلمان استم.
    note: '*aus* + نام کشور خاستگاه را می‌رساند؛ در این مرحله به کلمهٔ ملیت ضرورت نیست.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: تو از کجا استی؟ (غیررسمی)
    note: شکل غیررسمی، با *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: من از انگلستان استم.
    note: ساختار مثل *Ich komme aus Deutschland* است، فقط کشور فرق دارد.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: و شما؟ (رسمی)
    note: راه کوتاه برگرداندن پرسش، مطابق با شکل رسمی *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix به Anna سلام می‌دهد
    gloss: 'Felix می‌گوید: روز بخیر!'
    note: Felix و Anna همسایه استند که یک بار قبلاً (واحد ۱) همدیگر را دیده بودند، اما نام‌های همدیگر را نپرسیده بودند؛ این بار دوباره در ایستگاه بس به هم برخورده‌اند.
  de.a1.unit02.lesson05.teach.line02:
    title: آنا سلام را جواب می‌دهد و نام او را می‌پرسد
    gloss: 'آنا می‌گوید: روز بخیر! نام تان چیست؟'
    note: آنا از *Sie* رسمی استفاده می‌کند و همان سطح رسمی‌ای را ادامه می‌دهد که آن‌ها در واحد ۱ به‌حیث آدم‌های ناآشنا داشتند.
  de.a1.unit02.lesson05.teach.line03:
    title: فیلیکس نام خود را می‌گوید و همان سوال را پس می‌پرسد
    gloss: 'فیلیکس می‌گوید: نام من فیلیکس است. و شما؟'
    note: فیلیکس جواب می‌دهد و سوال را به شکل رسمی پس می‌پرسد.
  de.a1.unit02.lesson05.teach.line04:
    title: آنا نام خود را می‌گوید
    gloss: 'آنا می‌گوید: نام من آنا است. خوش شدم.'
    note: آنا به همین شکل جواب می‌دهد و جملهٔ مهربانی را هم اضافه می‌کند.
  de.a1.unit02.lesson05.teach.line05:
    title: فیلیکس جواب می‌دهد و می‌پرسد که او از کجاست
    gloss: 'فیلیکس می‌گوید: من هم همین‌طور. شما از کجا می‌آیید؟'
    note: فیلیکس جملهٔ مهربانی را جواب می‌دهد و صحبت را به این می‌کشاند که او از کجاست.
  de.a1.unit02.lesson05.teach.line06:
    title: آنا جواب می‌دهد و سوال را پس می‌پرسد
    gloss: 'آنا می‌گوید: من از آلمان می‌آیم. و شما؟'
    note: این نشان می‌دهد که آنا آلمانی است؛ و با این هم جور می‌آید که آن‌ها در یک شهر آلمانی‌زبان همسایه‌اند.
  de.a1.unit02.lesson05.teach.line07:
    title: فیلیکس جواب می‌دهد
    gloss: 'فیلیکس می‌گوید: من از انگلستان می‌آیم.'
    note: حالا معلوم می‌شود که فیلیکس از انگلستان است؛ یک همسایهٔ انگلیسی که در آلمان زندگی می‌کند.
  de.a1.unit02.lesson05.teach.line08:
    title: آنا خداحافظی می‌کند
    gloss: 'آنا می‌گوید: خدا حافظ!'
    note: خداحافظی رسمی از واحد ۱، که با ادامهٔ همان سطح رسمی *Sie* جور است.
  de.a1.unit02.lesson05.teach.line09:
    title: فیلیکس خداحافظی می‌کند
    gloss: 'فیلیکس می‌گوید: خدا حافظ!'
    note: فیلیکس هم به همین شکل ختم می‌کند و در تمام این دیدار همان سطح رسمی را نگه می‌دارد.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: یک پروفایل کوتاه نوشتاری
    gloss: 'نام: فیلیکس. کشور: انگلستان.'
    note: یک کارت ساده پروفایل که نام و یک معلومات شخصی را می‌دهد؛ همان معلوماتی که فیلیکس قبلاً در گفتگو به زبان گفت.
