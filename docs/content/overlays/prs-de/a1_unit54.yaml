teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *lesen* (خواندن)، *Sport treiben* (ورزش کردن) و *kochen* (آشپزی کردن). Sport اسم است، پس با حرف بزرگ نوشته می‌شود.'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Die Freizeit* اسم مؤنث است؛ آن را همیشه با حرف تعریف die یاد بگیرین. این کلمه برای صحبت دربارهٔ سرگرمی‌ها کلیدی است.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Lese* شکل ich فعل *lesen* (خواندن) است. جمله با عبارت زمان شروع شده، پس فعل باز هم در جای دوم می‌آید: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه عبارت دیگر سرگرمی: *Musik hören* (موسیقی گوش دادن)، *zeichnen* (نقاشی کردن) و *Videospiele spielen* (بازی ویدیویی کردن). Musik و Videospiele اسم اند، پس با حرف بزرگ نوشته می‌شوند.'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: در آلمانی *Musik hören* گفته می‌شود و بعد از hören حرف اضافه نمی‌آید؛ Musik مستقیم می‌آید.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*Mit Freunden* (با دوستان): بعد از mit همیشه حالت داتیو می‌آید، پس Freunde می‌شود Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: immer, oft, manchmal, nie. معمولاً درست بعد از فعل می‌آیند: ich spiele nie.'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Jede Woche* و *jedes Wochenende* هر دو یعنی «هر»، ولی آخر کلمه مطابق جنسیت اسم تغییر می‌کند: کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede یا jedes
    gloss: Die Woche مؤنث است، پس jede Woche می‌شود. Das Wochenende خنثی است، پس jedes Wochenende می‌شود.
    note: '*Woche* مؤنث است (*die Woche*)، پس *jede* می‌گیرد؛ *Wochenende* خنثی است (*das Wochenende*)، پس *jedes* می‌گیرد. هر اسم را با حرف تعریفش یاد بگیرین، آن وقت ختم کلمه را می‌دانین.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna دربارهٔ سرگرمی‌ها صحبت را شروع می‌کند
    gloss: 'Anna: ما اکثراً با هم قدم می‌زنیم. ولی در وقت فراغتت دیگر چه کار می‌کنی، Felix؟'
    note: '*Wir gehen oft zusammen spazieren* فعل gehen را با یک فعل دوم می‌آورد: فعل صرف‌شدهٔ gehen در جای دوم است و مصدر spazieren به آخر جمله می‌رود.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: سرگرمی‌های Felix
    gloss: 'Felix: من آشپزی را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: '*Auch zu Hause* (در خانه هم) روشن می‌کند که Felix از سر شوق آشپزی می‌کند، نه فقط در کارش در رستورانت.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna تعجب می‌کند
    gloss: 'Anna: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: '*Den ganzen Tag* (تمام روز) در حالت مفعولی است، به همین خاطر der Tag می‌شود den Tag. مدت زمان‌هایی مثل این حالت مفعولی می‌گیرند.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix توضیح می‌دهد
    gloss: 'Felix: بلی، ولی آشپزی کردن را من آرام‌بخش می‌دانم. و تو، تو چه کار کردن را دوست داری؟'
    note: در *Kochen finde ich entspannend* کلمهٔ Kochen برای تأکید اول آمده است. فعل باز هم در جای دوم می‌ماند، پس ich بعد از آن می‌آید.
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: سرگرمی‌های Anna
    gloss: 'Anna: من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌دهم.'
    note: دو فعل سرگرمی از درس‌های ۰۱ و ۰۲ در یک جمله با *und* (و) یکجا شده‌اند.
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix دربارهٔ بازی ویدیویی می‌پرسد
    gloss: 'Felix: تو بازی ویدیویی هم می‌کنی؟'
    note: 'یک سوال کوتاه بلی/نخیر: فعل اول می‌آید، spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna جواب می‌دهد
    gloss: 'Anna: نخیر، من هرگز بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کنم!'
    note: '*Nie* (هرگز) و *manchmal* (گاهی) از درس ۰۳ در یک جواب در برابر هم آمده‌اند. هر دو درست بعد از فعل می‌آیند.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: مقایسهٔ سرگرمی‌ها
    gloss: Felix و من اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. Felix آشپزی را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌دهم. گاهی نقاشی می‌کنم، ولی هرگز بازی ویدیویی نمی‌کنم. تو در وقت فراغتت چه کار کردن را دوست داری؟
    note: پیام Anna چیزهای درس ۰۴ را خلاصه می‌کند و با سوال اصلی این بخش به خواننده تمام می‌شود.
    glosses:
      spazieren: قدم می‌زنیم
      oft: اکثراً
      zusammen: با هم
      andere: دیگر
      kocht: آشپزی می‌کند
      gern: دوست دارد
      Hause: در خانه
      Sport: ورزش می‌کند
      lese: خواندن
      höre: گوش می‌کنم
      Musik: موسیقی
      zeichne: نقاشی می‌کنم
      manchmal: گاهی
      spiele: ویدیوگیم بازی می‌کنی
      nie: هرگز
      freien: آزاد
      Zeit: وقت
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix دربارهٔ آخر هفته می‌پرسد
    gloss: 'Felix: این آخر هفته چه کار می‌کنی؟'
    note: '*Dieses Wochenende* (این آخر هفته) ختم خنثی -es دارد، چون das Wochenende خنثی است.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna مردد است
    gloss: 'Anna: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی بیرون رفتن را هم می‌خواهم.'
    note: '*Nach draußen* (بیرون، در اصل «به بیرون») راه رایج گفتن این است که می‌خواهین از خانه بیرون شوین.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix یک برنامه پیشنهاد می‌کند
    gloss: 'Felix: با هم قدم بزنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: '*Danach* (بعدش) اول آمده، پس فعل بعد از آن می‌آید و فاعل بعد از فعل: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna موافقت می‌کند
    gloss: 'Anna: فکر خوب! من هم قدم زدن را دوست دارم و هم آشپزی را.'
    note: '*Gern* بعد از فعل نشان می‌دهد که کاری را دوست دارید: ich gehe gern spazieren, ich koche gern. تقریباً با هر فعلی کار می‌کند.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix تأیید می‌کند
    gloss: 'Felix: عالی. پس روز شنبه می‌بینمت!'
    note: 'یک جملهٔ دوستانهٔ پایانی که برنامه را برای *Samstag* (شنبه) تأیید می‌کند. روزهای هفته *am* می‌گیرند: am Samstag.'
