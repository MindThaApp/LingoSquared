teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: سردردی
    note: '*Kopfschmerzen* از نظر شکل جمع است، اما برای «یک سردردی» به کار می‌رود.'
    example_gloss: سردرد دارم.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: دل‌دردی
    note: '*Bauch* یعنی شکم/دل؛ *Schmerzen* یعنی دردها.'
    example_gloss: من دل‌دردی دارم.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: گلو / گردن
    note: '*Hals* بسته به متن، گلو یا گردن معنا می‌دهد.'
    example_gloss: گلویم درد می‌کند.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: سرم درد می‌کند.
    note: در آلمانی گفته می‌شود عضو بدن «درد می‌کند» با *tut weh*؛ عضو بدن فاعل جمله است.
    example_gloss: دلم درد می‌کند.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: دلم بد است.
    note: آن را کلمه به کلمه «من بد هستم» ترجمه نکنین؛ *Mir ist schlecht* عبارت طبیعی است.
    example_gloss: دلم بد است؛ دل‌دردی دارم.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: کمک ضرورت دارید؟
    note: '*Sie* رسمی پرسش را با ادب نگه می‌دارد.'
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: من آب ضرورت دارم.
    note: '*brauche* یعنی ضرورت داشتن، نه استفاده کردن.'
    example_gloss: 'در متن: من آب و یک استراحت ضرورت دارم.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: استراحت / وقفه
    note: '*eine Pause* یک استراحت یا وقفه‌ی کوتاه است.'
    example_gloss: من یک استراحت ضرورت دارم.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: آب بنوشید. استراحت کنید.
    note: '*Sie* رسمی دستور را با ادب نگه می‌دارد.'
    example_gloss: استراحت کنید.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Annas Problem
    gloss: مشکل انا
    note: متن کوتاه علامه و ضرورت فوری را بیان می‌کند.
    example_gloss: او آب ضرورت دارد.
  de.a1.unit17.lesson02.teach.line01:
    title: فیلیکس از انا حال او را می‌پرسد
    gloss: 'فیلیکس: انا، خوب استین؟'
    note: فیلیکس با انا *Ihnen* رسمی را نگه می‌دارد.
  de.a1.unit17.lesson02.teach.line02:
    title: انا مشکلش را می‌گوید
    gloss: 'انا: نه، سردردی دارم.'
    note: جواب علامه را ساده بیان می‌کند.
  de.a1.unit17.lesson02.teach.line03:
    title: فیلیکس کمک پیشنهاد می‌کند
    gloss: 'فیلیکس: کمک ضرورت دارید؟'
    note: یک پیشنهاد ساده‌ی کمک.
  de.a1.unit17.lesson02.teach.line04:
    title: انا می‌گوید چه ضرورت دارد
    gloss: 'انا: بلی، لطفاً. آب و یک استراحت ضرورت دارم.'
    note: جواب *Ja, bitte* را می‌گوید و ضرورت‌های فوری را نام می‌برد.
    example_gloss: 'در متن: من آب و یک استراحت ضرورت دارم.'
