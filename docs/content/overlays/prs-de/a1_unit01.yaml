teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: سلام
    note: '*Hallo* سلام عادی و همه‌منظوره است که در هر وقت روز گفته می‌شود.'
    example_gloss: سلام، فیلیکس!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: صبح بخیر
    note: '*Guten Morgen* در وقت صبح تا نزدیک چاشت گفته می‌شود.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: روز بخیر / سلام
    note: '*Guten Tag* سلام معیاری و کمی رسمی‌تر روز است و از نزدیک چاشت تا بعد از ظهر گفته می‌شود.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: شام بخیر
    note: '*Guten Abend* وقتی گفته می‌شود که شبانگاه به جایی می‌رسید؛ این یک سلام است، نه خداحافظی.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: خداحافظ
    note: '*Tschüss* خداحافظی غیررسمی و خیلی رایج بین دوستان و آشناهاست.'
    example_gloss: خداحافظ، به زودی می‌بینمت!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: خداحافظ (رسمی)
    note: '*Auf Wiedersehen* معنی لفظی‌اش «تا دوباره همدیگر را ببینیم» است؛ خداحافظی معیاری و رسمی‌تر است که با آدم‌های ناآشنا یا در محیط کار استفاده می‌شود.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: به زودی می‌بینمت
    note: '*Bis bald* راه دوستانه‌ی خداحافظی است، وقتی انتظار دارید آن شخص را به زودی دوباره ببینین.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: بعداً می‌بینیم
    note: '*Bis später* وقتی گفته می‌شود که همان روز بعداً دوباره آن شخص را می‌بینین.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: شب بخیر
    note: '*Gute Nacht* وقتی گفته می‌شود که کسی می‌خواهد بخوابد یا روز را تمام می‌کند؛ برخلاف *Guten Abend*، این یک خداحافظی است، نه سلام.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: شما (رسمی)
    note: '*Sie* «شما»ی رسمی است که حتی وسط جمله با حرف بزرگ نوشته می‌شود و با آدم‌های ناآشنا، بزرگ‌ترها یا در موقعیت‌های رسمی و کاری استفاده می‌شود. در آلمانی «شما»ی رسمی یک ضمیر جدا از «تو» است؛ این یک مفهوم دستوری تازه است، نه فقط یک کلمه‌ی نو.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: تو (غیررسمی)
    note: '*du* «تو»ی غیررسمی است و با دوستان، اعضای خانواده و کودکان استفاده می‌شود. استفاده از *du* با آدم ناآشنا ممکن است بی‌تکلف یا حتی بی‌ادبانه به نظر برسد.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: حال شما چطور است؟ (رسمی)
    note: راه رسمی پرسیدن احوال کسی؛ *Ihnen* حالت رسمی «شما» در مفعول غیرمستقیم است و با *Sie* می‌خواند.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: حالت چطور است؟ (غیررسمی)
    note: '*Wie geht''s* شکل کوتاه‌شده‌ی *Wie geht es* است؛ راه عادی و غیررسمی احوال‌پرسی.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: خوب هستم، تشکر.
    note: یک جواب ساده و بی‌طرف که در هر دو سطح رسمی و غیررسمی استفاده می‌شود.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: خیلی خوب هستم، تشکر.
    note: جوابی گرم‌تر از *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: شما چطور؟ (رسمی)
    note: راه رسمی برگرداندن سوال، مطابق با *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: تو چطور؟ (غیررسمی)
    note: راه غیررسمی برگرداندن سوال؛ *dir* حالت غیررسمی «تو» در مفعول غیرمستقیم است و با *du* می‌خواند.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: تشکر / مننه
    note: '*Danke* قبلاً در جواب‌ها آمده بود؛ اینجا به‌تنهایی به‌عنوان یک کلمه‌ی جدا آمده است.'
    example_gloss: خیلی تشکر!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: لطفاً / خواهش می‌کنم
    note: '*Bitte* به‌راستی دو معنی رایج دارد و به موقعیت بستگی دارد: «لطفاً» وقتی چیزی می‌خواهین، یا «خواهش می‌کنم» وقتی جواب تشکر می‌تین. موقعیت نشان می‌دهد کدام معنی است؛ این تصادف یا اشتباه نیست و هر دو استفاده کاملاً معیاری است.'
    example_gloss:
    - یک قهوه، لطفاً.
    - خواهش می‌کنم، قابل ندارد!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: معذرت
    note: '*Entschuldigung* هم برای جلب توجه مؤدبانه‌ی کسی و هم برای معذرت‌خواهی کوتاه استفاده می‌شود.'
    example_gloss: معذرت می‌خواهم، تشناب کجاست؟
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: مشکلی نیست
    note: جواب عادی و دوستانه، شبیه «مشکلی نیست» در دری.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: خواهش می‌کنم
    note: راه کامل‌تر و واضح‌تر برای گفتن «خواهش می‌کنم» نسبت به *Bitte* کوتاه.
  de.a1.unit01.lesson05.teach.line01:
    title: انا به فیلیکس سلام می‌دهد
    gloss: 'انا می‌گوید: روز بخیر!'
    note: انا و فیلیکس برای بار اول به‌حیث همسایه در ساختمان خود همدیگر را می‌بینند.
  de.a1.unit01.lesson05.teach.line02:
    title: فیلیکس جواب سلام را می‌دهد و احوال او را می‌پرسد
    gloss: 'فیلیکس می‌گوید: روز بخیر! حال شما چطور است؟'
    note: فیلیکس از *Sie* رسمی استفاده می‌کند، چون تازه با هم آشنا شده‌اند.
  de.a1.unit01.lesson05.teach.line03:
    title: انا جواب می‌دهد و احوال او را می‌پرسد
    gloss: 'انا می‌گوید: تشکر، خوب هستم. شما چطور؟'
    note: انا جواب می‌دهد و سوال را به شکل رسمی برمی‌گرداند، مطابق با سطح گفتار فیلیکس.
  de.a1.unit01.lesson05.teach.line04:
    title: فیلیکس جواب می‌دهد
    gloss: 'فیلیکس می‌گوید: خیلی خوب هستم، تشکر.'
    note: جوابی کمی گرم‌تر از *Gut, danke.* ساده.
  de.a1.unit01.lesson05.teach.line05:
    title: انا خداحافظی می‌کند
    gloss: 'انا می‌گوید: خداحافظ!'
    note: انا خداحافظی رسمی‌تر را به کار می‌برد، مطابق با سطح *Sie* که از اول استفاده کرده‌اند.
  de.a1.unit01.lesson05.teach.line06:
    title: فیلیکس خداحافظی می‌کند و می‌گوید به زودی می‌بینمت
    gloss: 'فیلیکس می‌گوید: خداحافظ، به زودی می‌بینمت!'
    note: فیلیکس خداحافظی رسمی را با «به زودی می‌بینمت» یکجا می‌کند و مطابق با *Sie* که هر دو در این اولین دیدار به کار برده‌اند، باقی می‌ماند.
