units:
  de.a1.unit11.alltag:
    title: برنامهٔ روزانه
teaching:
  de.a1.unit11.lesson01.teach.aufstehen:
    title: aufstehen
    gloss: از خواب بلند شدن
    note: '*aufstehen* جداشدنی است: در *Ich stehe ... auf*، *auf* به آخر جمله می‌رود.'
    example_gloss: 'در جمله: من ساعت هفت از خواب بلند می‌شوم.'
  de.a1.unit11.lesson01.teach.fruehstuecken:
    title: frühstücken
    gloss: چاشت خوردن
    note: '*frühstücken* یک فعل باقاعده برای خوردن چاشت است.'
    example_gloss: شما چه وقت چاشت می‌خورید؟
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: کار کردن
    note: '*arbeiten* پسوند عادی *ich* را می‌گیرد: *ich arbeite*.'
    example_gloss: 'در جمله: من بعد از چاشت کار می‌کنم.'
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
    gloss: یاد گرفتن / درس خواندن
    note: وقتی مفعول یک مضمون درسی مثل آلمانی باشد، *lernen* می‌تواند «درس خواندن» هم معنا بدهد.
    example_gloss: 'در جمله: شب‌ها من آلمانی می‌خوانم.'
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: به خواب رفتن / خوابیدن
    note: '*schlafen gehen* یعنی در شب به خواب رفتن.'
    example_gloss: 'در جمله: من ساعت ده به خواب می‌روم.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: بعد ناشتا می‌کنم.
    note: 'در آلمانی بعد از *dann* فعل فوراً می‌آید: *Dann frühstücke ich*، نه *Dann ich frühstücke*.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: شما چه وقت از خواب بلند می‌شوید؟
    note: سوال رسمی با *Sie*؛ جزء جداشدنی *auf* در آخر جمله می‌ماند.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: من ساعت هفت از خواب بلند می‌شوم.
    note: '*um* برای گفتن وقت ساعت به کار می‌رود.'
  de.a1.unit11.lesson02.teach.am_nachmittag:
    title: am Nachmittag
    gloss: بعد از ظهر
    note: '*am* با بخش‌های روز مثل *am Nachmittag* و *am Abend* به کار می‌رود.'
    example_gloss: 'در جمله: من بعد از ظهر کار می‌کنم.'
  de.a1.unit11.lesson02.teach.routine_text:
    title: Annas Tag
    gloss: روز آنا
    note: یک متن کوتاه از برنامهٔ روزانه، کارها را با وقت‌ها وصل می‌کند.
    example_gloss: 'در جمله: شب آنا آلمانی می‌خواند.'
  de.a1.unit11.lesson02.teach.line01:
    title: فیلیکس دربارهٔ برنامهٔ روزانه می‌پرسد
    gloss: 'فیلیکس: شما چه وقت از خواب بلند می‌شوید؟'
    note: فیلیکس به شکل رسمی دربارهٔ برنامهٔ روزانهٔ آنا می‌پرسد.
  de.a1.unit11.lesson02.teach.line02:
    title: آنا صبح خود را شرح می‌دهد
    gloss: 'آنا: من ساعت هفت از خواب بلند می‌شوم. بعد ناشتا می‌کنم.'
    note: دو کار روزمره به ترتیب.
    example_gloss: 'در جمله: من ساعت هفت از خواب بلند می‌شوم.'
  de.a1.unit11.lesson02.teach.line03:
    title: فیلیکس دربارهٔ کار می‌پرسد
    gloss: 'فیلیکس: شما امروز کار می‌کنین؟'
    note: '*Sie* رسمی با شکل فعل *arbeiten*.'
  de.a1.unit11.lesson02.teach.line04:
    title: آنا باقی روز خود را شرح می‌دهد
    gloss: 'آنا: بلی، من بعد از ظهر در کافه کار می‌کنم. شب آلمانی می‌خوانم و ساعت ده به خواب می‌روم.'
    note: یک برنامهٔ روزانهٔ پیوسته می‌تواند چند جملهٔ کوتاه داشته باشد.
    example_gloss: 'در جمله: بلی، من بعد از ظهر در کافه کار می‌کنم.'
