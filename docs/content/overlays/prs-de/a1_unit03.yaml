teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: صفر، یک، دو، سه، چهار
    note: عددهای آلمانی از ۰ تا ۴.
    example_gloss:
    - من هیچ سیب ندارم.
    - من نمبر یک هستم!
    - من دو سیب دارم.
    - من سه سیب دارم.
    - من چهار سیب دارم.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: پنج، شش، هفت، هشت، نه، ده
    note: رقم‌های آلمانی از ۵ تا ۱۰.
    example_gloss:
    - من پنج سیب دارم.
    - من شش سیب دارم.
    - من هفت سیب دارم.
    - من هشت سیب دارم.
    - من نُه سیب دارم.
    - من ده سیب دارم.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: یازده، دوازده
    note: '*elf* و *zwölf* بی‌قاعده استند؛ مثل عددهای ۱۳ به بعد ساخته نمی‌شوند.'
    example_gloss:
    - نمبر خانهٔ من یازده است.
    - نمبر خانهٔ من دوازده است.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: سیزده، چهارده، پانزده، شانزده
    note: 'از ۱۳ به بعد، عددهای آلمانی از رقم اصلی + *-zehn* ساخته می‌شوند (مثل پسوند *-teen* در بعضی زبان‌های دیگر). توجه کنید: *sechzehn* درست است، نه *sechszehn*؛ حرف *s* می‌افتد.'
    example_gloss:
    - نمبر خانهٔ من سیزده است.
    - نمبر خانهٔ من چهارده است.
    - نمبر خانهٔ من پانزده است.
    - نمبر خانهٔ من شانزده است.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: هفده، هژده، نزده، بیست
    note: 'دقت کنید: *siebzehn*، نه *siebenzehn* — *-en* در آخر *sieben* پیش از *-zehn* می‌افتد.'
    example_gloss:
    - نمبر خانهٔ من هفده است.
    - نمبر خانهٔ من هژده است.
    - نمبر خانهٔ من نزده است.
    - نمبر خانهٔ من بیست است.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: سی، چهل، پنجاه
    note: 'دقت کنید: *dreißig*، نه *dreizig* — عدد ۳۰ به *-ßig* ختم می‌شود نه *-zig* (عدد ۲۰ یعنی *zwanzig* هم بی‌قاعده است).'
    example_gloss:
    - این سی یورو قیمت دارد.
    - این چهل یورو قیمت دارد.
    - این پنجاه یورو قیمت دارد.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: شصت، هفتاد، هشتاد، نوّد
    note: 'از ۴۰ به بعد قاعده منظم است: رقم + *-zig* (با همان کوتاه شدن‌های *sech-* و *sieb-* مثل عددهای ۱۳ تا ۱۹).'
    example_gloss:
    - این شصت یورو قیمت دارد.
    - این هفتاد یورو قیمت دارد.
    - این هشتاد یورو قیمت دارد.
    - این نوّد یورو قیمت دارد.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: صد
    note: '*hundert* به‌تنهایی یعنی «صد» یا «یک صد» — پیش از آن به *ein* ضرورت نیست (*einhundert* هم درست است، ولی در گپ‌های روزمره کمتر استفاده می‌شود).'
    example_gloss: این صد یورو قیمت دارد.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: بیست و یک
    note: 'در آلمانی عددهای ۲۱ تا ۹۹ این‌گونه ساخته می‌شوند: یکان + *und* («و») + دهگان، همه به شکل یک کلمه. در دری اول دهگان را می‌گوییم («بیست و یک»)، اما در آلمانی اول یکان می‌آید. *einundzwanzig* = *ein* (یک) + *und* (و) + *zwanzig* (بیست) = لفظاً «یک و بیست».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: سی و دو
    note: 'همین الگو: *zwei* (دو) + *und* + *dreißig* (سی) = «دو و سی» = ۳۲.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: شما چند ساله استید؟ (محترمانه)
    note: '*alt* یعنی «پیر، سال‌دار» — لفظاً «شما چقدر سال‌دار استید».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: تو چند ساله استی؟ (غیررسمی)
    note: شکل غیررسمی که با *du* می‌آید.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: من بیست و هشت ساله هستم.
    note: 'در آلمانی سن را با فعل «بودن» می‌گویند: «من ... سال عمر هستم». *Jahre alt* (سال) همیشه بعد از عدد می‌آید.'
  de.a1.unit03.lesson05.teach.line01:
    title: فیلیکس از سن انا می‌پرسد
    gloss: 'فیلیکس می‌گوید: شما چند ساله استید، اگر پرسیده بتوانم؟'
    note: '*wenn ich fragen darf* («اگر اجازه باشد بپرسم») سوالی را که شاید کمی مستقیم به نظر برسد نرم‌تر می‌سازد — یک ادب مناسب برای حالت رسمی *Sie* که آنها هنوز ادامه می‌دهند.'
  de.a1.unit03.lesson05.teach.line02:
    title: انا جواب می‌دهد و می‌پرسد
    gloss: 'انا می‌گوید: من بیست و هشت ساله هستم. و شما؟'
    note: انا سن خود را می‌گوید و سوال را پس می‌پرسد، مثل الگوی درس دوم.
  de.a1.unit03.lesson05.teach.line03:
    title: فیلیکس جواب می‌دهد
    gloss: 'فیلیکس می‌گوید: من سی و یک ساله هستم.'
    note: این نشان می‌دهد که فیلیکس سه سال از انا بزرگ‌تر است.
