course:
  title: آلمانی A1
  description: آلمانی سطح A1 را برای سلام و احوال‌پرسی روزمره و گفتگوهای کوتاه اجتماعی، همراه با توضیحات مفصل به دری بیاموزید.
units:
  de.a1.unit04.daten:
    title: روزها، ماه‌ها و تاریخ
lessons:
  de.a1.unit04.lesson01.wochentage:
    title: روزهای هفته
  de.a1.unit04.lesson02.monate:
    title: ماه‌ها
  de.a1.unit04.lesson03.das_datum:
    title: گفتن تاریخ
  de.a1.unit04.lesson04.im_gespraech_ueber_das_datum:
    title: صحبت دربارهٔ تاریخ‌ها
teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: دوشنبه
    note: در افغانستان هفته از شنبه شروع می‌شود، اما در کشورهای آلمانی‌زبان *Montag* اولین روز هفته است.
    example_gloss: من روز دوشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: سه‌شنبه
    note: '*Dienstag* دومین روز هفته است.'
    example_gloss: من روز سه‌شنبه وقت دارم.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: چهارشنبه
    note: '*Mittwoch* لفظاً «میان هفته» است؛ واقعاً روز وسطی هفتهٔ کاری در آلمان است.'
    example_gloss: من روز چهارشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: پنجشنبه
    note: نام *Donnerstag* از خدای ژرمنی Donar (Thor) گرفته شده است.
    example_gloss: من روز پنجشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: جمعه
    note: نام *Freitag* از الهه ژرمنی Frigg گرفته شده است.
    example_gloss: من روز جمعه وقت دارم.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: شنبه
    note: '*Samstag* کلمهٔ معیاری شنبه در بیشتر مناطق آلمان است؛ *Sonnabend* یک شکل محلی است (در شمال و شرق آلمان).'
    example_gloss: من روز شنبه وقت دارم.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: یکشنبه
    note: '*Sonntag* لفظاً «روز آفتاب» است.'
    example_gloss: من روز یکشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: امروز چه روز است؟
    note: '*heute* یعنی «امروز»؛ *Welcher Tag* یعنی «کدام روز».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: جنوری
    note: '*Januar* اولین ماه سال است.'
    example_gloss: تولد من در جنوری است.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: مارچ
    note: '*März* سومین ماه سال است.'
    example_gloss: تولد من در مارچ است.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: می
    note: '*Mai* کوتاه است و یادگرفتنش آسان است.'
    example_gloss: تولد من در می است.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: جولای
    note: '*Juli* هفتمین ماه سال است.'
    example_gloss: تولد من در جولای است.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: سپتمبر
    note: '*September* نهمین ماه سال است.'
    example_gloss: تولد من در سپتمبر است.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: دسمبر
    note: '*Dezember* آخرین ماه سال است.'
    example_gloss: تولد من در دسمبر است.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: کدام ماه است؟
    note: '*Monat* یعنی «ماه»؛ *es* یعنی «آن».'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: امروز چندم است؟
    note: لفظاً «امروز چندمین است؟» — راه معمول پرسیدن تاریخ در آلمانی.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: امروز هفتم جولای است.
    note: 'آلمانی هم مثل دری اول روز و بعد ماه را می‌گوید: *der siebte Juli* = «هفتم جولای». *der siebte Juli* را مثل یک عبارت کامل یاد بگیرین.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: امروز سه‌شنبه، هفتم جولای است.
    note: نام روز هفته را پیش از تاریخ بیاورید و بین‌شان کامه بگذارین.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: شما می‌توانین آن را به شکل 7.7. هم بنویسین.
    note: 'در تاریخ عددی آلمانی اول روز و بعد ماه می‌آید و بعد از هر کدام نقطه گذاشته می‌شود: 7.7. = هفتم جولای.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: تولد شما کی است؟ (رسمی)
    note: لفظاً «کی تولد دارید؟» — آلمانی برای تولد از فعل *haben* (داشتن) کار می‌گیرد.
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: تولد من سوم مارچ است.
    note: '*Mein Geburtstag* = «تولد من»؛ *der dritte März* = «سوم مارچ» (اول روز، بعد ماه).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: باز می‌شود
    note: '*öffnet* شکل سوم شخص مفرد فعل *öffnen* (باز کردن) است — برای «باز می‌شود»، مثلاً دکان یا کتابخانه.'
    example_gloss: دکان روز دوشنبه باز می‌شود.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: دوباره
    note: '*wieder* یعنی «دوباره» — اینجا برای پرسیدن زمان باز شدن دوبارهٔ چیزی به کار رفته است.'
    example_gloss: کتابخانه روز دوشنبه دوباره باز می‌شود.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: حرف تعریف (مؤنث و جمع)
    note: '*die* حرف تعریف برای مؤنث مفرد و همهٔ اسم‌های جمع است — اینجا با اسم مؤنث *Bibliothek* آمده است.'
    example_gloss: کتابخانه بزرگ است.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: کتابخانه
    note: '*Bibliothek* اسم مؤنث است (*die Bibliothek*).'
    example_gloss: من به کتابخانه می‌روم.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: در / روز
    note: '*am* شکل کوتاه‌شدهٔ *an dem* است و پیش از روزهای هفته و تاریخ‌ها می‌آید (*am Montag* = «روز دوشنبه»).'
    example_gloss: روز دوشنبه من کار می‌کنم.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: حرف تعریف (مذکر، حالت مفعولی)
    note: '*den* شکل مفعولی مذکر *der* است. در تاریخ کامل بعد از نام روز می‌آید، مثل *am Donnerstag, den neunten Juli* — در این سطح آن را مثل یک الگوی ثابت یاد بگیرین و حالت دستوری‌اش را تحلیل نکنین. (بعد از *am* گاهی *dem* هم می‌بینین که به همان اندازه درست است.)'
    example_gloss: ما روز پنجشنبه، نهم جولای همدیگر را می‌بینیم.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: نهم
    note: '*neunten* شکل صرف‌شدهٔ عدد ترتیبی *neun* (نُه) است که در تاریخ‌ها می‌آید: *der neunte Juli* در این ساختار تاریخ کامل به *den neunten Juli* تبدیل می‌شود.'
    example_gloss: تولد من نهم جولای است.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix تاریخ را می‌پرسد
    gloss: 'Felix می‌گوید: امروز چندم است؟'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna تاریخ را می‌گوید
    gloss: 'Anna می‌گوید: امروز سه‌شنبه، هفتم جولای است.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix دربارهٔ کتابخانه می‌پرسد
    gloss: 'Felix می‌گوید: کتابخانه کی دوباره باز می‌شود؟'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna جواب می‌دهد
    gloss: 'Anna می‌گوید: روز پنجشنبه، نهم جولای دوباره باز می‌شود.'
    note: '*Sie* اینجا یعنی «آن» — به *die Bibliothek* (اسم مؤنث) برمی‌گردد.'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix خداحافظی می‌کند
    gloss: 'Felix می‌گوید: خوب است، تا پنجشنبه.'
    note: '*bis Donnerstag* = «تا پنجشنبه» — راه معمول گفتن «پنجشنبه می‌بینمت».'
  de.a1.unit04.lesson04.teach.notiz:
    title: یک یادداشت بالای دروازه
    gloss: تا پنجشنبه، نهم جولای بسته است.
    note: '*Geschlossen* یعنی «بسته».'
