course:
  title: آلمانی A1
  description: آلمانی سطح A1 را برای سلام و احوال‌پرسی روزمره و گفتگوهای کوتاه اجتماعی، همراه با توضیحات مفصل به دری بیاموزید.
units:
  de.a1.unit08.einkaufen:
    title: 'خرید: قیمت‌ها و مقدارها'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: یک پوند سیب
    note: '*Pfund* در آلمان هنوز در گفتار روزمره زیاد استفاده می‌شود؛ یک *Pfund* آلمانی دقیقاً ۵۰۰ گرام (نیم کیلو) است، با آن‌که کشور رسماً از سیستم متریک استفاده می‌کند.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: یک درجن تخم
    note: '*Dutzend* یعنی درجن (دوازده تا).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: یک بوتل آب
    note: '*Flasche* یعنی بوتل.'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: یک کیسه برنج
    note: '*Tüte* یعنی کیسه.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: یک کیلو بادرنگ رومی
    note: '*Kilo* واحد معیاری وزن در سیستم متریک است و برای مقدارهای بزرگ‌تر از خرید روزمرهٔ کوچک، خیلی بیشتر از *Pfund* استفاده می‌شود.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: سیب‌ها چند است؟
    note: '*kosten* یعنی «قیمت داشتن» — به معنی تحت‌اللفظی: «سیب‌ها چه قیمت دارند؟»'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: پوندی دو یورو است.
    note: '*Sie* در اینجا یعنی «آن‌ها» (سیب‌ها) و «شما»ی رسمی نیست. *Sie*ی رسمی و *sie*ی جمع («آن‌ها») فعل یکسان (*kosten*) می‌گیرند و در آغاز جمله هر دو با حرف بزرگ نوشته می‌شوند؛ پس فقط از روی معنا فهمیده می‌شود: در اینجا دربارهٔ سیب‌ها صحبت می‌شود، نه دربارهٔ یک شخص.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: لطفاً دو پوند داده می‌توانین؟
    note: یک الگوی درخواست مؤدبانه، مانند *Ich möchte..., bitte* از بخش ۷.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: تازه است؟
    note: '*frisch* یعنی تازه. *es* در اینجا با اسم خنثی (مثل das Brot) می‌آید؛ برای اسم مذکر می‌گویید *Ist er frisch?* (der Reis) و برای اسم مؤنث *Ist sie frisch?* (die Milch) — ضمیر با جنسیت اسم تغییر می‌کند و همیشه *es* نیست.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: در هر پوند
    note: '*pro* یعنی «در هر» — هم روی برچسب قیمت‌ها و هم در گفتار برای گفتن قیمت استفاده می‌شود.'
    example_gloss: سیب در هر پوند دو یورو است.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: تختهٔ قیمت بازار
    note: یک تختهٔ قیمت ساده که سه جنس را با قیمت واحد آن‌ها نشان می‌دهد.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: این هشت یورو می‌شود.
    note: '*Das macht...* روش معمول برای گفتن مجموع قیمت است که در بخش ۷ هم دیده‌اید.'
  de.a1.unit08.lesson04.teach.line01:
    title: فیلیکس قیمت را می‌پرسد
    gloss: 'فیلیکس می‌گوید: سیب‌ها چند است؟'
    note: همان پرسش درس دوم، حالا در یک گفت‌وگوی واقعی.
  de.a1.unit08.lesson04.teach.line02:
    title: آنا قیمت را می‌گوید
    gloss: 'آنا می‌گوید: پوندی دو یورو است.'
    note: در یک جواب کامل، قیمت هر واحد گفته می‌شود.
  de.a1.unit08.lesson04.teach.line03:
    title: فیلیکس سفارش می‌دهد
    gloss: 'فیلیکس می‌گوید: خوب است، لطفاً دو پوند داده می‌توانین؟'
    note: '*Gut* در اینجا یعنی «خوب است/باشه»؛ قبل از سفارش، قیمت را قبول می‌کند.'
  de.a1.unit08.lesson04.teach.line04:
    title: آنا می‌پرسد چیز دیگری می‌خواهد یا نه
    gloss: 'آنا می‌گوید: البته. چیز دیگر؟'
    note: '*Natürlich* یعنی «البته/طبیعتاً».'
  de.a1.unit08.lesson04.teach.line05:
    title: فیلیکس بیشتر سفارش می‌دهد
    gloss: 'فیلیکس می‌گوید: بلی، یک درجن تخم هم.'
    note: '*auch* یعنی «هم/همچنان».'
  de.a1.unit08.lesson04.teach.line06:
    title: آنا مجموع را می‌گوید
    gloss: 'آنا می‌گوید: این هشت یورو می‌شود.'
    note: دو پوند سیب (۴ یورو) به‌علاوهٔ یک درجن تخم (۴ یورو) در مجموع هشت یورو می‌شود.
