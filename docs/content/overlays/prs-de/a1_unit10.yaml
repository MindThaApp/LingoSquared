course:
  title: آلمانی A1
  description: آلمانی سطح A1 را برای سلام و احوال‌پرسی روزمره و گفتگوهای کوتاه اجتماعی، همراه با توضیحات مفصل به دری بیاموزید.
units:
  de.a1.unit10.wegbeschreibungen:
    title: پرسیدن آدرس و دنبال کردن راه
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: به چپ بپیچ.
    note: '*abbiegen* (پیچ شدن) یک فعل جداشدنی است؛ پیشوند *ab* در آخر جمله می‌آید: *Biegen Sie... ab*، نه *Sie biegen ab* و نه *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: به راست بپیچ.
    note: همان الگوی فعل جداشدنی مثل *links abbiegen*، فقط با *rechts* (راست).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: مستقیم برو.
    note: '*geradeaus* یعنی «مستقیم، روبه‌رو» — این‌جا پیشوند جداشدنی نیست و امر رسمی ساده‌تر است.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: همین‌جا توقف کنید.
    note: '*anhalten* (توقف کردن) هم جداشدنی است؛ *an* در آخر جمله می‌آید، مثل *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: کنج، گوشهٔ سرک
    note: '*Ecke* یعنی کنج یا گوشهٔ سرک؛ اسم مؤنث است: *die Ecke*.'
    example_gloss: سر کنج به چپ بپیچید.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: به بانک چطور برسم؟
    note: '*zur* شکل کوتاه *zu der* است (حالت داتیو، مؤنث، die Bank) — مثل *vom* (von + dem) در درس نهم.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: مستقیم بروید، بعد سر کنج به چپ بپیچید.
    note: '*dann* (بعد) دو مرحلهٔ راه را به هم وصل می‌کند؛ *an der Ecke* (سر کنج) از حرف تعریف داتیو مؤنث کار می‌گیرد، مثل الگوی حرف‌های اضافهٔ مکان در درس نهم.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: دور است؟
    note: '*weit* یعنی دور.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: از این‌جا فقط دو دقیقه است.
    note: '*nur* یعنی «فقط».'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: گم کرده نمی‌توانید.
    note: '*verfehlen* یعنی پیدا نکردن، از دست دادن — تحت‌اللفظی: «این را شما نمی‌توانید گم کنید.»'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: اولین سرک را به طرف چپ بگیرین.
    note: '*erste* یعنی «اول» — یک عدد ترتیبی است و پیش از اسم پسوند می‌گیرد.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: دومین سرک را به طرف راست بگیرین.
    note: '*zweite* یعنی «دوم».'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: راهنمایی مسیر تا دواخانه
    note: چند جملهٔ کوتاه نوشتاری برای نشان دادن راه که از عبارت‌های آموخته‌شده ساخته شده است.
  de.a1.unit10.lesson04.teach.line01:
    title: فیلیکس راه را می‌پرسد
    gloss: 'فیلیکس: معذرت می‌خواهم، به بانک چطور برسم؟'
    note: همان آغاز مؤدبانهٔ درس نهم، اما حالا برای پرسیدن مسیر، نه فقط جای یک مکان.
  de.a1.unit10.lesson04.teach.line02:
    title: آنا راه را نشان می‌دهد
    gloss: 'آنا: مستقیم بروید، بعد سر کنج به چپ بپیچید.'
    note: یک جواب کامل دو مرحلهٔ راه را با *dann* به هم وصل می‌کند.
  de.a1.unit10.lesson04.teach.line03:
    title: فیلیکس تأیید می‌کند و بیشتر می‌پرسد
    gloss: 'فیلیکس: سر کنج به چپ بپیچم، خوب. دور است؟'
    note: فیلیکس راه را تکرار می‌کند تا مطمئن شود فهمیده، بعد یک سؤال طبیعی دیگر می‌پرسد.
  de.a1.unit10.lesson04.teach.line04:
    title: آنا دوری راه را می‌گوید
    gloss: 'آنا: نه، از این‌جا فقط دو دقیقه است. گم کرده نمی‌توانید.'
    note: یک جواب کامل و اطمینان‌بخش.
