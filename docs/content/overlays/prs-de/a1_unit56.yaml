    gloss: 'فیلیکس و لینا هر دو حیوانات را دوست دارند، ولی هیچ‌کدام‌شان حیوان خانگی ندارد. فیلیکس سگ‌ها را دوست دارد و لینا گربه‌ها را. یوناس حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به آن غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
