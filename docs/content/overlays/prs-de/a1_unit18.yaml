    title: Was machen Sie beruflich?
    gloss: شما چه کار می‌کنین؟
    note: '*beruflich* پرسش را دربارهٔ کار می‌سازد، نه دربارهٔ فعالیت عمومی.'
  de.a1.unit18.lesson02.teach.buero:
    title: Büro
    gloss: دفتر
    note: '*im Büro* یعنی در دفتر.'
    example_gloss: من در دفتر کار می‌کنم.
  de.a1.unit18.lesson02.teach.arbeite:
    title: Ich arbeite im Cafe.
    gloss: من در کافه کار می‌کنم.
    note: '*arbeite* شکل اول شخص است: کار می‌کنم.'
  de.a1.unit18.lesson02.teach.bringe:
    title: Ich bringe Kaffee und Tee.
    gloss: من قهوه و چای می‌آورم.
    note: '*bringe* یک فعالیت ساده کاری را بیان می‌کند.'
  de.a1.unit18.lesson02.teach.work_profile:
    title: Arbeitsprofile
    gloss: معرفی‌های کاری
    note: این معرفی شغل، محل کار و فعالیت را می‌دهد.
    example_gloss: او در دفتر کار می‌کند.
  de.a1.unit18.lesson02.teach.line01:
    title: آنا دربارهٔ کار می‌پرسد
    gloss: 'آنا: شغل‌تان چیست؟'
    note: یک پرسش مودبانه دربارهٔ کار.
  de.a1.unit18.lesson02.teach.line02:
    title: فیلیکس کارش را توضیح می‌دهد
    gloss: 'فیلیکس: من انجینر استم. در دفتر کار می‌کنم. و شما؟'
    note: فیلیکس شغل و محل کارش را می‌گوید.
    example_gloss: من در دفتر کار می‌کنم.
  de.a1.unit18.lesson02.teach.line03:
    title: آنا کارش در کافه را توضیح می‌دهد
    gloss: 'آنا: من در کافه کار می‌کنم. قهوه و چای می‌آورم.'
    note: آنا محل کارش و کاری را که آنجا می‌کند می‌گوید.
    example_gloss: 'در متن: من قهوه و چای می‌آورم.'
