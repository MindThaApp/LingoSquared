  de.a1.unit06.lesson02.teach.meine_mutter:
    title: meine Mutter
    gloss: مادرم
    note: '*Mutter* مؤنث است، پس «من/ـم» به صورت *meine* می‌آید. ضمیر ملکی با جنسیت اسمی می‌آید که مال کسی است، نه با جنسیت مالک.'
  de.a1.unit06.lesson02.teach.sein_bruder:
    title: sein Bruder
    gloss: برادرش
    note: '*sein* = «او/ـش» (مرد). همان قاعده: اسم مذکر *sein* می‌گیرد (*sein Bruder*) و اسم مؤنث *seine* (*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: پدر شما (رسمی)
    note: '*Ihr* با حرف بزرگ یعنی «شما» در حالت رسمی و با *Sie* جور است. اسم مذکر *Ihr* می‌گیرد (*Ihr Vater*) و اسم مؤنث *Ihre* (*Ihre Mutter*).'
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
    title: Wer ist Ihr Vater?
    gloss: پدر شما کیست؟ (رسمی)
    note: '*Wer* = «کی» یا «کدام شخص».'
  de.a1.unit06.lesson03.teach.das_ist_mein_bruder:
    title: Das ist mein Bruder.
    gloss: این برادرم است.
    note: '*Das ist...* = «این... است» یا «آن... است» — راه آسان برای معرفی کردن کسی.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: او بیست ساله است.
    note: '*Er* = «او» (مرد). سن با همان الگویی گفته می‌شود که در درس ۳ یاد گرفتید: عدد + *Jahre alt*.'
  de.a1.unit06.lesson03.teach.ich_habe_zwei_schwestern:
    title: Ich habe zwei Schwestern.
    gloss: من دو خواهر دارم.
    note: '*Schwestern* جمع *Schwester* است.'
  de.a1.unit06.lesson03.teach.haben_sie_geschwister:
    title: Haben Sie Geschwister?
    gloss: شما خواهر یا برادر دارید؟ (رسمی)
    note: '*Geschwister* یعنی خواهر و برادر باهم؛ آلمانی برای آن یک کلمهٔ روزمره دارد.'
  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: نه، من خواهر و برادر ندارم. من تنها فرزند هستم.
    note: '*keine* = «هیچ / نه». *Einzelkind* = «تنها فرزند»؛ در آلمانی پیش از آن حرف تعریف نمی‌آید: *Ich bin Einzelkind*.'
  de.a1.unit06.lesson04.teach.foto:
    title: Foto
    gloss: عکس
    example_gloss: من یک عکس دارم.
  de.a1.unit06.lesson04.teach.line01:
    title: Felix دربارهٔ عکس می‌پرسد
    gloss: 'Felix می‌گوید: این خانوادهٔ شماست؟'
    note: '*Ihre Familie* — *Familie* مؤنث است، به همین خاطر «شما»ی رسمی *Ihre* می‌شود.'
  de.a1.unit06.lesson04.teach.line02:
    title: Anna والدینش را معرفی می‌کند
    gloss: 'Anna می‌گوید: بلی. این مادرم است و این پدرم.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix می‌پرسد این کی است
    gloss: 'Felix می‌گوید: این کی است؟'
  de.a1.unit06.lesson04.teach.line04:
    title: Anna خواهرش را معرفی می‌کند
    gloss: 'Anna می‌گوید: این خواهرم است. خواهرم معلم است.'
    note: 'در آلمانی پیش از نام شغل حرف تعریف نمی‌آید: *Meine Schwester ist Lehrerin* = «خواهرم معلم است.» *Lehrerin* شکل مؤنث *Lehrer* است.'
  de.a1.unit06.lesson04.teach.line05:
    title: Felix دربارهٔ برادرها می‌پرسد
    gloss: 'Felix می‌گوید: شما برادر دارید؟'
    note: '*Brüder* جمع *Bruder* است.'
  de.a1.unit06.lesson04.teach.line06:
    title: Anna جواب می‌دهد
    gloss: 'Anna می‌گوید: نه. من فقط یک خواهر دارم.'
    note: '*nur* = «فقط».'
  de.a1.unit06.lesson04.teach.bildunterschrift:
    title: نوشتهٔ زیر یک عکس
    gloss: 'خانوادهٔ من: مادرم، پدرم و خواهرم.'
