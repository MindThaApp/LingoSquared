  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: من چای را دوست دارم.
    note: '*ich mag* یعنی «من دوست دارم».'
    example_gloss: 'در جمله: بلی، من قهوه را دوست دارم.'
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: من قهوه را دوست ندارم.
    note: در آلمانی، *nicht* در اینجا بعد از چیزی می‌آید که دوست ندارین، نه مستقیم بعد از *ich*.
    example_gloss: 'در جمله: من چای را دوست ندارم.'
  de.a1.unit14.lesson01.teach.lieber:
    title: lieber
    gloss: ترجیحاً / ترجیح دادن
    note: '*lieber* ترجیح میان چند گزینه را بیان می‌کند.'
    example_gloss: 'در جمله: ترجیح می‌دهم چای بنوشم.'
  de.a1.unit14.lesson01.teach.nehmen:
    title: Ich nehme Wasser.
    gloss: من آب می‌گیرم.
    note: '*nehmen* وقتی طبیعی است که چیزی را انتخاب می‌کنین.'
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: شما چی می‌گیرین؟
    note: پرسش رسمی با *Sie* برای دانستن انتخاب کسی؛ در جواب *ich nehme* می‌آید.
    example_gloss: شما چی می‌گیرین؟ من آب می‌گیرم.
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: اما
    note: '*aber* تضاد را وصل می‌کند.'
    example_gloss: 'در جمله: من قهوه را دوست دارم، اما ترجیح می‌دهم چای بنوشم.'
  de.a1.unit14.lesson02.teach.preference_text:
    title: Vorlieben im Cafe
    gloss: ترجیح‌ها در کافه
    note: این متن کوتاه انتخاب‌های آنا و فیلیکس را با هم مقایسه می‌کند.
    example_gloss: او آب می‌گیرد.
  de.a1.unit14.lesson02.teach.line01:
    title: فیلیکس درباره‌ی قهوه می‌پرسد
    gloss: 'فیلیکس: شما قهوه را دوست دارید؟'
    note: یک پرسش مستقیم درباره‌ی ترجیح.
  de.a1.unit14.lesson02.teach.line02:
    title: آنا ترجیح خود را می‌گوید
    gloss: 'آنا: بلی، قهوه را دوست دارم، اما چای را ترجیح می‌دهم.'
    note: آنا قهوه را دوست دارد، اما چای را ترجیح می‌دهد.
    example_gloss: 'در جمله: ترجیح می‌دهم چای بنوشم.'
  de.a1.unit14.lesson02.teach.line03:
    title: فیلیکس آب را انتخاب می‌کند
    gloss: 'فیلیکس: من چای را دوست ندارم. آب می‌گیرم.'
    note: فیلیکس اول چیزی را که دوست ندارد می‌گوید و بعد انتخابش را.
    example_gloss: 'در جمله: من آب می‌گیرم.'
  de.a1.unit14.lesson02.teach.line04:
    title: آنا چای را انتخاب می‌کند
    gloss: 'آنا: خوب، من چای می‌گیرم.'
    note: آنا انتخابش را تأیید می‌کند.
    example_gloss: 'در جمله: من چای می‌گیرم.'
