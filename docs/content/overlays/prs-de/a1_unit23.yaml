    gloss: پیام کوتاه
    note: پیام، وقت و جای ملاقات را تأیید می‌کند.
    example_gloss: ما ساعت نُه ملاقات می‌کنیم.
  de.a1.unit23.lesson02.teach.line01:
    title: Anna تلیفون را جواب می‌دهد
    gloss: 'Anna: سلام، این Anna است.'
    note: Anna تلیفون را جواب می‌دهد و نامش را می‌گوید.
    example_gloss: سلام، این Anna است.
  de.a1.unit23.lesson02.teach.line02:
    title: Felix دلیل تلیفونش را می‌گوید
    gloss: 'Felix: روز بخیر، Anna. من دربارهٔ ملاقات تلیفون می‌کنم. ما ساعت نُه جلو کافه ملاقات می‌کنیم.'
    note: Felix می‌گوید چرا تلیفون می‌کند و وقت و جای ملاقات را می‌دهد.
    example_gloss: من دربارهٔ ملاقات تلیفون می‌کنم.
  de.a1.unit23.lesson02.teach.line03:
    title: Anna از Felix می‌خواهد که تکرار کند
    gloss: 'Anna: معذرت می‌خواهم، لطفاً می‌توانین این را تکرار کنید؟'
    note: Anna از Felix می‌خواهد معلومات را تکرار کند.
    example_gloss: معذرت می‌خواهم، لطفاً می‌توانین این را تکرار کنید؟
  de.a1.unit23.lesson02.teach.line04:
    title: Felix جزئیات را تکرار می‌کند
    gloss: 'Felix: بلی. ما ساعت نُه جلو کافه ملاقات می‌کنیم.'
    note: Felix وقت و جای ملاقات را تکرار می‌کند.
    example_gloss: ما ساعت نُه ملاقات می‌کنیم.
  de.a1.unit23.lesson02.teach.line05:
    title: Anna وعدهٔ یک پیام را می‌دهد
    gloss: 'Anna: تشکر. من برای شما یک پیام می‌نویسم.'
    note: Anna می‌گوید که یک پیام می‌نویسد.
    example_gloss: من برای شما یک پیام می‌نویسم.
