units:
  de.a1.unit09.orte:
    title: جاهای معمول و موقعیت‌ها
teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: بانک
    note: '*Bank* یعنی بانک — اسم مؤنث است، *die Bank*.'
    example_gloss: باید به بانک بروم.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: شفاخانه
    note: '*Krankenhaus* در اصل یعنی «خانهٔ مریض‌ها» -- اسم خنثی است: *das Krankenhaus*.'
    example_gloss: دوستم در شفاخانه است.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: دواخانه
    note: '*Apotheke* یعنی دواخانه -- اسم مؤنث است: *die Apotheke*.'
    example_gloss: دواخانه امروز باز است.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: پارک
    note: '*Park* یعنی پارک -- اسم مذکر است: *der Park*.'
    example_gloss: ما دوست داریم در پارک قدم بزنیم.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: رستورانت
    note: '*Restaurant* یعنی رستورانت -- اسم خنثی است: *das Restaurant*.'
    example_gloss: غذای این رستورانت خوب است.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: دواخانه پهلوی پارک است.
    note: '*neben* یعنی «پهلوی». این حرف اضافه دو حالت دارد؛ وقتی جای ثابت را نشان بدهد (مثل اینجا)، بعدش حالت داتیف می‌آید، به همین خاطر *der Park* (مذکر) به *dem Park* تبدیل می‌شود.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: دواخانه روبروی شفاخانه است.
    note: '*gegenüber von* یعنی «روبروی». *vom* شکل کوتاه‌شدهٔ معمول *von dem* است (داتیف خنثی، *das Krankenhaus*) و هم در گفتار و هم در نوشتار استفاده می‌شود.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: دواخانه بین بانک و پارک است.
    note: '*zwischen* یعنی «بین». به هر دو شکل داتیف دقت کنید: *der Bank* (مؤنث) و *dem Park* (مذکر).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: رستورانت پشت بانک است.
    note: '*hinter* یعنی «پشت» -- *der Bank* شکل داتیف مؤنث است.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: پارک پیش روی شفاخانه است.
    note: '*vor* یعنی «پیش روی» -- *dem Krankenhaus* شکل داتیف خنثی است.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: بانک کجاست؟
    note: '*Wo ist...?* روش معمول برای پرسیدن جای یک چیز است.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: آن پهلوی پارک است.
    note: '*Sie* در اینجا یعنی «آن» (اشاره به *die Bank*، مؤنث). فقط به خاطر اینکه اول جمله آمده، با حرف بزرگ نوشته شده. فعل *ist* نشان می‌دهد که این Sie ضمیر احترام نیست؛ ضمیر احترام با *Sie sind* می‌آید.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: از اینجا دور است؟
    note: '*weit* یعنی دور. *es* در اینجا به وضعیت اشاره می‌کند و به جنس هیچ اسم مشخصی بستگی ندارد.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: نه، دور نیست.
    note: '*nicht* صفت *weit* را منفی می‌کند.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: معذرت می‌خواهم، دواخانه کجاست؟
    note: '*Entschuldigung* را پیشتر به معنی «معذرت» خوانده بودید -- اینجا برای شروع مؤدبانهٔ یک سوال آمده است.'
  de.a1.unit09.lesson04.teach.line01:
    title: فیلیکس راه را می‌پرسد
    gloss: 'فیلیکس می‌گوید: معذرت می‌خواهم، دواخانه کجاست؟'
    note: همان شروع مؤدبانهٔ عبارت بالا، این بار در یک گفتگوی واقعی.
  de.a1.unit09.lesson04.teach.line02:
    title: آنا جای دواخانه را می‌گوید
    gloss: 'آنا می‌گوید: روبروی شفاخانه است.'
    note: جواب کامل، جای دواخانه را نسبت به یک نشانهٔ شناخته‌شده می‌گوید.
  de.a1.unit09.lesson04.teach.line03:
    title: فیلیکس فاصله را می‌پرسد
    gloss: 'فیلیکس می‌گوید: از اینجا دور است؟'
    note: وقتی سمت کلی را دانستید، این سوال بعدیِ طبیعی است.
  de.a1.unit09.lesson04.teach.line04:
    title: آنا دربارهٔ فاصله جواب می‌دهد
    gloss: 'آنا می‌گوید: نه، دور نیست. بین بانک و پارک است.'
    note: جواب کامل اول خاطر را جمع می‌کند که دور نیست، بعد یک نشانهٔ دقیق‌تر هم می‌دهد.
