teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: سعيد وحزين وغاضب
    gloss: سعيد، حزين، غاضب
    note: '*खुश* و*उदास* و*नाराज़* كلمات مشاعر أساسية تأتي مع *हूँ* أو *है* ("أنا/هو"، فعل الكينونة)؛ ولا تتغير بحسب الجنس.'
    example_gloss:
    - أنا سعيد.
    - أنا حزين.
    - أنا غاضب.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: قول إنك سعيد
    gloss: أنا سعيد.
    note: 'تتبع *मैं खुश हूँ* النمط: *मैं* + كلمة الشعور + *हूँ*.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: المقارنة بين مشاعر
    gloss: لست غاضبًا، أنا حزين.
    note: 'تأتي *नहीं* قبل *हूँ* مباشرة: *नाराज़ नहीं हूँ*. ثم يذكر الجزء الثاني الشعور الحقيقي.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: السؤال عن السبب
    gloss: لماذا أنت سعيد؟
    note: 'تأتي *क्यों* ("لماذا") قبل الكلمة الأساسية: *तुम खुश क्यों हो?*. و*तुम* ضمير المخاطب غير الرسمي.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: ذكر السبب
    gloss: أنا سعيد لأن لدي شقة جديدة.
    note: '*क्योंकि* تقدّم السبب. و*मेरे पास ... है* تعني "لديّ"، ويأتي الفعل *है* في النهاية.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: سبب سلبي
    gloss: أنا حزين لأن المطر يهطل.
    note: '*बारिश हो रही है* تعني "إنها تمطر" (حرفيًا: "المطر يحدث").'
  hi.a1.unit27.lesson03.teach.narvas:
    title: متوتر
    gloss: متوتر
    note: الكلمة المعتادة للتعبير عن التوتر.
    example_gloss: أنا متوتر قبل أول مناوبة لي.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: ذكر سبب توترك
    gloss: أنا متوتر قبل أول مناوبة لي.
    note: '*को लेकर* تعني "بشأن" وتأتي بعد الاسم: *शिफ़्ट को लेकर*. و*अपनी* ("الخاصة بي") تتفق مع *शिफ़्ट* المؤنثة.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: طمأنة شخص ما
    gloss: لا تقلق.
    note: '*चिंता मत करो* عبارة ودّية بمعنى "لا تقلق": *मत* + *करो* هو الأمر مع *तुम* بصيغة النهي.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: السؤال عن شعور شخص ما
    gloss: كيف يشعر أرجون؟
    note: '*कैसा महसूस कर रहा है* تسأل "كيف يشعر". و*कैसा* تتفق مع الشخص، فتقول للمرأة *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: وصف شعور شخص ما
    gloss: إنه يشعر بالتوتر.
    note: 'لا توجد في الهندية كلمة منفصلة لـ"نفسه" هنا: *वह नर्वस महसूस कर रहा है* تستخدم ببساطة *वह* و*रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: السؤال عن سبب شعور شخص ما
    gloss: لماذا يشعر بالتوتر؟
    note: 'تأتي *क्यों* قبل عبارة الفعل مباشرة: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: اقرأ رسالة عن المشاعر
    gloss: مرحبًا بريا، أنا متوتر قليلًا بشأن نوبتي الأولى وحدي. لكنني سعيد أيضًا لأن لديّ وظيفة جديدة وشقة جديدة. أظن أن كل شيء سيكون على ما يرام.
    note: تتبّع سبب توتر الكاتب، وما يسعده، ونظرته العامة.
    glosses:
      थोड़ा: قليلًا
      नर्वस: متوتر
      पहली: أول
      शिफ़्ट: مناوبة
      अकेले: وحده
      खुश: سعيد
      क्योंकि: لأن
      नई: جديد
      नौकरी: عمل
      नया: جديد
      फ़्लैट: شقة
      लगता: يظن
      होगा: سيكون على ما يرام
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: بريا تسأل أرجون عن شعوره
    gloss: 'بريا: مرحبًا أرجون، كيف تشعر بشأن نوبتك الأولى؟'
    note: 'تُستخدم *को लेकर* مرة أخرى: *अपनी पहली शिफ़्ट को लेकर* ("بشأن نوبتك الأولى"). و*तुम* غير رسمي.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: أرجون يعترف بتوتره
    gloss: 'أرجون: بصراحة، أنا متوتر قليلًا.'
    note: '*सच कहूँ तो* ("إن قلت الحقيقة") تخفف وقع الاعتراف.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: بريا تطمئنه
    gloss: 'بريا: لا تقلق، يمكنك أن تفعل ذلك بشكل جيد!'
    note: '*तुम यह अच्छे से कर सकते हो* تعني "يمكنك أن تفعل هذا جيدًا"، و*अच्छे से* تعني "جيدًا".'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: أرجون يشكرها
    gloss: 'أرجون: شكرًا، هذا يساعدني حقًا.'
    note: '*इससे मदद मिलती है* حرفيًا "من هذا تُنال مساعدة": يُشار إلى مصدر العون بـ *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: بريا تتوقع النتيجة
    gloss: 'بريا: وبعد ذلك ستكون بالتأكيد سعيدًا جدًا وفخورًا.'
    note: '*ज़रूर* ("بالتأكيد") تجعل التوقع واثقًا، و*तुम्हें गर्व होगा* تعني "ستشعر بالفخر".'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: أرجون يوافق
    gloss: 'أرجون: نعم، أظن ذلك أنا أيضًا.'
    note: '*मुझे भी ऐसा ही लगता है* ("يبدو لي أنا أيضًا هكذا") طريقة طبيعية للموافقة، و*मुझे* يحدد من يشعر بذلك.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'الضمائر: उसकी'
    gloss: أرجون متوتر. بريا تساعده.
    note: '*उसकी* تعني "له" أو "لها" وتتفق مع *मदद* المؤنثة، فـ *उसकी मदद करना* تعني "مساعدته"؛ و*है* و*करती है* فعلان للغائب.'
