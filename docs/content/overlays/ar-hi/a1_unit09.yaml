teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'مراجعة: الأماكن'
    gloss: بنك، مدرسة، مستشفى، حديقة، محطة، مكتب بريد
    note: مراجعة سريعة لكلمات الأماكن من الوحدة السابقة -- تعيد هذه الوحدة استخدامها كثيرًا.
    example_gloss:
    - البنك هنا.
    - مكتب البريد قرب البنك.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'مراجعة: يكون، أين، هنا، هناك، من، الإضافة، حسنًا'
    gloss: يكون، أين، هنا، هناك، من، الإضافة (لـ/ـه)، حسنًا
    note: مراجعة سريعة لكلمات وظيفية صغيرة من الوحدات السابقة تعيد تمارين هذه الوحدة استخدامها.
    example_gloss:
    - أين البنك؟
    - الحديقة هناك.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: مستقيم، يسار، يمين
    gloss: إلى الأمام مباشرة، يسار، يمين
    note: كلمات الاتجاه الثلاث الأساسية في هذه الوحدة.
    example_gloss:
    - سر إلى الأمام مباشرة.
    - انعطف يسارًا.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: اذهب!، انعطف!
    gloss: اذهب!، انعطف! (أمر غير رسمي)
    note: أوامر بصيغة tum -- وهي الصيغة الطبيعية بين صديقين يشرح أحدهما للآخر الطريق.
    example_gloss:
    - سر إلى الأمام مباشرة.
    - انعطف يمينًا.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: اذهب مستقيمًا من هنا
    gloss: اذهب مستقيمًا من هنا.
    note: تجمع كلمات هذا الدرس الجديدة مع 'yahaan se' (من هنا).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: انعطف يسارًا
    gloss: انعطف يسارًا.
    note: أمر قائم بذاته، جاهز للاستخدام وحده.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: انعطف يمينًا
    gloss: انعطف يمينًا.
    note: الأمر المقابل للأمر 'baaen muro'.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: نهاية الأمر -o
    gloss: '''Jaao'' و''muro'' أمران بصيغة tum، مثل ''bataao'' و''gino'' -- وكلها تنتهي بـ ''-o''.'
    note: تُبرز النمط المشترك للأوامر غير الرسمية مع كلمتين سبق تعلمهما في وحدتين سابقتين (bataao في الوحدة 7، وgino في الوحدة 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: كيف أصل إلى المصرف؟
    gloss: كيف أصل إلى البنك؟
    note: السؤال الأساسي للاستفسار عن الطريق، بصيغة المتكلم «كيف أذهب؟».
  hi.a1.unit09.lesson02.teach.tak:
    title: حتى
    gloss: حتى
    note: سبق أن ظهرت في الوحدة 2 في العدّ ('«zero se das tak»')، وتُستخدم هنا بمعناها المكاني الحقيقي أيضًا.
    example_gloss: اذهب مستقيمًا حتى البنك.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: اذهب مستقيمًا حتى البنك
    gloss: اذهب مستقيمًا حتى البنك.
    note: جملة مثال تستخدم 'tak' بمعناها المكاني.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: أولًا، ثم
    gloss: أولًا، ثم
    note: زوج من الكلمات يُستخدم لترتيب خطوتين في الاتجاهات.
    example_gloss:
    - اذهب أولًا إلى الأمام مباشرة.
    - ثم انعطف يسارًا.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: أولًا مستقيمًا، ثم يسارًا
    gloss: اذهب أولًا إلى الأمام مباشرة، ثم انعطف يسارًا.
    note: تجمع 'pahle' و'phir' في تعليمة واحدة من خطوتين.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle وphir
    gloss: '''Pahle'' و''phir'' تربطان بين خطوتين -- الفعل الأول مع ''pahle'' والثاني مع ''phir''، مثل ''pahle seedhe jaao, phir baaen muro.'''
    note: نقطة نحوية حقيقية ومفيدة حول ترتيب الإرشادات متعددة الخطوات.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: ناصية الشارع
    gloss: زاوية الشارع
    note: كلمة مكان جديدة لحوار ختام هذا الدرس، وتُستعمل مع 'par' (عند/على).
    example_gloss:
    - البنك عند الزاوية.
    - الحديقة خلف المدرسة.
  hi.a1.unit09.lesson03.teach.bas:
    title: فقط
    gloss: فقط
    note: وهي أيضًا كلمة دخيلة شائعة بمعنى «الحافلة» (وسيلة النقل)، لكن هذا المعنى لا يُدرَّس في هذه الدورة، فلا لبس هنا.
    example_gloss: فقط تقدّم قليلًا.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: فهمت
    gloss: فهمت
    note: 'عبارة شائعة من كلمتين: ''samajh'' (جذر الفعل ''samajhna'' أي «فهم») و''gaya'' (ذهب) الذي يدل على أن الفعل قد تمّ. هذه صيغة المذكر -- أما بريا فتقول ''samajh gayi''.'
    example_gloss: فهمت. / تمام.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: حسنًا! شكرًا جزيلًا!
    gloss: حسنًا! شكرًا جزيلًا!
    note: تُعيد استعمال 'accha' و'bahut' و'shukriya' من الوحدات السابقة.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: لا مشكلة! إلى اللقاء.
    gloss: لا مشكلة! إلى اللقاء.
    note: عبارة الختام المعتادة في هذه الدورة، وهي مأخوذة حرفيًا من الوحدة 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: أرجون يسأل عن مكتب البريد
    gloss: أرجون يسأل بريا عن طريق الوصول إلى مكتب البريد.
    note: تُعيد نمط السؤال الذي بدأ به الدرس الثاني.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: بريا تبدأ في شرح الطريق
    gloss: 'تقول بريا: من هنا، اذهب أولًا مباشرة إلى الأمام.'
    note: تُعيد استعمال 'yahaan se' و'pahle' من هذه الوحدة.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: أرجون يسأل عن الخطوة التالية
    gloss: 'يقول أرجون: حسنًا، ثم يسأل: وبعد ذلك؟'
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: بريا تتابع
    gloss: 'تقول بريا: ثم انعطف يسارًا عند زاوية البنك.'
    note: تقدّم كلمة 'nukkad' (زاوية الشارع) ضمن سياقها.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: أرجون يؤكد ويسأل مجددًا
    gloss: 'يكرر أرجون كلمة «يسارًا»، ويؤكد أنه فهم، ثم يسأل: وبعد ذلك؟'
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: بريا تُنهي الطريق الأول
    gloss: 'تقول بريا: تقدّم قليلًا فقط -- مكتب البريد هناك، قرب البنك.'
    note: تقدّم كلمة 'bas' (فقط)، وتتوافق مع ما ورد في الوحدة 8 من أن مكتب البريد قرب البنك.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: أرجون يفهم ويسأل عن الحديقة
    gloss: يقول أرجون إنه فهم، ثم يسأل كيف يصل إلى الحديقة.
    note: تقدّم التعبير 'samajh gaya'.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: بريا تشرح الطريق الثاني
    gloss: 'تقول بريا: الحديقة؟ اذهب أولًا مباشرة إلى الأمام، ثم انعطف يمينًا -- الحديقة خلف المدرسة.'
    note: تتوافق مع ما ورد في الوحدة 8 من أن الحديقة خلف المدرسة.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: أرجون يشكر بريا
    gloss: يقول أرجون إنه فهم، ويشكر بريا جزيل الشكر.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: بريا تختم الحوار
    gloss: 'تقول بريا: لا مشكلة، إلى اللقاء.'
    note: هذه هي عبارة الختام نفسها في حوار الوحدة 8، وقد أُعيدت حرفيًا.
