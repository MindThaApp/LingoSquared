    - أعود في المساء.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: آكل الطعام
    gloss: آكل الطعام (المتكلم رجل / المتكلمة امرأة)
    note: '''Khana'' الاسم (الطعام، من الوحدة 6) و''khana'' الفعل (يأكل): تكرار طبيعي في الهندية وليس خطأ مطبعيًا.'
    example_gloss:
    - آكل الطعام في الليل.
    - آكل الطعام في الليل.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: العشاء
    gloss: 'العشاء (حرفيًا: «طعام الليل»)'
    note: يعيد استخدام 'raat' (الليل) و'ka' (للإضافة) و'khana' (الطعام)، وكلها سبق تعلّمها.
