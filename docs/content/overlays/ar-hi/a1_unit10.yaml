    note: يعيد استخدام 'pahle'/'phir' (أولًا/ثم) من ترتيب الاتجاهات في الوحدة 9 لترتيب خطوات الروتين.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: kaam par مقابل school
    gloss: تحتاج 'kaam par jaana' (الذهاب إلى العمل) إلى 'par'، أما 'school jaana' (الذهاب إلى المدرسة) فلا تحتاج إلى كلمة إضافية، وكلتاهما صحيحة وشائعة.
    note: فرق اصطلاحي حقيقي، وليس قاعدة عامة لها استثناء.
