teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'مراجعة: الساعة، الصباح، الظهيرة، المساء، الليل، في'
    gloss: الساعة، الصباح، الظهيرة، المساء، الليل، في/عند (للوقت عمومًا)
    note: مراجعة سريعة لكلمات الوقت من الوحدة 4، فهذه الوحدة تستخدمها كثيرًا.
    example_gloss:
    - الساعة الآن الثامنة صباحًا.
    - لا يوجد درس في الليل.
  hi.a1.unit10.lesson01.teach.uthna:
    title: أستيقظ
    gloss: أستيقظ (المتكلم رجل / المتكلمة امرأة)
    note: أول فعل في المضارع الاعتيادي في هذه الوحدة. يوسّع النمط -ta/-tee الذي ظهر في الوحدة 5 (rahta hai/rahtee hai) ليشمل المتكلم، مع hoon.
    example_gloss:
    - أستيقظ في السابعة صباحًا.
    - أستيقظ في السادسة صباحًا.
  hi.a1.unit10.lesson01.teach.roz:
    title: كل يوم
    gloss: كل يوم
    note: ظرف جديد لوصف الروتين.
    example_gloss: أستيقظ في الصباح كل يوم.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: أتناول الفطور
    gloss: أتناول الفطور (المتكلم رجل / المتكلمة امرأة)
    note: كلمة 'nashta' (الفطور) تأتي مع 'karta/kartee hoon' (أفعل).
    example_gloss:
    - في الصباح أتناول الفطور.
    - في الصباح أتناول الفطور.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: أذهب إلى العمل
    gloss: أذهب إلى العمل (المتكلم رجل / المتكلمة امرأة)
    note: تحتاج عبارة 'kaam par jaana' (الذهاب إلى العمل) إلى كلمة 'par' (على/عند)، وهي عبارة ثابتة، بخلاف 'school jaana' لاحقًا في هذه الوحدة التي لا تحتاج إلى كلمة إضافية.
    example_gloss:
    - ثم أذهب إلى العمل.
    - ثم أذهب إلى العمل.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: نمط المضارع الاعتيادي
    gloss: 'لوصف عادة يومية يأخذ الفعل -ta/-tee/-te، وتُضاف hoon/ho/hai/hain بحسب الفاعل: أنا أستيقظ (رجل/امرأة) ''hoon''، أنت تستيقظ ''ho''، هو/هي يستيقظ/تستيقظ ''hai''، هم يستيقظون ''hain''.'
    note: يعرض النمط كاملًا من البداية (وقد ظهر عرضًا في حوار الوحدة 1، وتناولناه للغائب في الوحدة 5)، حتى لا تطلب تمارين هذا الدرس من المتعلم تخمين صيغة لم تُشرح.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: صباحي خطوة بخطوة
    gloss: أستيقظ في السابعة كل صباح، ثم أتناول الفطور، ثم أذهب إلى العمل.
    note: يجمع أفعال الروتين الثلاثة في هذا الدرس في جملة واحدة متسلسلة طبيعية.
  hi.a1.unit10.lesson02.teach.sona:
    title: أنام
    gloss: أنام (المتكلم رجل / المتكلمة امرأة)
    note: النمط نفسه -ta/-tee + hoon مطبّقًا على فعل جديد.
    example_gloss:
    - أنام في الحادية عشرة ليلًا.
    - أنام في العاشرة ليلًا.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: أذهب إلى المدرسة
    gloss: أذهب إلى المدرسة (المتكلم رجل / المتكلمة امرأة)
    note: بخلاف 'kaam par jaana'، لا تحتاج 'school jaana' إلى كلمة إضافية قبل 'jaana'.
    example_gloss:
    - أذهب إلى المدرسة في الثامنة كل صباح.
    - أذهب إلى المدرسة في الثامنة كل صباح.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'صيغة tum: -te/-tee + ho'
    gloss: 'مع ''tum'' (أنت، للمخاطب غير الرسمي) يأخذ الفعل -te/-tee مع ''ho'': تستيقظ (تسأل رجلًا) / تستيقظين (تسأل امرأة)، تنام (تسأل رجلًا) / تنامين (تسأل امرأة).'
    note: الجزء الخاص بالمخاطب من النمط نفسه الذي قُدّم في الدرس الأول.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: جنس مَن تطابقه صيغة tum؟
    gloss: 'يطابق فعل صيغة tum جنسَ الشخص المخاطَب لا جنسَ المتكلم؛ فعند سؤال بريا: ''متى تستيقظين؟'' (صيغة المؤنث)، وعند سؤال أرجون: ''متى تستيقظ؟'' (صيغة المذكر).'
    note: نقطة يسهل إغفالها، وقد روجعت على كل جملة بصيغة tum في حوار الدرس الثالث.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: متى تستيقظ؟
    gloss: متى تستيقظ؟ (لرجل)
    note: سؤال جاهز للاستخدام بصيغة tum الجديدة في هذا الدرس.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
