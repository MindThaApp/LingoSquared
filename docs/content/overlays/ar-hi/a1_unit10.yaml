  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: أرجون يسأل بريا متى تستيقظ
    gloss: أرجون يسأل بريا في أي ساعة تستيقظ كل يوم.
    note: يستخدم صيغة tum المؤنثة لمخاطبة بريا بشكل صحيح.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: بريا تجيب
    gloss: 'تقول بريا: أستيقظ في السادسة كل صباح. ثم أتناول الفطور.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: أرجون يحكي روتينه
    gloss: 'يقول أرجون: رائع! أنا أستيقظ في السابعة. وأنا أيضًا أتناول الفطور، ثم أذهب إلى العمل.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: بريا تسأل متى يعود أرجون
    gloss: بريا تسأل أرجون متى يعود.
    note: يستخدم صيغة tum المذكرة لمخاطبة أرجون بشكل صحيح، ويقدّم 'vaapas aana' في سياقها.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: أرجون يصف مساءه
    gloss: 'يقول أرجون: أعود في السادسة مساءً. ثم أتناول العشاء، ثم أنام.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: بريا تصف مساءها
    gloss: 'تقول بريا: وأنا أيضًا أعود في المساء، ثم آكل.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: أرجون يسأل بريا متى تنام
    gloss: أرجون يسأل بريا في أي ساعة تنام.
    note: صيغة tum المؤنثة مرة أخرى لمخاطبة بريا بشكل صحيح.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: بريا تجيب وتختم
    gloss: 'تقول بريا: أنام في الحادية عشرة ليلًا. حسنًا، نلتقي غدًا!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: أرجون يختم
    gloss: 'يقول أرجون: حسنًا، نلتقي مرة أخرى!'
