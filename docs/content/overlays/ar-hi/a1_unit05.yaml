teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: العائلة
    gloss: عائلة
    note: الكلمة العامة للعائلة، وتُستعمل في هذه الوحدة كلها.
    example_gloss: عائلتي في الهند.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: الأب، الأم
    gloss: الأب، الأم
    note: كلتاهما تأخذ صيغة الجمع للاحترام *hain* بدل *hai* عند تقديمهما، وتأتي *pita* مع *mere* بدل *mera* -- انظر ملاحظة الاحترام لاحقًا في هذا الدرس.
    example_gloss:
    - هذا أبي.
    - هذه أمي.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: الأخ، الأخت
    gloss: أخ، أخت
    note: 'الزوج الأساسي في هذه الوحدة لمقابلة mera/meri في المطابقة: *mera bhai*، *meri behan*.'
    example_gloss:
    - لدي أخ.
    - لدي أخت.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek للدلالة على التنكير
    gloss: 'تعني *Ek* «واحد» عند العدّ، وتُستعمل أيضًا للدلالة على التنكير: *mera ek bhai hai*.'
    note: هي الكلمة نفسها التي تعلّمناها رقمًا للعدد 1 -- فليس في الهندية أداة تنكير مستقلة.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: الوالدان
    gloss: الوالدان
    note: مركّب من *mata* (الأم، بصيغة رسمية) و*pita* (الأب) -- وهو الكلمة المعتادة لـ «الوالدين».
    example_gloss: والداي يعيشان في دلهي.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera أم meri
    gloss: 'تأتي *Mera* مع الكلمات المذكرة، و*meri* مع الكلمات المؤنثة: *mera bhai*، *meri behan*.'
    note: هذه هي القاعدة الأساسية في الوحدة -- فصيغة الملكية تتفق مع الشخص أو الشيء المملوك، لا مع المتكلم.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere للكبار الموقّرين
    gloss: 'احترامًا للكبار تتحول *mera* إلى *mere* وتتحول *hai* إلى *hain*، حتى لو كان المقصود شخصًا واحدًا: *yeh mere pita hain* (هذا والدي).'
    note: هذه قاعدة عرفية صحيحة وليست خطأً -- فالكبار الموقّرون من أفراد العائلة (الأب، الجد) يأخذون هذه الصيغة التي تشبه الجمع. أما الأمهات والجدات فتبقى معهن *meri* لكن يأتي الفعل بصيغة الجمع (*hain*) للسبب نفسه.
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: هذا أخي
    gloss: هذا أخي.
    note: الصيغة المذكرة البسيطة -- ولا حاجة إلى صيغة الاحترام مع الأخ.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: هذه أختي
    gloss: هذه أختي.
    note: الصيغة المؤنثة البسيطة، وهي تتفق مع *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: من هذا؟
    gloss: من هذا؟
    note: سؤال بسيط ومفيد للتعريف بأفراد العائلة.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: الجد والجدة من جهة الأب
    gloss: الجد من جهة الأب، الجدة من جهة الأب
    note: المقصود والدا أبيك تحديدًا — انظر الملاحظة لاحقًا في هذا الدرس التي تقارن بينهما وبين والدَي أمك.
    example_gloss:
    - جدي يعيش في دلهي.
    - جدتي تعيش في دلهي.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: الجد والجدة من جهة الأم
    gloss: الجد من جهة الأم، الجدة من جهة الأم
    note: المقصود والدا أمك — تستخدم الهندية زوج كلمات مختلفًا تمامًا عن الذي تستخدمه لوالدَي أبيك.
    example_gloss:
    - جدي (والد أمي) يعيش في مومباي.
    - جدتي (والدة أمي) تعيش في مومباي.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: دلهي، مومباي
    gloss: دلهي، مومباي
    note: مدينتان هنديتان كبيرتان، تُستخدمان في أمثلة هذا الدرس للحديث عن مكان إقامة أفراد العائلة.
    example_gloss:
    - عائلتي تعيش في دلهي.
    - أخي يعيش في مومباي.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: زوجان من الأجداد
    gloss: 'والدا الأب: *dada-dadi*. والدا الأم: *nana-nani*.'
    note: في العربية يُقال «جد» و«جدة» لكلا الجانبين ويُوضَّح الجانب بالإضافة (جدي من جهة الأب)، أما في الهندية فلكل جانب من العائلة كلمات مستقلة تمامًا.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: يعيش (rehna)
    gloss: يعيش / تعيش (للمذكر / للمؤنث / للتوقير والجمع)
    note: فعل «العيش / السكن» — *rehta hai* للرجل، و*rehti hai* للمرأة، و*rehte hain* لأكثر من شخص أو لكبير يُحترم.
    example_gloss:
    - أخي يعيش في دلهي.
    - أختي تعيش في مومباي.
    - أجدادي يعيشون في دلهي.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: ـك (غير رسمي)
    gloss: لك / ـك (غير رسمي، للمذكر / للمؤنث)
    note: صيغة الملكية في أسلوب *tum* غير الرسمي، وتتفق مع الاسم المملوك تمامًا مثل *mera/meri*.
    example_gloss:
    - أين يسكن أخوك؟
    - أين تعيش أختك؟
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: mera وtumhara معًا
    gloss: 'تأتي *mera* و*tumhara* مع الكلمات المذكرة، وتأتي *meri* و*tumhari* مع الكلمات المؤنثة: *mera bhai*/*tumhara bhai*، *meri behan*/*tumhari behan*.'
    note: نمط التوافق نفسه من الدرس الأول، ونرى الآن أنه ينطبق على *tumhara* أيضًا.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: أكبر سنًا / كبير
    gloss: أكبر، كبير (للمذكر / للمؤنث)
    note: تدل الهندية على الأخ أو الأخت الأكبر سنًا بصفة تتفق مع المذكر والمؤنث، بدل كلمة مستقلة؛ وهذا يشبه العربية في استخدام الصفة (الأخ الأكبر)، لكن الصفة الهندية تتغير بحسب الجنس.
    example_gloss:
    - أخي الأكبر يعيش في دلهي.
    - أختي الكبرى تعيش في مومباي.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: أصغر سنًا / صغير
    gloss: أصغر، صغير (للمذكر / للمؤنث)
    note: مقابل *bada/badi*، ويُستخدم للأخ أو الأخت الأصغر سنًا.
    example_gloss:
    - أخي الأصغر طالب الآن.
    - أختي الصغرى طالبة الآن.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: توافق bada/chota
    gloss: 'تأتي *bada* و*chota* مع الكلمات المذكرة، وتأتي *badi* و*choti* مع الكلمات المؤنثة: *bada bhai*، *badi behan*.'
    note: التوافق نفسه بين المذكر والمؤنث في الصفات الذي رأيناه مع *mera/meri*، ويُطبَّق الآن على كلمات تصف العمر.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: و، لكن، أيضًا
    gloss: و، لكن، أيضًا
    note: ثلاث أدوات ربط أساسية، تتكرر في حوار ختام هذا الدرس.
    example_gloss:
    - أخي وأختي يعيشان في دلهي.
    - أخي يعيش في دلهي، لكن أختي تعيش في مومباي.
    - لدي أخت أيضًا.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: حسنًا، إلى اللقاء مرة أخرى
    gloss: حسنًا! إلى اللقاء مرة أخرى.
    note: عبارة ختام ودّية، مأخوذة من مفردات الوداع في الوحدة الثانية.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: حسنًا، إلى اللقاء قريبًا
    gloss: حسنًا، إلى اللقاء قريبًا!
    note: الرد غير الرسمي على عبارة الختام السابقة، بما يوافق تبادلات الختام في الوحدات السابقة.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: أرجون يسأل عن عائلة بريا
    gloss: أرجون يسأل أين تعيش عائلة بريا.
    note: يعيد استخدام نمط *parivar kahan rehta hai* من هذه الوحدة.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: بريا تصف والديها وأخاها
    gloss: تقول بريا إن والديها يعيشان في دلهي وإن لديها أخًا أكبر أيضًا.
    note: يجمع بين *mata-pita* و*rehte hain* و*bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: أرجون يسأل عن أجدادها
    gloss: 'يقول أرجون: «آه، فهمت»، ثم يسأل: وأجدادك؟'
    note: '*Tumhare* هي صيغة الاحترام من *tumhara* وتُستخدم للكبار، تمامًا مثل *mere* من *mera* (ملاحظة صيغة التوقير في الدرس الأول).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: بريا تصف أجدادها من الجهتين
    gloss: تقول بريا إن أجدادها من جهة الأب يعيشون في دلهي، لكن أجدادها من جهة الأم يعيشون في مومباي.
    note: تستخدم *lekin* للمقابلة بين مدينتَي زوجَي الأجداد، مما يعزز التمييز بين dada-dadi وnana-nani من الدرس الثاني.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: أرجون يذكر أخته
    gloss: يقول أرجون إن لديه أختًا صغرى أيضًا.
    note: يعيد استخدام *bhi* و*choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: بريا تُنهي المحادثة
    gloss: 'تقول بريا: جميل، إلى اللقاء مرة أخرى.'
    note: يعيد استخدام عبارة الختام في هذا الدرس.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: أرجون يرد
    gloss: 'يوافق أرجون ويقول: إلى اللقاء قريبًا.'
    note: يعيد استخدام عبارة الرد في هذا الدرس.
