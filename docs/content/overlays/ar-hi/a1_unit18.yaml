  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسية
    gloss: 'القواعد الرئيسية الثلاث في هذه الوحدة: (1) ''[المكان] + mein + [العدد] + [الاسم] + hai/hain'' للتعبير عمّا في المنزل وعدده؛ (2) الأسماء المذكرة التي تنتهي بـ ''-a'' تصبح ''-e'' في الجمع (kamra ← kamre)؛ (3) الأسماء المؤنثة التي تنتهي بـ ''-i'' تصبح ''-iyan'' في الجمع (kursi ← kursiyan، khidki ← khidkiyan).'
    note: ملخص ختامي يجمع قواعد الوحدة كلها، على غرار ملاحظات القواعد الجامعة في الوحدات 15 إلى 17.
