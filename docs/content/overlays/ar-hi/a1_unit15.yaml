teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'مراجعة: محطة، لي، يكون'
    gloss: محطة، لي / عندي، يكون
    note: مراجعة سريعة لاسم المكان ولفعل الكينونة اللازمين لبناء تركيب الوجوب في هذا الدرس.
    example_gloss:
    - المحطة هنا.
    - عندي عمل.
  hi.a1.unit15.lesson01.teach.jaana:
    title: الذهاب
    gloss: الذهاب (المصدر)
    note: صيغة المصدر للفعل المعروف سابقًا بصيغة الأمر مع तुम وهي *jao* (الوحدة 9) -- يقدّم هذا الدرس المصدر نفسه.
    example_gloss: أحتاج إلى الذهاب.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + الفعل + hai = الحاجة إلى فعل شيء
    gloss: 'سبق أن تعلّمتَ ''Mujhe'' مع ''chahiye'' (الوحدة 6، مع اسم) ومع ''hai'' (الوحدة 11، مثل ''mujhe kaam hai'' أي عندي عمل). والآن تأتي أيضًا مع فعل: ''mujhe jana hai'' تعني «أحتاج إلى الذهاب». لاحظ -- مع ''jana'' تبقى ''hai'' كما هي ولا تصبح ''hain'': فهي لا تتفق مع المتكلم.'
    note: يعرض الاستعمال الثالث لنمط الضمير + فعل الكينونة الذي سبق تعلّمه، ويذكر الاستعمالين السابقين برقم الوحدة قبل تقديم خانة الفعل الجديدة.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: أحتاج إلى الذهاب إلى المحطة.
    gloss: أحتاج إلى الذهاب إلى المحطة.
    note: أول مثال كامل في الوحدة على تركيب الوجوب.
  hi.a1.unit15.lesson01.teach.tiket:
    title: التذكرة
    gloss: التذكرة
    note: اسم جديد، نحتاج إليه في وحدة السفر هذه كلها.
    example_gloss: أين تذكرتي؟
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'مراجعة: أريد / أحتاج'
    gloss: أريد / أحتاج
    note: تعلّمتَها أول مرة في الوحدة 6 مع المشروبات، وتُستخدم هنا مع التذكرة.
    example_gloss: أريد شايًا.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: أحتاج إلى تذكرة.
    gloss: أحتاج إلى تذكرة.
    note: نمط *mujhe...chahiye* المعروف مطبّقًا على الاسم الجديد في هذه الوحدة.
  hi.a1.unit15.lesson01.teach.train:
    title: قطار
    gloss: القطار
    note: اسم جديد.
    example_gloss: القطار كبير.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'مراجعة: دلهي، لـ / تابع لـ'
    gloss: دلهي، أداة الإضافة (لـ / تابع لـ)
    note: سبق تعلّم دلهي في الوحدة 5؛ وأداة الإضافة *ka* مستخدمة في الدورة كلها (مثل الوحدات 5-14) -- وتُستخدم هنا لتحديد وجهة التذكرة.
    example_gloss:
    - يعيش أخي في دلهي.
    - هذه حقيبة أرجون.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: أحتاج إلى تذكرة إلى دلهي.
    gloss: أحتاج إلى تذكرة إلى دلهي.
    note: يجمع بين اسم هذا الدرس ونمط أداة الإضافة لتحديد وجهة معيّنة.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'مراجعة: أين، لك'
    gloss: أين، لك / لأجلك
    note: كلاهما سبق تعلّمه (الوحدة 8 والوحدة 6) -- ويُستخدمان هنا للسؤال عن المكان الذي يحتاج الشخص إلى الذهاب إليه.
    example_gloss:
    - أين المصرف؟
    - ماذا تريد؟
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'مراجعة: رقم'
    gloss: عدد
    note: تعلّمتَه أول مرة في الوحدة 2 لأرقام الهواتف -- ويُستخدم هنا لرقم الرصيف.
    example_gloss: ما رقم هاتفك؟
  hi.a1.unit15.lesson02.teach.platform:
    title: الرصيف
    gloss: رصيف
    note: اسم جديد، وهو الكلمة الهندية المعتادة لرصيف محطة القطار (كلمة دخيلة شائعة، على نمط *phone* في الوحدة 2).
    example_gloss: الرصيف كبير.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: ما رقم الرصيف؟
    gloss: ما رقم الرصيف؟
    note: يعيد استخدام نمط السؤال *kya hai* المعروف (مثل رقم الهاتف والسعر والعمر) في موضوع جديد.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: رقم الرصيف 3.
    gloss: رقم الرصيف 3.
    note: الجواب الكامل الطبيعي عن السؤال السابق.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (اتفاق المؤنث)
    gloss: 'تستخدم ''Jaati hai'' قاعدة الوحدة 10: -ta/-ti/-te + hai/hain، مع الفعل الجديد ''jana''. كلمة «القطار» مؤنثة نحويًا في الهندية، لذا نقول ''jaati hai'' لا ''jaata hai''.'
    note: امتداد مباشر وصريح لنمط المطابقة في المضارع العادي الذي سبق تعلّمه، مطبَّقًا على فعل جديد واسم جديد مؤنث نحويًا.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'مراجعة: من'
    gloss: من
    note: سبق تعلّمها في الوحدة 9 للاتجاهات، وتُستخدم هنا للرصيف الذي يغادر منه القطار.
    example_gloss: اذهب مباشرة من هنا.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: يغادر القطار من الرصيف رقم 3.
    gloss: يغادر القطار من الرصيف رقم 3.
    note: تجمع بين صيغة المضارع العادي في هذا الدرس وحرف الجر «من» الذي سبق تعلّمه.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'مراجعة: في أي ساعة'
    gloss: في أي ساعة
    note: سبق تعلّمها في الوحدة 4 عند قول الوقت، وتُستخدم هنا للسؤال عن موعد المغادرة.
    example_gloss: كم الساعة؟
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: متى يغادر القطار؟
    gloss: متى ينطلق القطار؟
    note: سؤال «في أي ساعة» مطبَّقًا على موعد مغادرة مجدول، لا على الوقت الحالي.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: يغادر القطار في الساعة السادسة.
    gloss: يغادر القطار في الساعة السادسة.
    note: الجواب الطبيعي بجملة كاملة، ويستخدم صيغة الجمع *baje* من الوحدة 4 (الرقم ستة ليس استثناء *baja* الذي ينطبق على الساعة الواحدة فقط).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: كم سعر التذكرة؟
    gloss: كم سعر التذكرة؟
    note: يعيد استخدام سؤال السعر *kitne ka/ki* من الوحدة 7. تُعامَل *Tikat* عادةً كمذكر (*ka*)، ويعاملها كثير من المتحدثين كمؤنث أيضًا (*kitne ki*)، وهذا صحيح كذلك.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'مراجعة: روبيات، خمسون'
    gloss: روبيات، خمسون
    note: كلتاهما سبق تعلّمهما في الوحدة 2 للأسعار والكميات، وتُستخدمان هنا لسعر التذكرة.
    example_gloss: معي خمسون روبية.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: سعر التذكرة 50 روبية.
    gloss: سعر التذكرة 50 روبية.
    note: الجواب الطبيعي بجملة كاملة على سؤال السعر أعلاه.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: نحن، لنا
    gloss: نحن، لنا / علينا
    note: سبق تقديم «hum» (نحن) في الوحدة 11 كأول ضمير جمع متكلم في الدورة؛ و«hamein» صيغته في حالة «لـ»، وهي مطلوبة هنا لحوار السفر المشترك.
    example_gloss:
    - نحن بخير.
    - علينا أن نذهب إلى المحطة.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: الضمير الرابع في حالة «لـ»'
    gloss: «Hamein» هي صيغة «hum» (الوحدة 11) في حالة «لـ»، تمامًا مثل «mujhe» (من main) و«tumhein» (من tum). وهنا أيضًا، مع «jana» يبقى «hai» كما هو ولا يصبح «hain»؛ فهو لا يتطابق مع «hum»/«hamein».
    note: تذكر الضمائر الثلاثة السابقة في حالة «لـ» برقم وحداتها قبل إضافة الرابع، وتعيد التنبيه إلى أن «hai» يتبع الفعل لا الضمير، كما في ملاحظة القواعد في الدرس الأول.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: علينا أن نذهب إلى المحطة.
    gloss: علينا أن نذهب إلى المحطة.
    note: تركيب الوجوب مع ضمير الجمع الجديد في حالة «لـ».
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'مراجعة: «من / لـ» (أداة الإضافة، المؤنث)'
    gloss: 'أداة الإضافة (للمؤنث): من / لـ'
    note: سبق تعلّمها في الوحدة 7 مع *ka*/*kitne*، وتُستخدم هنا لأن «القطار» مؤنث نحويًا في الهندية، فصيغة الإضافة له «ki» لا «ka».
    example_gloss: هذا قطار دلهي.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: أرجون يقول إن عليهما الذهاب
    gloss: بريا، علينا أن نذهب إلى المحطة.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: بريا تحتاج إلى تذكرة
    gloss: حسنًا. أحتاج إلى تذكرة إلى دلهي.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: أرجون يسأل عن السعر
    gloss: وأنا أيضًا. كم سعر التذكرة؟
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: بريا تذكر السعر
    gloss: سعر التذكرة 50 روبية.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: أرجون يسأل عن موعد المغادرة
    gloss: جيد. في أي ساعة يغادر القطار؟
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: بريا تذكر الموعد والرصيف
    gloss: يغادر القطار في الساعة السادسة من الرصيف رقم 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: أرجون يفهم ويقول هيا بنا
    gloss: فهمت. هيا بنا!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: بريا توافق
    gloss: هيا بنا!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسية
    gloss: 'القواعد الرئيسية الثلاث في هذه الوحدة: (1) «mujhe/tumhein/hamein + فعل + hai» تعني «يجب أن / عليّ أن ___»؛ (2) «X kitne ka/ki hai?» للسؤال عن السعر؛ (3) «X [الوقت] baje [المكان] se jaati hai» لذكر موعد الرحلة ومكانها.'
    note: ملخص ختامي يجمع قواعد الوحدة كلها، على غرار ملاحظة القواعد الجامعة للنماذج في الوحدة 14.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: قراءة تذكرة
    gloss: 'التذكرة: دلهي. الرصيف رقم 3. الساعة السادسة.'
    note: نص قصير مجزأ لتذكرة (بلا جمل كاملة، كما تُكتب التذاكر فعلًا) يعيد الوقائع التي وردت في الحوار نفسها دون إضافة جديدة.
    glosses:
      टिकट: تذكرة
      प्लेटफ़ॉर्म: رصيف
      नंबर: رقم
      बजे: الساعة
