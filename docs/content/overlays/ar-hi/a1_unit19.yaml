teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'مراجعة: اليوم'
    gloss: اليوم
    note: سبق تعلّمها في الوحدة 3 -- وهي كلمة الزمن المتكررة في هذه الوحدة، إلى جانب *kal* (غدًا) في الدرس 3.
    example_gloss: اليوم هو الثالث من الشهر.
  hi.a1.unit19.lesson01.teach.mausam:
    title: الطقس
    gloss: الطقس
    note: اسم جديد، وهو كلمة موضوع هذه الوحدة. مذكّر -- انظر ملاحظات التوافق في النوع في هذه الوحدة.
    example_gloss: كيف حال الطقس اليوم؟
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'مراجعة: كيف / ما حال'
    gloss: كيف / ما حال
    note: سبق تعلّمها في الوحدة 12 -- نعيد استخدامها هنا للسؤال عن الطقس.
    example_gloss: كيف هو بيتك؟
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'مراجعة: يكون / يكونون'
    gloss: يكون / يوجد (للمفرد)، يكونون / يوجدون (للجمع)
    note: ثنائية فعل الكينونة للمفرد والجمع التي يقوم عليها نمط الوجود في هذه الوحدة كلها.
    example_gloss:
    - الطقس جميل اليوم.
    - في البيت ثلاث غرف.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: الشمس / أشعة الشمس
    gloss: شمس / أشعة الشمس
    note: 'اسم جديد. يُقال بصيغة الوجود المجرّدة: *aaj dhoop hai* = «اليوم مشمس» (حرفيًا: «اليوم توجد شمس»).'
    example_gloss: الجو مشمس اليوم.
  hi.a1.unit19.lesson01.teach.baarish:
    title: المطر
    gloss: مطر
    note: 'اسم جديد. يُقال بصيغة الوجود المجرّدة: *aaj baarish hai* = «اليوم تمطر».'
    example_gloss: تمطر اليوم.
  hi.a1.unit19.lesson01.teach.hawa:
    title: ريح
    gloss: ريح
    note: 'اسم جديد. يُقال بصيغة الوجود المجرّدة: *aaj hawa hai* = «اليوم توجد رياح».'
    example_gloss: اليوم توجد رياح.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: نمط الوجود في وصف الطقس
    gloss: لوصف الطقس نقول 'आज/कल + [كلمة الطقس] + है' -- مثل 'आज धूप है' و'आज बारिश है' و'आज हवा है'. هذا هو نمط है/हैं نفسه الذي تعلّمناه عن غرف البيت في الوحدة 18، لكن هنا من دون عدد، وبوصفه المبتدأ مباشرة.
    note: أول ملاحظة نحوية في هذه الوحدة، وتربط المفردات الجديدة بنمط جملة سبق تعلّمه.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'مراجعة: الطقس'
    gloss: الطقس
    note: أُعيد استخدامها من الدرس الأول في هذه الوحدة.
    example_gloss: كيف حال الطقس اليوم؟
  hi.a1.unit19.lesson02.teach.garam:
    title: الحرّ
    gloss: حارّ
    note: صفة جديدة. لا تتغير بحسب النوع -- انظر الملاحظة النحوية في هذا الدرس.
    example_gloss: الطقس حار اليوم.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: بارد (مذكّر / مؤنث)
    gloss: بارد (مذكّر)، باردة (مؤنث)
    note: صفة جديدة. تتغير بحسب النوع، خلافًا لـ *garm* -- فالمذكّر *mausam* يأخذ *thanda*، والأسماء المؤنثة (مثل *rasoi* في الوحدة 18) تأخذ *thandi* -- انظر الملاحظة النحوية في هذا الدرس.
    example_gloss:
    - الطقس بارد اليوم.
    - المطبخ بارد اليوم.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: الصفات الثابتة والصفات المتوافقة مع النوع
    gloss: '''Garm'' صفة تنتهي بحرف ساكن ولا تتغير بحسب النوع -- ففي ''mausam garm hai'' تبقى ''garm'' دائمًا. أما ''thanda''/''thandi'' فصفة تنتهي بـ ''-a'' وتتغير بحسب النوع، تمامًا مثل ''bada''/''badi'' (الوحدة 14) -- فالمذكّر ''mausam'' يأخذ ''thanda''، والاسم المؤنث يأخذ ''thandi''.'
    note: هذه أهم مقارنة نحوية في الوحدة، وتربط زوج الصفات الجديد بقاعدة الوحدة 14 التي سبق تعلّمها.
  hi.a1.unit19.lesson02.teach.baadal:
    title: غيمة / غيوم
    gloss: غيمة / غيوم
    note: 'اسم جديد، يُستخدم في هذه الوحدة بصيغة الجمع الدالة على الوجود فقط: *aaj baadal hain* = «اليوم توجد غيوم» / «اليوم الجو غائم».'
    example_gloss: اليوم توجد غيوم.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'مراجعة: جيد'
    gloss: جيد
    note: سبق تعلّمها في الوحدة 9 -- نعيد استخدامها هنا لوصف الطقس.
    example_gloss: الطقس جميل اليوم.
  hi.a1.unit19.lesson02.teach.bura:
    title: سيئ
    gloss: سيئ
    note: صفة جديدة تُقابل كلمة *accha* (جيد) التي سبق تعلّمها. تُستعمل في هذه الوحدة بصيغة المذكر فقط، لتتوافق مع *mausam*.
    example_gloss: الطقس سيئ اليوم.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'مراجعة: جدًّا'
    gloss: جدًّا
    note: تعلّمتها أول مرة في الوحدة 6، وتُستعمل هنا لتقوية وصف الطقس.
    example_gloss: الطقس بارد جدًّا اليوم.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'مراجعة: غدًا (وتعني أيضًا: أمس)'
    gloss: غدًا (وتعني أيضًا «أمس» بحسب السياق)
    note: تعلّمتها أول مرة في الوحدة 4، ثم استُعملت بمعنى «أمس» في الوحدة 12. وهي في الهندية الحقيقية ملتبسة فعلًا، ولا يحدّد معناها إلا السياق. جمل هذه الوحدة كلها عن المستقبل والخطط، لذا تعني 'kal' هنا «غدًا».
    example_gloss: ستمطر غدًا.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'مراجعة: بيت / منزل'
    gloss: بيت / منزل
    note: تعلّمتها أول مرة في الوحدة 8، وتُستعمل هنا للخطة الناتجة (البقاء في البيت).
    example_gloss: هذا بيت.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'مراجعة: في'
    gloss: في
    note: تعلّمتها أول مرة في الوحدة 1، وتُستعمل هنا في «ghar mein» (في البيت).
    example_gloss: في البيت ثلاث غرف.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'مراجعة: نحن'
    gloss: نحن
    note: تعلّمتها أول مرة في الوحدة 11، وتُستعمل هنا فاعلًا في وضع الخطط في هذا الدرس.
    example_gloss: نشاهد فيلمًا.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'مراجعة: [هم/نحن] يقيمون / يسكنون'
    gloss: '[هم/نحن] يقيمون / يسكنون'
    note: تعلّمتها أول مرة في الوحدة 5 (مع جدّ مفرد، بحسب مطابقة الجمع المذكر للاحترام). وهذه الوحدة هي الأولى التي تستعملها مع فاعل جمع حقيقي هو 'hum' (نحن)، فالصيغة نفسها تُطبَّق بصورة أبسط.
    example_gloss: جدّي يعيش في دلهي.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'مراجعة: هيّا / تعالَ'
    gloss: هيّا / لنذهب
    note: تعلّمتها أول مرة في الوحدة 1، ثم استُعملت في الوحدات 6 و7 و11 مع فعل جمع معتاد بمعنى «لنفعل ___». وتُستعمل هنا بالطريقة نفسها.
    example_gloss: هيّا نأكل شيئًا!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'مراجعة: يذهب (الذهاب)'
    gloss: الذهاب
    note: تعلّمتها أول مرة في الوحدة 15 مصدرًا مجردًا. ويوسّعها هذا الدرس إلى صيغة الجمع المعتاد 'jaate hain' (نذهب)، بالاشتقاق نفسه الذي استعملته الوحدة 11 في 'dekhte hain' و'peete hain'.
    example_gloss: عليّ أن أذهب إلى المحطة.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'مراجعة: و'
    gloss: و
    note: تعلّمتها أول مرة في الوحدة 1، وتُستعمل هنا للربط بين طقس الغد ودرجة حرارته.
    example_gloss: ستمطر غدًا وسيكون الطقس باردًا.
  hi.a1.unit19.lesson03.teach.bahar:
    title: في الخارج
    gloss: في الخارج
    note: كلمة جديدة من مفردات الخطة الناتجة في هذا الدرس.
    example_gloss: هيّا نخرج!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: هيّا نخرج!
    gloss: هيّا نخرج!
    note: '''Chalo'' + فعل الجمع المعتاد ''jaate hain'' (من ''jaana''، أي الذهاب). وهو النمط نفسه «لنفعل ___» الذي سبق في الوحدات 1 و6 و7 و11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: أرجون يسأل بريا عن طقس اليوم
    gloss: بريا، كيف الطقس اليوم؟
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: بريا تصف طقس اليوم
    gloss: اليوم مشمس والطقس حار.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: أرجون يقترح الخروج
    gloss: رائع! هيّا نخرج.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: بريا تسأل عن طقس الغد
    gloss: حسنًا! وكيف سيكون طقس الغد؟
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: أرجون يصف طقس الغد
    gloss: ستمطر غدًا وسيكون الطقس باردًا.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: بريا تقترح البقاء في البيت
    gloss: إذن سنبقى في البيت غدًا؟
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: أرجون يوافق
    gloss: نعم، سنبقى في البيت غدًا.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: بريا توافق
    gloss: حسنًا!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسية
    gloss: 'القواعد الرئيسية الثلاث لهذه الوحدة: (1) نصف الطقس بالصيغة ''aaj/kal + [كلمة الطقس] + hai/hain''؛ (2) كلمة ''garm'' لا تتغيّر بحسب الجنس، أما ''thanda''/''thandi'' فتتغيّر، تمامًا مثل ''bada''/''badi''؛ (3) ''chalo'' + فعل جمع معتاد (مثل ''jaate hain'') تعطي اقتراحًا: ''chalo, bahar jaate hain!''.'
    note: خلاصة ختامية تجمع قواعد الوحدة كلها، على غرار الملاحظات النحوية الجامعة للأنماط في الوحدات 15 إلى 18.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: قراءة عن اليوم والغد
    gloss: الطقس حار اليوم والجو مشمس. هيّا نخرج! ستمطر غدًا وسيكون الطقس باردًا. سنبقى في البيت غدًا.
    note: نص قصير ومباشر، بلا إطار سردي جديد، يعيد الوقائع نفسها التي وردت في الحوار دون إضافة ادعاءات جديدة، وهو يخدم مباشرة هدف «قراءة نشرة طقس قصيرة».
    glosses:
      आज: اليوم
      मौसम: الطقس
      गर्म: حار
      धूप: أشعة الشمس
      चलो: هيّا
      बाहर: في الخارج
      जाते: يذهب (من जाना)
      कल: غدًا
      बारिश: مطر
      ठंडा: بارد
      रहते: يقيم / يسكن (من रहना)
