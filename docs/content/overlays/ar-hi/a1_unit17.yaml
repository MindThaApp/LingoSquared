    gloss: جميل! هل تذهبين إلى المدرسة كل يوم؟
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: بريا تؤكد ثم تسأل أرجون السؤال نفسه
    gloss: نعم، أذهب إلى المدرسة كل يوم. ما عملك؟
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: أرجون يقول إنه مهندس في مكتب
    gloss: أنا مهندس. أعمل في مكتب.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: بريا تسأله هل يذهب هو أيضًا إلى المكتب كل يوم
    gloss: رائع! هل تذهب أنت أيضًا إلى المكتب كل يوم؟
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: أرجون يؤكد
    gloss: نعم، أذهب إلى المكتب كل يوم.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: بريا تشكره
    gloss: حسنًا، شكرًا.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسية
    gloss: 'القواعد الرئيسية الثلاث لهذه الوحدة: (1) يُعبَّر عن المهنة بالتركيب ''mein + المهنة + hoon'' (مثل ''mein shikshika hoon'')، وبعض المهن تتغيّر بحسب جنس المتكلّم نفسه؛ (2) يُعبَّر عن مكان العمل بالتركيب ''[المكان] + mein + kaam karta/karti hoon'' (مثل ''mein daftar mein kaam karta hoon'')؛ (3) يُعبَّر عن العادة اليومية بالتركيب ''roz [المكان] jata/jati hoon''، وهي قاعدة -ta/-ti نفسها من الوحدة 10.'
    note: خلاصة ختامية تربط نحو الوحدة كلها، على غرار الملاحظة النحوية التي تربط الجداول في الوحدتين 15 و16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: قراءة نبذة قصيرة
    gloss: بريا معلّمة. تعمل في مدرسة. أرجون مهندس. يعمل في مكتب.
    note: نبذة قصيرة ومباشرة (بلا إطار سردي جديد) تعيد الوقائع التي وردت في الحوار نفسها دون أي إضافة، وتخدم مباشرةً هدف «قراءة نبذة قصيرة عن العمل».
    glosses:
      शिक्षिका: معلّمة
      स्कूल: مدرسة
      काम: يعمل
      करती: تفعل / تعمل (مؤنث، من الفعل करना)
      इंजीनियर: مهندس
      दफ़्तर: مكتب
      करता: يفعل / يعمل (للمذكر)
