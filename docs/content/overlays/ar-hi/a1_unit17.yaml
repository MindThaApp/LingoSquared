  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: المكان + mein + kaam karta/karti hoon
    gloss: 'يجمع التركيب ''[المكان] + mein + kaam karta/karti hoon'' ثلاثة عناصر معروفة سلفًا: ''mein'' (الوحدة 1، ''London mein rehta hoon'')، و''kaam'' (الوحدتان 10/11)، وصيغة -ta/-ti/-te من الفعل ''karna'' (''nashta karta hoon'' في الوحدة 10، و''kya tum yog karti ho?'' في الوحدة 1). وليست هذه قاعدة جديدة، بل جمعٌ للعناصر الثلاثة في جملة واحدة للمرة الأولى.'
    note: تسمّي كل عنصر سبق تعلّمه برقم وحدته قبل الجمع بينها، على نهج كل الملاحظات النحوية السابقة.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'مراجعة: كل يوم'
    gloss: كل يوم
    note: سبق تعلّمها في الوحدة 10 — وتُستخدم هنا لوصف روتين العمل اليومي.
    example_gloss: أعمل كل يوم.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'مراجعة: يذهب (أنتِ، مؤنث / أنت، مذكر / أنا، مذكر)'
    gloss: تذهبين (للمخاطبة المؤنثة المقرّبة)، تذهب (للمخاطب المذكر المقرّب)، أذهب (أنا، مذكر)
    note: صيغ -ta/-ti/-te للفعل *jana* (ذهب) التي سبق تعلّمها في الوحدة 10، وتُستخدم هنا للذهاب اليومي إلى العمل.
    example_gloss:
    - أذهب إلى المدرسة كل يوم. (المتكلمة مؤنث)
    - هل تذهب إلى المكتب كل يوم؟ (لرجل)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'مراجعة: أيضًا، نعم'
    gloss: أيضًا، نعم
    note: كلتاهما سبق تعلّمهما (الوحدة 1 والوحدات 1/6/13) — وتُستخدمان هنا في حوار هذا الدرس.
    example_gloss: نعم، أعجبني ذلك أنا أيضًا.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: أرجون يسأل بريا عن عملها
    gloss: بريا، ما عملك؟
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: بريا تقول إنها معلّمة في مدرسة
    gloss: أنا معلّمة. أعمل في مدرسة.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
