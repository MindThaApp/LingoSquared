  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: معلّم (مذكر / مؤنث)
    gloss: معلّم، معلّمة
    note: زوج جديد من أسماء المهن. وعلى خلاف معظم الأسماء التي مرّت بك، يتغيّر هذا الاسم بحسب جنس المتكلّم نفسه — راجع الملاحظة النحوية في هذا الدرس.
    example_gloss:
    - أنا معلّم.
    - أنا معلّمة.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + المهنة + hoon
    gloss: 'تُعبَّر عن المهنة بالتركيب ''Mein + المهنة + hoon''، وهو التركيب ''mein...hoon'' القديم نفسه من الوحدة 1. بعض المهن تتغيّر بحسب جنس المتكلّم نفسه: ''shikshak'' (مذكر) و''shikshika'' (مؤنث)، تمامًا كما تغيّرت نهاية الفعل -ta/-ti في الوحدة 10. أما ''Doctor'' و''«engineer»'' فلا تتغيّران: الكلمة نفسها للجنسين.'
    note: توضّح صراحةً التقسيم إلى نوعين (أسماء تتطابق مع الجنس وكلمات مقترضة ثابتة) قبل أن يعتمد أي تمرين عليه.
  hi.a1.unit17.lesson01.teach.doctor_review:
