    gloss: طبيب
    note: سبق تعلّمها في الوحدة 16 — وتُستخدم هنا كمهنة ثابتة لا تتغيّر بحسب الجنس.
    example_gloss: هو/هي طبيب/طبيبة.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: أنا طبيب.
