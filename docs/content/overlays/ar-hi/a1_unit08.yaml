    gloss: أرجون يقول حسنًا، ويسأل أين المستشفى.
    note: يعيد استخدام *achchha* (حسنًا / فهمت) من الوحدات السابقة.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: بريا تجيب
    gloss: بريا تقول إن المستشفى أمام المحطة.
    note: يعيد استخدام *ke samne* من الدرس 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: أرجون يسأل هل المحطة بعيدة
    gloss: 'أرجون يسأل: هل المحطة بعيدة؟'
    note: يعيد استخدام *door* من الدرس 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: بريا تؤكد وتقارن
    gloss: بريا تقول نعم، بعيدة قليلًا -- أما البنك فقريب.
    note: يقدّم *thoda* (قليلًا)، ويبقى متسقًا مع كون المحطة بعيدة والبنك قريبًا.
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: أرجون يسأل عن الحديقة
    gloss: أرجون يقول حسنًا، ويسأل أين الحديقة.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: بريا تجيب
    gloss: بريا تقول إن الحديقة خلف المدرسة.
    note: يعيد استخدام *ke peeche* من الدرس 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: أرجون يستنتج
    gloss: 'أرجون يقول: إذن المدرسة أمام الحديقة!'
    note: يقدّم *to* (إذن)، ويربط هذه المعلومة بملاحظة الدرس 2 النحوية عن *samne* و*peeche*.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: بريا تؤكد
    gloss: بريا تقول نعم، هذا صحيح!
    note: يقدّم *sahi* (صحيح).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: أرجون يشكر بريا
    gloss: أرجون يقول شكرًا جزيلًا يا بريا!
    note: يعيد استخدام *bahut* (جدًا) و*shukriya* من الوحدات السابقة.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: بريا تختتم
    gloss: بريا تقول لا عليك! إلى اللقاء.
    note: يعيد استخدام عبارات الختام المعتادة في هذه الدورة من الوحدات السابقة.
