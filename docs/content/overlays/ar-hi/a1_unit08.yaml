  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' تعني قرب مكان ما، مثل ''school bank ke paas hai'' (المدرسة قرب البنك). وهي نفسها ''paas'' التي ظهرت سابقًا في ''mere paas'' (لديّ)، لكنها كانت تعني هناك «في حوزتي»، وهنا تعني «قريبًا» -- كلمة واحدة باستخدامين مختلفين.'
    note: حرف جر مركّب مبني على كلمة سبق أن ظهرت، مع التنبيه صراحةً إلى معناها السابق حتى لا يختلط الاستعمالان.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (لديّ), और यहाँ इसका मतलब है ''नज़दीक'' (قريب) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: المدرسة قرب البنك
    gloss: المدرسة قرب البنك.
    note: جملة نموذجية باستخدام *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: أمام، خلف
    gloss: أمام، خلف
    note: زوج ثانٍ من كلمات المكان، وتُستخدم أيضًا مع *ke*.
    example_gloss:
    - المستشفى أمام المحطة.
    - الحديقة خلف المدرسة.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne و peeche
    gloss: '''Samne'' و''peeche'' تأتيان أيضًا مع ''ke'' مثل ''paas'' -- وهما نقيضان: ''paark school ke peeche hai'' و''school paark ke samne hai'' تصفان العلاقة الفعلية نفسها تمامًا، لكن من زاويتين مختلفتين.'
    note: الحقيقة نفسها بصيغتين -- نقطة نحوية مفيدة فعلًا عن العلاقة بين الكلمتين.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: المدرسة أمام الحديقة
    gloss: المدرسة أمام الحديقة.
    note: الوجه الآخر للحقيقة نفسها في *paark school ke peeche hai* أعلاه.
