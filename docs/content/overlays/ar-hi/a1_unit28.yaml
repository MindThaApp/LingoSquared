teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*करूँगा* هي صيغة المستقبل من *करना*، وتُستخدم في الهندية للدلالة على «سوف أفعل». ويأخذ الشخص الذي تتصل به الصيغة *तुम्हें* («لك»).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: الرد على الهاتف
    gloss: مرحبًا، معك بريا.
    note: في الهاتف تقول *मैं ... बोल रही हूँ* («أنا أتحدث»)؛ و*रही* مؤنثة لأن بريا امرأة.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: أرجون يردّ بالطريقة نفسها
    gloss: مرحبًا، معك أرجون.
    note: 'النمط نفسه مع المذكر *रहा*: *मैं अर्जुन बोल रहा हूँ*، لأن أرجون رجل.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*किससे* («مع من») تتكون من *कौन* («من») و*से*، وتشير *से* إلى الشخص الذي تتحدث معه.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: التعريف بنفسك بصيغة رسمية
    gloss: أنت تتحدث مع بريا.
    note: '*आप* هي «أنت» المهذبة لشخص غريب. في *प्रिया से बात कर रहे हैं* تأتي *से* بعد الاسم، وتأتي *हैं* مع *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*सकते हो* تعني «تستطيع» وتأتي بعد الفعل الرئيس: *कह सकते हो*. وتحوّل *क्या* في البداية الجملة إلى سؤال.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*मत बोलो* هي «لا تتكلم» الودّية مع *तुम*، و*इतना तेज़* تعني «بهذه السرعة».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: 'تقول الهندية «صوتك لا يأتي»: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. يأخذ المتكلم *मुझे*، ويكون الصوت هو الفاعل.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: '*मैसेज* كلمة مستعارة شائعة وهي مذكرة: *एक मैसेज*، *यह मैसेज ... का है*.'
    example_gloss: الرسالة النصية من بريا.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة.
    note: 'الترتيب: الشخص ثم الشيء ثم الفعل: *तुम्हें एक मैसेज भेजूँगा*. و*भेजना* تعني «يرسل».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: '*वापस फ़ोन करना* تعني «معاودة الاتصال»، وتأتي *वापस* قبل *फ़ोन करना*؛ و*बाद में* تعني «لاحقًا».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: قراءة محادثة نصية
    gloss: 'أرجون: مرحبًا بريا، هل يمكنك أن تتصلي بي؟ لديّ أمر مهم أريد إخبارك به. بريا: نعم بالتأكيد، سأعاود الاتصال بك بعد خمس دقائق.'
    note: تتبّع ما يطلبه أرجون، ولماذا، ومتى تقول بريا إنها ستعاود الاتصال.
    glosses:
      हाय: مرحباً
      सकती: تستطيع
      फ़ोन: الاتصال
      ज़रूरी: 'مهم (كما في: أمر مهم يجب قوله)'
      कुछ: شيء ما
      बतानी: أخبر
      ज़रूर: بالطبع
      करूँगी: سأتصل
      पाँच: خمسة
      मिनट: دقائق
      वापस: أعيد
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: أرجون يردّ على المكالمة
    gloss: 'أرجون: مرحبًا، معك أرجون.'
    note: من يردّ على المكالمة يذكر اسمه أولًا بـ *मैं ... बोल रहा हूँ*، وهنا بالمذكر *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: بريا تعرّف بنفسها
    gloss: 'بريا: مرحبًا أرجون، معك بريا. أرجون: جميل أنك اتصلتِ!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* تعني «جيد أنك اتصلتَ»؛ و*तुमने ... किया* ماضٍ مع *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: بريا تسأل عن المناوبة
    gloss: 'بريا: كيف كانت مناوبتك الأولى؟'
    note: '*कैसी रही* تسأل «كيف كانت»؛ و*कैसी* مؤنثة لأن *शिफ़्ट* مؤنثة.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: أرجون يروي الخبر السار
    gloss: 'أرجون: كانت جيدة جدًا، أفضل مما توقعت.'
    note: '*अच्छी रही* («سارت جيدًا») تتوافق مع *शिफ़्ट* المؤنثة، و*जितना मैंने सोचा था उससे भी बेहतर* تعني «أفضل حتى مما ظننت».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था و थी: كان / كانت'
    gloss: كان متوترًا، وكانت سعيدة.
    note: '*था* تعني «كان» للفاعل المذكر و*थी* للفاعل المؤنث؛ فالنهاية تتوافق مع الموصوف.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: بريا فخورة
    gloss: 'بريا: يسعدني سماع ذلك! أنا فخورة بك.'
    note: في *तुम पर गर्व है* («الفخر عليك») تُستخدم *पर*، ويأخذ الفخور *मुझे*.
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: أرجون متأثر
    gloss: 'أرجون: شكرًا جزيلًا، هذا يعني لي الكثير.'
    note: '*मेरे लिए* تعني «لي»، و*इसका बहुत मतलब है* تعني «هذا يعني الكثير».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: '*उसकी* تعني «له» أو «لها» (الكلمة نفسها للاثنين) وتتوافق مع *शिफ़्ट* المؤنثة.'
