teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'تعبّر الهندية عن الهوايات بفعل ينتهي بـ *-ना*: *पढ़ना* و*कसरत करना* و*खाना बनाना* («القراءة» و«ممارسة الرياضة» و«الطبخ»).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*खाली समय* («وقت فارغ») عبارة أساسية للحديث عن الهوايات، و*में* تعني «في»: *खाली समय में*.'
    example_gloss: في وقت فراغي، أحب القراءة.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*मुझे ... पढ़ना पसंद है* («القراءة محبّبة إليّ») هي طريقة الهندية في قول «أحب القراءة»؛ و*मुझे* تبيّن من الذي يحب.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث هوايات أخرى: *संगीत सुनना* و*चित्र बनाना* و*गेम खेलना*؛ و*गेम* كلمة مستعارة من الإنجليزية.'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: '*संगीत सुनना* («الاستماع إلى الموسيقى») لا يحتاج إلى حرف إضافي: يأتي المفعول مباشرة قبل الفعل.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: في *दोस्तों के साथ* («مع الأصدقاء») تأتي *दोस्त* في حالة الجمع المائلة (*दोस्तों*) لأنها تسبق *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: كلمات التكرار مثل *हमेशा* و*अक्सर* و*कभी-कभी* و*कभी नहीं* تأتي عادةً قبل الفعل، و*कभी नहीं* تعني «أبدًا».
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: '*हर* («كل») لا تتغير، وكلمة الزمن بعدها تبقى بصيغتها البسيطة: *हर हफ़्ते*، *हर वीकेंड*.'
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर لا تتغير
    gloss: كل أسبوع، كل عطلة نهاية أسبوع.
    note: '*हर* لا تتغير مهما كان الاسم الذي يليها، فلا صيغة تُختار: *हर हफ़्ते*، *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: بريا تفتح موضوع الهوايات
    gloss: 'بريا: كثيرًا ما نتمشى معًا. لكن ماذا تفعل أيضًا في وقت فراغك يا أرجون؟'
    note: '*टहलते हैं* بصيغة الجمع لأن الفاعل *हम* («نحن»)، و*अक्सर* تأتي قبل الفعل.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: هوايات أرجون
    gloss: 'أرجون: أحب الطبخ، في البيت أيضًا. وأمارس الرياضة كثيرًا.'
    note: '*घर पर भी* («في البيت أيضًا») تدل على أن أرجون يطبخ للمتعة، وليس في العمل فقط.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: بريا تتفاجأ
    gloss: 'بريا: تطبخ في البيت أيضًا؟ أنت تطبخ اليوم كله في عملك أصلًا!'
    note: '*पूरा दिन* («اليوم كله») تؤكد كم يطبخ أصلًا في العمل، و*तो* تضيف توكيدًا.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: أرجون يشرح
    gloss: 'أرجون: نعم، لكن الطبخ يمنحني الراحة. وأنت، ماذا تحبين أن تفعلي؟'
    note: '*खाना बनाने से सुकून मिलता है* تعني «الطبخ يريحني» (حرفيًا: «من الطبخ تُنال الراحة»)؛ و*बनाना* تصبح *बनाने* قبل *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: هوايات بريا
    gloss: 'بريا: أحب القراءة وكثيرًا ما أستمع إلى الموسيقى.'
    note: '*और* («و») تربط بين هوايتين، و*सुनती हूँ* بصيغة المؤنث لأن المتكلمة بريا.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: أرجون يسأل عن الألعاب الإلكترونية
    gloss: 'أرجون: هل تلعبين الألعاب الإلكترونية أيضًا؟'
    note: 'سؤال قصير جوابه نعم أو لا: يبدأ بـ *क्या*، و*खेलती हो* بصيغة المؤنث لأن أرجون يخاطب بريا.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: بريا تجيب
    gloss: 'بريا: لا، لا ألعب الألعاب الإلكترونية أبدًا. لكنني أرسم أحيانًا!'
    note: '*कभी ... नहीं* («أبدًا») و*कभी-कभी* («أحيانًا») متقابلتان في جواب واحد.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: مقارنة الهوايات
    gloss: أنا وأرجون كثيرًا ما نتمشى معًا. لكن لدينا هوايات أخرى أيضًا. أرجون يحب الطبخ، في البيت أيضًا، ويمارس الرياضة كثيرًا. أنا أحب القراءة وكثيرًا ما أستمع إلى الموسيقى. أرسم أحيانًا، لكنني لا ألعب الألعاب الإلكترونية أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: رسالة بريا تلخّص ما سبق في الدروس السابقة وتنتهي بسؤال القارئ السؤال الأساسي في الوحدة.
    glosses:
      टहलते: يتنزه
      अक्सर: غالبًا
      साथ: معًا
      और: أخرى
      बनाना: صنع (طبخ)
      पसंद: يحب
      घर: في البيت
      कसरत: يمارس الرياضة
      पढ़ना: القراءة
      सुनती: أستمع
      संगीत: موسيقى
      चित्र: صورة (رسم)
      कभी-कभी: أحيانًا
      गेम: ألعب ألعاب الفيديو
      कभी: أبدًا (مع नहीं)
      खाली: فراغ
      समय: وقت
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: أرجون يسأل عن عطلة نهاية الأسبوع
    gloss: 'أرجون: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: '*इस वीकेंड* («عطلة نهاية الأسبوع هذه») تضع *इस* قبل الاسم، و*कर रही हो* صيغة الاستمرار «تفعلين»، بصيغة المؤنث لأن المخاطبة بريا.'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: بريا لم تقرّر بعد
    gloss: 'بريا: لا أعرف بعد. أحب القراءة، لكنني أريد أن أخرج أيضًا.'
    note: '*बाहर जाना चाहती हूँ* تعني «أريد أن أخرج»؛ و*चाहती* بصيغة المؤنث وتأتي بعد *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: أرجون يقترح خطة
    gloss: 'أرجون: هيا نتمشى معًا؟ وبعد ذلك أطبخ لنا.'
    note: '*उसके बाद* («بعد ذلك») ترتّب الخطتين، و*चलो ... टहलें* تقترح الأولى.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: بريا توافق
    gloss: 'بريا: فكرة جيدة! أحب التمشي والطبخ كليهما.'
    note: '*दोनों पसंद हैं* تبيّن أن بريا تحب الاثنين بالقدر نفسه، والفعل بصيغة الجمع *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: أرجون يؤكد
    gloss: 'أرجون: رائع. إذن نلتقي يوم السبت!'
    note: '*शनिवार को मिलते हैं* («نلتقي يوم السبت») تستعمل المضارع لموعد محدد، و*को* تحدد اليوم.'
