  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: السؤال عن السعر الإجمالي
    gloss: كم يكلّف في المجموع؟
    note: '*कुल* تعني «المجموع»، و*कितना हुआ?* («كم بلغ؟») هي الطريقة المعتادة للسؤال عن المجموع.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: ذكر السعر الإجمالي
    gloss: المجموع مئتان وخمسون روبية.
    note: '*हुए* يتوافق مع الجمع *रुपये*: *कुल दो सौ पचास रुपये हुए* حرفيًا «في المجموع، جاءت مئتان وخمسون روبية».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: تقول الهندية *कार्ड से पेमेंट करना* («الدفع بالبطاقة») و*नकद पेमेंट करना*؛ و*से* تدل على وسيلة الدفع.
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: '*यहाँ* («هنا») تحدد المكان، و*सकता हूँ* («أستطيع») تأتي بعد العبارة الرئيسية؛ وتقول المرأة *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*आप ... करेंगे* سؤال مستقبل مهذب يستخدمه أمين الصندوق، و*आप* يأخذ الفعل بصيغة الجمع *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: الفاتورة
    gloss: الفاتورة
    note: '*बिल* اسم مذكر: *एक बिल*، *बिल का*.'
    example_gloss: هل نقسّم الفاتورة؟
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: '*बाँट लें?* («هل نقسمها؟») تقترح خطة مشتركة دون ذكر *हम*؛ و*लें* هي صيغة «لنفعل» من *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: '*अलग से* تعني «بشكل منفصل» وتأتي قبل *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: الباقي
    gloss: الباقي
    note: '*बाकी पैसे* («المال المتبقي») جمع ويعني الباقي الذي تستعيده.'
    example_gloss: تفضّل، هذا هو الباقي.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: تسليم الباقي
    gloss: تفضّل، هذا هو الباقي.
    note: '*आपके* هي «لك» المهذبة (*आप* + *के*)، وتتوافق مع الجمع *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: '*मुझे ... नहीं चाहिए* («لي ... غير مطلوب») هي طريقة الهندية لقول «لا أحتاج»؛ و*नहीं* تأتي قبل *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
