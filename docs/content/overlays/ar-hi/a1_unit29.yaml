    gloss: ثلاثمئة وخمسون
    note: '*तीन सौ पचास* هو 350: تُقال المئات أولًا ثم العشرات.'
    example_gloss: ثمنه ثلاثمئة وخمسون روبية.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان من الثالي وكوبان من الشاي. المجموع: ثلاثمئة وخمسون روبية. الدفع: بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      बिल: فاتورة
      दो: اثنان
      थाली: أطباق ثالي
      चाय: أكواب شاي
      कुल: المجموع
      तीन: ثلاثة
      सौ: مئة
      पचास: خمسون
      रुपये: روبيات
      पेमेंट: دفع
      कार्ड: بطاقة
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: بريا تطلب الفاتورة
    gloss: 'بريا: هل نطلب الفاتورة؟'
    note: '*माँग लें?* («هل نطلبها؟») تستخدم صيغة «لنفعل» من *लेना* مرة أخرى، و*माँगना* تعني «طلب».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: أرجون يسأل عن المجموع
    gloss: 'أرجون: نعم، فكرة جيدة. كم المجموع؟'
    note: '*कुल कितना हुआ?* هو سؤال المجموع الذي مرّ سابقًا، ويُطرح الآن على المائدة.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: بريا تذكر المجموع
    gloss: 'بريا: المجموع ثلاثمئة وخمسون روبية. هل نقسمها؟'
    note: '*तीन सौ पचास रुपये हुए* تذكر المجموع، و*बाँट लें?* تسأل «هل نقسمها؟»'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: أرجون يصرّ على الدفع
    gloss: 'أرجون: لا، دعيني أدفع اليوم. لقد ساعدتِني كثيرًا.'
    note: '*मुझे पेमेंट करने दो* تعني «دعني أدفع»، و*तुमने मेरी बहुत मदद की है* تستخدم *ने* لأن الفعل في الماضي.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: بريا متأثرة
    gloss: 'بريا: ما ألطفك! شكرًا جزيلًا.'
    note: '*तुम कितने अच्छे हो!* («ما أطيبك») مجاملة دافئة، و*शुक्रिया* تعني «شكرًا».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: أرجون يسأل عن الدفع بالبطاقة
    gloss: 'أرجون: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يُستخدم السؤال *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* مرة أخرى، لكن الآن في مطعم حقيقي.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: يدفع'
    gloss: أرجون يدفع الفاتورة.
    note: '*देता है* هي صيغة *वह* من *देना* («يعطي»)؛ وتقول الهندية «يعطي الفاتورة» بمعنى «يدفع الفاتورة».'
