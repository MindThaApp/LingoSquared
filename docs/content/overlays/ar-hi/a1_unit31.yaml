teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: طويل وقصير
    gloss: طويل / قصير
    note: '*लंबा* و*छोटा* تصفان الطول، وتأتيان عادةً مع *कद* («القامة»): *नेहा का कद लंबा है*. وتنتهيان بـ *-ा* مع الاسم المذكر وبـ *-ी* مع المؤنث.'
    example_gloss:
    - نيها طويلة.
    - فيكرم قصير.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: '*बूढ़ा* و*जवान* تصفان كم يبدو الشخص كبيرًا في السن دون ذكر أي رقم.'
    example_gloss:
    - الجد كبير في السن.
    - أرجون شاب.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र و बूढ़ा
    gloss: كم عمرك؟ الجد مسنّ.
    note: للسؤال عن العمر بدقة تستعمل الهندية *उम्र* («العمر»)، أما *बूढ़ा* فتصف الشخص المسنّ دون ذكر رقم.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: نيها طويلة وفيكرم قصير
    gloss: نيها طويلة وفيكرم قصير.
    note: '*और* («و») تربط بين الوصفين، وكل *का कद* تتفق مع *कद* المذكر.'
  hi.a1.unit31.lesson02.teach.bal:
    title: الشعر
    gloss: الشعر
    note: '*बाल* («الشعر») مذكر وجمع في الهندية، لذلك تنتهي الصفات التي تصفه بـ *-े*: *लंबे बाल*.'
    example_gloss: شعر أرجون قصير أسود.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: أشقر وبني وأبيض
    gloss: أشقر / بني / أبيض
    note: 'ثلاثة ألوان للشعر: *सुनहरे* و*भूरे* و*सफ़ेद*؛ وقبل *बाल* تنتهي بـ *-े*.'
    example_gloss:
    - شعر بريا أشقر.
    - شعر فيكرم بني.
    - شعر الجد أبيض.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*लंबे* («طويل») و*छोटे* («قصير») تصفان الشعر، وتنتهيان بـ *-े* لأن *बाल* جمع.'
    example_gloss:
    - شعر نيها طويل.
    - شعر فيكرم قصير.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: الصفات قبل बाल
    gloss: شعر طويل، شعر قصير، شعر ذهبي، شعر بني، شعر أبيض، شعر أسود.
    note: '*बाल* مذكر جمع، لذا تنتهي الصفة التي قبله بـ *-े*: *लंबे बाल*، *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: له أو لها'
    gloss: شعره أو شعرها طويل.
    note: '*उसके* تعني «له» و«لها» معًا، فالسياق وحده يحدد المقصود؛ وهنا تتفق مع *बाल* الجمع.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: شعر أرجون قصير أسود
    gloss: شعر أرجون قصير أسود.
    note: تُستعمل *काले* هنا مرة أخرى للشعر، وتنتهي بـ *-े* لأن *बाल* جمع.
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: شعر بريا طويل أشقر
    gloss: شعر بريا طويل أشقر.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: العيون
    gloss: العيون
    note: '*आँखें* («العينان/العيون») اسم مؤنث جمع؛ والمفرد *आँख*.'
    example_gloss: عينا أرجون بنيتان.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: 'ثلاثة ألوان للعينين: *नीला* و*भूरा* و*हरा*؛ وقبل *आँखें* المؤنثة تصبح *नीली* و*भूरी* و*हरी*.'
    example_gloss:
    - عينا بريا زرقاوان.
    - عينا فيكرم بنيتان.
    - عينا نيها خضراوان.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: الصفات قبل आँखें
    gloss: عينان زرقاوان، عينان بنيتان، عينان خضراوان.
    note: '*आँखें* مؤنث، لذا تنتهي الصفة التي قبله بـ *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: كيف يبدو مظهر بريا؟
    gloss: كيف يبدو مظهر بريا؟
    note: '*कैसी दिखती है?* («كيف يبدو مظهرها؟») هو السؤال الأساسي: *कैसी* و*दिखती* بصيغة المؤنث للمرأة، و*कैसा* و*दिखता* بصيغة المذكر للرجل.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: بريا شعرها طويل أشقر وعيناها زرقاوان
    gloss: شعر بريا طويل أشقر وعيناها زرقاوان.
    note: 'إجابة نموذجية: الشعر والعينان مربوطان بـ *और*. ويأخذ صاحب الصفة *के* مع *बाल* الجمع و*की* مع *आँखें* المؤنث.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: بريا تقدّم نينا
    gloss: 'بريا: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها نينا.'
    note: '*आ रही है* («قادمة») تقدّم شخصًا جديدًا، و*उसका नाम ... है* تذكر الاسم.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: أرجون يسأل عن مظهرها
    gloss: 'أرجون: حسنًا! كيف تبدو؟'
    note: '*वह देखने में कैसी है?* تسأل «كيف تبدو للناظر؟»؛ و*वह* تعني «هو» و«هي» معًا.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: بريا تصف قامة نينا وشعرها
    gloss: 'بريا: قامتها قصيرة وشعرها قصير أشقر.'
    note: 'تجمع هذه الجملة بين القامة والشعر: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: أرجون يسأل عن عينيها
    gloss: 'أرجون: وعيناها؟'
    note: '*उसकी आँखें* تعني «عيناها»؛ و*उसकी* بصيغة المؤنث لتتفق مع *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: بريا تصف عيني نينا
    gloss: 'بريا: عيناها خضراوان.'
    note: تنتهي *हरी* بـ *-ी* لأن *आँखें* مؤنث.
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: أرجون سيتعرّف عليها
    gloss: 'أرجون: شكرًا! إذن سأتعرّف عليها.'
    note: '*पहचान लूँगा* («سأتعرّف على») هو المستقبل من *पहचानना*، و*उसे* تعني «ها» أي «عليها».'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: مقارنة بين فيكرام ونيها
    gloss: فيكرام ونيها أخ وأخت، لكنهما يبدوان مختلفين. فيكرام قصير القامة، شعره قصير بنّي وعيناه بنّيتان. نيها أطول من فيكرام، وشعرها طويل بنّي وعيناها خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      भाई: أخ
      बहन: أخت
      दिखते: مظهر
      अलग: مختلف
      छोटा: قصير
      छोटे: قصير
      भूरे: بني
      बाल: الشعر
      भूरी: بني
      आँखें: العيون
      लंबी: أطول
      लंबे: طويل
      हरी: أخضر
      कैसे: كيف (كما في «كيف تبدو»)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: المقارنة باستخدام से
    gloss: فيكرام أقصر من نيها.
    note: 'تعني *से* هنا «من» في المقارنة، وتأتي بعد الشخص الذي تُقارن به: *नेहा से छोटा*، ويأتي الصفة قبل الفعل مباشرة.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: شعر نيها أطول من شعر فيكرام
    gloss: شعر نيها أطول من شعر فيكرام.
    note: تتوافق *लंबे* مع الجمع *बाल*، وتعبّر *विक्रम से* عن المقارنة.
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: '*मेरे बाल छोटे और भूरे हैं* («شعري قصير وبنّي») جملة نموذجية لوصف نفسك؛ وتتوافق *मेरे* مع الجمع *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: أرجون ينتبه إلى نينا
    gloss: 'أرجون: انظري، هل هذه نينا؟ شعرها قصير أشقر وعيناها خضراوان.'
    note: '*देखो* («انظر») هو صيغة الأمر غير الرسمية الموجّهة إلى صديق.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: بريا تؤكد
    gloss: 'بريا: نعم، إنها نينا!'
    note: تأكيد قصير وطبيعي.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: نينا تحيّي أرجون
    gloss: 'نينا: مرحبًا، هل أنت أرجون؟'
    note: '*क्या तुम अर्जुन हो?* سؤال بسيط غير رسمي لشخص في مثل عمرك.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: أرجون يردّ التحية على نينا
    gloss: 'أرجون: نعم! سررت بلقائك يا نينا.'
    note: '*तुमसे मिलकर अच्छा लगा* هي العبارة المعتادة عند لقاء شخص للمرة الأولى؛ فالشعور يحدث «لك»، لذلك لا حاجة إلى كلمة «أنا».'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: نينا تردّ التحية
    gloss: 'نينا: تشرفت بمعرفتك أنا أيضًا!'
    note: تختتم الحوار -- فقد تعرّف أرجون على نينا بنجاح من وصف بريا السابق.
