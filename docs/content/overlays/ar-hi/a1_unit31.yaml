  description: 'هندية للمبتدئين لوصف المظهر الجسدي الأساسي للشخص: انطباعات الطول والعمر، ولون الشعر والعينين، والسؤال الأساسي *कैसा दिखता है?*، ومقارنة مظهر شخصين.'
