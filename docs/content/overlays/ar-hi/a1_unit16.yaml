  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: إعادة استخدام قاعدة الأمر بـ -o'
    gloss: تتبع 'Karo' قاعدة الأمر نفسها للمخاطب tum التي مرّت سابقًا ('jao' و'muro' و'batao' و'gino' -- كلها تنتهي بـ '-o'). وهي هنا مبنية من 'karna' ('maaf karna' في الوحدة 11)، فجذرها 'kar' مع '-o' يعطي 'karo' بمعنى «افعل!». و'Aaraam karo' تعني «استرح!».
    note: توسيع مباشر وصريح لقاعدة الأمر التي سبق تعلّمها، مطبّق على فعل يعرفه المتعلّم بصيغة المصدر.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: استرح!
    gloss: استرح!
    note: صيغة الأمر الجديدة مطبّقة على أول نصيحة في هذه الوحدة.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: استرح واذهب إلى الطبيب.
    gloss: استرح واذهب إلى الطبيب.
    note: يجمع بين نصيحتَي هذا الدرس في تعليمة طبيعية واحدة، تمهيدًا لبطاقة القراءة في الدرس 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: بريا تسأل أرجون إن كان بخير
    gloss: يا أرجون، هل أنت بخير؟
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: أرجون يقول إنه يعاني من صداع وحمّى
    gloss: لا، عندي صداع وحمّى.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: بريا تقول له إنه يحتاج إلى الراحة
    gloss: هذا ليس جيدًا. أنت تحتاج إلى الراحة.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: أرجون يريد دواءً أيضًا
    gloss: نعم، لكنني أحتاج إلى دواء أيضًا.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: بريا تقول له إن عليه أن يذهب إلى الطبيب
    gloss: حسنًا. عليك أن تذهب إلى الطبيب.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: أرجون يشكر بريا
    gloss: حسنًا، شكرًا.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: بريا تطلب منه أن يرتاح
    gloss: استرح!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: أرجون يوافق
    gloss: حسنًا.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسية
    gloss: 'القواعد الرئيسية الثلاث في هذه الوحدة: (1) ''mujhe/tumhein + العَرَض + hai'' للتعبير عن المرض (مثل ''mujhe bukhar hai'')؛ (2) ''tumhein/mujhe + الشيء + chahiye'' للتعبير عن الحاجة (مثل ''tumhein aaraam chahiye'')؛ (3) ''X ke paas jana hai'' لبيان الشخص الذي يجب الذهاب إليه (مثل ''doctor ke paas jana hai'').'
    note: ملخص ختامي يجمع قواعد الوحدة كلها في مكان واحد.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: قراءة بعض النصائح
    gloss: استرح. اذهب إلى الطبيب.
    note: نصيحة قصيرة ومباشرة، كما تُقال في الحديث اليومي، وتعيد ما ورد في الحوار دون إضافة جديدة.
    glosses:
      आराम: ارتح
      करो: افعل (أمر، من करना)
      डॉक्टर: طبيب
      जाओ: اذهب (أمر، من जाना)
