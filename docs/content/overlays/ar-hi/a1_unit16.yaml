  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + العَرَض + hai
    gloss: 'سبق أن تعلّمنا ''Mujhe + اسم + hai'' في الوحدة 11 (''mujhe kaam hai'' = لديّ عمل). والآن يُستخدم أيضًا للأعراض: ''mujhe sir dard hai'' تعني «لديّ صداع» -- ''sir dard'' (sir = رأس، dard = ألم) معًا تعني «صداع». ليست هذه قاعدة جديدة، بل هي النمط نفسه الذي عرفناه.'
    note: يعرض استخدامًا ثانيًا لتركيب سبق تعلّمه (المفعول له + اسم + hai)، مع ذكر الوحدة السابقة قبل تطبيقه على الأعراض.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = لديّ عمل)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''لديّ صداع'' -- ''सिर दर्द'' (सिर = رأس, दर्द = ألم) एक साथ मिलकर ''صداع'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: الحمّى
    gloss: حمّى
    note: اسم جديد، وهو ثاني عَرَض في هذه الوحدة.
    example_gloss: هل لديك حمّى؟
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: لديّ حمّى.
    gloss: عندي حمّى.
    note: التركيب نفسه (المفعول له + اسم + hai) مطبّقًا على ثاني عَرَض في هذا الدرس.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'مراجعة: لك، الذهاب'
    gloss: لك / من أجلك، الذهاب
    note: سبق تعلّم الكلمتين (الوحدة 6 والوحدة 15) -- وتُعاد هنا للحديث عن الذهاب إلى الطبيب.
    example_gloss:
    - ماذا تريد؟
    - عليّ أن أذهب إلى المحطة.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'مراجعة: قرب / عند'
    gloss: قرب / عند (مكان)
    note: سبق تعلّمها في الوحدة 8 -- وتُعاد هنا، ويُضاف لها معنى ثالث في ملاحظة القواعد الخاصة بهذا الدرس.
    example_gloss: البنك قرب المدرسة.
  hi.a1.unit16.lesson02.teach.doctor:
    title: الطبيب
    gloss: طبيب
    note: اسم جديد، وهو الموضوع الرئيسي لهذا الدرس.
    example_gloss: الطبيب جيد.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: عليّ أن أذهب إلى الطبيب.
    gloss: أحتاج إلى الذهاب إلى الطبيب.
    note: يجمع بين *ke paas* وتركيب الوجوب *mujhe...jana hai* من الوحدة 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: معنى ثالث'
    gloss: 'سبق أن تعلّمنا معنيَي ''Ke paas'' الأولين -- القرب (الوحدة 8: ''bank school ke paas hai'') والملكية (الوحدة 2: ''mere paas ek kitab hai''). والآن استخدام ثالث: الذهاب إلى شخص، أي الذهاب لمقابلته -- ''doctor ke paas jana hai'' تعني «عليّ أن أذهب إلى الطبيب». كما يتكرر هنا تركيب ''mujhe...jana hai'' من الوحدة 15.'
    note: يذكر المعنيين السابقين برقم الوحدة قبل تقديم المعنى الثالث، ويشير إلى إعادة استخدام تركيب الوجوب.
