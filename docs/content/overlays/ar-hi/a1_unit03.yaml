    title: ذكر اليوم والتاريخ كاملين
    gloss: الحصة القادمة يوم الثلاثاء، العاشر من مارس.
    note: 'يُذكر يوم الأسبوع مع التاريخ معًا: اليوم أولًا ثم رقم التاريخ ثم الشهر، وهو ترتيب يختلف عن العربية التي تقول عادةً «العاشر من مارس» بصيغة ترتيبية.'
