    gloss: في — تُستخدم مع اسم الشهر
    note: 'تحدد *Mein* الشهر كما تحدد *ko* اليوم: *janvari mein* تعني «في يناير»، وليس *janvari ko* أبدًا.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
