    title: أرجون يسأل عن الحصة القادمة
    gloss: أرجون يسأل متى حصة اليوغا القادمة.
    note: يعيد سؤال هذا الدرس نفسه مع إضافة yog للتوضيح.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: بريا تذكر اليوم والتاريخ
    gloss: بريا تقول إن الحصة القادمة يوم الثلاثاء، العاشر من مارس.
    note: يعيد جملة اليوم والتاريخ في هذا الدرس نفسها.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: أرجون يشكرها
    gloss: 'أرجون يقول: حسنًا، شكرًا.'
    note: تعيد Theek hai وshukriya مفردات من الوحدة 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: بريا تردّ
    gloss: بريا تقول إنه لا داعي للشكر.
    note: Koi baat nahin عبارة طبيعية وشائعة جدًا بمعنى «عفوًا» أو «لا مشكلة».
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: أرجون يسأل بريا عن عيد ميلادها
    gloss: أرجون يسأل متى عيد ميلاد بريا.
    note: يعيد سؤال عيد الميلاد غير الرسمي في هذا الدرس نفسه.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: بريا تجيب
    gloss: بريا تقول إن عيد ميلادها في يناير.
    note: يعيد جملة الجواب في هذا الدرس نفسها.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: أرجون يتفاعل ويذكر عيد ميلاده
    gloss: أرجون يتفاعل بإيجابية، ثم يقول إن عيد ميلاده في ديسمبر.
    note: تعيد Accha مفردات الوحدة 1؛ أما ديسمبر فقد سبق تعلّمه في الدرس 2 من هذه الوحدة.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: بريا تنهي المحادثة
    gloss: بريا توافق وتقول «إلى اللقاء» بأسلوب ودّي.
    note: تعيد Theek hai وphir milte hain مفردات التوديع من الوحدة 1.
