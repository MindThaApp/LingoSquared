    title: التاريخ
    gloss: تاريخ
    note: '*Tareekh* اسم مؤنث، لذا تأخذ أداة السؤال عنه الصيغة المؤنثة (*kitni tareekh* وليس *kitna tareekh*)، وهو نمط التوافق نفسه الذي تعلّمته في الوحدة 2 مع *keemat* و*umra*.'
    example_gloss: اليوم الثالث من الشهر.
  hi.a1.unit03.lesson02.teach.mein_postposition:
