teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: معطف، سترة صوفية
    gloss: المعطف، السترة الصوفية
    note: '*जैकेट* مؤنثة و*स्वेटर* مذكر، ويظهر ذلك في الكلمات المصاحبة لهما: *मेरी जैकेट*، *मेरा स्वेटर*.'
    example_gloss:
    - أبحث عن معطف.
    - عندي سترة صوفية.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: سروال، أحذية
    gloss: السروال، الأحذية
    note: '*पैंट* كلمة واحدة تدل على بنطال واحد (*मेरी पैंट*)، و*जूते* جمع *जूता*: الاسم المذكر المنتهي بـ *-आ* يتحول إلى *-ए* في الجمع.'
    example_gloss:
    - أنا أبحث عن بنطال.
    - أبحث عن أحذية.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: قول ما تبحث عنه
    gloss: أبحث عن معطف.
    note: 'يأتي الفعل في آخر الجملة: *मैं एक जैकेट ढूँढ़ रहा हूँ*. تعطي *रहा हूँ* معنى الفعل المستمر «أبحث» (يحدث الآن)، و*रहा* صيغة المذكر (وتقول المرأة *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: المقاس
    gloss: المقاس
    note: '*साइज़* اسم مذكر، لذلك تكون الكلمات المصاحبة له مذكرة أيضًا: *मेरा साइज़*.'
    example_gloss: ما مقاسك؟
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: السؤال عن المقاس
    gloss: ما مقاسك؟
    note: '*कौन सा* («أيّ») تسأل عن خيار واحد من مجموعة، وتتوافق *सा* مع الاسم: *कौन सा साइज़* لكن *कौन सी जैकेट*. و*आप* هي صيغة «أنت» المهذبة لبائع المتجر.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: ذكر مقاسك
    gloss: مقاسي M.
    note: 'لا تستخدم الهندية فعلًا بمعنى «يملك» هنا: *मेरा साइज़ एम है* تعني حرفيًا «مقاسي M»، وتتوافق *मेरा* مع الاسم المذكر *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: أسود، أزرق
    gloss: أسود، أزرق
    note: صفتا اللون الأساسيتان في هذا الدرس.
    example_gloss:
    - أريد المعطف باللون الأسود.
    - هل لديكم هذا أيضًا باللون الأزرق؟
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: طلب لون معيّن
    gloss: أريد المعطف باللون الأسود.
    note: '*मुझे ... चाहिए* هي طريقة الهندية للتعبير عن «أريد»: الرغبة تقع «عليّ» (*मुझे*)، ويأتي الشيء المطلوب مباشرة قبل *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: السؤال عن لون آخر
    gloss: هل لديكم هذا أيضًا باللون الأزرق؟
    note: '*आपके पास ... है?* («عندك ... ؟» حرفيًا «لديك ... ؟») هي الطريقة المهذبة للسؤال «هل لديك ...؟»، وتأتي *भी* («أيضًا») بعد الكلمة التي تضيفها.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: السؤال عن مناسبة المقاس
    gloss: هل يناسبك هذا المعطف؟
    note: 'تقول الهندية عن الملابس إنها «تأتي مناسبة»: *ठीक आती है*. يتوافق الفعل مع الشيء، فمع *जैकेट* المؤنثة نقول *आती*، ومع *स्वेटर* المذكر نقول *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: تأكيد أن المقاس مناسب
    gloss: يناسبني تمامًا.
    note: '*एकदम* («تمامًا») تجعل المعنى «مناسب تمامًا»؛ و*आती है* تتوافق مع *जैकेट* المؤنثة.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: صغير جدًا
    gloss: إنه صغير جدًا.
    note: 'تأتي *बहुत* قبل الصفة وتعطي هنا معنى «أكثر من اللازم»: *बहुत छोटी*. وتتوافق الصفة مع *जैकेट* المؤنثة.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: كبير جدًا
    gloss: إنه كبير جدًا.
    note: 'النمط نفسه مع *बड़ी*: تتحول *बड़ा* إلى *बड़ी* مع الاسم المؤنث، فنقول *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: تسعمئة
    gloss: تسعمئة
    note: '*नौ सौ* هو العدد 900، ويُستخدم في سعر المعطف.'
    example_gloss: سعر المعطف تسعمئة روبية.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: ذكر السعر
    gloss: سعر المعطف تسعمئة روبية.
    note: 'تقول الهندية «سعرُ المعطف ...»: *जैकेट की कीमत नौ सौ रुपये है*. تتوافق *की* مع *कीमत* المؤنثة وليس مع *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: اقرأ إيصال متجر
    gloss: 'معطف شتوي: المقاس M، اللون أسود. السعر: تسعمئة روبية. هذا المعطف مناسب تمامًا ودافئ.'
    note: تتبّع المقاس واللون والسعر والصفتين المذكورتين عن المعطف.
    glosses:
      सर्दी: معطف شتوي
      साइज़: المقاس
      रंग: لون
      काला: أسود
      कीमत: سعر
      नौ: تسع
      सौ: مئة
      रुपये: روبيات
      जैकेट: معطف
      आती: يناسب
      गर्म: دافئ
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: بريا تلاحظ المعطف
    gloss: 'بريا: هذا المعطف جميل! ما مقاسك؟'
    note: تتوافق *अच्छी* مع *जैकेट* المؤنثة. و*तुम्हारा* هي «your» غير الرسمية، تُستخدم بين الأصدقاء.
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: أرجون يطلب تجربته
    gloss: 'أرجون: مقاسي M. هل يمكنني تجربته؟'
    note: '*पहनकर देखना* («يلبس ويرى») هي طريقة الهندية للتعبير عن «يجرّب ارتداء». و*सकता हूँ* تعني «أستطيع» أو «يمكنني»، وتقول المرأة *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: بريا تسأل عن القياس
    gloss: 'بريا: بالطبع. هل هو مناسب؟'
    note: '*यह* تعني «هو/هذا»، وتتوافق *आती* مع *जैकेट* المؤنثة.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: أرجون يؤكد
    gloss: 'أرجون: نعم، إنه مناسب تمامًا وهو دافئ أيضًا.'
    note: يطابق تمامًا الإيصال الذي قرأته سابقًا، فهذا هو المعطف نفسه.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: بريا تسأل عن اللون
    gloss: 'بريا: رائع! هل ستأخذه باللون الأسود أم الأزرق؟'
    note: '*या* («أو») تعرض خيارًا. ويمكن حذف *रंग* الثانية: *काले रंग में ... या नीले में*. و*तुम* غير رسمية.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: أرجون يقرّر
    gloss: 'أرجون: سآخذه باللون الأسود.'
    note: '*लूँगा* هو المستقبل من *लेना* («يأخذ»)، وهو الفعل المعتاد للتعبير عن قرار الشراء في المتجر. وتقول المرأة *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ ولेता है
    gloss: أنا آخذ، هو يأخذ.
    note: '*-ता* هي لاحقة العادة وتتوافق مع الفاعل، أما *हूँ* فتأتي مع *मैं* و*है* تأتي مع *वह*.'
