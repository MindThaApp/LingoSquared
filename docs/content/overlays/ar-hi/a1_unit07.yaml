teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: متجر، سوق
    gloss: متجر، سوق
    note: مكانان شائعان لشراء الأشياء، يرد ذكرهما في هذه الوحدة كلها.
    example_gloss:
    - هذا متجر.
    - هذا سوق.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: البائع
    gloss: البائع
    note: شخصية جديدة في هذه الوحدة -- من يدير المتجر، ويُخاطَب بـ aap لأنه شخص غريب.
    example_gloss: هذا هو البائع.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: قميص، حقيبة، قبعة
    gloss: قميص، حقيبة، قبعة
    note: ثلاثة أشياء شائعة في التسوق، تُستخدم في هذه الوحدة للتدرب على نمط *mujhe ... chahiye* من وحدة الطعام.
    example_gloss:
    - أريد قميصًا.
    - أريد حقيبة.
    - أريد قبعة.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: أريد هذا
    gloss: أريد هذا.
    note: عبارة عامة للتعبير عن رغبتك في غرض ما، تعيد استخدام *mujhe ... chahiye* من وحدة الطعام مع *yah* (هذا).
  hi.a1.unit07.lesson01.teach.ji:
    title: جي (لقب احترام)
    gloss: أداة احترام وتأدب، مثل إضافة «سيدي» أو «سيدتي»
    note: تُضاف بعد الاسم أو اللقب لتبدو أكثر تهذيبًا، وهي شائعة عند مخاطبة شخص غريب مثل البائع.
    example_gloss: مرحبًا أيها البائع.
  hi.a1.unit07.lesson01.teach.sirf:
    title: فقط
    gloss: فقط
    note: تُستخدم للقول إنك تريد شيئًا واحدًا فقط، لا عدة أشياء.
    example_gloss: أريد قميصًا واحدًا فقط.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: هل تريد شيئًا آخر؟ (رسمي)
    gloss: هل تريد شيئًا آخر؟
    note: سؤال المتابعة الرسمي الطبيعي الذي يطرحه البائع بعد تلبية جزء من الطلب، ويعيد استخدام *aapko* و*chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: لا، هذا فقط
    gloss: لا، هذا فقط.
    note: طريقة طبيعية ومهذبة لرفض المزيد من الأشياء، وتعيد استخدام *ji* و*sirf* من هذا الدرس.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: أخبرني بما تريد
    gloss: أخبرني بما تريده.
    note: عبارة تعليمات غير رسمية يستخدمها هذا المقرر لطلب إجابة شفهية، وهي تطابق نسخة وحدة الطعام.
  hi.a1.unit07.lesson02.teach.keemat:
    title: السعر
    gloss: السعر
    note: كلمة سبق أن وردت في محتوى الأرقام والأسعار في الوحدة 2، وتُعاد هنا في سياق التسوّق الخاص بهذه الوحدة.
    example_gloss: ما سعره؟
  hi.a1.unit07.lesson02.teach.rupaye:
    title: روبيّات
    gloss: روبيّات
    note: كلمة العملة التي وردت في الوحدة 2، وتُتدرَّب عليها الآن مع سعرين مختلفين.
    example_gloss:
    - سعره مئتا روبية.
    - سعره خمسمئة روبية.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: ما سعره؟
    gloss: ما سعره؟
    note: الطريقة المعتادة للسؤال عن السعر، وقد وردت في الوحدة 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: سعره مئتا روبية
    gloss: سعره مئتا روبية.
    note: مثال على إجابة لسؤال السعر أعلاه.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: تُستعمل 'Yah kitne ka hai?' للأشياء المذكّرة، و'Yah kitne ki hai?' للأشياء المؤنثة -- فكلمة *kitne* نفسها لا تتغير أبدًا -- والذي يتغير هو *ka/ki* فقط، وهو التبدّل نفسه بين a وi الذي تعرفه من *mera/meri* و*tumhara/tumhari*.
    note: طريقة ثانية شائعة جدًا للسؤال عن السعر، وهي مبنية على نمط المطابقة في الجنس الذي تعلمته في الضمائر الملكية -- فالذي يتغير هو أداة ka/ki فقط، لا kitne.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: بكم هذا؟ (مذكّر)
    gloss: بكم هذا؟
    note: تُستعمل مع غرض مذكّر، مثل الحقيبة.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: بكم هذه؟ (مؤنث)
    gloss: بكم هذا؟
    note: تُستعمل مع غرض مؤنث، مثل القبعة.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: رخيص، غالٍ
    gloss: رخيص، غالٍ
    note: زوج من الصفات الشائعة للتعليق على السعر، وتظهر هنا صيغتا المذكّر.
    example_gloss:
    - هذه الحقيبة رخيصة.
    - هذه الحقيبة غالية.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti و mehengi
    gloss: تتغير 'Sasta' و'mehenga' أيضًا بين المذكّر والمؤنث مثل 'mera/meri' -- فمع الكلمات المؤنثة نقول 'sasti' و'mehengi'، مثل 'yah topi sasti hai' (هذه القبعة رخيصة) أو 'yah kameez mehengi hai' (هذا القميص غالٍ).
    note: مثال ثانٍ حقيقي على نمط المطابقة في الجنس الذي ينبّه إليه هذا المقرر باستمرار.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: يشتري
    gloss: يشتري
    note: تعيد استخدام تركيب 'الفعل + na chahta/chahti hun' (أريد أن...) الذي ورد في الوحدة 1 عند تعلّم اليوغا، وتطبّقه هنا على الشراء.
    example_gloss:
    - أريد أن أشتري هذا القميص.
    - أريد أن أشتري هذه القبعة.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: هيا نشتري شيئًا!
    gloss: هيا نشتري شيئًا!
    note: عبارة ودّية ثابتة لاقتراح التسوّق معًا، وبها يبدأ حوار ختام هذه الوحدة، وهي تطابق عبارة 'chalo, kuch khate hain!' في وحدة الطعام.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: أرجون يقترح التسوّق
    gloss: يقترح أرجون أن يشتروا شيئًا.
    note: تعيد استخدام عبارة افتتاح هذه الوحدة.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: بريا توافق
    gloss: 'توافق بريا وتتساءل: قميص أم قبعة؟'
    note: تقدّم الكلمة *ya* (أو) لعرض الاختيار بين غرضين.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: البائع يرحّب بهما
    gloss: يحيّيهما البائع ويسأل عمّا يرغبان فيه.
    note: تحية رسمية بصيغة aap، وتعيد استخدام *aapko kya chahiye* من الدرس 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: بريا تسأل عن قميص
    gloss: تحيّي بريا البائع بأدب وتطلب قميصًا، ثم تسأل عن سعره.
    note: تجمع بين *ji* و*mujhe ... chahiye* و*iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: البائع يذكر السعر
    gloss: يقول البائع إن سعره ثلاثمئة روبية.
    note: تعيد استخدام نمط *iski keemat ... rupaye hai* مع رقم جديد.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: بريا تعلّق وتقرّر
    gloss: 'تقول بريا: ثلاثمئة روبية؟ هذا رخيص! أريد هذا القميص.'
    note: تعيد استخدام *sasti* من الملاحظة النحوية في الدرس 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: أرجون يسأل عن قبعة
    gloss: يقول أرجون إنه يريد قبعة، ويسأل عن سعرها.
    note: تعيد استخدام صيغة المؤنث *kitne ki hai* من الدرس 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: البائع يجيب
    gloss: يقول البائع إن القبعة بخمسمئة روبية.
    note: تعيد استخدام *paanch sau* (خمسمئة) من الدرس 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: أرجون يعلّق ويقرّر الشراء رغم ذلك
    gloss: 'يقول أرجون: خمسمئة روبية؟ هذا غالٍ! حسنًا، أريد هذه القبعة.'
    note: تعيد استخدام *mehengi* من الملاحظة النحوية في الدرس 2، ثم يقرّر الشراء رغم ذلك.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: البائع يسأل إن كان هذا كل شيء
    gloss: 'يقول البائع: حسنًا، هل تريد شيئًا آخر؟'
    note: تعيد استخدام *aapko aur kuch chahiye* من الدرس 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: بريا تنهي الطلب
    gloss: 'تقول بريا: لا، هذا فقط، شكرًا!'
    note: تعيد استخدام *ji nahin, sirf yah* من الدرس 1 مع *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: البائع يودّعهما
    gloss: 'يقول البائع: شكرًا، إلى اللقاء.'
    note: تعيد استخدام عبارة الختام المعتادة في هذا المقرر.
