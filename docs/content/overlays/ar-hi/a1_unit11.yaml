answer_policy:
  decline_pattern: This unit's decline pattern ("माफ़ करना, मैं व्यस्त हूँ। मुझे काम है।") deliberately avoids a new modal "can" construction, reusing already-established copula (हूँ) and dative-possession (मुझे...है) grammar instead. Accept the reason sentence with or without "मुझे काम है" attached -- both a bare "माफ़ करना, मैं व्यस्त हूँ।" and the fuller form with the reason are equally natural, complete declines.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized forms used anywhere in this unit are हूँ and हैं, both reused unchanged from their already-settled unit01/unit10 spellings. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to propose, accept, decline, or schedule their own plan, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
