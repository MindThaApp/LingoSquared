teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'مراجعة: الشاي والقهوة'
    gloss: شاي، قهوة
    note: مراجعة سريعة لكلمات المشروبات من الوحدة 6، وتُعاد هنا لاقتراح الخطط.
    example_gloss:
    - أريد شايًا.
    - أريد قهوة.
  hi.a1.unit11.lesson01.teach.filma:
    title: فيلم
    gloss: فيلم
    note: اسم جديد لموضوع وضع الخطط في هذه الوحدة.
    example_gloss: هذا الفيلم جيد.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: نشاهد / لنشاهد
    gloss: (نحن) نشاهد / لنشاهد
    note: صيغة الجمع للفعل المعتاد من 'dekhna' (يشاهد)، وتُستخدم هنا لاقتراح نشاط مشترك.
    example_gloss: نشاهد فيلمًا.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: لنشاهد فيلمًا!
    gloss: لنشاهد فيلمًا!
    note: '''Chalo'' + فعل معتاد بصيغة الجمع هي الطريقة اليومية لاقتراح فعل شيء معًا، وقد ظهرت عرضًا في الوحدات 1 و6 و7 (''chalo shuru karte hain'' و''chalo, kuch khaate hain'' و''chalo, kuch khareedte hain'')؛ وتعتمدها هذه الوحدة وتوسّع استخدامها.'
  hi.a1.unit11.lesson01.teach.saath:
    title: معًا
    gloss: معًا
    note: تُستخدم لاقتراح القيام بنشاط مشترك.
    example_gloss: لنشاهد فيلمًا معًا!
  hi.a1.unit11.lesson01.teach.peena:
    title: نشرب / لنشرب
    gloss: (نحن) نشرب / لنشرب
    note: صيغة الجمع للفعل المعتاد من 'peena' (يشرب)، وهي بالنمط نفسه مثل 'dekhte hain'.
    example_gloss: نشرب الشاي.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: لنشرب الشاي معًا!
    gloss: لنشرب الشاي معًا!
    note: تجمع 'saath' و'peete hain' من هذا الدرس في اقتراح ثانٍ، بنمط 'chalo' نفسه الذي في اقتراح الفيلم.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + فعل-te + hain = لنفعل ___
    gloss: 'لاقتراح فعل شيء معًا قل ''chalo'' + فعل-te + hain: لنشاهد فيلمًا! لنشرب الشاي معًا!'
    note: يعرض النمط كاملًا بوضوح، ويُرسّخ ما ظهر عرضًا ثلاث مرات في الوحدات السابقة.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: فكرة جيدة!
    gloss: فكرة جيدة!
    note: طريقة جاهزة لقبول اقتراح بحماس.
  hi.a1.unit11.lesson02.teach.vyast:
    title: مشغول
    gloss: مشغول
    note: صفة جديدة، تُستخدم مع فعل الكينونة المعروف (hoon/ho/hai) للدلالة على عدم التفرغ.
    example_gloss: أنا مشغول اليوم.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: آسف / عذرًا
    gloss: آسف / عذرًا
    note: عبارة مهذبة ثابتة، تُستخدم لتخفيف وقع الرفض.
    example_gloss: آسف، أنا مشغول.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: آسف، أنا مشغول.
    gloss: آسف، أنا مشغول.
    note: جملة الرفض الأساسية، وتجمع بين العبارتين الجديدتين في هذا الدرس.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: لديّ عمل.
    gloss: لديّ عمل.
    note: تعيد استخدام نمط 'mujhe...hai' (لديّ...) الشبيه بنمط 'mujhe...chahiye' (أريد/أحتاج) الذي سبق، وهنا تُذكر به سبب الرفض.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: كيف ترفض بلطف
    gloss: لرفض خطة بلطف، قل 'maaf karna' (آسف) ثم اذكر وضعك (مثل «أنا مشغول») أو السبب (مثل «لديّ عمل»).
    note: يعيد عمدًا استخدام قواعد سبق تعلمها (فعل الكينونة ونمط الملكية بالمفعول غير المباشر) بدل تقديم تركيب جديد لـ«يستطيع».
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: نحن
    gloss: نحن
    note: 'هذا أول ضمير رسمي للمتكلمين الجمع (نحن) في الدورة. صيغة المضارع الاعتيادي معه (-te + hain) هي نفسها التي سبق تعلمها مع ve (هم) — فلا تصريف جديد، بل ضمير جديد فقط. (أما tum فيأخذ -te أيضًا لكن مع ''ho'': tum milte ho.)'
    example_gloss: نلتقي كل يوم.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: متى نلتقي؟
    gloss: متى نلتقي؟
    note: يجمع بين 'hum' و'kab' (الوحدة 10) و'milte hain' (المستخدمة منذ عبارات الختام في الوحدة 1، حيث كان الفاعل يُحذف غالبًا).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'مراجعة: السبت، الأحد'
    gloss: السبت، الأحد
    note: مراجعة سريعة لاسمين من أيام الأسبوع وردا في الوحدة 3، نحتاجهما لتحديد موعد.
    example_gloss:
    - اليوم هو السبت.
    - غدًا الأحد.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'مراجعة: الساعة الرابعة، كم الساعة'
    gloss: الساعة الرابعة، كم الساعة
    note: مراجعة سريعة لكلمات الوقت من الوحدة 4، نحتاجها لتحديد موعد.
    example_gloss:
    - الساعة الآن الرابعة.
    - كم الساعة الآن؟
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: هل يوم الأحد مناسب؟
    gloss: هل يوم الأحد مناسب؟
    note: يعيد استخدام 'kya' أداةً لأسئلة نعم/لا، كما ورد منذ الوحدة 1 ('kya yeh tumhari pahli baar hai?'، '«kya tum yoga karti ho»?')، بدلًا من أداة استفهام جديدة عن اليوم.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: الرسالة
    gloss: رسالة
    note: اسم جديد، يُستخدم في الجزء الخاص بالدعوة المكتوبة في هذا الدرس.
    example_gloss: هذه رسالة أرجون.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: أرجون يقترح مشاهدة فيلم يوم السبت
    gloss: بريا، هيا نشاهد فيلمًا يوم السبت؟
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: بريا تعتذر وتذكر السبب
    gloss: آسفة، أنا مشغولة يوم السبت. لدي عمل.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: أرجون يسأل متى يمكنهما اللقاء
    gloss: حسنًا. متى نلتقي؟
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: بريا تقترح يوم الأحد بدلًا من ذلك
    gloss: هل يوم الأحد مناسب؟ هيا نشرب الشاي معًا!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: أرجون يوافق ويسأل عن الوقت
    gloss: فكرة جيدة! في أي ساعة يوم الأحد؟
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: بريا تقترح وقتًا
    gloss: هل الساعة الرابعة مناسبة؟
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: أرجون يؤكد
    gloss: نعم، الساعة الرابعة مناسبة. إلى اللقاء إذن!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: بريا تختم الحوار
    gloss: حسنًا، نلتقي يوم الأحد!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: رسالة بريا
    gloss: مرحبًا أرجون، هيا نلتقي يوم الأحد في الساعة الرابعة ونشرب الشاي. اتفقنا؟ - بريا
    note: دعوة مكتوبة قصيرة تعيد ذكر الخطة التي أكدها الحوار للتو.
    glosses:
      चलो: هيا
      रविवार: الأحد
      मिलते: نلتقي (من मिलना)
      चाय: شاي
      पीते: نشرب (من पीना)
      ठीक: حسنًا / مناسب
