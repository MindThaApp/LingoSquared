teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: صفر
    gloss: صفر
    note: نقطة الانطلاق لكل الأعداد في هذه الوحدة.
    example_gloss: درجة الحرارة اليوم صفر.
  hi.a1.unit02.lesson01.teach.ek:
    title: واحد
    gloss: واحد
    note: لكل عدد هندي من 11 إلى 99 كلمة خاصة به، ولا يُبنى على نمط «عشرة + واحد» كما في العربية (أحد عشر، واحد وعشرون)؛ ستلاحظ ذلك في الدرس الثاني، حيث لا تشترك बीस (20) وتीस (30) في أي جزء ظاهر مع एक (1) أو दो (2).
    example_gloss: عندي كتاب واحد.
  hi.a1.unit02.lesson01.teach.do:
    title: اثنان
    gloss: اثنان
    note: عدد بسيط وكثير الاستعمال، وهو أيضًا صيغة الأمر غير الرسمية لفعل «أعطِ»، لكن السياق يوضح المعنى دائمًا.
    example_gloss: لدي أخوان.
  hi.a1.unit02.lesson01.teach.teen:
    title: ثلاثة
    gloss: ثلاثة
    note: '*Chahiye* («مطلوب/لازم») تركيب غير شخصي شائع: *mujhe teen seb chahiye* تعني حرفيًا «لي ثلاث تفاحات [مطلوبة]»، وهي طريقة طبيعية جدًا للتعبير عن «أحتاج».'
    example_gloss: أحتاج إلى ثلاث تفاحات.
  hi.a1.unit02.lesson01.teach.chaar:
    title: أربعة
    gloss: أربعة
    note: لا شذوذ هنا -- chaar يسلك سلوك بقية الأعداد الصغيرة.
    example_gloss: لدي أربعة أصدقاء.
  hi.a1.unit02.lesson01.teach.paanch:
    title: خمسة
    gloss: خمسة
    note: تُكتب بعلامة الـ chandrabindu (पाँच) لا بالـ anusvara -- فعلامة حرف العلة aa (ा) لا ترتفع فوق الحرف، وهذا ما يستدعي chandrabindu بدل النقطة العادية، وهو النمط نفسه الذي رأيناه في हाँ/कहाँ في الوحدة 1.
    example_gloss: معي خمس روبيات.
  hi.a1.unit02.lesson01.teach.chhah:
    title: ستة
    gloss: ستة
    note: تُكتب أحيانًا छः في النصوص القديمة؛ أما छह فهي الكتابة الحديثة المعيارية.
    example_gloss: عندي ستة كتب.
  hi.a1.unit02.lesson01.teach.saat:
    title: سبعة
    gloss: سبعة
    note: عدد مفيد للحديث عن أيام الأسبوع.
    example_gloss: في الأسبوع سبعة أيام.
  hi.a1.unit02.lesson01.teach.aath:
    title: ثمانية
    gloss: ثمانية
    note: لا شذوذ هنا -- aath يسلك سلوك بقية الأعداد الصغيرة.
    example_gloss: في هذه الغرفة ثمانية كراسي.
  hi.a1.unit02.lesson01.teach.nau:
    title: تسعة
    gloss: تسعة
    note: لا حاجة هنا إلى علامة الغنّة، بخلاف بعض الأعداد المجاورة.
    example_gloss: يبدأ درس اليوغا في التاسعة صباحًا.
  hi.a1.unit02.lesson01.teach.das:
    title: عشرة
    gloss: عشرة
    note: آخر عدد في هذه المجموعة الأولى -- يتابع الدرس الثاني مع الأعداد من أحد عشر فصاعدًا وعقود العشرات، وهي لم تعد قابلة للتوقع من هنا.
    example_gloss: في يديّ عشرة أصابع.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: أحد عشر
    gloss: أحد عشر
    note: ابتداءً من هنا، لكل عدد هندي كلمته الشاذة الخاصة -- فكلمة gyaarah لا تحتوي بوضوح على das (10) ولا على ek (1) كما يحدث في العربية «أحد عشر». لا يوجد اختصار؛ يجب حفظ كل عدد على حدة.
    example_gloss: في هذا الصف أحد عشر طالبًا.
  hi.a1.unit02.lesson02.teach.baarah:
    title: اثنا عشر
    gloss: اثنا عشر
    note: عدد آخر يجب حفظه ببساطة -- لا يوجد نمط متوقع يربطه بـ do (2).
    example_gloss: في السنة اثنا عشر شهرًا.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: خمسة عشر
    gloss: خمسة عشر
    note: عدد شائع للحديث عن فترات زمنية قصيرة، مثل استراحة مدتها خمس عشرة دقيقة.
    example_gloss: أحتاج إلى خمس عشرة دقيقة.
  hi.a1.unit02.lesson02.teach.bees:
    title: عشرون
    gloss: عشرون
    note: كلمة جديدة تمامًا، لا تُبنى من das (10) وdo (2) -- وهذا النمط يستمر مع كل عقد من العقود التالية.
    example_gloss: عمر أختي عشرون عامًا.
  hi.a1.unit02.lesson02.teach.tees:
    title: ثلاثون
    gloss: ثلاثون
    note: كلمة قائمة بذاتها مرة أخرى -- تشبه teen (3) قليلًا، لكن لا يمكن تركيبها من teen وdas، لذا احفظها كلمة مستقلة.
    example_gloss: سعر التذكرة ثلاثون روبية.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: خمسون
    gloss: خمسون
    note: عدد مستدير شائع الاستعمال جدًا، وخاصة مع الأسعار.
    example_gloss: معي خمسون روبية.
  hi.a1.unit02.lesson02.teach.sau:
    title: مئة
    gloss: مئة
    note: عدد مستدير واضح، وشائع جدًا في أسعار الحياة اليومية.
    example_gloss: سعر هذا الكتاب مئة روبية.
  hi.a1.unit02.lesson02.teach.keemat:
    title: السعر
    gloss: سعر؛ ثمن
    note: '*Keemat* اسم مؤنث -- لذلك يأتي ضمير الملكية معه دائمًا بصيغة المؤنث (*iski keemat*، «سعره/سعرها»)، أيًّا كان الشيء المسعَّر.'
    example_gloss: كم سعر هذه التذكرة؟
  hi.a1.unit02.lesson02.teach.rupaye:
    title: الروبيات
    gloss: روبيات
    note: '*Rupaya* هي صيغة المفرد (تُستعمل لروبية واحدة فقط)؛ أما *rupaye* فتُستعمل لأي مبلغ أكبر.'
    example_gloss: هذا بخمسين روبية.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: السؤال عن السعر
    gloss: كم سعره؟
    note: '*Iski* («ـه/ـها») تتفق مع الاسم المؤنث *keemat* («سعر»)، لا مع الشيء المسعَّر فعلًا -- وهو نمط اتفاق الملكية نفسه الذي قدمته الوحدة 1 مع *mera naam*.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: ذكر السعر
    gloss: سعره خمسون روبية.
    note: الجواب الطبيعي بجملة كاملة عن Iski keemat kya hai؟
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: اسأل عن رقم الهاتف بصيغة رسمية
    gloss: ما رقم هاتفك؟ (بصيغة رسمية)
    note: كلمة *Number* (नंबर) مستعارة من الإنجليزية، وتُستعمل باستمرار في الهندية اليومية. و*Aapka* تتفق مع الاسم المذكر *number*.
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: السؤال عن رقم الهاتف، بصيغة غير رسمية
    gloss: ما رقم هاتفك؟ (بصيغة غير رسمية)
    note: تحل Tumhara محل aapka عند الحديث مع صديق أو نظير، على النمط نفسه في الوحدة 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 'إعطاء رقم: جملة تمهيدية'
    gloss: رقمي هو...
    note: طريقة طبيعية للتمهيد قبل قراءة الأرقام واحدًا واحدًا.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: رقم هاتف نموذجي
    gloss: ستة، اثنان، ثمانية، ثلاثة، خمسة.
    note: تُقرأ أرقام الهاتف في الهندية رقمًا رقمًا -- وكل رقم هنا سبق تعلمه في الدرس الأول.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: السؤال عن عمر شخص، بصيغة رسمية
    gloss: كم عمرك؟ (بصيغة رسمية)
    note: '*Umra* («عمر») اسم مؤنث، لذلك تأتي *aapki* بصيغة المؤنث هنا -- وهو نمط الاتفاق نفسه في *iski keemat*، لكن مع عمر الشخص بدل السعر.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: السؤال عن عمر شخص، بصيغة غير رسمية
    gloss: كم عمرك؟ (بصيغة غير رسمية)
    note: تحل Tumhari محل aapki عند الحديث مع صديق أو نظير.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: قل عمرك
    gloss: عمري ثلاثون عامًا.
    note: تتفق *Meri* مع *umra* (مؤنث)، ولا تتبع جنس المتكلم -- فبخلاف صيغ الفعل *chahta/chahti* في الوحدة 1، لا يتغير ضمير الملكية هذا مهما كان المتكلم.
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: أرجون يسأل بريا عن رقمها
    gloss: يطلب أرجون من بريا رقم هاتفها بصيغة غير رسمية.
    note: يعيد سؤال رقم الهاتف غير الرسمي الذي ورد في هذا الدرس كما هو.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: بريا تعطي رقمها وتسأل بدورها
    gloss: تقرأ بريا رقم هاتفها رقمًا رقمًا، ثم تسأل عن رقم أرجون.
    note: كل رقم هنا سبق تعلمه في الدرس الأول من هذه الوحدة.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: أرجون يعطي رقمه
    gloss: يقرأ أرجون رقم هاتفه.
    note: مرة أخرى، كل رقم هنا من مفردات الدرس الأول.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: بريا تسأل عن عمر أرجون
    gloss: تشكره بريا وتسأله عن عمره بصيغة غير رسمية.
    note: كلمة Shukriya («شكرًا») لا تتغير بتغير مستوى الرسمية، مثل بطاقة shukriya في الوحدة 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: أرجون يذكر عمره ويسأل بدوره
    gloss: يقول أرجون إن عمره عشرون عامًا، ثم يسأل بريا عن عمرها.
    note: قول Tumhari؟ وحدها طريقة قصيرة وطبيعية لرد السؤال.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: بريا تذكر عمرها
    gloss: تقول بريا إن عمرها ثلاثون عامًا.
    note: تعيد Meri umra tees saal hai نمط الجملة الذي تعلمناه سابقًا في هذا الدرس.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: أرجون ينهي المحادثة
    gloss: يعبّر أرجون عن ارتياحه ويقول إنهما سيلتقيان مجددًا.
    note: تعيد Accha وphir milenge مفردات الوداع من الوحدة 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: بريا تنهي المحادثة
    gloss: توافق بريا وتقول «إلى اللقاء» بأسلوب ودّي.
    note: تعيد Theek hai وphir milte hain مفردات الوداع من الوحدة 1.
