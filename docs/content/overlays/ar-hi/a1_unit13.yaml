teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'مراجعة: الشاي والقهوة'
    gloss: شاي، قهوة
    note: مراجعة سريعة لمفردات الوحدة 6، نحتاج إليها للحديث عمّا نحبه وما لا نحبه في هذه الوحدة.
    example_gloss:
    - أريد شايًا.
    - أريد قهوة.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'مراجعة: لي'
    gloss: لي
    note: ضمير المفعول غير المباشر الذي مرّ معك سابقًا واستُخدم في الوحدات 6 و7 و11؛ وتعطيه هذه الوحدة خبرًا جديدًا يقترن به.
    example_gloss: أريد شايًا.
  hi.a1.unit13.lesson01.teach.pasand:
    title: الإعجاب / المحبَّب
    gloss: إعجاب / محبَّب
    note: اسم يعني «الإعجاب» أو «ما يروق» (وليس «المفضّل»). عندما يأتي مع فاعل في صيغة الجر (मुझे/तुम्हें) ثم है/हैं، يكوّن عبارة «يعجبني…» أي «أحب…».
    example_gloss: يعجبني الشاي.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = أحب
    gloss: تعني «Pasand hai» «الشيء يروق لي» أي «أحب كذا». تبدأ بـ mujhe/tumhein تمامًا مثل «mujhe...chahiye» (الوحدة 6)، لكن على خلاف «chahiye» الذي لا يأتي بعده «hai»، يحتاج «pasand» دائمًا إلى «hai» أو «hain» بعده.
    note: يوضّح الفرق في البنية بين chahiye (الرغبة/الحاجة) وpasand hai (الإعجاب) حتى لا يختلط التركيبان.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: الموسيقى
    gloss: موسيقى
    note: اسم جديد يُستخدم لتدريب تركيب pasand hai مع اسم مفرد غير معدود.
    example_gloss: أحب الموسيقى.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'مراجعة: نعم، لا'
    gloss: نعم، لا
    note: مراجعة سريعة لكلمتين من أوائل ما تعلمته، نحتاج إليهما للإجابة عن أسئلة التفضيل ونفيها في هذه الوحدة.
    example_gloss:
    - نعم، أحب الموسيقى.
    - لا، لا أحب القهوة.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: لا أحب القهوة.
    gloss: لا أحب القهوة.
    note: 'النفي هنا يعمل تمامًا مثل جمل hai الأخرى التي مرّت معك (مثل «yoga class nahin hai» في الوحدة 3): تأتي nahin مباشرة قبل hai.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: كتاب / كتب
    gloss: كتاب / كتب
    note: زوج جديد من الأسماء (مفرد وجمع) لتوضيح أن «hai»/«hain» بعد pasand تتوافق مع عدد الشيء المحبوب.
    example_gloss:
    - أحب الكتاب.
    - أحب الكتب.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai أم hain بعد pasand
    gloss: 'تتوافق «hai» أو «hain» بعد «pasand» مع عدد الشيء المحبوب، تمامًا مثل «mere paas...hai/hain» (الوحدة 2): chai/sangeet pasand hai (مفرد)، kitaben pasand hain (جمع).'
    note: يمدّ هذا قاعدة التوافق في العدد بين hai/hain التي مرّت في الوحدة 2 إلى سياق جديد، دون تقديم قاعدة نحوية جديدة.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'مراجعة: لك (للمخاطب غير الرسمي)'
    gloss: لك (غير رسمي)
    note: ظهر لأول مرة في الوحدة 6 مع chahiye («tumhein...chahiye?»)، وتعيد هذه الوحدة استخدام الضمير نفسه مع pasand hai.
    example_gloss: هل تحب الموسيقى؟
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai؟
    gloss: «Kya» في بداية السؤال أداة أسئلة نعم/لا (الوحدة 1)؛ و«tumhein» تكرر التركيب نفسه الذي استُخدم في «tumhein...chahiye?» (الوحدة 6)، وهنا تحلّ «pasand hai» محل «chahiye».
    note: يؤكد أن هذا إعادة استخدام لتركيب سؤال معروف، وليس نقطة نحوية جديدة.
  hi.a1.unit13.lesson02.teach.khel:
    title: رياضة / لعبة
    gloss: رياضة / لعبة
    note: اسم جديد. يأتي في الأمثلة مع «yah» (هذا) ليبقى التوافق في العدد واضحًا، لأن «khel» لا يتغير شكله بين المفرد والجمع.
    example_gloss: أحب هذه الرياضة.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'مراجعة: هذا'
    gloss: هذا
    note: ظهرت لأول مرة في الوحدة 7 («mujhe yah chahiye»)، وتُستخدم هنا لجعل الإشارة المفردة إلى «khel» واضحة.
    example_gloss: هذا الكتاب جيد.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'مراجعة: أو'
    gloss: أو
    note: ظهرت لأول مرة في الوحدتين 6/7 عند طلب الطعام والسلع، وتُستخدم هنا لطرح سؤال اختيار عمّا نحبه.
    example_gloss: شاي أم قهوة؟
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: هل تحب الشاي أم القهوة؟
    gloss: هل تحب الشاي أم القهوة؟
    note: يجمع بين تركيب السؤال بـ tumhein في هذا الدرس وكلمة ya (أم) التي مرّت معك، ليطلب من المتعلم الاختيار.
  hi.a1.unit13.lesson02.teach.zyada:
    title: أكثر
    gloss: أكثر
    note: كلمة جديدة تُوضع مباشرة قبل «pasand hai» للتعبير عن تفضيل أحد شيئين سبق ذكرهما.
    example_gloss: أفضّل الشاي.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = أفضّل
    gloss: تعني «X zyada pasand hai» تفضيل أحد شيئين؛ و«mujhe chai zyada pasand hai» تعني «أحب الشاي أكثر» / «أفضّل الشاي».
    note: توسيع في المفردات وليس قاعدة جديدة؛ فكلمة «zyada» تعدّل ببساطة «pasand hai» التي مرّت معك.
    target_text: '''X ज़्यादा पसंद है'' تعني تفضيل أحد شيئين -- ''मुझे चाय ज़्यादा पसंद है'' تعني ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (أحب الشاي أكثر / أفضّل الشاي).'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'مراجعة: الموسيقى، الرياضة، الكتب'
    gloss: موسيقى، رياضة/لعبة، كتب
    note: مراجعة سريعة لأهم أسماء هذه الوحدة، نحتاج إليها في الحوار وفي نص القراءة.
    example_gloss:
    - أحب الموسيقى.
    - لا أحب هذه الرياضة.
    - أحب الكتب.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: أرجون يسأل عن الموسيقى
    gloss: بريا، هل تحبين الموسيقى؟
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: بريا تقول إنها تحبها كثيرًا
    gloss: نعم، أحب الموسيقى كثيرًا. وأنت؟
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: أرجون يوافق ويضيف الرياضة
    gloss: وأنا أيضًا! وأحب الرياضة كذلك.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: بريا تفضّل الكتب على هذه اللعبة
    gloss: جميل! لا أحب هذه اللعبة. أحب الكتب.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'أرجون يسأل: شاي أم قهوة'
    gloss: حسنًا. هل تحبين الشاي أم القهوة؟
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: بريا تفضّل الشاي
    gloss: أفضّل الشاي.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: أرجون يوافق
    gloss: رائع جدًا! وأنا أيضًا أحب الشاي.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: بريا تنهي الحديث
    gloss: حسنًا! هل نلتقي مجددًا غدًا؟
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: ثلاثة أنماط مترابطة
    gloss: 'أنماط هذه الوحدة الثلاثة: «chahiye» (الرغبة/الحاجة، الوحدة 6) لا يأتي بعده «hai»؛ و«pasand hai/hain» (هذه الوحدة) يتغير بحسب عدد الشيء؛ و«zyada pasand hai» تعني تفضيل أحد شيئين.'
    note: ملخص ختامي يربط قواعد الوحدة كلها، على غرار ملاحظة القواعد الجامعة في الوحدة 12.
    target_text: 'ثلاثة أمور في هذه الوحدة: بعد ''चाहिए'' (الرغبة/الحاجة، الوحدة 6) لا تأتي ''है''؛ و''पसंद है/हैं'' (هذه الوحدة) تتغير بحسب عدد الشيء؛ و''ज़्यादा पसंद है'' تعني تفضيل أحد اثنين.'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: رسالة بريا
    gloss: أرجون، أحب الموسيقى كثيرًا. وأحب الكتب أيضًا. لا أحب هذه اللعبة. أفضّل الشاي. - بريا
    note: رسالة قصيرة تعيد الوقائع نفسها التي ذُكرت في الحوار، دون إضافة أي معلومة جديدة.
    glosses:
      संगीत: موسيقى
      बहुत: كثيرًا
      पसंद: محبَّب / يروق
      किताबें: كتب
      खेल: لعبة
      नहीं: ليس / لا
      चाय: شاي
      ज़्यादा: أكثر / تفضيلًا
