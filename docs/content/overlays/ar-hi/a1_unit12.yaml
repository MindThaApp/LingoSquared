teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'مراجعة: مشغول'
    gloss: مشغول
    note: مراجعة سريعة لصفة من الوحدة 11، تُستخدم في هذه الوحدة لتدريب الفعل الناقص «كان» في الماضي.
    example_gloss: أرجون مشغول.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: كان / كانت (للمذكر / للمؤنث)
    gloss: كان
    note: 'هو الماضي للفعل الناقص (يكون: أنا/هو/هم)، ويقابل مباشرةً hai/hoon/hain. تأتي «tha» مع فاعل مذكر، و«thi» مع فاعل مؤنث.'
    example_gloss:
    - كان أرجون مشغولًا أمس.
    - كانت بريا مشغولة أمس.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha مقابل thi
    gloss: 'تأتي «tha» مع فاعل مذكر و«thi» مع فاعل مؤنث. وتقعان في موضع «hai»، لكنهما بخلاف «hai» تتغيران بحسب الجنس: أرجون مشغول، كان أرجون مشغولًا، كانت بريا مشغولة.'
    note: تبيّن قاعدة تطابق الجنس صراحةً، وتمدّ تصريف الفعل الناقص المألوف إلى الماضي.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'مراجعة: أمس'
    gloss: أمس
    note: دُرست في الوحدة 4، حيث نُبّه إلى أن «kal» تعني «غدًا» و«أمس» معًا، ويحدد زمن الفعل المعنى. هذه أول وحدة في الدورة تستخدم معناها الماضي «أمس» فعلًا.
    example_gloss: كان الأمس يوم السبت.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: كيف (للمذكر)
    gloss: كيف
    note: 'يكمل تصريفًا عرفنا منه شكلين: «kaise» و«kaisi» (من «كيف حالك» في الوحدة 1). وهذه هي صيغة المفرد المذكر الناقصة، وتُستخدم مع كلمات مثل «din» (يوم).'
    example_gloss: كيف كان اليوم؟
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: كيف كان الأمس؟
    gloss: كيف كان الأمس؟
    note: هذا هو سؤال الوحدة المتكرر، ويجمع كل الكلمات التي تعلمناها حتى الآن في هذا الدرس.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: كان اليوم جيدًا.
    gloss: كان اليوم جيدًا.
    note: جواب جاهز عن سؤال «كيف كان الأمس؟» بصيغة المذكر (لأن «din» مذكر).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: كان الفيلم جيدًا.
    gloss: كان الفيلم جيدًا.
    note: النمط نفسه مع فاعل مؤنث (كلمة «film» مؤنثة)، وفيه عودة إلى مفردات الوحدة 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa وkaisi وkaise
    gloss: تأتي «kaisa» مع فاعل مفرد مذكر (كيف كان اليوم؟)، و«kaisi» مع المؤنث (كيف كان الشاي؟)، وتُستخدم «kaise» مع aap/tum عند سؤال رجل (كيف حالك؟؛ ومع امرأة تقول «aap kaisi hain?»). الثلاث صيغ لكلمة واحدة.
    note: 'يربط التصريف الكامل لأول مرة: عرفنا kaise/kaisi من الوحدة 1، وkaisa هي إضافة هذا الدرس.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'مراجعة: أنا، أرجون، بريا'
    gloss: أنا، أرجون، بريا
    note: مراجعة سريعة قبل أمثلة الماضي مع ضمير المتكلم في هذا الدرس.
    example_gloss:
    - أنا أرجون.
    - أنا بريا.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: ذهب / ذهبت (للمذكر / للمؤنث)
    gloss: ذهب
    note: ماضي الفعل «jaana» (يذهب)، وهو الجذر نفسه الذي تعلمناه في الأمر «jao» (اذهب!) في الوحدة 9. يتطابق مع جنس الفاعل مثل «tha»/«thi».
    example_gloss:
    - ذهب أرجون إلى السوق.
    - ذهبت بريا إلى البيت.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = ماضي jaana
    gloss: «Gaya»/«gai» هما ماضي «jaana» (يذهب، وjao في الوحدة 9)، وتتغيران بحسب جنس الفاعل مثل «tha»/«thi».
    note: يربط الماضي الجديد صراحةً بجذر الأمر الذي عرفناه سابقًا.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'مراجعة: السوق، البيت'
    gloss: السوق، البيت
    note: مراجعة سريعة لكلمتي مكان من الوحدتين 7 و8، نحتاجهما للتعبير عن مكان الذهاب.
    example_gloss:
    - هذا هو السوق.
    - هذا هو البيت.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: قابل / قابلت (للمذكر / للمؤنث)
    gloss: قابل
    note: ماضي الفعل «milna» (يقابل)، وهو الجذر نفسه في «milte hain» للعادة التي وردت في ختام الوحدات 1 و4 و10 و11. يتطابق مع جنس الفاعل.
    example_gloss:
    - قابل أرجون بريا.
    - قابلت بريا أرجون.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se هنا تعني «مع» لا «من»
    gloss: 'هنا لا تعني «se» «من» (مكان الأصل): فعبارة «X se milna» تعني «يقابل X»، أما في «main Bharat se hoon» فكانت «se» نفسها تعني «من».'
    note: استعمال مزدوج حقيقي لكلمة سبق تعلمها، نبيّنه صراحةً.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'مراجعة: هناك'
    gloss: هناك
    note: مراجعة سريعة من الوحدتين 8 و9، تُستخدم هنا لذكر مكان اللقاء.
    example_gloss: المدرسة هناك.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: ذهبتُ إلى السوق أمس.
    gloss: ذهبتُ إلى السوق أمس.
    note: يجمع الماضي الجديد مع «kal» من الدرس الأول.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: قابلتُ بريا هناك.
    gloss: قابلتُ بريا هناك.
    note: يجمع «mila» في هذا الدرس مع «se» («مع») و«wahan» (هناك).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'مراجعة: معًا'
    gloss: معًا
    note: مراجعة سريعة من الوحدة 11.
    example_gloss: نشرب الشاي معًا.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'مراجعة: الشاي، المحل، الطعام'
    gloss: الشاي، المحل، الطعام
    note: مراجعة سريعة لثلاثة أسماء من الوحدتين 6 و7، نحتاجها لحوار هذا الدرس وملاحظة القراءة.
    example_gloss:
    - الشاي جيد.
    - المحل جيد.
    - الطعام جيد.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'مراجعة: «من/ـ‍ـُ» للإضافة (ka)، كيف (للمؤنث)'
    gloss: أداة الإضافة (ka)، كيف (للمؤنث، kaisi)
    note: سبق تعلم «ka» (في «kitne ka» وفي «raat ka khana» بالوحدة 10) و«kaisi»، وتُستخدمان هنا من جديد دون قاعدة جديدة.
    example_gloss:
    - كان يوم الأمس جيدًا.
    - كيف كان محل الشاي؟
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: أرجون يسأل كيف كان الأمس
    gloss: بريا، كيف كان الأمس؟
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: بريا تقول إنه كان جيدًا
    gloss: جيد جدًا! التقينا.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: أرجون يذكر السوق
    gloss: نعم! ذهبتُ أيضًا إلى السوق أولًا.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: بريا تسأل عن السوق
    gloss: جميل! ماذا كان في السوق؟
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: أرجون يجيب
    gloss: كان الطعام جيدًا.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: بريا تسأل عن محل الشاي
    gloss: جميل! وكيف كان محل الشاي؟
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: أرجون يجيب
    gloss: كان محل الشاي جيدًا جدًا.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: بريا تختتم الحديث
    gloss: حسنًا! إذن نلتقي مجددًا غدًا؟
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve مع صيغة الماضي الجمعية
    gloss: 'تأخذ ''Tum'' و''hum'' و''ve'' في الماضي الصيغة نفسها التي تأخذها في المضارع مع ''-te'': ''«the»'' (بدل ''tha'')، و''gaye'' (بدل ''gaya'')، و''mile'' (بدل ''mila'') -- فكما نقول ''hum milte hain'' نقول ''hum mile''.'
    note: تعرض هذه الملاحظة النموذج الكامل لفهم أعمق، مع أن 'mile' وحدها هي التي تُتدرَّب عليها تمارين هذه الوحدة؛ أما '«the»' و'gaye' فللتعرّف فقط، وترد في شرح هذه الملاحظة وحدها.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: ملاحظة بريا
    gloss: أرجون، كان يوم أمس جيدًا جدًا. كان الطعام جيدًا وكان محل الشاي جيدًا أيضًا. - بريا
    note: ملاحظة مكتوبة قصيرة تعيد الوقائع التي أوردها الحوار للتو، دون مفردات جديدة.
    glosses:
      कल: أمس
      दिन: يوم
      अच्छा: جيد (مذكر)
      था: كان (مذكر)
      खाना: طعام
      दुकान: متجر
      अच्छी: جيدة (مؤنث)
      थी: كانت (مؤنث)
