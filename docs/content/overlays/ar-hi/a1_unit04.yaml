teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: الساعة (تمامًا)
    gloss: الساعة (للأعداد من اثنين فأكثر)
    note: تُستعمل مع كل الساعات ما عدا الواحدة -- سترى لاحقًا في هذا الدرس الصيغة الخاصة بـ *الساعة الواحدة*.
    example_gloss: الساعة الآن الخامسة.
  hi.a1.unit04.lesson01.teach.abhi:
    title: الآن
    gloss: الآن
    note: كلمة زمنية بسيطة ستستخدمها دائمًا عند قول الوقت الحالي.
    example_gloss: الساعة الآن العاشرة.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: واحد، اثنان، ثلاثة
    gloss: واحد، اثنان، ثلاثة
    note: سبق في الوحدة 2، ونحتاجها هنا لقول الوقت -- لاحظ أن *ek* تأخذ الصيغة الخاصة *baja*، بينما تأخذ *do* و*teen* الصيغة العادية *baje*.
    example_gloss:
    - الساعة الآن الواحدة.
    - الساعة الآن الثانية.
    - الساعة الآن الثالثة.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: أربعة، خمسة، ستة
    gloss: أربعة، خمسة، ستة
    note: سبق في الوحدة 2 -- وكلها تأخذ الصيغة العادية *baje*.
    example_gloss:
    - الساعة الآن الرابعة.
    - الساعة الآن الخامسة.
    - الساعة الآن السادسة.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: سبعة، ثمانية، تسعة
    gloss: سبعة، ثمانية، تسعة
    note: سبق في الوحدة 2.
    example_gloss:
    - الساعة الآن السابعة.
    - الساعة الآن الثامنة.
    - الساعة الآن التاسعة.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: عشرة، أحد عشر، اثنا عشر
    gloss: عشرة، أحد عشر، اثنا عشر
    note: سبق في الوحدة 2 -- وهي آخر أعداد الساعات التي ستحتاجها.
    example_gloss:
    - الساعة الآن العاشرة.
    - الساعة الآن الحادية عشرة.
    - الساعة الآن الثانية عشرة.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja وbaje
    gloss: 'تأتي *Baja* مع *واحد*، وتأتي *baje* مع كل عدد آخر: *ek baja hai*، *do baje hain*.'
    note: هذا استثناء حقيقي في المطابقة وليس تبسيطًا -- *ek baja hai* هي الساعة الوحيدة التي تستعمل صيغة المفرد.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: حرفيًا «كم ساعة هناك» -- وهي الطريقة المعتادة للسؤال عن الوقت.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: قول الوقت
    gloss: الساعة الآن الخامسة.
    note: الجواب الطبيعي بجملة كاملة عن *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: حصة اليوغا
    gloss: حصة اليوغا
    note: سبق في الوحدة 1 -- وهي مثال هذا الدرس المتكرر عن المواعيد.
    example_gloss: حصة اليوغا اليوم.
  hi.a1.unit04.lesson02.teach.subah:
    title: الصباح
    gloss: صباح
    note: إحدى كلمات أوقات اليوم الأربع في هذا الدرس.
    example_gloss: حصة اليوغا في الصباح.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: بعد الظهر / الظهيرة
    gloss: بعد الظهر، الظهيرة
    note: تشمل منتصف النهار (الظهيرة) وأول ما بعد الظهر.
    example_gloss: لا توجد حصة بعد الظهر.
  hi.a1.unit04.lesson02.teach.shaam:
    title: المساء
    gloss: مساء
    note: الفترة من اليوم التي تلي *dopahar* وتسبق *raat*.
    example_gloss: الحصة القادمة في الخامسة مساءً.
  hi.a1.unit04.lesson02.teach.raat:
    title: الليل
    gloss: ليل
    note: آخر كلمات أوقات اليوم الأربع.
    example_gloss: لا توجد حصة في الليل.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko مع وقت عام
    gloss: 'تأتي *Ko* مع كلمة من أوقات اليوم حين لا تُذكر ساعة محددة: *dopahar ko*، *raat ko*.'
    note: هي نفسها *ko* التي تدل على يوم من أيام الأسبوع (الوحدة 3)، وهنا تدل على فترة زمنية عامة -- تركيب طبيعي وحقيقي، وليس الوحيد في هذه الوحدة (انظر الملاحظة التالية لصيغة الساعة المحددة).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: كلمة وقت اليوم مباشرة قبل baje
    gloss: 'للساعة المحددة تأتي كلمة وقت اليوم مباشرة قبل *baje* دون أي كلمة بينهما: *subah saat baje*، *shaam paanch baje*.'
    note: لا توجد *ko* هنا -- فهي مخصصة لفترة زمنية عامة دون ساعة محددة، كما توضح الملاحظة السابقة.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: السؤال عن موعد الحصة
    gloss: في أي ساعة الحصة؟
    note: هو نمط *kitne baje* نفسه من الدرس 1، لكنه هنا يسأل عن موعد حدث لا عن الوقت الحالي.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: ذكر موعد حدث
    gloss: الحصة في السابعة صباحًا.
    note: تجمع *subah* مباشرة مع *saat baje*، بحسب ملاحظة القواعد أعلاه.
  hi.a1.unit04.lesson03.teach.kal:
    title: غدًا / أمس
    gloss: غدًا، أمس
    note: تستعمل الهندية كلمة واحدة للمعنيين -- ويحدد السياق (وزمن الفعل) المقصود. وفي هذا الدرس تعني دائمًا «غدًا».
    example_gloss: الحصة غدًا في الخامسة مساءً.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: القادم
    gloss: القادم
    note: سبقت في الوحدة 3 -- صيغة المؤنث لتتطابق مع *الحصة* المؤنثة.
    example_gloss: الحصة القادمة غدًا.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: حسنًا، شكرًا
    gloss: حسنًا، شكرًا!
    note: الكلمتان كلتاهما مأخوذتان من مفردات الوداع في الوحدة 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: سنلتقي / أراك لاحقًا
    gloss: سنلتقي / إلى اللقاء
    note: مأخوذة من عبارة الوداع في ختام الوحدة 3، وهنا تقترن بكلمة *kal* لتعني «أراك غدًا».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: السؤال عن موعد الحصة التالية
    gloss: في أي ساعة الحصة التالية؟
    note: تجمع بين *agli* (مؤنث، لأنه يتبع كلمة «حصة») ونمط *kitne baje* الذي تعلمناه في هذه الوحدة.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: ذكر موعد الحصة التالية
    gloss: الحصة التالية في الخامسة مساءً.
    note: هذه هي الإجابة الكاملة الطبيعية عن السؤال السابق.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: إنهاء الحديث باتفاق على اللقاء غدًا
    gloss: حسنًا، أراك غدًا!
    note: هي الطريقة الطبيعية لإنهاء المحادثة بعد الاتفاق على موعد.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: أرجون يسأل عن الحصة التالية
    gloss: يسأل أرجون في أي ساعة الحصة التالية.
    note: تعيد السؤال نفسه الوارد في هذا الدرس.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: بريا تذكر الموعد
    gloss: تقول بريا إن الحصة التالية في الخامسة مساءً.
    note: تعيد جملة الجواب نفسها الواردة في هذا الدرس.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: أرجون يشكرها
    gloss: 'يقول أرجون: حسنًا، شكرًا.'
    note: مأخوذة من مفردات الوحدة 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: بريا تنهي المحادثة
    gloss: 'توافق بريا وتقول: أراك غدًا.'
    note: تعيد جملة الختام نفسها الواردة في هذا الدرس.
