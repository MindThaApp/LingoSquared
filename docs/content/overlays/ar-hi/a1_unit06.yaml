teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: الطعام
    gloss: طعام، وجبة
    note: الكلمة العامة للطعام، وتُستعمل في هذه الوحدة كلها.
    example_gloss: طعامي جاهز الآن.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: شاي، قهوة
    gloss: شاي، قهوة
    note: مشروبان شائعان، يُستعملان في هذه الوحدة كلها للتدرّب على نمط *mujhe ... chahiye*.
    example_gloss:
    - أودّ شايًا.
    - أودّ قهوة.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: ماء، عصير
    gloss: ماء، عصير
    note: مشروبان شائعان آخران، ولا حاجة إلى تطابق في الجنس لأن *chahiye* لا تتغيّر.
    example_gloss:
    - أود ماءً.
    - أودّ عصيرًا.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: تعني *Mujhe ... chahiye* «أودّ ...» أو «أحتاج إلى ...». ولا تتغيّر بحسب جنس المتكلّم (بخلاف *chahta/chahti*)، ولا تأتي بعدها *hai* أبدًا.
    note: هذه هي القاعدة الأساسية في الوحدة -- ومن الأخطاء الشائعة جدًا لدى المتعلّمين إضافة *hai* بعد *chahiye*، لأن «almost» كل جملة أخرى تعلّمتها حتى الآن تنتهي بها. أما *Chahiye* فهي بحدّ ذاتها خبر كامل.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: ماذا تودّ؟ (بصيغة رسمية)
    gloss: ماذا تريد؟
    note: سؤال بصيغة *aap* الرسمية، يستعمله النادل أو المضيف عند مخاطبة شخص بأدب.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: ماذا تودّ؟ (بصيغة غير رسمية)
    gloss: ماذا تريد؟
    note: ضمير المفعول غير الرسمي بصيغة *tum*، وهو موازٍ لـ *mujhe* ولـ *tumhara/tumhari* في الوحدة 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: أودّ شايًا، شكرًا
    gloss: أودّ شايًا، شكرًا.
    note: جواب طبيعي ومهذّب عند الطلب، ويعيد استعمال *shukriya* من الوحدات السابقة.
  hi.a1.unit06.lesson01.teach.bahut:
    title: جدًّا
    gloss: جدًا، كثيرًا
    note: كلمة تأكيد شائعة، تُستعمل في هذه الوحدة كلها لوصف الطعام والشراب.
    example_gloss: هذا الشاي جيّد جدًا.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: لذيذ
    gloss: لذيذ، شهي
    note: كلمة مفيدة للتعليق على الطعام -- انظر قاعدة هذه الوحدة في الدرس 3 عن سبب عدم تغيّرها بحسب الجنس.
    example_gloss: هذا الطعام لذيذ جدًا.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: خبز، أرز
    gloss: خبز مسطّح، أرز
    note: طعامان أساسيان في الوجبة الهندية اليومية.
    example_gloss:
    - أريد خبزًا.
    - أودّ أرزًا.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: طبق خضار، عدس
    gloss: طبق خضار، عدس (دال)
    note: طبقان أساسيان آخران، يؤكلان عادةً مع الروتي والأرز.
    example_gloss:
    - أودّ طبق الخضار.
    - أودّ عدسًا.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: فنجان، كأس، صحن
    gloss: فنجان، كأس، صحن
    note: أوعية شائعة تُستعمل مع *ek* («واحد») لتحديد الكمّية عند الطلب.
    example_gloss:
    - أودّ فنجان شاي.
    - أودّ كأس ماء.
    - أودّ صحن أرز.
  hi.a1.unit06.lesson02.teach.kripya:
    title: من فضلك
    gloss: من فضلك
    note: كلمة مجاملة بسيطة تُستعمل في الطلب. تأتي غالبًا في البداية (*kripya mujhe ...*)، لكنك ستسمعها تُضاف في النهاية أيضًا.
    example_gloss: أودّ فنجان شاي، من فضلك.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: هل تريد شيئًا آخر؟
    gloss: أي شيء آخر؟ / هل تودّ شيئًا آخر؟
    note: السؤال الطبيعي الذي يطرحه النادل بعد تسجيل جزء من الطلب.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: لا، هذا كل شيء، شكرًا
    gloss: لا، هذا كل شيء، شكرًا.
    note: طريقة طبيعية ومهذّبة لإنهاء الطلب، وتعيد استعمال *nahin* و*shukriya* من الوحدات السابقة.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: طبق الخضار هذا لذيذ جدًا
    gloss: طبق الخضار هذا لذيذ جدًا.
    note: تعيد استعمال *bahut* و*swadisht* من هذه الوحدة مع اسم طعام جديد، تمهيدًا لقاعدة الدرس 3 عن عدم تغيّر *swadisht* بحسب الجنس.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: هيا نأكل شيئًا!
    gloss: هيا نأكل شيئًا!
    note: عبارة ودّية ثابتة لاقتراح الأكل معًا، وبها يبدأ حوار هذه الوحدة الختامي.
  hi.a1.unit06.lesson03.teach.ya:
    title: أو
    gloss: أو
    note: كلمة ربط بسيطة تُستعمل لعرض الاختيار بين شيئين.
    example_gloss: هل تودّ شايًا أم قهوة؟
  hi.a1.unit06.lesson03.teach.haan:
    title: نعم
    gloss: نعم
    note: كلمة بسيطة للإيجاب، تتكرّر في حوار هذه الوحدة الختامي.
    example_gloss: نعم، أودّ شايًا.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht لا تتغيّر
    gloss: تبقى *Swadisht* كما هي مع الكلمات المذكّرة والمؤنثة -- فهي لا تتغيّر كما تتغيّر *achha/achhi*.
    note: 'استثناء حقيقي ومهمّ: بخلاف الصفات المتطابقة التي تعلّمتها (achha/achhi وbada/badi وmera/meri)، فإن الصفات التي تنتهي بحرف ساكن مثل *swadisht* لا تتغيّر بحسب الجنس أبدًا.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: حسنًا، إلى اللقاء
    gloss: حسنًا! إلى اللقاء.
    note: ختام ودّي، أُعيد استعماله من مفردات الوداع في الوحدات السابقة.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: حسنًا، نلتقي قريبًا
    gloss: حسنًا، نلتقي قريبًا!
    note: الردّ غير الرسمي على الختام السابق، بما يوافق تبادلات الختام في الوحدات السابقة.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: أرجون يقترح الأكل
    gloss: 'يقول أرجون: هيا نأكل شيئًا.'
    note: تعيد استعمال العبارة الافتتاحية لهذه الوحدة.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: بريا تسأل عمّا يريده
    gloss: توافق بريا وتسأل أرجون عمّا يودّ.
    note: تعيد استعمال السؤال غير الرسمي *tumhein kya chahiye* من الدرس 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: أرجون يطلب الطعام
    gloss: يقول أرجون إنه يودّ صحنًا من الروتي وطبق الخضار.
    note: تجمع بين أسماء الطعام في هذه الوحدة، ونمط الوعاء *ek plate*، و*chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: بريا تعرض الاختيار بين مشروبين
    gloss: تقول بريا «جميل» وتسأل أرجون هل يودّ شايًا أم قهوة.
    note: تستعمل *ya* من هذه الوحدة لعرض الاختيار بين مشروبين.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: أرجون يختار القهوة
    gloss: يقول أرجون إنه يودّ قهوة، من فضلك.
    note: تعيد استخدام *kripya* من الدرس 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: بريا تعلّق على الطعام
    gloss: تقول بريا حسنًا، وإن هذا الطعام لذيذ جدًا.
    note: تعيد استخدام *bahut swadisht* من الدرس 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: أرجون يوافق
    gloss: يقول أرجون نعم، شكرًا جزيلًا.
    note: تعيد استخدام *haan* و*shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: بريا تنهي المحادثة
    gloss: تقول بريا جميل، إلى اللقاء.
    note: تعيد استخدام عبارة الختام الخاصة بهذا الدرس.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: أرجون يردّ
    gloss: يوافق أرجون ويقول إلى اللقاء قريبًا.
    note: تعيد استخدام عبارة الرد الخاصة بهذا الدرس.
