teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: ضمير المخاطب للاحترام
    gloss: أنتَ/أنتِ (للاحترام)
    note: تفرّق الهندية بين مستويين اجتماعيين في مخاطبة الشخص. يُستخدم *aap* مع من هو أكبر سنًا أو غير مألوف أو في علاقة مهنية تستدعي الاحترام. ويُعامل نحويًا معاملة الجمع حتى مع شخص واحد، فتأخذ الأفعال مع *aap* نهايات جمع من نوع -en/hain، وهي نفسها المستخدمة مع «هم».
  hi.a1.unit01.lesson01.teach.tum:
    title: ضمير المخاطب غير الرسمي
    gloss: أنتَ/أنتِ (غير رسمي، للمألوف)
    note: يُستخدم *tum* مع الصديق أو الزميل أو من هو أصغر سنًا أو أحد أفراد الأسرة، أي في علاقة ودّية غير رسمية لكنها تبقى محترمة (وهو غير *tu* الأكثر حميمية، الذي لا يدرّسه هذا المقرر). وللضمير *tum* نهايات فعلية خاصة به تختلف عن نهايات *aap* و*tu*.
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: سؤال رسمي عن الحال، لرجل
    gloss: كيف حالك؟ (رسمي، لرجل)
    note: يتطابق *kaise* مع جنس الشخص المسؤول، لا مع جنس المتكلم، وهذه الصيغة تُستخدم عند مخاطبة رجل. وهذا قريب من العربية التي يتغير فيها الضمير بين «كيف حالُك» و«كيف حالُكِ»، لكن في الهندية يتغير الاستفهام نفسه.
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: كيف حالك؟ (لامرأة، بصيغة رسمية)
    gloss: كيف حالكِ؟ (رسمي، لامرأة)
    note: السؤال نفسه وبمستوى الاحترام نفسه *aap*، والذي يتغير فقط هو *kaisi* بدل *kaise* لتتطابق مع مخاطَبة مؤنثة. أما الفعل *hain* فلا يتغير أبدًا، وإنما يتغير شكل الصفة فقط.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: سؤال غير رسمي عن الحال
    gloss: كيف حالك؟ (غير رسمي)
    note: مع *tum* يكون الفعل *ho* وليس *hain*، فقارن بين الصيغة الرسمية *Aap kaise/kaisi hain?* وغير الرسمية *Tum kaise ho?*. وهذا أوضح زوج متقابل لسماع الفرق بين aap وtum في الفعل نفسه.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: ردّ معتاد
    gloss: أنا بخير، شكرًا.
    note: لا تتغير كلمة *Theek* («بخير/حسنًا») بحسب الجنس أو مستوى الاحترام، فهي بخلاف *kaise/kaisi* تبقى كما هي مهما كان المتكلم أو المخاطَب.
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: إعادة السؤال بصيغة رسمية
    gloss: وأنت؟ (رسمي)
    note: طريقة قصيرة لإعادة السؤال بمستوى الاحترام الخاص بـ aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟ (غير رسمي)
    note: استخدم tum لإعادة السؤال إلى صديق أو زميل.
  hi.a1.unit01.lesson02.teach.namaste:
    title: تحية لكل الأوقات
    gloss: مرحبًا؛ أهلًا (وتُستخدم للوداع أيضًا)
    note: تصلح *Namaste* في أي وقت من اليوم، في المواقف الرسمية وغير الرسمية، وفي بدء الحديث وإنهائه، فهي عامة الاستخدام فعلًا، بخلاف العربية التي تفرّق عادةً بين كلمات التحية وكلمات الوداع.
    example_gloss: مرحبًا! كيف حالك؟
  hi.a1.unit01.lesson02.teach.namaskar:
    title: تحية محترمة
    gloss: مرحبًا (أكثر رسمية واحترامًا من namaste)
    note: تعني *Namaskar* في الأساس ما تعنيه *namaste*، لكنها أكثر رسمية واحترامًا، وتناسب مخاطبة كبير السن أو جمهور كبير أو في موقف مهني.
    example_gloss: ناماسكار! وأنت؟
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: إلى اللقاء (المستقبل)
    gloss: إلى اللقاء؛ نلتقي لاحقًا
    note: المعنى الحرفي «سنلتقي مجددًا»، وهي طريقة معتادة ومحايدة للوداع حين تتوقع أن ترى الشخص ثانية.
  hi.a1.unit01.lesson02.teach.alvida:
    title: وداع رسمي
    gloss: وداعًا؛ مع السلامة
    note: '*Alvida* كلمة هندية صحيحة تُستخدم للوداع، لكنها في الاستخدام اليومي تحمل نبرة أكثر نهائية ورسمية، بل درامية قليلًا، مقارنةً بـ *namaste* أو *phir milenge*، فهي أقرب إلى «وداعًا» الأخير منها إلى «مع السلامة» العابرة.'
    example_gloss: وداعًا! إلى اللقاء.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: نلتقي (غير رسمي/معتاد)
    gloss: نلتقي؛ أراك قريبًا
    note: المعنى الحرفي «نلتقي مجددًا» بصيغة الفعل المستمر/المعتاد بدل المستقبل، وهي مرادف يومي أقل رسمية من *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: تصبح على خير
    gloss: تصبح على خير
    note: 'تُقال عندما يغادر أحدهم للنوم أو يذهب إلى فراشه، وهي مثل «تصبح على خير» في العربية: عبارة وداع لا تُستخدم تحية افتتاحية، بخلاف *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: أمنية ختامية مهذبة
    gloss: أتمنى لك يومًا سعيدًا.
    note: المعنى الحرفي «ليبقَ يومك جيدًا»، وهي أمنية ختامية مهذبة تناسب الفراق باحترام، سواء كانت العلاقة رسمية أو غير رسمية.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: السؤال عن الاسم بصيغة رسمية
    gloss: ما اسمك؟ (رسمي)
    note: تتطابق *Aapka* («اسمُك») مع الاسم المذكر *naam* («اسم»)، فصيغ الملكية في الهندية تتغير لتوافق الشيء المملوك لا المالك. أما في العربية فيتغير الضمير بحسب المالك (كَ/كِ)، لذلك يختلف النظام.
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: السؤال عن الاسم بطريقة غير رسمية
    gloss: ما اسمك؟ (غير رسمي)
    note: النمط نفسه مع *tumhara* («اسمُك» غير الرسمي) بدل *aapka*. قارن بين الصيغة الرسمية *Aapka naam kya hai?* وغير الرسمية *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: قل اسمك
    gloss: اسمي بريا.
    note: تتطابق *Mera* («ي» الملكية) أيضًا مع كون *naam* مذكرًا، فلاحظ أنها تأخذ النهاية المذكرة نفسها كما في *aapka*/*tumhara* أعلاه، لأن الثلاثة تصف الاسم نفسه.
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: التعبير عن السرور بلقاء شخص، بصيغة رسمية
    gloss: سررت بلقائك. (رسمي)
    note: المعنى الحرفي «بعد أن قابلتك، حصل السرور»، وهي عبارة ثابتة شائعة الاستخدام في اللقاء الأول المحترم.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: ردّ المجاملة
    gloss: وأنا أيضًا.
    note: رد قصير وطبيعي على Aapse milkar khushi hui أو Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: السؤال عن الأصل بصيغة رسمية
    gloss: من أين أنت؟ (رسمي)
    note: تعني Kahan «أين»، وتعني se «من».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: قل من أين أنت
    gloss: أنا من الهند.
    note: Bharat هو الاسم الهندي للهند، ويُستخدم باستمرار في الكلام اليومي.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: السؤال عن الأصل بصيغة غير رسمية
    gloss: من أين أنت؟ (غير رسمي)
    note: السؤال نفسه مع *tum* و*ho* بدل *aap* و*hain*، وهو نمط نهايات الفعل الرسمي/غير الرسمي نفسه الذي رأيناه في هذه الوحدة كلها.
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: بداية اللقاء
    gloss: تحيّي بريا أرجون وتسأل هل هذه أول مرة له هنا.
    note: يستخدم المتحدثان صيغة *tum* غير الرسمية منذ البداية، وهذا طبيعي بين زميلين يلتقيان بشكل عفوي في صف مجتمعي. وتتطابق *Tumhari* («ـك») مع الاسم المؤنث *baar* («مرة»)، لا مع جنس أي من المتحدثين.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: بداية اللقاء، الردّ
    gloss: يقول أرجون نعم، هذه أول مرة له، وإنه يريد تعلّم اليوغا.
    note: تأتي *Chahta hoon* («أريد») بصيغة المذكر هنا لأن أرجون، وهو المتكلم، رجل، فهذا الفعل يتطابق مع جنس المتكلم، بخلاف *kaisi*/*kaise* سابقًا اللتين تطابقتا مع جنس الشخص المخاطَب.
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: تبادل الأسماء
    gloss: تقول بريا «وأنا أيضًا!»، وتذكر اسمها، وتسأل عن اسم أرجون.
    note: 'تردّ *Main bhi!* («وأنا أيضًا!») على جملة أرجون *main ... chahta hoon*: فحين يكون فاعل جملة المتحدث الآخر *main*، يكون «وأنا أيضًا» *main bhi*. أما *Mujhe bhi* فهي الرد على جملة من نوع *mujhe* مثل *Tumse milkar accha laga*. وتُعدّ *Mera naam...hai* الطريقة البسيطة الطبيعية لذكر الاسم.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: تبادل الأسماء، الردّ
    gloss: يذكر أرجون اسمه ويقول إنه سعيد بلقائها، بصيغة غير رسمية.
    note: '*Tumse milkar accha laga* هي المقابل غير الرسمي لعبارة *Aapse milkar khushi hui* الرسمية في هذا الدرس، وكلتاهما تعنيان تقريبًا «سررت بلقائك»، بحسب مستوى الاحترام.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: السؤال عن الأصل
    gloss: تبادله بريا الشعور نفسه وتسأل من أين أرجون.
    note: تسأل Tum kahan se ho عن الأصل بالصيغة غير الرسمية التي سبق تعلّمها.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: السؤال عن الأصل، الردّ
    gloss: أرجون من الهند لكنه يعيش حاليًا في لندن، ثم يطرح السؤال نفسه.
    note: '*Rahta hoon* («أعيش») بصيغة المذكر لتتطابق مع أرجون بوصفه المتكلم، وهو نمط تطابق الفاعل نفسه في *chahta hoon* في السطر الثاني. وتربط *Lekin* («لكن») بين التباين في الأصل والإقامة الحالية.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: الحديث عن الأصل واهتمام مشترك
    gloss: تقول بريا إنها من أمريكا وإنها تريد أيضًا تعلّم اليوغا.
    note: '*Chahti hoon* هي الصيغة المؤنثة للفعل نفسه الذي استخدمه أرجون في السطر الثاني (*chahta hoon*)، فلاحظ أن كليهما يتطابق مع جنس المتكلم نفسه، مما يتيح مقارنة مباشرة بين الصيغتين.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: السؤال عن النشاط المشترك
    gloss: يتفاعل أرجون بإيجابية ويسأل بريا هل تمارس اليوغا.
    note: '*Karti ho* («هل تمارسين») مؤنثة لتتطابق مع بريا بوصفها المسؤولة، فهذه الصيغة الفعلية، مثل *kaisi* سابقًا، تتبع جنس المخاطَب لا المتكلم.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: السؤال عن النشاط المشترك، والرد
    gloss: تقول بريا لا، هذه أول مرة لها، وإنها ما زالت تتعلم.
    note: تستخدم *Seekh rahi hoon* («أنا أتعلّم») صيغة الاستمرار المؤنثة لتتطابق مع بريا بوصفها المتكلمة، وهي المقابل المستمر لـ *chahti hoon*.
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: إنهاء الحديث
    gloss: يوافق أرجون على البدء، ثم يقول إلى اللقاء.
    note: '*Chalo shuru karte hain* («لنبدأ») عبارة ثابتة طبيعية لاقتراح بدء شيء معًا. وتختم *Phir milte hain* الحديث بعبارة الوداع غير الرسمية التي تعلمناها في الدرس الثاني.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: أي كلمة هي الطريقة الرسمية المحترمة لقول «أنت»؟
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: يُستخدم Aap مع من هو أكبر سنًا أو غير مألوف أو في علاقة تستدعي الاحترام.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: أي كلمة تُستعمل لمخاطبة صديق واحد أو زميل بصيغة غير رسمية؟
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: يُستخدم Tum مع الأصدقاء والزملاء وغيرهم في علاقات غير رسمية لكنها محترمة.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: ماذا يسأل هذا السؤال، ولمن يُوجَّه؟
    correct_option: كيف حالكِ؟ (رسمي، لامرأة)
    distractors:
    - كيف حالك؟ (رسمي، لرجل)
    - وأنت؟
    accepted_answers:
    - كيف حالكِ؟ (رسمي، لامرأة)
    feedback: تتطابق Kaisi مع مخاطَبة مؤنثة، أما kaise فتُستخدم مع الرجل.
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: رتّب السؤال الرسمي عن الحال (لرجل).
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: رتّب السؤال غير الرسمي عن الحال.
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: أعد السؤال مع المحافظة على الصيغة المحترمة.
    correct_option: और आप?
    distractors:
    - और तुम?
    - तुम कैसे हो?
    accepted_answers:
    - और आप?
    - और आप
    feedback: تحافظ Aur aap? على الصيغة الرسمية عند إعادة السؤال.
  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: أعد السؤال إلى صديق أو زميل.
    correct_option: और तुम?
    distractors:
    - और आप?
    - आप कैसे हैं?
    accepted_answers:
    - और तुम?
    - और तुम
    feedback: Aur tum? هي الطريقة غير الرسمية لإعادة السؤال.
  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: صحّح السؤال غير الرسمي، ففيه خلط بين tum ونهاية فعل غير مناسبة.
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: يأخذ Tum النهاية ho لا hain، فـ hain لا تُستخدم إلا مع aap.
  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 'أجب بأدب: قل إنك بخير واشكر محدّثك.'
