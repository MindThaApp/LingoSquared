    gloss: 'أرجن: هل لديك حيوان أليف يا بريا؟'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: لدى بريا كلب
    gloss: 'بريا: نعم، لدي كلب.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: أرجن يسأل عن شكله
    gloss: 'أرجن: كيف يبدو؟'
    note: '*वह कैसा दिखता है?* تصلح للحيوانات أيضًا، و*कैसा* مذكر لأن الكلب ذكر.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: بريا تصف كلبها
    gloss: 'بريا: فراؤه بني وهو صغير.'
    note: يعيد مفردات لون الشعر والحجم من وحدة المظهر، وهنا لوصف فرو حيوان بدل شعر شخص.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह للحيوانات
    gloss: هذا كلبي. أحبه كثيرًا.
    note: تُستخدم *वह* و*उसे* للحيوانات كما تُستخدم للناس؛ وليس في الهندية هنا كلمة مستقلة لغير العاقل.
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: أرجن يسأل عن النزهات
    gloss: 'أرجن: هل تصطحبينه في نزهة كل يوم؟'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: بريا تصف روتينها
    gloss: 'بريا: نعم، أصطحبه في نزهة كل يوم وأطعمه.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: أرجن ونيها وفيكرام يتحدثون عن الحيوانات
    gloss: 'أرجن ونيها كلاهما يحب الحيوانات، لكن ليس لدى أي منهما حيوان أليف. أرجن يحب الكلاب ونيها تحب القطط. أما فيكرام فلديه حيوان أليف: قطة. هو يلعب مع قطته كثيرًا ويطعمها كل يوم. هل لديك حيوان أليف؟'
    note: يقابل بين حب الحيوان وامتلاكه فعلًا، وهذا هو الهدف التواصلي للوحدة.
    glosses:
      पसंद: يحب
      दोनों: كلاهما
      जानवर: حيوانات
      किसी: أي واحد منهم
      पालतू: حيوان أليف
      कुत्ते: كلاب
      बिल्लियाँ: قطط
      बिल्ली: قط
      खेलता: يلعب
      देता: يعطي
      रोज़: كل
      खाना: طعام
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: فيكرام يلعب مع قطته كثيرًا
    gloss: فيكرام يلعب مع قطته كثيرًا.
    note: '*अक्सर* (''غالبًا'') تأتي قبل الفعل، و*अपनी* تتوافق مع *बिल्ली* المؤنثة.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: أحب الكلاب. ليس لدي حيوان أليف.
    gloss: أحب الكلاب. ليس لدي حيوان أليف.
    note: إجابة نموذجية من جملتين، جاهزة لإعادة استعمالها في مهمة الكتابة في الوحدة.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: بريا تسأل نينا
    gloss: 'بريا: نينا، هل لديك أنتِ أيضًا حيوان أليف؟'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: نينا لديها طائر اسمه بيكو
    gloss: 'نينا: نعم، لدي طائر. اسمه بيكو.'
    note: '*उसका नाम पीको है* (''اسمه بيكو'') تستخدم *का* لأن *नाम* مذكر.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: أرجن يعبّر عن إعجابه
    gloss: 'أرجن: رائع! ماذا تفعلين معه كل يوم؟'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: نينا تُطعمه كل يوم
    gloss: 'نينا: أُطعمه كل يوم.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: أرجن يحب العصافير أيضًا
    gloss: 'أرجن: وأنا أيضًا أحب العصافير.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: بريا تختم الحديث
    gloss: 'بريا: كم هو جميل أننا نحن الثلاثة نحب الحيوانات!'
    note: يختم الحديث بجمع المعلومات عن الحيوانات لدى الشخصيات الثلاث في هذه الوحدة.
