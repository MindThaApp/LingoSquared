teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: حيوان، حيوان أليف
    gloss: الحيوان / الحيوان الأليف
    note: '*जानवर* هي الكلمة العامة للحيوان، و*पालतू जानवर* (''حيوان مروَّض'') تعني حيوانًا أليفًا.'
    example_gloss:
    - الكلب حيوان.
    - الكلب أيضًا حيوان أليف.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: الكلب والقطة
    gloss: الكلب / القطة
    example_gloss:
    - لدى بريا كلب.
    - لدى فيكرام قطة.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: السمكة والطائر
    gloss: السمكة / الطائر
    example_gloss:
    - لدى الجد سمكة.
    - لدى نينا طائر.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: هل لديك حيوان أليف؟
    gloss: هل لديك حيوان أليف؟
    note: '*तुम्हारे पास ... है?* (''عندك ... ؟'') تسأل «هل لديك ...؟»، و*कोई* (''أي'') تُبقي السؤال مفتوحًا.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: نعم، لدي كلب
    gloss: نعم، لدي كلب.
    note: إجابة بسيطة بالإيجاب باستخدام مفردات هذه الوحدة الجديدة.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: لا، ليس لدي حيوان أليف
    gloss: لا، ليس لدي حيوان أليف.
    note: '*कोई ... नहीं है* (''لا يوجد ...'') تعني أنه ليس لديك شيء منه.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: ليس لدي حيوان أليف.
    note: '*कोई* (''أي'') مع *नहीं है* تنفي امتلاك شيء: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: يُخرج حيوانًا للتنزه
    gloss: يُخرج (حيوانًا) للتنزه
    note: '*घुमाने ले जाना* (''اصطحاب في نزهة'') هي طريقة الهندية للتعبير عن «تمشية حيوان»؛ وبعد *घुमाने* تأتي *ले जाना*.'
    example_gloss: أُخرج الكلب للتنزه كل يوم.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: هي تصطحب الكلب في نزهة.
    note: يأخذ الحيوان *को* (*कुत्ते को*)، وتأتي *घुमाने ले जाती है* في النهاية؛ و*ले जाना* ('اصطحب') تبقى كلمتين معًا.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: يُطعم
    gloss: يُطعم
    example_gloss: أُطعم القط كل يوم.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: يلعب مع
    gloss: يلعب مع
    example_gloss: فيكرام يلعب مع قطته.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: أُخرج الكلب للتنزه كل يوم
    gloss: أُخرج الكلب للتنزه كل يوم.
    note: '*रोज़* (''كل يوم'') تأتي قبل المفعول به: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: أُطعم القط كل يوم
    gloss: أُطعم القط كل يوم.
    note: '*खाना देना* (''إعطاء الطعام'') يحدد من يتلقى الطعام بـ *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: صيغ الجمع
    gloss: كلب واحد، كلبان؛ قطة واحدة، قطتان. الاسم المذكر المنتهي بـ *-आ* يتحول إلى *-ए* في الجمع (*कुत्ता* إلى *कुत्ते*)، أما الاسم المؤنث المنتهي بـ *-ई* فيضيف *-याँ* (*बिल्ली* إلى *बिल्लियाँ*).
    note: نمط الجمع المنتظم في الهندية، يُقدَّم هنا لأول مرة بأسماء الحيوانات مثالًا.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: الكلاب والقطط
    gloss: كلاب / قطط
    example_gloss:
    - أرجن يحب الكلاب.
    - نيها تحب القطط.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: الأسماك والطيور (جمع)
    gloss: أسماك / طيور
    example_gloss:
    - أحب الأسماك.
    - يحب الجد الطيور.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: أحب الحيوانات
    gloss: أحب الحيوانات.
    note: '*मुझे जानवर बहुत पसंद हैं* (''الحيوانات محبوبة جدًا عندي'') تعني «أحب الحيوانات»؛ و*हैं* جمع لأن *जानवर* جمع.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: نيها تحب القطط، لكن ليس لديها حيوان أليف
    gloss: نيها تحب القطط، لكن ليس لديها حيوان أليف.
    note: يمهّد للتناقض الذي تقوم عليه قراءة الدرس الخامس.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
