  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: ثلاث قواعد رئيسة
    gloss: 'القواعد الرئيسة الثلاث لهذه الوحدة: (1) ''X, Y se ADJ hai'' تعني «X أكثر (صفة) من Y»؛ (2) تتطابق الصفة دائمًا مع جنس المبتدأ (X) لا مع Y؛ (3) يمكن أيضًا وضع ''zyada'' قبل الصفة، مثل ''X, Y se zyada ADJ hai''، ويبقى المعنى نفسه («أكثر (صفة) من»).'
    note: ملخص ختامي يجمع قواعد الوحدة كلها، على غرار ملاحظة القواعد الجامعة في الوحدة 13.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X أكثر ADJ من Y''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''أكثر ADJ من'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: رسالة بريا
    gloss: أنا أكبر سنًا من أرجون، لكن أرجون طويل. وقبعتي جميلة؛ فهي أرخص من الحقيبة، وهي أحدث من الحقيبة أيضًا. - بريا
    note: رسالة قصيرة مكتوبة تعيد الوقائع التي وردت في الحوار نفسها، دون أي معلومة جديدة.
    glosses:
      बड़ी: أكبر سنًا (مؤنث)
      लंबा: طويل
      टोपी: قبعة
      अच्छी: جميلة / جيدة (مؤنث)
      बैग: حقيبة
      सस्ती: أرخص / رخيصة (مؤنث)
      नई: أحدث / جديدة (مؤنث)
