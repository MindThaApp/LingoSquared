  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = من (للمقارنة)
    gloss: 'سبق أن تعلّمتَ ''Se'' بمعنى «من» (الوحدة 9، ''yahan se seedhe jao'') وبمعنى «مع» (الوحدة 12، ''Priya se mila''). والآن تدل أيضًا على المقارنة: ''X, Y se ADJ hai'' تعني «X أكثر ADJ من Y» -- مثل ''Priya Arjun se badi hai''.'
    note: يعرض المعنى الثالث لكلمة سبق تعلّمها، مع ذكر المعنيين السابقين برقم الوحدة قبل تقديم المعنى الجديد.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''من'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''مع'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X أكثر ADJ من Y'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
