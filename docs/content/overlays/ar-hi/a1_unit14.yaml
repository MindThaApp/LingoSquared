    - أختي طويلة القامة.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: الصفة تتوافق مع الفاعل
    gloss: في جملة المقارنة تتوافق الصفة (مثل bada/badi, chota/choti) دائمًا مع جنس الفاعل لا مع الكلمة التي بعد 'se' -- ففي 'Arjun Priya se chota hai' تتوافق 'chota' مع Arjun (الفاعل المذكر) لا مع Priya.
    note: امتداد مباشر وصريح لنمط توافق الصفات -a/-i المعروف، مطبَّقًا على جمل المقارنة.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: أرجون أصغر من بريا.
