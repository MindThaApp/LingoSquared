course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: decir lo que empezaste, dejaste, intentaste u olvidaste hacer. Empezar con la cosa y را, con به y el infinitivo o con که y el subjuntivo; dejar un hábito con ترک کردن y دیگر; intentar y olvidar con که y el subjuntivo.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Empezar, dejar, intentar
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Empezar algo: «Empecé a correr»'
  prs.a2.unit33.lesson02.that_i_run:
    title: '«Que yo corra»: empezar e intentar con که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Dejar de hacer algo: ترک کردن y «ya no»'
  prs.a2.unit33.lesson04.forgetting:
    title: Olvidarse de hacer algo
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Leer y escuchar sobre hábitos
  prs.a2.unit33.lesson06.gym_conversation:
    title: Una conversación en el gimnasio
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: Gimnasio
    gloss: gimnasio, club deportivo
    note: '*باشگاه* es un gimnasio o club deportivo. Para decir que vas allí se usa *به*: *به باشگاه می‌روم* significa «voy al gimnasio».'
    example_gloss: El gimnasio está cerca de la casa.
  prs.a2.unit33.lesson01.teach.run:
    title: Correr
    gloss: correr
    note: '*دویدن* significa «correr». Su raíz de presente es *دو*, así que *می‌دوم* significa «corro». Como todos los infinitivos, *دویدن* termina en *-ن*, y en esta lección usarás esta forma en *-ن* después de *به*.'
    example_gloss: Corro todas las mañanas.
  prs.a2.unit33.lesson01.teach.exercise:
    title: Hacer deporte
    gloss: hacer deporte, hacer ejercicio
    note: '*ورزش کردن* significa «hacer deporte» o «hacer ejercicio». Es un verbo de dos palabras: *ورزش* se queda delante y solo cambia *کردن*, como en *ورزش می‌کنم* (hago ejercicio) y *ورزش کردم* (hice ejercicio).'
    example_gloss: Hago deporte todos los días.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Media hora
    gloss: media hora
    note: '*نیم ساعت* significa «media hora». *نیم* significa «medio» y va delante del sustantivo, como en *نیم ساعت* y *نیم ساعت ورزش*.'
    example_gloss: Todas las mañanas hago ejercicio media hora.
  prs.a2.unit33.lesson01.teach.habit:
    title: Hábito
    gloss: hábito
    note: '*عادت* significa «hábito». Toda esta unidad trata de hábitos: empezar uno bueno, dejar uno malo, intentar mantener uno y olvidarlo.'
    example_gloss: El ejercicio es un buen hábito.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Empezar algo: la cosa + را + شروع کردن'
    gloss: Empecé a hacer ejercicio. Empezaste a correr. Él o ella empezó el trabajo.
    note: 'Para decir que empezaste algo, pon la cosa antes de *را* y usa *شروع کردن* (empezar): *ورزش را شروع کردم* significa «empecé a hacer ejercicio». Es un verbo de dos palabras como *ورزش کردن*, así que solo cambia *کردن*: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. Lo que empiezas puede ser un sustantivo (*کار*, trabajo) o un infinitivo (*دویدن*, correr). El pronombre es opcional porque la terminación ya indica quién es.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: Empecé a hacer ejercicio hace un mes
    gloss: Empecé a hacer ejercicio hace un mes.
    note: '*پیش* después de una palabra de tiempo significa «hace»: *یک ماه پیش* es «hace un mes» y *دو هفته پیش* es «hace dos semanas». La palabra de tiempo suele ir al principio de la oración.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Empezar a hacer algo: به + infinitivo + شروع کردن'
    gloss: Empecé a correr. Empezaste a hacer ejercicio. Él o ella empezó a leer.
    note: 'Para decir que empezaste a hacer una acción, pon *به* y el infinitivo (el verbo en su forma en *-ن*) antes de *شروع کردن*: *به دویدن شروع کردم* significa «empecé a correr». Un verbo de dos palabras mantiene ambas en el infinitivo: *به ورزش کردن شروع کردم* significa «empecé a hacer ejercicio». También oirás el orden *شروع کردم به دویدن*, que significa lo mismo. Compara los dos patrones: *ورزش را شروع کردم* nombra una cosa que empezaste, y *به ورزش کردن شروع کردم* nombra la acción.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: Él o ella empezó a leer libros hace dos semanas
    gloss: Él o ella empezó a leer libros hace dos semanas.
    note: '*خواندن* significa «leer» (y «estudiar»). El infinitivo *خواندن* va después de *به*, y su complemento *کتاب* puede ir detrás: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: Dormir, irse a la cama
    gloss: dormir, irse a la cama
    note: '*خوابیدن* significa «dormir» o «irse a la cama». Su raíz de presente es *خواب*: *می‌خوابم* significa «duermo». *شب‌ها* significa «por las noches» o «al anochecer», como palabra de tiempo.'
    example_gloss: Por las noches me acuesto temprano.
  prs.a2.unit33.lesson02.teach.try:
    title: Intentar
    gloss: intentar, esforzarse
    note: '*کوشش* significa «esfuerzo», y *کوشش کردن* significa «intentar». Es un verbo de dos palabras: *کوشش می‌کنم* significa «intento» y *کوشش کردم* significa «intenté». Lo que intentas hacer va después de *که*, en subjuntivo.'
    example_gloss: Intento despertarme temprano.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'El subjuntivo: ب + raíz de presente + terminación'
    gloss: que yo corra, que yo duerma, que yo lea, que yo coma, que yo vaya, que yo vea; que yo haga ejercicio, que yo me despierte
    note: 'El subjuntivo es la forma verbal que se usa para lo que empiezas, intentas u olvidas hacer. Ya lo conoces por *باید*, como en *باید بروم*. Para formarlo, toma la raíz de presente, ponle *ب-* delante y añade las terminaciones *-م، -ی، -د، -یم، -ین، -ند*. Para *دویدن* (raíz *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Otros verbos: *خوابیدن* da *بخوابم*, *خواندن* da *بخوانم*, *خوردن* da *بخورم*, *رفتن* da *بروم*, *دیدن* da *ببینم*. Un verbo de dos palabras no lleva *ب-*: la primera palabra se queda y solo cambia *کردن* o *شدن*, así que *ورزش کنم* (que yo haga ejercicio) y *بیدار شوم* (que yo me despierte).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن y کوشش کردن con که
    gloss: Empecé a correr. Intento acostarme temprano. Intenté hacer ejercicio.
    note: 'Después de *شروع کردن* y *کوشش کردن* se añade *که* y un verbo en subjuntivo. *شروع کردم که بدوم* significa lo mismo que *به دویدن شروع کردم*: empecé a correr. *کوشش می‌کنم که زود بخوابم* significa «intento acostarme temprano». Normalmente el sujeto es el mismo, así que la terminación del subjuntivo indica la misma persona que el verbo principal: *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. El tiempo del primer verbo indica cuándo ocurre (intenté, intento); el subjuntivo no tiene tiempo propio.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'El subjuntivo negativo: ن en lugar de ب'
    gloss: Intento no comer dulces. Intento no acostarme tarde.
    note: 'Para decir «intentar no», pon *ن-* en lugar de *ب-*: *بخورم* pasa a *نخورم* (que yo no coma), *بخوابم* pasa a *نخوابم*, *بروم* pasa a *نروم*. No escribas *نبخورم*. Un verbo de dos palabras pone *ن-* en su parte verbal: *ورزش نکنم* (que yo no haga ejercicio).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: Él o ella intentó despertarse temprano
    gloss: Él o ella intentó despertarse temprano.
    note: 'La terminación del subjuntivo indica el sujeto: *شود* es «él» o «ella», así que *او کوشش کرد که زود بیدار شود* significa «él o ella intentó despertarse temprano».'
  prs.a2.unit33.lesson02.teach.we_started:
    title: Empezamos a hacer ejercicio todos los días
    gloss: Empezamos a hacer ejercicio todos los días.
    note: 'La terminación *-یم* indica «nosotros» en los dos verbos: *شروع کردیم* y *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: Dejar, renunciar a algo
    gloss: dejar, renunciar a algo
    note: '*ترک کردن* significa «dejar» o «abandonar» un hábito. Es un verbo de dos palabras: *ترک کردم* significa «lo dejé» y *ترک می‌کنم* significa «lo dejo».'
    example_gloss: Él o ella dejó de comer dulces.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Dulces
    gloss: dulces, pasteles, golosinas
    note: '*شیرینی* significa «dulces» y «pasteles». Es un buen ejemplo de un hábito que la gente intenta dejar.'
    example_gloss: Me gustan los dulces.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: Durante horas
    gloss: durante horas
    note: '*ساعت‌ها* es el plural de *ساعت* y significa «durante horas», «durante mucho tiempo». Sirve para hablar del tiempo de pantalla: *ساعت‌ها ویدیو دیدم* significa «vi vídeos durante horas».'
    example_gloss: Él o ella ve vídeos durante horas.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: A veces
    gloss: a veces
    note: '*گاهی* significa «a veces». Va al principio de la oración o antes del verbo, y es lo contrario de *همیشه* (siempre) y *هرگز* (nunca).'
    example_gloss: A veces veo vídeos.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Dejar un hábito: el hábito + را + ترک کردن'
    gloss: Dejé de comer dulces. Dejaste de acostarte tarde. Él o ella dejó de ver vídeos.
    note: 'Para decir que dejaste un hábito, pon el hábito antes de *را* y usa *ترک کردن*. El hábito es una frase de infinitivo: *شیرینی خوردن* (comer dulces), *دیر خوابیدن* (acostarse tarde), *ویدیو دیدن* (ver vídeos). Es el mismo patrón que *ورزش را شروع کردم*: la cosa, *را* y el verbo. También puedes decir *عادت بد را ترک کردم* (dejé un mal hábito).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'Ya no: دیگر + verbo negativo'
    gloss: Ya no como dulces. Ya no veo vídeos. Ya no me acuesto tarde.
    note: '*دیگر* con un verbo negativo significa «ya no»: *دیگر شیرینی نمی‌خورم* significa «ya no como dulces». Describe cómo son las cosas ahora, después de dejar algo. Para un relato en pasado puedes usar *دیگر* con el pasado simple negativo: *از آن روز دیگر شیرینی نخوردم* significa «desde ese día no volví a comer dulces». En presente, *ترک کردم* dice que tomaste la decisión y *دیگر نمی‌خورم* dice el resultado.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: Desde hoy ya no me acuesto tarde
    gloss: Desde hoy ya no me acuesto tarde.
    note: '*از امروز* significa «desde hoy». Con *دیگر* y un verbo negativo anuncia un nuevo hábito.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: Dejé un mal hábito
    gloss: Dejé un mal hábito.
    note: '*عادت بد* significa «mal hábito». El adjetivo *بد* va después del sustantivo.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: Por las noches uso menos el teléfono
    gloss: Por las noches uso menos el teléfono.
    note: '*کمتر* significa «menos». Reducir el tiempo de pantalla es otra forma de dejar un hábito: no lo abandonas del todo, lo haces menos.'
  prs.a2.unit33.lesson04.teach.forget:
    title: Olvidar
    gloss: olvidar
    note: '*فراموش کردن* significa «olvidar». Es un verbo de dos palabras: *فراموش کردم* significa «olvidé» y *فراموش نکردم* significa «no olvidé».'
    example_gloss: Perdone, se me olvidó.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: ¿Por qué no viniste ayer?
    gloss: ¿Por qué no viniste ayer?
    note: '*نیامدی* es el pasado simple negativo de *آمدن* para un amigo: «no viniste». La pregunta *چرا* significa «¿por qué?».'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Olvidar hacer algo: فراموش کردن که + subjuntivo'
    gloss: Olvidé llamar por teléfono. Olvidé traer mi libro. Olvidé acostarme temprano.
    note: 'Para decir que olvidaste hacer algo, usa *فراموش کردن* con *که* y un verbo en subjuntivo: *فراموش کردم که تیلفون کنم* significa «olvidé llamar por teléfono», es decir, la llamada no se hizo. Es el mismo subjuntivo de las lecciones anteriores y el sujeto normalmente es el mismo. *فراموش کردم* está en pasado, así que hablas de un momento que ya pasó; el subjuntivo después de *که* no tiene tiempo propio.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'No olvidé hacer algo: فراموش نکردم که'
    gloss: No olvidé llamar por teléfono. No olvidé traer mi libro.
    note: '*فراموش نکردم* pone la negación en *کردم*: no olvidé. Después de esto, la acción sí se hizo: *فراموش نکردم که کتابم را بیاورم* significa «no olvidé traer mi libro», o sea, lo traje. Compáralo con *فراموش کردم که کتابم را بیاورم* («olvidé traer mi libro», así que no lo traje).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Cuatro verbos, cuatro estructuras
    gloss: Empecé. Lo dejé. Intenté. Olvidé.
    note: 'Los cuatro verbos terminan en *کردن*, así que las terminaciones de persona son siempre las mismas (*کردم، کردی، کرد، کردیم، کردین، کردند*). Lo que viene después cambia. *شروع کردن*: la cosa y *را*, o *به* más el infinitivo, o *که* más el subjuntivo. *ترک کردن*: el hábito y *را*. *کوشش کردن*: *که* más el subjuntivo. *فراموش کردن*: *که* más el subjuntivo. Para decir que ya no haces algo, usa *دیگر* y un verbo en presente negativo.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: Olvidé acostarme temprano
    gloss: Olvidé acostarme temprano.
    note: Es el tipo de frase que dices cuando algo salió mal por un hábito que no mantuviste.
  prs.a2.unit33.lesson05.teach.read_book:
    title: Leer un libro
    gloss: leer un libro
    note: '*کتاب خواندن* significa leer un libro. El presente es *کتاب می‌خوانم* (leo un libro); *خواندن* también significa estudiar.'
    example_gloss: Todas las noches leo un libro durante media hora.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: Empecé a leer libros hace dos semanas
    gloss: Empecé a leer libros hace dos semanas.
    note: 'La estructura es la de la primera lección: una expresión de tiempo con *پیش*, luego *به* más el infinitivo y después *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Najiba le pregunta a Yasin cuándo empezó
    gloss: Yasin, ¿cuándo empezaste a hacer ejercicio?
    note: '*ورزش را کی شروع کردی؟* usa la estructura cosa más *را* más *شروع کردی*. *کی* pregunta cuándo. Los hablantes son amigos, por eso usan *تو*.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Yasin dice cuándo y cuánto
    gloss: Hace un mes. Ahora corro media hora en el gimnasio cada mañana.
    note: '*یک ماه پیش* es el punto de partida. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* es el hábito que tiene ahora.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Najiba pregunta por los dulces
    gloss: ¡Muy bien! ¿Comes dulces también?
    note: '*خیلی خوب* es una reacción amistosa. *شیرینی هم می‌خوری؟* pregunta si él también come dulces.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Yasin dice que dejó los dulces
    gloss: No, dejé de comer dulces. Ya no como dulces.
    note: '*شیرینی خوردن را ترک کردم* expresa la decisión y *دیگر شیرینی نمی‌خورم* expresa el resultado.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Najiba pregunta por los vídeos
    gloss: ¿Ves vídeos por las noches?
    note: '*شب‌ها* es una expresión de tiempo que significa «por las noches», y *می‌بینی* significa «ves».'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Yasin dice que intenta ver menos
    gloss: Sí, pero intento ver menos.
    note: '*کوشش می‌کنم که کمتر ببینم* usa *کوشش کردن* con el subjuntivo *ببینم*. No ha dejado los vídeos: lo está intentando.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: Un mensaje sobre nuevos hábitos
    gloss: Hola, Najiba. Hace dos semanas empecé a leer libros. Todas las noches leo media hora. Dejé de ver vídeos, así que ya no veo vídeos por las noches. Intento acostarme temprano. Ayer olvidé llamarte por teléfono. Khalida
    note: 'Un mensaje escrito breve que usa las cuatro estructuras: empezar (*به خواندن کتاب شروع کردم*), dejar (*ویدیو دیدن را ترک کردم*), intentar (*کوشش می‌کنم که زود بخوابم*) y olvidar (*فراموش کردم که تیلفون کنم*). La autora es una persona distinta de Yasin.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: Me desperté tarde por la mañana
    gloss: Me desperté tarde por la mañana.
    note: '*بیدار شدن* significa despertarse. *دیر* es tarde y *زود* es temprano: *صبح زود بیدار شدم* significa «me desperté temprano por la mañana».'
  prs.a2.unit33.lesson06.teach.every_night:
    title: Intento acostarme temprano todas las noches
    gloss: Intento acostarme temprano todas las noches.
    note: '*هر شب* significa todas las noches. Una expresión de tiempo como *هر شب* puede ir antes o después de *زود*; aquí va después de *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Yasin pregunta por qué Najiba no vino
    gloss: Najiba, ¿por qué no viniste ayer al gimnasio?
    note: '*چرا* pregunta por qué y *نیامدی* significa «no viniste». *به باشگاه* significa «al gimnasio».'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Najiba dice qué olvidó
    gloss: Olvidé acostarme temprano, así que me desperté tarde por la mañana.
    note: '*فراموش کردم که زود بخوابم* es la causa, con el subjuntivo *بخوابم*. *پس* (así que) introduce el resultado: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Yasin pregunta por hoy
    gloss: ¿Vienes hoy?
    note: '*می‌آیی* significa «vienes» o «vas a venir», dirigido a un amigo. En dari el presente simple con una expresión de tiempo también puede referirse al futuro próximo.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: Najiba dice que viene y lo que intenta
    gloss: Sí, hoy vengo a las seis. Intento acostarme temprano todas las noches.
    note: '*امروز ساعت شش می‌آیم* es el presente simple con una expresión de tiempo. *کوشش می‌کنم که هر شب زود بخوابم* es el nuevo hábito que quiere mantener.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: Yasin reacciona
    gloss: ¡Muy bien!
    note: '*خیلی خوب* es una reacción breve y amistosa.'
exercises:
  prs.a2.unit33.lesson01.exercise01.recognize_started_running:
    instruction: ¿Qué significa esta frase?
    correct_option: Empecé a correr
    distractors:
    - Dejé de correr
    - Mañana correré
    - Ayer corrí
    accepted_answers:
