course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: una entrevista de trabajo básica — vocabulario, cómo describir tu experiencia y disponibilidad, lectura de una oferta de empleo y la entrevista en sí.'
units:
  prs.a2.unit14.job_interview:
    title: Entrevista de trabajo
lessons:
  prs.a2.unit14.lesson01.interview_vocabulary:
    title: Palabras para una entrevista de trabajo
  prs.a2.unit14.lesson02.describing_experience_and_availability:
    title: Describir la experiencia y la disponibilidad
  prs.a2.unit14.lesson03.reading_a_job_posting:
