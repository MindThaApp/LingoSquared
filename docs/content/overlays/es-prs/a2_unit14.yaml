teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: Experiencia
    gloss: experiencia
    note: '*تجربه* es la palabra general para la experiencia laboral.'
    example_gloss: لیمه tiene tres años de experiencia.
  prs.a2.unit14.lesson01.teach.skill_word:
    title: Habilidad
    gloss: habilidad
    note: '*مهارت* es una destreza o habilidad.'
    example_gloss: La habilidad con el ordenador es importante.
  prs.a2.unit14.lesson01.teach.salary_word:
    title: Sueldo
    gloss: sueldo
    note: '*حقوق* significa sueldo o salario.'
    example_gloss: El sueldo de este puesto es de 30 000 afganis.
  prs.a2.unit14.lesson01.teach.position_word:
    title: Puesto / trabajo
    gloss: puesto / trabajo
    note: '*وظیفه* es una palabra general para un trabajo o puesto, distinta de *بست*, más formal (una vacante oficial).'
    example_gloss: Este puesto es en una oficina.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: Currículum
    gloss: currículum
    note: '*رزومه* es una palabra tomada del francés («résumé») para el currículum.'
    example_gloss: Envié mi currículum al entrevistador.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: Entrevista
    gloss: entrevista
    note: '*مصاحبه* es una entrevista de trabajo.'
    example_gloss: La entrevista de لیمه es mañana.
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: Cuántos años, con چند سال
    gloss: ¿Cuántos años de experiencia tiene usted?
    note: '*چند سال...؟* -- patrón de pregunta de cantidad para preguntar por los años de experiencia.'
    target_text: چند سال تجربه دارین؟ (¿cuántos años de experiencia tiene usted?)
  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: Indica tus años de experiencia
    gloss: Tengo tres años de experiencia en este puesto.
    note: '*در این وظیفه* significa «en este puesto».'
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: Di cuándo puedes empezar
    gloss: Puedo empezar a partir de la semana próxima.
    note: '*از هفتهٔ آینده* significa «a partir de la semana próxima»; *می‌توانم* significa «puedo».'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: Pregunta por el sueldo
    gloss: ¿Cuál es el sueldo de este puesto?
    note: '*چقدر؟* pregunta «¿cuánto?».'
  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: Vacante / puesto oficial
    gloss: vacante / puesto oficial
    note: '*بست* es el término afgano que se usa en las ofertas de empleo para una vacante oficial; es más formal que *وظیفه*.'
    example_gloss: Esta vacante es en una oficina.
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: Requisitos
    gloss: requisitos
    note: '*شرایط* enumera los requisitos o condiciones de un puesto.'
    example_gloss: El requisito de esta vacante es saber usar el ordenador.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: Una oferta de trabajo
    gloss: 'Para este puesto se requieren al menos dos años de experiencia. Requisitos: manejo del ordenador e inglés. Sueldo: 30 000 afganis al mes.'
    note: Una oferta de empleo breve y formal, en el registro que enseña esta unidad.
  prs.a2.unit14.lesson04.teach.turn01:
    title: El entrevistador da la bienvenida a لیمه
    gloss: El entrevistador le da la bienvenida y le pide que hable de su experiencia.
    note: '*خوش آمدین* es un «bienvenido» formal.'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه indica su experiencia
    gloss: Dice que tiene tres años de experiencia en este puesto.
    note: Es la misma frase de antes para indicar los años de experiencia.
  prs.a2.unit14.lesson04.teach.turn03:
    title: El entrevistador pregunta por las habilidades
    gloss: El entrevistador le pregunta cuáles son sus habilidades.
    note: '*مهارت‌های شما چیست؟* -- «¿cuáles son sus habilidades?».'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه enumera sus habilidades
    gloss: Sabe usar el ordenador y habla inglés.
    note: Enumera dos habilidades unidas con *و*.
  prs.a2.unit14.lesson04.teach.turn05:
    title: El entrevistador pregunta por la fecha de inicio
    gloss: El entrevistador le pregunta cuándo puede empezar.
    note: '*از کی می‌توانین شروع کنین؟* -- «¿desde cuándo puede empezar?».'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه responde y pregunta por el sueldo
    gloss: Puede empezar a partir de la semana próxima y pregunta cuál es el sueldo de este puesto.
    note: Combina la frase de la fecha de inicio *از هفتهٔ آینده می‌توانم شروع کنم* con la pregunta sobre el sueldo.
  prs.a2.unit14.lesson04.teach.turn07:
    title: El entrevistador indica el sueldo
    gloss: El entrevistador dice que son 30 000 afganis al mes.
    note: El sueldo coincide con la oferta de empleo que leíste antes.
