teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: El dinero
    gloss: dinero
    note: پول significa dinero.
    example_gloss: Tengo dinero.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Efectivo
    gloss: efectivo
    note: نقد significa efectivo.
    example_gloss: Pago en efectivo.
  prs.a1.unit23.lesson01.teach.kart:
    title: Tarjeta
    gloss: tarjeta
    note: کارت significa tarjeta (de pago).
    example_gloss: Tengo una tarjeta.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dólar
    gloss: dólar
    note: دالر significa dólar (USD); se usa mucho y se cotiza junto al afgani en el cambio de moneda cotidiano en Afganistán.
    example_gloss: Tengo cien dólares.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: Tengo
    gloss: tengo
    note: دارم significa «tengo» (ya apareció en la unidad 10, de compras).
    example_gloss: Tengo dinero.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Cien
    gloss: cien
    note: صد significa cien; ya apareció en los números de la unidad 4 y se reutilizó en las compras de la unidad 10.
    example_gloss: Tengo cien dólares.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Yo pago
    gloss: yo pago
    note: می‌پردازم significa «pago».
    example_gloss: Pago en efectivo.
  prs.a1.unit23.lesson02.teach.ya:
    title: O
    gloss: o
    note: یا significa o.
    example_gloss: Pago en efectivo o con tarjeta.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: ¿Efectivo o tarjeta?
    gloss: ¿Paga usted en efectivo o con tarjeta?
    note: Pregunta habitual en una tienda o en el mostrador de una casa de cambio.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Puedo
    gloss: puedo
    note: می‌توانم significa «puedo» (ya apareció antes en el curso).
    example_gloss: Puedo pagar en efectivo.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Pagar
    gloss: pagar
    note: بپردازم es la forma de subjuntivo de «pagar» y se usa después de می‌توانم (puedo); می‌توانم نقد بپردازم significa literalmente «puedo pagar en efectivo».
    example_gloss: Puedo pagar en efectivo.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Casa de cambio
    gloss: casa de cambio
    note: صرافی es la institución afgana real y habitual para cambiar moneda; es distinta de un بانک (banco) formal.
    example_gloss: Voy a la casa de cambio.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: Cambiar
    gloss: cambiar
    note: تبدیل کردن significa «cambiar» (moneda).
    example_gloss: Cambio dólares por afganis.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Tipo de cambio
    gloss: tipo de cambio
    note: نرخ significa tasa o tipo de cambio.
    example_gloss: ¿A cuánto está hoy el dólar?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: ¿A cuánto está hoy?
    gloss: ¿A cuánto está hoy el dólar?
    note: La forma habitual de preguntar por el tipo de cambio.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afgani
    gloss: afgani
    note: افغانی es la moneda de Afganistán (ya apareció en la unidad 10, de compras, p. ej. «صد افغانی»).
    example_gloss: Tengo cien afganis.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Repaso: es, hoy, cuánto'
    gloss: es / hoy / cuánto
    note: است, امروز y چند son palabras de repaso (ya vistas antes en el curso) que se combinan en la pregunta por el tipo de cambio de esta lección.
    example_gloss: ¿A cuánto está hoy el dólar?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Repaso: a, marca de objeto, hago, hacer, quiero'
    gloss: a / marca de objeto / hago / hacer / quiero
    note: به, را, می‌کنم, کنم y می‌خواهم son palabras de repaso (ya vistas antes en el curso) que se combinan en las frases de cambio de esta lección.
    example_gloss: Quiero cambiar dólares por afganis.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: quiero
    gloss: quiero
    note: می‌خواهم significa «quiero» (ya visto en unidades anteriores).
    example_gloss: Quiero cambiar dólares.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: ¿Cuántos tiene?
    gloss: ¿Cuántos dólares tiene usted?
    note: دارین es la forma de cortesía/plural de «tener» y se dirige al cliente.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Aquí tiene
    gloss: aquí tiene
    note: بفرمایین es una fórmula de cortesía que se usa al entregar algo.
    example_gloss: Aquí tiene, siete mil afganis.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Mil
    gloss: mil
    note: هزار significa mil.
    example_gloss: Siete mil afganis.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه, el personaje fijo del curso.
    example_gloss: Zarmina va a la casa de cambio.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Muy bien
    gloss: muy bien
    note: بسیار خوب, ya visto, se usa aquí para aceptar una oferta.
    example_gloss: Muy bien, gracias.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Repaso: setenta, gracias, hizo'
    gloss: setenta / gracias / hizo (él/ella)
    note: هفتاد y تشکر son palabras de repaso; کرد es el pasado de tercera persona de کردن (hacer), ya usado en la lección del pasado de la unidad 20; aquí se combinan para resumir el cambio.
    example_gloss: Zarmina cambió cien dólares por afganis.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Hola, quiero cambiar dólares por afganis.'
    gloss: Hola, quiero cambiar dólares por afganis.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Cambista: ¿Cuántos dólares tiene?'
    gloss: ¿Cuántos dólares tiene?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina: Tengo cien dólares. ¿A cuánto está el cambio hoy?'
    gloss: Tengo cien dólares. ¿A cuánto está el cambio hoy?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Cambista: Hoy un dólar son setenta afganis.'
    gloss: Hoy un dólar son setenta afganis.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Muy bien, cámbielos, por favor.'
    gloss: Muy bien, cámbielos, por favor.
    note: 'تبدیل کنین es el imperativo cortés: «(por favor) cambie».'
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Cambista: Aquí tiene, siete mil afganis.'
    gloss: Aquí tiene, siete mil afganis.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Gracias.'
    gloss: Gracias.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Recibo
    gloss: recibo
    note: رسید significa recibo.
    example_gloss: Pido un recibo.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Tomo / recibo
    gloss: tomo / recibo
    note: می‌گیرم significa «tomo/recibo».
    example_gloss: Recibo el dinero.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Texto de lectura
    gloss: Zarmina fue a la casa de cambio. Tenía cien dólares y quería cambiarlos por afganis. El cambio de hoy era de setenta afganis. Zarmina recibió siete mil afganis y tomó un recibo.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Fue
    gloss: fue
    note: رفت es el pasado «fue» (él/ella).
    example_gloss: Zarmina fue a la casa de cambio.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Repaso: siete, tomó/recibió (él/ella), tomé/recibí'
    gloss: siete / tomó, recibió (él/ella) / tomé, recibí
    note: هفت es un número de repaso; گرفت y گرفتم son el pasado de tercera y de primera persona de گرفتن (tomar/recibir), usados aquí para la cantidad que recibió Zarmina.
    example_gloss: Zarmina recibió siete mil afganis.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Resumen final
    gloss: 'Tengo dinero: efectivo y tarjeta. Puedo cambiar dólares por afganis en la casa de cambio. El cambio de hoy es de setenta afganis por un dólar.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Para
    gloss: para
    note: برای significa «por» o «para».
    example_gloss: Setenta afganis por un dólar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: Y
    gloss: y
    note: و significa «y»; ya la conoces de unidades anteriores.
    example_gloss: 'Tengo dinero: efectivo y tarjeta.'
