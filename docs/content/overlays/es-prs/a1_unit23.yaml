course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de dinero y pagos, cómo preguntar la forma de pago, el cambio de moneda en una صرافی (casa de cambio) y un diálogo entre Zarmina y Homayoun para cambiar dólares por afganis.'
units:
  prs.a1.unit23.money:
    title: El dinero
    description: Desenvuélvete en asuntos básicos de dinero, como cambiar moneda, pagar y preguntar por las formas de pago.
