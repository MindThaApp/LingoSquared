course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: decir lo que piensas hacer pronto y lo que tienes intención de hacer más adelante. El presente con una palabra de tiempo para los planes (mañana, la semana que viene, en verano), می‌خواهم más el subjuntivo y تصمیم دارم para las intenciones, con vacaciones, cursos y mudanzas.'
units:
  prs.a2.unit27.my_plans:
    title: Mis planes
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Mañana y la semana que viene: el presente para los planes'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Los planes de todos: personas, preguntas, vacaciones'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'Quiero...: intenciones con می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Decisiones, cursos y mudanzas
  prs.a2.unit27.lesson05.reading_and_listening:
    title: Leer y escuchar sobre planes
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: Una conversación sobre una casa nueva, y escritura
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Mahtab y Latif
    gloss: Mahtab y Latif son amigos.
    note: Dos amigos, *مهتاب* (una mujer) y *لطیف* (un hombre), cuentan sus planes en esta unidad. Hablan entre sí como amigos, por eso usan *تو*.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Mañana
    gloss: mañana
    note: '*فردا* significa «mañana». Es la palabra de tiempo que más usarás para un plan.'
    example_gloss: Mañana voy a Kabul.
  prs.a2.unit27.lesson01.teach.next_week:
    title: La semana que viene
    gloss: la semana que viene
    note: '*هفتهٔ آینده* significa «la semana que viene». *آینده* significa «próximo» y también funciona con otras palabras de tiempo: *ماه آینده* (el mes que viene), *سال آینده* (el año que viene).'
    example_gloss: La semana que viene voy a Herat.
  prs.a2.unit27.lesson01.teach.next_month:
    title: El mes que viene
    gloss: el mes que viene
    note: '*ماه آینده* significa «el mes que viene». Tiene el mismo patrón que *هفتهٔ آینده*.'
    example_gloss: El mes que viene voy a Mazar.
  prs.a2.unit27.lesson01.teach.next_year:
    title: El año que viene
    gloss: el año que viene
    note: '*سال آینده* significa «el año que viene».'
    example_gloss: El año que viene vengo a Kabul.
  prs.a2.unit27.lesson01.teach.summer:
    title: Verano
    gloss: verano, en verano
    note: '*تابستان* es el verano. También significa en verano: no hace falta otra palabra para decir en.'
    example_gloss: En verano voy a Bamiyán.
  prs.a2.unit27.lesson01.teach.plan:
    title: Plan
    gloss: plan, programa
    note: '*برنامه* es un plan. *برنامه دارم* significa tengo un plan, y es la forma habitual de decir que tienes planes.'
    example_gloss: Tengo un plan para el verano.
  prs.a2.unit27.lesson01.teach.rule:
    title: El presente con una palabra de tiempo expresa lo que piensas hacer
    gloss: Mañana voy. La semana que viene voy. En verano voy.
    note: 'El dari no tiene una palabra cotidiana aparte para el futuro. Para hablar de un plan se usa el presente normal, *می‌* más la raíz del presente, y se añade una palabra de tiempo que apunte al futuro: *فردا می‌روم* es mañana voy, *هفتهٔ آینده می‌روم* es la semana que viene voy. La palabra de tiempo es la que indica a quien escucha que el plan es futuro. Sin ella, *می‌روم* significa simplemente voy o me voy ahora. Es parecido al español, que también puede decir mañana voy en lugar de iré. El orden de las palabras es libre: la palabra de tiempo suele ir primero, pero *به هرات فردا می‌روم* también es correcto.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: El presente de رفتن para todas las personas
    gloss: yo voy, tú vas, él/ella va, nosotros vamos, ustedes van (formal o plural), ellos van
    note: 'El presente lleva el prefijo *می‌* (escrito con medio espacio), la raíz del presente *رو* y una terminación personal: *می‌روم* (yo), *می‌روی* (tú, un amigo), *می‌رود* (él o ella), *می‌رویم* (nosotros), *می‌روین* (usted o ustedes, formal o plural), *می‌روند* (ellos). El pronombre es opcional porque la terminación ya indica quién hace la acción. En este curso la terminación de la 2.ª persona del plural es *-ین*.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Mañana voy a Herat
    gloss: Mañana voy a Herat.
    note: 'Este es el patrón de la unidad: una palabra de tiempo, luego el lugar con *به* y por último el verbo en presente.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Vacaciones
    gloss: vacaciones, tiempo libre
    note: '*رخصتی* son las vacaciones o el tiempo libre del trabajo o de la escuela. Es la palabra afgana que más vas a oír.'
    example_gloss: En las vacaciones voy a Herat.
  prs.a2.unit27.lesson02.teach.travel:
    title: Viajar
    gloss: viajar, hacer un viaje
    note: '*سفر کردن* es viajar. El destino se indica con *به*: *به بامیان سفر می‌کنم* es viajo a Bamiyán. La terminación va en *کردن*, así que cambia como cualquier verbo en presente: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: En las vacaciones él o ella viaja a Bamiyán.
  prs.a2.unit27.lesson02.teach.hotel:
    title: Reservar un hotel
    gloss: reservar un hotel
    note: '*رزرو کردن* es reservar y *هوتل* es un hotel. Una reserva es un plan típico, así que encaja el presente con una palabra de tiempo: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Mañana reservo un hotel.
  prs.a2.unit27.lesson02.teach.buy:
    title: Comprar
    gloss: comprar
    note: '*خریدن* es comprar. La raíz del presente es *خر*: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Mañana compro fruta.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: El presente de آمدن
    gloss: yo vengo, tú vienes, él/ella viene, nosotros venimos, ustedes vienen (formal o plural), ellos vienen
    note: 'La raíz del presente de *آمدن* es *آی*, así que el verbo es *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. Las mismas terminaciones sirven para todos los verbos: *می‌مانم* (me quedo), *می‌گیرم* (tomo), *می‌خرم* (compro), *می‌کنم* (hago). Cada uno puede expresar un plan si añades una palabra de tiempo: *هفتهٔ آینده می‌آیم* es la semana que viene vengo.'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'La negación: نمی‌ para todas las personas'
    gloss: no voy, no vas, él/ella no va, no vamos, ustedes no van, ellos no van
    note: 'Para decir que no vas a hacer algo, pon *ن* delante de *می‌*: *می‌روم* pasa a ser *نمی‌روم*. Las terminaciones no cambian. *جمعه به مکتب نمی‌روم* es el viernes no voy a la escuela. Recuerda el medio espacio entre *نمی‌* y la raíz.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Preguntar por los planes de alguien
    gloss: ¿Qué haces mañana? ¿Adónde vas la semana que viene? ¿Con quién vas?
    note: 'Para preguntar por un plan se usa el mismo presente: *فردا چه می‌کنی؟* es ¿qué haces mañana?, *کجا می‌روی؟* es ¿adónde vas?, *با کی می‌روی؟* es ¿con quién vas? La respuesta también va en presente, así que una conversación sobre planes no necesita ninguna forma verbal nueva.'
  prs.a2.unit27.lesson02.teach.stay:
    title: Me quedo allí una semana
    gloss: Me quedo allí una semana.
    note: '*می‌مانم* es me quedo. Una duración como *یک هفته* va antes del verbo y no necesita ninguna palabra extra para decir durante.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'Intención: می‌خواهم más el subjuntivo'
    gloss: Quiero ir a Herat. Quiero venir. Quiero comprar un libro.
    note: 'Para decir lo que piensas o quieres hacer, usa *می‌خواهم* (quiero) y después un segundo verbo en subjuntivo: *می‌خواهم بروم* es quiero ir. El español usa un infinitivo después de querer; el dari, en cambio, usa un segundo verbo con terminación personal y sin ninguna palabra equivalente a «que» ni «a». Los dos verbos tienen la misma persona: *می‌خواهم بروم* (quiero ir), *می‌خواهیم برویم* (queremos ir). No pongas el infinitivo después de *می‌خواهم*. Aquí no hace falta la palabra *که*.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'El subjuntivo: بـ más la raíz del presente'
    gloss: que yo vaya, que tú vayas, que él/ella vaya, que nosotros vayamos, que ustedes vayan, que ellos vayan
    note: 'El subjuntivo se forma con *بـ* más la raíz del presente y las mismas terminaciones del presente: *رو* da *بروم، بروی، برود، برویم، بروین، بروند*. Otros verbos: *بخرم* (que compre), *بگیرم* (que tome), *بمانم* (que me quede), *بخورم* (que coma). *آمدن* es la excepción: *بیایم* (que venga). Lo encontrarás después de *می‌خواهم* y también después de *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: El presente de خواستن
    gloss: yo quiero, tú quieres, él/ella quiere, nosotros queremos, ustedes quieren (formal o plural), ellos quieren
    note: '*خواستن* tiene la raíz de presente *خواه*: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. El segundo verbo sigue la misma persona: *او می‌خواهد برود* (él o ella quiere ir), *ما می‌خواهیم برویم* (queremos ir).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: No quiero
    gloss: No quiero ir. No queremos venir.
    note: 'Pon *ن* en *می‌خواهم* para decir que no quieres: *نمی‌خواهم بروم* es no quiero ir. El segundo verbo sigue en subjuntivo y no lleva otra negación.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: Un plan y una intención
    gloss: Mañana voy a Herat. Quiero ir a Herat.
    note: 'Compara las dos frases. *فردا به هرات می‌روم* es un plan: está decidido, das un momento concreto y usas el presente. *می‌خواهم به هرات بروم* es una intención o un deseo: lo quieres, pero aún no está fijado, así que a menudo no lleva una hora exacta. Cuando tienes la fecha y todo está organizado, di el plan. Cuando solo lo deseas, di *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Curso
    gloss: curso, clase
    note: '*کورس* es un curso, por ejemplo de idiomas o de informática. Se hace con *گرفتن*: *کورس گرفتن* es hacer un curso.'
    example_gloss: Quiero hacer un curso de inglés.
  prs.a2.unit27.lesson03.teach.start:
    title: Empezar
    gloss: empezar, comenzar
    note: '*شروع شدن* es empezar. Se usa para algo que comienza: un curso, una reunión o una clase. *شروع می‌شود* es empieza. Con una palabra de tiempo también expresa un plan.'
    example_gloss: El curso empieza la semana que viene.
  prs.a2.unit27.lesson03.teach.university:
    title: Universidad
    gloss: universidad
    note: '*پوهنتون* es una universidad. Es la palabra afgana; se va allí con *به*.'
    example_gloss: Quiero ir a la universidad.
  prs.a2.unit27.lesson04.teach.move:
    title: Mudarse de casa
    gloss: mudarse de casa, cambiar de casa
    note: '*عوض کردن* es cambiar, así que *خانه عوض کردن* es mudarse de casa. *خانه را عوض می‌کنم* también es correcto. La terminación va en *کردن*: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: El mes que viene me mudo de casa.
  prs.a2.unit27.lesson04.teach.rent:
    title: Alquilar
    gloss: alquilar (una casa)
    note: '*کرایه* es el alquiler. *کرایه گرفتن* es alquilar una casa para uno mismo, por ejemplo *یک خانه کرایه می‌گیرم*. Con *می‌خواهم* el segundo verbo es *بگیرم*.'
    example_gloss: Quiero alquilar una casa nueva.
  prs.a2.unit27.lesson04.teach.near:
    title: Cerca
    gloss: cerca
    note: '*نزدیک* es cerca. Lo que está cerca se dice justo después: *نزدیک مکتب* es cerca de la escuela.'
    example_gloss: La casa nueva está cerca de la escuela.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: he decidido'
    gloss: Tengo la intención de ir a la universidad el año que viene.
    note: '*تصمیم دارم* es he decidido, tengo la intención de. Es algo más firme que *می‌خواهم*: lo has pensado. Como *می‌خواهم*, va seguido del subjuntivo: *تصمیم دارم بروم* es tengo la intención de ir. Ya conoces *قصد دارم* de la unidad de las vacaciones; significa lo mismo y también se acepta. El subjuntivo va al final de la oración, después de la palabra de tiempo y del lugar.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'El futuro escrito: خواهم رفت'
    gloss: Mañana iré a Herat. (escrito)
    note: 'En avisos, en las noticias y en textos formales verás *خواهم رفت*, *خواهد رفت*, *خواهیم رفت*: *خواه-* más la terminación y después la raíz del pasado *رفت*. Significa iré. Solo necesitas reconocerlo. Cuando hables, usa el presente con una palabra de tiempo: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Porque mi casa es pequeña
    gloss: Porque mi casa es pequeña.
    note: '*چون* es porque. Después viene una razón breve, aquí con la cópula *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Mañana (por la mañana)
    gloss: mañana (parte del día), por la mañana
    note: '*صبح* es la mañana. *فردا صبح* es mañana por la mañana.'
    example_gloss: Mañana por la mañana voy a Bamiyán.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Mahtab pregunta por las vacaciones
    gloss: Latif, ¿tienes algún plan para las vacaciones?
    note: Mahtab le pregunta a Latif por sus planes de vacaciones. *برنامه داری؟* es ¿tienes un plan?, y ella usa *تو* porque él es un amigo.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Latif cuenta su plan
    gloss: Sí. La semana que viene voy a Herat. Me quedo allí una semana.
    note: 'Latif responde *بلی* (sí). Su plan tiene una palabra de tiempo, *هفتهٔ آینده*, y el presente: *می‌روم*. *یک هفته آنجا می‌مانم* es un segundo plan en presente.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Mahtab pregunta por el tiempo después
    gloss: ¡Qué bien! ¿Y qué haces después?
    note: '*بعد از آن* es después de eso. La pregunta va en presente, como siempre para un plan.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Latif dice lo que quiere
    gloss: Quiero hacer un curso de inglés.
    note: 'Latif no tiene una fecha exacta, así que usa una intención: *می‌خواهم* más el subjuntivo *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Mahtab pregunta cuándo empieza el curso
    gloss: ¡Genial! ¿Cuándo empieza el curso?
    note: '*کورس کی شروع می‌شود؟* pregunta cuándo empieza un curso. El presente *شروع می‌شود* habla de una fecha futura.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Latif dice el mes
    gloss: Desde el mes que viene.
    note: '*از ماه آینده* es desde el mes que viene. Basta con una respuesta corta.'
  prs.a2.unit27.lesson05.teach.message:
    title: Un mensaje sobre planes
    gloss: Hola, Mahtab. Mañana por la mañana voy a Bamiyán y me quedo allí dos días. La semana que viene trabajo en la oficina. El año que viene tengo la intención de ir a la universidad.
    note: Un mensaje escrito breve. Tiene un plan para mañana, un plan para la semana que viene y una intención para el año que viene. Todos los planes usan el presente con una palabra de tiempo, y la intención usa *تصمیم دارم* más el subjuntivo.
  prs.a2.unit27.lesson06.teach.help:
    title: Ayudar
    gloss: ayudar
    note: '*کمک* es ayuda. *کمک کردن* es ayudar: *فردا کمک می‌کنم* es mañana ayudo. La terminación va en *کردن*.'
    example_gloss: Mañana ayudo a mi amigo.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Latif pregunta por el mes que viene
    gloss: Mahtab, ¿qué haces el mes que viene?
    note: Latif pregunta por un plan con una palabra de tiempo, *ماه آینده*, y el presente.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Mahtab cuenta su plan
    gloss: El mes que viene me mudo de casa.
    note: '*خانه عوض می‌کنم* es me mudo de casa. Es un plan, así que usa el presente con la palabra de tiempo.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Latif pregunta por qué
    gloss: ¿Por qué?
    note: '*چرا؟* es ¿por qué? Una pregunta de una sola palabra es natural entre amigos.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Mahtab lo explica
    gloss: Porque mi casa es pequeña. Quiero alquilar una casa nueva, cerca de la escuela.
    note: '*چون* da la razón junto con *است*. Después viene una intención, *می‌خواهم* más el subjuntivo *بگیرم*, porque ella todavía no ha encontrado la casa.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Latif se ofrece a ayudar
    gloss: ¡Bien! Mañana vengo y te ayudo.
    note: 'Latif hace un plan al momento con *فردا* y el presente: *می‌آیم* y *کمک می‌کنم*. *کمک کردن* es ayudar.'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Mahtab le da las gracias
    gloss: ¡Gracias!
    note: '*تشکر!* es una forma breve de dar las gracias a un amigo.'
