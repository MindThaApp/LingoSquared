course:
  title: Darí A1
  description: 'Dari afgano para principiantes: lectura de la escritura perso-árabe, comprensión del habla cotidiana afgana, saludos extendidos y un primer encuentro respetuoso en un lugar de trabajo de Kabul.'
units:
  prs.a1.unit01.greetings:
    title: Saludos y primeros encuentros
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Lee las letras de esta unidad
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Intercambia saludos cotidianos
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Saluda y despídete según el momento del día
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Conversa de forma cortés e informal
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Pregunta por la familia y muestra respeto a los invitados
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Empieza el primer día en un lugar de trabajo de Kabul
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Las letras ا، ب، ت y د
    gloss: a/ā, b, t y d
    note: El dari se escribe de derecha a izquierda. La letra د no se une a la letra siguiente, a su izquierda.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Las letras ر y ز
    gloss: r y z
    note: Ninguna de las dos letras se une a la letra siguiente.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Las letras س، ش y ص
    gloss: s, sh y s
    note: س y ص representan ambas un sonido s en el dari corriente; ش representa sh.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Las letras ج، چ، ح y خ
    gloss: j (como en inglés «job»), ch, h y kh
    note: چ es ch. خ es el sonido que suele transcribirse como kh, parecido a la «j» española.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Las letras ع، غ، ف y ق
    gloss: ʿ, gh, f y q
    note: La pronunciación exacta de غ y ق varía entre los hablantes de dari; mantenlas diferenciadas al escribir.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Las letras ک، گ، ل y م
    gloss: k, g, l y m
    note: ک es la kaf persa; es la forma que se usa para k en dari. ل y م se unen a las letras de ambos lados.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Las letras ن، و، ه y ی
    gloss: n, w/v/o/u, h y y/i larga
    note: ی es la ye persa; se usa para y y para la vocal larga ī. و puede ser consonante (w/v) o vocal larga (o/u).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Lee una palabra con letras unidas
    gloss: hola
    note: Las letras se unen para formar سلام. Las vocales breves normalmente no se escriben.
    example_gloss: ¡Hola! Soy Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Un saludo cotidiano y respetuoso
    gloss: La paz sea contigo / hola
    note: سلام علیکم está muy extendido en Afganistán y sirve tanto para encuentros familiares como respetuosos.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Responde al saludo
    gloss: Y la paz sea contigo
    note: وعلیکم سلام es la respuesta habitual a سلام علیکم. También se aceptan las formas que contienen السلام.
  prs.a1.unit01.lesson02.teach.salam:
    title: Un saludo corto
    gloss: hola
    note: سلام es un saludo más breve y flexible.
    example_gloss: Hola, ¿cómo está usted?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Bienvenido
    gloss: bienvenido
    note: خوش آمدین es la bienvenida hablada y respetuosa; se usa para una persona o para varias.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Gracias
    gloss: gracias
    note: تشکر es la forma del dari afgano preferida en este curso. ممنون y ممنونم son variantes secundarias que se entienden.
    example_gloss: Muchas gracias.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Una respuesta formal a un agradecimiento
    gloss: de nada
    note: خواهش می‌کنم es una respuesta cortés común a todo el mundo persa. No se presenta como un uso coloquial propiamente afgano.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Despedida
    gloss: adiós
    note: خدا حافظ es una despedida convencional del dari afgano y a menudo se escribe en dos palabras.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Saludo de la mañana
    gloss: buenos días
    note: صبح بخیر se usa por la mañana.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Saludo del día
    gloss: buenos días
    note: روز بخیر es un saludo cortés para las horas del día.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Saludo de última hora del día
    gloss: buenas tardes
    note: عصر بخیر se usa en la parte final del día.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Expresión nocturna
    gloss: buenas noches (para ir a dormir)
    note: شب بخیر suele usarse para cerrar la velada, más que para iniciar un encuentro corriente durante el día.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Una despedida cortés para el día
    gloss: que tengas un buen día
    note: روز خوش es una despedida cortés y algo formal, común a todo el mundo persa, más que una fórmula coloquial propiamente afgana.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Hasta el próximo encuentro
    gloss: espero volver a verte
    note: به امید دیدار es una despedida cálida pero respetuosa.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Pregunta con cortesía cómo está alguien
    gloss: ¿Cómo está usted?
    note: استین es una forma hablada cortés habitual en el dari afgano, que se usa con شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Pregunta a un compañero o a un amigo cercano
    gloss: ¿Cómo está usted?
    note: تو y استی son formas informales del singular; no uses esta combinación de manera automática con una persona mayor o alguien que acabas de conocer.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Di que estás bien
    gloss: Estoy bien, gracias.
    note: استم significa «soy/estoy». Es la forma hablada del dari afgano que se usa en todo este curso.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Di que estás sano o bien
    gloss: Estoy bien.
    note: جور expresa estar bien o tener buena salud y es frecuente en los saludos afganos.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Una respuesta moderada
    gloss: No estoy mal.
    note: بد نیستم es una respuesta neutra.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Devuelve la pregunta
    gloss: ¿Y usted?
    note: و شما؟ mantiene el intercambio respetuoso y breve.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Alarga el saludo
    gloss: ¿Están todos bien?
    note: En Afganistán, los saludos pueden continuar con preguntas sobre la familia antes de empezar a hablar de asuntos de trabajo.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Pregunta por la familia de alguien
    gloss: ¿Está bien tu familia?
    note: Preguntar por la familia es habitual en un saludo afgano extendido. El curso escribe la forma posesiva como فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Pregunta por la casa y los suyos
    gloss: ¿Están bien todos en casa?
    note: اهل خانه se refiere de forma colectiva a los miembros del hogar.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Responde a la pregunta por la familia
    gloss: Gracias a Dios, todos están bien.
    note: Aquí شکر es una expresión abreviada de gratitud, no la palabra «azúcar» en sentido literal.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Ofrece una respuesta cálida y cortés
    gloss: Que vivas muchos años / gracias.
    note: زنده باشین es una fórmula de cortesía afgana habitual, que suele decirse en respuesta a un agradecimiento o a palabras amables. باشین es la forma hablada respetuosa para «usted».
  prs.a1.unit01.lesson05.teach.own_home:
    title: Da una cálida bienvenida a un invitado
    gloss: Esta es tu propia casa.
    note: خانهٔ خودتان است asegura al invitado que es bienvenido.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Ofrece el lugar de respeto
    gloss: Por favor, ocupe el lugar de honor.
    note: En la sala de invitados, بالا بفرمایین invita al huésped al lugar más honorable, el más alejado de la entrada. No significa necesariamente «arriba».
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Saluda primero a los mayores
    gloss: Saludamos primero a los mayores.
    note: Saludar primero a los mayores muestra respeto. El saludo físico depende de la relación, del género y de cada persona; quien aprende no debe dar por hecho que un apretón de manos sea apropiado.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Oficina
    gloss: oficina
    note: دفتر designa una oficina o un lugar de trabajo.
    example_gloss: Mi oficina está en Kabul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل es la capital de Afganistán y el escenario de este diálogo.
    example_gloss: Vivo en Kabul.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed se presenta como el nuevo compañero
    gloss: Hamed dice que es el nuevo compañero de trabajo.
    note: Los dos hablantes son compañeros adultos que se conocen en una oficina de Kabul.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib le da la bienvenida y le pregunta su nombre
    gloss: Najib le da la bienvenida y le pregunta cómo se llama.
    note: خوش آمدین es la bienvenida hablada, respetuosa, que se usa con una o con varias personas.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed dice su nombre
    gloss: Hamed dice cómo se llama.
    note: نامم حامد است (me llamo Hamed) es la forma hablada de todos los días; نامم es نام + -م (mi). Por escrito también verás نام من حامد است. Ambas son correctas.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib se presenta y dice que le alegra conocerlo
    gloss: Najib se presenta y dice que le alegra conocerlo.
    note: از آشنایی با شما خوش شدم se refiere expresamente a conocer a alguien, por eso encaja en un primer encuentro.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed corresponde al gusto y pregunta cómo está Najib
    gloss: Hamed corresponde al gusto y pregunta cómo está Najib.
    note: El intercambio mantiene el شما y el استین respetuosos entre compañeros que acaban de conocerse.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib responde
    gloss: Najib dice que está bien, gracias.
    note: جور استم، تشکر responde a la pregunta por el bienestar, como se vio antes en esta unidad.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib pregunta por la familia de Hamed
    gloss: Najib pregunta por la familia de Hamed.
    note: La pregunta por la familia alarga el saludo antes de pasar al trabajo.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed dice que todos están bien
    gloss: Hamed dice que todos están bien.
    note: شکر، همه جور استند responde a la pregunta por la familia, como se vio antes en esta unidad.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib se ofrece a presentarle a los demás compañeros
    gloss: Najib se ofrece a presentarle a los demás compañeros.
    note: Aquí بفرمایین invita a Hamed a acompañarlo, no a sentarse ni a tomar algo.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed acepta y da las gracias
    gloss: Hamed acepta y da las gracias.
    note: بسیار خوب se presenta aquí como una respuesta afirmativa clara.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib responde con amabilidad y le indica su escritorio a Hamed
    gloss: Najib responde con amabilidad y le indica su escritorio a Hamed.
    note: El diálogo termina con el comienzo de la jornada de trabajo, sin repetir una despedida de visita a una casa.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed le da las gracias
    gloss: Hamed le da las gracias.
    note: تشکر cierra el intercambio de forma sencilla.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: ¿Con qué letra empieza سلام?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام empieza con س. Esta pregunta comprueba la escritura de la palabra aprendida, no qué letras pueden representar el sonido s.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: ¿Qué letra representa el sonido ch?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ representa el sonido ch.
    prompt_blocks:
    - ch
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
