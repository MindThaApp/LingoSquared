        خ: j (como la «j» española)
        ق: gh/q
        ل: l
        م: m
        ن: n
        و: w/v
        ه: h
        ی: y / i larga
      status: correct
    feedback: Estos valores sonoros reaparecerán a lo largo de la unidad.
    pairs:
    - left: خ
      right: j (como la «j» española)
    - left: ق
      right: gh/q
    - left: ل
      right: l
    - left: م
      right: m
    - left: ن
      right: n
    - left: و
      right: w/v
    - left: ه
      right: h
    - left: ی
      right: y / i larga
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: Ordena las letras para formar سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م forma سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Elige la palabra con letras unidas que significa «hola».
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام significa «hola».
    prompt_blocks:
    - hola
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: ¿Se escribe el dari de derecha a izquierda?
    options:
    - sí
    - 'no'
    accepted_answers:
    - value: sí
      status: correct
    feedback: La escritura del dari va de derecha a izquierda.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Copia سلام exactamente.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: La escritura correcta es سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: ¿Qué significa esta frase?
    correct_option: hola (la paz sea contigo)
    distractors:
    - adiós
    - bienvenido
    - gracias
    accepted_answers:
    - value: hola (la paz sea contigo)
      status: correct
    feedback: سلام علیکم significa «hola» (literalmente, «la paz sea con ustedes»).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Traduce al dari: «Y la paz sea contigo también» (la respuesta convencional a سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Variante aceptada de espaciado.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Variante habitual de la respuesta completa.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Respuesta completa habitual con la conjunción separada.
    feedback: وعلیکم سلام es la respuesta convencional; también son válidas las formas completas habituales con السلام.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Responde a سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Se entiende, pero corresponde menos al saludo que la respuesta completa.
    feedback: وعلیکم سلام y وعلیکم السلام son las respuestas completas convencionales.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Elige el significado de خوش آمدین.
    correct_option: bienvenido
    distractors:
    - adiós
    - gracias
    - buenas noches
    accepted_answers:
    - value: bienvenido
      status: correct
    feedback: خوش آمدین significa «bienvenido».
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Traduce al dari: «Gracias».'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: Se entiende en dari; تشکر es la forma preferida en este curso.
    - value: ممنونم
      status: acceptable_with_note
      note: Se entiende en dari; تشکر es la forma preferida en este curso.
    feedback: تشکر es la respuesta preferida en el dari de Afganistán en este curso.
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Ordena la frase formal, usada en distintas regiones, que significa «De nada».
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم es una respuesta cortés a las gracias, usada en distintas regiones.
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
    instruction: Elige el significado de خدا حافظ.
    correct_option: adiós
    distractors:
    - bienvenido
    - hola
    - gracias
    accepted_answers:
    - value: adiós
      status: correct
    feedback: خدا حافظ es una despedida.
  prs.a1.unit01.lesson02.exercise08.speak_exchange:
    instruction: Oyes سلام علیکم. Devuelve el saludo en voz alta.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Una respuesta más corta, pero que corresponde menos al saludo.
    feedback: Usa وعلیکم سلام o وعلیکم السلام como respuesta completa convencional.
  prs.a1.unit01.lesson03.exercise01.translate_morning:
    instruction: 'Traduce al dari: «Buenos días».'
    accepted_answers:
    - value: صبح بخیر
      status: correct
    - value: صبح به خیر
      status: acceptable_with_note
      note: Variante habitual de espaciado.
    feedback: صبح بخیر significa «buenos días».
  prs.a1.unit01.lesson03.exercise02.recognize_day_reading:
    instruction: ¿Qué significa esta frase?
    correct_option: buen día
    distractors:
    - buenas noches
    - buenas tardes
    - que tengas un buen día
    accepted_answers:
    - value: buen día
      status: correct
    feedback: روز بخیر significa «buen día».
  prs.a1.unit01.lesson03.exercise03.evening_meaning:
