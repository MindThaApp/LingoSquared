        ت: t
        د: d
        ر: r
        ز: z
        ش: sh
        ج: y (como en inglés «job»)
        چ: ch
        ف: f
        ک: k
        گ: g
      status: correct
    feedback: Repaso acumulativo de todas las letras vistas hasta ahora, con ک/گ (el par más reciente) incluido.
    pairs:
    - left: ا
      right: a
    - left: ب
      right: b
    - left: ت
      right: t
    - left: د
      right: d
    - left: ر
      right: r
    - left: ز
      right: z
    - left: ش
      right: sh
    - left: ج
      right: y (como en inglés «job»)
    - left: چ
      right: ch
    - left: ف
      right: f
    - left: ک
      right: k
    - left: گ
      right: g
  prs.a1.unit01.lesson01.exercise04.match_final_group:
    instruction: Relaciona cada letra con su valor sonoro aproximado.
    accepted_answers:
