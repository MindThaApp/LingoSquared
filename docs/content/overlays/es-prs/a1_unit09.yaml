teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Sábado y domingo
    gloss: sábado, domingo
    note: شنبه (sábado) es el primer día de la semana en Afganistán; le sigue یکشنبه (domingo).
    example_gloss:
    - Hoy es sábado.
    - Mañana es domingo.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Lunes y martes
    gloss: lunes, martes
    note: دوشنبه y سه‌شنبه significan literalmente «segundo día» y «tercer día» después de شنبه.
    example_gloss:
    - El lunes tengo clase.
    - El martes tengo una cita.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Miércoles y jueves
    gloss: miércoles, jueves
    note: 'چهارشنبه y پنجشنبه siguen el mismo patrón: «cuarto día» y «quinto día».'
    example_gloss:
    - El miércoles trabajo.
    - Nos vemos el jueves.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Viernes
    gloss: viernes
    note: جمعه es el día de descanso semanal en Afganistán.
    example_gloss: El viernes es festivo.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Fecha
    gloss: fecha
    note: تاریخ es la palabra general para la fecha del calendario.
    example_gloss: ¿Qué fecha es hoy?
  prs.a1.unit09.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra de enlace más común y se usa en toda esta unidad.
    target_text: و (y)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: El día de descanso semanal
    gloss: El viernes es el día libre de la semana.
    note: A diferencia del fin de semana de sábado y domingo, el principal día de descanso semanal en Afganistán es *جمعه* (viernes); el jueves suele ser media jornada.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1.er mes)
    gloss: Hamal, el primer mes del calendario solar hégira (aprox. finales de marzo-abril)
    note: حمل inicia el año solar afgano y coincide con el Nowruz, el año nuevo.
    example_gloss: Hamal es el primer mes del año.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2.º mes)
    gloss: Sawr, el segundo mes (aprox. abril-mayo)
    note: ثور sigue a حمل.
    example_gloss: En Sawr hace buen tiempo.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Jawza (3.er mes)
    gloss: Jawza, el tercer mes (aproximadamente mayo-junio)
    note: جوزا va después de ثور.
    example_gloss: Nací en Jawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: El calendario de Afganistán
    gloss: Afganistán usa el calendario hijri shamsi (hégira solar).
    note: Es el mismo sistema de calendario solar que se usa en Irán, distinto tanto del calendario gregoriano como del calendario hijri lunar.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Preguntar qué día es hoy
    gloss: ¿Qué día es hoy?
    note: امروز چند شنبه است؟ pregunta literalmente «hoy es ¿cuál -shanbe?», la forma natural de preguntar el día de la semana.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Hoy
    gloss: hoy
    note: امروز designa el día actual.
    example_gloss: ¿A qué fecha estamos hoy?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Dar la fecha completa
    gloss: Hoy es jueves, 15 de Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است combina el día de la semana, una fecha en número ordinal y el nombre del mes.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Preguntar qué día es un evento
    gloss: ¿Qué día es la reunión?
    note: جلسه کدام روز است؟ usa کدام («cuál») para preguntar por el día de un evento.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Preguntar por una fecha concreta
    gloss: ¿Qué día de Hamal cae el lunes?
    note: دوشنبه چندم حمل است؟ pregunta qué día numerado del mes es el lunes.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19.º
    gloss: decimonoveno (19.º)
    note: '*نوزدهم* es la forma ordinal de diecinueve y sigue el mismo patrón ordinal que *پانزدهم* (15.º).'
    example_gloss: Hoy es 19.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun pregunta por el día de la reunión
    gloss: Homayoun le pregunta a Bashir qué día es la reunión.
    note: جلسه کدام روز است؟ de la lección 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir responde
    gloss: Bashir dice que cree que es el lunes.
    note: فکر می‌کنم («creo») suaviza la respuesta porque no está del todo seguro.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun pregunta por la fecha exacta
    gloss: Homayoun pregunta a qué día de Hamal cae el lunes.
    note: دوشنبه چندم حمل است؟ de la lección 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir da la fecha exacta
    gloss: Bashir dice que el lunes es 19 de Hamal.
    note: '*دوشنبه نوزدهم حمل است* combina el día, la fecha ordinal y el mes, según el patrón de la lección 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun pregunta por el viernes
    gloss: Homayoun acepta y pregunta si Bashir está libre el viernes.
    note: وقت داری؟ («¿tienes tiempo?») es una forma natural de preguntar por la disponibilidad.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir dice que está ocupado
    gloss: Bashir dice que no, que el viernes está ocupado.
    note: مصروف استم («estoy ocupado») explica por qué el viernes no le viene bien.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun confirma el lunes
    gloss: Homayoun dice que no hay problema y que verá a Bashir el lunes.
    note: مشکل نیست («no hay problema») resuelve el conflicto de horario antes de confirmar el plan original del lunes.
