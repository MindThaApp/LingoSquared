teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Cambiar una cita
    gloss: aplazar (una cita) / cancelar
    note: '*قرار را تغییر دادن* significa pasarla a otra hora. *لغو کردن* significa cancelarla por completo.'
    example_gloss:
    - Quiero aplazar mi cita.
    - Tengo que cancelar mi cita.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: Pedir disculpas
    gloss: lamentablemente / perdón
    note: '*متأسفانه* es una forma cortés de dar una mala noticia. *ببخشین* es la disculpa de uso diario.'
    example_gloss:
    - Lamentablemente no puedo ir.
    - Perdón, llego demasiado tarde.
  prs.a2.unit21.lesson01.teach.slman:
    title: La peluquería
    gloss: la peluquería
    note: '*سلمانی* es la barbería, el lugar. *دلاک* es la palabra tradicional para el propio barbero.'
    example_gloss: La peluquería abre de nueve a seis.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Pedir que se aplace una cita
    gloss: ¿Puedo cambiar mi cita?
    note: 'Una pregunta de sí o no mantiene el orden de la afirmación y solo sube el tono: *می‌توانم قرارم را تغییر بدهم؟* El segundo verbo, *تغییر بدهم*, va al final.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Decir que no puedes ir
    gloss: Lamentablemente no puedo ir.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + subjuntivo
    gloss: El jueves no puedo ir. ¿Puedo aplazar la cita?
    note: 'Después de *می‌توانم* (puedo), el segundo verbo va en subjuntivo y se coloca al final: *می‌توانم بیایم*. Para decir *no puedo*, la *ن* se añade al verbo auxiliar: *نمی‌توانم بیایم*. La palabra del día va al principio: *پنجشنبه نمی‌توانم بیایم*. La pregunta tiene el mismo orden de palabras; solo cambia la entonación: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Otro día
    gloss: otro día
    note: '*دیگر* significa otro y va después del sustantivo: *یک روز دیگر* es otro día.'
    example_gloss: ¿Puede ser también otro día?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Proponer un día
    gloss: ¿Podría ser también el lunes?
    note: 'Delante de un día de la semana no se necesita preposición: *دوشنبه هم ممکن است؟* *هم* significa también y va después del día.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: ¿Le viene bien?
    gloss: ¿Le viene bien el viernes? (formal)
    note: '*مناسب* significa conveniente. *برای شما مناسب است* es la forma cortés de preguntar si una hora le conviene a alguien a quien no conoces bien. *برایم* es la forma corta de *برای من* (para mí).'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Decir que sí
    gloss: Sí, me viene bien.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Decir que no con educación
    gloss: Lamentablemente no.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: ¿Le viene bien?
    gloss: ¿Le viene bien el viernes? Sí, me viene bien. No, lamentablemente no.
    note: Para preguntar si una hora le conviene a alguien, usa *برای شما مناسب است؟*, con el *شما* cortés. Responde *بلی، برایم مناسب است* para confirmar, o *متأسفانه نه* para rechazar con cortesía. *برای* más una terminación pronominal (*برایم*, *برایتان*) significa para mí, para ti/usted.
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Porque y lo siento
    gloss: porque / lo siento
    note: '*چون* une dos oraciones completas e indica el motivo. *متأسفم* es una disculpa más formal que *ببخشین*.'
    example_gloss:
    - No puedo venir porque estoy enfermo.
    - Lo siento.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: La molestia
    gloss: la molestia
    note: '*بابت زحمت ببخشین* es una frase cortés para cuando has causado una molestia extra a alguien. *زحمت* significa molestia o esfuerzo.'
    example_gloss: Disculpe las molestias.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Motivo: el trabajo'
    gloss: No puedo ir, porque tengo que trabajar.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Motivo: otra cita'
    gloss: No puedo venir porque tengo otra cita.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Porque: want'
    gloss: No puedo venir porque estoy enfermo.
    note: 'Después de *چون* la oración es una oración normal, con el verbo al final. Se pone una coma antes: *نمی‌توانم بیایم، چون مریض استم.* La forma *استم* es la forma de *yo* de *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Quedar y con antelación
    gloss: quedar, acordar / con antelación
    note: '*قرار گذاشتن* es acordar juntos una hora o un lugar. *از قبل* significa de antemano, con antelación.'
    example_gloss:
    - ¿Quedamos?
    - Llama un día antes.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Aceptar una hora
    gloss: El lunes a las diez está bien.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Preguntar si una hora le viene bien
    gloss: ¿Puede venir el lunes a las diez? (formal)
    note: '*می‌توانین* es la forma cortés de *tú/usted* de *می‌توانی*; la terminación plural *-ین* va con *شما*. El segundo verbo, *بیایین*, va al final.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: Cerrar el acuerdo
    gloss: Entonces nos vemos el lunes.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Hacer una nueva cita
    gloss: Entonces haré una nueva cita.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: Primero el día, luego la hora
    gloss: El lunes a las diez va bien. ¿Puede venir el lunes a las diez?
    note: 'Cuando das un día y una hora, primero va el día, luego *ساعت* + el número: *دوشنبه ساعت ده*. En una pregunta cortés usa *می‌توانین ...؟* y pon el verbo al final.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: Un mensaje de la peluquería
    gloss: Estimado Homayoun, su cita ha sido cambiada. Su nueva cita es el lunes a las diez. ¿No le conviene? Entonces llámenos con un día de antelación. Entonces fijaremos una nueva cita. ¡Hasta el lunes! Barbería Ariana
    note: Este es un mensaje breve típico de un negocio, por eso usa la terminación cortés *-تان* (*قرارتان*, *برایتان*). *تغییر داده شد* significa fue cambiada.
    glosses:
      عزیز: estimado
      همایون: Homayoun
      قرارتان: su (formal)
      قرار: cita
      تغییر: aplazada
      جدیدتان: nuevo
      دوشنبه: lunes
      ده: diez
      ساعت: horas
      مناسب: conveniente
      این: este
      نیست: 'no'
      برایتان: para usted (formal)
      تماس: llamar
      با: con nosotros (با ما)
      پس: entonces
      قبل: con antelación
      می‌گذاریم: hacer
      ما: nosotros
      تا: hasta, nos vemos
      سلمانی: peluquería
      آریانا: Ariana
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: La peluquería contesta
    gloss: 'Barbero: Barbería Ariana, buenas tardes.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Homayoun explica y pregunta
    gloss: 'Homayoun: Buenas tardes, le habla Homayoun. Tengo una cita el jueves, pero lamentablemente no puedo ir. ¿Puedo cambiar la cita?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: La peluquera propone el viernes
    gloss: 'Peluquera: Por supuesto. ¿Le viene bien el viernes?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Homayoun propone el lunes
    gloss: 'Homayoun: Lamentablemente no, porque tengo que trabajar. ¿Podría ser el lunes?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: La peluquera acepta
    gloss: 'Peluquera: El lunes a las diez está bien.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Homayoun acepta y se disculpa
    gloss: 'Homayoun: Me viene bien. Muchas gracias y perdone la molestia.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: La peluquera se despide
    gloss: 'Peluquera: Ningún problema. ¡Hasta el lunes!'
