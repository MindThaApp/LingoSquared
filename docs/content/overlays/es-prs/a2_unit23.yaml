course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: describir cómo era la vida antes, en la infancia, en una casa o un trabajo anteriores, y cómo es ahora. El pasado habitual (می‌ más el tema del pasado), su negación y el contraste con el pasado simple y el presente.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: Cómo era la vida antes
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Palabras de «antes y ahora» y la forma habitual
  prs.a2.unit23.lesson02.more_verbs:
    title: El pasado habitual con más verbos
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Pasado simple, pasado habitual, presente y negación
  prs.a2.unit23.lesson04.my_old_life:
    title: 'Mi antigua vida: barrio, escuela y trabajo'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: Leer y escuchar sobre una infancia
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: Una conversación sobre antes y ahora
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Antes, en el pasado
    gloss: antes, en el pasado, anteriormente
    note: '*قبلاً* mira hacia una época anterior de tu vida. Es la palabra con la que empiezan la mayoría de las frases del tipo «cómo era antes»: *قبلاً در هرات زندگی می‌کردم.* Por sí sola no hace que el verbo sea habitual; eso lo hace el verbo, como verás más abajo.'
    example_gloss: Antes vivía en Herat.
  prs.a2.unit23.lesson01.teach.now:
    title: Ahora
    gloss: ahora, en este momento
    note: '*حالا* es «ahora», la otra mitad de todo contraste entre antes y ahora. El verbo que sigue a *حالا* está en presente simple: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Ahora vivo en Kabul.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Cada día
    gloss: todos los días
    note: '*هر* significa «cada» y *روز* es «día». *هر روز* es la expresión de tiempo más clara para un hábito repetido, tanto en pasado como en presente.'
    example_gloss: Todos los días iba a la escuela.
  prs.a2.unit23.lesson01.teach.always:
    title: Siempre
    gloss: siempre
    note: '*همیشه* significa «siempre». Como *هر روز*, combina de forma natural con un hábito e indica al oyente que algo ocurría una y otra vez.'
    example_gloss: Siempre jugaba con mis amigos.
  prs.a2.unit23.lesson01.teach.when_small:
    title: Cuando era pequeño
    gloss: cuando era pequeño, cuando era niño
    note: '*وقتی* significa «cuando», *کوچک* significa «pequeño» y *بودم* es «yo era». Juntos, *وقتی کوچک بودم* es la forma habitual de empezar un relato sobre tu infancia.'
  prs.a2.unit23.lesson01.teach.school:
    title: Escuela
    gloss: escuela
    note: '*مکتب* es la palabra afgana de uso diario para «escuela». Un alumno es *شاگرد*, pero aquí solo necesitas *مکتب*.'
    example_gloss: Voy a la escuela todos los días.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: A pie
    gloss: a pie, caminando
    note: '*پیاده* significa «a pie». Va antes del verbo: *پیاده به مکتب می‌رفتم* es «iba a la escuela a pie».'
    example_gloss: Voy a la escuela a pie.
  prs.a2.unit23.lesson01.teach.cities:
    title: Herat, Kabul
    gloss: Herat, Kabul
    note: '*هرات* y *کابل* son dos ciudades afganas. Las ciudades llevan *در* («en»): *در هرات* es «en Herat», *در کابل* es «en Kabul».'
    example_gloss:
    - Él o ella está en Herat.
    - Estamos en Kabul.
  prs.a2.unit23.lesson01.teach.to_live:
    title: Vivir
    gloss: vivir, residir en un lugar
    note: '*زندگی کردن* es «vivir», en el sentido de residir en un lugar. *زندگی* es «vida» y *کردن* es el verbo que recibe las terminaciones: *زندگی می‌کنم* es «vivo».'
    example_gloss: Vivimos en Kabul.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'El pasado habitual: می + tema del pasado + terminaciones'
    gloss: yo iba, tú ibas, él o ella iba, nosotros íbamos, ustedes (formal o plural) iban, ellos iban
    note: 'Para decir lo que solía ocurrir una y otra vez, pon *می‌* delante del tema del pasado y añade las mismas terminaciones que ya conoces del pasado simple. El tema del pasado de *رفتن* (ir) es *رفت* (se quita la *ن* final). Así: *می‌رفتم* (yo iba), *می‌رفتی* (tú, a un amigo), *می‌رفت* (él o ella), *می‌رفتیم* (nosotros), *می‌رفتین* (usted o ustedes, formal o plural) y *می‌رفتند* (ellos). Compáralo con el pasado simple *رفتم*, que es un hecho único y terminado, y con el presente *می‌روم*, que usa el tema del presente *رو*. El pasado habitual puede traducirse como «yo iba» o «yo solía ir». El pronombre (*من، تو، او*) es opcional porque la terminación ya indica quién es. No confundas *می‌رفتم* con *می‌روم*: solo cambia una letra antes de la terminación, pero la primera es pasado y la segunda es presente.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'La misma regla, otro verbo: hacer'
    gloss: yo hacía, tú hacías, él o ella hacía, nosotros hacíamos, ustedes (formal o plural) hacían, ellos hacían
    note: '*کردن* (hacer) tiene el tema del pasado *کرد*. El pasado habitual es *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. Este verbo es muy útil porque muchos verbos del dari son un sustantivo más *کردن*: *زندگی کردن* (vivir), *بازی کردن* (jugar), *کار کردن* (trabajar). El *می‌* y la terminación van siempre en *کردن*, nunca en el sustantivo: *زندگی می‌کردم*, «yo vivía».'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Ortografía: می‌ y نمی‌ van seguidos de un semiespacio'
    gloss: yo iba y yo no iba
    note: 'En la escritura, *می‌* y *نمی‌* son prefijos separados, por eso van seguidos de un carácter sin ancho de unión (ZWNJ, el «semiespacio»): *می‌رفتم*, *نمی‌رفتم*. No se unen al verbo y tampoco se separan con un espacio completo. Si escribes con teclado persa, usa la tecla del semiespacio (a menudo Shift más Espacio) después de *می* y *نمی*. El mismo semiespacio se usa en el plural *ها* y en *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'La misma regla, otro verbo: comer'
    gloss: yo comía, tú comías, él o ella comía, nosotros comíamos, ustedes (formal o plural) comían, ellos comían
    note: 'La regla de *رفتن* sirve para los verbos regulares. *خوردن* (comer) pierde la *ن* y da el tema del pasado *خورد*. Pon *می‌* delante y añade las terminaciones: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. La forma de él o ella es el tema solo con *می‌*, así que *می‌خورد* significa «él o ella comía».'
  prs.a2.unit23.lesson02.teach.tea:
    title: Té
    gloss: té
    note: '*چای* es «té», la bebida que los afganos toman con casi todas las comidas. Dices *چای می‌خوری* para «tomas té», con el verbo *خوردن*.'
    example_gloss: Todas las mañanas tomaba té.
  prs.a2.unit23.lesson02.teach.morning:
    title: Mañana (por la mañana)
    gloss: mañana, por la mañana
    note: '*صبح* es «mañana». *هر روز صبح* es «todas las mañanas», y *هر شب* es «todas las noches».'
    example_gloss: Todas las mañanas iba a la escuela.
  prs.a2.unit23.lesson02.teach.night:
    title: Noche
    gloss: noche, tarde-noche
    note: '*شب* es «noche» o «atardecer». *هر شب* es «todas las noches». Es una palabra de repaso de las unidades sobre la rutina diaria.'
    example_gloss: Todas las noches leía un libro.
  prs.a2.unit23.lesson02.teach.book:
    title: Libro
    gloss: libro
    note: '*کتاب* es «libro». Con *خواندن* (leer) se dice *کتاب خواندن*, «leer un libro». Con el mismo verbo también se dice *درس خواندن*, «estudiar».'
    example_gloss: Leía un libro.
  prs.a2.unit23.lesson02.teach.football:
    title: Jugar al fútbol
    gloss: jugar al fútbol
    note: '*بازی کردن* es «jugar» y *فوتبال* es «fútbol». Como en otros verbos formados por «sustantivo más *کردن*», el *می‌* y la terminación van en *کردن*: *فوتبال بازی می‌کردم*.'
    example_gloss: Jugaba al fútbol con mis amigos.
  prs.a2.unit23.lesson02.teach.after_school:
    title: Después de la escuela
    gloss: después de la escuela
    note: '*بعد از* significa «después de» y va seguido de un sustantivo: *بعد از مکتب* es «después de la escuela».'
    example_gloss: Después de la escuela volvía a casa.
  prs.a2.unit23.lesson02.teach.friends:
    title: Mis amigos
    gloss: mis amigos
    note: '*دوستان* es «amigos» y *-م* añade «mi»: *دوستانم* es «mis amigos», una palabra de repaso. «Con» es *با*: *با دوستانم*.'
    example_gloss: Mis amigos venían a nuestra casa.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Cuatro verbos más, una sola regla
    gloss: ver, hacer, venir y leer en pasado habitual
    note: 'Todo verbo regular sigue la misma forma: quita la *ن* del infinitivo y pon *می‌* delante del tema del pasado con las terminaciones. *دیدن* (ver) da *می‌دیدم*. *کردن* (hacer) da *می‌کردم*. *آمدن* (venir) da *می‌آمدم*; el tema del pasado *آمد* conserva su *آ* larga después de *می‌*, así que se escribe *می‌آمدم*, nunca *می‌امدم*. *خواندن* (leer o estudiar) da *می‌خواندم*. Esta forma se usa tanto en el dari hablado como en el escrito.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: Ser y tener en pasado
    gloss: yo era, tú eras, él o ella era, nosotros éramos, ustedes (formal o plural) eran, ellos eran; yo tenía, tú tenías, ...
    note: 'El pasado de *بودن* (ser, estar) es *بودم، بودی، بود، بودیم، بودین، بودند*, y el pasado de *داشتن* (tener) es *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. Estos dos verbos describen estados, así que ya equivalen a «era» y «tenía» y normalmente no se les añade *می‌*: *وقتی کوچک بودم، یک بایسکل داشتم* es «cuando era pequeño, tenía una bicicleta».'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Bicicleta
    gloss: bicicleta
    note: '*بایسکل* es la palabra afgana para «bicicleta». *یک* es «un» o «uno».'
    example_gloss: Cuando era pequeño, tenía una bicicleta.
  prs.a2.unit23.lesson03.teach.contrast:
    title: Un hecho, un hábito o el presente
    gloss: Un día fui al bazar. Todos los días iba a la escuela. Ahora voy a la oficina.
    note: 'Tres formas verbales pueden parecerse, así que fíjate en lo que dice la frase. Si es UN hecho terminado, usa el pasado simple: *یک روز به بازار رفتم* (un día fui al bazar). Si es algo que ocurría una y otra vez en el pasado, usa *می‌* más el tema del pasado: *هر روز به مکتب می‌رفتم* (todos los días iba a la escuela). Si es verdad ahora, usa *می‌* más el tema del presente: *حالا به دفتر می‌روم* (ahora voy a la oficina). Las palabras de tiempo ayudan: *یک روز، دیروز* van con el pasado simple; *هر روز، همیشه، قبلاً* van con el pasado habitual; *حالا* va con el presente.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: Un día
    gloss: un día, una vez
    note: '*یک روز* es «un día». Introduce UN hecho del pasado, así que el verbo va en pasado simple, sin *می‌*.'
    example_gloss: Un día fui al bazar.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Ayer
    gloss: ayer
    note: '*دیروز* es «ayer». Señala un día concreto y terminado, así que el verbo va en pasado simple: *دیروز به دفتر رفتم*.'
    example_gloss: Ayer fui a la oficina.
  prs.a2.unit23.lesson03.teach.office:
    title: Oficina
    gloss: oficina
    note: '*دفتر* es «oficina», un lugar de trabajo. Se va a ella con *به*.'
    example_gloss: Ahora voy a la oficina todos los días.
  prs.a2.unit23.lesson03.teach.bus:
    title: Autobús
    gloss: autobús
    note: '*بس* es la palabra afgana para «autobús». «Con» es *با*: *با بس* es «en autobús».'
    example_gloss: Voy a la oficina en autobús.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'El pasado habitual negativo: نمی + tema del pasado'
    gloss: yo no iba, tú no ibas, él o ella no iba, nosotros no íbamos, ustedes (formal o plural) no iban, ellos no iban
    note: 'Para decir que algo NO solía ocurrir, pon *نمی‌* en lugar de *می‌*: *نمی‌رفتم* (yo no iba, nunca iba), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. No lo confundas con el pasado negativo simple *نرفتم*, que dice que un hecho concreto no ocurrió. Compara: *دیروز به مکتب نرفتم* (ayer no fui a la escuela) y *جمعه به مکتب نمی‌رفتم* (los viernes no iba a la escuela, como costumbre). Escríbelo con el semiespacio: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'Ya no: دیگر + negación'
    gloss: Ya no juego al fútbol.
    note: '*دیگر* con un verbo negativo significa «ya no» o «no más»: *دیگر فوتبال بازی نمی‌کنم* es «ya no juego al fútbol». El verbo está en presente negativo *نمی‌کنم*, porque la frase habla de ahora. Para algo que hacías antes y dejaste de hacer, a menudo se combinan las dos mitades: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (antes jugaba al fútbol todos los días, pero ya no juego).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Barrio
    gloss: barrio, zona de una ciudad
    note: '*محله* es el barrio, la parte de la ciudad donde vives. *قدیمی* significa «antiguo».'
    example_gloss: Nuestra casa estaba en un barrio antiguo.
  prs.a2.unit23.lesson04.teach.old:
    title: Viejo
    gloss: antiguo, viejo (de un lugar o una cosa)
    note: '*قدیمی* es «antiguo», para cosas y lugares que existen desde hace mucho tiempo. Va después del sustantivo: *محلهٔ قدیمی*.'
    example_gloss: Teníamos una casa antigua.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Vecinos
    gloss: vecinos
    note: '*همسایه* es «vecino». El plural lleva semiespacio: *همسایه‌ها*. Los vecinos son una parte importante de la vida en un barrio afgano.'
    example_gloss: Los vecinos siempre venían a nuestra casa.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Abuela
    gloss: abuela
    note: '*مادرکلان* es «abuela», la palabra estándar. *-م* añade «mi»: *مادرکلانم* es «mi abuela».'
    example_gloss: Los viernes íbamos a visitar a mi abuela.
  prs.a2.unit23.lesson04.teach.fridays:
    title: Los viernes
    gloss: los viernes, todos los viernes
    note: '*جمعه‌ها* («los viernes», con semiespacio) significa «todos los viernes». Es otra manera de decir que algo ocurría una y otra vez.'
    example_gloss: Los viernes íbamos al parque.
  prs.a2.unit23.lesson04.teach.shop:
    title: Tienda
    gloss: tienda
    note: '*دوکان* es la palabra afgana para «tienda». *در دوکان کار کردن* es «trabajar en una tienda».'
    example_gloss: Antes trabajaba en una tienda.
  prs.a2.unit23.lesson04.teach.where_before:
    title: ¿Dónde vivías antes?
    gloss: ¿Dónde vivías antes?
    note: '*کجا* significa «dónde». Un amigo pregunta *قبلاً کجا زندگی می‌کردی؟* con el pasado habitual en la forma de «tú» (amigo). Para alguien a quien no conoces bien, di *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Calle
    gloss: calle, camino
    note: '*سرک* es la palabra afgana para «calle» o «camino». Juegas o caminas *در سرک*, en la calle.'
    example_gloss: Jugábamos en la calle.
  prs.a2.unit23.lesson05.teach.yes:
    title: Sí
    gloss: sí
    note: '*بلی* significa «sí» en dari, y su opuesto es *نخیر* («no»). Usa *بلی* para responder a una pregunta de sí o no.'
    example_gloss: Sí, iba todos los días.
  prs.a2.unit23.lesson05.teach.but:
    title: Pero
    gloss: pero
    note: '*ولی* contrapone dos cosas. En un relato de «antes y ahora» suele unir lo que solía pasar con lo que es distinto.'
    example_gloss: Antes iba, pero ahora no voy.
  prs.a2.unit23.lesson05.teach.read_text:
    title: Una infancia en Herat
    gloss: Cuando era pequeño, vivíamos en Herat. Nuestra casa estaba en un barrio antiguo. Todas las mañanas iba a pie a la escuela. Después de la escuela jugaba al fútbol en la calle con mis amigos. Los viernes íbamos a visitar a mi abuela. Ahora vivo en Kabul y voy a la oficina en autobús. Ya no juego al fútbol.
    note: 'Un breve relato escrito sobre una infancia en Herat. Fíjate en el cambio: el pasado habitual (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) describe la vida de antes y el presente (*زندگی می‌کنم، می‌روم*) describe el ahora. La última frase, *دیگر فوتبال بازی نمی‌کنم*, dice lo que ha dejado de hacer.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Salima le pregunta a Javid por la escuela
    gloss: Javid, ¿ibas a la escuela todos los días?
    note: Salima pregunta por una costumbre del pasado con el pasado habitual en la forma de «tú» (amigo), *می‌رفتی*. Es una pregunta de sí o no.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Javid responde
    gloss: Sí, iba a pie todos los días, pero los viernes no iba.
    note: 'Javid primero dice lo que solía hacer y luego lo que no hacía: *جمعه نمی‌رفتم*. El pasado habitual negativo *نمی‌رفتم* indica que los viernes nunca iba.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Salima le pregunta a Javid dónde vivía antes
    gloss: Javid, ¿dónde vivías antes?
    note: Salima pregunta por el pasado con *می‌کردی*, el pasado habitual en la forma de «tú» (amigo).
  prs.a2.unit23.lesson06.teach.turn02:
    title: Javid cuenta su infancia
    gloss: Cuando era pequeño, vivíamos en Herat. Todos los días iba a pie a la escuela y después de la escuela jugaba al fútbol con mis amigos.
    note: 'Javid usa el pasado habitual para todo lo que ocurría una y otra vez: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Salima pregunta por el presente
    gloss: ¿Ahora también juegas al fútbol?
    note: '*حالا هم* pregunta por el presente: ¿también ahora? El verbo cambia a *می‌کنی* (presente, «tú»).'
  prs.a2.unit23.lesson06.teach.turn04:
    title: Javid dice qué ha cambiado
    gloss: No, ya no juego al fútbol. Ahora vivo en Kabul y voy a la oficina en autobús. ¿Y tú?
    note: '*دیگر ... نمی‌کنم* significa «ya no». El resto de su respuesta está en presente, porque trata del ahora. *تو چطور؟* es una forma breve de decir «¿y tú?».'
  prs.a2.unit23.lesson06.teach.turn05:
    title: Salima cuenta su antiguo trabajo
    gloss: Antes trabajaba en una tienda, pero ahora trabajo en una oficina.
    note: Salima contrapone el pasado habitual *کار می‌کردم* con el presente *کار می‌کنم*, unidos por *ولی*.
  prs.a2.unit23.lesson06.teach.turn06:
    title: Javid reacciona
    gloss: ¡Qué bien!
    note: '*چه خوب!* es una reacción amistosa ante una buena noticia.'
exercises:
  prs.a2.unit23.lesson01.exercise01.recognize_every_day:
    instruction: ¿Qué significa esta frase?
    correct_option: Yo iba a la escuela todos los días
    distractors:
