teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Esto
    gloss: este
    note: این significa «esto».
    example_gloss: Esto es más grande.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Aquello
    gloss: aquello
    note: 'آن significa «aquello»: en el dari de este curso se usa la forma completa آن, no la forma coloquial iraní اون.'
    example_gloss: Aquello es más pequeño.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Es más grande
    gloss: es más grande
    note: 'بزرگ‌تر است es la forma completa, sin contraer (es más grande): *بزرگ‌تر* es el comparativo de *بزرگ* (grande), y *است* sigue siendo una palabra aparte.'
    example_gloss: Esto es más grande que aquello.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Es más pequeño
    gloss: es más pequeño
    note: 'کوچک‌تر است es la forma completa (es más pequeño): کوچک es la grafía estándar del dari (no la forma coloquial iraní کوچیک).'
    example_gloss: Aquello es más pequeño que esto.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Que (comparativo)
    gloss: que
    note: 'از marca el punto de comparación: X از Y بزرگ‌تر است significa «X es más grande que Y».'
    target_text: از (que)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Es más caro
    gloss: es más caro
    note: 'گران‌تر است es la forma completa (es más caro): گران es la grafía estándar del dari (no la forma coloquial iraní گرون).'
    example_gloss: Esto es más caro que aquello.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Es más barato
    gloss: es más barato
    note: 'ارزان‌تر است es la forma completa (es más barato): ارزان es la grafía estándar del dari (no la forma coloquial iraní ارزون).'
    example_gloss: Aquello es más barato que esto.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim y Negar
    gloss: Karim, Negar
    note: Nombres afganos comunes que aparecen a lo largo de este curso.
    example_gloss:
    - Yo soy Karim.
    - Yo soy Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Más alto
    gloss: más alto / es más alto, es más alta
    note: '*قد بلندتر است* significa literalmente «la estatura es más alta»: *قد* (estatura), *بلندتر* (más alto; comparativo de *بلند*, alto), *است* (es).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Más joven
    gloss: más joven / es más joven
    note: جوان‌تر است es la forma completa (es más joven). جوان es la grafía estándar del dari, no la forma coloquial iraní جوون.
    example_gloss: Negar es más joven que Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Es mejor
    gloss: es mejor
    note: 'بهتر است es la forma completa: بهتر (mejor) es el comparativo irregular de خوب (bueno).'
    example_gloss: Esto es mejor que aquello.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Es peor
    gloss: es peor
    note: 'بدتر است es la forma completa: بدتر (peor) es el comparativo irregular de بد (malo).'
    example_gloss: Aquello es peor que esto.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Porque
    gloss: porque
    note: چون introduce una razón.
    target_text: چون (porque)
  prs.a1.unit15.lesson04.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o dos elementos.
    target_text: و (y)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Texto de comparación de ejemplo
    gloss: Karim es más alto que Negar. Negar es más joven que Karim.
    note: Una comparación breve en tercera persona que combina el vocabulario de esta unidad.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim y Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim es más alto.
    - Negar es más joven.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Pero
    gloss: pero
    note: اما significa «pero» e introduce un contraste.
    target_text: اما (pero)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Sí
    gloss: sí
    note: بلی es la palabra cortés y formal para «sí», acorde con el registro de este curso.
    example_gloss: Sí, esto es más caro.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim dice
    gloss: Esto es más caro que aquello, pero es mejor.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar responde
    gloss: Sí, pero aquello es más barato.
