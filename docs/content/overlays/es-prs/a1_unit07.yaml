teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Hola (al teléfono)
    gloss: hola (al teléfono)
    note: الو se usa específicamente para contestar o iniciar una llamada telefónica, a diferencia de سلام, que se usa en persona.
    example_gloss: Hola, habla Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Invitar a continuar a quien llama
    gloss: Sí, dígame.
    note: بلی، بفرمایین es la forma natural de responder tras descolgar. Usa el mismo بفرمایین cortés («adelante», «por favor») que ya has visto en este curso; no es una traducción literal de «te escucho».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Teléfono (repaso)
    gloss: teléfono
    note: تلفن se presentó en la unidad de los números; aquí es el escenario de toda la unidad.
    example_gloss: Mi teléfono está estropeado.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Preguntar quién llama
    gloss: Disculpa, ¿quién habla?
    note: ببخشین، کی صحبت می‌کند؟ pregunta con cortesía la identidad de quien llama.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Identificarte
    gloss: Soy Farid.
    note: من فرید استم indica directamente quién llama, con el mismo patrón de استم de unidades anteriores.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Explicar tu relación con la persona a quien llamas
    gloss: Soy colega de Homayoun.
    note: همکار همایون استم explica el motivo de tu llamada y es útil cuando quien contesta no te conoce.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Pedir que hablen despacio
    gloss: Hable despacio, por favor.
    note: لطفاً آهسته صحبت کنین es una petición natural y cortés cuando la conexión es mala o cuando estás aprendiendo el idioma.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Pedir que repitan (repaso)
    gloss: ¿Podría repetirlo?
    note: می‌توانین دوباره بگویین؟ se presentó en la unidad de las presentaciones y sirve igual de bien en una llamada.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Combinar las dos peticiones
    gloss: Por favor, hable despacio y repítalo.
    note: و une las dos peticiones en una sola frase natural.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Mensaje
    gloss: mensaje
    note: پیام es la palabra general para «mensaje», hablado o escrito.
    example_gloss: Tengo un mensaje para usted.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Decir que quieres dejar un mensaje
    gloss: Quiero dejar un mensaje.
    note: می‌خواهم یک پیام بگذارم es lo que dices cuando la persona a quien llamas no está disponible.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Decir que llamarás más tarde
    gloss: Llamaré más tarde.
    note: بعد زنگ می‌زنم es una alternativa sencilla a dejar un mensaje.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Mensaje de texto
    gloss: mensaje de texto (mensaje corto)
    note: پیام کوتاه significa literalmente «mensaje corto» y es la forma cotidiana de referirse a un mensaje de texto.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Un mensaje de ejemplo
    gloss: Mañana la reunión es a las nueve.
    note: فردا جلسه ساعت نه است es una información completa y natural para transmitir en un mensaje.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Confirmar que transmitirás el mensaje
    gloss: Se lo haré llegar / se lo transmitiré.
    note: می‌رسانم confirma que el mensaje llegará a su destinatario.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima contesta el teléfono
    gloss: Lima contesta con el saludo telefónico.
    note: الو؟ es la forma habitual de contestar una llamada entrante.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid la saluda y confirma quién es ella
    gloss: Farid la saluda y le pregunta si es Lima.
    note: الو، سلام combina el saludo telefónico con el saludo cotidiano.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima le invita a continuar y pregunta quién llama
    gloss: Lima le invita a continuar y pregunta quién llama.
    note: بلی، بفرمایین y کی صحبت می‌کند؟ aparecen en las lecciones 1 y 2.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid se identifica
    gloss: Farid dice que es colega de Homayoun.
    note: Esto reutiliza el patrón de la lección 2 para explicar la relación con la persona, lo que da a Lima un motivo para confiar en la llamada.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima le pide que hable despacio
    gloss: Lima lo saluda y le pide que hable despacio.
    note: آهسته صحبت کنین، لطفاً reutiliza la petición de la lección 3.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid acepta y pide dejar un mensaje
    gloss: Farid acepta y dice que quiere dejar un mensaje para Homayoun.
    note: Esto amplía el patrón de پیام de la lección 4 al indicar un destinatario concreto (برای همایون, «para Homayoun»).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima acepta apuntarlo
    gloss: Lima le invita a continuar y dice que lo está apuntando.
    note: بفرمایین aquí invita a Farid a seguir hablando.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid da el contenido del mensaje
    gloss: Farid le pide que diga que la reunión es mañana a las nueve.
    note: Esto reutiliza directamente el mensaje de ejemplo de la lección 5.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima confirma y promete transmitirlo
    gloss: Lima confirma los detalles y dice que se lo transmitirá.
    note: می‌رسانم cierra la parte de la llamada dedicada al mensaje, como se vio en la lección 5.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid le da las gracias y se despide
    gloss: Farid le da las gracias y se despide.
    note: تشکر زیاد y خدا حافظ reutilizan vocabulario de unidades anteriores.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima se despide
    gloss: Lima se despide.
    note: خدا حافظ cierra la llamada.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Decir que alguien dejó un mensaje (pasado)
    gloss: Farid dejó un mensaje.
    note: گذاشت es el pasado simple («dejó») del verbo que aparece en می‌خواهم یک پیام بگذارم de la lección 4, donde بگذارم significa «dejo». Úsalo para resumir lo ocurrido tras una llamada.
    target_text: فرید پیام گذاشت (Farid dejó un mensaje)
