course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: cómo decir que algo ya había ocurrido antes de un momento del pasado, por ejemplo, que el autobús se había ido antes de que llegaras. El pluscuamperfecto (participio más el pasado de بودن), su negación y el contraste con el pasado simple.'
units:
  prs.a2.unit26.already_happened:
    title: Ya había pasado
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: La forma «había ido» y vocabulario de viajes
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: Más verbos con «había»
  prs.a2.unit26.lesson03.earlier_and_later:
    title: El hecho anterior y el posterior
  prs.a2.unit26.lesson04.time_words:
    title: Ya, antes, todavía no
  prs.a2.unit26.lesson05.reading_and_listening:
    title: 'Lectura y comprensión oral: llegar tarde'
  prs.a2.unit26.lesson06.airport_conversation:
    title: Una conversación sobre un avión perdido
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Autobús
    gloss: autobús
    note: '*بس* es el autobús, la forma habitual de viajar entre ciudades en Afganistán. Es una palabra de repaso de la unidad de transporte.'
    example_gloss: El autobús va a Mazar.
  prs.a2.unit26.lesson01.teach.station:
    title: Estación
    gloss: estación, parada
    note: '*ایستگاه* es una estación o una parada. *ایستگاه بس* es la estación de autobuses.'
    example_gloss: La estación de autobuses está en Kabul.
  prs.a2.unit26.lesson01.teach.plane:
    title: Avión
    gloss: avión
    note: '*طیاره* es la palabra afgana para avión.'
    example_gloss: El avión llega a Kabul.
  prs.a2.unit26.lesson01.teach.airport:
    title: Aeropuerto
    gloss: aeropuerto
    note: '*میدان هوایی* es el aeropuerto. Los aviones salen del *میدان هوایی* y los autobuses salen de la *ایستگاه*.'
    example_gloss: El aeropuerto está en Kabul.
  prs.a2.unit26.lesson01.teach.car:
    title: Coche
    gloss: coche
    note: '*موتر* es la palabra afgana para coche. Añade *-م* para decir mi coche: *موترم*.'
    example_gloss: Mi coche es nuevo.
  prs.a2.unit26.lesson01.teach.arrive:
    title: Llegar
    gloss: llegar
    note: '*رسیدن* es llegar. El lugar al que llegas se indica con *به*: *به ایستگاه رسیدم* es «llegué a la estación». El tema de pasado es *رسید*, de modo que se obtiene *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: Llegamos a la estación.
  prs.a2.unit26.lesson01.teach.return:
    title: Volver
    gloss: volver, regresar
    note: '*برگشتن* es volver o regresar. El tema de pasado es *برگشت*: *برگشتم* es «volví».'
    example_gloss: Ayer volví a casa.
  prs.a2.unit26.lesson01.teach.passport:
    title: Pasaporte
    gloss: pasaporte
    note: '*پاسپورت* es el pasaporte. Añade *-م* para decir mi: *پاسپورتم*.'
    example_gloss: Mi pasaporte está en casa.
  prs.a2.unit26.lesson01.teach.key:
    title: Llave
    gloss: llave
    note: '*کلید* es una llave. *کلیدم* es mi llave.'
    example_gloss: Mi llave está en casa.
  prs.a2.unit26.lesson01.teach.phone:
    title: Teléfono
    gloss: teléfono
    note: '*تیلفون* es el teléfono. *تیلفونم* es mi teléfono. *تیلفون کردن* es hacer una llamada telefónica.'
    example_gloss: Mi teléfono es nuevo.
  prs.a2.unit26.lesson01.teach.lose:
    title: Perder
    gloss: perder, extraviar
    note: '*گم کردن* es perder algo. *گم* significa perdido y *کردن* es el verbo hacer: pones lo perdido y *را* delante del verbo, como en *کلیدم را گم کردم* (perdí mi llave).'
    example_gloss: Ayer perdí mi llave.
  prs.a2.unit26.lesson01.teach.when:
    title: Cuándo
    gloss: cuando
    note: '*وقتی* introduce una oración que indica un momento, aquí un momento del pasado: *وقتی رسیدم* es «cuando llegué». Esta oración es el punto de referencia de toda la unidad.'
    example_gloss: Cuando llegué a casa, desayuné.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'El participio pasado: tema de pasado más ه'
    gloss: ido, comido, visto, llegado, venido, hecho, vuelto (los participios)
    note: 'El pluscuamperfecto se forma con un participio pasado, así que primero hay que aprenderlo. Toma el infinitivo, quita la *ن* final para obtener el tema de pasado y añade *ه*: *رفتن* tiene el tema *رفت*, así que el participio es *رفته*. La misma regla da *خوردن* → *خورده*, *دیدن* → *دیده*, *رسیدن* → *رسیده*, *آمدن* → *آمده*, *کردن* → *کرده*, *شدن* → *شده*. El participio no cambia según la persona: es igual para yo, tú, él y ellos. Es también la parte de *رفته‌ام* (he ido) que verás en la unidad sobre experiencias de vida; esta unidad solo lo usa con el pasado de *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'El pluscuamperfecto: participio más el pasado de بودن'
    gloss: yo había ido, tú habías ido, él/ella/eso había ido, nosotros habíamos ido, ustedes (formal o plural) habían ido, ellos habían ido
    note: 'El pluscuamperfecto dice que algo ya había ocurrido antes de otro momento del pasado. Se forma con el participio más el pasado de *بودن* (ser, estar): *بودم، بودی، بود، بودیم، بودین، بودند*. Así, *رفته بودم* es «yo había ido», *رفته بودی* «tú habías ido» (a un amigo), *رفته بود* «él, ella o eso había ido» (*بود* solo no lleva terminación), *رفته بودیم* «habíamos ido», *رفته بودین* «ustedes habían ido» (formal o plural), *رفته بودند* «habían ido». El pronombre es opcional porque la terminación ya indica la persona. El participio y *بود-* se escriben como dos palabras.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: Cuando llegué a la estación, el autobús se había ido
    gloss: Cuando llegué a la estación, el autobús se había ido.
    note: 'Este es el patrón de toda la unidad. *وقتی به ایستگاه رسیدم* es el momento en que llegaste (pasado simple). *بس رفته بود* es lo que ya había ocurrido antes de ese momento (pluscuamperfecto): el autobús se fue primero y tú llegaste después.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: Una regla para todos los verbos
    gloss: yo había comido, tú habías visto, él/ella había llegado, nosotros habíamos venido, ustedes habían hecho, ellos habían vuelto
    note: 'La regla de *رفتن* sirve para todos los verbos: tema de pasado más *ه* y luego *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* es «yo había comido», *دیده بودی* «tú habías visto», *رسیده بود* «él o ella había llegado», *آمده بودیم* «habíamos venido», *کرده بودین* «ustedes habían hecho», *برگشته بودند* «habían vuelto». Solo cambia *بود-*, nunca el participio.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Verbos formados por dos palabras
    gloss: yo había perdido; había sido cerrado; se había averiado
    note: 'Muchos verbos son una palabra más *کردن* o *شدن*. El participio se forma con la segunda parte y la primera queda delante: *گم کردن* da *گم کرده بودم* (había perdido), *بسته شدن* da *بسته شده بود* (había sido cerrado), *خراب شدن* da *خراب شده بود* (se había averiado). *شدن* es útil cuando algo le sucedió a una cosa: la puerta, el coche, la oficina.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Puerta, portón
    gloss: puerta, portón
    note: '*دروازه* es un portón o una puerta grande, por ejemplo la puerta de embarque del aeropuerto o la puerta de una oficina.'
    example_gloss: La puerta está abierta.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: La puerta había sido cerrada
    gloss: La puerta había sido cerrada.
    note: '*بسته شده بود* dice que la puerta ya estaba cerrada antes de que llegaras. Es el pluscuamperfecto de *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: Averiarse
    gloss: averiarse, estropearse
    note: '*خراب* significa roto o estropeado y *شدن* significa volverse, así que *خراب شدن* es averiarse. El pasado simple es *خراب شد*: *موترم خراب شد* es «mi coche se averió».'
    example_gloss: Se me averió el coche.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: Yo había desayunado
    gloss: Yo había desayunado.
    note: '*صبحانه خورده بودم* dice que el desayuno ya había terminado antes del momento del que hablas.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Reunión
    gloss: reunión
    note: '*جلسه* es una reunión. Es otro tipo de cita a la que puedes faltar o llegar tarde.'
    example_gloss: La reunión empezó a las nueve.
  prs.a2.unit26.lesson02.teach.manager:
    title: Director
    gloss: director, gerente
    note: '*مدیر* es el director o gerente de una oficina.'
    example_gloss: El director está en la oficina.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Pluscuamperfecto frente a pasado simple
    gloss: Cuando llegué, el autobús se había ido. / Cuando llegué, el autobús se fue.
    note: 'Cuando se cuentan juntos dos hechos pasados, el que ocurrió primero va en pluscuamperfecto y el posterior, el punto de referencia, va en pasado simple. En *وقتی رسیدم، بس رفته بود* llegaste en segundo lugar y el autobús se fue antes, así que no lo encuentras: ya se ha ido. En *وقتی رسیدم، بس رفت* los dos verbos están en pasado simple, así que el autobús se fue después de que llegaras, o justo cuando llegabas. Las dos oraciones también pueden ir en el orden inverso: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: Cuando llegué, el autobús se fue
    gloss: Cuando llegué, el autobús se fue.
    note: Compáralo con *بس رفته بود*. Aquí el autobús se fue después de que llegaras. Podrías haber corrido tras él. Con *رفته بود* ya se había ido.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: Cuando llegué, el director se había ido
    gloss: Cuando llegué, el director se había ido.
    note: 'El mismo patrón que con el autobús: *وقتی رسیدم* es la llegada y *مدیر رفته بود* es el hecho anterior. Es lo que dices cuando llegas a una cita y la persona ya se ha ido.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'La negación: ن en el participio'
    gloss: yo no había ido, tú no habías ido, él/ella no había ido, nosotros no habíamos ido, ustedes no habían ido, ellos no habían ido
    note: 'Para decir que algo todavía no había ocurrido, pon *ن* al principio del participio, no en *بود*: *رفته بودم* pasa a *نرفته بودم* (yo no había ido). *بود-* mantiene las mismas terminaciones: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. No escribas *رفته نبودم* para esto.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Participios negativos de otros verbos
    gloss: yo no había comido, yo no había visto, yo no había llegado, yo no había venido
    note: 'La misma *ن* va en todos los participios: *نخورده* (no comido), *ندیده* (no visto), *نرسیده* (no llegado). El verbo *آمدن* es la excepción que hay que recordar: su participio *آمده* toma *نیـ*, así que la negación es *نیامده* (no venido), como en *نیامده بودم*. Los verbos de dos palabras ponen la *ن* en la segunda parte: *گم نکرده بودم* (no lo había perdido).'
  prs.a2.unit26.lesson04.teach.already:
    title: Ya, antes
    gloss: ya, antes, con anterioridad
    note: '*قبلاً* significa antes de ahora o con anterioridad. Destaca que algo se hizo antes, y va delante del participio o al principio de la oración.'
    example_gloss: Yo ya había desayunado.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Ya, de antes
    gloss: ya, de antemano
    note: '*از قبل* significa de antemano o ya, desde un momento anterior. Va delante del participio: *از قبل رفته بود* es «ya se había ido». Es muy frecuente con el pluscuamperfecto.'
    example_gloss: El autobús ya se había ido.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Todavía, aún no
    gloss: 'todavía, aún; con negación: todavía no'
    note: '*هنوز* con un verbo negativo significa todavía no. *هنوز نیامده بود* es «todavía no había llegado». El pluscuamperfecto negativo y *هنوز* van juntos: lo que esperabas no había ocurrido en ese momento.'
    example_gloss: Todavía no había llegado.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: antes de que llegara'
    gloss: Antes de que yo llegara, el avión se había ido. / Antes de que llegáramos, el avión se había ido.
    note: '*قبل از اینکه* significa antes de que e introduce una oración con su propio verbo. El verbo que sigue está en subjuntivo, la misma forma que se usa después de *باید*: *برسم* (que yo llegue), *برسیم* (que lleguemos). No es un verbo en pasado, aunque la historia esté en pasado. La oración principal dice entonces lo que ya había ocurrido: *طیاره رفته بود*. Así, *قبل از اینکه من برسم، طیاره رفته بود* significa lo mismo que *وقتی رسیدم، طیاره رفته بود*: el avión se fue primero. Las oraciones pueden intercambiar su lugar.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: Cuando llegué, mi amigo todavía no había llegado
    gloss: Cuando llegué, mi amigo todavía no había llegado.
    note: Aquí el hecho anterior es algo que todavía no había ocurrido. *هنوز نیامده بود* sitúa el hecho que falta antes del punto de referencia *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: Cuando llegaste a la estación, ¿qué pasó?
    gloss: Cuando llegaste a la estación, ¿qué pasó?
    note: '*چه شد؟* pregunta qué pasó. La respuesta suele ir en pretérito pluscuamperfecto: *بس از قبل رفته بود* (el autobús ya se había ido).'
  prs.a2.unit26.lesson05.teach.four:
    title: Cuatro
    gloss: cuatro
    note: '*چهار* es cuatro. Se usa para la hora: *ساعت چهار* son las cuatro.'
    example_gloss: Llegué a casa a las cuatro.
  prs.a2.unit26.lesson05.teach.staff:
    title: Personal, empleados
    gloss: personal, empleados
    note: '*کارمندان* es el plural de *کارمند* (empleado). La terminación *-ان* forma el plural de las personas.'
    example_gloss: Los empleados están en la oficina.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Oficina de pasaportes
    gloss: oficina de pasaportes
    note: '*دفتر پاسپورت* es la oficina donde se obtiene o se renueva un pasaporte. Ya conoces las dos palabras.'
    example_gloss: La oficina de pasaportes está en Kabul.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Shakiba le pregunta a Naimat por ayer
    gloss: Naimat, ¿fuiste ayer a Mazar?
    note: Shakiba hace una pregunta de sí o no sobre una acción terminada, con el pasado simple *رفتی*. Habla con un amigo, por eso usa *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Naimat cuenta lo que encontró
    gloss: No. Cuando llegué a la estación, el autobús ya se había ido.
    note: Naimat responde *نخیر*, luego da el punto de referencia en pasado simple, *وقتی به ایستگاه رسیدم*, y el hecho anterior en pluscuamperfecto, *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Shakiba pregunta por la hora
    gloss: ¿A qué hora salió el autobús?
    note: '*ساعت چند* pregunta la hora. *حرکت کرد* es el pasado simple de *حرکت کردن*, partir.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Naimat da las dos horas
    gloss: A las ocho. Yo llegué a las nueve.
    note: 'Dos horas, dos hechos: el autobús salió a las *ساعت هشت* y Naimat llegó a las *ساعت نه*. Las ocho son antes que las nueve, así que el autobús salió primero.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Shakiba pregunta qué pasó después
    gloss: ¿Qué hiciste después?
    note: '*بعد چه کردی؟* pregunta qué hiciste a continuación. Usa el pasado simple, porque es un hecho nuevo posterior a la llegada.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Naimat volvió a casa
    gloss: Volví a casa.
    note: '*برگشتم* es el pasado simple de *برگشتن*: volvió a casa.'
  prs.a2.unit26.lesson05.teach.message:
    title: Un mensaje sobre una llegada tardía
    gloss: Hola, Shakiba. Hoy llegué a las cuatro a la oficina de pasaportes, pero la oficina ya estaba cerrada. Los empleados se habían ido. Mi coche se había averiado, así que llegué tarde. Mañana por la mañana iré otra vez.
    note: 'Un mensaje escrito breve en pluscuamperfecto. Cuenta lo que encontró el autor al llegar: la oficina estaba cerrada y los empleados se habían ido. También da el motivo anterior del retraso: el coche se había averiado.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Herat
    gloss: Herat (una ciudad del oeste de Afganistán)
    note: '*هرات* es la ciudad de Herat, en el oeste de Afganistán. Se puede volar allí desde Kabul.'
    example_gloss: El avión va a Herat.
  prs.a2.unit26.lesson06.teach.find:
    title: Encontrar
    gloss: encontrar
    note: '*پیدا کردن* es encontrar algo que buscabas. El objeto va antes del verbo con *را*: *کلیدم را پیدا کردم* es «encontré mi llave». La forma negativa es *پیدا نکردم* (no lo encontré).'
    example_gloss: Encontré mi llave.
  prs.a2.unit26.lesson06.teach.bad:
    title: Malo
    gloss: malo
    note: '*بد* significa malo. *چه بد!* es una reacción amable ante una mala noticia, lo contrario de *چه خوب!*.'
    example_gloss: ¡Qué mal! (¡Qué pena!)
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Naimat pregunta por qué Shakiba no fue
    gloss: Shakiba, ¿por qué no fuiste a Herat la semana pasada?
    note: Naimat pregunta con *چرا* y el pasado simple negativo *نرفتی*. Es un amigo, por eso usa *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Shakiba da el motivo
    gloss: Porque había perdido mi pasaporte. No lo encontré hasta las diez.
    note: '*چون* (porque) introduce el motivo, y el motivo es el hecho anterior, por eso usa el pluscuamperfecto: *گم کرده بودم*. *آن را* (lo) remite al pasaporte.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Naimat pregunta qué pasó en el aeropuerto
    gloss: Cuando llegaste al aeropuerto, ¿qué pasó?
    note: El punto de referencia es *وقتی به میدان هوایی رسیدی*, en pasado simple. *چه شد؟* pregunta por lo que ya había ocurrido.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Shakiba cuenta lo que encontró y lo que hizo
    gloss: El avión ya se había ido. Después volví a casa y llamé por teléfono.
    note: '*طیاره رفته بود* es el hecho anterior, en pluscuamperfecto. Después vienen dos hechos nuevos en pasado simple: *برگشتم* y *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Naimat reacciona
    gloss: ¡Qué pena!
    note: '*چه بد!* es una reacción breve y amable ante una mala noticia.'
exercises:
  prs.a2.unit26.lesson01.exercise01.recognize_plane_left:
    instruction: ¿Qué significa esta frase?
    correct_option: El avión se había ido
    distractors:
    - El avión está saliendo
    - El avión saldrá
    - El avión está en el aeropuerto
    accepted_answers:
    - value: El avión se había ido
      status: correct
    feedback: '*طیاره رفته بود* es «el avión se había ido»: el participio *رفته* más *بود*.'
  prs.a2.unit26.lesson01.exercise02.recognize_lost_passport:
    instruction: ¿Qué significa esta frase?
    correct_option: había perdido mi pasaporte
    distractors:
    - Encontré mi pasaporte
    - Mi pasaporte está en casa
    - Quiero un pasaporte
    accepted_answers:
    - value: había perdido mi pasaporte
