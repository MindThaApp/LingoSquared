course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: hablar de los hábitos en internet. Vocabulario de redes sociales y tiempo de pantalla, cómo dar una opinión sencilla, lectura sobre el tiempo de pantalla y una conversación real entre dos amigos sobre sus propios hábitos.'
units:
  prs.a2.unit16.online_habits:
    title: Hábitos en línea
lessons:
  prs.a2.unit16.lesson01.online_habits_vocabulary:
    title: Palabras sobre hábitos en internet
  prs.a2.unit16.lesson02.describing_and_giving_an_opinion:
    title: Describir y dar una opinión
  prs.a2.unit16.lesson03.reading_about_screen_time:
    title: Lectura sobre el tiempo de pantalla
  prs.a2.unit16.lesson04.friends_dialogue:
    title: Una conversación entre amigos
teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: Redes sociales
    gloss: las redes sociales
    note: '*شبکهٔ اجتماعی* significa literalmente «red social».'
    example_gloss: Zarmina mira las redes sociales todos los días.
  prs.a2.unit16.lesson01.teach.video_word:
    title: Vídeo
    gloss: vídeo
    note: '*ویدیو* es un préstamo directo de otra lengua, de uso muy parecido al de «vídeo» en español.'
    example_gloss: A Homayoun le gusta ver vídeos.
  prs.a2.unit16.lesson01.teach.download_word:
    title: Descarga
    gloss: descargar
    note: '*دانلود کردن*: *دانلود* es un préstamo que se combina con *کردن* («hacer»).'
    example_gloss: Descargo música.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: Aplicación de mensajería
    gloss: aplicación de mensajería
    note: '*پیام‌رسان* significa literalmente «portador de mensajes».'
    example_gloss: Envío mensajes a mis amigos con una aplicación de mensajería.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: Videojuego de ordenador
    gloss: videojuego de ordenador
    note: '*بازی کمپیوتری*: *بازی* significa «juego» y *کمپیوتری* significa «de ordenador».'
    example_gloss: Homayoun juega a videojuegos de ordenador.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*وقت آزاد*: *وقت* significa «tiempo» y *آزاد* significa «libre».'
    example_gloss: En mi tiempo libre miro las redes sociales.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: Normalmente, con معمولاً
    gloss: Normalmente miro las redes sociales en mi tiempo libre.
    note: '*معمولاً* («normalmente») es el primer adverbio de frecuencia de nivel A2 de esta unidad.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: A veces, con بعضی اوقات
    gloss: A veces lleva demasiado tiempo.
    note: '*بعضی اوقات* («a veces») es el segundo adverbio de frecuencia de esta unidad y contrasta con *معمولاً*.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace habitual para unir oraciones en esta unidad.'
    target_text: و (y)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: Todos los días, con هر روز
    gloss: Miro las redes sociales todos los días.
    note: '*هر روز* significa «todos los días»; *روز* solo significa «día».'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: Preguntar cuánto tiempo pasa alguien
    gloss: ¿Cuánto tiempo pasas en las redes sociales?
    note: '*تو* es el «tú» informal que se usa entre amigos, a diferencia de *شما* y las terminaciones en -*ین*, que se usan en otras partes de este curso con desconocidos.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: Dar una opinión sencilla
    gloss: En mi opinión, internet es útil, pero a veces lleva demasiado tiempo.
    note: Retoma el patrón de opinión *به نظر من* («en mi opinión») ya visto en la unidad 10.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: Decir que hay que limitar el uso
    gloss: Deberíamos limitar nuestro tiempo.
    note: '*محدود کردن* significa «limitar».'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: sobre todo
    note: '*بیشتر* significa aquí «sobre todo» o «más».'
    target_text: بیشتر (sobre todo)
  prs.a2.unit16.lesson03.teach.user_word:
    title: Usuario
    gloss: usuario
    note: '*کاربر* es la palabra general para quien usa una aplicación, un dispositivo o un servicio.'
    example_gloss: Muchos usuarios usan el teléfono todos los días.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: Limitar
    gloss: limitar
    note: '*محدود کردن*: la misma expresión de la lección 2, que aquí se usa en una afirmación general sobre las personas y no sobre «nosotros».'
    example_gloss: Algunas personas limitan su tiempo.
  prs.a2.unit16.lesson03.teach.article_text:
    title: Un artículo breve sobre el tiempo de pantalla
    gloss: Muchas personas usan las redes sociales varias horas al día. Algunas limitan su tiempo para tener más tiempo para la familia y los amigos.
    note: Un texto informativo breve, en el registro de lectura que enseña esta unidad.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون le pregunta a زرمینه cuánto tiempo pasa en línea
    gloss: همایون le pregunta a زرمینه cuánto tiempo pasa en las redes sociales.
    note: Retoma la pregunta exacta de la lección 2 y el registro informal con *تو* que ya se estableció para esta pareja de amigos.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه responde y pregunta a su vez
    gloss: Normalmente una hora al día. Ella le hace la misma pregunta.
    note: Aquí *چطور* significa «¿y tú?».
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون describe su propio hábito
    gloss: Él ve sobre todo vídeos. Quizá dos horas al día.
    note: Aquí *بیشتر* significa «sobre todo».
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه da su opinión
    gloss: En su opinión, eso es demasiado.
    note: Retoma el patrón de opinión *به نظر من* de la lección 2.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون está de acuerdo, pero dice que lo disfruta
    gloss: Quizá, pero él lo disfruta.
    note: '*لذت می‌برم* significa «lo disfruto».'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه propone limitar el uso
    gloss: Ella dice que a veces deberíamos limitar nuestro tiempo.
    note: Retoma exactamente *محدود کنیم* de la lección 2.
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون acepta usarlo menos
    gloss: Tienes razón. Desde mañana lo usará menos.
    note: '*کمتر* significa «menos».'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه lo aprueba
    gloss: زرمینه dice que es genial.
    note: '*عالی است!* es una forma habitual de decir «¡qué genial!».'
