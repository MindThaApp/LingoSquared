  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Tomar prestado y devolver el libro
  prs.a1.unit43.lesson04.library_dialogue:
    title: Diálogo en la biblioteca
  prs.a1.unit43.lesson05.reading:
    title: Lectura sobre el libro prestado
  prs.a1.unit43.lesson06.wrap_up:
    title: Resumen
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Repaso: libro, tengo, es, en'
    gloss: libro / tengo / es / en
    note: کتاب, دارم, است y در son palabras de repaso que se usan para hablar de un libro.
    target_text: کتاب (libro) / دارم (tengo) / است (es/está) / در (en)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Repaso: quiero, un/uno'
    gloss: quiero / un / uno
    note: می‌خواهم y یک se combinan para decir lo que quieres.
    target_text: می‌خواهم (quiero) / یک (un/una, uno)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Biblioteca
    gloss: biblioteca
    note: کتابخانه es la palabra estándar en dari para «biblioteca» y se forma con کتاب (libro) y خانه (casa).
    example_gloss: El libro está en la biblioteca.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliotecario
    gloss: bibliotecario
    note: کتابدار significa literalmente «el que tiene los libros» (quien cuida los libros) y se forma igual que دوکاندار («tendero», unidad 8).
    example_gloss: El bibliotecario está en la biblioteca.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Quiero un libro
    gloss: Quiero un libro.
    note: یک کتاب می‌خواهم combina یک (un/uno), کتاب (libro) y می‌خواهم (quiero).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Repaso: de, marca del objeto'
    gloss: de / (marca del objeto)
    note: از (de) y را (marca el objeto de la oración, de las unidades 14 y 26) son palabras de repaso.
    target_text: از (de, desde) / را (marcador de objeto directo)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Quiero el libro del bibliotecario
    gloss: Quiero el libro del bibliotecario.
    note: از کتابدار (del bibliotecario) se añade a کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Quiero un libro del bibliotecario
    gloss: Quiero un libro del bibliotecario.
    note: Combina یک (un/uno) con کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Repaso: fecha, día, lunes'
    gloss: fecha / día / lunes
    note: تاریخ, روز y دوشنبه (todas de la unidad 9) son palabras de repaso que se usan para preguntar por una fecha de devolución.
    target_text: تاریخ (fecha) / روز (día) / دوشنبه (lunes)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Repaso: cuál, es'
    gloss: cuál / es
    note: کدام y است son palabras de repaso que se usan para hacer una pregunta.
    target_text: کدام (cuál) / است (es)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Devolver / dar de vuelta
    gloss: devolver / dar de vuelta
    note: پس دادن significa literalmente «dar de vuelta»; پس (de vuelta) se une a دادن (dar).
    example_gloss: La fecha de devolución es el lunes.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: ¿Qué día es la fecha de devolución?
    gloss: ¿Qué día es la fecha de devolución del libro?
    note: تاریخ پس دادن کتاب کدام روز است؟ pregunta cuándo hay que devolver un libro prestado.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: La fecha de devolución es el lunes
    gloss: La fecha de devolución es el lunes.
    note: تاریخ پس دادن دوشنبه است responde a la pregunta con un día concreto.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Repaso: quiero, libro, un/uno, este'
    gloss: quiero / libro / un / uno / este
    note: می‌خواهم، کتاب، یک y این son palabras de repaso que se usan para pedir un libro concreto.
    target_text: می‌خواهم (quiero) / کتاب (libro) / یک (un/una, uno) / این (este/esta)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Conseguir / tomar
    gloss: conseguir / tomar
    note: بگیرم es la forma de subjuntivo («que yo consiga/tome»), la misma que se usó en la unidad 42 con می‌خواهم para decir «quiero conseguir».
    example_gloss: Quiero conseguir un libro.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Préstamo
    gloss: préstamo
    note: قرض significa préstamo; قرض گرفتن («tomar como préstamo») es la forma cotidiana en dari de decir «pedir prestado».
    example_gloss: Este libro es prestado.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Quiero pedir prestado el libro
    gloss: Quiero pedir prestado el libro.
    note: می‌خواهم کتاب را قرض بگیرم combina می‌خواهم, کتاب را, قرض y el subjuntivo بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Dar (de vuelta)
    gloss: dar (de vuelta)
    note: بدهم es la forma de subjuntivo de دادن (dar); con پس (de vuelta) significa «devolver».
    example_gloss: Quiero devolverlo.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Quiero devolver el libro
    gloss: Quiero devolver el libro.
    note: می‌خواهم کتاب را پس بدهم combina می‌خواهم, کتاب را, پس y el subjuntivo بدهم.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: 'Repaso: muy, bueno'
    gloss: muy / bueno
    note: بسیار y خوب son palabras de repaso que se usan para confirmar algo.
    target_text: بسیار (muy) / خوب (bueno)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: Está bien
    gloss: Está bien.
    note: خوب است confirma que algo está bien.
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: 'Repaso: hola, quiero'
    gloss: hola / quiero
    note: سلام y می‌خواهم son palabras de repaso que se usan en el diálogo.
    target_text: سلام (hola) / می‌خواهم (quiero)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: 'Repaso: muy, muchas gracias, de nada'
    gloss: muy / muchas gracias / de nada
    note: بسیار, تشکر زیاد y خواهش می‌کنم son palabras de repaso que se usan en el diálogo.
    target_text: بسیار (muy, mucho) / تشکر زیاد (muchas gracias) / خواهش می‌کنم (de nada)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hola. Quiero pedir prestado un libro.'
    gloss: Hola. Quiero pedir prestado un libro.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Bibliotecario: Hola. ¿Qué libro quiere?'
    gloss: Hola. ¿Qué libro quiere?
    note: می‌خواهین es la forma plural de cortesía de «tú quieres».
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Quiero este libro.'
    gloss: Quiero este libro.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Bibliotecario: Bien. La fecha de devolución es el lunes.'
    gloss: Bien. La fecha de devolución es el lunes.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Muy bien. Muchas gracias.'
    gloss: Muy bien. Muchas gracias.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Bibliotecario: De nada.'
    gloss: De nada.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Repaso: Homayoun, él/ella, él/ella tiene'
    gloss: Homayoun / él/ella / él/ella tiene
    note: همایون, او y دارد son palabras de repaso que se usan en el texto de lectura.
    target_text: همایون (Homayoun) / او (él/ella) / دارد (él/ella tiene)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Lectura sobre el libro prestado
    gloss: Homayoun tiene un libro. Su libro es de la biblioteca. La fecha de devolución de su libro es el lunes. Homayoun está contento.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Repaso: no tengo, pero, usted (formal)'
    gloss: no tengo / pero / usted (formal)
    note: ندارم, اما y شما son palabras de repaso que se usan para contrastar dos días.
    target_text: ندارم (no tengo) / اما (pero) / شما (usted)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Repaso: martes'
    gloss: martes
    note: سه‌شنبه es una palabra de repaso.
    target_text: سه‌شنبه (martes)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: El lunes tengo un libro, pero el martes no
    gloss: El lunes tengo un libro, pero el martes no tengo ninguno.
    note: اما contrasta tener un libro el lunes con no tenerlo el martes.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: ¿Qué libro quiere usted?
    gloss: ¿Qué libro quiere usted?
    note: La versión formal, con شما, para preguntar qué libro quiere alguien.
