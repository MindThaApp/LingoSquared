course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: pedir prestado y devolver un objeto sencillo de la biblioteca, preguntar la fecha de devolución y leer un texto breve sobre un libro prestado; preguntar qué libro quiere alguien, ofrecer y confirmar una fecha de devolución y entender un intercambio básico en la biblioteca.'
units:
  prs.a1.unit43.library:
    title: La biblioteca
    description: Pide un libro, tómalo prestado y devuélvelo, pregunta y confirma la fecha de devolución y lee un texto breve sobre un libro prestado.
