teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Mercado
    gloss: mercado / bazar
    note: بازار es la palabra habitual para una zona de mercado, a menudo toda una calle o un barrio de tiendas.
    example_gloss: El bazar está cerca.
  prs.a1.unit05.lesson01.teach.bank:
    title: Banco
    gloss: banco
    note: بانک es un préstamo directo y, como en español «banco», designa la entidad financiera; en dari se usa con esta forma de origen extranjero.
    example_gloss: ¿Dónde está el banco?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Mezquita
    gloss: mezquita
    note: مسجد es la palabra estándar para mezquita.
    example_gloss: La mezquita es grande.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Hospital
    gloss: hospital
    note: شفاخانه es la palabra cotidiana del dari afgano para hospital; es distinta de بیمارستان, la palabra del persa de Irán, que los hablantes de dari pueden entender pero normalmente no usan.
    example_gloss: El hospital está lejos.
  prs.a1.unit05.lesson01.teach.school:
    title: Escuela
    gloss: escuela
    note: مکتب es la palabra cotidiana del dari afgano para escuela; es distinta de مدرسه, la palabra del persa de Irán, que en dari suele referirse específicamente a una escuela religiosa.
    example_gloss: La escuela está cerca de la casa.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Farmacia
    gloss: farmacia
    note: دواخانه es la palabra cotidiana del dari afgano para farmacia (de دوا, medicina); es distinta de داروخانه, la palabra del persa de Irán.
    example_gloss: ¿Dónde está la farmacia?
  prs.a1.unit05.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra de enlace habitual para unir una lista de lugares.
    target_text: و (y)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Oficina de correos
    gloss: oficina de correos
    note: پوسته خانه combina پوسته (correo) con خانه (casa/edificio).
    example_gloss: La oficina de correos está cerrada.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Embajada
    gloss: embajada
    note: سفارت es la palabra estándar para embajada.
    example_gloss: La embajada está en Kabul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Aeropuerto
    gloss: aeropuerto
    note: میدان هوایی es el término cotidiano del dari afgano para aeropuerto (literalmente «campo aéreo»); es distinto de فرودگاه, el del persa de Irán.
    example_gloss: El aeropuerto está lejos.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Oficina (repaso)
    gloss: oficina
    note: دفتر ya se introdujo en una unidad anterior; aparece aquí junto a los demás lugares públicos.
    example_gloss: Mi oficina está cerca.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Preguntar dónde está el mercado
    gloss: ¿Dónde está el mercado?
    note: بازار کجاست؟ es el patrón básico para preguntar dónde está cualquier lugar.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Preguntar dónde está el hospital
    gloss: ¿Dónde está el hospital?
    note: El mismo patrón con کجاست sirve para cualquier nombre de lugar.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Llamar la atención de alguien con cortesía
    gloss: Disculpe, ¿dónde está la farmacia?
    note: ببخشین abre con cortesía una pregunta a un desconocido, con la misma función que «disculpe» en español.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Cómo se forma کجاست
    gloss: کجاست es کجا (dónde) más است (está), contraídos en una sola palabra.
    note: Reconocer este desglose te ayuda a ver el patrón en lugar de memorizar کجاست como un bloque sin analizar.
  prs.a1.unit05.lesson04.teach.near:
    title: Cerca
    gloss: cerca
    note: نزدیک describe algo que está cerca.
    example_gloss: El banco está cerca.
  prs.a1.unit05.lesson04.teach.far:
    title: Lejos
    gloss: lejos
    note: دور describe algo que está a cierta distancia.
    example_gloss: El hospital está lejos.
  prs.a1.unit05.lesson04.teach.here:
    title: Aquí
    gloss: aquí
    note: این‌جا señala el lugar donde está quien habla.
    example_gloss: El banco está aquí.
  prs.a1.unit05.lesson04.teach.there:
    title: Allí
    gloss: allí
    note: آن‌جا señala un lugar alejado de quien habla.
    example_gloss: La farmacia está allí.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Decir que el mercado está cerca
    gloss: El mercado está cerca.
    note: بازار نزدیک است usa el mismo verbo است que has visto a lo largo de este curso.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Decir que el aeropuerto está lejos
    gloss: El aeropuerto está lejos.
    note: میدان هوایی دور است sigue el mismo patrón, con دور en lugar de نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Al lado de
    gloss: al lado de
    note: در کنار significa literalmente «al costado de».
  prs.a1.unit05.lesson05.teach.behind:
    title: Detrás
    gloss: detrás de
    note: پشت indica que algo está situado detrás de otro lugar.
    example_gloss: La farmacia está detrás de la escuela.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Enfrente / frente a
    gloss: enfrente de / frente a
    note: مقابل indica que algo está situado justo frente a otro lugar.
    example_gloss: El banco está enfrente de la mezquita.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Ubica el hospital con respecto a la mezquita
    gloss: El hospital está al lado de la mezquita.
    note: شفاخانه در کنار مسجد است combina un lugar, la preposición در کنار y la cópula است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Muchas gracias
    gloss: Muchas gracias.
    note: تشکر زیاد intensifica el تشکر cotidiano que ya aprendiste.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina pregunta por la farmacia
    gloss: Zarmina pregunta con cortesía a un transeúnte dónde está la farmacia.
    note: ببخشین abre la pregunta con respeto, y es apropiado para dirigirse a un desconocido.
  prs.a1.unit05.lesson06.teach.turn02:
    title: El transeúnte da indicaciones
    gloss: El transeúnte dice que la farmacia no está lejos, que siga recto y que está al lado de la escuela.
    note: 'Aquí se combinan varios patrones de esta unidad: دور نیست (دور en negativo), مستقیم بروین y در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina da las gracias al transeúnte
    gloss: Zarmina le da las gracias de todo corazón.
    note: تشکر زیاد cierra el intercambio con cortesía.
  prs.a1.unit05.lesson06.teach.turn04:
    title: La respuesta modesta del transeúnte
    gloss: No hay de qué / no es nada.
    note: 'قابلی نداره es una forma modesta y muy común de restar importancia a los agradecimientos en el dari afgano cotidiano; cumple una función parecida a خواهش می‌کنم, pero es más informal. نداره es la forma hablada de ندارد: oirás نداره, mientras que la escritura cuidada usa ندارد.'
