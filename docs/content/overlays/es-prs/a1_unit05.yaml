course:
  title: Darí A1
  description: 'Dari afgano para principiantes: nombrar lugares comunes de la ciudad, preguntar dónde está algo, dar respuestas sencillas sobre ubicaciones y seguir indicaciones básicas para llegar a un lugar.'
