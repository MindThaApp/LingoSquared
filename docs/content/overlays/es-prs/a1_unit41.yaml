  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: Diálogo del bolso perdido
  prs.a1.unit41.lesson05.reading:
    title: Lectura sobre un bolso perdido
  prs.a1.unit41.lesson06.wrap_up:
    title: Resumen
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Repaso: esto, es'
    gloss: esto / es
    note: این y است son palabras básicas de repaso que sirven para decir qué es algo.
    target_text: این (esto/este) / است (es)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Repaso: tengo'
    gloss: tengo
    note: دارم es una palabra de repaso que se usa para decir qué objeto tienes o llevas contigo.
    target_text: دارم (tengo)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Bolso
    gloss: bolso
    note: خریطه es la palabra habitual en dari para decir bolso.
    example_gloss: Tengo un bolso.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Cartera
    gloss: cartera
    note: کیف پول significa cartera; literalmente une کیف (bolso, funda) y پول (dinero).
    example_gloss: Tengo una cartera.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Llave
    gloss: llave
    note: کلید significa llave.
    example_gloss: Tengo una llave.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Gafas
    gloss: gafas
    note: عینک significa gafas.
    example_gloss: Tengo gafas.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Está perdido
    gloss: está perdido
    note: 'گم شده une گم (perdido) con شده (se ha vuelto): es la forma habitual de decir que algo está perdido, con el mismo patrón que زخمی است (está herido) de la Unidad 40.'
    example_gloss: Mi bolso está perdido.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: ¡Mi cartera está perdida!
    gloss: ¡Mi cartera está perdida!
    note: کیف پولم une کیف پول con el sufijo posesivo -م (mi), el mismo patrón que خانه‌ام (mi casa) de unidades anteriores.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Repaso: puede(s), me, ayuda, haga (imperativo cortés)'
    gloss: puede(s) / me / ayuda / haga
    note: می‌توانین, مه ره, کمک y کنین se combinan para pedir ayuda.
    target_text: می‌توانین (¿puede usted?) / مه ره (a mí) / کمک (ayuda) / کنین (haga, forma cortés)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Repaso: (marca del objeto)'
    gloss: (marca del objeto)
    note: را marca lo que recibe la acción; aquí, lo que se ha visto.
    target_text: را (marcador de objeto directo)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: ¿Vio?
    gloss: ¿vio usted?
    note: دیدین es la forma cortés de segunda persona del plural en pasado del verbo دیدن (ver), que ya apareció en la Unidad 2 en از دیدن شما خوشحال شدم.
    example_gloss: ¿Vio mi bolso?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: ¿Vio mi bolso?
    gloss: ¿Vio mi bolso?
    note: Combina خریطه‌ام (mi bolso) con را y دیدین para preguntar si alguien lo ha visto.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: Está encontrado / ha aparecido
    gloss: ha aparecido / está encontrado
    note: 'پیدا شده une پیدا (encontrado, disponible) con شده (se ha vuelto): es la forma habitual de preguntar si algo ha aparecido.'
    example_gloss: Mi llave ha aparecido.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: ¿Ha aparecido mi llave?
    gloss: ¿Ha aparecido mi llave?
    note: کلیدم une کلید con el sufijo posesivo -م (mi llave).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 'Repaso: color, negro, blanco, y'
    gloss: color / negro / blanco / y
    note: رنگ, سیاه, سفید y و sirven para describir el color de un objeto.
    target_text: رنگ (color) / سیاه (negro) / سفید (blanco) / و (y)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 'Repaso: grande, pequeño'
    gloss: grande / pequeño
    note: بزرگ y کوچک sirven para describir el tamaño de un objeto.
    target_text: بزرگ (grande) / کوچک (pequeño)
  prs.a1.unit41.lesson03.teach.here_word:
    title: Aquí
    gloss: aquí
    note: اینجا significa aquí.
    example_gloss: La llave está aquí.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: Mi bolso es negro
    gloss: Mi bolso es negro.
    note: خریطه‌ام (mi bolso) más سیاه (negro) describe el objeto para ayudar a identificarlo.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: Mi cartera es pequeña y negra
    gloss: Mi cartera es pequeña y negra.
    note: 'و (y) une dos palabras descriptivas: کوچک (pequeña) y سیاه (negra).'
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 'Repaso: qué, muchas gracias'
    gloss: qué / muchas gracias
    note: چه y تشکر زیاد son palabras de repaso que se usan en el diálogo.
    target_text: چه (qué) / تشکر زیاد (muchas gracias)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 'Repaso: sí, de nada'
    gloss: sí / de nada
    note: بلی y خواهش می‌کنم son palabras de repaso que se usan en el diálogo.
    target_text: بلی (sí) / خواهش می‌کنم (de nada)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Homayoun: ¡Zarmina, mi bolso está perdido!'
    gloss: ¡Zarmina, mi bolso está perdido!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Zarmina: ¿De qué color es?'
    gloss: ¿De qué color es?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Es negro.'
    gloss: Es negro.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: 'Zarmina: ¡Sí, lo vi! Está aquí.'
    gloss: ¡Sí, lo vi! Está aquí.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: 'Homayoun: ¡Muchas gracias!'
    gloss: ¡Muchas gracias!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: 'Zarmina: De nada.'
    gloss: De nada.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 'Repaso: uno, tiene'
    gloss: uno / tiene
    note: یک y دارد son palabras de repaso que se usan en el texto de lectura.
    target_text: یک (uno) / دارد (él/ella tiene)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: Lectura sobre un bolso perdido
    gloss: Homayoun tiene un bolso. Su bolso es negro. Su bolso está perdido. Zarmina ve el bolso. ¡El bolso está aquí!
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 'Repaso: no tengo, pero, usted'
    gloss: no tengo / pero / usted
    note: ندارم, اما y شما son palabras de repaso que sirven para contrastar lo que se tiene y lo que no, y para hacer una pregunta formal.
    target_text: ندارم (no tengo) / اما (pero) / شما (usted)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: Tengo la llave, pero no tengo el bolso
    gloss: Tengo la llave, pero no tengo el bolso.
    note: اما contrapone tener la llave y no tener el bolso.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: ¿Vio usted mi bolso?
    gloss: ¿Vio usted mi bolso?
    note: La versión formal con شما para preguntar de forma directa y cortés si alguien ha visto el objeto.
