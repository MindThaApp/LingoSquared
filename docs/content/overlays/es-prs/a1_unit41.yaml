course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: informar de que un objeto personal se ha perdido, preguntar si lo han encontrado, describirlo por su color y tamaño, y leer un breve texto sobre un objeto perdido y encontrado.'
units:
  prs.a1.unit41.lost_items:
    title: Objetos perdidos
    description: Informa de que un objeto personal se ha perdido, pregunta si lo han encontrado, descríbelo e identifícalo cuando aparezca.
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: Vocabulario de objetos perdidos
  prs.a1.unit41.lesson02.asking_if_found:
