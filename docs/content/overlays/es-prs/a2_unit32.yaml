      status: correct
    feedback: '*بهتر است که به داکتر بروی* significa «es mejor que vayas al médico»: *بهتر است که* más el subjuntivo *بروی*.'
  prs.a2.unit32.lesson01.exercise02.recognize_rest:
    instruction: ¿Qué significa esta frase?
    correct_option: Es mejor que descanses
