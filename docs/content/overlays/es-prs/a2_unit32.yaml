course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: dar y responder consejos sencillos sobre salud, estudios y dinero con el subjuntivo. Consejos suaves con بهتر است که, consejos firmes con باید y نباید, sugerencias corteses con پیشنهاد می‌کنم که, preguntar qué hacer, y aceptar, dudar o rechazar un consejo.'
units:
  prs.a2.unit32.giving_advice:
    title: Dar consejos
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: Es mejor que vayas al médico
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Deber y no deber
  prs.a2.unit32.lesson03.i_suggest:
    title: Te sugiero que
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Pedir un consejo y responderlo
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Lectura y comprensión auditiva sobre la salud
  prs.a2.unit32.lesson06.money_conversation:
    title: Una conversación sobre dinero
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Médico
    gloss: médico/médica
    note: '*داکتر* es la palabra afgana para «médico». Para ir al médico se dice *به داکتر رفتن*: *به داکتر می‌روم* significa «voy al médico».'
    example_gloss: El médico está hoy en el consultorio.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Medicina
    gloss: medicina
    note: '*دوا* es «medicina». En dari no se bebe ni se toma: se come, *دوا خوردن*. *دوا را می‌خورم* significa «tomo la medicina».'
    example_gloss: Tomo la medicina después de comer.
  prs.a2.unit32.lesson01.teach.sick:
    title: Enfermo
    gloss: enfermo, enferma
    note: '*مریض* significa «enfermo». *مریض استم* es «estoy enfermo» y *او مریض است* es «él o ella está enfermo/a».'
    example_gloss: Mi hermano está enfermo.
  prs.a2.unit32.lesson01.teach.rest:
    title: Descansar
    gloss: descansar
    note: '*استراحت کردن* significa «descansar». Es un verbo de dos palabras: *استراحت* va delante y solo cambia *کردن*, como en *استراحت می‌کنم* (descanso).'
    example_gloss: Después del trabajo descanso.
  prs.a2.unit32.lesson01.teach.sleep:
    title: Dormir
    gloss: dormir, acostarse
    note: '*خوابیدن* significa «dormir» o «acostarse». *شب‌ها* es «por las noches»: *شب‌ها زود می‌خوابم* significa «por las noches me acuesto temprano». *دیر خوابیدن* es «acostarse tarde».'
    example_gloss: Acostarse temprano es importante.
  prs.a2.unit32.lesson01.teach.head:
    title: Me duele la cabeza
    gloss: Me duele la cabeza.
    note: 'Para decir que te duele una parte del cuerpo, añade *-م* a esa parte y pon *درد می‌کند*: *سرم درد می‌کند* (me duele la cabeza). Es el problema habitual por el que un amigo te da consejos.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'El consejo usa el subjuntivo: imperativo más ی'
    gloss: 've: que vayas; come: que comas; duerme: que duermas; descansa: que descanses'
    note: 'Para dar un consejo se usa una forma verbal llamada subjuntivo. Para un amigo (*تو*) es fácil: toma el imperativo que le dirías y añade *ی*. *برو* (ve) da *بروی*, *بخور* (come) da *بخوری*, *بخواب* (duerme) da *بخوابی*, *استراحت کن* (descansa) da *استراحت کنی*. En la mayoría de los verbos el imperativo empieza por *ب-*; los verbos formados con *کردن* no llevan *ب-* (*کن*, no *بکن*, en esta unidad).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'El subjuntivo de رفتن: las seis personas'
    gloss: que yo vaya, que tú vayas (amigo), que él/ella vaya, que nosotros vayamos, que ustedes vayan (formal o plural), que ellos vayan
    note: 'La raíz del imperativo *برو* toma estas terminaciones: *بروم* (yo), *بروی* (tú, a un amigo), *برود* (él o ella), *برویم* (nosotros), *بروین* (usted/ustedes, formal o plural), *بروند* (ellos). Las terminaciones son *-م، -ی، -د، -یم، -ین، -ند*. Esta unidad escribe la terminación de la 2.ª persona del plural como *-ین*, igual que el resto del curso. El subjuntivo no indica el tiempo: el sentido lo da el consejo o el verbo principal que lo rodea.'
  prs.a2.unit32.lesson01.teach.better:
    title: Dar consejos con بهتر است که
    gloss: Es mejor que vayas al médico.
    note: '*بهتر است* (es mejor) más *که* más el subjuntivo es la forma suave y amistosa de aconsejar: *بهتر است که به داکتر بروی* significa «es mejor que vayas al médico». Se puede omitir *که*: *بهتر است به داکتر بروی* significa lo mismo. Esta unidad escribe siempre *است* completo; en el dari escrito del curso no hay forma más corta. La persona que debe actuar se indica solo por la terminación del subjuntivo: *بروی* es «tú».'
  prs.a2.unit32.lesson01.teach.better_more:
    title: Más consejos para un amigo enfermo
    gloss: Es mejor que tomes la medicina. Es mejor que te acuestes. Es mejor que descanses.
    note: 'El mismo patrón con otros verbos: *دوا بخوری* (que tomes la medicina), *بخوابی* (que te acuestes), *استراحت کنی* (que descanses). Solo cambia el verbo final; *بهتر است که* permanece igual.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'La negación: ن en lugar de ب'
    gloss: Es mejor que no vayas. Es mejor que no te acuestes tarde.
    note: 'Para decir lo que un amigo no debe hacer, pon *ن-* en lugar de *ب-*: *بروی* pasa a *نروی*, *بخوری* a *نخوری*, *بخوابی* a *نخوابی*. Con los verbos con *کردن* la negación es *نکنی*. Así, *بهتر است که دیر نخوابی* significa «es mejor que no te acuestes tarde».'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Consejo a una persona que respetas: ین'
    gloss: Es mejor que vaya al médico. (formal o plural)
    note: 'A alguien a quien respetas, una persona mayor, un desconocido, o a varias personas, usa *شما* y la terminación *-ین*: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* significa «es mejor que vaya al médico» (o «vayan»). Con un amigo, usa *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Beber mucha agua
    gloss: Es mejor que bebas mucha agua.
    note: 'En dari el agua también se «come», igual que la medicina: *آب خوردن* es «beber agua». *آب زیاد* es «mucha agua». Es un consejo muy habitual para un amigo enfermo.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Lección, estudio
    gloss: lección, tarea escolar
    note: '*درس* es una lección o las tareas de estudio. *درس خواندن* es «estudiar» (literalmente, «leer la lección»): *درس می‌خوانم* significa «estudio».'
    example_gloss: Estudio todos los días.
  prs.a2.unit32.lesson02.teach.exam:
    title: Examen
    gloss: examen, prueba
    note: '*امتحان* es un examen o una prueba. Los consejos sobre el estudio suelen referirse a un *امتحان* que se acerca.'
    example_gloss: Mi examen es mañana.
  prs.a2.unit32.lesson02.teach.book:
    title: Libro
    gloss: libro
    note: '*کتاب* es «libro». Añade *-م* para «mi»: *کتابم*. El plural se escribe *کتاب‌ها*.'
    example_gloss: Mi libro está en la escuela.
  prs.a2.unit32.lesson02.teach.review:
    title: Repetir, repasar
    gloss: repetir, repasar
    note: '*تکرار کردن* es «repetir» o «repasar» algo. Es el consejo habitual antes de un examen: *درس را تکرار کن*.'
    example_gloss: Todas las noches repaso la lección.
  prs.a2.unit32.lesson02.teach.early:
    title: Temprano, pronto
    gloss: temprano, pronto
    note: '*زود* significa «temprano» o «pronto». *زود خوابیدن* es «acostarse temprano» y *صبح زود* es «por la mañana temprano».'
    example_gloss: Por la mañana temprano voy a la escuela.
  prs.a2.unit32.lesson02.teach.late:
    title: Tarde
    gloss: tarde
    note: '*دیر* significa «tarde»; es lo contrario de *زود*. *دیر خوابیدن* es «acostarse tarde».'
    example_gloss: Hoy él o ella llegó tarde.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید más subjuntivo: deber'
    gloss: Tienes que estudiar todos los días.
    note: '*باید* (deber, tener que) también va seguido del subjuntivo: *باید هر روز درس بخوانی* significa «tienes que estudiar todos los días». *باید* nunca cambia; la terminación del subjuntivo indica quién. *باید* es más fuerte que *بهتر است که*: expresa un deber o una necesidad clara. El orden de las palabras es libre: *هر روز باید درس بخوانی* también es correcto.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید con las seis personas
    gloss: tengo que ir, tienes que ir, tiene que ir, tenemos que ir, tienen que ir (formal o plural), tienen que ir
    note: 'Solo cambia la terminación del subjuntivo: *باید بروم* (tengo que ir), *باید بروی* (tienes que ir), *باید برود* (él o ella tiene que ir), *باید برویم* (tenemos que ir), *باید بروین* (usted/ustedes tienen que ir, formal o plural), *باید بروند* (ellos tienen que ir).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: no deber'
    gloss: No debes acostarte tarde.
    note: '*نباید* (no deber) es *باید* con *ن-* delante. El verbo que sigue queda en afirmativo: *نباید دیر بخوابی* significa «no debes acostarte tarde». No añadas una segunda *ن-*: se dice *نباید بخوابی*, no *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Consejo suave y consejo firme
    gloss: Es mejor que te acuestes temprano. Tienes que acostarte temprano.
    note: Las dos frases dan el mismo consejo, pero con distinta fuerza. *بهتر است که زود بخوابی* es amistosa y suave, como «sería mejor que...». *باید زود بخوابی* es firme, como «de verdad tienes que...». Usa *بهتر است که* con un amigo cuando solo aconsejas, y *باید* cuando es importante, por ejemplo antes de un examen.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Consejo antes de un examen
    gloss: Es mejor que repases la lección.
    note: 'Lo que trabajas va antes del verbo con *را*: *درس را تکرار کنی* (que repases la lección). Es un buen consejo de estudio.'
  prs.a2.unit32.lesson03.teach.money:
    title: El dinero
    gloss: dinero
    note: '*پول* es «dinero». *پولم* es «mi dinero». *پولم کم است* significa «tengo poco dinero».'
    example_gloss: Tengo poco dinero.
  prs.a2.unit32.lesson03.teach.spend:
    title: Gastar
    gloss: gastar
    note: '*خرج کردن* es «gastar» dinero. El dinero va antes del verbo: *پول خرج کردن*. *زیاد خرج کردن* es «gastar mucho».'
    example_gloss: Cada mes gasta mucho dinero.
  prs.a2.unit32.lesson03.teach.save:
    title: Ahorrar
    gloss: ahorrar (dinero)
    note: '*پس‌انداز کردن* es «ahorrar» dinero. Como *خرج کردن*, es un verbo de dos palabras. *پس‌انداز* se escribe con el pequeño espacio entre *پس* y *انداز*.'
    example_gloss: Cada mes ahorro un poco de dinero.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Caro
    gloss: caro
    note: '*گران* significa «caro». Lo contrario es *ارزان* (barato).'
    example_gloss: Este coche es caro.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Barato
    gloss: barato
    note: '*ارزان* significa «barato». Lo contrario es *گران*.'
    example_gloss: Este libro es barato.
  prs.a2.unit32.lesson03.teach.month:
    title: Mes
    gloss: mes
    note: '*ماه* es «mes». *هر ماه* es «cada mes». Es una palabra útil para hablar de dinero, porque mucha gente recibe y gasta dinero cada mes.'
    example_gloss: Cada mes voy al banco.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که más subjuntivo
    gloss: Te sugiero que ahorres dinero cada mes.
    note: '*پیشنهاد می‌کنم* significa «te sugiero», y *که* más el subjuntivo indica lo que sugieres: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* es «te sugiero que ahorres dinero cada mes». El verbo *می‌کنم* lleva *می‌* y la terminación *-م* (yo). El verbo después de *که* vuelve a estar en subjuntivo: *پس‌انداز کنی*. Para sugerir algo en grupo, di *پیشنهاد می‌کنیم که* («sugerimos que»).'
  prs.a2.unit32.lesson03.teach.three:
    title: Tres maneras de dar el mismo consejo
    gloss: Es mejor que ahorres dinero. Debes ahorrar dinero. Te sugiero que ahorres dinero.
    note: 'Ya conoces tres estructuras que llevan subjuntivo. *بهتر است که* es la amable. *باید* es firme. *پیشنهاد می‌کنم که* es cortés y clara: suena como la sugerencia de alguien que te respeta, y es la que conviene usar cuando no tienes confianza con la persona.'
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: Sugerimos
    gloss: Sugerimos que te acuestes temprano.
    note: 'Para «nosotros», la terminación de *می‌کنم* pasa a ser *-یم*: *پیشنهاد می‌کنیم* significa «sugerimos». Úsalo cuando hablas en nombre de un grupo, por ejemplo una familia o un equipo.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Sugerir lo que no se debe hacer
    gloss: Te sugiero que no gastes mucho dinero.
    note: 'Después de *پیشنهاد می‌کنم که* se usa el subjuntivo negativo para lo que no se debe hacer: *نکنی* de *کردن*, *نخری* de *خریدن*. La parte *می‌کنم* sigue siendo afirmativa: tú sugieres, y lo que sugieres es negativo.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: No compres cosas caras
    gloss: Te sugiero que no compres cosas caras.
    note: '*چیزهای گران* significa «cosas caras»: el plural de *چیز* es *چیزها*, y un *-ی* de enlace lo une con el adjetivo que sigue. *نخری* es la forma negativa de *بخری* («que compres»), de *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: ¿Qué hago?
    gloss: ¿Qué hago?
    note: 'Para pedir consejo también se usa el subjuntivo: *چه کار کنم؟* significa «¿qué hago?», en el sentido de «¿qué debería hacer?». El plural es *چه کار کنیم؟* («¿qué hacemos?»). Primero cuenta el problema y luego pregunta: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: A una persona que respetas
    gloss: En tu opinión, ¿qué hago?
    note: '*به نظر شما* significa «en su opinión». Con una persona mayor o un desconocido es la manera cortés de pedir consejo: *به نظر شما چه کار کنم؟*. Después, la otra persona puede responder con *بهتر است که* o *پیشنهاد می‌کنم که*.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: ¿Qué sugiere usted?
    gloss: ¿Qué sugiere usted?
    note: '*شما چه پیشنهاد می‌کنین؟* pregunta a alguien a quien respetas qué sugiere. Usa la terminación *-ین* de *شما*. Con un amigo se dice *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Aceptar el consejo
    gloss: Es una buena idea. Voy a hacer justo eso.
    note: '*فکر خوبی است* significa «es una buena idea». *همین کار را می‌کنم* significa «voy a hacer justo eso». El presente *می‌کنم* sirve también para decir lo que decides hacer. Usa estas dos frases cuando quieras seguir el consejo.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Agradecer el consejo
    gloss: Gracias por tu sugerencia.
    note: '*از پیشنهادت ممنون* significa «gracias por tu sugerencia». *پیشنهادت* es *پیشنهاد* con *-ت*, «tu». Es una forma amable de cerrar la conversación después de cualquier consejo.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Decir que no puedes hacerlo
    gloss: No puedo, porque no tengo tiempo.
    note: 'Cuando no puedes seguir el consejo, dilo y da la razón: *نمی‌توانم، چون وقت ندارم* significa «no puedo, porque no tengo tiempo». *می‌توانم* es «puedo» y *نمی‌توانم* es «no puedo». La razón va después de *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Consejos más suaves con شاید y el subjuntivo de بودن
    gloss: Quizá sería mejor que descansaras. Quizá eso sea correcto.
    note: 'Después de *شاید* («quizá») va el subjuntivo. El subjuntivo de *بودن* es *باشم، باشی، باشد، باشیم، باشین، باشند*. Así, *شاید بهتر باشد که استراحت کنی* significa «quizá sería mejor que descansaras»: un consejo muy suave. También puedes reaccionar a un consejo con *شاید درست باشد* («quizá sea correcto») cuando aún no estás seguro. *ممکن است درست باشد* («puede que sea correcto») significa casi lo mismo.'
  prs.a2.unit32.lesson04.teach.agree:
    title: Estar de acuerdo
    gloss: Es verdad. Voy a hacer justo eso.
    note: '*درست است* significa «es verdad» o «tienes razón». Después de un consejo quiere decir que estás de acuerdo. Junto con *همین کار را می‌کنم* es un sí claro.'
  prs.a2.unit32.lesson05.teach.three:
    title: Tres
    gloss: tres
    note: '*سه* es «tres». *سه روز* es «tres días». Un médico suele decir cuántos días necesitas descansar.'
    example_gloss: Estuve tres días en Kabul.
  prs.a2.unit32.lesson05.teach.said:
    title: Él o ella dijo
    gloss: dijo (él o ella)
    note: '*گفت* es el pasado de *گفتن* («decir») para «él» o «ella». Después de *گفت* sigue una frase corta, como en *داکتر گفت: ...* («el doctor dijo: ...»).'
    example_gloss: 'Dijo: Mañana vengo.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: Esperar, tener paciencia
    gloss: esperar, tener paciencia
    note: '*صبر کردن* significa «esperar» o «tener paciencia». *نباید صبر کنی* significa «no debes esperar», es decir, hazlo de inmediato.'
    example_gloss: Espera un poco.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Jamila cuenta qué le pasa
    gloss: Zakaria, me duele la cabeza y por las noches no duermo bien. ¿Qué debo hacer?
    note: Jamila describe el problema con *سرم درد می‌کند* y *خوب نمی‌خوابم* («no duermo bien»), y luego pide consejo con *چه کار کنم؟*.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Zakaria da dos consejos
    gloss: Es mejor que vayas al médico. Debes beber mucha agua.
    note: Zakaria usa primero el amable *بهتر است که به داکتر بروی* y luego el más firme *باید آب زیاد بخوری*. Habla con una amiga, por eso la terminación es *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Jamila acepta y planea para mañana
    gloss: Es una buena idea. Mañana voy al médico.
    note: 'Jamila acepta con *فکر خوبی است*. Planea ir mañana: *فردا به داکتر می‌روم*, el presente con una palabra de tiempo.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: Zakaria dice que vaya hoy
    gloss: Te sugiero que vayas hoy. No debes esperar.
    note: 'Zakaria dice que es urgente: *پیشنهاد می‌کنم که امروز بروی*, y con *نباید صبر کنی* añade «no esperes». Fíjate en que no repite *به داکتر*, porque ya se entiende.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Jamila está de acuerdo
    gloss: Muy bien, voy hoy. Gracias.
    note: 'Jamila cambia su plan para hoy: *امروز می‌روم*. Termina con cortesía con *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: Un mensaje después del médico
    gloss: 'Hola, Zakaria. Gracias por tu sugerencia. Hoy fui al médico. El médico dijo: es mejor que descanses tres días y debes tomar medicina. No debes acostarte tarde por las noches. Mañana no voy a la escuela.'
    note: 'Jamila escribe el siguiente mensaje. El médico dio consejos con las mismas tres estructuras: *بهتر است که* (descansar tres días), *باید* (tomar medicina) y *نباید* (no acostarse tarde). El consejo se cita después de *گفت:* con la misma forma.'
  prs.a2.unit32.lesson06.teach.start:
    title: Empezar
    gloss: empezar, comenzar
    note: '*شروع کردن* significa «empezar». *از امروز شروع می‌کنم* significa «empiezo desde hoy», una promesa después de aceptar un consejo.'
    example_gloss: Empiezo desde mañana.
  prs.a2.unit32.lesson06.teach.only:
    title: Solo
    gloss: solo, solamente
    note: '*فقط* significa «solo» o «solamente». *فقط چیزهای مهم* significa «solo las cosas importantes».'
    example_gloss: Solo tengo un libro.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Zakaria cuenta qué le pasa
    gloss: Jamila, tengo poco dinero y cada mes gasto mucho. ¿Qué debo hacer?
    note: 'Zakaria plantea el problema en dos partes: *پولم کم است* y *هر ماه زیاد خرج می‌کنم*. Luego pide consejo: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Jamila sugiere ahorrar
    gloss: Te sugiero que ahorres un poco de dinero cada mes.
    note: Jamila usa la estructura cortés *پیشنهاد می‌کنم که* más el subjuntivo *پس‌انداز کنی*. *کمی* significa «un poco».
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Zakaria dice que no puede
    gloss: Es una buena idea, pero no puedo. Todo está caro.
    note: 'Zakaria dice que la idea es buena, pero da una razón por la que no puede seguirla: *همه چیز گران است* («todo está caro»).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Jamila aconseja qué no comprar
    gloss: Entonces no debes comprar cosas caras. Es mejor que compres solo cosas importantes.
    note: 'Jamila cambia el consejo: *نباید چیزهای گران بخری* (una regla firme) y *بهتر است که فقط چیزهای مهم بخری* (una sugerencia amable).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Zakaria está de acuerdo y empieza
    gloss: Tienes razón. Empiezo desde hoy. Gracias.
    note: 'Zakaria está de acuerdo con *درست است* y promete: *از امروز شروع می‌کنم*.'
exercises:
  prs.a2.unit32.lesson01.exercise01.recognize_go_doctor:
    instruction: ¿Qué significa esta frase?
