      right: Fui
    - left: رفتی
      right: fuiste (a un amigo)
    - left: رفت
      right: él o ella fue
    - left: رفتیم
      right: fuimos
    - left: رفتین
      right: fueron / fue usted (formal o plural)
    - left: رفتند
      right: fueron
    - left: بازار
      right: bazar
    - left: بانک
      right: banco
    - left: پارک
      right: parque
  prs.a2.unit19.lesson01.exercise05.order_thursday_bank:
    instruction: 'Ordena las palabras para decir: El jueves por la tarde fui al banco.'
    accepted_answers:
