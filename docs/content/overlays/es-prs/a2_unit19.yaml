course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: contar lo que hiciste el fin de semana pasado, en orden, incluido lo que no hiciste. El pasado simple como sistema (tema de pasado más terminaciones), el pasado negativo y el contraste con el presente.'
units:
  prs.a2.unit19.last_weekend:
    title: El fin de semana pasado
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Palabras del fin de semana y la forma del pasado
  prs.a2.unit19.lesson02.building_the_past:
    title: Formar el pasado con más verbos
  prs.a2.unit19.lesson03.negative_past:
    title: El pasado negativo, y pasado frente a presente
  prs.a2.unit19.lesson04.telling_in_order:
    title: Contarlo en orden
  prs.a2.unit19.lesson05.reading_and_listening:
