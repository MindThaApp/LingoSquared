      - پنجشنبه
      - عصر
      - به
      - بانک
      - رفتم
      status: correct
    - value:
      - به
      - بانک
      - پنجشنبه
      - عصر
      - رفتم
      status: correct
    feedback: '*پنجشنبه عصر به بانک رفتم* pone primero el tiempo, después el lugar y al final el verbo en pasado.'
  prs.a2.unit19.lesson01.exercise06.translate_went_bank:
    instruction: 'Traduce al dari, usando el pasado de رفتن: Fui al banco.'
    accepted_answers:
    - value: به بانک رفتم
      status: correct
    - value: من به بانک رفتم
      status: correct
    feedback: '*به بانک رفتم* es «fui al banco». Añadir *من* es correcto, pero la terminación *-م* ya indica «yo».'
  prs.a2.unit19.lesson02.exercise01.recognize_bought:
    instruction: ¿Qué significa esta frase?
    correct_option: compré pan y fruta
    distractors:
    - Comí pan y fruta
    - Vi pan y fruta
    - Fui al bazar por pan y fruta
    accepted_answers:
    - value: compré pan y fruta
      status: correct
    feedback: '*خریدم* es el pasado de *خریدن*, «comprar»: *نان و میوه خریدم* es «compré pan y fruta».'
  prs.a2.unit19.lesson02.exercise02.recognize_saw:
    instruction: ¿Qué significa este verbo?
    correct_option: vi
    distractors:
    - Hice
    - Compré
    - Comí
    accepted_answers:
    - value: vi
      status: correct
    feedback: '*دیدم* es «vi»: la raíz *دید* más la terminación *-م*.'
  prs.a2.unit19.lesson02.exercise03.match_past_verbs:
    instruction: Relaciona cada verbo en pasado con su significado.
    accepted_answers:
    - value:
        رفتم: Fui
        خوردم: Comí
        کردم: hice
        دیدم: vi
        خریدم: Compré
        داشتم: tuve
        شدم: me volví o me puse
        خورد: él o ella comió
