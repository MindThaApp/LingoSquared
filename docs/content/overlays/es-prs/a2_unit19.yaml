  prs.a2.unit19.lesson06.weekend_conversation:
    title: Una conversación sobre el fin de semana
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: El fin de semana pasado
    gloss: el fin de semana pasado
    note: '*آخر هفته* es el fin de semana y *گذشته* significa pasado. Juntos, *آخر هفتهٔ گذشته* es el fin de semana pasado, el marco temporal de toda esta unidad.'
    example_gloss: El fin de semana pasado fui al bazar.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Jueves, viernes
    gloss: Jueves, viernes
    note: En Afganistán el viernes es el día festivo semanal, y la tarde del jueves es cuando mucha gente empieza su fin de semana; por eso *پنجشنبه* y *جمعه* son los dos días que más usarás en las historias de fin de semana.
    example_gloss:
    - El jueves por la tarde fui al banco.
    - El viernes fui al parque.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: La tarde
    gloss: tarde, última hora de la tarde
    note: '*عصر* es la última hora de la tarde. Va después del día: *پنجشنبه عصر* es el jueves por la tarde.'
    example_gloss: El jueves por la tarde fui al banco.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Ayer
    gloss: ayer
    note: '*دیروز* es una palabra de repaso de la unidad de hechos pasados. Va con el mismo verbo en pasado que construirás en esta unidad.'
    example_gloss: Ayer desayuné.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: En el bazar
    gloss: en el bazar
    note: '*در* significa en, y *بازار* es el bazar o mercado, el lugar de muchos recados del fin de semana.'
    example_gloss: En el bazar compré pan y fruta.
  prs.a2.unit19.lesson01.teach.bank:
    title: Banco
    gloss: banco
    note: '*بانک* es el banco. Es otro lugar al que la gente va a hacer recados.'
    example_gloss: Por la tarde fui al banco.
  prs.a2.unit19.lesson01.teach.park:
    title: Parque
    gloss: parque
    note: '*پارک* es el parque, una palabra de repaso de las unidades de salidas.'
    example_gloss: El viernes fui al parque con mis amigos.
  prs.a2.unit19.lesson01.teach.shopping:
    title: Ir de compras
    gloss: ir de compras, hacer compras
    note: '*خرید کردن* es la forma habitual de decir que hiciste compras. *خرید* es la compra y *کردن* es el verbo hacer.'
    example_gloss: Hice compras en el bazar.
  prs.a2.unit19.lesson01.teach.visiting:
    title: Ir de visita
    gloss: ir a visitar a alguien
    note: '*به دیدن* más una persona más *رفتن* significa ir a visitar a esa persona: *به دیدن فامیلم رفتم* es «fui a visitar a mi familia». Las visitas son el segundo gran tema de esta unidad.'
    example_gloss: El viernes fui a visitar a mi familia.
  prs.a2.unit19.lesson01.teach.family:
    title: Familia, parientes
    gloss: familia, parientes
    note: '*فامیل* es tu familia y tus parientes. Añade *-م* para decir «mi»: *فامیلم* es mi familia.'
    example_gloss: Mi familia está en Kabul.
  prs.a2.unit19.lesson01.teach.errands:
    title: Tener recados
    gloss: tener cosas que hacer, tener recados
    note: '*کار* es trabajo, pero también significa tarea o recado. *کار داشتن* es tener cosas que hacer. *چند* significa unos cuantos, algunos o cuántos.'
    example_gloss: El jueves por la tarde tuve unos cuantos recados.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'El pasado simple: tema de pasado más terminaciones'
    gloss: yo fui, tú fuiste, él/ella fue, nosotros fuimos, ustedes fueron (o usted fue; formal o plural), ellos fueron
    note: 'El pasado simple es un sistema, no una lista de palabras que memorizar. Toma el infinitivo *رفتن* (ir) y quita la *ن* final: el tema de pasado es *رفت*. Después añade una terminación: *-م* para yo (*رفتم*), *-ی* para tú, a un amigo (*رفتی*), nada para él o ella (*رفت*), *-یم* para nosotros (*رفتیم*), *-ین* para usted o ustedes, formal o plural (*رفتین*), *-ند* para ellos (*رفتند*). El pronombre (*من، تو، او*) es opcional, porque la terminación ya indica quién lo hizo. Fíjate en que el pasado no lleva *می* delante, algo que sí lleva el presente.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'La misma regla, otro verbo: comer'
    gloss: yo comí, tú comiste, él/ella comió, nosotros comimos, ustedes comieron (o usted comió; formal o plural), ellos comieron
    note: 'La regla de *رفتن* sirve para casi todos los verbos. *خوردن* (comer) pierde su *ن* y da el tema de pasado *خورد*, seguido de las mismas seis terminaciones: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. La forma de él o ella es solo el tema, así que *خورد* significa «él o ella comió».'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: Ayer desayuné
    gloss: Ayer desayuné.
    note: '*صبحانه* es el desayuno, una palabra de repaso de las unidades de rutina diaria. *خوردم* es el pasado de *خوردن* con la terminación *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Pan y fruta
    gloss: pan y fruta
    note: '*نان* es pan y *میوه* es fruta. *و* significa «y».'
    example_gloss: En el bazar compré pan y fruta.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Cinco verbos más, una sola regla
    gloss: ver, comprar, hacer, volverse, tener en pasado
    note: 'Todos estos verbos siguen la misma regla: quita la *ن* y añade la terminación. *دیدن* (ver) da *دیدم* (vi) y *دیدی* (viste). *خریدن* (comprar) da *خریدم* (compré). *کردن* (hacer) da *کردم* (hice) y *کردی* (hiciste). *شدن* (volverse, ponerse) da *شدم* (me volví). *داشتن* (tener) da *داشتم* (tuve). Solo cambia la última parte del verbo, nunca el tema. Fíjate en que *خرید* es a la vez el tema de pasado de *خریدن* (compró) y el sustantivo «compras», como en *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: Vi una película
    gloss: Vi una película.
    note: '*فلم* es una película. En dari se dice *فلم دیدن*, literalmente «ver una película», así que *دیدم* es el verbo.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: Hice ejercicio
    gloss: Hice ejercicio.
    note: '*ورزش* es ejercicio. *ورزش کردن* significa hacer ejercicio, y la terminación va en *کردن*: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: Me desperté tarde
    gloss: Me desperté tarde.
    note: '*دیر* significa tarde y *بیدار شدن* significa despertarse. *بیدار شدم* es «me desperté», y *دیر* va delante.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'El pasado negativo: ن más el verbo en pasado'
    gloss: no fui, no fuiste, él/ella no fue, no fuimos, ustedes no fueron (o usted no fue; formal o plural), ellos no fueron
    note: 'Para decir que no hiciste algo, pon *ن* justo al principio del verbo en pasado: *رفتم* (fui) se convierte en *نرفتم* (no fui). No cambia nada más, así que siguen las mismas seis terminaciones: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. En el pasado simple negativo no hay *نمی*. Una acción terminada que no ocurrió es simplemente *ن* más el verbo en pasado.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: No desayuné
    gloss: No desayuné.
    note: '*نخوردم* es *ن* más *خوردم*: no comí.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: La misma ن con otros verbos
    gloss: no vi, no compré, no tuve, no hice
    note: 'La regla sirve para todos los verbos que conoces: *ندیدم* (no vi), *نخریدم* (no compré), *نداشتم* (no tuve), *نکردم* (no hice). Siempre *ن* primero y después el verbo en pasado. Algunos verbos que empiezan por آ cambian su ortografía: *آمدم* (vine) se convierte en *نیامدم* (no vine).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Negar verbos con کردن
    gloss: No hice compras en el bazar. No hice ejercicio.
    note: 'Algunos verbos son un sustantivo más *کردن*, como *خرید کردن* (ir de compras) y *ورزش کردن* (hacer ejercicio). La *ن* se pone en *کردن*, no en el sustantivo: *خرید نکردم*, *ورزش نکردم*. Escribir *نخرید کردم* es incorrecto.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Pasado frente a presente
    gloss: Voy al bazar. / Fui al bazar. / No fui al bazar.
    note: 'El presente de este verbo es *می‌روم* (voy, estoy yendo): *می* más el tema de presente *رو* más la terminación. El pasado es *رفتم*, sin *می*. Para negar el presente se usa *نمی‌روم*, pero para negar el pasado solo se usa *ن*: *نرفتم*. Usa el pasado para una acción terminada, como el fin de semana pasado, y el presente para lo que haces habitualmente o estás haciendo ahora.'
  prs.a2.unit19.lesson04.teach.first:
    title: Primero
    gloss: primero
    note: '*اول* abre una secuencia. Es una palabra de repaso de la unidad del horario semanal.'
    example_gloss: Primero desayuné.
  prs.a2.unit19.lesson04.teach.then:
    title: Luego, después
    gloss: luego, después de eso
    note: '*بعد* continúa la secuencia después de *اول*.'
    example_gloss: Luego fui al banco.
  prs.a2.unit19.lesson04.teach.but:
    title: Pero
    gloss: pero
    note: '*ولی* une algo que hiciste con algo que no hiciste: contrapone las dos cosas.'
    example_gloss: Fui al bazar, pero no compré nada.
  prs.a2.unit19.lesson04.teach.no:
    title: 'No'
    gloss: 'no'
    note: '*نخیر* es el «no» cortés y habitual en dari, que se usa para responder a una pregunta de sí o no.'
    example_gloss: No, no vi ninguna película.
  prs.a2.unit19.lesson04.teach.finally:
    title: Por último
    gloss: por último, al final
    note: '*در آخر* cierra una secuencia, después de *اول* y *بعد*. Ya conoces las dos palabras que lo forman.'
    example_gloss: Por último fui a visitar a mi familia.
  prs.a2.unit19.lesson04.teach.home:
    title: Casa, hogar
    gloss: casa, hogar
    note: '*خانه* es la casa o el hogar, una palabra de repaso de la unidad de la vivienda.'
    example_gloss: Por último fui a casa.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Contar un fin de semana en orden
    gloss: El jueves primero fui al banco, luego hice compras en el bazar y por último fui a casa.
    note: 'Para contar en orden lo que hiciste, da a cada acción terminada su propio verbo en pasado y usa *اول، بعد، در آخر* para marcar el orden. Las acciones van en el orden en que ocurrieron: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* Puedes unir las partes con una coma, un punto o *و*. Para añadir algo que no hiciste, usa *ولی* y un verbo negativo en pasado: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: También
    gloss: también
    note: '*هم* significa «también» y va después de lo que añade: *فلم هم ندیدم* significa «tampoco vi una película».'
    example_gloss: Yo también fui al bazar.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: Mi amigo
    gloss: mi amigo
    note: '*دوست* es «amigo» y *-م* añade «mi»: *دوستم* es «mi amigo».'
    example_gloss: El viernes fui a visitar a mi amigo.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: Mis amigos
    gloss: mis amigos
    note: '*دوستان* es «amigos» (el plural de *دوست*) y *-م* añade «mis»: *دوستانم* es «mis amigos».'
    example_gloss: El viernes fui al parque con mis amigos.
  prs.a2.unit19.lesson05.teach.with:
    title: Con
    gloss: con
    note: '*با* significa «con». Va antes de la persona: *با دوستانم* es «con mis amigos».'
    example_gloss: Fui al bazar con mis amigos.
  prs.a2.unit19.lesson05.teach.message:
    title: Un mensaje sobre el fin de semana pasado
    gloss: El fin de semana pasado, el jueves por la tarde tuve varias cosas que hacer. Primero fui al banco y luego compré pan y fruta en el bazar. El viernes me desperté tarde y desayuné, y luego fui a visitar a mi familia. No hice ejercicio y tampoco vi ninguna película.
    note: 'Un breve relato escrito de un fin de semana, en el orden en que ocurrieron las cosas. Dos cosas no sucedieron, y cada una es un verbo negativo en pasado: *ورزش نکردم* y *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Homayoun le pregunta a Zarmina por el jueves
    gloss: Zarmina, ¿fuiste al banco el jueves?
    note: Homayoun pregunta con el verbo en pasado *رفتی*, la forma de «tú» (con un amigo). Es una pregunta de sí o no sobre una acción terminada.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Zarmina responde
    gloss: No, no fui al banco. Vi una película.
    note: Zarmina dice primero lo que no ocurrió, *به بانک نرفتم*, y luego lo que sí ocurrió, *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Zarmina pregunta por el fin de semana pasado
    gloss: Homayoun, ¿qué hiciste el fin de semana pasado?
    note: '*چه کار کردی؟* significa «¿qué hiciste?». Pregunta por una acción terminada, por eso usa el pasado *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Homayoun cuenta sus gestiones y su visita
    gloss: El jueves por la tarde tuve varias cosas que hacer. Primero fui al banco y luego compré pan y fruta en el bazar. El viernes fui a visitar a mi familia.
    note: Homayoun cuenta las gestiones en orden con *اول* y *بعد*, y después pasa al viernes.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Zarmina pregunta por el ejercicio
    gloss: ¿Hiciste ejercicio?
    note: Una pregunta de sí o no sobre una acción terminada, con el pasado *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Homayoun dice que no y devuelve la pregunta
    gloss: No, no hice ejercicio. ¿Y tú?
    note: '*نخیر، ورزش نکردم* responde con el pasado negativo. *تو چطور؟* es una forma breve de preguntar «¿y tú?».'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Zarmina cuenta su fin de semana
    gloss: El jueves vi una película. El viernes fui al bazar con mis amigos, pero no compré nada.
    note: Zarmina usa *ولی* para contraponer lo que hizo, ir al bazar, con lo que no hizo, *خرید نکردم*.
  prs.a2.unit19.lesson06.teach.turn06:
    title: Homayoun reacciona
    gloss: ¡Qué bien!
    note: '*چه خوب!* significa «¡qué bien!», una reacción amable ante una buena noticia.'
