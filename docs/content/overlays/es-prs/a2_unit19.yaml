  prs.a2.unit19.lesson01.exercise02.recognize_went_bazaar:
    instruction: ¿Qué significa esta frase?
    correct_option: Fui al bazar
    distractors:
    - Iré al bazar
    - Fui al banco
    - Compré cosas en el bazar
    accepted_answers:
    - value: Fui al bazar
      status: correct
    feedback: '*به بازار رفتم* es «fui al bazar»: la raíz de pasado *رفت* más la terminación *-م*.'
  prs.a2.unit19.lesson01.exercise03.recognize_we_went_park:
    instruction: ¿Qué significa esta frase?
    correct_option: Fuimos al parque
    distractors:
    - Fui al parque
    - Fueron al parque
    - Él fue al parque
    accepted_answers:
    - value: Fuimos al parque
      status: correct
    feedback: 'La terminación *-یم* de *رفتیم* significa «nosotros»: *ما به پارک رفتیم* es «fuimos al parque».'
  prs.a2.unit19.lesson01.exercise04.match_go_forms:
    instruction: Une cada palabra en dari con su significado.
    accepted_answers:
    - value:
        رفتم: Fui
        رفتی: fuiste (a un amigo)
        رفت: él o ella fue
        رفتیم: fuimos
        رفتین: fueron / fue usted (formal o plural)
        رفتند: fueron
        بازار: bazar
        بانک: banco
        پارک: parque
      status: correct
    feedback: 'Cada terminación indica quién fue: *-م* yo, *-ی* tú (amigo), sin terminación él o ella, *-یم* nosotros, *-ین* ustedes o usted (formal o plural), *-ند* ellos.'
    pairs:
