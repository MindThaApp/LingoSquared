course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: cómo decir lo que estaba pasando cuando ocurrió otra cosa. El pasado continuo con می‌ y la raíz del pasado, la forma opcional در حال ... بودم, el pasado simple para el suceso que interrumpe, y los enlaces وقتی که, ناگهان y همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: ¿Qué pasaba cuando...?
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Palabras del tiempo y de la calle, y la forma می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: Más verbos y cosas de la historia
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Acción terminada o acción en curso
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Contar lo que pasaba: وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: Leer y escuchar sobre un incidente
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: Una conversación sobre anoche
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Calle
    gloss: calle, carretera
    note: '*سرک* es una calle o carretera. Con *در* significa en la calle: *در سرک*. La unidad empieza en la calle porque en ella ocurren la mayoría de nuestros pequeños incidentes.'
    example_gloss: Nuestra oficina está cerca de la calle.
  prs.a2.unit24.lesson01.teach.piyada:
    title: A pie
    gloss: a pie, caminando
    note: '*پیاده* significa a pie. *پیاده می‌روم* es voy a pie, camino. Aquí el verbo está en presente, *می‌روم*; en esta unidad verás el pasado del mismo patrón.'
    example_gloss: Todos los días voy a la oficina a pie.
  prs.a2.unit24.lesson01.teach.rain:
    title: Lluvia
    gloss: lluvia
    note: '*باران* es lluvia. *شروع شد* significa empezó: *باران شروع شد* es empezó a llover. Usarás esta pareja para el suceso que interrumpe a lo largo de toda la unidad.'
    example_gloss: Empezó a llover.
  prs.a2.unit24.lesson01.teach.snow:
    title: Llueve, nieva
    gloss: está lloviendo, está nevando
    note: '*برف* es nieve. El verbo *باریدن* (caer lluvia o nieve) se usa para ambas: *باران می‌بارد* es está lloviendo y *برف می‌بارد* es está nevando. Ambas son formas de presente con *می*.'
    example_gloss:
    - Hoy llueve.
    - En Kabul está nevando.
  prs.a2.unit24.lesson01.teach.wind:
    title: Viento
    gloss: viento
    note: '*باد* es viento. Para decir que hace viento, se dice que hay mucho viento: *باد زیاد است*.'
    example_gloss: Hoy hace mucho viento.
  prs.a2.unit24.lesson01.teach.traffic:
    title: Tráfico
    gloss: tráfico
    note: '*ترافیک* es tráfico. *ترافیک زیاد* es mucho tráfico, un motivo muy común para llegar tarde.'
    example_gloss: Hay mucho tráfico en la calle.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'Iba: می + raíz del pasado + terminaciones'
    gloss: yo iba, tú ibas, él/ella iba, nosotros íbamos, ustedes (formal o plural) iban, ellos iban
    note: 'Ya conoces el pasado simple para una acción terminada: *رفتم* es fui. Para decir lo que estaba ocurriendo en un momento del pasado, pon *می‌* delante del verbo en pasado: *می‌رفتم* es iba. El patrón es *می‌* + raíz del pasado (*رفت*) + las mismas terminaciones: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. Los pronombres *من، تو، او، ما، شما، آن‌ها* son opcionales. El tiempo atmosférico funciona igual: *باران می‌بارید* es llovía y *برف می‌بارید* es nevaba. Compara con el presente *می‌روم* (voy): solo cambian la raíz y la terminación. La misma forma *می‌رفتم* también puede significar solía ir (un hábito), como en *هر روز پیاده می‌رفتم*; la oración indica cuál es el sentido. En esta unidad significará sobre todo iba.'
  prs.a2.unit24.lesson02.teach.car:
    title: Coche
    gloss: coche
    note: '*موتر* es la palabra afgana habitual para coche. *در موتر* es en el coche.'
    example_gloss: Nuestro coche es nuevo.
  prs.a2.unit24.lesson02.teach.phone:
    title: Teléfono
    gloss: teléfono
    note: '*تیلفون* es teléfono. Añade *-م* para decir mi: *تیلفونم* es mi teléfono.'
    example_gloss: Mi teléfono está encendido.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Sombrilla
    gloss: sombrilla
    note: '*چتر* es paraguas. La lluvia y el paraguas van juntos: *چتر دارم* es tengo paraguas y *چتر ندارم* es no tengo.'
    example_gloss: Hoy está lloviendo, tengo paraguas.
  prs.a2.unit24.lesson02.teach.wet:
    title: Mojarse
    gloss: mojarse
    note: '*خیس* es mojado y *خیس شدن* es mojarse. *خیس شدم* es me mojé, un resultado habitual de la lluvia.'
    example_gloss: Si llueve, me mojo.
  prs.a2.unit24.lesson02.teach.ring:
    title: Sonar, llamar por teléfono
    gloss: sonar, llamar por teléfono a alguien
    note: '*زنگ زدن* tiene dos usos. Un teléfono puede sonar: *تیلفونم زنگ زد* (mi teléfono sonó). Una persona puede llamar a otra: *دوستم به من زنگ زد* (mi amigo me llamó). La raíz del pasado es *زد*, de *زدن*.'
    example_gloss: Mi amigo me llamó por teléfono.
  prs.a2.unit24.lesson02.teach.driving:
    title: Conducir
    gloss: conducir, manejar
    note: '*رانندگی کردن* es conducir. *رانندگی* es la conducción y *کردن* es el verbo hacer, como en *خرید کردن*. Es un sustantivo más *کردن*, así que lo que cambia es la parte verbal: *رانندگی کردم*.'
    example_gloss: Conduzco todos los días.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: El mismo patrón con otros verbos
    gloss: yo hacía, tú hacías, yo comía, yo veía o miraba, yo venía
    note: 'Todos los verbos siguen la misma regla: *می‌* + raíz del pasado + terminación. *کردن* da *می‌کردم* (yo hacía) y *می‌کردی* (tú hacías). *خوردن* da *می‌خوردم* (yo comía). *دیدن* da *می‌دیدم* (yo veía; con una película, la estaba viendo). *آمدن* da *می‌آمدم* (yo venía). Con un verbo como *آشپزی کردن*, solo cambia la parte verbal: *آشپزی می‌کردم* es estaba cocinando, no *می‌آشپزی*. La raíz nunca cambia, solo las terminaciones.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: yo cocinaba
    gloss: Estaba cocinando.
    note: '*آشپزی* es cocina (el acto de cocinar), una palabra repasada de las unidades de rutina diaria. *آشپزی می‌کردم* dice que estabas en pleno proceso de cocinar.'
  prs.a2.unit24.lesson02.teach.watching:
    title: Estaba viendo una película en casa
    gloss: Estaba viendo una película en casa.
    note: '*فلم دیدن* es ver una película, así que el pasado en curso es *فلم می‌دیدم*. *در خانه* es en casa.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: Estaba conduciendo en el coche
    gloss: Estaba conduciendo en el coche.
    note: '*در موتر* es en el coche y *رانندگی می‌کردم* es estaba conduciendo.'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'Estaba, estaban: بودن en pasado'
    gloss: yo estaba, tú estabas, él/ella estaba, nosotros estábamos, ustedes (formal o plural) estaban, ellos estaban
    note: '*بودن* es ser o estar. Su pasado se forma como cualquier otro pasado: raíz *بود* más las terminaciones *بودم، بودی، بود، بودیم، بودین، بودند*. Es la manera de decir era, estaba, estaban: *در موتر بودم* (estaba en el coche), *ترافیک زیاد بود* (había mucho tráfico). No lo confundas con el presente *استم، استی، است*. Un estado, como estar en un lugar o esperar, no necesita *می‌*, porque *بودم* ya describe una situación en ese momento del pasado.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: Esperar
    gloss: esperar, estar esperando
    note: '*منتظر بودن* es esperar. Esperar es un estado, así que el pasado es simplemente *منتظر بودم* (estaba esperando), sin *می‌*. Lo que esperas va antes de *منتظر*: *منتظر بس بودم*.'
    example_gloss: En la estación estaba esperando el autobús.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'No iba: نمی + raíz del pasado'
    gloss: yo no iba, yo no comía, yo no veía, yo no hacía
    note: 'Para decir que no estabas haciendo algo en ese momento, pon *نمی‌* delante de la raíz del pasado en lugar de *می‌*: *نمی‌رفتم* (no iba), *نمی‌خوردم* (no comía), *نمی‌دیدم* (no veía), *نمی‌کردم* (no hacía). Compáralo con el pasado negativo simple de la unidad del fin de semana: *نرفتم* es no fui (un hecho terminado: no ocurrió), mientras que *نمی‌رفتم* es no iba (no estaba en curso en ese momento, o no solía ir).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Fui frente a iba
    gloss: Fui a casa. / Iba a casa.
    note: 'Las dos formas se parecen mucho, pero cuentan historias distintas. *به خانه رفتم* es fui a casa: el trayecto ha terminado. *به خانه می‌رفتم* es iba a casa: estaba de camino, aún no había llegado, y algo puede pasar por el camino. Cuando cuentas lo que pasaba, la acción de fondo, más larga, lleva *می‌*, y el suceso repentino va en pasado simple sin *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: Cuando + pasado simple o cuando + می
    gloss: Cuando llegué a casa, empezó a llover. / Cuando iba por la calle, empezó a llover.
    note: 'Las dos oraciones usan *وقتی که* (cuando), pero el verbo que sigue decide el sentido. Con un pasado simple, *وقتی که به خانه رسیدم، باران شروع شد*, el primer hecho está terminado y el segundo viene después: tras llegar a casa, empezó a llover. Con *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, la primera acción seguía en curso y la lluvia empezó en medio de ella. Para contar lo que pasaba se necesita el segundo patrón.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Opcional: در حال … بودم'
    gloss: Estaba en pleno camino. / Estaba en plena cocina. / Estoy en pleno camino.
    note: 'El dari tiene una segunda manera, algo más enfática, de decir que algo estaba en curso: *در حال* + el infinitivo + *بودم*. *در حال رفتن بودم* es estaba yendo (en pleno trayecto), y con un sustantivo más *کردن* sigue el infinitivo completo: *در حال آشپزی کردن بودم*. Significa lo mismo que *می‌رفتم* y *آشپزی می‌کردم*; solo da más peso al hecho de que estaba en curso. Nunca estás obligado a usarla, y ambas formas son correctas en toda esta unidad. El presente tiene la misma forma enfática: *در حال رفتن استم* es estoy yendo, pero lo que la gente suele decir es *می‌روم*.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'El patrón: وقتی که + می, luego el suceso'
    gloss: Cuando iba por la calle, empezó a llover.
    note: 'Para decir lo que pasaba cuando ocurrió algo, construye la oración en dos partes. Primero el fondo: *وقتی که* + la acción en curso con *می‌*: *وقتی که در سرک می‌رفتم*. Después una coma y el suceso que interrumpió, en pasado simple sin *می‌*: *باران شروع شد*. El resultado es *وقتی که در سرک می‌رفتم، باران شروع شد.* La acción larga (*می‌رفتم*) ya estaba en marcha y el suceso breve (*شروع شد*) la cortó. Lo mismo vale con la forma enfática opcional: *وقتی که در حال رفتن بودم، باران شروع شد*. Puedes omitir *که* y decir solo *وقتی*.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: De repente
    gloss: de repente
    note: '*ناگهان* significa de repente. Va justo antes del verbo del suceso repentino, como en *ناگهان باران شروع شد*. Encaja bien con el verbo que interrumpe, que está en pasado simple.'
    example_gloss: De repente empezó a llover.
  prs.a2.unit24.lesson04.teach.same_time:
    title: En ese momento
    gloss: en ese mismo momento
    note: '*همان وقت* es en ese mismo momento. Úsalo al comienzo de una oración nueva para añadir un segundo suceso que ocurrió a la vez: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: En ese mismo momento sonó mi teléfono.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: Se fue la luz
    gloss: se fue la luz
    note: '*برق* es electricidad. *برق رفت* es se fue la luz (la electricidad se fue), un pequeño incidente que interrumpe lo que estabas haciendo.'
    example_gloss: De repente se fue la luz.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: Qué verbo lleva می y cuál no
    gloss: Cuando estaba viendo una película, de repente se fue la luz. En ese mismo momento sonó mi teléfono.
    note: 'Fíjate en dos tipos de verbo en cada oración. La acción de fondo lleva *می‌*: *فلم می‌دیدم* (estaba viendo una película), porque dura un rato. El suceso que interrumpe no lleva *می‌*: *برق رفت* (se fue la luz), porque ocurre una vez y termina. *ناگهان* o *همان وقت* acompañan al suceso, no al fondo. Si ambos verbos llevaran *می‌* o ninguno lo llevara, la oración ya no indicaría cuál interrumpió a cuál.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: Nos mojamos
    gloss: nos mojamos
    note: '*شدیم* significa «nos pusimos / nos quedamos», el pretérito simple de *شدن* con la terminación *-یم*. *خیس شدیم* es «nos mojamos».'
    example_gloss: En la calle empezó a llover y nos mojamos.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: Con mis amigos
    gloss: con mis amigos
    note: '*دوستانم* es «mis amigos» y *با* es «con»: *با دوستانم* es «con mis amigos». Lo oirás en el próximo intercambio.'
    example_gloss: El viernes estuve en el bazar con mis amigos.
  prs.a2.unit24.lesson05.teach.message:
    title: Un mensaje sobre ayer por la mañana
    gloss: Ayer por la mañana iba a la oficina. Había mucho tráfico en la calle. Mientras esperaba en el autobús, empezó a llover. En ese mismo momento sonó mi teléfono. Era mi amigo. Llegué tarde a la oficina.
    note: 'Un breve relato escrito de un pequeño incidente. La situación de fondo lleva *می‌*: *به دفتر می‌رفتم*. La espera es un estado: *منتظر بودم*. Los dos sucesos van en pretérito simple: *باران شروع شد* y *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Homayoun pregunta a Zarmina por el viernes
    gloss: Zarmina, ¿qué pasó el viernes en el bazar?
    note: Homayoun pregunta con *چه شد؟*, «¿qué pasó?». Es la forma habitual de pedir que cuenten un pequeño incidente.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Zarmina cuenta lo que pasó
    gloss: Cuando iba por el bazar con mis amigos, empezó a llover. No tenía paraguas y nos mojamos.
    note: Zarmina da primero la situación de fondo con *می‌* (*می‌رفتم*) y después el suceso (*باران شروع شد*). Su resultado, *خیس شدیم*, también va en pretérito simple.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Homayoun pregunta qué estaba haciendo Zarmina
    gloss: Zarmina, ¿qué estabas haciendo anoche?
    note: '*چه کار می‌کردی؟* significa «¿qué estabas haciendo?». Pregunta por una acción en curso, así que usa *می‌کردی* y no el *کردی* de la acción terminada.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Zarmina dice qué estaba haciendo y qué pasó
    gloss: Cuando estaba viendo una película, de repente se fue la luz.
    note: 'Situación de fondo: *فلم می‌دیدم*; después el suceso: *برق رفت*, con *ناگهان*.'
  prs.a2.unit24.lesson06.teach.turn03:
    title: Homayoun pregunta qué hizo después
    gloss: ¿Qué hiciste después?
    note: '*چه کار کردی؟* con el pretérito simple pregunta por una acción terminada: «¿qué hiciste?».'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Zarmina cuenta la llamada y pregunta a su vez
    gloss: En ese mismo momento sonó mi teléfono. Era mi amiga. Hablé con ella. ¿Y tú?
    note: '*همان وقت* añade un segundo suceso. *با او صحبت کردم* significa «hablé con ella», y *تو چطور؟* pregunta «¿y tú?».'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Homayoun cuenta lo del autobús y el tiempo
    gloss: Volvía a casa desde la oficina. Estaba en el autobús. Había mucho tráfico y además llovía.
    note: Usa *می‌آمدم* para el trayecto, *بودم* y *زیاد بود* para la situación y *می‌بارید* para la lluvia en curso.
  prs.a2.unit24.lesson06.teach.bad:
    title: ¡Qué mal!
    gloss: malo; ¡qué mal!
    note: '*بد* significa «malo». *چه بد!* es «¡qué mal!» o «¡qué pena!», una reacción amable ante un pequeño contratiempo.'
    example_gloss: Hoy llueve y el tráfico está mal.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Zarmina reacciona
    gloss: ¡Qué mal!
    note: '*چه بد!* es una reacción amable ante una mala noticia, lo contrario de *چه خوب!*.'
exercises:
  prs.a2.unit24.lesson01.exercise01.recognize_it_was_raining:
    instruction: ¿Qué significa esta frase?
    correct_option: Llovía
    distractors:
    - Ahora llueve
    - Mañana lloverá
    - Nevaba
    accepted_answers:
    - value: Llovía
      status: correct
    feedback: '*باران می‌بارید* significa «llovía»: *می‌* más la raíz de pasado *بارید*.'
  prs.a2.unit24.lesson01.exercise02.recognize_we_were_walking:
    instruction: ¿Qué significa esta frase?
    correct_option: Íbamos a pie por la calle
    distractors:
    - Iba a pie por la calle
    - Iban a pie por la calle
    - Vamos a pie por la calle
    accepted_answers:
    - value: Íbamos a pie por la calle
      status: correct
    feedback: 'La terminación *-یم* de *می‌رفتیم* significa «nosotros», y *می‌* indica que la acción estaba en curso: *ما در سرک پیاده می‌رفتیم*.'
  prs.a2.unit24.lesson01.exercise03.recognize_it_was_snowing:
    instruction: ¿Qué significa esta frase?
    correct_option: Nevaba
    distractors:
    - Llovía
    - Ahora nieva
    - Mañana nevará
    accepted_answers:
    - value: Nevaba
      status: correct
    feedback: '*برف* es «nieve», así que *برف می‌بارید* significa «nevaba».'
  prs.a2.unit24.lesson01.exercise04.match_forms_and_words:
    instruction: Une cada palabra en dari con su significado.
    accepted_answers:
    - value:
        می‌رفتم: yo iba / estaba yendo
        می‌رفتی: ibas (a un amigo)
        می‌رفت: él o ella iba
        می‌رفتیم: íbamos
        می‌رفتین: ibas (formal o plural)
        می‌رفتند: iban
        سرک: calle
        پیاده: a pie
        ترافیک: tráfico
        باد: viento
      status: correct
    feedback: 'Cada terminación indica quién iba: *-م* yo, *-ی* tú (amigo), sin terminación él o ella, *-یم* nosotros, *-ین* ustedes (formal o plural), *-ند* ellos.'
    pairs:
