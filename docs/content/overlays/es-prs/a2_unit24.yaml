    - left: می‌رفت
      right: él o ella iba
    - left: می‌رفتیم
      right: íbamos
    - left: می‌رفتین
      right: ibas (formal o plural)
    - left: می‌رفتند
      right: iban
    - left: سرک
      right: calle
    - left: پیاده
      right: a pie
    - left: ترافیک
      right: tráfico
    - left: باد
      right: viento
  prs.a2.unit24.lesson01.exercise05.order_walking_street:
    instruction: 'Ordena las palabras para decir: Iba a pie por la calle.'
    accepted_answers:
    - value:
      - در
