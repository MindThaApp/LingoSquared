    title: El concierto de las 8 de la noche cuesta 30 afganis, pero el de las 10 de la noche cuesta 50 afganis
    gloss: El concierto de las ocho de la noche cuesta 30 afganis, pero el de las diez de la noche cuesta 50 afganis.
    note: «Pero» contrasta las horas de inicio y los precios de dos conciertos distintos.
  prs.a1.unit54.lesson06.teach.review_your_ticket_how_much:
    title: 'Repaso: su entrada, cuánto'
    gloss: su entrada / cuánto
    note: «Su entrada» usa el mismo sufijo formal que «su entrada de la piscina» de la Unidad 50, «su entrada del cine» de la Unidad 52 y «su entrada del museo» de la Unidad 53.
    target_text: تکت‌تان (su boleto) / چند (cuánto)
  prs.a1.unit54.lesson06.teach.your_ticket_question_phrase:
    title: ¿Cuánto cuesta su entrada?
    gloss: ¿Cuánto cuesta su entrada?
    note: Esta es la forma formal, con sufijo, para preguntar el precio de una entrada de concierto.
