    gloss: muchas gracias / de nada
    note: Son palabras de repaso para cerrar el diálogo.
    target_text: تشکر زیاد (muchas gracias) / خواهش می‌کنم (de nada)
  prs.a1.unit54.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hola. Quiero una entrada para el concierto.'
    gloss: Hola. Quiero una entrada para el concierto.
  prs.a1.unit54.lesson04.teach.dialogue_line2:
    title: 'Empleado: Hola, bienvenido. El concierto de Sima empieza a las ocho de la noche.'
    gloss: Hola, bienvenido. El concierto de Sima empieza a las ocho de la noche.
