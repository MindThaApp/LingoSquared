teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Repaso: esto, es, en, bueno'
    gloss: esto / es / en / bueno
    note: Son palabras de repaso (usadas a lo largo de este curso) para hablar del concierto.
    target_text: این (esto / este) / است (es) / در (en) / خوب (bueno)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Concierto
    gloss: concierto
    note: Es una palabra estándar del dari moderno para «concierto», un préstamo, igual que *موزیم* (museo).
    example_gloss: Este concierto es bueno.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Cantante
    gloss: cantante
    note: Es la palabra sencilla y común del dari moderno para «cantante». También existe una alternativa más clásica, *آوازخوان*, pero se usa menos en el habla cotidiana.
    example_gloss: El cantante está en el concierto.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Esto es un concierto
    gloss: Esto es un concierto.
    note: Une «esto», «es» y «concierto» igual que el curso ya une estas palabras en otras partes.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: El cantante está en el concierto
    gloss: El cantante está en el concierto.
    note: Une «cantante», «en» y «concierto».
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Repaso: cuánto, afgani, es, treinta, hora, ocho, noche, ocurre, en, entrada'
    gloss: cuánto / afgani / es / treinta / hora / ocho / noche / ocurre / en / entrada
    note: Son palabras de repaso (de unidades anteriores) para hablar de la hora de inicio y del precio del concierto.
    target_text: چند (cuánto) / افغانی (afgani) / است (es) / سی (treinta) / ساعت (hora / en punto) / هشت (ocho) / شب (noche) / می‌شود (se vuelve / son) / در (en) / تکت (boleto)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Inicio
    gloss: inicio
    note: Se combina con *می‌شود* (ocurre) para decir «empieza», con el mismo patrón de verbo ligero que el curso ya usa en otras partes.
    example_gloss: El concierto empieza a las ocho de la noche.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima es un nombre de pila afgano común, usado aquí para la cantante del concierto.
    example_gloss: Sima es cantante.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Lectura del cartel del concierto
    gloss: Sima es cantante. El concierto empieza a las ocho de la noche. La entrada cuesta 30 afganis.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Repaso: cuándo'
    gloss: cuándo
    note: Es una palabra de repaso para preguntar cuándo empieza el concierto.
    target_text: کی (cuándo)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: ¿Cuándo empieza el concierto?
    gloss: ¿Cuándo empieza el concierto?
    note: Combina las palabras aprendidas antes en esta lección.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: El concierto empieza a las ocho de la noche
    gloss: El concierto empieza a las ocho de la noche.
    note: Indica la hora de inicio del concierto según el cartel.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Repaso: ¿quiere usted? (formal), viernes, vamos'
    gloss: ¿quiere usted? (formal) / viernes / vamos
    note: Son palabras de repaso para proponer un plan, con la misma estructura que el curso ya presentó para proponer una salida al parque.
    target_text: می‌خواهین (usted quiere) / جمعه (viernes) / برویم (vayamos)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Repaso: concierto'
    gloss: concierto
    note: Es una palabra de repaso para proponer ir al concierto.
    target_text: کنسرت (concierto)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: ¿Quiere ir al concierto el viernes?
    gloss: ¿Quiere ir al concierto el viernes?
    note: Reutiliza la estructura para proponer planes que el curso ya presentó, aplicada al concierto.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Repaso: sí, genial, de acuerdo'
    gloss: sí / genial / de acuerdo
    note: Son palabras de repaso para aceptar un plan.
    target_text: بلی (sí) / عالی (genial) / قبول (de acuerdo)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: ¡Sí, genial! De acuerdo.
    gloss: ¡Sí, genial! De acuerdo.
    note: Acepta el plan propuesto del concierto.
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: 'Repaso: hola, un/una, entrada, quiero'
    gloss: hola / un/una / entrada / quiero
    note: Son palabras de repaso para abrir el diálogo.
    target_text: سلام (hola) / یک (uno / un) / تکت (boleto) / می‌خواهم (quiero)
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
    title: 'Repaso: aquí tiene, concierto, Sima, hora, ocho, noche, empieza'
    gloss: aquí tiene / concierto / Sima / hora / ocho / noche / empieza
    note: Son palabras de repaso para indicar la hora de inicio del concierto.
    target_text: بفرمایین (aquí tiene) / کنسرت (concierto) / سیما (Sima) / ساعت (hora / en punto) / هشت (ocho) / شب (noche) / شروع می‌شود (empieza)
  prs.a1.unit54.lesson04.teach.review_ask_price:
    title: 'Repaso: cuánto, afgani, es'
    gloss: cuánto / afgani / es
    note: Son palabras de repaso para preguntar e indicar el precio de la entrada.
    target_text: چند (cuánto) / افغانی (afgani) / است (es)
  prs.a1.unit54.lesson04.teach.review_thanks_welcome:
