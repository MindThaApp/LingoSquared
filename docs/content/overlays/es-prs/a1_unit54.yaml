    gloss: ¿Cuánto cuesta el billete?
  prs.a1.unit54.lesson04.teach.dialogue_line4:
    title: 'Empleado: La entrada cuesta 30 afganis.'
    gloss: La entrada cuesta 30 afganis.
  prs.a1.unit54.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Muchas gracias.'
    gloss: Muchas gracias.
  prs.a1.unit54.lesson04.teach.dialogue_line6:
    title: 'Empleado: De nada.'
    gloss: De nada.
