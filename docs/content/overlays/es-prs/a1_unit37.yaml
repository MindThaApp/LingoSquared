teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Amable
    gloss: amable
    note: مهربان es la palabra habitual en dari para una persona amable y de buen corazón.
    example_gloss: Él/Ella es amable.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Trabajador
    gloss: trabajador, esforzado
    note: 'زحمتکش significa literalmente «el que se toma molestias o esfuerzo»: una persona trabajadora.'
    example_gloss: Él/Ella es trabajador/a.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Inteligente
    gloss: inteligente / listo
    note: 'باهوش une با (con) y هوش (inteligencia): una persona lista o inteligente.'
    example_gloss: Él/Ella es inteligente.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Perezoso
    gloss: perezoso
    note: تنبل significa perezoso.
    example_gloss: Él/Ella es perezoso/a.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Repaso: él/ella, es, y, pero'
    gloss: él/ella / es / y / pero
    note: او, است, و y اما son formas ya vistas que se usan en todas las oraciones de personalidad de esta unidad.
    target_text: او (él/ella) / است (es, está) / و (y) / اما (pero)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Él/Ella es amable y trabajador/a
    gloss: Él/Ella es amable y trabajador/a.
    note: و une los dos rasgos en una sola oración.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Él/Ella es inteligente, pero perezoso/a
    gloss: Él/Ella es inteligente, pero perezoso/a.
    note: اما contrapone dos rasgos en una misma oración.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Gracioso
    gloss: gracioso / bromista
    note: شوخ describe a alguien que bromea o es juguetón.
    example_gloss: Él/Ella es gracioso/a.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Callado
    gloss: callado / reservado
    note: 'کم‌حرف significa literalmente «de pocas palabras»: una persona callada y reservada.'
    example_gloss: Él/Ella es callado/a.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Sincero
    gloss: sincero/a
    note: 'راستگو une راست (verdadero, recto) y گو (que habla): una persona que dice la verdad, sincera.'
    example_gloss: Es sincero/a.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Repaso: y, pero'
    gloss: y / pero
    note: و (y) y اما (pero) son palabras de repaso que sirven para unir o contrastar rasgos de carácter.
    target_text: و (y) / اما (pero)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Es gracioso/a y sincero/a
    gloss: Es gracioso/a y sincero/a.
    note: Une dos rasgos positivos con و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Es callado/a, pero amable
    gloss: Es callado/a, pero amable.
    note: اما contrasta un rasgo reservado con uno cálido.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Persona
    gloss: persona
    note: آدم es una palabra común y neutra en cuanto al género para referirse a una persona o ser humano.
    example_gloss: Es una buena persona.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Repaso: cómo/qué tipo de, porque, ayuda'
    gloss: cómo, qué tipo de / porque / ayuda
    note: چطور, چون y کمک son formas de repaso que sirven para preguntar por la personalidad y explicarla.
    target_text: چطور (cómo, de qué manera) / چون (porque) / کمک (ayuda)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: ¿Qué tipo de persona es?
    gloss: ¿Qué tipo de persona es?
    note: او چطور آدم است؟ pregunta literalmente «él/ella es qué tipo de persona»; es la forma natural de preguntar cómo es alguien.
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Es amable, porque ayuda
    gloss: Es amable, porque ayuda.
    note: چون introduce la razón; کمک می‌کند significa literalmente «hace ayuda».
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Es trabajador/a, porque trabaja mucho
    gloss: Es trabajador/a, porque trabaja mucho.
    note: زیاد کار می‌کند significa literalmente «hace mucho trabajo».
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Sí / un poco / siempre
    gloss: sí / un poco / siempre
    note: بلی, کمی y همیشه son palabras de repaso que se usan en el diálogo sobre la personalidad.
    target_text: بلی (sí) / کمی (un poco) / همیشه (siempre)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿cómo es Karim?'
    gloss: Zarmina, ¿cómo es Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Karim es amable y trabajador.'
    gloss: Karim es amable y trabajador.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¿Es inteligente?'
    gloss: ¿Es inteligente?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sí, es inteligente, pero un poco callado.'
    gloss: Sí, es inteligente, pero un poco callado.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun: ¿Es sincero?'
    gloss: ¿Es sincero?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Sí, siempre es sincero.'
    gloss: Sí, siempre es sincero.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: A veces, todos, marcador de objeto directo, les gusta
    gloss: a veces / todos / marcador de objeto directo / les gusta
    note: گاهی (a veces) y همه (todos) aparecen en la lectura; را marca un complemento directo determinado; دوست دارند es la tercera persona del plural de دوست دارم (me gusta).
    target_text: گاهی (a veces) / همه (todos) / را (marcador de objeto directo) / دوست دارند (les gusta)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Lectura sobre la personalidad de Homayoun
    gloss: Homayoun es amable y trabajador. Es inteligente, pero a veces callado. Siempre es sincero. A todos les cae bien.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Repaso: yo soy, usted es'
    gloss: yo soy / usted es (formal)
    note: استم y استین son las formas de repaso del verbo ser para «yo soy» y «usted es» (formal), y aparecen en las frases de esta lección de repaso.
    target_text: استم (soy, estoy) / استین (usted es, está, formal)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Soy amable, pero a veces perezoso/a
    gloss: Soy amable, pero a veces perezoso/a.
    note: من (yo) y استم (soy) te permiten describir directamente tu propia personalidad, con el mismo patrón de او/است que se usa en toda la unidad.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: ¿Qué tipo de persona es usted?
    gloss: ¿Qué tipo de persona es usted?
    note: Añade شما (usted) y استین (usted es) a la misma pregunta de la lección 3, ahora dirigida directamente a ti.
