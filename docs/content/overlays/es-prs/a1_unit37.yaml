course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: aprende a nombrar rasgos básicos de personalidad, a preguntar cómo es alguien, a dar razones sencillas con «porque» y a describir el carácter de una persona en un texto breve.'
units:
  prs.a1.unit37.personality:
    title: Personalidad
    description: Describe rasgos básicos de personalidad de una persona y pregunta cómo es alguien.
