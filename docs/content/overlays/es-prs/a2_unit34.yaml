    correct_option: Porque me duele la cabeza
    distractors:
    - Porque me dolía la cabeza
    - ¿Por qué me duele la cabeza?
    - Porque estoy cansado
    accepted_answers:
    - value: Porque me duele la cabeza
      status: correct
    feedback: '*چون* significa «porque» y *سردرد دارم* significa «me duele la cabeza».'
  prs.a2.unit34.lesson01.exercise02.recognize_not_go:
    instruction: ¿Qué significa esta frase?
    correct_option: No fui a la oficina porque estaba cansado
    distractors:
    - Fui a la oficina porque estaba cansado
    - No iré a la oficina porque estoy cansado
    - Estaba cansado porque no fui a la oficina
    accepted_answers:
    - value: No fui a la oficina porque estaba cansado
      status: correct
    feedback: '*چون خسته بودم* es la causa (porque estaba cansado) y *به دفتر نرفتم* es lo que ocurrió (no fui a la oficina).'
  prs.a2.unit34.lesson01.exercise03.recognize_cold:
    instruction: ¿Cuál es el motivo en esta frase?
    correct_option: Hace frío
    distractors:
    - Estoy enfermo
    - Estoy ocupado
    - No me gustan los parques
    accepted_answers:
    - value: Hace frío
      status: correct
    feedback: 'La causa va después de *چون*: *هوا سرد است* significa «hace frío».'
