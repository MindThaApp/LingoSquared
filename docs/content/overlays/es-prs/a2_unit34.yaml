course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: dar una razón y una consecuencia en un mismo mensaje. Razones con چون (y زیرا para la lectura), consecuencias con به همین دلیل / برای همین y بنابراین, y به دلیل con un sustantivo, con vocabulario para excusas y cambios de plan.'
units:
  prs.a2.unit34.because_so:
    title: Porque y por eso
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: ¿Por qué? Porque…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: El orden de las cláusulas y «no vine»
  prs.a2.unit34.lesson03.because_of_this:
    title: 'Por eso: به همین دلیل y برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین y زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: Leer y escuchar sobre razones
  prs.a2.unit34.lesson06.change_of_plan:
    title: Una conversación sobre cambiar el plan
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: '*سردرد* significa «dolor de cabeza». Se dice *سردرد دارم* (tengo dolor de cabeza) y *سردرد داشتم* (tuve dolor de cabeza). Es una razón muy común para explicar por qué no puedes hacer algo.'
    example_gloss: Ayer tuve dolor de cabeza.
  prs.a2.unit34.lesson01.teach.tired:
    title: Cansado
    gloss: cansado
    note: '*خسته* significa «cansado/a». Es un adjetivo, así que va con *استم* (estoy) y *بودم* (estaba): *خسته بودم* es «estaba cansado/a».'
    example_gloss: Hoy estoy muy cansado/a.
  prs.a2.unit34.lesson01.teach.busy:
    title: Ocupado
    gloss: ocupado, ocupada
    note: '*مصروف* significa «ocupado». *مصروف بودم* significa «estaba ocupado». Es la razón breve habitual para faltar a una reunión o a una visita.'
    example_gloss: Esta semana estoy ocupado.
  prs.a2.unit34.lesson01.teach.weather:
    title: El tiempo
    gloss: tiempo (clima), aire
    note: '*هوا* es el tiempo atmosférico y también el aire. *هوا خوب است* significa «hace buen tiempo».'
    example_gloss: Hoy hace buen tiempo.
  prs.a2.unit34.lesson01.teach.cold:
    title: Frío
    gloss: frío
    note: '*سرد* significa «frío». *هوا سرد است* significa «hace frío», dicho del tiempo.'
    example_gloss: Por la noche hace frío.
  prs.a2.unit34.lesson01.teach.excuse:
    title: Excusa
    gloss: excusa, motivo alegado
    note: '*عذر* es la razón que das para no hacer algo, una excusa. Una buena *عذر* responde a la pregunta *چرا؟*.'
    example_gloss: Su excusa fue un dolor de cabeza.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Preguntar por qué y responder porque
    gloss: ¿Por qué no fuiste a la oficina? Porque estaba cansado.
    note: '*چرا* pregunta la razón y *چون* la da. La respuesta puede ser una oración completa: *چون خسته بودم* («porque estaba cansado»). En una respuesta corta no se repite el resto de la pregunta. Dentro de la oración con *چون* nada cambia: el verbo queda al final, como en toda oración en dari.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: No fui a la oficina porque estaba enfermo
    gloss: No fui a la oficina porque estaba enfermo.
    note: 'Este es el patrón de la unidad: primero lo que pasó, luego una coma y después *چون* con la razón. Las dos partes también pueden cambiar de lugar: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Marjan y Haroon
    gloss: Marjan y Haroon son amigos.
    note: 'Marjan y Haroon son los dos amigos de esta unidad. Se hablan de *تو*. La terminación *-ند* de *استند* es el plural de *است*: «son».'
  prs.a2.unit34.lesson02.teach.came:
    title: 'Venir: el pasado simple'
    gloss: vine, viniste, vino, vinimos, vinisteis/vino usted (formal o plural), vinieron
    note: 'El pasado de *آمدن* es *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. El lugar al que vienes se indica con *به*: *به جلسه آمدم* significa «vine a la reunión». Las terminaciones son las mismas que en todos los verbos en pasado que ya conoces.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'No vine: ن + یامد'
    gloss: no vine, no viniste, no vino, no vinimos, no vinisteis/no vino usted, no vinieron
    note: 'El negativo de *آمدن* en pasado es *نیامدم* («no vine»). Se pone *ن* delante del verbo: *نـ + آمدم* pasa a *نیامدم*, con una *ی* entre los dos sonidos *ا*. Las demás formas son *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. Con *رفتن* es sencillo: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: Quedarse
    gloss: quedarse, permanecer
    note: '*ماندن* significa «quedarse». El pasado es *ماندم، ماندی، ماندیم* y el presente es *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* significa «me quedé en casa», algo muy habitual cuando hace mal tiempo o estás enfermo.'
    example_gloss: Hoy me quedo en casa.
  prs.a2.unit34.lesson02.teach.either_order:
    title: La razón puede ir primero o después
    gloss: Como hace frío, me quedo en casa. / Me quedo en casa porque hace frío.
    note: 'La oración con *چون* puede ir antes o después de la principal, y el significado es el mismo. Cuando va primero, se pone una coma después: *چون هوا سرد است، در خانه می‌مانم*. En dari el verbo queda al final de cada oración en ambos casos, así que el orden de las palabras dentro de cada una nunca cambia.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: Lo siento, no vine a la reunión
    gloss: Lo siento, no vine a la reunión.
    note: '*متأسفم* significa «lo siento». Suele decirse primero y luego se da la razón con *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Como estaba cansado, me quedé en casa
    gloss: Como estaba cansado, me quedé en casa.
    note: La razón (*خسته بودم*) está en pasado y el resultado (*در خانه ماندم*) también.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: por eso, por esta razón'
    gloss: Estaba ocupado. Por eso no vine.
    note: '*به همین دلیل* introduce el resultado de lo que acabas de decir. Significa «por esa misma razón», «por eso». Abre la segunda oración: primero la razón (*مصروف بودم*) y luego el resultado (*به همین دلیل نیامدم*). Es el reflejo de *چون*: *چون* introduce la razón y *به همین دلیل* introduce el resultado.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: por eso'
    gloss: Hacía frío. Por eso nos quedamos en casa.
    note: '*برای همین* significa lo mismo que *به همین دلیل* y es más corto. Es frecuente en la conversación, mientras que *به همین دلیل* es algo más cuidado. Puedes poner *و* delante de cualquiera de los dos: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Dos maneras de decir lo mismo
    gloss: Como estaba enfermo, no vine. / Estaba enfermo. Por eso no vine.
    note: 'Estas dos frases dicen lo mismo. Con *چون* la razón va al principio o al final dentro de una sola oración. Con *به همین دلیل* tienes dos oraciones: primero la razón y luego el resultado. La razón siempre tiene el mismo significado. Usa un solo conector para cada vínculo: no pongas *چون* y *به همین دلیل* en la misma oración.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: Estaba ocupado. Por eso no vine
    gloss: Estaba ocupado. Por eso no vine.
    note: 'Un mensaje breve para explicar una ausencia: la razón y luego el resultado.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: Hacía frío. Por eso nos quedamos en casa
    gloss: Hacía frío. Por eso nos quedamos en casa.
    note: El mismo patrón con *برای همین*. *ماندیم* significa «nos quedamos».
  prs.a2.unit34.lesson03.teach.car_broken:
    title: Mi coche estaba averiado. Por eso llegué tarde
    gloss: Mi coche estaba averiado. Por eso llegué tarde.
    note: 'El resultado puede ser otro tipo de acción: no solo quedarse en casa, sino también llegar tarde.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + sustantivo: a causa de'
    gloss: a causa de la nieve, a causa de un dolor de cabeza, a causa del trabajo
    note: '*به دلیل* significa «a causa de» y va seguido de un sustantivo, no de una oración completa: *به دلیل برف* («a causa de la nieve»), *به دلیل سردرد* («a causa de un dolor de cabeza»). La oración que sigue es el resultado. *به دلیل برف* cumple la misma función que *چون برف می‌بارید*, con menos palabras. Usa *چون* cuando tienes un verbo y *به دلیل* cuando solo tienes un sustantivo.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: A causa de la nieve, se canceló la reunión
    gloss: A causa de la nieve, se canceló la reunión.
    note: '*لغو شد* significa «se canceló». La expresión con *به دلیل* suele ir al principio y se separa con una coma.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: A causa de un dolor de cabeza, no fui a la oficina
    gloss: A causa de un dolor de cabeza, no fui a la oficina.
    note: 'El mismo patrón con otro sustantivo. También puedes ponerlo al final: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: Cambiar
    gloss: cambiar, modificar
    note: '*تغییر دادن* significa «cambiar algo». Lo que cambias va antes del verbo con *را*: *برنامه را تغییر دادیم* significa «cambiamos el plan». El pasado es *دادم، دادی، دادیم* y el presente es *می‌دهیم*: *برنامه را تغییر می‌دهیم* significa «estamos cambiando el plan».'
    example_gloss: Cambiamos el plan.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: por lo tanto'
    gloss: La carretera estaba cerrada. Por lo tanto, el autobús no salió.
    note: '*بنابراین* significa «por lo tanto» y abre una oración que da el resultado: primero la razón, luego *بنابراین* y el resultado. Cumple la misma función que *به همین دلیل*, pero es más formal. Lo encontrarás sobre todo en mensajes escritos, avisos e informes. En la conversación se prefiere *برای همین* o *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: porque (en la escritura)'
    gloss: La reunión se canceló porque el director no vino.
    note: '*زیرا* también significa «porque», pero se ve en textos escritos, no al hablar. Suele ir después del resultado y de una coma: primero el resultado, luego *زیرا* y la razón. Cuando hablas o escribes un mensaje a un amigo, usa *چون*. Solo necesitas reconocer *زیرا*.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Palabras de razón y palabras de resultado
    gloss: 'porque, porque (escrito), a causa de: la razón. por esta razón, por eso, por lo tanto: el resultado.'
    note: Clasifica las palabras según su función. *چون*, *زیرا* y *به دلیل* acompañan a la razón. *به همین دلیل*, *برای همین* y *بنابراین* acompañan al resultado. En la conversación usa *چون* y *برای همین*. En un mensaje formal usa *زیرا*, *به دلیل* y *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Reunión (forma enlazada)
    gloss: reunión de ... (forma enlazada)
    note: 'Cuando *جلسه* va seguida de otra palabra que la complementa, un pequeño signo (la hamza sobre la *ه* final) une las dos: *جلسهٔ امروز* significa «la reunión de hoy». En la escritura cotidiana este signo suele omitirse.'
    example_gloss: La reunión de hoy es a las diez.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Niloufar (nombre)
    gloss: Niloufar (nombre de mujer)
    note: '*نیلوفر* es un nombre de mujer. Ella escribe el mensaje que vas a leer.'
    example_gloss: Niloufar trabaja en una oficina.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Marjan le pregunta a Haroon por qué no vino
    gloss: Haroon, ¿por qué no viniste ayer a la reunión?
    note: Marjan pregunta *چرا* con el pasado simple negativo *نیامدی*. Habla con un amigo, por eso usa *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Haroon se explica
    gloss: Lo siento. Tenía dolor de cabeza, así que me quedé en casa.
    note: Haroon se disculpa y da la razón (*سردرد داشتم*) y el resultado (*به همین دلیل در خانه ماندم*) en dos oraciones breves.
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Marjan pregunta por la llamada
    gloss: ¿Por qué no llamaste por teléfono?
    note: '*تیلفون نکردی* significa «no llamaste por teléfono». Pide una razón más con *چرا*.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Haroon da una segunda razón
    gloss: Porque mi teléfono estaba averiado.
    note: 'Una respuesta corta: *چون* y la razón, sin nada más.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Marjan reacciona
    gloss: ¡Qué mal! ¿Ya estás bien?
    note: '*چه بد!* es una reacción amistosa ante una mala noticia. *استی* es la forma familiar de «eres/estás».'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Haroon responde
    gloss: Sí, ya estoy bien.
    note: '*استم* significa «soy/estoy».'
  prs.a2.unit34.lesson05.teach.message:
    title: Un mensaje de Niloufar
    gloss: Hola, Marjan. Lo siento, la reunión de hoy se canceló porque el director no vino a la oficina. A causa de la nieve, la carretera estaba cerrada. Por lo tanto, la reunión es el jueves. Niloufar
    note: 'Un mensaje escrito breve. Usa las palabras de razón propias de la escritura: *زیرا* para la razón, *به دلیل برف* para una causa que es un sustantivo y *بنابراین* para el resultado.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Haroon propone un día
    gloss: Marjan, ¿vamos al parque el miércoles?
    note: 'El presente simple *می‌رویم* con un día de la semana expresa un plan: vamos el miércoles. La pregunta termina con la voz ascendente.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Marjan da una razón
    gloss: El miércoles no, porque va a nevar.
    note: Marjan rechaza con *نه* y da la razón con *چون*. El presente *برف می‌بارد* es también la manera de hablar del tiempo de mañana.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Haroon cambia el plan
    gloss: Entonces cambiamos el plan. ¿Vamos el jueves?
    note: '*پس* significa «entonces». *برنامه را تغییر می‌دهیم* significa «cambiamos el plan».'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Marjan no puede el jueves
    gloss: El jueves tengo una reunión, así que no puedo.
    note: La razón (*جلسه دارم*) y el resultado (*به همین دلیل نمی‌توانم*) en una sola oración, unidos por una coma. *نمی‌توانم* significa «no puedo».
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Haroon elige otro día
    gloss: Bien, entonces iremos el viernes.
    note: '*پس* aquí significa «entonces»: queda decidido.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Marjan está de acuerdo
    gloss: Sí, el viernes está bien.
    note: '*جمعه خوب است* significa «el viernes está bien» y se dice para aceptar un plan.'
exercises:
