  prs.a1.unit17.lesson04.reading_health_advice:
    title: Leer una nota de indicaciones de salud
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Leer un mensaje de salud
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Un diálogo con el médico
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: سردرد es un compuesto de سر (cabeza) y درد (dolor).
    example_gloss: Me duele la cabeza.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Fiebre
    gloss: fiebre
    note: تب significa «fiebre».
    example_gloss: Tengo fiebre.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Dolor de estómago
    gloss: dolor de estómago
    note: دل‌درد es un compuesto de دل (vientre o estómago, en lenguaje coloquial) y درد (dolor).
    example_gloss: Tengo dolor de estómago.
  prs.a1.unit17.lesson01.teach.have_word:
    title: Tengo
    gloss: tengo
    note: دارم es la primera persona del presente del verbo داشتن (tener).
    target_text: دارم (tengo)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Enfermo
    gloss: enfermo
    note: مریض significa «enfermo».
    example_gloss: Estoy enfermo.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Soy / estoy
    gloss: soy / estoy
    note: استم es la primera persona de la cópula en el registro cortés, coherente con el uso de استم/استین en este curso.
    target_text: استم (soy/estoy)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Cómo me siento
    gloss: cómo me siento / mi estado
    note: حالم (حال + م) significa literalmente «mi estado»; حالم خوب نیست significa «no me encuentro bien».
    target_text: حالم (cómo me siento / mi estado)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Bueno
    gloss: bueno
    note: خوب significa «bueno» o «bien».
    example_gloss: No me encuentro bien.
  prs.a1.unit17.lesson02.teach.not_word:
    title: No es / no está
    gloss: no es / no está
    note: 'نیست es la cópula negativa: خوب نیست significa «no es bueno / no está bien».'
    target_text: نیست (no es/no está)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Médico
    gloss: médico
    note: داکتر es la grafía y pronunciación estándar del dari de Afganistán para «médico» (distinta de دکتر en el persa de Irán).
    example_gloss: Quiero un médico.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Medicina
    gloss: medicina
    note: دوا significa «medicina».
    example_gloss: Quiero una medicina.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Quiero
    gloss: quiero
    note: می‌خواهم significa «quiero».
    target_text: می‌خواهم (quiero)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Descanso
    gloss: descansa
    note: استراحت es el sustantivo «descanso»; junto con کنین forma el imperativo «¡Descanse!».
    example_gloss: Descanse.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Haga (cortesía)
    gloss: haga (imperativo formal)
    note: کنین es el imperativo formal de کردن (hacer); استراحت کنین significa literalmente «haga descanso», es decir, «descanse».
    target_text: کنین (haga -- imperativo de cortesía)
  prs.a1.unit17.lesson04.teach.water_word:
    title: Agua
    gloss: agua
    note: آب significa «agua».
    example_gloss: Beba mucha agua.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Mucho
    gloss: mucho
    note: زیاد significa «mucho».
    example_gloss: Beba mucha agua.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Beba (cortesía)
    gloss: beba (imperativo formal)
    note: بنوشین es el imperativo formal de نوشیدن (beber).
    target_text: بنوشین (beba -- imperativo de cortesía)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: Una nota de indicaciones de salud
    gloss: Descanse. Beba mucha agua.
    note: Una nota breve con dos consejos básicos de salud.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Hola
    gloss: hola
    note: سلام significa «hola».
    example_gloss: Hola. Estoy enfermo.
  prs.a1.unit17.lesson05.teach.and_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos elementos u oraciones.
    target_text: و (y)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Un mensaje breve sobre la salud
    gloss: Hola. Estoy enfermo. Tengo dolor de cabeza y fiebre.
    note: Un mensaje breve en primera persona que describe dos síntomas.
  prs.a1.unit17.lesson06.teach.names:
    title: Bashir y el médico
    gloss: Bashir, el médico
    note: Bashir es un personaje recurrente en este curso; al médico se le trata con el título honorífico صاحب.
    example_gloss:
    - Soy Bashir.
    - Soy el médico.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Cómo
    gloss: cómo
    note: چطور significa «cómo».
    target_text: چطور (cómo)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Usted es / está (cortesía)
    gloss: usted es; ustedes son
    note: استین es la segunda persona de la cópula en el registro cortés, coherente con el uso de استم/استین en este curso.
    target_text: استین (usted es/está -- cortesía)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Gracias
    gloss: gracias
    note: تشکر significa «gracias».
    example_gloss: Gracias, doctor.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Señor
    gloss: señor
    note: 'صاحب es un título de respeto que se añade después de un nombre o un cargo: داکتر صاحب significa «doctor», dicho con respeto. Es un uso muy típico de Afganistán.'
    example_gloss: Gracias, doctor.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: El doctor saluda a Bashir
    gloss: Hola. ¿Cómo está usted?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Bashir responde
    gloss: Hola. Estoy enfermo. Tengo dolor de cabeza y fiebre.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: El doctor aconseja
    gloss: Descanse. Beba mucha agua.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Bashir da las gracias al doctor
    gloss: Gracias, doctor.
