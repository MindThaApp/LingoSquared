course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: síntomas básicos (dolor de cabeza, fiebre, dolor de estómago), decir que te encuentras mal, pedir un médico o una medicina, leer una breve nota de indicaciones de salud y un mensaje corto que describe síntomas, y un diálogo con un médico.'
units:
  prs.a1.unit17.health:
    title: La salud
    description: Expresar un problema de salud básico y entender consejos sencillos e inmediatos.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Palabras de síntomas
  prs.a1.unit17.lesson02.feeling_unwell:
