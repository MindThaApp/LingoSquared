course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: hacer peticiones corteses con می‌شود که y لطفاً, ofrecer ayuda, aceptar o rechazar con cortesía y pedir a alguien que no haga algo con el imperativo negativo (نکنین).'
units:
  prs.a2.unit31.polite_requests:
    title: ¿Podría...? Peticiones y ofrecimientos corteses
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: ¿Podría...? Peticiones corteses
  prs.a2.unit31.lesson02.please_and_commands:
    title: Por favor y el imperativo
  prs.a2.unit31.lesson03.offers_and_replies:
    title: Ofrecer ayuda, aceptar y rechazar
  prs.a2.unit31.lesson04.dont:
    title: 'No...: el imperativo negativo'
  prs.a2.unit31.lesson05.reading_and_listening:
    title: Lectura y comprensión oral sobre un vecino
  prs.a2.unit31.lesson06.shop_call:
    title: Una llamada a la tienda
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Vecino
    gloss: vecino
    note: '*همسایه* es un vecino. Los vecinos suelen pedirse pequeños favores, así que es la primera persona a la que harás peticiones corteses.'
    example_gloss: Nuestro vecino es muy amable.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Tendero
    gloss: tendero
    note: '*دوکاندار* es la persona que trabaja en un *دوکان* (tienda). Le pides al *دوکاندار* lo que necesitas y es posible que te ofrezca algo más.'
    example_gloss: El tendero está en la tienda.
  prs.a2.unit31.lesson01.teach.milk:
    title: Leche
    gloss: leche
    note: '*شیر* es la leche. Es algo que se pide a menudo en una tienda, igual que *نان* (pan).'
    example_gloss: Bebo leche todos los días.
  prs.a2.unit31.lesson01.teach.bag:
    title: Bolso
    gloss: bolsa
    note: '*کیسه* es una bolsa, por ejemplo la bolsa en la que el tendero te pone la compra.'
    example_gloss: Compré una bolsa de pan.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'La petición cortés: می‌شود که ...؟'
    gloss: '¿Podría darme un poco de pan? (lit.: ¿Es posible que dé usted un poco de pan?)'
    note: 'Para pedir algo a alguien con cortesía, empieza con *می‌شود که* (¿es posible que...?) y pon el verbo en subjuntivo: *می‌شود که کمی نان بدهین؟* El verbo después de *که* es la misma forma que usas después de *باید*, y termina en *-ین* cuando tratas con cortesía a una sola persona o hablas a varias (*شما*). Una petición es una pregunta, por eso la frase termina con *؟*. Una versión hablada más corta omite *که*: *می‌شود کمی نان بدهین؟*. También puedes pedir con *می‌توانین*: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: El subjuntivo de دادن
    gloss: 'formas del subjuntivo de dar: yo dé, nosotros demos, usted/ustedes (cortés o plural) y ellos que den'
    note: El subjuntivo se forma con *ب* más la raíz del presente más las terminaciones *-م، -ی، -د، -یم، -ین، -ند*. Para *دادن* la raíz es *ده*, así que resulta *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. Para una petición a un vecino o a un tendero necesitas la forma en *-ین*, *بدهین*.
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Peticiones con otros verbos
    gloss: dar, traer, enviar, tomar/conseguir, llevar, decir, hacer
    note: 'Pon el mismo subjuntivo en *-ین* después de *می‌شود که* con cualquier verbo: *بیاورین* (traer), *بفرستین* (enviar), *بگیرین* (conseguir), *ببرین* (llevar algo a un lugar), *بگویین* (decir) y *کنین* (hacer). Los verbos formados con *کردن* usan *کنین* después de la primera palabra: *کمک کنین* (ayudar), *صبر کنین* (esperar), *تیلفون کنین* (llamar por teléfono), *باز کنین* (abrir).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: ¿Podría ayudar?
    gloss: ¿Podría ayudar?
    note: '*می‌شود که کمک کنین؟* es la forma habitual de pedir ayuda a un vecino. Empieza con *ببخشین* (disculpe) si no conoces bien a la persona.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Disculpe, ¿podría darme una bolsa?
    gloss: Disculpe, ¿podría darme una bolsa?
    note: '*ببخشین* es una apertura cortés y no una disculpa de verdad. Después viene la petición: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Sí, claro
    gloss: Sí, claro.
    note: '*بلی، حتماً.* es un sí cortés a una petición. *البته.* (por supuesto) significa lo mismo.'
  prs.a2.unit31.lesson02.teach.table:
    title: Mesa
    gloss: mesa
    note: '*میز* es una mesa. Es algo que quizá necesites ayuda para cargar o mover.'
    example_gloss: La mesa está en la habitación.
  prs.a2.unit31.lesson02.teach.here:
    title: Aquí
    gloss: aquí
    note: '*اینجا* significa aquí, en este lugar. Lo contrario es *آنجا* (allí).'
    example_gloss: La llave está aquí.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: El imperativo cortés con -ین
    gloss: venga, vaya, dé, diga, tome, traiga, haga (a un vecino o a varias personas)
    note: 'Una orden dirigida a *شما* (un vecino, una persona mayor o varias personas) termina en *-ین*: *بیایین* (venga), *بروین* (vaya), *بدهین* (dé), *بگویین* (diga), *بگیرین* (tome), *بیاورین* (traiga), *کنین* (haga). Es la misma forma del subjuntivo que usaste después de *می‌شود که*.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: El imperativo para un amigo (sin terminación)
    gloss: ven, ve, da, di, toma, trae, haz (a un amigo o a un niño)
    note: 'Para un solo amigo o un niño, quita el *-ین*: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. Es la forma simple y por sí sola resulta brusca, así que úsala solo con personas a las que tratas de *تو*. Con un vecino o un tendero usa siempre la forma en *-ین*.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: Cómo se forma el imperativo
    gloss: 'El patrón: b + raíz del presente'
    note: El imperativo es *ب* más la raíz del presente (*رو، ده، گو، گیر*), y se añade *-ین* para *شما*. El verbo *کردن* no lleva *ب* (*کن، کنین*), y *آمدن* da *بیا، بیایین*. *آوردن* es *بیاور* para un amigo y *بیاورین* en la forma cortés.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Espere un poco, por favor
    gloss: Espere un poco, por favor.
    note: '*لطفاً* (por favor) va al principio de una orden y la hace cortés: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Traiga la bolsa, por favor
    gloss: Traiga la bolsa, por favor.
    note: 'El complemento directo va antes del verbo y lleva *را* cuando es algo determinado: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Lleve esta mesa a la habitación, por favor
    gloss: Lleve esta mesa a la habitación, por favor.
    note: '*ببرین* significa llevar algo a un lugar. *به اتاق* indica adónde.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Dos formas de pedir
    gloss: Abra la puerta, por favor. / Disculpe, ¿podría abrir la puerta?
    note: '*لطفاً* más el imperativo es corto y directo, y está bien cuando se espera que la otra persona lo haga, por ejemplo un tendero. *می‌شود که ...؟* es más suave y mejor para un favor a un vecino. Ambas son corteses.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Ofrecer ayuda: el verbo con -م'
    gloss: ¿Te ayudo? ¿Traigo té? ¿Te doy también una bolsa? ¿Te envío también té?
    note: 'Para ofrecer algo, haz una pregunta con la forma de *من* del subjuntivo: *کنم* (que haga), *بیاورم* (que traiga), *بدهم* (que dé), *بفرستم* (que envíe). *کمک کنم؟* significa «¿ayudo?». Puedes añadir *هم* (también): *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: ¿Quiere que le ayude?
    gloss: ¿Quiere que le ayude?
    note: '*می‌خواهین که ...؟* es otra forma de ofrecer. Pregunta si la otra persona lo desea, y el verbo después de *که* va de nuevo en la forma con *-م*.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: ¿Ofrecimiento o petición?
    gloss: ¿Traigo té? / Traiga té, por favor.
    note: 'La terminación indica quién realiza la acción. *بیاورم* (que yo traiga) es un ofrecimiento: lo hago yo por usted. *بیاورین* (traiga usted) es una petición: lo hace usted por mí. Así, *کیسه هم بدهم؟* es el tendero que ofrece y *کیسه بدهین* es el cliente que pide.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Azúcar
    gloss: azúcar
    note: '*قند* es el azúcar. En Afganistán se bebe el té con o sin *قند*.'
    example_gloss: El té con azúcar está bueno.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Amabilidad
    gloss: amabilidad, favor
    note: '*لطف* es la amabilidad. *لطف می‌کنین* es un agradecimiento cortés: usted es muy amable.'
    example_gloss: Gracias por su amabilidad.
  prs.a2.unit31.lesson03.teach.self:
    title: Yo mismo
    gloss: yo mismo, por mí mismo
    note: '*خودم* significa «yo mismo». *خودم می‌کنم* quiere decir «lo haré yo mismo».'
    example_gloss: Haré el trabajo yo mismo.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Sí, por favor
    gloss: Sí, por favor.
    note: Sirve para aceptar un ofrecimiento. Después de *بلی* puedes añadir *تشکر*.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Sí, gracias, es usted muy amable
    gloss: Sí, gracias. Es usted muy amable.
    note: Una forma más cálida de aceptar. *لطف می‌کنین* dice que la otra persona está siendo amable.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: No, gracias
    gloss: No, gracias.
    note: La forma más sencilla de rechazar con cortesía. Añade siempre *تشکر*; un *نه* solo resulta seco.
  prs.a2.unit31.lesson03.teach.no_need:
    title: No hace falta
    gloss: No hace falta.
    note: '*لازم نیست* significa «no es necesario». Úsalo para rechazar un ofrecimiento con amabilidad. Puedes decir *نه، تشکر. لازم نیست.* o *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'No...: el imperativo negativo con نـ'
    gloss: no haga, no vaya, no diga, no dé, no tome, no venga
    note: 'Para decir «no», pon *نـ* en el imperativo en lugar de *بـ*: *بروین* pasa a *نروین*, *بگویین* a *نگویین*, *بدهین* a *ندهین*, *بگیرین* a *نگیرین*. *کنین* no lleva *بـ*, así que simplemente recibe *نـ* delante: *نکنین*. *بیایین* es el que hay que recordar: pasa a *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: El imperativo negativo para un amigo
    gloss: no hagas, no vayas, no digas, no des, no vengas, no tomes
    note: 'Con un amigo se aplica la misma regla sin la terminación: *نکن، نرو، نگو، نده، نیا، نگیر*. Un *نکن* a secas resulta brusco, así que resérvalo para amigos y niños. Con un vecino di siempre *نکنین* y añade *لطفاً*.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'Poner, dejar: بگذارین y نگذارین'
    gloss: pon/deja, ponga/deje (cortés); no pongas/dejes, no ponga/deje (cortés)
    note: '*گذاشتن* es poner o dejar algo en un lugar. *دروازه را باز بگذارین* significa «deje la puerta abierta»; *دروازه را باز نگذارین* significa «no deje la puerta abierta».'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Por favor, no tarde
    gloss: Por favor, no tarde.
    note: '*دیر کردن* es llegar tarde o tardar mucho. *لطفاً دیر نکنین* es un recordatorio cortés antes de que alguien traiga o envíe algo.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: Por favor, no vaya mañana
    gloss: Por favor, no vaya mañana.
    note: '*لطفاً* más un imperativo negativo pide con cortesía que alguien no haga algo.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Por favor, no venga tarde
    gloss: Por favor, no venga tarde.
    note: '*نیایین* es la forma negativa de *بیایین* (venga).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Por favor, no deje el portón abierto
    gloss: Por favor, no deje la puerta abierta.
    note: Una petición típica a un vecino o a un visitante de una tienda.
  prs.a2.unit31.lesson04.teach.park:
    title: Por favor, no deje un coche aquí
    gloss: Por favor, no deje el coche aquí.
    note: 'Otro uso cotidiano de *نگذارین*: por favor, no aparque aquí.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Por favor, no se moleste
    gloss: Por favor, no se moleste.
    note: '*زحمت کشیدن* es tomarse la molestia. Se dice *لطفاً زحمت نکشین* cuando alguien ofrece té o ayuda, para rechazar con cortesía y agradecimiento.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: Es mejor no ir mañana
    gloss: Es mejor que no vaya mañana.
    note: '*بهتر است* (es mejor) es una forma más suave de decir «no». Es un consejo y no una orden.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: Señora
    gloss: Señora
    note: '*خانم* se pone antes del nombre de una mujer como título de cortesía: *خانم رحیمه*.'
    example_gloss: La señora Rahima es nuestra vecina.
  prs.a2.unit31.lesson05.teach.mr:
    title: Señor
    gloss: señor
    note: '*آقای* se pone antes del nombre de un hombre: *آقای مسعود*.'
    example_gloss: El señor Masood está en la tienda.
  prs.a2.unit31.lesson05.teach.flower:
    title: Flor
    gloss: flor
    note: '*گل* es «flor». Añade *‌ها* para el plural y *-م* para «mi»: *گل‌هایم* (mis flores).'
    example_gloss: Mis flores están en la casa.
  prs.a2.unit31.lesson05.teach.water:
    title: Agua
    gloss: agua
    note: '*آب* es «agua». *آب دادن* es «regar» una planta: *به گل‌ها آب بدهین*.'
    example_gloss: Bebo agua.
  prs.a2.unit31.lesson05.teach.not_home:
    title: No estoy en casa hasta el viernes
    gloss: No estoy en casa hasta el viernes.
    note: '*نیستم* significa «no estoy». *تا جمعه* significa «hasta el viernes».'
  prs.a2.unit31.lesson05.teach.may_i:
    title: ¿Puedo...?
    gloss: ¿Puedo dejar la llave con usted?
    note: 'Con la forma en *-م*, *می‌شود که ...؟* sirve para pedir permiso: *می‌شود که کلید را پیش شما بگذارم؟* significa «¿puedo dejarle la llave a usted?». Con la forma en *-ین* es una petición a la otra persona. Compara *می‌شود که کمک کنم؟* (¿puedo ayudar?) con *می‌شود که کمک کنین؟* (¿podría ayudar?).'
  prs.a2.unit31.lesson05.teach.people:
    title: Majida y Shafiq son vecinos
    gloss: Majida y Shafiq son vecinos.
    note: En la lectura siguiente, Majida deja una nota a su vecino Shafiq.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Masood pide ayuda
    gloss: Hola, señora Rahima. Disculpe, ¿podría ayudarme un poco hoy?
    note: Masood empieza con un saludo y *ببخشین*, y luego pide con *می‌شود که* y la forma en *-ین* *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Rahima acepta
    gloss: Hola, señor Masood. Por supuesto. ¿Qué hago?
    note: '*البته* es un sí cortés. *چه کار کنم؟* usa la forma en *-م* para preguntar qué debe hacer.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Masood dice lo que necesita
    gloss: ¿Podría llevar esta mesa a la habitación conmigo?
    note: Una segunda petición, esta vez de algo concreto. *با من* significa «conmigo».
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Rahima acepta
    gloss: Sí, claro.
    note: Una aceptación breve y cordial.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Masood ofrece té
    gloss: Muchas gracias. ¿Le traigo té?
    note: '*خیلی تشکر* significa «muchas gracias». *چای بیاورم؟* es un ofrecimiento con la forma en *-م*.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Rahima rechaza
    gloss: No, gracias. Por favor, no se moleste.
    note: Rahima rechaza con *نه، تشکر* y luego usa el imperativo negativo *نکشین* para decir «no se moleste».
  prs.a2.unit31.lesson05.teach.message:
    title: Una nota para un vecino
    gloss: Hola, señor Shafiq. Mañana voy a Mazar y no estaré en casa hasta el viernes. ¿Puedo dejarle la llave de mi casa? Por favor, riegue mis flores todos los días. Por favor, no deje abierto el portón. Gracias por su amabilidad. Majida
    note: Una nota escrita breve con una petición de permiso, una petición y una petición negativa. Fíjate en que usa los mismos patrones que la conversación.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Farzana llama a la tienda
    gloss: Hola. ¿Podría enviar a nuestra casa dos panes y un cartón de leche?
    note: Farzana llama a la tienda. *الو* es «hola» al teléfono. *بفرستین* es la forma de petición cortés de *فرستادن* (enviar).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: El tendero acepta y pregunta la hora
    gloss: Sí, por supuesto. ¿A qué hora se lo envío?
    note: El tendero acepta y usa la forma en *-م* *بفرستم* para preguntar cuándo.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Farzana dice la hora
    gloss: A las cinco. Por favor, no se retrase.
    note: Farzana responde con la hora y añade un imperativo negativo.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: El tendero lo promete y ofrece té
    gloss: No, no me retrasaré. ¿Le envío también té?
    note: 'Aquí *نه* confirma la petición negativa: «no, no me retrasaré». Después ofrece té.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Farzana rechaza
    gloss: No, gracias. Tengo té.
    note: 'Rechaza y da un motivo: ya tiene té.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: El tendero se despide
    gloss: Muy bien.
    note: Un cierre breve.
  prs.a2.unit31.lesson06.teach.cannot:
    title: Lo siento, ahora no puedo
    gloss: Lo siento, ahora no puedo.
    note: 'Para decir que no a una petición, pide perdón con *متأسفم* o *ببخشین* y di después el motivo o el momento: *متأسفم، فردا نمی‌توانم.*'
  prs.a2.unit31.lesson06.teach.summary:
    title: Todo el sistema
    gloss: Petición, orden cortés, orden negativa, ofrecimiento
    note: 'Una petición: *می‌شود که ... بدهین؟* o *لطفاً ... بدهین*. Una petición de no hacer algo: *لطفاً ... نکنین*. Un ofrecimiento: *... بدهم؟* o *می‌خواهین که ... کنم؟*. Respuestas: *بلی، لطفاً.* o *نه، تشکر.* Un rechazo a una petición: *متأسفم، نمی‌توانم.*'
exercises:
  prs.a2.unit31.lesson01.exercise01.recognize_bread:
    instruction: ¿Qué significa esta frase?
    correct_option: ¿Podría darme un poco de pan?
    distractors:
    - Te di un poco de pan
    - El pan está sobre la mesa
    - Quiero mucho pan
    accepted_answers:
