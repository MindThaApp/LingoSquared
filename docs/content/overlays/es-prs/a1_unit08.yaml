teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Pan
    gloss: pan
    note: نان es un alimento básico en todas las comidas afganas.
    example_gloss: El pan está fresco.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Pilaf de arroz
    gloss: pilaf de arroz
    note: پلو es el plato afgano de arroz, con un sazonado particular y a menudo cocinado con carne, zanahorias o pasas; no es simplemente arroz blanco.
    example_gloss: El pilaf de arroz está delicioso.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Guiso de carne y verduras
    gloss: guiso de carne y verduras
    note: قورمه es un término general para un guiso cocinado de carne y verduras, que suele servirse sobre پلو.
    example_gloss: Como el guiso con pilaf de arroz.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Té (repaso)
    gloss: té
    note: چای es la bebida que se ofrece por defecto en casi cualquier lugar de Afganistán.
    example_gloss: Un té, por favor.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Agua
    gloss: agua
    note: آب es la palabra habitual para decir «agua».
    example_gloss: Un agua, por favor.
  prs.a1.unit08.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra de enlace habitual para unir una lista de alimentos.
    target_text: و (y)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Pedir té con cortesía
    gloss: Quisiera un té.
    note: یک چای می‌خواهم es una forma neutra y cortés de pedir, que usa directamente می‌خواهم (quiero) en lugar de una construcción más indirecta.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Por favor
    gloss: por favor
    note: Puedes añadir لطفاً para suavizar casi cualquier petición.
    example_gloss: Ayuda, por favor.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Pide pan con cortesía
    gloss: Quisiera una pieza de pan.
    note: El mismo patrón یک [artículo] می‌خواهم sirve para cualquier sustantivo de comida o bebida.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Preguntar qué hay
    gloss: ¿Qué tienen?
    note: چی دارین؟ es la forma natural de preguntar a un tendero o a un camarero qué comida hay.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Responde con lo que hay disponible
    gloss: Tenemos arroz pilaf y estofado.
    note: پلو و قورمه داریم usa داریم (tenemos), la forma de «nosotros» de دارم. El tendero habla en plural porque lo hace en nombre de toda la tienda.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Fresco
    gloss: fresco
    note: تازه describe la comida recién preparada.
    example_gloss: Este pan está fresco.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Un plato de arroz pilaf
    gloss: un plato de arroz pilaf
    note: بشقاب (plato) es la palabra de medida para la comida que se sirve en un plato.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Dos panes
    gloss: dos panes
    note: تا es la palabra contadora general que se coloca después del número con la mayoría de los elementos contables; aquí, dos piezas de pan.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Combina un pedido completo
    gloss: Un plato de arroz pilaf y dos panes, por favor.
    note: Puedes unir varias cantidades con و (y) en un mismo pedido.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: La cuenta
    gloss: la cuenta
    note: بل (del inglés «bill») es la palabra cotidiana en Afganistán para la cuenta del restaurante.
    example_gloss: La cuenta, por favor.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Pregunta cuánto es la cuenta
    gloss: ¿Cuánto es la cuenta?
    note: بل چند می‌شه؟ pregunta literalmente «la cuenta resulta cuánto», la forma cotidiana y natural de pedir el total. می‌شه es la forma hablada de می‌شود; es la que oirás en una tienda, mientras que en la escritura se usa می‌شود.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Di que la comida estaba deliciosa
    gloss: Estaba muy rico.
    note: خیلی خوش‌مزه بود es un cumplido natural después de una comida.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Casa de té
    gloss: casa de té / restaurante sencillo
    note: چایخانه es un tipo corriente de local sencillo en Afganistán, sobre todo en Kabul, donde se sirven té y comidas básicas.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Bienvenido (repaso)
    gloss: bienvenido
    note: خوش آمدین se presentó en la unidad de saludos; aquí lo usa un tendero como saludo.
  prs.a1.unit08.lesson06.teach.turn01:
    title: El tendero saluda al cliente
    gloss: El tendero da la bienvenida al cliente y le pregunta qué desea.
    note: چی میل دارین؟ es una pregunta de apertura cortés, parecida en su función a چی دارین؟, pero centrada en lo que desea el cliente.
  prs.a1.unit08.lesson06.teach.turn02:
    title: El cliente pregunta qué hay
    gloss: El cliente saluda al tendero y le pregunta qué tiene.
    note: چی دارین؟ abre el intercambio del pedido, de la lección 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: El tendero enumera lo que hay
    gloss: El tendero dice que tienen arroz pilaf y estofado, ambos frescos.
    note: هردو (ambos) confirma que los dos platos mencionados son frescos.
  prs.a1.unit08.lesson06.teach.turn04:
    title: El cliente hace un pedido completo
    gloss: El cliente acepta y pide un plato de arroz pilaf con estofado y un té.
    note: Combina el patrón de cantidad de la lección 4 con el vocabulario de comida de la lección 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: El tendero confirma el pedido
    gloss: El tendero dice que lo traerá enseguida.
    note: چشم, literalmente «sobre mi ojo», es una manera respetuosa de decir «por supuesto». می‌آرم es la forma hablada de می‌آورم (traigo), y همین حالا significa «ahora mismo».
  prs.a1.unit08.lesson06.teach.turn06:
    title: El cliente elogia la comida y pide la cuenta
    gloss: El cliente dice que estaba delicioso y pide la cuenta.
    note: Las dos frases reutilizan directamente el vocabulario de la lección 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: El tendero dice el total
    gloss: El tendero da las gracias y dice que son doscientos afganis.
    note: افغانی es la moneda de Afganistán; دوصد (doscientos) se combina con el nombre de la moneda para indicar un precio.
