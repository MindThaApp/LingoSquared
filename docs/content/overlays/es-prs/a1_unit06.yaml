teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Recto
    gloss: recto
    note: مستقیم indica que se avanza todo recto.
    example_gloss: Vaya todo recto.
  prs.a1.unit06.lesson01.teach.left:
    title: Izquierda
    gloss: izquierda
    note: چپ es la dirección izquierda.
    example_gloss: Gira a la izquierda.
  prs.a1.unit06.lesson01.teach.right:
    title: Derecha
    gloss: derecha
    note: راست es la dirección derecha.
    example_gloss: Gira a la derecha.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Gire (imperativo de cortesía)
    gloss: girar
    note: بپیچین es el imperativo de cortesía del verbo «girar», que se usa al dar indicaciones a alguien.
    example_gloss: Gira a la derecha.
  prs.a1.unit06.lesson01.teach.to_word:
    title: A / hacia
    gloss: a / hacia
    note: به se combina con una palabra de dirección, como en به چپ (a la izquierda).
    target_text: به (a/hacia)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Decir a alguien que vaya recto
    gloss: Sigue todo recto.
    note: مستقیم بروین es la indicación básica de dirección, en imperativo de cortesía.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Decir a alguien que gire a la izquierda
    gloss: Gira a la izquierda.
    note: به چپ بپیچین significa literalmente «gire a la izquierda».
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Decir a alguien que gire a la derecha
    gloss: Gira a la derecha.
    note: به راست بپیچین sigue el mismo patrón, con راست en lugar de چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Primero
    gloss: primero
    note: اول marca el primer paso en una serie de indicaciones.
    example_gloss: Primero vaya recto.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Luego
    gloss: entonces
    note: بعد marca el paso siguiente al primero.
    example_gloss: Luego gira a la izquierda.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Combinar dos pasos de dirección
    gloss: Primero vaya recto, después gire a la derecha.
    note: اول y بعد permiten encadenar varios pasos de dirección en una sola indicación.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Preguntar con cortesía cómo llegar a un lugar
    gloss: ¿Podría decirme cómo llegar al mercado?
    note: می‌توانین بگویین...؟ es una forma cortés de preguntar «¿podría decirme...?» y sirve para pedir indicaciones a un desconocido. بروم significa «voy», así que toda la frase pregunta cómo puedo llegar allí.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Preguntar dónde está un lugar (repaso)
    gloss: Disculpe, ¿dónde está la farmacia?
    note: ببخشین، [lugar] کجاست؟ se presentó en la unidad de lugares; es una forma natural de empezar antes de pedir indicaciones.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Confirmar que has entendido
    gloss: Muchas gracias, entendí.
    note: تشکر زیاد، فهمیدم cierra la conversación con cortesía y confirma que las indicaciones quedaron claras.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Oficina (repaso)
    gloss: oficina
    note: دفتر ya se presentó en una unidad anterior; aquí se usa como destino para practicar el patrón cortés de pedir indicaciones.
    example_gloss: La oficina está cerca.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Después de
    gloss: después de
    note: بعد از señala un punto de referencia que se encuentra antes del destino.
    example_gloss: Después de la mezquita está el banco.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Frente a / enfrente de
    gloss: frente a / enfrente de
    note: روبه‌رو es un nuevo sinónimo de مقابل (enfrente), que se presentó en la unidad de lugares; ambos se usan para decir «enfrente» en el dari cotidiano.
    example_gloss: El banco está enfrente de la mezquita.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Dar una indicación con un punto de referencia
    gloss: Después de la mezquita, el banco queda frente a usted.
    note: بعد از مسجد، بانک روبه‌روی شماست combina un punto de referencia (بعد از مسجد) con una ubicación relativa (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: Escuela (repaso)
    gloss: escuela
    note: مکتب se presentó en la unidad de lugares; aquí se usa como punto de referencia en la frase de práctica.
    example_gloss: La escuela está cerca.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila pide indicaciones
    gloss: Sohaila le pregunta con cortesía a un tendero cómo llegar a la farmacia.
    note: ببخشین abre la pregunta con respeto, y می‌توانین بگویین؟ es la frase cortés para pedir indicaciones de la lección 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: El tendero da el primer paso
    gloss: El tendero responde que sí y dice que primero vaya recto.
    note: اول مستقیم بروین comienza la serie de indicaciones.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila confirma y pregunta qué sigue
    gloss: Sohaila repite «recto» para confirmar y luego pregunta qué viene después.
    note: بعد چطور؟ es una forma natural y breve de pedir el paso siguiente.
  prs.a1.unit06.lesson06.teach.turn04:
    title: El tendero da el segundo paso y el punto de referencia
    gloss: El tendero dice que gire a la izquierda y luego ubica la farmacia con la mezquita y el banco como referencias.
    note: Aquí se combina la indicación de giro de la lección 2 con el patrón de puntos de referencia de la lección 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila le da las gracias y confirma que entendió
    gloss: Sohaila le da las gracias y dice que entendió.
    note: تشکر زیاد، فهمیدم cierra la conversación, como se vio en la lección 4.
  prs.a1.unit06.lesson06.teach.turn06:
    title: La respuesta modesta del tendero y su despedida
    gloss: El tendero resta importancia al agradecimiento y le desea buen viaje.
    note: قابلی نداره se presentó en la unidad de lugares; سفر خوش («buen viaje») es una despedida natural para alguien que va a salir a pie.
