course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: decir y preguntar lo que has hecho o nunca has hecho. El pretérito perfecto (participio más la cópula corta) en su forma escrita رفته‌ام y en su forma hablada de Kabul رفتیم, la negación y el contraste con el pasado simple.'
units:
  prs.a2.unit25.have_you_ever:
    title: ¿Alguna vez has...?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Palabras de experiencia y la forma رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: Más participios y las formas habladas
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: La negación, y el pretérito perfecto frente al pasado simple
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Alguna vez, nunca, ya y todavía no
  prs.a2.unit25.lesson05.reading_and_listening:
    title: Lectura y comprensión oral sobre experiencias
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: Una conversación sobre experiencias
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: Hasta ahora, alguna vez
    gloss: hasta ahora, hasta el momento, alguna vez
    note: '*تا حال* significa «hasta ahora». En una pregunta se refiere a toda tu vida hasta hoy: *آیا تا حال به هرات رفته‌ای؟* es «¿Has estado alguna vez en Herat?». *آیا* introduce una pregunta de sí o no.'
    example_gloss: ¿Has estado alguna vez en Herat?
  prs.a2.unit25.lesson01.teach.herat:
    title: Herat
    gloss: Herat
    note: '*هرات* es una gran ciudad del oeste de Afganistán, conocida por su antigua ciudadela y sus mercados.'
    example_gloss: Mi amigo es de Herat.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Mazar-i-Sharif
    gloss: Mazar-i-Sharif
    note: '*مزار شریف* es la gran ciudad del norte de Afganistán, conocida por su santuario de azulejos azules.'
    example_gloss: Mi amigo vive en Mazar-i-Sharif.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Bamiyán
    gloss: Bamiyán
    note: '*بامیان* es un valle de las tierras altas del centro de Afganistán, conocido por sus paisajes de montaña.'
    example_gloss: Mi amigo ha estado en Bamiyán.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Qabili palaw
    gloss: qabili palaw (arroz con carne, zanahorias y pasas)
    note: '*قابلی پلو* es arroz cocinado con carne, zanahorias y pasas, un plato afgano muy querido.'
    example_gloss: El qabili palaw está muy bueno.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Mantu
    gloss: mantu (empanadillas al vapor)
    note: '*منتو* son empanadillas al vapor rellenas de carne y cebolla.'
    example_gloss: Me gusta el mantu.
  prs.a2.unit25.lesson01.teach.plane:
    title: Avión
    gloss: avión
    note: '*طیاره* es la palabra afgana para «avión».'
    example_gloss: El avión llegó a Kabul.
  prs.a2.unit25.lesson01.teach.travel:
    title: Viajar
    gloss: viajar
    note: '*سفر کردن* significa «viajar». El medio de transporte se indica con *با*: *با بس سفر کردن* es «viajar en autobús».'
    example_gloss: Mi amigo viajó en autobús.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: He estado en Herat
    gloss: He estado en Herat.
    note: '*به* significa «a». Esta es la primera oración en pretérito perfecto de la unidad: *رفته‌ام* dice que has estado en algún lugar en algún momento de tu vida, sin decir cuándo.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'El pretérito perfecto, forma escrita: participio más terminación'
    gloss: he estado, has estado, él/ella ha estado, hemos estado, usted/ustedes han estado, ellos han estado
    note: 'El pretérito perfecto expresa lo que has hecho o no has hecho en tu vida hasta ahora, sin decir cuándo. Tiene dos partes. Primero, el participio pasado: toma la raíz del pasado y añade *ه*. La raíz del pasado de *رفتن* (ir) es *رفت*, así que el participio es *رفته*. Después, una terminación corta que concuerda con la persona: *رفته‌ام* (yo he ido), *رفته‌ای* (tú, a un amigo), *رفته است* (él o ella ha ido), *رفته‌ایم* (nosotros), *رفته‌این* (usted o ustedes; también se acepta *رفته‌اید*), *رفته‌اند* (ellos). En la escritura, las terminaciones se unen al participio con un semiespacio. El pronombre (*من، تو، او*) es opcional, porque la terminación ya indica la persona. Esta es la forma escrita formal, la que encontrarás en cartas, noticias y libros.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: El pretérito perfecto, forma hablada de Kabul
    gloss: he estado, has estado, él/ella ha estado, hemos estado, usted/ustedes han estado, ellos han estado
    note: 'En el habla cotidiana de Kabul, el participio y la terminación se contraen en una sola palabra corta, formada a partir de la raíz del pasado: *رفتیم* (yo he ido), *رفتی* (tú, a un amigo), *رفته* (él o ella), *رفتیم* (nosotros), *رفتین* (ustedes), *رفتن* (ellos). La 3.ª persona del singular es simplemente el participio *رفته*. Ten cuidado con la 1.ª persona: el *رفتیم* hablado (yo he ido) no es el pretérito simple *رفتم* (yo fui); termina en *-یم* y se escribe igual que el plural *رفتیم* (nosotros hemos ido). El contexto los distingue: *تا حال، هرگز، هنوز، قبلا* y una pregunta sobre experiencias indican el perfecto (*تا حال رفتیم* = he ido hasta ahora), mientras que un momento concreto como *پارسال* o *دیروز* indica el pretérito simple (*پارسال رفتم*). Las formas escritas unidas (*رفته‌ام*) también se enseñan y este curso acepta ambas en todas las respuestas: usa las formas unidas cuando escribas o hables con formalidad, y las formas contraídas habladas con amigos y familia. La terminación de «ustedes» es *-ین* en ambas: *رفته‌این* y *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'El participio pasado: raíz del pasado más ه'
    gloss: ido, comido, visto, cocinado, hecho
    note: 'Una sola regla forma el participio de casi todos los verbos: parte del infinitivo, quita *ن* para obtener la raíz del pasado y añade *ه*. *رفتن* da *رفت* y luego *رفته* (ido). *خوردن* da *خورد* y *خورده* (comido). *دیدن* da *دید* y *دیده* (visto). *پختن* da *پخت* y *پخته* (cocinado). *کردن* da *کرد* y *کرده* (hecho). El participio no cambia según la persona; solo cambia la terminación que va después.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Las mismas terminaciones, otro verbo: comer'
    gloss: he comido, has comido, él/ella ha comido, hemos comido, usted/ustedes han comido, ellos han comido
    note: 'Las terminaciones que aprendiste con *رفته* sirven para todos los participios: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. En el habla, el mismo participio se contrae: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. Así, para decir que has visto una película puedes escribir *فلم دیده‌ام* o decir *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Formas habladas de los mismos verbos
    gloss: he comido, has comido, él/ella ha comido, ustedes han comido, ellos han comido; he visto, has visto; he cocinado, has cocinado; he hecho, has hecho
    note: 'Las formas habladas funcionan igual con todos los verbos: toma la raíz del pasado y añade la terminación. *خورد* da *خوردیم، خوردی، خورده، خوردین، خوردن*; *دید* da *دیدیم، دیدی*; *پخت* da *پختیم، پختی*; *کرد* da *کردیم، کردی*. Recuerda que el *خوردیم* hablado (he comido) no es el pretérito simple *خوردم* (comí); una palabra como *تا حال* o *هرگز*, o la ausencia de un momento concreto, indica el perfecto.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Película
    gloss: película
    note: '*فلم* es la palabra afgana para «película». Una película se ve con el verbo *دیدن*: *فلم دیدن* es «ver una película».'
    example_gloss: Anoche vi una película.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Kebab
    gloss: kebab, carne a la parrilla
    note: '*کباب* es carne a la parrilla, uno de los platos más comunes que puedes probar en Afganistán.'
    example_gloss: Ayer comí kebab.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: He comido mantu y qabili palaw
    gloss: He comido mantu y qabili palaw.
    note: '*و* significa «y». Un solo participio al final, *خورده‌ام*, sirve para ambos platos.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: He visto Herat
    gloss: He visto Herat.
    note: '*را* va después de algo determinado, como el nombre de una ciudad, que recibe la acción: *هرات را* es la ciudad de Herat. *دیده‌ام* es el participio de *دیدن* más *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: He cocinado qabili palaw
    gloss: He cocinado qabili palaw.
    note: '*پخته‌ام* es el participio de *پختن* (cocinar) más *-ام*. En el habla: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: El año pasado
    gloss: el año pasado
    note: '*پارسال* significa «el año pasado». Una palabra así sitúa el hecho en un momento concreto, por eso el verbo que sigue va en pretérito simple, no en pretérito perfecto.'
    example_gloss: El año pasado fui a Kabul.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Hace dos años
    gloss: hace dos años
    note: '*پیش* después de una expresión de tiempo significa «hace»: *دو سال پیش* es «hace dos años». Es otra palabra de tiempo que exige el pretérito simple.'
    example_gloss: Hace dos años fui a Mazar-i-Sharif.
  prs.a2.unit25.lesson03.teach.never:
    title: Nunca
    gloss: nunca, jamás
    note: '*هرگز* significa «nunca». Va con un verbo negativo, así que la oración sigue negándose con *ن*: *به بامیان هرگز نرفته‌ام* es «Nunca he estado en Bamiyán».'
    example_gloss: Nunca he estado en Bamiyán.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Nunca (otra palabra)
    gloss: nunca, en ningún momento
    note: '*هیچ‌وقت* significa lo mismo que *هرگز* y también exige un verbo negativo: *هیچ‌وقت فلم ندیده‌ام* es «Nunca he visto una película». Es un poco más cotidiana que *هرگز*.'
    example_gloss: Nunca he estado en Bamiyán.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'La negación: ن en el participio'
    gloss: no he estado, no has estado, él/ella no ha estado, no hemos estado, usted/ustedes no han estado, ellos no han estado
    note: 'Para decir que no has hecho algo, pon *ن* delante del participio y conserva las mismas terminaciones: *رفته‌ام* (he ido) pasa a *نرفته‌ام* (no he ido). La serie completa es *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. La *ن* pertenece al participio, nunca a la terminación.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: La negación en la forma hablada
    gloss: no he estado, no has estado, él/ella no ha estado, no hemos estado, usted/ustedes no han estado, ellos no han estado
    note: 'La negación hablada funciona igual: la *ن* se pone en la forma contraída: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. Tanto *نرفته‌ام* como *نرفتیم* son correctas y significan «no he ido». No confundas el *نرفتیم* hablado (no he ido) con la negación del pretérito simple *نرفتم* (no fui): un momento concreto como *دیروز* va con *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: La misma ن con otros verbos
    gloss: no he comido, no he visto, no he cocinado, no he hecho
    note: 'La regla es la misma para todos los verbos: *نخورده‌ام* (no he comido), *ندیده‌ام* (no he visto), *نپخته‌ام* (no he cocinado), *نکرده‌ام* (no he hecho). Con los verbos formados por una palabra más *کردن*, la *ن* va en *کرده*: *سفر نکرده‌ام* (no he viajado), nunca *نسفر کرده‌ام*. En el habla: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: ¿Pretérito perfecto o pretérito simple?
    gloss: El año pasado fui a Herat. / He estado en Herat. / Voy a Herat.
    note: 'Usa el pretérito simple cuando dices cuándo ocurrió algo: *پارسال به هرات رفتم* (el año pasado fui a Herat) o *دو سال پیش رفتم*. Usa el pretérito perfecto cuando no se indica el momento y solo dices que forma parte de tu experiencia: *به هرات رفته‌ام* (he estado en Herat). El presente es otra cosa: *به هرات می‌روم* (voy a Herat). Por eso una palabra de tiempo como *پارسال* o *دیروز* va con *رفتم*, mientras que *تا حال* y *هرگز* van con *رفته‌ام* y *نرفته‌ام*.'
  prs.a2.unit25.lesson04.teach.already:
    title: Ya, antes
    gloss: ya, antes
    note: '*قبلا* significa «antes de ahora» o «ya». Va con un pretérito perfecto afirmativo: *قبلا به هرات رفته‌ام* es «Ya he estado en Herat».'
    example_gloss: Ya he estado en Herat.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Todavía no, aún
    gloss: todavía, aún
    note: '*هنوز* con un pretérito perfecto negativo significa «todavía no»: *هنوز به هرات نرفته‌ام* es «Todavía no he estado en Herat».'
    example_gloss: Todavía no he estado en Herat.
  prs.a2.unit25.lesson04.teach.times:
    title: Una vez, dos veces
    gloss: una vez, dos veces
    note: '*بار* es «vez», una ocasión. *یک بار* es «una vez» y *دو بار* es «dos veces». El número va antes de *بار* y la oración sigue usando el pretérito perfecto.'
    example_gloss:
    - He estado dos veces en Mazar-i-Sharif.
    - He viajado una vez en avión.
  prs.a2.unit25.lesson04.teach.how_many:
    title: ¿Cuántas veces has estado?
    gloss: ¿Cuántas veces has estado en Mazar-i-Sharif?
    note: '*چند* significa «cuántos». *چند بار* pregunta «cuántas veces», y la respuesta es un número más *بار*: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Sí, no
    gloss: sí, no
    note: '*بلی* es «sí» y *نخیر* es el «no» cortés de uso cotidiano. Una respuesta corta repite el participio: *بلی، رفته‌ام* o *نخیر، نرفته‌ام*.'
    example_gloss:
    - Sí, he estado en Herat.
    - No, todavía no he estado en Herat.
  prs.a2.unit25.lesson04.teach.but:
    title: Pero
    gloss: pero
    note: '*ولی* une algo que has hecho con algo que no has hecho: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: He estado en Mazar-i-Sharif, pero no he estado en Herat.
  prs.a2.unit25.lesson04.teach.qa:
    title: Preguntar y responder sobre experiencias
    gloss: ¿Has estado alguna vez en Herat? Sí, he estado. No, nunca he estado.
    note: 'Para preguntar si alguien ha hecho algo alguna vez, usa *آیا* y *تا حال* con el pretérito perfecto: *آیا تا حال به هرات رفته‌ای؟* Con un amigo también puedes usar la forma hablada: *آیا تا حال به هرات رفتی؟* Responde con *بلی* y el participio (*بلی، رفته‌ام*) o con *نخیر* y la negación (*نخیر، تا حال نرفته‌ام*). Puedes añadir cuántas veces: *بلی، دو بار رفته‌ام*. La palabra interrogativa *آیا* se puede omitir al hablar cuando la entonación deja clara la pregunta.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Ya, todavía no, nunca
    gloss: Ya he estado. Todavía no he estado. Nunca he estado.
    note: 'Tres palabras pequeñas responden a la pregunta de si ya has hecho algo. *قبلا رفته‌ام* significa «ya he estado». *هنوز نرفته‌ام* significa «todavía no he estado» e indica que quizá vayas más adelante. *هرگز نرفته‌ام* significa «nunca he estado», sin esa idea. *قبلا* va con un participio afirmativo; *هنوز* y *هرگز* van con un participio negativo. Las tres van antes del participio, normalmente después del lugar: *به هرات هنوز نرفته‌ام*. Las formas habladas funcionan igual: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: También
    gloss: también
    note: '*هم* significa también. Va justo después de aquello que añade: *قابلی پلو هم پخته‌ام* es «también he cocinado qabili palaw».'
    example_gloss: También he cocinado qabili palaw.
  prs.a2.unit25.lesson05.teach.profile:
    title: Zarmina escribe sobre sus experiencias
    gloss: Soy Zarmina. Hasta ahora he estado en Herat y en Mazar-i-Sharif, pero no he estado en Bamiyán. He comido mantu y qabili palaw. También he cocinado qabili palaw. No he viajado en avión.
    note: 'Un breve perfil escrito en la forma escrita formal. Cuatro cosas que ha hecho y dos que no: *به بامیان نرفته‌ام* y *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Homayoun pregunta a Zarmina sobre volar
    gloss: Zarmina, ¿alguna vez has viajado en avión?
    note: Homayoun usa la forma hablada *سفر کردی* con una amiga. La pregunta empieza con *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Zarmina dice que nunca lo ha hecho
    gloss: No, nunca he viajado en avión. ¿Y tú?
    note: '*هرگز* va antes del participio negativo *نکردیم*. *تو چطور؟* es una forma breve de preguntar «¿y tú?».'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: Homayoun responde que una vez
    gloss: Sí, he viajado una vez.
    note: '*بلی* responde «sí» y *یک بار* indica cuántas veces. Se omite el lugar porque está claro por la pregunta.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Zarmina pregunta a Homayoun sobre Mazar-i-Sharif
    gloss: Homayoun, ¿alguna vez has estado en Mazar-i-Sharif?
    note: Zarmina usa la forma hablada *رفتی* con un amigo. La pregunta empieza con *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: Homayoun dice que dos veces y luego que todavía no
    gloss: Sí, he estado dos veces. Pero todavía no he estado en Herat. ¿Y tú?
    note: '*دو بار* indica cuántas veces. *ولی هنوز به هرات نرفتیم* contrapone un lugar al que aún no ha ido con el que ya conoce.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Zarmina habla de Herat y Bamiyán
    gloss: He estado en Herat una vez, pero nunca he estado en Bamiyán.
    note: '*یک بار* es «una vez» y *به بامیان هرگز نرفتیم* es «nunca». *هرگز* va con el participio negativo.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Homayoun pregunta sobre cocinar
    gloss: ¿Alguna vez has cocinado qabili palaw?
    note: Una pregunta de sí o no sobre la experiencia, con *تا حال* y el *پختی* hablado.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Zarmina ya lo ha cocinado
    gloss: Sí, ya lo he cocinado antes. ¿Y tú?
    note: '*قبلا پختیم* es «ya lo he cocinado». Se omite el plato porque los dos hablantes saben cuál es.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Homayoun todavía no lo ha cocinado
    gloss: No, todavía no lo he cocinado. Pero lo he comido.
    note: '*هنوز نپختیم* es «todavía no», con *ن* en el participio. *ولی خوردیم* añade lo que sí ha hecho.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Zarmina reacciona
    gloss: ¡Qué bien!
    note: '*چه خوب!* es una reacción amistosa ante una buena noticia.'
exercises:
  prs.a2.unit25.lesson01.exercise01.recognize_been_herat:
    instruction: ¿Qué significa esta frase?
    correct_option: He estado en Herat
    distractors:
    - Voy a ir a Herat
    - Nunca he estado en Herat
    - Él ha estado en Herat
    accepted_answers:
    - value: He estado en Herat
