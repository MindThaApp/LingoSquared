teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: Síntoma
    gloss: síntoma
    note: '*علامت* es la palabra general para un síntoma o señal de enfermedad.'
    example_gloss: El síntoma de Bashir es dolor de cabeza.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: Duración
    gloss: duración / período de tiempo
    note: '*مدت* pregunta o indica cuánto tiempo ha durado algo.'
    example_gloss: La duración de mi enfermedad es de dos días.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: Grave
    gloss: grave / intenso
    note: '*شدید* describe un síntoma fuerte o grave.'
    example_gloss: Tengo un dolor de cabeza muy fuerte.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: Prueba médica
    gloss: prueba médica / análisis
    note: '*آزمایش* es una prueba médica, por ejemplo un análisis de sangre.'
    example_gloss: El médico quiere un análisis de sangre.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: Receta
    gloss: receta (el papel escrito)
    note: '*نسخه* es el papel escrito de la receta.'
    example_gloss: El médico me escribió una receta.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: Recetar
    gloss: recetar
    note: '*تجویز* es la acción de recetar un medicamento o un tratamiento.'
    example_gloss: El médico recetó un medicamento nuevo.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: «Desde hace ...» con از ... پیش
    gloss: desde hace dos días
    note: '*از ... پیش* -- «desde hace ...» -- se usa para decir cuánto tiempo lleva un síntoma.'
    target_text: از دو روز پیش (desde hace dos días)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: Describir un síntoma fuerte y continuo
    gloss: Tengo un dolor de cabeza muy fuerte que empezó hace dos días.
    note: Combina *شدید* (fuerte) con el patrón de duración *از ... پیش*.
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: Preguntar si hace falta un análisis
    gloss: Para este problema, ¿tengo que hacerme un análisis?
    note: '*آیا* introduce una pregunta de sí o no; *باید* significa «tener que».'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: Decir cómo tomar el medicamento
    gloss: Tengo que tomar este medicamento dos veces al día.
    note: '*روزی دو بار* significa «dos veces al día»; literalmente, «dos veces por día».'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: Confirmación
    gloss: confirmación
    note: '*تاییدی* es una confirmación escrita, por ejemplo de una cita.'
    example_gloss: Llegó la confirmación de mi cita.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: Examen médico / revisión
    gloss: examen médico / revisión
    note: '*معاینه* es el examen físico que hace el médico.'
    example_gloss: El médico hizo una revisión breve.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: Un aviso de confirmación de cita
    gloss: Su cita con el médico es el miércoles a las nueve de la mañana. Por favor, traiga su tazkira (documento de identidad). Si no puede venir, llame con un día de anticipación.
    note: Un aviso oficial breve de una cita, en el registro formal escrito que se enseña en esta unidad.
  prs.a2.unit12.lesson04.teach.turn01:
    title: El médico saluda a بشیر
    gloss: El médico lo saluda y le pregunta qué problema tiene.
    note: '*چطور استین؟* es la pregunta de saludo cortés «¿cómo está usted?».'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر devuelve el saludo y nombra su síntoma
    gloss: Saluda al médico con respeto y dice que tiene un dolor de cabeza muy fuerte.
    note: '*داکتر صاحب* es la forma respetuosa afgana de dirigirse a un médico.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: El médico pregunta desde cuándo
    gloss: El médico pregunta desde cuándo empezó.
    note: '*از کی...؟* pregunta «¿desde cuándo?».'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر responde
    gloss: Desde hace dos días.
    note: Usa el patrón de duración *از ... پیش* («desde hace ...»).
  prs.a2.unit12.lesson04.teach.turn05:
    title: El médico pregunta por la fiebre
    gloss: El médico le pregunta si también tiene fiebre.
    note: '*آیا ... هم ...؟* pregunta «¿también hay...?».'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر confirma que tiene algo de fiebre
    gloss: Sí, tiene un poco de fiebre.
    note: '*یک‌کمی* significa «un poquito».'
  prs.a2.unit12.lesson04.teach.turn07:
    title: El médico da instrucciones
    gloss: Tiene que tomar este medicamento dos veces al día. Si no mejora, que vuelva.
    note: '*اگر بهتر نشدین، دوباره بیایین* -- «si no mejora, vuelva» -- usa el patrón condicional con *اگر* («si»).'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر da las gracias al médico
    gloss: بشیر da las gracias al médico con respeto.
    note: '*داکتر صاحب* vuelve a dirigirse al médico con respeto.'
