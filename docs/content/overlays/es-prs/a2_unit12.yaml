course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: una visita al médico — vocabulario, descripción detallada de un síntoma, lectura de una confirmación de cita y la visita en sí.'
units:
  prs.a2.unit12.doctor:
    title: Ir al médico
lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary:
    title: Palabras para una visita al médico
  prs.a2.unit12.lesson02.describing_a_symptom:
