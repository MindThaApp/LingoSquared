  prs.a1.unit18.lesson06.job_dialogue:
    title: Un diálogo sobre el trabajo de alguien
teaching:
  prs.a1.unit18.lesson01.teach.teacher_word:
    title: Profesora
    gloss: maestro/maestra
    note: معلم significa «maestro» o «profesor».
    example_gloss: Soy profesora.
  prs.a1.unit18.lesson01.teach.engineer_word:
    title: Ingeniero
    gloss: ingeniero
    note: مهندس significa «ingeniero».
    example_gloss: Soy ingeniero.
  prs.a1.unit18.lesson01.teach.doctor_word:
    title: Médico
    gloss: médico
    note: داکتر es la grafía y la pronunciación estándar del dari de Afganistán para «médico».
    example_gloss: Soy médico.
  prs.a1.unit18.lesson01.teach.shopkeeper_word:
    title: Tendero
    gloss: tendero
    note: دوکاندار es el término estándar del dari de Afganistán para «tendero», ya presentado en la unidad de compras de este curso.
    example_gloss: Soy tendero.
  prs.a1.unit18.lesson01.teach.work_word:
    title: Trabajo / empleo
    gloss: trabajo / empleo
    note: کار significa «trabajo» o «empleo».
    example_gloss: Tengo trabajo que hacer.
  prs.a1.unit18.lesson01.teach.am_word:
    title: Soy / estoy
    gloss: soy
    note: استم es la forma cortés de la primera persona del verbo «ser», coherente con el registro استم/استین de este curso.
    target_text: استم (soy/estoy)
  prs.a1.unit18.lesson02.teach.office_word:
    title: Oficina
    gloss: oficina
    note: دفتر significa «oficina».
    example_gloss: Trabajo en una oficina.
  prs.a1.unit18.lesson02.teach.shop_word:
    title: Tienda
    gloss: tienda
    note: دوکان significa «tienda».
    example_gloss: Trabajo en una tienda.
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: Hospital
    gloss: hospital
    note: شفاخانه es el término auténtico del dari de Afganistán para «hospital», ya presentado en la unidad de lugares de este curso.
    example_gloss: Trabajo en un hospital.
  prs.a1.unit18.lesson02.teach.school_word:
    title: Escuela
    gloss: escuela
    note: مکتب es el término auténtico del dari de Afganistán para «escuela», ya presentado en la unidad de lugares de este curso.
    example_gloss: Trabajo en una escuela.
  prs.a1.unit18.lesson02.teach.in_word:
    title: En
    gloss: en
    note: 'در indica el lugar donde ocurre algo: در مکتب significa «en la escuela».'
    target_text: در (en)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: Trabajo
    gloss: hago / trabajo
    note: 'می‌کنم es la primera persona del presente de کردن («hacer»): کار می‌کنم significa literalmente «hago trabajo», es decir, «trabajo».'
    target_text: کار می‌کنم (trabajo)
  prs.a1.unit18.lesson03.teach.where_word:
    title: Dónde
    gloss: dónde
    note: کجا significa «dónde».
    target_text: کجا (dónde)
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: Usted trabaja (cortesía)
    gloss: trabajas
    note: کار می‌کنین significa «trabajas» o «trabaja usted» (forma cortés).
    target_text: کار می‌کنین (usted trabaja -- cortesía)
  prs.a1.unit18.lesson03.teach.and_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o dos elementos.
    target_text: و (y)
  prs.a1.unit18.lesson04.teach.is_word:
    title: Es / está (tercera persona)
    gloss: es
    note: 'است es la tercera persona del verbo «ser»: معلم است significa «es maestro/maestra».'
    target_text: است (es/está -- tercera persona)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: Él/ella trabaja
    gloss: él/ella trabaja
    note: 'می‌کند es la tercera persona del presente de کردن («hacer»): کار می‌کند significa «él/ella trabaja».'
    target_text: کار می‌کند (él/ella trabaja)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: Laila
    gloss: Laila
    note: Nombre de un personaje recurrente en este curso, presentado por primera vez en la unidad de presentaciones.
    example_gloss: Laila es maestra.
  prs.a1.unit18.lesson04.teach.profile_text:
    title: Un breve perfil laboral
    gloss: Laila es maestra. Trabaja en una escuela.
    note: Un breve perfil en tercera persona que indica una ocupación y un lugar de trabajo.
  prs.a1.unit18.lesson05.teach.every_word:
    title: Cada
    gloss: cada
    note: هر significa «cada».
    example_gloss: Trabajo todos los días.
  prs.a1.unit18.lesson05.teach.day_word:
    title: Día
    gloss: día
    note: 'روز significa «día»: هر روز significa «todos los días».'
    example_gloss: Da clases todos los días.
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: Lección / clase
    gloss: lección / clase
    note: درس significa «lección» o «clase».
    example_gloss: Laila da clases.
  prs.a1.unit18.lesson05.teach.gives_word:
    title: Él/ella da
    gloss: él/ella da
    note: 'می‌دهد es la tercera persona del presente de دادن («dar»): درس می‌دهد significa literalmente «da clases», es decir, «enseña».'
    target_text: می‌دهد (él/ella da -- درس می‌دهد significa enseña)
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: Un perfil laboral más largo
    gloss: Laila es maestra. Trabaja en una escuela. Da clases todos los días.
    note: El mismo perfil de la lección anterior, ampliado con una actividad laboral diaria.
  prs.a1.unit18.lesson06.teach.names:
    title: Bashir y Negar
    gloss: Bashir, Negar
    note: Personajes recurrentes en este curso.
    example_gloss:
    - Soy Bashir.
    - Soy Negar.
  prs.a1.unit18.lesson06.teach.you_word:
    title: Usted (cortesía)
    gloss: usted
    note: شما es el pronombre cortés de segunda persona.
    target_text: شما (usted -- cortesía)
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: Qué es
    gloss: qué es
    note: 'چیست significa «qué es»: کار شما چیست؟ significa «¿cuál es su trabajo?».'
    target_text: چیست (qué es)
  prs.a1.unit18.lesson06.teach.yes_word:
    title: Sí
    gloss: sí
    note: بلی es la palabra cortés o formal para «sí», coherente con el registro de este curso.
    example_gloss: Sí, trabajo todos los días.
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: Bashir pregunta
    gloss: ¿A qué se dedica usted?
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: Negar responde
    gloss: Soy médica. Trabajo en un hospital.
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: Bashir pregunta
    gloss: ¿Trabaja usted todos los días?
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: Negar responde
    gloss: Sí, trabajo todos los días.
