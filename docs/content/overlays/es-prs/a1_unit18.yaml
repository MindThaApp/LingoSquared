course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: profesiones básicas (maestro, ingeniero, médico, tendero), lugares de trabajo (oficina, tienda, hospital, escuela), cómo combinar una profesión con un lugar de trabajo, lectura de un perfil laboral breve y otro más largo, y un diálogo para preguntar por el trabajo de alguien.'
units:
  prs.a1.unit18.work:
    title: El trabajo
    description: Indica una ocupación básica, un lugar de trabajo y una actividad laboral sencilla.
