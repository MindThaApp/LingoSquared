teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: 'Repaso: esto, es, en'
    gloss: esto / es / en
    note: Son palabras de repaso (usadas a lo largo del curso) para hablar de la lavandería.
    target_text: این (esto/este) / است (es/está) / در (en)
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: 'Repaso: ropa, tienda, tendero'
    gloss: ropa / tienda / tendero
    note: «Ropa» es una palabra de repaso de la Unidad 21; «tienda» y «tendero» son palabras de repaso de la Unidad 10.
    target_text: لباس (ropa) / دوکان (tienda) / دوکاندار (tendero)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: Lavandería
    gloss: lavandería
    note: Une la palabra de este curso para «ropa» con la raíz del verbo «lavar» y forma la palabra cotidiana en dari para una lavandería o un servicio de lavado.
    example_gloss: Esta es una lavandería.
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: Esta es una lavandería
    gloss: Esta es una lavandería.
    note: Une «esto», «tienda» y «lavandería» igual que este curso ya une dos sustantivos sin una palabra de enlace.
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: El tendero está en la tienda
    gloss: El tendero está en la tienda.
    note: Une «tendero» y «tienda».
  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: 'Repaso: quiero, marca de objeto, para que yo lave'
    gloss: quiero / (marca de objeto) / para que yo lave
    note: «Para que yo lave» es la forma esperada del subjuntivo del verbo «lavar», ya aprendido, y se forma igual que los demás subjuntivos de este curso (para que yo tome, para que yo consiga).
    target_text: می‌خواهم (quiero) / را (marcador de objeto directo) / بشویم (para que lave, subjuntivo de شستن)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: 'Repaso: la ropa'
    gloss: la ropa
    note: Es el plural de «ropa», formado igual que el plural de «manzanas» en este curso.
    target_text: لباس‌ها (la ropa, plural de لباس)
