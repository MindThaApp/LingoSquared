course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: describir paso a paso cómo fue una mañana o un trayecto, incluido un paso que omitiste. Verbos compuestos en pasado simple, su negación en el verbo auxiliar, la posición de را y los conectores اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: Una mañana ajetreada
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Palabras de la mañana y verbos compuestos
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: Más verbos compuestos
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Negar verbos compuestos y dónde va را
  prs.a2.unit22.lesson04.telling_in_order:
    title: Contarlo en orden
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Lectura y comprensión oral: una mañana ocupada'
  prs.a2.unit22.lesson06.morning_conversation:
    title: Una conversación sobre la mañana
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: Esta mañana
    gloss: esta mañana
    note: '*امروز* es hoy y *صبح* es mañana (parte del día). Juntos, *امروز صبح* significa esta mañana, el marco temporal de esta unidad. En una frase en dari, la expresión de tiempo va primero y el verbo, al final.'
    example_gloss: Esta mañana fui a la oficina.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Tarde, temprano
    gloss: tarde, temprano
    note: '*دیر* significa tarde y *زود* significa temprano. Ambos van justo antes del verbo, hacia el final de la frase.'
    example_gloss:
    - Esta mañana me desperté tarde.
    - Hoy se despertó temprano.
  prs.a2.unit22.lesson01.teach.office:
    title: Oficina
    gloss: oficina
    note: '*دفتر* es la oficina, el lugar donde trabajan muchas personas en Kabul por las mañanas entre semana.'
    example_gloss: Por la mañana fui a la oficina.
  prs.a2.unit22.lesson01.teach.school:
    title: Escuela
    gloss: escuela
    note: '*مکتب* es la palabra afgana de uso cotidiano para «escuela». Se usa con *به*, como en *به مکتب رفتم*.'
    example_gloss: Por la mañana fue a la escuela.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: En autobús, en coche
    gloss: en autobús, en coche
    note: '*با* significa con o en (medio de transporte). *با بس* es en autobús y *با موتر* es en coche. *بس* es el autobús y *موتر* es la palabra afgana para «coche».'
    example_gloss:
    - Fui a la oficina en autobús.
    - Fuimos a la escuela en coche.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: A pie
    gloss: a pie, caminando
    note: '*پیاده* significa a pie. *پیاده رفتن* es ir a pie, caminar hasta un lugar, y *پیاده* va justo antes del verbo.'
    example_gloss: Fui a la escuela a pie.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Parada de autobús, estación
    gloss: parada de autobús, parada
    note: '*ایستگاه* es una parada o una estación. *ایستگاه بس* es una parada de autobús.'
    example_gloss: Fui a la parada de autobús.
  prs.a2.unit22.lesson01.teach.gate:
    title: Portón, puerta
    gloss: portón, puerta exterior de una casa
    note: '*دروازه* es el portón o la puerta exterior de una casa. Lo abres cada mañana, así que lo volverás a encontrar con la palabrita *را* en las próximas lecciones.'
    example_gloss: Abrí el portón.
  prs.a2.unit22.lesson01.teach.clothes:
    title: Mi ropa
    gloss: mi ropa
    note: '*لباس* es la ropa (en general), *لباس‌ها* son las prendas de vestir (la terminación del plural *-ها* se une con un pequeño espacio), y *-م* añade «mi»: *لباس‌هایم* es mi ropa.'
    example_gloss: Me puse la ropa.
  prs.a2.unit22.lesson01.teach.shower:
    title: Ducha
    gloss: ducha
    note: '*دوش* es una ducha. En dari no se dice «lavar una ducha»: se «toma», con el verbo *گرفتن*, que verás en la próxima lección.'
    example_gloss: Por la mañana me di una ducha.
  prs.a2.unit22.lesson01.teach.tea:
    title: Té
    gloss: té
    note: '*چای* es el té, la bebida habitual de la mañana. En dari el té se «come», así que el verbo es *خوردن*.'
    example_gloss: Por la mañana tomé té.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: El desayuno
    gloss: el desayuno
    note: '*صبحانه* es el desayuno. En Kabul también oirás *ناشتا* para la misma comida; este curso usa *صبحانه*.'
    example_gloss: De desayuno comí pan y tomé té.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: Despertarse
    gloss: 'despertarse (literalmente: volverse despierto)'
    note: '*بیدار* significa despierto y *شدن* significa volverse. Juntos, *بیدار شدن* es despertarse. Es un verbo compuesto: una palabra que no es verbo (aquí un adjetivo) más un verbo ligero.'
    example_gloss: Esta mañana me desperté.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: Prepararse
    gloss: 'prepararse, estar listo (literalmente: volverse listo)'
    note: '*آماده* significa listo y *شدن* significa volverse. *آماده شدن* es prepararse, un segundo verbo compuesto formado con *شدن*.'
    example_gloss: Esta mañana me preparé.
  prs.a2.unit22.lesson01.teach.open:
    title: Abrir
    gloss: 'abrir (literalmente: hacer abierto)'
    note: '*باز* significa abierto y *کردن* significa hacer. *باز کردن* es abrir. Es un verbo compuesto formado con *کردن*: haces que algo quede abierto.'
    example_gloss: Abrí el portón.
  prs.a2.unit22.lesson01.teach.went_office:
    title: Fui a la oficina
    gloss: Fui a la oficina.
    note: '*رفتم* es el pasado simple de *رفتن* de la unidad 19: raíz de pasado *رفت* más *-م*. *به* es «a», así que *به دفتر رفتم* es «fui a la oficina».'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: Abrí el portón
    gloss: Abrí el portón.
    note: '*را* es una palabrita que marca un objeto concreto, aquí el portón. Por ahora aprende la frase completa. La lección 3 explica exactamente dónde va *را*.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Verbos compuestos en pasado: la terminación va en el verbo ligero'
    gloss: me desperté, te despertaste, se despertó, nos despertamos, se despertaron (usted o ustedes, formal o plural), se despertaron (ellos)
    note: 'Muchos verbos cotidianos en dari son verbos compuestos: un sustantivo o un adjetivo más un verbo ligero como *شدن* o *کردن*. *بیدار شدن* (despertarse), *آماده شدن* (prepararse) y *باز کردن* (abrir) son verbos compuestos. En el pasado simple, la primera parte nunca cambia. Solo el verbo ligero toma la terminación de pasado que ya conoces de *رفتم*: toma el infinitivo, quita *ن* (*شدن* da *شد*) y añade *-م، -ی، nothing، -یم، -ین، -ند*. Así, *بیدار شدم* es «me desperté», *بیدار شدی* es «te despertaste» (a un amigo), *بیدار شد* es «se despertó», *بیدار شدیم* es «nos despertamos», *بیدار شدین* es «os despertasteis» (formal o plural) y *بیدار شدند* es «se despertaron». El pronombre es opcional, porque la terminación ya indica quién realizó la acción.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: Ducharse
    gloss: ducharse
    note: '*دوش گرفتن* es ducharse. El verbo ligero aquí es *گرفتن*, tomar o conseguir. Su raíz de pasado es *گرفت*, así que «me duché» es *دوش گرفتم*.'
    example_gloss: Esta mañana me duché.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: Dar un paseo
    gloss: dar un paseo, pasear
    note: '*قدم* es un paso. *قدم زدن* es dar un paseo, por placer y sin un destino. El verbo ligero es *زدن* y su raíz de pasado es *زد*: *قدم زدم* es «di un paseo». Compáralo con *پیاده رفتن*, ir caminando a un lugar.'
    example_gloss: Di un paseo por el parque.
  prs.a2.unit22.lesson02.teach.talk:
    title: Hablar, conversar
    gloss: hablar, conversar
    note: '*حرف* es una palabra o el habla. *حرف زدن* es hablar, de nuevo con *زدن*: *حرف زدم* es «hablé».'
    example_gloss: Hablé con mi amigo.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: Mi amigo
    gloss: mi amigo
    note: '*دوست* es un amigo y *-م* añade «mi»: *دوستم* es «mi amigo». Pon *به* delante cuando le llamas por teléfono: *به دوستم*.'
    example_gloss: Esta mañana hablé con mi amigo.
  prs.a2.unit22.lesson02.teach.phone:
    title: Llamar por teléfono
    gloss: llamar por teléfono, hacer una llamada
    note: '*تیلفون* es el teléfono. *تیلفون کردن* es llamar por teléfono, otro verbo compuesto con *کردن*. La persona a quien llamas va con *به*: *به دوستم تیلفون کردم*.'
    example_gloss: Llamé a mi amigo por teléfono.
  prs.a2.unit22.lesson02.teach.wait:
    title: Esperar
    gloss: 'esperar (literalmente: tirar de una espera)'
    note: '*انتظار* es la espera. *انتظار کشیدن* es esperar. El verbo ligero es *کشیدن*, tirar o arrastrar, y su raíz de pasado es *کشید*: *انتظار کشیدم* es «esperé».'
    example_gloss: Esperé en la parada.
  prs.a2.unit22.lesson02.teach.get_on:
    title: Subir, subirse
    gloss: subir, subirse (a un autobús, a un coche)
    note: '*سوار* significa montado o a bordo y *شدن* significa volverse. *سوار شدن* es subirse a un autobús o a un coche. Lo que abordas va con *به*: *به بس سوار شدم*.'
    example_gloss: Me subí al autobús.
  prs.a2.unit22.lesson02.teach.get_off:
    title: Bajar, bajarse
    gloss: bajar, bajarse
    note: '*پیاده شدن* es bajarse de un autobús o de un coche. Ojo: *پیاده رفتم* es «fui a pie» y *پیاده شدم* es «me bajé». El vehículo del que bajas va con *از*: *از بس پیاده شدم*.'
    example_gloss: Me bajé del autobús.
  prs.a2.unit22.lesson02.teach.put_on:
    title: Ponerse, vestir
    gloss: ponerse (ropa), vestir
    note: '*پوشیدن* es ponerse ropa. Es un verbo simple, no compuesto: su raíz de pasado es *پوشید*, así que *پوشیدم* es «me puse».'
    example_gloss: Me puse la ropa.
  prs.a2.unit22.lesson02.teach.close:
    title: Cerrar
    gloss: cerrar
    note: '*بستن* es cerrar. Es un verbo simple con la raíz de pasado *بست*, así que *بستم* es «cerré». Es lo contrario de *باز کردن*.'
    example_gloss: Cerré el portón.
  prs.a2.unit22.lesson02.teach.arrive:
    title: Llegar
    gloss: llegar
    note: '*رسیدن* es llegar. El lugar al que llegas va con *به*, y la raíz de pasado es *رسید*: *به دفتر رسیدم* es «llegué a la oficina».'
    example_gloss: Llegué a la oficina.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Cinco verbos ligeros y sus raíces de pasado
    gloss: me desperté, abrí, me duché, di un paseo, esperé
    note: 'Un verbo compuesto recibe su significado de ambas partes, así que aprende juntos el verbo ligero y la primera parte. Estos cinco verbos ligeros forman la mayoría de los verbos compuestos de una mañana. *شدن* (raíz de pasado *شد*) significa volverse: *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) significa hacer: *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) significa tomar: *دوش گرفتم*. *زدن* (*زد*) significa golpear, pero en los compuestos solo transmite la acción: *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) significa tirar o arrastrar: *انتظار کشیدم*. La terminación se añade a la raíz del verbo ligero igual que en *رفتم*. Los verbos simples como *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) y *رسیدن* (*رسیدم*) llevan las mismas terminaciones.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Negar un verbo compuesto: la ن va en el verbo ligero'
    gloss: no me desperté, no te despertaste, no se despertó, no nos despertamos, no se despertaron (usted o ustedes, formal o plural), no se despertaron (ellos)
    note: 'En la unidad 19 pusiste *ن* delante de un verbo simple en pasado: *رفتم* pasó a *نرفتم*. Un verbo compuesto tiene dos partes, y la *ن* va en el verbo ligero, nunca en la primera parte. *بیدار شدم* (me desperté) pasa a *بیدار نشدم* (no me desperté), y las seis formas son *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. La misma regla sirve para todos los verbos ligeros: *نکردم، نگرفتم، نزدم، نکشیدم*. Escribir *نبیدار شدم* es incorrecto. Los verbos simples se comportan como antes: *نپوشیدم، نبستم، نرسیدم*. En el pasado simple negativo sigue sin haber *نمی*.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: La misma ن con cinco verbos ligeros
    gloss: no llamé por teléfono, no di un paseo, no esperé, no me duché, no abrí
    note: 'Mira los cinco verbos ligeros de la lección anterior y ponles *ن*: *کردم* da *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* da *نزدم* (*قدم نزدم*), *کشیدم* da *نکشیدم* (*انتظار نکشیدم*), *گرفتم* da *نگرفتم* (*دوش نگرفتم*). La primera parte se queda donde estaba y el verbo que la sigue es el negativo.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: No desayuné
    gloss: No desayuné.
    note: '*نخوردم* es *ن* más *خوردم*. *خوردن* es un verbo simple, así que la *ن* va delante de todo el verbo. En la unidad 19 viste *خوردی*, «comiste», dicho a un amigo: *صبحانه خوردی؟* es «¿desayunaste?».'
  prs.a2.unit22.lesson03.teach.on_time:
    title: A tiempo
    gloss: a tiempo
    note: '*وقت* es tiempo. *به وقت* es a tiempo. Va antes del verbo, así que *به وقت بیدار نشدم* es «no me desperté a tiempo».'
    example_gloss: Esta mañana no me desperté a tiempo.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: Hacer, preparar
    gloss: 'hacer, preparar (literalmente: hacer correcto)'
    note: '*درست* significa correcto, y *درست کردن* significa hacer o preparar algo, como té o comida. Es un verbo compuesto con *کردن*. El objeto va delante: *چای درست کردم*.'
    example_gloss: Preparé té.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Dónde va را antes de un verbo compuesto
    gloss: Abrí el portón. No abrí el portón. No me puse la ropa. Preparé té.
    note: 'Cuando el objeto del verbo es algo determinado, conocido o concreto (*دروازه*, el portón que abres cada mañana, o *لباس‌هایم*, tu propia ropa), el dari lo marca con *را*. En un verbo compuesto, *را* va justo después del objeto y antes de la primera parte del verbo: *دروازه را باز کردم*, nunca en medio de *باز کردم*. El verbo compuesto se mantiene unido, y la negación sigue la misma regla de antes: *دروازه را باز نکردم*. Cuando el objeto no es concreto, como en *چای درست کردم* (preparé té, algo de té), no se usa *را*.'
  prs.a2.unit22.lesson04.teach.first:
    title: Primero
    gloss: primero
    note: '*اول* abre una secuencia. Va al comienzo de la primera oración.'
    example_gloss: Primero me duché.
  prs.a2.unit22.lesson04.teach.then:
    title: Luego
    gloss: luego, después
    note: '*بعد* continúa la secuencia después de *اول*. Va al comienzo de la oración que introduce.'
    example_gloss: Luego me puse la ropa.
  prs.a2.unit22.lesson04.teach.after_that:
    title: Después de eso
    gloss: después de eso
    note: '*بعد از آن* significa después de eso. Es un *بعد* algo más completo y resulta útil cuando ya usaste *بعد* una vez y tienes un tercer paso.'
    example_gloss: Después de eso cerré el portón.
  prs.a2.unit22.lesson04.teach.finally:
    title: Por último
    gloss: por último, al final
    note: '*در آخر* cierra una secuencia, después de *اول*، *بعد* y *بعد از آن*. *آخر* significa final.'
    example_gloss: Por último llegué a la oficina.
  prs.a2.unit22.lesson04.teach.but:
    title: Pero
    gloss: pero
    note: '*ولی* contrapone un paso que hiciste con otro que no hiciste, o al revés.'
    example_gloss: No desayuné, pero tomé té.
  prs.a2.unit22.lesson04.teach.no:
    title: 'No'
    gloss: 'no'
    note: '*نخیر* es el «no» cortés y cotidiano que se usa para responder a una pregunta de sí o no. Entre amigos también puedes oír el más corto *نی*.'
    example_gloss: No, no llamé por teléfono.
  prs.a2.unit22.lesson04.teach.start_work:
    title: Empezar, comenzar
    gloss: empezar, comenzar
    note: '*شروع* es un comienzo y *شروع کردن* es empezar. Es un verbo compuesto con *کردن*, y *کار* es trabajo: *کار را شروع کردم* es «empecé el trabajo».'
    example_gloss: Empecé a trabajar.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Contar una mañana en orden
    gloss: Primero me di una ducha, luego me vestí, después abrí el portón y por último fui a pie a la oficina.
    note: 'Para contar cómo fue una mañana, da a cada paso terminado su propio verbo en pasado y marca el orden con *اول* (primero), *بعد* (luego), *بعد از آن* (después de eso) y *در آخر* (por último). Los pasos van en el orden en que ocurrieron. Se unen con una coma, un punto o *و*: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* Para añadir un paso que no ocurrió, usa un verbo compuesto en negativo: *بعد از آن تیلفون نکردم.* El conector va al principio de su oración y el verbo se queda al final.'
  prs.a2.unit22.lesson05.teach.way:
    title: Camino, ruta
    gloss: camino, ruta; de camino, en el camino (con در)
    note: '*راه* es el camino o la ruta. *در راه* significa «de camino» o «en el camino». Indica en qué momento del trayecto ocurrió algo.'
    example_gloss: De camino hablamos.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Hacerlo juntos: la terminación de «nosotros» -یم'
    gloss: Fui a pie a la escuela con mi amigo. De camino hablamos. Por fin llegamos a la escuela.
    note: 'Cuando un amigo hace los pasos contigo, cambia la terminación de *-م* a *-یم*: *رفتیم* (fuimos), *حرف زدیم* (hablamos), *رسیدیم* (llegamos). En un verbo compuesto la terminación sigue yendo solo en el verbo ligero: *حرف زدیم*, no *حرف‌یم زد*. El negativo funciona igual: *حرف نزدیم* significa «no hablamos».'
  prs.a2.unit22.lesson05.teach.message:
    title: Soraya escribe sobre su mañana
    gloss: Hoy me desperté temprano. Primero me di una ducha y me vestí. Luego desayuné, pero no preparé té. Después abrí el portón. Fui a pie a la escuela con mi amiga. De camino hablamos. Por fin llegamos a la escuela.
    note: 'Un breve relato escrito, en orden. Cada paso es una acción terminada con un verbo en pasado; los verbos compuestos *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* y el negativo *درست نکردم* mantienen el verbo ligero al final. Un paso no ocurrió: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Naveed le pregunta a Soraya por el té
    gloss: Soraya, ¿preparaste té esta mañana?
    note: 'Naveed pregunta con el pasado de un verbo compuesto, *درست کردی*, en la forma de «tú» (un amigo): la terminación *-ی* va en el verbo ligero.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Soraya responde
    gloss: No, no preparé té. Desayuné.
    note: Soraya dice primero lo que no ocurrió, *چای درست نکردم*, y luego lo que sí, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Soraya le pregunta a Naveed por su mañana
    gloss: Naveed, ¿qué hiciste esta mañana?
    note: '*چه کار کردی؟* significa «¿qué hiciste?». Pregunta por una acción terminada, por eso usa el pasado *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Naveed cuenta los primeros pasos y uno que se saltó
    gloss: Primero me desperté tarde, luego me di una ducha y me vestí. No desayuné.
    note: Naveed usa *اول* y *بعد* para el orden y termina con un paso negativo, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Soraya pregunta qué vino después
    gloss: ¿Qué hiciste después de eso?
    note: '*بعد از آن* significa «después de eso», así que ella pregunta por el paso siguiente.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Naveed cuenta cómo llegó al trabajo
    gloss: Abrí el portón y fui a pie a la parada. Esperé en la parada y subí al autobús.
    note: 'Cuatro pasos terminados con cuatro verbos en pasado: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Fíjate en *دروازه را باز کردم*: *را* va justo después del objeto.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Soraya pregunta por la llamada
    gloss: ¿Me llamaste por teléfono?
    note: Una pregunta de sí o no sobre una acción terminada. *به من* significa «a mí».
  prs.a2.unit22.lesson06.teach.turn06:
    title: Naveed dice que no y termina su relato
    gloss: No, no llamé. Pero por fin llegué a la oficina.
    note: '*نخیر، تیلفون نکردم* responde con el verbo compuesto en negativo. Después, *ولی در آخر* cierra el relato.'
