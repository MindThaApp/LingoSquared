course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: hacer una reclamación en una tienda: una estufa eléctrica defectuosa, explicar qué falla, leer la política de devoluciones de una tienda y la conversación en el mostrador de devoluciones.'
units:
  prs.a2.unit18.shopping_complaint:
    title: Reclamación en una tienda
lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary:
    title: Palabras para una reclamación en una tienda
  prs.a2.unit18.lesson02.explaining_the_problem:
    title: Explicar el problema
  prs.a2.unit18.lesson03.reading_a_return_policy:
    title: Leer una política de devoluciones
  prs.a2.unit18.lesson04.return_counter_dialogue:
    title: En el mostrador de devoluciones
teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: Estropeado
    gloss: roto
    note: '*خراب* describe cualquier artículo defectuoso o que no funciona.'
    example_gloss: Esta estufa está estropeada.
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: Cambio
    gloss: cambiar
    note: '*تعویض کردن* -- *تعویض* significa «cambio» y se combina con *کردن* («hacer»).'
    example_gloss: Quiero cambiar la estufa.
  prs.a2.unit18.lesson01.teach.refund_word:
    title: Reembolso
    gloss: reembolso
    note: '*بازپرداخت* es la palabra formal para «reembolso».'
    example_gloss: Quiero un reembolso.
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: Recibo
    gloss: recibo
    note: '*رسید* es la misma palabra que ya se usó para el recibo del alquiler en unidades anteriores; aquí significa el recibo de compra.'
    example_gloss: Llevo conmigo el recibo de compra.
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: Garantía
    gloss: garantía
    note: '*گارانتی* es un préstamo de otra lengua y suena muy parecido a «garantía» en español.'
    example_gloss: Esta estufa tiene un año de garantía.
  prs.a2.unit18.lesson01.teach.defect_word:
    title: Defecto
    gloss: defecto
    note: '*عیب* significa un fallo o defecto en un artículo.'
    example_gloss: Esta estufa tiene un defecto.
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: Cuando, con وقتی
    gloss: Cuando la enciendo, no se calienta.
    note: '*وقتی* introduce una oración temporal; es un compañero natural de *اگر* («si») de la unidad 11, pero expresa un hecho y no una hipótesis.'
  prs.a2.unit18.lesson01.teach.heater_word:
    title: Estufa eléctrica
    gloss: estufa eléctrica
    note: '*بخاری برقی* -- *بخاری* significa «estufa» y *برقی* significa «eléctrico».'
    example_gloss: Compré una estufa eléctrica para mi casa nueva.
  prs.a2.unit18.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace habitual para unir oraciones en esta unidad.'
    target_text: و (y)
  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: Decir que un artículo comprado está estropeado
    gloss: Esta estufa que compré ayer está estropeada.
    note: '*که دیروز خریدم* -- «que compré ayer» -- es una oración de relativo que identifica de qué artículo se trata.'
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: Pedir un cambio o un reembolso
    gloss: Quiero cambiarla o que me devuelvan el dinero.
    note: '*یا* significa «o» y ofrece al comerciante una opción.'
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: Preguntar qué prefiere el cliente
    gloss: ¿Cuál prefiere usted?
    note: '*ترجیح دادن* significa «preferir»; es el paso gramatical de nivel A2 de esta unidad para elegir entre dos opciones ofrecidas.'
  prs.a2.unit18.lesson03.teach.deadline_word:
    title: Plazo / fecha límite
    gloss: plazo
    note: '*مهلت* es el plazo o la fecha límite en que hay que hacer algo.'
    example_gloss: El plazo de cambio es de siete días.
  prs.a2.unit18.lesson03.teach.original_word:
    title: Original
    gloss: original
    note: '*اصلی* significa «original», como en el recibo original, no una copia.'
    example_gloss: Traiga el recibo original, por favor.
  prs.a2.unit18.lesson03.teach.policy_text:
    title: Un aviso de la tienda sobre devoluciones
    gloss: Si un artículo comprado está defectuoso, puede cambiarlo o solicitar el reembolso en un plazo de siete días con el recibo original.
    note: Un aviso breve y oficial de una tienda, en el registro formal escrito que enseña esta unidad.
  prs.a2.unit18.lesson04.teach.turn01:
    title: El tendero saluda a کریم
    gloss: El tendero le pregunta en qué puede ayudarlo.
    note: Un saludo formal como el del empleado de la oficina en la unidad 9 (*بفرمایین، چه خدمتی...*), aquí con *کمکی* («ayuda») en lugar de *خدمتی* («servicio»).
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم explica el problema
    gloss: کریم dice que la estufa que compró ayer está estropeada.
    note: Reutiliza exactamente la frase de la lección 2.
  prs.a2.unit18.lesson04.teach.turn03:
    title: El tendero pregunta qué le pasa
    gloss: El tendero pregunta cuál es el problema.
    note: '*چه مشکلی دارد؟* significa «¿qué problema tiene?».'
  prs.a2.unit18.lesson04.teach.turn04:
    title: کریم explica el defecto
    gloss: Cuando la enciende, no se calienta.
    note: '*روشنش می‌کنم* -- «la enciendo» -- une el sufijo de objeto *-ش* a *روشن*.'
  prs.a2.unit18.lesson04.teach.turn05:
    title: El tendero pide el recibo
    gloss: El tendero le pregunta si lleva el recibo consigo.
    note: '*همراه‌تان* -- «con usted» -- lleva el sufijo posesivo formal *-تان*.'
  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم confirma que lo tiene
    gloss: Sí, aquí está su recibo.
    note: '*اینه* es un «aquí lo tiene» coloquial que se usa al entregar algo; ya se vio en la unidad 11.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: El tendero ofrece una opción
    gloss: El tendero puede cambiárselo o devolverle el dinero. ¿Qué prefiere él?
    note: Reutiliza la pregunta *ترجیح می‌دهین؟* de la lección 2.
  prs.a2.unit18.lesson04.teach.turn08:
    title: کریم elige el cambio
    gloss: کریم dice que es mejor el cambio, gracias.
    note: '*بهتر است* significa «es mejor».'
