course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: informar a un casero de un problema en casa — vocabulario, descripción del problema, lectura de un aviso de mantenimiento y la propia llamada telefónica.'
units:
  prs.a2.unit13.maintenance:
    title: Avisar de un problema en casa
lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary:
    title: Palabras para los problemas del hogar
  prs.a2.unit13.lesson02.reporting_the_problem:
    title: Avisar del problema
  prs.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Leer un aviso de mantenimiento
  prs.a2.unit13.lesson04.maintenance_call_dialogue:
    title: Llamar al casero
teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: Avería / problema
    gloss: avería / desperfecto
    note: '*خرابی* es la palabra general para algo que está roto o no funciona.'
    example_gloss: Informé de la avería de la tubería.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: Tubería
    gloss: tubería
    note: '*لوله* es la palabra de uso cotidiano para tubería.'
    example_gloss: La tubería de la cocina gotea.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: Electricidad
    gloss: electricidad / corriente
    note: '*برق* significa electricidad o suministro eléctrico.'
    example_gloss: La electricidad de mi dormitorio no funciona.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: Gotera
    gloss: gotera / goteo
    note: '*چکه* describe el agua que gotea o se fuga.'
    example_gloss: La fuga de la tubería empeora cada noche.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: Reparación
    gloss: reparación
    note: '*تعمیر* es la palabra general para una reparación.'
    example_gloss: La reparación de la tubería es mañana.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: Técnico de reparaciones
    gloss: reparador / operario
    note: '*کارگر* es un trabajador en general; aquí, concretamente, un reparador.'
    example_gloss: El casero envía a un reparador.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: Lo antes posible, con هر چه زودتر
    gloss: lo antes posible
    note: '*هر چه زودتر* -- una construcción para expresar urgencia; literalmente, «cuanto más pronto».'
    target_text: هر چه زودتر (lo antes posible)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: Informar de la tubería que gotea, con urgencia
    gloss: La tubería de mi cocina gotea y hay que repararla lo antes posible.
    note: Combina *چکه می‌کند* (gotea) con *هر چه زودتر* y *باید* (hay que).
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: Preguntar cuándo puede venir un reparador
    gloss: ¿Cuándo puede enviar a un reparador?
    note: '*کی می‌توانین...؟* pregunta «¿cuándo puede usted...?».'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: Informar de un segundo problema
    gloss: La electricidad de mi dormitorio no funciona.
    note: '*کار نمی‌کند* significa «no funciona» y se usa para un aparato o un servicio básico.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: Costo / tarifa
    gloss: costo / tarifa
    note: '*هزینه* es la palabra general para un costo o gasto.'
    example_gloss: La reparación eléctrica tiene un costo.
  prs.a2.unit13.lesson03.teach.free_word:
    title: Gratis
    gloss: gratis
    note: '*رایگان* significa «gratis», sin costo.'
    example_gloss: La reparación de la tubería es gratuita.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: Un aviso de mantenimiento del edificio
    gloss: El operario de mantenimiento viene el jueves a las diez. La reparación de tuberías es gratuita, pero la reparación eléctrica tiene costo.
    note: Un aviso general y breve del edificio, en registro escrito formal; es distinto de la llamada de کریم que aparece más adelante en la unidad y no se refiere a la misma visita.
  prs.a2.unit13.lesson04.teach.turn01:
    title: El casero contesta el teléfono
    gloss: 'El casero contesta: «Hola, diga».'
    note: '*الو* es la forma de contestar una llamada; aquí *بفرمایین* significa «diga» y no su sentido habitual de «adelante, pase».'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم se presenta e informa de la fuga
    gloss: Saluda, dice que es کریم y que la tubería de su cocina gotea.
    note: '*استم* es la cópula «soy»: *من کریم استم* significa «soy کریم».'
  prs.a2.unit13.lesson04.teach.turn03:
    title: El casero pregunta desde cuándo
    gloss: El casero pregunta desde cuándo empezó.
    note: '*از کی شروع شده؟* significa «¿desde cuándo empezó?».'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم responde con urgencia
    gloss: Desde anoche. Hay que repararla lo antes posible.
    note: '*دیشب* significa «anoche».'
  prs.a2.unit13.lesson04.teach.turn05:
    title: El casero acuerda una hora
    gloss: De acuerdo, mañana a las nueve enviará a un reparador.
    note: '*باشد* significa «de acuerdo» o «vale».'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم da las gracias e informa de un segundo problema
    gloss: Da las gracias al casero y dice que la electricidad de su dormitorio tampoco funciona.
    note: '*هم* aquí significa «también» y añade el segundo problema.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: El casero confirma que lo comunicará
    gloss: El casero dice que también le comentará eso al reparador.
    note: '*آن را هم به کارگر می‌گویم* -- «también se lo diré al reparador» -- se refiere al problema de la electricidad.'
