    title: Repaso final
teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Repaso: esto, es, en, bueno'
    gloss: esto / es / en / bueno
    note: Son palabras de repaso (usadas a lo largo del curso) para hablar del museo.
    target_text: این (esto / este) / است (es) / در (en) / خوب (bueno)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Museo
    gloss: museo
    note: Es la palabra estándar del dari afgano para «museo», distinta de موزه, que se usa en el persa de Irán.
    example_gloss: El museo es bueno.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Repaso: empleado'
    gloss: empleado
    note: Es la misma palabra general para «empleado» que ya viste en el cine y en la piscina, y aquí se reutiliza para la taquilla del museo.
    target_text: کارمند (empleado)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: Este es un museo
    gloss: Este es un museo.
    note: Une «esto», «es» y «museo» igual que el curso ya ha unido estas palabras en otras ocasiones.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: El empleado está en el museo
    gloss: El empleado está en el museo.
    note: Combina «empleado», «en» y «museo».
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
    title: 'Repaso: cuánto, afgani, es, cuarenta, en, foto, interesante, entrada'
    gloss: cuánto / afgani / es / cuarenta / en / foto / interesante / entrada
    note: Son palabras de repaso (de unidades anteriores) para hablar del precio y de la exposición del museo.
    target_text: چند (cuánto) / افغانی (afgani) / است (es) / چهل (cuarenta) / در (en) / عکس (foto) / جالب (interesante) / تکت (boleto)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Exposición
    gloss: exposición
    note: 'Es una palabra estándar del dari y del persa para «exposición»: نمایش (muestra) más گاه (lugar).'
    example_gloss: La exposición de fotos es interesante.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Leer el aviso del museo
    gloss: En el museo hay una exposición de fotos. La entrada cuesta 40 afganis.
  prs.a1.unit53.lesson02.teach.ask_museum_ticket_price_phrase:
