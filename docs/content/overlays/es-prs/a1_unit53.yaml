course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: visita un museo, lee sobre una exposición y el precio de la entrada, compra una entrada, pregunta por el horario y habla de forma sencilla sobre lo que viste.'
units:
  prs.a1.unit53.museum:
    title: Museo
    description: Visita un museo, compra una entrada, pregunta por una exposición o por el horario y habla de forma sencilla sobre lo que viste.
