    title: 'Repaso: usted, qué es, yo, quiero, uno/una'
    gloss: usted / qué es / yo / quiero / uno/una
    note: Son palabras de repaso para preguntar y para decir lo que quieres.
    target_text: شما (usted) / چیست (qué es) / من (yo) / می‌خواهم (quiero) / یک (uno / un)
  prs.a1.unit53.lesson03.teach.review_exhibition_word:
