teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Cocina
    gloss: cocina
    note: آشپزخانه es la palabra estándar en dari para «cocina».
    example_gloss: Hoy estoy en la cocina.
  prs.a1.unit36.lesson01.teach.food_word:
    title: La comida
    gloss: comida
    note: غذا significa comida en general, distinta de un plato concreto como پلو.
    example_gloss: La comida está deliciosa.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Cebolla
    gloss: cebolla
    note: پیاز es la palabra común en dari para «cebolla» y se usa constantemente en la cocina afgana.
    example_gloss: La cebolla está fresca.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Carne
    gloss: carne
    note: گوشت significa «carne».
    example_gloss: La carne está fresca.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Repaso: uno, querer, en, estar'
    gloss: uno/un, una / quiero / en / estoy
    note: یک, می‌خواهم, در y استم son formas ya vistas que aparecen en las oraciones de cocina de esta unidad.
    target_text: یک (uno / un) / می‌خواهم (quiero) / در (en) / استم (estoy, soy)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Cocino la comida
    gloss: Cocino la comida.
    note: می‌پزم es la primera persona del presente de پختن, «cocinar».
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Estoy en la cocina
    gloss: Estoy en la cocina.
    note: استم es la primera persona del verbo «ser/estar» y aquí se usa con در para indicar lugar.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Sal
    gloss: sal
    note: نمک significa «sal».
    example_gloss: Quiero sal.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Arroz
    gloss: arroz
    note: برنج es el arroz crudo (el grano), distinto de پلو, el plato de arroz cocinado que se enseña en la unidad de comida.
    example_gloss: Cocino arroz.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Repaso: hago, cortado'
    gloss: hago / cortado, picado
    note: می‌کنم ya se vio; خرد es nuevo y, junto con formas de کردن, significa «picar» o «cortar».
    target_text: می‌کنم (hago) / خرد (cortado / picado)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Pico la cebolla
    gloss: Corto la cebolla.
    note: 'خرد می‌کنم significa literalmente «hago que esté cortado/picado»: es un patrón habitual de verbo compuesto.'
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Añado sal
    gloss: Añado sal.
    note: می‌اندازم (de انداختن, «echar/poner dentro») es el verbo dari natural para añadir un ingrediente.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Cocino carne
    gloss: Cocino carne.
    note: Cambia گوشت por برنج para nombrar otro alimento que se cocina.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Repaso: primero, después'
    gloss: primero / después
    note: اول y بعد son palabras de repaso que sirven para ordenar los pasos de una receta.
    target_text: اول (primero) / بعد (después)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Repaso: agua, caliente'
    gloss: agua / caliente
    note: آب y گرم son palabras de repaso de unidades anteriores.
    target_text: آب (agua) / گرم (caliente)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Echo (un líquido)
    gloss: echo (un líquido)
    note: می‌ریزم (de ریختن, «verter») es el verbo natural para añadir un líquido, distinto de می‌اندازم, que se usa para ingredientes sólidos.
    example_gloss: Echo agua.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Primero corto la cebolla
    gloss: Primero corto la cebolla.
    note: اول marca el primer paso de una secuencia.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Después cocino la carne
    gloss: Después cocino la carne.
    note: بعد marca el siguiente paso de una secuencia.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Echo agua caliente
    gloss: Echo agua caliente.
    note: Combina گرم («caliente») con می‌ریزم («echo»).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Hola / sí / por favor / claro / gracias / guiso / delicioso / es
    gloss: hola / sí / por favor / de acuerdo, claro / gracias / guiso / delicioso / es
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه y است son palabras de repaso que se usan en el diálogo de la cocina.
    target_text: سلام (hola) / بلی (sí) / لطفاً (por favor) / چشم (claro, de acuerdo) / تشکر (gracias) / قورمه (guiso) / خوش‌مزه (delicioso) / است (es)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Hola, ¿qué está cocinando?'
    gloss: Hola, ¿qué está cocinando?
    note: چی می‌پزین؟ usa la forma de cortesía می‌پزین (usted).
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Estoy cocinando qorma.'
    gloss: Estoy cocinando qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: ¿Le ayudo?'
    gloss: ¿Le ayudo?
    note: کمک می‌کنم؟ significa literalmente «¿ayudo?», una forma natural de ofrecer ayuda.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Sí, por favor, corte la cebolla.'
    gloss: Sí, por favor, corte la cebolla.
    note: 'کنین es la forma de cortesía del imperativo: «¡corte!».'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Claro.'
    gloss: Claro.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Gracias, la comida está deliciosa.'
    gloss: Gracias, la comida está deliciosa.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: Él/ella, en, hace, cocina, muy, contento/a, está
    gloss: él/ella / en / él/ella hace / él/ella cocina / muy / contento/a / es, está
    note: او es el pronombre dari para «él» o «ella»; می‌کند y می‌پزد son las formas de tercera persona de los verbos usados antes en esta unidad.
    target_text: او (él/ella) / در (en) / می‌کند (hace) / می‌پزد (cocina) / بسیار (muy) / خوشحال (contento/a) / است (está)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Lectura: Nadia cocina'
    gloss: Nadia está en la cocina. Corta la cebolla. Después cocina la carne. La comida está muy deliciosa. Nadia está contenta.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (me gusta) / را (marcador de objeto directo) / اما (pero) / وقت ندارم (no tengo tiempo)
