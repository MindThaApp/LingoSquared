  prs.a2.unit30.lesson06.plans_conversation:
    title: Una conversación sobre el viernes
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: Nadar
    gloss: nadar
    note: '*شنا کردن* significa nadar. Es un verbo de dos palabras: el sustantivo *شنا* más *کردن*. Muchas habilidades se nombran así: *آشپزی کردن* (cocinar), *رانندگی کردن* (conducir), *صحبت کردن* (hablar).'
    example_gloss: Nado bien.
  prs.a2.unit30.lesson01.teach.paint:
    title: Pintar, dibujar
    gloss: pintar, dibujar
    note: '*نقاشی کردن* es pintar o dibujar un cuadro. Como *شنا کردن*, es un sustantivo más *کردن*.'
    example_gloss: Mi amigo pinta.
  prs.a2.unit30.lesson01.teach.letter:
    title: Carta
    gloss: carta
    note: '*نامه* es una carta. El verbo escribir es *نوشتن*, y la carta es lo que se escribe: *نامه نوشتن* es escribir una carta.'
    example_gloss: La carta está en casa.
  prs.a2.unit30.lesson01.teach.dari:
    title: Dari
    gloss: dari (el idioma)
    note: '*دری* es el nombre del idioma que estás aprendiendo. Se habla con *صحبت کردن*: *دری صحبت کردن*, y *انگلیسی صحبت کردن* es hablar inglés.'
    example_gloss: Hablo un poco de dari.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: puedo'
    gloss: Puedo ir. Puedo venir. Sé cocinar.
    note: '*می‌توانم* significa puedo, soy capaz de. Siempre va seguido de un segundo verbo en subjuntivo: *می‌توانم بروم* (puedo ir), *می‌توانم بیایم* (puedo venir), *می‌توانم آشپزی کنم* (sé cocinar). Los dos verbos van juntos y ambos están en primera persona. Escribe *می‌توانم* con un semiespacio (ZWNJ) entre *می* y *توانم*, no con un espacio completo.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'El subjuntivo: ب más la raíz del presente más م'
    gloss: (que) yo vaya, coma, lea, escriba, cocine, compre, vea, diga
    note: 'El subjuntivo se forma con tres partes: *ب* + la raíz del presente + la terminación personal. Para «yo» la terminación es *-م*. La raíz del presente de *رفتن* es *رو*, así que resulta *بروم*. La misma regla da *خوردن* → *بخورم*, *خواندن* → *بخوانم*, *نوشتن* → *بنویسم*, *پختن* → *بپزم*, *خریدن* → *بخرم*, *دیدن* → *ببینم*, *گفتن* → *بگویم*. Ya conoces esta forma después de *باید*. Después de *می‌توانم* es el segundo verbo. *آمدن* es irregular: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: Los verbos de dos palabras no llevan ب
    gloss: Sé cocinar, conducir, nadar, hablar, pintar
    note: 'Un verbo formado por un sustantivo y *کردن* no lleva *ب*. Solo cambia el verbo ligero: *کنم*. La forma escrita estándar es *آشپزی کنم*; *آشپزی بکنم* también se oye al hablar. Compara *می‌توانم آشپزی کنم* (sé cocinar) con *می‌توانم بروم* (puedo ir). El mismo patrón sirve para *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. El verbo simple *کردن* solo es *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: Sé cocinar
    gloss: Sé cocinar.
    note: 'Este es el patrón básico: sujeto (opcional), *می‌توانم*, la habilidad y el subjuntivo de *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: Puedo hablar dari
    gloss: Puedo hablar dari.
    note: El sujeto *من* se puede omitir porque *می‌توانم* ya indica quién habla. El verbo *صحبت کنم* cierra la oración.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: El paradigma completo
    gloss: yo puedo ir, tú puedes ir, él/ella puede ir, nosotros podemos ir, usted/ustedes pueden ir (formal o plural), ellos pueden ir
    note: 'Los dos verbos cambian con la persona. El modal: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. El subjuntivo: *بروم، بروی، برود، برویم، بروین، بروند*. Así, *می‌توانی بروی* es «puedes ir» (a un amigo), *می‌تواند برود* «él o ella puede ir», *می‌توانیم برویم* «podemos ir», *می‌توانین بروین* «usted puede ir» (formal, o una sola persona a la que respetas) o «ustedes pueden ir» (varias personas), *می‌توانند بروند* «ellos pueden ir». La terminación de la segunda persona del plural es *-ین* en ambos verbos.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Verbos de dos palabras: solo cambia کنم'
    gloss: Él sabe conducir. Ustedes saben conducir. Sabemos cocinar.
    note: 'En los verbos de dos palabras el sustantivo no cambia y solo cambia *کنم*: *کنم، کنی، کند، کنیم، کنین، کنند*. Así: *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. La persona debe ser la misma en los dos verbos.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'La negación: نمی‌توانم'
    gloss: no puedo ir, no puedes ir, él/ella no puede ir, no podemos ir, usted/ustedes no pueden ir, ellos no pueden ir
    note: 'Para decir que no puedes hacer algo, pon *ن* en el modal: *می‌توانم* pasa a *نمی‌توانم*. El segundo verbo sigue en afirmativo: *نمی‌توانم بروم* (no puedo ir), no *نمی‌توانم نروم*. Todas las terminaciones son las mismas que en el paradigma afirmativo.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: ¿Puede ayudarme?
    gloss: ¿Puede ayudarme?
    note: 'Así se pregunta a un amigo si es capaz de hacer algo: *می‌توانی* más el subjuntivo. A una persona a la que respetas, o a varias personas, di *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: Él no sabe conducir
    gloss: Él no sabe conducir. / Ella no sabe conducir.
    note: '*او* significa «él» o «ella», así que esta oración habla de una sola persona que no es capaz de conducir. *نمی‌تواند* es la forma negativa; *کند* es el subjuntivo de *کردن* para él o ella.'
  prs.a2.unit30.lesson03.teach.busy:
    title: Ocupado
    gloss: ocupado
    note: '*مشغول* significa ocupado. Se dice *مشغول استم* (estoy ocupado), lo contrario de *آزاد استم* (estoy libre).'
    example_gloss: Hoy estoy ocupado.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Esta noche
    gloss: esta noche
    note: '*امشب* es «esta noche». Como *فردا* (mañana) y *امروز* (hoy), es una palabra de tiempo que va antes del verbo.'
    example_gloss: Esta noche estoy en casa.
  prs.a2.unit30.lesson03.teach.five:
    title: Cinco
    gloss: cinco
    note: '*پنج* es cinco. *ساعت پنج* son las cinco y *بعد از ساعت پنج* es después de las cinco.'
    example_gloss: A las cinco voy a casa.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Palabra de tiempo más می‌توانم
    gloss: Mañana puedo venir. Esta noche no puedo venir. El viernes puedo venir.
    note: 'Para decir cuándo puedes hacer algo, pon una palabra de tiempo en la oración: *فردا*, *امشب*, *روز جمعه*. Los verbos no cambian, *می‌توانم بیایم*; la palabra de tiempo indica que se trata del futuro, así que no hace falta otra forma de futuro. La palabra de tiempo puede ir al principio (*فردا می‌توانم بیایم*) o después del modal (*می‌توانم فردا بیایم*). La pregunta es *فردا می‌توانی بیایی؟* (¿Puedes venir mañana?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Sí, no, porque, pero
    gloss: Sí, puedo venir. No, no puedo venir, porque estoy ocupado. Pero el viernes estoy libre.
    note: 'Para aceptar, responde *بلی* y repite el modal: *بلی، می‌توانم بیایم*. Para rechazar, responde *نخیر* y da el motivo con *چون*: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. Luego *ولی* (pero) propone otro momento: *ولی روز جمعه آزاد استم*. *آزاد استم* es «estoy libre» y *مشغول استم* es «estoy ocupado». También puedes decir *کار دارم* (tengo trabajo).'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Libre después de las cinco
    gloss: Después de las cinco estoy libre.
    note: Con esto le dices a la otra persona cuándo estás libre. *بعد از ساعت پنج* es después de las cinco.
  prs.a2.unit30.lesson03.teach.when_q:
    title: ¿Cuándo puedes venir?
    gloss: ¿Cuándo puedes venir?
    note: '*کی* pregunta por el momento. La respuesta es una palabra de tiempo con el mismo patrón: *فردا می‌توانم بیایم* o *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: Es posible, puede que
    gloss: es posible que, puede que
    note: '*ممکن است* significa «es posible», «puede que». Va seguido de una cláusula cuyo verbo está en subjuntivo: *ممکن است باران ببارد* (puede que llueva). *ممکن* nunca cambia; el verbo que sigue lleva la persona.'
    example_gloss: Puede que mañana llueva.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Quizá
    gloss: quizá, tal vez
    note: '*شاید* significa quizá. Como *ممکن است*, va seguido del subjuntivo: *شاید بیایم* (quizá venga), *شاید او بیاید* (quizá venga él). *شاید* es más corto y se usa más al hablar.'
    example_gloss: Quizá venga él.
  prs.a2.unit30.lesson04.teach.rain:
    title: Lluvia
    gloss: lluvia
    note: '*باران* es lluvia. El verbo es *باریدن*: *باران ببارد* (puede que llueva), *باران نبارد* (puede que no llueva). El subjuntivo de *باریدن* es *ببارد*.'
    example_gloss: Hoy llueve.
  prs.a2.unit30.lesson04.teach.sure:
    title: Claro
    gloss: seguro
    note: '*مطمئن* significa seguro. *مطمئن نیستم* es «no estoy seguro». Es algo natural que decir antes de añadir *شاید* o *ممکن است*.'
    example_gloss: No estoy seguro.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است más el subjuntivo
    gloss: Puede que llegue tarde. Puede que él venga. Puede que llueva.
    note: 'Después de *ممکن است* el verbo va en subjuntivo, en la persona que quieras: *بیایم* (yo venga), *بیایی* (tú vengas), *بیاید* (él venga), *بیاییم* (nosotros vengamos), *بیایین* (ustedes vengan), *بیایند* (ellos vengan). La negación pone *ن* en el subjuntivo: *ممکن است نیاید* (puede que él no venga). Compáralo con *می‌توانم*: este dice que soy capaz; *ممکن است* dice que es posible que ocurra.'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید más el subjuntivo
    gloss: Quizá venga. Quizá vengas. Quizá venga él. Quizá ellos no vengan.
    note: '*شاید* funciona exactamente igual que *ممکن است*: va seguido del subjuntivo y la persona se indica con la terminación del verbo: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. La negación lleva *ن* en el verbo: *شاید نیایند* (quizá no vengan). Delante puede ir una palabra de tiempo: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: quizá pueda'
    gloss: Quizá pueda venir. Quizá no pueda venir. Puede que él pueda venir.
    note: 'Puedes combinar las dos ideas: *شاید* o *ممکن است* más el subjuntivo de *توانستن*, que es *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند*, más el segundo verbo. Así, *شاید بتوانم بیایم* significa «quizá pueda venir». La negación es *نتوانم*: *شاید نتوانم بیایم* significa «quizá no pueda venir». Es útil cuando todavía no sabes si estarás libre.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Quizá pueda venir mañana
    gloss: Quizá pueda venir mañana.
    note: No estás seguro, pero hay una posibilidad. La palabra de tiempo *فردا* va después de *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: Puede que llueva
    gloss: Podría llover.
    note: '*ممکن است* más *ببارد*: una posibilidad, no una promesa.'
  prs.a2.unit30.lesson05.teach.fix:
    title: Arreglar
    gloss: arreglar, reparar, hacer
    note: '*درست کردن* es arreglar o reparar algo, y también hacer, como en *چای درست کردن* (hacer té). Primero va el objeto con *را*: *کمپیوترم را درست می‌کنم*.'
    example_gloss: Mi amigo me arregla el coche.
  prs.a2.unit30.lesson05.teach.problem:
    title: Problema
    gloss: problema, dificultad
    note: '*مشکل* es un problema. *مشکل کوچک* es un problema pequeño.'
    example_gloss: El problema es pequeño.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Wahida pregunta si Sakhi puede venir
    gloss: Sakhi, ¿puedes venir mañana a nuestra casa?
    note: 'Wahida le pregunta a un amigo si está libre mañana: *فردا می‌توانی ... بیایی؟*. Usa *تو* porque Sakhi es un amigo.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Sakhi dice cuándo puede
    gloss: Por la mañana no puedo, porque tengo trabajo en la oficina. Pero después de las cinco estoy libre.
    note: Sakhi rechaza la mañana con *نمی‌توانم* y da el motivo con *چون*. Tras *نمی‌توانم* se omite el segundo verbo porque *بیایم* se entiende por la pregunta. Después propone otro momento con *ولی*.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Wahida pide ayuda
    gloss: Muy bien. Mi computadora está estropeada. ¿Puedes arreglarla?
    note: '*می‌توانی ... درست کنی؟* pregunta si él es capaz de arreglarla. *آن را* (la) se refiere a la computadora.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Sakhi no está seguro
    gloss: Quizá pueda. Puede que el problema sea pequeño.
    note: Sakhi no está seguro, así que dice *شاید بتوانم* (quizá pueda) y *ممکن است ... باشد* (puede que sea). Ambos van seguidos del subjuntivo.
  prs.a2.unit30.lesson05.teach.message:
    title: Un mensaje de un amigo
    gloss: Hola, amigo mío. Mañana no puedo venir, porque por la mañana tengo trabajo en la oficina. Después de las cinco estoy libre, pero puede que llegue tarde. Quizá pueda venir el jueves. ¿Estás libre el jueves?
    note: 'Un mensaje breve que usa las tres ideas de la unidad: lo que el autor no puede hacer (*نمی‌توانم بیایم*), cuándo está libre (*بعد از ساعت پنج آزاد استم*) y lo que podría pasar (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Parque
    gloss: parque
    note: '*پارک* es un parque. Se va *به پارک* (al parque) y se está *در پارک* (en el parque).'
    example_gloss: El parque está en Kabul.
  prs.a2.unit30.lesson06.teach.tea:
    title: Té
    gloss: té
    note: '*چای* es el té. *چای درست کردن* es hacer té, con el verbo que viste en la lección anterior.'
    example_gloss: El té está caliente.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Hamid pregunta por el viernes
    gloss: Palwasha, ¿vas al parque el viernes?
    note: '*جمعه به پارک می‌روی؟* pregunta por un plan con el presente simple *می‌روی* y una palabra de tiempo. Palwasha es una amiga, por eso usa *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Palwasha no está segura
    gloss: Quizá vaya. Podría llover.
    note: Palwasha no está segura. *شاید بروم* es «quizá vaya» y *ممکن است باران ببارد* es «podría llover». Los dos verbos están en subjuntivo.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Hamid ofrece y pregunta
    gloss: Yo puedo cocinar. ¿Puedes hacer el té?
    note: Hamid dice lo que puede hacer (*می‌توانم غذا بپزم*) y pregunta qué puede hacer Palwasha (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Palwasha acepta, con una condición
    gloss: Sí, puedo. Pero si llueve, no podemos quedarnos en el parque.
    note: '*بلی، می‌توانم* acepta. Luego *اگر باران ببارد* (si llueve) plantea una condición, y *نمی‌توانیم ... بمانیم* dice lo que ellos no pueden hacer. *اگر* también va con subjuntivo.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: Hamid tiene otra idea
    gloss: Entonces quizá comamos en mi casa.
    note: '*شاید ... بخوریم* es una sugerencia que podría funcionar: quizá comamos en mi casa. *پس* (entonces) se deduce del problema de la lluvia.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: ¿Qué significa esta frase?
    correct_option: Sé nadar
    distractors:
    - Ayer nadé
    - Me gusta el agua
    - Quiero aprender a nadar
    accepted_answers:
    - value: Sé nadar
      status: correct
    feedback: '*می‌توانم شنا کنم* significa «sé nadar»: *می‌توانم* más el subjuntivo *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: ¿Qué significa esta frase?
    correct_option: Puedo escribir una carta
    distractors:
    - Escribí una carta
    - Tengo una carta
    - Debo escribir una carta
    accepted_answers:
    - value: Puedo escribir una carta
      status: correct
    feedback: '*می‌توانم نامه بنویسم* significa «puedo escribir una carta»: *نامه* es la carta y *بنویسم* es el subjuntivo de *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
    instruction: Relaciona cada oración en dari con su significado.
    accepted_answers:
    - value:
        می‌توانم شنا کنم: Sé nadar
        می‌توانم آشپزی کنم: Sé cocinar
        می‌توانم رانندگی کنم: Sé conducir
        می‌توانم نقاشی کنم: Sé pintar
        می‌توانم نامه بنویسم: Puedo escribir una carta
        می‌توانم دری صحبت کنم: Puedo hablar dari
        می‌توانم انگلیسی صحبت کنم: Puedo hablar inglés
        می‌توانم کتاب بخوانم: Puedo leer un libro
      status: correct
    feedback: 'Cada oración es *می‌توانم* más una habilidad más el subjuntivo: *کنم* para los verbos de dos palabras, *بنویسم* y *بخوانم* para los verbos simples.'
    pairs:
    - left: می‌توانم شنا کنم
