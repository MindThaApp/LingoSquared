course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: decir lo que puedes y no puedes hacer, cuándo estás libre u ocupado y qué puede pasar. El modal می‌توانم con el subjuntivo, ممکن است y شاید con el subjuntivo, y cómo fijar una hora en la que puedes venir.'
units:
  prs.a2.unit30.can_and_might:
    title: Lo que puedo y lo que quizá pueda hacer
lessons:
  prs.a2.unit30.lesson01.what_i_can_do:
    title: Cosas que sé hacer
  prs.a2.unit30.lesson02.all_persons_and_no:
    title: Todas las personas y la negación
  prs.a2.unit30.lesson03.free_or_busy:
    title: Libre u ocupado
  prs.a2.unit30.lesson04.might_and_maybe:
    title: Puede que, quizá
  prs.a2.unit30.lesson05.reading_and_listening:
