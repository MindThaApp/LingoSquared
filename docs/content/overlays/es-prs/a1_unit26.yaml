course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de aficiones y tiempo libre (leer, escuchar música, ver películas, caminar, cocinar), cómo preguntar qué le gusta hacer a alguien en su tiempo libre con دوست دارین, la frecuencia con هر هفته/آخر هفته y un diálogo entre Zarmina y Homayoun que compara cómo pasan su tiempo libre.'
units:
  prs.a1.unit26.hobbies:
    title: Aficiones
    description: Describe qué haces tú y qué hacen otros para divertirse en su tiempo libre, y pregunta a alguien por el suyo.
