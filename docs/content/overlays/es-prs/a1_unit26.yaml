    target_text: هم (también) / گاهی (a veces) / و (y)
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿qué haces en tu tiempo libre?'
    gloss: 'Homayoun: Zarmina, ¿qué haces en tu tiempo libre?'
    note: Una pregunta informal entre amigos, con تو/-ی.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Me gusta leer y a veces también escucho música'
    gloss: 'Zarmina: Me gusta leer y a veces también escucho música.'
    note: Combina dos actividades con و (y).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Camino cada semana'
    gloss: 'Homayoun: Camino cada semana.'
    note: 'Retoma la frase de la lección 3: *من هر هفته پیاده‌روی می‌کنم* (camino cada semana).'
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Zarmina: ¡Qué bien! A mí también me gusta ver películas'
    gloss: 'Zarmina: ¡Qué bien! A mí también me gusta ver películas.'
    note: Aplica هم (también) a una actividad nueva.
