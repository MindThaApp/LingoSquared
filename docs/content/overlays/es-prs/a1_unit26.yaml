    gloss: escuchar música
    note: 'موسیقی گوش کردن significa literalmente «música oído-hacer»: موسیقی (música, ya vista antes en el curso) + گوش (oído) + کردن (hacer).'
    example_gloss: Escuchar música es mi afición.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: Ver películas
    gloss: ver películas
    note: 'فلم دیدن significa literalmente «ver película»: فلم (película) + دیدن (ver).'
    example_gloss: Ver películas es mi afición.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: Caminar
    gloss: caminar
    note: پیاده‌روی significa caminar (como actividad o ejercicio).
    example_gloss: Caminar es mi afición.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: Cocinar
    gloss: cocinar
    note: آشپزی significa cocinar.
    example_gloss: Cocinar es mi afición.
  prs.a1.unit26.lesson02.teach.free_word:
    title: Libre
    gloss: libre
    note: آزاد significa libre (en el sentido de «no ocupado», no de «gratis»).
    example_gloss: Hoy estoy libre.
  prs.a1.unit26.lesson02.teach.review_waqt:
    title: Tiempo
    gloss: tiempo
    note: وقت significa tiempo (ya se introdujo antes en el curso).
