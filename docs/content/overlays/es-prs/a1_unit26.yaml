    title: 'Homayoun: Yo también cocino a veces'
    gloss: 'Homayoun: Yo también cocino a veces.'
    note: Aplica گاهی (a veces) y می‌کنم a آشپزی.
  prs.a1.unit26.lesson05.teach.reading_passage:
    title: Lectura sobre aficiones
