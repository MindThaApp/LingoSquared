teaching:
  prs.a1.unit35.lesson01.teach.post_office_word:
    title: Oficina de correos
    gloss: oficina de correos
    note: پُسته خانه es la forma del dari de Afganistán para decir «oficina de correos».
    example_gloss: La oficina de correos está cerca.
  prs.a1.unit35.lesson01.teach.stamp_word:
    title: Sello
    gloss: sello
    note: تکت پُستی es una expresión práctica para principiantes que significa «sello postal».
    example_gloss: Quiero un sello.
  prs.a1.unit35.lesson01.teach.letter_word:
    title: Carta
    gloss: carta
    note: نامه significa carta o mensaje escrito.
    example_gloss: La carta está sobre la mesa.
  prs.a1.unit35.lesson01.teach.parcel_word:
    title: Paquete
    gloss: paquete
    note: پارسل se usa en el lenguaje actual del servicio postal afgano para decir «paquete».
    example_gloss: El paquete no es grande.
  prs.a1.unit35.lesson01.teach.review_basics:
    title: 'Repaso: uno, cerca, es, quiero'
    gloss: uno/un / cerca / es / quiero
    note: یک, نزدیک, است y می‌خواهم son formas de repaso que se usan en peticiones sencillas en el mostrador.
    target_text: یک (uno / un) / نزدیک (cerca) / است (es, está) / می‌خواهم (quiero)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: Quiero un sello
    gloss: Quiero un sello.
    note: Usa می‌خواهم para hacer una petición sencilla y cortés.
  prs.a1.unit35.lesson01.teach.post_office_near_phrase:
    title: La oficina de correos está cerca
    gloss: La oficina de correos está cerca.
    note: Aquí se reutiliza نزدیک de la unidad del barrio.
  prs.a1.unit35.lesson02.teach.send_phrase:
    title: Envío una carta
    gloss: Envío una carta.
    note: روان می‌کنم significa literalmente «lo pongo en marcha»; aquí es una forma natural en dari de decir «envío».
  prs.a1.unit35.lesson02.teach.send_parcel_phrase:
    title: Envío un paquete
    gloss: Envío un paquete.
    note: Cambia نامه por پارسل para nombrar lo que envías.
