    title: 'Repaso: dónde y adónde'
    gloss: dónde / a / Herat / usted
    note: کجا, به, هرات y شما son palabras de repaso reunidas aquí para las preguntas sobre el destino.
    target_text: کجا (dónde) / به (a) / هرات (Herat) / شما (usted, formal)
  prs.a1.unit35.lesson02.teach.to_where_question:
    title: ¿Adónde va la carta?
    gloss: ¿Adónde va la carta?
    note: نامه به کجا می‌رود؟ pregunta por el destino.
