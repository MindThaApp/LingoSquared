course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: reconocer una emergencia básica, pedir ayuda, indicar si necesitas a la policía, una ambulancia o los bomberos, describir una lesión y leer un texto breve sobre emergencias.'
units:
  prs.a1.unit40.emergencies:
    title: Emergencias
    description: Reconoce una emergencia básica, pide ayuda e indica qué tipo de ayuda necesitas (policía, ambulancia o bomberos).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Ayuda de emergencia
  prs.a1.unit40.lesson02.asking_for_help:
    title: Pedir ayuda
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Herido y sangrando
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Diálogo de emergencia
  prs.a1.unit40.lesson05.emergency_reading:
    title: Lectura sobre ayuda de emergencia
  prs.a1.unit40.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Repaso: ayuda, quiero'
    gloss: ayuda / quiero
    note: کمک y می‌خواهم son palabras de repaso que se usan en toda esta unidad para indicar qué tipo de ayuda se necesita.
    target_text: کمک (ayuda) / می‌خواهم (quiero)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Repaso: esto, es'
    gloss: esto / es
    note: این y است son palabras de repaso de las primeras unidades que sirven para decir de qué tipo de situación se trata.
    target_text: این (esto) / است (es)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Emergencia
    gloss: emergencia
    note: اضطراری significa emergencia o urgente.
    example_gloss: Esto es una emergencia.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Policía
    gloss: policía
    note: پولیس es la palabra habitual en el dari de Afganistán para decir «policía»; es un préstamo del inglés y, como ves, se parece mucho a la palabra española.
    example_gloss: Necesito a la policía.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulancia
    gloss: ambulancia
    note: امبولانس significa ambulancia.
    example_gloss: Necesito una ambulancia.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Fuego
    gloss: incendio
    note: آتش significa fuego o incendio.
    example_gloss: Hay un incendio.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Bomberos
    gloss: bomberos
    note: اطفائیه es el término cotidiano en Kabul para el cuerpo de bomberos.
    example_gloss: Necesito a los bomberos.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: ¡Esto es una emergencia! ¡Necesito a la policía!
    gloss: ¡Esto es una emergencia! ¡Necesito a la policía!
    note: این اضطراری است combina این (esto) con اضطراری (emergencia) y است (es).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Repaso: ¿puede(s)?, haga (imperativo cortés), a/para, rápido'
    gloss: ¿puede(s)? / haga / a/para / rápido
    note: می‌توانین, کنین, به y زود (de unidades anteriores) se combinan con otras palabras para formar peticiones y órdenes corteses.
    target_text: می‌توانین (puede usted) / کنین (haga — imperativo cortés) / به (a, para) / زود (rápido)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Yo
    gloss: me
    note: 'مه ره es la forma hablada del dari de Kabul para مرا («me», como complemento directo): مه es la forma hablada de من y ره es la forma hablada de la marca de objeto را. En la escritura verás normalmente مرا, que también se acepta.'
    example_gloss: ¿Puedes ayudarme?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: ¿Puede ayudarme?
    gloss: ¿Puede ayudarme?
    note: Una frase real y muy usada en dari para pedir ayuda directamente.
  prs.a1.unit40.lesson02.teach.call_word:
    title: ¡Llame! (imperativo)
    gloss: llame
    note: زنگ بزنین es el imperativo cortés de زنگ زدن (llamar por teléfono), basado en زنگ می‌زنم (llamo), que ya has aprendido.
    example_gloss: ¡Llame a la policía!
  prs.a1.unit40.lesson02.teach.come_word:
    title: ¡Venga! (imperativo)
    gloss: venga
    note: بیایین es el imperativo cortés de آمدن (venir).
    example_gloss: ¡Venga rápido!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: ¡Llame a la ambulancia!
    gloss: ¡Llame a la ambulancia!
    note: به (a/para) más امبولانس (ambulancia) más el imperativo زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Repaso: él/ella, él/ella tiene'
    gloss: él/ella / él/ella tiene
    note: او y دارد son formas de repaso que sirven para describir el estado de otra persona en una emergencia.
    target_text: او (él/ella) / دارد (él/ella tiene)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Herido
    gloss: herido
    note: زخمی significa herido o lesionado.
    example_gloss: Está herido/a.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Hemorragia
    gloss: hemorragia
    note: خون‌ریزی significa hemorragia o sangrado.
    example_gloss: Está sangrando.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: ¡Está herido/a! ¡Necesito una ambulancia!
    gloss: ¡Está herido/a! ¡Necesito una ambulancia!
    note: Combina زخمی con امبولانس می‌خواهم, que ya has aprendido.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: ¡Está sangrando! ¡Venga rápido!
    gloss: ¡Está sangrando! ¡Venga rápido!
    note: Combina خون‌ریزی con زود بیایین, que ya has aprendido.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Repaso: qué, él/ella viene, llamo, muchas gracias'
    gloss: qué / él/ella viene / llamo / muchas gracias
    note: چه, می‌آید, زنگ می‌زنم y تشکر زیاد son palabras de repaso que se usan en el diálogo de emergencia.
    target_text: چه (qué) / می‌آید (él/ella viene) / زنگ می‌زنم (llamo) / تشکر زیاد (muchas gracias)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: ¡Zarmina, ayuda! ¡Ayuda!'
    gloss: ¡Zarmina, ayuda! ¡Ayuda!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: ¿Qué?'
    gloss: ¿Qué?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¡Está herido/a! ¡Está sangrando!'
    gloss: ¡Está herido/a! ¡Está sangrando!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Necesito una ambulancia. ¡Voy a llamar!'
    gloss: Necesito una ambulancia. ¡Voy a llamar!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: ¡Muchas gracias!'
    gloss: ¡Muchas gracias!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: La ambulancia llega pronto.'
    gloss: La ambulancia llega pronto.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Repaso: uno, persona, ciudad, él/ella hace, en'
    gloss: uno / persona / ciudad / él/ella hace / en
    note: یک, نفر, شهر, می‌کند y در son palabras de repaso que se usan en este texto de lectura.
    target_text: یک (uno) / نفر (persona) / شهر (ciudad) / می‌کند (él/ella hace) / در (en)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Lectura sobre una emergencia
    gloss: En la ciudad hay una persona herida. Está sangrando. Homayoun ayuda. Llega una ambulancia.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Repaso: teléfono, no tengo, pero, usted'
    gloss: teléfono / no tengo / pero / usted
    note: تلفن, ندارم, اما y شما son palabras de repaso que sirven para contrastar una necesidad con una limitación y para hacer una pregunta formal.
    target_text: تلفن (teléfono) / ندارم (no tengo) / اما (pero) / شما (usted)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Necesito ayuda, pero no tengo teléfono
    gloss: Necesito ayuda, pero no tengo teléfono.
    note: اما contrapone la necesidad de ayuda a no tener un teléfono para pedirla.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: ¿Puedes ayudar?
    gloss: ¿Puede usted ayudar?
    note: La versión formal con شما para pedir ayuda directamente y con cortesía.
