  prs.a1.unit50.lesson02.teach.review_want_get_ticket:
    title: 'Repaso: quiero, para que yo consiga, entrada, uno/una'
    gloss: quiero / para que yo consiga / entrada / uno/una
    note: «Para que yo consiga» es la forma de subjuntivo esperada de un verbo ya estudiado, formada igual que los demás subjuntivos del curso (para que yo lave, para que yo tome).
    target_text: می‌خواهم (quiero) / بگیرم (para que compre / saque — subjuntivo) / تکت (boleto) / یک (uno / un)
  prs.a1.unit50.lesson02.teach.want_ticket_phrase:
    title: Quiero comprar una entrada
    gloss: Quiero comprar una entrada.
    note: Amplía el mismo patrón de «querer» más subjuntivo ya usado para pedir libros prestados en la biblioteca, sacar una cita, alquilar una bicicleta y usar la lavandería.
  prs.a1.unit50.lesson02.teach.review_price_words:
