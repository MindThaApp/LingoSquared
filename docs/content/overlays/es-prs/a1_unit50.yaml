    target_text: این (esto / este) / است (es) / در (en)
  prs.a1.unit50.lesson01.teach.pool_word:
    title: Piscina
    gloss: piscina
    note: Es el término en dari para piscina, el tipo de expresión que verías en una pregunta sobre servicios de un hotel como «¿El hotel tiene piscina?».
    example_gloss: Esto es una piscina.
  prs.a1.unit50.lesson01.teach.staff_word:
    title: Personal / empleado
    gloss: personal / empleado
    note: Es una palabra general para un miembro del personal; aquí se usa para la persona que trabaja en la piscina.
    example_gloss: El empleado está en la piscina.
  prs.a1.unit50.lesson01.teach.this_is_pool_phrase:
    title: Esto es una piscina
    gloss: Esto es una piscina.
