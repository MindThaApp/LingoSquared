    title: Predicciones y promesas
lessons:
  prs.a2.unit28.lesson01.weather_predictions:
    title: El tiempo y las predicciones con el presente
  prs.a2.unit28.lesson02.maybe_and_probably:
    title: Quizá y probablemente
  prs.a2.unit28.lesson03.promises:
    title: Promesas
  prs.a2.unit28.lesson04.sure_or_maybe:
    title: Sin duda, probablemente, quizá
  prs.a2.unit28.lesson05.forecast_and_notice:
    title: Leer y escuchar sobre el tiempo
  prs.a2.unit28.lesson06.meeting_conversation:
    title: Una conversación sobre una reunión
teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: El tiempo
    gloss: tiempo (clima), aire
    note: '*هوا* es el tiempo atmosférico y también el aire. *هوای کابل* es el tiempo en Kabul: se añade *-ی* antes del lugar para unir las dos palabras.'
    example_gloss: Hoy hace frío en Kabul.
  prs.a2.unit28.lesson01.teach.cold:
    title: Frío
    gloss: frío
    note: '*سرد* significa «frío». Lo contrario es *گرم* (cálido, caliente), una palabra que ya conoces. *هوا سرد است* dice que hace frío ahora; *هوا سرد می‌شود* dice que se pone frío.'
    example_gloss: Mañana por la mañana hará frío.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Soleado
    gloss: soleado
    note: '*آفتابی* significa «soleado»: *هوا آفتابی است* es «hace un día soleado».'
    example_gloss: Hoy hace sol.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Nublado
    gloss: nublado
    note: '*ابری* significa «nublado». Las nubes suelen venir antes de *باران* (lluvia) y *برف* (nieve).'
    example_gloss: Esta noche se nublará.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Pronóstico
    gloss: pronóstico, predicción
    note: '*پیش‌بینی* es un pronóstico o una predicción. *پیش‌بینی هوا* es el pronóstico del tiempo. Es la palabra que se oye en la radio, en la tele y por teléfono antes de planear un viaje.'
    example_gloss: Vi el pronóstico del tiempo.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Esta noche
    gloss: esta noche
    note: '*امشب* significa «esta noche». Es una palabra de tiempo, como *فردا* (mañana) y *امروز* (hoy). Es la primera de las palabras de tiempo que usas para hablar de lo que va a pasar.'
    example_gloss: Esta noche lloverá.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: Pasado mañana
    gloss: pasado mañana
    note: '*پس‌فردا* significa «pasado mañana». Se escribe con un pequeño espacio dentro de la palabra (el semiespacio), como en *می‌شود*.'
    example_gloss: Pasado mañana hará calor.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'Una predicción: می‌ más una palabra de tiempo'
    gloss: Mañana lloverá. Esta noche hará frío. Pasado mañana estará soleado.
    note: 'Para decir lo que va a pasar, usa el presente simple con *می‌* y pon una palabra de tiempo en la frase. El verbo no cambia: *می‌بارد* (llueve) y *فردا باران می‌بارد* (mañana lloverá) llevan el mismo verbo. La palabra de tiempo *فردا*, *امشب* o *پس‌فردا* es la que indica que se habla del futuro. Para el tiempo atmosférico se usa a menudo *می‌شود* (se vuelve): *فردا هوا سرد می‌شود* es «mañana hará más frío». Es la forma hablada normal de predecir algo de lo que estás bastante seguro.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: La misma forma para planes y sucesos
    gloss: Mañana voy al bazar. La semana próxima vamos a Bamiyán.
    note: 'El mismo presente con *می‌* y una palabra de tiempo sirve también para personas: *فردا به بازار می‌روم* es «mañana iré al bazar», y *هفتهٔ آینده به بامیان می‌رویم* es «la semana próxima iremos a Bamiyán». Aprende aquí la forma de *ما*: *می‌رویم* (vamos). Otras palabras de tiempo: *امسال* (este año), *هفتهٔ آینده* (la semana próxima), *بعد* (después).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Mañana hará frío
    gloss: Mañana hará frío.
    note: 'Este es el patrón de toda la unidad: una palabra de tiempo, un sujeto y un verbo simple con *می‌*. No necesitas ninguna terminación especial de futuro.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Quizá
    gloss: quizá, tal vez
    note: '*شاید* significa «quizá». Va al principio de la oración y el verbo que la sigue está en subjuntivo (la forma que se usa después de *باید*), porque el hablante no está seguro: *شاید برف ببارد* es «quizá nieve». *ممکن است برف ببارد* significa lo mismo.'
    example_gloss: Quizás llueva mañana.
  prs.a2.unit28.lesson02.teach.probably:
    title: Probablemente
    gloss: probablemente, lo más probable
    note: '*احتمالاً* es más fuerte que *شاید*: piensas que es más probable que sí que no. Lleva el presente simple, no el subjuntivo: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Esta noche probablemente nevará.
  prs.a2.unit28.lesson02.teach.possible:
    title: Puede que nieve
    gloss: Puede que nieve.
    note: '*ممکن است* significa «es posible que». Como *شاید*, va seguido del subjuntivo: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'El subjuntivo: ب más la raíz del presente'
    gloss: que yo vaya, que tú vayas, que él vaya, que nosotros vayamos, que ustedes vayan (formal o plural), que ellos vayan
    note: 'El subjuntivo es la raíz del presente con *ب* delante y las mismas terminaciones del presente: *می‌روم* (voy) pasa a *بروم* (que vaya). Las terminaciones son *-م، -ی، -د، -یم، -ین، -ند*, así que se obtiene *بروم، بروی، برود، برویم، بروین، بروند*. Ya conoces esta forma por *باید*; *شاید* usa la misma. No pongas *می‌* delante.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: El subjuntivo de otros verbos
    gloss: Quizá venga. Quizá llegue el autobús. Quizá nieve. Quizá se estropee.
    note: 'La misma regla vale para todos los verbos: *آمدن* da *بیاید* (que venga), *رسیدن* da *برسد* (que llegue), *باریدن* da *ببارد* (que nieve o llueva). *شدن* tiene la forma corta *شود*, y por eso se dice *شاید خراب شود* (quizá se estropee). Con *بودن* el subjuntivo es *باشد*: *شاید در خانه باشد* (quizá esté en casa).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'La negación: ن delante del subjuntivo'
    gloss: Quizá no venga. Quizá no vayamos. Quizá no nieve.
    note: 'Para decir «quizá no», pon *ن* delante del subjuntivo y quita la *ب*: *بروم* pasa a *نروم*, *برویم* pasa a *نرویم*, *ببارد* pasa a *نبارد*. El verbo *آمدن* es el que hay que recordar: su negativo es *نیاید* (no *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Quizá nieve mañana
    gloss: Quizá nieve mañana.
    note: Compárala con *فردا برف می‌بارد*. Aquella frase dice que nevará; esta dice que podría nevar.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Seguro o no seguro
    gloss: Viene mañana. Quizá venga mañana.
    note: 'El verbo indica al oyente cuán seguro estás. Con *می‌* estás seguro: *فردا می‌آید* es «viene mañana». Con *شاید* el verbo va en subjuntivo y no estás seguro: *شاید فردا بیاید* es «quizá venga mañana».'
  prs.a2.unit28.lesson03.teach.surely:
    title: Sin duda
    gloss: sin duda, seguro
    note: '*حتماً* significa «sin duda» o «seguro». Colócalo delante de un verbo simple con *می‌* para hacer una promesa o expresar una decisión firme: *حتماً می‌آیم* es «sin duda vendré».'
    example_gloss: Sin duda vendré mañana.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Promesa
    gloss: promesa, palabra (de honor)
    note: '*قول* es una promesa. *قول می‌دهم* significa «prometo», literalmente «doy una promesa». Puedes añadir *که* y una oración: *قول می‌دهم که می‌آیم*.'
    example_gloss: Prometo que vendré.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: Lo prometo
    gloss: Lo prometo.
    note: '*می‌دهم* significa «doy». Ya conoces *می‌دهین* (das, vosotros/ustedes dan); esta es la forma de *من* (yo). Di *قول می‌دهم* cuando quieras que la otra persona confíe en ti.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Olvidar
    gloss: olvidado; olvidar
    note: '*فراموش کردن* significa «olvidar». Una promesa suele terminar con *فراموش نمی‌کنم* (no lo olvidaré).'
    example_gloss: No olvidaré mi llave.
  prs.a2.unit28.lesson03.teach.later:
    title: Más tarde
    gloss: más tarde, después
    note: '*بعداً* significa «más tarde». Es una palabra de tiempo para una promesa que cumplirás pronto, pero no ahora.'
    example_gloss: Llamaré por teléfono más tarde.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'Una promesa: حتماً más el presente simple'
    gloss: Vendré sin falta. Llamaré sin falta. Ayudaré sin falta. Lo enviaré sin falta.
    note: 'Una promesa tiene dos partes: *حتماً* y un verbo simple con *می‌* en la forma de *من*. No hay ninguna forma especial. La palabra de tiempo puede aparecer o no: *حتماً امشب تیلفون می‌کنم* significa «esta noche llamaré sin falta». Si es una promesa a alguien, puedes añadir antes *قول می‌دهم*.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: ¿Vendrá usted?
    gloss: ¿Vienes? ¿Vendrás?
    note: '*می‌آیی* significa «vienes», dicho a un amigo. El presente con *می‌* pregunta por el futuro igual que lo afirma: *تو می‌آیی؟* significa «¿vendrás?». La respuesta suele ser una promesa: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: Una promesa de no hacer algo
    gloss: No volveré a llegar tarde. Nunca lo olvidaré.
    note: 'Para prometer que no harás algo, usa *نمی‌* con el mismo esquema: *دیگر دیر نمی‌آیم* significa «no vendré tarde nunca más», y *هرگز فراموش نمی‌کنم* significa «nunca lo olvidaré». *دیگر* con un verbo negativo significa «ya no».'
  prs.a2.unit28.lesson03.teach.sentence:
    title: Esta noche llamaré sin falta
    gloss: Esta noche llamaré por teléfono sin falta.
    note: 'Una promesa con una palabra de tiempo: *حتماً*, *امشب* y *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Importante
    gloss: importante
    note: '*مهم* significa «importante». Una *جلسه مهم* es una reunión importante, a la que prometes asistir.'
    example_gloss: Hoy hay una reunión importante.
  prs.a2.unit28.lesson04.teach.ladder:
    title: De la seguridad a la duda
    gloss: Vendrá sin falta. Probablemente vendrá. Quizá venga. Puede que no venga.
    note: 'Elige la palabra según lo seguro que estés. *حتماً* y un verbo simple con *می‌*: seguro. *احتمالاً* y un verbo en presente simple: probablemente. *شاید* y el subjuntivo: quizá. *ممکن است* y el subjuntivo: es posible, y también puede ser negativo: *ممکن است نیاید* (puede que no venga).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Quizá tarde, pero es una promesa
    gloss: Quizá llegue tarde, pero vendré sin falta.
    note: 'Puedes unir un «quizá» y una promesa con *ولی* (pero): *شاید دیر برسم، ولی حتماً می‌آیم*. La primera parte dice de qué no puedes estar seguro; la segunda es lo que prometes. Usa *شاید* para lo que no controlas y *حتماً* para lo que sí.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: Una reunión mañana
    gloss: Mañana hay una reunión. ¿Vendrás?
    note: Una pregunta sobre mañana usa el presente con una palabra de tiempo. La mejor respuesta es una promesa con *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'El futuro escrito: solo para reconocerlo'
    gloss: Hará frío. Nevará. El autobús saldrá. El autobús no irá.
    note: 'En las noticias, los pronósticos y los avisos leerás un futuro escrito: *خواهد* más el infinitivo corto, como en *سرد خواهد بود* (hará frío), *خواهد بارید* (caerá lluvia o nieve), *حرکت خواهد کرد* (saldrá). La forma negativa es *نخواهد*: *نخواهد رفت* (no irá). Solo necesitas entender esta forma cuando la leas. Cuando hables o escribas a un amigo, usa la forma que ya aprendiste: *فردا برف می‌بارد* y *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: Un pronóstico del tiempo
    gloss: 'Pronóstico del tiempo: el viernes hará frío en Bamiyán. Quizá nieve. La semana próxima hará sol.'
    note: Un breve pronóstico de la radio. La primera oración usa el futuro escrito *خواهد بود*. La segunda usa *شاید* y el subjuntivo, porque la nieve no es segura. La tercera usa el simple *می‌شود* con una palabra de tiempo. Juntas muestran cómo un pronóstico expresa lo seguro, lo no seguro y la semana próxima.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: Un aviso para pasajeros
    gloss: 'Aviso para los pasajeros de Bamiyán: la semana próxima, el viernes a las ocho, el autobús saldrá de la estación. Por favor, estén en la estación a las siete. El autobús no saldrá tarde.'
    note: 'Un aviso en la estación de autobuses. Usa el futuro escrito *حرکت خواهد کرد* y el negativo *حرکت نخواهد کرد* para el plan, y una petición cortés con *لطفاً* y el subjuntivo *باشین* (estén). La hora es *ساعت هشت*: el autobús sale a las ocho y los pasajeros deben llegar una hora antes.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Basira pregunta por el pronóstico
    gloss: Nader, ¿viste el pronóstico del tiempo para el viernes?
    note: Basira pregunta por el pronóstico con el pasado simple *دیدی*. *هوای جمعه* es el tiempo del viernes.
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Nader da el pronóstico
    gloss: Sí. El viernes hará frío y quizá nieve.
    note: 'Nader usa las dos formas en una sola oración: el simple *می‌شود* para el frío, que es seguro, y *شاید* con *ببارد* para la nieve, que no es segura.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Basira decide que quizá es mejor no ir
    gloss: Entonces quizá no vayamos a Bamiyán el viernes.
    note: '*شاید* con el subjuntivo negativo *نرویم* significa «quizá no vayamos».'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Nader propone la semana próxima
    gloss: Sí. Iremos la semana próxima. Hará sol.
    note: Nader traslada el viaje a *هفتهٔ آینده* con el simple *می‌رویم* y una palabra de tiempo.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Basira está de acuerdo
    gloss: Bien. La semana próxima iremos sin falta.
    note: 'Basira responde con *حتماً*: está segura de la semana próxima.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Nader promete
    gloss: Lo prometo.
    note: Nader termina con *قول می‌دهم*, una promesa.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Basira pregunta a Nader
    gloss: Nader, mañana hay una reunión importante. ¿Vendrás?
    note: Basira usa el presente con *فردا* para preguntar por mañana. La reunión es *مهم*, así que quiere una respuesta firme.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Nader promete, con una duda
    gloss: Iré sin falta. Pero quizá llegue tarde, porque hay mucho tráfico.
    note: Nader promete con *حتماً می‌آیم* y luego dice de qué no puede estar seguro con *شاید دیر برسم*. *چون* da la razón.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Basira pide una llamada
    gloss: No hay problema. ¿Llamarás esta noche?
    note: 'Basira acepta el riesgo del retraso con *مشکلی نیست* y pide una promesa más: una llamada esta noche.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Nader promete llamar
    gloss: Lo prometo. Esta noche llamaré sin falta. No lo olvidaré.
    note: 'Tres promesas seguidas: *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* y *فراموش نمی‌کنم*.'
