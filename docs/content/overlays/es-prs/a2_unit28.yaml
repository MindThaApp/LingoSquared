  prs.a2.unit28.lesson01.exercise04.order_cold_tomorrow:
    instruction: 'Ordena las palabras para decir: Mañana hará frío.'
    accepted_answers:
    - value:
      - فردا
      - هوا
      - سرد
      - می‌شود
      status: correct
    - value:
      - هوا
      - فردا
      - سرد
      - می‌شود
      status: correct
    feedback: '*فردا هوا سرد می‌شود.* La palabra de tiempo va al principio o después de *هوا*, y el verbo se queda al final.'
  prs.a2.unit28.lesson01.exercise05.complete_rain_tonight:
    instruction: 'Completa la oración: Esta noche lloverá.'
    accepted_answers:
    - value: می‌بارد
      status: correct
    - value: میبارد
      status: correct
    - value: می بارد
      status: correct
