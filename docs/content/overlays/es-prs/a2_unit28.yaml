      status: correct
    feedback: '*فردا برف می‌بارد* significa «mañana nevará»: el presente simple *می‌بارد* más la palabra de tiempo *فردا*.'
  prs.a2.unit28.lesson01.exercise02.recognize_cold_tonight:
    instruction: ¿Qué significa esta frase?
    correct_option: Esta noche hará frío
    distractors:
    - Esta noche hará calor
    - Anoche hizo frío
    - Ahora hace sol
    accepted_answers:
    - value: Esta noche hará frío
      status: correct
    feedback: '*امشب* es «esta noche» y *سرد می‌شود* es «hace frío / se enfría»: *امشب هوا سرد می‌شود*.'
