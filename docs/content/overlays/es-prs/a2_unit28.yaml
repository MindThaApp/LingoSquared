course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: predecir lo que va a pasar y hacer una promesa. El presente simple con una palabra de tiempo (فردا باران می‌بارد), «quizá» y «probablemente» con el subjuntivo, promesas con حتماً y قول می‌دهم, y el futuro escrito para leer pronósticos y avisos.'
