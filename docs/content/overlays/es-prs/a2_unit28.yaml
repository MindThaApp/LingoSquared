  prs.a2.unit28.lesson06.exercise01.comprehend_will_come:
    instruction: Lee la conversación, porque todavía no hay grabación. ¿Irá Nader a la reunión?
    correct_option: Sí, promete ir, pero quizá llegue tarde
    distractors:
    - No, no puede ir
    - Todavía no lo sabe
    - Sí, y llegará temprano
    accepted_answers:
    - value: Sí, promete ir, pero quizá llegue tarde
      status: correct
    feedback: '*حتماً می‌آیم* significa «iré sin falta» y *شاید دیر برسم* significa «quizá llegue tarde».'
  prs.a2.unit28.lesson06.exercise02.comprehend_why_late:
    instruction: Lee la conversación, porque todavía no hay grabación. ¿Por qué podría llegar tarde Nader?
    correct_option: Hay mucho tráfico
    distractors:
    - Su coche está averiado
    - Tiene otra reunión
    - Hace frío
    accepted_answers:
    - value: Hay mucho tráfico
      status: correct
    feedback: '*چون ترافیک زیاد است* significa «porque hay mucho tráfico».'
  prs.a2.unit28.lesson06.exercise03.comprehend_phone:
    instruction: Lee la conversación, porque todavía no hay grabación. ¿Qué promete hacer Nader esta noche?
    correct_option: Llamar a Basira
    distractors:
    - Enviar un mensaje
    - Ir a casa de Basira
    - Comprar un billete
    accepted_answers:
    - value: Llamar a Basira
      status: correct
    feedback: '*حتماً امشب تیلفون می‌کنم* significa «esta noche llamaré sin falta».'
  prs.a2.unit28.lesson06.exercise04.recognize_not_forget:
    instruction: ¿Qué significa esta frase?
    correct_option: No me olvidaré
    distractors:
    - Lo olvidé
    - No lo encuentro
    - Quizá lo olvide
    accepted_answers:
    - value: No me olvidaré
      status: correct
    feedback: '*فراموش نمی‌کنم* significa «no lo olvidaré»: un presente simple con *نمی‌*, usado como promesa.'
  prs.a2.unit28.lesson06.exercise05.order_promise_early:
