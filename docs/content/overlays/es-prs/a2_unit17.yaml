teaching:
  prs.a2.unit17.lesson01.teach.week_word:
    title: Semana
    gloss: semana
    note: '*هفته* significa semana.'
    example_gloss: Esta semana estoy muy ocupado.
  prs.a2.unit17.lesson01.teach.weekend_word:
    title: Fin de semana
    gloss: fin de semana
    note: '*آخر هفته* significa literalmente «final de la semana».'
    example_gloss: El fin de semana descanso.
  prs.a2.unit17.lesson01.teach.schedule_word:
    title: El horario
    gloss: programa
    note: '*برنامه* se usa para un horario, un plan o un programa.'
    example_gloss: Mi horario semanal está muy ocupado.
  prs.a2.unit17.lesson01.teach.first_word:
    title: Primero
    gloss: primero
    note: '*اول* abre una secuencia de pasos.'
    example_gloss: Primero desayuno.
  prs.a2.unit17.lesson01.teach.then_word:
    title: Luego
    gloss: luego
    note: '*بعد* continúa una secuencia después de *اول*.'
    example_gloss: Luego voy a la oficina.
  prs.a2.unit17.lesson01.teach.finally_word:
    title: Por último
    gloss: por último
    note: '*در آخر* cierra una secuencia: *اول ... بعد ... در آخر* es el patrón de secuenciación de nivel A2 de esta unidad.'
    example_gloss: Por último estudio un poco.
  prs.a2.unit17.lesson01.teach.sequence_grammar:
    title: Una oración secuenciada completa
    gloss: Los días laborables, primero voy a la oficina, luego hago ejercicio y por último estudio un poco.
    note: '*اول ... بعد ... و در آخر* ordena tres actividades en una sola oración: es el paso gramatical central de A2 en esta unidad.'
  prs.a2.unit17.lesson01.teach.days_word:
    title: Días laborables
    gloss: días laborables
    note: '*روزهای هفته* (literalmente «los días de la semana») significa los días laborables, en contraste con *آخر هفته*.'
    example_gloss: Los días laborables estoy ocupado con el trabajo.
  prs.a2.unit17.lesson02.teach.ask_weekly_schedule:
    title: Preguntar por el horario semanal de alguien
    gloss: ¿Cómo es tu horario semanal?
    note: '*تو* es el «tú» informal que se usa entre amigos.'
  prs.a2.unit17.lesson02.teach.weekday_full_sentence:
    title: Describir una secuencia de un día laborable
    gloss: Los días laborables primero voy a la oficina, luego hago ejercicio.
    note: Retoma el patrón de secuenciación de la lección 1 con *اول* y *بعد*.
  prs.a2.unit17.lesson02.teach.weekend_activity:
    title: Describir una actividad del fin de semana
    gloss: El fin de semana me levanto tarde y paso tiempo con mi familia.
    note: '*دیر بیدار می‌شوم* («me levanto tarde») contrasta directamente con el despertar temprano de los días laborables en la lectura de la lección 3.'
  prs.a2.unit17.lesson03.teach.difference_word:
    title: Diferencia
    gloss: diferencia
    note: '*تفاوت* significa diferencia.'
    example_gloss: Hay una gran diferencia entre los días laborables y el fin de semana.
  prs.a2.unit17.lesson03.teach.rest_word:
    title: Descansar
    gloss: descansar
    note: '*استراحت کردن* significa descansar o relajarse.'
    example_gloss: El fin de semana descanso.
  prs.a2.unit17.lesson03.teach.comparison_text:
    title: Una breve comparación de la semana de همایون
    gloss: Los días laborables, همایون se levanta temprano y va a la oficina. Pero el fin de semana se levanta tarde y descansa.
    note: Un texto descriptivo breve que contrasta las rutinas de los días laborables y del fin de semana, en el registro de lectura que enseña esta unidad.
  prs.a2.unit17.lesson04.teach.turn01:
    title: زرمینه pregunta por la semana de همایون
    gloss: زرمینه le pregunta cómo es su horario semanal.
    note: Retoma la pregunta exacta de la lección 2 y el registro informal con *تو* ya establecido entre estos dos amigos.
  prs.a2.unit17.lesson04.teach.turn02:
    title: همایون describe sus días laborables
    gloss: Los días laborables primero va a la oficina, luego hace ejercicio.
    note: Retoma la oración exacta de la lección 2.
  prs.a2.unit17.lesson04.teach.turn03:
    title: زرمینه le pregunta por su fin de semana
    gloss: زرمینه le pregunta qué hace el fin de semana.
    note: '*چه کار می‌کنی؟* significa «¿qué haces?».'
  prs.a2.unit17.lesson04.teach.turn04:
    title: همایون describe su fin de semana y le devuelve la pregunta
    gloss: El fin de semana se levanta tarde y pasa tiempo con su familia. Le pregunta lo mismo a ella.
    note: Retoma la oración exacta del fin de semana de la lección 2.
  prs.a2.unit17.lesson04.teach.turn05:
    title: زرمینه describe sus días laborables
    gloss: Los días laborables primero trabaja, luego vuelve a casa y cocina.
    note: '*آشپزی* significa cocina (el acto de cocinar).'
  prs.a2.unit17.lesson04.teach.turn06:
    title: زرمینه describe su fin de semana
    gloss: El fin de semana va al mercado con sus amigas.
    note: '*دوستانم* («mis amigos») añade el sufijo posesivo *-َم* a *دوستان* (amigos).'
  prs.a2.unit17.lesson04.teach.turn07:
    title: همایون aprueba
    gloss: همایون dice que ella tiene un buen horario.
    note: '*برنامهٔ خوبی داری!* significa «¡tienes un buen horario!».'
