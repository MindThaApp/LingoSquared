course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: describir un horario semanal, con conectores de secuencia, el contraste entre los días laborables y el fin de semana, la lectura de una comparación semanal y una conversación real entre dos amigos sobre sus semanas.'
