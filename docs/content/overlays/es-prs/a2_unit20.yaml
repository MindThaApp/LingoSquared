course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: hablar de planes de vacaciones. El presente con una palabra de tiempo para planes cercanos, قصد دارم + subjuntivo para intenciones, شاید + subjuntivo para la duda, la negación y preguntas sobre planes.'
