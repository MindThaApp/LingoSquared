teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Vacaciones
    gloss: las vacaciones / las vacaciones de verano
    note: '*رخصتی* es la palabra de uso cotidiano para vacaciones o tiempo libre, y *رخصتی تابستان* son las largas vacaciones de verano. *تابستان* es el verano.'
    example_gloss:
    - En agosto tengo vacaciones.
    - Las vacaciones de verano empiezan en julio.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: Cuándo ocurre algo
    gloss: la semana que viene / el año que viene / pronto
    note: '*آینده* significa «próximo» o «que viene» y va después del sustantivo: *هفته آینده* es la semana que viene y *سال آینده* es el año que viene. *به‌زودی* significa «pronto».'
    example_gloss:
    - La semana que viene tengo una cita.
    - El año que viene quiero ir a Bélgica.
    - Pronto tengo vacaciones.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Tres verbos de viaje
    gloss: viajar / reservar / quedarse
    note: '*سفر کردن* es «viaje» más *کردن*, y *رزرو کردن* es «reserva» más *کردن*. En una frase solo cambia *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* significa «quedarse».'
    example_gloss:
    - Me gusta viajar en tren.
    - Quiero reservar una habitación.
    - Me quedo una semana.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Dónde alojarse
    gloss: el hotel / el camping
    note: '*هوتل* es la grafía afgana habitual de «hotel». *کمپ* es un camping. Se duerme *در هوتل* o *در کمپ*.'
    example_gloss:
    - El hotel está cerca de la playa.
    - Dormimos en el camping.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Preguntar por los planes de vacaciones
    gloss: ¿Qué vas a hacer en las vacaciones de verano?
    note: 'El dari no tiene ningún auxiliar especial para los planes cercanos: se usa el presente normal *می‌کنی*, y la palabra interrogativa *چه* va antes del verbo, que está al final de la frase.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Planes cercanos: el presente'
    gloss: En agosto voy a viajar a Alemania. Voy a reservar un hotel.
    note: 'Para decir lo que vas a hacer pronto, el dari usa el presente con una palabra de tiempo: *می‌روم* (voy) con *در ماه اگست* (en agosto). Añade el prefijo de presente *می‌* y la terminación *-م* a la raíz: *رزرو می‌کنم*. El verbo va siempre al final de la frase, y la palabra de tiempo puede ir al principio: *هفته آینده یک هوتل رزرو می‌کنم*. Sin palabra de tiempo, la misma forma también puede expresar un hábito cotidiano.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Reservar un hotel
    gloss: Voy a reservar un hotel.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Tres planes para más adelante
    gloss: hacer un curso / mudarse / ahorrar
    note: '*کورس گرفتن* es la expresión fija para «hacer un curso». *کوچ کردن* es «mudarse» a una casa nueva.'
    example_gloss:
    - Quiero hacer un curso.
    - Mi tío quiere mudarse.
    - Quiero ahorrar para una bici nueva.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Más adelante
    gloss: más tarde / dentro de un mes
    note: '*بعد از یک ماه* significa «dentro de un mes». Funciona también con otros periodos: *بعد از یک هفته*.'
    example_gloss:
    - Más adelante quiero comprar una casa.
    - Dentro de un mes empieza mi curso.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: Un curso que empieza
    gloss: Dentro de un mes empieza mi curso.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Intenciones: قصد دارم + subjuntivo'
    gloss: Pienso hacer un curso.
    note: 'Para decir lo que piensas hacer, usa *قصد دارم* (tengo la intención) y después el segundo verbo en subjuntivo: *قصد دارم یک کورس بگیرم*. El subjuntivo es el prefijo *بـ* + la raíz + la terminación personal: *بـ* + *گیر* + *-م* = *بگیرم*. Los verbos compuestos con *کردن* no llevan *بـ*: *پس‌انداز کنم*. Úsalo para lo que quieres hacer, no para cosas ya organizadas.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Pensar mudarse
    gloss: Pienso mudarme.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Pensar ahorrar
    gloss: Pienso ahorrar.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: ¿Presente o قصد دارم?
    gloss: Mañana voy al mercado. Más adelante pienso mudarme.
    note: 'Usa el presente con una palabra de tiempo para el futuro cercano y seguro: *فردا به بازار می‌روم*. Usa *قصد دارم* + subjuntivo para una intención más lejana o menos segura: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Quizás y seguro
    gloss: quizás / seguro
    note: '*شاید* expresa duda y va seguido del subjuntivo. *حتما* significa «seguro» o «sin falta».'
    example_gloss:
    - Quizás llueva mañana.
    - Eso es muy divertido, sin duda.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: Este año, este verano
    gloss: este año / este verano
    note: '*امسال* es una sola palabra para «este año». *این تابستان* es «este verano»: *این* significa «este» y va antes del sustantivo.'
    example_gloss:
    - Este año no me voy de vacaciones.
    - Este verano me quedo en casa.
    - ¿Te vas de vacaciones este año?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Quedarse en casa
    gloss: Este verano me quedo en casa.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید y el subjuntivo
    gloss: Mañana voy a trabajar. Quizás vaya al cine más tarde.
    note: 'Después de *شاید* el verbo va en subjuntivo: *شاید بعد به سینما بروم* (*بـ* + la raíz *رو* + *-م*), no *می‌روم*. El verbo se queda al final de la frase. Después de una simple palabra de tiempo se usa el presente normal: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Decir que no vas a hacer algo
    gloss: No me voy de vacaciones. No pienso mudarme.
    note: 'El presente se niega poniendo *ن* delante del prefijo del verbo: *می‌روم* se convierte en *نمی‌روم*: *به رخصتی نمی‌روم*. Para negar una intención, se niega *دارم*: *قصد ندارم کوچ کنم* (no tengo intención de mudarme); el segundo verbo sigue en subjuntivo.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Dos expresiones interrogativas
    gloss: con quién / cuánto tiempo
    note: '*با کی* pregunta con quién haces algo; *با* significa «con». *چه مدت* pregunta por un periodo de tiempo.'
    example_gloss:
    - ¿Con quién vas a la playa?
    - ¿Cuánto tiempo te quedas?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: ¿Adónde vas?
    gloss: ¿Adónde vas?
    note: '*کجا* significa «dónde» y, con un verbo de movimiento, también «adónde»: *کجا می‌روی؟* La palabra interrogativa va en medio de la frase, justo antes del verbo.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: ¿Con quién?
    gloss: ¿Con quién vas de vacaciones?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: ¿Cuánto tiempo?
    gloss: ¿Cuánto tiempo te quedas allí?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Responder
    gloss: Voy con mi hermana.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Semanas
    gloss: una semana / dos semanas
    note: 'Después de un número, el sustantivo se queda en singular en dari: *دو هفته*, no *دو هفته‌ها*.'
    example_gloss:
    - Me quedo una semana.
    - Nos quedamos dos semanas.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Preguntas sobre planes
    gloss: ¿Adónde vas? ¿Con quién vas? ¿Cuánto tiempo te vas a quedar?
    note: 'Las preguntas en dari mantienen el orden normal de las palabras: pon la palabra interrogativa donde iría la respuesta y deja el verbo al final: *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. Con un amigo, el verbo termina en *-ی*: *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: Un mensaje de Maryam
    gloss: ¡Hola, Zarmina! Pronto tengo vacaciones. En agosto me voy a Bélgica con mi hermana y nos quedaremos una semana en un hotel. Después me voy dos días a casa de mis padres. El año que viene pienso hacer un curso y quizá me mude. ¿Y tú, qué haces?
    note: 'Maryam describe los planes cercanos con el presente y una intención a más largo plazo con *قصد دارم*. Fíjate en que todos los verbos van al final de su frase: *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: pronto
      رخصتی: vacaciones
      اگست: agosto
      خواهرم: hermana
      به: a
      بلجیم: Bélgica
      هوتل: hotel
      می‌مانیم: quedarse
      بعد: después
      والدینم: padres
      روز: días
      آینده: próximo
      سال: año
      قصد: intención (قصد دارم = tengo la intención de)
      کورس: curso
      بگیرم: hacer (un curso)
      شاید: quizás
      کوچ: mudarse
      آن‌وقت: entonces
      هم: también
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Zarmina le pregunta a Homayoun por sus planes
    gloss: 'Zarmina: ¡Hola, Homayoun! ¿Ya tienes planes para las vacaciones de verano?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Homayoun responde
    gloss: 'Homayoun: ¡Sí! En agosto voy a Alemania. Voy a reservar un hotel.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Zarmina le pregunta con quién va
    gloss: 'Zarmina: ¡Genial! ¿Con quién vas?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Homayoun dice con quién y cuánto tiempo
    gloss: 'Homayoun: Con mi tío. Nos vamos a quedar una semana.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Zarmina pregunta por más adelante
    gloss: 'Zarmina: ¿Y después? ¿Qué piensas hacer?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Homayoun dice una intención y pregunta a su vez
    gloss: 'Homayoun: El próximo año pienso hacer un curso. ¿Y tú?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Zarmina responde
    gloss: 'Zarmina: En julio voy a trabajar. Quizás después vaya a casa de mis padres.'
