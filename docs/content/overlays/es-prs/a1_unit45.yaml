  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Número de habitación y cuántas noches
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: Diálogo de registro en el hotel
  prs.a1.unit45.lesson05.reading:
    title: Lectura sobre la reserva de Homayoun
  prs.a1.unit45.lesson06.wrap_up:
    title: Resumen
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Repaso: esto, es, en'
    gloss: esto / es / en
    note: این, است y در (usadas a lo largo del curso) son palabras de repaso para hablar de hoteles y habitaciones.
    target_text: این (esto/este) / است (es/está) / در (en)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: هوتل es la palabra del dari afgano para «hotel», escrita con waw; es distinta de هتل, la forma del persa de Irán.
    example_gloss: Esto es un hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Habitación
    gloss: habitación
    note: اتاق es la palabra de uso cotidiano en dari para «habitación».
    example_gloss: La habitación está en el hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: La habitación está en el hotel
    gloss: La habitación está en el hotel.
    note: اتاق در هوتل است combina las palabras aprendidas antes en esta lección.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Llave
    gloss: llave
    note: کلید es la palabra estándar en dari para «llave».
    example_gloss: Esto es una llave.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Llave de la habitación
    gloss: llave de la habitación
    note: کلید اتاق combina کلید (llave) y اتاق (habitación).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Esta es la llave de la habitación
    gloss: Esta es la llave de la habitación.
    note: این کلید اتاق است combina las palabras aprendidas antes en esta lección.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Repaso: tengo, tiene'
    gloss: tengo / tiene
    note: دارم y دارد son palabras de repaso para preguntar por las características de la habitación.
    target_text: دارم (tengo) / دارد (tiene)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Baño
    gloss: baño
    note: تشناب es la palabra de uso cotidiano en dari para «baño» o «servicio».
    example_gloss: La habitación tiene baño.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: ¿La habitación tiene baño?
    gloss: ¿La habitación tiene baño?
    note: اتاق تشناب دارد؟ es una pregunta de sí o no que se forma con la entonación ascendente, sin palabra interrogativa.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Sí, tiene baño
    gloss: Sí, tiene baño.
    note: بلی es la palabra de repaso para «sí».
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Reserva
    gloss: reserva
    note: رزرو es un préstamo muy extendido para «reserva».
    example_gloss: Tengo una reserva.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: Tengo una reserva
    gloss: Tengo una reserva.
    note: رزرو دارم combina رزرو (reserva) y دارم (tengo).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Repaso: cuántos/qué número, para, quiero'
    gloss: cuántos / qué número / para / quiero
    note: چند, برای y می‌خواهم son palabras de repaso para preguntar por la habitación.
    target_text: چند (cuántos / qué número) / برای (para) / می‌خواهم (quiero)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Número
    gloss: número
    note: نمبر es el préstamo de uso cotidiano en el dari afgano para «número»; se usa para números de habitación, de teléfono y similares.
    example_gloss: número de habitación
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: ¿Cuál es el número de la habitación?
    gloss: ¿Cuál es el número de la habitación?
    note: نمبر اتاق چند است؟ pregunta por el número de la habitación con چند.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Repaso: noche, dos, tres'
    gloss: noche / dos / tres
    note: شب, دو y سه son palabras de repaso para indicar la duración de la estancia.
    target_text: شب (noche) / دو (dos) / سه (tres)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Me quedo
    gloss: me quedo
    note: می‌مانم viene de ماندن, «quedarse» o «permanecer».
    example_gloss: Me quedo dos noches.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Me quedo dos noches
    gloss: Me quedo dos noches.
    note: دو شب می‌مانم combina دو شب (dos noches) y می‌مانم (me quedo).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: La quiero para dos noches
    gloss: Lo quiero para dos noches.
    note: برای دو شب می‌خواهم usa برای («para») con la palabra de repaso می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Repaso: ustedes se quedan (formal)'
    gloss: usted(es) se queda(n) (formal)
    note: می‌مانین es la forma formal-plural de می‌مانم y pertenece a la misma familia en -ین que می‌خواهین y کنین en otras partes de este curso.
    target_text: می‌مانین (usted se queda)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: ¿Cuántas noches se quedan?
    gloss: ¿Cuántas noches se queda(n)?
    note: چند شب می‌مانین؟ es la pregunta formal que haría un recepcionista de hotel.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Repaso: bienvenido, ¿cómo se llama?, soy'
    gloss: bienvenido / ¿cómo se llama? / soy
    note: خوش آمدین, نام‌تان چیست؟ y استم son palabras de repaso que se usan al registrarse en un hotel.
    target_text: خوش آمدین (bienvenido/a) / نام‌تان چیست؟ (¿cómo se llama usted?) / استم (soy)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Repaso: también, ¿y…?, aquí tiene, muchas gracias'
    gloss: también / ¿y…? / aquí tiene / muchas gracias
    note: هم, چطور, بفرمایین y تشکر زیاد (de unidades anteriores) son palabras de repaso que se usan para cerrar el diálogo.
    target_text: هم (también) / چطور (qué tal) / بفرمایین (aquí tiene) / تشکر زیاد (muchas gracias)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: El desayuno
    gloss: el desayuno
    note: چای صبح significa literalmente «té de la mañana»; es la forma cotidiana de decir «desayuno» en el dari de Afganistán, formada con چای (té, Unidad 8) y صبح (mañana, Unidad 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: Incluido
    gloss: incluido
    note: شامل significa «incluido» y se usa para decir que un servicio viene con la habitación.
    example_gloss: El desayuno está incluido.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wifi
    gloss: wifi
    note: وای‌فای es el préstamo estándar para «wifi».
    example_gloss: También tiene wifi.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hola. Tengo una reserva. Me quedo dos noches.'
    gloss: Hola. Tengo una reserva. Me quedo dos noches.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Recepcionista: Bienvenido. ¿Cómo se llama usted?'
    gloss: Bienvenido. ¿Cómo se llama usted?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Soy Homayoun.'
    gloss: Soy Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Recepcionista: Muy bien. La habitación tiene baño y el desayuno está incluido.'
    gloss: Muy bien. La habitación tiene baño y el desayuno está incluido.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: ¿Y el wifi?'
    gloss: ¿Y el wifi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Recepcionista: Sí, también tiene wifi. Aquí tiene la llave.'
    gloss: Sí, también tiene wifi. Aquí tiene la llave.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Repaso: reserva, número, cinco, lunes, martes, y'
    gloss: reserva / número / cinco / lunes / martes / y
    note: رزرو, نمبر (de esta unidad), پنج, دوشنبه, سه‌شنبه y و son palabras de repaso que se usan en el texto de lectura.
    target_text: رزرو (reserva) / نمبر (número) / پنج (cinco) / دوشنبه (lunes) / سه‌شنبه (martes) / و (y)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Repaso: él/ella se queda'
    gloss: él/ella se queda
    note: می‌ماند es la forma de tercera persona de la familia می‌مانم/می‌مانین que se vio antes en esta unidad.
    target_text: می‌ماند (él/ella se queda)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: Lectura sobre la reserva de Homayoun
    gloss: 'Esta es la reserva de Homayoun. La habitación es la número cinco. Homayoun se queda dos noches: lunes y martes. La habitación tiene baño y el desayuno está incluido.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Repaso: pero, usted (formal), hora, tiempo, siete, doce'
    gloss: pero / usted (formal) / hora / tiempo / siete / doce
    note: اما, شما, ساعت, وقت (de unidades anteriores) y هفت/دوازده son palabras de repaso que se usan para indicar un horario.
    target_text: اما (pero) / شما (usted) / ساعت (hora) / وقت (tiempo) / هفت (siete) / دوازده (doce)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Salida / check-out
    gloss: salida / check-out
    note: خروج indica la salida del hotel, como en وقت خروج.
    example_gloss: hora de salida
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: La hora de salida es a las doce
    gloss: La hora de salida es a las doce.
    note: وقت خروج ساعت دوازده است indica la hora de salida del hotel.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: El desayuno es a las siete, pero la salida es a las doce
    gloss: El desayuno es a las siete, pero la hora de salida es a las doce.
    note: اما contrasta la hora del desayuno con la hora de salida.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: ¿Cuál es su hora de salida?
    gloss: ¿Cuál es su hora de salida?
    note: Es la versión formal, con شما («usted»), para preguntar por la hora de salida.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (muy bien) / چای (té) / صبح (mañana) / و (y)
