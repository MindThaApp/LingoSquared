course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: registrarte en un hotel, preguntar por las características de la habitación (baño, desayuno, wifi) y la llave, decir cuántas noches te quedas, leer una breve confirmación de reserva y preguntar por la hora de salida.'
units:
  prs.a1.unit45.accommodation:
    title: Hotel y habitación
    description: Registrarte en un hotel, preguntar por las características de la habitación y la llave, indicar la duración de la estancia, leer una confirmación de reserva y preguntar por la hora de salida.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
    title: Hotel, habitación y llave
  prs.a1.unit45.lesson02.bathroom_and_reservation:
