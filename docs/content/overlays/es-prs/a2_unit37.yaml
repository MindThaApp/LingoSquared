course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: hablar de lo que pasa o pasará si se cumple una condición, por ejemplo si llueve mañana o si tienes el recibo. اگر más el subjuntivo, con una oración principal en presente o una orden; planes según el tiempo y políticas de las tiendas.'
