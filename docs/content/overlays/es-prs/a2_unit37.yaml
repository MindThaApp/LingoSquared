teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: El tiempo
    gloss: tiempo (clima), aire
    note: '*هوا* es el tiempo atmosférico y también el aire. *هوا خوب است* significa «hace buen tiempo» y *هوا بد است* significa «hace mal tiempo».'
    example_gloss: Hoy hace buen tiempo.
  prs.a2.unit37.lesson01.teach.cold:
    title: Frío
    gloss: frío
    note: '*سرد* significa «frío». Su opuesto es *گرم* (cálido, caliente), que ya conoces.'
    example_gloss: Hoy hace frío.
  prs.a2.unit37.lesson01.teach.outside:
    title: Afuera
    gloss: afuera
    note: '*بیرون* significa «fuera, afuera». *بیرون می‌روم* es «salgo afuera» y *بیرون از خانه* es «fuera de la casa».'
    example_gloss: Estoy fuera de la casa.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: una condición real'
    gloss: Si hace buen tiempo, voy al parque. Si llueve, me quedo en casa.
    note: '*اگر* significa «si». Introduce una condición que puede cumplirse de verdad, y el verbo de la condición va en subjuntivo: *باشد*, *ببارد*. Es la misma forma que aparece después de *باید*: un verbo con *ب-* delante del tema de presente (*ببارد*), y *باشد* para *بودن*, que no lleva *ب-*. La oración principal dice qué pasa y usa el presente simple con *می‌*: *به پارک می‌روم*. El presente con *می‌* también sirve para el futuro, así que no necesitas una forma especial de futuro. Pon una coma después de la condición.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: El subjuntivo de رفتن después de اگر
    gloss: si voy, si vas, si él o ella va, si vamos, si van (usted o ustedes), si van (ellos)
    note: 'El tema de presente de *رفتن* es *رو*. Pon *ب-* delante y añade las terminaciones: *بروم* (yo), *بروی* (tú, a un amigo), *برود* (él, ella), *برویم* (nosotros), *بروین* (usted o ustedes), *بروند* (ellos). Todos los verbos llevan las mismas seis terminaciones: *-م، -ی، -د، -یم، -ین، -ند*. La terminación *-ین* es la de usted o ustedes. También se entienden las formas con *-ید*, pero este curso escribe *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: Si nieva, no salgo
    gloss: Si nieva, no salgo.
    note: 'La oración principal puede ser negativa. Pon *نمی‌* delante del tema de presente: *نمی‌روم* significa «no voy». La condición no cambia: *اگر برف ببارد* significa «si nieva».'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: Si hace frío, me quedo en casa
    gloss: Si hace frío, me quedo en casa.
    note: '*اگر هوا سرد باشد* significa «si hace frío». Con *هوا* y un adjetivo, la condición siempre termina en *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Fin de semana
    gloss: fin de semana
    note: '*آخر هفته* es el fin de semana. *آخر* significa «final» y *هفته* es «la semana».'
    example_gloss: El fin de semana vamos al parque.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Esta noche
    gloss: esta noche
    note: '*امشب* significa «esta noche». Es una palabra de tiempo, así que la oración principal con *می‌* puede usarla: *امشب می‌روم* significa «esta noche voy».'
    example_gloss: Esta noche voy al cine.
  prs.a2.unit37.lesson02.teach.formation:
    title: El subjuntivo de otros verbos
    gloss: que compre, que tome, que dé, que venga, que me quede, que coma
    note: 'La regla de *رفتن* sirve para todos los verbos: tema de presente con *ب-* delante y después las terminaciones. *خر* da *بخرم* (compro), *گیر* da *بگیرم* (tomo), *ده* da *بدهم* (doy), *مان* da *بمانم* (me quedo), *خور* da *بخورم* (como). *آمدن* es el que debes recordar: su subjuntivo es *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, con una *ی* extra. Después de *اگر*, cada una significa «si compro», «si tomo», etc.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: El subjuntivo de بودن y داشتن
    gloss: que yo sea, que tú seas, que él/ella sea, que seamos, que sean (usted o ustedes), que sean (ellos)
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* son las seis formas del subjuntivo de *بودن*; no llevan *ب-*. Para decir «si tengo», el dari usa *داشته باشم*: el participio *داشته* más *باشم*. Así, *اگر وقت داشته باشم* significa «si tengo tiempo» y *اگر پول داشته باشی* significa «si tienes dinero». Para una situación futura posible, esta es la forma habitual.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: Si tengo dinero, compro un libro
    gloss: Si tengo dinero, compro un libro.
    note: '*اگر پول داشته باشم* significa «si tengo dinero». La oración principal está en presente simple: *کتاب می‌خرم* significa «compro un libro» o «voy a comprar un libro».'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'La negación: ن en lugar de ب'
    gloss: si no voy, si no vengo, si no compro, si no es, si no llueve
    note: 'Para negar la condición, cambia *ب-* por *ن-*: *بروم* pasa a *نروم*, *بخرم* pasa a *نخرم* y *بیایم* pasa a *نیایم*. *باشد* y *ببارد* pasan a *نباشد* y *نبارد*. Así, *اگر باران نبارد* significa «si no llueve».'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: Si viene mi amigo, jugamos juntos al fútbol
    gloss: Si viene mi amigo, jugamos juntos al fútbol.
    note: 'La condición lleva *بیاید* (el subjuntivo de *آمدن* para él o ella). Ahora la oración principal habla de «nosotros»: *می‌کنیم* significa «hacemos» o «jugamos», y *می‌رویم* significa «vamos». *با هم* significa «juntos».'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: Si no llueve, vamos al parque
    gloss: Si no llueve, vamos al parque.
    note: '*اگر باران نبارد* significa «si no llueve». La oración principal es afirmativa, y *می‌رویم* significa «vamos».'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: Si tengo tiempo, esta noche voy al cine
    gloss: Si tengo tiempo, esta noche voy al cine.
    note: Una condición sobre tener tiempo usa *داشته باشم*. La palabra de tiempo *امشب* en la oración principal indica que el plan es para esta noche.
  prs.a2.unit37.lesson03.teach.clothes:
    title: La ropa
    gloss: ropa, prenda
    note: '*لباس* significa «ropa» o «una prenda». *لباس گرم* es «ropa de abrigo», para el tiempo frío.'
    example_gloss: Tengo ropa de abrigo.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'La orden: después de اگر, la oración principal puede ser una orden'
    gloss: toma (a un amigo, a usted o a ustedes), ponte, ven, llama por teléfono
    note: 'La oración principal también puede ser una orden. A un amigo, la orden es *ب-* más el tema de presente, sin terminación: *بگیر* (toma), *بپوش* (ponte), *بیا* (ven). A una persona a la que se trata de usted o a varias personas, se añade *-ین*: *بگیرین، بپوشین، بیایین*. Los verbos de dos palabras no llevan *ب-*: *تیلفون کن* (a un amigo), *تیلفون کنین* (a usted o a ustedes). Así, *اگر باران ببارد، چتر بگیر* significa «si llueve, toma un paraguas».'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: La orden negativa
    gloss: no vayas, no vengas, no hagas (a un amigo, a usted o a ustedes)
    note: 'Una orden negativa usa *ن-* en lugar de *ب-*: *نرو* (no vayas), *نیا* (no vengas), *نکن* (no hagas). Las formas para usted o ustedes añaden *-ین*: *نروین، نیایین، نکنین*. Por ejemplo, *اگر باران ببارد، بیرون نرو* significa «si llueve, no salgas».'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'El presente en la condición: lo que es verdad ahora'
    gloss: Si tienes tiempo, ven. Si tienes frío, ponte ropa de abrigo.
    note: 'Cuando la condición es algo cierto en este momento, puede usar el presente normal en lugar del subjuntivo: *اگر وقت داری* (si tienes tiempo ahora) y *اگر سردت است* (si tienes frío). *اگر وقت داشته باشی* también es correcto y suena más a una situación futura posible. Quien tiene frío dice *سردم است*; *سردت است* significa «tienes frío».'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: Si llueve, toma un paraguas
    gloss: Si llueve, toma un paraguas.
    note: 'La condición está en subjuntivo, *ببارد*, y la oración principal es una orden a un amigo: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: Si llegas tarde, llama
    gloss: Si llegas tarde, llama por teléfono.
    note: '*دیر شوی* es el subjuntivo de *دیر شدن* para ti (amigo): «si te haces tarde», es decir, «si llegas tarde». *تیلفون کن* es la orden a un amigo.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: Si tiene un problema, llame
    gloss: Si tiene algún problema, llame por teléfono.
    note: 'Al dirigirse a un cliente o a varias personas, se usa *-ین* en las dos oraciones: *دارین* (tiene) y *کنین* (haga una llamada). Una tienda diría esto en un aviso.'
  prs.a2.unit37.lesson04.teach.item:
    title: Mercancía, artículo
    gloss: mercancía, artículo, producto
    note: '*کالا* es la mercancía o un artículo que compras en una tienda.'
    example_gloss: Este artículo está roto.
  prs.a2.unit37.lesson04.teach.customer:
    title: Cliente
    gloss: cliente
    note: '*مشتری* significa «cliente». El plural es *مشتریان*, con la terminación *-ان* para personas.'
    example_gloss: El cliente está en la tienda.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Recibo
    gloss: recibo
    note: '*رسید* es el recibo, el papel que muestra lo que pagaste. Se parece al pasado de *رسیدن* (llegó), pero en una tienda significa «recibo».'
    example_gloss: ¿Tiene el recibo con usted?
  prs.a2.unit37.lesson04.teach.exchange:
    title: Cambiar
    gloss: cambiar, canjear
    note: '*عوض کردن* es cambiar o canjear algo. Se pone la cosa y *را* delante: *کالا را عوض می‌کنم* significa «cambio el artículo».'
    example_gloss: Quiero cambiar el libro.
  prs.a2.unit37.lesson04.teach.give_back:
    title: Devolver
    gloss: devolver, reembolsar
    note: '*پس دادن* es devolver. Una tienda que devuelve el dinero dice *پول را پس می‌دهیم* (devolvemos el dinero).'
    example_gloss: Devolvemos el dinero.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Poder: می‌توانم'
    gloss: puedo, puedes, él/ella puede, podemos, pueden (usted o ustedes), pueden (ellos)
    note: '*می‌توانم* significa «puedo» y siempre se escribe con *می‌* y un pequeño espacio. Las seis formas son *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. El verbo siguiente va en subjuntivo, con la misma persona: *می‌توانیم عوض کنیم* significa «podemos cambiar». Para la negación, pon *ن* delante: *نمی‌توانیم* significa «no podemos».'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Normas de la tienda con اگر
    gloss: Si el artículo está roto, lo cambiamos. Si tiene el recibo con usted, podemos cambiar el artículo.
    note: 'Las tiendas usan *اگر* para decir qué hacen en cada caso. La condición lleva *باشد* (*خراب باشد*, *همراه‌تان باشد*), y la oración principal es un presente simple (*عوض می‌کنیم*) o *می‌توانیم* con subjuntivo. *همراه‌تان باشد* significa «lo tiene con usted» (literalmente: «está con usted»).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'Una norma con negación: sin recibo'
    gloss: Si no tiene recibo, no podemos devolver el dinero.
    note: '*نداشته باشین* es la negación de *داشته باشین* (si tiene). La oración principal también es negativa: *نمی‌توانیم پول را پس بدهیم* significa «no podemos devolver el dinero». Al dirigirse a un cliente, la tienda usa *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: Si lo trae en siete días, cambiamos el artículo
    gloss: Si lo trae en siete días, cambiamos el artículo.
    note: '*تا هفت روز* significa «hasta siete días». *بیاورین* es el subjuntivo de *آوردن* para usted o ustedes: «si trae».'
  prs.a2.unit37.lesson05.teach.notice:
    title: Un aviso en una tienda
    gloss: Un aviso de una tienda para los clientes sobre cambios de artículos y devolución del dinero.
    note: 'Este es el tipo de aviso que se ve en una tienda. Lee fijándote en las condiciones: qué hace la tienda si tiene el recibo, si el artículo está roto, si no tiene recibo y si tiene un problema. Cada norma es una oración con *اگر* más una oración principal.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Zeynab pregunta por mañana
    gloss: Shahin, ¿qué haces mañana?
    note: Zeynab le pregunta a su amigo por sus planes con la pregunta *فردا چه می‌کنی؟* («¿qué haces mañana?»), usando el presente para el futuro.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Shahin da dos planes
    gloss: Si hace buen tiempo, voy al parque con mis amigos. Si llueve, me quedo en casa.
    note: Shahin tiene dos condiciones con dos planes. Las dos condiciones usan el subjuntivo (*باشد، ببارد*) y las dos oraciones principales usan el presente (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Zeynab quizá vaya
    gloss: Si tengo tiempo, yo también voy.
    note: '*داشته باشم* es el subjuntivo de «si tengo». *من هم* significa «yo también».'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Shahin la invita
    gloss: ¡Genial! Si vienes, también jugaremos al fútbol.
    note: '*بیایی* es el subjuntivo de *آمدن* para ti (amigo). La oración principal habla de «nosotros»: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Zeynab pregunta por la hora
    gloss: ¿A qué hora se van?
    note: '*می‌روین* significa «ustedes van» (o «usted va», en trato formal): Zeynab pregunta por todo el grupo.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Shahin le pide que llame por teléfono
    gloss: A las diez. Si llegas tarde, llama.
    note: La condición es *دیر شوی* y la oración principal es la orden *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Zeynab hace su propia oferta
    gloss: Bien. Si llueve, yo llamo.
    note: 'Zeynab también usa *اگر* con *ببارد* y una oración principal en presente: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Fariba explica su problema
    gloss: Disculpe, ayer compré un paraguas en esta tienda. El paraguas está roto.
    note: Fariba empieza con cortesía usando *ببخشین*. Dice que el paraguas está *خراب* y que lo compró *دیروز*.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: El dependiente plantea una condición
    gloss: Si trae el recibo, podemos cambiarlo.
    note: 'La tienda usa el patrón del aviso: una condición con *باشد* y *می‌توانیم* más el subjuntivo. *آن را* significa «lo».'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: Fariba tiene el recibo
    gloss: Sí, aquí está el recibo.
    note: '*رسید این است* significa «aquí está el recibo». *بلی* significa «sí».'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: El dependiente ofrece dos opciones
    gloss: Muy bien. Si quiere otro paraguas, llévese uno. Si no quiere, le devolvemos su dinero.
    note: 'Dos condiciones, ambas con el presente: *اگر ... می‌خواهین* (si quiere) con la orden *بگیرین*, y *اگر نمی‌خواهین* (si no quiere) con *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Fariba elige
    gloss: Me llevo otro paraguas. Gracias.
    note: 'Fariba responde en presente: *می‌گیرم* significa «me llevo» y indica que ya ha decidido.'
  prs.a2.unit37.lesson06.teach.want:
    title: Si no quiere otro paraguas, le devolvemos su dinero
    gloss: Si no quiere otro paraguas, le devolvemos su dinero.
    note: 'Para un deseo presente, la condición puede usar el presente normal: *می‌خواهین* significa «quiere» y *نمی‌خواهین* significa «no quiere». La oración principal dice lo que hace la tienda.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: ¿Qué significa esta frase?
    correct_option: Si hace buen tiempo, voy al parque
    distractors:
    - Si llueve, voy al parque
    - Hacía buen tiempo, así que fui al parque
    - No voy al parque
    accepted_answers:
    - value: Si hace buen tiempo, voy al parque
      status: correct
    feedback: '*اگر هوا خوب باشد* significa «si hace buen tiempo», y *به پارک می‌روم* es lo que ocurre entonces.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: ¿Qué significa esta frase?
    correct_option: Si llueve, me quedo en casa
    distractors:
    - Si llueve, salgo
    - Llovió, así que me quedé en casa
    - Nunca me quedo en casa
    accepted_answers:
    - value: Si llueve, me quedo en casa
      status: correct
    feedback: '*اگر باران ببارد* significa «si llueve», y *در خانه می‌مانم* significa «me quedo en casa».'
  prs.a2.unit37.lesson01.exercise03.complete_warm:
    instruction: 'Completa la oración: Si hace calor, salgo.'
    accepted_answers:
    - value: باشد
      status: correct
    feedback: '*باشد* es el subjuntivo de *بودن*. Después de *اگر هوا گرم* forma la condición: si hace calor.'
  prs.a2.unit37.lesson01.exercise04.match_subjunctive_weather:
    instruction: Une cada palabra en dari con su significado.
    accepted_answers:
    - value:
        اگر بروم: si voy
        اگر بروی: si vas (a un amigo)
        اگر برود: si él, ella o eso va
        اگر برویم: si vamos
        اگر بروین: si van (formal o plural)
        اگر بروند: si ellos van
        هوا: el tiempo (meteorológico)
        سرد: frío
        بیرون: afuera
      status: correct
    feedback: 'Solo cambia la terminación del subjuntivo según la persona: *-م* yo, *-ی* tú (amigo), *-د* él o ella, *-یم* nosotros, *-ین* usted o ustedes (formal o plural), *-ند* ellos.'
    pairs:
    - left: اگر بروم
      right: si voy
    - left: اگر بروی
      right: si vas (a un amigo)
    - left: اگر برود
      right: si él, ella o eso va
    - left: اگر برویم
      right: si vamos
    - left: اگر بروین
      right: si van (formal o plural)
    - left: اگر بروند
      right: si ellos van
    - left: هوا
      right: el tiempo (meteorológico)
    - left: سرد
      right: frío
    - left: بیرون
