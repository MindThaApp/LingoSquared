course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: cómo gestionar una cita formal para registrar una nueva dirección en la oficina del ayuntamiento: vocabulario, pedir la cita, leer un aviso oficial y la cita en sí.'
units:
  prs.a2.unit09.bureaucracy:
    title: Trámites administrativos
lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Palabras para tratar con una oficina
  prs.a2.unit09.lesson02.making_an_appointment:
    title: Pedir una cita
  prs.a2.unit09.lesson03.reading_the_notice:
    title: Lectura del aviso
  prs.a2.unit09.lesson04.at_the_municipality_office:
    title: En la oficina del ayuntamiento
teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: Cita
    gloss: cita / hora disponible
    note: '*وقت* significa literalmente «tiempo»; *وقت گرفتن* (pedir una cita) es la forma cotidiana de decir «pedir cita».'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: Documento
    gloss: documento
    note: '*سند* es la palabra general para un documento oficial.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: Dirección
    gloss: dirección
    note: '*آدرس* es la palabra cotidiana para la dirección de una casa.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: Cédula de identidad nacional
    gloss: cédula de identidad nacional (tazkira)
    note: '*تذکره*, el documento que se actualiza en esta unidad, es la cédula de identidad nacional de Afganistán, un documento distinto de la *کارت ملی* de Irán.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: Ayuntamiento
    gloss: ayuntamiento
    note: '*شاروالی* es el término afgano para la oficina del ayuntamiento de la ciudad, distinto de *شهرداری* en el persa de Irán.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace más común y se usa a lo largo de toda esta unidad.'
    target_text: و (y)
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: Pedir una cita
    gloss: Quería pedir una cita para cambiar mi dirección.
    note: '*می‌خواستم* (literalmente «quería») suaviza una petición y la vuelve más cortés.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: Explicar el motivo con چون (porque)
    gloss: Como me he mudado de casa, tengo que cambiar mi dirección.
    note: '*چون* («porque») introduce la oración de causa, que va seguida del resultado.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Preguntar con cortesía qué hay que traer
    gloss: ¿Podría decirme qué tengo que traer?
    note: '*می‌شود بگویین...؟* («¿podría decirme...?») es una forma cortés de pregunta indirecta.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: Recibo del alquiler
    gloss: recibo del alquiler
    note: '*رسید کرایه خانه* es el recibo del alquiler de la vivienda, uno de los documentos aceptados como prueba de residencia.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: Plazo
    gloss: plazo
    note: '*مهلت* es la palabra general para un plazo o límite de tiempo.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: Un aviso de la oficina sobre el cambio de dirección
    gloss: Para cambiar su dirección, traiga por favor su cédula de identidad nacional y un recibo del alquiler. El plazo de registro termina a finales de este mes.
    note: Un aviso oficial breve, en el registro formal escrito que se trabaja en esta unidad.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: Decir lo que vas a traer
    gloss: Traeré el recibo del alquiler.
    note: '*می‌آورم* significa «traigo».'
  prs.a2.unit09.lesson04.teach.turn01:
    title: El funcionario saluda a کریم
    gloss: El funcionario lo invita a pasar y le pregunta en qué puede servirle.
    note: '*بفرمایین* lo invita a acercarse; *چه خدمتی می‌توانم برایتان انجام بدهم؟* es una forma cortés y formal en que un funcionario ofrece ayuda.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: کریم pide una cita
    gloss: کریم dice que quisiera pedir una cita para cambiar su dirección.
    note: Es el mismo patrón de petición cortés con *می‌خواستم* de antes.
  prs.a2.unit09.lesson04.teach.turn03:
    title: El empleado pregunta desde cuándo
    gloss: El funcionario le pregunta desde cuándo vive en la casa nueva.
    note: '*از کی...؟* significa «¿desde cuándo...?».'
  prs.a2.unit09.lesson04.teach.turn04:
    title: کریم responde y pregunta qué debe traer
    gloss: Dice que desde el mes pasado y pregunta qué debe traer.
    note: Combina *از ماه گذشته* («desde el mes pasado») con la pregunta cortés *می‌شود بگویین...؟*.
  prs.a2.unit09.lesson04.teach.turn05:
    title: El empleado enumera los documentos
    gloss: El funcionario dice que basta con la cédula de identidad nacional y un recibo del alquiler.
    note: '*کافی است* significa «es suficiente».'
  prs.a2.unit09.lesson04.teach.turn06:
    title: کریم propone un día
    gloss: Pregunta si puede ir el martes.
    note: '*می‌توانم...؟* pregunta por la posibilidad o el permiso.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: El empleado confirma y da un código de seguimiento
    gloss: 'El funcionario confirma el martes a las diez y le da el número de seguimiento: tres mil cincuenta.'
    note: '*نمبر پیگیری* es el número de seguimiento o referencia de la cita: *نمبر* es un préstamo afgano común del inglés «number», unido a *پیگیری* (seguimiento); *بلی* es la palabra dari para «sí».'
