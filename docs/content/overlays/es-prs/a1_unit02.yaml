course:
  title: Darí A1
  description: 'Dari afgano para principiantes: intercambiar nombres, decir de dónde eres y a qué te dedicas, presentar a una tercera persona y usar correctamente los tratamientos y el registro cortés en un primer encuentro.'
units:
  prs.a1.unit02.introductions:
    title: Presentaciones y primeros contactos
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Pregunta y di tu nombre
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Pregunta por la ciudad natal y el país
  prs.a1.unit02.lesson03.occupation:
    title: Pregunta por el trabajo de alguien
  prs.a1.unit02.lesson04.introducing_others:
    title: Presenta a una tercera persona
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Usa los tratamientos de cortesía y el registro adecuado
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Conoce gente en una reunión
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Pregunta el nombre con cortesía
    gloss: ¿Cómo se llama usted?
    note: نام‌تان چیست؟ es la forma respetuosa para un adulto que acabas de conocer y continúa el registro شما/استین de la Unidad 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Di tu nombre con است
    gloss: Me llamo Faridun.
    note: نام من ... است es la forma escrita de decir el nombre. En la conversación se suele decir نامم ... است (نامم = نام + -م, mi nombre). Ambas son correctas.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Di tu nombre con استم
    gloss: Soy Faridun.
    note: استم va justo después del nombre; es la misma cópula de primera persona del dari que viste en la Unidad 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Pregunta el nombre a un amigo cercano
    gloss: ¿Cómo te llamas?
    note: نامت چیست؟ usa el posesivo informal -ت. Resérvalo para un igual o un amigo cercano, igual que تو/استی en la Unidad 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: La palabra para «nombre»
    gloss: nombre
    note: نام es el sustantivo que aparece solo en las preguntas anteriores, tanto la cortés como la informal.
    example_gloss: ¿Cómo te llamas?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Posesivo de cortesía y posesivo de amigo cercano
    gloss: -تان para alguien a quien tratas con respeto; -ت para un amigo cercano.
    note: La misma distinción de registro de la Unidad 1 (شما/تو) se aplica a las terminaciones posesivas de نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Preguntar de dónde es alguien
    gloss: ¿De dónde eres?
    note: شما از کجا استین؟ mantiene la pareja respetuosa شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Di que eres de Kabul
    gloss: Soy de Kabul.
    note: من از کابل استم sigue el patrón من از [lugar] استم, válido para cualquier ciudad.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Di que eres de Herat
    gloss: Soy de Herat.
    note: هرات es una de las principales ciudades del oeste de Afganistán.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Di que eres de Mazar-i-Sharif
    gloss: Soy de Mazar-i-Sharif.
    note: مزار شریف se escribe en dos palabras y es una de las principales ciudades del norte de Afganistán.
  prs.a1.unit02.lesson02.teach.country:
    title: Afganistán
    gloss: Afganistán
    note: افغانستان se usa igual que el nombre de una ciudad, después de از.
    example_gloss: Soy de Afganistán.
  prs.a1.unit02.lesson02.teach.city_word:
    title: La palabra para «ciudad»
    gloss: ciudad
    note: شهر designa una ciudad en general, a diferencia del nombre de una ciudad concreta.
    example_gloss: Kabul es una ciudad grande.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Pregunta a qué se dedica alguien
    gloss: ¿A qué se dedica usted?
    note: کار شما چیست؟ pregunta literalmente «¿cuál es su trabajo?», la forma habitual de preguntar por la profesión.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Médico
    gloss: médico
    note: داکتر es el término habitual en dari para esta profesión; se usa para médicos y, de manera informal, también para quienes tienen un doctorado.
    example_gloss: Él/ella es médico.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Profesora
    gloss: maestro/maestra
    note: معلم es un término general para «maestro/profesor» en cualquier nivel escolar.
    example_gloss: Es maestro/maestra.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Ingeniero
    gloss: ingeniero
    note: مهندس abarca a los ingenieros en general, sin indicar una especialidad concreta.
    example_gloss: Él/ella es ingeniero/a.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Tendero
    gloss: tendero
    note: دوکاندار (de دوکان, tienda) es el término cotidiano en Kabul; este curso usa la forma dari دوکان y no la مغازه del persa de Irán.
    example_gloss: Es tendero/tendera.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Indica tu profesión
    gloss: Soy profesor.
    note: من [profesión] استم es el patrón para cualquier profesión que se enseña en esta lección.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Presenta a alguien de manera formal
    gloss: Permítame presentarle a mi colega.
    note: اجازه بدهین همکارم را معرفی کنم es una forma respetuosa de incluir a una tercera persona en la conversación.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Di el nombre de la persona que presentas
    gloss: Esta es mi colega Arezoo.
    note: این [persona] است indica directamente quién es la persona que se presenta.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Di que te alegra conocer a alguien
    gloss: Mucho gusto.
    note: از آشنایی با شما خوش شدم es la misma frase de primer encuentro de la Unidad 1, reutilizada aquí tras presentar a una tercera persona.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Responde que a ti también te alegra
    gloss: Encantado/a yo también.
    note: من هم خوش شدم es la respuesta breve y natural.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Amigo
    gloss: amigo
    note: دوست es una palabra general para «amigo», sin indicar el grado de cercanía.
    example_gloss: Es mi amigo/amiga.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Colega
    gloss: colega
    note: همکار designa a un compañero de trabajo y ya apareció en el diálogo laboral de la Unidad 1.
    example_gloss: Es mi colega.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Señor
    gloss: señor
    note: جناب precede al nombre o título de un hombre como forma respetuosa de tratamiento y es común en el uso urbano cotidiano de Afganistán.
    example_gloss: Señor, adelante, por favor.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Señora
    gloss: señora
    note: خانم precede al nombre de una mujer y se usa sin importar su estado civil.
    example_gloss: Señora, adelante, por favor.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Dirígete a un hombre con cortesía
    gloss: señor Faridun
    note: جناب más un nombre de pila es un tratamiento cortés habitual y no exige necesariamente el apellido.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Dirígete a una mujer con cortesía
    gloss: señora Arezoo
    note: خانم más un nombre de pila funciona igual que جناب con un hombre.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Cuándo usar cada registro
    gloss: Usa شما y استین con alguien que acabas de conocer; usa تو y استی solo con un amigo cercano.
    note: Esto repite la regla de registro de la Unidad 1 aplicada al contexto de las presentaciones.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Pide con cortesía que repitan su nombre
    gloss: ¿Podría decir su nombre otra vez?
    note: می‌توانین نام‌تان را دوباره بگویین؟ es una forma natural y cortés de pedir que repitan algo sin incomodar.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Reunión / fiesta
    gloss: reunión
    note: مهمانی designa una reunión social informal, el escenario del diálogo de esta lección.
    example_gloss: La reunión está bien.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila inicia la presentación
    gloss: Leila saluda a Faridun y le pregunta su nombre, tratándolo con respeto como جناب.
    note: Leila y Faridun no se conocían, así que ella usa el registro respetuoso desde el principio.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun dice su nombre
    gloss: Faridun devuelve el saludo y dice su nombre.
    note: سلام علیکم es el saludo más completo de la Unidad 1, apropiado para un primer encuentro. En la conversación Faridun dice نامم فریدون است (نامم = نام من, mi nombre), la forma hablada cotidiana.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila le pregunta de dónde es
    gloss: Leila dice que le alegra conocerlo y le pregunta de dónde es.
    note: La misma frase از آشنایی با شما خوش شدم pasa del diálogo laboral de la Unidad 1 a este.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun responde y devuelve la pregunta
    gloss: Faridun dice que es de Herat y le hace la misma pregunta a Leila.
    note: و شما؟ devuelve una pregunta de forma breve, como se vio en la Unidad 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila responde y pregunta por su trabajo
    gloss: Leila dice que es de Kabul y pregunta a qué se dedica Faridun.
    note: La conversación pasa de forma natural del origen a la profesión.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun responde y devuelve la pregunta
    gloss: Faridun dice que es ingeniero y le hace la misma pregunta a Leila.
    note: شما چطور؟ es una forma breve de devolver una pregunta que ya se entiende por el contexto.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila dice su profesión
    gloss: Leila dice que es maestra.
    note: Completa el intercambio sobre la profesión con el patrón enseñado antes en la unidad.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun presenta a una tercera persona
    gloss: Faridun presenta a su colega Arezoo.
    note: Esto incorpora a una tercera persona a la conversación con la frase de presentación formal de la lección 4.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila da la bienvenida a Arezoo
    gloss: Leila da la bienvenida a Arezoo, tratándola con respeto como خانم.
    note: خوش آمدین es la fórmula de bienvenida de la Unidad 1, aquí dirigida a una persona recién presentada.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo responde
    gloss: Arezoo da las gracias a Leila y dice que se alegra de conocerla.
    note: از دیدن شما خوشحال شدم es una variante natural de la fórmula «encantado de conocerte», que usa دیدن (ver) en lugar de آشنایی.
