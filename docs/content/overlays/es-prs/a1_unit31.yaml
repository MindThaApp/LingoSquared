course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de educación y estudios (universidad, colegio, carrera, estudiante, lección), cómo nombrar una carrera (medicina, derecho, economía, literatura), preguntar y responder dónde estudias, y un diálogo entre Karim y Parwin sobre sus estudios y lo que piensan de ellos.'
units:
  prs.a1.unit31.education:
    title: Educación
    description: Habla de lo que estudias, dónde estudias y qué te parece.
