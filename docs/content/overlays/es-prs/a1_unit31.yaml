teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Educación
    gloss: educación / estudios
    note: تحصیل significa educación o estudios en general; es la palabra temática de esta unidad.
    example_gloss: La educación es buena.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Universidad
    gloss: universidad
    note: پوهنتون significa universidad; es la palabra estándar en Afganistán (como en el nombre de la Universidad de Kabul) y es distinta de la iraní دانشگاه.
    example_gloss: La universidad está en Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Escuela
    gloss: escuela
    note: مکتب significa colegio o escuela.
    example_gloss: Este colegio es bueno.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Carrera
    gloss: carrera / especialidad
    note: رشته significa carrera o especialidad universitaria; es una palabra común al persa y al dari.
    example_gloss: Mi carrera es medicina.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Estudiante
    gloss: estudiante
    note: محصل significa estudiante universitario; es el término estándar del dari de Afganistán y es distinto del iraní دانشجو.
    example_gloss: Él/Ella es estudiante.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lección
    gloss: lección
    note: درس significa lección y se usa con خواندن (leer) para formar la expresión verbal que significa «estudiar».
    example_gloss: Estudio todos los días.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Estudiar
    gloss: lección + leer → estudio
    note: درس (lección) se combina con خواندن (leer) para formar درس می‌خوانم (estudio); literalmente, «leo una lección». Es un patrón nuevo de verbo compuesto en este curso.
    target_text: درس (lección) + خواندن (leer) = درس می‌خوانم (estudio)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Estudio en la universidad
    gloss: Estudio en la universidad.
    note: Combina من (yo, repaso), در (en, repaso), پوهنتون y درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medicina
    gloss: medicina
    note: طب significa «medicina» como campo de estudio; es una palabra estándar compartida por el persa y el dari.
    example_gloss: La medicina es difícil.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Derecho
    gloss: derecho
    note: حقوق significa «derecho» como campo de estudio; es una palabra estándar compartida por el persa y el dari.
    example_gloss: El derecho es interesante.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Economía
    gloss: economía
    note: اقتصاد significa «economía» como campo de estudio; es una palabra estándar compartida por el persa y el dari.
    example_gloss: La economía también es difícil.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literatura
    gloss: literatura
    note: ادبیات significa «literatura» como campo de estudio; es una palabra estándar compartida por el persa y el dari.
    example_gloss: Me gusta la literatura.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Mi carrera es medicina
    gloss: Mi carrera es medicina.
    note: Combina رشته من (mi carrera, repaso) con است (es), que se introduce aquí.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Estudio medicina
    gloss: Estudio medicina.
    note: Aplica من ... می‌خوانم (estudio, repaso) directamente al nombre de una disciplina, por ejemplo طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Dónde
    gloss: dónde
    note: کجا significa «dónde».
    target_text: کجا (dónde)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Usted estudia (formal)
    gloss: tú estudias (formal)
    note: درس می‌خوانین es «usted estudia» en forma formal, siguiendo el patrón verbal formal en -ین ya conocido (por ejemplo, استفاده می‌کنین de la Unidad 30).
    target_text: درس می‌خوانین (usted estudia, formal)
  prs.a1.unit31.lesson03.teach.question_where:
    title: ¿Dónde estudia usted?
    gloss: ¿Dónde estudia usted?
    note: Combina شما (usted, formal, repaso), کجا (dónde), درس y می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Estudio en la Universidad de Kabul
    gloss: Estudio en la Universidad de Kabul.
    note: Combina من در ... درس می‌خوانم (estudio en ..., repaso) con پوهنتون کابل (Universidad de Kabul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Él/ella estudia
    gloss: él/ella estudia
    note: درس می‌خواند es la forma de tercera persona, siguiendo el patrón verbal de tercera persona en -د ya conocido (por ejemplo, استفاده می‌کند de la Unidad 30).
    target_text: درس می‌خواند (él/ella estudia, 3.ª persona)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Tú (informal) / tú estudias (informal)
    gloss: tú (informal) / tú estudias (informal)
    note: تو y می‌خوانی son el registro informal que usan Karim y Parwin entre sí.
    target_text: تو (tú, informal) / می‌خوانی (tú estudias, informal)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, ¿dónde estudias?'
    gloss: Parwin, ¿dónde estudias?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Estudio en la Universidad de Kabul. Mi carrera es medicina.'
    gloss: Estudio en la Universidad de Kabul. Mi carrera es medicina.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: ¿Es difícil la medicina?'
    gloss: ¿Es difícil la medicina?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Sí, es difícil, pero interesante. ¿Y tú?'
    gloss: Sí, es difícil, pero interesante. ¿Y tú?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Yo estudio en el colegio.'
    gloss: Yo estudio en el colegio.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: ¡Genial!'
    gloss: ¡Genial!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lectura sobre la educación
    gloss: Parwin estudia en la Universidad de Kabul. Su carrera es medicina. La medicina es difícil, pero interesante. Karim estudia en el colegio.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Me gusta / tiempo / no tengo
    gloss: me gusta / tiempo / no tengo
    note: دوست دارم (me gusta), وقت (tiempo) y ندارم (no tengo) son repaso de las Unidades 11, 14, 26, 29 y 30.
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Me gusta estudiar, pero no tengo tiempo
    gloss: Me gusta estudiar, pero no tengo tiempo.
    note: Combina تحصیل را دوست دارم (me gusta la educación, construcción repasada) con اما وقت ندارم (pero no tengo tiempo).
