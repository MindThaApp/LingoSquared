  prs.a2.unit39.lesson01.exercise05.order_manager_says:
    instruction: 'Ordena las palabras para decir: El director dice que la reunión es a las nueve.'
    accepted_answers:
    - value:
      - مدیر
      - می‌گوید
      - که
      - جلسه
      - ساعت
      - نه
      - است
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* Primero van quien habla y el verbo, luego *که* y después la afirmación.'
  prs.a2.unit39.lesson01.exercise06.translate_manager_says:
    instruction: 'Traduce al dari, usando می‌گوید که: El director dice que la reunión es a las nueve.'
    accepted_answers:
    - value: مدیر می‌گوید که جلسه ساعت نه است.
      status: correct
    - value: مدیر می‌گوید جلسه ساعت نه است.
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* significa «el director dice que la reunión es a las nueve». En el habla cotidiana se puede omitir la palabra *که*.'
  prs.a2.unit39.lesson02.exercise01.recognize_where_manager:
    instruction: ¿Qué significa esta frase?
    correct_option: Pregunta dónde está el director
    distractors:
    - Dice que el director está en casa
    - Pregunta quién es el director
    - Quiere que venga el director
    accepted_answers:
    - value: Pregunta dónde está el director
      status: correct
    feedback: '*می‌پرسد* significa «pregunta» y *کجا* significa «dónde»: pregunta dónde está el director.'
  prs.a2.unit39.lesson02.exercise02.recognize_coming_tomorrow:
    instruction: ¿Qué significa esta frase?
    correct_option: Hashmat pregunta si vienes mañana
    distractors:
    - Hashmat dice que vienes mañana
    - Hashmat pregunta si él puede venir mañana
    - Hashmat pregunta por qué viniste ayer
    accepted_answers:
    - value: Hashmat pregunta si vienes mañana
      status: correct
    feedback: '*می‌پرسد که* introduce una pregunta, aquí una pregunta de sí o no: Hashmat pregunta si vienes mañana.'
  prs.a2.unit39.lesson02.exercise03.match_asks:
    instruction: Relaciona cada palabra o frase en dari con su significado.
    accepted_answers:
    - value:
