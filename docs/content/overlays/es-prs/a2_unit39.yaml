        آن‌ها می‌گویند که جلسه ساعت ده است: Dicen que la reunión es a las diez
        او می‌گوید که فردا می‌آید: Él o ella dice que viene mañana
        حشمت می‌گوید که مینا فردا می‌آید: Hashmat dice que Mina viene mañana
      status: correct
