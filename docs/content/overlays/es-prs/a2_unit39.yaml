course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: transmitir un mensaje sencillo en presente con می‌گوید که, می‌پرسد که y می‌خواهد که + subjuntivo, con mensajes telefónicos y notas.'
units:
  prs.a2.unit39.passing_message:
    title: Transmitir un mensaje
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: Él dice que ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: Él pregunta que ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: Él quiere que ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Mensajes y notas
  prs.a2.unit39.lesson05.reading_and_listening:
    title: Lectura y comprensión auditiva sobre mensajes
  prs.a2.unit39.lesson06.office_conversation:
    title: Una conversación en la oficina
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Mensaje
    gloss: mensaje
    note: '*پیام* es un mensaje, por ejemplo un mensaje telefónico o un mensaje de texto. En esta unidad transmites un mensaje: le cuentas a una segunda persona lo que una primera dijo, preguntó o quiso.'
    example_gloss: Tengo un mensaje para usted.
  prs.a2.unit39.lesson01.teach.says:
    title: Él o ella dice
    gloss: él dice, ella dice
    note: '*می‌گوید* significa «él o ella dice», el presente de *گفتن*. Ya conoces *می‌گویم* (yo digo). La terminación *-د* es la de él, ella o ello, como en *می‌آید*.'
    example_gloss: Él o ella dice que viene mañana.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Transmitir lo que alguien dice: می‌گوید که + enunciado'
    gloss: El director dice que la reunión es a las diez. Él dice que viene mañana.
    note: 'Para transmitir lo que alguien dice ahora, usa *می‌گوید که* y después el enunciado. *که* significa «que». El enunciado mantiene su tiempo presente: *جلسه ساعت ده است*. En esta unidad solo transmites mensajes en presente. Los mensajes en pasado vendrán más adelante en el curso.'
  prs.a2.unit39.lesson01.teach.person:
    title: «Yo» pasa a ser «él» o «ella» al transmitirlo
    gloss: 'Mina: Yo vengo mañana. Mina dice que viene mañana.'
    note: 'Cuando Mina dice *من فردا می‌آیم* (yo vengo mañana) y tú lo transmites, la persona cambia: para ti Mina ahora es *او* (ella), así que la terminación del verbo pasa de *-م* a *-د*: *مینا می‌گوید که فردا می‌آید*. La palabra *او* es opcional porque la terminación ya indica quién es.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: Ellos dicen
    gloss: ellos dicen
    note: '*می‌گویند* significa «ellos dicen». Añade *-ند* a la raíz: *می‌گویند* es la forma de *آن‌ها* de *می‌گوید*.'
    example_gloss: Dicen que la reunión es a las diez.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Hashmat dice que Mina viene mañana
    gloss: Hashmat dice que Mina viene mañana.
    note: Aquí la persona que habla (*حشمت*) y la persona que viene (*مینا*) son distintas, y la oración nombra a ambas. Fíjate siempre en quién dice y quién viene cuando leas un mensaje.
  prs.a2.unit39.lesson02.teach.asks:
    title: Él o ella pregunta
    gloss: él pregunta, ella pregunta
    note: '*می‌پرسد* significa «él o ella pregunta», el presente de *پرسیدن*. Tiene la misma terminación *-د* que *می‌گوید*.'
    example_gloss: Él o ella pregunta dónde está el director.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Transmitir una pregunta: می‌پرسد که + pregunta'
    gloss: Hashmat pregunta dónde estás. Mina pregunta qué hora es.
    note: Para transmitir una pregunta, usa *می‌پرسد که* y después la pregunta con su palabra interrogativa (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). El orden de las palabras de la pregunta no cambia. *استی* significa «estás» (a un amigo), la forma de *تو* de *است*. Cuando se lo dices a la persona a quien se preguntó, *تو* sigue siendo *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Transmitir una pregunta de sí o no
    gloss: Él o ella pregunta si vienes mañana.
    note: 'En esta unidad mantenemos la pregunta tal como se dijo, sin ninguna marca adicional (también puedes añadir *آیا* o *یا نه*, como en la unidad 38). Una pregunta de sí o no se transmite con *می‌پرسد که*: *او می‌پرسد که تو فردا می‌آیی*. La respuesta es *بلی* o *نخیر*. *می‌آیی* significa «vienes» (a un amigo), la forma de *تو* de *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: El director pregunta si tienes documento de identidad
    gloss: El director pregunta si tienes cédula de identidad.
    note: Otra pregunta de sí o no. *تذکره* es la cédula de identidad afgana, y *داری* significa «tienes».
  prs.a2.unit39.lesson02.teach.person:
    title: La persona a quien se pregunta cambia el pronombre
    gloss: Mina pregunta dónde estás. Mina pregunta dónde está Hashmat.
    note: 'Mina le pregunta a Hashmat: *تو کجا استی؟* (¿Dónde estás?). Si se lo dices a Hashmat, dices *مینا می‌پرسد که تو کجا استی* y *تو* se mantiene. Si se lo dices a otra persona, Hashmat pasa a ser tercera persona: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Transmitir un deseo: می‌خواهد که + subjuntivo'
    gloss: Él o ella quiere que vengas. Él o ella quiere que yo vaya.
    note: 'Para transmitir lo que alguien quiere que otra persona haga, usa *می‌خواهد که* y después el subjuntivo: *او می‌خواهد که تو بیایی* (él o ella quiere que vengas). Es la misma forma de subjuntivo que usas después de *باید* y en *بروم* (que yo vaya). No es el presente con *می‌*: en *بیایی* no hay *می‌*.'
  prs.a2.unit39.lesson03.teach.go:
    title: El subjuntivo de رفتن
    gloss: que yo vaya, que tú vayas, que él o ella vaya, que nosotros vayamos, que ustedes vayan (formal o plural), que ellos vayan
    note: 'El subjuntivo es *ب* más la raíz del presente más la terminación: *ب + رو + م* da *بروم*. Las terminaciones son *-م، -ی، -د، -یم، -ین، -ند*. Así: *بروم، بروی، برود، برویم، بروین، بروند*. Ya conoces *بروم*; esta tarjeta añade las demás formas.'
  prs.a2.unit39.lesson03.teach.come:
    title: El subjuntivo de آمدن
    gloss: que yo venga, que tú vengas, que él o ella venga, que nosotros vengamos, que ustedes vengan (formal o plural), que ellos vengan
    note: '*آمدن* es irregular: la raíz del subjuntivo es *بیای-*. Las terminaciones son las mismas: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. *بیایم* y *بیایین* ya los conoces.'
  prs.a2.unit39.lesson03.teach.do:
    title: El subjuntivo de کردن y آوردن
    gloss: que yo haga, que tú hagas, que él o ella haga, que nosotros hagamos, que ustedes hagan, que ellos hagan. que yo traiga, que tú traigas, que él o ella traiga.
    note: '*کردن* no lleva *ب*: *کنم، کنی، کند، کنیم، کنین، کنند*. Así, *تیلفون کردن* da *تیلفون کنی* (que llames por teléfono). *آوردن* funciona como *آمدن* con *بیاور-*: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: El subjuntivo de گفتن
    gloss: que yo diga, que tú digas, que él o ella diga
    note: '*گفتن* tiene la raíz *گوی-* en el subjuntivo: *بگویم، بگویی، بگوید*. El patrón es *ب* más raíz más terminación, como en *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: El director quiere que llames por teléfono
    gloss: El director quiere que llames por teléfono.
    note: La persona que quiere es *مدیر*, la persona que debe actuar es *تو*, y el verbo después de *که* es *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: Él o ella quiere que traigas la computadora
    gloss: Él o ella quiere que traigas la computadora.
    note: '*را* va después de lo que se trae, como en cualquier oración con complemento directo.'
  prs.a2.unit39.lesson03.teach.same:
    title: El mismo subjuntivo cuando quien quiere también va
    gloss: Quiero ir. Él o ella quiere ir.
    note: 'Si la persona que quiere y la que actúa son la misma, también se usa el subjuntivo: *من می‌خواهم که بروم*. Usa la terminación correspondiente: *-م* para yo, *-د* para él o ella. Esta unidad se centra sobre todo en transmitir un deseo referido a otra persona, como en *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Nota
    gloss: nota, apunte
    note: '*یادداشت* es una nota escrita breve, por ejemplo una nota dejada sobre una mesa o en una puerta. También es una forma de transmitir un mensaje cuando la persona no está.'
    example_gloss: La nota está en la oficina.
  prs.a2.unit39.lesson04.teach.writes:
    title: Él o ella escribe
    gloss: él escribe, ella escribe
    note: '*می‌نویسد* significa «él o ella escribe», el presente de *نوشتن*. *می‌نویسم* es «yo escribo».'
    example_gloss: Hashmat escribe una nota.
  prs.a2.unit39.lesson04.teach.sends:
    title: Él o ella envía
    gloss: él envía, ella envía
    note: '*می‌فرستد* significa «él o ella envía». Ya conoces *می‌فرستم* (yo envío).'
    example_gloss: El director envía un mensaje.
  prs.a2.unit39.lesson04.teach.written:
    title: 'Un mensaje escrito: می‌نویسد که'
    gloss: En la nota él o ella escribe que la reunión es a las nueve.
    note: 'Un mensaje escrito se transmite igual que uno hablado: *می‌نویسد که* y después el enunciado. *در یادداشت* significa «en la nota». El orden es el mismo que con *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Decir a quién se lo dices: به'
    gloss: Le digo a él o a ella que la reunión es a las nueve. El director le dice a Mina que la reunión es mañana.
    note: 'Pon *به* y el destinatario delante del verbo para indicar a quién se le dice: *به او می‌گویم* (le digo a él o a ella), *به مینا می‌گوید* (él le dice a Mina). El resto del patrón no cambia: *که* y después el mensaje.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: Él o ella llama por teléfono y dice que viene mañana
    gloss: Él o ella llama por teléfono y dice que viene mañana.
    note: 'Un mensaje telefónico suele llevar dos verbos seguidos: *تیلفون می‌کند* (llama por teléfono) y *می‌گوید که ...* (dice que ...), unidos por *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: Escribo una nota
    gloss: Escribo una nota.
    note: Escribes una nota cuando no puedes transmitir el mensaje en persona.
  prs.a2.unit39.lesson05.teach.not_come:
    title: Él o ella no viene
    gloss: él no viene, ella no viene
    note: '*نمی‌آید* significa «él o ella no viene»: *ن* delante de *می‌آید*. Ya conoces *نمی‌روم* (yo no voy).'
    example_gloss: Él o ella no viene mañana.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Turno 1
    gloss: Hashmat, ¿quién llamó por teléfono?
    note: Mina llega a casa y pregunta quién llamó por teléfono.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Turno 2
    gloss: Llamó el director. Dice que la reunión es mañana a las nueve.
    note: Hashmat responde y transmite la primera parte del mensaje con *می‌گوید که*.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Turno 3
    gloss: ¿A las nueve? ¿Qué más dice?
    note: Mina pide más información. *چه می‌گوید* significa «¿qué dice?».
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Turno 4
    gloss: Pregunta si vienes mañana. Y quiere que traigas la computadora.
    note: 'Dos partes más del mensaje: una pregunta con *می‌پرسد که* y un deseo con *می‌خواهد که* y el subjuntivo *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Turno 5
    gloss: Sí, mañana voy y llevo la computadora.
    note: Mina responde a la pregunta y al deseo en primera persona.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Turno 6
    gloss: Bien. Entonces lo llamo por teléfono.
    note: Hashmat transmitirá por teléfono la respuesta de Mina. *به او تیلفون می‌کنم* significa «lo llamo por teléfono».
  prs.a2.unit39.lesson05.teach.note_read:
    title: Una nota de Hashmat
    gloss: Hola, Mina. Hoy a las cuatro llamó tu amigo o amiga. Dice que mañana no viene porque tiene trabajo. Pregunta si tienes tiempo el viernes. Quiere que lo llames por teléfono. Su número está en esta nota. Hashmat
    note: 'Un mensaje escrito que transmite una llamada telefónica con los tres verbos de esta unidad: *می‌گوید که*, *می‌پرسد که* y *می‌خواهد که*. La llamada del amigo o amiga no es la misma que la del director en la conversación.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Turno 1
    gloss: Rahila, tengo un mensaje para ti.
    note: 'Behzad empieza: tiene un mensaje que transmitir.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Turno 2
    gloss: ¿De quién es?
    note: Rahila pregunta de quién es el mensaje.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Turno 3
    gloss: Del consultorio del doctor. Llamó un empleado. Dice que tu cita es el jueves a las dos.
    note: Behzad transmite la primera parte con *می‌گوید که*.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Turno 4
    gloss: ¿El jueves a las dos? ¿Qué más dice?
    note: Rahila pide el resto.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Turno 5
    gloss: Pregunta si tienes cédula de identidad. Y quiere que vengas a la una.
    note: Una pregunta con *می‌پرسد که* y un deseo con *می‌خواهد که* y el subjuntivo *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Turno 6
    gloss: Sí, la tengo. Voy a escribir una nota. Muchas gracias.
    note: Rahila responde a la pregunta, dice que escribe una nota para no olvidarlo y da las gracias a Behzad.
  prs.a2.unit39.lesson06.teach.summary:
    title: Tres verbos, tres tipos de mensaje
    gloss: Dice que la cita es el jueves. Pregunta si tienes cédula de identidad. Quiere que vengas a la una.
    note: Un mensaje suele contener una afirmación, una pregunta o un deseo. Después de *می‌گوید که* va una afirmación, después de *می‌پرسد که* una pregunta y después de *می‌خواهد که* el subjuntivo. La terminación del verbo indica quién habla, y el mensaje conserva el presente.
exercises:
  prs.a2.unit39.lesson01.exercise01.recognize_manager_says:
    instruction: ¿Qué significa esta frase?
    correct_option: El director dice que la reunión es a las nueve
    distractors:
    - El director pregunta si la reunión es a las nueve
    - El director dijo que la reunión era a las nueve
    - La reunión es en la oficina del director
    accepted_answers:
    - value: El director dice que la reunión es a las nueve
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است* significa «el director dice que la reunión es a las nueve».'
  prs.a2.unit39.lesson01.exercise02.recognize_they_say:
    instruction: ¿Qué significa esta frase?
    correct_option: Dicen que la reunión es a las diez
    distractors:
    - Preguntan a qué hora es la reunión
    - Dicen que la reunión es a las nueve
    - Dicen que la reunión era a las diez
    accepted_answers:
    - value: Dicen que la reunión es a las diez
      status: correct
    feedback: '*می‌گویند* significa «dicen», y *ساعت ده* significa «las diez».'
  prs.a2.unit39.lesson01.exercise03.recognize_who_says:
    instruction: ¿Qué significa esta frase?
    correct_option: Hashmat dice que Mina viene mañana
    distractors:
    - Mina dice que Hashmat viene mañana
    - Hashmat pregunta si Mina viene mañana
    - Hashmat dice que Mina vino ayer
    accepted_answers:
    - value: Hashmat dice que Mina viene mañana
      status: correct
    feedback: 'Primero va quien habla: *حشمت می‌گوید*. Lo que dice es *مینا فردا می‌آید*.'
  prs.a2.unit39.lesson01.exercise04.match_says:
