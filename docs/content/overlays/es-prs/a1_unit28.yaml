teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Animal
    gloss: animal
    note: حیوان significa «animal», la palabra general que incluye mascotas y otras criaturas.
    example_gloss: Un perro es un animal.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Perro
    gloss: perro
    note: سگ significa «perro».
    example_gloss: Tengo un perro.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Gato
    gloss: gato
    note: 'پشک significa «gato»: es la palabra cotidiana del dari de Afganistán, distinta de گربه, que se usa en el persa de Irán.'
    example_gloss: Tengo un gato.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Pájaro
    gloss: pájaro
    note: پرنده significa «pájaro».
    example_gloss: Tengo un pájaro.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Pescado
    gloss: pescado
    note: ماهی significa «pez».
    example_gloss: Tengo un pez.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Mascota
    gloss: mascota
    note: 'حیوان خانگی significa literalmente «animal de casa»: حیوان (animal, repaso) + خانگی (doméstico).'
    example_gloss: El perro es mi mascota.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: Tengo / usted tiene (formal) / es
    gloss: tengo / tiene (usted) / es
    note: دارم (tengo), دارین (tiene, usted) y است (es) ya los has visto antes en el curso y se usan en toda esta unidad para hablar de mascotas.
    target_text: دارم (tengo) / دارین (usted tiene, formal) / است (es/está)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: حیوان خانگی دارین؟ es la forma cortés y formal de preguntar a alguien si tiene mascota.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: بلی (sí, repaso de la Unidad 3) combinado con سگ دارم, de esta unidad.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: نخیر (no formal, repaso de la Unidad 3) combinado con حیوان خانگی ندارم (no tengo mascota).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Sí / no / no tengo
    gloss: sí / no / no tengo
    note: بلی, نخیر y ندارم ya aparecieron en el intercambio sobre los miembros de la familia de la Unidad 3 y aquí se reutilizan para hablar de mascotas.
    target_text: بلی (sí) / نخیر (no) / ندارم (no tengo)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Color
    gloss: color
    note: رنگ significa color (repaso de la ropa de la Unidad 21).
    target_text: رنگ (color)
  prs.a1.unit28.lesson03.teach.black_word:
    title: Negro
    gloss: negro
    note: سیاه significa negro.
    example_gloss: Mi perro es negro.
  prs.a1.unit28.lesson03.teach.white_word:
    title: Blanco
    gloss: blanco
    note: سفید significa blanco.
    example_gloss: Mi gato es blanco.
  prs.a1.unit28.lesson03.teach.small_word:
    title: Pequeño
    gloss: pequeño
    note: کوچک significa pequeño (repaso de las comparaciones de la Unidad 15).
    example_gloss: Mi gato es pequeño.
  prs.a1.unit28.lesson03.teach.big_word:
    title: Grande
    gloss: grande
    note: بزرگ significa grande (repaso de las comparaciones de la Unidad 15).
