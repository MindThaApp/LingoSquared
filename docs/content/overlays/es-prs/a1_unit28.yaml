course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de animales y mascotas (perro, gato, pájaro, pez), preguntar y responder si tienes mascota con حیوان خانگی دارین؟, describir el tamaño y el color de una mascota y un diálogo entre Zarmina y Homayoun sobre tener y alimentar a un gato.'
units:
  prs.a1.unit28.animals:
    title: Animales
    description: Habla de mascotas y animales comunes, incluido si tienes uno y los cuidados básicos.
