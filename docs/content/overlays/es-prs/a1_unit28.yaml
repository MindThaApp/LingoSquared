    title: Mi perro es negro y grande
    gloss: Mi perro es negro y grande.
    note: Une dos características con و (y, repaso).
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: Tú (informal) / tienes (informal)
    gloss: tú / tienes (informal)
    note: تو (tú, informal) y داری (tienes, informal) son repaso y se usan en el diálogo informal de esta lección entre amigos cercanos.
    target_text: تو (tú, informal) / داری (tienes, informal)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: Qué / todos los días
    gloss: qué / cuál / cada día
    note: چه (qué/cuál, repaso del «¿de qué color?» de la Unidad 21) y هر روز (cada día, repaso de la Unidad 24) se usan juntos para preguntar por el cuidado de una mascota.
    target_text: چه (qué/cuál) / هر روز (todos los días)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿tienes mascota?'
    gloss: 'Homayoun: Zarmina, ¿tienes mascota?'
    note: Una pregunta informal entre amigos, con la forma informal داری.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Sí, tengo un gato'
    gloss: 'Zarmina: Sí, tengo un gato.'
    note: Responde con بلی y یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¿De qué color es tu gato?'
    gloss: 'Homayoun: ¿De qué color es tu gato?'
    note: Usa چه رنگ (qué color), el mismo patrón que la pregunta de compras de la Unidad 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Es blanco'
    gloss: 'Zarmina: Es blanco.'
    note: 'Una respuesta corta: solo el color más است. Por la pregunta ya se sabe que se habla del gato, así que no se repite پشک.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: ¿Le das de comer cada día?'
    gloss: 'Homayoun: ¿Le das de comer cada día?'
    note: Presenta غذا می‌دهی (das de comer, informal), formado por غذا (comida) + می‌دهی, el equivalente informal de می‌دهد de la Unidad 18.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Sí, le doy de comer cada día'
    gloss: 'Zarmina: Sí, le doy de comer cada día.'
    note: Aplica هر روز (cada día) a می‌دهم (doy, 1.ª persona).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Lectura sobre una mascota
    gloss: Zarmina tiene un gato. Su gato es blanco y pequeño. Zarmina le da de comer al gato cada día.
    note: Un texto breve que repasa el vocabulario de mascotas de la unidad e introduce دارد (tiene, 3.ª persona, repaso de las Unidades 26/27) y می‌دهد (da, 3.ª persona, repaso de la Unidad 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: Pero
    gloss: pero
    note: اما significa pero (repaso de unidades anteriores).
    target_text: اما (pero)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: Soy/estoy
    gloss: soy
    note: استم (soy) es repaso de lo visto antes en el curso.
    target_text: استم (yo soy/estoy)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: Tengo un perro, pero no tengo gato
    gloss: Tengo un perro, pero no tengo gato.
    note: Combina dos datos sobre mascotas con اما.
