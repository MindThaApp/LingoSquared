course:
  title: Darí A1
  description: 'Dari afgano para principiantes: contar del uno al cien, preguntar y decir la edad e intercambiar números de teléfono.'
units:
  prs.a1.unit04.numbers:
    title: Contar y números
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Contar del uno al diez
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Contar del once al veinte
  prs.a1.unit04.lesson03.tens:
    title: Las decenas hasta el cien
  prs.a1.unit04.lesson04.asking_age:
    title: Preguntar y decir la edad
  prs.a1.unit04.lesson05.phone_numbers:
