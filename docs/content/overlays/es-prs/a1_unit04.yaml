teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Uno, dos, tres
    gloss: 1, 2, 3
    note: یک، دو، سه son los numerales persas básicos, comunes al dari y al farsi.
    example_gloss:
    - Tengo un hermano.
    - Tengo dos libros.
    - Tengo tres hermanas.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Cuatro, cinco, seis
    gloss: 4, 5, 6
    note: چهار es la forma escrita estándar; algunos hablantes la acortan a چار en el habla coloquial, pero este curso usa la ortografía estándar.
    example_gloss:
    - Tengo cuatro libros.
    - Espera cinco minutos.
    - Tiene seis libros.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Siete, ocho
    gloss: 7, 8
    note: هفت، هشت continúan la serie.
    example_gloss:
    - Una semana tiene siete días.
    - Vendré a las ocho.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Nueve, diez
    gloss: 9, 10
    note: نه، ده completan los números del uno al diez.
    example_gloss:
    - Hay nueve personas en la clase.
    - Tengo diez dedos.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Once, doce, trece
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده son palabras distintas, no simples combinaciones de las unidades.
    example_gloss:
    - Tengo clase a las once.
    - Un año tiene doce meses.
    - Tiene trece años.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Catorce, quince, dieciséis
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده continúan los números del trece al diecinueve.
    example_gloss:
    - Vendré dentro de catorce días.
    - Tiene quince libros.
    - Tiene dieciséis años.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Diecisiete, dieciocho, diecinueve
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده completan los números del trece al diecinueve.
    example_gloss:
    - Tiene diecisiete libros.
    - Tiene dieciocho años.
    - Faltan diecinueve días.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Veinte
    gloss: '20'
    note: بیست inicia las decenas, que se ven por completo en la próxima lección.
    example_gloss: Tengo veinte libros.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Veinte, treinta, cuarenta
    gloss: 20, 30, 40
    note: بیست، سی، چهل son las palabras de las decenas; cada una tiene una forma propia, sin un patrón previsible.
    example_gloss:
    - Tengo veinte años.
    - Este mes tiene treinta días.
    - Tiene cuarenta años.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Cincuenta, sesenta
    gloss: 50, 60
    note: پنجاه، شصت continúan las decenas.
    example_gloss:
    - Tiene cincuenta libros.
    - Sesenta minutos son una hora.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Setenta, ochenta
    gloss: 70, 80
    note: هفتاد، هشتاد continúan las decenas.
    example_gloss:
    - Este libro tiene setenta páginas.
    - Tiene ochenta libros.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Noventa, cien
    gloss: 90, 100
    note: نود، صد completan la serie hasta cien.
    example_gloss:
    - Tiene noventa años.
    - Tiene cien libros.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Combinar decenas y unidades
    gloss: 25 es literalmente «veinte y cinco».
    note: Una decena y una unidad se unen con و (y), el mismo conector que se usa en otras partes de este curso, por ejemplo بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Cuántos / cuánto
    gloss: cuántos / cuánto
    note: چند introduce una pregunta sobre una cantidad, incluida la edad.
    example_gloss: ¿Cuántos años tiene?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Año
    gloss: año
    note: سال se usa para decir la edad; literalmente significa «años».
    example_gloss: Tengo veinte años.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Preguntar la edad con cortesía
    gloss: ¿Qué edad tienes?
    note: چند ساله استین؟ significa literalmente «¿cuántos años tiene usted?» y usa la forma respetuosa استین, adecuada para alguien a quien no conoces bien.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Preguntar la edad a un amigo cercano
    gloss: ¿Qué edad tienes?
    note: چند ساله استی؟ usa la forma informal استی; resérvala para un amigo cercano o alguien de tu edad, igual que la regla de registro que ya has visto en este curso.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Decir tu edad
    gloss: Tengo 25 años.
    note: بیست و پنج ساله استم combina el número, ساله («de... años») y استم («soy/estoy»).
  prs.a1.unit04.lesson05.teach.number_word:
    title: Número
    gloss: número
    note: نمبر es una palabra cotidiana muy extendida en Afganistán (del persa/inglés) para «número», sobre todo el de teléfono.
    example_gloss: Este es mi número de teléfono.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Teléfono
    gloss: teléfono
    note: تلفن es la palabra estándar para «teléfono».
    example_gloss: Mi teléfono está estropeado.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Pedir un número de teléfono
    gloss: ¿Cuál es tu número de teléfono?
    note: نمبر تلفن‌تان چند است؟ usa el mismo patrón con چند de la pregunta sobre la edad, aplicado al número de teléfono.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Cero
    gloss: cero
    note: صفر es necesario para leer en voz alta la mayoría de los números de teléfono afganos.
    example_gloss: El cero es un número.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Dar tu número de teléfono
    gloss: Mi número de teléfono es el 079-345-678.
    note: Los números de teléfono afganos suelen leerse en grupos cortos y no dígito por dígito, como en este ejemplo.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun saluda a Bashir
    gloss: Homayoun le pregunta a Bashir cómo está, con el registro informal propio de un amigo cercano.
    note: جور استی؟ indica que los dos ya son amigos cercanos, por eso el registro informal es adecuado en todo este diálogo.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir responde y pregunta la edad de Homayoun
    gloss: Bashir dice que está bien y pregunta cuántos años tiene Homayoun.
    note: چند ساله استی؟ usa el registro informal, coherente con su amistad.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun responde y devuelve la pregunta
    gloss: Homayoun dice que tiene 28 años y le hace la misma pregunta a Bashir.
    note: Se reutiliza directamente el patrón para decir la edad de la lección 4.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir responde
    gloss: Bashir dice que tiene 26 años.
    note: Completa el intercambio sobre la edad.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun pide el número de teléfono de Bashir
    gloss: Homayoun le pide a Bashir su número de teléfono.
    note: تلفنت usa la terminación posesiva informal, igual que el resto del diálogo.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir da su número de teléfono
    gloss: Bashir dice su número de teléfono en grupos de cifras.
    note: El número se lee en grupos, de forma natural, igual que en el ejemplo de la lección 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun confirma que lo ha guardado
    gloss: Homayoun le da las gracias y dice que lo guarda ahora mismo.
    note: سیف می‌کنم (del inglés «save») es un préstamo informal y común en Afganistán para temas tecnológicos, adecuado para esta charla entre amigos.
