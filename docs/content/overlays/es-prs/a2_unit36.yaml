course:
  title: Dari A2
  description: 'Dari afgano de nivel preintermedio: decir para qué haces algo. La finalidad con برای más un sustantivo o un infinitivo, برای اینکه y تا con el subjuntivo, y la forma negativa (para no...), con recados, estudio y ahorro.'
units:
  prs.a2.unit36.in_order_to:
    title: Para (finalidad)
lessons:
  prs.a2.unit36.lesson01.errands_and_for:
    title: 'Recados: برای + sustantivo o infinitivo'
  prs.a2.unit36.lesson02.for_that_subjunctive:
    title: 'Para que: el subjuntivo'
  prs.a2.unit36.lesson03.ta_and_negative:
    title: 'Para que: تا y la negación'
  prs.a2.unit36.lesson04.learning_and_saving:
    title: Aprender y ahorrar dinero
  prs.a2.unit36.lesson05.reading_and_listening:
