  prs.a2.unit36.lesson06.english_conversation:
    title: Una conversación sobre aprender inglés
teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Faroozan y Arif
    gloss: Esta es Faroozan. Este es Arif. Son amigos.
    note: '*فروزان* y *عارف* son dos amigos que aparecen en las conversaciones y los ejemplos de esta unidad. Faroozan es una mujer y Arif es un hombre.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Oficina de correos
    gloss: correos
    note: '*پُسته خانه* es la oficina de correos. La gente va allí a enviar una carta o un paquete.'
    example_gloss: La oficina de correos está cerca.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Carta
    gloss: carta
    note: '*نامه* es una carta. La carta que se envía lleva *را*: *نامه را می‌فرستم*.'
    example_gloss: La carta está en la oficina de correos.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Banco
    gloss: banco
    note: '*بانک* es un banco. Vas allí a sacar dinero (*پول*) o a ingresarlo.'
    example_gloss: El banco está en el mercado.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: Enviar
    gloss: enviar
    note: '*فرستادن* significa «enviar». También es el infinitivo que se usa después de *برای*: *برای فرستادن نامه* significa «para enviar una carta».'
    example_gloss: Enviar una carta es fácil.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: De compras
    gloss: compras
    note: '*خرید* son las compras, las cosas que compras. *خرید دارم* significa «tengo compras que hacer».'
    example_gloss: Hoy tengo muchas compras.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + sustantivo: para qué haces algo'
    gloss: Voy al mercado de compras. Vengo a Kabul por trabajo. Voy a casa a descansar.
    note: 'Pon *برای* delante de un sustantivo para decir para qué haces algo: *برای خرید* (de compras), *برای کار* (por trabajo), *برای استراحت* (a descansar). El lugar sigue llevando *به*: *به بازار می‌روم*. En español usamos «para» o «por» según el caso; en dari, el sustantivo después de *برای* ya expresa la finalidad.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + infinitivo: para hacer algo'
    gloss: Para enviar una carta voy a la oficina de correos. Para comprar pan voy a la tienda. Para sacar dinero voy al banco.
    note: 'Para decir con qué fin haces algo, pon el infinitivo después de *برای*: *فرستادن* (enviar), *خریدن* (comprar), *گرفتن* (tomar, coger). El infinitivo termina en *ن*. Lo que envías, compras o tomas va después del infinitivo: *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: La finalidad puede ir al final; preguntar para qué
    gloss: Voy al banco para sacar dinero. ¿Para qué vas al banco?
    note: 'La finalidad también puede ir al final: *به بانک می‌روم برای گرفتن پول*. Para preguntar «para qué», se dice *برای چه؟*: *برای چه به بانک می‌روی؟* significa «¿para qué vas al banco?». Se responde con *برای* y un sustantivo o un infinitivo.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: Para enviar una carta, voy a la oficina de correos
    gloss: Para enviar una carta, voy a la oficina de correos.
    note: 'Este es el patrón de la primera lección: primero *برای* + infinitivo, luego el lugar con *به* y el verbo al final.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'El subjuntivo: ب + raíz del presente + terminación'
    gloss: que yo compre, que yo vaya, que yo tome, que yo envíe, que yo lea, que yo vea, que yo venga, que yo traiga
    note: 'El subjuntivo es la forma verbal que va después de *برای اینکه* y *تا*. Se forma con la raíz del presente: se añade *ب-* delante y la terminación de persona. Para «yo» la terminación es *-م*: *بخرم* (que yo compre), *بروم* (que yo vaya), *بگیرم* (que yo tome). Es la misma forma que ya conoces de *می‌خواهم بروم* y *باید بیایم*. Dos formas se escriben de manera distinta y conviene aprenderlas tal cual: *بیایم* (de *آمدن*) y *بیاورم* (de *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: Las seis personas del subjuntivo
    gloss: que yo compre, que tú compres, que él o ella compre, que nosotros compremos, que ustedes compren (formal o plural), que ellos compren
    note: 'Las terminaciones son *-م، -ی، -د، -یم، -ین، -ند*. La terminación de «usted/ustedes» (formal o plural) es *-ین*, como en todo el curso. El subjuntivo no lleva *می‌*: compara *می‌خرم* (compro) con *بخرم* (que compre).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + subjuntivo: para que yo haga algo'
    gloss: Para comprar pan, voy a la tienda. Para sacar dinero, voy al banco.
    note: '*برای اینکه* significa «para que». Introduce una oración con su propio verbo en subjuntivo, y el verbo indica la persona: *برای اینکه نان بخرم* es «para que yo compre pan». La oración principal dice lo que haces. Donde el español puede decir «para comprar», el dari dice «para que yo compre». Las dos oraciones pueden intercambiar su lugar: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: Más ejemplos y verbos de dos palabras
    gloss: Para enviar una carta, voy a la oficina de correos. Para ver a mi amigo, voy a Kabul. Para ahorrar, voy a pie.
    note: 'La misma regla vale para todos los verbos. Con un verbo de dos palabras como *پس‌انداز کردن* solo cambia la parte verbal y no hay *ب-*: *پس‌انداز کنم* (que ahorre), *کار کنم* (que trabaje). Lo que ves o tomas se pone con *را* antes del verbo: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: Para comprar pan, voy a la tienda
    gloss: Para comprar pan, voy a la tienda.
    note: 'Compara con la lección 1: *برای خریدن نان* (infinitivo) y *برای اینکه نان بخرم* (oración con subjuntivo) dicen lo mismo.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + subjuntivo: la forma corta'
    gloss: Voy a la tienda para comprar pan. Voy al banco para sacar dinero. Voy a la oficina de correos para enviar una carta.
    note: '*تا* es una forma corta de *برای اینکه*. Va después de la oración principal y le sigue un verbo en subjuntivo: *به دوکان می‌روم تا نان بخرم*. *تا* tiene también otros significados, por ejemplo «hasta» en *تا ساعت ده*. Si le sigue un verbo en subjuntivo con *ب-*, significa «para que».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Otras personas: nosotros, él, ellos'
    gloss: Vamos para comprar pan. Él va para enviar una carta. Ellos van para sacar dinero.
    note: 'Los dos verbos llevan la misma persona cuando el sujeto es el mismo: *می‌رویم* y *بخریم* terminan ambos en *-یم* (nosotros). Las terminaciones del subjuntivo son *-م، -ی، -د، -یم، -ین، -ند*, así que *بفرستد* es «que él o ella envíe» y *بگیرند* es «que ellos tomen».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'La negación: ن + raíz'
    gloss: Voy temprano para no llegar tarde. Para no llegar tarde, voy temprano.
    note: 'Para decir lo que quieres evitar, pon *ن-* delante de la raíz y quita la *ب-*: *برسم* (que llegue) pasa a *نرسم* (que no llegue). La oración principal dice lo que haces para evitarlo: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: La negación de los verbos de dos palabras
    gloss: Pongo mi dinero en el banco para no perderlo.
    note: 'Con un verbo de dos palabras, el *ن-* va en la parte verbal: *گم کنم* (que pierda) pasa a *گم نکنم* (que no pierda). *آن را* («lo») remite al dinero.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: Voy temprano para no llegar tarde
    gloss: Voy temprano para no llegar tarde.
    note: '*تا دیر نرسم* expresa lo que no quieres, y *زود می‌روم* es lo que haces al respecto.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Lección, estudio
    gloss: lección, clase
    note: '*درس* es una lección o una clase. Con *خواندن* significa «estudiar»: *درس خواندن*.'
    example_gloss: La clase de inglés es a las cuatro.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Examen
    gloss: examen, prueba
    note: '*امتحان* es un examen. Haces el examen y recibes una nota (*نمبر*).'
    example_gloss: El examen es mañana.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: Aprender
    gloss: aprender
    note: '*یاد گرفتن* significa aprender. *یاد* es la primera parte y *گرفتن* es el verbo. El subjuntivo para «yo» es *یاد بگیرم*, con *ب-* delante de *گیر*.'
    example_gloss: Estoy aprendiendo inglés.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: Estudiar
    gloss: estudiar
    note: '*درس خواندن* significa estudiar. *می‌خوانم* significa «leo» o «estudio». La palabra درس va delante, como en *درس می‌خوانم*.'
    example_gloss: Todas las noches estudio.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Caro
    gloss: caro
    note: '*گران* significa caro. Su contrario es *ارزان* (barato).'
    example_gloss: El curso es caro.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Barato
    gloss: barato
    note: '*ارزان* significa barato. Las cosas *ارزان* te ayudan a ahorrar dinero.'
    example_gloss: La bicicleta es barata.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: Gastar dinero
    gloss: gastar (dinero)
    note: '*خرج کردن* es gastar dinero. La negación de este verbo de dos palabras pone *ن* en *کردن*: *خرج نکنم* (que no gaste).'
    example_gloss: No gasto mucho dinero.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + sustantivo con palabras de aprender y ahorrar
    gloss: Estudio para el examen. Ahorro dinero para el curso.
    note: 'El patrón de la lección 1 también funciona con estas palabras: *برای امتحان* (para el examen), *برای کورس* (para el curso). Un sustantivo después de *برای* es una forma breve de decir para qué haces el esfuerzo.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Oraciones de finalidad sobre aprender
    gloss: Para aprender inglés, leo un libro todas las noches. Para sacar una buena nota en el examen, estudio mucho.
    note: 'Usa *برای اینکه* o *تا* con un verbo en subjuntivo para decir para qué estudias: *یاد بگیرم* (que aprenda), *نمبر خوب بگیرم* (que saque una buena nota). Las dos cláusulas pueden ir en cualquier orden.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Oraciones de finalidad sobre ahorrar dinero
    gloss: Ahorro dinero para comprar una bicicleta. Compro un libro barato para no gastar mucho dinero.
    note: Para hablar de ahorrar, la oración principal dice lo que haces y la cláusula con *تا* dice para qué. La negación *خرج نکنم* expresa lo que no quieres que pase.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: Ahorro para comprar una bicicleta
    gloss: Ahorro dinero para comprar una bicicleta.
    note: Una frase corta que nombra primero la acción y al final la finalidad.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Fozia
    gloss: Fozia es amiga de Faroozan.
    note: '*فوزیه* es una tercera amiga. Ella escribe el mensaje de esta lección. No es la misma persona que Faroozan.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'Pagar el pasaje: کرایه دادن'
    gloss: Pago el pasaje. No pago el pasaje. Para no pagar el pasaje, voy a pie.
    note: '*کرایه دادن* es pagar el pasaje de un taxi o de un autobús. El presente es *می‌دهم*, la negación es *نمی‌دهم* y el subjuntivo negativo es *ندهم* (que no dé). *پیاده می‌روم* significa «voy a pie».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Faroozan pregunta adónde va Arif
    gloss: Arif, ¿adónde vas hoy?
    note: Faroozan pregunta *به کجا می‌روی؟* con el presente *می‌روی*. Es una amiga, así que usa *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Arif menciona dos gestiones
    gloss: Primero voy a la oficina de correos para enviar esta carta. Luego voy al banco.
    note: 'La primera gestión tiene una finalidad: *تا این نامه را بفرستم*. *اول* y *بعد* ordenan las dos gestiones.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Faroozan pregunta por el banco
    gloss: ¿Qué tienes que hacer en el banco?
    note: '*چه کار داری؟* pregunta qué asunto tienes en un lugar.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Arif dice para qué
    gloss: Voy a sacar dinero.
    note: La respuesta corta *می‌روم تا پول بگیرم* expresa la finalidad con *تا* y el subjuntivo *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Faroozan pregunta cómo va
    gloss: ¿Vas en coche?
    note: '*با موتر* significa «en coche».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Arif va a pie para ahorrar el pasaje
    gloss: No, voy a pie para no pagar el pasaje.
    note: '*نخیر* significa «no». *تا کرایه ندهم* es la finalidad negativa: va a pie para ahorrar dinero.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: Un mensaje sobre ahorrar dinero
    gloss: Hola, Faroozan. Cada mes ahorro dos mil afganis para comprar una bicicleta. Para no pagar pasajes, quiero ir a la escuela en bicicleta. Mañana voy al banco a sacar mi dinero. Fozia
    note: 'Un mensaje corto con tres finalidades: *تا یک بایسکل بخرم* (para comprar una bicicleta), *برای اینکه کرایه ندهم* (para no pagar el pasaje) y *تا پولم را بگیرم* (para sacar su dinero). Fozia usa el presente simple *می‌روم* con *فردا* para el plan.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Dos sujetos distintos: yo doy, para que tú no gastes'
    gloss: Te doy mi libro. Te doy mi libro para que no gastes dinero.
    note: 'Los dos verbos pueden tener sujetos distintos. En *کتابم را به تو می‌دهم تا پول خرج نکنی* quien da es «yo» (*می‌دهم*) y quien no gasta eres «tú» (*نکنی*). El subjuntivo concuerda con su propio sujeto: *-ی* para «tú».'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Arif pregunta por qué Faroozan lee todas las noches
    gloss: Faroozan, ¿por qué lees un libro todas las noches?
    note: '*می‌خوانی* significa «lees». *چرا* pregunta por qué y pide una razón o una finalidad.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Faroozan dice para qué estudia
    gloss: Para aprender inglés.
    note: 'Una respuesta corta que es solo una cláusula de finalidad: *برای اینکه انگلیسی یاد بگیرم*. Se omite la oración principal porque la pregunta ya la daba.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Arif pregunta por la finalidad más profunda
    gloss: ¿Para qué?
    note: '*برای چه؟* pregunta por la siguiente finalidad que hay detrás de la primera.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Faroozan da la siguiente finalidad
    gloss: Para sacar una buena nota en el examen.
    note: '*تا در امتحان نمبر خوب بگیرم* es una cláusula con *تا* por sí sola. *نمبر* es la nota o calificación.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Arif también quiere estudiar
    gloss: Yo también quiero estudiar inglés, pero el curso es caro.
    note: '*می‌خواهم انگلیسی بخوانم* usa el subjuntivo *بخوانم* después de *می‌خواهم*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Faroozan ofrece su libro
    gloss: Te doy mi libro para que no gastes dinero.
    note: '*تا پول خرج نکنی* tiene un sujeto distinto al del verbo principal: el libro lo da «yo» y el dinero no lo gastas «tú».'
