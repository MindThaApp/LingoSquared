course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de tareas del hogar (tareas domésticas, escoba, platos, limpio, ayudar), decir qué tarea hay que hacer hoy con باید, pedir ayuda a alguien con una tarea y un diálogo entre Wahid y Shukria sobre cómo repartirse las tareas.'
units:
  prs.a1.unit33.household:
    title: Las tareas del hogar
    description: 'Habla de las tareas del hogar: di qué hay que hacer, quién lo hace y pide ayuda con una de ellas.'
