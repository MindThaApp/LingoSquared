  prs.a1.unit33.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Tareas del hogar
    gloss: tareas del hogar / quehaceres domésticos
    note: کار خانه significa tareas del hogar o quehaceres domésticos; es la expresión del tema de esta unidad.
    example_gloss: Hay muchas tareas en casa.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Escoba
    gloss: escoba
    note: جاروب significa escoba; es la palabra más usada en el dari de Afganistán.
    example_gloss: ¿Dónde está la escoba?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Platos
    gloss: platos
    note: ظرف significa platos (vajilla); es una palabra estándar compartida por el persa y el dari.
    example_gloss: Los platos están en la cocina.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Limpio
    gloss: limpio
    note: پاک significa limpio; describe una habitación o un objeto.
    example_gloss: La habitación está limpia.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: Lavar / hacer
    gloss: lavar / hacer — yo lavo / yo hago
    note: شستن (lavar) es un verbo realmente nuevo; کردن (hacer) y می‌کنم (hago) son un repaso de unidades anteriores.
    target_text: شستن (lavar) / کردن (hacer) — می‌شویم (lavo) / می‌کنم (hago)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Yo barro
    gloss: Barro.
    note: 'Combina جاروب (escoba) con می‌کنم (hago, repaso); literalmente: «hago escoba».'
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Yo lavo los platos
    gloss: Lavo los platos.
    note: Combina ظرف (platos) con می‌شویم (lavo), la forma de primera persona de شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Hoy / qué / sí
    gloss: hoy / qué / sí
    note: امروز, چه y بلی ya los conociste en unidades anteriores.
    target_text: امروز (hoy) / چه (qué) / بلی (sí)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Deber / tener que
    gloss: deber / tener que
    note: باید es una palabra modal realmente nueva; aquí se usa para decir que hay que hacer una tarea del hogar.
    target_text: باید (deber / tener que)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Que yo haga
    gloss: que yo haga
    note: کنم es la forma subjuntiva simple que se usa después de باید con los verbos formados con کردن (sin el prefijo می‌).
    target_text: کنم (que yo haga — se usa después de باید con verbos formados con کردن, sin el prefijo می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Hoy tengo que barrer
    gloss: Hoy tengo que barrer.
    note: Combina امروز (hoy, repaso) con باید جاروب کنم (tengo que barrer).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Tengo que limpiar
    gloss: Tengo que limpiar.
    note: Combina باید (deber, repaso) con پاک کنم (que yo limpie).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: ¿Qué tengo que hacer?
    gloss: ¿Qué tengo que hacer?
    note: Combina چه کار (qué tarea/trabajo) con باید کنم (tengo que hacer).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Sí, tengo que barrer
    gloss: Sí, tengo que barrer.
    note: Combina بلی (sí, repaso) con باید جاروب کنم (tengo que barrer).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Ayuda
    gloss: ayuda
    note: کمک significa ayuda y es una palabra nueva en este curso.
    example_gloss: Quiero ayuda.
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: Por favor / hacer / yo / haga (formal)
    gloss: por favor / hacer / yo / ¡haga! (formal)
    note: لطفاً, کردن, من y کنین (el imperativo formal, de la misma familia del sufijo formal -ین) ya los conociste en unidades anteriores.
    target_text: لطفاً (por favor) / کردن (hacer) / من (yo) / کنین (haga, formal)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: Ayuda, por favor
    gloss: Ayuden, por favor.
    note: Combina لطفاً (por favor, repaso) con کمک کنین (¡ayude!, imperativo formal).
  prs.a1.unit33.lesson03.teach.review_ki_mikonad:
    title: Quién / él o ella hace
    gloss: quién / él o ella hace
    note: کی (quién, repaso) y می‌کند (él o ella hace, repaso) se repasan aquí.
    target_text: کی (quién) / می‌کند (él/ella hace)
  prs.a1.unit33.lesson03.teach.who_sweeps_question:
    title: ¿Quién barre?
    gloss: ¿Quién barre?
    note: Combina کی (quién, repaso) con جاروب می‌کند (barre, tercera persona).
  prs.a1.unit33.lesson03.teach.wahid_sweeps_answer:
    title: Wahid barre
    gloss: Wahid barre.
    note: Presenta al personaje Wahid (وحید), que responde a la pregunta «¿quién barre?».
  prs.a1.unit33.lesson03.teach.i_help_phrase:
    title: Yo ayudo
    gloss: Yo ayudo.
    note: Combina من (yo, repaso) con کمک می‌کنم (ayudo).
  prs.a1.unit33.lesson04.teach.review_informal_words:
    title: Tú (informal) / haces / también / gracias / mucho
    gloss: tú (informal) / tú haces (informal) / también / gracias / mucho
    note: تو, می‌کنی, هم, تشکر y زیاد son palabras de repaso, reunidas aquí para el registro informal del diálogo.
    target_text: تو (tú, informal) / می‌کنی (haces, informal) / هم (también) / تشکر (gracias) / زیاد (mucho)
  prs.a1.unit33.lesson04.teach.review_room_object_marker:
    title: Habitación / marcador de objeto directo
    gloss: habitación / marcador de objeto directo
    note: اتاق y را (marcador de objeto directo, repaso) se repasan aquí.
    target_text: اتاق (habitación) / را (marcador de objeto directo)
  prs.a1.unit33.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, hoy tengo que barrer. ¿Me ayudas?'
    gloss: Shukria, hoy tengo que barrer. ¿Me ayudas?
  prs.a1.unit33.lesson04.teach.dialogue_line2:
    title: 'Shukria: Sí, te ayudo. Yo lavo los platos.'
    gloss: Sí, te ayudo. Yo lavo los platos.
  prs.a1.unit33.lesson04.teach.dialogue_line3:
    title: 'Wahid: ¿Tú también vas a limpiar?'
    gloss: ¿Tú también vas a limpiar?
  prs.a1.unit33.lesson04.teach.dialogue_line4:
    title: 'Shukria: Sí, limpio la habitación.'
    gloss: Sí, limpio la habitación.
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid: ¡Muchas gracias!'
    gloss: ¡Muchas gracias!
  prs.a1.unit33.lesson05.teach.review_u_har_ruz_ast:
    title: Él/ella / todos los días / es, está
    gloss: él o ella / todos los días / es, está
    note: او (él o ella, repaso), هر روز (todos los días, repaso) y است (es, está, repaso) se repasan aquí.
    target_text: او (él/ella) / هر روز (todos los días) / است (es, está)
  prs.a1.unit33.lesson05.teach.review_mishuyad:
    title: Él/ella lava
    gloss: él o ella lava
    note: می‌شوید es la forma de tercera persona de شستن, con el mismo patrón en -د de la tercera persona que ya conoces (por ejemplo, می‌کند).
    target_text: می‌شوید (él/ella lava)
  prs.a1.unit33.lesson05.teach.review_khoshhal:
    title: Contento/a
    gloss: feliz
    note: خوشحال significa contento.
    target_text: خوشحال (contento/a)
  prs.a1.unit33.lesson05.teach.reading_passage:
    title: Lectura sobre las tareas del hogar
    gloss: Wahid barre todos los días. Shukria lava los platos. Ella también ayuda. Wahid está contento.
  prs.a1.unit33.lesson06.teach.review_like_have_time:
    title: Me gusta / tiempo / no tengo / pero
    gloss: me gusta / tiempo / no tengo / pero
    note: دوست دارم (me gusta), وقت (tiempo), ندارم (no tengo) y اما (pero) ya los conociste en unidades anteriores; seguimos con el mismo patrón de repaso final.
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo) / اما (pero)
  prs.a1.unit33.lesson06.teach.wrap_summary:
    title: Me gustan las tareas del hogar, pero no tengo tiempo
    gloss: Me gustan las tareas del hogar, pero no tengo tiempo.
    note: Combina کار خانه را دوست دارم (me gustan las tareas del hogar, construcción de repaso) con اما وقت ندارم (pero no tengo tiempo).
