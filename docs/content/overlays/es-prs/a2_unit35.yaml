course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: ordenar los hechos con oraciones de tiempo, por ejemplo antes de salir, después de llegar y cuando hirvió el agua. Antes y después con un sustantivo, بعد از اینکه con el pasado, قبل از اینکه con el subjuntivo y وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: Antes, después, cuando
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: Antes y después con un sustantivo
  prs.a2.unit35.lesson02.after_clause_travel:
    title: Después de una oración y tareas de viaje
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: Antes de una oración y cocinar
  prs.a2.unit35.lesson04.when_clause:
    title: Cuándo
  prs.a2.unit35.lesson05.reading_and_listening:
    title: Lectura y comprensión oral sobre el arroz y un viaje
  prs.a2.unit35.lesson06.morning_conversation:
    title: Una conversación sobre la mañana
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: Antes
    gloss: antes de (con sustantivo)
    note: '*قبل از* significa antes de. Después va un sustantivo y ningún verbo propio: *قبل از صبحانه* es antes del desayuno.'
    example_gloss: Antes del desayuno me ducho.
  prs.a2.unit35.lesson01.teach.after:
    title: Después de
    gloss: después de (con sustantivo)
    note: '*بعد از* significa después de, y también va con un sustantivo: *بعد از مکتب* es después de la escuela.'
    example_gloss: Después de la escuela voy a casa.
  prs.a2.unit35.lesson01.teach.dinner:
    title: La cena
    gloss: cena, la comida de la noche
    note: '*شام* es la cena. *می‌خورم* significa como o bebo: *شام می‌خورم* es ceno y *چای می‌خورم* es bebo té. El dari usa un solo verbo para ambos.'
    example_gloss: Después de la cena bebo té.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: Vestirse
    gloss: ponerse la ropa, vestirse
    note: '*لباس* es la ropa y *پوشیدن* es ponerse. *لباس می‌پوشم* es me pongo la ropa; *می‌پوشم* es la forma de presente para yo.'
    example_gloss: Cada mañana me visto.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: Despertarse
    gloss: despertarse
    note: '*بیدار شدن* es despertarse. *شدن* significa volverse, así que *بیدار می‌شوم* es me despierto, o me vuelvo despierto.'
    example_gloss: Me despierto a las seis.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: Antes y después con un sustantivo
    gloss: antes del desayuno, después del desayuno, antes de la escuela, después de la escuela, antes de la cena, después de la cena
    note: 'Pon un sustantivo justo después de *قبل از* o *بعد از* para decir cuándo ocurre algo: *قبل از صبحانه* (antes del desayuno), *بعد از مکتب* (después de la escuela). La expresión no tiene verbo propio; el verbo va en la parte principal de la frase. La expresión puede ir al principio (*بعد از شام چای می‌خورم*) o al final (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: Primero, luego, después de eso, por último
    gloss: Primero me despierto. Luego me ducho. Después de eso desayuno. Al final voy a la escuela.
    note: 'Para contar un día en orden, usa palabras de enlace cortas: *اول* (primero), *بعد* (luego), *بعد از آن* (después de eso) y *در آخر* (por último, al final). *بعد از آن* es *بعد از* con *آن* (eso) como sustantivo, así que remite al paso que acabas de nombrar.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: Después del desayuno voy a la escuela
    gloss: Después del desayuno voy a la escuela.
    note: El sustantivo *صبحانه* va después de *بعد از*, y el verbo *می‌روم* va al final. Es la forma más sencilla de decir qué va después de qué.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Billete
    gloss: billete (de avión o autobús)
    note: '*تکت* es un billete de avión o de autobús. *تکت گرفتن* es conseguir o comprar un billete.'
    example_gloss: Conseguí el billete de avión.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Maleta
    gloss: maleta
    note: '*چمدان* es una maleta. Añade *-م* para decir mi: *چمدانم* es mi maleta.'
    example_gloss: Mi maleta está en casa.
  prs.a2.unit35.lesson02.teach.pack:
    title: hice la maleta
    gloss: Hice mi maleta.
    note: '*چمدان را بستن* es hacer la maleta (el verbo es el mismo *بستن* que en *دروازه بسته است*). Primero va la maleta, luego *را* y luego el verbo: *بستم* es el pasado simple para yo.'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + pasado
    gloss: Después de conseguir el billete, hice la maleta.
    note: '*بعد از اینکه* significa después de que e inicia una cláusula con su propio verbo. Cuando cuentas una historia en pasado, ese verbo va en pasado simple: *بعد از اینکه تکت را گرفتم* es después de que conseguí el billete. La oración principal dice entonces lo que vino después: *چمدانم را بستم*. Lo que está en la cláusula con *بعد از اینکه* ocurrió primero.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه para hábitos
    gloss: Después de llegar a la estación, compro un billete.
    note: 'Para algo que haces una y otra vez, pon el verbo en presente con *می‌*: *بعد از اینکه به ایستگاه می‌رسم* es después de que llego a la estación, y *تکت می‌گیرم* es compro un billete. *می‌رسم* es el presente de *رسیدن* para yo.'
  prs.a2.unit35.lesson02.teach.swap:
    title: Las cláusulas pueden cambiar de lugar
    gloss: Hice la maleta después de conseguir el billete.
    note: 'Puedes poner la cláusula con *بعد از اینکه* en segundo lugar. El significado no cambia: el hecho de la cláusula con *بعد از اینکه* sigue ocurriendo primero. Solo cambia el orden de las palabras, no el orden de los hechos.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Sustantivo o cláusula
    gloss: después de la cena / después de que cené
    note: Usa *بعد از* con un sustantivo y *بعد از اینکه* con una cláusula completa. *بعد از شام* es «después de la cena». *بعد از اینکه شام خوردم* es «después de que cené». La segunda tiene verbo, así que también puede indicar quién lo hizo.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: Después de llegar a la estación, llamé por teléfono
    gloss: Después de llegar a la estación, hice una llamada.
    note: 'Una secuencia real de viaje: primero *رسیدم* (llegar) y luego *تیلفون کردم* (la llamada). *تیلفون کردن* es la forma habitual de decir «hacer una llamada».'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + subjuntivo
    gloss: antes de que llegue, antes de que vaya, antes de que coma, antes de que venga, antes de que compre
    note: '*قبل از اینکه* significa «antes de que» e introduce una cláusula con su propio verbo. Este verbo no está en pasado, sino en subjuntivo, la misma forma que usas después de *باید*: *ب-* más la raíz del presente más la terminación. *رسیدن* da *برسم*, *رفتن* da *بروم*, *خوردن* da *بخورم*, *آمدن* da *بیایم* y *خریدن* da *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: Las terminaciones del subjuntivo
    gloss: que yo llegue, que tú llegues, que él/ella llegue, que nosotros lleguemos, que ustedes lleguen (formal o plural), que ellos lleguen
    note: Las terminaciones son *-م، -ی، -د، -یم، -ین، -ند*. Así, *قبل از اینکه من برسم* es «antes de que yo llegue», *قبل از اینکه تو برسی* «antes de que llegues» (a un amigo), *قبل از اینکه او برسد* «antes de que él o ella llegue», *قبل از اینکه ما برسیم* «antes de que lleguemos», *قبل از اینکه شما برسین* «antes de que llegue usted/lleguen ustedes» (formal o plural), *قبل از اینکه آن‌ها برسند* «antes de que lleguen». La segunda persona del plural termina en *-ین* en dari; también se entiende la forma escrita *-ید*.
  prs.a2.unit35.lesson03.teach.past_story:
    title: Incluso en una historia en pasado
    gloss: Antes de salir de casa, hice la maleta.
    note: 'La historia está en pasado, así que cabría esperar un verbo en pasado después de *قبل از اینکه*. Pero se usa el subjuntivo: *بروم*, no *رفتم*. La razón es que, en el momento de hacer la maleta, la salida todavía no había ocurrido. No digas *قبل از اینکه رفتم* ni *قبل از اینکه می‌روم* en este caso. La oración principal va en pasado simple: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Sustantivo o cláusula
    gloss: antes de la cena / antes de cenar
    note: 'Con un sustantivo se usa *قبل از*: *قبل از شام*. Con una cláusula, se añade *اینکه* y el verbo va en subjuntivo: *قبل از اینکه شام بخورم*. Es paralelo a *بعد از شام* y *بعد از اینکه شام خوردم*, salvo que después de *بعد از اینکه* el verbo va en pasado y después de *قبل از اینکه* va en subjuntivo.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Arroz
    gloss: arroz
    note: '*برنج* es el arroz. Es uno de los alimentos principales de la cocina afgana.'
    example_gloss: Como arroz.
  prs.a2.unit35.lesson03.teach.onion:
    title: Cebolla
    gloss: cebolla
    note: '*پیاز* es la cebolla. Muchos platos empiezan con cebolla.'
    example_gloss: Hay cebollas en casa.
  prs.a2.unit35.lesson03.teach.chop:
    title: Picar
    gloss: picar, cortar en trozos pequeños
    note: '*خرد کردن* es picar algo en trozos pequeños. Primero va lo que se pica, con *را*: *پیاز را خرد می‌کنم* es «pico la cebolla».'
    example_gloss: Pico la cebolla.
  prs.a2.unit35.lesson03.teach.cook:
    title: Cocinar
    gloss: cocinar
    note: '*پختن* es cocinar comida. La raíz del presente es *پز*: *می‌پزم* es «cocino», *بپزم* es «que cocine» (subjuntivo, usado después de *قبل از اینکه*) y *پختم* es «cociné».'
    example_gloss: Cocino arroz.
  prs.a2.unit35.lesson03.teach.sleep:
    title: Dormir
    gloss: dormir, irse a dormir
    note: '*خوابیدن* es dormir o irse a la cama. *می‌خوابم* es «duermo» y *بخوابم* es «que duerma» (subjuntivo).'
    example_gloss: Me acuesto a las diez.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Antes de cocinar el arroz, pico la cebolla
    gloss: Antes de cocinar el arroz, pico la cebolla.
    note: 'Un paso de cocina en orden. *بپزم* es el subjuntivo después de *قبل از اینکه*; *خرد می‌کنم* es el presente para un hábito o una receta: primero la cebolla y luego el arroz.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که para un hecho puntual en pasado
    gloss: Cuando llegué a casa, cené.
    note: '*وقتی که* significa «cuando» e introduce una cláusula con su propio verbo. Para un hecho puntual en pasado, se usa el pasado simple en ambas partes: *وقتی که به خانه رسیدم* (cuando llegué a casa), *شام خوردم* (cené). Los dos hechos ocurren casi al mismo tiempo o uno justo después del otro.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که para un hábito
    gloss: Cuando llego a casa, tomo té.
    note: 'Para algo que ocurre cada vez, se usa el presente con *می‌* en ambas partes: *وقتی که به خانه می‌رسم، چای می‌خورم* es «cuando llego a casa, tomo té».'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که para algo que aún está por venir
    gloss: Mañana, cuando llegue a Herat, llamaré por teléfono.
    note: 'Cuando el momento aún no ha llegado, el verbo después de *وقتی که* va en subjuntivo (*برسم*) y el verbo principal va en presente con *می‌* más una palabra de tiempo: *فردا ... تیلفون می‌کنم* (mañana llamo, es decir, llamaré). No necesitas una forma especial de futuro.'
  prs.a2.unit35.lesson04.teach.water:
    title: Agua
    gloss: agua
    note: '*آب* es el agua. El agua fría es *آب سرد*; para el agua caliente se dice *آب گرم*.'
    example_gloss: El agua está caliente.
  prs.a2.unit35.lesson04.teach.boil:
    title: Hervir
    gloss: hervir (el agua)
    note: '*جوش شدن* es hervir. El pasado simple es *جوش شد* y el presente es *جوش می‌شود*: *آب جوش می‌شود* es «el agua hierve».'
    example_gloss: El agua hirvió.
  prs.a2.unit35.lesson04.teach.salt:
    title: Sal
    gloss: sal
    note: '*نمک* es la sal. Va junto con *برنج* y *آب* en una receta sencilla.'
    example_gloss: Hay sal y arroz en casa.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: Echar
    gloss: echar, añadir
    note: '*انداختن* es echar o meter algo dentro. En la cocina es el verbo habitual para añadir algo: *نمک را می‌اندازم* es «echo la sal». El pasado simple es *انداختم*.'
    example_gloss: Echo la sal en el agua.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: Cuando el agua hierve, echo el arroz
    gloss: Cuando el agua hierve, echo el arroz.
    note: 'Un hábito en una receta: ambos verbos van en presente con *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که o solo وقتی
    gloss: cuando llegué / cuando llegué
    note: Ambas formas son correctas. *وقتی که* es algo más completa y *وقتی* sola es más corta; el significado es el mismo. El curso usa primero *وقتی که*; puedes escribir cualquiera de las dos.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: Cuando el arroz estuvo listo, me lo comí
    gloss: Cuando el arroz estuvo listo, me lo comí.
    note: '*آماده شد* es «quedó listo». *آن را* («lo», con *را*) remite al arroz.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: Hacer la maleta
    gloss: hacer la maleta
    note: '*چمدان بستن* es hacer la maleta. El presente para «yo» es *می‌بندم*: *چمدانم را می‌بندم* es «hago mi maleta». El pasado simple es *بستم*.'
    example_gloss: Antes de un viaje hago la maleta.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Narges pregunta por la hora del vuelo
    gloss: Akbar, ¿a qué hora sale el avión mañana?
    note: Narges pregunta la hora con *ساعت چند*. *حرکت می‌کند* es el presente de *حرکت کردن* (salir, partir); con *فردا* indica lo que ocurrirá mañana.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Akbar da la hora y un primer paso
    gloss: A las diez. Antes de ir al aeropuerto, hago la maleta.
    note: Akbar da la hora y luego dice qué hace primero con una cláusula con *قبل از اینکه*. *بروم* es el subjuntivo y *می‌بندم* es el presente con sentido de futuro.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Narges pregunta por el billete
    gloss: ¿Tienes el billete?
    note: '*تکت داری؟* es una pregunta amistosa a un amigo: *داری* es «tienes», en singular informal.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Akbar dice que tiene el billete
    gloss: Sí, ayer conseguí el billete.
    note: '*گرفتم* es el pasado simple: consiguió el billete ayer. *بلی* es «sí».'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Narges le pide que llame cuando llegue
    gloss: Cuando llegues a Herat, ¿me llamarás por teléfono?
    note: La cláusula *وقتی که به هرات برسی* aún está por venir, así que el verbo va en subjuntivo *برسی* (llegues). *به من تیلفون می‌کنی؟* es «¿me llamarás?».
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Akbar lo promete
    gloss: Sí. Cuando llegue, llamaré.
    note: 'Akbar usa la misma estructura: *وقتی که برسم*, subjuntivo para «yo», y luego *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: Un mensaje sobre cómo cocinar arroz
    gloss: Hola, Akbar. Ayer cociné arroz en casa. Primero piqué la cebolla. Después de que el agua hirvió, eché la sal y el arroz. Cuando el arroz estuvo listo, me lo comí. Antes de irme a dormir, tomé té.
    note: 'Un mensaje escrito corto que usa los tres conectores para contar los pasos en orden: *اول*, *بعد از اینکه*, *وقتی که* y *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: Mi trabajo
    gloss: mi trabajo
    note: '*کار* es «trabajo» y *کارم* es «mi trabajo». *کارم را شروع می‌کنم* es «empiezo mi trabajo».'
    example_gloss: Mi trabajo está en la oficina.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Nasrin pregunta cuándo se despierta Yusuf
    gloss: Yusuf, ¿a qué hora te despiertas cada mañana?
    note: '*هر صبح* es «cada mañana». *چه وقت* pregunta «cuándo», y *بیدار می‌شوی* es «te despiertas» (a un amigo).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Yusuf da la hora y un primer paso
    gloss: A las seis. Después de despertarme, me ducho.
    note: 'Es un hábito, así que los verbos después de *بعد از اینکه* van en presente con *می‌*: *بیدار می‌شوم* y luego *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Nasrin pregunta qué viene después
    gloss: ¿Qué haces después de eso?
    note: '*بعد از آن* es «después de eso». Remite al paso que se acaba de mencionar.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Yusuf dice los siguientes pasos
    gloss: Me visto. Antes de ir a la oficina, desayuno.
    note: '*لباس می‌پوشم* es el siguiente paso. Luego viene una cláusula con *قبل از اینکه*: *بروم* es el subjuntivo y *صبحانه می‌خورم* es el verbo principal.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Nasrin pregunta por la hora de la oficina
    gloss: ¿A qué hora vas a la oficina?
    note: '*ساعت چند* pregunta la hora y *می‌روی* es «vas».'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Yusuf dice qué hace en la oficina
    gloss: A las ocho. Cuando llego, lo primero que hago es empezar mi trabajo.
    note: '*وقتی که می‌رسم* es «cuando llego» (un hábito: todos los días), y *اول کارم را شروع می‌کنم* es «primero empiezo mi trabajo».'
  prs.a2.unit35.lesson06.teach.summary:
    title: Los tres conectores juntos
    gloss: antes de que vaya; después de que llegué; cuando llegué
    note: 'Tres conectores, tres estructuras. *قبل از اینکه* + subjuntivo (*بروم*): el verbo lleva *ب-*. *بعد از اینکه* + pasado simple (*رسیدم*) en una historia, o presente para un hábito (*بیدار می‌شوم*): el primer hecho ya terminó. *وقتی که* + pasado simple, presente o subjuntivo: el tiempo verbal indica si fue una sola vez, un hábito o algo que aún está por venir. Con un sustantivo se usa *قبل از* o *بعد از* solos.'
exercises:
  prs.a2.unit35.lesson01.exercise01.recognize_before_breakfast:
    instruction: ¿Qué significa esta frase?
    correct_option: Antes del desayuno me ducho
    distractors:
    - Después del desayuno me ducho
    - Antes de la cena me ducho
    - Me ducho todas las tardes
    accepted_answers:
    - value: Antes del desayuno me ducho
