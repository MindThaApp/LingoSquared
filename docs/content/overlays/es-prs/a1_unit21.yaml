teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: La ropa
    gloss: ropa
    note: لباس significa «ropa» (la palabra general).
    example_gloss: Esta ropa es nueva.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Camisa
    gloss: camisa
    note: پیراهن significa «camisa».
    example_gloss: Esta camisa es bonita.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Pantalones
    gloss: pantalones
    note: 'پطلون significa «pantalones»: es la palabra genuina del dari afgano (un préstamo del inglés a través de «pantaloon»), distinta de شلوار del persa de Irán.'
    example_gloss: Estos pantalones son caros.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Zapatos
    gloss: zapatos
    note: کفش significa «zapatos».
    example_gloss: Estos zapatos son baratos.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Es / son
    gloss: es
    note: 'است (es): ya la conoces de la unidad de saludos.'
    example_gloss: Esto es una camisa.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Caro
    gloss: caro
    note: 'گران (caro): ya lo conoces de la unidad de compras.'
    example_gloss: Estos pantalones son caros.
  prs.a1.unit21.lesson02.teach.rang:
    title: Color
    gloss: color
    note: رنگ significa «color».
    example_gloss: ¿De qué color es esta camisa?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Negro
    gloss: negro
    note: سیاه significa «negro».
    example_gloss: Estos pantalones son negros.
  prs.a1.unit21.lesson02.teach.safid:
    title: Blanco
    gloss: blanco
    note: سفید significa «blanco».
    example_gloss: Esta camisa es blanca.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Rojo
    gloss: rojo
    note: 'سرخ significa «rojo»: es la forma del dari y del persa clásico, no قرمز, propio del persa coloquial de Irán.'
    example_gloss: Estos zapatos son rojos.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Talla
    gloss: talla
    note: اندازه significa «talla» o «tamaño» (el sustantivo).
    example_gloss: ¿Cuál es tu talla?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: ¿Cuál es tu talla?
    gloss: ¿Cuál es tu talla?
    note: اندازه شما چند است؟ pregunta literalmente «¿su talla es cuánto?».
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: ¿Es esta tu talla?
    gloss: ¿Es esta tu talla?
    note: این اندازه شما است؟ usa این (este/esto), que se presenta aquí.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Grande
    gloss: grande
    note: 'بزرگ (grande): ya lo conoces de la unidad de comparaciones.'
    example_gloss: Esta camisa es grande.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Pequeño
    gloss: pequeño
    note: 'کوچک (pequeño): ya lo conoces de la unidad de comparaciones.'
    example_gloss: Estos zapatos son pequeños.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: ¿Puedo probarme esto?
    gloss: ¿Puedo probarme esto?
    note: پرو کردن significa «probarse» (un préstamo del francés que comparten el dari y el persa). می‌توانم این را پرو کنم؟ significa literalmente «¿puedo esto probar-hacer?».
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Sí, puede probárselo
    gloss: Sí, puede probárselo.
    note: می‌توانین پرو کنین es la forma de cortesía en segunda persona del mismo verbo.
  prs.a1.unit21.lesson04.teach.label_text:
    title: Una etiqueta de ropa
    gloss: 'Camisa: talla grande, color blanco, 500 afganis'
    note: Una etiqueta sencilla que muestra la prenda, la talla, el color y el precio.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Marcador de objeto directo
    gloss: (marcador de objeto directo)
    note: را marca el complemento directo; ya lo conoces de los patrones de frases de unidades anteriores.
    example_gloss: Quiero esta camisa.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afgani
    gloss: afgani
    note: 'افغانی (afgani): la moneda, que ya conoces de la unidad de compras.'
    example_gloss: Esto cuesta 500 afganis.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: ¿De qué color es esta camisa?
    gloss: ¿De qué color es esta camisa?
    note: این پیراهن چه رنگ دارد؟ usa دارد (tiene), que se presenta aquí.
  prs.a1.unit21.lesson05.teach.turn01:
    title: El tendero saluda
    gloss: Hola, bienvenida.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina pregunta
    gloss: Hola. ¿De qué color es esta camisa?
    note: زرمینه (Zarmina) es un personaje recurrente de este curso; apareció por primera vez en las unidades de la hora y las rutinas diarias.
  prs.a1.unit21.lesson05.teach.turn03:
    title: El tendero responde
    gloss: Tengo en negro y en blanco.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina elige
    gloss: Quiero la camisa blanca. ¿Es de talla grande?
    note: اندازه‌اش (su talla) añade la terminación posesiva a اندازه.
  prs.a1.unit21.lesson05.teach.turn05:
    title: El tendero confirma
    gloss: Sí, es grande. Puede probársela.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina se prueba la ropa
    gloss: Gracias. Esta es mi talla. ¿Cuánto cuesta?
  prs.a1.unit21.lesson05.teach.turn07:
    title: El tendero dice el precio
    gloss: Son 500 afganis.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina acepta
    gloss: Muy bien, lo compro.
    note: می‌خرم es la primera persona del presente de خریدن (comprar).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Tendero
    gloss: tendero
    note: دوکاندار (tendero) -- ya lo conoces de la unidad de compras.
    example_gloss: El tendero vende camisas.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Muy bien
    gloss: muy bien
    note: بسیار خوب (muy bien) -- ya lo conoces de la unidad de compras.
    example_gloss: Muy bien, gracias.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Qué
    gloss: qué
    note: چه (qué) -- ya lo conoces de los patrones de pregunta de unidades anteriores.
    example_gloss: ¿De qué color es esto?
  prs.a1.unit21.lesson06.teach.review_va:
    title: Y
    gloss: y
    note: و (y) -- ya lo conoces de la unidad de compras.
    example_gloss: Compro una camisa y un pantalón.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Uno
    gloss: uno
    note: یک (uno) -- ya lo conoces de la unidad de números.
    example_gloss: Compro una camisa.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: A
    gloss: a
    note: به (a) -- ya lo conoces de las unidades de direcciones y rutinas diarias.
    example_gloss: Voy a la tienda.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Tienda
    gloss: tienda
    note: دوکان (tienda) -- ya lo conoces de la unidad de compras.
    example_gloss: Esta tienda es grande.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: Fue
    gloss: fue
    note: رفت (fue, tercera persona) -- ya lo conoces de la unidad de hechos pasados.
    example_gloss: Zarmina fue a la tienda.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Su precio
    gloss: su precio
    note: قیمتش (su precio) -- ya lo conoces de la unidad de compras.
    example_gloss: Su precio era de 500 afganis.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Resumen de una compra
    gloss: Zarmina fue a la tienda. Compró una camisa blanca y grande. Costaba 500 afganis.
    note: خرید (compró) y بود (era/fue) son formas del pasado simple que ya conoces de la unidad de hechos pasados.
