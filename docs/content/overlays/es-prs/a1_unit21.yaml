course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de prendas de ropa, colores, tallas, probarse una prenda, leer una etiqueta de ropa y un diálogo completo en una tienda para comprar una camisa.'
units:
  prs.a1.unit21.clothing:
    title: Comprar ropa
    description: Identifica prendas de ropa comunes y completa una compra sencilla de ropa.
lessons:
