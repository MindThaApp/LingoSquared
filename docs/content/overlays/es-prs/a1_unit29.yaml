course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de deporte y ejercicio (fútbol, voleibol, críquet, natación), preguntar y responder cuántas veces por semana haces deporte, decir dónde juegas o haces ejercicio, y un diálogo entre Zarmina y Homayoun que combina deporte, frecuencia y lugar.'
units:
  prs.a1.unit29.sports:
    title: Deportes
    description: Habla de qué deportes o ejercicio haces, con qué frecuencia y dónde.
