    note: تو (tú, informal) y می‌کنی (haces, informal) son repaso y se usan en el diálogo informal de esta lección entre amigos cercanos.
    target_text: تو (tú, informal) / می‌کنی (haces/practicas, informal)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Dónde
    gloss: dónde
    note: کجا significa «dónde». Está relacionado con کجاست (repaso de las Unidades 5 y 6, literalmente «dónde está»), pero aquí se usa solo, antes de un verbo.
    target_text: کجا (dónde)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: Él/ella hace/juega
    gloss: él/ella hace/juega
    note: می‌کند es la forma de tercera persona (repaso) de می‌کنم y می‌کنی. No se dice en este diálogo; se practica en el texto de lectura de la próxima lección.
    target_text: می‌کند (él/ella hace/juega, 3.ª persona)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿cuántas veces por semana haces ejercicio?'
    gloss: 'Homayoun: Zarmina, ¿cuántas veces por semana haces ejercicio?'
    note: Una pregunta informal entre amigos, con la forma informal می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Juego al voleibol dos veces por semana'
    gloss: 'Zarmina: Juego al voleibol dos veces por semana.'
    note: Responde con دو بار در هفته y والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¿Dónde juegas?'
    gloss: 'Homayoun: ¿Dónde juegas?'
    note: Usa کجا (dónde), que se acaba de introducir en esta lección.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Juego en el gimnasio'
    gloss: 'Zarmina: Juego en el gimnasio.'
    note: Una respuesta corta con در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Yo juego al fútbol en el parque todas las semanas'
    gloss: 'Homayoun: Yo juego al fútbol en el parque todas las semanas.'
    note: Presenta هر (cada, repaso de la Unidad 24) combinado con هفته para formar هر هفته.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: ¡Genial!'
    gloss: 'Zarmina: ¡Genial!'
    note: عالی است cierra el intercambio de forma positiva.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Lectura sobre deportes
    gloss: Zarmina juega al voleibol dos veces por semana. Juega en el gimnasio. Homayoun juega al fútbol en el parque todas las semanas.
    note: Un texto breve que repasa el vocabulario deportivo de la unidad, con می‌کند (hace, tercera persona, repaso) y او (él/ella, repaso) aplicados a los dos personajes ya conocidos.
  prs.a1.unit29.lesson06.teach.review_ama:
