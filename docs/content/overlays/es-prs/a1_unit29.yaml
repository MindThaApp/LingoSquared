  prs.a1.unit29.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Deporte
    gloss: deporte / ejercicio
    note: ورزش significa deporte o ejercicio; es la palabra general para cualquier actividad física.
    example_gloss: La natación es un buen deporte.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Fútbol
    gloss: fútbol
    note: فوتبال significa fútbol.
    example_gloss: El fútbol es un buen deporte.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Voleibol
    gloss: voleibol
    note: والیبال significa voleibol.
    example_gloss: El voleibol también es un deporte.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Críquet
    gloss: críquet
    note: کرکت significa críquet, un deporte muy popular precisamente en Afganistán.
    example_gloss: El críquet es un deporte popular.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Natación
    gloss: natación
    note: شنا significa natación.
    example_gloss: La natación es un buen deporte.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Juego / hacer → jugar
    gloss: juego / hacer → juego
    note: 'بازی (juego/jugar) se combina con کردن (hacer, repaso) para formar بازی می‌کنم (juego): es el mismo patrón de verbo compuesto que ya viste en پیاده‌روی می‌کنم y آشپزی می‌کنم.'
    target_text: بازی (juego/jugar) + کردن (hacer) = بازی می‌کنم (juego)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: El fútbol es un deporte
    gloss: El fútbol es un deporte.
    note: Combina فوتبال، یک (un/una, repaso), ورزش y است (es, repaso).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Cuántos
    gloss: cuántos / cuántas
    note: چند se usa aquí para preguntar por la frecuencia.
    target_text: چند (cuántos)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Vez (ocasión)
    gloss: vez (como en «una vez», una ocasión)
    note: بار significa «vez» en el sentido de contar ocasiones, no de hora del reloj.
    example_gloss: Nado una vez por semana.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: En / semana
    gloss: en / semana
    note: در (en, repaso) y هفته (semana, repaso de las unidades 4 y 9) se combinan para significar «por semana».
    target_text: در (en) / هفته (semana)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: Usted hace ejercicio (formal)
    gloss: haces deporte (usted)
    note: ورزش می‌کنین es la forma cortés y formal de «haces ejercicio».
    target_text: ورزش می‌کنین (usted hace ejercicio, formal)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: ¿Cuántas veces por semana hace ejercicio?
    gloss: ¿Cuántas veces por semana hace ejercicio?
    note: Combina چند بار (cuántas veces) + در هفته (por semana) + ورزش می‌کنین (hace ejercicio, forma formal).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Juego al fútbol dos veces por semana
    gloss: Juego al fútbol dos veces por semana.
    note: دو (dos, repaso de la Unidad 4) بار در هفته indica la frecuencia antes de nombrar el deporte y la construcción بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: Gimnasio
    gloss: gimnasio
    note: باشگاه significa gimnasio o club deportivo.
    example_gloss: El gimnasio es grande.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Parque
    gloss: parque
    note: پارک es un repaso de la lección de planes de la Unidad 13.
