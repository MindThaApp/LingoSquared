    note: اما significa «pero» (repaso de unidades anteriores).
    target_text: اما (pero)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: Me gusta / tiempo / no tengo
    gloss: me gusta / tiempo / no tengo
    note: دوست دارم (me gusta, repaso de las Unidades 14 y 26), وقت (tiempo, repaso de las Unidades 11 y 26) y ندارم (no tengo, repaso de las Unidades 3 y 28) se combinan en la oración final.
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo)
