teaching:
  prs.a1.unit42.lesson01.teach.review_appointment_doctor_have:
    title: 'Repaso: cita, médico, tengo, es'
    gloss: cita / médico / tengo / es
    note: قرار, داکتر, دارم y است son palabras de repaso que sirven para hablar de una cita.
    target_text: قرار (cita) / داکتر (médico) / دارم (tengo) / است (es/está)
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 'Repaso: quiero, un/una'
    gloss: quiero / un, una / uno
    note: می‌خواهم y یک se combinan para decir lo que quieres.
    target_text: می‌خواهم (quiero) / یک (un/una, uno)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Diente
    gloss: diente
    note: دندان es la palabra estándar en dari para decir diente.
    example_gloss: Tengo un diente.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Dentista
    gloss: dentista
    note: داکتر دندان significa literalmente «médico de dientes» y es la palabra estándar en el dari de Afganistán para dentista.
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: Quiero una cita
    gloss: Quiero una cita.
    note: یک قرار می‌خواهم combina یک (un/una), قرار (cita) y می‌خواهم (quiero).
  prs.a1.unit42.lesson01.teach.review_with:
    title: 'Repaso: con'
    gloss: con
    note: با significa con.
    target_text: با (con)
  prs.a1.unit42.lesson01.teach.want_appointment_dentist_phrase:
    title: Quiero una cita con el dentista
    gloss: Quiero una cita con el dentista.
    note: با داکتر دندان (con el dentista) se añade a یک قرار می‌خواهم.
  prs.a1.unit42.lesson02.teach.review_which_day:
    title: 'Repaso: qué, día'
    gloss: qué / día
    note: کدام y روز son palabras de repaso que sirven para preguntar por un día.
    target_text: کدام (cuál) / روز (día)
  prs.a1.unit42.lesson02.teach.review_free_are:
    title: 'Repaso: libre, está usted (formal)'
    gloss: libre / está usted (formal)
    note: آزاد y استین se combinan para preguntar si alguien está libre.
    target_text: آزاد (libre) / استین (están, usted)
  prs.a1.unit42.lesson02.teach.which_day_free_phrase:
    title: ¿Qué día está libre usted?
    gloss: ¿Qué día está libre usted?
    note: کدام روز آزاد استین؟ pregunta qué día está disponible alguien.
  prs.a1.unit42.lesson02.teach.review_monday_am:
    title: 'Repaso: lunes, estoy'
    gloss: lunes / estoy
    note: دوشنبه y استم son palabras de repaso que sirven para responder.
    target_text: دوشنبه (lunes) / استم (estoy)
  prs.a1.unit42.lesson02.teach.day_free_answer_phrase:
    title: Estoy libre el lunes
    gloss: Estoy libre el lunes.
    note: دوشنبه آزاد استم responde a la pregunta con un día concreto.
  prs.a1.unit42.lesson02.teach.review_hour_what:
    title: 'Repaso: hora, qué/cuánto'
    gloss: hora / en punto / qué
    note: ساعت y چند (ambas de la Unidad 9 y la Unidad 11) se combinan para preguntar por la hora.
    target_text: ساعت (hora / en punto) / چند (cuánto/cuántos)
  prs.a1.unit42.lesson02.teach.what_time_free_phrase:
    title: ¿A qué hora está libre usted?
    gloss: ¿A qué hora está libre usted?
    note: ساعت چند آزاد استین؟ pregunta a qué hora está disponible alguien.
  prs.a1.unit42.lesson03.teach.review_want_appointment:
    title: 'Repaso: quiero, cita'
    gloss: quiero / cita
    note: می‌خواهم y قرار son palabras de repaso que sirven para pedir una cita.
    target_text: می‌خواهم (quiero) / قرار (cita)
  prs.a1.unit42.lesson03.teach.get_word:
    title: Conseguir / tomar
    gloss: conseguir / tomar
    note: بگیرم es la forma de subjuntivo («que consiga/tome»), que se usa con می‌خواهم para decir «quiero conseguir».
    example_gloss: Quiero conseguir una cita.
  prs.a1.unit42.lesson03.teach.for_word:
    title: Para
    gloss: para
    note: برای significa para.
    example_gloss: Para el dentista.
  prs.a1.unit42.lesson03.teach.review_ten_how:
    title: 'Repaso: diez, cómo'
    gloss: diez / cómo
    note: ده y چطور son palabras de repaso que sirven para proponer una hora.
    target_text: ده (diez) / چطور (cómo)
  prs.a1.unit42.lesson03.teach.confirm_time_phrase:
    title: ¿Qué tal el lunes a las diez?
    gloss: ¿Qué tal el lunes a las diez?
    note: دوشنبه ساعت ده چطور است؟ propone un día y una hora concretos.
  prs.a1.unit42.lesson03.teach.review_very_good:
    title: 'Repaso: muy, bueno'
    gloss: muy / bueno
    note: بسیار y خوب son palabras de repaso que sirven para confirmar una hora.
    target_text: بسیار (muy) / خوب (bueno)
  prs.a1.unit42.lesson03.teach.confirm_answer_phrase:
    title: Me parece muy bien
    gloss: Me parece muy bien.
    note: بسیار خوب است confirma que la hora propuesta le viene bien.
  prs.a1.unit42.lesson04.teach.review_greeting_want:
    title: 'Repaso: hola, quiero'
    gloss: hola / quiero
    note: سلام y می‌خواهم son palabras de repaso que se usan en el diálogo.
    target_text: سلام (hola) / می‌خواهم (quiero)
  prs.a1.unit42.lesson04.teach.review_thanks_welcome:
    title: 'Repaso: muchas gracias, de nada'
    gloss: muchas gracias / de nada
    note: تشکر زیاد y خواهش می‌کنم son palabras de repaso que se usan en el diálogo.
    target_text: تشکر زیاد (muchas gracias) / خواهش می‌کنم (de nada)
  prs.a1.unit42.lesson04.teach.receptionist_word:
    title: Recepcionista
    gloss: recepcionista
    note: منشی significa secretario/a o recepcionista, la persona que atiende el teléfono en la consulta de un médico o dentista.
    example_gloss: Soy recepcionista.
  prs.a1.unit42.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hola. Quiero pedir una cita con el dentista.'
    gloss: Hola. Quiero pedir una cita con el dentista.
  prs.a1.unit42.lesson04.teach.dialogue_line2:
    title: 'Recepcionista: Hola. ¿Qué día está libre usted?'
    gloss: Hola. ¿Qué día está libre usted?
  prs.a1.unit42.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Estoy libre el lunes.'
    gloss: Estoy libre el lunes.
  prs.a1.unit42.lesson04.teach.dialogue_line4:
    title: 'Recepcionista: Muy bien. ¿Qué tal el lunes a las diez?'
    gloss: Muy bien. ¿Qué tal el lunes a las diez?
  prs.a1.unit42.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Me parece muy bien. Muchas gracias.'
    gloss: Me parece muy bien. Muchas gracias.
  prs.a1.unit42.lesson04.teach.dialogue_line6:
    title: 'Recepcionista: De nada.'
    gloss: De nada.
  prs.a1.unit42.lesson05.teach.review_he_she_has:
    title: 'Repaso: Homayoun, él/ella, tiene'
    gloss: Homayoun / él, ella / tiene
    note: همایون, او y دارد son palabras de repaso que se usan en el texto de lectura.
    target_text: همایون (Homayoun) / او (él/ella) / دارد (él/ella tiene)
  prs.a1.unit42.lesson05.teach.reading_passage:
    title: Lectura sobre la cita
    gloss: Homayoun tiene una cita. Su cita es con el dentista. Su cita es el lunes. Su cita es a las diez. Homayoun está contento.
  prs.a1.unit42.lesson06.teach.review_wrap_up_words:
    title: 'Repaso: no tengo, pero, usted (formal)'
    gloss: no tengo / pero / usted (formal)
    note: ندارم, اما y شما son palabras de repaso que sirven para contrastar dos días.
    target_text: ندارم (no tengo) / اما (pero) / شما (usted)
  prs.a1.unit42.lesson06.teach.review_tuesday:
    title: 'Repaso: martes'
    gloss: martes
    note: سه‌شنبه es una palabra de repaso.
    target_text: سه‌شنبه (martes)
  prs.a1.unit42.lesson06.teach.contrast_phrase:
    title: El lunes tengo cita, pero el martes no
    gloss: El lunes tengo una cita, pero el martes no tengo.
    note: اما contrasta tener una cita el lunes con no tenerla el martes.
  prs.a1.unit42.lesson06.teach.formal_question_phrase:
    title: ¿Qué día está libre usted?
    gloss: ¿Qué día está libre usted?
    note: La versión formal, con شما, de la pregunta sobre qué día está libre alguien.
