course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: pide y confirma una cita sencilla indicando el servicio, el día y la hora; pregunta qué día está libre alguien, propón y confirma un día y una hora, y lee un breve texto sobre una cita reservada.'
units:
  prs.a1.unit42.appointments:
    title: Pedir una cita
    description: Pregunta qué día está libre alguien, nombra un servicio, propón y confirma un día y una hora, y lee un breve texto sobre una cita reservada.
