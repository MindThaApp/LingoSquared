teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Me gusta
    gloss: me gusta
    note: دوست دارم significa literalmente «tengo amistad (con ello)»; es la forma habitual de decir «me gusta».
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Café
    gloss: café
    note: قهوه significa «café».
    example_gloss: Me gusta el café.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Té
    gloss: té
    note: چای significa «té».
    example_gloss: No me gusta el té.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: No me gusta
    gloss: no me gusta
    note: دوست ندارم es la forma negativa de دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: yo
    gloss: yo
    note: 'من es el pronombre independiente de primera persona: «yo».'
    example_gloss: Me gusta el café.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (marca de objeto directo)
    gloss: (marca el complemento directo del verbo)
    note: را marca un complemento directo determinado. En dari se usa tanto al hablar como al escribir; la forma رو, propia del persa de Irán, no se usa.
    target_text: را (marca de objeto directo)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Cuál
    gloss: cuál
    note: کدام significa «cuál» (de ellos).
    example_gloss: ¿Cuál te gusta?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: La música
    gloss: música
    note: موسیقی significa «música».
    example_gloss: Me gusta la música.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: Usted tiene/le gusta (cortesía)
    gloss: tienes / te gusta
    note: دارین es la forma de segunda persona de cortesía o plural del verbo داشتن (tener), en línea con el registro de este curso, que prefiere primero la forma de cortesía استم/استین.
    target_text: دارین (usted tiene/le gusta, forma de cortesía)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: ¿Cuál te gusta?
    gloss: ¿Cuál te gusta?
    note: کدام را دوست دارین؟ — را marca el complemento directo, aquí la cosa que eliges.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Más
    gloss: más
    note: بیشتر significa «más».
    example_gloss: Me gusta más el café.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: O
    gloss: o
    note: یا significa «o» y sirve para ofrecer una elección entre dos cosas.
    target_text: یا (o)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: ¿Café o té?
    gloss: ¿Café o té?
    note: قهوه یا چای؟ ofrece elegir entre las dos bebidas presentadas en la lección 1.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Porque
    gloss: porque
    note: 'چون introduce una razón: «porque».'
    target_text: چون (porque)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: Es delicioso
    gloss: es delicioso
    note: خوش‌مزه است es la forma completa, sin contraer (es delicioso); el registro de este curso mantiene است separado y no lo contrae.
    example_gloss: Me gusta el café porque es delicioso.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: Es interesante
    gloss: es interesante
    note: جالب است es la forma completa, sin contraer (es interesante).
    example_gloss: Me gusta la música porque es interesante.
  prs.a1.unit14.lesson04.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Negar
    gloss: Negar
    note: Un nombre femenino afgano muy común.
    example_gloss: A Negar le gusta el té.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Le gusta (a él/ella)
    gloss: le gusta
    note: دارد es la forma completa de tercera persona de داشتن (tener); دوست دارد significa «le gusta», igual que el patrón de دوست دارم en primera persona.
    target_text: دوست دارد (le gusta a él/ella, forma completa de tercera persona)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: No le gusta (a él/ella)
    gloss: no le gusta
    note: ندارد es la forma negativa completa de tercera persona; دوست ندارد significa «no le gusta».
    target_text: دوست ندارد (no le gusta a él/ella, forma completa de tercera persona)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: Está caliente
    gloss: está caliente
    note: گرم است es la forma completa, sin contraer (está caliente).
    example_gloss: A Negar le gusta el té porque está caliente.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Texto de ejemplo sobre preferencias
    gloss: A Negar le gusta el té porque está caliente. A Negar no le gusta la música.
    note: Un breve relato en tercera persona que combina el vocabulario de preferencias de esta unidad.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim y Negar
    gloss: Karim, Negar
    note: Nombres afganos comunes que se usan a lo largo de este curso.
    example_gloss:
    - Soy Karim.
    - Soy Negar.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: ¿Y usted?
    gloss: ¿Y usted?
    note: شما چطور؟ es la forma cortés de devolver la pregunta a la otra persona, en línea con el registro de cortesía de la familia de استین.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: Es genial
    gloss: es genial
    note: عالی است es la forma completa, sin contraer (es genial).
    example_gloss: El café es genial.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Karim pregunta
    gloss: ¿Té o café? ¿Cuál le gusta más?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Negar responde
    gloss: Me gusta más el café porque es delicioso. ¿Y usted?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim responde
    gloss: Me gusta el té porque está caliente.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Negar reacciona
    gloss: ¡Genial!
