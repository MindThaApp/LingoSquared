    title: Diálogo sobre el trayecto diario
  prs.a1.unit24.lesson05.reading_commute:
    title: Lectura sobre el trayecto diario
  prs.a1.unit24.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit24.lesson01.teach.bus:
    title: Autobús
    gloss: autobús
    note: بس significa «autobús».
    example_gloss: El autobús está llegando.
  prs.a1.unit24.lesson01.teach.taxi:
    title: Taxi
    gloss: taxi
    note: تکسی significa «taxi».
    example_gloss: Tomo un taxi.
  prs.a1.unit24.lesson01.teach.car:
    title: Coche
    gloss: coche
    note: موتر significa «coche»; es la palabra cotidiana habitual en el dari de Afganistán (en el persa de Irán se dice ماشین).
    example_gloss: Tengo un coche.
  prs.a1.unit24.lesson01.teach.bicycle:
    title: Bicicleta
    gloss: bicicleta
    note: دوچرخه significa «bicicleta».
    example_gloss: Tengo una bicicleta.
  prs.a1.unit24.lesson01.teach.on_foot:
    title: A pie
    gloss: a pie / caminando
    note: پیاده significa «a pie» o «caminando».
    example_gloss: Voy a pie.
  prs.a1.unit24.lesson01.teach.review_miravam:
    title: Voy
    gloss: voy
    note: می‌روم significa «voy» (ya se vio antes en el curso).
    example_gloss: Voy a pie.
  prs.a1.unit24.lesson02.teach.ba:
    title: En/con
    gloss: en/con (medio de transporte)
    note: با es la preposición instrumental; se usa para decir «en [medio de transporte]».
    example_gloss: Voy en autobús.
  prs.a1.unit24.lesson02.teach.ba_bus:
    title: Voy en autobús
    gloss: Voy en autobús.
    note: با بس می‌روم significa «Voy en autobús».
  prs.a1.unit24.lesson02.teach.ba_taxi:
    title: Voy en taxi
    gloss: Voy en taxi.
    note: با تکسی می‌روم significa «Voy en taxi».
  prs.a1.unit24.lesson02.teach.chetor:
    title: Cómo
    gloss: cómo
    note: چطور significa «cómo».
    example_gloss: ¿Cómo vas?
  prs.a1.unit24.lesson02.teach.chetor_miravi:
    title: ¿Cómo vas?
    gloss: ¿Cómo vas?
    note: Pregunta habitual para saber en qué medio de transporte se desplaza alguien.
  prs.a1.unit24.lesson03.teach.ticket:
    title: Billete
    gloss: billete
    note: تکت significa «billete» o «boleto»; es un préstamo muy común en el uso cotidiano.
    example_gloss: Compro un billete.
  prs.a1.unit24.lesson03.teach.station:
    title: Estación
    gloss: estación/parada
    note: ایستگاه significa «estación» o «parada».
    example_gloss: ¿Dónde está la estación de autobuses?
  prs.a1.unit24.lesson03.teach.ticket_price_q:
    title: ¿Cuánto cuesta el billete?
    gloss: ¿Cuánto cuesta el billete?
    note: Pregunta habitual al comprar un billete.
  prs.a1.unit24.lesson03.teach.review_khoram:
    title: Compro
    gloss: compro
    note: می‌خرم significa «compro» (ya se vio antes en el curso).
    example_gloss: Compro un billete.
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Zarmina: ¿Cómo vas a la ciudad?'
    gloss: 'Zarmina: Homayoun, ¿cómo vas a la ciudad?'
    note: شهر significa «ciudad»; es nuevo en esta línea.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun: Voy a pie, está cerca'
    gloss: 'Homayoun: Voy a pie, está cerca. ¿Y tú, cómo vas?'
    note: نزدیک significa «cerca»; es nuevo en esta línea.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina: Voy en taxi, es directo y rápido'
    gloss: 'Zarmina: Voy en taxi, es directo y rápido.'
    note: تیز significa «rápido»; es nuevo en esta línea.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: El autobús también está bien, es barato'
    gloss: 'Homayoun: El autobús también está bien, es barato.'
    note: ارزان significa «barato»; es nuevo en esta línea.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Sí, pero el taxi es más rápido'
    gloss: 'Zarmina: Sí, pero el taxi es más rápido.'
    note: اما significa «pero»; تیزتر es el comparativo «más rápido».
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lectura sobre el trayecto diario
    gloss: Zarmina va a la ciudad en taxi todos los días. El taxi es rápido, pero no es barato. Homayoun va a pie porque su casa está cerca. Ahorra dinero para un coche.
    note: Breve texto de lectura que repasa el vocabulario de la unidad y el conector «چون» (porque).
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Bicicleta (repaso)
    gloss: bicicleta
    note: دوچرخه significa «bicicleta» (repaso de la lección 1).
    example_gloss: Voy en bicicleta.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: Voy a pie o en autobús todos los días
    gloss: Todos los días voy a pie o en autobús.
    note: یا significa «o»; es nuevo en esta frase de resumen final.
