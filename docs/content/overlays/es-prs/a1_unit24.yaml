course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de transporte (autobús, taxi, coche, bicicleta, a pie), cómo decir en qué te desplazas, comprar un billete y un diálogo entre Zarmina y Homayoun que compara opciones para ir al trabajo.'
units:
  prs.a1.unit24.transportation:
    title: El transporte
    description: Habla de cómo te mueves por la ciudad, compra un billete y pregunta qué transporte tomar.
lessons:
  prs.a1.unit24.lesson01.transport_vocabulary:
    title: Palabras de transporte
  prs.a1.unit24.lesson02.how_you_go:
