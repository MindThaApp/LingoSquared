    title: Vamos
    gloss: vamos
    note: برویم («vamos») es la forma de subjuntivo de «nosotros» que se usa para hacer sugerencias.
    example_gloss: Vamos al parque.
  prs.a1.unit13.lesson01.teach.chetor_ast_word:
    title: ¿Qué tal?
    gloss: ¿Qué tal?
    note: چطور است؟ usa la forma completa است, sin contraer, de acuerdo con el registro de este curso.
  prs.a1.unit13.lesson02.teach.mikhahid_word:
    title: ¿Quieren? (forma cortés)
    gloss: ¿quieren? (forma cortés)
    note: می‌خواهین («¿quieren?», forma cortés) sirve para empezar una pregunta con una propuesta.
    example_gloss: ¿Quieren ir al parque?
  prs.a1.unit13.lesson02.teach.jomeh_review:
    title: Viernes (repaso)
    gloss: viernes
    note: جمعه repasa el nombre del día de la Unidad 9.
    example_gloss: ¿Vamos al parque el viernes?
  prs.a1.unit13.lesson02.teach.propose_phrase:
    title: ¿Quieren ir al parque el viernes?
    gloss: ¿Quieren ir al parque el viernes?
    note: می‌خواهین جمعه برویم پارک؟ combina las palabras de esta lección en una propuesta completa.
  prs.a1.unit13.lesson03.teach.khoob_ast_word:
    title: Bien
    gloss: bien
    note: خوب است significa «está bien».
