    note: چه ساعت؟ es una forma natural de preguntar por una hora concreta.
  prs.a1.unit13.lesson06.teach.dialogue_line1:
    title: Negar, ¿quieres ir al parque el viernes?
    gloss: Negar, ¿quieres ir al parque el viernes?
    note: Farid empieza proponiendo el plan.
  prs.a1.unit13.lesson06.teach.dialogue_line2:
    title: ¿A qué hora?
    gloss: ¿A qué hora?
    note: Negar pregunta la hora concreta antes de decidir.
  prs.a1.unit13.lesson06.teach.dialogue_line3:
    title: A las cinco de la tarde.
    gloss: A las cinco de la tarde.
    note: Farid indica la hora.
  prs.a1.unit13.lesson06.teach.dialogue_line4:
    title: Vale, ¡genial! Trato hecho.
    gloss: Vale, ¡genial! Trato hecho.
    note: Negar acepta con entusiasmo.
  prs.a1.unit13.lesson06.teach.dialogue_line5:
    title: Bien, nos vemos el viernes.
    gloss: Bien, nos vemos el viernes.
    note: Farid confirma y cierra la conversación con el formal شما را می‌بینم.
