    title: Genial
    gloss: genial
    note: عالی است significa «genial» o «excelente».
    example_gloss: El parque es genial.
  prs.a1.unit13.lesson03.teach.qabool_ast_word:
    title: Trato hecho
    gloss: trato hecho / de acuerdo
    note: قبول است significa «aceptado» o «de acuerdo».
    example_gloss: Trato hecho, vamos al parque el viernes.
  prs.a1.unit13.lesson03.teach.aali_o_qabool:
    title: Genial y trato hecho
    gloss: ¡Genial y trato hecho!
    note: '*و* («y») une dos oraciones cortas, por ejemplo *عالی است و قبول است*.'
  prs.a1.unit13.lesson04.teach.motasef_astam_word:
    title: Lo siento
    gloss: lo siento
    note: متأسف استم significa «lo siento» y usa la cópula استم ya vista.
    example_gloss: Lo siento, tengo cosas que hacer.
  prs.a1.unit13.lesson04.teach.nemitawanam_word:
    title: No puedo
