  prs.a1.unit13.lesson05.teach.shoma_ra_mibinam_word:
    title: Nos vemos
    gloss: nos vemos
    note: شما را می‌بینم (te veré, forma de cortesía) es una forma habitual de cerrar la confirmación de un plan.
    example_gloss: Nos vemos el viernes.
