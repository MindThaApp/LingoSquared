course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de celebraciones y cumpleaños (cumpleaños, celebración, pastel, regalo, felicitaciones), cómo preguntar y decir en qué mes es el cumpleaños, una fórmula formal de invitación y un diálogo entre Basir y Maryam sobre una fiesta de cumpleaños.'
units:
  prs.a1.unit32.celebrations:
    title: Celebraciones
    description: 'Habla de cumpleaños y celebraciones: di cuándo es tu cumpleaños, invita a alguien y felicítalo.'
lessons:
  prs.a1.unit32.lesson01.celebration_vocabulary:
    title: Palabras de celebración
  prs.a1.unit32.lesson02.birthday_month:
    title: Mes del cumpleaños
  prs.a1.unit32.lesson03.invitation_phrase:
    title: Invitación a una celebración
  prs.a1.unit32.lesson04.celebration_dialogue:
    title: Diálogo en una fiesta de cumpleaños
  prs.a1.unit32.lesson05.reading_celebration:
    title: Lectura sobre una celebración
  prs.a1.unit32.lesson06.wrap_up:
    title: Repaso
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: Cumpleaños
    gloss: cumpleaños
    note: تولد significa cumpleaños, la palabra central de esta unidad.
    example_gloss: Mi cumpleaños es en Hamal.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Celebración
    gloss: celebración / fiesta
    note: جشن significa celebración o fiesta.
    example_gloss: Nuestra celebración es grande.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Pastel
    gloss: pastel
    note: کیک significa pastel; es un préstamo habitual compartido entre el persa y el dari.
    example_gloss: El pastel está delicioso.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Regalo
    gloss: regalo / obsequio
    note: هدیه significa regalo u obsequio; es una palabra cotidiana muy común en dari y persa (también se usa تحفه).
    example_gloss: Este regalo es para usted.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Felicitaciones
    gloss: felicitaciones
    note: تبریک significa felicitaciones; se usa con می‌گویم (digo) en la frase cotidiana تبریک می‌گویم (te felicito).
    example_gloss: ¡Felicidades!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Feliz cumpleaños (formación)
    gloss: tu cumpleaños (informal) + bendito → Feliz cumpleaños
    note: تولدت une تولد (cumpleaños) con el sufijo informal -ت («tu»); مبارک significa bendito/feliz. Juntos, تولدت مبارک es el saludo de cumpleaños estándar en dari y persa.
    target_text: تولدت (tu cumpleaños, informal) + مبارک (bendecido) = تولدت مبارک (Feliz cumpleaños)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: ¡Feliz cumpleaños!
    gloss: ¡Feliz cumpleaños!
    note: El saludo de cumpleaños auténtico y muy usado en dari y persa (تولدتان مبارک es la variante de registro formal, que no se practica en los ejercicios de esta unidad).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: Usted / en / es
    gloss: usted (formal) / en / es
    note: شما (usted), در (en) y است (es/está) ya los conoces de unidades anteriores.
    target_text: شما (usted, formal) / در (en) / است (es, está)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: Yo / cuál
    gloss: yo / cuál
    note: من (yo) y کدام (cuál) ya los conoces de unidades anteriores.
    target_text: من (yo) / کدام (cuál)
  prs.a1.unit32.lesson02.teach.month_word:
    title: Mes
    gloss: mes
    note: ماه significa «mes» y es una palabra totalmente nueva en este curso.
    example_gloss: Este mes hace calor.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: Hamal (el primer mes)
    note: حمل es el primer mes del calendario solar hégira.
    target_text: حمل (Hamal, el primer mes)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: ¿En qué mes es tu cumpleaños?
    gloss: ¿En qué mes es su cumpleaños?
    note: Combina تولد (cumpleaños, repaso), شما (usted, repaso), در (en, repaso), کدام (cuál, repaso) y ماه (mes).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: Mi cumpleaños es en Hamal
    gloss: Mi cumpleaños es en Hamal.
    note: Combina تولد من در ... است (mi cumpleaños es en ..., estructura de repaso) con حمل (Hamal).
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Invitación / fiesta
    gloss: invitación / fiesta
    note: دعوت y مهمانی se vuelven a presentar aquí como vocabulario de esta unidad.
    target_text: دعوت (invitación) / مهمانی (fiesta)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Marcador de objeto directo / a
    gloss: marca de objeto directo / a, hacia
    note: را (marca de objeto directo) y به (a, hacia) son palabras funcionales de repaso.
    target_text: را (marcador de objeto directo) / به (a / hacia)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: Hago
    gloss: hago → invito
    note: می‌کنم (hago, repaso) se une a دعوت para formar la expresión verbal دعوت می‌کنم (invito).
    target_text: می‌کنم (hago) — دعوت می‌کنم (invito)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: Te invito a la fiesta de cumpleaños
    gloss: Los invito a la fiesta de cumpleaños.
    note: Combina من ... را به ... دعوت می‌کنم (invito a ... a ..., estructura de repaso) con جشن تولد (fiesta de cumpleaños).
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: ¿Vendrá usted? (formal)
    gloss: ¿vendrá usted? (formal)
    note: می‌آیین sigue el patrón formal de verbos en -ین que ya viste (como استین, می‌خوانین y می‌کنین).
    target_text: می‌آیین؟ (¿vendrá usted?, formal)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: ¿Vendrá usted?
    gloss: ¿Vendrá usted?
    note: Combina شما (usted, repaso) con می‌آیین.
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: Viernes / hora / cuántos / siete
    gloss: viernes / hora, en punto / cuántos, qué / siete
    note: جمعه, ساعت, چند y هفت ya los conoces de unidades anteriores (fechas y hora).
    target_text: جمعه (viernes) / ساعت (hora / en punto) / چند (cuántos / qué) / هفت (siete)
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: Tú (informal) / vienes / vengo / sí / muy bien / muchas gracias
    gloss: tú / vienes (informal) / vengo / sí / muy bien / muchas gracias
    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب y تشکر زیاد son de repaso y se reúnen aquí para el diálogo informal.
    target_text: تو (tú, informal) / می‌آیی (vienes, informal) / می‌آیم (vengo) / بلی (sí) / بسیار خوب (muy bien) / تشکر زیاد (muchas gracias)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Basir: Maryam, el viernes es mi fiesta de cumpleaños. ¿Vienes?'
    gloss: Maryam, el viernes es mi fiesta de cumpleaños. ¿Vienes?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: 'Maryam: ¡Sí, voy! ¿A qué hora es el viernes?'
    gloss: ¡Sí, voy! ¿A qué hora es el viernes?
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: 'Basir: Es a las siete.'
    gloss: Es a las siete.
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: 'Maryam: Muy bien. ¡Feliz cumpleaños, Basir!'
    gloss: Muy bien. ¡Feliz cumpleaños, Basir!
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: 'Basir: ¡Muchas gracias!'
    gloss: ¡Muchas gracias!
  prs.a1.unit32.lesson05.teach.happy_word:
    title: Feliz
    gloss: feliz
    note: خوشحال significa «feliz» o «contento».
    example_gloss: Él/Ella está contento/a.
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: Él/ella / un, uno
    gloss: él/ella / un, una, uno
    note: او (él/ella, repaso de la unidad 31) y یک (un/una/uno, repaso de la unidad 4) se vuelven a presentar aquí.
    target_text: او (él / ella) / یک (un / uno)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: Él/ella viene / él/ella trae
    gloss: él/ella viene / él/ella trae
    note: می‌آید y می‌آورد son formas de tercera persona, con la terminación -د ya conocida (por ejemplo می‌خواند, de la unidad 31).
    target_text: می‌آید (él/ella viene) / می‌آورد (él/ella trae)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: Lectura sobre una fiesta
    gloss: La fiesta de cumpleaños de Basir es el viernes. Es a las siete. Maryam viene a la fiesta. Ella trae un regalo. Basir está contento.
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: Me gusta / tiempo / no tengo / pero
    gloss: me gusta / tiempo / no tengo / pero
    note: دوست دارم (me gusta), وقت (tiempo), ندارم (no tengo) y اما (pero) son de repaso y continúan la construcción con la que cerró la unidad 31.
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo) / اما (pero)
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: Me gustan las fiestas, pero no tengo tiempo
    gloss: Me gustan las fiestas, pero no tengo tiempo.
    note: Combina جشن را دوست دارم (me gustan las fiestas, estructura de repaso) con اما وقت ندارم (pero no tengo tiempo).
