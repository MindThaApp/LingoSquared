course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario del aspecto físico (alto, bajo, pelo, ojos, barba, gafas), cómo preguntar cómo es alguien con قیافه‌اش چطور است؟, el color del pelo y de los ojos (رنگ مو/رنگ چشم) y un diálogo entre Zarmina y Homayoun sobre cómo reconocer a alguien por su aspecto.'
units:
  prs.a1.unit27.appearance:
    title: El aspecto físico
    description: Describe el aspecto físico básico de una persona y pregunta cómo es alguien.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Palabras del aspecto
  prs.a1.unit27.lesson02.appearance_question:
    title: Preguntar por el aspecto
  prs.a1.unit27.lesson03.hair_eye_color:
    title: Color de pelo y de ojos
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Diálogo sobre el aspecto
  prs.a1.unit27.lesson05.reading_appearance:
    title: Lectura sobre el aspecto
  prs.a1.unit27.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Alto
    gloss: alto
    note: 'قد بلند significa literalmente «estatura larga»: قد (estatura) + بلند (largo/alto).'
    example_gloss: Es alto/alta.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Bajo
    gloss: bajo
    note: 'قد کوتاه significa literalmente «estatura corta»: قد (estatura, repaso) + کوتاه (corto).'
    example_gloss: Es bajo/baja.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: El pelo
    gloss: pelo
    note: مو significa pelo; موی es la misma palabra en forma de enlace (construct), que se usa antes de otra palabra (p. ej. موی سیاه, «pelo negro»).
    example_gloss: Su pelo es negro.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Ojo
    gloss: ojo
    note: چشم significa ojo (se usa en singular para describir el color de los ojos, que es la forma natural y cotidiana).
    example_gloss: Sus ojos son negros.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Barba
    gloss: barba
    note: ریش significa barba.
    example_gloss: Tiene barba.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Gafas
    gloss: gafas
    note: عینک significa gafas.
    example_gloss: Tiene gafas.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Es / tiene (3.ª persona)
    gloss: es / tiene (3.ª persona)
    note: است (es) y دارد (tiene, 3.ª persona) ya los conoces de antes en el curso; se usan a lo largo de esta unidad para describir el aspecto de alguien.
    target_text: است (es/está) / دارد (tiene, 3.ª persona)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Aspecto / apariencia
    gloss: aspecto / apariencia
    note: قیافه significa el aspecto o la apariencia de una persona (por ejemplo, خوش قیافه, «de buen aspecto»).
    example_gloss: Su aspecto es bueno.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Cómo
    gloss: cómo
    note: چطور significa «cómo» (ya apareció antes en el curso, en saludos como چطور استین؟).
    target_text: چطور (cómo)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Su aspecto
    gloss: su aspecto
    note: قیافه‌اش une قیافه (aspecto) con el sufijo posesivo ‌اش («su»).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: ¿Cómo es él/ella físicamente?
    gloss: ¿Cómo es él/ella físicamente?
    note: قیافه‌اش چطور است؟ es la forma natural de preguntar cómo es físicamente alguien. No se usa چطور است؟ solo, porque por sí solo significa «¿Cómo está?» (el saludo sobre la salud o el bienestar).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Es alto/alta
    gloss: Es alto/alta.
    note: Combina او (él/ella, repaso) con قد بلند است, de esta unidad.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Tiene el pelo negro
    gloss: Tiene el pelo negro.
    note: Combina موی (pelo) con سیاه (negro) y دارد (tiene).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Tiene barba
    gloss: Tiene barba.
    note: Usa ریش دارد, la misma estructura con «tener» que en pelo negro.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Color
    gloss: color
    note: رنگ significa color (ya apareció antes en el curso, en la unidad 21, sobre la ropa).
    target_text: رنگ (color)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Azul
    gloss: azul
    note: آبی significa azul.
    example_gloss: Sus ojos son azules.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Marrón
    gloss: marrón
    note: قهوه‌ای significa marrón (se usa para el color del pelo o de los ojos).
    example_gloss: Su pelo es castaño.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Color de ojos
    gloss: color de ojos
    note: 'رنگ چشم significa literalmente «color de ojo»: رنگ (color) + چشم (ojo).'
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Color de pelo
    gloss: color de pelo
    note: 'رنگ مو significa literalmente «color de pelo»: رنگ (color) + مو (pelo).'
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Sus ojos son azules
    gloss: Sus ojos son azules.
    note: Aplica آبی, de esta lección, a چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Su pelo es castaño
    gloss: Su pelo es castaño.
    note: Aplica قهوه‌ای, de esta lección, a موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Hermano / tu hermano
    gloss: hermano / tu hermano (informal)
    note: برادر (hermano) es repaso de la unidad 3; برادرت añade el sufijo posesivo informal ‌ت («tu»), acorde con el registro informal de تو que ya conoces.
    target_text: برادر (hermano) / برادرت (tu hermano, informal)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Sí / gracias / también
    gloss: sí / gracias / también
    note: بلی (sí), تشکر (gracias) y هم (también) ya los conoces de antes en el curso.
    target_text: بلی (sí) / تشکر (gracias) / هم (también)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿cómo es tu hermano físicamente?'
    gloss: 'Homayoun: Zarmina, ¿cómo es tu hermano físicamente?'
    note: Una pregunta informal entre amigos, con el posesivo -ت en برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Es alto y tiene el pelo negro'
    gloss: 'Zarmina: Es alto y tiene el pelo negro.'
    note: Une dos rasgos con و (y).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¿Tiene barba?'
    gloss: 'Homayoun: ¿Tiene barba?'
    note: Una pregunta de sí o no que se forma solo con la entonación ascendente en ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sí, tiene barba y también tiene gafas'
    gloss: 'Zarmina: Sí, tiene barba y también tiene gafas.'
    note: Aplica هم (también) a un segundo rasgo.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bien, gracias'
    gloss: 'Homayoun: Bien, gracias.'
    note: خوب (bien) es una palabra nueva y sencilla para cerrar; تشکر (gracias) es repaso.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Lectura sobre el aspecto físico
    gloss: Karim es alto. Tiene el pelo negro y los ojos marrones. No tiene barba, pero tiene gafas.
    note: Un texto breve que repasa las palabras de aspecto físico de la unidad. Presenta el nombre del personaje کریم (Karim, el mismo de la unidad de comparaciones) y ندارد (no tiene, la forma negativa de دارد en 3.ª persona).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Pero
    gloss: pero
    note: اما significa «pero» (apareció antes en esta unidad, en el texto de la lección 5; también es repaso de unidades anteriores).
    target_text: اما (pero)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Soy/estoy / tengo
    gloss: soy / tengo
    note: استم (soy) y دارم (tengo) ya los conoces de antes en el curso; aquí se usan para describir tu propio aspecto.
    target_text: استم (yo soy/estoy) / دارم (tengo)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Soy bajo/baja, pero tengo el pelo negro
    gloss: Soy bajo/baja, pero tengo el pelo negro.
    note: Combina dos datos de aspecto con اما.
