course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: pedir información de forma indirecta y cortés, por ejemplo ¿Sabe dónde está la estación? La estructura می‌دانین که ... con una pregunta incluida sin cambios (dónde, cuándo, por qué, cuál, cuánto), No sé que ..., sí o no con یا نه, y la petición cortés می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: Preguntar de forma indirecta
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: ¿Sabes dónde está la estación?
  prs.a2.unit38.lesson02.i_dont_know:
    title: No sé cuándo sale el autobús
  prs.a2.unit38.lesson03.yes_or_no:
    title: ¿Abierto o no?
  prs.a2.unit38.lesson04.polite_requests:
    title: Disculpe, ¿puede decirme...?
  prs.a2.unit38.lesson05.reading_and_listening:
    title: Lectura y comprensión auditiva sobre un museo y un banco
  prs.a2.unit38.lesson06.station_conversation:
    title: Una conversación en la estación
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Estación
    gloss: estación, parada
    note: '*ایستگاه* es una estación o una parada. Esta unidad pregunta dónde están los lugares, y la estación es el primero: *ایستگاه بس* es la estación de autobuses.'
    example_gloss: La estación está en Kabul.
  prs.a2.unit38.lesson01.teach.museum:
    title: Museo
    gloss: museo
    note: '*موزیم* es un museo. El Museo Nacional de Afganistán está en Kabul.'
    example_gloss: El museo está en Kabul.
  prs.a2.unit38.lesson01.teach.office:
    title: Oficina
    gloss: oficina
    note: '*دفتر* es una oficina, por ejemplo la oficina de pasaportes o la oficina de una compañía de autobuses.'
    example_gloss: La oficina está cerca.
  prs.a2.unit38.lesson01.teach.library:
    title: Biblioteca
    gloss: biblioteca
    note: '*کتابخانه* es una biblioteca. *نزدیک* significa «cerca».'
    example_gloss: La biblioteca está cerca.
  prs.a2.unit38.lesson01.teach.where:
    title: ¿Dónde está?
    gloss: ¿dónde está?
    note: '*کجا* significa «dónde», y *کجاست* es «dónde está»: *کجا* más la forma corta de *است*. Pon primero el lugar: *ایستگاه کجاست؟* es «¿dónde está la estación?».'
    example_gloss: ¿Dónde está el museo?
  prs.a2.unit38.lesson01.teach.know:
    title: Saber
    gloss: yo sé
    note: '*دانستن* es saber un dato: *می‌دانم* es «yo sé». Úsalo para datos (dónde está un lugar, cuándo sale un autobús), no para conocer a una persona.'
    example_gloss: Yo sé.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'Saber: می‌دانم'
    gloss: yo sé, tú sabes, él/ella sabe, nosotros sabemos, usted/ustedes saben (cortés o plural), ellos saben
    note: 'El presente de *دانستن* se forma con *می‌* más la terminación: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. La terminación de la segunda persona del plural es *-ین*. Con un desconocido, una persona mayor o un grupo dices *می‌دانین*; con un amigo cercano dices *می‌دانی*. El pronombre es opcional.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: De la pregunta directa a la indirecta
    gloss: ¿Dónde está la estación? ¿Sabe dónde está la estación?
    note: 'Una pregunta indirecta es más suave y cortés que una directa. Empieza con *می‌دانین که* (¿sabe que...?) y pon después la pregunta directa sin cambiar nada: *ایستگاه کجاست؟* pasa a ser *می‌دانین که ایستگاه کجاست؟*. La palabra interrogativa *کجا* se queda donde estaba, y el orden de las palabras sigue siendo el de una afirmación.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: ¿Sabe dónde está el museo?
    gloss: ¿Sabe dónde está el museo?
    note: 'Esta es la oración modelo de la unidad. *که* (que) es opcional: *می‌دانین موزیم کجاست؟* también es correcto. El signo de interrogación aparece una sola vez, al final, porque toda la oración es una sola pregunta.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Amigo o trato cortés
    gloss: 'Amigo: ¿sabes dónde está la biblioteca? Cortés: ¿sabe dónde está la biblioteca?'
    note: 'Solo cambia la terminación de *دانستن* según la persona con quien hablas: *می‌دانی* para un amigo, *می‌دانین* para alguien a quien tratas con cortesía. Todo lo que va después de *که* es igual.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: Sé / No sé
    gloss: Sé dónde está el museo. No sé dónde está el museo.
    note: 'La misma estructura sirve para una afirmación. *می‌دانم که* es «sé que», y *نمی‌دانم که* es «no sé que», con *ن* delante del verbo. La pregunta incluida va después sin cambios: *نمی‌دانم که موزیم کجاست.* Esta vez la oración termina con punto, porque es una afirmación.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: El verbo queda igual que en la pregunta directa
    gloss: ¿Cuándo abre el museo? No sé cuándo abre el museo.
    note: 'Nada cambia dentro de la pregunta incluida. La palabra interrogativa conserva su lugar, el verbo conserva su tiempo y no hace falta subjuntivo. El dari no reordena: la pregunta directa y la pregunta incluida se escriben igual.'
  prs.a2.unit38.lesson02.teach.when:
    title: Cuándo
    gloss: cuándo, a qué hora
    note: '*کی* significa «cuándo». También puedes preguntar la hora con *ساعت چند*: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: ¿Cuándo sale el autobús?
  prs.a2.unit38.lesson02.teach.opens:
    title: Abrir
    gloss: abre (se vuelve abierto)
    note: '*باز* es «abierto» y *شدن* es «volverse», así que *باز می‌شود* es «abre». Se dice de oficinas, museos, bancos y tiendas.'
    example_gloss: La oficina abre a las nueve.
  prs.a2.unit38.lesson02.teach.closes:
    title: Cerrar
    gloss: cierra (se vuelve cerrado)
    note: '*بسته* es «cerrado». *بسته می‌شود* es «cierra». Es lo contrario de *باز می‌شود*.'
    example_gloss: La oficina cierra a las cuatro.
  prs.a2.unit38.lesson02.teach.leaves:
    title: Partir
    gloss: parte, sale
    note: '*حرکت کردن* es «partir». Se usa para autobuses, trenes y aviones: *بس حرکت می‌کند* es «el autobús sale».'
    example_gloss: El autobús sale a las ocho.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Billete
    gloss: billete
    note: '*بلیت* es un billete o una entrada para un autobús, un avión o un museo.'
    example_gloss: El billete está en la oficina.
  prs.a2.unit38.lesson02.teach.why:
    title: Por qué
    gloss: por qué
    note: '*چرا* significa «por qué». En una pregunta indirecta mantiene su lugar: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: ¿Por qué está cerrada la oficina?
  prs.a2.unit38.lesson02.teach.which:
    title: Cuál
    gloss: cuál
    note: '*کدام* significa «cuál» o «qué» y va antes del sustantivo: *کدام بس* es «qué autobús».'
    example_gloss: ¿Qué autobús va a Mazar?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Palabras interrogativas después de که
    gloss: No sé cuánto cuesta el billete. No sé por qué está cerrada la oficina. No sé qué autobús va a Mazar.
    note: 'Todas las palabras interrogativas de la pregunta directa pueden ir después de *که*: *کجا* (dónde), *کی* (cuándo), *ساعت چند* (a qué hora), *چند* (cuánto), *چرا* (por qué), *کدام* (cuál). Cada una conserva su lugar y el resto de la oración es una afirmación normal.'
  prs.a2.unit38.lesson03.teach.open:
    title: Abierto
    gloss: abierto
    note: '*باز* significa «abierto». *باز است* es «está abierto».'
    example_gloss: El museo está abierto hoy.
  prs.a2.unit38.lesson03.teach.closed:
    title: Cerrado
    gloss: cerrado
    note: '*بسته* significa «cerrado». *بانک* es «banco».'
    example_gloss: El banco está cerrado hoy.
  prs.a2.unit38.lesson03.teach.market:
    title: Mercado
    gloss: mercado, bazar
    note: '*بازار* es el mercado o el bazar.'
    example_gloss: El mercado está cerca.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Preguntas de sí o no: یا نه'
    gloss: ¿Está abierta la oficina? ¿Sabe usted si la oficina está abierta o no?
    note: 'Una pregunta de sí o no no tiene palabra interrogativa, así que la forma indirecta añade *یا نه* («o no») al final: *می‌دانین که دفتر باز است یا نه؟* significa «¿sabe usted si la oficina está abierta o no?». Aquí *که* y *یا نه* enmarcan la oración. *یا نه* es la forma habitual de decir «si» en dari.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: No sé si
    gloss: No sé si la oficina está abierta o no.
    note: 'La forma afirmativa es igual: *نمی‌دانم که دفتر باز است یا نه.* Todo lo que está entre *که* y *یا نه* es la oración normal *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا: si'
    gloss: ¿Está abierto el museo? No sé si el museo está abierto o no.
    note: '*آیا* es una palabra formal que marca una pregunta de sí o no: *آیا موزیم باز است؟* En una pregunta indirecta puedes añadirla después de *که*, como en *که آیا موزیم باز است یا نه*, pero no es obligatorio: basta con *یا نه*.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Sí, está abierto. No, está cerrado.
    gloss: Sí, está abierto. No, está cerrado.
    note: '*بلی* es «sí» y *نخیر* es «no». Una respuesta corta repite el adjetivo: *باز است* («está abierto») o *بسته است* («está cerrado»).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: ¿Sabe usted si hoy está abierto?
    gloss: ¿Sabe usted si hoy está abierto?
    note: 'Cuando ya se ha mencionado el lugar, puedes omitirlo: *امروز باز است* significa «hoy está abierto».'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Perdón
    gloss: disculpe, perdón
    note: '*ببخشین* significa «disculpe». Se dice a un desconocido antes de preguntar.'
    example_gloss: Disculpe, ¿dónde está la oficina?
  prs.a2.unit38.lesson04.teach.staff:
    title: Empleado
    gloss: empleado, funcionario
    note: '*کارمند* es «empleado». En un mostrador o una taquilla se suele preguntar a un *کارمند*.'
    example_gloss: El empleado está en la oficina.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: ¿Puede decirme...?
    gloss: Disculpe, ¿puede decirme dónde está la estación?
    note: Para preguntar con cortesía a un desconocido, usa *می‌توانین بگویین که* («¿puede decirme...?») y pon después la pregunta directa. Es una petición, más suave que *می‌دانین که*. *بگویین* es el imperativo de cortesía de *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Petición con otras preguntas
    gloss: ¿Puede decirme cuánto cuesta el billete? ¿Puede decirme si la oficina está abierta o no?
    note: 'La misma petición funciona con todas las preguntas indirectas de esta unidad: *چند* (cuánto), *کی*, *کجا*, *چرا* y la forma de sí o no con *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Responder con cortesía
    gloss: Sí, lo sé. La estación está cerca. Disculpe, no lo sé.
    note: Para responder a *می‌دانین که ...؟*, di *بلی، می‌دانم* y da la información, o *ببخشین، نمی‌دانم* si no lo sabes. También puedes decir *من هم نمی‌دانم* («yo tampoco lo sé»).
  prs.a2.unit38.lesson04.teach.me_neither:
    title: Yo tampoco lo sé
    gloss: Yo tampoco lo sé.
    note: '*هم* significa «también». Con un verbo negativo significa «tampoco»: *من هم نمی‌دانم* es «yo tampoco lo sé».'
  prs.a2.unit38.lesson05.teach.first:
    title: Primero
    gloss: primero, al principio
    note: '*اول* significa «primero». *اول ... بعد ...* significa «primero... luego...».'
    example_gloss: Primero voy al banco.
  prs.a2.unit38.lesson05.teach.then:
    title: Luego, después
    gloss: luego, después
    note: '*بعد* significa «luego» o «después».'
    example_gloss: Luego voy a la biblioteca.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Samir le pregunta a Samina dónde está el museo
    gloss: Samina, ¿sabes dónde está el museo?
    note: Samir le pregunta a una amiga, por eso usa *می‌دانی*. La pregunta indirecta es *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Samina responde
    gloss: Sí, el museo está cerca de la estación.
    note: 'Samina dice *بلی* y da la información: *نزدیک ایستگاه است* («está cerca de la estación»).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Samir pregunta la hora de apertura
    gloss: ¿Sabes a qué hora abre?
    note: Ya se ha mencionado el museo, así que Samir lo omite. *ساعت چند باز می‌شود* es la pregunta indirecta.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Samina no lo sabe
    gloss: No, no sé a qué hora abre.
    note: Samina repite la pregunta indirecta después de *نمی‌دانم که*. *نه* es un «no» amistoso.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Samir pregunta si estará abierto mañana
    gloss: ¿Sabes si mañana está abierto o no?
    note: Una pregunta de sí o no con *یا نه*. *فردا* es «mañana».
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Samina llamará primero por teléfono
    gloss: No lo sé. Primero llamaré por teléfono.
    note: '*تیلفون می‌کنم* es «llamo por teléfono». *اول* es «primero». Ella llamará antes de responder.'
  prs.a2.unit38.lesson05.teach.message:
    title: Un mensaje desde el mercado
    gloss: Hola, Samina. Hoy estoy en el mercado. ¿Sabes dónde está el banco? No sé si el banco está cerca del mercado o no. ¿Sabes si el banco está abierto hoy o no? Luego voy a la biblioteca.
    note: 'Un mensaje corto con tres preguntas indirectas: dónde está el banco, si está cerca y si está abierto. Fíjate en que la primera es una pregunta a una amiga (*می‌دانی*) y la segunda es una afirmación (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Puerta grande, portón
    gloss: puerta grande, portón
    note: '*دروازه* es un portón o una puerta grande, por ejemplo la de una estación o una oficina.'
    example_gloss: El portón está abierto.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Mil
    gloss: mil
    note: '*هزار* es «mil». *افغانی* es la moneda afgana: *هزار افغانی* son mil afganis.'
    example_gloss: El billete cuesta mil afganis.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Samir le pregunta al empleado
    gloss: Disculpe, ¿sabe usted cuándo sale el autobús a Mazar?
    note: Samir habla con un desconocido, por eso usa *ببخشین* y *می‌دانین*. *بس به مزار* es «el autobús a Mazar».
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: El empleado responde
    gloss: Sí, lo sé. El autobús sale a las ocho.
    note: El empleado dice *بلی، می‌دانم* y da la hora.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Samir pregunta el precio
    gloss: ¿Puede decirme cuánto cuesta el billete?
    note: 'Una petición cortés: *می‌توانین بگویین که* más *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: El empleado da el precio
    gloss: El billete cuesta mil afganis.
    note: Una respuesta directa, sin pregunta indirecta.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Samir pregunta por la oficina
    gloss: Gracias. ¿Sabe usted dónde está la oficina?
    note: '*تشکر* es «gracias».'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: El empleado dice dónde está la oficina
    gloss: La oficina está cerca del portón.
    note: '*نزدیک دروازه است* es «está cerca del portón».'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: ¿Qué significa esta frase?
    correct_option: ¿Sabes dónde está la estación?
    distractors:
    - ¿Dónde está la estación?
    - Sé dónde está la estación
    - La estación está cerca
    accepted_answers:
    - value: ¿Sabes dónde está la estación?
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* es «¿sabe usted dónde está la estación?». Pregunta si la otra persona lo sabe.'
  prs.a2.unit38.lesson01.exercise02.recognize_library_friend:
    instruction: ¿Qué significa esta frase?
    correct_option: ¿Sabes dónde está la biblioteca? (a un amigo)
    distractors:
    - ¿Sabe usted dónde está la biblioteca? (formal)
    - No sé dónde está la biblioteca
    - ¿Está cerca la biblioteca?
    accepted_answers:
    - value: ¿Sabes dónde está la biblioteca? (a un amigo)
      status: correct
    feedback: '*می‌دانی* tiene la terminación de amigo *-ی*: es la misma pregunta dirigida a un amigo.'
