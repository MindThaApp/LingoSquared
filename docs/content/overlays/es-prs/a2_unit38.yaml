  prs.a2.unit38.lesson01.exercise04.order_do_you_know:
    instruction: 'Ordena las palabras para decir: ¿Sabe usted dónde está la estación?'
    accepted_answers:
    - value:
      - می‌دانین
      - که
      - ایستگاه
      - کجاست
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* pone primero el verbo, luego *که* y después la pregunta directa.'
  prs.a2.unit38.lesson01.exercise05.fill_where:
    instruction: 'Completa la oración: ¿Sabe usted dónde está el museo?'
    accepted_answers:
    - value: کجاست
      status: correct
    feedback: '*کجاست* es «dónde está». La pregunta directa *موزیم کجاست؟* va después de *که*.'
  prs.a2.unit38.lesson01.exercise06.translate_museum:
    instruction: 'Traduce al dari, usando می‌دانین: ¿Sabe usted dónde está el museo?'
    accepted_answers:
    - value: می‌دانین که موزیم کجاست؟
      status: correct
    - value: می‌دانین موزیم کجاست؟
