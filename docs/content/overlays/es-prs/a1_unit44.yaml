course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: separa los residuos del hogar en el contenedor correcto, pregunta en qué contenedor va cada cosa y lee un breve calendario de recogida con dos elementos. Habla de basura, papel, plástico y vidrio, y confirma con un amigo la separación en contenedores verde y azul.'
units:
  prs.a1.unit44.waste_disposal:
    title: Separar los residuos
    description: Separa los residuos del hogar en el contenedor correcto, pregunta en qué contenedor va algo y entiende un calendario sencillo de recogida de residuos.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: 'Vocabulario: residuos, contenedor y plástico'
  prs.a1.unit44.lesson02.paper_and_glass:
    title: El papel, el vidrio y el contenedor azul
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: Tirar los residuos
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: Diálogo sobre separar residuos
  prs.a1.unit44.lesson05.reading:
    title: 'Lectura: Wahid y los residuos'
  prs.a1.unit44.lesson06.wrap_up:
    title: Resumen
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 'Repaso: es/está, en'
    gloss: es / está / en
    note: است y در (ambas usadas a lo largo del curso) son palabras de repaso para hablar de dónde está algo.
    target_text: است (es/está) / در (en)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Repaso: color, verde, azul'
    gloss: color / verde / azul
    note: رنگ, سبز y آبی son palabras de repaso que sirven para nombrar los dos contenedores de residuos.
    target_text: رنگ (color) / سبز (verde) / آبی (azul)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Contenedor
    gloss: contenedor
    note: سطل es la palabra dari de uso cotidiano para un contenedor o cubo.
    example_gloss: El contenedor es verde.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Residuos / basura
    gloss: residuos / basura
    note: زباله significa los residuos domésticos o la basura.
    example_gloss: La basura está en el contenedor.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Contenedor verde
    gloss: contenedor verde
    note: سطل سبز une سطل (contenedor) y سبز (verde).
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plástico
    gloss: plástico
    note: پلاستیک es un préstamo estándar usado en todas las variedades del persa, incluido el dari.
    example_gloss: El plástico está en el contenedor azul.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: La basura está en el contenedor verde
    gloss: La basura está en el contenedor verde.
    note: زباله در سطل سبز است combina las palabras aprendidas antes en esta lección.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 'Repaso: cuál, en, es/está'
    gloss: cuál / en / es / está
    note: کدام, در y است son palabras de repaso que sirven para preguntar en qué contenedor va algo.
    target_text: کدام (cuál) / در (en) / است (es/está)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: Papel
    gloss: papel
    note: کاغذ es la palabra dari de uso cotidiano para papel.
    example_gloss: El papel está en el contenedor.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Vidrio
    gloss: vidrio
    note: شیشه es la palabra dari de uso cotidiano para vidrio.
    example_gloss: El vidrio está en el contenedor.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Contenedor azul
    gloss: contenedor azul
    note: سطل آبی une سطل (contenedor) y آبی (azul) y se usa para reciclables como papel, plástico y vidrio.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: ¿En qué contenedor está el papel?
    gloss: ¿En qué contenedor está el papel?
    note: کاغذ در کدام سطل است؟ sirve para preguntar en qué contenedor va un objeto.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: El papel está en el contenedor azul
    gloss: El papel está en el contenedor azul.
    note: کاغذ در سطل آبی است responde a la pregunta con el contenedor correcto.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: El vidrio está en el contenedor azul
    gloss: El vidrio está en el contenedor azul.
    note: شیشه در سطل آبی است sigue el mismo patrón que la oración del papel.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 'Repaso: marca de objeto, yo echo/tiro'
    gloss: (marca de objeto) / yo echo / tiro
    note: 'را y می‌اندازم (de la Unidad 36, donde se usó para «echo sal») son palabras de repaso: انداختن cubre de verdad tanto «echar/poner» como «tirar/desechar».'
    target_text: را (marcador de objeto directo) / می‌اندازم (echo, tiro)
  prs.a1.unit44.lesson03.teach.away_word:
    title: Fuera
    gloss: fuera / lejos
    note: دور (fuera, lejos) se combina con می‌اندازم en la construcción estándar دور انداختن («tirar»).
    example_gloss: Lo tiro.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: Tiro la basura
    gloss: Tiro la basura.
    note: زباله را دور می‌اندازم combina زباله را, دور y می‌اندازم.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: Echo el plástico en el contenedor azul
    gloss: Echo el plástico en el contenedor azul.
    note: پلاستیک را در سطل آبی می‌اندازم usa می‌اندازم con el sentido de «echar dentro».
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: Echo el papel en el contenedor azul
    gloss: Echo el papel en el contenedor azul.
    note: کاغذ را در سطل آبی می‌اندازم sigue el mismo patrón con el contenedor azul.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 'Repaso: yo no echo/tiro'
    gloss: yo no echo / tiro
    note: نمی‌اندازم es la forma negativa regular, con نمی-, de می‌اندازم.
    target_text: نمی‌اندازم (no echo, no tiro)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: No echo el vidrio en el contenedor verde
    gloss: No echo el vidrio en el contenedor verde.
    note: شیشه را در سطل سبز نمی‌اندازم expresa una regla de separación con la forma negativa.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: Echo el vidrio en el contenedor azul
    gloss: Echo el vidrio en el contenedor azul.
    note: شیشه را در سطل آبی می‌اندازم indica la acción correcta para el vidrio.
  prs.a1.unit44.lesson04.teach.review_this:
    title: 'Repaso: este'
    gloss: este
    note: این es una palabra de repaso que se usa en el diálogo.
    target_text: این (esto/este)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: 'Repaso: muy, bien, muchas gracias, de nada'
    gloss: muy / bien / muchas gracias / de nada
    note: بسیار, خوب, تشکر زیاد y خواهش می‌کنم son palabras de repaso que sirven para cerrar el diálogo.
    target_text: بسیار (muy) / خوب (bueno) / تشکر زیاد (muchas gracias) / خواهش می‌کنم (de nada)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, ¿en qué contenedor echo este vidrio?'
    gloss: Shukria, ¿en qué contenedor echo este vidrio?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: 'Shukria: El vidrio va en el contenedor azul.'
    gloss: El vidrio va en el contenedor azul.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: 'Wahid: ¿En qué contenedor echo esta basura?'
    gloss: ¿En qué contenedor echo esta basura?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: 'Shukria: La basura va en el contenedor verde.'
    gloss: La basura va en el contenedor verde.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: 'Wahid: Muy bien. Muchas gracias.'
    gloss: Muy bien. Muchas gracias.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: 'Shukria: De nada.'
    gloss: De nada.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: 'Repaso: Wahid, él/ella, todos los días, también, contento'
    gloss: Wahid / él/ella / todos los días / también / feliz
    note: وحید, او, هر روز, هم y خوشحال son palabras de repaso que aparecen en el texto de lectura.
    target_text: وحید (Wahid) / او (él/ella) / هر روز (todos los días) / هم (también) / خوشحال (contento/a)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: 'Repaso: él/ella tira'
    gloss: él/ella tira / echa
    note: می‌اندازد es la forma de tercera persona de la familia می‌اندازم/نمی‌اندازم que estudiaste antes en esta unidad.
    target_text: می‌اندازد (él/ella echa, tira)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: Lectura sobre Wahid y la basura
    gloss: Wahid tira la basura todos los días. El papel está en el contenedor azul. El plástico también está en el contenedor azul. La basura está en el contenedor verde. Wahid está feliz.
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: 'Repaso: lunes, martes, pero, usted'
    gloss: lunes / martes / pero / usted
    note: دوشنبه, سه‌شنبه, اما y شما son palabras de repaso que sirven para indicar un horario de dos elementos.
    target_text: دوشنبه (lunes) / سه‌شنبه (martes) / اما (pero) / شما (usted)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: Recogida
    gloss: recogida
    note: جمع‌آوری significa recogida o recolección, y se usa para el día de recogida de basura, igual que en español se dice «recogida de basura».
    example_gloss: El día de recogida es el lunes.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: El día de recogida del papel es el lunes
    gloss: El día de recogida del papel es el lunes.
    note: روز جمع‌آوری کاغذ دوشنبه است nombra el material y su día de recogida.
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: El día de recogida de la basura es el martes
    gloss: El día de recogida de la basura es el martes.
    note: روز جمع‌آوری زباله سه‌شنبه است sigue el mismo patrón para la basura.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: El papel el lunes, pero la basura el martes
    gloss: El día de recogida del papel es el lunes, pero el de la basura es el martes.
    note: اما contrasta los dos días de recogida.
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: 'Repaso: ustedes tiran/echan'
    gloss: usted tira / echa (formal)
    note: می‌اندازین es la forma formal de plural y amplía la misma familia en -ین que می‌خواهین/کنین.
    target_text: می‌اندازین (usted echa, tira)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: ¿Qué día tira usted la basura?
    gloss: ¿Qué día tira usted la basura?
    note: Es la versión formal, con شما, de la pregunta sobre qué día alguien tira la basura.
