teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Tienda
    gloss: tienda
    note: دوکان es la palabra auténtica del dari afgano para una tienda pequeña de barrio, distinta de مغازه, que se usa en el persa de Irán.
    example_gloss: Esta tienda es grande.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Precio
    gloss: precio
    note: قیمت significa precio.
    example_gloss: ¿Cuál es el precio de esto?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Barato
    gloss: barato
    note: ارزان significa barato o económico.
    example_gloss: Esto es barato.
  prs.a1.unit10.lesson01.teach.gran:
    title: Caro
    gloss: caro
    note: گران es lo contrario de ارزان.
    example_gloss: Esto es caro.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Descuento
    gloss: descuento
    note: تخفیف significa descuento en el precio.
    example_gloss: ¿Tienen descuento?
  prs.a1.unit10.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra habitual para unir dos afirmaciones o peticiones cortas.
    example_gloss: Compro manzanas y pan.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: ¿Cuánto cuesta?
    gloss: ¿Cuánto cuesta?
    note: قیمتش چند است؟ pregunta literalmente «su precio, ¿cuánto es?».
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: Son cien afganis.
    gloss: Son cien afganis.
    note: صد افغانی است indica un precio con افغانی, la moneda de Afganistán.
  prs.a1.unit10.lesson03.teach.sib:
    title: Manzana(s)
    gloss: manzana(s)
    note: سیب significa manzana; aquí se usa en sentido plural o genérico, para un lote que se vende.
    example_gloss: Quiero un kilo de manzanas.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Kilo
    gloss: kilo
    note: کیلو es la unidad habitual para vender productos por peso.
    example_gloss: Quiero un kilo de manzanas.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Manzanas: un kilo, cien afganis'
    gloss: 'Manzanas: un kilo, cien afganis'
    note: 'سیب: یک کیلو صد افغانی es una etiqueta de precio típica de mercado.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Quiero un kilo de manzanas.
    gloss: Quiero un kilo de manzanas.
    note: یک کیلو سیب می‌خواهم usa el mismo patrón یک [producto] می‌خواهم que se vio para pedir comida en la unidad 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Quiero dos kilos.
    gloss: Quiero dos kilos.
    note: دو کیلو می‌خواهم cambia por دو (dos) para pedir una cantidad mayor.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: ¿Puede hacerme un descuento?
    gloss: ¿Puede hacerme un descuento?
    note: تخفیف می‌توانین بدهین؟ pide con cortesía un precio más bajo, usando می‌توانین (usted puede).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Para usted son 180 afganis.
    gloss: Para usted son 180 afganis.
    note: 'برای شما صد و هشتاد افغانی می‌شه ofrece un precio total rebajado: 20 afganis menos de los 200 completos por dos kilos a 100 cada uno.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Adelante, por favor
    gloss: adelante, por favor
    note: بفرمایین es un saludo o invitación cálida y cortés que el tendero dirige al cliente cuando llega.
    example_gloss: Aquí tiene, este es el precio.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Hola, adelante.
    gloss: Hola, adelante.
    note: El tendero saluda al cliente con calidez.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Hola. ¿Cuánto cuestan las manzanas?
    gloss: Hola. ¿Cuánto cuestan las manzanas?
    note: El cliente pregunta el precio de las manzanas.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Un kilo son cien afganis.
    gloss: Un kilo son cien afganis.
    note: El tendero indica el precio por kilo.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Quiero dos kilos. ¿Puede hacerme un descuento?
    gloss: Quiero dos kilos. ¿Puede hacerme un descuento?
    note: El cliente indica la cantidad y pide un descuento.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Sí, para usted dos kilos son 180 afganis.
    gloss: Sí, para usted dos kilos son 180 afganis.
    note: El tendero acepta y da el total con descuento, de acuerdo con el precio de 100 afganis por kilo indicado antes (200 menos 20 afganis de descuento).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Muy bien, gracias.
    gloss: Muy bien, gracias.
    note: El cliente acepta el precio y da las gracias al tendero.
