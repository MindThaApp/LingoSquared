course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: pide a un farmacéutico un medicamento básico, describe un síntoma sencillo (dolor de cabeza, de estómago o de muelas), pide una pastilla o un jarabe y entiende una indicación básica de dosis.'
units:
  prs.a1.unit46.pharmacy:
    title: Farmacia y medicina
    description: Pide a un farmacéutico un medicamento básico, describe un síntoma sencillo, pide una pastilla o un jarabe y entiende una indicación básica de dosis.
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: Farmacia y farmacéutico
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: Dolor de cabeza, de estómago y de muelas
  prs.a1.unit46.lesson03.medicine_forms:
    title: Pastilla y jarabe
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Diálogo en la farmacia
  prs.a1.unit46.lesson05.reading:
    title: Leer una receta
  prs.a1.unit46.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Repaso: esto, es, en'
    gloss: esto / es / en
    note: این, است y در (usadas a lo largo de este curso) son palabras de repaso para hablar de la farmacia.
    target_text: این (esto/este) / است (es/está) / در (en)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Farmacia
    gloss: farmacia
    note: دواخانه significa literalmente «casa de medicina», formada igual que کتابخانه («casa de libros», biblioteca, unidad 43).
    example_gloss: Esto es una farmacia.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: Esto es una farmacia
    gloss: Esto es una farmacia.
    note: این دواخانه است combina las palabras que se han aprendido antes en esta lección.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Farmacéutico
    gloss: farmacéutico
    note: دواساز significa literalmente «el que hace medicina».
    example_gloss: El farmacéutico está en la farmacia.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: El farmacéutico está en la farmacia
    gloss: El farmacéutico está en la farmacia.
    note: دواساز در دواخانه است combina دواساز (farmacéutico) y دواخانه (farmacia).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Repaso: medicina, quiero'
    gloss: medicina / quiero
    note: دوا y می‌خواهم son palabras de repaso para pedir medicina.
    target_text: دوا (medicina) / می‌خواهم (quiero)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Quiero medicina
    gloss: Quiero medicina.
    note: دوا می‌خواهم combina دوا (medicina) y می‌خواهم (quiero).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Repaso: dolor de cabeza, dolor de estómago, tengo, tiene'
    gloss: dolor de cabeza / dolor de estómago / tengo / tiene (formal)
    note: سردرد, دل‌درد, دارم y دارین son palabras de repaso para describir un síntoma.
    target_text: سردرد (dolor de cabeza) / دل‌درد (dolor de estómago) / دارم (tengo) / دارین (usted tiene)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Repaso: muy, sí, no'
    gloss: muy / sí / no
    note: بسیار, بلی y نخیر (de unidades anteriores) son palabras de repaso que se usan para responder a una pregunta sobre síntomas.
    target_text: بسیار (muy) / بلی (sí) / نخیر (no)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Dolor de muelas
    gloss: dolor de muelas
    note: دندان‌درد combina دندان (diente, unidad 42) con el mismo elemento -درد («dolor») que ya aparece en سردرد y دل‌درد.
    example_gloss: Tengo dolor de muelas.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: Tengo mucho dolor de muelas
    gloss: Tengo mucho dolor de muelas.
    note: بسیار دندان‌درد دارم usa بسیار (muy, mucho) para intensificar el síntoma.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: ¿Tiene dolor de cabeza?
    gloss: ¿Tiene dolor de cabeza?
    note: سردرد دارین؟ es una pregunta de sí o no que se forma solo con entonación ascendente, sin palabra interrogativa.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: No, tengo dolor de muelas
    gloss: No, tengo dolor de muelas.
    note: نخیر responde a la pregunta anterior y luego se nombra el síntoma real.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Repaso: quiero, un/una'
    gloss: quiero / un, una / uno
    note: می‌خواهم y یک (de unidades anteriores) son palabras de repaso que se usan para pedir una forma de medicamento.
    target_text: می‌خواهم (quiero) / یک (un/una, uno)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Pastilla
    gloss: pastilla / comprimido
    note: قرص es la palabra habitual en dari para una pastilla o comprimido.
    example_gloss: Quiero una pastilla.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Quiero una pastilla
    gloss: Quiero una pastilla.
    note: یک قرص می‌خواهم combina یک (un, una) y قرص (pastilla).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Jarabe
    gloss: jarabe
    note: شربت es la palabra habitual en dari para un medicamento líquido o jarabe.
    example_gloss: Quiero jarabe.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Quiero jarabe
    gloss: Quiero jarabe.
    note: شربت می‌خواهم combina شربت (jarabe) y می‌خواهم (quiero).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Repaso: cuál, medicina, usted quiere'
    gloss: cuál / medicina / usted quiere
    note: کدام, دوا y می‌خواهین son palabras de repaso que se usan para preguntar qué quiere un cliente.
    target_text: کدام (cuál) / دوا (medicina) / می‌خواهین (usted quiere)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: ¿Qué medicina quiere?
    gloss: ¿Qué medicina quiere?
    note: کدام دوا می‌خواهین؟ es la pregunta cortés que haría un farmacéutico.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Repaso: hola, dolor de estómago, tengo'
    gloss: hola / dolor de estómago / tengo
    note: سلام, دل‌درد y دارم (de unidades anteriores) son palabras de repaso que se usan para abrir el diálogo.
    target_text: سلام (hola) / دل‌درد (dolor de estómago) / دارم (tengo)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Repaso: medicina, usted quiere, sí'
    gloss: medicina / usted quiere / sí
    note: دوا, می‌خواهین y بلی (de unidades anteriores) son palabras de repaso que se usan en las preguntas del farmacéutico.
    target_text: دوا (medicina) / می‌خواهین (usted quiere) / بلی (sí)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Repaso: esta, pastilla, buena, es'
    gloss: este/esta / pastilla / bueno/buena / es
    note: این, قرص, خوب y است (de unidades anteriores y de esta lección) son palabras de repaso que se usan para describir el medicamento.
    target_text: این (esto/este) / قرص (pastilla) / خوب (bueno) / است (es)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Unidad
    gloss: unidad / dosis
    note: دانه es una palabra contadora para una unidad o dosis, y se usa con las pastillas.
    example_gloss: Tres unidades.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Tome
    gloss: tome (cortés)
    note: بگیرین es el imperativo cortés «tome», de la misma familia en -ین que کنین y بنوشین en otras partes de este curso.
    example_gloss: Tome tres al día.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Repaso: día, tres, muchas gracias, de nada'
    gloss: día / tres / muchas gracias / de nada
    note: روز, سه, تشکر زیاد y خواهش می‌کنم (de unidades anteriores) son palabras de repaso que se usan para cerrar el diálogo.
    target_text: روز (día) / سه (tres) / تشکر زیاد (muchas gracias) / خواهش می‌کنم (de nada)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Hola. Tengo dolor de estómago.'
    gloss: Hola. Tengo dolor de estómago.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Farmacéutico: Hola. ¿Quiere medicina?'
    gloss: Hola. ¿Quiere medicina?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Sí, quiero una pastilla.'
    gloss: Sí, quiero una pastilla.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Farmacéutico: Esta pastilla es buena. Tome tres al día.'
    gloss: Esta pastilla es buena. Tome tres al día.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Muchas gracias.'
    gloss: Muchas gracias.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Farmacéutico: De nada.'
    gloss: De nada.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Repaso: este/esta, es, Homayoun, de'
    gloss: este/esta / es / Homayoun / de
    note: 'این, است y همایون son palabras de repaso que se usan en el texto de lectura. از (de unidades anteriores, normalmente «de, desde») se usa aquí como predicado con است para indicar posesión: این نسخه از همایون است se lee literalmente «esta receta es de Homayoun» y significa «esta es la receta de Homayoun», igual que این کتاب از من است, «este libro es mío».'
    target_text: این (esto/este) / است (es) / همایون / از (de, desde)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Repaso: uno, pastilla, día, tres, unidad, tome'
    gloss: uno / pastilla / día / tres / unidad / tome
    note: یک, قرص, روز, سه, دانه y بگیرین (de esta unidad) son palabras de repaso que se usan en el texto de lectura.
    target_text: یک (una) / قرص (pastilla) / روز (día) / سه (tres) / دانه (unidad) / بگیرین (tome)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Receta
    gloss: receta médica
    note: نسخه es la palabra habitual en dari para una receta médica o la indicación de un medicamento.
    example_gloss: Esta es una receta.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Lectura de una receta
    gloss: Esta es la receta de Homayoun. Es una pastilla. Tome tres unidades al día.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Repaso: pero, usted (formal), cuántos'
    gloss: pero / usted (formal) / cuántos
    note: اما, شما y چند (de unidades anteriores) son palabras de repaso que se usan para indicar un horario.
    target_text: اما (pero) / شما (usted) / چند (cuántos)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Repaso: mañana, noche, dos, tres, unidad, es, su receta'
    gloss: mañana / noche / dos / tres / unidad / es / su receta
    note: صبح, شب, دو, سه, دانه, است (de unidades anteriores y de esta) y نسخه‌تان (su receta, con el mismo sufijo -تان que نام‌تان y تلفن‌تان en otras partes de este curso) son palabras de repaso que se usan para cerrar la unidad.
    target_text: صبح (mañana) / شب (noche) / دو (dos) / سه (tres) / دانه (unidad) / است (es) / نسخه‌تان (su receta)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Por la mañana son dos unidades, pero por la noche son tres
    gloss: Por la mañana son dos unidades, pero por la noche son tres.
    note: اما contrasta la dosis de la mañana con la de la noche.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: ¿Cuántas unidades es su receta?
    gloss: ¿Cuántas unidades indica su receta?
    note: Es la versión formal, con شما y el sufijo -تان, para preguntar por la dosis de una receta.
