course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: vocabulario de tecnología y dispositivos (teléfono móvil, computadora, internet, aplicación, foto), frases de acciones con el teléfono (enviar un mensaje, llamar, hacer una foto, descargar una aplicación), cómo preguntar y responder cuántas veces al día usas el teléfono móvil, y un diálogo entre Zarmina y Homayoun sobre el uso del teléfono, la computadora e internet.'
units:
  prs.a1.unit30.technology:
    title: Tecnología
    description: Habla de teléfonos, computadoras, internet y aplicaciones, y de con qué frecuencia los usas.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Palabras de tecnología
  prs.a1.unit30.lesson02.phone_actions:
    title: Acciones con el teléfono
  prs.a1.unit30.lesson03.frequency_question:
    title: ¿Cuántas veces al día?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Diálogo sobre tecnología
  prs.a1.unit30.lesson05.reading_technology:
    title: Lectura sobre tecnología
  prs.a1.unit30.lesson06.wrap_up:
    title: Repaso final
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Tecnología
    gloss: tecnología
    note: تکنالوژی significa tecnología. Es la grafía estándar en Afganistán, distinta de la grafía iraní تکنولوژی.
    example_gloss: La tecnología es buena.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Teléfono móvil
    gloss: teléfono móvil
    note: موبایل significa teléfono móvil, distinto del más general تلفن (teléfono, repaso de la unidad 7).
    example_gloss: Tengo un teléfono móvil.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computadora
    gloss: computadora
    note: کمپیوتر significa computadora; es un préstamo estándar compartido por el persa y el dari.
    example_gloss: La computadora está en la oficina.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت significa internet; es un préstamo estándar compartido por el persa y el dari.
    example_gloss: El internet es lento.
  prs.a1.unit30.lesson01.teach.app_word:
    title: Aplicación
    gloss: aplicación
    note: اپلیکیشن significa aplicación (app); es un préstamo estándar compartido por el persa y el dari.
    example_gloss: Esta aplicación es buena.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Foto
    gloss: foto
    note: عکس significa foto o imagen.
    example_gloss: Esta foto es buena.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Usar
    gloss: usar + hacer → uso
    note: استفاده (uso) se combina con کردن (hacer, repaso) para formar استفاده می‌کنم (uso), el mismo patrón de verbo compuesto que ya has visto en el curso, por ejemplo بازی می‌کنم (unidad 29) y ورزش می‌کنم (unidad 29).
    target_text: استفاده (uso) + کردن (hacer) = استفاده می‌کنم (uso)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Uso internet
    gloss: Uso internet.
    note: Combina من (yo, repaso), از (de/usando, repaso), انترنت y استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Mensaje
    gloss: mensaje
    note: پیام significa mensaje.
    target_text: پیام (mensaje)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: Envío un mensaje
    gloss: envío un mensaje
    note: 'می‌فرستم significa «envío»: es un verbo nuevo, distinto del verbo de la Unidad 7 para dejar un mensaje, بگذارم.'
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Llamo por teléfono
    gloss: llamo (por teléfono)
    note: زنگ می‌زنم significa «llamo por teléfono».
    target_text: زنگ می‌زنم (llamo por teléfono)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Hago una foto
    gloss: hago una foto
    note: عکس می‌گیرم reutiliza می‌گیرم (tomo/recibo, repaso de la Unidad 23) con عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Descarga
    gloss: descargar
    note: دانلود es el préstamo habitual en dari para «descarga». Se combina con کردن (hacer, repaso) como verbo auxiliar, p. ej. دانلود می‌کنم (descargo).
    example_gloss: Descargo una aplicación.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Quiero descargar una aplicación
    gloss: quiero descargar una aplicación
    note: Sigue el mismo patrón می‌خواهم + subjuntivo que می‌خواهم یک پیام بگذارم (quiero dejar un mensaje) de la Unidad 7.
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Cuántas / vez
    gloss: cuántos / vez (ocasión)
    note: چند بار se usa aquí para preguntar por la frecuencia.
    target_text: چند (cuántas) / بار (vez)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Día
    gloss: día
    note: روز significa día.
    target_text: روز (día)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Usted usa (formal)
    gloss: usa (usted)
    note: استفاده می‌کنین es la forma de cortesía «usa/usan», igual que ورزش می‌کنین de la Unidad 29.
    target_text: استفاده می‌کنین (usted usa, formal)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: ¿Cuántas veces al día usa el teléfono móvil?
    gloss: ¿Cuántas veces al día usa el teléfono móvil?
    note: Combina چند بار (cuántas veces), در روز (al día), از موبایل (el teléfono móvil) y استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: Uso internet todos los días
    gloss: Uso internet todos los días.
    note: هر روز se combina con از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: Él/ella usa
    gloss: él/ella usa
    note: استفاده می‌کند es la forma de tercera persona, con el mismo patrón می‌کند repasado en la Unidad 29.
    target_text: استفاده می‌کند (él/ella usa, 3.ª persona)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: Tú (informal) / usas (informal)
    gloss: tú / tú usas
    note: تو y می‌کنی son el registro informal que usan entre sí Homayoun y Zarmina.
    target_text: تو (tú, informal) / می‌کنی (usas, informal)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Dónde
    gloss: dónde
    note: کجا significa dónde.
    target_text: کجا (dónde)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ¿cuántas veces al día usas el teléfono móvil?'
    gloss: Zarmina, ¿cuántas veces al día usas el teléfono móvil?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Uso mucho el teléfono móvil. Hago fotos y envío mensajes.'
    gloss: Uso mucho el teléfono móvil. Hago fotos y envío mensajes.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: ¿Usas el ordenador?'
    gloss: ¿Usas el ordenador?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sí, uso el ordenador en la oficina.'
    gloss: Sí, uso el ordenador en la oficina.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Uso internet todos los días.'
    gloss: Uso internet todos los días.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: ¡Genial!'
    gloss: ¡Genial!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Lectura sobre tecnología
    gloss: Zarmina usa el teléfono móvil todos los días. Hace fotos y envía mensajes. En la oficina usa el ordenador. Homayoun usa internet todos los días.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Pero
    gloss: pero
    note: اما significa pero.
    target_text: اما (pero)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: Me gusta / tiempo / no tengo
    gloss: me gusta / tiempo / no tengo
    note: دوست دارم (me gusta), وقت (tiempo) y ندارم (no tengo) son repaso de las Unidades 11, 14, 26 y 29.
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: Me gusta la tecnología, pero no tengo tiempo
    gloss: Me gusta la tecnología, pero no tengo tiempo.
    note: Combina تکنالوژی را دوست دارم (me gusta la tecnología, construcción de repaso) con اما وقت ندارم (pero no tengo tiempo).
