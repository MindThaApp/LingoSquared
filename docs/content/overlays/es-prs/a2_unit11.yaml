course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: abrir una cuenta bancaria básica; vocabulario, cómo pedir la cuenta, lectura de un aviso del banco y la conversación en la ventanilla.'
units:
  prs.a2.unit11.banking:
    title: Abrir una cuenta bancaria
lessons:
  prs.a2.unit11.lesson01.banking_vocabulary:
    title: Palabras para el banco
  prs.a2.unit11.lesson02.requesting_an_account:
    title: Solicitar una cuenta
  prs.a2.unit11.lesson03.reading_a_bank_notice:
    title: Leer un aviso del banco
  prs.a2.unit11.lesson04.bank_counter_dialogue:
    title: En la ventanilla del banco
teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: Banco
    gloss: banco
    note: '*بانک* es la palabra de uso cotidiano para «banco».'
    example_gloss: El banco está cerca de la casa de Homayoun.
  prs.a2.unit11.lesson01.teach.account_word:
    title: Cuenta bancaria
    gloss: cuenta bancaria
    note: '*حساب بانکی*: *حساب* solo también significa «cuenta» en contextos generales.'
    example_gloss: Homayoun quiere una cuenta bancaria.
  prs.a2.unit11.lesson01.teach.card_word:
    title: Tarjeta bancaria
    gloss: tarjeta bancaria
    note: '*کارت بانکی*: *کارت* solo es la palabra general para «tarjeta».'
    example_gloss: Perdí mi tarjeta bancaria.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: PIN
    gloss: PIN / contraseña
    note: '*رمز* sirve tanto para el PIN bancario como para una contraseña en general.'
    example_gloss: Olvidé el PIN de mi tarjeta bancaria.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: Saldo
    gloss: saldo
    note: '*موجودی* es la cantidad de dinero que hay en una cuenta en ese momento.'
    example_gloss: El saldo de mi cuenta es bajo.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: Firma
    gloss: firma
    note: '*امضا* significa tanto el acto de firmar como la firma misma.'
    example_gloss: Firme aquí, por favor.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: Si, con اگر
    gloss: Si tiene su tazkira (documento nacional de identidad), puede abrir una cuenta.
    note: '*اگر* introduce una oración condicional, un nuevo tipo de oración subordinada junto a *چون* (porque).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: Abrir una cuenta
    gloss: abrir una cuenta
    note: '*باز کردن حساب*: *باز کردن* significa «abrir».'
  prs.a2.unit11.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace común que se usa en toda esta unidad.'
    target_text: و (y)
  prs.a2.unit11.lesson02.teach.request_account:
    title: Pedir abrir una cuenta
    gloss: Quisiera abrir una cuenta bancaria.
    note: Reutiliza el patrón de petición suavizada *می‌خواستم* ya visto.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: Indicar el requisito, con اگر
    gloss: Si tiene su tazkira (documento nacional de identidad) y un recibo del alquiler de la casa, puede abrir una cuenta.
    note: '*اگر... داشته باشین* -- ''si tienes...'' -- combina el nuevo condicional con *رسید کرایه خانه* (recibo de alquiler).'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: Decir cuándo estará lista la tarjeta
    gloss: Su tarjeta bancaria estará lista en tres días.
    note: '*تا سه روز دیگر* significa ''dentro de tres días''.'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: Comisión
    gloss: comisión
    note: '*کارمزد* es una comisión por un servicio o una transacción.'
    example_gloss: Esta cuenta no tiene comisión.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: Mínimo
    gloss: mínimo
    note: '*حداقل* significa ''mínimo'' o ''por lo menos''.'
    example_gloss: El saldo mínimo de la cuenta es de 500 afganis.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: Un aviso del banco sobre la apertura de cuentas
    gloss: Para abrir una cuenta, traiga su documento de identidad (tazkira) y un recibo de alquiler. El saldo mínimo de la cuenta es de 500 afganis. No hay comisión mensual.
    note: Un breve aviso oficial de un banco, en el registro formal escrito que enseña esta unidad.
  prs.a2.unit11.lesson04.teach.turn01:
    title: El empleado saluda a همایون
    gloss: El empleado lo invita a pasar y le pregunta qué servicio puede ofrecerle.
    note: El mismo saludo formal que usa un empleado de oficina al ofrecer ayuda.
  prs.a2.unit11.lesson04.teach.turn02:
    title: همایون pide abrir una cuenta
    gloss: همایون dice que quisiera abrir una cuenta bancaria.
    note: La misma fórmula de petición cortés con *می‌خواستم* de antes.
  prs.a2.unit11.lesson04.teach.turn03:
    title: El empleado pide los documentos
    gloss: El empleado le pregunta si tiene su documento de identidad y un recibo de alquiler.
    note: '*دارین؟* -- ''¿tiene usted?'' -- es la forma de pregunta cortés.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون confirma que los tiene
    gloss: Sí, aquí están su documento de identidad y su recibo de alquiler.
    note: '*این هم ...* (''aquí tiene ...'') es lo que se dice al entregar algo.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: El empleado confirma y da el plazo
    gloss: Bien. Su tarjeta bancaria estará lista en tres días.
    note: Repite el plazo *تا سه روز دیگر آماده می‌شود* ('estará lista dentro de tres días').
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون pregunta por el PIN
    gloss: Pregunta cuándo recibirá el PIN.
    note: '*رمزش* -- ''su PIN'' -- añade el sufijo posesivo *-ش* a *رمز*.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: El empleado responde
    gloss: El empleado dice que el mismo día en que recoja la tarjeta.
    note: '*همان روزی که ...* significa ''el mismo día en que ...''.'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون da las gracias al empleado
    gloss: همایون da las gracias al empleado por su tiempo.
    note: '*تشکر از وقت‌تان* (''gracias por su tiempo'') es una fórmula cortés de despedida.'
