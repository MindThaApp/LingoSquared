      status: correct
    feedback: '*امضا* significa firma.'
  prs.a2.unit11.lesson02.exercise01.recognize_request_account:
    instruction: ¿Qué frase pide con cortesía abrir una cuenta bancaria?
    correct_option: Quisiera abrir una cuenta bancaria.
    distractors:
