      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* -- el saldo mínimo es de 500 afganis.'
  prs.a2.unit11.lesson03.exercise03.recognize_fee_word:
    instruction: ¿Qué significa esta palabra?
    correct_option: comisión
    distractors:
    - mínimo
    - saldo
    - firma
    accepted_answers:
    - value: comisión
      status: correct
    feedback: '*کارمزد* significa comisión.'
  prs.a2.unit11.lesson03.exercise04.order_minimum_balance:
    instruction: Ordena las palabras para decir que el saldo mínimo de la cuenta es de 500 afganis.
    accepted_answers:
    - value:
      - حداقل
      - موجودی
      - حساب
      - پنجصد
      - افغانی
      - است
      status: correct
    feedback: '*حداقل موجودی حساب پنجصد افغانی است* indica el saldo mínimo, igual que en el aviso.'
  prs.a2.unit11.lesson03.exercise05.write_no_fee:
    instruction: Escribe que no hay comisión mensual.
    accepted_answers:
    - value: کارمزد ماهانه نیست.
      status: correct
    - value: کارمزد ماهانه نیست
      status: correct
    feedback: '*کارمزد ماهانه نیست.* dice que no hay comisión mensual.'
  prs.a2.unit11.lesson04.exercise01.comprehend_required_documents:
    instruction: ¿Qué le pide el empleado a همایون?
    correct_option: su documento de identidad y un recibo de alquiler
    distractors:
    - solo un pasaporte
    - solo un contrato de alquiler
    - nada en absoluto
    accepted_answers:
    - value: su documento de identidad y un recibo de alquiler
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* -- el empleado pide los dos documentos.'
  prs.a2.unit11.lesson04.exercise02.comprehend_card_ready:
    instruction: ¿Cuándo estará lista la tarjeta bancaria de همایون?
    correct_option: en tres días
    distractors:
    - en un día
    - en una semana
    - en un mes
    accepted_answers:
    - value: en tres días
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود* -- en tres días.'
  prs.a2.unit11.lesson04.exercise03.recognize_pin_timing:
    instruction: ¿Cuándo recibirá همایون su PIN?
    correct_option: el mismo día en que recoge la tarjeta
    distractors:
    - el día en que abre la cuenta
    - una semana después de que la tarjeta esté lista
    - tiene que llamar para preguntar
    accepted_answers:
    - value: el mismo día en que recoge la tarjeta
      status: correct
    feedback: '*همان روزی که کارت را تحویل می‌گیرین* -- el mismo día en que recoge la tarjeta.'
  prs.a2.unit11.lesson04.exercise04.order_documents_question:
    instruction: Ordena las palabras para preguntar si alguien tiene su documento de identidad y un recibo de alquiler.
    accepted_answers:
    - value:
      - تذکره
      - و
      - یک
      - رسید
      - کرایه
      - خانه
      - دارین
      status: correct
    feedback: '*تذکره و یک رسید کرایه خانه دارین؟* pide los dos documentos.'
  prs.a2.unit11.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: 'El empleado pregunta: «¿Qué servicio puedo ofrecerle?». Responde como همایون.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* es la petición de همایون.'
  prs.a2.unit11.lesson04.exercise06.write_pin_summary:
    instruction: 'Di en una oración completa, en primera persona, cuándo recibes el PIN: el mismo día en que recoges la tarjeta.'
    accepted_answers:
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.
      status: correct
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم
      status: correct
    - value: رمزش را همان روزی که کارت را تحویل می‌گیرم می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم، رمزش را می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم رمزش را می‌گیرم
      status: correct
    feedback: '*رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.* convierte la respuesta del empleado (*تحویل می‌گیرین*, ''usted recoge'') en una oración en primera persona (''lo recibo el día en que recojo la tarjeta'').'
