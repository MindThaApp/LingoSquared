      - کارت
      - بانکی‌تان
      - تا
      - سه
      - روز
      - دیگر
      - آماده
      - می‌شود
      status: correct
    feedback: '*کارت بانکی‌تان تا سه روز دیگر آماده می‌شود.* indica el plazo.'
  prs.a2.unit11.lesson02.exercise03.dialogue_response_why_here:
    instruction: 'El empleado pregunta: «¿Qué servicio puedo ofrecerle?». Responde que quisieras abrir una cuenta bancaria.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* es la petición cortés.'
  prs.a2.unit11.lesson02.exercise04.translate_open_account:
    instruction: 'Traduce al dari (Afganistán): Quisiera abrir una cuenta bancaria.'
    accepted_answers:
    - value: می‌خواستم یک حساب بانکی باز کنم.
      status: correct
    - value: می‌خواستم یک حساب بانکی باز کنم
      status: correct
    feedback: '*می‌خواستم یک حساب بانکی باز کنم.* es la petición cortés.'
  prs.a2.unit11.lesson02.exercise05.write_if_documents:
    instruction: Escribe que, si tienes tu documento de identidad y un recibo de alquiler, puedes abrir una cuenta.
    accepted_answers:
    - value: اگر تذکره و رسید کرایه خانه داشته باشین، می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین. می‌توانین حساب باز کنین.
      status: correct
    - value: اگر تذکره و رسید کرایه خانه داشته باشین و می‌توانین حساب باز کنین
      status: correct
    feedback: Unir la condición y el resultado con una coma, un punto o *و* es igualmente natural.
  prs.a2.unit11.lesson03.exercise01.read_required_documents:
    instruction: Según el aviso, ¿qué documentos se necesitan para abrir una cuenta?
    correct_option: documento de identidad y un recibo de alquiler
    distractors:
    - solo un recibo de alquiler
    - un pasaporte y una foto
    - nada, solo tu nombre
    accepted_answers:
    - value: documento de identidad y un recibo de alquiler
      status: correct
    feedback: El aviso pide tu *تذکره* y un *رسید کرایه خانه*.
  prs.a2.unit11.lesson03.exercise02.read_minimum_balance:
