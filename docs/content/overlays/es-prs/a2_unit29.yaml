course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: decir lo que debes hacer, lo que no debes hacer o lo que no hace falta hacer, y preguntar si algo está permitido. Normas de una biblioteca, una piscina y un gimnasio con باید, نباید, لازم نیست, اجازه دارم y می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Reglas y permiso
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Deber, y los lugares del centro
  prs.a2.unit29.lesson02.must_not:
    title: 'Prohibido: normas de la biblioteca'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Preguntar: ¿puedo? ¿se puede?'
  prs.a2.unit29.lesson04.no_need:
    title: 'No hace falta: no tienes que'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: Leer y escuchar sobre normas
  prs.a2.unit29.lesson06.gym_conversation:
    title: Una conversación en el gimnasio y la piscina
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Biblioteca
    gloss: biblioteca
    note: '*کتابخانه* es una biblioteca. Para decir adónde vas se usa *به*: *به کتابخانه می‌روم* significa «voy a la biblioteca». Esta unidad trata de las normas de un centro comunitario que tiene biblioteca, piscina y gimnasio.'
    example_gloss: La biblioteca está cerca de mi casa.
  prs.a2.unit29.lesson01.teach.pool:
    title: La piscina
    gloss: piscina
    note: '*حوض آب‌بازی* es una piscina. Es la palabra de la unidad de la piscina.'
    example_gloss: Voy a la piscina todas las semanas.
  prs.a2.unit29.lesson01.teach.gym:
    title: Gimnasio
    gloss: gimnasio, club deportivo
    note: '*باشگاه* es un gimnasio o un club deportivo. Es la palabra de la unidad del gimnasio.'
    example_gloss: El gimnasio abre a las seis.
  prs.a2.unit29.lesson01.teach.rules:
    title: Reglas
    gloss: 'normas (singular: norma, ley)'
    note: '*قانون* es una norma, y *قانون‌ها* son las normas. El lugar se añade después con *-ی*: *قانون‌های کتابخانه* son las normas de la biblioteca. La terminación del plural se escribe como una parte pequeña separada del sustantivo, con un semiespacio.'
    example_gloss: Las normas del gimnasio están en la oficina.
  prs.a2.unit29.lesson01.teach.membership:
    title: Carné de socio
    gloss: carné de socio
    note: '*کارت عضویت* es un carné de socio, la tarjeta que te permite pedir libros prestados o usar un gimnasio. *کارت* es una palabra que ya conoces.'
    example_gloss: Mi carné de socio está en casa.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Zapatillas deportivas
    gloss: zapatillas deportivas
    note: '*کفش* es un zapato y *ورزشی* significa «deportivo», de *ورزش*. Así que *کفش ورزشی* son zapatillas deportivas.'
    example_gloss: Mis zapatillas deportivas son nuevas.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Deber: باید más el subjuntivo'
    gloss: debo ir, debes ir (a un amigo), él/ella debe ir, debemos ir, deben ir (formal o plural), deben ir (ellos)
    note: '*باید* significa «deber» o «tener que». Nunca cambia. La persona se indica en el verbo que va después, que está en subjuntivo: *بروم، بروی، برود، برویم، بروین، بروند*. Las terminaciones son las mismas que en el presente, *-م، -ی، -د، -یم، -ین، -ند*, pero el verbo empieza por *ب-* en lugar de *می‌*. Ya conoces esta forma después de *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). El orden de las palabras es *باید* primero y el verbo al final: *من باید به کتابخانه بروم*. El pronombre *من* es opcional porque la terminación ya indica quién es.'
  prs.a2.unit29.lesson01.teach.formation:
    title: Cómo se forma el subjuntivo
    gloss: 'voy: que vaya. vengo: que venga. hago: que haga. tomo (obtengo): que tome. doy: que dé. llevo: que lleve.'
    note: 'Toma el presente, quita *می‌* y pon *ب-* delante: *می‌روم* pasa a *بروم*, *می‌گیرم* pasa a *بگیرم*, *می‌دهم* pasa a *بدهم*, *می‌برم* pasa a *ببرم*. Dos verbos son distintos. *آمدن* da *بیایم* (no *بآیم*), y *کردن* da *کنم* sin *ب-* (también oirás *بکنم*, que es correcto). En los verbos de dos palabras solo cambia la parte verbal: *پس بدهم*, *کار کنم*, *دوش بگیرم*. Las demás personas siguen las mismas terminaciones: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: Llevar puesto
    gloss: llevar puesto, ponerse
    note: '*پوشیدن* es llevar puesto o ponerse ropa y zapatos. El subjuntivo es *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*, así que *باید کفش بپوشم* significa «debo llevar zapatos».'
    example_gloss: En el gimnasio debo llevar zapatos nuevos.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Deber con más verbos
    gloss: Debo sacar un carné. Debes ducharte. Debemos devolver el libro. Deben llevar zapatillas deportivas. Deben venir al gimnasio.
    note: 'El mismo patrón sirve para todos los verbos: *باید* y después el subjuntivo con la terminación adecuada. *دوش گرفتن* es ducharse y *پس دادن* es devolver, así que *باید کتاب را پس بدهیم* significa «debemos devolver el libro». Lo que das o tomas va antes del verbo, con *را* cuando es algo determinado: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: Debo ir a la biblioteca
    gloss: Debo ir a la biblioteca.
    note: Este es el patrón de toda la unidad. *باید* indica que es una norma o una obligación, y *بروم* muestra la persona. Todos en el centro siguen las mismas normas.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Callado
    gloss: silencioso, callado
    note: '*ساکت* significa «silencioso» o «callado». *ساکت باشین* es «por favor, guarden silencio» (a varias personas o a alguien a quien respetas).'
    example_gloss: La biblioteca es silenciosa.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Deber ser/estar: باشم'
    gloss: debo estar callado, debes estar callado, él/ella debe estar callado, debemos estar callados, deben estar callados (formal o plural), deben estar callados (ellos)
    note: 'El subjuntivo de *بودن* (ser/estar) es *باشم، باشی، باشد، باشیم، باشین، باشند*. Después de *باید* indica que alguien debe estar en cierto estado: *باید ساکت باشین* significa «deben guardar silencio». Ya conoces *باشد* y *باشین*; *باشم، باشی، باشیم* completan la serie.'
  prs.a2.unit29.lesson02.teach.food:
    title: La comida
    gloss: comida
    note: '*غذا* es comida. *غذا خوردن* es comer, y *غذا بخورم* es el subjuntivo de ese verbo.'
    example_gloss: Comemos en casa.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Cigarrillo
    gloss: cigarrillo
    note: '*سگرت* es un cigarrillo. *سگرت کشیدن* es fumar, con el verbo *کشیدن*.'
    example_gloss: Él fuma cigarrillos todos los días.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Prohibido
    gloss: prohibido, no permitido
    note: '*ممنوع* significa «prohibido» y es lo que se lee en los carteles: *غذا خوردن ممنوع است* significa «está prohibido comer». Primero va la actividad en infinitivo (*کشیدن، خوردن، گرفتن*) y después *ممنوع است*.'
    example_gloss: Está prohibido fumar en el gimnasio.
  prs.a2.unit29.lesson02.teach.loud:
    title: Alto, en voz alta
    gloss: 'alto, en voz alta (también: alto de estatura, elevado)'
    note: '*بلند* significa «en voz alta» cuando dices cómo habla alguien: *بلند صحبت کردن* es hablar en voz alta. *صحبت کردن* es un verbo que ya conoces.'
    example_gloss: Él habla en voz alta.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'No deber: نباید más el subjuntivo'
    gloss: no debo comer, no debes comer, él/ella no debe comer, no debemos comer, no deben comer (formal o plural), no deben comer (ellos)
    note: '*نباید* es la negación de *باید* y significa «no deber». La *ن* se pone en *باید*, y el verbo que sigue queda en forma afirmativa: *نباید غذا بخورین* significa «no deben comer». El verbo lleva las mismas terminaciones de subjuntivo que después de *باید*. *نباید* se usa para una norma o un consejo firme, por eso lo dice el personal de una biblioteca o de una piscina.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Dos formas de decir que no está permitido
    gloss: Está prohibido comer. No deben comer.
    note: '*ممنوع است* y *نباید* dicen lo mismo. El cartel usa el infinitivo: *غذا خوردن ممنوع است*. Una persona que te habla usa *نباید* con el subjuntivo: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: No deben comer en la biblioteca
    gloss: No deben comer en la biblioteca.
    note: Primero va el lugar, luego *نباید*, después el objeto y al final el verbo.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: Deben guardar silencio en la biblioteca
    gloss: Deben guardar silencio en la biblioteca.
    note: '*باید ساکت باشین* es una norma que dice lo que hay que hacer, mientras que *نباید* dice lo que no hay que hacer.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: No deber con más personas
    gloss: No debo hablar por teléfono. No debes hablar por teléfono (a un amigo). No deben hablar por teléfono (formal o plural).
    note: 'Con un verbo de dos palabras como *صحبت کردن*, solo cambia la parte verbal: *صحبت کنم، صحبت کنی، صحبت کنین*. A un amigo le dices *نباید ... کنی*; a varias personas o a alguien a quien respetas, *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: No deben hablar por teléfono en el gimnasio
    gloss: No deben hablar por teléfono en el gimnasio.
    note: '*با تیلفون صحبت کردن* es hablar por teléfono. *صحبت کنین* es el subjuntivo de *صحبت کردن* para *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Aquí
    gloss: aquí
    note: '*اینجا* significa «aquí». Ya conoces *آنجا* (allí): *اینجا* es el que indica lo cercano.'
    example_gloss: La biblioteca está aquí.
  prs.a2.unit29.lesson03.teach.permission:
    title: Permiso
    gloss: permiso
    note: '*اجازه* es permiso. *اجازه دارم* significa «tengo permiso» y *اجازه ندارم* significa «no tengo permiso». Para otra persona se dice *اجازه دارین* (tiene/tienen permiso) o *اجازه ندارین* (no tiene/tienen permiso).'
    example_gloss: Aquí tiene permiso.
  prs.a2.unit29.lesson03.teach.photo:
    title: Foto
    gloss: foto, fotografía
    note: '*عکس* es una foto. *عکس گرفتن* es hacer una foto, con el verbo *گرفتن*.'
    example_gloss: Mis fotos están en mi teléfono.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: ¿Puedo...? اجازه دارم más el subjuntivo
    gloss: ¿Puedo hacer una foto aquí? ¿Puedo llevarme el libro a casa? ¿Puedo usar el teléfono?
    note: 'Para preguntar si tienes permiso para hacer algo, di *اجازه دارم* y después el subjuntivo del verbo: *اجازه دارم اینجا عکس بگیرم؟* significa «¿puedo hacer una foto aquí?». Empieza con *ببخشین* (disculpe) para ser cortés. La persona se indica en el verbo que va después de *اجازه دارم*, así que para otra persona cambias ambos: *اجازه دارین عکس بگیرین* significa «pueden hacer una foto».'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Poder: می‌توانم'
    gloss: puedo, puedes (a un amigo), él/ella puede, podemos, pueden (formal o plural), pueden (ellos)
    note: '*می‌توانم* significa «puedo». Se escribe con un pequeño espacio entre *می* y *توانم*. Las formas son *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Después va el subjuntivo: *می‌توانم اینجا عکس بگیرم؟* significa «¿puedo hacer una foto aquí?». Preguntar *می‌توانم ...؟* es otra forma de pedir permiso, tan frecuente como *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Decir sí o no
    gloss: Sí, tienes permiso. Sí, puedes. No, no tienes permiso. No, no puedes. No, está prohibido.
    note: 'Responde con el mismo verbo con el que te preguntan: a *اجازه دارم؟* se responde *اجازه دارین / اجازه ندارین*, y a *می‌توانم؟* se responde *می‌توانین / نمی‌توانین*. Cuando una norma lo prohíbe, también puedes decir *ممنوع است*. Puedes añadir *بلی، البته* (sí, claro).'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Disculpe, ¿puedo llevarme este libro a casa?
    gloss: Disculpe, ¿puedo llevarme este libro a casa?
    note: '*ببخشین* abre la pregunta con cortesía. *به خانه ببرم* significa «llevar a casa».'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Sí, puede
    gloss: Sí, tiene permiso.
    note: Un sí corto y cortés a una pregunta con *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: No, aquí está prohibido hacer fotos
    gloss: No, aquí no se permite hacer fotos.
    note: 'Un no que da el motivo con *ممنوع*: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'No hace falta: لازم نیست más el subjuntivo'
    gloss: No hace falta que vengamos. No tiene que pagar.
    note: '*لازم نیست* significa «no es necesario», es decir, no hace falta. Va seguido del subjuntivo, igual que *باید*: *لازم نیست پول بدهین* significa «no tiene que pagar». *لازم نیست* no prohíbe nada. Solo indica que depende de ti.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'Más formal: ضرورت ندارد'
    gloss: No es necesario traer una tarjeta.
    note: '*ضرورت ندارد* significa lo mismo que *لازم نیست*, pero es algo más formal y se ve en los avisos: *ضرورت ندارد کارت بیاورین* significa «no es necesario traer tarjeta». El verbo que sigue vuelve a estar en subjuntivo. En el habla cotidiana lo normal es *لازم نیست*.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Tres significados distintos
    gloss: Debo venir. No debo venir. No tengo que venir.
    note: '*باید بیایم* es una obligación, *نباید بیایم* es una prohibición y *لازم نیست بیایم* es libertad: puedo venir, pero no tengo por qué. No confundas *نباید* con *لازم نیست*: *نباید* prohíbe y *لازم نیست* no.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Toalla
    gloss: toalla
    note: '*حوله* es una toalla. *حوله‌ام* es mi toalla.'
    example_gloss: Mi toalla está en el gimnasio.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Todos
    gloss: todos, todo el mundo
    note: '*همه* significa «todos» o «todo el mundo». Es útil para normas que valen para cualquiera: *همه باید ساکت باشند* significa «todos deben guardar silencio».'
    example_gloss: Todos en la biblioteca guardan silencio.
  prs.a2.unit29.lesson04.teach.bring:
    title: Traer
    gloss: traer
    note: '*آوردن* significa «traer». El subjuntivo es *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. Ya conoces *بیاورم*: *لازم نیست حوله بیاوری* significa «no tienes que traer toalla».'
    example_gloss: Mañana tienes que traer mis libros.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: En el gimnasio no hace falta traer toalla
    gloss: En el gimnasio no hace falta traer toalla.
    note: 'El gimnasio tiene sus propias toallas, así que no es necesario traer una. Es un buen ejemplo de *لازم نیست*: no está prohibido, simplemente no hace falta.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: No tiene que pagar
    gloss: No tiene que pagar.
    note: La inscripción a la biblioteca es gratuita, así que no hay que pagar. *پول بدهین* es el subjuntivo de *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Centro
    gloss: centro
    note: '*مرکز اجتماعی* es un centro comunitario, un edificio con biblioteca, piscina y gimnasio. Ya conoces *اجتماعی* de unidades anteriores.'
    example_gloss: El centro comunitario está cerca de mi casa.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Basura, papelera
    gloss: 'basura (y: papelera, cubo)'
    note: '*زباله* es la basura y *سطل* es un cubo o papelera. Ambas palabras son de la unidad sobre los residuos. El verbo es *انداختن*, «tirar»: *زباله را در سطل بیندازین* significa «tire la basura en el cubo».'
    example_gloss: La basura está en el cubo.
  prs.a2.unit29.lesson05.teach.run:
    title: Correr
    gloss: correr
    note: '*دویدن* significa «correr». El subjuntivo es *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*, así que *نباید بدوین* significa «no deben correr».'
    example_gloss: No debes correr en la piscina.
  prs.a2.unit29.lesson05.teach.throw:
    title: Tirar, echar
    gloss: tirar, echar
    note: '*انداختن* significa «tirar». El subjuntivo es *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*, así que *باید زباله را در سطل بیندازین* significa «deben echar la basura en el cubo».'
    example_gloss: Echa la basura en el cubo.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Shakila pide llevarse un libro a casa
    gloss: Disculpe, ¿puedo llevarme este libro a casa?
    note: Shakila es nueva en la biblioteca y pregunta con *اجازه دارم* más el subjuntivo *ببرم*. Dice *ببخشین* para ser cortés.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Nasir dice que primero necesita un carné
    gloss: Sí, pero primero debe sacar un carné de socio.
    note: 'Nasir es el bibliotecario, así que usa *شما* con la forma en *-ین*: *بگیرین*. *اول باید* significa «primero debe».'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Shakila pregunta por el pago
    gloss: ¿Tengo que pagar?
    note: '*باید پول بدهم؟* es una pregunta con *باید*: «¿tengo que pagar?».'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: Nasir dice que no hay que pagar, pero sí devolver el libro
    gloss: No, no tiene que pagar. Debe devolver el libro en un plazo de dos semanas.
    note: '*لازم نیست* indica que no hace falta pagar. *باید کتاب را تا دو هفته پس بدهین* es una obligación: el libro debe devolverse en dos semanas.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Shakila pregunta por comer
    gloss: ¿Puedo comer aquí?
    note: '*می‌توانم ...؟* pregunta si está permitido. El subjuntivo es *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: Nasir dice que no se puede comer y que hay que guardar silencio
    gloss: No, no debe comer. También debe guardar silencio.
    note: '*نباید غذا بخورین* es una prohibición y *باید ساکت هم باشین* es una obligación. *هم* significa «también».'
  prs.a2.unit29.lesson05.teach.notice:
    title: Un aviso sobre las normas del centro
    gloss: 'Aviso. Normas del centro comunitario. Biblioteca: En la biblioteca no deben comer y deben guardar silencio. Piscina: Antes de entrar en la piscina deben ducharse. No deben correr en la piscina. Gimnasio: En el gimnasio deben llevar calzado deportivo. No hace falta traer toalla. Deben echar la basura en el cubo.'
    note: 'Un aviso real mezcla los tres tipos de norma: *باید* para lo que debes hacer, *نباید* para lo que no debes hacer y *لازم نیست* para lo que no es necesario. El aviso se dirige a todos, por eso usa la forma en *-ین*.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: La primera vez
    gloss: la primera vez
    note: '*اولین بار* significa «la primera vez». *اولین* significa «primero» y *بار* significa «vez», como en *هر بار* (cada vez).'
    example_gloss: Voy a esta biblioteca por primera vez.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: ¿Qué debo hacer?
    gloss: ¿Qué debo hacer?
    note: 'Una pregunta muy útil: *چه* (qué), *باید* y el subjuntivo *بکنم*. Aquí valen tanto *بکنم* como *کنم*.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Nazila pregunta qué debe hacer
    gloss: Fahim, mañana voy al gimnasio por primera vez. ¿Qué debo hacer?
    note: Nazila tutea a su amigo con *تو*. *فردا ... می‌روم* es el presente simple usado para mañana.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Fahim indica una obligación y algo que no hace falta
    gloss: Tienes que llevar calzado deportivo. No hace falta que traigas toalla, el gimnasio tiene.
    note: 'Fahim habla con una amiga, así que los verbos terminan en *-ی*: *بپوشی، بیاوری*. *باید* es una obligación y *لازم نیست* indica que no hace falta.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Nazila pregunta por la piscina
    gloss: Después del gimnasio, ¿puedo ir a la piscina?
    note: '*می‌توانم ... بروم؟* pregunta si puede ir.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Fahim dice que sí, con dos normas
    gloss: Sí, pero primero tienes que ducharte. Además, no debes correr en la piscina.
    note: '*اول باید دوش بگیری* es una obligación y *نباید بدوی* es una prohibición. Ambas usan la terminación *-ی* para hablar con una amiga.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Nazila le da las gracias
    gloss: ¡Perfecto! Gracias.
    note: Un final breve y amable. *تشکر* significa «gracias».
exercises:
  prs.a2.unit29.lesson01.exercise01.recognize_must_go:
