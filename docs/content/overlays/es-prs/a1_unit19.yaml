course:
  title: Darí A1
  description: 'Dari de Kabul para principiantes: habitaciones básicas (dormitorio, cocina, baño), objetos del hogar (mesa, silla, cama, ventana), cómo combinar cantidad y lugar, lectura de una descripción de casa breve y otra más larga, y un diálogo para preguntar por la casa de alguien.'
units:
  prs.a1.unit19.housing:
    title: La vivienda
    description: Describe una casa sencilla, sus habitaciones, los objetos del hogar y su ubicación.
lessons:
  prs.a1.unit19.lesson01.room_words:
    title: Palabras de las habitaciones
  prs.a1.unit19.lesson02.object_words:
    title: Palabras de objetos del hogar
  prs.a1.unit19.lesson03.quantity_and_location:
    title: Cantidad y ubicación
  prs.a1.unit19.lesson04.reading_a_home_description:
    title: Lectura de una descripción de casa
  prs.a1.unit19.lesson05.reading_a_longer_description:
    title: Lectura de una descripción de casa más larga
  prs.a1.unit19.lesson06.home_dialogue:
    title: Un diálogo sobre la casa de alguien
teaching:
  prs.a1.unit19.lesson01.teach.house_word:
    title: Casa / hogar
    gloss: casa
    note: خانه significa «casa» u «hogar».
    example_gloss: Tengo una casa.
  prs.a1.unit19.lesson01.teach.room_word:
    title: Habitación
    gloss: habitación
    note: اتاق significa «habitación».
    example_gloss: Tengo un dormitorio.
  prs.a1.unit19.lesson01.teach.sleep_word:
    title: Dormir
    gloss: sueño
    note: 'خواب significa «sueño» (el acto de dormir): اتاق خواب significa literalmente «habitación de dormir», es decir, dormitorio.'
    example_gloss: Tengo un dormitorio.
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: Cocina
    gloss: cocina
    note: آشپزخانه significa «cocina».
    example_gloss: Tengo una cocina.
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: Baño
    gloss: baño
    note: تشناب es el término estándar del dari afgano para «baño» o «aseo», distinto del دستشویی del persa de Irán.
    example_gloss: Tengo un baño.
  prs.a1.unit19.lesson01.teach.have_word:
    title: Tengo
    gloss: tengo
    note: دارم es la primera persona del presente de داشتن (tener).
    target_text: دارم (tengo)
  prs.a1.unit19.lesson02.teach.table_word:
    title: Mesa
    gloss: mesa
    note: میز significa «mesa».
    example_gloss: Tengo una mesa.
  prs.a1.unit19.lesson02.teach.chair_word:
    title: Silla
    gloss: silla
    note: چوکی es el término estándar del dari afgano para «silla», distinto del صندلی del persa de Irán.
    example_gloss: Tengo una silla.
  prs.a1.unit19.lesson02.teach.bed_word:
    title: Cama
    gloss: cama
    note: تخت significa «cama».
    example_gloss: Tengo una cama.
  prs.a1.unit19.lesson02.teach.window_word:
    title: Ventana
    gloss: ventana
    note: کلکین es el término estándar del dari afgano para «ventana», distinto del پنجره del persa de Irán.
    example_gloss: Tengo una ventana.
  prs.a1.unit19.lesson03.teach.two_word:
    title: Dos
    gloss: dos
    note: دو significa «dos».
    example_gloss: Tengo dos habitaciones.
  prs.a1.unit19.lesson03.teach.three_word:
    title: Tres
    gloss: tres
    note: سه significa «tres».
    example_gloss: Tengo tres habitaciones.
  prs.a1.unit19.lesson03.teach.near_word:
    title: Cerca
    gloss: cerca
    note: نزدیک significa «cerca».
    example_gloss: La mesa está cerca de la ventana.
  prs.a1.unit19.lesson03.teach.is_word:
    title: Es / está
    gloss: es / está
    note: 'است es la cópula: میز نزدیک کلکین است significa «la mesa está cerca de la ventana».'
    target_text: است (es/está)
  prs.a1.unit19.lesson04.teach.this_word:
    title: Este / esta
    gloss: este
    note: این significa «este» o «esta».
    target_text: این (este/esta)
  prs.a1.unit19.lesson04.teach.has_word:
    title: Tiene
    gloss: tiene
    note: دارد es la tercera persona del presente de داشتن (tener).
    target_text: دارد (tiene -- tercera persona)
  prs.a1.unit19.lesson04.teach.one_word:
    title: Uno
    gloss: uno
    note: یک significa «uno» o «una».
    example_gloss: Tengo una cocina.
  prs.a1.unit19.lesson04.teach.and_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
  prs.a1.unit19.lesson04.teach.description_text:
    title: Una descripción breve de una casa
    gloss: Esta casa tiene dos dormitorios. Tiene una cocina y un baño.
    note: Una descripción breve en tercera persona que indica el número de habitaciones.
  prs.a1.unit19.lesson05.teach.big_word:
    title: Grande
    gloss: grande
    note: بزرگ significa «grande»; ya se vio su comparativo بزرگ‌تر en la unidad de comparaciones de este curso.
    example_gloss: La cocina es grande.
  prs.a1.unit19.lesson05.teach.across_from_word:
    title: Frente a
    gloss: frente a
    note: مقابل significa «frente a» o «enfrente de».
    target_text: مقابل (frente a)
  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: Una descripción de casa más larga
    gloss: Esta casa tiene dos dormitorios. Tiene una cocina y un baño. La cocina es grande. La mesa está frente a la ventana.
    note: La misma descripción de la lección 4, ampliada con datos de tamaño y ubicación.
  prs.a1.unit19.lesson06.teach.names:
    title: Laila y Feridoon
    gloss: Laila, Feridoon
    note: Personajes que aparecen a lo largo de este curso.
    example_gloss:
    - Soy Laila.
    - Soy Feridoon.
  prs.a1.unit19.lesson06.teach.you_word:
    title: Usted (cortesía)
    gloss: usted
    note: شما es el pronombre de segunda persona de cortesía.
    target_text: شما (usted -- cortesía)
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: Cuántos
    gloss: cuántos / cuántas
    note: چند significa «cuántos» o «cuántas».
    target_text: چند (cuántos)
  prs.a1.unit19.lesson06.teach.yes_word:
    title: Sí
    gloss: sí
    note: بلی es la palabra cortés o formal para «sí», acorde con el registro de este curso.
    example_gloss: Sí, es grande.
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: Feridoon pregunta
    gloss: ¿Cuántas habitaciones tiene su casa?
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: Laila responde
    gloss: Tiene dos dormitorios.
  prs.a1.unit19.lesson06.teach.dialogue_line3:
    title: Feridoon pregunta
    gloss: ¿La cocina es grande?
  prs.a1.unit19.lesson06.teach.dialogue_line4:
    title: Laila responde
    gloss: Sí, es grande.
