teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Billete
    gloss: billete
    note: تکت significa «billete». Es la palabra cotidiana del dari afgano; بلیط (también escrita بلیت, la palabra de estilo iraní) se entiende y se acepta, pero تکت es la que oirás normalmente.
    example_gloss: Tengo un billete.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Tren
    gloss: tren
    note: قطار significa «tren».
    example_gloss: El tren es bueno.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Autobús
    gloss: autobús
    note: بس significa «autobús», un uso habitual en el dari afgano.
    example_gloss: El autobús es bueno.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Aeropuerto
    gloss: aeropuerto
    note: 'میدان هوایی significa «aeropuerto»: es el término afgano que usa este curso (no el iraní فرودگاه), igual que en la Unidad 5.'
    example_gloss: El aeropuerto es bueno.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Un/una/uno
    gloss: un / uno
    note: یک significa «uno» y aquí se usa como artículo indefinido (un billete).
    target_text: یک (un/una/uno)
  prs.a1.unit16.lesson01.teach.az_word:
    title: De / desde
    gloss: desde
    note: از significa «de / desde» e indica origen (distinto de su otro uso, «que», en las comparaciones).
    target_text: از (de/desde)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Dos
    gloss: dos
    note: دو significa «dos».
    example_gloss: Tengo dos billetes.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Andén dos
    gloss: andén dos
    note: سکوی دو une سکو (andén) con el conector ezafe -ی y دو (dos).
    target_text: سکوی دو (andén dos)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Una de las principales ciudades del oeste de Afganistán.
    example_gloss: Voy a Herat.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Quiero
    gloss: quiero
    note: می‌خواهم es la forma completa, sin contraer, de «quiero», acorde con el registro de este curso.
    target_text: می‌خواهم (quiero)
  prs.a1.unit16.lesson02.teach.be_word:
    title: A
    gloss: a
    note: 'به indica el destino: به هرات significa «a Herat».'
    target_text: به (a)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Quiero un billete para Herat
    gloss: Quiero un billete para Herat
    note: یک تکت به هرات می‌خواهم reúne el vocabulario de esta lección en la forma habitual de pedir un billete.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Andén
    gloss: andén
    note: سکو significa «andén» (en una estación de tren).
    example_gloss: El tren sale del andén dos.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Sale
    gloss: sale
    note: حرکت می‌کند es la forma completa, sin contraer, de «sale / parte».
    target_text: حرکت می‌کند (sale)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Cuándo
    gloss: cuándo
    note: کی significa «cuándo» y se usa para preguntar por la hora.
    target_text: کی (cuándo)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Mañana (por la mañana)
    gloss: mañana (parte del día)
    note: صبح significa «mañana» (parte del día).
    example_gloss: El tren sale a las ocho de la mañana.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Texto de horario de ejemplo
    gloss: El tren de Herat sale del andén dos a las ocho de la mañana.
    note: Un anuncio breve y factual que combina el vocabulario de viajes de esta unidad; como el dari no tiene audio disponible, este texto escrito sustituye a un anuncio hablado de estación.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Mañana
    gloss: mañana
    note: فردا significa «mañana» (el día siguiente).
    example_gloss: Me voy mañana por la mañana.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Muy bien / de acuerdo
    gloss: muy bien / de acuerdo
    note: بسیار خوب es la forma completa y formal de decir «de acuerdo / muy bien», acorde con el registro de este curso (no el coloquial باشه).
    example_gloss: El tren es muy bueno.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: El viajero dice
    gloss: Quiero un billete para Herat.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: El vendedor pregunta
    gloss: ¿Cuándo quiere viajar?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: El viajero responde
    gloss: Mañana por la mañana.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: El vendedor confirma
    gloss: Muy bien, el tren sale del andén dos a las ocho de la mañana.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Muchas gracias
    gloss: muchas gracias
    note: تشکر زیاد es una forma cortés y habitual de decir «muchas gracias», ya vista en las Unidades 5 y 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: De nada
    gloss: de nada
    note: قابلی نداره es la respuesta cortés habitual a un agradecimiento («de nada»), ya vista en las Unidades 5 y 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Buen viaje
    gloss: buen viaje
    note: سفر خوش es un deseo de despedida habitual para quien va a viajar, ya visto en la Unidad 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
