course:
  title: Darí A1
  description: Darí de Kabul para principiantes, para comunicarte con respeto en el día a día.
units:
  prs.a1.unit03.family:
    title: La familia y los parientes
lessons:
  prs.a1.unit03.lesson01.immediate_family:
    title: Los miembros de la familia más cercana
  prs.a1.unit03.lesson02.extended_family:
    title: Parientes del lado de tu madre y de tu padre
  prs.a1.unit03.lesson03.family_size:
    title: ¿Cuántas personas hay en tu familia?
  prs.a1.unit03.lesson04.ask_about_family:
    title: Pregunta por la familia de otra persona
  prs.a1.unit03.lesson05.marital_status:
