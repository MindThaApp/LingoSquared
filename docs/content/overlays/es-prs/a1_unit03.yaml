      right: sí
    - left: نخیر
      right: 'no'
    - left: بلی، دارم
      right: sí, tengo
    - left: نخیر، ندارم
      right: no, no tengo
  prs.a1.unit03.lesson04.exercise04.order_question:
    instruction: 'Ordena la pregunta cortés: ¿Cuántos hermanos y hermanas tiene?'
    accepted_answers:
    - value:
      - چند
      - برادر
      - و
      - خواهر
