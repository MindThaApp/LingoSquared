teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Madre
    gloss: madre
    note: مادر es la palabra neutra en dari para madre.
    example_gloss: Mi madre es amable.
  prs.a1.unit03.lesson01.teach.father:
    title: Padre
    gloss: padre
    note: پدر es la palabra neutra en dari para padre.
    example_gloss: Mi padre es médico.
  prs.a1.unit03.lesson01.teach.brother:
    title: Hermano
    gloss: hermano
    note: برادر significa hermano.
    example_gloss: Tengo un hermano.
  prs.a1.unit03.lesson01.teach.sister:
    title: Hermana
    gloss: hermana
    note: خواهر significa hermana.
    example_gloss: Mi hermana es maestra.
  prs.a1.unit03.lesson01.teach.parents:
    title: Padres
    gloss: padre y madre; padres
    note: En dari se dice normalmente پدر و مادر para referirse a los padres de uno.
    example_gloss: Mis padres viven en Kabul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Presenta a tu madre
    gloss: Esta es mi madre.
    note: La terminación ـم de مادرم significa «mi».
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Abuelo
    gloss: abuelo
    note: پدرکلان es el término habitual en el dari de Afganistán; literalmente, «padre grande» o «padre mayor».
    example_gloss: Mi abuelo es anciano.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Abuela
    gloss: abuela
    note: مادرکلان es el término habitual en el dari de Afganistán; literalmente, «madre grande» o «madre mayor».
    example_gloss: Mi abuela es amable.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Hermano del padre
    gloss: tío paterno
    note: کاکا designa específicamente al hermano de tu padre.
    example_gloss: Mi tío vive en Herat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Hermana del padre
    gloss: tía paterna
    note: عمه designa específicamente a la hermana de tu padre.
    example_gloss: Mi tía es maestra.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Hermano de la madre
    gloss: tío materno
    note: ماما designa específicamente al hermano de tu madre en dari.
    example_gloss: Mi tío (materno) es ingeniero.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Hermana de la madre
    gloss: tía materna
    note: خاله designa específicamente a la hermana de tu madre.
    example_gloss: Mi tía (materna) vive en Kabul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Distingue los dos lados de la familia
    gloss: Kaka y amma son del lado paterno; mama y khala, del lado materno.
    note: En español, «tío» y «tía» no distinguen el lado de la familia, mientras que estas cuatro palabras del dari sí lo hacen.
  prs.a1.unit03.lesson03.teach.family:
    title: La familia
    gloss: familia
    note: فامیل es la palabra habitual en el dari de Afganistán para familia.
    example_gloss: Mi familia es grande.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Pregunta con cortesía cuántos son en la familia
    gloss: ¿Cuántas personas hay en su familia?
    note: ـتان marca el «su» de cortesía; نفر es el contador para personas.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Indica cuántos son en tu familia
    gloss: En nuestra familia somos cinco personas.
    note: En dari el tamaño de la familia se expresa con un número de personas y نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Cuenta tus hermanos
    gloss: Tengo un hermano y dos hermanas.
    note: دارم significa «tengo». El sustantivo permanece en singular después de un número.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Hijo único
    gloss: Soy hijo único.
    note: استم es la forma de primera persona del dari de Kabul que se enseña en este curso.
  prs.a1.unit03.lesson03.teach.possession:
    title: Formas del verbo «tener»
    gloss: tengo; tenemos; tienen / tiene usted
    note: دارین es la forma de respeto o de plural («usted/ustedes tienen») en el dari coloquial culto de Kabul.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Preguntar por los hermanos
    gloss: ¿Tiene usted hermanos y hermanas?
    note: دارین hace que la frase sea respetuosa o plural.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Preguntar cuántos hermanos
    gloss: ¿Cuántos hermanos y hermanas tiene usted?
    note: چند pregunta «cuántos».
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Pregunta por los padres de alguien
    gloss: ¿Están bien sus padres?
    note: جور استند es una forma familiar y habitual en Afganistán de decir que están bien.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Respuesta afirmativa
    gloss: Sí, tengo un hermano.
    note: بلی es el «sí» estándar y cortés que se usa en Afganistán.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Respuesta negativa
    gloss: No, no tengo hermana.
    note: نخیر es el «no» respetuoso; ندارم significa «no tengo».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: «Su» de cortesía
    gloss: su familia; su madre; su padre
    note: La terminación posesiva ـتان es de respeto o de plural. En este curso se une con un ZWNJ.
  prs.a1.unit03.lesson05.teach.married:
    title: Casado
    gloss: casado
    note: متأهل es un término neutro para el estado civil.
    example_gloss: Está casado/a.
  prs.a1.unit03.lesson05.teach.single:
    title: Soltero/a
    gloss: soltero/a; sin casar
    note: En este contexto, مجرد significa soltero/a.
    example_gloss: Estoy soltero/a.
  prs.a1.unit03.lesson05.teach.husband:
    title: Marido
    gloss: marido
    note: شوهر es la palabra habitual para decir marido.
    example_gloss: Mi marido es ingeniero.
  prs.a1.unit03.lesson05.teach.wife:
    title: Esposa
    gloss: esposa
    note: خانم puede significar esposa o ser un tratamiento de cortesía para una mujer; el contexto los distingue.
    example_gloss: Mi esposa es profesora.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Preguntar con cortesía por el estado civil
    gloss: ¿Está casado/a?
    note: Literalmente pregunta «¿Se ha casado?». La terminación ـین es la forma de cortesía de Kabul.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Decir que estás casado/a
    gloss: Sí, estoy casado/a.
    note: استم es la primera persona de la cópula en el dari de Afganistán usada aquí.
  prs.a1.unit03.lesson05.teach.children:
    title: Preguntar por los hijos
    gloss: ¿Tienes hijos?
    note: اولاد es una palabra colectiva habitual para referirse al hijo o a los hijos de alguien.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam pregunta por el tamaño de la familia
    gloss: ¿Cuántas personas son en su familia?
    note: Maryam usa el respetuoso ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh habla de sus hermanos
    gloss: Somos cinco personas. Tengo un hermano y una hermana.
    note: Los miembros de la familia se cuentan con نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam pregunta por el estado civil
    gloss: ¿Está casada?
    note: La pregunta es cortés y neutra en su forma.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh habla de su marido
    gloss: Sí, estoy casada. Mi marido es estudiante universitario.
    note: محصل, y no el iraní دانشجو, es la palabra establecida en el dari de Afganistán para «estudiante».
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam pregunta por los hijos
    gloss: ¿Tienes hijos?
    note: دارین mantiene el trato respetuoso.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh responde
    gloss: No, todavía no tenemos hijos.
    note: نخیر es un «no» respetuoso; نداریم significa «no tenemos».
