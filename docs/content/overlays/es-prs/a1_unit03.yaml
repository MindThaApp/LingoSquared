    - left: خاله
      right: hermana de la madre
    - left: مادر
      right: madre
    - left: پدر
      right: padre
    - left: برادر
      right: hermano
    - left: خواهر
      right: hermana
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 'Ordena: Esta es mi abuela.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من significa «mi abuela».
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'Completa: El hermano de mi madre es mi tío materno.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم significa «mi tío materno».
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'Traduce al dari: Ella es mi tía paterna.'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: Se acepta la separación escrita con el teclado; la ortografía estándar usa un ZWNJ (espacio de ancho cero sin unión).
    - value: او عمهٔ من است
      status: correct
    feedback: عمه designa a la hermana del padre.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Explica el parentesco, no a una persona concreta: di que el tío paterno (کاکا) es el hermano de tu padre y que el tío materno (ماما) es el hermano de tu madre.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا es del lado del padre; ماما es del lado de la madre.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: ¿Cuántas personas hay en esta familia?
    correct_option: cinco
    distractors:
    - cuatro
    - seis
    - siete
    accepted_answers:
    - value: cinco
      status: correct
    feedback: پنج نفر significa cinco personas.
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: Elige el significado de من تک‌فرزند استم.
    correct_option: Soy hijo único.
    distractors:
    - Tengo un hijo.
    - Tengo un hermano.
    - Somos una sola familia.
    accepted_answers:
    - value: Soy hijo único.
      status: correct
    feedback: تک‌فرزند significa hijo único.
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: Relaciona cada palabra o frase con su significado.
    accepted_answers:
    - value:
        دارم: tengo
        داریم: tenemos
        دارین: tienen / tiene usted (formal)
        فامیل: familia
        تک‌فرزند: hijo único
        یک برادر و دو خواهر دارم: Tengo un hermano y dos hermanas.
      status: correct
    feedback: Las terminaciones distinguen «yo», «nosotros» y «usted/ustedes»; las tres últimas muestran vocabulario de la familia y دارم en una oración completa, todo de esta misma lección.
    pairs:
    - left: دارم
      right: tengo
    - left: داریم
      right: tenemos
    - left: دارین
      right: tienen / tiene usted (formal)
    - left: فامیل
      right: familia
    - left: تک‌فرزند
      right: hijo único
    - left: یک برادر و دو خواهر دارم
      right: Tengo un hermano y dos hermanas.
  prs.a1.unit03.lesson03.exercise04.order_size:
