      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است indica una familia de seis personas.
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'Completa: Tengo un hermano.'
    accepted_answers:
    - value: دارم
      status: correct
    feedback: دارم significa «tengo».
  prs.a1.unit03.lesson03.exercise06.translate_size:
