course:
  title: Dari A2
  description: 'Dari afgano de nivel intermedio bajo: cómo afrontar un contratiempo de viaje: un autobús interurbano cancelado, preguntar por alternativas, leer un aviso de la estación y la conversación con el personal de la estación.'
units:
  prs.a2.unit15.travel_disruption:
    title: Contratiempos de viaje
lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: Palabras para contratiempos de viaje
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: Preguntar por alternativas
  prs.a2.unit15.lesson03.reading_a_station_notice:
    title: Leer un aviso de la estación
  prs.a2.unit15.lesson04.station_dialogue:
    title: En la estación de autobuses
teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: Retraso
    gloss: retraso
    note: '*تأخیر* es un retraso en general: un autobús, una reunión, cualquier cosa que va con retraso.'
    example_gloss: El autobús de hoy lleva una hora de retraso.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: Cancelación
    gloss: cancelación
    note: '*لغو* se usa con *شدن* (*لغو شده*, «ha sido cancelado»).'
    example_gloss: El autobús de las 9 ha sido cancelado.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: Cerrado
    gloss: cerrado
    note: '*بسته* describe una carretera, una tienda o una oficina que no está abierta.'
    example_gloss: La carretera Kabul-Mazar-e Sharif está cerrada.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: Ruta alternativa
    gloss: ruta alternativa
    note: '*مسیر بدیل* -- *مسیر* significa «ruta» y *بدیل* significa «alternativa».'
    example_gloss: No hay ruta alternativa.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: Nevada
    gloss: nevada
    note: '*برفباری* -- *برف* (nieve) más el sufijo que lo convierte en «nevada».'
    example_gloss: Debido a la nevada, la carretera está cerrada.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: Anuncio / aviso
    gloss: anuncio
    note: '*اطلاعیه* es un aviso publicado, como los que hay en la pared de una estación.'
    example_gloss: Leí el aviso de la estación.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: «Debido a», con به دلیل
    gloss: Debido a la nevada, el autobús ha sido cancelado.
    note: '*به دلیل* + sustantivo expresa una causa. Es el paso gramatical de nivel A2 de esta unidad: un nuevo conector causal distinto de *چون* («porque») de la Unidad 10, que lleva una oración completa.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: Decir que hay que esperar
    gloss: Tiene que esperar hasta mañana por la mañana.
    note: '*باید ... صبر کنین* -- «tiene que esperar» -- la terminación verbal de plural formal que se usa con un desconocido.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace habitual que une oraciones en esta unidad.'
    target_text: و (y)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: Yo también debo esperar
    gloss: Yo también debo esperar.
    note: '*من هم باید صبر کنم* presenta el subjuntivo de primera persona *کنم* («haga»), que va sin *می‌* después de *باید* («debo»).'
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: Preguntar cuándo sale el próximo autobús
    gloss: ¿Cuándo sale el próximo autobús?
    note: '*بعدی* significa «próximo».'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: Preguntar por una ruta alternativa
    gloss: ¿Hay una ruta alternativa?
    note: '*وجود دارد؟* -- «¿existe?» -- una forma habitual de preguntar si algo está disponible.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: Indicar la hora de salida de mañana
    gloss: El autobús sale mañana a las 8 de la mañana.
    note: Reutiliza el patrón de *ساعت* («hora») ya visto.
  prs.a2.unit15.lesson03.teach.station_word:
    title: Estación
    gloss: estación
    note: '*ایستگاه* se usa tanto para una estación de autobuses como para una estación de tren.'
    example_gloss: Homayoun fue a la estación de autobuses.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: Pasajeros
    gloss: pasajeros
    note: '*مسافران* es el plural de *مسافر* (pasajero/viajero).'
    example_gloss: Los pasajeros deben esperar.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: Un aviso de la estación sobre el autobús cancelado
    gloss: El autobús de las 9 de hoy a Mazar-e Sharif ha sido cancelado debido a la nevada. La carretera Kabul-Mazar-e Sharif está cerrada. Los pasajeros deben esperar hasta mañana por la mañana. El próximo autobús sale mañana a las 8 de la mañana.
    note: Un breve aviso oficial de la estación, en el registro escrito formal que enseña esta unidad.
  prs.a2.unit15.lesson04.teach.turn01:
    title: El personal de la estación saluda a همایون
    gloss: El personal de la estación le pregunta en qué puede ayudarlo.
    note: Un saludo formal como el del empleado de la oficina en la Unidad 9 (*بفرمایین، چه خدمتی...*), aquí con *کمکی* («ayuda») en lugar de *خدمتی* («servicio»).
  prs.a2.unit15.lesson04.teach.turn02:
    title: همایون pregunta por el autobús de las 9
    gloss: همایون pregunta cuándo sale el autobús de las 9 a Mazar-e Sharif.
    note: Reutiliza el patrón de pregunta *کی ... می‌کند؟* de la lección 2.
  prs.a2.unit15.lesson04.teach.turn03:
    title: El personal de la estación explica la cancelación
    gloss: El personal de la estación se disculpa y dice que ese autobús ha sido cancelado debido a la nevada.
    note: '*متأسفم* significa «lo siento».'
  prs.a2.unit15.lesson04.teach.turn04:
    title: همایون pregunta por una alternativa
    gloss: همایون pregunta si hay una ruta alternativa.
    note: Reutiliza exactamente la pregunta de la lección 2.
  prs.a2.unit15.lesson04.teach.turn05:
    title: El personal de la estación responde e indica la espera
    gloss: No, la carretera está cerrada. Tiene que esperar hasta mañana por la mañana.
    note: '*نخیر* es un «no» más formal, que va emparejado con *بلی* como ya se usa en este curso.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: همایون pregunta por el autobús de mañana
    gloss: همایون pregunta a qué hora sale el autobús de mañana.
    note: '*چند* aquí significa «qué (hora)».'
  prs.a2.unit15.lesson04.teach.turn07:
    title: El personal de la estación da la hora
    gloss: El autobús de mañana sale a las 8 de la mañana.
    note: Reutiliza exactamente el dato de la lección 2, pues es el mismo detalle real.
  prs.a2.unit15.lesson04.teach.turn08:
    title: همایون da las gracias al personal
    gloss: همایون les da las gracias por la información.
    note: '*معلومات‌تان* -- «su información» -- añade el sufijo posesivo formal *-تان*.'
