    title: Pomme
    gloss: pomme
    note: سیب est un exemple courant pour s’entraîner avec les prix et les quantités.
    example_gloss: Je voudrais une pomme.
  fa.a1.unit08.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant, utilisé tout au long de cette unité.
    target_text: و (et)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Demander combien coûte quelque chose
    gloss: Combien ça coûte ?
    note: این چنده؟ est la façon familière et courante de demander un prix ; c’est une contraction de این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Annoncer un prix au kilo
    gloss: C’est 30 tomans le kilo.
    note: کیلویی سی تومنه indique un prix au kilo avec la contraction familière en -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: La contraction familière en -e (révision)
    gloss: تومنه est la contraction orale courante de تومن است.
    note: C’est la même contraction que celle déjà vue avec les mots de la météo comme آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Demander un kilo de pommes
    gloss: Je voudrais un kilo de pommes.
    note: یک کیلو سیب می‌خوام utilise کیلو (kilo) comme unité de compte.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Demander un demi-kilo
    gloss: Je voudrais un demi-kilo.
    note: نصف کیلو می‌خوام remplace le kilo entier par نصف (la moitié).
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Demander une réduction
    gloss: Vous faites une réduction ?
    note: 'تخفیف می‌دید؟ est une question naturelle et courante dans les bazars et les magasins iraniens : marchander fait normalement partie des habitudes d’achat, et ce n’est ni impoli ni inhabituel.'
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: Le commerçant propose un prix plus bas
    gloss: Je vous le fais à 28 tomans.
    note: برات بیست و هشت تومن حساب می‌کنم propose une petite réduction par rapport au prix initial de 30 tomans.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Dire qu’on paie en espèces
    gloss: Je paie en espèces.
    note: نقدی حساب می‌کنم indique le mode de paiement avec نقدی (en espèces).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Demander si on peut payer par carte
    gloss: Vous acceptez les cartes ?
    note: کارت می‌گیرید؟ demande si le paiement par carte est accepté.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Je vous en prie / allez-y (révision)
    gloss: je vous en prie / allez-y
    note: بفرمایید a été vu dans l’unité sur les salutations ; ici, le commerçant l’utilise pour inviter le client à entrer.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Merci (révision)
    gloss: merci
    note: ممنون a été vu dans l’unité sur les salutations.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: Aucun souci (révision)
    gloss: aucun souci / de rien
    note: قابلی نداره est une façon modeste et courante de répondre à un remerciement, déjà vue dans une unité précédente.
  fa.a1.unit08.lesson06.teach.turn01:
    title: Le commerçant accueille le client
    gloss: Le commerçant salue le client et l’invite à entrer.
    note: بفرمایید invite le client à regarder ou à demander quelque chose.
  fa.a1.unit08.lesson06.teach.turn02:
    title: Le client demande le prix
    gloss: Le client salue le commerçant et demande le prix des pommes.
    note: این چنده؟ vu dans la leçon 2, appliqué à سیب‌ها (les pommes).
  fa.a1.unit08.lesson06.teach.turn03:
    title: Le commerçant annonce le prix
    gloss: Le commerçant dit que c’est 30 tomans le kilo.
    note: کیلویی سی تومنه vu dans la leçon 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: Le client commande et demande une réduction
    gloss: Le client dit qu’il veut un kilo et demande une réduction.
    note: Cela combine la structure des quantités de la leçon 3 et la question sur la réduction de la leçon 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: Le commerçant accepte de baisser le prix
    gloss: Le commerçant accepte et propose 28 tomans.
    note: باشه (d’accord) marque l’accord avant d’annoncer le prix réduit.
  fa.a1.unit08.lesson06.teach.turn06:
    title: Le client remercie et paie
    gloss: Le client remercie le commerçant et dit qu’il paiera en espèces.
    note: Cela combine le vocabulaire du paiement de la leçon 5 et un simple remerciement.
  fa.a1.unit08.lesson06.teach.turn07:
    title: Le commerçant conclut l’échange
    gloss: Le commerçant répond aux remerciements et invite le client à poursuivre.
    note: قابلی نداره، بفرمایید conclut poliment la transaction.
