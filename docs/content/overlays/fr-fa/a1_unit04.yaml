teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Mère
    gloss: mère
    note: مادر est le mot neutre, écrit ou formel, pour « mère ».
    example_gloss: Ma mère est gentille.
  fa.a1.unit04.lesson01.teach.maman:
    title: Maman
    gloss: maman
    note: مامان est le mot parlé de tous les jours, celui que la plupart des familles utilisent vraiment.
    example_gloss: Maman, j’ai faim.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Père
    gloss: père
    note: پدر est le mot neutre, écrit ou formel, pour « père ».
    example_gloss: Mon père est médecin.
  fa.a1.unit04.lesson01.teach.baba:
    title: Papa
    gloss: papa
    note: بابا est le mot parlé de tous les jours, celui que la plupart des familles utilisent vraiment.
    example_gloss: Papa, tu es où ?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Frère
    gloss: frère
    note: برادر ; la forme parlée et affectueuse داداش apparaît plus loin dans cette unité.
    example_gloss: J’ai un frère.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Sœur
    gloss: sœur
    note: خواهر, le mot standard pour « sœur ».
    example_gloss: Ma sœur est étudiante.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Mots formels et mots du quotidien
    gloss: Maman et papa, c’est comme mère et père, mais en plus familier.
    note: 'Le persan a deux registres réels pour les parents, sans séparation stricte formel/familier : مامان/بابا sont les mots que la plupart des gens emploient pour leurs propres parents, même en situation polie.'
  fa.a1.unit04.lesson02.teach.daram:
    title: J’ai
    gloss: j’ai
    note: '*دارم* est la première personne de *داشتن* (« avoir ») — le verbe essentiel pour parler de sa famille.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Un
    gloss: un
    note: یک, employé devant un nom compté, par ex. یک برادر (un frère).
    example_gloss: J’ai une sœur.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: J’ai un frère.
    gloss: J’ai un frère.
    note: 'Ordre des mots : sujet, quantité + nom, verbe — l’ordre sujet-objet-verbe typique du persan.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Je n’ai pas de sœur.
    gloss: Je n’ai pas de sœur.
    note: ندارم est la forme négative de دارم ; aucun mot séparé pour « de » ou « une » n’est nécessaire.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Ma famille est grande.
    gloss: Ma famille est grande.
    note: بزرگه est la forme contractée de la langue parlée pour « بزرگ است » (est grand).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Notre famille est petite.
    gloss: Notre famille est petite.
    note: کوچیکه est la forme contractée de la langue parlée pour « کوچک است » (est petit), avec la prononciation familière کوچیک au lieu de l’écrit کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Grand-père
    gloss: grand-père
    note: پدربزرگ, littéralement « grand père » — employé pour les deux côtés de la famille.
    example_gloss: Mon grand-père est âgé.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Grand-mère
    gloss: grand-mère
    note: مادربزرگ, littéralement « grande mère » — employé pour les deux côtés de la famille.
    example_gloss: Ma grand-mère est gentille.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Oncle paternel
    gloss: oncle (frère du père)
    note: عمو désigne précisément le frère du père, et non un mot général pour « oncle ».
    example_gloss: Mon oncle habite à Téhéran.
  fa.a1.unit04.lesson03.teach.amme:
    title: Tante paternelle
    gloss: tante (sœur du père)
    note: عمه désigne précisément la sœur du père.
    example_gloss: Ma tante est enseignante.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Oncle maternel
    gloss: oncle (frère de la mère)
    note: دایی désigne précisément le frère de la mère — le persan distingue le côté de la famille de chaque oncle et tante, alors que le français dit simplement « oncle » ou « tante ».
    example_gloss: Mon oncle (maternel) est ingénieur.
  fa.a1.unit04.lesson03.teach.khale:
    title: Tante maternelle
    gloss: tante (sœur de la mère)
    note: خاله désigne précisément la sœur de la mère.
    example_gloss: Ma tante (du côté de ma mère) habite à Ispahan.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Côté du père et côté de la mère
    gloss: L’oncle et la tante paternels sont du côté du père ; l’oncle et la tante maternels sont du côté de la mère.
    note: 'Cette distinction en quatre termes (عمو/عمه contre دایی/خاله) n’a pas d’équivalent en un mot en français : « oncle » et « tante » valent pour les deux côtés.'
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Combien
    gloss: combien
    note: چند تا s’emploie familièrement avant de compter des personnes ou des choses.
    example_gloss: Combien de sœurs as-tu ?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Combien de frères et sœurs avez-vous ? (poli)
    gloss: Combien as-tu de frères et sœurs ?
    note: دارید est la forme de politesse (pluriel) du verbe « avoir » ; elle s’accorde avec شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Combien de frères et sœurs as-tu ? (familier)
    gloss: Combien as-tu de frères et sœurs ?
    note: داری est la forme familière du singulier, utilisée avec un pair ou une personne plus jeune.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Combien de personnes y a-t-il dans ta famille ?
    gloss: Combien de personnes y a-t-il dans votre famille ?
    note: نفر est le mot de comptage pour les personnes ; نفرن est la forme parlée contractée de « نفر هستند » (sont … personnes).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Nous sommes quatre : moi, ma mère, mon père et mon frère.'
    gloss: 'Nous sommes quatre : moi, ma mère, mon père et mon frère.'
    note: نفریم = « نفر هستیم » (nous sommes … personnes) contracté, registre parlé.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Mari
    gloss: mari
    note: شوهر est le mot courant pour « mari ».
    example_gloss: Mon mari est ingénieur.
  fa.a1.unit04.lesson05.teach.zan:
    title: Épouse
    gloss: épouse
    note: زن signifie aussi « femme » en général ; le contexte indique le sens.
    example_gloss: Mon épouse est enseignante.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Marié
    gloss: marié(e)
    note: متأهل est un adjectif neutre, très courant, pour la situation matrimoniale.
    example_gloss: Il / elle est marié(e).
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Célibataire
    gloss: célibataire
    note: مجرد est le mot standard pour « célibataire ».
    example_gloss: Je suis célibataire.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Je suis célibataire.
    gloss: Je suis célibataire.
    note: مجردم = مجرد + م (« je suis »), le même suffixe de première personne que dans خوبم (« je vais bien »).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Je suis marié(e).
    gloss: Je suis marié(e).
    note: متأهلم = متأهل + م (« je suis »), même schéma que مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Petit-enfant
    gloss: petit-enfant
    note: 'نوه désigne aussi bien le petit-fils que la petite-fille : le persan n’impose pas de préciser le genre ici.'
    example_gloss: Il/elle a un petit-enfant.
  fa.a1.unit04.lesson05.teach.example:
    title: Mon frère est marié ; il a un fils.
    gloss: Mon frère est marié ; il a un fils.
    note: متأهله = « متأهل است » (est marié) contracté, registre parlé ; داره = « دارد » (a) en registre parlé.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: C’est la photo de ta famille ?
    gloss: C’est la photo de ta famille ?
    note: 'خانواده‌ته = « خانواده‌ی تو است » (c’est ta famille) contracté : un schéma parlé très courant.'
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Oui. Ça, c’est ma mère, et ça, c’est mon père.
    gloss: Oui. Ça, c’est ma mère, et ça, c’est mon père.
    note: '*آره* est le « oui » oral (face au *بله* formel). *مامانمه* est *مامانم* (« ma maman ») plus la terminaison orale « c’est ».'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Qui est ce monsieur ?
    gloss: Qui est ce monsieur ?
    note: کیه = « کی است » (qui est-ce) contracté, registre parlé.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: C’est mon frère. J’ai un frère, je n’ai pas de sœur.
    gloss: C’est mon frère. J’ai un frère, je n’ai pas de sœur.
    note: داداش est le mot affectueux et courant pour « frère », employé ici à la place du برادر plus neutre vu à la leçon 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'Ma famille, c’est l’inverse : j’ai deux sœurs, pas de frère.'
    gloss: 'Ma famille, c’est l’inverse : j’ai deux sœurs, pas de frère.'
    note: برعکسه = « برعکس است » (c’est l’inverse) contracté.
  fa.a1.unit04.lesson06.teach.closing:
    title: Alors ta famille aussi est animée !
    gloss: Alors ta famille aussi est animée !
    note: 'شلوغه = « شلوغ است » (est nombreux/animé) contracté : une façon chaleureuse et courante de décrire une famille avec plusieurs enfants.'
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Registre formel : a / n’a pas / est'
    gloss: 'À l’oral : il a, il n’a pas. À l’écrit formel : il a, il n’a pas ; il est mon frère.'
    note: دارد/ندارد/است sont les équivalents écrits formels des formes parlées داره/نداره utilisées dans ce dialogue ; à l’écrit formel, l’affectueux داداش est aussi remplacé par le neutre برادر.
