  fa.a1.unit16.lesson01.teach.yek_word:
    title: Un / une
    gloss: un / une / un seul
    note: یک signifie « un » et sert ici d’article indéfini (un billet).
    target_text: یک (un/une)
  fa.a1.unit16.lesson01.teach.az_word:
    title: De / depuis
    gloss: de, depuis
    note: از signifie « de » et marque l’origine (à distinguer de son autre emploi, « que », dans les comparaisons).
    target_text: از (de, depuis)
  fa.a1.unit16.lesson01.teach.do_word:
    title: Deux
    gloss: deux
    note: دو signifie « deux ».
    example_gloss: Je voudrais deux billets.
  fa.a1.unit16.lesson01.teach.sekooye_word:
    title: Quai deux
    gloss: quai numéro deux
    note: '*سکوی دو* associe *سکو* (quai) à la terminaison de liaison *-ی* (ézafé) et à *دو* (deux).'
    target_text: سکوی دو (quai deux)
  fa.a1.unit16.lesson02.teach.tehran_word:
    title: Téhéran
    gloss: Téhéran
    note: La capitale de l’Iran.
    example_gloss: Je vais à Téhéran demain.
  fa.a1.unit16.lesson02.teach.mikham_word:
    title: Je veux
    gloss: je veux
    note: می‌خوام est la contraction familière de می‌خواهم (je veux).
    target_text: می‌خوام (je veux)
  fa.a1.unit16.lesson02.teach.be_word:
    title: À / vers
    gloss: à / pour
    note: 'به marque la destination : به تهران signifie « à Téhéran ».'
    target_text: به (à, vers)
  fa.a1.unit16.lesson02.teach.belit_be_tehran_phrase:
    title: Je voudrais un billet pour Téhéran
    gloss: Je voudrais un billet pour Téhéran
    note: یک بلیط به تهران می‌خوام réunit le vocabulaire de cette leçon dans la formule habituelle pour demander un billet.
  fa.a1.unit16.lesson03.teach.sekoo_word:
    title: Quai
    gloss: quai
    note: سکو signifie « quai » (dans une gare).
    example_gloss: Le train part du quai deux.
  fa.a1.unit16.lesson03.teach.harekat_mikone_phrase:
    title: Il part
    gloss: il part
    note: حرکت می‌کنه est la contraction familière de حرکت می‌کند (il part / il se met en route).
    target_text: حرکت می‌کنه (il part)
  fa.a1.unit16.lesson03.teach.key_word:
    title: Quand
    gloss: quand
    note: کی signifie « quand » et sert à poser une question sur l’heure.
    target_text: کی (quand)
  fa.a1.unit16.lesson04.teach.sobh_word:
    title: Matin
    gloss: matin
    note: صبح signifie « matin ».
    example_gloss: Le train part le matin.
