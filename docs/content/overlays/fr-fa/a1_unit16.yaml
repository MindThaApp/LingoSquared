    title: Exemple d’horaire
    gloss: Le train de Téhéran part du quai deux à huit heures du matin.
    note: Une courte annonce factuelle qui réunit le vocabulaire du voyage de cette unité. Ce texte écrit remplace une annonce sonore de gare.
  fa.a1.unit16.lesson05.teach.farda_word:
    title: Demain
    gloss: demain
    note: فردا signifie « demain ».
    example_gloss: J’y vais demain matin.
  fa.a1.unit16.lesson05.teach.bashe_word:
    title: Ça va
    gloss: bien
    note: باشه est la contraction familière de باشد (d’accord).
    example_gloss: D’accord, merci.
