    title: Le voyageur dit
    gloss: Je voudrais un billet pour Téhéran.
  fa.a1.unit16.lesson05.teach.dialogue_line2:
    title: Le vendeur demande
    gloss: Quand voulez-vous partir ?
  fa.a1.unit16.lesson05.teach.dialogue_line3:
    title: Le voyageur répond
    gloss: Demain matin.
  fa.a1.unit16.lesson05.teach.dialogue_line4:
    title: Le vendeur confirme
    gloss: D’accord, le train part du quai deux à huit heures du matin.
  fa.a1.unit16.lesson06.teach.mamnoon_word:
    title: Merci
    gloss: merci
    note: ممنون signifie « merci ».
    example_gloss: Merci beaucoup.
