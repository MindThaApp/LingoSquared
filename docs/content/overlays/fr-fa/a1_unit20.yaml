teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: Chemise
    gloss: chemise
    note: پیراهن est un mot général pour « chemise ».
    example_gloss: Je veux une chemise.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: Pantalon
    gloss: pantalon
    note: شلوار signifie « pantalon ».
    example_gloss: Combien coûte ce pantalon ?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: Chaussures
    gloss: chaussures
    note: کفش signifie « chaussures ».
    example_gloss: Vous avez des chaussures ?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Veste
    gloss: veste
    note: کت désigne une veste (de costume ou un blazer) ; un gros manteau d’hiver s’appelle généralement autrement.
    example_gloss: Je voudrais une veste.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Joli / beau
    gloss: joli
    note: قشنگ est un mot courant pour « joli / beau », souvent employé avec la contraction -e (قشنگه).
    example_gloss: Cette veste est jolie.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Je veux (révision)
    gloss: je veux
    note: '*می‌خوام* est la forme parlée courante de *می‌خواهم*. Tu l’as déjà rencontrée dans une unité précédente ; elle sert ici à demander des vêtements.'
    target_text: می‌خوام (je veux)
  fa.a1.unit20.lesson01.teach.va_word:
    title: Et (révision)
    gloss: et
    note: '*و* est le mot de liaison courant pour « et », révisé depuis une unité précédente.'
    target_text: و (et)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Couleur
    gloss: couleur
    note: رنگ est le mot général pour « couleur ».
    example_gloss: Quelle couleur voulez-vous ?
  fa.a1.unit20.lesson02.teach.red_word:
    title: Rouge
    gloss: rouge
    note: قرمز signifie « rouge ».
    example_gloss: Cette chemise est rouge.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: Bleu
    gloss: bleu
    note: آبی signifie « bleu » ; avec la contraction -e (آبیه), il veut dire « est bleu ».
    example_gloss: Mon pantalon est bleu.
  fa.a1.unit20.lesson02.teach.black_word:
    title: Noir
    gloss: noir
    note: سیاه signifie « noir ».
    example_gloss: Les chaussures noires sont jolies.
  fa.a1.unit20.lesson02.teach.white_word:
    title: Blanc
    gloss: blanc
    note: سفید signifie « blanc ».
    example_gloss: Je voudrais une veste blanche.
  fa.a1.unit20.lesson03.teach.size_word:
    title: Taille
    gloss: taille
    note: سایز est le mot courant pour la taille d’un vêtement.
    example_gloss: Quelle taille voulez-vous ?
  fa.a1.unit20.lesson03.teach.big_word:
    title: Grand
    gloss: grand
    note: بزرگ signifie « grand ».
    example_gloss: Je voudrais une grande taille.
  fa.a1.unit20.lesson03.teach.small_word:
    title: Petit
    gloss: petit
    note: کوچیک signifie « petit » ; avec la contraction -e (کوچیکه), il veut dire « est petit ».
    example_gloss: Ces chaussures sont petites.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: Moyen
    gloss: moyen
    note: متوسط signifie « moyen » (taille moyenne).
    example_gloss: Vous avez une taille moyenne ?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: Demander à essayer
    gloss: Je peux l’essayer ?
    note: می‌تونم امتحانش کنم؟ est la façon familière courante de demander à essayer un vêtement.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: Oui, allez-y
    gloss: Oui, je vous écoute.
    note: '*بله، بفرمایید* est une façon polie pour un commerçant de dire oui, en reprenant *بفرمایید* vu dans une unité précédente.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: La contraction parlée می‌تونم (révision)
    gloss: je peux (forme parlée)
    note: 'Dans la langue de tous les jours, le -ان- écrit devient souvent -ون- : *می‌توانم* devient *می‌تونم* (je peux). Tu as déjà vu le même changement dans *تومن*, la forme parlée de *تومان*.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: Une étiquette de vêtement
    gloss: 'Taille : grande. Couleur : rouge.'
    note: Une courte étiquette de vêtement, au même format que sur de vrais vêtements.
  fa.a1.unit20.lesson06.teach.please_review:
