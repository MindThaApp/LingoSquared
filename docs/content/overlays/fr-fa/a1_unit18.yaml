teaching:
  fa.a1.unit18.lesson01.teach.shoghl_word:
    title: Le métier
    gloss: travail, métier
    note: شغل signifie « métier » ou « profession ».
    example_gloss: Quel est ton métier ?
  fa.a1.unit18.lesson01.teach.mohandesam_word:
    title: Je suis ingénieur
    gloss: Je suis ingénieur
    note: مهندسم est la contraction familière de مهندس هستم (je suis ingénieur).
    example_gloss: Je suis ingénieur.
  fa.a1.unit18.lesson01.teach.moallemam_word:
    title: Je suis professeur
    gloss: je suis professeur
    note: معلمم est la contraction familière de معلم هستم (je suis professeur).
    example_gloss: Je suis professeur.
  fa.a1.unit18.lesson01.teach.doctoram_word:
    title: Je suis médecin
    gloss: je suis médecin
    note: دکترم est la contraction familière de دکتر هستم (je suis médecin).
    example_gloss: Je suis médecin.
  fa.a1.unit18.lesson01.teach.man_word:
    title: je
    gloss: je
    note: '*من* signifie « je / moi » (révision). Tu peux le placer devant *مهندسم*, *معلمم* ou *دکترم* pour une phrase plus complète : *من مهندسم*.'
    example_gloss: Je vais bien.
  fa.a1.unit18.lesson02.teach.shoghlet_word:
    title: Ton métier
    gloss: ton travail
    note: شغلت associe شغل (travail, métier) et le suffixe possessif familier -ت (ton).
    target_text: شغلت (ton métier)
  fa.a1.unit18.lesson02.teach.chie_word:
    title: Qu’est-ce que c’est
    gloss: qu’est-ce que c’est / quel est
    note: چیه est la contraction familière de چی است (qu’est-ce que c’est, quel est).
    target_text: چیه (c’est quoi, familier)
  fa.a1.unit18.lesson02.teach.shoghlet_chie_question:
    title: Quel est ton métier ?
    gloss: Quel est ton métier ?
    note: 'شغلت چیه؟ réunit les deux mots nouveaux de cette leçon : c’est la façon courante et décontractée de demander le métier de quelqu’un.'
  fa.a1.unit18.lesson03.teach.sherkat_word:
    title: L’entreprise
    gloss: entreprise
    note: شرکت signifie « entreprise », « société ».
    example_gloss: Je travaille dans une entreprise.
  fa.a1.unit18.lesson03.teach.madrese_word:
    title: École
    gloss: école
    note: مدرسه signifie « école ».
    example_gloss: Je travaille dans une école.
  fa.a1.unit18.lesson03.teach.bimarestan_word:
    title: Hôpital
    gloss: hôpital
    note: بیمارستان signifie « hôpital ».
    example_gloss: Je travaille dans un hôpital.
  fa.a1.unit18.lesson03.teach.dar_word:
    title: Dans / à
    gloss: dans / à
    note: '*در* signifie « dans / à » et indique un lieu : *در یک شرکت* = dans une entreprise. Dans la langue de tous les jours, on dit souvent *توی* ou *تو* à la place.'
    target_text: در (dans, à)
  fa.a1.unit18.lesson03.teach.yek_word:
    title: Un / une
    gloss: un / une / un seul
    note: یک signifie « un » ; il sert ici d’article indéfini (une entreprise).
    target_text: یک (un/une)
  fa.a1.unit18.lesson03.teach.kar_mikoni_phrase:
    title: Tu travailles
    gloss: vous travaillez
    note: کار می‌کنی est la forme familière de la deuxième personne de کار کردن (travailler).
    target_text: کار می‌کنی (tu travailles)
  fa.a1.unit18.lesson03.teach.koja_word:
    title: Où
    gloss: où
    note: کجا signifie « où ».
    target_text: کجا (où)
  fa.a1.unit18.lesson03.teach.kar_mikonam_word:
    title: Je travaille
    gloss: je travaille
    note: کار می‌کنم est la forme familière de la première personne de کار کردن (travailler).
    target_text: کار می‌کنم (je travaille)
  fa.a1.unit18.lesson04.teach.har_rooz_word:
    title: Chaque jour
    gloss: chaque jour
    note: هر روز signifie « tous les jours ».
