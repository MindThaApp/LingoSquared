    - Sara est professeure.
  fa.a1.unit18.lesson06.teach.to_chi_phrase:
    title: Et toi ?
    gloss: Et toi ?
    note: تو چی؟ est une façon courte et courante de renvoyer la question à l’autre personne.
  fa.a1.unit18.lesson06.teach.aalie_word:
    title: C’est super
    gloss: c’est super
    note: عالیه est la contraction familière de عالی است (c’est super).
    example_gloss: C’est super.
  fa.a1.unit18.lesson06.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  fa.a1.unit18.lesson06.teach.moalleme_grammar:
    title: Il/elle est professeur(e)
    gloss: il est professeur / elle est professeure
    note: معلمه est la forme familière de la troisième personne (معلم است contracté), sur le modèle de معلمم à la première personne.
    target_text: معلمه (il/elle est enseignant(e), 3e personne familière)
  fa.a1.unit18.lesson06.teach.dialogue_line1:
    title: Sara demande
    gloss: Quel est ton métier ?
  fa.a1.unit18.lesson06.teach.dialogue_line2:
    title: Nima répond
    gloss: Je suis ingénieur. Je travaille dans une entreprise. Et toi ?
  fa.a1.unit18.lesson06.teach.dialogue_line3:
    title: Sara répond
