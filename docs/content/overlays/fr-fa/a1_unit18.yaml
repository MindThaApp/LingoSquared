course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : vocabulaire de base des métiers, demander le métier de quelqu’un, vocabulaire du lieu de travail, décrire une routine de travail, lire un court profil professionnel, et dialogue où deux personnes parlent de leur métier.'
units:
