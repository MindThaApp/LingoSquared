    title: Il/elle est ingénieur(e)
    gloss: il est ingénieur / elle est ingénieure
    note: مهندسه est la forme familière de la troisième personne (مهندس است contracté), sur le modèle de مهندسم à la première personne.
    target_text: مهندسه (il/elle est ingénieur(e), 3e personne familière)
  fa.a1.unit18.lesson05.teach.mikone_grammar:
    title: Il/elle travaille
    gloss: il/elle travaille
    note: کار می‌کنه est la forme familière de la troisième personne de کار کردن (travailler).
    target_text: کار می‌کنه (il/elle travaille, 3e personne familière)
  fa.a1.unit18.lesson05.teach.reading_text:
    title: Exemple de profil professionnel
    gloss: Nima est ingénieur. Il travaille dans une entreprise.
    note: Un court profil à la troisième personne qui réunit le vocabulaire du travail de cette unité.
  fa.a1.unit18.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: Des prénoms iraniens courants, utilisés tout au long de ce cours.
    example_gloss:
