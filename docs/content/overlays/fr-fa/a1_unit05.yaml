    title: Allez tout droit ; il y a un restaurant sur la droite
    gloss: Allez tout droit. Ensuite, il y a un restaurant sur la droite.
    note: Reprend سمت راست (sur la droite) de la leçon précédente et le complète avec un point de repère.
  fa.a1.unit05.lesson03.teach.mamnoon:
    title: Merci. Je vous en prie.
    gloss: Merci. Je vous en prie.
    note: ممنون / خواهش می‌کنم est l’échange poli habituel, déjà vu dans l’unité 1.
  fa.a1.unit05.lesson04.teach.kenar:
    title: À côté de
    gloss: à côté de
