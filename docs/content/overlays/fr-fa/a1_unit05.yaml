    example_gloss: Allez à droite.
  fa.a1.unit05.lesson02.teach.chap:
    title: Gauche
    gloss: gauche
    note: چپ, la direction.
    example_gloss: Allez à gauche.
  fa.a1.unit05.lesson02.teach.samte_rast:
    title: C’est sur la droite
    gloss: C’est sur la droite.
