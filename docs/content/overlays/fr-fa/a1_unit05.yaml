  fa.a1.unit05.lesson03.teach.berid:
    title: Allez (poli)
    gloss: allez (poli)
    note: برید est la forme de politesse à employer pour dire à un inconnu d’aller quelque part.
    example_gloss: Allez à droite.
  fa.a1.unit05.lesson03.teach.mostaghim_berid:
    title: Aller tout droit
    gloss: Va tout droit.
    note: مستقیم برید — la consigne polie habituelle.
  fa.a1.unit05.lesson03.teach.bad:
    title: Ensuite, après
    gloss: ensuite, après cela
