  fa.a1.unit05.lesson02.teach.samte_chap:
    title: C’est sur la gauche
    gloss: C’est sur la gauche.
    note: Dans la langue de tous les jours, سمت چپ است devient سمت چپه.
  fa.a1.unit05.lesson02.teach.restoran_samte_rast:
