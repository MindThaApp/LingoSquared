  fa.a1.unit05.lesson04.teach.azadi:
    title: Azadi (nom)
    gloss: Azadi (liberté)
    note: آزادی est très présent dans les noms de lieux et d’entreprises en Iran ; هتل آزادی sonne donc comme un nom d’hôtel tout à fait naturel.
    example_gloss: La place Azadi est célèbre.
  fa.a1.unit05.lesson04.teach.hamoon:
    title: Ce même
    gloss: ce même, le même
    note: همون est la forme orale courante de همان et renvoie au restaurant qui vient d’être mentionné.
    example_gloss: Ce même restaurant est bon.
  fa.a1.unit05.lesson04.teach.dialogue_line1:
    title: Excusez-moi, où est l’hôtel Azadi ?
    gloss: 'Sara : Excusez-moi, où est l’hôtel Azadi ?'
    note: Sara est le personnage que tu as déjà rencontré dans l’unité 2.
  fa.a1.unit05.lesson04.teach.dialogue_line2:
    title: Allez tout droit ; l’hôtel est à côté du restaurant
    gloss: 'Passant : Allez tout droit. Ensuite, il y a un restaurant sur la droite. L’hôtel est à côté de ce restaurant.'
    note: کنار signifie « à côté de » ; همون رستورانه renvoie au restaurant qui vient d’être mentionné.
  fa.a1.unit05.lesson04.teach.dialogue_line3:
    title: Merci
    gloss: 'Sara : Merci.'
    note: Sara remercie le passant.
  fa.a1.unit05.lesson04.teach.dialogue_line4:
    title: De rien
    gloss: 'Passant : Je vous en prie.'
    note: Le passant conclut l’échange poliment.
