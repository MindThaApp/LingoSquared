    title: 'Dialogue : le chat de Sara'
teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: je
    gloss: je
    note: '*من*, déjà bien connu, réapparaît ici pour parler de son propre animal.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: Il / elle
    gloss: il / elle
    note: '*او* réapparaît ici.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: J’ai / il-elle a / je n’ai pas
    gloss: j’ai / il-elle a / je n’ai pas
    note: '*دارم*/*داره* s’emploient de la même façon avec un animal. *ندارم* (je n’ai pas) et *نداره* (il/elle n’a pas) sont les formes négatives correspondantes, déjà employées ensemble dans le dialogue sur la famille de l’unité 4.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Animal
    gloss: animal
    note: '*حیوان* signifie animal.'
    example_gloss: Un chat est un animal.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Animal de compagnie
    gloss: animal de compagnie
    note: '*حیوان خونگی* signifie littéralement « animal de maison » : c’est la façon courante de dire « animal de compagnie ».'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Chien
    gloss: chien
    note: '*سگ* signifie chien.'
    example_gloss: J’ai un chien.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Chat
    gloss: chat
    note: '*گربه* signifie chat.'
    example_gloss: Il/Elle a un chat.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Oiseau
    gloss: oiseau
    note: '*پرنده* signifie oiseau.'
    example_gloss: Elle a un oiseau.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Poisson
    gloss: poisson
    note: '*ماهی* signifie poisson.'
    example_gloss: J’ai un poisson.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Tu as
    gloss: tu as
    note: '*داری* réapparaît ici, à la même forme familière de la 2e personne.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: As-tu un animal de compagnie ?
    gloss: tu as un animal de compagnie ?
    note: '*حیوان خونگی داری؟* combine *حیوان خونگی* de la leçon 1 et *داری* : la façon naturelle de demander à quelqu’un s’il a un animal de compagnie.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Ouais
    gloss: ouais
    note: '*آره* est le mot familier courant pour « oui ».'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Nom
    gloss: nom
    note: '*اسم* s’emploie de la même façon pour le nom d’un animal.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Comment il s’appelle ?
    gloss: comment il/elle s’appelle ?
    note: '*اسمش چیه؟* combine le suffixe possessif *-ش* (déjà vu dans *قدش*/*موهاش* à l’unité 25) et *چیه؟* de l’unité 2 : « comment s’appelle-t-il/elle ? »'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Nourriture
    gloss: nourriture
    note: '*غذا* est le même mot que pour la nourriture d’un animal.'
    example_gloss: J’aime la nourriture.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Je donne à manger
    gloss: je donne à manger
    note: '*می‌دم* (littéralement « je donne »), déjà aperçu dans *گوش می‌دم* de l’unité 24, est le verbe naturel pour nourrir un animal, avec *غذا*.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Mon chien
    gloss: mon chien
    note: '*سگم* combine *سگ* et le suffixe possessif *-م* : « mon chien », sur le même modèle soudé que *اسمم* de l’unité 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Je donne à manger à mon chien.
    gloss: Je donne à manger à mon chien.
    note: '*سگم رو غذا می‌دم* utilise *رو* (la marque de l’objet, déjà vue dans *قهوه رو بیشتر دوست دارم* de l’unité 14) pour marquer *سگم* comme celui qu’on nourrit.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: De quelle couleur est-ce ?
    gloss: de quelle couleur est-ce ?
    note: '*چه رنگیه؟* s’emploie de la même façon pour décrire la couleur d’un animal.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Blanc
    gloss: blanc
    note: '*سفید* réapparaît ici pour la couleur d’un animal. *گربه‌ی* est la forme avec ezafe de *گربه* employée devant un possesseur, comme dans *گربه‌ی من* (mon chat) : le même modèle que *خونه‌ی من* de l’unité 19, utilisé pour les noms terminés par une voyelle au lieu d’un suffixe soudé.'
    example_gloss: Mon chat est blanc.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Petit
    gloss: petit
    note: '*کوچیک* réapparaît ici pour la taille d’un animal.'
    example_gloss: Mon poisson est petit.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Grand
    gloss: grand
    note: '*بزرگ* réapparaît ici pour la taille d’un animal.'
    example_gloss: Mon chien est grand.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personnage présenté dès l’unité 2, réapparaît ici.'
    example_gloss: Sara a un chat.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Un / une
    gloss: un / une
    note: '*یک* est employé ici comme article indéfini « un/une ».'
  fa.a1.unit26.lesson05.teach.va_review:
    title: Et
    gloss: et
    note: '*و* signifie « et » : déjà employé ainsi dans les unités 14, 24 et 25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Pashmak
    gloss: Pashmak
    note: '*پشمک* (littéralement « barbe à papa ») est un vrai nom d’animal courant en Iran : c’est le nom du chat de Sara.'
    example_gloss: Le chat de Sara s’appelle Pashmak.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: Chaque jour
    gloss: chaque jour
    note: '*هر روز* s’emploie de la même façon ici pour nourrir un animal.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: Il/elle donne à manger
    gloss: il/elle donne à manger
    note: '*می‌ده* est la forme familière de la 3e personne du même verbe que *می‌دم* de la leçon 3 (je donne/je nourris).'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Lecture : le chat de Sara'
    gloss: Sara a un chat. Il s’appelle Pashmak. Pashmak est blanc et petit. Sara donne à manger à Pashmak tous les jours.
    note: 'Ce texte reprend toutes les structures des leçons 1 à 4, presque sans vocabulaire nouveau : il s’agit de les reconnaître dans un texte suivi.'
  fa.a1.unit26.lesson06.teach.in_word:
    title: Ceci
    gloss: ce / cette
    note: '*این* signifie « ce / ceci ».'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: À qui est-il ?
    gloss: à qui est-il ?
    note: '*کیه* est employé ici pour demander à qui appartient un animal.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: C’est à moi
    gloss: c’est à moi
    note: '*منه* est la contraction familière de *من است* : « c’est à moi ». *گربه‌ی منه* signifie « c’est mon chat ».'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: C’est mon chien
    gloss: c’est mon chien
    note: '*سگمه* combine *سگم* (mon chien, de la leçon 3) avec la même terminaison *-ه* (« est ») que dans *منه* : « c’est mon chien ».'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Mignon
    gloss: mignon
    note: '*خوشگل* veut dire « mignon » ou « joli ». *خیلی* veut dire « très ».'
    example_gloss: Le chat de Sara est très mignon.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Merci
    gloss: merci
    note: '*ممنون* revient ici comme formule de clôture naturelle.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima : C’est le chat de qui ?'
    gloss: C’est le chat de qui ?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara : C’est mon chat. Il s’appelle Pashmak.'
    gloss: C’est mon chat. Il s’appelle Pashmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima : De quelle couleur est-il ?'
    gloss: De quelle couleur est-il ?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara : Blanc et petit.'
    gloss: Blanc et petit.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima : Très mignon !'
    gloss: Très mignon !
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara : Merci !'
    gloss: Merci !
