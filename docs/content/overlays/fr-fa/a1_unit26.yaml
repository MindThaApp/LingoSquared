course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer les animaux de compagnie courants (chien, chat, oiseau, poisson), demander « Tu as un animal ? », donner le nom d’un animal et le nourrir, décrire sa couleur et sa taille, un court texte sur le chat de سارا, پشمک, et un dialogue final entre سارا et نیما qui admirent پشمک.'
