course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : le passé simple, raconter ce qui s’est passé hier, poser des questions sur un événement récent, lire et écrire à propos d’un événement récent, et dialogue comparant le week-end de deux personnes.'
