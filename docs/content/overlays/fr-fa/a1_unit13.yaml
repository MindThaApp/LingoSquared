    title: Bilan du week-end (dialogue)
teaching:
  fa.a1.unit13.lesson01.teach.diruz_word:
    title: Hier
    gloss: hier
    note: دیروز signifie « hier ».
    example_gloss: Hier, je suis allé(e) au cinéma.
  fa.a1.unit13.lesson01.teach.raftam_word:
    title: Je suis allé
    gloss: je suis allé
    note: رفتم est le passé simple de رفتن (aller), à la première personne.
    example_gloss: Je suis allé(e) au restaurant.
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: J’ai mangé
    gloss: j’ai mangé
    note: خوردم est le passé simple de خوردن (manger), à la première personne.
    example_gloss: J’ai déjeuné.
  fa.a1.unit13.lesson01.teach.didam_word:
    title: J’ai vu
    gloss: j’ai vu
    note: دیدم est le passé simple de دیدن (voir), à la première personne.
    example_gloss: J’ai vu un bon film.
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: Cinéma
    gloss: cinéma
    note: سینما signifie « cinéma ».
    example_gloss: Hier, je suis allé(e) au cinéma.
  fa.a1.unit13.lesson02.teach.be_word:
    title: À
    gloss: à / pour
    note: به signifie « à, vers » et s’emploie devant une destination.
    target_text: به (à)
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: Hier, je suis allé(e) au cinéma.
    gloss: Hier, je suis allé(e) au cinéma.
    note: دیروز به سینما رفتم réunit les mots de cette leçon en une phrase complète.
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: Quoi (activité)
    gloss: quoi (activité)
    note: چیکار (quel travail, quelle activité) sert à demander ce que quelqu’un a fait.
    example_gloss: Qu’est-ce que tu as fait hier ?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: Tu as fait
    gloss: tu as fait
    note: کردی est le passé simple de کردن (faire), deuxième personne familière.
    example_gloss: Qu’est-ce que tu as fait ?
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: Qu’est-ce que tu as fait hier ?
    gloss: Qu’avez-vous fait hier ?
    note: دیروز چیکار کردی؟ est une façon familière courante de demander ce que quelqu’un a fait hier.
  fa.a1.unit13.lesson04.teach.film_word:
    title: Film
    gloss: film
    note: فیلم signifie « film ».
    example_gloss: J’ai vu un bon film.
  fa.a1.unit13.lesson04.teach.khoob_word:
    title: Bon
    gloss: bon
    note: خوب signifie « bon ».
    example_gloss: Le film était bien.
  fa.a1.unit13.lesson04.teach.recent_event_text:
    title: Exemple de texte sur un événement récent
    gloss: Hier, je suis allé(e) au cinéma. J’ai vu un bon film. Ensuite, j’ai déjeuné.
    note: Un court récit à la première personne qui réunit le vocabulaire du passé de cette unité.
  fa.a1.unit13.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  fa.a1.unit13.lesson05.teach.ketab_word:
    title: Livre
    gloss: livre
    note: کتاب signifie « livre ».
    example_gloss: J’ai lu un livre.
  fa.a1.unit13.lesson05.teach.khoondam_word:
    title: Je lis
    gloss: je lis
    note: خوندم est le passé simple familier de خواندن (lire), à la première personne.
    example_gloss: Hier, j’ai lu un livre.
  fa.a1.unit13.lesson06.teach.man_word:
    title: je
    gloss: je
    note: من est le pronom personnel de la première personne, employé ici pour insister (من خونه موندم -- moi, je suis resté(e) à la maison).
    example_gloss: Je suis resté(e) à la maison.
  fa.a1.unit13.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: نیما et سارا sont les deux interlocuteurs du dialogue de cette leçon.
    example_gloss:
    - Nima est resté à la maison et a lu un livre.
    - Sara est allée au cinéma hier.
  fa.a1.unit13.lesson06.teach.khooneh_moondam_word:
    title: Je suis resté(e) à la maison
    gloss: je suis resté(e) à la maison
    note: خونه موندم signifie « je suis resté(e) à la maison », avec خونه (maison), forme familière.
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: Et toi ?
    gloss: Et toi ?
    note: 'تو چی؟ demande littéralement « toi, quoi ? » : une façon naturelle de renvoyer la question.'
  fa.a1.unit13.lesson06.teach.alie_word:
    title: Super
    gloss: super
    note: عالیه suit le schéma de contraction en -e déjà vu (عالی است -> عالیه).
    example_gloss: Super, c’était comment ?
  fa.a1.unit13.lesson06.teach.dialogue_line1:
    title: Qu’est-ce que tu as fait hier ?
    gloss: Qu’avez-vous fait hier ?
    note: Nima commence par demander à Sara ce qu’elle a fait hier.
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: Je suis allée au cinéma et j’ai vu un bon film. Et toi ?
    gloss: Je suis allée au cinéma et j’ai vu un bon film. Et toi ?
    note: Sara répond et renvoie la question.
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: Je suis resté à la maison et j’ai lu un livre.
    gloss: Je suis resté à la maison et j’ai lu un livre.
    note: Nima décrit sa propre journée.
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: Super !
    gloss: Super !
    note: Sara réagit positivement pour conclure l’échange.
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: Il/elle est allé(e), a vu, a fait, est resté(e), a lu (troisième personne)
    gloss: il/elle est allé(e), a vu, a fait, est resté(e), a lu (3ᵉ personne)
    note: رفت، دید، کرد، موند، خوند sont les formes du passé simple à la 3ᵉ personne ; elles servent à comparer ce que Sara et Nima ont fait chacun.
    target_text: رفت، دید، کرد، موند، خوند (il/elle est allé(e), a vu, a fait, est resté(e), a lu -- 3e personne)
