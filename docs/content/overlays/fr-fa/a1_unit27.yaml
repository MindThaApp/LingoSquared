course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer des sports (football, basket-ball, volley-ball, natation), demander « Quel sport aimes-tu ? », dire où l’on pratique un sport (salle de sport, piscine, parc), parler de la fréquence (tous les jours, toutes les semaines, parfois, N fois), un court texte sur la routine sportive de نیما, et un dialogue final entre نیما et سارا qui comparent les sports qu’ils pratiquent, à quelle fréquence et où.'
