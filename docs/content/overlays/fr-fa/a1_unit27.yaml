teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: je
    gloss: je
    note: '*من*, déjà bien connu, revient ici pour parler de son propre sport.'
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: Sport
    gloss: sport
    note: '*ورزش* est le mot général pour « sport » ou « exercice physique » et sert de fil conducteur à toute cette unité.'
    example_gloss: Le sport, c’est bien.
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: Je fais
    gloss: je fais
    note: '*می‌کنم* est le verbe « faire » ; il sert dans toute cette unité pour dire qu’on pratique un sport.'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: Le football
    gloss: football
    note: '*فوتبال* revient ici comme premier sport nommé de l’unité.'
    example_gloss: Le football est un sport.
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: Je joue au football
    gloss: je joue au football
    note: '*فوتبال بازی می‌کنم* veut dire « je joue au football » ; *بازی* signifie « jeu » ou « jouer ».'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: Basket-ball
    gloss: basket-ball
    note: '*بسکتبال* est un emprunt direct et courant pour « basket-ball ».'
    example_gloss: J’aime le basket-ball.
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: Je joue au basket-ball
    gloss: je joue au basket-ball
    note: '*بسکتبال بازی می‌کنم* suit exactement le même schéma que *فوتبال بازی می‌کنم* : il suffit de changer de sport.'
  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: Le volley-ball
    gloss: volley-ball
    note: '*والیبال* est un emprunt direct et courant pour « volley-ball ».'
    example_gloss: Il/Elle aime le volley-ball.
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: Je joue au volley-ball
    gloss: je joue au volley-ball
    note: '*والیبال بازی می‌کنم* suit le même schéma *بازی می‌کنم* que pour le football et le basket-ball.'
  fa.a1.unit27.lesson02.teach.shena_word:
    title: La natation
    gloss: natation
    note: '*شنا* veut dire « natation » ; contrairement au football, au basket-ball et au volley-ball, il s’emploie directement avec *می‌کنم* et non avec *بازی می‌کنم*, car ce n’est pas un sport de balle.'
    example_gloss: J’aime la natation.
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: Je nage
    gloss: je nage
    note: '*شنا می‌کنم* veut dire « je nage », littéralement « je fais de la natation ».'
  fa.a1.unit27.lesson02.teach.che_review:
    title: Quoi / Quel
    gloss: quel / quoi
    note: '*چه* est employé ici dans un nouveau type de question.'
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: Tu aimes
    gloss: tu aimes
    note: '*دوست داری* revient ici pour poser des questions sur les sports.'
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: Quel sport aimes-tu ?
    gloss: quel sport aimes-tu ?
    note: '*چه ورزشی دوست داری؟* combine *چه* + *ورزش* + la terminaison *-ی* (qui donne « quel sport ») avec *دوست داری* : c’est la façon naturelle de demander à quelqu’un quel sport il aime.'
  fa.a1.unit27.lesson03.teach.koja_review:
    title: Où
    gloss: où
    note: '*کجا* fonctionne ici de la même façon pour demander où l’on pratique un sport.'
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: Où fais-tu du sport ?
    gloss: où fais-tu du sport ?
    note: '*کجا ورزش می‌کنی؟* combine *کجا* avec *ورزش* et la forme de la 2ᵉ personne de *می‌کنم*.'
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: je vais
    gloss: je vais
    note: '*می‌رم* revient ici pour parler d’aller dans un lieu de sport.'
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: La salle de sport
    gloss: salle de sport
    note: '*باشگاه* veut dire « salle de sport » ou « club ». Comme dans *می‌رم سینما* (unité 24), aucune préposition n’est nécessaire : *می‌رم* + le lieu.'
    example_gloss: Je vais à la salle de sport.
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: Piscine
    gloss: piscine
    note: '*استخر* veut dire « piscine ».'
    example_gloss: Je vais à la piscine et je nage.
  fa.a1.unit27.lesson03.teach.park_word:
    title: Parc
    gloss: parc
    note: '*پارک* est un emprunt direct pour « parc ».'
    example_gloss: Je vais au parc et je joue au football.
  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: Chaque jour
    gloss: chaque jour
    note: '*هر روز* revient ici pour la fréquence de la pratique sportive.'
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: Chaque semaine
    gloss: chaque semaine
    note: '*هر هفته* revient ici.'
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: Parfois
    gloss: parfois
    note: '*گاهی* revient ici.'
  fa.a1.unit27.lesson04.teach.baar_word:
    title: Fois
    gloss: fois
    note: '*بار* est un mot de comptage pour « fois » ; il s’emploie avec un nombre pour dire à quelle fréquence.'
    example_gloss: Je fais du sport une fois.
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: Deux / trois
    gloss: deux / trois
    note: '*دو* et *سه* servent ici à compter le nombre de fois.'
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: Deux fois
    gloss: deux fois
    note: '*دو بار* combine *دو* (deux) avec *بار* : « deux fois ».'
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
    title: Trois fois
    gloss: trois fois
    note: '*سه بار* combine *سه* (trois) avec *بار* : « trois fois ».'
  fa.a1.unit27.lesson04.teach.har_hafte_do_baar_phrase:
    title: Je fais du sport deux fois par semaine
    gloss: je fais du sport deux fois par semaine
    note: '*هر هفته دو بار ورزش می‌کنم* rassemble tout ce qu’on a vu dans cette leçon : « chaque semaine », « deux fois » et « je fais du sport ».'
  fa.a1.unit27.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personnage présenté dès l’unité 11, revient ici.'
    example_gloss: Nima aime le sport.
  fa.a1.unit27.lesson05.teach.dare_review:
    title: Il/Elle a / aime
    gloss: il/elle a / aime
    note: '*داره* est la forme de la 3ᵉ personne (il/elle) ; dans *ورزش دوست داره*, cela veut dire « il/elle aime le sport ».'
  fa.a1.unit27.lesson05.teach.mikone_review:
    title: Il/elle fait
    gloss: il/elle fait
    note: '*می‌کنه*, déjà aperçu dans le texte de l’unité 24, est la forme familière de la 3ᵉ personne de *می‌کنم*.'
  fa.a1.unit27.lesson05.teach.mire_word:
    title: Il/Elle va
    gloss: il/elle va
    note: '*می‌ره* est la forme familière de la 3ᵉ personne du même verbe que *می‌رم* (je vais) de la leçon 3.'
  fa.a1.unit27.lesson05.teach.ham_review:
    title: Aussi
    gloss: aussi
    note: '*هم* veut dire « aussi ».'
  fa.a1.unit27.lesson05.teach.va_review:
    title: Et
    gloss: et
    note: '*و* veut dire « et » ; on l’a déjà employé ainsi dans les unités 5, 14, 24, 25 et 26.'
  fa.a1.unit27.lesson05.teach.reading_text:
    title: 'Lecture : les sports de Nima'
    gloss: Nima aime le sport. Chaque semaine, il joue trois fois au football. Parfois, il va aussi à la piscine et il nage.
    note: 'Ce texte reprend toutes les constructions des leçons 1 à 4, plus *می‌ره* de la leçon 5 : presque aucun mot nouveau, il s’agit surtout de les reconnaître dans un texte suivi.'
  fa.a1.unit27.lesson06.teach.dam_review:
    title: J’ai / J’aime
    gloss: j’ai / j’aime
    note: '*دارم* revient ici.'
  fa.a1.unit27.lesson06.teach.are_review:
    title: Ouais
    gloss: ouais
    note: '*آره* est le mot familier courant pour « oui ».'
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: Et toi ?
    gloss: et toi ?
    note: '*تو چی؟* revient ici pour renvoyer la question. *تو* seul est le « tu » familier.'
  fa.a1.unit27.lesson06.teach.chekhoob_review:
    title: Quelle bonne nouvelle !
    gloss: quelle bonne nouvelle !
    note: '*چه خوب!* est ici aussi une réaction naturelle.'
  fa.a1.unit27.lesson06.teach.miri_word:
    title: Tu vas
    gloss: tu vas
    note: '*می‌ری* est la forme familière de la 2ᵉ personne du même verbe que *می‌رم* (je vais) de la leçon 3 et *می‌ره* (il/elle va) de la leçon 5.'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: Super / Excellent
    gloss: super / excellent
    note: '*عالیه* est une façon familière courante de dire « super » ou « excellent ».'
    example_gloss: Cette salle de sport est super.
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: 'Nima : quel sport aimes-tu ?'
    gloss: Quel sport aimes-tu ?
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: 'Sara : J’aime la natation. Je vais à la piscine trois fois par semaine. Et toi ?'
    gloss: J’aime la natation. Je vais à la piscine trois fois par semaine. Et toi ?
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: 'Nima : J’aime le football. Je vais au parc et je joue tous les jours.'
    gloss: J’aime le football. Je vais au parc et je joue tous les jours.
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: 'Sara : Super ! Tu vas aussi à la salle de sport ?'
    gloss: Super ! Tu vas aussi à la salle de sport ?
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: 'Nima : Oui, parfois je vais aussi à la salle de sport.'
    gloss: Oui, parfois je vais aussi à la salle de sport.
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: 'Sara : Génial !'
    gloss: Super !
