teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: 'Révision : l’aide'
    gloss: aide
    note: '*کمک* (« aide ») a déjà été vu.'
  fa.a1.unit39.lesson01.teach.lazame:
    title: Nécessaire
    gloss: il faut
    note: '*لازمه* est un mot unique qui signifie « il faut », « est nécessaire » ; il est construit comme *قشنگه* (« est joli ») et *گرمه* (« est chaud »).'
    example_gloss: Il faut de l’aide !
  fa.a1.unit39.lesson01.teach.polis:
    title: Police
    gloss: police
    note: '*پلیس* signifie « police » ; c’est un emprunt utilisé dans la langue de tous les jours.'
    example_gloss: Il faut la police !
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulance
    gloss: ambulance
    note: '*آمبولانس* signifie « ambulance ».'
    example_gloss: Il faut une ambulance !
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: Pompiers
    gloss: pompiers
    note: '*آتش‌نشانی* signifie « pompiers » ou « caserne de pompiers ».'
    example_gloss: Il faut les pompiers !
  fa.a1.unit39.lesson02.teach.atash:
    title: Feu
    gloss: feu
    note: '*آتش* signifie « feu » ; c’est la racine de *آتش‌نشانی* (« pompiers »).'
    example_gloss: Au feu ! Il faut les pompiers !
  fa.a1.unit39.lesson02.teach.khatar:
    title: Danger
    gloss: danger
    note: '*خطر* signifie « danger ».'
    example_gloss: Danger ! Il faut la police !
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Révision : ordres formels et informels'
    gloss: fais ! (formel) / fais ! (informel)
    note: '*کنید* est la terminaison de l’impératif de politesse ou du pluriel. Le *کن* familier, que tu as utilisé avec des amis dans *استراحت کن* (« repose-toi ! »), s’emploie avec une seule personne que l’on connaît bien.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: Au secours !
    gloss: Au secours !
    note: '*کمک کنید!* est la façon polie d’appeler à l’aide, adaptée aux inconnus et aux secours.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Accident
    gloss: accident
    note: '*تصادف* signifie « accident ».'
    example_gloss: Accident ! Au secours !
  fa.a1.unit39.lesson03.teach.orjans:
    title: Urgence
    gloss: urgence
    note: '*اورژانس* signifie « urgence » ; c’est le même mot que pour les urgences d’un hôpital.'
    example_gloss: C’est une urgence ! Au secours !
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'Révision : allô / d’accord / merci'
    gloss: allô / d’accord / merci
    note: '*الو*, *باشه* et *ممنون* ont déjà été vus.'
  fa.a1.unit39.lesson04.teach.review_miad:
    title: Vient
    gloss: vient
    note: '*میاد* (« il/elle vient ») suit le même schéma de terminaisons personnelles que *میام* (« je viens »), que tu as appris plus tôt.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: Venez vite !
    gloss: Venez vite !
    note: '*زود* signifie « vite » ; *بیایید* est l’impératif poli « venez ! »'
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: Appelez !
    gloss: Appelez !
    note: '*زنگ بزنید!* est l’impératif poli de *زنگ زدن* (« appeler »), que tu as appris plus tôt.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Nima : Allô ! Au secours ! Il faut la police !'
    gloss: Allô ! Au secours ! Il faut la police !
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Sara : D’accord. La police arrive.'
    gloss: D’accord. La police arrive.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Nima : Merci ! Venez vite !'
    gloss: Merci ! Venez vite !
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Sara : D’accord !'
    gloss: D’accord !
  fa.a1.unit39.lesson05.teach.reading_note:
    title: À propos de cet avis
    gloss: Accident / danger / feu
    note: Dans l’avis, chaque type d’urgence est suivi d’un point d’interrogation, comme pour demander « En cas d’accident ? ». Le service à appeler vient juste après.
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'Lecture : avis d’urgence'
    gloss: Accident ? Il faut une ambulance ! Danger ? Il faut la police ! Feu ? Il faut les pompiers ! Appelez vite !
    note: Un court avis indiquant quel service appeler pour chaque type d’urgence.
  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: Il faut la police ! Au secours !
    gloss: Il faut la police ! Au secours !
    note: Une phrase de révision composée uniquement de mots de cette unité.
