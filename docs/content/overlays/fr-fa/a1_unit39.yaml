course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer les trois services d’urgence (police, ambulance, pompiers), dire ce qui est nécessaire, demander de l’aide avec des impératifs polis, un dialogue pour passer un appel d’urgence et la lecture d’un court avis d’urgence.'
