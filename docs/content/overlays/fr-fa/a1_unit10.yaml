teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Samedi, dimanche
    gloss: Samedi, dimanche
    note: شنبه et یکشنبه sont les deux premiers jours de la semaine iranienne, qui commence le samedi.
    example_gloss:
    - Aujourd'hui, c'est samedi.
    - Demain, c’est dimanche.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Lundi, mardi
    gloss: lundi, mardi
    note: دوشنبه et سه‌شنبه suivent شنبه et یکشنبه.
    example_gloss:
    - J’ai cours le lundi.
    - J’ai un rendez-vous mardi.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mercredi, jeudi
    gloss: mercredi, jeudi
    note: چهارشنبه et پنجشنبه sont les jours du milieu et de la fin de la semaine.
    example_gloss:
    - Je travaille le mercredi.
    - On se voit jeudi.
  fa.a1.unit10.lesson01.teach.jome:
    title: vendredi
    gloss: vendredi
    note: جمعه est le dernier jour de la semaine et le jour de repos hebdomadaire traditionnel en Iran.
    example_gloss: Le vendredi est un jour de congé.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Le jour de repos hebdomadaire
    gloss: Le vendredi est le jour de repos de la semaine.
    note: جمعه (vendredi) est le jour de repos hebdomadaire traditionnel en Iran, même si certains lieux de travail modernes ferment aussi le jeudi après-midi.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (1er mois)
    gloss: Farvardin, le premier mois de l’année solaire iranienne
    note: فروردین ouvre l’année solaire iranienne, vers la fin mars (autour de l’équinoxe de printemps et de Norouz).
    example_gloss: Farvardin est le premier mois de l’année.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (2e mois)
    gloss: Ordibehesht, le deuxième mois
    note: اردیبهشت suit فروردین, environ avril-mai.
    example_gloss: Il fait beau en Ordibehesht.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (3e mois)
    gloss: Khordad, le troisième mois
    note: خرداد suit اردیبهشت, environ mai-juin.
    example_gloss: Je suis né(e) en Khordad.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Le calendrier solaire iranien
    gloss: L’Iran utilise le calendrier hégirien solaire (persan).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* indique que l’Iran utilise ce calendrier pour les dates de la vie courante — le même système que l’Afghanistan, mais avec des noms de mois d’origine persane plutôt que les noms d’origine arabe utilisés en Afghanistan.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Quel jour sommes-nous ?
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: امروز چندشنبه‌ست؟ demande littéralement « aujourd’hui, quel jour de la semaine est-ce ? ». C’est la contraction familière en -e de چندشنبه است.
  fa.a1.unit10.lesson03.teach.today_word:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: امروز signifie « aujourd’hui ».
    example_gloss: Quelle est la date aujourd’hui ?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Aujourd’hui, c’est jeudi 10 Ordibehesht.
    gloss: Aujourd’hui, c’est jeudi 10 Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته réunit le nom du jour, la date en ordinal et le nom du mois dans une seule phrase, avec la contraction familière en -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Date
    gloss: date
    note: '*تاریخ* signifie « date » — le mot général pour une date du calendrier, comme dans *تاریخ جلسه* (la date de la réunion).'
    example_gloss: Quelle est la date d’aujourd’hui ?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: Quel jour est la réunion ?
    gloss: Quel jour a lieu la réunion ?
    note: جلسه کدوم روزه؟ demande quel jour de la semaine aura lieu un événement.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Quelle est la date de mardi en Ordibehesht ?
    gloss: Quelle est la date de mardi en Ordibehesht ?
    note: سه‌شنبه چندم اردیبهشته؟ demande la date chiffrée d’un jour précis.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8e
    gloss: 8e
    note: '*هشتم* signifie « le 8 » (du mois).'
    example_gloss: Aujourd’hui, on est le 8.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, quel jour est la réunion ?
    gloss: Reza, quel jour est la réunion ?
    note: Maryam commence par poser la question directement à Reza, en utilisant son prénom.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Je crois que c’est mardi.
    gloss: Je crois que c’est mardi.
    note: 'فکر کنم (je crois) nuance la réponse de Reza : il n’en est pas tout à fait sûr.'
  fa.a1.unit10.lesson06.teach.turn03:
    title: Quelle est la date de mardi en Ordibehesht ?
    gloss: Quelle est la date de mardi en Ordibehesht ?
    note: Maryam enchaîne en demandant la date chiffrée précise.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Mardi, c’est le 8 Ordibehesht.
    gloss: Mardi, c’est le 8 Ordibehesht.
    note: Reza donne la date précise.
  fa.a1.unit10.lesson06.teach.turn05:
    title: D’accord, très bien. Et vendredi, tu es libre ?
    gloss: D’accord, très bien. Et vendredi, tu es libre ?
    note: Maryam confirme la date, puis propose un autre jour.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Non, vendredi je suis occupé.
    gloss: Non, vendredi je suis occupé.
    note: سرم شلوغه (littéralement « ma tête est occupée / chargée ») est la manière familière et naturelle de dire en persan d’Iran qu’on est occupé.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Pas de problème, on se voit mardi.
    gloss: Pas de problème, on se voit mardi.
    note: 'مشکلی نیست (pas de problème) accepte poliment le refus de Reza, et می‌بینمت signifie « je te verrai » : mardi est donc confirmé comme jour de la réunion, comme dans les répliques précédentes.'
  fa.a1.unit10.lesson06.teach.va_and:
    title: Et
    gloss: et
    note: '*و* signifie « et ». Il peut relier deux jours, comme dans *دوشنبه و سه‌شنبه*, ou deux questions liées, comme dans *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: J’ai cours le lundi et le mardi.
