    title: 'Lecture : les quatre saisons en Iran'
    gloss: 'En Iran, nous avons quatre saisons : le printemps, l’été, l’automne et l’hiver. Le printemps est joli. L’été est chaud. L’automne est pluvieux. L’hiver est froid et neigeux.'
