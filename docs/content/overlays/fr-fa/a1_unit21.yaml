teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: L’argent
    gloss: l’argent
    note: پول est le mot général pour dire « argent ».
    example_gloss: Où est mon argent ?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Banque
    gloss: banque
    note: بانک est le mot général pour dire « banque ».
    example_gloss: La banque est tout près.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dollar
    gloss: dollar
    note: دلار désigne le dollar (américain), la devise étrangère la plus courante dans les conversations de change au quotidien.
    example_gloss: J’ai des dollars.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Change
    gloss: change
    note: 'تبدیل signifie « échange / conversion » ; on l’emploie avec کردن (faire) : تبدیل کردن.'
    example_gloss: Je veux changer (de l’argent).
  fa.a1.unit21.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant (« et »), déjà vu dans les unités précédentes.
    target_text: و (et)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Dire que tu veux changer de l’argent
    gloss: Je veux changer des dollars en tomans.
    note: Dans می‌خوام دلار به تومن تبدیل کنم, به (« à, en ») introduit la devise obtenue.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Demander combien de dollars
    gloss: Combien de dollars avez-vous ?
    note: '*چقدر دلار دارید؟* utilise *چقدر* (combien), un mot que tu as déjà vu dans des questions de quantité précédentes.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Distributeur
    gloss: distributeur de billets
    note: خودپرداز signifie littéralement « qui paie lui-même » ; c’est le mot courant pour désigner un distributeur automatique de billets.
    example_gloss: Le distributeur est là-bas.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Dire que tu veux retirer de l’argent
    gloss: Je veux retirer de l’argent au distributeur.
    note: Dans می‌خوام از خودپرداز پول بردارم, on trouve از (« de, à partir de ») et بردارم (« je retire / je prends »).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Demander de la monnaie
    gloss: Avez-vous de la monnaie ?
    note: Dans پول خرد دارید؟, خرد (« petit, menu ») suit پول (« argent »).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Voici (révision)
    gloss: voici / je vous en prie
    note: '*بفرمایید* a été introduit dans une unité précédente ; ici, on l’emploie en tendant quelque chose à quelqu’un.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Taux
    gloss: taux
    note: نرخ désigne le taux (de change).
    example_gloss: Quel est le taux aujourd’hui ?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Annoncer le taux par dollar
    gloss: Chaque dollar vaut 30 tomans.
    note: هر دلار سی تومنه utilise هر (chaque) et la contraction familière en -e (*تومنه* = *تومن است*) que tu connais déjà.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Cent
    gloss: cent
    note: صد est le nombre 100.
    example_gloss: J’ai cent dollars.
  fa.a1.unit21.lesson06.teach.please_do:
    title: S’il vous plaît, faites-le
    gloss: changez-le, s’il vous plaît
    note: لطفاً تبدیل کنید est l’impératif de politesse de تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara demande à changer de l’argent
    gloss: Sara salue l’employé et dit qu’elle veut changer des dollars en tomans.
    note: Reprend می‌خوام دلار به تومن تبدیل کنم de la leçon 2.
  fa.a1.unit21.lesson06.teach.turn02:
    title: L’employé demande combien de dollars
    gloss: L’employé salue Sara et lui demande combien de dollars elle a.
    note: Reprend چقدر دلار دارید؟ de la leçon 2.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara donne le montant et demande le taux
    gloss: Sara dit qu’elle a cent dollars et demande le taux du jour.
    note: صد (cent) est nouveau ; نرخ امروز چنده؟ reprend la question sur le taux de la leçon 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: L’employé annonce le taux
    gloss: L’employé dit que chaque dollar vaut 30 tomans.
    note: Reprend هر دلار سی تومنه de la leçon 5.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara accepte et demande à l’employé de procéder
    gloss: Sara accepte et demande à l’employé de faire le change, s’il vous plaît.
    note: لطفاً تبدیل کنید, vu plus tôt dans cette leçon.
  fa.a1.unit21.lesson06.teach.turn06:
    title: L’employé donne la somme totale
    gloss: Voici, trois mille tomans.
    note: '*سه هزار تومن* = 100 dollars × 30 tomans le dollar. *هزار* (mille) est révisé depuis l’unité sur les nombres.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara remercie l’employé et demande aussi de la monnaie
    gloss: Merci. Avez-vous aussi de la monnaie ?
    note: Reprend پول خرد دارید؟ de la leçon 4 avec هم (« aussi »).
  fa.a1.unit21.lesson06.teach.turn08:
    title: L’employé confirme et tend l’argent
    gloss: Oui, voici.
    note: بله (oui) est un mot déjà vu ; بفرمایید conclut l’échange.
