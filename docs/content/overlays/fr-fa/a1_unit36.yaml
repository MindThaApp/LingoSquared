course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : décrire les traits de caractère de base d’une personne, demander comment est quelqu’un, et un dialogue sur le caractère d’un ami commun.'
units:
  fa.a1.unit36.personality:
    title: Le caractère
lessons:
  fa.a1.unit36.lesson01.personality_words_one:
    title: Mots de personnalité 1
  fa.a1.unit36.lesson02.personality_words_two:
    title: Mots de personnalité 2
  fa.a1.unit36.lesson03.asking_about_personality:
    title: Demander comment est quelqu’un
  fa.a1.unit36.lesson04.personality_dialogue:
    title: 'Dialogue : Comment est Maryam ?'
  fa.a1.unit36.lesson05.reading_personality:
    title: Lecture sur le caractère
  fa.a1.unit36.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Sympathique
    gloss: gentil / aimable
    note: '*مهربون* décrit quelqu’un de gentil, au grand cœur.'
    example_gloss: Sara est très gentille.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Drôle
    gloss: drôle
    note: '*بامزه* décrit quelqu’un de drôle ou d’amusant.'
    example_gloss: Nima est drôle.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Timide
    gloss: timide
    note: '*خجالتی* décrit quelqu’un de timide.'
    example_gloss: Il/Elle est un peu timide.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Sérieux
    gloss: sérieux
    note: '*جدی* décrit une personne sérieuse.'
    example_gloss: Notre professeur est sérieux.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Comment le « est » contracté se fixe aux mots de personnalité
    gloss: il/elle est gentil(le) / drôle / timide (copule contractée)
    note: '*مهربونه* fusionne directement *مهربون* + *است*, car *مهربون* se termine par une consonne. *بامزه‌ست* s’écrit avec un ZWNJ avant *ست*, car *بامزه* se termine déjà par la voyelle *ه*. *خجالتیه* ajoute *ه* directement à un mot en *ی*, comme *قهوه‌ایه* dans l’unité sur l’apparence.'
    target_text: مهربونه = مهربون + است (« est » fusionné, après une consonne) / بامزه‌ست = بامزه + است (après une voyelle, avec ZWNJ) / خجالتیه = خجالتی + ه (après ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Intelligent
    gloss: intelligent / malin
    note: '*زرنگ* décrit quelqu’un de malin, d’intelligent, surtout débrouillard.'
    example_gloss: Maryam est très maligne.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Paresseux
    gloss: paresseux
    note: '*تنبل* décrit une personne paresseuse.'
    example_gloss: Aujourd’hui, je suis un peu paresseux/paresseuse.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Travailleur
    gloss: travailleur
    note: '*زحمت‌کش* décrit quelqu’un qui travaille dur et fournit de vrais efforts.'
    example_gloss: Mon père travaille très dur.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Patient
    gloss: patient
    note: '*صبور* décrit une personne patiente.'
    example_gloss: Notre professeur est très patient.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Nier un trait de caractère
    gloss: il/elle n’est pas paresseux/paresseuse
    note: '*نیست* nie la copule contractée : *تنبل نیست* signifie « il/elle n’est pas paresseux(se) », avec le même *نیست* que celui déjà vu pour nier les sentiments.'
    target_text: تنبل نیست (il/elle n’est pas paresseux/paresseuse) -- نیست nie la copule fusionnée
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Le caractère
    gloss: personnalité
    note: '*شخصیت* signifie « personnalité » ou « caractère ».'
    example_gloss: Sa personnalité est très bien.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Comment est sa personnalité ?
    gloss: Comment est sa personnalité ?
    note: '*چطوره؟* (« comment est… ? ») a déjà été vu dans l’unité sur les salutations ; *ش* est le suffixe possessif « son/sa », attaché à *شخصیت* (« personnalité »).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: Il/Elle est très gentil(le) et intelligent(e)
    gloss: Il/Elle est très gentil(le) et intelligent(e)
    note: '*و* signifie « et » et relie ici deux mots de personnalité.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Il/Elle est comment ?
    gloss: Il/Elle est comment ?
    note: '*چه جوریه؟* est une façon familière courante de demander « comment est-il/elle ? », une variante de *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Personnalité / comment est… ? / comment est-il/elle ?
    gloss: personnalité / comment est... ? / il/elle est comment ?
    note: Ces trois expressions te permettent de demander et de dire comment est quelqu’un.
    target_text: شخصیت (personnalité) / چطوره؟ (comment est… ?) / چه جوریه؟ (il/elle est comment ?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / pas du tout / seulement / sympa
    gloss: Nima / Sara / Maryam / pas du tout / seulement / sympa
    note: '*مریم* est l’amie de *سارا*, déjà présentée dans l’unité sur l’apparence. *اصلاً* signifie « pas du tout ». *فقط* signifie « seulement ». *باحال* signifie « sympa / cool ».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: J’aimerais mieux la connaître
    gloss: J’aimerais mieux la connaître
    note: '*بیشتر* signifie « plus ». *باهاش* signifie « avec lui/elle ». *آشنا بشم* signifie « que je fasse sa connaissance ».'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima : Sara, comment est Maryam ?'
    gloss: Sara, comment est Maryam ?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara : Elle est très gentille et intelligente.'
    gloss: Elle est très gentille et intelligente.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima : Elle n’est pas paresseuse ?'
    gloss: Elle n’est pas paresseuse ?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara : Non, pas du tout, elle travaille même très dur. Elle est juste un peu timide.'
    gloss: Non, pas du tout, elle travaille même très dur. Elle est juste un peu timide.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima : Elle a l’air sympa, j’aimerais mieux la connaître.'
    gloss: Elle a l’air sympa, j’aimerais mieux la connaître.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lecture : la personnalité de Maryam'
    gloss: Maryam est l’amie de Sara. Elle est très gentille et intelligente. Elle travaille aussi dur dans son travail et n’est jamais paresseuse. Elle est juste un peu timide, c’est pourquoi elle ne parle pas beaucoup dans les grands groupes.
    note: Le texte décrit la personnalité de Maryam à la troisième personne, avec les mêmes traits que dans le dialogue.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Jamais (avec un verbe négatif)
    gloss: jamais
    note: Comme « ne… jamais » en français, *هیچ‌وقت* s’emploie avec un verbe à la forme négative (*نیست*, *نمی‌زنه*) pour dire « jamais ».
  fa.a1.unit36.lesson06.teach.self_description:
    title: Je pense que je travaille très dur, mais je suis aussi un peu paresseux/paresseuse
    gloss: Je pense que je travaille très dur, mais je suis aussi un peu paresseux/paresseuse
    note: '*فکر می‌کنم* signifie « je pense ». *زحمت‌کشم* fusionne *زحمت‌کش* + *هستم* (« je suis »). *هستم* est la forme complète, non contractée, de « je suis » ; elle est employée ici après *هم* (« aussi ») pour insister.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Comment est ta personnalité ?
    gloss: Comment est ta personnalité ?
    note: '*شخصیتت* ajoute à *شخصیت* le suffixe possessif familier *ت* (« ton/ta »), la version en registre *تو* de *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Gentil / drôle / timide / sérieux / intelligent / paresseux / travailleur / patient
    gloss: gentil / drôle / timide / sérieux / intelligent / paresseux / travailleur / patient
    note: Ce sont les huit mots de personnalité essentiels de cette unité.
