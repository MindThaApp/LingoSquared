course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : vocabulaire de base des pièces, décrire un logement avec des nombres, objets de la maison, situer les choses dans la maison, lire une courte description de logement, et dialogue sur le logement de quelqu’un.'
units:
  fa.a1.unit19.housing:
    title: Le logement
    description: 'Décrire une maison simple : pièces, objets et emplacement.'
lessons:
  fa.a1.unit19.lesson01.basic_room_vocab:
    title: Vocabulaire de base des pièces
  fa.a1.unit19.lesson02.describing_with_numbers:
    title: Décrire un logement avec des nombres
  fa.a1.unit19.lesson03.household_objects:
    title: Objets de la maison
  fa.a1.unit19.lesson04.location_in_home:
