  fa.a1.unit19.lesson05.reading_a_housing_description:
    title: Lire une description de logement
  fa.a1.unit19.lesson06.housing_dialogue:
    title: Un dialogue sur une maison
teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Maison
    gloss: maison
    note: خونه signifie maison, chez-soi (forme familière de خانه).
    example_gloss: Ma maison est grande.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Chambre
    gloss: chambre
    note: 'اتاق خواب signifie littéralement « pièce de sommeil » : la chambre.'
    example_gloss: Elle a deux chambres.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Cuisine
    gloss: cuisine
    note: آشپزخانه signifie cuisine.
    example_gloss: La cuisine est grande.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Salle de bain
    gloss: salle de bains
    note: حموم signifie salle de bain (forme familière de حمام).
    example_gloss: La salle de bains est propre.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Combien
    gloss: combien
    note: چند تا signifie combien, et s’emploie avec des noms dénombrables.
    target_text: چند تا (combien de)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Deux
    gloss: deux
    note: دو تا signifie deux (de quelque chose de dénombrable).
    example_gloss: Elle a deux salles de bain.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Il/elle a
    gloss: il/elle a
    note: داره est la contraction familière de دارد (il/elle a), utilisée pour décrire ce que contient une maison.
    target_text: داره (il/elle a, familier)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Lit
    gloss: lit
    note: تخت signifie lit.
    example_gloss: Le lit est dans la chambre.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Table
    gloss: table
    note: میز signifie table.
    example_gloss: La table est à côté de la fenêtre.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Chaise
    gloss: chaise
    note: صندلی signifie chaise.
    example_gloss: Il y a une chaise à côté de la table.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Un / une
    gloss: un / une / un seul
    note: یه est la contraction familière de یک (un/une).
    target_text: یه (un/une, familier)
  fa.a1.unit19.lesson03.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  fa.a1.unit19.lesson04.teach.too_word:
    title: Dans / à l’intérieur
    gloss: dans
    note: تو signifie dans et indique un endroit à l’intérieur d’une pièce.
    target_text: تو (dans)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: À côté de
    gloss: à côté de
    note: کنار signifie à côté de.
    target_text: کنار (à côté de)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Au-dessus de / sur
    gloss: au-dessus de / sur
    note: بالای signifie au-dessus de / sur.
    target_text: بالای (au-dessus de, sur)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: C’est le lit
    gloss: c’est le lit
    note: '*تخته* est *تخت* (lit) plus le -e familier pour « est » (de *است*). Dans *میز کنار تخته*, le -e à la fin du groupe fait de lui une phrase : la table [est] à côté du lit.'
    target_text: تخته (c’est le lit, familier)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: C’est la cuisine
    gloss: c’est la cuisine
    note: '*آشپزخانه‌س* est *آشپزخانه* (cuisine) plus le « est » familier après une voyelle (de *است*). Dans *صندلی تو آشپزخانه‌س*, il termine la phrase : la chaise [est] dans la cuisine.'
    target_text: آشپزخانه‌س (c’est la cuisine, familier)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: Aussi
    gloss: aussi
    note: هم signifie aussi et se place après le mot qu’il complète.
    target_text: هم (aussi)
  fa.a1.unit19.lesson05.teach.man_word:
    title: je
    gloss: je
    note: من signifie je / moi.
    example_gloss: Ma maison a deux chambres.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: La maison de / ma maison
    gloss: la maison de / ma maison
    note: خونه‌ی est la forme avec ézafé de خونه, utilisée devant le possesseur (خونه‌ی من = ma maison).
    target_text: خونه‌ی (maison de / ma maison, forme avec ézafé)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Exemple de description de logement
    gloss: Ma maison a deux chambres. Elle a aussi une cuisine et une salle de bain.
    note: Une courte description à la première personne qui réunit le vocabulaire du logement de cette unité.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: Des prénoms iraniens courants, utilisés tout au long de ce cours.
    example_gloss:
    - La maison de Nima est grande.
    - La maison de Sara est petite.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: Comment est ta maison ?
    gloss: Comment est ta maison ?
    note: خونه‌ت چطوره؟ associe خونه‌ت (ta maison) et چطوره؟ (comment est-elle ?).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: C’est bien
    gloss: c’est bien
    note: خوبه est la contraction familière de خوب است (c’est bien).
    example_gloss: Cette maison est bien.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Ouais
    gloss: ouais
    note: آره est la forme familière de بله (oui).
    example_gloss: Ouais, c’est bien.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Nima demande
    gloss: Comment est ta maison ?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Sara répond
    gloss: Elle est bien. Elle a deux chambres et une cuisine.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Nima demande
    gloss: Elle a aussi une salle de bain ?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Sara répond
    gloss: Ouais, elle a aussi une salle de bain.
