teaching:
  fa.a1.unit12.lesson01.teach.barname_word:
    title: Projet
    gloss: projet
    note: برنامه signifie « projet » ou « programme ».
    example_gloss: Qu’est-ce que tu as de prévu ?
  fa.a1.unit12.lesson01.teach.sinama_word:
    title: Cinéma
    gloss: cinéma
    note: سینما signifie « cinéma ».
    example_gloss: On va au cinéma ?
  fa.a1.unit12.lesson01.teach.berim_word:
    title: Allons-y
    gloss: allons-y
    note: '*بریم* (allons) est la forme « nous allons » utilisée pour faire des suggestions.'
    example_gloss: Allons au cinéma.
  fa.a1.unit12.lesson01.teach.chetorast_word:
    title: Ça vous dit ?
    gloss: Ça te dit ? / Comment ça te semble ?
    note: چطوره؟ suit le modèle de contraction en -e déjà vu (چطور است -> چطوره).
    example_gloss: Et jeudi, ça te va ?
  fa.a1.unit12.lesson02.teach.mikhay_word:
    title: Tu veux
    gloss: tu veux
    note: می‌خوای (tu veux, familier) introduit une question de proposition.
    example_gloss: Tu veux aller au cinéma ?
  fa.a1.unit12.lesson02.teach.panjshanbe_review:
    title: Jeudi (révision)
    gloss: jeudi
    note: '*پنجشنبه* reprend le nom de jour vu dans l’unité 10.'
    example_gloss: Tu es libre jeudi ?
  fa.a1.unit12.lesson02.teach.propose_phrase:
    title: Tu veux aller au cinéma jeudi ?
    gloss: Tu veux aller au cinéma jeudi ?
    note: می‌خوای پنجشنبه بریم سینما؟ réunit les mots de cette leçon en une proposition complète.
  fa.a1.unit12.lesson03.teach.bashe_word:
    title: Ça va
    gloss: bien
    note: باشه signifie « d’accord », un mot d’accord courant et familier.
    example_gloss: D’accord, à jeudi.
  fa.a1.unit12.lesson03.teach.alie_word:
    title: Super
    gloss: super
    note: عالیه (super) suit le modèle de contraction en -e déjà vu (عالی است -> عالیه).
    example_gloss: Super, alors à bientôt.
  fa.a1.unit12.lesson03.teach.ghabule_word:
    title: C’est d’accord
    gloss: c’est d’accord
    note: قبوله (marché conclu) suit le modèle de contraction en -e déjà vu (قبول است -> قبوله).
    example_gloss: Marché conclu, à jeudi.
  fa.a1.unit12.lesson04.teach.motasefam_word:
    title: Je suis désolé
    gloss: je suis désolé
    note: متأسفم signifie « je suis désolé(e) ».
    example_gloss: Désolé(e), je ne peux pas venir.
  fa.a1.unit12.lesson04.teach.nemitoonam_word:
    title: Je ne peux pas
    gloss: je ne peux pas
    note: نمی‌تونم signifie « je ne peux pas » (forme familière de نمی‌توانم).
    example_gloss: Je ne peux pas venir, j’ai à faire.
  fa.a1.unit12.lesson04.teach.kar_daram_word:
    title: J’ai des choses à faire
    gloss: j’ai des choses à faire
    note: '*کار دارم* signifie littéralement « j’ai du travail / des choses à faire » ; c’est une excuse polie courante.'
  fa.a1.unit12.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » et sert à relier deux courtes expressions ou deux propositions.
    target_text: و (et)
  fa.a1.unit12.lesson05.teach.davat_word:
    title: Invitation
    gloss: invitation
    note: دعوت signifie « invitation ».
    example_gloss: C’est une invitation.
  fa.a1.unit12.lesson05.teach.saat_hasht_review:
    title: Huit heures du soir
    gloss: huit heures du soir
    note: '*ساعت هشت شب* associe la structure de l’heure vue dans l’unité 9 à *شب* (soir, nuit).'
  fa.a1.unit12.lesson05.teach.invitation_message:
    title: Exemple de message d’invitation
    gloss: Salut ! Tu veux aller au cinéma jeudi à huit heures du soir ? J’attends ta réponse.
    note: Un court message écrit d’invitation, comme on peut en recevoir par SMS.
  fa.a1.unit12.lesson05.teach.mibinamet_word:
    title: Je vous verrai
    gloss: je vous verrai
    note: می‌بینمت (on se voit / à bientôt) est une façon courante de conclure en confirmant un projet.
    example_gloss: On se voit jeudi.
  fa.a1.unit12.lesson06.teach.names:
    title: Arash et Sara
    gloss: Arash, Sara
    note: آرش et سارا sont les deux interlocuteurs du dialogue de cette leçon.
    example_gloss:
    - Arash a du travail aujourd’hui.
    - Sara vient demain.
  fa.a1.unit12.lesson06.teach.che_saati_word:
    title: À quelle heure ?
    gloss: À quelle heure ?
    note: 'چه ساعتی؟ signifie littéralement « quelle heure ? » : c’est une façon naturelle de demander une heure précise.'
  fa.a1.unit12.lesson06.teach.dialogue_line1:
    title: Sara, tu veux aller au cinéma jeudi ?
    gloss: Sara, tu veux aller au cinéma jeudi ?
    note: Arash commence par proposer le projet.
  fa.a1.unit12.lesson06.teach.dialogue_line2:
    title: À quelle heure ?
    gloss: À quelle heure ?
    note: Sara demande l’heure précise avant de décider.
  fa.a1.unit12.lesson06.teach.dialogue_line3:
    title: Huit heures du soir.
    gloss: Huit heures du soir.
    note: Arash indique l’heure.
  fa.a1.unit12.lesson06.teach.dialogue_line4:
    title: D’accord, super ! C’est entendu.
    gloss: D’accord, super ! C’est entendu.
    note: Sara accepte avec enthousiasme.
  fa.a1.unit12.lesson06.teach.dialogue_line5:
    title: Bien, on se voit jeudi.
    gloss: Bien, on se voit jeudi.
    note: Arash confirme et termine l’échange. خوبه suit la contraction en -e déjà vue (خوب است -> خوبه).
