course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : proposer, accepter et refuser un projet simple, lire une courte invitation et dialoguer pour s’entendre sur un projet.'
units:
  fa.a1.unit12.plans:
    title: Faire des projets
