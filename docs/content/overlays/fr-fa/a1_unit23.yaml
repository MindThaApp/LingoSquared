course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : vocabulaire de base des sentiments, demander à quelqu’un comment il va, nier un sentiment, donner une raison simple avec چون, un court texte à lire et un dialogue final entre نیما et سارا.'
