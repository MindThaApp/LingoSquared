teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: Heureux
    gloss: heureux
    note: خوشحال signifie « content ».
    example_gloss: Je suis heureux.
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: Triste
    gloss: triste
    note: ناراحت signifie « triste ».
    example_gloss: Je suis triste.
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: Je suis (forme contractée)
    gloss: je suis (contracté avec un adjectif)
    note: '*خوشحالم* est *خوشحال* + *هستم* contracté en *-م*. Après un *-ه* muet, la même terminaison s’écrit *-ام*, comme dans *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (je suis content, forme contractée)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Fatigué
    gloss: fatigué
    note: خسته signifie « fatigué ».
    example_gloss: Je suis fatigué.
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: Je ne vais pas bien
    gloss: je ne vais pas bien
    note: خوب نیستم met à la forme négative خوبم (je vais bien), déjà vu, avec نیستم, le négatif de هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Affamé
    gloss: affamé
    note: '*گشنه* signifie « affamé ». C’est la forme parlée courante de *گرسنه*, que tu as vu dans l’unité 4.'
    example_gloss: J’ai faim.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Un peu
    gloss: un peu
    note: یکم atténue un sentiment, comme « un peu » en français.
    example_gloss: Je suis un peu fatigué.
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: En colère
    gloss: en colère
    note: عصبانی signifie « en colère ».
    example_gloss: Pourquoi es-tu en colère ?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Inquiet
    gloss: inquiet
    note: نگران signifie « inquiet ».
    example_gloss: Je suis inquiet.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Pourquoi
    gloss: pourquoi
    note: '*چرا* signifie pourquoi ; *هستی* est la forme familière de « tu es », qui se contracte en *-ی* : *نگران هستی* devient *نگرانی*.'
    target_text: چرا (pourquoi)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: J’ai travaillé
    gloss: j’ai travaillé
    note: کار کردم signifie littéralement « travail j’ai fait ».
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: C’est férié
    gloss: c’est férié
    note: تعطیله signifie que c’est un jour de congé ou un jour férié.
    example_gloss: Aujourd’hui, c’est férié.
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: امروز signifie « aujourd’hui ».
    example_gloss: Aujourd’hui, je suis fatigué(e).
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: Beaucoup
    gloss: beaucoup
    note: زیاد signifie « beaucoup » ou « trop ».
    example_gloss: J’ai beaucoup travaillé.
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Sara
    gloss: Sara
    note: سارا, personnage présenté dès l’unité 14, réapparaît ici.
    example_gloss: Sara est fatiguée.
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 'Lecture : la journée de Sara'
    gloss: Sara est un peu fatiguée aujourd’hui parce qu’elle a beaucoup travaillé. Sara n’est pas triste, juste fatiguée.
    note: '*خسته‌ست* et *کرده* sont les formes familières de la 3e personne correspondant à *خسته‌ام* et *کردم* ; *نیست* est la négation de *هست* ; *فقط* signifie « seulement ».'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: Quelle bonne nouvelle !
    gloss: quelle bonne nouvelle !
    note: چه خوب! est une réaction positive courante, comme « super ! ».
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 'Nima : Sara, comment vas-tu ?'
    gloss: Sara, comment vas-tu ?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Sara : Je suis un peu fatiguée…'
    gloss: Aujourd’hui, je suis un peu fatiguée parce que j’ai beaucoup travaillé. Et toi, comment vas-tu ?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Nima : Je suis content…'
    gloss: Je suis content parce qu’aujourd’hui, c’est férié.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Sara : Super !'
    gloss: Super !
