teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: L’université
    gloss: université
    note: '*دانشگاه* est le mot standard et courant pour « université ».'
    example_gloss: Cette université est bien.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: L’étudiant
    gloss: étudiant
    note: '*دانشجو* signifie « étudiant(e) à l’université ». *من دانشجو هستم* (« Je suis étudiant(e) ») utilise la forme *هستم* que tu connais déjà.'
    example_gloss: Je suis étudiant.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Leçon / matière
    gloss: leçon / matière
    note: '*درس* signifie à la fois « leçon » et, plus largement, « matière étudiée ».'
    example_gloss: Cette matière est intéressante.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Langue
    gloss: langue
    note: '*زبان* est le mot standard pour « langue ».'
    example_gloss: Le persan est une langue.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Je / ceci
    gloss: je / ce, cette
    note: '*من* et *این* reviennent ici pour parler de tes études.'
    target_text: من (je) / این (ce, cette)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: Dans / à
    gloss: dans / à
    note: '*در* signifie « dans » ou « à » ; il sert ici pour dire « à l’université ».'
    target_text: در (dans / à)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Étudier/lire + je = j’étudie / je lis
    gloss: étudier/lire + je = j’étudie/je lis
    note: '*خوندن* (« lire » ou « étudier », comme dans *کتاب خوندن*) prend la même terminaison de présent *-م* que *می‌کنم*, ce qui donne *می‌خونم*, « j’étudie » ou « je lis ».'
    target_text: خوندن (étudier/lire) + م = می‌خونم (j’étudie/je lis)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: J’étudie à l’université
    gloss: J’étudie à l’université
    note: '*من در دانشگاه درس می‌خونم* associe *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Maths
    gloss: maths
    note: '*ریاضی* est le mot standard pour dire « maths » ou « mathématiques ».'
    example_gloss: Les maths sont intéressantes.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Filière / domaine d’études
    gloss: filière / domaine d’études
    note: '*رشته* désigne la « filière » ou le « domaine d’études » à l’université. Dans *رشته‌ی من* (« ma filière »), le *ی* supplémentaire relie le nom à *من*.'
    example_gloss: Ma filière, c’est les langues.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Anglais
    gloss: anglais
    note: '*انگلیسی* (« anglais ») revient ici pour désigner une matière que tu peux étudier.'
    target_text: انگلیسی (anglais)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Apprendre + je = j’apprends
    gloss: apprendre + je = j’apprends
    note: '*یاد گرفتن* signifie « apprendre ». Sa forme du présent *یاد می‌گیرم* utilise le même verbe *گرفتن* que dans *عکس می‌گیرم* (« je prends une photo »), mais avec un autre sens.'
    target_text: یاد گرفتن (apprendre) + م = یاد می‌گیرم (j’apprends)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Tu étudies / tu lis (informel)
    gloss: tu étudies / tu lis (familier)
    note: '*می‌خونی* est la forme familière de la 2e personne de *می‌خونم*, utilisée pour poser directement une question à quelqu’un.'
    target_text: می‌خونی (tu étudies/tu lis, informel)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Quoi
    gloss: quel / quoi
    note: '*چی* (« quoi ») revient ici.'
    target_text: چی (quoi)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Qu’est-ce que tu étudies ?
    gloss: Qu’est-ce que tu étudies ?
    note: '*چی درس می‌خونی؟* rassemble tous les éléments de cette leçon.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Ma filière, c’est les maths. J’apprends aussi l’anglais.
    gloss: Ma filière, c’est les maths. J’apprends aussi l’anglais.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* indique ta filière et une matière supplémentaire, avec le marqueur d’objet *رو* et *هم* (« aussi »).'
  fa.a1.unit30.lesson03.teach.review_koja:
    title: Où
    gloss: où
    note: '*کجا* (« où ») s’emploie seul comme mot interrogatif, ainsi que dans des questions comme *کجاست؟*.'
    target_text: کجا (où)
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: Où étudies-tu ?
    gloss: Où étudiez-vous ?
    note: '*کجا درس می‌خونی؟* demande où quelqu’un étudie.'
  fa.a1.unit30.lesson03.teach.review_be:
    title: Vers / à
    gloss: à / pour
    note: '*به* (« à, vers ») revient ici pour dire « à l’université ».'
    target_text: به (à / vers)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Je vais
    gloss: je vais
    note: '*می‌رم* (« je vais ») revient ici pour dire qu’on va à l’université.'
    target_text: می‌رم (je vais)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: Chaque jour
    gloss: chaque jour
    note: '*هر روز* (« tous les jours ») revient ici.'
    target_text: هر روز (chaque jour)
  fa.a1.unit30.lesson03.teach.answer_frequency:
    title: Je vais à l’université tous les jours
    gloss: Je vais à l’université tous les jours
    note: '*هر روز به دانشگاه می‌رم* rassemble tous les éléments de cette leçon.'
  fa.a1.unit30.lesson04.teach.sakhte_word:
    title: C’est difficile
    gloss: c’est difficile
    note: '*سخته* (*سخت* + la copule familière *-ه*) décrit quelque chose de difficile.'
    example_gloss: Les maths sont difficiles.
  fa.a1.unit30.lesson04.teach.review_jalebe:
    title: C’est intéressant
    gloss: c’est intéressant
    note: '*جالبه* (« c’est intéressant ») revient ici.'
    target_text: جالبه (c’est intéressant)
  fa.a1.unit30.lesson04.teach.review_vali:
    title: Mais
    gloss: mais
    note: '*ولی* (« mais ») revient ici.'
    target_text: ولی (mais)
  fa.a1.unit30.lesson04.teach.review_are:
    title: Ouais
    gloss: ouais
    note: '*آره* (« oui », familier) revient ici.'
    target_text: آره (ouais)
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Nima : Sara, qu’est-ce que tu étudies ?'
    gloss: Sara, qu’est-ce que tu étudies ?
  fa.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Sara : J’étudie l’anglais. Où est-ce que tu étudies ?'
    gloss: J’étudie l’anglais. Où est-ce que tu étudies ?
  fa.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Nima : J’étudie les maths à l’université.'
    gloss: J’étudie les maths à l’université.
  fa.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Sara : Les maths, c’est difficile, non ?'
    gloss: Les maths, c’est difficile, non ?
  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Nima : Ouais, c’est difficile, mais c’est intéressant.'
    gloss: Ouais, c’est difficile, mais c’est intéressant.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Sara : Super !'
    gloss: Super !
  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: Il/elle étudie / il/elle lit
    gloss: il/elle étudie / lit
    note: '*می‌خونه* est la forme familière de la 3e personne de *می‌خونم*, nécessaire pour parler de نیما et de سارا dans ce texte.'
    target_text: می‌خونه (il/elle étudie/lit)
  fa.a1.unit30.lesson05.teach.review_mire:
    title: Il/elle va
    gloss: il/elle va
    note: '*می‌ره* est la forme familière de la 3e personne de *می‌رم* (« je vais »).'
    target_text: می‌ره (il/elle va)
  fa.a1.unit30.lesson05.teach.review_oo:
    title: Il / elle
    gloss: il / elle
    note: '*او* est le pronom de la 3e personne.'
    target_text: او (il/elle)
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Nima
    gloss: Nima
    note: '*نیما* est l’un des deux amis que tu retrouves dans ces dialogues.'
  fa.a1.unit30.lesson05.teach.reading_text:
    title: 'Lecture : les études de Nima et de Sara'
    gloss: Nima étudie les maths à l’université. Les maths, c’est difficile mais intéressant. Sara étudie l’anglais. Elle va à l’université tous les jours.
    note: 'Ce texte reprend le dialogue à la 3e personne. Il n’y a presque aucun mot nouveau : c’est un entraînement à reconnaître les mots dans un texte suivi.'
  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: J’aime / temps / je n’ai pas
    gloss: j’aime / temps / je n’ai pas
    note: '*دوست دارم*, *وقت* et *ندارم* se combinent ici pour former une phrase naturelle qui exprime une préférence et une contrainte à propos des études.'
    target_text: دوست دارم (j’aime) / وقت (temps) / ندارم (je n’ai pas)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Parfois
    gloss: parfois
    note: '*گاهی* (« parfois ») revient ici.'
    target_text: گاهی (parfois)
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: J’aime étudier, mais parfois c’est difficile
    gloss: J’aime étudier, mais parfois c’est difficile
    note: '*درس رو دوست دارم ولی گاهی سخته* associe une préférence et une contrainte avec *ولی*.'
