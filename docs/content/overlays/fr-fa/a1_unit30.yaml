course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer les mots de l’université et des études (université, étudiant, cours/matière, langue), dire quelle matière tu étudies ou apprends (les maths, une filière, l’anglais comme matière), demander et dire où tu étudies (*کجا درس می‌خونی؟*) et à quelle fréquence tu y vas, un texte à lire sur les études de *نیما* et de *سارا*, et un dialogue final entre *نیما* et *سارا* sur leurs matières et ce qu’ils en pensent (difficile mais intéressant).'
