teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Heure / horloge
    gloss: heure / horloge
    note: ساعت signifie à la fois « heure » et « horloge/montre » ; c’est le mot de base pour dire l’heure.
    example_gloss: Quelle heure est-il ?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minute
    gloss: minute
    note: دقیقه est le mot pour « minute ».
    example_gloss: Attends cinq minutes.
  fa.a1.unit09.lesson01.teach.half_word:
    title: La moitié
    gloss: demi
    note: نیم signifie « demi » et s’emploie pour la demi-heure.
    example_gloss: Il est sept heures et demie.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Quart
    gloss: quart
    note: ربع signifie « quart » et s’emploie pour le quart d’heure.
    example_gloss: Il est huit heures moins le quart.
  fa.a1.unit09.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant, utilisé tout au long de cette unité.
    target_text: و (et)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Demander quelle heure il est
    gloss: Quelle heure est-il ?
    note: ساعت چنده؟ est la façon courante, à l’oral, de demander l’heure.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: La contraction familière en -e (révision)
    gloss: چنده est la contraction courante, à l’oral, de چند است.
    note: C’est la même contraction que celle déjà vue avec des mots de la météo et des achats comme آفتابیه et تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Dire qu’il est trois heures et demie
    gloss: Il est trois heures et demie.
    note: ساعت سه و نیمه réunit l’heure, و (et) et نیمه (demie), forme contractée.
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: La contraction familière en -e, appliquée à نیم
    gloss: نیمه est la contraction courante, à l’oral, de نیم است.
    note: Même schéma que چنده, appliqué à نیم au lieu de چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Matin
    gloss: matin
    note: صبح désigne le matin.
    example_gloss: Je me réveille tôt le matin.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Midi
    gloss: midi
    note: ظهر désigne le midi.
    example_gloss: Je déjeune à midi.
  fa.a1.unit09.lesson04.teach.asr:
    title: Après-midi
    gloss: après-midi
    note: عصر désigne l’après-midi, jusqu’au début de la soirée.
    example_gloss: Je travaille l’après-midi.
  fa.a1.unit09.lesson04.teach.shab:
    title: Nuit
    gloss: nuit
    note: شب désigne la nuit.
    example_gloss: Je me couche tôt le soir.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Rendez-vous
    gloss: rendez-vous
    note: قرار est le mot général pour un rendez-vous ou une rencontre convenue.
    example_gloss: J'ai un rendez-vous.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Demander à quelle heure est un rendez-vous
    gloss: À quelle heure est le rendez-vous ?
    note: قرار ساعت چنده؟ applique la question de l’heure de la leçon 2 à un rendez-vous précis.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Indiquer une heure avec un moment de la journée
    gloss: quatre heures de l’après-midi
    note: ساعت چهار عصر associe l’heure à عصر pour distinguer le matin de l’après-midi.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Demain (révision)
    gloss: demain
    note: فردا a été vu dans une unité précédente ; il sert ici à situer le rendez-vous.
    example_gloss: J’ai un rendez-vous demain.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Dire qu’on aura un peu de retard
    gloss: Je vais avoir un peu de retard.
    note: '*یکم دیر می‌شه* emploie le mot familier *یکم* (un peu) et *دیر* (tard, en retard).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar demande à quelle heure est le rendez-vous de demain
    gloss: Negar demande à quelle heure est le rendez-vous de demain.
    note: قرار فردا ساعت چنده؟ associe la question sur le rendez-vous de la leçon 5 à فردا (demain).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash répond sans être sûr
    gloss: Arash dit qu’il pense que c’est à quatre heures.
    note: فکر کنم (je pense) atténue la réponse, car il n’est pas tout à fait certain.
  fa.a1.unit09.lesson06.teach.turn03:
    title: Negar demande si c’est le matin ou l’après-midi
    gloss: Negar demande si c’est quatre heures de l’après-midi ou du matin.
    note: Cela lève l’ambiguïté, car ساعت چهار seul ne précise pas de quelles quatre heures il s’agit.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash précise
    gloss: 'Arash répond : l’après-midi.'
    note: Une réponse d’un seul mot est naturelle une fois le contexte posé par la question.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar accepte et change son heure d’arrivée
    gloss: Negar accepte et dit qu’elle viendra à quatre heures et quart.
    note: ساعت چهار و ربع associe l’heure à ربع (quart).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash demande pourquoi ce quart d’heure en plus
    gloss: Arash demande pourquoi elle dit « et quart ».
    note: '*چرا ربع؟* est une façon courte de demander « Pourquoi le quart ? »'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar explique qu’elle aura un peu de retard
    gloss: Negar explique qu’elle sortira un peu en retard du travail.
    note: '*چون* (parce que) introduit la raison, avec *یکم دیر می‌شه* (je serai un peu en retard), que tu viens d’apprendre dans cette leçon.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash la rassure
    gloss: 'Arash dit : d’accord, pas de problème.'
    note: 'مشکلی نیست (pas de problème) rassure Negar : ce petit retard n’est pas grave.'
