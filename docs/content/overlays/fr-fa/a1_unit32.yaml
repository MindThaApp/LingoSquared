course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : parler des tâches ménagères, dire ce qu’il faut faire, dire qui fait la vaisselle, la lessive, le balayage et le nettoyage de la chambre, et demander de l’aide pour une tâche.'
