teaching:
  fa.a1.unit32.lesson01.teach.zarf_shostan:
    title: Faire la vaisselle
    gloss: faire la vaisselle
    note: '*ظرف شستن* combine littéralement *ظرف* (« vaisselle ») + *شستن* (« laver »).'
    example_gloss: Faire la vaisselle, c’est ma tâche.
  fa.a1.unit32.lesson01.teach.lebas_shostan:
    title: Faire la lessive
    gloss: faire la lessive
    note: '*لباس شستن* signifie littéralement « laver les vêtements » ; c’est la façon courante de parler de faire la lessive.'
    example_gloss: Faire la lessive, c’est ma tâche aujourd’hui.
  fa.a1.unit32.lesson01.teach.tamiz_kardan:
    title: Nettoyer
    gloss: nettoyer
    note: '*تمیز کردن* signifie « nettoyer ».'
    example_gloss: Je nettoie la chambre.
  fa.a1.unit32.lesson01.teach.jaru_zadan:
    title: Balayer
    gloss: balayer
    note: '*جارو زدن* signifie « balayer » ou « passer l’aspirateur », selon la maison et l’outil.'
    example_gloss: Je balaie la maison.
  fa.a1.unit32.lesson01.teach.review_house_words:
    title: Maison / chambre / tâche / mon / et
    gloss: maison / chambre / tâche / mon / et
    note: '*خونه*, *اتاق*, *کار*, *من* et *و* reviennent ici depuis les unités précédentes.'
    target_text: خونه (maison) / اتاق (chambre, pièce) / کار (travail, tâche) / من (je, mon) / و (et)
  fa.a1.unit32.lesson01.teach.review_object_marker:
    title: Marque de l’objet / je fais / devoir, falloir
    gloss: marqueur d’objet / je fais / devoir
    note: '*رو* marque l’objet ; *می‌کنم* signifie « je fais » ; *باید* signifie « devoir » ou « falloir ».'
    target_text: رو (marqueur d’objet) / می‌کنم (je fais) / باید (devoir, falloir)
  fa.a1.unit32.lesson01.teach.need_clean_room:
    title: Je dois ranger la chambre
    gloss: Je dois ranger la chambre
    note: '*باید اتاق رو تمیز کنم* est une phrase simple et utile pour parler des corvées.'
  fa.a1.unit32.lesson02.teach.review_questions:
    title: Quoi / quand / aujourd’hui
    gloss: quoi / quand / aujourd’hui
    note: '*چی*, *کِی* et *امروز* sont des mots interrogatifs et temporels déjà vus.'
    target_text: چی (quoi) / کِی (quand) / امروز (aujourd’hui)
  fa.a1.unit32.lesson02.teach.mikoni_pattern:
    title: Je fais -> tu fais
    gloss: je fais -> tu fais
    note: '*می‌کنی* est la forme familière de « tu fais », parallèle à *می‌کنم*.'
    target_text: می‌کنم (je fais) -> می‌کنی (tu fais, familier)
  fa.a1.unit32.lesson02.teach.question_what_chore:
    title: Que fais-tu aujourd’hui ?
    gloss: Qu’est-ce que tu fais aujourd’hui ?
    note: '*امروز چه کاری می‌کنی؟* demande ce que quelqu’un fait aujourd’hui.'
  fa.a1.unit32.lesson02.teach.mishuram_pattern:
    title: Je lave
    gloss: je lave
    note: '*می‌شورم* signifie « je lave ».'
  fa.a1.unit32.lesson02.teach.zarfha_answer:
    title: Je lave la vaisselle
    gloss: Je fais la vaisselle
    note: '*ظرف‌ها* signifie « la vaisselle » (littéralement « les plats »).'
  fa.a1.unit32.lesson02.teach.lebasha_answer:
    title: Je fais la lessive
    gloss: Je fais la lessive
    note: '*لباس‌ها رو می‌شورم* signifie littéralement « je lave les vêtements ».'
  fa.a1.unit32.lesson03.teach.help_word:
    title: Aide
    gloss: aide
    note: '*کمک* signifie « aide ».'
    example_gloss: Tu m’aides ?
  fa.a1.unit32.lesson03.teach.help_question:
    title: Tu m’aides ?
    gloss: Tu m’aides ?
    note: '*کمک می‌کنی؟* est une demande simple et familière.'
  fa.a1.unit32.lesson03.teach.review_please:
    title: S’il te plaît / puis / sans faute
    gloss: s’il te plaît / ensuite / bien sûr
    note: '*لطفاً*, *بعد* et *حتماً* rendent la demande et la réponse polies et naturelles.'
    target_text: لطفاً (s’il te plaît) / بعد (après, ensuite) / حتماً (sans faute)
  fa.a1.unit32.lesson03.teach.help_request_room:
    title: Tu peux m’aider à ranger la chambre, s’il te plaît ?
    gloss: Tu peux m’aider à ranger la chambre, s’il te plaît ?
    note: '*لطفاً کمک می‌کنی اتاق رو تمیز کنم؟* demande de l’aide pour une tâche précise.'
  fa.a1.unit32.lesson03.teach.accept_help:
    title: Bien sûr. Ensuite, je passerai le balai.
    gloss: Bien sûr. Ensuite, je passerai le balai.
    note: '*حتماً. بعد جارو می‌زنم* accepte et annonce la tâche suivante.'
  fa.a1.unit32.lesson04.teach.review_dialogue_words:
    title: En désordre / ouais / super / merci
    gloss: en désordre / oui / super / merci
    note: '*شلوغه* peut signifier qu’un lieu est bondé, animé ou en désordre ; ici, la maison est en désordre.'
    target_text: شلوغه (c’est en désordre, bondé) / آره (ouais) / عالیه (super) / ممنون (merci)
  fa.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Sara : Nima, la maison est vraiment en désordre aujourd’hui.'
    gloss: Nima, la maison est vraiment en désordre aujourd’hui.
  fa.a1.unit32.lesson04.teach.dialogue_line2:
    title: 'Nima : Oui, je fais la vaisselle.'
    gloss: Oui, je fais la vaisselle.
  fa.a1.unit32.lesson04.teach.dialogue_line3:
    title: 'Sara : Moi, je range la chambre. Tu m’aideras ensuite ?'
    gloss: Moi, je range la chambre. Tu m’aideras ensuite ?
  fa.a1.unit32.lesson04.teach.dialogue_line4:
    title: 'Nima : Bien sûr. Ensuite, je fais la lessive.'
    gloss: Bien sûr. Ensuite, je fais la lessive.
  fa.a1.unit32.lesson04.teach.dialogue_line5:
    title: 'Sara : Super, merci !'
    gloss: Super, merci !
  fa.a1.unit32.lesson05.teach.review_third_person:
    title: Il/elle lave / il/elle nettoie
    gloss: il/elle lave / il/elle range
    note: '*می‌شوره* et *می‌کنه* sont des formes familières de la 3e personne pour dire ce que fait quelqu’un d’autre.'
    target_text: می‌شوره (il/elle lave) / تمیز می‌کنه (il/elle nettoie)
  fa.a1.unit32.lesson05.teach.review_responsibility:
    title: Responsable / tâches ménagères
    gloss: responsable / tâches ménagères
    note: '*کارها* signifie littéralement « les tâches » et convient bien ici pour les corvées ménagères.'
    target_text: مسئول (responsable) / کارها (corvées, tâches)
  fa.a1.unit32.lesson05.teach.reading_text:
    title: 'Lecture : Les tâches ménagères'
    gloss: Aujourd’hui, la maison est en désordre. Nima fait la vaisselle et la lessive. Sara range la chambre. Tous les deux aident.
    note: Ce texte reprend les informations du dialogue à la 3e personne.
  fa.a1.unit32.lesson06.teach.review_tonight:
    title: Ce soir / d’abord / ensuite
    gloss: ce soir / d’abord / ensuite
    note: '*امشب*, *اول* et *بعد* permettent d’ordonner les corvées dans un court message.'
    target_text: امشب (ce soir) / اول (d’abord) / بعد (ensuite)
  fa.a1.unit32.lesson06.teach.wrap_summary:
    title: Ce soir, d’abord je fais la vaisselle, ensuite je range la chambre
    gloss: Ce soir, d’abord je fais la vaisselle, ensuite je range la chambre
    note: '*امشب اول ظرف‌ها رو می‌شورم، بعد اتاق رو تمیز می‌کنم* est un petit programme de corvées naturel.'
  fa.a1.unit32.lesson06.teach.help_wrap:
