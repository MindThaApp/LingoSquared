course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : comparaisons de base (plus grand/plus petit, plus cher/moins cher, plus grand de taille/plus jeune), donner la raison d’une comparaison, et courte lecture/dialogue comparant deux choses.'
units:
  fa.a1.unit15.comparisons:
    title: Comparaisons
    description: Faire et comprendre des comparaisons simples entre des personnes, des objets ou des options familiers.
lessons:
  fa.a1.unit15.lesson01.basic_comparative:
    title: Comparaisons de base
  fa.a1.unit15.lesson02.comparing_prices:
    title: Comparer des prix
  fa.a1.unit15.lesson03.comparing_people:
    title: Comparer des personnes
  fa.a1.unit15.lesson04.giving_reasons:
    title: Donner une raison pour une comparaison
  fa.a1.unit15.lesson05.reading_a_comparison:
    title: Lire une comparaison
  fa.a1.unit15.lesson06.comparisons_dialogue:
    title: Un dialogue qui compare deux choses
teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Ceci
    gloss: ce / cette
    note: این signifie « ceci / ce ».
    example_gloss: Celui-ci est plus grand que celui-là.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Cela
    gloss: cela / celui-là
    note: اون signifie « celui-là / cela » (forme familière de آن).
    example_gloss: Celui-là est plus petit que celui-ci.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: C’est plus grand
    gloss: c’est plus grand
    note: بزرگ‌تره est la contraction familière de بزرگ‌تر است (il est plus grand) ; بزرگ‌تر est le comparatif de بزرگ (grand).
    example_gloss: Celui-ci est plus grand que celui-là.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: C’est plus petit
    gloss: c’est plus petit
    note: کوچیک‌تره est la contraction familière de کوچیک‌تر است (il est plus petit).
    example_gloss: Celui-là est plus petit que celui-ci.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Que (comparatif)
    gloss: que
    note: 'از marque le point de comparaison : X از Y بزرگ‌تره signifie « X est plus grand que Y ».'
    target_text: از (que)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: C’est plus cher
    gloss: c’est plus cher
    note: گرون‌تره est la contraction familière de گرون‌تر است ; گرون‌تر est le comparatif de گرون (cher).
    example_gloss: Celui-ci est plus cher que celui-là.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: C’est moins cher
    gloss: c’est moins cher
    note: ارزون‌تره est la contraction familière de ارزون‌تر است ; ارزون‌تر est le comparatif de ارزون (bon marché).
    example_gloss: Celui-là est moins cher que celui-ci.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: Des prénoms iraniens courants, utilisés tout au long de ce cours.
    example_gloss:
    - Nima est plus grand que Sara.
    - Sara est plus jeune que Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Plus grand
    gloss: plus grand / il est plus grand, elle est plus grande
    note: '*قد بلندتره* signifie littéralement « la taille est plus haute » : *قد* (taille) + *بلندتر* (plus grand, comparatif de *بلند*, grand/long) + *است* (est), contracté en *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Plus jeune
    gloss: plus jeune / il est plus jeune, elle est plus jeune
    note: جوون‌تره est la contraction familière de جوون‌تر است ; جوون‌تر est le comparatif de جوون (jeune).
    example_gloss: Sara est plus jeune que Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: C’est mieux
    gloss: c’est mieux
    note: '*بهتره* est la contraction familière de *بهتر است*. *بهتر* (meilleur) est le comparatif irrégulier de *خوب* (bon).'
    example_gloss: Celui-ci est mieux que celui-là.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: C’est pire
    gloss: c’est pire
    note: '*بدتره* est la contraction familière de *بدتر است*. *بدتر* (pire) est le comparatif régulier de *بد* (mauvais) : le même mot plus la terminaison ordinaire *تر*, contrairement à *بهتر*, qui est irrégulier.'
    example_gloss: Celui-là est pire que celui-ci.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Parce que
    gloss: parce que
    note: چون introduit une raison.
    target_text: چون (parce que)
  fa.a1.unit15.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Exemple de texte comparatif
    gloss: Nima est plus grand que Sara. Sara est plus jeune que Nima.
    note: Un court texte de comparaison à la troisième personne, qui réunit le vocabulaire de cette unité.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima a dit que celui-ci est plus cher.
    - Sara a dit que celui-là est moins cher.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Mais
    gloss: mais
    note: ولی signifie « mais » et introduit une opposition.
    target_text: ولی (mais)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Ouais
    gloss: ouais
    note: آره est la forme familière de بله (oui).
    example_gloss: Ouais, c’est vrai.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima dit
    gloss: Celui-ci est plus cher que celui-là, mais il est mieux.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara répond
    gloss: Ouais, mais celui-là est moins cher.
