course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : lire l’écriture, comprendre la langue de tous les jours et mener des conversations pratiques avec politesse.'
units:
  fa.a1.unit02.introductions:
    title: Noms, origines et présentations
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Lire les lettres utilisées dans les présentations
  fa.a1.unit02.lesson02.names:
    title: Demander et dire un nom
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Pronoms du singulier et verbe être
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Pays et nationalités
  fa.a1.unit02.lesson05.origin:
    title: Demander d’où vient quelqu’un
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Rencontre dans un cours de persan
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Les lettres ن et ت
    gloss: n et t
    note: ن représente n. ت représente t ; toutes deux se lient des deux côtés.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Les lettres ش et چ
    gloss: ch et tch
    note: ش représente le son ch (comme dans « chat ») et چ représente tch.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Les lettres ی et ه
    gloss: y / i long et h
    note: ی se prononce y ou i long. ه est un h et change de forme quand elle est liée.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Les lettres ک et گ
    gloss: k et g
    note: ک représente k ; au clavier, utilise le ک persan, pas la lettre arabe qui lui ressemble. گ ajoute un trait supplémentaire à ک et représente g (comme dans « gare »).
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Les lettres ج et د
    gloss: dj et d
    note: ج représente dj (comme dans « djinn »). د représente d et ne se lie pas à la lettre suivante, à sa gauche.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Les lettres ر et ف
    gloss: r et f
    note: ر représente r et ne se lie pas à la lettre suivante ; ف représente f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Les lettres و et ب
    gloss: v/o/ou et b
    note: و peut représenter v ou une voyelle et ne se lie pas à la lettre suivante. ب représente b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Les lettres خ et ز
    gloss: kh et z
    note: خ correspond au son généralement noté kh ; ز représente z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Nom
    gloss: nom
    note: اسم se lit esm dans le persan courant d’Iran.
    example_gloss: Je m’appelle Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: je
    gloss: je
    note: من est le pronom de la première personne du singulier.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا est un prénom iranien courant.
    example_gloss: Sara est mon amie.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Présentation formelle ou écrite
    gloss: Je m’appelle Sara.
    note: '*اسم من سارا است* est correct mais formel ; on le rencontre surtout à l’écrit.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Présentation naturelle à l’oral
    gloss: Je m’appelle Sara.
    note: اسمم est la contraction de اسم من, tandis que ساراست réunit سارا et است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Demander un nom poliment
    gloss: Comment tu t’appelles ?
    note: اسم شما چیه؟ est du persan iranien parlé ordinaire, neutre et poli.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Demander familièrement le nom de quelqu’un
    gloss: Comment tu t’appelles ?
    note: اسمت چیه؟ est au singulier et informel ; ne l’utilise que si la relation le permet.
  fa.a1.unit02.lesson03.teach.man:
    title: je
    gloss: je
    note: من n’a pas de genre grammatical.
  fa.a1.unit02.lesson03.teach.to:
    title: Tu, singulier informel
    gloss: vous
    note: تو est un singulier informel ; pour s’adresser poliment à quelqu’un, on emploie normalement شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Il ou elle
    gloss: il / elle
    note: او ne marque pas le genre et peut désigner un homme comme une femme.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Je suis
    gloss: je suis
    note: هستم est la forme pleine de la première personne du singulier de بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Tu es
    gloss: vous êtes
    note: هستی s’accorde avec تو, singulier informel.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Il ou elle est
    gloss: il/elle est ; il/elle est présent(e)
    note: هست est la forme pleine de la troisième personne du singulier et exprime souvent l’existence ou l’insistance.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Phrase d’identité formelle
    gloss: Il ou elle est iranien(ne).
    note: Dans une phrase d’identité écrite, neutre et formelle, است est la copule ordinaire de la troisième personne.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Phrase d’identité parlée
    gloss: Il ou elle est iranien(ne).
    note: ایرانیه est la contraction parlée naturelle de ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران est un nom de pays.
    example_gloss: Je viens d’Iran.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Iranien
    gloss: iranien
    note: ایرانی peut indiquer la nationalité ou l’origine.
    example_gloss: Je suis iranien.
  fa.a1.unit02.lesson04.teach.england:
    title: Angleterre
    gloss: l’Angleterre
    note: '*انگلیس* désigne généralement l’Angleterre ; dans la langue courante, les Iraniens l’emploient souvent pour tout le Royaume-Uni.'
    example_gloss: Je viens d’Angleterre.
  fa.a1.unit02.lesson04.teach.english:
    title: anglais
    gloss: anglais
    note: انگلیسی peut désigner la nationalité, la langue ou ce qui est lié à l’Angleterre ; le contexte précise le sens.
    example_gloss: Je suis anglais.
  fa.a1.unit02.lesson04.teach.france:
    title: France
    gloss: la France
    note: 'فرانسه est le nom du pays : la France.'
    example_gloss: Je viens de France.
  fa.a1.unit02.lesson04.teach.french:
    title: français
    gloss: français
    note: فرانسوی peut désigner la nationalité ou ce qui est lié à la France, y compris la langue.
    example_gloss: Je suis français.
  fa.a1.unit02.lesson04.teach.country:
    title: Pays
    gloss: pays
    note: کشور est le mot général pour « pays ».
    example_gloss: L’Iran est un pays.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Nationalité
    gloss: nationalité
    note: ملیت est le nom formel pour « nationalité ».
    example_gloss: Quelle est votre nationalité ?
  fa.a1.unit02.lesson05.teach.ahl:
    title: De / originaire de
    gloss: originaire de
    note: اهل relie une personne à son lieu d’origine ; il ne signifie pas simplement qu’on habite actuellement quelque part.
    example_gloss: Il/Elle est originaire d’Angleterre.
  fa.a1.unit02.lesson05.teach.koja:
    title: Où
    gloss: où
    note: کجا sert à poser une question sur un lieu.
    example_gloss: D’où venez-vous ?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Question standard formelle
    gloss: D’où venez-vous ?
    note: اهل کجا هستید؟ est du persan standard poli ; il convient à un registre formel ou à la lecture soignée.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Question orale polie neutre
    gloss: D’où venez-vous ?
    note: اهل کجا هستین؟ est la forme orale polie ordinaire en persan d’Iran.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Question informelle
    gloss: D’où venez-vous ?
    note: اهل کجایی؟ est une forme informelle au singulier, comme le tutoiement.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Dire son lieu d’origine
    gloss: Je viens d’Iran.
    note: من اهل ایران هستم indique l’origine, et non le lieu de résidence actuel.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Réponse courte sur la nationalité
    gloss: Je suis iranien(ne).
    note: '*ایرانی‌ام* ajoute la terminaison *ـام* (je suis) à *ایرانی*, avec une petite semi-espace avant la terminaison.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Vérifier le lieu
    gloss: Sara demande si c’est bien la classe de persan.
    note: ببخشید sert à attirer poliment l’attention avant une question pratique.
  fa.a1.unit02.lesson06.teach.yes:
    title: Oui
    gloss: oui
    note: بله est le mot neutre et poli pour « oui ».
    example_gloss: Oui, bien sûr.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina se présente
    gloss: Mina confirme le lieu, se présente et demande son nom à Sara.
    note: La question orale polie convient à deux adultes qui se rencontrent dans un cours.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara donne son nom
    gloss: Je m’appelle Sara.
    note: Sara emploie la forme orale compacte vue précédemment.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina demande l’origine
    gloss: D’où venez-vous ?
    note: هستین garde l’échange poli, mais sur un ton de conversation.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Échanger sur les origines
    gloss: Sara dit qu’elle vient d’Angleterre et demande si Mina vient d’Iran.
    note: Les deux interlocutrices gardent les formes polies, car elles viennent de se rencontrer.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: 'Échanger sur les origines : la réponse'
    gloss: Mina confirme qu’elle est iranienne.
    note: '*ایرانی‌ام* est la forme courte de *ایرانی هستم* (je suis iranien).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Répondre à la présentation
    gloss: Sara dit qu’elle est ravie de rencontrer Mina.
    note: از آشنایی با شما خوشوقتم est une façon naturelle de conclure leur échange.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Répondre au salut et entrer dans la classe
    gloss: Mina dit qu’elle est ravie aussi et invite Sara à entrer.
    note: من هم همین‌طور répond à la formule de politesse de Sara, avant que بفرمایید داخل fasse avancer la scène du cours.
