    title: Terminer un appel
  fa.a1.unit22.lesson06.phone_dialogue:
    title: Une conversation téléphonique complète
teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Téléphone
    gloss: téléphone
    note: تلفن est le mot général pour « téléphone ».
    example_gloss: Où est mon téléphone ?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Message
    gloss: message
    note: پیام désigne un message écrit, un SMS.
    example_gloss: J’ai un message.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Appeler
    gloss: appeler
    note: زنگ زدن (littéralement « sonner ») est le verbe courant pour appeler quelqu’un.
    example_gloss: Appelle-moi.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: La voix
    gloss: voix
    note: صدا signifie « voix » ; on l’emploie pour décrire comment quelqu’un s’entend au téléphone.
    example_gloss: Ta voix est bien.
  fa.a1.unit22.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: و est le mot de liaison courant (« et »), déjà vu dans les unités précédentes.
    target_text: و (et)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Allô (au téléphone)
    gloss: allô, je vous écoute
    note: الو est la formule propre au téléphone (on ne l’utilise pas en face à face) ; ici, بفرمایید signifie à peu près « allez-y, je vous écoute ».
  fa.a1.unit22.lesson02.teach.its_me:
    title: C’est moi, Narges
    gloss: salut, c’est moi, Narges
    note: '*منم* est *من* (je) plus la terminaison verbale -م (« suis »), donc cela signifie « c’est moi » : une façon très courante de s’identifier au téléphone. (La même graphie peut aussi signifier « moi aussi », qui s’écrit *من هم* ; ici, le contexte est clair.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Peux-tu répéter cela ?
    gloss: pouvez-vous répéter ?
    note: می‌شه (forme familière de می‌شود, « est-il possible ») + تکرار کنید (« répétez ») forme la demande polie habituelle.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Parlez plus lentement, s’il vous plaît
    gloss: parlez plus lentement, s’il vous plaît
    note: 'آهسته‌تر est le comparatif de آهسته (« lentement ») : « plus lentement ».'
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: J’ai un message pour toi
    gloss: j’ai un message pour toi
    note: برات est la contraction de برای (« pour ») + ت (« toi », forme familière).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Viens au café demain à quatre heures
    gloss: viens au café demain à quatre heures
    note: بیا est l’impératif familier, formé sur le radical seul, du verbe آمدن (« venir »), selon le même schéma que les autres impératifs vus en A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Au revoir, on se parle plus tard
    gloss: au revoir, on se parle plus tard
    note: 'بعداً signifie « plus tard » ; صحبت می‌کنیم est le présent qui sert aussi de futur : « nous parlons / nous parlerons ».'
  fa.a1.unit22.lesson05.teach.better_now:
    title: C’est mieux maintenant ?
    gloss: c’est mieux maintenant ?
    note: 'الان signifie maintenant ; بهتر شد signifie littéralement « est devenu meilleur » : en persan, on emploie naturellement le passé pour cette vérification, alors qu’en français on dit « C’est mieux maintenant ? » au présent.'
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Salut Narges, comment ça va ?
    gloss: salut Narges, comment ça va ?
    note: '*چطوری* est le « comment vas-tu ? » familier, approprié ici parce qu’Ali et Narges sont amis.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Ta voix grésille
    gloss: ta voix grésille
    note: 'قطع و وصل می‌شه veut littéralement « se coupe et se reconnecte » : c’est l’expression persane naturelle pour une mauvaise connexion téléphonique.'
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali décroche
    gloss: 'Ali : Allô, je vous écoute.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges se présente
    gloss: 'Narges : Salut Ali, c’est moi, Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali lui rend son salut
    gloss: 'Ali : Salut Narges, comment ça va ?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges lui demande de parler plus lentement
    gloss: 'Narges : Je vais bien, merci. Tu peux parler plus lentement, s’il te plaît ? Ta voix grésille.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali vérifie
    gloss: 'Ali : D’accord, c’est mieux maintenant ?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges transmet le message
    gloss: 'Narges : Oui, c’est mieux. J’ai un message pour toi : viens au café demain à quatre heures.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Ils/elles vont (familier)
    gloss: ils vont (forme parlée)
    note: '*می‌رن* est la forme familière parlée de *می‌روند* (ils vont), dans le même registre courant que le reste de ce cours.'
    target_text: می‌رن (ils vont, forme familière)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali confirme
    gloss: 'Ali : D’accord, je viendrai sans faute.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges termine l’appel
    gloss: 'Narges : Au revoir, on se parle plus tard.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali dit au revoir
    gloss: 'Ali : Au revoir.'
