course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : vocabulaire du téléphone, répondre à un appel, demander de répéter ou de parler lentement, lire un court message et terminer poliment un appel.'
units:
  fa.a1.unit22.phone:
    title: Conversation téléphonique
lessons:
  fa.a1.unit22.lesson01.phone_vocabulary:
    title: Vocabulaire du téléphone
  fa.a1.unit22.lesson02.answering_the_phone:
    title: Répondre au téléphone
  fa.a1.unit22.lesson03.asking_to_repeat:
    title: Demander de répéter
  fa.a1.unit22.lesson04.reading_a_text_message:
