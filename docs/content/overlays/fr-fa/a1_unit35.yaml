  fa.a1.unit35.lesson05.teach.reading_text:
    title: 'Lecture : Sara prépare du ghormeh sabzi'
    gloss: Sara est dans la cuisine. Elle prépare du ghormeh sabzi. D’abord, Nima coupe l’oignon, puis Sara le fait frire dans l’huile. Elle ajoute aussi du sel. Le plat cuit doucement et devient très délicieux.
    note: Le texte reprend les actions du dialogue avec des verbes à la troisième personne ; comme dans le dialogue, c’est Nima qui coupe l’oignon.
