teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Le persan s’écrit de droite à gauche
    gloss: Le persan s’écrit de droite à gauche.
    note: Lis le persan en partant du bord droit vers la gauche.
  fa.a1.unit01.lesson01.teach.seen:
    title: La lettre س
    gloss: s
    note: س représente normalement le son s.
  fa.a1.unit01.lesson01.teach.lam:
    title: La lettre ل
    gloss: l
    note: ل représente le son l et se lie aux lettres voisines.
  fa.a1.unit01.lesson01.teach.alef:
    title: La lettre ا
    gloss: ā / a
    note: ا note souvent le â long et ne se lie pas à la lettre suivante.
  fa.a1.unit01.lesson01.teach.mim:
    title: La lettre م
    gloss: m
    note: م représente le son m et change de forme quand elle est liée.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Construis سلام
    gloss: bonjour
    note: سلام se lit salâm. Les voyelles brèves sont normalement omises dans l’écriture persane.
    example_gloss: Bonjour ! Je suis Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Bonjour
    gloss: bonjour
    note: سلام convient aussi bien dans les situations formelles que familières.
    example_gloss: Salut, tu vas bien ?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Bonjour (le matin)
    gloss: bonjour
    note: صبح بخیر est une salutation du matin à la fois neutre et polie.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Bon après-midi ou bonsoir
    gloss: bon après-midi / bonsoir
    note: عصر بخیر s’emploie de la fin d’après-midi jusqu’au soir.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Au revoir
    gloss: au revoir
    note: خداحافظ se lit khodâhâfez et c’est l’au revoir général standard.
    example_gloss: Au revoir, à plus tard !
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Merci
    gloss: merci
    note: ممنون est courant et naturel ; متشکرم est un peu plus formel.
    example_gloss: Merci beaucoup.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: De rien
    gloss: avec plaisir
    note: خواهش می‌کنم est la réponse habituelle à un remerciement.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Comment allez-vous ? Forme orale polie
    gloss: Comment allez-vous ?
    note: حالتون چطوره؟ est une formule orale neutre et polie du persan d’Iran. حال شما چطور است؟ en est la version plus formelle ou écrite.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Je vais bien
    gloss: je vais bien
    note: خوبم combine خوب et la terminaison de la première personne ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Bonne journée (salutation)
    gloss: bonne journée
    note: روز بخیر est poli, mais moins fréquent que سلام dans la conversation familière.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Bonne nuit
    gloss: bonne nuit
    note: شب بخیر est normalement un au revoir ou un vœu avant de dormir, pas une salutation d’accueil.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Bienvenue
    gloss: bienvenue
    note: خوش آمدید est la forme polie employée pour un ou plusieurs invités.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: En espérant te revoir
    gloss: en espérant vous revoir / à la prochaine
    note: به امید دیدار est un au revoir soigné, neutre et poli.
  fa.a1.unit01.lesson03.teach.fealan:
    title: À tout à l’heure
    gloss: à tout à l’heure
    note: فعلاً est familier et moins formel que خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Bonne journée
    gloss: bonne journée
    note: باشید marque la forme polie dans cette formule d’au revoir figée.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Forme orale neutre et polie
    gloss: Comment allez-vous ?
    note: Emploie حالتون چطوره؟ avec un adulte que tu ne connais pas ou dans une conversation polie ordinaire. La forme explicitement formelle ou écrite est حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Familier
    gloss: Comment allez-vous ?
    note: چطوری؟ est une formule de conversation qui convient avec des amis, la famille et des pairs, quand la relation le permet.
  fa.a1.unit01.lesson04.teach.to:
    title: Le « tu » informel
    gloss: vous
    note: تو est singulier et familier ; ne l’emploie pas d’emblée avec un adulte que tu ne connais pas.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Très bien
    gloss: je vais très bien
    note: خیلی renforce خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Pas mal
    gloss: je ne vais pas mal, merci
    note: بد نیستم est une réponse mesurée et naturelle, pas une plainte.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: Et vous ? Forme polie
    gloss: Et vous ?
    note: Emploie شما چطور؟ pour retourner poliment la question.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: Et toi ? Informel
    gloss: Et vous ?
    note: تو چطور؟ convient à une relation familière.
  fa.a1.unit01.lesson05.teach.chai:
    title: Le thé
    gloss: thé
    note: '*چای* désigne la boisson. Tu l’entendras dans la proposition *چای بفرمایید* (prends du thé / servez-vous du thé).'
    example_gloss: Je vous en prie, voulez-vous du thé ?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Je vous en prie, allez-y
    gloss: je vous en prie / allez-y / tenez
    note: '*بفرمایید* change selon la situation : il peut signifier « tenez » (en offrant du thé), « entrez, je vous en prie » (à une porte) ou « après vous ».'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Vous êtes aimable
    gloss: vous êtes très aimable
    note: لطف دارید répond poliment à un compliment.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Ne vous dérangez pas
    gloss: ne vous donnez pas cette peine
    note: زحمت نکشید peut être un vrai refus ou une première réponse polie à une offre concrète.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Merci pour votre gentillesse
    gloss: merci pour votre gentillesse
    note: C’est plus chaleureux et plus explicite que ممنون seul.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: conventions iraniennes de politesse selon le contexte
    note: Le taarof désigne des conventions, variables selon le contexte, pour offrir, refuser, remercier et témoigner du respect. La pratique varie selon la relation, la génération, la région et la situation ; aucun nombre fixe de refus ou de répétitions ne permet de savoir si une offre est sincère.
  fa.a1.unit01.lesson06.teach.line01:
    title: Bienvenue
    gloss: Ali accueille Narges.
    note: L’échange commence par la salutation avant les présentations.
  fa.a1.unit01.lesson06.teach.line02:
    title: Accueil, réponse
    gloss: Narges lui rend son salut et le remercie.
    note: ممنون (merci) est une réponse naturelle à un accueil.
  fa.a1.unit01.lesson06.teach.line03:
    title: Échanger les prénoms
    gloss: Ali dit qui il est.
    note: '*من علی هستم* signifie « Je suis Ali ». *هستم* (suis) se place à la fin de la phrase.'
  fa.a1.unit01.lesson06.teach.line04:
    title: 'Échanger les prénoms : la réponse'
    gloss: Narges dit qui elle est.
    note: C’est le même schéma *من ... هستم* qu’Ali vient d’utiliser.
  fa.a1.unit01.lesson06.teach.line05:
    title: Enchanté(e)
    gloss: Ali dit qu’il est enchanté de la rencontrer.
    note: '*خوشوقتم* signifie « je suis ravi(e) ». Avec *از آشنایی با شما*, c’est la formule de politesse habituelle quand on fait connaissance.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Enchanté, réponse
    gloss: Narges lui renvoie la politesse.
    note: همین‌طور signifie « pareillement » ou « de même » dans cette réponse.
  fa.a1.unit01.lesson06.teach.line07:
    title: Demander comment va quelqu’un
    gloss: Ali lui demande poliment comment elle va.
    note: Ali emploie la forme orale neutre et polie en ـتون, car c’est une première rencontre polie.
  fa.a1.unit01.lesson06.teach.line08:
    title: Demander comment va quelqu’un, réponse
    gloss: Narges répond et lui retourne la question.
    note: شما چطور؟ reprend la question pour la retourner, un raccourci courant.
  fa.a1.unit01.lesson06.teach.line09:
    title: Invitation
    gloss: Ali dit qu’il va bien aussi et invite Narges à entrer.
    note: '*بفرمایید داخل* signifie « entrez, je vous en prie ». *داخل* (à l’intérieur) indique ce qui est proposé.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Refus poli
    gloss: Narges le remercie mais explique qu’elle doit partir.
    note: Un refus poli commence toujours par un remerciement avant le refus. *ولی باید برم* signifie « mais je dois partir ».
  fa.a1.unit01.lesson06.teach.line11:
    title: Terminer l’échange
    gloss: Ali accepte sa réponse et espère la revoir.
    note: L’invitation refusée mène naturellement aux adieux.
  fa.a1.unit01.lesson06.teach.line12:
    title: 'Terminer l’échange : la réponse'
    gloss: Narges dit au revoir.
    note: '*خداحافظ* est la formule d’au revoir courante.'
