teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Numéro
    gloss: numéro
    note: عدد est le mot général pour « nombre ».
    example_gloss: C’est un nombre.
  fa.a1.unit03.lesson01.teach.zero:
    title: Zéro
    gloss: 0 — zéro
    note: صفر sert à dire zéro, y compris comme chiffre dans un nombre plus long, par exemple un numéro de téléphone.
    example_gloss: Zéro est un nombre.
  fa.a1.unit03.lesson01.teach.one:
    title: Un
    gloss: 1 — un
    note: یک signifie « un ».
    example_gloss: J’ai un livre.
  fa.a1.unit03.lesson01.teach.two:
    title: Deux
    gloss: 2 — deux
    note: دو signifie « deux ».
    example_gloss: J'ai deux pommes.
  fa.a1.unit03.lesson01.teach.three:
    title: Trois
    gloss: 3 — trois
    note: سه signifie « trois ».
    example_gloss: Il a trois frères.
  fa.a1.unit03.lesson01.teach.four:
    title: Quatre
    gloss: 4 — quatre
    note: چهار signifie « quatre ».
    example_gloss: Il est quatre heures.
  fa.a1.unit03.lesson01.teach.five:
    title: Cinq
    gloss: 5 — cinq
    note: پنج signifie « cinq ».
    example_gloss: Attends cinq minutes.
  fa.a1.unit03.lesson01.teach.six:
    title: Six
    gloss: 6 — six
    note: شش signifie « six ».
    example_gloss: Il y a six chaises.
  fa.a1.unit03.lesson01.teach.seven:
    title: Sept
    gloss: 7 — sept
    note: هفت signifie « sept ».
    example_gloss: Il y a sept jours dans une semaine.
  fa.a1.unit03.lesson01.teach.eight:
    title: Huit
    gloss: 8 — huit
    note: هشت signifie « huit ».
    example_gloss: Je vous vois à huit heures.
  fa.a1.unit03.lesson01.teach.nine:
    title: Neuf
    gloss: 9 — neuf
    note: 'نه signifie « neuf ». C’est aussi le mot courant pour « non » : le contexte (dans un compte ou un nombre) indique le sens voulu.'
    example_gloss: Il y a neuf élèves ici.
  fa.a1.unit03.lesson01.teach.ten:
    title: Dix
    gloss: 10 — dix
    note: ده signifie « dix ».
    example_gloss: J’ai dix doigts.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Onze
    gloss: 11 — onze
    note: یازده signifie « onze ».
    example_gloss: J’ai cours à onze heures.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Douze
    gloss: 12 — douze
    note: دوازده signifie « douze ».
    example_gloss: Il y a douze mois dans une année.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Treize
    gloss: 13 — treize
    note: سیزده signifie « treize ».
    example_gloss: Il/Elle a treize ans.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Quatorze
    gloss: 14 — quatorze
    note: چهارده signifie « quatorze ».
    example_gloss: Je viendrai dans quatorze jours.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Quinze
    gloss: 15 — quinze
    note: پانزده signifie « quinze ».
    example_gloss: Il/Elle a quinze livres.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Seize
    gloss: 16 — seize
    note: 'شانزده signifie « seize ». Ce mot ne se déduit pas de شش (six) + ده (dix) : mieux vaut l’apprendre comme un mot à part entière.'
    example_gloss: Il/Elle a seize ans.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Dix-sept
    gloss: 17 — dix-sept
    note: هفده signifie « dix-sept ».
    example_gloss: Dix-sept personnes sont venues.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Dix-huit
    gloss: 18 — dix-huit
    note: هجده signifie « dix-huit ».
    example_gloss: Il/Elle a dix-huit ans.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Dix-neuf
    gloss: 19 — dix-neuf
    note: نوزده signifie « dix-neuf ».
    example_gloss: Il reste dix-neuf jours.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Vingt
    gloss: 20 — vingt
    note: بیست signifie « vingt ».
    example_gloss: J’ai vingt livres.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Trente
    gloss: 30 — trente
    note: سی signifie « trente ».
    example_gloss: Ce mois compte trente jours.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: De quarante à quatre-vingt-dix
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود sont les autres dizaines.
    example_gloss:
    - Il/Elle a quarante ans.
    - Il y a cinquante chaises.
    - Soixante minutes font une heure.
    - Ce livre a soixante-dix pages.
    - Il/Elle a quatre-vingts livres.
    - Il/Elle a quatre-vingt-dix ans.
  fa.a1.unit03.lesson02.teach.combining:
    title: Combiner dizaines et unités
    gloss: vingt-cinq
    note: 'بیست و پنج signifie littéralement « vingt et cinq » : mot de la dizaine, و, mot de l’unité.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Numéro (de quelque chose)
    gloss: numéro
    note: شماره sert à désigner un numéro d’identification, comme un numéro de téléphone ou de maison, à la différence de عدد, qui désigne un nombre en général.
    example_gloss: Voici mon numéro de téléphone.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Téléphone
    gloss: téléphone
    note: تلفن désigne les téléphones en général, y compris les portables.
    example_gloss: Je n’ai pas de téléphone.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Demander un numéro de téléphone
    gloss: Quel est ton numéro de téléphone ?
    note: شماره تلفنتون چنده؟ est la façon polie et courante de demander un numéro de téléphone. Lire un numéro chiffre par chiffre est toujours compris et reste le plus sûr pour débuter ; regrouper les chiffres est aussi courant à l’oral, mais cette leçon s’exerce d’abord à la forme chiffre par chiffre.
  fa.a1.unit03.lesson03.teach.chande:
    title: Combien / quel est-il ?
    gloss: quel est-il ? / combien ça coûte ?
    note: چنده؟ est la contraction de چند است et demande un nombre, une quantité ou un prix selon le contexte.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Lire un nombre chiffre par chiffre
    gloss: zéro, neuf, un, deux, trois, quatre, cinq, six, sept, huit, huit
    note: Cette leçon s’exerce à lire les nombres chiffre par chiffre. Un vrai numéro de portable iranien compte 11 chiffres et commence par 0, par exemple 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: L'année
    gloss: an, année
    note: سال sert aussi bien pour les années du calendrier que pour dire l’âge de quelqu’un.
    example_gloss: J’ai vingt ans.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Je (récapitulatif)
    gloss: je
    note: Petit rappel de من, nécessaire ici pour dire ton âge dans une phrase complète.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Demander l’âge de quelqu’un (informel)
    gloss: Quel âge as-tu ?
    note: چند سالته؟ est la forme informelle au singulier ; چند سالتونه؟ en est l’équivalent poli.
  fa.a1.unit03.lesson04.teach.salame:
    title: Dire son âge
    gloss: J’ai 25 ans.
    note: 'سالمه ajoute directement la terminaison possessive ـم (mon) à سال, puis la copule familière ـه (est) : littéralement « mon-année-est ».'
  fa.a1.unit03.lesson04.teach.ta:
    title: Le classificateur de comptage
    gloss: (mot de comptage, sans équivalent direct en français)
    note: 'تا est le classificateur à tout faire utilisé pour compter la plupart des objets : nombre + تا + nom.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Pomme
    gloss: pomme
    note: سیب signifie « pomme ».
    example_gloss: J’aime les pommes.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Livre
    gloss: livre
    note: کتاب signifie « livre ».
    example_gloss: C’est un bon livre.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Demander une quantité
    gloss: Je voudrais deux pommes.
    note: دو تا سیب می‌خوام place la quantité comptée avant le nom, comme toujours avec تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Le prix
    gloss: le prix
    note: قیمت est le mot général pour « prix ».
    example_gloss: Combien coûte ceci ?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: toman (monnaie iranienne, usage courant)
    note: La monnaie officielle de l’Iran est le rial, mais à l’oral les prix courants sont presque toujours donnés en tomans (1 toman = 10 rials).
    example_gloss: Ça fait dix mille tomans.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Mille
    gloss: mille
    note: هزار signifie « mille » ; les prix se disent généralement en milliers de tomans.
    example_gloss: J’ai mille tomans.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Demander un prix
    gloss: Combien ça coûte ?
    note: این چنده؟ est la façon courante de demander le prix de quelque chose que tu as devant toi.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Indiquer un prix
    gloss: Ça coûte 30 000 tomans.
    note: تومنه est la contraction de تومن است ; le schéma complet est nombre + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara propose de s’entraîner ensemble
    gloss: Sara dit qu’elle veut qu’elles pratiquent le persan ensemble et demande le numéro de téléphone de Mina.
    note: باهم signifie « ensemble » ; می‌خوام ... تمرین کنیم signifie « je veux qu’on s’entraîne » — تمرین کنیم seul, sous forme de question, peut aussi signifier « on s’entraîne ? »
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina donne son numéro
    gloss: Mina accepte et énonce son numéro à 11 chiffres, un chiffre à la fois.
    note: شماره‌ام est la contraction de شماره من ; هشته est la contraction de هشت است et clôt le décompte.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara vérifie qu’elle a bien noté le numéro
    gloss: Sara demande à Mina d’attendre le temps d’écrire le numéro, puis le relit pour confirmer.
    note: درسته؟ (« c’est bien ça ? ») est une façon courante de vérifier un numéro ou une information qu’on vient d’entendre.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina confirme et pose la question à son tour
    gloss: Mina confirme que c’est correct et demande le numéro de Sara.
    note: آره est un « oui » familier, plus décontracté que بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara donne son numéro
    gloss: Sara énonce son propre numéro à 11 chiffres, un chiffre à la fois.
    note: یکه est la contraction de یک است et termine le décompte, comme هشته pour le numéro de Mina.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina accepte d’appeler
    gloss: Mina dit qu’elle appellera Sara demain.
    note: زنگ می‌زنم بهت signifie « je t’appellerai » — littéralement « je frappe la sonnette vers toi ».
