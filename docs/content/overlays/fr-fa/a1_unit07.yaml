teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: Ensoleillé
    gloss: ensoleillé
    note: آفتابی décrit un temps ensoleillé.
    example_gloss: Il fait soleil aujourd’hui.
  fa.a1.unit07.lesson01.teach.rainy:
    title: Pluvieux
    gloss: pluvieux
    note: بارونی est la graphie et la prononciation familières, courantes, de بارانی (pluvieux).
    example_gloss: Demain, il pleuvra.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: Nuageux
    gloss: nuageux
    note: ابری décrit un temps nuageux.
    example_gloss: Le ciel est nuageux.
  fa.a1.unit07.lesson01.teach.snowy:
    title: Neigeux
    gloss: neigeux
    note: برفی décrit un temps neigeux.
    example_gloss: En hiver, il neige.
  fa.a1.unit07.lesson01.teach.or_word:
    title: Ou
    gloss: ou
    note: یا relie deux conditions météo possibles.
    target_text: یا (ou)
  fa.a1.unit07.lesson02.teach.hot:
    title: Chaud
    gloss: chaud
    note: گرم décrit un temps chaud ou, plus généralement, la chaleur.
    example_gloss: Il fait chaud aujourd’hui.
  fa.a1.unit07.lesson02.teach.cold:
    title: Froid
    gloss: froid
    note: سرد décrit un temps froid ou, plus généralement, le froid.
    example_gloss: En hiver, il fait froid.
  fa.a1.unit07.lesson02.teach.cool:
    title: Frais
    gloss: frais
    note: خنک décrit un temps doux et frais, entre گرم et سرد.
    example_gloss: Le soir, il fait frais.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: Le temps
    gloss: le temps (météo)
    note: هوا est le mot général pour le temps qu’il fait (il signifie aussi « air »).
    example_gloss: Quel temps fait-il aujourd’hui ?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: Demander quel temps il fait
    gloss: Quel temps fait-il ?
    note: هوا چطوره؟ reprend چطوره, le même mot interrogatif familier « comment est » déjà vu dans حالتون چطوره؟ à l’unité 1.
  fa.a1.unit07.lesson03.teach.today_word:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: امروز désigne le jour présent.
    example_gloss: Il fait beau aujourd’hui.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: Demain
    gloss: demain
    note: فردا désigne le lendemain.
    example_gloss: À demain.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: Dire qu’il fait soleil aujourd’hui
    gloss: Aujourd’hui, il fait soleil.
    note: امروز هوا آفتابیه utilise la contraction familière en -e (آفتابیه = آفتابی است) déjà vue dans ce cours.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: Dire qu’il fait froid aujourd’hui
    gloss: Aujourd’hui, il fait froid.
    note: امروز سرده suit le même schéma de contraction.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: La contraction familière en -e
    gloss: آفتابیه est la contraction parlée courante de آفتابی است.
    note: 'Ce même schéma (adjectif + ه) s’applique à tout mot de météo : سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: Dire qu’il pleut aujourd’hui
    gloss: Aujourd’hui, il pleut.
    note: امروز بارونیه applique la même contraction en -e à بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: Parce que / puisque
    gloss: parce que / puisque
    note: چون introduit la raison d’une suggestion.
    example_gloss: Je mets un manteau parce qu’il fait froid.
  fa.a1.unit07.lesson05.teach.better_to:
    title: Suggérer de prendre un parapluie
    gloss: Mieux vaut prendre un parapluie.
    note: بهتره چتر ببریم utilise بهتره (« il vaut mieux », forme familière) pour faire une suggestion en douceur.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Combiner une raison et une suggestion
    gloss: Comme il pleut, mieux vaut prendre un parapluie.
    note: چون بارونیه، بهتره چتر ببریم associe une raison liée à la météo et une suggestion.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Suggérer de mettre un manteau
    gloss: Comme il fait froid, mieux vaut mettre un manteau.
    note: چون سرده، بهتره کت بپوشیم suit le même schéma raison + suggestion, appliqué au froid.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Suggérer de mettre un manteau
    gloss: mieux vaut mettre un manteau
    note: کت بپوشیم suit le même schéma que چتر ببریم (بهتره + verbe), appliqué au froid.
    example_gloss: Il fait froid, mettons un manteau.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Sara demande quel temps il fait aujourd’hui
    gloss: Sara demande quel temps il fait aujourd’hui.
    note: هوا چطوره؟ reprend la question de la leçon 3.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Reza dit qu’il pleut
    gloss: Reza dit qu’il pense qu’il pleut.
    note: فکر کنم (« je pense ») atténue l’affirmation, car il suppose sans en être sûr.
  fa.a1.unit07.lesson06.teach.turn03:
    title: Sara suggère de prendre un parapluie
    gloss: Sara dit qu’alors mieux vaut prendre un parapluie.
    note: پس (« alors ») relie le constat météo à la suggestion.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Reza est d’accord et demande pour demain
    gloss: Reza est d’accord et demande ce qu’il en est pour demain.
    note: فردا چی؟ est une façon naturelle et concise de poser la question pour le lendemain.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Sara décrit le temps de demain
    gloss: Sara dit que demain, il fera beau et chaud.
    note: آفتابیه و گرمه associe deux formes contractées de la météo avec و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Reza propose d’aller au parc
    gloss: Reza dit que c’est super, alors allons au parc.
    note: عالیه (super) exprime une réaction positive avant de proposer le projet.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Sara accepte et dit au revoir
    gloss: Sara accepte et dit qu’elle le verra demain.
    note: باشه (d’accord) est une façon familière courante d’accepter un projet.
