teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: Je me réveille
    gloss: je me réveille
    note: بیدار می‌شم est la forme familière de Téhéran de بیدار می‌شوم.
    example_gloss: Je me réveille à sept heures chaque jour.
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: Je prends mon petit-déjeuner
    gloss: je prends mon petit-déjeuner
    note: صبحونه می‌خورم emploie le mot familier صبحونه (petit-déjeuner) plutôt que le mot plus soutenu صبحانه.
    example_gloss: Je prends mon petit-déjeuner et je vais au travail.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: Je vais au travail
    gloss: Je vais au travail
    note: میرم سر کار est la forme familière de می‌روم سر کار.
    example_gloss: Ensuite, je vais au travail.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: Je vais me coucher
    gloss: Je vais me coucher
    note: می‌خوابم signifie « je dors » ou « je vais me coucher ».
    example_gloss: Je me couche tôt le soir.
  fa.a1.unit11.lesson01.teach.va_word:
    title: Et
    gloss: et
    note: '*و* est le mot de liaison courant pour enchaîner des activités de la routine, déjà présenté dans l’unité 9.'
    example_gloss: Je me réveille et je prends mon petit-déjeuner.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: À quelle heure te réveilles-tu ?
    gloss: À quelle heure te réveilles-tu ?
    note: '*ساعت چند بیدار می‌شی؟* reprend *ساعت چند* (à quelle heure) vu dans les leçons sur l’heure de l’unité 9.'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: Je me réveille à sept heures.
    gloss: Je me réveille à sept heures.
    note: ساعت هفت بیدار می‌شم indique une heure de réveil précise.
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: Chaque jour
    gloss: chaque jour
    note: هر روز signifie « tous les jours » et sert à présenter une routine comme une habitude.
    example_gloss: Je me réveille à sept heures chaque jour.
  fa.a1.unit11.lesson03.teach.bad:
    title: Après ça
    gloss: après ça
    note: بعدش signifie « après ça » et sert à enchaîner les activités d’une routine.
    example_gloss: Je me réveille, puis je prends mon petit-déjeuner.
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: Matin, midi, après-midi, nuit
    gloss: matin, midi, après-midi, nuit
    note: '*صبح*, *ظهر*, *عصر* et *شب* sont les quatre moments de la journée, révisés depuis l’unité 9.'
    example_gloss:
    - Je me réveille le matin.
    - Je déjeune à midi.
    - Je travaille l’après-midi.
    - Je dors la nuit.
  fa.a1.unit11.lesson03.teach.night_routine:
    title: Le soir, je me couche à onze heures.
    gloss: Le soir, je me couche à onze heures.
    note: '*شب‌ها ساعت یازده می‌خوابم* s’appuie sur *شب* (nuit, soir) du vocabulaire des moments de la journée de l’unité 9 ; *شب‌ها* signifie « le soir » comme habitude.'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: Texte de routine
    gloss: Tous les jours, je me réveille à sept heures. Après ça, je prends mon petit-déjeuner et je vais au travail.
    note: C’est une vraie description suivie d’une routine matinale, qui utilise هر روز et بعدش pour enchaîner les activités.
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: Et toi ?
    gloss: Et toi ?
    note: تو چی؟ sert à renvoyer la question à l’autre personne.
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: Un peu plus tard
    gloss: un peu plus tard
    note: یه‌کم دیرتر signifie « un peu plus tard » et sert à comparer deux routines.
  fa.a1.unit11.lesson06.teach.turn01:
    title: Tu te réveilles à quelle heure tous les jours ?
    gloss: Tu te réveilles à quelle heure tous les jours ?
    note: Sara commence par demander à Nima à quelle heure il se réveille.
  fa.a1.unit11.lesson06.teach.turn02:
    title: Je me réveille à sept heures. Et toi ?
    gloss: Je me réveille à sept heures. Et toi ?
    note: Nima répond et renvoie la question à Sara.
  fa.a1.unit11.lesson06.teach.turn03:
    title: Moi, un peu plus tard, à huit heures.
    gloss: Moi, un peu plus tard, à huit heures.
    note: Sara compare son heure de réveil à celle de Nima.
  fa.a1.unit11.lesson06.teach.turn04:
    title: Qu’est-ce que tu fais après t’être réveillé ?
    gloss: Qu’est-ce que tu fais après t’être réveillé ?
    note: Nima demande quelle est l’étape suivante de la routine de Sara.
  fa.a1.unit11.lesson06.teach.turn05:
    title: Je prends mon petit-déjeuner et je vais au travail. Le soir, je me couche généralement à onze heures.
    gloss: Je prends mon petit-déjeuner et je vais au travail. Le soir, je me couche généralement à onze heures.
    note: Sara décrit le reste de sa routine en une seule réponse, avec les mêmes heures de réveil et de coucher que plus haut dans l’unité.
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: Il/elle se réveille, il/elle se couche
