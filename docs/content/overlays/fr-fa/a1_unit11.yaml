    note: بیدار می‌شه et می‌خوابه sont les formes de la 3e personne (او), nécessaires pour résumer ce que font Sara ou Nima, par opposition aux formes de la 1re personne (بیدار می‌شم، می‌خوابم) utilisées ailleurs dans cette unité.
