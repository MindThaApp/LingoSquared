course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : décrire des symptômes simples, demander de l’aide, comprendre des conseils de santé simples, lire un court mot sur des symptômes, et dialogue où un ami donne des conseils.'
units:
  fa.a1.unit17.health:
    title: La santé
    description: Exprimer un problème de santé simple et comprendre des conseils immédiats simples.
lessons:
  fa.a1.unit17.lesson01.basic_symptoms:
    title: Symptômes de base
  fa.a1.unit17.lesson02.more_symptoms:
