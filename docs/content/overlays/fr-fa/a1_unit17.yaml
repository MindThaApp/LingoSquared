  fa.a1.unit17.lesson06.advice_dialogue:
    title: Un dialogue pour donner des conseils
teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: Je ne me sens pas bien
    gloss: je ne me sens pas bien
    note: 'حالم خوب نیست signifie littéralement « mon état n’est pas bon » : c’est la façon habituelle de dire qu’on ne se sent pas bien.'
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: Mal de tête
    gloss: mal de tête
    note: سردرد signifie « mal de tête ».
    example_gloss: J’ai mal à la tête.
  fa.a1.unit17.lesson01.teach.daram_word:
    title: J’ai
    gloss: j’ai
    note: دارم signifie « j’ai » et s’emploie avec un nom de symptôme (سردرد دارم = j’ai mal à la tête).
    target_text: دارم (j’ai)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Fièvre
    gloss: fièvre
    note: تب signifie « fièvre ».
    example_gloss: J’ai de la fièvre.
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: J’ai mal au ventre
    gloss: j’ai mal au ventre
    note: 'دلم درد می‌کنه signifie littéralement « mon ventre fait douleur » : c’est la façon familière de dire qu’on a mal au ventre.'
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Je suis fatigué
    gloss: je suis fatigué(e)
    note: '*خسته‌ام* signifie « je suis fatigué(e) » : la terminaison *-ام* est la forme courte de *هستم* (je suis) attachée à *خسته* (fatigué).'
    example_gloss: Aujourd’hui, je suis fatigué(e).
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Aide
    gloss: aide
    note: کمک signifie « aide ».
    example_gloss: Peux-tu m’aider ?
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: Tu peux
    gloss: tu peux
    note: می‌تونی est la contraction familière de می‌توانی (tu peux), à la deuxième personne informelle.
    target_text: می‌تونی (tu peux, familier)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: Pouvez-vous m’aider ?
    gloss: Pouvez-vous m’aider ?
    note: '*می‌تونی کمکم کنی؟* associe *می‌تونی* (tu peux) et *کمکم کنی* (littéralement « fais mon aide », c’est-à-dire « aide-moi »).'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: Médecin
    gloss: médecin
    note: دکتر signifie « médecin ».
    example_gloss: Le médecin a dit de se reposer.
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: Médicament
    gloss: médicament
    note: دارو signifie « médicament ».
    example_gloss: Prends ce médicament.
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: Repose-toi (ordre)
    gloss: repose-toi
    note: 'استراحت کن est l’impératif informel : repose-toi !'
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Bois de l’eau (ordre)
    gloss: bois de l’eau
    note: 'آب بخور est l’impératif informel : bois de l’eau !'
  fa.a1.unit17.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: و signifie « et » ; il relie deux propositions ou deux éléments.
    target_text: و (et)
  fa.a1.unit17.lesson05.teach.reading_text:
    title: Exemple de note sur des symptômes
    gloss: J’ai mal à la tête et de la fièvre. Je suis fatigué(e).
    note: Une courte note à la première personne qui réunit le vocabulaire des symptômes de cette unité.
  fa.a1.unit17.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: Des prénoms iraniens courants, utilisés tout au long de ce cours.
    example_gloss:
    - Nima a mal à la tête.
    - Sara aide Nima.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: Aussi
    gloss: aussi
    note: هم signifie « aussi » et se place après le mot qu’il complète (آب هم بخور = bois aussi de l’eau).
    target_text: هم (aussi)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: Ça va
    gloss: bien
    note: باشه est la contraction familière de باشد (d’accord).
    example_gloss: D’accord, je vais me reposer.
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: Merci
    gloss: merci
    note: ممنون signifie « merci ».
    example_gloss: Merci pour ton aide.
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: Il/elle a
    gloss: il/elle a
    note: 'داره est la forme familière de la troisième personne de دارد (il/elle a) : elle suit le même modèle que دارم à la première personne.'
    target_text: داره (il/elle a, 3e personne familière)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Nima dit
    gloss: Je ne me sens pas bien. J’ai mal à la tête et de la fièvre.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: Sara conseille
    gloss: Repose-toi. Bois aussi de l’eau.
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: Nima répond
    gloss: D’accord, merci.
