    title: 'Lecture : l’usage de la technologie par Nima et Sara'
    gloss: Sara utilise beaucoup son téléphone. Elle prend des photos et envoie des messages. Sara utilise aussi un ordinateur à la maison. Nima utilise Internet tous les jours.
    note: 'Ce texte reprend le dialogue à la 3e personne. Il n’y a presque aucun mot nouveau : c’est un entraînement à reconnaître les mots dans un texte suivi.'
