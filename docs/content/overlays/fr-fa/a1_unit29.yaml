course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer les appareils du quotidien (téléphone, ordinateur, internet, application), les actions du téléphone (envoyer un message, appeler, prendre une photo, télécharger une application), demander et dire combien de fois tu utilises ton téléphone (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), un texte à lire sur les habitudes de *نیما* et de *سارا* avec leurs appareils, et un dialogue final entre *نیما* et *سارا* sur la façon dont chacun utilise la technologie.'
