    note: '*هر روز چند بار از گوشیت استفاده می‌کنی؟* rassemble tous les éléments de cette leçon.'
  fa.a1.unit29.lesson03.teach.answer_har_ruz:
    title: J’utilise Internet tous les jours
    gloss: J’utilise Internet tous les jours
    note: '*هر روز از اینترنت استفاده می‌کنم* répond avec la forme de la première personne apprise plus tôt dans cette unité.'
