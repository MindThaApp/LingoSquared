    example_gloss: La technologie, c’est bien.
  fa.a1.unit29.lesson01.teach.goshi_word:
    title: Téléphone / portable
    gloss: téléphone / portable
    note: '*گوشی* (littéralement « combiné ») est le mot familier et courant en Iran pour « téléphone portable » ; il est plus fréquent à l’oral que *موبایل*.'
    example_gloss: J’ai un téléphone.
  fa.a1.unit29.lesson01.teach.computer_word:
