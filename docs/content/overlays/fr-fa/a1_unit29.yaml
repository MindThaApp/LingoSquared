    example_gloss: Cet ordinateur est bien.
  fa.a1.unit29.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: '*اینترنت* est l’emprunt courant pour « internet ».'
    example_gloss: Internet, c’est bien.
  fa.a1.unit29.lesson01.teach.app_word:
    title: L’application
    gloss: application
    note: '*اپلیکیشن* signifie « appli » ou « application » et s’emploie couramment.'
    example_gloss: Cette application est bien.
  fa.a1.unit29.lesson01.teach.review_man_in_daram:
    title: Je / ceci / j’ai
    gloss: je / ce, cette / j’ai
    note: '*من*, *این* et *دارم* sont des mots que tu connais déjà ; ils reviennent ici pour parler des appareils que tu possèdes.'
    target_text: من (je) / این (ceci, ce) / دارم (j’ai)
  fa.a1.unit29.lesson01.teach.review_estefade_mikonam:
    title: Utiliser + je fais = j’utilise
    gloss: utilisation + je fais = j’utilise
    note: '*استفاده* se combine avec *می‌کنم* (« je fais ») pour dire « j’utilise ». *از* introduit ce que tu utilises.'
    target_text: استفاده (usage) + می‌کنم (je fais) = استفاده می‌کنم (j’utilise)
  fa.a1.unit29.lesson01.teach.combined_sentence:
    title: J’utilise internet
    gloss: J’utilise Internet
    note: '*من از اینترنت استفاده می‌کنم* combine *من* + *از* + *اینترنت* + *استفاده می‌کنم*.'
  fa.a1.unit29.lesson02.teach.review_peyam:
    title: Message
