course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : décrire la taille d’une personne (grand/petit), ses cheveux (longueur et couleur : noirs, blonds), la couleur des yeux (marron, verts, bleus) et le port de lunettes, demander « Il/Elle ressemble à quoi ? », un court texte où نیما se décrit et un dialogue final entre نیما et سارا pour reconnaître مریم, l’amie de سارا.'
units:
