  fa.a1.unit25.lesson06.new_friend_dialogue:
    title: 'Dialogue : une nouvelle amie'
teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Il / elle
    gloss: il / elle
    note: '*او* réapparaît ici comme sujet des descriptions physiques.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Taille
    gloss: taille
    note: '*قد* réapparaît ici seul. *قدش* ajoute le suffixe possessif *-ش* (sa taille), sur le même modèle que *امتحانش* de l’unité 20.'
    example_gloss: Nima est grand.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Grand
    gloss: grand
    note: '*بلند* signifie grand (ou long). *قدش بلنده* signifie littéralement « sa taille est haute » : la façon familière naturelle de dire que quelqu’un est grand.'
    example_gloss: Il est grand.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Petit
    gloss: petit
    note: '*کوتاه* signifie petit (de taille) ou court.'
    example_gloss: Il est petit.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Les cheveux
    gloss: cheveux
    note: '*مو* signifie cheveux. *موی* est la forme avec ezafe employée devant un adjectif, comme dans *موی بلند* (cheveux longs).'
    example_gloss: Il a les cheveux longs.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Ses cheveux
    gloss: ses cheveux
    note: '*موهاش* combine le pluriel *موها* (les cheveux) et le suffixe possessif *-ش* : « ses cheveux ».'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Noir
    gloss: noir
    note: '*مشکی* est le mot courant pour des cheveux/yeux noirs, plus naturel ici que *سیاه* de l’unité 20, qui convient mieux aux vêtements qu’aux cheveux.'
    example_gloss: Ses cheveux sont noirs.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: '*بلوند* (mot emprunté) signifie blond.'
    example_gloss: Ses cheveux sont blonds.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Œil
    gloss: œil
    note: '*چشم* signifie œil. *چشمای* est la forme familière du pluriel avec ezafe (les yeux de…), comme dans *چشمای آبی* (yeux bleus).'
    example_gloss: Il a les yeux marron.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Ses yeux
    gloss: ses yeux
    note: '*چشماش* combine le pluriel familier *چشما* et le suffixe possessif *-ش* : « ses yeux ». Remarque : *چشماش آبیه* utilise la terminaison du singulier *-ه* bien que *چشما* soit pluriel ; c’est normal en persan, où les choses non humaines au pluriel prennent généralement un verbe au singulier.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Marron
    gloss: marron
    note: '*قهوه‌ای* (littéralement « couleur café ») signifie marron.'
    example_gloss: Ses yeux sont marron.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Vert
    gloss: vert
    note: '*سبز* signifie vert.'
    example_gloss: Ses yeux sont verts.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Bleu
    gloss: bleu
    note: '*آبی* réapparaît ici pour la couleur des yeux.'
    example_gloss: Ses yeux sont bleus.
  fa.a1.unit25.lesson04.teach.man_review:
    title: je
    gloss: je
    note: '*من*, déjà bien connu, réapparaît ici pour se décrire soi-même.'
    example_gloss: J’ai les cheveux marron.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: J’ai / il-elle a
    gloss: j’ai / il-elle a
    note: '*دارم*/*داره* s’emploient de la même façon avec un trait physique : *موی مشکی دارم* signifie « J’ai les cheveux noirs ».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Lunettes
    gloss: lunettes
    note: '*عینک* signifie lunettes.'
    example_gloss: Il porte des lunettes.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Il/elle porte
    gloss: il/elle porte
    note: '*می‌زنه* (littéralement « frappe ») est le verbe naturel pour porter des lunettes : *عینک می‌زنه* signifie « il/elle porte des lunettes », un verbe différent de *می‌کنم* (faire) des unités 8 et 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: À quoi ressemble-t-il/elle ?
    gloss: il/elle est comment ?
    note: '*چه شکلیه؟* signifie littéralement « quelle forme est-il/elle ? » : la façon familière courante de demander à quoi ressemble quelqu’un.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: Et
    gloss: et
    note: '*و* signifie « et » : déjà employé ainsi dans les unités 14 et 24.'
    example_gloss: Il est grand et ses cheveux sont noirs.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personnage présenté dès l’unité 11, réapparaît ici.'
    example_gloss: Nima est l’ami de Sara.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lecture : l’apparence de Nima'
    gloss: Nima est grand. Il a les cheveux noirs et les yeux marron. Il porte des lunettes.
    note: 'Ce texte reprend toutes les structures des leçons 1 à 4, presque sans vocabulaire nouveau : il s’agit de les reconnaître dans un texte suivi.'
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* est un nouveau personnage : une amie de سارا que نیما ne connaît pas encore.'
    example_gloss: Maryam est l’amie de Sara.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Maintenant
    gloss: maintenant
    note: '*الان* réapparaît ici.'
    example_gloss: Maryam arrive maintenant.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Vient
    gloss: vient
    note: '*میاد* est la forme familière du présent du verbe *آمدن* (venir).'
    example_gloss: Maryam arrive maintenant.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: De quelle couleur est-ce ?
    gloss: de quelle couleur est-ce ?
    note: '*چه رنگیه؟* combine *چه* (quel, de la leçon 4), *رنگی* (coloré, de *رنگ* + *-ی*) et *-ه* (est) : « de quelle couleur est-il/elle ? »'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: D’accord, merci
    gloss: d’accord, merci
    note: '*باشه* et *ممنون*, déjà vus, se combinent ici en une réplique de clôture naturelle.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara : Maryam arrive.'
    gloss: Maryam arrive maintenant.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima : Elle est comment, Maryam ?'
    gloss: Elle est comment, Maryam ?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara : Elle est grande et elle a les cheveux noirs.'
    gloss: Elle est grande et elle a les cheveux noirs.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima : De quelle couleur sont ses yeux ?'
    gloss: De quelle couleur sont ses yeux ?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara : Elle a les yeux marron.'
    gloss: Elle a les yeux marron.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima : D’accord, merci.'
    gloss: D’accord, merci.
