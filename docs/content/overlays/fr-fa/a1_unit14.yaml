course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : exprimer ses goûts, demander des préférences, choisir entre plusieurs options, donner des raisons simples, et courte lecture/dialogue sur les préférences de deux personnes.'
units:
  fa.a1.unit14.preferences:
    title: Préférences
    description: Exprimer et demander ce qu’on aime ou non, avec des raisons simples.
lessons:
  fa.a1.unit14.lesson01.basic_likes:
    title: 'Goûts simples : aimer et ne pas aimer'
  fa.a1.unit14.lesson02.asking_preferences:
    title: Demander les préférences
  fa.a1.unit14.lesson03.choosing_between_options:
    title: Choisir entre deux choses
  fa.a1.unit14.lesson04.giving_reasons:
    title: Donner une raison
  fa.a1.unit14.lesson05.reading_about_preferences:
    title: Lire sur les préférences
  fa.a1.unit14.lesson06.preferences_dialogue:
    title: Un dialogue sur les préférences
teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: J’aime
    gloss: j’aime
    note: دوست دارم signifie littéralement « j’ai de l’amitié (pour cela) » ; c’est la façon courante de dire « j’aime ».
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Le café
    gloss: café
    note: قهوه signifie « café ».
    example_gloss: J’aime le café.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Le thé
    gloss: thé
    note: چای signifie « thé ».
    example_gloss: Je n’aime pas le thé.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Je n’aime pas
    gloss: je n’aime pas
    note: دوست ندارم est la forme négative de دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: je
    gloss: je
    note: 'من signifie « je » : il est souvent facultatif, car la terminaison du verbe indique déjà le sujet, mais on peut l’ajouter pour insister.'
    example_gloss: J’aime la musique.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Lequel / Quel
    gloss: quel / lequel
    note: کدوم signifie « lequel / laquelle ».
    example_gloss: Lequel aimez-vous ?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: La musique
    gloss: musique
    note: موسیقی signifie « musique ».
    example_gloss: J’aime la musique.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Tu veux
    gloss: tu veux
    note: می‌خوای est la forme familière de la deuxième personne de می‌خواهی (tu veux).
    target_text: می‌خوای (tu veux, familier)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Lequel aimez-vous ?
    gloss: Lequel aimez-vous ?
    note: 'کدوم رو دوست داری؟ : رو marque le complément d’objet (را à l’écrit) et داری est la deuxième personne de داشتن (avoir).'
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Plus
    gloss: plus
    note: بیشتر signifie « plus » ou « davantage ».
    example_gloss: J’aime davantage le café.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Ou
    gloss: ou
    note: یا signifie « ou » ; il sert à proposer un choix entre deux choses.
    target_text: یا (ou)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Café ou thé ?
    gloss: Du café ou du thé ?
    note: قهوه یا چای؟ propose un choix entre les deux boissons vues dans la leçon 01.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Parce que
    gloss: parce que
    note: چون introduit une raison.
    target_text: چون (parce que)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: C’est délicieux
    gloss: c’est délicieux
    note: خوشمزه‌ست est la contraction familière de خوشمزه است (c’est délicieux).
    example_gloss: Le café est délicieux.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: C’est intéressant
    gloss: c’est intéressant
    note: جالبه est la contraction familière de جالب است (c’est intéressant).
    example_gloss: Cette musique est intéressante.
  fa.a1.unit14.lesson04.teach.va_word:
    title: Et
    gloss: et
    note: '*و* signifie « et » et peut relier deux courtes affirmations, par exemple aimer quelque chose et le décrire. Il est plus lâche que *چون* (parce que), qui donne directement la raison.'
    target_text: و (et)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Un prénom féminin iranien courant.
    example_gloss: Sara aime le thé.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Il/elle aime
    gloss: il/elle aime
    note: 'داره est la forme familière de la troisième personne de دارد (a) : دوست داره signifie « il/elle aime », sur le modèle de دوست دارم à la première personne.'
    target_text: دوست داره (il/elle aime, 3e personne familière)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: Il/elle n’aime pas
    gloss: il/elle n’aime pas
    note: 'نداره est la forme négative familière de la troisième personne : دوست نداره signifie « il/elle n’aime pas ».'
    target_text: دوست نداره (il/elle n’aime pas, 3e personne familière)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: C’est chaud
    gloss: c’est chaud
    note: گرمه est la contraction familière de گرم است (c’est chaud).
    example_gloss: Le thé est chaud.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Exemple de texte sur les préférences
    gloss: Sara aime le thé parce qu’il est chaud. Sara n’aime pas la musique.
    note: Un court récit à la troisième personne qui réunit le vocabulaire des préférences de cette unité.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima et Sara
    gloss: Nima, Sara
    note: Des prénoms iraniens courants, utilisés tout au long de ce cours.
    example_gloss:
    - Nima aime le thé.
    - Sara aime le café.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: Et toi ?
    gloss: Et toi ?
    note: تو چی؟ est une façon courte et courante de renvoyer la question à l’autre personne.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: C’est super
    gloss: c’est super
    note: عالیه est la contraction familière de عالی است (c’est super).
    example_gloss: C’est super.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima demande
    gloss: Thé ou café, lequel aimez-vous le plus ?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara répond
    gloss: J’aime davantage le café parce qu’il est délicieux. Et vous ?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima répond
    gloss: J’aime le thé parce qu’il est chaud.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara réagit
    gloss: C’est super !
