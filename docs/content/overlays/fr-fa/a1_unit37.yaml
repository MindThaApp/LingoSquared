    title: La voiture n’est pas noire, elle est blanche
    gloss: La voiture n’est pas noire, elle est blanche.
    note: '*نیست* nie la copule contractée, déjà vue dans l’unité sur les émotions, sur le même modèle que *تنبل نیست* (« il/elle n’est pas paresseux(se) ») de l’unité sur la personnalité.'
    target_text: ماشین سیاه نیست، سفیده. (La voiture n’est pas noire, elle est blanche.) — نیست nie la copule contractée
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: De quelle couleur est-ce ?
    gloss: De quelle couleur est-il ?
    note: '*رنگش* ajoute à *رنگ* (« couleur ») le suffixe possessif *ش* (« son/sa »), sur le même modèle que *شخصیتش*/*موهاش*/*چشماش*. *چیه؟* (« qu’est-ce que c’est ? ») a déjà été vu dans l’unité des présentations (*اسم شما چیه؟*).'
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: De quelle couleur est-ce ? (variante)
    gloss: De quelle couleur est-il ?
    note: '*چه رنگیه؟* est une autre façon, tout aussi courante, de poser la même question, sur le même modèle que *چه جوریه؟* de l’unité sur la personnalité.'
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
    title: La couleur de ma voiture est bleue
    gloss: La couleur de ma voiture est bleue.
    note: '*ماشینم* ajoute à *ماشین* (« voiture ») le suffixe possessif *م* (« ma/mon »), sur le même modèle que *اسمم*/*پدرم*.'
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: Deux façons de demander de quelle couleur est quelque chose
    gloss: de quelle couleur est-ce ? / de quelle couleur est-ce ?
    note: '*رنگش چیه؟* et *چه رنگیه؟* posent la même question et sont interchangeables à l’oral.'
    target_text: رنگش چیه؟ (de quelle couleur est-ce ? — suffixe possessif ش, comme dans شخصیتش/موهاش/چشماش) / چه رنگیه؟ (autre formulation, même modèle que چه جوریه؟)
  fa.a1.unit37.lesson04.teach.ketabet:
    title: De quelle couleur est ton livre ?
    gloss: De quelle couleur est ton livre ?
    note: '*کتابت* ajoute à *کتاب* (« livre ») le suffixe possessif familier *ت* (« ton/ta »), sur le même modèle en registre *تو* que *شخصیتت* de l’unité sur la personnalité.'
  fa.a1.unit37.lesson04.teach.mashinet:
    title: De quelle couleur est ta voiture ?
    gloss: De quelle couleur est ta voiture ?
    note: '*ماشینت* ajoute le même suffixe possessif familier *ت* à *ماشین* (« voiture »).'
  fa.a1.unit37.lesson04.teach.review_dislike_like:
    title: J’aime la couleur bleue
    gloss: J’aime la couleur bleue.
    note: '*دوست دارم* (« j’aime ») et *رو* (marque de l’objet) ont déjà été vus dans l’unité sur les préférences.'
    target_text: رنگ آبی رو دوست دارم. (J’aime la couleur bleue.) — reprend دوست دارم/رو de l’unité sur les préférences
  fa.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Nima : Sara, de quelle couleur est ton livre ?'
    gloss: Sara, de quelle couleur est ton livre ?
