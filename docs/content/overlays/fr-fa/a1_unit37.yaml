  description: 'Persan d’Iran débutant : nommer et décrire les couleurs d’objets du quotidien (fruit, meuble, animal de compagnie, livre, maison), demander de quelle couleur est quelque chose, et un dialogue où deux amis comparent leurs couleurs préférées.'
