  fa.a1.unit37.lesson05.teach.reading_text:
    title: 'Lecture : Ma maison'
    gloss: Ma maison est blanche. Dans la maison, il y a une table grise. Sur la table, il y a un livre rouge et un livre jaune. Mon chat est là aussi, il est orange.
