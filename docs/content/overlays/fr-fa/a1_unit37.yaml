    title: 'Couleurs déjà connues : blanc / noir / rouge / bleu / vert / marron'
    gloss: couleur / blanc / noir / rouge / bleu / vert / marron
    note: '*رنگ* (« couleur »), *سفید*, *سیاه*, *قرمز* et *آبی* ont déjà été vus dans l’unité sur les vêtements ; *سبز* et *قهوه‌ای* ont déjà été vus dans l’unité sur l’apparence. Cette unité les réutilise sans les réexpliquer.'
    target_text: رنگ (couleur) / سفید (blanc) / سیاه (noir) / قرمز (rouge) / آبی (bleu) / سبز (vert) / قهوه‌ای (marron) — déjà vus dans les unités précédentes
  fa.a1.unit37.lesson02.teach.banafsh:
