course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer le loisir et le temps libre, quatre activités courantes (lire, écouter de la musique, regarder des films, faire du sport/du football), dire à quelle fréquence on les pratique, demander à quelqu’un ce qu’il fait pendant son temps libre, un court texte sur les loisirs de نیما et un dialogue final entre نیما et سارا.'
