    title: Un dialogue sur les loisirs
teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: Le temps libre
    gloss: temps libre
    note: '*وقت آزاد* signifie temps libre, littéralement « temps libre/ouvert ».'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Passe-temps
    gloss: passe-temps
    note: '*سرگرمی* signifie loisir ou passe-temps.'
    example_gloss: Lire est un loisir.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Lire des livres
    gloss: lire des livres
    note: '*کتاب خوندن* signifie littéralement « lecture de livres » : *کتاب* (livre) a été vu plus tôt, *خوندن* (lire) est nouveau ici.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: J’aime…
    gloss: j’aime
    note: '*دوست دارم* s’emploie de la même façon avec une activité qu’avec une chose : *کتاب خوندن دوست دارم* signifie « J’aime lire des livres ».'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: La musique
    gloss: musique
    note: '*موسیقی* réapparaît ici.'
    example_gloss: J’écoute de la musique.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: J’écoute
    gloss: j’écoute
    note: '*گوش می‌دم* signifie littéralement « je donne l’oreille » : c’est la façon naturelle de dire « j’écoute » en persan.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: film
    note: '*فیلم* réapparaît ici.'
    example_gloss: Je regarde des films.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Je regarde / Je vois
    gloss: je regarde / je vois
    note: '*می‌بینم* est le présent du verbe dont le passé (*دیدم*, « j’ai vu ») a été vu plus tôt.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport
    gloss: sport
    note: '*ورزش* signifie à la fois « sport » et « exercice physique » en général.'
    example_gloss: Je fais du sport.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Je fais
    gloss: je fais
    note: '*می‌کنم* est le verbe général « je fais » employé dans les verbes composés comme *ورزش می‌کنم* (je fais du sport).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Le football
    gloss: football
    note: '*فوتبال* signifie football.'
    example_gloss: J’aime le football.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Je joue au football
    gloss: je joue au football
    note: '*بازی* signifie jeu ou jouer : *فوتبال بازی می‌کنم* signifie littéralement « je fais du jeu de football », c’est-à-dire « je joue au football ».'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Semaine
    gloss: semaine
    note: '*هفته* signifie semaine.'
    example_gloss: Je fais du sport chaque semaine.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: Chaque semaine
    gloss: chaque semaine
    note: '*هر* se combine de la même façon avec *هفته* pour former *هر هفته* (chaque semaine).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Parfois
    gloss: parfois
    note: '*گاهی* signifie parfois.'
    example_gloss: Parfois, je lis des livres.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: Que fais-tu pendant ton temps libre ?
    gloss: Que fais-tu pendant ton temps libre ?
    note: '*چیکار می‌کنی* a été vu plus tôt ; on le réutilise ici pour demander ce que quelqu’un fait pendant son temps libre.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personnage présenté dès l’unité 11, réapparaît ici.'
    example_gloss: Nima aime lire des livres.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: Quelques / combien
    gloss: quelques / combien
    note: '*چند* (combien/plusieurs) se combine avec le classificateur *تا* pour dire « quelques » ou « combien » devant un nom dénombrable.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: Il/elle lit
    gloss: il/elle lit
    note: '*می‌خونه* est la forme familière de la 3e personne du verbe *خوندن* (lire).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: Aussi
    gloss: aussi
    note: '*هم* signifie aussi, déjà employé ainsi dans l’unité 11.'
    example_gloss: Nima joue aussi au football.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: Il/elle fait
    gloss: il/elle fait
    note: '*می‌کنه* est la forme familière de la 3e personne correspondant à *می‌کنم* (je fais).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Lecture : le temps libre de Nima'
    gloss: Nima aime lire des livres. Chaque semaine, il lit quelques livres. Parfois, il joue aussi au football.
    note: '*چند تا* devant *کتاب* signifie « quelques livres » ; *می‌خونه* et *می‌کنه* sont les formes familières de la 3e personne, employées pour parler de quelqu’un d’autre.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personnage présenté dès l’unité 14, réapparaît ici.'
    example_gloss: Sara aime regarder des films.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Regarder / voir
    gloss: regarder / voir
    note: '*دیدن* est l’infinitif du verbe dont le présent (*می‌بینم*) a été enseigné dans la leçon 2 et le passé (*دیدم*) dans l’unité 13.'
    example_gloss: J’aime regarder des films.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Je vais au cinéma
    gloss: je vais au cinéma
    note: '*سینما* (cinéma) a été vu plus tôt ; *می‌رم* (je vais) a été vu dans *می‌رم سر کار* (je vais au travail).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Quoi / Quel
    gloss: quel / quoi
    note: '*چی* signifie « quoi / que » : déjà employé ainsi dans *تو چی؟* (Et toi ?) de l’unité 14.'
    example_gloss: Et toi ?
  fa.a1.unit24.lesson06.teach.va_word:
    title: Et
    gloss: et
    note: '*و* signifie « et » : déjà employé ainsi dans l’unité 14.'
    example_gloss: J’aime lire et j’aime le football.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Quelle bonne nouvelle !
    gloss: quelle bonne nouvelle !
    note: '*چه خوب!* a été vu plus tôt : une réaction positive courante, comme « super ! »'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima : Sara, que fais-tu pendant ton temps libre ?'
    gloss: Sara, que fais-tu pendant ton temps libre ?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara : J’aime regarder des films...'
    gloss: J’aime regarder des films. Je vais au cinéma chaque semaine. Et toi ?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima : J’aime lire des livres...'
    gloss: J’aime lire des livres. Parfois, je joue aussi au football.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara : Super !'
    gloss: Super !
