course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : vocabulaire de la nourriture et des boissons, commander poliment au restaurant, poser des questions sur la carte et les recommandations, les quantités, et les usages au restaurant, dont demander l’addition.'
units:
  fa.a1.unit06.food:
    title: La nourriture et la commande d’un repas
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Nourriture et boissons
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Commander poliment
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Demander la carte et une recommandation
  fa.a1.unit06.lesson04.quantities:
    title: Commander des quantités précises
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Les usages au restaurant et l’addition
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Une conversation complète au restaurant
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Le pain
    gloss: pain
    note: 'نان est la base de tous les repas iraniens : c’est souvent un pain plat servi avec presque tout.'
    example_gloss: J’aime le pain.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Riz
    gloss: riz
    note: برنج est au cœur de la plupart des plats principaux iraniens.
    example_gloss: Le riz au poulet est délicieux.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Le poulet
    gloss: poulet
    note: مرغ désigne à la fois l’oiseau et sa viande.
    example_gloss: Je mange du poulet.
  fa.a1.unit06.lesson01.teach.ab:
    title: L’eau
    gloss: eau
    note: آب est le mot courant pour désigner l’eau.
    example_gloss: Je veux de l’eau.
  fa.a1.unit06.lesson01.teach.chai:
    title: Le thé
    gloss: thé
    note: چای est la boisson offerte presque partout en Iran, déjà vue dans la leçon sur le taarof de l’unité 1.
    example_gloss: Un thé, s’il vous plaît.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Le café
    gloss: café
    note: قهوه est de plus en plus courant dans les villes iraniennes, à côté du thé.
    example_gloss: Le café est chaud.
  fa.a1.unit06.lesson01.teach.mive:
    title: Les fruits
    gloss: fruit
    note: میوه est un mot général qui couvre n’importe quel fruit.
    example_gloss: J’aime les fruits.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: Et / ou
    gloss: و (et), یا (ou)
    note: Ce sont deux mots de liaison courants pour relier des plats et des boissons dans une commande.
    target_text: و (et)، یا (ou)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Commander poliment un thé
    gloss: Je voudrais un thé.
    note: 'می‌خواستم est littéralement un passé de « vouloir », mais il sert de demande polie et adoucie, comme en français « je voudrais » : c’est le registre naturel avec un serveur ou un commerçant que tu ne connais pas.'
  fa.a1.unit06.lesson02.teach.lotfan:
    title: S’il vous plaît
    gloss: s’il vous plaît
    note: لطفاً permet d’adoucir presque n’importe quelle demande.
    example_gloss: Aidez-moi, s’il vous plaît.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Commander un thé de façon familière
    gloss: Je veux un thé.
    note: 'یه چای می‌خوام emploie یه (un) et می‌خوام (je veux), formes familières de l’oral : réserve-les à un ami proche ou à un membre de ta famille, pas à un serveur que tu viens de rencontrer.'
  fa.a1.unit06.lesson02.teach.register_note:
    title: Bien choisir le verbe pour commander
    gloss: Utilise می‌خواستم avec un inconnu ou un serveur ; utilise می‌خوام seulement avec un ami proche.
    note: C’est la version, appliquée à la commande, de la distinction de registre déjà vue pour les salutations dans l’unité 1.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Commander poliment du pain
    gloss: Je voudrais du pain.
    note: Le même schéma avec می‌خواستم s’applique à n’importe quel nom de plat ou de boisson.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Carte
    gloss: la carte, le menu
    note: منو est un mot emprunté (« menu »), employé comme en français.
    example_gloss: La carte, s’il vous plaît.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Demander la carte
    gloss: Avez-vous la carte ?
    note: 'منو دارید؟ demande littéralement « avez-vous la carte ? » : c’est la façon ordinaire de la demander.'
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Demander une recommandation
    gloss: Que recommandez-vous ?
    note: چی توصیه می‌کنید؟ est une question naturelle et courante adressée à un serveur.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Ce que le serveur te demande
    gloss: Que désirez-vous ?
    note: چی میل دارید؟ est la façon polie et habituelle dont un serveur ouvre l’échange de la commande.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Poulet kebab
    gloss: poulet kebab
    note: جوجه‌کباب (poulet mariné grillé) est l’un des plats les plus courants sur un menu iranien.
    example_gloss: Je vais commander le poulet kebab.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Le serveur recommande le plat
    gloss: Le poulet kebab est très bon aujourd’hui.
    note: خوبه est la contraction parlée familière de خوب است, naturelle dans une recommandation décontractée de serveur.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Oui, voici
    gloss: Oui, voici.
    note: بله signifie « oui » ; بفرمایید (déjà vu dans la leçon sur le taarof de l’unité 1) s’emploie ici encore en tendant quelque chose, par exemple la carte, à quelqu’un.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Un verre de thé
    gloss: un verre de thé
    note: لیوان (verre) est le mot de comptage pour les boissons servies dans un verre.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Deux morceaux de pain
    gloss: deux morceaux de pain
    note: تا est un mot de comptage placé après un nombre pour compter la plupart des objets ordinaires ; ici, deux morceaux de pain.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Une assiette de riz
    gloss: une assiette de riz
    note: بشقاب (assiette) est le mot de comptage pour un plat servi dans une assiette.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Faire une commande complète
    gloss: Une assiette de riz et deux morceaux de pain, s’il vous plaît.
    note: On peut relier plusieurs quantités avec و (et) dans une même commande.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Le mot de comptage تا
    gloss: 'تا se place après un nombre pour les éléments dénombrables : دو تا (deux), سه تا (trois).'
    note: C’est le même schéma de comptage que celui des nombres de l’unité 3, appliqué ici à la commande de nourriture.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: L’addition
    gloss: l’addition
    note: صورت‌حساب est le mot courant pour l’addition au restaurant.
    example_gloss: L’addition, s’il vous plaît.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Demander l’addition
    gloss: Pourriez-vous m’apporter l’addition, s’il vous plaît ?
    note: صورت‌حساب رو لطف می‌کنید؟ est une façon polie et naturelle de demander l’addition au restaurant.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Dire que le repas était délicieux
    gloss: C’était très bon.
    note: خیلی خوشمزه بود est un compliment naturel à faire au serveur ou à l’hôte après un repas.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Bon appétit
    gloss: Bon appétit
    note: نوش جان se dit à quelqu’un qui mange ou va manger, à peu près comme « bon appétit » ; la personne qui mange ne le dit pas à propos de son propre repas.
  fa.a1.unit06.lesson05.teach.chashm:
    title: La réponse polie d’un serveur
    gloss: Tout de suite.
    note: چشم، الان میارم est une façon respectueuse pour le personnel d’accepter une demande et d’annoncer qu’il l’apporte aussitôt.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restaurant
    gloss: restaurant
    note: رستوران est le mot ordinaire pour « restaurant », le cadre du dialogue de cette unité.
    example_gloss: Ce restaurant est bon.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Le serveur accueille le client
    gloss: Le serveur souhaite la bienvenue au client et lui demande ce qu’il désire.
    note: چی میل دارید؟ est la même question d’ouverture polie que dans la leçon 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Le client demande la carte
    gloss: Le client salue le serveur et demande la carte.
    note: منو دارید؟ ouvre l’échange de la commande.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Le serveur donne la carte
    gloss: Le serveur répond oui et tend la carte.
    note: بفرمایید est le même mot d’offre poli que dans l’unité 1, employé ici en tendant quelque chose à quelqu’un.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Le client demande une recommandation
    gloss: Le client demande au serveur ce qu’il recommande.
    note: چی توصیه می‌کنید؟ vient de la leçon 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Le serveur recommande un plat
    gloss: Le serveur dit que le jujeh kebab (brochette de poulet) est très bon aujourd’hui.
    note: جوجه‌کباب امروز خیلی خوبه utilise la forme familière خوبه, naturelle à l’oral pour une recommandation.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Le client passe une commande complète
    gloss: Le client accepte et commande un jujeh kebab avec du riz, ainsi qu’un thé.
    note: می‌خواستم est employé ici, ce qui convient face à un serveur que le client ne connaît pas personnellement.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Le serveur accuse réception de la commande
    gloss: Le serveur dit qu’il apporte ça tout de suite.
    note: چشم، الان میارم vient de la leçon 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Le client complimente le repas et demande l’addition
    gloss: Le client dit que c’était délicieux et demande l’addition.
    note: Les deux phrases reprennent directement le vocabulaire de la leçon 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Le serveur apporte l’addition
    gloss: Le serveur accepte et dit qu’il l’apporte tout de suite.
    note: البته (bien sûr) est une façon affirmative polie et naturelle de répondre ici.
