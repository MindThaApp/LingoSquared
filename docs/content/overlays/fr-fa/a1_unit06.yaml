  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: Que signifie cette expression ?
    correct_option: Je voudrais un thé. (poli)
    distractors:
    - Je veux un thé. (familier)
    - Vous avez du thé ?
    - Le thé est bon.
    accepted_answers:
    - value: Je voudrais un thé. (poli)
      status: correct
    feedback: می‌خواستم est la forme polie pour commander auprès de quelqu’un qu’on ne connaît pas bien.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام convient pour parler à…
    correct_option: un ami proche qui prépare du thé à la maison
    distractors:
    - un serveur que tu viens de rencontrer
    - un commerçant que tu ne connais pas
    - une personne âgée lors d’un dîner formel
    accepted_answers:
    - value: un ami proche qui prépare du thé à la maison
      status: correct
    feedback: می‌خوام est familier et courant à l’oral, réservé aux contextes proches et familiers.
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: Que signifie cette expression ?
    correct_option: Je voudrais un thé, s’il vous plaît. (poli)
    distractors:
    - Je veux un thé. (familier)
    - Vous avez un menu ?
    - Que recommandez-vous ?
    accepted_answers:
    - value: Je voudrais un thé, s’il vous plaît. (poli)
      status: correct
    feedback: یک چای می‌خواستم، لطفاً signifie « Je voudrais un thé, s’il vous plaît » (poli).
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: Associe chaque verbe de commande à son contexte d’emploi.
    accepted_answers:
