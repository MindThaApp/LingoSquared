course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer des moyens de transport (bus, métro, voiture, vélo, à pied, taxi), dire comment tu te déplaces régulièrement (tous les jours en bus pour aller au travail), demander quel transport est le meilleur (اتوبوس یا مترو، کدوم بهتره؟), demander le prix d’un billet local et lire une courte phrase d’horaires, un texte sur les trajets habituels de نیما et سارا, et un dialogue final entre نیما et سارا qui comparent leurs façons de se déplacer.'
