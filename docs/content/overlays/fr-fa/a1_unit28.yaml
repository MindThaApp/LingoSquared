teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: je
    gloss: je
    note: '*من*, déjà bien connu, revient ici pour dire comment on se déplace.'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: Par / avec
    gloss: avec / en
    note: '*با* est la préposition utilisée avec un véhicule : *با* + nom du véhicule + *می‌رم* veut dire « je vais en [véhicule] ».'
    target_text: با (par / avec)
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Autobus
    gloss: autobus
    note: '*اتوبوس* est le mot courant pour « bus ».'
    example_gloss: Je vais en bus.
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: Je vais en bus
    gloss: je vais en bus
    note: '*با اتوبوس می‌رم* combine *با* + *اتوبوس* + *می‌رم* (« je vais »).'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Le métro
    gloss: métro
    note: '*مترو* est un emprunt direct et courant : le métro de Téhéran s’appelle bien *مترو*.'
    example_gloss: Je vais en métro.
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: Je vais en métro
    gloss: je vais en métro
    note: '*با مترو می‌رم* suit exactement le même schéma *با* + véhicule + *می‌رم* que pour le bus.'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Voiture
    gloss: voiture
    note: '*ماشین* est le mot courant pour « voiture ».'
    example_gloss: Je vais en voiture.
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: Je vais en voiture
    gloss: je vais en voiture
    note: '*با ماشین می‌رم* suit le même schéma *با* + véhicule + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Vélo
    gloss: vélo
    note: '*دوچرخه* veut dire « vélo » ; littéralement « deux-roues ».'
    example_gloss: Je vais en vélo.
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: Je vais en vélo
    gloss: je vais en vélo
    note: '*با دوچرخه می‌رم* reprend encore une fois le même schéma.'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: Chaque jour
    gloss: chaque jour
    note: '*هر روز* revient ici pour décrire un trajet habituel.'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: Travailler
    gloss: travailler
    note: '*سر کار* veut dire « au travail » ; aucune préposition n’est nécessaire : *می‌رم* + *سر کار*.'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: Tous les jours, je vais au travail en voiture
    gloss: Tous les jours, je vais au travail en voiture
    note: '*هر روز با ماشین می‌رم سر کار* rassemble tout ce qu’on a vu dans cette leçon : fréquence, véhicule et destination.'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: À pied
    gloss: à pied
    note: '*پیاده* veut dire « à pied » ; contrairement aux véhicules vus jusqu’ici, il n’a PAS besoin de *با* : on dit *پیاده می‌رم*, et non *با پیاده می‌رم*.'
    example_gloss: Je vais à pied.
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: Je vais à pied (sans با)
    gloss: je vais à pied
    note: '*پیاده می‌رم* : *پیاده* fonctionne ici comme un adverbe, un peu comme « à pied » en français, qui se passe aussi de véhicule : on dit « j’y vais à pied ».'
    target_text: پیاده می‌رم (sans با)
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Taxi
    gloss: taxi
    note: '*تاکسی* est un emprunt direct et courant pour « taxi » ; il s’emploie AVEC *با*, comme les autres véhicules.'
    example_gloss: Je vais en taxi.
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: Je vais en taxi
    gloss: je vais en taxi
    note: '*با تاکسی می‌رم* suit le schéma régulier *با* + véhicule.'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Quel / lequel
    gloss: quel / lequel
    note: '*کدوم* veut dire « lequel » ; il sert ici à demander quel transport est le meilleur.'
    target_text: کدوم (lequel)
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: Mieux
    gloss: mieux
    note: '*بهتره* est le mot pour « est meilleur » ou « vaut mieux ».'
  fa.a1.unit28.lesson03.teach.ya_review:
    title: Ou
    gloss: ou
    note: '*یا* relie ici les deux choix de transport.'
    target_text: یا (ou)
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: Bus ou métro, lequel est le mieux ?
    gloss: Bus ou métro, lequel est le mieux ?
    note: '*اتوبوس یا مترو، کدوم بهتره؟* combine *یا* pour énumérer les choix avec *کدوم بهتره؟* pour demander un conseil.'
  fa.a1.unit28.lesson04.teach.belit_review:
    title: Billet
    gloss: billet
    note: '*بلیط* revient ici pour un billet de bus local ordinaire.'
    example_gloss: Où est le ticket de bus ?
  fa.a1.unit28.lesson04.teach.gheymat_review:
    title: Le prix
    gloss: le prix
    note: '*قیمت* veut dire « prix ».'
  fa.a1.unit28.lesson04.teach.cheghadr_review:
    title: Combien
    gloss: combien
    note: '*چقدر* sert ici à demander le prix d’un billet.'
  fa.a1.unit28.lesson04.teach.belit_cheghadr_phrase:
    title: Combien coûte un ticket de bus ?
    gloss: Combien coûte un ticket de bus ?
    note: '*بلیط اتوبوس چقدره؟* combine *بلیط اتوبوس* avec *چقدره* (« combien ça coûte »).'
  fa.a1.unit28.lesson04.teach.daghighe_review:
    title: Minute
    gloss: minute
    note: '*دقیقه* revient ici pour un horaire de bus.'
  fa.a1.unit28.lesson04.teach.panzdah_review:
    title: Quinze
    gloss: quinze
    note: '*پانزده* est employé ici pour la fréquence d’un bus.'
  fa.a1.unit28.lesson04.teach.miad_word:
    title: Il/elle vient
    gloss: il/elle vient
    note: '*میاد* est la forme familière courante de « il vient » (de *می‌آید*) ; elle sert ici à dire à quelle fréquence passe le bus.'
    target_text: میاد (il vient)
  fa.a1.unit28.lesson04.teach.sign_text:
    title: 'Lecture : un panneau d’arrêt de bus'
    gloss: Combien coûte un ticket de bus ? Le bus passe toutes les quinze minutes.
    note: Une courte phrase de panneau ou d’horaire qui associe la question du prix du ticket, vue dans cette leçon, et une indication de fréquence.
  fa.a1.unit28.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personnage présenté dès l’unité 11, revient ici.'
    example_gloss: Nima va au travail tous les jours.
  fa.a1.unit28.lesson05.teach.mire_review:
    title: Il/Elle va
    gloss: il/elle va
    note: '*می‌ره* est la forme familière de la 3ᵉ personne du verbe « aller ».'
  fa.a1.unit28.lesson05.teach.gahi_review:
    title: Parfois
    gloss: parfois
    note: '*گاهی* revient ici.'
  fa.a1.unit28.lesson05.teach.ham_review:
    title: Aussi
    gloss: aussi
    note: '*هم* veut dire « aussi » ; il est employé ici pour les trajets que Nima fait parfois à pied.'
    target_text: هم (aussi)
  fa.a1.unit28.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personnage présenté dès l’unité 2, revient ici.'
    example_gloss: Sara va à l’école tous les jours.
  fa.a1.unit28.lesson05.teach.madrese_review:
    title: École
    gloss: école
    note: '*مدرسه* est ici la destination du trajet de سارا.'
    example_gloss: Sara va à l’école.
  fa.a1.unit28.lesson05.teach.reading_text:
    title: 'Lecture : les trajets de Nima et de Sara'
    gloss: Nima va au travail en bus tous les jours. Parfois, il y va aussi à pied. Sara va à l’école en vélo tous les jours.
    note: 'Ce texte reprend toutes les constructions des leçons 1 à 4, plus *می‌ره* et *مدرسه* de la leçon 5 : presque aucun mot nouveau, il s’agit surtout de les reconnaître dans un texte suivi.'
  fa.a1.unit28.lesson06.teach.tochi_review:
    title: Et toi ?
    gloss: et toi ?
    note: '*تو چی؟* revient ici pour renvoyer la question.'
  fa.a1.unit28.lesson06.teach.choon_word:
    title: Parce que
    gloss: parce que
    note: '*چون* veut dire « parce que » ; c’est un véritable nouveau connecteur, employé ici pour justifier une recommandation.'
    target_text: چون (parce que)
  fa.a1.unit28.lesson06.teach.varzeshe_word:
    title: C’est du sport
    gloss: c’est du sport
    note: '*ورزشه* combine *ورزش* (vu plus tôt) avec la copule *-ه* (« est »).'
  fa.a1.unit28.lesson06.teach.vali_review:
    title: Mais
    gloss: mais
    note: '*ولی* revient ici.'
    target_text: ولی (mais)
  fa.a1.unit28.lesson06.teach.chekhoob_review:
    title: Quelle bonne nouvelle !
    gloss: quelle bonne nouvelle !
    note: '*چه خوب!* est ici aussi une réaction de clôture naturelle.'
  fa.a1.unit28.lesson06.teach.are_review:
    title: Ouais
    gloss: ouais
    note: '*آره* est le mot familier courant pour « oui » ; il revient ici.'
  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: 'Nima : Tous les jours, je vais au travail en bus. Et toi ?'
    gloss: Tous les jours, je vais au travail en bus. Et toi ?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Sara : Je vais à l’école en vélo.'
    gloss: Je vais à l’école en vélo.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Nima : Bus ou vélo, lequel est le mieux ?'
    gloss: Bus ou vélo, lequel est le mieux ?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Sara : Le vélo est mieux, parce que c’est du sport.'
    gloss: Le vélo est mieux, parce que c’est du sport.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Nima : Ouais, mais parfois j’y vais aussi à pied.'
    gloss: Ouais, mais parfois j’y vais aussi à pied.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Sara : Super !'
    gloss: Super !
