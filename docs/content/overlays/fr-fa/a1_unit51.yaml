course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : acheter un billet de cinéma auprès d’un employé du guichet, demander quelle séance et confirmer le prix, demander si le film commence à une heure donnée, dire brièvement comment était le film ensuite, et lire/écrire une courte affiche de cinéma indiquant une séance et le prix du billet.'
