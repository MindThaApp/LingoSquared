  fa.a1.unit31.lesson06.wrap_up:
    title: Récapitulatif
teaching:
  fa.a1.unit31.lesson01.teach.tavallod_word:
    title: Anniversaire
    gloss: anniversaire
    note: '*تولد* est le mot standard pour « anniversaire ».'
    example_gloss: Aujourd’hui, c’est mon anniversaire.
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Fête
    gloss: fête
    note: '*مهمونی* est le mot parlé courant pour « fête » ou « soirée entre amis » ; la forme écrite est *مهمانی*.'
    example_gloss: La fête est aujourd’hui.
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Le gâteau
    gloss: gâteau
    note: '*کیک* est le mot standard pour « gâteau ».'
    example_gloss: Ce gâteau est délicieux.
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Le cadeau
    gloss: cadeau
    note: '*هدیه* signifie « cadeau ».'
    example_gloss: J’aime le cadeau.
  fa.a1.unit31.lesson01.teach.review_words:
    title: Aujourd’hui / an, année / j’ai / et
    gloss: aujourd’hui / année / j’ai / et
    note: '*امروز*, *سال*, *دارم* et *و* sont des mots familiers qui reviennent ici pour parler de fêtes.'
    target_text: امروز (aujourd’hui) / سال (an, année) / دارم (j’ai) / و (et)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: Anniversaire + mon + est = c’est mon anniversaire
    gloss: anniversaire + mon + est = c’est mon anniversaire
    note: '*تولد* + la terminaison possessive *-م* (« mon ») + le *-ه* familier (« est ») donne *تولدمه*, « c’est mon anniversaire ».'
    target_text: تولد (anniversaire) + م + ه = تولدمه (c’est mon anniversaire)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Aujourd’hui, c’est mon anniversaire et je fais une fête
    gloss: Aujourd’hui, c’est mon anniversaire et je fais une fête
    note: '*امروز تولدمه و مهمونی دارم* associe *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Quand
    gloss: quand
    note: '*کِی* signifie « quand » ; remarque la kasra qui le distingue de *کی* (« qui »).'
    example_gloss: C’est quand, la fête ?
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: C’est quand, ton anniversaire ?
    gloss: C’est quand, ton anniversaire ?
    note: '*تولدت کِیه؟* associe *تولد* + le possessif familier *-ت* (« ton », comme dans *چند سالته؟*) + *کِیه* (*کِی* + le *-ه* familier, « est »).'
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: 10e / Ordibehesht
    gloss: 10e / Ordibehesht (2e mois iranien)
    note: '*دهم* et *اردیبهشت* reviennent ici pour donner une vraie date.'
    target_text: دهم (10e) / اردیبهشت (Ordibehesht, 2e mois iranien)
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: Mon anniversaire est le 10 Ordibehesht
    gloss: Mon anniversaire est le 10 Ordibehesht
    note: '*تولدم دهم اردیبهشته* ajoute le *-ه* familier (« est ») au nom du mois, comme dans les autres dates que tu as vues.'
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Invitation / sans faute / je viens
    gloss: un invitation / sûrement / je viens
    note: '*دعوت*, *حتماً* et *میام* reviennent ici pour parler de fêtes.'
    target_text: دعوت (invitation) / حتماً (sans faute) / میام (je viens)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Je viens -> tu viens (informel)
    gloss: je viens -> tu viens (familier)
    note: '*میای* est la forme familière de « tu » pour *میام* (« je viens »), de la même façon que *می‌خونی* correspond à *می‌خونم*.'
    target_text: میام (je viens) -> میای (tu viens, familier)
  fa.a1.unit31.lesson03.teach.review_be:
    title: Vers / à
    gloss: à / pour
    note: '*به* (« à ») revient ici pour « à la fête ».'
    target_text: به (à, vers)
  fa.a1.unit31.lesson03.teach.question_invite:
    title: Tu viens à ma fête d’anniversaire ?
    gloss: Tu viens à ma fête d’anniversaire ?
    note: '*میای به مهمونی تولدم؟* réunit tous les éléments de cette leçon.'
  fa.a1.unit31.lesson03.teach.review_are:
    title: Ouais
    gloss: ouais
    note: '*آره* (« ouais ») revient ici.'
    target_text: آره (oui, familier)
  fa.a1.unit31.lesson03.teach.answer_accept_invite:
    title: Ouais, je viendrai sans faute !
    gloss: Ouais, je viendrai sans faute !
    note: '*آره، حتماً میام!* accepte l’invitation.'
  fa.a1.unit31.lesson04.teach.mobarak_word:
    title: Félicitations / joyeux
    gloss: félicitations / joyeux
    note: '*مبارک* s’emploie dans des expressions comme *تولدت مبارک* (« joyeux anniversaire »).'
    example_gloss: Joyeux anniversaire !
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: Demain / merci / comme c’est gentil
    gloss: demain / merci / quelle bonne nouvelle
    note: '*فردا*, *ممنون* et *چه خوب* reviennent ici.'
    target_text: فردا (demain) / ممنون (merci) / چه خوب (super)
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Nima : Sara, demain c’est mon anniversaire !'
    gloss: Sara, demain c’est mon anniversaire !
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Sara : Joyeux anniversaire, Nima !'
    gloss: Joyeux anniversaire, Nima !
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Nima : Merci ! Tu viens à la fête ?'
    gloss: Merci ! Tu viens à la fête ?
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Sara : Ouais, je viendrai sans faute. Je t’achète un cadeau.'
    gloss: Ouais, je viendrai sans faute. Je t’achète un cadeau.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Nima : Super ! Merci, Sara.'
    gloss: Super ! Merci, Sara.
  fa.a1.unit31.lesson05.teach.review_migire:
    title: Je reçois -> il/elle reçoit
    gloss: j’achète -> il/elle achète
    note: '*می‌گیره* est la forme familière de la 3e personne de *می‌گیرم*, tout comme *می‌خونه* vient de *می‌خونم*.'
    target_text: می‌گیرم (je prends) -> می‌گیره (il/elle prend)
  fa.a1.unit31.lesson05.teach.review_barash:
    title: Pour toi -> pour lui/elle
    gloss: pour toi -> pour lui/elle
    note: '*براش* (« pour lui/elle ») est la version à la 3e personne de *برات* (« pour toi »).'
    target_text: برات (pour toi) -> براش (pour lui/elle)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: Il/elle / c’est à Nima / il/elle vient
    gloss: il/elle / c’est à Nima / il/elle vient
    note: '*او* et *میاد* servent à parler de *نیما* à la 3e personne ; *نیماست* combine *نیما* + *است* (« est »).'
    target_text: او (il/elle) / نیماست (c’est à Nima) / میاد (il/elle vient)
  fa.a1.unit31.lesson05.teach.reading_text:
    title: 'Lecture : l’anniversaire de Nima'
    gloss: Demain, c’est l’anniversaire de Nima. Sara lui achète un cadeau et vient à la fête.
    note: Cette lecture reprend le dialogue à la 3e personne.
  fa.a1.unit31.lesson06.teach.jashn_word:
    title: La fête
    gloss: fête, célébration
    note: '*جشن* est le mot général pour « fête, célébration », différent de *مهمونی* (« soirée, réception »), plus précis.'
    example_gloss: C’est ma fête d’anniversaire.
  fa.a1.unit31.lesson06.teach.review_ha_plural:
    title: Fêtes / anniversaires
    gloss: des célébrations / des anniversaires
    note: '*جشن‌ها* et *تولدها* ajoutent le suffixe du pluriel *-ها* directement à *جشن* et *تولد*.'
    target_text: جشن‌ها (fêtes) / تولدها (anniversaires)
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: Je, moi / marque de l’objet / j’aime
    gloss: je / marque de l’objet / j’aime
    note: '*من*, *رو* et *دوست* se combinent ici pour une phrase sur ce qu’on aime à propos des fêtes.'
    target_text: من (je, moi) / رو (marqueur d’objet) / دوست دارم (j’aime)
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: J’aime les fêtes et les anniversaires
    gloss: J’aime les fêtes et les anniversaires
    note: '*من جشن‌ها و تولدها رو دوست دارم* reprend le schéma familier *دوست دارم* avec *رو*.'
