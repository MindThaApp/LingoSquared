course:
  title: Persan A1
  description: 'Persan d’Iran pour débutants : nommer les mots de la fête et de l’anniversaire (anniversaire, fête, gâteau, cadeau), demander et dire la date de son anniversaire (*تولدت کِیه؟*) avec le vocabulaire des mois et des ordinaux déjà appris, inviter quelqu’un à une fête et accepter une invitation (*میای به مهمونی؟* / *آره، حتماً میام*), un dialogue d’anniversaire entre Nima et Sara qui présente *تولدت مبارک* (« joyeux anniversaire »), un texte sur l’anniversaire de Nima, et un bilan final pour nommer les fêtes que tu aimes et écrire ta propre invitation ou ton propre message de félicitations.'
