teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چند تمام می‌شود؟
    note: '*En total* روشن می‌سازد که قیمت مجموعی همه را می‌خواهین، نه قیمت یک چیز را.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: گفتن قیمت مجموع
    gloss: در مجموع بیست و پنج یورو تمام می‌شود.
    note: '*Cuesta* شکل سوم شخص مفرد فعل *costar* (تمام شدن، قیمت داشتن) است؛ وقتی تکیه روی آن باشد، مصوت ریشه از *o* به *ue* تغییر می‌کند.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: '*Pagar con tarjeta* و *pagar en efectivo* حرف اضافهٔ جداگانه دارند: *con* برای وسیله و *en* برای نوع پول.'
    example_gloss:
    - اینجا می‌توانم با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: پرسیدن امکان پرداخت با کارت
    gloss: اینجا می‌توانم با کارت پرداخت کنم؟
    note: '*Puedo* (من می‌توانم) شکل *yo* فعل *poder* است؛ *aquí* (اینجا) سوال را به جای فعلی ربط می‌دهد.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*Quiere* شکل محترمانهٔ *usted* فعل *querer* است که اینجا یک صندوقدار ناآشنا به کار می‌برد؛ با دوست می‌گویید *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: حساب
    gloss: حساب
    note: 'اسم مؤنث: *la cuenta*. در رستورانت یعنی صورت‌حساب و در بانک یعنی حساب بانکی.'
    example_gloss: حساب را تقسیم کنیم؟
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*¿Dividimos...?* برای پیشنهاد دادن شکل *nosotros* را به کار می‌برد، مثل «... کنیم؟» در دری.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*Por separado* (جداگانه) طرز پرداخت را می‌گوید؛ *pagar* (پرداختن) فعل روزمرهٔ آن است.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: پول خورد
    gloss: پول خورد
    note: 'اسم مذکر: *el cambio*. به معنای تغییر هر چیز هم می‌آید، مثل *un cambio de planes*.'
    example_gloss: این هم پول خوردتان.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: دادن پول خورد
    gloss: این هم پول خوردتان.
    note: '*Su* ضمیر ملکی مناسب *usted* محترمانه است («تان»)؛ *Aquí tiene* شیوهٔ معمول و مؤدبانهٔ دادن یک چیز است.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: '*Necesitar* (لازم داشتن) مفعولش را بدون حرف اضافه می‌گیرد: *necesito cambio*؛ *no* فعل را منفی می‌کند.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: سی و پنج
    gloss: سی و پنج
    note: '*Treinta y cinco* (سی و پنج): از ۳۱ تا ۹۹ در هسپانوی دهگان و یکان با *y* وصل می‌شوند و جداگانه نوشته می‌شوند.'
    example_gloss: سی و پنج یورو تمام می‌شود.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'حساب: دو غذای اصلی و دو قهوه. مجموع: سی و پنج یورو. با کارت پرداخت شد.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      Cuenta: حساب
      dos: دو
      platos: غذاهای اصلی
      cafés: قهوه‌ها
      Total: مجموع
      treinta: سی و پنج
      euros: یورو
      Pagado: پرداخت شده
      tarjeta: کارت
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: النا حساب را می‌خواهد
    gloss: 'النا: حساب را بخواهیم؟'
    note: '*Pedir* (خواستن، سفارش دادن) *la cuenta* را مفعول مستقیم می‌گیرد: *pedimos la cuenta* (حساب را می‌خواهیم).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: ماتیو مجموع را می‌پرسد
    gloss: 'ماتیو: بلی، فکر خوب است. در مجموع چند تمام می‌شود؟'
    note: سوال *¿cuánto cuesta en total?* از درس اول دوباره آمده است.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: النا مجموع را می‌گوید
    gloss: 'النا: سی و پنج یورو است. تقسیم کنیم؟'
    note: '*Son* با مبلغ پول به کار می‌رود: *son treinta y cinco euros* فعل جمع می‌گیرد، چون مبلغ جمع است.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: ماتیو اصرار می‌کند که خودش بپردازد
    gloss: 'ماتیو: نه، بگذار امروز خودم بپردازم. تو به من خیلی کمک کردی.'
    note: '*Deja que pague yo* (بگذار من بپردازم) بعد از *que* وجه التزامی *pague* را دارد؛ فعلاً آن را مثل یک جملهٔ ثابت پیشنهاد یاد بگیرین. *Me has ayudado* ماضی نقلی است (تو به من کمک کرده‌ای).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: النا تحت تأثیر قرار می‌گیرد
    gloss: 'النا: چقدر مهربان استی! خیلی تشکر.'
    note: '*¡Qué amable eres!* (چقدر مهربان استی!) با *qué* + صفت ساخته می‌شود و برای نشان دادن واکنش گرم در برابر یک کار بخشنده به کار می‌رود؛ *muchas gracias* از *تشکر* قوی‌تر است.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: ماتیو دربارهٔ پرداخت با کارت می‌پرسد
    gloss: 'ماتیو: اینجا می‌توانم با کارت پرداخت کنم؟'
    note: سوال *¿puedo pagar con tarjeta aquí?* از درس دوم دوباره آمده، حالا در خود رستورانت.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: شکل او'
    gloss: ماتیو حساب را می‌پردازد.
    note: '*Paga* شکل سوم شخص مفرد فعل *pagar* (پرداختن) است: *Mateo paga la cuenta*.'
