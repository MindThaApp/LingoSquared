teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: بیدار شدن
    gloss: بیدار شدن ← بیدار می‌شوم
    note: '*Levantarse* انعکاسی است: ضمیر *me* پیش از فعل می‌آید، *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: لباس پوشیدن
    gloss: لباس پوشیدن ← لباس می‌پوشم
    note: '*Vestirse* هم انعکاسی است: *Me visto*. اینجا *me* یعنی «خودم».'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: ناشتا کردن
    gloss: ناشتا کردن ← ناشتا می‌کنم
    note: '*Desayunar* انعکاسی نیست: *Desayuno*، بدون *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: کار کردن
    gloss: کار کردن ← کار می‌کنم
    note: '*Trabajar* یک فعل منظم -ar است: شکل *yo* آن به -o ختم می‌شود، *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: خوردن
    gloss: خوردن ← می‌خورم
    note: '*Comer* یک فعل منظم -er است: شکل *yo* آن به -o ختم می‌شود، *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: ظرف شستن
    gloss: ظرف شستن ← ظرف می‌شویم
    note: '*Lavar los platos* انعکاسی نیست: *Lavo los platos*. مفعول *los platos* بعد از فعل می‌ماند.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: خوابیدن
    gloss: خوابیدن ← می‌خوابم
    note: '*Dormir* در شکل *yo* مصوت ریشه‌اش را تغییر می‌دهد: *duermo* (o به ue تبدیل می‌شود).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: الگوی انعکاسی
    gloss: 'با levantarse و vestirse ضمیر پیش از فعل می‌آید: levantarse ← Me levanto.'
    note: 'در فعل‌های انعکاسی، *me* را پیش از فعل صرف‌شده بگذارین: بگویین *Me levanto*، نه *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse در جمله
    gloss: 'بیدار شدن: من ساعت هفت بیدار می‌شوم.'
    note: 'عبارت وقت بعد از فعل می‌آید: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse در جمله
    gloss: 'لباس پوشیدن: من لباس می‌پوشم.'
    note: 'الگو این است: *me* + *visto*؛ ضمیر درست پیش از فعل می‌ماند.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos در جمله
    gloss: 'ظرف شستن: من بعد از غذا ظرف می‌شویم.'
    note: '*Después de comer* («بعد از غذا خوردن») از *de* و مصدر ساخته می‌شود و می‌تواند در آخر جمله بیاید.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: فعل‌ها بدون me
    gloss: 'بدون ضمیر: ناشتا می‌کنم. کار می‌کنم. می‌خوابم. این فعل‌ها انعکاسی نیستند.'
    note: '*Desayuno*، *trabajo* و *duermo* *me* ندارند: این فعل‌ها انعکاسی نیستند.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: بیدار شدن ساعت هفت و نیم
    gloss: من ساعت هفت و نیم بیدار می‌شوم.
    note: 'در اسپانوی هم مثل دری، «نیم» بعد از ساعت می‌آید، اما با *y media*: *las siete y media* یعنی 07:30. پیش از وقت *a las* را بگذارین.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: لباس پوشیدن ساعت هشت کم ربع
    gloss: من ساعت هشت کم ربع لباس می‌پوشم.
    note: '*Las ocho menos cuarto* از ساعت بعدی به عقب حساب می‌شود: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: ناشتا کردن ساعت هشت
    gloss: من ساعت هشت ناشتا می‌کنم.
    note: 'پیش از وقت *a las* را به کار ببرید: *a las ocho*. برای ساعت یک می‌شود *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: کار از نُه تا پنج
    gloss: من از ساعت نُه تا ساعت پنج کار می‌کنم.
    note: '*De ... a ...* وقت شروع و ختم را نشان می‌دهد: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: غذا خوردن ساعت شش و نیم
    gloss: من ساعت شش و نیم بعد از چاشت غذا می‌خورم.
    note: '*De la tarde* شام‌گاه بودن را روشن می‌کند، پس اینجا *las seis y media* یعنی 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: خوابیدن ساعت یازده
    gloss: من ساعت یازده می‌خوابم.
    note: 'پیش از وقت *a las* را به کار ببرید: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: اول، بعد، بعد از آن
    gloss: اول، بعد، بعد از آن
    note: '*Primero* اولین کار را نشان می‌دهد، *luego* کار بعدی را و *después* آنچه را که بعد از آن می‌آید.'
    example_gloss:
    - اول بیدار می‌شوم.
    - بعد لباس می‌پوشم.
    - بعد از آن ناشتا می‌کنم.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: یک صبح در سه مرحله
    gloss: اول بیدار می‌شوم. بعد لباس می‌پوشم. بعد از آن ناشتا می‌کنم.
    note: 'فعل‌های انعکاسی *me* را پیش از فعل نگه می‌دارند: *me levanto*، *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: کلمه‌های ترتیب
    gloss: 'Primero، luego و después کارهای شما را به ترتیب می‌آورند؛ فعل تغییر نمی‌کند: Después desayuno.'
    note: 'کلمه‌های ترتیب در آغاز جمله می‌آیند و شکل فعل تغییر نمی‌کند: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: روز من
    gloss: روز من — ساعت هفت و نیم بیدار می‌شوم. بعد از آن لباس می‌پوشم و ساعت هشت ناشتا می‌کنم. از ساعت نُه تا پنج کار می‌کنم. ساعت شش و نیم بعد از چاشت غذا می‌خورم. بعد از آن ظرف می‌شویم. ساعت یازده می‌خوابم.
    note: هم به ترتیب کارها و هم به وقت‌های آن‌ها توجه کنید. به *me levanto* و *me visto* با *me* دقت کنید.
    glosses:
      Mi: من / ام
      día: روز
      levanto: بیدار می‌شوم
      media: نیم (y media = و نیم)
      ocho: هشت
      Después: بعد از آن
      visto: لباس پوشیدن
      las: ساعت (پیش از وقت ساعت)
      desayuno: ناشتا کردن
      Trabajo: کار کردن
      nueve: نُه
      cinco: پنج
      siete: هفت
      tarde: در وقت شام
      como: نان خوردن
      lavo: ظرف شستن
      once: یازده
      duermo: خواب کردن
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: پرسیدن در بارهٔ یک روز
    gloss: 'الینا: روز تو چطور می‌گذرد، ماتیو؟'
    note: '*¿Cómo es tu día?* راه غیررسمی برای پرسیدن از روز کسی است؛ *tu* یعنی «تو» در حالت غیررسمی.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: صبح ماتیو
    gloss: 'ماتیو: ساعت هفت و نیم از خواب بلند می‌شوم. بعد از آن لباس می‌پوشم و ساعت هشت ناشتا می‌کنم.'
    note: ماتیو سه کار صبح را با *después* و *y* به هم وصل می‌کند.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: روز کاری ماتیو
    gloss: 'الینا: تو کی کار می‌کنی؟ ماتیو: از ساعت نُه تا پنج کار می‌کنم.'
    note: 'الینا و ماتیو با هم از شکل غیررسمی *tú* استفاده می‌کنند: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: شام ماتیو
    gloss: 'ماتیو: ساعت شش و نیم شام نان می‌خورم. بعد از آن ظرف می‌شویم. ساعت یازده خواب می‌کنم.'
    note: '*Después* اول جمله می‌آید، اما شکل فعل تغییر نمی‌کند: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: صبح الینا
    gloss: 'الینا: ساعت شش از خواب بلند می‌شوم، اما تا ساعت شش و نیم ناشتا نمی‌کنم.'
    note: '*No ... hasta* یعنی «تا ... نه». الینا وقت بلند شدنش را با وقت ناشتایش مقایسه می‌کند.'
