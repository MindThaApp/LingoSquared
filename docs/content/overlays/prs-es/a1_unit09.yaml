  es.a1.unit09.lesson03.como_llego_a:
    title: چطور برسم به...؟
  es.a1.unit09.lesson04.confirmar_direcciones:
    title: تأیید کردن رهنمایی
  es.a1.unit09.lesson05.leer_las_direcciones:
    title: خواندن رهنمایی‌های نوشته‌شده
  es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue:
    title: الینا راه را به ماتیو توضیح می‌دهد
teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: سرک
    gloss: سرک
    note: '*Calle* در هسپانوی مؤنث است.'
    example_gloss: من در این سرک زندگی می‌کنم.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: گوشه
    gloss: گوشه
    note: '*Esquina* در هسپانوی مؤنث است.'
    example_gloss: بانک در گوشه است.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: مستقیم برو
    gloss: مستقیم برو.
    note: '*Sigue* شکل امر غیررسمی فعل *seguir* (دنبال کردن/ادامه دادن) است و در این درس در همهٔ رهنمایی‌ها دوباره می‌آید.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: به چپ بپیچ
    gloss: به چپ بپیچ.
    note: '*Dobla* شکل امر غیررسمی فعل *doblar* (پیچیدن/تا کردن) است. نکتهٔ دستوری بعدی دربارهٔ *doblar* و *girar* را ببینین.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: به راست بپیچ
    gloss: به راست بپیچ.
    note: '*Gira* شکل امر غیررسمی فعل *girar* (پیچیدن/چرخیدن) است و به جای *doblar* هم استفاده شده می‌تواند.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: از سرک بگذر
    gloss: از سرک بگذر.
    note: '*Cruza* شکل امر غیررسمی فعل *cruzar* (گذشتن از عرض) است.'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar و girar
    gloss: دو کلمهٔ به همان اندازه طبیعی برای «پیچیدن».
    note: متن خود کارت را ببینین.
    target_text: '*Doblar* و *girar* هر دو یعنی «پیچیدن» و اینجا کاملاً قابل تعویض اند -- فرق آن‌ها از جهت منطقه است، نه از جهت معنا یا سطح زبان. هر دو در این درس استفاده می‌شوند.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: پرسیدن راه
    gloss: به کتابخانه چطور برسم؟
    note: '*Cómo llego a* (چطور برسم به) شکل معمول پرسیدن راه به یک جای مشخص است.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: گفتن اینکه آسان است
    gloss: آسان است.
    note: جملهٔ معمول و دل‌گرم‌کننده که پیش از رهنمایی گفته می‌شود.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: از همین سرک مستقیم برو
    gloss: از همین سرک مستقیم برو.
    note: '*Por esta calle* (از همین سرک) مشخص می‌کند که از کدام سرک باید رفت.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: در گوشه به چپ بپیچ
    gloss: در گوشه به چپ بپیچ.
    note: '*En la esquina* (در گوشه) می‌گوید که پیچیدن در کجا باید باشد.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: پرسیدن برای تأیید
    gloss: درست است؟
    note: '*¿Está bien así?* (همین‌طور درست است؟) بعد از تکرار کردن رهنمایی برای اطمینان از فهمیدن پرسیده می‌شود؛ قدم طبیعی بعد از شنیدن راه.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: تأیید کردن
    gloss: بلی، درست است.
    note: '*Así es* (همین‌طور است) تأیید کوتاه و طبیعی است.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: گم نشوی
    gloss: گم نشوی!
    note: '*No te pierdas* شکل نهی غیررسمی فعل *perderse* (گم شدن) است؛ خداحافظی گرم و دوستانه.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: خواندن رهنمایی نوشته‌شده
    gloss: 'برای رسیدن به کتابخانه از بازار: از همین سرک مستقیم برو. در گوشه به چپ بپیچ. بعد از سرک بگذر. کتابخانه در طرف راست است.'
    note: 'رهنمایی نوشته‌شده قدم‌ها را به ترتیب می‌آورد: *Para llegar a...* (برای رسیدن به...) مقصد را می‌گوید، بعد هر قدم یک امر با *tú* است (*sigue*، *dobla*، *cruza*) و *después* (بعد) قدم‌ها را وصل می‌کند.'
    glosses:
      llegar: رسیدن
      biblioteca: کتابخانه
      desde: از
      mercado: بازار
      sigue: ادامه بده / برو (از seguir)
      derecho: مستقیم
      calle: سرک
      Dobla: بپیچ (از doblar)
      izquierda: چپ
      esquina: گوشه
      Después: بعد / پس از آن
      cruza: بگذر (از cruzar)
      está: موقعیت دارد (از estar)
      derecha: راست
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (از)
    gloss: چطور desde نقطهٔ آغاز راه را نشان می‌دهد.
    note: متن خود کارت را ببینین.
    target_text: '*Desde* (از) نقطهٔ شروع مسیر را نشان می‌دهد و با *a* (به) برای مقصد می‌آید -- *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: پرسیدن راه
    gloss: ماتیو از الینا می‌پرسد که از بازار به کتابخانه چطور برسد.
    note: 'همان پرسش *¿Cómo llego a...?* از اول این درس، این بار با نقطهٔ آغاز: *desde el mercado* (از بازار).'
  es.a1.unit09.lesson06.teach.line02:
    title: گفتن قدم اول
    gloss: الینا می‌گوید آسان است و اولین رهنمایی را می‌دهد.
    note: '*Es fácil* (آسان است) پیش از دادن قدم اول خاطرجمع می‌کند.'
  es.a1.unit09.lesson06.teach.line03:
    title: تکرار کردن و پرسیدن ادامه
    gloss: ماتیو رهنمایی را تکرار می‌کند و می‌پرسد بعدش چه باید کرد.
    note: '*Sigo derecho* (مستقیم می‌روم) شکل اول شخص فعل *seguir* است و نشان می‌دهد ماتیو هنگام رفتن تأیید می‌کند.'
  es.a1.unit09.lesson06.teach.line04:
    title: گفتن قدم دوم
    gloss: الینا به او می‌گوید که در گوشه به چپ بپیچد.
    note: '*Dobla* (بپیچ) -- *gira* هم همین معنا را می‌دهد.'
  es.a1.unit09.lesson06.teach.line05:
    title: تکرار کردن و تأیید گرفتن
    gloss: ماتیو پیچیدن را تکرار می‌کند و می‌پرسد درست است یا نه.
    note: '*Doblo* (می‌پیچم) مثل *Sigo derecho* پیشین او است -- ماتیو هر قدم را با شکل *yo* تکرار می‌کند تا مطمئن شود.'
  es.a1.unit09.lesson06.teach.line06:
    title: تأیید کردن و گفتن قدم‌های آخر
    gloss: الینا تأیید می‌کند، بعد می‌گوید از سرک بگذرد -- کتابخانه در طرف راست خواهد بود.
    note: '*Sí, así es* (بلی، همین‌طور است) تأیید می‌کند، بعد *después* (بعد) قدم‌های آخر راه را شروع می‌کند.'
  es.a1.unit09.lesson06.teach.line07:
    title: تشکر از الینا
    gloss: ماتیو از الینا گرم تشکر می‌کند.
    note: '*Muchas gracias* (بسیار تشکر) گرم‌تر از *gracias* ساده است.'
  es.a1.unit09.lesson06.teach.line08:
    title: جواب دادن و خداحافظی
    gloss: الینا می‌گوید قابل ندارد و به او می‌گوید گم نشود.
    note: '*De nada* (قابل ندارد) جواب معمول به *gracias* است.'
