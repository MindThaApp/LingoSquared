course:
  title: هسپانوی A1
  description: پرسیدن و دنبال کردن رهنمایی‌های ساده، در ادامهٔ قصهٔ الینا و ماتیو که الینا ماتیو را از درس ۸ تا کتابخانه رهنمایی می‌کند. در این درس، doblar و girar دو گونهٔ منطقه‌ای قابل تعویض معرفی می‌شوند، نه دو معنای جدا از هم.
