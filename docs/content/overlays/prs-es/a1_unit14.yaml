    example_gloss: اتاق خواب یک بستر بزرگ دارد.
  es.a1.unit14.lesson01.teach.el_bano:
    title: تشناب
    gloss: تشناب
    note: '*Baño* مذکر است.'
    example_gloss: اپارتمان یک تشناب دارد.
  es.a1.unit14.lesson01.teach.la_sala:
    title: اتاق نشیمن
    gloss: اتاق نشیمن
    note: '*Sala* مؤنث است.'
    example_gloss: ما در اتاق نشیمن تلویزیون تماشا می‌کنیم.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: اتاق یا آشپزی'
    gloss: فرق la cocina (آشپزخانه) با cocinar (آشپزی کردن).
    note: متن همین کارت را ببینین.
    target_text: '*La cocina* در اینجا یعنی «آشپزخانه» (یک اتاق)، که با *cocina*/*cocinar* (آشپزی/آشپزی کردن) که در تمام این داستان برای خود کارگاه به کار رفته فرق دارد. زمینه فرق را نشان می‌دهد: در *taller de cocina* یعنی آشپزی؛ *la cocina* در خانه یا آپارتمان همان اتاق است؛ و *cocinar* فعل «آشپزی کردن» است.'
  es.a1.unit14.lesson02.teach.alquilar:
    title: کرایه کردن
    gloss: کرایه کردن
    note: مصدر فعل؛ در *quiero alquilar* (می‌خواهم کرایه کنم) آمده است.
  es.a1.unit14.lesson02.teach.el_edificio:
    title: ساختمان
    gloss: ساختمان
    note: '*Edificio* مذکر است.'
    example_gloss: ساختمان نزدیک پارک است.
  es.a1.unit14.lesson02.teach.desocupado:
    title: خالی / آماده برای کرایه
    gloss: خالی / آماده برای کرایه
    note: '*Desocupado* برای واحدی گفته می‌شود که فعلاً خالی است و برای کرایه آماده است.'
  es.a1.unit14.lesson02.teach.grande:
    title: بزرگ
    gloss: بزرگ
    note: '*Grande* برای مذکر و مؤنث شکلش تغییر نمی‌کند (برخلاف صفت‌های -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: کوچک
    gloss: کوچک
    note: '*Pequeño/pequeña* ضد *grande* است.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: پرسیدن تعداد اتاق‌های خواب
    gloss: چند اتاق خواب دارد؟
    note: '*¿Cuántos...tiene?* (چند ... دارد؟) الگوی معمول برای پرسیدن از ویژگی‌های یک جا است.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: توصیف اتاق‌های خواب و آشپزخانه
    gloss: دو اتاق خواب و یک آشپزخانهٔ بزرگ دارد.
    note: '*Tiene* (دارد) + تعداد + اسم؛ اینجا با *dormitorio*، *cocina* و *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: گفتن هدف خانه‌جویی
    gloss: می‌خواهم یک اپارتمان با آشپزخانهٔ بزرگ کرایه کنم.
    note: '*Quiero* (می‌خواهم) + مصدر *alquilar*؛ و *con* (با) ویژگی دلخواه را معرفی می‌کند.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: گفتن فایده
    gloss: به این شکل در خانه هم آشپزی کرده می‌توانی.
    note: '*Así* (به این شکل) + *puedes* (می‌توانی) + مصدر، هدف خانه را به موضوع آشپزی در کل قصه وصل می‌کند.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: خواندن اعلان یک اپارتمان
    gloss: اپارتمان خالی در ساختمانی نزدیک پارک. دو اتاق خواب، یک تشناب، یک اتاق نشیمن و یک آشپزخانهٔ بزرگ دارد. برای کسی که می‌خواهد در خانه آشپزی کند، عالی است.
    note: یک اعلان معمولی مثل اعلان‌های روزنامه.
    glosses:
      desocupado: خالی / آماده برای کرایه
      edificio: ساختمان
      cerca: نزدیک
      parque: پارک
      Tiene: دارد (از tener)
      dormitorios: اتاق‌های خواب
      baño: تشناب
      sala: اتاق نشیمن
      grande: بزرگ
      perfecto: عالی
      quiere: می‌خواهد (از querer)
      cocinar: آشپزی کردن
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: جملهٔ وابسته چگونه کرایه‌دار دلخواه را توصیف می‌کند.
    note: متن همین کارت را ببینین.
    target_text: '*Para alguien que quiere* (برای کسی که می‌خواهد) از *alguien* (کسی) + *que* (که) برای آوردن جملهٔ وصفی استفاده می‌کند -- الگویی رایج در اعلان‌های کرایه برای توصیف کرایه‌دار مناسب.'
  es.a1.unit14.lesson06.teach.line01:
    title: گفتن مشکل و هدف
    gloss: ماتیو می‌گوید آشپزخانه‌اش بسیار کوچک است و می‌خواهد اپارتمانی با آشپزخانهٔ بزرگ کرایه کند.
    note: '*Mi cocina es muy pequeña* (آشپزخانهٔ من بسیار کوچک است) با جملهٔ هدف *quiero alquilar un apartamento con una cocina grande* یکجا آمده است.'
  es.a1.unit14.lesson06.teach.line02:
    title: پیشنهاد دیدن اعلان‌ها
    gloss: النا پیشنهاد می‌کند روزنامه را ببینند؛ اعلان‌های زیادی هست.
    note: '*El periódico* (روزنامه) و *anuncios* (اعلان‌ها) واژه‌های تازهٔ اعلان‌های واقعی استند.'
  es.a1.unit14.lesson06.teach.line03:
    title: پیدا کردن یک اعلان
    gloss: ماتیو ساختمانی را پیدا می‌کند که یک اپارتمان خالی دارد.
    note: '*Este edificio* (این ساختمان) و *desocupado* (خالی، آماده برای کرایه).'
  es.a1.unit14.lesson06.teach.line04:
    title: پرسیدن دربارهٔ اتاق‌های خواب
    gloss: النا می‌پرسد چند اتاق خواب دارد.
    note: سوال معمول برای پرسیدن از ویژگی‌های یک جا.
  es.a1.unit14.lesson06.teach.line05:
    title: جواب دادن با جزئیات
    gloss: ماتیو می‌گوید دو اتاق خواب و یک آشپزخانهٔ بزرگ دارد.
    note: '*Tiene* (دارد) + تعداد + اسم.'
  es.a1.unit14.lesson06.teach.line06:
    title: تأیید ویژگی‌های بیشتر
    gloss: النا خوش می‌شود و می‌گوید یک تشناب و یک اتاق نشیمن هم دارد.
    note: '*Baño* (تشناب) و *sala* (اتاق نشیمن) فهرست اتاق‌ها را کامل می‌کنند؛ *también* (هم) در آخر جمله می‌آید.'
  es.a1.unit14.lesson06.teach.line07:
    title: تصمیم به زنگ زدن
    gloss: ماتیو تصمیم می‌گیرد همین امروز به نمایندگی زنگ بزند.
    note: '*Voy a llamar* (زنگ می‌زنم) + *hoy mismo* (همین امروز)؛ *la agencia* نمایندگی کرایهٔ خانه است.'
  es.a1.unit14.lesson06.teach.line08:
    title: تأیید و بستن صحنه
    gloss: النا موافقت می‌کند و می‌گوید در خانه هم آشپزی کرده می‌تواند.
    note: '*Así puedes cocinar en casa también* (به این شکل در خانه هم آشپزی کرده می‌توانی) صحنه را به پایان می‌رساند.'
