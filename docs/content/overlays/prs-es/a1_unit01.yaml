  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: گپ‌زدن در یک فعالیت مشترک
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: اولین دیدار در ورکشاپ آشپزی
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: «شما» به شکل محترمانه
    gloss: شما (رسمی و محترمانه)
    note: در دری هم «تو» برای نزدیکان و «شما» برای احترام به کار می‌رود، و هسپانوی هم این انتخاب اجتماعی را نشان می‌دهد. Usted را با یک بزرگسال ناآشنا یا وقتی لحن محترمانه لازم است به کار ببرید. با این‌که معنی «شما» را دارد، فعلش مثل فعل él یا ella است.
  es.a1.unit01.lesson01.teach.tu:
    title: «تو» به شکل غیررسمی
    gloss: تو (غیررسمی، مفرد)
    note: Tú با یک دوست، همسن‌وسال، طفل یا کسی دیگر که رابطهٔ غیررسمی دارید به کار می‌رود. نشانهٔ تکیه (accent) ضمیر tú را از صفت ملکی tu، یعنی «تو/ات»، جدا می‌کند.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: پرسیدن احوال به شکل رسمی
    gloss: شما چطور استید؟
    note: Está شکل usted فعل estar است. هسپانوی برای حالت فعلی کس از estar کار می‌گیرد. Cómo چون کلمهٔ پرسشی است، نشانهٔ تکیه (accent) دارد.
  es.a1.unit01.lesson01.teach.como_estas:
    title: پرسیدن احوال به شکل غیررسمی
    gloss: تو چطور استی؟
    note: Estás شکل tú فعل estar است. در دری فعل با «تو» و «شما» فرق می‌کند (استی، استید)؛ در هسپانوی هم está به estás تغییر می‌کند تا با شخصی که مخاطب است هماهنگ شود.
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: یک جواب کوتاه
    gloss: خوبم، تشکر.
    note: در هسپانوی می‌شود فقط با bien جواب داد، بدون تکرار فاعل یا فعل.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: یک جواب مثبت
    gloss: بسیار خوبم، تشکر.
    note: Muy معنی bien را قوی‌تر می‌کند و شکلش تغییر نمی‌کند.
  es.a1.unit01.lesson01.teach.and_usted:
    title: برگرداندن پرسش رسمی
    gloss: و شما؟
    note: وقتی پرسش را با احترام برمی‌گردانید، usted را نگه دارید.
  es.a1.unit01.lesson01.teach.and_tu:
    title: برگرداندن پرسش غیررسمی
    gloss: و تو؟
    note: وقتی گفتگو غیررسمی است tú را به کار ببرید. نشانهٔ تکیه (accent) در نوشتن مهم است، چون tu بدون آن یعنی «تو/ات».
  es.a1.unit01.lesson02.teach.hola:
    title: سلام همه‌منظوره
    gloss: سلام
    note: Hola در هر وقت روز و در دیدارهای رسمی و غیررسمی کار می‌کند.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: سلام صبح
    gloss: صبح بخیر
    note: اسم‌ها در هسپانوی جنس دستوری (مذکر یا مؤنث) دارند، اما در دری چنین چیزی نیست. Días مذکر جمع است، پس صفت به شکل buenos می‌آید.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: سلام بعدازچاشت
    gloss: بعدازچاشت بخیر
    note: Tardes مؤنث جمع است، پس buenas با آن هماهنگ می‌شود. تغییر از buenos به buenas هماهنگی دستوری است، نه تغییر در درجهٔ احترام.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: سلام شام یا شب
    gloss: شام بخیر؛ شب بخیر
    note: Noches مؤنث جمع است و به همین دلیل buenas می‌گیرد. این عبارت هم برای سلام در شب به کار می‌رود و هم برای ختم دیدار پیش از خواب.
  es.a1.unit01.lesson02.teach.adios:
    title: خداحافظی مستقیم
    gloss: خداحافظ
    note: Adiós عبارت عادی است، اما از «بعداً می‌بینمت» قطعی‌تر به نظر می‌رسد.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: بعداً می‌بینمت
    gloss: بعداً می‌بینیم
    note: Hasta luego یک خداحافظی رایج است و نباید کلمه به کلمه معنی شود.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: خداحافظی دوستانه
    gloss: می‌بینیم‌تان
    note: معنی تحت‌اللفظی nos vemos به «همدیگر را می‌بینیم» نزدیک‌تر است.
  es.a1.unit01.lesson02.teach.good_day:
    title: دعای محترمانهٔ ختم دیدار
    gloss: روز خوبی داشته باشین.
    note: Tenga شکل usted است که در این دعای محترمانه می‌آید. Buen شکل کوتاه‌شدهٔ مذکر مفرد bueno پیش از día است.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: پرسیدن نام به شکل رسمی
    gloss: نام شما چیست؟
    note: هسپانوی این را تقریباً مثل «خود را چه می‌نامید؟» می‌گوید. Se با شکل رسمی llama که برای usted است می‌آید. در دری هم فعل «استید» برای احترام، با «استی» فرق دارد.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: گفتن نام خود
    gloss: نام من لوسیا است.
    note: Me llamo لفظاً یعنی «خود را ... می‌نامم». پسوند فعل گوینده را نشان می‌دهد، پس هسپانوی معمولاً yo را اینجا نمی‌گوید؛ در دری هم ضمیر «من» اغلب حذف می‌شود.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: پرسیدن نام به شکل غیررسمی
    gloss: نام تو چیست؟
    note: Te با «تو» غیررسمی می‌آید و llamas پسوند -as مخصوص tú را دارد. شکل رسمی se llama را با شکل غیررسمی te llamas مقایسه کنید.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: معرفی خود با ser
    gloss: من دیگو استم.
    note: Soy شکل اول شخص مفرد ser است. هسپانوی ser را برای هویت به کار می‌برد، اما حالت‌های موقتی را با estar می‌گوید؛ یعنی این دو کار بین ser و estar تقسیم شده است.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: خوشحالی از آشنایی
    gloss: از آشنایی با شما خوشحال شدم.
    note: Mucho gusto یک عبارت ثابت و کاملاً قابل فهم است. برخلاف صفت‌هایی مثل encantado یا encantada، با جنس گوینده تغییر نمی‌کند.
  es.a1.unit01.lesson03.teach.igualmente:
    title: برگرداندن همان احساس
    gloss: من هم همین‌طور.
    note: Igualmente یک جواب کوتاه به Mucho gusto است.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: معرفی یک مرد
    gloss: این کارلوس است.
    note: در دری «این» جنس دستوری ندارد. هسپانوی وقتی شخص یا اسمی که نشان داده می‌شود از نظر دستوری مذکر باشد، este می‌گوید.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: معرفی یک زن
    gloss: این آنا است.
    note: Esta را برای مؤنث به کار ببرید. Esta اینجا نشانهٔ تکیه ندارد؛ está با نشانهٔ تکیه شکلی از estar است و یعنی «است» یا «قرار دارد».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: پرسیدن اصلیت به شکل رسمی
    gloss: شما از کجا استید؟
    note: Es شکل usted فعل ser است. هسپانوی برای اصلیت از ser کار می‌گیرد، نه estar. Dónde در پرسش مستقیم نشانهٔ تکیه (accent) دارد.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: گفتن اصلیت خود
    gloss: من از مکسیکو استم.
    note: Soy شکل yo فعل ser است. فاعل yo لازم نیست، چون soy خودش گوینده را نشان می‌دهد.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: پرسیدن اصلیت به شکل غیررسمی
    gloss: تو از کجا استی؟
    note: Eres شکل tú فعل ser است. شکل رسمی es برای usted را با شکل غیررسمی eres مقایسه کنید؛ در دری هم «استید» و «استی» همین فرق را دارند.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: یک جملهٔ دیگر دربارهٔ اصلیت
    gloss: من از کولمبیا استم.
    note: برای گفتن اصلیت، soy de و بعد نام یک جا را بگویین.
  es.a1.unit01.lesson04.teach.live_london:
    title: گفتن محل سکونت
    gloss: من در لندن زندگی می‌کنم.
    note: Vivo شکل yo فعل vivir است. هسپانوی به yo نیاز ندارد، چون پسوند -o گوینده را نشان می‌دهد.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: پرسیدن دربارهٔ هسپانوی به شکل رسمی
    gloss: شما هسپانوی حرف می‌زنید؟
    note: هسپانوی این پرسش بلی یا نخیر را بدون کلمهٔ کمکی جداگانه می‌سازد. Habla شکل usted است؛ آهنگ صدا و علامت سوال پرسش را نشان می‌دهند.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: توانایی محدود
    gloss: بلی، کمی.
    note: Sí با نشانهٔ تکیه یعنی «بلی». Si بدون نشانهٔ تکیه یعنی «اگر»، با این‌که اینجا در سطح A1 نوشتن بدون نشانه هم به‌عنوان یک شکل قابل قبول پذیرفته می‌شود.
  es.a1.unit01.lesson04.teach.still_learning:
    title: توضیح یک وضعیت جاری
    gloss: من هنوز یاد می‌گیرم.
    note: Estoy شکل yo فعل estar است. اینجا estar فعالیتی را که جریان دارد همراهی می‌کند، اما soy در Soy de Colombia اصلیت یا هویت را می‌رساند. هسپانوی این دو کاربرد را از هم جدا می‌کند.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: پرسیدن رسمی دربارهٔ اولین دیدار
    gloss: این اولین بار شما اینجا است؟
    note: Su وقتی کسی را با usted خطاب می‌کنین یعنی «تان/شما». هسپانوی با su و tu فرق رسمی و غیررسمی را نگه می‌دارد، همان‌طور که در دری «تان» و «ات» فرق دارند.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: پرسیدن غیررسمی دربارهٔ اولین دیدار
    gloss: این اولین بار تو اینجا است؟
    note: Tu بدون نشانهٔ تکیه صفت ملکی غیررسمی «تو/ات» است. آن را با ضمیر tú که نشانهٔ تکیه دارد مقایسه کنید.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: تأیید این‌که اولین بار شما است
    gloss: بلی، این اولین بار من است.
    note: Primera مؤنث است چون با vez هماهنگ می‌شود. در دری صفت‌ها با جنس اسم تغییر نمی‌کنند.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: گفتن مقصد خود
    gloss: من برای ورکشاپ آشپزی آمده‌ام.
    note: Vengo شکل yo فعل venir است و یعنی «می‌آیم» یا «آمده‌ام». Al شکل کوتاه‌شدهٔ الزامی a به‌علاوهٔ el است.
  es.a1.unit01.lesson05.teach.me_too:
    title: شریک شدن در همان وضعیت
    gloss: من هم.
    note: Yo también وقتی به کار می‌آید که حرف طرف مقابل دربارهٔ شما هم صدق کند.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: پرسیدن دربارهٔ یک علاقه
    gloss: آشپزی کردن را دوست داری؟
    note: در جملهٔ با gustar، te کسی را نشان می‌دهد که چیزی را دوست دارد، و cocinar چیزی است که خوشش می‌آید. فعل به شکل gusta می‌ماند، چون کار آشپزی مفرد حساب می‌شود.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: ابراز علاقهٔ زیاد
    gloss: بلی، خیلی.
    note: Mucho به پرسش دربارهٔ اندازه جواب می‌دهد و اینجا شکلش تغییر نمی‌کند.
  es.a1.unit01.lesson05.teach.thats_good:
    title: واکنش مثبت
    gloss: چه خوب!
    note: Qué در این جملهٔ تعجبی accent دارد. این کلمه یک واکنش مثبت را شروع می‌کند و پرسش نیست.
  es.a1.unit01.lesson06.teach.line01:
    title: شروع دیدار
    gloss: الینا به ماتیو سلام می‌دهد و می‌پرسد که این بار اولش است که اینجا می‌آید.
    note: هر دو گوینده از شکل غیررسمی tú کار می‌گیرند، چون در یک فعالیت با هم هم‌سطح اند.
  es.a1.unit01.lesson06.teach.line02:
    title: شروع دیدار، جواب
    gloss: ماتیو می‌گوید بلی، بار اولش است و برای صنف آشپزی آمده است.
    note: Vengo al taller دلیل بودن در آنجا را می‌گوید و برای وضعیتی که ادامه دارد، زمان حال را به کار می‌برد.
  es.a1.unit01.lesson06.teach.line03:
    title: معرفی نام
    gloss: الینا می‌گوید که برای او هم بار اول است، نامش را می‌گوید و نام ماتیو را می‌پرسد.
    note: Me llamo راه طبیعی برای گفتن نام است. در اسپانوی معمولاً yo گفته نمی‌شود، چون شکل فعل خودش گوینده را مشخص می‌کند.
  es.a1.unit01.lesson06.teach.line04:
    title: معرفی نام، جواب
    gloss: ماتیو نامش را می‌گوید و می‌گوید که از آشنایی خوشحال است.
    note: Soy راه طبیعی دیگری برای گفتن نام است و به جای فعل انعکاسی llamarse از ser کار می‌گیرد.
  es.a1.unit01.lesson06.teach.line05:
    title: پرسیدن دربارهٔ اصلیت
    gloss: الینا هم همین احترام را برمی‌گرداند (من هم خوشحالم) و می‌پرسد که ماتیو اهل کجاست.
    note: De dónde eres با شکل غیررسمی tú دربارهٔ اصلیت می‌پرسد.
  es.a1.unit01.lesson06.teach.line06:
    title: پرسیدن دربارهٔ اصلیت، جواب
    gloss: ماتیو اهل کولمبیا است ولی در لندن زندگی می‌کند، بعد همین سوال را از الینا می‌پرسد.
    note: Soy de اصلیت را می‌گوید، ولی vivo en جای زندگی فعلی را. Pero این دو واقعیت را که با هم فرق دارند، به هم وصل می‌کند.
  es.a1.unit01.lesson06.teach.line07:
    title: صحبت دربارهٔ علاقه
    gloss: الینا می‌گوید که اهل هسپانیا است و می‌پرسد که ماتیو آشپزی را دوست دارد یا نه.
    note: Soy اصلیت را می‌گوید، همان الگویی که ماتیو همین حالا به کار برد.
  es.a1.unit01.lesson06.teach.line08:
    title: صحبت دربارهٔ علاقه، جواب
    gloss: ماتیو می‌گوید که آشپزی را خیلی دوست دارد ولی هنوز یاد می‌گیرد.
    note: Estoy aprendiendo کاری را می‌گوید که همین حالا جریان دارد. در اسپانوی برای این حالت estoy با شکل -ando/-iendo فعل می‌آید.
  es.a1.unit01.lesson06.teach.line09:
    title: ختم صحبت
