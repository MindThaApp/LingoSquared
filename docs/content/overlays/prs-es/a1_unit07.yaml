teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: بازار
    gloss: بازار
    note: '*Mercado* مذکر است.'
    example_gloss: بیایین به بازار برویم.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: میوه، سبزی
    gloss: میوه، سبزی
    note: '*Verdura* به معنی سبزی‌ها به طور کلی است (اکثراً سبز)؛ اسم مؤنث مفرد است که به شکل جمعی هم به کار می‌رود.'
    example_gloss:
    - می‌خواهم میوه بخرم.
    - سبزی‌ها تازه اند.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: تخم، نان
    gloss: تخم، نان
    note: '*Huevos* از قبل جمع است (مفرد آن *huevo* است)؛ *pan* (نان) اسم ناشمارا است و برای معنی روزمره جمع طبیعی ندارد.'
    example_gloss:
    - من تخم ضرورت دارم.
    - نان مال امروز صبح است.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: پرسیدن قیمت
    gloss: قیمتش چند است؟
    note: '*Cuesta* شکل سوم شخص مفرد فعل *costar* (قیمت داشتن) است، فعلی که در این بخش تازه است.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: پرسیدن قیمت، شکل دیگر
    gloss: چند می‌شود؟
    note: یادداشت دستوری بعدی را ببینین که این را با *¿Cuánto cuesta?* مقایسه می‌کند.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: گفتن قیمت
    gloss: دو تمام می‌شود.
    note: یک جواب کوتاه و کامل برای قیمت -- واحد پول از موقعیت معلوم است، مثل این‌که در دری هم هنگام خرید گاهی فقط عدد گفته می‌شود.
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta و Cuánto es
    gloss: دو راه به همان اندازه طبیعی برای پرسیدن قیمت.
    note: متن خود کارت را ببینین.
    target_text: '*¿Cuánto cuesta?* (قیمتش چند است؟) و *¿Cuánto es?* (چند می‌شود؟) هر دو برای پرسیدن قیمت طبیعی اند -- در خرید روزمره به جای هم استفاده می‌شوند.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: خواستن یک درجن تخم
    gloss: یک درجن تخم، لطفاً.
    note: '*Docena* (درجن) در اسپانیایی اسم است و همیشه بعد از آن *de* و بعد چیز مورد نظر می‌آید.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: خواستن یک کیلو تماتر
    gloss: یک کیلو تماتر، لطفاً.
    note: '*Kilo* هم مثل *docena* از الگوی *de* به علاوهٔ چیز مورد نظر پیروی می‌کند.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: نیم کیلو
    gloss: نیم کیلو
    note: '*Medio* (نیم) پیش از اسمی می‌آید که توصیف می‌کند و با آن در جنس موافقت می‌کند (*medio kilo* مذکر؛ *media docena* مؤنث است).'
    example_gloss: نیم کیلو نان، لطفاً.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: کمی از
    gloss: کمی از
    note: '*Un poco de* برای مقدار کم و نامشخص به کار می‌رود، وقتی مقدار دقیق ضرورت نیست.'
    example_gloss: کمی میوه می‌خواهم.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: پرسیدن این‌که چیز دیگری ضرورت است
    gloss: دیگر چیزی ضرورت دارید؟
    note: '*Necesita* شکل *usted* فعل *necesitar* است، یعنی لحن محترمانه‌ای که فروشنده معمولاً با مشتری به کار می‌برد.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: گفتن این‌که همه چیز را دارید
    gloss: نه، فکر می‌کنم همه چیز را داریم.
    note: '*Creo que* (فکر می‌کنم که) راه معمول نرم ساختن یک جمله است؛ اینجا کامل بودن فهرست خرید را تأیید می‌کند.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: تشکر از فروشنده
    gloss: عالی است، تشکر.
    note: یک پایان کوتاه و طبیعی برای خرید.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: خواندن برچسب قیمت
    gloss: 'دکان روزا: تماتر، کیلویی دو. تخم، درجنی چهار. نان، شش. میوهٔ تازه هر روز.'
    note: 'یک برچسب قیمت معمول دکان بازار: چیز، قیمت، بعد واحدی که قیمت برای آن است (*el kilo*، *la docena*). *Puesto* دکان بازار است؛ روزا این دکان را می‌گرداند.'
    glosses:
      Puesto: دکان
      tomates: تماتر
      kilo: کیلو
      Huevos: تخم
      docena: درجن
      Pan: نان
      Fruta: میوه
      fresca: تازه
      todos: هر
      días: روزها
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo به معنی «کیلویی»
    gloss: چگونه کلمهٔ واحد بعد از قیمت معنی «برای هر» آن واحد را می‌دهد.
    note: متن خود کارت را ببینین.
    target_text: '*El kilo* بعد از قیمت ("tomates, dos el kilo") یعنی «کیلویی» -- قیمت برای هر کیلویی است که می‌خرید.'
  es.a1.unit07.lesson06.teach.line01:
    title: پیشنهاد رفتن به بازار
    gloss: الینا پیشنهاد می‌کند برای مواد صنف بعدی به بازار بروند.
    note: '*Para la próxima clase* یعنی «برای صنف بعدی» -- نشست بعدی کارگاه آشپزی.'
  es.a1.unit07.lesson06.teach.line02:
    title: موافقت و پرسیدن ضرورت‌ها
    gloss: ماتیو موافقت می‌کند و می‌پرسد که چی ضرورت دارند.
    note: '*¿Qué necesitamos?* شکل *nosotros* فعل *necesitar* است، یعنی «ما چی ضرورت داریم».'
  es.a1.unit07.lesson06.teach.line03:
    title: نشان دادن بانجان رومی‌های تازه
    gloss: الینا می‌گوید اول سبزی، و نشان می‌دهد که بانجان رومی‌ها چقدر تازه اند.
    note: '*¡Qué tomates tan frescos!* (چقدر بانجان رومی‌های تازه!) یک جملهٔ تعجبی با *qué* است، مثل *¡Qué bonito!* در بخش ۳، اما با اسم ساخته می‌شود: *qué* + اسم + *tan* + صفت.'
  es.a1.unit07.lesson06.teach.line04:
    title: فروشنده مقدار را می‌پرسد
    gloss: فروشنده از الینا می‌پرسد که چقدر می‌خواهد.
    note: '*Señorita* یک طرز محترمانهٔ خطاب کردن دختر جوان است و با لحن *usted* فروشنده به مشتری جور می‌آید (بعضی‌ها امروز آن را کمی کهنه می‌دانند).'
  es.a1.unit07.lesson06.teach.line05:
    title: یک کیلو سفارش دادن و قیمت را پرسیدن
    gloss: الینا یک کیلو می‌خواهد و قیمت را می‌پرسد.
    note: '*un kilo* را با *¿Cuánto cuesta?* که پیش‌تر در همین بخش بود، در یک گفتگوی طبیعی یکجا می‌آورد.'
  es.a1.unit07.lesson06.teach.line06:
    title: گفتن قیمت
    gloss: فروشنده می‌گوید که قیمتش دو است.
    note: '*Cuesta dos* -- یک جواب کوتاه دربارهٔ قیمت است که واحد پول از موقعیت معلوم می‌شود.'
  es.a1.unit07.lesson06.teach.line07:
    title: ماتیو تخم و نان سفارش می‌دهد
    gloss: ماتیو می‌گوید که یک درجن تخم و نان ضرورت دارد.
    note: '*huevos*/*pan* را با *una docena de* که پیش‌تر در همین بخش بود یکجا می‌آورد؛ گفتن *yo* اختیاری است و کمی تأکید می‌دهد («من ضرورت دارم...»).'
  es.a1.unit07.lesson06.teach.line08:
    title: فروشنده هر دو قیمت را می‌گوید
    gloss: فروشنده می‌گوید که تخم‌ها چهار است و نان شش.
    note: '*Cuestan* (جمع) با فاعل جمع *los huevos* جور می‌آید و با *cuesta* مفرد که برای بانجان رومی‌ها بود فرق دارد.'
  es.a1.unit07.lesson06.teach.line09:
    title: از فروشنده تشکر کردن
    gloss: ماتیو می‌گوید عالی است، تشکر.
    note: همان ختم کوتاهی که پیش‌تر در همین بخش بود.
  es.a1.unit07.lesson06.teach.line10:
    title: از دوست پرسیدن که چیز دیگر ضرورت دارد یا نه
    gloss: الینا از ماتیو می‌پرسد که چیز دیگری ضرورت دارد یا نه.
    note: '*¿Necesitas...?* شکل *tú* است، برای دوست؛ *¿Necesita...?* فروشنده شکل *usted* است.'
  es.a1.unit07.lesson06.teach.line11:
    title: گفتن اینکه همه چیز را داریم
    gloss: ماتیو می‌گوید نه، فکر می‌کند که همین حالا همه چیز را دارند.
    note: '*Creo que* (فکر می‌کنم که) جواب را نرم‌تر می‌سازد؛ *ya* یعنی «همین حالا، قبلاً».'
