course:
  title: هسپانوی A1
  description: پرسیدن قیمت‌ها و مقدارها در بازار؛ داستان الینا و ماتیو ادامه پیدا می‌کند و آن‌ها برای صنف بعدی کارگاه خرید می‌کنند. کلمه‌های مقدار مثل docena، kilo و medio kilo قواعد خاص خود را دارند.
