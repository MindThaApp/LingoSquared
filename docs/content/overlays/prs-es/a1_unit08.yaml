course:
  title: هسپانوی A1
  description: جاهای معمول محل و حروف اضافهٔ مکان، در ادامهٔ قصهٔ الینا و ماتیو؛ این بار ماتیو که تازه به محل آمده، دربارهٔ محل می‌پرسد. پنج حرف اضافهٔ مکان در اسپانیایی رابطه‌های جداگانهٔ مکانی را نشان می‌دهند و به‌جای هم استفاده نمی‌شوند.
