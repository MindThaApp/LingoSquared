    - ما در رستورانت غذا می‌خوریم.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: کتابخانه
    gloss: کتابخانه
    note: '*Biblioteca* مؤنث است.'
    example_gloss: من در کتابخانه درس می‌خوانم.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: نزدیک
    gloss: رستورانت نزدیک بازار است.
    note: '*Cerca de* (نزدیک) همیشه پیش از جای مرجع *de* می‌گیرد.'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: دور از
    gloss: پارک از بازار دور است.
    note: '*Lejos de* (دور از) ضد *cerca de* است.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: پهلوی
    gloss: بانک پهلوی بازار است.
    note: '*Al lado de* (پهلوی) یک عبارت ثابت است (*al* = *a* + *el lado*). پیش از اسم مذکر مثل *mercado*، *de* + *el* به *del* تبدیل می‌شود: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: روبروی
    gloss: دواخانه روبروی بازار است.
    note: '*Enfrente de* (روبروی) دو جا را نشان می‌دهد که در دو طرف چیزی، مثلاً سرک، قرار دارند.'
  es.a1.unit08.lesson02.teach.entre:
    title: میان
    gloss: کتابخانه میان بانک و پارک است.
    note: '*Entre* (میان) دو نقطهٔ مرجع لازم دارد که اینجا با *y* (و) وصل شده‌اند.'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: پرسیدن از جای بانک
    gloss: بانک کجاست؟
    note: '*Dónde está* (کجاست) الگوی معمول سوال برای پیدا کردن جای یک مکان است.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: جواب با جای مکان
    gloss: پهلوی بازار است.
    note: '*Del* از *de* + *el* ساخته می‌شود و پیش از اسم مذکر *mercado* لازم است.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: پرسیدن از جای دواخانه
    gloss: دواخانه کجاست؟
    note: همین الگوی سوال برای اسمی که حرف تعریف مؤنث دارد؛ خود سوال با جنسیت تغییر نمی‌کند.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'جواب: روبرو'
    gloss: روبروی بازار است.
    note: '*Enfrente de* + *el mercado* می‌شود *enfrente del mercado*؛ همان تبدیل *del* مثل *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: پرسیدن که دور است یا نه
    gloss: دور است؟
    note: یک سوال کوتاه بعدی که وقتی فاعل از موضوع روشن است، حذف می‌شود.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'جواب: نه، نزدیک است'
    gloss: نه، نزدیک است.
    note: '*Cerca* به‌تنهایی (بدون *de*) به‌عنوان جواب کوتاه کار می‌دهد، برخلاف عبارت کامل *cerca de* که با نام یک جا می‌آید.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'جواب: بلی، خیلی دور است'
    gloss: بلی، خیلی دور است.
    note: '*Bastante* (خیلی، نسبتاً) معنی *lejos* را قوی می‌کند، اما نه به اندازهٔ *muy* (بسیار).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: خواندن دربارهٔ محل
    gloss: در این محل جاهای مفید زیادی وجود دارد. بانک پهلوی بازار است. دواخانه روبروی بازار است. پارک دور است، اما کتابخانه میان بانک و پارک است. رستورانت بسیار نزدیک بازار است.
    note: این متن کوتاه عبارت‌های مکانی این درس را در یک توصیف از محل یکجا می‌آورد.
    glosses:
      barrio: محل
      hay: وجود دارد (از haber)
      muchos: زیاد
      lugares: جاها
      útiles: مفید
      banco: بانک
      está: قرار دارد (از estar)
      lado: پهلو
      mercado: بازار
      farmacia: دواخانه
      enfrente: روبرو
      parque: پارک
      lejos: دور
      biblioteca: کتابخانه
      entre: میان
      restaurante: رستورانت
      cerca: نزدیک
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (وجود دارد)
    gloss: چرا hay برای مفرد و جمع تغییر نمی‌کند.
    note: متن خود کارت را ببینین.
    target_text: '*Hay* (هست/موجود است) برای مفرد و جمع تغییر نمی‌کند: *hay un banco* و *hay muchos lugares* هر دو از یک کلمه کار می‌گیرند.'
  es.a1.unit08.lesson06.teach.line01:
    title: پرسیدن از جای بانک
    gloss: ماتیو از الینا می‌پرسد که بانک کجاست.
    note: همان سوال *¿Dónde está...?* از پیش در این درس، که با نام الینا شروع شده تا توجه او را جلب کند.
  es.a1.unit08.lesson06.teach.line02:
    title: جواب و اشاره به بازار
    gloss: الینا می‌گوید که پهلوی بازار است، جایی که تخم خریدند.
    note: '*Donde compramos los huevos* (جایی که تخم خریدیم) به خریداری آن‌ها در درس ۷ اشاره دارد.'
  es.a1.unit08.lesson06.teach.line03:
    title: پرسیدن از دواخانه
    gloss: ماتیو تأیید می‌کند و از دواخانه می‌پرسد.
    note: '*Ah, sí* (آه، بلی) یک تأیید کوتاه طبیعی پیش از سوال بعدی است.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'جواب: روبرو'
    gloss: الینا می‌گوید که مقابل بازار است.
    note: 'یک جواب کوتاه: فاعل (*la farmacia*) حذف شده، چون از سوال معلوم است.'
  es.a1.unit08.lesson06.teach.line05:
    title: درباره پارک بپرسین
    gloss: ماتیو درباره پارک می‌پرسد که نزدیک است یا نه.
    note: دو سوال در یک نوبت گفتار یکجا شده، که در گپ‌وگفت روزمره طبیعی است.
  es.a1.unit08.lesson06.teach.line06:
    title: 'جواب: دور است، بعد کتابخانه را بگویین'
    gloss: الینا می‌گوید پارک دور است، اما کتابخانه بین بانک و پارک است.
    note: '*Pero* (اما) دوری پارک را با موقعیت مناسب‌تر کتابخانه مقایسه می‌کند.'
  es.a1.unit08.lesson06.teach.line07:
    title: تشکر کنید و درباره رستورانت بپرسین
    gloss: ماتیو از الینا تشکر می‌کند و درباره رستورانتی که در آن غذا خوردند می‌پرسد.
    note: '*El restaurante donde comimos* (رستورانتی که در آن غذا خوردیم) به ناهار آن‌ها در درس ۶ اشاره دارد.'
  es.a1.unit08.lesson06.teach.line08:
    title: تأیید کنید که خیلی نزدیک است
    gloss: الینا تأیید می‌کند که رستورانت خیلی نزدیک بازار است.
    note: '*Muy cerca* (خیلی نزدیک): *muy* (خیلی) از *bastante* (نسبتاً) قوی‌تر است، مثل *bastante lejos* (نسبتاً دور).'
