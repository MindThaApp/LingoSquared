course:
  title: هسپانوی A1
  description: سفارش دادن غذا و نوشیدنی در رستورانت، خواندن یک مینوی ساده و خواستن بل؛ ادامهٔ داستان الینا و ماتیو در چاشتی که در بخش پنجم قرار گذاشتند. راهنمایی ویژه، Quiero/Para mí را دو عبارت به یک اندازه طبیعی برای سفارش دادن نشان می‌دهد.
