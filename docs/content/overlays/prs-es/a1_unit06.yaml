teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: ساندویچ، سلاد
    gloss: ساندویچ، سلاد
    note: هر دو اسم از زبان دیگر گرفته شده اند؛ *sándwich* یک واژهٔ قرضی مستقیم است و برای نشان دادن هجای تکیه‌دار با accent نوشته می‌شود.
    example_gloss:
    - من یک ساندویچ می‌خواهم.
    - در سلاد بادرنگ بورکی است.
  es.a1.unit06.lesson01.teach.sopa:
    title: سوپ
    gloss: سوپ
    note: '*Sopa* مؤنث است، مثل بیشتر اسم‌های اسپانوی که به -a ختم می‌شوند.'
    example_gloss: سوپ بسیار خوب است.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: آب، قهوه
    gloss: آب، قهوه
    note: '*Agua* از نظر دستوری مؤنث است، اما در حالت مفرد حرف تعریف مذکر *el* (نه *la*) می‌گیرد، چون با آوای تأکیددار *a* شروع می‌شود؛ این یک بی‌قاعدگی واقعی زبان هسپانوی است، نه غلطی املایی.'
    example_gloss:
    - لطفاً آب می‌خواهم.
    - برای من یک قهوه.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: من یک ساندویچ می‌خواهم
    gloss: من یک ساندویچ می‌خواهم.
    note: '*Quiero* (می‌خواهم) شکل اول شخص مفرد فعل *querer* است، فعلی که در این بخش تازه است.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: برای من یک قهوه
    gloss: برای من یک قهوه.
    note: '*Para mí* (برای من) عبارت دیگر و معمول برای سفارش دادن است که چیز را بدون تکرار فعل نام می‌برد؛ یادداشت دستوری بعدی را ببینین.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: پرسیدن اینکه کسی چه می‌خواهد بخورد
    gloss: چه چیز خوردن می‌خواهی؟
    note: '*Quieres* شکل *tú* فعل *querer* است، شکل غیررسمی برای دوستان.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero و Para mí
    gloss: دو راه به یک اندازه طبیعی برای سفارش دادن.
    note: '*Quiero un café* و *Para mí, un café* هر دو برای سفارش دادن درست اند.'
    target_text: '*Quiero* («می‌خواهم») و *Para mí* («برای من»، پیش از نام بردن چیز گفته می‌شود) هر دو برای سفارش دادن در محیط غیررسمی طبیعی و به یک اندازه مؤدبانه اند؛ یکی از دیگری درست‌تر نیست.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: مینو
    gloss: مینو
    note: '*Menú* accent نوشتاری دارد چون تکیه روی هجای آخر می‌افتد.'
    example_gloss: می‌توانیم مینو را ببینیم؟
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: خواستن مینو
    gloss: می‌توانیم مینو را ببینیم؟
    note: '*Podemos* (می‌توانیم) شکل اول شخص جمع فعل *poder* است، فعلی که در این بخش تازه است.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: بفرمایید
    gloss: بفرمایید.
    note: '*Aquí tiene* عبارت معمولی است که پیشخدمت هنگام دادن چیزی به مشتری می‌گوید؛ حتی در گفتگوی غیررسمی از شکل مؤدبانهٔ *usted* کار می‌گیرد، یک عبارت ثابت احترام است، نه تغییر لحن.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: نوش جان
    gloss: نوش جان
    note: '*Buen provecho* چیزی است که پیش از شروع خوردن کسی می‌گویند، مثل «نوش جان» در دری.'
    example_gloss: بفرمایید، نوش جان.
  es.a1.unit06.lesson04.teach.el_postre:
    title: دسر
    gloss: دسر
    note: '*Postre* مذکر است.'
    example_gloss: برای دسر، کیک می‌خواهم.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: سفارش دسر
    gloss: برای دسر، کیک می‌خواهم.
    note: '*De postre* (برای دسر) چیزی را معرفی می‌کند که کسی منحیث آخرین غذا سفارش می‌دهد؛ مثل *para mí* که سفارش اصلی را معرفی می‌کند.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: خواستن بل
    gloss: بل را بیارید، لطفاً.
    note: '*La cuenta* (بل، حساب) روش معمول برای خواستن حساب در آخر غذا است.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: خواندن مینو
    gloss: 'مینو: ساندویچ، پنج. سلاد، هشت. شوربا، سه. قهوه یا آب، شامل. دسر: کیک.'
    note: یک مینوی چاپی واقعی، با همین لغات غذایی این درس و با قیمت‌ها.
    glosses:
      Menú: مینو
      sándwich: ساندویچ
      Ensalada: سلاد
      Sopa: شوربا
      Café: قهوه
      agua: آب
      incluido: شامل
      Postre: دسر
      pastel: کیک
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (شامل)
    gloss: معنی اینکه نوشیدنی «شامل» نوشته شده باشد.
    note: '*Incluido* = شامل، بدون پول اضافه.'
    target_text: '*Incluido* (شامل) یعنی نوشیدنی همراه غذا رایگان است و پول اضافه ندارد.'
  es.a1.unit06.lesson06.teach.line01:
    title: سلام و پرسیدن سفارش
    gloss: گارسون به الینا و ماتیو سلام می‌دهد و می‌پرسد چه غذایی می‌خواهند.
    note: '*Buenas tardes* (عصر بخیر) از نیمروز به بعد گفته می‌شود، پس برای وقت ناشتایی‌ ظهر مناسب است.'
  es.a1.unit06.lesson06.teach.line02:
    title: سفارش الینا
    gloss: الینا یک سلاد و آب سفارش می‌دهد، لطفاً.
    note: '*Una ensalada y agua* = یک سلاد و آب.'
  es.a1.unit06.lesson06.teach.line03:
    title: سفارش ماتیو
    gloss: ماتیو برای خودش یک ساندویچ و یک قهوه سفارش می‌دهد.
    note: به‌جای تکرار *Quiero*، از *Para mí* کار گرفته می‌شود.
  es.a1.unit06.lesson06.teach.line04:
    title: پرسیدن درباره دسر
    gloss: گارسون تأیید می‌کند و می‌پرسد دسر هم می‌خواهند یا نه.
    note: '*¿Algo de postre?* (دسر هم می‌خواهین؟) روش طبیعی و کوتاه برای پیشنهاد دسر است.'
  es.a1.unit06.lesson06.teach.line05:
    title: سفارش دسر برای هر دو
    gloss: الینا می‌گوید بلی، یک کیک برای هر دوی شان.
    note: '*Para los dos* (برای هر دوی ما) یعنی یک دسر را با هم تقسیم می‌کنند؛ انتخابی طبیعی در زندگی واقعی.'
  es.a1.unit06.lesson06.teach.line06:
    title: موافقت و خواستن بل
    gloss: ماتیو موافقت می‌کند و بل را می‌خواهد.
    note: '*La cuenta, por favor* = بل را بیارید، لطفاً.'
  es.a1.unit06.lesson06.teach.line07:
    title: دادن بل
    gloss: گارسون بل را به آن‌ها می‌دهد.
    note: '*Aquí tiene* وقتی گفته می‌شود که چیزی را به کسی می‌تین.'
  es.a1.unit06.lesson06.teach.line08:
    title: ختم گرم و صمیمی
    gloss: الینا از گارسون تشکر می‌کند و می‌گوید غذا چقدر خوب بود.
    note: '*¡Qué buena comida!* همان الگوی تعجبی *¡Qué ...!* را دارد که در *¡Qué bien!* و *¡Qué bonito!* هم است.'
