  es.a1.unit48.lesson05.mateo_y_elena_comparan:
    title: Mateo و Elena سرگرمی‌های شان را مقایسه می‌کنند
  es.a1.unit48.lesson06.planear_un_fin_de:
    title: برنامه‌ریزی یک آخر هفته با هم
teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *leer* (خواندن)، *hacer deporte* (ورزش کردن) و *cocinar* (آشپزی کردن).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*El tiempo libre* یک عبارت اسمی مذکر است و عبارت کلیدی برای صحبت از سرگرمی‌هاست.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Me gusta leer* (خواندن را دوست دارم) از *gustar* + مصدر ساخته می‌شود؛ *me gusta* برای هر کاری همین‌طور می‌ماند.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه فعل دیگر سرگرمی: *escuchar música* (گوش دادن به موسیقی)، *dibujar* (نقاشی کردن) و *jugar videojuegos* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: 'فعل *escuchar* مفعولش را مستقیم و بدون حرف اضافه می‌گیرد: *escuchar música*.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: در *Con amigos* (با دوستان) حرف اضافهٔ *con* از درس‌های پیشین دوباره آمده است.
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید اصلیِ تکرار: *siempre* (همیشه)، *a menudo* (اکثراً)، *a veces* (گاهی)، *nunca* (هرگز). معمولاً پیش از فعل یا در آغاز جمله می‌آیند.'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Cada semana* و *cada fin de semana* هر دو به معنی «هر» اند؛ شکل *cada* هیچ‌وقت تغییر نمی‌کند.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada هیچ‌وقت تغییر نمی‌کند
    gloss: 'Cada تغییر نمی‌کند: cada semana، cada fin de semana.'
    note: '*Cada* تغییر نمی‌کند: پیش از اسم‌های مؤنث (*semana*) و مذکر (*fin de semana*) یکسان است.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena دربارهٔ سرگرمی‌ها صحبت می‌کند
    gloss: 'Elena: ما اکثراً با هم قدم می‌زنیم. اما تو در وقت آزادت دیگر چه می‌کنی، Mateo؟'
    note: در *A menudo paseamos juntos* (ما اکثراً با هم قدم می‌زنیم)، *paseamos* صیغهٔ *nosotros* فعل *pasear* است.
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: سرگرمی‌های Mateo
    gloss: 'Mateo: آشپزی کردن را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: '*También en casa* (در خانه هم) نشان می‌دهد که Mateo برای تفریح هم آشپزی می‌کند، نه فقط در کارش در رستورانت.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena تعجب می‌کند
    gloss: 'Elena: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: '*Todo el día* (تمام روز) نشان می‌دهد که Mateo در کار هم خیلی آشپزی می‌کند.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo توضیح می‌دهد
    gloss: 'Mateo: بلی، اما آشپزی برایم آرام‌بخش است. و تو چه کار کردن را دوست داری؟'
    note: '*Cocinar me parece relajante* در اصل یعنی «آشپزی برایم آرام‌بخش معلوم می‌شود»؛ *me parece* + صفت راه طبیعی برای بیان نظر است.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: سرگرمی‌های Elena
    gloss: 'Elena: کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم.'
    note: دو فعلِ سرگرمی از درس‌های پیشین با *y* (و) در یک جمله کنار هم آمده‌اند.
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo دربارهٔ ویدیوگیم می‌پرسد
    gloss: 'Mateo: تو هم ویدیوگیم بازی می‌کنی؟'
    note: یک پرسش کوتاه بلی/نخیر با *jugar videojuegos* از درس دوم؛ *tú también* (تو هم) شکل غیررسمی *tú* را دارد.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: جواب Elena
    gloss: 'Elena: نخیر، من هرگز ویدیوگیم بازی نمی‌کنم. اما گاهی نقاشی می‌کنم!'
    note: '*Nunca* (هرگز) و *a veces* (گاهی) از درس سوم، در یک جواب در برابر هم آمده‌اند.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و Mateo اکثراً با هم قدم می‌زنیم. اما سرگرمی‌های دیگر هم داریم. Mateo آشپزی را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم. گاهی نقاشی می‌کنم، اما هرگز ویدیوگیم بازی نمی‌کنم. تو در وقت آزادت چه کار کردن را دوست داری؟
    note: پیام Elena مطالب درس‌های پیشین را خلاصه می‌کند و با پرسیدن سؤال اصلی این واحد از خواننده پایان می‌یابد.
    glosses:
      paseamos: قدم می‌زنیم
      menudo: اکثراً
      juntos: با هم
      otras: دیگر
      cocinar: آشپزی می‌کند
      gusta: دوست دارد
      casa: در خانه
      deporte: ورزش می‌کند
      leer: خواندن
      escucho: گوش می‌کنم
      música: موسیقی
      dibujo: نقاشی می‌کنم
      veces: گاهی
      videojuegos: ویدیوگیم بازی می‌کنی
      nunca: هرگز
      libre: آزاد
      tiempo: وقت
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo دربارهٔ آخر هفته می‌پرسد
    gloss: 'Mateo: این آخر هفته چه می‌کنی؟'
    note: در *Este fin de semana* (این آخر هفته)، *este* با اسم مذکر *fin de semana* آمده است.
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena هنوز تصمیم نگرفته
    gloss: 'Elena: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، اما می‌خواهم بیرون هم بروم.'
    note: '*Quiero salir* (می‌خواهم بیرون بروم) راه معمول برای گفتن این است که می‌خواهین از خانه بیرون شوین.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo یک پلان پیشنهاد می‌کند
    gloss: 'Mateo: با هم قدم بزنیم؟ بعدش برای هر دوی ما آشپزی می‌کنم.'
    note: '*Después* (بعدش) کلمهٔ ترتیب است: *primero*، *luego*، *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena موافقت می‌کند
    gloss: 'Elena: فکر خوبیست! هر دو کار را دوست دارم: قدم زدن و آشپزی کردن.'
    note: '*Las dos cosas* (هر دو چیز) نشان می‌دهد که Elena هر دو را به یک اندازه دوست دارد، نه یکی را بیشتر.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo تأیید می‌کند
    gloss: 'Mateo: عالی! پس شنبه می‌بینمت!'
    note: یک جملهٔ دوستانهٔ پایانی برای تأیید پلان *el sábado* (شنبه)؛ در اسپانیایی پیش از نام یک روز مشخص *el* می‌آید.
