course:
  title: هسپانوی A1
  description: 'هسپانوی مقدماتی برای صحبت از کارهای وقت آزاد: لغات سرگرمی‌ها، عبارت‌های بیان تکرار، پرسیدن و جواب دادن اینکه کسی در وقت آزادش چه می‌کند، و مقایسهٔ سرگرمی‌های دو نفر.'
units:
  es.a1.unit48.hobbies:
    title: سرگرمی‌ها و وقت آزاد
