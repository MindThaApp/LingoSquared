    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Animal* کلمهٔ عمومی است و *mascota* به‌طور خاص یعنی حیوان خانگی؛ *mascota* مؤنث است، حتی برای حیوان نر.'
    example_gloss:
