    title: Sacar a pasear و a شخصی
    gloss: 'وقتی مفعول یک حیوان یا یک شخص باشد، a پیش از آن می‌آید: saco al perro a pasear.'
    note: '*saco al perro* از کارت پیشین دوباره آمده است؛ *a* شخصی پیش از حیوانات یا کسانی می‌آید که دوستشان دارید.'
  es.a1.unit53.lesson02.teach.dar_de_comer:
