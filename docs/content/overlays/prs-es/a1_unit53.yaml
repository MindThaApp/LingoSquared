  description: 'اسپانوی مقدماتی برای صحبت دربارهٔ حیوانات خانگی و حیوانات معمول: نام بردن از آن‌ها، مراقبت ابتدایی (گردش، غذا دادن، بازی)، گفتن اینکه کدام حیوانات را دوست دارید حتی اگر حیوان خانگی نداشته باشین، و جمع منظم در اسپانوی.'
