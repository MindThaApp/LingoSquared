  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: گفتن اینکه چیزی ندارین'
    gloss: 'برای گفتن اینکه چیزی ندارین، no را پیش از tengo بگذارین: No tengo tiempo, no tengo mascota.'
    note: الگوی *no tengo* که قبلاً در *No tengo tiempo* آموختید دوباره می‌آید؛ فقط اسم تازه است.
