teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: تکت
    gloss: تکت
    note: '*El billete* در هسپانوی مذکر است، پس *un billete* می‌شود، نه *una*.'
    example_gloss: من یک تکت به Toledo می‌خواهم.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: تکت خواستن
    gloss: من یک تکت به Toledo می‌خواهم.
    note: '*Quisiera* ("می‌خواستم") درخواست را نرم می‌کند و از *quiero* مؤدبانه‌تر است.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: کارمند می‌پرسد کدام نوع
    gloss: تکت یک‌طرفه می‌خواهین یا رفت و برگشت؟
    note: '*Quiere* شکل محترمانه *usted* فعل *querer* است و اینجا برای یک کارمند ناآشنای ایستگاه استفاده شده است.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: مؤدبانه جواب دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*Por favor* یعنی «لطفاً»؛ درخواست مؤدبانه و کوتاه می‌ماند.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: شیوه سخن گفتن در کانتر
    gloss: در کانتر معمولاً از شکل محترمانه usted استفاده می‌کنند.
    note: با افراد ناآشنا که کار خدماتی می‌کنند، با *usted* صحبت می‌شود، نه با *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: پلاتفورم
    gloss: پلاتفورم
    note: '*El andén* مذکر است: *un andén*، *el andén*.'
    example_gloss: ریل به طلیطله از کدام پلاتفورم حرکت می‌کنه؟
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: پرسیدن از پلاتفورم
    gloss: ریل به طلیطله از کدام پلاتفورم حرکت می‌کنه؟
    note: '*¿De qué andén ...?* مخصوصاً از پلاتفورم می‌پرسه، نه از یک جای عمومی.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: گفتن معلومات حرکت
    gloss: ریل ساعت ده کم یک چارک از پلاتفورم پنج حرکت می‌کنه.
    note: '*Las diez menos cuarto* همان الگوی «کم یک چارک» ساعت را که در درس وقت خواندیم، دوباره به کار می‌بره.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: پرسیدن از وقت رسیدن
    gloss: ریل ساعت چند می‌رسه؟
    note: '*¿A qué hora llega ...?* وقت رسیدن را می‌پرسه؛ *llegar* منظم است و پیش از ساعت *a las* می‌آید.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: گفتن وقت رسیدن
    gloss: ریل ساعت یازده می‌رسه.
    note: '*Llega a las once* فعل *llegar* (رسیدن) را با *a las* پیش از ساعت به کار می‌بره.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: به وقت / تأخیر
    gloss: به وقت؛ تأخیر
    note: '*A tiempo* یک عبارت ثابت است برای کاری که مطابق وقت معین انجام می‌شه. *El retraso* (تأخیر) مذکر است.'
    example_gloss:
    - ریل به وقت حرکت نمی‌کنه.
    - 'توجه: ریل طلیطله تأخیر دارد.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: یک اعلان
    gloss: 'توجه: ریل طلیطله تأخیر دارد.'
    note: '*Atención* اعلان ایستگاه را شروع می‌کنه، مثل «توجه، مسافرین محترم».'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: منفی کردن «به وقت»
    gloss: ریل به وقت حرکت نمی‌کنه.
    note: '*No* درست پیش از فعل می‌آید و تمام جمله را منفی می‌سازه: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: تغییر پلاتفورم
    gloss: ریل به جای پلاتفورم پنج، از پلاتفورم سه حرکت می‌کنه.
    note: '*En lugar de* یعنی «به جای».'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: گفتن اندازهٔ تأخیر
    gloss: ریل ده دقیقه تأخیر دارد.
    note: '*Lleva retraso* (در اصل «تأخیر می‌برد») راه طبیعی گفتن تأخیر داشتن است.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: دروازه، خروجی، اتاق انتظار
    gloss: ورودی؛ خروجی؛ اتاق انتظار
    note: '*La entrada*، *la salida* و *la sala de espera* همه اسم‌های مؤنث استند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - اتاق انتظار کجاست؟
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: پرسیدن جای پلاتفورم
    gloss: پلاتفورم هفت کجاست؟
    note: این، الگوی *¿Dónde está ...?* را از درس‌های آدرس دادن دوباره به کار می‌بره.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: آدرس دادن
    gloss: مستقیم بروید و بعد به راست.
    note: '*Todo recto* و *a la derecha* عبارت‌های جهت از درس‌های آدرس دادن استند که این‌جا در ایستگاه دوباره آمده.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: پرسیدن از اتاق انتظار
    gloss: اتاق انتظار کجاست؟
    note: همان الگوی سؤال برای یک جای تازه.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: خواندن تکت چاپ‌شده
    gloss: 'تکت: مادرید اتوچا به طلیطله. حرکت: ده و ده دقیقه، پلاتفورم هفت. رسیدن: ده دقیقه کم یازده. رفت و برگشت. قیمت: دوازده یورو و چهل.'
    note: وقت حرکت و پلاتفورم، وقت رسیدن، نوع تکت و قیمت را دنبال کنید.
    glosses:
      Billete: تکت
      Salida: حرکت
      diez: ده
      andén: پلاتفورم
      siete: هفت
      Llegada: رسیدن
      once: یازده
      vuelta: تکت رفت و برگشت
      Precio: قیمت
      doce: دوازده
      euros: یورو
      cuarenta: چهل
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: ماتیو پلان را می‌گوید
    gloss: 'ماتیو: ما باید به پلاتفورم هفت برویم. ریل ساعت ده و ده دقیقه حرکت می‌کنه.'
    note: '*Tenemos que* + مصدر («باید ... کنیم») یک ضرورت عملی را بیان می‌کنه.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: النا تخته را می‌خواند
    gloss: 'النا: ببین، تخته اینه: تأخیر، ده دقیقه.'
    note: '*Ahí está* («آنجاست») تخته را نشان می‌دهد؛ *el panel* تختهٔ معلومات است.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: ماتیو آرام می‌ماند
    gloss: 'ماتیو: مشکلی نیست، هنوز برای یک پیاله چای/قهوه وقت داریم.'
    note: '*No hay problema* یک جملهٔ دلداری عام و دوستانه است.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: ریل می‌رسد
    gloss: 'النا: فکر خوب است. آه، ریل حالا رسید! پلاتفورم هفت، درست!'
    note: '*Ya* («حالا / همین حالا») نشان می‌دهد که ریل با وجود تأخیرِ اعلان‌شده زودتر از انتظار رسیده.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: سوار ریل می‌شوند
    gloss: 'ماتیو: زود شو، همه سوار می‌شوند! طلیطله، ما آمدیم!'
    note: '*Suben* («سوار می‌شوند») از *subir* یعنی سوار شدن است؛ *¡Allá vamos!* راه طبیعی گفتن «ما رفتیم/روان شدیم» است و به شکل کلمه به کلمه ترجمه نمی‌شود.'
