  es.a1.unit13.lesson01.teach.la_oficina:
    title: دفتر
    gloss: دفتر
    note: '*Oficina* مؤنث است.'
    example_gloss: من در یک دفتر کار می‌کنم.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: میز تحریر
    gloss: میز تحریر
    note: '*Escritorio* مذکر است.'
    example_gloss: این میز تحریر من است.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: مکتب
    gloss: مکتب
    note: '*Escuela* مؤنث است.'
    example_gloss: من در یک مکتب درس می‌دهم.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: شاگردان
    gloss: شاگردان
    note: '*Estudiante* برای مرد و زن یک شکل دارد؛ جمع *los estudiantes* گروه مخلوط را هم در بر می‌گیرد.'
    example_gloss: بیست شاگرد دارم.
  es.a1.unit13.lesson02.teach.trabajar:
    title: کار کردن
    gloss: کار کردن
    note: شکل مصدر فعل، که در ساختارهایی مثل *me gusta trabajar* (کار کردن را دوست دارم) استفاده می‌شود.
  es.a1.unit13.lesson02.teach.soy_contador:
    title: بگویین محاسب استید
    gloss: من محاسب استم.
    note: نام وظیفه با *ser* + وظیفه بدون حرف تعریف می‌آید -- یادداشت دستور زبان را در پایین ببینین.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: بگویین معلمه استید (مؤنث)
    gloss: من معلمه استم.
    note: '*Profesora* شکل مؤنث *profesor* است.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: بگویین کجا درس می‌تین
    gloss: من در یک مکتب درس می‌دهم.
    note: '*Enseño* (درس می‌دهم) شکل اول شخص *enseñar* است، همراه با *escuela* (مکتب).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: نام وظیفه با ser
    gloss: اسپانیایی چطور وظیفه را بدون حرف تعریف بیان می‌کند.
    note: متن خود کارت را ببینین.
    target_text: 'نام وظیفه با *ser* + وظیفه می‌آید، بدون حرف تعریف: *soy contador* (من محاسب استم)، نه *soy un contador*. *Contador* شکل مؤنث *contadora* را دارد؛ *profesor/profesora* هم برای «معلم» همین جفت مذکر/مؤنث است (برای زن *-a* اضافه می‌شود).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: از کار کسی بپرسین
    gloss: شما چه کار می‌کنین؟
    note: '*¿En qué trabajas?* (تحت‌اللفظی «در چه کار می‌کنی؟») شکل معمول پرسیدن از شغل کسی است.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: با کار تان جواب بتین
    gloss: من در یک دفتر کار می‌کنم. من محاسب استم.
    note: '*oficina* را با *soy contador* در یک جواب طبیعی دو جمله‌ای یکجا می‌کند.'
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: بگویین کارتان را دوست دارید
    gloss: کارم را دوست دارم.
    note: ساختار *gustar* را با *mi trabajo* (کار من) دوباره به‌کار می‌برد.
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: ترجیح تان را بگویین
    gloss: اما آشپزی کردن را بیشتر دوست دارم.
    note: '*Prefiero* (ترجیح می‌دهم) شکلی است که قبلاً دیده‌اید؛ *cocinar* (آشپزی کردن) مصدر کاری است که محور این قصه است.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: بگویین هر دوی تان این را بیشتر دوست دارید
    gloss: ما هر دو این را بیشتر دوست داریم.
    note: '*Preferimos* شکل *nosotros* فعل *preferir* است، وقتی الینا و ماتیو با هم موافق استند.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: خواندن دربارهٔ کار شان
    gloss: ماتیو در یک دفتر در لندن کار می‌کند. او محاسب است. الینا در یک مکتب درس می‌دهد. او معلمه است و بیست شاگرد دارد. کار هر دوی شان را دوست دارند، اما روزهای سه‌شنبه آشپزی کردن با هم را بیشتر دوست دارند.
    note: خلاصهٔ کوتاه دربارهٔ کار روزانهٔ ماتیو و الینا.
    glosses:
      trabaja: کار می‌کند (از trabajar)
      oficina: دفتر
      contador: محاسب
      enseña: درس می‌دهد (از enseñar)
      escuela: مکتب
      profesora: معلمه
      tiene: دارد (از tener)
      veinte: بیست
      estudiantes: شاگردان
      gusta: خوش می‌آید / دوست داشته می‌شود (از gustar)
      trabajo: کار
      prefieren: ترجیح می‌دهند (از preferir)
      cocinar: آشپزی کردن
      juntos: با هم
      martes: روزهای سه‌شنبه
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: چطور gustar به مفعول غیرمستقیم جمع گسترش می‌یابد.
    note: متن خود کارت را ببینین.
    target_text: '*A los dos les gusta* (هر دوی شان دوست دارند) ساختار *gustar* را که از قبل بلدید، به مفعول غیرمستقیم جمع می‌رساند -- *les* (به آن‌ها) به‌جای *me/te* (به من/به تو).'
  es.a1.unit13.lesson06.teach.line01:
    title: از کار ماتیو بپرسین
    gloss: الینا از ماتیو می‌پرسد چه کار می‌کند.
    note: همان سوالی که قبلاً یاد گرفتید، حالا با نام ماتیو.
  es.a1.unit13.lesson06.teach.line02:
    title: با کار او جواب بتین
    gloss: ماتیو می‌گوید در یک دفتر به حیث محاسب کار می‌کند.
    note: 'جواب کاملی که قبلاً یاد گرفتید: کجا کار می‌کند، بعد نام وظیفه‌اش.'
  es.a1.unit13.lesson06.teach.line03:
    title: واکنش نشان بتین و از کار خودش بگوید
    gloss: الینا آن را جالب می‌داند و می‌گوید که معلم است.
    note: '*Interesante* (جالب) کلمهٔ جدید است؛ بقیه *soy profesora* و *enseño en una escuela* است که از قبل می‌دانین.'
  es.a1.unit13.lesson06.teach.line04:
    title: بپرس که او تدریس را دوست دارد یا نه
    gloss: ماتیو می‌پرسد که آیا او تدریس را دوست دارد.
    note: '*¿Te gusta enseñar?* الگوی پرسش *gustar* را که قبلاً یاد گرفته‌اید با مصدر *enseñar* یکجا می‌کند.'
  es.a1.unit13.lesson06.teach.line05:
    title: تأیید کن و یک ترجیح اضافه کن
    gloss: الینا می‌گوید خیلی دوستش دارد، ولی ترجیح می‌دهد روزهای سه‌شنبه با او آشپزی کند.
    note: '*Contigo* (با تو) شکل ترکیبی جدید حرف اضافه و ضمیر است؛ *los martes* (روزهای سه‌شنبه) برای روزِ منظم هفته حرف تعریف جمع را به کار می‌برد.'
  es.a1.unit13.lesson06.teach.line06:
    title: با همان ترجیح موافقت کن
    gloss: ماتیو می‌گوید او هم کارش را دوست دارد، ولی آشپزی را ترجیح می‌دهد.
    note: '*A mí también* (من هم) الگوی تأکیدی موافقت با *gustar* است: *a mí* تأکید می‌کند که چه کسی آن را دوست دارد.'
  es.a1.unit13.lesson06.teach.line07:
    title: نتیجه‌گیری کن
    gloss: الینا نتیجه می‌گیرد که هر دوی شان این را (آشپزی با هم) ترجیح می‌دهند.
    note: '*Entonces* (پس) رابط منطقی جدید است؛ بقیه *los dos preferimos esto* (هر دوی ما این را ترجیح می‌دهیم) است.'
  es.a1.unit13.lesson06.teach.line08:
    title: با شور و شوق تأیید کن
    gloss: ماتیو موافقت می‌کند، قطعاً.
    note: '*Definitivamente* (قطعاً) قید جدیدی است که صحنه را به پایان می‌رساند.'
