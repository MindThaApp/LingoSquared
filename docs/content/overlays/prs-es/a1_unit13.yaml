course:
  title: هسپانوی A1
  description: توضیح دادن درباره کار خود، ادامه قصهٔ الینا و ماتیو؛ در تفریح صنف کارگاهی ۲۲ جولای دربارهٔ کارهای روزانهٔ شان حرف می‌زنند -- ماتیو محاسب و الینا معلمه -- و می‌فهمند که هر دو آشپزی کردن با هم را بیشتر دوست دارند.
