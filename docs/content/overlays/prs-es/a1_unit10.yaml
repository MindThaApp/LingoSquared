  description: بیان حال هوای عادی، ادامهٔ قصهٔ Elena و Mateo در صبح روز ۲۲ جولای، وقتی با هم به صنف ورکشاپ می‌روند و دربارهٔ گرمی هوا گپ می‌زنند.
