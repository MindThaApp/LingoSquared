teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: هوا
    gloss: هوا
    note: '*Tiempo* معنای «وقت» را هم دارد؛ معنای آن از روی جمله معلوم می‌شود.'
    example_gloss: امروز هوا چطور است؟
  es.a1.unit10.lesson01.teach.el_sol:
    title: آفتاب
    gloss: آفتاب
    note: '*Sol* مذکر است.'
    example_gloss: امروز آفتاب بسیار تیز است.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: باران
    gloss: باران
    note: '*Lluvia* مؤنث است.'
    example_gloss: من باران را دوست ندارم.
  es.a1.unit10.lesson01.teach.el_viento:
    title: باد
    gloss: باد
    note: '*Viento* مذکر است.'
    example_gloss: امروز باد زیاد است.
  es.a1.unit10.lesson01.teach.la_nube:
    title: ابر
    gloss: ابر
    note: '*Nube* مؤنث است.'
    example_gloss: حتی یک ابر هم نیست.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: هوا گرم است
    gloss: هوا گرم است.
    note: '*Hace calor* (لفظاً «گرما می‌سازد») اصطلاح معمول برای گفتن گرمی هواست.'
    example_gloss: در ماه جولای هوا بسیار گرم است.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: هوا سرد است
    gloss: هوا سرد است.
    note: '*Hace frío* همان الگوی *hace* + اسم مثل *hace calor* را دارد.'
    example_gloss: در ماه دسامبر هوا سرد است.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: هوا آفتابی است
    gloss: هوا آفتابی است.
    note: در *Hace sol* کلمهٔ *el sol* (آفتاب) در همان قالب اصطلاحی به کار رفته است.
  es.a1.unit10.lesson02.teach.llueve:
    title: باران می‌بارد
    gloss: باران می‌بارد.
    note: '*Llueve* شکل فعل خودش را دارد (از *llover*، باریدن) و از قالب *hace* نیست؛ یادداشت گرامر بعدی را ببینین.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: هوا ابری است
    gloss: هوا ابری است.
    note: '*Está nublado* از *estar* + صفت ساخته می‌شود؛ این سومین قالب جداگانه برای گفتن حالت هوا است.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: سه قالب'
    gloss: سه قالب مختلف گرامری برای بیان حالت هوا.
    note: متن خود کارت را ببینین.
    target_text: 'عبارت‌های هوا با *hace* (hace calor، hace frío، hace sol) یک اصطلاح ثابت استند، لفظاً «گرما/سردی/آفتاب می‌سازد». *Llueve* (باران می‌بارد) خودش یک شکل فعل است و *está nublado* (ابری است) از *estar* + صفت ساخته می‌شود؛ سه الگوی مختلف برای یک مقصد: بیان حال هوا.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: از حالت هوا بپرسین
    gloss: امروز هوا چطور است؟
    note: '*¿Qué tiempo hace hoy?* روش معمول پرسیدن از حالت هوای حال است و در آن *el tiempo* (هوا) به کار رفته است.'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: هوای گرم و آفتابی را توصیف کنید
    gloss: هوا خیلی گرم و آفتابی است.
    note: دو عبارت *hace* با *y* (و) به هم وصل شده‌اند.
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: هوای گرم و بادی را توصیف کنید
    gloss: هوا گرم است، اما باد هم می‌وزد.
    note: '*Pero* (اما) دو حالت هوا را در برابر هم می‌گذارد؛ گرما با باد، و برای باد از *hay* + اسم استفاده می‌شود، مثل *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: دربارهٔ زمستان مادرید صحبت کنید
    gloss: در زمستان در مادرید خیلی سرد است.
    note: '*En invierno* (در زمستان) نام یک فصل را می‌آورد و پایین‌تر با *en julio* مقایسه می‌شود.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: دربارهٔ گرمای ماه جولای صحبت کنید
    gloss: در جولای بیش از حد گرم است.
    note: '*Demasiado* (بیش از حد) معنای *calor* را از *mucho* (خیلی) قوی‌تر می‌کند.'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: بگویین چرا آب لازم دارید
    gloss: ما آب لازم داریم، چون هوا گرم است.
    note: '*Porque* (چون) یک نیاز را به دلیل آن که حالت هوا است وصل می‌کند؛ جملهٔ کاربردی برای کارگاه.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: خواندن گزارش هواشناسی
    gloss: امروز، بیست‌ودوم جولای، هوا خیلی گرم و آفتابی است. حتی یک پارچه ابر هم نیست. کمی هم باد است. روز خوبی است که به کارگاه آشپزی بروید، اما مهم است که آب با خود ببرید.
    note: گزارش کوتاه هوا برای ۲۲ جولای، روز درس آشپزی.
    glosses:
      Hoy: امروز
      veintidós: بیست‌ودوم
      julio: جولای
      hace: است / هوا ... است (از hacer)
      calor: هوای گرم / گرما
      sol: آفتابی / آفتاب
      hay: هست (از haber)
      nube: ابر
      También: همچنان / هم
      poco: کم
      viento: باد
      buen: خوب
      día: روز
      ir: رفتن
      taller: کارگاه
      cocina: آشپزی
      importante: مهم
      llevar: بردن / با خود داشتن
      agua: آب
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (کمی)
    gloss: un poco de مقدار کم را بیان می‌کند.
    note: متن خود کارت را ببینین.
    target_text: '*Un poco de* (کمی) با مقدار خوراکه‌ها به کار می‌رود و اینجا مقدار کم باد را می‌رساند؛ همان الگو با اسم تازه.'
  es.a1.unit10.lesson06.teach.line01:
    title: دربارهٔ گرما نظر بتین
    gloss: النا می‌گوید امروز چقدر گرم است.
    note: '*¡Qué calor hace hoy!* (امروز چه گرماست!) کاربرد تعجبی اصطلاح *hace calor* است.'
  es.a1.unit10.lesson06.teach.line02:
    title: موافقت کنید و جزئیات بگویین
    gloss: ماتیو موافقت می‌کند و می‌گوید حتی یک پارچه ابر هم نیست.
    note: '*hace mucho calor y hace sol* با *no hay ni una nube* ترکیب شده است.'
  es.a1.unit10.lesson06.teach.line03:
    title: پیشنهاد کنید آب ببرید
    gloss: النا می‌گوید برای راه آب لازم دارند.
    note: '*El camino* (راه) به راه رفتن‌شان تا کارگاه اشاره دارد.'
  es.a1.unit10.lesson06.teach.line04:
    title: موافقت کنید و دوکانی را نشان بتین
    gloss: ماتیو موافقت می‌کند و می‌گوید نزدیک اینجا یک دوکان است.
    note: '*Cerca de aquí* (نزدیک اینجا) از عبارت مکان *cerca de* (نزدیک) استفاده می‌کند.'
  es.a1.unit10.lesson06.teach.line05:
    title: زمستان و تابستان را مقایسه کنید
    gloss: النا زمستان سرد مادرید را با گرمای بیش از حد جولای امروز مقایسه می‌کند.
    note: دو جملهٔ فصلی *en invierno hace mucho frío* و *en julio hace demasiado calor* ترکیب شده‌اند.
  es.a1.unit10.lesson06.teach.line06:
    title: ترجیح خود را بگویین
    gloss: ماتیو می‌گوید گرما را ترجیح می‌دهد؛ در لندن تقریباً هر روز باران می‌بارد.
    note: '*Prefiero* (ترجیح می‌دهم) شکل تازهٔ فعل برای «من» است؛ *casi todos los días* (تقریباً هر روز) عبارت مفید برای بیان تکرار است.'
  es.a1.unit10.lesson06.teach.line07:
    title: موافقت کنید و عجله کنید
    gloss: النا موافقت می‌کند و می‌گوید باید بروند، وگرنه به درس دیر می‌رسند.
    note: '*Es verdad* یعنی «درست است»؛ *o* (یا) در اینجا نتیجه را نشان می‌دهد («وگرنه»).'
  es.a1.unit10.lesson06.teach.line08:
    title: موافقت کنید و بروید
    gloss: ماتیو می‌گوید حق با او است و می‌روند.
    note: '*Tienes razón* (حق با تو است) عبارت رایج برای موافقت است.'
