teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: بیشتر...از
    gloss: بیشتر...از
    note: '*Más...que* دو مقدار یا دو چیز متفاوت را مقایسه می‌کند -- یادداشت گرامر پایین را ببینین.'
    example_gloss: اپارتمان نو از اپارتمان کهنه کلان‌تر است.
  es.a1.unit15.lesson01.teach.menos_que:
    title: کمتر...از
    gloss: کمتر...از
    note: '*Menos...que*، ضد *más...que*.'
    example_gloss: اپارتمان کهنه از اپارتمان نو کمتر کلان است.
  es.a1.unit15.lesson01.teach.tan_como:
    title: به اندازهٔ...
    gloss: به اندازهٔ...
    note: '*Tan...como* دو چیز برابر را مقایسه می‌کند -- ساختاری واقعاً جداگانه از *más/menos* است، نه فقط راه دیگری برای گفتن همان مطلب.'
    example_gloss: Mateo مثل Elena خوب آشپزی می‌کند.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: نابرابری و برابری
    gloss: فرق میان más/menos...que و tan...como.
    note: متن خود کارت را ببینین.
    target_text: '*Más...que* (بیشتر...از) و *menos...que* (کمتر...از) دو چیز یا مقدار «متفاوت» را مقایسه می‌کنند. *Tan...como* (به اندازهٔ...) دو چیز «برابر» را مقایسه می‌کند -- ساختاری جداگانه است، نه فقط مترادف *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: مقایسهٔ اپارتمان نو
    gloss: اپارتمان نو از اپارتمان کهنه کلان‌تر است.
    note: '*Más grande que* (کلان‌تر از) کلمهٔ *grande* (کلان) را در قالب *más...que* می‌گذارد.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: مقایسهٔ اپارتمان کهنه
    gloss: اپارتمان کهنه از اپارتمان نو خوردتر است.
    note: '*Más pequeño que* (خوردتر از) کلمهٔ *pequeño* (خورد) را به کار می‌برد و مقایسه را از جهت مقابل بیان می‌کند.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: پرسیدن که کدام کلان‌تر است
    gloss: کدام اپارتمان کلان‌تر است؟
    note: '*¿Cuál...?* (کدام...؟) + صفت تفضیلی راه معمول برای پرسیدن یک مقایسه است.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: جواب دادن که کدام کلان‌تر است
    gloss: نو از کهنه کلان‌تر است.
    note: همان مقایسه، این بار به شکل جواب مستقیم به سوال *¿cuál...?*؛ در *el nuevo* (نو) اسم تکراری حذف شده است.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: مقایسهٔ برابر مهارت آشپزی
    gloss: Mateo مثل Elena خوب آشپزی می‌کند.
    note: '*Tan bien como* (به خوبی‌ی) از الگوی برابری *tan* + قید + *como* کار می‌گیرد؛ این الگو برای طرز انجام یک کار استفاده می‌شود، نه برای اندازهٔ یک اسم.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: بگویین که یک تیم خوب استید
    gloss: ما یک تیم خوب استیم.
    note: '*Somos* (استیم) + *un buen equipo* (یک تیم خوب) بعد از مقایسهٔ برابری، یک جملهٔ پایانی طبیعی است.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: مقایسهٔ دو آپارتمان
    gloss: آپارتمان کهنهٔ ماتیو آشپزخانهٔ کوچک دارد. آپارتمان نو بزرگ‌تر است و آشپزخانه‌اش هم بزرگ‌تر است. آپارتمان کهنه از نو کوچک‌تر است و به همین خاطر ماتیو می‌خواهد خانه‌اش را عوض کند. آپارتمان نو برای آشپزی جای بیشتر دارد.
    note: یک خلاصهٔ واقعی که هر دو آپارتمان را مقایسه می‌کند.
    glosses:
      viejo: کهنه
      tiene: دارد (از tener)
      pequeña: کوچک
      nuevo: نو
      grande: بزرگ
      también: همچنان / هم
      pequeño: کوچک
      eso: که
      quiere: می‌خواهد (از querer)
      mudarse: خانه عوض کردن
      espacio: جا / فضا
      cocinar: آشپزی کردن
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (به همین خاطر)
    gloss: چطور por eso یک سبب را به نتیجه‌اش وصل می‌کند.
    note: متن خود کارت را ببینین.
    target_text: '*Por eso* (به همین دلیل) سبب را به نتیجه وصل می‌کند -- آشپزخانهٔ خورد دلیلی است که Mateo می‌خواهد خانه‌اش را عوض کند؛ همان منطق سبب و نتیجه که در *porque* دیده‌اید.'
  es.a1.unit15.lesson06.teach.line01:
    title: بپرسین که دیده یا نه
    gloss: الینا می‌پرسد که ماتیو آپارتمان نو را دیده یا نه.
    note: '*¿Ya viste...?* (آیا ... را دیده‌ای؟) یک شکل سوالی نو در زمان گذشته است.'
  es.a1.unit15.lesson06.teach.line02:
    title: تأیید کنید که بزرگ‌تر است
    gloss: ماتیو تأیید می‌کند که از آپارتمان کهنه بزرگ‌تر است و آشپزخانه‌اش هم همین‌طور.
    note: یک مقایسهٔ *más...que* که با *la cocina también* (آشپزخانه هم) گسترش یافته است.
  es.a1.unit15.lesson06.teach.line03:
    title: بپرسین کدام کوچک‌تر است
    gloss: الینا می‌پرسد پس کدام آپارتمان کوچک‌تر است.
    note: '*Entonces* (پس) یک ربط‌دهندهٔ منطقی است که قبلاً دیده‌اید؛ سوال با الگوی *¿Cuál...?* و صفت *pequeño* به جای *grande* ساخته شده است.'
  es.a1.unit15.lesson06.teach.line04:
    title: جواب بتین و دلیل بگویین
    gloss: ماتیو می‌گوید کهنه کوچک‌تر است و به همین خاطر می‌خواهد خانه عوض کند.
    note: '*El viejo es más pequeño que el nuevo* به‌علاوهٔ *por eso quiero mudarme* (به همین خاطر می‌خواهم خانه عوض کنم).'
  es.a1.unit15.lesson06.teach.line05:
    title: موافقت کنید که معقول است
    gloss: الینا می‌گوید معقول است؛ آپارتمان نو برای آشپزی جای بیشتر دارد.
    note: '*Tiene mucho sentido* (خیلی معقول است) یک عبارت نوِ موافقت است؛ *más espacio para cocinar* یعنی جای بیشتر برای آشپزی.'
  es.a1.unit15.lesson06.teach.line06:
    title: دلیل را ادامه بتین
    gloss: ماتیو موافقت می‌کند و می‌افزاید که چون الینا مثل او خوب آشپزی می‌کند، برای هر دوی شان جای لازم دارند.
    note: '*Tan bien como* (به خوبی‌ی) حالا در گفتگو با *tú cocinas* (تو آشپزی می‌کنی) به کار رفته است.'
  es.a1.unit15.lesson06.teach.line07:
    title: تعریف را جواب بتین
    gloss: الینا با شور موافقت می‌کند و می‌گوید ماتیو هم مثل او خوب آشپزی می‌کند.
    note: '*¡Es verdad!* (راست است!) + *tú cocinas tan bien como yo* (تو مثل من خوب آشپزی می‌کنی) -- همان مقایسهٔ *tan bien como* که این بار به ماتیو برمی‌گردد.'
  es.a1.unit15.lesson06.teach.line08:
    title: با روحیهٔ تیمی تمام کنید
    gloss: ماتیو نتیجه می‌گیرد که یک تیم خوب استند.
    note: '*Somos un buen equipo* (ما یک تیم خوب استیم) گفتگو را به پایان می‌رساند.'
