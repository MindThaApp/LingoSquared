  es.a1.unit52.appearance:
    title: توصیف ظاهر
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: قدبلند، قدکوتاه، پیر و جوان
  es.a1.unit52.lesson02.describir_el_pelo:
    title: توصیف مو
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: چشم‌ها و اینکه کسی چطور شکلی دارد
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: الینا نینا را توصیف می‌کند
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: مقایسهٔ دیگو و لوسیا
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: ماتیو نینا را می‌شناسد
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Alto* برای شخص قدبلند و *bajo* برای شخص قدکوتاه است؛ هر دو با شخص هماهنگ می‌شوند: *alta*، *baja*.'
    example_gloss:
    - لوسیا قدبلند است.
    - دیگو قدکوتاه است.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Mayor* و *joven* یک برداشت عمومی از سن می‌دهند، نه تعداد دقیق سال‌ها.'
    example_gloss:
    - بابه کلان پیر است.
    - ماتیو جوان است.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: یک برداشت، نه یک عدد'
    gloss: برای گفتن سن دقیق از tener años استفاده می‌شود، مثل ¿Cuántos años tienes?؛ mayor بدون عدد فقط یک برداشت عمومی می‌دهد، مثل El abuelo es mayor.
    note: 'برای سن دقیق می‌گویید *tener años*: *¿Cuántos años tienes?* *Mayor* فقط یک برداشت عمومی می‌دهد، بدون عدد.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: لوسیا قدبلند و دیگو قدکوتاه است
    gloss: لوسیا قدبلند است و دیگو قدکوتاه.
    note: یک جملهٔ ساده با *y* («و»)، که زمینه را برای مقایسهٔ مستقیم در درس بعدی آماده می‌کند.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: مو
    gloss: مو
    note: '*El pelo* مذکر است و وقتی دربارهٔ موی یک شخص به شکل کلی صحبت می‌کنین، مفرد می‌ماند.'
    example_gloss: ماتیو موهای کوتاه و سیاه دارد.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'سه رنگ مو: *rubio* (زرد)، *castaño* (قهوه‌یی) و *gris* (خاکستری). *Rubio* با اسم هماهنگ می‌شود: *pelo rubio*، *melena rubia*.'
    example_gloss:
    - الینا موهای زرد دارد.
    - دیگو موهای قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Largo* (بلند) از درس قد دوباره می‌آید، این بار برای درازی مو؛ *corto* (کوتاه) تازه است: *el pelo largo*، *el pelo corto*.'
    example_gloss:
    - لوسیا موهای بلند دارد.
    - دیگو موهای کوتاه دارد.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: صفت بعد از اسم می‌آید
    gloss: 'صفت بعد از اسم می‌آید: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'در اسپانوی صفت بعد از اسم می‌آید و با آن هماهنگ می‌شود: *el pelo corto*، *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo و cabello
    gloss: 'Pelo و cabello یک معنا دارند. در این کورس ما pelo می‌گوییم: el pelo largo.'
    note: '*Pelo* و *cabello* هر دو در اسپانوی روزمره به معنای «مو» اند؛ این کورس *pelo* را به کار می‌برد.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: ماتیو موهای کوتاه و سیاه دارد
    gloss: ماتیو موهای کوتاه و سیاه دارد.
    note: '*Negro* (سیاه) از درس لباس‌ها دوباره به کار می‌رود.'
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: الینا موهای بلند و زرد دارد
    gloss: الینا موهای بلند و زرد دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Los ojos* جمع *el ojo* است؛ هر دو مذکر اند.'
    example_gloss: ماتیو چشم‌های قهوه‌یی دارد.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: '*Azul* (آبی) و *verde* (سبز) برای مذکر و مؤنث یک شکل دارند؛ *marrón* (قهوه‌یی) کلمهٔ معمول برای رنگ چشم است، اما برای مو *castaño* می‌گویند.'
    example_gloss:
    - الینا چشم‌های آبی دارد.
    - دیگو چشم‌های قهوه‌یی دارد.
    - لوسیا چشم‌های سبز دارد.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos صفت جمع می‌گیرد
    gloss: 'با ojos (جمع)، صفت هم جمع می‌شود: ojos azules, ojos marrones, ojos verdes.'
    note: 'صفت‌ها در شمار هماهنگ می‌شوند: *ojos* جمع است، پس *azules*، *marrones*، *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: الینا چطور شکلی دارد؟
    gloss: الینا چطور شکلی دارد؟
    note: '*¿Cómo es ...?* سوال اصلی این بخش است؛ برای پرسیدن دربارهٔ ظاهر هر کس از آن استفاده کنید.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: الینا موهای بلند و زرد و چشم‌های آبی دارد
    gloss: الینا موهای بلند و زرد و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *y* در یک جمله یکجا می‌کند.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: الینا نینا را معرفی می‌کند
    gloss: 'الینا: یک دختر تازه به کافهٔ زبان می‌آید. نامش نینا است.'
    note: '*Viene* («می‌آید») کسی تازه را معرفی می‌کند؛ *se llama* یعنی «نامش … است».'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: ماتیو می‌پرسد او چطور شکلی دارد
    gloss: 'ماتیو: عالی! چطور شکلی دارد؟'
    note: 'همان سوال اصلی این بخش بدون نام: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: الینا قد و موی نینا را توصیف می‌کند
    gloss: 'الینا: قدکوتاه است و موهای کوتاه و زرد دارد.'
    note: '*baja* از درس اول با لغات مو یکجا شده؛ *baja* مؤنث است چون نینا دختر است.'
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: ماتیو دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'ماتیو: چشم‌هایش چطور؟'
    note: '*¿Y los ojos?* موضوع را با حرف تعریف ادامه می‌دهد؛ در اسپانوی اینجا به *sus* ضرورت نیست.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: الینا چشم‌های نینا را توصیف می‌کند
    gloss: 'الینا: چشم‌های سبز دارد.'
    note: '*los ojos verdes* از درس چشم‌ها دوباره می‌آید.'
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: ماتیو او را خواهد شناخت
    gloss: 'ماتیو: تشکر! پس او را می‌شناسم.'
    note: '*La reconoceré* («او را خواهم شناخت») شکل آینده است؛ *la* یعنی «او را» و پیش از فعل می‌آید.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: مقایسهٔ دیگو و لوسیا
    gloss: دیگو و لوسیا برادر و خواهر اند، اما شکل شان فرق دارد. دیگو قدکوتاه است و موهای کوتاه و قهوه‌یی و چشم‌های قهوه‌یی دارد. لوسیا از دیگو قدبلندتر است و موهای بلند و قهوه‌یی و چشم‌های سبز دارد. و تو چطور شکلی داری؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      hermano: برادر
      hermana: خواهر
      eres: ظاهر شدن، به نظر آمدن
      diferentes: فرق دار
      bajo: کوتاه
      corto: کوتاه
      castaño: قهوه‌یی
      pelo: مو
      marrones: قهوه‌یی
      ojos: چشم‌ها
      alta: قدبلندتر
      largo: دراز
      verdes: سبز
      cómo: '(برای پرسیدن از ظاهر: چطور است؟)'
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: استفادهٔ دوبارهٔ الگوی مقایسه
    gloss: 'الگوی مقایسه را از قبل می‌دانی: más + صفت + que. اینجا برای آدم‌ها استفاده می‌شود: Lucía از Diego قدبلندتر است.'
    note: الگوی *más + adjective + que* از درس مقایسه‌ها، حالا برای مقایسهٔ آدم‌ها به کار می‌رود، نه برای چیزها.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: موهای Lucía از موهای Diego درازتر است
    gloss: موهای Lucía از موهای Diego درازتر است.
    note: '*Más largo que* دو چیز را مقایسه می‌کند: *el pelo más largo que Diego*؛ *largo* مذکر می‌ماند چون *pelo* مذکر است.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جملهٔ نمونه با *tengo* برای حرف زدن دربارهٔ خودت، که می‌توانی دوباره از آن کار بگیری.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo، Nina را می‌بیند
    gloss: 'Mateo: ببین، آن Nina است؟ موهایش کوتاه و بور است و چشم‌هایش سبز.'
    note: '*Mira* («ببین») صیغهٔ امر غیررسمی *mirar* است و اینجا برای نشان دادن چیزی به کار رفته.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena تأیید می‌کند
    gloss: 'Elena: بلی، آن Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina به Mateo سلام می‌کند
    gloss: 'Nina: سلام، تو Mateo استی؟'
    note: 'یک سؤال ساده و غیررسمی برای سلام: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo جواب سلام Nina را می‌دهد
    gloss: 'Mateo: بلی! از آشنایی با تو خوش شدم، Nina.'
    note: '*Encantado de conocerte* عبارت معمول اولین دیدار است؛ خانم می‌گوید *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را تمام می‌کند؛ Mateo، Nina را از توصیف قبلی Elena شناخت.
