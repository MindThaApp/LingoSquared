teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*Llamo* شکل *yo* فعل *llamar* است؛ با *te* یعنی «به تو زنگ می‌زنم». در هسپانوی برای چنین وعدهٔ نزدیک زمان حال به کار می‌رود.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: جواب دادن به تلفون
    gloss: سلام، من الینا استم.
    note: در هسپانوی گوینده در تلفون با *soy* + نام معرفی می‌شود (لفظاً «من استم»).
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: ماتیو هم همین‌طور جواب می‌دهد
    gloss: سلام، من ماتیو استم.
    note: همان الگوی *soy* + نام مثل *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*¿Con quién hablo?* عبارت معمول است وقتی نمی‌دانید کی زنگ زده.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: معرفی رسمی خود
    gloss: شما با الینا صحبت می‌کنین.
    note: '*Habla con* + نام شکل رسمی *usted* فعل *hablar* را به کار می‌برد: همتای مؤدبانهٔ *soy* + نام.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*¿Puedes...?* (کرده می‌توانی...؟) به‌علاوهٔ *repetir* (تکرار کردن) و *eso* (این/آن).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*No hables* امر منفی غیررسمی *hablar* است؛ *tan rápido* (این‌قدر تیز) درجه را نشان می‌دهد.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: '*Oír* (شنیدن) همراه با *no ... bien* (نه خوب) مشکل شنوایی را نشان می‌دهد و با *entender* (فهمیدن) فرق دارد؛ *te oigo* یعنی «صدایت را می‌شنوم».'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: '*el mensaje* اسم مذکر است. اسپانیایی‌زبان‌ها *el SMS* یا *el texto* هم می‌گویند، ولی *mensaje* کلمهٔ عادی و معمول است. در دری برای اسم‌ها جنسیت دستوری وجود ندارد، اما در اسپانیایی هر اسم مذکر یا مؤنث است.'
    example_gloss: پیام از الینا است.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: '*Enviar* (فرستادن) بعد از ضمیر *te* (برای تو) می‌آید: *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: '*Más tarde* (بعداً) در آخر جمله می‌آید: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'ماتیو: سلام الینا، می‌توانی به من زنگ بزنی؟ باید یک چیز را برایت بگویم. الینا: بلی، حتماً، پنج دقیقهٔ دیگر دوباره زنگ می‌زنم.'
    note: دقت کن که ماتیو چه می‌خواهد، چرا می‌خواهد و الینا چه وقت می‌گوید که زنگ می‌زند.
    glosses:
      Hola: سلام
      puedes: می‌توانی
      llamarme: زنگ زدن
      Tengo: باید
      algo: یک چیز
      contarte: گفتن
      claro: حتماً
      llamada: زنگ زدن
      cinco: پنج
      minutos: دقیقه
      devuelvo: دوباره
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: ماتیو تیلفون را جواب می‌دهد
    gloss: 'ماتیو: سلام، من ماتیو استم.'
    note: 'همان ساختار *soy* + نام از درس اول، حالا در تیلفون: کسی که تیلفون را جواب می‌دهد اول صحبت می‌کند و نامش را می‌گوید.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: الینا خودش را معرفی می‌کند
    gloss: 'الینا: سلام ماتیو، من الینا استم. ماتیو: خوش شدم که زنگ زدی!'
    note: '*Gracias por llamar* (تشکر که زنگ زدی) از *gracias por* + مصدر ساخته می‌شود.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: الینا از شیفت می‌پرسد
    gloss: 'الینا: اولین شیفتت چطور گذشت؟'
    note: '*Ha ido* ماضی نقلی فعل *ir* است (اینجا یعنی «گذشتن، پیش رفتن»): *ha* + اسم مفعول *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: ماتیو خبر خوش می‌دهد
    gloss: 'ماتیو: خیلی خوب گذشت، بهتر از آنچه فکر می‌کردم.'
    note: '*Ha ido muy bien* همان ماضی نقلی سوال را تکرار می‌کند؛ *mejor de lo esperado* (بهتر از انتظار) با *de lo* مقایسه می‌کند.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: ha ido، es و esperado با مصدرشان نشان داده می‌شوند
    gloss: ha ido → ir (رفتن)، es → ser (بودن)، esperado → esperar (انتظار داشتن)
    note: '*Ha ido*، *es* و *esperado* با مصدرشان نشان داده شده‌اند: *ir*، *ser*، *esperar*. فعلاً *ha ido muy bien* را مثل یک عبارت ثابت یاد بگیر؛ ماضی نقلی بعداً درست تمرین می‌شود.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: الینا افتخار می‌کند
    gloss: 'الینا: چه خوب که این را شنیدم! به تو افتخار می‌کنم.'
    note: '*Orgulloso/a de* (مفتخر به) یک ترکیب ثابت با *de* است؛ صفت با گوینده مطابقت می‌کند (*orgullosa* برای الینا).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: ماتیو متأثر می‌شود
    gloss: 'ماتیو: خیلی تشکر، این برایم خیلی معنی دارد.'
    note: '*Significa* شکل سوم شخص مفرد فعل *significar* (معنی داشتن) است؛ *para mí* (برای من) نشان می‌دهد برای چه کسی مهم است.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Su* اینجا ضمیر ملکی «ـش» (از او) است؛ با *usted* به معنی «شما» هم می‌آید. از موقعیت می‌فهمی که از کیست.'
