course:
  title: هسپانوی A1
  description: روزهای هفته، ماه‌های سال، و پرسیدن و گفتن تاریخ و روز تولد؛ ادامهٔ داستان ورکشاپ آشپزی الینا و ماتیو از بخش‌های ۰۱ تا ۰۳. تأکید خاص روی شیوهٔ گفتن تاریخ با عدد اصلی در هسپانوی است.
