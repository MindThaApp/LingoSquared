    title: الینا و ماتیو صنف بعدی را پلان می‌کنند
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: دوشنبه تا جمعه
    gloss: دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه، جمعه
    note: نام روزهای هفته در هسپانوی با حرف کوچک نوشته می‌شود، مگر این‌که در آغاز جمله بیاید.
    example_gloss:
    - کارگاه آشپزی سه‌شنبه‌ها است.
    - پنجشنبه‌ها زبان هسپانوی می‌خوانم.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: شنبه، یکشنبه
    gloss: شنبه، یکشنبه
    note: '*Sábado* و *domingo* در جمع -s می‌گیرند (*los sábados*, *los domingos*)؛ اما نام روزهای دیگر هفته در مفرد و جمع یکسان می‌ماند (مثلاً los martes).'
    example_gloss:
    - شنبه‌ها به بازار می‌روم.
    - یکشنبه‌ها استراحت می‌کنم.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: امروز جمعه است
    gloss: امروز جمعه است.
    note: '*Hoy* (امروز) به‌علاوهٔ *es* (است) و نام روز، روز امروز را مستقیم می‌گوید و به حرف تعریف ضرورت نیست.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: کارگاه سه‌شنبه‌ها است
    gloss: کارگاه آشپزی سه‌شنبه‌ها است.
    note: '*Los martes* (با حرف تعریف جمع *los*) یعنی «سه‌شنبه‌ها» به‌حیث برنامهٔ تکراری، نه فقط یک سه‌شنبهٔ مشخص.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: جنوری تا جون
    gloss: جنوری، فبروری، مارچ، اپریل، می، جون
    note: نام ماه‌ها در هسپانوی مثل نام روزها با حرف کوچک نوشته می‌شود، مگر این‌که اول جمله بیاید.
    example_gloss:
    - تولد من در مارچ است.
    - در جون هوا گرم است.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: جولای تا دسمبر
    gloss: جولای، اگست، سپتمبر، اکتوبر، نومبر، دسمبر
    note: '*Septiembre* با «سپتمبر» ریشهٔ مشترک دارد؛ نام بیشتر ماه‌ها در هسپانوی به نام‌های بین‌المللی شان نزدیک است.'
    example_gloss:
    - کارگاه آشپزی در جولای شروع می‌شود.
    - در دسمبر به دیدن فامیلم می‌روم.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: تولد من در مارچ است
    gloss: تولد من در مارچ است.
    note: '*En* (در) وقتی به کار می‌رود که فقط نام ماه گفته شود، بدون روز مشخص.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: پرسیدن تاریخ امروز
    gloss: تاریخ امروز چند است؟
    note: '*Qué fecha* (کدام تاریخ) شکل معمول پرسیدن تاریخ تقویم است و با *qué hora* (ساعت چند) فرق دارد که در یک درس بعدی می‌آید.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: گفتن تاریخ
    gloss: امروز بیست‌ودوم جولای است.
    note: '*El veintidós de julio* در اصل «بیست‌ودو جولای» خوانده می‌شود؛ هسپانوی برای تاریخ عدد اصلی به کار می‌برد، نه عدد ترتیبی.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: شکل تاریخ در هسپانوی
    gloss: طرز گفتن تاریخ در هسپانوی.
    note: عدد اصلی + de + نام ماه. برای روز اول ماه، *el primero* معمول است (به‌ویژه در امریکای لاتین) و *el uno* هم به کار می‌رود، به‌ویژه در هسپانیا.
    target_text: 'در هسپانوی تاریخ با عدد اصلی + de + نام ماه گفته می‌شود: el veintidós de julio لفظاً «بیست‌ودو جولای» است. برای روز اول ماه، بسیاری‌ها (به‌خصوص در امریکای لاتین) *el primero* (اول) می‌گویند؛ *el uno* هم رایج است، به‌خصوص در هسپانیه.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: پرسیدن موعد کارگاه
    gloss: کارگاه کی است؟
    note: '*Cuándo* (کی) دربارهٔ زمان به‌طور عمومی می‌پرسد؛ *qué fecha* (سوال دیگر این درس) مخصوصاً تاریخ تقویم را می‌پرسد. هر دو در اینجا طبیعی اند.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: گفتن تاریخ کارگاه
    gloss: کارگاه بیست‌ودوم جولای است.
    note: همان الگوی تاریخ *hoy es el veintidós de julio* دوباره آمده، فقط با فاعل دیگر (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: پرسیدن تولد کسی
    gloss: تولد تو کی است؟
    note: '*Tu cumpleaños* (تولد تو، غیررسمی) با شکل *tú* است که با دوستان به کار می‌رود.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: گفتن تاریخ تولد خود
    gloss: تولد من دهم مارچ است.
    note: برخلاف *en marzo* (در مارچ، فقط ماه)، تاریخ کامل تولد با *el* و شمارهٔ روز گفته می‌شود، مثل *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: گفتن تولد شخص سوم
    gloss: تولد ماتیو بیست‌ودوم اگست است.
    note: '*El cumpleaños de Mateo* (تولد ماتیو) برای نشان دادن مالکیت از *de* کار می‌گیرد، مثل *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: مبارک باشد!
    gloss: مبارک باشد! / تولدت مبارک!
    note: '*¡Felicidades!* کلمهٔ عمومی تبریک است و برای تولد و خبرهای خوب دیگر هم به کار می‌رود.'
    example_gloss: الینا، مبارک باشد! امروز تولد تو است.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: خواندن برنامهٔ کارگاه
    gloss: کارگاه آشپزی سه‌شنبه‌ها است. صنف بعدی بیست‌ودوم جولای است. بعد از آن، بیست‌ونهم جولای هم یک صنف است. کارگاه دوازدهم اگست ختم می‌شود.
    note: این برنامهٔ کوتاه، نام روزهای هفته و الگوی تاریخ را که یاد گرفته‌اید در یک متن پیوسته به کار می‌برد.
    glosses:
      taller: کارگاه
      cocina: آشپزی
      martes: سه‌شنبه‌ها
      próxima: بعدی
      clase: صنف
      veintidós: بیست‌ودو
      julio: جولای
      Después: بعد از آن
      hay: هست
      veintinueve: بیست‌ونه
      termina: ختم می‌شود
      doce: دوازده
      agosto: اگست
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: صنف بعدی
    gloss: صنف بعدی
    note: '*Próxima* (بعدی) با اسم مؤنث *clase* هماهنگ است؛ شکل مذکرش *próximo* می‌شود.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (بعد از)
    gloss: '*Después* چطور رویدادها را به ترتیب وصل می‌کند.'
    note: '*Después* = بعد از، بعداً.'
    target_text: '*Después* (بعد، بعداً) دو رویداد را به ترتیب وصل می‌کند: اول یک کار، بعد کار دیگر.'
  es.a1.unit04.lesson06.teach.line01:
    title: پرسیدن دربارهٔ صنف بعدی
    gloss: ماتیو از الینا می‌پرسد که صنف بعدی کارگاه کی است.
    note: '*La próxima clase del taller* = صنف بعدی کارگاه.'
  es.a1.unit04.lesson06.teach.line02:
    title: گفتن تاریخ
    gloss: الینا تأیید می‌کند که بیست‌ودوم جولای است، یک سه‌شنبه.
    note: الینا بعد از تاریخ *un martes* (یک سه‌شنبه) را اضافه می‌کند و تأیید می‌کند که صنف در روز همیشگی کارگاه، یعنی سه‌شنبه، است.
  es.a1.unit04.lesson06.teach.line03:
    title: پرسیدن این‌که کارگاه کی ختم می‌شود
    gloss: ماتیو می‌پرسد که کارگاه کی ختم می‌شود.
    note: '*Perfecto* (عالی) قبل از پرسیدن سوال بعدی، یک جملهٔ کوتاه و طبیعی برای تأیید است.'
  es.a1.unit04.lesson06.teach.line04:
    title: گفتن تاریخ ختم
    gloss: الینا می‌گوید که دوازدهم اگست ختم می‌شود.
    note: همان تاریخ ختمی که در برنامهٔ چاپ‌شده است.
  es.a1.unit04.lesson06.teach.line05:
    title: پرسیدن دربارهٔ تولد، وسط صحبت
    gloss: ماتیو «راستی» می‌گوید و می‌پرسد که تولد الینا کی است.
    note: '*Por cierto* (راستی) تغییر موضوع را در میان صحبت به شکل طبیعی شروع می‌کند.'
  es.a1.unit04.lesson06.teach.line06:
    title: گفتن تاریخ و برگرداندن سوال
    gloss: الینا می‌گوید دهم مارچ، بعد می‌پرسد «و مال تو؟»
    note: '*¿Y el tuyo?* (و مال تو؟) ضمیر ملکی *tuyo* را به کار می‌برد، یک شکل کوتاه تازه برای برگرداندن سوال دربارهٔ چیزی که قبلاً نام برده شده (*cumpleaños* مذکر است، پس *tuyo* نه *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: گفتن تولد ماتیو
    gloss: ماتیو می‌گوید بیست‌ودوم اگست.
    note: یک جواب کوتاه و کامل که الگوی تاریخ را بدون تکرار «تولد من است» به کار می‌برد؛ در گفتگوی تند و عادی طبیعی است.
  es.a1.unit04.lesson06.teach.line08:
    title: واکنش و یادآوری زمان
    gloss: الینا با خوشی واکنش نشان می‌دهد و می‌گوید تولد او بعد از ختم کارگاه است.
    note: '*Es después del taller* (بعد از کارگاه است): بیست‌ودوم اگست بعد از ختم کارگاه در دوازدهم اگست می‌آید.'
