    - Tengo una hermana.
  es.a1.unit03.lesson02.exercise01.select_mi:
    instruction: کدام عبارت «خانوادهٔ من» معنی می‌دهد؟
    correct_option: Mi familia
    distractors:
    - خانوادهٔ تو
    - Su familia
    accepted_answers:
