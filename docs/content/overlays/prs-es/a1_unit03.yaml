course:
  title: هسپانوی A1
  description: واژه‌های خانوادهٔ نزدیک و گسترده، صفت‌های ملکی و توصیف یک خانواده، در ادامهٔ داستان کارگاه آشپزی Elena و Mateo از درس‌های 01-02. تأکید بر کاربرد صفت‌های ملکی (mi/tu/su) و اسم‌های خانوادگی دارای جنسیت.
units:
  es.a1.unit03.family:
    title: خانوادهٔ Elena و Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: خانوادهٔ نزدیک
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'صفت‌های ملکی: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: خویشاوندان
  es.a1.unit03.lesson04.describing_family_size:
    title: در خانه چند نفر اند
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: خواندن معرفی یک خانواده
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: عکس‌های خانوادگی با Elena و Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: مادر
    gloss: مادر
    note: '*Madre* مؤنث است. *Mamá* در گفتار روزمرهٔ خانواده رایج‌تر است، اما *madre* بی‌طرف است و در فهرست واژه‌های این دوره می‌آید.'
  es.a1.unit03.lesson01.teach.padre:
    title: پدر
    gloss: پدر
    note: '*Padre* مذکر است. *Papá* معادل روزمرهٔ آن است، مثل *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: برادر
    gloss: برادر
    note: '*Hermano* مذکر و مفرد است.'
  es.a1.unit03.lesson01.teach.hermana:
    title: خواهر
    gloss: خواهر
    note: '*Hermana* مؤنث و مفرد است.'
  es.a1.unit03.lesson01.teach.hijo:
    title: پسر
    gloss: پسر
    note: '*Hijo* مذکر و مفرد است.'
  es.a1.unit03.lesson01.teach.hija:
    title: دختر
    gloss: دختر
    note: '*Hija* مؤنث و مفرد است.'
  es.a1.unit03.lesson01.teach.padres:
    title: پدر و مادر
    gloss: پدر و مادر
    note: '*Padres* (جمع مذکر) برای پدر و مادر با هم به کار می‌رود؛ اسپانیایی هر وقت گروه حتی یک عضو مرد داشته باشد، همین قالب را به کار می‌برد.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: برادر و خواهر
    gloss: برادر و خواهر؛ برادرها
    note: '*Hermanos* می‌تواند «برادرها» (همه مرد) یا «برادر و خواهر» (گروه مختلط) باشد، به همان قاعدهٔ *padres*: جمع مذکر گروه مختلط را هم در بر می‌گیرد.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: خانوادهٔ من
    gloss: خانوادهٔ من
    note: '*Mi* (بدون accent) صفت ملکی «من» است؛ برای جنسیت تغییر نمی‌کند، فقط برای جمع (*mis* با اسم‌های جمع).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: خانوادهٔ تو (غیررسمی)
    gloss: خانوادهٔ تو
    note: '*Tu* (بدون accent، برخلاف ضمیر *tú*) ملکی غیررسمی است و با سطح *tú* در درس 1 می‌خواند.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: خانوادهٔ او / شما (رسمی یا سوم شخص)
    gloss: خانوادهٔ او / شما
    note: '*Su* هم برای «او» و هم برای «شما» (رسمی، *usted*) به کار می‌رود؛ اسپانیایی تنها با صفت ملکی فرق نمی‌گذارد و معنی از سیاق جمله معلوم می‌شود.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: پرسیدن دربارهٔ برادر و خواهر
    gloss: برادر یا خواهر داری؟
    note: '*Tienes* شکل *tú* فعل *tener* است، همان فعلی که در درس 2 برای سن به کار رفت.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: گفتن تعداد برادر و خواهر
    gloss: من دو خواهر دارم.
    note: '*Tengo* (دارم) همراه با عدد و اسم خانوادگی، راه معمول توصیف برادر و خواهر است.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: پرسیدن بزرگ بودن خانواده
    gloss: خانوادهٔ تو بزرگ است؟
    note: '*Grande* (بزرگ) برای جنسیت تغییر نمی‌کند، فقط برای جمع (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: توصیف یک خانوادهٔ کوچک
    gloss: خانوادهٔ من کوچک است.
    note: '*Pequeña* با اسم مؤنث *familia* هماهنگ است؛ با اسم مذکر شکل مذکر *pequeño* می‌آید.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: پدرکلان
    gloss: پدرکلان
    note: '*Abuelo* مذکر و مفرد است.'
  es.a1.unit03.lesson03.teach.abuela:
    title: مادرکلان
    gloss: مادرکلان
    note: '*Abuela* مؤنث مفرد است.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: پدرکلان و مادرکلان
    gloss: پدرکلان و مادرکلان
    note: '*Abuelos* (مذکر جمع) برای یک جوره مختلط هم استفاده می‌شود، مثل *padres* و *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: کاکا / mama
    gloss: کاکا یا ماما
    note: '*Tío* علامت تکیه دارد، چون تکیه روی *í* می‌آید و از دیفتانگ شدن آن جلوگیری می‌کند.'
  es.a1.unit03.lesson03.teach.tia:
    title: خاله یا عمه
    gloss: خاله یا عمه
    note: '*Tía* به همان دلیلِ *tío* همان علامت تکیه را دارد.'
  es.a1.unit03.lesson03.teach.primo:
    title: پسرکاکا / پسرماما (پسر)
    gloss: پسرکاکا یا پسرخاله
    note: '*Primo* مذکر مفرد است؛ در هسپانوی جنسیت پسرکاکا یا دخترکاکا با کلمه مشخص می‌شود، اما در دری برای هر دو یک اصطلاح عمومی هم می‌توان گفت.'
  es.a1.unit03.lesson03.teach.prima:
    title: دخترکاکا یا دخترخاله
    gloss: دخترکاکا یا دخترخاله
    note: '*Prima* مؤنث مفرد است.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: پدرکلان و مادرکلان من
    gloss: پدرکلان و مادرکلانم
    note: '*Mis* شکل جمع *mi* است و هرگاه اسمِ بعدی جمع باشد، بدون توجه به جنسیت آن، به کار می‌رود.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: پرسیدن تعداد خواهر و برادر
    gloss: چند خواهر و برادر داری؟
    note: '*Cuántos* (مذکر جمع، چون *hermanos* گروه مختلط را هم می‌رساند) با اسمی که درباره‌اش می‌پرسد مطابقت دارد.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: گفتن تعداد اعضای خانه
    gloss: ما در خانه پنج نفر استیم.
    note: '*Somos* (ما استیم) راه طبیعی گفتن تعداد کل اعضای خانه در هسپانوی است.'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: توصیف خانوادهٔ کلان
    gloss: خانوادهٔ من کلان است.
    note: '*Grande* در اینجا صفت *familia* (مؤنث) است، ولی همان شکل *grande* را دارد که با اسم‌های مذکر هم می‌آید، چون صفت‌هایی که به حرف e ختم می‌شوند، مثل *grande*، برای جنسیت تغییر نمی‌کنند.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: گفتن اینکه پسرکاکا و دخترکاکای زیاد داری
    gloss: من پسرکاکا و دخترکاکای زیاد دارم.
    note: '*Muchos* (مذکر جمع) استفاده شده، چون *primos* مثل *hermanos* و *padres* می‌تواند گروه مختلط را برساند.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: پرسیدن از زندگی نزدیک والدین
    gloss: آیا نزدیک پدر و مادرت زندگی می‌کنی؟
    note: '*Tus* شکل جمع *tu* است و چون *padres* جمع است، لازم می‌شود.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: گفتن اینکه با کی زندگی می‌کنی
    gloss: من با پدرکلان و مادرکلانم زندگی می‌کنم.
    note: '*Con* (با) کسانی را معرفی می‌کند که با آن‌ها زندگی می‌کنی؛ *vivo* شکل *yo* فعل *vivir* است که در واحد ۱ در *vivo en Londres* دیده بودی.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: پروفایل خانوادهٔ الینا
    gloss: 'نام من Elena است. سی و یک ساله هستم و با پدرکلان و مادرکلانم در هسپانیه زندگی می‌کنم. مادر و پدرم در Barcelona زندگی می‌کنند. یک خواهر و یک برادر دارم: ما در خانه پنج نفر استیم. خواهر کوچکم Sofía نام دارد و بیست ساله است.'
    note: این پروفایل لغات و ساختارهای درس‌های ۱ تا ۴ را در یک متن کوتاه پیوسته دوباره می‌آورد، نه در جمله‌های جداگانه؛ همان مهارت خواندنِ «کی کیست» که ارزیابی خواندن این واحد روی آن تمرکز دارد.
    glosses:
      llamo: نام دارم (از llamarse)
      Tengo: هستم / دارم (از tener)
      treinta: سی
      años: ساله
      vivo: زندگی می‌کنند (از vivir)
      abuelos: پدرکلان و مادرکلان
      madre: مادر
      padre: پدر
      viven: زندگی می‌کنند (از vivir)
      hermana: خواهر
      hermano: برادر
      somos: ما استیم (از ser)
      cinco: پنج
      casa: خانه
      menor: کوچک‌تر
      tiene: است / دارد (از tener)
      veinte: بیست
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: خواهر کوچک
    gloss: خواهر کوچک
    note: '*Menor* (کوچک‌تر) بعد از اسمی که توصیف می‌کند می‌آید و برای جنسیت تغییر نمی‌کند.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: زندگی می‌کند (شخص سوم)
    gloss: زندگی می‌کند
    note: '*Vive* شکل سوم شخص مفرد *vivir* است و برای گفتن دربارهٔ دیگران (*Elena vive*...) به کار می‌رود، نه برای خود شخص (*vivo*، که در درس ۴ واحد ۱ و درس ۴ همین واحد آمده).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: او/شان (اسم جمع)
    gloss: او / شان
    note: '*Sus* شکل جمع *su* است؛ همان‌گونه که *su* برای اسم مفرد «او، شان، شما (رسمی)» را می‌رساند -- *sus abuelos* وقتی دربارهٔ Elena حرف می‌زنیم یعنی «پدرکلان و مادرکلانش».'
  es.a1.unit03.lesson06.teach.line01:
    title: نشان دادن عکس‌های خانواده
    gloss: Elena عکسی را به Mateo نشان می‌دهد و والدین و خواهر کوچکش را معرفی می‌کند.
    note: '*Estos son* (این‌ها استند، مذکر یا مختلط جمع) والدین را معرفی می‌کند؛ *esta es* (این است، مؤنث مفرد) خواهر را معرفی می‌کند.'
  es.a1.unit03.lesson06.teach.line02:
    title: واکنش و پرسیدن دربارهٔ خواهر و برادر
    gloss: Mateo با گرمی واکنش نشان می‌دهد و می‌پرسد که خواهر و برادر دیگر هم دارد یا نه.
    note: '*Qué bonito* واکنش طبیعی و گرم هنگام دیدن عکس است، شبیه *Qué bien* در واحد ۱.'
  es.a1.unit03.lesson06.teach.line03:
    title: گفتن تعداد اعضای خانه و پرسیدن همان سوال
    gloss: Elena می‌گوید یک خواهر و یک برادر دارد -- در خانه پنج نفر استند -- و بعد از خانوادهٔ Mateo می‌پرسد.
    note: '*Somos cinco en casa* تعداد کل اعضای خانه را می‌گوید و الگوی درس ۴ را ادامه می‌دهد.'
  es.a1.unit03.lesson06.teach.line04:
    title: توصیف خانوادهٔ کوچک‌تر
    gloss: 'Mateo می‌گوید خانواده‌اش کوچک‌تر است -- فقط سه نفر: والدینش و خودش -- اما پسرکاکا و دخترکاکای زیاد دارد.'
    note: '*Pero* (اما) تضاد میان خانوادهٔ کوچک نزدیک و خویشاوندان زیاد را نشان می‌دهد.'
  es.a1.unit03.lesson06.teach.line05:
    title: پرسیدن از نزدیکی به والدین
    gloss: Elena می‌پرسد که Mateo نزدیک والدینش زندگی می‌کند یا نه.
    note: '*Cerca de* (نزدیک) راه معمول گفتن نزدیکی فزیکی است.'
  es.a1.unit03.lesson06.teach.line06:
    title: توضیح فاصله و در تماس ماندن
    gloss: Mateo می‌گوید نه، آن‌ها در Colombia زندگی می‌کنند و هر هفته با تیلفون صحبت می‌کنند.
    note: این بخش حقیقت واحد ۱ را ادامه می‌دهد که Mateo اهل Colombia است اما در London زندگی می‌کند -- والدینش در Colombia مانده‌اند.
  es.a1.unit03.lesson06.teach.line07:
    title: همدردی کردن و گفتن وضعیت خودت
    gloss: Elena می‌گوید می‌فهمد و خودش اینجا در هسپانیه با پدرکلان و مادرکلانش زندگی می‌کند.
    note: '*Entiendo* (می‌فهمم) راه کوتاه و طبیعی است برای پذیرفتن حرف طرف مقابل، پیش از آنکه جزئیات مربوط به خودت را بگویی.'
  es.a1.unit03.lesson06.teach.line08:
    title: پایان دادن با یک حرف گرم
    gloss: Mateo می‌گوید خوب است که خانواده نزدیک آدم باشد.
    note: '*Qué bien tener a la familia cerca* گفتگو را با لحنی گرم و اندیشمندانه ختم می‌کند و الگوی *qué bien*/*qué bonito* را که در این گفتگو آمده تکرار می‌کند.'
