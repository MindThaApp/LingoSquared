answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: هسپانوی A1
  description: هسپانوی مقدماتی برای پیشنهاد دادن، قبول و رد کردن، وقت گذاشتن، خواندن و نوشتن برنامه‌های ساده.
units:
  es.a1.unit50.plans:
    title: ساختن برنامهٔ ساده
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: پیشنهاد یک کار
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: قبول یا رد کردن یک برنامه
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: توافق بر روز و وقت
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: خواندن یک دعوت‌نامه
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: نوشتن و تأیید برنامه
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: الینا و ماتیو برنامه می‌سازند
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: با هم
    gloss: با هم
    note: '*Juntos* روشن می‌سازد که کار را چند نفر با هم می‌کنند؛ با کسان هماهنگ می‌شود (اگر همه زن باشند *juntas*).'
    example_gloss: با هم قهوه بنوشیم؟
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: قهوه نوشیدن
    gloss: قهوه نوشیدن
    note: هسپانوی می‌گوید *tomar un café* (به معنی «یک قهوه گرفتن»)، نه «قهوه نوشیدن» با فعل نوشیدن.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: رفتن به سینما
    gloss: رفتن به سینما
    note: '*Ir al cine* («رفتن به سینما») طرز معمول گفتن رفتن برای دیدن فلم است؛ *al* یعنی *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: قهوه بنوشیم؟
    gloss: قهوه بنوشیم؟
    note: '*¿Tomamos ...?* زمان حال *nosotros* است و برای پیشنهاد کاری با هم به کار می‌رود.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: استفاده از ¿Tomamos ...?
    gloss: ¿Tomamos + چیزی؟ طرز معمول پیشنهاد کردن یک کار با هم است.
    note: 'شکل *nosotros* (*tomamos*) برای پیشنهاد با هم به کار می‌رود: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: دل داری سینما برویم؟
    gloss: دل داری سینما برویم؟
    note: '*¿Tienes ganas de ...?* به شکل دوستانه می‌پرسد که کسی دل دارد کاری بکند یا نه؛ بعد از *de* مصدر می‌آید.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: بلی، چه خوب!
    gloss: بلی، چه خوب!
    note: '*¡Sí, qué bien!* یک قبول کردن کوتاه و پرشور است.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: فکر خوب
    gloss: فکر خوب است!
    note: '*¡Buena idea!* پیشنهاد را با تعریف از آن قبول می‌کند.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: این برنامهٔ خوب است
    gloss: این برنامهٔ خوب است.
    note: این یک جواب مثبت کمی کامل‌تر است.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: رد کردن با دلیل
    gloss: معذرت می‌خواهم، نمی‌توانم، چون کار دارم.
    note: '*Lo siento* رد کردن را نرم می‌سازد و *porque* دلیل کوتاه را می‌آورد.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: وقت ندارم
    gloss: وقت ندارم.
    note: '*No tengo tiempo* دلیل مستقیم اما معمول برای رد کردن است؛ *no* پیش از فعل می‌آید.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: رد کردن دوستانه
    gloss: Lo siento + no puedo + یک دلیل کوتاه، رد کردن را دوستانه می‌سازد.
    note: در گپ‌وگفت آوردن دلیل ضروری نیست، اما این نمونه را مفیدتر و مؤدبانه‌تر می‌سازد.
  es.a1.unit50.lesson03.teach.quedar:
    title: قرار گذاشتن
    gloss: قرار گذاشتن
    note: '*Quedar* یعنی قرار دیدار گذاشتن: *¿Quedamos el viernes?* بسیاری از مردم امریکای لاتین به‌جای آن *¿Nos vemos el viernes?* می‌گویند.'
    example_gloss: روز جمعه ساعت 2:30 همدیگر را ببینیم؟
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: جمعه ساعت دو و نیم
    gloss: جمعه ساعت 2:30 قرار بگذاریم؟
    note: این عبارت روز هفته *el viernes* را با *a las* و وقت یکجا می‌کند.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media یعنی نیم
    gloss: las dos y media = 2:30؛ a las dos y media وقت دیدار را می‌رساند.
    note: 'هسپانوی از ساعتی که گذشته می‌شمارد: *las dos y media* یعنی 2:30، و در اصل «دو و نیم» است.'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: تاریخ و وقت
    gloss: روز جمعه 17 اپریل ساعت 3:15
    note: 'در هسپانوی نام روزهای هفته و ماه‌ها با حرف کوچک نوشته می‌شود و در تاریخ *de* می‌آید: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: تأیید کردن وقت
    gloss: بلی، جمعه ساعت 2:30 خوب است.
    note: '*Me viene bien* («برایم مناسب است») تأیید می‌کند که وقت پیشنهادشده درست است.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: پیام، دعوت‌نامه، کافهٔ زبان
    gloss: پیام، دعوت‌نامه، کافهٔ زبان
    note: '*Un mensaje* یک پیام کوتاه نوشتاری یا دیجیتالی است، *una invitación* کسی را به یک کار دعوت می‌کند و *el café de idiomas* جای دیدار گروه است.'
    example_gloss:
    - از الینا یک پیام دارم.
    - این دعوت‌نامه به کافهٔ زبان است.
    - ما در کافهٔ زبان قهوه می‌نوشیم.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: دعوت‌نامهٔ الینا
    gloss: سلام ماتیو، دل داری روز شنبه 18 اپریل ساعت 2:30 در کافهٔ زبان قهوه بنوشیم؟ با سلام، الینا.
    note: 'چهار جزئیات را بخوانین: کار، تاریخ، وقت و جا.'
    glosses:
      Hola: سلام
      ganas: میل (tener ganas de = دل داشتن)
      sábado: شنبه
      abril: اپریل
      media: نیم (y media = و نیم)
      dos: دو
      café: قهوه
      tomar: نوشیدن / گرفتن
      idiomas: کافهٔ زبان
      saludo: با سلام
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: پیام پیشنهاد
    gloss: سلام ماتیو، جمعه ساعت دو و نیم قهوه بخوریم؟ با احترام، الینا.
    note: پیام شامل سلام، فعالیت، روز، وقت و خداحافظی است.
    glosses:
      Hola: سلام
      vamos: بنوشیم؟ / بخوریم؟
      viernes: جمعه
      media: و نیم
      dos: دو
      café: قهوه
      tomar: نوشیدن / خوردن
      saludo: با احترام
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: یک پیام تأیید
    gloss: سلام الینا، بلی، عالیه! جمعه ساعت دو و نیم برایم خوبه. تا جمعه! ماتیو.
    note: در جواب، هم فعالیت قبول شده و هم وقت تکرار شده تا تأیید شود.
    glosses:
      Hola: سلام
      bien: خوب / عالیه
      viernes: جمعه
      media: و نیم
      dos: دو
      viene: خوب / مناسب
      Hasta: تا / به امید دیدار
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: پیام چه چیزهایی دارد
    gloss: یک پیام کوتاه فعالیت، روز یا تاریخ و وقت را میگوید.
    note: سلام و خداحافظی خوب است، اما مهمترین چیزها فعالیت و وقتِ آن است.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: الینا قهوه پیشنهاد میکند
    gloss: 'الینا: جمعه قهوه بخوریم؟ ماتیو: بلی، عالیه! ساعت چند؟'
    note: ماتیو اول فعالیت را قبول میکند، بعد وقت را میپرسد.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: وقتِ اولِ الینا
    gloss: 'الینا: ساعت دو و نیم.'
    note: '*Las dos y media* یعنی دو و نیم، مثل درس وقت گفتن.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: ماتیو وقت دیگری پیشنهاد میکند
    gloss: 'ماتیو: معذرت می‌خواهم، ساعت دو و نیم نمی‌توانم. ساعت سه و ربع شده می‌تواند؟'
    note: '*¿Puede ser a ...?* راه کوتاهی برای پرسیدن است که آیا وقت دیگری مناسب است.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: آنها پلان نهایی را تأیید میکنند
    gloss: 'الینا: بلی، ساعت سه و ربع برایم خوبه. ماتیو: پلان خوبیه. پس جمعه ساعت سه و ربع همدیگر را میبینیم.'
    note: اینجا هم *quedamos* شکل *nosotros* است و حالا پلان را تأیید میکند.
