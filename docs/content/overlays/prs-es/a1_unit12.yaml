  description: بیان احساسات اساسی، ادامهٔ قصهٔ الینا و ماتیو در خود درس کارگاه ۲۲ جولای -- عصبانیت پیش از درس، یک حادثه در آشپزی، و سرفرازی وقتی غذا نجات مییابد.
