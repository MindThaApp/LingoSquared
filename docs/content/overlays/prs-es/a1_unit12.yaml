teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: عصبی
    gloss: عصبی
    note: '*Nervioso* (مذکر) / *nerviosa* (مؤنث) -- جوره صفت عادیِ -o/-a.'
    example_gloss:
    - ماتیو عصبی است.
    - الینا عصبی است.
  es.a1.unit12.lesson01.teach.contento:
    title: خوشحال
    gloss: خوشحال / راضی
    note: '*Contento/contenta* احساس خوشحالی یا رضایت را میرساند، نه ویژگی دایمی را.'
    example_gloss:
    - ماتیو خوشحال است.
    - الینا خوشحال است.
  es.a1.unit12.lesson01.teach.cansado:
    title: خسته
    gloss: خسته
    note: '*Cansado/cansada* از *cansar* (خسته کردن) میآید.'
    example_gloss:
    - بعد از کارگاه، خسته استم. (مذکر)
    - بعد از کارگاه، خسته استم. (مؤنث)
  es.a1.unit12.lesson01.teach.preocupado:
    title: پریشان
    gloss: پریشان
    note: '*Preocupado/preocupada* از *preocupar* (پریشان کردن) میآید.'
    example_gloss:
    - ماتیو پریشان است.
    - الینا پریشان است.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: سرفراز
    gloss: سرفراز
    note: '*Orgulloso/orgullosa* -- در *estoy orgulloso/a de...* (به ... افتخار میکنم) پیش از چیزی که به آن افتخار میکنی، *de* میآید.'
    example_gloss:
    - من به تو افتخار میکنم. (مذکر)
    - من به تو افتخار میکنم. (مؤنث)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: من عصبی استم (مذکر)
    gloss: من عصبی استم.
    note: '*Estoy* (استم، از *estar*) + شکل مذکر صفت.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: من عصبی استم (مؤنث)
    gloss: من عصبی استم.
    note: همین ساختار با شکل مؤنث صفت.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: من خوشحال استم (مذکر)
    gloss: من خوشحال استم.
    note: '*Estoy contento* -- همان الگوی *estar* + صفت.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar و ser برای احساسات
    gloss: چرا احساسات معمولاً با estar میآیند، نه ser.
    note: متن خود کارت را ببینین.
    target_text: '*Estar* + صفت حالت یا احساس موقتی را بیان میکند (estoy nervioso -- من حالا عصبی هستم)، برخلاف *ser* + صفت که برای ویژگی دایمی است. احساسات معمولاً با *estar* میآیند.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: پرسیدن از احساس کسی
    gloss: چطور احساس میکنی؟
    note: '*¿Cómo te sientes?* از *sentirse* (احساس کردن) کار میگیرد که فعل انعکاسی است و با *estar* + صفت فرق دارد.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: بیان احساس مخلوط
    gloss: کمی عصبی استم، اما خوشحال.
    note: '*Me siento* (احساس میکنم) + صفت، و *pero* (اما) دو احساس را در برابر هم میگذارد -- جواب طبیعی برای *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: یک چیز میسوزد
    gloss: یک چیز میسوزد!
    note: '*Se quema* شکل انعکاسی *quemar* (سوزاندن) است -- «خودش میسوزد»؛ راه طبیعی گفتن اینکه چیزی میسوزد بدون آنکه بگویی کی میسوزاند.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: من پریشان استم (مذکر)
    gloss: من پریشان استم.
    note: '*Preocupado* در الگوی *estoy* + صفت.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: غم نخور
    gloss: غم نخور.
    note: یادداشت دستوری بعدی را ببینین.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: پیشنهاد شروع دوباره
    gloss: ما میتوانیم دوباره شروع کنیم.
    note: '*Podemos* (میتوانیم) + مصدر؛ *de nuevo* (دوباره) عبارت رایج برای دوباره کردن کاری است.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: الگوی امر منفی در پشت «غم نخور».
    note: متن خود کارت را ببینین.
    target_text: '*No te preocupes* (غم نخور) امر منفیِ غیررسمی است که از *no* + ضمیر انعکاسی (*te*) + فعل ساخته میشود.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: نگاهی به درس
    gloss: پیش از درس، الینا و ماتیو کمی عصبی بودند. در وقت درس، چیزی سوخت و هر دو پریشان شدند. اما دوباره شروع کردند و در آخر کیک عالی شد. حالا هر دو بسیار سرفراز و خوشحال استند.
    note: '*Estaban* (بودند) احساس آنها را در آن وقت میرساند؛ *están* (استند) احساس آنها را در حال حاضر.'
    glosses:
      Antes: پیش از
      clase: درس
      estaban: بودند (از estar)
      poco: کمی
      nerviosos: عصبی
      Durante: در جریان
      algo: یک چیز
      quemó: سوخته
      dos: هر دو
      preocupados: نگران
      Pero: اما
      empezaron: شروع کردند
      nuevo: دوباره
      final: آخر
      pastel: کیک
      salió: درست شد
      perfecto: بی‌عیب
      Ahora: حالا
      están: استند
      orgullosos: سربلند
      contentos: خوشحال
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: مطابقت صفت‌ها در جمع
    gloss: چرا برای گروهی که مرد و زن هر دو در آن استند، صفت‌ها به شکل جمعِ مذکر می‌آیند.
    note: متن خود همین کارت را ببینین.
    target_text: وقتی الینا و ماتیو با هم توصیف میشوند، صفتها شکل جمع مذکر میگیرند (nerviosos، preocupados، orgullosos، contentos) -- قاعدهٔ عادی هسپانوی وقتی گروه دستکم یک عضو مذکر داشته باشد.
  es.a1.unit12.lesson06.teach.line01:
    title: از Mateo بپرس چه احساسی دارد
    gloss: Elena از Mateo می‌پرسد که قبل از صنف چه احساسی دارد.
    note: '*¿Cómo te sientes?* می‌پرسد که کسی چه احساسی دارد.'
  es.a1.unit12.lesson06.teach.line02:
    title: با یک احساس مخلوط جواب بده
    gloss: Mateo می‌گوید که کمی عصبی است، اما خوشحال.
    note: Mateo شکل‌های مذکر *nervioso* و *contento* را به کار می‌برد.
  es.a1.unit12.lesson06.teach.line03:
    title: به اتفاق بد واکنش نشان بده
    gloss: Elena موافقت می‌کند، بعد می‌بیند که یک چیز می‌سوزد.
    note: '*¡Ay, no!* (وای نه!) یک جملهٔ تعجبیِ عام برای ابراز خطر یا ترس است.'
  es.a1.unit12.lesson06.teach.line04:
    title: نگرانی را بیان کن
    gloss: Mateo می‌گوید نگران است و می‌پرسد چه کنند.
    note: '*¿Qué hacemos?* (چه کنیم؟) یک سوال عملی است.'
  es.a1.unit12.lesson06.teach.line05:
    title: دلداری بده و راه حل پیشنهاد کن
    gloss: Elena به او می‌گوید غم نخور — می‌توانند دوباره شروع کنند.
    note: '*no te preocupes* و *podemos empezar de nuevo* را باهم می‌آورد.'
  es.a1.unit12.lesson06.teach.line06:
    title: موافقت کن و دوباره امتحان کن
    gloss: Mateo موافقت می‌کند و پیشنهاد می‌کند دوباره امتحان کنند.
    note: '*Vamos a intentarlo otra vez* (بیایین دوباره امتحانش کنیم) ساختار *vamos a* + مصدر را از درس‌های قبلی تکرار می‌کند، این بار با ضمیر مفعولی *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: موفقیت را اعلام کن
    gloss: Elena اعلام می‌کند که حالا کیک بی‌عیب شده است.
    note: '*¡Mira!* (ببین!) یک کلمهٔ ندایی برای جلب توجه است؛ *el pastel* (کیک) غذایی است که ماجرا دور آن می‌چرخد.'
  es.a1.unit12.lesson06.teach.line08:
    title: جشن بگیر و افتخار را بیان کن
    gloss: Mateo خوشحالی می‌کند و می‌گوید به هر دوی شان افتخار می‌کند.
    note: '*¡Qué bien!* (چه خوب!) از الگوی تعجبی *¡Qué...!* کار می‌گیرد، مثل *¡Qué calor!*؛ *de nosotros* (از ما) جملهٔ *estoy orgulloso de ti* را برای یک گروه گسترش می‌دهد.'
  es.a1.unit12.lesson06.teach.line09:
    title: افتخار را شریک شو
    gloss: Elena موافقت می‌کند که او هم سربلند است — آن‌ها این کار را باهم کردند.
    note: '*Lo logramos juntos* (ما آن را باهم به دست آوردیم) یک جملهٔ طبیعی برای ختم گفتگو است و برای اولین بار از *lograr* (موفق شدن) کار می‌گیرد.'
