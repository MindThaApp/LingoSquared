teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: '*Sentirse* فعل انعکاسی است (*me siento*, *te sientes*)؛ *no me siento bien* راه عمومی و ملایم برای گفتن این است که چیزی درست نیست.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: مریض
    gloss: مریض
    note: 'یک صفت ساده که با *estar* (برای حالت‌ها) به کار می‌رود: *estoy enfermo*.'
    example_gloss: من مریض استم.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: مریض بودن
    gloss: من مریض استم.
    note: '*Enfermo* حالت عمومی‌تر و شدیدتری از *no me siento bien* را می‌رساند؛ با جنسیت گوینده تغییر می‌کند (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: سردرد
    gloss: سردرد
    note: 'در هسپانوی، *dolor de cabeza* با *tener* و بدون حرف تعریف می‌آید: *tengo dolor de cabeza*.'
    example_gloss: سردرد دارم.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: 'نشانه‌های مریضی با *tener* (داشتن) می‌آیند: *tengo dolor de cabeza*، درست مثل «سردرد دارم» در دری.'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: دل‌درد
    gloss: دل‌درد
    note: 'همان الگوی بدون حرف تعریف مثل *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: دل‌درد دارم.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: از همان الگوی *tener* مثل *dolor de cabeza* پیروی می‌کند.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: پرسیدن به شکل عمومی
    gloss: چی شده؟
    note: راه عمومی و همه‌منظوره برای پرسیدن اینکه آیا مشکلی هست.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: یک اصطلاح رایج
    gloss: چی شده؟
    note: '*¿Qué te pasa?* راه طبیعی پرسیدن اینکه چی شده است (تحت‌اللفظی «چی به تو می‌گذرد؟»)؛ آن را کلمه به کلمه ترجمه نکنین.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: گلودرد
    gloss: گلودرد
    note: 'همان الگوی *dolor de cabeza* و *dolor de estómago*: *dolor de garganta*.'
    example_gloss: گلودرد دارم.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *tener* مثل نشانه‌های دیگر پیروی می‌کند.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: خبر گرفتن از کسی
    gloss: حالت خوب است؟ نه، حالم خوب نیست.
    note: '*¿Estás bien?* سوال خیلی رایج و دوستانه برای خبر گرفتن است؛ با کسی که او را *usted* خطاب می‌کنین، می‌شود *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: تب
    gloss: تب
    note: 'بعد از *tener* بدون حرف تعریف می‌آید، مثل نشانه‌های دیگر: *tengo fiebre*.'
    example_gloss: تب دارم.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *tener* پیروی می‌کند.
  es.a1.unit46.lesson03.teach.resfriado:
    title: زکام بودن
    gloss: زکام بودن
    note: '*Resfriado* صفت است و با *estar* می‌آید؛ همچنین می‌توانین با اسم *resfriado* بگویین: *tengo un resfriado*.'
    example_gloss: من زکام استم.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: گفتن اینکه زکام استید
    gloss: من زکام استم.
    note: در هسپانوی می‌توان با صفت گفت *estoy resfriado*؛ صفت با جنسیت گوینده تغییر می‌کند (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: 'Estar یا tener: به نوع کلمه بستگی دارد'
    gloss: 'Enfermo و resfriado صفت استند و با estar می‌آیند: من مریض استم، من زکام استم. Fiebre و dolor de cabeza اسم استند و با tener می‌آیند: من تب دارم، من سردرد دارم.'
    note: 'انتخاب بین *estar* و *tener* به نوع کلمه بستگی دارد: صفت‌ها (*enfermo*, *resfriado*) با *estar* می‌آیند و اسم‌های نشانه‌های مریضی (*fiebre*, *dolor de cabeza*) با *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: دواخانه
    gloss: دواخانه
    note: 'یک اسم مؤنث: *la farmacia*.'
    example_gloss: من به دواخانه می‌روم.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: سلام‌واحوال‌پرسی دواخانه‌دار
    gloss: چطور کمک‌تان کنم؟
    note: '*¿En qué puedo ayudarle?* سوال رسمی و معمول خدمات است؛ در *ayudarle* ضمیر مفعولی رسمی *le* برای *usted* آمده است.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: خواستن چیزی برای یک نشانه مریضی
    gloss: برای سردرد چیزی دارید؟
    note: '*Algo para* + نشانه، راه طبیعی خواستن دوا است: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: یک قرص
    gloss: یک قرص
    note: 'یک اسم مؤنث: *la pastilla*؛ *una pastilla* یعنی یک قرص.'
    example_gloss: من یک قرص می‌خورم.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: دستور استفاده از دوا
    gloss: روزانه دو بار یک قرص بخور.
    note: '*Toma* فعل امر غیررسمی *tomar* (خوردن، گرفتن) است که برای دستورها به کار می‌رود.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: زبان رسمی در دواخانه
    gloss: در دواخانه شکل مؤدبانهٔ usted را به کار می‌بری.
    note: 'دواساز یک شخص بزرگ‌سال ناآشنا است که خدمت می‌کند، پس *usted* به کار می‌بری: *¿Tiene algo...?* نه *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: خواندن یک نصیحت دواخانه
    gloss: 'نصیحت: روزی دو بار یک قرص با آب بخور. خوب استراحت کن و آب زیاد بنوش. بعد از سه روز هم‌چنان احساس خوبی نداری؟ پس نزد دکتر برو.'
    note: به مقدار دوا، دو توصیهٔ دیگر غیر از دوا و وقت رفتن نزد دکتر توجه کن.
    glosses:
      Consejo: نصیحت
      toma: گرفتن
      veces: بار
      día: روز
      pastilla: قرص
      Descansa: استراحت کن
      bebe: بنوش
      sentirte: احساس کردن
      sigues: هنوز
      bien: خوب
      médico: دکتر
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena احوال می‌گیرد
    gloss: 'Elena: سلام Mateo، چطور استی؟ حالا بهتر شدی؟'
    note: '*Ya* (حالا، تا به حال) نشان می‌دهد که Elena می‌پرسد Mateo از آخرین صحبتشان بهتر شده یا نه؛ *te sientes* شکل غیررسمی *tú* فعل *sentirse* است.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo هنوز مریض است
    gloss: 'Mateo: هنوز خیلی خوب نیستم. هنوز سردرد دارم و خسته استم.'
    note: '*Sigo con* (هنوز دارم) نشان می‌دهد که سردرد خوب نشده؛ *cansado* (خسته) صفت تازه و مفید است که با جنسیت تغییر می‌کند (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena دربارهٔ دوا می‌پرسد
    gloss: 'Elena: یک قرص خوردی؟'
    note: '*Has tomado* ماضی نقلی است: *has* + اسم مفعول *tomado*، مثل *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo تأیید می‌کند
    gloss: 'Mateo: بلی، یک قرص خوردم. حالا استراحت می‌کنم.'
    note: '*Voy a descansar* (استراحت می‌کنم) از ساختار آیندهٔ نزدیک *ir a* + مصدر استفاده می‌کند.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena برایش آرزوی صحت می‌کند
    gloss: 'Elena: فکر خوب است. خوب استراحت کن. زود صحت‌یاب شوی!'
    note: '*¡Que te mejores!* عبارت ثابت و معمول برای آرزوی صحت‌یابی زود است؛ از وجه التزامی *mejores* استفاده می‌کند.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo خداحافظی می‌کند
    gloss: 'Mateo: تشکر، تا فردا!'
    note: '*Hasta mañana* از الگوی *hasta* + زمان در خداحافظی‌ها پیروی می‌کند، مثل *hasta luego*.'
