course:
  title: هسپانوی A1
  description: گفتن و پرسیدن وقت ساعت، بخش‌های روز و تعیین وقت برای دیدار، در ادامه‌ی داستان کارگاه آشپزی الینا و ماتیو از درس‌های ۰۱ تا ۰۴. نکته‌های ویژه به تفاوت es/son در مفرد و جمع بودن ساعت و کلمه‌های کسری cuarto/media/menos توجه می‌کنند.
