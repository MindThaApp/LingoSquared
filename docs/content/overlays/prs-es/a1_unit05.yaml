teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: پرسیدن وقت
    gloss: ساعت چند است؟
    note: '*Qué hora* (چه ساعت) وقت ساعت را می‌پرسد و با *qué fecha* (کدام تاریخ تقویم) فرق دارد.'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: ساعت یک است
    gloss: ساعت یک است.
    note: در یادداشت دستوری بعدی ببینین که چرا فقط برای ساعت یک *es* (نه *son*) به کار می‌رود.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es در برابر son برای گفتن وقت
    gloss: چرا ساعت یک با همه‌ی ساعت‌های دیگر فرق دارد.
    note: '*Es la una* مفرد است، اما *son las dos, son las tres...* جمع است.'
    target_text: برای ساعت یک فعل مفرد *es* به کار می‌رود (Es la una)، اما برای همه‌ی ساعت‌های دیگر فعل جمع *son* (Son las dos, Son las tres...)، چون *la una* مفرد است («ساعت یک») ولی *las dos*، *las tres* و غیره جمع اند.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: ساعت دو، چهار، پنج، هفت
    gloss: ساعت دو است، ساعت چهار است، ساعت پنج است، ساعت هفت است.
    note: '*Son las...* (جمع) برای همهٔ ساعت‌ها به‌جز ساعت یک استفاده می‌شود، مطابق یادداشت دستوری قبلی.'
    example_gloss:
    - ساعت دو است.
    - ساعت چهار است.
    - ساعت پنج است.
    - ساعت هفت است.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: ساعت و ربع
    gloss: ساعت چهار و ربع است.
    note: '*Y cuarto* (و ربع) پانزده دقیقه به ساعت گفته‌شده اضافه می‌کند.'
  es.a1.unit05.lesson02.teach.y_media:
    title: ساعت و نیم
    gloss: ساعت هفت و نیم است.
    note: '*Y media* (و نیم) سی دقیقه به ساعت گفته‌شده اضافه می‌کند.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: ربع کم
    gloss: ربع کم پنج است (چهار و چهل‌وپنج).
    note: در یادداشت دستوری بعدی ببینین که *menos* چطور دقیقه‌ها را تا ساعت بعدی به عقب می‌شمارد.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (کم تا ساعت)
    gloss: اسپانوی دقیقه‌های پیش از ساعت بعدی را این‌طور می‌شمارد.
    note: '*Las cinco menos cuarto* = ربع کم پنج (4:45).'
    target_text: '*Menos* (کم) تا ساعت بعدی به‌طرف عقب می‌شمارد: *las cinco menos cuarto* یعنی ۴:۴۵ و به این شکل خوانده می‌شود: «ربع کم پنج».'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: صبح، بعد از ظهر، شب
    gloss: صبح، بعد از ظهر، شب
    note: '*De la mañana/tarde/noche* مشخص می‌کند که ساعت صبح است یا بعد از ظهر و شب؛ در دری هم بعد از ساعت می‌گوییم «صبح» یا «شب».'
    example_gloss:
    - ساعت هشت صبح است.
    - کارگاه ساعت چهار بعد از ظهر شروع می‌شود.
    - ساعت ده شب است.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: کارگاه ساعت چهار شروع می‌شود
    gloss: کارگاه ساعت چهار بعد از ظهر شروع می‌شود.
    note: '*Empieza* (شروع می‌شود) شکل سوم شخص فعل *empezar* است، فعلی که در این بخش تازه است.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: پرسیدن وقت شروع چیزی
    gloss: کارگاه چه وقت شروع می‌شود؟
    note: '*A qué hora* (چه وقت) راه معمول پرسیدن زمان یک رویداد مشخص است و با *qué hora es* (ساعت چند است؟) که وقت حالا را می‌پرسد فرق دارد.'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: پرسیدن وقت دیدار
    gloss: چه وقت همدیگر را ببینیم؟
    note: '*Nos vemos* (همدیگر را می‌بینیم) ساختاری از نوع بازتابی است که برای قرار گذاشتن با کسی به کار می‌رود.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: پیشنهاد وقت دیدار
    gloss: ساعت سه و نیم همدیگر را ببینیم؟
    note: '*Y media* و *nos vemos* را باهم می‌آورد تا یک وقت مشخص پیشنهاد شود.'
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: پیش از کارگاه
    gloss: آن پیش از کارگاه است.
    note: '*Antes de* (پیش از) ضد *después* (بعد از) است.'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: موافقم / باشد
    gloss: موافقم / باشد
    note: '*De acuerdo* راه طبیعی و کوتاه برای تأیید یک قرار است و در کار با *Muy bien* شباهت دارد.'
    example_gloss: باشد، ساعت سه و نیم همدیگر را می‌بینیم.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: خواندن برنامهٔ روز
    gloss: کارگاه ساعت چهار بعد از ظهر شروع می‌شود. پیش از آن، الینا و ماتیو ساعت سه و نیم همدیگر را می‌بینند. کارگاه ساعت شش تمام می‌شود. روز بعد، ساعت یک برای خوردن ناهار همدیگر را می‌بینند.
    note: 'برنامهٔ کوتاه یک روز: دیدار، کارگاه و ناهار روز بعد.'
    glosses:
      taller: کارگاه
      empieza: شروع می‌شود (از empezar)
      cuatro: چهار
      tarde: بعد از ظهر
      Antes: پیش از
      ven: همدیگر را می‌بینند (از verse)
      tres: سه
      media: نیم
      termina: تمام می‌شود (از terminar)
      seis: شش
      día: روز
      siguiente: بعدی
      almorzar: ناهار خوردن
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: روز بعد
    gloss: روز بعد / روز دیگر
    note: '*Al día siguiente* (روز بعد) راه معمول برای انتقال قصه به روزی دیگر است و با *la próxima clase* (درس بعدی، یک رویداد مشخص نه یک روز تقویمی) فرق دارد.'
  es.a1.unit05.lesson06.teach.line01:
    title: پرسیدن دربارهٔ غذا بعد از کارگاه
    gloss: ماتیو می‌گوید کارگاه ساعت شش تمام می‌شود و می‌پرسد که الینا بعدش گرسنه است یا نه.
    note: '*Tienes hambre* (گرسنه استی؟) یک تعبیر تازه است؛ لفظ به لفظ «گرسنگی داری» و همان ساختار «داشتن» مثل *tener ... años* و *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: موافقت و پیشنهاد روز بعد
    gloss: الینا می‌گوید بلی، کمی، و پیشنهاد می‌کند که فردا غذا بخورند.
    note: '*¿Comemos mañana?* به‌جای بعد از کارگاه، فردا را پیشنهاد می‌کند و زمینه را برای گفتگوی بعدی دربارهٔ یک وقت مشخص آماده می‌سازد.'
  es.a1.unit05.lesson06.teach.line03:
    title: موافقت و پرسیدن وقت
    gloss: ماتیو می‌گوید فکر خوب است و می‌پرسد ساعت چند.
    note: '*Buena idea* (فکر خوب) راه طبیعی و کوتاه برای موافقت با یک پیشنهاد است.'
  es.a1.unit05.lesson06.teach.line04:
    title: پیشنهاد ساعت یک
    gloss: الینا پیشنهاد می‌کند که ساعت یک همدیگر را ببینند.
    note: '*A la una* (ساعت یک) مثل *Es la una* شکل مفرد *la una* را به کار می‌برد.'
  es.a1.unit05.lesson06.teach.line05:
    title: تأیید و ذکر یک رستورانت
    gloss: ماتیو تأیید می‌کند که ساعت یک خوب است و از یک رستورانت نزدیک یاد می‌کند.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (نزدیک)، مثل *cerca de tus padres*، این‌جا برای یک جا به کار رفته است.'
  es.a1.unit05.lesson06.teach.line06:
    title: پایان گرم گفتگو
    gloss: الینا با خوشحالی جواب می‌دهد و می‌گوید تا فردا.
    note: '*¡Genial!* (عالی!) گفتگو را با شور و شوق به پایان می‌رساند و در کار با *¡Qué bien!* شباهت دارد.'
