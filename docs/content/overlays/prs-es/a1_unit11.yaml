teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: پیراهن
    gloss: پیراهن
    note: '*Camisa* مؤنث است.'
    example_gloss: این پیراهن به من خوش می‌آید.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: پتلون
    gloss: پتلون
    note: '*Pantalón* در هسپانوی از نظر دستور مفرد است، هرچند در دری «پتلون» را گاهی برای دو پاچه به شکل جمع هم تصور می‌کنند.'
    example_gloss: پتلون بیست قیمت دارد.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: جاکت
    gloss: جاکت
    note: '*Chaqueta* مؤنث است.'
    example_gloss: برای زمستان یک جاکت ضرور دارم.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: بوت‌ها
    gloss: بوت‌ها
    note: '*Zapatos* جمع است، مثل «بوت‌ها» در دری.'
    example_gloss: این بوت‌ها راحت استند.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: پیش‌بند
    gloss: پیش‌بند
    note: '*Delantal* مذکر است — همان چیزی که النا و ماتیو برای کارگاه ضرور دارند.'
    example_gloss: ما برای کارگاه یک پیش‌بند ضرور داریم.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: پرسیدن سایز
    gloss: چه سایز می‌پوشید؟
    note: '*¿Qué talla usas?* راه عادی پرسیدن سایز لباس کسی است.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: گفتن سایز خود
    gloss: من سایز متوسط می‌پوشم.
    note: '*Uso* (من می‌پوشم) + *la talla* (سایز) + خود کلمهٔ سایز.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: گفتن اینکه خوب می‌آید
    gloss: به من خوب می‌آید.
    note: '*Me queda bien* از *quedar* (اندازه آمدن) ساخته شده — یادداشت دستوری بعدی را ببینین.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: گفتن اینکه بد می‌آید
    gloss: به من بد می‌آید.
    note: مخالف *me queda bien*، با تعویض *bien* به *mal*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: quedar چطور اندازه و جور آمدن را می‌رساند، نه کیفیت عمومی را.
    note: متن خود کارت را ببینین.
    target_text: '*Me queda bien* (به من خوب می‌آید) از *quedar* (اندازه آمدن، بر تن نشستن) ساخته شده که غیر از *ser* و *estar* است؛ لفظاً «بر من خوب می‌ماند». *Bien* و *mal* این‌جا اندازه و جور آمدن را می‌رسانند، نه کیفیت جنس را.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: پرسیدن قیمت پیش‌بند
    gloss: این پیش‌بند چند قیمت دارد؟
    note: الگوی *¿Cuánto cuesta?* است و جنس مشخص با *este* (این) گفته می‌شود.
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: گفتن قیمت
    gloss: دوازده قیمت دارد.
    note: '*Cuesta* + عدد قیمت را می‌گوید.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este و esta
    gloss: اشارهٔ نزدیک چطور با جنس اسم مطابقت می‌کند.
    note: متن خود کارت را ببینین.
    target_text: '*Este* (این، مذکر) با *el delantal* می‌آید؛ *esta* (این، مؤنث) با *esta camisa* می‌آید — اشارهٔ نزدیک مطابق جنس اسم تغییر می‌کند، مثل هر صفت دیگر.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: گفتن اینکه این یکی را دوست دارید
    gloss: این یکی به من خوش می‌آید.
    note: '*Este* در اینجا به تنهایی منحیث ضمیر («این یکی») می‌آید و به همان چیزی اشاره می‌کند که همین حالا ذکر شد.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: بگویین که آن را می‌خرید
    gloss: می‌خواهم آن را بخرم.
    note: '*Voy a* + مصدر ساختار آینده نزدیک است؛ در *comprarlo* ضمیر مفعولی *lo* (آن) به مصدر *comprar* وصل می‌شود.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: بگویین که دوتا می‌خرید
    gloss: ما دوتا می‌خریم.
    note: '*Compramos* (می‌خریم) شکل *nosotros* است و وقتی به کار می‌رود که الینا و ماتیو با هم تصمیم می‌گیرند.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: خواندن لیست قیمت‌ها
    gloss: 'در این دوکان، پیراهن پانزده، پتلون بیست، جاکت سی و بوت‌ها بیست و پنج تمام می‌شوند. پیش‌بند ارزان‌ترین است: فقط دوازده تمام می‌شود.'
    note: 'لیست قیمت یک دوکان: *cuesta* (تمام می‌شود) برای یک چیز و *cuestan* (تمام می‌شوند) برای چیزهای جمع مثل *los zapatos*.'
    glosses:
      tienda: دوکان
      camisa: پیراهن
      cuesta: تمام می‌شود (از costar)
      quince: پانزده
      pantalón: پتلون
      veinte: بیست
      chaqueta: جاکت
      treinta: سی
      zapatos: بوت‌ها
      cuestan: تمام می‌شوند (از costar)
      veinticinco: بیست و پنج
      delantal: پیش‌بند
      barato: ارزان
      solo: فقط
      doce: دوازده
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (ارزان‌ترین)
    gloss: چگونگی ساخته شدن صفت عالی با el/la + más + صفت.
    note: به متن خود کارت نگاه کنید.
    target_text: '*El más barato* (ارزان‌ترین) صفت برترین است — *el/la* + *más* + صفت، و با *de/en* گروه مقایسه گفته می‌شود. در این بخش الگوی کامل مقایسه آموزش داده نمی‌شود، فقط همین عبارت رایج خریداری.'
  es.a1.unit11.lesson06.teach.line01:
    title: بیان نیاز
    gloss: الینا می‌گوید که برای کارگاه پیش‌بند ضرورت دارند.
    note: '*Delantales* جمع *el delantal* است.'
  es.a1.unit11.lesson06.teach.line02:
    title: موافقت و پیشنهاد یک دوکان
    gloss: ماتیو موافقت می‌کند و پیشنهاد می‌کند که به آن دوکان بروند.
    note: '*Tienes razón* یعنی «حق با تو است»؛ *esa tienda* یعنی «آن دوکان».'
  es.a1.unit11.lesson06.teach.line03:
    title: سلام دوکاندار
    gloss: دوکاندار سلام می‌دهد و پیشنهاد کمک می‌کند.
    note: '*¿Los ayudo?* (کمک‌تان کنم؟) احوالپرسی معمول دوکاندار است که هر دو نفر، الینا و ماتیو، را با هم مخاطب قرار می‌دهد.'
  es.a1.unit11.lesson06.teach.line04:
    title: بیان آنچه می‌جویند
    gloss: الینا می‌گوید بلی، پیش‌بند می‌جویند.
    note: '*Buscamos* (می‌جوییم) شکل *nosotros* فعل *buscar* است.'
  es.a1.unit11.lesson06.teach.line05:
    title: دوکاندار نمونه‌ها را نشان می‌دهد و اندازه می‌پرسد
    gloss: دوکاندار چند پیش‌بند نشان می‌دهد و اندازه‌شان را می‌پرسد.
    note: '*¿Qué talla usan?* شکل جمع *usan* (شما همه می‌پوشید) را دارد و هر دو نفر را مخاطب قرار می‌دهد، برخلاف *usas* که مفرد است.'
  es.a1.unit11.lesson06.teach.line06:
    title: بیان یک اندازه
    gloss: ماتیو می‌گوید اندازه‌اش متوسط است.
    note: '*Uso la talla mediana* جواب *¿Qué talla usan?* برای خودش است.'
  es.a1.unit11.lesson06.teach.line06b:
    title: الینا موافقت می‌کند
    gloss: الینا می‌گوید اندازه او هم همان است.
    note: '*Yo también* یعنی «من هم».'
  es.a1.unit11.lesson06.teach.line07:
    title: پرسیدن قیمت
    gloss: ماتیو می‌پرسد که پیش‌بند چند تمام می‌شود.
    note: '*Este* (این) به پیش‌بندی که پیش روی او است اشاره می‌کند.'
  es.a1.unit11.lesson06.teach.line07b:
    title: گفتن قیمت
    gloss: دوکاندار می‌گوید دوازده تمام می‌شود.
    note: '*Cuesta* + عدد قیمت را می‌رساند.'
  es.a1.unit11.lesson06.teach.line08:
    title: تأیید اندازه و تصمیم به خرید
    gloss: الینا می‌گوید برایش اندازه است، خوشش می‌آید و آن را می‌خرد.
    note: ترکیب *me queda bien*، *me gusta este* و *voy a comprarlo* به ترتیب.
  es.a1.unit11.lesson06.teach.line09:
    title: موافقت و خرید دوتا
    gloss: ماتیو می‌گوید برای او هم اندازه است و دوتا می‌خرند.
    note: '*A mí también* (من هم، با تأکید) الگوی موافقت با *también* را با یک ضمیر تأکیدی تکرار می‌کند؛ *compramos dos* صحنه را به پایان می‌رساند.'
