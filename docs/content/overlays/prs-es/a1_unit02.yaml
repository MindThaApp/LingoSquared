teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: صفر
    gloss: صفر
    note: '*Cero* هم به عنوان خود عدد و هم به عنوان رقم هنگام خواندن شمارهٔ چند رقمی استفاده می‌شود.'
  es.a1.unit02.lesson01.teach.uno:
    title: یک
    gloss: یک
    note: '*Uno* پیش از اسم مذکر مفرد به *un* کوتاه می‌شود (*un huevo*، یک تخم) و پیش از اسم مؤنث *una* می‌شود (*una taza*، یک پیاله). تنها، مثلاً هنگام شمردن، *uno* می‌ماند.'
  es.a1.unit02.lesson01.teach.dos:
    title: دو
    gloss: دو
    note: '*Dos* با جنسیت اسم تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.tres:
    title: سه
    gloss: سه
    note: '*Tres* مثل *dos* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: چهار
    gloss: چهار
    note: '*Cuatro* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.cinco:
    title: پنج
    gloss: پنج
    note: '*Cinco* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.seis:
    title: شش
    gloss: شش
    note: '*Seis* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.siete:
    title: هفت
    gloss: هفت
    note: '*Siete* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.ocho:
    title: هشت
    gloss: هشت
    note: '*Ocho* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.nueve:
    title: نه
    gloss: نه
    note: '*Nueve* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.diez:
    title: ده
    gloss: ده
    note: '*Diez* تغییر نمی‌کند.'
  es.a1.unit02.lesson02.teach.once:
    title: یازده
    gloss: یازده
    note: '*Once* تا *quince* (۱۱ تا ۱۵) هر کدام یک کلمهٔ جدا اند که باید یکجا یاد بگیرین؛ از شانزده تا نزده اعداد از *diez* ساخته می‌شوند (*dieciséis*، *diecisiete*...).'
  es.a1.unit02.lesson02.teach.doce:
    title: دوازده
    gloss: دوازده
    note: '*Doce* یک کلمهٔ واحد است؛ به *dos* شباهت دارد، اما شکل املایی جداگانه دارد.'
  es.a1.unit02.lesson02.teach.trece:
    title: سیزده
    gloss: سیزده
    note: '*Trece* یک کلمهٔ واحد است؛ به *tres* شباهت دارد، اما شکل املایی جداگانه دارد.'
  es.a1.unit02.lesson02.teach.catorce:
    title: چهارده
    gloss: چهارده
    note: '*Catorce* یک کلمهٔ واحد است؛ به *cuatro* شباهت دارد، اما شکل املایی جداگانه دارد.'
  es.a1.unit02.lesson02.teach.quince:
    title: پانزده
    gloss: پانزده
    note: '*Quince* آخرین عدد از اعداد یکجاشدهٔ نوع نوجوان است؛ از شانزده به بعد الگو تغییر می‌کند.'
  es.a1.unit02.lesson02.teach.veinte:
    title: بیست
    gloss: بیست
    note: '*Veinte* کلمهٔ جداگانه است. از *veintiuno* (۲۱) تا بیست و نه، دهگان و یکان در یک کلمه یکجا نوشته می‌شوند؛ این الگو در درس سوم با *veintiocho* دوباره می‌آید.'
  es.a1.unit02.lesson02.teach.treinta:
    title: سی
    gloss: سی
    note: از سی به بعد، دهگان و یکان با *y* (و) به شکل سه کلمهٔ جدا وصل می‌شوند، نه مثل بیست ها که یکجا می‌شوند.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: سی و چهار
    gloss: سی و چهار
    note: '*Treinta y cuatro* به شکل سه کلمهٔ جدا نوشته می‌شود: دهگان، *y* و یکان.'
  es.a1.unit02.lesson02.teach.cien:
    title: صد
    gloss: صد
    note: '*Cien* برای عدد دقیقاً صد به تنهایی استفاده می‌شود؛ وقتی عدد بعد از آن ادامه پیدا کند *ciento* می‌آید (*ciento uno*، ۱۰۱)، که این واحد هنوز یاد نمی‌دهد.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: پرسیدن سن به شکل غیررسمی
    gloss: عمرت چند سال است؟
    note: هسپانوی در اصل می‌پرسد «چند سال داری؟» و از *tener* (داشتن) استفاده می‌کند، نه از *ser* یا *estar*. در دری هم سن را با «داشتن» یا «بودن» می‌گویند، اما در هسپانوی همیشه tener به کار می‌رود.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: گفتن سن خود
    gloss: بیست و هشت ساله استم.
    note: '*Tengo* شکل «من» فعل *tener* است. جواب کامل معمولاً *años* (سال) دارد؛ وقتی موضوع سن از قبل معلوم باشد می‌شود آن را نگفت، مثل *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: پرسیدن سن به شکل رسمی
    gloss: عمر تان چند سال است؟
    note: '*Tiene* شکل *usted* فعل *tener* است و با حالت رسمی که در واحد اول آمد جور است.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: گفتن سن مرکب
    gloss: من سی و یک ساله استم.
    note: در اینجا *Treinta y uno* با *uno* (نه *un*) می‌آید، چون در این جواب بعد از آن مستقیماً اسمی نمی‌آید.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: پرسیدن سن از طرف مقابل
    gloss: و تو، چند ساله استی؟
    note: گفتن *Tienes* بدون تکرار *años* وقتی موضوع از قبل معلوم باشد، کوتاه‌گویی طبیعی و رایج است.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: پرسیدن نمبر تیلفون
    gloss: نمبر تیلفونت چند است؟
    note: وقتی از کسی می‌خواهیم یک چیز مشخص مثل نمبر تیلفون را از میان چند امکان بگوید، *cuál* (نه *qué*) انتخاب طبیعی است.
  es.a1.unit02.lesson04.teach.numero_elena:
    title: نمبری که رقم به رقم خوانده می‌شود
    gloss: شش، یک، پنج، صفر، دو، نه، هفت، سه
    note: نمبر تیلفون را می‌شود رقم به رقم خواند، مثل اینجا. در هسپانوی بسیاری‌ها رقم‌ها را دوتا دوتا هم گروه می‌کنند؛ پس به هر دو شیوه گوش بتین.
  es.a1.unit02.lesson04.teach.es_el:
    title: شروع گفتن نمبر
    gloss: آن ... است
    note: '*El* (حرف تعریف مذکر) استفاده می‌شود، چون *número* اسم مذکر است.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: خواستن تکرار
    gloss: لطفاً تکرار کرده می‌توانی؟
    note: '*Puedes* شکل ضمیر *tú* فعل *poder* (توانستن) است؛ وقتی نمبری تیز گفته شود و نفهمیده باشی، به کار می‌آید.'
  es.a1.unit02.lesson04.teach.claro:
    title: قبول کردن فوری
    gloss: البته؛ حتماً
    note: '*Claro* راه رایج و دوستانهٔ پذیرفتن یک درخواست است.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: گفتن مقدار مورد ضرورت
    gloss: من سه دانه تخم ضرورت دارم.
    note: '*Necesito* شکل «من» فعل *necesitar* (ضرورت داشتن) است. *Huevos* (تخم‌ها) بعد از هر عدد بزرگ‌تر از یک جمع می‌ماند.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: پرسیدن تعداد مورد ضرورت
    gloss: چند دانه تخم ضرورت داری؟
    note: '*Cuántos* از نظر جنس و شمار با اسمی که دربارهٔ آن می‌پرسد مطابقت می‌کند؛ *huevos* مذکر جمع است، پس *cuántos* (نه *cuántas*) استفاده می‌شود.'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: گفتن مقدار پیمانه‌شده
    gloss: دو پیالهٔ آرد
    note: '*De* واحد پیمانه (*tazas*، پیاله) را به چیزی که پیمانه می‌شود (*harina*، آرد) وصل می‌کند، مثل اضافت در دری.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: گفتن مقدار نیم
    gloss: نیم پیاله بوره
    note: '*Media* با اسم مؤنث *taza* مطابقت دارد؛ شکل مذکر *medio* با اسم‌های مذکر می‌آید.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: گفتن آنچه در دست داری
    gloss: من چهار دانه تخم بالای میز دارم.
    note: '*Tengo* (دارم) آنچه را که موجود است می‌گوید، و با *necesito* (ضرورت دارم) که کمبود را می‌گوید فرق دارد.'
  es.a1.unit02.lesson06.teach.line01:
    title: پرسیدن تعداد تخم
    gloss: الینا از ماتیو می‌پرسد که برای طرز تهیه چند دانه تخم ضرورت دارد.
    note: لحن *tú* درس اول بین این دو همسال ادامه می‌یابد.
  es.a1.unit02.lesson06.teach.line02:
    title: گفتن مواد
    gloss: ماتیو می‌گوید سه دانه تخم و دو پیاله آرد ضرورت دارد.
    note: '*Necesito* چیزی را می‌گوید که هنوز برای طرز تهیه ضرور است.'
  es.a1.unit02.lesson06.teach.line03:
    title: پیشنهاد آنچه در دست است
    gloss: الینا می‌گوید چهار دانه تخم بالای میز دارد و می‌پرسد که بوره هم ضرورت دارد یا نه.
    note: '*Tengo* چیزی را می‌گوید که الینا از قبل دارد، جدا از آنچه ماتیو گفت ضرورت دارد.'
  es.a1.unit02.lesson06.teach.line04:
    title: تأیید مقدار کم
    gloss: ماتیو می‌گوید بلی، یک کم؛ تقریباً نیم پیاله.
    note: '*Como* در اینجا یعنی «تقریباً» یا «حدود»، نه معنای رایج‌تر آن یعنی «مثل» یا «به‌عنوان».'
  es.a1.unit02.lesson06.teach.line05:
    title: پرسیدن نمبر تیلفون
    gloss: الینا می‌گوید عالی، بعد نمبر تیلفون ماتیو را می‌پرسد تا دربارهٔ صنف بعدی برایش پیام بنویسد.
    note: '*Así te escribo* («تا برایت بنویسم») دلیل پرسیدن را می‌گوید؛ عادت طبیعی گفتگو پیش از خواستن معلومات تماس.'
  es.a1.unit02.lesson06.teach.line06:
    title: گفتن نمبر تیلفون
    gloss: ماتیو نمبرش را رقم به رقم می‌خواند.
    note: '*Es el* نمبر را معرفی می‌کند و با اسم مذکر *número* مطابقت دارد.'
  es.a1.unit02.lesson06.teach.line07:
    title: تشکر و پرسیدن سن
    gloss: 'الینا از او تشکر می‌کند، بعد یک سوال دیگر می‌پرسد: چند ساله است.'
    note: '*Una pregunta más* («یک سوال دیگر») تغییر طبیعی موضوع را در همان گفتگو نشان می‌دهد.'
  es.a1.unit02.lesson06.teach.line08:
    title: گفتن سن او
    gloss: ماتیو می‌گوید بیست و هشت ساله است و همین سوال را از الینا می‌پرسد.
    note: '*Tengo veintiocho años* شکل یکجای بیست‌ها را دارد، مطابق الگوی خود درس.'
  es.a1.unit02.lesson06.teach.line09:
    title: گفتن سن او
    gloss: الینا می‌گوید سی و یک ساله است.
    note: '*Tengo treinta y uno* در اینجا *años* را نمی‌آورد، چون موضوع (سن) از متن معلوم است؛ کوتاه‌گویی طبیعی که با الگوی پرسیدن دوباره بدون تکرار *años* مطابقت دارد.'
