course:
  title: هسپانوی A1
  description: اعداد ۰ تا ۱۰۰، سن، شمارهٔ تلیفون و مقدار مواد غذا؛ ادامهٔ ماجرای النا و ماتیو در کارگاه آشپزی واحد اول. توضیح ویژه روی بیان سن با tener و مطابقت جنسیت در عبارت های مقدار تمرکز دارد.
