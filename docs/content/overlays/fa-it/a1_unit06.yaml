teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: مادر، پدر
    note: 'در فارسی اسم‌ها حرف تعریف مذکر و مؤنث ندارند، ولی در ایتالیایی اسم‌ها با حرف تعریف می‌آیند: *la* برای مؤنث و *il* برای مذکر.'
    example_gloss:
    - این پدر من است.
    - این مادر من است.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: برادر، خواهر
    note: '*fratello* مذکر است (*il*) و *sorella* مؤنث است (*la*).'
    example_gloss:
    - من یک برادر و یک خواهر دارم.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: این پدر من است. این مادر من است.
    note: '*Questo/Questa* (این) با جنسیت کسی که به او اشاره می‌کنید هماهنگ می‌شود: *questo* برای مرد و *questa* برای زن. در فارسی برای هر دو فقط «این» می‌گوییم.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: پدربزرگ، مادربزرگ
    note: همان الگوی حرف تعریف مذکر و مؤنث *padre/madre*.
    example_gloss:
    - پدربزرگ من در رم زندگی می‌کند.
    - مادربزرگ من خیلی خوب آشپزی می‌کند.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: برادر یا خواهر دارید؟
    note: '*Hai* (داری) + واژهٔ خانوادگی + *o* (یا) روش معمول پرسیدن دربارهٔ خواهر و برادر است.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: من یک برادر و یک خواهر دارم.
    note: '*Ho* (دارم) برای جواب دادن به کار می‌رود، همراه با *un* (یک، مذکر) و *una* (یک، مؤنث).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: شوهر، زن (همسر)
    note: یک جفت مذکر و مؤنث دیگر، با همان الگوی حرف تعریف.
    example_gloss:
    - سم زن دارد.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: بچه دارید؟
    note: '*figli* (بچه‌ها) جمعی است که برای پرسش کلی به کار می‌رود، بدون توجه به تعداد یا جنسیت بچه‌ها.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: بله، دو بچه دارم. یک پسر و یک دختر.
    note: '*maschio* (پسر) و *femmina* (دختر) بعد از گفتن تعداد کل، جنسیت بچه‌ها را مشخص می‌کنند.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: پسر، دختر
    note: شکل مفرد *figli* با همان الگوی معمول حرف تعریف مذکر و مؤنث.
    example_gloss:
    - النا یک پسر و یک دختر دارد.
