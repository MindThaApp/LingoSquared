teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Alto* برای آدم قدبلند و *basso* برای آدم کوتاه‌قد است. صفت‌ها در ایتالیایی با شخص مطابقت می‌کنند: *alto/alta*، *basso/bassa*. در فارسی چنین تغییری نداریم.'
    example_gloss:
    - کیارا قدبلند است.
    - لوکا کوتاه‌قد است.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Anziano* (سالخورده) و *giovane* (جوان) یک تصور کلی می‌دهند، نه تعداد دقیق سال‌ها. *Giovane* به -e ختم می‌شود، پس برای مرد و زن یکسان است.'
    example_gloss:
    - پدربزرگ مسنه.
    - مارکو جوان است.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'سن: avere anni یا anziano'
    gloss: 'برای سن دقیق در ایتالیایی از avere + anni استفاده می‌شود: Quanti anni hai؟ برای تصور کلی از یک صفت استفاده می‌شود: Il nonno è anziano.'
    note: 'در فارسی می‌گوییم «سی سالم است»، اما در ایتالیایی می‌گویند «سی سال دارم» (*ho trent''anni*). این به فارسی نزدیک‌تر از آن است که فکر می‌کنید: فعل «داشتن» به کار می‌رود. صفت *anziano* برای این است که کسی چقدر پیر به نظر می‌رسد.'
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: کیارا قدبلند است و لوکا کوتاه‌قد
    gloss: کیارا قدبلند است و لوکا کوتاه‌قد.
    note: 'دو صفت که با *e* (و) به هم وصل شده‌اند. هر کدام با شخص خودش مطابقت می‌کند: *alta* (مؤنث) و *basso* (مذکر).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: مو
    gloss: مو
    note: '*I capelli* در ایتالیایی جمع است: ایتالیایی‌ها مو را «تارها» می‌گویند، برخلاف فارسی که «مو» را مفرد به کار می‌بریم. شکل مفرد *il capello* یعنی یک تار مو.'
    example_gloss: مارکو موهای کوتاه و مشکی دارد.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'سه رنگ مو به صورت جمع مذکر، مطابق با *capelli*: ‏*biondi*، *castani*، *grigi*. *Neri* (مشکی) هم برای مو به کار می‌رود.'
    example_gloss:
    - جولیا موهای بور دارد.
    - لوکا موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lunghi* (بلند) و *corti* (کوتاه) مثل *capelli* جمع هستند. واژهٔ *alto* (قدبلند) فقط برای آدم‌ها به کار می‌رود، نه برای مو.'
    example_gloss:
    - کیارا موهای بلند دارد.
    - لوکا موهای کوتاه دارد.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli جمع است
    gloss: 'Capelli جمع است، پس صفت هم جمع می‌شود: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'صفت بعد از اسم می‌آید و از نظر جنس و شمار با آن مطابقت می‌کند: *capelli lunghi* (جمع مذکر)، *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: مو و چشم با avere می‌آیند
    gloss: 'برای توصیف یک نفر در ایتالیایی با مو و چشم از فعل avere استفاده می‌شود: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'در ایتالیایی حرف تعریف هم لازم است، برخلاف فارسی که می‌گوییم «موهای بور دارد»: *i capelli*، *gli occhi*. می‌توانید *è bionda* هم بگویید، اما الگوی اصلی این درس *avere* است.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: مارکو موهای کوتاه و مشکی دارد
    gloss: مارکو موهای کوتاه و مشکی دارد.
    note: '*Neri* (مشکی) جمع مذکر است و با *capelli* مطابقت دارد.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: جولیا موهای بلند و بور دارد
    gloss: جولیا موهای بلند و بور دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Occhio* (چشم) مذکر است؛ جمعش *occhi* است و چون با مصوت شروع می‌شود، *gli* می‌گیرد.'
    example_gloss: مارکو چشم‌های قهوه‌ای دارد.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: 'رنگ چشم‌ها: *azzurri* (آبی)، *marroni* (قهوه‌ای)، *verdi* (سبز). این شکل‌های جمع برای هر دو جنس به کار می‌روند.'
    example_gloss:
    - جولیا چشم‌های آبی دارد.
    - لوکا چشم‌های قهوه‌ای دارد.
    - کیارا چشم‌های سبز دارد.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: رنگ‌ها در جمع مطابقت می‌کنند
    gloss: 'رنگ چشم‌ها برای مطابقت با occhi جمع می‌شوند: occhi azzurri, marroni, verdi.'
    note: 'صفت‌هایی که در مفرد به -e ختم می‌شوند (*verde*، *marrone*) در جمع به -i ختم می‌شوند: *verdi*، *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: جولیا چه شکلی است؟
    gloss: جولیا چه شکلی است؟
    note: '*Com''è?* سؤال اصلی برای ظاهر است. *Com''è* همان *come è* است که با آپوستروف، e حذف شده است.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: جولیا موهای بلند و بور و چشم‌های آبی دارد
    gloss: جولیا موهای بلند و بور و چشم‌های آبی دارد.
    note: 'یک پاسخ نمونه: *avere* + مو + *e* + چشم در یک جمله.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: جولیا نینا را معرفی می‌کند
    gloss: 'جولیا: یک دختر تازه به کافهٔ زبان می‌آید. اسمش نینا است.'
    note: '*Viene* (می‌آید) برای معرفی کسی تازه است. *Si chiama* یعنی «اسمش ... است»؛ تحت‌اللفظی «خودش را ... صدا می‌زند».'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: مارکو می‌پرسد او چه شکلی است
    gloss: 'مارکو: باشه! چه شکلی است؟'
    note: 'همان سؤال دوباره، بدون اسم: فاعل از روی موقعیت معلوم است.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: جولیا قد و موی نینا را توصیف می‌کند
    gloss: 'جولیا: کوتاه‌قد است و موهای کوتاه و بور دارد.'
    note: '*È bassa* (کوتاه‌قد است) شکل مؤنث *bassa* را دارد؛ توصیف مو بعدش با *ha* می‌آید.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: مارکو دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'مارکو: چشم‌هایش چطور؟'
    note: در *E gli occhi?* فعل نیامده است. در ایتالیایی، مثل فارسی، اغلب چیزهایی را که از موقعیت معلوم است حذف می‌کنند.
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: جولیا چشم‌های نینا را توصیف می‌کند
    gloss: 'جولیا: چشم‌های سبز دارد.'
    note: '*Ha gli occhi verdi*: ضمیر فاعلی لازم نیست، چون پایانِ فعل نشان می‌دهد که منظور «او» است.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: مارکو او را خواهد شناخت
    gloss: 'مارکو: مرسی! پس می‌شناسمش.'
    note: '*La riconosco* (می‌شناسمش): ضمیر مفعولی *la* قبل از فعل می‌آید.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: مقایسهٔ لوکا و کیارا
    gloss: لوکا و کیارا برادر و خواهرند، اما خیلی با هم فرق دارند. لوکا کوتاه‌قد است و موهای کوتاه و قهوه‌ای و چشم‌های قهوه‌ای دارد. کیارا از لوکا قدبلندتر است و موهای بلند و قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      fratello: برادر
      sorella: خواهر
      sembrano: به نظر می‌رسند
      diversi: متفاوت
      basso: کوتاه‌قد
      corti: کوتاه‌قد
      castani: قهوه‌ای
      capelli: مو
      marroni: قهوه‌ای
      occhi: چشم‌ها
      alta: قدبلند (più alta = قدبلندتر)
      lunghi: بلند
      verdi: سبز
      come: چطور (Tu come sei? = تو چه شکلی هستی؟)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'مقایسه: più ... di'
    gloss: 'در ایتالیایی مقایسه با più + صفت + di انجام می‌شود: Chiara è più alta di Luca.'
    note: '*più* را قبل از صفت و *di* را قبل از کسی که با او مقایسه می‌کنید بگذارید. صفت جنس خودش را حفظ می‌کند: *più alta*، *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: موهای کیارا از لوکا بلندتر است
    gloss: موهای کیارا از موهای لوکا بلندتر است.
    note: '*I capelli più lunghi di Luca*: صفت جمع می‌ماند تا با *capelli* مطابقت داشته باشد.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: '*Ho i capelli corti e castani*: برای توصیف ظاهر خودتان از فعل *avere* استفاده می‌کنید.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: مارکو نینا را پیدا می‌کند
    gloss: 'مارکو: ببین، اون نینا نیست؟ موهای کوتاه و بور و چشم‌های سبز داره.'
    note: '*Guarda* (ببین) امر برای *tu* است. *Quella* یعنی «آن یکی» برای یک زن یا دختر.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: جولیا تأیید می‌کند
    gloss: 'جولیا: آره، نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: نینا به مارکو سلام می‌کند
    gloss: 'نینا: سلام، شما مارکو هستی؟'
    note: '*Sei Marco?* سؤال غیررسمی است: *sei* صورت *tu* از فعل *essere* است، برای همین به *tu* نیازی نیست.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: مارکو جواب سلام نینا را می‌دهد
    gloss: 'مارکو: آره! از آشنایی باهات خوشحالم، نینا.'
    note: '*Piacere di conoscerti* عبارتی است برای وقتی که برای اولین بار با کسی آشنا می‌شوید؛ *-ti* یعنی «تو را».'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: 'پایان گفت‌وگو: مارکو نینا را از روی توصیف قبلی جولیا شناخت.'
