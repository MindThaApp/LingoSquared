course:
  title: ایتالیایی در فارسی A1
  description: 'ایتالیایی مقدماتی برای توصیف ظاهر ساده‌ٔ آدم‌ها: تصور کلی از قد و سن، رنگ مو و چشم، سؤال اصلی Com''è? و مقایسهٔ ظاهر دو نفر.'
