    title: piove, c'è il sole
    gloss: باران می‌آید، هوا آفتابی است
    note: '*Piove* یک جملهٔ کامل یک‌کلمه‌ای دربارهٔ هوا است؛ *c''è il sole* در اصل یعنی «آفتاب هست».'
    example_gloss:
