teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایجِ سرگرمی در مصدر: *leggere* (کتاب خواندن)، *fare sport* (ورزش کردن) و *cucinare* (آشپزی کردن). مصدرهای ایتالیایی به -are، -ere یا -ire ختم می‌شن.'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Il tempo libero* اسم مذکره، برای همین *il* می‌گیره. این عبارت کلیدی برای حرف زدن درباره‌ی سرگرمی‌هاست.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Leggo* صیغه‌ی *io* از *leggere* (خواندن) است. ایتالیایی هم مثل فارسی معمولاً ضمیر فاعلی رو حذف می‌کنه: بگو *Leggo*، نه *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگه: *ascoltare musica* (موسیقی گوش دادن)، *disegnare* (نقاشی کشیدن) و *giocare ai videogiochi* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: '*Ascoltare* مفعولش رو مستقیم می‌گیره: *ascolto musica*، بدون هیچ حرف اضافه‌ای مثل «به» وسطش.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Con gli amici* یعنی با دوستان. *Gli* حرف تعریف جمع برای اسم مذکری است که با مصوت شروع می‌شه.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید تکرار. *Mai* (هرگز) قبل از فعل *non* می‌خواد: *non gioco mai*.'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Ogni* (هر) هیچ‌وقت تغییر نمی‌کنه: *ogni settimana*، *ogni fine settimana*. کارت بعدی رو ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai با non می‌آد؛ ogni تغییر نمی‌کنه
    gloss: 'با mai فعل non هم می‌گیره: Non gioco mai. Ogni برای همه‌ی اسم‌ها یکسان می‌مونه: ogni settimana، ogni fine settimana.'
    note: 'در فارسی هم می‌گیم «هیچ‌وقت بازی نمی‌کنم» و فعل منفیه؛ ایتالیایی هم همین‌طور می‌گه *non gioco mai* (تحت‌اللفظی: «بازی نمی‌کنم هرگز»). بعد از *ogni* همیشه اسم مفرد می‌آد.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: جولیا از سرگرمی‌ها حرف می‌زنه
    gloss: 'جولیا: ما اغلب با هم پیاده‌روی می‌کنیم. ولی تو توی اوقات فراغتت دیگه چی کار می‌کنی، مارکو؟'
    note: '*Passeggiamo* صیغه‌ی *noi* (ما) از *passeggiare* است. *Spesso* بعد از فعل می‌آد.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: سرگرمی‌های مارکو
    gloss: 'مارکو: من با کمال میل آشپزی می‌کنم، توی خونه هم. و اغلب ورزش می‌کنم.'
    note: '*Anche a casa* (توی خونه هم) نشون می‌ده مارکو برای تفریح آشپزی می‌کنه، نه فقط سر کار. *A casa* یعنی توی خونه، بدون حرف تعریف.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: جولیا تعجب می‌کنه
    gloss: 'جولیا: توی خونه هم آشپزی می‌کنی؟ تو که تمام روز سر کار آشپزی می‌کنی!'
    note: '*Già* (قبلاً، از همین حالا) و *tutto il giorno* (تمام روز) نشون می‌دن مارکو سر کار هم کلی آشپزی می‌کنه.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: مارکو توضیح می‌ده
    gloss: 'مارکو: آره، ولی آشپزی بهم آرامش می‌ده. تو چی، چی دوست داری انجام بدی؟'
    note: '*Cucinare mi rilassa* تحت‌اللفظی یعنی «آشپزی من رو آروم می‌کنه»: فعالیت فاعله و *mi* (من) مفعوله.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: سرگرمی‌های جولیا
    gloss: 'جولیا: من با کمال میل کتاب می‌خونم و اغلب موسیقی گوش می‌دم.'
    note: 'دو سرگرمی که با *e* (و) به هم وصل شدن. هر دو فعل در صیغه‌ی *io* می‌مونن: *leggo* و *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: مارکو درباره‌ی بازی می‌پرسه
    gloss: 'مارکو: تو بازی ویدیویی هم می‌کنی؟'
    note: 'سؤال بله/خیر ترتیب جمله‌ی خبری رو نگه می‌داره و فقط آهنگ صدا بالا می‌ره: *Giochi anche ai videogiochi?* *Anche* یعنی هم.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: جولیا جواب می‌ده
    gloss: 'جولیا: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Non ... mai* (هرگز) و *a volte* (گاهی) توی یک جواب کنار هم اومدن. *Ma* یعنی ولی.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و مارکو اغلب با هم پیاده‌روی می‌کنیم. ولی سرگرمی‌های دیگه‌ای هم داریم. مارکو با کمال میل آشپزی می‌کنه، توی خونه هم، و اغلب ورزش می‌کنه. من با کمال میل کتاب می‌خونم و اغلب موسیقی گوش می‌دم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو توی اوقات فراغتت چی کار کردن رو دوست داری؟
    note: پیام جولیا چیزهایی رو که قبلاً گفته شده خلاصه می‌کنه و با پرسش اصلی این درس، یعنی پرسیدن از خواننده، تموم می‌شه.
    glosses:
      passeggiamo: پیاده‌روی می‌کنیم
      spesso: اغلب
      insieme: با هم
      altri: دیگر
      cucina: آشپزی می‌کند
      volentieri: با کمال میل
      casa: خانه (a casa = در خانه)
      sport: ورزش (fa sport = ورزش می‌کند)
      leggo: بخوانم
      ascolto: گوش می‌دهم
      musica: موسیقی
      disegno: نقاشی می‌کشم
      volte: بار (a volte = گاهی)
      videogiochi: بازی‌های ویدیویی
      mai: هرگز
      libero: آزاد
      tempo: وقت
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: مارکو درباره‌ی آخر هفته می‌پرسه
    gloss: 'مارکو: این آخر هفته چی کار می‌کنی؟'
    note: '*Questo fine settimana* (این آخر هفته) مذکره، برای همین *questo* می‌گیره. *Fai* صیغه‌ی *tu* از *fare* (انجام دادن) است.'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: جولیا مردده
    gloss: 'جولیا: هنوز نمی‌دونم. کتاب خوندن رو دوست دارم، ولی می‌خوام برم بیرون هم.'
    note: '*Non lo so ancora* (هنوز نمی‌دونم): *lo* به چیزی اشاره می‌کنه که نمی‌دونی و قبل از فعل می‌آد. *Uscire* یعنی بیرون رفتن.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: مارکو یه برنامه پیشنهاد می‌ده
    gloss: 'مارکو: با هم قدم بزنیم؟ بعدش من برامون آشپزی می‌کنم.'
    note: '*Poi* (بعد، سپس) برنامه‌ها رو پشت سر هم مرتب می‌کنه. *Cucino io* (با *io* بعد از فعل) روی «من آشپزی می‌کنم» تأکید می‌کنه.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: جولیا موافقت می‌کنه
    gloss: 'جولیا: فکر خوبیه! هم پیاده‌روی رو دوست دارم هم آشپزی رو.'
    note: '*Sia ... sia ...* یعنی هم ... هم ...: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: مارکو قرار رو قطعی می‌کنه
    gloss: 'مارکو: عالی. پس شنبه می‌بینمت!'
    note: '*Ci vediamo sabato* (شنبه می‌بینیمت): وقتی منظور شنبه‌ی آینده است، قبل از اسم روز حرف تعریف نمی‌آد.'
