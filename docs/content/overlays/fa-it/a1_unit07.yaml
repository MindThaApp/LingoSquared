    - لطفاً یک کروسان می‌خواستم.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: ساندویچ، آب
    note: '*panino* مذکر است (*il*)؛ *acqua* مؤنث است ولی قبل از مصوت *l''* می‌گیرد.'
    example_gloss:
    - لطفاً یک ساندویچ می‌خواستم.
    - لطفاً یک آب می‌خواستم.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: چه میل دارید؟
    note: سؤال رسمی با *Lei* که باریستا از مشتری می‌پرسد.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: لطفاً یک قهوه و یک کروسان می‌خواستم.
    note: '*Vorrei* («می‌خواستم») راه مؤدبانهٔ سفارش دادن است و با *e* («و») مورد دوم را اضافه می‌کنید.'
