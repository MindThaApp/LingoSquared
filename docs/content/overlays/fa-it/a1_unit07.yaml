teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: قهوه، کروسان
    note: 'هر دو اسم مذکرند (*il*): *caffè* همان اسپرسوی همیشگی ایتالیایی است و *cornetto* شیرینی معمول صبحانه.'
    example_gloss:
