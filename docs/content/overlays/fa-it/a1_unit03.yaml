teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: صفر، یک، دو، سه، چهار، پنج
    note: شش عدد اول؛ پایه‌های قیمت، سن و شمارهٔ تلفن در این درس.
    example_gloss:
    - من دو برادر دارم.
    - ساعت پنج است.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: شش، هفت، هشت، نه، ده
    note: عددهای شش تا ده که محدودهٔ ۰ تا ۱۰ را کامل می‌کنند.
    example_gloss:
    - من روزی هشت ساعت کار می‌کنم.
    - مغازه ساعت ده باز می‌شود.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: چند سالته؟
    note: تحت‌اللفظی یعنی «چند سال داری»؛ ایتالیایی برای پرسیدن سن از فعل *avere* (داشتن) استفاده می‌کند، شبیه فارسی که می‌گوید «چند سال داری».
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: سی سالمه.
    note: عبارتی ثابت برای گفتن سن با فعل *avere* (سی سال دارم)؛ عدد «سی» اینجا به‌عنوان عدد شمارشی آموزش داده نمی‌شود. محدودهٔ اعداد این درس ۰ تا ۱۰ است و فقط ۳۰ و ۵۰ در همین عبارت ثابت و در قیمت‌ها دیده می‌شوند.
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: یک قهوه چند می‌شه؟
    note: '*Quanto costa* روش معمول پرسیدن قیمت یک کالاست.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: یک یورو، دو یورو
    note: '*euro* در ایتالیایی در جمع تغییر نمی‌کند؛ هم در *un euro* و هم در *due euro* همان *euro* به کار می‌رود.'
    example_gloss:
    - یک یورو می‌شود.
    - می‌شود دو یورو و پنجاه سنت.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: و یک کرواسان؟
    note: یک سؤال کوتاه برای پرسیدن قیمت کالای دوم، یعنی *cornetto* (کرواسان ایتالیایی صبحانه).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: می‌شود دو یورو و پنجاه سنت.
    note: '*e cinquanta* سنت‌ها را اضافه می‌کند؛ تحت‌اللفظی یعنی «و پنجاه» و برای هر قیمتی که پنجاه سنت دارد به همین شکل به کار می‌رود.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: چند تا می‌خواهید؟
    note: روش رسمی که باریستا یا فروشنده می‌پرسد از آن کالا چند تا می‌خواهید؛ *ne* جای کالایی را می‌گیرد که قبلاً گفته شده.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: سه تا می‌خواستم، ممنون.
    note: '*Ne vorrei* + یک عدد روش مؤدبانهٔ درخواست تعداد است و باز هم *ne* به کالای گفته‌شده برمی‌گردد.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: شماره تلفنت چنده؟
    note: روش دوستانه (غیررسمی) پرسیدن شمارهٔ تلفن کسی، با *tuo* (مال تو، غیررسمی).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: فردا بهت زنگ می‌زنم!
    note: روشی صمیمی برای تمام کردن گفتگو بعد از گرفتن شمارهٔ کسی.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: شمارهٔ من
    note: شمارهٔ تلفن در ایتالیایی معمولاً رقم به رقم خوانده می‌شود، با همان اعدادی که در درس اول یاد گرفتید.
    example_gloss: شمارهٔ من صفر، سه، چهار، دو، یک است.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: شمارهٔ من صفر، سه، چهار، دو، یک است.
    note: سم شمارهٔ تلفنش را رقم به رقم می‌گوید؛ روش معمول خواندن شمارهٔ تلفن در ایتالیایی.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: عالیه، ممنون!
    note: روشی کوتاه و شاد برای تمام کردن گفتگو بعد از گرفتن اطلاعاتی که لازم داشتید.
