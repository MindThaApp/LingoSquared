    example_gloss:
    - امروز پنجم ژانویه است.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: امروز پنجم ژانویه است.
    note: 'در ایتالیایی تاریخ با *il* + عدد روز + نام ماه ساخته می‌شود. برخلاف فارسی که عدد ترتیبی می‌گوید («پنجم»)، اینجا عدد ساده می‌آید: *cinque*. تنها استثنا روز اول ماه است که عدد ترتیبی *primo* را می‌گیرد (*il primo gennaio*).'
