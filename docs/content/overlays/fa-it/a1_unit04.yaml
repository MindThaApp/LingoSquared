  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: امروز چندم است؟
    note: وقتی تاریخ تقویم را می‌پرسید، نه روز هفته را، به‌جای *che giorno* از *che data* (چه تاریخی) استفاده می‌شود.
