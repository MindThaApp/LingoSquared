  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: کی به رم می‌رسی؟
    note: '*Quando* (کی) + *arrivi* (می‌رسی، خودمانی) دربارهٔ رسیدنی در آینده می‌پرسد.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: پنجشنبه بعدازظهر می‌رسم.
    note: '*Arrivo* (می‌رسم) + روز + بخشی از روز، یک پاسخ کامل دربارهٔ زمان رسیدن است.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: امروز، فردا، پس‌فردا
    note: '*Dopodomani* یک کلمه برای «پس‌فردا» است؛ در اصل *dopo* (بعد از) + *domani* (فردا).'
    example_gloss:
