  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: چه کسی چطور می‌رود؟
    gloss: Giulia هر روز برای رفتن سر کار با قطار سفر می‌کند. Marco معمولاً با دوچرخه می‌رود، ولی وقتی باران می‌آید با قطار هم می‌رود. Luca ترجیح می‌دهد با ماشین برود. Chiara نزدیک محل کارش زندگی می‌کند و پیاده سر کار می‌رود. شما چطور سر کار می‌روید؟
    note: 'این متن چهار شیوهٔ رفت‌وآمد و یک شرط (*quando piove*، یعنی وقتی باران می‌آید) را کنار هم می‌گذارد. *Andare* (رفتن) بی‌قاعده است: *vado*، *va*.'
    glosses:
      viaggia: سفر می‌کند
      ogni: هر
      giorno: روز
      treno: قطار
      lavoro: کار کردن
      bicicletta: دوچرخه (in bicicletta = با دوچرخه)
      solito: معمول (di solito = معمولاً)
      piove: باران می‌آید
      prende: سوار می‌شود
      andare: رفتن (andare in macchina = با ماشین رفتن)
      preferisce: ترجیح می‌دهد
      macchina: ماشین
      abita: زندگی می‌کند
      vicino: نزدیک
      piedi: پاها (a piedi = پیاده)
      vai: تو می‌روی
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara نزدیک زندگی می‌کند و پیاده سر کار می‌رود
