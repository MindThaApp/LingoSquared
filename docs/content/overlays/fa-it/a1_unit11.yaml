teaching:
  it.a1.unit11.lesson01.teach.faccio_colazione:
    title: faccio colazione, vado al lavoro
    gloss: صبحانه می‌خورم، سر کار می‌روم
    note: '*faccio colazione* (صبحانه می‌خورم) و *vado al lavoro* (سر کار می‌روم) دو فعل رایج برای کارهای روزمره‌اند.'
    example_gloss:
    - ساعت هفت صبحانه می‌خورم.
  it.a1.unit11.lesson01.teach.torno_a_casa_vado_a_letto:
    title: torno a casa, vado a letto
    gloss: به خانه برمی‌گردم، به رختخواب می‌روم
    note: '*torno a casa* (به خانه برمی‌گردم) و *vado a letto* (به رختخواب می‌روم) پایان روز را توصیف می‌کنند.'
    example_gloss:
    - عصرها به خانه برمی‌گردم.
  it.a1.unit11.lesson01.teach.a_che_ora_fai_colazione:
    title: A che ora fai colazione di solito?
    gloss: معمولاً ساعت چند صبحانه می‌خوری؟
    note: '*A che ora* (ساعت چند) همراه با *di solito* (معمولاً) دربارهٔ برنامهٔ همیشگی روزانه می‌پرسد.'
  it.a1.unit11.lesson01.teach.faccio_colazione_alle_sette:
    title: Faccio colazione alle sette e poi vado al lavoro.
    gloss: ساعت هفت صبحانه می‌خورم و بعد سر کار می‌روم.
    note: '*alle sette* (ساعت هفت) برای گفتن ساعت از *alle* + عدد ساعت استفاده می‌کند.'
  it.a1.unit11.lesson02.teach.a_che_ora_torni_a_casa:
    title: A che ora torni a casa la sera?
    gloss: عصرها ساعت چند به خانه برمی‌گردی؟
    note: '*torni* صرف *tu* از فعل *tornare* (برگشتن) است و دربارهٔ برنامهٔ عصر پرسیده شده.'
  it.a1.unit11.lesson02.teach.torno_alle_sei_e_trenta:
    title: Torno a casa alle sei e trenta, di solito.
    gloss: معمولاً ساعت شش و نیم به خانه برمی‌گردم.
    note: در *alle sei e trenta* (ساعت شش و نیم) دقیقه‌ها با *e* بعد از ساعت می‌آیند.
  it.a1.unit11.lesson02.teach.vado_a_letto_presto:
    title: Vado a letto presto.
    gloss: زود به رختخواب می‌روم.
    note: '*presto* (زود) فعل *vado a letto* (به رختخواب می‌روم) را توصیف می‌کند.'
    example_gloss:
    - شب‌ها زود به رختخواب می‌روم.
  it.a1.unit11.lesson03.teach.anche_io:
    title: Anch'io faccio colazione alle sette.
    gloss: من هم ساعت هفت صبحانه می‌خورم.
    note: '*Anch''io* (من هم) حرفی را که کس دیگری همین الان زده تأیید می‌کند.'
  it.a1.unit11.lesson03.teach.e_tu:
    title: E tu, a che ora fai colazione?
    gloss: تو چی، ساعت چند صبحانه می‌خوری؟
    note: '*E tu* (تو چی؟) سؤال را به طرف مقابل برمی‌گرداند.'
    example_gloss:
    - تو چی، ساعت چند به خانه برمی‌گردی؟
