teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Animale* واژه‌ی کلی است؛ *animale domestico* یعنی حیوان خانگی (تحت‌اللفظی: حیوان اهلی).'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم هست.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: سگ و گربه
    gloss: سگ / گربه
    example_gloss:
    - جولیا یک سگ دارد.
    - لوکا یک گربه دارد.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدربزرگ یک ماهی دارد.
    - Nina یک پرنده دارد.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی داری؟
    note: '*Hai ...?* صورت *tu* از فعل *avere* است. فقط لحن صدا جمله‌ی خبری را به سؤال تبدیل می‌کند.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'برای گفتن اینکه چیزی ندارید، *non* را قبل از فعل بگذارید: *non ho*. به نکته‌ی دستوری نگاه کنید.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: non قبل از فعل
    gloss: 'برای گفتن اینکه چیزی ندارید، non را قبل از فعل بگذارید: Non ho tempo, Non ho animali domestici.'
    note: 'بعد از *non ho* معمولاً اسم بدون حرف تعریف می‌آید: *non ho tempo*، *non ho animali*. در فارسی هم در این حالت معمولاً نشانه‌ی خاصی نمی‌آید: «وقت ندارم»، «حیوان ندارم».'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: بردنِ حیوان به پیاده‌روی
    gloss: حیوان را به پیاده‌روی بردن
    note: '*Portare a spasso* عبارتی ثابت برای بردن حیوان به پیاده‌روی است. ضمیر قبل از فعل می‌آید: *lo porto a spasso*.'
    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: ضمیر قبل از فعل می‌آید
    gloss: 'ضمیر lo جای «سگ» را می‌گیرد و قبل از فعل می‌آید: lo porto a spasso, gli do da mangiare.'
    note: 'در فارسی ضمیر مفعولی به آخر فعل می‌چسبد («می‌برمش»)، اما در ایتالیایی *lo* و *gli* جدا و قبل از فعل می‌آیند: *lo porto*، *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به گربه غذا می‌دهم.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: لوکا با گربه‌اش بازی می‌کند.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: من هر روز سگ را به پیاده‌روی می‌برم
    gloss: من هر روز سگ را به پیاده‌روی می‌برم.
    note: '*Ogni giorno* (هر روز) آخر جمله می‌آید، مثل *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: من هر روز به گربه غذا می‌دهم
    gloss: من هر روز به گربه غذا می‌دهم.
    note: '*Dare da mangiare* (غذا دادن) تحت‌اللفظی یعنی «دادن برای خوردن». *Do* صورت *io* از فعل *dare* است.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'جمع: il cane -> i cani'
    gloss: 'در جمع، مصوت آخر و حرف تعریف عوض می‌شود: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: الگوی منظم جمع در ایتالیایی که اینجا برای اولین بار با اسم حیوانات به عنوان مثال معرفی می‌شود.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: سگ‌ها و گربه‌ها
    gloss: سگ‌ها / گربه‌ها
    example_gloss:
    - مارکو سگ‌ها را دوست دارد.
    - کیارا گربه‌ها را دوست دارد.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - پدربزرگ پرنده‌ها را خیلی دوست دارد.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: من حیوان‌ها را خیلی دوست دارم
    gloss: من حیوان‌ها را خیلی دوست دارم.
    note: '*Amare* (دوست داشتن) مفعولش را مستقیم می‌گیرد: *amo gli animali*. اسم جمع حرف تعریف جمع *gli* لازم دارد.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: کیارا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد
    gloss: کیارا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد.
    note: تضادی را نشان می‌دهد که متن خواندنی‌ی این درس بر پایه‌ی آن ساخته شده است.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: مارکو درباره‌ی حیوان خانگی می‌پرسد
    gloss: 'مارکو: جولیا، تو حیوان خانگی داری؟'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: جولیا یک سگ دارد
    gloss: 'جولیا: آره، یه سگ دارم.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: مارکو می‌پرسد شکلش چطور است
    gloss: 'مارکو: چه شکلیه؟'
    note: '*Com''è?* برای حیوانات هم کاربرد دارد. در جواب از *è* یا *ha* استفاده می‌شود: *è piccolo*، *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: جولیا سگش را توصیف می‌کند
    gloss: 'جولیا: موهاش قهوه‌ایه و کوچیکه.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: حیوانات مذکر یا مؤنث‌اند
    gloss: 'حیوان مثل آدم مذکر یا مؤنث است: il cane می‌شود lui و la gatta می‌شود lei.'
    note: 'در ایتالیایی ضمیری مثل «آن» برای اشیا و حیوانات نیست: هر اسم یا مذکر است یا مؤنث. پس سگ *lui* و گربه‌ی ماده *lei* است و ضمیرها هم از آن پیروی می‌کنند (*lo*، *la*). در فارسی ضمیر جنسیت ندارد.'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: مارکو درباره‌ی پیاده‌روی می‌پرسد
    gloss: 'مارکو: هر روز می‌بریش پیاده‌روی؟'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: جولیا برنامه‌ی روزانه‌اش را توضیح می‌دهد
    gloss: 'جولیا: آره، هر روز می‌برمش پیاده‌روی و بهش غذا می‌دم.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: مارکو، کیارا و لوکا درباره‌ی حیوانات
    gloss: 'مارکو و کیارا هر دو حیوانات را دوست دارند، اما هیچ‌کدام حیوان خانگی ندارند. مارکو سگ‌ها را دوست دارد و کیارا گربه‌ها را. اما لوکا حیوان خانگی دارد: یک گربه. او زیاد با گربه‌اش بازی می‌کند و هر روز به او غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      amano: خیلی دوست دارد
      entrambi: هر دو
      animali: حیوان‌ها
      due: دو (nessuno dei due = هیچ‌کدام از آن دو)
      domestico: اهلی (animale domestico = حیوان خانگی)
      cani: سگ‌ها
      gatti: گربه‌ها
      gatto: گربه
      gioca: بازی می‌کند
      dà: می‌دهد
      ogni: هر
      mangiare: خوردن (dare da mangiare = غذا دادن)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: لوکا زیاد با گربه‌اش بازی می‌کند
    gloss: لوکا زیاد با گربه‌اش بازی می‌کند.
    note: '*Spesso* (اغلب) بعد از فعل می‌آید: *gioca spesso*. *Giocare con* یعنی بازی کردن با.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: جولیا از نینا می‌پرسد
    gloss: 'جولیا: نینا، تو هم حیوان خانگی داری؟'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina یک پرنده به اسم Pico دارد
    gloss: 'Nina: آره، یه پرنده دارم. اسمش Pico‌ـه.'
    note: '*Si chiama Pico* یعنی اسمش پیکو است، تحت‌اللفظی: «خودش را پیکو صدا می‌زند».'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: واکنش مارکو
    gloss: 'مارکو: چه جالب! هر روز باهاش چه کار می‌کنی؟'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina هر روز غذا می‌دهد
    gloss: 'Nina: هر روز بهش غذا می‌دم.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: مارکو هم پرنده‌ها را دوست دارد
    gloss: 'مارکو: من هم پرنده‌ها را دوست دارم.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: جولیا گفت‌وگو را تمام می‌کند
    gloss: 'جولیا: چه خوب که هر سه‌تامون حیوانات را دوست داریم!'
    note: جمله‌ای پایانی که اطلاعات مربوط به حیوانات هر سه شخصیت را کنار هم جمع می‌کند.
