teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: ترجیح دادن، ترجیح می‌دم
    note: '*preferire* («ترجیح دادن») فعلی با پایان -ire است که در بیشتر شکل‌های زمان حال -isc- می‌گیرد؛ *preferisco* یعنی «ترجیح می‌دم».'
    example_gloss:
    - چای رو به قهوه ترجیح می‌دم.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: قهوه رو ترجیح می‌دی یا چای؟
    note: '*Preferisci* («ترجیح می‌دی») همراه با *o* («یا») برای انتخاب بین دو چیز به کار می‌رود.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: قهوه رو ترجیح می‌دم.
    note: '*Preferisco* («ترجیح می‌دم») همراه با *il caffè* («قهوه») برای گفتن ترجیح خودتان است.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: کروسان رو خیلی دوست دارم.
    note: '*Mi piace* («برام دلپذیره» / «دوست دارم») همراه با *molto* («خیلی») علاقهٔ زیاد را نشان می‌دهد.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: صبح‌ها چای دوست ندارم.
    note: '*Non mi piace* («دوست ندارم») ساختار دوست داشتن را منفی می‌کند؛ *la mattina* یعنی «صبح‌ها».'
    example_gloss:
    - شب‌ها قهوه دوست ندارم.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: شما چطور؟
    note: '*E a te?* («تو چی؟») برای پرسیدن ترجیح یا نظر طرف مقابل است.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: منم قهوه رو ترجیح می‌دم!
    note: '*Anch''io* («منم») برای موافقت با جمله‌ای است که با *preferisco* گفته شده. (برای موافقت با جملهٔ *mi piace* در ایتالیایی می‌گویند *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: من نه، چای رو ترجیح می‌دم.
    note: '*A me no* («من نه») برای مخالفت با جملهٔ *mi piace* است (مثل ساختار دوست داشتن، *a me* دارد) و بعدش ترجیح خودتان را می‌گویید. برای مخالفت با جملهٔ *preferisco* در ایتالیایی می‌گویند *Io no*.'
    example_gloss:
    - من نه، قهوه رو ترجیح می‌دم.
