  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: اگر امشب نشد، فردا برویم.
    note: '*Se* (اگر) یک برنامه‌ی جایگزین را معرفی می‌کند، برای وقتی که برنامه‌ی اول نشود.'
