    title: Sì, domani va bene.
    gloss: بله، فردا خوب است.
    note: '*va bene* (خوب است / می‌شود) تأیید می‌کند که روز جایگزین قابل قبول است.'
    example_gloss:
    - بله، فردا برای من خیلی خوب است.
