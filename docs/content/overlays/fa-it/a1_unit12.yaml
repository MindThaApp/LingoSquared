  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: باشه، برویم!
    note: '*Va bene* پیشنهاد را قبول می‌کند و بعد *andiamo* با شوق دعوت را تکرار می‌کند.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: ساعت چند همدیگر را ببینیم؟
    note: '*ci vediamo* (همدیگر را می‌بینیم / همدیگر را ببینیم) شکل دوطرفه‌ی *vedersi* است.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: ساعت هشت جلوی سینما همدیگر را ببینیم.
    note: '*davanti a* (جلوی) همراه با حرف تعریف، محل قرار را مشخص می‌کند.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
