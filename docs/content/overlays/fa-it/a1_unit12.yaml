  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: باشه / خوب است، برویم
    note: '*va bene* (باشه) برای قبول کردنِ یک پیشنهاد است؛ *andiamo* (برویم) شکل «ما» از فعل *andare* است و برای دعوت به کار می‌رود.'
    example_gloss:
    - باشه، با هم برویم.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: امشب برویم سینما؟
