teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: اهل کجا
    note: '*di dove* پایهٔ اصلی برای پرسیدن یا گفتن محل اصلی (اهل کجا بودن) است و با *sei* (غیررسمی) یا *è* (رسمی) می‌آید.'
    example_gloss:
    - سم، تو اهل کجایی؟
    - النا، شما اهل کجا هستید؟ (رسمی)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: شما اهل کجایید؟
    note: پرسش غیررسمی که با هم‌سن‌وسال یا دوست به کار می‌رود و با *tu* در درس ۱ می‌خواند.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: اهل کجایید؟ (رسمی)
    note: پرسش رسمی که با *Lei* در درس ۱ می‌خواند.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: من آمریکایی‌ام، اهل شیکاگو.
    note: هم ملیت و هم شهر محل اصلی را با هم می‌گوید.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: من ایتالیایی‌ام، اهل میلان.
    note: '*italiana* شکل مؤنث ملیت است و چون النا یک زن است به کار رفته.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: آمریکایی (مذکر/مؤنث)، ایتالیایی (مذکر/مؤنث)
    note: 'در ایتالیایی واژه‌های ملیت بسته به جنسیت فرد آخرشان عوض می‌شود: *-o* برای مرد و *-a* برای زن (*Sam è americano*، *Elena è italiana*). در فارسی چنین تغییری وجود ندارد.'
    example_gloss:
    - سم آمریکایی است.
    - النا ایتالیایی است.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: ایتالیایی حرف می‌زنی؟
    note: پرسش غیررسمی با صرف *tu* از فعل *parlare* (حرف زدن).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: ایتالیایی حرف می‌زنید؟ (رسمی)
    note: پرسش رسمی با صرف *Lei* از فعل *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: کمی ایتالیایی حرف می‌زنم
    note: روشی فروتنانه و رایج برای گفتن سطح خودتان است؛ *un po'* یعنی «کمی».
    example_gloss: کمی ایتالیایی حرف می‌زنم، یک سال است که یاد می‌گیرم.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: انگلیسی حرف می‌زنم.
    note: همان ساختار *parlo* (حرف می‌زنم) با زبانی دیگر.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: یک سال است که ایتالیایی می‌خوانم.
    note: '*da un anno* یعنی «یک سال است»؛ کاری که در گذشته شروع شده و هنوز ادامه دارد.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: چند وقت است که درس می‌خوانی؟
    note: '*Da quanto* (از چه مدتی) + زمان حال *studi* (می‌خوانی، غیررسمی) می‌پرسد کاری چه مدت است ادامه دارد. جواب هم با همین ساختار است: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: ایتالیایی را خوب حرف می‌زنی!
    note: تعریفی دوستانه از سطح زبان کسی، با صرف غیررسمی *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: شغل شما چیست؟
    note: پرسش غیررسمی با صرف *tu* از فعل *fare* (انجام دادن).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: شغل شما چیست؟ (رسمی)
    note: پرسش رسمی با صرف *Lei* از فعل *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: من مهندس هستم
    note: 'در ایتالیایی عنوان شغل معمولاً بدون حرف تعریف می‌آید: *sono ingegnere* و نه *sono un ingegnere*.'
    example_gloss: مهندس هستم و در میلان کار می‌کنم.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: برای کار اینجا هستم.
    note: '*per lavoro* دلیل بودن در یک جا را می‌گوید: کار، نه گردشگری.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: دو سال اینجا هستم.
    note: همان ساختار *per lavoro*، اما این بار به‌جای دلیل، مدت را می‌گوید.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: چه عالی، به میلان خوش آمدی!
    note: '*Che bello* واکنشی رایج و پرشور است به معنای «چه خوب/چه عالی».'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: خیلی ممنون!
    note: همان تشکر پرشور درس ۱ که اینجا در جواب یک خوش‌آمدگویی گرم گفته می‌شود.
