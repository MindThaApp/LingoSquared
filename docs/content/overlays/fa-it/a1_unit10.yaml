    title: sempre dritto, all'incrocio
    gloss: مستقیم، سر چهارراه
    note: '*sempre dritto* (مستقیم) و *all''incrocio* (سر چهارراه) می‌گویند چطور و کجا باید پیچید.'
    example_gloss:
    - مستقیم بروید تا چهارراه.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: ببخشید، به موزه چطور می‌رسم؟
    note: '*Scusi* (ببخشید، رسمی) سؤال را شروع می‌کند و بعدش *come arrivo* (چطور می‌رسم) و مقصد می‌آید.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: مستقیم بروید، بعد سر چهارراه به راست بپیچید.
    note: '*Vada* و *giri* امر رسمی (Lei) هستند؛ شکل مؤدبانه‌ای که یک غریبه برای آدرس دادن به کار می‌برد.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: از اینجا دوره؟
    note: '*È lontano* (دور است) همراه با *da qui* (از اینجا) درباره‌ی فاصله می‌پرسد.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: نه، فقط پنج دقیقه پیاده است.
    note: '*a piedi* (پیاده) نشان می‌دهد فاصله با چه روشی سنجیده می‌شود.'
  it.a1.unit10.lesson02.teach.molto_gentile:
