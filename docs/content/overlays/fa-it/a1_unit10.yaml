teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: به راست، به چپ
    note: '*a destra* (به راست) و *a sinistra* (به چپ) دو جهت اصلی پیچیدن هستند.'
