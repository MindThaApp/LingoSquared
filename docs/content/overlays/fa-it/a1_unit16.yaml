  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: تب، سرفه
    note: 'علائم رایج که با *avere* (داشتن) می‌آیند: *Ho la febbre* (تب دارم).'
    example_gloss:
