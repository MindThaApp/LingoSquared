  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: سرم درد می‌کند.
    note: '*la testa* (سر) مؤنث است، برای همین *la* می‌گیرد.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: حالم خوب نیست
    note: '*mi sento* (احساس می‌کنم) به‌علاوهٔ *bene* (خوب)؛ *non* آن را منفی می‌کند تا بگویید حالتان خوب نیست.'
