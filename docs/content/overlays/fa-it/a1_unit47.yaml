    gloss: لوکا فقط کار نمی‌کند، درس هم می‌خواند. او در آموزشگاه بزرگسالان در یک دورهٔ اسپانیایی شرکت می‌کند. هر هفته کلمه‌های جدید یاد می‌گیرد. کیارا در مؤسسهٔ آموزش عالی یک دورهٔ تحصیلی می‌گذراند. او آنجا مراقبت‌های بهداشتی و درمانی می‌خواند. هر دو از درس خواندن خوششان می‌آید. شما چه می‌خوانید یا دوست دارید چه چیزی یاد بگیرید؟
