teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: بیشتر، کمتر
    note: '*più* (بیشتر) و *meno* (کمتر) کلمه‌های اصلی مقایسه‌اند؛ قبل از صفت می‌آیند یا همراه *di* برای مقایسه به کار می‌روند.'
    example_gloss:
    - من قهوهٔ بیشتر و چای کمتر می‌خوام.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: از
    note: 'بعد از *più*/*meno*، کلمهٔ *di* در مقایسه معنی «از» می‌دهد (*più di due euro*)؛ قبل از حرف تعریف معین ادغام می‌شود: *di* + *i* = *dei*، *di* + *le* = *delle*.'
    example_gloss:
    - قهوه بیشتر از دو یورو قیمت داره.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: سیب‌ها از گوجه‌فرنگی‌ها گران‌ترن.
    note: در *più dei pomodori* از *di* + *i* (که به *dei* ادغام شده) برای مقایسه با *i pomodori* استفاده شده.
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: گوجه‌فرنگی‌ها از سیب‌ها ارزون‌ترن.
    note: در *meno delle mele* از *di* + *le* (که به *delle* ادغام شده) برای مقایسه با *le mele* استفاده شده.
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: کدوم رو ترجیح می‌دی، سیب یا گوجه‌فرنگی؟
    note: '*Quale* (کدام) از مخاطب می‌خواهد بین دو چیزی که همین الان اسمشون اومد یکی را انتخاب کند.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: من سیب رو ترجیح می‌دم.
    note: '*Preferisco* (ترجیح می‌دهم) همراه *le mele* (سیب‌ها) با انتخاب یک گزینه به سؤال جواب می‌دهد.'
    example_gloss:
    - من گوجه‌فرنگی رو ترجیح می‌دم.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: مثل
    note: '*come* (مثل) با *buono/a* برای مقایسهٔ دو چیزِ برابر به کار می‌رود.'
    example_gloss:
    - چای مثل قهوه خوبه.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: سیب‌ها به اندازهٔ گوجه‌فرنگی‌ها خوشمزه‌ان.
    note: '*sono buone* (خوب‌اند، شکل جمع مؤنث) با *le mele* هماهنگ است؛ *come* مقایسهٔ برابر را می‌سازد.'
