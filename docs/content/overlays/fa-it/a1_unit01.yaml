teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: سلام، صبح بخیر
    note: '*Ciao* یک سلام دوستانه و همه‌کاره است که بین دوست‌ها و هم‌سن‌وسال‌ها در هر ساعتی از روز به کار می‌رود. *Buongiorno* سلام رسمی‌تر و معمولِ روز است و از صبح تا بعدازظهر می‌شود از آن استفاده کرد.'
    example_gloss:
    - سلام، حالت چطوره؟
    - صبح بخیر، حال شما چطوره؟
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: حالت چطوره؟ (غیررسمی)، حال شما چطوره؟ (رسمی)
    note: '*come stai* با *tu* می‌آید (دوست، هم‌سن‌وسال)؛ *come sta* با *Lei* می‌آید (غریبه، رئیس، کسی که به او احترام می‌گذارید). سؤال همان است، فقط سطح رسمی بودنش فرق می‌کند.'
    example_gloss:
    - سلام، امروز حالت چطوره؟
    - صبح بخیر، امروز حال شما چطوره؟
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: سلام، حالت چطوره؟
    note: سلام و احوال‌پرسی غیررسمی و دوستانه که با دوست‌ها، هم‌کلاسی‌ها و هم‌سن‌وسال‌ها به کار می‌رود.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: صبح بخیر، حال شما چطوره؟
    note: شکل رسمی آن، برای کسی که باید با احترام با او صحبت کنید، مثلاً مدیر یک همکار تازه.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: غیررسمی · Lei: رسمی یا محترمانه'
    note: '*tu* همان «تو»ی روزمره بین دوست‌ها، هم‌کلاسی‌ها و هم‌سن‌وسال‌هاست. *Lei* «شما»ی محترمانه است برای غریبه‌ها، محیط کار یا کسی که برای اولین بار می‌بینید. فعلِ Lei هم شکل خودش را دارد (*tu stai* را با *Lei sta* مقایسه کنید).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: خوبم، ممنون
    note: جواب ساده و خنثی به «حالت چطوره؟» که با اضافه کردن *e tu?* یا *e Lei?* در هر دو حالت رسمی و غیررسمی کار می‌کند.
    example_gloss:
    - خوبم، ممنون، تو چطوری؟
    - خوبم، ممنون، شما چطورید؟ (رسمی)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: تو چطوری؟ (خودمانی)
    note: شکل غیررسمیِ پرسیدنِ همان سؤال از دوست یا هم‌سن‌وسال.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: شما چطورید؟ (رسمی)
    note: شکل رسمیِ پرسیدنِ همان سؤال که با *Lei* جور است.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: خوبم، ممنون، تو چطوری؟
    note: جواب کامل غیررسمی همراه با پرسیدنِ همان سؤال، برای دوست یا هم‌سن‌وسال.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: خوبم، ممنون، شما چطورید؟
    note: جواب کامل رسمی همراه با پرسیدنِ همان سؤال، برای کسی که با احترام با او صحبت می‌کنید.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: عصر بخیر، شب بخیر
    note: '*Buonasera* سلامی است که وقتی عصر یا شب به جایی می‌رسید می‌گویید. *Buonanotte* خداحافظی است، وقتی کسی می‌خواهد بخوابد یا روز تمام می‌شود؛ هیچ‌وقت برای سلام کردن به کار نمی‌رود.'
    example_gloss:
    - عصر بخیر، حالتان چطوره؟
    - شب بخیر، فردا می‌بینمت.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: خداحافظ، فردا می‌بینمتان.
    note: '*Arrivederla* خداحافظیِ رسمی است که با *Lei* به کار می‌رود، مناسب محیط کار یا غریبه‌ها.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: خداحافظ، فردا می‌بینمت!
    note: خداحافظیِ دوستانه برای دوست‌ها و کسانی که فردا دوباره می‌بینیدشان.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: ببخشید، اسم شما چیست؟ (رسمی)
    note: '*Come si chiama?* در حالت رسمی *Lei* یعنی «اسمتان چیست؟». اضافه کردن *scusi* («ببخشید») موقع پرسیدن از یک غریبه مؤدبانه و طبیعی است.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: اسمت چیه؟ (غیررسمی)
    note: شکل غیررسمی که با دوست، هم‌سن‌وسال یا کسی هم‌سن خودتان به کار می‌رود.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: اسم من النا است.
    note: '*chiamarsi* یعنی «نامیده شدن». این روش معمول گفتن اسم خودتان است و در هر دو حالت رسمی و غیررسمی کاربرد دارد.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: من سم هستم.
    note: جایگزین ساده‌ای برای *mi chiamo* که از فعل *essere* («بودن») و بعد مستقیم اسم شما ساخته می‌شود.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: خوشبختم، از آشنایی با شما خوشبختم (رسمی)
    note: '*Piacere* به‌تنهایی راه کوتاه و رایجی برای گفتن «خوشبختم» در هر دو حالت رسمی و غیررسمی است. *Piacere di conoscerla* شکل کامل‌تر و رسمی است و با *Lei* به کار می‌رود.'
    example_gloss:
    - خوشبختم، سم!
    - از آشنایی با شما خوشبختم، خانم النا.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: به دفتر خوش آمدید!
    note: '*Benvenuto* شکل مذکر «خوش آمدی» است (برای یک مرد)؛ برای یک زن می‌گویند *Benvenuta*.'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: خیلی ممنون.
    note: راهی پرتأکیدتر برای تشکر کردن، قوی‌تر از یک *Grazie* ساده.
