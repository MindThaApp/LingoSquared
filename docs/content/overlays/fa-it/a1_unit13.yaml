teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: دیروز، امروز صبح
    note: '*ieri* («دیروز») و *stamattina* («امروز صبح») دو زمانی هستند که برای حرف زدن درباره اتفاق‌های اخیر به کار می‌روند.'
    example_gloss:
    - دیروز خونه بودم.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: رفتم (مرد)، رفتم (زن)
    note: '*sono andato/andata* ماضی نقلی فعل *andare* است و با فعل کمکی *essere* ساخته می‌شود؛ صفت مفعولی با جنسیت فاعل مطابقت می‌کند.'
    example_gloss:
    - امروز صبح رفتم سر کار.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: دیروز رفتم سینما.
    note: '*Sono andato* (گوینده مرد) به‌همراه *al cinema* («به سینما») و *ieri* («دیروز») یک اتفاق تمام‌شده در گذشته را بیان می‌کند.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: یه فیلم قشنگ دیدم!
    note: '*Ho visto* با فعل کمکی *avere* و صفت مفعولی بی‌قاعده *visto* (از *vedere*، «دیدن») ساخته شده است.'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: ناهار ساندویچ خوردم.
    note: '*Ho mangiato* با *avere* و صفت مفعولی باقاعده *mangiato* (از *mangiare*، «خوردن») ساخته شده است؛ *a pranzo* یعنی «سر ناهار».'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: دیروز چه کار کردید؟
    note: '*hai fatto* ماضی نقلی فعل *fare* («کردن») است و اینجا برای پرسیدن درباره یک اتفاق اخیر به کار رفته است.'
    example_gloss:
    - امروز صبح چیکار کردی؟
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: دیشب
    note: '*ieri sera* از *ieri* («دیروز») و *sera* («شب») ساخته شده و یک زمان مشخص در گذشته را نام می‌برد.'
    example_gloss:
    - دیشب رفتم سینما.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: امروز صبح مثل همیشه رفتم سر کار.
    note: '*sono andata* (گوینده زن) به‌همراه *come sempre* («مثل همیشه») یک کار روزمره در گذشته را بیان می‌کند.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: تو چی؟ امروز صبح چیکار کردی؟
    note: '*E tu* («تو چی؟») پرسش را به طرف مقابل برمی‌گرداند.'
    example_gloss:
    - تو چی؟ دیشب چیکار کردی؟
