teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: ساعت چند است؟
    note: راه معمول پرسیدن ساعت در ایتالیایی؛ تحت‌اللفظی «ساعت‌ها چندتا هستند». در فارسی ساعت را مفرد می‌گوییم («ساعت چنده؟»)، ولی در ایتالیایی جمع است.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: ساعت سه است.
    note: '*Sono le* + عدد، ساعت را برای همهٔ ساعت‌ها جز ساعت یک می‌گوید.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: ساعت یک، ساعت دو، ساعت سه، ساعت دوازده
    note: 'ساعت یک تنها استثناست: به‌جای *sono le* (جمع) از *è l''una* (مفرد) استفاده می‌شود، چون «یک» مفرد است.'
    example_gloss:
    - ساعت یک است.
    - ساعت دوازده است.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: ساعت چهار، ساعت پنج، ساعت شش
    note: اینها هم همان الگوی *sono le* + عدد را دارند که برای ساعت سه دیدید.
    example_gloss:
    - ساعت چهار است.
    - ساعت شش است.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: ساعت سه و نیم است.
    note: '*e mezzo* (و نیم) سی دقیقه به ساعت اضافه می‌کند.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: ساعت سه و ربع است.
    note: '*e un quarto* (و یک ربع) پانزده دقیقه به ساعت اضافه می‌کند.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: ساعت یک ربع به چهار است.
    note: '*meno un quarto* (منهای یک ربع) از ساعت بعدی به عقب می‌شمارد، درست مثل فارسی که می‌گوییم «یک ربع به چهار».'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: ساعت چند همدیگر را ببینیم؟
    note: '*A che ora* می‌پرسد چیزی در چه ساعتی است؛ *ci vediamo* یعنی «همدیگر را می‌بینیم».'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: ساعت سه و نیم همدیگر را می‌بینیم.
    note: '*alle* (در ساعت) قبل از ساعتی مشخص می‌آید، ولی *sono le* فقط ساعت را اعلام می‌کند.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: صبح، بعدازظهر، عصر
    note: اینها مشخص می‌کنند ساعت مربوط به کدام بخش از روز است، چون در گفتار روزمره عدد ساعت ایتالیایی خودش صبح یا عصر بودن را نشان نمی‌دهد.
    example_gloss:
    - قرار صبح است یا عصر؟
    - بعدازظهر است، ساعت سه و نیم.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: بعدازظهر است، ساعت سه و نیم.
    note: عبارت بخش روز را با ساعت مشخص ترکیب می‌کند تا هیچ ابهامی دربارهٔ صبح یا عصر نماند.
