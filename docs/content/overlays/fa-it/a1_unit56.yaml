      biblioteca: کتابخانه
      incendio: آتش‌سوزی
      dipendente: کارمند
      dice: می‌گوید
      Andate: بروید (andate = بروید، امر جمع)
      emergenza: اضطراری (uscita di emergenza = خروج اضطراری)
      aiuto: کمک
      bisogno: احتیاج (ho bisogno di = احتیاج دارم)
      chiama: زنگ می‌زند
      vigili: آتش‌نشان‌ها (vigili del fuoco = آتش‌نشانی)
      tutti: همه
      fuori: بیرون
      bene: خوب، باشه (va bene = خوب است)
