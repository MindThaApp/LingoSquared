teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: شغل / کار
    note: '*il lavoro* اسم مذکر است و هم «شغل» معنی می‌دهد و هم «کار» به‌طور کلی.'
    example_gloss:
    - شغل من جالب است.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: معلم، فروشنده
    note: '*insegnante* (معلم) برای مرد و زن یک شکل دارد؛ *commesso* (فروشنده) مذکر است — شکل مؤنثش *commessa* است.'
    example_gloss:
    - من معلم‌ام، فروشنده نیستم.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: شغل شما چیست؟
    note: '*Che lavoro fai?* (تحت‌اللفظی: «چه شغلی انجام می‌دهی؟») راه معمول پرسیدن شغل کسی است.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: من معلم هستم.
    note: 'در ایتالیایی قبل از شغلِ بدون صفت حرف تعریف نمی‌آید: *Sono insegnante* و نه *Sono un insegnante*.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: من فروشنده‌ام.
    note: همان الگوی بدون حرف تعریفِ *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: اداره، مدرسه
    note: '*l''ufficio* (اداره) قبل از مصوت حرف تعریفش را کوتاه می‌کند؛ *la scuola* (مدرسه) مؤنث است.'
    example_gloss:
    - من در یک دفتر کار می‌کنم.
    - من در یک مدرسه کار می‌کنم.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: کجا کار می‌کنید؟
    note: '*Dove* (کجا) به‌اضافهٔ *lavori* (کار می‌کنی، غیررسمی).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: من در یک اداره کار می‌کنم.
    note: '*Lavoro in* (کار می‌کنم در) به‌اضافهٔ *un ufficio* (یک اداره).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: من در یک مدرسه کار می‌کنم.
    note: همان الگو با *una scuola* (یک مدرسه).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: شروع می‌کنم، تمام می‌کنم
    note: '*inizio* (شروع می‌کنم) و *finisco* (تمام می‌کنم) صورت اول‌شخص مضارع *iniziare* و *finire* هستند.'
    example_gloss:
    - ساعت نه شروع می‌کنم.
    - ساعت پنج تمام می‌کنم.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: ساعت چند شروع می‌کنی؟
    note: '*A che ora* (ساعت چند) به‌اضافهٔ *inizi* (شروع می‌کنی، غیررسمی).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: ساعت نه شروع می‌کنم و ساعت پنج تمام می‌کنم.
    note: '*alle nove* / *alle cinque* (ساعت نه / ساعت پنج) قبل از عدد ساعت از *alle* استفاده می‌کند، مثل عبارت‌های ساعت در واحد ۵.'
