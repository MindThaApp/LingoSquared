teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Maison
    gloss: maison
    note: بيت (bayt) signifie « maison » ; la terminaison ـي signifie « mon/ma », donc بيتي (baytī) veut dire « ma maison ».
    example_gloss: Ma maison est près de la bibliothèque.
  ar.a1.unit19.lesson01.teach.room:
    title: Pièce
    gloss: pièce
    note: غرفة (ghurfa) est féminin (il se termine par ة), donc واحدة, au féminin, le suit.
    example_gloss: Dans ma maison, il y a une pièce.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Cuisine
    gloss: cuisine
    note: 'مطبخ (maṭbakh) signifie « cuisine ». L’arabe n’a pas de mot pour « il y a » ici : commencer par في بيتي (« dans ma maison ») joue ce rôle.'
    example_gloss: Dans ma maison, il y a une cuisine.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Une pièce
    gloss: une pièce
    note: 'Le nombre « un » se place après le nom et s’accorde avec lui : غرفة واحدة (ghurfa wāḥida) ; avec un nom masculin, on dit واحد.'
    example_gloss: Dans ma maison, il y a une pièce.
  ar.a1.unit19.lesson02.teach.table:
    title: Table
    gloss: table
    note: طاولة (ṭāwila) signifie « table » ; comme غرفة, elle se termine par ة et est féminine.
    example_gloss: J’ai une table dans la pièce.
  ar.a1.unit19.lesson02.teach.in_room:
    title: Dans la pièce
    gloss: dans la pièce
    note: الغرفة (al-ghurfa) signifie « la pièce ».
    example_gloss: La table est dans la pièce.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Près de la bibliothèque
    gloss: près de la bibliothèque
    note: قرب (qurb) signifie « près de » ; المكتبة est la bibliothèque, vue dans l’unité sur les lieux.
    example_gloss: Ma maison est près de la bibliothèque.
  ar.a1.unit19.lesson02.teach.line01:
    title: Demander où
    gloss: Layla demande où est la maison de Youssef.
    note: أين signifie « où » ; بيتك (baytuka) veut dire « ta maison », dit à un homme ; à une femme, on dit baytuki, qui s’écrit de la même façon.
    example_gloss: 'Layla a dit : Où est ta maison, Youssef ?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Emplacement de la maison
    gloss: Youssef dit que sa maison est près de la bibliothèque.
    note: بيتي signifie « ma maison ».
    example_gloss: 'Youssef a dit : Ma maison est près de la bibliothèque.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Les pièces
    gloss: Youssef dit que sa maison a une pièce et une cuisine.
    note: 'و (wa, « et ») relie les deux éléments de la maison et s’écrit collé au mot suivant : ومطبخ.'
    example_gloss: 'Youssef a dit : Dans ma maison, il y a une pièce et une cuisine.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Demander un objet
    gloss: Layla demande si Youssef a une table.
    note: هل introduit une question à réponse oui ou non ; عندك (ʿindaka) signifie « tu as », dit à un homme ; à une femme, on dit ʿindaki, qui s’écrit de la même façon.
    example_gloss: 'Layla a dit : As-tu une table ?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Emplacement de l’objet
    gloss: Youssef dit qu’il a une table dans la pièce.
    note: عندي exprime la possession.
    example_gloss: 'Youssef a dit : Oui, j’ai une table dans la chambre.'
