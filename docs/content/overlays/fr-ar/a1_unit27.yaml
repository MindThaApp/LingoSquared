course:
  title: Arabe A1
  description: 'Arabe pour débutants : parler des animaux de compagnie et des animaux courants, les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux tu aimes même sans en avoir, et les pluriels courants.'
units:
  ar.a1.unit27.animals:
    title: Les animaux et les animaux de compagnie
