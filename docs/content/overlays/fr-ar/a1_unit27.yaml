teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: حيوان (ḥayawān) signifie « animal » et حيوان أليف (ḥayawān alīf) « animal de compagnie ». أليف (alīf) est un adjectif qui signifie « apprivoisé » ; il se place après le nom.
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Layla a un chien.
    - Karim a un chat.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nour a un oiseau.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: 'هل لديك (hal ladayka) signifie « as-tu ». À une femme, l’écriture est la même, mais la dernière voyelle est i : ladayki. هل (hal) introduit une question fermée (oui/non).'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: 'ليس لدي (laysa ladayya) signifie « je n’ai pas » : ليس (laysa) marque la négation et لدي (ladayya) signifie « j’ai ».'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Ne pas avoir : ليس لدي'
    gloss: 'Pour dire que tu n’as pas quelque chose, utilise ليس لدي (laysa ladayya) : ليس لدي وقت (je n’ai pas le temps), ليس لدي حيوان أليف (je n’ai pas d’animal de compagnie).'
    note: ليس لدي s’emploie avec n’importe quel nom et ne varie pas selon le genre. Pour « il » et « elle », dis ليس لديه (laysa ladayhi) et ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Promener un animal
    gloss: promener un animal
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) signifie littéralement « emmener l’animal en promenade ». Le verbe est أخذ, « prendre ».
    example_gloss: Je promène le chien tous les jours.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Le verbe change selon la personne
    gloss: 'Le verbe change selon la personne : آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), je promène le chien ; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), Karim promène son chien.'
    note: La lettre initiale أ (a-) marque « je » et ي (ya-) marque « il ». نزهة (nuzha) signifie « promenade » ou « petite sortie ».
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Karim joue avec son chat.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: 'كل يوم (kull yawm) signifie « tous les jours » : كل + un nom singulier sans ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: أطعم (uṭʿim) signifie « je nourris ». القطة (al-qiṭṭa) est féminin, et le ال est attaché au nom.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Pluriels : كلب → كلاب'
    gloss: 'Beaucoup de pluriels sont irréguliers, donc apprends-les avec le nom : كلب (kalb) devient كلاب (kilāb), قطة (qiṭṭa) devient قطط (qiṭaṭ) et طائر (ṭāʾir) devient طيور (ṭuyūr).'
    note: 'En arabe, la plupart des pluriels sont des pluriels brisés : on apprend donc chaque pluriel avec son nom. Le pluriel des animaux prend un adjectif au féminin singulier.'
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Yusuf aime les chiens.
    - Sara aime les chats.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) signifie « J’aime les animaux ». Le pluriel se termine par ات et l’article ال s’y attache.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara aime les chats, mais n’a pas d’animal de compagnie
    gloss: Sara aime les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf demande si Layla a un animal de compagnie
    gloss: 'Yusuf : Tu as un animal de compagnie, Layla ?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla a un chien
    gloss: 'Layla : Oui, j’ai un chien.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf demande à quoi il ressemble
    gloss: 'Yusuf : Il est comment ?'
    note: كيف يبدو؟ (kayfa yabdū ?) signifie « Il est comment ? ». يبدو (yabdū) est au masculin parce que كلب, « chien », est un nom masculin.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla décrit son chien
    gloss: 'Layla : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Les pronoms pour les animaux
    gloss: 'Chaque nom d’animal est masculin ou féminin : le chien est هو (huwa, il) et la chatte est هي (hiya, elle). La terminaison ه dans أطعمه (uṭʿimuhu) signifie « le » ou « lui ».'
    note: Un nom d’animal masculin comme كلب prend des pronoms et des adjectifs masculins ; un nom féminin comme قطة les prend au féminin.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf demande pour les promenades
    gloss: 'Yusuf : Tu le promènes tous les jours ?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla décrit sa routine
    gloss: 'Layla : Oui, je le promène tous les jours et je le nourris.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara et Karim et les animaux
    gloss: 'Yusuf et Sara aiment tous les deux les animaux, mais aucun des deux n’a d’animal de compagnie. Yusuf aime les chiens et Sara aime les chats. Karim, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      يحبان: adorer
      كلاهما: tous les deux
      الحيوانات: animaux
      منهما: d’entre eux (aucun d’entre eux)
      أليف: 'animal de compagnie (littéralement : apprivoisé)'
      الكلاب: chiens
      القطط: chats
      قطة: chat
      يلعب: joue
      ويعطي: donne
      كل: tous les
      طعاما: nourriture
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim joue souvent avec son chat
    gloss: Karim joue souvent avec son chat.
    note: 'قطته (qiṭṭatuhu) signifie « son chat » : la terminaison ه (hu) signifie « son », et le ة de قطة devient ت devant elle.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla interroge Nour
    gloss: 'Layla : Nour, tu as un animal de compagnie, toi aussi ?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour a un oiseau nommé Pico
    gloss: 'Nour : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: اسمه (ismuhu) signifie « son nom » ; le ه final signifie « son ». بيكو (bīkū) est le nom de l’oiseau.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Réaction de Yusuf
    gloss: 'Yusuf : Comme c’est beau ! Qu’est-ce que tu fais avec lui tous les jours ?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour le nourrit tous les jours
    gloss: 'Nour : Je le nourris tous les jours.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Yusuf aime aussi les oiseaux
    gloss: 'Yusuf : Moi aussi, j’aime les oiseaux.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla conclut la conversation
    gloss: 'Layla : Comme c’est chouette que nous trois, nous aimions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
