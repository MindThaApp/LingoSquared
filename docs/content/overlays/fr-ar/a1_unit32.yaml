    example_gloss: Je t’invite.
  ar.a1.unit32.lesson03.teach.ytsl_aldmyr_balfal:
    title: Les pronoms attachés au verbe
    gloss: 'Un pronom se colle à la fin du verbe : أدعوك (adʿūka, je t’invite), أدعوه (adʿūhu, je l’invite, lui), أدعوها (adʿūhā, je l’invite, elle).'
    note: ك (-ka) signifie « te / ton », ه (-hu) signifie « le / lui / son » et ها (-hā) signifie « la / elle / son ». Ces suffixes ne s’écrivent jamais comme des mots séparés.
