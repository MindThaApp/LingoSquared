  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: Qui fait quoi pour la fête ?
    gloss: Samedi, c’est l’anniversaire de Sara. On fait une fête. Youssef invite Karim et Layla à la fête. Karim aime fêter les choses avec ses amis. Layla viendra aussi à la fête. Tout le monde est content pour Sara.
    note: Ce texte récapitule l’organisation de la fête sous la forme d’une lecture comparative semblable à celle de l’unité sur les études.
    glosses:
      السبت: samedi
      ميلاد: naissance (comme dans « anniversaire »)
      نحتفل: fêter
      بحفلة: fête
      يدعو: invite
      إلى: à (dans « invite … à la fête »)
      الاحتفال: fête
      يحب: aime
      الأصدقاء: les amis
      ستأتي: vient
      الجميع: tout le monde
      سعداء: content
  ar.a1.unit32.lesson05.teach.ywsf_ydaw_krym:
    title: Youssef invite Karim et Layla
    gloss: Youssef invite Karim et Layla à la fête.
  ar.a1.unit32.lesson05.teach.aljmya_sadaa_mn:
    title: Tout le monde est content pour Sara
    gloss: Tout le monde est content pour Sara.
  ar.a1.unit32.lesson06.teach.ywsf_ayd_mylad:
    title: Youssef félicite Sara
    gloss: 'Youssef : Joyeux anniversaire, Sara !'
  ar.a1.unit32.lesson06.teach.lyla_mbrwk_hdhh:
    title: Layla offre un cadeau
    gloss: 'Layla : Félicitations ! Voici un cadeau pour toi.'
  ar.a1.unit32.lesson06.teach.sara_shkra_lkma:
    title: Sara les remercie
    gloss: 'Sara : Merci à vous deux ! C’est vraiment gentil.'
  ar.a1.unit32.lesson06.teach.krym_hl_nbda:
    title: Karim propose de commencer
    gloss: 'Karim : On commence la fête ?'
  ar.a1.unit32.lesson06.teach.sara_nam_lnhtfl:
    title: Sara accepte
    gloss: 'Sara : Oui, fêtons-la !'
