teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Comment tu t’appelles ?
    gloss: Comment vous appelez-vous ?
    note: ما اسمك؟ (mā ismuk) est la façon habituelle de demander un nom ; sans voyelles, la forme écrite convient à tout interlocuteur.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Mon nom est
    gloss: mon nom [est]
    note: اسمي (ismī) associe اسم (nom) à la terminaison possessive ـي (mon).
    example_gloss: Je m’appelle Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: je
    gloss: je
    note: أنا (anā) est le pronom personnel autonome pour « je » ; en arabe, le verbe marque aussi la personne, mais أنا s’emploie pour insister et dans des phrases nominales simples comme celle-ci.
    example_gloss: Je suis Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Enchanté(e)
    gloss: enchanté(e)
    note: 'تشرفنا (tasharrafnā), littéralement « nous sommes honorés », est la réponse habituelle et réciproque quand on rencontre quelqu’un : l’une ou l’autre personne peut la dire en premier.'
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: D’où viens-tu ?
    gloss: D’où venez-vous ?
    note: من أين أنت؟ (min ayna anta à un homme, min ayna anti à une femme) sert à demander l’origine de quelqu’un ; à l’écrit sans voyelles, la graphie est la même pour les deux.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Je viens de
    gloss: je viens de
    note: أنا من (anā min) est directement suivi d’un nom de pays ou de ville.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Liban
    gloss: Liban
    note: لبنان (lubnān) ne prend pas l’article défini, contrairement à la plupart des autres pays de cette leçon.
    example_gloss: Je viens du Liban.
  ar.a1.unit02.lesson02.teach.misr:
    title: L’Égypte
    gloss: Égypte
    note: مصر (miṣr) ne prend pas non plus l’article défini.
    example_gloss: Je viens d’Égypte.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Jordanie
    gloss: Jordanie
    note: الأردن (al-ʾurdun) porte toujours l’article défini الـ dans son nom, comme المغرب et العراق dans cette leçon.
    example_gloss: Je viens de Jordanie.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Maroc
    gloss: Maroc
    note: المغرب (al-maghrib) signifie littéralement « l’ouest » ; c’est la même racine que celle de la prière du coucher du soleil.
    example_gloss: Je viens du Maroc.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Syrie
    gloss: Syrie
    note: سوريا (sūryā) ne prend pas l’article défini.
    example_gloss: Je viens de Syrie.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) porte l’article défini.
    example_gloss: Je viens d’Irak.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Tu viens de… ?
    gloss: Tu viens d’Égypte ?
    note: هل (hal) est une particule interrogative pour les questions fermées (oui/non), placée au début de la phrase ; elle n’a pas de sens propre.
  ar.a1.unit02.lesson03.teach.naam:
    title: Oui
    gloss: oui
    note: نعم (naʿam) est la réponse affirmative habituelle.
    example_gloss: Oui, je viens d’Égypte.
  ar.a1.unit02.lesson03.teach.laa:
    title: Non
    gloss: non
    note: لا (lā) est la réponse négative habituelle.
    example_gloss: Non, je viens du Liban.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Ravi de t’avoir rencontré
    gloss: ravi de t’avoir rencontré
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) est une formule de clôture plus chaleureuse que تشرفنا, souvent utilisée juste avant de se quitter.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Sois le bienvenu
    gloss: sois le bienvenu / tu es ici chez toi
    note: 'مرحبا بك (marḥaban bik) ajoute بك, « à toi » : la préposition بـ avec le pronom suffixe ـك (tu/te) — le même بك que dans أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Salutation d’ouverture
    gloss: Youssef salue Layla.
    note: L’échange commence par un simple مرحبا, avant que les prénoms soient échangés.
  ar.a1.unit02.lesson04.teach.line02:
    title: Salutation d’ouverture, réponse
    gloss: Layla lui rend son salut.
    note: Le même mot مرحبا sert aux deux interlocuteurs pour se saluer.
  ar.a1.unit02.lesson04.teach.line03:
    title: Demander un prénom
    gloss: Youssef lui demande son prénom.
    note: ما اسمك؟ ouvre la présentation.
  ar.a1.unit02.lesson04.teach.line04:
    title: Demander un prénom, réponse
    gloss: Layla répond et lui pose la même question.
    note: 'وأنت؟ reprend la question sans répéter toute la phrase : un raccourci courant.'
  ar.a1.unit02.lesson04.teach.line05:
    title: Réponse et plaisir partagé
    gloss: Youssef donne son prénom et dit qu’il est enchanté de la rencontrer.
    note: تشرفنا conclut l’échange des prénoms.
  ar.a1.unit02.lesson04.teach.line06:
    title: Plaisir partagé, réponse
    gloss: Layla répond par la même formule.
    note: تشرفنا se dit naturellement des deux côtés, pas seulement d’un seul.
  ar.a1.unit02.lesson04.teach.line07:
    title: Demander l’origine
    gloss: Youssef lui demande d’où elle vient.
    note: من أين أنت؟ amène la conversation sur l’origine.
  ar.a1.unit02.lesson04.teach.line08:
    title: Demander l’origine, réponse
    gloss: Layla répond et lui pose la même question.
    note: Elle reprend وأنت؟, le même raccourci que dans la ligne précédente.
  ar.a1.unit02.lesson04.teach.line09:
    title: Dire son origine
    gloss: Youssef dit qu’il vient du Liban.
    note: أنا من لبنان suit le même schéma que celui vu dans la leçon précédente.
  ar.a1.unit02.lesson04.teach.line10:
    title: Terminer l’échange
    gloss: Layla dit qu’elle est ravie de l’avoir rencontré.
    note: سعدت بلقائك montre que la conversation touche naturellement à sa fin.
  ar.a1.unit02.lesson04.teach.line11:
    title: Adieux
    gloss: Youssef lui dit qu’elle sera toujours la bienvenue et lui dit au revoir.
    note: دائما (toujours) transforme مرحبا بك en invitation ouverte avant la formule d’adieu مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Adieux, réponse
    gloss: Layla dit au revoir.
    note: مع السلامة clôt l’échange ; cette formule a été vue dans a1_unit01.
