teaching:
  ar.a1.unit07.lesson01.teach.water:
    title: L’eau
    gloss: eau
    note: ماء (māʾ) signifie eau.
    example_gloss: Je veux de l’eau.
  ar.a1.unit07.lesson01.teach.coffee:
    title: Le café
    gloss: café
    note: قهوة (qahwa) signifie café.
    example_gloss: Je veux de l’eau et du café.
  ar.a1.unit07.lesson01.teach.bread:
    title: Le pain
    gloss: pain
    note: خبز (khubz) signifie pain. Comme complément d’objet d’un verbe tel que أريد ou تريدين, il s’écrit خبزا (khubzan).
    example_gloss: Je veux du pain.
  ar.a1.unit07.lesson01.teach.i_want:
    title: je veux
    gloss: je veux
    note: أريد (urīdu) est une formule de demande directe, mais tout à fait correcte.
    example_gloss: Je veux de l’eau.
  ar.a1.unit07.lesson01.teach.please:
    title: S’il vous plaît
    gloss: s’il vous plaît
    note: 'من فضلك (min faḍlika ; à une femme : min faḍliki) ajoute de la politesse après une demande ; il peut aussi se placer au début.'
    example_gloss: Je veux de l’eau, s’il vous plaît.
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: Voulez-vous du pain ?
    gloss: Voulez-vous du pain ?
    note: تريدين (turīdīna) signifie « tu veux » dit à une femme, ici Layla ; à un homme, on dit تريد (turīdu).
    example_gloss: 'Le serveur a dit : Voulez-vous du pain ?'
  ar.a1.unit07.lesson02.teach.one_bread:
    title: Un morceau de pain
    gloss: un morceau de pain
    note: قطعة خبز واحدة (qiṭʿat khubz wāḥida) donne au pain une unité dénombrable ; واحدة est au féminin pour s’accorder avec قطعة.
    example_gloss: Je veux un morceau de pain.
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: Voici
    gloss: voici, tenez
    note: تفضلي (tafaḍḍalī) se dit à une femme quand on lui tend quelque chose ; à un homme, on dit تفضل (tafaḍḍal).
    example_gloss: 'Le serveur a dit : Voici.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Passer une commande
    gloss: Layla commande poliment de l’eau et du café.
    note: La demande se construit avec أريد suivi des articles commandés.
    example_gloss: 'Layla a dit : Bonjour. Je voudrais de l’eau et du café, s’il vous plaît.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Poser une question complémentaire
    gloss: Le serveur demande si elle veut du pain.
    note: هل introduit une question fermée (réponse par oui ou non).
    example_gloss: 'Le serveur a dit : Voulez-vous du pain ?'
  ar.a1.unit07.lesson02.teach.line03:
    title: Répondre à la question
    gloss: Layla dit oui et demande un morceau de pain.
    note: نعم donne la réponse affirmative.
    example_gloss: 'Layla a dit : Oui, je veux un morceau de pain.'
  ar.a1.unit07.lesson02.teach.line04:
    title: Servir la commande
    gloss: 'Le serveur dit : Voici.'
    note: تفضلي conclut l’échange.
    example_gloss: 'Le serveur a dit : Voici.'
