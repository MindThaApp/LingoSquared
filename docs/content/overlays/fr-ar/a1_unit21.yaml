teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: Les vêtements
    gloss: vêtements
    note: ملابس (malābis) est un nom pluriel qui signifie « vêtements ».
    example_gloss: Je veux des vêtements.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Chemise
    gloss: chemise
    note: 'قميص (qamīṣ) signifie « chemise » ; après أريد, il prend la terminaison de l’objet -an : قميصا (qamīṣan).'
    example_gloss: Je veux une chemise.
  ar.a1.unit21.lesson01.teach.blue:
    title: Bleu
    gloss: bleu
    note: 'أزرق (azraq) est la forme masculine, accordée avec قميص ; avec un nom féminin, il devient زرقاء (zarqāʾ). Après أريد, أزرق ne prend pas d’alif supplémentaire : قميصا أزرق.'
    example_gloss: Je veux une chemise bleue.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Une chemise bleue
    gloss: une chemise bleue
    note: 'En arabe, comme souvent en français, la couleur se place après le nom : قميصا أزرق (qamīṣan azraq).'
    example_gloss: Je veux une chemise bleue.
  ar.a1.unit21.lesson02.teach.size:
    title: Taille
    gloss: la taille
    note: مقاس (maqās) signifie « taille » ; ما المقاس؟ (mā l-maqās) demande la taille.
    example_gloss: Quelle taille ?
  ar.a1.unit21.lesson02.teach.medium:
    title: Taille moyenne
    gloss: taille moyenne
    note: 'متوسط (mutawassiṭ) signifie « moyen » ; avec بـ (bi-, « en »), il se rattache à un article : قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), une chemise en taille moyenne.'
    example_gloss: Je veux une chemise en taille moyenne.
  ar.a1.unit21.lesson02.teach.price:
    title: Dix dirhams
    gloss: dix dirhams
    note: 'بعشرة (bi-ʿashara) signifie « pour dix » : le préfixe بـ marque le prix, comme dans l’unité sur les achats.'
    example_gloss: La chemise coûte dix dirhams.
  ar.a1.unit21.lesson02.teach.line01:
    title: Demander un article
    gloss: Layla demande une chemise bleue.
    note: من فضلك rend la demande polie.
    example_gloss: 'Layla a dit : Je veux une chemise bleue, s’il vous plaît.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Demander la taille
    gloss: Le vendeur demande quelle taille.
    note: 'Le vendeur demande la taille : ما المقاس؟'
    example_gloss: 'Le vendeur a dit : Quelle taille ?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Donner la taille
    gloss: Layla dit taille moyenne.
    note: Cela répond directement à la question sur la taille.
    example_gloss: 'Layla a dit : Taille moyenne.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Donner l’article et le prix
    gloss: Le vendeur donne la chemise et indique le prix.
    note: 'تفضلي (tafaḍḍalī) se dit à une femme quand on lui tend quelque chose ; à un homme : تفضل (tafaḍḍal).'
    example_gloss: 'Le vendeur a dit : Tenez. La chemise coûte dix dirhams.'
