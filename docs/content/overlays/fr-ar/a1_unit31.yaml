    title: Qui étudie quoi ?
    gloss: Karim ne fait pas que travailler, il étudie aussi. Il suit un cours d’espagnol au centre d’éducation pour adultes. Il apprend de nouveaux mots chaque semaine. Sara suit un programme à la faculté. Elle y étudie la santé. Tous les deux aiment étudier. Que tu étudies, ou que veux-tu apprendre ?
    note: Compare les études de Karim et de Sara, sur le modèle de la lecture comparative de l’unité sur la technologie.
