teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Téléphone
    gloss: téléphone
    note: هاتف (hātif) signifie téléphone.
    example_gloss: C’est un téléphone.
  ar.a1.unit23.lesson01.teach.hear:
    title: Je t’entends
    gloss: je t’entends
    note: أسمعك (asmaʿuka à un homme, asmaʿuki à une femme) signifie « je t’entends » ; لا أسمعك (lā asmaʿuk) signifie « je ne t’entends pas ».
    example_gloss: Je ne t’entends pas.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Répéter
    gloss: répète
    note: 'أعد (aʿid) s’adresse à un homme ; à une femme, on dit : أعيدي (aʿīdī). أعد من فضلك demande poliment à quelqu’un de répéter.'
    example_gloss: Je ne t’entends pas. Répète, s’il te plaît.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Parler lentement
    gloss: parle lentement
    note: 'تكلم ببطء (takallam bi-buṭʾ) s’adresse à un homme ; à une femme, on dit : تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Parle lentement, s’il te plaît.
  ar.a1.unit23.lesson02.teach.message:
    title: Message
    gloss: message
    note: رسالة (risāla) signifie « message » ; le mot peut aussi signifier « lettre ».
    example_gloss: C’est un message.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Rendez-vous
    gloss: le rendez-vous
    note: موعد (mawʿid) signifie « rendez-vous » ; الموعد (al-mawʿid) signifie « le rendez-vous ».
    example_gloss: Le rendez-vous est à cinq heures.
  ar.a1.unit23.lesson02.teach.line01:
    title: Répondre au téléphone
    gloss: Yusuf salue Layla au téléphone et dit son nom.
    note: Au téléphone, أنا يوسف (anā Yūsuf) permet de dire qui appelle.
    example_gloss: 'Yusuf a dit : Bonjour, c’est Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Impossible d’entendre
    gloss: Layla dit qu’elle n’entend pas Yusuf.
    note: Cette phrase prépare la demande de clarification.
    example_gloss: 'Layla a dit : Bonjour Yusuf, je ne t’entends pas.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Demander de parler lentement
    gloss: Layla demande à Yusuf de parler lentement.
    note: من فضلك garde la demande polie ; Layla dit تكلم parce qu’elle s’adresse à un homme.
    example_gloss: 'Layla a dit : Parle lentement, s’il te plaît.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Détail important
    gloss: Yusuf dit que le rendez-vous est à cinq heures.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) signifie « à cinq heures ».
    example_gloss: 'Yusuf a dit : Le rendez-vous est à cinq heures.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Demander de répéter
    gloss: Layla demande à Yusuf de répéter.
    note: أعد من فضلك est la demande de répétition.
    example_gloss: 'Layla a dit : Répète, s’il te plaît.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Répéter le détail
    gloss: Yusuf répète l’heure du rendez-vous.
    note: La phrase répétée confirme l’heure.
    example_gloss: 'Yusuf a dit : Le rendez-vous est à cinq heures.'
