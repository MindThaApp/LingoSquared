teaching:
  ar.a1.unit16.lesson01.teach.ticket:
    title: Billet
    gloss: billet
    note: 'تذكرة (tadhkira) est un nom féminin : les mots qui se terminent par ة sont généralement féminins.'
    example_gloss: Je veux un billet.
  ar.a1.unit16.lesson01.teach.train:
    title: Train
    gloss: le train
    note: 'القطار (al-qiṭār) : ال correspond à « le », « la » ou « les ».'
    example_gloss: Le train est à cinq heures.
  ar.a1.unit16.lesson01.teach.to_cairo:
    title: Vers Le Caire
    gloss: pour Le Caire
    note: القاهرة (al-qāhira) est Le Caire ; إلى (ilā) indique la destination.
    example_gloss: Je veux un billet pour Le Caire.
  ar.a1.unit16.lesson01.teach.ticket_request:
    title: Je veux un billet
    gloss: Je veux un billet pour Le Caire
    note: أريد convient pour une demande de voyage simple.
    example_gloss: Je voudrais un billet pour Le Caire, s’il vous plaît.
  ar.a1.unit16.lesson02.teach.platform:
    title: Quai
    gloss: le quai
    note: الرصيف (ar-raṣīf) est le quai d’une gare ; le même mot désigne aussi le trottoir.
    example_gloss: Le quai est ici.
  ar.a1.unit16.lesson02.teach.second_platform:
    title: Quai numéro deux
    gloss: quai numéro deux
    note: الثاني (ath-thānī) signifie « deuxième » ; c’est la forme masculine, qui s’accorde avec الرصيف. Comme un adjectif, il se place après le nom et prend lui aussi ال.
    example_gloss: Du quai numéro deux.
  ar.a1.unit16.lesson02.teach.which_platform:
    title: Quel quai ?
    gloss: de quel quai ?
    note: أي (ayy) sert à demander « lequel » ou « quel ».
    example_gloss: 'Layla a dit : De quel quai ?'
  ar.a1.unit16.lesson02.teach.line01:
    title: Layla demande un billet
    gloss: Layla demande un billet pour Le Caire.
    note: من فضلك rend la demande polie.
    example_gloss: 'Layla a dit : Je voudrais un billet pour Le Caire, s’il vous plaît.'
  ar.a1.unit16.lesson02.teach.line02:
    title: Heure de départ
    gloss: L’employé indique l’heure du train.
    note: في الساعة introduit l’heure de départ.
    example_gloss: 'L’employé a dit : Le train est à cinq heures.'
  ar.a1.unit16.lesson02.teach.line03:
    title: Demander le quai
    gloss: Layla demande de quel quai.
    note: رصيف apparaît sans ال après أي.
    example_gloss: 'Layla a dit : De quel quai ?'
  ar.a1.unit16.lesson02.teach.line04:
    title: Réponse sur le quai
    gloss: L’employé indique le quai numéro deux.
    note: من الرصيف الثاني répond à la question sur le quai.
    example_gloss: 'L’employé a dit : Du quai numéro deux.'
