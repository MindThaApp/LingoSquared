course:
  title: Arabe A1
  description: 'Arabe pour débutants afin de décrire ses loisirs : vocabulaire des passe-temps, expressions de fréquence, demander et dire ce que l’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
units:
  ar.a1.unit25.hobbies:
    title: Les loisirs et le temps libre
