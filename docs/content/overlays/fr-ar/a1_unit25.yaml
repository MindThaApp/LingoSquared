teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: القراءة (al-qirāʾa) signifie « la lecture », ممارسة الرياضة (mumārasat ar-riyāḍa) « faire du sport » et الطبخ (aṭ-ṭabkh) « la cuisine, cuisiner ». Chacun est un nom, donc l’article ال y est attaché.
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Le temps libre
    gloss: temps libre
    note: وقت الفراغ (waqt al-farāgh) signifie littéralement « le temps du vide ». Le premier mot n’a pas de ال ; seul le second le prend.
    example_gloss: Pendant mon temps libre, j’aime lire.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: أحب (uḥibb) signifie « j’aime » et est identique pour un homme et une femme. Le ي à la fin de فراغي (farāghī) signifie « mon ».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) signifie « écouter de la musique », الرسم (ar-rasm) « dessiner » et لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) « jouer aux jeux vidéo ».
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: 'الاستماع (al-istimāʿ) demande إلى (ilā, « à ») devant ce que l’on écoute : الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: 'مع (maʿa) signifie « avec » : مع الأصدقاء (maʿa al-aṣdiqāʾ). L’article ال reste attaché à الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) et أبدا (abadan) sont des adverbes : ils ne changent jamais selon le genre. Le ا (alif) final s’écrit sans aucun signe.'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: كل أسبوع (kull usbūʿ) et كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) utilisent tous deux كل (kull, « chaque ») ; voir la fiche suivante.
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: '« Chaque » : كل'
    gloss: 'Après كل (kull, « chaque »), le nom est au singulier et sans ال : كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) ne change jamais : on emploie le même mot devant un nom masculin comme أسبوع et devant un nom féminin comme عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla parle des loisirs
    gloss: 'Layla : Nous nous promenons souvent ensemble. Mais que fais-tu d’autre pendant ton temps libre, Yusuf ?'
    note: 'La lettre initiale ن (na-) de نتمشى (natamashshā) signifie « nous » : l’arabe n’a donc pas besoin d’un mot séparé pour « nous ». معا (maʿan) signifie « ensemble ».'
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Les loisirs de Yusuf
    gloss: 'Yusuf : J’aime cuisiner, à la maison aussi. Et je fais souvent du sport.'
    note: في البيت أيضا (fī al-bayt ayḍan) ajoute « à la maison aussi ». وأمارس (wa-umāris) joint و (« et ») au verbe et s’écrit en un seul mot.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla est surprise
    gloss: 'Layla : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée à ton travail !'
    note: تطبخ (taṭbukh) est la forme « tu » pour un homme ; à une femme, on dit تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) signifie « toute la journée ».
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf explique
    gloss: 'Yusuf : Oui, mais je trouve cuisiner relaxant. Et toi, qu’est-ce que tu aimes faire ?'
    note: 'أجد (ajid) signifie « je trouve » et مريحا (murīḥan) « relaxant, reposant ». وأنت (wa-anta) joint و à أنت : « et toi ».'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Les loisirs de Layla
    gloss: 'Layla : J’aime lire et j’écoute souvent de la musique.'
    note: 'و relie les deux loisirs : أحب القراءة (uḥibb al-qirāʾa) et وأستمع (wa-astamiʿ, « et j’écoute »). Il s’écrit attaché au mot suivant.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf interroge sur les jeux vidéo
    gloss: 'Yusuf : Est-ce que tu joues aussi aux jeux vidéo ?'
    note: تلعبين (talʿabīn) est la forme de « tu » pour une femme, car Yusuf s’adresse à Layla ; pour un homme, on dit تلعب (talʿab). هل (hal) introduit une question à réponse oui/non.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla répond
    gloss: 'Layla : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: 'أبدا (abadan) signifie jamais et أحيانا (aḥyānan) parfois. Le verbe se met à la forme négative avec لا (lā) : لا ألعب (lā alʿab) signifie je ne joue pas.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Comparer des loisirs
    gloss: Yusuf et moi, nous marchons souvent ensemble. Mais nous avons aussi d’autres loisirs. Yusuf aime cuisiner, chez lui aussi, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Qu’aimes-tu faire pendant ton temps libre ?
    note: Le message de Layla reprend des informations de la leçon précédente et se termine par la question centrale de l’unité, posée au lecteur.
    glosses:
      نتمشى: se promener
      كثيرا: souvent
      معا: ensemble
      أخرى: autre
      يطبخ: cuisine
      يحب: aime
      البيت: la maison (à la maison)
      ويمارس: fait du sport
      أقرأ: lire
      وأستمع: écouter
      الموسيقى: musique
      أرسم: dessiner
      أحيانا: parfois
      ألعب: jouer (aux jeux vidéo)
      أبدا: jamais
      فراغك: ton temps (libre)
      وقت: temps
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf demande ce qu’elle fait ce week-end
    gloss: 'Yusuf : Qu’est-ce que tu fais ce week-end ?'
    note: 'ستفعلين (sa-tafʿalīn) est au futur : la lettre initiale س (sa-) le marque, et la terminaison ين indique une femme. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) signifie le week-end.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla hésite
    gloss: 'Layla : Je ne sais pas encore. J’aime lire, mais j’ai aussi envie de sortir.'
    note: لا أعرف بعد (lā aʿrif baʿd) signifie je ne sais pas encore. أن أخرج (an akhruj) signifie sortir.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf propose un programme
    gloss: 'Yusuf : On se promène ensemble ? Ensuite, je cuisinerai pour nous.'
    note: 'هل نتمشى (hal natamashshā) est la façon habituelle de proposer quelque chose à plusieurs : هل + un verbe à la forme « nous ». لنا (lanā) est ل (pour) + نا (nous), écrit en un seul mot.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla accepte
    gloss: 'Layla : Bonne idée ! J’aime autant marcher que cuisiner.'
    note: 'كليهما (kilayhimā) signifie les deux et se place à la fin, pour renvoyer aux deux activités : المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf confirme
    gloss: 'Yusuf : Parfait. Alors à samedi !'
    note: 'يوم السبت (yawm as-sabt) signifie samedi / le samedi. Le ل de ال ne se prononce pas devant س, une lettre solaire : on dit donc as-sabt.'
