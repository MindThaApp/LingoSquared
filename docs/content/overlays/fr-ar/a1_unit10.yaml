teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: Droite
    gloss: droite (direction)
    note: يمين (yamīn) désigne le côté droit ; اليمين (al-yamīn) signifie « la droite ».
    example_gloss: À droite.
  ar.a1.unit10.lesson01.teach.left:
    title: Gauche
    gloss: gauche (direction)
    note: يسار (yasār) désigne le côté gauche ; اليسار (al-yasār) signifie « la gauche ».
    example_gloss: À gauche.
  ar.a1.unit10.lesson01.teach.forward:
    title: Tout droit
    gloss: tout droit
    note: إلى الأمام (ilā l-amām) signifie littéralement « vers l’avant » ; c’est la façon habituelle de dire tout droit ou en avant.
    example_gloss: La bibliothèque est tout droit.
  ar.a1.unit10.lesson01.teach.to_right:
    title: À droite
    gloss: à droite
    note: إلى (ilā) marque le mouvement vers une direction ou un lieu.
    example_gloss: Le marché est à droite.
  ar.a1.unit10.lesson02.teach.walk:
    title: Marcher
    gloss: marche
    note: امش (imshi) est l’impératif « marche ! » adressé à un homme ; à une femme, on dit امشي (imshī). C’est le verbe habituel pour indiquer un itinéraire à pied.
    example_gloss: Marche tout droit.
  ar.a1.unit10.lesson02.teach.then:
    title: Ensuite
    gloss: alors
    note: ثم (thumma) relie deux étapes d’un itinéraire dans l’ordre.
    example_gloss: Marche tout droit, puis à droite.
  ar.a1.unit10.lesson02.teach.route:
    title: Deux étapes d’itinéraire
    gloss: Marche tout droit, puis à droite
    note: Première étape + ثم + deuxième étape. Le verbe n’est pas répété après ثم.
    example_gloss: 'Layla a dit : Marche tout droit, puis à droite.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Demander où est la bibliothèque
    gloss: Youssef demande où se trouve la bibliothèque.
    note: أين المكتبة؟ a déjà été utilisé pour les lieux.
    example_gloss: 'Youssef a dit : Où est la bibliothèque ?'
  ar.a1.unit10.lesson02.teach.line02:
    title: Indiquer le chemin
    gloss: Layla donne deux étapes simples d’itinéraire.
    note: Layla dit امش parce qu’elle s’adresse à un homme ; à une femme, elle dirait امشي.
    example_gloss: 'Layla a dit : Marche tout droit, puis à droite.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Remercier quelqu’un
    gloss: Youssef dit merci.
    note: شكرا conclut poliment l’échange d’aide.
    example_gloss: 'Youssef a dit : Merci.'
  ar.a1.unit10.lesson02.teach.line04:
    title: Confirmer le lieu
    gloss: Layla dit que la bibliothèque est près du marché.
    note: 'On réutilise ici قرب de l’unité sur les lieux : la bibliothèque est près du marché.'
    example_gloss: 'Layla a dit : La bibliothèque est près du marché.'
