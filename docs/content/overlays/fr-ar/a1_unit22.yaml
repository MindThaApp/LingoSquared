teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: Sentiment
    gloss: sentiment
    note: شعور (shuʿūr) signifie un sentiment.
    example_gloss: C’est un sentiment.
  ar.a1.unit22.lesson01.teach.happy:
    title: Heureux
    gloss: heureux
    note: سعيد (saʿīd) s’emploie pour un homme ; une femme dit أنا سعيدة (anā saʿīda).
    example_gloss: Je suis heureux.
  ar.a1.unit22.lesson01.teach.sad:
    title: Triste
    gloss: triste
    note: حزين (ḥazīn) s’emploie pour un homme ; une femme dit أنا حزينة (anā ḥazīna).
    example_gloss: Je suis triste.
  ar.a1.unit22.lesson01.teach.because:
    title: Parce que
    gloss: parce que
    note: لأن (li-anna) introduit une raison.
    example_gloss: Je suis heureux parce qu’il y a du soleil.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: Comment te sens-tu ?
    gloss: Comment te sens-tu ?
    note: 'كيف تشعر؟ (kayfa tashʿur) demande à un homme comment il se sent ; à une femme, on dit : كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Comment te sens-tu, Youssef ?
  ar.a1.unit22.lesson02.teach.tired:
    title: Fatigué
    gloss: fatigué
    note: متعب (mutʿab) s’emploie pour un homme ; متعبة (mutʿaba) s’emploie pour une femme, donc Layla dit أنا متعبة.
    example_gloss: Je suis fatigué.
  ar.a1.unit22.lesson02.teach.okay:
    title: Ça va
    gloss: bien
    note: بخير (bi-khayr) signifie « bien », littéralement « en bonne (santé) ».
    example_gloss: Tu vas bien ?
  ar.a1.unit22.lesson02.teach.line01:
    title: Demander comment on se sent
    gloss: Layla demande à Youssef comment il se sent.
    note: يا (yā) se place devant le nom de la personne à qui l’on s’adresse.
    example_gloss: 'Layla a dit : Comment te sens-tu, Youssef ?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Sentiment et cause
    gloss: Youssef dit qu’il est heureux parce qu’il y a du soleil.
    note: Cette phrase donne à la fois le sentiment et la cause.
    example_gloss: 'Youssef a dit : Je suis heureux parce qu’il y a du soleil.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Un autre sentiment
    gloss: Layla dit qu’elle est fatiguée parce qu’elle a du travail.
    note: متعبة est au féminin, car c’est Layla qui parle.
    example_gloss: 'Layla a dit : Je suis fatiguée parce que j’ai du travail.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Vérifier que ça va
    gloss: Youssef demande à Layla si elle va bien.
    note: 'هل (hal) introduit une question à laquelle on répond par oui ou non. Youssef s’adresse à Layla, donc أنت se lit anti (à un homme : anta).'
    example_gloss: 'Youssef a dit : Tu vas bien ?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Dire oui
    gloss: Layla répond oui et le remercie.
    note: نعم est la réponse « oui ».
    example_gloss: 'Layla a dit : Oui, merci.'
