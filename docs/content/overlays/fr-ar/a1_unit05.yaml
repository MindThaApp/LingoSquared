teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: L’heure
    gloss: l’heure
    note: الساعة (as-sāʿa) signifie littéralement « l’heure » (et aussi « l’horloge ») ; les réponses sur l’heure commencent par ce mot.
    example_gloss: Il est trois heures.
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: Quelle heure est-il ?
    gloss: Quelle heure est-il ?
    note: كم الساعة؟ demande littéralement « combien est l’heure ? »
    example_gloss: 'Layla a dit : Quelle heure est-il ?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: Trois heures
    gloss: Il est trois heures.
    note: 'الثالثة (ath-thālitha) est l’ordinal féminin « troisième », qui s’accorde avec الساعة, féminin : littéralement « la troisième heure ».'
    example_gloss: 'Layla a dit : Il est trois heures.'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: Cinq heures
    gloss: Il est cinq heures.
    note: الخامسة (al-khāmisa), « la cinquième (heure) ». Ce niveau A1 se limite aux heures pleines.
    example_gloss: 'Layla a dit : Il est cinq heures.'
  ar.a1.unit05.lesson01.teach.sabah:
    title: Le matin
    gloss: du matin
    note: صباحا (ṣabāḥan) permet de préciser qu’il s’agit du matin ; في الصباح dit la même chose.
    example_gloss: Il est cinq heures du matin.
  ar.a1.unit05.lesson01.teach.masaa:
    title: Le soir
    gloss: le soir
    note: مساء (masāʾan) permet de préciser qu’il s’agit du soir ; في المساء dit la même chose.
    example_gloss: Il est cinq heures du soir.
  ar.a1.unit05.lesson02.teach.mata:
    title: Quand
    gloss: quand
    note: متى (matā) demande quand quelque chose a lieu.
    example_gloss: Quand a lieu le cours ?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: Quand a lieu le cours ?
    gloss: Quand a lieu le cours ?
    note: En arabe, on n’exprime pas le verbe « être » dans cette question simple.
    example_gloss: 'Yusuf a dit : Quand a lieu le cours ?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: Le cours est à cinq heures
    gloss: Le cours est à cinq heures.
    note: الساعة peut aussi introduire une heure prévue.
    example_gloss: 'Layla a dit : Le cours est à cinq heures.'
  ar.a1.unit05.lesson02.teach.line01:
    title: Demander l’heure
    gloss: Yusuf demande l’heure.
    note: كم الساعة؟ demande l’heure actuelle.
    example_gloss: 'Yusuf a dit : Quelle heure est-il ?'
  ar.a1.unit05.lesson02.teach.line02:
    title: Dire l’heure
    gloss: Layla dit qu’il est trois heures.
    note: La réponse commence par الساعة.
    example_gloss: 'Layla a dit : Il est trois heures.'
  ar.a1.unit05.lesson02.teach.line03:
    title: Demander quand
    gloss: Yusuf demande quand a lieu le cours.
    note: و relie cette question à l’échange précédent.
    example_gloss: 'Yusuf a dit : Et quand a lieu le cours ?'
  ar.a1.unit05.lesson02.teach.line04:
    title: Donner l’heure prévue
    gloss: Layla dit que le cours est à cinq heures.
    note: C’est la réponse sur l’horaire.
    example_gloss: 'Layla a dit : Le cours est à cinq heures.'
