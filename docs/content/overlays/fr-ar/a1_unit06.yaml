teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: La famille
    gloss: famille
    note: عائلة (ʿāʾila) est le mot général pour « famille ». Dans l’exemple, هذه est la forme féminine de هذا (ceci, ce), employée parce que عائلة est féminin.
    example_gloss: C’est une famille.
  ar.a1.unit06.lesson01.teach.father:
    title: Père
    gloss: père
    note: أب (ab) signifie « père ».
    example_gloss: J’ai un père.
  ar.a1.unit06.lesson01.teach.mother:
    title: Mère
    gloss: mère
    note: أم (umm) signifie « mère ».
    example_gloss: J’ai une mère.
  ar.a1.unit06.lesson01.teach.brother:
    title: Frère
    gloss: frère
    note: أخ (akh) signifie « frère ».
    example_gloss: J’ai un frère.
  ar.a1.unit06.lesson01.teach.sister:
    title: Sœur
    gloss: sœur
    note: أخت (ukht) signifie « sœur ».
    example_gloss: J’ai un frère et une sœur.
  ar.a1.unit06.lesson01.teach.i_have:
    title: J’ai
    gloss: j’ai
    note: عندي (ʿindī, littéralement « chez moi ») est la façon simple, au niveau A1, de dire qu’on possède quelque chose ; لدي (ladayya) en est un équivalent plus soutenu.
    example_gloss: J’ai une sœur.
  ar.a1.unit06.lesson02.teach.in_family:
    title: Dans ta famille
    gloss: dans ta famille
    note: 'Ici, من se lit man, « qui », et non min, « de », comme dans من أين أنت؟ : les deux s’écrivent de la même façon. عائلتك signifie « ta famille » : ʿāʾilatuka pour un homme, ʿāʾilatuki pour une femme.'
    example_gloss: Qui y a-t-il dans ta famille ?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Elle s’appelle Nour
    gloss: elle s’appelle Nour
    note: اسمها signifie « son nom (à elle) ».
    example_gloss: 'Youssef a dit : Elle s’appelle Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Poser une question sur la famille
    gloss: Layla demande qui compose la famille de Youssef.
    note: Ici, من (man) signifie « qui ». يا يوسف interpelle Youssef par son prénom.
    example_gloss: 'Layla a dit : Qui y a-t-il dans ta famille, Youssef ?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Décrire sa famille
    gloss: Youssef dit qu’il a un père, une mère et une sœur.
    note: و relie les membres de la famille.
    example_gloss: 'Youssef a dit : J’ai un père, une mère et une sœur.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Demander le prénom de la sœur
    gloss: Layla demande comment s’appelle sa sœur.
    note: 'أختك signifie « ta sœur » : ukhtuka pour un homme, ukhtuki pour une femme. Ici, Layla s’adresse à Youssef, donc ukhtuka.'
    example_gloss: 'Layla a dit : Comment s’appelle ta sœur ?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Donner son prénom
    gloss: Youssef dit qu’elle s’appelle Nour.
    note: 'La terminaison ـها signifie « son/sa (à elle) » : اسمها (ismuhā), « son nom ».'
    example_gloss: 'Youssef a dit : Elle s’appelle Nour.'
