    title: Un texte sur l’incendie
    gloss: 'Il y a un incendie au café des langues, dans la bibliothèque. L’employé dit : Allez à la sortie de secours ! Nour a besoin d’aide. Layla est avec Nour. Yusuf appelle les pompiers. Tout le monde est dehors. C’est bien !'
    note: 'Un court récapitulatif au présent de la scène de l’incendie. Observe les verbes : الموظف يقول (l’employé dit) commence par ي pour un homme, et نور تحتاج (Nour a besoin) commence par ت pour une femme.'
