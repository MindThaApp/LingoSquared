    title: Layla confirme le projet
    gloss: 'Layla : Je vois le message. On fait du sport samedi à dix heures au parc ?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf confirme la météo
    gloss: 'Yusuf : Oui, et il fera beau samedi !'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: Le projet de Karim
    gloss: 'Karim : Alors je courrai. Après, je jouerai aussi au football.'
    note: 'سأركض (sa-arkuḍ) signifie je courrai : س marque le futur. بعد ذلك (baʿda dhālik) signifie après cela.'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Le projet de Sara
    gloss: 'Sara : Je préfère nager, mais je viendrai aussi au parc.'
    note: أفضل (ufaḍḍil) signifie je préfère. لكنني (lākinnanī) signifie mais je, et سآتي (sa-ātī) signifie je viendrai.
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla conclut la conversation
    gloss: 'Layla : Super ! À samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
