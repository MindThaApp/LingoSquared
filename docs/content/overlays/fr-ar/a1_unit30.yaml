  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Message : envoyer et lire'
    gloss: رسالة (risāla) désigne un message que l’on envoie (أرسل رسالة, ursil risāla) ou que l’on lit (أقرأ رسالة, aqraʾ risāla).
    note: Relie le nouveau mot au texte sur les prévisions météo et aux messages que l’on envoie et que l’on lit.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla envoie un message via l’application
    gloss: Layla envoie un message via l’application.
    note: 'ترسل (tursil) signifie elle envoie : la lettre initiale ت (ta-) marque le « elle ». عبر (ʿabra) signifie par ou via.'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf lit le message
    gloss: Yusuf lit le message.
  ar.a1.unit30.lesson03.teach.albhth_an:
