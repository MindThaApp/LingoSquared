    gloss: chercher
    example_gloss: Je consulte les prévisions météo.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Un verbe avec عن
    gloss: 'Le verbe أبحث (abḥath) est suivi de عن (ʿan) : أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). En revanche, أستخدم (astakhdim) prend son complément directement : أستخدم هاتفي.'
    note: 'عن (ʿan) signifie à propos de ou pour. Chaque verbe arabe a sa propre préposition : apprends-les ensemble.'
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim cherche les prévisions météo
    gloss: Karim cherche les prévisions météo.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Ensuite, il va courir
    gloss: Ensuite, il va courir.
    note: 'ثم (thumma) signifie puis et c’est un mot à part, contrairement à و. يذهب للركض (yadhhab li-r-rakḍ) signifie il va courir : ل + الركض devient للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla fait une proposition
    gloss: 'Layla : On fait du sport samedi à dix heures ?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf accepte
    gloss: 'Yusuf : Bonne idée ! Je vais chercher les prévisions météo.'
    note: 'فكرة جيدة (fikra jayyida) : l’adjectif جيدة se termine par ة comme le nom, car tous deux sont féminins. سأبحث (sa-abḥath) est le futur : س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf vérifie la météo
    gloss: 'Yusuf : Il fera beau samedi !'
    note: الجو مشمس (al-jaww mushmis) signifie il fait beau (le temps est ensoleillé), sans mot pour « est ». مشمس est au masculin pour s’accorder avec الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim voit le message
    gloss: 'Karim : Je vois le message. À samedi !'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + un jour
    gloss: 'Tu connais إلى اللقاء (ilā al-liqāʾ, au revoir). Tu peux ajouter un jour : إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt, à samedi), إلى اللقاء غدا (ilā al-liqāʾ ghadan, à demain).'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Qui utilise quoi ?
    gloss: Layla appelle Yusuf tous les jours. Elle utilise son téléphone, pas une application. Yusuf n’a pas d’ordinateur à la maison, mais il utilise internet sur son téléphone. Karim cherche les prévisions météo chaque matin. Puis il va courir. Sara envoie souvent un message à Layla. Et toi, utilises-tu aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
    glosses:
      تتصل: appelle
      كل: tous les
      يوم: jour
      تستخدم: utilise
      هاتفها: téléphone
      تطبيقا: application
      حاسوب: ordinateur
      البيت: à la maison
      الإنترنت: Internet
      يبحث: consulte
      صباح: matin
      توقعات: prévisions (prévisions météo)
      يذهب: va
      للركض: pour courir
      ترسل: envoie
      كثيرا: souvent
      رسالة: message
      تستعمل: utilises
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim cherche les prévisions chaque matin
    gloss: Karim cherche les prévisions météo chaque matin.
