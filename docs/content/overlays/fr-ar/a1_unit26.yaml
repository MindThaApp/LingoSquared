course:
  title: Arabe A1
  description: 'Arabe pour débutants pour décrire l’apparence de base d’une personne : taille et âge, couleur des cheveux et des yeux, la question كيف تبدو؟ (kayfa tabdū ?) et la comparaison de deux personnes avec أطول من (aṭwal min).'
units:
  ar.a1.unit26.appearance:
    title: Décrire l’apparence physique
lessons:
  ar.a1.unit26.lesson01.twyl_wqsyr_wkbyr_fy:
    title: Grand, petit, âgé et jeune
  ar.a1.unit26.lesson02.wsf_alshar:
    title: Décrire les cheveux
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: Les yeux et demander à quoi ressemble quelqu’un
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: Layla décrit Nour
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
    title: Comparaison entre Karim et Sara
  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: Yusuf reconnaît Nour
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Grand et petit
    gloss: grand / petit
    note: 'طويل (ṭawīl) signifie grand et قصير (qaṣīr) petit. Pour une femme, ils prennent ة : طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara est grande.
    - Karim est petit.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: كبير في السن (kabīr fī as-sinn) et صغير في السن (ṣaghīr fī as-sinn) donnent une impression générale de l’âge, pas un nombre d’années précis.
    example_gloss:
    - Grand-père est âgé.
    - Youssef est jeune.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'L’âge : un nombre ou une impression'
    gloss: كم عمرك؟ (kam ʿumruka ?) demande un nombre d’années, alors que كبير في السن (kabīr fī as-sinn) donne une impression générale sans chiffre, comme dans الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Utilise كم عمرك؟ pour demander l’âge exact de quelqu’un. Ici, كبير في السن décrit seulement l’âge que paraît une personne.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara est grande et Karim est petit
    gloss: Sara est grande et Karim est petit.
    note: 'و (wa-) relie les deux phrases et s’écrit attaché au mot suivant : وكريم (wa-karīm). Les adjectifs s’accordent : سارة طويلة est féminin et كريم قصير est masculin.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Les cheveux
    gloss: les cheveux
    note: 'الشعر (ash-shaʿr) signifie les cheveux. ش est une lettre solaire, donc le ل de ال ne se prononce pas : ash-shaʿr.'
    example_gloss: Youssef a les cheveux courts et noirs.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'أشقر (ashqar), بني (bunnī) et رمادي (ramādī) décrivent les cheveux et se placent après le nom : شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla a les cheveux blonds.
    - Karim a les cheveux châtains.
    - Grand-père a les cheveux gris.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: 'طويل (ṭawīl) et قصير (qaṣīr) décrivent aussi les cheveux : شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Ils suivent شعر, qui est masculin.'
    example_gloss:
    - Sara a les cheveux longs.
    - Karim a les cheveux courts.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Les adjectifs se placent après le nom
    gloss: 'En arabe, l’adjectif se place après le nom et s’accorde avec lui : شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) est masculin, donc ses adjectifs sont aussi au masculin. Avec un nom indéfini, aucun des deux mots ne prend ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Les cheveux et ses cheveux
    gloss: شعر (shaʿr) signifie cheveux. Ajoute le pronom ها (hā, son/sa à elle) pour obtenir شعرها (shaʿruhā, ses cheveux).
    note: 'La terminaison ها indique le possesseur : شعرها (ses cheveux), اسمها (son nom), عيناها (ses yeux). Elle s’écrit attachée au mot.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Youssef a les cheveux courts et noirs
    gloss: Youssef a les cheveux courts et noirs.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad) : ل (li-) devant un nom propre exprime l’idée d’avoir, et il s’attache au nom.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla a de longs cheveux blonds
    gloss: Layla a de longs cheveux blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Les yeux
    gloss: les yeux
    note: 'العينان (al-ʿaynān) signifie les yeux. C’est un nom au duel : l’arabe a une terminaison spéciale ان pour exactement deux.'
    example_gloss: Youssef a les yeux marron.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: 'أزرق (azraq) bleu, بني (bunnī) marron et أخضر (akhḍar) vert sont les formes masculines. Avec عينان, on utilise les formes du duel : زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla a les yeux bleus.
    - Karim a les yeux marron.
    - Sara a les yeux verts.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Yeux au duel, adjectif au duel
    gloss: 'عينان (ʿaynān) est au duel, donc son adjectif l’est aussi : عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: Au duel, la terminaison ان s’ajoute au nom et à l’adjectif. L’adjectif est aussi au féminin, car عين est un nom féminin.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Comment est Layla physiquement ?
    gloss: Comment est Layla physiquement ?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā ?) demande à quoi ressemble Layla. تبدو (tabdū) est au féminin car Layla est une femme ; pour un homme, on dit يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla a de longs cheveux blonds et les yeux bleus
    gloss: Layla a de longs cheveux blonds et les yeux bleus.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān) : ل + un nom propre exprime l’idée d’avoir, et و relie les cheveux et les yeux.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla présente Nour
    gloss: 'Layla : Une nouvelle fille va venir au café des langues. Elle s’appelle Nour.'
    note: 'ستأتي (sa-taʾtī) signifie elle viendra : س (sa-) marque le futur et ت (ta-) signifie elle. اسمها (ismuhā) signifie son nom.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Youssef demande à quoi elle ressemble
    gloss: 'Youssef : D’accord ! Comment est-elle ?'
    note: 'كيف تبدو؟ (kayfa tabdū ?) n’a pas de nom cette fois : le verbe تبدو signifie déjà elle paraît.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla décrit la taille et les cheveux de Nour
    gloss: 'Layla : Elle est petite et elle a les cheveux courts et blonds.'
    note: قصيرة (qaṣīra) est au féminin car Nour est une femme, mais شعر قصير أشقر reste au masculin car شعر est un nom masculin.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Youssef interroge sur ses yeux
    gloss: 'Youssef : Et ses yeux ?'
    note: 'وعيناها (wa-ʿaynāhā) signifie et ses yeux : و (wa-) est attaché au nom, et ها (hā) à la fin signifie son/ses (à elle).'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla décrit les yeux de Nour
    gloss: 'Layla : Elle a les yeux verts.'
    note: 'لها (lahā) signifie elle a : ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) est un nom au duel avec un adjectif au duel.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Youssef la reconnaîtra
    gloss: 'Youssef : Merci ! Alors je la reconnaîtrai.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) signifie je la reconnaîtrai : س (sa-) marque le futur et ها dans عليها signifie elle.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Comparer Karim et Sara
    gloss: Karim et Sara sont frère et sœur, mais ils ne se ressemblent pas physiquement. Karim est petit et a les cheveux courts et châtains et les yeux marron. Sara est plus grande que Karim et a de longs cheveux châtains et les yeux verts. Et toi, comment es-tu physiquement ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      أخ: frère
      أخت: sœur
      تبدو: apparence
      مختلفان: différent
      القامة: de petite taille
      قصير: petit
      بني: châtain
      شعر: cheveux
      بنيتان: châtain
      وعينان: yeux
      أطول: plus grand
      طويل: long
      خضراوان: vert
      المظهر: apparence (physique)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Comparer avec أفعل
    gloss: 'Pour comparer, utilise la forme أفعل (afʿal) + من (min) : سارة أطول من كريم (sāra aṭwal min karīm), Sara est plus grande que Karim.'
    note: طويل (ṭawīl) devient أطول (aṭwal) au comparatif, et من (min) signifie que. La forme ne change pas pour une femme.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara a les cheveux plus longs que Karim
    gloss: Sara a les cheveux plus longs que Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm) : أطول reste au masculin car شعر est un nom masculin.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: 'لدي (ladayya) signifie j’ai ; l’arabe n’a pas de verbe avoir. Les adjectifs suivent le nom : شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Youssef repère Nour
    gloss: 'Youssef : Regarde, c’est Nour ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: انظري (unẓurī) est l’impératif adressé à une femme, car Youssef parle à Layla ; à un homme, on dit انظر (unẓur). هذه (hādhihi) signifie celle-ci, pour un nom féminin.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla confirme
    gloss: 'Layla : Oui, c’est Nour !'
    note: Une confirmation courte et naturelle.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour salue Youssef
    gloss: 'Nour : Bonjour, tu es Youssef ?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf ?) est une question fermée : هل (hal) + une phrase sans verbe être.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Youssef salue Nour à son tour
    gloss: 'Youssef : Oui ! Enchanté de te rencontrer, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) est la formule polie d’une première rencontre. ب (bi-) est attaché à معرفتك, et le ك final signifie te/ton.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour répond à la salutation
    gloss: 'Nour : Enchantée de te rencontrer aussi !'
    note: 'Fin du dialogue : Youssef a bien reconnu Nour grâce à la description de Layla.'
