teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: L’arabe s’écrit de droite à gauche
    gloss: L’arabe s’écrit de droite à gauche.
    note: Lis l’arabe en partant du bord droit vers la gauche.
  ar.a1.unit01.lesson01.teach.mim:
    title: La lettre م
    gloss: m
    note: م représente le son m et change de forme selon sa position dans le mot.
  ar.a1.unit01.lesson01.teach.ra:
    title: La lettre ر
    gloss: r
    note: ر représente un r roulé et ne se lie pas à la lettre qui la suit.
  ar.a1.unit01.lesson01.teach.ha:
    title: La lettre ح
    gloss: ḥ
    note: ح est un h soufflé, produit au fond de la gorge, très différent du h muet du français.
  ar.a1.unit01.lesson01.teach.ba:
    title: La lettre ب
    gloss: b
    note: ب représente le son b et se lie aux lettres voisines.
  ar.a1.unit01.lesson01.teach.alef:
    title: La lettre ا
    gloss: ā / a
    note: ا marque une voyelle longue ā et ne se lie pas à la lettre suivante.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Construis مرحبا
    gloss: bonjour
    note: مرحبا se lit marḥaban. Les voyelles brèves sont normalement omises à l’écrit en arabe.
    example_gloss: Bonjour ! Je suis Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Bonjour
    gloss: bonjour
    note: مرحبا est une salutation chaleureuse et polyvalente, adaptée à presque toutes les situations.
    example_gloss: Salut, comment vas-tu ?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Bonjour (le matin)
    gloss: bonjour
    note: صباح الخير se lit ṣabāḥ al-khayr, littéralement « matin de bien ».
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Bon après-midi ou bonsoir
    gloss: bon après-midi / bonsoir
    note: مساء الخير se lit masāʾ al-khayr et s’emploie de la fin d’après-midi jusqu’au soir.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Au revoir
    gloss: au revoir
    note: 'مع السلامة se lit maʿa as-salāma, littéralement « avec la sécurité » : c’est la formule d’au revoir courante.'
    example_gloss: Merci, au revoir !
  ar.a1.unit01.lesson02.teach.shukran:
    title: Merci
    gloss: merci
    note: شكرا se lit shukran et s’emploie dans tous les registres.
    example_gloss: Merci beaucoup.
  ar.a1.unit01.lesson02.teach.afwan:
    title: De rien
    gloss: avec plaisir
    note: عفوا (ʿafwan) est la réponse habituelle à شكرا ; dans un autre contexte, cela peut aussi signifier « excusez-moi ».
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Bonne nuit
    gloss: bonne nuit
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) se dit en se quittant pour la nuit ou en allant se coucher, pas pour saluer à l’arrivée. تصبح s’adresse à un homme ; à une femme, on dit تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Bienvenue
    gloss: bienvenue
    note: أهلا وسهلا (ahlan wa sahlan) sert à accueillir un invité ou à saluer chaleureusement quelqu’un à son arrivée.
    example_gloss: Bienvenue ! Sois le bienvenu.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: À bientôt
    gloss: à bientôt / jusqu’à notre prochaine rencontre
    note: إلى اللقاء (ilā al-liqāʾ) est une formule d’au revoir soignée et neutre.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Bonjour, la réponse
    gloss: bonjour [réponse]
    note: صباح النور (ṣabāḥ an-nūr, « matin de lumière ») est la réponse habituelle à صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Bonsoir, la réponse
    gloss: bonsoir [réponse]
    note: مساء النور (masāʾ an-nūr) est la réponse habituelle à مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Bonne journée
    gloss: bonne journée
    note: يوما سعيدا (yawman saʿīdan) est un vœu chaleureux pour terminer une conversation.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Comment vas-tu ?
    gloss: Comment allez-vous ?
    note: كيف حالك؟ (kayfa ḥāluk) est la manière habituelle de demander comment va quelqu’un ; sans voyelles, la forme écrite convient à tous les interlocuteurs.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: « Tu » au masculin et au féminin
    gloss: tu (m.) / tu (f.)
    note: À l’oral, l’arabe distingue أنتَ (anta, à un homme) de أنتِ (anti, à une femme), et de même حالَك de حالِك. Sans les signes vocaliques indiqués ici, les formes écrites utilisées dans ce cours sont identiques pour les deux.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Bien
    gloss: bien
    note: بخير (bikhayr) est la réponse positive habituelle à كيف حالك؟
    example_gloss: Je vais bien aujourd’hui.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Dieu merci
    gloss: Dieu merci / louange à Dieu
    note: 'الحمد لله (al-ḥamdu lillāh) suit très souvent بخير dans une réponse, quelle que soit la pratique religieuse de la personne : c’est une formule de conversation ordinaire pour conclure, un peu comme « heureusement » ou « ça va, tant mieux » en français.'
    example_gloss: Bien, Dieu merci.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: Et toi ?
    gloss: Et vous ?
    note: وأنت؟ (wa anta à un homme, wa anti à une femme) renvoie la question ; l’orthographe sans voyelles est la même pour les deux.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Excellent
    gloss: excellent / super
    note: ممتاز (mumtāz) est une version plus enthousiaste de بخير.
    example_gloss: Je vais super bien aujourd’hui !
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Pas mal
    gloss: pas mal
    note: لا بأس (lā baʾs) est une réponse modérée naturelle, pas une plainte.
