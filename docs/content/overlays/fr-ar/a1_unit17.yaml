teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Douleur
    gloss: douleur
    note: ألم (alam) signifie « douleur » ; عندي ألم (ʿindī alam) veut dire « j’ai (une) douleur ».
    example_gloss: J’ai mal.
  ar.a1.unit17.lesson01.teach.head:
    title: Tête
    gloss: la tête
    note: الرأس (ar-raʾs) est la tête. L’arabe dit عندي ألم في الرأس, littéralement « j’ai une douleur dans la tête », alors que le français dit plutôt « j’ai mal à la tête ».
    example_gloss: J’ai mal à la tête.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Estomac
    gloss: le ventre
    note: البطن (al-baṭn) désigne le ventre ou l’estomac.
    example_gloss: J’ai mal au ventre.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Mal à la tête
    gloss: J’ai mal à la tête
    note: عندي ألم, littéralement « chez moi (il y a) une douleur », est la façon de dire « j’ai mal » ; في + la partie du corps indique où.
    example_gloss: 'Layla a dit : J’ai mal à la tête.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Quel est le problème ?
    gloss: Quel est le problème ?
    note: ما (mā) signifie « que / quel » ; المشكلة (al-mushkila) signifie « le problème ».
    example_gloss: Quel est le problème, Layla ?
  ar.a1.unit17.lesson02.teach.drink:
    title: Bois de l’eau
    gloss: bois de l’eau
    note: اشربي (ishrabī) est l’impératif « bois ! » adressé à une femme, ici Layla ; pour un homme, on dit اشرب (ishrab).
    example_gloss: 'Youssef a dit : Bois de l’eau.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Repos
    gloss: repose-toi
    note: استريحي (istarīḥī) est l’impératif « repose-toi ! » adressé à une femme ; pour un homme, on dit استرح (istariḥ).
    example_gloss: Repose-toi aujourd’hui.
  ar.a1.unit17.lesson02.teach.need_help:
    title: J’ai besoin d’aide
    gloss: J’ai besoin d’aide
    note: أحتاج (aḥtāj) signifie « j’ai besoin » et مساعدة (musāʿada) « aide ». Tu rencontreras aussi أحتاج إلى مساعدة, avec إلى ; les deux formes sont correctes.
    example_gloss: J’ai mal. J’ai besoin d’aide.
  ar.a1.unit17.lesson02.teach.line01:
    title: Demander quel est le problème
    gloss: Youssef demande à Layla quel est le problème.
    note: يا ليلى interpelle Layla par son prénom.
    example_gloss: 'Youssef a dit : Quel est le problème, Layla ?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Dire le symptôme
    gloss: Layla dit qu’elle a mal à la tête.
    note: Le symptôme est énoncé directement.
    example_gloss: 'Layla a dit : J’ai mal à la tête.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Un conseil simple
    gloss: Youssef dit à Layla de boire de l’eau et de se reposer.
    note: 'Les deux impératifs sont au féminin parce que Youssef s’adresse à Layla ; و (wa, « et ») s’écrit attaché au mot suivant : واستريحي.'
    example_gloss: 'Youssef a dit : Bois de l’eau et repose-toi.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Merci
    gloss: Layla dit merci.
    note: شكرا conclut ce court échange.
    example_gloss: 'Layla a dit : Merci.'
