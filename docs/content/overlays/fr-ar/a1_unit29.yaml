  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: Le verbe change selon la personne
    gloss: 'Le verbe change selon la personne : أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī), يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi).'
    note: La lettre initiale أ (a-) marque « je » et ي (ya-) marque « il ». La terminaison ي de عملي signifie « mon », et la terminaison ه de عمله signifie « son ».
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: Youssef répond
    gloss: 'Youssef : Alors je prends le train, avec Layla.'
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Qui se déplace comment ?
    gloss: Layla voyage en train jusqu’à son travail tous les jours. Youssef va généralement à vélo, mais quand il pleut, il prend aussi le train. Karim préfère conduire la voiture. Sara habite près de son travail et y va à pied. Et toi, comment vas-tu au travail ?
    note: Les verbes des femmes (تسافر, تسكن, تمشي) commencent par ت (ta-), et ceux des hommes (يركب, يذهب, يقود, يفضل) commencent par ي (ya-).
    glosses:
      تسافر: voyage
      كل: tous les
      يوم: jour
      بالقطار: en train
      عملها: travailler
      يركب: fait du vélo
      غالبا: habituellement
      أمطرت: pleut
      يذهب: prend
      يقود: conduit
      يفضل: préfère
      السيارة: voiture
      تسكن: habite
      قريبا: tout près
      وتمشي: marche
      تذهب: voyager
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: Sara habite près et va à pied à son travail
    gloss: Sara habite près de son travail et y va à pied.
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
    title: Layla propose
