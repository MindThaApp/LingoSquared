teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Un
    gloss: un
    note: واحد (wāḥid) s’emploie aussi seul, sans nom, pour répondre à « combien ? ».
    example_gloss: J’ai un livre.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Deux
    gloss: deux
    note: اثنان (ithnān) est la forme autonome, celle que l’on cite, de « deux ».
    example_gloss: J’ai deux frères.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Trois
    gloss: trois
    note: ثلاثة (thalātha) est la forme autonome, celle que l’on cite, de « trois ».
    example_gloss: Un, deux, trois.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Quatre
    gloss: quatre
    note: أربعة (arbaʿa) est la forme autonome, celle que l’on cite, de « quatre ».
    example_gloss: J’ai quatre livres.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Cinq
    gloss: cinq
    note: خمسة (khamsa) est la forme autonome, celle que l’on cite, de « cinq ».
    example_gloss: J’ai cinq livres.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Six
    gloss: six
    note: ستة (sitta) est la forme autonome, celle que l’on cite, de « six ».
    example_gloss: J’ai six livres.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Sept
    gloss: sept
    note: سبعة (sabʿa) est la forme autonome, celle que l’on cite, de « sept ».
    example_gloss: J’ai sept livres.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Huit
    gloss: huit
    note: ثمانية (thamāniya) est la forme autonome, celle que l’on cite, de « huit ».
    example_gloss: J’ai huit livres.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Neuf
    gloss: neuf
    note: تسعة (tisʿa) est la forme autonome, celle que l’on cite, de « neuf ».
    example_gloss: J’ai neuf dirhams.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Dix
    gloss: dix
    note: عشرة (ʿashara) est la forme autonome, celle que l’on cite, de « dix ».
    example_gloss: J’ai dix dinars.
  ar.a1.unit03.lesson03.teach.kam:
    title: Combien ça coûte ?
    gloss: Combien ça coûte ?
    note: كم هذا؟ (kam hādhā) est une façon simple de demander un prix ; بكم هذا؟ (bi-kam hādhā, « à combien est-ce ? ») est également très courant.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Numéro
    gloss: numéro
    note: رقم (raqam) est le mot général pour « numéro », par exemple un numéro de téléphone.
    example_gloss: Mon numéro est le un.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Demander le prix
    gloss: Yusuf demande combien coûte quelque chose.
    note: كم هذا؟ ouvre l’échange.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Donner le prix
    gloss: Layla dit que ça coûte cinq.
    note: بخمسة accroche directement la préposition بـ (« pour », « à ») au nombre.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Demander pour un autre article
    gloss: Yusuf montre autre chose.
    note: وهذا؟ raccourcit la question en reprenant le contexte précédent.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Donner le deuxième prix
    gloss: Layla dit que ça coûte dix.
    note: بعشرة suit le même modèle que بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Dire merci
    gloss: Yusuf la remercie.
    note: شكرا, vu dans l’unité sur les salutations, conclut l’échange.
