  ar.a1.unit11.lesson01.teach.every_day:
    title: Chaque jour
    gloss: chaque jour
    note: كل يوم (kull yawm) vient souvent après le verbe (أدرس كل يوم) mais peut aussi ouvrir la phrase (كل يوم أدرس).
    example_gloss: J’étudie chaque jour.
  ar.a1.unit11.lesson01.teach.wake:
    title: Je me réveille
    gloss: je me réveille
    note: أستيقظ (astayqiẓ) signifie « je me réveille » ; le أ initial marque « je » aux verbes du présent. السابعة (as-sābiʿa) correspond à sept dans les heures.
    example_gloss: Je me réveille à sept heures.
  ar.a1.unit11.lesson01.teach.study:
    title: J’étudie
    gloss: j’étudie
    note: أدرس (adrus) signifie « j’étudie » ; il partage sa racine avec درس (leçon). التاسعة (at-tāsiʿa) correspond à neuf dans les heures.
    example_gloss: J’étudie à neuf heures.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Je dors
    gloss: je dors / je me couche
    note: أنام (anām) signifie « je dors » ; avec une heure, il signifie « je me couche ». العاشرة (al-ʿāshira) correspond à dix dans les heures.
    example_gloss: Je dors à dix heures.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Que fais-tu chaque jour ?
    gloss: Que fais-tu chaque jour ?
    note: ماذا (mādhā) signifie « que », et تفعل (tafʿal) « tu fais », dit à un homme ; à une femme, on dit تفعلين (tafʿalīn).
    example_gloss: 'Layla a dit : Que fais-tu chaque jour ?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Trois phrases de routine
    gloss: Je me réveille à sept heures. J’étudie à neuf heures. Je dors à dix heures.
    note: Chaque phrase se compose d’un verbe + في الساعة + l’heure ; ensemble, elles décrivent toute une journée.
    example_gloss: Tous les jours, je me réveille à sept heures. J’étudie à neuf heures. Je dors à dix heures.
  ar.a1.unit11.lesson02.teach.line01:
    title: Poser une question sur la routine
    gloss: Layla demande à Youssef ce qu’il fait tous les jours.
    note: 'Layla dit تفعل parce qu’elle s’adresse à un homme ; à une femme, on dit : ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla a dit : Que fais-tu tous les jours ?'
  ar.a1.unit11.lesson02.teach.line02:
    title: L’heure du réveil
    gloss: Youssef dit qu’il se réveille à sept heures.
    note: On met في الساعة avant l’heure.
    example_gloss: 'Youssef a dit : Je me réveille à sept heures.'
  ar.a1.unit11.lesson02.teach.line03:
    title: L’heure d’étudier
    gloss: Youssef dit qu’il étudie à neuf heures.
    note: Le même schéma pour l’heure s’emploie avec أدرس.
    example_gloss: 'Youssef a dit : J’étudie à neuf heures.'
  ar.a1.unit11.lesson02.teach.line04:
    title: L’heure du coucher
    gloss: Youssef dit qu’il se couche à dix heures.
    note: La dernière activité de sa journée suit le même schéma pour l’heure, avec أنام.
    example_gloss: 'Youssef a dit : Je dors à dix heures.'
