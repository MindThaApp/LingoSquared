    gloss: Youssef joue souvent au football.
    note: 'يلعب (yalʿab) signifie « il joue » : la lettre initiale ي (ya-) marque « il ». كثيرا (kathīran) signifie « souvent ».'
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Deux façons de parler de sport
    gloss: أمارس الرياضة (umāris ar-riyāḍa) parle du sport en général, tandis que أمارس اليوغا (umāris al-yūghā) nomme le sport précis. Les deux sont corrects.
    note: رياضة (riyāḍa) est un nom féminin, et اليوغا (al-yūghā) est un nom de sport avec ال.
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
