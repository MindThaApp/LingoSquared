    title: Le verbe change selon la personne
    gloss: 'Le verbe change selon la personne : أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'La première lettre du verbe indique qui fait l’action : أ (a-) est « je », ي (ya-) est « il » et ت (ta-) est « tu » ou « elle ».'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Réaction de Youssef
    gloss: 'Youssef : Comme c’est bien, j’y joue souvent au football.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla et Sara parlent de sport
    gloss: Layla fait du yoga deux fois par semaine. Elle aime bouger calmement. Sara ne fait pas de yoga, mais elle aime la natation. Sara nage souvent, presque chaque semaine. Quel sport pratiques-tu ?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) et سارة تسبح (sāra tasbaḥ) emploient des verbes qui commencent par ت (ta-) parce que les deux sont des femmes. لا devant un verbe le met à la forme négative.
    glosses:
      تمارس: fait
      مرتين: deux fois
      الأسبوع: semaine
      اليوغا: yoga
      تحب: adore
      بهدوء: tranquillement
      تتحرك: bouger
      السباحة: la natation
      تسبح: nage
      كثيرا: souvent
      تقريبا: presque
