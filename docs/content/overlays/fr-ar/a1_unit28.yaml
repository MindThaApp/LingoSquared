    title: Je joue au football
    gloss: Je joue au football.
    note: 'ألعب (alʿab) est le verbe des sports de balle : ألعب كرة القدم (alʿab kurat al-qadam). Littéralement, كرة القدم signifie « la balle du pied ».'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Les verbes du sport : أمارس et ألعب'
    gloss: 'Dis أمارس (umāris, je pratique) devant la plupart des sports : أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Pour les sports de balle, dis ألعب (alʿab, je joue) : ألعب كرة القدم.'
    note: 'أمارس (umāris) convient à la plupart des sports, mais les sports de balle prennent ألعب (alʿab) : apprends donc le verbe avec le sport.'
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Fois par semaine
    gloss: fois par semaine
    example_gloss: Je fais du yoga deux fois par semaine.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Fois par semaine
    gloss: كثيرا (kathīran) et كل يوم (kull yawm) sont généraux ; مرتين في الأسبوع (marratayn fī al-usbūʿ) dit exactement la fréquence. مرتين est le duel de مرة (marra, fois).
    note: Cette expression enrichit le vocabulaire de la fréquence déjà vu dans l’unité sur les loisirs.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
