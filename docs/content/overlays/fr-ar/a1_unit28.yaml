  ar.a1.unit28.lesson06.teach.lyla_hl_nmars:
    title: Layla fait une proposition
    gloss: 'Layla : Et si on faisait du sport ensemble ?'
  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: Proposer quelque chose ensemble
    gloss: 'Pour proposer quelque chose ensemble, emploie هل (hal) + un verbe à la forme « nous » : هل نتمشى؟ (hal natamashshā ?) et هل نمارس الرياضة؟ (hal numāris ar-riyāḍa ?).'
    note: Cette phrase reprend exactement la construction servant à proposer une activité, vue dans l’unité sur les projets.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: Sara accepte
    gloss: 'Sara : Oui, super ! J’adore nager.'
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
