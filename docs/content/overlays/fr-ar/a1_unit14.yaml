teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: J’aime
    gloss: j’aime
    note: 'أحب (uḥibbu) signifie « j’aime ». L’arabe emploie ال (l’article défini) pour les choses en général, comme le français : « J’aime le café » se dit أحب القهوة, littéralement « j’aime le café ».'
    example_gloss: J’aime le café.
  ar.a1.unit14.lesson01.teach.tea:
    title: Le thé
    gloss: thé
    note: شاي (shāy) signifie « thé » ; الشاي (ash-shāy) ajoute ال, comme en français on dit « le thé » quand on parle du thé en général.
    example_gloss: Je n’aime pas le thé.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Je n’aime pas
    gloss: je n’aime pas
    note: Pour nier, l’arabe place simplement لا avant أحب, sans verbe auxiliaire, et la négation tient en un seul mot, sans second élément comme le « pas » français.
    example_gloss: Je n’aime pas le thé.
  ar.a1.unit14.lesson01.teach.water:
    title: L’eau
    gloss: eau
    note: الماء (al-māʾ) est ماء (« eau », vu dans l’unité sur la nourriture) avec ال, employé pour l’eau en général.
    example_gloss: J’aime l’eau.
  ar.a1.unit14.lesson01.teach.and_not:
    title: Et pas
    gloss: et pas
    note: 'ولا (wa-lā) est و (« et ») accolé à لا (« ne… pas ») : il ajoute ce qu’on n’aime pas après ce qu’on aime.'
    example_gloss: J’aime le café et je n’aime pas le thé.
  ar.a1.unit14.lesson02.teach.prefer:
    title: je préfère
    gloss: je préfère
    note: 'أفضل (ufaḍḍilu) signifie « je préfère » : tu choisis une option plutôt qu’une autre.'
    example_gloss: Je préfère le café.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Que préfères-tu ?
    gloss: Que préfères-tu ?
    note: Ici, تفضل se lit tufaḍḍil, « tu préfères », adressé à un homme ; à une femme, on dit تفضلين (tufaḍḍilīn). C’est un autre mot que تفضل (tafaḍḍal, « je t’en prie ») de l’unité sur la nourriture, bien qu’il s’écrive de la même façon.
    example_gloss: 'Nour a dit : « Que préfères-tu, Yusuf ? »'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour demande
    gloss: Nour demande à Yusuf ce qu’il préfère.
    note: 'Nour est la sœur de Yusuf. Elle dit تفضل parce qu’elle s’adresse à un homme ; à une femme, on dirait : ماذا تفضلين؟'
    example_gloss: 'Nour a dit : « Que préfères-tu, Yusuf ? »'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf préfère le café
    gloss: Yusuf dit qu’il préfère le café.
    note: أفضل choisit une option plutôt que les autres ; أحب dit simplement que tu aimes quelque chose.
    example_gloss: 'Yusuf a dit : « Je préfère le café. »'
  ar.a1.unit14.lesson02.teach.line03:
    title: Yusuf n’aime pas le thé
    gloss: Yusuf dit qu’il n’aime pas le thé.
    note: لا أحب exprime simplement le fait de ne pas aimer.
    example_gloss: 'Yusuf a dit : « Je n’aime pas le thé. »'
  ar.a1.unit14.lesson02.teach.line04:
    title: Nour aime l’eau
    gloss: Nour dit qu’elle aime l’eau.
    note: On peut ajouter أنا (« moi », « je ») pour insister.
    example_gloss: 'Nour a dit : « J’aime l’eau. »'
