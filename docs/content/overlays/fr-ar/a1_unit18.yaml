teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: Le travail
    gloss: travail
    note: 'عمل (ʿamal) signifie « travail ». ما عملك؟ demande quel est le travail de quelqu’un ; la terminaison ـك signifie « ton / ta » : ʿamaluka pour un homme, ʿamaluki pour une femme, écrit de la même façon.'
    example_gloss: Quel est ton travail ?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Ingénieur
    gloss: ingénieur
    note: مهندس (muhandis) est la forme masculine, utilisée pour Youssef ; une femme dit أنا مهندسة (anā muhandisa).
    example_gloss: Je suis ingénieur.
  ar.a1.unit18.lesson01.teach.office:
    title: Bureau
    gloss: bureau
    note: مكتب (maktab) signifie « bureau » (la pièce) ; في مكتب signifie « dans un bureau ».
    example_gloss: Je travaille dans un bureau.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Je travaille dans un bureau
    gloss: Je travaille dans un bureau
    note: أعمل (aʿmal) signifie « je travaille » ; il a la même racine que عمل (travail), et le أ au début marque « je ».
    example_gloss: 'Youssef a dit : Je travaille dans un bureau.'
  ar.a1.unit18.lesson02.teach.write:
    title: J’écris
    gloss: j’écris
    note: أكتب (aktub) signifie « j’écris ».
    example_gloss: J’écris au travail.
  ar.a1.unit18.lesson02.teach.read:
    title: Je lis
    gloss: je lis
    note: أقرأ (aqraʾ) signifie « je lis ».
    example_gloss: Je lis au travail.
  ar.a1.unit18.lesson02.teach.at_work:
    title: Au travail
    gloss: au travail
    note: العمل (al-ʿamal) signifie « le travail » ; في العمل signifie « au travail ».
    example_gloss: J’écris et je lis au travail.
  ar.a1.unit18.lesson02.teach.line01:
    title: Demander le métier
    gloss: Layla demande à Youssef quel est son métier.
    note: يا يوسف interpelle Youssef par son prénom.
    example_gloss: 'Layla a dit : Quel est ton travail, Youssef ?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Dire son métier
    gloss: Youssef dit qu’il est ingénieur.
    note: Il n’y a pas besoin de mot séparé pour « suis ».
    example_gloss: 'Youssef a dit : Je suis ingénieur.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Dire son lieu de travail
    gloss: Youssef dit qu’il travaille dans un bureau.
    note: أعمل في indique le lieu de travail.
    example_gloss: 'Youssef a dit : Je travaille dans un bureau.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Demander une activité
    gloss: Layla demande à Youssef ce qu’il fait chaque jour.
    note: 'Cette phrase reprend la question sur la routine ; تفعل s’adresse à un homme. À une femme, on dit : ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla a dit : Que fais-tu chaque jour ?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Dire son activité
    gloss: Youssef dit qu’il écrit et lit au travail.
    note: 'و (wa, « et ») relie les deux activités et s’écrit collé au mot suivant : وأقرأ.'
    example_gloss: 'Youssef a dit : J’écris et je lis au travail.'
