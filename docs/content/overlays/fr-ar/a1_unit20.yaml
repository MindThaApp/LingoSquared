teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: Le temps
    gloss: le temps
    note: الجو (al-jaww) est le mot courant pour « le temps qu’il fait » ; الطقس (aṭ-ṭaqs), dans le titre de l’unité, signifie aussi « la météo ».
    example_gloss: Quel temps fait-il aujourd’hui ?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Ensoleillé
    gloss: ensoleillé
    note: مشمس (mushmis) signifie « ensoleillé » ; il est au masculin pour s’accorder avec الجو.
    example_gloss: Il fait soleil aujourd’hui.
  ar.a1.unit20.lesson01.teach.cold:
    title: Froid
    gloss: froid
    note: بارد (bārid) signifie « froid ».
    example_gloss: Il fait froid aujourd’hui.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Ensoleillé aujourd’hui
    gloss: Il fait soleil aujourd’hui
    note: L’arabe n’a pas besoin d’un mot distinct pour dire « est ».
    example_gloss: 'Youssef a dit : Il fait soleil aujourd’hui.'
  ar.a1.unit20.lesson02.teach.hot:
    title: Chaud
    gloss: chaud
    note: حار (ḥārr) signifie « chaud ».
    example_gloss: Il fait chaud.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: Quel temps fait-il ?
    gloss: Quel temps fait-il aujourd’hui ?
    note: كيف (kayfa) signifie « comment », comme dans كيف حالك؟
    example_gloss: 'Layla a dit : Quel temps fait-il aujourd’hui ?'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Buvons de l’eau
    gloss: buvons de l’eau
    note: هيا (hayyā) + un verbe à la forme « nous » signifie « allons/faisons… » ; نشرب (nashrab) signifie « nous buvons ».
    example_gloss: Il fait chaud. Buvons de l’eau.
  ar.a1.unit20.lesson02.teach.line01:
    title: Demander le temps
    gloss: Layla demande quel temps il fait aujourd’hui.
    note: اليوم signifie « aujourd’hui ».
    example_gloss: 'Layla a dit : Quel temps fait-il aujourd’hui ?'
  ar.a1.unit20.lesson02.teach.line02:
    title: Ensoleillé et chaud
    gloss: Youssef dit qu’il fait soleil et chaud.
    note: 'و (wa, « et ») relie les deux mots de météo et s’écrit attaché au mot suivant : وحار.'
    example_gloss: 'Youssef a dit : Il fait soleil et chaud.'
  ar.a1.unit20.lesson02.teach.line03:
    title: Proposer le café
    gloss: Layla propose d’aller au café.
    note: هل نذهب signifie « et si on y allait ? ».
    example_gloss: 'Layla a dit : On va au café ?'
  ar.a1.unit20.lesson02.teach.line04:
    title: Le projet de boire de l’eau
    gloss: Youssef dit oui et propose de boire de l’eau.
    note: هيا نشرب signifie « buvons ».
    example_gloss: 'Youssef a dit : Oui, buvons de l’eau.'
