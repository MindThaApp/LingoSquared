    gloss: 'Layla : J’ai un colis pour mon grand-père et ma grand-mère à Beyrouth. Avez-vous un timbre ?'
  ar.a1.unit35.lesson04.teach.almwzf_nam_ha:
    title: L’employé lui donne un timbre
    gloss: 'Employé : Oui, voici un timbre. Le colis arrive demain.'
  ar.a1.unit35.lesson04.teach.lyla_raia_shkra:
    title: Layla remercie l’employé
    gloss: 'Layla : Super ! Merci, au revoir !'
  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Layla envoie un colis
    gloss: Layla a un colis pour son grand-père et sa grand-mère à Beyrouth. Elle achète un timbre à la poste. Elle écrit l’adresse sur le colis. Le colis arrive demain. La lettre met trois jours.
    note: 'Un court texte sur le colis. Le verbe s’accorde avec son sujet : الطرد يصل (aṭ-ṭard yaṣil) pour un nom masculin, mais ليلى تشتري (Layla tashtarī) pour une femme.'
    glosses:
      طرد: colis
      لجدها: pour son grand-père
      وجدتها: et sa grand-mère
      تشتري: achète
      طابعا: timbre
      البريد: la poste (le courrier)
      تكتب: écrit
      العنوان: adresse
      يصل: arrive (verbe au masculin)
      غدا: demain
      إليهما: à eux (les deux) ; le verbe suivi de ce mot signifie « arrive chez eux »
      الرسالة: lettre
      تستغرق: met (un certain temps)
      ثلاثة: trois
      أيام: jours
  ar.a1.unit35.lesson05.teach.lyla_trsl_trda:
    title: Layla envoie un colis à ses grands-parents
    gloss: Layla envoie un colis à son grand-père et à sa grand-mère.
  ar.a1.unit35.lesson05.teach.altrd_ysl_ghda:
    title: Le colis arrive demain et la lettre met trois jours
    gloss: Le colis arrive demain et la lettre met trois jours pour arriver.
  ar.a1.unit35.lesson06.teach.lyla_altrd_ysl:
    title: Layla annonce la nouvelle
    gloss: 'Layla : Le colis arrive demain chez papi et mamie !'
  ar.a1.unit35.lesson06.teach.ywsf_raia_mta:
    title: Youssef s’informe au sujet de la lettre
    gloss: 'Youssef : Super ! Quand la lettre arrive-t-elle ?'
  ar.a1.unit35.lesson06.teach.lyla_alrsala_tstghrq:
    title: Layla répond
    gloss: 'Layla : La lettre met trois jours.'
  ar.a1.unit35.lesson06.teach.ywsf_hdha_raia:
    title: Youssef propose de rentrer à pied
    gloss: 'Youssef : Très bien ! On rentre à pied ?'
  ar.a1.unit35.lesson06.teach.lyla_nam_bkl:
    title: Layla accepte
    gloss: 'Layla : Oui, avec plaisir !'
