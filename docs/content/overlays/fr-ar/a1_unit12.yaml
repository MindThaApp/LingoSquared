teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: Demain
    gloss: demain
    note: غدا (ghadan) place une action dans un futur proche.
    example_gloss: J’étudie demain.
  ar.a1.unit12.lesson01.teach.go:
    title: Nous allons
    gloss: nous allons / nous irons
    note: نذهب (nadh-hab) signifie « nous allons » ; le ن initial marque « nous ». Avec غدا, le présent exprime un projet.
    example_gloss: Nous allons au café.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Demain à cinq heures
    gloss: demain à cinq heures
    note: في الساعة (à l’heure de) vient avant l’heure indiquée, comme dans l’unité sur l’heure.
    example_gloss: Nous y allons demain à cinq heures.
  ar.a1.unit12.lesson02.teach.propose:
    title: Proposer un projet
    gloss: On va au café demain ?
    note: 'هل (hal) transforme une affirmation en question fermée (oui ou non) ; avec نذهب, elle sert de proposition : on y va ?'
    example_gloss: 'Layla a dit : On va au café demain ?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Accepter en donnant l’heure
    gloss: Oui, à cinq heures
    note: Tu peux répondre simplement par نعم suivi de l’heure ; aucun verbe n’est nécessaire.
    example_gloss: 'Youssef a dit : Oui, à cinq heures.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Refuser simplement
    gloss: Non, j’ai un cours
    note: لا est un refus simple, suivi d’une raison avec عندي (j’ai).
    example_gloss: Non, j’ai un cours demain.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla fait une proposition
    gloss: Layla propose d’aller au café demain.
    note: Cette réplique ouvre l’échange pour organiser la sortie.
    example_gloss: 'Layla a dit : On va au café demain ?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Youssef accepte
    gloss: Youssef accepte et donne l’heure.
    note: Le projet comporte maintenant une activité, un jour et une heure.
    example_gloss: 'Youssef a dit : Oui, à cinq heures.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla confirme
    gloss: Layla dit « bien » et « au revoir ».
    note: جيد (jayyid) signifie « bien » ; ici, il confirme le projet. إلى اللقاء est le « au revoir » de l’unité sur les salutations.
    example_gloss: 'Layla a dit : Bien. Au revoir.'
