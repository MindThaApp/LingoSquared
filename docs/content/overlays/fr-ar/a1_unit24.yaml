  ar.a1.unit24.lesson02.teach.amount:
    title: Montant
    gloss: le montant
    note: مبلغ (mablagh) désigne une somme d’argent ; كم المبلغ؟ (kam al-mablagh) demande combien il y a à payer.
    example_gloss: Quel est le montant ?
  ar.a1.unit24.lesson02.teach.can_pay:
    title: Je peux payer ?
    gloss: Puis-je payer par carte ?
    note: هل أستطيع (hal astaṭīʿ) signifie « puis-je » ; الدفع (ad-dafʿ) signifie « le paiement, payer ».
    example_gloss: Puis-je payer en espèces ?
  ar.a1.unit24.lesson02.teach.line01:
    title: Demander le montant
    gloss: Layla demande le montant.
    note: كم demande « combien ».
    example_gloss: 'Layla a dit : Quel est le montant ?'
  ar.a1.unit24.lesson02.teach.line02:
    title: Donner le montant
    gloss: Le vendeur dit que le montant est de dix dirhams.
    note: دراهم (darāhim) est le mot de la monnaie vu dans l’unité sur les achats.
    example_gloss: 'Le vendeur a dit : Le montant est de dix dirhams.'
  ar.a1.unit24.lesson02.teach.line03:
    title: Demander à payer par carte
    gloss: Layla demande si elle peut payer par carte.
    note: Cette question porte sur un moyen de paiement accepté.
    example_gloss: 'Layla a dit : Puis-je payer par carte ?'
  ar.a1.unit24.lesson02.teach.line04:
    title: Proposer des moyens de paiement
    gloss: Le vendeur dit que la carte ou les espèces sont possibles.
    note: أو (aw) signifie « ou ».
    example_gloss: 'Le vendeur a dit : Oui, ou en espèces.'
  ar.a1.unit24.lesson02.teach.line05:
    title: Choisir le moyen de paiement
    gloss: Layla dit qu’elle paiera par carte.
    note: Cela conclut le choix du moyen de paiement.
    example_gloss: 'Layla a dit : Je paierai par carte.'
