    gloss: carte
    note: 'بطاقة (biṭāqa) signifie « carte » ; بالبطاقة (bil-biṭāqa) signifie « par carte ». Dans سأدفع (sa-adfaʿ), le préfixe سـ met أدفع au futur : « je paierai ».'
