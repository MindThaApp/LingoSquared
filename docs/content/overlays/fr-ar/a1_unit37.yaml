    gloss: Nour est la nouvelle au café des langues. Elle demande à Youssef comment sont les autres. Youssef lui répond. Layla est gentille et patiente ; elle est infirmière. Karim est drôle et suit un cours d’espagnol. Sara est curieuse ; elle aime apprendre des choses nouvelles. Youssef, lui, est calme.
