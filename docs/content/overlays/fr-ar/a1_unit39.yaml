  ar.a1.unit39.lesson05.teach.alan_alrbya_alwrwd:
    title: Une conversation sur les saisons
    gloss: 'C’est maintenant le printemps. Les roses sont belles. Nour demande : Quelle saison trouves-tu belle ? Yusuf dit : J’aime l’été. En été, on nage. Layla dit : J’aime l’hiver. En hiver, on fait du patin sur glace.'
    note: Un court texte qui résume la conversation sur les saisons. En arabe, les saisons sont des mots masculins avec ال, comme الصيف (aṣ-ṣayf) et الشتاء (ash-shitāʾ).
    glosses:
      الربيع: printemps
      الورود: les roses
      جميلة: beau
      تسأل: demande
      فصل: saison
      تراه: penser / trouver
      يقول: dit
      الصيف: été
      أحب: aimer (j’aime)
      نسبح: nager
      الشتاء: hiver
      نتزلج: patiner
