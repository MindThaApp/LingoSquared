teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Que
    gloss: que
    note: من (min) est le même mot que « de » (أنا من لبنان) ; après un mot de comparaison, il signifie « que ».
    example_gloss: Le marché est plus grand que le café.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Plus grand
    gloss: plus grand
    note: أكبر (akbar) vient de كبير (kabīr, grand). Les mots de comparaison comme أكبر, أصغر, أقرب et أرخص commencent tous par أ et gardent la même forme pour les noms masculins et féminins.
    example_gloss: Le marché est plus grand que le café.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Plus petit
    gloss: plus petit
    note: أصغر (aṣghar), « plus petit », suit le même modèle en أ que أكبر.
    example_gloss: Le café est plus petit que le marché.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Plus proche
    gloss: plus proche
    note: 'أقرب (aqrab) compare les distances : plus proche.'
    example_gloss: Le café est plus proche que le marché.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: Le marché est plus grand
    gloss: Le marché est plus grand que le café
    note: Dans cette comparaison, l’arabe n’a pas besoin de mot distinct pour « est ».
    example_gloss: 'Youssef a dit : Le marché est plus grand que le café.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Plus proche
    gloss: plus proche
    note: 'أقرب (aqrab) compare les distances : plus proche.'
    example_gloss: Le café est plus proche que le marché.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: Moins cher
    gloss: moins cher
    note: 'أرخص (arkhaṣ) compare les prix : moins cher.'
    example_gloss: L’eau est moins chère que le café.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Le café est plus proche
    gloss: Le café est plus proche que le marché
    note: Garde من devant le second élément.
    example_gloss: 'Youssef a dit : Le café est plus proche que le marché.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Demander une préférence
    gloss: Layla demande à Youssef ce qu’il préfère.
    note: 'Layla dit تفضل (tufaḍḍil) parce qu’elle s’adresse à un homme ; à une femme, on dit : ماذا تفضلين؟'
    example_gloss: 'Layla a dit : Que préfères-tu ?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Préférer le café
    gloss: Youssef dit qu’il préfère le café.
    note: أفضل peut être suivi d’un lieu comme option préférée.
    example_gloss: 'Youssef a dit : Je préfère le café.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Comparer la distance
    gloss: Youssef dit que le café est plus proche que le marché.
    note: أقرب من donne la raison.
    example_gloss: 'Youssef a dit : Le café est plus proche que le marché.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Comparer la taille
    gloss: Nour ajoute que le marché est plus grand que le café.
    note: 'والسوق (was-sūq) est و (« et ») collé à السوق : « et le marché ».'
    example_gloss: 'Nour a dit : Et le marché est plus grand que le café.'
