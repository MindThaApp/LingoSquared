  ar.a1.unit08.lesson01.teach.apple:
    title: Les pommes
    gloss: pommes
    note: تفاح (tuffāḥ) est un nom collectif qui désigne les pommes ; une pomme se dit تفاحة (tuffāḥa).
    example_gloss: Les pommes coûtent dix dirhams.
  ar.a1.unit08.lesson01.teach.dirhams:
    title: Les dirhams
    gloss: dirhams
    note: دراهم (darāhim) est le pluriel de درهم (dirham), la monnaie du Maroc et des Émirats arabes unis ; après les nombres de 3 à 10, on emploie le pluriel.
    example_gloss: J’ai dix dirhams.
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: Combien coûtent les pommes ?
    gloss: Combien coûtent les pommes ?
    note: كم سعر التفاح؟ (kam siʿr at-tuffāḥ) demande littéralement « combien est le prix des pommes ? ». ما سعر التفاح؟ (quel est le prix ?) et بكم التفاح؟ (pour combien les pommes ?) sont aussi des formules courantes.
    example_gloss: 'Layla a dit : Combien coûtent les pommes ?'
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: Pour dix dirhams
    gloss: pour dix dirhams
    note: 'Le préfixe بـ (bi-) indique le prix : بعشرة (bi-ʿashara), « pour dix ».'
    example_gloss: Les pommes coûtent dix dirhams.
  ar.a1.unit08.lesson02.teach.two_apples:
    title: Deux pommes
    gloss: deux pommes
    note: تفاحتين (tuffāḥatayn) est le duel de تفاحة (une pomme), à la forme du complément d’objet employée après أريد.
    example_gloss: Deux pommes.
  ar.a1.unit08.lesson02.teach.want_two:
    title: Je veux deux pommes
    gloss: je veux deux pommes
    note: Place أريد avant l’objet voulu.
    example_gloss: Je veux deux pommes.
  ar.a1.unit08.lesson02.teach.line01:
    title: Demander le prix
    gloss: Layla demande le prix des pommes.
    note: C’est la même structure de question sur le prix.
    example_gloss: 'Layla a dit : Combien coûtent les pommes ?'
  ar.a1.unit08.lesson02.teach.line02:
    title: Dire le prix
    gloss: Le vendeur dit que les pommes coûtent dix dirhams.
    note: بعشرة rattache le préfixe du prix à عشرة.
    example_gloss: 'Le vendeur a dit : Les pommes coûtent dix dirhams.'
  ar.a1.unit08.lesson02.teach.line03:
    title: Demander une quantité
    gloss: Layla demande poliment deux pommes.
    note: من فضلك rend la demande polie.
    example_gloss: 'Layla a dit : Je veux deux pommes, s’il vous plaît.'
  ar.a1.unit08.lesson02.teach.line04:
    title: Tendre l’article
    gloss: Le vendeur dit « tenez, voici ».
    note: 'تفضلي a été vu dans l’unité sur la nourriture ; on le dit à une femme (à un homme : تفضل).'
    example_gloss: 'Le vendeur a dit : Tenez, voici.'
