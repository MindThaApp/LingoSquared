    title: Nour et Layla achètent des roses
    gloss: Nour et Layla vont au marché aux fleurs samedi. Quelle couleur Layla veut-elle ? Layla voudrait du rouge. Quelle couleur Nour veut-elle ? Nour voudrait du jaune. Elles achètent cinq roses. Ça coûte dix dirhams. Les roses sont très belles !
    note: 'Un court texte sur la sortie au marché. Une couleur s’accorde avec ce qu’elle décrit : الأحمر (al-aḥmar) est la couleur elle-même, mais الورود حمراء (al-wurūd ḥamrāʾ) est au féminin pour les roses.'
