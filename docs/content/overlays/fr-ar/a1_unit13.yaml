teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Hier
    gloss: hier
    note: أمس (ams) signifie « hier ». Il s’emploie avec un verbe au passé comme ذهبت et peut se placer à la fin ou au début de la phrase.
    example_gloss: Je suis allé au marché hier.
  ar.a1.unit13.lesson01.teach.went:
    title: Je suis allé
    gloss: je suis allé
    note: 'ذهبت (dhahabtu) signifie « je suis allé(e) » : la terminaison du passé -tu marque « je ». Sans voyelles brèves, les mêmes lettres peuvent aussi se lire dhahabta / dhahabti (tu es allé / tu es allée) ou dhahabat (elle est allée) ; le contexte permet de choisir.'
    example_gloss: Je suis allé au marché.
  ar.a1.unit13.lesson01.teach.bought:
    title: J’ai acheté
    gloss: j’ai acheté
    note: اشتريت (ishtaraytu) signifie « j’ai acheté » ; comme ذهبت, il se termine par -tu pour « je ».
    example_gloss: J’ai acheté des pommes.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Des pommes
    gloss: des pommes
    note: تفاحا (tuffāḥan) est تفاح (pommes, vu dans l’unité sur les achats) en fonction de complément d’objet du verbe ; le ا supplémentaire note la terminaison -an.
    example_gloss: J’ai acheté des pommes.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Qu’est-ce que tu as fait hier ?
    gloss: Qu’avez-vous fait hier ?
    note: 'ماذا (mādhā) signifie « que / quoi » ; فعلت signifie ici « tu as fait » : faʿalta à un homme, faʿalti à une femme (l’écriture est la même). Youssef s’adresse à Layla, il dit donc faʿalti.'
    example_gloss: 'Youssef a dit : Qu’as-tu fait hier ?'
  ar.a1.unit13.lesson02.teach.drank:
    title: J’ai bu
    gloss: j’ai bu
    note: شربت (sharibtu) signifie « j’ai bu » ; elle a la même terminaison -tu (« je ») que ذهبت et اشتريت.
    example_gloss: J’ai bu un café.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Suite d’événements récents
    gloss: Je suis allé au marché. J’ai acheté des pommes. J’ai bu un café.
    note: Quelques courtes phrases au passé à la suite permettent de raconter ce que tu as fait. Chaque verbe se termine par -tu pour « je ».
    example_gloss: Hier, je suis allé au marché. J’ai acheté des pommes. J’ai bu un café.
  ar.a1.unit13.lesson02.teach.line01:
    title: Demander ce qu’on a fait hier
    gloss: Youssef demande à Layla ce qu’elle a fait hier.
    note: Youssef s’adresse à Layla, une femme ; فعلت se lit donc faʿalti ici ; à un homme, on dirait faʿalta.
    example_gloss: 'Youssef a dit : Qu’as-tu fait hier ?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Allée au marché
    gloss: Layla dit qu’elle est allée au marché.
    note: ذهبت exprime un déplacement accompli.
    example_gloss: 'Layla a dit : Je suis allée au marché.'
  ar.a1.unit13.lesson02.teach.line03:
    title: A acheté des pommes
    gloss: Layla dit qu’elle a acheté des pommes.
    note: Cela ajoute une deuxième action accomplie.
    example_gloss: 'Layla a dit : J’ai acheté des pommes.'
  ar.a1.unit13.lesson02.teach.line04:
    title: A bu un café
    gloss: Layla dit qu’elle a bu un café.
    note: Cela termine le court récit de l’événement.
    example_gloss: 'Layla a dit : J’ai bu un café.'
