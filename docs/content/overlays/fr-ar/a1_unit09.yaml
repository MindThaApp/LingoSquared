teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Lieu
    gloss: lieu
    note: مكان (makān) est le mot général pour dire « lieu ». هذا (ce, c’est) a été vu avec les nombres.
    example_gloss: C’est un lieu.
  ar.a1.unit09.lesson01.teach.library:
    title: Bibliothèque
    gloss: bibliothèque
    note: مكتبة (maktaba) peut signifier « bibliothèque » ou « librairie » ; ici, il s’agit d’une bibliothèque. المكتبة (al-maktaba) signifie « la bibliothèque ».
    example_gloss: La bibliothèque est ici.
  ar.a1.unit09.lesson01.teach.market:
    title: Marché
    gloss: marché
    note: سوق (sūq) signifie « marché » ; السوق (as-sūq) signifie « le marché ».
    example_gloss: Le marché est ici.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Café
    gloss: café
    note: مقهى (maqhā) signifie « café » (le lieu) ; le mot est apparenté à قهوة (le café, la boisson). المقهى (al-maqhā) signifie « le café ».
    example_gloss: Le café est ici.
  ar.a1.unit09.lesson01.teach.here:
    title: Ici
    gloss: ici
    note: 'هنا (hunā) se place généralement après le lieu : المقهى هنا, « le café est ici ». En arabe, on n’utilise pas de verbe « être » dans cette phrase.'
    example_gloss: Le café est ici.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Où est la bibliothèque ?
    gloss: Où est la bibliothèque ?
    note: أين (ayna) signifie « où » ; tu l’as déjà rencontré dans من أين أنت؟ (d’où viens-tu ?).
    example_gloss: 'Youssef a dit : Où est la bibliothèque ?'
  ar.a1.unit09.lesson02.teach.near:
    title: Près de
    gloss: près de
    note: 'قرب (qurba) signifie « près de » et se place avant le lieu auquel il se rapporte : قرب المكتبة, « près de la bibliothèque ». بالقرب من (bi-l-qurbi min) a le même sens.'
    example_gloss: Le café est près de la bibliothèque.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: La bibliothèque est près du marché
    gloss: La bibliothèque est près du marché
    note: En arabe, on n’a pas besoin d’un mot séparé pour « est » ici.
    example_gloss: 'Leïla a dit : La bibliothèque est près du marché.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Demander où
    gloss: Youssef demande où est la bibliothèque.
    note: أين introduit la question sur le lieu.
    example_gloss: 'Youssef a dit : Où est la bibliothèque ?'
  ar.a1.unit09.lesson02.teach.line02:
    title: Situer la bibliothèque
    gloss: Leïla dit que la bibliothèque est ici, près du marché.
    note: 'هنا et قرب peuvent apparaître ensemble : ici, près du marché.'
    example_gloss: 'Leïla a dit : La bibliothèque est ici, près du marché.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Poser une question sur le café
    gloss: Youssef demande où est le café.
    note: 'و (wa, « et ») s’écrit attaché au mot suivant : وأين (wa-ayna), « et où ».'
    example_gloss: 'Youssef a dit : Et où est le café ?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Situer le café
    gloss: Leïla dit que le café est près de la bibliothèque.
    note: 'Lieu + قرب + second lieu : المقهى قرب المكتبة, « le café est près de la bibliothèque ».'
    example_gloss: 'Leïla a dit : Le café est près de la bibliothèque.'
