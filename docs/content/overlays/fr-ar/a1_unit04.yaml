teaching:
  ar.a1.unit04.lesson01.teach.tareekh:
    title: Date
    gloss: date
    note: Dans cette question, تاريخ désigne une date du calendrier.
    example_gloss: Quelle est la date d’aujourd’hui ?
  ar.a1.unit04.lesson01.teach.al_yawm:
    title: Aujourd’hui
    gloss: aujourd’hui
    note: اليوم signifie « aujourd’hui » ou « le jour » selon le contexte.
    example_gloss: Quelle est la date d’aujourd’hui ?
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: Quelle est la date d’aujourd’hui ?
    gloss: Quelle est la date d’aujourd’hui ?
    note: L’arabe place le mot interrogatif ما avant le groupe nominal تاريخ اليوم.
    example_gloss: 'Layla a dit : Quelle est la date d’aujourd’hui ?'
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: De mai
    gloss: de mai
    note: 'Dans les dates, on place من devant le mois : الخامس من مايو.'
    example_gloss: Aujourd’hui, c’est le cinq mai.
  ar.a1.unit04.lesson01.teach.may:
    title: Mai
    gloss: mai
    note: مايو (māyū) est le nom du mois de mai en Égypte et dans une grande partie du monde arabe ; au Liban, en Syrie, en Jordanie et en Irak, on dit أيار (ayyār).
    example_gloss: Aujourd’hui, c’est le cinq mai.
  ar.a1.unit04.lesson01.teach.june:
    title: Juin
    gloss: juin
    note: يونيو (yūnyū) est le nom du mois de juin en Égypte et dans une grande partie du monde arabe ; au Liban, en Syrie, en Jordanie et en Irak, on dit حزيران (ḥazīrān).
    example_gloss: Aujourd’hui, c’est le six juin.
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: Le cinquième
    gloss: le cinquième
    note: الخامس est l’ordinal employé pour le 5 dans cette date simple.
    example_gloss: Aujourd’hui, c’est le cinq mai.
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: Le sixième
    gloss: le sixième
    note: السادس est l’ordinal employé pour le 6.
    example_gloss: Aujourd’hui, c’est le six juin.
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: Le 5 mai
    gloss: le cinq mai
    note: 'Comme en français, on énonce le jour avant le mois, mais l’arabe ajoute من (« de ») entre les deux : الخامس من مايو.'
    example_gloss: Le cinq mai.
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: Le 6 juin
    gloss: le six juin
    note: Cela donne une date sans ambiguïté, avec le jour puis le mois.
    example_gloss: Le six juin.
  ar.a1.unit04.lesson02.teach.line01:
    title: Demander la date
    gloss: Layla demande la date d’aujourd’hui.
    note: ما تاريخ اليوم؟ demande la date du jour, pas l’heure.
    example_gloss: 'Layla a dit : Quelle est la date d’aujourd’hui ?'
  ar.a1.unit04.lesson02.teach.line02:
    title: Indiquer la date
    gloss: Yusuf dit que nous sommes le 5 mai.
    note: La réponse commence par اليوم.
    example_gloss: 'Yusuf a dit : Nous sommes le cinq mai.'
  ar.a1.unit04.lesson02.teach.line03:
    title: Parler d’un cours
    gloss: Layla dit qu’elle a un cours aujourd’hui.
    note: عندي signifie « j’ai » ; il a déjà été utilisé avec les nombres.
    example_gloss: 'Layla a dit : Merci. J’ai un cours aujourd’hui.'
  ar.a1.unit04.lesson02.teach.line04:
    title: Indiquer la date du cours
    gloss: Yusuf indique la date du cours.
    note: في indique le moment où a lieu le cours.
    example_gloss: 'Yusuf a dit : Le cours a lieu le cinq mai.'
