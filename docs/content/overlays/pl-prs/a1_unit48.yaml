teaching:
  prs.a1.unit48.lesson01.teach.review_this_is_in:
    title: 'Powtórka: to, jest, w'
    gloss: to / jest / w
    note: To słowa powtórkowe (używane w całym kursie), potrzebne do rozmowy o wypożyczalni rowerów.
    target_text: این (to) / است (jest) / در (w)
  prs.a1.unit48.lesson01.teach.review_shop_shopkeeper_bike:
    title: 'Powtórka: sklep, sklepikarz, rower'
    gloss: sklep / sklepikarz / rower
    note: Sklep i sklepikarz to słowa powtórkowe z lekcji 10, a rower – z lekcji 24.
    target_text: دوکان (sklep) / دوکاندار (sklepikarz) / دوچرخه (rower)
  prs.a1.unit48.lesson01.teach.rent_word:
    title: Wynajem / opłata za wynajem
    gloss: wynajem / opłata za wynajem
    note: To codzienne słowo dari na opłatę za wynajem. W tym kursie pojawiło się już w znaczeniu czynszu za dom.
    example_gloss: To jest wypożyczalnia rowerów.
  prs.a1.unit48.lesson01.teach.this_is_bike_rental_shop_phrase:
    title: To jest wypożyczalnia rowerów
    gloss: To jest wypożyczalnia rowerów.
    note: 'Zdanie łączy słowa: to, sklep, wynajem i rower – tak samo, jak w tym kursie łączyliśmy już dwa rzeczowniki bez dodatkowego słowa łączącego.'
  prs.a1.unit48.lesson01.teach.shopkeeper_at_shop_phrase:
    title: Sklepikarz jest w sklepie
    gloss: Sklepikarz jest w sklepie.
    note: 'Zdanie łączy słowa: sklepikarz i sklep.'
  prs.a1.unit48.lesson02.teach.review_want_take_rent_bike:
    title: 'Powtórka: chcę, żebym wziął, wynajem, rower'
    gloss: chcę / żebym wziął / wynajem / rower
    note: To słowa powtórkowe, których używamy, prosząc o wypożyczenie.
    target_text: می‌خواهم (chcę) / بگیرم (żebym wziął) / کرایه (wynajem) / دوچرخه (rower) / یک (jeden/pewien)
  prs.a1.unit48.lesson02.teach.daily_word:
    title: Dziennie
    gloss: dziennie
    note: To codzienne słowo dari oznaczające „dziennie”. Tu służy do podania ceny wypożyczenia za dzień.
    example_gloss: To 50 afgani dziennie.
  prs.a1.unit48.lesson02.teach.want_to_rent_phrase:
    title: Chcę wypożyczyć rower
    gloss: Chcę wypożyczyć rower.
    note: Zdanie rozszerza ten sam wzorzec „chcę” + forma łączna, który znasz już z wypożyczania książek w bibliotece i umawiania wizyty.
  prs.a1.unit48.lesson02.teach.ask_daily_price_phrase:
    title: Ile kosztuje wypożyczenie roweru na dzień?
    gloss: Ile kosztuje wypożyczenie roweru na dzień?
    note: Zdanie łączy słowa poznane wcześniej w tej lekcji.
  prs.a1.unit48.lesson02.teach.daily_price_answer_phrase:
    title: To 50 afgani dziennie
    gloss: To 50 afgani dziennie.
    note: Zdanie podaje cenę za pomocą poznanych już liczebników i waluty.
  prs.a1.unit48.lesson03.teach.review_for_want_polite_rent:
    title: 'Powtórka: dla, chcecie (grzecznościowo), wynajem'
    gloss: dla / chce Pan/Pani (grzecznościowo) / wynajem
    note: To słowa powtórkowe, których używamy, pytając o to, czego potrzeba do wypożyczenia.
    target_text: برای (na/dla) / می‌خواهین (chce Pan/Pani) / کرایه (wynajem)
  prs.a1.unit48.lesson03.teach.id_card_word:
    title: Dowód tożsamości
    gloss: dowód tożsamości
    note: To afgański krajowy dowód tożsamości, który pojawił się już w tym kursie w innym kontekście (rejestracja). Tutaj służy jako zastaw zamiast gotówki.
    example_gloss: Potrzebuję dowodu tożsamości.
  prs.a1.unit48.lesson03.teach.want_id_for_rental_phrase:
    title: Do wypożyczenia potrzebuję Pana dowodu tożsamości
    gloss: Do wypożyczenia potrzebuję Pana dowodu tożsamości.
    note: 'Zdanie łączy słowa: wynajem i dowód tożsamości.'
  prs.a1.unit48.lesson03.teach.review_when_giveback_tomorrow:
    title: 'Powtórka: kiedy, oddać, jutro'
    gloss: kiedy / oddać / jutro
    note: To słowa powtórkowe, których używamy, pytając o termin zwrotu.
    target_text: کی (kiedy) / پس دادن (oddawać) / پس می‌دهین (oddaje Pan/Pani) / پس می‌دهم (oddam) / فردا (jutro) / را (znacznik dopełnienia)
  prs.a1.unit48.lesson03.teach.ask_return_time_phrase:
    title: Kiedy odda Pan rower?
    gloss: Kiedy odda Pan rower?
    note: Zdanie rozszerza czasownik „oddawać” o poznaną już grzecznościową końcówkę.
  prs.a1.unit48.lesson03.teach.return_tomorrow_phrase:
    title: Oddam jutro
    gloss: Oddam jutro.
    note: Zdanie rozszerza czasownik „oddawać” o oczekiwaną końcówkę 1. osoby czasu teraźniejszego.
  prs.a1.unit48.lesson04.teach.review_hello_want_rent_take:
    title: 'Powtórka: cześć, chcę, wynajem, żebym wziął'
    gloss: cześć / chcę / wynajem / żebym wziął
    note: To słowa powtórkowe (z wcześniejszych lekcji i z tej), którymi zaczynamy dialog.
    target_text: سلام (dzień dobry) / می‌خواهم (chcę) / کرایه (wynajem) / بگیرم (żebym wziął)
  prs.a1.unit48.lesson04.teach.review_welcome_daily_price:
    title: 'Powtórka: proszę, dziennie, pięćdziesiąt, afgani, jest'
    gloss: proszę / dziennie / pięćdziesiąt / afgani / jest
    note: To słowa powtórkowe, których używamy, podając cenę.
    target_text: بفرمایین (proszę) / روزانه (dziennie) / پنجاه (pięćdziesiąt) / افغانی (afgani) / است (jest)
  prs.a1.unit48.lesson04.teach.review_very_good_id_want_polite:
    title: 'Powtórka: bardzo dobrze, dowód tożsamości, chce Pan/Pani (grzecznościowo)'
    gloss: bardzo dobrze / dowód tożsamości / chce Pan/Pani (grzecznościowo)
    note: To słowa powtórkowe (z wcześniejszych lekcji i z tej), którymi pytamy o zastaw.
    target_text: بسیار خوب (bardzo dobrze) / تذکره (dowód tożsamości) / می‌خواهین (chce Pan/Pani)
  prs.a1.unit48.lesson04.teach.review_yes_for_rent_want:
    title: 'Powtórka: tak, dla'
    gloss: tak / dla
    note: To słowa powtórkowe, którymi potwierdzamy zastaw.
    target_text: بلی (tak) / برای (na/dla)
  prs.a1.unit48.lesson04.teach.review_here_tomorrow_giveback:
    title: 'Powtórka: proszę, jutro, oddam'
    gloss: proszę / jutro / oddam
    note: To słowa powtórkowe (z tej lekcji), którymi kończymy rozmowę.
    target_text: بفرمایین (proszę) / فردا (jutro) / پس می‌دهم (oddam)
  prs.a1.unit48.lesson04.teach.review_thanks_good_day:
    title: 'Powtórka: bardzo dziękuję, miłego dnia'
    gloss: bardzo dziękuję / miłego dnia
    note: To słowa powtórkowe (z lekcji 1 i wcześniejszych), którymi kończymy dialog.
    target_text: تشکر زیاد (bardzo dziękuję) / روز خوش (miłego dnia)
  prs.a1.unit48.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Dzień dobry. Chcę wypożyczyć rower.'
    gloss: Dzień dobry. Chcę wypożyczyć rower.
  prs.a1.unit48.lesson04.teach.dialogue_line2:
    title: 'Sklepikarz: Dzień dobry, proszę. Wypożyczenie kosztuje 50 afgani dziennie.'
    gloss: Dzień dobry, proszę. Wypożyczenie kosztuje 50 afgani dziennie.
  prs.a1.unit48.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Bardzo dobrze. Czy potrzebny jest dowód tożsamości?'
    gloss: Bardzo dobrze. Czy potrzebny jest dowód tożsamości?
  prs.a1.unit48.lesson04.teach.dialogue_line4:
    title: 'Sklepikarz: Tak, do wypożyczenia potrzebuję Pana dowodu tożsamości.'
    gloss: Tak, do wypożyczenia potrzebuję Pana dowodu tożsamości.
  prs.a1.unit48.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Proszę. Oddam jutro.'
    gloss: Proszę. Oddam jutro.
  prs.a1.unit48.lesson04.teach.dialogue_line6:
    title: 'Sklepikarz: Bardzo dziękuję. Miłego dnia!'
    gloss: Bardzo dziękuję. Miłego dnia!
  prs.a1.unit48.lesson05.teach.review_this_is_shopkeeper_in:
    title: 'Powtórka: to, jest, sklepikarz, w'
    gloss: to / jest / sklepikarz / w
    note: To słowa powtórkowe (z wcześniejszych lekcji i z tej), użyte w tekście do czytania.
    target_text: این (to) / است (jest) / دوکاندار (sklepikarz) / در (w)
  prs.a1.unit48.lesson05.teach.review_he_rents_daily_price_returns:
    title: 'Powtórka: on/ona, żeby wziął/wzięła, dziennie, 50 afgani, jutro, oddaje'
    gloss: on/ona / żeby wziął/wzięła / dziennie / 50 afgani / jutro / oddaje
    note: To słowa powtórkowe (z tej lekcji i z lekcji 18), użyte w tekście do czytania.
    target_text: او (on/ona) / بگیرد (żeby wziął/wzięła) / روزانه (dziennie) / پنجاه افغانی (50 afgani) / فردا (jutro) / پس می‌دهد (oddaje)
  prs.a1.unit48.lesson05.teach.wants_3rd_person_word:
    title: Chce
    gloss: chce
    note: To forma 3. osoby czasu teraźniejszego tego samego czasownika, który znasz już jako „chcę”.
    example_gloss: On/ona chce rower.
  prs.a1.unit48.lesson05.teach.reading_passage:
    title: Czytanie o wypożyczalni rowerów
    gloss: Homayoun jest w wypożyczalni rowerów. Chce wypożyczyć rower. Wypożyczenie kosztuje 50 afgani dziennie. Jutro odda rower.
