    gloss: ale / dwa dni / Pana/Pani wypożyczenie
    note: „Ale” to słowo powtórkowe z wcześniejszych lekcji. „Pana/Pani wypożyczenie” ma ten sam przyrostek co „Pana/Pani wizyta” z lekcji 47 i „Pana/Pani recepta” z lekcji 46.
    target_text: اما (ale) / دو روز (dwa dni) / کرایه‌تان (Pana/Pani wynajem)
  prs.a1.unit48.lesson06.teach.review_daily_price_ninety:
    title: 'Powtórka: wynajem, dziennie, pięćdziesiąt, dziewięćdziesiąt, afgani, ile'
    gloss: wynajem / dziennie / pięćdziesiąt / dziewięćdziesiąt / afgani / ile
    note: To słowa powtórkowe (z tej lekcji i wcześniejszych), którymi kończymy lekcję.
    target_text: کرایه (wynajem) / روزانه (dziennie) / پنجاه (pięćdziesiąt) / نود (dziewięćdziesiąt) / افغانی (afgani) / چند (ile)
  prs.a1.unit48.lesson06.teach.price_contrast_phrase:
    title: Wypożyczenie roweru kosztuje 50 afgani dziennie, ale za dwa dni 90
    gloss: Wypożyczenie roweru kosztuje 50 afgani dziennie, ale za dwa dni – 90 afgani.
    note: Słowo „ale” zestawia stawkę dzienną z osobną stawką za dwa dni.
  prs.a1.unit48.lesson06.teach.your_rental_question_phrase:
    title: Na ile dni wypożycza Pan/Pani rower?
    gloss: Na ile dni wypożycza Pan/Pani rower?
    note: To grzecznościowa wersja pytania o wypożyczenie, z przyrostkiem dzierżawczym.
  prs.a1.unit48.lesson02.teach.review_how_much_price:
    target_text: چند (ile) / پنجاه (pięćdziesiąt) / افغانی (afgani)
