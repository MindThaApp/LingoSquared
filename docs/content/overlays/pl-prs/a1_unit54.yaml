teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Powtórka: to, jest, w, dobry'
    gloss: to / jest / w / dobry
    note: To słowa powtórkowe (używane w całym kursie), przydatne do rozmowy o koncercie.
    target_text: این (to) / است (jest) / در (w) / خوب (dobry)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Koncert
    gloss: koncert
    note: To standardowe współczesne słowo dari oznaczające koncert, zapożyczone tak samo jak *موزیم* (muzeum).
    example_gloss: Ten koncert jest dobry.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Piosenkarz
    gloss: piosenkarz
    note: To zwyczajne, powszechne współczesne słowo dari oznaczające piosenkarza. Istnieje też bardziej klasyczny odpowiednik, *آوازخوان*, ale w codziennej mowie jest rzadszy.
    example_gloss: Piosenkarz jest na koncercie.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: To jest koncert
    gloss: To jest koncert.
    note: Zdanie łączy słowa „to”, „jest” i „koncert” tak, jak ten kurs łączy je już wcześniej.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Piosenkarz jest na koncercie
    gloss: Piosenkarz jest na koncercie.
    note: Zdanie łączy słowa „piosenkarz”, „w” i „koncert”.
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Powtórka: ile, afgani, jest, trzydzieści, godzina, osiem, wieczór, odbywa się, w, bilet'
    gloss: ile / afgani / jest / trzydzieści / godzina / osiem / wieczór / odbywa się / w / bilet
    note: To słowa powtórkowe (z wcześniejszych lekcji), służące do mówienia o godzinie rozpoczęcia koncertu i cenie.
    target_text: چند (ile) / افغانی (afgani) / است (jest) / سی (trzydzieści) / ساعت (godzina) / هشت (osiem) / شب (wieczór) / می‌شود (odbywa się) / در (w) / تکت (bilet)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Początek
    gloss: początek
    note: Razem z *می‌شود* (staje się, odbywa się) znaczy „zaczyna się”, według tego samego wzoru z czasownikiem posiłkowym, który ten kurs już stosuje.
    example_gloss: Koncert zaczyna się o ósmej wieczorem.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima to popularne afgańskie imię, użyte tu jako imię piosenkarki na koncercie.
    example_gloss: Sima jest piosenkarką.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Czytamy plakat koncertowy
    gloss: Sima jest piosenkarką. Koncert zaczyna się o ósmej wieczorem. Bilet kosztuje 30 afgani.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Powtórka: kiedy'
    gloss: kiedy
    note: To słowo powtórkowe, którego używamy, by zapytać, kiedy zaczyna się koncert.
    target_text: کی (kiedy)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Kiedy zaczyna się koncert?
    gloss: Kiedy zaczyna się koncert?
    note: To zdanie łączy słowa poznane wcześniej w tej lekcji.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Koncert zaczyna się o ósmej wieczorem
    gloss: Koncert zaczyna się o ósmej wieczorem.
    note: To zdanie podaje godzinę rozpoczęcia koncertu z plakatu.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Powtórka: czy chcecie (grzecznie), piątek, chodźmy'
    gloss: czy chcecie (grzecznie) / piątek / chodźmy
    note: To słowa powtórkowe służące do złożenia propozycji, według tego samego schematu, który ten kurs wprowadził przy propozycji wyjścia do parku.
    target_text: می‌خواهین (czy chcecie, grzecznie) / جمعه (piątek) / برویم (chodźmy)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Powtórka: koncert'
    gloss: koncert
    note: To słowo powtórkowe, którego używamy, proponując pójście na koncert.
    target_text: کنسرت (koncert)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Chcesz pójść w piątek na koncert?
    gloss: Chcesz pójść w piątek na koncert?
    note: Zdanie wykorzystuje wzór proponowania planów, który ten kurs już wprowadził, tu zastosowany do koncertu.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Powtórka: tak, świetnie, zgoda'
    gloss: tak / świetnie / zgoda
    note: To słowa powtórkowe służące do przyjęcia propozycji.
    target_text: بلی (tak) / عالی (świetnie) / قبول (zgoda)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Tak, świetnie! Zgoda.
    gloss: Tak, świetnie! Zgoda.
    note: To zdanie przyjmuje propozycję pójścia na koncert.
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: 'Powtórka: dzień dobry, jeden, bilet, chcę'
    gloss: dzień dobry / jeden / bilet / chcę
    note: To słowa powtórkowe, którymi zaczynamy dialog.
    target_text: سلام (dzień dobry) / یک (jeden) / تکت (bilet) / می‌خواهم (chcę)
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
    title: 'Powtórka: proszę, koncert, Sima, godzina, osiem, wieczór, zaczyna się'
    gloss: proszę / koncert / Sima / godzina / osiem / wieczór / zaczyna się
    note: To słowa powtórkowe służące do podania godziny rozpoczęcia koncertu.
    target_text: بفرمایین (proszę) / کنسرت (koncert) / سیما (Sima) / ساعت (godzina) / هشت (osiem) / شب (wieczór) / شروع می‌شود (zaczyna się)
  prs.a1.unit54.lesson04.teach.review_ask_price:
    title: 'Powtórka: ile, afgani, jest'
    gloss: ile / afgani / jest
    note: To słówka powtórkowe służące do pytania o cenę biletu i podawania jej.
    target_text: چند (ile) / افغانی (afgani) / است (jest)
  prs.a1.unit54.lesson04.teach.review_thanks_welcome:
    title: 'Powtórka: bardzo dziękuję, proszę bardzo'
    gloss: bardzo dziękuję / proszę bardzo
    note: To słówka powtórkowe służące do zakończenia dialogu.
    target_text: تشکر زیاد (bardzo dziękuję) / خواهش می‌کنم (proszę bardzo)
  prs.a1.unit54.lesson04.teach.dialogue_line1:
    title: 'Humajun: Dzień dobry. Poproszę bilet na koncert.'
    gloss: Dzień dobry. Poproszę bilet na koncert.
  prs.a1.unit54.lesson04.teach.dialogue_line2:
    title: 'Pracownik: Dzień dobry, proszę bardzo. Koncert Simy zaczyna się o ósmej wieczorem.'
    gloss: Dzień dobry, proszę bardzo. Koncert Simy zaczyna się o ósmej wieczorem.
  prs.a1.unit54.lesson04.teach.dialogue_line3:
    title: 'Humajun: Ile kosztuje bilet?'
    gloss: Ile kosztuje bilet?
  prs.a1.unit54.lesson04.teach.dialogue_line4:
    title: 'Pracownik: Bilet kosztuje 30 afgani.'
    gloss: Bilet kosztuje 30 afgani.
  prs.a1.unit54.lesson04.teach.dialogue_line5:
    title: 'Humajun: Bardzo dziękuję.'
    gloss: Wielkie dzięki.
  prs.a1.unit54.lesson04.teach.dialogue_line6:
    title: 'Pracownik: Proszę bardzo.'
    gloss: Proszę bardzo.
  prs.a1.unit54.lesson05.teach.review_this_is_in_to:
    title: 'Powtórka: ten/to, jest, w, do'
    gloss: ten/to / jest / w / do
    note: To słówka powtórkowe użyte w tekście do czytania.
    target_text: این (to) / است (jest) / در (w) / به (do)
  prs.a1.unit54.lesson05.teach.review_he_went_object_saw_was:
