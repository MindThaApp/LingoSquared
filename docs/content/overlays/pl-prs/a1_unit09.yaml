teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Sobota i niedziela
    gloss: sobota, niedziela
    note: شنبه (sobota) to w Afganistanie pierwszy dzień tygodnia; po nim następuje یکشنبه (niedziela).
    example_gloss:
    - Dzisiaj jest sobota.
    - Jutro jest niedziela.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Poniedziałek i wtorek
    gloss: poniedziałek, wtorek
    note: دوشنبه i سه‌شنبه dosłownie znaczą „drugi dzień” i „trzeci dzień” po شنبه.
    example_gloss:
    - W poniedziałek mam zajęcia.
    - We wtorek mam umówione spotkanie.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Środa i czwartek
    gloss: środa, czwartek
    note: 'چهارشنبه i پنجشنبه kontynuują ten sam wzór: „czwarty dzień” i „piąty dzień”.'
    example_gloss:
    - W środę pracuję.
    - Zobaczymy się w czwartek.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Piątek
    gloss: piątek
    note: جمعه to w Afganistanie cotygodniowy dzień wolny, pełniący podobną funkcję jak niedziela w Polsce.
    example_gloss: Piątek jest dniem wolnym.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Data
    gloss: data
    note: تاریخ to ogólne słowo oznaczające datę w kalendarzu.
    example_gloss: Jaka jest dzisiaj data?
  prs.a1.unit09.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to powszechne słowo łączące, używane w całej tej lekcji.
    target_text: و (i)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Cotygodniowy dzień wolny
    gloss: Piątek jest cotygodniowym dniem wolnym.
    note: W odróżnieniu od polskiego weekendu w sobotę i niedzielę, głównym cotygodniowym dniem wolnym w Afganistanie jest *جمعه* (piątek); czwartek bywa często półdniem pracy.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1. miesiąc)
    gloss: Hamal, pierwszy miesiąc kalendarza Hidżra Szamsi (mniej więcej koniec marca–kwiecień)
    note: حمل rozpoczyna afgański rok słoneczny i zbiega się z noworocznym świętem Nowruz.
    example_gloss: Hamal jest pierwszym miesiącem roku.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2. miesiąc)
    gloss: Sawr, drugi miesiąc (mniej więcej kwiecień–maj)
    note: ثور następuje po حمل.
    example_gloss: W Sawr jest ładna pogoda.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Dżawza (3. miesiąc)
    gloss: Dżawza, trzeci miesiąc (mniej więcej maj–czerwiec)
    note: جوزا następuje po ثور.
    example_gloss: Urodziłem się w Dżawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Kalendarz Afganistanu
    gloss: Afganistan używa kalendarza Hidżra Szamsi (słonecznego kalendarza hidżry).
    note: Jest to ten sam słoneczny system kalendarzowy, którego używa się w Iranie; różni się zarówno od kalendarza gregoriańskiego, jak i od księżycowego kalendarza hidżry.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Zapytaj, jaki jest dzisiaj dzień
    gloss: Jaki jest dzisiaj dzień?
    note: 'امروز چند شنبه است؟ dosłownie pyta: „dzisiaj jest który -szanbe”; to naturalny sposób zapytania o dzień tygodnia.'
  prs.a1.unit09.lesson03.teach.today_word:
    title: Dzisiaj
    gloss: dzisiaj
    note: امروز oznacza bieżący dzień.
    example_gloss: Jaka jest dziś data?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Podawanie pełnej daty
    gloss: Dziś jest czwartek, 15 Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است łączy dzień tygodnia, datę w postaci liczebnika porządkowego i nazwę miesiąca.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Pytanie, w jaki dzień jest wydarzenie
    gloss: W który dzień jest spotkanie?
    note: جلسه کدام روز است؟ zawiera słowo کدام (który), którym pytamy o dzień wydarzenia.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Pytanie o konkretną datę
    gloss: Którego Hamala jest poniedziałek?
    note: دوشنبه چندم حمل است؟ pyta, którym dniem miesiąca jest poniedziałek.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: '19.'
    gloss: dziewiętnasty
    note: '*نوزدهم* to liczebnik porządkowy od „dziewiętnaście”, tworzony według tego samego wzoru co *پانزدهم* (piętnasty).'
    example_gloss: Dziś jest dziewiętnasty.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun pyta o dzień spotkania
    gloss: Homayoun pyta Bashira, w który dzień jest spotkanie.
    note: جلسه کدام روز است؟ z lekcji 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir odpowiada
    gloss: Bashir mówi, że chyba w poniedziałek.
    note: فکر می‌کنم (myślę, że) łagodzi odpowiedź, bo Bashir nie jest całkiem pewny.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun pyta o dokładną datę
    gloss: Homayoun pyta, którego Hamala jest poniedziałek.
    note: دوشنبه چندم حمل است؟ z lekcji 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir podaje dokładną datę
    gloss: Bashir mówi, że poniedziałek to 19 Hamal.
    note: '*دوشنبه نوزدهم حمل است* łączy dzień, datę w postaci liczebnika porządkowego i miesiąc, zgodnie ze wzorem z lekcji 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun pyta o piątek
    gloss: Homayoun się zgadza i pyta, czy Bashir ma czas w piątek.
    note: وقت داری؟ (masz czas?) to naturalny sposób zapytania o dostępność.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir mówi, że jest zajęty
    gloss: Bashir odpowiada, że nie, w piątek jest zajęty.
    note: مصروف استم (jestem zajęty) wyjaśnia, dlaczego piątek nie pasuje.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun potwierdza poniedziałek
    gloss: Homayoun mówi, że to nie problem i zobaczy się z Bashirem w poniedziałek.
    note: مشکل نیست (nie ma problemu) łagodzi sytuację z niepasującym terminem, zanim potwierdzony zostanie pierwotny plan na poniedziałek.
