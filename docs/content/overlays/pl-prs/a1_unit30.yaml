    title: 'Homayoun: Ja codziennie korzystam z internetu.'
    gloss: Codziennie korzystam z internetu.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Świetnie!'
    gloss: Świetnie!
