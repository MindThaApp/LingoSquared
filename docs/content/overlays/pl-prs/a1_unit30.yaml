course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: słownictwo związane z technologią i urządzeniami (telefon komórkowy, komputer, internet, aplikacja, zdjęcie), zwroty o czynnościach na telefonie (wysłać wiadomość, zadzwonić, zrobić zdjęcie, pobrać aplikację), pytanie i odpowiadanie, ile razy dziennie korzystasz z telefonu, oraz dialog Zarminy i Homayouna o korzystaniu z telefonu, komputera i internetu.'
units:
  prs.a1.unit30.technology:
    title: Technologia
    description: Porozmawiaj o telefonach, komputerach, internecie i aplikacjach oraz o tym, jak często z nich korzystasz.
