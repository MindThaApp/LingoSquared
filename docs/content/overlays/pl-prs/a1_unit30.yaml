    title: 'Zarmina: Dużo korzystam z telefonu. Robię zdjęcia i wysyłam wiadomości.'
    gloss: Dużo korzystam z telefonu. Robię zdjęcia i wysyłam wiadomości.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Używasz komputera?'
    gloss: Używasz komputera?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Tak, w biurze używam komputera.'
    gloss: Tak, w biurze używam komputera.
