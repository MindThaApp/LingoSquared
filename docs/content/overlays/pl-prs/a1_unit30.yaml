    gloss: pobieranie
    note: دانلود to standardowe zapożyczenie w dari oznaczające „pobieranie”. Łączy się z کردن (robić, powtórzenie) jako czasownik złożony, np. دانلود می‌کنم (pobieram).
    example_gloss: Pobieram aplikację.
