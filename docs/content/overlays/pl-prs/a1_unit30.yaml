teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Technologia
    gloss: technologia
    note: تکنالوژی znaczy „technologia”. To standardowa pisownia afgańska, różna od irańskiej تکنولوژی.
    example_gloss: Technologia jest dobra.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Telefon komórkowy
    gloss: telefon komórkowy
    note: موبایل znaczy „telefon komórkowy”, w odróżnieniu od ogólniejszego تلفن (telefon, powtórka z lekcji 7).
    example_gloss: Mam telefon komórkowy.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Komputer
    gloss: komputer
    note: کمپیوتر znaczy „komputer”; to standardowe zapożyczenie, wspólne dla perskiego i dari.
    example_gloss: Komputer jest w biurze.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت znaczy „internet”. To standardowe zapożyczenie, wspólne dla perskiego i dari.
    example_gloss: Internet jest wolny.
  prs.a1.unit30.lesson01.teach.app_word:
    title: Aplikacja
    gloss: aplikacja
    note: اپلیکیشن znaczy „aplikacja”. To standardowe zapożyczenie, wspólne dla perskiego i dari.
    example_gloss: Ta aplikacja jest dobra.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Zdjęcie
    gloss: zdjęcie
    note: عکس znaczy „zdjęcie” lub „obraz”.
    example_gloss: To zdjęcie jest dobre.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Używać
    gloss: użycie + robić → używam
    note: استفاده (użycie) łączy się z کردن (robić, powtórzenie) i tworzy استفاده می‌کنم (używam) – to ten sam wzorzec czasownika złożonego, który pojawia się w całym kursie, np. بازی می‌کنم (lekcja 29) i ورزش می‌کنم (lekcja 29).
    target_text: استفاده (użycie) + کردن (robić) = استفاده می‌کنم (używam)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Korzystam z internetu
    gloss: Korzystam z internetu.
    note: Łączy من (ja, powtórzenie), از (z, przy użyciu; powtórzenie), انترنت oraz استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Wiadomość
    gloss: wiadomość
    note: پیام znaczy „wiadomość”.
    target_text: پیام (wiadomość)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
