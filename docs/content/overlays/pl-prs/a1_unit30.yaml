    gloss: Wysyłam wiadomość
    note: می‌فرستم znaczy „wysyłam” – to nowy czasownik, inny niż بگذارم (zostawić wiadomość) z lekcji 7.
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Dzwonię
    gloss: dzwonię
