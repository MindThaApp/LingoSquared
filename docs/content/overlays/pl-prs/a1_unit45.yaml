    target_text: این (to) / است (jest) / در (w)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: هوتل to afgańskie słowo dari oznaczające hotel, pisane przez waw – inaczej niż irańskie هتل w perskim.
    example_gloss: To jest hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Pokój
    gloss: pokój
    note: اتاق to codzienne słowo dari oznaczające pokój.
