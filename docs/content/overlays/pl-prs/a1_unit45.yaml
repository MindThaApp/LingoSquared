  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: A co z Wi-Fi?'
    gloss: A co z Wi-Fi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Recepcjonista: Tak, jest też Wi-Fi. Oto klucz, proszę.'
    gloss: Tak, jest też Wi-Fi. Oto klucz, proszę.
