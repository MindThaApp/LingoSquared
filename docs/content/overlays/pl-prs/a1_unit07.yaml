course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: odbieranie telefonu, przedstawianie się w rozmowie, proszenie o powtórzenie lub wolniejsze mówienie, zostawianie wiadomości i podstawy pisania SMS-ów.'
units:
  prs.a1.unit07.communication:
    title: Rozmowa przez telefon
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Odbieranie telefonu
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Przedstawianie się w rozmowie
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Prośba o powtórzenie lub wolniejsze mówienie
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Zostawianie wiadomości
  prs.a1.unit07.lesson05.text_messages:
    title: Czytanie i pisanie krótkiego SMS-a
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Pełna rozmowa telefoniczna
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Halo (przy telefonie)
    gloss: halo (przy telefonie)
    note: الو służy specjalnie do odebrania telefonu lub rozpoczęcia rozmowy; w bezpośrednim spotkaniu używa się słowa سلام.
    example_gloss: Halo, mówi Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Zachęcenie dzwoniącego do mówienia
    gloss: Tak, słucham.
    note: بلی، بفرمایین to naturalna odpowiedź po podniesieniu słuchawki. Zawiera uprzejme بفرمایین („proszę”, „proszę mówić”), znane już z innych miejsc kursu – nie jest to dosłowne tłumaczenie polskiego „słucham”.
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Telefon (powtórka)
    gloss: telefon
    note: تلفن pojawiło się już w lekcji o liczbach; tutaj jest tłem całej lekcji.
    example_gloss: Mój telefon jest zepsuty.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Pytanie, kto dzwoni
    gloss: Przepraszam, kto mówi?
    note: ببخشین، کی صحبت می‌کند؟ — uprzejme pytanie, kto dzwoni.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Przedstaw się
    gloss: Tu Farid.
    note: من فرید استم wprost mówi, kto dzwoni, według wzoru استم znanego z wcześniejszych jednostek.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Wyjaśnij, skąd znasz osobę, do której dzwonisz
    gloss: Jestem kolegą/koleżanką z pracy Homajuna.
    note: همکار همایون استم wyjaśnia powód telefonu; przydaje się, gdy osoba odbierająca cię nie zna.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Poproś, żeby ktoś mówił wolno
    gloss: Proszę mówić wolno.
    note: لطفاً آهسته صحبت کنین to naturalna, grzeczna prośba podczas rozmowy telefonicznej przy słabym zasięgu albo gdy ktoś dopiero uczy się języka.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Poproś o powtórzenie (powtórka)
    gloss: Czy może Pan/Pani powtórzyć?
    note: می‌توانین دوباره بگویین؟ pojawiło się w jednostce o przedstawianiu się; równie naturalnie brzmi w rozmowie telefonicznej.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Połącz obie prośby
    gloss: Proszę mówić wolno i powtórzyć.
    note: و łączy obie prośby w jedno naturalne zdanie.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Wiadomość
    gloss: wiadomość
    note: پیام to ogólne słowo oznaczające wiadomość, mówioną lub pisemną.
    example_gloss: Mam dla ciebie wiadomość.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Powiedz, że chcesz zostawić wiadomość
    gloss: Chcę zostawić wiadomość.
    note: می‌خواهم یک پیام بگذارم mówisz, gdy osoba, do której dzwonisz, jest niedostępna.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Powiedz, że zadzwonisz później
    gloss: Zadzwonię później.
    note: بعد زنگ می‌زنم to prosta alternatywa dla zostawienia wiadomości.
  prs.a1.unit07.lesson05.teach.short_message:
    title: SMS
    gloss: SMS (krótka wiadomość)
    note: پیام کوتاه dosłownie znaczy „krótka wiadomość”; to codzienne określenie SMS-a.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Przykładowa wiadomość
    gloss: Jutro spotkanie jest o dziewiątej.
    note: فردا جلسه ساعت نه است to naturalna, kompletna informacja do przekazania w wiadomości.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Potwierdź, że przekażesz wiadomość
    gloss: Przekażę.
    note: می‌رسانم potwierdza, że wiadomość dotrze do adresata.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima odbiera telefon
    gloss: Lima odbiera telefon zwrotem powitalnym.
    note: الو؟ to standardowy sposób odebrania przychodzącego połączenia.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid wita się i upewnia, z kim rozmawia
    gloss: Farid wita się i pyta, czy to Lima.
    note: الو، سلام łączy telefoniczne powitanie ze zwykłym pozdrowieniem.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima zachęca go do mówienia i pyta, kto dzwoni
    gloss: Lima zachęca go do mówienia i pyta, kto dzwoni.
    note: بلی، بفرمایین i کی صحبت می‌کند؟ pochodzą z lekcji 1 i 2.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid przedstawia się
    gloss: Farid mówi, że jest kolegą z pracy Homajuna.
    note: To wykorzystuje wzór z lekcji 2 z podaniem powiązania z pracą, który daje Limie powód, by zaufać rozmówcy.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima prosi, żeby mówił wolno
    gloss: Lima wita go i prosi, żeby mówił wolno.
    note: آهسته صحبت کنین، لطفاً powtarza prośbę z lekcji 3.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid się zgadza i prosi o możliwość zostawienia wiadomości
    gloss: Farid się zgadza i mówi, że chce zostawić wiadomość dla Homajuna.
    note: To rozszerza wzór پیام z lekcji 4 o konkretnego adresata (برای همایون, „dla Homajuna”).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima zgadza się zapisać wiadomość
    gloss: Lima zachęca go, by mówił, i mówi, że zapisuje.
    note: بفرمایین zachęca tu Farida, by mówił dalej.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid podaje treść wiadomości
    gloss: Farid prosi, by przekazała, że jutro o dziewiątej jest spotkanie.
    note: To bezpośrednio wykorzystuje przykładową wiadomość z lekcji 5.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima potwierdza i obiecuje przekazać
    gloss: Lima potwierdza szczegóły i mówi, że przekaże wiadomość.
    note: می‌رسانم kończy część rozmowy dotyczącą wiadomości, jak w lekcji 5.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid dziękuje i się żegna
    gloss: Farid bardzo dziękuje i się żegna.
    note: تشکر زیاد i خدا حافظ pochodzą ze słownictwa z wcześniejszych jednostek.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima się żegna
    gloss: Lima się żegna.
    note: خدا حافظ kończy rozmowę.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Powiedz, że ktoś zostawił wiadomość (czas przeszły)
    gloss: Farid zostawił wiadomość.
    note: گذاشت to prosty czas przeszły („zostawił”) czasownika z می‌خواهم یک پیام بگذارم z lekcji 4, gdzie بگذارم znaczy „zostawię”. Użyj go, by podsumować, co się stało po rozmowie.
    target_text: فرید پیام گذاشت (Farid zostawił wiadomość)
