    target_text: چه (co/jaki) / هر روز (codziennie)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmino, masz zwierzę domowe?'
    gloss: 'Homayoun: Zarmino, masz zwierzę domowe?'
    note: Nieformalne pytanie między przyjaciółmi, z formą داری używaną w rozmowie z kimś bliskim.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Tak, mam kota'
    gloss: 'Zarmina: Tak, mam kota.'
    note: Odpowiedź składa się z بلی i یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Jakiego koloru jest twój kot?'
    gloss: 'Homayoun: Jakiego koloru jest twój kot?'
    note: Użyto چه رنگ (jaki kolor) — tak samo jak w pytaniu przy zakupach z lekcji 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Jest biały'
    gloss: 'Zarmina: Jest biały.'
    note: 'Krótka odpowiedź: sam kolor plus است. Z pytania wiadomo, o kogo chodzi, więc پشک się nie powtarza.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Karmisz go codziennie?'
    gloss: 'Homayoun: Karmisz go codziennie?'
    note: Nowe wyrażenie غذا می‌دهی (karmisz, nieformalnie) składa się z غذا (jedzenie) + می‌دهی, nieformalnego odpowiednika می‌دهد z lekcji 18.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Tak, karmię go codziennie'
    gloss: 'Zarmina: Tak, karmię go codziennie.'
    note: هر روز (codziennie) użyte z می‌دهم (karmię, 1. osoba).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Tekst o zwierzęciu domowym
    gloss: Zarmina ma kota. Jej kot jest biały i mały. Zarmina karmi kota codziennie.
    note: Krótki tekst podsumowujący słownictwo o zwierzętach z tej lekcji. Pojawiają się w nim دارد (ma, 3. osoba, powtórzenie z lekcji 26/27) i می‌دهد (daje/karmi, 3. osoba, powtórzenie z lekcji 18).
