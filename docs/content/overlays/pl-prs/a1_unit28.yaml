course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: słownictwo o zwierzętach (pies, kot, ptak, ryba), pytanie i odpowiedź, czy masz zwierzę domowe, za pomocą حیوان خانگی دارین؟, opisywanie wielkości i koloru zwierzęcia oraz dialog Zarminy i Homayouna o posiadaniu i karmieniu kota.'
units:
  prs.a1.unit28.animals:
