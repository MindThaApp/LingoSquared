course:
  title: Dari w polskim A1
  description: 'Dari afgański dla początkujących: podstawowe określenia kierunku, wskazywanie, gdzie skręcić, układanie wielokrokowych wskazówek, grzeczne pytanie o drogę i wskazówki oparte na punktach orientacyjnych.'
units:
