teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Prosto
    gloss: prosto
    note: مستقیم opisuje ruch prosto przed siebie.
    example_gloss: Proszę iść prosto.
  prs.a1.unit06.lesson01.teach.left:
    title: Lewo
    gloss: w lewo
    note: 'چپ to kierunek: lewo.'
    example_gloss: Proszę skręcić w lewo.
  prs.a1.unit06.lesson01.teach.right:
    title: Prawo
    gloss: w prawo
    note: 'راست to kierunek: prawo.'
    example_gloss: Skręć w prawo.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Skręć (grzeczny tryb rozkazujący)
    gloss: skręcić
    note: بپیچین to grzeczny tryb rozkazujący czasownika „skręcać”, używany przy wskazywaniu komuś drogi.
    example_gloss: Skręć w prawo.
  prs.a1.unit06.lesson01.teach.to_word:
    title: Do / w stronę
    gloss: do / w stronę
    note: به łączy się z określeniem kierunku, np. به چپ (w lewo).
    target_text: به (do / w stronę)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Powiedz komuś, żeby szedł prosto
    gloss: Proszę iść prosto.
    note: مستقیم بروین to podstawowe polecenie wskazujące drogę, w grzecznej formie rozkazującej.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Powiedz komuś, żeby skręcił w lewo
    gloss: Proszę skręcić w lewo.
    note: به چپ بپیچین dosłownie znaczy „skręćcie w lewo”.
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Powiedz komuś, żeby skręcił w prawo
    gloss: Proszę skręcić w prawo.
    note: به راست بپیچین ma ten sam wzór, tylko z راست zamiast چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Najpierw
    gloss: najpierw
    note: اول wskazuje pierwszy krok we wskazówkach drogi.
    example_gloss: Najpierw idź prosto.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Potem
    gloss: wtedy
    note: بعد wprowadza kolejny krok po pierwszym.
    example_gloss: Potem skręć w lewo.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Połącz dwa kroki wskazówek
    gloss: Najpierw idź prosto, potem skręć w prawo.
    note: Dzięki اول i بعد możesz ułożyć kilka kroków wskazówek w jednym poleceniu.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Uprzejme pytanie o drogę
    gloss: Czy mógłby Pan mi powiedzieć, jak dojść na bazar?
    note: می‌توانین بگویین...؟ to uprzejmy sposób zapytania „Czy może mi Pan/Pani powiedzieć...?”, odpowiedni wobec nieznajomego, którego pytasz o drogę. بروم znaczy „idę”, więc całe zdanie pyta, jak tam dotrzeć.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Zapytaj, gdzie jest dane miejsce (powtórka)
    gloss: Przepraszam, gdzie jest apteka?
    note: ببخشین، [miejsce] کجاست؟ pojawiło się w lekcji o miejscach; to naturalny początek, zanim zapytasz o drogę.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Potwierdź, że zrozumiałeś
    gloss: Bardzo dziękuję, zrozumiałem.
    note: تشکر زیاد، فهمیدم to uprzejme zakończenie rozmowy i potwierdzenie, że wskazówki były jasne.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Biuro (powtórka)
    gloss: biuro
    note: دفتر pojawiło się już w wcześniejszej lekcji; tutaj służy jako cel podróży do ćwiczenia uprzejmego pytania o drogę.
    example_gloss: Biuro jest blisko.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Po
    gloss: po
    note: بعد از wskazuje punkt orientacyjny, który znajduje się przed celem.
    example_gloss: Po meczecie jest bank.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Naprzeciwko
    gloss: naprzeciwko
    note: روبه‌رو to nowy synonim słowa مقابل („naprzeciwko”), które pojawiło się w lekcji o miejscach; w codziennym dari używa się obu.
    example_gloss: Bank jest naprzeciwko meczetu.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Wskaż drogę za pomocą punktu orientacyjnego
    gloss: Po meczecie bank jest naprzeciwko Pana.
    note: بعد از مسجد، بانک روبه‌روی شماست łączy punkt orientacyjny (بعد از مسجد) z położeniem względem rozmówcy (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: Szkoła (powtórka)
    gloss: szkoła
    note: مکتب pojawiło się w lekcji o miejscach; tutaj służy jako punkt orientacyjny w ćwiczonym zdaniu.
    example_gloss: Szkoła jest blisko.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila pyta o drogę
    gloss: Sohaila uprzejmie pyta sprzedawcę, jak dojść do apteki.
    note: ببخشین rozpoczyna pytanie z szacunkiem, a می‌توانین بگویین؟ to uprzejma formuła pytania o drogę z lekcji 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: Sprzedawca podaje pierwszy krok
    gloss: Sprzedawca potwierdza i mówi, żeby najpierw iść prosto.
    note: اول مستقیم بروین rozpoczyna ciąg wskazówek.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila potwierdza i pyta, co dalej
    gloss: Sohaila powtarza „prosto”, żeby potwierdzić, i pyta, co dalej.
    note: بعد چطور؟ to naturalny, krótki sposób zapytania o następny krok.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Sprzedawca podaje drugi krok i punkt orientacyjny
    gloss: Sprzedawca mówi, żeby skręcić w lewo, a potem wskazuje aptekę względem meczetu i banku.
    note: To połączenie polecenia skrętu z lekcji 2 i wzoru z punktem orientacyjnym z lekcji 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila dziękuje i potwierdza, że zrozumiała
    gloss: Sohaila bardzo dziękuje i mówi, że zrozumiała.
    note: تشکر زیاد، فهمیدم kończy rozmowę, jak w lekcji 4.
  prs.a1.unit06.lesson06.teach.turn06:
    title: Skromna odpowiedź sprzedawcy i pożegnanie
    gloss: Sprzedawca zbywa podziękowania i życzy jej dobrej drogi.
    note: قابلی نداره pojawiło się w lekcji o miejscach; سفر خوش („szczęśliwej drogi”) to naturalne pożegnanie dla kogoś, kto za chwilę wyruszy w drogę.
