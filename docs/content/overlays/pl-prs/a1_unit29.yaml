course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: słownictwo sportowe (piłka nożna, siatkówka, krykiet, pływanie), pytanie i odpowiadanie, ile razy w tygodniu uprawiasz sport, mówienie, gdzie grasz lub ćwiczysz, oraz dialog Zarminy i Homayouna łączący sport, częstotliwość i miejsce.'
units:
  prs.a1.unit29.sports:
    title: Sport
    description: Opowiedz, jaki sport lub jakie ćwiczenia uprawiasz, jak często i gdzie.
