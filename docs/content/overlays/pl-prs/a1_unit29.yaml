    title: Czytanie o sporcie
  prs.a1.unit29.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Sport
    gloss: sport / ćwiczenia
    note: ورزش znaczy sport lub ćwiczenia – to ogólne słowo na każdą aktywność fizyczną.
    example_gloss: Pływanie to dobry sport.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Piłka nożna
    gloss: piłka nożna
    note: فوتبال znaczy piłka nożna.
    example_gloss: Piłka nożna to dobry sport.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Siatkówka
    gloss: siatkówka
    note: والیبال znaczy siatkówka.
    example_gloss: Siatkówka to też sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Krykiet
    gloss: krykiet
    note: کرکت znaczy krykiet – sport naprawdę popularny właśnie w Afganistanie.
    example_gloss: Krykiet to popularny sport.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Pływanie
    gloss: pływanie
    note: شنا znaczy pływanie.
    example_gloss: Pływanie to dobry sport.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Gra / robić → grać
    gloss: gra / robić → gram
    note: بازی (gra, zabawa) łączy się z کردن (robić, powtórka), tworząc بازی می‌کنم (gram) – tak samo jak wcześniej poznane پیاده‌روی می‌کنم i آشپزی می‌کنم.
    target_text: بازی (gra/zabawa) + کردن (robić) = بازی می‌کنم (gram)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Piłka nożna to sport
    gloss: Piłka nożna to sport.
    note: Łączy فوتبال، یک (jeden/pewien, powtórka), ورزش oraz است (jest, powtórka).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Ile
    gloss: ile
    note: چند służy tu do pytania o częstotliwość.
    target_text: چند (ile)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Raz (wystąpienie)
    gloss: raz (jako „jeden raz”, wystąpienie)
    note: بار znaczy „raz” w sensie liczenia powtórzeń, a nie godzinę na zegarze.
    example_gloss: Pływam raz w tygodniu.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: W / tydzień
    gloss: w / tydzień
    note: در (w, powtórka) i هفته (tydzień, powtórka z lekcji 4 i 9) razem znaczą „w tygodniu”.
    target_text: در (w) / هفته (tydzień)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: Uprawia Pan/Pani sport (form. grzecznościowa)
    gloss: uprawiacie sport / uprawia Pan/Pani sport (formalnie)
    note: ورزش می‌کنین to uprzejma, oficjalna forma „uprawiasz sport”.
    target_text: ورزش می‌کنین (uprawiacie sport / uprawia Pan/Pani sport, formalnie)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: Ile razy w tygodniu uprawia Pan/Pani sport?
    gloss: Ile razy w tygodniu uprawia Pan/Pani sport?
    note: Łączy چند بار (ile razy) + در هفته (w tygodniu) + ورزش می‌کنین (uprawia Pan/Pani sport, formalnie).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Gram w piłkę nożną dwa razy w tygodniu
    gloss: Gram w piłkę nożną dwa razy w tygodniu.
    note: دو (dwa, powtórka z lekcji 4) بار در هفته podaje częstotliwość przed nazwą sportu i konstrukcją بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: Siłownia
    gloss: siłownia
    note: باشگاه oznacza siłownię lub klub sportowy.
    example_gloss: Siłownia jest duża.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Park
    gloss: park
    note: پارک to powtórka z lekcji o planach w lekcji 13.
    target_text: پارک (park)
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: Na siłowni
    gloss: na siłowni
    note: در (w/na, powtórka) + باشگاه.
  prs.a1.unit29.lesson03.teach.dar_park:
    title: W parku
    gloss: w parku
    note: در (w, powtórka) + پارک (powtórka).
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: Pływam na siłowni
    gloss: Pływam na siłowni.
    note: Łączy در باشگاه z شنا می‌کنم (pływam), według tego samego wzorca czasownika złożonego co بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: Gram w piłkę nożną w parku
    gloss: Gram w piłkę nożną w parku.
    note: Łączy در پارک z فوتبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: Ty (nieformalnie) / robisz (nieformalnie)
    gloss: ty (nieformalnie) / ćwiczysz (nieformalnie)
    note: تو (ty, nieformalnie) i می‌کنی (robisz, nieformalnie) to powtórka; używamy ich w nieformalnym dialogu bliskich przyjaciół w tej lekcji.
    target_text: تو (ty) / می‌کنی (robisz/uprawiasz, nieformalnie)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Gdzie
    gloss: gdzie
    note: کجا znaczy „gdzie”. Jest spokrewnione z کجاست (powtórka z lekcji 5 i 6, dosłownie „gdzie jest”), ale tutaj stoi samodzielnie przed czasownikiem.
    target_text: کجا (gdzie)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: On/ona robi / gra
    gloss: on/ona robi, gra
    note: می‌کند to forma 3. osoby (powtórka) od می‌کنم i می‌کنی. W tym dialogu nie pada, ale będziesz ją ćwiczyć w tekście do czytania w następnej lekcji.
    target_text: می‌کند (on/ona robi/gra, 3. osoba)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmino, ile razy w tygodniu ćwiczysz?'
    gloss: 'Homayoun: Zarmino, ile razy w tygodniu ćwiczysz?'
    note: Nieformalne pytanie między przyjaciółmi, z nieformalną formą می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Gram w siatkówkę dwa razy w tygodniu'
    gloss: 'Zarmina: Gram w siatkówkę dwa razy w tygodniu.'
    note: Odpowiedź z użyciem دو بار در هفته i والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Gdzie grasz?'
    gloss: 'Homayoun: Gdzie grasz?'
    note: Użyto کجا (gdzie), słowa wprowadzonego w tej lekcji.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Gram na siłowni'
    gloss: 'Zarmina: Gram na siłowni.'
    note: Krótka odpowiedź z użyciem در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Co tydzień gram w piłkę nożną w parku'
    gloss: 'Homayoun: Co tydzień gram w piłkę nożną w parku.'
    note: Pojawia się هر (każdy, powtórka z lekcji 24) w połączeniu z هفته, razem هر هفته („co tydzień”).
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Świetnie!'
    gloss: 'Zarmina: Świetnie!'
    note: عالی است pozytywnie kończy rozmowę.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Czytanie o sporcie
    gloss: Zarmina gra w siatkówkę dwa razy w tygodniu. Gra na siłowni. Homayoun co tydzień gra w piłkę nożną w parku.
    note: Krótki tekst podsumowujący słownictwo sportowe z lekcji. Wprowadza می‌کند (robi, 3. osoba, powtórka) i او (on/ona, powtórka) w odniesieniu do dwóch znanych postaci.
  prs.a1.unit29.lesson06.teach.review_ama:
    title: Ale
    gloss: ale
    note: اما znaczy „ale” (powtórka z wcześniejszych lekcji).
    target_text: اما (ale)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: Lubię / czas / nie mam
    gloss: lubię / czas / nie mam
    note: دوست دارم (lubię, powtórka z lekcji 14 i 26), وقت (czas, powtórka z lekcji 11 i 26) oraz ندارم (nie mam, powtórka z lekcji 3 i 28) tworzą razem zdanie podsumowujące.
    target_text: دوست دارم (lubię) / وقت (czas) / ندارم (nie mam)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: Lubię piłkę nożną, ale nie mam czasu
    gloss: Lubię piłkę nożną, ale nie mam czasu.
    note: Łączy upodobanie i ograniczenie za pomocą اما, dzięki czemu وقت ندارم ma realne zastosowanie.
