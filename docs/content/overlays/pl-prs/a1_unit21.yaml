teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: Ubrania
    gloss: ubrania
    note: لباس oznacza „ubranie”, „ubrania” (słowo ogólne).
    example_gloss: To są nowe ubrania.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Koszula
    gloss: koszula
    note: پیراهن oznacza „koszula”.
    example_gloss: Ta koszula jest ładna.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Spodnie
    gloss: spodnie
    note: پطلون oznacza „spodnie”. To prawdziwe afgańskie słowo dari (pożyczka z angielskiego, od „pantaloon”), inne niż irańskie perskie شلوار.
    example_gloss: Te spodnie są drogie.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Buty
    gloss: buty
    note: کفش oznacza „buty”.
    example_gloss: Te buty są tanie.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Jest / są
    gloss: jest
    note: است („jest”) – znasz już z jednostki o powitaniach.
    example_gloss: To jest koszula.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Drogi
    gloss: drogi
    note: گران („drogi”) – znasz już z jednostki o zakupach.
    example_gloss: Te spodnie są drogie.
  prs.a1.unit21.lesson02.teach.rang:
    title: Kolor
    gloss: kolor
    note: رنگ oznacza „kolor”.
    example_gloss: Jakiego koloru jest ta koszula?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Czarny
    gloss: czarny
    note: سیاه oznacza „czarny”.
    example_gloss: Te spodnie są czarne.
  prs.a1.unit21.lesson02.teach.safid:
    title: Biały
    gloss: biały
    note: سفید oznacza „biały”.
    example_gloss: Ta koszula jest biała.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Czerwony
    gloss: czerwony
    note: سرخ oznacza „czerwony”. Jest to forma dari i klasycznego perskiego, a nie irańskie potoczne قرمز.
    example_gloss: Te buty są czerwone.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Rozmiar
    gloss: rozmiar
    note: اندازه oznacza „rozmiar” (rzeczownik).
    example_gloss: Jaki masz rozmiar?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: Jaki jest twój rozmiar?
    gloss: Jaki jest twój rozmiar?
    note: 'اندازه شما چند است؟ dosłownie pyta: „rozmiar wasz ile jest?”'
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: Czy to twój rozmiar?
    gloss: Czy to twój rozmiar?
    note: W zdaniu این اندازه شما است؟ pojawia się این („ten, to”), nowe słowo w tej lekcji.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Duży
    gloss: duży
    note: بزرگ („duży”) – znasz już z jednostki o porównaniach.
    example_gloss: Ta koszula jest duża.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Mały
    gloss: mały
    note: کوچک („mały”) – znasz już z jednostki o porównaniach.
    example_gloss: Te buty są małe.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: Czy mogę to przymierzyć?
    gloss: Czy mogę to przymierzyć?
    note: 'پرو کردن oznacza „przymierzać” (to francuska pożyczka, wspólna dla dari i perskiego irańskiego). می‌توانم این را پرو کنم؟ dosłownie: „mogę to przymierzanie zrobić?” W dari czasownik złożony składa się z rzeczownika i czasownika pomocniczego, a w polskim używamy jednego czasownika.'
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Tak, może Pan/Pani przymierzyć
    gloss: Tak, może Pan/Pani to przymierzyć.
    note: می‌توانین پرو کنین to grzecznościowa forma drugiej osoby tego samego czasownika.
  prs.a1.unit21.lesson04.teach.label_text:
    title: Metka z ubrania
    gloss: 'Koszula: rozmiar duży, kolor biały, 500 afgani'
    note: Prosta metka z informacją o rzeczy, rozmiarze, kolorze i cenie.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Znacznik dopełnienia
    gloss: (znacznik dopełnienia)
    note: را oznacza dopełnienie bliższe – znasz już z wzorców zdań w poprzednich jednostkach.
    example_gloss: Chcę tę koszulę.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afgani
    gloss: afgani
    note: افغانی („afgani”) – waluta, znasz już z jednostki o zakupach.
    example_gloss: To kosztuje 500 afgani.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: Jakiego koloru jest ta koszula?
    gloss: Jakiego koloru jest ta koszula?
    note: W zdaniu این پیراهن چه رنگ دارد؟ pojawia się دارد („ma”), nowe słowo w tej lekcji.
  prs.a1.unit21.lesson05.teach.turn01:
    title: Sprzedawca wita klienta
    gloss: Dzień dobry, proszę bardzo.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina pyta
    gloss: Dzień dobry. Jakiego koloru jest ta koszula?
    note: زرمینه (Zarmina) to postać, która wraca w tym kursie; poznałaś ją w jednostkach o czasie i codziennych zajęciach.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Sprzedawca odpowiada
    gloss: Mam czarną i białą.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina wybiera
    gloss: Poproszę białą koszulę. Czy ma duży rozmiar?
    note: اندازه‌اش („jej rozmiar”) – do اندازه dodano końcówkę dzierżawczą.
  prs.a1.unit21.lesson05.teach.turn05:
    title: Sprzedawca potwierdza
    gloss: Tak, jest duża. Może Pani ją przymierzyć.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina przymierza
    gloss: Dziękuję. To mój rozmiar. Ile to kosztuje?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Sprzedawca podaje cenę
    gloss: Kosztuje 500 afgani.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina się zgadza
    gloss: Bardzo dobrze, kupuję.
    note: می‌خرم to pierwsza osoba liczby pojedynczej czasu teraźniejszego czasownika خریدن („kupować”).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Sprzedawca
    gloss: sprzedawca
    note: دوکاندار („sprzedawca”, „właściciel sklepu”) – znasz już z jednostki o zakupach.
    example_gloss: Sprzedawca sprzedaje koszule.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Bardzo dobrze
    gloss: bardzo dobrze
    note: بسیار خوب („bardzo dobrze”) – znasz już z jednostki o zakupach.
    example_gloss: Bardzo dobrze, dziękuję.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Co / jaki
    gloss: co
    note: چه („co”, „jaki”) – znasz już z wzorców pytań w poprzednich jednostkach.
    example_gloss: Jakiego to jest koloru?
  prs.a1.unit21.lesson06.teach.review_va:
    title: I
    gloss: i
    note: و („i”) – znasz już z jednostki o zakupach.
    example_gloss: Kupuję koszulę i spodnie.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Jeden
    gloss: jeden
    note: یک („jeden”) – znasz już z jednostki o liczbach.
    example_gloss: Kupuję jedną koszulę.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: Do
    gloss: do
    note: به („do”) – znasz już z jednostek o kierunkach i codziennych zajęciach.
    example_gloss: Idę do sklepu.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Sklep
    gloss: sklep
    note: دوکان (sklep) -- to słowo znasz już z lekcji o zakupach.
    example_gloss: Ten sklep jest duży.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: Poszedł / poszła
    gloss: poszedł / poszła
    note: رفت (poszedł / poszła, trzecia osoba) -- ta forma jest ci już znana z lekcji o wydarzeniach z przeszłości.
    example_gloss: Zarmina poszła do sklepu.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Jego cena
    gloss: jego cena
    note: قیمتش (jego cena) -- to słowo znasz już z lekcji o zakupach.
    example_gloss: Jego cena wynosiła 500 afgani.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Podsumowanie zakupów
    gloss: Zarmina poszła do sklepu. Kupiła białą, dużą koszulę. Kosztowała 500 afgani.
    note: خرید (kupiła) i بود (był/była) to formy prostego czasu przeszłego, które znasz już z lekcji o wydarzeniach z przeszłości.
