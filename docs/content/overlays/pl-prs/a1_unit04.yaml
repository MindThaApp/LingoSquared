course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: liczenie od jednego do stu, pytanie o wiek i podawanie wieku oraz wymiana numerów telefonów.'
units:
  prs.a1.unit04.numbers:
    title: Liczenie i liczby
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Liczymy od jednego do dziesięciu
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Liczymy od jedenastu do dwudziestu
  prs.a1.unit04.lesson03.tens:
    title: Dziesiątki do stu
  prs.a1.unit04.lesson04.asking_age:
    title: Pytamy o wiek i podajemy wiek
  prs.a1.unit04.lesson05.phone_numbers:
    title: Wymiana numerów telefonów
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: Dwoje przyjaciół porównuje wiek i numery telefonów
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Jeden, dwa, trzy
    gloss: 1, 2, 3
    note: یک، دو، سه to podstawowe liczebniki perskie, wspólne dla dari i farsi.
    example_gloss:
    - Mam jednego brata.
    - Mam dwie książki.
    - Mam trzy siostry.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Cztery, pięć, sześć
    gloss: 4, 5, 6
    note: چهار to standardowa forma pisana; w mowie potocznej niektórzy skracają ją do چار, ale w tym kursie używamy pisowni standardowej.
    example_gloss:
    - Mam cztery książki.
    - Poczekaj pięć minut.
    - On/ona ma sześć książek.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Siedem, osiem
    gloss: 7, 8
    note: هفت، هشت kontynuują ciąg liczb.
    example_gloss:
    - W tygodniu jest siedem dni.
    - Przyjdę o ósmej.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Dziewięć, dziesięć
    gloss: 9, 10
    note: نه، ده kończą liczby od jednego do dziesięciu.
    example_gloss:
    - W klasie jest dziewięć osób.
    - Mam dziesięć palców.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Jedenaście, dwanaście, trzynaście
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده to osobne słowa, a nie proste złożenia z liczebników jednocyfrowych.
    example_gloss:
    - Mam zajęcia o jedenastej.
    - W roku jest dwanaście miesięcy.
    - On/ona ma trzynaście lat.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Czternaście, piętnaście, szesnaście
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده kontynuują liczby od 11 do 19.
    example_gloss:
    - Przyjdę za czternaście dni.
    - On/ona ma piętnaście książek.
    - On/ona ma szesnaście lat.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Siedemnaście, osiemnaście, dziewiętnaście
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده kończą liczby od 11 do 19.
    example_gloss:
    - On/ona ma siedemnaście książek.
    - On/ona ma osiemnaście lat.
    - Zostało dziewiętnaście dni.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Dwadzieścia
    gloss: '20'
    note: بیست otwiera serię dziesiątek, które omówimy dokładnie w następnej lekcji.
    example_gloss: Mam dwadzieścia książek.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Dwadzieścia, trzydzieści, czterdzieści
    gloss: 20, 30, 40
    note: بیست، سی، چهل to nazwy dziesiątek; każda ma odrębną formę, której nie da się przewidzieć według schematu.
    example_gloss:
    - Mam dwadzieścia lat.
    - W tym miesiącu jest trzydzieści dni.
    - On/ona ma czterdzieści lat.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Pięćdziesiąt, sześćdziesiąt
    gloss: 50, 60
    note: پنجاه، شصت to dalszy ciąg dziesiątek.
    example_gloss:
    - On/ona ma pięćdziesiąt książek.
    - Sześćdziesiąt minut to jedna godzina.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Siedemdziesiąt, osiemdziesiąt
    gloss: 70, 80
    note: هفتاد، هشتاد to dalszy ciąg dziesiątek.
    example_gloss:
    - Ta książka ma siedemdziesiąt stron.
    - On/ona ma osiemdziesiąt książek.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Dziewięćdziesiąt, sto
    gloss: 90, 100
    note: نود، صد kończą serię aż do stu.
    example_gloss:
    - On/ona ma dziewięćdziesiąt lat.
    - On/ona ma sto książek.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Łączenie dziesiątek i jedności
    gloss: 25 to dosłownie „dwadzieścia i pięć”.
    note: Słowo oznaczające dziesiątki i słowo oznaczające jedności łączy się spójnikiem و („i”), tym samym, którego używamy w tym kursie także w innych miejscach, np. بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Ile
    gloss: ile
    note: چند wprowadza pytanie o ilość, także o wiek.
    example_gloss: Ile masz lat? / Ile pan/pani ma lat?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Rok
    gloss: rok, lata
    note: سال używa się przy podawaniu wieku, dosłownie „lata”.
    example_gloss: Mam dwadzieścia lat.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Grzeczne pytanie o wiek
    gloss: Ile masz lat?
    note: چند ساله استین؟ dosłownie pyta „ile lat pan/pani ma”, używając grzecznościowej formy استین wobec osoby, której dobrze nie znasz.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Pytanie o wiek bliskiego kolegi
    gloss: Ile masz lat?
    note: چند ساله استی؟ zawiera nieformalne استی; używaj go wobec bliskiego przyjaciela lub rówieśnika, zgodnie z zasadą rejestru wprowadzoną już wcześniej w tym kursie.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Podaj swój wiek
    gloss: Mam 25 lat.
    note: بیست و پنج ساله استم składa się z liczby, ساله („-letni”) i استم („jestem”).
  prs.a1.unit04.lesson05.teach.number_word:
    title: Liczba
    gloss: numer
    note: نمبر to powszechne w codziennym afgańskim użyciu słowo (z perskiego/angielskiego) oznaczające numer, zwłaszcza numer telefonu.
    example_gloss: To jest mój numer telefonu.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Telefon
    gloss: telefon
    note: تلفن to standardowe słowo oznaczające telefon.
    example_gloss: Mój telefon jest zepsuty.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Zapytaj o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: نمبر تلفن‌تان چند است؟ używa tego samego wzoru z چند co w pytaniu o wiek, tym razem w odniesieniu do numeru telefonu.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Zero
    gloss: zero
    note: صفر jest potrzebne do odczytywania większości afgańskich numerów telefonów.
    example_gloss: Zero jest liczbą.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Podaj swój numer telefonu
    gloss: Mój numer telefonu to 079-345-678.
    note: Afgańskie numery telefonów zwykle odczytuje się w krótkich grupach, a nie cyfra po cyfrze, tak jak w tym przykładzie.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun wita się z Bashirem
    gloss: Homayoun pyta Bashira, jak się ma, używając nieformalnej formy odpowiedniej dla bliskiego kolegi.
    note: جور استی؟ pokazuje, że ci dwaj są już bliskimi przyjaciółmi, więc w całym dialogu stosuje się nieformalny styl.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir odpowiada i pyta Homayouna o wiek
    gloss: Bashir mówi, że u niego dobrze, i pyta, ile lat ma Homayoun.
    note: چند ساله استی؟ ma formę nieformalną, zgodną z ich przyjaźnią.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun odpowiada i zadaje to samo pytanie
    gloss: Homayoun mówi, że ma 28 lat, i pyta Bashira o to samo.
    note: Wzór odpowiedzi o wiek z lekcji 4 jest użyty tutaj wprost.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir odpowiada
    gloss: Bashir mówi, że ma 26 lat.
    note: Kończy wymianę zdań o wieku.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun pyta o numer telefonu Bashira
    gloss: Homayoun pyta Bashira o numer telefonu.
    note: تلفنت ma nieformalną końcówkę dzierżawczą, zgodną ze stylem reszty tego dialogu.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir podaje swój numer telefonu
    gloss: Bashir odczytuje swój numer telefonu w grupach cyfr.
    note: Numer jest odczytany w taki sam naturalny, grupowy sposób jak w przykładzie z lekcji 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun potwierdza, że zapisał numer
    gloss: Homayoun dziękuje i mówi, że zaraz go zapisze.
    note: سیف می‌کنم (od angielskiego „save”) to popularne, nieformalne afgańskie zapożyczenie z dziedziny technologii, odpowiednie w tej swobodnej rozmowie przyjaciół.
