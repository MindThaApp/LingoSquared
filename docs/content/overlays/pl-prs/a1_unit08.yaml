teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Chleb
    gloss: chleb
    note: نان to podstawa każdego afgańskiego posiłku.
    example_gloss: Chleb jest świeży.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Pilaw ryżowy
    gloss: pilaw ryżowy
    note: پلو to afgańskie danie z ryżu, charakterystycznie przyprawione i często gotowane z mięsem, marchewką lub rodzynkami — to nie jest zwykły ryż.
    example_gloss: Pilaw jest pyszny.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Gulasz mięsno-warzywny
    gloss: gulasz mięsno-warzywny
    note: قورمه to ogólna nazwa gulaszu z mięsa i warzyw, najczęściej podawanego z پلو.
    example_gloss: Jem gulasz z pilawem.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Herbata (powtórka)
    gloss: herbata
    note: چای to napój, który w Afganistanie oferuje się niemal wszędzie.
    example_gloss: Poproszę herbatę.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Woda
    gloss: woda
    note: آب to zwykłe słowo oznaczające wodę.
    example_gloss: Poproszę wodę.
  prs.a1.unit08.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to zwykły spójnik, którym łączy się kolejne potrawy na liście.
    target_text: و (i)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Uprzejme zamawianie herbaty
    gloss: Poproszę herbatę.
    note: یک چای می‌خواهم to neutralny, uprzejmy sposób zamawiania — używa się wprost می‌خواهم (chcę), bez bardziej okrężnej konstrukcji.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Proszę
    gloss: proszę
    note: لطفاً można dodać, by złagodzić niemal każdą prośbę.
    example_gloss: Proszę o pomoc.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Uprzejme zamawianie chleba
    gloss: Poproszę chleb.
    note: Ten sam wzór یک [produkt] می‌خواهم pasuje do każdego rzeczownika oznaczającego jedzenie lub napój.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Zapytaj, co jest dostępne
    gloss: Co państwo macie?
    note: چی دارین؟ to naturalny sposób, by zapytać sprzedawcę lub kelnera, jakie jedzenie jest dostępne.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Odpowiedź, co jest dostępne
    gloss: Mamy pilaw i gulasz.
    note: پلو و قورمه داریم zawiera داریم (mamy), czyli formę „my” od دارم. Sprzedawca mówi „my”, bo wypowiada się w imieniu całego lokalu.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Świeży
    gloss: świeży
    note: تازه opisuje świeżo przygotowane jedzenie.
    example_gloss: Ten chleb jest świeży.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Talerz pilawu
    gloss: talerz pilawu
    note: بشقاب (talerz) to słowo służące do liczenia jedzenia podawanego na talerzu.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Dwa chleby
    gloss: dwa chleby
    note: 'تا to ogólne słowo liczące, które stawia się po liczebniku przy większości policzalnych rzeczy — tu: dwie sztuki chleba.'
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Złożenie pełnego zamówienia
    gloss: Poproszę talerz pilawu i dwa chleby.
    note: W jednym zamówieniu można połączyć kilka określeń ilości za pomocą و (i).
  prs.a1.unit08.lesson05.teach.bill_word:
    title: Rachunek
    gloss: rachunek
    note: بل (od angielskiego „bill”) to w Afganistanie zwykłe, codzienne słowo oznaczające rachunek w restauracji.
    example_gloss: Rachunek, proszę.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Zapytaj, ile wynosi rachunek
    gloss: Ile wynosi rachunek?
    note: 'بل چند می‌شه؟ dosłownie pyta: „rachunek staje się ile?”. To naturalny, codzienny sposób zapytania o kwotę do zapłaty. می‌شه to mówiona forma od می‌شود; usłyszysz ją w sklepie, a w piśmie używa się می‌شود.'
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Powiedz, że jedzenie było pyszne
    gloss: Było bardzo smaczne.
    note: خیلی خوش‌مزه بود to naturalny komplement po posiłku.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Czajchana
    gloss: herbaciarnia / prosta jadłodajnia
    note: چایخانه to popularny, zwyczajny rodzaj prostej jadłodajni w Afganistanie, zwłaszcza w Kabulu, gdzie podaje się herbatę i proste posiłki.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Witamy (powtórka)
    gloss: witaj / witamy
    note: خوش آمدین pojawiło się już w jednostce o powitaniach; tutaj jest użyte jako powitanie sprzedawcy.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Sprzedawca wita klienta
    gloss: Sprzedawca wita klienta i pyta, na co ma ochotę.
    note: چی میل دارین؟ to grzeczne pytanie na początek, podobne w funkcji do چی دارین؟, ale ukierunkowane na życzenie klienta.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Klient pyta, co jest dostępne
    gloss: Klient wita sprzedawcę i pyta, co jest dostępne.
    note: چی دارین؟ rozpoczyna rozmowę o zamówieniu, z lekcji 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Sprzedawca wymienia, co jest dostępne
    gloss: Sprzedawca mówi, że ma pilaw i gulasz, oba świeże.
    note: هردو („oba”) potwierdza świeżość obu wymienionych dań.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Klient składa pełne zamówienie
    gloss: Klient się zgadza i zamawia talerz pilawu z gulaszem oraz herbatę.
    note: Łączy wzór podawania ilości z lekcji 4 ze słownictwem o jedzeniu z lekcji 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Sprzedawca przyjmuje zamówienie
    gloss: Sprzedawca mówi, że zaraz to przyniesie.
    note: چشم, dosłownie „na moje oko”, to uprzejmy sposób powiedzenia „oczywiście”. می‌آرم to mówiona forma od می‌آورم („przynoszę”), a همین حالا znaczy „właśnie teraz”.
  prs.a1.unit08.lesson06.teach.turn06:
    title: Klient chwali jedzenie i prosi o rachunek
    gloss: Klient mówi, że było pyszne, i pyta o rachunek.
    note: Oba zwroty bezpośrednio powtarzają słownictwo z lekcji 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Sprzedawca podaje kwotę do zapłaty
    gloss: Sprzedawca dziękuje i mówi, że wychodzi dwieście afgani.
    note: افغانی to waluta Afganistanu; دوصد („dwieście”) łączy się z nazwą waluty, by podać cenę.
