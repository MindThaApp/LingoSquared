course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: słownictwo związane z jedzeniem i piciem, uprzejme składanie zamówień, pytanie o dostępne dania, ilości oraz savoir-vivre w restauracji, w tym prośba o rachunek.'
units:
