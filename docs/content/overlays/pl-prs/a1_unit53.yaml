    gloss: ile / afgani / jest / czterdzieści / w / zdjęcie / ciekawy / bilet
    note: To słowa z powtórki (z wcześniejszych lekcji), przydatne, gdy mówisz o cenie w muzeum i o wystawie.
    target_text: چند (ile) / افغانی (afgani) / است (jest) / چهل (czterdzieści) / در (w) / عکس (zdjęcie) / جالب (ciekawy) / تکت (bilet)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Wystawa
    gloss: wystawa
    note: 'To standardowe słowo w dari i perskim oznaczające wystawę: نمایش (pokaz) plus گاه (miejsce).'
    example_gloss: Wystawa fotografii jest ciekawa.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Czytamy ogłoszenie muzeum
    gloss: W muzeum jest wystawa fotografii. Bilet kosztuje 40 afgani.
