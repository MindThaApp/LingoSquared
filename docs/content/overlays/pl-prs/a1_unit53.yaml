  prs.a1.unit53.lesson02.teach.museum_ticket_price_answer_phrase:
    title: Bilet kosztuje 40 afgani
    gloss: Bilet kosztuje 40 afgani.
    note: To zdanie podaje cenę biletu do muzeum z ogłoszenia.
