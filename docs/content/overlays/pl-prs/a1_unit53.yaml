teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Powtórka: to, jest, w, dobry'
    gloss: to / jest / w / dobry
    note: To słowa z powtórki (używane w całym kursie), przydatne, gdy mówisz o muzeum.
    target_text: این (to) / است (jest) / در (w) / خوب (dobry)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Muzeum
    gloss: muzeum
    note: To standardowe afgańskie słowo dari oznaczające muzeum; różni się od irańskiego perskiego موزه.
    example_gloss: Muzeum jest dobre.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Powtórka: pracownik'
    gloss: pracownik
    note: To samo ogólne słowo oznaczające pracownika, które poznałeś już w kinie i na basenie; tu użyte przy kasie biletowej w muzeum.
    target_text: کارمند (pracownik)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: To jest muzeum
    gloss: To jest muzeum.
    note: To zdanie łączy słowa „to”, „jest” i „muzeum” tak samo, jak robiliśmy to już w tym kursie.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: Pracownik jest w muzeum
    gloss: Pracownik jest w muzeum.
    note: To zdanie łączy słowa „pracownik”, „w” i „muzeum”.
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
