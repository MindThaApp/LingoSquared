    correct_option: matka
    distractors:
    - ojciec
    - brat
    - siostra
    accepted_answers:
    - value: matka
      status: correct
    feedback: مادر znaczy „matka”.
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: Która para oznacza „brat i siostra”?
    correct_option: برادر و خواهر
    distractors:
    - پدر و مادر
    - کاکا و عمه
    - ماما و خاله
    accepted_answers:
    - value: برادر و خواهر
      status: correct
    feedback: برادر i خواهر to „brat” i „siostra”.
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: Dopasuj każde słowo z najbliższej rodziny do jego znaczenia.
    accepted_answers:
    - value:
        مادر: matka
        پدر: ojciec
        برادر: brat
        خواهر: siostra
      status: correct
    feedback: To cztery określenia najbliższej rodziny wprowadzone w tej lekcji.
    pairs:
    - left: مادر
      right: matka
    - left: پدر
      right: ojciec
    - left: برادر
      right: brat
    - left: خواهر
      right: siostra
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: Ułóż wyrażenie w dari oznaczające „rodzice”.
    accepted_answers:
    - value:
      - پدر
      - و
      - مادر
      status: correct
    feedback: پدر و مادر dosłownie znaczy „ojciec i matka”.
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: 'Przetłumacz na dari: To jest moja mama.'
    accepted_answers:
    - value: این مادرم است
      status: correct
    - value: این مادر من است
      status: correct
    feedback: این مادرم است znaczy „To jest moja matka”.
    prompt_blocks:
    - To jest moja mama.
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: 'Przetłumacz na dari: To jest moja siostra.'
    accepted_answers:
    - value: این خواهرم است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: Końcówka dzierżawcza w خواهرم znaczy „moja”.
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: Wskaż na zdjęciu brata lub siostrę i powiedz po dari, kim jest ta osoba.
    accepted_answers:
    - value: این برادرم است
      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: Użyj این, nazwy pokrewieństwa z końcówką „mój/moja” oraz است.
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: Wybierz znaczenie słowa پدرکلان.
    correct_option: dziadek
    distractors:
    - babcia
    - ojciec
    - stryj (brat ojca)
    accepted_answers:
    - value: dziadek
      status: correct
    feedback: پدرکلان w afgańskim dari znaczy „dziadek”.
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: Jakie pokrewieństwo oznacza ماما?
    correct_option: brat matki
    distractors:
    - brat ojca
    - siostra matki
    - siostra ojca
    accepted_answers:
    - value: brat matki
      status: correct
    feedback: ماما to wyłącznie wuj, czyli brat matki.
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: Dopasuj każde słowo do jego znaczenia.
    accepted_answers:
    - value:
        کاکا: brat ojca
        عمه: siostra ojca
        ماما: brat matki
        خاله: siostra matki
        مادر: matka
        پدر: ojciec
        برادر: brat
        خواهر: siostra
      status: correct
    feedback: Dari rozróżnia ciocie i wujków ze strony ojca i ze strony matki; ostatnie cztery słowa powtarzają najbliższą rodzinę z lekcji 1.
    pairs:
    - left: کاکا
      right: brat ojca
    - left: عمه
      right: siostra ojca
    - left: ماما
      right: brat matki
    - left: خاله
      right: siostra matki
    - left: مادر
      right: matka
    - left: پدر
      right: ojciec
    - left: برادر
      right: brat
    - left: خواهر
      right: siostra
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 'Ułóż zdanie: To jest moja babcia.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من znaczy „moja babcia”.
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'Uzupełnij: Brat mojej matki jest moim wujem.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم znaczy „mój wuj (brat matki)”.
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'Przetłumacz na dari: Ona jest moją ciotką (siostrą ojca).'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: Dopuszczalny zapis ze zwykłą spacją; standardowa pisownia używa znaku ZWNJ.
    - value: او عمهٔ من است
      status: correct
    feedback: عمه oznacza siostrę ojca.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Wyjaśnij pokrewieństwo, a nie konkretną osobę: powiedz, że کاکا (stryj) to brat twojego ojca, a ماما (wuj) to brat twojej matki.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا jest ze strony ojca, ماما ze strony matki.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: Ile osób liczy ta rodzina?
    correct_option: pięć
    distractors:
    - cztery
    - sześć
    - siedem
    accepted_answers:
    - value: pięć
      status: correct
    feedback: پنج نفر znaczy „pięć osób”.
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: Wybierz znaczenie zdania من تک‌فرزند استم.
    correct_option: Jestem jedynakiem / jedynaczką.
    distractors:
    - Mam jedno dziecko.
    - Mam jednego brata.
    - Jesteśmy jedną rodziną.
    accepted_answers:
    - value: Jestem jedynakiem / jedynaczką.
      status: correct
    feedback: تک‌فرزند znaczy „jedynak / jedynaczka”.
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: Dopasuj każde słowo lub wyrażenie do jego znaczenia.
    accepted_answers:
