    pairs:
    - left: دارم
      right: mam
    - left: داریم
      right: mamy
    - left: دارین
      right: 'masz (uprzejmie: ma Pan/Pani; macie)'
    - left: فامیل
      right: rodzina
    - left: تک‌فرزند
      right: jedynak / jedynaczka
    - left: یک برادر و دو خواهر دارم
      right: Mam jednego brata i dwie siostry.
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 'Ułóż zdanie: Nasza rodzina liczy sześć osób.'
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: 'فامیل ما شش نفر است podaje liczebność rodziny: sześć osób.'
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'Uzupełnij: Mam jednego brata.'
    accepted_answers:
    - value: دارم
      status: correct
    feedback: دارم znaczy „mam”.
  prs.a1.unit03.lesson03.exercise06.translate_size:
    instruction: 'Przetłumacz na dari: Nasza rodzina liczy cztery osoby.'
    accepted_answers:
    - value: فامیل ما چهار نفر است
      status: correct
    - value: فامیل من چهار نفر است
      status: acceptable_with_note
      note: To znaczy, że w mojej rodzinie są cztery osoby.
    feedback: Użyj liczebnika ze słowem نفر است.
  prs.a1.unit03.lesson03.exercise07.describe_own:
    instruction: 'Napisz po dari dwa zdania z podanymi informacjami: twoja rodzina liczy cztery osoby i masz jednego brata.'
    accepted_answers:
    - value: فامیل من چهار نفر است. یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است، یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است و یک برادر دارم.
      status: correct
    - value: فامیل ما چهار نفر است. یک برادر دارم.
      status: correct
