teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Matka
    gloss: matka
    note: مادر to neutralne dariyjskie słowo oznaczające matkę.
    example_gloss: Moja mama jest miła.
  prs.a1.unit03.lesson01.teach.father:
    title: Ojciec
    gloss: ojciec
    note: پدر to neutralne dariyjskie słowo oznaczające ojca.
    example_gloss: Mój tata jest lekarzem.
  prs.a1.unit03.lesson01.teach.brother:
    title: Brat
    gloss: brat
    note: برادر oznacza brata.
    example_gloss: Mam jednego brata.
  prs.a1.unit03.lesson01.teach.sister:
    title: Siostra
    gloss: siostra
    note: خواهر oznacza siostrę.
    example_gloss: Moja siostra jest nauczycielką.
  prs.a1.unit03.lesson01.teach.parents:
    title: Rodzice
    gloss: ojciec i matka; rodzice
    note: Mówiąc o rodzicach, w dari zwykle używa się wyrażenia پدر و مادر.
    example_gloss: Moi rodzice mieszkają w Kabulu.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Przedstaw swoją mamę
    gloss: To jest moja mama.
    note: Końcówka ـم w słowie مادرم oznacza „mój/moja”.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Dziadek
    gloss: dziadek
    note: پدرکلان to zwykły afgański termin dariyjski; dosłownie „duży, starszy ojciec”.
    example_gloss: Mój dziadek jest stary.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Babcia
    gloss: babcia
    note: مادرکلان to zwykły afgański termin dariyjski; dosłownie „duża, starsza matka”.
    example_gloss: Moja babcia jest miła.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Brat ojca
    gloss: wuj ze strony ojca (stryj)
    note: کاکا oznacza dokładnie brata twojego ojca.
    example_gloss: Mój stryj mieszka w Heracie.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Siostra ojca
    gloss: ciotka ze strony ojca
    note: عمه oznacza dokładnie siostrę twojego ojca.
    example_gloss: Moja ciotka jest nauczycielką.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Brat matki
    gloss: wuj ze strony matki
    note: ماما oznacza w dari dokładnie brata twojej matki.
    example_gloss: Mój wuj (brat mamy) jest inżynierem.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Siostra matki
    gloss: ciotka ze strony matki
    note: خاله oznacza dokładnie siostrę twojej matki.
    example_gloss: Moja ciotka (siostra mamy) mieszka w Kabulu.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Rozróżniaj dwie strony rodziny
    gloss: Kaka i amma są ze strony ojca; mama i chala ze strony matki.
    note: W dari cztery słowa (kaka, amma, mama, chala) wskazują, z której strony rodziny pochodzi wuj lub ciotka. Po polsku „wuj” i „stryj” też to rozróżniają, ale „ciotka” obejmuje obie strony.
  prs.a1.unit03.lesson03.teach.family:
    title: Rodzina
    gloss: rodzina
    note: فامیل to zwykłe afgańskie słowo dariyjskie oznaczające rodzinę.
    example_gloss: Moja rodzina jest duża.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Uprzejmie zapytaj o liczbę członków rodziny
    gloss: Ile osób liczy Pana/Pani rodzina?
    note: ـتان oznacza uprzejme „wasz/Pana/Pani”; نفر to liczebnik pomocniczy dla osób.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Podaj liczbę członków rodziny
    gloss: Nasza rodzina liczy pięć osób.
    note: W dari liczbę członków rodziny podaje się za pomocą نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Policz rodzeństwo
    gloss: Mam jednego brata i dwie siostry.
    note: دارم oznacza „mam”. Po liczebniku rzeczownik pozostaje w liczbie pojedynczej.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Jedynak / jedynaczka
    gloss: Jestem jedynakiem / jedynaczką.
    note: استم to kabulska forma pierwszej osoby, poznawana w tym kursie.
  prs.a1.unit03.lesson03.teach.possession:
    title: Formy czasownika „mieć”
    gloss: mam; mamy; masz/macie
    note: دارین to uprzejme lub liczba mnoga „masz/ma Pan/Pani/macie” w wykształconym potocznym dari kabulskim.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Pytanie o rodzeństwo
    gloss: Czy ma Pan/Pani rodzeństwo?
    note: دارین nadaje pytaniu formę uprzejmą lub liczby mnogiej.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Zapytaj o liczbę rodzeństwa
    gloss: Ilu braci i sióstr Pan/Pani ma?
    note: چند pyta o ile (ilu).
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Zapytaj o czyichś rodziców
    gloss: Czy Pana/Pani rodzice mają się dobrze?
    note: جور استند to potoczny, afgański sposób powiedzenia, że ktoś ma się dobrze.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Odpowiedź twierdząca
    gloss: Tak, mam jednego brata.
    note: بلی to grzeczne, standardowe „tak” używane w Afganistanie.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Odpowiedź przecząca
    gloss: Nie, nie mam siostry.
    note: نخیر to uprzejme „nie”; ندارم znaczy „nie mam”.
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Uprzejme „wasz/Pana/Pani”
    gloss: Pana/Pani rodzina; Pana/Pani matka; Pana/Pani ojciec
    note: Końcówka dzierżawcza ـتان jest grzecznościowa lub oznacza liczbę mnogą. W tym kursie łączymy ją ze znakiem ZWNJ.
  prs.a1.unit03.lesson05.teach.married:
    title: Żonaty / zamężna
    gloss: żonaty / zamężna
    note: متأهل to neutralne określenie stanu cywilnego.
    example_gloss: On/ona jest żonaty/zamężna.
  prs.a1.unit03.lesson05.teach.single:
    title: Stanu wolnego
    gloss: stanu wolnego; nieżonaty / niezamężna
    note: مجرد w tym kontekście znaczy „stanu wolnego”.
    example_gloss: Jestem stanu wolnego.
  prs.a1.unit03.lesson05.teach.husband:
    title: Mąż
    gloss: mąż
    note: شوهر to zwykłe słowo oznaczające męża.
    example_gloss: Mój mąż jest inżynierem.
  prs.a1.unit03.lesson05.teach.wife:
    title: Żona
    gloss: żona
    note: خانم może znaczyć „żona” albo „pani” (grzeczna forma zwracania się do kobiety); różnicę wyznacza kontekst.
    example_gloss: Moja żona jest nauczycielką.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Grzecznie zapytaj o małżeństwo
    gloss: Czy jest Pan/Pani w związku małżeńskim?
    note: 'Dosłownie: „Czy się Pan/Pani ożenił/a?”. Końcówka ـین to kabulska forma grzecznościowa.'
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Powiedz, że jesteś w związku małżeńskim
    gloss: Tak, jestem w związku małżeńskim.
    note: استم to afgańska forma dari czasownika „być” w 1. osobie, użyta tutaj.
  prs.a1.unit03.lesson05.teach.children:
    title: Zapytaj o dzieci
    gloss: Masz dzieci?
    note: اولاد to powszechne słowo zbiorcze oznaczające czyjeś dziecko lub dzieci.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam pyta o liczbę osób w rodzinie
    gloss: Ile osób liczy Pana/Pani rodzina?
    note: Maryam używa grzecznościowej końcówki ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh opowiada o rodzeństwie
    gloss: Jest nas pięć osób. Mam jednego brata i jedną siostrę.
    note: Członków rodziny liczy się ze słowem نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam pyta o małżeństwo
    gloss: Czy jest Pani w związku małżeńskim?
    note: To pytanie jest uprzejme i neutralne w formie.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh opowiada o swoim mężu
    gloss: Tak, jestem mężatką. Mój mąż jest studentem.
    note: محصل, a nie irańskie دانشجو, to utrwalone afgańskie słowo dari oznaczające studenta.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam pyta o dzieci
    gloss: Masz dzieci?
    note: دارین zachowuje grzecznościową formę zwracania się.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Odpowiedź Fereshteh
    gloss: Nie, jeszcze nie mamy dzieci.
    note: نخیر to uprzejme „nie”; نداریم znaczy „nie mamy”.
exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
