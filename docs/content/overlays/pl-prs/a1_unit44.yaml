course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: segreguj domowe odpady do właściwych pojemników, pytaj, do którego pojemnika coś należy, i czytaj krótki harmonogram odbioru z dwóch pozycji. Porozmawiasz o śmieciach, papierze, plastiku i szkle oraz potwierdzisz z przyjacielem segregację do zielonego i niebieskiego pojemnika.'
units:
