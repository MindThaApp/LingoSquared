course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: podawanie imienia, mówienie, skąd pochodzisz i czym się zajmujesz, przedstawianie trzeciej osoby oraz poprawne używanie grzecznościowych tytułów i rejestru w sytuacji pierwszego spotkania.'
units:
  prs.a1.unit02.introductions:
    title: Przedstawianie się i poznawanie ludzi
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Pytanie o imię i podawanie własnego
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Pytanie o miasto rodzinne i kraj
  prs.a1.unit02.lesson03.occupation:
    title: Zapytaj kogoś o pracę
  prs.a1.unit02.lesson04.introducing_others:
    title: Przedstawianie trzeciej osoby
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Grzecznościowe tytuły i właściwy rejestr
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Poznawanie ludzi na przyjęciu
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Uprzejme pytanie o imię
    gloss: Jak Pan/Pani ma na imię?
    note: نام‌تان چیست؟ to forma pełna szacunku, używana wobec nowo poznanego dorosłego; kontynuuje rejestr شما/استین z Lekcji 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Podawanie imienia z است
    gloss: Mam na imię Faridun.
    note: نام من ... است to pisemny sposób podania imienia. W rozmowie zwykle mówi się نامم ... است (نامم = نام + -م, „moje imię”). Obie formy są poprawne.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Podawanie imienia z استم
    gloss: Jestem Faridun.
    note: استم stoi bezpośrednio po imieniu; to ta sama spójka dla 1. osoby w dari, którą znasz z Lekcji 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Pytanie o imię bliskiego przyjaciela
    gloss: Jak masz na imię?
    note: نامت چیست؟ zawiera nieformalną końcówkę dzierżawczą -ت. Używaj jej wobec rówieśnika lub bliskiego przyjaciela, tak jak تو/استی w Lekcji 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Słowo „imię”
    gloss: imię
    note: نام to samodzielny rzeczownik używany zarówno w pytaniu grzecznościowym, jak i nieformalnym powyżej.
    example_gloss: Jak masz na imię? (Jak się Pan/Pani nazywa?)
  prs.a1.unit02.lesson01.teach.register_note:
    title: Forma grzecznościowa a forma dla bliskiego przyjaciela
    gloss: -تان dla osoby, do której zwracasz się z szacunkiem; -ت dla bliskiego przyjaciela.
    note: Ten sam podział rejestrów co w Lekcji 1 (شما/تو) dotyczy także końcówek dzierżawczych przy نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Pytanie, skąd ktoś pochodzi
    gloss: Skąd Pan/Pani jest?
    note: شما از کجا استین؟ zachowuje grzecznościową parę شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Mówienie, że jesteś z Kabulu
    gloss: Jestem z Kabulu.
    note: من از کابل استم to wzorzec من از [miejsce] استم, używany dla każdego miasta.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Mówienie, że jesteś z Heratu
    gloss: Jestem z Heratu.
    note: هرات to duże miasto w zachodnim Afganistanie.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Mówienie, że jesteś z Mazar-i Szarif
    gloss: Jestem z Mazar-i Szarif.
    note: مزار شریف pisze się jako dwa słowa; to duże miasto w północnym Afganistanie.
  prs.a1.unit02.lesson02.teach.country:
    title: Afganistan
    gloss: Afganistan
    note: افغانستان stosuje się tak samo jak nazwę miasta, po از.
    example_gloss: Jestem z Afganistanu.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Słowo „miasto”
    gloss: miasto
    note: شهر oznacza miasto w ogóle, w odróżnieniu od nazwy konkretnego miasta.
    example_gloss: Kabul to duże miasto.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Pytanie, czym ktoś się zajmuje
    gloss: Czym się Pan/Pani zajmuje?
    note: کار شما چیست؟ dosłownie pyta „jaka jest wasza praca”; to zwykły sposób zapytania o zawód.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Lekarz
    gloss: lekarz
    note: داکتر to powszechne w dari określenie zawodu; odnosi się do lekarzy, a potocznie także do osób ze stopniem doktora.
    example_gloss: On/ona jest lekarzem.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Nauczycielka
    gloss: nauczyciel
    note: معلم to ogólne słowo oznaczające nauczyciela na każdym poziomie szkoły.
    example_gloss: On/ona jest nauczycielem/nauczycielką.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Inżynier
    gloss: inżynier
    note: مهندس oznacza inżyniera w ogólnym sensie, bez wskazania konkretnej specjalności.
    example_gloss: On/ona jest inżynierem/inżynierką.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Sklepikarz
    gloss: sklepikarz
    note: دوکاندار (od دوکان, „sklep”) to codzienne słowo w Kabulu; ten kurs używa dariyjskiej formy دوکان, a nie irańskiego مغازه.
    example_gloss: On/ona jest sklepikarzem/sklepikarką.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Podawanie zawodu
    gloss: Jestem nauczycielką.
    note: من [zawód] استم to wzorzec dla każdego zawodu poznanego w tej lekcji.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Formalne przedstawianie kogoś
    gloss: Pozwólcie, że przedstawię mojego współpracownika.
    note: اجازه بدهین همکارم را معرفی کنم to pełen szacunku sposób wprowadzenia do rozmowy trzeciej osoby.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Podawanie imienia przedstawianej osoby
    gloss: To moja koleżanka z pracy, Arezoo.
    note: این [osoba] است bezpośrednio wskazuje, kto jest przedstawiany.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Mówienie, że miło ci kogoś poznać
    gloss: Miło mi.
    note: از آشنایی با شما خوش شدم to ta sama formuła pierwszego spotkania z Lekcji 1, użyta tu ponownie po przedstawieniu trzeciej osoby.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Odpowiedź, że tobie też jest miło
    gloss: Mnie również miło.
    note: من هم خوش شدم to naturalna krótka odpowiedź.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Przyjaciel
    gloss: przyjaciel
    note: دوست to ogólne słowo oznaczające przyjaciela, bez określania stopnia zażyłości.
    example_gloss: On/ona jest moim przyjacielem/moją przyjaciółką.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Współpracownik
    gloss: współpracownik
    note: همکار oznacza osobę pracującą razem z nami; to słowo było już w dialogu w miejscu pracy w Lekcji 1.
    example_gloss: On/ona jest moim współpracownikiem/moją współpracowniczką.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Pan
    gloss: Pan
    note: جناب stawia się przed imieniem lub tytułem mężczyzny jako grzecznościową formę zwracania się; jest częste w codziennym użyciu w miastach Afganistanu.
    example_gloss: Proszę Pana, proszę bardzo.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Pani
    gloss: Pani
    note: خانم stawia się przed imieniem kobiety, niezależnie od jej stanu cywilnego.
    example_gloss: Proszę Pani, proszę bardzo.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Uprzejme zwracanie się do mężczyzny
    gloss: Pan Faridun
    note: جناب z imieniem to częsta uprzejma forma zwracania się; nie musi towarzyszyć jej nazwisko.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Uprzejme zwracanie się do kobiety
    gloss: Pani Arezoo
    note: خانم z imieniem działa tak samo jak جناب w odniesieniu do mężczyzny.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Kiedy używać którego rejestru
    gloss: Używaj شما i استین wobec osoby, którą dopiero poznałeś/poznałaś; تو i استی tylko wobec bliskiego przyjaciela.
    note: To powtórzenie zasady rejestru z Lekcji 1, odniesione wprost do sytuacji przedstawiania się.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Uprzejma prośba o powtórzenie imienia
    gloss: Czy mogłaby Pani/mógłby Pan powtórzyć imię?
    note: می‌توانین نام‌تان را دوباره بگویین؟ to naturalny, uprzejmy sposób poproszenia o powtórzenie bez wprawiania kogoś w zakłopotanie.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Przyjęcie / spotkanie towarzyskie
    gloss: przyjęcie
    note: مهمانی oznacza nieformalne spotkanie towarzyskie, czyli miejsce akcji dialogu z tej lekcji.
    example_gloss: Przyjęcie jest udane.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila rozpoczyna przedstawianie się
    gloss: 'Leila wita Faridfuna i pyta o jego imię, zwracając się do niego z szacunkiem: جناب.'
    note: Leila i Faridun jeszcze się nie znają, więc od początku używa rejestru pełnego szacunku.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun podaje swoje imię
    gloss: Faridun odwzajemnia powitanie i podaje swoje imię.
    note: سلام علیکم to pełniejsze powitanie z Lekcji 1, odpowiednie przy pierwszym spotkaniu. W rozmowie Faridun mówi نامم فریدون است (نامم = نام من, „moje imię”), czyli potoczną formą.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila pyta, skąd on pochodzi
    gloss: Leila mówi, że miło jej go poznać, i pyta, skąd pochodzi.
    note: Ta sama formuła از آشنایی با شما خوش شدم pojawiła się już w dialogu w miejscu pracy w Lekcji 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun odpowiada i zwraca pytanie
    gloss: Faridun mówi, że jest z Heratu, i zadaje Leili to samo pytanie.
    note: و شما؟ to zwięzły sposób zwrócenia pytania, jak w Lekcji 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila odpowiada i pyta o pracę
    gloss: Leila mówi, że jest z Kabulu, i pyta Faridfuna o zawód.
    note: Rozmowa naturalnie przechodzi od pochodzenia do zawodu.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun odpowiada i zwraca pytanie
    gloss: Faridun mówi, że jest inżynierem, i zadaje Leili to samo pytanie.
    note: شما چطور؟ to krótki sposób, by odpowiedzieć tym samym pytaniem, gdy wiadomo już z kontekstu, o co chodzi.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila podaje swój zawód
    gloss: Leila mówi, że jest nauczycielką.
    note: Dopełnia wymianę zdań o zawodzie wzorcem poznanym wcześniej w tej lekcji.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun przedstawia trzecią osobę
    gloss: Faridun przedstawia swoją koleżankę z pracy, Arezoo.
    note: Do rozmowy dołącza trzecia osoba; użyto formalnego zwrotu przedstawiania z lekcji 4.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila wita Arezoo
    gloss: 'Leila wita Arezoo, zwracając się do niej z szacunkiem: خانم (pani).'
    note: خوش آمدین to zwrot powitalny z lekcji 1, tutaj skierowany do osoby, którą właśnie przedstawiono.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo odpowiada
    gloss: Arezoo dziękuje Leili i mówi, że miło jej ją poznać.
    note: از دیدن شما خوشحال شدم to naturalny wariant zwrotu „miło mi cię poznać”, z użyciem دیدن (zobaczyć) zamiast آشنایی.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: Które zdanie grzecznie pyta o imię?
    correct_option: Jak się Pan/Pani nazywa? (grzecznie)
    distractors:
    - Jak masz na imię? (nieformalnie)
    - Czym się Pan/Pani zajmuje?
    - Skąd jesteś?
    accepted_answers:
    - value: Jak się Pan/Pani nazywa? (grzecznie)
      status: correct
    feedback: نام‌تان چیست؟ to uprzejma forma, stosowana wobec nowo poznanej osoby.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ można zapytać...
    correct_option: bliskiego przyjaciela
    distractors:
    - osobę nieznajomą, którą właśnie poznałeś
    - starszą osobę podczas oficjalnego wydarzenia
    - klienta w twoim sklepie
    accepted_answers:
    - value: bliskiego przyjaciela
      status: correct
    feedback: Nieformalna końcówka dzierżawcza -ت w نامت pasuje tylko do bliskiego przyjaciela lub rówieśnika, tak samo jak تو/استی w lekcji 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: O co pyta to pytanie?
    correct_option: Jak masz na imię?
    distractors:
    - Czym się Pan/Pani zajmuje?
    - Skąd jesteś?
    - A Pan/Pani?
    accepted_answers:
    - value: Jak masz na imię?
      status: correct
    feedback: نام‌تان چیست؟ pyta o imię.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: Dopasuj każde wyrażenie do jego znaczenia.
    accepted_answers:
    - value:
        نام‌تان چیست؟: Jak masz na imię? (formalnie)
        نامت چیست؟: Jak masz na imię? (nieformalnie)
        نام: imię
      status: correct
    feedback: نام‌تان i نامت różnią się tylko stopniem uprzejmości, nie znaczeniem.
    pairs:
    - left: نام‌تان چیست؟
      right: Jak masz na imię? (formalnie)
    - left: نامت چیست؟
      right: Jak masz na imię? (nieformalnie)
    - left: نام
      right: imię
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: 'Ułóż wyrazy tak, aby powiedzieć: Mam na imię Faridun.'
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: 'نام من فریدون است ma szyk: rzeczownik, a potem است.'
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: 'Przetłumacz na dari: Mam na imię Faridun.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: نام من فریدون است znaczy „mam na imię Faridun”.
  prs.a1.unit02.lesson01.exercise07.translate_own_name:
    instruction: 'Przetłumacz na dari: Mam na imię Faridun.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Zarówno نام من فریدون است, jak i فریدون استم poprawnie podaje imię; ten sam wzorzec działa dla każdego imienia.
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: Odpowiedz na głos na pytanie نام‌تان چیست؟, mówiąc, że masz na imię Faridun.
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Oba wzorce poprawnie odpowiadają na pytanie; ten sam wzorzec działa dla każdego imienia.
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: Które zdanie pyta, skąd ktoś pochodzi?
    correct_option: Skąd Pan/Pani jest?
    distractors:
    - Czym się Pan/Pani zajmuje?
    - Jak się Pan/Pani nazywa?
    - Jak się Pan/Pani ma? (grzecznie)
    accepted_answers:
    - value: Skąd Pan/Pani jest?
      status: correct
    feedback: شما از کجا استین؟ pyta o pochodzenie, używając از (z) i کجا (gdzie).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: Które z tych miejsc jest miastem w Afganistanie?
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات to miasto; افغانستان to kraj, a شهر to ogólne słowo „miasto”.
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: O co pyta to pytanie?
    correct_option: Skąd Pan/Pani jest?
    distractors:
    - Czym się Pan/Pani zajmuje?
    - Jak się Pan/Pani nazywa?
    - A Pan/Pani?
    accepted_answers:
    - value: Skąd Pan/Pani jest?
      status: correct
    feedback: شما از کجا استین؟ pyta, skąd jesteś.
  prs.a1.unit02.lesson02.exercise04.match_cities:
    instruction: Dopasuj każde miejsce do jego polskiej nazwy.
    accepted_answers:
    - value:
        کابل: Kabul
        هرات: Herat
        مزار شریف: Mazar-i Szarif
        افغانستان: Afganistan
      status: correct
    feedback: کابل، هرات i مزار شریف to miasta; افغانستان to kraj.
    pairs:
    - left: کابل
      right: Kabul
    - left: هرات
      right: Herat
    - left: مزار شریف
      right: Mazar-i Szarif
    - left: افغانستان
      right: Afganistan
  prs.a1.unit02.lesson02.exercise05.order_origin_answer:
    instruction: 'Ułóż wyrazy tak, aby powiedzieć: Jestem z Kabulu.'
    accepted_answers:
    - value:
      - من
      - از
      - کابل
      - استم
      status: correct
    feedback: 'من از کابل استم ma wzorzec: من از [miejsce] استم.'
  prs.a1.unit02.lesson02.exercise06.translate_origin_answer:
    instruction: 'Przetłumacz na dari: Jestem z Kabulu.'
    accepted_answers:
    - value: من از کابل استم
      status: correct
    - value: از کابل استم
      status: correct
