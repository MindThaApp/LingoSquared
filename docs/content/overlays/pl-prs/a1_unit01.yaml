course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: czytanie pisma perso-arabskiego, rozumienie codziennej mowy afgańskiej, wymiana rozbudowanych powitań i pełne szacunku pierwsze spotkanie w kabulskim miejscu pracy.'
units:
  prs.a1.unit01.greetings:
    title: Powitania i pierwsze spotkania
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Czytaj litery z tej lekcji
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Wymieniaj codzienne powitania
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Witaj się i żegnaj o różnych porach dnia
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Prowadź uprzejmą i swobodną rozmowę towarzyską
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Zapytaj o rodzinę i okaż szacunek gościom
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Rozpocznij pierwszy dzień w kabulskim miejscu pracy
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Litery ا، ب، ت i د
    gloss: a/ā, b, t i d
    note: Dari pisze się od prawej do lewej. Litera د nie łączy się dalej z następną literą po lewej.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Litery ر i ز
    gloss: r i z
    note: Żadna z tych liter nie łączy się z następną literą.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Litery س، ش i ص
    gloss: s, sz i s
    note: Litery س i ص oznaczają w zwykłym dari głoskę s, a ش oznacza sz.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Litery ج، چ، ح i خ
    gloss: dż, cz, h i ch
    note: چ to cz. خ to głoska zwykle zapisywana w transkrypcji jako kh, podobna do polskiego ch.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Litery ع، غ، ف i ق
    gloss: ʿ, gh, f i q
    note: Dokładna wymowa liter غ i ق bywa różna u różnych użytkowników dari; w pisowni zawsze je rozróżniaj.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Litery ک، گ، ل i م
    gloss: k, g, l i m
    note: ک to perskie kaf; w dari używa się tej formy do zapisu k. Litery ل i م łączą się z literami po obu stronach.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Litery ن، و، ه i ی
    gloss: n, w/v/o/u, h i j/długie i
    note: ی to perskie je, używane do zapisu j oraz długiej samogłoski ī. و może być spółgłoską (w/v) albo długą samogłoską (o/u).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Przeczytaj słowo zapisane ciągiem
    gloss: cześć
    note: Litery łączą się w słowo سلام. Krótkie samogłoski zwykle się pomija.
    example_gloss: Cześć! Jestem Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Uprzejme powitanie na co dzień
    gloss: Pokój z wami / witaj
    note: سلام علیکم jest powszechne w Afganistanie i pasuje zarówno do bliskich, jak i do pełnych szacunku spotkań.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Odpowiedz na powitanie
    gloss: I z wami pokój
    note: وعلیکم سلام to zwyczajowa odpowiedź na سلام علیکم. Akceptowane są też formy zawierające السلام.
  prs.a1.unit01.lesson02.teach.salam:
    title: Krótkie powitanie
    gloss: cześć
    note: سلام to elastyczne, krótsze powitanie.
    example_gloss: Cześć, jak się masz?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Witaj
    gloss: witaj / witamy
    note: خوش آمدین to pełne szacunku mówione powitanie gościa, używane wobec jednej osoby lub kilku.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Dziękuję
    gloss: dziękuję
    note: تشکر to preferowana w tym kursie afgańska forma dari. ممنون i ممنونم są zrozumiałymi wariantami drugorzędnymi.
    example_gloss: Bardzo dziękuję.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Formalna odpowiedź na podziękowanie
    gloss: nie ma za co
    note: خواهش می‌کنم to uprzejma odpowiedź używana w całym świecie perskojęzycznym. Nie jest przedstawiana jako typowo afgańska potoczna forma.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Do widzenia
    gloss: do widzenia
    note: خدا حافظ to zwyczajowe afgańskie pożegnanie w dari, często zapisywane jako dwa słowa.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Powitanie rano
    gloss: dzień dobry (rano)
    note: صبح بخیر mówi się rano.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Powitanie w ciągu dnia
    gloss: dzień dobry
    note: روز بخیر to uprzejme powitanie w ciągu dnia.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Powitanie pod koniec dnia
    gloss: dzień dobry (po południu) / dobry wieczór
    note: عصر بخیر pasuje do późniejszej części dnia.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Wyrażenie nocne
    gloss: dobranoc
    note: شب بخیر zwykle kończy wieczór, a nie rozpoczyna zwykłe spotkanie w ciągu dnia.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Uprzejme pożegnanie w ciągu dnia
    gloss: miłego dnia
    note: روز خوش to uprzejme, nieco oficjalne pożegnanie używane w wielu regionach, a nie typowo afgańska formuła potoczna.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Do następnego spotkania
    gloss: mam nadzieję, że znów się zobaczymy
    note: به امید دیدار to ciepłe, a zarazem pełne szacunku pożegnanie.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Zapytaj uprzejmie, jak się ktoś ma
    gloss: Jak się Pan/Pani miewa?
    note: استین to częsta afgańska, uprzejma forma mówiona w dari, używana z شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Zapytaj rówieśnika lub bliskiego przyjaciela
    gloss: Jak się Pan/Pani miewa?
    note: تو i استی to formy nieformalne w liczbie pojedynczej; nie używaj automatycznie tego zestawu wobec osoby starszej ani nowo poznanej.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Powiedz, że masz się dobrze
    gloss: Mam się dobrze, dziękuję.
    note: استم znaczy „jestem”. To afgańska forma mówiona w dari, używana w całym kursie.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Powiedz, że jesteś zdrowy lub że wszystko w porządku
    gloss: Wszystko w porządku.
    note: جور oznacza bycie w dobrej formie lub zdrowiu i często pojawia się w afgańskich powitaniach.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Powściągliwa odpowiedź
    gloss: Nie jest źle.
    note: بد نیستم to neutralna odpowiedź.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Zwróć pytanie
    gloss: A Pan/Pani?
    note: و شما؟ zachowuje uprzejmy i zwięzły charakter rozmowy.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Rozszerz powitanie
    gloss: Czy wszyscy mają się dobrze?
    note: Afgańskie powitania mogą trwać dalej pytaniami o domowników, zanim zaczną się sprawy służbowe.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Zapytaj o czyjąś rodzinę
    gloss: Czy twoja rodzina ma się dobrze?
    note: Pytanie o rodzinę to częsty element rozbudowanego afgańskiego powitania. W kursie forma dzierżawcza jest zapisywana jako فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Zapytaj o domowników
    gloss: Czy wszyscy w domu mają się dobrze?
    note: اهل خانه oznacza zbiorowo członków domu.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Odpowiedz na pytanie o rodzinę
    gloss: Chwała Bogu, wszyscy mają się dobrze.
    note: شکر jest tu skróconym wyrazem wdzięczności, a nie słowem „cukier” w dosłownym, kulinarnym sensie.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Odpowiedz ciepło i uprzejmie
    gloss: Obyś żył długo / dziękuję.
    note: زنده باشین to częsta afgańska formuła grzecznościowa, często mówiona w odpowiedzi na podziękowanie lub miłe słowa. باشین to pełna szacunku forma mówiona w odniesieniu do „ty/wy” grzecznościowego.
  prs.a1.unit01.lesson05.teach.own_home:
    title: Powitaj gościa ciepło
    gloss: Czuj się jak u siebie w domu.
    note: خانهٔ خودتان است zapewnia gościa, że jest mile widziany.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Wskaż miejsce honorowe
    gloss: Proszę, zajmij honorowe miejsce.
    note: W pokoju gościnnym بالا بفرمایین zaprasza gościa na bardziej honorowe miejsce, z dala od wejścia. Niekoniecznie oznacza piętro.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Najpierw witaj się ze starszymi
    gloss: Najpierw witamy starszych.
    note: Witanie się najpierw ze starszymi wyraża szacunek. Powitania fizyczne zależą od relacji, płci i okoliczności; nie zakładaj, że uścisk dłoni jest stosowny.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Biuro
    gloss: biuro
    note: دفتر oznacza biuro lub miejsce pracy.
    example_gloss: Moje biuro jest w Kabulu.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل to stolica Afganistanu i miejsce akcji tego dialogu.
    example_gloss: Mieszkam w Kabulu.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed przedstawia się jako nowy współpracownik
    gloss: Hamed mówi, że jest nowym współpracownikiem.
    note: Obaj rozmówcy to dorośli mężczyźni, współpracownicy, którzy spotykają się w biurze w Kabulu.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib wita go i pyta o imię
    gloss: Najib wita go i pyta, jak się nazywa.
    note: خوش آمدین to uprzejme, mówione powitanie w dari, odpowiednie wobec jednej osoby lub kilku.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed podaje swoje imię
    gloss: Hamed podaje swoje imię.
    note: نامم حامد است (mam na imię Hamed) to codzienna forma mówiona; نامم to نام + -م (mój). W piśmie spotkasz też نام من حامد است. Obie formy są poprawne.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib przedstawia się i mówi, że miło mu go poznać
    gloss: Najib przedstawia się i mówi, że miło mu go poznać.
    note: از آشنایی با شما خوش شدم wprost odnosi się do zawarcia znajomości, więc pasuje do pierwszego spotkania.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed odwzajemnia uprzejmość i pyta Najiba, jak się miewa
    gloss: Hamed odwzajemnia uprzejmość i pyta Najiba, jak się miewa.
    note: Nowi współpracownicy zachowują w rozmowie grzeczną formę شما i استین.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib odpowiada
    gloss: Najib mówi, że ma się dobrze, i dziękuje.
    note: جور استم، تشکر to odpowiedź na pytanie o samopoczucie, poznana wcześniej w tej lekcji.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib pyta o rodzinę Hameda
    gloss: Najib pyta o rodzinę Hameda.
    note: Pytanie o domowników wydłuża powitanie, zanim rozmówcy przejdą do pracy.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed mówi, że wszyscy mają się dobrze
    gloss: Hamed mówi, że wszyscy mają się dobrze.
    note: شکر، همه جور استند to odpowiedź na pytanie o rodzinę, poznana wcześniej w tej lekcji.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib proponuje, że przedstawi pozostałych współpracowników
    gloss: Najib proponuje, że przedstawi pozostałych współpracowników.
    note: بفرمایین zaprasza tu Hameda, by poszedł za Najibem, a nie by usiadł czy coś wziął.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed zgadza się i dziękuje
    gloss: Hamed zgadza się i dziękuje.
    note: بسیار خوب pojawia się tu jako wyraźna odpowiedź twierdząca.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib odpowiada serdecznie i wskazuje biurko Hameda
    gloss: Najib odpowiada serdecznie i wskazuje biurko Hameda.
    note: Dialog kończy się rozpoczęciem dnia pracy, a nie pożegnaniem znanym z wizyt domowych.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed dziękuje
    gloss: Hamed dziękuje.
    note: تشکر kończy rozmowę w prosty sposób.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: Jaką literą zaczyna się słowo سلام?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام zaczyna się od س. To pytanie sprawdza pisownię poznanego słowa, a nie to, które litery mogą oznaczać dźwięk s.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: Która litera oznacza dźwięk cz?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ oznacza dźwięk cz.
    prompt_blocks:
    - cz
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
    instruction: Dopasuj każdą literę do jej dźwięku.
    accepted_answers:
