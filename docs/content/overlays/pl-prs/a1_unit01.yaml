        ب: b
        ت: t
        د: d
        ر: r
        ز: z
        ش: sz
        ج: dż
        چ: cz
        ف: f
        ک: k
        گ: g
      status: correct
    feedback: Powtórka wszystkich dotychczas poznanych liter, razem z ک/گ (najnowszą parą).
    pairs:
    - left: ا
      right: a
    - left: ب
      right: b
    - left: ت
      right: t
    - left: د
      right: d
    - left: ر
      right: r
    - left: ز
      right: z
    - left: ش
      right: sz
    - left: ج
      right: dż
    - left: چ
      right: cz
    - left: ف
      right: f
    - left: ک
      right: k
    - left: گ
      right: g
  prs.a1.unit01.lesson01.exercise04.match_final_group:
    instruction: Dopasuj każdą literę do jej przybliżonego brzmienia.
    accepted_answers:
    - value:
        خ: ch
        ق: gh/q
        ل: l
        م: m
        ن: n
        و: w
        ه: h
        ی: j / długie i
      status: correct
    feedback: Te wartości dźwiękowe będą wracać w całej lekcji.
    pairs:
    - left: خ
      right: ch
    - left: ق
      right: gh/q
    - left: ل
      right: l
    - left: م
      right: m
    - left: ن
      right: n
    - left: و
      right: w
    - left: ه
      right: h
    - left: ی
      right: j / długie i
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: Ułóż litery tak, aby powstało słowo سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م tworzą słowo سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Wybierz słowo zapisane łącznie, które znaczy „cześć”.
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام znaczy „cześć”.
    prompt_blocks:
    - cześć
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Czy dari pisze się od prawej do lewej?
    options:
    - tak
    - nie
    accepted_answers:
    - value: tak
      status: correct
    feedback: Pismo dari biegnie od prawej do lewej.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Przepisz dokładnie słowo سلام.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: Poprawna pisownia to سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Co oznacza ten zwrot?
    correct_option: witaj (pokój z wami)
    distractors:
    - do widzenia
    - witaj
    - dziękuję
    accepted_answers:
    - value: witaj (pokój z wami)
      status: correct
    feedback: سلام علیکم znaczy „witaj” (dosłownie „pokój z wami”).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Przetłumacz na dari: „I wam pokój” (tradycyjna odpowiedź na سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Akceptowany wariant zapisu z odstępem.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Częsty wariant pełnej odpowiedzi.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Częsta pełna odpowiedź ze spójnikiem zapisanym osobno.
    feedback: وعلیکم سلام to tradycyjna odpowiedź; poprawne są też częste pełne formy z السلام.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Odpowiedz na سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Zrozumiałe, ale mniej odwzajemnia powitanie niż pełna odpowiedź.
    feedback: وعلیکم سلام i وعلیکم السلام to tradycyjne pełne odpowiedzi.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Wybierz znaczenie wyrażenia خوش آمدین.
    correct_option: witaj
    distractors:
    - do widzenia
    - dziękuję
    - dobranoc
    accepted_answers:
    - value: witaj
      status: correct
    feedback: خوش آمدین znaczy „witaj” (powitanie gościa).
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Przetłumacz na dari: Dziękuję.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
