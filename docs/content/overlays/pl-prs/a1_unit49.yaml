teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: 'Powtórka: to, jest, w'
    gloss: to / jest / w
    note: To słowa, które już znasz z wcześniejszych lekcji. Przydadzą się do rozmowy o pralni.
    target_text: این (to) / است (jest) / در (w)
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: 'Powtórka: ubrania, sklep, sklepikarz'
    gloss: ubrania / sklep / sklepikarz
    note: Słowo „ubrania” znasz z lekcji 21, a „sklep” i „sklepikarz” z lekcji 10.
    target_text: لباس (ubrania) / دوکان (sklep) / دوکاندار (sklepikarz)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: Pralnia
    gloss: pralnia
    note: To słowo łączy znane już słowo „ubrania” z czasownikiem „prać”. Tak po dari mówi się na pralnię lub usługę prania.
    example_gloss: To jest pralnia.
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: To jest pralnia
    gloss: To jest pralnia.
    note: To zdanie łączy słowa „to”, „sklep” i „pralnia”. Dwa rzeczowniki stoją obok siebie bez słowa łączącego, tak jak w poprzednich lekcjach.
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: Sklepikarz jest w sklepie
    gloss: Sklepikarz jest w sklepie.
    note: To zdanie łączy słowa „sklepikarz” i „sklep”.
  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: 'Powtórka: chcę, znacznik dopełnienia, żebym wyprał/a'
    gloss: chcę / (znacznik dopełnienia) / żebym wyprał/a
    note: „Żebym wyprał/a” to oczekiwana forma łączna znanego już czasownika „prać”. Tworzymy ją tak samo jak inne formy łączne w tym kursie (np. „żebym wziął/wzięła”, „żebym dostał/a”).
    target_text: می‌خواهم (chcę) / را (znacznik dopełnienia) / بشویم (żebym wyprał — tryb łączący od شستن)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: 'Powtórka: ubrania'
    gloss: ubrania
    note: To liczba mnoga słowa „ubranie”, utworzona tak samo jak liczba mnoga słowa „jabłka” we wcześniejszej lekcji.
    target_text: لباس‌ها (ubrania — liczba mnoga od لباس)
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: Chcę wyprać ubrania
    gloss: Chcę wyprać ubrania.
    note: To ten sam wzór „chcę” + forma łączna, który znasz z wypożyczania książek w bibliotece, umawiania wizyty i wynajmu roweru.
  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: 'Powtórka: jego cena, za, kilogram, ile, afgani, trzydzieści'
    gloss: jego cena / za / kilogram / ile / afgani / trzydzieści
    note: To słowa powtórzone z lekcji 4, 10 i innych wcześniejszych. Użyjesz ich, by zapytać o cenę za kilogram.
    target_text: قیمتش (jego cena) / به (za / na) / کیلو (kilogram) / چند (ile) / افغانی (afgani) / سی (trzydzieści)
  prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase:
    title: Ile kosztuje kilogram?
    gloss: Ile kosztuje kilogram?
    note: To zdanie łączy słowa poznane wcześniej w tej lekcji.
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: Kilogram kosztuje 30 afgani
    gloss: Kilogram kosztuje 30 afgani.
    note: To zdanie podaje cenę za pomocą znanych już liczb i waluty.
  prs.a1.unit49.lesson03.teach.iron_word:
    title: Prasowanie
    gloss: prasowanie
    note: To potoczne słowo po dari oznaczające prasowanie ubrań. Tutaj dotyczy usługi prania z prasowaniem w pralni.
    example_gloss: Prasuję ubrania.
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: 'Powtórka: pranie, i'
    gloss: pranie / i
    note: To powtórzone słowa, które nazywają dwie opcje usługi.
    target_text: شستن (pranie) / و (i)
  prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase:
    title: Chcę pranie i prasowanie
    gloss: Chcę pranie i prasowanie.
    note: To zdanie łączy słowa „pranie”, „i” oraz „prasowanie”.
  prs.a1.unit49.lesson03.teach.ready_word:
    title: Gotowy
    gloss: gotowy
    note: To potoczne słowo po dari oznaczające „gotowy”. Używa się go, by zapytać o termin odbioru lub go podać.
    example_gloss: Będzie gotowe jutro.
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: 'Powtórka: kiedy, jutro, godzina, pięć'
    gloss: kiedy / jutro / godzina / pięć
    note: To słowa powtórzone z lekcji 9, 16, 48 i wcześniejszych. Użyjesz ich, by zapytać o termin odbioru i go podać.
    target_text: کی (kiedy) / فردا (jutro) / ساعت (godzina) / پنج (pięć)
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: Kiedy będzie gotowe?
    gloss: Kiedy będzie gotowe?
    note: To zdanie łączy słowa „kiedy” i „gotowy”.
  prs.a1.unit49.lesson03.teach.ready_tomorrow_five_phrase:
    title: Będzie gotowe jutro o piątej
    gloss: Będzie gotowe jutro o piątej.
    note: 'To zdanie podaje termin odbioru za pomocą znanych już słów: jutro, godzina i pięć.'
  prs.a1.unit49.lesson04.teach.review_hello_want_wash:
    title: 'Powtórka: dzień dobry, chcę, żebym wyprał/a'
    gloss: dzień dobry / chcę / żebym wyprał/a
