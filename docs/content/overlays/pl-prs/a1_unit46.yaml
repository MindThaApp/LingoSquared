teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Powtórka: to, jest, w'
    gloss: to / jest / w
    note: این, است i در (używane w całym kursie) to słowa z powtórki, które przydadzą się do rozmowy o aptece.
    target_text: این (to) / است (jest) / در (w)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Apteka
    gloss: apteka
    note: دواخانه dosłownie znaczy „dom leków” – jest zbudowane tak samo jak کتابخانه („dom książek”, biblioteka, lekcja 43).
    example_gloss: To jest apteka.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: To jest apteka
    gloss: To jest apteka.
    note: این دواخانه است składa się ze słów poznanych wcześniej w tej lekcji.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Farmaceuta
    gloss: farmaceuta
    note: دواساز dosłownie znaczy „wytwórca leków”.
    example_gloss: Farmaceuta jest w aptece.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Farmaceuta jest w aptece
    gloss: Farmaceuta jest w aptece.
    note: دواساز در دواخانه است łączy słowa دواساز (farmaceuta) i دواخانه (apteka).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Powtórka: lek, chcę'
    gloss: lek / chcę
    note: دوا i می‌خواهم to słowa z powtórki, których używasz, prosząc o lek.
    target_text: دوا (lek) / می‌خواهم (chcę)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Chcę lek
    gloss: Chcę lek.
    note: دوا می‌خواهم łączy słowa دوا (lek) i می‌خواهم (chcę).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Powtórka: ból głowy, ból brzucha, mam, ma Pan/Pani'
    gloss: ból głowy / ból brzucha / mam / ma Pan/Pani (grzecznie)
    note: سردرد, دل‌درد, دارم i دارین to słowa z powtórki, których używasz, opisując objaw.
    target_text: سردرد (ból głowy) / دل‌درد (ból brzucha) / دارم (mam) / دارین (ma Pan/Pani)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Powtórka: bardzo, tak, nie'
    gloss: bardzo / tak / nie
    note: بسیار, بلی i نخیر (z wcześniejszych lekcji) to słowa z powtórki, których używasz, odpowiadając na pytanie o objaw.
    target_text: بسیار (bardzo) / بلی (tak) / نخیر (nie)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Ból zęba
    gloss: ból zęba
    note: دندان‌درد łączy دندان (ząb, lekcja 42) z tym samym członem -درد („ból”), który już znasz ze słów سردرد i دل‌درد.
    example_gloss: Boli mnie ząb.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: Strasznie boli mnie ząb
    gloss: Strasznie boli mnie ząb.
    note: بسیار دندان‌درد دارم używa słowa بسیار („bardzo”), by wzmocnić objaw.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Boli Pana/Panią głowa?
    gloss: Boli Pana/Panią głowa?
    note: سردرد دارین؟ to pytanie rozstrzygnięcia tworzone samą intonacją wznoszącą, bez osobnego słowa pytającego.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: Nie, boli mnie ząb
    gloss: Nie, boli mnie ząb.
    note: نخیر odpowiada na poprzednie pytanie, a potem podaje prawdziwy objaw.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Powtórka: chcę, jeden'
    gloss: chcę / jeden
    note: می‌خواهم i یک (z wcześniejszych lekcji) to słowa z powtórki, których używasz, prosząc o postać leku.
    target_text: می‌خواهم (chcę) / یک (jeden / pewien)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Tabletka
    gloss: tabletka
    note: قرص to codzienne dari słowo oznaczające tabletkę.
    example_gloss: Chcę tabletkę.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Chcę tabletkę
    gloss: Chcę tabletkę.
    note: یک قرص می‌خواهم łączy słowa یک („jeden”) i قرص („tabletka”).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Syrop
    gloss: syrop
    note: شربت to codzienne dari słowo oznaczające lek w płynie, czyli syrop.
    example_gloss: Chcę syrop.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Chcę syrop
    gloss: Chcę syrop.
    note: شربت می‌خواهم łączy słowa شربت (syrop) i می‌خواهم (chcę).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Powtórka: który, lek, chce Pan/Pani'
    gloss: który / lek / chce Pan/Pani (grzecznie)
    note: کدام, دوا i می‌خواهین to słowa z powtórki, których używasz, pytając klienta, czego potrzebuje.
    target_text: کدام (który) / دوا (lek) / می‌خواهین (chce Pan/Pani)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Jaki lek chce Pan/Pani?
    gloss: Jaki lek chce Pan/Pani?
    note: کدام دوا می‌خواهین؟ to grzeczne pytanie, jakie zadaje farmaceuta.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Powtórka: cześć, ból brzucha, mam'
    gloss: dzień dobry / ból brzucha / mam
    note: سلام, دل‌درد i دارم (z wcześniejszych lekcji) to słowa z powtórki, których używasz na początku dialogu.
    target_text: سلام (dzień dobry) / دل‌درد (ból brzucha) / دارم (mam)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Powtórka: lek, chce Pan/Pani, tak'
    gloss: lek / chce Pan/Pani (grzecznie) / tak
    note: دوا, می‌خواهین i بلی (z wcześniejszych lekcji) to słowa z powtórki, które pojawiają się w pytaniach farmaceuty.
    target_text: دوا (lek) / می‌خواهین (chce Pan/Pani) / بلی (tak)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Powtórka: ten, tabletka, dobry, jest'
    gloss: ten / tabletka / dobry / jest
    note: این, قرص, خوب i است (z wcześniejszych lekcji i z tej lekcji) to słowa z powtórki, których używasz, opisując lek.
    target_text: این (ta) / قرص (tabletka) / خوب (dobra) / است (jest)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Sztuka
    gloss: sztuka / dawka
    note: دانه to słowo liczące oznaczające sztukę lub dawkę, używane przy tabletkach.
    example_gloss: Trzy sztuki.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Bierz
    gloss: proszę wziąć (grzecznie)
    note: بگیرین to grzeczny tryb rozkazujący „proszę wziąć”, z tej samej rodziny końcówek -ین co کنین i بنوشین w innych miejscach kursu.
    example_gloss: Proszę brać trzy sztuki dziennie.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Powtórka: dzień, trzy, bardzo dziękuję, proszę'
    gloss: dzień / trzy / bardzo dziękuję / proszę (odpowiedź na podziękowanie)
    note: روز, سه, تشکر زیاد i خواهش می‌کنم (z wcześniejszych lekcji) to słowa z powtórki, których używasz na zakończenie dialogu.
    target_text: روز (dzień) / سه (trzy) / تشکر زیاد (bardzo dziękuję) / خواهش می‌کنم (proszę, nie ma za co)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Dzień dobry. Boli mnie brzuch.'
    gloss: Dzień dobry. Boli mnie brzuch.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Farmaceuta: Dzień dobry. Czy chce Pan lek?'
    gloss: Dzień dobry. Czy chce Pan lek?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Tak, chcę tabletkę.'
    gloss: Tak, chcę tabletkę.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Farmaceuta: Ta tabletka jest dobra. Proszę brać trzy dziennie.'
    gloss: Ta tabletka jest dobra. Proszę brać trzy dziennie.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bardzo dziękuję.'
    gloss: Wielkie dzięki.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Farmaceuta: Proszę bardzo.'
    gloss: Proszę bardzo.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Powtórka: to, jest, Homayoun, od'
    gloss: to / jest / Homayoun / od
    note: این, است i همایون to słowa z powtórki, użyte w tekście do czytania. Słowo از (z wcześniejszych lekcji, zwykle „od, z”) występuje tu z است jako orzecznik i wyraża przynależność – این نسخه از همایون است dosłownie znaczy „ta recepta jest od Homayouna”, ale naprawdę oznacza „to jest recepta Homayouna”, tak samo jak این کتاب از من است, „ta książka jest moja”.
    target_text: این (to) / است (jest) / همایون / از (od, z)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Powtórka: jeden, tabletka, dzień, trzy, sztuka, weź'
    gloss: jeden / tabletka / dzień / trzy / sztuka / weź
    note: یک, قرص, روز, سه, دانه i بگیرین (z tej lekcji) to słowa z powtórki, użyte w tekście do czytania.
    target_text: یک (jedna) / قرص (tabletka) / روز (dzień) / سه (trzy) / دانه (sztuka) / بگیرین (proszę wziąć)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Recepta
    gloss: recepta
    note: نسخه to potoczne słowo w dari oznaczające receptę lub etykietę leku.
    example_gloss: To jest recepta.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Czytanie recepty
    gloss: To jest recepta Homayouna. To jedna tabletka. Bierz trzy sztuki dziennie.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Powtórka: ale, Pan/Pani (forma grzecznościowa), ile'
    gloss: ale / Pan, Pani (forma grzecznościowa) / ile
    note: اما, شما i چند (z wcześniejszych lekcji) to słowa powtórkowe, których używamy do opisania planu dawkowania.
    target_text: اما (ale) / شما (Pan/Pani) / چند (ile)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Powtórka: rano, noc, dwa, trzy, sztuka, jest, Pana/Pani recepta'
    gloss: rano / noc / dwa / trzy / sztuka / jest / Pana/Pani recepta
    note: صبح, شب, دو, سه, دانه, است (z wcześniejszych lekcji i z tej lekcji) oraz نسخه‌تان (Pana/Pani recepta, z tym samym przyrostkiem -تان co w نام‌تان i تلفن‌تان w tym kursie) to słowa powtórkowe na zakończenie lekcji.
    target_text: صبح (rano) / شب (wieczór, noc) / دو (dwa) / سه (trzy) / دانه (sztuka) / است (jest) / نسخه‌تان (Pana/Pani recepta)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Rano dwie sztuki, ale na noc trzy sztuki
    gloss: Rano dwie sztuki, ale na noc trzy sztuki.
    note: اما zestawia dawkę poranną z dawką wieczorną.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Ile sztuk jest w Pana/Pani recepcie?
    gloss: Ile sztuk jest w Pana/Pani recepcie?
    note: Grzecznościowa forma z przyrostkiem -تان (od شما) służąca do pytania o dawkowanie z recepty.
