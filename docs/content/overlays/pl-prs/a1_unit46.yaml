  description: 'Dari kabulskie dla początkujących: poproś farmaceutę o podstawowy lek, opisz prosty objaw (ból głowy, brzucha lub zęba), poproś o tabletkę lub syrop i zrozum podstawowe zalecenie dawkowania.'
units:
  prs.a1.unit46.pharmacy:
    title: Apteka i leki
    description: Poproś farmaceutę o podstawowy lek, opisz prosty objaw, poproś o tabletkę lub syrop i zrozum podstawowe zalecenie dawkowania.
