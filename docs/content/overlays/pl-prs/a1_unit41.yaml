    title: Mój portfel się zgubił!
    gloss: Mój portfel się zgubił!
    note: کیف پولم to کیف پول z przyrostkiem dzierżawczym -م („mój”), tak samo jak خانه‌ام (mój dom) we wcześniejszych lekcjach.
