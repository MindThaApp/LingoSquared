  prs.a1.unit41.lesson01.teach.lost_word:
    title: Jest zgubiony
    gloss: jest zgubiony
    note: گم شده łączy گم (zgubiony) z شده (stał się) – to standardowy sposób, by powiedzieć, że coś się zgubiło; tak samo jak زخمی است (jest ranny) z lekcji 40.
    example_gloss: Moja torba się zgubiła.
