teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Powtórka: to, jest'
    gloss: to / jest
    note: این i است to słowa z początku kursu, których używa się, by powiedzieć, czym coś jest.
    target_text: این (to) / است (jest)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Powtórka: mam'
    gloss: mam
    note: دارم to słowo z powtórki, którego używa się, by powiedzieć, jaką rzecz posiadasz lub masz przy sobie.
    target_text: دارم (mam)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Torba
    gloss: torba
    note: خریطه to standardowe słowo oznaczające torbę w dari.
    example_gloss: Mam torbę.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portfel
    gloss: portfel
    note: کیف پول znaczy portfel; dosłownie łączy کیف (etui, torba) i پول (pieniądze).
    example_gloss: Mam portfel.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Klucz
    gloss: klucz
    note: کلید znaczy klucz.
