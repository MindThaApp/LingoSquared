    title: Odpoczynek
    gloss: odpocznij
    note: استراحت to rzeczownik „odpoczynek” – z کنین tworzy rozkaz „Odpoczywajcie!”.
    example_gloss: Proszę odpoczywać.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Robić (form. grzecznościowa)
    gloss: zrób (forma grzecznościowa rozkazu)
