teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Ból głowy
    gloss: ból głowy
    note: سردرد to złożenie słów سر (głowa) i درد (ból).
    example_gloss: Boli mnie głowa.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Gorączka
    gloss: gorączka
    note: تب znaczy „gorączka”.
    example_gloss: Mam gorączkę.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Ból brzucha
    gloss: ból brzucha
    note: 'دل‌درد to złożenie słów دل (potocznie: brzuch, żołądek) i درد (ból).'
    example_gloss: Boli mnie brzuch.
  prs.a1.unit17.lesson01.teach.have_word:
    title: Mam
    gloss: mam
    note: دارم to forma 1. osoby liczby pojedynczej czasu teraźniejszego od داشتن (mieć).
    target_text: دارم (mam)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Chory
    gloss: chory
    note: مریض znaczy „chory”.
    example_gloss: Jestem chory.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Jestem
    gloss: jestem
    note: استم to grzecznościowa forma 1. osoby czasownika „być”, zgodnie z rejestrem استم/استین używanym w tym kursie.
    target_text: استم (jestem)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Jak się czuję
    gloss: jak się czuję / mój stan
    note: حالم (حال + م) dosłownie znaczy „mój stan” – حالم خوب نیست znaczy „źle się czuję”.
    target_text: حالم (jak się czuję / mój stan)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Dobry
    gloss: dobry
    note: خوب znaczy „dobry” lub „dobrze”.
    example_gloss: Źle się czuję.
  prs.a1.unit17.lesson02.teach.not_word:
    title: Nie jest
    gloss: nie jest
    note: نیست to przeczna forma czasownika „być” – خوب نیست znaczy „nie jest dobry / nie jest dobrze”.
    target_text: نیست (nie jest)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Lekarz
    gloss: lekarz
    note: داکتر to standardowa afgańska pisownia i wymowa słowa „lekarz” (inna niż irańskie دکتر).
    example_gloss: Potrzebuję lekarza.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Lekarstwo
    gloss: lekarstwo
    note: دوا znaczy „lekarstwo”.
    example_gloss: Potrzebuję lekarstwa.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Chcę
    gloss: chcę
    note: می‌خواهم znaczy „chcę”.
    target_text: می‌خواهم (chcę)
