    title: Cześć
    gloss: cześć
    note: سلام znaczy „cześć” lub „dzień dobry”.
    example_gloss: Dzień dobry. Jestem chory.
  prs.a1.unit17.lesson05.teach.and_word:
    title: I
    gloss: i
    note: و znaczy „i” i łączy dwa elementy lub dwa zdania.
    target_text: و (i)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Krótka wiadomość o zdrowiu
    gloss: Dzień dobry. Jestem chory. Boli mnie głowa i mam gorączkę.
    note: Krótka wiadomość w pierwszej osobie opisująca dwa objawy.
  prs.a1.unit17.lesson06.teach.names:
    title: Baszir i lekarz
    gloss: Baszir, lekarz
    note: Baszir to postać, która wraca w tym kursie; do lekarza zwraca się z honorowym tytułem صاحب.
    example_gloss:
    - Jestem Baszir.
    - Jestem lekarzem.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Jak
    gloss: jak
    note: چطور znaczy „jak”.
    target_text: چطور (jak)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Jest Pan/Pani (form. grzecznościowa)
    gloss: jesteście; jest Pan/Pani
    note: استین to grzecznościowa forma 2. osoby czasownika „być”, zgodnie z rejestrem استم/استین używanym w tym kursie.
    target_text: استین (jesteś / są Państwo – forma grzecznościowa)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Podziękowanie
    gloss: dzięki
    note: تشکر znaczy „dziękuję”.
    example_gloss: Dziękuję, panie doktorze.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Pan
    gloss: panie
    note: صاحب to pełen szacunku zwrot dodawany po imieniu lub tytule – داکتر صاحب znaczy „panie doktorze”. To typowo afgański sposób zwracania się do kogoś.
    example_gloss: Dziękuję, panie doktorze.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Lekarz wita Baszira
    gloss: Dzień dobry. Jak się Pan czuje?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Baszir odpowiada
    gloss: Dzień dobry. Jestem chory. Boli mnie głowa i mam gorączkę.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Lekarz radzi
    gloss: Proszę odpocząć. Proszę pić dużo wody.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Baszir dziękuje lekarzowi
    gloss: Dziękuję, panie doktorze.
