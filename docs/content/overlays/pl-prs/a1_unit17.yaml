course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: podstawowe objawy (ból głowy, gorączka, ból brzucha), mówienie, że źle się czujesz, prośba o lekarza lub lekarstwo, czytanie krótkiej instrukcji zdrowotnej i krótkiej wiadomości opisującej objawy oraz dialog z lekarzem.'
units:
  prs.a1.unit17.health:
    title: Zdrowie
    description: Powiedz o podstawowym problemie zdrowotnym i zrozum proste, doraźne rady.
