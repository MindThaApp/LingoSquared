    target_text: کنین (zrób – forma grzecznościowa rozkazu)
  prs.a1.unit17.lesson04.teach.water_word:
    title: Woda
    gloss: woda
    note: آب znaczy „woda”.
    example_gloss: Proszę pić dużo wody.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Dużo
    gloss: dużo
    note: زیاد znaczy „dużo”.
    example_gloss: Proszę pić dużo wody.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Pić (form. grzecznościowa)
    gloss: pij (forma grzecznościowa rozkazu)
    note: بنوشین to grzecznościowy tryb rozkazujący od نوشیدن (pić).
    target_text: بنوشین (pij – forma grzecznościowa rozkazu)
