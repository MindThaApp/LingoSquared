teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Sklep
    gloss: sklep
    note: دوکان to prawdziwie afgańskie słowo na mały lokalny sklep; w irańskim perskim używa się zamiast niego słowa مغازه.
    example_gloss: Ten sklep jest duży.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Cena
    gloss: cena
    note: قیمت znaczy „cena”.
    example_gloss: Ile to kosztuje?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Tani
    gloss: tani
    note: ارزان znaczy „tani”, niedrogi.
    example_gloss: To jest tanie.
  prs.a1.unit10.lesson01.teach.gran:
    title: Drogi
    gloss: drogi
    note: گران jest przeciwieństwem ارزان.
    example_gloss: To jest drogie.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Zniżka
    gloss: zniżka
    note: تخفیف znaczy „zniżka cenowa”.
    example_gloss: Macie jakąś zniżkę?
  prs.a1.unit10.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to powszechne słowo łączące dwa krótkie zdania lub prośby.
    example_gloss: Kupuję jabłka i chleb.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Ile to kosztuje?
    gloss: Ile to jest?
    note: 'قیمتش چند است؟ dosłownie znaczy: „jego cena, ile wynosi?”'
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: To sto afgani.
    gloss: To sto afgani.
    note: صد افغانی است podaje cenę w afgani, czyli w afgańskiej walucie.
  prs.a1.unit10.lesson03.teach.sib:
    title: Jabłko / jabłka
    gloss: jabłko / jabłka
    note: سیب znaczy „jabłko”; tutaj użyte jest w znaczeniu ogólnym lub zbiorowym, na określenie jabłek na sprzedaż.
    example_gloss: Chcę kilogram jabłek.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Kilogram
    gloss: kilogram
    note: کیلو to standardowa jednostka, w której sprzedaje się produkty na wagę.
    example_gloss: Chcę kilogram jabłek.
