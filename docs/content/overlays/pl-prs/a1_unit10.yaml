    title: 'Jabłka: kilogram za sto afgani'
    gloss: 'Jabłka: kilogram za sto afgani'
    note: 'سیب: یک کیلو صد افغانی to typowa metka z ceną na targu.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Poproszę kilogram jabłek.
    gloss: Poproszę kilogram jabłek.
    note: یک کیلو سیب می‌خواهم używa tego samego wzoru یک [produkt] می‌خواهم, którego uczyłeś się przy zamawianiu jedzenia w jednostce 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Poproszę dwa kilogramy.
    gloss: Poproszę dwa kilogramy.
    note: دو کیلو می‌خواهم zastępuje liczbę jeden liczbą دو (dwa), by poprosić o większą ilość.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Może Pan dać zniżkę?
    gloss: Może Pan dać zniżkę?
    note: تخفیف می‌توانین بدهین؟ to grzeczna prośba o niższą cenę, z użyciem می‌توانین („możecie / może Pan”).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Dla Pana wyjdzie 180 afgani.
    gloss: Dla Pana wyjdzie 180 afgani.
    note: برای شما صد و هشتاد افغانی می‌شه proponuje obniżoną sumę – 20 afgani mniej niż pełne 200 za dwa kilogramy po 100.
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Proszę, służę pomocą
    gloss: proszę, służę pomocą
    note: بفرمایین to ciepłe, grzeczne powitanie i zaproszenie, którym sprzedawca wita klienta wchodzącego do sklepu.
    example_gloss: Proszę, oto cena.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Dzień dobry, proszę wejść.
    gloss: Dzień dobry, proszę wejść.
    note: Sprzedawca serdecznie wita klienta.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Dzień dobry. Ile kosztują jabłka?
    gloss: Dzień dobry. Ile kosztują jabłka?
    note: Klient pyta o cenę jabłek.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Jedno kilo kosztuje sto afgani.
    gloss: Jedno kilo kosztuje sto afgani.
    note: Sprzedawca podaje cenę za kilogram.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Poproszę dwa kilo. Może Pan zrobić zniżkę?
    gloss: Poproszę dwa kilo. Może Pan zrobić zniżkę?
    note: Klient podaje ilość i prosi o zniżkę.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Tak, dla Pana dwa kilo wyniesie 180 afgani.
    gloss: Tak, dla Pana dwa kilo wyniesie 180 afgani.
    note: Sprzedawca się zgadza i podaje cenę po zniżce – zgodną z ceną 100 afgani za kilogram z poprzedniej kwestii (200 minus 20 afgani zniżki).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Bardzo dobrze, dziękuję.
    gloss: Bardzo dobrze, dziękuję.
    note: Klient przyjmuje cenę i dziękuje sprzedawcy.
