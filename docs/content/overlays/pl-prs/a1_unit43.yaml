    title: W poniedziałek mam książkę, ale we wtorek nie
    gloss: W poniedziałek mam książkę, ale we wtorek jej nie mam.
    note: اما zestawia to, że w poniedziałek mam książkę, a we wtorek jej nie mam.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Jaką książkę chcecie?
    gloss: Jaką książkę Pan/Pani chce?
    note: Grzecznościowa wersja pytania o to, jaką książkę ktoś chce, z zaimkiem شما na początku.
