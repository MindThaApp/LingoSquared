    gloss: bardzo / dobry
    note: بسیار i خوب to słowa z powtórki, których używamy, aby coś potwierdzić.
    target_text: بسیار (bardzo) / خوب (dobry)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: Dobrze
    gloss: Dobrze.
    note: خوب است potwierdza, że coś nam odpowiada.
