  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Wypożyczanie i oddawanie książki
  prs.a1.unit43.lesson04.library_dialogue:
    title: Dialog w bibliotece
  prs.a1.unit43.lesson05.reading:
    title: Czytamy o wypożyczonej książce
  prs.a1.unit43.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Powtórka: książka, mam, jest, w'
    gloss: książka / mam / jest / w
    note: کتاب, دارم, است i در to słowa z powtórki, których używamy, mówiąc o książce.
    target_text: کتاب (książka) / دارم (mam) / است (jest) / در (w)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Powtórka: chcę, jeden/jakiś'
    gloss: chcę / jeden / jakiś
    note: می‌خواهم i یک łączymy, aby powiedzieć, czego chcemy.
    target_text: می‌خواهم (chcę) / یک (jeden / pewien)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Biblioteka
    gloss: biblioteka
    note: کتابخانه to standardowe słowo w dari oznaczające bibliotekę. Składa się z کتاب (książka) i خانه (dom).
    example_gloss: Książka jest w bibliotece.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliotekarz
    gloss: bibliotekarz
    note: کتابدار dosłownie znaczy „ten, kto trzyma książki” (kto się nimi opiekuje). Jest utworzone tak samo jak دوکاندار („sprzedawca”, lekcja 8).
    example_gloss: Bibliotekarz jest w bibliotece.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Chcę książkę
    gloss: Chcę książkę.
    note: یک کتاب می‌خواهم łączy یک (jeden/jakiś), کتاب (książka) i می‌خواهم (chcę).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Powtórka: od, znacznik dopełnienia'
    gloss: od / (znacznik dopełnienia)
    note: از (od, z) i را (oznacza dopełnienie zdania, lekcje 14 i 26) to słowa z powtórki.
    target_text: از (od / z) / را (znacznik dopełnienia)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Chcę tę książkę od bibliotekarza
    gloss: Chcę książkę od bibliotekarza.
    note: Do zdania کتاب را می‌خواهم dodajemy از کتابدار (od bibliotekarza).
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Chcę książkę od bibliotekarza
    gloss: Chcę jakąś książkę od bibliotekarza.
    note: Łączy یک (jeden/jakiś) ze zdaniem کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Powtórka: data, dzień, poniedziałek'
    gloss: data / dzień / poniedziałek
    note: تاریخ, روز i دوشنبه (wszystkie z lekcji 9) to słowa z powtórki, których używamy, pytając o termin zwrotu.
    target_text: تاریخ (data) / روز (dzień) / دوشنبه (poniedziałek)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Powtórka: który, jest'
    gloss: który / jest
    note: کدام i است to słowa z powtórki, których używamy w pytaniu.
    target_text: کدام (który) / است (jest)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Zwrot / oddawanie
    gloss: zwrot / oddawanie
    note: پس دادن dosłownie znaczy „dać z powrotem”; پس (z powrotem) łączy się z دادن (dawać).
    example_gloss: Termin zwrotu to poniedziałek.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Który dzień jest terminem zwrotu?
    gloss: Który dzień jest terminem zwrotu książki?
    note: تاریخ پس دادن کتاب کدام روز است؟ to pytanie o to, kiedy trzeba oddać wypożyczoną książkę.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: Termin zwrotu to poniedziałek
    gloss: Termin zwrotu to poniedziałek.
    note: تاریخ پس دادن دوشنبه است odpowiada na pytanie, podając konkretny dzień.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Powtórka: chcę, książka, jeden/jakiś, ten'
    gloss: chcę / książka / jeden / jakiś / ten
    note: می‌خواهم, کتاب, یک i این to słowa z powtórki, których używamy, prosząc o konkretną książkę.
    target_text: می‌خواهم (chcę) / کتاب (książka) / یک (jeden / pewien) / این (ten)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Wziąć
    gloss: wziąć
    note: بگیرم to forma trybu łączącego („żebym wziął/wzięła”), ta sama, której w lekcji 42 użyto z می‌خواهم, aby powiedzieć „chcę wziąć”.
    example_gloss: Chcę wziąć książkę.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Pożyczka
    gloss: pożyczka
    note: قرض znaczy pożyczka lub wypożyczenie; قرض گرفتن („wziąć na pożyczkę”) to zwykły sposób, by w dari powiedzieć „pożyczyć sobie, wypożyczyć”.
    example_gloss: Ta książka jest wypożyczona.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Chcę wypożyczyć książkę
    gloss: Chcę wypożyczyć książkę.
    note: می‌خواهم کتاب را قرض بگیرم łączy می‌خواهم, کتاب را, قرض i formę trybu łączącego بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Oddać
    gloss: oddać
    note: بدهم to forma trybu łączącego od دادن (dawać); z پس (z powrotem) znaczy „oddać, zwrócić”.
    example_gloss: Chcę to oddać.
