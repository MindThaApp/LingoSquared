course:
  title: Dari w polskim A1
  description: 'Kabulski dari dla początkujących: wypożyczanie i oddawanie prostej rzeczy w bibliotece, pytanie o termin zwrotu i czytanie krótkiego tekstu o wypożyczonej książce — zapytasz, którą książkę ktoś chce, podasz i potwierdzisz termin zwrotu oraz zrozumiesz prostą rozmowę w bibliotece.'
units:
  prs.a1.unit43.library:
    title: Biblioteka
    description: Poproś o książkę, wypożycz ją i oddaj, zapytaj o termin zwrotu i potwierdź go oraz przeczytaj krótki tekst o wypożyczonej książce.
