    gloss: Homayoun / on/ona / on/ona ma
    note: همایون, او i دارد to słowa z powtórki użyte w tekście do czytania.
    target_text: همایون (Homayoun) / او (on/ona) / دارد (on/ona ma)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Czytanie o wypożyczonej książce
    gloss: Homayoun ma książkę. Jego książka jest z biblioteki. Termin zwrotu jego książki to poniedziałek. Homayoun jest szczęśliwy.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Powtórka: nie mam, ale, Pan/Pani/Państwo'
    gloss: nie mam / ale / Pan/Pani/Państwo
    note: ندارم, اما i شما to słowa z powtórki użyte do zestawienia dwóch dni.
    target_text: ندارم (nie mam) / اما (ale) / شما (Pan/Pani, forma grzecznościowa)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Powtórka: wtorek'
    gloss: wtorek
    note: سه‌شنبه to słowo z powtórki.
    target_text: سه‌شنبه (wtorek)
