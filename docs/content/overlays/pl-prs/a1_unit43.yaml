    note: بسیار, تشکر زیاد i خواهش می‌کنم to słowa z powtórki użyte w dialogu.
    target_text: بسیار (bardzo) / تشکر زیاد (wielkie dzięki) / خواهش می‌کنم (proszę bardzo)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Dzień dobry. Chcę wypożyczyć książkę.'
    gloss: Dzień dobry. Chcę wypożyczyć książkę.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Bibliotekarz: Dzień dobry. Jaką książkę Pan chce?'
    gloss: Dzień dobry. Jaką książkę Pan chce?
    note: می‌خواهین to grzecznościowa forma liczby mnogiej „chcecie” (w znaczeniu „Pan/Pani chce”).
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Chcę tę książkę.'
    gloss: Chcę tę książkę.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Bibliotekarz: Dobrze. Termin zwrotu to poniedziałek.'
    gloss: Dobrze. Termin zwrotu to poniedziałek.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bardzo dobrze. Dziękuję bardzo.'
    gloss: Bardzo dobrze. Dziękuję bardzo.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Bibliotekarz: Proszę bardzo.'
    gloss: Proszę bardzo.
