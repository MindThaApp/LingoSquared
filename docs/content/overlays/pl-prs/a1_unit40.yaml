course:
  title: Dari w polskim A1
  description: 'Kabulski dari dla początkujących: rozpoznasz podstawową sytuację zagrożenia, poprosisz o pomoc, powiesz, czy potrzebujesz policji, karetki czy straży pożarnej, opiszesz obrażenia i przeczytasz krótki tekst o sytuacji awaryjnej.'
units:
  prs.a1.unit40.emergencies:
    title: Sytuacje awaryjne
    description: Rozpoznaj podstawową sytuację zagrożenia, poproś o pomoc i powiedz, jakiej pomocy potrzebujesz (policja, karetka lub straż pożarna).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Pomoc w nagłych wypadkach
  prs.a1.unit40.lesson02.asking_for_help:
    title: Prośba o pomoc
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Ranny i krwawi
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Dialog w nagłym wypadku
  prs.a1.unit40.lesson05.emergency_reading:
    title: Czytanie o pomocy w nagłych wypadkach
  prs.a1.unit40.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Powtórka: pomoc, chcę'
    gloss: pomoc / chcę
    note: Słowa کمک i می‌خواهم to powtórka; w tej lekcji służą do określenia, jakiej pomocy potrzebujesz.
    target_text: کمک (pomoc) / می‌خواهم (chcę)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Powtórka: to, jest'
    gloss: to / jest
    note: Słowa این i است to wcześniej poznane słowa; służą do powiedzenia, z jaką sytuacją mamy do czynienia.
    target_text: این (to/ten) / است (jest)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Nagły wypadek
    gloss: nagły wypadek
    note: اضطراری oznacza „nagły wypadek” lub „pilny”.
    example_gloss: To nagły wypadek.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Policja
    gloss: policja
    note: پولیس to standardowe afgańskie słowo dari oznaczające policję; podobnie jak w polskim „policja”, pochodzi z tego samego międzynarodowego źródła.
    example_gloss: Potrzebuję policji.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Karetka
    gloss: pogotowie, karetka
    note: امبولانس oznacza karetkę.
    example_gloss: Potrzebuję karetki.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Ogień
    gloss: ogień, pożar
    note: آتش oznacza ogień.
    example_gloss: Pali się.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Straż pożarna
    gloss: straż pożarna
    note: اطفائیه to codzienne kabulskie określenie straży pożarnej.
    example_gloss: Potrzebuję straży pożarnej.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: To nagły wypadek! Potrzebuję policji!
    gloss: To nagły wypadek! Potrzebuję policji!
    note: این اضطراری است składa się z این (to), اضطراری (nagły wypadek) i است (jest).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Powtórka: czy możesz, zrób (uprzejmy rozkaz), do/dla, szybko'
    gloss: czy możecie / zróbcie / do/dla / szybko
    note: Słowa می‌توانین, کنین, به i زود (z wcześniejszych lekcji) łączą się z innymi, tworząc uprzejme prośby i polecenia.
    target_text: می‌توانین (czy możecie / czy może Pan/Pani) / کنین (zróbcie – uprzejmy rozkaz) / به (do/dla) / زود (szybko)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Mnie
    gloss: mnie
    note: 'مه ره to mówiona forma kabulskiego dari od مرا („mnie” jako dopełnienie): مه to mówiona forma من, a ره to mówiona forma znacznika dopełnienia را. W piśmie zwykle zobaczysz مرا, co też jest akceptowane.'
    example_gloss: Możesz mi pomóc?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Czy możesz mi pomóc?
    gloss: Czy możesz mi pomóc?
    note: Prawdziwe, często używane zdanie w dari, którym bezpośrednio prosi się o pomoc.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Zadzwoń! (tryb rozkazujący)
    gloss: zadzwoń
    note: زنگ بزنین to uprzejma forma rozkazująca czasownika زنگ زدن (zadzwonić), oparta na już poznanym زنگ می‌زنم (dzwonię).
    example_gloss: Zadzwoń na policję!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Przyjdź! (tryb rozkazujący)
    gloss: przyjdź
    note: بیایین to uprzejma forma rozkazująca czasownika آمدن (przychodzić).
    example_gloss: Przyjdź szybko!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Zadzwoń po karetkę!
    gloss: Zadzwoń po karetkę!
    note: به (do/dla) plus امبولانس (karetka) plus rozkazujące زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Powtórka: on/ona, on/ona ma'
    gloss: on/ona / on/ona ma
    note: Słowa او i دارد to wcześniej poznane formy; służą do opisania stanu innej osoby w nagłym wypadku.
    target_text: او (on/ona) / دارد (on/ona ma)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Ranny
    gloss: ranny
    note: زخمی oznacza „ranny”.
    example_gloss: On/Ona jest ranny/ranna.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Krwawienie
    gloss: krwawienie
    note: خون‌ریزی oznacza krwawienie.
    example_gloss: On/Ona krwawi.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: On/Ona jest ranny/ranna! Potrzebuję karetki!
    gloss: On/Ona jest ranny/ranna! Potrzebuję karetki!
    note: Łączy زخمی z już poznanym امبولانس می‌خواهم.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: On/Ona krwawi! Przyjdź szybko!
    gloss: On/Ona krwawi! Przyjdź szybko!
    note: Łączy خون‌ریزی z już poznanym زود بیایین.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Powtórka: co, on/ona przychodzi, dzwonię, bardzo dziękuję'
    gloss: co / on/ona przychodzi / dzwonię / bardzo dziękuję
    note: Słowa چه, می‌آید, زنگ می‌زنم i تشکر زیاد to powtórka; pojawiają się w dialogu o nagłym wypadku.
    target_text: چه (co) / می‌آید (on/ona przychodzi) / زنگ می‌زنم (dzwonię) / تشکر زیاد (wielkie dzięki)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmino, pomocy! Pomocy!'
    gloss: Zarmino, pomocy! Pomocy!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Co?'
    gloss: Co?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: On/Ona jest ranny/ranna! Krwawi!'
    gloss: On/Ona jest ranny/ranna! Krwawi!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Potrzebuję karetki. Dzwonię!'
    gloss: Potrzebuję karetki. Dzwonię!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bardzo dziękuję!'
    gloss: Dziękuję bardzo!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Karetka jedzie szybko.'
    gloss: Karetka jedzie szybko.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Powtórka: jeden, osoba, miasto, on/ona robi, w'
    gloss: jeden / osoba / miasto / on/ona robi / w
    note: یک, نفر, شهر, می‌کند i در to słowa z powtórki, których użyto w tym tekście do czytania.
    target_text: یک (jeden) / نفر (osoba) / شهر (miasto) / می‌کند (on/ona robi) / در (w/na)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Tekst o nagłym wypadku
    gloss: W mieście jest ranna osoba. Krwawi. Homayoun pomaga. Nadjeżdża karetka.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Powtórka: telefon, nie mam, ale, Pan/Pani'
    gloss: telefon / nie mam / ale / Pan/Pani
    note: تلفن, ندارم, اما i شما to słowa z powtórki, które służą do zestawienia potrzeby z ograniczeniem i do zadania pytania w formie grzecznościowej.
    target_text: تلفن (telefon) / ندارم (nie mam) / اما (ale) / شما (Pan/Pani, forma grzecznościowa)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Potrzebuję pomocy, ale nie mam telefonu
    gloss: Potrzebuję pomocy, ale nie mam telefonu.
    note: اما przeciwstawia potrzebę pomocy temu, że nie ma się telefonu, by ją wezwać.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Pomożesz?
    gloss: Czy może Pan/Pani pomóc?
    note: Grzecznościowa wersja z شما, używana, gdy prosimy kogoś o pomoc wprost i uprzejmie.
