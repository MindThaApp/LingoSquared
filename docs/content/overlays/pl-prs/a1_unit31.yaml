course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: słownictwo o edukacji i nauce (uniwersytet, szkoła, kierunek studiów, student, lekcja), nazywanie kierunku studiów (medycyna, prawo, ekonomia, literatura), pytanie o to, gdzie się uczysz, i odpowiadanie na nie oraz dialog Karima i Parwin o nauce i o tym, co o niej myślą.'
units:
  prs.a1.unit31.education:
    title: Edukacja
    description: Opowiedz, czego się uczysz, gdzie się uczysz i co o tym sądzisz.
