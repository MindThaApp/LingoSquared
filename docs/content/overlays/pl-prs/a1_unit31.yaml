  prs.a1.unit31.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Edukacja
    gloss: edukacja / studia
    note: تحصیل oznacza edukację lub studia w ogólnym sensie; to słowo przewodnie tej lekcji.
    example_gloss: Edukacja jest dobra.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Uniwersytet
    gloss: uniwersytet
    note: پوهنتون oznacza uniwersytet – to standardowe afgańskie słowo (występuje w nazwie Uniwersytetu Kabulskiego), inne niż irańskie دانشگاه.
    example_gloss: Uniwersytet jest w Kabulu.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Szkoła
    gloss: szkoła
    note: مکتب oznacza szkołę.
    example_gloss: Ta szkoła jest dobra.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Kierunek studiów
    gloss: kierunek studiów
    note: رشته oznacza dziedzinę nauki lub kierunek studiów; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Mój kierunek to medycyna.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Student
    gloss: student
    note: محصل oznacza studenta uniwersytetu – to standardowe afgańskie słowo w dari, inne niż irańskie دانشجو.
    example_gloss: On/Ona jest studentem/studentką.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lekcja
    gloss: lekcja
    note: درس oznacza lekcję; razem z خواندن (czytać) tworzy wyrażenie oznaczające „uczyć się”.
    example_gloss: Uczę się codziennie.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Uczyć się
    gloss: lekcja + czytać → uczę się
    note: درس (lekcja) łączy się z خواندن (czytać) i tworzy درس می‌خوانم (uczę się) – dosłownie „czytam lekcję”. To nowy w tym kursie wzorzec czasownika złożonego.
    target_text: درس (lekcja) + خواندن (czytać, uczyć się) = درس می‌خوانم (uczę się)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Studiuję na uniwersytecie
    gloss: Studiuję na uniwersytecie.
    note: Łączy من (ja, powtórka), در (w/na, powtórka), پوهنتون oraz درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medycyna
    gloss: medycyna
    note: طب oznacza medycynę jako kierunek studiów; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Medycyna jest trudna.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Prawo
    gloss: prawo
    note: حقوق oznacza prawo jako kierunek studiów; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Prawo jest ciekawe.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Ekonomia
    gloss: ekonomia
    note: اقتصاد oznacza ekonomię jako kierunek studiów; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Ekonomia też jest trudna.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literatura
    gloss: literatura
    note: ادبیات oznacza literaturę jako kierunek studiów; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Lubię literaturę.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Mój kierunek to medycyna
    gloss: Mój kierunek to medycyna.
    note: Łączy رشته من (mój kierunek, powtórka) z است (jest), które pojawia się tu po raz pierwszy.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Studiuję medycynę
    gloss: Studiuję medycynę.
    note: Stosuje wzorzec من ... می‌خوانم (studiuję, powtórka) bezpośrednio do nazwy kierunku, np. طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Gdzie
    gloss: gdzie
    note: کجا oznacza „gdzie”.
    target_text: کجا (gdzie)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Uczy się Pan/Pani
    gloss: studiujesz (formalnie)
    note: درس می‌خوانین to formalne „studiujesz” (Pan/Pani studiuje), zgodne ze znanym wzorcem czasowników z końcówką ‑ین (np. استفاده می‌کنین z lekcji 30).
    target_text: درس می‌خوانین (uczycie się / uczy się Pan/Pani, formalnie)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Gdzie Pan/Pani studiuje?
    gloss: Gdzie Pan/Pani studiuje?
    note: Łączy شما (Pan/Pani, powtórka), کجا (gdzie), درس oraz می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Studiuję na Uniwersytecie Kabulskim
    gloss: Studiuję na Uniwersytecie Kabulskim.
    note: Łączy من در ... درس می‌خوانم (studiuję na ..., powtórka) z پوهنتون کابل (Uniwersytet Kabulski).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: On/ona się uczy
    gloss: on/ona studiuje
    note: درس می‌خواند to forma 3. osoby, zgodna ze znanym wzorcem czasowników z końcówką ‑د (np. استفاده می‌کند z lekcji 30).
    target_text: درس می‌خواند (on/ona się uczy, 3. osoba)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Ty / uczysz się
    gloss: ty (nieformalnie) / studiujesz (nieformalnie)
    note: تو i می‌خوانی to nieformalny styl, którego używają między sobą Karim i Parwin.
    target_text: تو (ty, nieformalnie) / می‌خوانی (uczysz się, nieformalnie)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, gdzie ty studiujesz?'
    gloss: Parwin, gdzie studiujesz?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Studiuję na Uniwersytecie Kabulskim. Mój kierunek to medycyna.'
    gloss: Studiuję na Uniwersytecie Kabulskim. Mój kierunek to medycyna.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Czy medycyna jest trudna?'
    gloss: Czy medycyna jest trudna?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Tak, jest trudna, ale ciekawa. A ty?'
    gloss: Tak, jest trudna, ale ciekawa. A ty?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Ja uczę się w szkole.'
    gloss: Uczę się w szkole.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Świetnie!'
    gloss: Świetnie!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Czytanka o edukacji
    gloss: Parwin studiuje na Uniwersytecie Kabulskim. Jej kierunek to medycyna. Medycyna jest trudna, ale ciekawa. Karim uczy się w szkole.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Lubię / czas / nie mam
    gloss: lubię / czas / nie mam
    note: دوست دارم (lubię), وقت (czas) i ندارم (nie mam) to powtórka z lekcji 11, 14, 26, 29 i 30.
    target_text: دوست دارم (lubię) / وقت (czas) / ندارم (nie mam)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Lubię naukę, ale nie mam czasu
    gloss: Lubię naukę, ale nie mam czasu.
    note: Łączy تحصیل را دوست دارم (lubię edukację, powtórka konstrukcji) z اما وقت ندارم (ale nie mam czasu).
