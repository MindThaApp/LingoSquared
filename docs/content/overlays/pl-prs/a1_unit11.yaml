    gloss: południe
    note: '*ظهر* znaczy „południe” – to nowe słowo, którego nie było w powitaniach z lekcji 1.'
    example_gloss: W południe jem obiad.
  prs.a1.unit11.lesson04.teach.asr_review:
    title: Popołudnie (powtórka)
    gloss: popołudnie
    note: '*عصر* powtarza powitanie popołudniowe/wieczorne z lekcji 1 (*عصر بخیر*).'
    example_gloss: Pracuję po południu.
  prs.a1.unit11.lesson04.teach.shab_review:
    title: Noc (powtórka)
    gloss: noc
    note: '*شب* powtarza powitanie nocne z lekcji 1 (*شب بخیر*).'
