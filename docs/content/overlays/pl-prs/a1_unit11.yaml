    title: Siedem (7)
    gloss: siedem (7)
    note: '*هفت* znaczy „siedem” i jest potrzebne, by powiedzieć „siódma wieczorem”.'
    example_gloss: Przyjdę o siódmej.
  prs.a1.unit11.lesson05.teach.qarar_word:
    title: Spotkanie
    gloss: wizyta / umówione spotkanie
    note: '*قرار* znaczy „wizyta, umówione spotkanie” – nowe słowo w kontekście spraw osobistych, inne niż *جلسه* (spotkanie służbowe), które wystąpiło wcześniej w dialogu o umawianiu spotkania.'
    example_gloss: Mam umówioną wizytę.
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: O której masz wizytę?
    gloss: O której masz wizytę?
    note: '*قرار شما ساعت چند است؟* grzecznie pyta o godzinę czyjejś wizyty (*شما*).'
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: Moja wizyta jest wpół do dziewiątej.
    gloss: Moja wizyta jest wpół do dziewiątej.
    note: '*قرار من ساعت هشت و نیم است* podaje godzinę twojej własnej wizyty.'
  prs.a1.unit11.lesson06.teach.names:
    title: Zarmina i Homayoun
    gloss: Zarmina, Homayoun
    note: '*زرمینه* i *همایون* to dwoje rozmówców w dialogu z tej lekcji.'
    example_gloss:
    - Zarmina przyjdzie o siódmej.
    - Homayoun przyjdzie o ósmej.
  prs.a1.unit11.lesson06.teach.dialogue_line1:
    title: Przepraszam, o której jest spotkanie?
    gloss: Przepraszam, o której jest zebranie?
    note: Zarmina grzecznie pyta o godzinę zebrania.
  prs.a1.unit11.lesson06.teach.dialogue_line2:
    title: Zebranie jest o dziewiątej rano.
    gloss: Zebranie jest o dziewiątej rano.
    note: Homayoun podaje godzinę zebrania.
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: O dziewiątej? Dobrze. Przyjdę o wpół do dziewiątej.
    gloss: O dziewiątej? Dobrze. Przyjdę o wpół do dziewiątej.
    note: Zarmina potwierdza i podaje własną godzinę przyjścia.
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: Bardzo dobrze, będę czekać.
    gloss: Bardzo dobrze, będę czekać.
    note: '*منتظر استم* (czekam) ma już poznaną końcówkę łącznika *استم*.'
