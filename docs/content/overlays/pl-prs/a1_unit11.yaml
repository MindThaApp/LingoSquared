teaching:
  prs.a1.unit11.lesson01.teach.saat_word:
    title: Godzina / zegar
    gloss: godzina / zegar
    note: '*ساعت* znaczy zarówno „godzina”, jak i „zegar”, a w podawaniu czasu oznacza też pełną godzinę.'
    example_gloss: Która jest godzina?
  prs.a1.unit11.lesson01.teach.daqiqa_word:
    title: Minuta
    gloss: minuta
    note: '*دقیقه* znaczy „minuta”.'
    example_gloss: Poczekaj pięć minut.
  prs.a1.unit11.lesson01.teach.nim_word:
    title: Pół
    gloss: pół
    note: '*نیم* znaczy „pół” i służy do podawania pół godziny (np. *ساعت سه و نیم* – wpół do czwartej).'
    example_gloss: Jest wpół do ósmej.
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Kwadrans
    gloss: kwadrans
    note: '*ربع* znaczy „kwadrans” i służy do podawania kwadransów (np. *ساعت چهار و ربع* – kwadrans po czwartej).'
    example_gloss: Jest za kwadrans ósma.
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: Liczby 1–5 (powtórka)
    gloss: jeden, dwa, trzy, cztery, pięć
    note: '*یک، دو، سه، چهار، پنج* powtarzają liczby z lekcji 4, potrzebne do podawania godziny.'
    example_gloss:
    - Mam jedną książkę.
    - Mam dwóch braci.
    - Mam trzy siostry.
    - Zostały cztery dni.
    - Poczekaj pięć minut.
  prs.a1.unit11.lesson02.teach.chand_word:
    title: Ile / który
    gloss: ile / który
    note: '*چند* w połączeniu z *ساعت* tworzy pytanie o godzinę: *ساعت چند است؟*'
    example_gloss: Która jest godzina?
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: Która jest godzina?
    gloss: Która jest godzina?
    note: '*ساعت چند است؟* to neutralny, grzeczny sposób zapytania o godzinę w dari.'
  prs.a1.unit11.lesson02.teach.register_note:
    title: Uwaga o rejestrze
    gloss: ساعت چند است؟ (pełna, neutralna forma)
    note: '*ساعت چند است؟* to pełna, neutralna forma: jest poprawna i w piśmie, i w mowie. W szybkiej, swobodnej mowie *است* często skraca się do końcowego -ه (jak w *چنده*), ale na etapie nauki używaj pełnej formy.'
    target_text: ساعت چند است؟ (pełna, neutralna forma)
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: Jest trzecia.
    gloss: Jest trzecia.
    note: '*ساعت سه است* podaje pełną godzinę.'
  prs.a1.unit11.lesson03.teach.saat_se_o_nim:
    title: Jest wpół do czwartej.
    gloss: Jest wpół do czwartej.
    note: '*و* („i”) łączy godzinę z połową: *ساعت سه و نیم است*.'
  prs.a1.unit11.lesson03.teach.saat_char_o_rub:
    title: Jest kwadrans po czwartej.
    gloss: Jest kwadrans po czwartej.
    note: '*ساعت چهار و ربع است* dodaje kwadrans po pełnej godzinie.'
  prs.a1.unit11.lesson04.teach.sobh_review:
    title: Rano (powtórka)
    gloss: rano
    note: '*صبح* powtarza powitanie poranne z lekcji 1 (*صبح بخیر*).'
    example_gloss: Rano wstaję wcześnie.
  prs.a1.unit11.lesson04.teach.zohr_word:
