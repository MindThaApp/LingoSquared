course:
  title: Dari w polskim A1
  description: 'Kabulski dari dla początkujących: umów i potwierdź prostą wizytę, podając usługę, dzień i godzinę – zapytaj, kto w który dzień ma wolne, zaproponuj i potwierdź dzień oraz godzinę i przeczytaj krótki tekst o umówionej wizycie.'
units:
