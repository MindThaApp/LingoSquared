    gloss: umówione spotkanie / lekarz / mam / jest
    note: قرار, داکتر, دارم i است to powtarzane słowa, których używamy, mówiąc o wizycie.
    target_text: قرار (umówione spotkanie) / داکتر (lekarz) / دارم (mam) / است (jest)
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 'Powtórka: chcę, jeden'
    gloss: chcę / jeden / pewien
    note: می‌خواهم i یک razem pozwalają powiedzieć, czego chcesz.
    target_text: می‌خواهم (chcę) / یک (jeden / pewien)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Ząb
    gloss: ząb
    note: دندان to standardowe dariskie słowo oznaczające ząb.
    example_gloss: Mam ząb.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Dentysta
    gloss: dentysta
    note: داکتر دندان dosłownie znaczy „lekarz zębów" i jest standardowym afgańskim określeniem dentysty w dari.
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: Chcę umówić wizytę
    gloss: Chcę umówić wizytę.
