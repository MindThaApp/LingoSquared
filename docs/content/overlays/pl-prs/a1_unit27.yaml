course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: słownictwo opisujące wygląd (wysoki, niski, włosy, oczy, broda, okulary), pytanie o wygląd osoby za pomocą قیافه‌اش چطور است؟, kolor włosów i oczu (رنگ مو/رنگ چشم) oraz dialog Zarminy i Homayouna o rozpoznawaniu kogoś po wyglądzie.'
units:
  prs.a1.unit27.appearance:
    title: Wygląd
    description: Opisz podstawowy wygląd osoby i zapytaj, jak ktoś wygląda.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Słowa opisujące wygląd
  prs.a1.unit27.lesson02.appearance_question:
    title: Pytanie o wygląd
  prs.a1.unit27.lesson03.hair_eye_color:
    title: Kolor włosów i oczu
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialog o wyglądzie
  prs.a1.unit27.lesson05.reading_appearance:
    title: Czytanie o wyglądzie
  prs.a1.unit27.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Wysoki
    gloss: wysoki
    note: قد بلند dosłownie znaczy „długi wzrost" -- قد (wzrost) + بلند (długi/wysoki).
    example_gloss: Jest wysoki/wysoka.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Niski
    gloss: niski
    note: قد کوتاه dosłownie znaczy „krótki wzrost" -- قد (wzrost, powtórka) + کوتاه (krótki).
    example_gloss: Jest niski/niska.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Włosy
    gloss: włosy
    note: مو znaczy „włosy"; موی to to samo słowo w formie łączonej, używanej przed innym wyrazem (np. موی سیاه, „czarne włosy").
    example_gloss: Ma czarne włosy.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Oko
    gloss: oko
    note: چشم znaczy „oko" (przy opisie koloru oczu używa się liczby pojedynczej, to naturalny, codzienny wzorzec).
    example_gloss: Ma czarne oczy.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Broda
    gloss: broda
    note: ریش znaczy „broda".
    example_gloss: Ma brodę.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Okulary
    gloss: okulary
    note: عینک znaczy „okulary".
    example_gloss: Nosi okulary.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Jest / ma (3. osoba)
    gloss: jest / ma (3. osoba)
    note: است (jest) i دارد (ma, 3. osoba) znasz już z wcześniejszych lekcji; w tej lekcji służą do opisywania wyglądu.
    target_text: است (jest) / دارد (ma, 3. osoba)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Wygląd / powierzchowność
    gloss: wygląd / powierzchowność
    note: قیافه znaczy wygląd lub powierzchowność człowieka (np. خوش قیافه, „przystojny").
    example_gloss: Jego/jej wygląd jest dobry.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Jak
    gloss: jak
    note: چطور znaczy „jak" (poznałeś to już wcześniej, w powitaniach takich jak چطور استین؟).
    target_text: چطور (jak)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Jego/jej wygląd
    gloss: jego/jej wygląd
    note: قیافه‌اش łączy قیافه (wygląd) z przyrostkiem dzierżawczym ‌اش („jego/jej").
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Jak on/ona wygląda?
    gloss: Jak on/ona wygląda?
    note: قیافه‌اش چطور است؟ to naturalny sposób zapytania, jak ktoś wygląda -- celowo nie samo چطور است؟, które samo w sobie znaczy „Jak się ma?" (pytanie o zdrowie i samopoczucie).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Jest wysoki/wysoka
    gloss: Jest wysoki/wysoka.
    note: Łączy او (on/ona, powtórka) z قد بلند است z tej lekcji.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Ma czarne włosy
    gloss: Ma czarne włosy.
    note: Łączy موی (włosy) z سیاه (czarny) i دارد (ma).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Ma brodę
    gloss: Ma brodę.
    note: Używa ریش دارد, czyli tego samego wzorca z „mieć" co przy czarnych włosach powyżej.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Kolor
    gloss: kolor
    note: رنگ znaczy „kolor" (poznałeś to już wcześniej, w lekcji 21 o ubraniach).
    target_text: رنگ (kolor)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Niebieski
    gloss: niebieski
    note: آبی znaczy „niebieski".
    example_gloss: Ma niebieskie oczy.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Brązowy
    gloss: brązowy
    note: قهوه‌ای oznacza „brązowy” (mówi się tak o kolorze włosów lub oczu).
    example_gloss: Jego/jej włosy są brązowe.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Kolor oczu
    gloss: kolor oczu
    note: رنگ چشم dosłownie znaczy „kolor oka” -- رنگ (kolor) + چشم (oko).
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Kolor włosów
    gloss: kolor włosów
    note: رنگ مو dosłownie znaczy „kolor włosów” -- رنگ (kolor) + مو (włosy).
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Jego/jej oczy są niebieskie
    gloss: Jego/jej oczy są niebieskie.
    note: Zastosowanie słowa آبی z tej lekcji do słowa چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Jego/jej włosy są brązowe
    gloss: Jego/jej włosy są brązowe.
    note: Zastosowanie słowa قهوه‌ای z tej lekcji do słowa موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Brat / twój brat
    gloss: brat / twój brat (nieformalnie)
    note: برادر („brat”) to powtórka z jednostki 3; برادرت dodaje nieformalny przyrostek dzierżawczy ‌ت („twój”), zgodny z nieformalnym rejestrem تو.
    target_text: برادر (brat) / برادرت (twój brat, nieformalnie)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Tak / dziękuję / też
    gloss: tak / dziękuję / też
    note: بلی („tak”), تشکر („dziękuję”) i هم („też”) to powtórka z wcześniejszych lekcji kursu.
    target_text: بلی (tak) / تشکر (dzięki) / هم (też)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmino, jak wygląda twój brat?'
    gloss: 'Homayoun: Zarmino, jak wygląda twój brat?'
    note: Nieformalne pytanie między przyjaciółmi, z przyrostkiem dzierżawczym -ت przy słowie برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Jest wysoki i ma czarne włosy'
    gloss: 'Zarmina: Jest wysoki i ma czarne włosy.'
    note: Łączy dwie cechy za pomocą و („i”).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ma brodę?'
    gloss: 'Homayoun: Ma brodę?'
    note: Pytanie typu tak/nie tworzy się po prostu przez wznoszącą intonację przy ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Tak, ma brodę, a także okulary'
    gloss: 'Zarmina: Tak, ma brodę, a także okulary.'
    note: Zastosowanie هم („też”) przy drugiej cesze.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Dobrze, dziękuję'
    gloss: 'Homayoun: Dobrze, dziękuję.'
    note: خوب („dobrze”) to nowe, proste słowo na zakończenie rozmowy; تشکر („dziękuję”) to powtórka.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Tekst o wyglądzie
    gloss: Karim jest wysoki. Ma czarne włosy i brązowe oczy. Nie ma brody, ale ma okulary.
    note: Krótki tekst powtarzający słownictwo o wyglądzie z tej jednostki. Pojawia się w nim imię bohatera کریم (Karim, znany już z jednostki o porównaniach) oraz ندارد („nie ma”, forma przeczna 3. osoby od دارد).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Ale
    gloss: ale
    note: اما znaczy „ale” (wprowadzone wcześniej w tej jednostce, w tekście do czytania z lekcji 5; to także powtórka z wcześniejszych jednostek).
    target_text: اما (ale)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Jestem / mam
    gloss: jestem / mam
    note: استم („jestem”) i دارم („mam”) to powtórka z wcześniejszych lekcji; tutaj służą do opisu własnego wyglądu w 1. osobie.
    target_text: استم (jestem) / دارم (mam)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Jestem niski, ale mam czarne włosy
    gloss: Jestem niski, ale mam czarne włosy.
    note: Łączy dwie informacje o wyglądzie za pomocą اما.
