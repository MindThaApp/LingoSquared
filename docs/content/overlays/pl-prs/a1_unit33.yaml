teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Prace domowe
    gloss: prace domowe
    note: کار خانه oznacza prace domowe lub obowiązki domowe i jest hasłem przewodnim tej lekcji.
    example_gloss: Jest dużo pracy w domu.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Miotła
    gloss: miotła
    note: جاروب oznacza miotłę; jest to powszechnie używane afgańskie słowo w dari.
    example_gloss: Gdzie jest miotła?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Naczynia
    gloss: naczynia
    note: ظرف oznacza naczynia; to standardowe słowo wspólne dla perskiego i dari.
    example_gloss: Naczynia są w kuchni.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Czysty
    gloss: czysty
    note: پاک oznacza „czysty” i opisuje pokój lub przedmiot.
    example_gloss: Pokój jest czysty.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: Myć / robić
    gloss: myć / robić — myję / robię
    note: شستن (myć) to całkiem nowy czasownik; کردن (robić) i می‌کنم (robię) znasz już z wcześniejszych lekcji.
    target_text: شستن (myć) / کردن (robić) — می‌شویم (myjemy) / می‌کنم (robię)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Zamiatam
    gloss: Zamiatam.
    note: Połączenie جاروب (miotła) z می‌کنم (robię, powtórka) — dosłownie „robię miotłą”.
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Zmywam naczynia
    gloss: Zmywam naczynia.
    note: Połączenie ظرف (naczynia) z می‌شویم (myję), czyli formą 1. osoby czasownika شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Dzisiaj / co / tak
    gloss: dziś / co / tak
    note: امروز, چه i بلی znasz już z wcześniejszych lekcji.
    target_text: امروز (dzisiaj) / چه (co) / بلی (tak)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Musieć / trzeba
    gloss: musieć / trzeba
    note: باید to całkiem nowe słowo modalne; służy tu do powiedzenia, że trzeba coś zrobić.
    target_text: باید (trzeba / musieć)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Żebym zrobił/a
    gloss: żebym zrobił/zrobiła
    note: کنم to goła forma trybu łączącego, używana po باید z czasownikami opartymi na کردن (bez przedrostka می‌).
    target_text: کنم (żebym zrobił/a — po باید z czasownikami z کردن, bez przedrostka می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Dziś muszę zamieść
    gloss: Dziś muszę zamieść.
    note: Połączenie امروز (dziś, powtórka) z باید جاروب کنم (muszę zamieść).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Muszę posprzątać
    gloss: Muszę posprzątać.
    note: Połączenie باید (musieć, powtórka) z پاک کنم (żebym posprzątał/posprzątała).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: Co mam zrobić?
    gloss: Co mam zrobić?
    note: Połączenie چه کار (jaka praca / co do zrobienia) z باید کنم (muszę zrobić).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Tak, muszę zamieść
    gloss: Tak, muszę zamieść.
    note: Połączenie بلی (tak, powtórka) z باید جاروب کنم (muszę zamieść).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Pomoc
    gloss: pomoc
    note: کمک oznacza pomoc; to nowe słowo w tym kursie.
