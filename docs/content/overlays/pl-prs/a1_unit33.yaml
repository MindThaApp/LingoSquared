    gloss: proszę / robić / ja / zrób! (formalnie)
    note: لطفاً, کردن, من i کنین (formalny tryb rozkazujący, z typową formalną końcówką -ین) znasz już z wcześniejszych lekcji.
    target_text: لطفاً (proszę) / کردن (robić) / من (ja) / کنین (proszę zrobić! formalnie)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: Proszę o pomoc
    gloss: Proszę, pomóżcie.
    note: Połączenie لطفاً (proszę, powtórka) z کمک کنین (pomóżcie!, formalny tryb rozkazujący).
  prs.a1.unit33.lesson03.teach.review_ki_mikonad:
