course:
  title: Dari w polskim A1
  description: 'Dari kabulskie dla początkujących: nazywaj podstawowe cechy charakteru, pytaj, jaki ktoś jest, podawaj proste powody ze słowem „ponieważ” i opisuj charakter człowieka w krótkim tekście.'
units:
  prs.a1.unit37.personality:
    title: Osobowość
    description: Opisuj podstawowe cechy charakteru i pytaj, jaki ktoś jest.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: Słowa o charakterze
  prs.a1.unit37.lesson02.more_traits:
    title: Więcej cech
  prs.a1.unit37.lesson03.asking_about_personality:
    title: Pytanie o charakter
  prs.a1.unit37.lesson04.personality_dialogue:
    title: Dialog o charakterze
  prs.a1.unit37.lesson05.personality_reading:
    title: Czytanie o charakterze
  prs.a1.unit37.lesson06.wrap_up:
    title: Podsumowanie
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Miły
    gloss: miły
    note: مهربان to standardowe słowo w dari na osobę miłą i serdeczną.
    example_gloss: On/ona jest miły/miła.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Pracowity
    gloss: pracowity
    note: زحمتکش dosłownie znaczy „ten, kto się trudzi” — czyli osoba pracowita.
    example_gloss: On/ona jest pracowity/pracowita.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Mądry
    gloss: mądry / inteligentny
    note: باهوش składa się z با („z”) i هوش („inteligencja”) — to osoba mądra, bystra.
    example_gloss: On/ona jest mądry/mądra.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Leniwy
    gloss: leniwy
    note: تنبل znaczy „leniwy”.
    example_gloss: On/ona jest leniwy/leniwa.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Powtórka: on/ona, jest, i, ale'
    gloss: on/ona / jest / i / ale
    note: او, است, و i اما to powtarzane formy, używane w zdaniach o charakterze w całej tej lekcji.
    target_text: او (on/ona) / است (jest) / و (i) / اما (ale)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: On/ona jest miły/miła i pracowity/pracowita
    gloss: On/ona jest miły/miła i pracowity/pracowita.
    note: و łączy dwie cechy w jedno zdanie.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Ta osoba jest mądra, ale leniwa
    gloss: Ta osoba jest mądra, ale leniwa.
    note: اما przeciwstawia dwie cechy w jednym zdaniu.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Zabawny
    gloss: dowcipny, żartobliwy
    note: شوخ opisuje kogoś, kto lubi żartować i jest żartobliwy.
    example_gloss: Ta osoba jest dowcipna.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Małomówny
    gloss: małomówny, powściągliwy
    note: کم‌حرف dosłownie znaczy „mało słów” — to cichy, powściągliwy człowiek.
    example_gloss: Ta osoba jest małomówna.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Uczciwy
    gloss: uczciwy
    note: راستگو składa się z راست (prawdziwy, prosty) i گو (mówiący) — to osoba prawdomówna, uczciwa.
    example_gloss: Ta osoba jest uczciwa.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Powtórka: i, ale'
    gloss: i / ale
    note: و i اما to słowa z powtórki, które służą do łączenia lub przeciwstawiania cech.
    target_text: و (i) / اما (ale)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Ta osoba jest dowcipna i uczciwa
    gloss: Ta osoba jest dowcipna i uczciwa.
    note: Łączy dwie pozytywne cechy za pomocą و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Ta osoba jest małomówna, ale miła
    gloss: Ta osoba jest małomówna, ale miła.
    note: اما przeciwstawia cechę powściągliwą cesze ciepłej.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Człowiek
    gloss: człowiek
    note: آدم to częste słowo oznaczające człowieka, bez rozróżnienia płci.
    example_gloss: To dobry człowiek.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Powtórka: jaki, ponieważ, pomoc'
    gloss: jaki / ponieważ / pomoc
    note: چطور, چون i کمک to formy z powtórki, których używamy, by pytać o osobowość i ją uzasadniać.
    target_text: چطور (jaki, jak) / چون (ponieważ) / کمک (pomoc)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Jakim człowiekiem jest ta osoba?
    gloss: Jakim człowiekiem jest ta osoba?
    note: 'او چطور آدم است؟ dosłownie pyta: „on/ona jest jakim (rodzajem) człowiekiem?” — to naturalny sposób, by zapytać, jaki ktoś jest.'
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Ta osoba jest miła, ponieważ pomaga
    gloss: Ta osoba jest miła, ponieważ pomaga.
    note: چون wprowadza powód; کمک می‌کند dosłownie znaczy „robi pomoc”.
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Ta osoba jest pracowita, ponieważ dużo pracuje
    gloss: Ta osoba jest pracowita, ponieważ dużo pracuje.
    note: زیاد کار می‌کند dosłownie znaczy „robi dużo pracy”.
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Tak / trochę / zawsze
    gloss: tak / trochę / zawsze
    note: بلی, کمی i همیشه to słowa z powtórki, użyte w dialogu o osobowości.
    target_text: بلی (tak) / کمی (trochę) / همیشه (zawsze)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, jakim człowiekiem jest Karim?'
    gloss: Zarmina, jakim człowiekiem jest Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Karim jest miły i pracowity.'
    gloss: Karim jest miły i pracowity.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Czy jest mądry?'
    gloss: Czy jest mądry?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Tak, jest mądry, ale trochę małomówny.'
    gloss: Tak, jest mądry, ale trochę małomówny.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Czy jest uczciwy?'
    gloss: Czy jest uczciwy?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Tak, zawsze jest uczciwy.'
    gloss: Tak, zawsze jest uczciwy.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Czasami, wszyscy, znacznik dopełnienia, oni lubią
    gloss: czasem / wszyscy / znacznik dopełnienia / lubią
    note: گاهی (czasem) i همه (wszyscy) pojawiają się w tekście; را oznacza określone dopełnienie bliższe; دوست دارند to forma 3. osoby liczby mnogiej od دوست دارم (lubię).
    target_text: گاهی (czasem) / همه (wszyscy) / را (znacznik dopełnienia) / دوست دارند (lubią)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Tekst o osobowości Homayouna
    gloss: Homayoun jest miły i pracowity. Jest mądry, ale czasem małomówny. Zawsze jest uczciwy. Wszyscy go lubią.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Powtórka: jestem, jest Pan/Pani'
    gloss: jestem / jest Pan/Pani (formalnie)
    note: 'استم i استین to formy czasownika „być” z powtórki: „jestem” i „jest Pan/Pani” (formalnie); pojawiają się w zdaniach tej lekcji podsumowującej.'
    target_text: استم (jestem) / استین (jesteś, formalnie)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Jestem miły/miła, ale czasem leniwy/leniwa
    gloss: Jestem miły/miła, ale czasem leniwy/leniwa.
    note: من (ja) i استم (jestem) pozwalają opisać własną osobowość, według tego samego wzoru او/است, który pojawia się w całej lekcji.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Jakim człowiekiem jest Pan/Pani?
    gloss: Jakim człowiekiem jest Pan/Pani?
    note: Dodaje شما (Pan/Pani) i استین (jest Pan/Pani) do tej samej formy pytania z wcześniejszej lekcji, teraz skierowanej bezpośrednio do ucznia.
