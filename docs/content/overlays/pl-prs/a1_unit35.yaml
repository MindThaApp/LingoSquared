    example_gloss: Chcę znaczek.
  prs.a1.unit35.lesson01.teach.letter_word:
    title: List
    gloss: list
    note: نامه znaczy list lub pisemna wiadomość.
    example_gloss: List leży na stole.
  prs.a1.unit35.lesson01.teach.parcel_word:
    title: Paczka
    gloss: paczka
    note: پارسل jest używane we współczesnym afgańskim języku pocztowym na określenie paczki.
    example_gloss: Paczka nie jest duża.
  prs.a1.unit35.lesson01.teach.review_basics:
    title: 'Powtórka: jeden, blisko, jest, chcę'
    gloss: jeden/jakiś / blisko / jest / chcę
    note: یک, نزدیک, است i می‌خواهم to powtarzane formy używane w prostych prośbach przy okienku.
    target_text: یک (jeden/jakiś) / نزدیک (blisko) / است (jest) / می‌خواهم (chcę)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: Chcę znaczek
    gloss: Chcę znaczek.
