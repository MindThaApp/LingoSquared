    gloss: Zarmina poszła do kantoru. Miała sto dolarów i chciała wymienić dolary na afgani. Dzisiejszy kurs wynosił siedemdziesiąt afgani. Zarmina dostała siedem tysięcy afgani i wzięła pokwitowanie.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Poszedł / poszła
    gloss: poszedł / poszła
    note: 'رفت to czas przeszły: „poszedł / poszła”.'
    example_gloss: Zarmina poszła do kantoru.
