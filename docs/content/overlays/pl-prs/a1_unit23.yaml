    gloss: do / znacznik dopełnienia / robię / zrobić / chcę
    note: به, را, می‌کنم, کنم i می‌خواهم to słowa powtórkowe (znane już wcześniej w kursie), połączone w zdaniach o wymianie w tej lekcji.
    example_gloss: Chcę wymienić dolary na afgani.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
