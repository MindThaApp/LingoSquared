  prs.a1.unit23.lesson06.teach.review_summary:
    title: Podsumowanie
    gloss: 'Mam pieniądze: gotówkę i kartę. Mogę wymienić dolary na afgani w kantorze. Dzisiejszy kurs to siedemdziesiąt afgani za jednego dolara.'
