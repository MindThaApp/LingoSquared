    title: 'Powtórka: siedem, wziął/wzięła, wziąłem/wzięłam'
    gloss: siedem / wziął, wzięła, dostał(a) / wziąłem, wzięłam, dostałem, dostałam
    note: هفت to liczba powtórkowa; گرفت i گرفتم to trzecia i pierwsza osoba czasu przeszłego od گرفتن (brać, otrzymywać); tutaj opisują kwotę, którą dostała Zarmina.
