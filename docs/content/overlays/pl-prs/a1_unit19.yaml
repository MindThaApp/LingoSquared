course:
  title: Dari w polskim A1
  description: 'Kabulskie dari dla początkujących: podstawowe pomieszczenia (sypialnia, kuchnia, łazienka), przedmioty domowe (stół, krzesło, łóżko, okno), łączenie ilości i położenia, czytanie krótkiego, a potem dłuższego opisu domu oraz dialog o czyimś domu.'
units:
  prs.a1.unit19.housing:
    title: Mieszkanie
    description: Opisz prosty dom, pomieszczenia, przedmioty domowe i ich położenie.
