    title: Pan/Pani (form. grzecznościowa)
    gloss: Pan / Pani / wy
    note: شما to grzecznościowa zaimek drugiej osoby, odpowiednik „Pan/Pani”.
    target_text: شما (Pan/Pani, wy – grzecznościowo)
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: Ile
    gloss: ile
    note: چند znaczy „ile”.
    target_text: چند (ile)
