teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Kuchnia
    gloss: kuchnia
    note: آشپزخانه to standardowe darijskie słowo oznaczające kuchnię.
    example_gloss: Dziś jestem w kuchni.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Jedzenie
    gloss: jedzenie / posiłek
    note: غذا oznacza jedzenie lub posiłek ogólnie, w odróżnieniu od konkretnego dania, jak پلو.
    example_gloss: Jedzenie jest smaczne.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Cebula
    gloss: cebula
    note: پیاز to zwykłe darijskie słowo oznaczające cebulę, stale używane w kuchni afgańskiej.
    example_gloss: Cebula jest świeża.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Mięso
    gloss: mięso
    note: گوشت oznacza mięso.
    example_gloss: Mięso jest świeże.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Powtórka: jeden, chcę, w, jestem'
    gloss: jeden/jakiś / chcę / w lub na / jestem
    note: یک, می‌خواهم, در i استم to znane już formy, użyte w zdaniach o gotowaniu w tej lekcji.
    target_text: یک (jeden/jakiś) / می‌خواهم (chcę) / در (w/na) / استم (jestem)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Gotuję jedzenie
    gloss: Gotuję jedzenie.
    note: می‌پزم to forma 1. osoby czasu teraźniejszego od پختن, czyli „gotować”.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Jestem w kuchni
    gloss: Jestem w kuchni.
    note: استم to forma 1. osoby czasownika „być”, użyta tu z در do określenia miejsca.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Sól
    gloss: sól
    note: نمک oznacza sól.
    example_gloss: Chcę soli.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Ryż
    gloss: ryż
    note: برنج to surowy ryż (ziarno), w odróżnieniu od پلو, czyli gotowanego dania z ryżu, które pojawia się w lekcji o jedzeniu.
    example_gloss: Gotuję ryż.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Powtórka: robię, kroję'
    gloss: robię / pokrojone, posiekane
    note: می‌کنم już znasz; خرد jest nowe i w połączeniu z formami od کردن znaczy „kroić, siekać”.
    target_text: می‌کنم (robię) / خرد (pokrojony/posiekany)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Kroję cebulę
    gloss: Kroję cebulę.
    note: Dosłownie خرد می‌کنم znaczy „robię to pokrojone/posiekane” – to typowy wzorzec czasownika złożonego.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Dodaję sól
    gloss: Dodaję sól.
    note: می‌اندازم (od انداختن, „rzucać, wkładać”) to naturalny czasownik w dari na dodawanie składnika.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Gotuję mięso
    gloss: Gotuję mięso.
    note: Zamień گوشت na برنج, aby nazwać inną potrawę, którą gotujesz.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Powtórka: najpierw, potem'
    gloss: najpierw / potem
    note: اول i بعد znasz już z wcześniejszych lekcji; służą do porządkowania kolejnych etapów gotowania.
    target_text: اول (najpierw) / بعد (potem)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Powtórka: woda, gorący'
    gloss: woda / gorący
    note: آب i گرم to słowa powtórzone z wcześniejszych lekcji.
    target_text: آب (woda) / گرم (gorąca)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Wlewam
    gloss: wlewam
    note: می‌ریزم (od ریختن, „lać, wlewać”) to naturalny czasownik na dodawanie płynu; różni się od می‌اندازم, którego używa się przy składnikach stałych.
    example_gloss: Wlewam wodę.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Najpierw kroję cebulę
    gloss: Najpierw kroję cebulę.
    note: اول oznacza pierwszy etap w kolejności czynności.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Potem gotuję mięso
    gloss: Potem gotuję mięso.
    note: بعد oznacza kolejny etap w kolejności czynności.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Wlewam gorącą wodę
    gloss: Wlewam gorącą wodę.
    note: Łączy گرم („gorący”) z می‌ریزم („wlewam”).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Dzień dobry / tak / proszę / dobrze / dziękuję / potrawka / pyszny / jest
    gloss: cześć / tak / proszę / dobrze, oczywiście / dziękuję / qorma (potrawka) / pyszny / jest
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه i است to słowa powtórzone, które pojawiają się w dialogu w kuchni.
    target_text: سلام (cześć) / بلی (tak) / لطفاً (proszę) / چشم (dobrze/jasne) / تشکر (dziękuję) / قورمه (potrawka) / خوش‌مزه (smaczne) / است (jest)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Dzień dobry, co Pan gotuje?'
    gloss: Dzień dobry, co Pan gotuje?
    note: چی می‌پزین؟ zawiera grzecznościową formę „Pan/Pani/Państwo” می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Gotuję qormę.'
    gloss: Gotuję qormę.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: Pomóc?'
    gloss: Pomóc?
    note: کمک می‌کنم؟ dosłownie pyta „Czy pomagam?” – to naturalny sposób zaproponowania pomocy.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Tak, proszę pokroić cebulę.'
    gloss: Tak, proszę pokroić cebulę.
    note: 'کنین to grzecznościowy tryb rozkazujący: „proszę zrobić!”, tu „proszę pokroić”.'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Oczywiście.'
    gloss: Oczywiście.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Dziękuję, jedzenie jest pyszne.'
    gloss: Dziękuję, jedzenie jest pyszne.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: On/ona, w, robi, gotuje, bardzo, szczęśliwy, jest
    gloss: on/ona / w / on/ona robi / on/ona gotuje / bardzo / szczęśliwy / jest
    note: او to zaimek „on” lub „ona” w dari; می‌کند i می‌پزد to formy 3. osoby czasowników użytych wcześniej w tej lekcji.
    target_text: او (on/ona) / در (w/na) / می‌کند (robi) / می‌پزد (gotuje) / بسیار (bardzo) / خوشحال (szczęśliwy) / است (jest)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Czytanka: Nadia gotuje'
    gloss: Nadia jest w kuchni. Kroi cebulę. Potem gotuje mięso. Jedzenie jest bardzo smaczne. Nadia jest szczęśliwa.
