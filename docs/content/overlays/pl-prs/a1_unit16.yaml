teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Bilet
    gloss: bilet
    note: تکت znaczy bilet. To codzienne słowo używane w Afganistanie; بلیط (także pisane بلیت, słowo w stylu irańskim) jest zrozumiałe i akceptowane, ale usłyszysz najczęściej تکت.
    example_gloss: Mam bilet.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Pociąg
    gloss: pociąg
    note: قطار znaczy „pociąg”.
    example_gloss: Pociąg jest dobry.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Autobus
    gloss: autobus
    note: بس znaczy „autobus”. To powszechne słowo w afgańskim dari.
    example_gloss: Autobus jest dobry.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Lotnisko
    gloss: lotnisko
    note: میدان هوایی znaczy „lotnisko”. To ustalony w tym kursie termin afgański dari (nie irańskie فرودگاه), tak samo jak w lekcji 5.
    example_gloss: Lotnisko jest dobre.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Jeden / jakiś
    gloss: jeden / (nieokreślony) jakiś
    note: یک znaczy „jeden”. Tutaj pełni funkcję nieokreślonego przedimka (jakiś bilet).
    target_text: یک (jeden/pewien)
  prs.a1.unit16.lesson01.teach.az_word:
    title: Z
    gloss: z / od
    note: از znaczy „z, od” i wskazuje miejsce pochodzenia (to inne użycie niż „niż” w porównaniach).
    target_text: از (z/od)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Dwa
    gloss: dwa
    note: دو znaczy „dwa”.
    example_gloss: Mam dwa bilety.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Peron drugi
    gloss: peron drugi
    note: سکوی دو łączy słowo سکو („peron”) z łącznikiem ezafe -ی i słowem دو („dwa”).
    target_text: سکوی دو (peron drugi)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Duże miasto w zachodnim Afganistanie.
    example_gloss: Jadę do Heratu.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Chcę
    gloss: chcę
    note: می‌خواهم to pełna, nieskrócona forma „chcę”, zgodna z rejestrem tego kursu.
    target_text: می‌خواهم (chcę)
  prs.a1.unit16.lesson02.teach.be_word:
    title: Do
    gloss: do
    note: 'به wskazuje cel podróży: به هرات znaczy „do Heratu”.'
    target_text: به (do)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Chcę bilet do Heratu
    gloss: Chcę bilet do Heratu
    note: یک تکت به هرات می‌خواهم łączy słownictwo z tej lekcji w standardową prośbę o bilet.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Peron
    gloss: peron
    note: سکو znaczy „peron” (na dworcu kolejowym).
    example_gloss: Pociąg odjeżdża z peronu drugiego.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Odjeżdża
    gloss: odjeżdża
    note: حرکت می‌کند to pełna, nieskrócona forma „odjeżdża / rusza”.
    target_text: حرکت می‌کند (odjeżdża)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Kiedy
    gloss: kiedy
    note: کی znaczy „kiedy” i służy do pytania o czas.
    target_text: کی (kiedy)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Rano
    gloss: rano
    note: صبح znaczy „rano”.
    example_gloss: Pociąg odjeżdża o ósmej rano.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Przykładowy tekst rozkładu jazdy
    gloss: Pociąg do Heratu odjeżdża z peronu drugiego o ósmej rano.
    note: Krótkie, rzeczowe ogłoszenie łączące słownictwo podróżnicze z tej lekcji. Ten tekst zastępuje zapowiedź dworcową, której nie można odsłuchać.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Jutro
    gloss: jutro
    note: فردا znaczy „jutro”.
    example_gloss: Jadę jutro rano.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Bardzo dobrze / w porządku
    gloss: bardzo dobrze / w porządku
    note: بسیار خوب to pełny, oficjalny sposób na powiedzenie „w porządku / bardzo dobrze”, zgodny z rejestrem tego kursu (a nie potoczne باشه).
    example_gloss: Pociąg jest bardzo dobry.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Podróżny mówi
    gloss: Chcę bilet do Heratu.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Sprzedawca pyta
    gloss: Kiedy chcą Państwo jechać?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Podróżny odpowiada
    gloss: Jutro rano.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Sprzedawca potwierdza
    gloss: Bardzo dobrze, pociąg odjeżdża z peronu drugiego o ósmej rano.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Bardzo dziękuję
    gloss: bardzo dziękuję
    note: تشکر زیاد to powszechny, grzeczny sposób powiedzenia „bardzo dziękuję”, znany już z lekcji 5 i 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: Proszę / nie ma za co
    gloss: nie ma za co
    note: قابلی نداره to standardowa, grzeczna odpowiedź na podziękowanie („nie ma za co”), znana już z lekcji 5 i 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Szczęśliwej podróży
    gloss: szczęśliwej podróży
    note: سفر خوش to powszechne pożegnalne życzenie dla kogoś, kto wyrusza w podróż, znane już z lekcji 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: I
    gloss: i
    note: و znaczy „i” i łączy dwa zdania lub dwa elementy.
    target_text: و (i)
