    gloss: W którym miesiącu ma Pan/Pani urodziny?
    note: Łączy تولد („urodziny”), شما („Pan/Pani”), در („w”), کدام („który”) — wszystkie znane już wcześniej — oraz ماه („miesiąc”).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: Moje urodziny są w Hamal
    gloss: Moje urodziny są w miesiącu Hamal.
    note: Łączy znaną już konstrukcję تولد من در ... است („moje urodziny są w ...”) ze słowem حمل (Hamal).
