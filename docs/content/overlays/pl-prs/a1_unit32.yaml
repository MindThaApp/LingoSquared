  description: 'Dari kabulskie dla początkujących: słownictwo związane z uroczystościami i urodzinami (urodziny, uroczystość, tort, prezent, gratulacje), pytanie o miesiąc urodzin i odpowiadanie na nie, uprzejme zaproszenie oraz dialog Basira i Maryam o przyjęciu urodzinowym.'
