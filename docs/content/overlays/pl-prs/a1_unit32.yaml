  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Uroczystość
    gloss: uroczystość, przyjęcie
    note: جشن znaczy „uroczystość” lub „przyjęcie”.
    example_gloss: Nasza uroczystość jest duża.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Ciasto
    gloss: ciasto, tort
    note: کیک znaczy „ciasto” lub „tort”. To powszechne słowo, wspólne dla perskiego i dari.
    example_gloss: Ciasto jest pyszne.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Prezent
    gloss: prezent, upominek
    note: هدیه znaczy „prezent” lub „upominek”. To popularne słowo codzienne w dari i perskim (używa się też słowa تحفه).
    example_gloss: Ten prezent jest dla ciebie.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Gratulacje
    gloss: gratulacje
    note: تبریک znaczy „gratulacje”. Używa się go z می‌گویم („mówię”) w zwrocie تبریک می‌گویم („gratuluję”).
    example_gloss: Gratulacje!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Wszystkiego najlepszego (budowa życzeń)
    gloss: twoje urodziny (nieformalnie) + błogosławione → Wszystkiego najlepszego z okazji urodzin
    note: تولدت łączy تولد („urodziny”) z nieformalną końcówką -ت („twoje”); مبارک znaczy „błogosławiony, szczęśliwy”. Razem تولدت مبارک to standardowe życzenia urodzinowe w dari i perskim.
    target_text: تولدت (twoje urodziny, nieformalnie) + مبارک (błogosławiony) = تولدت مبارک (Wszystkiego najlepszego z okazji urodzin)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Wszystkiego najlepszego z okazji urodzin!
    gloss: Wszystkiego najlepszego z okazji urodzin!
    note: Prawdziwe, powszechnie używane życzenia urodzinowe w dari i perskim (تولدتان مبارک to wariant formalny, który nie pojawia się w ćwiczeniach tej lekcji).
