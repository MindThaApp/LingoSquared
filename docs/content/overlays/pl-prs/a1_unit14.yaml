    title: Ma Pan/Pani / podoba się Panu/Pani
    gloss: masz / lubisz
    note: دارین to grzecznościowa forma drugiej osoby (także liczby mnogiej) czasownika داشتن (mieć), zgodnie z zasadą tego kursu, by najpierw uczyć form grzecznościowych, jak استم/استین.
    target_text: دارین (masz/lubisz, forma grzecznościowa)
