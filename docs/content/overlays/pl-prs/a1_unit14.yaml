    note: دارد to pełna forma 3. osoby od داشتن (mieć). دوست دارد znaczy „on/ona lubi” i odpowiada wzorowi دوست دارم w 1. osobie.
    target_text: دوست دارد (on/ona lubi, pełna forma 3. osoby)
