    title: Karim pyta
    gloss: Herbata czy kawa — którą Pan/Pani woli?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Odpowiedź Negar
    gloss: Wolę kawę, bo jest pyszna. A Pan/Pani?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim odpowiada
    gloss: Lubię herbatę, bo jest ciepła.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Reakcja Negar
    gloss: Świetnie!
