    title: Przykładowy tekst o upodobaniach
    gloss: Negar lubi herbatę, bo jest ciepła. Negar nie lubi muzyki.
    note: Krótka relacja w 3. osobie, łącząca słownictwo o upodobaniach z tej lekcji.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim i Negar
    gloss: Karim, Negar
    note: Popularne afgańskie imiona, które pojawiają się w całym kursie.
    example_gloss:
    - Jestem Karim.
    - Jestem Negar.
