    gloss: (oznacza dopełnienie czasownika)
    note: را oznacza określone dopełnienie bliższe. W dari używa się go zarówno w mowie potocznej, jak i w piśmie; irańskie رو nie jest używane.
    target_text: را (znacznik dopełnienia)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Który
    gloss: który
    note: 'کدام znaczy: który (z nich).'
