  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: nie lubię
    gloss: nie lubię
    note: دوست ندارم to zaprzeczenie formy دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: Ja
    gloss: ja
    note: 'من to samodzielna zaimek pierwszej osoby: ja.'
