    title: On/ona nie lubi
    gloss: on/ona nie lubi
    note: ندارد to pełna forma przeczenia w 3. osobie. دوست ندارد znaczy „on/ona nie lubi”.
    target_text: دوست ندارد (on/ona nie lubi, pełna forma 3. osoby)
