teaching:
  prs.a1.unit52.lesson01.teach.review_this_is_in_good:
    title: 'Powtórka: to, jest, w, dobry'
    gloss: to / jest / w / dobry
    note: To słowa z powtórki (używane w całym kursie), przydatne do rozmowy o kinie.
    target_text: این (to) / است (jest) / در (w) / خوب (dobry)
  prs.a1.unit52.lesson01.teach.cinema_word:
    title: Kino
    gloss: kino
    note: To dariskie słowo oznaczające kino.
    example_gloss: Kino jest dobre.
  prs.a1.unit52.lesson01.teach.review_staff_word:
    title: 'Powtórka: pracownik'
    gloss: pracownik
    note: To to samo ogólne słowo oznaczające pracownika, które poznałeś przy basenie; tutaj wraca przy kasie biletowej w kinie.
    target_text: کارمند (pracownik)
  prs.a1.unit52.lesson01.teach.this_is_cinema_phrase:
    title: To jest kino
    gloss: To jest kino.
    note: To zdanie łączy słowa „to”, „jest” i „kino” tak samo, jak w tym kursie łączyło się je wcześniej.
  prs.a1.unit52.lesson01.teach.staff_at_cinema_phrase:
    title: Pracownik jest w kinie
    gloss: Pracownik jest w kinie.
    note: To zdanie łączy słowa „pracownik”, „w” i „kino”.
  prs.a1.unit52.lesson02.teach.review_price_and_schedule_words:
    title: 'Powtórka: ile, afgani, jest, trzydzieści, pięć, godzina, i, w, film, repertuar, ciekawy'
    gloss: ile / afgani / jest / trzydzieści / pięć / godzina / i / w / film / repertuar / ciekawy
    note: To słowa z powtórki (z wcześniejszych lekcji), przydatne do czytania repertuaru kina i pytania o cenę.
    target_text: چند (ile) / افغانی (afgani) / است (jest) / سی (trzydzieści) / پنج (pięć) / ساعت (godzina) / و (i) / در (w) / فلم (film) / برنامه (program) / جالب (ciekawy)
  prs.a1.unit52.lesson02.teach.sky_word:
    title: Niebo
    gloss: niebo
    note: Film w tej lekcji nazywa się „Niebo”, czyli tak, jak w codziennym dari mówi się na niebo.
    example_gloss: Film „Niebo” jest ciekawy.
  prs.a1.unit52.lesson02.teach.its_ticket_word:
    title: Jego bilet
    gloss: jego bilet
    note: Ten sam dzierżawczy przyrostek, który poznałeś wcześniej w tym kursie, tu dodany do słowa „bilet”.
    example_gloss: Jego bilet jest dobry.
  prs.a1.unit52.lesson02.teach.schedule_reading:
    title: Czytanie repertuaru kina
    gloss: W repertuarze kina film „Niebo” jest o piątej, a bilet na niego kosztuje 30 afgani.
  prs.a1.unit52.lesson02.teach.ask_sky_ticket_price_phrase:
    title: Ile kosztuje bilet na film „Niebo”?
    gloss: Ile kosztuje bilet na film „Niebo”?
    note: To zdanie łączy słowa poznane wcześniej w tej lekcji.
  prs.a1.unit52.lesson02.teach.sky_ticket_price_answer_phrase:
    title: Jego bilet kosztuje 30 afgani
    gloss: Jego bilet kosztuje 30 afgani.
    note: To zdanie podaje cenę biletu na film z repertuaru.
  prs.a1.unit52.lesson03.teach.review_ask_want_setup:
    title: 'Powtórka: Pan/Pani, co jest, ja, chcę, jeden'
    gloss: Pan/Pani (formalnie) / co jest / ja / chcę / jeden
    note: To słowa z powtórki, przydatne do pytania o to, jaki film lub bilet chcesz, i do mówienia o tym.
    target_text: شما (pan/pani) / چیست (co to jest) / من (ja) / می‌خواهم (chcę) / یک (jeden/jakiś)
  prs.a1.unit52.lesson03.teach.review_which_and_you_want:
    title: 'Powtórka: który, film, chce Pan/Pani'
    gloss: który / film / chce Pan/Pani (formalnie)
    note: To słowa z powtórki, przydatne do pytania, jaki film ktoś chce.
    target_text: کدام (który) / فلم (film) / می‌خواهین (chce pan/pani)
  prs.a1.unit52.lesson03.teach.which_film_phrase:
    title: Jaki film Pan/Pani chce?
    gloss: Jaki film Pan/Pani chce?
    note: Tu wraca znany już z tego kursu wzór pytania ze słowem „który”, tym razem o film.
