teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Ten / to
    gloss: ten / to
    note: این znaczy „ten / to”.
    example_gloss: To jest większe.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Tamten / tamto
    gloss: tamten / tamto
    note: آن znaczy „tamten / tamto”. W tym kursie używamy pełnej formy آن, a nie potocznej formy irańskiej اون.
    example_gloss: Tamto jest mniejsze.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Jest większe
    gloss: jest większe
    note: 'بزرگ‌تر است to pełna, niezłączona forma (jest większe): *بزرگ‌تر* to stopień wyższy od *بزرگ* (duży), a *است* pozostaje osobnym słowem.'
    example_gloss: To jest większe niż tamto.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Jest mniejsze
    gloss: jest mniejsze
    note: کوچک‌تر است to pełna forma (jest mniejsze) – کوچک to standardowa pisownia w dari (a nie potoczna irańska کوچیک).
    example_gloss: Tamto jest mniejsze niż to.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Niż
    gloss: niż
    note: از wskazuje punkt odniesienia w porównaniu – X از Y بزرگ‌تر است znaczy „X jest większe niż Y”.
    target_text: از (niż)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Jest droższe
    gloss: jest droższe
    note: گران‌تر است to pełna forma (jest droższe) – گران to standardowa pisownia w dari (a nie potoczna irańska گرون).
    example_gloss: To jest droższe niż tamto.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Jest tańsze
    gloss: jest tańsze
    note: ارزان‌تر است to pełna forma (jest tańsze) – ارزان to standardowa pisownia w dari (a nie potoczna irańska ارزون).
    example_gloss: Tamto jest tańsze niż to.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim i Negar
    gloss: Karim, Negar
    note: Popularne afgańskie imiona, które pojawiają się w całym kursie.
    example_gloss:
    - Jestem Karim.
    - Jestem Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Wyższy / wyższa
    gloss: jest wyższy / wyższa
    note: '*قد بلندتر است* dosłownie znaczy „wzrost jest wyższy”: *قد* (wzrost), *بلندتر* (wyższy, stopień wyższy od *بلند*, wysoki), *است* (jest).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Młodszy / młodsza
    gloss: jest młodszy / młodsza
    note: جوان‌تر است to pełna forma (jest młodszy/młodsza) – جوان to standardowa pisownia w dari (a nie potoczna irańska جوون).
    example_gloss: Negar jest młodsza niż Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Jest lepsze
    gloss: jest lepsze
    note: بهتر است to pełna forma – بهتر (lepszy) to nieregularny stopień wyższy od خوب (dobry).
    example_gloss: To jest lepsze niż tamto.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Jest gorsze
    gloss: jest gorsze
    note: بدتر است to pełna forma – بدتر (gorszy) to nieregularny stopień wyższy od بد (zły).
    example_gloss: Tamto jest gorsze niż to.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Ponieważ
    gloss: ponieważ / bo
    note: چون wprowadza powód.
    target_text: چون (ponieważ)
  prs.a1.unit15.lesson04.teach.va_word:
    title: I
    gloss: i
    note: و znaczy „i” i łączy dwa zdania lub dwa elementy.
    target_text: و (i)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Przykładowy tekst porównujący
    gloss: Karim jest wyższy niż Negar. Negar jest młodsza niż Karim.
    note: Krótkie porównanie w trzeciej osobie, łączące słownictwo z tej lekcji.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim i Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim jest wyższy.
    - Negar jest młodsza.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Ale
    gloss: ale
    note: اما znaczy „ale” i wprowadza przeciwstawienie.
    target_text: اما (ale)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Tak
    gloss: tak
    note: بلی to uprzejme, formalne słowo oznaczające „tak”, zgodne z rejestrem tego kursu.
    example_gloss: Tak, to jest droższe.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim mówi
    gloss: To jest droższe niż tamto, ale lepsze.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar odpowiada
    gloss: Tak, ale tamto jest tańsze.
