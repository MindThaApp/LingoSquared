course:
  title: Dari w polskim A1
  description: 'Dari afgańskie dla początkujących: nazywanie typowych miejsc w mieście, pytanie, gdzie coś jest, proste odpowiedzi o położeniu i podstawowe wskazówki dojścia do celu.'
units:
