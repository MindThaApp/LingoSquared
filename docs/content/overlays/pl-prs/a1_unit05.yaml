    title: Ważne miejsca w mieście
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: Codzienne miejsca w mieście
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: Miejsca publiczne i podróżne
  prs.a1.unit05.lesson03.asking_where:
    title: Pytanie, gdzie coś jest
  prs.a1.unit05.lesson04.simple_location_answers:
    title: Blisko, daleko, tutaj i tam
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: Przyimki miejsca
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: Znajdź aptekę w okolicy
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Targ
    gloss: bazar / targ
    note: بازار to codzienne słowo na okolicę handlową, często całą ulicę lub dzielnicę sklepów.
    example_gloss: Bazar jest blisko.
  prs.a1.unit05.lesson01.teach.bank:
    title: Bank
    gloss: bank
    note: بانک to zapożyczenie, które brzmi podobnie jak polskie słowo „bank” i jest używane w ten sam sposób.
    example_gloss: Gdzie jest bank?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Meczet
    gloss: meczet
    note: مسجد to standardowe słowo oznaczające meczet.
    example_gloss: Meczet jest duży.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Szpital
    gloss: szpital
    note: شفاخانه to codzienne słowo na szpital w afgańskim dari – różni się od irańskiego perskiego بیمارستان, które użytkownicy dari mogą rozumieć, ale zwykle same go nie używają.
    example_gloss: Szpital jest daleko.
  prs.a1.unit05.lesson01.teach.school:
    title: Szkoła
    gloss: szkoła
    note: مکتب to codzienne słowo na szkołę w afgańskim dari – różni się od irańskiego perskiego مدرسه, które w dari oznacza zwykle szkołę religijną.
    example_gloss: Szkoła jest blisko domu.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Apteka
    gloss: apteka
    note: دواخانه to codzienne słowo na aptekę w afgańskim dari (od دوا, „lekarstwo”) – różni się od irańskiego perskiego داروخانه.
    example_gloss: Gdzie jest apteka?
  prs.a1.unit05.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to powszechne słowo łączące, służące do wymieniania miejsc.
    target_text: و (i)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Poczta
    gloss: poczta
    note: پوسته خانه łączy پوسته („poczta, przesyłki”) z خانه („dom, budynek”).
    example_gloss: Poczta jest zamknięta.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Ambasada
    gloss: ambasada
    note: سفارت to standardowe słowo oznaczające ambasadę.
    example_gloss: Ambasada jest w Kabulu.
  prs.a1.unit05.lesson02.teach.airport:
    title: Lotnisko
    gloss: lotnisko
    note: میدان هوایی to potoczne afgańskie określenie lotniska w dari (dosłownie „pole powietrzne”) – inne niż irańskie perskie فرودگاه.
    example_gloss: Lotnisko jest daleko.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Biuro (powtórka)
    gloss: biuro
    note: دفتر pojawiło się już we wcześniejszej lekcji; tutaj występuje razem z innymi miejscami użyteczności publicznej.
    example_gloss: Moje biuro jest blisko.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Zapytaj, gdzie jest bazar
    gloss: Gdzie jest bazar?
    note: بازار کجاست؟ to podstawowy wzór pytania o to, gdzie jest dane miejsce.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Zapytaj, gdzie jest szpital
    gloss: Gdzie jest szpital?
    note: Ten sam wzór z کجاست pasuje do każdego rzeczownika oznaczającego miejsce.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Grzecznie zwróć na siebie uwagę
    gloss: Przepraszam, gdzie jest apteka?
    note: ببخشین grzecznie rozpoczyna pytanie do nieznajomego, podobnie jak polskie „przepraszam” w zdaniu „Przepraszam, gdzie jest…?”.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Jak powstaje کجاست
    gloss: کجاست to کجا (gdzie) plus است (jest), zlane w jedno słowo.
    note: Dzięki temu rozbiorowi łatwiej dostrzec wzór, zamiast uczyć się کجاست na pamięć jako jednego nierozłożonego bloku.
  prs.a1.unit05.lesson04.teach.near:
    title: Blisko
    gloss: w pobliżu
    note: نزدیک opisuje coś, co jest blisko.
    example_gloss: Bank jest blisko.
  prs.a1.unit05.lesson04.teach.far:
    title: Daleko
    gloss: daleko
    note: دور opisuje coś, co jest oddalone.
    example_gloss: Szpital jest daleko.
  prs.a1.unit05.lesson04.teach.here:
    title: Tutaj
    gloss: tutaj
    note: این‌جا wskazuje miejsce, w którym znajduje się mówiący.
    example_gloss: Bank jest tutaj.
  prs.a1.unit05.lesson04.teach.there:
    title: Tam
    gloss: tam
    note: آن‌جا wskazuje miejsce oddalone od mówiącego.
    example_gloss: Apteka jest tam.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Powiedz, że bazar jest blisko
    gloss: Bazar jest blisko.
    note: بازار نزدیک است zawiera ten sam łącznik است, który pojawia się w całym kursie.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Powiedz, że lotnisko jest daleko
    gloss: Lotnisko jest daleko.
    note: میدان هوایی دور است ma ten sam wzór, tylko z دور zamiast نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Obok
    gloss: obok
    note: در کنار dosłownie znaczy „z boku”.
  prs.a1.unit05.lesson05.teach.behind:
    title: Za
    gloss: za (z tyłu)
    note: پشت oznacza, że coś znajduje się za innym miejscem.
    example_gloss: Apteka jest za szkołą.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Naprzeciwko
    gloss: naprzeciwko
    note: مقابل oznacza, że coś znajduje się dokładnie naprzeciwko innego miejsca.
    example_gloss: Bank jest naprzeciwko meczetu.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Określ położenie szpitala względem meczetu
    gloss: Szpital jest obok meczetu.
    note: شفاخانه در کنار مسجد است łączy nazwę miejsca, przyimek در کنار i łącznik است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Bardzo dziękuję
    gloss: Bardzo dziękuję.
    note: تشکر زیاد wzmacnia codzienne تشکر, które już znasz.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina pyta o aptekę
    gloss: Zarmina grzecznie pyta przechodnia, gdzie jest apteka.
    note: ببخشین otwiera pytanie w uprzejmy sposób, odpowiedni wobec nieznajomego.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Przechodzień wskazuje drogę
    gloss: Przechodzień mówi, że apteka nie jest daleko, że trzeba iść prosto i że jest obok szkoły.
    note: 'Ta wypowiedź łączy kilka wzorów z tej lekcji: دور نیست (zaprzeczone دور), مستقیم بروین oraz در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina dziękuje przechodniowi
    gloss: Zarmina bardzo mu dziękuje.
    note: تشکر زیاد grzecznie kończy rozmowę.
  prs.a1.unit05.lesson06.teach.turn04:
    title: Skromna odpowiedź przechodnia
    gloss: Nie ma za co.
    note: قابلی نداره to częsty, skromny sposób odpowiedzi na podziękowanie w codziennym afgańskim dari, podobny w funkcji do خواهش می‌کنم, ale bardziej swobodny. نداره to forma mówiona od ندارد; w mowie usłyszysz نداره, a w starannym piśmie używa się ندارد.
