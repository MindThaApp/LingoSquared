  fa.a1.unit12.lesson06.teach.dialogue_line1:
    title: サーラ、木曜日に映画を見に行かない?
    gloss: サーラ、木曜日に映画を見に行かない?
    note: アラッシュが誘いの言葉で会話を始めます。
  fa.a1.unit12.lesson06.teach.dialogue_line2:
    title: 何時ですか?
    gloss: 何時ですか?
    note: サーラは決める前に、具体的な時刻をたずねます。
  fa.a1.unit12.lesson06.teach.dialogue_line3:
    title: 夜8時だよ。
    gloss: 夜8時だよ。
    note: アラッシュが時刻を伝えます。
