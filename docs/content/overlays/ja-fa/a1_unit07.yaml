course:
  title: ペルシア語 A1
  description: 初級のイランのペルシア語:天気や気温の言い表し方、天気のたずね方、天気に合わせた簡単な計画の立て方を学びます。
units:
  fa.a1.unit07.weather:
    title: 天気と計画
lessons:
  fa.a1.unit07.lesson01.weather_conditions:
    title: 基本の天気
  fa.a1.unit07.lesson02.temperature_words:
    title: 暑いと寒い
  fa.a1.unit07.lesson03.asking_about_weather:
    title: 天気をたずねる
  fa.a1.unit07.lesson04.describing_todays_weather:
    title: 今日の天気を言う
  fa.a1.unit07.lesson05.weather_based_suggestions:
    title: 天気に合わせて提案する
  fa.a1.unit07.lesson06.weather_plan_dialogue:
    title: 天気に合わせて計画を立てる二人の友人
teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: 晴れ
    gloss: 晴れ
    note: آفتابی は晴れた天気を表します。
    example_gloss: 今日は天気が晴れです。
  fa.a1.unit07.lesson01.teach.rainy:
    title: 雨の
    gloss: 雨の
    note: بارونی は、بارانی(雨の)の日常的な話し言葉の綴り・発音です。
    example_gloss: 明日は雨です。
  fa.a1.unit07.lesson01.teach.cloudy:
    title: 曇り
    gloss: くもり
    note: ابری は曇りの天気を表します。
    example_gloss: 天気は曇りです。
  fa.a1.unit07.lesson01.teach.snowy:
    title: 雪の
    gloss: 雪の
    note: برفی は雪の天気を表します。
    example_gloss: 冬は雪が降ります。
  fa.a1.unit07.lesson01.teach.or_word:
    title: または
    gloss: または
    note: یا は、二つの天気のどちらかを選ぶときにつなぎます。
    target_text: یا (または)
  fa.a1.unit07.lesson02.teach.hot:
    title: 暑い
    gloss: 暑い
    note: گرم は、暑い天気や気温を全般的に表します。
    example_gloss: 今日は暑いです。
  fa.a1.unit07.lesson02.teach.cold:
    title: 寒い
    gloss: 寒い
    note: سرد は、寒い天気や気温を全般的に表します。
    example_gloss: 冬は寒いです。
  fa.a1.unit07.lesson02.teach.cool:
    title: 涼しい
    gloss: 涼しい
    note: خنک は、گرم と سرد の間の、穏やかで涼しい天気を表します。
    example_gloss: 夕方は涼しいです。
  fa.a1.unit07.lesson03.teach.weather_word:
    title: 天気
    gloss: 天気
    note: هوا は天気を表す一般的な単語です(「空気」の意味もあります)。
    example_gloss: 今日の天気はどうですか。
  fa.a1.unit07.lesson03.teach.weather_question:
    title: 天気をたずねる
    gloss: 天気はどうですか。
    note: هوا چطوره؟ では、ユニット1の حالتون چطوره؟ で出てきたのと同じ、話し言葉の「どうですか」を表す疑問の言葉 چطوره を使っています。
  fa.a1.unit07.lesson03.teach.today_word:
    title: 今日
    gloss: 今日
    note: امروز は、現在の日を表します。
    example_gloss: 今日はいい天気です。
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: 明日
    gloss: 明日
    note: فردا は、次の日を表します。
    example_gloss: また明日会いましょう。
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: 今日は晴れだと言う
    gloss: 今日は天気が晴れです。
    note: امروز هوا آفتابیه では、このコースですでに出てきた話し言葉の -e の短縮形(آفتابیه = آفتابی است)を使っています。
  fa.a1.unit07.lesson04.teach.today_cold:
    title: 今日は寒いと言う
    gloss: 今日は寒いです。
    note: امروز سرده も同じ短縮形のパターンです。
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: 話し言葉の -e の短縮形
    gloss: آفتابیه は、آفتابی است を日常の話し言葉で縮めた形です。
    note: このパターン(形容詞+ ه)は、どの天気の単語にも使えます:سرده、گرمه、بارونیه、ابریه、برفیه。
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: 今日は雨だと言う
    gloss: 今日は雨です。
    note: امروز بارونیه は、بارونی にも同じ -e の短縮形を使っています。
  fa.a1.unit07.lesson05.teach.because_word:
    title: 〜から/〜ので(理由)
    gloss: なぜなら / ~ので
    note: چون は、提案の理由を述べるときに使います。
    example_gloss: 寒いので、コートを着ています。
  fa.a1.unit07.lesson05.teach.better_to:
    title: 傘を持っていこうと提案する
    gloss: 傘を持っていったほうがいいですね。
    note: بهتره چتر ببریم は、口語の بهتره(〜のほうがいい)を使った、やわらかい提案です。
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: 理由と提案をつなげる
    gloss: 雨なので、傘を持っていったほうがいいですね。
    note: چون بارونیه، بهتره چتر ببریم は、天気の理由と提案をつなげた文です。
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: コートを着ようと提案する
    gloss: 寒いので、コートを着たほうがいいですね。
    note: چون سرده، بهتره کت بپوشیم は、同じ「理由+提案」の形を寒い天気に当てはめた文です。
  fa.a1.unit07.lesson06.teach.coat_review:
    title: コートを着ようと提案する
    gloss: コートを着たほうがいい
    note: کت بپوشیم は、چتر ببریم と同じ「بهتره+動詞」の形を寒い天気に当てはめた表現です。
    example_gloss: 寒いから、コートを着ましょう。
  fa.a1.unit07.lesson06.teach.turn01:
    title: サラが今日の天気をたずねる
    gloss: サラが今日の天気はどうかとたずねています。
    note: هوا چطوره؟ は、第3課の質問を再び使っています。
  fa.a1.unit07.lesson06.teach.turn02:
    title: レザが雨だと言う
    gloss: レザは雨だと思うと言っています。
    note: فکر کنم(〜と思う)は、確信がなく推測で話しているため、言い方をやわらげます。
  fa.a1.unit07.lesson06.teach.turn03:
    title: サラが傘を持っていこうと提案する
    gloss: サラは、それなら傘を持っていったほうがいいと言っています。
    note: پس(それなら/だから)は、天気の事実と提案をつなぎます。
  fa.a1.unit07.lesson06.teach.turn04:
    title: レザが同意して、明日のことをたずねる
    gloss: レザは同意して、明日はどうかとたずねています。
    note: فردا چی؟ は、翌日のことを簡潔に自然にたずねる言い方です。
  fa.a1.unit07.lesson06.teach.turn05:
    title: サラが明日の天気を説明する
    gloss: サラは、明日は晴れて暑くなると言っています。
    note: آفتابیه و گرمه は、天気を表す短縮形の2つを و(〜と)でつないでいます。
  fa.a1.unit07.lesson06.teach.turn06:
    title: レザが公園に行こうと提案する
    gloss: レザは、それはいいね、じゃあ公園に行こうと言っています。
    note: عالیه(すばらしい)は、計画を提案する前に前向きな反応を示します。
  fa.a1.unit07.lesson06.teach.turn07:
    title: サラが同意して別れのあいさつをする
    gloss: サラは同意して、明日会おうと言っています。
    note: باشه(いいよ)は、計画に同意するときによく使う口語表現です。
