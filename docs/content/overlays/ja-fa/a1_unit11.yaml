course:
  title: ペルシア語 A1
  description: 'ペルシア語(イラン)初級： 日課の動詞、時刻を使った日課の説明、1日の時間帯、短い日課の文章の読解、日課の比較、そして2人の1日のスケジュールについての会話までを学びます。'
