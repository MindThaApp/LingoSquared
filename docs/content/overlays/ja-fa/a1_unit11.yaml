teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: 起きます
    gloss: 起きます
    note: بیدار می‌شم は、بیدار می‌شوم のテヘランの口語形です。
    example_gloss: 私は毎日7時に起きます。
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: 朝ごはんを食べます
    gloss: 朝ごはんを食べます
    note: صبحونه می‌خورم は、改まった形の صبحانه ではなく、口語の صبحونه(朝ごはん)を使っています。
    example_gloss: 朝ごはんを食べて、仕事に行きます。
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: 仕事に行きます
    gloss: 仕事に行きます
    note: میرم سر کار は、می‌روم سر کار の口語形です。
    example_gloss: そのあと、仕事に行きます。
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: 寝ます
    gloss: 寝ます
    note: می‌خوابم は「寝ます」「眠ります」という意味です。
    example_gloss: 夜は早く寝ます。
  fa.a1.unit11.lesson01.teach.va_word:
    title: 〜と、そして
    gloss: 〜と、そして
    note: '*و* は、日課の行動をつなぐときによく使う語で、ユニット9で既に出てきました。'
    example_gloss: 起きて、朝ごはんを食べます。
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: 何時に起きますか。
    gloss: 何時に起きますか。
    note: '*ساعت چند بیدار می‌شی؟* は、ユニット9の時刻の課で習った *ساعت چند*(何時)をもう一度使っています。'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: 7時に起きます。
    gloss: 7時に起きます。
    note: ساعت هفت بیدار می‌شم は、具体的な起床時刻を伝える表現です。
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: 毎日
    gloss: 毎日
    note: هر روز は「毎日」という意味で、日課を習慣として表すときに使います。
    example_gloss: 私は毎日7時に起きます。
  fa.a1.unit11.lesson03.teach.bad:
    title: そのあと
    gloss: その後
    note: بعدش は「そのあと」という意味で、日課の行動を順に述べるときに使います。
    example_gloss: 起きて、そのあと朝ごはんを食べます。
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: 朝、昼、夕方、夜
    gloss: 朝、昼、夕方、夜
    note: '*صبح*、*ظهر*、*عصر*、*شب* は1日の4つの時間帯で、ユニット9の復習です。'
    example_gloss:
    - 朝に起きます。
    - 正午に昼食を食べます。
    - 私は午後に働きます。
    - 私は夜中に眠ります。
  fa.a1.unit11.lesson03.teach.night_routine:
    title: 夜は11時に寝ます。
    gloss: 夜は11時に寝ます。
    note: '*شب‌ها ساعت یازده می‌خوابم* は、ユニット9の時間帯の語彙 *شب*(夜)をもとにしています。*شب‌ها* は、習慣としての「夜は」という意味です。'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: 日課の文章
    gloss: 毎日7時に起きます。そのあと朝ごはんを食べて、仕事に行きます。
    note: これは、朝の日課をつながった文で説明した実用的な文章です。هر روز と بعدش を使って、行動を順に述べています。
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: あなたは？
    gloss: あなたは？
    note: تو چی؟ は、相手に同じ質問を返すときに使います。
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: 少し遅く
    gloss: 少し遅く
    note: یه‌کم دیرتر は「少し遅く」という意味で、2人の日課を比べるときに使います。
  fa.a1.unit11.lesson06.teach.turn01:
    title: 毎日何時に起きますか。
    gloss: 毎日何時に起きますか。
    note: サーラが、まずニマに起きる時間をたずねています。
  fa.a1.unit11.lesson06.teach.turn02:
    title: 7時に起きます。あなたは？
    gloss: 7時に起きます。あなたは？
    note: ニマが答えて、同じ質問をサーラに返しています。
  fa.a1.unit11.lesson06.teach.turn03:
    title: 私は少し遅くて、8時です。
    gloss: 私は少し遅くて、8時です。
    note: サーラが、自分の起きる時間をニマと比べています。
  fa.a1.unit11.lesson06.teach.turn04:
    title: 起きたあと、何をしますか。
    gloss: 起きたあと、何をしますか。
    note: ニマが、サーラの日課の次の行動をたずねています。
  fa.a1.unit11.lesson06.teach.turn05:
    title: 朝ごはんを食べて、仕事に行きます。夜はたいてい11時に寝ます。
    gloss: 朝ごはんを食べて、仕事に行きます。夜はたいてい11時に寝ます。
    note: サーラが、日課の残りを1つのまとまった答えで話しています。ユニット内でこれまでに出てきた起床・就寝の時刻と一致しています。
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: 彼/彼女は起きる、彼/彼女は寝る
    gloss: 彼/彼女は起きる、彼/彼女は寝る
    note: بیدار می‌شه と می‌خوابه は三人称(او)の形で、サラやニマが何をするかをまとめて言うときに使います。このユニットのほかの場面で使う一人称の形(بیدار می‌شم، می‌خوابم)とは異なります。
