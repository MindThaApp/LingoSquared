teaching:
  fa.a1.unit13.lesson01.teach.diruz_word:
    title: 昨日
    gloss: 昨日
    note: دیروز は「昨日」という意味です。
    example_gloss: 昨日、映画館に行きました。
  fa.a1.unit13.lesson01.teach.raftam_word:
    title: 私は行った
    gloss: 私は行った
    note: رفتم は رفتن(行く)の単純過去・1人称です。
    example_gloss: レストランに行きました。
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: 食べました
    gloss: 食べました
    note: خوردم は خوردن(食べる)の単純過去・1人称です。
    example_gloss: 昼ご飯を食べました。
  fa.a1.unit13.lesson01.teach.didam_word:
    title: 見ました
    gloss: 見ました
    note: دیدم は دیدن(見る)の単純過去・1人称です。
    example_gloss: 良い映画を見ました。
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: 映画館/映画
    gloss: 映画館/映画
    note: سینما は「映画館」または「映画」という意味です。
    example_gloss: 昨日、映画館に行きました。
  fa.a1.unit13.lesson02.teach.be_word:
    title: 〜へ
    gloss: ~へ
    note: به は「~へ」という意味で、行き先の前に置きます。
    target_text: به (〜へ)
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: 昨日、映画館に行きました。
    gloss: 昨日、映画館に行きました。
    note: دیروز به سینما رفتم は、このレッスンの単語を組み合わせた一つの文です。
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: 何(をしたか)
    gloss: 何(をしたか)
    note: چیکار(何の仕事・何の行動)は、相手が何をしたかをたずねるときに使います。
    example_gloss: 昨日、何をしましたか?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: あなたがしました
    gloss: あなたがしました
    note: کردی は کردن(する)の単純過去で、くだけた2人称です。
    example_gloss: あなたは何をしましたか?
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: 昨日は何をしましたか?
    gloss: 昨日は何をしましたか？
    note: دیروز چیکار کردی؟ は、昨日何をしたかをたずねる、会話でよく使う言い方です。
  fa.a1.unit13.lesson04.teach.film_word:
    title: 映画
    gloss: 映画
    note: فیلم は「映画」という意味です。
    example_gloss: 良い映画を見ました。
  fa.a1.unit13.lesson04.teach.khoob_word:
    title: 良い
    gloss: 良い
    note: خوب は「良い」という意味です。
    example_gloss: その映画は良かったです。
  fa.a1.unit13.lesson04.teach.recent_event_text:
    title: 最近のできごとの例文
    gloss: 昨日、映画館に行きました。良い映画を見ました。そのあと昼ご飯を食べました。
    note: この単元の過去形の語彙を組み合わせた、1人称の短い話です。
  fa.a1.unit13.lesson04.teach.va_word:
    title: と
    gloss: と
    note: و は「と」「そして」という意味で、二つの文や語をつなぎます。
    target_text: و (〜と、そして)
  fa.a1.unit13.lesson05.teach.ketab_word:
    title: 本
    gloss: 本
    note: کتاب は「本」という意味です。
    example_gloss: 本を読みました。
  fa.a1.unit13.lesson05.teach.khoondam_word:
    title: 私は読む
    gloss: 読みます
    note: خوندم は خواندن(読む)の口語の単純過去・1人称です。
    example_gloss: 昨日、本を読みました。
  fa.a1.unit13.lesson06.teach.man_word:
    title: 私
    gloss: 私
    note: من は単独で使う1人称の代名詞で、ここでは強調に使われています(من خونه موندم =私は家にいました)。
    example_gloss: 家にいました。
  fa.a1.unit13.lesson06.teach.names:
    title: ニマとサラ
    gloss: ニマ、サラ
    note: نیما と سارا は、このレッスンの会話の二人の話し手です。
    example_gloss:
    - ニマは家にいて、本を読みました。
    - サラは昨日、映画館に行きました。
  fa.a1.unit13.lesson06.teach.khooneh_moondam_word:
    title: 家にいました
    gloss: 家にいました
    note: خونه موندم は「家にいました」という意味で、口語の خونه(家)を使っています。
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: あなたは?
    gloss: あなたは?
    note: تو چی؟ は直訳すると「あなた、何?」で、同じ質問を相手に返す自然な言い方です。
  fa.a1.unit13.lesson06.teach.alie_word:
    title: いいですね
    gloss: すばらしい
    note: عالیه は、すでに学んだ -e の縮約パターンです(عالی است → عالیه)。
    example_gloss: すばらしい、どうでしたか?
  fa.a1.unit13.lesson06.teach.dialogue_line1:
    title: 昨日は何をしましたか?
    gloss: 昨日は何をしましたか？
    note: ニマは、サラに昨日何をしたかをたずねて会話を始めます。
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: 映画館に行って、良い映画を見ました。あなたは?
    gloss: 映画館に行って、良い映画を見ました。あなたは?
    note: サラは答えて、同じ質問を返します。
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: 家にいて、本を読みました。
    gloss: 家にいて、本を読みました。
    note: ニマは自分の一日を話します。
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: すばらしい!
    gloss: すばらしい!
    note: サラは前向きに反応して、やりとりを締めくくります。
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: 彼/彼女は行った・見た・した・滞在した・読んだ(三人称)
    gloss: 彼/彼女は行った、見た、した、残った、読んだ(3人称)
    note: رفت، دید، کرد، موند، خوند は3人称の単純過去形で、サラとニマがそれぞれ何をしたかを比べるときに必要です。
    target_text: رفت، دید، کرد، موند، خوند (彼/彼女が行った、見た、した、とどまった、読んだ -- 三人称)
