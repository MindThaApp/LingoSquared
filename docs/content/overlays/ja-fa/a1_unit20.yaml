teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: シャツ
    gloss: シャツ
    note: پیراهن はシャツ全般を指す言葉です。
    example_gloss: シャツがほしいです。
  fa.a1.unit20.lesson01.teach.pants_word:
    title: ズボン
    gloss: ズボン
    note: شلوار は「ズボン」という意味です。
    example_gloss: このズボンはいくらですか?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: 靴
    gloss: 靴
    note: کفش は「靴」という意味です。
    example_gloss: 靴はありますか?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: ジャケット
    gloss: ジャケット
    note: کت はスーツのジャケットやブレザーのようなジャケットを指します。厚手の冬用コートは、ふつう別の言葉で呼びます。
    example_gloss: ジャケットがほしいです。
  fa.a1.unit20.lesson01.teach.nice_word:
    title: すてき/きれい
    gloss: すてき
    note: قشنگ は「すてき・きれい」を表す日常的な言葉で、よく -e の短縮形(قشنگه)で使われます。
    example_gloss: このジャケットはすてきです。
  fa.a1.unit20.lesson01.teach.want_word:
    title: ~がほしい(復習)
    gloss: 〜がほしいです
    note: '*می‌خوام* は *می‌خواهم* の日常会話での形です。前のユニットで出てきましたが、このユニットでは衣類を頼むときに通して使います。'
    target_text: می‌خوام(~がほしい)
  fa.a1.unit20.lesson01.teach.va_word:
    title: ~と(復習)
    gloss: ~と
    note: '*و* は「~と」を表す一般的なつなぎの言葉で、前のユニットで復習済みです。'
    target_text: و(~と)
  fa.a1.unit20.lesson02.teach.color_word:
    title: 色
    gloss: 色
    note: رنگ は「色」を表す一般的な言葉です。
    example_gloss: 何色がいいですか?
  fa.a1.unit20.lesson02.teach.red_word:
    title: 赤
    gloss: 赤い
    note: قرمز は「赤」という意味です。
    example_gloss: このシャツは赤です。
  fa.a1.unit20.lesson02.teach.blue_word:
    title: 青い
    gloss: 青い
    note: آبی は「青」という意味で、-e の短縮形(آبیه)で「青です」を表します。
    example_gloss: 私のズボンは青です。
  fa.a1.unit20.lesson02.teach.black_word:
    title: 黒
    gloss: 黒
    note: سیاه は「黒」という意味です。
    example_gloss: 黒い靴はすてきです。
  fa.a1.unit20.lesson02.teach.white_word:
    title: 白
    gloss: 白
    note: سفید は「白」という意味です。
    example_gloss: 白いジャケットがほしいです。
  fa.a1.unit20.lesson03.teach.size_word:
    title: サイズ
    gloss: サイズ
    note: سایز は服のサイズを表す日常的な言葉です。
    example_gloss: どのサイズがよろしいですか?
  fa.a1.unit20.lesson03.teach.big_word:
    title: 大きい
    gloss: 大きい
    note: بزرگ は「大きい」という意味です。
    example_gloss: 大きいサイズがほしいです。
  fa.a1.unit20.lesson03.teach.small_word:
    title: 小さい
    gloss: 小さい
    note: کوچیک は「小さい」という意味で、「小さいです」と言うときは -e が付いた短い形 (کوچیکه) になります。
    example_gloss: この靴は小さいです。
  fa.a1.unit20.lesson03.teach.medium_word:
    title: ミディアム
    gloss: 中くらいの
    note: متوسط は「中くらい」「Mサイズ」という意味です。
    example_gloss: Mサイズはありますか?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: 試着をお願いする
    gloss: 試着してもいいですか?
    note: می‌تونم امتحانش کنم؟ は、服を試着したいときに使う日常的な話し言葉の表現です。
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: はい、どうぞ
    gloss: はい、どうぞ。
    note: '*بله، بفرمایید* は、店の人が丁寧に承諾するときの言い方で、前のユニットで学んだ *بفرمایید* を使っています。'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: 話し言葉の می‌تونم への変化(復習)
    gloss: できます(話し言葉)
    note: 日常会話では、書き言葉の -ان- が -ون- になることがよくあります。*می‌توانم* が *می‌تونم*(できます)になります。*تومان* が話し言葉で *تومن* になるのも、すでに出てきた同じ変化です。
  fa.a1.unit20.lesson05.teach.label_text:
    title: 服のラベル
    gloss: サイズ:大。色:赤。
    note: 実際の服に付いているのと同じ形式の、短いラベル(タグ)です。
  fa.a1.unit20.lesson06.teach.please_review:
    title: どうぞ(復習)
    gloss: どうぞ
    note: 前のユニットで学んだ表現の復習です。
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: ありがとう(復習)
    gloss: ありがとう
    note: 前のユニットで学んだ表現の復習です。
  fa.a1.unit20.lesson06.teach.ok_review:
    title: わかりました(復習)
    gloss: 大丈夫
    note: 前のユニットで学んだ表現の復習です。
  fa.a1.unit20.lesson06.teach.turn01:
    title: 店の人がお客さんにあいさつする
    gloss: こんにちは、どうぞ。
  fa.a1.unit20.lesson06.teach.turn02:
    title: ニマが青いシャツを頼む
    gloss: こんにちは。青いシャツがほしいです。
  fa.a1.unit20.lesson06.teach.turn03:
    title: 店の人がサイズをたずねる
    gloss: どのサイズがよろしいですか?
  fa.a1.unit20.lesson06.teach.turn04:
    title: ニマがサイズを伝えて、試着をお願いする
    gloss: Mサイズです。試着してもいいですか?
  fa.a1.unit20.lesson06.teach.turn05:
    title: 店の人が承諾する
    gloss: はい、どうぞ。
  fa.a1.unit20.lesson06.teach.turn06:
    title: ニマが気に入って、値段をたずねる
    gloss: いいですね。これはいくらですか?
  fa.a1.unit20.lesson06.teach.turn07:
    title: 店の人が値段を言う
    gloss: 3万トマンです。
  fa.a1.unit20.lesson06.teach.turn08:
    title: ニマが現金で払うと言う
    gloss: わかりました、現金で払います。ありがとうございます。
