  fa.a1.unit30.lesson02.teach.answer_major:
    title: 私の専攻は数学です。英語も学んでいます。
    gloss: 私の専攻は数学です。英語も学んでいます。
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم*は、自分の専攻と追加の科目を述べる文で、目的語を示す*رو*と*هم*(「も」)を使っています。'
  fa.a1.unit30.lesson03.teach.review_koja:
