    gloss: 学ぶ+私=私は学んでいる
    note: '*یاد گرفتن*は「学ぶ」の意味です。現在形の*یاد می‌گیرم*は、*عکس می‌گیرم*(「写真を撮る」)と同じ動詞*گرفتن*を、別の意味で使っています。'
    target_text: یاد گرفتن (学ぶ) + م = یاد می‌گیرم (私は学んでいる)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
