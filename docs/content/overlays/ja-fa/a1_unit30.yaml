    gloss: ニマは大学で数学を勉強しています。数学は難しいけれどおもしろいです。サラは英語を勉強しています。彼女は毎日大学に行きます。
    note: この読み物は、会話を3人称で語り直したものです。新しい単語はほとんどないので、文章の中で単語を見分ける練習になります。
