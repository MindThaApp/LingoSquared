    note: '*در*は「〜で」「〜に」の意味で、ここでは「大学で」という意味で使われます。'
    target_text: در (〜で / 〜に)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: 勉強する・読む+私=私は勉強します・読みます
    gloss: 勉強する/読む+私=私は勉強する/読む
    note: '*خوندن*(「読む」または*کتاب خوندن*のような「勉強する」)は、*می‌کنم*と同じ現在形の語尾*-م*が付いて*می‌خونم*(「私は勉強します」「私は読みます」)になります。'
    target_text: خوندن (勉強する/読む) + م = می‌خونم (私は勉強する/読む)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: 大学で勉強しています
    gloss: 大学で勉強しています
    note: '*من در دانشگاه درس می‌خونم*は、*من*+*در*+*دانشگاه*+*درس*+*می‌خونم*を組み合わせた文です。'
  fa.a1.unit30.lesson02.teach.riazi_word:
