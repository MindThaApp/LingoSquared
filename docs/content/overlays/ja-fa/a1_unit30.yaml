course:
  title: ペルシア語 A1
  description: 初級イランのペルシア語：大学・勉強に関する単語（大学、学生、授業・科目、言語）を覚え、何を専攻しているか、何を学んでいるか（数学、専攻・学科、科目としての英語）を話し、どこで勉強しているか（*کجا درس می‌خونی؟*）やどのくらい通っているかをたずねて答える練習をします。*نیما*と*سارا*の勉強についての読み物と、*نیما*と*سارا*が自分の科目やそれについての気持ち（難しいけれど面白い）を話す最後の会話もあります。
