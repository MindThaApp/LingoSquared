    title: まっすぐ行くと、ホテルはレストランの隣です
    gloss: 通行人:まっすぐ行ってください。それから、右側にレストランがあります。ホテルはそのレストランの隣です。
    note: کنار は「〜の隣」という意味で、همون رستورانه は今話に出たレストランを指します。
