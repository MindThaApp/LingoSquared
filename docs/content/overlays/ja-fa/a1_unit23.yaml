teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: うれしい
    gloss: うれしい
    note: خوشحال は「うれしい」という意味です。
    example_gloss: 私はうれしいです。
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: 悲しい
    gloss: 悲しい
    note: ناراحت は「悲しい」という意味です。
    example_gloss: 私は悲しいです。
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: 私は〜です(短縮形)
    gloss: 〜です(形容詞と短縮した形)
    note: '*خوشحالم* は *خوشحال* + *هستم* が *-م* に短縮された形です。発音しない *-ه* のあとでは、同じ語尾が *-ام* と書かれます。例:*خسته‌ام*。'
    target_text: خوشحالم = خوشحال + هستم(私はうれしいです、短縮形)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: 疲れた
    gloss: 疲れた
    note: خسته は「疲れた」という意味です。
    example_gloss: 私は疲れています。
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: 元気ではありません
    gloss: 元気ではありません
    note: خوب نیستم は、すでに学んだ خوبم(元気です)を、هستم の否定形 نیستم で否定した形です。
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: おなかがすいた
    gloss: おなかがすいた
    note: '*گشنه* は「おなかがすいた」という意味です。第4課で学んだ *گرسنه* の、日常の話し言葉での形です。'
    example_gloss: 私はおなかがすいています。
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: 少し
    gloss: 少し
    note: یکم は、日本語の「ちょっと」「少し」のように、気持ちの程度をやわらげます。
    example_gloss: 私は少し疲れています。
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: 怒っている
    gloss: 怒っている
    note: عصبانی は「怒っている」という意味です。
    example_gloss: どうして怒っているの?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: 心配している
    gloss: 心配している
    note: نگران は「心配している」という意味です。
    example_gloss: 私は心配しています。
  fa.a1.unit23.lesson03.teach.chera_word:
    title: なぜ
    gloss: なぜ
    note: '*چرا* は「なぜ」という意味です。*هستی* はくだけた「きみは〜です」の形で、*-ی* に短縮されます。*نگران هستی* は *نگرانی* になります。'
    target_text: چرا(なぜ)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: 働きました
    gloss: 働きました
    note: کار کردم は、直訳すると「仕事 私はした」です。
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: 休みです
    gloss: 休みです
    note: تعطیله は「休みの日です」という意味です。
    example_gloss: 今日は休みです。
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: 今日
    gloss: 今日
    note: امروز は「今日」という意味です。
    example_gloss: 今日は疲れています。
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: たくさん
    gloss: たくさん
    note: زیاد は「たくさん」「多すぎる」という意味です。
    example_gloss: たくさん働きました。
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: サラ
    gloss: サラ
    note: سارا は第14課で登場した人物で、ここでまた登場します。
    example_gloss: サラは疲れています。
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 読み物:サラの一日
    gloss: サラは今日たくさん働いたので、ちょっと疲れています。サラは悲しいのではなく、疲れているだけです。
    note: '*خسته‌ست* と *کرده* は、*خسته‌ام* と *کردم* の3人称の口語形です。*نیست* は *هست* の否定形で、*فقط* は「だけ」という意味です。'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: いいですね!
    gloss: いいですね!
    note: چه خوب! は「それはよかった!」「すごい!」のような、よく使う前向きな反応の言葉です。
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: ニマ:サラ、元気?
    gloss: サラ、元気?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: サラ:ちょっと疲れてる…
    gloss: 今日はたくさん働いたので、ちょっと疲れています。あなたは?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: ニマ:うれしい…
    gloss: 今日は休みなので、うれしいです。
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: サラ:いいですね!
    gloss: いいですね!
