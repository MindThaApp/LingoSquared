teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: 文字 ن と ت
    gloss: n と t
    note: ن は n を表します。ت は t を表します。どちらも前後の文字とつながります。
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: 文字 ش と چ
    gloss: sh と ch
    note: ش は sh、چ は ch を表します。
  fa.a1.unit02.lesson01.teach.ye_he:
    title: 文字 ی と ه
    gloss: y/長い i と h
    note: ی は y、または長い「ī」の音です。ه は h で、つながると形が変わります。
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: 文字 ک と گ
    gloss: k と g
    note: ک は k を表します。入力するときは、似て見えるアラビア語の文字ではなく、ペルシア語の ک を使ってください。گ は ک に線を1本足した形で、g を表します。
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: 文字 ج と د
    gloss: j と d
    note: ج は j を表します。د は d を表し、左の文字にはつながりません。
  fa.a1.unit02.lesson01.teach.re_fe:
    title: 文字 ر と ف
    gloss: r と f
    note: ر は r を表し、左の文字にはつながりません。ف は f を表します。
  fa.a1.unit02.lesson01.teach.vav_be:
    title: 文字 و と ب
    gloss: v/o/u と b
    note: و は v または母音を表し、左の文字にはつながりません。ب は b を表します。
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: 文字 خ と ز
    gloss: kh と z
    note: خ は一般に kh と書かれる音です。ز は z を表します。
  fa.a1.unit02.lesson02.teach.esm:
    title: 名前
    gloss: 名前
    note: اسم は、ふつうのイランのペルシア語では esm と読みます。
    example_gloss: 私の名前はサラです。
  fa.a1.unit02.lesson02.teach.man:
    title: 私
    gloss: 私
    note: من は一人称単数の代名詞です。
  fa.a1.unit02.lesson02.teach.sara:
    title: サラ
    gloss: サラ
    note: سارا はイランでよくある女性の名前です。
    example_gloss: サラは私の友達です。
  fa.a1.unit02.lesson02.teach.formal_name:
    title: 改まった自己紹介・書き言葉の自己紹介
    gloss: 私の名前はサラです。
    note: '*اسم من سارا است* は正しい文ですが改まった言い方で、主に書き言葉で見かけます。'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: 自然な話し言葉の自己紹介
    gloss: 私の名前はサラです。
    note: اسمم は اسم من を縮めた形で、ساراست は سارا と است がつながった形です。
  fa.a1.unit02.lesson02.teach.polite_question:
    title: 丁寧に名前をたずねる
    gloss: お名前は?
    note: اسم شما چیه؟ は、イランのペルシア語の話し言葉で使う、中立的で丁寧な普通の言い方です。
  fa.a1.unit02.lesson02.teach.informal_question:
    title: 親しい相手に名前をたずねる
    gloss: お名前は?
    note: اسمت چیه؟ は単数でくだけた言い方です。関係が許す相手にだけ使いましょう。
  fa.a1.unit02.lesson03.teach.man:
    title: 私
    gloss: 私
    note: من には文法上の性がありません。
  fa.a1.unit02.lesson03.teach.to:
    title: あなた(くだけた単数)
    gloss: あなた・君
    note: تو はくだけた単数の言い方で、丁寧に呼びかけるときは通常 شما を使います。
  fa.a1.unit02.lesson03.teach.oo:
    title: 彼または彼女
    gloss: 彼/彼女
    note: او は性別を区別せず、彼にも彼女にも使えます。
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: 私は~です
    gloss: 私は~です
    note: هستم は、بودن の一人称単数の完全形です。
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: あなたは~です
    gloss: あなたは〜です、あなたたちは〜です
    note: هستی はくだけた単数の تو に合わせた形です。
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: 彼または彼女は~です
    gloss: 彼/彼女は~です、彼/彼女はいる
    note: هست は三人称単数の完全形で、「存在」や強調の意味を帯びることがよくあります。
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: 改まった「~です」の文
    gloss: 彼または彼女はイラン人です。
    note: 改まった書き言葉の「A は B です」の文では、است が三人称の普通のコピュラ(〜です)になります。
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: 話し言葉の述語(「〜です」の文)
    gloss: 彼/彼女はイラン人です。
    note: ایرانیه は ایرانی است の自然な話し言葉の縮約形です。
  fa.a1.unit02.lesson04.teach.iran:
    title: イラン
    gloss: イラン
    note: ایران は国名です。
    example_gloss: 私はイランの出身です。
  fa.a1.unit02.lesson04.teach.iranian:
    title: イラン人
    gloss: イラン人の
    note: ایرانی は国籍や出身を表すことができます。
    example_gloss: 私はイラン人です。
  fa.a1.unit02.lesson04.teach.england:
    title: イギリス(イングランド)
    gloss: イングランド
    note: '*انگلیس* は本来イングランドを指しますが、日常会話ではイラン人はイギリス全体の意味でもよく使います。'
    example_gloss: 私はイギリスの出身です。
  fa.a1.unit02.lesson04.teach.english:
    title: イギリスの/英語
    gloss: イギリス人の/英語の
    note: انگلیسی は国籍、言語、イギリスに関係するものを表すことができ、意味は文脈で決まります。
    example_gloss: 私はイギリス人です。
  fa.a1.unit02.lesson04.teach.france:
    title: フランス
    gloss: フランス
    note: فرانسه は国名のフランスです。
    example_gloss: 私はフランスの出身です。
  fa.a1.unit02.lesson04.teach.french:
    title: フランスの/フランス語
    gloss: フランス人の/フランス語の
    note: فرانسوی は国籍やフランスに関係するものを表すことができます。
    example_gloss: 私はフランス人です。
  fa.a1.unit02.lesson04.teach.country:
    title: 国
    gloss: 国
    note: کشور は「国」を表す一般的な語です。
    example_gloss: イランは国です。
  fa.a1.unit02.lesson04.teach.nationality:
    title: 国籍
    gloss: 国籍
    note: ملیت は「国籍」を表す改まった名詞です。
    example_gloss: あなたの国籍は何ですか?
  fa.a1.unit02.lesson05.teach.ahl:
    title: 〜の出身、もともと〜の人
    gloss: 〜出身の
    note: اهل は人とその出身地を結びつけます。単に今住んでいる場所を表すわけではありません。
    example_gloss: 彼/彼女はイギリスの出身です。
  fa.a1.unit02.lesson05.teach.koja:
    title: どこ
    gloss: どこ
    note: کجا は場所をたずねる語です。
    example_gloss: どちらのご出身ですか?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: 改まった標準的な質問
    gloss: どちらのご出身ですか。
    note: اهل کجا هستید؟ は丁寧な標準ペルシア語で、改まった場面や丁寧に読むときに合います。
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: 中立的で丁寧な話し言葉の質問
    gloss: どちらのご出身ですか。
    note: اهل کجا هستین؟ はイランのペルシア語で普通に使われる、丁寧な話し言葉の形です。
  fa.a1.unit02.lesson05.teach.informal_question:
    title: くだけた質問
    gloss: どちらのご出身ですか。
    note: اهل کجایی؟ はくだけた言い方で、相手が一人のときに使います。
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: 出身地を言う
    gloss: 私はイランの出身です。
    note: من اهل ایران هستم は、現在の居住地ではなく出身を表します。
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: 国籍を答える短い言い方
    gloss: 私はイラン人です。
    note: '*ایرانی‌ام* は *ایرانی* に語尾 *ـام*(私は〜です)を付けた形で、語尾の前に小さな半スペースを入れて書きます。'
  fa.a1.unit02.lesson06.teach.arrival:
    title: 場所を確かめる
    gloss: サラは、ここがペルシア語のクラスかどうかたずねます。
    note: ببخشید は、実用的な質問をする前に丁寧に注意を引く言葉です。
  fa.a1.unit02.lesson06.teach.yes:
    title: はい
    gloss: はい
    note: بله は中立的で丁寧な「はい」です。
    example_gloss: はい、もちろん。
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: ミーナが自己紹介する
    gloss: ミーナは場所を確認し、自己紹介をして、サラの名前をたずねます。
    note: 丁寧な話し言葉の質問は、クラスで出会った大人同士にふさわしい言い方です。
  fa.a1.unit02.lesson06.teach.sara_name:
    title: サラが名前を言う
    gloss: 私の名前はサラです。
    note: サラは、前に習った簡潔な話し言葉の型を使っています。
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: ミーナが出身をたずねる
    gloss: どちらのご出身ですか。
    note: هستین を使うと、丁寧さを保ちつつ会話らしい調子になります。
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: 出身地について話す
    gloss: サラはイギリスの出身だと言い、ミーナがイランの出身かどうかたずねます。
    note: 二人は初対面なので、丁寧な形を使い続けています。
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: 出身地について話す・返事
    gloss: ミーナは自分がイラン人だと答えます。
    note: '*ایرانی‌ام* は *ایرانی هستم*(私はイラン人です)の短い形です。'
  fa.a1.unit02.lesson06.teach.pleased:
    title: 紹介にこたえる
    gloss: サラは、ミーナと知り合えてうれしいと言います。
    note: از آشنایی با شما خوشوقتم は、二人のやりとりを自然に締めくくります。
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: あいさつを返してクラスに入る
    gloss: ミーナも会えてうれしいと言い、サラを中へ招きます。
    note: من هم همین‌طور はサラの丁寧なあいさつに答える言葉で、そのあと بفرمایید داخل で、クラスの場面が先へ進みます。
