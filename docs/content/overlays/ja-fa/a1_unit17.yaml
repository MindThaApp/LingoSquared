teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: 具合が悪いです
    gloss: 気分がよくありません
    note: حالم خوب نیست は直訳すると「私の状態は良くない」で、具合が悪いと言うときの標準的な表現です。
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: 頭痛
    gloss: 頭痛
    note: سردرد は「頭痛」という意味です。
    example_gloss: 頭が痛いです。
  fa.a1.unit17.lesson01.teach.daram_word:
    title: 私は持っています
    gloss: 私には~がいる・ある
    note: دارم は「私は持っている」という意味で、症状を表す名詞と一緒に使います(سردرد دارم =頭痛があります)。
    target_text: دارم(私は持っています)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: 熱
    gloss: 熱
    note: تب は「熱」という意味です。
    example_gloss: 熱があります。
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: お腹が痛いです
    gloss: お腹が痛いです
    note: دلم درد می‌کنه は直訳すると「私のお腹が痛みをする」で、お腹が痛いと言うときの口語的な表現です。
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: 疲れています
    gloss: 疲れています
    note: '*خسته‌ام* は「私は疲れています」という意味です。語尾の *-ام* は *هستم*(私は~です)の短い形で、*خسته*(疲れた)にくっついています。'
    example_gloss: 今日は疲れています。
  fa.a1.unit17.lesson03.teach.komak_word:
    title: 助け
    gloss: 助け
    note: کمک は「助け」という意味です。
    example_gloss: 私を手伝ってくれますか？
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: あなたはできます
    gloss: できる
    note: می‌تونی は می‌توانی(できる)の口語的な短縮形で、くだけた二人称(親しい相手に使う形)です。
    target_text: می‌تونی(あなたはできます・くだけた形)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: 手伝ってくれますか?
    gloss: 手伝ってくれますか?
    note: '*می‌تونی کمکم کنی؟* は *می‌تونی*(できる)と *کمکم کنی*(直訳は「私の助けをする」、つまり助ける)を組み合わせた表現です。'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: 医者
    gloss: 医者
    note: دکتر は「医者」という意味です。
    example_gloss: 医者は休むように言いました。
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: 薬
    gloss: 薬
    note: دارو は「薬」という意味です。
    example_gloss: この薬を飲んでください。
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: 休んで(命令)
    gloss: 休んで
    note: استراحت کن は親しい相手に使う命令形で、「休んで!」という意味です。
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: 水を飲んで(命令)
    gloss: 水を飲んで
    note: آب بخور は親しい相手に使う命令形で、「水を飲んで!」という意味です。
  fa.a1.unit17.lesson04.teach.va_word:
    title: と
    gloss: と
    note: و は「と・そして」という意味で、二つの節や物事をつなぎます。
    target_text: و(〜と、そして)
  fa.a1.unit17.lesson05.teach.reading_text:
    title: 症状メモの例
    gloss: 頭痛と熱があります。疲れています。
    note: このユニットの症状の語彙を組み合わせた、一人称の短いメモです。
  fa.a1.unit17.lesson06.teach.names:
    title: ニーマとサーラ
    gloss: ニーマ、サーラ
    note: このコース全体でよく使われる、イランでよくある名前です。
    example_gloss:
    - ニーマは頭痛がします。
    - サーラはニーマを助けます。
  fa.a1.unit17.lesson06.teach.ham_word:
    title: 〜も
    gloss: ~も
    note: هم は「~も」という意味で、修飾したい語の後ろに置きます(آب هم بخور =水も飲んで)。
    target_text: هم(〜も)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: 大丈夫
    gloss: 大丈夫
    note: باشه は باشد の口語的な短縮形で、「わかった・いいよ」という意味です。
    example_gloss: わかった、休むね。
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: お礼
    gloss: ありがとう
    note: ممنون は「ありがとう」という意味です。
    example_gloss: 助けてくれてありがとう。
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: 彼/彼女は持っています
    gloss: 彼/彼女は持っている
    note: داره は دارد(持っている)の三人称の口語形で、一人称の دارم と同じパターンです。
    target_text: داره(彼・彼女は持っています・口語の3人称)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: ニーマの言葉
    gloss: 具合が悪いです。頭痛と熱があります。
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: サーラのアドバイス
    gloss: 休んで。水も飲んで。
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: ニーマの返事
    gloss: わかった、ありがとう。
