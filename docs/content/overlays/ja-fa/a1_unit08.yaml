teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: お店
    gloss: お店
    note: مغازه は、小さなお店や商店を指す一般的な言葉です。
    example_gloss: このお店は大きいです。
  fa.a1.unit08.lesson01.teach.price_word:
    title: 値段
    gloss: 値段
    note: قیمت は「値段」を表す一般的な言葉です。
    example_gloss: これの値段はいくらですか。
  fa.a1.unit08.lesson01.teach.discount_word:
    title: 割引
    gloss: 割引
    note: تخفیف は「割引」という意味で、イランの日常の買い物や値段交渉でよく使われる言葉です。
    example_gloss: 割引はありますか。
  fa.a1.unit08.lesson01.teach.apple_word:
    title: りんご
    gloss: りんご
    note: سیب は、値段や数量の練習によく使われる例の品物です。
    example_gloss: りんごがほしいです。
  fa.a1.unit08.lesson01.teach.va_word:
    title: と
    gloss: と・そして
    note: و は、この単元全体で使われる、言葉や文をつなぐ一般的な言葉です。
    target_text: و(と・そして)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: 値段をたずねる
    gloss: これはいくらですか。
    note: این چنده؟ は、値段をたずねるときの日常的な話し言葉の言い方で、این چند است の縮約形です。
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: 1キロあたりの値段を言う
    gloss: 1キロ30トマンです。
    note: کیلویی سی تومنه は、話し言葉の -e の縮約形を使って、1キロあたりの値段を言う表現です(تومنه = تومن است)。
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: 口語の縮約形 -e(復習)
    gloss: تومنه は、تومن است の日常会話での縮約形です。
    note: これは آفتابیه などの天気を表す語で既に出てきた縮約と同じパターンです。
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: りんごを1キロ頼む
    gloss: りんごを1キロください。
    note: یک کیلو سیب می‌خوام では、کیلو(キロ)を数える単位として使っています。
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: 半キロ頼む
    gloss: 半キロください。
    note: نصف کیلو می‌خوام は、1キロの代わりに نصف(半分)を使った言い方です。
  fa.a1.unit08.lesson04.teach.discount_question:
    title: 値引きをお願いする
    gloss: 安くしてもらえますか?
    note: تخفیف می‌دید؟ は、イランのバザールや店でよく使われる自然な質問です。値段交渉は買い物の文化では普通のことで、失礼でも変わったことでもありません。
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: 店主が安い値段を提示する
    gloss: 28トマンにしますよ。
    note: برات بیست و هشت تومن حساب می‌کنم は、元の30トマンから少し値引きした価格の提示です。
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: 現金で払うと伝える
    gloss: 現金で払います。
    note: نقدی حساب می‌کنم は、نقدی(現金で)を使って支払い方法を伝える表現です。
  fa.a1.unit08.lesson05.teach.card_question:
    title: カードで払えるかたずねる
    gloss: カードは使えますか?
    note: کارت می‌گیرید؟ は、カード払いができるかどうかをたずねる表現です。
  fa.a1.unit08.lesson06.teach.please_review:
    title: どうぞ(復習)
    gloss: どうぞ
    note: بفرمایید はあいさつの単元で出てきました。ここでは店主がお客さんを迎えるのに使っています。
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: ありがとう(復習)
    gloss: ありがとう
    note: ممنون はあいさつの単元で出てきました。
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: どういたしまして(復習)
    gloss: どういたしまして/お安いご用です
    note: قابلی نداره は、お礼に対して謙遜して返すよく使われる表現で、前の単元でも出てきました。
  fa.a1.unit08.lesson06.teach.turn01:
    title: 店主がお客さんにあいさつする
    gloss: 店主がお客さんにあいさつして、どうぞと迎えます。
    note: بفرمایید は、見て回ったり、何かたずねたりするようお客さんをうながす言葉です。
  fa.a1.unit08.lesson06.teach.turn02:
    title: お客さんが値段をたずねる
    gloss: お客さんが店主にあいさつして、りんごの値段をたずねます。
    note: lesson02 の این چنده؟ を سیب‌ها(そのりんご)に使っています。
  fa.a1.unit08.lesson06.teach.turn03:
    title: 店主が値段を言う
    gloss: 店主が1キロ30トマンだと言います。
    note: lesson02 の کیلویی سی تومنه です。
  fa.a1.unit08.lesson06.teach.turn04:
    title: お客さんが注文して値引きをお願いする
    gloss: お客さんが1キロほしいと言って、値引きをお願いします。
    note: lesson03 の数量の言い方と lesson04 の値引きの質問を組み合わせています。
  fa.a1.unit08.lesson06.teach.turn05:
    title: 店主が値引きに応じる
    gloss: 店主が承諾して、28トマンを提示します。
    note: باشه(いいですよ)は、値引き後の値段を言う前に同意を示す言葉です。
  fa.a1.unit08.lesson06.teach.turn06:
    title: お客さんがお礼を言って支払う
    gloss: お客さんがお礼を言って、現金で払うと伝えます。
    note: lesson05 の支払いの語彙に、簡単なお礼を組み合わせています。
  fa.a1.unit08.lesson06.teach.turn07:
    title: 店主がやりとりを締めくくる
    gloss: 店主がお礼に謙遜して応え、どうぞと勧めます。
    note: قابلی نداره، بفرمایید は、取引を丁寧に締めくくる言い方です。
