teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: 番号
    gloss: 番号
    note: عدد は「数」を表す一般的な語です。
    example_gloss: これは数です。
  fa.a1.unit03.lesson01.teach.zero:
    title: ゼロ
    gloss: 0 — ゼロ
    note: صفر はゼロを表し、電話番号のように長い数の中の数字としても使います。
    example_gloss: ゼロは数です。
  fa.a1.unit03.lesson01.teach.one:
    title: 一
    gloss: 1 — いち
    note: یک は「1」です。
    example_gloss: 本を1冊持っています。
  fa.a1.unit03.lesson01.teach.two:
    title: 二
    gloss: 2 — に
    note: دو は「2」です。
    example_gloss: リンゴを2個持っています。
  fa.a1.unit03.lesson01.teach.three:
    title: 三
    gloss: 3 — さん
    note: سه は「3」です。
    example_gloss: 彼には兄弟が3人います。
  fa.a1.unit03.lesson01.teach.four:
    title: 四
    gloss: 4 — よん
    note: چهار は「4」です。
    example_gloss: 4時です。
  fa.a1.unit03.lesson01.teach.five:
    title: 五
    gloss: 5 — ご
    note: پنج は「5」です。
    example_gloss: 5分待ってください。
  fa.a1.unit03.lesson01.teach.six:
    title: 六
    gloss: 6 — ろく
    note: شش は「6」です。
    example_gloss: 椅子が6脚あります。
  fa.a1.unit03.lesson01.teach.seven:
    title: 七
    gloss: 7 — なな
    note: هفت は「7」です。
    example_gloss: 1週間は7日です。
  fa.a1.unit03.lesson01.teach.eight:
    title: 八
    gloss: 8 — はち
    note: هشت は「8」です。
    example_gloss: 8時にお会いしましょう。
  fa.a1.unit03.lesson01.teach.nine:
    title: 九
    gloss: 9 — きゅう
    note: نه は「9」です。「いいえ」を表す普通の語でもあります。数を数えているときや数字の中で聞こえたときは、文脈でどちらの意味か分かります。
    example_gloss: ここに生徒が9人います。
  fa.a1.unit03.lesson01.teach.ten:
    title: 十
    gloss: 10 — じゅう
    note: ده は「10」です。
    example_gloss: 私の指は10本です。
  fa.a1.unit03.lesson02.teach.eleven:
    title: 十一
    gloss: 11 — じゅういち
    note: یازده は「11」です。
    example_gloss: 11時に授業があります。
  fa.a1.unit03.lesson02.teach.twelve:
    title: 十二
    gloss: 12 — じゅうに
    note: دوازده は「12」です。
    example_gloss: 1年は12か月です。
  fa.a1.unit03.lesson02.teach.thirteen:
    title: 十三
    gloss: 13 — じゅうさん
    note: سیزده は「13」です。
    example_gloss: 彼(彼女)は13歳です。
  fa.a1.unit03.lesson02.teach.fourteen:
    title: 十四
    gloss: 14 — じゅうよん
    note: چهارده は「14」です。
    example_gloss: 14日後に行きます。
  fa.a1.unit03.lesson02.teach.fifteen:
    title: 十五
    gloss: 15 — じゅうご
    note: پانزده は「15」です。
    example_gloss: 彼(彼女)は本を15冊持っています。
  fa.a1.unit03.lesson02.teach.sixteen:
    title: '16'
    gloss: 16 — じゅうろく
    note: شانزده は「16」です。شش(6)+ ده(10)からは予想できないので、独立した単語として覚えておくとよいです。
    example_gloss: 彼(彼女)は16歳です。
  fa.a1.unit03.lesson02.teach.seventeen:
    title: '17'
    gloss: 17 — じゅうなな
    note: هفده は「17」です。
    example_gloss: 17人が来ました。
  fa.a1.unit03.lesson02.teach.eighteen:
    title: '18'
    gloss: 18 — じゅうはち
    note: هجده は「18」です。
    example_gloss: 彼(彼女)は18歳です。
  fa.a1.unit03.lesson02.teach.nineteen:
    title: '19'
    gloss: 19 — じゅうきゅう
    note: نوزده は「19」です。
    example_gloss: あと19日です。
  fa.a1.unit03.lesson02.teach.twenty:
    title: 二十
    gloss: 20 — にじゅう
    note: بیست は「20」です。
    example_gloss: 本を20冊持っています。
  fa.a1.unit03.lesson02.teach.thirty:
    title: 三十
    gloss: 30 — さんじゅう
    note: سی は「30」です。
    example_gloss: 今月は30日あります。
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: 40から90まで
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل、پنجاه、شصت、هفتاد、هشتاد、نود は、残りの10の位の数(40、50、60、70、80、90)です。
    example_gloss:
    - 彼(彼女)は40歳です。
    - 椅子が50脚あります。
    - 60分は1時間です。
    - この本は70ページあります。
    - 彼(彼女)は本を80冊持っています。
    - 彼(彼女)は90歳です。
  fa.a1.unit03.lesson02.teach.combining:
    title: 10の位と1の位の組み合わせ
    gloss: 25(にじゅうご)
    note: بیست و پنج は直訳すると「20と5」で、10の位の語、و、1の位の語の順に並べます。
  fa.a1.unit03.lesson03.teach.shomare:
    title: 番号
    gloss: 番号
    note: شماره は電話番号や house 番号のように、何かを識別するための番号に使います。عدد の「数」という一般的な意味とは区別されます。
    example_gloss: これは私の電話番号です。
  fa.a1.unit03.lesson03.teach.telefon:
    title: 電話
    gloss: 電話／電話機
    note: تلفن は携帯電話も含め、電話全般を指します。
    example_gloss: 私は電話を持っていません。
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: 電話番号をたずねる
    gloss: 電話番号は何番ですか。
    note: شماره تلفنتون چنده؟ は電話番号をたずねる、ふつうの丁寧な言い方です。数字を一桁ずつ読めば必ず通じるので、初心者にはいちばん安心な方法です。実際の会話では数字をまとめて読むことも普通ですが、このレッスンではまず一桁ずつ読む形を練習します。
  fa.a1.unit03.lesson03.teach.chande:
    title: いくら/何番ですか？
    gloss: いくらですか？/何番ですか？
    note: چنده؟ は چند است の縮約形で、文脈に応じて番号・数量・値段をたずねます。
  fa.a1.unit03.lesson03.teach.read_number:
    title: 数字を一桁ずつ読む
    gloss: ゼロ、9、1、2、3、4、5、6、7、8、8
    note: このレッスンでは、数字を一桁ずつ読む練習をします。実際のイランの携帯電話番号は11桁で、0から始まります。例：0912 345 6788。
  fa.a1.unit03.lesson04.teach.sal:
    title: 年
    gloss: 年
    note: سال は暦の「年」にも、人の年齢(〜歳)を数えるときにも使います。
    example_gloss: 20歳です。
  fa.a1.unit03.lesson04.teach.man_recap:
    title: 私(復習)
    gloss: 私
    note: من(私)の簡単なおさらいです。自分の年齢を文で言うために、ここで必要になります。
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: 相手の年齢をたずねる(くだけた言い方)
    gloss: 何歳ですか。
    note: چند سالته؟ は相手が一人のときのくだけた言い方で、丁寧な言い方は چند سالتونه؟ です。
  fa.a1.unit03.lesson04.teach.salame:
    title: 自分の年齢を言う
    gloss: 私は25歳です。
    note: سالمه は سال に所有を表す語尾 ـم(私の)を直接つけ、さらに口語の コピュラ ـه(〜です)を加えた形で、直訳すると「私の年は〜です」になります。
  fa.a1.unit03.lesson04.teach.ta:
    title: 助数詞(数えるとき)
    gloss: (数を数えるときの語。日本語の「〜個」「〜枚」などの助数詞に近い)
    note: تا は、ほとんどの物を数えるときに使える汎用の助数詞で、「数 + تا + 名詞」の形で使います。
  fa.a1.unit03.lesson04.teach.sib:
    title: りんご
    gloss: りんご
    note: سیب は「りんご」です。
    example_gloss: 私はりんごが好きです。
  fa.a1.unit03.lesson04.teach.ketab:
    title: 本
    gloss: 本
    note: کتاب は「本」です。
    example_gloss: これはいい本です。
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: 数量を頼む
    gloss: りんごを2個ください。
    note: دو تا سیب می‌خوام は、تا を使うときの通常の語順どおり、数える数量を名詞の前に置きます。
  fa.a1.unit03.lesson05.teach.gheymat:
    title: 値段
    gloss: 値段
    note: قیمت は「値段」を表す一般的な語です。
    example_gloss: これの値段はいくらですか？
  fa.a1.unit03.lesson05.teach.toman:
    title: トマン
    gloss: トマン(イランの通貨、日常での言い方)
    note: イランの公式通貨はリアルですが、日常の話し言葉では値段はほとんどトマンで言います(1トマン = 10リアル)。
    example_gloss: これは1万トマンです。
  fa.a1.unit03.lesson05.teach.hezar:
    title: 千
    gloss: 千
    note: هزار は「千」です。値段は普通、何千トマンという形で言います。
    example_gloss: 私は千トマン持っています。
  fa.a1.unit03.lesson05.teach.ask_price:
    title: 値段を尋ねる
    gloss: これはいくらですか。
    note: این چنده؟ は、目の前にある物の値段をたずねるふつうの言い方です。
  fa.a1.unit03.lesson05.teach.price_answer:
    title: 値段を答える
    gloss: 3万トマンです。
    note: تومنه は تومن است の縮約形で、「数 + هزار + تومنه」が基本の形です。
  fa.a1.unit03.lesson06.teach.practice_together:
    title: サラが一緒に練習しようと誘う
    gloss: サラは一緒にペルシア語を練習したいと言い、ミナの電話番号をたずねます。
    note: باهم は「一緒に」の意味です。می‌خوام ... تمرین کنیم は「私たちで練習したい」という意味です。なお、تمرین کنیم だけを疑問文として言うと「練習しましょうか？」の意味にもなります。
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: ミナが自分の番号を伝える
    gloss: ミナは承諾し、11桁の番号を一桁ずつ読み上げます。
    note: شماره‌ام は شماره من の縮約形です。هشته は هشت است の縮約形で、数の最後を締めくくります。
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: サラが書き取りを確認する
    gloss: サラは番号を書くからと待ってもらい、確認のために読み返します。
    note: درسته؟(「合ってる？」)は、聞いたばかりの番号や情報を確認するときによく使う言い方です。
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: ミナが認めて、聞き返す
    gloss: ミナは合っていると答え、サラの番号をたずねます。
    note: آره はくだけた「はい」で、بله よりもカジュアルです。
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: サラが自分の番号を伝える
    gloss: サラは自分の11桁の番号を一桁ずつ読み上げます。
    note: یکه は یک است の縮約形で、هشته がミナの番号を締めくくったのと同じように、数の最後を締めくくります。
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: ミナが電話すると約束する
    gloss: ミナは明日サラに電話すると言います。
    note: زنگ می‌زنم بهت は「あなたに電話するね」の意味で、直訳すると「あなたにベルを打つ」です。
