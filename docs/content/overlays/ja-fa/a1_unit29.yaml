    gloss: サラは携帯をよく使います。写真を撮ったり、メッセージを送ったりします。サラは家ではパソコンも使います。ニマは毎日インターネットを使います。
    note: この読み物は、会話を三人称で語り直したものです。新しい単語はほとんどないので、文章の中で単語を見分ける練習になります。
