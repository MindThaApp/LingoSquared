course:
  title: ペルシア語 A1
  description: 初級ペルシア語(イラン)：身近な機器(スマホ、パソコン、インターネット、アプリ)の名前、スマホでの動作(メッセージを送る、電話をかける、写真を撮る、アプリをダウンロードする)、スマホを使う頻度のたずね方と答え方(*هر روز چند بار از گوشیت استفاده می‌کنی؟*)、*نیما*と*سارا*の機器の使い方についての読み物、そして2人がそれぞれテクノロジーをどう使っているかを話す*نیما*と*سارا*の会話を学びます。
