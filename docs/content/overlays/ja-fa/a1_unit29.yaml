    gloss: アプリ
    note: '*اپلیکیشن* は「アプリ」または「アプリケーション」の意味で、よく使われます。'
    example_gloss: このアプリはいいです。
  fa.a1.unit29.lesson01.teach.review_man_in_daram:
    title: 私/これ/私は持っています
    gloss: 私 / これ・この / 私は持っている
    note: '*من*、*این*、*دارم* はおなじみの単語で、ここでは自分が持っている機器について話すためにもう一度出てきます。'
    target_text: من (私) / این (これ・この) / دارم (私は持っている)
  fa.a1.unit29.lesson01.teach.review_estefade_mikonam:
    title: 使う+私はする=私は使います
    gloss: 使用 + 私はする = 私は使う
    note: '*استفاده* は *می‌کنم*(「私はする」)と組み合わさって「私は使う」という意味になります。使うものは *از* で示します。'
    target_text: استفاده (使用) + می‌کنم (私はする) = استفاده می‌کنم (私は使う)
  fa.a1.unit29.lesson01.teach.combined_sentence:
    title: 私はインターネットを使います
    gloss: 私はインターネットを使います
    note: '*من از اینترنت استفاده می‌کنم* は、*من* + *از* + *اینترنت* + *استفاده می‌کنم* を組み合わせた文です。'
  fa.a1.unit29.lesson02.teach.review_peyam:
