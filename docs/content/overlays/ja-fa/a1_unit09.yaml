teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: 時間 / 時計
    gloss: 時間 / 時計
    note: ساعت は「時間」と「時計」の両方の意味があり、時刻を言うときの基本の単語です。
    example_gloss: 何時ですか。
  fa.a1.unit09.lesson01.teach.minute_word:
    title: 分
    gloss: 分
    note: دقیقه は「分」を表す単語です。
    example_gloss: 5分待ってください。
  fa.a1.unit09.lesson01.teach.half_word:
    title: 半分
    gloss: 半分
    note: نیم は「半分」の意味で、30分(半)を表すときに使います。
    example_gloss: 7時半です。
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: 15分(4分の1)
    gloss: 15分(4分の1)
    note: ربع は「4分の1」の意味で、15分を表すときに使います。
    example_gloss: 8時15分前です。
  fa.a1.unit09.lesson01.teach.va_word:
    title: と
    gloss: そして
    note: و は、このユニット全体でよく使われる、言葉をつなぐ単語です。
    target_text: و(〜と、そして)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: 時刻を尋ねる
    gloss: 何時ですか。
    note: ساعت چنده؟ は、時刻を尋ねるふだんの話し言葉の言い方です。
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: 話し言葉の -e への短縮(復習)
    gloss: چنده は、چند است を日常の話し言葉で短くした形です。
    note: 天気や買い物の単語の آفتابیه や تومنه で、すでに出てきたのと同じ短縮のパターンです。
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: 3時半と言う
    gloss: 3時半です。
    note: ساعت سه و نیمه は、時刻、و(と)、短縮された نیمه(半)を組み合わせた形です。
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: 話し言葉の -e への短縮を نیم に当てはめる
    gloss: نیمه は、نیم است を日常の話し言葉で短くした形です。
    note: چنده と同じパターンを、چند ではなく نیم に当てはめたものです。
  fa.a1.unit09.lesson04.teach.sobh:
    title: 朝
    gloss: 朝
    note: صبح は1日のうちの朝の時間帯を表します。
    example_gloss: 朝は早く起きます。
  fa.a1.unit09.lesson04.teach.zohr:
    title: 正午
    gloss: 正午
    note: ظهر は正午ごろの時間帯を表します。
    example_gloss: 正午に昼食を食べます。
  fa.a1.unit09.lesson04.teach.asr:
    title: 午後
    gloss: 午後
    note: عصر は1日のうちの午後から夕方にかけての時間帯を表します。
    example_gloss: 私は午後に働きます。
  fa.a1.unit09.lesson04.teach.shab:
    title: 夜
    gloss: 夜
    note: شب は夜を表します。
    example_gloss: 夜は早く寝ます。
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: 約束
    gloss: 予約
    note: قرار は、人と会う約束や取り決めた予定を指す一般的な言葉です。
    example_gloss: 約束があります。
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: 約束の時間を尋ねる
    gloss: 約束は何時ですか?
    note: قرار ساعت چنده؟ は、レッスン2で学んだ時刻の尋ね方を、特定の約束に当てはめた表現です。
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: 時間帯をつけて時刻を言う
    gloss: 午後4時
    note: ساعت چهار عصر は、時刻に عصر(夕方・午後)を添えて、午前か午後かをはっきりさせています。
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: 明日(復習)
    gloss: 明日
    note: فردا は前のユニットで学びました。ここでは約束の話を始めるために使われています。
    example_gloss: 明日約束があります。
  fa.a1.unit09.lesson06.teach.late_word:
    title: 少し遅れると伝える
    gloss: 少し遅れます。
    note: '*یکم دیر می‌شه* では、話し言葉の *یکم*(少し)と *دیر*(遅い)が使われています。'
  fa.a1.unit09.lesson06.teach.turn01:
    title: ネガールが明日の約束の時間を尋ねる
    gloss: ネガールが、明日の約束は何時かと尋ねます。
    note: قرار فردا ساعت چنده؟ は、レッスン5の約束の尋ね方に فردا(明日)を組み合わせた文です。
  fa.a1.unit09.lesson06.teach.turn02:
    title: アラシュが自信なさそうに答える
    gloss: アラシュが、4時だと思うと答えます。
    note: فکر کنم(たぶん〜だと思う)を使うと、確信がないことを和らげて伝えられます。
  fa.a1.unit09.lesson06.teach.turn03:
    title: ネガールが午前か午後かを確認する
    gloss: ネガールが、4時は午後か午前かを尋ねます。
    note: ساعت چهار だけでは、どちらの4時なのかわかりません。それをはっきりさせるための質問です。
  fa.a1.unit09.lesson06.teach.turn04:
    title: アラシュがはっきり答える
    gloss: アラシュが、午後だと答えます。
    note: 質問で状況が明らかになっていれば、一言で答えるのが自然です。
  fa.a1.unit09.lesson06.teach.turn05:
    title: ネガールが了承し、来る時刻を調整する
    gloss: ネガールが了承し、4時15分に行くと言います。
    note: ساعت چهار و ربع は、時刻に ربع(15分、4分の1)を組み合わせた表現です。
  fa.a1.unit09.lesson06.teach.turn06:
    title: アラシュがなぜ15分なのかを尋ねる
    gloss: アラシュが、なぜ15分過ぎと言うのかを尋ねます。
    note: '*چرا ربع؟* は「なぜ15分なの?」と尋ねる短い言い方です。'
  fa.a1.unit09.lesson06.teach.turn07:
    title: ネガールが少し遅れる理由を説明する
    gloss: ネガールが、仕事の帰りが少し遅くなると説明します。
    note: '*چون*(なぜなら)が理由を導きます。ここでは、このレッスンで学んだ *یکم دیر می‌شه*(少し遅れます)が使われています。'
  fa.a1.unit09.lesson06.teach.turn08:
    title: アラシュが安心させる
    gloss: アラシュが、わかった、問題ないと言います。
    note: مشکلی نیست(問題ありません)は、少しの遅れなら大丈夫だとネガールを安心させる言い方です。
