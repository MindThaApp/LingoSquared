course:
  title: ペルシア語 A1
  description: イランのペルシア語(初級)：お祝いや誕生日に関する単語(誕生日、パーティー、ケーキ、プレゼント)を言えるようになります。既習の月名や序数を使って、誕生日はいつかを尋ねたり答えたりします(*تولدت کِیه؟*)。パーティーに誘ったり、誘いを受けたりする表現も学びます(*میای به مهمونی؟* / *آره، حتماً میام*)。ニマとサラの誕生日の会話では *تولدت مبارک*(「誕生日おめでとう」)を学び、ニマの誕生日についての読み物も読みます。最後のまとめでは、好きなお祝いを言い、自分で招待やお祝いのメッセージを書きます。
