    example_gloss: このケーキはおいしいです。
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: プレゼント
    gloss: プレゼント
    note: '*هدیه* は「贈り物」「プレゼント」という意味です。'
    example_gloss: 私はそのプレゼントが好きです。
  fa.a1.unit31.lesson01.teach.review_words:
    title: 今日/年/私は持っています/と
    gloss: 今日/年/私は持っている/と、そして
    note: '*امروز*、*سال*、*دارم*、*و* は既習の単語で、ここでお祝いについて話すためにもう一度出てきます。'
    target_text: امروز (今日) / سال (年) / دارم (私は持っている) / و (と、そして)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: 誕生日 + 私の + です = 私の誕生日です
    gloss: 誕生日 + 私の + です = 私の誕生日です
    note: '*تولد* に「私の」を表す所有の語尾 *-م* と、話し言葉の「です」を表す *-ه* がつくと、「私の誕生日です」という意味の *تولدمه* になります。'
    target_text: تولد (誕生日) + م + ه = تولدمه (私の誕生日です)
  fa.a1.unit31.lesson01.teach.combined_sentence:
