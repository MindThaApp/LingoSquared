teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: お金
    gloss: お金
    note: پول は「お金」を表す一般的な単語です。
    example_gloss: 私のお金はどこですか？
  fa.a1.unit21.lesson01.teach.bank_word:
    title: 銀行
    gloss: 銀行
    note: بانک は「銀行」を表す一般的な単語です。
    example_gloss: 銀行は近いです。
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: ドル
    gloss: ドル
    note: دلار は(米)ドルを表す単語で、日常の両替の会話で最もよく話題になる外貨です。
    example_gloss: ドルを持っています。
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: 両替
    gloss: 両替
    note: تبدیل は「両替する・換える」という意味で、کردن(する)と組み合わせて تبدیل کردن の形で使います。
    example_gloss: (お金を)両替したいです。
  fa.a1.unit21.lesson01.teach.va_word:
    title: と
    gloss: 〜と、そして
    note: و は「〜と・そして」を表す一般的なつなぎの言葉で、前のユニットの復習です。
    target_text: و(〜と、そして)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: 両替したいと伝える
    gloss: ドルをトマンに両替したいです。
    note: می‌خوام دلار به تومن تبدیل کنم では、両替先の通貨を به(〜に)で表します。
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: ドルをいくら持っているか尋ねる
    gloss: ドルはいくらお持ちですか？
    note: '*چقدر دلار دارید؟* では *چقدر*(いくら・どれくらい)を使います。これまでの数量を尋ねる質問でも出てきた語です。'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: ATM
    gloss: ATM
    note: خودپرداز は直訳すると「自分で支払う(もの)」で、ATMを指す一般的な言葉です。
    example_gloss: ATMはあそこです。
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: お金を引き出したいと伝える
    gloss: ATMでお金を引き出したいです。
    note: می‌خوام از خودپرداز پول بردارم では、از(〜から)と بردارم(引き出す・取る)を使います。
  fa.a1.unit21.lesson04.teach.change_question:
    title: 小銭を頼む
    gloss: 小銭(お釣り)はありますか？
    note: پول خرد دارید؟ では、پول(お金)の後に خرد(細かい・小銭)を置きます。
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: どうぞ(復習)
    gloss: どうぞ
    note: '*بفرمایید* は前のユニットで学びました。ここでは、物を手渡すときに使います。'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: レート
    gloss: レート
    note: نرخ は(為替)レートを表す言葉です。
    example_gloss: 今日のレートはいくらですか？
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: 1ドルあたりのレートを言う
    gloss: 1ドルは30トマンです。
    note: هر دلار سی تومنه では、هر(それぞれ・〜ごとに)と、すでに学んだ口語の -e の縮約形(*تومنه* = *تومن است*)を使います。
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: 百
    gloss: 百
    note: صد は数字の100です。
    example_gloss: 100ドル持っています。
  fa.a1.unit21.lesson06.teach.please_do:
    title: お願いします
    gloss: 両替してください
    note: لطفاً تبدیل کنید は تبدیل کردن(両替する)の丁寧な命令形です。
  fa.a1.unit21.lesson06.teach.turn01:
    title: サラが両替をお願いする
    gloss: サラは窓口の人にあいさつして、ドルをトマンに両替したいと言います。
    note: lesson02 の می‌خوام دلار به تومن تبدیل کنم をもう一度使います。
  fa.a1.unit21.lesson06.teach.turn02:
    title: 窓口の人がドルの額を尋ねる
    gloss: 窓口の人はサラにあいさつして、ドルをいくら持っているか尋ねます。
    note: lesson02 の چقدر دلار دارید؟ をもう一度使います。
  fa.a1.unit21.lesson06.teach.turn03:
    title: サラが金額を言ってレートを尋ねる
    gloss: サラは100ドル持っていると言い、今日のレートを尋ねます。
    note: صد(百)は新しい単語です。نرخ امروز چنده؟ は lesson05 のレートの質問をもう一度使います。
  fa.a1.unit21.lesson06.teach.turn04:
    title: 窓口の人がレートを伝える
    gloss: 窓口の人は、1ドルは30トマンだと言います。
    note: lesson05 の هر دلار سی تومنه をもう一度使います。
  fa.a1.unit21.lesson06.teach.turn05:
    title: サラが了承して手続きをお願いする
    gloss: サラは了承して、両替してくださいとお願いします。
    note: لطفاً تبدیل کنید は、このレッスンで先ほど学びました。
  fa.a1.unit21.lesson06.teach.turn06:
    title: 窓口の人が合計金額を渡す
    gloss: どうぞ、3000トマンです。
    note: '*سه هزار تومن* = 100ドル × 1ドルあたり30トマンです。*هزار*(千)は数字のユニットで復習した語です。'
  fa.a1.unit21.lesson06.teach.turn07:
    title: サラがお礼を言い、小銭も頼む
    gloss: ありがとうございます。小銭もありますか？
    note: lesson04 の پول خرد دارید؟ に هم(〜も)を加えた形です。
  fa.a1.unit21.lesson06.teach.turn08:
    title: 窓口の人が答えて渡す
    gloss: はい、どうぞ。
    note: بله(はい)は復習の単語です。بفرمایید でやり取りを締めくくります。
