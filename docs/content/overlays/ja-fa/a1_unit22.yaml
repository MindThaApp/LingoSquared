  fa.a1.unit22.lesson06.phone_dialogue:
    title: 電話での会話をまるごと
teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: 電話
    gloss: 携帯電話
    note: تلفن は電話を表す一般的な単語です。
    example_gloss: 私の電話はどこですか？
  fa.a1.unit22.lesson01.teach.message_word:
    title: メッセージ
    gloss: メッセージ
    note: پیام は文字で送る伝言・メッセージです。
    example_gloss: メッセージが1件あります。
  fa.a1.unit22.lesson01.teach.call_word:
    title: 電話する
    gloss: 電話する
    note: زنگ زدن(直訳は「鳴らす」)は、人に電話をかけるときの日常的な動詞です。
    example_gloss: 電話してください。
  fa.a1.unit22.lesson01.teach.voice_word:
    title: 声
    gloss: 声
    note: صدا は「声」の意味で、電話での相手の声の様子を言うときに使います。
    example_gloss: あなたの声はよく聞こえます。
  fa.a1.unit22.lesson01.teach.va_word:
    title: と
    gloss: と、そして
    note: و は語や文をつなぐ一般的な言葉で、前のユニットで学んだ復習です。
    target_text: و(〜と、そして)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: もしもし(電話で)
    gloss: もしもし、どうぞ
    note: الو は電話専用のあいさつで、対面では使いません。ここでの بفرمایید は「どうぞ、聞いていますよ」のような意味です。
  fa.a1.unit22.lesson02.teach.its_me:
    title: 私、ナルゲスです
    gloss: こんにちは、ナルゲスです
    note: '*منم* は *من*(私)に動詞の語尾 -م(「〜です」)がついた形で、「私です」という意味です。電話で名乗るときによく使う言い方です。(同じ綴りで「私も」の意味にもなり、その場合は *من هم* と同じですが、ここでは文脈から「私です」と分かります。)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: それをもう一度言ってもらえますか？
    gloss: もう一度言っていただけますか？
    note: می‌شه(می‌شود の口語形で「可能ですか」)と تکرار کنید(繰り返してください)を組み合わせた、丁寧な依頼の基本形です。
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: もう少しゆっくり話してください
    gloss: もう少しゆっくり話してください
    note: آهسته‌تر は آهسته(ゆっくり)の比較形で、「もっとゆっくり」という意味です。
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: あなたにメッセージがあります
    gloss: あなたにメッセージがあります
    note: برات は برای(〜のために)+ ت(くだけた「あなた」)が縮まった形です。
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: 明日4時にカフェに来てね
    gloss: 明日4時にカフェに来て
    note: بیا は آمدن(来る)の語幹だけを使うくだけた命令形で、A1の他の命令形と同じ作り方です。
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: じゃあね、また後で話そう
    gloss: じゃあね、また後で話そう
    note: بعداً は「後で」という意味で、صحبت می‌کنیم は「話す/話しましょう」を表す現在形(未来の意味にも使えます)です。
  fa.a1.unit22.lesson05.teach.better_now:
    title: 今は良くなりましたか？
    gloss: もう良くなった？
    note: الان は「今」という意味です。بهتر شد は直訳すると「良くなった」で、ペルシア語ではこの確認の場面に過去形を使うのが自然です。日本語でも「良くなった？」と言えるので、感覚は近いです。
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: ナルゲス、こんにちは。元気？
    gloss: こんにちは、ナルゲス、元気？
    note: '*چطوری* は「元気？」のくだけた言い方です。アリとナルゲスは友達なので、ここではこの言い方が合っています。'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: 声が途切れ途切れです
    gloss: 声が途切れ途切れだよ
    note: قطع و وصل می‌شه は直訳すると「切れたりつながったりする」で、電話の接続が悪いときのペルシア語の自然な表現です。
  fa.a1.unit22.lesson06.teach.turn01:
    title: アリが電話に出る
    gloss: アリ：もしもし、どうぞ。
  fa.a1.unit22.lesson06.teach.turn02:
    title: ナルゲスが名乗る
    gloss: ナルゲス：こんにちは、アリ。私、ナルゲスだよ。
  fa.a1.unit22.lesson06.teach.turn03:
    title: アリが挨拶を返す
    gloss: アリ：こんにちは、ナルゲス、元気？
  fa.a1.unit22.lesson06.teach.turn04:
    title: ナルゲスがゆっくり話すように頼む
    gloss: ナルゲス：元気だよ、ありがとう。もう少しゆっくり話してくれる？声が途切れ途切れなの。
  fa.a1.unit22.lesson06.teach.turn05:
    title: アリが確認する
    gloss: アリ：わかった、もう良くなった？
  fa.a1.unit22.lesson06.teach.turn06:
    title: ナルゲスが伝言を伝える
    gloss: ナルゲス：うん、良くなったよ。あなたに伝言があるの。明日4時にカフェに来てね。
  fa.a1.unit22.lesson06.teach.they_go:
    title: 彼らは行きます(くだけた形)
    gloss: 彼らは行く(話し言葉)
    note: '*می‌رن* は *می‌روند*(彼らは行く)の話し言葉の形で、このコースの他の部分と同じくだけた言い方です。'
    target_text: می‌رن(彼らは行く・口語)
  fa.a1.unit22.lesson06.teach.turn07:
    title: アリが了承する
    gloss: アリ：わかった、必ず行くよ。
  fa.a1.unit22.lesson06.teach.turn08:
    title: ナルゲスが電話を終える
    gloss: ナルゲス：じゃあね、また後で話そう。
  fa.a1.unit22.lesson06.teach.turn09:
    title: アリが別れを告げる
    gloss: アリ：じゃあね。
