teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: 家
    gloss: 家
    note: خونه は「家」の意味です(خانه の口語形)。
    example_gloss: 私の家は大きいです。
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: 寝室
    gloss: 寝室
    note: اتاق خواب は直訳すると「眠る部屋」で、寝室のことです。
    example_gloss: 寝室が2つあります。
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: キッチン
    gloss: 台所
    note: آشپزخانه は「キッチン」の意味です。
    example_gloss: 台所は広いです。
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: バスルーム
    gloss: 浴室
    note: حموم は「お風呂場、浴室」の意味です(حمام の口語形)。
    example_gloss: 浴室は清潔です。
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: いくつ
    gloss: いくつ
    note: چند تا は「いくつ」の意味で、数えられる名詞に使います。
    target_text: چند تا(いくつ)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: 二
    gloss: 二
    note: دو تا は「2つ」の意味で、数えられるものに使います。
    example_gloss: 浴室が2つあります。
  fa.a1.unit19.lesson02.teach.dare_word:
    title: 〜があります
    gloss: 持っている
    note: داره は دارد(持っている)の口語的な短縮形で、家に何があるかを説明するときに使います。
    target_text: داره(持っている、口語)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: ベッド
    gloss: ベッド
    note: تخت は「ベッド」の意味です。
    example_gloss: ベッドは寝室にあります。
  fa.a1.unit19.lesson03.teach.miz_word:
    title: テーブル
    gloss: テーブル
    note: میز は「テーブル」の意味です。
    example_gloss: テーブルは窓の隣にあります。
  fa.a1.unit19.lesson03.teach.sandali_word:
