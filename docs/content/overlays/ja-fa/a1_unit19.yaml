    target_text: تخته(ベッドです、口語)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: それは台所です
    gloss: キッチンです
    note: '*آشپزخانه‌س* は *آشپزخانه*(キッチン)に、母音の後で使う口語の「です」(*است* に由来)が付いた形です。*صندلی تو آشپزخانه‌س* では文末に来ます。「椅子はキッチンにあります」。'
    target_text: آشپزخانه‌س(キッチンです、口語)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: 〜も
    gloss: も
    note: هم は「も」の意味で、修飾する語の後ろに置きます。
    target_text: هم(も)
  fa.a1.unit19.lesson05.teach.man_word:
    title: 私
    gloss: 私
    note: من は「私」の意味です。
    example_gloss: 私の家には寝室が2つあります。
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: 〜の家/私の家
    gloss: 〜の家/私の家
    note: خونه‌ی は خونه のエザーフェ形で、持ち主の前に置きます(خونه‌ی من =私の家)。
    target_text: خونه‌ی(〜の家/私の家、エザーフェ形)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: 住まいの紹介文の例
    gloss: 私の家には寝室が2つあります。キッチンとお風呂もあります。
    note: このユニットの住まいの語彙を使った、一人称の短い説明文です。
  fa.a1.unit19.lesson06.teach.names:
    title: ニーマとサーラー
    gloss: ニーマ、サーラー
    note: このコースでよく使われるイランの名前です。
    example_gloss:
    - ニーマの家は大きいです。
    - サーラーの家は小さいです。
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: お家はどうですか?
    gloss: お家はどうですか?
    note: خونه‌ت چطوره؟ は خونه‌ت(あなたの家)と چطوره؟(どうですか)を組み合わせた表現です。
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: 良いです
    gloss: 良いです
    note: خوبه は خوب است(良いです)の口語的な短縮形です。
    example_gloss: この家は良いです。
  fa.a1.unit19.lesson06.teach.aare_word:
    title: うん
    gloss: うん
    note: آره は بله(はい)の口語形です。
    example_gloss: うん、良いよ。
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: ニーマが尋ねる
    gloss: お家はどう?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: サラが答える
    gloss: 良いよ。寝室が2つとキッチンがあるよ。
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: ニーマが尋ねる
    gloss: お風呂もある?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: サラが答える
    gloss: うん、お風呂もあるよ。
