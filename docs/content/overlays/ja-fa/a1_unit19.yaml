    gloss: 一つの
    note: یه は یک(一つの)の口語的な短縮形です。
    target_text: یه(一つの、口語)
  fa.a1.unit19.lesson03.teach.va_word:
    title: と
    gloss: と、そして
    note: و は「と、そして」の意味で、2つの文や語をつなぎます。
    target_text: و(と、そして)
  fa.a1.unit19.lesson04.teach.too_word:
    title: 〜の中に
    gloss: 中に
    note: تو は「中に」の意味で、部屋の中の位置を表します。
    target_text: تو(中に)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: 〜の隣に
    gloss: 隣に
    note: کنار は「隣に」の意味です。
