teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: 土曜日、日曜日
    gloss: 土曜日、日曜日
    note: شنبه と یکشنبه は、土曜日から始まるイランの一週間の最初の2日です。
    example_gloss:
    - 今日は土曜日です。
    - 明日は日曜日です。
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: 月曜日、火曜日
    gloss: 月曜日、火曜日
    note: دوشنبه と سه‌شنبه は、شنبه と یکشنبه に続く曜日です。
    example_gloss:
    - 月曜日に授業があります。
    - 火曜日に約束があります。
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: 水曜日、木曜日
    gloss: 水曜日、木曜日
    note: چهارشنبه と پنجشنبه は、週の半ばから終わり近くの曜日です。
    example_gloss:
    - 水曜日は仕事です。
    - 木曜日に会いましょう。
  fa.a1.unit10.lesson01.teach.jome:
    title: 金曜日
    gloss: 金曜日
    note: جمعه は一週間の最後の日で、イランでは昔からの毎週の休日です。
    example_gloss: 金曜日は休みです。
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: 毎週の休日
    gloss: 金曜日は毎週の休日です。
    note: جمعه(金曜日)はイランで昔からの毎週の休日ですが、最近は木曜日の午後も休みになる職場があります。
  fa.a1.unit10.lesson02.teach.farvardin:
    title: ファルヴァルディーン(第1月)
    gloss: ファルヴァルディーン、イランの太陽暦の最初の月
    note: فروردین はイランの太陽暦の始まりの月で、おおよそ3月下旬(春分とノウルーズのころ)にあたります。
    example_gloss: ファルヴァルディーンは一年の最初の月です。
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: オルディーベヘシュト(第2月)
    gloss: オルディーベヘシュト、第2月
    note: اردیبهشت は فروردین の次の月で、おおよそ4月〜5月にあたります。
    example_gloss: オルディーベヘシュトは天気がいいです。
  fa.a1.unit10.lesson02.teach.khordad:
    title: ホルダード(第3月)
    gloss: ホルダード、第3月
    note: خرداد は اردیبهشت の次の月で、おおよそ5月〜6月にあたります。
    example_gloss: 私はホルダード月に生まれました。
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: イランの太陽暦
    gloss: イランはヒジュラ太陽暦(ペルシア暦)を使っています。
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* は、イランが日常の日付にこの暦を使っていることを表します。アフガニスタンも同じ暦の仕組みを使いますが、月の名前はアラビア語由来ではなく、ペルシア語由来のものを使う点が異なります。'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: 今日は何曜日ですか?
    gloss: 今日は何曜日ですか?
    note: امروز چندشنبه‌ست؟ は直訳すると「今日は何番目の曜日?」という意味です。چندشنبه است の話し言葉の短縮形(-e)です。
  fa.a1.unit10.lesson03.teach.today_word:
    title: 今日
    gloss: 今日
    note: امروز は「今日」という意味です。
    example_gloss: 今日は何日ですか?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: 今日は木曜日、オルディーベヘシュト月の10日です。
    gloss: 今日は木曜日、オルディーベヘシュト月の10日です。
    note: امروز پنجشنبه، دهم اردیبهشته は、曜日、序数で表す日、月の名前を1文にまとめた表現で、話し言葉の短縮形(-e)を使っています(اردیبهشته = اردیبهشت است)。
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: 日付
    gloss: 日付
    note: '*تاریخ* は「日付」という意味で、*تاریخ جلسه*(会議の日付)のように、暦の日付を表す一般的な単語です。'
    example_gloss: 今日は何日ですか。
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: 会議は何曜日ですか?
    gloss: 会議は何曜日ですか?
    note: جلسه کدوم روزه؟ は、行事が週のどの曜日にあるかをたずねる表現です。
  fa.a1.unit10.lesson05.teach.which_date:
    title: オルディーベヘシュト月の火曜日は何日ですか?
    gloss: 火曜日はオルディベヘシュト月の何日ですか?
    note: سه‌شنبه چندم اردیبهشته؟ は、特定の曜日が何日にあたるかを具体的に尋ねる表現です。
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8日
    gloss: 8日
    note: '*هشتم* は(月の)8日という意味です。'
    example_gloss: 今日は8日です。
  fa.a1.unit10.lesson06.teach.turn01:
    title: レザ、会議は何曜日ですか?
    gloss: レザ、会議は何曜日ですか?
    note: マルヤムは、レザの名前を呼んで直接たずねることから会話を始めます。
  fa.a1.unit10.lesson06.teach.turn02:
    title: 火曜日だと思います。
    gloss: 火曜日だと思います。
    note: فکر کنم(「〜と思う」)を付けることで、レザの答えは100%確かではないというやわらかい言い方になります。
  fa.a1.unit10.lesson06.teach.turn03:
    title: 火曜日はオルディベヘシュト月の何日ですか?
    gloss: 火曜日はオルディベヘシュト月の何日ですか?
    note: マルヤムは続けて、具体的な日付をたずねます。
  fa.a1.unit10.lesson06.teach.turn04:
    title: 火曜日はオルディベヘシュト月の8日です。
    gloss: 火曜日はオルディベヘシュト月の8日です。
    note: レザが具体的な日付を答えます。
  fa.a1.unit10.lesson06.teach.turn05:
    title: わかりました、いいですね。金曜日はどうですか、時間はありますか?
    gloss: わかりました、いいですね。金曜日はどうですか、時間はありますか?
    note: マルヤムは日付を確認したあと、別の曜日について聞きます。
  fa.a1.unit10.lesson06.teach.turn06:
    title: いいえ、金曜日は忙しいです。
    gloss: いいえ、金曜日は忙しいです。
    note: سرم شلوغه(直訳は「私の頭が混んでいる」)は、イランの口語で「忙しい」と言うときの自然な表現です。
  fa.a1.unit10.lesson06.teach.turn07:
    title: 問題ありません、火曜日に会いましょう。
    gloss: 問題ありません、火曜日に会いましょう。
    note: مشکلی نیست(「問題ない」)はレザの断りを丁寧に受け入れる言葉で、می‌بینمت は「会いましょう」の意味です。これで会議が火曜日だと確認でき、2番目・4番目の発言とも合っています。
  fa.a1.unit10.lesson06.teach.va_and:
    title: 〜と
    gloss: 〜と、そして
    note: '*و* は「〜と」「そして」という意味です。*دوشنبه و سه‌شنبه* のように二つの曜日をつなげたり、*جلسه کدوم روزه و چندم اردیبهشته؟* のように関連する二つの質問をつなげたりできます。'
    example_gloss: 月曜日と火曜日に授業があります。
