course:
  title: ペルシア語 A1
  description: 初級ペルシア語(イラン)：乗り物の名前(バス、地下鉄、車、自転車、徒歩、タクシー)、いつもの通勤手段の言い方(毎日バスで仕事に行く)、どちらの交通手段がよいかのたずね方(اتوبوس یا مترو، کدوم بهتره؟)、地元の切符の値段のたずね方と短い時刻表の文の読み方、ニマとサラのふだんの通勤についての読み物、そして2人がそれぞれの移動手段を比べるまとめの会話を学びます。
