    title: 家族の写真
teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: 母
    gloss: 母
    note: مادر は「母」を表す、改まった書き言葉でも使える標準的な単語です。
    example_gloss: 私の母は優しいです。
  fa.a1.unit04.lesson01.teach.maman:
    title: お母さん
    gloss: お母さん、ママ
    note: مامانは、ほとんどの家庭で実際に使われる日常の話し言葉です。
    example_gloss: お母さん、おなかがすいた。
  fa.a1.unit04.lesson01.teach.pedar:
    title: 父
    gloss: 父
    note: پدرは、書き言葉や改まった場面で使われる中立的な「父」を表す言葉です。
    example_gloss: 私の父は医者です。
  fa.a1.unit04.lesson01.teach.baba:
    title: お父さん
    gloss: お父さん、パパ
    note: باباは、ほとんどの家庭で実際に使われる日常の話し言葉です。
    example_gloss: お父さん、どこにいるの?
  fa.a1.unit04.lesson01.teach.baradar:
    title: 兄・弟
    gloss: 兄／弟
    note: برادرは標準的な言い方です。話し言葉で親しみを込めた形のداداشは、このユニットの後半で出てきます。
    example_gloss: 私には兄(弟)が一人います。
  fa.a1.unit04.lesson01.teach.khahar:
    title: 姉・妹
    gloss: 姉／妹
    note: خواهرは「姉妹」を表す標準的な言葉です。
    example_gloss: 私の姉(妹)は大学生です。
  fa.a1.unit04.lesson01.teach.register_note:
    title: 改まった言い方と日常の言い方
    gloss: ママとパパは「母」と「父」と同じ意味ですが、より打ち解けた言い方です。
    note: ペルシア語の親の呼び方には2つの形がありますが、きっちりした敬体・常体の区別ではありません。مامان/باباは、改まった場でも、多くの人が自分の親を呼ぶときに実際に使う言葉です。
  fa.a1.unit04.lesson02.teach.daram:
    title: 私は~を持っています
    gloss: 私には~がいる・ある
    note: '*دارم*は*داشتن*(「持つ、いる」)の一人称の形で、家族を説明するときの中心となる動詞です。'
  fa.a1.unit04.lesson02.teach.yek:
    title: 一
    gloss: 一
    note: یکは数える名詞の前で使います。例:یک برادر(兄または弟が1人)。
    example_gloss: 私には姉(妹)が1人います。
  fa.a1.unit04.lesson02.teach.one_brother:
    title: 私には兄(弟)が1人います。
    gloss: 私には兄(弟)が1人います。
    note: 語順は、主語、数量+名詞、動詞の順で、日本語と同じようにペルシア語も動詞が文末にきます。
  fa.a1.unit04.lesson02.teach.no_sister:
    title: 私には姉(妹)がいません。
    gloss: 私には姉(妹)がいません。
    note: ندارمはدارمの否定形です。「一つの」に当たる別の語は必要ありません。
  fa.a1.unit04.lesson02.teach.family_big:
    title: 私の家族は大家族です。
    gloss: 私の家族は大家族です。
    note: بزرگهは、話し言葉でبزرگ است(大きい)が縮まった形です。
  fa.a1.unit04.lesson02.teach.family_small:
    title: 私たちの家族は小家族です。
    gloss: 私たちの家族は小家族です。
    note: کوچیکهは、話し言葉でکوچک است(小さい)が縮まった形で、書き言葉のکوچکではなく口語の発音کوچیکを使っています。
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: 祖父
    gloss: 祖父
    note: پدربزرگは直訳すると「大きい父」で、父方・母方のどちらにも使います。
    example_gloss: 私の祖父は高齢です。
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: 祖母
    gloss: 祖母
    note: مادربزرگは直訳すると「大きい母」で、父方・母方のどちらにも使います。
    example_gloss: 私の祖母は優しい人です。
  fa.a1.unit04.lesson03.teach.amoo:
    title: 父方のおじ
    gloss: おじ(父の兄弟)
    note: عموは特に「父の兄弟」を指し、「おじ」全般を表す言葉ではありません。
    example_gloss: 私のおじはテヘランに住んでいます。
  fa.a1.unit04.lesson03.teach.amme:
    title: 父方のおば
    gloss: おば(父の姉妹)
    note: عمهは特に「父の姉妹」を指します。
    example_gloss: 私のおばは教師です。
  fa.a1.unit04.lesson03.teach.dayi:
    title: 母方のおじ
    gloss: おじ(母の兄弟)
    note: داییは特に「母の兄弟」を指します。ペルシア語では、おじ・おばがどちら側の親族かを必ず区別します。日本語の「おじ」「おば」は父方・母方どちらにも使えますが、ペルシア語は別の言葉になります。
    example_gloss: 私の(母方の)おじはエンジニアです。
  fa.a1.unit04.lesson03.teach.khale:
    title: 母方のおば
    gloss: おば(母の姉妹)
    note: خالهは特に「母の姉妹」を指します。
    example_gloss: 私の(母方の)おばはイスファハーンに住んでいます。
  fa.a1.unit04.lesson03.teach.register_note:
    title: 父方と母方
    gloss: (父方の)おじとおばは父の側、(母方の)おじとおばは母の側です。
    note: この4つの区別(عمو/عمهとدایی/خاله)は、日本語の「おじ」「おば」のように父方・母方をまとめて呼ぶ言い方とは違い、ペルシア語ではそれぞれ別の言葉になります。
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: 何人
    gloss: 何人、いくつ
    note: چند تاは、人や物の数を日常的にたずねるときに、数える名詞の前で使います。
    example_gloss: 姉妹は何人いますか?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: きょうだいは何人いますか?(丁寧)
    gloss: きょうだいは何人いますか?
    note: داریدは「持つ、いる」の丁寧形・複数形で、شماに対応します。
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: きょうだいは何人いるの?(くだけた言い方)
    gloss: きょうだいは何人いますか?
    note: داریはくだけた単数形で、同年代や年下の相手に使います。
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: ご家族は何人ですか?
    gloss: ご家族は何人ですか?
    note: نفرは人を数える助数詞です。نفرنは、話し言葉でنفر هستند(…人です)が縮まった形です。
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 4人です。私、母、父、兄(弟)です。
    gloss: 4人です。私、母、父、兄(弟)です。
    note: نفریمはنفر هستیم(私たちは…人です)が縮まった形で、話し言葉です。
  fa.a1.unit04.lesson05.teach.showhar:
    title: 夫
    gloss: 夫
    note: شوهرは「夫」を表す標準的な言葉です。
    example_gloss: 私の夫はエンジニアです。
  fa.a1.unit04.lesson05.teach.zan:
    title: 妻
    gloss: 妻
    note: زنは一般的な「女性」の意味でも使います。どちらの意味かは文脈で分かります。
    example_gloss: 私の妻は教師です。
  fa.a1.unit04.lesson05.teach.motahel:
    title: 結婚している
    gloss: 既婚の
    note: متأهلは、婚姻状況を表す中立的でよく使われる形容詞です。
    example_gloss: 彼/彼女は結婚しています。
  fa.a1.unit04.lesson05.teach.mojarad:
    title: 独身
    gloss: 独身(未婚)
    note: مجردは「未婚」を表す標準的な言葉です。
    example_gloss: 私は独身です。
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: 私は独身です。
    gloss: 私は独身です。
    note: مجردمはمجرد+م(「私は〜です」)で、خوبم(「元気です」)と同じ一人称の語尾のパターンです。
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: 私は結婚しています。
    gloss: 私は結婚しています。
    note: متأهلمはمتأهل+م(「私は〜です」)で、مجردمと同じパターンです。
  fa.a1.unit04.lesson05.teach.nave:
    title: 孫
    gloss: 孫
    note: نوهは男の孫にも女の孫にも使えます。ペルシア語ではここで性別を区別する必要はありません。
    example_gloss: 彼/彼女には孫が1人います。
  fa.a1.unit04.lesson05.teach.example:
    title: 私の兄(弟)は結婚していて、息子が1人います。
    gloss: 私の兄(弟)は結婚していて、息子が1人います。
    note: متأهلهはمتأهل است(結婚している)が縮まった話し言葉の形、دارهはدارد(持っている、いる)の話し言葉の形です。
  fa.a1.unit04.lesson06.teach.in_photo:
    title: これ、あなたの家族の写真?
    gloss: これ、あなたの家族の写真?
    note: خانواده‌تهはخانواده‌ی تو است(あなたの家族の…です)が縮まった形で、話し言葉ではとてもよく使われます。
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: うん。これが私の母で、これが父だよ。
    gloss: うん。これが私の母で、これが父だよ。
    note: '*آره*は話し言葉の「うん」で、改まった*بله*(はい)に当たります。*مامانمه*は*مامانم*(私の母)に、話し言葉の「〜です」の語尾が付いた形です。'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: この男の人は誰?
    gloss: この男の人は誰?
    note: کیهはکی است(誰ですか)が縮まった話し言葉の形です。
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: 私の兄(弟)だよ。兄(弟)が1人いて、姉妹はいないの。
    gloss: 私の兄(弟)だよ。兄(弟)が1人いて、姉妹はいないの。
    note: داداشは親しみを込めた日常的な「兄/弟」の言い方で、ここでは第1課の中立的なبرادرの代わりに使われています。
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: うちは逆だね。私は姉妹が2人いて、兄弟はいないの。
    gloss: うちは逆だね。私は姉妹が2人いて、兄弟はいないの。
    note: برعکسهはبرعکس است(逆です)が縮まった形です。
  fa.a1.unit04.lesson06.teach.closing:
    title: じゃあ、あなたの家もにぎやかだね!
    gloss: じゃあ、あなたの家もにぎやかだね!
    note: شلوغهはشلوغ است(にぎやかだ、混み合っている)が縮まった形で、子どもが何人もいる家庭を温かく表す、よく使われる言い方です。
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 改まった書き言葉:持っている/持っていない/である
    gloss: 話し言葉:持っている、持っていない。改まった書き言葉:持っている、持っていない。彼は私の兄(弟)です。
    note: دارد/ندارد/استは、この会話で使われている話し言葉のداره/ندارهなどに当たる改まった書き言葉の形です。改まった文章では、親しみを込めたداداشも中立的なبرادرに置き換わります。
