course:
  title: ペルシア語 A1
  description: ペルシア語(イラン)の初級：家事について話す、やるべきことを伝える、皿洗い・洗濯・掃き掃除・部屋の掃除を誰がするか言う、家事を手伝ってもらうよう頼む。
