teaching:
  fa.a1.unit32.lesson01.teach.zarf_shostan:
    title: 皿洗い
    gloss: 皿洗い
    note: '*ظرف شستن*は*ظرف*(「お皿」)+*شستن*(「洗うこと」)を組み合わせた言い方です。'
    example_gloss: 皿洗いは私の担当です。
  fa.a1.unit32.lesson01.teach.lebas_shostan:
    title: 洗濯
    gloss: 洗濯
    note: '*لباس شستن*は直訳すると「服を洗うこと」で、洗濯をすることを表す日常的な言い方です。'
    example_gloss: 洗濯は今日の私の担当です。
  fa.a1.unit32.lesson01.teach.tamiz_kardan:
    title: 掃除
    gloss: 掃除
    note: '*تمیز کردن*は「きれいにする、掃除する」という意味です。'
    example_gloss: 私は部屋を掃除します。
  fa.a1.unit32.lesson01.teach.jaru_zadan:
    title: 掃く
    gloss: 掃き掃除
    note: '*جارو زدن* は、家や道具によって「ほうきで掃く」または「掃除機をかける」という意味になります。'
    example_gloss: 私は家を掃きます。
  fa.a1.unit32.lesson01.teach.review_house_words:
    title: 家/部屋/家事/私の/と
    gloss: 家/部屋/家事/私の/と
    note: '*خونه*、*اتاق*、*کار*、*من*、*و* は、これまでのユニットに出てきた単語で、ここでもう一度登場します。'
    target_text: خونه (家) / اتاق (部屋) / کار (仕事、用事) / من (私、私の) / و (と、そして)
  fa.a1.unit32.lesson01.teach.review_object_marker:
    title: 目的語を示す印/私はする/〜する必要があります
    gloss: 目的語を示す語/私は〜をする/〜しなければならない
    note: '*رو* は目的語を示します。*می‌کنم* は「私は〜をする」、*باید* は「〜しなければならない」「〜する必要がある」という意味です。'
    target_text: رو (目的語を示す語) / می‌کنم (私はする) / باید (〜しなければならない)
  fa.a1.unit32.lesson01.teach.need_clean_room:
    title: 部屋を掃除しなければなりません
    gloss: 部屋を掃除しなければなりません
    note: '*باید اتاق رو تمیز کنم* は、家事についてストレートに言える便利な文です。'
  fa.a1.unit32.lesson02.teach.review_questions:
    title: 何/いつ/今日
    gloss: 何/いつ/今日
    note: '*چی*、*کِی*、*امروز* は、復習となる疑問詞と時を表す語です。'
    target_text: چی (何) / کِی (いつ) / امروز (今日)
  fa.a1.unit32.lesson02.teach.mikoni_pattern:
    title: 私がする → あなたがする
    gloss: 私はする → あなたはする
    note: '*می‌کنی* は、くだけた言い方の「あなたは〜をする」で、*می‌کنم* と対になる形です。'
    target_text: می‌کنم (私はする) -> می‌کنی (あなたはする、くだけた形)
  fa.a1.unit32.lesson02.teach.question_what_chore:
    title: 今日は何をする？
    gloss: 今日は何をする？
    note: '*امروز چه کاری می‌کنی؟* は、今日何をするのかをたずねる文です。'
  fa.a1.unit32.lesson02.teach.mishuram_pattern:
    title: 私が洗う
    gloss: 私は洗う
    note: '*می‌شورم* は「私は洗う」という意味です。'
  fa.a1.unit32.lesson02.teach.zarfha_answer:
    title: 私は食器を洗います
    gloss: 私は食器を洗います
    note: '*ظرف‌ها* は「食器」という意味です。'
  fa.a1.unit32.lesson02.teach.lebasha_answer:
    title: 私は洗濯をします
    gloss: 私は洗濯をします
    note: '*لباس‌ها رو می‌شورم* は、直訳すると「私は服を洗います」という意味です。'
  fa.a1.unit32.lesson03.teach.help_word:
    title: 手伝い
    gloss: 助け
    note: '*کمک* は「手伝い」「助け」という意味です。'
    example_gloss: 手伝ってくれる？
  fa.a1.unit32.lesson03.teach.help_question:
    title: 手伝ってくれる？
    gloss: 手伝ってくれる？
    note: '*کمک می‌کنی؟* は、くだけた場面で使えるシンプルなお願いの表現です。'
  fa.a1.unit32.lesson03.teach.review_please:
    title: どうぞ/それから/必ず
    gloss: どうか/それから/もちろん
    note: '*لطفاً*、*بعد*、*حتماً* を使うと、お願いや返事が丁寧で自然になります。'
    target_text: لطفاً (どうぞ、お願いします) / بعد (あとで、それから) / حتماً (必ず)
  fa.a1.unit32.lesson03.teach.help_request_room:
    title: 部屋の掃除を手伝ってくれませんか？
    gloss: 部屋の掃除を手伝ってくれませんか？
    note: '*لطفاً کمک می‌کنی اتاق رو تمیز کنم؟* は、特定の家事についての手伝いをお願いする文です。'
  fa.a1.unit32.lesson03.teach.accept_help:
    title: もちろん。そのあと私が掃きます。
    gloss: もちろん。そのあと私が掃きます。
    note: '*حتماً. بعد جارو می‌زنم* は、引き受けて、次にする家事を伝える言い方です。'
  fa.a1.unit32.lesson04.teach.review_dialogue_words:
    title: 散らかっている/うん/すごい/ありがとう
    gloss: 散らかっている/うん/すばらしい/ありがとう
    note: '*شلوغه* は、場所が混んでいる、にぎやか、または散らかっているという意味になります。ここでは家が散らかっているという意味です。'
    target_text: شلوغه (散らかっている、混んでいる) / آره (うん) / عالیه (最高だ) / ممنون (ありがとう)
  fa.a1.unit32.lesson04.teach.dialogue_line1:
    title: サラ：ニマ、今日は家がすごく散らかっているね。
    gloss: ニマ、今日は家がすごく散らかっているね。
  fa.a1.unit32.lesson04.teach.dialogue_line2:
    title: ニマ：うん、私が食器を洗うよ。
    gloss: うん、私が食器を洗うよ。
  fa.a1.unit32.lesson04.teach.dialogue_line3:
    title: サラ：私は部屋を掃除するね。そのあと手伝ってくれる？
    gloss: 私は部屋を掃除するね。そのあと手伝ってくれる？
  fa.a1.unit32.lesson04.teach.dialogue_line4:
    title: ニマ：もちろん。そのあと洗濯をするよ。
    gloss: もちろん。そのあと洗濯をするよ。
  fa.a1.unit32.lesson04.teach.dialogue_line5:
    title: サラ：すばらしい、ありがとう！
    gloss: すばらしい、ありがとう！
  fa.a1.unit32.lesson05.teach.review_third_person:
    title: 彼/彼女が洗う/掃除する
    gloss: 彼/彼女は洗う / 彼/彼女は掃除する
    note: '*می‌شوره* と *می‌کنه* は、ほかの人がすることを話すときに使う、三人称の口語形です。'
    target_text: می‌شوره (彼/彼女は洗う) / تمیز می‌کنه (彼/彼女は掃除する)
  fa.a1.unit32.lesson05.teach.review_responsibility:
    title: 責任がある/家事
    gloss: 担当の/家事
    note: '*کارها* は直訳すると「仕事・用事(複数)」で、ここでは家事の意味として自然に使われます。'
    target_text: مسئول (担当の、責任がある) / کارها (家事、用事)
  fa.a1.unit32.lesson05.teach.reading_text:
    title: 読み物：家事
    gloss: 今日は家が散らかっています。ニマは食器を洗って、洗濯をします。サラは部屋を掃除します。二人とも手伝います。
    note: この読み物は、会話の内容を三人称でもう一度述べています。
  fa.a1.unit32.lesson06.teach.review_tonight:
    title: 今夜/まず/それから
    gloss: 今夜/最初に/そのあと
    note: '*امشب*、*اول*、*بعد* を使うと、短いメッセージで家事の順番を伝えられます。'
    target_text: امشب (今夜) / اول (まず) / بعد (それから)
  fa.a1.unit32.lesson06.teach.wrap_summary:
    title: 今夜はまず食器を洗って、そのあと部屋を掃除します
    gloss: 今夜はまず食器を洗って、そのあと部屋を掃除します
    note: '*امشب اول ظرف‌ها رو می‌شورم، بعد اتاق رو تمیز می‌کنم* は、家事の予定を伝える自然で短い文です。'
  fa.a1.unit32.lesson06.teach.help_wrap:
    title: 家事を手伝ってくれませんか？
    gloss: 家事を手伝ってくれませんか？
    note: '*کارهای خونه* は「家事」という意味です。'
