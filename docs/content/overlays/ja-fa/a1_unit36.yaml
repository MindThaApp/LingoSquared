teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: 親切な
    gloss: 優しい
    note: '*مهربون* は、優しい人や心の温かい人を表します。'
    example_gloss: サラはとても優しいです。
  fa.a1.unit36.lesson01.teach.bamaze:
    title: おもしろい
    gloss: おもしろい
    note: '*بامزه* は、面白い人や愛嬌のある人を表します。'
    example_gloss: ニマは面白いです。
  fa.a1.unit36.lesson01.teach.khejalati:
    title: 恥ずかしがりな
    gloss: 恥ずかしがりな
    note: '*خجالتی* は、恥ずかしがり屋の人を表します。'
    example_gloss: その人は少し恥ずかしがり屋です。
  fa.a1.unit36.lesson01.teach.jeddi:
    title: まじめ
    gloss: まじめな
    note: '*جدی* は、まじめな人を表します。'
    example_gloss: 私たちの先生はまじめです。
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: 性格を表す言葉に「です」が付く形
    gloss: 彼/彼女は優しい/面白い/恥ずかしがり屋だ(縮約形のコピュラ)
    note: '*مهربونه* は、*مهربون* が子音で終わるため、*مهربون* + *است* がそのまま一つになった形です。*بامزه‌ست* は、*بامزه* がすでに母音の *ه* で終わるため、*ست* の前に書き表すZWNJ(ゼロ幅非接合子)を入れます。*خجالتیه* は、*ی* で終わる語に *ه* がそのままつく形で、外見の単元で出た *قهوه‌ایه* と同じパターンです。'
    target_text: مهربونه = مهربون + است(「です」が付いた形・子音で終わる語)/ بامزه‌ست = بامزه + است(母音で終わる語・ZWNJあり)/ خجالتیه = خجالتی + ه(ی で終わる語)
  fa.a1.unit36.lesson02.teach.zerang:
    title: 賢い
    gloss: 賢い
    note: '*زرنگ* は、賢い人や頭の回転が速い人、特に要領がよく実際的な人を表します。'
    example_gloss: マリヤムはとても賢いです。
  fa.a1.unit36.lesson02.teach.tanbal:
    title: 怠け者
    gloss: 怠け者の
    note: '*تنبل* は、怠け者の人を表します。'
    example_gloss: 今日は少しだらけています。
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: 働き者
    gloss: 勤勉な
    note: '*زحمت‌کش* は、よく働き、本当に努力する人を表します。'
    example_gloss: 父はとても勤勉です。
  fa.a1.unit36.lesson02.teach.sabur:
    title: 辛抱強い
    gloss: 辛抱強い
    note: '*صبور* は、忍耐強い人を表します。'
    example_gloss: 私たちの先生はとても我慢強いです。
  fa.a1.unit36.lesson02.teach.review_negation:
    title: 性格を表す言葉の否定
    gloss: その人は怠け者ではありません
    note: '*نیست* は縮約形のコピュラを否定します。*تنبل نیست* は「彼/彼女は怠け者ではない」という意味で、気持ちの否定ですでに習った *نیست* と同じです。'
    target_text: تنبل نیست(その人は怠け者ではありません)
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: 性格
    gloss: 性格
    note: '*شخصیت* は「性格」や「人柄」という意味です。'
    example_gloss: 彼/彼女の性格はとてもいいです。
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: その人の性格はどうですか?
    gloss: その人の性格はどうですか?
    note: '*چطوره؟*(「…はどうですか?」)はあいさつの単元ですでに習いました。*ش* は「彼/彼女の」を表す所有の接尾辞で、*شخصیت*(「性格」)につきます。'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: 彼/彼女はとても優しくて賢いです
    gloss: 彼/彼女はとても優しくて賢いです
    note: '*و* は「と・て」を意味し、性格を表す二つの言葉をつなぎます。'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: その人はどんな人ですか?
    gloss: その人はどんな人ですか?
    note: '*چه جوریه؟* は「彼/彼女はどんな人?」と尋ねるくだけた言い方で、*شخصیتش چطوره؟* の言い換えとして使えます。'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: 性格/〜はどうですか?/〜はどんな感じですか?
    gloss: 性格/…はどうですか?/…はどんな感じですか?
    note: この三つの表現で、人の性格をたずねたり言ったりできます。
    target_text: شخصیت(性格)/ چطوره؟(どうですか?)/ چه جوریه؟(どんな感じですか?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: ニマ/サラ/マリヤム/まったく/だけ/いい感じ
    gloss: ニマ/サラ/マリヤム/まったく/だけ/いい感じ
    note: '*مریم* は *سارا* の友だちで、外見の単元ですでに登場しました。*اصلاً* は「まったく(〜ない)」、*فقط* は「だけ」、*باحال* は「かっこいい/いい感じ」という意味です。'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: 彼女のことをもっと知りたいです
    gloss: 彼女のことをもっと知りたいです
    note: '*بیشتر* は「もっと」、*باهاش* は「彼/彼女と」という意味です。*آشنا بشم* は「知り合う、親しくなる」という意味です。'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: ニマ:サラ、マリヤムはどんな人?
    gloss: サラ、マリヤムはどんな人?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: サラ:とても優しくて賢いよ。
    gloss: とても優しくて賢いよ。
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: ニマ:怠け者じゃないの?
    gloss: 怠け者じゃないの?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: サラ:ううん、全然。とても働き者だよ。ただ、ちょっと恥ずかしがり屋なだけ。
    gloss: ううん、全然。とても働き者だよ。ただ、ちょっと恥ずかしがり屋なだけ。
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: ニマ:いいね。彼女のことをもっと知りたいな。
    gloss: いいね。彼女のことをもっと知りたいな。
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 読み物:マリヤムの性格
    gloss: マリヤムはサラの友だちです。とても優しくて賢い人です。仕事でも働き者で、怠けることは決してありません。ただ、少し恥ずかしがり屋なので、大人数の場ではあまり話しません。
    note: この読み物では、会話に出てきたのと同じ特徴を使って、マリヤムの性格を三人称で説明しています。
  fa.a1.unit36.lesson05.teach.reading_note:
    title: 決して〜ない(否定の動詞と一緒に)
    gloss: 決して〜ない
    note: '*هیچ‌وقت* は否定の動詞(*نیست*、*نمی‌زنه*)と一緒に使って「決して〜ない」という意味になります。日本語でも「決して〜ない」と否定で結ぶのと同じように、ペルシア語でも否定の動詞と組み合わせます。'
  fa.a1.unit36.lesson06.teach.self_description:
    title: 私はとても働き者だと思いますが、ちょっと怠け者でもあります
    gloss: 私はとても働き者だと思いますが、ちょっと怠け者でもあります
    note: '*فکر می‌کنم* は「私は思う」という意味です。*زحمت‌کشم* は *زحمت‌کش* + *هستم*(「私は〜です」)が縮約した形です。*هستم* は「私は〜です」の縮約しない完全な形で、ここでは *هم*(「も」)の後に強調として使われています。'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: あなたの性格はどうですか?
    gloss: あなたの性格はどうですか?
    note: '*شخصیتت* は、くだけた所有の接尾辞 *ت*(「あなたの」)が *شخصیت* についた形で、*شخصیتش* の *تو* 向けの言い方です。'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: 優しい/面白い/恥ずかしがり屋/まじめ/賢い/怠け者/働き者/忍耐強い
    gloss: 優しい/面白い/恥ずかしがり屋/まじめ/賢い/怠け者/働き者/忍耐強い
    note: これはこの単元の性格を表す基本の八語です。
