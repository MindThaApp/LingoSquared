course:
  title: ペルシア語 A1
  description: 文字の読み方、日常会話の理解、丁寧に対応する実用的な会話を中心に学ぶ、イランのペルシア語の初級コースです。
units:
  fa.a1.unit01.greetings:
    title: あいさつと初対面
lessons:
  fa.a1.unit01.lesson01.script_ramp:
    title: はじめてのペルシア語を読もう
  fa.a1.unit01.lesson02.everyday_greetings:
    title: 日常のあいさつ
  fa.a1.unit01.lesson03.time_and_farewells:
    title: 一日のあいさつと別れのあいさつ
  fa.a1.unit01.lesson04.formal_informal_wellbeing:
    title: 丁寧な雑談とくだけた雑談
  fa.a1.unit01.lesson05.taarof_basics:
    title: ターロフ入門
  fa.a1.unit01.lesson06.first_meeting_dialogue:
    title: 初対面の会話
teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: ペルシア語は右から左へ
    gloss: ペルシア語は右から左に書きます。
    note: ペルシア語は右端から左に向かって読みます。
  fa.a1.unit01.lesson01.teach.seen:
    title: 文字 س
    gloss: s
    note: س は通常「s」の音を表します。
  fa.a1.unit01.lesson01.teach.lam:
    title: 文字 ل
    gloss: l
    note: ل は「l」の音を表し、前後の文字とつながります。
  fa.a1.unit01.lesson01.teach.alef:
    title: 文字 ا
    gloss: ā / a
    note: ا は長い「ā」を表すことが多く、次の文字にはつながりません。
  fa.a1.unit01.lesson01.teach.mim:
    title: 文字 م
    gloss: m
    note: م は「m」の音を表し、つながると形が変わります。
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: سلام を組み立てよう
    gloss: こんにちは
    note: سلام は「salâm」と読みます。ペルシア語の表記では、短い母音は通常書きません。
    example_gloss: こんにちは！ニマです。
  fa.a1.unit01.lesson02.teach.salam:
    title: こんにちは
    gloss: こんにちは
    note: سلام は、改まった場面でもくだけた場面でも使えます。
    example_gloss: こんにちは、お元気ですか？
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: おはようございます
    gloss: おはようございます
    note: صبح بخیر は、丁寧で一般的な朝のあいさつです。
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: こんにちは・こんばんは(午後〜夕方)
    gloss: こんにちは / こんばんは
    note: عصر بخیر は、午後の遅い時間から夕方にかけて使います。
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: さようなら
    gloss: さようなら
    note: خداحافظ は「khodâhâfez」と読み、一般的な標準の別れのあいさつです。
    example_gloss: さようなら、またあとで！
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: ありがとう
    gloss: ありがとう
    note: ممنون は日常的で自然な言い方で、متشکرم はややあらたまった言い方です。
    example_gloss: どうもありがとうございます。
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: どういたしまして
    gloss: どういたしまして
    note: خواهش می‌کنم は、お礼に対する決まった返事です。
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: お元気ですか？ 丁寧な話し言葉
    gloss: お元気ですか。
    note: حالتون چطوره؟ は、イランのペルシア語の丁寧で一般的な話し言葉です。حال شما چطور است؟ は、よりあらたまった言い方・書き言葉です。
  fa.a1.unit01.lesson02.teach.khoobam:
    title: 元気です
    gloss: 元気です
    note: خوبم は、خوب に一人称の語尾 ـم がついた形です。
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: こんにちは(良い一日を)
    gloss: こんにちは(良い一日を)
    note: روز بخیر は丁寧な言い方ですが、くだけた会話では سلام ほど頻繁には使いません。
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: おやすみなさい
    gloss: おやすみなさい
    note: شب بخیر は、ふつう別れ際や寝る前のあいさつで、会ったときのあいさつには使いません。
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: ようこそ
    gloss: ようこそ
    note: خوش آمدید は、お客さんが一人でも複数でも使える丁寧な言い方です。
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: またお会いしましょう
    gloss: またお会いできますように / また会う日まで
    note: به امید دیدار は、改まった感じのある、丁寧で一般的な別れのあいさつです。
  fa.a1.unit01.lesson03.teach.fealan:
    title: じゃあね
    gloss: ではまた
    note: فعلاً は会話的な言い方で、خداحافظ よりくだけています。
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: 良い一日を
    gloss: 良い一日をお過ごしください
    note: この決まった別れのあいさつでは、باشید が丁寧な形であることを示します。
  fa.a1.unit01.lesson04.teach.formal_question:
    title: 丁寧で一般的な話し言葉
    gloss: お元気ですか。
    note: 初対面の大人や、ふつうの丁寧な会話では حالتون چطوره؟ を使います。はっきりあらたまった形・書き言葉の形は حال شما چطور است؟ です。
  fa.a1.unit01.lesson04.teach.informal_question:
    title: くだけた言い方
    gloss: お元気ですか。
    note: چطوری؟ は会話的な言い方で、友人・家族・同年代など、関係が許す相手に使います。
  fa.a1.unit01.lesson04.teach.to:
    title: 親しい「きみ・あなた」
    gloss: あなた
    note: تو は単数でくだけた言い方です。初対面の大人にはむやみに使わないでください。
  fa.a1.unit01.lesson04.teach.very_well:
    title: とても元気です
    gloss: とても元気です
    note: خیلی は خوبم の意味を強めます。
  fa.a1.unit01.lesson04.teach.not_bad:
    title: 悪くないです
    gloss: 悪くないです、ありがとう
    note: بد نیستم は、不満を言うのではなく、ほどほどの状態を伝える自然な返事です。
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: あなたは？ 丁寧な言い方
    gloss: あなたは？
    note: شما چطور؟ を使うと、丁寧に聞き返せます。
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: あなたは？(くだけた形)
    gloss: あなたは？
    note: تو چطور؟ は、くだけた間柄で使います。
  fa.a1.unit01.lesson05.teach.chai:
    title: 紅茶
    gloss: お茶
    note: '*چای* は飲み物の「お茶」です。*چای بفرمایید*(お茶をどうぞ)という勧め方でよく耳にします。'
    example_gloss: どうぞ、お茶はいかがですか？
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: どうぞ
    gloss: どうぞ / お先にどうぞ / はい、どうぞ
    note: '*بفرمایید* は場面によって意味が変わります。「はい、どうぞ」(お茶を出すとき)、「どうぞお入りください」(ドアのところで)、「お先にどうぞ」などになります。'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: 恐れ入ります
    gloss: ご親切にありがとうございます
    note: لطف دارید は、褒め言葉に丁寧に応える表現です。
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: どうぞおかまいなく
    gloss: どうぞおかまいなく
    note: زحمت نکشید は、本心からの辞退の場合もあれば、具体的な申し出に対する最初の丁寧な返事の場合もあります。
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: ご親切に感謝します
    gloss: ご親切に感謝します
    note: ممنون だけより、温かく気持ちがはっきり伝わる言い方です。
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: ターロフ
    gloss: 場面に応じたイラン式の礼儀作法
    note: ターロフとは、申し出る・断る・感謝する・敬意を示すときの、場面に応じた決まりごとのことです。実際の振る舞いは、関係・世代・地域・状況によって異なり、何回断ったか、何回繰り返したかで本心かどうかが決まるわけではありません。
  fa.a1.unit01.lesson06.teach.line01:
    title: ようこそ
    gloss: アリがナルゲスを迎えます。
    note: 自己紹介の前に、まずあいさつから始まります。
  fa.a1.unit01.lesson06.teach.line02:
    title: 歓迎への返事
    gloss: ナルゲスはあいさつを返し、お礼を言います。
    note: ممنون(ありがとう)は、迎えられたときの自然な返事です。
  fa.a1.unit01.lesson06.teach.line03:
    title: 名前を言い合う
    gloss: アリが名乗ります。
    note: '*من علی هستم* は「私はアリです」という意味です。*هستم*(です)は文の最後に来ます。'
  fa.a1.unit01.lesson06.teach.line04:
    title: 名前を言い合う(返事)
    gloss: ナルゲスが名乗ります。
    note: アリが使ったのと同じ *من ... هستم* の型です。
  fa.a1.unit01.lesson06.teach.line05:
    title: はじめまして
    gloss: アリが、お会いできてうれしいと伝えます。
    note: '*خوشوقتم* は「うれしいです」という意味です。*از آشنایی با شما* と合わせると、初対面での標準的な丁寧表現になります。'
  fa.a1.unit01.lesson06.teach.line06:
    title: 「お会いできてうれしい」への返事
    gloss: ナルゲスも同じ気持ちを返します。
    note: この返事での همین‌طور は「同じく」「こちらこそ」という意味です。
  fa.a1.unit01.lesson06.teach.line07:
    title: 相手の調子をたずねる
    gloss: アリが丁寧に、彼女の調子をたずねます。
    note: 初対面の丁寧な場面なので、アリは丁寧で一般的な話し言葉の ـتون の形を使っています。
  fa.a1.unit01.lesson06.teach.line08:
    title: 相手の調子をたずねる、返事
    gloss: ナルゲスは答えて、同じ質問を返します。
    note: شما چطور؟ は、同じ質問を聞き返すためのよくある短い言い方です。
  fa.a1.unit01.lesson06.teach.line09:
    title: 招き入れる
    gloss: アリは自分も元気だと言い、ナルゲスを中に招き入れます。
    note: '*بفرمایید داخل* は「どうぞお入りください」という意味です。*داخل*(中)が、勧めている内容を示します。'
  fa.a1.unit01.lesson06.teach.line10:
    title: 丁寧に断る
    gloss: ナルゲスはお礼を言ったうえで、もう行かなければならないと説明します。
    note: 丁寧に断るときも、断る前にまずお礼を言います。*ولی باید برم* は「でも行かなければなりません」という意味です。
  fa.a1.unit01.lesson06.teach.line11:
    title: 会話を終える
    gloss: アリは彼女の返事を受け止め、また会えることを願います。
    note: 招待を断ったあと、自然に別れのあいさつへ進みます。
  fa.a1.unit01.lesson06.teach.line12:
    title: 会話を終える(返事)
    gloss: ナルゲスがさよならを言います。
    note: '*خداحافظ* は、一般的な標準の別れのあいさつです。'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
    instruction: ペルシア語の「salâm」を選んでください。
    correct_option: سلام
    distractors:
    - سام
    - لام
    - ماس
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام は「salâm」を完全に書き表した語です。
  fa.a1.unit01.lesson01.exercise02.recognize_seen:
    instruction: 「s」の音を表す文字はどれですか？
    correct_option: س
    distractors:
    - ل
    - ا
    - م
    accepted_answers:
    - value: س
      status: correct
    feedback: س は「s」の音を表します。
  fa.a1.unit01.lesson01.exercise03.recognize_lam:
    instruction: 「l」の音を表す文字はどれですか？
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: ل は「l」の音を表します。
  fa.a1.unit01.lesson01.exercise04.build_salam:
    instruction: 文字を並べて سلام を作ってください。
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: 順に並べた文字で سلام になります。
  fa.a1.unit01.lesson01.exercise05.select_missing_lam:
    instruction: 足りないペルシア語の文字を選んでください。
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: 足りない文字は ل です。
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: ペルシア語の各文字を、おおよそのラテン文字の音と組み合わせてください。
    accepted_answers:
    - value:
        س: s
        ل: l
        ا: ā
        م: m
      status: correct
    feedback: この4つの対応を組み合わせると سلام になります。
    pairs:
    - left: س
      right: s
    - left: ل
      right: l
    - left: ا
      right: ā
    - left: م
      right: m
  fa.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: このペルシア語の単語は右から読みますか？
    correct_option: はい
    distractors:
    - いいえ
    accepted_answers:
    - value: はい
      status: correct
    feedback: ペルシア語は右から左へ読みます。
  fa.a1.unit01.lesson01.exercise08.romanize_salam:
    instruction: سلام のよく使われるラテン文字表記を入力してください。
    answer_language_code: en
    accepted_answers:
    - value: salam
      status: correct
    - value: salâm
      status: correct
    - value: salām
      status: correct
    - value: salaam
      status: acceptable_with_note
      note: よく使われるローマ字風の綴りです。
    feedback: コースでの表記は salâm です。salam や salām も正解として受け付けます。
  fa.a1.unit01.lesson02.exercise01.recognize_salam_reading:
    instruction: この言葉の意味は何ですか？
    correct_option: こんにちは
    distractors:
    - さようなら
    - ありがとう
    - おはようございます
    accepted_answers:
    - value: こんにちは
      status: correct
    feedback: سلام は「こんにちは」という意味です。
  fa.a1.unit01.lesson02.exercise02.recognize_morning_reading:
    instruction: このあいさつはどんな意味ですか？
    correct_option: おはようございます
    distractors:
    - こんにちは / こんばんは
    - さようなら
    - こんにちは
    accepted_answers:
    - value: おはようございます
      status: correct
    feedback: صبح بخیر は、丁寧さも普通の程度の朝のあいさつです。
  fa.a1.unit01.lesson02.exercise03.goodbye_meaning:
    instruction: خداحافظ の意味を選んでください。
    correct_option: さようなら
    distractors:
    - こんにちは
    - ありがとう
    - こんばんは
    accepted_answers:
    - value: さようなら
      status: correct
    feedback: خداحافظ は、一般的な標準の別れのあいさつです。
  fa.a1.unit01.lesson02.exercise04.recognize_evening_reading:
    instruction: このあいさつはどんな意味ですか？
    correct_option: こんにちは / こんばんは
    distractors:
    - おはようございます
    - さようなら
    - こんにちは
    accepted_answers:
    - value: こんにちは / こんばんは
      status: correct
    feedback: عصر بخیر は、午後遅めの時間帯に使います。
  fa.a1.unit01.lesson02.exercise05.order_youre_welcome:
    instruction: 「どういたしまして」を表すペルシア語の単語を並べ替えてください。
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم は、お礼に対する決まった返事です。
  fa.a1.unit01.lesson02.exercise06.reply_how_are_you:
    instruction: 習ったフレーズで丁寧に答えてください。
    accepted_answers:
    - value: خوبم، ممنون
      status: correct
    - value: خوبم ممنون
      status: correct
    - value: خوبم، ممنونم
      status: correct
    - value: من خوبم، ممنون
      status: correct
    - value: خوبم. ممنون
      status: correct
    - value: خوبم ممنونم
      status: correct
    - value: من خوبم ممنون
      status: correct
    - value: من خوبم، ممنونم
      status: correct
    - value: خوبم، مرسی
      status: correct
    - value: خوبم، متشکرم
      status: correct
    - value: خوبم
      status: acceptable_with_note
      note: 正解ですが、社交的にはやや物足りない返事です。
    feedback: خوبم، ممنون は「元気です、ありがとう」という意味です。
  fa.a1.unit01.lesson02.exercise07.produce_thanks:
    instruction: ペルシア語に訳してください：ありがとう。
    accepted_answers:
    - value: ممنون
      status: correct
    - value: ممنونم
      status: correct
    - value: متشکرم
      status: correct
    - value: مرسی
      status: acceptable_with_note
      note: 口語でとてもよく使われる借用表現です。
    - value: خیلی ممنون
      status: acceptable_with_note
      note: 「どうもありがとう」という意味です。
    - value: ممنون از شما
      status: acceptable_with_note
      note: ややていねいに、より丁寧にお礼を言う言い方です。
    feedback: ممنون がこのレッスンの目標表現です。ほかの言い方もイランのペルシア語として自然です。
  fa.a1.unit01.lesson02.exercise08.romanize_goodbye:
    instruction: خداحافظ のよく使われるラテン文字表記を入力してください。
    answer_language_code: en
    accepted_answers:
    - value: khodahafez
      status: correct
    - value: khodâhâfez
      status: correct
    - value: khodāhāfez
      status: correct
    - value: khoda hafez
      status: correct
    - value: khodā hāfez
      status: correct
    - value: khodafez
      status: correct
    - value: khodâ hâfez
      status: correct
    feedback: コースでの表記は khodâhâfez です。
  fa.a1.unit01.lesson03.exercise01.night_meaning:
    instruction: شب بخیر の普通の使い方を選んでください。
    correct_option: 別れるときや寝る前の「おやすみなさい」
    distractors:
    - おはようございます
    - ようこそ
    - ありがとう
    accepted_answers:
