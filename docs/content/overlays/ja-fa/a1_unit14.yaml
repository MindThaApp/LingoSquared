teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: 好きです
    gloss: 私は好きです
    note: دوست دارم は直訳すると「(それに対する)友情を持っている」で、「好きです」と言うときの標準的な表現です。
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: コーヒー
    gloss: コーヒー
    note: قهوه は「コーヒー」という意味です。
    example_gloss: コーヒーが好きです。
  fa.a1.unit14.lesson01.teach.chay_word:
    title: 紅茶
    gloss: お茶
    note: چای は「お茶」という意味です。
    example_gloss: 私はお茶が好きではありません。
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: 好きではありません
    gloss: 好きではありません
    note: دوست ندارم は دوست دارم の否定形です。
  fa.a1.unit14.lesson01.teach.man_word:
    title: 私
    gloss: 私
    note: من は「私」という意味です。動詞の語尾で主語がわかるため省略できることが多いですが、強調したいときに加えます。
    example_gloss: 私は音楽が好きです。
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: どれ
    gloss: どれ
    note: کدوم は「どれ」「どちら」という意味です。
    example_gloss: どれが好きですか。
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: 音楽
    gloss: 音楽
    note: موسیقی は「音楽」という意味です。
    example_gloss: 私は音楽が好きです。
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: あなたは欲しい
    gloss: 欲しい
    note: می‌خوای は می‌خواهی(あなたは欲しい)の、口語のくだけた二人称の形です。
    target_text: می‌خوای(あなたは欲しい、くだけた形)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: どれが好きですか。
    gloss: どれが好きですか。
    note: کدوم رو دوست داری؟ では、رو が目的語を示し(書き言葉では را)、داری は داشتن(持つ)の二人称です。
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: もっと
    gloss: もっと
    note: بیشتر は「もっと」という意味です。
    example_gloss: コーヒーのほうが好きです。
  fa.a1.unit14.lesson03.teach.ya_word:
    title: または
    gloss: または
    note: یا は「または」という意味で、二つのものから選ぶときに使います。
    target_text: یا(または)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: コーヒーか紅茶か?
    gloss: コーヒーか紅茶か?
    note: قهوه یا چای؟ は、レッスン1で学んだ二つの飲み物から選ぶ質問です。
  fa.a1.unit14.lesson04.teach.choon_word:
    title: なぜなら
    gloss: なぜなら／～なので
    note: چون は理由を導きます。
    target_text: چون(なぜなら)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: おいしい
    gloss: おいしい
    note: خوشمزه‌ست は خوشمزه است(おいしい)の口語的な縮約形です。
    example_gloss: コーヒーはおいしいです。
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: おもしろい
    gloss: おもしろい
    note: جالبه は جالب است(おもしろい)の口語的な縮約形です。
    example_gloss: この音楽はおもしろいです。
  fa.a1.unit14.lesson04.teach.va_word:
    title: と
    gloss: と、そして
    note: '*و* は「そして」の意味で、好きだということとその説明のように、短い2つの文をつなげられます。理由を直接示す *چون*(なぜなら)よりもゆるやかなつながりです。'
    target_text: و(と、そして)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: サラ
    gloss: サラ
    note: イランでよくある女性の名前です。
    example_gloss: サラはお茶が好きです。
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: 彼/彼女は好きです
    gloss: 彼・彼女は好き
    note: داره は دارد(持つ)の口語の三人称の形です。دوست داره は「彼・彼女は好き」という意味で、一人称の دوست دارم と同じパターンです。
    target_text: دوست داره(彼・彼女は好き、口語の三人称)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: 彼/彼女は好きではありません
    gloss: 彼・彼女は好きではない
    note: نداره は口語の三人称の否定形です。دوست نداره は「彼・彼女は好きではない」という意味です。
    target_text: دوست نداره(彼・彼女は好きではない、口語の三人称)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: 温かい
    gloss: 温かい
    note: گرمه は گرم است(温かい)の口語的な縮約形です。
    example_gloss: お茶は温かいです。
  fa.a1.unit14.lesson05.teach.reading_text:
    title: 好みについての例文
    gloss: サラは温かいから、お茶が好きです。サラは音楽が好きではありません。
    note: この単元で学んだ好みの語彙を使った、三人称の短い説明です。
  fa.a1.unit14.lesson06.teach.names:
    title: ニマとサラ
    gloss: ニマ、サラ
    note: このコースを通してよく使うイランの名前です。
    example_gloss:
    - ニマは紅茶が好きです。
    - サラはコーヒーが好きです。
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: あなたは?
    gloss: あなたは?
    note: تو چی؟ は、同じ質問を相手に返すときによく使う短い言い方です。
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: すばらしい
    gloss: すばらしいです
    note: عالیه は عالی است(すばらしい)の口語的な短縮形です。
    example_gloss: これはすばらしいです。
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: ニマの質問
    gloss: 紅茶とコーヒー、どちらのほうが好きですか?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: サラが答える
    gloss: 私はコーヒーのほうが好きです。おいしいからです。あなたは?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: ニマの答え
    gloss: 私は紅茶が好きです。温かいからです。
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: サラの反応
    gloss: いいですね!
