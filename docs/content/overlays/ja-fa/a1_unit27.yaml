    gloss: うん
    note: '*آره* は「はい」を表す、日常会話でよく使う口語の言葉です。'
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: あなたは？
    gloss: あなたは？
    note: '*تو چی؟* がここでもう一度出てきます。同じ質問を相手に返すときに使います。*تو* だけで、くだけた「あなた」(君)という意味になります。'
  fa.a1.unit27.lesson06.teach.chekhoob_review:
