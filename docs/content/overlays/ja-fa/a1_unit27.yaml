  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: ニーマ：どんなスポーツが好きですか？
    gloss: どんなスポーツが好きですか？
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: サラ：私は水泳が好きです。毎週3回プールに行きます。あなたは？
    gloss: 私は水泳が好きです。毎週3回プールに行きます。あなたは？
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: ニーマ：私はサッカーが好きです。毎日公園に行ってプレーします。
    gloss: 私はサッカーが好きです。毎日公園に行ってプレーします。
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: サラ：いいですね！ジムにも行きますか？
    gloss: いいですね！ジムにも行きますか？
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: ニーマ：うん、ときどきジムにも行きます。
    gloss: うん、ときどきジムにも行きます。
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: サラ：すばらしい！
    gloss: すばらしい！
