teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: 私
    gloss: 私
    note: '*من*(私)はすでにおなじみの語で、ここでも自分のスポーツについて話すときに登場します。'
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: スポーツ/運動
    gloss: スポーツ/運動
    note: '*ورزش* は「スポーツ」や「運動」を表す一般的な語で、このユニット全体の中心になります。'
    example_gloss: 運動は体にいいです。
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: 私はします
    gloss: 私はします
    note: '*می‌کنم* は「する」という意味の動詞で、このユニットではスポーツをする・遊ぶと言うときに何度も使います。'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: サッカー
    gloss: サッカー
    note: '*فوتبال* は、このユニットで最初に登場するスポーツの名前です。'
    example_gloss: サッカーはスポーツです。
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: 私はサッカーをします
    gloss: 私はサッカーをします
    note: '*فوتبال بازی می‌کنم* は「私はサッカーをします」という意味です。*بازی* は「遊ぶ/試合」を意味します。'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: バスケットボール
    gloss: バスケットボール
    note: '*بسکتبال* は、バスケットボールを表す日常的な外来語です。'
    example_gloss: 私はバスケットボールが好きです。
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: 私はバスケットボールをします
    gloss: 私はバスケットボールをします
    note: '*بسکتبال بازی می‌کنم* は *فوتبال بازی می‌کنم* とまったく同じ型で、スポーツの名前を入れ替えるだけです。'
  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: バレーボール
    gloss: バレーボール
    note: '*والیبال* は、バレーボールを表す日常的な外来語です。'
    example_gloss: 彼/彼女はバレーボールが好きです。
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: 私はバレーボールをします
    gloss: 私はバレーボールをします
    note: '*والیبال بازی می‌کنم* も、サッカーやバスケットボールと同じ *بازی می‌کنم* の型を使います。'
  fa.a1.unit27.lesson02.teach.shena_word:
    title: 水泳
    gloss: 泳ぐこと
    note: '*شنا* は「水泳」という意味です。サッカー・バスケットボール・バレーボールと違い、球技ではないので *بازی می‌کنم* ではなく、*می‌کنم* と直接組み合わせます。'
    example_gloss: 私は水泳が好きです。
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: 私は泳ぎます
    gloss: 私は泳ぎます
    note: '*شنا می‌کنم* は「私は泳ぎます」という意味で、直訳すると「水泳をします」です。'
  fa.a1.unit27.lesson02.teach.che_review:
    title: 何
    gloss: 何
    note: '*چه* は、ここでは新しい疑問文のパターンで使われています。'
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: 好きですか
    gloss: 好きですか
    note: '*دوست داری* がここでもう一度出てきます。スポーツについてたずねるときに使います。'
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: どんなスポーツが好きですか？
    gloss: どんなスポーツが好きですか？
    note: '*چه ورزشی دوست داری؟* は、*چه* + *ورزش* + 「どの〜」を表す語尾 *-ی*(「どのスポーツ」になります)に、*دوست داری* を組み合わせた形です。相手に好きなスポーツをたずねる自然な言い方です。'
  fa.a1.unit27.lesson03.teach.koja_review:
    title: どこ
    gloss: どこ
    note: '*کجا* も同じように、スポーツをする場所をたずねるときに使います。'
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: どこで運動しますか？
    gloss: どこで運動しますか？
    note: '*کجا ورزش می‌کنی؟* は、*کجا* と *ورزش*、そして *می‌کنم* の2人称の形を組み合わせた文です。'
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: 行きます
    gloss: 行きます
    note: '*می‌رم* がここでもう一度出てきます。スポーツをする場所へ行くときに使います。'
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: ジム
    gloss: ジム
    note: '*باشگاه* は「ジム」や「クラブ」という意味です。第24課の *می‌رم سینما* と同じパターンで、前置詞は要らず、*می‌رم* + 場所だけで「〜に行きます」になります。'
    example_gloss: 私はジムに行きます。
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: プール
    gloss: プール
    note: '*استخر* は「水泳のプール」という意味です。'
    example_gloss: プールに行って泳ぎます。
  fa.a1.unit27.lesson03.teach.park_word:
    title: 公園
    gloss: 公園
    note: '*پارک* は「公園」を意味する外来語で、そのまま使われます。'
    example_gloss: 公園に行ってサッカーをします。
  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: 毎日
    gloss: 毎日
    note: '*هر روز* がここでもう一度出てきます。スポーツをする頻度を表します。'
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: 毎週
    gloss: 毎週
    note: '*هر هفته* がここでもう一度出てきます。'
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: ときどき
    gloss: 時々
    note: '*گاهی* がここでもう一度出てきます。'
  fa.a1.unit27.lesson04.teach.baar_word:
    title: 〜回
    gloss: 〜回
    note: '*بار* は「〜回」を表す助数詞で、数字と一緒に使って頻度を言います。'
    example_gloss: 1回運動します。
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: 2 / 3
    gloss: 2 / 3
    note: '*دو* と *سه* は、ここでは回数を数えるために使われています。'
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: 2回
    gloss: 2回
    note: '*دو بار* は *دو*(2)と *بار* を組み合わせた形で、「2回」という意味です。'
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
