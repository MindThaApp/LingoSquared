  fa.a1.unit27.lesson06.teach.miri_word:
    title: あなたは行きます
    gloss: あなたは行きます
    note: '*می‌ری* は、第3課の *می‌رم*(私は行きます)や第5課の *می‌ره*(彼/彼女は行きます)と同じ動詞の、くだけた2人称の形です。'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: すばらしい
    gloss: すばらしい
    note: '*عالیه* は「すばらしい」「最高」を表す、よく使われる口語表現です。'
