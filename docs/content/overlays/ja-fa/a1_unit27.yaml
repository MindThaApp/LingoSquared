course:
  title: ペルシア語 A1
  description: 初級イランペルシア語：スポーツ(サッカー、バスケットボール、バレーボール、水泳)の言い方、「どんなスポーツが好きですか？」の尋ね方、スポーツをする場所(ジム、プール、公園)の言い方、頻度(毎日、毎週、ときどき、~回)の言い方を学びます。また、نیما のスポーツの習慣についての短い読み物と、نیما と سارا がそれぞれどんなスポーツをどのくらいの頻度でどこでするかを話し合う締めくくりの会話も収録しています。
