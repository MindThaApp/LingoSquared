    title: 読み物：ニーマのスポーツ
    gloss: ニーマはスポーツが好きです。毎週3回サッカーをします。ときどきプールにも行って泳ぎます。
    note: この読み物では、第1〜4課で学んだ表現と、第5課の *می‌ره* をすべて使っています。新しい単語はほとんどなく、文章の中で見て理解する練習です。
  fa.a1.unit27.lesson06.teach.dam_review:
    title: 私は持っている・好きです
    gloss: 私は持っている・好きです
    note: '*دارم* がここでもう一度出てきます。'
  fa.a1.unit27.lesson06.teach.are_review:
