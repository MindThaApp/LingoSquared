course:
  title: ペルシア語 A1
  description: 初級イラン・ペルシア語:食べ物と飲み物の語彙、レストランでの丁寧な注文、メニューやおすすめの尋ね方、数量の言い方、会計の頼み方などレストランのマナー。
units:
  fa.a1.unit06.food:
    title: 食べ物と食事の注文
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: 食べ物と飲み物
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: 丁寧に注文する
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: メニューとおすすめを尋ねる
  fa.a1.unit06.lesson04.quantities:
    title: 数量を指定して注文する
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: レストランのマナーと会計
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: レストランでの会話まるごと
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: パン
    gloss: パン
    note: نان はイランの食事に欠かせない主食で、平たいパンがほとんどどんな料理にも添えられます。
    example_gloss: 私はパンが好きです。
  fa.a1.unit06.lesson01.teach.berenj:
    title: 米、ご飯
    gloss: 米、ご飯
    note: برنج はイランのほとんどのメイン料理の中心です。
    example_gloss: ご飯と鶏肉はおいしいです。
  fa.a1.unit06.lesson01.teach.morgh:
    title: 鶏肉
    gloss: 鶏肉
    note: مرغ は鳥そのものと、その肉の両方を指します。
    example_gloss: 私は鶏肉を食べます。
  fa.a1.unit06.lesson01.teach.ab:
    title: 水
    gloss: 水
    note: آب は水を表す一般的な単語です。
    example_gloss: 水がほしいです。
  fa.a1.unit06.lesson01.teach.chai:
    title: 紅茶
    gloss: お茶
    note: چای はイランのほとんどどこでも出される定番の飲み物で、第1課のタアロフのレッスンでも出てきました。
    example_gloss: お茶を1つお願いします。
  fa.a1.unit06.lesson01.teach.ghahve:
    title: コーヒー
    gloss: コーヒー
    note: قهوه は、お茶と並んでイランの都市部でだんだん一般的になっています。
    example_gloss: コーヒーは熱いです。
  fa.a1.unit06.lesson01.teach.mive:
    title: 果物
    gloss: 果物
    note: میوه はどんな果物にも使える一般的な言葉です。
    example_gloss: 私は果物が好きです。
  fa.a1.unit06.lesson01.teach.va_ya:
    title: と/または
    gloss: و(~と)、یا(または)
    note: どちらも、注文で食べ物や飲み物をつなぐときによく使う接続の言葉です。
    target_text: و(〜と)、یا(または)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: 丁寧にお茶を頼む
    gloss: お茶をお願いしたいのですが。
    note: می‌خواستم は文字どおりには「欲しい」の過去形ですが、丁寧でやわらかい依頼として使われます。初対面の店員や店主に対して自然な言い方です。
  fa.a1.unit06.lesson02.teach.lotfan:
    title: お願いします
    gloss: お願いします
    note: لطفاً は、ほとんどどんな依頼にも付けてやわらかくできます。
    example_gloss: 手伝ってください。
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: くだけた言い方でお茶を頼む
    gloss: お茶がほしい。
    note: یه چای می‌خوام は、くだけた話し言葉の یه(1つの)と می‌خوام(ほしい)を使っています。親しい友人や家族に使い、会ったばかりの店員には使わないでください。
  fa.a1.unit06.lesson02.teach.register_note:
    title: 注文の動詞の使い分け
    gloss: 知らない人や店員には می‌خواستم、親しい友人にだけ می‌خوام を使います。
    note: これは、第1課のあいさつで学んだ丁寧さの使い分けを、注文に当てはめたものです。
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: 丁寧にパンを頼む
    gloss: パンをお願いしたいのですが。
    note: 食べ物や飲み物の名詞なら、どれも同じ می‌خواستم の型が使えます。
  fa.a1.unit06.lesson03.teach.menu_word:
    title: メニュー
    gloss: メニュー
    note: منو は外来語で、日本語の「メニュー」と同じように使います。
    example_gloss: メニューをお願いします。
  fa.a1.unit06.lesson03.teach.menu_question:
    title: メニューを頼む
    gloss: メニューはありますか?
    note: منو دارید؟ は文字どおり「メニューはありますか」という意味で、メニューをもらうときの普通の言い方です。
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: おすすめを尋ねる
    gloss: おすすめは何ですか?
    note: چی توصیه می‌کنید؟ は、店員にたずねる自然でよく使う質問です。
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: 店員があなたに尋えること
    gloss: 何になさいますか?
    note: چی میل دارید؟ は、店員が注文を聞くときの丁寧で標準的な言い方です。
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: チキンケバブ
    gloss: チキンケバブ
    note: جوجه‌کباب(味付けした鶏肉の網焼き)は、イランのメニューで最もよく見る料理の一つです。
    example_gloss: チキンケバブを注文します。
  fa.a1.unit06.lesson03.teach.khoobe:
    title: 店員が料理をすすめる
    gloss: 今日はチキンケバブがとてもおいしいですよ。
    note: خوبه は خوب است の話し言葉の短い形で、店員が気軽におすすめするときに自然です。
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: はい、どうぞ
    gloss: はい、どうぞ。
    note: بله は「はい」の意味です。بفرمایید(第1課のタアロフのレッスンで登場)は、ここでもメニューなどを人に渡すときに使います。
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: お茶1杯
    gloss: お茶1杯
    note: لیوان(グラス)は、グラスで出される飲み物を数えるときの助数詞です。
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: パン2枚
    gloss: パン2枚
    note: تا は、ふつうの数えられるものを数えるとき、数字の後ろに置く助数詞です。ここではパン2枚を表します。
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: ご飯1皿
    gloss: ご飯1皿
    note: بشقاب(皿)は、皿に盛った料理を数えるときの助数詞です。
  fa.a1.unit06.lesson04.teach.combined_order:
    title: 注文をまとめて言う
    gloss: ご飯1皿とパン2枚をお願いします。
    note: 数量の表現は、و(~と)でつないで1回の注文にまとめられます。
  fa.a1.unit06.lesson04.teach.se_ta:
    title: 助数詞 تا
    gloss: تا は、数えられるものの数字の後ろに付きます:دو تا(2つ)、سه تا(3つ)。
    note: これは第3課で数字と一緒に学んだ数え方と同じで、ここでは食べ物の注文に使っています。
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: お会計
    gloss: お会計
    note: صورت‌حساب は、レストランの会計を表す標準的な言葉です。
    example_gloss: お会計をお願いします。
  fa.a1.unit06.lesson05.teach.bill_request:
    title: 会計を頼む
    gloss: お会計をお願いできますか?
    note: صورت‌حساب رو لطف می‌کنید؟ は、レストランで会計を頼む丁寧で自然な言い方です。
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: 料理がおいしかったと伝える
    gloss: とてもおいしかったです。
    note: خیلی خوشمزه بود は、食後に店員や招いてくれた人に言う自然なほめ言葉です。
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: 召し上がれ
    gloss: 召し上がれ
    note: نوش جان は、食べている人や食べようとしている人に言う言葉です。食べる本人が自分の料理について言うことはありません。
  fa.a1.unit06.lesson05.teach.chashm:
    title: 店員の丁寧な応答
    gloss: すぐお持ちします。
    note: چشم، الان میارم は、店の人が依頼を丁寧に受けて、すぐ持ってくると伝える言い方です。
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: レストラン
    gloss: レストラン
    note: رستوران はレストランを表す一般的な言葉で、この課の会話の舞台です。
    example_gloss: このレストランはいいです。
  fa.a1.unit06.lesson06.teach.turn01:
    title: 店員が客を迎える
    gloss: 店員が客を迎えて、何にするか尋ねます。
    note: چی میل دارید؟ は、レッスン3で学んだ丁寧な最初の質問と同じです。
  fa.a1.unit06.lesson06.teach.turn02:
    title: 客がメニューを頼む
    gloss: 客が店員にあいさつして、メニューを頼みます。
    note: منو دارید؟ で注文のやりとりが始まります。
  fa.a1.unit06.lesson06.teach.turn03:
    title: 店員がメニューを渡す
    gloss: 店員が応じて、メニューを渡します。
    note: بفرمایید は第1課で学んだ丁寧に差し出す言葉と同じで、ここでは人に物を渡すときに使っています。
  fa.a1.unit06.lesson06.teach.turn04:
    title: 客がおすすめを尋ねる
    gloss: 客が店員におすすめを尋ねます。
    note: چی توصیه می‌کنید؟ はレッスン3で出てきた表現です。
  fa.a1.unit06.lesson06.teach.turn05:
    title: 店員が料理をすすめる
    gloss: 店員が、今日はチキンケバブがとてもおいしいと言います。
    note: جوجه‌کباب امروز خیلی خوبه では、おすすめの話し言葉で自然な、くだけた خوبه が使われています。
  fa.a1.unit06.lesson06.teach.turn06:
    title: 客がひととおり注文する
    gloss: お客さんは同意して、チキンケバブのライス添えとお茶を注文します。
    note: ここでは、客が個人的に知らないウェイターに対して丁寧な می‌خواستم が使われています。
  fa.a1.unit06.lesson06.teach.turn07:
    title: ウェイターが注文を受ける
    gloss: ウェイターは、すぐにお持ちしますと言います。
    note: چشم، الان میارم はレッスン5で学びました。
  fa.a1.unit06.lesson06.teach.turn08:
    title: お客さんが料理をほめて、お会計をお願いする
    gloss: お客さんは、とてもおいしかったと言って、お会計をお願いします。
    note: どちらの表現もレッスン5の語彙をそのまま使っています。
  fa.a1.unit06.lesson06.teach.turn09:
    title: ウェイターがお会計を持ってくる
    gloss: ウェイターは承知して、すぐにお持ちしますと言います。
    note: البته(もちろん)は、ここで自然な丁寧な肯定の返事です。
exercises:
