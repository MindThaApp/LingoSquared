    distractors:
    - نان
    - برنج
    - مرغ
    accepted_answers:
    - value: چای
      status: correct
    feedback: چای(お茶)は飲み物で、ほかは食べ物です。
  fa.a1.unit06.lesson01.exercise03.recognize_naan_reading:
