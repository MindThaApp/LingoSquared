        آب: 水
        چای: お茶
        قهوه: コーヒー
        میوه: 果物
      status: correct
    feedback: この7つの単語で、このユニットの基本的な食べ物と飲み物の語彙がそろいます。
    pairs:
    - left: نان
      right: パン
    - left: برنج
      right: 米、ご飯
    - left: مرغ
      right: 鶏肉
    - left: آب
      right: 水
    - left: چای
      right: お茶
    - left: قهوه
      right: コーヒー
    - left: میوه
      right: 果物
  fa.a1.unit06.lesson01.exercise05.order_food_word:
    instruction: 単語を並べ替えて「パンとご飯と鶏肉」と言いましょう。
    accepted_answers:
    - value:
      - نان
      - و
      - برنج
      - و
      - مرغ
      status: correct
    feedback: نان و برنج و مرغ は、3つの食べ物を و でつないで並べています。
  fa.a1.unit06.lesson01.exercise06.translate_fruit:
    instruction: ペルシア語に訳しましょう:果物
    accepted_answers:
    - value: میوه
      status: correct
    feedback: میوه は「果物」という意味です。
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: 好きな飲み物(お茶またはコーヒー)をペルシア語で書きましょう。
    accepted_answers:
    - value: چای
      status: correct
    - value: قهوه
      status: correct
    feedback: چای も قهوه もどちらも正解です。
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: このフレーズはどんな意味ですか?
    correct_option: お茶を一 ついただきたいのですが。(丁寧)
    distractors:
    - お茶がほしい。(くだけた言い方)
    - お茶はありますか?
    - お茶はおいしいです。
    accepted_answers:
    - value: お茶を一 ついただきたいのですが。(丁寧)
      status: correct
    feedback: می‌خواستم は、よく知らない相手に注文するときの丁寧な形です。
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام は、次のうち誰に言うのがふさわしいですか?
    correct_option: 家でお茶をいれている親しい友人
    distractors:
    - 会ったばかりのウェイター
    - 知らない店の人
    - 正式な夕食会の目上の人
    accepted_answers:
    - value: 家でお茶をいれている親しい友人
      status: correct
    feedback: می‌خوام はくだけた口語で、親しい間柄でだけ使います。
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: このフレーズはどんな意味ですか?
    correct_option: お茶を一ついただきたいのですが、お願いします。(丁寧)
    distractors:
    - お茶がほしい。(くだけた言い方)
    - メニューはありますか?
    - おすすめは何ですか?
    accepted_answers:
    - value: お茶を一ついただきたいのですが、お願いします。(丁寧)
      status: correct
    feedback: یک چای می‌خواستم، لطفاً は「お茶を一ついただきたいのですが、お願いします」(丁寧)という意味です。
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: 注文の動詞それぞれを、使う場面と結びつけましょう。
    accepted_answers:
    - value:
        می‌خواستم: 〜したいのですが(丁寧)
        می‌خوام: 〜がほしい、〜したい(くだけた言い方)
      status: correct
    feedback: 2つの形は丁寧さが違うだけで、注文する内容は同じです。
    pairs:
    - left: می‌خواستم
      right: 〜したいのですが(丁寧)
    - left: می‌خوام
      right: 〜がほしい、〜したい(くだけた言い方)
  fa.a1.unit06.lesson02.exercise05.order_polite_naan:
    instruction: 単語を並べ替えて、丁寧にパンを注文しましょう。
    accepted_answers:
    - value:
      - یک
      - نان
      - می‌خواستم
      status: correct
    feedback: یک نان می‌خواستم は、丁寧にパンを注文する言い方です。
  fa.a1.unit06.lesson02.exercise06.translate_informal_order:
    instruction: ペルシア語に訳しましょう:お茶がほしい。(くだけた言い方)
    accepted_answers:
    - value: یه چای می‌خوام
      status: correct
    - value: من یه چای می‌خوام
      status: correct
    - value: یک چای می‌خوام
      status: correct
    - value: یه چای می‌خوام.
      status: correct
    feedback: یه چای می‌خوام は「お茶がほしい」(くだけた言い方)という意味です。
  fa.a1.unit06.lesson02.exercise07.translate_polite_water:
