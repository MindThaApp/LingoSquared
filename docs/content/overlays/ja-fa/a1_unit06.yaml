      status: correct
    - value: یک آب می‌خواستم، لطفاً
      status: correct
    - value: یه آب می‌خواستم لطفاً
      status: correct
    - value: یه آب می‌خواستم، لطفاً
      status: correct
    - value: یک آب لطفاً
      status: correct
    feedback: یک آب می‌خواستم لطفاً は、丁寧にお水を注文する言い方です。
  fa.a1.unit06.lesson02.exercise08.speak_order:
    instruction: 初めて会うウェイターに注文します。丁寧にコーヒーをお願いしましょう。
    accepted_answers:
    - value: یک قهوه می‌خواستم لطفاً
      status: correct
    - value: یک قهوه می‌خواستم
      status: correct
    - value: یک قهوه می‌خواستم، لطفاً
      status: correct
    - value: یه قهوه می‌خواستم
      status: correct
    - value: یه قهوه می‌خواستم لطفاً
      status: correct
    - value: یه قهوه می‌خواستم، لطفاً
      status: correct
    - value: یک قهوه لطفاً
      status: correct
    feedback: می‌خواستم は、知らないウェイターに対して適切な丁寧さの形です。
  fa.a1.unit06.lesson03.exercise01.recognize_menu_question:
    instruction: この質問は何を尋ねていますか。
    correct_option: メニューはありますか?
    distractors:
    - おすすめは何ですか?
    - 何になさいますか?(店員が尋ねる)
    - お会計をお願いできますか?
    accepted_answers:
