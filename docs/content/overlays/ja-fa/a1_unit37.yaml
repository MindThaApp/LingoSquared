course:
  title: ペルシア語 A1
  description: 初級のイランのペルシア語:身の回りの物(果物、家具、ペット、本、家)の色を言ったり説明したりすること、物の色をたずねること、そして二人の友達の好きな色を比べる会話を学びます。
