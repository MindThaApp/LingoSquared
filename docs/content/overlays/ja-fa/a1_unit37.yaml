    gloss: ピンク色
    note: '*صورتی* はピンク色のものを表します。'
    example_gloss: 私のシャツはピンク色です。
  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: 学習済みの色:白 / 黒 / 赤 / 青 / 緑 / 茶色
    gloss: 色 / 白 / 黒 / 赤 / 青 / 緑 / 茶色
    note: '*رنگ*(「色」)、*سفید*、*سیاه*、*قرمز*、*آبی* は服のユニットで、*سبز* と *قهوه‌ای* は外見のユニットで学習済みです。このユニットでは、これらをあらためて教えることなくそのまま使います。'
    target_text: رنگ (色) / سفید (白) / سیاه (黒) / قرمز (赤) / آبی (青) / سبز (緑) / قهوه‌ای (茶色) -- 前のユニットで学習済み
  fa.a1.unit37.lesson02.teach.banafsh:
    title: 紫色
    gloss: 紫色
    note: '*بنفش* は紫色のものを表します。'
    example_gloss: 私の本は紫色です。
  fa.a1.unit37.lesson02.teach.khakestari:
    title: 灰色
    gloss: 灰色
    note: '*خاکستری* は灰色のものを表します。'
    example_gloss: テーブルは灰色です。
  fa.a1.unit37.lesson02.teach.review_negation:
    title: 車は黒ではなく、白です
    gloss: 車は黒ではなく、白です。
    note: '*نیست* は、感情のユニットで学習済みの縮約形のコピュラの否定形で、性格のユニットの *تنبل نیست*(「彼/彼女は怠け者ではない」)と同じ型です。'
    target_text: ماشین سیاه نیست، سفیده. (車は黒ではなく、白です。)
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: それは何色ですか?
    gloss: それは何色ですか?
    note: '*رنگش* は *رنگ*(「色」)に所有を表す接尾辞 *ش*(「その」)がついた形で、*شخصیتش*/*موهاش*/*چشماش* と同じ型です。*چیه؟*(「何ですか?」)は、自己紹介のユニットですでに学習しています(*اسم شما چیه؟*)。'
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: それは何色ですか?(別の言い方)
    gloss: それは何色ですか?
    note: '*چه رنگیه؟* は、同じ質問をするもう一つの同じくらいよく使う言い方で、性格のユニットの *چه جوریه؟* と同じ型です。'
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
    title: 私の車の色は青です
    gloss: 私の車の色は青です。
    note: '*ماشینم* は *ماشین*(「車」)に所有を表す接尾辞 *م*(「私の」)がついた形で、*اسمم*/*پدرم* と同じ型です。'
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: 物の色をたずねる2つの言い方
    gloss: それは何色ですか? / それは何色ですか?
    note: '*رنگش چیه؟* と *چه رنگیه؟* はどちらも同じ質問で、くだけた会話では入れ替えて使えます。'
    target_text: رنگش چیه؟ (それは何色ですか? -- ش は「その」を表す接尾辞で、شخصیتش/موهاش/چشماش と同じ) / چه رنگیه؟ (別の言い方で、چه جوریه؟ と同じ型)
  fa.a1.unit37.lesson04.teach.ketabet:
    title: あなたの本は何色ですか?
    gloss: あなたの本は何色ですか?
    note: '*کتابت* は *کتاب*(「本」)にくだけた所有の接尾辞 *ت*(「あなたの」)がついた形で、性格のユニットの *شخصیتت* と同じ、*تو* に対するくだけた言い方の型です。'
  fa.a1.unit37.lesson04.teach.mashinet:
    title: あなたの車は何色ですか?
    gloss: あなたの車は何色ですか?
    note: '*ماشینت* は *ماشین*(「車」)に同じくだけた所有の接尾辞 *ت* がついた形です。'
  fa.a1.unit37.lesson04.teach.review_dislike_like:
    title: 私は青い色が好きです
    gloss: 青色が好きです。
    note: '*دوست دارم*(「好きです」)と *رو*(目的語を示す語)は、好みのユニットで学習済みです。'
    target_text: رنگ آبی رو دوست دارم. (青色が好きです。)
  fa.a1.unit37.lesson04.teach.dialogue_line1:
    title: ニーマ:サーラ、あなたの本は何色?
    gloss: サーラ、あなたの本は何色?
  fa.a1.unit37.lesson04.teach.dialogue_line2:
    title: サーラ:紫だよ。あなたの車は何色?
    gloss: 紫だよ。あなたの車は何色?
  fa.a1.unit37.lesson04.teach.dialogue_line3:
    title: ニーマ:青だよ。青色が大好きなんだ。
    gloss: 青だよ。青色が大好きなんだ。
  fa.a1.unit37.lesson04.teach.dialogue_line4:
    title: サーラ:私も紫色が好き。
    gloss: 私も紫色が好き。
  fa.a1.unit37.lesson04.teach.dialogue_line5:
    title: ニマ:いいね!
    gloss: いいね!
  fa.a1.unit37.lesson05.teach.roo_word:
    title: 〜の上/上に
    gloss: 〜の上に
    note: '*روی* は「〜の上に」という意味で、この課で新しく出てくる前置詞です。'
    target_text: روی (〜の上に / 〜の上)
  fa.a1.unit37.lesson05.teach.reading_text:
    title: 読み物:私の家
    gloss: 私の家は白いです。家の中に灰色のテーブルがあります。テーブルの上に赤い本と黄色い本があります。私の猫もそこにいます。オレンジ色です。
    note: 家の中にあるいろいろな身近な物の色を述べた文章です。
  fa.a1.unit37.lesson05.teach.reading_note:
    title: 〜がある
    gloss: あります
    note: '*هست* は「ある・存在する」という意味で、場所の課の道案内の会話(*یه رستوران هست*「レストランがあります」)ですでに出てきました。'
  fa.a1.unit37.lesson06.teach.self_color_preference:
    title: 私は青色がとても好きです
    gloss: 私は青色がとても好きです。
    note: これまでの課で習った単語だけを使った、復習用の文です。
  fa.a1.unit37.lesson06.teach.ask_favorite_color:
    title: 何色が好きですか?
    gloss: 何色が好きですか?
    note: '*چه رنگی*(「何色」)+ *دوست داری*(2人称の「あなたは好きだ」。好みの課の *کدوم رو بیشتر دوست داری؟* ですでに出てきました)。'
  fa.a1.unit37.lesson06.teach.review_all_colors:
    title: 黄色/オレンジ色/ピンク/紫/灰色 -- この課の新しい5つの色
    gloss: 黄色/オレンジ色/ピンク/紫/灰色
    note: この課で学ぶ、5つの新しい色の単語です。
