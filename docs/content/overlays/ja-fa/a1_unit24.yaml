    gloss: 私は映画を見るのが好きです。毎週映画館に行きます。あなたはどうですか?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: ニーマ:私は本を読むのが好きです…
    gloss: 私は本を読むのが好きです。ときどきサッカーもします。
