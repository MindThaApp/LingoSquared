    note: '*دوست دارم* は、物のときも活動のときも同じように使えます。*کتاب خوندن دوست دارم* は「私は本を読むのが好きです」という意味です。'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: 音楽
    gloss: 音楽
    note: '*موسیقی* がここでもう一度出てきます。'
