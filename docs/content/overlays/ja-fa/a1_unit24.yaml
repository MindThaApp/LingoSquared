    title: 聴きます
    gloss: 聴きます
    note: '*گوش می‌دم* は直訳すると「耳を与える」という意味で、ペルシア語で「聞く」を表す自然な言い方です。'
  fa.a1.unit24.lesson02.teach.film_review:
    title: 映画
    gloss: 映画
    note: '*فیلم* がここでもう一度出てきます。'
