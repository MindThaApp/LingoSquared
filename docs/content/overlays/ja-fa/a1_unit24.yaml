course:
  title: ペルシア語 A1
  description: イラン・ペルシア語の初級:趣味・自由な時間という概念、日常の4つの活動(読書、音楽を聞く、映画を見る、スポーツ・サッカー)、それをどれくらいの頻度でするかの話し方、自由な時間に何をしているか相手に尋ねる表現、ニーマの趣味についての短い読み物、そしてニーマとサーラの最後の会話。
