teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: 彼/彼女
    gloss: 彼/彼女
    note: '*او* は、ここでも外見を描写する文の主語として出てきます。'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: 身長
    gloss: 身長
    note: '*قد* がここでまた出てきます。*قدش* は所有を表す接尾辞 *-ش*(彼/彼女の身長)が付いた形で、ユニット20の *امتحانش* と同じ作り方です。'
    example_gloss: ニマは背が高いです。
  fa.a1.unit25.lesson01.teach.boland_word:
    title: 背が高い
    gloss: 背が高い
    note: '*بلند* は「高い」「長い」という意味です。*قدش بلنده* は直訳すると「彼/彼女の身長は高い」で、人の背が高いことを言う自然な口語表現です。'
    example_gloss: 彼は背が高いです。
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: 背が低い
    gloss: 背が低い
    note: '*کوتاه* は「低い」「短い」という意味です。'
    example_gloss: 彼は背が低いです。
  fa.a1.unit25.lesson02.teach.mo_word:
    title: 髪
    gloss: 髪
    note: '*مو* は「髪」という意味です。*موی* は形容詞の前で使うエザーフェ(連結)の形で、*موی بلند*(長い髪)のように使います。'
    example_gloss: 彼は髪が長いです。
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: 彼/彼女の髪
    gloss: 彼/彼女の髪
    note: '*موهاش* は複数形の *موها*(髪の毛)に所有の接尾辞 *-ش* が付いた形で、「彼/彼女の髪」という意味です。'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: 黒
    gloss: 黒い
    note: '*مشکی* は髪や目の黒を言うときの日常的な口語の言葉です。ユニット20の *سیاه* は服などに合う言葉で、髪にはこちらのほうが自然です。'
    example_gloss: 彼女の髪は黒いです。
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: ブロンド
    gloss: ブロンドの
    note: '*بلوند*(外来語)は「ブロンドの」という意味です。'
    example_gloss: 彼女の髪はブロンドです。
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: 目
    gloss: 目
    note: '*چشم* は「目」という意味です。*چشمای* は口語の複数形+エザーフェの形(〜の目)で、*چشمای آبی*(青い目)のように使います。'
    example_gloss: 彼は茶色い目をしています。
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: 彼/彼女の目
    gloss: 彼/彼女の目
    note: '*چشماش* は口語の複数形 *چشما* に所有の接尾辞 *-ش* が付いた形で、「彼/彼女の目」という意味です。*چشماش آبیه* では *چشما* が複数なのに単数の語尾 *-ه* が付いていますが、これはペルシア語では普通のことで、人以外の複数のものは単数の動詞で受けるのがふつうです。'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: 茶色
    gloss: 茶色の
    note: '*قهوه‌ای*(直訳は「コーヒー色の」)は「茶色の」という意味です。'
    example_gloss: 彼女の目は茶色です。
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: 緑
    gloss: 緑の
    note: '*سبز* は「緑の」という意味です。'
    example_gloss: 彼女の目は緑です。
  fa.a1.unit25.lesson03.teach.abi_review:
    title: 青い
    gloss: 青い
    note: '*آبی* が、目の色を言うときにここでまた出てきます。'
    example_gloss: 彼女の目は青いです。
  fa.a1.unit25.lesson04.teach.man_review:
    title: 私
    gloss: 私
    note: すでによく知っている *من* が、自分の外見を話すときにここでまた出てきます。
    example_gloss: 私は茶色い髪です。
  fa.a1.unit25.lesson04.teach.daram_review:
    title: 私は持っている/彼・彼女は持っている
    gloss: 私は持っている/彼・彼女は持っている
    note: '*دارم*/*داره* は身体の特徴にも同じように使います。*موی مشکی دارم* は「私は黒い髪です」という意味です。'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: めがね
    gloss: めがね
    note: '*عینک* は「めがね」という意味です。'
    example_gloss: 彼はめがねをかけています。
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: 彼/彼女がかける
    gloss: 彼/彼女がかける
    note: '*می‌زنه*(直訳は「打つ」)は、めがねをかけるときに使う自然な動詞です。*عینک می‌زنه* は「めがねをかけている」という意味で、ユニット8・ユニット24の *می‌کنم*(する・作る)とは別の動詞です。'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: 彼/彼女はどんな外見ですか?
    gloss: 彼/彼女はどんな外見ですか?
    note: '*چه شکلیه؟* は直訳すると「どんな形ですか?」で、人の外見をたずねるときの標準的な口語表現です。'
  fa.a1.unit25.lesson04.teach.va_review:
    title: 〜と
    gloss: 〜と、そして
    note: '*و* は「〜と」「そして」という意味で、ユニット14・ユニット24ですでに出てきました。'
    example_gloss: 彼は背が高くて、髪が黒いです。
  fa.a1.unit25.lesson05.teach.nima_review:
    title: ニマ
    gloss: ニマ
    note: '*نیما* はユニット11で登場した人物で、ここでまた出てきます。'
    example_gloss: ニマはサラの友達です。
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 読み物:ニマの外見
    gloss: ニマは背が高いです。髪は黒く、目は茶色です。めがねをかけています。
    note: この読み物は、レッスン1〜4の表現をすべて使っています。新しい単語はほとんどなく、文章の中で見分ける練習です。
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: マリヤム
    gloss: マリヤム
    note: '*مریم* は新しい登場人物で、سارا の友達です。نیما はまだ会ったことがありません。'
    example_gloss: マリヤムはサラの友達です。
  fa.a1.unit25.lesson06.teach.alan_review:
    title: 今
    gloss: 今
    note: '*الان* がここでまた出てきます。'
    example_gloss: マリヤムはもうすぐ来ます。
  fa.a1.unit25.lesson06.teach.miad_word:
    title: 来る
    gloss: 来る
    note: '*میاد* は *آمدن*(来る)の口語の現在形です。'
    example_gloss: マリヤムはもうすぐ来ます。
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: 何色ですか?
    gloss: 何色ですか?
    note: '*چه رنگیه؟* は *چه*(何、レッスン4)と、*رنگ* に *-ی* が付いた *رنگی*(〜色の)、そして *-ه*(〜です)が組み合わさった形で、「何色ですか?」という意味です。'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: わかりました、ありがとう
    gloss: わかりました、ありがとう
    note: すでに学んだ *باشه* と *ممنون* を組み合わせた、会話を締めくくる自然な一言です。
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: サラ:マリヤムはもうすぐ来ます。
    gloss: マリヤムはもうすぐ来ます。
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: ニマ:マリヤムはどんな人ですか?
    gloss: マリヤムはどんな外見ですか?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: サラ:背が高くて、髪は黒いです。
    gloss: 背が高くて、髪は黒いです。
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: ニマ:目は何色ですか?
    gloss: 目は何色ですか?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: サラ:目は茶色です。
    gloss: 目は茶色です。
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: ニマ:わかりました、ありがとう。
    gloss: わかりました、ありがとう。
