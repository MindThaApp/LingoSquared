teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: La música
    gloss: música
    note: Un tema habitual para hablar de gustos; es fácil de reconocer porque se parece mucho a la palabra española.
    example_gloss: Me gusta la música.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: Con lubić (gustar) + complemento, muzyka cambia a muzykę, igual que kawa cambia a kawę. Lubię muzykę, no Lubię muzyka.
    note: 'Es el mismo patrón que ya conoces: *muzyka* pasa a *muzykę* como complemento de *lubię*, igual que *kawa* pasa a *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Te gusta
    gloss: te gusta (informal, ty)
    note: 'La forma de «ty» de lubić: la pieza necesaria para preguntar directamente a un amigo si le gusta algo.'
    example_gloss: ¿Te gusta la música?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (gustar): lubię (yo), lubisz (tú), lubi (él/ella). Ya conoces lubię y lubi; lubisz es la forma nueva, para la persona con la que hablas.'
    note: '*Lubię* y *lubi* ya te resultan familiares; *lubisz* completa la forma de «tú» del mismo verbo.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: ¿Te gusta la música?
    gloss: ¿Te gusta la música?
    note: 'Czy abre una pregunta de sí/no: es la forma natural de preguntar a un amigo por una preferencia.'
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Sí, me gusta.
    gloss: Sí, me gusta.
    note: 'Una respuesta corta y natural: no hace falta repetir la palabra muzykę.'
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: No, no me gusta.
    gloss: No, no me gusta.
    note: 'Nie, nie lubię parece repetido, pero no es un error: el primer nie responde a la pregunta y el segundo niega lubię.'
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Respuestas cortas
    gloss: 'Respuesta corta: Tak, lubię. / Nie, nie lubię. -- no hace falta repetir la palabra muzykę, porque la pregunta ya deja claro de qué se habla.'
    note: 'Igual que *Pyszny?* puede ir solo, *Tak, lubię.* no necesita repetir de qué hablas: el contexto ya lo dice.'
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Me gusta mucho la música
    gloss: Me gusta mucho la música.
    note: Bardzo (mucho / muy) refuerza una preferencia simple; ya lo has visto desde la primera unidad.
  pl.a1.unit13.lesson02.teach.wole:
    title: prefiero
    gloss: prefiero
    note: Un verbo totalmente nuevo en esta unidad, woleć (preferir); aquí solo se enseña la forma de «yo», igual que lubię.
    example_gloss: Prefiero el té.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: solo wolę en esta unidad'
    gloss: 'Woleć (preferir): wolę (yo) -- esta lección solo enseña la forma de «yo», igual que lubię. Wolę kawę. = Prefiero el café.'
    note: Por ahora solo la forma *ja* (yo) de *woleć*, con el mismo alcance que tuvo *lubię* al presentarse.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Café y té, otra vez
    gloss: 'Wolę + complemento: kawa pasa a kawę, herbata pasa a herbatę -- el mismo patrón que ya conoces.'
    note: 'El mismo patrón de acusativo de antes, solo con un verbo nuevo: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Prefiero el café
    gloss: Prefiero el café.
    note: Una forma sencilla de expresar una preferencia con wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Prefiero el té
    gloss: Prefiero el té.
    note: El mismo patrón con herbatę en lugar de kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy como «o»
    gloss: 'El czy de Kawa czy herbata? no es el mismo czy que abre una pregunta de sí/no: aquí une dos opciones, como «o» en español. Kawa czy herbata? = ¿Café o té?'
    note: 'Ojo: *czy* suele abrir una pregunta de sí/no, pero entre dos sustantivos como aquí significa simplemente «o».'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: ¿Café o té?
    gloss: ¿Café o té?
    note: Una forma corta y natural de ofrecer una elección.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Yo también
    gloss: yo también
    note: Una forma corta de mostrar acuerdo con lo que alguien acaba de decir.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, otra vez
    gloss: Ja też significa «yo también»; ya lo conoces de la lección sobre la rutina (Ja też wstaję o siódmej, «yo también me levanto a las siete»).
    note: Un breve recordatorio de que esta expresión ya apareció antes.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? no necesita verbo
    gloss: 'Igual que Pyszny? de la unidad anterior, la pregunta corta Kawa czy herbata? no necesita verbo: el contexto basta.'
    note: 'El mismo patrón que *Pyszny?*: una pregunta corta sin verbo que el contexto aclara perfectamente.'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek pregunta a Ewa si le gusta la música
    gloss: ¿Te gusta la música?
    note: Marek abre la conversación con la pregunta que enseña esta unidad.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa dice que le gusta y pregunta de vuelta
    gloss: ¡Sí, me gusta mucho! ¿Y a ti?
    note: A ty? (¿y tú?) le devuelve la pregunta a Marek, con el mismo patrón que ya viste en unidades anteriores.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek está de acuerdo y pregunta por las bebidas
    gloss: A mí también. ¿Café o té?
    note: Ja też lubię confirma lo que dijo Marek antes de que cambie de tema con una nueva pregunta de elección.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa prefiere el café
    gloss: Prefiero el café.
    note: 'La preferencia de Ewa, con wolę: es la misma aficionada al café que conocimos en la unidad de las rutinas.'
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek prefiere el té
    gloss: Yo prefiero el té.
    note: 'La preferencia de Marek: la elección opuesta a la de Ewa.'
