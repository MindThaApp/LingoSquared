answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polaco A1
  description: Aprende a saludar, a preguntar cómo está alguien, a presentarte e intercambiar datos personales básicos en polaco. Las explicaciones destacan el sistema de formalidad pan/pani/ty (una distinción gramatical real que el polaco marca), la concordancia de las terminaciones verbales y la elección natural del registro.
units:
  pl.a1.unit01.greetings:
    title: Saludos y primeros encuentros
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani y ty: cómo preguntar qué tal'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: Saludos y despedidas a distintas horas del día
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: Nombre, apellido y de dónde eres
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Trato formal a un hombre
    gloss: señor (trato formal a un hombre)
    note: 'El polaco marca una elección social real, como el español con tú y usted: *pan* se usa para dirigirse a un hombre desconocido o merecedor de respeto profesional. Gramaticalmente, *pan* funciona como sujeto de tercera persona: "pan jest" significa literalmente "el señor es", aunque se use con el sentido de "usted".'
  pl.a1.unit01.lesson01.teach.pani:
    title: Trato formal a una mujer
    gloss: señora (trato formal a una mujer)
    note: 'Es el equivalente femenino de *pan*. Usa *pani* con una mujer desconocida o merecedora de respeto profesional. A cualquier mujer adulta se la trata de *pani*, sea cual sea su estado civil: en el trato cotidiano, el polaco no distingue entre señora y señorita.'
  pl.a1.unit01.lesson01.teach.ty:
    title: Tú (trato informal)
    gloss: tú (informal, singular)
    note: '*Ty* se usa con un amigo, un compañero, un familiar, un niño o cualquier persona con quien la relación sea informal. A diferencia de *pan*/*pani*, *ty* lleva terminaciones verbales de segunda persona auténticas, p. ej. *masz* ("tienes/estás"), no de tercera.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Pregunta formal por el bienestar, a un hombre
    gloss: ¿Cómo está usted? (a un hombre, formal)
    note: Literalmente, "¿cómo se encuentra el señor?". *Ma* es la forma de tercera persona del verbo (concuerda con *pan* como sujeto gramatical), la misma terminación que se usa con *on* ("él").
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: ¿Cómo está usted? (a una mujer, formal)
    gloss: ¿Cómo está usted? (a una mujer, formal)
    note: 'Mismo patrón que *Jak się pan ma?*, con *pani* en lugar de *pan*. La forma verbal *ma* no cambia: es la misma terminación de tercera persona sea cual sea el género de la persona a quien te diriges.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Pregunta informal sobre cómo estás
    gloss: ¿Cómo estás? (informal)
    note: 'Con *ty*, el verbo lleva la terminación auténtica de segunda persona *masz*, no *ma*. Compara el formal *Jak się pan/pani ma?* con el informal *Jak się masz?*: es el mejor par mínimo para percibir en el propio verbo la diferencia entre pan/pani y ty.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Una respuesta habitual
    gloss: Bien, gracias.
    note: '*Dziękuję* ("gracias") no cambia según el registro: es la misma palabra si respondes a *pan*, a *pani* o a *ty*. Solo la pregunta marca la formalidad.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Devolver la pregunta de forma formal
    gloss: ¿Y usted? (a un hombre, formal)
    note: Una forma breve de devolver la pregunta a un hombre a quien tratas con formalidad. Cambia *pan* por *pani* ("A pani?") al devolvérsela a una mujer.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Devolver la pregunta de forma informal
    gloss: ¿Y tú?
    note: Usa *ty* para devolver la pregunta a un amigo o compañero.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Hola y adiós informales
    gloss: hola; adiós (informal, en ambos sentidos)
    note: '*Cześć* es poco habitual entre los saludos polacos: sirve tanto para "hola" como para "adiós" en el mismo registro informal, como el italiano "ciao". Solo se usa en relaciones de tipo *ty*, nunca con *pan*/*pani*.'
    example_gloss: Hola, ¿cómo estás?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Saludo para todo el día
    gloss: buenos días; buen día
    note: '*Dzień dobry* se usa a cualquier hora antes del anochecer y, a diferencia de *cześć*, es neutro en cuanto al registro: sirve con *pan*, *pani* o *ty*. Es el saludo más seguro con alguien a quien no conoces bien.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Saludo de tarde-noche
    gloss: buenas tardes / buenas noches (saludo)
    note: Sustituye a *dzień dobry* cuando llega la tarde-noche. Se usa igual, sin marca de registro.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Despedida nocturna
    gloss: buenas noches (para ir a dormir)
    note: 'A diferencia de *dzień dobry*/*dobry wieczór*, *dobranoc* es una despedida, no un saludo: se dice cuando alguien se va a dormir o se despide por la noche, nunca para empezar una conversación.'
    example_gloss: ¡Buenas noches, Piotr!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Despedida estándar
    gloss: adiós
    note: 'La forma neutra y segura de decir adiós: sirve con *pan*, *pani* o *ty*. Suena más definitiva que *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Despedida "hasta la vista"
    gloss: hasta pronto
    note: Literalmente, "hasta vernos". Implica que esperas volver a encontrarte con la persona, a diferencia del más neutro *do widzenia*.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Deseo de cortesía al despedirse
    gloss: ¡Que tengas un buen día!
    note: '*Miłego dnia* usa el genitivo en un deseo, igual que *smacznego* ("que aproveche"): es una construcción fija que conviene aprender como frase completa, sin analizar los casos por ahora.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Preguntar el nombre, de forma formal
    gloss: ¿Cómo se llama usted? (a un hombre, formal)
    note: Literalmente, "¿cómo se llama el señor?". *Nazywać się* es un verbo reflexivo que significa "llamarse". Cambia *pan* por *pani* si te diriges formalmente a una mujer.
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Preguntar el nombre de pila, de forma informal
    gloss: ¿Cómo te llamas? (nombre de pila)
    note: Usa otra expresión, *mieć na imię* ("tener por nombre de pila"), y pregunta específicamente por el nombre de pila, no por el nombre completo ni el apellido. Es la forma natural e informal de preguntar el nombre a un igual.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Decir tu nombre completo
    gloss: Me llamo Anna Kowalska.
    note: 'Es la forma de primera persona de *nazywać się*, que suele ir seguida del nombre y el apellido: la manera más formal o completa de presentarse.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Decir tu nombre de pila
    gloss: Me llamo Anna.
    note: 'Es la forma de primera persona de *mieć na imię*, que suele ir seguida solo del nombre de pila: la versión informal de *Nazywam się...*.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Alegría al conocer a alguien
    gloss: Mucho gusto.
    note: Expresión fija y muy usada al conocer a alguien, adecuada tanto en contextos formales como informales.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Preguntar el origen, de forma informal
    gloss: ¿De dónde eres?
    note: '*Skąd* significa "de dónde". Aquí se muestra esta forma informal, de registro *ty*; la forma formal *Skąd pan/pani jest?* aparece en el diálogo final de esta lección.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Decir de dónde eres
    gloss: Soy de Canadá.
    note: '*Z* ("de") exige el genitivo, así que *Kanada* pasa a *Kanady*. La mayoría de los nombres de países siguen este patrón después de *z*.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Decir dónde vives
    gloss: Vivo en Varsovia.
    note: '*W* ("en") exige aquí el locativo, así que *Warszawa* pasa a *Warszawie*. El origen (con *z*) y la residencia actual (con *w*) usan casos distintos en el nombre del lugar: conviene verlo como un patrón, no memorizarlo como una excepción.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: Inicio del encuentro
    gloss: Ewa saluda a Marek y le pregunta su nombre de manera formal.
    note: Ewa usa el registro formal con *pan* con alguien a quien acaba de conocer, la opción segura en un primer encuentro profesional o con desconocidos.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: Inicio del encuentro, respuesta
    gloss: Marek dice su nombre completo y que le alegra conocerla.
    note: '*Nazywam się* con el nombre completo es la forma natural y completa de responder a una pregunta formal sobre el nombre.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Preguntar por el origen
    gloss: Ewa corresponde al gesto y le pregunta a Marek, con formalidad, de dónde es.
    note: '*Skąd pan jest?*, la versión formal de *Skąd jesteś?* de esta lección, usa *jest*, el mismo patrón de tercera persona que ya vimos con *pan jest*/*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: Preguntar por el origen, respuesta
    gloss: Marek dice que es de Canadá pero vive en Varsovia.
    note: '*Ale* ("pero") une el contraste entre el lugar de origen de Marek y donde vive ahora, la misma distinción que marcan *jestem z* y *mieszkam w*.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Preguntar por el dominio de un idioma
    gloss: Ewa le pregunta a Marek, con formalidad, si habla polaco.
    note: '*Czy* abre una pregunta de sí o no. En polaco no hace falta ningún verbo auxiliar: *czy* por sí solo indica que viene una pregunta.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Preguntar por el idioma, respuesta y despedida
    gloss: Marek dice que habla un poco y que todavía está aprendiendo, y se despide.
    note: '*Jeszcze się uczę* ("todavía estoy aprendiendo") es una forma natural y humilde de describir un esfuerzo en curso; también te sirve a ti como estudiante para hablar de ti mismo.'
