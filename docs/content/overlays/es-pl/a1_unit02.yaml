answer_policy:
  diacritics: 'Same standing policy as unit01: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polaco A1
units:
  pl.a1.unit02.numbers:
    title: Números
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Números del cero al diez
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: Números del once al cien y precios
  pl.a1.unit02.lesson03.phone_and_age:
    title: Número de teléfono y edad
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: cero
    note: El punto de partida de todos los números que siguen en esta unidad.
    example_gloss: Hoy hace cero grados.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Uno
    gloss: uno
    note: '*Jeden* va seguido de un sustantivo en singular normal, a diferencia de los demás números de esta lección.'
    example_gloss: Tengo un teléfono.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Dos
    gloss: dos
    note: '*Dwa*, *trzy* y *cztery* llevan una forma especial de plural del sustantivo (como *psy*, «perros»), distinta de la que se usa después de *pięć* y los siguientes.'
    example_gloss: Tengo dos perros.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Tres
    gloss: tres
    note: 'Mismo patrón de plural que *dwa*: *trzy złote* (tres zloty), no *trzy złotych*.'
    example_gloss: El café cuesta tres zloty.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Cuatro
    gloss: cuatro
    note: El último de los tres números (*dwa*, *trzy*, *cztery*) que comparten este patrón de plural.
    example_gloss: Tengo cuatro libros.
  pl.a1.unit02.lesson01.teach.piec:
    title: Cinco
    gloss: cinco
    note: A partir de *pięć*, los números llevan otra forma de plural del sustantivo (el genitivo plural, p. ej. *minut* en lugar de *minuty*); verás que este patrón continúa durante el resto de la unidad.
    example_gloss: Tengo cinco minutos.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Seis
    gloss: seis
    note: 'Mismo patrón de genitivo plural que *pięć*: *sześć jabłek* (seis manzanas).'
    example_gloss: Tengo seis manzanas.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Siete
    gloss: siete
    note: Un número útil para hablar de los días de la semana.
    example_gloss: Una semana tiene siete días.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Ocho
    gloss: ocho
    note: '*Mam osiem lat* significa literalmente «tengo ocho años»: el polaco expresa la edad con *mieć* («tener»), igual que el español. Practicarás este patrón a fondo en la lección 3.'
    example_gloss: Tengo ocho años.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Nueve
    gloss: nueve
    note: 'De nuevo genitivo plural: *dziewięć osób* (nueve personas).'
    example_gloss: Nueve personas esperan en la fila.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Diez
    gloss: diez
    note: El último de los números de una cifra; la lección 2 continúa con los números del once al diecinueve y las decenas.
    example_gloss: Tengo diez dedos.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Once
    gloss: once
    note: 'Los números del 11 al 19 terminan en *-naście*. Como *pięć* y los siguientes, llevan genitivo plural: *jedenaście osób*.'
    example_gloss: La clase tiene once personas.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Doce
    gloss: doce
    note: El mismo patrón *-naście* que *jedenaście*.
    example_gloss: Un año tiene doce meses.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Quince
    gloss: quince
    note: 'Sigue el patrón *-naście*: *piętnaście minut* (quince minutos).'
    example_gloss: Tengo un descanso de quince minutos.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Veinte
    gloss: veinte
    note: Los números del 20 al 40 terminan en *-dzieści*, un patrón distinto del de *-naście*. *Dwadzieścia* por sí solo sigue llevando genitivo plural (*dwadzieścia lat*), pero fíjate en la lección 3 en lo que ocurre cuando le añades una unidad.
    example_gloss: Tengo veinte años.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Veintiuno
    gloss: veintiuno
    note: 'En polaco los números compuestos se forman con la decena seguida de la unidad, sin ninguna palabra de enlace: dwadzieścia jeden.'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Treinta
    gloss: treinta
    note: Sigue el patrón *-dzieści* de *dwadzieścia*.
    example_gloss: El billete cuesta treinta zloty.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Cincuenta
    gloss: cincuenta
    note: Los números del 50 al 90 pasan a un tercer patrón, *-dziesiąt*, en lugar de *-dzieści*.
    example_gloss: Tengo cincuenta zloty.
  pl.a1.unit02.lesson02.teach.sto:
    title: Cien
    gloss: cien
    note: Un número redondo y sencillo, sin terminaciones compuestas de las que preocuparse.
    example_gloss: Eso cuesta cien zloty.
  pl.a1.unit02.lesson02.teach.ile:
    title: Cuánto / cuántos
    gloss: cuánto; cuántos
    note: La palabra interrogativa para preguntar por cualquier cantidad o precio.
    example_gloss: ¿Cuánto cuesta esto?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Preguntar un precio
    gloss: ¿Cuánto cuesta esto?
    note: '*Kosztować* («costar») es el verbo; *to* («esto») es el sujeto. Toda la pregunta es un patrón fijo y muy común.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Decir un precio
    gloss: Esto cuesta veinte zloty.
    note: '*Złotych* es el genitivo plural de *złoty* (la moneda polaca), el mismo plural que ya lleva *dwadzieścia*.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Preguntar el número de teléfono a un hombre
    gloss: ¿Cuál es su número de teléfono? (a un hombre, formal)
    note: 'Literalmente «¿cuál es el número de teléfono del señor?». *Pana* es la forma posesiva (genitivo) de *pan*: «del señor», es decir, «su».'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Preguntar el número de teléfono a una mujer
    gloss: ¿Cuál es su número de teléfono? (a una mujer, formal)
    note: Cambia *pana* por *pani* para dirigirte formalmente a una mujer, igual que en el patrón de la unidad 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Preguntar el número de teléfono de manera informal
    gloss: ¿Cuál es tu número de teléfono? (informal)
    note: '*Twój* («tu», informal) sustituye a *pana*/*pani* cuando hablas con un amigo o un igual.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: Dar un número, frase de introducción
    gloss: El número es...
    note: Una frase corta y natural antes de leer los dígitos uno a uno, la forma normal en que los polacos dicen un número de teléfono en voz alta.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Un número de teléfono de ejemplo
    gloss: Seis, uno, cinco, cero, dos.
    note: En polaco los números de teléfono se leen dígito por dígito; todos los dígitos de aquí reutilizan números que ya has aprendido en esta unidad.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Preguntar la edad a alguien, de manera informal
    gloss: ¿Cuántos años tienes? (informal)
    note: 'Literalmente «cuántos años tienes»: el polaco expresa la edad con *mieć* («tener»), igual que el español, patrón que ya viste en la tarjeta de *osiem* en la lección 1.'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Preguntar la edad a alguien, de manera formal
    gloss: ¿Cuántos años tiene usted? (a un hombre, formal)
    note: '*Ma* es la misma forma de tercera persona que ya viste con *pan jest*/*pan ma* en la unidad 1: gramaticalmente *pan* funciona como «el señor», un sujeto de tercera persona.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Decir tu edad
    gloss: Tengo veintiocho años.
    note: '*Mam* es la primera persona de *mieć* («tener»). *Dwadzieścia osiem* termina en *osiem* (ocho), así que, como todos los números que terminan en 5-9, lleva *lat*; fíjate en el diálogo de la lección 3, donde aparece un número que termina de otra forma.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa pide el número de Marek
    gloss: Ewa le pide a Marek su número de teléfono, de manera formal.
    note: Reutiliza exactamente la pregunta formal sobre el número de teléfono de esta lección.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek da su número
    gloss: Marek lee su número de teléfono dígito por dígito.
    note: Todos los dígitos de aquí ya se enseñaron en las lecciones 1 y 2 de esta unidad.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa pregunta la edad de Marek
    gloss: Ewa le da las gracias y le pregunta su edad, en tono formal.
    note: '*Dziękuję* («gracias») y *A* («y») no cambian según el registro, igual que la tarjeta *dziękuję* de la unidad 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek dice su edad y devuelve la pregunta
    gloss: Marek dice que tiene veintiocho años y le pregunta a Ewa su edad, en tono formal.
    note: '*A pani?* devuelve la pregunta de forma formal a una mujer; es el mismo patrón corto que la unidad 1 enseñó con *A pan?*.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa dice su edad
    gloss: Ewa dice que tiene treinta y dos años.
    note: '*Trzydzieści dwa* termina en *dwa* (dos), así que, a diferencia de *dwadzieścia osiem* (que termina en ocho y lleva *lat*), este número lleva *lata*. Los números que terminan en 2, 3 o 4 (salvo los que van del 12 al 14) usan esta otra forma del plural. Es un matiz gramatical real: *lat* y *lata* no son intercambiables, y cuál es correcta depende de la última cifra del número.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek cierra la conversación
    gloss: Marek dice que ha sido un placer hablar con ella y se despide.
    note: '*Do zobaczenia* reutiliza la despedida «hasta la vista» de la unidad 1.'
