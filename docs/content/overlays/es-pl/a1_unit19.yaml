teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: 'Qué, es, hoy, no: otra vez'
    gloss: 'Jaka, jest, Dziś, nie: ya conoces estas palabras de lecciones anteriores.'
    note: Un breve repaso antes de usarlas en esta lección para hablar del tiempo.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: El tiempo
    gloss: tiempo (meteorológico)
    note: La palabra general para el tiempo atmosférico.
    example_gloss: ¿Qué tiempo hace?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Frío
    gloss: frío
    note: Describe la temperatura; no cambia de forma según el género.
    example_gloss: Hace frío.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Calor
    gloss: calor
    note: Lo contrario de *zimno*; tampoco cambia de forma según el género.
    example_gloss: Hace calor.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Hace frío, hace calor
    gloss: 'Jest zimno. Jest gorąco. Así se describe el tiempo en polaco: *jest* más una palabra del tiempo, sin concordancia de género.'
    note: Este mismo patrón sencillo sirve para todas las palabras del tiempo de esta unidad.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: ¿Qué tiempo hace?
    gloss: ¿Qué tiempo hace?
    note: Una forma natural de preguntar por el tiempo actual.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Hoy hace frío
    gloss: Hoy hace frío.
    note: La frase sobre la que se construye toda esta unidad para hablar del tiempo de hoy.
  pl.a1.unit19.lesson02.teach.pada:
    title: Está lloviendo
    gloss: llueve
    note: Se usa solo, sin sujeto; es la forma normal de decir «llueve» en polaco.
    example_gloss: Hoy está lloviendo.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Nieve
    gloss: nieve
    note: La palabra para «nieve»; junto con *pada* significa «nieva».
    example_gloss: Nieva.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Niebla
    gloss: niebla
    note: Otro fenómeno meteorológico frecuente.
    example_gloss: Hay niebla.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Buena
    gloss: Pogoda jest dobra. *dobra* concuerda con sustantivos femeninos, como *pogoda*.
    note: Es la forma femenina de *dobry* (como en *Dzień dobry*); el mismo patrón -y/-a que *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Horrible
    gloss: Jaka straszna pogoda! *straszna* también concuerda con *pogoda*, igual que *dobra*.
    note: 'Una palabra fuerte: úsala para un tiempo realmente malo.'
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: ¡Qué tiempo tan horrible!
    gloss: ¡Qué tiempo tan horrible!
    note: Una exclamación natural sobre el mal tiempo.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Hace buen tiempo
    gloss: Hace buen tiempo.
    note: Reutiliza la palabra del tiempo vista antes en esta lección.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: 'Sí, y, yo, también: otra vez'
    gloss: 'Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo: ya conoces estas palabras de lecciones anteriores.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit19.lesson03.teach.bo:
    title: Porque
    gloss: porque
    note: Une un plan con el motivo relacionado con el tiempo.
    example_gloss: No voy al parque porque llueve.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: No quiero ir, porque llueve
    gloss: No quiero ir al parque porque llueve.
    note: 'Una descripción del tiempo unida a un plan real: justo lo que construye esta unidad.'
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: 'En Cracovia: otra vez'
    gloss: 'W Krakowie: ya lo conoces de lecciones anteriores, por ejemplo «Ona mieszka w Krakowie» (Ella vive en Cracovia).'
    note: Un breve repaso antes de que el diálogo de esta lección compare el tiempo en dos lugares.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek pregunta por el tiempo
    gloss: ¿Qué tiempo hace hoy?
    note: Marek abre la conversación preguntando por el tiempo de hoy.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa responde
    gloss: Llueve. Hace frío.
    note: Ewa describe el tiempo que hace hoy.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek reacciona y hace un plan
    gloss: ¡Qué tiempo tan horrible! No quiero ir al parque porque llueve.
    note: Marek reacciona al tiempo y dice su plan a causa de él.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa está de acuerdo
    gloss: Yo tampoco voy al parque.
    note: Ewa hace el mismo plan que Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek pregunta por Cracovia
    gloss: ¿Y en Cracovia? ¿Qué tiempo hace allí?
    note: Marek lleva la conversación al tiempo de otra ciudad.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa responde
    gloss: En Cracovia está nevando. Allí hace mucho frío.
    note: Ewa describe un tiempo distinto y más frío en Cracovia.
