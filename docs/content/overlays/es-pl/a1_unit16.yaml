teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Duele
    gloss: 'Boleć (doler), presente: boli (él/ella/ello) y bolą (ellos/ellas). Głowa mnie boli significa ''me duele la cabeza'', literalmente ''la cabeza me duele''.'
    note: 'Para hablar de dolores, el presente de *boleć* se usa solo en estas dos formas: la parte del cuerpo es el sujeto y *mnie* indica de quién es, así que aquí no hay que aprender una forma para "yo".'
  pl.a1.unit16.lesson01.teach.glowa:
    title: Cabeza
    gloss: cabeza
    note: Lo más habitual que se dice que duele.
    example_gloss: Me duele la cabeza.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Garganta
    gloss: garganta
    note: Útil para describir un resfriado o dolor de garganta.
    example_gloss: Me duele la garganta.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Estómago
    gloss: estómago
    note: Útil después de una comida copiosa o cuando algo te sienta mal.
    example_gloss: Me duele la barriga.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Dientes
    gloss: dientes
    note: Aquí se usa siempre en plural, como lo diría un hablante nativo de polaco; por eso se usa *bolą* (y no *boli*) con esta palabra.
    example_gloss: Me duelen los dientes.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: ¿Qué le duele?
    gloss: ¿Qué te duele?
    note: La pregunta natural para alguien que no se encuentra bien.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: ¿Cómo te sientes?
    gloss: 'Czuć się (sentirse): czuję się (yo), czujesz się (tú). ¿Cómo te sientes?'
    note: 'Por ahora solo dos formas: *czuję* para hablar de ti mismo y *czujesz* para preguntar a otra persona.'
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Bien y mal
    gloss: Me siento bien. Me siento mal. -- ya conoces dobrze; źle es su opuesto.
    note: El mismo *dobrze* que usas desde la primera lección, ahora junto a su opuesto.
  pl.a1.unit16.lesson02.teach.zle:
    title: Mal
    gloss: mal
    note: La palabra que necesitas para decir que no te encuentras bien.
    example_gloss: Me siento mal.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Fiebre
    gloss: fiebre
    note: Un síntoma básico y frecuente que conviene saber nombrar.
    example_gloss: Tengo fiebre.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: 'Ewa, tiene: otra vez'
    gloss: Ewa, ma -- ya conoces este nombre y esta forma del verbo mieć (tener) de lecciones anteriores (Mam, masz, ma).
    note: Un breve recordatorio antes de que esta lección use ambos.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Enfermo
    gloss: enfermo / enferma
    note: 'El mismo patrón -y/-a que ya aprendiste con *młodszy/starsza*: *chory* para un hombre, *chora* para una mujer.'
    example_gloss:
    - Él está enfermo.
    - Ella está enferma.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa no se siente bien
    gloss: Me siento mal. Tengo fiebre.
    note: Ewa describe sus propios síntomas; lo mismo que vuelve a decir en el diálogo de esta unidad.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, otra vez
    gloss: Marek -- ya conoces este nombre de lecciones anteriores.
    note: Un breve recordatorio antes del diálogo de esta lección.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: Y, otra vez
    gloss: I -- ya conoces esta palabra de lecciones anteriores.
    note: Un breve recordatorio antes del diálogo de esta lección.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: Por favor y agua, otra vez
    gloss: Proszę y wodę -- ya conoces ambas palabras de lecciones anteriores.
    note: Un breve recordatorio antes del diálogo de esta lección.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: Gracias, otra vez
    gloss: Dziękuję -- ya conoces esta palabra de lecciones anteriores.
    note: Un breve recordatorio antes del diálogo de esta lección.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Descansar
    gloss: descansar
    note: 'Se usa con *Proszę* igual que cuando pides a alguien que siga recto o gire en cierta dirección: *Proszę* + infinitivo, sin necesidad de imperativo.'
    example_gloss: Por favor, descanse.
  pl.a1.unit16.lesson03.teach.pic:
    title: Beber
    gloss: beber
    note: Otro infinitivo que sigue a *Proszę* de la misma manera.
    example_gloss: Por favor, beba agua.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek pregunta a Ewa cómo se siente
    gloss: Ewa, ¿cómo te sientes?
    note: Marek nota que algo va mal y pregunta directamente.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa describe sus síntomas
    gloss: Me siento mal. Me duele la garganta y tengo fiebre.
    note: Ewa dice con claridad dos síntomas, los mismos que ya vimos antes en esta unidad.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek da un consejo sencillo
    gloss: Por favor, descanse y beba agua.
    note: 'Un consejo sencillo, sin diagnóstico: no es una indicación médica, solo sentido común.'
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa da las gracias a Marek
    gloss: De acuerdo, gracias, Marek.
    note: Un cierre sencillo y familiar de la conversación.
