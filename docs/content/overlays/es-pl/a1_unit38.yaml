  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: La construcción con Lubię
    gloss: '*Lubię* + estación indica qué estación te gusta: *Lubię lato.* La estación va en acusativo: *wiosnę*, *zimę*.'
    note: '*Lubię* (''me gusta'') lleva acusativo: los sustantivos femeninos en *-a* cambian a *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), mientras que *jesień* y *lato* (sustantivo en *-o*) no cambian. Para decir qué opinas de una estación, usa *Uważam* + acusativo + *za* + adjetivo: *Uważam jesień za ładną*.'
  pl.a1.unit38.lesson03.teach.jezdzic_na_lyzwach:
    title: Patinar
    gloss: patinar
