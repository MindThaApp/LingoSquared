    gloss: 'Ahora es primavera. Los tulipanes son bonitos. Nina pregunta: ¿Qué estación te parece bonita? Marek dice: Me gusta el verano. En verano nadamos. Ewa dice: Me gusta el invierno. En invierno patinamos.'
    note: Repasa la conversación del café de idiomas con citas directas, como en otras unidades.
    glosses:
      wiosna: primavera
      Tulipany: tulipanes
      ładne: bonitos
