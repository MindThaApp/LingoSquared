teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Banco, oficina de correos
    gloss: banco; oficina de correos
    note: 'Dos gestiones cotidianas: bank es casi igual que «banco»; poczta es adonde vas a enviar una carta o un paquete.'
    example_gloss:
    - Esto es un banco.
    - Esto es una oficina de correos.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Farmacia, restaurante
    gloss: farmacia; restaurante
    note: Apteka es donde compras medicamentos (no una tienda general); restauracja se parece mucho a «restaurante».
    example_gloss:
    - Esto es una farmacia.
    - Esto es un restaurante.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: hotel; parque
    note: Ambas se parecen mucho al español, así que son fáciles de reconocer, tanto escritas como habladas.
    example_gloss:
    - Esto es un hotel.
    - Esto es un parque.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Gdzie jest + [lugar]?
    gloss: 'Gdzie jest + [lugar]?: Gdzie («dónde») más jest («está») sirve para preguntar por una ubicación: ¿Dónde está el banco? ¿Dónde está la farmacia?'
    note: '*Gdzie* significa «dónde» y *jest* significa «está»; juntos, *Gdzie jest...?* es la pregunta habitual para preguntar dónde queda cualquier lugar. Úsala tal cual cuando preguntes por un solo lugar; para varios lugares, el polaco cambia a *są* («están»).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: ¿Dónde está el banco?
    gloss: ¿Dónde está el banco?
    note: El patrón de la nota de gramática puesto en práctica con la primera palabra de lugar de esta lección.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Cerca, lejos
    gloss: cerca; lejos
    note: Una pareja sencilla de opuestos, que se usa justo después de jest para describir qué tan cerca o lejos está un lugar.
    example_gloss:
    - El parque está cerca.
    - El hotel está lejos.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: No lejos
    gloss: no lejos
    note: 'Literalmente *nie* («no») más *daleko* («lejos») fundidos en una sola palabra: una forma más suave y muy común de tranquilizar a alguien diciéndole que un lugar queda al alcance.'
    example_gloss: La farmacia no está lejos.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Al lado de, enfrente de
    gloss: al lado de; enfrente de
    note: Ambas describen la posición de un lugar respecto a un punto de referencia, y no solo su cercanía. Las dos exigen que el sustantivo siguiente pase al genitivo; mira la nota de gramática de esta lección.
    example_gloss:
    - La farmacia está al lado del banco.
    - El restaurante está enfrente del hotel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'Después de ''obok''/''naprzeciwko''/''blisko + sustantivo'': el genitivo'
    gloss: 'Después de «al lado de»/«enfrente de»/«cerca de» + un lugar: caso genitivo; bank -> banku, hotel -> hotelu, park -> parku. La farmacia está al lado del banco. El restaurante está enfrente del hotel. El restaurante está cerca del parque.'
    note: '*Obok*, *naprzeciwko* y *blisko* (cuando va seguido de un lugar, no cuando está solo) rigen el genitivo, así que el sustantivo que sigue cambia de terminación. En estos tres sustantivos masculinos regulares, eso significa añadir *-u*: *bank* pasa a *banku*, *hotel* a *hotelu* y *park* a *parku*. Cuando *blisko* va solo, no necesita genitivo: *To jest blisko* («Está cerca») es tan correcto como *blisko parku* («cerca del parque»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: La farmacia está al lado del banco
    gloss: La farmacia está al lado del banco.
    note: 'Pone en práctica el patrón con -u de la nota gramatical en una frase real: bank pasa a banku después de obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Perdón
    gloss: disculpe / perdón
    note: Es la forma habitual de llamar la atención de un desconocido antes de preguntar algo; se dice antes de la pregunta, no después.
    example_gloss: Perdón, ¿dónde está el banco?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa pregunta por la farmacia
    gloss: Ewa pide disculpas para llamar la atención y pregunta dónde está la farmacia.
    note: Przepraszam abre la pregunta, como explica la nota de vocabulario de esta lección; incluso con alguien conocido como Marek, es la forma educada de interrumpir antes de preguntar algo.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek indica dónde está la farmacia
    gloss: Marek dice que la farmacia no está lejos, al lado del banco.
    note: Combina niedaleko y obok + banku, ambos de la nota gramatical de la lección 2.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa da las gracias a Marek y pregunta por el restaurante
    gloss: Ewa da las gracias y pregunta dónde está el restaurante.
    note: Dziękuję, ya visto en unidades anteriores; A (y) enlaza la nueva pregunta con la anterior.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek indica dónde está el restaurante
    gloss: Marek dice que el restaurante está enfrente del hotel, cerca del parque.
    note: Naprzeciwko + hotelu (genitivo, el mismo patrón que banku) y blisko para un segundo punto de referencia.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa vuelve a dar las gracias a Marek
    gloss: Ewa dice muchas gracias.
    note: Bardzo (mucho) refuerza dziękuję, igual que en proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek responde
    gloss: Marek dice de nada.
    note: Proszę bardzo, la respuesta habitual a un agradecimiento, ya vista en la unidad de compras.
