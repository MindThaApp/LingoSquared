teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Preguntar el precio total
    gloss: ¿Cuánto cuesta en total?
    note: '*W sumie* (en total) aclara que quieres el precio completo, no el de un solo artículo.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Decir el precio total
    gloss: En total cuesta cien eslotis.
    note: '*Kosztuje* es la forma de *on/ona/ono* de *kosztować* (costar). Los números a partir de 5 llevan genitivo plural: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Pagar con tarjeta o en efectivo
    gloss: pagar con tarjeta, pagar en efectivo
    note: '*Płacić kartą* (pagar con tarjeta) y *płacić gotówką* (pagar en efectivo) usan el instrumental después de *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - ¿Puedo pagar con tarjeta aquí?
    - Pago en efectivo.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Preguntar si se puede pagar con tarjeta
    gloss: ¿Puedo pagar con tarjeta aquí?
    note: '*Tu* (aquí) sitúa la pregunta en el lugar donde estás; *czy* introduce una pregunta de sí o no y *mogę* significa «puedo».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Preguntar la forma de pago preferida
    gloss: ¿Quiere pagar en efectivo o con tarjeta?
    note: '*Czy chce pan ...?* es la versión formal de *Czy chcesz ...?*, usada aquí por un cajero desconocido (*pan* para un hombre, *pani* para una mujer).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: La cuenta
    gloss: la cuenta
    note: 'Un sustantivo masculino: *rachunek* (genitivo *rachunku*).'
    example_gloss: ¿Dividimos la cuenta?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Proponer dividir la cuenta
    gloss: ¿Dividimos la cuenta?
    note: '*Może podzielimy ...?* es una forma educada de proponer algo en conjunto; *podzielimy* es la forma de *my* (nosotros) de *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Pedir pagar por separado
    gloss: ¿Puedo pagar por separado?
    note: '*Osobno* (por separado) va con *zapłacić* (pagar, perfectivo: un pago completo).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: El cambio
    gloss: el cambio
    note: 'Un sustantivo femenino: *reszta* (genitivo *reszty*, como en *nie potrzebuję reszty*).'
    example_gloss: Aquí tiene su cambio.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Entregar el cambio
    gloss: Aquí tiene su cambio.
    note: '*Pana* es el «su» formal (para un hombre; *pani* para una mujer), acorde con el registro formal en un mostrador.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Rechazar el cambio
    gloss: No necesito el cambio.
    note: '*Nie potrzebuję* + genitivo: la negación pone el complemento en genitivo, por eso *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Treinta y cinco
    gloss: treinta y cinco
    note: '*Trzydzieści pięć* se escribe en dos palabras: primero las decenas y luego las unidades (30 + 5).'
    example_gloss: Cuesta ciento cuarenta eslotis.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Lee la cuenta de un restaurante
    gloss: 'Cuenta: dos platos principales y dos cafés. Total: ciento cuarenta eslotis. Pagado con tarjeta.'
    note: Fíjate en lo que se pidió, en el total y en cómo se pagó.
    glosses:
      Rachunek: cuenta
      dwa: dos
      dania: platos principales
      kawy: cafés
      Razem: total
      złotych: eslotis
      Zapłacono: pagado
      kartą: tarjeta
      sto: cien
      czterdzieści: cuarenta
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa pide la cuenta
    gloss: 'Ewa: ¿Pedimos la cuenta?'
    note: '*Poprosić o* (pedir) va seguido de acusativo: *o rachunek*. *Poprosimy* es el futuro perfectivo.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek pregunta el total
    gloss: 'Marek: Sí, buena idea. ¿Cuánto cuesta en total?'
    note: Retoma la pregunta *Ile to kosztuje w sumie?* de la lección 1.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa dice el total
    gloss: 'Ewa: Son ciento cuarenta eslotis. ¿Lo dividimos?'
    note: '*Podzielimy się?* (literalmente «¿nos dividimos?») usa el reflexivo *się* con el sentido de repartir la cuenta.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek insiste en pagar
    gloss: 'Marek: No, hoy pago yo. ¡Me has ayudado tanto!'
    note: '*Dzisiaj ja płacę* (literalmente «hoy yo pago») es la manera habitual de ofrecerse a pagar; *pomogłaś* es el pasado femenino de *pomóc* (ayudar), porque Marek habla con Ewa.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa se siente conmovida
    gloss: 'Ewa: ¡Qué amable de tu parte! Gracias.'
    note: '*Miło z twojej strony* («qué amable de tu parte») es un cumplido cálido y habitual ante un gesto generoso; *z* + genitivo: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek pregunta si puede pagar con tarjeta
    gloss: 'Marek: ¿Puedo pagar aquí con tarjeta?'
    note: Retoma la pregunta *Czy mogę tu zapłacić kartą?* de la lección 2, ahora en el restaurante real.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: la forma de él/ella'
    gloss: Marek paga la cuenta.
    note: '*Płaci* es la forma de *on/ona/ono* de *płacić* (pagar).'
