teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: Lunes
    gloss: Lunes
    note: El primer día de la semana en polaco; el calendario polaco empieza en lunes.
    example_gloss: Hoy es lunes.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: Martes
    gloss: martes
    note: 'Ojo con este: *wtorek* lleva la preposición *we*, no *w*, cuando dices «el martes». Lo veremos más adelante en esta lección.'
    example_gloss: Hoy es martes.
  pl.a1.unit03.lesson01.teach.sroda:
    title: Miércoles
    gloss: miércoles
    note: Es un sustantivo femenino, a diferencia de la mayoría de los otros días de la semana.
    example_gloss: Hoy es miércoles.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: Jueves
    gloss: jueves
    note: Sigue el mismo patrón masculino que *poniedziałek*, *wtorek* y *piątek*.
    example_gloss: Hoy es jueves.
  pl.a1.unit03.lesson01.teach.piatek:
    title: Viernes
    gloss: viernes
    note: 'Volverás a ver este día más adelante en la unidad: es el día en que Ewa y Marek quedan para verse otra vez.'
    example_gloss: Hoy es viernes.
  pl.a1.unit03.lesson01.teach.sobota:
    title: Sábado
    gloss: Sábado
    note: Forma parte del fin de semana; muchos polacos también dicen *weekend*, una palabra tomada de otra lengua.
    example_gloss: Hoy es sábado.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: Domingo
    gloss: Domingo
    note: El último de los siete días de la semana que se enseñan en esta lección.
    example_gloss: Hoy es domingo.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Preguntar el día
    gloss: ¿Qué día de la semana es hoy?
    note: Es una pregunta directa; *dzień tygodnia* significa literalmente «día de la semana».
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: La excepción w/we
    gloss: El lunes, el jueves, el viernes, pero el martes (para facilitar la pronunciación).
    note: 'La mayoría de los días de la semana siguen el patrón «*w* + [día]» para decir «el [día]». *Wtorek* es la única excepción real: los polacos dicen *we wtorek*, no *w wtorek*, simplemente porque es más fácil de pronunciar. Es una irregularidad auténtica, no una errata.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: El viernes voy al cine
    gloss: El viernes voy al cine.
    note: '*Piątek* no cambia después de *w*; solo *środa*, *sobota* y *niedziela* cambiarían (no se tratan en esta lección para simplificar en el nivel A1).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Enero, febrero, marzo
    gloss: enero; febrero; marzo
    note: '*Luty* es el caso especial en gramática: se comporta como un adjetivo y no como un sustantivo normal (volverás a verlo en su forma de «en febrero» más adelante en la unidad).'
    example_gloss:
    - Mi cumpleaños es en enero.
    - Voy a Varsovia en febrero.
    - Mi cumpleaños es en marzo.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: Abril, mayo, junio
    gloss: abril; mayo; junio
    note: '*Maj* es el mes que verás usado en las dos fechas de la historia de esta unidad.'
    example_gloss:
    - Voy a Varsovia en abril.
    - Mi cumpleaños es en mayo.
    - Voy a Varsovia en junio.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Julio, agosto, septiembre
    gloss: julio; agosto; septiembre
    note: 'Aquí hay otra irregularidad real: «en septiembre» es *we wrześniu*, no *w wrześniu*; es el mismo cambio a *we*, más fácil de pronunciar, que ya viste con *wtorek*.'
    example_gloss:
    - Estoy de vacaciones en julio.
    - Voy a Varsovia en agosto.
    - Mi cumpleaños es en septiembre.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Octubre, noviembre, diciembre
    gloss: octubre; noviembre; diciembre
    note: Los tres últimos meses del año, que completan el conjunto de los doce.
    example_gloss:
    - Voy a Varsovia en octubre.
    - Mi cumpleaños es en noviembre.
    - Estoy de vacaciones en diciembre.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Cumpleaños
    gloss: cumpleaños
    note: '*Urodziny* es siempre plural en polaco, incluso para el único cumpleaños de una persona; va con *są* («son») y nunca con *jest* («es»). Practicarás este punto exacto en un ejercicio más adelante en esta lección.'
    example_gloss: Mi cumpleaños es en mayo.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Cuándo
    gloss: cuándo
    note: La palabra interrogativa para preguntar por cualquier momento en el tiempo.
    example_gloss: ¿Cuándo es la reunión?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Preguntar el cumpleaños de alguien
    gloss: ¿Cuándo es tu cumpleaños?
    note: '*Są*, y no *jest*, concuerda con el plural *urodziny*; es el patrón señalado en la tarjeta de *urodziny*.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Decir la fecha de un cumpleaños
    gloss: Mi cumpleaños es el 10 de mayo.
    note: '*Dziesiątego maja*: el día termina en *-ego* y el mes en *-a*, sin ninguna preposición. Es la forma estándar de indicar una fecha concreta en polaco; consulta la nota de gramática más adelante en esta lección para ver el patrón completo.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Preguntar cuándo es la reunión
    gloss: ¿Cuándo es la reunión?
    note: '*Spotkanie* («reunión», «encuentro») es una palabra que volverás a ver en el diálogo de la lección 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Decir la fecha de la reunión
    gloss: La reunión es el 15 de mayo.
    note: Es el mismo patrón de fecha *-ego* + *-a* que en *dziesiątego maja*, solo que con otro número de día.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Cómo se dice una fecha en polaco
    gloss: 'Una fecha: el día termina en -ego, el mes termina en -a (pero febrero es lutego), sin preposición: 10 de mayo, 15 de mayo.'
    note: 'Compáralo con «el viernes» (*w piątek*, que necesita la preposición *w*): para indicar una fecha concreta del calendario se usa otra construcción, que nunca lleva preposición.'
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Proponer volver a quedar
    gloss: ¿Cuándo podemos vernos otra vez?
    note: '*Znowu* significa «otra vez», «de nuevo»; es una forma natural de empezar a hablar de una nueva cita.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Preguntar formalmente a un hombre si le va bien el viernes
    gloss: ¿Le viene bien el viernes? (a un hombre, formal)
    note: '*Panu* es el dativo de *pan*: *odpowiadać* («convenir», «venir bien») siempre lleva la persona en dativo, como en español «¿te viene bien el viernes?», donde *te* es un pronombre de dativo.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Preguntar formalmente a una mujer si le va bien el viernes
    gloss: ¿Le viene bien el viernes? (a una mujer, formal)
    note: Cambia *panu* por *pani* para dirigirte a una mujer de manera formal; *pani* es igual en nominativo y en dativo, a diferencia de *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Preguntar a un amigo si le va bien el viernes, de manera informal
    gloss: ¿Te viene bien el viernes? (informal)
    note: '*Ci* sustituye a *panu*/*pani* cuando hablas con un amigo o alguien de tu edad: es el «te» de dativo informal.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Decir que el viernes te viene bien
    gloss: El viernes me viene bien.
    note: '*Mi* es el dativo de primera persona: el mismo patrón que *panu*/*pani*/*ci*, pero para «me» en lugar de «te» o «le».'
  pl.a1.unit03.lesson03.teach.data:
    title: Fecha
    gloss: fecha (del calendario)
    note: Significa «fecha» del calendario; no la confundas con «datos».
    example_gloss: ¿Qué fecha será?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Preguntar qué fecha será
    gloss: ¿Qué fecha será?
    note: Una pregunta natural cuando dos personas ya han acordado el día de la semana, pero aún no la fecha exacta.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa propone volver a quedar
    gloss: Ewa pregunta a Marek cuándo pueden verse otra vez.
    note: Repite exactamente la pregunta con la que empieza esta lección.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek propone el viernes, de manera formal
    gloss: Marek le pregunta a Ewa, de manera formal, si le viene bien el viernes.
    note: Se dirige a Ewa con *pani*, manteniendo el registro formal usado desde la primera unidad.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa acepta y pregunta la fecha
    gloss: Ewa dice que el viernes le viene bien y luego pregunta cuál será la fecha exacta.
    note: '*Tak* («sí»), que viste en la unidad 1, abre la respuesta de Ewa antes de preguntar la fecha exacta.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek dice la fecha
    gloss: Marek dice que es el 15 de mayo.
    note: Las dos palabras ya se vieron en la lección 2 de esta unidad.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa confirma y se despide
    gloss: Ewa dice que perfecto y que se ven el 15 de mayo.
    note: '*Do zobaczenia* retoma la despedida de la primera unidad, ahora combinada con una fecha concreta.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek cierra la conversación
    gloss: Marek se despide también.
    note: 'El cierre más corto posible: solo la despedida.'
