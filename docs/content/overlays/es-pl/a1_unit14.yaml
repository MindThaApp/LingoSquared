teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Joven
    gloss: joven
    note: 'Un adjetivo descriptivo básico: el punto de partida para las formas comparativas de esta unidad.'
    example_gloss: Marek es joven.
  pl.a1.unit14.lesson01.teach.stary:
    title: Viejo
    gloss: viejo
    note: 'Lo contrario de młody: otro adjetivo que en esta unidad pasará a comparativo.'
    example_gloss: El abuelo es viejo.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Cómo comparar: añade -szy'
    gloss: 'En los adjetivos cortos como stary y młody, la terminación -y cambia a -szy: stary pasa a starszy, młody pasa a młodszy. No todos los adjetivos funcionan así.'
    note: 'Un patrón sencillo para estas dos palabras: quita la *-y* final y añade *-szy* para obtener el comparativo. Muchos otros adjetivos usan otra terminación, así que no lo apliques a todos.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Mayor
    gloss: mayor
    note: 'Starszy se usa para un hombre (u on); starsza, para una mujer (u ona): es el comparativo de stary.'
    example_gloss:
    - El abuelo es mayor que el padre.
    - La abuela es mayor que la madre.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Más joven
    gloss: más joven
    note: 'Młodszy para un hombre, młodsza para una mujer: es el comparativo de młody.'
    example_gloss:
    - El padre es más joven que el abuelo.
    - La madre es más joven que la abuela.
  pl.a1.unit14.lesson01.teach.niz:
    title: Que
    gloss: que
    note: Niż une las dos cosas que se comparan; la palabra que va después de niż queda en su forma básica.
    example_gloss: El hijo es más joven que el padre.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: Los comparativos concuerdan con el género
    gloss: Starszy/starsza y młodszy/młodsza cambian según el género, igual que byłem/byłam. Starszy, młodszy para un hombre (on); starsza, młodsza para una mujer (ona).
    note: 'Es el mismo patrón que *byłem*/*byłam*: la terminación cambia según hables de un hombre o de una mujer.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa es mayor que Marek
    gloss: Ewa es mayor que Marek.
    note: 'Un dato real de nuestros dos personajes: Ewa tiene 32 años y Marek, 28.'
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek es más joven que Ewa
    gloss: Marek es más joven que Ewa.
    note: El mismo dato, dicho al revés.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Bueno, otra vez
    gloss: 'Dobry (bueno): ya lo conoces de Dzień dobry.'
    note: El mismo adjetivo que ves desde la primera unidad, ahora usado para formar un comparativo.
  pl.a1.unit14.lesson02.teach.zly:
    title: Malo
    gloss: malo
    note: 'Lo contrario de dobry: una palabra totalmente nueva en esta unidad.'
    example_gloss: Este es un mal día.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry y zły son irregulares
    gloss: 'Dobry y zły son irregulares: dobry pasa a lepszy y zły pasa a gorszy; no se añade -szy.'
    note: 'A diferencia de *stary*/*młody*, estas dos no siguen el patrón regular en *-szy*: hay que aprender sus formas comparativas.'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Mejor
    gloss: mejor
    note: 'Lepszy para un hombre, lepsza para una mujer (o para una palabra femenina como kawa): es el comparativo irregular de dobry.'
    example_gloss:
    - Él es mejor que yo.
    - El café es mejor que el té.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Peor
    gloss: peor
    note: Gorszy/gorsza -- el comparativo irregular de zły.
    example_gloss:
    - Él es peor que yo.
    - El té es peor que el café.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Café y té, otra vez
    gloss: 'Kawa y herbata: ya conoces estas palabras de la lección anterior sobre las bebidas.'
    note: Un breve repaso antes de que esta lección las use en una comparación.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: El mismo patrón de antes
    gloss: Lepszy/lepsza y gorszy/gorsza cambian según el género igual que starszy/starsza en la lección anterior.
    note: La misma distinción masculino/femenino que acabas de aprender, aplicada a un nuevo par de palabras.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Yo, soy/estoy, tú
    gloss: 'Ja, jestem, ty: ya conoces estas palabras de lecciones anteriores.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Sí, no, bien
    gloss: 'Tak, nie y dobrze: también las conoces ya.'
    note: Otro breve repaso antes del diálogo.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Pero, otra vez
    gloss: 'Ale (pero): ya lo conoces de lecciones anteriores. Une dos frases que se contraponen.'
    note: Un conector corto que introduce un contraste, como «pero» en español.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek dice que el té es mejor
    gloss: ¡El té es mejor que el café!
    note: Marek empieza con su propia opinión, que coincide con lo que ya nos contó en la lección sobre preferencias.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa no está de acuerdo
    gloss: ¡No, no! ¡El café es mejor que el té!
    note: Ewa responde con su propia opinión, también coherente con lo que dijo antes.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek cambia de tema y habla de la edad
    gloss: Vale, vale. ¡Pero yo soy más joven que tú!
    note: Marek abandona la discusión sobre las bebidas y saca un tema en el que se siente seguro.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa lo admite y repite su opinión
    gloss: Sí, soy mayor. ¡Pero el café es mejor!
    note: Ewa confirma lo de la edad y vuelve a su opinión sobre el café.
