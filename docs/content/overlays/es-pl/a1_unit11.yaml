teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Querer, quiero
    gloss: querer; quiero
    note: Chcieć es el infinitivo; chcę es la forma cotidiana de la primera persona que usarás para decir lo que quieres.
    example_gloss: Quiero ir al cine.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Tú quieres
    gloss: quieres (informal)
    note: 'Chcesz es la forma informal de «tú», que se usa igual que masz y jesteś: justo lo que usarás para preguntarle a un amigo qué quiere.'
    example_gloss: ¿Quieres café?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Quiero, quieres
    gloss: 'Chcę, chcesz: el mismo patrón que masz (tener) y jesteś (ser/estar). Chcesz es la forma de «tú» (segunda persona), que se usa cuando preguntas a otra persona qué quiere.'
    note: 'Esta unidad necesita algo más que el «yo»: *chcę* (quiero) y *chcesz* (quieres) siguen exactamente el mismo patrón de persona que ya conoces de *masz* y *jesteś*, aplicado a un verbo nuevo.'
  pl.a1.unit11.lesson01.teach.kino:
    title: Cine
    gloss: cine
    note: La palabra cotidiana para el cine; aparece constantemente al hacer planes.
    example_gloss: Esto es el cine.
  pl.a1.unit11.lesson01.teach.razem:
    title: Juntos
    gloss: juntos
    note: Razem también significa «total» al comprar (quizá lo recuerdes de la unidad de compras); aquí se usa en su otro sentido cotidiano, «juntos».
    example_gloss: ¿Quieres ir juntos?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: ¿Quieres ir al cine?
    gloss: ¿Quieres ir al cine?
    note: 'Czy abre una pregunta de sí o no; chcesz iść do kina pregunta qué quiere hacer la otra persona: la forma básica de proponer un plan.'
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: ¿Quieres ir juntos al cine el viernes?
    gloss: ¿Quieres ir juntos al cine el viernes?
    note: 'La propuesta completa: razem (juntos) y w piątek (el viernes) añadidos a la pregunta que acabas de aprender.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Poder, puedo
    gloss: poder; puedo
    note: 'Móc es el infinitivo; mogę es la forma de primera persona. Quizá recuerdes możemy («podemos») de las unidades anteriores de fechas y horas: es el mismo verbo, en singular.'
    example_gloss: Puedo venir el viernes.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Tú puedes
    gloss: puedes (informal)
    note: Możesz es la forma informal de «tú», el mismo patrón de segunda persona que chcesz; sirve para preguntar si otra persona puede hacer algo.
    example_gloss: ¿Puedes el sábado?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Venir
    gloss: venir
    note: El verbo para venir a encontrarse con alguien; combina muy bien con mogę/możesz para decir quién puede o no puede venir.
    example_gloss: Quiero venir el viernes.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Puedo, puedes
    gloss: 'Móc: mogę, możesz: la misma segunda persona (tú) que en chcesz. Mogę más un infinitivo dice lo que puedes hacer: mogę przyjść (puedo venir), mogę iść (puedo ir).'
    note: '*Mogę* + un verbo en infinitivo dice lo que puedes hacer: *mogę przyjść* («puedo venir») y *mogę iść* («puedo ir») siguen este mismo patrón sencillo.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Con gusto
    gloss: con gusto
    note: Una forma cálida y entusiasta de aceptar un plan; suele ir con tak (sí) o bardzo (muy) para dar más calidez.
    example_gloss: ¡Sí, con mucho gusto!
  pl.a1.unit11.lesson02.teach.niestety:
    title: Por desgracia
    gloss: por desgracia
    note: La forma natural de suavizar un rechazo educado a un plan; casi siempre va seguida de nie mogę (no puedo).
    example_gloss: Por desgracia, no puedo.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: El sábado
    gloss: 'W + día de la semana: los días masculinos (piątek, poniedziałek, czwartek) no cambian la terminación: w piątek. Los días femeninos (sobota, środa, niedziela) toman la terminación de acusativo -ę, igual que kawa -> kawę: w sobotę.'
    note: 'No todos los días funcionan igual después de *w*: los nombres de días femeninos como *sobota* cambian a *sobotę*, la misma terminación *-a* -> *-ę* que ya aprendiste con *kawa* -> *kawę* y *herbata* -> *herbatę*. Los días masculinos como *piątek* se quedan tal cual.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: ¿Puedes venir el sábado?
    gloss: ¿Puedes venir el sábado?
    note: 'Reúne możesz, przyjść y la nueva forma w sobotę: una manera completa de preguntar por un día alternativo.'
  pl.a1.unit11.lesson03.teach.moze:
    title: Quizá, ¿qué tal?
    gloss: quizá / ¿qué tal?
    note: La palabra para proponer una alternativa; aparece cuando el primer plan no funciona y quieres sugerir otra cosa.
    example_gloss: ¿Qué tal el sábado?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może frente a mogę
    gloss: 'Może y mogę se parecen, pero significan cosas distintas: może («quizá») propone algo nuevo; mogę (la forma «yo» del verbo, «puedo») dice lo que eres capaz de hacer.'
    note: 'Es fácil confundirlos al leer: *może* («quizá», aquí para sugerir algo) y *mogę* («puedo», verbo en primera persona) cumplen funciones distintas en la frase, aunque tengan la misma raíz. Fíjate en la última letra.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: ¿A qué hora?
    gloss: ¿A qué hora?
    note: La forma estándar de preguntar una hora concreta cuando el día ya está acordado; quizá recuerdes o której de la unidad anterior sobre la hora.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa propone ir al cine
    gloss: Ewa le pregunta a Marek si quiere ir al cine el viernes.
    note: Reutiliza la primera pregunta de esta unidad, ahora dentro de una conversación real.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek no puede el viernes
    gloss: Marek dice que, por desgracia, el viernes no puede.
    note: Niestety suaviza el rechazo antes de que nie mogę lo exprese con claridad.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek propone el sábado
    gloss: 'Marek pregunta: ¿qué tal el sábado?'
    note: Może ofrece una alternativa en lugar de terminar la conversación con un simple rechazo.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa acepta con gusto
    gloss: 'Ewa dice: ¿El sábado? ¡Con mucho gusto!'
    note: Repite el día propuesto (manteniendo la forma w sobotę) antes de aceptar con chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa pregunta la hora
    gloss: 'Ewa pregunta: ¿A qué hora?'
    note: Con el día decidido, el último detalle por acordar es la hora.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek confirma la hora
    gloss: 'Marek dice: A las cuatro de la tarde.'
    note: Cierra la negociación con una hora concreta y acordada, reutilizando el patrón de las horas de las unidades anteriores de hora y rutinas.
