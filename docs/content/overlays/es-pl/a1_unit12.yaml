teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Ayer
    gloss: ayer
    note: La palabra básica para hablar de un día reciente que ya terminó; combina de forma natural con las formas de pasado que se enseñan en esta unidad.
    example_gloss: Ayer estuve en el cine.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: ¿Qué pasó ayer?
    gloss: ¿Qué pasó ayer?
    note: Es la forma natural de pedirle a alguien que cuente algo reciente. Było no cambia según quién responda, así que esta pregunta sirve para cualquier persona.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było es la forma de pasado neutra («ello») de być (ser, estar). Concuerda con co (qué), por eso se usa al preguntar en general qué pasó: Co było wczoraj? Es la misma palabra, responda quien responda.'
    note: '*Było* es la forma neutra de «fue / hubo». Concuerda con *co* (qué), no con la persona a la que preguntas, por eso se entiende como «hubo» o «qué pasó» en una pregunta abierta como *Co było wczoraj?*'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Yo estuve / fui (hombre / mujer)
    gloss: yo estuve / fui (lo dice un hombre) / yo estuve / fui (lo dice una mujer)
    note: 'El pasado en polaco marca el género de quien habla: byłem si habla un hombre, byłam si habla una mujer. Las dos formas significan exactamente «yo estuve / fui».'
    example_gloss:
    - Ayer estuve en el cine.
    - Ayer estuve en el cine.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Pasado: -em frente a -am'
    gloss: 'Los verbos en pasado terminan de forma distinta según el género de quien habla: -em si habla un hombre (byłem), -am si habla una mujer (byłam). Esto vale para todos los verbos en pasado, no solo para być.'
    note: 'Fíjate en las últimas letras: *-em* indica que habla un hombre y *-am* que habla una mujer. Verás este mismo patrón en todos los verbos en pasado de esta unidad.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: En el cine
    gloss: 'Kino cambia su terminación después de w: idę do kina (¿hacia dónde?) usa una forma distinta de jestem w kinie (¿dónde?). W kinie es el locativo: indica DÓNDE ocurre algo, no hacia dónde va alguien.'
    note: 'Dos terminaciones distintas, dos preguntas distintas: *do kina* responde a «¿hacia dónde?» (lo aprendiste en la unidad de planes), mientras que *w kinie* responde a «¿dónde?». No las confundas.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Ayer estuve en el cine (hombre)
    gloss: Ayer estuve en el cine.
    note: 'Reúne byłem, wczoraj y w kinie: así contaría un hombre dónde estuvo.'
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Ayer estuve en el cine (mujer)
    gloss: Ayer estuve en el cine.
    note: 'La misma frase con byłam: así contaría una mujer dónde estuvo.'
  pl.a1.unit12.lesson02.teach.film:
    title: Película
    gloss: película / film
    note: Una palabra cotidiana para hablar de lo que viste; aparece constantemente al contar una ida al cine.
    example_gloss: Vi una buena película.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Bueno
    gloss: bueno
    note: 'Ya viste dobry dentro de dzień dobry (buenos días); aquí se usa solo, como un adjetivo normal: «bueno».'
    example_gloss: ¡Una película muy buena!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Yo vi (hombre / mujer)
    gloss: yo vi (lo dice un hombre) / yo vi (lo dice una mujer)
    note: 'Zobaczyć describe un acto de ver único y terminado (a diferencia de widzieć, ver como estado continuo): zobaczyłem si habla un hombre, zobaczyłam si habla una mujer, con el mismo patrón -em/-am que byłem/byłam.'
    example_gloss:
    - Vi una buena película.
    - Vi una buena película.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: El mismo patrón que byłem/byłam
    gloss: 'El mismo patrón que byłem/byłam: zobaczyłem lo dice un hombre y zobaczyłam una mujer. Zobaczyć es un verbo perfectivo: describe un hecho único y terminado.'
    note: 'La misma terminación, un verbo nuevo: *zobaczyłem/zobaczyłam* sigue exactamente el patrón que acabas de aprender con *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Yo hice (hombre / mujer)
    gloss: yo hice (lo dice un hombre) / yo hice (lo dice una mujer)
    note: 'Zrobić cubre «hacer» tanto en el sentido de preparar como de realizar, para una acción única y terminada: zrobiłem para un hombre, zrobiłam para una mujer, otra vez el mismo patrón.'
    example_gloss:
    - Hice la comida.
    - Hice la comida.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Comida (del mediodía)
    gloss: comida del mediodía / almuerzo
    note: Quizá recuerdes obiad de la unidad de rutinas; aquí es la comida principal del día que prepara Marek.
    example_gloss: Es una comida deliciosa.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Rico
    gloss: rico / delicioso
    note: Una forma cálida y cotidiana de elogiar la comida; sale de forma natural justo después de obiad.
    example_gloss: Es una comida deliciosa.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Qué tipo de / cuál
    gloss: qué tipo de / cuál
    note: 'Ya viste jaki al preguntar por números de teléfono y días de la semana; aquí se usa igual, para pedir un detalle concreto: ¿qué película?'
    example_gloss: ¿Qué película es?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Preguntas breves de una palabra
    gloss: En una conversación puedes hacer una pregunta corta con una sola palabra, por ejemplo Pyszny? en lugar de la pregunta completa Czy obiad był pyszny?; suena natural y rápido, como en la conversación cotidiana.
    note: 'En una conversación real se omite la frase completa cuando el contexto ya lo aclara: *Pyszny?* por sí solo significa «¿Estaba rico?»'
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek pregunta qué pasó
    gloss: ¡Hola, Ewa! ¿Qué pasó ayer?
    note: Retoma la primera pregunta que se enseñó en esta unidad, ahora para abrir una conversación real.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa estuvo en el cine
    gloss: ¡Estuve en el cine! Vi una buena película.
    note: Byłam y zobaczyłam (femeninos) indican que quien habla es Ewa.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek pregunta qué película
    gloss: ¿Qué película?
    note: Una pregunta de seguimiento breve y natural con jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa responde y pregunta a su vez
    gloss: ¡Muy buena! ¿Y tú?
    note: A ty? (¿y tú?) le devuelve la conversación a Marek sin necesitar gramática nueva.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek hizo la comida
    gloss: ¡Hice la comida!
    note: 'Zrobiłem (masculino) indica que habla Marek: es lo que hizo él ese día.'
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa pregunta si estaba rico
    gloss: ¿Rico?
    note: Una pregunta de una sola palabra, exactamente el patrón de la nota gramatical de esta lección.
