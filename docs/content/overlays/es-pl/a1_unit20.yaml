teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: Es, son, esto, quisiera -- otra vez
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- ya conoces estas palabras de lecciones anteriores.
    note: Un breve repaso antes de que esta lección las use para hablar de comprar ropa.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Tienda
    gloss: tienda
    note: La palabra general para un comercio.
    example_gloss: Voy a la tienda.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Camisa
    gloss: camisa
    note: 'Es un sustantivo femenino: llevará formas de adjetivo femeninas.'
    example_gloss: Esto es una camisa.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Pantalones
    gloss: pantalón
    note: 'Siempre es plural en polaco, incluso para un solo pantalón: no existe forma singular.'
    example_gloss: Esto son pantalones.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Comprar
    gloss: comprar
    note: 'Se usa después de «*chcę*» (quiero), igual que «*iść*» (ir) en una lección anterior: «*chcę kupić*» -- quiero comprar.'
    example_gloss: Quiero comprar una camisa.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Quiero comprar pantalones
    gloss: Quiero comprar pantalones.
    note: El mismo patrón chcę + infinitivo, aplicado a los pantalones.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: ¿Cuánto cuesta la camisa?
    gloss: ¿Cuánto cuesta la camisa?
    note: Una forma natural de preguntar el precio de un artículo concreto, reutilizando «*Ile kosztuje*» de la lección de compras.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: Qué tipo de -- forma masculina
    gloss: Jaki, Jaka -- «*Jaki*» pregunta por sustantivos masculinos y «*Jaka*» por sustantivos femeninos (ya conoces «*Jaka*» de la lección del tiempo).
    note: «*Kolor*» (color) es masculino, así que va con «*Jaki*», no con «*Jaka*».
  pl.a1.unit20.lesson02.teach.kolor:
    title: Color
    gloss: color
    note: Un sustantivo masculino.
    example_gloss: ¿De qué color?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Vestido
    gloss: vestido
    note: Otro sustantivo femenino, como «*koszula*».
    example_gloss: Esto es un vestido.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Azul
    gloss: Koszula jest niebieska. -- «*niebieska*» concuerda con sustantivos femeninos, como «*koszula*».
    note: 'Solo esta forma: hasta ahora, en este curso va ligada a «*koszula*».'
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Rojo
    gloss: Sukienka jest czerwona. -- «*czerwona*» también concuerda con sustantivos femeninos, igual que «*niebieska*».
    note: Aquí esta forma va ligada a «*sukienka*», igual que «*niebieska*» a «*koszula*».
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: La camisa es azul
    gloss: La camisa es azul.
    note: Un dato que esta unidad reutilizará más adelante, cuando Marek compre una camisa.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: El vestido es rojo
    gloss: El vestido es rojo.
    note: El mismo patrón jest + color, usado con otra prenda.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: Buen día, por favor, muy -- otra vez
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- ya conoces estas palabras de lecciones anteriores.
    note: Un breve repaso antes del diálogo en la tienda de esta lección.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Talla
    gloss: talla
    note: Las tallas de ropa en Polonia suelen ser simplemente las letras S, M y L, igual que en muchos países hispanohablantes.
    example_gloss: ¿Qué talla?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Señor, quiere
    gloss: Co pan chce kupić? -- «*pan*» es la forma educada de dirigirse a un hombre, igual que «*pani*» a una mujer (ya conoces «*pani*» de la lección de compras).
    note: «*chce*» es la forma de él/ella de «*chcieć*»; ya conoces «*chcę*» (quiero) y «*chcesz*» (quieres).
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: ¿Qué desea comprar, señor?
    gloss: ¿Qué desea comprar, señor?
    note: Cómo un dependiente inicia con cortesía la conversación con un cliente.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: El dependiente saluda a Marek
    gloss: ¡Buenos días! ¿Qué desea comprar, señor?
    note: Sprzedawca (el dependiente) empieza con el mismo registro cortés que usó el vendedor del mercado en la unidad de compras anterior.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek dice lo que quiere
    gloss: Quiero comprar una camisa y unos pantalones.
    note: Marek dice las dos cosas que quiere comprar.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: El dependiente pregunta la talla
    gloss: ¿Qué talla?
    note: Una pregunta de seguimiento corta y natural.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek dice su talla
    gloss: Talla M.
    note: Marek responde solo con la letra de la talla, que es lo más natural.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: El dependiente confirma que hay existencias y dice el precio
    gloss: Tenemos una camisa azul y un pantalón. En total, cien zlotys.
    note: '*Mamy* significa «tenemos» (como *mam*/*masz*). Después de este verbo, *koszula* se convierte en *koszulę* y *niebieska* en *niebieską*, el mismo cambio que viste en *Chcę kupić koszulę*. El color corresponde a la camisa azul de la lección 2.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek acepta
    gloss: Bien, me lo llevo.
    note: Marek confirma la compra y cierra la conversación.
