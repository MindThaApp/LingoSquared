  pl.a1.unit37.lesson03.teach.poprosze_kolor_mowi:
    title: La construcción Poproszę
    gloss: '*Poproszę* + color indica qué color eliges: *Poproszę różowe.* El color termina en *-e* porque los tulipanes están en plural.'
    note: '*Poproszę* («me pone…, por favor») es una forma práctica de pedir o elegir algo. Los colores son adjetivos y concuerdan con el sustantivo: *tulipany* es plural, así que la terminación es *-e* (*różowe*, *czerwone*). Solo, el nombre del color es masculino singular (*różowy*), porque concuerda con *kolor*.'
