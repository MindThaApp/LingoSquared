  pl.a1.unit37.lesson05.teach.nina_i_ewa:
    title: Nina y Ewa compran tulipanes
    gloss: Nina y Ewa van el sábado al mercado de flores. ¿Qué color quiere Ewa? A Ewa le gustaría el rojo. ¿Qué color quiere Nina? A Nina le gustaría el amarillo. Compran cinco tulipanes. Cuesta veinticinco zlotys. ¡Los tulipanes son muy bonitos!
    note: Repasa la excursión del sábado al mercado de flores con una lectura corta, como en otras unidades.
