teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Zwierzę* es la palabra general para «animal»; *zwierzak* es la palabra cotidiana para «mascota».'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Ewa tiene un perro.
    - Tomek tiene un gato.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: Es el mismo patrón de pregunta con *Masz ...?* que ya conoces de unidades anteriores; *masz* es la forma de *ty* de *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*Nie mam* + genitivo niega lo que no tienes: *zwierzaka*. Consulta la nota de gramática.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + genitivo
    gloss: 'Después de *nie mam*, el complemento va en genitivo: *Nie mam czasu* (no tengo tiempo) y aquí *Nie mam zwierzaka* (no tengo mascota).'
    note: Reutiliza el patrón de *Nie mam czasu*; solo cambia el sustantivo. Los sustantivos masculinos animados como *zwierzak* son iguales en acusativo y genitivo, mientras que los femeninos muestran el cambio (*Mam rybę* pasa a *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*Wyprowadzać na spacer* es la expresión fija para pasear a un animal; el verbo es imperfectivo porque se trata de un hábito. Consulta la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfectivo para hábitos
    gloss: '*Wyprowadzać* (imperfectivo) expresa un hábito: *Codziennie wyprowadzam psa.* El perfectivo *wyprowadzić* se usa para un único paseo terminado.'
    note: 'Pares de aspecto: el imperfectivo (*wyprowadzać*) se usa para algo repetido; el perfectivo (*wyprowadzić*), para una acción única y completada.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Jugar con
    gloss: jugar con
    example_gloss: Tomek juega con su gato.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: Combina *wyprowadzać na spacer* con *codziennie* (todos los días); el complemento *psa* está en acusativo.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: '*Karmić* (dar de comer) lleva el acusativo del animal: *karmię kota*. Aquí se combina con *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Plural: pies, psy'
    gloss: 'Plural: *pies* pasa a *psy*, *kot* a *koty*, *ryba* a *ryby*, *ptak* a *ptaki*. La mayoría de los plurales terminan en *-y*, o en *-i* después de k y g.'
    note: El patrón regular del plural en polaco, presentado aquí por primera vez con sustantivos de animales como ejemplo.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Marek le encantan los perros.
    - A Kasia le encantan los gatos.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*Kocham* es la forma de *ja* de *kochać*; su complemento *zwierzęta* está en acusativo plural.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: A Kasia le encantan los gatos, pero no tiene mascota
    gloss: A Kasia le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek pregunta por una mascota
    gloss: 'Marek: ¿Tienes mascota, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa tiene un perro
    gloss: 'Ewa: Sí, tengo un perro.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek pregunta cómo es
    gloss: 'Marek: ¿Cómo es?'
    note: Reutiliza la pregunta *Jak wygląda ...?* de una lección anterior, ahora sobre un animal; *on* puede referirse a un perro.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa describe a su perro
    gloss: 'Ewa: Tiene el pelaje marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On y ona para animales
    gloss: 'Los animales tienen género gramatical: *on* (él) para *pies* y *kot*, *ona* (ella) para *ryba*. Estos pronombres pueden referirse a un animal, no solo a una persona.'
    note: 'El pronombre sigue el género del sustantivo: *pies* y *ptak* llevan *on*, *ryba* lleva *ona* y *zwierzę* lleva *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek pregunta por los paseos
    gloss: 'Marek: ¿Lo sacas a pasear todos los días?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa describe su rutina
    gloss: 'Ewa: Sí, lo saco a pasear todos los días y le doy de comer.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia y Tomek hablan de animales
    gloss: 'A Marek y a Kasia les encantan los animales, pero ninguno de los dos tiene mascota. A Marek le encantan los perros y a Kasia, los gatos. Tomek sí tiene mascota: un gato. A menudo juega con su gato y le da de comer todos los días. ¿Tú tienes mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      kochają: adorar
      oboje: los dos
      zwierzęta: animales
      zwierzaka: mascota
      psy: perros
      koty: gatos
      kota: gato
      bawi: juega
      daje: da
      co: cada
      jeść: comida
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek juega a menudo con su gato
    gloss: Tomek juega a menudo con su gato.
    note: '*Bawić się z* (jugar con) lleva instrumental: *z kotem*. *Często* es el adverbio de frecuencia para «a menudo».'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa pregunta a Nina
    gloss: 'Ewa: Nina, ¿tú también tienes una mascota?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Ma na imię* («se llama») es la misma expresión que se usó antes para presentar un nombre.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek reacciona
    gloss: 'Marek: ¡Qué bonito! ¿Qué haces con él todos los días?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek también adora a los pájaros
    gloss: 'Marek: Yo también adoro a los pájaros.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa cierra la conversación
    gloss: 'Ewa: ¡Qué bien que los tres amemos a los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
