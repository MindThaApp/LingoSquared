teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Plátano
    gloss: plátano
    note: Una fruta muy común, que se vende por unidades o por peso en cualquier mercado o tienda.
    example_gloss: Esto es un plátano.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Tomate, pepino
    gloss: tomate; pepino
    note: 'Ambos son masculinos inanimados: sus formas de genitivo plural (pomidorów, ogórków) te harán falta cuando los compres por kilo, más adelante en esta unidad.'
    example_gloss:
    - Esto es un tomate.
    - Esto es un pepino.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Patata, cebolla
    gloss: patata; cebolla
    note: Ziemniak es masculino inanimado (de la misma familia de genitivo plural en -ów que banan y pomidor); cebula es femenino.
    example_gloss:
    - Esto es una patata.
    - Esto es una cebolla.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Barato, caro
    gloss: barato; caro
    note: '*Tanio* y *drogo* son adverbios, y el polaco los une directamente a *kosztować* («costar»), de modo parecido a «cuesta barato» o «cuesta caro» en español: *To kosztuje drogo* significa literalmente «eso cuesta caro», es decir, «es caro».'
    example_gloss:
    - ¡Muy barato!
    - ¡Muy caro!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Costar: kosztuje, kosztują'
    gloss: 'costar: cuesta (una cosa), cuestan (más de una) -- Un plátano es barato. Los plátanos son baratos.'
    note: '*Kosztować* es el verbo «costar». Usa *kosztuje* para un solo artículo y *kosztują* para más de uno, igual que *jest*/*są* («es»/«son»), pero para precios. Acertar con esta concordancia es importante: un vendedor del mercado te entenderá de las dos maneras, pero *banany kosztują* es lo que dice realmente un hablante nativo.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: ¿Cuánto cuesta un plátano?
    gloss: ¿Cuánto cuesta un plátano?
    note: 'La pregunta habitual para empezar a hablar de precios: *Ile* («cuánto») más *kosztuje* en singular, porque se pregunta por un solo plátano.'
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Pomelo
    gloss: pomelo
    note: 'Masculino inanimado, como pomidor y ziemniak: no cambia de terminación después de proszę o.'
    example_gloss: Esto es un pomelo.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarina, naranja
    gloss: mandarina; naranja
    note: 'Ambas son femeninas, como kawa y herbata en la unidad de comida: en acusativo cambiarían -a por -ę, aunque esta lección solo necesita su forma de diccionario.'
    example_gloss:
    - Esto es una mandarina.
    - Esto es una naranja.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Un kilo, medio kilo
    gloss: un kilo; medio kilo
    note: '*Kilo* nunca cambia de terminación, sin importar lo que peses ni cuántos kilos pidas: lo que cambia es el sustantivo que va después de *kilo*, como explica la nota de gramática de esta lección.'
    example_gloss:
    - Un kilo de tomates, por favor.
    - Medio kilo de plátanos, por favor.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Quisiera (por favor)
    gloss: quisiera / deme, por favor
    note: '*Poproszę* es una alternativa algo más pulida y cotidiana a *proszę o*, de la unidad de comida: ambas significan más o menos «quisiera», y los polacos pasan de una a otra con libertad. *Poproszę* va seguido directamente de lo que quieres, sin necesidad de *o*.'
    example_gloss: Quisiera un pomelo, por favor.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'Después de ''kilo'': la terminación -ów'
    gloss: 'Genitivo plural después de ''kilo'': plátano -> de plátanos, tomate -> de tomates, patata -> de patatas.'
    note: 'Cuando indicas una cantidad por peso (*kilo*, *pół kilo*), el sustantivo que sigue pasa a otra forma, el genitivo plural. Para estos tres sustantivos masculinos regulares, basta con añadir *-ów*: *banan* se convierte en *bananów*, *pomidor* en *pomidorów* y *ziemniak* en *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Un kilo de tomates, por favor
    gloss: Un kilo de tomates, por favor.
    note: 'Pone en práctica el patrón en -ów de la nota de gramática en una petición real: pomidor se convierte en pomidorów después de kilo.'
  pl.a1.unit07.lesson03.teach.dla:
    title: Para
    gloss: para
    note: 'Una preposición sencilla que significa «para»: el vendedor la usa en *Co dla pani?* (literalmente «¿qué para usted?») para preguntar con educación a la clienta qué desea.'
    example_gloss: Esto es para ti.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Fresco, muy
    gloss: fresco; muy
    note: 'Dos palabras cotidianas que un vendedor del mercado usa constantemente: para alabar lo fresco que es un producto o lo barato o caro que está.'
    example_gloss:
    - Los tomates están frescos.
    - ¡Muy barato!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Un poco
    gloss: un poco
    note: 'Suaviza una queja con educación: trochę drogo («un poco caro») resulta mucho más natural en un regateo amistoso que un drogo a secas.'
    example_gloss: Un poco caro.
  pl.a1.unit07.lesson03.teach.razem:
    title: En total / juntos
    gloss: en total / juntos
    note: Lo que dice el vendedor justo antes de decir la cantidad final que debes pagar.
    example_gloss: Diez zlotys en total.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: ¿Qué quieres?
    gloss: ¿Qué desea?
    note: 'Literalmente «¿qué para usted?» (formal): la pregunta con la que el vendedor suele dirigirse a un cliente.'
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: El vendedor saluda a Ewa
    gloss: El vendedor la saluda y le pregunta a Ewa qué desea.
    note: Dzień dobry, reutilizado de los saludos de la unidad 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa pregunta por los plátanos
    gloss: Ewa pregunta cuánto cuestan los plátanos.
    note: 'Kosztują: la forma plural de la gramática de esta unidad, ya que se pregunta por los plátanos en conjunto.'
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: El vendedor dice el precio
    gloss: El vendedor dice que cuestan cinco eslotis el kilo y que están muy frescos.
    note: 'Una frase de precio elíptica y muy natural: «[precio] kilo» es como un vendedor polaco indica el precio por kilo, sin ninguna palabra para «por».'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa pide plátanos
    gloss: Ewa dice que de acuerdo y pide un kilo de plátanos.
    note: Combina poproszę con kilo + bananów, el mismo patrón de la nota de gramática de la lección 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: El vendedor menciona los tomates
    gloss: El vendedor pregunta si también quiere tomates y dice que cuestan ocho eslotis el kilo.
    note: El mismo patrón elíptico de precio que en la línea 3, ahora para otro producto.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa se queja con suavidad y pide
    gloss: Ewa dice que es un poco caro, pero pide medio kilo.
    note: 'Trochę drogo suaviza la queja: Ewa compra igualmente, solo que una cantidad menor.'
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: El vendedor dice el total
    gloss: El vendedor dice «aquí tiene» y que el total son nueve eslotis.
    note: '5 złotych por los plátanos más 4 złotych por el medio kilo de tomates: nueve złotych en total, coherente con todos los precios dichos antes en la escena.'
