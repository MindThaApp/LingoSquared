  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Verbos para un mensaje: enviar y leer'
    gloss: Ya conoces *prognoza pogody* (la previsión del tiempo). *Wiadomość* es un mensaje que puedes enviar (*wysyłam*, *wysyłasz*) o leer (*czytam*, *czytasz*).
    note: Une la palabra nueva con el sustantivo compuesto que ya se enseñó en la unidad del tiempo.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa envía un mensaje por la aplicación
    gloss: Ewa envía un mensaje por la aplicación.
    note: '*Wysyłać* (enviar) usa *przez* + acusativo para el canal: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
    title: Marek lee el mensaje
    gloss: Marek lee el mensaje.
  pl.a1.unit29.lesson03.teach.sprawdzac:
    title: Buscar
    gloss: buscar
    example_gloss: Consulto la previsión del tiempo.
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Dos verbos, dos casos
    gloss: '*Sprawdzam* lleva acusativo: *prognozę pogody*. *Używam* lleva genitivo: *telefonu*.'
    note: La mayoría de los verbos llevan acusativo, pero *używać* es una excepción y necesita genitivo.
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
    title: Tomek consulta la previsión del tiempo
    gloss: Tomek consulta la previsión del tiempo.
  pl.a1.unit29.lesson03.teach.potem_idzie_biegac:
    title: Luego se va a correr
    gloss: Luego se va a correr.
    note: '*Idzie biegać* significa va a correr: *iść* + infinitivo.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa propone
    gloss: 'Ewa: ¿Hacemos ejercicio el sábado a las diez?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek acepta
    gloss: 'Marek: ¡Buena idea! Voy a consultar la previsión del tiempo.'
    note: '*Dobry pomysł!* es una respuesta corta a una propuesta; el adjetivo *dobry* concuerda con *pomysł*, que es masculino.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek comprueba el tiempo
    gloss: 'Marek: ¡El sábado hace sol!'
    note: '*Słonecznie* es un adverbio: *jest słonecznie* significa hace sol, y no hace falta sujeto.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek ve el mensaje
    gloss: 'Tomek: Veo el mensaje. ¡Hasta el sábado!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia y do + un día
    gloss: 'Ya conoces *Do widzenia!* También puedes nombrar un día: *Do soboty!*, *Do jutra!* (después de *do* va el genitivo).'
    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: ¿Quién usa qué?
    gloss: Ewa llama a Marek todos los días. Usa el teléfono, no una aplicación. Marek no tiene ordenador en casa, pero usa internet en el teléfono. Tomek consulta el pronóstico del tiempo cada mañana. Después sale a correr. Kasia envía mensajes a Ewa con frecuencia. ¿Tú también usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
    glosses:
      dzwoni: llama
      każdego: cada
      dnia: día
      używa: usa
      telefonu: teléfono
      aplikacji: aplicación
      komputera: ordenador
      domu: en casa
      internetu: internet
      sprawdza: consulta
      ranka: mañana
      prognozę: pronóstico del tiempo
      idzie: va
      biegać: a correr
      wysyła: envía
      często: a menudo
      wiadomość: mensaje
      używasz: usar
  pl.a1.unit29.lesson05.teach.tomek_kazdego_ranka:
    title: Tomek consulta el pronóstico cada mañana
    gloss: Tomek consulta el pronóstico del tiempo cada mañana.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Kasia escribe a menudo a Ewa
    gloss: Kasia envía a menudo un mensaje a Ewa.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Ewa confirma el plan
    gloss: 'Ewa: Veo el mensaje. ¿Hacemos ejercicio el sábado a las diez en el parque?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Marek confirma el tiempo
    gloss: 'Marek: Sí, ¡y el sábado hará sol!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: El plan de Tomek
    gloss: 'Tomek: Entonces correré un rato. Después también jugaré al fútbol.'
    note: '*Wtedy* (entonces) y *potem* (después) marcan el orden de los hechos; *pobiegam* y *zagram* son perfectivos, por eso suenan a planes.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: El plan de Kasia
    gloss: 'Kasia: Prefiero nadar, pero yo también iré al parque.'
    note: '*Wolę* significa «prefiero» y va seguido de un infinitivo: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Ewa cierra la conversación
    gloss: 'Ewa: ¡Genial! ¡Hasta el sábado en el parque!'
    note: Cierra en una sola línea el hilo de mensajes de esta unidad y el plan de la unidad de deportes.
