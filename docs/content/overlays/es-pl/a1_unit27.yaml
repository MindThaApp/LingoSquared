    title: Un verbo para cada deporte
    gloss: 'Cada deporte tiene su propio verbo: *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: 'No hace falta aprender un verbo distinto para cada deporte en este nivel: basta con fare o giocare a.'
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
