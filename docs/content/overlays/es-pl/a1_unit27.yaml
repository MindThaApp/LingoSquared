    title: Ewa y Kasia hablan de deporte
    gloss: Ewa hace yoga dos veces por semana. Le encanta el movimiento tranquilo. Kasia no hace yoga, pero le encanta nadar. Kasia nada a menudo, casi todas las semanas. ¿Qué deporte practicas tú?
    note: Contrasta dos deportes distintos y dos expresiones de frecuencia distintas en una lectura breve.
