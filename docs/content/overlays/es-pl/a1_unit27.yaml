  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport frente a gram w
    gloss: '*Uprawiam sport* dice en general que haces deporte. Un verbo como *gram w piłkę nożną* nombra el deporte concreto. Ambos son polaco correcto.'
    note: '*Uprawiać sport* es el verbo general de la lección de aficiones; verbos como *grać w* nombran el deporte concreto. Uno es general y el otro, específico.'
