  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać cambia según la persona
    gloss: '*Biegać* (correr) cambia de terminación según la persona: *biegam* (yo corro), *biegasz* (tú corres), *biega* (él corre).'
    note: 'Los verbos polacos tienen una terminación distinta para cada persona, por eso normalmente se omite el pronombre sujeto, como en español: *biegam*, *biegasz*, *biega*.'
