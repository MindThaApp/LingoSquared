  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: Ya conoces *codziennie* (todos los días) y *często* (a menudo). *Dwa razy w tygodniu* (dos veces por semana) es una forma nueva y más precisa de decir con qué frecuencia haces algo.
    note: Amplía el vocabulario de frecuencia que ya se vio en la unidad de pasatiempos.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
