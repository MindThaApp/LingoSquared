teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Soy ingeniero / profesora
    gloss: Soy ingeniero. Soy profesora. -- «inżynier» y «nauczycielka» cambian de terminación después de «Jestem».
    note: Es la primera vez en este curso que la terminación de una palabra cambia para indicar cuál es tu profesión; por ahora solo ocurre con estas dos palabras de profesión.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Ingeniero
    gloss: ingeniero
    note: En el polaco cotidiano, esta palabra normalmente se queda como *inżynier* también para una mujer.
    example_gloss: Marek es ingeniero.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Profesora
    gloss: profesor (masculino) / profesora (femenino)
    note: 'A diferencia de *inżynier*, esta palabra de profesión sí cambia según el género: *nauczyciel* para un hombre, *nauczycielka* para una mujer.'
    example_gloss:
    - Él es profesor.
    - Ewa es profesora.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek y Ewa, otra vez
    gloss: Marek, Ewa -- ya conoces estos nombres de lecciones anteriores.
    note: Un breve repaso antes de que esta lección use ambos.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Es / está -- otra vez
    gloss: Jest -- ya conoces esta palabra de lecciones anteriores, p. ej. «Dom jest tam» (la casa está allí).
    note: Un breve repaso antes de que esta lección la use para hablar de la profesión de alguien.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: La profesión de Marek
    gloss: Marek es ingeniero.
    note: El dato en el que se basa toda esta unidad para Marek.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: La profesión de Ewa
    gloss: Ewa es profesora.
    note: El dato en el que se basa toda esta unidad para Ewa.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Trabajar -- tú trabajas
    gloss: 'Pracować (ya conoces pracuję de lecciones anteriores): pracuję (yo), pracujesz (tú). ¿Dónde trabajas?'
    note: 'Por ahora solo dos formas: *pracuję* para hablar de ti y *pracujesz* para preguntar a otra persona, con el mismo patrón que *czuć się* en la unidad anterior.'
  pl.a1.unit17.lesson02.teach.szkola:
    title: Escuela
    gloss: escuela
    note: Donde trabaja una profesora como Ewa.
    example_gloss: Trabajo en una escuela.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Oficina
    gloss: oficina
    note: Donde trabaja un ingeniero como Marek.
    example_gloss: Trabajo en una oficina.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: En la escuela, en la oficina
    gloss: 'W + lugar de trabajo: w szkole, w biurze -- el mismo patrón que w Warszawie o w Krakowie.'
    note: 'Es la misma idea que con los nombres de ciudades que ya aprendiste (*w Warszawie*, *w Krakowie*): la terminación cambia un poco para decir *en* ese lugar.'
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: ¿Dónde trabajas?
    gloss: ¿Dónde trabajas?
    note: La pregunta natural para preguntar por el trabajo de alguien.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: Y tú -- otra vez
    gloss: A ty -- ya conoces esta expresión de lecciones anteriores.
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek le pregunta a Ewa por su trabajo
    gloss: ¿Dónde trabajas, Ewa?
    note: Marek empieza la conversación con una pregunta directa.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa responde
    gloss: Trabajo en una escuela. Soy profesora.
    note: Ewa dice su lugar de trabajo y su profesión, los mismos datos vistos antes en esta unidad.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa le pregunta a Marek
    gloss: ¿Y tú, Marek? ¿Dónde trabajas?
    note: Ewa le devuelve la pregunta a Marek.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek responde
    gloss: Trabajo en una oficina. Soy ingeniero.
    note: Marek dice su lugar de trabajo y su profesión, los mismos datos vistos antes en esta unidad.
