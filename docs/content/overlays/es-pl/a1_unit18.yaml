teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: 'Casa, es, tiene: otra vez'
    gloss: 'Dom, jest, ma, Marek, Ewa: ya conoces estas palabras de lecciones anteriores, p. ej. ''Dom jest tam'' (la casa está allí).'
    note: Un breve repaso antes de que esta lección las use para hablar de tu casa.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Apartamento
    gloss: apartamento
    note: Un piso, no una casa entera.
    example_gloss: Ewa tiene un apartamento.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Grande
    gloss: La casa es grande. -- '*duży*' va con sustantivos masculinos, como '*dom*.'
    note: Es la primera vez en este curso que una palabra describe el tamaño; por ahora solo se aplica a '*dom*.'
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: La casa de Marek
    gloss: Marek tiene una casa. La casa es grande.
    note: El dato en el que se basa toda esta unidad para Marek.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: La casa de Ewa
    gloss: Ewa tiene un apartamento.
    note: El dato en el que se basa toda esta unidad para Ewa.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Habitación
    gloss: habitación
    note: Una palabra general para cualquier habitación de una vivienda.
    example_gloss: ¿Dónde está la habitación?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: ¿Cuántas habitaciones?
    gloss: ¿Cuántas habitaciones tienes? Tengo dos habitaciones. -- ya conoces 'Ile', los números y 'mam'/'masz' de lecciones anteriores; '*pokoi*' y '*pokoje*' son formas de la palabra '*pokój*.'
    note: '''*Pokoi*'' se usa justo después de ''*Ile*''; ''*pokoje*'' se usa justo después de ''*dwa*'', ''*trzy*'' o ''*cztery*'' (dos, tres, cuatro).'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: ¿Cuántas habitaciones tienes?
    gloss: ¿Cuántas habitaciones tienes?
    note: Una pregunta natural sobre la casa de alguien.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: Tengo dos habitaciones
    gloss: Tengo dos habitaciones.
    note: Una respuesta natural a la pregunta anterior.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Cocina
    gloss: cocina
    note: Una de las habitaciones más comunes de una vivienda.
    example_gloss: La cocina es pequeña.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Pequeño
    gloss: La cocina es pequeña. -- '*mała*' va con sustantivos femeninos, como '*kuchnia*.'
    note: Es una palabra distinta de '*duży*' (grande); por ahora solo se aplica a '*kuchnia*.'
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Dormitorio
    gloss: dormitorio
    note: La habitación donde duermes.
    example_gloss: ¿Dónde está el dormitorio?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Baño
    gloss: baño
    note: La habitación con la ducha y el váter.
    example_gloss: ¿Dónde está el baño?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: 'Dónde, allí: otra vez'
    gloss: 'Gdzie, tam: ya conoces estas palabras de lecciones anteriores, p. ej. ''Bank jest tam'' (el banco está allí).'
    note: Un breve repaso antes de que esta lección las use para hablar de habitaciones.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: En la habitación, en la cocina...
    gloss: 'W + habitación, cocina, dormitorio, baño: w pokoju, w kuchni, w sypialni, w łazience: el mismo patrón que w szkole (en la escuela) o w biurze (en la oficina).'
    note: 'Es la misma idea que en las palabras de lugares de trabajo que ya aprendiste: la terminación cambia un poco para decir «en» esa habitación.'
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: ¿Dónde está el baño?
    gloss: ¿Dónde está el baño? El baño está allí.
    note: Un intercambio natural para encontrar una habitación en casa de alguien.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: La cocina es pequeña
    gloss: La cocina es pequeña.
    note: Se reutiliza la palabra de tamaño vista antes en esta lección.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: 'Sí, y, son: otra vez'
    gloss: 'Tak, i, są, A, ja, jeden: ya conoces estas palabras de lecciones anteriores.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Nevera
    gloss: nevera / frigorífico
    note: Un electrodoméstico común de la cocina.
    example_gloss: Hay una nevera en la cocina.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Horno
    gloss: horno
    note: Otro electrodoméstico común de la cocina.
    example_gloss: Hay un horno en la cocina.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek describe su casa
    gloss: Tengo una casa. La casa es grande.
    note: Marek abre la conversación describiendo su casa.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa pregunta por las habitaciones
    gloss: ¿Cuántas habitaciones tienes?
    note: Ewa hace una pregunta natural de seguimiento.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek responde
    gloss: Tengo dos habitaciones. En la casa hay una cocina, un dormitorio y un baño.
    note: Marek dice cuántas habitaciones tiene y enumera las de su casa.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa describe su casa
    gloss: Y yo tengo un apartamento. Tengo una habitación.
    note: Ewa pasa a describir su propia casa, más pequeña.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa pregunta por la cocina
    gloss: ¿La cocina es pequeña?
    note: Ewa le hace a Marek otra pregunta sobre su cocina.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek responde
    gloss: Sí, la cocina es pequeña. En la cocina hay una nevera y un horno.
    note: Marek confirma el tamaño de la cocina y nombra dos objetos que hay en ella.
