teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Ir, llegar a
    gloss: ir; llegar a
    note: 'Dos verbos de movimiento muy relacionados: iść es el general «ir/caminar» y dojść es específicamente «llegar a» un destino, y se usa en el patrón de pregunta que enseña esta lección.'
    example_gloss:
    - Vaya todo recto, por favor.
    - ¿Cómo llego al banco?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Todo recto
    gloss: todo recto
    note: La palabra de dirección más básica; se usa justo después de iść para decir «ir todo recto».
    example_gloss: Vaya todo recto hasta el parque, por favor.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Allí, luego
    gloss: allí; luego
    note: Tam señala un lugar; potem ordena los pasos («primero esto, luego aquello»). Ambas son esenciales para encadenar indicaciones.
    example_gloss:
    - El banco está allí.
    - Luego, vaya todo recto, por favor.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Por favor + infinitivo -- Proszę (por favor) más un verbo en infinitivo (bezokolicznik) es la forma educada y habitual de dar una indicación, sin necesitar una forma de mandato aparte: Proszę iść prosto.'
    note: '*Proszę* más un verbo en infinitivo es la manera educada de pedir a alguien que haga algo en polaco: *Proszę iść prosto* («Vaya todo recto, por favor»). Es la opción segura con un desconocido, así que no necesitas la «forma de mandato» para dar o entender indicaciones. (Entre amigos, lo normal es usar esa forma de mandato; la verás más adelante).'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: ¿Cómo llego a + [lugar]?
    gloss: '¿Cómo llego a + [lugar]? -- Jak (cómo) más dojść (llegar a) sirve para preguntar el camino a un lugar: Jak dojść do banku? Jak dojść do hotelu? Jak dojść do parku? El sustantivo después de do lleva la misma terminación de genitivo -u que después de obok/naprzeciwko en la unidad anterior: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* es la pregunta habitual para saber cómo llegar a un lugar. El nombre del lugar que sigue a *do* lleva la misma terminación de genitivo *-u* que ya aprendiste después de *obok*/*naprzeciwko*: *bank* pasa a *banku*, *hotel* a *hotelu* y *park* a *parku*; es exactamente el mismo patrón, solo que con una preposición nueva.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: ¿Cómo llego al banco?
    gloss: ¿Cómo llego al banco?
    note: El patrón de la nota gramatical aplicado al primer destino de esta lección.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Derecha, izquierda
    gloss: derecha; izquierda
    note: 'Se usa después de na para decir dónde está algo o hacia qué lado girar: na prawo (a/en la derecha), na lewo (a/en la izquierda).'
    example_gloss:
    - El banco está a la derecha.
    - El parque está a la izquierda.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Girar
    gloss: girar
    note: El verbo para cambiar de dirección; con na prawo/na lewo significa «girar a la derecha»/«girar a la izquierda».
    example_gloss: Por favor, gire a la derecha.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Por favor, gire a la izquierda
    gloss: Por favor, gire a la izquierda.
    note: El mismo patrón Proszę + infinitivo, esta vez con skręcić y na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Calle
    gloss: calle
    note: Una palabra corriente para cualquier calle; es útil cuando las indicaciones mencionan una por su nombre.
    example_gloss: La calle está allí.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Encadenar indicaciones con potem
    gloss: 'Proszę iść prosto, potem skręcić na prawo. -- Varias indicaciones se pueden encadenar con una coma y la palabra potem (luego): primero una acción, después la siguiente.'
    note: 'Para dar más de una indicación seguida, basta unirlas con una coma y *potem*: *Proszę iść prosto, potem skręcić na prawo* («Por favor, vaya recto, luego gire a la derecha»). Así se construyen las indicaciones de varios pasos que oirás en la vida real.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Entiendo
    gloss: entiendo
    note: Una forma útil de confirmar que has seguido las indicaciones antes de hacer otra pregunta.
    example_gloss: Entiendo, gracias.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa pregunta cómo llegar al parque
    gloss: Ewa pide disculpas para llamar la atención y pregunta cómo llegar al parque.
    note: Przepraszam abre la pregunta, la misma costumbre de cortesía del diálogo sobre lugares de la unidad anterior.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Un transeúnte indica el camino al parque
    gloss: El transeúnte dice que siga recto y luego gire a la izquierda. El parque está allí.
    note: Dos indicaciones encadenadas con potem, tal como describe la nota de gramática de esta lección.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa confirma y pregunta por el banco
    gloss: Ewa dice que entiende y pregunta cómo llegar al banco.
    note: Rozumiem confirma que ha seguido las primeras indicaciones antes de hacer una nueva pregunta.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: El transeúnte indica el camino al banco
    gloss: El transeúnte dice que gire a la derecha y luego siga recto. El banco está a la derecha.
    note: Otro recorrido de dos pasos distinto al del parque, con el mismo patrón Proszę + infinitivo.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa da las gracias
    gloss: Ewa dice muchas gracias.
    note: Dziękuję bardzo, ya visto en las unidades de compras y de lugares.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: El transeúnte responde
    gloss: El transeúnte dice de nada.
    note: Proszę bardzo, la respuesta habitual a un agradecimiento, ya vista en unidades anteriores.
