teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Contento, triste y enfadado
    gloss: contento, triste, enfadado
    note: Tres palabras básicas para sentimientos que se usan con *jestem* (estoy/soy). Son formas masculinas; una mujer dice *szczęśliwa, smutna, zła*.
    example_gloss:
    - Estoy contento.
    - Estoy triste.
    - Estoy enfadado.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Decir que estás contento
    gloss: Estoy contento.
    note: '*Jestem* (soy/estoy, de *być*) + adjetivo es el patrón básico, como «estoy contento» o «soy feliz» en español. El adjetivo concuerda con quien habla: *szczęśliwy* (hombre), *szczęśliwa* (mujer).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Contrastar sentimientos
    gloss: No estoy enfadado, estoy triste.
    note: '*Nie* va justo antes del verbo: *Nie jestem zły*. La segunda oración dice entonces el sentimiento real.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Preguntar por qué
    gloss: ¿Por qué estás contento?
    note: '*Dlaczego* (por qué) es la palabra interrogativa habitual para preguntar por una razón.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Dar una razón
    gloss: Estoy contento porque tengo un apartamento nuevo.
    note: '*Bo* (porque) introduce la razón; después de *mam* (tengo) el sustantivo va en acusativo: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Una razón negativa
    gloss: Estoy triste porque llueve.
    note: '*Pada deszcz* (está lloviendo, literalmente «cae lluvia») es la expresión habitual para el tiempo; aquí se usa como razón.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nervioso
    gloss: nervioso
    note: La palabra habitual para el nerviosismo.
    example_gloss: Estoy nervioso por mi primer turno.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Decir por qué estás nervioso
    gloss: Estoy nervioso por mi primer turno.
    note: '*Przed* (literalmente «antes de», «ante») + instrumental indica por qué te pones nervioso, donde en español se usa «por» o «antes de»: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Tranquilizar a alguien
    gloss: No te preocupes.
    note: '*Nie martw się* (literalmente «no te preocupes a ti mismo») es la frase habitual para tranquilizar; *się* es el pronombre reflexivo.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo se siente Marek?
    note: '*Czuć się* (sentirse, reflexivo) es la forma habitual de preguntar o describir un estado de ánimo: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Describir cómo se siente alguien
    gloss: Él se siente nervioso.
    note: '*Się* se queda con el verbo: *on czuje się*. El adjetivo es masculino para concordar con *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Preguntar por qué alguien se siente así
    gloss: ¿Por qué se siente nervioso?
    note: Combina *dlaczego* (por qué) con el patrón *czuje się* de *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Lee un mensaje sobre sentimientos
    gloss: Hola, Ewa, estoy un poco nervioso por mi primer turno yo solo. Pero también estoy feliz, porque tengo un trabajo nuevo y un piso nuevo. Creo que saldrá bien.
    note: Fíjate en por qué está nervioso el autor, qué lo hace feliz y cómo ve el futuro en general.
    glosses:
      trochę: un poco
      zdenerwowany: nervioso
      pierwszą: primer
      zmianą: turno
      samodzielną: solo
      szczęśliwy: contento
      bo: porque
      nową: nuevo
      pracę: trabajo
      nowe: nuevo
      mieszkanie: apartamento
      myślę: creo
      będzie: irá (bien)
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa pregunta cómo se siente Marek
    gloss: 'Ewa: Hola, Marek, ¿cómo te sientes ante tu primer turno?'
    note: '*Przed pierwszą zmianą* (ante tu primer turno) reutiliza el patrón *przed* + instrumental de la lección 3. *Czujesz się* es la forma de *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek admite que está nervioso
    gloss: 'Marek: Sinceramente, estoy un poco nervioso.'
    note: '*Szczerze mówiąc* (sinceramente, literalmente «hablando con sinceridad») suaviza la confesión.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa lo tranquiliza
    gloss: 'Ewa: No te preocupes, ¡lo harás muy bien!'
    note: '*Dobrze sobie poradzisz* (literalmente «te las arreglarás bien») es una expresión fija de ánimo; *poradzisz* es el futuro de *ty* de *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek le da las gracias
    gloss: 'Marek: Gracias, de verdad que ayuda.'
    note: '*Pomaga* es la forma de *on/ona/ono* de *pomagać* (ayudar); *dzięki* es «gracias» en registro informal.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa predice cómo acabará
    gloss: 'Ewa: Y después seguro que estarás muy feliz y orgulloso.'
    note: '*Na pewno* (seguro) expresa una predicción con confianza; *dumny* (orgulloso) es un adjetivo nuevo y útil. *Będziesz* es el futuro de *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek está de acuerdo
    gloss: 'Marek: Sí, yo también lo creo.'
    note: '*Ja też tak myślę* (literalmente «yo también así pienso») es la forma natural de mostrar acuerdo; aquí se añade *ja* para dar énfasis.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Resumir con jest y mu
    gloss: Marek está nervioso por su primer turno. Ewa le ayuda.
    note: '*Jest* es la forma de *on/ona* de *być* (ser/estar); *mu* significa «le» (dativo, porque *pomagać* lleva dativo). Son palabras pequeñas, pero esenciales para hablar de otra persona.'
