teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Levantarse, me levanto
    gloss: levantarse; me levanto
    note: Wstawać es el infinitivo; wstaję es la forma cotidiana de primera persona que usarás para hablar de tu propia rutina.
    example_gloss: Me levanto a las siete de la mañana.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Comer, como
    gloss: comer; como
    note: 'Jeść es algo irregular, pero jem («como») es la forma que más usarás: así dice un polaco «como» para cualquier comida.'
    example_gloss: Desayuno por la mañana.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: El desayuno
    gloss: el desayuno
    note: 'Śniadanie no cambia de forma después de jem: «desayuno» es simplemente jem śniadanie, sin terminación extra que aprender.'
    example_gloss: Por la mañana desayuno.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Beber, bebo
    gloss: beber; bebo
    note: Pić es el infinitivo; piję es la forma de primera persona, que se usa igual que jem y wstaję.
    example_gloss: Por la mañana tomo café.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Hablar de ti mismo
    gloss: Wstaję, jem, piję -- en esta unidad solo hablamos de nosotros mismos, en primera persona (yo), igual que cuando describes tu propio día.
    note: Toda esta unidad se centra a propósito en la forma de «yo» de cada verbo -- *wstaję* (me levanto), *jem* (como), *piję* (bebo) -- para que te concentres en describir tu propia rutina sin aprender a la vez cómo cambia cada verbo para «tú», «él» o «ella».
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Me levanto a las siete de la mañana
    gloss: Me levanto a las siete de la mañana.
    note: 'El patrón de la nota de gramática en acción: o + la forma locativa de la hora (siódmej) significa «a» esa hora, igual que en la unidad anterior sobre la hora.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Desayuno y bebo café
    gloss: Desayuno y bebo café.
    note: 'Dos verbos en primera persona unidos con i (y): una forma natural de enumerar tus actividades de la mañana.'
  pl.a1.unit10.lesson02.teach.obiad:
    title: La comida (almuerzo)
    gloss: comida / almuerzo
    note: 'Igual que śniadanie, obiad no cambia de forma después de jem: jem obiad significa simplemente «como el almuerzo».'
    example_gloss: Almuerzo al mediodía.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Trabajar, yo trabajo
    gloss: trabajar; yo trabajo
    note: Pracować sigue el mismo patrón -ować -> -uję que kosztować -> kosztuje de la unidad de compras, pero ahora en primera persona.
    example_gloss: Trabajo por la tarde.
  pl.a1.unit10.lesson02.teach.dom:
    title: La casa
    gloss: casa / hogar
    note: La palabra cotidiana para «casa»; aparece constantemente en la expresión «ir/volver a casa».
    example_gloss: La casa está allí.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: A casa
    gloss: 'A casa: do se usa con el genitivo, y el genitivo de dom termina en -u: domu, igual que bank -> banku, park -> parku, hotel -> hotelu.'
    note: '*Do domu* («a casa», como en «voy a casa») usa la misma terminación de genitivo *-u* que ya aprendiste después de *do* con bank, hotel y park: un sustantivo más que sigue el mismo patrón.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Volver, yo vuelvo
    gloss: volver / regresar; yo vuelvo / regreso
    note: 'Se usa con do domu para decir «vuelvo a casa»: una de las frases más comunes y cotidianas en polaco.'
    example_gloss: Vuelvo a casa por la noche.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: Al mediodía, por la tarde, por la noche
    gloss: al mediodía; por la tarde; al anochecer / por la noche
    note: 'Repaso de la unidad anterior sobre la hora: junto con rano y w nocy, estas expresiones cubren todo el día.'
    example_gloss:
    - Almuerzo al mediodía.
    - Trabajo por la tarde.
    - Vuelvo a casa por la noche.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Trabajo por la tarde y luego vuelvo a casa
    gloss: Trabajo por la tarde, luego vuelvo a casa.
    note: El mismo patrón de coma + potem de la unidad de direcciones, ahora para unir dos partes de una rutina diaria.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Dormir, yo duermo
    gloss: dormir; yo duermo
    note: Śpię tiene un cambio de vocal que parece irregular respecto al infinitivo spać, pero es un verbo muy frecuente que conviene memorizar tal cual.
    example_gloss: Duermo de noche.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: ¿Y tú? Yo también.
    gloss: ¿Y tú? / Yo también.
    note: A ty? es la forma sencilla de devolver la palabra a la otra persona; ja też significa «yo también». Ambas aparecen constantemente en la conversación cotidiana.
    example_gloss: Yo también desayuno por la mañana.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Pero, té, no
    gloss: pero; té (como complemento directo); no
    note: 'Ale introduce un contraste; nie justo delante de una palabra (y no de un verbo) significa «no [eso]»: piję herbatę, nie kawę significa «bebo té, no café».'
    example_gloss: Bebo té, pero no café.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Temprano, a las diez
    gloss: 'temprano; a las diez: la misma terminación -ej en las horas después de o que czwartej y siódmej de la lección anterior.'
    note: '*O dziesiątej* («a las diez») repite el mismo patrón de horas que ya conoces: *dziesiąta* pasa a *dziesiątej* después de *o*, igual que *czwarta* -> *czwartej* y *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa describe su mañana
    gloss: Ewa dice que se levanta a las siete de la mañana y bebe café.
    note: Retoma el primer patrón de oración de esta unidad, ahora dentro de una conversación real.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa sigue contando su día
    gloss: Ewa dice que desayuna y luego trabaja por la tarde.
    note: Encadena dos actividades en primera persona con potem, el mismo patrón de la lección 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa termina y le pregunta a Marek
    gloss: Ewa dice que vuelve a casa por la noche. ¿Y tú?
    note: A ty? le pasa la palabra a Marek sin necesidad de gramática nueva para preguntar.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek cuenta su mañana
    gloss: Marek dice que él también se levanta a las siete, pero que bebe té, no café.
    note: Ja też confirma algo en común (la hora de levantarse) antes de contrastar con ale... nie en la bebida.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek describe su día
    gloss: Marek dice que trabaja por la mañana y luego almuerza al mediodía.
    note: 'Un orden diario distinto al de Ewa: primero el trabajo y luego la comida del mediodía.'
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek habla del sueño
    gloss: Marek dice que se acuesta temprano, a las diez de la noche.
    note: Cierra la conversación con el nuevo verbo spać/śpię y el patrón de horas repasado en esta lección.
