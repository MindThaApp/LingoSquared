teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Llamar
    gloss: llamar
    note: El infinitivo del verbo para hacer una llamada telefónica.
    example_gloss: Tengo que llamarte.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Decir que vas a llamar
    gloss: Te llamo.
    note: '*Zadzwonię* es el futuro perfectivo de *zadzwonić* (llamar, una vez). El polaco lo usa para una promesa, como el español «te llamo» o «te llamaré».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Contestar al teléfono
    gloss: Hola, soy Ewa.
    note: '*Tu* + nombre (literalmente «aquí ...») es la forma habitual de identificarse por teléfono; en español se dice «soy ...».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek contesta de la misma manera
    gloss: Hola, soy Marek.
    note: Es el mismo patrón *tu* + nombre que en *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Preguntar quién llama
    gloss: ¿Con quién hablo?
    note: '*Z kim rozmawiam?* (literalmente «¿con quién hablo?») es la frase habitual para un llamante desconocido; *kim* es el instrumental después de *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Identificarse de manera formal
    gloss: Está hablando con Ewa.
    note: '*Rozmawia pan z Ewą* es la versión formal: *pan* (a un hombre) o *pani* (a una mujer) con el verbo en tercera persona, y *z* + instrumental.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: '*Możesz* (puedes, de *móc*) + el infinitivo *powtórzyć* (repetir) + *to* (eso).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Pedir a alguien que vaya más despacio
    gloss: No hables tan rápido, por favor.
    note: '*Nie mów* es el imperativo negativo (no hables); *tak szybko* significa «tan rápido».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Decir que no oyes bien
    gloss: No te oigo bien.
    note: '*Nie słyszę cię dobrze* expresa un problema para oír; *cię* es el acusativo de *ty* y *dobrze* significa «bien».'
  pl.a1.unit22.lesson04.teach.sms:
    title: Mensaje de texto
    gloss: el mensaje de texto
    note: '*SMS* es un sustantivo masculino tomado del inglés, como en español «el SMS»: *ten SMS*.'
    example_gloss: El mensaje de texto es de Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Decir que vas a enviar un mensaje
    gloss: Te envío un mensaje.
    note: '*Wysłać* (enviar) lleva el dativo *ci* (a ti) para la persona y el acusativo para lo que se envía: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Decir que volverás a llamar
    gloss: Te vuelvo a llamar más tarde.
    note: '*Oddzwonić* (devolver la llamada) es un solo verbo en polaco: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Lee una conversación por mensajes
    gloss: 'Marek: Hola, Ewa, ¿puedes llamarme? Tengo que contarte algo. Ewa: Sí, claro, te devuelvo la llamada en cinco minutos.'
    note: Fíjate en qué pide Marek, por qué y cuándo dice Ewa que volverá a llamar.
    glosses:
      Cześć: hola
      możesz: puedes
      zadzwonić: llamar
      Muszę: deber / tener que
      coś: algo
      powiedzieć: decir
      oczywiście: claro
      oddzwonię: llamar
      pięć: cinco
      minut: minutos
      za: de vuelta
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek contesta la llamada
    gloss: 'Marek: Hola, soy Marek.'
    note: 'El mismo patrón *tu* + nombre de la lección 1, ahora en una llamada real: quien contesta habla primero y dice su nombre.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa se identifica
    gloss: 'Ewa: Hola, Marek, soy Ewa. Marek: ¡Qué bien que llames!'
    note: '*Fajnie, że* ... (qué bien que ...) expresa una reacción positiva ante un hecho; *że* introduce la oración.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa pregunta por el turno
    gloss: 'Ewa: ¿Qué tal tu primer turno?'
    note: '*Jak ci poszła ...?* (literalmente «¿cómo te fue ...?») pregunta por algo que ya ocurrió. *Ci* es el dativo de *ty*, y *poszła* concuerda con el sustantivo femenino *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek cuenta la buena noticia
    gloss: 'Marek: Fue muy bien, mejor de lo que pensaba.'
    note: '*Poszło* es el pasado de *iść* con la terminación *-o* («ello»; aquí, «resultar»); *myślałem* es el pasado de *myśleć* (pensar), con la terminación de un hablante masculino.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Pasado: było, poszło, myślałem'
    gloss: 'Pasado: *było* (fue/era) de *być* (ser, estar), *poszło* (fue) de *iść* (ir), *myślałem* (pensaba) de *myśleć* (pensar).'
    note: 'El pasado polaco se forma con *-ł-* más una terminación de género: *myślał* (él), *myślała* (ella), *było* (ello). Por ahora, aprende *było*, *poszło* y *myślałem* como formas fijas en los contextos de esta lección.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa está orgullosa
    gloss: 'Ewa: ¡Qué alegría oírlo! Estoy orgullosa de ti.'
    note: '*Dumny z* (orgulloso de) es una combinación fija: *z* + genitivo, por eso *z ciebie*. Ewa es mujer, así que dice *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek se emociona
    gloss: 'Marek: Muchas gracias, significa mucho para mí.'
    note: '*Znaczy* es la forma de *on/ona/ono* de *znaczyć* (significar); *dla mnie* (para mí) indica a quién le importa.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Su
    gloss: Su primer turno salió muy bien.
    note: '*Jego* (su, de él) nunca cambia y va antes del sustantivo: *jego pierwsza zmiana*; el sustantivo femenino no lo afecta.'
