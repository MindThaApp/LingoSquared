  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Escucha el diálogo y elige qué película quiere ver Nina.
    correct_option: La película nueva.
    distractors:
    - La sesión infantil.
    - Cualquier película le va bien.
    - No lo dice.
    accepted_answers:
    - value: La película nueva.
      status: correct
    feedback: Nina quiere *nowy film*. El adjetivo *nowy* concuerda con *film*, masculino; al ser inanimado, no cambia en acusativo.
    prompt_blocks:
    - ¿Qué película quiere ver Nina?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Escucha el diálogo y elige sobre qué le pregunta Iga a Nina a continuación.
    correct_option: A qué hora quiere la sesión.
    distractors:
    - Si quiere palomitas.
    - Si quiere un recibo.
    - No pregunta nada.
    accepted_answers:
    - value: A qué hora quiere la sesión.
      status: correct
    feedback: Iga pregunta *a na którą godzinę?* *Na* + acusativo se usa para la hora para la que se reserva una sesión, y *którą* concuerda con *godzina*, femenino.
    prompt_blocks:
    - ¿Por qué le pregunta Iga a Nina a continuación?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Escucha el diálogo y elige a qué hora quiere Nina la sesión.
    correct_option: Las ocho.
    distractors:
    - Las siete.
    - Las seis.
    - El diálogo no lo dice.
    accepted_answers:
    - value: Las ocho.
      status: correct
    feedback: Nina dice *na ósmą* («para las ocho»). El ordinal *ósma* concuerda con *godzina*, femenino, y va en acusativo tras *na*.
    prompt_blocks:
    - ¿A qué hora quiere Nina la sesión?
