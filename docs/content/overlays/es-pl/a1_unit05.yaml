teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: La familia
    gloss: familia
    note: 'La palabra general para «familia»: se usa para todo el hogar, no solo para un parentesco concreto.'
    example_gloss: Esta es mi familia.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Madre, padre
    gloss: madre; padre
    note: Las dos palabras básicas para los padres. En el habla cotidiana también oirás las formas cariñosas mama y tata, pero matka y ojciec son las formas neutras y estándar que se enseñan aquí.
    example_gloss:
    - Esta es mi madre.
    - Este es mi padre.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Hermano, hermana
    gloss: hermano; hermana
    note: 'Ambos son sustantivos regulares: brat es masculino y siostra es femenino, algo que importa para la concordancia mój/moja de la nota gramatical de esta lección.'
    example_gloss:
    - Este es mi hermano.
    - Esta es mi hermana.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Padres
    gloss: padres
    note: 'Rodzice es un sustantivo plural masculino personal: tiene su propia forma posesiva moi (no mój/moja), que verás en el ejemplo y en la nota gramatical de esta lección.'
    example_gloss: Mis padres viven en Varsovia.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Mi: mój, moja y moi'
    gloss: mi padre, mi hermano -- mi madre, mi hermana -- mis padres.
    note: 'Los posesivos polacos concuerdan con el género del sustantivo al que acompañan: *mój* ante un sustantivo masculino (*mój ojciec*, *mój brat*), *moja* ante uno femenino (*moja matka*, *moja siostra*) y la forma irregular *moi* específicamente ante el plural masculino personal *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Este es mi padre
    gloss: Este es mi padre.
    note: '*To jest* («esto es», «este/esta es») funciona igual sea cual sea el género del sustantivo; solo cambia el posesivo mój/moja.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Abuelo, abuela
    gloss: abuelo; abuela
    note: Las palabras habituales para «abuelo» y «abuela», que usan por igual niños y adultos.
    example_gloss:
    - Este es mi abuelo.
    - Esta es mi abuela.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Tío, tía
    gloss: tío; tía
    note: Se usan tanto para el hermano o la hermana de un progenitor como para la pareja de un tío o una tía, igual que «tío» y «tía» en español.
    example_gloss:
    - Este es mi tío.
    - Esta es mi tía.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Hijo, hija
    gloss: hijo; hija
    note: 'Los ejemplos muestran el acusativo que se necesita después de *mieć* («tener»): *syn* pasa a *syna* y *córka* pasa a *córkę*. Las notas gramaticales siguientes explican por qué cambia la terminación.'
    example_gloss:
    - Tengo un hijo.
    - Tengo una hija.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Tener: mam, masz, ma'
    gloss: 'tener: yo tengo, tú tienes, él/ella tiene -- yo tengo un hermano, tú tienes una hermana, él/ella tiene un hijo.'
    note: '*Mieć* es el verbo «tener». *Mam* (tengo) y *ma* (tiene) son las formas nuevas principales de esta lección; *masz* (tienes) ya lo viste al preguntar la edad a alguien en la unidad 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Decir lo que tienes
    gloss: 'Después de «tener», el sustantivo cambia de terminación: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: 'Este es el acusativo: la forma que adopta un sustantivo cuando es complemento directo de un verbo como *mieć*. Los sustantivos masculinos de persona (y animales), como *brat* y *syn*, añaden *-a*; los femeninos como *siostra* y *córka* cambian la *-a* final por *-ę*.'
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: Tengo un hermano y una hermana
    gloss: Tengo un hermano y una hermana.
    note: Pone en práctica, en una frase completa, las terminaciones de acusativo de la nota gramatical, además del nuevo conector *i* («y»).
  pl.a1.unit05.lesson03.teach.lub:
    title: O
    gloss: o
    note: Se usa igual que «o» en español en una pregunta de sí o no que ofrece dos opciones.
    example_gloss: ¿Tienes un hermano o una hermana?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Solo
    gloss: solo
    note: Se coloca justo antes de la palabra a la que limita, como suele hacerse con «solo» en español.
    example_gloss: Solo tengo una hermana.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Dónde
    gloss: dónde
    note: Una palabra interrogativa básica; combina de forma natural con mieszkać («vivir»), como en el diálogo de esta lección.
    example_gloss: ¿Dónde vive tu hermano?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Él, ella y «vivir»
    gloss: 'él, ella -- vivir: vivo, vive. Él vive en Gdansk. Ella vive en Cracovia.'
    note: '*On* («él») y *ona* («ella») son los pronombres de tercera persona. *Mieszkać* («vivir») sigue el mismo patrón de 1.ª/3.ª persona que *mieć*: *mieszkam* («vivo», de *Mieszkam w Warszawie* en la unidad 1) y *mieszka* («vive»). Los nombres de lugar llevan *w* + locativo: *Gdańsk* pasa a *w Gdańsku* y *Kraków* pasa a *w Krakowie*, el mismo patrón w + locativo de *Mieszkam w Warszawie* en la unidad 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek pregunta por los hermanos
    gloss: Marek le pregunta a Ewa si tiene un hermano o una hermana.
    note: Una pregunta de sí o no con *Czy*, la misma partícula interrogativa de la unidad 1. Ewa y Marek ya se conocen bien, así que han pasado del tratamiento formal *pan*/*pani* al informal *ty* (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa responde y devuelve la pregunta
    gloss: Ewa dice que tiene un hermano y una hermana, y luego le hace la misma pregunta a Marek.
    note: '*A ty?* («¿Y tú?») es una forma breve y natural de devolverle la pregunta a quien te la ha hecho.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek responde
    gloss: Marek dice que solo tiene una hermana, que vive en Cracovia, y luego le pregunta a Ewa por su hermano.
    note: 'Marek no tiene hermano: solo *tylko siostrę* («solo una hermana»). Puede preguntar por el hermano de Ewa sin problema porque ella ya ha dicho que tiene uno.'
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa responde
    gloss: Ewa dice que su hermano vive en Gdansk y que tiene un hijo y una hija.
    note: Reutiliza el patrón de acusativo de syn/córka de la lección 2 de esta unidad.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek reacciona
    gloss: 'Marek dice: ¡qué buena familia!'
    note: '*Fajna* es una palabra informal y cotidiana para «bonito», «chulo»; es una reacción natural para cerrar la conversación, del mismo registro que *Świetnie!* de la unidad 4.'
