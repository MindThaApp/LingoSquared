teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: La una, las dos, las tres
    gloss: la una; las dos; las tres
    note: 'En polaco la hora se dice con números ordinales femeninos, que concuerdan con el sustantivo femenino sobrentendido *godzina* («hora»): *pierwsza* significa literalmente «la primera (hora)».'
    example_gloss:
    - Es la una.
    - Son las dos.
    - Son las tres.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Las cuatro, las cinco, las seis
    gloss: las cuatro; las cinco; las seis
    note: Sigue el mismo patrón de ordinales femeninos que *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Son las cuatro.
    - Son las cinco.
    - Son las seis.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Las siete, las ocho, las nueve
    gloss: las siete; las ocho; las nueve
    note: Las tres horas centrales de las doce, con el mismo patrón.
    example_gloss:
    - Son las siete.
    - Son las ocho.
    - Son las nueve.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Las diez, las once, las doce
    gloss: las diez; las once; las doce
    note: Las últimas tres horas, que completan la serie del 1 al 12.
    example_gloss:
    - Son las diez.
    - Son las once.
    - Son las doce.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Preguntar la hora
    gloss: ¿Qué hora es?
    note: Literalmente, «¿cuál es la hora?». *Która* concuerda con el femenino *godzina*, el mismo tipo de concordancia que verás a lo largo de esta unidad.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina es femenino
    gloss: Decimos pierwsza, druga, trzecia, no pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* son las formas masculinas de estos mismos ordinales, que en polaco se usan con sustantivos masculinos, pero nunca para decir la hora, porque *godzina* es femenino.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Mañana, mediodía, tarde
    gloss: por la mañana; al mediodía; por la tarde
    note: '*Rano* va solo (sin preposición); *w południe* y *po południu* llevan cada uno su propia preposición fija. Conviene memorizar las tres expresiones tal cual, en lugar de deducirlas de una regla general.'
    example_gloss:
    - Por la mañana tomo café.
    - Almuerzo al mediodía.
    - Trabajo por la tarde.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: 'Noche (tarde-noche) y madrugada: por la noche'
    gloss: por la tarde-noche; por la noche
    note: '*Wieczorem* es una forma adverbial fija (no necesita preposición); *w nocy* combina *w* con el locativo de *noc* (noche).'
    example_gloss:
    - Por la tarde-noche veo la tele.
    - Por la noche duermo.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Preguntar a qué hora
    gloss: ¿A qué hora?
    note: Se usa en lugar de *Która jest godzina?* cuando preguntas cuándo va a ocurrir algo, y no qué hora es ahora mismo.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: Decir «a las» + hora
    gloss: Las cuatro, las siete, las diez, pero a las cuatro, a las siete, a las diez.
    note: 'Después de *o* («a las»), la *-a* final de la hora cambia a *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Todas las horas siguen este patrón; la única particularidad ortográfica es *druga* → *o drugiej*, que añade una *i* después de la *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa se levanta temprano
    gloss: Ewa se levanta a las 7 de la mañana.
    note: '*Wstaje* es la tercera persona del singular de *wstawać* (levantarse).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: La hora de salida del tren
    gloss: El tren sale a las 4 de la tarde.
    note: '*Odjeżdża* es la tercera persona del singular de *odjeżdżać* (salir, partir).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Reunión
    gloss: reunión
    note: Es la misma palabra que viste en la unidad 3 (*Kiedy jest spotkanie?*), cuando Ewa y Marek acordaron un día y una fecha para volver a verse.
    example_gloss: La reunión es el viernes.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Preguntar a qué hora quedar
    gloss: ¿A qué hora podemos vernos el viernes 15 de mayo?
    note: 'Combina el *o której godzinie* de esta unidad con el día y la fecha de la unidad 3: Ewa y Marek ya acordaron el viernes 15 de mayo y ahora necesitan fijar la hora exacta.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Proponer una hora
    gloss: ¿Quizá a las 4 de la tarde?
    note: '*Może* por sí solo significa «quizá»: una forma natural y suave de proponer una hora.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Confirmar que una hora conviene
    gloss: Las 4 de la tarde me viene bien.
    note: 'Es el mismo patrón *[time] + mi + odpowiada* que en *Piątek mi odpowiada* de la unidad 3: la hora es el sujeto gramatical, y *odpowiadać* pone siempre a la persona en dativo (*mi*, «a mí»).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Confirmar el plan completo
    gloss: ¡Nos vemos el 15 de mayo a las 4!
    note: Reutiliza la despedida *Do zobaczenia* de la unidad 1, ahora combinada con una fecha y una hora.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa pregunta la hora
    gloss: Ewa le pregunta a Marek a qué hora pueden verse el viernes 15 de mayo.
    note: Repite exactamente la pregunta con la que empieza esta lección.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek propone las 4 de la tarde
    gloss: Marek sugiere las 4 de la tarde.
    note: 'Es una sugerencia suave, no una afirmación rotunda: eso es lo que indica *może*.'
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa confirma
    gloss: Ewa dice que las 4 de la tarde le viene bien.
    note: Es la misma construcción con dativo del intercambio de la unidad 3 en el que el viernes le venía bien a alguien.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek cierra el plan
    gloss: Marek dice «¡genial!» y «¡nos vemos el 15 de mayo a las 4!».
    note: '*Świetnie* retoma la exclamación de entusiasmo de la unidad 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa se despide
    gloss: Ewa se despide también.
    note: 'El cierre más breve posible: solo la despedida.'
