teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Pan
    gloss: pan
    note: 'Una palabra básica para un alimento fundamental: aparece constantemente en cualquier comida.'
    example_gloss: Esto es pan.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Mantequilla, queso
    gloss: mantequilla; queso
    note: La primera es un sustantivo neutro y la segunda, masculino inanimado; ninguna cambia su terminación después de proszę o, como explica la nota de gramática de esta lección.
    example_gloss:
    - Esto es mantequilla.
    - Esto es queso.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Agua, leche
    gloss: agua; leche
    note: Woda es femenina (su acusativo wodę aparece en la nota de gramática de esta lección); mleko es neutra y nunca cambia.
    example_gloss:
    - Esto es agua.
    - Esto es leche.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Café, té
    gloss: café; té
    note: 'Ambas son femeninas: sus formas de acusativo kawę y herbatę son las que de verdad dices al pedir, como se explica en la nota de gramática de esta lección.'
    example_gloss:
    - Esto es café.
    - Esto es té.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Pedir: proszę o + acusativo'
    gloss: 'Por favor, deme + acusativo: café -> kawę, té -> herbatę, agua -> wodę. Pan, queso y leche no cambian.'
    note: Después de *Proszę o* («por favor, deme», literalmente «pido») se usa el acusativo. Los sustantivos femeninos como *kawa*, *herbata* y *woda* cambian la *-a* final por *-ę*. Los masculinos inanimados como *chleb* y *ser*, y los neutros como *mleko*, mantienen exactamente la misma forma del diccionario.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Un café, por favor
    gloss: Un café, por favor.
    note: 'La forma cotidiana y educada de pedir una sola cosa: aplica el patrón de la nota de gramática en una petición completa.'
  pl.a1.unit06.lesson02.teach.zupa:
    title: Sopa
    gloss: sopa
    note: Un plato habitual del almuerzo o la cena, y a menudo el plato del día, como en la escena del restaurante de esta unidad.
    example_gloss: Esto es sopa.
  pl.a1.unit06.lesson02.teach.sok:
    title: Jugo
    gloss: jugo
    note: 'Masculino inanimado, como chleb y ser: no cambia de terminación al pedirlo.'
    example_gloss: Esto es zumo.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Azúcar
    gloss: azúcar
    note: Útil para el café o el té; también es masculino inanimado y no cambia de terminación.
    example_gloss: Esto es azúcar.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: La cuenta
    gloss: la cuenta
    note: 'Lo que pides al final de una comida: proszę o rachunek es la forma estándar y educada de pedirla.'
    example_gloss: La cuenta, por favor.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'Gustar/querer: lubię, lubi'
    gloss: 'lubić («gustar», «agradar»): me gusta, le gusta -- Me gusta el café. A él le gusta la sopa.'
    note: '*Lubić* es el verbo que expresa agrado. Aquí solo se enseñan la 1.ª persona (*lubię*) y la 3.ª persona (*lubi*). *Lubić* también lleva acusativo, el mismo patrón que *proszę o*: *lubię kawę*, no *lubię kawa*. Ten en cuenta que en polaco la persona que siente es el sujeto: lubię significa literalmente «yo aprecio».'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Me gusta la sopa
    gloss: Me gusta la sopa.
    note: Zupa pasa a zupę en acusativo, el mismo cambio femenino de -a a -ę de la nota de gramática de la lección 1.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: El plato del día
    gloss: El plato del día es sopa.
    note: '*Dnia* es el genitivo de *dzień* (día): *danie dnia* es literalmente «el plato del día», tal como lo diría una carta.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'Recomendar: polecam, poleca'
    gloss: 'recomendar: recomiendo, recomienda -- Recomiendo el café. Él recomienda la sopa.'
    note: '*Polecać* es el verbo «recomendar»: el camarero lo usa para sugerir un plato y el cliente, para pedir una sugerencia. También lleva acusativo, igual que *proszę o* y *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: ¿Qué me recomienda?
    gloss: ¿Qué recomienda?
    note: '*Co* (qué) más el trato formal *pan*: la pregunta natural para un camarero, con el mismo trato formal de la unidad 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Aquí tiene / de nada
    gloss: Aquí tiene.
    note: 'Una expresión flexible y cotidiana: se dice al servir algo y es igual de natural como respuesta a dziękuję (gracias).'
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Marchando
    gloss: Marchando.
    note: 'Literalmente «ya lo sirvo»: la respuesta habitual del camarero para confirmar que ha oído el pedido.'
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: El camarero anuncia el plato del día
    gloss: El camarero saluda y anuncia que el plato del día es sopa.
    note: Dzień dobry, ya visto en los saludos de la unidad 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa pide una recomendación
    gloss: Ewa le pregunta al camarero qué recomienda.
    note: 'Una pregunta educada y formal: pan se dirige al camarero con respeto.'
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: El camarero recomienda el café
    gloss: El camarero recomienda el café.
    note: 'Polecam: la forma de 1.ª persona de la nota de gramática de esta lección.'
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa hace su pedido
    gloss: Ewa dice que está bien y pide café y sopa.
    note: Combina proszę o con el conector i (y) de la unidad de la familia, y reutiliza el patrón de pedir de la lección 1 y el vocabulario de la sopa de la lección 2.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: El camarero confirma
    gloss: El camarero dice que el pedido está en marcha.
    note: Una confirmación breve y natural antes de que llegue la comida.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa pide la cuenta
    gloss: Ewa da las gracias y pide la cuenta.
    note: Reutiliza dziękuję de la unidad 1 y proszę o + rachunek de la lección 2.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: El camarero se la entrega
    gloss: 'El camarero dice: «Aquí tiene».'
    note: El mismo proszę bardzo que se vio antes en esta lección, ahora usado para entregar la cuenta.
