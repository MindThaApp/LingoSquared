teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos habituales de aficiones: *czytać* (leer), *uprawiać sport* (hacer deporte) y *gotować* (cocinar).'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Wolny czas* es la expresión clave para hablar de aficiones. El adjetivo *wolny* (libre) concuerda con el sustantivo masculino *czas*; en *w wolnym czasie* ambos están en locativo.'
    example_gloss: En mi tiempo libre me gusta leer.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Lubię* (me gusta) va seguido de infinitivo: *lubię czytać*. *W wolnym czasie* usa *w* + locativo.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres aficiones más: *słuchać muzyki* (escuchar música), *rysować* (dibujar) y *grać w gry* (jugar a videojuegos).'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Słuchać* siempre lleva genitivo: *słucham muzyki*, no *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Z przyjaciółmi* (con amigos) usa *z* + instrumental plural.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: 'Los cuatro adverbios básicos de frecuencia: *zawsze*, *często*, *czasami*, *nigdy*. Nunca cambian de forma, y *nigdy* exige *nie* antes del verbo: *Nigdy nie gram.*'
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Co tydzień* y *co weekend* significan «cada ...»; después de *co* va el acusativo y nunca cambia: mira la siguiente tarjeta.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + acusativo
    gloss: '*Co* + acusativo significa «cada»: cada semana, cada fin de semana, cada mes.'
    note: '*Co* es una palabra fija para «cada», sea cual sea el sustantivo. Los sustantivos masculinos inanimados como *tydzień*, *weekend* y *miesiąc* son iguales en nominativo y en acusativo.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa saca el tema de las aficiones
    gloss: 'Ewa: A menudo paseamos juntos. Pero ¿qué más haces en tu tiempo libre, Marek?'
    note: '*Spacerujemy* es la forma de *my* (nosotros) de *spacerować*; *Marku* es el vocativo, que se usa al dirigirse directamente a alguien.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Las aficiones de Marek
    gloss: 'Marek: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: '*Także w domu* (también en casa) muestra que Marek cocina por gusto, no solo en su trabajo en el restaurante; *w domu* es locativo.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa se sorprende
    gloss: 'Ewa: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Cały dzień* (todo el día) subraya cuánto cocina ya Marek en el trabajo; *przecież* añade un matiz de «pero si».'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek lo explica
    gloss: 'Marek: Sí, pero cocinar me relaja. Y tú, ¿qué te gusta hacer?'
    note: '*Gotowanie mnie odpręża* significa literalmente «cocinar me relaja»: en polaco la actividad suele ser el sujeto y *mnie* (me) va en acusativo.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Las aficiones de Ewa
    gloss: 'Ewa: Me gusta leer y a menudo escucho música.'
    note: Combina dos verbos de aficiones de las lecciones 1 y 2 en una sola oración con *i* (y).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek pregunta por los videojuegos
    gloss: 'Marek: ¿Tú también juegas a videojuegos?'
    note: Una pregunta corta de sí o no con *grać w gry* de la lección 2; *też* significa «también».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa responde
    gloss: 'Ewa: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Nigdy* (nunca) y *czasami* (a veces) de la lección 3, contrastados en una misma respuesta. Fíjate en la doble negación: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Comparar aficiones
    gloss: Marek y yo a menudo paseamos juntos. Pero también tenemos otras aficiones. A Marek le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y a menudo escucho música. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer a ti en tu tiempo libre?
    note: El mensaje de Ewa resume datos de la lección 4 y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      spacerujemy: pasea
      często: a menudo
      razem: juntos
      inne: otros
      gotować: cocina
      lubi: le gusta
      domu: en casa
      uprawia: hace deporte
      czytać: leer
      słucham: escucho
      muzyki: música
      rysuję: dibujo
      czasami: a veces
      gram: juego a videojuegos
      nigdy: nunca
      wolnym: libre
      czasie: tiempo
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek pregunta por el fin de semana
    gloss: 'Marek: ¿Qué haces este fin de semana?'
    note: '*W ten weekend* (este fin de semana) usa *w* + acusativo en una expresión de tiempo.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa no se decide
    gloss: 'Ewa: Todavía no lo sé. Me gusta leer, pero también quiero salir a la calle.'
    note: '*Wyjść na dwór* (salir a la calle) es una forma habitual de decir que quieres salir de casa; *chcę* + infinitivo significa «quiero».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek propone un plan
    gloss: 'Marek: ¿Damos un paseo juntos? Después cocinaré algo para los dos.'
    note: '*Potem* (después) es la palabra que marca la secuencia; *ugotuję* es perfectivo porque cocinar es aquí un resultado terminado.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa acepta
    gloss: 'Ewa: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Lubię i ..., i ...* («tanto ... como ...») muestra que a Ewa le gustan dos cosas por igual, no una más que la otra.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek confirma
    gloss: 'Marek: Perfecto. ¡Entonces nos vemos el sábado!'
    note: Una frase amistosa de cierre que confirma el plan del sábado; *w sobotę* es *w* + acusativo para un día de la semana.
