answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polaco A1
  description: 'Polaco para principiantes para describir el aspecto físico básico de una persona: impresión de estatura y de edad, color de pelo y de ojos, la pregunta clave Jak wygląda ...? y la comparación del aspecto de dos personas.'
units:
  pl.a1.unit25.wyglad:
    title: Describir el aspecto
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Alto, bajo, viejo y joven
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Describir el pelo
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Los ojos y ¿cómo es alguien?
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa describe a Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Comparamos a Tomek y Kasia
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek reconoce a Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Wysoki* describe a una persona alta y *niski* a una baja. Una mujer es *wysoka* o *niska*.'
    example_gloss:
    - Kasia es alta.
    - Tomek es bajo.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Stary* y *młody* describen aquí una impresión general, no un número exacto de años.'
    example_gloss:
    - El abuelo es viejo.
    - Marek es joven.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: impresión o edad'
    gloss: '*Stary* describe una impresión general, como en *Dziadek jest stary*. Para dar la edad exacta, el polaco usa otra estructura: *Ile masz lat?*'
    note: Para decir qué edad aparenta alguien usas *stary* o *młody*; para la edad exacta preguntas *Ile masz lat?* y respondes con *mam ... lat* (tengo ... años).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia es alta y Tomek es bajo
    gloss: Kasia es alta y Tomek es bajo.
    note: Una frase combinada sencilla con *a* (y, en contraste). *Wysoka* y *niski* concuerdan con un sujeto femenino y uno masculino, y preparan la comparación de la lección 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: El pelo
    gloss: el pelo
    note: '*Włosy* es siempre plural en polaco: *długie włosy* (pelo largo).'
    example_gloss: Marek tiene el pelo corto y negro.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: Tres colores de pelo. *Blond* no cambia; *brązowe* y *siwe* son formas de plural para concordar con *włosy*.
    example_gloss:
    - Ewa tiene el pelo rubio.
    - Tomek tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Długie* (largo) y *krótkie* (corto) son formas de plural que concuerdan con *włosy*.'
    example_gloss:
    - Kasia tiene el pelo largo.
    - Tomek tiene el pelo corto.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy lleva adjetivos en plural
    gloss: '*Włosy* es plural, así que el adjetivo también va en plural: pelo largo, pelo corto, pelo castaño, pelo negro.'
    note: 'Los sustantivos plurales que no son personas masculinas llevan adjetivos terminados en *-e*: *długie włosy*. *Blond* es la excepción: nunca cambia (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: siempre en plural'
    gloss: '*Włosy* (pelo) siempre va en plural: *jej włosy są długie* (su pelo es largo, literalmente «sus pelos son largos»). *Jej* significa «su» (de ella).'
    note: En polaco, «pelo» es un sustantivo plural, así que los verbos y los adjetivos concuerdan en plural. *Jej* («su», de ella) nunca cambia, sin importar cuántas cosas posea.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek tiene el pelo corto y negro
    gloss: Marek tiene el pelo corto y negro.
    note: '*Czarne* (negro) es la forma plural que concuerda con *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa tiene el pelo largo y rubio
    gloss: Ewa tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Los ojos
    gloss: los ojos
    note: '*Oczy* es el plural de *oko*; en polaco normalmente se habla de ambos ojos en plural.'
    example_gloss: Marek tiene los ojos castaños.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: 'Tres colores de ojos, en plural para concordar con *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa tiene los ojos azules.
    - Tomek tiene los ojos castaños.
    - Kasia tiene los ojos verdes.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy lleva -e
    gloss: '*Oczy* es plural, así que el adjetivo termina en *-e*: ojos azules, ojos castaños, ojos verdes.'
    note: 'Es la misma terminación de plural que con *włosy* en la lección 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: ¿Cómo es Ewa?
    gloss: ¿Cómo es Ewa físicamente?
    note: '*Jak wygląda ...?* es la pregunta clave de esta unidad; úsala para preguntar por el aspecto de cualquier persona.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa tiene el pelo largo y rubio y los ojos azules
    gloss: Ewa tiene el pelo largo y rubio y los ojos azules.
    note: Una respuesta modelo que combina pelo y ojos en una sola frase con *i* (y).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa presenta a Nina
    gloss: 'Ewa: Viene una chica nueva a la cafetería de idiomas. Se llama Nina.'
    note: '*Przychodzi* (viene) introduce a alguien nuevo en la escena; *do kawiarni językowej* usa *do* + genitivo.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek pregunta cómo es ella
    gloss: 'Marek: ¡Vale! ¿Cómo es?'
    note: Retoma la pregunta clave de esta unidad, ahora con *ona* (ella) en lugar de un nombre.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa describe la estatura y el pelo de Nina
    gloss: 'Ewa: Es baja y tiene el pelo corto y rubio.'
    note: Combina *niska* (el femenino de *niski*) de la lección 1 con el vocabulario del pelo de la lección 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek pregunta por sus ojos
    gloss: 'Marek: ¿Y sus ojos?'
    note: '*Jej* aquí es el posesivo «su» (de ella), así que *jej oczy* significa «sus ojos»; *jej* nunca cambia.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa describe los ojos de Nina
    gloss: 'Ewa: Tiene los ojos verdes.'
    note: Retoma *zielone oczy* de la lección 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek la reconocerá
    gloss: 'Marek: ¡Gracias! Así la reconoceré.'
    note: '*Rozpoznam* es el futuro perfectivo («reconoceré»); *ją* es el acusativo de *ona* (ella).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Comparamos a Tomek y Kasia
    gloss: Tomek y Kasia son hermanos, pero se ven distintos. Tomek es bajo, tiene el pelo corto y castaño y los ojos castaños. Kasia es más alta que Tomek y tiene el pelo largo y castaño y los ojos verdes. ¿Y tú, cómo eres?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      brat: hermano
      siostra: hermana
      wyglądają: parecerse
      inaczej: diferentes
      niski: bajo
      krótkie: bajo
      brązowe: castaño
      włosy: pelo
      oczy: ojos
      wyższa: más alta
      długie: largo
      zielone: verdes
      wyglądasz: tú te ves / cómo eres físicamente (informal)
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Usamos de nuevo el comparativo
    gloss: 'Comparativo: *wysoki* (alto) pasa a *wyższy* (más alto), y la otra persona va después de *niż* (que): Kasia es más alta que Tomek.'
    note: 'El polaco forma el comparativo cambiando la terminación del adjetivo, que sigue concordando en género: *wyższa* para Kasia (femenino).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia tiene el pelo más largo que Tomek
    gloss: Kasia tiene el pelo más largo que Tomek.
    note: '*Dłuższe* (más largo) va en plural para concordar con *włosy*, y *niż* (que) introduce la comparación.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: Una frase modelo en primera persona con *Mam ...*, lista para usar al describir tu propio aspecto.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek ve a Nina
    gloss: 'Marek: Mira, ¿es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Patrz* (mira) es el imperativo de *patrzeć*. *Czy to Nina?* significa «¿es Nina?».'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa lo confirma
    gloss: 'Ewa: Sí, ¡es Nina!'
    note: Una confirmación breve y natural.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina saluda a Marek
    gloss: 'Nina: Hola, ¿eres Marek?'
    note: 'Una pregunta de saludo sencilla e informal. Después de *być*, un nombre va en instrumental: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek saluda a Nina
    gloss: 'Marek: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Miło cię poznać* es la frase habitual en un primer encuentro («encantado de conocerte»; *poznać* significa «conocer a alguien»). A Nina se le habla en vocativo: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Marek reconoció a Nina gracias a la descripción de Ewa.'
