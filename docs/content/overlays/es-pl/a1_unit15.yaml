teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Estación
    gloss: estación
    note: 'El lugar donde llegan y salen los trenes y los autobuses: el punto de partida de toda esta unidad.'
    example_gloss: La estación está cerca del hotel.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Billete
    gloss: billete
    note: Lo necesitarás antes de subir a un tren o a un autobús.
    example_gloss: El billete cuesta veinte eslotis.
  pl.a1.unit15.lesson01.teach.peron:
    title: Andén
    gloss: andén
    note: El lugar donde esperas tu tren.
    example_gloss: El andén número uno está allí.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Andén número uno, dos...
    gloss: 'Para decir el número de un andén, puedes decir Peron numer + número: Peron numer jeden, Peron numer dwa.'
    note: 'Es más sencillo de lo que parece: solo *peron* + *numer* + un número normal que ya conoces. (En los anuncios de la estación se usan a menudo ordinales, como *peron pierwszy* -- «andén primero» --, pero *peron numer jeden* siempre se entiende.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: El tren, otra vez
    gloss: 'Pociąg odjeżdża o czwartej po południu: ya conoces esta frase de la lección sobre la hora.'
    note: El mismo dato de la unidad de la hora, ahora aplicado a una escena de viaje.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Cracovia
    gloss: Cracovia
    note: 'Una ciudad polaca real: el primer destino de esta unidad.'
    example_gloss: Cracovia está lejos.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: A Cracovia
    gloss: 'Cuando vamos a un lugar, decimos do + otra forma del nombre de la ciudad: do Krakowa (no do Kraków). Memoriza esta forma como un todo.'
    note: 'No intentes deducir *Krakowa* a partir de una regla: por ahora, aprende *do Krakowa* como una expresión fija.'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Un billete a Cracovia, por favor
    gloss: Un billete a Cracovia, por favor.
    note: La frase exacta que dirías en la taquilla.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (ir en un vehículo): jadę (yo voy), jedzie (él/ella va). Mañana voy a Cracovia. Marek va a Cracovia.'
    note: 'Por ahora solo dos formas: *jadę* para ti mismo y *jedzie* para otra persona.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek va a Cracovia
    gloss: Marek va a Cracovia mañana.
    note: 'El viaje de Marek: su historia continúa en el diálogo de esta unidad.'
  pl.a1.unit15.lesson02.teach.autobus:
    title: Autobús
    gloss: autobús
    note: La otra forma habitual de viajar entre ciudades.
    example_gloss: El autobús está en la estación.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Varsovia
    gloss: Varsovia
    note: 'La capital de Polonia: el segundo destino de esta unidad.'
    example_gloss: Varsovia está lejos.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: A Varsovia
    gloss: 'Warszawa cambia de forma distinta que Kraków: do Warszawy (no do Warszawa). Cada ciudad tiene su propia forma: memoriza las dos por separado.'
    note: '*Krakowa* y *Warszawy* no siguen el mismo patrón; por eso cada una se memoriza por separado y no como una regla común.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Adónde
    gloss: adónde
    note: 'Pregunta por un destino, no por un lugar: es distinto de preguntar «dónde» está algo.'
    example_gloss: ¿Adónde va el autobús?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: A las siete, otra vez
    gloss: 'Siódmej: ya conoces esta forma de la hora de la lección sobre el tiempo (o siódmej = a las siete).'
    note: El mismo patrón de la hora en locativo, reutilizado para una hora de salida.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: El autobús a Varsovia sale a las siete
    gloss: El autobús a Varsovia sale a las siete.
    note: Combina los patrones de destino y de hora de esta lección en una frase real.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Cuándo, otra vez
    gloss: 'Kiedy: ya conoces esta palabra de la lección sobre las fechas. ¿Cuándo sale el autobús?'
    note: La pregunta natural antes de un viaje.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa va a Varsovia
    gloss: Ewa va a Varsovia mañana.
    note: 'El viaje de Ewa: su historia continúa en el diálogo de esta unidad, junto a la de Marek.'
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Yo, otra vez
    gloss: 'Ja: ya conoces esta palabra de lecciones anteriores.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Mi, otra vez
    gloss: 'Mój: ya conoces esta palabra de la lección sobre la familia.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: A las diez de la mañana, otra vez
    gloss: 'Dziesiątej y rano: ya conoces ambas formas de la lección sobre el tiempo (o dziesiątej rano = a las diez de la mañana).'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Gracias y hasta pronto
    gloss: 'Dziękuję y Do zobaczenia: ya las conoces de lecciones anteriores.'
    note: Un breve repaso antes del diálogo de esta lección.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: ¡Buen viaje!
    gloss: 'Miłej podróży! es la forma de desear a alguien un buen viaje: se usa como una expresión completa, sin traducirla palabra por palabra.'
    note: 'Una despedida fija e idiomática: apréndela como un solo bloque, igual que aprendiste *Dzień dobry*.'
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek va mañana a Cracovia
    gloss: Mañana voy a Cracovia. Mi tren sale a las cuatro de la tarde.
    note: 'Marek empieza con su propio plan de viaje: el mismo dato que ya nos contó la lección 1 sobre él.'
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa va mañana a Varsovia
    gloss: Voy a Varsovia. Mi autobús sale a las diez de la mañana.
    note: 'Ewa cuenta su propio plan: el mismo dato que ya nos contó la lección 2 sobre ella.'
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek desea a Ewa un buen viaje
    gloss: ¡Buen viaje!
    note: Marek usa la nueva expresión de esta lección para desearle lo mejor a Ewa.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa da las gracias a Marek y se despide
    gloss: ¡Gracias! ¡Hasta pronto!
    note: Un cierre sencillo y familiar de la conversación.
