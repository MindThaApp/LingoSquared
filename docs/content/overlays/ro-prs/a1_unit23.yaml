  prs.a1.unit23.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: Bani
    gloss: bani
    note: پول înseamnă bani.
    example_gloss: Am bani.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Numerar
    gloss: numerar
    note: نقد înseamnă numerar (cash).
    example_gloss: Plătesc în numerar.
  prs.a1.unit23.lesson01.teach.kart:
    title: Card
    gloss: card
    note: کارت înseamnă card (de plată).
    example_gloss: Am un card.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dolar
    gloss: dolar
    note: دالر înseamnă dolar (USD) – este foarte folosit și se cotează alături de afgani la schimbul valutar de zi cu zi din Afganistan.
    example_gloss: Am o sută de dolari.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: Am
    gloss: am
    note: دارم înseamnă „am” (deja introdus în Unitatea 10, la cumpărături).
    example_gloss: Am bani.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Sută
    gloss: sută
    note: صد înseamnă sută – deja introdus în Unitatea 4, la numere, și refolosit în Unitatea 10, la cumpărături.
    example_gloss: Am o sută de dolari.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Plătesc
    gloss: plătesc
    note: می‌پردازم înseamnă „plătesc”.
    example_gloss: Plătesc în numerar.
  prs.a1.unit23.lesson02.teach.ya:
    title: Sau
    gloss: sau
    note: یا înseamnă sau.
    example_gloss: Plătesc cash sau cu cardul.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Cash sau card?
    gloss: Plătiți cash sau cu cardul?
    note: O întrebare frecventă la magazin sau la ghișeul de schimb valutar.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Pot
    gloss: pot
    note: می‌توانم înseamnă „pot” (deja introdus mai devreme în curs).
    example_gloss: Pot plăti cash.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: A plăti
    gloss: plătesc
    note: بپردازم este forma de conjunctiv a verbului „a plăti”, folosită după می‌توانم (pot) – می‌توانم نقد بپردازم înseamnă literal „pot plăti cash”.
    example_gloss: Pot plăti cash.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Casă de schimb valutar
    gloss: casă de schimb valutar
    note: صرافی este o instituție afgană reală și obișnuită pentru schimbul valutar – diferită de o بانک (bancă) formală.
    example_gloss: Merg la casa de schimb valutar.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: A schimba
    gloss: a schimba (bani)
    note: تبدیل کردن înseamnă „a schimba” (bani, valută).
    example_gloss: Schimb dolari în afgani.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Curs valutar
    gloss: curs valutar
    note: نرخ înseamnă curs, curs valutar.
    example_gloss: Care este cursul dolarului de azi?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: Care este cursul de azi?
    gloss: Care este cursul dolarului de azi?
    note: Modul standard de a întreba cursul valutar.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afgani
    gloss: afgani
    note: افغانی este moneda Afganistanului (deja introdusă în Unitatea 10, la cumpărături, de ex. „صد افغانی”).
    example_gloss: Am o sută de afgani.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Recapitulare: este, azi, cât'
    gloss: este / azi / cât
    note: است, امروز și چند sunt cuvinte recapitulate (deja învățate mai devreme în curs), combinate în întrebarea despre curs din această lecție.
    example_gloss: Care este cursul dolarului de azi?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Recapitulare: la, marcă de obiect direct, fac, a face, vreau'
    gloss: la / marcă de obiect direct / fac / a face / vreau
    note: به, را, می‌کنم, کنم și می‌خواهم sunt cuvinte recapitulate (deja învățate mai devreme în curs), combinate în propozițiile de schimb din această lecție.
    example_gloss: Vreau să schimb dolari în afgani.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: Vreau
    gloss: vreau
    note: می‌خواهم înseamnă „vreau” (deja învățat în unitățile anterioare).
    example_gloss: Vreau să schimb dolari.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: Câți aveți?
    gloss: Câți dolari aveți?
    note: دارین este forma politicoasă/de plural a verbului „a avea”, folosită pentru a te adresa clientului.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Poftiți
    gloss: poftiți
    note: بفرمایین este o expresie politicoasă folosită când întinzi cuiva ceva.
    example_gloss: Poftim, șapte mii de afghani.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Mie
    gloss: mie
    note: هزار înseamnă „mie”.
    example_gloss: Șapte mii de afghani.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه, personajul care revine constant în lecții.
    example_gloss: Zarmina merge la casa de schimb valutar.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Foarte bine
    gloss: foarte bine
    note: بسیار خوب, expresie deja cunoscută, folosită aici pentru a accepta o ofertă.
    example_gloss: Foarte bine, mulțumesc.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Recapitulare: șaptezeci, mulțumesc, a făcut'
    gloss: șaptezeci / mulțumesc / a făcut
    note: هفتاد și تشکر sunt cuvinte recapitulate; کرد este forma de trecut a persoanei a treia a verbului کردن (a face), deja folosită în lecția despre trecut din Unitatea 20 -- aici le reunim pentru a rezuma dialogul.
    example_gloss: Zarmina a schimbat o sută de dolari în afghani.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Bună ziua, vreau să schimb dolari în afghani.'
    gloss: Bună ziua, vreau să schimb dolari în afghani.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Schimbătorul valutar: Câți dolari aveți?'
    gloss: Câți dolari aveți?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina: Am o sută de dolari. Care este cursul de azi?'
    gloss: Am o sută de dolari. Care este cursul de azi?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Schimbătorul valutar: Azi un dolar face șaptezeci de afghani.'
    gloss: Azi un dolar face șaptezeci de afghani.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Foarte bine, vă rog să schimbați.'
    gloss: Foarte bine, vă rog să schimbați.
    note: 'تبدیل کنین este imperativul politicos: „vă rog, schimbați”.'
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Schimbătorul valutar: Poftim, șapte mii de afghani.'
    gloss: Poftim, șapte mii de afghani.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Mulțumesc.'
    gloss: Mulțumesc.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Chitanță
    gloss: chitanță
    note: رسید înseamnă „chitanță”.
    example_gloss: Primesc o chitanță.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Iau / primesc
    gloss: iau / primesc
    note: می‌گیرم înseamnă „iau / primesc”.
    example_gloss: Iau banii.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Text de citit
    gloss: Zarmina a mers la casa de schimb valutar. Avea o sută de dolari și voia să schimbe dolarii în afghani. Cursul de azi era de șaptezeci de afghani. Zarmina a primit șapte mii de afghani și a luat o chitanță.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: A mers
    gloss: a mers
    note: رفت este trecutul „a mers” (el/ea).
    example_gloss: Zarmina a mers la casa de schimb valutar.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Recapitulare: șapte, a primit (el/ea), am primit'
    gloss: șapte / a luat, a primit (el/ea) / am luat, am primit
    note: هفت este un număr recapitulat; گرفت și گرفتم sunt formele de trecut ale persoanei a treia și ale persoanei întâi ale verbului گرفتن (a lua, a primi), folosite aici pentru suma primită de Zarmina.
    example_gloss: Zarmina a primit șapte mii de afghani.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Rezumat final
    gloss: 'Am bani: numerar și card. Pot schimba dolari în afghani la casa de schimb valutar. Cursul de azi este de șaptezeci de afghani pentru un dolar.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Pentru
    gloss: pentru
    note: برای înseamnă „pentru”.
    example_gloss: Șaptezeci de afghani pentru un dolar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: Și
    gloss: și
    note: و înseamnă „și” -- cunoscut deja din unitățile anterioare.
    example_gloss: 'Am bani: numerar și card.'
