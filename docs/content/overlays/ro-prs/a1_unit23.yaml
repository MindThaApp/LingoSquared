course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabular despre bani și plată, întrebarea despre modul de plată, schimbul valutar la o صرافی (casă de schimb valutar) și un dialog între Zarmina și Homayoun despre schimbul dolarilor în afgani.'
units:
  prs.a1.unit23.money:
    title: Bani
    description: 'Descurcă-te în situații simple legate de bani: schimb valutar, plăți și întrebări despre modul de plată.'
