course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: simptome de bază (dureri de cap, febră, dureri de stomac), cum spui că te simți rău, cum ceri un doctor sau un medicament, citirea unei scurte note cu instrucțiuni de sănătate și a unui mesaj scurt care descrie simptome, plus un dialog cu doctorul.'
units:
  prs.a1.unit17.health:
    title: Sănătate
    description: Spune o problemă de sănătate simplă și înțelege sfaturi simple, imediate.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Cuvinte pentru simptome
  prs.a1.unit17.lesson02.feeling_unwell:
    title: Cum spui că te simți rău
  prs.a1.unit17.lesson03.asking_for_help:
    title: Cum ceri un doctor sau un medicament
  prs.a1.unit17.lesson04.reading_health_advice:
    title: Citirea unei note cu instrucțiuni de sănătate
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Citirea unui mesaj despre sănătate
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Dialog cu doctorul
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Durere de cap
    gloss: durere de cap
    note: سردرد este un cuvânt compus din سر (cap) și درد (durere).
    example_gloss: Mă doare capul.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Febră
    gloss: febră
    note: تب înseamnă febră.
    example_gloss: Am febră.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Durere de stomac
    gloss: durere de burtă
    note: دل‌درد este un cuvânt compus din دل (burtă/stomac, în limbajul colocvial) și درد (durere).
    example_gloss: Mă doare burta.
  prs.a1.unit17.lesson01.teach.have_word:
    title: Am
    gloss: am
    note: دارم este forma de prezent, persoana I singular, a verbului داشتن (a avea).
    target_text: دارم (am)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Bolnav
    gloss: bolnav
    note: مریض înseamnă bolnav.
    example_gloss: Sunt bolnav.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Sunt
    gloss: sunt
    note: استم este forma politicoasă a copulei la persoana I, în acord cu registrul استم/استین al acestui curs.
    target_text: استم (sunt)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Cum mă simt
    gloss: cum mă simt / starea mea
    note: حالم (حال + م) înseamnă literal „starea mea”; حالم خوب نیست înseamnă „nu mă simt bine”.
    target_text: حالم (cum mă simt / starea mea)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Bun
    gloss: bun
    note: خوب înseamnă bun sau bine.
    example_gloss: Nu mă simt bine.
  prs.a1.unit17.lesson02.teach.not_word:
    title: Nu este
    gloss: nu este
    note: نیست este copula negativă; خوب نیست înseamnă „nu este bun / nu este bine”.
    target_text: نیست (nu este)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Doctor
    gloss: doctor
    note: داکتر este ortografia și pronunția standard din dari afgan pentru „doctor” (diferită de دکتر din persana iraniană).
    example_gloss: Vreau un doctor.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Medicament
    gloss: medicament
    note: دوا înseamnă medicament.
    example_gloss: Vreau un medicament.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Vreau
    gloss: vreau
    note: می‌خواهم înseamnă „vreau”.
    target_text: می‌خواهم (vreau)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Odihnește-te
    gloss: odihnește-te
    note: استراحت este substantivul „odihnă”; împreună cu کنین formează imperativul „Odihniți-vă!”
    example_gloss: Odihniți-vă.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Faceți (politicos)
    gloss: faceți (imperativ politicos)
    note: کنین este imperativul politicos al verbului کردن (a face); استراحت کنین înseamnă literal „faceți odihnă”, adică „Odihniți-vă”.
    target_text: کنین (faceți -- imperativ politicos)
  prs.a1.unit17.lesson04.teach.water_word:
    title: Apa
    gloss: apă
    note: آب înseamnă apă.
    example_gloss: Beți multă apă.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Mult
    gloss: mult
    note: زیاد înseamnă mult.
    example_gloss: Beți multă apă.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Beți (politicos)
    gloss: beți (imperativ politicos)
    note: بنوشین este imperativul politicos al verbului نوشیدن (a bea).
    target_text: بنوشین (beți -- imperativ politicos)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: O notă cu instrucțiuni de sănătate
    gloss: Odihniți-vă. Beți multă apă.
    note: O notă scurtă cu două sfaturi de bază pentru sănătate.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Salut
    gloss: salut
    note: سلام înseamnă salut.
    example_gloss: Salut. Sunt bolnav.
  prs.a1.unit17.lesson05.teach.and_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două elemente sau două propoziții.
    target_text: و (și)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Un mesaj scurt despre sănătate
    gloss: Salut. Sunt bolnav. Am dureri de cap și febră.
    note: Un mesaj scurt la persoana I care descrie două simptome.
  prs.a1.unit17.lesson06.teach.names:
    title: Bashir și doctorul
    gloss: Bashir, doctorul
    note: Bashir este un personaj care revine în acest curs; doctorul este numit cu titlul de respect صاحب.
    example_gloss:
    - Eu sunt Bashir.
    - Eu sunt doctorul.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Cum
    gloss: cum
    note: چطور înseamnă „cum”.
    target_text: چطور (cum)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Sunteți (politicos)
    gloss: sunteți
    note: استین este forma politicoasă a copulei la persoana a II-a, în acord cu registrul استم/استین al acestui curs.
    target_text: استین (sunteți -- politicos)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Mulțumiri
    gloss: mulțumesc
    note: تشکر înseamnă „mulțumesc”.
    example_gloss: Mulțumesc, domnule doctor.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Domnule
    gloss: domnule
    note: صاحب este un titlu de respect adăugat după un nume sau un titlu; داکتر صاحب înseamnă „domnule doctor”, o formă de adresare respectuoasă tipic afgană.
    example_gloss: Mulțumesc, domnule doctor.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Doctorul îl salută pe Bashir
    gloss: Bună ziua. Ce mai faceți?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Bashir răspunde
    gloss: Bună ziua. Sunt bolnav. Am dureri de cap și febră.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Doctorul dă sfaturi
    gloss: Odihniți-vă. Beți multă apă.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Bashir îi mulțumește doctorului
    gloss: Mulțumesc, domnule doctor.
