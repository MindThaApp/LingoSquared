    note: Îmbină هر هفته cu پیاده‌روی می‌کنم.
  prs.a1.unit26.lesson04.teach.review_pronouns_verb:
    title: Eu / tu / faci tu?
    gloss: eu / tu (informal) / faci? (informal)
    note: من („eu”) și تو („tu”, informal) sunt recapitulare; می‌کنی este forma informală „tu faci”, după modelul cu -ی văzut deja la رفتی/کردی.
    target_text: من (eu) / تو (tu) / می‌کنی (faci?, informal)
  prs.a1.unit26.lesson04.teach.review_connectors:
    title: De asemenea / uneori / și
    gloss: de asemenea / și / uneori / și (conjuncție)
    note: هم („de asemenea”), گاهی („uneori”) și و („și”) sunt recapitulare din partea anterioară a cursului.
    target_text: هم (și, de asemenea) / گاهی (uneori) / و (și)
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ce faci în timpul liber?'
    gloss: 'Homayoun: Zarmina, ce faci în timpul liber?'
    note: O întrebare informală între prieteni, cu تو/-ی.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Îmi place să citesc și uneori ascult și muzică'
    gloss: 'Zarmina: Îmi place să citesc și uneori ascult și muzică.'
    note: Leagă două activități cu و („și”).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Mă plimb în fiecare săptămână'
    gloss: 'Homayoun: Mă plimb în fiecare săptămână.'
    note: Reia propoziția din lecția 3, *من هر هفته پیاده‌روی می‌کنم* („mă plimb în fiecare săptămână”).
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Bine! Și mie îmi place să mă uit la filme'
    gloss: 'Zarmina: Bine! Și mie îmi place să mă uit la filme.'
    note: Aplică هم („de asemenea”) la o activitate nouă.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Și eu gătesc uneori'
    gloss: 'Homayoun: Și eu gătesc uneori.'
    note: Aplică گاهی („uneori”) și می‌کنم la آشپزی.
