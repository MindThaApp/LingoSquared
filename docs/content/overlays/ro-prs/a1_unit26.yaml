    example_gloss: Gătitul este hobby-ul meu.
  prs.a1.unit26.lesson06.teach.wrap_summary:
    title: În timpul liber mă plimb, dar uneori îmi place și să citesc
    gloss: În timpul liber mă plimb, dar uneori îmi place și să citesc.
    note: Îmbină două enunțuri despre hobby-uri cu اما.
