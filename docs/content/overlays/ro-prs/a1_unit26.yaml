    title: Citim despre hobby-uri
    gloss: Zarmina iubește cititul. Homayoun se plimbă în timpul liber. Și el gătește uneori.
    note: 'Un scurt text de lectură care recapitulează cuvintele despre hobby-uri din unitate, repetă او („el/ea”) și introduce formele larg folosite de persoana a 3-a: می‌کند („face”) și دارد („are/îi place”).'
