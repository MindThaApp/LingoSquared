    title: Ascultatul muzicii
    gloss: ascultatul muzicii
    note: 'موسیقی گوش کردن înseamnă literal „muzică urechea-a face”: موسیقی (muzică, introdus mai devreme în curs) + گوش (ureche) + کردن (a face).'
    example_gloss: Ascultatul muzicii este hobby-ul meu.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: Vizionarea de filme
    gloss: vizionarea de filme
    note: 'فلم دیدن înseamnă literal „film văzut”: فلم (film) + دیدن (a vedea).'
    example_gloss: Vizionarea de filme este hobby-ul meu.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: Plimbarea
    gloss: plimbarea
    note: پیاده‌روی înseamnă plimbare (ca activitate sau exercițiu fizic).
    example_gloss: Plimbarea este hobby-ul meu.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: Gătitul
    gloss: gătitul
    note: آشپزی înseamnă gătit.
    example_gloss: Gătitul este hobby-ul meu.
  prs.a1.unit26.lesson02.teach.free_word:
    title: Liber
    gloss: liber
    note: آزاد înseamnă liber, în sensul de „nu ocupat”, nu „gratuit”.
    example_gloss: Azi sunt liber.
  prs.a1.unit26.lesson02.teach.review_waqt:
    title: Timp
    gloss: timp
    note: وقت înseamnă timp (introdus mai devreme în curs).
