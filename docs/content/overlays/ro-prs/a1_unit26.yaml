course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: vocabular despre hobby-uri și timp liber (cititul, ascultatul muzicii, vizionarea de filme, plimbarea, gătitul), cum întrebi pe cineva ce îi place să facă în timpul liber cu دوست دارین, frecvența cu هر هفته/آخر هفته și un dialog între Zarmina și Homayoun în care compară cum își petrec timpul liber.'
units:
  prs.a1.unit26.hobbies:
    title: Hobby-uri
    description: Descrie ce faci tu și ce fac alții pentru distracție în timpul liber și întreabă pe cineva despre timpul lui liber.
