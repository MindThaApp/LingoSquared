course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: camerele de bază (dormitor, bucătărie, baie), obiectele casnice (masă, scaun, pat, fereastră), îmbinarea cantității cu locul, citirea unei descrieri scurte și apoi a uneia mai lungi a unei case și un dialog în care se întreabă despre casa cuiva.'
units:
  prs.a1.unit19.housing:
    title: Locuința
    description: 'Descrie o casă simplă: camerele, obiectele casnice și locul lor.'
