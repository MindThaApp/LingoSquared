course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: vocabular despre transport (autobuz, taxi, mașină, bicicletă, pe jos), cum spui cu ce mergi undeva, cumpărarea unui bilet și un dialog între Zarmina și Homayoun care compară variante de drum zilnic.'
