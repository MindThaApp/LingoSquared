    title: 'Zarmina: Cum mergi în oraș?'
    gloss: 'Zarmina: Homayoun, cum mergi în oraș?'
    note: شهر înseamnă oraș; este un cuvânt nou în această replică.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun: Merg pe jos, e aproape'
    gloss: 'Homayoun: Merg pe jos, e aproape. Tu cum mergi?'
    note: نزدیک înseamnă aproape; este un cuvânt nou în această replică.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina: Merg cu taxiul, e direct și rapid'
    gloss: 'Zarmina: Merg cu taxiul, e direct și rapid.'
    note: تیز înseamnă rapid; este un cuvânt nou în această replică.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: Și autobuzul e bun, e ieftin'
    gloss: 'Homayoun: Și autobuzul e bun, e ieftin.'
    note: ارزان înseamnă ieftin; este un cuvânt nou în această replică.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Da, dar taxiul e mai rapid'
    gloss: 'Zarmina: Da, dar taxiul e mai rapid.'
    note: اما înseamnă „dar”; تیزتر este comparativul „mai rapid”.
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lectură despre naveta zilnică
    gloss: Zarmina merge în fiecare zi în oraș cu taxiul. Taxiul este rapid, dar nu este ieftin. Homayoun merge pe jos, pentru că locuiește aproape. El economisește bani pentru o mașină.
    note: Un text scurt care recapitulează vocabularul unității și conectorul „چون” (pentru că).
