course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: vocabular despre educație și studii (universitate, școală, domeniu de studiu, student, lecție), numirea unui domeniu de studiu (medicină, drept, economie, literatură), cum întrebi și răspunzi unde studiezi și un dialog între Karim și Parwin despre studii și cum se simt în legătură cu ele.'
units:
  prs.a1.unit31.education:
    title: Educația
    description: Vorbește despre ce studiezi, unde studiezi și ce simți în legătură cu studiile.
