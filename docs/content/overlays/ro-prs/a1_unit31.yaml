  prs.a1.unit31.lesson03.where_question:
    title: Unde studiezi?
  prs.a1.unit31.lesson04.education_dialogue:
    title: Dialog despre educație
  prs.a1.unit31.lesson05.reading_education:
    title: Citim despre educație
  prs.a1.unit31.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Educația
    gloss: educație / studii
    note: تحصیل înseamnă educație sau studii în general; este cuvântul-temă al acestei unități.
    example_gloss: Educația este un lucru bun.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Universitatea
    gloss: universitate
    note: پوهنتون înseamnă universitate. Este cuvântul standard în Afganistan (ca în numele Universității din Kabul), diferit de دانشگاه folosit în Iran.
    example_gloss: Universitatea este în Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Școala
    gloss: școală
    note: مکتب înseamnă școală.
    example_gloss: Această școală este bună.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Domeniu de studiu
    gloss: domeniu de studiu / specializare
    note: رشته înseamnă domeniu de studiu sau specializare universitară; este un cuvânt standard, comun persanei și dariului.
    example_gloss: Domeniul meu este medicina.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Student
    gloss: student
    note: محصل înseamnă student universitar; este termenul standard din dariul afgan, diferit de دانشجو folosit în Iran.
    example_gloss: El/Ea este student(ă).
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lecție
    gloss: lecție
    note: درس înseamnă lecție; se folosește cu خواندن (a citi) pentru a forma expresia verbală „a studia”.
    example_gloss: Învăț în fiecare zi.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: A studia
    gloss: lecție + a citi → învăț
    note: درس (lecție) se combină cu خواندن (a citi) și formează درس می‌خوانم (învăț) – literal „citesc o lecție”, un tipar nou de verb compus în acest curs.
    target_text: درس (lecție) + خواندن (a citi) = درس می‌خوانم (învăț)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Studiez la universitate
    gloss: Studiez la universitate.
    note: Combină من (eu, recapitulare), در (la, recapitulare), پوهنتون și درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medicament
    gloss: medicament
    note: طب înseamnă medicină ca domeniu de studiu; este un cuvânt standard, comun persanei și dariului.
    example_gloss: Medicina este grea.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Dreptul
    gloss: drept
    note: حقوق înseamnă drept ca domeniu de studiu; este un cuvânt standard, comun persanei și dariului.
    example_gloss: Dreptul este interesant.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Economia
    gloss: economie
    note: اقتصاد înseamnă economie ca domeniu de studiu; este un cuvânt standard, comun persanei și dariului.
    example_gloss: Și economia este grea.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literatura
    gloss: literatură
    note: ادبیات înseamnă literatură ca domeniu de studiu; este un cuvânt standard, comun persanei și dariului.
    example_gloss: Îmi place literatura.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Domeniul meu este medicina
    gloss: Domeniul meu este medicina.
    note: Combină رشته من (domeniul meu, recapitulare) cu است (este), introdus aici.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Studiez medicina
    gloss: Studiez medicina.
    note: Aplică من ... می‌خوانم (studiez, recapitulare) direct unui nume de domeniu, de exemplu طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Unde
    gloss: unde
    note: کجا înseamnă unde.
    target_text: کجا (unde)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Studiați (formal)
    gloss: studiați (formal)
    note: درس می‌خوانین este forma formală pentru „studiați”, după tiparul verbal formal în -ین deja cunoscut (de exemplu استفاده می‌کنین din Unitatea 30).
    target_text: درس می‌خوانین (învățați, formal)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Unde studiați?
    gloss: Unde studiați?
    note: Combină شما (dumneavoastră, recapitulare), کجا (unde), درس și می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Studiez la Universitatea din Kabul
    gloss: Studiez la Universitatea din Kabul.
    note: Combină من در ... درس می‌خوانم (studiez la ..., recapitulare) cu پوهنتون کابل (Universitatea din Kabul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: El/ea studiază
    gloss: el/ea studiază
    note: درس می‌خواند este forma de persoana a 3-a, după tiparul verbal în -د deja cunoscut (de exemplu استفاده می‌کند din Unitatea 30).
    target_text: درس می‌خواند (el/ea învață, persoana a 3-a)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Tu / tu studiezi
    gloss: tu (informal) / înveți (informal)
    note: تو și می‌خوانی sunt registrul informal folosit între Karim și Parwin.
    target_text: تو (tu, informal) / می‌خوانی (înveți, informal)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, unde studiezi?'
    gloss: Parwin, unde studiezi?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Studiez la Universitatea din Kabul. Domeniul meu este medicina.'
    gloss: Studiez la Universitatea din Kabul. Domeniul meu este medicina.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Este grea medicina?'
    gloss: Medicina este grea?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Da, este grea, dar interesantă. Dar tu?'
    gloss: Da, este grea, dar interesantă. Dar tu?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Eu învăț la școală.'
    gloss: Eu învăț la școală.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Excelent!'
    gloss: Excelent!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lectură despre educație
    gloss: Parwin studiază la Universitatea din Kabul. Domeniul ei este medicina. Medicina este grea, dar interesantă. Karim învață la școală.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Îmi place / timp / nu am
    gloss: Îmi place / timp / nu am
    note: دوست دارم (îmi place), وقت (timp) și ندارم (nu am) sunt recapitulări din Unitatea 11, Unitatea 14, Unitatea 26, Unitatea 29 și Unitatea 30.
    target_text: دوست دارم (îmi place) / وقت (timp) / ندارم (nu am)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Îmi place educația, dar nu am timp
    gloss: Îmi place educația, dar nu am timp.
    note: Combină تحصیل را دوست دارم (îmi place educația, construcție recapitulată) cu اما وقت ندارم (dar nu am timp).
