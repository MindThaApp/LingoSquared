    instruction: 'Aranjează: Aceasta este bunica mea.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من înseamnă „bunica mea”.
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'Completează: Fratele mamei mele este unchiul meu din partea mamei.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم înseamnă „unchiul meu din partea mamei”.
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'Tradu în dari: Ea este mătușa mea din partea tatălui.'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: Se acceptă spațierea de la tastatură; ortografia standard folosește un ZWNJ.
    - value: او عمهٔ من است
      status: correct
    feedback: عمه este sora tatălui.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Explică relația, nu o persoană anume: spune că کاکا este fratele tatălui tău, iar ماما este fratele mamei tale.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا este din partea tatălui; ماما este din partea mamei.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: Câte persoane are această familie?
    correct_option: cinci
    distractors:
    - patru
    - șase
    - șapte
    accepted_answers:
    - value: cinci
      status: correct
    feedback: پنج نفر înseamnă cinci persoane.
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: Alege sensul propoziției من تک‌فرزند استم.
    correct_option: Sunt singur la părinți.
    distractors:
    - Am un copil.
    - Am un frate.
    - Suntem o familie.
    accepted_answers:
    - value: Sunt singur la părinți.
      status: correct
    feedback: تک‌فرزند înseamnă unic copil la părinți.
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: Potrivește fiecare cuvânt sau expresie cu sensul ei.
    accepted_answers:
    - value:
        دارم: am
        داریم: noi avem
        دارین: dumneavoastră aveți (politicos)
        فامیل: familie
        تک‌فرزند: copil unic
