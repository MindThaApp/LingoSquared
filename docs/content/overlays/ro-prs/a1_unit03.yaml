teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Mama
    gloss: mamă
    note: مادر este cuvântul dari neutru pentru mamă.
    example_gloss: Mama mea este bună.
  prs.a1.unit03.lesson01.teach.father:
    title: Tatăl
    gloss: tată
    note: پدر este cuvântul dari neutru pentru tată.
    example_gloss: Tatăl meu este medic.
  prs.a1.unit03.lesson01.teach.brother:
    title: Fratele
    gloss: frate
    note: برادر înseamnă frate.
    example_gloss: Am un frate.
  prs.a1.unit03.lesson01.teach.sister:
    title: Sora
    gloss: soră
    note: خواهر înseamnă soră.
    example_gloss: Sora mea este profesoară.
  prs.a1.unit03.lesson01.teach.parents:
    title: Părinții
    gloss: tată și mamă; părinți
    note: În dari se spune de obicei پدر و مادر când este vorba despre proprii părinți.
    example_gloss: Părinții mei locuiesc în Kabul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Spune cine este mama ta
    gloss: Aceasta este mama mea.
    note: Terminația ـم din مادرم înseamnă „al meu”, „a mea”.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Bunicul
    gloss: bunic
    note: پدرکلان este termenul dari afgan uzual; la propriu, „tatăl mare” sau „tatăl bătrân”.
    example_gloss: Bunicul meu este bătrân.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Bunica
    gloss: bunică
    note: مادرکلان este termenul dari afgan uzual; la propriu, „mama mare” sau „mama bătrână”.
    example_gloss: Bunica mea este bună.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Fratele tatălui
    gloss: unchi din partea tatălui
    note: کاکا îl desemnează exact pe fratele tatălui tău.
    example_gloss: Unchiul meu locuiește în Herat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Sora tatălui
    gloss: mătușă din partea tatălui
    note: عمه o desemnează exact pe sora tatălui tău.
    example_gloss: Mătușa mea este profesoară.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Fratele mamei
    gloss: unchi din partea mamei
    note: În dari, ماما îl desemnează exact pe fratele mamei tale.
    example_gloss: Unchiul meu (din partea mamei) este inginer.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Sora mamei
    gloss: mătușă din partea mamei
    note: خاله o desemnează exact pe sora mamei tale.
    example_gloss: Mătușa mea (din partea mamei) locuiește în Kabul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Păstrează distincția dintre cele două părți ale familiei
    gloss: Kaka și amma sunt din partea tatălui; mama și khala sunt din partea mamei.
    note: Cuvintele românești „unchi” și „mătușă” nu disting partea familiei, în timp ce aceste patru cuvinte dari o disting.
  prs.a1.unit03.lesson03.teach.family:
    title: Familia
    gloss: familie
    note: فامیل este cuvântul dari afgan obișnuit pentru familie.
    example_gloss: Familia mea este mare.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Întreabă politicos câte persoane are familia
    gloss: Câte persoane sunt în familia dumneavoastră?
    note: ـتان marchează „dumneavoastră” (politicos); نفر este numărătorul pentru persoane.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Spune câte persoane are familia
    gloss: Familia noastră are cinci persoane.
    note: În dari, familia se exprimă printr-un număr de persoane cu نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Numără-ți frații și surorile
    gloss: Am un frate și două surori.
    note: دارم înseamnă „am”. Substantivul rămâne la singular după un număr.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Copil unic
    gloss: Sunt copil unic.
    note: استم este forma de persoana I din dari-ul de Kabul învățată în acest curs.
  prs.a1.unit03.lesson03.teach.possession:
    title: Formele verbului „a avea”
    gloss: am; avem; aveți
    note: دارین înseamnă „aveți” (respectuos sau la plural) în dari-ul colocvial educat din Kabul.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Întreabă despre frați și surori
    gloss: Aveți frați și surori?
    note: دارین face fraza respectuoasă sau la plural.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Întreabă câți frați și surori are cineva
    gloss: Câți frați și câte surori aveți?
    note: چند întreabă „câți”, „câte”.
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Întreabă de părinții cuiva
    gloss: Părinții dumneavoastră sunt bine?
    note: جور استند este o formulă afgană familiară pentru „sunt bine”.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Răspuns afirmativ
    gloss: Da, am un frate.
    note: بلی este „da”-ul standard politicos folosit în Afganistan.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Răspuns negativ
    gloss: Nu, nu am soră.
    note: نخیر este „nu”-ul respectuos; ندارم înseamnă „nu am”.
  prs.a1.unit03.lesson04.teach.polite_your:
    title: „Dumneavoastră” (posesiv politicos)
    gloss: familia ta; mama ta; tatăl tău
    note: Terminația posesivă ـتان exprimă politețea sau pluralul. În acest curs se leagă de cuvânt printr-un ZWNJ.
  prs.a1.unit03.lesson05.teach.married:
    title: Căsătorit
    gloss: căsătorit
    note: متأهل este un termen neutru pentru starea civilă.
    example_gloss: Este căsătorit/căsătorită.
  prs.a1.unit03.lesson05.teach.single:
    title: Necăsătorit
    gloss: necăsătorit; celibatar
    note: مجرد înseamnă aici necăsătorit.
    example_gloss: Sunt necăsătorit/necăsătorită.
  prs.a1.unit03.lesson05.teach.husband:
    title: Soț
    gloss: soț
    note: شوهر este cuvântul obișnuit pentru soț.
    example_gloss: Soțul meu este inginer.
  prs.a1.unit03.lesson05.teach.wife:
    title: Soție
    gloss: soție
    note: خانم poate însemna soție sau doamnă, ca formulă de adresare politicoasă; contextul le deosebește.
    example_gloss: Soția mea este profesoară.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Întreabă politicos despre căsătorie
    gloss: Sunteți căsătorit/căsătorită?
    note: Literal, întreabă „V-ați căsătorit?”. Terminația ـین este forma politicoasă din Kabul.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Spune că ești căsătorit
    gloss: Da, sunt căsătorit/căsătorită.
    note: استم este copula afgană de persoana I singular, folosită aici în dari.
  prs.a1.unit03.lesson05.teach.children:
    title: Întreabă despre copii
    gloss: Ai copii?
    note: اولاد este un cuvânt colectiv frecvent pentru copilul sau copiii cuiva.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam întreabă câți membri are familia
    gloss: Câte persoane sunt în familia dumneavoastră?
    note: Maryam folosește terminația de politețe ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh își descrie frații
    gloss: Suntem cinci persoane. Am un frate și o soră.
    note: Membrii familiei se numără cu نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam întreabă despre căsătorie
    gloss: Sunteți căsătorită?
    note: Întrebarea este politicoasă și neutră ca formă.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh își descrie soțul
    gloss: Da, sunt căsătorită. Soțul meu este student.
    note: محصل, nu cuvântul iranian دانشجو, este termenul consacrat în dari-ul afgan pentru student.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam întreabă despre copii
    gloss: Ai copii?
    note: دارین păstrează adresarea politicoasă.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh răspunde
    gloss: Nu, nu avem încă copii.
    note: نخیر este un „nu” politicos; نداریم înseamnă „nu avem”.
