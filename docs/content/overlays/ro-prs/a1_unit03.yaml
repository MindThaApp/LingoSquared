      status: correct
    feedback: Terminațiile deosebesc persoana I singular, persoana I plural și persoana a II-a de politețe sau plural; ultimele trei arată vocabularul familiei și دارم într-o propoziție întreagă, toate din această lecție.
    pairs:
    - left: دارم
      right: am
    - left: داریم
      right: noi avem
    - left: دارین
      right: dumneavoastră aveți (politicos)
    - left: فامیل
      right: familie
    - left: تک‌فرزند
      right: copil unic
    - left: یک برادر و دو خواهر دارم
      right: Am un frate și două surori.
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 'Aranjează: Suntem șase persoane în familie.'
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است indică o familie de șase persoane.
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'Completează: Am un frate.'
    accepted_answers:
    - value: دارم
      status: correct
    feedback: دارم înseamnă „am”.
  prs.a1.unit03.lesson03.exercise06.translate_size:
    instruction: 'Tradu în dari: Suntem patru persoane în familie.'
    accepted_answers:
    - value: فامیل ما چهار نفر است
      status: correct
    - value: فامیل من چهار نفر است
      status: acceptable_with_note
      note: Înseamnă că în familia mea sunt patru persoane.
    feedback: Folosește numărul împreună cu نفر است.
  prs.a1.unit03.lesson03.exercise07.describe_own:
    instruction: 'Scrie două propoziții în dari cu aceste informații: familia ta are patru persoane și ai un frate.'
    accepted_answers:
    - value: فامیل من چهار نفر است. یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است، یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است و یک برادر دارم.
      status: correct
    - value: فامیل ما چهار نفر است. یک برادر دارم.
      status: correct
    - value: فامیل ما چهار نفر است و یک برادر دارم.
      status: correct
    feedback: فامیل من چهار نفر است indică numărul de persoane; یک برادر دارم adaugă informația despre frate.
  prs.a1.unit03.lesson04.exercise01.recognize_question:
    instruction: Ce întreabă برادر و خواهر دارین؟
    correct_option: Aveți frați și surori?
    distractors:
    - Părinții dumneavoastră sunt bine?
    - Cât de mare este familia dumneavoastră?
    - Sunteți căsătorit/căsătorită?
    accepted_answers:
    - value: Aveți frați și surori?
      status: correct
    feedback: دارین înseamnă „aveți”, la adresarea politicoasă sau la plural.
  prs.a1.unit03.lesson04.exercise02.recognize_negative:
    instruction: Alege sensul propoziției نخیر، خواهر ندارم.
    correct_option: Nu, nu am soră.
    distractors:
    - Da, am o soră.
    - Nu, sora mea nu este aici.
    - Nu am frați.
    accepted_answers:
    - value: Nu, nu am soră.
      status: correct
    feedback: نخیر înseamnă „nu”, iar ندارم înseamnă „nu am”.
  prs.a1.unit03.lesson04.exercise03.match_answers:
    instruction: Potrivește fiecare răspuns cu sensul lui.
    accepted_answers:
    - value:
        بلی: da
        نخیر: nu
