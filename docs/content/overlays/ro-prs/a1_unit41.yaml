course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: anunți că un obiect personal este pierdut, întrebi dacă a fost găsit, descrii obiectul după culoare și mărime și citești un scurt text despre un obiect pierdut și găsit.'
units:
  prs.a1.unit41.lost_items:
    title: Obiecte pierdute
    description: Anunță că un obiect personal este pierdut, întreabă dacă a fost găsit, descrie-l și recunoaște-l când a fost recuperat.
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: 'Vocabular: obiecte pierdute'
  prs.a1.unit41.lesson02.asking_if_found:
    title: Întrebăm dacă a fost găsit
  prs.a1.unit41.lesson03.describing_the_item:
    title: Descrierea obiectului
  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: Dialog despre geanta pierdută
  prs.a1.unit41.lesson05.reading:
    title: Citim despre o geantă pierdută
  prs.a1.unit41.lesson06.wrap_up:
    title: Încheiere
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Recapitulare: acesta, este'
    gloss: acesta / este
    note: این și است sunt cuvinte de bază, folosite pentru a spune ce este ceva.
    target_text: این (acesta) / است (este)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Recapitulare: am'
    gloss: am
    note: دارم este un cuvânt recapitulat, folosit pentru a spune ce obiect ai sau porți cu tine.
    target_text: دارم (am)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Geantă
    gloss: geantă
    note: خریطه este cuvântul obișnuit din dari pentru geantă.
    example_gloss: Am o geantă.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portofel
    gloss: portofel
    note: کیف پول înseamnă portofel și îmbină literal کیف (geantă, toc) cu پول (bani).
    example_gloss: Am un portofel.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Cheie
    gloss: cheie
    note: کلید înseamnă cheie.
    example_gloss: Am o cheie.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Ochelari
    gloss: ochelari
    note: عینک înseamnă ochelari.
    example_gloss: Am ochelari.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Este pierdut(ă)
    gloss: este pierdut(ă)
    note: گم شده îmbină گم (pierdut) cu شده (a devenit) -- modul obișnuit de a spune că ceva este pierdut, același tipar ca în زخمی است (este rănit) din Unitatea 40.
    example_gloss: Mi-am pierdut geanta.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Mi-am pierdut portofelul!
    gloss: Mi-am pierdut portofelul!
    note: کیف پولم este کیف پول cu sufixul posesiv -م (meu), același tipar ca în خانه‌ام (casa mea) din unitățile anterioare.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Recapitulare: puteți, mă, ajutor, faceți (imperativ politicos)'
    gloss: puteți / mă / ajutor / faceți
    note: می‌توانین, مه ره, کمک și کنین se combină pentru a cere ajutor.
    target_text: می‌توانین (puteți) / مه ره (mă) / کمک (ajutor) / کنین (faceți -- imperativ politicos)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Recapitulare: (marca obiectului direct)'
    gloss: (marca obiectului direct)
    note: را marchează lucrul asupra căruia se petrece acțiunea -- aici, lucrul care a fost văzut.
    target_text: را (marcă a obiectului direct)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Ați văzut?
    gloss: ați văzut
    note: دیدین este forma politicoasă de persoana a II-a plural, la trecut, a verbului دیدن (a vedea, întâlnit deja în از دیدن شما خوشحال شدم din Unitatea 2).
    example_gloss: Ați văzut geanta mea?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Ați văzut geanta mea?
    gloss: Ați văzut geanta mea?
    note: Îmbină خریطه‌ام (geanta mea) cu را și دیدین pentru a întreba dacă cineva a observat-o.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: Este găsit(ă) / a fost găsit(ă)
    gloss: este găsit(ă) / a fost găsit(ă)
    note: پیدا شده îmbină پیدا (găsit, apărut) cu شده (a devenit) -- modul obișnuit de a întreba dacă ceva a apărut.
    example_gloss: Cheia mea a fost găsită.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: Mi s-a găsit cheia?
    gloss: Mi s-a găsit cheia?
    note: کلیدم este کلید cu sufixul posesiv -م (cheia mea).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 'Recapitulare: culoare, negru, alb, și'
    gloss: culoare / negru / alb / și
    note: رنگ, سیاه, سفید și و descriu culoarea unui obiect.
    target_text: رنگ (culoare) / سیاه (negru) / سفید (alb) / و (și)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 'Recapitulare: mare, mic'
    gloss: mare / mic
    note: بزرگ și کوچک descriu mărimea unui obiect.
    target_text: بزرگ (mare) / کوچک (mic)
  prs.a1.unit41.lesson03.teach.here_word:
    title: Aici
    gloss: aici
    note: اینجا înseamnă „aici”.
    example_gloss: Cheia este aici.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: Geanta mea este neagră
    gloss: Geanta mea este neagră.
    note: خریطه‌ام (geanta mea) împreună cu سیاه (negru) descrie obiectul ca să fie mai ușor de recunoscut.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: Portofelul meu este mic și negru
    gloss: Portofelul meu este mic și negru.
    note: 'و („și”) leagă două cuvinte descriptive: کوچک (mic) și سیاه (negru).'
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 'Recapitulare: ce, mulțumesc mult'
    gloss: ce / mulțumesc mult
    note: چه și تشکر زیاد sunt cuvinte recapitulate, folosite în dialog.
    target_text: چه (ce) / تشکر زیاد (mulțumesc mult)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 'Recapitulare: da, cu plăcere'
    gloss: da / cu plăcere
    note: بلی și خواهش می‌کنم sunt cuvinte recapitulate, folosite în dialog.
    target_text: بلی (da) / خواهش می‌کنم (cu plăcere)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, mi-am pierdut geanta!'
    gloss: Zarmina, mi-am pierdut geanta!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ce culoare are?'
    gloss: Ce culoare are?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Este neagră.'
    gloss: Este neagră.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Da, am văzut-o! Este aici.'
    gloss: Da, am văzut-o! Este aici.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Mulțumesc mult!'
    gloss: Mulțumesc mult!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Cu plăcere.'
    gloss: Cu plăcere.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 'Recapitulare: unu, el/ea are'
    gloss: un/o / el/ea are
    note: یک și دارد sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: یک (unu) / دارد (are)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: Citire despre o geantă pierdută
    gloss: Homayoun are o geantă. Geanta lui este neagră. Geanta lui s-a pierdut. Zarmina vede geanta. Geanta este aici!
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 'Recapitulare: nu am, dar, dumneavoastră'
    gloss: nu am / dar / dumneavoastră
    note: ندارم, اما și شما sunt cuvinte recapitulate, folosite pentru a contrasta ceea ce ai și ceea ce nu ai și pentru a pune o întrebare politicoasă.
    target_text: ندارم (nu am) / اما (dar) / شما (dumneavoastră, formal)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: Am cheia, dar nu am geanta
    gloss: Am cheia, dar nu am geanta.
    note: اما opune faptul că ai cheia faptului că nu ai geanta.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: Ați văzut geanta mea?
    gloss: Ați văzut geanta mea?
    note: Forma politicoasă cu شما, pentru a întreba direct și respectuos dacă cineva a văzut obiectul.
