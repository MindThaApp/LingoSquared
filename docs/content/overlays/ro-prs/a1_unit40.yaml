course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: recunoști o urgență de bază, ceri ajutor, spui dacă ai nevoie de poliție, ambulanță sau pompieri, descrii o rănire și citești un scurt text despre urgențe.'
units:
  prs.a1.unit40.emergencies:
    title: Urgențe
    description: Recunoaște o urgență de bază, cere ajutor și spune ce fel de ajutor ai nevoie (poliție, ambulanță sau pompieri).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Ajutor de urgență
  prs.a1.unit40.lesson02.asking_for_help:
    title: Cererea de ajutor
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Rănit și sângerând
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Dialog de urgență
  prs.a1.unit40.lesson05.emergency_reading:
    title: Lectură despre ajutorul de urgență
  prs.a1.unit40.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Recapitulare: ajutor, vreau'
    gloss: ajutor / vreau
    note: کمک și می‌خواهم sunt cuvinte recapitulate, folosite în toată unitatea pentru a spune ce fel de ajutor ai nevoie.
    target_text: کمک (ajutor) / می‌خواهم (vreau)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Recapitulare: acesta, este'
    gloss: acesta / este
    note: این și است sunt cuvinte învățate la început, folosite aici pentru a spune despre ce fel de situație este vorba.
    target_text: این (acesta) / است (este)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Urgență
    gloss: urgență
    note: اضطراری înseamnă urgență / urgent.
    example_gloss: Aceasta este o urgență.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Poliția
    gloss: poliția
    note: پولیس este cuvântul dari afgan standard pentru poliție (împrumutat din engleză).
    example_gloss: Am nevoie de poliție.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulanța
    gloss: ambulanța
    note: امبولانس înseamnă ambulanță.
    example_gloss: Am nevoie de o ambulanță.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Foc
    gloss: foc
    note: آتش înseamnă foc.
    example_gloss: Este un incendiu.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Pompierii
    gloss: pompieri
    note: اطفائیه este termenul obișnuit din Kabul pentru serviciul de pompieri.
    example_gloss: Am nevoie de pompieri.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: Este o urgență! Am nevoie de poliție!
    gloss: Este o urgență! Am nevoie de poliție!
    note: این اضطراری است îmbină این (acesta) cu اضطراری (urgență) și است (este).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Recapitulare: puteți, faceți (imperativ politicos), la/pentru, repede'
    gloss: puteți / faceți / la/pentru / repede
    note: می‌توانین, کنین, به și زود (din unități anterioare) se combină cu alte cuvinte pentru a forma cereri și comenzi politicoase.
    target_text: می‌توانین (puteți) / کنین (faceți -- imperativ politicos) / به (la/pentru) / زود (repede)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Mă
    gloss: mă / pe mine
    note: 'مه ره este forma vorbită în dari kabuli pentru مرا („pe mine”, ca obiect direct): مه este forma vorbită a lui من, iar ره este forma vorbită a marcii de obiect را. În scris vei vedea de obicei مرا, care este de asemenea acceptat.'
    example_gloss: Mă poți ajuta?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Mă puteți ajuta?
    gloss: Mă puteți ajuta?
    note: O expresie dari reală, folosită frecvent pentru a cere direct ajutor.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Sunați! (imperativ)
    gloss: sunați
    note: زنگ بزنین este imperativul politicos al verbului زنگ زدن (a suna), pornind de la زنگ می‌زنم (sun), învățat deja.
    example_gloss: Sunați la poliție!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Veniți! (imperativ)
    gloss: veniți
    note: بیایین este imperativul politicos al verbului آمدن (a veni).
    example_gloss: Veniți repede!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Sunați la ambulanță!
    gloss: Sunați la ambulanță!
    note: به (la/pentru) plus امبولانس (ambulanță) plus imperativul زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Recapitulare: el/ea, el/ea are'
    gloss: el/ea / el/ea are
    note: او și دارد sunt forme recapitulate, folosite pentru a descrie starea altei persoane într-o urgență.
    target_text: او (el/ea) / دارد (el/ea are)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Rănit
    gloss: rănit
    note: زخمی înseamnă rănit.
    example_gloss: El/Ea este rănit(ă).
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Sângerare
    gloss: sângerare
    note: خون‌ریزی înseamnă sângerare.
    example_gloss: El/Ea sângerează.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: El/Ea este rănit(ă)! Am nevoie de o ambulanță!
    gloss: El/Ea este rănit(ă)! Am nevoie de o ambulanță!
    note: Îmbină زخمی cu امبولانس می‌خواهم, învățat deja.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: El/Ea sângerează! Veniți repede!
    gloss: El/Ea sângerează! Veniți repede!
    note: Îmbină خون‌ریزی cu زود بیایین, învățat deja.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Recapitulare: ce, el/ea vine, sun, mulțumesc mult'
    gloss: ce / el/ea vine / sun / mulțumesc mult
    note: چه, می‌آید, زنگ می‌زنم și تشکر زیاد sunt cuvinte recapitulate, folosite în dialogul de urgență.
    target_text: چه (ce) / می‌آید (el/ea vine) / زنگ می‌زنم (sun) / تشکر زیاد (mulțumesc mult)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ajutor! Ajutor!'
    gloss: Zarmina, ajutor! Ajutor!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Ce s-a întâmplat?'
    gloss: Ce?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: E rănit(ă)! Sângerează!'
    gloss: E rănit(ă)! Sângerează!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Am nevoie de o ambulanță. Sun acum!'
    gloss: Am nevoie de o ambulanță. Sun acum!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Mulțumesc mult!'
    gloss: Mulțumesc mult!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Ambulanța vine repede.'
    gloss: Ambulanța vine repede.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Recapitulare: unu, persoană, oraș, el/ea face, în'
    gloss: unu / persoană / oraș / el/ea face / în
    note: یک, نفر, شهر, می‌کند și در sunt cuvinte recapitulate, folosite în acest text de citit.
    target_text: یک (unu) / نفر (persoană) / شهر (oraș) / می‌کند (el/ea face) / در (în/la)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Citim despre o urgență
    gloss: În oraș o persoană este rănită. Sângerează. Homayoun ajută. Vine o ambulanță.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Recapitulare: telefon, nu am, dar, dumneavoastră'
    gloss: telefon / nu am / dar / dumneavoastră
    note: تلفن, ندارم, اما și شما sunt cuvinte recapitulate, folosite pentru a opune o nevoie unei limitări și pentru a pune o întrebare formală.
    target_text: تلفن (telefon) / ندارم (nu am) / اما (dar) / شما (dumneavoastră)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Am nevoie de ajutor, dar nu am telefon
    gloss: Am nevoie de ajutor, dar nu am telefon.
    note: اما opune nevoia de ajutor faptului că nu ai telefon ca să-l chemi.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Mă poți ajuta?
    gloss: Puteți să ajutați?
    note: Varianta formală, cu شما, a cererii de ajutor, pentru o rugăminte directă și politicoasă.
