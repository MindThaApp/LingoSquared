    title: Este (persoana a treia)
    gloss: este
    note: 'است este copula de persoana a III-a: معلم است înseamnă este profesor / este profesoară.'
    target_text: است (este – persoana a treia)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: El/ea lucrează
    gloss: el/ea lucrează
    note: 'می‌کند este persoana a III-a singular a prezentului verbului کردن (a face): کار می‌کند înseamnă el/ea lucrează.'
    target_text: کار می‌کند (el/ea lucrează)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: Laila
    gloss: Laila
    note: Nume de personaj care revine în acest curs, prezentat prima dată în unitatea despre prezentări.
    example_gloss: Laila este profesoară.
  prs.a1.unit18.lesson04.teach.profile_text:
    title: Un scurt profil profesional
    gloss: Laila este profesoară. Lucrează la o școală.
    note: Un scurt profil la persoana a III-a, care indică o profesie și un loc de muncă.
  prs.a1.unit18.lesson05.teach.every_word:
    title: Fiecare
    gloss: fiecare
    note: هر înseamnă fiecare.
    example_gloss: Lucrez în fiecare zi.
  prs.a1.unit18.lesson05.teach.day_word:
    title: Zi
    gloss: zi
    note: 'روز înseamnă zi: هر روز înseamnă în fiecare zi.'
    example_gloss: Predă în fiecare zi.
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: Lecție
    gloss: lecție
    note: درس înseamnă lecție.
    example_gloss: Laila predă.
  prs.a1.unit18.lesson05.teach.gives_word:
    title: El/ea dă
    gloss: el/ea dă
    note: 'می‌دهد este persoana a III-a singular a prezentului verbului دادن (a da): درس می‌دهد înseamnă literal „dă lecții”, adică predă.'
    target_text: می‌دهد (el/ea dă – درس می‌دهد înseamnă „predă”)
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: Un profil profesional mai lung
    gloss: Laila este profesoară. Lucrează la o școală. Predă în fiecare zi.
    note: Același profil ca în lecția anterioară, completat cu o activitate zilnică.
  prs.a1.unit18.lesson06.teach.names:
    title: Bashir și Negar
    gloss: Bashir, Negar
    note: Personaje care revin în acest curs.
    example_gloss:
    - Eu sunt Bashir.
    - Eu sunt Negar.
  prs.a1.unit18.lesson06.teach.you_word:
    title: Dumneavoastră
    gloss: dumneavoastră
    note: شما este pronumele politicos de persoana a II-a.
    target_text: شما (dumneavoastră – politicos)
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: Ce este
    gloss: ce este
    note: 'چیست înseamnă ce este: کار شما چیست؟ înseamnă care este profesia dumneavoastră?'
    target_text: چیست (ce este)
  prs.a1.unit18.lesson06.teach.yes_word:
    title: Da
    gloss: da
    note: بلی este cuvântul politicos/formal pentru da, în acord cu registrul acestui curs.
    example_gloss: Da, lucrez în fiecare zi.
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: Bashir întreabă
    gloss: Care este profesia dumneavoastră?
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: Negar răspunde
    gloss: Sunt doctor. Lucrez la un spital.
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: Bashir întreabă
    gloss: Lucrați în fiecare zi?
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: Negar răspunde
    gloss: Da, lucrez în fiecare zi.
