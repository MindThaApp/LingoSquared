course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: meserii de bază (profesor, inginer, doctor, negustor), locuri de muncă (birou, magazin, spital, școală), asocierea unei meserii cu un loc de muncă, citirea unui profil profesional scurt și apoi a unuia mai lung, precum și un dialog despre meseria cuiva.'
units:
  prs.a1.unit18.work:
    title: Munca
    description: Spune o meserie de bază, locul de muncă și o activitate simplă.
lessons:
  prs.a1.unit18.lesson01.occupation_words:
    title: Cuvinte pentru meserii
  prs.a1.unit18.lesson02.workplace_words:
    title: Cuvinte pentru locuri de muncă
  prs.a1.unit18.lesson03.combining_job_and_place:
    title: Meserie și loc de muncă împreună
  prs.a1.unit18.lesson04.reading_a_work_profile:
    title: Citirea unui profil profesional
  prs.a1.unit18.lesson05.reading_a_longer_profile:
    title: Citirea unui profil profesional mai lung
  prs.a1.unit18.lesson06.job_dialogue:
    title: Un dialog despre meseria cuiva
teaching:
  prs.a1.unit18.lesson01.teach.teacher_word:
    title: Profesor
    gloss: profesor
    note: معلم înseamnă „profesor”.
    example_gloss: Sunt profesor.
  prs.a1.unit18.lesson01.teach.engineer_word:
    title: Inginer
    gloss: inginer
    note: مهندس înseamnă „inginer”.
    example_gloss: Sunt inginer.
  prs.a1.unit18.lesson01.teach.doctor_word:
    title: Doctor
    gloss: doctor
    note: داکتر este forma standard afgană, ca scriere și pronunție, pentru „doctor”.
    example_gloss: Sunt doctor.
  prs.a1.unit18.lesson01.teach.shopkeeper_word:
    title: Vânzătorul
    gloss: vânzător
    note: دوکاندار este termenul standard afgan pentru „negustor”, deja introdus în unitatea despre cumpărături a acestui curs.
    example_gloss: Sunt negustor.
  prs.a1.unit18.lesson01.teach.work_word:
    title: Muncă / serviciu
    gloss: muncă / serviciu
    note: کار înseamnă „muncă” sau „serviciu”.
    example_gloss: Am de lucru.
  prs.a1.unit18.lesson01.teach.am_word:
    title: Sunt
    gloss: sunt
    note: استم este forma politicoasă de persoana întâi a verbului „a fi”, în acord cu registrul استم/استین al acestui curs.
    target_text: استم (sunt)
  prs.a1.unit18.lesson02.teach.office_word:
    title: Biroul
    gloss: birou
    note: دفتر înseamnă „birou”.
    example_gloss: Lucrez într-un birou.
  prs.a1.unit18.lesson02.teach.shop_word:
    title: Magazin
    gloss: magazin
    note: دوکان înseamnă magazin.
    example_gloss: Lucrez într-un magazin.
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: Spital
    gloss: spital
    note: شفاخانه este termenul dari autentic din Afganistan pentru spital, deja prezentat în unitatea despre locuri a acestui curs.
    example_gloss: Lucrez la un spital.
  prs.a1.unit18.lesson02.teach.school_word:
    title: Școala
    gloss: școală
    note: مکتب este termenul dari autentic din Afganistan pentru școală, deja prezentat în unitatea despre locuri a acestui curs.
    example_gloss: Lucrez la o școală.
  prs.a1.unit18.lesson02.teach.in_word:
    title: În / la
    gloss: în / la
    note: 'در marchează locul în care se petrece ceva: در مکتب înseamnă la școală.'
    target_text: در (în / la)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: Lucrez
    gloss: fac / lucrez
    note: 'می‌کنم este persoana I singular a prezentului verbului کردن (a face): کار می‌کنم înseamnă literal „fac muncă”, adică lucrez.'
    target_text: کار می‌کنم (lucrez)
  prs.a1.unit18.lesson03.teach.where_word:
    title: Unde
    gloss: unde
    note: کجا înseamnă unde.
    target_text: کجا (unde)
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: Lucrați (politicos)
    gloss: lucrați
    note: کار می‌کنین înseamnă lucrați (formă politicoasă).
    target_text: کار می‌کنین (lucrați – politicos)
  prs.a1.unit18.lesson03.teach.and_word:
    title: Și
    gloss: și
    note: و înseamnă și; leagă două propoziții sau doi termeni.
    target_text: و (și)
