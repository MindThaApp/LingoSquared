course:
  title: Dari în română A1
  description: 'Dari afgană pentru începători: răspunsul la telefon, prezentarea într-un apel, rugămintea de a repeta sau de a vorbi rar, lăsarea unui mesaj și mesajele text de bază.'
units:
  prs.a1.unit07.communication:
    title: Vorbim la telefon
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Răspunde la telefon
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Prezintă-te într-un apel
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Roagă pe cineva să repete sau să vorbească rar
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Lasă un mesaj
  prs.a1.unit07.lesson05.text_messages:
    title: Citește și scrie un mesaj text scurt
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: O convorbire telefonică completă
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Alo (la telefon)
    gloss: alo (la telefon)
    note: الو se folosește special pentru a răspunde la telefon sau a începe un apel, spre deosebire de سلام, folosit în întâlnirile față în față.
    example_gloss: Alo, vorbește Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Invită apelantul să continue
    gloss: Da, vă ascult.
    note: بلی، بفرمایین este modul firesc de a răspunde după ce ai ridicat receptorul. Folosește același politicos بفرمایین („poftiți”) întâlnit deja în curs; nu este o traducere literală a lui „vă ascult”.
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Telefon (recapitulare)
    gloss: telefon
    note: تلفن a fost introdus în lecția despre numere; aici este cadrul întregii unități.
    example_gloss: Telefonul meu este stricat.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Întreabă cine sună
    gloss: Scuzați-mă, cine vorbește?
    note: ببخشین، کی صحبت می‌کند؟ întreabă politicos cine este apelantul.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Prezintă-te
    gloss: Sunt Farid.
    note: من فرید استم spune direct cine sună, cu același model استم din unitățile anterioare.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Explică legătura ta cu persoana căutată
    gloss: Sunt colegul lui Homayoun.
    note: همکار همایون استم explică motivul apelului; este util când cel care răspunde nu te cunoaște.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Roagă pe cineva să vorbească rar
    gloss: Vorbiți rar, vă rog.
    note: لطفاً آهسته صحبت کنین este o rugăminte politicoasă și firească la un apel cu semnal slab sau când înveți limba.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Roagă pe cineva să repete (recapitulare)
    gloss: Puteți repeta, vă rog?
    note: می‌توانین دوباره بگویین؟ a fost introdus în unitatea despre prezentări; se potrivește la fel de bine într-un apel telefonic.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Combină cele două rugăminți
    gloss: Vă rog, vorbiți rar și repetați.
    note: و leagă cele două rugăminți într-o singură frază firească.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Mesaj
    gloss: mesaj
    note: پیام este cuvântul general pentru mesaj, vorbit sau scris.
    example_gloss: Am un mesaj pentru dumneavoastră.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Spune că vrei să lași un mesaj
    gloss: Vreau să las un mesaj.
    note: می‌خواهم یک پیام بگذارم se spune atunci când persoana pe care o suni nu este disponibilă.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Spune că suni mai târziu
    gloss: Sun mai târziu.
    note: بعد زنگ می‌زنم este o alternativă simplă la lăsarea unui mesaj.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Mesajul text
    gloss: mesaj text (mesaj scurt)
    note: پیام کوتاه înseamnă literal „mesaj scurt”, modul obișnuit de a numi un SMS.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Un mesaj exemplu
    gloss: Mâine ședința este la ora nouă.
    note: فردا جلسه ساعت نه است este o informație completă și firească de transmis într-un mesaj.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Confirmă că vei transmite mesajul
    gloss: Transmit eu mesajul.
    note: می‌رسانم confirmă că mesajul va ajunge la destinatar.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima răspunde la telefon
    gloss: Lima răspunde cu formula de salut la telefon.
    note: الو؟ este modul obișnuit de a răspunde la un apel.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid o salută și se asigură cine este
    gloss: Farid o salută și întreabă dacă este Lima.
    note: الو، سلام îmbină formula de la telefon cu salutul obișnuit.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima îl invită să continue și întreabă cine sună
    gloss: Lima îl invită să continue și întreabă cine sună.
    note: بلی، بفرمایین și کی صحبت می‌کند؟ provin amândouă din lesson01/lesson02.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid se prezintă
    gloss: Farid spune că este colegul lui Homayoun.
    note: Reia modelul colegului din lesson02 și îi dă Limei un motiv să aibă încredere în apel.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima îl roagă să vorbească rar
    gloss: Lima îl salută și îl roagă să vorbească rar.
    note: آهسته صحبت کنین، لطفاً reia rugămintea din lesson03.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid acceptă și cere să lase un mesaj
    gloss: Farid acceptă și spune că vrea să lase un mesaj pentru Homayoun.
    note: Extinde modelul پیام din lesson04, numind un destinatar anume (برای همایون, „pentru Homayoun”).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima este de acord să noteze
    gloss: Lima îl invită să continue și spune că notează.
    note: بفرمایین îl invită aici pe Farid să continue.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid dictează mesajul
    gloss: Farid o roagă să transmită că ședința este mâine la nouă.
    note: Reia direct conținutul mesajului-exemplu din lesson05.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima confirmă și promite că va transmite mesajul
    gloss: Lima confirmă detaliile și spune că va transmite mesajul.
    note: می‌رسانم încheie partea de preluare a mesajului din convorbire, așa cum s-a învățat în lesson05.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid îi mulțumește și își ia rămas-bun
    gloss: Farid îi mulțumește mult și își ia rămas-bun.
    note: تشکر زیاد și خدا حافظ reiau vocabular din unitățile anterioare.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima își ia rămas-bun
    gloss: Lima își ia rămas-bun.
    note: خدا حافظ încheie apelul.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Spune că cineva a lăsat un mesaj (trecut)
    gloss: Farid a lăsat un mesaj.
    note: گذاشت este trecutul simplu („a lăsat”) al verbului din می‌خواهم یک پیام بگذارم din lesson04, unde بگذارم înseamnă „las”. Îl folosești pentru a rezuma ce s-a întâmplat după un apel.
    target_text: فرید پیام گذاشت (Farid a lăsat un mesaj)
