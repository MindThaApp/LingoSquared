teaching:
  prs.a1.unit52.lesson01.teach.review_this_is_in_good:
    title: 'Recapitulare: acesta, este, în, bun'
    gloss: acesta / este / în / bun
    note: Acestea sunt cuvinte de recapitulare (folosite în tot cursul) pentru a vorbi despre cinema.
    target_text: این (acesta/aceasta) / است (este) / در (în) / خوب (bun)
  prs.a1.unit52.lesson01.teach.cinema_word:
