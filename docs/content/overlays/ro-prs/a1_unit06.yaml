    gloss: Negustorul confirmă și spune să meargă mai întâi drept înainte.
    note: اول مستقیم بروین începe succesiunea de indicații.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila confirmă și întreabă ce urmează
    gloss: Sohaila repetă „drept înainte” ca să confirme, apoi întreabă ce urmează.
    note: بعد چطور؟ este o modalitate firească și scurtă de a cere pasul următor.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Negustorul dă al doilea pas și reperul
    gloss: Negustorul spune să vireze la stânga, apoi indică farmacia folosind moscheea și banca drept repere.
    note: Aici se îmbină indicația de viraj din lecția 2 cu tiparul reperelor din lecția 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila îi mulțumește și confirmă că a înțeles
    gloss: Sohaila îi mulțumește mult și spune că a înțeles.
    note: تشکر زیاد، فهمیدم încheie schimbul de replici, așa cum s-a învățat în lecția 4.
  prs.a1.unit06.lesson06.teach.turn06:
