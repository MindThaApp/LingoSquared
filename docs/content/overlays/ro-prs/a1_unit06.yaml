  prs.a1.unit06.lesson02.teach.turn_right:
    title: Spune cuiva să vireze la dreapta
    gloss: Virați la dreapta.
    note: به راست بپیچین urmează același tipar, cu راست în loc de چپ.
  prs.a1.unit06.lesson03.teach.first_word:
