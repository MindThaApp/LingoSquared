    title: Viraţi (imperativ politicos)
    gloss: a vira
    note: بپیچین este forma de imperativ politicos a verbului „a vira”, folosită când îi indici cuiva drumul.
    example_gloss: Virează la dreapta.
  prs.a1.unit06.lesson01.teach.to_word:
    title: Spre / către
    gloss: spre / către
    note: به se leagă de un cuvânt de direcție, ca în به چپ (la stânga).
    target_text: به (spre / către)
