    gloss: Ați putea să-mi spuneți cum ajung la piață?
    note: می‌توانین بگویین...؟ este o formulă politicoasă pentru „Ați putea să-mi spuneți...?” și se potrivește când ceri indicații unui străin. بروم înseamnă „merg”, deci toată fraza întreabă cum pot ajunge acolo.
