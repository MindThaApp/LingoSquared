  prs.a1.unit11.lesson01.teach.saat_word:
    title: Oră / ceas
    gloss: oră / ceas
    note: '*ساعت* înseamnă și oră, și ceas, și marchează ora exactă în exprimarea timpului.'
    example_gloss: Cât este ceasul?
