  prs.a1.unit11.lesson01.teach.nim_word:
    title: Jumătate
    gloss: jumătate
    note: '*نیم* înseamnă jumătate și se folosește pentru jumătatea de oră (de ex. *ساعت سه و نیم*, trei și jumătate).'
    example_gloss: Este șapte și jumătate.
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Sfert
    gloss: sfert
    note: '*ربع* înseamnă sfert și se folosește pentru sferturile de oră (de ex. *ساعت چهار و ربع*, patru și un sfert).'
    example_gloss: Este opt fără un sfert.
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: Numerele 1-5 (recapitulare)
    gloss: unu, doi, trei, patru, cinci
    note: '*یک، دو، سه، چهار، پنج* recapitulează numerele din Unitatea 4, necesare pentru a spune ora.'
    example_gloss:
    - Am o carte.
    - Am doi frați.
    - Am trei surori.
    - Mai rămân patru zile.
    - Așteptați cinci minute.
  prs.a1.unit11.lesson02.teach.chand_word:
    title: Câți / cât / care
    gloss: câți / cât / care
    note: '*چند* se combină cu *ساعت* pentru a întreba ora: *ساعت چند است؟*'
    example_gloss: Cât este ceasul?
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: Cât este ceasul?
    gloss: Cât este ceasul?
    note: '*ساعت چند است؟* este modul neutru și politicos de a întreba ora în dari.'
  prs.a1.unit11.lesson02.teach.register_note:
    title: Notă despre registru
    gloss: ساعت چند است؟ (formă completă, neutră)
    note: '*ساعت چند است؟* este forma completă, neutră: este corectă și în scris, și în vorbire. În vorbirea rapidă, informală, *است* se reduce adesea la un -ه final (ca în *چنده*), dar folosește forma completă cât timp înveți.'
    target_text: ساعت چند است؟ (formă completă, neutră)
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: Este ora trei.
