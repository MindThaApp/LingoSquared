course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: te cazezi la hotel, întrebi despre dotările camerei (baie, mic dejun, wifi) și despre cheie, spui câte nopți rămâi, citești o scurtă confirmare de rezervare și întrebi despre ora de eliberare a camerei.'
units:
  prs.a1.unit45.accommodation:
    title: Hotelul și camera
    description: Te cazezi la hotel, întrebi despre dotările camerei și despre cheie, spui durata șederii, citești o confirmare de rezervare și întrebi despre ora de eliberare a camerei.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
    title: Hotel, cameră și cheie
  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: Baie și rezervare
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Numărul camerei și câte nopți
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: Dialog la recepția hotelului
  prs.a1.unit45.lesson05.reading:
    title: Citim despre rezervarea lui Homayoun
  prs.a1.unit45.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Recapitulare: acesta, este, în'
    gloss: acesta / este / în
    note: این, است și در (folosite pe tot parcursul cursului) sunt cuvinte recapitulate, utile pentru a vorbi despre hoteluri și camere.
    target_text: این (acesta) / است (este) / در (în)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: هوتل este cuvântul folosit în dari-ul afgan pentru hotel, scris cu waw, diferit de هتل din persana iraniană.
    example_gloss: Acesta este un hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Cameră
    gloss: cameră
    note: اتاق este cuvântul obișnuit în dari pentru cameră.
    example_gloss: Camera este în hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: Camera este în hotel
    gloss: Camera este în hotel.
    note: اتاق در هوتل است combină cuvinte învățate mai devreme în această lecție.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Cheie
    gloss: cheie
    note: کلید este cuvântul standard în dari pentru cheie.
    example_gloss: Aceasta este o cheie.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Cheia camerei
    gloss: cheia camerei
    note: کلید اتاق îmbină کلید (cheie) și اتاق (cameră).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Aceasta este cheia camerei
    gloss: Aceasta este cheia camerei.
    note: این کلید اتاق است combină cuvinte învățate mai devreme în această lecție.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Recapitulare: am, are'
    gloss: am / are
    note: دارم și دارد sunt cuvinte recapitulate, folosite pentru a întreba despre dotările camerei.
    target_text: دارم (am) / دارد (are)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Baie
    gloss: baie
    note: تشناب este cuvântul obișnuit în dari pentru baie sau toaletă.
    example_gloss: Camera are baie.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: Camera are baie?
    gloss: Camera are baie?
    note: اتاق تشناب دارد؟ este o întrebare cu răspuns da/nu, formată prin intonație ascendentă, fără un cuvânt interogativ separat.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Da, are baie
    gloss: Da, are baie.
    note: بلی este cuvântul recapitulat pentru „da”.
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Rezervare
    gloss: rezervare
    note: رزرو este un împrumut larg folosit pentru rezervare.
    example_gloss: Am o rezervare.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: Am o rezervare
    gloss: Am o rezervare.
    note: رزرو دارم îmbină رزرو (rezervare) și دارم (am).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Recapitulare: câți/ce număr, pentru, vreau'
    gloss: câți / ce număr / pentru / vreau
    note: چند, برای și می‌خواهم sunt cuvinte recapitulate, folosite pentru a întreba despre cameră.
    target_text: چند (câți / ce număr) / برای (pentru) / می‌خواهم (vreau)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Număr
    gloss: număr
    note: نمبر este împrumutul obișnuit în dari-ul afgan pentru „număr”, folosit pentru numere de cameră, de telefon și altele asemenea.
    example_gloss: numărul camerei
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Care este numărul camerei?
    gloss: Care este numărul camerei?
    note: نمبر اتاق چند است؟ cere numărul camerei folosind چند.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Recapitulare: noapte, doi, trei'
    gloss: noapte / doi / trei
    note: شب, دو și سه sunt cuvinte recapitulate, folosite pentru a spune durata șederii.
    target_text: شب (noapte) / دو (doi) / سه (trei)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Rămân
    gloss: rămân
    note: می‌مانم vine de la ماندن, „a rămâne”.
    example_gloss: Rămân două nopți.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Rămân două nopți
    gloss: Rămân două nopți.
    note: دو شب می‌مانم îmbină دو شب (două nopți) și می‌مانم (rămân).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: Îl vreau pentru două nopți
    gloss: Îl vreau pentru două nopți.
    note: برای دو شب می‌خواهم folosește برای (pentru) împreună cu cuvântul recapitulat می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Recapitulare: rămâneți (formal)'
    gloss: rămâneți (formal)
    note: می‌مانین este forma de plural de politețe a lui می‌مانم și face parte din aceeași familie în -ین ca می‌خواهین/کنین din alte părți ale cursului.
    target_text: می‌مانین (rămâneți, formal)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Câte nopți rămâneți?
    gloss: Câte nopți rămâneți?
    note: چند شب می‌مانین؟ este întrebarea formală pe care o pune recepționerul unui hotel.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Recapitulare: bun venit, cum vă numiți?, sunt'
    gloss: bun venit / cum vă numiți? / sunt
    note: خوش آمدین, نام‌تان چیست؟ și استم sunt cuvinte recapitulate, folosite la recepție.
    target_text: خوش آمدین (bun venit) / نام‌تان چیست؟ (cum vă numiți?) / استم (sunt)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Recapitulare: și, ce zici de, poftiți, mulțumesc mult'
    gloss: și / ce zici de / poftiți / mulțumesc mult
    note: هم, چطور, بفرمایین și تشکر زیاد (din unități anterioare) sunt cuvinte recapitulate, folosite la încheierea dialogului.
    target_text: هم (de asemenea) / چطور (dar) / بفرمایین (poftiți) / تشکر زیاد (mulțumesc mult)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Micul dejun
    gloss: micul dejun
    note: چای صبح înseamnă literal „ceai de dimineață” și este felul obișnuit în dari afgan de a spune micul dejun; este format din چای (ceai, Unitatea 8) și صبح (dimineață, Unitatea 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: Inclus
    gloss: inclus
    note: شامل înseamnă inclus și se folosește pentru a spune că un serviciu vine odată cu camera.
    example_gloss: Micul dejun este inclus.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wifi
    gloss: wifi
    note: وای‌فای este împrumutul standard pentru wifi.
    example_gloss: Are și wifi.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Bună ziua. Am o rezervare. Rămân două nopți.'
    gloss: Bună ziua. Am o rezervare. Rămân două nopți.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Recepționerul: Bun venit. Cum vă numiți?'
    gloss: Bun venit. Cum vă numiți?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Sunt Homayoun.'
    gloss: Sunt Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Recepționerul: Foarte bine. Camera are baie, iar micul dejun este inclus.'
    gloss: Foarte bine. Camera are baie, iar micul dejun este inclus.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Dar wifi?'
    gloss: Dar wifi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Recepționerul: Da, are și wifi. Poftiți cheia.'
    gloss: Da, are și wifi. Poftiți cheia.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Recapitulare: rezervare, număr, cinci, luni, marți, și'
    gloss: rezervare / număr / cinci / luni / marți / și
    note: رزرو, نمبر (din această unitate), پنج, دوشنبه, سه‌شنبه și و sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: رزرو (rezervare) / نمبر (număr) / پنج (cinci) / دوشنبه (luni) / سه‌شنبه (marți) / و (și)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Recapitulare: el/ea rămâne'
    gloss: el/ea rămâne
    note: می‌ماند este forma de persoana a III-a din familia می‌مانم/می‌مانین, învățată mai devreme în această unitate.
    target_text: می‌ماند (el/ea rămâne)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: Despre rezervarea lui Homayoun
    gloss: 'Aceasta este rezervarea lui Homayoun. Camera are numărul cinci. Homayoun rămâne două nopți: luni și marți. Camera are baie, iar micul dejun este inclus.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Recapitulare: dar, dumneavoastră, oră, timp, șapte, doisprezece'
    gloss: dar / dumneavoastră / oră / timp / șapte / doisprezece
    note: اما, شما, ساعت, وقت (din unități anterioare) și هفت/دوازده sunt cuvinte recapitulate, folosite pentru a spune un program.
    target_text: اما (dar) / شما (dumneavoastră) / ساعت (oră) / وقت (timp) / هفت (șapte) / دوازده (doisprezece)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Eliberarea camerei / ieșire
    gloss: eliberarea camerei / ieșire
    note: خروج denumește ora de eliberare a camerei, ca în وقت خروج.
    example_gloss: ora de eliberare a camerei
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: Camera se eliberează la ora doisprezece
    gloss: Camera se eliberează la ora doisprezece.
    note: وقت خروج ساعت دوازده است indică ora de eliberare a camerei.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: Micul dejun este la șapte, dar camera se eliberează la douăsprezece
    gloss: Micul dejun este la ora șapte, dar camera se eliberează la ora doisprezece.
    note: اما pune în contrast ora micului dejun și ora de eliberare a camerei.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: La ce oră eliberați camera?
    gloss: La ce oră eliberați camera?
    note: Varianta formală, cu شما, a întrebării despre ora de eliberare a camerei.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (foarte bine) / چای (ceai) / صبح (dimineață) / و (și)
