    title: 'Recapitulare: dar, dumneavoastră, câți'
    gloss: dar / dumneavoastră / câți
    note: اما, شما și چند (din unitățile anterioare) sunt cuvinte recapitulate, folosite pentru a indica un program de administrare.
    target_text: اما (dar) / شما (dumneavoastră) / چند (câte)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Recapitulare: dimineață, noapte, doi, trei, bucată, este, rețeta dumneavoastră'
    gloss: dimineață / noapte / doi / trei / bucată / este / rețeta dumneavoastră
    note: صبح, شب, دو, سه, دانه, است (din unitățile anterioare și din această unitate) și نسخه‌تان (rețeta dumneavoastră, cu același sufix -تان ca în نام‌تان/تلفن‌تان din alte părți ale acestui curs) sunt cuvinte recapitulate, folosite pentru a încheia unitatea.
    target_text: صبح (dimineață) / شب (noapte, seară) / دو (doi) / سه (trei) / دانه (bucată) / است (este) / نسخه‌تان (rețeta dumneavoastră)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Dimineața sunt două bucăți, dar noaptea sunt trei bucăți
    gloss: Dimineața sunt două bucăți, dar noaptea sunt trei bucăți.
    note: اما pune în contrast doza de dimineață și doza de noapte.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Câte bucăți are rețeta dumneavoastră?
    gloss: Câte bucăți are rețeta dumneavoastră?
    note: Varianta formală, cu sufixul -تان după شما, pentru a întreba despre doza dintr-o rețetă.
