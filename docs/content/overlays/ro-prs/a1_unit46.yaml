    title: Recapitulare
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Recapitulare: acesta, este, în'
    gloss: acesta / este / în
    note: این, است și در (folosite în tot cursul) sunt cuvinte de recapitulare pentru a vorbi despre farmacie.
    target_text: این (acesta) / است (este) / در (în)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Farmacie
    gloss: farmacie
    note: دواخانه înseamnă literal „casa medicamentelor" -- format la fel ca کتابخانه („casa cărților", biblioteca, Unitatea 43).
    example_gloss: Aceasta este o farmacie.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: Aceasta este o farmacie
    gloss: Aceasta este o farmacie.
    note: این دواخانه است combină cuvintele învățate mai devreme în această lecție.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Farmacist
    gloss: farmacist
    note: دواساز înseamnă literal „cel care face medicamente”.
    example_gloss: Farmacistul este în farmacie.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Farmacistul este în farmacie
    gloss: Farmacistul este în farmacie.
    note: دواساز در دواخانه است combină دواساز (farmacist) și دواخانه (farmacie).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Recapitulare: medicament, vreau'
    gloss: medicament / vreau
    note: دوا și می‌خواهم sunt cuvinte recapitulate, folosite pentru a cere un medicament.
    target_text: دوا (medicament) / می‌خواهم (vreau)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Vreau un medicament
    gloss: Vreau un medicament.
    note: دوا می‌خواهم combină دوا (medicament) și می‌خواهم (vreau).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Recapitulare: durere de cap, durere de stomac, am, aveți'
    gloss: durere de cap / durere de stomac / am / aveți (politicos)
    note: سردرد, دل‌درد, دارم și دارین sunt cuvinte recapitulate, folosite pentru a descrie un simptom.
    target_text: سردرد (durere de cap) / دل‌درد (durere de burtă) / دارم (am) / دارین (aveți, politicos)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Recapitulare: foarte, da, nu'
    gloss: foarte / da / nu
    note: بسیار, بلی și نخیر (din unitățile anterioare) sunt cuvinte recapitulate, folosite pentru a răspunde la o întrebare despre un simptom.
    target_text: بسیار (foarte) / بلی (da) / نخیر (nu)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Durere de dinți
    gloss: durere de dinți
    note: دندان‌درد combină دندان (dinte, Unitatea 42) cu același model -درد („durere”) deja folosit în سردرد și دل‌درد.
    example_gloss: Mă doare dintele.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: Am o durere de dinți puternică
    gloss: Am o durere de dinți puternică.
    note: بسیار دندان‌درد دارم folosește بسیار (foarte) pentru a întări simptomul.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Aveți dureri de cap?
    gloss: Aveți dureri de cap?
    note: سردرد دارین؟ este o întrebare cu răspuns da/nu, formată prin intonație ascendentă, fără un cuvânt interogativ separat.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: Nu, mă dor dinții
    gloss: Nu, am o durere de dinți.
    note: نخیر răspunde la întrebarea anterioară și numește simptomul real.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Recapitulare: vreau, un/una'
    gloss: vreau / un, o / unu
    note: می‌خواهم și یک (din unitățile anterioare) sunt cuvinte recapitulate, folosite pentru a cere o formă de medicament.
    target_text: می‌خواهم (vreau) / یک (un / unu)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Tabletă
    gloss: tabletă / pastilă
    note: قرص este cuvântul dari obișnuit pentru tabletă sau pastilă.
    example_gloss: Vreau o tabletă.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Vreau o tabletă
    gloss: Vreau o tabletă.
    note: یک قرص می‌خواهم combină یک (o) și قرص (tabletă).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Sirop
    gloss: sirop
    note: شربت este cuvântul dari obișnuit pentru un medicament lichid sau sirop.
    example_gloss: Vreau sirop.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Vreau sirop
    gloss: Vreau sirop.
    note: شربت می‌خواهم combină شربت (sirop) și می‌خواهم (vreau).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Recapitulare: care, medicament, doriți (politicos)'
    gloss: care / medicament / doriți (politicos)
    note: کدام, دوا și می‌خواهین sunt cuvinte recapitulate, folosite pentru a întreba ce dorește clientul.
    target_text: کدام (care) / دوا (medicament) / می‌خواهین (vreți, politicos)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Ce medicament doriți?
    gloss: Ce medicament doriți?
    note: کدام دوا می‌خواهین؟ este întrebarea politicoasă pe care o pune un farmacist.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Recapitulare: salut, durere de stomac, am'
    gloss: salut / durere de stomac / am
    note: سلام, دل‌درد și دارم (din unitățile anterioare) sunt cuvinte recapitulate, folosite pentru a începe dialogul.
    target_text: سلام (bună) / دل‌درد (durere de burtă) / دارم (am)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Recapitulare: medicament, doriți (politicos), da'
    gloss: medicament / doriți (politicos) / da
    note: دوا, می‌خواهین și بلی (din unitățile anterioare) sunt cuvinte recapitulate, folosite în întrebările farmacistului.
    target_text: دوا (medicament) / می‌خواهین (vreți, politicos) / بلی (da)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Recapitulare: acesta, tabletă, bun, este'
    gloss: acesta / tabletă / bun / este
    note: این, قرص, خوب și است (din unitățile anterioare și din această lecție) sunt cuvinte recapitulate, folosite pentru a descrie medicamentul.
    target_text: این (acesta) / قرص (pastilă) / خوب (bun) / است (este)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Bucată
    gloss: bucată / doză
    note: دانه este un cuvânt numărător pentru o bucată sau o doză, folosit pentru tablete.
    example_gloss: Trei bucăți.
  prs.a1.unit46.lesson04.teach.take_word:
