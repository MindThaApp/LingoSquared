    title: 'Homayoun: Da, vreau o tabletă.'
    gloss: Da, vreau o tabletă.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Farmacistul: Tableta aceasta este bună. Luați trei pe zi.'
    gloss: Tableta aceasta este bună. Luați trei pe zi.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Mulțumesc mult.'
    gloss: Mulțumesc mult.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Farmacistul: Cu plăcere.'
    gloss: Cu plăcere.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Recapitulare: acesta, este, Homayoun, de la'
    gloss: acesta / este / Homayoun / de la
    note: 'این, است și همایون sunt cuvinte recapitulate, folosite în textul de citit. از (din unitățile anterioare, de obicei „de la”) este folosit aici ca parte a predicatului, împreună cu است, pentru a arăta posesia: این نسخه از همایون است înseamnă literal „această rețetă este de la Homayoun”, dar în realitate „aceasta este rețeta lui Homayoun”, același tipar ca în این کتاب از من است, „această carte este a mea”.'
    target_text: این (acesta) / است (este) / همایون / از (de la)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Recapitulare: unu, tabletă, zi, trei, bucată, luați'
    gloss: unu / tabletă / zi / trei / bucată / luați
    note: یک, قرص, روز, سه, دانه și بگیرین (din această unitate) sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: یک (unu) / قرص (pastilă) / روز (zi) / سه (trei) / دانه (bucată) / بگیرین (luați)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Rețetă
    gloss: rețetă
    note: نسخه este cuvântul dari obișnuit pentru rețetă sau pentru eticheta unui medicament.
    example_gloss: Aceasta este o rețetă.
  prs.a1.unit46.lesson05.teach.reading_passage:
