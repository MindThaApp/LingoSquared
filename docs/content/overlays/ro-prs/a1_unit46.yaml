    gloss: zi / trei / mulțumesc mult / cu plăcere
    note: روز, سه, تشکر زیاد și خواهش می‌کنم (din unitățile anterioare) sunt cuvinte recapitulate, folosite pentru a încheia dialogul.
    target_text: روز (zi) / سه (trei) / تشکر زیاد (mulțumesc mult) / خواهش می‌کنم (cu plăcere)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Bună ziua. Mă doare stomacul.'
    gloss: Bună ziua. Mă doare stomacul.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Farmacistul: Bună ziua. Doriți un medicament?'
    gloss: Bună ziua. Doriți un medicament?
