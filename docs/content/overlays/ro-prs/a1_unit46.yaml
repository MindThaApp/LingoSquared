course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: cere farmacistului un medicament simplu, descrie un simptom simplu (durere de cap, de burtă sau de dinți), cere o pastilă sau un sirop și înțelege o indicație simplă de dozare.'
units:
  prs.a1.unit46.pharmacy:
    title: Farmacia și medicamentele
    description: Cere farmacistului un medicament simplu, descrie un simptom simplu, cere o pastilă sau un sirop și înțelege o indicație simplă de dozare.
