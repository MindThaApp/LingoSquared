course:
  title: Dari în română A1
  description: 'Dari kaboulă pentru începători: vocabular despre animale și animale de companie (câine, pisică, pasăre, pește), cum întrebi și răspunzi dacă ai un animal de companie cu حیوان خانگی دارین؟, descrierea mărimii și a culorii unui animal și un dialog între Zarmina și Homayoun despre cum au o pisică și îi dau de mâncare.'
units:
  prs.a1.unit28.animals:
    title: Animale
    description: Vorbește despre animalele de companie și despre animalele obișnuite, inclusiv despre dacă ai unul și despre îngrijirea de bază.
