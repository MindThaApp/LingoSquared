teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Am / aveți (formal) / este
    gloss: animal
    note: حیوان înseamnă animal, cuvântul general care cuprinde animalele de companie și alte viețuitoare.
    example_gloss: Câinele este un animal.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Câine
    gloss: câine
    note: سگ înseamnă câine.
    example_gloss: Am un câine.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Pisică
    gloss: pisică
    note: پشک înseamnă pisică. Este cuvântul de zi cu zi din dari/afgană, diferit de گربه din persana iraniană.
    example_gloss: Am o pisică.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Pasăre
    gloss: pasăre
    note: پرنده înseamnă pasăre.
    example_gloss: Am o pasăre.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Peștele
    gloss: pește
    note: ماهی înseamnă pește.
    example_gloss: Am un pește.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Animal de companie
    gloss: animal de companie
    note: 'حیوان خانگی înseamnă literal „animal de casă”: حیوان (animal, recapitulare) + خانگی (domestic, de casă).'
    example_gloss: Câinele este animalul meu de companie.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: Da / nu / nu am
    gloss: am / aveți (formal) / este
    note: دارم (am), دارین (aveți, formal) și است (este) sunt recapitulări din lecțiile anterioare și apar în toată unitatea când vorbim despre animale de companie.
    target_text: دارم (am / eu am) / دارین (aveți, formal) / است (este)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: حیوان خانگی دارین؟ este modul politicos, formal, de a întreba pe cineva dacă are un animal de companie.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: بلی (da, recapitulare din Unitatea 3) împreună cu سگ دارم din această unitate.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: نخیر (nu, formal, recapitulare din Unitatea 3) împreună cu حیوان خانگی ندارم (nu am un animal de companie).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Culoare
    gloss: da / nu / nu am
    note: بلی, نخیر și ندارم sunt recapitulări din schimbul despre membrii familiei din Unitatea 3 și sunt refolosite aici pentru animalele de companie.
    target_text: بلی (da) / نخیر (nu) / ندارم (nu am)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Tu (informal) / ai (informal)
    gloss: culoare
    note: رنگ înseamnă culoare (recapitulare din Unitatea 21, haine).
    target_text: رنگ (culoare)
  prs.a1.unit28.lesson03.teach.black_word:
    title: Negru
    gloss: negru
    note: سیاه înseamnă negru.
    example_gloss: Câinele meu este negru.
  prs.a1.unit28.lesson03.teach.white_word:
    title: Alb
    gloss: alb
    note: سفید înseamnă alb.
    example_gloss: Pisica mea este albă.
  prs.a1.unit28.lesson03.teach.small_word:
    title: Mic
    gloss: mic
    note: کوچک înseamnă mic (recapitulare din Unitatea 15, comparații).
    example_gloss: Pisica mea este mică.
  prs.a1.unit28.lesson03.teach.big_word:
    title: Mare
    gloss: mare
    note: بزرگ înseamnă mare (recapitulare din Unitatea 15, comparații).
    example_gloss: Câinele meu este mare.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: Câinele meu este negru și mare
    gloss: Câinele meu este negru și mare.
    note: Leagă două trăsături cu و (și, recapitulare).
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: Tu (informal) / ai (informal)
    gloss: tu (informal) / ai (informal)
    note: تو (tu, informal) și داری (ai, informal) sunt recapitulări și apar în dialogul informal dintre prieteni apropiați din această lecție.
    target_text: تو (tu, informal) / داری (ai, informal)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: Ce / în fiecare zi
    gloss: ce / care / în fiecare zi
    note: چه (ce / care, recapitulare din „ce culoare” din Unitatea 21) și هر روز (în fiecare zi, recapitulare din Unitatea 24) sunt folosite împreună pentru a întreba despre îngrijirea unui animal.
    target_text: چه (ce / care) / هر روز (în fiecare zi)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ai un animal de companie?'
    gloss: 'Homayoun: Zarmina, ai un animal de companie?'
    note: O întrebare informală între prieteni, cu forma informală داری.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Da, am o pisică'
    gloss: 'Zarmina: Da, am o pisică.'
    note: Răspunde cu بلی și یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: De ce culoare este pisica ta?'
    gloss: 'Homayoun: De ce culoare este pisica ta?'
    note: Folosește چه رنگ (ce culoare), același tipar ca în întrebarea de la cumpărături din Unitatea 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Este albă'
    gloss: 'Zarmina: Este albă.'
    note: 'Un răspuns scurt: doar culoarea plus است. Pisica reiese deja din întrebare, deci پشک nu se repetă.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Îi dai de mâncare în fiecare zi?'
    gloss: 'Homayoun: Îi dai de mâncare în fiecare zi?'
    note: Introduce غذا می‌دهی (dai de mâncare, informal), format din غذا (mâncare) + می‌دهی, corespondentul informal al lui می‌دهد din Unitatea 18.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Da, îi dau de mâncare în fiecare zi'
    gloss: 'Zarmina: Da, îi dau de mâncare în fiecare zi.'
    note: Aplică هر روز (în fiecare zi) lui می‌دهم (dau, persoana I).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Citim despre un animal de companie
    gloss: Zarmina are o pisică. Pisica ei este albă și mică. Zarmina îi dă de mâncare pisicii în fiecare zi.
    note: Un scurt text de citit care recapitulează vocabularul unității despre animale de companie și introduce دارد (are, persoana a III-a, recapitulare din Unitățile 26/27) și می‌دهد (dă, persoana a III-a, recapitulare din Unitatea 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: Dar
    gloss: dar
    note: اما înseamnă dar (recapitulare din unitățile anterioare).
    target_text: اما (dar)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: Sunt
    gloss: eu sunt
    note: استم (eu sunt) este o recapitulare din lecțiile anterioare.
    target_text: استم (eu sunt)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: Am un câine, dar nu am o pisică
    gloss: Am un câine, dar nu am o pisică.
    note: Leagă două fapte despre animalele deținute cu ajutorul lui اما.
