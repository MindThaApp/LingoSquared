teaching:
  prs.a1.unit57.lesson01.teach.review_this_is_in_good:
    title: 'Recapitulare: acesta, este, în, bun'
    gloss: acesta / este / în / bun
    note: Acestea sunt cuvinte recapitulate pentru a vorbi despre plajă.
    target_text: این (acesta) / است (este) / در (în) / خوب (bun)
  prs.a1.unit57.lesson01.teach.beach_word:
    title: Plaja
    gloss: plajă / mal
    note: '*ساحل* este cuvântul standard în dari și în persana iraniană pentru plajă, mal sau coastă. Deoarece Afganistanul nu are ieșire la mare, în acest curs cuvântul desemnează malul nisipos al unui lac sau al unui râu, un loc real și des ales pentru excursii de o zi.'
    example_gloss: Această plajă este frumoasă.
  prs.a1.unit57.lesson01.teach.sand_word:
    title: Nisipul
    gloss: nisip
    note: Acesta este cuvântul obișnuit în dari pentru nisip.
    example_gloss: Nisipul este pe plajă.
  prs.a1.unit57.lesson01.teach.beach_is_nice_phrase:
    title: Această plajă este frumoasă
    gloss: Această plajă este frumoasă.
    note: Fraza îmbină cuvintele pentru „plajă” și „bun”.
  prs.a1.unit57.lesson01.teach.sand_on_beach_phrase:
    title: Nisipul este pe plajă
    gloss: Nisipul este pe plajă.
  prs.a1.unit57.lesson02.teach.review_beach_open_closed_is:
    title: 'Recapitulare: plajă, deschis, închis, este'
    gloss: plajă / deschis / închis / este
    note: Acestea sunt cuvinte recapitulate pentru a citi programul plajei.
    target_text: ساحل (plajă) / باز (deschis) / بسته (închis) / است (este)
  prs.a1.unit57.lesson02.teach.review_hours_words:
    title: 'Recapitulare: de la, până la, șapte, dimineața, cinci, după-amiaza, ora'
    gloss: de la / până la / șapte / dimineața / cinci / după-amiaza / ora
    note: Acestea sunt cuvinte recapitulate pentru a spune programul plajei.
    target_text: از (de la) / تا (până la) / هفت (șapte) / صبح (dimineața) / پنج (cinci) / عصر (după-amiaza) / ساعت (ora)
  prs.a1.unit57.lesson02.teach.beach_sign_reading:
    title: Citim panoul plajei
    gloss: Plaja este deschisă de la ora șapte dimineața până la ora cinci după-amiaza.
  prs.a1.unit57.lesson03.teach.review_swim_want_do:
    title: 'Recapitulare: înot, vreau, să fac'
    gloss: înot / vreau / să fac (conjunctiv)
    note: '*شنا* a fost învățat mai devreme (sport). *کنم* este forma de conjunctiv a verbului „a face”, deja cunoscută din modelul „vreau să schimb” din Unitatea 23.'
    target_text: شنا (înot) / می‌خواهم (vreau) / کنم (să fac – conjunctiv)
  prs.a1.unit57.lesson03.teach.want_to_swim_phrase:
    title: Vreau să înot
    gloss: Vreau să înot.
    note: Fraza reia modelul „vreau să...” deja învățat în acest curs, cu verbul la conjunctiv.
  prs.a1.unit57.lesson03.teach.review_water_today_has:
    title: 'Recapitulare: apă, astăzi, are'
    gloss: apă / astăzi / are
    note: Acestea sunt cuvinte recapitulate pentru a descrie apa de astăzi.
    target_text: آب (apă) / امروز (azi) / دارد (are)
  prs.a1.unit57.lesson03.teach.wave_word:
    title: Valul
    gloss: val
    note: Acesta este cuvântul standard în dari și în persana iraniană pentru „val”.
    example_gloss: Astăzi apa are valuri.
  prs.a1.unit57.lesson03.teach.water_has_waves_phrase:
    title: Astăzi apa are valuri
    gloss: Astăzi apa are valuri.
  prs.a1.unit57.lesson04.teach.review_weather_sunny_today:
    title: 'Recapitulare: Zarmina, astăzi, vremea, însorit, este'
    gloss: Zarmina / astăzi / vremea / însorit / este
    note: Acestea sunt cuvinte recapitulate pentru începutul dialogului de la plajă.
    target_text: زرمینه (Zarmina) / امروز (azi) / هوا (vremea) / آفتابی (însorit) / است (este)
  prs.a1.unit57.lesson04.teach.review_want_go_beach:
    title: 'Recapitulare: da, vrei, să mergem, plajă'
    gloss: da / vrei (informal) / să mergem / plajă
    note: Acestea sunt cuvinte recapitulate pentru a propune o ieșire la plajă.
    target_text: بلی (da) / می‌خواهی (vrei, informal) / برویم (să mergem) / ساحل (plajă)
