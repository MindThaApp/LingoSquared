    title: 'Recapitulare: grozav, vreau, înot, să fac'
    gloss: grozav / vreau / înot / să fac
    note: Acestea sunt cuvinte recapitulate pentru a accepta și a spune că vrei să înoți.
    target_text: عالی (grozav) / می‌خواهم (vreau) / شنا (înot) / کنم (să fac)
  prs.a1.unit57.lesson04.teach.review_swim_or_picnic:
    title: 'Recapitulare: sau, picnic'
    gloss: sau / picnic
    note: Acestea sunt cuvinte recapitulate pentru a oferi o alegere între activități.
    target_text: یا (sau) / میله (picnic)
  prs.a1.unit57.lesson04.teach.review_good_very_good:
    title: 'Recapitulare: bun, foarte bine'
    gloss: bun / foarte bine
    note: Acestea sunt cuvinte recapitulate pentru încheierea dialogului.
    target_text: خوب (bine) / بسیار خوب (foarte bine)
  prs.a1.unit57.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, astăzi e senin și soare.'
    gloss: Zarmina, astăzi e senin și soare.
  prs.a1.unit57.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Da, vrei să mergem la plajă?'
    gloss: Da, vrei să mergem la plajă?
  prs.a1.unit57.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Da, grozav! Vreau să înot.'
    gloss: Da, grozav! Vreau să înot.
  prs.a1.unit57.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Vrei să înoți sau să facem un picnic?'
    gloss: Vrei să înoți sau să facem un picnic?
  prs.a1.unit57.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Înotul sună bine!'
    gloss: Înotul sună bine!
  prs.a1.unit57.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Foarte bine, să mergem!'
    gloss: Foarte bine, să mergem!
  prs.a1.unit57.lesson05.teach.review_this_is_in_to:
    title: 'Recapitulare: acesta, este, în, la'
    gloss: acesta / este / în / la
    note: Acestea sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: این (acesta) / است (este) / در (în) / به (la)
  prs.a1.unit57.lesson05.teach.review_he_went_did_was:
    title: 'Recapitulare: el/ea, a mers, a făcut, a fost'
    gloss: el/ea / a mers / a făcut / a fost
    note: Acestea sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: او (el/ea) / رفت (a mers) / کرد (a făcut) / بود (a fost)
  prs.a1.unit57.lesson05.teach.review_beach_swim_homayoun:
    title: 'Recapitulare: plajă, înot, Homayoun'
    gloss: plajă / înot / Homayoun
