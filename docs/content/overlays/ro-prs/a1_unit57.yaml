    title: 'Recapitulare: înot, a-i plăcea, am, dar, val, mult'
    gloss: înot / a-i plăcea / am / dar / val / mult
    note: Acestea sunt cuvinte recapitulate, folosite pentru a spune o preferință și o observație despre valuri.
    target_text: شنا (înot) / دوست (drag) / دارم (am) / را (marcă a complementului direct) / اما (dar) / موج (val) / زیاد (mult)
  prs.a1.unit57.lesson06.teach.like_swim_but_waves_phrase:
    title: Îmi place să înot, dar sunt multe valuri
    gloss: Îmi place să înot, dar sunt multe valuri.
  prs.a1.unit57.lesson06.teach.umbrella_word:
    title: Umbrela
    gloss: umbrelă
    note: Acesta este cuvântul standard în dari și în persana iraniană pentru „umbrelă”. Împreună cu *آفتابی* (însorit, Unitatea 22), *چتر آفتابی* înseamnă „umbrelă de soare” sau „umbrelă de plajă”.
    example_gloss: Umbrela de plajă este frumoasă.
