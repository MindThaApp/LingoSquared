    title: 'Recapitulare: însorit, unde este'
    gloss: însorit / unde este
    note: Acestea sunt cuvinte recapitulate, folosite pentru a întreba unde este umbrela de plajă.
    target_text: آفتابی (însorit) / کجاست (unde este)
  prs.a1.unit57.lesson06.teach.your_umbrella_question_phrase:
    title: Unde este umbrela voastră de plajă?
    gloss: Unde este umbrela voastră de plajă?
    note: Umbrela de plajă a dumneavoastră folosește același sufix formal *-تان* ca livrarea dumneavoastră din Unitatea 48, biletul de cinema din Unitatea 52 și abonamentul din Unitatea 56, aplicat aici unui substantiv nou.
