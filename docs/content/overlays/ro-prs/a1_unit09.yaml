teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Sâmbătă și duminică
    gloss: Sâmbătă, duminică
    note: شنبه (sâmbătă) este prima zi a săptămânii în Afganistan; یکشنبه (duminică) vine după ea.
    example_gloss:
    - Astăzi este sâmbătă.
    - Mâine este duminică.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Luni și marți
    gloss: luni, marți
    note: دوشنبه și سه‌شنبه înseamnă literal „a doua zi” și „a treia zi” după شنبه.
    example_gloss:
    - Luni am curs.
    - Marți am o programare.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Miercuri și joi
    gloss: miercuri, joi
    note: 'چهارشنبه și پنجشنبه continuă același model: „a patra zi” / „a cincea zi”.'
    example_gloss:
    - Miercuri lucrez.
    - Ne vedem joi.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Vineri
    gloss: vineri
    note: جمعه este ziua liberă săptămânală în Afganistan, având aceeași funcție ca o zi de weekend.
    example_gloss: Vineri este zi liberă.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Data
    gloss: dată
    note: تاریخ este cuvântul general pentru o dată din calendar.
    example_gloss: Ce dată este azi?
  prs.a1.unit09.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul de legătură folosit frecvent în această unitate.
    target_text: و (și)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Ziua liberă săptămânală
    gloss: Vineri este ziua liberă a săptămânii.
    note: Spre deosebire de weekendul de sâmbătă și duminică, principala zi liberă săptămânală din Afganistan este *جمعه* (vinerea); joia este adesea jumătate de zi lucrătoare.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (prima lună)
    gloss: Hamal, prima lună a calendarului hijri șamsi (aproximativ de la sfârșitul lui martie până în aprilie)
    note: حمل deschide anul solar afgan și coincide cu Nowruz, Anul Nou.
    example_gloss: Hamal este prima lună a anului.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (a doua lună)
    gloss: Sawr, a doua lună (aproximativ aprilie-mai)
    note: ثور urmează după حمل.
    example_gloss: În Sawr vremea este frumoasă.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Jawza (a treia lună)
    gloss: Jawza, a treia lună (aproximativ mai-iunie)
    note: جوزا urmează după ثور.
    example_gloss: M-am născut în Jawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Calendarul Afganistanului
    gloss: Afganistanul folosește calendarul hijri șamsi (hijri solar).
    note: Este același calendar solar folosit în Iran, diferit atât de calendarul gregorian, cât și de calendarul hijri lunar.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Întreabă ce zi este astăzi
    gloss: Ce zi este astăzi?
    note: امروز چند شنبه است؟ înseamnă literal „azi este a câta -shanbe”, modul firesc de a întreba ziua săptămânii.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Astăzi
    gloss: astăzi
    note: امروز denumește ziua curentă.
    example_gloss: Ce dată este astăzi?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Spune o dată completă
    gloss: Astăzi este joi, 15 Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است îmbină ziua săptămânii, data ordinală și numele lunii.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Întreabă în ce zi are loc un eveniment
    gloss: În ce zi este ședința?
    note: جلسه کدام روز است؟ folosește کدام (care) pentru a întreba despre ziua unui eveniment.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Întreabă o dată anume
    gloss: Ce dată din Hamal este lunea?
    note: دوشنبه چندم حمل است؟ întreabă în ce zi numerotată a lunii cade lunea.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: a 19-a
    gloss: a 19-a
    note: '*نوزدهم* este forma ordinală a lui nouăsprezece și urmează același model ordinal ca *پانزدهم* (a 15-a).'
    example_gloss: Astăzi este 19.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun întreabă despre ziua ședinței
    gloss: Homayoun îl întreabă pe Bashir în ce zi este ședința.
    note: جلسه کدام روز است؟ din lecția 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir răspunde
    gloss: Bashir spune că crede că este luni.
    note: فکر می‌کنم (cred) atenuează răspunsul, fiindcă nu este complet sigur.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun întreabă data exactă
    gloss: Homayoun întreabă ce dată din Hamal este lunea.
    note: دوشنبه چندم حمل است؟ din lecția 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir spune data exactă
    gloss: Bashir spune că lunea este 19 Hamal.
    note: '*دوشنبه نوزدهم حمل است* îmbină ziua, data ordinală și luna, după modelul din lecția 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun întreabă despre vineri
    gloss: Homayoun e de acord și întreabă dacă Bashir este liber vineri.
    note: وقت داری؟ (ai timp?) este un mod firesc de a întreba dacă cineva este disponibil.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir spune că este ocupat
    gloss: Bashir spune că nu, vineri este ocupat.
    note: مصروف استم (sunt ocupat) explică de ce vinerea nu merge.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun confirmă lunea
    gloss: Homayoun spune că nu e nicio problemă și că se văd luni cu Bashir.
    note: مشکل نیست (nicio problemă) netezește conflictul de program înainte de a confirma planul inițial de luni.
