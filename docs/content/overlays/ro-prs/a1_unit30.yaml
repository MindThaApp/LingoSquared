course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabular despre tehnologie și dispozitive (telefon mobil, computer, internet, aplicație, fotografie), expresii pentru acțiuni cu telefonul (a trimite un mesaj, a suna, a face o fotografie, a descărca o aplicație), cum să întrebi și să răspunzi de câte ori pe zi folosești telefonul mobil și un dialog între Zarmina și Homayoun despre folosirea telefonului, a computerului și a internetului.'
units:
  prs.a1.unit30.technology:
    title: Tehnologie
    description: Vorbește despre telefoane, computere, internet și aplicații – și despre cât de des le folosești.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Cuvinte despre tehnologie
  prs.a1.unit30.lesson02.phone_actions:
    title: Acțiuni cu telefonul
  prs.a1.unit30.lesson03.frequency_question:
    title: De câte ori pe zi?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Dialog despre tehnologie
  prs.a1.unit30.lesson05.reading_technology:
    title: Citim despre tehnologie
  prs.a1.unit30.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Tehnologie
    gloss: tehnologie
    note: تکنالوژی înseamnă tehnologie – este ortografia standard afgană, diferită de ortografia iraniană تکنولوژی.
    example_gloss: Tehnologia este bună.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Telefon mobil
    gloss: telefon mobil
    note: موبایل înseamnă telefon mobil, diferit de termenul mai general تلفن (telefon, recapitulare din Unitatea 7).
    example_gloss: Am un telefon mobil.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computer
    gloss: computer
    note: کمپیوتر înseamnă computer, un împrumut standard comun persanei și dariului.
    example_gloss: Computerul este la birou.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت înseamnă internet, un împrumut standard comun persanei și dariului.
    example_gloss: Internetul este lent.
  prs.a1.unit30.lesson01.teach.app_word:
    title: Aplicație
    gloss: aplicație
    note: اپلیکیشن înseamnă aplicație (application), un împrumut standard comun persanei și dariului.
    example_gloss: Această aplicație este bună.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Fotografie
    gloss: fotografie
    note: عکس înseamnă fotografie sau imagine.
    example_gloss: Această fotografie este bună.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: A folosi
    gloss: a folosi + a face → folosesc
    note: استفاده (folosire) se îmbină cu کردن (a face, recapitulare) și formează استفاده می‌کنم (folosesc) – același tipar de verb compus întâlnit deja în acest curs, de exemplu بازی می‌کنم (Unitatea 29) și ورزش می‌کنم (Unitatea 29).
    target_text: استفاده (utilizare) + کردن (a face) = استفاده می‌کنم (folosesc)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Folosesc internetul
    gloss: Folosesc internetul.
    note: Combină من (eu, recapitulare), از (de la/cu, recapitulare), انترنت și استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Mesaj
    gloss: mesaj
    note: پیام înseamnă mesaj.
    target_text: پیام (mesaj)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: Trimit un mesaj
    gloss: Trimit un mesaj
    note: می‌فرستم înseamnă „trimit” – un verb nou, diferit de verbul pentru mesaje din Unitatea 7, بگذارم (a lăsa un mesaj).
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Sun (la telefon)
    gloss: Sun
    note: زنگ می‌زنم înseamnă „sun”.
    target_text: زنگ می‌زنم (sun la telefon)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Fac o fotografie
    gloss: Fac o fotografie
    note: عکس می‌گیرم reia می‌گیرم (iau/primesc, recapitulare din Unitatea 23) aplicat la عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: A descărca
    gloss: a descărca
    note: دانلود este împrumutul standard din dari pentru „a descărca”, combinat cu کردن (a face, recapitulare) ca verb compus, de exemplu دانلود می‌کنم (descarc).
    example_gloss: Descarc o aplicație.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Vreau să descarc o aplicație
    gloss: Vreau să descarc o aplicație
    note: Urmează același tipar می‌خواهم + conjunctiv ca în Unitatea 7, می‌خواهم یک پیام بگذارم (vreau să las un mesaj).
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Câte / de câte ori
    gloss: câți / dată (ocazie)
    note: چند بار se folosește aici pentru a întreba despre frecvență.
    target_text: چند (câți) / بار (dată, ori)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Zi
    gloss: zi
    note: روز înseamnă zi.
    target_text: روز (zi)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Folosiți (formal)
    gloss: folosiți (formal)
    note: استفاده می‌کنین este forma formală „folosiți”, după modelul ورزش می‌کنین din Unitatea 29.
    target_text: استفاده می‌کنین (folosiți, formal)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: De câte ori pe zi folosiți telefonul mobil?
    gloss: De câte ori pe zi folosiți telefonul mobil?
    note: Combină چند بار (de câte ori), در روز (pe zi), از موبایل (cu telefonul mobil) și استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: Folosesc internetul în fiecare zi
    gloss: Folosesc internetul în fiecare zi.
    note: هر روز se îmbină cu از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: El/ea folosește
    gloss: el/ea folosește
    note: استفاده می‌کند este forma de persoana a 3-a, după tiparul می‌کند recapitulat în Unitatea 29.
    target_text: استفاده می‌کند (el/ea folosește, persoana a III-a)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: Tu / tu folosești
    gloss: tu (informal) / folosești (informal)
    note: تو și می‌کنی sunt registrul informal folosit între Homayoun și Zarmina.
    target_text: تو (tu, informal) / می‌کنی (folosești, informal)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Unde
    gloss: unde
    note: کجا înseamnă unde.
    target_text: کجا (unde)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, de câte ori pe zi folosești telefonul mobil?'
    gloss: Zarmina, de câte ori pe zi folosești telefonul mobil?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Folosesc mult telefonul mobil. Fac fotografii și trimit mesaje.'
    gloss: Folosesc mult telefonul mobil. Fac fotografii și trimit mesaje.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Folosești computerul?'
    gloss: Folosești computerul?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Da, folosesc computerul la birou.'
    gloss: Da, folosesc computerul la birou.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Folosesc internetul în fiecare zi.'
    gloss: Folosesc internetul în fiecare zi.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Grozav!'
    gloss: Grozav!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Citim despre tehnologie
    gloss: Zarmina folosește telefonul mobil în fiecare zi. Face fotografii și trimite mesaje. La birou folosește un computer. Homayoun folosește internetul în fiecare zi.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Dar
    gloss: dar
    note: اما înseamnă „dar”.
    target_text: اما (dar)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: Îmi place / timp / nu am
    gloss: îmi place / timp / nu am
    note: دوست دارم (îmi place), وقت (timp) și ندارم (nu am) sunt recapitulări din Unitatea 11, Unitatea 14, Unitatea 26 și Unitatea 29.
    target_text: دوست دارم (îmi place) / وقت (timp) / ندارم (nu am)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: Îmi place tehnologia, dar nu am timp
    gloss: Îmi place tehnologia, dar nu am timp.
    note: Combină تکنالوژی را دوست دارم (îmi place tehnologia, construcție recapitulată) cu اما وقت ندارم (dar nu am timp).
