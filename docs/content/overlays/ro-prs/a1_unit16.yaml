course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabular de bază pentru călătorii, cumpărarea unui bilet, întrebări despre ora de plecare și peron, citirea unui orar scurt și un dialog la ghișeul de bilete.'
units:
  prs.a1.unit16.travel:
    title: Călătorie
    description: Te descurci cu informații de bază despre transport, bilete, destinații și detalii de plecare.
