  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: Confirmarea planurilor de călătorie
teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Biletul
    gloss: bilet
    note: تکت înseamnă bilet. Este cuvântul afgan de zi cu zi; بلیط (scris și بلیت, cuvântul de stil iranian) este înțeles și acceptat, dar تکت este cel pe care îl vei auzi de obicei.
    example_gloss: Am un bilet.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Tren
    gloss: tren
    note: قطار înseamnă tren.
    example_gloss: Trenul este bun.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Autobuzul
    gloss: autobuz
    note: بس înseamnă autobuz, o folosire obișnuită în dari afgan.
    example_gloss: Autobuzul este bun.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Aeroportul
    gloss: aeroport
    note: میدان هوایی înseamnă aeroport -- termenul afgan stabilit în acest curs (nu فرودگاه, cel iranian), în acord cu Unitatea 5.
    example_gloss: Aeroportul este bun.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Un/o
    gloss: un / o
    note: یک înseamnă unu și aici este folosit ca articol nehotărât (un bilet).
    target_text: یک (un / o)
  prs.a1.unit16.lesson01.teach.az_word:
    title: De la / din
    gloss: din / de la
    note: از înseamnă „din / de la” și indică originea (diferit de celălalt sens al său, „decât”, din comparații).
    target_text: از (din / de la)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Doi
    gloss: doi
    note: دو înseamnă „doi/două”.
    example_gloss: Am două bilete.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Peronul doi
    gloss: peronul doi
    note: سکوی دو îmbină سکو (peron) cu conectorul ezafe -ی și دو (doi/două).
    target_text: سکوی دو (peronul doi)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Un oraș important din vestul Afganistanului.
    example_gloss: Merg la Herat.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Vreau
    gloss: vreau
    note: می‌خواهم este forma completă, necontrasă, a lui „vreau”, în acord cu registrul acestui curs.
    target_text: می‌خواهم (vreau)
  prs.a1.unit16.lesson02.teach.be_word:
    title: La / spre
    gloss: la, spre
    note: 'به marchează destinația: به هرات înseamnă „la Herat”.'
    target_text: به (la / spre)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Vreau un bilet la Herat
    gloss: Vreau un bilet la Herat
    note: یک تکت به هرات می‌خواهم reunește vocabularul lecției în formula obișnuită pentru a cere un bilet.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Peronul
    gloss: peron
    note: سکو înseamnă „peron” (într-o gară).
    example_gloss: Trenul pleacă de la peronul doi.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Pleacă
    gloss: pleacă
    note: حرکت می‌کند este forma completă, necontrasă, a lui „pleacă / se mișcă”.
    target_text: حرکت می‌کند (pleacă)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Când
    gloss: când
    note: کی înseamnă „când” și se folosește pentru a întreba despre timp.
    target_text: کی (când)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Dimineața
    gloss: dimineață
    note: صبح înseamnă „dimineață”.
    example_gloss: Trenul pleacă la ora opt dimineața.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Text-model de orar
    gloss: Trenul spre Herat pleacă de la peronul doi, la ora opt dimineața.
    note: Un scurt anunț factual care combină vocabularul de călătorie al unității; textul scris ține loc de anunț rostit în gară.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Mâine
    gloss: mâine
    note: فردا înseamnă „mâine”.
    example_gloss: Plec mâine dimineață.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Foarte bine / de acord
    gloss: foarte bine / de acord
    note: بسیار خوب este formula completă, formală, pentru „bine / de acord”, în acord cu registrul acestui curs (nu colocvialul باشه).
    example_gloss: Trenul este foarte bun.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Călătorul spune
    gloss: Vreau un bilet la Herat.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Vânzătorul întreabă
    gloss: Când doriți să plecați?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Călătorul răspunde
    gloss: Mâine dimineață.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Vânzătorul confirmă
    gloss: Foarte bine, trenul pleacă de la peronul doi, la ora opt dimineața.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Mulțumesc mult
    gloss: mulțumesc mult
    note: تشکر زیاد este o formulă politicoasă uzuală pentru „mulțumesc foarte mult”, deja întâlnită în Unitățile 5 și 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: Cu plăcere
    gloss: cu plăcere
    note: قابلی نداره este răspunsul politicos obișnuit la mulțumire („nu s-a putut”, adică „cu plăcere”), deja întâlnit în Unitățile 5 și 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Călătorie plăcută
    gloss: călătorie plăcută
    note: سفر خوش este o urare uzuală de despărțire pentru cineva care pleacă în călătorie, deja întâlnită în Unitatea 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
