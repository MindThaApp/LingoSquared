course:
  title: Dari în română A1
  description: 'Dari afgan pentru începători: numărarea de la unu la o sută, întrebarea și spunerea vârstei și schimbul de numere de telefon.'
units:
  prs.a1.unit04.numbers:
    title: Numărarea și numerele
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Numără de la unu la zece
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Numără de la unsprezece la douăzeci
  prs.a1.unit04.lesson03.tens:
    title: Zecile până la o sută
  prs.a1.unit04.lesson04.asking_age:
    title: Întreabă și spune vârsta
  prs.a1.unit04.lesson05.phone_numbers:
    title: Schimbă numere de telefon
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: Doi prieteni își compară vârstele și numerele de telefon
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Unu, doi, trei
    gloss: 1, 2, 3
    note: یک، دو، سه sunt numeralele de bază persane, comune dariului și farsiului.
    example_gloss:
    - Am un frate.
    - Am două cărți.
    - Am trei surori.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Patru, cinci, șase
    gloss: 4, 5, 6
    note: چهار este forma standard scrisă; unii vorbitori o scurtează în vorbirea familiară la چار, dar acest curs folosește ortografia standard.
    example_gloss:
    - Am patru cărți.
    - Așteaptă cinci minute.
    - Are șase cărți.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Șapte, opt
    gloss: 7, 8
    note: هفت، هشت continuă șirul.
    example_gloss:
    - O săptămână are șapte zile.
    - Voi veni la ora opt.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Nouă, zece
    gloss: 9, 10
    note: نه، ده încheie numerele de la unu la zece.
    example_gloss:
    - Sunt nouă persoane în clasă.
    - Am zece degete.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Unsprezece, doisprezece, treisprezece
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده sunt cuvinte distincte, nu simple compuse din cifrele unităților.
    example_gloss:
    - Am oră la unsprezece.
    - Un an are douăsprezece luni.
    - Are treisprezece ani.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Paisprezece, cincisprezece, șaisprezece
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده continuă numerele de la unsprezece la nouăsprezece.
    example_gloss:
    - Voi veni peste paisprezece zile.
    - Are cincisprezece cărți.
    - Are șaisprezece ani.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Șaptesprezece, optsprezece, nouăsprezece
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده încheie numerele de la unsprezece la nouăsprezece.
    example_gloss:
    - Are șaptesprezece cărți.
    - Are optsprezece ani.
    - Mai sunt nouăsprezece zile.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Douăzeci
    gloss: '20'
    note: بیست deschide șirul zecilor, tratat complet în lecția următoare.
    example_gloss: Am douăzeci de cărți.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Douăzeci, treizeci, patruzeci
    gloss: 20, 30, 40
    note: بیست، سی، چهل sunt cuvintele pentru zeci, fiecare o formă distinctă, fără un tipar previzibil.
    example_gloss:
    - Am douăzeci de ani.
    - Luna aceasta are treizeci de zile.
    - Are patruzeci de ani.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Cincizeci, șaizeci
    gloss: 50, 60
    note: پنجاه، شصت continuă zecile.
    example_gloss:
    - Are cincizeci de cărți.
    - Șaizeci de minute înseamnă o oră.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Șaptezeci, optzeci
    gloss: 70, 80
    note: هفتاد، هشتاد continuă zecile.
    example_gloss:
    - Cartea aceasta are șaptezeci de pagini.
    - Are optzeci de cărți.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Nouăzeci, o sută
    gloss: 90, 100
    note: نود، صد încheie șirul până la o sută.
    example_gloss:
    - Are nouăzeci de ani.
    - El/ea are o sută de cărți.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Combină zecile și unitățile
    gloss: 25 este, literal, „douăzeci și cinci”.
    note: Un cuvânt pentru zeci și unul pentru unități se unesc cu و (și), același conector folosit și în alte părți ale cursului, de exemplu بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Cât / câți
    gloss: cât / câți / câte
    note: چند introduce o întrebare despre cantitate, inclusiv despre vârstă.
    example_gloss: Câți ani ai?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: An
    gloss: an
    note: سال se folosește când spui vârsta, literal „ani”.
    example_gloss: Am douăzeci de ani.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Întreabă politicos vârsta cuiva
    gloss: Câți ani ai?
    note: چند ساله استین؟ întreabă, literal, „câți ani aveți”, folosind forma de politețe استین pentru cineva pe care nu îl cunoști bine.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Întreabă vârsta unui prieten apropiat
    gloss: Câți ani ai?
    note: چند ساله استی؟ folosește forma familiară استی; o folosești doar cu un prieten apropiat sau cu un egal, conform aceleiași reguli de registru din restul cursului.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Spui câți ani ai
    gloss: Am 25 de ani.
    note: بیست و پنج ساله استم îmbină numărul, ساله (de ani) și استم.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Număr
    gloss: număr
    note: نمبر este un termen foarte folosit în viața de zi cu zi în Afganistan (din persană/engleză) pentru „număr”, mai ales pentru numărul de telefon.
    example_gloss: Acesta este numărul meu de telefon.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Telefon
    gloss: telefon
    note: تلفن este cuvântul standard pentru telefon.
    example_gloss: Telefonul meu este stricat.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Cere un număr de telefon
    gloss: Care este numărul tău de telefon?
    note: نمبر تلفن‌تان چند است؟ folosește același tipar cu چند din întrebarea despre vârstă, aplicat aici unui număr de telefon.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Zero
    gloss: zero
    note: صفر este necesar pentru a citi majoritatea numerelor de telefon afgane.
    example_gloss: Zero este un număr.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Spune-ți numărul de telefon
    gloss: Numărul meu de telefon este 079-345-678.
    note: Numerele de telefon afgane se citesc de obicei în grupuri scurte, nu cifră cu cifră, ca în acest model.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun îl salută pe Bashir
    gloss: Homayoun îl întreabă pe Bashir ce mai face, folosind registrul familiar potrivit pentru un prieten apropiat.
    note: جور استی؟ arată că cei doi sunt prieteni apropiați, deci registrul familiar este potrivit în tot dialogul.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir răspunde și îl întreabă pe Homayoun ce vârstă are
    gloss: Bashir spune că este bine și îl întreabă pe Homayoun câți ani are.
    note: چند ساله استی؟ folosește registrul familiar, potrivit prieteniei lor.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun răspunde și întoarce întrebarea
    gloss: Homayoun spune că are 28 de ani și îi pune lui Bashir aceeași întrebare.
    note: Tiparul de răspuns despre vârstă din lecția 4 este reluat întocmai.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir răspunde
    gloss: Bashir spune că are 26 de ani.
    note: Încheie schimbul de replici despre vârstă.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun îi cere numărul de telefon lui Bashir
    gloss: Homayoun îi cere lui Bashir numărul de telefon.
    note: تلفنت folosește terminația posesivă familiară, în acord cu registrul restului dialogului.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir își spune numărul de telefon
    gloss: Bashir își citește numărul de telefon în grupuri.
    note: Numărul se citește în același mod firesc, în grupuri, ca în exemplul din lecția 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun confirmă că l-a salvat
    gloss: Homayoun îi mulțumește și spune că îl salvează chiar acum.
    note: سیف می‌کنم (din engleză „save”) este un împrumut informal frecvent în Afganistan, din domeniul tehnologiei, potrivit pentru acest schimb relaxat între prieteni.
