    title: Cântăreț
    gloss: cântăreț
    note: Este cuvântul dari simplu și obișnuit, folosit astăzi, pentru „cântăreț”. Există și o variantă mai clasică, *آوازخوان*, dar este mai puțin frecventă în vorbirea de zi cu zi.
    example_gloss: Cântărețul este la concert.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Acesta este un concert
    gloss: Acesta este un concert.
    note: Îmbină „acesta”, „este” și „concert” la fel ca în alte părți ale cursului.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Cântărețul este la concert
    gloss: Cântărețul este la concert.
    note: Această frază combină cuvintele cântăreț, la și concert.
