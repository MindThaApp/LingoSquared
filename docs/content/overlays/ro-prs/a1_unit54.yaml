    gloss: cât / afgani / este / treizeci / ora / opt / seara / are loc / în / bilet
    note: Acestea sunt cuvinte recapitulate (din unitățile anterioare), folosite pentru a vorbi despre ora de începere și prețul concertului.
    target_text: چند (cât) / افغانی (afgani) / است (este) / سی (treizeci) / ساعت (ora) / هشت (opt) / شب (seara) / می‌شود (se face) / در (la) / تکت (bilet)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Început
    gloss: început
    note: Împreună cu *می‌شود* (se întâmplă) înseamnă „începe”, același tipar de verb compus pe care cursul l-a folosit deja în alte locuri.
    example_gloss: Concertul începe la ora opt seara.
