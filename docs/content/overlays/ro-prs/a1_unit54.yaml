teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Recapitulare: acesta, este, în, bun'
    gloss: acesta / este / în / bun
    note: Acestea sunt cuvinte recapitulate (folosite în tot cursul) pentru a vorbi despre concert.
    target_text: این (acesta) / است (este) / در (în) / خوب (bun)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Concert
    gloss: concert
    note: Este cuvântul dari modern obișnuit pentru „concert”, împrumutat din limbile europene, la fel ca *موزیم* (muzeu).
    example_gloss: Concertul acesta este bun.
