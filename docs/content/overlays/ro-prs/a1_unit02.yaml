course:
  title: Dari în română A1
  description: 'Dari afgană pentru începători: schimbul de nume, spunerea locului de origine și a ocupației, prezentarea unei a treia persoane și folosirea corectă a titlurilor politicoase și a registrului la o primă întâlnire.'
units:
  prs.a1.unit02.introductions:
    title: Prezentări și cunoaștere reciprocă
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Întreabă și spune cum te cheamă
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Întreabă despre orașul natal și țară
  prs.a1.unit02.lesson03.occupation:
    title: Întreabă despre meseria cuiva
  prs.a1.unit02.lesson04.introducing_others:
    title: Prezintă o a treia persoană
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Folosește titlurile de politețe și registrul potrivit
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Cunoaște oameni la o reuniune
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Întreabă politicos cum îl cheamă pe cineva
    gloss: Cum vă numiți?
    note: نام‌تان چیست؟ este forma de respect pentru un adult pe care tocmai l-ai cunoscut și continuă registrul شما/استین din Unitatea 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Spune-ți numele cu است
    gloss: Numele meu este Faridun.
    note: نام من ... است este modul scris de a spune un nume. În conversație se spune de obicei نامم ... است (نامم = نام + -م, numele meu). Ambele forme sunt corecte.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Spune-ți numele cu استم
    gloss: Eu sunt Faridun.
    note: استم vine direct după nume; este aceeași copulă dari de persoana I din Unitatea 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Întreabă cum îl cheamă pe un prieten apropiat
    gloss: Cum te cheamă?
    note: نامت چیست؟ folosește posesivul informal -ت. Folosește-l doar cu un egal sau un prieten apropiat, la fel ca تو/استی din Unitatea 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Cuvântul pentru „nume”
    gloss: nume
    note: نام este substantivul de sine stătător folosit atât în întrebarea politicoasă, cât și în cea informală de mai sus.
    example_gloss: Cum te cheamă?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Posesivul politicos și cel pentru prieteni apropiați
    gloss: -تان pentru cineva căruia i te adresezi cu respect; -ت pentru un prieten apropiat.
    note: Aceeași diferență de registru din Unitatea 1 (شما/تو) se regăsește și în terminațiile posesive de la نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Întreabă de unde este cineva
    gloss: De unde sunteți?
    note: شما از کجا استین؟ păstrează perechea de respect شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Spune că ești din Kabul
    gloss: Eu sunt din Kabul.
    note: من از کابل استم urmează modelul من از [loc] استم, valabil pentru orice oraș.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Spune că ești din Herat
    gloss: Eu sunt din Herat.
    note: هرات este un oraș important din vestul Afganistanului.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Spune că ești din Mazar-i-Sharif
    gloss: Eu sunt din Mazar-i-Sharif.
    note: مزار شریف se scrie în două cuvinte și este un oraș important din nordul Afganistanului.
  prs.a1.unit02.lesson02.teach.country:
    title: Afganistan
    gloss: Afganistan
    note: افغانستان se folosește după از exact ca numele unui oraș.
    example_gloss: Eu sunt din Afganistan.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Cuvântul pentru „oraș”
    gloss: oraș
    note: شهر desemnează un oraș în general, spre deosebire de numele unui oraș anume.
    example_gloss: Kabulul este un oraș mare.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Întreabă ce lucrează cineva
    gloss: Cu ce vă ocupați?
    note: کار شما چیست؟ întreabă literal „care este munca dumneavoastră”, modul obișnuit de a întreba despre profesie.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Doctor
    gloss: doctor
    note: داکتر este termenul dari obișnuit pentru această profesie; se folosește pentru medici și, informal, pentru cei cu doctorat.
    example_gloss: Este medic.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Profesor
    gloss: profesor
    note: معلم este un termen general pentru profesor sau învățător, la orice nivel școlar.
    example_gloss: El/Ea este profesor/profesoară.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Inginer
    gloss: inginer
    note: مهندس acoperă ingineri în general, nu o anumită specialitate de inginerie.
    example_gloss: Este inginer.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Vânzătorul
    gloss: vânzător
    note: دوکاندار (de la دوکان, magazin) este termenul de zi cu zi din Kabul; acest curs folosește ortografia dari دوکان, nu مغازه din persana iraniană.
    example_gloss: El/Ea este comerciant/comerciantă.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Spune ce profesie ai
    gloss: Sunt profesoară.
    note: من [profesie] استم este modelul pentru orice profesie învățată în această lecție.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Prezintă pe cineva în mod formal
    gloss: Permiteți-mi să vi-l prezint pe colegul meu.
    note: اجازه بدهین همکارم را معرفی کنم este un mod respectuos de a include o a treia persoană în conversație.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Spune numele persoanei pe care o prezinți
    gloss: Aceasta este colega mea, Arezoo.
    note: این [persoană] است numește direct persoana care este prezentată.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Spune că îți pare bine să cunoști pe cineva
    gloss: Îmi pare bine.
    note: از آشنایی با شما خوش شدم este aceeași expresie de la prima întâlnire din Unitatea 1, reluată aici după prezentarea unei a treia persoane.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Răspunde că și ție îți pare bine
    gloss: Și mie îmi pare bine.
    note: من هم خوش شدم este răspunsul scurt și firesc.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Prieten
    gloss: prieten
    note: دوست este un cuvânt general pentru prieten, fără a indica gradul de apropiere.
    example_gloss: El/Ea este prietenul/prietena mea.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Coleg
    gloss: coleg
    note: همکار desemnează un coleg de muncă; l-ai văzut deja în dialogul de la locul de muncă din Unitatea 1.
    example_gloss: El/Ea este colegul/colega mea.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Domnule / Domn
    gloss: domnul / domnule
    note: جناب stă înaintea numelui sau titlului unui bărbat ca formă de adresare respectuoasă, frecventă în uzul urban de zi cu zi din Afganistan.
    example_gloss: Domnule, poftiți, vă rog.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Doamnă / Domnișoară
    gloss: doamna / domnișoara
    note: خانم stă înaintea numelui unei femei și se folosește indiferent de starea civilă.
    example_gloss: Doamnă, poftiți, vă rog.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Adresează-te politicos unui bărbat
    gloss: domnul Faridun
    note: جناب urmat de un prenume este o adresare politicoasă frecventă și nu cere neapărat numele de familie.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Adresează-te politicos unei femei
    gloss: doamna Arezoo
    note: خانم urmat de un prenume funcționează la fel ca جناب pentru un bărbat.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Când se folosește fiecare registru
    gloss: Folosește شما și استین cu cineva pe care tocmai l-ai cunoscut; folosește تو și استی doar cu un prieten apropiat.
    note: Aceasta reia direct regula registrului din Unitatea 1, aplicată contextului prezentărilor.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Roagă politicos pe cineva să-și repete numele
    gloss: Ați putea să vă repetați numele?
    note: می‌توانین نام‌تان را دوباره بگویین؟ este un mod firesc și politicos de a cere repetarea, fără a crea stânjeneală.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Reuniune / Petrecere
    gloss: reuniune
    note: مهمانی desemnează o reuniune socială informală, cadrul dialogului din această lecție.
    example_gloss: Reuniunea este reușită.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila începe prezentarea
    gloss: Leila îl salută pe Faridun și îl întreabă cum îl cheamă, adresându-i-se cu respect prin جناب.
    note: Leila și Faridun nu se cunosc, așa că ea folosește de la început registrul de respect.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun își spune numele
    gloss: Faridun răspunde la salut și își spune numele.
    note: سلام علیکم este salutul mai complet din Unitatea 1, potrivit la o primă întâlnire. În conversație, Faridun spune نامم فریدون است (نامم = نام من, numele meu), forma vorbită de zi cu zi.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila îl întreabă de unde este
    gloss: Leila spune că îi pare bine să-l cunoască și îl întreabă de unde este.
    note: Aceeași expresie از آشنایی با شما خوش شدم este reluată din dialogul de la locul de muncă din Unitatea 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun răspunde și returnează întrebarea
    gloss: Faridun spune că este din Herat și îi pune Leilei aceeași întrebare.
    note: و شما؟ returnează o întrebare în mod economic, ca în Unitatea 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila răspunde și întreabă despre profesie
    gloss: Leila spune că este din Kabul și îl întreabă pe Faridun ce profesie are.
    note: Conversația trece firesc de la locul de origine la profesie.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun răspunde și returnează întrebarea
    gloss: Faridun spune că este inginer și îi pune Leilei aceeași întrebare.
    note: شما چطور؟ este un mod scurt de a returna o întrebare deja înțeleasă din context.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila spune ce profesie are
    gloss: Leila spune că este profesoară.
    note: Încheie schimbul despre profesie cu modelul învățat mai devreme în unitate.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun prezintă o a treia persoană
    gloss: Faridun o prezintă pe colega sa, Arezoo.
    note: Aceasta aduce un al treilea participant în conversație, folosind expresia formală de prezentare din lecția 04.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila o întâmpină pe Arezoo
    gloss: Leila o întâmpină pe Arezoo, adresându-i-se respectuos cu خانم.
    note: خوش آمدین este formula de bun venit din Unitatea 1, aici adresată unei persoane nou-cunoscute.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo răspunde
    gloss: Arezoo îi mulțumește Leilei și spune că se bucură să o cunoască.
    note: از دیدن شما خوشحال شدم este o variantă firească a formulei „încântat de cunoștință”, care folosește دیدن (a vedea) în loc de آشنایی.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: Care expresie întreabă politicos cum cheamă pe cineva?
    correct_option: Cum vă numiți? (politicos)
    distractors:
    - Cum te cheamă? (informal)
    - Ce meserie aveți?
    - De unde ești?
    accepted_answers:
    - value: Cum vă numiți? (politicos)
      status: correct
    feedback: نام‌تان چیست؟ este forma respectuoasă pentru o persoană nou-cunoscută.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ se potrivește când întrebi...
    correct_option: un prieten apropiat
    distractors:
    - un străin pe care tocmai l-ai cunoscut
    - o persoană în vârstă la un eveniment oficial
    - un client de la magazinul tău
    accepted_answers:
    - value: un prieten apropiat
      status: correct
    feedback: Posesivul informal -ت din نامت se potrivește doar unui prieten apropiat sau unui egal, aceeași regulă ca la تو/استی din Unitatea 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: Ce se întreabă în această întrebare?
    correct_option: Cum te cheamă?
    distractors:
    - Ce meserie aveți?
    - De unde ești?
    - Și dumneavoastră?
    accepted_answers:
    - value: Cum te cheamă?
      status: correct
    feedback: نام‌تان چیست؟ întreabă cum te cheamă.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: Potrivește fiecare expresie cu sensul ei.
    accepted_answers:
    - value:
        نام‌تان چیست؟: Cum vă numiți? (politicos)
        نامت چیست؟: Cum te cheamă? (informal)
        نام: nume
      status: correct
    feedback: نام‌تان și نامت diferă doar prin registru, nu prin sens.
    pairs:
    - left: نام‌تان چیست؟
      right: Cum vă numiți? (politicos)
    - left: نامت چیست؟
      right: Cum te cheamă? (informal)
    - left: نام
      right: nume
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
