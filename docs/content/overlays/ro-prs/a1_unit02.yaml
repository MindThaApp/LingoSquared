      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Ambele tipare răspund corect la întrebare; același tipar funcționează pentru orice nume.
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: Care expresie întreabă de unde este cineva?
    correct_option: De unde sunteți?
    distractors:
    - Ce meserie aveți?
    - Cum vă numiți?
    - Ce mai faceți? (politicos)
    accepted_answers:
    - value: De unde sunteți?
      status: correct
    feedback: شما از کجا استین؟ întreabă despre proveniență, folosind از (din) și کجا (unde).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: Care dintre acestea este un oraș din Afganistan?
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات este un oraș; افغانستان este țara, iar شهر este cuvântul general pentru „oraș”.
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: Ce se întreabă în această întrebare?
    correct_option: De unde sunteți?
    distractors:
    - Ce meserie aveți?
    - Cum vă numiți?
    - Și dumneavoastră?
    accepted_answers:
    - value: De unde sunteți?
      status: correct
    feedback: شما از کجا استین؟ întreabă de unde ești.
  prs.a1.unit02.lesson02.exercise04.match_cities:
