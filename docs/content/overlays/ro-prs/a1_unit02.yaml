    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Atât نام من فریدون است, cât și فریدون استم spun corect numele; același tipar funcționează pentru orice nume.
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: Răspunde cu voce tare la نام‌تان چیست?, spunând că te numești Faridun.
