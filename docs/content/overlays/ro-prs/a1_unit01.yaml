      status: correct
    feedback: سلام începe cu س. Întrebarea verifică scrierea cuvântului învățat, nu ce litere pot reprezenta sunetul s.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: Care literă reprezintă sunetul ch?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
