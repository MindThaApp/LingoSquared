  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: Aranjează literele pentru a forma سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م formează سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Alege cuvântul scris legat care înseamnă „salut”.
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام înseamnă „salut”.
    prompt_blocks:
    - bună
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Se scrie dari de la dreapta la stânga?
    options:
    - da
    - nu
    accepted_answers:
    - value: da
      status: correct
    feedback: Scrierea dari merge de la dreapta la stânga.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Copiază exact سلام.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: Scrierea corectă este سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Ce înseamnă această expresie?
    correct_option: salut (pacea fie asupra voastră)
    distractors:
    - la revedere
    - bun venit
    - mulțumesc
    accepted_answers:
    - value: salut (pacea fie asupra voastră)
      status: correct
    feedback: 'سلام علیکم înseamnă „salut” (literal: „pacea fie asupra voastră”).'
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Tradu în dari: „Și pacea fie asupra voastră” (răspunsul obișnuit la سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Variantă acceptată de scriere cu alt spațiu.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Variantă obișnuită a răspunsului complet.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Variantă obișnuită a răspunsului complet, cu conjuncția scrisă separat.
    feedback: وعلیکم سلام este răspunsul convențional; sunt corecte și formele complete obișnuite care conțin السلام.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Răspunde la سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Se înțelege, dar este mai puțin reciproc decât răspunsul complet.
    feedback: وعلیکم سلام și وعلیکم السلام sunt răspunsuri complete convenționale.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Alege sensul lui خوش آمدین.
    correct_option: bun venit
    distractors:
    - la revedere
    - mulțumesc
    - noapte bună
    accepted_answers:
    - value: bun venit
      status: correct
    feedback: خوش آمدین înseamnă „bun venit”.
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Traduceți în dari: Mulțumesc.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: Mulțumesc
      status: acceptable_with_note
      note: Se înțelege în dari; în acest curs forma preferată este تشکر.
    - value: Mulțumesc
      status: acceptable_with_note
      note: Se înțelege în dari; în acest curs forma preferată este تشکر.
    feedback: تشکر este răspunsul preferat în dariul din Afganistan, în acest curs.
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Aranjează expresia formală, folosită în mai multe regiuni, pentru „Cu plăcere”.
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم este un răspuns politicos la mulțumiri, folosit în mai multe regiuni.
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
    instruction: Alege sensul lui خدا حافظ.
    correct_option: la revedere
