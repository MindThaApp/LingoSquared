course:
  title: Dari în română A1
  description: Dari afgană pentru începători, axată pe citirea scrierii perso-arabe, înțelegerea vorbirii afgane de zi cu zi, schimbul de saluturi extinse și o primă întâlnire respectuoasă la un loc de muncă din Kabul.
units:
  prs.a1.unit01.greetings:
    title: Saluturi și primele întâlniri
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Citește literele folosite în această unitate
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Schimbă saluturi de zi cu zi
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Salută și ia rămas-bun în momente diferite ale zilei
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Poartă o conversație ușoară, politicoasă sau informală
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Întreabă de familie și arată respect față de oaspeți
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Începe prima zi la un loc de muncă din Kabul
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Literele ا، ب، ت și د
    gloss: a/ā, b, t și d
    note: Dari se scrie de la dreapta la stânga. Litera د nu se leagă de litera următoare, din stânga.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Literele ر și ز
    gloss: r și z
    note: Niciuna dintre aceste litere nu se leagă de litera următoare.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Literele س، ش și ص
    gloss: s, ș și s
    note: س și ص redau amândouă sunetul s în dari obișnuită; ش redă sunetul ș.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Literele ج، چ، ح și خ
    gloss: j, ci/ce (ch), h și kh
    note: چ se citește ch (ca „ci” în „ciar”). خ este sunetul transcris de obicei kh.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Literele ع، غ، ف și ق
    gloss: ʿ, gh, f și q
    note: Pronunția exactă a literelor غ și ق diferă de la un vorbitor de dari la altul; păstrează-le distincte în scris.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Literele ک، گ، ل și م
    gloss: k, g, l și m
    note: ک este kaf-ul persan; este forma folosită pentru k în dari. ل și م se leagă de literele din ambele părți.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Literele ن، و، ه și ی
    gloss: n, w/v/o/u, h și y/i lung
    note: ی este ye-ul persan, folosit pentru y și pentru vocala lungă ee. و poate fi consoană (w/v) sau vocală lungă (o/oo).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Citește un cuvânt cu litere legate
    gloss: salut
    note: Literele se leagă și formează سلام. Vocalele scurte de obicei nu se scriu.
    example_gloss: Bună! Eu sunt Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Un salut respectuos de zi cu zi
    gloss: Pacea fie asupra voastră / bună
    note: سلام علیکم este răspândit în Afganistan și se potrivește atât între cunoscuți, cât și în întâlniri respectuoase.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Răspunde la salut
    gloss: Și asupra voastră fie pacea
    note: وعلیکم سلام este răspunsul obișnuit la سلام علیکم. Sunt acceptate și formele care conțin السلام.
  prs.a1.unit01.lesson02.teach.salam:
    title: Un salut scurt
    gloss: salut
    note: سلام este un salut mai scurt, folosit flexibil.
    example_gloss: Bună, ce mai faci?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Bun venit
    gloss: bun venit
    note: خوش آمدین este urarea de bun venit respectuoasă din vorbire, folosită pentru o persoană sau pentru mai multe.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Mulțumesc
    gloss: mulțumesc
    note: تشکر este forma de dari afgană preferată în acest curs. ممنون și ممنونم sunt variante secundare, care se înțeleg.
    example_gloss: Vă mulțumesc foarte mult.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Un răspuns formal la mulțumiri
    gloss: cu plăcere
    note: خواهش می‌کنم este un răspuns politicos, folosit în toate regiunile persanofone. Nu este prezentat ca o expresie colocvială specific afgană.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: La revedere
    gloss: la revedere
    note: خدا حافظ este o formulă obișnuită de rămas-bun în dari afgană și se scrie adesea în două cuvinte.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Salut de dimineață
    gloss: bună dimineața
    note: صبح بخیر se folosește dimineața.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Salut de zi
    gloss: bună ziua
    note: روز بخیر este un salut politicos de zi.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Salut de după-amiază târzie
    gloss: bună după-amiaza / bună seara
    note: عصر بخیر se potrivește în partea de după-amiază târzie a zilei.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Expresie de noapte
    gloss: noapte bună
    note: شب بخیر încheie de obicei o seară; nu se folosește pentru a începe o întâlnire obișnuită în timpul zilei.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Un rămas-bun politicos de zi
    gloss: o zi bună
    note: روز خوش este o formulă de rămas-bun politicoasă, oarecum formală, folosită în toate regiunile persanofone, nu o formulă colocvială specific afgană.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Până la următoarea întâlnire
    gloss: sper să ne revedem
    note: به امید دیدار este un rămas-bun cald, dar respectuos.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Întreabă politicos cum se simte cineva
    gloss: Ce mai faceți?
    note: استین este o formă vorbită politicoasă, des folosită în dari afgană, împreună cu شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Întreabă un egal sau un prieten apropiat
    gloss: Ce mai faceți?
    note: تو și استی sunt forme informale de singular; nu folosi automat această combinație cu o persoană în vârstă sau cu o cunoștință nouă.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Spune că ești bine
    gloss: Sunt bine, mulțumesc.
    note: استم înseamnă „sunt”. Este forma vorbită din dari afgană folosită în tot cursul.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Spune că ești sănătos sau că ești bine
    gloss: Sunt bine.
    note: جور are sensul de „bine” sau „sănătos” și apare frecvent în saluturile afgane.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Un răspuns rezervat
    gloss: Nu sunt rău.
    note: بد نیستم este un răspuns neutru.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Întoarce întrebarea
    gloss: Dar dumneavoastră?
    note: و شما؟ păstrează schimbul de replici respectuos și concis.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Prelungește salutul
    gloss: Sunt toți bine?
    note: Saluturile afgane pot continua cu întrebări despre cei din casă înainte de a începe discuția de afaceri.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Întreabă de familia cuiva
    gloss: Familia dumneavoastră este bine?
    note: Întrebarea despre familie face parte în mod obișnuit dintr-un salut afgan extins. Cursul scrie forma posesivă ca فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Întreabă de cei din casă
    gloss: Sunt toți cei de acasă bine?
    note: اهل خانه se referă în mod colectiv la membrii gospodăriei.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Răspunde la întrebarea despre familie
    gloss: Slavă Domnului, toți sunt bine.
    note: Aici شکر este o expresie prescurtată de recunoștință, nu cuvântul „zahăr” în sensul lui alimentar.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Oferă un răspuns cald și politicos
    gloss: Să trăiești mult / mulțumesc.
    note: زنده باشین este o formulă de politețe frecventă în Afganistan, spusă adesea ca răspuns la mulțumiri sau la vorbe frumoase. باشین este forma vorbită respectuoasă pentru „dumneavoastră”.
  prs.a1.unit01.lesson05.teach.own_home:
    title: Primește călduros un oaspete
    gloss: Simte-te ca acasă.
    note: خانهٔ خودتان است îl asigură pe oaspete că este binevenit.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Oferă locul de cinste
    gloss: Vă rog, luați loc în locul de onoare.
    note: Într-o cameră pentru oaspeți, بالا بفرمایین îl invită pe oaspete spre locul mai onorat, departe de intrare. Nu înseamnă neapărat la etaj.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Salută întâi pe cei mai în vârstă
    gloss: Îi salutăm mai întâi pe cei mai în vârstă.
    note: Saluturile adresate mai întâi persoanelor în vârstă arată respect. Saluturile fizice depind de relație, de gen și de context; cel care învață nu trebuie să presupună că o strângere de mână este potrivită.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Biroul
    gloss: birou
    note: دفتر denumește un birou sau un loc de muncă.
    example_gloss: Biroul meu este în Kabul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل este capitala Afganistanului și locul în care se petrece acest dialog.
    example_gloss: Locuiesc la Kabul.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed se prezintă ca noul coleg
    gloss: Hamed spune că este noul coleg.
    note: Ambii vorbitori sunt colegi adulți, bărbați, care se întâlnesc într-un birou din Kabul.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib îl întâmpină și îl întreabă cum îl cheamă
    gloss: Najib îi urează bun venit și îl întreabă cum îl cheamă.
    note: خوش آمدین este urarea de bun venit respectuoasă din limba vorbită, potrivită pentru o persoană sau pentru mai multe.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed își spune numele
    gloss: Hamed își spune numele.
    note: نامم حامد است (mă numesc Hamed) este forma obișnuită din limba vorbită; نامم este نام + -م (al meu). În scris întâlnești și نام من حامد است. Ambele sunt corecte.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib se prezintă și spune că îi pare bine să îl cunoască
    gloss: Najib se prezintă și spune că îi pare bine să îl cunoască.
    note: از آشنایی با شما خوش شدم se referă explicit la faptul de a face cunoștință, deci se potrivește la o primă întâlnire.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed răspunde la fel și îl întreabă pe Najib ce mai face
    gloss: Hamed spune că și lui îi pare bine și îl întreabă pe Najib ce mai face.
    note: Schimbul de replici păstrează formele respectuoase شما și استین între colegi noi.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib răspunde
    gloss: Najib spune că e bine, mulțumesc.
    note: جور استم، تشکر răspunde la întrebarea despre starea cuiva, așa cum s-a învățat mai devreme în această unitate.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib întreabă de familia lui Hamed
    gloss: Najib întreabă de familia lui Hamed.
    note: Întrebarea despre cei din casă prelungește salutul, înainte să treacă la treburile de la birou.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed spune că toți sunt bine
    gloss: Hamed spune că toți sunt bine.
    note: شکر، همه جور استند răspunde la întrebarea despre familie, așa cum s-a învățat mai devreme în această unitate.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib se oferă să îi prezinte pe ceilalți colegi
    gloss: Najib se oferă să îi prezinte pe ceilalți colegi.
    note: بفرمایین îl invită aici pe Hamed să vină după el, nu să se așeze și nici să ia ceva.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed acceptă și mulțumește
    gloss: Hamed acceptă și mulțumește.
    note: بسیار خوب este introdus aici ca răspuns afirmativ clar.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib răspunde cu căldură și îi arată biroul lui Hamed
    gloss: Najib răspunde cu căldură și îi arată lui Hamed biroul lui.
    note: Dialogul se încheie cu începutul zilei de lucru, nu cu o formulă de despărțire ca după o vizită acasă.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed îi mulțumește
    gloss: Hamed îi mulțumește.
    note: تشکر încheie schimbul de replici simplu.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
