    gloss: ea a mers / el a mers
    note: 'رفت este persoana a III-a singular a trecutului simplu al verbului رفتن: tema trecutului, fără terminație.'
    target_text: رفت (a mers -- persoana a III-a de la رفتن, necesar pentru a rezuma dialogul despre Zarmina)
