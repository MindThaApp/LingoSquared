course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: trecutul simplu al trei verbe frecvente (a merge, a mânca, a face/a lucra), citirea unor texte scurte și apoi mai lungi despre ziua de ieri și un dialog în care se întreabă ce a făcut cineva ieri.'
