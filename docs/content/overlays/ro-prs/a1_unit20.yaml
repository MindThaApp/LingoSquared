    title: Da
    gloss: da
    note: بلی este cuvântul politicos/formal pentru „da”, în acord cu registrul acestui curs.
    example_gloss: Da, am muncit.
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: Homayoun întreabă
    gloss: Zarmina, unde ai fost ieri?
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: Zarmina răspunde
    gloss: Am mers la birou.
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: Homayoun întreabă
    gloss: Ai muncit?
  prs.a1.unit20.lesson06.teach.dialogue_line4:
