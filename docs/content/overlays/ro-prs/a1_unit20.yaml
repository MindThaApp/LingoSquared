    title: Am mers
    gloss: m-am dus
    note: رفتم este persoana I a trecutului simplu al verbului رفتن („a merge”).
    target_text: رفتم (am mers -- trecut de la رفتن)
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: Micul dejun
    gloss: micul dejun
    note: صبحانه înseamnă „micul dejun”. Cuvântul îți este deja cunoscut din unitatea despre rutina zilnică.
    example_gloss: Am luat micul dejun.
  prs.a1.unit20.lesson02.teach.ate_word:
    title: Am mâncat
    gloss: am mâncat
    note: خوردم este persoana I a trecutului simplu al verbului خوردن („a mânca”).
    target_text: خوردم (am mâncat -- trecut de la خوردن)
  prs.a1.unit20.lesson03.teach.work_word:
