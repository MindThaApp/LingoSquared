  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: Ai lucrat
    gloss: ai făcut / ai muncit
    note: کردی este persoana a II-a singular a trecutului simplu al verbului کردن („a face”).
    target_text: کردی (ai făcut / ai lucrat -- persoana a II-a de la کردن)
