    title: Am făcut
    gloss: am făcut
    note: کردم este persoana I a trecutului simplu al verbului کردن („a face”). کار کردم înseamnă literal „am făcut muncă”, adică „am muncit”.
    target_text: کردم (am făcut -- trecut de la کردن)
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: O scurtă relatare despre ieri
    gloss: Ieri am mers la birou. Am luat micul dejun. Am muncit.
    note: O scurtă relatare la persoana I despre ce a făcut autorul ieri, cu verbele la trecut învățate în această lecție.
