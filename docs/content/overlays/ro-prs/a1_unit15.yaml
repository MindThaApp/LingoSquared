teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Acesta
    gloss: acesta
    note: این înseamnă „acesta”.
    example_gloss: Acesta este mai mare.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Acela
    gloss: acela
    note: آن înseamnă „acela”. Dialectul acestui curs folosește forma completă آن, nu forma colocvială iraniană اون.
    example_gloss: Acela este mai mic.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Este mai mare
    gloss: este mai mare
    note: 'بزرگ‌تر است este forma completă, necontrasă (este mai mare): *بزرگ‌تر* este comparativul lui *بزرگ* (mare), iar *است* rămâne un cuvânt separat.'
    example_gloss: Acesta este mai mare decât acela.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Este mai mic
    gloss: este mai mic
    note: کوچک‌تر است este forma completă (este mai mic) -- کوچک este scrierea standard în dari (nu forma colocvială iraniană کوچیک).
    example_gloss: Acela este mai mic decât acesta.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Decât
    gloss: decât
    note: از marchează termenul de comparație -- X از Y بزرگ‌تر است înseamnă că X este mai mare decât Y.
    target_text: از (decât)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Este mai scump
    gloss: este mai scump
    note: گران‌تر است este forma completă (este mai scump) -- گران este scrierea standard în dari (nu forma colocvială iraniană گرون).
    example_gloss: Acesta este mai scump decât acela.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Este mai ieftin
    gloss: este mai ieftin
    note: ارزان‌تر است este forma completă (este mai ieftin) -- ارزان este scrierea standard în dari (nu forma colocvială iraniană ارزون).
    example_gloss: Acela este mai ieftin decât acesta.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim și Negar
    gloss: Karim, Negar
    note: Nume afgane frecvente, folosite pe parcursul cursului.
    example_gloss:
    - Eu sunt Karim.
    - Eu sunt Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Mai înalt
    gloss: mai înalt / este mai înalt(ă)
    note: '*قد بلندتر است* înseamnă literal „înălțimea este mai mare”: *قد* (înălțime, statură), *بلندتر* (mai înalt, comparativul lui *بلند*, înalt), *است* (este).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Mai tânăr
    gloss: mai tânăr / este mai tânăr(ă)
    note: جوان‌تر است este forma completă (este mai tânăr) -- جوان este scrierea standard în dari (nu forma colocvială iraniană جوون).
    example_gloss: Negar este mai tânără decât Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Este mai bun
    gloss: este mai bun
    note: بهتر است este forma completă -- بهتر (mai bun) este comparativul neregulat al lui خوب (bun).
    example_gloss: Acesta este mai bun decât acela.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Este mai rău
    gloss: este mai rău
    note: بدتر است este forma completă -- بدتر (mai rău) este comparativul neregulat al lui بد (rău).
    example_gloss: Acela este mai rău decât acesta.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Pentru că
    gloss: pentru că
    note: چون introduce un motiv.
    target_text: چون (pentru că)
  prs.a1.unit15.lesson04.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Text-model de comparație
    gloss: Karim este mai înalt decât Negar. Negar este mai tânără decât Karim.
    note: O scurtă comparație la persoana a treia, care reunește vocabularul acestei unități.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim și Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim este mai înalt.
    - Negar este mai tânără.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Dar
    gloss: dar
    note: اما înseamnă „dar” și introduce un contrast.
    target_text: اما (dar)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Da
    gloss: da
    note: بلی este cuvântul politicos/formal pentru „da”, în acord cu registrul acestui curs.
    example_gloss: Da, acesta este mai scump.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim spune
    gloss: Acesta este mai scump decât acela, dar este mai bun.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar răspunde
    gloss: Da, dar acela este mai ieftin.
