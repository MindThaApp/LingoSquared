teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Bucătărie
    gloss: bucătărie
    note: آشپزخانه este cuvântul dari standard pentru bucătărie.
    example_gloss: Azi sunt în bucătărie.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Mâncare
    gloss: mâncare / masă
    note: غذا înseamnă mâncare sau masă în general, spre deosebire de un fel anume, precum پلو.
    example_gloss: Mâncarea este gustoasă.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Ceapa
    gloss: ceapă
    note: پیاز este cuvântul dari obișnuit pentru ceapă, folosit mereu în bucătăria afgană.
    example_gloss: Ceapa este proaspătă.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Carnea
    gloss: carne
    note: گوشت înseamnă carne.
    example_gloss: Carnea este proaspătă.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Recapitulare: un/o, vreau, în, sunt'
    gloss: un, o / vreau / în, la / sunt
    note: یک, می‌خواهم, در și استم sunt forme recapitulate, folosite în propozițiile despre gătit din această unitate.
    target_text: یک (un/o) / می‌خواهم (vreau) / در (în/la) / استم (sunt)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Gătesc mâncare
    gloss: Gătesc mâncare.
    note: می‌پزم este forma de prezent a persoanei I singular a verbului پختن, „a găti”.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Sunt în bucătărie
    gloss: Sunt în bucătărie.
    note: استم este forma persoanei I singular a copulei, folosită aici cu در pentru a indica locul.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Sarea
    gloss: sare
    note: نمک înseamnă sare.
    example_gloss: Vreau sare.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Orezul
    gloss: orez
    note: برنج este orezul necopt (boabele), diferit de پلو, preparatul de orez gătit, învățat în unitatea despre mâncare.
    example_gloss: Gătesc orez.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Recapitulare: fac, tăiat'
    gloss: fac / tăiat, mărunțit
    note: می‌کنم este recapitulare; خرد este nou și se combină cu formele verbului کردن pentru a însemna „a toca” sau „a tăia”.
    target_text: می‌کنم (fac) / خرد (tăiat/mărunțit)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Tai ceapa mărunt
    gloss: Tai ceapa mărunt.
    note: خرد می‌کنم înseamnă literal „fac să fie tăiat mărunt”, un tipar obișnuit de verb compus.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Pun sare
    gloss: Pun sare.
    note: می‌اندازم (de la انداختن, „a arunca, a pune în”) este verbul firesc în dari pentru a adăuga un ingredient.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Gătesc carne
    gloss: Gătesc carne.
    note: Înlocuiește گوشت cu برنج pentru a numi un alt aliment care se gătește.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Recapitulare: întâi, apoi'
    gloss: întâi / apoi
    note: اول și بعد sunt cuvinte recapitulate, folosite pentru a ordona pașii de gătit.
    target_text: اول (întâi) / بعد (apoi)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Recapitulare: apă, fierbinte'
    gloss: apă / fierbinte, cald
    note: آب și گرم sunt cuvinte recapitulate din unitățile anterioare.
    target_text: آب (apă) / گرم (fierbinte)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Torn
    gloss: torn
    note: می‌ریزم (de la ریختن, „a turna”) este verbul firesc pentru a adăuga un lichid, diferit de می‌اندازم, folosit pentru ingredientele solide.
    example_gloss: Torn apă.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Întâi tai ceapa mărunt
    gloss: Întâi tai ceapa mărunt.
    note: اول marchează primul pas dintr-o succesiune.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Apoi gătesc carnea
    gloss: Apoi gătesc carnea.
    note: بعد marchează pasul următor dintr-o succesiune.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Torn apă fierbinte
    gloss: Torn apă fierbinte.
    note: Îl combină pe گرم („fierbinte”) cu می‌ریزم („torn”).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Bună / da / vă rog / bine / mulțumesc / tocană / delicios / este
    gloss: bună / da / te rog / bine, desigur / mulțumesc / tocană / delicios / este
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه și است sunt cuvinte recapitulate, folosite în dialogul din bucătărie.
    target_text: سلام (salut) / بلی (da) / لطفاً (vă rog) / چشم (bine, desigur) / تشکر (mulțumesc) / قورمه (tocană) / خوش‌مزه (gustoasă) / است (este)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Bună, ce gătiți?'
    gloss: Bună, ce gătiți?
    note: چی می‌پزین؟ folosește forma de politețe می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Gătesc qorma.'
    gloss: Gătesc qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: Să vă ajut?'
    gloss: Să vă ajut?
    note: کمک می‌کنم؟ înseamnă literal „ajut?”, o modalitate firească de a oferi ajutor.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Da, vă rog, tăiați ceapa mărunt.'
    gloss: Da, vă rog, tăiați ceapa mărunt.
    note: 'کنین este forma de politețe a imperativului: „faceți!”.'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Desigur.'
    gloss: Desigur.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Mulțumesc, mâncarea este delicioasă.'
    gloss: Mulțumesc, mâncarea este delicioasă.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: El/ea, în, face, gătește, foarte, fericit, este
    gloss: el, ea / în, la / el/ea face / el/ea gătește / foarte / fericit, fericită / este
    note: او este pronumele dari pentru „el” sau „ea”; می‌کند și می‌پزد sunt formele de persoana a III-a ale verbelor folosite mai devreme în această unitate.
    target_text: او (el/ea) / در (în/la) / می‌کند (face) / می‌پزد (gătește) / بسیار (foarte) / خوشحال (fericit/fericită) / است (este)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Citire: Nadia gătește'
    gloss: Nadia este în bucătărie. Ea taie ceapa mărunt. Apoi gătește carnea. Mâncarea este foarte delicioasă. Nadia este fericită.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (îmi place) / را (marcă a obiectului) / اما (dar) / وقت ندارم (nu am timp)
