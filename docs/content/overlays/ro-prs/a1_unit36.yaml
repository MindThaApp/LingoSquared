course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: denumești obiecte din bucătărie și ingrediente, descrii acțiuni de gătit, urmezi pași simpli de gătit și vorbești despre pregătirea unei mese.'
units:
  prs.a1.unit36.cooking:
    title: Gătitul
    description: Denumește acțiuni de bază din bucătărie, descrie pregătirea mâncării și urmează sau dă instrucțiuni simple de gătit.
