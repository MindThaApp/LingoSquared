    example_gloss: Ziua mea de naștere este în Hamal.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Sărbătoare
    gloss: sărbătoare / petrecere
    note: جشن înseamnă sărbătoare sau petrecere.
    example_gloss: Sărbătoarea noastră este mare.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Tort
    gloss: tort
    note: کیک înseamnă tort, un împrumut comun în persană și dari.
    example_gloss: Tortul este delicios.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Cadou
    gloss: cadou
    note: هدیه înseamnă cadou, un cuvânt obișnuit în dari și persană (se folosește și تحفه).
    example_gloss: Acest cadou este pentru dumneavoastră.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Felicitări
    gloss: felicitări
    note: تبریک înseamnă felicitări; se folosește cu می‌گویم (spun) în expresia uzuală تبریک می‌گویم (vă felicit).
    example_gloss: Felicitări!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: La mulți ani (formare)
    gloss: ziua ta de naștere (informal) + binecuvântat → La mulți ani
    note: تولدت îmbină تولد (zi de naștere) cu sufixul informal „al tău” -ت; مبارک înseamnă binecuvântat/fericit. Împreună, تولدت مبارک este urarea standard de ziua de naștere în dari și persană.
    target_text: تولدت (ziua ta, informal) + مبارک (binecuvântat) = تولدت مبارک (La mulți ani)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: La mulți ani!
    gloss: La mulți ani!
    note: Urarea autentică, larg folosită, de ziua de naștere în dari și persană (تولدتان مبارک este varianta formală, care nu apare în exercițiile acestei unități).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: Dumneavoastră / în-la / este
    gloss: dumneavoastră (formal) / în-la / este
    note: شما (dumneavoastră), در (în/la) și است (este) sunt recapitulare din unitățile anterioare.
    target_text: شما (dumneavoastră, formal) / در (în/la) / است (este)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
