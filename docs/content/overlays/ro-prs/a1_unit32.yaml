course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabular despre sărbători și zile de naștere (zi de naștere, sărbătoare, tort, cadou, felicitări), cum întrebi și spui în ce lună cade ziua de naștere a cuiva, o formulă formală de invitație și un dialog între Basir și Maryam despre o petrecere de ziua de naștere.'
units:
