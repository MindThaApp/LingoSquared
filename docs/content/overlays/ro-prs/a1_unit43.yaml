    title: Luni am carte, dar marți nu am
    gloss: Luni am carte, dar marți nu am.
    note: اما pune în contrast faptul că ai carte luni cu faptul că nu o ai marți.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Ce carte doriți?
    gloss: Ce carte doriți?
    note: Varianta formală, cu شما, a întrebării despre ce carte dorește cineva.
