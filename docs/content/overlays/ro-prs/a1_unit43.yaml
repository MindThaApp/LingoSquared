course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: împrumută și returnează un obiect simplu de la bibliotecă, întreabă data returnării și citește un scurt text despre o carte împrumutată -- întreabă ce carte dorește cineva, propune și confirmă o dată de returnare și înțelege un schimb simplu la bibliotecă.'
units:
  prs.a1.unit43.library:
    title: Biblioteca
    description: Cere o carte, împrumut-o și returnea-z-o, întreabă și confirmă data returnării și citește un scurt text despre o carte împrumutată.
