    title: 'Homayoun: Bună ziua. Vreau să împrumut o carte.'
    gloss: Bună ziua. Vreau să împrumut o carte.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Bibliotecarul: Bună ziua. Ce carte doriți?'
    gloss: Bună ziua. Ce carte doriți?
    note: می‌خواهین este forma de plural politicos pentru „doriți”.
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Vreau această carte.'
    gloss: Vreau această carte.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Bibliotecarul: Bine. Data returnării este luni.'
    gloss: Bine. Data returnării este luni.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Foarte bine. Mulțumesc mult.'
    gloss: Foarte bine. Mulțumesc mult.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Bibliotecarul: Cu plăcere.'
    gloss: Cu plăcere.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Recapitulare: Homayoun, el/ea, el/ea are'
    gloss: Homayoun / el, ea / el, ea are
    note: همایون, او și دارد sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: همایون (Homayoun) / او (el/ea) / دارد (el/ea are)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Citire despre cartea împrumutată
    gloss: Homayoun are o carte. Cartea lui este de la bibliotecă. Data returnării cărții lui este luni. Homayoun este fericit.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Recapitulare: nu am, dar, dumneavoastră (formal)'
    gloss: nu am / dar / dumneavoastră (formal)
    note: ندارم, اما și شما sunt cuvinte recapitulate, folosite pentru a pune în contrast două zile.
    target_text: ندارم (nu am) / اما (dar) / شما (dumneavoastră)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Recapitulare: marți'
