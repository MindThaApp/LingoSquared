  prs.a1.unit43.lesson05.reading:
    title: Citim despre cartea împrumutată
  prs.a1.unit43.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Recapitulare: carte, am, este, în'
    gloss: carte / am / este / în
    note: کتاب, دارم, است și در sunt cuvinte de recapitulare folosite pentru a vorbi despre o carte.
    target_text: کتاب (carte) / دارم (am) / است (este) / در (în)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Recapitulare: vreau, un/o/unu'
    gloss: vreau / un / o / unu
    note: می‌خواهم și یک se combină pentru a spune ce vrei.
    target_text: می‌خواهم (vreau) / یک (un / o / unu)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Biblioteca
    gloss: bibliotecă
    note: کتابخانه este cuvântul dari standard pentru „bibliotecă”, format din کتاب (carte) și خانه (casă).
    example_gloss: Cartea este în bibliotecă.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliotecarul
    gloss: bibliotecar
    note: کتابدار înseamnă literal „păstrător de cărți” (cineva care are grijă de cărți) și este format la fel ca دوکاندار („negustor”, Unitatea 8).
    example_gloss: Bibliotecarul este la bibliotecă.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Vreau o carte
    gloss: Vreau o carte.
    note: یک کتاب می‌خواهم combină یک (o/un), کتاب (carte) și می‌خواهم (vreau).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Recapitulare: de la, marcatorul obiectului'
    gloss: de la / (marcator al obiectului)
    note: از (de la) și را (marchează obiectul din propoziție, din Unitatea 14/Unitatea 26) sunt cuvinte recapitulate.
    target_text: از (de la) / را (marcă a complementului direct)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Vreau cartea de la bibliotecar
    gloss: Vreau cartea de la bibliotecar.
    note: از کتابدار (de la bibliotecar) este adăugat la کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Vreau o carte de la bibliotecar
    gloss: Vreau o carte de la bibliotecar.
    note: Combină یک (o/un) cu کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Recapitulare: dată, zi, luni'
    gloss: dată / zi / luni
    note: تاریخ, روز și دوشنبه (toate din Unitatea 9) sunt cuvinte recapitulate, folosite pentru a întreba despre data returnării.
    target_text: تاریخ (dată) / روز (zi) / دوشنبه (luni)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Recapitulare: care, este'
    gloss: care / este
    note: کدام și است sunt cuvinte recapitulate, folosite pentru a pune o întrebare.
    target_text: کدام (care) / است (este)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Returnarea / darea înapoi
    gloss: returnare / dare înapoi
    note: پس دادن înseamnă literal „a da înapoi”; پس (înapoi) se combină cu دادن (a da).
    example_gloss: Data returnării este luni.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: În ce zi este data returnării?
    gloss: În ce zi trebuie returnată cartea?
    note: تاریخ پس دادن کتاب کدام روز است؟ întreabă când trebuie returnată o carte împrumutată.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: Data returnării este luni
    gloss: Data returnării este luni.
    note: تاریخ پس دادن دوشنبه است răspunde la întrebare cu o zi anume.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Recapitulare: vreau, carte, un/o, acest'
    gloss: vreau / carte / un, o / acest
    note: می‌خواهم، کتاب، یک și این sunt cuvinte recapitulate, folosite pentru a cere o carte anume.
    target_text: می‌خواهم (vreau) / کتاب (carte) / یک (un / o / unu) / این (acest / această)
  prs.a1.unit43.lesson03.teach.get_word:
    title: A lua / a primi
    gloss: a lua / a primi
    note: بگیرم este forma de conjunctiv („să iau”), aceeași formă folosită în Unitatea 42 cu می‌خواهم pentru a spune „vreau să iau”.
    example_gloss: Vreau să iau o carte.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Împrumut
    gloss: împrumut
    note: قرض înseamnă împrumut; قرض گرفتن („a lua cu împrumut”) este modul obișnuit în dari de a spune „a împrumuta”.
    example_gloss: Această carte este împrumutată.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Vreau să împrumut cartea
    gloss: Vreau să împrumut cartea.
    note: می‌خواهم کتاب را قرض بگیرم combină می‌خواهم, کتاب را, قرض și conjunctivul بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: A da (înapoi)
    gloss: a da (înapoi)
    note: بدهم este forma de conjunctiv a verbului دادن (a da); împreună cu پس (înapoi) înseamnă „a da înapoi / a returna”.
    example_gloss: Vreau să îl dau înapoi.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Vreau să returnez cartea
    gloss: Vreau să returnez cartea.
    note: می‌خواهم کتاب را پس بدهم combină می‌خواهم, کتاب را, پس și conjunctivul بدهم.
