course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: sortează deșeurile menajere în containerul potrivit, întreabă în ce container intră un obiect și citește un program scurt de colectare cu două elemente. Vorbește despre gunoi, hârtie, plastic și sticlă și confirmă cu un prieten sortarea în containerele verde și albastru.'
units:
  prs.a1.unit44.waste_disposal:
    title: Sortarea deșeurilor
    description: Sortează deșeurile menajere în containerul potrivit, întreabă în ce container intră ceva și înțelege un program simplu de colectare a deșeurilor.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: 'Vocabular: deșeuri, container și plastic'
  prs.a1.unit44.lesson02.paper_and_glass:
    title: Hârtia, sticla și containerul albastru
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: Aruncarea deșeurilor
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: Dialog despre sortarea deșeurilor
  prs.a1.unit44.lesson05.reading:
    title: Citim despre Wahid și deșeuri
  prs.a1.unit44.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 'Recapitulare: este, în'
    gloss: este / în
    note: است și در (folosite pe tot parcursul cursului) sunt cuvinte recapitulate, cu care spunem unde se află ceva.
    target_text: است (este) / در (în)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Recapitulare: culoare, verde, albastru'
    gloss: culoare / verde / albastru
    note: رنگ, سبز și آبی sunt cuvinte recapitulate, cu care numim cele două containere de deșeuri.
    target_text: رنگ (culoare) / سبز (verde) / آبی (albastru)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Container
    gloss: container
    note: سطل este cuvântul dari obișnuit pentru container de gunoi sau găleată.
    example_gloss: Containerul este verde.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Deșeuri / gunoi
    gloss: deșeuri / gunoi
    note: زباله înseamnă deșeuri menajere sau gunoi.
    example_gloss: Gunoiul este în container.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Containerul verde
    gloss: container verde
    note: سطل سبز îmbină سطل (container) și سبز (verde).
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastic
    gloss: plastic
    note: پلاستیک este un împrumut obișnuit, folosit în toate varietățile persane, inclusiv în dari.
    example_gloss: Plasticul este în containerul albastru.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: Gunoiul este în containerul verde
    gloss: Gunoiul este în containerul verde.
    note: زباله در سطل سبز است îmbină cuvintele învățate mai devreme în această lecție.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 'Recapitulare: care, în, este'
    gloss: care / în / este
    note: کدام, در și است sunt cuvinte recapitulate, folosite pentru a întreba în ce container intră ceva.
    target_text: کدام (care / ce) / در (în) / است (este)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: Hârtie
    gloss: hârtie
    note: کاغذ este cuvântul dari obișnuit pentru hârtie.
    example_gloss: Hârtia este în container.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Sticlă
    gloss: sticlă
    note: شیشه este cuvântul dari obișnuit pentru sticlă.
    example_gloss: Sticla este în container.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Containerul albastru
    gloss: container albastru
    note: سطل آبی îmbină سطل (container) și آبی (albastru) și se folosește pentru materiale reciclabile precum hârtia, plasticul și sticla.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: În ce container este hârtia?
    gloss: În ce container este hârtia?
    note: کاغذ در کدام سطل است؟ întreabă în ce container intră un obiect.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: Hârtia este în containerul albastru
    gloss: Hârtia este în containerul albastru.
    note: کاغذ در سطل آبی است răspunde la întrebare indicând containerul potrivit.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: Sticla este în containerul albastru
    gloss: Sticla este în containerul albastru.
    note: شیشه در سطل آبی است urmează același tipar ca propoziția despre hârtie.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 'Recapitulare: marcatorul obiectului direct, arunc / pun'
    gloss: (marcatorul obiectului direct) / arunc / pun
    note: 'را și می‌اندازم (din Unitatea 36, unde însemna „pun sare”) sunt cuvinte recapitulate: verbul انداختن acoperă într-adevăr atât „a pune/adăuga”, cât și „a arunca”.'
    target_text: را (marcă a complementului direct) / می‌اندازم (pun / arunc)
  prs.a1.unit44.lesson03.teach.away_word:
    title: Departe
    gloss: departe
    note: دور (departe) se îmbină cu می‌اندازم în construcția standard دور انداختن („a arunca”).
    example_gloss: Arunc (ceva).
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: Arunc gunoiul
    gloss: Arunc gunoiul.
    note: زباله را دور می‌اندازم îmbină زباله را, دور și می‌اندازم.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: Pun plasticul în containerul albastru
    gloss: Pun plasticul în containerul albastru.
    note: پلاستیک را در سطل آبی می‌اندازم folosește می‌اندازم cu sensul „a pune în”.
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: Pun hârtia în containerul albastru
    gloss: Pun hârtia în containerul albastru.
    note: کاغذ را در سطل آبی می‌اندازم urmează același tipar, cu containerul albastru.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 'Recapitulare: nu arunc / nu pun'
    gloss: nu arunc / nu pun
    note: نمی‌اندازم este negativul regulat, cu نمی-, al lui می‌اندازم.
    target_text: نمی‌اندازم (nu pun / nu arunc)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: Nu pun sticla în containerul verde
    gloss: Nu pun sticla în containerul verde.
    note: شیشه را در سطل سبز نمی‌اندازم exprimă o regulă de sortare folosind forma negativă.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: Pun sticla în containerul albastru
    gloss: Pun sticla în containerul albastru.
    note: شیشه را در سطل آبی می‌اندازم indică acțiunea corectă pentru sticlă.
  prs.a1.unit44.lesson04.teach.review_this:
    title: 'Recapitulare: acesta'
    gloss: acesta
    note: این este un cuvânt recapitulat, folosit în dialog.
    target_text: این (acesta)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: 'Recapitulare: foarte, bine, mulțumesc mult, cu plăcere'
    gloss: foarte / bine / mulțumesc mult / cu plăcere
    note: بسیار, خوب, تشکر زیاد și خواهش می‌کنم sunt cuvinte recapitulate, folosite la încheierea dialogului.
    target_text: بسیار (foarte) / خوب (bun) / تشکر زیاد (mulțumesc mult) / خواهش می‌کنم (cu plăcere)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, în ce container arunc sticla aceasta?'
    gloss: Shukria, în ce container arunc sticla aceasta?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: 'Shukria: Sticla este în containerul albastru.'
    gloss: Sticla este în containerul albastru.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: 'Wahid: În ce container arunc gunoiul acesta?'
    gloss: În ce container arunc gunoiul acesta?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: 'Shukria: Gunoiul este în containerul verde.'
    gloss: Gunoiul este în containerul verde.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: 'Wahid: Foarte bine. Mulțumesc mult.'
    gloss: Foarte bine. Mulțumesc mult.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: 'Shukria: Cu plăcere.'
    gloss: Cu plăcere.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: 'Recapitulare: Wahid, el/ea, în fiecare zi, și, fericit'
    gloss: Wahid / el/ea / în fiecare zi / și / fericit
    note: وحید, او, هر روز, هم și خوشحال sunt cuvinte recapitulate, folosite în textul de citit.
    target_text: وحید (Wahid) / او (el/ea) / هر روز (în fiecare zi) / هم (de asemenea) / خوشحال (fericit)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: 'Recapitulare: el/ea aruncă'
    gloss: el/ea aruncă / pune
    note: می‌اندازد este forma de persoana a III-a din familia می‌اندازم/نمی‌اندازم, învățată mai devreme în această unitate.
    target_text: می‌اندازد (el/ea pune / aruncă)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: Citim despre Wahid și deșeuri
    gloss: Wahid aruncă gunoiul în fiecare zi. Hârtia este în containerul albastru. Plasticul este și el în containerul albastru. Gunoiul este în containerul verde. Wahid este fericit.
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: 'Recapitulare: luni, marți, dar, dumneavoastră'
    gloss: luni / marți / dar / dumneavoastră
    note: دوشنبه, سه‌شنبه, اما și شما sunt cuvinte recapitulate, folosite pentru a spune un program cu două elemente.
    target_text: دوشنبه (luni) / سه‌شنبه (marți) / اما (dar) / شما (dumneavoastră)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: Colectarea
    gloss: colectare
    note: جمع‌آوری înseamnă colectare sau strângere și se folosește pentru ziua de colectare a deșeurilor, la fel ca în „colectarea gunoiului” în română.
    example_gloss: Ziua de colectare este luni.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: Ziua de colectare a hârtiei este luni
    gloss: Hârtia se colectează luni.
    note: روز جمع‌آوری کاغذ دوشنبه است numește obiectul și ziua lui de colectare.
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: Ziua de colectare a gunoiului este marți
    gloss: Gunoiul se colectează marți.
    note: روز جمع‌آوری زباله سه‌شنبه است urmează același tipar, pentru gunoi.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: Hârtia luni, dar gunoiul marți
    gloss: Hârtia se colectează luni, dar gunoiul se colectează marți.
    note: اما pune în contrast cele două zile de colectare.
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: 'Recapitulare: dumneavoastră aruncați / puneți'
    gloss: dumneavoastră aruncați / puneți
    note: می‌اندازین este forma de plural de politețe, din aceeași familie cu terminația -ین ca می‌خواهین/کنین.
    target_text: می‌اندازین (dumneavoastră puneți / aruncați)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: În ce zi aruncați gunoiul?
    gloss: În ce zi aruncați gunoiul?
    note: Varianta formală, cu شما, a întrebării în ce zi aruncă cineva gunoiul.
