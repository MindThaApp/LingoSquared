course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: vocabularul sportului și al exercițiilor fizice (fotbal, volei, crichet, înot), cum întrebi și cum răspunzi de câte ori pe săptămână faci sport, cum spui unde joci sau unde faci sport, plus un dialog Zarmina/Homayoun care combină sportul, frecvența și locul.'
units:
  prs.a1.unit29.sports:
    title: Sporturi
    description: Vorbește despre ce sporturi sau exerciții faci, cât de des și unde.
lessons:
  prs.a1.unit29.lesson01.sport_vocabulary:
    title: Cuvinte despre sport
  prs.a1.unit29.lesson02.frequency_question:
    title: De câte ori pe săptămână?
  prs.a1.unit29.lesson03.location:
    title: Unde faci sport
  prs.a1.unit29.lesson04.sports_dialogue:
    title: Dialog despre sport
  prs.a1.unit29.lesson05.reading_sports:
    title: Citim despre sport
  prs.a1.unit29.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Sportul
    gloss: sport / exerciții fizice
    note: ورزش înseamnă sport sau exerciții fizice, cuvântul general pentru orice activitate fizică.
    example_gloss: Înotul este un sport bun.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Fotbalul
    gloss: fotbal
    note: فوتبال înseamnă fotbal.
    example_gloss: Fotbalul este un sport bun.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Voleiul
    gloss: volei
    note: والیبال înseamnă volei.
    example_gloss: Voleiul este și el un sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Crichetul
    gloss: crichet
    note: کرکت înseamnă crichet, un sport cu adevărat popular în Afganistan.
    example_gloss: Crichetul este un sport popular.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Înotul
    gloss: înot
    note: شنا înseamnă înot.
    example_gloss: Înotul este un sport bun.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Joc / a face → a juca
    gloss: joc / a face → joc
    note: بازی (joc) se combină cu کردن (a face, recapitulare) și formează بازی می‌کنم (joc), același tipar de verb compus folosit deja în پیاده‌روی می‌کنم și آشپزی می‌کنم.
    target_text: بازی (joc) + کردن (a face) = بازی می‌کنم (joc)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Fotbalul este un sport
    gloss: Fotbalul este un sport.
    note: Combină فوتبال, یک (un, recapitulare), ورزش și است (este, recapitulare).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Câți / câte
    gloss: câți / câte / de câte ori
    note: چند se folosește aici pentru a întreba despre frecvență.
    target_text: چند (câți)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Dată (ocazie)
    gloss: dată, oară (ca în „o dată”, „de două ori”)
    note: بار înseamnă „dată/oară” în sensul de numărare a repetărilor, nu ora de pe ceas.
    example_gloss: Înot o dată pe săptămână.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: În / săptămână
    gloss: în / săptămână
    note: در (în, recapitulare) și هفته (săptămână, recapitulare din Unitatea 4/Unitatea 9) se combină și înseamnă „pe săptămână”.
    target_text: در (în) / هفته (săptămână)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: Faceți sport (formal)
    gloss: tu faci sport (formal)
    note: ورزش می‌کنین este forma politicoasă, formală, pentru „faci sport”.
    target_text: ورزش می‌کنین (faceți sport, formal)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: De câte ori pe săptămână faceți sport?
    gloss: De câte ori pe săptămână faceți sport?
    note: Combină چند بار (de câte ori) + در هفته (pe săptămână) + ورزش می‌کنین (faceți sport, formal).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Joc fotbal de două ori pe săptămână
    gloss: Joc fotbal de două ori pe săptămână.
    note: دو (doi/două, recapitulare din Unitatea 4) بار در هفته spune frecvența înainte de numele sportului și de construcția بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: Sala de sport
    gloss: sală de sport
    note: باشگاه înseamnă sală de sport sau club sportiv.
    example_gloss: Sala de sport este mare.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Parc
    gloss: parc
    note: پارک este recapitulare din lecția despre planuri din Unitatea 13.
    target_text: پارک (parc)
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: La sală
    gloss: la sală
    note: در (în/la, recapitulare) + باشگاه.
  prs.a1.unit29.lesson03.teach.dar_park:
    title: În parc
    gloss: în parc
    note: در (în, recapitulare) + پارک (recapitulare).
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: Înot la sală
    gloss: Înot la sală.
    note: Combină در باشگاه cu شنا می‌کنم (înot), același tipar de verb compus ca بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: Joc fotbal în parc
    gloss: Joc fotbal în parc.
    note: Combină در پارک cu فوتبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: Tu (informal) / faci (informal)
    gloss: tu (informal) / tu faci (informal)
    note: تو (tu, informal) și می‌کنی (tu faci, informal) sunt recapitulare și apar în dialogul informal din această lecție, între prieteni apropiați.
    target_text: تو (tu, informal) / می‌کنی (faci, informal)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Unde
    gloss: unde
    note: کجا înseamnă „unde” și este înrudit cu کجاست (recapitulare din Unitatea 5/Unitatea 6, literal „unde este”), dar aici apare singur, înaintea unui verb.
    target_text: کجا (unde)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: El/ea face / joacă
    gloss: el/ea face/joacă
    note: می‌کند este forma de persoana a III-a (recapitulare) corespunzătoare lui می‌کنم și می‌کنی. Nu se rostește în acest dialog; se exersează în textul de citit din lecția următoare.
    target_text: می‌کند (el/ea face/joacă, persoana a III-a)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, de câte ori pe săptămână faci sport?'
    gloss: 'Homayoun: Zarmina, de câte ori pe săptămână faci sport?'
    note: O întrebare informală între prieteni, cu forma informală می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Joc volei de două ori pe săptămână'
    gloss: 'Zarmina: Joc volei de două ori pe săptămână.'
    note: Răspunde cu دو بار در هفته și والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Unde joci?'
    gloss: 'Homayoun: Unde joci?'
    note: Folosește کجا („unde”), introdus chiar în această lecție.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Joc la sală'
    gloss: 'Zarmina: Joc la sală.'
    note: Un răspuns scurt cu در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Joc fotbal în parc în fiecare săptămână'
    gloss: 'Homayoun: Joc fotbal în parc în fiecare săptămână.'
    note: Introduce هر („fiecare”, recapitulare din Unitatea 24) combinat cu هفته în هر هفته.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Grozav!'
    gloss: 'Zarmina: Grozav!'
    note: عالی است încheie schimbul de replici într-o notă pozitivă.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Citim despre sport
    gloss: Zarmina joacă volei de două ori pe săptămână. Ea joacă la sală. Homayoun joacă fotbal în parc în fiecare săptămână.
    note: Un scurt text de citit care recapitulează vocabularul sportiv al unității, cu می‌کند (face, persoana a III-a, recapitulare) și او (el/ea, recapitulare) aplicate celor două personaje cunoscute.
  prs.a1.unit29.lesson06.teach.review_ama:
    title: Dar
    gloss: dar
    note: اما înseamnă „dar” (recapitulare din unitățile anterioare).
    target_text: اما (dar)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: Îmi place / timp / nu am
    gloss: îmi place / timp / nu am
    note: دوست دارم (îmi place, recapitulare din Unitatea 14/Unitatea 26), وقت (timp, recapitulare din Unitatea 11/Unitatea 26) și ندارم (nu am, recapitulare din Unitatea 3/Unitatea 28) se combină în propoziția de încheiere.
    target_text: دوست دارم (îmi place) / وقت (timp) / ندارم (nu am)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: Îmi place fotbalul, dar nu am timp
    gloss: Îmi place fotbalul, dar nu am timp.
    note: Combină o preferință și o limitare cu اما, ceea ce dă lui وقت ندارم o utilizare reală.
