course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: exprimarea preferințelor și a ceea ce nu-ți place, întrebări despre preferințe, alegerea între două variante, motive simple și o scurtă lectură/un dialog despre preferințele a două persoane.'
units:
  prs.a1.unit14.preferences:
    title: Preferințe
    description: Exprimă și cere preferințe de bază, lucruri care nu-ți plac și motive simple.
lessons:
  prs.a1.unit14.lesson01.basic_likes:
    title: Ce îmi place și ce nu-mi place
  prs.a1.unit14.lesson02.asking_preferences:
    title: Întrebări despre preferințe
  prs.a1.unit14.lesson03.choosing_between_options:
    title: Alegerea între două lucruri
  prs.a1.unit14.lesson04.giving_reasons:
    title: Spui motivul
  prs.a1.unit14.lesson05.reading_about_preferences:
    title: Lectură despre preferințe
  prs.a1.unit14.lesson06.preferences_dialogue:
    title: Un dialog despre preferințe
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Îmi place
    gloss: îmi place
    note: دوست دارم înseamnă literal „am prietenie (cu el)” – este modul uzual de a spune „îmi place”.
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Cafea
    gloss: cafea
    note: قهوه înseamnă „cafea”.
    example_gloss: Îmi place cafeaua.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Ceai
    gloss: ceai
    note: چای înseamnă „ceai”.
    example_gloss: Nu-mi place ceaiul.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Nu-mi place
    gloss: nu-mi place
    note: دوست ندارم este negativul lui دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: eu
    gloss: eu
    note: من este pronumele personal de persoana întâi, folosit de sine stătător.
    example_gloss: Îmi place cafeaua.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (marcă a obiectului)
    gloss: (marchează complementul direct al verbului)
    note: را marchează un complement direct determinat. În dari se folosește atât în vorbirea de zi cu zi, cât și în scris; forma رو, specifică persanei din Iran, nu se folosește.
    target_text: را (marcă a complementului direct)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Care
    gloss: care
    note: کدام înseamnă „care (dintre ele)”.
    example_gloss: Pe care îl preferi?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: Muzică
    gloss: muzică
    note: موسیقی înseamnă „muzică”.
    example_gloss: Îmi place muzica.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: Aveți / vă place (politicos)
    gloss: aveți / vă place
    note: دارین este forma de politețe/plural a persoanei a II-a a verbului داشتن („a avea”), în acord cu registrul acestui curs, care folosește mai întâi forma de politețe استم/استین.
    target_text: دارین (aveți / vă place, politicos)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: Pe care îl preferi?
    gloss: Pe care îl preferi?
    note: کدام را دوست دارین؟ – را marchează complementul direct, aici lucrul pe care îl alegi.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Mai mult
    gloss: mai mult
    note: بیشتر înseamnă „mai mult”.
    example_gloss: Îmi place mai mult cafeaua.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: Sau
    gloss: sau
    note: یا înseamnă „sau” și se folosește pentru a oferi o alegere între două lucruri.
    target_text: یا (sau)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: Cafea sau ceai?
    gloss: Cafea sau ceai?
    note: قهوه یا چای؟ oferă o alegere între cele două băuturi învățate în lecția 1.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Pentru că
    gloss: pentru că
    note: چون introduce un motiv.
    target_text: چون (pentru că)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: Este gustos
    gloss: este gustos
    note: خوش‌مزه است este forma completă, necontrasă („este gustos”) – registrul acestui curs păstrează است separat, fără contragere.
    example_gloss: Îmi place cafeaua pentru că este gustoasă.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: Este interesant
    gloss: este interesant
    note: جالب است este forma completă, necontrasă („este interesant”).
    example_gloss: Îmi place muzica pentru că este interesantă.
  prs.a1.unit14.lesson04.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Negar
    gloss: Negar
    note: Un nume feminin afgan frecvent.
    example_gloss: Lui Negar îi place ceaiul.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Îi place
    gloss: îi place
    note: دارد este forma completă de persoana a treia a verbului داشتن (a avea) -- دوست دارد înseamnă „îi place”, după modelul lui دوست دارم de la persoana întâi.
    target_text: دوست دارد (îi place, formă completă de persoana a III-a)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: Nu-i place
    gloss: nu îi place
    note: ندارد este forma negativă completă de persoana a treia -- دوست ندارد înseamnă „nu îi place”.
    target_text: دوست ندارد (nu-i place, formă completă de persoana a III-a)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: Este cald
    gloss: este cald
    note: گرم است este forma completă, necontrasă („este cald”).
    example_gloss: Lui Negar îi place ceaiul pentru că este cald.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Text-model despre preferințe
    gloss: Lui Negar îi place ceaiul pentru că este cald. Lui Negar nu îi place muzica.
    note: O scurtă relatare la persoana a treia, care reunește vocabularul preferințelor din această unitate.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim și Negar
    gloss: Karim, Negar
    note: Nume afgane frecvente, folosite în tot cursul.
    example_gloss:
    - Eu sunt Karim.
    - Eu sunt Negar.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: Dar tu?
    gloss: Dar dumneavoastră?
    note: شما چطور؟ este modalitatea politicoasă de a întoarce întrebarea către interlocutor, în acord cu registrul politicos al familiei استین.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: Este grozav
    gloss: este grozav
    note: عالی است este forma completă, necontrasă („este grozav”).
    example_gloss: Cafeaua este grozavă.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Karim întreabă
    gloss: Ceai sau cafea, care vă place mai mult?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Răspunsul lui Negar
    gloss: Îmi place mai mult cafeaua pentru că este delicioasă. Dar dumneavoastră?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim răspunde
    gloss: Îmi place ceaiul pentru că este cald.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Reacția lui Negar
    gloss: Grozav!
