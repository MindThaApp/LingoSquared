  prs.a1.unit27.lesson03.hair_eye_color:
    title: Culoarea părului și a ochilor
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialog despre aspect
  prs.a1.unit27.lesson05.reading_appearance:
    title: Citește despre aspect
  prs.a1.unit27.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Înalt
    gloss: înalt
    note: قد بلند înseamnă literal „înălțime mare” -- قد (înălțime) + بلند (lung/înalt).
    example_gloss: El/ea este înalt(ă).
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Scund
    gloss: scund
    note: قد کوتاه înseamnă literal „înălțime mică” -- قد (înălțime, recapitulare) + کوتاه (scurt).
    example_gloss: El/ea este scund(ă).
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Părul
    gloss: păr
    note: مو înseamnă păr; موی este același cuvânt în forma de legătură, folosită înaintea altui cuvânt (de ex. موی سیاه, „păr negru”).
    example_gloss: Părul lui/ei este negru.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Ochi
    gloss: ochi
    note: چشم înseamnă ochi (se folosește la singular pentru a descrie culoarea ochilor, modelul firesc de zi cu zi).
    example_gloss: Ochii lui/ei sunt negri.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Barbă
    gloss: barbă
    note: ریش înseamnă barbă.
    example_gloss: El are barbă.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Ochelari
    gloss: ochelari
    note: عینک înseamnă ochelari.
    example_gloss: El/ea poartă ochelari.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Este / are (persoana a treia)
    gloss: este / are (persoana a 3-a)
    note: است (este) și دارد (are, persoana a 3-a) sunt recapitulare din lecțiile anterioare și sunt folosite în toată unitatea pentru a descrie aspectul cuiva.
    target_text: است (este) / دارد (are, persoana a 3-a)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Aspect / înfățișare
    gloss: aspect / înfățișare
    note: قیافه înseamnă înfățișarea sau aspectul unei persoane (de ex. خوش قیافه, „arătos”).
    example_gloss: Înfățișarea lui/ei este plăcută.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Cum
    gloss: cum
    note: چطور înseamnă „cum” (apărut mai devreme în curs, în saluturi precum چطور استین؟).
    target_text: چطور (cum)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Înfățișarea lui/ei
    gloss: înfățișarea lui/ei
    note: قیافه‌اش îmbină قیافه (aspect) cu sufixul posesiv ‌اش („lui/ei”).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Cum arată?
    gloss: Cum arată?
    note: قیافه‌اش چطور است؟ este modul firesc de a întreba cum arată cineva -- intenționat nu simplul چطور است؟, care singur se citește „Ce mai face?” (salutul despre sănătate).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: El/ea este înalt(ă)
    gloss: El/ea este înalt(ă).
    note: Îmbină او (el/ea, recapitulare) cu قد بلند است din această unitate.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: El/ea are păr negru
    gloss: El/ea are păr negru.
    note: Îmbină موی (păr) cu سیاه (negru) și دارد (are).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: El are barbă
    gloss: El are barbă.
    note: Folosește ریش دارد, același tipar cu „a avea” ca la părul negru de mai sus.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Culoare
    gloss: culoare
    note: رنگ înseamnă culoare (apărut mai devreme în curs, în Unitatea 21, la îmbrăcăminte).
    target_text: رنگ (culoare)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Albastră
    gloss: albastru
    note: آبی înseamnă albastru.
    example_gloss: Ochii lui/ei sunt albaștri.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Castaniu
    gloss: castaniu
    note: قهوه‌ای înseamnă castaniu/căprui (pentru culoarea părului sau a ochilor).
    example_gloss: Părul lui/ei este castaniu.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Culoarea ochilor
    gloss: culoarea ochilor
    note: رنگ چشم înseamnă literal „culoarea ochiului” -- رنگ (culoare) + چشم (ochi).
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Culoarea părului
    gloss: culoarea părului
    note: رنگ مو înseamnă literal „culoarea părului” -- رنگ (culoare) + مو (păr).
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Ochii lui/ei sunt albaștri
    gloss: Ochii lui/ei sunt albaștri.
    note: Aplică آبی din această lecție la چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Părul lui/ei este castaniu
    gloss: Părul lui/ei este castaniu.
    note: Aplică قهوه‌ای din această lecție la موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Frate / fratele tău
    gloss: frate / fratele tău (informal)
    note: برادر (frate) este recapitulare din Unitatea 3; برادرت adaugă sufixul posesiv informal ‌ت („tău”), în acord cu registrul informal تو folosit până acum.
    target_text: برادر (frate) / برادرت (fratele tău, informal)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Da / mulțumesc / de asemenea
    gloss: da / mulțumesc / și, de asemenea
    note: بلی (da), تشکر (mulțumesc) și هم (și, de asemenea) sunt recapitulare din lecțiile anterioare.
    target_text: بلی (da) / تشکر (mulțumesc) / هم (și, de asemenea)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, cum arată fratele tău?'
    gloss: 'Homayoun: Zarmina, cum arată fratele tău?'
    note: O întrebare informală între prieteni, cu sufixul posesiv -ت la برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Este înalt și are păr negru'
    gloss: 'Zarmina: Este înalt și are păr negru.'
    note: Îmbină două trăsături cu و („și”).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Are barbă?'
    gloss: 'Homayoun: Are barbă?'
    note: O întrebare cu da/nu formată doar prin intonația ascendentă la ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Da, are barbă și poartă și ochelari'
    gloss: 'Zarmina: Da, are barbă și poartă și ochelari.'
    note: Aplică هم („și, de asemenea”) la o a doua trăsătură.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bine, mulțumesc'
    gloss: 'Homayoun: Bine, mulțumesc.'
    note: خوب (bine) este un cuvânt nou, simplu, de încheiere; تشکر (mulțumesc) este recapitulare.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Citește despre aspect
    gloss: Karim este înalt. Are păr negru și ochi căprui. Nu are barbă, dar poartă ochelari.
    note: Un scurt text de citit care recapitulează cuvintele despre aspect din unitate; apare numele personajului کریم (Karim, același personaj din unitatea despre comparații) și ندارد („nu are”, forma negativă de persoana a 3-a a lui دارد).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Dar
    gloss: dar
    note: اما înseamnă „dar” (apărut mai devreme în această unitate, în textul din lecția 5; recapitulare și din unitățile anterioare).
    target_text: اما (dar)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Sunt / am
    gloss: sunt / am
    note: استم („sunt”) și دارم („am”) sunt recapitulare din lecțiile anterioare, folosite aici pentru o descriere de aspect la persoana întâi.
    target_text: استم (sunt) / دارم (am)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Sunt scund, dar am părul negru
    gloss: Sunt scund, dar am părul negru.
    note: Combină două trăsături de aspect cu ajutorul lui اما („dar”).
