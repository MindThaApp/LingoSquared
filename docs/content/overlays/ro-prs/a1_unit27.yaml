course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: vocabularul aspectului fizic (înalt, scund, păr, ochi, barbă, ochelari), cum întrebi cum arată cineva cu قیافه‌اش چطور است؟, culoarea părului și a ochilor (رنگ مو/رنگ چشم) și un dialog între Zarmina și Homayoun despre recunoașterea unei persoane după aspect.'
units:
  prs.a1.unit27.appearance:
    title: Aspectul fizic
    description: Descrie aspectul fizic de bază al unei persoane și întreabă cum arată cineva.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Cuvinte pentru aspect
  prs.a1.unit27.lesson02.appearance_question:
