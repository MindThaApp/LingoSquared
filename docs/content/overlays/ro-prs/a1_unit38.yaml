    title: 'Recapitulare: el/ea, cameră, masă, îi place'
    gloss: el/ea / cameră / masă / îi place
    note: او, اتاق și میز sunt cuvinte recapitulate; دوست دارد este forma de persoana a treia a verbului دوست داشتن (a-i plăcea), folosită mai devreme în curs pentru alte persoane.
    target_text: او (el/ea) / اتاق (cameră) / میز (masă) / دوست دارد (îi place)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: Citim despre casa Zarminei
    gloss: Aceasta este casa Zarminei. Casa ei este albă și albastră. Camera ei este verde. Masa ei este maro. Ei îi place culoarea verde.
