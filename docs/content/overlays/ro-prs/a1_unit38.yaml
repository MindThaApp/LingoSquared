    title: 'Recapitulare: îmi place, nu-mi place'
    gloss: îmi place / nu-mi place
    note: دوست دارم și دوست ندارم sunt formele recapitulate, afirmativă și negativă, ale verbului دوست داشتن (a-i plăcea), întâlnite prima dată în lesson03 și puse acum în contrast cu اما în această lecție de recapitulare.
    target_text: دوست دارم (îmi place) / دوست ندارم (nu-mi place)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: Îmi place roșul, dar nu-mi place negrul
    gloss: Îmi place culoarea roșie, dar nu-mi place culoarea neagră.
    note: اما pune în contrast faptul că îți place o culoare cu faptul că nu-ți place alta, folosind împreună دوست دارم și دوست ندارم.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: Ce culoare vă place?
    gloss: Ce culoare vă place?
    note: Adaugă شما (dumneavoastră, formal) la aceeași întrebare din lesson03/04, acum adresată direct cursantului.
