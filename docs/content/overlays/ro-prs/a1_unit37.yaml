course:
  title: Dari în română A1
  description: 'Dari kabuli pentru începători: numești trăsături de personalitate de bază, întrebi cum este cineva, dai motive simple cu „pentru că” și descrii caracterul unei persoane într-un text scurt.'
units:
  prs.a1.unit37.personality:
    title: Personalitatea
    description: Descrie trăsăturile de bază ale unei persoane și întreabă cum este cineva.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: Cuvinte despre personalitate
  prs.a1.unit37.lesson02.more_traits:
    title: Alte trăsături
  prs.a1.unit37.lesson03.asking_about_personality:
    title: Întrebări despre personalitate
  prs.a1.unit37.lesson04.personality_dialogue:
    title: Dialog despre personalitate
  prs.a1.unit37.lesson05.personality_reading:
    title: Citim despre personalitate
  prs.a1.unit37.lesson06.wrap_up:
    title: Recapitulare
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Amabil
    gloss: amabil
    note: مهربان este cuvântul dari standard pentru o persoană bună la suflet, caldă.
    example_gloss: El/Ea este bun/bună la suflet.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Harnic
    gloss: harnic
    note: زحمتکش înseamnă literal „cel care se ostenește, care depune efort” — o persoană muncitoare.
    example_gloss: Este muncitor/muncitoare.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Isteț
    gloss: isteț / inteligent
    note: باهوش îmbină با (cu) și هوش (inteligență) — o persoană isteață, deșteaptă.
    example_gloss: Este isteț/isteață.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Leneș
    gloss: leneș
    note: تنبل înseamnă leneș.
    example_gloss: Este leneș/leneșă.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Recapitulare: el/ea, este, și, dar'
    gloss: el/ea / este / și / dar
    note: او, است, و și اما sunt forme recapitulate, folosite în propozițiile despre personalitate din această unitate.
    target_text: او (el/ea) / است (este) / و (și) / اما (dar)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Este bun la suflet și muncitor
    gloss: Este bun/bună la suflet și muncitor/muncitoare.
    note: و leagă cele două trăsături într-o singură propoziție.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Este isteț, dar leneș
    gloss: Este isteț/isteață, dar leneș/leneșă.
    note: اما pune în contrast două trăsături într-o singură propoziție.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Amuzant
    gloss: glumeț / jucăuș
    note: شوخ descrie o persoană care face glume sau este jucăușă.
    example_gloss: Este glumeț/glumeață.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Tăcut
    gloss: tăcut / retras
    note: کم‌حرف înseamnă literal „puțin la vorbă” — o persoană tăcută, retrasă.
    example_gloss: Este tăcut/tăcută.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Sincer
    gloss: sincer
    note: راستگو îmbină راست (adevărat, drept) și گو (cel care vorbește) — o persoană care spune adevărul, sinceră.
    example_gloss: Este sincer/sinceră.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Recapitulare: și, dar'
    gloss: și / dar
    note: و și اما sunt cuvinte recapitulate, folosite pentru a combina sau a pune în contrast trăsături.
    target_text: و (și) / اما (dar)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Este glumeț și sincer
    gloss: Este glumeț/glumeață și sincer/sinceră.
    note: Combină două trăsături pozitive cu و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Este tăcut, dar bun la suflet
    gloss: Este tăcut/tăcută, dar bun/bună la suflet.
    note: اما pune în contrast o trăsătură retrasă cu una caldă.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Om
    gloss: om, persoană
    note: آدم este un cuvânt obișnuit, valabil pentru ambele genuri, pentru o persoană sau o ființă umană.
    example_gloss: Este un om bun.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Recapitulare: cum/ce fel de, pentru că, ajutor'
    gloss: cum, ce fel de / pentru că / ajutor
    note: چطور, چون și کمک sunt forme recapitulate, folosite pentru a întreba despre personalitate și a o explica.
    target_text: چطور (cum, ce fel de) / چون (pentru că) / کمک (ajutor)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Ce fel de om este?
    gloss: Ce fel de om este?
    note: او چطور آدم است؟ înseamnă literal „el/ea e ce fel de om?” — modul firesc de a întreba cum este cineva.
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Este bun la suflet, pentru că ajută
    gloss: Este bun/bună la suflet, pentru că ajută.
    note: چون introduce motivul; کمک می‌کند înseamnă literal „face ajutor”.
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Este muncitor, pentru că muncește mult
    gloss: Este muncitor/muncitoare, pentru că muncește mult.
    note: زیاد کار می‌کند înseamnă literal „face multă muncă”.
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Da / puțin / mereu
    gloss: da / puțin, un pic / mereu
    note: بلی, کمی și همیشه sunt cuvinte recapitulate, folosite în dialogul despre personalitate.
    target_text: بلی (da) / کمی (puțin) / همیشه (mereu)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ce fel de om este Karim?'
    gloss: Zarmina, ce fel de om este Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Karim este bun la suflet și muncitor.'
    gloss: Karim este bun la suflet și muncitor.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Este isteț?'
    gloss: Este isteț?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Da, este isteț, dar un pic tăcut.'
    gloss: Da, este isteț, dar un pic tăcut.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Este sincer?'
    gloss: Este sincer?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Da, este mereu sincer.'
    gloss: Da, este mereu sincer.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Uneori, toată lumea, marcă de obiect direct, le place
    gloss: uneori / toată lumea / marcator de complement direct / le place, îi iubesc
    note: گاهی (uneori) și همه (toată lumea) apar în text; را marchează complementul direct determinat; دوست دارند este forma de persoana a III-a plural a lui دوست دارم (îmi place).
    target_text: گاهی (uneori) / همه (toată lumea) / را (marcă a complementului direct) / دوست دارند (le place)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Text despre personalitatea lui Homayoun
    gloss: Homayoun este bun la suflet și muncitor. Este isteț, dar uneori tăcut. Este mereu sincer. Toată lumea îl iubește.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Recapitulare: eu sunt, tu ești (formal)'
    gloss: eu sunt / dumneavoastră sunteți
    note: استم și استین sunt formele recapitulate ale copulei pentru „eu sunt” și „dumneavoastră sunteți” (formal), folosite în propozițiile acestei lecții finale.
    target_text: استم (sunt) / استین (sunteți, formal)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Sunt bun la suflet, dar uneori leneș
    gloss: Sunt bun/bună la suflet, dar uneori leneș/leneșă.
    note: من (eu) și استم (eu sunt) îți permit să îți descrii direct propria personalitate, după același tipar او/است folosit în unitate.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Ce fel de om sunteți?
    gloss: Ce fel de om sunteți?
    note: Adaugă شما (dumneavoastră) și استین (sunteți) la aceeași formă de întrebare din lecția 3, acum adresată direct ție.
