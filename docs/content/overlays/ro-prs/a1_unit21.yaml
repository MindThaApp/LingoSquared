course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabularul hainelor, culori, mărimi, probarea unei haine, citirea unei etichete și un dialog complet într-un magazin pentru cumpărarea unei cămăși.'
units:
  prs.a1.unit21.clothing:
    title: Cumpărăm haine
    description: Recunoaște hainele uzuale și fă o achiziție simplă de îmbrăcăminte.
