  prs.a1.unit21.lesson05.clothing_shop_dialogue:
    title: Un dialog la magazinul de haine
  prs.a1.unit21.lesson06.wrap_up_reading:
    title: Lectură de încheiere
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: Haine
    gloss: haine
    note: لباس înseamnă haine (cuvântul general).
    example_gloss: Acestea sunt haine noi.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Cămașă
    gloss: cămașă
    note: پیراهن înseamnă cămașă.
    example_gloss: Această cămașă este frumoasă.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Pantaloni
    gloss: pantaloni
    note: پطلون înseamnă pantaloni -- cuvântul dari afgan autentic (un împrumut din engleză, prin „pantaloon”), diferit de شلوار din persana iraniană.
    example_gloss: Acești pantaloni sunt scumpi.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Pantofi
    gloss: pantofi
    note: کفش înseamnă pantofi.
    example_gloss: Acești pantofi sunt ieftini.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Este / sunt
    gloss: este
    note: است (este) -- îl cunoști deja din unitatea despre saluturi.
    example_gloss: Aceasta este o cămașă.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Scump
    gloss: scump
    note: گران (scump) -- îl cunoști deja din unitatea despre cumpărături.
    example_gloss: Acești pantaloni sunt scumpi.
  prs.a1.unit21.lesson02.teach.rang:
    title: Culoare
    gloss: culoare
    note: رنگ înseamnă culoare.
    example_gloss: Ce culoare are această cămașă?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Negru
    gloss: negru
    note: سیاه înseamnă negru.
    example_gloss: Acești pantaloni sunt negri.
  prs.a1.unit21.lesson02.teach.safid:
    title: Alb
    gloss: alb
    note: سفید înseamnă alb.
    example_gloss: Această cămașă este albă.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Roșu
    gloss: roșu
    note: سرخ înseamnă roșu -- forma dari / persana clasică, nu قرمز din limba colocvială iraniană.
    example_gloss: Acești pantofi sunt roșii.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Mărimea
    gloss: mărime
    note: اندازه înseamnă mărime (substantivul).
    example_gloss: Ce mărime ai?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: Ce mărime ai?
    gloss: Ce mărime ai?
    note: اندازه شما چند است؟ întreabă literal „mărimea dumneavoastră este cât?”
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: Aceasta este mărimea ta?
    gloss: Aceasta este mărimea ta?
    note: این اندازه شما است؟ folosește این (acesta), introdus aici.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Mare
    gloss: mare
    note: بزرگ (mare) -- îl cunoști deja din unitatea despre comparații.
    example_gloss: Această cămașă este mare.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Mic
    gloss: mic
    note: کوچک (mic) -- îl cunoști deja din unitatea despre comparații.
    example_gloss: Acești pantofi sunt mici.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: Pot să probez asta?
    gloss: Pot să probez asta?
    note: پرو کردن înseamnă „a proba” (haine), un împrumut din franceză comun dari și persanei iraniene. می‌توانم این را پرو کنم؟ înseamnă literal „pot asta proba-face?”
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Da, puteți proba
    gloss: Da, puteți proba.
    note: می‌توانین پرو کنین este forma politicoasă de persoana a II-a a aceluiași verb.
  prs.a1.unit21.lesson04.teach.label_text:
    title: O etichetă de haină
    gloss: 'Cămașă: mărime mare, culoare albă, 500 de afghani'
    note: O etichetă simplă care arată articolul, mărimea, culoarea și prețul.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Marca obiectului direct
    gloss: (marca obiectului direct)
    note: را marchează complementul direct -- îl cunoști deja din modelele de fraze ale unităților anterioare.
    example_gloss: Vreau această cămașă.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afgani
    gloss: afghani
    note: افغانی (afghani) -- moneda, pe care o cunoști deja din unitatea despre cumpărături.
    example_gloss: Aceasta costă 500 de afghani.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: Ce culoare are această cămașă?
    gloss: Ce culoare are această cămașă?
    note: این پیراهن چه رنگ دارد؟ folosește دارد (are), introdus aici.
  prs.a1.unit21.lesson05.teach.turn01:
    title: Vânzătorul salută
    gloss: Bună ziua, poftiți.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina întreabă
    gloss: Bună ziua. Ce culoare are această cămașă?
    note: زرمینه (Zarmina) este un personaj recurent în acest curs, prezentat prima dată în unitățile despre timp și rutina zilnică.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Vânzătorul răspunde
    gloss: Am negru și alb.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina alege
    gloss: Vreau cămașa albă. Mărimea este mare?
    note: اندازه‌اش (mărimea lui/ei) atașează sufixul posesiv la اندازه.
  prs.a1.unit21.lesson05.teach.turn05:
    title: Vânzătorul confirmă
    gloss: Da, este mare. Poți s-o probezi.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina probează
    gloss: Mulțumesc. Aceasta este mărimea mea. Cât costă?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Vânzătorul spune prețul
    gloss: Costă 500 de afghani.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina este de acord
    gloss: Foarte bine, o cumpăr.
    note: می‌خرم este persoana I singular a prezentului verbului خریدن (a cumpăra).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Vânzătorul
    gloss: vânzător
    note: دوکاندار (vânzător, negustor) -- cuvânt deja cunoscut din lecția despre cumpărături.
    example_gloss: Vânzătorul vinde cămăși.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Foarte bine
    gloss: foarte bine
    note: بسیار خوب (foarte bine) -- expresie deja cunoscută din lecția despre cumpărături.
    example_gloss: Foarte bine, mulțumesc.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Ce
    gloss: ce
    note: چه (ce) -- cuvânt deja cunoscut, întâlnit în tiparele de întrebări din lecțiile anterioare.
    example_gloss: Ce culoare are aceasta?
  prs.a1.unit21.lesson06.teach.review_va:
    title: Și
    gloss: și
    note: و (și) -- cuvânt deja cunoscut din lecția despre cumpărături.
    example_gloss: Cumpăr o cămașă și pantaloni.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Unu
    gloss: unu
    note: یک (unu) -- cuvânt deja cunoscut din lecția despre numere.
    example_gloss: Cumpăr o cămașă.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: La
    gloss: la, spre
    note: به (la, spre) -- cuvânt deja cunoscut din lecțiile despre direcții și rutina zilnică.
    example_gloss: Merg la magazin.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Magazin
    gloss: magazin
    note: دوکان (magazin) -- cuvânt deja cunoscut din lecția despre cumpărături.
    example_gloss: Acest magazin este mare.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: A mers
    gloss: a mers
    note: رفت (a mers, persoana a III-a) -- cuvânt deja cunoscut din lecția despre evenimente trecute.
    example_gloss: Zarmina a mers la magazin.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Prețul lui/ei
    gloss: prețul lui/ei
    note: قیمتش (prețul lui/ei) -- cuvânt deja cunoscut din lecția despre cumpărături.
    example_gloss: Prețul era de 500 de afghani.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Rezumatul unei cumpărături
    gloss: Zarmina a mers la magazin. A cumpărat o cămașă albă și mare. A costat 500 de afghani.
    note: خرید (a cumpărat) și بود (a fost) sunt ambele forme de trecut simplu, deja cunoscute din lecția despre evenimente trecute.
