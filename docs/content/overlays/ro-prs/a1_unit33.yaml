    note: تو, می‌کنی, هم, تشکر și زیاد sunt toate recapitulare, reunite aici pentru registrul informal al dialogului.
    target_text: تو (tu, informal) / می‌کنی (faci, informal) / هم (și, de asemenea) / تشکر (mulțumesc) / زیاد (mult)
