course:
  title: Dari în română A1
  description: 'Dari de Kabul pentru începători: vocabularul treburilor casnice (treburi casnice, mătură, vase, curat, a ajuta), cum spui ce trebuie făcut azi cu باید, cum ceri ajutor la o treabă și un dialog între Wahid și Shukria despre împărțirea treburilor casnice.'
units:
  prs.a1.unit33.household:
    title: Treburile casnice
    description: 'Vorbește despre treburile casnice: spune ce trebuie făcut, cine le face și cere ajutor pentru una dintre ele.'
