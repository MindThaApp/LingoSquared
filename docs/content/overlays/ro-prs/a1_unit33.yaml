teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Treburi casnice
    gloss: treburi casnice
    note: کار خانه înseamnă treburi casnice și este expresia-temă a acestei unități.
    example_gloss: Sunt multe treburi prin casă.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Mătura
    gloss: mătură
    note: جاروب înseamnă mătură și este cuvântul folosit pe scară largă în dari în Afganistan.
    example_gloss: Unde este mătura?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Vasele
    gloss: vase
    note: ظرف înseamnă vase; este un cuvânt standard, comun persanei și dari.
    example_gloss: Vasele sunt în bucătărie.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Curat
    gloss: curat
    note: پاک înseamnă curat și descrie o cameră sau un obiect.
    example_gloss: Camera este curată.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: A spăla / a face
    gloss: a spăla / a face — spăl / fac
    note: شستن (a spăla) este un verb cu adevărat nou; کردن (a face) și می‌کنم (fac) sunt recapitulare din unitățile anterioare.
    target_text: شستن (a spăla) / کردن (a face) — می‌شویم (spăl) / می‌کنم (fac)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Mătur
    gloss: Mătur.
    note: Îmbină جاروب (mătură) cu می‌کنم (fac, recapitulare) — literal „fac mătură”.
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Spăl vasele
    gloss: Spăl vasele.
    note: Îmbină ظرف (vase) cu می‌شویم (spăl), forma pentru persoana I a verbului شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Azi / ce / da
    gloss: azi / ce / da
    note: امروز, چه și بلی sunt toate recapitulare din unitățile anterioare.
    target_text: امروز (azi) / چه (ce) / بلی (da)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Trebuie / e nevoie să
    gloss: trebuie
    note: باید este un cuvânt modal cu adevărat nou, folosit aici pentru a spune că o treabă trebuie făcută.
    target_text: باید (trebuie)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Să fac
    gloss: să fac
    note: کنم este forma simplă de conjunctiv folosită după باید cu verbe formate cu کردن (fără prefixul می‌).
    target_text: کنم (să fac — se folosește după باید cu verbe formate cu کردن, fără prefixul می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Azi trebuie să mătur
    gloss: Azi trebuie să mătur.
    note: Îmbină امروز (azi, recapitulare) cu باید جاروب کنم (trebuie să mătur).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Trebuie să fac curat
    gloss: Trebuie să fac curat.
    note: Îmbină باید (trebuie, recapitulare) cu پاک کنم (să fac curat).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: Ce trebuie să fac?
    gloss: Ce trebuie să fac?
    note: Combină چه کار (ce treabă/ce lucru) cu باید کنم (trebuie să fac).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Da, trebuie să mătur
    gloss: Da, trebuie să mătur.
    note: Combină بلی (da, recapitulare) cu باید جاروب کنم (trebuie să mătur).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Ajutor
    gloss: ajutor
    note: کمک înseamnă ajutor, un cuvânt nou în acest curs.
    example_gloss: Vreau ajutor.
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: Vă rog / a face / eu / faceți! (formal)
    gloss: te rog / a face / eu / faceți! (formal)
    note: لطفاً, کردن, من și کنین (imperativul de politețe, din aceeași familie de terminații formale în -ین) sunt toate recapitulare din unitățile anterioare.
    target_text: لطفاً (te rog) / کردن (a face) / من (eu) / کنین (faceți! formal)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
