    title: 'Shukria: Da, fac curat în cameră.'
    gloss: Da, fac curat în cameră.
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid: Mulțumesc mult!'
    gloss: Mulțumesc mult!
