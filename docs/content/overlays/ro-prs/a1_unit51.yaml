teaching:
  prs.a1.unit51.lesson01.teach.review_this_is_in_good:
    title: 'Recapitulare: acesta, este, în, bun'
    gloss: acesta / este / în / bun
    note: Sunt cuvinte de recapitulare (folosite în tot cursul) pentru a vorbi despre restaurant.
    target_text: این (acesta/aceasta) / است (este) / در (în) / خوب (bun)
  prs.a1.unit51.lesson01.teach.restaurant_word:
    title: Restaurant
    gloss: restaurant
    note: Acesta este cuvântul dari pentru restaurant (în dari afgan se folosește forma mai lungă, terminată în ت).
    example_gloss: Restaurantul este bun.
  prs.a1.unit51.lesson01.teach.waiter_word:
    title: Chelner
    gloss: chelner
    note: Acesta este cuvântul dari pentru chelnerul dintr-un restaurant.
    example_gloss: Chelnerul este bun.
  prs.a1.unit51.lesson01.teach.this_is_restaurant_phrase:
    title: Acesta este un restaurant
    gloss: Acesta este un restaurant.
    note: Îmbină cuvintele acesta, este și restaurant, la fel cum le-ai legat deja în alte lecții ale cursului.
  prs.a1.unit51.lesson01.teach.waiter_at_restaurant_phrase:
    title: Chelnerul este la restaurant
    gloss: Chelnerul este la restaurant.
    note: Îmbină cuvintele chelner, în și restaurant.
  prs.a1.unit51.lesson02.teach.review_price_words:
    title: 'Recapitulare: cât, afgani, este, sută, cincizeci, douăzeci, și, în, delicios, ceai'
    gloss: cât / afgani / este / sută / cincizeci / douăzeci / și / în / delicios / ceai
    note: Sunt cuvinte de recapitulare (din unitățile anterioare) folosite pentru a citi meniul și a întreba un preț.
    target_text: چند (cât) / افغانی (afgani) / است (este) / صد (o sută) / پنجاه (cincizeci) / بیست (douăzeci) / و (și) / در (în) / خوش‌مزه (gustos) / چای (ceai)
  prs.a1.unit51.lesson02.teach.menu_word:
    title: Meniu
    gloss: meniu
    note: Acesta este cuvântul dari pentru meniu, împrumutat din engleză.
    example_gloss: Acesta este meniul.
  prs.a1.unit51.lesson02.teach.kabab_word:
    title: Kebab
    gloss: kebab
    note: Acesta este cuvântul dari pentru kebab, un preparat afgan popular din carne la grătar.
    example_gloss: Kebabul este delicios.
