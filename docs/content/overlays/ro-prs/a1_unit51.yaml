    target_text: قیمتش (its price)
  prs.a1.unit51.lesson02.teach.ask_kabab_price_phrase:
    title: Cât costă kebabul?
    gloss: Cât costă kebabul?
    note: Îmbină cuvintele învățate mai devreme în această lecție.
  prs.a1.unit51.lesson02.teach.kabab_price_answer_phrase:
    title: Prețul lui este 150 de afgani
    gloss: Prețul lui este 150 de afgani.
    note: Aceasta spune prețul kebabului din meniu.
