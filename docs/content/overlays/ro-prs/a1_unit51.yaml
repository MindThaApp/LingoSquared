    title: 'Homayoun: Mulțumesc mult.'
    gloss: Mulțumesc mult.
  prs.a1.unit51.lesson04.teach.dialogue_line6:
    title: 'Ospătarul: Cu plăcere.'
    gloss: Cu plăcere.
