course:
  title: Dari în română A1
  description: 'Dari afgan pentru începători: denumirea locurilor obișnuite din oraș, întrebarea unde se află ceva, răspunsuri simple despre locație și urmarea unor indicații de bază către un loc.'
units:
  prs.a1.unit05.places:
    title: Locuri importante din oraș
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: Locuri obișnuite din oraș
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: Locuri publice și de călătorie
  prs.a1.unit05.lesson03.asking_where:
    title: Întreabă unde se află ceva
  prs.a1.unit05.lesson04.simple_location_answers:
    title: Aproape, departe, aici și acolo
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: Prepoziții de loc
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: Găsește farmacia în cartier
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Piață
    gloss: piață / bazar
    note: بازار este cuvântul obișnuit pentru o zonă de piață, adesea o stradă sau un cartier întreg de magazine.
    example_gloss: Bazarul este aproape.
  prs.a1.unit05.lesson01.teach.bank:
    title: Bancă
    gloss: bancă
    note: 'بانک este un împrumut direct din limbile europene, folosit la fel ca în română: „bancă”.'
    example_gloss: Unde este banca?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Moschee
    gloss: moschee
    note: مسجد este cuvântul standard pentru moschee.
    example_gloss: Moscheea este mare.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Spital
    gloss: spital
    note: شفاخانه este cuvântul obișnuit în dari afgan pentru spital -- diferit de بیمارستان din persana iraniană, pe care vorbitorii de dari îl pot înțelege, dar nu îl folosesc în mod normal.
    example_gloss: Spitalul este departe.
  prs.a1.unit05.lesson01.teach.school:
    title: Școala
    gloss: școală
    note: مکتب este cuvântul obișnuit în dari afgan pentru școală -- diferit de مدرسه din persana iraniană, care în dari înseamnă de obicei în mod special o școală religioasă.
    example_gloss: Școala este lângă casă.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Farmacie
    gloss: farmacie
    note: دواخانه este cuvântul obișnuit în dari afgan pentru farmacie (de la دوا, medicament) -- diferit de داروخانه din persana iraniană.
    example_gloss: Unde este farmacia?
  prs.a1.unit05.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul obișnuit de legătură, folosit pentru a uni o listă de locuri.
    target_text: و (și)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Oficiu poștal
    gloss: oficiu poștal
    note: پوسته خانه îmbină پوسته (poștă) cu خانه (casă/clădire).
    example_gloss: Oficiul poștal este închis.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Ambasadă
    gloss: ambasadă
    note: سفارت este cuvântul standard pentru ambasadă.
    example_gloss: Ambasada este în Kabul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Aeroport
    gloss: aeroport
    note: میدان هوایی este termenul obișnuit în dari afgan pentru aeroport (literal „câmp aerian”) -- diferit de فرودگاه din persana iraniană.
    example_gloss: Aeroportul este departe.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Birou (recapitulare)
    gloss: birou
    note: دفتر a fost introdus într-o unitate anterioară; apare aici alături de celelalte locuri publice.
    example_gloss: Biroul meu este aproape.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Întreabă unde este piața
    gloss: Unde este piața?
    note: بازار کجاست؟ este tiparul de bază pentru a întreba unde se află un loc.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Întreabă unde este spitalul
    gloss: Unde este spitalul?
    note: Același tipar cu کجاست se aplică oricărui substantiv de loc.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Atrage politicos atenția cuiva
    gloss: Scuzați-mă, unde este farmacia?
    note: ببخشین deschide politicos o întrebare adresată unui necunoscut, la fel ca „Scuzați-mă” în română.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Cum se formează کجاست
    gloss: کجاست este کجا (unde) plus است (este), contrase împreună.
    note: Dacă recunoști această structură, vezi tiparul în loc să memorezi کجاست ca pe un bloc unic, neanalizat.
  prs.a1.unit05.lesson04.teach.near:
    title: Aproape
    gloss: lângă
    note: نزدیک descrie ceva aflat aproape.
    example_gloss: Banca este aproape.
  prs.a1.unit05.lesson04.teach.far:
    title: Departe
    gloss: departe
    note: دور descrie ceva aflat la distanță.
    example_gloss: Spitalul este departe.
  prs.a1.unit05.lesson04.teach.here:
    title: Aici
    gloss: aici
    note: این‌جا indică locul în care se află vorbitorul.
    example_gloss: Banca este aici.
  prs.a1.unit05.lesson04.teach.there:
    title: Acolo
    gloss: acolo
    note: آن‌جا indică un loc aflat departe de vorbitor.
    example_gloss: Farmacia este acolo.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Spune că piața este aproape
    gloss: Piața este aproape.
    note: بازار نزدیک است folosește același verb copulativ است întâlnit în tot cursul.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Spune că aeroportul este departe
    gloss: Aeroportul este departe.
    note: میدان هوایی دور است urmează același tipar, cu دور în loc de نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Lângă
    gloss: lângă
    note: در کنار înseamnă literal „la marginea / în partea lui”.
  prs.a1.unit05.lesson05.teach.behind:
    title: În spatele
    gloss: în spatele
    note: پشت arată că ceva se află în spatele unui alt loc.
    example_gloss: Farmacia este în spatele școlii.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Vizavi / în față
    gloss: vizavi de / în fața
    note: مقابل arată că ceva se află chiar vizavi de un alt loc.
    example_gloss: Banca este vizavi de moschee.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Locul spitalului față de moschee
    gloss: Spitalul este lângă moschee.
    note: شفاخانه در کنار مسجد است îmbină un loc, prepoziția در کنار și copula است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Mulțumesc mult
    gloss: Mulțumesc mult.
    note: تشکر زیاد întărește تشکر, pe care l-ai învățat deja.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina întreabă de farmacie
    gloss: Zarmina întreabă politicos un trecător unde este farmacia.
    note: ببخشین deschide întrebarea cu respect, potrivit pentru un necunoscut.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Trecătorul explică drumul
    gloss: Trecătorul spune că farmacia nu este departe, că trebuie să mergi drept și că este lângă școală.
    note: 'Aici se îmbină mai multe tipare din această unitate: دور نیست (دور la negativ), مستقیم بروین și در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina îi mulțumește trecătorului
    gloss: Zarmina îi mulțumește mult.
    note: تشکر زیاد încheie politicos schimbul de replici.
  prs.a1.unit05.lesson06.teach.turn04:
    title: Răspunsul modest al trecătorului
    gloss: Cu plăcere / nu e nimic.
    note: قابلی نداره este o formă obișnuită și modestă de a răspunde la mulțumiri în dari afgan, asemănătoare ca funcție cu خواهش می‌کنم, dar mai familiară. نداره este forma vorbită a lui ندارد; în vorbire auzi نداره, iar în scrisul îngrijit se folosește ندارد.
