course:
  title: Dari în română A1
  description: 'Dari afgană pentru începători: vocabular despre magazin și prețuri, cum ceri politicos un preț, cum citești o etichetă de preț, cum ceri o cantitate, cum negociezi o reducere și o conversație completă la piață.'
units:
  prs.a1.unit10.shopping:
    title: Cumpărături și prețuri
