  prs.a1.unit10.lesson04.asking_for_a_quantity:
    title: Cererea unei cantități
  prs.a1.unit10.lesson05.bargaining_for_a_discount:
    title: Negocierea unei reduceri
  prs.a1.unit10.lesson06.market_dialogue:
    title: O conversație completă la piață
teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Magazin
    gloss: magazin
    note: دوکان este cuvântul autentic din dari afgană pentru un mic magazin local, diferit de مغازه din persana iraniană.
    example_gloss: Acest magazin este mare.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Preț
    gloss: preț
    note: قیمت înseamnă preț.
    example_gloss: Cât costă acesta?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Ieftin
    gloss: ieftin
    note: ارزان înseamnă ieftin sau necostisitor.
    example_gloss: Acesta este ieftin.
  prs.a1.unit10.lesson01.teach.gran:
    title: Scump
    gloss: scump
    note: گران este opusul lui ارزان.
    example_gloss: Acesta este scump.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Reducere
    gloss: reducere
    note: تخفیف înseamnă o reducere de preț.
    example_gloss: Aveți reducere?
  prs.a1.unit10.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul obișnuit de legătură, folosit pentru a uni două afirmații sau cereri scurte.
    example_gloss: Cumpăr mere și pâine.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Cât costă?
    gloss: Cât face?
    note: قیمتش چند است؟ înseamnă literal „prețul lui, cât este?”
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: Costă o sută de afghani.
    gloss: Costă o sută de afghani.
    note: صد افغانی است indică un preț folosind افغانی, moneda Afganistanului.
  prs.a1.unit10.lesson03.teach.sib:
    title: Măr / mere
    gloss: măr / mere
    note: سیب înseamnă „măr”; aici este folosit la plural/generic, pentru o cantitate de mere puse la vânzare.
    example_gloss: Vreau un kilogram de mere.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Kilogram
    gloss: kilogram
    note: کیلو este unitatea standard pentru vânzarea produselor la kilogram.
    example_gloss: Vreau un kilogram de mere.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Mere: un kilogram, o sută de afghani'
    gloss: 'Mere: un kilogram, o sută de afghani'
    note: 'سیب: یک کیلو صد افغانی este o etichetă de preț obișnuită la piață.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Aș dori un kilogram de mere.
    gloss: Aș dori un kilogram de mere.
    note: یک کیلو سیب می‌خواهم folosește același tipar یک [produs] می‌خواهم, învățat la comandarea mâncării în Unitatea 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Aș dori două kilograme.
    gloss: Aș dori două kilograme.
    note: دو کیلو می‌خواهم înlocuiește cu دو (doi/două) pentru o cantitate mai mare.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Puteți face o reducere?
    gloss: Puteți face o reducere?
    note: تخفیف می‌توانین بدهین؟ cere politicos un preț mai mic, folosind می‌توانین (puteți).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Pentru dumneavoastră face 180 de afghani.
    gloss: Pentru dumneavoastră face 180 de afghani.
    note: 'برای شما صد و هشتاد افغانی می‌شه oferă un total redus: 20 de afghani mai puțin decât cei 200 pentru două kilograme a câte 100.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Poftiți
    gloss: poftiți
    note: بفرمایین este un salut/invitație politicoasă și primitoare, folosită de vânzător când sosește un client.
    example_gloss: Poftiți, acesta este prețul.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Bună ziua, poftiți.
    gloss: Bună ziua, poftiți.
    note: Vânzătorul îl întâmpină cu căldură pe client.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Bună ziua. Cât costă merele?
    gloss: Bună ziua. Cât costă merele?
    note: Clientul întreabă prețul merelor.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Un kilogram costă o sută de afghani.
    gloss: Un kilogram costă o sută de afghani.
    note: Vânzătorul spune prețul pe kilogram.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Aș dori două kilograme. Puteți face o reducere?
    gloss: Aș dori două kilograme. Puteți face o reducere?
    note: Clientul spune cantitatea și cere o reducere.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Da, pentru dumneavoastră două kilograme fac 180 de afghani.
    gloss: Da, pentru dumneavoastră două kilograme fac 180 de afghani.
    note: Vânzătorul acceptă și dă totalul redus, în acord cu prețul de 100 de afghani pe kilogram spus în replica anterioară (200 minus o reducere de 20 de afghani).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Foarte bine, mulțumesc.
    gloss: Foarte bine, mulțumesc.
    note: Clientul acceptă prețul și îi mulțumește vânzătorului.
