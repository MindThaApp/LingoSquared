course:
  title: Dari în română A1
  description: 'Dari afgan pentru începători: vocabular despre mâncare și băuturi, comanda politicoasă, întrebarea despre ce este disponibil, cantități și eticheta la restaurant, inclusiv cererea notei de plată.'
units:
  prs.a1.unit08.food:
    title: Mâncarea și comandarea unei mese
lessons:
  prs.a1.unit08.lesson01.food_and_drink_vocabulary:
    title: Mâncare și băutură
  prs.a1.unit08.lesson02.polite_ordering:
    title: Comandă politicos
  prs.a1.unit08.lesson03.asking_whats_available:
    title: Întreabă ce există
  prs.a1.unit08.lesson04.quantities:
    title: Comandă cantități precise
  prs.a1.unit08.lesson05.restaurant_etiquette_and_bill:
    title: Eticheta la restaurant și nota de plată
  prs.a1.unit08.lesson06.restaurant_dialogue:
    title: O conversație completă la ceainărie
teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Pâine
    gloss: pâine
    note: نان este o pâine de bază la fiecare masă afgană.
    example_gloss: Pâinea este proaspătă.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Pilaf de orez
    gloss: pilaf de orez
    note: پلو este pilafde orez afgan, condimentat în mod specific și adesea gătit cu carne, morcovi sau stafide, nu doar orez simplu.
    example_gloss: Pilaful de orez este delicios.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Tocană de carne cu legume
    gloss: tocană de carne cu legume
    note: قورمه este denumirea generală pentru o tocană gătită de carne cu legume, servită de obicei peste پلو.
    example_gloss: Mănânc tocana cu pilaf de orez.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Ceai (recapitulare)
    gloss: ceai
    note: چای este băutura oferită aproape oriunde în Afganistan.
    example_gloss: Un ceai, vă rog.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Apa
    gloss: apă
    note: آب este cuvântul obișnuit pentru apă.
    example_gloss: O apă, vă rog.
  prs.a1.unit08.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul de legătură obișnuit pentru a uni o listă de mâncăruri.
    target_text: و (și)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Comandă un ceai politicos
    gloss: Aș dori un ceai.
    note: یک چای می‌خواهم este o formulă neutră și politicoasă de a comanda, folosind direct می‌خواهم (vreau), nu o construcție mai indirectă.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Vă rog
    gloss: vă rog
    note: لطفاً poate fi adăugat pentru a îmblânzi aproape orice cerere.
    example_gloss: Vă rog, ajutați-mă.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Comandă pâine politicos
    gloss: Aș dori o pâine.
    note: Același tipar یک [produs] می‌خواهم se aplică oricărui substantiv de mâncare sau băutură.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Întreabă ce există
    gloss: Ce aveți?
    note: چی دارین؟ este felul firesc de a întreba un vânzător sau un ospătar ce mâncare are.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Răspunde ce este disponibil
    gloss: Avem pilaf de orez și tocană.
    note: پلو و قورمه داریم folosește داریم (avem), forma de persoana I plural a lui دارم. Vânzătorul spune „noi” când vorbește în numele întregului magazin.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Proaspăt
    gloss: proaspăt
    note: تازه descrie mâncarea proaspăt pregătită.
    example_gloss: Această pâine este proaspătă.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: O farfurie de pilaf de orez
    gloss: o farfurie de pilaf de orez
    note: بشقاب (farfurie) este cuvântul de numărare pentru mâncarea servită în farfurie.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Două pâini
    gloss: două pâini
    note: تا este cuvântul general de numărare, pus după un număr, pentru majoritatea lucrurilor numărabile; aici, două bucăți de pâine.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Combină o comandă completă
    gloss: O farfurie de pilaf de orez și două pâini, vă rog.
    note: Mai multe expresii de cantitate pot fi unite cu و (și) într-o singură comandă.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: Nota de plată
    gloss: nota de plată
    note: بل (din engleză „bill”) este cuvântul afgan obișnuit pentru nota de plată la restaurant.
    example_gloss: Nota de plată, vă rog.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Întreabă cât face nota de plată
    gloss: Cât face nota?
    note: بل چند می‌شه؟ întreabă literal „nota devine cât”, felul firesc de a cere totalul. می‌شه este forma vorbită a lui می‌شود; o vei auzi într-un magazin, în timp ce în scris se folosește می‌شود.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Spune că mâncarea a fost delicioasă
    gloss: A fost foarte bun.
    note: خیلی خوش‌مزه بود este un compliment firesc după masă.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Ceainărie
    gloss: ceainărie / local simplu
    note: چایخانه este un tip obișnuit de local simplu în Afganistan, mai ales în Kabul, unde se servesc ceai și mâncăruri simple.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Bun venit (recapitulare)
    gloss: bun venit
    note: خوش آمدین a fost introdus în unitatea despre saluturi; aici este folosit ca salut al vânzătorului.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Vânzătorul își întâmpină clientul
    gloss: Vânzătorul îl întâmpină pe client și îl întreabă ce dorește.
    note: چی میل دارین؟ este o întrebare politicoasă de început, asemănătoare ca funcție cu چی دارین؟, dar pornind de la preferința clientului.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Clientul întreabă ce este disponibil
    gloss: Clientul îl salută pe vânzător și întreabă ce are.
    note: چی دارین؟ deschide schimbul de replici al comenzii, din lecția 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Vânzătorul enumeră ce are
    gloss: Vânzătorul spune că are pilaf de orez și tocană, ambele proaspete.
    note: هردو (ambele) confirmă prospețimea ambelor feluri menționate.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Clientul face o comandă completă
    gloss: Clientul acceptă și comandă o farfurie de pilaf de orez cu tocană, plus un ceai.
    note: Aici se îmbină tiparul de cantitate din lecția 4 cu vocabularul mâncărurilor din lecția 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Vânzătorul confirmă comanda
    gloss: Vânzătorul spune că aduce imediat.
    note: چشم, literal „pe ochii mei”, este o formulă respectuoasă pentru „desigur”. می‌آرم este forma vorbită a lui می‌آورم (aduc), iar همین حالا înseamnă „chiar acum”.
  prs.a1.unit08.lesson06.teach.turn06:
    title: Clientul laudă mâncarea și cere nota
    gloss: Clientul spune că a fost delicios și cere nota.
    note: Ambele expresii reiau direct vocabularul din lecția 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Vânzătorul spune totalul
    gloss: Vânzătorul mulțumește și spune că face două sute de afgani.
    note: افغانی este moneda Afganistanului; دوصد (două sute) se îmbină cu numele monedei pentru a spune un preț.
