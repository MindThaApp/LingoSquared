course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر دستور زبان برای صحبت دربارهٔ توانایی و امکان.
  learning_goal: با استفاده از kunnen، زنجیرهٔ فعل‌های کمکی و misschien بگویین که چه کاری کرده می‌توانین یا نمی‌توانید و چه چیزی ممکن است اتفاق بیفتد.
units:
  nl.a2.unit88.wat_kan_ik:
    title: من چه کاری کرده می‌توانم؟
    description: بگویین چه کاری کرده می‌توانین و چه کاری نمی‌توانید، فعل‌های کمکی را باهم ترکیب کنید و دربارهٔ چیزهایی که ممکن است اتفاق بیفتد صحبت کنید.
lessons:
  nl.a2.unit88.lesson01.dit_kan_ik:
    title: من این کارها را کرده می‌توانم
  nl.a2.unit88.lesson02.kun_je_dat:
    title: آیا این کار را کرده می‌توانی؟
  nl.a2.unit88.lesson03.kunnen_willen_moeten:
    title: توانستن، خواستن، باید
  nl.a2.unit88.lesson04.twee_werkwoorden:
    title: دو فعل پشت سر هم
  nl.a2.unit88.lesson05.misschien_kan_het:
    title: شاید ممکن باشد
  nl.a2.unit88.lesson06.lotte_en_omar:
    title: لوته و عمر یک برنامه می‌سازند
teaching:
  nl.a2.unit88.lesson01.teach.vaardigheden:
    title: مهارت‌ها
    gloss: آشپزی کردن / شنا کردن / بایسکل راندن / نقاشی کردن / آواز خواندن / گیتار زدن
    note: این مصدرها کارهایی را نام می‌برند که کرده می‌توانین. همه به -en ختم می‌شوند.
    example_gloss:
    - عمر خوب آشپزی کرده می‌تواند.
    - لوته بایسکل رانده می‌تواند.
    - نور آواز خوانده می‌تواند.
  nl.a2.unit88.lesson01.teach.kleine_woorden:
    title: کلمه‌های کوچک
    gloss: من / تو / تو / او (مرد) / او (زن) / ما / شما / هم / نه / خوب / خیلی / کمی
    note: این کلمه‌های کوچک در هر درس تکرار می‌شوند. *Jij* و *je* هر دو به معنی «تو» استند؛ *je* شکل بدون تکیه است.
    example_gloss:
    - من آواز خوانده نمی‌توانم.
    - تو خیلی خوب بایسکل رانده می‌توانی.
    - ما هم آشپزی کرده می‌توانیم.
    - او کمی نقاشی کرده می‌تواند.
  nl.a2.unit88.lesson01.teach.vrienden:
    title: سه دوست
    gloss: لوته / عمر / نور
    note: دوستان این کورس در سراسر این بخش ظاهر می‌شوند.
    example_gloss:
    - لوته، عمر و نور دوست استند.
  nl.a2.unit88.lesson01.teach.gn_kunnen:
    title: 'Kunnen: زمان حال'
    gloss: من کرده می‌توانم، تو کرده می‌توانی، او (مرد) کرده می‌تواند، او (زن) کرده می‌تواند، ما کرده می‌توانیم، شما کرده می‌توانین، آنها کرده می‌توانند
    note: '*Kunnen* (توانستن) فعل بی‌قاعده است. در مفرد *ik kan*، *jij kunt*، *hij/zij kan* می‌شود؛ در جمع همیشه *kunnen* است. در گفتار روزمره *jij kan* هم رایج است. در جملهٔ پرسشی که جای فاعل و فعل عوض می‌شود، -t می‌افتد: *kun je?*'
  nl.a2.unit88.lesson01.teach.gn_infinitief:
    title: فعل دوم مصدر است و در آخر جمله می‌آید
    gloss: من آشپزی کرده می‌توانم. من خوب آشپزی کرده می‌توانم. من شنا کرده نمی‌توانم.
    note: بعد از *kunnen*، فعل دوم مصدر است و به آخر جمله می‌رود. کلماتی مثل *goed* و *niet* پیش از آن می‌آیند.
  nl.a2.unit88.lesson01.teach.zinnen:
    title: سه جمله
    gloss: عمر خوب آشپزی کرده می‌تواند. من کمی گیتار زده می‌توانم. ما آواز خوانده نمی‌توانیم.
  nl.a2.unit88.lesson02.teach.meer_vaardigheden:
    title: زبان‌ها و تکنالوژی
    gloss: انگلیسی صحبت کردن / تایپ کردن / کمپیوتر را تعمیر کردن
    note: چند کار دیگر که کرده می‌توانین یا نمی‌توانید. *Snel* به معنی «تیز، سریع» است.
    example_gloss:
    - آیا انگلیسی صحبت کرده می‌توانی؟
    - آیا تیز تایپ کرده می‌توانی؟
    - من کمپیوتر را تعمیر کرده می‌توانم.
  nl.a2.unit88.lesson02.teach.scheidbaar:
    title: فعل‌های جداشدنی مفید
    gloss: گرفته آوردن / دوباره زنگ زدن / با خود آوردن
    note: این فعل‌ها پیشوند جداشدنی دارند (*op-، terug-، mee-*). *Me* یعنی «مرا» و *je* هم می‌تواند به معنی «تو را» باشد.
    example_gloss:
    - من تو را گرفته آورده می‌توانم.
    - آیا دوباره به من زنگ زده می‌توانی؟
    - لوته گیتار را با خود آورده می‌تواند.
  nl.a2.unit88.lesson02.teach.antwoorden:
    title: جواب‌های کوتاه
    gloss: بلی، ممکن است. نه، من این کار را کرده نمی‌توانم. بلی، من این کار را کرده می‌توانم.
    note: 'کلمهٔ *wel* تأکید می‌کند که کاری ممکن است: *Dat kan ik wel.*'
  nl.a2.unit88.lesson02.teach.gn_vraag:
    title: سوال‌ها با kunnen
    gloss: آیا آشپزی کرده می‌توانی؟ آیا تو آشپزی کرده می‌توانی؟ آیا شما آشپزی کرده می‌توانین؟
    note: 'در سوالی که جواب آن بلی یا نخیر است، فعل در اول جمله می‌آید. با *je/jij* فعل *kun* است (بدون -t): *Kun je koken?* در گفتار عادی *Kan je koken?* هم زیاد استفاده می‌شود.'
  nl.a2.unit88.lesson02.teach.gn_scheidbaar:
    title: فعل کمکی با فعل جداشدنی
    gloss: من می‌توانم تو را بیاورم. آیا می‌توانی دوباره به من زنگ بزنی؟
    note: 'با فعل کمکی، فعل جداشدنی جدا نمی‌شود: به شکل مصدر در آخر جمله کامل می‌ماند. بدون فعل کمکی پیشوند جدا می‌شود (*Ik haal je op*)؛ با فعل کمکی فعل کامل می‌ماند: *Ik kan je ophalen*.'
  nl.a2.unit88.lesson03.teach.beschikbaar:
    title: فرصت داشتن
    gloss: روز شنبه / روز یکشنبه / فردا / امشب / وقت / آمدن / کار کردن
    note: با این کلمه‌ها می‌گویید که کِی فارغ استین یا مصروف. *Geen tijd* یعنی «وقت نیست».
    example_gloss:
    - من روز شنبه وقت ندارم.
    - آیا فردا آمده می‌توانی؟
    - امشب باید کار کنم.
  nl.a2.unit88.lesson03.teach.verbinders:
    title: گفتن سبب
    gloss: چون / چون / پس
    note: '*Want* و *omdat* هر دو دلیل را می‌رسانند؛ *dus* نتیجه را می‌رساند. بعد از *want* و *dus* ترتیب کلمه‌ها عادی است (اول نهاد، بعد فعل)؛ بعد از *omdat* فعل‌ها به آخر جمله می‌روند.'
    example_gloss:
    - من آمده نمی‌توانم، چون باید کار کنم.
    - من آمده نمی‌توانم، چون باید کار کنم.
    - من وقت ندارم، پس آمده نمی‌توانم.
  nl.a2.unit88.lesson03.teach.gn_drie_modalen:
    title: سه فعل کمکی
    gloss: من می‌توانم، من می‌خواهم، من باید؛ ما می‌توانیم، ما می‌خواهیم، ما باید
    note: '*Kunnen, willen* و *moeten* به همین شکل کار می‌کنند: فعل کمکی صرف‌شده در جای دوم جمله می‌آید و مصدر در آخر جمله. هر کدام معنی را فرق می‌دهد: توانایی یا امکان، خواست، الزام.'
  nl.a2.unit88.lesson03.teach.gn_zonder_infinitief:
    title: Kunnen بدون مصدر
    gloss: من روز شنبه نمی‌توانم. آیا یکشنبه می‌توانی؟ بلی، یکشنبه می‌توانم.
    note: 'وقتی از متن معلوم باشد که کدام فعل مقصود است (اینجا *komen*)، در هالندی اغلب مصدر حذف می‌شود: *Ik kan zaterdag niet.*'
  nl.a2.unit88.lesson03.teach.zin_contrast:
    title: خواستن در برابر باید
    gloss: من می‌خواهم بیایم، اما باید کار کنم.
    note: '*Maar* یعنی «اما».'
  nl.a2.unit88.lesson04.teach.plannen:
    title: بهتر شدن
    gloss: یاد گرفتن / تمرین کردن / بهتر / بیشتر / هفتهٔ آینده / بعداً / با خوشی
    note: '*Graag* به *willen* معنای «با خوشی، با میل» را اضافه می‌کند: *Ik wil graag ...* = دوست دارم که ...'
    example_gloss:
    - دوست دارم بیشتر تمرین کنم.
    - هفتهٔ آینده آمده می‌توانم.
    - بعداً می‌خواهم بهتر آشپزی کنم.
  nl.a2.unit88.lesson04.teach.gn_wil_kunnen:
    title: Wil kunnen
    gloss: می‌خواهم شنا کرده بتوانم. می‌خواهم بهتر آشپزی کرده بتوانم.
    note: 'فعل‌های کمکی را می‌شود پشت هم آورد. فقط اولی صرف می‌شود و در جایگاه دوم می‌ماند (*wil*). بقیه مصدر استند و در آخر می‌آیند، به این ترتیب: اول فعل کمکی دوم، آخر فعل اصلی: *kunnen zwemmen*.'
  nl.a2.unit88.lesson04.teach.gn_zou_moeten:
    title: Zou moeten
    gloss: تو باید بیشتر تمرین کنی. ما باید بیشتر تمرین کنیم.
    note: '*Zou moeten* مشوره می‌دهد: «باید». *Zou* فعل صرف‌شده است (مفرد *zou*، جمع *zouden*)؛ *moeten* و فعل اصلی در آخر می‌آیند.'
  nl.a2.unit88.lesson04.teach.gn_zal_kunnen:
    title: Zal kunnen
    gloss: روز شنبه آمده می‌توانم. تو را آورده می‌توانم. هفتهٔ آینده باید کار کنم.
    note: '*Ik/hij/zij zal*؛ *jij zult* (*jij zal* هم می‌شود)؛ *wij/jullie/zij zullen*. این فعل به آینده اشاره می‌کند. بعد از آن دو مصدر در آخر می‌آیند. فعل جداشدنی مثل *ophalen* کامل می‌ماند. *Jou* شکل تأکیدی *je* است: *Ik zal jou kunnen ophalen.*'
  nl.a2.unit88.lesson04.teach.zin_terugbellen:
    title: زنجیره با فعل جداشدنی
    gloss: فردا دوباره به تو زنگ زده می‌توانم.
  nl.a2.unit88.lesson05.teach.woorden:
    title: کلمه‌های امکان
    gloss: شاید / دانستن / با هم / ما / ساعت / دو / در
    note: '*We* شکل بدون تأکید *wij* است. *Om twee uur* یعنی «ساعت دو».'
    example_gloss:
    - نمی‌دانم.
    - ما با هم آشپزی کرده می‌توانیم.
    - آیا ساعت دو آمده می‌توانی؟
  nl.a2.unit88.lesson05.teach.gn_misschien:
    title: Misschien
    gloss: شاید آمده بتوانم. شاید من آمده بتوانم.
    note: '*Misschien* می‌گوید چیزی ممکن است اما یقینی نیست. اگر اول جمله بیاید، ترتیب جمله برعکس می‌شود (فعل پیش از نهاد)؛ بعد از فعل ترتیب عادی می‌ماند.'
  nl.a2.unit88.lesson05.teach.gn_het_kan_zijn:
    title: Het kan zijn dat
    gloss: ممکن است باید کار کنم. ممکن است فردا باران ببارد.
    note: '*Het kan zijn dat ...* یک امکان را معرفی می‌کند. بعد از *dat* گروه فعل به آخر می‌رود: *dat ik moet werken*؛ اینجا *moet* (صرف‌شده) پیش از مصدر *werken* می‌آید. *Kunnen* به‌تنهایی هم می‌تواند امکان را برساند: *Het kan regenen.*'
  nl.a2.unit88.lesson05.teach.reading:
    title: نور به لوته می‌نویسد
    gloss: سلام لوته، شاید روز شنبه آمده نتوانم. ممکن است باید کار کنم. یکشنبه می‌دانم. شاید یکشنبه با هم بایسکل‌سواری کرده بتوانیم. ساعت دو می‌توانم. با احترام، نور
    note: ببینین که نور چطور یقین (*ik kan om twee uur*) و امکان (*misschien*، *het kan zijn dat*) را با هم می‌آورد.
    glosses:
      misschien: شاید
      weet: دانستن
      samen: باهم
      uur: ساعت
  nl.a2.unit88.lesson06.teach.vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، آیا روز شنبه آمده می‌توانی؟'
  nl.a2.unit88.lesson06.teach.antw:
    title: عمر یقین ندارد
    gloss: 'عمر: هنوز نمی‌دانم. ممکن است باید کار کنم.'
  nl.a2.unit88.lesson06.teach.terugbellen:
    title: لوته می‌خواهد که به او زنگ بزنند
    gloss: 'لوته: پس آیا دوباره به من زنگ زده می‌توانی؟'
  nl.a2.unit88.lesson06.teach.ja_dat_kan:
    title: Omar موافقت می‌کند
    gloss: 'عمر: بلی، ممکن است. فردا دوباره به تو زنگ زده می‌توانم.'
  nl.a2.unit88.lesson06.teach.ophalen:
    title: لوته دربارهٔ یکشنبه می‌پرسد
    gloss: 'لوته: عالی! و آیا یکشنبه مرا آورده می‌توانی؟'
  nl.a2.unit88.lesson06.teach.zondag:
    title: عمر یک وقت پیشنهاد می‌کند
    gloss: 'عمر: یکشنبه می‌شود. ساعت دو تو را آورده می‌توانم.'
exercises:
  nl.a2.unit88.lesson01.exercise01.choose_cook:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Omar kan goed koken.
    distractors:
    - Omar kunnen goed koken.
    - Omar kan koken goed.
    - Omar kunt goed koken.
    accepted_answers:
    - value: Omar kan goed koken.
      status: correct
    feedback: '*Omar* با *kan* می‌آید و مصدر *koken* در آخر است.'
    prompt_blocks:
    - عمر خوب آشپزی کرده می‌تواند.
  nl.a2.unit88.lesson01.exercise02.choose_swim:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ik kan niet zwemmen.
    distractors:
    - Ik kan zwemmen niet.
    - Ik kunt niet zwemmen.
    - Ik kunnen niet zwemmen.
    accepted_answers:
    - value: Ik kan niet zwemmen.
      status: correct
    feedback: '*Niet* پیش از مصدر می‌آید: *Ik kan niet zwemmen.*'
    prompt_blocks:
    - من شنا کرده نمی‌توانم.
  nl.a2.unit88.lesson01.exercise03.match_skills:
    instruction: هر مصدر هالندی را با معنای آن در دری جور کنید.
    accepted_answers:
    - value:
      - left: koken
        right: آشپزی کردن
      - left: zwemmen
        right: شنا کردن
      - left: fietsen
        right: بایسکل راندن
      - left: tekenen
        right: نقاشی کردن
      - left: zingen
        right: آواز خواندن
      - left: gitaar spelen
        right: گیتار زدن
      status: correct
    feedback: این‌ها مهارت‌هایی استند که در این درس آمده‌اند.
    pairs:
    - left: koken
      right: آشپزی کردن
    - left: zwemmen
      right: شنا کردن
    - left: fietsen
      right: بایسکل راندن
    - left: tekenen
      right: نقاشی کردن
    - left: zingen
      right: آواز خواندن
    - left: gitaar spelen
      right: گیتار زدن
  nl.a2.unit88.lesson01.exercise04.order_sing:
    instruction: کلمه‌ها را طوری بچینید که بگویین «نور خوب آواز خوانده می‌تواند.»
    correct_option: Noor kan goed zingen
    accepted_answers:
    - value: Noor kan goed zingen
      status: correct
    feedback: '*Noor kan goed zingen*: مصدر *zingen* در آخر است.'
  nl.a2.unit88.lesson01.exercise05.complete_kunt:
    instruction: جای خالی را با شکل زمان حال kunnen برای jij پر کنید.
    correct_option: kunt
    accepted_answers:
    - value: kunt
      status: correct
    - value: kan
      status: correct
    feedback: '*Jij kunt* شکل معیاری است؛ *jij kan* در گفتار رایج است.'
  nl.a2.unit88.lesson01.exercise06.translate_cycle:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Ik kan fietsen.
      status: correct
    - value: Ik kan fietsen
      status: correct
    feedback: '*Ik kan fietsen* = من بایسکل‌سواری کرده می‌توانم.'
    prompt_blocks:
    - من بایسکل رانده می‌توانم.
  nl.a2.unit88.lesson01.exercise07.write_draw:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Lotte kan goed tekenen.
    accepted_answers:
    - value: Lotte kan goed tekenen.
      status: correct
    - value: Lotte kan goed tekenen
      status: correct
    feedback: '*Lotte kan goed tekenen* = لوته خوب نقاشی کرده می‌تواند.'
    prompt_blocks:
    - 'به هالندی بنویسین: لوته خوب نقاشی کرده می‌تواند.'
  nl.a2.unit88.lesson02.exercise01.choose_guitar:
