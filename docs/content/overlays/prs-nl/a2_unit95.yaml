course:
  title: هالندی A2
  description: هلندی A2 با تمرکز بر دستور زبان برای صحبت درباره‌ی شرط‌های واقعی.
  learning_goal: بگویین اگر یک شرط برآورده شود چه می‌شود یا چه خواهد شد، با استفاده از als + زمان حال، فعل در آخر جمله‌واره‌ی als و جابه‌جایی فاعل و فعل در جمله‌ی اصلی.
units:
  nl.a2.unit95.als_dan:
    title: اگر ... پس
    description: 'دربارهٔ برنامه‌های مربوط به هوا و قانون‌های دکان با شرط‌های واقعی صحبت کنید: als + زمان حال، با dan یا بدون آن.'
lessons:
  nl.a2.unit95.lesson01.als_het_regent:
    title: اگر باران ببارد
  nl.a2.unit95.lesson02.werkwoord_achteraan:
    title: فعل در آخر
  nl.a2.unit95.lesson03.voorop_of_achteraan:
    title: اول یا آخر
  nl.a2.unit95.lesson04.regels_in_de_winkel:
    title: قانون‌های دکان
  nl.a2.unit95.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit95.lesson06.lotte_en_omar:
    title: لوته و عمر برنامه می‌سازند
teaching:
  nl.a2.unit95.lesson01.teach.weer:
    title: هوا
    gloss: هوا / آفتاب / تابیدن / باران باریدن / قشنگ / سرد / گرم
    note: 'جمله‌های مربوط به هوا با *het* می‌آیند: *Het regent*، *Het is koud*. آفتاب فاعل *schijnen* است: *De zon schijnt*.'
    example_gloss:
    - هوا قشنگ است.
    - آفتاب می‌تابد.
    - باران می‌بارد.
    - هوا سرد است.
    - هوا گرم است.
  nl.a2.unit95.lesson01.teach.plannen:
    title: برنامه‌ها
    gloss: در خانه ماندن / قدم زدن / به پارک رفتن / به ساحل رفتن
    note: 'با *ik* پسوند مصدر می‌افتد: *blijven* می‌شود *ik blijf* و *gaan* می‌شود *ik ga*. با *we* فعل مثل مصدر است: *we blijven, we gaan*.'
    example_gloss:
    - من در خانه می‌مانم.
    - من به پارک می‌روم.
    - ما به ساحل می‌رویم.
    - ما در خانه می‌مانیم.
    - ما در پارک قدم می‌زنیم.
  nl.a2.unit95.lesson01.teach.vraag:
    title: پرسیدن دربارهٔ برنامه
    gloss: اگر باران ببارد، چه می‌کنی؟
    note: '*Als* یعنی «اگر». در این پرسش، جملهٔ *als* در آخر آمده است.'
  nl.a2.unit95.lesson01.teach.gn_als_basis:
    title: Als برای شرط‌های واقعی
    gloss: اگر باران ببارد، در خانه می‌مانم. اگر آفتاب بتابد، به پارک می‌روم.
    note: '*Als* + زمان حال را برای چیزی به کار ببرید که واقعاً شده می‌تواند. جملهٔ *als* شرط را می‌گوید و جملهٔ دیگر می‌گوید چه اتفاق می‌افتد یا شما چه می‌کنین. این درس فقط شرط‌های واقعی را دربر دارد، نه شرط‌های خیالی.'
  nl.a2.unit95.lesson01.teach.zinnen:
    title: دو برنامه
    gloss: اگر هوا سرد باشد، در خانه می‌مانم. اگر هوا گرم باشد، ما به ساحل می‌رویم.
  nl.a2.unit95.lesson02.teach.tijd:
    title: وقت و تیلفون کردن
    gloss: وقت داشتن / تیلفون کردن / همراه آمدن
    note: '*Hebben* و *komen* با فاعل تغییر می‌کنند: *ik heb, je hebt, hij heeft*؛ *ik kom, je komt, hij komt*. هر وقت *je* بعد از فعل بیاید (در پرسش، یا در جملهٔ اصلی بعد از جملهٔ *als*)، *-t* می‌افتد: *heb je, kom je*.'
    example_gloss:
    - من وقت دارم.
    - تو وقت داری؟
    - عمر وقت دارد.
    - من به لوته تیلفون می‌کنم.
    - عمر به لوته تیلفون می‌کند.
    - تو همراه می‌آیی؟
    - او همراه می‌آید.
  nl.a2.unit95.lesson02.teach.drinken:
    title: نوشیدنی‌ها
    gloss: نوشیدن / چای / آب / قهوه
    example_gloss:
    - من چای می‌نوشم.
    - ما قهوه می‌نوشیم.
    - من آب می‌نوشم.
  nl.a2.unit95.lesson02.teach.gn_werkwoord_achteraan:
    title: فعل در جملهٔ als آخر می‌آید
    gloss: اگر وقت داشته باشم، به لوته زنگ می‌زنم.
    note: در جملهٔ *als* فعل صرف‌شده به آخر جمله می‌رود (در جمله‌های ساده این درس، آخرین کلمه است). بگویین *als ik tijd heb*، نه *als ik heb tijd*. برای *als het koud is* و *als de zon schijnt* هم همین‌طور است.
  nl.a2.unit95.lesson02.teach.gn_personen:
    title: فاعل‌های دیگر
    gloss: اگر وقت داشته باشی، همراه می‌آیی. اگر عمر وقت داشته باشد، همراه می‌آید.
    note: 'در جملهٔ *als* فعل در آخر می‌آید و با فاعلش مطابقت می‌کند: *je hebt*، *Omar heeft*. در جملهٔ اصلی که بعد از جملهٔ *als* می‌آید، فعل اول می‌آید و فاعل بعد از آن: *kom je*، *komt hij*.'
  nl.a2.unit95.lesson02.teach.zinnen:
    title: نوشیدنی و هوا
    gloss: اگر هوا گرم باشد، آب می‌نوشم. اگر هوا سرد باشد، چای می‌نوشم.
  nl.a2.unit95.lesson03.teach.plaatsen:
    title: روزها و جاها
    gloss: فردا / شنبه / موزیم / بازار
    example_gloss:
    - فردا به بازار می‌روم.
    - روز شنبه ما به موزیم می‌رویم.
    - موزیم قشنگ است.
  nl.a2.unit95.lesson03.teach.gn_inversie:
    title: 'جملهٔ als اول: فعل پیش از فاعل'
    gloss: اگر باران ببارد، من به موزیم می‌روم.
    note: 'وقتی جملهٔ *als* اول می‌آید، جای اول جمله را می‌گیرد. بعد جملهٔ اصلی با فعل شروع می‌شود و فاعل بعد از آن می‌آید: *ga ik*، نه *ik ga*. بعد از جملهٔ *als* ویرگول بگذارین.'
  nl.a2.unit95.lesson03.teach.gn_dan:
    title: dan اختیاری
    gloss: اگر باران ببارد، پس به موزیم می‌روم.
    note: 'می‌توانین بعد از ویرگول *dan* («پس، آن‌وقت») بیاورید. این اختیاری است. فعل باز هم درست بعد از *dan* و پیش از فاعل می‌آید: *dan ga ik*.'
  nl.a2.unit95.lesson03.teach.gn_achteraan:
    title: جملهٔ اصلی اول
    gloss: اگر باران ببارد، به موزیم می‌روم.
    note: می‌توانین با جملهٔ اصلی هم شروع کنید. آن‌وقت ترتیب کلمه‌ها عادی است (*ik ga*)، فعل و فاعل جابه‌جا نمی‌شوند و معمولاً ویرگول نمی‌گذارند. معنی مثل *Als het regent, ga ik naar het museum.* است.
  nl.a2.unit95.lesson03.teach.zinnen:
    title: هر دو ترتیب
    gloss: اگر آفتاب بتابد، پس ما به ساحل می‌رویم. اگر هوا قشنگ باشد، ما به بازار می‌رویم.
  nl.a2.unit95.lesson04.teach.winkel:
    title: در دکان
    gloss: دکان / رسید / پول / تخفیف / مجانی
    note: '*De bon* رسیدی است که در دکان به شما می‌دهند. *Geen* پیش از اسم یعنی «هیچ» یا «نه»: *geen geld*.'
    example_gloss:
    - من در دکان هستم.
    - رسید پیش من است.
    - من پول ندارم.
    - تخفیف خوب است.
  nl.a2.unit95.lesson04.teach.werkwoorden:
    title: فعل‌های دکان
    gloss: خریدن / پرداختن / گرفتن / پس
    note: '*Je krijgt je geld terug* = پولت را پس می‌گیری. با *ik* فعل پسوند ندارد؛ با *je* به *-t* ختم می‌شود، به‌جز وقتی که *je* بعد از فعل بیاید: *krijg je*.'
    example_gloss:
    - من دو تا می‌خرم.
    - تو پنجاه یورو می‌پردازی.
    - تو تخفیف می‌گیری.
    - تو پولت را پس می‌گیری.
  nl.a2.unit95.lesson04.teach.bedragen:
    title: عددها و تحویلی
    gloss: دو / پنجاه / یورو / بیشتر از / تحویلی / نه
    example_gloss:
    - تحویلی مجانی است.
    - من بیشتر از پنجاه یورو می‌پردازم.
    - من رسید را ندارم.
  nl.a2.unit95.lesson04.teach.gn_regels:
    title: قانون‌های دکان از als + زمان حال استفاده می‌کنند
    gloss: اگر رسید را داشته باشی، پولت را پس می‌گیری.
    note: 'دکان‌ها قانون‌هایشان را به شکل شرط‌های واقعی می‌گویند: *als* + زمان حال، فعل در آخر جملهٔ *als*، و در جملهٔ اصلی بعد از آن، فعل پیش از فاعل می‌آید. خیلی دکان‌ها به‌جای *je* از *u* کار می‌گیرند، ولی ساختار همان است.'
  nl.a2.unit95.lesson04.teach.zinnen:
    title: دو قانون دکان
    gloss: اگر دو تا بخری، تخفیف می‌گیری. اگر رسید نداشته باشی، پولت را پس نمی‌گیری.
  nl.a2.unit95.lesson04.teach.gn_wanneer:
    title: Als یا wanneer؟
    gloss: کی به دکان می‌رویم؟
    note: در هلندیِ روزمره، *als* کلمهٔ معمول برای «اگر» در شرط است. *Wanneer* بیشتر در پرسش یعنی «کی؟». برای شرط‌های این درس از *wanneer* استفاده نکنین.
  nl.a2.unit95.lesson05.teach.reading:
    title: برنامهٔ نور
    gloss: سلام لوته و عمر! روز شنبه اگر آفتاب بتابد، ما به ساحل می‌رویم. اگر باران ببارد، به موزیم می‌رویم. اگر هوا سرد باشد، چای می‌نوشیم. اگر شما وقت داشته باشین، همراه می‌آیید؟ با سلام و احترام، نور
    note: ببینین کدام برنامه به کدام شرط تعلق دارد. توجه کنید که فعل در آخر هر جملهٔ *als* است.
    glosses:
      Hoi: سلام
      jullie: شما (جمع)
      Groetjes: سلام و احترام
  nl.a2.unit95.lesson06.teach.lotte_vraag:
    title: لوته دربارهٔ روز شنبه می‌پرسد
    gloss: 'لوته: سلام عمر، روز شنبه چه می‌کنی؟'
  nl.a2.unit95.lesson06.teach.omar_strand:
    title: عمر یک شرط را می‌گوید
    gloss: 'عمر: اگر هوا قشنگ باشد، به ساحل می‌روم.'
  nl.a2.unit95.lesson06.teach.lotte_regen:
    title: لوته دربارهٔ باران می‌پرسد
    gloss: 'لوته: و اگر باران ببارد؟'
  nl.a2.unit95.lesson06.teach.omar_museum:
    title: عمر یک برنامه و یک دعوت می‌دهد
    gloss: 'عمر: پس به موزیم می‌روم. اگر وقت داشته باشی، همراه می‌آیی؟'
  nl.a2.unit95.lesson06.teach.lotte_mee:
    title: لوته با یک شرط قبول می‌کند
    gloss: 'لوته: بلی، روز شنبه رخصت هستم. اگر آفتاب بتابد، همراه می‌آیم.'
  nl.a2.unit95.lesson06.teach.omar_tot:
    title: عمر گفتگو را ختم می‌کند
    gloss: 'عمر: خوب شد! تا شنبه!'
exercises:
  nl.a2.unit95.lesson01.exercise01.choose_regent_thuis:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Als het regent, blijf ik thuis.
    distractors:
    - Als de zon schijnt, blijf ik thuis.
    - Als het regent, ga ik naar het park.
    - اگر هوا سرد باشد، به ساحل می‌روم.
    accepted_answers:
    - value: Als het regent, blijf ik thuis.
      status: correct
    feedback: '*Als het regent* = اگر باران ببارد؛ *blijf ik thuis* = در خانه می‌مانم.'
    prompt_blocks:
    - اگر باران ببارد، من در خانه می‌مانم.
  nl.a2.unit95.lesson01.exercise02.choose_zon_park:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Als de zon schijnt, gaan we naar het park.
    distractors:
    - Als het regent, gaan we naar het park.
    - Als de zon schijnt, blijven we thuis.
    - اگر هوا سرد باشد، ما به پارک می‌رویم.
    accepted_answers:
    - value: Als de zon schijnt, gaan we naar het park.
      status: correct
    feedback: '*Als de zon schijnt* = اگر آفتاب بتابد؛ *gaan we* = ما می‌رویم.'
    prompt_blocks:
    - اگر آفتاب بتابد، ما به پارک می‌رویم.
  nl.a2.unit95.lesson01.exercise03.match_condities:
    instruction: هر عبارت هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: het regent
        right: باران می‌بارد
      - left: de zon schijnt
        right: آفتاب می‌تابد
      - left: هوا سرد است
        right: هوا سرد است
      - left: هوا گرم است
        right: هوا گرم است
      - left: هوا خوب است
        right: هوا خوب است
      - left: we blijven thuis
        right: ما در خانه می‌مانیم
      status: correct
    feedback: این عبارت‌ها بخش‌های سازندهٔ جمله‌های این درس استند.
    pairs:
    - left: het regent
      right: باران می‌بارد
    - left: de zon schijnt
      right: آفتاب می‌تابد
    - left: هوا سرد است
      right: هوا سرد است
    - left: هوا گرم است
      right: هوا گرم است
    - left: هوا خوب است
      right: هوا خوب است
    - left: we blijven thuis
      right: ما در خانه می‌مانیم
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson01.exercise04.order_regent:
    instruction: 'کلمه‌ها را طوری مرتب کنید که بگویین: «اگر باران ببارد، در خانه می‌مانم.»'
    correct_option: Als het regent blijf ik thuis
    accepted_answers:
    - value: Als het regent blijf ik thuis
      status: correct
    - value: Ik blijf thuis als het regent
      status: correct
    feedback: '*Als het regent, blijf ik thuis.* می‌توانین جملهٔ *als* را آخر هم بگذارین: *Ik blijf thuis als het regent.*'
  nl.a2.unit95.lesson01.exercise05.complete_regent:
    instruction: 'جمله را کامل کنید: «اگر باران ببارد، در خانه می‌مانم.»'
    correct_option: regent
    accepted_answers:
    - value: regent
      status: correct
    feedback: '*Het regent* = باران می‌بارد.'
  nl.a2.unit95.lesson01.exercise06.translate_zon_park:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Als de zon schijnt, ga ik naar het park.
      status: correct
    - value: Als de zon schijnt ga ik naar het park.
      status: correct
    - value: Ik ga naar het park als de zon schijnt.
      status: correct
    - value: Ik ga naar het park, als de zon schijnt.
      status: correct
    feedback: '*Als de zon schijnt, ga ik naar het park.*'
    prompt_blocks:
    - اگر آفتاب بتابد، من به پارک می‌روم.
  nl.a2.unit95.lesson01.exercise07.write_koud:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Als het koud is, blijf ik thuis.
    accepted_answers:
    - value: Als het koud is, blijf ik thuis.
      status: correct
    - value: Als het koud is blijf ik thuis.
      status: correct
    - value: Ik blijf thuis als het koud is.
      status: correct
    - value: Ik blijf thuis, als het koud is.
      status: correct
    feedback: '*Als het koud is, blijf ik thuis.* یعنی: اگر هوا سرد باشد، من در خانه می‌مانم.'
    prompt_blocks:
    - 'به هلندی بنویسین: اگر هوا سرد باشد، من در خانه می‌مانم.'
  nl.a2.unit95.lesson02.exercise01.choose_tijd_bel:
    instruction: جمله‌ای را انتخاب کنید که فعل در جای درست قرار دارد.
    correct_option: Als ik tijd heb, bel ik Lotte.
    distractors:
    - Als ik heb tijd, bel ik Lotte.
    - Als ik tijd heb, ik bel Lotte.
    - Als ik tijd heb, ik Lotte bel.
    accepted_answers:
    - value: Als ik tijd heb, bel ik Lotte.
      status: correct
    feedback: 'در جملهٔ *als* فعل در آخر می‌آید: *als ik tijd heb*. بعد جملهٔ اصلی با فعل شروع می‌شود: *bel ik*.'
    prompt_blocks:
    - اگر وقت داشته باشم، به لوته زنگ می‌زنم.
  nl.a2.unit95.lesson02.exercise02.choose_omar:
    instruction: جمله‌ای را انتخاب کنید که فعل‌ها در جای درست قرار دارند.
    correct_option: Als Omar tijd heeft, komt hij mee.
    distractors:
    - Als Omar heeft tijd, komt hij mee.
    - Als Omar tijd heeft, hij komt mee.
    - Als Omar tijd heeft, komt mee hij.
    accepted_answers:
    - value: Als Omar tijd heeft, komt hij mee.
      status: correct
    feedback: '*Heeft* در جملهٔ *als* آخر است؛ *komt hij mee* با فعل شروع می‌شود.'
