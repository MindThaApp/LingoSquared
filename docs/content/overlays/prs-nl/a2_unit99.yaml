course:
  title: هالندی A2
  description: هالندی A2 بر پایهٔ دستور زبان برای مقایسه و انتخاب میان گزینه‌ها.
  learning_goal: چند گزینه را مقایسه کنید و بهترین را با -er، -st، meer، het meest، even ... als و niet zo ... als انتخاب کنید.
units:
  nl.a2.unit99.de_beste_en_meest:
    title: بهترین، ارزان‌ترین، بیشترین
    description: خانه، تیلفون و رخصتی را مقایسه کنید و بگویین کدام بهترین است.
lessons:
  nl.a2.unit99.lesson01.groter_dan:
    title: بزرگ‌تر از
  nl.a2.unit99.lesson02.het_grootste:
    title: بزرگ‌ترین
  nl.a2.unit99.lesson03.even_en_niet_zo:
    title: به اندازهٔ ... و نه به اندازهٔ ...
  nl.a2.unit99.lesson04.meer_en_meest:
    title: بیشتر و بیشترین
  nl.a2.unit99.lesson05.noor_kiest_een_hotel:
    title: Noor یک هوتل انتخاب می‌کند
  nl.a2.unit99.lesson06.een_telefoon_kiezen:
    title: انتخاب تیلفون
teaching:
  nl.a2.unit99.lesson01.teach.eigenschappen:
    title: صفت‌ها
    gloss: بزرگ / کوچک / قشنگ / گران / ارزان / دراز
    note: این شش صفت پایهٔ هر مقایسه در این بخش اند.
    example_gloss:
    - خانه بزرگ و قشنگ است.
    - تیلفون گران است، ولی هوتل ارزان است.
    - سفر دراز است و اتاق کوچک است.
  nl.a2.unit99.lesson01.teach.wonen:
    title: خانه و مسکن
    gloss: خانه / اپارتمان / اتاق / آشپزخانه / باغ
    note: واژه‌های مسکن از کورس اول دوباره می‌آیند؛ اینجا چیزهایی اند که مقایسه می‌کنیم.
    example_gloss:
    - خانه باغ دارد.
    - آشپزخانه در اپارتمان است.
    - اتاق کوچک است.
  nl.a2.unit99.lesson01.teach.telefoon:
    title: تیلفون‌ها
    gloss: تیلفون / بیتری / کمره
    note: واژه‌های تیلفون برای مقایسهٔ مدل‌ها. *Goed* یعنی خوب.
    example_gloss:
    - تیلفون من کمره دارد.
    - بیتری خوب است.
    - من موبایل دارم.
  nl.a2.unit99.lesson01.teach.vakantie:
    title: رخصتی‌ها
    gloss: رخصتی / هوتل / ساحل / شهر / سفر
    note: واژه‌های سفر از کورس اول، که اینجا برای مقایسهٔ گزینه‌های رخصتی به کار می‌روند.
    example_gloss:
    - هوتل نزدیک ساحل است.
    - رخصتی دراز است.
    - شهر بزرگ است.
  nl.a2.unit99.lesson01.teach.gn_groter:
    title: 'صفت تفضیلی: افزودن -er'
    gloss: بزرگ، بزرگ‌تر؛ کوچک، کوچک‌تر؛ قشنگ، قشنگ‌تر؛ گران، گران‌تر؛ ارزان، ارزان‌تر؛ دراز، درازتر
    note: '-er را به صفت اضافه کنید. به املا توجه کنید: *groot* یک o را از دست می‌دهد (*groter*)، *goedkoop* یک o را از دست می‌دهد (*goedkoper*) و *duur* پیش از -er یک d می‌گیرد (*duurder*). *Mooi* ساده *mooier* می‌شود.'
  nl.a2.unit99.lesson01.teach.gn_dan:
    title: مقایسه با dan
    gloss: خانه از اپارتمان بزرگ‌تر است. اتاق من از اتاق تو کوچک‌تر است.
    note: بعد از صفت تفضیلی (شکل -er)، چیزی که با آن مقایسه می‌کنین بعد از *dan* (از) می‌آید.
  nl.a2.unit99.lesson01.teach.zin_duurder:
    title: مقایسهٔ تیلفون‌ها
    gloss: تلفون من از تلفون تو گران‌تر است.
    note: '*Mijn* یعنی «من/مالِ من» و *jouw* یعنی «تو/مالِ تو» (غیررسمی). در گفتار روزمره *jouw* اغلب به شکل بی‌تکیهٔ *je* می‌آید: *je telefoon*.'
  nl.a2.unit99.lesson02.teach.kiezen:
    title: واژه‌های انتخاب
    gloss: کدام / این (واژهٔ de) / این (واژهٔ het) / آن / از همه
    note: '*Deze* با واژه‌های de مفرد (deze telefoon) و با جمع‌ها می‌آید، *dit* با واژه‌های het مفرد (dit hotel). *Die* یعنی آن (die telefoon).'
    example_gloss:
    - کدام تیلفون گران است؟
    - این تیلفون گران است و آن تیلفون ارزان.
    - این هوتل قشنگ است و آن تیلفون گران.
  nl.a2.unit99.lesson02.teach.gn_superlatief:
    title: 'صفت عالی: het + صفت + -st'
    gloss: بزرگ، بزرگ‌ترین؛ کوچک، کوچک‌ترین؛ قشنگ، قشنگ‌ترین؛ گران، گران‌ترین؛ ارزان، ارزان‌ترین؛ دراز، درازترین
    note: 'بعد از *is*، *het* را بگذارین و -st اضافه کنید. تغییرات املایی -er اینجا نمی‌آید: مصوت دوبل می‌ماند (*het grootst*، *het goedkoopst*).'
  nl.a2.unit99.lesson02.teach.gn_superlatief_e:
    title: 'صفت عالی پیش از اسم: -ste'
    gloss: این گران‌ترین تیلفون است. این کوچک‌ترین خانه است. این ارزان‌ترین اتاق است. این قشنگ‌ترین باغ است.
    note: 'پیش از اسم -ste اضافه کنید: *de duurste telefoon*، *het kleinste huis*. بعد از *is* بدون اسم، هم *het goedkoopst* و هم *het goedkoopste* درست است.'
  nl.a2.unit99.lesson02.teach.gn_onregelmatig:
    title: 'بی‌قاعده: goed و veel'
    gloss: خوب، بهتر، بهترین؛ زیاد، بیشتر، بیشترین. تیلفون من از تیلفون تو بهتر است. این بهترین کمره است. این هوتل بیشترین اتاق را دارد.
    note: '*Goed* و *veel* از قاعده پیروی نمی‌کنند: *goed - beter - best* و *veel - meer - meest*. پیش از اسم به -e ختم می‌شوند: *de beste camera*، *de meeste kamers* (با واژهٔ het: *het beste huis*).'
  nl.a2.unit99.lesson02.teach.zin_goedkoopst:
    title: از میان همهٔ هوتل‌ها
    gloss: از میان همهٔ هوتل‌ها، این هوتل ارزان‌ترین است.
    note: '*Van alle* گروهی را نام می‌برد که از آن انتخاب می‌کنین.'
  nl.a2.unit99.lesson03.teach.gelijk:
    title: برابر و نابرابر
    gloss: به همان اندازه / نه به آن اندازه / مثل
    note: '*Even ... als* می‌گوید دو چیز برابرند؛ *niet zo ... als* می‌گوید اولی کمتر است.'
    example_gloss:
    - خانهٔ من به اندازهٔ خانهٔ تو بزرگ است.
    - هوتل به اندازهٔ اپارتمان گران نیست.
    - آشپزخانه به اندازهٔ باغ قشنگ است.
  nl.a2.unit99.lesson03.teach.gn_even:
    title: 'برابر: even ... als'
    gloss: تیلفون من به اندازهٔ تیلفون تو گران است.
    note: 'صفت پایه (بدون -er) را میان *even* و *als* بگذارین: *even duur als*.'
  nl.a2.unit99.lesson03.teach.gn_niet_zo:
    title: 'کمتر: niet zo ... als'
    gloss: هوتل به اندازهٔ اپارتمان بزرگ نیست.
    note: 'باز هم صفت پایه: *niet zo groot als*. چیز دوم بزرگ‌تر است.'
  nl.a2.unit99.lesson03.teach.gn_dan_als:
    title: Dan یا als؟
    gloss: هوتل از اپارتمان ارزان‌تر است. هوتل به اندازهٔ اپارتمان ارزان است.
    note: 'صفت تفضیلی (-er) با *dan* می‌آید. *Even* و *niet zo* با صفت پایه و *als* می‌آیند. هرگز آن‌ها را مخلوط نکنین: نه *even goedkoper als*.'
  nl.a2.unit99.lesson04.teach.lange_woorden:
    title: صفت‌های بلندتر
    gloss: جالب / عملی / مدرن / راحت
    note: این صفت‌های بلندتر معمولاً همان‌هایی اند که با *meer* و *het meest* می‌آیند.
    example_gloss:
    - سفر به شهر جالب است.
    - تیلفون عملی است.
    - اپارتمان مدرن و راحت است.
  nl.a2.unit99.lesson04.teach.gn_meer:
    title: 'صفت‌های بلند: meer و het meest'
    gloss: جالب، جالب‌تر، جالب‌ترین؛ مدرن، مدرن‌تر، مدرن‌ترین
    note: با صفت‌های بلندتر، *meer* (بیشتر) یا *het meest* (بیشترین) را پیش از صفتِ بدون تغییر بگذارین. این الگویی است که اینجا آموزش داده می‌شود؛ شکل‌هایی مثل *interessanter* هم در هالندی روزمره دیده می‌شوند.
  nl.a2.unit99.lesson04.teach.gn_kort_lang:
    title: کوتاه یا بلند؟
    gloss: 'کوتاه: گران، گران‌تر، گران‌ترین. بلند: راحت، راحت‌تر، راحت‌ترین.'
    note: صفت‌های کوتاه -er و -st می‌گیرند. صفت‌های بلندتر، به‌ویژه آن‌هایی که به -ant، -isch، -eel یا -abel ختم می‌شوند، معمولاً *meer* و *het meest* می‌گیرند. در هر دو الگو بعد از صفت تفضیلی باز هم *dan* می‌آید.
  nl.a2.unit99.lesson04.teach.zin_comfortabel:
    title: انتخاب هوتل
    gloss: کدام هوتل راحت‌ترین است؟ این هوتل راحت‌ترین است، ولی گران‌ترین هم هست.
    note: '*Welk* با واژه‌های het مفرد (welk hotel) می‌آید؛ *welke* با واژه‌های de و همهٔ جمع‌ها.'
  nl.a2.unit99.lesson05.teach.reading:
    title: جستجوی هوتل توسط Noor
    gloss: Noor برای رخصتی‌اش دنبال یک هوتل می‌گردد. Hotel Strand گران‌ترین است، ولی قشنگ‌ترین هم هست. Hotel Stad از Hotel Strand ارزان‌تر است، ولی به اندازهٔ Hotel Strand راحت نیست. Hotel Tuin به اندازهٔ Hotel Stad ارزان است. Noor Hotel Tuin را انتخاب می‌کند، چون اتاق‌هایش بزرگ‌تر اند.
    note: ببینین این سه هوتل چطور با هم مقایسه می‌شوند.
    glosses:
      zoekt: دنبال ... می‌گردد
      voor: برای
      haar: او
      kiest: انتخاب می‌کند
      want: چون
      kamers: اتاق‌ها
      zijn: استند
  nl.a2.unit99.lesson06.teach.beurt01:
    title: Lotte نظر می‌پرسد
    gloss: 'Lotte: سلام Omar، به نظر تو کدام تیلفون بهترین است؟'
  nl.a2.unit99.lesson06.teach.beurt02:
    title: Omar یک برتری و یک عیب را می‌گوید
    gloss: 'Omar: این تیلفون بهترین کمره را دارد، ولی گران‌ترین هم هست.'
  nl.a2.unit99.lesson06.teach.beurt03:
    title: Lotte یک تیلفون ارزان‌تر پیشنهاد می‌کند
    gloss: 'Lotte: آن تیلفون از این ارزان‌تر است و بیتری‌اش هم به همان اندازه خوب است.'
  nl.a2.unit99.lesson06.teach.beurt04:
    title: Omar دربارهٔ شکل ظاهر می‌پرسد
    gloss: 'Omar: آن تیلفون هم به اندازهٔ این قشنگ است؟'
  nl.a2.unit99.lesson06.teach.beurt05:
    title: Lotte جواب می‌دهد
    gloss: 'Lotte: نه، به اندازهٔ این قشنگ نیست، ولی خیلی ارزان‌تر است.'
  nl.a2.unit99.lesson06.teach.beurt06:
    title: عمر تصمیم می‌گیرد
    gloss: 'Omar: خوب، من همان تیلفون را انتخاب می‌کنم.'
exercises:
  nl.a2.unit99.lesson01.exercise01.choose_kleiner:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Het appartement is kleiner dan het huis.
    distractors:
    - Het huis is kleiner dan het appartement.
    - Het appartement is klein dan het huis.
    - Het appartement is kleinste dan het huis.
    accepted_answers:
    - value: Het appartement is kleiner dan het huis.
      status: correct
    feedback: '*Kleiner* صفت تفضیلیِ *klein* است و بعدش *dan* می‌آید.'
    prompt_blocks:
    - اپارتمان از خانه کوچک‌تر است.
  nl.a2.unit99.lesson01.exercise02.choose_duurder:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Mijn telefoon is duurder dan jouw telefoon.
    distractors:
    - Jouw telefoon is duurder dan mijn telefoon.
    - Mijn telefoon is duur dan jouw telefoon.
    - Mijn telefoon is goedkoper dan jouw telefoon.
    accepted_answers:
    - value: Mijn telefoon is duurder dan jouw telefoon.
      status: correct
    feedback: '*Duurder dan* یعنی گران‌تر از.'
    prompt_blocks:
    - تلفون من از تلفون تو گران‌تر است.
  nl.a2.unit99.lesson01.exercise03.match_vergelijking:
    instruction: هر صفت را با شکل تفضیلی‌اش جور کنید.
    accepted_answers:
    - value:
      - left: groot
        right: groter
      - left: klein
        right: kleiner
      - left: mooi
        right: mooier
      - left: duur
        right: duurder
      - left: goedkoop
        right: goedkoper
      - left: lang
        right: langer
      status: correct
    feedback: '-er را اضافه کنید و قواعد املا را در نظر بگیرین: groter, goedkoper, duurder.'
    pairs:
    - left: groot
      right: groter
    - left: klein
      right: kleiner
    - left: mooi
      right: mooier
    - left: duur
      right: duurder
    - left: goedkoop
      right: goedkoper
    - left: lang
      right: langer
  nl.a2.unit99.lesson01.exercise04.order_groter:
    instruction: 'کلمات را طوری مرتب کنید که بگوید: «خانه از آپارتمان بزرگ‌تر است.»'
    correct_option: Het huis is groter dan het appartement
    accepted_answers:
    - value: Het huis is groter dan het appartement
      status: correct
    feedback: 'جمله درست این است: *Het huis is groter dan het appartement.*'
  nl.a2.unit99.lesson01.exercise05.complete_groter:
    instruction: جمله را طوری کامل کنید که معنی «آشپزخانه از اتاق بزرگ‌تر است» بدهد. از شکل تفضیلی استفاده کنید.
    correct_option: groter
    accepted_answers:
    - value: groter
      status: correct
    feedback: '*Groter* شکل تفضیلی *groot* است.'
  nl.a2.unit99.lesson01.exercise06.translate_goedkoper:
    instruction: به هالندی ترجمه کنید.
    correct_option: Het hotel is goedkoper dan het appartement.
    accepted_answers:
    - value: Het hotel is goedkoper dan het appartement.
      status: correct
    - value: Het hotel is goedkoper dan het appartement
      status: correct
    feedback: 'ترجمه درست این است: *Het hotel is goedkoper dan het appartement.*'
    prompt_blocks:
    - هوتل از اپارتمان ارزان‌تر است.
  nl.a2.unit99.lesson01.exercise07.write_kleiner:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Mijn kamer is kleiner dan jouw kamer.
    accepted_answers:
    - value: Mijn kamer is kleiner dan jouw kamer.
      status: correct
    - value: Mijn kamer is kleiner dan jouw kamer
      status: correct
    - value: Mijn kamer is kleiner dan je kamer.
      status: correct
    - value: Mijn kamer is kleiner dan je kamer
      status: correct
    feedback: 'جمله درست این است: *Mijn kamer is kleiner dan jouw kamer.*'
    prompt_blocks:
    - 'به هالندی بنویسین و از صفت تفضیلی و dan استفاده کنید: اتاق من از اتاق تو کوچک‌تر است.'
  nl.a2.unit99.lesson02.exercise01.choose_duurste:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Dit is de duurste telefoon.
    distractors:
    - Dit is de duurder telefoon.
    - Dit is duurste telefoon.
    - Dit is de goedkoopste telefoon.
    accepted_answers:
    - value: Dit is de duurste telefoon.
      status: correct
    feedback: 'پیش از اسم، صفت عالی با -ste تمام می‌شود: *de duurste telefoon*.'
    prompt_blocks:
    - این گران‌ترین تلفون است.
  nl.a2.unit99.lesson02.exercise02.choose_goedkoopst:
    instruction: جملهٔ هالندی را که با جملهٔ دری مطابقت دارد، انتخاب کنید.
    correct_option: Van alle hotels is dit hotel het goedkoopst.
    distractors:
    - Van alle hotels is dit hotel goedkoper.
    - Van alle hotels is dit hotel het goedkoper.
    - Van alle hotels is dit hotel het duurst.
    accepted_answers:
    - value: Van alle hotels is dit hotel het goedkoopst.
      status: correct
    feedback: '*Het goedkoopst* = ارزان‌ترین. شکل تفضیلی مثل *goedkoper* با *dan* می‌آید، نه با *van alle*.'
    prompt_blocks:
    - از میان همهٔ هوتل‌ها، این هوتل ارزان‌ترین است.
  nl.a2.unit99.lesson02.exercise03.match_superlatief:
    instruction: هر صفت را با شکل عالی‌اش جور کنید.
    accepted_answers:
    - value:
      - left: groot
        right: het grootst
      - left: klein
        right: het kleinst
      - left: mooi
        right: het mooist
      - left: duur
        right: het duurst
      - left: goedkoop
        right: het goedkoopst
      - left: lang
        right: het langst
      - left: goed
        right: het best
      - left: veel
        right: het meest
      status: correct
    feedback: 'منظم: -st را اضافه کنید. بی‌قاعده: goed - het best, veel - het meest.'
    pairs:
    - left: groot
      right: het grootst
    - left: klein
