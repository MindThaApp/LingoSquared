teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: بازار، دکان، غرفه
    gloss: بازار، دکان، غرفه
    note: '*De markt* می‌تواند یک بازار به‌طور کلی یا یک بازار روباز همیشگی باشد. *De winkel* دکان است. *Kraam* یک غرفه در بازار روباز است.'
    example_gloss:
    - من به بازار می‌روم.
    - من به دکان می‌روم.
    - غرفه سیب می‌فروشد.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: سیب، ناک، بادنجان رومی، مرچ دلمه
    gloss: سیب‌ها، ناک‌ها، بادنجان‌های رومی، مرچ‌های دلمه
    note: مفرد *appel* است؛ جمع آن *appels* است. مفرد *peer* است؛ جمع آن *peren* است. مفرد *tomaat* است؛ جمع آن *tomaten* است. در هلندی *paprika* یعنی مرچ دلمه؛ جمعی که نوشته می‌شود *paprika's* است.
    example_gloss:
    - من سیب می‌خواهم.
    - من ناک می‌خواهم.
    - من بادنجان رومی می‌خواهم.
    - من مرچ دلمه می‌خواهم.
  nl.a1.unit07.lesson02.teach.kilo:
    title: یک کیلو
    gloss: یک کیلو
    note: '*Een kilo* یک کیلوگرام است.'
    example_gloss: من یک کیلو سیب می‌خواهم.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: فی کیلو
    note: در بازار اکثراً قیمت را فی کیلو می‌نویسند.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: یک کیلو سیب چند است؟
    gloss: یک کیلو سیب چند تمام می‌شود؟
    note: '*Hoeveel kost ...?* قیمت را می‌پرسد. اینجا چیزی که قیمت دارد *een kilo* است، پس *kost* به شکل مفرد به کار می‌رود.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: یک کیلو سیب €2.50 است
    gloss: یک کیلو سیب €2.50 تمام می‌شود.
    note: 'در هلندی قیمت‌ها با ممیز (کاما) نوشته می‌شوند: €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: دو یورو و پنجاه
    gloss: €2.50 — دو یورو و پنجاه
    note: €2,50 را معمولاً *twee euro vijftig* می‌گویند، بدون *en* و *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: گرام، نیم کیلو، یک دانه، دو دانه
    gloss: صد گرام، نیم کیلو = 500 گرام، یک دانه، دو دانه
    note: بعد از عدد، در هلندی اینجا *gram* می‌آید، نه *grammen*. در هلندی روزمره *een pond* یعنی 500 گرام؛ این یک اصطلاح قدیمی و غیررسمی است و واحد رسمی متریک نیست. *Per stuk* یعنی هر دانه قیمت جداگانه دارد؛ بعد از عددهای بیشتر از یک، وقتی تعداد را به‌تنهایی می‌گویید، *stuks* به کار می‌رود، مثل *twee stuks*.
    example_gloss:
    - من صد گرام پنیر می‌خواهم.
    - نیم کیلو سیب، لطفاً.
    - لطفاً یکی بتین؟
    - دوتا می‌خواهم، لطفاً.
  nl.a1.unit07.lesson03.teach.how_much:
    title: چقدر می‌خواهین؟
    gloss: چقدر می‌خواهین؟
    note: فروشنده از *u* محترمانه استفاده می‌کند. *Hoeveel* هم برای وزن و هم برای تعداد به کار می‌رود.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: نیم کیلو تماتر، لطفاً
    gloss: نیم کیلو (۵۰۰ گرام) تماتر، لطفاً.
    note: وقتی دکان‌دار می‌پرسد *Hoeveel wilt u?*، این یک جواب کوتاه، کامل و طبیعی است.
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: برچسب قیمت
    gloss: برچسب قیمت
    note: '*Prijskaartje* یک کلمهٔ یکجا نوشته می‌شود. این‌جا تمام کلمه را یاد بگیرین.'
    example_gloss: برچسب قیمت ۲٫۵۰ یورو را نشان می‌دهد.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: برچسب‌های قیمت در بازار
    gloss: 'سیب: فی کیلو ۲٫۵۰ یورو. ناک: فی کیلو ۳٫۰۰ یورو. تماتر: فی کیلو ۲٫۰۰ یورو. مرچ دلمه: فی دانه ۱٫۰۰ یورو.'
    note: '*per kilo* را «فی کیلو» و *per stuk* را «فی دانه» بخوانین. در برچسب‌های هالندی، در قیمت‌ها به‌جای نقطه، کاما نوشته می‌شود.'
    glosses:
      Appels: سیب‌ها
      kilo: کیلوگرام
      Peren: ناک
      Tomaten: تماتر
      stuk: دانه / تکه
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: چی میل دارید؟
    gloss: چه می‌خواهین؟
    note: '*Wat mag het zijn?* سوال دوستانه و معمولی دکان‌دار یا کارمند دکان در بازار است.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: پس یک کیلو ناک می‌گیرم
    gloss: پس یک کیلو ناک می‌گیرم، لطفاً.
    note: '*Dan neem ik ...* طرز طبیعی گفتن این است که بعد از شنیدن قیمت، تصمیم خریدن می‌گیرین.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: چیز دیگری هم؟
    gloss: چیز دیگر؟
    note: یک سوال کوتاه و معمول دکان‌دار بعد از سفارش.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: نه، تشکر
    gloss: نه، تشکر.
    note: '*Dank u* با شکل محترمانهٔ *u* که با دکان‌دار استفاده می‌شود، هماهنگ است.'
  nl.a1.unit07.lesson05.teach.total:
    title: جمعاً ۳٫۰۰ یورو می‌شود
    gloss: جمعاً ۳٫۰۰ یورو می‌شود — سه یورو.
    note: '*Dat is dan ...* طرز معمول دکان‌دار برای گفتن مجموع پول است. قیمت نوشته‌شدهٔ €3,00 به صورت *drie euro* خوانده می‌شود.'
  nl.a1.unit07.lesson05.teach.pin:
    title: می‌توانم با کارت پول بدهم؟
    gloss: آیا می‌توانم با کارت پرداخت کنم؟
    note: '*Pinnen* فعل روزمرهٔ هالندی برای پرداخت با کارت بانکی یا اعتباری در دستگاه پرداخت است.'
  nl.a1.unit07.lesson06.teach.opening:
    title: سلام و پرسیدن قیمت
    gloss: 'دکان‌دار: روز بخیر. چی میل دارید؟ لوته: روز بخیر. یک کیلو سیب چند می‌شود؟'
    note: این یک گفتگوی دوستانه و مؤدبانه بین مشتری و دکان‌دار است.
  nl.a1.unit07.lesson06.teach.purchase:
    title: انتخاب مقدار
    gloss: 'دکان‌دار: فی کیلو دو یورو و پنجاه سنت. لوته: پس یک کیلو می‌گیرم، لطفاً.'
    note: چون از جملهٔ قبلی معلوم است که صحبت از سیب است، لوته می‌تواند فقط بگوید *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: پرداخت با کارت
    gloss: 'دکان‌دار: جمعاً دو یورو و پنجاه سنت می‌شود. لوته: می‌توانم با کارت پول بدهم؟ دکان‌دار: بلی، البته.'
    note: '*Kan ik pinnen?* سوال عملی و معمول هنگام پرداخت پول است.'
  nl.a1.unit07.lesson06.teach.closing:
    title: ختم گفتگو
    gloss: 'لوته: تشکر. خدا حافظ! دکان‌دار: خدا حافظ!'
    note: '*Tot ziens* برای ختم این گفتگوی مؤدبانهٔ خدماتی مناسب است.'
