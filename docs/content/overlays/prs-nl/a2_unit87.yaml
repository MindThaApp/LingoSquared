course:
  title: هالندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای صحبت دربارهٔ قواعد و اجازه.
  learning_goal: بپرس که آیا چیزی اجازه است و بگو چه چیز باید یا لازم نیست انجام شود، با mogen، moeten و hoeven niet te.
units:
  nl.a2.unit87.wat_mag_en_moet:
    title: چه چیز اجازه است و چه چیز لازم است
    description: با mogen، moeten و hoeven niet te اجازه بخواه و مقررات داخلی را بیان کن.
lessons:
  nl.a2.unit87.lesson01.mag_dat:
    title: این اجازه است؟
  nl.a2.unit87.lesson02.dat_moet:
    title: این لازم است
  nl.a2.unit87.lesson03.hoeven_niet_te:
    title: این ضرورت نیست
  nl.a2.unit87.lesson04.zwembad_en_sportschool:
    title: حوض شنا و ورزشگاه
  nl.a2.unit87.lesson05.huisregels_bibliotheek:
    title: مقررات داخلی کتابخانه
  nl.a2.unit87.lesson06.lotte_en_omar:
    title: لوته و عمر در ورزشگاه
teaching:
  nl.a2.unit87.lesson01.teach.plekken:
    title: جاهایی که قاعده دارند
    gloss: کتابخانه / حوض شنا / ورزشگاه
    note: این‌ها سه جایی استند که قاعده‌ها در آن مهم است.
    example_gloss:
    - من در کتابخانه کتاب می‌خوانم.
    - نور در حوض شنا شنا می‌کند.
    - عمر در ورزشگاه است.
  nl.a2.unit87.lesson01.teach.handelingen:
    title: کارهایی که اجازه دارید یا ندارین
    gloss: شنا کردن / غذا خوردن / تیلفون کردن / سیگار کشیدن / امانت گرفتن
    note: فعل‌های هلندی در مصدر به -en ختم می‌شوند. مصدر شکلی است که در آخر جمله می‌آید.
    example_gloss:
    - می‌خواهم در حوض شنا شنا کنم.
    - لوته می‌خواهد یک ساندویچ بخورد.
    - نور به عمر تیلفون می‌کند.
    - عمر سیگار نمی‌کشد.
    - من یک کتاب امانت می‌گیرم.
  nl.a2.unit87.lesson01.teach.plaatsen:
    title: اینجا، داخل، بیرون
    gloss: اینجا / داخل / بیرون
    note: قاعده‌ها اغلب به جا بستگی دارند.
    example_gloss:
    - من اینجا هستم.
    - داخل گرم است.
    - بیرون باران می‌بارد.
  nl.a2.unit87.lesson01.teach.gn_mogen:
    title: 'Mogen: اجازه داشتن'
    gloss: من اجازه دارم / تو اجازه داری / او اجازه دارد / ما اجازه داریم / شما اجازه دارید / آن‌ها اجازه دارند
    note: '*Mogen* یعنی اجازه داشتن. همهٔ شکل‌های مفرد *mag* استند: *ik mag, jij mag, je mag, hij mag*. شکل جمع *mogen* است.'
  nl.a2.unit87.lesson01.teach.gn_tweede_plaats:
    title: فعل کمکی در جایگاه دوم، مصدر در آخر
    gloss: من اجازه دارم اینجا شنا کنم. آیا اجازه دارم اینجا شنا کنم؟
    note: 'در جملهٔ خبری فعل کمکی در جایگاه دوم می‌آید و مصدر به آخر جمله می‌رود: *Ik mag hier zwemmen.* در پرسش بلی/نخیر فعل کمکی اول می‌آید، اما مصدر باز هم در آخر است: *Mag ik hier zwemmen?*'
  nl.a2.unit87.lesson01.teach.antwoorden:
    title: جواب‌های کوتاه
    gloss: بلی، این اجازه است. نه، این اجازه نیست.
  nl.a2.unit87.lesson01.teach.vragen:
    title: اجازه خواستن
    gloss: آیا اجازه دارم اینجا غذا بخورم؟ آیا اجازه دارم اینجا تیلفون کنم؟ آیا اجازه دارم اینجا سیگار بکشم؟
  nl.a2.unit87.lesson02.teach.regels:
    title: قاعده‌ها و کارت‌ها
    gloss: قاعده / مقررات داخلی / کارت
    note: '*Huisregels* جمع است: همهٔ قاعده‌های یک ساختمان را نام می‌برد.'
    example_gloss:
    - این یک قاعده است.
    - مقررات داخلی را بخوان.
    - کارتم را دارم.
  nl.a2.unit87.lesson02.teach.handeling2:
    title: کارهایی که باید بکنین
    gloss: پرداخت کردن / نشان دادن / دوش گرفتن
    note: '*Laten zien* دو کلمه است. با هم یعنی نشان دادن.'
    example_gloss:
    - عمر با کارتش پرداخت می‌کند.
    - می‌خواهم کارتم را نشان بدهم.
    - لوته می‌خواهد اول دوش بگیرد.
  nl.a2.unit87.lesson02.teach.afval:
    title: جدا کردن خاکروبه
    gloss: خاکروبه / جدا کردن
    note: در هالند زباله به شیشه، کاغذ و پلاستیک جدا می‌شود.
    example_gloss:
    - ما زباله را جدا می‌کنیم.
    - شما باید شیشه، کاغذ و پلاستیک را جدا کنید.
  nl.a2.unit87.lesson02.teach.materialen:
    title: مواد
    gloss: کاغذ / شیشه / پلاستیک
    note: زباله به اساس مواد جدا می‌شود.
    example_gloss:
    - این کاغذ است.
    - این شیشه است.
    - این پلاستیک است.
  nl.a2.unit87.lesson02.teach.gn_moeten:
    title: 'Moeten: باید'
    gloss: من باید / تو باید / او باید / ما باید / شما باید / آن‌ها باید
    note: '*Moeten* یعنی باید یا مجبور بودن. همهٔ شکل‌های مفرد *moet* است: *ik moet, jij moet, je moet, hij moet*. شکل جمع *moeten* است.'
  nl.a2.unit87.lesson02.teach.gn_moeten_zin:
    title: Moeten مثل mogen کار می‌کند
    gloss: تو باید کارتت را نشان بدهی. آیا من باید پول بدهم؟
    note: '*Moeten* مثل *mogen* رفتار می‌کند: در جملهٔ خبری در جای دوم می‌آید (بعد از اولین بخش جمله)، سؤال بلی/نخیر را شروع می‌کند و مصدر در آخر می‌آید. با *laten zien* هر دو کلمه با هم در آخر جمله می‌مانند.'
  nl.a2.unit87.lesson02.teach.zinnen:
    title: دو قاعده
    gloss: من باید کارتم را نشان بدهم. ما باید زباله را جدا کنیم.
  nl.a2.unit87.lesson03.teach.tijd:
    title: امروز، حالا، همیشه
    gloss: امروز / حالا / همیشه
    note: این کلمه‌ها اکثراً در قاعده‌ها می‌آیند.
    example_gloss:
    - حوض شنا امروز باز است.
    - من حالا در باشگاه ورزشی استم.
    - عمر همیشه سر وقت است.
  nl.a2.unit87.lesson03.teach.gn_hoeven:
    title: 'Hoeven: لازم نبودن'
    gloss: من لازم ندارم / تو لازم نداری / او لازم ندارد / ما لازم نداریم / شما لازم ندارین / آن‌ها لازم ندارند
    note: '*Hoeven* معمولاً با *niet* یا *geen* و *te* + مصدر استفاده می‌شود. یعنی کاری لازم نیست. شکل‌ها این است: *ik hoef, jij hoeft, hij hoeft, wij hoeven*. در سؤال بعد از *jij* حرف -t می‌افتد: *hoef jij*.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_niet_te:
    title: Hoeven niet te + مصدر
    gloss: تو لازم نیست پول بدهی. آیا امروز لازم نیست پول بدهم؟
    note: '*Niet te* را درست پیش از مصدر بگذارین: *Je hoeft niet te betalen.* فعل کمکی *hoeft* در جای دوم است و *te* + مصدر در آخر می‌آید.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_geen:
    title: Niet یا geen
    gloss: تو لازم نیست کارتت را نشان بدهی. تو لازم نیست کارت نشان بدهی.
    note: 'بعد از مفعول معین مثل *je kaart*، *niet* بعد از مفعول می‌آید: *Je hoeft je kaart niet te laten zien.* با اسم نامعین از *geen* استفاده کنید: *Je hoeft geen kaart te laten zien.* *Te* پیش از *laten zien* می‌آید.'
  nl.a2.unit87.lesson03.teach.gn_contrast:
    title: ضروری، اختیاری، ممنوع
    gloss: این ضروری است. این لازم نیست. این ممنوع است. این مجاز است.
    note: '*Dat moet* = ضروری است. *Dat hoeft niet* = لازم نیست، می‌توانین انتخاب کنید. *Dat mag niet* = ممنوع است. برای گفتن ممنوع بودن از *mag niet* استفاده کنید، نه از *hoeft niet*.'
  nl.a2.unit87.lesson04.teach.kleedkamer:
    title: کلمه‌های حوض شنا و باشگاه
    gloss: تولیه / اتاق تبدیل لباس / اول
    note: '*Eerst* یعنی اول و اکثراً با یک قاعده می‌آید.'
    example_gloss:
    - تولیهٔ من در اتاق تبدیل لباس است.
    - اول دوش بگیر، بعد شنا کن.
    - لوته اول به باشگاه می‌آید.
  nl.a2.unit87.lesson04.teach.gn_voorop:
    title: کلمهٔ دیگر در اول جمله
    gloss: اینجا خوردن ممنوع است. در حوض شنا اول باید دوش بگیری.
    note: 'می‌توانین جمله را با کلمهٔ مکان شروع کنید. فعل کمکی در جای دوم می‌ماند، پس فاعل بعد از آن می‌آید: *Hier mag je niet eten.* مصدر باز هم در آخر است.'
  nl.a2.unit87.lesson04.teach.gn_vraagwoord:
    title: کلمه‌های پرسشی
    gloss: من چه کار باید بکنم؟ کجا خوردن اجازه دارم؟
    note: 'کلمهٔ پرسشی اول می‌آید. بعد فعل کمکی، بعد فاعل می‌آید و مصدر در آخر است: *Wat moet ik doen?* *Waar mag ik eten?*'
  nl.a2.unit87.lesson04.teach.scenario:
    title: در حوض شنا
    gloss: اینجا اجازه دارم شنا کنم؟ بلی، اول باید دوش بگیری.
  nl.a2.unit87.lesson05.teach.nieuw:
    title: نو، سه، آمدن
    gloss: نو / سه / آمدن
    note: 'بعد از *de* یا *het* صفت -e می‌گیرد: *nieuw* در *de nieuwe bibliotheek* به *nieuwe* تبدیل می‌شود. *Boeken* جمع *boek* است.'
    example_gloss:
    - کتابخانهٔ نو خوب است.
    - من سه کتاب امانت می‌گیرم.
    - تو هم می‌آیی؟
  nl.a2.unit87.lesson05.teach.reading:
    title: پیامی برای لوته
    gloss: سلام لوته، من در کتابخانهٔ نو استم. باید کارتت را نشان بدهی. اجازه داری سه کتاب امانت بگیری. اینجا خوردن و تلفون کردن ممنوع است. لازم نیست پول بدهی. تو هم می‌آیی؟
    note: ببینین چه چیزی ضروری، چه چیزی مجاز، چه چیزی ممنوع و چه چیزی لازم نیست.
    glosses:
      nieuwe: نو
      drie: سه
      boeken: کتاب‌ها
      lenen: امانت گرفتن
      betalen: پرداخت کردن
  nl.a2.unit87.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، من در باشگاه ورزشی نو استم. من چه کار باید بکنم؟'
  nl.a2.unit87.lesson06.teach.omar_kaart:
    title: عمر قاعدهٔ اول را می‌گوید
    gloss: 'عمر: اول باید کارتت را نشان بدهی.'
  nl.a2.unit87.lesson06.teach.lotte_bellen:
    title: لوته اجازه می‌خواهد
    gloss: 'لوته: اینجا تلفون کرده می‌توانم؟'
  nl.a2.unit87.lesson06.teach.omar_buiten:
    title: عمر نخیر می‌گوید
    gloss: 'عمر: نخیر، ممنوع است. باید بیرون تلفون کنی.'
  nl.a2.unit87.lesson06.teach.lotte_betalen:
    title: لوته دربارهٔ پول دادن می‌پرسد
    gloss: 'لوته: امروز باید پول بدهم؟'
  nl.a2.unit87.lesson06.teach.omar_hoeft:
    title: Omar جواب می‌دهد
    gloss: 'عمر: نخیر، امروز لازم نیست پول بدهی.'
exercises:
  nl.a2.unit87.lesson01.exercise01.choose_eat:
    instruction: سؤال هالندی را انتخاب کنید.
    correct_option: Mag ik hier eten?
    distractors:
    - Mag eten ik hier?
    - Ik hier mag eten?
    - Mag hier ik eten?
    accepted_answers:
    - value: Mag ik hier eten?
      status: correct
    feedback: در سؤال بلی/نخیر فعل کمکی *mag* اول می‌آید و مصدر *eten* در آخر می‌ایستد.
    prompt_blocks:
    - آیا اجازه دارم اینجا غذا بخورم؟
  nl.a2.unit87.lesson01.exercise02.choose_no:
    instruction: جواب هالندی را انتخاب کنید.
    correct_option: Nee, dat mag niet.
    distractors:
    - Ja, dat mag.
    - Nee, dat mag.
    - Nee, dat niet mag.
    accepted_answers:
    - value: Nee, dat mag niet.
      status: correct
    feedback: '*Nee, dat mag niet* جواب کوتاه برای ممنوع بودن است.'
    prompt_blocks:
    - نه، این اجازه نیست.
  nl.a2.unit87.lesson01.exercise03.match_words:
