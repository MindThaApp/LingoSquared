  nl.a2.unit87.lesson01.exercise04.order_swim:
    instruction: کلمه‌ها را مرتب کنید تا بگویین «من اینجا اجازه دارم شنا کنم.»
    correct_option: Ik mag hier zwemmen
    accepted_answers:
    - value: Ik mag hier zwemmen
      status: correct
    - value: Hier mag ik zwemmen
      status: correct
    feedback: '*Ik mag hier zwemmen*: فعل کمکی در جای دوم و مصدر در آخر است. *Hier mag ik zwemmen* هم درست است.'
  nl.a2.unit87.lesson01.exercise05.complete_mogen:
    instruction: 'با شکل جمع درست فعل «اجازه داشتن» کامل کنید: ما اجازه داریم اینجا شنا کنیم.'
    correct_option: mogen
    accepted_answers:
    - value: mogen
      status: correct
    feedback: با *wij* شکل جمع *mogen* است.
  nl.a2.unit87.lesson01.exercise06.translate_smoke:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Mag ik hier roken?
      status: correct
    - value: Mag ik hier roken
      status: correct
    feedback: '*Mag ik hier roken?* مصدر *roken* در آخر است.'
    prompt_blocks:
    - آیا اجازه دارم اینجا سیگار بکشم؟
  nl.a2.unit87.lesson01.exercise07.write_call:
    instruction: سؤال خواسته‌شده را با mag بنویسین.
    correct_option: Mag ik hier bellen?
    accepted_answers:
    - value: Mag ik hier bellen?
      status: correct
    - value: Mag ik hier bellen
      status: correct
    feedback: '*Mag ik hier bellen?* = اینجا تلفون کرده می‌توانم؟'
    prompt_blocks:
    - 'به هلندی بنویس: بپرس که آیا اجازه داری اینجا تیلفون کنی.'
  nl.a2.unit87.lesson02.exercise01.choose_card:
    instruction: جملهٔ خبری هالندی را انتخاب کنید.
    correct_option: Je moet je kaart laten zien.
    distractors:
    - Je moet laten zien je kaart.
    - Je laten zien moet je kaart.
    - Je moeten je kaart laten zien.
    accepted_answers:
    - value: Je moet je kaart laten zien.
      status: correct
    feedback: فعل کمکی *moet* در جای دوم است و *laten zien* در آخر می‌ایستد.
    prompt_blocks:
    - تو باید کارتت را نشان بدهی.
  nl.a2.unit87.lesson02.exercise02.choose_waste:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: Wij moeten het afval scheiden.
    distractors:
    - Wij moet het afval scheiden.
    - Wij moeten scheiden het afval.
    - Wij mogen het afval scheiden.
    accepted_answers:
    - value: Wij moeten het afval scheiden.
      status: correct
    feedback: با *wij* شکل *moeten* است و مصدر *scheiden* در آخر می‌آید.
    prompt_blocks:
    - ما باید خاکروبه را جدا کنیم.
  nl.a2.unit87.lesson02.exercise03.match_words:
    instruction: هر کلمهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: de kaart
        right: کارت
      - left: de regel
        right: قاعده
      - left: de huisregels
        right: مقررات داخلی
      - left: het afval
        right: زباله
      - left: het papier
        right: کاغذ
      - left: het glas
        right: شیشه
      - left: betalen
        right: پرداخت کردن
      - left: scheiden
        right: جدا کردن
      - left: douchen
        right: دوش گرفتن
      status: correct
    feedback: این کلمه‌ها به قاعده‌های خانه و جدا کردن زباله تعلق دارند.
