teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: ساعت
    gloss: ساعت
    note: '*Uur* برای ساعتِ تمام بعد از عدد می‌آید: *twee uur* یعنی ساعت دو.'
    example_gloss: ساعت دو است.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: ساعت دو
    gloss: 2:00 — ساعت دو
    note: برای ساعت تمام، عدد را بگویین و بعد از آن *uur* را بیاورید.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: ساعت سه
    gloss: 3:00 — ساعت سه
    note: '*Drie uur* درست ساعت 3:00 است.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: نیمه‌راه به سمت سه
    gloss: 2:30 — دو و نیم
    note: 'فرق مهم: در دری «دو و نیم» از ساعتِ گذشته شمرده می‌شود، اما در هلندی *half drie* به ساعتِ بعدی اشاره می‌کند. یعنی 2:30 است، نه 3:30.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half به ساعت بعدی اشاره می‌کند
    gloss: نیمه‌راه به سمت ساعت سه = 2:30
    note: '*half* + ساعت را نیمه‌راه به سمت همان ساعت بخوانین. پس *half vier* یعنی 3:30.'
  nl.a1.unit04.lesson01.teach.half_four:
    title: نیمه‌راه به سمت چهار
    gloss: 3:30 — سه و نیم
    note: '*Half vier* نیمه‌راه به سمت چهار است، پس معنایش 3:30 است.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: گفتن نیم ساعت
    gloss: ساعت دو و نیم است.
    note: '*Het is ...* قالب معمول برای گفتن وقتِ حالا است.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: ربع ساعت
    gloss: ربع ساعت
    note: '*Kwart* در عبارت‌های ثابت ساعت یعنی *kwart over* و *kwart voor* به کار می‌رود.'
    example_gloss: یک ربع ساعت پانزده دقیقه است.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: دو و ربع
    gloss: 2:15 — دو و ربع
    note: '*Kwart over twee* یعنی پانزده دقیقه بعد از ساعت دو.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: over یعنی «بعد از»
    gloss: گذشته = بعد از ساعت تمام
    note: در عبارت‌های ساعت، *over* از ساعتی که تازه گذشته به جلو می‌شمارد.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: ربع کم سه
    gloss: 2:45 — ربع کم سه
    note: '*Kwart voor drie* پانزده دقیقه پیش از ساعت سه است، پس 2:45 می‌شود.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: voor یعنی «به» (کم)
    gloss: کم = پیش از ساعت تمامِ بعدی
    note: در عبارت‌های ساعت، *voor* به ساعتِ بعدی اشاره می‌کند.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: سه و ربع
    gloss: 3:15 — سه و ربع
    note: 'کلمهٔ *over* ساعتی را نگه می‌دارد که تازه گذشته است: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: ساعت چهار بجه، پانزده دقیقه کم
    gloss: ۳:۴۵ — پانزده دقیقه کم چهار
    note: 'کلمهٔ *voor* ساعتی را نشان می‌دهد که نزدیک می‌شود: *kwart voor vier* یعنی ۳:۴۵.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: پرسیدن وقت
    gloss: ساعت چند است؟
    note: '*Hoe laat is het?* سوال معمولی و روزمره برای پرسیدن وقت حالا است.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: گفتن وقت
    gloss: ساعت دو و نیم است.
    note: یادت باشد که در هلندی با کلمهٔ ساعت *drie* این وقت ۲:۳۰ می‌شود، نه ۳:۳۰.
  nl.a1.unit04.lesson03.teach.ask_start:
    title: پرسیدن از شروع یک برنامه
    gloss: کافهٔ زبان ساعت چند شروع می‌شود؟
    note: '*Hoe laat* سوالی را شروع می‌کند که وقت ساعت را می‌پرسد.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: ساعت دو و پانزده دقیقه
    gloss: ساعت دو و پانزده دقیقه.
    note: وقتی می‌گویی یک رویداد کی اتفاق می‌افتد، پیش از وقت *om* را بگذار.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: استفاده از om برای وقت رویداد
    gloss: 'در + وقت: ساعت دو، ساعت دو و نیم'
    note: وقتی فقط وقت حالا را با *Het is* می‌گویی، *om* استفاده نکن.
  nl.a1.unit04.lesson03.teach.late:
    title: پرسیدن که دیر کرده‌ای یا نه
    gloss: آیا من دیر کرده‌ام؟
    note: '*Laat* در اینجا یعنی دیر؛ این جمله در گفتگو دربارهٔ وقت طبیعی است.'
  nl.a1.unit04.lesson03.teach.on_time:
    title: گفتن اینکه کسی به وقت رسیده
    gloss: نه، تو به وقت آمده‌ای.
    note: '*Op tijd* یعنی به وقت. *Je* گفتگو را غیررسمی نگه می‌دارد.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: چهارده
    gloss: ۱۴:۰۰ — ساعت چهارده
    note: در جدول‌ها و اعلان‌ها معمولاً ساعت ۲۴ ساعته استفاده می‌شود. *Veertien uur* خواندن شفاهی و روشن ۱۴:۰۰ است.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: هجده
    gloss: ۱۸:۰۰ — ساعت هجده
    note: '*Achttien uur* شکل ساعت ۲۴ ساعته برای ساعت شش شام است.'
  nl.a1.unit04.lesson04.teach.morning:
    title: ساعت هفت صبح
    gloss: ۷:۰۰ — ساعت هفت صبح
    note: '*''s Ochtends* یعنی صبح‌ها. *''s* در آغاز، بخشی از این عبارت ثابت است.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: ساعت دو بعد از چاشت
    gloss: ۱۴:۰۰ — ساعت دو بعد از چاشت
    note: '*''s Middags* بعد از چاشت را می‌رساند که از حدود ظهر شروع می‌شود؛ در گفتار ۱۲ ساعته ۱۴:۰۰ را از ۰۲:۰۰ جدا می‌کند.'
  nl.a1.unit04.lesson04.teach.evening:
    title: ساعت هشت شب
    gloss: ۲۰:۰۰ — ساعت هشت شب
    note: '*''s Avonds* برای وقت شام و شب استفاده می‌شود، تقریباً از آخر بعد از چاشت تا نزدیک نیمه‌شب.'
  nl.a1.unit04.lesson04.teach.night:
    title: ساعت دو نیمه‌شب
    gloss: ۲:۰۰ — ساعت دو نیمه‌شب
    note: '*''s Nachts* برای ساعت‌های شب استفاده می‌شود؛ ساعت ۰۲:۰۰ طبیعتاً *twee uur ''s nachts* است.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: بخش‌های روز
    gloss: صبح · بعد از چاشت · شام · شب
    note: 'مرزهای این کلمه‌ها در هلندی تقریبی است: *ochtend* تا حدود ظهر می‌رود، *middag* از ظهر تا آخر بعد از چاشت، *avond* تا آخر شام، و *nacht* وقت‌های شب را می‌گیرد.'
    example_gloss:
    - من صبح چای قهوه می‌نوشم.
    - کافهٔ زبان بعد از چاشت است.
    - من شام کتاب می‌خوانم.
    - من شب می‌خوابم.
  nl.a1.unit04.lesson05.teach.schedule:
    title: جدول زمانی
    gloss: تقسیم اوقات
    note: '*Rooster* فهرست فعالیت‌ها و وقت‌های آن‌ها است.'
    example_gloss: من تقسیم اوقات را می‌خوانم.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: ساعت‌های باز بودن کافهٔ زبان
    gloss: 'کافهٔ زبان باز است: ۱۴:۰۰–۱۶:۰۰'
    note: در جدول‌های هلندی اغلب بین ساعت و دقیقه نقطه می‌گذارند، اما در دری معمولاً دو نقطه می‌نویسیم؛ ۱۴.۰۰ همان ۱۴:۰۰ است.
  nl.a1.unit04.lesson05.teach.welcome:
    title: وقت خوش‌آمدی
    gloss: ۱۴:۱۵ خوش‌آمدی
    note: ۱۴.۱۵ را در گفتار روزمرهٔ ۱۲ ساعته می‌توان *kwart over twee* گفت.
  nl.a1.unit04.lesson05.teach.workshop:
    title: وقت ورکشاپ
    gloss: ۱۴:۴۵ ورکشاپ
    note: '۱۴.۴۵ می‌شود *kwart voor drie*: پانزده دقیقه پیش از سه.'
  nl.a1.unit04.lesson05.teach.break:
    title: وقت تفریح
    gloss: ۱۵:۳۰ تفریح
    note: ۱۵.۳۰ می‌شود *half vier*، یعنی نیمه‌راه به‌طرف چهار، نه چهار و نیم.
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: پرسیدن وقت در جدول
    gloss: کارگاه چه وقت شروع می‌شود؟
    note: '*Begint* می‌پرسد که فعالیت کی شروع می‌شود.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: گفتن وقت ورکشاپ
    gloss: ساعت سه، پانزده دقیقه کم.
    note: ۱۴.۴۵ در جدول با *kwart voor drie* برابر است.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: تایید وقت کافهٔ زبان
    gloss: 'لوته: کافهٔ زبان روز جمعه ساعت چند شروع می‌شود؟ عمر: ساعت دو و پانزده دقیقه، یعنی ساعت ۱۴:۱۵.'
    note: 'عمر هر دو شکل را صریح می‌گوید: *kwart over twee* و ۱۴.۱۵ یک وقت‌اند، مطابق وقت خوش‌آمدی در جدول.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: پرسیدن دربارهٔ ورکشاپ
    gloss: 'لوته: و ورکشاپ ساعت چند شروع می‌شود؟ عمر: ساعت سه، پانزده دقیقه کم.'
    note: '*Kwart voor drie* یعنی ۱۴:۴۵، مطابق جدول.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: گفتن وقت رسیدن
    gloss: 'لوته: خوب. پس من ساعت دو آنجا می‌باشم.'
    note: لوته می‌خواهد ساعت ۱۴:۰۰ برسد، یعنی پانزده دقیقه پیش از شروع ۱۴:۱۵.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: تمام کردن قرار
    gloss: 'عمر: عالی، جمعه بعد از چاشت می‌بینمت!'
    note: '*Vrijdagmiddag* یک کلمهٔ مرکب طبیعی است به معنی جمعه بعد از چاشت.'
