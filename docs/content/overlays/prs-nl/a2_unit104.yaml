course:
  title: هالندی A2
  description: دستور زبان هالندی سطح A2 برای اشاره دوباره به کسان و چیزها.
  learning_goal: با ضمیرهای مفعولی و er به کسان و چیزها اشاره کنید، بدون اینکه آن‌ها را تکرار کنید.
units:
  nl.a2.unit104.hem_haar_ze_er:
    title: او، آن‌ها و er
    description: از ضمیرهای مفعولی و er (با عددها و حرف‌های اضافه) کار بگیرین تا بدون تکرار دربارهٔ تحفه‌ها، قرض گرفتن و پس دادن چیزها حرف بزنید.
lessons:
  nl.a2.unit104.lesson01.cadeaus_en_boeken:
    title: تحفه‌ها و کتاب‌ها
  nl.a2.unit104.lesson02.hem_haar_het_ze:
    title: Hem, haar, het و ze
  nl.a2.unit104.lesson03.mij_of_me:
    title: Mij یا me؟ Jou یا je؟
  nl.a2.unit104.lesson04.hoeveel_er:
    title: چند تا؟ Ik heb er drie
  nl.a2.unit104.lesson05.erover_ermee:
    title: Erover, ervan, ermee, ernaar
  nl.a2.unit104.lesson06.boeken_terugbrengen:
    title: پس دادن کتاب‌ها
teaching:
  nl.a2.unit104.lesson01.teach.plaatsen:
    title: جاها و جشن‌ها
    gloss: دکان / کتابخانه / روز تولد / جشن
    note: شاید این کلمه‌ها را از A1 بدانین؛ اینجا زمینهٔ تحفه دادن و قرض گرفتن را می‌سازند.
    example_gloss:
    - من به کتابخانه می‌روم.
    - نور جشن دارد.
    - در دکان یک تحفه می‌خرم.
  nl.a2.unit104.lesson01.teach.cadeaus:
    title: تحفه‌ها و چیزهای قرضی
    gloss: تحفه / کتاب / گل‌ها / قلم / چتری
    note: '*Het cadeau* و *het boek* کلمه‌های het استند؛ *de pen* و *de paraplu* کلمه‌های de استند. *De bloemen* جمع است.'
    example_gloss:
    - من برای نور یک تحفه دارم.
    - میشه قلمت را قرض بگیرم؟
    - من گل می‌خرم.
  nl.a2.unit104.lesson01.teach.werkwoorden:
    title: خریدن، دادن، قرض گرفتن، واپس آوردن
    gloss: خریدن / دادن / قرض گرفتن / واپس آوردن / واپس دادن
    note: '*Lenen* اینجا معنی قرض گرفتن را دارد. *Terugbrengen* و *teruggeven* فعل‌های جدا‌شدنی استند: *ik breng het terug*، *ik geef het terug*.'
    example_gloss:
    - من گل می‌خرم.
    - میشه قلم را قرض بگیرم؟
    - من کتاب را واپس می‌آرم.
    - من آن را واپس می‌دهم.
  nl.a2.unit104.lesson01.teach.vrienden:
    title: سه دوست
    gloss: لوته، عمر و نور دوست استند.
  nl.a2.unit104.lesson01.teach.gn_objectvormen:
    title: ضمیرهای مفعولی
    gloss: من → مرا؛ تو → ترا؛ او (مرد) → او را؛ او (زن) → او را؛ آن → آن را؛ ما → ما را؛ شما → شما را؛ آن‌ها → آن‌ها را
    note: 'بعد از فعل شکل مفعولی استفاده می‌شود: *Ik zie hem*. *Me/je/ze* شکل‌های عادیِ گفتاری استند؛ *mij/jou* شکل‌های تأکیدی استند. برای چند نفر یا چند چیز *ze* می‌گویید. *Hen* و *hun* هم وجود دارند، ولی بیشتر در نوشتار استفاده می‌شوند؛ در گفتار می‌توانین از آن‌ها دوری کنید.'
  nl.a2.unit104.lesson01.teach.gn_nadruk:
    title: با تأکید یا بدون تأکید
    gloss: من ترا می‌بینم. من ترا می‌بینم، نه او را. او مرا می‌بیند. او مرا می‌بیند، نه او (زن) را.
    note: '*Me* و *je* را به شکل عادی استفاده کنید. وقتی می‌خواهین روی یک نفر تأکید کنید یا او را با دیگری مقایسه کنید، *mij* و *jou* را بگویین.'
  nl.a2.unit104.lesson01.teach.zinnen:
    title: ضمیرها در جمله
    gloss: او به من یک تحفه می‌دهد. من به او گل می‌دهم. لوته ما را می‌بیند.
  nl.a2.unit104.lesson02.teach.spullen:
    title: چیزهای بیشتر و یک کلمهٔ پرسشی
    gloss: بایسکل / بیگ / کیک / کارت / کجا
    note: '*Taart* و *kaart* برای روز تولد و محفل‌ها به کار می‌آیند.'
    example_gloss:
    - بیگ کجاست؟
    - کیک برای محفل است.
    - من برای لوته یک کارت دارم.
  nl.a2.unit104.lesson02.teach.bezit:
    title: مال من و مال تو
    gloss: من، ـم / تو، ـت / از، مال
    note: '*Je* هم «تو/ترا» معنی می‌دهد و هم «ـت»: *Ik zie je* (ترا) و *je boek* (کتابت).'
    example_gloss:
    - من قلمم را دارم.
    - من کتابت را دارم.
    - کتاب نور.
  nl.a2.unit104.lesson02.teach.gn_het_hem:
    title: Het برای کلمه‌های het، hem برای کلمه‌های de
    gloss: کتاب؟ آن پیش من است. قلم؟ آن پیش من است. بیگ؟ آن را می‌بینم.
    note: 'برای چیزها، هالندی ضمیر را مطابق حرف تعریف انتخاب می‌کند: کلمهٔ *het* به *het* تبدیل می‌شود و کلمهٔ de در مفرد به *hem*. برای کلمهٔ de از het استفاده نکنین.'
  nl.a2.unit104.lesson02.teach.gn_ze:
    title: Ze برای جمع
    gloss: گل‌ها؟ من آن‌ها را می‌خرم. لوته و عمر؟ من آن‌ها را می‌بینم.
    note: '*Ze* در گفتار به بیشتر از یک چیز یا یک نفر اشاره می‌کند. *Hen* هم برای آدم‌ها وجود دارد، ولی بیشتر در نوشتار استفاده می‌شود.'
  nl.a2.unit104.lesson02.teach.zinnen:
    title: چهار ضمیر مفعولی
    gloss: من او (مرد) را می‌بینم. من او (زن) را می‌بینم. من آن را می‌بینم. من آن‌ها را می‌بینم.
  nl.a2.unit104.lesson03.teach.werkwoorden:
    title: فعل‌ها و حرف‌های اضافه با آدم‌ها
    gloss: زنگ زدن / کمک کردن / شناختن / برای / با
    note: '*Kennen* برای شناختن یک شخص است.'
    example_gloss:
    - من به تو زنگ می‌زنم.
    - به من کمک کرده می‌توانی؟
    - من او را نمی‌شناسم.
    - تحفه برای او (زن) است.
    - من با شما می‌روم.
  nl.a2.unit104.lesson03.teach.gn_contrast:
    title: Me/je یا mij/jou؟
    gloss: من به تو کمک می‌کنم. من به تو کمک می‌کنم، نه به او.
    note: 'معمولاً *me* و *je* را استفاده کنید. وقتی روی کسی تأکید می‌کنین یا او را با دیگری مقایسه می‌کنین، *mij* و *jou* را بگویین: *Ik help jou, niet hem.*'
  nl.a2.unit104.lesson03.teach.gn_voorzetsel:
    title: بعد از حرف اضافه
    gloss: تحفه برای من است. تحفه برای تو است. من با او (زن) می‌روم.
    note: بعد از حرف اضافه (*voor, met, naar, van*) شکل‌های معیار *mij* و *jou* استند. در گفتار بدون تأکید، *me* و *je* هم خیلی رایج استند (*voor me*، *met je*).
  nl.a2.unit104.lesson03.teach.gn_jullie:
    title: تو، شما، آن‌ها
    gloss: من به تو زنگ می‌زنم. من به شما زنگ می‌زنم. من به آن‌ها زنگ می‌زنم.
    note: '*Je* یک نفر است. *Jullie* بیشتر از یک نفر است که با او حرف می‌زنید. *Ze* بیشتر از یک نفر است که دربارهٔ آن‌ها حرف می‌زنید.'
  nl.a2.unit104.lesson04.teach.getallen:
    title: عددها و مقدار
    gloss: یک / دو / سه / چهار / پنج / هیچ، نی / چند
    note: '*Geen* معنی «هیچ» یا «نی» را دارد.'
    example_gloss:
    - من دو کتاب دارم.
    - من قلم ندارم.
    - تو چند کتاب داری؟
    - من سه قلم دارم.
  nl.a2.unit104.lesson04.teach.gn_er_getal:
    title: Er + عدد
    gloss: تو چند کتاب داری؟ من سه (تای آن) را دارم.
    note: 'وقتی نام چیز را نمی‌گویید و فقط عدد می‌دهین، *er* را پیش از عدد بگذارین: *Ik heb er drie.* بدون *er* جمله ناقص است.'
  nl.a2.unit104.lesson04.teach.gn_er_geen:
    title: Er + één / geen
    gloss: تو قلم داری؟ بلی، یکی دارم. تو بیگ داری؟ نی، هیچ ندارم.
    note: '*Een* با *er* به *één* تبدیل می‌شود و *geen* هم بعد از *er* می‌آید: *Ik heb er geen.*'
  nl.a2.unit104.lesson04.teach.gn_er_ze:
    title: Ze یا er؟
    gloss: کتاب‌ها؟ آن‌ها پیش من استند. کتاب؟ سه‌تا دارم.
    note: '*Ze* را برای چیزهای مشخص که هر دو می‌شناسید استفاده کنید. *Er* را وقتی استفاده کنید که تعداد آن‌ها را می‌گویید.'
  nl.a2.unit104.lesson04.teach.gn_er_kopen:
    title: Er با فعل‌های دیگر
    gloss: من می‌خواهم دوتای آن را بخرم. من پنج‌تای آن را قرض می‌گیرم.
    note: '*Er* نزدیک فعل می‌ماند. با *willen* پیش از عدد و مصدر می‌آید: *Ik wil er twee kopen.*'
  nl.a2.unit104.lesson05.teach.werkwoorden:
    title: فعل‌ها با حرف اضافه
    gloss: صحبت کردن / نگاه کردن / نوشتن / دوست داشتن، گرفتن / خوش / دربارهٔ / به
    note: '*Praten over* = دربارهٔ چیزی صحبت کردن، *kijken naar* = به چیزی نگاه کردن، *schrijven met* = با چیزی نوشتن، *houden van* = دوست داشتن، *blij zijn met* = از چیزی خوش بودن.'
    example_gloss:
    - من دربارهٔ تحفه صحبت می‌کنم.
    - من به کتاب نگاه می‌کنم.
    - من با قلم می‌نویسم.
    - من گل را دوست دارم.
    - من از تحفه خوش استم.
  nl.a2.unit104.lesson05.teach.gn_er_voorzetsel:
    title: Er + حرف اضافه برای چیزها
    gloss: تحفه؟ دربارهٔ آن صحبت می‌کنم. کتاب؟ به آن نگاه می‌کنم. قلم؟ با آن می‌نویسم. گل؟ آن را دوست دارم.
    note: 'برای چیزها *over het* و *met hem* نگویید. *Er* و حرف اضافه را یکجا بنویسین: *erover, ernaar, ermee, ervan*.'
  nl.a2.unit104.lesson05.teach.gn_gesplitst:
    title: Er و حرف اضافه می‌توانند جدا شوند
    gloss: من از آن خوش استم. فردا دربارهٔ آن صحبت کنیم؟
    note: 'در بسیاری از جمله‌ها *er* در اول می‌آید و حرف اضافه در آخر: *Ik ben er blij mee.* *Ik ben ermee blij* هم ممکن است، ولی *Ik ben er blij mee* شکل عادی است که اینجا آموزش داده می‌شود.'
  nl.a2.unit104.lesson05.teach.gn_personen:
    title: برای آدم‌ها حرف اضافه می‌ماند
    gloss: من دربارهٔ نور صحبت می‌کنم. من دربارهٔ او (زن) صحبت می‌کنم. من به عمر نگاه می‌کنم. من به او (مرد) نگاه می‌کنم.
    note: 'برای آدم‌ها از *er* استفاده نکنین: حرف اضافه را با *hem, haar, ze* بگویین. *Erover* و شکل‌های مشابه به چیزها و فکرها اشاره می‌کنند.'
  nl.a2.unit104.lesson05.teach.lezen:
    title: پیام نور
    gloss: سلام عمر، از بابت گل‌ها تشکر! من آن‌ها را دوست دارم. کتاب لوته قشنگ است، از آن خوش استم. قلمت هنوز پیش من است. فردا آن را واپس می‌آرم. چترت پیش لوته است و روز جمعه آن را واپس می‌آرد.
    note: پیدا کنید که هر ضمیر به کدام چیز اشاره می‌کند.
    glosses:
      bedankt: تشکر
      vrijdag: جمعه
      mooi: قشنگ، خوب
      nog: هنوز
  nl.a2.unit104.lesson06.teach.lotte_bibliotheek:
    title: لوته می‌گوید کجا می‌رود
    gloss: 'لوته: سلام عمر، من فردا به کتابخانه می‌روم.'
  nl.a2.unit104.lesson06.teach.omar_boeken:
    title: عمر یک خواهش می‌کند
    gloss: 'عمر: می‌توانی کتاب‌های مرا واپس ببری؟ سه‌تا دارم.'
  nl.a2.unit104.lesson06.teach.lotte_ja:
    title: لوته قبول می‌کند و دربارهٔ تحفه می‌پرسد
    gloss: 'لوته: البته، فردا آن‌ها را واپس می‌برم. برای نور هم تحفه داری؟'
  nl.a2.unit104.lesson06.teach.omar_bloemen:
    title: عمر نام تحفه را می‌گوید
    gloss: 'عمر: بلی، برایش گل می‌خرم. او گل را دوست دارد.'
  nl.a2.unit104.lesson06.teach.lotte_later:
    title: لوته پیشنهاد می‌کند بعداً صحبت کنند
    gloss: 'لوته: عالی! بعداً دربارهٔ آن صحبت کنیم؟'
  nl.a2.unit104.lesson06.teach.omar_bel:
    title: عمر وعدهٔ زنگ زدن می‌دهد
    gloss: 'عمر: خوب، امشب به تو زنگ می‌زنم.'
exercises:
  nl.a2.unit104.lesson01.exercise01.kies_geeft:
    instruction: 'جمله‌ای را انتخاب کنید که معنی‌اش این است: او به من یک تحفه می‌دهد.'
    correct_option: Hij geeft me een cadeau.
    distractors:
    - Hij geeft ik een cadeau.
    - Hij geeft jij een cadeau.
    - Hij geeft hij een cadeau.
    accepted_answers:
    - value: Hij geeft me een cadeau.
      status: correct
    feedback: '*Hij geeft me een cadeau* = او به من یک تحفه می‌دهد. بعد از فعل به شکل مفعولی *me* ضرورت است.'
    prompt_blocks:
    - او به من یک تحفه می‌دهد.
  nl.a2.unit104.lesson01.exercise02.kies_haar:
    instruction: 'جمله‌ای را انتخاب کنید که معنی‌اش این است: من به او (زن) گل می‌دهم.'
    correct_option: Ik geef haar bloemen.
    distractors:
    - Ik geef hem bloemen.
    - Ik geef ons bloemen.
    - Ik geef jullie bloemen.
    accepted_answers:
    - value: Ik geef haar bloemen.
      status: correct
    feedback: '*Haar* شکل مفعولی برای یک زن است: *Ik geef haar bloemen*.'
    prompt_blocks:
    - من به او گل می‌دهم.
  nl.a2.unit104.lesson01.exercise03.koppel_zinnen:
    instruction: هر جملهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: Ik zie hem.
        right: او (مرد) را می‌بینم.
      - left: Ik zie haar.
        right: من او را می‌بینم.
      - left: Hij ziet ons.
        right: او ما را می‌بیند.
      - left: Hij ziet jullie.
        right: او شما همه را می‌بیند.
      - left: Hij ziet me.
        right: او مرا می‌بیند.
      - left: Hij ziet je.
        right: او تو را می‌بیند.
      status: correct
    feedback: '*Hem, haar, ons, jullie, me* و *je* همه شکل مفعولی استند.'
    pairs:
    - left: Ik zie hem.
      right: او (مرد) را می‌بینم.
    - left: Ik zie haar.
      right: من او را می‌بینم.
    - left: Hij ziet ons.
      right: او ما را می‌بیند.
    - left: Hij ziet jullie.
      right: او شما همه را می‌بیند.
    - left: Hij ziet me.
      right: او مرا می‌بیند.
    - left: Hij ziet je.
      right: او تو را می‌بیند.
  nl.a2.unit104.lesson01.exercise04.volgorde_cadeau:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که معنی شود: او به من یک تحفه می‌دهد.'
    correct_option: Hij geeft me een cadeau
    accepted_answers:
    - value: Hij geeft me een cadeau
      status: correct
    feedback: '*Hij geeft me een cadeau.*'
  nl.a2.unit104.lesson01.exercise05.vul_hem:
    instruction: جمله را با ضمیر مفعولی درست تکمیل کنید.
    correct_option: hem
    accepted_answers:
    - value: hem
      status: correct
    feedback: عمر مرد است، بنابراین برای اشاره به او *hem* می‌گویید.
  nl.a2.unit104.lesson01.exercise06.vertaal_haar:
    instruction: به هالندی ترجمه کنید.
    correct_option: null
    accepted_answers:
    - value: Ik zie haar.
      status: correct
    - value: Ik zie haar
      status: correct
    feedback: '*Ik zie haar* = من او (زن) را می‌بینم.'
    prompt_blocks:
    - من او را می‌بینم.
  nl.a2.unit104.lesson01.exercise07.schrijf_bloemen:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Hij geeft me bloemen.
    accepted_answers:
    - value: Hij geeft me bloemen.
      status: correct
    - value: Hij geeft me bloemen
      status: correct
    - value: Hij geeft mij bloemen.
      status: correct
    - value: Hij geeft mij bloemen
      status: correct
