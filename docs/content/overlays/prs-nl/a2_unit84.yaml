teaching:
  nl.a2.unit84.lesson01.teach.reiswoorden:
    title: کشورها، غذا و سفر
    gloss: بلژیک / آلمان / مصر / سوشی / مصری / سفر کردن / خوردن / گشت با قایق کردن
    note: این‌ها کلمه‌های مربوط به سفر و غذا در این بخش اند.
    example_gloss:
    - من سفر کردن را دوست دارم.
    - من خوردن سوشی را دوست دارم.
    - من یک گشت با قایق کرده‌ام.
  nl.a2.unit84.lesson01.teach.ervaringswoorden:
    title: کلمه‌های تجربه
    gloss: تا حال / تا حال هرگز نه / بوده / خورده / سفر کرده
    note: '*ooit* را در سوال‌ها به کار ببرید و *nog nooit* را وقتی که چیزی تا حال هرگز اتفاق نیفتاده باشد.'
    example_gloss:
    - آیا تا حال در بلژیک بوده‌اید؟
    - من تا حال هرگز سوشی نخورده‌ام.
  nl.a2.unit84.lesson01.teach.gn_vragen:
    title: سوال‌های تجربه با ماضی قریب
    gloss: آیا تا حال سوشی خورده‌اید؟ آیا تا حال در بلژیک بوده‌اید؟
    note: 'دربارهٔ یک کار با *hebben* بپرسین: *Heb je ooit ... gegeten?* دربارهٔ بودن در یک جا با *zijn* بپرسین: *Ben je ooit ... geweest?* اسم مفعول در آخر می‌آید.'
  nl.a2.unit84.lesson01.teach.gn_antwoorden:
    title: جواب‌های کوتاه
    gloss: بلی، قبلاً این کار را کرده‌ام. نه، تا حال هرگز.
    note: '*Al eens* می‌گوید که قبلاً اتفاق افتاده است. *Nog nooit* می‌گوید که تا حال در هیچ وقت اتفاق نیفتاده است.'
  nl.a2.unit84.lesson02.teach.activiteiten:
    title: کارهای سفر
    gloss: گشت با قایق کردن / از موزیم دیدن کردن / در هوتل خوابیدن / دو بار کار کردن
    note: این عبارت‌های مصدری در کارت بعدی به تجربه‌های ماضی قریب تبدیل می‌شوند.
    example_gloss:
    - من یک گشت با قایق می‌کنم.
    - من از یک موزیم دیدن می‌کنم.
  nl.a2.unit84.lesson02.teach.voltooide_ervaringen:
    title: اسم‌های مفعول برای تجربه‌ها
    gloss: کرده / دیدن کرده / خوابیده / کار کرده
    note: 'این‌ها را با *hebben* به کار ببرید: *heb gemaakt, heeft bezocht, heb geslapen, heb gewerkt*.'
    example_gloss:
    - من یک گشت با قایق کرده‌ام.
    - من در یک هوتل خوابیده‌ام.
  nl.a2.unit84.lesson02.teach.gn_al_nog_niet:
    title: قبلاً در برابر هنوز نه
    gloss: من قبلاً این کار را کرده‌ام. من هنوز این کار را نکرده‌ام.
    note: '*Al* یک تجربهٔ تمام‌شده را نشان می‌دهد. *Nog niet* می‌گوید که تا حال اتفاق نیفتاده، ولی شاید بعداً بیفتد. هر دو پیش از اسم مفعول می‌آیند.'
  nl.a2.unit84.lesson02.teach.gn_positie:
    title: جای کلمهٔ تجربه
    gloss: من قبلاً دو بار کار کرده‌ام. من تا حال هرگز در آلمان نبوده‌ام.
    note: 'با *hebben*، *al/twee keer* را پیش از اسم مفعول بگذارین. با *zijn ... geweest*، *nog nooit* پیش از عبارت جا می‌آید: *nog nooit in Duitsland geweest*.'
  nl.a2.unit84.lesson03.teach.tijdwoorden:
    title: کلمه‌های زمان مشخص گذشته
    gloss: دیروز / سال گذشته / آن وقت / اکثراً
    note: '*Gisteren, vorig jaar* و *toen* یک زمان مشخص گذشته را نشان می‌دهند که وقتی می‌گوییم چه اتفاق افتاد، اغلب ماضی مطلق می‌خواهد.'
    example_gloss:
    - دیروز کار کردم.
    - سال گذشته من اکثراً سفر می‌کردم.
  nl.a2.unit84.lesson03.teach.verhaalvormen:
    title: شکل‌های ماضی مطلق
    gloss: خورد / بود / دیدن کرد / سفر کرد
    note: این شکل‌ها دربارهٔ یک زمان مشخص گذشته می‌گویند. ماضی مطلق باقاعده در بخش 82 و شکل‌های بی‌قاعده در بخش 83 آموخته شد.
    example_gloss:
    - دیروز من سوشی خوردم.
    - سال گذشته من در آلمان بودم.
  nl.a2.unit84.lesson03.teach.gn_contrast:
    title: تجربه در برابر یک رویداد با زمان مشخص
    gloss: آیا تا حال سوشی خورده‌اید؟ دیروز من سوشی خوردم.
    note: ماضی قریب را برای پرسیدن اینکه آیا یک تجربه اتفاق افتاده یا نه به کار ببرید. ماضی مطلق را برای قصه‌ای که به یک زمان مشخص گذشته وصل است به کار ببرید.
  nl.a2.unit84.lesson03.teach.gn_rule:
    title: قاعدهٔ ساده
    gloss: 'تجربه: من سوشی خورده‌ام. قصهٔ مشخص: دیروز سوشی خوردم.'
    note: بپرسین «آیا این در زندگی کسی اتفاق افتاده؟» و ماضی قریب را انتخاب کنید. اگر دربارهٔ آنچه در یک زمان مشخص گذشته شده قصه می‌کنین، ماضی مطلق را انتخاب کنید.
  nl.a2.unit84.lesson04.teach.vragenlijst:
    title: پرسشنامه
    gloss: پرسشنامه / غذای مصری / گشت با قایق کردن / از موزیم دیدن کردن
    note: دوستان با این موضوع‌ها تجربه‌های خود را با هم مقایسه می‌کنند.
    example_gloss:
    - ما پرسشنامه را پر می‌کنیم.
    - من می‌خواهم غذای مصری بخورم.
  nl.a2.unit84.lesson04.teach.gn_kort_antwoord:
    title: جواب دادن به پرسش با hebben
    gloss: آیا تا حالا غذای مصری خورده‌ای؟ بلی، قبلاً یک بار خورده‌ام. نه، هرگز.
    note: در جواب کوتاه و کامل، برای اشاره به کار قبلی از *dat heb ik ... gedaan* استفاده می‌شود.
  nl.a2.unit84.lesson04.teach.gn_zijn_antwoord:
    title: جواب دادن به پرسش با zijn
    gloss: آیا تا حالا در مصر بوده‌ای؟ نه، من هرگز در مصر نبوده‌ام.
    note: 'فعل *zijn* را همراه *geweest* نگه دارید. ترتیب عادی این است: *nog nooit + place + geweest* (جای مکان را هم می‌شود اول آورد: *in Egypte nog nooit*).'
  nl.a2.unit84.lesson05.teach.noor_profiel:
    title: پروفایل سفر نور
    gloss: نور سفر کردن و غذا خوردن را دوست دارد. او دو بار به آلمان رفته و یک بار در آنجا در یک هوتل کوچک خوابیده است. او اکثراً نان آلمانی خورده است. او هرگز به مصر نرفته و هرگز با قایق سیر نکرده است. او قبلاً یک موزیم را در بلجیم دیدن کرده است.
    note: این پروفایل تجربه‌های انجام‌شده (*al, al eens, twee keer, vaak*) را با تجربه‌هایی که هرگز اتفاق نیفتاده (*nog nooit*) مقایسه می‌کند.
    glosses:
      houdt: خیلی دوست دارد
      reizen: سفر کردن
      twee: دو
      keer: بار
      klein: کوچک
      Duits: آلمانی
      brood: نان
      boottocht: سیر با قایق
      museum: موزیم
      bezocht: دیدن کرده
  nl.a2.unit84.lesson06.teach.lotte_egyptisch:
    title: لوته دربارهٔ غذا می‌پرسد
    gloss: 'لوته: آیا تا حالا سوشی خورده‌ای؟'
  nl.a2.unit84.lesson06.teach.omar_eten_reizen:
    title: عمر جواب می‌دهد و می‌پرسد
    gloss: 'عمر: بلی، اکثراً آن را خورده‌ام. آیا تا حالا در مصر بوده‌ای؟'
  nl.a2.unit84.lesson06.teach.lotte_duitsland:
    title: لوته تجربه‌ها را مقایسه می‌کند
    gloss: 'لوته: نه، هرگز. ولی یک بار در آلمان بوده‌ام.'
  nl.a2.unit84.lesson06.teach.omar_boot:
    title: عمر دربارهٔ سیر با قایق می‌پرسد
    gloss: 'عمر: آیا در آنجا با قایق سیر کردی؟'
  nl.a2.unit84.lesson06.teach.lotte_nog_niet:
    title: لوته می‌گوید هنوز نه
    gloss: 'لوته: نه، آن را هنوز نکرده‌ام. و تو؟'
  nl.a2.unit84.lesson06.teach.omar_al_eens:
    title: عمر می‌گوید که کرده است
    gloss: 'عمر: بلی، قبلاً یک بار کرده‌ام.'
