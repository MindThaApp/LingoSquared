course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز روی گرامر، برای دعوت کردن، قبول کردن و عذر خواستن.
  learning_goal: کسی را دعوت کنید و دعوت را با دلیل و پیشنهاد دیگر قبول یا رد کنید؛ با استفاده از افعال کمکی، omdat/want و gaan/zullen.
units:
  nl.a2.unit107.uitnodigen_en_afslaan:
    title: دعوت کردن و عذر خواستن
    description: یک دوست را دعوت کنید، با شوق قبول کنید، یا با دلیل و پلان دیگر مؤدبانه عذر بخواهید.
lessons:
  nl.a2.unit107.lesson01.een_uitnodiging:
    title: یک دعوت
  nl.a2.unit107.lesson02.ja_graag:
    title: بلی، خوشحال می‌شوم!
  nl.a2.unit107.lesson03.helaas_ik_kan_niet:
    title: افسوس که نمی‌توانم
  nl.a2.unit107.lesson04.zullen_we_zondag:
    title: یکشنبه برویم؟
  nl.a2.unit107.lesson05.noors_uitnodiging:
    title: دعوت Noor
  nl.a2.unit107.lesson06.lotte_en_omar_plannen:
    title: Lotte و Omar پلان می‌گیرند
teaching:
  nl.a2.unit107.lesson01.teach.plekken:
    title: جاها و مناسبت‌ها
    gloss: جشن / روز تولد / سینما / کنسرت / تیاتر
    note: این‌ها مناسبت‌ها و جاهایی است که مردم را به آن دعوت می‌کنین.
    example_gloss:
    - Lotte روز شنبه جشن دارد.
    - Noor روز یکشنبه تولد دارد.
    - ما امشب به سینما می‌رویم.
    - روز شنبه کنسرت است.
    - تیاتر در شهر است.
  nl.a2.unit107.lesson01.teach.film:
    title: فلم، نمایش، تکت
    gloss: فلم / نمایش / تکت / امشب / شنبه / یکشنبه
    note: '*Voorstelling* یعنی یک نمایش، مثلاً در تیاتر.'
    example_gloss:
    - فلم ساعت هشت شروع می‌شود.
    - نمایش روز شنبه است.
    - من دو تکت دارم.
    - امشب فلم است.
  nl.a2.unit107.lesson01.teach.gn_zin:
    title: Heb je zin om ... te ...?
    gloss: دلت می‌خواهد شنبه به فلم بروی؟
    note: برای دعوت کردن از *Heb je zin om ... te + infinitive?* استفاده کنید. مصدر (*gaan*) بعد از *te* در آخر جمله می‌آید.
    example_gloss:
    - دلت می‌خواهد به کنسرت بروی؟
    - دلت می‌خواهد امشب به تیاتر بروی؟
  nl.a2.unit107.lesson01.teach.gn_kom_je:
    title: Kom je ook naar ...?
    gloss: تو هم به جشن می‌آیی؟ تو هم به سینما می‌آیی؟
    note: '*Kom je ook naar ...?* یک دعوت کوتاه و دوستانه است. *Jij* شکل تأکیدی *je* است؛ اینجا هر دو درست‌اند.'
    example_gloss:
    - تو هم به جشن Noor می‌آیی؟
  nl.a2.unit107.lesson01.teach.gn_wil_je_mee:
    title: Wil je mee naar ...?
    gloss: می‌خواهی با ما به کنسرت بیایی؟ می‌خواهی با ما به تیاتر بیایی؟
    note: '*Mee* یعنی «همراه». *Wil je mee naar ...?* به مصدر ضرورت ندارد: حرکت از قبل در *mee naar* موجود است.'
    example_gloss:
    - می‌خواهی با ما به فلم بیایی؟
  nl.a2.unit107.lesson01.teach.zinnen:
    title: سه دعوت
    gloss: دلت می‌خواهد امشب به فلم بروی؟ تو هم به جشن می‌آیی؟ می‌خواهی با ما به کنسرت بیایی؟
  nl.a2.unit107.lesson02.teach.leuk:
    title: گفتن «بلی»
    gloss: قشنگ / خوش و دوستانه / با خوشی / فکر خوب
    note: '*Gezellig* فضای خوش و دوستانه را می‌رساند. *Graag* یعنی «با خوشی».'
    example_gloss:
    - چه خوب!
    - به نظرم این جالب است.
    - بلی، خوشحال می‌شوم!
    - فکر خوب!
  nl.a2.unit107.lesson02.teach.gn_ja:
    title: قبول کردن یک دعوت
    gloss: قشنگ! بلی، با خوشی! من هم می‌آیم. با خوشی می‌آیم.
    note: 'با یک واکنش کوتاه قبول کنید (*Leuk!*، *Ja, graag!*) و بعد تأیید کنید: *Ik ga mee* یا *Ik kom graag*.'
    example_gloss:
    - من با خوشی به جشن می‌آیم.
    - بلی، من هم با شما به فلم می‌آیم.
  nl.a2.unit107.lesson02.teach.gn_lijkt:
    title: Dat lijkt me ...
    gloss: به نظرم خوب می‌آید. به نظرم خوش و دوستانه می‌آید.
    note: '*Dat lijkt me ...* راه معمول برای گفتن این است که پلان برایتان خوب است. فعل *lijkt* در جای دوم می‌ماند.'
    example_gloss:
    - به نظرم فکر خوب است.
  nl.a2.unit107.lesson02.teach.tijd:
    title: پرسیدن ساعت
    gloss: ساعت چند شروع می‌شود؟ ساعت هشت شروع می‌شود.
    note: بعد از قبول کردن، با *Hoe laat begint het?* ساعت را بپرسین و با *om ... uur* جواب بدهین.
    example_gloss:
    - فلم ساعت نُه شروع می‌شود.
    - نمایش ساعت هشت شروع می‌شود.
  nl.a2.unit107.lesson03.teach.helaas:
    title: عذر خواستن و دلیل‌ها
    gloss: افسوس / نه / ولی / کار کردن / خسته / مریض / قرار / وقت نداشتن
    note: '*Helaas* رد کردن را نرم می‌سازد. *Geen tijd* یعنی «وقت نیست».'
    example_gloss:
    - افسوس که نمی‌توانم.
    - دلم می‌خواهد، ولی وقت ندارم.
    - باید کار کنم.
    - خسته هستم.
    - مریض هستم.
    - قرار ملاقات دارم.
  nl.a2.unit107.lesson03.teach.gn_modals:
    title: توانستن، باید، خواستن
    gloss: نمی‌توانم بیایم. باید کار کنم. دلم می‌خواهد، ولی وقت ندارم.
    note: '*Kunnen*، *moeten* و *willen* معمولاً با یک فعل دوم به شکل مصدر در آخر جمله می‌آیند: *Ik kan niet komen*؛ *Ik moet werken*.'
    example_gloss:
    - نمی‌توانم به جشن بیایم.
    - روز شنبه باید کار کنم.
  nl.a2.unit107.lesson03.teach.gn_want:
    title: Want دلیل می‌آورد
    gloss: افسوس، نمی‌توانم بیایم، چون باید کار کنم.
    note: '*Want* دو جمله اصلی را وصل می‌کند، پس ترتیب کلمات عادی می‌ماند: اول نهاد، بعد فعل (*want ik moet werken*).'
    example_gloss:
    - نمی‌توانم بیایم، چون مریض استم.
  nl.a2.unit107.lesson03.teach.gn_omdat:
    title: Omdat فعل را به آخر می‌فرستد
    gloss: نمی‌آیم، چون قرار ملاقات دارم.
    note: 'بعد از *omdat* فعل به آخر جمله می‌رود: *omdat ik een afspraak heb*. با فعل کمکی، هر دو فعل در آخر کنار هم می‌مانند و فعل صرف‌شده اول می‌آید: *omdat ik moet werken*.'
    example_gloss:
    - افسوس، نمی‌توانم بیایم، چون باید کار کنم.
  nl.a2.unit107.lesson03.teach.gn_contrast:
    title: Want در برابر omdat
    gloss: نمی‌آیم، چون قرار دارم. (هر دو جمله)
    note: هر دو دلیل می‌آورند. *Want ik heb* فعل را در جای دوم نگه می‌دارد؛ *omdat ik ... heb* آن را در آخر می‌گذارد.
  nl.a2.unit107.lesson03.teach.zin:
    title: یک «نه»ی مؤدبانه
    gloss: افسوس که نمی‌توانم، چون باید کار کنم.
  nl.a2.unit107.lesson04.teach.alt:
    title: پیشنهاد یک چیز دیگر
    gloss: به جای آن / پس / هفته آینده / فردا / خوب است / (نرم‌کننده)
    note: '*In plaats daarvan* یعنی «به جای آن». *Wel* اینجا تأکید می‌کند که این گزینه ممکن است.'
    example_gloss:
    - به جای آن، یکشنبه برویم؟
    - پس من وقت دارم.
    - هفته آینده برایم خوب است.
    - فردا می‌خواهم کار کنم.
    - این خوب است.
  nl.a2.unit107.lesson04.teach.gn_zullen:
    title: Zullen we ...?
    gloss: یکشنبه به فلم برویم؟ به جای آن، یکشنبه به سینما برویم؟
    note: '*Zullen we ...?* یک پلان مشترک پیشنهاد می‌کند. فعل پلان (*gaan*) در آخر می‌آید.'
    example_gloss:
    - فردا به کنسرت برویم؟
  nl.a2.unit107.lesson04.teach.gn_gaan:
    title: Gaan برای آینده
    gloss: روز شنبه می‌خواهم کار کنم. ما یکشنبه به فلم می‌رویم.
    note: '*Gaan* + مصدر درباره پلان‌ها است: *Ik ga zaterdag werken*. مصدر در آخر می‌ماند. اگر کلمه زمان اول بیاید، فعل در جای دوم می‌ماند: *Zondag gaan wij ...*.'
    example_gloss:
    - فردا به تیاتر می‌روم.
    - روز یکشنبه ما به کنسرت می‌رویم.
  nl.a2.unit107.lesson04.teach.gn_zal:
    title: Zullen برای یک وعده
    gloss: فردا به تو زنگ می‌زنم.
    note: '*Zullen* می‌تواند یک پلان یا وعده را هم بیان کند: *Ik zal je morgen bellen*. *Zal ik ...?* پیشنهاد کمک است؛ *Zullen we ...?* پیشنهاد مشترک است.'
    example_gloss:
    - یکشنبه می‌آیم.
  nl.a2.unit107.lesson04.teach.zinnen:
    title: «نه» با یک پیشنهاد دیگر
    gloss: افسوس که نمی‌توانم، چون باید کار کنم. یکشنبه برویم؟
  nl.a2.unit107.lesson05.teach.woorden:
    title: کلمه‌ها در یک پیام
    gloss: دعوت / تشکر / با سلام‌های دوستانه / قبلاً / قرار گذاشتن
    note: '*Groetjes* یک پیام دوستانه را ختم می‌کند.'
    example_gloss:
    - از دعوتت تشکر!
    - با سلام‌های دوستانه، Lotte
    - من قبلاً قرار دارم.
  nl.a2.unit107.lesson05.teach.gn_voltooid:
    title: Heb + صفت مفعولی (فقط برای خواندن)
    gloss: با والدینم قرار گذاشته‌ام. کار کرده‌ام.
    note: با بیشتر افعال، *heb + صفت مفعولی* (*afgesproken*، *gewerkt*) می‌گوید چه چیزی قبلاً واقع شده است. فعلاً فقط هنگام خواندن آن را بشناسید؛ هنوز لازم نیست آن را بنویسین.
  nl.a2.unit107.lesson05.teach.reading:
    title: Noor و Lotte می‌نویسند
    gloss: سلام Lotte، دلت می‌خواهد شنبه با ما به تیاتر بیایی؟ نمایش ساعت هشت شروع می‌شود. تو هم می‌آیی؟ با سلام‌های دوستانه، Noor. سلام Noor، بابت دعوت تشکر! افسوس که نمی‌توانم، چون قبلاً با والدینم قرار گذاشته‌ام. یکشنبه به فلم برویم؟ آن وقت من وقت دارم. با سلام‌های دوستانه، Lotte
    note: دعوت، جواب، دلیل و پیشنهاد دیگر را پیدا کنید.
    glosses:
      afgesproken: قرار گذاشته
      ouders: والدین
      uitnodiging: دعوت
      groetjes: با سلام‌های دوستانه
  nl.a2.unit107.lesson06.teach.beurt1:
    title: Lotte از Omar دعوت می‌کند
    gloss: 'لوته: سلام عمر، میخواهی روز شنبه با ما به کنسرت بیایی؟'
  nl.a2.unit107.lesson06.teach.beurt2:
    title: عمر با ذکر دلیل عذر میخواهد
    gloss: 'عمر: افسوس که آمده نمیتوانم، چون باید کار کنم.'
  nl.a2.unit107.lesson06.teach.beurt3:
    title: لوته یک پیشنهاد دیگر میدهد
    gloss: 'لوته: افسوس! پس روز یکشنبه برویم سینما؟'
  nl.a2.unit107.lesson06.teach.beurt4:
    title: عمر قبول میکند و وقت را میپرسد
    gloss: 'عمر: یکشنبه میشود. فلم کی شروع میشود؟'
  nl.a2.unit107.lesson06.teach.beurt5:
    title: لوته وقت را میگوید
    gloss: 'لوته: ساعت هشت.'
  nl.a2.unit107.lesson06.teach.beurt6:
    title: عمر قبول میکند
    gloss: 'عمر: خوب است، با کمال میل! من هم میآیم.'
exercises:
  nl.a2.unit107.lesson01.exercise01.kies_concert:
    instruction: دعوت هلندی را که با جملهٔ داده شده مطابقت دارد، انتخاب کنید.
    correct_option: Wil je mee naar het concert?
    distractors:
    - Kom je ook naar het feest?
    - Heb je zin om het concert?
    - Wil je naar het concert mee zin?
    accepted_answers:
    - value: Wil je mee naar het concert?
      status: correct
    feedback: '*Wil je mee naar het concert?* = میخواهی با ما به کنسرت بیایی؟'
    prompt_blocks:
    - می‌خواهی همراه ما به کنسرت بیایی؟
  nl.a2.unit107.lesson01.exercise02.kies_zin:
    instruction: سوال درست هالندی را انتخاب کنید.
    correct_option: Heb je zin om naar de bioscoop te gaan?
    distractors:
    - Heb je zin om naar de bioscoop gaan?
    - Hebben je zin om naar de bioscoop te gaan?
    - Heb je zin om te naar de bioscoop gaan?
    accepted_answers:
    - value: Heb je zin om naar de bioscoop te gaan?
      status: correct
    feedback: '*Heb je zin om ... te gaan?*: مصدر *gaan* بعد از *te* در آخر جمله میآید.'
    prompt_blocks:
    - میل داری به سینما بروی؟
  nl.a2.unit107.lesson01.exercise03.match_plekken:
    instruction: هر کلمهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: het feest
        right: محفل
      - left: de bioscoop
        right: سینما
      - left: het concert
        right: کنسرت
      - left: het theater
        right: آن تیاتر
      - left: het kaartje
        right: تکت
      - left: de voorstelling
        right: نمایش
      status: correct
    feedback: این‌ها مناسبت‌ها و جاهایی است که مردم را به آن دعوت می‌کنین.
    pairs:
    - left: het feest
      right: محفل
    - left: de bioscoop
      right: سینما
    - left: het concert
      right: کنسرت
    - left: het theater
      right: آن تیاتر
    - left: het kaartje
      right: تکت
    - left: de voorstelling
      right: نمایش
  nl.a2.unit107.lesson01.exercise04.order_mee:
    instruction: کلمهها را طوری ترتیب کنید که بپرسین «میخواهی با ما به کنسرت بیایی؟»
    correct_option: Wil je mee naar het concert
    accepted_answers:
    - value: Wil je mee naar het concert
      status: correct
    feedback: '*Wil je mee naar het concert?*'
  nl.a2.unit107.lesson01.exercise05.vul_om:
    instruction: دعوت را کامل کنید.
    correct_option: om
    accepted_answers:
    - value: om
      status: correct
    feedback: '*Heb je zin om ... te gaan?*'
  nl.a2.unit107.lesson01.exercise06.vertaal_kom_je:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Kom je ook naar het feest?
      status: correct
    - value: Kom je ook naar het feest
      status: correct
    - value: Kom jij ook naar het feest?
      status: correct
    - value: Kom jij ook naar het feest
      status: correct
    feedback: '*Kom je ook naar het feest?*'
    prompt_blocks:
    - تو هم به مهمانی می‌آیی؟
  nl.a2.unit107.lesson01.exercise07.schrijf_mee:
    instruction: دعوت را با *Wil je mee naar ...?* بنویسین.
    correct_option: Wil je mee naar het theater?
    accepted_answers:
    - value: Wil je mee naar het theater?
      status: correct
    - value: Wil je mee naar het theater
      status: correct
    feedback: '*Wil je mee naar het theater?*'
    prompt_blocks:
    - 'به هالندی بنویسین و wil je mee را به کار ببرید: از یک دوست بپرسین که می‌خواهد همراه شما به تیاتر بیاید یا نه.'
  nl.a2.unit107.lesson02.exercise01.kies_ja:
    instruction: جوابی را انتخاب کنید که دعوت را قبول میکند.
    correct_option: Ja, graag! Dat lijkt me gezellig.
    distractors:
    - Kom je ook naar het feest?
    - Wil je mee naar het concert?
    - Hoe laat begint de film?
    accepted_answers:
    - value: Ja, graag! Dat lijkt me gezellig.
      status: correct
    feedback: هم *Ja, graag!* و هم *Dat lijkt me gezellig* دعوت را قبول میکنند.
    prompt_blocks:
    - 'Lotte می‌پرسد: ''Heb je zin om naar de film te gaan?'' جوابی را انتخاب کنید که بلی می‌گوید.'
  nl.a2.unit107.lesson02.exercise02.kies_lijkt:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Dat lijkt me leuk.
    distractors:
    - Dat lijkt me graag.
    - Dat leuk lijkt me.
    - Dat lijk ik leuk.
    accepted_answers:
    - value: Dat lijkt me leuk.
      status: correct
    feedback: '*Dat lijkt me leuk.*'
    prompt_blocks:
    - به نظرم این جالب است.
  nl.a2.unit107.lesson02.exercise03.match_ja:
    instruction: هر عبارت هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: Ja, graag!
        right: بلی، خوشحال می‌شوم!
      - left: Goed idee!
        right: فکر خوب!
      - left: Wat leuk!
        right: چه خوب!
      - left: Dat lijkt me gezellig.
        right: به نظرم با صفا است.
      - left: Ik ga mee.
