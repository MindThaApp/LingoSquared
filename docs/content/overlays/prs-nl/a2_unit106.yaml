course:
  title: هالندی A2
  description: دستور زبان هالندی در سطح A2 برای نوشتن به دوستان.
  learning_goal: 'یک پیام کوتاه خودمانی به دوست بنویسین: چه اتفاق افتاد، بعد چه می‌شود و چرا.'
units:
  nl.a2.unit106.een_bericht_aan_een_vriend:
    title: پیام به یک دوست
    description: پیام‌های خودمانی را با سلام، رویدادهای گذشته، برنامه‌ها، دلیل‌ها و ختم پیام بخوانین و بنویسین.
lessons:
  nl.a2.unit106.lesson01.hoi_lotte_groetjes:
    title: سلام Lotte، با سلام‌های گرم
  nl.a2.unit106.lesson02.wat_is_er_gebeurd:
    title: چه اتفاق افتاد؟
  nl.a2.unit106.lesson03.wat_gaan_we_doen:
    title: چه کار می‌کنیم؟
  nl.a2.unit106.lesson04.omdat_want_dus:
    title: چون، زیرا، پس
  nl.a2.unit106.lesson05.berichten_lezen:
    title: خواندن پیام‌ها
  nl.a2.unit106.lesson06.een_bericht_schrijven:
    title: نوشتن یک پیام
teaching:
  nl.a2.unit106.lesson01.teach.groeten:
    title: آغاز یک پیام
    gloss: سلام Lotte / های Omar / سلام Noor
    note: پیام را برای دوست با Hoi یا Hé، بعد نام و یک ویرگول شروع کنید.
    example_gloss:
    - سلام Lotte، چطور استی؟
    - های Omar، از پیامت تشکر!
  nl.a2.unit106.lesson01.teach.afsluiten:
    title: ختم یک پیام
    gloss: با سلام‌های گرم (خودمانی) / با محبت / به زودی می‌بینمت
    note: با یکی از این‌ها ختم کنید، بعد ویرگول و نام‌تان را بنویسین. Liefs گرم است و برای دوستان نزدیک به کار می‌رود.
    example_gloss:
    - با سلام‌های گرم، Omar
    - با محبت، Lotte
    - به زودی می‌بینمت، Noor
  nl.a2.unit106.lesson01.teach.bericht:
    title: نوشتن به یک دوست
    gloss: پیام / دوست (مرد) / دوست (زن) / نوشتن
    note: Vriend دوست مرد است و vriendin دوست زن.
    example_gloss:
    - به دوستم (زن) پیام می‌نویسم.
    - Lotte دوست Omar است.
    - Omar دوست Noor است.
  nl.a2.unit106.lesson01.teach.gebeurtenissen:
    title: موضوع‌هایی برای نوشتن
    gloss: آخر هفته / مهمانی / فلم / سینما / باغ وحش / پارک / شب
    note: اینها موضوع‌های معمول یک پیام دربارهٔ آخر هفته‌تان استند.
    example_gloss:
    - آخر هفته خوب بود.
    - مهمانی مزه‌دار بود.
    - در سینما فلم تماشا می‌کنم.
  nl.a2.unit106.lesson01.teach.bijvoeglijk:
    title: چطور بود؟ حالت چطور است؟
    gloss: خوب / دلچسپ و گرم / خسته / مریض / مصروف
    note: Gezellig فضای خوش و دوستانه را نشان می‌دهد، مثلاً در یک محفل.
    example_gloss:
    - فلم خوب بود.
    - من خسته استم.
    - عمر مریض است.
    - لوته مصروف است.
  nl.a2.unit106.lesson01.teach.tijd:
    title: کی؟
    gloss: دیروز / هفتهٔ گذشته / فردا / هفتهٔ آینده / شاید / روز شنبه
    note: کلمه‌های زمان به دوستت می‌گویند که چیزی کِی شده یا کِی می‌شود. Misschien یعنی شاید.
    example_gloss:
    - دیروز محفل بود.
    - فردا آخر هفته است.
    - شاید فلم خوب باشد.
  nl.a2.unit106.lesson01.teach.gn_opbouw:
    title: ساختار پیام به دوست
    gloss: سلام لوته، حالت چطور است؟ من برایت یک پیام می‌نویسم. با سلام‌های گرم، عمر
    note: 'یک پیام دوستانه چهار بخش دارد: آغاز (Hoi یا Hé با نام)، آنچه شده، آنچه بعد می‌آید، و پایان (Groetjes، Liefs یا Tot snel با نام تو). اگر لازم شد، با omdat یا want دلیل اضافه کن.'
  nl.a2.unit106.lesson01.teach.gn_je:
    title: Je برای دوست
    gloss: حالت چطور است؟ از پیامت تشکر!
    note: 'به دوست je (یا jij) می‌نویسی، هرگز u نه. کلمهٔ je به معنای «ـت» (مال تو) هم است: je bericht.'
  nl.a2.unit106.lesson01.teach.zin:
    title: یک پیام کوتاه
    gloss: سلام لوته، از پیامت تشکر! به زودی می‌بینمت، عمر
  nl.a2.unit106.lesson02.teach.voltooid_ww:
    title: فعل‌ها و اسم مفعول‌هایشان
    gloss: دیدن - دیده / خریدن - خریده / زنگ زدن - زنگ زده / قدم زدن - قدم زده / رقصیدن - رقصیده / خوردن - خورده / رفتن - رفته / بودن - بوده
    note: شکل دوم هر جفت، اسم مفعولی است که در ماضی نقلی به کار می‌رود.
    example_gloss:
    - من یک فلم دیدم.
    - ما رقصیدیم.
    - به پارک رفتم.
  nl.a2.unit106.lesson02.teach.gn_hebben:
    title: ماضی نقلی با hebben
    gloss: دیروز یک فلم دیدم. ما در محفل رقصیدیم. به نور زنگ زدم.
    note: 'برای گفتن آنچه شده، heb یا hebben را با اسم مفعول به کار ببر. در جملهٔ اصلی ساده، اسم مفعول در آخر جمله می‌آید. هالندی برای رویدادهای گذشته اغلب همین شکل را به کار می‌برد، در حالی که در دری معمولاً ماضی ساده می‌گوییم: «دیدم»، «زنگ زدم».'
  nl.a2.unit106.lesson02.teach.gn_zijn:
    title: ماضی نقلی با zijn
    gloss: به پارک رفتم. در محفل بودم. ما به سینما رفتیم.
    note: 'فعل‌های gaan و zijn ماضی نقلی‌شان را با zijn می‌سازند، نه hebben: ik ben gegaan، ik ben geweest. Komen هم همین‌طور است (ik ben gekomen). بیشتر فعل‌های دیگر hebben می‌گیرند. فعل کمکی را همراه اسم مفعول یاد بگیر.'
  nl.a2.unit106.lesson02.teach.gn_was_had:
    title: توصیف با was و had
    gloss: محفل خوش بود. فلم خوب بود. شب خوبی داشتم.
    note: 'برای گفتن اینکه چیزی چطور بود، از ماضی ساده فعل‌های آشنا استفاده کن: was و had. برای خود رویدادها ماضی نقلی و برای توصیف was یا had به کار ببر. دو سه جزئیات از این دست پیامت را زنده می‌سازد.'
  nl.a2.unit106.lesson02.teach.zinnen:
    title: آنچه شد
    gloss: دیروز یک فلم دیدم. خوب بود. به محفل رفتم.
  nl.a2.unit106.lesson03.teach.plan_ww:
    title: کلمه‌ها برای برنامه‌ها
    gloss: دیدن کردن / آشپزی کردن / تماشا کردن / کاکا / برنامه
    note: Oom کاکا یا ماما است. Plan یعنی برنامه؛ van plan zijn یعنی قصد داشتن.
    example_gloss:
    - من کاکایم را در امستردام دیدن می‌کنم.
    - عمر برای لوته آشپزی می‌کند.
    - ما فلم تماشا می‌کنیم.
  nl.a2.unit106.lesson03.teach.gn_gaan:
    title: برنامه با gaan
    gloss: می‌روم کاکایم را دیدن کنم. عمر فردا آشپزی می‌کند. ما می‌رویم فلم ببینیم.
    note: برای برنامه یا کاری که می‌خواهی بکنی، gaan را با مصدر به کار ببر. مصدر در آخر جمله می‌آید.
  nl.a2.unit106.lesson03.teach.gn_voorop:
    title: کلمهٔ زمان در آغاز
    gloss: فردا آشپزی می‌کنم. هفتهٔ آینده ما کاکایم را دیدن می‌کنیم. شاید به فلم بروم.
    note: 'وقتی کلمهٔ زمان مثل morgen یا volgende week، یا misschien جمله را آغاز کند، فعل بعد از آن می‌آید و فاعل بعد از فعل: Morgen ga ik koken. مصدر باز هم در آخر می‌ماند.'
  nl.a2.unit106.lesson03.teach.gn_plan:
    title: Van plan zijn om ... te
    gloss: قصد دارم به باغ وحش بروم. قصد دارم کاکایم را دیدن کنم.
    note: 'Ik ben van plan om ... te + مصدر می‌گوید که قصد داری چه کاری کنی. مصدر همراه te در آخر می‌آید: om mijn oom te bezoeken. این شکل کمی سنجیده‌تر از gaan است.'
  nl.a2.unit106.lesson03.teach.gn_zullen:
    title: Zullen برای وعده
    gloss: فردا به تو زنگ می‌زنم. ما به تو زنگ می‌زنیم.
    note: 'Ik zal و wij zullen با مصدر، وعده یا پیشنهاد را می‌رسانند: Ik zal je bellen. برای برنامه gaan و وقتی به دوستت چیزی وعده می‌دهی zullen به کار ببر.'
  nl.a2.unit106.lesson03.teach.zinnen:
    title: آنچه بعد می‌آید
    gloss: هفتهٔ آینده می‌روم کاکایم را در امستردام دیدن کنم. به تو زنگ می‌زنم.
  nl.a2.unit106.lesson04.teach.redenwoorden:
    title: کلمه‌ها برای دلیل
    gloss: چون / چون / پس / وقت / هیچ / نه / آمدن / ماندن
    note: Omdat و want هر دو یعنی چون، dus یعنی پس. در ترتیب کلمه‌ها فرق دارند، یادداشت‌های بعدی را ببین.
    example_gloss:
    - وقت ندارم.
    - در خانه می‌مانم.
    - نمی‌آیم.
  nl.a2.unit106.lesson04.teach.gn_omdat:
    title: 'Omdat: فعل در آخر می‌آید'
    gloss: چون مریض هستم در خانه می‌مانم. چون خسته هستم به خانه می‌روم.
    note: 'بعد از omdat فعل به آخر جملهٔ خودش می‌رود: omdat ik ziek ben. اگر جملهٔ omdat اول بیاید، جملهٔ اصلی بعدی با فعلش شروع می‌شود، درست بعد از ویرگول: Omdat ik moe ben, ga ik naar huis.'
  nl.a2.unit106.lesson04.teach.gn_want:
    title: 'Want: ترتیب عادی'
    gloss: در خانه می‌مانم، چون مریضم. نمی‌آیم، چون وقت ندارم.
    note: 'بعد از want ترتیب کلمه‌ها عادی می‌ماند: want ik ben ziek. Want فقط دو جملهٔ اصلی را وصل می‌کند، پس هرگز جمله را شروع نمی‌کند.'
  nl.a2.unit106.lesson04.teach.gn_dus:
    title: 'Dus: نتیجه'
    gloss: مریضم، پس در خانه می‌مانم. شلوغ است، پس نمی‌آیم.
    note: 'Dus نتیجه را معرفی می‌کند. حرف ربط است، پس ترتیب کلمه‌های جمله‌ای را که وصل می‌کند عوض نمی‌کند: Ik ben ziek, dus ik blijf thuis. جابه‌جایی فعل و فاعل هم خیلی معمول و درست است: Ik ben ziek, dus blijf ik thuis. Omdat دلیل را می‌دهد؛ dus نتیجه را.'
  nl.a2.unit106.lesson04.teach.gn_verleden:
    title: دلیل‌ها در گذشته
    gloss: مریض بودم، پس به محفل نرفتم. نیامدم، چون خسته بودم.
    note: دلیل رویدادهای گذشته را به همین شکل بده. دلیل را با was یا had توصیف کن (Ik was ziek) و رویداد را با ماضی نقلی (ik ben niet gekomen).
  nl.a2.unit106.lesson05.teach.leeswoorden:
    title: کلمه‌ها برای خواندن
    gloss: بلیط / قبلاً / خیلی / زیاد / هم / اما / آن / او / زندگی کردن
    note: این کلمه‌ها در دو پیام زیر آمده‌اند.
    example_gloss:
    - زیاد رقصیدم.
    - محفل خیلی دلچسپ بود.
    - کاکای من در Amsterdam زندگی می‌کند.
    - او هم در پارک است.
    - می‌آیم، اما آن مشکل نیست.
  nl.a2.unit106.lesson05.teach.gn_voltooid_verleden:
    title: Had با اسم مفعول (برای خواندن)
    gloss: قبلاً یک بلیط خریده بودم. لوته قبلاً به عمر زنگ زده بود.
    note: 'Had یا hadden با اسم مفعول به چیزی اشاره می‌کند که پیش از یک لحظهٔ دیگر گذشته شده بود: قبلاً یک بلیط خریده بودم. فقط هنگام خواندن باید آن را بشناسی. در پیام‌های خودت ماضی نقلی کافی است.'
  nl.a2.unit106.lesson05.teach.lees_noor:
    title: پیام نور به لوته
    gloss: سلام لوته، از پیامت تشکر! دیروز به محفل رفتم. خیلی دلچسپ بود و زیاد رقصیدم. فردا به باغ وحش می‌روم، چون وقت دارم. شاید هفتهٔ آینده به فلم بروم. به زودی می‌بینمت، نور
  nl.a2.unit106.lesson05.teach.lees_omar:
    title: پیام عمر به لوته
    gloss: سلام لوته، حالت چطور است؟ دیروز مریض بودم، پس به فلم نرفتم. قبلاً بلیط خریده بودم، اما آن مشکل نبود. هفتهٔ آینده می‌روم کاکایم را دیدن کنم. او در امستردام زندگی می‌کند. فردا به تو زنگ می‌زنم. با سلام‌های گرم، عمر
  nl.a2.unit106.lesson06.teach.lotte_vraag:
    title: لوته صحبت می‌کند
    gloss: 'لوته: سلام عمر، آخر هفته‌ات چطور بود؟'
  nl.a2.unit106.lesson06.teach.omar_feestje:
    title: عمر صحبت می‌کند
    gloss: 'عمر: خوب بود! روز شنبه به محفل رفتم و زیاد رقصیدم.'
  nl.a2.unit106.lesson06.teach.lotte_plan:
    title: لوته صحبت می‌کند
    gloss: 'لوته: چه خوب! و هفتهٔ آینده چه کار می‌کنی؟'
  nl.a2.unit106.lesson06.teach.omar_oom:
    title: عمر صحبت می‌کند
    gloss: 'عمر: می‌روم کاکایم را در امستردام دیدن کنم، چون وقت دارم.'
  nl.a2.unit106.lesson06.teach.lotte_bellen:
    title: لوته صحبت می‌کند
    gloss: 'لوته: چه دلچسپ! به تو زنگ می‌زنم. به زودی می‌بینمت!'
exercises:
  nl.a2.unit106.lesson01.exercise01.kies_tot_snel:
    instruction: پایانی را انتخاب کن که معنایش «به زودی می‌بینمت» است.
    correct_option: Tot snel
    distractors:
    - Hoi
    - Groetjes
    - Bedankt
    accepted_answers:
    - value: Tot snel
      status: correct
    feedback: '*Tot snel* = به زودی می‌بینمت. *Groetjes* پایان دیگری است: با سلام‌های گرم.'
    prompt_blocks:
    - کدام ختم پیام به معنای «به زودی می‌بینمت» است؟
  nl.a2.unit106.lesson01.exercise02.match_berichtwoorden:
