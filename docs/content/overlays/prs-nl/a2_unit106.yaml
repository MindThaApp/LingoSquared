  nl.a2.unit106.lesson01.exercise03.kies_opening:
    instruction: آغاز پیام برای لوته را انتخاب کن.
    correct_option: Hoi Lotte,
    distractors:
    - Tot snel, Lotte
    - Liefs, Lotte
    - Groetjes, Lotte
    accepted_answers:
    - value: Hoi Lotte,
      status: correct
    feedback: '*Hoi Lotte,* پیام را آغاز می‌کند. بقیه پایان‌اند.'
    prompt_blocks:
    - پیامی را برای دوست‌تان Lotte شروع می‌کنین. کدام آغاز درست است؟
  nl.a2.unit106.lesson01.exercise04.volgorde_bedankt:
    instruction: کلمه‌ها را مرتب کن تا بگویی «از پیامت تشکر.»
    correct_option: Bedankt voor je bericht
    accepted_answers:
    - value: Bedankt voor je bericht
      status: correct
    feedback: '*Bedankt voor je bericht* = از پیامت تشکر.'
  nl.a2.unit106.lesson01.exercise05.vul_gaat:
    instruction: سوال به دوست را کامل کن.
    correct_option: gaat
    accepted_answers:
    - value: gaat
      status: correct
    feedback: '*Hoe gaat het met je?* = حالت چطور است؟'
  nl.a2.unit106.lesson01.exercise06.vertaal_bedankt:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Bedankt voor je bericht!
      status: correct
    - value: Bedankt voor je bericht
