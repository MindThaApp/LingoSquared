teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: کوت، سویتر
    gloss: کوت، سویتر
    note: '*De jas* و *de trui* هر دو اسم‌هایی استند که با de می‌آیند.'
    example_gloss:
    - دنبال یک کوت می‌گردم.
    - من یک سویتر دارم.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: پتلون، بوت
    gloss: پتلون، بوت‌ها
    note: '*Broek* در هلندی مفرد است: برای یک دانه می‌گویند *een broek*، نه *broeken*. در دری هم «پتلون» مفرد است. *Schoenen* جمع *schoen* است؛ دربارهٔ بوت‌ها تقریباً همیشه به شکل جمع صحبت می‌شود.'
    example_gloss:
    - من دنبال یک پتلون می‌گردم.
    - دنبال بوت می‌گردم.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: گفتن اینکه دنبال چه می‌گردید
    gloss: دنبال یک کوت می‌گردم.
    note: '*Zoeken* (دنبال چیزی گشتن) در اینجا مفعول مستقیم می‌گیرد و حرف اضافه ندارد. (*Zoeken naar* هم هست، اما ساده‌ترین الگو همان مفعول مستقیم است.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: اندازه
    gloss: اندازه
    note: 'یک اسم که با de می‌آید: *de maat*.'
    example_gloss: شما کدام اندازه استید؟
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: پرسیدن در مورد اندازه
    gloss: چه سایز می‌پوشید؟
    note: '*Welke* (کدام) به کار می‌رود چون برای *maat* چند جواب محدود وجود دارد (S، M، L یا یک عدد).'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: گفتن اندازهٔ خود
    gloss: من اندازهٔ M استم.
    note: اینجا فعل *hebben* (داشتن) به کار می‌رود؛ یعنی در هلندی برای گفتن سایز می‌گویند «سایز M دارم».
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: سیاه، آبی
    gloss: سیاه، آبی
    note: دو صفت رنگ اساسی این درس.
    example_gloss:
    - کوت را به رنگ سیاه می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: درخواست یک رنگ
    gloss: کوت را به رنگ سیاه می‌خواهم.
    note: '*In het* + رنگ روش معمول برای مشخص کردن رنگ لباس هنگام سفارش یا درخواست است.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: پرسیدن از رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*Ook* (هم، همچنین) می‌پرسد که آیا رنگ دیگری هم موجود است؛ اینجا شکل محترمانهٔ *u* به کار رفته است.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: پرسیدن از اندازه بودن لباس
    gloss: این کوت به تو اندازه است؟
    note: '*Passen* (اندازه بودن) فعل طبیعی برای اندازه بودن لباس است و با *passen* به معنای «امتحان کردن» فرق دارد.'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: تأیید اندازه بودن
    gloss: به من اندازه است.
    note: '*Goed* (خوب) نشان می‌دهد لباس چطور اندازه است.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: خیلی کوچک است
    gloss: این خیلی کوچک است.
    note: '*Te* (بیش از حد) پیش از صفت می‌آید و زیادی بودن را می‌رساند.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: خیلی بزرگ است
    gloss: این خیلی بزرگ است.
    note: همان الگوی *te* + صفت که در کارت قبلی با *te klein* بود.
  nl.a1.unit20.lesson05.teach.negentig:
    title: نود
    gloss: نود
    note: '*Negentig* عدد ۹۰ است و اینجا در قیمت کوتی آمده است.'
    example_gloss: کوت نود یورو قیمت دارد.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: گفتن قیمت
    gloss: کوت نود یورو قیمت دارد.
    note: '*Kost* شکل سوم شخص مفرد *kosten* (قیمت داشتن) است.'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: خواندن رسید دوکان
    gloss: 'کوت زمستانی: اندازهٔ M، رنگ سیاه. قیمت: نود یورو. این کوت به من اندازه است و گرم است.'
    note: اندازه، رنگ، قیمت و دو ویژگی ذکرشدهٔ کوت را دنبال کنید.
    glosses:
      Winterjas: کوت زمستانی
      maat: اندازه
      kleur: رنگ
      zwart: سیاه
      Prijs: قیمت
      negentig: نود
      euro: یورو
      jas: کوت
      past: اندازه است
      warm: گرم
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: لوته کوتی را می‌بیند
    gloss: 'لوته: این کوتی قشنگ است! سایز تو چند است؟'
    note: '*Mooi* (قشنگ) یک واکنش مثبت عمومی است که از واحدهای قبلی تکرار می‌شود.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: عمر اجازه می‌خواهد آن را امتحان کند
    gloss: 'عمر: سایزم M است. می‌توانم امتحانش کنم؟'
    note: '*Mag ik ...?* (اجازه است ...؟) روش معمول و مؤدبانه برای اجازه خواستن است؛ *passen* اینجا یعنی «امتحان کردن»، نه «اندازه بودن».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: لوته دربارهٔ اندازه بودن می‌پرسد
    gloss: 'لوته: البته. برایت اندازه است؟'
    note: '*Hij* (او، آن) به *de jas* برمی‌گردد که یک اسم de است.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: عمر تأیید می‌کند
    gloss: 'عمر: بلی، اندازه است و گرم هم است.'
    note: کاملاً با رسیدی که خواندید مطابقت دارد؛ این همان کوت است.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: لوته دربارهٔ رنگ می‌پرسد
    gloss: 'لوته: عالی! آن را سیاه می‌خواهی یا آبی؟'
    note: '*Wil je... of...?* همان الگوی پیشنهاد انتخاب از درس‌های ترجیحات واحد ۱۳ است.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: عمر تصمیم می‌گیرد
    gloss: 'عمر: آن را سیاه می‌گیرم.'
    note: '*Nemen* (گرفتن) فعل طبیعی برای نهایی کردن انتخاب خرید است، مطابق رنگی که در رسید آمده است.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem و neemt
    gloss: Neem شکل «من» فعل nemen (گرفتن) است؛ neemt شکل «او» است.
    note: 'الگوی منظم زمان حال: *ik neem, jij/hij/zij neemt*.'
