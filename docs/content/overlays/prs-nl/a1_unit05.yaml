teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: پدر و مادر
    gloss: پدر / مادر
    note: '*Vader* کلمهٔ معیاری و خنثی برای پدر است. *Moeder* کلمهٔ معیاری و خنثی برای مادر است.'
    example_gloss:
    - این پدرم است.
    - او مادر من است.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: والدین، برادر و خواهر
    gloss: والدین / برادر / خواهر
    note: در این معنا *ouders* همیشه جمع است؛ *de broer* و *de zus* هر دو با *de* می‌آیند.
    example_gloss:
    - والدین من در Utrecht زندگی می‌کنند.
    - من یک برادر دارم.
    - من یک خواهر دارم.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: طفل و اطفال
    gloss: طفل / اطفال
    note: '*Kind* کلمهٔ het است: *het kind*. جمع آن یعنی *kinderen* با *de* می‌آید، با آن‌که مفرد آن یعنی *kind* با *het* می‌آید.'
    example_gloss:
    - خواهرم یک طفل دارد.
    - کاکا و عمه‌ام دو طفل دارند.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: من یک برادر و یک خواهر دارم
    gloss: من یک برادر و یک خواهر دارم.
    note: '*Ik heb ...* روش معمول گفتن این است که چه کسانی از اعضای فامیل را دارید.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: نیکه، ننه، کاکا و عمه
    gloss: نیکه / ننه / کاکا یا ماما / عمه یا خاله
    note: '*Opa* کلمهٔ روزمره برای نیکه است؛ *grootvader* رسمی‌تر است و بیشتر نوشتاری. *Oma* کلمهٔ روزمره برای ننه است؛ *grootmoeder* رسمی‌تر است و بیشتر نوشتاری. *De oom*. *De tante*.'
    example_gloss:
    - نیکه و ننهٔ من در Rotterdam زندگی می‌کنند.
    - ننهٔ من نود و نه ساله است.
    - کاکای من در Amsterdam زندگی می‌کند.
    - کاکا و عمه‌ام دو طفل دارند.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: neef و nicht دو معنا دارند
    gloss: neef = پسر کاکا/ماما/عمه/خاله یا برادرزاده/خواهرزاده؛ nicht = دختر کاکا/ماما/عمه/خاله یا برادرزاده/خواهرزاده
    note: در دری برای پسر کاکا یا ماما و برادرزاده کلمه‌های جدا داریم، اما در هالندی برای هر دو یک کلمه است؛ از موضوع صحبت می‌فهمید کدام معنا مراد است. در این بخش در تمرین‌ها نمی‌آید؛ فقط این‌جا ذکر شده تا بعداً این کلمه‌ها را بشناسید.
    target_text: neef = پسر کاکا، ماما، خاله یا عمه، یا برادرزاده/خواهرزادهٔ پسر؛ nicht = دختر کاکا، ماما، خاله یا عمه، یا برادرزاده/خواهرزادهٔ دختر
  nl.a1.unit05.lesson02.teach.gezin:
    title: خانواده (اهل خانه)
    gloss: خانواده (اهل خانه)
    note: '*Gezin* به اهل خانه‌ای می‌گویند که با هم زندگی می‌کنین (معمولاً والدین و اطفال)؛ *familie* کلمهٔ وسیع‌تر است و به‌طور کلی برای فامیل و خویشاوندان به کار می‌رود.'
    example_gloss: خانوادهٔ من (اهل خانه‌ام) در Utrecht زندگی می‌کند.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: نیکه و ننهٔ من در Rotterdam زندگی می‌کنند
    gloss: نیکه و ننهٔ من در Rotterdam زندگی می‌کنند.
    note: '*Wonen in* + نام شهر، برای گفتن جایی که کسی زندگی می‌کند.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: کاکا و عمهٔ من دو طفل دارند
    gloss: کاکا و عمه‌ام دو طفل دارند.
    note: '*hebben* را استفاده کنید، چون *oom en tante* به دو نفر اشاره می‌کند.'
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: من و تو (بدون تأکید و با تأکید)
    gloss: مال من / مال تو (بدون تأکید) / مال تو (با تأکید)
    note: '*Mijn* پیش از اسم‌های de و het، مفرد باشند یا جمع، همیشه یک شکل دارد. *Je* شکل معمول و دوستانه است، وقتی روی این‌که مال کی است تأکید ندارین؛ آن هم پیش از هر اسم همان شکل را دارد. *Jouw* از *je* قوی‌تر است و وقتی عضو فامیل یک نفر را با دیگری مقایسه می‌کنین لازم است؛ آن هم پیش از هر اسم همان شکل را دارد.'
    example_gloss:
    - این برادرم است.
    - این خواهر تو است؟
    - آن خواهر تو است؟
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: je در برابر jouw
    gloss: je و jouw هر دو یعنی «مال تو» در گفتار دوستانه
    note: وقتی تأکید خاصی ندارین *je* را استفاده کنید. وقتی روی این‌که مال کی است تأکید می‌کنین، به‌خصوص در مقایسه، *jouw* را استفاده کنید. *jouw* بدون مقایسه هم ممکن است، اما در آن‌جا *je* معمول‌تر است.
    target_text: je و jouw هر دو یعنی «تو/ات» در حالت غیررسمی. Je بدون تأکید معمول است؛ jouw قوی‌تر است و برای مقایسه لازم می‌شود. هر دو پیش از هر اسم یک شکل دارند.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: این برادر من است
    gloss: این برادرم است.
    note: '*Dit is ...* برای معرفی کسی است که نزدیک شما است.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: آن خواهر تو است؟
    gloss: آن خواهر تو است؟
    note: '*Dat is ...* برای کسی است که دورتر است یا قبلاً از او صحبت شده.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: مال او (مرد) و مال او (زن)
    gloss: مال او (مرد) / مال او (زن)
    note: '*Zijn* مثل *mijn*، *je* و *jouw* همیشه یک شکل دارد. *Haar* هم همیشه یک شکل دارد.'
    example_gloss:
    - این پدر او (مرد) است.
    - آن مادر او (زن) است.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: zijn در برابر haar
    gloss: zijn = مال او (مرد)، haar = مال او (زن)
    note: 'در این مثال‌ها، برای صاحب مرد *zijn* و برای صاحب زن *haar* را انتخاب کنید. کلمهٔ فامیلی که بعد می‌آید در انتخاب تأثیری ندارد: *zijn vader* و *zijn moeder*؛ *haar vader* و *haar moeder*.'
    target_text: zijn = مال او (مرد)، haar = مال او (زن)؛ هر دو با هر اسمی که بعدشان بیاید، همان شکل را دارند.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: این پدر او است
    gloss: این پدر او است.
    note: '*Zijn vader* — پدر او (مرد).'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: آن مادر او است
    gloss: آن مادر او است.
    note: '*Haar moeder* — مادر او (زن).'
  nl.a1.unit05.lesson05.teach.heet:
    title: نام دارد
    gloss: نام دارد
    note: '*Ik heet...* / *Hij heet...* — روش معمول گفتن نام کسی، که در بخش ۱ دیده‌اید.'
    example_gloss: نام من Lotte است.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: نام اعضای فامیل
    gloss: نام مردانهٔ هالندی / نام زنانهٔ هالندی / نام مردانهٔ هالندی / نام زنانهٔ هالندی
    note: هر چهار نام، نام‌های معمول هالندی‌اند — دو نام اول و سوم مردانه و نام‌های دوم و چهارم زنانه‌اند.
    example_gloss:
    - نام برادرم Sander است.
    - نام خواهرم Fenna است.
    - نام پدرم Jan است.
    - نام مادرم Marieke است.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Rotterdam
    note: یکی از شهرهای بزرگ هالند.
    example_gloss: نیکه و ننهٔ Lotte در Rotterdam زندگی می‌کنند.
  nl.a1.unit05.lesson05.teach.profile:
    title: معرفی خانوادهٔ Lotte
    gloss: نام من Lotte است. من یک برادر و یک خواهر دارم. نام برادرم Sander و نام خواهرم Fenna است. نام پدرم Jan و نام مادرم Marieke است. نیکه و ننهٔ من در Rotterdam زندگی می‌کنند.
    note: یک معرفی کوتاه گفتاری از خانوادهٔ Lotte، با کلمه‌هایی که در درس‌های قبلی همین بخش آمده بود.
  nl.a1.unit05.lesson06.teach.egypte:
    title: مصر
    gloss: مصر
    note: وطن Omar، مطابق بخش‌های قبلی.
    example_gloss: والدین من در مصر زندگی می‌کنند.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: هر ماه
    gloss: هر ماه
    note: '*Elke* + اسم مفرد، معنای «هر ...» را می‌دهد.'
    example_gloss: بلی، هر ماه.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: برادر یا خواهر داری؟
    gloss: 'Lotte: Omar، تو برادر یا خواهر داری؟ Omar: بلی، دو خواهر دارم. برادر ندارم. و تو؟ Lotte: من یک برادر و یک خواهر دارم.'
    note: '*Broers of zussen* — برادران یا خواهران، با شکل جمع.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: والدین تو هم در هالند زندگی می‌کنند؟
    gloss: 'Omar: والدین تو هم در هالند زندگی می‌کنند؟ Lotte: بلی، والدین من در Utrecht زندگی می‌کنند. و فامیل تو؟ Omar: والدین من در مصر زندگی می‌کنند، اما کاکایم این‌جا در Amsterdam زندگی می‌کند.'
    note: '*Wonen ook in* — هم‌چنان در ... زندگی می‌کنند؛ برای پرسیدن این‌که آیا برای کس دیگری هم همین‌طور است.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: او را زیاد می‌بینی؟
    gloss: 'Lotte: خوب است! او را زیاد می‌بینی؟ Omar: بلی، هر ماه.'
    note: '*Zie je hem vaak?* — روش طبیعی و معمول برای پرسیدن از تکرار دید و بازدید.'
