course:
  title: هالندی A2
  description: هالندی سطح متوسط که داستان لوته و عمر را ادامه می‌دهد و حالا یک بخش گرامری هم برای صحبت درباره گذشته دارد.
unit:
  content_key: nl.a2.unit82.hoe_het_vroeger_was
  title: How things used to be
  description: Describe repeated past habits with the regular Dutch imperfectum and contrast earlier life with the present.
teaching:
  nl.a2.unit82.lesson01.teach.tijdwoorden:
    title: قبلاً و حالا
    gloss: در گذشته، آن وقت، حالا، این روزها
    note: '*vroeger* را برای یک دورهٔ کلی در گذشته و *toen* را برای یک وقت مشخص به کار ببرید.'
    example_gloss:
    - من قبلاً در Utrecht زندگی می‌کردم.
    - آن وقت من جوان بودم.
    - حالا من در یک اپارتمان زندگی می‌کنم.
    - این روزها من با بایسکل به کار می‌روم.
  nl.a2.unit82.lesson01.teach.huisvesting:
    title: خانه و اندازه
    gloss: خانه، اپارتمان، کوچک، بزرگ
    note: '*Flat* یعنی اپارتمان، به‌ویژه اپارتمانی که در یک ساختمان چندمنزله است.'
    example_gloss:
    - خانه کوچک است.
    - اپارتمان بزرگ است.
  nl.a2.unit82.lesson01.teach.gn_vorm:
    title: ماضی قاعده‌مند (imperfectum)
    gloss: wonen ← woonde؛ werken ← werkte
    note: شکل‌های مفرد ماضی قاعده‌مند از ریشهٔ فعل به‌علاوهٔ *-te* یا *-de* ساخته می‌شوند.
  nl.a2.unit82.lesson01.teach.contrast:
    title: مقایسهٔ قبلاً و حالا
    gloss: من قبلاً در یک خانهٔ کوچک زندگی می‌کردم؛ حالا در یک اپارتمان زندگی می‌کنم.
    note: بخش گذشته *woonde* دارد؛ بخش حال *woon* دارد.
  nl.a2.unit82.lesson02.teach.werkwoorden:
    title: فعل‌های روزمره
    gloss: بایسکل سواری کردن، ساختن/انجام دادن، بازی کردن، یاد گرفتن، زندگی کردن، کار کردن
    note: با این فعل‌های قاعده‌مند می‌توانین هر دو پایانهٔ ماضی را تمرین کنید.
    example_gloss:
    - من با بایسکل به مکتب می‌روم.
    - من کارخانگی‌ام را انجام می‌دهم.
    - بچه‌ها بیرون بازی می‌کنند.
    - ما هالندی یاد می‌گیریم.
    - ما در Utrecht زندگی می‌کنیم.
    - من در شفاخانه کار می‌کنم.
  nl.a2.unit82.lesson02.teach.schoolwoorden:
    title: جاهای مکتب و کار
    gloss: مکتب، کارخانگی، بیرون، شفاخانه
    note: کلمه‌های مفید برای توصیف یک عادت روزمرهٔ گذشته.
    example_gloss:
    - من با بایسکل به مکتب می‌روم.
    - بعد از مکتب من کارخانگی‌ام را انجام می‌دهم.
    - ما بیرون بازی می‌کنیم.
    - Lotte در شفاخانه کار می‌کند.
  nl.a2.unit82.lesson02.teach.gn_kofschip:
    title: قاعدهٔ 't kofschip
    gloss: ریشه‌ای که به t، k، f، s، ch یا p ختم شود ← -te؛ در غیر این صورت ← -de
    note: 'به آخرین آوای ریشه نگاه کنید: *werk-te*، *fiets-te*، اما *woon-de* و *leer-de*.'
  nl.a2.unit82.lesson02.teach.vormen:
    title: شش شکل مفرد
    gloss: من کار کردم، با بایسکل رفتم، ساختم، بازی کردم، یاد گرفتم، زندگی کردم.
    note: همین شکل مفرد با *ik*، *jij* و *hij/zij* به کار می‌رود.
  nl.a2.unit82.lesson02.teach.elke_dag:
    title: هر روز
    gloss: هر روز من با بایسکل به مکتب می‌رفتم.
    note: '*Elke* با کلمه‌های de به کار می‌رود: *elke dag*.'
  nl.a2.unit82.lesson03.teach.gewoonte:
    title: عبارت‌های زمانیِ عادت
    gloss: همیشه، هر روز، هر تابستان، اکثراً
    note: این عبارت‌ها تکرارِ یک عادت در گذشته را روشن می‌سازند.
    example_gloss:
    - من همیشه با بایسکل به مکتب می‌رفتم.
    - هر روز من کارخانگی‌ام را انجام می‌دادم.
    - هر تابستان ما نزد پدرکلان و مادرکلان مهمان می‌شدیم.
    - ما اکثراً بیرون بازی می‌کردیم.
  nl.a2.unit82.lesson03.teach.familie:
    title: خانواده و محله
    gloss: پدرکلان و مادرکلان؛ محله
    note: '*Bij opa en oma* یعنی خانهٔ پدرکلان و مادرکلان.'
    example_gloss:
    - پدرکلان و مادرکلان در Utrecht زندگی می‌کردند.
    - محله آرام بود.
  nl.a2.unit82.lesson03.teach.logeren:
    title: مهمان بودن
    gloss: شب را مهمان ماندن / مهمان بودن
    note: '*Logeren bij* برای ماندن در خانهٔ کسی به کار می‌رود.'
    example_gloss: ما نزد پدرکلان و مادرکلان مهمان استیم.
  nl.a2.unit82.lesson03.teach.gn_number:
    title: مفرد و جمع
    gloss: من زندگی می‌کردم؛ ما زندگی می‌کردیم
    note: 'شکل‌های جمعِ قاعده‌مند با افزودن *-n* به شکل مفرد ماضی ساخته می‌شوند: *werkte → werkten*، *woonde → woonden*.'
  nl.a2.unit82.lesson03.teach.chunks:
    title: چهار عبارت بی‌قاعدهٔ مفید
    gloss: من بودم؛ من داشتم؛ من رفتم؛ من آمدم
    note: '*was*، *had*، *ging* و *kwam* را در اینجا مانند کلمه‌های ثابت یاد بگیرین، همراه با *stond* و *deed* که در متن خواندنی و گفتگو می‌آیند. قاعدهٔ آن‌ها بعداً می‌آید.'
  nl.a2.unit82.lesson03.teach.plural:
    title: یک عادت جمع در گذشته
    gloss: ما در یک محلهٔ آرام زندگی می‌کردیم و اکثراً بیرون بازی می‌کردیم.
    note: 'هر دو فعل جمع به *-en* ختم می‌شوند: *woonden*، *speelden*.'
  nl.a2.unit82.lesson04.teach.plaats:
    title: جاها و فاصله
    gloss: نزدیک به، دور از، دوکان، میدان بازی
    note: '*dicht bij* و *ver van* را پیش از نام یک جا به کار ببرید.'
    example_gloss:
    - مکتب نزدیک خانهٔ من است.
    - شفاخانه از خانهٔ من دور است.
    - دوکان در همین محل است.
    - بچه‌ها در میدان بازی می‌کنند.
  nl.a2.unit82.lesson04.teach.gn_habit:
    title: چرا اینجا از imperfectum استفاده می‌شود؟
    gloss: پیش‌ترها هر روز با بایسکل به مکتب می‌رفتم.
    note: در این درس برای عادت‌ها و حالت‌های تکراری در گذشته از زمان گذشتهٔ ناتمام (imperfectum) استفاده می‌کنیم؛ اینجا آن با گذشتهٔ نقلی (perfectum) مقایسه نمی‌شود.
  nl.a2.unit82.lesson04.teach.buurtzin:
    title: محلهٔ قدیمی
    gloss: پیش‌ترها نزدیک مکتب زندگی می‌کردم و همیشه در میدان بازی، بازی می‌کردم.
    note: 'بعد از *en*، فاعل مشترک بعد از فعل گذشتهٔ دوم می‌آید: *en speelde ik*.'
  nl.a2.unit82.lesson04.teach.nuzin:
    title: وضعیت حالا
    gloss: حالا دور از مکتب زندگی می‌کنم و در شفاخانه کار می‌کنم.
    note: هر دو فعل زمان حال استند، چون *nu* زمان حالا را مشخص می‌کند.
  nl.a2.unit82.lesson05.teach.jeugd:
    title: کودکی
    gloss: کودکی؛ بعد از مکتب
    note: '*Jeugd* دوره‌ای است که کسی جوان یا کم‌سن است.'
    example_gloss:
    - کودکی من خوب بود.
    - بعد از مکتب کار خانگی می‌کردم.
  nl.a2.unit82.lesson05.teach.reading:
    title: 'خواندن: کودکی لوته'
    gloss: وقتی لوته کوچک بود، با پدر و مادرش در اوترخت زندگی می‌کرد. خانهٔ شان کوچک بود و نزدیک مکتبش قرار داشت. هر روز با بایسکل به مکتب می‌رفت. بعد از مکتب بیرون بازی می‌کرد و کار خانگی‌اش را می‌کرد. هر تابستان لوته و پدر و مادرش نزد پدرکلان و مادرکلان می‌ماندند. حالا لوته در یک اپارتمان زندگی می‌کند و به حیث نرس در شفاخانه کار می‌کند.
    note: عادت‌های تکراری را که با *elke dag* و *elke zomer* نشان داده شده‌اند پیدا کنید، بعد تضاد با حالا را که با *tegenwoordig* نشان داده شده است.
  nl.a2.unit82.lesson06.teach.omar01:
    title: عمر از اوترخت می‌پرسد
    gloss: 'عمر: آیا تو هم پیش‌تر در اوترخت زندگی می‌کردی؟'
  nl.a2.unit82.lesson06.teach.lotte01:
    title: لوته خانهٔ قدیمی‌اش را توضیح می‌دهد
    gloss: 'لوته: بلی، با پدر و مادرم در یک خانهٔ کوچک زندگی می‌کردم.'
  nl.a2.unit82.lesson06.teach.omar02:
    title: عمر دربارهٔ برنامهٔ روزانه می‌پرسد
    gloss: 'عمر: بعد از مکتب چه می‌کردی؟'
  nl.a2.unit82.lesson06.teach.lotte02:
    title: لوته سه عادت را می‌شمارد
    gloss: 'لوته: با بایسکل به خانه می‌آمدم، بیرون بازی می‌کردم و بعد کار خانگی‌ام را می‌کردم.'
  nl.a2.unit82.lesson06.teach.lotte03:
    title: لوته حالا را مقایسه می‌کند
    gloss: 'لوته: حالا در یک اپارتمان زندگی می‌کنم و در شفاخانه کار می‌کنم.'
  nl.a2.unit82.lesson06.teach.gn_recap:
    title: قبلاً و حالا
    gloss: vroeger + زمان گذشتهٔ ناتمام (imperfectum)؛ nu + زمان حال
    note: برای حالت تکراری گذشته از imperfectum و برای تضاد با حالا از زمان حال استفاده کنید.
exercises:
  nl.a2.unit82.lesson01.exercise01.choose_past:
    instruction: جملهٔ هالندی را انتخاب کنید که معنایش «پیش‌ترها در یک خانهٔ کوچک زندگی می‌کردم.» باشد.
    correct_option: Vroeger woonde ik in een klein huis.
    distractors:
    - Vroeger woon ik in een klein huis.
    - Nu woonde ik in een klein huis.
    - Vroeger werkte ik in een klein huis.
    accepted_answers:
    - value: Vroeger woonde ik in een klein huis.
      status: correct
    feedback: '*Vroeger woonde ik in een klein huis* از فعل گذشتهٔ باقاعدهٔ *woonde* استفاده می‌کند.'
    prompt_blocks:
    - من قبلاً در یک خانهٔ کوچک زندگی می‌کردم.
  nl.a2.unit82.lesson01.exercise02.listen_house:
    instruction: گوش کنید و دقیقاً همان چیزی را که می‌شنوید انتخاب کنید.
    correct_option: Vroeger woonde ik in een klein huis.
    distractors:
    - Nu woon ik in een flat.
    - Vroeger werkte ik in een klein huis.
    - Tegenwoordig woon ik in een groot huis.
    accepted_answers:
    - value: Vroeger woonde ik in een klein huis.
      status: correct
    feedback: شما *Vroeger woonde ik in een klein huis* را شنیدید.
  nl.a2.unit82.lesson01.exercise03.match_times:
    instruction: هر مورد هالندی را با معنای دری‌اش جور کنید.
    accepted_answers:
    - value:
      - left: vroeger
        right: در گذشته
      - left: toen
        right: بعد
      - left: nu
        right: حالا
      - left: tegenwoordig
        right: این روزها
      - left: het huis
        right: خانه
      - left: de flat
        right: آپارتمان
      - left: klein
        right: کوچک
      - left: groot
        right: بزرگ
      status: correct
    feedback: این چهار کلمهٔ زمانی، زندگی گذشته را از زندگی حالا جدا می‌کنند.
    pairs:
    - left: vroeger
      right: در گذشته
    - left: toen
      right: بعد
    - left: nu
      right: حالا
    - left: tegenwoordig
      right: این روزها
    - left: het huis
      right: خانه
    - left: de flat
      right: آپارتمان
    - left: klein
      right: کوچک
    - left: groot
      right: بزرگ
  nl.a2.unit82.lesson01.exercise04.order_old_home:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «پیش‌ترها در یک خانهٔ کوچک زندگی می‌کردم.» با Vroeger شروع کنید.
    correct_option: Vroeger woonde ik in een klein huis
    accepted_answers:
    - value: Vroeger woonde ik in een klein huis
      status: correct
    feedback: '*Vroeger* در جای اول می‌آید، پس *woonde* پیش از *ik* قرار می‌گیرد.'
  nl.a2.unit82.lesson01.exercise05.choose_ending:
    instruction: ماضی بی‌قاعدهٔ منظم فعل wonen را برای ik انتخاب کنید.
    correct_option: woonde
    distractors:
    - woonte
    - wonen
    - woont
    accepted_answers:
    - value: woonde
      status: correct
    feedback: 'ریشهٔ *woon* به صدای ''t kofschip ختم نمی‌شود، پس *-de* می‌گیرد: *woonde*.'
    prompt_blocks:
    - ماضی بی‌قاعدهٔ منظم فعل wonen را برای ik انتخاب کنید.
  nl.a2.unit82.lesson01.exercise06.complete_woonde:
    instruction: جمله را با گذشتهٔ باقاعدهٔ مفرد فعل wonen کامل کنید.
    correct_option: woonde
    accepted_answers:
    - value: woonde
      status: correct
    feedback: '*Vroeger woonde ik in een klein huis.*'
  nl.a2.unit82.lesson01.exercise07.translate_contrast:
    instruction: به هالندی ترجمه کنید. در بخش گذشته از گذشتهٔ باقاعدهٔ مفرد فعل wonen و در بخش حالا از woon در زمان حال استفاده کنید.
    accepted_answers:
    - value: Vroeger woonde ik in een klein huis, nu woon ik in een flat.
      status: correct
    - value: Vroeger woonde ik in een klein huis. Nu woon ik in een flat.
      status: correct
    feedback: '*Vroeger woonde ik in een klein huis, nu woon ik in een flat.*'
    prompt_blocks:
    - من قبلاً در یک خانهٔ کوچک زندگی می‌کردم؛ حالا در یک اپارتمان زندگی می‌کنم.
  nl.a2.unit82.lesson02.exercise01.choose_fietste:
    instruction: گذشتهٔ باقاعدهٔ مفرد فعل fietsen را انتخاب کنید.
    correct_option: fietste
    distractors:
    - fietsde
    - fietsen
    - fietst
    accepted_answers:
    - value: fietste
      status: correct
    feedback: 'ریشهٔ *fiets* به *s* ختم می‌شود، پس *-te* می‌گیرد: *fietste*.'
    prompt_blocks:
    - ماضی قاعده‌مند فعل fietsen را برای ik انتخاب کنید.
  nl.a2.unit82.lesson02.exercise02.choose_speelde:
    instruction: گذشتهٔ باقاعدهٔ مفرد فعل spelen را انتخاب کنید.
    correct_option: speelde
    distractors:
    - speelte
    - spelen
    - speelt
    accepted_answers:
    - value: speelde
      status: correct
    feedback: 'ریشهٔ *speel* به صدای ''t kofschip ختم نمی‌شود، پس *-de* می‌گیرد: *speelde*.'
    prompt_blocks:
    - ماضی قاعده‌مند فعل spelen را برای ik انتخاب کنید.
  nl.a2.unit82.lesson02.exercise03.match_forms:
    instruction: هر مصدر را با گذشتهٔ باقاعدهٔ مفردش جور کنید.
    accepted_answers:
    - value:
      - left: werken
        right: werkte
      - left: fietsen
        right: fietste
      - left: maken
        right: maakte
      - left: spelen
        right: speelde
      - left: leren
        right: leerde
      - left: wonen
        right: woonde
      status: correct
    feedback: صدای آخر ریشه تعیین می‌کند که *-te* بیاید یا *-de*.
    pairs:
    - left: werken
      right: werkte
    - left: fietsen
      right: fietste
    - left: maken
      right: maakte
    - left: spelen
      right: speelde
    - left: leren
      right: leerde
    - left: wonen
      right: woonde
  nl.a2.unit82.lesson02.exercise04.order_school:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «هر روز با بایسکل به مکتب می‌رفتم.» با Elke dag شروع کنید.
    correct_option: Elke dag fietste ik naar school
    accepted_answers:
    - value: Elke dag fietste ik naar school
      status: correct
    feedback: '*Elke dag fietste ik naar school.*'
  nl.a2.unit82.lesson02.exercise05.complete_worked:
    instruction: جمله را با گذشتهٔ باقاعدهٔ مفرد فعل werken کامل کنید.
    correct_option: werkte
    accepted_answers:
    - value: werkte
      status: correct
    feedback: ریشه به *k* ختم می‌شود، پس شکل آن *werkte* است.
  nl.a2.unit82.lesson02.exercise06.translate_played:
    instruction: به هالندی ترجمه کنید. از گذشتهٔ باقاعدهٔ مفرد فعل spelen استفاده کنید.
    accepted_answers:
    - value: Vroeger speelde ik buiten.
      status: correct
    - value: Ik speelde vroeger buiten.
      status: correct
    - value: Ik speelde vroeger buiten
      status: correct
    - value: Vroeger speelde ik buiten
      status: correct
    feedback: '*Vroeger speelde ik buiten.*'
    prompt_blocks:
