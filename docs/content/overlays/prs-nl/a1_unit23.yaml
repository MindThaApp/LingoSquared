teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چند تمام می‌شود؟
    note: '*In totaal* (در مجموع) روشن می‌کند که قیمت کل را می‌خواهی، نه قیمت یک چیز را.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: گفتن قیمت مجموع
    gloss: در مجموع بیست و پنج یورو تمام می‌شود.
    note: '*Kost* شکل سوم شخص مفرد *kosten* است (قیمت داشتن).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: '*Pinnen* فعل مخصوص هالندی برای پرداخت با کارت است و از کد پین گرفته شده که پرداخت را تأیید می‌کند؛ *contant betalen* (در اصل «نقد پرداختن») شکل پرداخت نقدی است و *contant* مثل قید پیش از *betalen* می‌آید.'
    example_gloss:
    - اینجا می‌توانم با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: پرسیدن امکان پرداخت با کارت
    gloss: اینجا می‌توانم با کارت پرداخت کنم؟
    note: '*Hier* (این‌جا) سؤال را به همین جای فعلی ربط می‌دهد.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*Wilt u* ...? شکل رسمیِ *wil je* ...? است و این‌جا یک صندوق‌دار ناآشنا آن را به کار می‌برد.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: حساب
    gloss: حساب
    note: 'اسم از جنس مشترک: *de rekening*.'
    example_gloss: حساب را تقسیم کنیم؟
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*Zullen we* ...? همان الگوی پیشنهاد دادن یک برنامهٔ مشترک در درس‌های ۱۱ و ۱۹ است.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*Apart* (جدا) فعل *afrekenen* (حساب را تسویه کردن) را توضیح می‌دهد؛ afrekenen تقریباً هم‌معنی *betalen* است و مخصوصاً برای تسویهٔ نهایی پرداخت استفاده می‌شود.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: پول خورد
    gloss: پول خورد
    note: 'یک اسم خنثی: *het wisselgeld*؛ این کلمه از *wisselen* (تبدیل کردن) و *geld* (پول) ساخته شده است.'
    example_gloss: این هم پول خوردتان.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: دادن پول خورد
    gloss: این هم پول خوردتان.
    note: '*Uw* ضمیر ملکیت رسمیِ «شما» است و با لحن رسمی در صندوق یا پیش‌خوان مناسب است.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: '*Nodig hebben* (ضرورت داشتن) همان الگوی *rugzak nodig hebben* در درس ۱۴ را دوباره به کار می‌برد.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: سی و پنج
    gloss: سی و پنج
    note: '*Vijfendertig* (لفظاً «پنج و سی») از قاعدهٔ معمول هلندی پیروی می‌کند: در اعداد مرکب اول یکان می‌آید و بعد دهگان.'
    example_gloss: سی و پنج یورو تمام می‌شود.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'حساب: دو غذای اصلی و دو قهوه. مجموع: سی و پنج یورو. با کارت پرداخت شد.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      Rekening: حساب
      twee: دو
      hoofdgerechten: غذاهای اصلی
      koffies: قهوه‌ها
      Totaal: مجموع
      vijfendertig: سی و پنج
      euro: یورو
      Betaald: پرداخت شده
      pin: کارت
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: لوته بل را می‌خواهد
    gloss: 'لوته: بل را بخواهیم؟'
    note: '*Vragen* (خواستن) *de rekening* را به‌حیث مفعول مستقیم می‌گیرد.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: عمر مجموع را می‌پرسد
    gloss: 'عمر: بلی، فکر خوب است. در مجموع چقدر می‌شود؟'
    note: سوال *hoeveel kost het in totaal?* از درس اول دوباره آمده است.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: لوته مجموع را می‌گوید
    gloss: 'لوته: سی و پنج یورو می‌شود. تقسیمش کنیم؟'
    note: '*Delen* (تقسیم کردن) در اینجا به *de rekening* از متن اشاره می‌کند.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: عمر اصرار دارد که پول را بدهد
    gloss: 'عمر: نه، بگذار امروز من پول را بدهم. تو این‌قدر به من کمک کردی.'
    note: '*Laat mij* ... (بگذار من ...) روش معمول برای پیشنهاد انجام دادن کاری است؛ *geholpen* شکل ماضی (اسم مفعول) فعل *helpen* (کمک کردن) است.'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: لوته خوشحال شده است
    gloss: 'لوته: تو چقدر مهربان استی! تشکر.'
    note: '*Lief van je* (لطف تو) تعریفی گرم و معمول برای یک کار سخاوتمندانه است.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: عمر دربارهٔ پرداخت با کارت می‌پرسد
    gloss: 'عمر: اینجا می‌شود با کارت پرداخت؟'
    note: سوال *kan ik hier pinnen?* از درس دوم دوباره آمده، این بار در خود رستورانت.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: شکل او (سوم شخص مفرد)'
    gloss: عمر بل را پرداخت می‌کند.
    note: '*Betaalt* شکل سوم شخص مفرد فعل *betalen* (پرداخت کردن) است.'
