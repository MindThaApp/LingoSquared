  description: 'هالندی سطح مبتدی برای توصیف ظاهر اولیهٔ یک شخص: برداشت از قد و سن، رنگ مو و چشم، سؤال اصلی Hoe ziet ... eruit؟ و مقایسهٔ ظاهر دو نفر.'
