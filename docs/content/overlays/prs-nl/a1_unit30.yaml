teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Lang* برای آدم قدبلند و *klein* برای آدم کوتاه‌قد استفاده می‌شود (همین کلمه در جاهای دیگر این کورس برای چیز کوچک هم می‌آید).'
    example_gloss:
    - Fenna قدبلند است.
    - Sander کوتاه‌قد است.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Oud* و *jong* در اینجا یک برداشت عمومی از ظاهر را می‌رسانند، نه تعداد دقیق سال.'
    example_gloss:
    - بابه کلان پیر است.
    - Omar جوان است.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: یک عدد یا یک برداشت'
    gloss: Oud می‌تواند تعداد دقیق سال‌ها را برساند، مثل Hoe oud ben je?، یا یک برداشت عمومی بدون عدد، مثل Opa is oud.
    note: شما *oud* را از پرسیدن سن دقیق کسی (*Hoe oud ben je?*) می‌شناسید. اینجا این کلمه نشان می‌دهد کسی چند ساله به نظر می‌رسد، بدون هیچ عدد.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna قدبلند است و Sander کوتاه‌قد
    gloss: Fenna قدبلند است و Sander کوتاه‌قد است.
    note: یک جملهٔ ترکیبی ساده با *en* (و) که زمینه را برای مقایسهٔ مستقیم در درس پنجم آماده می‌کند.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: مو
    gloss: مو
    note: '*Haar* کلمهٔ het است: *het haar*.'
    example_gloss: Omar موهای کوتاه و سیاه دارد.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: سه رنگ مو. *Zwart* (سیاه) پیشتر در درس لباس‌ها آمده بود و اینجا برای مو دوباره استفاده می‌شود.
    example_gloss:
    - Lotte موهای طلایی دارد.
    - Sander موهای قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lang* (بلند) همان کلمهٔ قد از درس اول است، اما اینجا درازی مو را می‌رساند. *Kort* (کوتاه) در اینجا تازه است.'
    example_gloss:
    - Fenna موهای بلند دارد.
    - Sander موهای کوتاه دارد.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar صفت بدون پسوند می‌گیرد
    gloss: 'Haar کلمهٔ het است و حرف تعریف ندارد، پس صفت بدون پسوند می‌ماند: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: در این حالت نامعین و بدون حرف تعریف، پیش از *haar* پسوند -e نمی‌آید؛ برخلاف *ogen* در درس سوم که -e می‌گیرد.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: دو معنی'
    gloss: 'Haar دو معنی دارد: «مو» (کلمهٔ تازهٔ این درس) و «او/مال او» (ضمیر ملکی از واحد پنجم، مثلاً haar moeder). معنی درست از متن جمله معلوم می‌شود.'
    note: 'در هالندی دو کلمهٔ هم‌شکل وجود دارد: *haar* به معنی مو و *haar* به معنی «مال او» (مؤنث) یک‌جور نوشته می‌شوند. بقیهٔ جمله همیشه معلوم می‌کند کدام معنی است.'
    target_text: 'Haar دو معنی دارد: «مو» (اسم تازهٔ این درس) و «او/ـش» (ضمیر ملکی، مثلاً haar moeder). از متن معلوم می‌شود کدام معنی است.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar موهای کوتاه و سیاه دارد
    gloss: Omar موهای کوتاه و سیاه دارد.
    note: '*Zwart* (سیاه) از واحد بیستم، یعنی درس لباس‌ها، دوباره آمده است.'
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte موهای بلند و طلایی دارد
    gloss: Lotte موهای بلند و طلایی دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Ogen* جمع *het oog* است؛ جمع همیشه *de* می‌گیرد.'
    example_gloss: Omar چشم‌های قهوه‌یی دارد.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: '*Blauw* (آبی) پیشتر در درس لباس‌ها آمده بود؛ *bruin* (قهوه‌یی) همین حالا در درس دوم برای مو یاد گرفته شد؛ *groen* (سبز) اینجا تازه است.'
    example_gloss:
    - Lotte چشم‌های آبی دارد.
    - Sander چشم‌های قهوه‌یی دارد.
    - Fenna چشم‌های سبز دارد.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen پسوند -e می‌گیرد
    gloss: 'با ogen (جمع)، صفت یک -e اضافه می‌گیرد: blauwe ogen, bruine ogen, groene ogen.'
    note: این را با *haar* در درس دوم مقایسه کنید که صفت را بدون پسوند نگه می‌دارد؛ جمع همیشه -e می‌گیرد، چه de-word باشد چه het-word.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Lotte چه شکل و قیافه دارد؟
    gloss: Lotte چه شکل و قیافه دارد؟
    note: '*Hoe ziet ... eruit?* سؤال اصلی این واحد است؛ با آن می‌توانین دربارهٔ ظاهر هر کسی بپرسین.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte موهای بلند و طلایی و چشم‌های آبی دارد
    gloss: Lotte موهای بلند و طلایی و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *en* در یک جمله می‌آورد.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte، Nina را معرفی می‌کند
    gloss: 'Lotte: یک دختر نو به taalcafé می‌آید. نامش Nina است.'
    note: '*Er komt* (می‌آید) برای معرفی کسی تازه در صحنه استفاده می‌شود.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar می‌پرسد که او چه شکلی دارد
    gloss: 'Omar: خوب! او چه شکل و قیافه دارد؟'
    note: سؤال اصلی همین واحد، این بار با *ze* (او) به‌جای نام.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte قد و موی Nina را توصیف می‌کند
    gloss: 'Lotte: او کوتاه‌قد است و موهای کوتاه و طلایی دارد.'
    note: '*Klein* از درس اول با کلمه‌های مو از درس دوم یکجا شده است.'
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'Omar: و چشم‌هایش؟'
    note: '*Haar* اینجا به معنی «مال او» است (ضمیر ملکی از واحد پنجم)، نه «مو». به یادداشت درس دوم دربارهٔ کلمه‌های هم‌شکل نگاه کنید.'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte چشم‌های Nina را توصیف می‌کند
    gloss: 'Lotte: او چشم‌های سبز دارد.'
    note: '*Groene ogen* از درس سوم دوباره آمده است.'
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar او را خواهد شناخت
    gloss: 'Omar: تشکر! پس او را می‌شناسم.'
    note: '*Herken ik haar wel* — «او را حتماً می‌شناسم» — *haar* اینجا دوباره ضمیر «او» است، نه «مو».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: مقایسهٔ Sander و Fenna
    gloss: Sander و Fenna برادر و خواهر استند، اما شکل و قیافهٔ شان فرق دارد. Sander کوتاه‌قد است و موهای کوتاه قهوه‌یی و چشم‌های قهوه‌یی دارد. Fenna از Sander قدبلندتر است و موهای بلند قهوه‌یی و چشم‌های سبز دارد. شما چه شکل و قیافه دارید؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      broer: برادر
      zus: خواهر
      zien: ظاهر شدن، به نظر آمدن
      anders: فرق دار
      klein: کوتاه
      kort: کوتاه
      bruin: قهوه‌یی
      haar: مو
      bruine: قهوه‌یی
      ogen: چشم‌ها
      langer: قدبلندتر
      lang: دراز
      groene: سبز
      eruit: (بخشی از 'eruit zien' = به نظر رسیدن)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: استفادهٔ دوبارهٔ الگوی مقایسه
    gloss: 'این الگو را از مقایسه‌ها می‌شناسید: صفت + er + dan. اینجا برای آدم‌ها استفاده می‌شود: Fenna is langer dan Sander.'
    note: همان الگوی *صفت + -er + dan* از واحد چهاردهم، یعنی درس خرید کوله‌پشتی، که حالا برای توصیف آدم‌ها به‌کار می‌رود، نه چیزها.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna موهای بلندتر از Sander دارد
    gloss: Fenna موهای بلندتر از Sander دارد.
    note: '*Langer* پیش از *haar* (کلمهٔ het) بدون پسوند می‌ماند، مثل قاعدهٔ درس دوم؛ حتی در حالت تفضیلی.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جملهٔ نمونه با ضمیر اول شخص و *Ik heb ...*، آماده برای وقتی که ظاهر خودتان را توصیف می‌کنین.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar، Nina را می‌بیند
    gloss: 'Omar: ببین، آن Nina است؟ او موهای کوتاه و طلایی و چشم‌های سبز دارد.'
    note: '*Kijk* (ببین) پیشتر در دیالوگ واحد چهاردهم به همین شکل آمده بود.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte تأیید می‌کند
    gloss: 'Lotte: بلی، آن Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina به Omar سلام می‌دهد
    gloss: 'Nina: سلام، تو Omar استی؟'
    note: 'یک سؤال ساده برای احوال‌پرسی غیررسمی: *ben jij ...?*'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar جواب سلام Nina را می‌دهد
    gloss: 'Omar: بلی! از آشنایی با تو خوشحالم، Nina.'
    note: '*Leuk je te ontmoeten* — عبارت معمول برای اولین دیدار (به واحد اول نگاه کنید)، نه *leuk je te zien* که برای کسی است که از قبل می‌شناسید.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: دیالوگ تمام می‌شود — Omar با توصیف Lotte، Nina را درست شناخت.
