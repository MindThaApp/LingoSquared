teaching:
  nl.a2.unit78.lesson01.teach.weekend:
    title: آخر هفته / آخر هفتهٔ گذشته
    gloss: آخر هفته / آخر هفتهٔ گذشته (همان که تازه تمام شد)
    note: '*Het weekend* اسمی است که حرف تعریفش het می‌آید. *Afgelopen weekend* یعنی آخر هفته‌ای که همین حالا گذشته؛ بنابراین وقتی دربارهٔ آن قصه می‌کنی، این عبارت طبیعی‌ترین گزینه برای «آخر هفتهٔ گذشته» است.'
    example_gloss:
    - آخر هفته از روز شنبه شروع می‌شود.
    - آخر هفتهٔ گذشته کار کردم.
  nl.a2.unit78.lesson01.teach.zaterdag_zondag:
    title: شنبه و یکشنبه
    gloss: شنبه / یکشنبه
    note: در هالندی نام روزهای هفته با حرف بزرگ نوشته نمی‌شود، مگر اینکه اول جمله بیاید.
    example_gloss:
    - روز شنبه فارغ هستم.
    - روزهای یکشنبه تا دیر می‌خوابم.
  nl.a2.unit78.lesson01.teach.boodschappen:
    title: خرید و کارهای بیرون
    gloss: خرید کردن / کارهای بیرون را انجام دادن
    note: '*Boodschappen doen* عبارت ثابت برای خریدِ مواد خوراکی و کارهای کوچک بیرون از خانه است. *Boodschappen* جمع است و حرف تعریف ندارد.'
    example_gloss: هر شنبه خرید می‌کنم.
  nl.a2.unit78.lesson01.teach.op_bezoek:
    title: رفتن به دیدن کسی
    gloss: به دیدن کسی رفتن
    note: '*Op bezoek gaan* یعنی به خانهٔ کسی رفتن؛ بعد از آن *bij* و نام شخص می‌آید: *op bezoek bij mijn oom*.'
    example_gloss: من اکثر اوقات به دیدن کاکایم می‌روم.
  nl.a2.unit78.lesson01.teach.uitjes:
    title: جاهایی که آخر هفته می‌رویم
    gloss: بازار / پارک / سینما
    note: '*De markt* و *de bioscoop* کلمه‌های de استند؛ *het park* کلمهٔ het است.'
    example_gloss:
    - از بازار سبزی می‌خرم.
    - قدم زدن در پارک را دوست دارم.
    - روز شنبه به سینما می‌روم.
  nl.a2.unit78.lesson01.teach.werken_koken:
    title: چهار فعل روزمره
    gloss: کار کردن / پختن / خوردن / نوشیدن
    note: این‌ها مصدر استند. بعداً در همین واحد شکل گذشتهٔ آن‌ها را می‌سازی.
    example_gloss:
    - امروز باید کار کنم.
    - من خوب پخت و پز کرده می‌توانم.
    - می‌خواهم غذا بخورم.
    - می‌خواهی چای یا قهوه بنوشی؟ قهوه می‌نوشی؟
  nl.a2.unit78.lesson01.teach.vraag:
    title: پرسیدن اینکه کسی آخر هفتهٔ گذشته چه کار کرده
    gloss: آخر هفتهٔ گذشته چه کار کردی؟
    note: این سوال معمول است. *Gedaan* اسم‌مفعول *doen* است و در آخر جمله می‌آید.
  nl.a2.unit78.lesson01.teach.gn_frame:
    title: 'ماضی نقلی: heb/ben + اسم‌مفعول'
    gloss: روز شنبه خرید کردم. روز یکشنبه پیش کاکایم رفتم.
    note: '*Perfectum* راه معمول صحبت دربارهٔ کارهایی است که انجام داده‌ای. دو بخش دارد: شکلی از *hebben* یا *zijn* در جایگاه دوم، و *اسم‌مفعول* (*gedaan*، *gegaan*) در آخر جمله. چیزهای دیگر (روز، مفعول، جا) پیش از آن‌ها یا میان آن‌ها می‌آیند، اما *heb/ben* همیشه (در جملهٔ خبری) در جایگاه دوم می‌ماند: *Zaterdag heb ik boodschappen gedaan.* بیشتر فعل‌ها با *hebben* می‌آیند؛ *gaan* با *zijn* می‌آید. درس سوم توضیح می‌دهد که کی.'
  nl.a2.unit78.lesson02.teach.weekend_verbs:
    title: چهار فعالیت آخر هفته
    gloss: قدم زدن / بایسکل سواری کردن / بازی کردن / ورزش کردن
    note: '*Spelen* برای بازی‌ها و ورزش‌هایی که با توپ اند و هم برای آلات موسیقی استفاده می‌شود: *voetbal spelen*. *Sporten* یعنی به طور کلی ورزش کردن.'
    example_gloss:
    - برویم قدم بزنیم؟
    - فردا بایسکل سواری می‌کنم.
    - بچه‌ها می‌خواهند بیرون بازی کنند.
    - می‌خواهم بیشتر ورزش کنم.
  nl.a2.unit78.lesson02.teach.gn_regular:
    title: 'اسم‌مفعول‌های باقاعده: ge- + ریشه + -t یا -d'
    gloss: کار کردن ← کار کرد، پختن ← پخت، قدم زدن ← قدم زد، بازی کردن ← بازی کرد، بایسکل سواری کردن ← بایسکل سواری کرد
    note: 'فعل‌های باقاعده اسم‌مفعول را با *ge-* + ریشه + *-t* یا *-d* می‌سازند. ریشه همان شکل *ik* است: *werk*، *kook*، *wandel*، *speel*، *fiets*. کدام پسوند؟ آخرین حرف ریشه را با آزمون *''t kofschip* بسنج (این‌جا فقط یک نمونه است؛ قاعدهٔ کامل بعداً می‌آید): اگر یکی از *t, k, f, s, ch, p* بود، *-t* بیفزا (*werk → gewerkt*، *kook → gekookt*، *fiets → gefietst*). برای هر حرف دیگر، *-d* بیفزا (*wandel → gewandeld*، *speel → gespeeld*). آزمون به ریشه (شکل *ik*) نگاه می‌کند. یک استثنا برای بعد: اگر مصدر *v* یا *z* داشته باشد (*leven, reizen*)، *-d* بیاور: *geleefd, gereisd*.'
  nl.a2.unit78.lesson02.teach.gn_stem_t:
    title: وقتی ریشه از پیش به -t ختم می‌شود
    gloss: ورزش می‌کنم. ورزش کرده‌ام / ورزش کردم.
    note: 'اگر ریشه از پیش به *-t* (یا *-d*) ختم شود، چیزی دیگر نمی‌افزایی: *sport → gesport*، نه *gesportt*. باز هم *ge-* را در پیش می‌گذاری.'
  nl.a2.unit78.lesson02.teach.park_gewandeld:
    title: قدم زدن در پارک
    gloss: در پارک قدم زدم.
    note: '*Wandelen* در این‌جا با *hebben* می‌آید، چون مقصدی در کار نیست و فقط گشت و گذار است.'
  nl.a2.unit78.lesson02.teach.voetbal_gespeeld:
    title: فوتبال بازی کردن
    gloss: فوتبال بازی کردم.
    note: 'برای ورزش‌ها *gespeeld* می‌آید: *voetbal spelen → ik heb voetbal gespeeld*.'
  nl.a2.unit78.lesson03.teach.hebben_zijn:
    title: دو فعل کمکی
    gloss: داشتن / بودن
    note: 'در perfectum، *hebben* و *zijn* فعل‌های کمکی استند. شکل‌هایشان: *ik heb, ik ben*؛ *het heeft, het is*.'
    example_gloss:
    - من هم می‌خواهم یک بایسکل داشته باشم.
    - می‌تواند مزه‌دار باشد.
  nl.a2.unit78.lesson03.teach.gn_irregular:
    title: 'اسم‌مفعول‌های بی‌قاعده: آن‌ها را مثل یک کلمهٔ کامل یاد بگیر'
    gloss: دیدن ← دیده، خواندن ← خوانده، خوابیدن ← خوابیده، خوردن ← خورده، نوشیدن ← نوشیده، خریدن ← خریده، کردن ← کرده
    note: 'فعل‌های بی‌قاعده از قاعدهٔ *-t/-d* پیروی نمی‌کنند. بیشتر آن‌ها باز هم با *ge-* شروع می‌شوند و بسیاری به *-en* ختم می‌شوند: *gezien, gelezen, geslapen, gegeten, gedronken, gedaan*. بعضی، مثل *kopen → gekocht*، به *-t* ختم می‌شوند اما در میان کلمه تغییر می‌کنند. آزمون سریع: اگر اسم‌مفعولی با افزودن یک *-t* یا *-d* باقاعده به ریشه ساخته نشده باشد، بی‌قاعده است و باید آن را مثل یک کلمهٔ کامل یاد بگیری.'
  nl.a2.unit78.lesson03.teach.film_gezien:
    title: تماشای یک فلم
    gloss: یک فلم دیدم.
    note: در هالندی برای رفتن به سینما یا تماشای فلم در خانه، *een film zien* (دیدن یک فلم) می‌گویند.
  nl.a2.unit78.lesson03.teach.lang_geslapen:
    title: دو اسم‌مفعول در یک جمله
    gloss: مدت زیادی خوابیدم و یک کتاب خواندم.
    note: 'وقتی دو کار با همان *heb* داری، می‌توانی *heb* دوم را نیاوری: *Ik heb lang geslapen en een boek gelezen.*'
  nl.a2.unit78.lesson03.teach.bezocht:
    title: اسم‌مفعول بدون ge-
    gloss: به دیدن کاکایم رفتم.
    note: 'فعل‌هایی که با پیشوند بی‌تکیه‌ای مثل *be-*، *ver-* یا *ont-* شروع می‌شوند، *ge-* نمی‌گیرند: *bezoeken → bezocht* (دیدن کردن). این یکی هم بی‌قاعده است. *Ik heb mijn oom bezocht* و *Ik ben op bezoek geweest bij mijn oom* تقریباً یک معنا دارند.'
  nl.a2.unit78.lesson03.teach.gn_aux:
    title: Hebben یا zijn؟
    gloss: یک فلم دیدم. پیش کاکایم رفتم. در خانه ماندم. پیش کاکایم بودم. دیر شد.
    note: '*Hebben* فعل کمکی معمول است: *Ik heb gewerkt, ik heb een film gezien*. برای دو گروه *zijn* را به کار ببر: (۱) رفتن به جای تازه، مثل *gaan* و *komen*، و (۲) بودن یا تغییر کردن، مثل *zijn, blijven, worden*. آزمون سریع: آیا خود فعل دربارهٔ رفتن یا آمدن به جایی، ماندن (*blijven*)، بودن (*zijn*) یا شدن (*worden*) است؟ پس *zijn*. دقت کن که *het* با *is* می‌آید: *Het is laat geworden* (دیر شد). حرکت بدون مقصد با *hebben* می‌آید: *Ik heb in het park gewandeld*، اما با مقصد *zijn* می‌گیرد.'
  nl.a2.unit78.lesson03.teach.zijn_verbs:
    title: فعل‌های حرکت و تغییر (با zijn)
    gloss: رفتن ← رفته، آمدن ← آمده، ماندن ← مانده، شدن ← شده، بودن ← بوده
    note: 'این پنج فعل perfectum را با *zijn* می‌سازند: *ik ben gegaan, ik ben gekomen, ik ben gebleven, het is geworden, ik ben geweest*. هر پنج اسم‌مفعول بی‌قاعده دارند.'
  nl.a2.unit78.lesson04.teach.eerst_daarna:
    title: اول و بعد
    gloss: اول / بعد از آن
    note: '*Eerst* و *daarna* کارها را به ترتیب می‌آورند. این‌ها کلمه‌های ربطی استند که برای قصه کردن آخر هفته به ترتیب لازم داری.'
    example_gloss:
    - اول کار می‌کنم، بعد از آن می‌روم ورزش می‌کنم.
    - اول غذا می‌خورم، بعد از آن چای می‌نوشم.
  nl.a2.unit78.lesson04.teach.gn_order:
    title: 'قصه کردن به ترتیب: eerst، daarna'
    gloss: اول به بازار رفتم، بعد از آن پخت و پز کردم.
    note: 'بعد از *eerst* یا *daarna*، فعل کمکی بلافاصله بعد از آن و پیش از *ik* می‌آید: *Daarna heb ik gekookt*، نه *Daarna ik heb gekookt*. اسم‌مفعول در آخر هر بخش می‌ماند.'
  nl.a2.unit78.lesson04.teach.gn_niet:
    title: 'گفتن آنچه نکردی: niet'
    gloss: کار نکردم. کتاب را نخواندم. پیش کاکایم نرفتم.
    note: 'در perfectum، *niet* پیش از اسم‌مفعول می‌آید: *Ik heb niet gewerkt*. اگر جمله مفعول مشخصی داشته باشد (*het boek*)، مفعول اول می‌آید و *niet* بعد از آن: *Ik heb het boek niet gelezen*. پیش از جا یا جهت، *niet* پیش از آن قرار می‌گیرد: *Ik ben niet naar mijn oom gegaan*. کلمهٔ زمان مثل *zaterdag* پیش از *niet* می‌آید: *Ik heb zaterdag niet gewerkt*. هرگز *niet* را بعد از اسم‌مفعول نگذار.'
  nl.a2.unit78.lesson04.teach.gn_geen:
    title: 'گفتن اینکه هیچ نداشتی: geen'
    gloss: قهوه نخوردم. وقت نداشتم.
    note: '*Geen* را به جای *een* یا به جای نبودن حرف تعریف پیش از یک اسم به کار ببر: *een film → geen film*، *koffie → geen koffie*، *tijd → geen tijd*. برای فعل‌ها، چیزهای مشخص (*het boek*) و جاها *niet* را به کار ببر. *Gehad* اسم‌مفعول *hebben* است.'
  nl.a2.unit78.lesson04.teach.lotte_gesport:
    title: لوته دربارهٔ ورزش می‌پرسد
    gloss: 'لوته: ورزش کردی؟'
    note: 'در سوال بلی/نخیر، فعل کمکی اول می‌آید: *Heb je gesport?*'
  nl.a2.unit78.lesson04.teach.omar_niet_gesport:
    title: عمر نخیر می‌گوید
    gloss: 'عمر: نخیر، ورزش نکردم.'
  nl.a2.unit78.lesson05.teach.noor_bericht:
    title: پیامی از نور
    gloss: سلام لوته! آخر هفتهٔ آرامی بود. صبح شنبه به بازار رفتم و نان خریدم. چاشت در پارک قدم زدم. شام پخت و پز کردم. ورزش نکردم و فلم ندیدم. روز یکشنبه در خانه ماندم. مدت زیادی خوابیدم و یک کتاب خواندم.
    note: 'نور آخر هفته‌اش را به ترتیب برای لوته قصه می‌کند: صبح شنبه، چاشت و شام، بعد یکشنبه. دقت کن که اسم‌مفعول در هر جمله کجا می‌آید: همیشه در آخر. *''s Middags* و *''s Avonds* یعنی «چاشت» و «شام».'
    glosses:
      hoi: سلام
      rustig: آرام، ساکت
      weekend: آخر هفته
      geweest: بوده (اسم‌مفعول بودن)
      zaterdagochtend: صبح شنبه
      markt: بازار
      brood: نان
      gekocht: خریده (اسم‌مفعول خریدن)
      middags: چاشت، بعد از ظهر
      park: پارک
      gewandeld: قدم زده (اسم‌مفعول قدم زدن)
      avonds: شام، شب‌هنگام
      gekookt: پخته (اسم‌مفعول پختن)
      niet: نه
      gesport: ورزش کرده (اسم‌مفعول ورزش کردن)
      geen: نخیر، هیچ
      film: فلم
      gezien: دیده (اسم‌مفعول دیدن)
      zondag: یکشنبه
      thuisgebleven: در خانه مانده (اسم‌مفعول در خانه ماندن)
      lang: طولانی، مدت زیاد
      geslapen: خوابید (اسم مفعول)
      boek: کتاب
      gelezen: خواند (اسم مفعول)
  nl.a2.unit78.lesson06.teach.lotte_vraag:
    title: لوته از عمر دربارهٔ آخر هفته‌اش می‌پرسد
    gloss: 'لوته: سلام عمر! آخر هفتهٔ گذشته چه کردی؟'
  nl.a2.unit78.lesson06.teach.omar_zaterdag:
    title: عمر روز شنبه‌اش را شرح می‌دهد
    gloss: 'عمر: روز شنبه خانهٔ کاکایم در امستردام رفتم. آنجا نزد کاکایم غذا خوردم.'
    note: '*Bij mijn oom* یعنی «در خانهٔ کاکایم». *Naar mijn oom* جهت را نشان می‌دهد و *bij mijn oom* مکان را.'
  nl.a2.unit78.lesson06.teach.lotte_zondag:
    title: لوته دربارهٔ یکشنبه می‌پرسد
    gloss: 'لوته: خوب شد! و یکشنبه؟'
  nl.a2.unit78.lesson06.teach.omar_zondag:
    title: عمر یکشنبه‌اش را شرح می‌دهد و از لوته می‌پرسد
    gloss: 'عمر: یکشنبه در خانه ماندم. مدت زیاد خوابیدم و ورزش نکردم. تو چطور؟'
  nl.a2.unit78.lesson06.teach.lotte_antwoord:
    title: لوته آخر هفته‌اش را شرح می‌دهد
    gloss: 'لوته: من پیش پدر و مادرم رفتم. خرید نکردم، ولی آشپزی کردم.'
