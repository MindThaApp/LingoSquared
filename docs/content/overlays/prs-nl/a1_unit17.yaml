teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: پرسیدن دربارهٔ شغل کسی
    gloss: شما چه کار می‌کنین؟
    note: راه معمول و دوستانه برای پرسیدن شغل کسی.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: شغل / آشپز
    gloss: شغل؛ آشپز
    note: '*Het beroep* (شغل) اسم خنثی است. *Kok* (آشپز) اسم عام برای هر جنس است: *een kok*، *de kok*.'
    example_gloss:
    - شغل تو چیست؟
    - من به حیث آشپز کار می‌کنم.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: گفتن اینکه آشپز استین
    gloss: من به حیث آشپز کار می‌کنم.
    note: '*Werken als* + شغل الگوی معمول برای گفتن شغل است؛ پیش از اسم شغل حرف تعریف نمی‌آید.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: نرس
    gloss: نرس
    note: اصطلاح امروزی و بی‌جنسیت برای این شغل که برای هر جنسیت به کار می‌رود.
    example_gloss: من به حیث نرس کار می‌کنم.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: گفتن اینکه نرس استین
    gloss: من به حیث نرس کار می‌کنم.
    note: همان الگوی *werken als* است که با *kok* دیدید.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: پرسیدن دربارهٔ محل کار
    gloss: در کجا کار می‌کنی؟
    note: سوال بعدیِ مستقیم برای *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: کار در رستورانت
    gloss: من در یک رستورانت کار می‌کنم.
    note: '*Een restaurant* اینجا حرف تعریف نامعین می‌گیرد، چون یکی از چندین رستورانت است.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: شفاخانه
    gloss: شفاخانه
    note: 'اسم خنثی: *het ziekenhuis*.'
    example_gloss: من در شفاخانه کار می‌کنم.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: کار در شفاخانه
    gloss: من در شفاخانه کار می‌کنم.
    note: '*Het ziekenhuis* حرف تعریف معین می‌گیرد؛ هالندی آن را نهاد مشخص و شناخته‌شده می‌داند.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: کار در دفتر
    gloss: بعضی مردم در یک دفتر کار می‌کنند.
    note: '*Op kantoor* (در دفتر) عبارت ثابت و بدون حرف تعریف است، برخلاف *in een restaurant* و *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: وقت شروع
    gloss: من ساعت نُه شروع می‌کنم.
    note: '*Begin* شکل ik فعل *beginnen* (شروع کردن) است؛ الگوی ساعت از بخش ۴ تکرار شده است.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: روزهای کار
    gloss: من از دوشنبه تا جمعه کار می‌کنم.
    note: '*Van... tot...* همان الگوی بازهٔ روزهای هفته از بخش ۳ است.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: وقفه
    gloss: وقفه
    note: 'اسم عام: *de pauze*.'
    example_gloss: من ساعت دوازده وقفه دارم.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: وقفه داشتن
    gloss: من ساعت دوازده وقفه دارم.
    note: '*Pauze hebben* (تنفس داشتن) الگوی ثابت و طبیعی است.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: وقت ختم کار
    gloss: من ساعت پنج ختم می‌کنم.
    note: '*Stop* شکل ik فعل *stoppen* (ختم کردن) است.'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: یک روز کامل کاری
    gloss: من ساعت نُه شروع می‌کنم و ساعت پنج ختم می‌کنم.
    note: '*Begin* و *stop* با *en* در یک جمله یکجا شده و تمام روز کاری را شرح می‌دهد.'
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: آخر فعل برای سوم شخص
    gloss: 'با «او» (مذکر یا مؤنث) فعل معمولاً یک -t اضافه می‌گیرد: او کار می‌کند.'
    note: '*Werk* برای *hij* و *zij* به *werkt* تبدیل می‌شود؛ الگوی عادی سوم شخص در زمان حال هالندی.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: شغل Lotte
    gloss: Lotte به حیث نرس کار می‌کند.
    note: '*Werkt* (نه *werk*) چون فاعل نام سوم شخص است، نه *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: شغل Omar
    gloss: Omar به حیث آشپز کار می‌کند.
    note: همان -t سوم شخص مثل *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: استفاده از ضمیرها
    gloss: او در شفاخانه کار می‌کند. او در یک رستورانت کار می‌کند.
    note: '*Zij* و *hij* به جای نام‌های Lotte و Omar می‌آیند، اما شکل فعل با -t سوم شخص همان می‌ماند.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: دو معرفی کاری را بخوانین
    gloss: Lotte در شفاخانه به حیث نرس کار می‌کند. او ساعت هفت شروع می‌کند و از دوشنبه تا جمعه کار می‌کند. Omar در یک رستورانت به حیث آشپز کار می‌کند. او ساعت یازده شروع می‌کند و ساعت چهار تنفس دارد.
    note: کار، محل کار و ساعت‌های کاری هر شخص را جداگانه دنبال کنید.
    glosses:
      werkt: کار می‌کند
      verpleegkundige: نرس
      ziekenhuis: شفاخانه
      begint: شروع می‌شود
      zeven: هفت
      maandag: دوشنبه
      vrijdag: جمعه
      kok: آشپز / سرآشپز
      restaurant: رستورانت
      elf: یازده
      pauze: وقفه
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte دربارهٔ کار می‌پرسد
    gloss: 'Lotte: سلام Omar! کنجکاو استم، تو راستی چه کار می‌کنی؟'
    note: '*Eigenlijk* (راستی) سوال را نرم می‌کند و آن را به کنجکاوی دوستانه تبدیل می‌کند، نه بازجویی.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar جواب می‌دهد
    gloss: 'Omar: من در یک رستورانت به حیث آشپز کار می‌کنم. و تو؟'
    note: '*En jij?* راه معمول برای برگرداندن سوال به طرف مقابل است.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte جواب می‌دهد
    gloss: 'Lotte: من در شفاخانه به حیث نرس کار می‌کنم.'
    note: با کار و محل کاری که پیش‌تر در درس‌های قبلی آمده، هماهنگ است.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar دربارهٔ ساعت‌های کار می‌پرسد
    gloss: 'Omar: ساعت‌های کارت چطور است؟'
    note: '*Uren maken* (لفظاً «ساعت ساختن») اصطلاح ثابت برای گفتن برنامهٔ کار است.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte ساعت‌های کارش را می‌گوید
    gloss: 'Lotte: من ساعت هفت شروع می‌کنم و از دوشنبه تا جمعه کار می‌کنم.'
    note: با برنامه‌ای که پیش‌تر در متن خواندنی درس آمده، هماهنگ است.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: واکنش Omar
    gloss: 'Omar: چه زود! من دیرتر شروع می‌کنم، ساعت یازده.'
    note: با وقت شروع Omar که در درس پنجم آمده بود مطابقت دارد.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte بحث را ختم می‌کند
    gloss: 'Lotte: فکر کنم هر کار ریتم خودش را دارد.'
    note: یک جملهٔ پایانی طبیعی و تأملی است؛ معنایش را بفهمید، لازم نیست دقیقاً همین‌طور بگویین.
