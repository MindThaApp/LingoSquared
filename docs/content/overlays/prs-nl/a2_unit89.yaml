    instruction: جمله‌ای را انتخاب کنید که معنی «به من کمک کرده می‌توانی؟» را بدهد.
    correct_option: Zou je mij kunnen helpen?
    distractors:
    - Zou je kunnen mij helpen?
    - Zou je mij kunt helpen?
    - Zou je mij kunnen halen?
    accepted_answers:
    - value: Zou je mij kunnen helpen?
      status: correct
    feedback: در *Zou je mij kunnen helpen?* فعل *kunnen* پیش از فعل پایانی می‌آید.
    prompt_blocks:
    - کدام جمله معنی «آیا می‌توانی به من کمک کنی؟» را دارد؟
  nl.a2.unit89.lesson01.exercise02.kies_pakket:
