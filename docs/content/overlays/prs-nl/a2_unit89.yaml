course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر دستور زبان برای درخواست‌ها، پیشنهادها و جواب‌های مودبانه.
  learning_goal: با zou je/u ... kunnen درخواست مودبانه کنید، با zal ik کمک پیشنهاد کنید، با even و eens دستورها را نرم‌تر بگویین و پیشنهادها را بپذیرید یا رد کنید.
units:
  nl.a2.unit89.beleefd_vragen:
    title: درخواست‌های مودبانه
    description: کمک بخواهید، کمک پیشنهاد کنید و با دوستان، همسایه‌ها و کارمندان دکان‌ها مودبانه بپذیرید یا رد کنید.
lessons:
  nl.a2.unit89.lesson01.zou_je_kunnen:
    title: آیا می‌توانی به من کمک کنی؟
  nl.a2.unit89.lesson02.je_of_u:
    title: je یا u؟
  nl.a2.unit89.lesson03.zal_ik:
    title: آیا من این کار را بکنم؟
  nl.a2.unit89.lesson04.even_en_eens:
    title: even و eens
  nl.a2.unit89.lesson05.graag_of_nee_hoor:
    title: بلی لطفاً یا نه تشکر
  nl.a2.unit89.lesson06.koffie_bij_lotte:
    title: قهوه پیش لوته
teaching:
  nl.a2.unit89.lesson01.teach.buren:
    title: همسایه‌ها و دکان‌ها
    gloss: همسایه (مرد) / همسایه (زن) / دکان / سوپرمارکت
    note: این کلمه‌ها اشخاص و جاهای این بخش را نام می‌برند.
    example_gloss:
    - همسایهٔ من مهربان است.
    - همسایه به دکان می‌رود.
    - سوپرمارکت باز است.
  nl.a2.unit89.lesson01.teach.spullen:
    title: چیزهایی که دربارهٔ آن‌ها درخواست می‌کنین
    gloss: کیف / کلید / بسته / سودا
    note: '*Boodschappen* همیشه جمع است: یعنی سودا.'
    example_gloss:
    - کیف سنگین است.
    - کلید کجاست؟
    - بسته بزرگ است.
    - من سودای زیاد دارم.
  nl.a2.unit89.lesson01.teach.werkwoorden:
    title: فعل‌هایی برای درخواست
    gloss: کمک کردن / آوردن / رفته آوردن / خریدن
    note: '*Halen* یعنی رفتن و چیزی را آوردن.'
    example_gloss:
    - من به همسایه کمک می‌کنم.
    - من بسته را می‌آورم.
    - من نان می‌آورم.
    - من قهوه می‌خرم.
  nl.a2.unit89.lesson01.teach.gn_zou_je:
    title: درخواست مودبانه با zou je ... kunnen
    gloss: آیا می‌توانی به من کمک کنی؟
    note: Zou je + چیزی که می‌خواهی + kunnen + فعل. فعل اصلی به آخر جمله می‌رود.
  nl.a2.unit89.lesson01.teach.zinnen:
    title: سه درخواست مودبانه
    gloss: آیا می‌توانی کلید را بیاوری؟ آیا می‌توانی بسته را بیاوری؟ آیا می‌توانی سودا را بخری؟
  nl.a2.unit89.lesson01.teach.natuurlijk:
    title: قبول کردن یک درخواست
    gloss: بلی، البته.
  nl.a2.unit89.lesson02.teach.diensten:
    title: اشخاص و خدمات
    gloss: آقا / خانم / نانوا / پُستخانه
    note: '*Meneer* و *mevrouw* را برای کسانی به کار ببر که خوب نمی‌شناسی.'
    example_gloss:
    - صبح بخیر، آقا.
    - روز بخیر، خانم.
    - نانوا نان دارد.
    - پستخانه نزدیک است.
  nl.a2.unit89.lesson02.teach.brood:
    title: پیش نانوا و در پُستخانه
    gloss: نان / این / وزن کردن / تکه کردن / بسته‌بندی کردن
    note: '*Dit* به چیزی اشاره می‌کند که نزدیک تو است.'
    example_gloss:
    - نان تازه است.
    - این بسته سنگین است.
  nl.a2.unit89.lesson02.teach.gn_u:
    title: je یا u
    gloss: آیا می‌توانی به من کمک کنی؟ (به دوست) آیا می‌توانین به من کمک کنید؟ (به شخص ناآشنا)
    note: '*je* را با دوستان و خانواده به کار ببر. *u* را با اشخاص ناآشنا، بزرگ‌سالان و در بسیاری از دکان‌ها و ادارات به کار ببر. فقط ضمیر تغییر می‌کند؛ باقی جمله همان می‌ماند.'
  nl.a2.unit89.lesson02.teach.gn_alstublieft:
    title: 'لطفاً: alsjeblieft یا alstublieft'
    gloss: لطفاً این را وزن کرده می‌توانین؟ (دوست) لطفاً این را وزن کرده می‌توانین؟ (رسمی)
    note: '*Alsjeblieft* با *je* می‌آید و *alstublieft* با *u*.'
  nl.a2.unit89.lesson02.teach.zinnen:
    title: درخواست‌های رسمی
    gloss: نان را بریده می‌توانین؟ این بسته را وزن کرده می‌توانین؟ این را بسته‌بندی کرده می‌توانین؟
  nl.a2.unit89.lesson03.teach.werkwoorden:
    title: فعل‌ها برای پیشنهاد
    gloss: حمل کردن / دم کردن (قهوه) / پول دادن / قهوه / برای
    note: '*Koffie zetten* یعنی قهوه دم کردن.'
    example_gloss:
    - من کیف را حمل می‌کنم.
    - من برای همسایه قهوه دم می‌کنم.
    - من پول قهوه را می‌دهم.
  nl.a2.unit89.lesson03.teach.gn_zal:
    title: پیشنهاد کمک با zal ik
    gloss: آیا کیف را ببرم؟
    note: '*Zal ik ...?* پیشنهاد می‌کند که خودت کاری را انجام بدهی. فعل اصلی به آخر جمله می‌رود.'
  nl.a2.unit89.lesson03.teach.gn_voor:
    title: Voor je یا voor u
    gloss: برایت قهوه دم کنم؟ (دوست) برایتان قهوه دم کنم؟ (رسمی)
    note: برای دوست *voor je* و برای شخص غریبه *voor u* اضافه کن تا بگویی کمک برای کیست.
  nl.a2.unit89.lesson03.teach.gn_contrast:
    title: خواهش یا پیشنهاد
    gloss: کیف را حمل کرده می‌توانی؟ کیف را من حمل کنم؟
    note: '*Zou je ... kunnen?* از طرف مقابل می‌خواهد که کاری کند. *Zal ik ...?* پیشنهاد می‌کند که خودت کاری را انجام بدهی.'
  nl.a2.unit89.lesson03.teach.zinnen:
    title: سه پیشنهاد
    gloss: قهوه دم کنم؟ خریداری را بیاورم؟ پول را من بدهم؟
  nl.a2.unit89.lesson04.teach.werkwoorden:
    title: کارهای کوچک دم دروازه
    gloss: داخل / نشستن / صبر کردن / نگاه کردن / دادن
    note: '*Binnen* با *komen* می‌آید (داخل آمدن).'
    example_gloss:
    - همسایه داخل می‌آید.
    - من بالای چوکی می‌نشینم.
    - من منتظر همسایه استم.
    - من به بسته نگاه می‌کنم.
    - من کلید را می‌دهم.
  nl.a2.unit89.lesson04.teach.gn_imperatief:
    title: فعل امر
    gloss: داخل بیا. بنشین. صبر کن. نگاه کن. کلید را بده.
    note: 'فعل امر همان ریشهٔ فعل است، بدون *je*: *komen* می‌شود *kom*، *gaan* می‌شود *ga*، *geven* می‌شود *geef*.'
  nl.a2.unit89.lesson04.teach.gn_even_eens:
    title: Even و eens امر را نرم می‌کنند
    gloss: لطفاً داخل بیا. بفرما بنشین. یک لحظه صبر کن. یک نظر بینداز.
    note: '*Even* و *eens* امر را دوستانه‌تر می‌سازند. *Even* اکثراً فقط خواهش را نرم می‌کند و می‌تواند کوتاه بودن کار را هم برساند.'
  nl.a2.unit89.lesson04.teach.gn_u_imperatief:
    title: دعوت مؤدبانه با u
    gloss: لطفاً داخل شوین. بفرمایید بنشینید.
    note: 'برای مؤدب بودن با کسی که به او *u* می‌گویی، فعل صرف‌شده را پیش از *u* بگذار: *komt u, gaat u*.'
  nl.a2.unit89.lesson04.teach.zinnen:
    title: Even در خواهش‌ها
    gloss: کلید را یک لحظه به من بده. یک لحظه صبر کرده می‌توانی؟
    note: '*Me* شکل کوتاه *mij* است.'
  nl.a2.unit89.lesson05.teach.woorden:
    title: دم دروازه
    gloss: در / باز کردن / سنگین / زیاد
    note: '*Opendoen* یک فعل است: *Zal ik de deur opendoen?*'
    example_gloss:
    - کیف سنگین است.
    - من سودای زیاد دارم.
    - در را باز کنم؟
  nl.a2.unit89.lesson05.teach.gn_accept:
    title: قبول کردن یک پیشنهاد
    gloss: بلی لطفاً، تشکر. (دوست) بلی لطفاً، تشکر. (رسمی)
    note: '*Graag* یعنی بلی لطفاً. با دوستان *dank je* و در موقعیت رسمی *dank u* را اضافه کن.'
  nl.a2.unit89.lesson05.teach.gn_decline:
    title: رد کردن مؤدبانهٔ یک پیشنهاد
    gloss: نه، مشکلی نیست، خودم از عهده‌اش می‌آیم.
    note: '*Het lukt wel* یعنی از عهده‌اش می‌آیم. *Hoor* *nee* را دوستانه می‌سازد.'
  nl.a2.unit89.lesson05.teach.gn_verzoek:
    title: جواب دادن به یک خواهش
    gloss: البته. ببخشین، این ممکن نیست.
    note: به یک خواهش با *Natuurlijk* بلی بگو. با *Sorry, dat lukt niet.* نه بگو.
  nl.a2.unit89.lesson05.teach.reading:
    title: نور و همسایه‌هایش
    gloss: 'نور از سوپرمارکت بیرون می‌آید. او خریداری زیاد و یک کیف سنگین دارد. همسایه او را می‌بیند و می‌پرسد: کیف را من حمل کنم؟ نور می‌گوید: بلی لطفاً، تشکر. بعد همسایهٔ خانم می‌پرسد: در را باز کنم؟ نور می‌گوید: نه، مشکلی نیست، خودم از عهده‌اش می‌آیم.'
    note: توجه کنید که نور کدام پیشنهاد را قبول می‌کند و کدام را رد.
    glosses:
      uit: از (بیرون)
      zware: سنگین
      ziet: می‌بیند
      vraagt: می‌پرسد
      zegt: می‌گوید
      dan: بعد
  nl.a2.unit89.lesson06.teach.welkom:
    title: لوته از عمر استقبال می‌کند
    gloss: 'لوته: سلام عمر، یک لحظه داخل بیا.'
  nl.a2.unit89.lesson06.teach.boodschappen:
    title: عمر خریداری زیاد دارد
    gloss: 'عمر: تشکر. من خریداری زیاد دارم.'
  nl.a2.unit89.lesson06.teach.tas:
    title: لوته کمک پیشنهاد می‌کند
    gloss: 'لوته: کیف را من حمل کنم؟'
  nl.a2.unit89.lesson06.teach.koffie:
    title: عمر رد می‌کند و خواهش می‌کند
    gloss: 'عمر: نه، مشکلی نیست، خودم از عهده‌اش می‌آیم. قهوه دم کرده می‌توانی؟'
  nl.a2.unit89.lesson06.teach.brood:
    title: لوته قبول می‌کند و بیشتر پیشنهاد می‌دهد
    gloss: 'لوته: البته. یک لحظه بنشین. نان را هم من ببرم؟'
  nl.a2.unit89.lesson06.teach.graag:
    title: عمر قبول می‌کند
    gloss: 'عمر: بلی لطفاً، تشکر.'
