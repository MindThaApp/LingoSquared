teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل معمول سرگرمی: *lezen* (خواندن)، *sporten* (ورزش کردن) و *koken* (آشپزی کردن).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*De vrije tijd* اسم جنس «de» است: *de vrije tijd*. این عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌ها است.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Lees* شکل اول شخص مفرد فعل *lezen* (خواندن) است.'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه فعل دیگر سرگرمی: *muziek luisteren* (موسیقی گوش دادن)، *tekenen* (نقاشی کردن) و *gamen* (بازی ویدیویی کردن)؛ gamen یک واژهٔ قرضی معمول در هلندی است.'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*Luisteren naar* (گوش دادن به) همیشه پیش از مفعولش *naar* می‌گیرد.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*Met vrienden* (با دوستان) کلمهٔ *vrienden* را از درس اول دوباره به کار می‌برد.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: چهار قید اصلی تکرار. *Vaak* پیش‌تر در درس ۵ در جملهٔ *Zie je hem vaak?* آمده بود؛ سه تای دیگر در اینجا تازه استند.
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Elke week* و *elk weekend* هر دو یعنی «هر»، اما شکل کلمه با جنس اسم تغییر می‌کند؛ کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke یا elk
    gloss: با اسم‌های «de» مثل week از elke استفاده می‌کنین. با اسم‌های «het» مثل weekend از elk استفاده می‌کنین.
    note: '*Week* اسم «de» است (*de week*)، پس *elke* می‌گیرد؛ *weekend* اسم «het» است (*het weekend*)، پس *elk* می‌گیرد؛ همان الگوی de/het که در درس ۲۳ در *de rekening* و *het wisselgeld* دیدید.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: لوته دربارهٔ سرگرمی‌ها صحبت را شروع می‌کند
    gloss: 'لوته: ما اغلب با هم قدم می‌زنیم. اما تو در وقت فارغ خود دیگر چه کار می‌کنی، عمر؟'
    note: '*We wandelen vaak samen* به بخش ۱۳ برمی‌گردد، جایی که هم Lotte و هم Omar گفتند *wandelen* را دوست دارند.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: سرگرمی‌های Omar
    gloss: 'Omar: من آشپزی را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: '*Ook thuis* (در خانه هم) روشن می‌کند که Omar فقط در کار رستورانش آشپزی نمی‌کند، بلکه برای تفریح هم می‌پزد.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte حیران می‌شود
    gloss: 'Lotte: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: '*Al de hele dag* (تمام روز) تأکید می‌کند که Omar همین حالا هم در کارش چقدر آشپزی می‌کند.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar توضیح می‌دهد
    gloss: 'Omar: بلی، ولی آشپزی برایم آرامش‌بخش است. و تو، تو چه کار را دوست داری؟'
    note: '*Koken vind ik ontspannend* کلمهٔ *koken* را برای تأکید به اول جمله می‌آورد؛ تحت‌اللفظی: «آشپزی، آن را آرامش‌بخش می‌دانم».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: سرگرمی‌های Lotte
    gloss: 'Lotte: من کتاب خواندن را دوست دارم و اکثراً به موسیقی گوش می‌کنم.'
    note: دو فعل سرگرمی از درس ۱ و ۲ با *en* (و) در یک جمله جمع شده است.
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar دربارهٔ بازی ویدیویی می‌پرسد
    gloss: 'Omar: تو هم بازی ویدیویی می‌کنی؟'
    note: یک پرسش کوتاه بلی/نخیر با *gamen* از درس ۲.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte جواب می‌دهد
    gloss: 'Lotte: نخیر، من هرگز بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کنم!'
    note: '*Nooit* (هرگز) و *soms* (گاهی) از درس ۳، در یک جواب در مقابل هم.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و Omar اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. Omar آشپزی را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً به موسیقی گوش می‌کنم. گاهی نقاشی می‌کنم، ولی هرگز بازی ویدیویی نمی‌کنم. تو در وقت فراغتت چه کار را دوست داری؟
    note: پیام Lotte حقیقت‌های درس ۴ را خلاصه می‌کند و با پرسش اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      wandelen: قدم می‌زنیم
      vaak: اکثراً
      samen: با هم
      andere: دیگر
      kookt: آشپزی می‌کند
      graag: دوست دارد
      thuis: در خانه
      sport: ورزش می‌کند
      lees: خواندن
      luister: گوش می‌کنم
      muziek: موسیقی
      teken: نقاشی می‌کنم
      soms: گاهی
      game: ویدیوگیم بازی می‌کنی
      nooit: هرگز
      vrije: آزاد
      tijd: وقت
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar دربارهٔ آخر هفته می‌پرسد
    gloss: 'Omar: این آخر هفته چه کار می‌کنی؟'
    note: '*Dit weekend* (این آخر هفته) همان عبارت زمانی بخش ۱۹ است.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte مطمئن نیست
    gloss: 'Lotte: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*Naar buiten* (بیرون، تحت‌اللفظی «به بیرون») راه رایج گفتن این است که می‌خواهین از خانه بیرون بروید.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar یک برنامه پیشنهاد می‌کند
    gloss: 'Omar: بیا با هم قدم بزنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: '*Daarna* (بعدش) همان کلمهٔ ترتیب *eerst, dan, daarna* بخش ۱۰ است.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte موافقت می‌کند
    gloss: 'Lotte: فکر خوب! قدم زدن و آشپزی هر دو را دوست دارم.'
    note: '*Allebei* (هر دو) نشان می‌دهد که Lotte هر دو را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar تأیید می‌کند
    gloss: 'Omar: عالی. پس شنبه می‌بینمت!'
    note: یک جملهٔ دوستانهٔ پایانی که برنامهٔ *zaterdag* (شنبه) را تأیید می‌کند.
