      status: correct
    feedback: فعل *opent* به آخر می‌رود.
    prompt_blocks:
    - آیا می‌دانین موزیم چه وقت باز می‌شود؟ (محترمانه)
  nl.a2.unit96.lesson02.exercise02.luister_trein:
