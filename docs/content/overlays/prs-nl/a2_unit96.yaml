    instruction: کلمه‌ها را مرتب کنید تا از یک دوست بپرسین قطار ساعت چند حرکت می‌کند.
    correct_option: Weet je hoe laat de trein vertrekt
    accepted_answers:
    - value: Weet je hoe laat de trein vertrekt
      status: correct
