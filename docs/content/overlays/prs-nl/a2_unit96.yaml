    - Weet u waar het is station?
    accepted_answers:
    - value: Weet u waar het station is?
      status: correct
    feedback: در سوال غیرمستقیم، فعل *is* به آخر جمله می‌رود.
    prompt_blocks:
    - آیا می‌دانین ایستگاه کجاست؟ (محترمانه)
