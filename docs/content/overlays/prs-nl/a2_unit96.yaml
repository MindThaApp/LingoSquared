  nl.a2.unit96.lesson01.exercise04.volgorde_station:
    instruction: کلمه‌ها را طوری مرتب کنید که با احترام بپرسین ایستگاه کجاست.
    correct_option: Weet u waar het station is
    accepted_answers:
    - value: Weet u waar het station is
      status: correct
    feedback: در *Weet u waar het station is?* فعل *is* در آخر آمده است.
  nl.a2.unit96.lesson01.exercise05.vul_is:
