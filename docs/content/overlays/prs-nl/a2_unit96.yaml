course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر دستور زبان، برای پرسیدن مودبانهٔ معلومات.
  learning_goal: پرسیدن سوال‌های غیرمستقیمِ مودبانه با waar، wanneer، hoe laat، wie، wat و of، که در آن فعل در آخر جملهٔ پیرو می‌آید.
units:
  nl.a2.unit96.weet_u_waar:
    title: می‌دانین ... کجاست؟
    description: با سوال‌های غیرمستقیم، در ایستگاه، دفتر و موزیم مودبانه معلومات بپرسین.
lessons:
  nl.a2.unit96.lesson01.weet_u_waar:
    title: می‌دانین ایستگاه کجاست؟
  nl.a2.unit96.lesson02.wanneer_en_hoe_laat:
    title: چه وقت و ساعت چند
  nl.a2.unit96.lesson03.weet_u_of:
    title: می‌دانین باز است یا نه؟
  nl.a2.unit96.lesson04.kunt_u_mij_zeggen:
    title: گفته می‌توانین ...؟
  nl.a2.unit96.lesson05.omars_bericht:
    title: پیام عمر
  nl.a2.unit96.lesson06.lotte_en_omar:
    title: لوته و عمر در موزیم
teaching:
  nl.a2.unit96.lesson01.teach.plaatsen:
    title: جاها
    gloss: ایستگاه / دفتر / موزیم / کتابخانه / کانتر / خروجی
    note: این‌ها جاهایی اند که اغلب دربارهٔ شان می‌پرسید.
    example_gloss:
    - ایستگاه کجاست؟
    - خروجی کجاست؟
  nl.a2.unit96.lesson01.teach.weten:
    title: دانستن و کجا
    gloss: دانستن / کجا / شما (رسمی) / تو (غیررسمی) / تو (غیررسمی، با تأکید)
    note: '*Weet* شکل فعل بعد از u، je و jij است.'
    example_gloss:
    - می‌دانین؟ (رسمی)
    - می‌دانی؟ (غیررسمی)
    - می‌دانی؟ (غیررسمی)
  nl.a2.unit96.lesson01.teach.open:
    title: باز و بسته
    gloss: باز / بسته
    example_gloss:
    - موزیم باز است.
    - دفتر بسته است.
  nl.a2.unit96.lesson01.teach.gn_indirect:
    title: از سوال مستقیم تا غیرمستقیم
    gloss: یک سوال مستقیم و همان سوال که غیرمستقیم پرسیده می‌شود.
    note: 'در سوال مستقیم، فعل در جای دوم می‌آید: *Waar IS het station?* بعد از *Weet u ...* سوال به جملهٔ پیرو تبدیل می‌شود، پس فعل به آخر همان جمله می‌رود: *Weet u waar het station IS?*'
  nl.a2.unit96.lesson01.teach.gn_u_je:
    title: u یا je
    gloss: راه‌های رسمی و غیررسمی برای پرسیدن یک چیز.
    note: با اشخاص ناآشنا و در دفترها *u* را به کار ببرید و با دوستان *je* یا *jij* را. شکل فعل، یعنی *weet*، تغییر نمی‌کند. لوته و عمر *je* را به کار می‌برند.
  nl.a2.unit96.lesson01.teach.zinnen:
    title: دو سوال
    gloss: می‌دانین موزیم کجاست؟ می‌دانی کتابخانه کجاست؟
  nl.a2.unit96.lesson02.teach.vraagwoorden:
    title: کلمه‌های پرسشی
    gloss: چه وقت / ساعت چند / چه کسی / چی
    note: این کلمه‌های پرسشی در سوال غیرمستقیم مثل *waar* کار می‌کنند.
    example_gloss:
    - موزیم چه وقت باز است؟
    - ساعت چند است؟
    - او کیست؟ او لوته است.
    - این چیست؟ این یک موزیم است.
  nl.a2.unit96.lesson02.teach.werkwoorden:
    title: فعل‌های مفید
    gloss: باز شدن / بسته شدن / حرکت کردن / قیمت داشتن
    example_gloss:
    - موزیم ساعت ده باز می‌شود.
    - دفتر ساعت پنج بسته می‌شود.
    - قطار ساعت نُه حرکت می‌کند.
    - تکت ده یورو قیمت دارد.
  nl.a2.unit96.lesson02.teach.tijd:
    title: قطار و وقت
    gloss: قطار / تکت / ساعت / فردا / امروز / ده / پنج / نُه
    example_gloss:
    - تکت چند قیمت دارد؟ ده یورو.
    - قطار چه وقت حرکت می‌کند؟ فردا.
    - او نور است.
    - دفتر نزدیک ایستگاه است.
  nl.a2.unit96.lesson02.teach.gn_wanneer:
    title: Wanneer و hoe laat
    gloss: سوال‌های غیرمستقیم با wanneer و hoe laat.
    note: 'کلمهٔ پرسشی در اول می‌ماند و فعل در آخر می‌آید: *wanneer het museum opent*، *hoe laat de trein vertrekt*. برای روز یا یک زمان *wanneer* را به کار ببرید و برای وقتِ ساعت *hoe laat* را.'
  nl.a2.unit96.lesson02.teach.gn_wie_wat:
    title: Wie و wat
    gloss: سوال‌های غیرمستقیم با wie و wat.
    note: '*Wie* و *wat* هم از همین الگو پیروی می‌کنند. فعل در آخر است: *wie dat is*، *wat het kaartje kost*.'
  nl.a2.unit96.lesson02.teach.zinnen:
    title: دو سوال
    gloss: می‌دانی دفتر ساعت چند بسته می‌شود؟ می‌دانین موزیم چه وقت باز می‌شود؟
  nl.a2.unit96.lesson03.teach.of:
    title: Of, ja, nee
    gloss: آیا (که ... یا نه) / بلی / نه / نی
    example_gloss:
    - موزیم باز است؟ بلی.
    - دفتر باز است؟ نه.
  nl.a2.unit96.lesson03.teach.gn_of:
    title: 'سوال بلی/نه: of'
    gloss: سوال بلی/نه که با of غیرمستقیم پرسیده می‌شود.
    note: 'سوال بلی/نه کلمهٔ پرسشی ندارد، بنابراین سوال غیرمستقیم با *of* (آیا) شروع می‌شود. فعل به آخر می‌رود: *of de bibliotheek open IS*.'
  nl.a2.unit96.lesson03.teach.gn_contrast:
    title: Waar یا of؟
    gloss: سوال با کلمهٔ پرسشی و سوال بلی/نه را با هم مقایسه کنید.
    note: وقتی کلمهٔ پرسشی (*waar, wanneer, hoe laat, wie, wat*) وجود دارد، همان را نگه دارید. اگر جواب سوال *ja* یا *nee* باشد، *of* را به کار ببرید. هرگز هر دو را با هم نیاورید.
  nl.a2.unit96.lesson03.teach.gn_weet_niet:
    title: Ik weet niet ...
    gloss: گفتن اینکه نمی‌دانید.
    note: 'بعد از *Ik weet niet* همان جملهٔ پیرو می‌آید و فعل در آخر است. برای جواب کوتاه بگویین: *Ik weet het niet.*'
  nl.a2.unit96.lesson03.teach.zinnen:
    title: دو جواب
    gloss: نمی‌دانم. نمی‌دانم دفتر باز است یا نه.
  nl.a2.unit96.lesson04.teach.richting:
    title: راهنمایی راه
    gloss: مستقیم / چپ / راست / چطور / آمدن / نزدیک، به
    note: '*Hoe kom ik bij ...?* برای پرسیدن راه است.'
    example_gloss:
    - ایستگاه مستقیم است.
    - خروجی طرف چپ است.
    - دفتر طرف راست است.
    - چطور به ایستگاه برسم؟
  nl.a2.unit96.lesson04.teach.beleefd:
    title: کلمه‌های مودبانه
    gloss: ببخشین / می‌توانین (رسمی) / می‌توانی (غیررسمی) / به من / به من (بدون تأکید) / گفتن / خواستن / با خوشی (دوست دارم) / دانستن
    note: '*Mij* و *me* هر دو یعنی «به من». *Kunt u* با u می‌آید و *kun je* با je.'
    example_gloss:
    - ببخشین، کانتر کجاست؟
    - دوست دارم بدانم کانتر کجاست.
  nl.a2.unit96.lesson04.teach.uitje:
    title: یک گشت‌وگذار
    gloss: ما / رفتن / به
    example_gloss:
    - فردا ما به موزیم می‌رویم.
    - می‌دانی ما چه وقت به موزیم می‌رویم؟
  nl.a2.unit96.lesson04.teach.gn_kunt_u:
    title: Kunt u mij zeggen ...?
    gloss: یک راه مودبانه برای پرسیدن معلومات.
    note: 'در این سوال فعل اول می‌آید: *Kunt u* / *Kun je*. بعد *mij zeggen* و سوال غیرمستقیم با فعلِ آخر می‌آید. با je شکل معمول *kun je* است.'
  nl.a2.unit96.lesson04.teach.gn_wil_weten:
    title: Ik wil graag weten ...
    gloss: یک جملهٔ مودبانه به جای سوال.
    note: '*Ik wil graag weten* یک جملهٔ مودبانه برای خواستن معلومات است. سوال غیرمستقیم بعد از آن می‌آید و فعل در آخر است.'
  nl.a2.unit96.lesson04.teach.gn_hoe_kom:
    title: Hoe ik ... kom
    gloss: پرسیدن راه به شکل غیرمستقیم.
    note: '*Hoe kom ik bij het station?* می‌شود *hoe ik bij het station kom*: فعل *kom* بعد از *bij het station* به آخر می‌رود.'
  nl.a2.unit96.lesson04.teach.zinnen:
    title: در ایستگاه
    gloss: ببخشین، گفته می‌توانین کانتر کجاست؟ دوست دارم بدانم قطار ساعت چند حرکت می‌کند.
  nl.a2.unit96.lesson05.teach.reading:
    title: پیام عمر برای لوته
    gloss: سلام لوته، فردا ما به موزیم می‌رویم. نمی‌دانم موزیم کجاست. می‌دانی چطور به ایستگاه برسم؟ دوست دارم بدانم قطار ساعت چند حرکت می‌کند. آیا می‌دانی موزیم باز است یا نه؟ با احترام، عمر
    note: دقت کنید که عمر برای سوال‌هایش سه شروع مختلف را به کار می‌برد.
    glosses:
      Hoi: سلام
      Groeten: با سلام
      ook: همچنان / هم
  nl.a2.unit96.lesson06.teach.omar_vraagt_waar:
    title: عمر صحبت می‌کند
    gloss: سلام لوته، می‌دانی موزیم کجاست؟
  nl.a2.unit96.lesson06.teach.lotte_wijst:
    title: لوته صحبت می‌کند
    gloss: بلی، مستقیم برو و بعد به چپ.
  nl.a2.unit96.lesson06.teach.omar_vraagt_tijd:
    title: عمر صحبت می‌کند
    gloss: ساعت چند باز می‌شود، آن را هم می‌دانی؟
  nl.a2.unit96.lesson06.teach.lotte_tijd:
    title: لوته صحبت می‌کند
    gloss: ساعت ده باز می‌شود.
  nl.a2.unit96.lesson06.teach.omar_vraagt_open:
    title: عمر صحبت می‌کند
    gloss: تو خبر داری که موزیم امروز باز است یا نه؟
  nl.a2.unit96.lesson06.teach.lotte_weet_niet:
    title: لوته صحبت می‌کند
    gloss: نمی‌دانم که امروز باز است یا نه.
