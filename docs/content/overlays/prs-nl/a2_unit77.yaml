teaching:
  nl.a2.unit77.lesson01.teach.koptelefoon:
    title: هدفون
    gloss: هدفون
    note: '*De koptelefoon* در هلندی یک اسم «de» و مفرد است، با آنکه در دری «هدفون» را اغلب برای دو گوشی می‌گوییم؛ پس در جمله از فعل مفرد استفاده کنید.'
    example_gloss: من یک هدفون نو خریدم.
  nl.a2.unit77.lesson01.teach.koptelefoon_kapot:
    title: گفتن اینکه هدفون خراب است
    gloss: این هدفون خراب است.
    note: '*Kapot* (خراب) برای هر چیزی گفته می‌شود که دیگر کار نمی‌کند، از وسایل برقی گرفته تا مبل و چوکی.'
  nl.a2.unit77.lesson01.teach.linkerkant_doet_het_niet:
    title: گفتن اینکه کدام طرف کار نمی‌کند
    gloss: طرف چپ کار نمی‌کند.
    note: '*Doet het niet* (به معنی لفظی «آن را نمی‌کند») عبارت عادی برای کار نکردن یک دستگاه یا بخشی از آن است.'
  nl.a2.unit77.lesson02.teach.geld_terug:
    title: پس‌دادن پول
    gloss: پس‌دادن پول / ریفند
    note: '*Het geld terug* یک عبارت ثابت است و برای پس گرفتن پول استفاده می‌شود.'
    example_gloss: می‌خواهم پولم را پس بگیرم.
  nl.a2.unit77.lesson02.teach.graag_geld_terug:
    title: خواستن پس‌دادن پول
    gloss: می‌خواهم پولم را پس بگیرم.
    note: '*Graag* (با خوشی / لطفاً) درخواست را نرم‌تر می‌سازد و در هلندی یک شیوهٔ معمولِ مؤدبانه است.'
  nl.a2.unit77.lesson02.teach.ruilen_of_geld:
    title: پرسیدن دربارهٔ تبدیل کردن یا پس گرفتن پول
    gloss: آیا می‌توانم آن را تبدیل کنم یا پولم را پس بگیرم؟
    note: '*Ruilen* (تبدیل کردن) و *het geld terugkrijgen* (پول را پس گرفتن) دو راه حل معمول برای یک شکایت اند.'
  nl.a2.unit77.lesson03.teach.bonnetje:
    title: رسید
    gloss: رسید
    note: '*Het bonnetje* (شکل کوچک‌سازی *de bon*) کلمهٔ روزمره برای رسید دکان است.'
    example_gloss: رسید را هنوز دارم، این است.
  nl.a2.unit77.lesson03.teach.heeft_u_bonnetje:
    title: پرسیدن اینکه مشتری رسید را دارد یا نه
    gloss: رسید را هنوز دارید؟
    note: '*Nog* (هنوز) تأیید می‌کند که جنس هنوز نزد مشتری است.'
  nl.a2.unit77.lesson03.teach.acht_dagen_geleden:
    title: گفتن اینکه چه وقت چیزی را خریده‌اید
    gloss: من آن را هشت روز پیش خریدم.
    note: '*Geleden* (پیش) بعد از یک مدت زمان می‌آید و راه معمول گفتن این است که چیزی چند وقت پیش اتفاق افتاده است.'
  nl.a2.unit77.lesson04.teach.retourbeleid:
    title: قانون پس‌دهی جنس
    gloss: قانون پس‌دهی جنس
    note: '*Het retourbeleid* یک کلمهٔ مرکب معمول است از *retour* (برگشت) و *beleid* (پالیسی).'
    example_gloss: قانون پس‌دهی جنس این دکان چیست؟
  nl.a2.unit77.lesson04.teach.dertig_dagen:
    title: گفتن مدت پس‌دهی
    gloss: شما می‌توانین جنس را تا سی روز پس بیاورید.
    note: '*Binnen* (در مدت / تا) با یک مدت زمان، ساختار معمول برای گفتن مهلت است.'
  nl.a2.unit77.lesson04.teach.dat_regel_ik:
    title: پیشنهاد کردن رسیدگی به یک کار
    gloss: من آن را برایتان درست می‌کنم.
    note: '*Dat regel ik* (من آن را درست می‌کنم) عبارت معمول و اطمینان‌بخش کارمندانی است که به مشتری کمک می‌کنند.'
  nl.a2.unit77.lesson05.teach.beleid:
    title: خواندن اعلان قانون پس‌دهی
    gloss: 'قانون پس‌دهی: شما می‌توانین یک جنس را تا سی روز بعد از خرید پس بیاورید. رسید را با خود بیاورید. برای جنس معیوب، پولتان را پس می‌گیرین یا می‌توانین آن را با یک جنس نو تبدیل کنید.'
    note: '*Bij een defect artikel* (برای جنس معیوب) حالت خاصی را معرفی می‌کند که این بخش از قانون شامل آن می‌شود.'
    glosses:
      Retourbeleid: قانون پس‌دهی جنس
      kunt: می‌توانین (شکل دوم شخص فعل kunnen)
      artikel: جنس / قلم
      binnen: در مدت / تا
      dertig: سی
      dagen: روزها
      na: بعد از
      aankoop: خرید
      terugbrengen: پس آوردن
      Neem: بگیرین (امر فعل nemen)
      bonnetje: رسید
      mee: همراه / با خود (بخشی از neem ... mee = همراه بیاور)
      Bij: در صورت / برای
      defect: معیوب / خراب
      krijgt: می‌گیرین (از krijgen، دریافت کردن)
      uw: مال شما (رسمی)
      geld: پول
      terug: دوباره
      of: یا
      ruilen: تبدیل کردن
      voor: به جای / در بدل
      nieuw: نو
      exemplaar: عدد / نمونه (از یک جنس)
  nl.a2.unit77.lesson06.teach.verkoper_open:
    title: کارمند گفتگو را شروع می‌کند
    gloss: 'کارمند: نمازدیگر بخیر، چطور می‌توانم کمکتان کنم؟'
  nl.a2.unit77.lesson06.teach.omar_kapot:
    title: عمر مشکل را می‌گوید
    gloss: 'عمر: نمازدیگر بخیر، این هدفون خراب است. طرف چپ آن کار نمی‌کند.'
  nl.a2.unit77.lesson06.teach.verkoper_bonnetje:
    title: کارمند رسید را می‌پرسد
    gloss: 'کارمند: ای وای، چه بد. رسید را هنوز دارید؟'
  nl.a2.unit77.lesson06.teach.omar_acht_dagen:
    title: عمر تأیید می‌کند و تاریخ خرید را می‌گوید
    gloss: 'عمر: بلی، این است. من آن را هشت روز پیش خریدم.'
  nl.a2.unit77.lesson06.teach.verkoper_binnen_dertig:
    title: کارمند تأیید می‌کند که در مدت مجاز است
    gloss: 'کارمند: مشکلی نیست، در مدت سی روز است. می‌خواهین تبدیل کنید یا پولتان را پس بگیرین؟'
  nl.a2.unit77.lesson06.teach.omar_geld_terug:
    title: عمر پس گرفتن پول را انتخاب می‌کند
    gloss: 'عمر: پولم را پس می‌خواهم.'
  nl.a2.unit77.lesson06.teach.verkoper_regel_het:
    title: کارمند تأیید می‌کند که کار درست می‌شود
    gloss: 'کارمند: خوب است، من آن را برایتان درست می‌کنم.'
  nl.a2.unit77.lesson06.teach.grammar_gekocht:
    title: 'شخص سوم: hij/zij با heeft'
    gloss: او (مرد) هدفون را خرید. او (زن) پولش را پس گرفت.
    note: '*Heeft* شکل سوم شخص مفرد فعل *hebben* (داشتن) است و با صفت مفعولی برای زمان ماضی نقلی به کار می‌رود؛ *hij* (او، مرد) و *zij* (او، زن) به‌همراه *haar* (مال او، زن) ضمیرهای مناسب برای خلاصه کردن آنچه اتفاق افتاده است.'
