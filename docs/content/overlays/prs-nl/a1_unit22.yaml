teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*Bel* شکل ik فعل *bellen* است؛ هلندی اینجا زمان حال را به کار می‌برد، و در دری هم معمولاً می‌گوییم «زنگ می‌زنم».'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: جواب دادن به تلفون
    gloss: سلام، من لوته استم.
    note: در تلفون، هالندی‌ها خود را با *met* + نام معرفی می‌کنند (در اصل «با + نام»). این شیوهٔ معمول معرفی در تلفون به هالندی است.
  nl.a1.unit22.lesson01.teach.met_omar:
    title: عمر هم همین‌طور جواب می‌دهد
    gloss: سلام، من عمر استم.
    note: همان الگوی *met* + نام مثل *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Met wie spreek ik?* جملهٔ رسمی و معمول برای تماس‌گیرندهٔ ناشناس است.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: معرفی رسمی خود
    gloss: شما با لوته صحبت می‌کنین.
    note: '*U spreekt met* + نام شکل رسمیِ *met* + نام در گفتار غیررسمی است.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*Kun je* ...? (آیا می‌توانی ...؟) + *herhalen* (تکرار کردن) + *dat* (آن).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*Niet zo* + صفت، درجهٔ صفت را نفی می‌کند، نه خود فعل را: یعنی «به این تندی نه»، نه «صحبت نکن».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: '*Horen* (شنیدن) با *niet goed* (خوب نه) مشکل شنیدن را می‌رساند و با *verstaan* (فهمیدن حرف) فرق دارد.'
  nl.a1.unit22.lesson04.teach.sms:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: 'اسم از جنس مشترک: *de sms*؛ این کلمه از کوتاه‌نوشت بین‌المللی گرفته شده است.'
    example_gloss: پیامک از لوته است.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: '*Sturen* (فرستادن) اول مفعول غیرمستقیم (*je*) و بعد مفعول مستقیم (*een sms*) را می‌گیرد.'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: '*Terug* (دوباره، به عقب) در آخر جمله می‌آید و از *bellen* جدا می‌شود؛ bellen + *terug* یعنی دوباره تماس گرفتن.'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'عمر: سلام لوته، می‌توانی به من زنگ بزنی؟ باید چیزی را به تو بگویم. لوته: بلی، حتماً، پنج دقیقه بعد دوباره به تو زنگ می‌زنم.'
    note: توجه کن که عمر چه می‌خواهد، برای چه، و لوته چه وقت دوباره زنگ می‌زند.
    glosses:
      Hoi: سلام
      kun: می‌توانی
      bellen: زنگ زدن
      moet: باید
      iets: یک چیز
      vertellen: گفتن
      natuurlijk: حتماً
      bel: زنگ زدن
      vijf: پنج
      minuten: دقیقه
      terug: دوباره
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: عمر به تلفون جواب می‌دهد
    gloss: 'عمر: سلام، من عمر استم.'
    note: 'همان الگوی *met* + نام از درس اول، حالا در یک تماس واقعی: کسی که جواب می‌دهد اول صحبت می‌کند و نامش را می‌گوید.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: لوته خودش را معرفی می‌کند
    gloss: 'لوته: سلام عمر، من لوته استم. عمر: چه خوب که زنگ زدی!'
    note: '*Fijn dat* ... (چه خوب که ...) واکنش مثبت به یک رویداد را می‌رساند.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: لوته از نوبت کاری می‌پرسد
    gloss: 'لوته: اولین نوبت کاری‌ات چطور بود؟'
    note: '*Was* گذشتهٔ ساده‌ی *zijn* است؛ این با زمان ماضی (hebben/zijn + اسم مفعول، مثل *Ik heb gewerkt*) در واحد ۱۲ فرق دارد. یادداشت بعد از سطر بعدی را ببین.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: عمر خبر خوب می‌دهد
    gloss: 'عمر: خیلی خوب پیش رفت، بهتر از آنچه فکر می‌کردم.'
    note: '*Ging* گذشتهٔ ساده‌ی *gaan* است (رفتن؛ این‌جا به معنای «پیش رفتن، از آب برآمدن»)؛ *dacht* گذشتهٔ ساده‌ی *denken* است (فکر کردن).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was، ging و dacht شکل‌های گذشتهٔ ساده استند
    gloss: was ← بودن، ging ← رفتن، dacht ← فکر کردن
    note: '*Was*، *ging* و *dacht* شکل‌های بی‌قاعدهٔ گذشتهٔ ساده (verleden tijd) استند؛ این الگو با زمان ماضی واحد ۱۲ (hebben/zijn + اسم مفعول) فرق دارد و هنوز رسماً آموزش داده نشده است. فعلاً was/ging/dacht را مثل عبارت‌های ثابت در همین درس یاد بگیر؛ قاعدهٔ کامل صرف گذشتهٔ ساده در سطح بعدی می‌آید.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: لوته افتخار می‌کند
    gloss: 'لوته: چه خوب که شنیدم! به تو افتخار می‌کنم.'
    note: '*Trots op* (افتخار کردن به) یک ترکیب ثابت است؛ باید *op* بیاید، نه *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: عمر تحت تأثیر قرار می‌گیرد
    gloss: 'عمر: تشکر، این برایم خیلی معنا دارد.'
    note: '*Betekent* شکل سوم شخص مفرد *betekenen* است (معنا داشتن)؛ *voor me* (برای من) می‌رساند که این برای چه کسی مهم است.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Zijn* در این‌جا ضمیر ملکی «او (مرد)» است، نه فعل «بودن»؛ معنای این دو کلمهٔ هم‌شکل از متن معلوم می‌شود.'
