  nl.a2.unit75.lesson01.teach.hoe_vaak:
    title: پرسیدن اینکه کسی چقدر از رسانه‌های اجتماعی استفاده می‌کند
    gloss: تو چقدر از رسانه‌های اجتماعی استفاده می‌کنی؟
    note: '*Sociale media* اصطلاحی جمع است که از زبان دیگر گرفته شده و در هلندی با همین شکل به کار می‌رود.'
  nl.a2.unit75.lesson02.teach.app:
    title: اپ
    gloss: اپلیکیشن
    note: '*De app* اسم عام (de) است؛ کلمه‌ای قرضی که در هلندی روزمره بدون تغییر به کار می‌رود.'
