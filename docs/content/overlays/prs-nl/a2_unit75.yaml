  nl.a2.unit75.lesson06.teach.omar_niet_te_veel:
    title: عمر درباره‌ی اندازه سوال می‌کند
    gloss: 'عمر: این خیلی زیاد است. فکر نمی‌کنی که زیاد است؟'
  nl.a2.unit75.lesson06.teach.lotte_te_veel:
    title: لوته قبول می‌کند که زیاد است
    gloss: 'لوته: بلی، در اصل فکر می‌کنم زیاد است. می‌خواهم وقت کمتر را روی موبایلم بگذرانم.'
