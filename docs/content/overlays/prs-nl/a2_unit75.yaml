  nl.a2.unit75.lesson05.teach.blog:
    title: خواندن یک نوشته‌ی بلاگ درباره‌ی وقت پای صفحه‌ی نمایش
    gloss: بسیاری از مردم روزانه بیشتر از چهار ساعت از موبایل شان استفاده می‌کنند. شبکه‌های اجتماعی مزه دارند، اما زیاد وقت گذراندن پای صفحه‌ی نمایش برای صحت خوب نیست. سعی کنید هر شام یک ساعت بدون موبایل بگذرانید. این برای چشم‌ها و خواب تان خوب است.
    note: '*Probeer ... door te brengen* (سعی کنید ... بگذرانید) از *proberen* + *te* + مصدر ساخته می‌شود؛ ساختار رایج برای پیشنهاد دادن.'
