    title: 'شخص سوم: vindt/heeft/zij/haar'
    gloss: لوته فکر می‌کند که وقت زیاد پای صفحه‌ی نمایش دارد. او می‌خواهد وقت کمتر را روی موبایلش بگذراند.
    note: '*Vindt* و *heeft* شکل‌های شخص سوم مفرد *vinden* (فکر کردن/دانستن) و *hebben* (داشتن) اند؛ *zij* (او، مؤنث) و *haar* (مال او) ضمیرهای مؤنث شخص سوم اند که اینجا برای خلاصه کردن سخن خود لوته به شکل شخص سوم به کار رفته‌اند.'
