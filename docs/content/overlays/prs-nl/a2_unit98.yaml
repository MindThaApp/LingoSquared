course:
  title: هالندی A2
  description: دستور زبان هالندی سطح A2 برای معرفی اشخاص و چیزها با جمله‌های موصولی.
  learning_goal: یک شخص یا یک چیز را با die یا dat و جملهٔ موصولی که فعلش در آخر می‌آید معرفی کنید.
units:
  nl.a2.unit98.degene_die_en_dat:
    title: مردی که، کتابی که
    description: اشخاص در محل کار و چیزهای گم‌شده یا خریداری‌شده را با جمله‌های موصولی die و dat معرفی کنید.
lessons:
  nl.a2.unit98.lesson01.mensen_en_spullen:
    title: اشخاص و چیزها
  nl.a2.unit98.lesson02.die_of_dat:
    title: die یا dat؟
  nl.a2.unit98.lesson03.wie_doet_wat:
    title: کی چه کار می‌کند؟
  nl.a2.unit98.lesson04.in_de_winkel:
    title: جست‌وجو در دکان
  nl.a2.unit98.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit98.lesson06.lotte_en_omar:
    title: Lotte و Omar در دکان
teaching:
  nl.a2.unit98.lesson01.teach.mensen:
    title: اشخاص در محل کار
    gloss: مرد / زن / همکار / مشتری / رئیس / آشپز
    note: همهٔ این‌ها کلمه‌های de استند.
    example_gloss:
    - مشتری یک مرد است.
    - همکار یک زن است.
    - آشپز و رئیس اینجا کار می‌کنند.
  nl.a2.unit98.lesson01.teach.winkel_werk:
    title: فعل‌های دکان و کار
    gloss: دکان / کار کردن / کمک کردن / جست‌وجو کردن / خریدن
    note: '*Kocht* شکل گذشتهٔ ساده‌ی *kopen* است.'
    example_gloss:
    - من در دکان کار می‌کنم.
    - همکار به مشتری کمک می‌کند.
    - من دنبال یک کیف می‌گردم.
    - من یک کتاب خریدم.
  nl.a2.unit98.lesson01.teach.spullen:
    title: چیزها در دکان، چیزهایی که گم می‌شوند
    gloss: کلید / کیف / بټوه / موبایل / کوتی / عینک / ساعت / کتاب / بوت / سویتر / تحفه
    note: 'توجه کنید کدام کلمه‌ها *de* می‌گیرند و کدام *het*: *het horloge, het boek, het cadeau*. *De schoenen* جمع است.'
    example_gloss:
    - کلید در کیف است.
    - ساعت نو است.
    - تحفه یک کتاب است.
  nl.a2.unit98.lesson01.teach.kwijt:
    title: گم‌شده و پیدا‌شده
    gloss: گم / گم کردن / پیدا کردن
    note: '*Verloor* و *vond* شکل گذشتهٔ ساده‌ی *verliezen* و *vinden* استند.'
    example_gloss:
    - کلیدم را گم کرده‌ام.
    - عینکم را گم کردم.
    - مشتری موبایلم را پیدا کرد.
  nl.a2.unit98.lesson01.teach.zinnen:
    title: جمله‌های کوتاه
    gloss: کیفم را گم کرده‌ام. همکار به من کمک می‌کند. مشتری موبایلم را پیدا کرد.
  nl.a2.unit98.lesson01.teach.dit_is:
    title: این است، آن است
    gloss: این کتاب است. آن مرد است.
  nl.a2.unit98.lesson01.teach.gn_patroon:
    title: die و dat به یک اسم پیش از خود برمی‌گردند
    gloss: مردی که در دکان کار می‌کند / کتابی که خریدم
    note: '*Die* و *dat* یک جملهٔ کوتاه اضافی را به اسمِ پیش از خود وصل می‌کنند. فعل معمولاً در آخر همان جمله می‌آید: *die in de winkel werkt*، *dat ik kocht*.'
  nl.a2.unit98.lesson02.teach.meer_spullen:
    title: چیزهای بیشتر و چند جمع
    gloss: بایسکل / چتری / تکت؛ کلیدها / کیف‌ها / کتاب‌ها / ساعت‌ها / سویترها
    note: 'همهٔ جمع‌ها *de* می‌گیرند، حتی جمع کلمه‌ای که het دارد: *het boek* می‌شود *de boeken*.'
    example_gloss:
    - چتری آبی است.
    - تکت کوچک است.
  nl.a2.unit98.lesson02.teach.adjectieven:
    title: صفت‌ها
    gloss: نو / زیبا / کهنه / آبی / سیاه
    note: 'بعد از *de* یا *het* صفت یک *-e* می‌گیرد: *de nieuwe tas*، *het mooie boek*.'
    example_gloss:
    - کیف نو سیاه است.
    - کتاب زیبا کهنه است.
  nl.a2.unit98.lesson02.teach.gn_de_het:
    title: die برای کلمه‌های de و جمع‌ها، dat برای کلمه‌های het
    gloss: کیفی که / بوت‌هایی که / ساعتی که / تحفه‌ای که
    note: 'بعد از کلمهٔ de و بعد از هر جمع *die* بیاورید. *Dat* را فقط بعد از کلمهٔ het در مفرد بیاورید: *het horloge dat*، اما *de horloges die*.'
  nl.a2.unit98.lesson02.teach.zinnen2:
    title: دو جمله
    gloss: من دنبال کلیدهایی می‌گردم که گم کردم. تکتی که پیدا کردم کهنه است.
    note: جملهٔ موصولی می‌تواند مستقیم بعد از نهاد هم بیاید. کل گروه نهاد است، پس فعل اصلی بعد از آن می‌آید. گذاشتن کاما بعد از جملهٔ موصولی معمول است، اما اختیاری.
  nl.a2.unit98.lesson03.teach.werkwoorden:
    title: فعل‌های بیشتر
    gloss: زنگ زدن / دیدن / شناختن
    note: '*Belde* و *zag* شکل گذشتهٔ ساده‌ی *bellen* و *zien* استند.'
    example_gloss:
    - من به رئیس زنگ می‌زنم.
    - من همکار را می‌بینم.
    - من مشتری را می‌شناسم.
  nl.a2.unit98.lesson03.teach.gn_onderwerp_voorwerp:
    title: کی کار را انجام می‌دهد؟
    gloss: زنی که مرا می‌بیند / زنی که من او را می‌بینم
    note: در *de vrouw die mij ziet* زن کسی است که می‌بیند. در *de vrouw die ik zie* من کسی هستم که می‌بینم. بعد از *die* یا *dat* یا فوراً یک فعل می‌آید (*die werkt*) یا یک نهاد تازه (*die ik zie*).
  nl.a2.unit98.lesson03.teach.gn_werkwoord_achteraan:
    title: فعل به آخر می‌رود
    gloss: مرد در دکان کار می‌کند. / مردی که در دکان کار می‌کند
    note: در یک جملهٔ عادی فعل در جای دوم است. در جملهٔ موصولی فعل معمولاً به آخر می‌رود، بعد از مفعول و هر عبارت کوتاه مثل *in de winkel*.
  nl.a2.unit98.lesson03.teach.zinnen3:
    title: دو عبارت متضاد
    gloss: مشتری‌ای که به من زنگ زد / مشتری‌ای که من به او زنگ زدم
  nl.a2.unit98.lesson04.teach.zoeken:
    title: مال گم‌شده
    gloss: بټوه‌ام گم شده. من دنبال کیفی می‌گردم که گم کردم. این‌ها کلیدهایی استند که گم کردم.
  nl.a2.unit98.lesson04.teach.hier:
    title: کمک در دکان
    gloss: مردی که اینجا کار می‌کند به من کمک کرد. آن مشتری است که موبایلم را پیدا کرد.
  nl.a2.unit98.lesson04.teach.gn_modaal:
    title: دو فعل در آخر
    gloss: کوتی‌ای که می‌خواهم بخرم / کیفی که می‌خواهم داشته باشم
    note: 'وقتی فعل کمکی و مصدر باهم باشند، هر دو به آخر می‌روند. اول فعل کمکی می‌آید، بعد مصدر: *die ik wil kopen*.'
  nl.a2.unit98.lesson04.teach.gn_degene:
    title: 'Degene die: کسی که'
    gloss: من دنبال کسی می‌گردم که کیف مرا پیدا کرد.
    note: '*Degene die* یعنی «کسی که». وقتی از آن استفاده کنید که دقیق نمی‌دانید آن شخص کیست. در این درس بعد از آن *die* می‌آید.'
  nl.a2.unit98.lesson05.teach.woorden:
    title: کلمه‌های کوچک مفید
    gloss: دیروز / آنجا / دوباره / پس / حالا / هم
    example_gloss:
    - من کیف را دیروز خریدم.
    - حالا کلید را دوباره دارم.
  nl.a2.unit98.lesson05.teach.reading:
    title: Noor به Lotte می‌نویسد
    gloss: سلام Lotte، کیفم را گم کرده‌ام. این همان کیفی است که دیروز خریدم. در دکان جست‌وجو کردم. زنی که آنجا کار می‌کند به من کمک کرد. مشتری‌ای که کیف را دید به رئیس زنگ زد. حالا کیفم را دوباره دارم. کتابی که در کیف بود هم پس آمده است. با سلام‌های گرم، Noor
    note: به هر جملهٔ موصولی و اسمی که به آن تعلق دارد توجه کنید.
    glosses:
      zocht: جست‌وجو کرد
      hielp: کمک کرد
      zat: بود (در)
      zag: دید
      Groetjes: با سلام‌های گرم
  nl.a2.unit98.lesson05.teach.gn_zin_in_zin:
    title: جملهٔ موصولی در داخل یک جمله
    gloss: زنی که آنجا کار می‌کند به من کمک کرد.
    note: وقتی جملهٔ نسبی بعد از فاعل می‌آید، فعل اصلی بعد از آن قرار می‌گیرد. گذاشتن کاما بعد از جملهٔ نسبی معمول است، ولی ضروری نیست. جملهٔ نسبی بخشی از فاعل است.
  nl.a2.unit98.lesson06.teach.lotte_kwijt:
    title: لوته می‌گوید (سطر ۱)
    gloss: 'لوته: سلام عمر، جاکتم گم شده.'
  nl.a2.unit98.lesson06.teach.omar_gisteren:
    title: عمر می‌گوید (سطر ۲)
    gloss: 'عمر: آخ نی! همان جاکتی است که دیروز خریدی؟'
  nl.a2.unit98.lesson06.teach.lotte_blauw:
    title: لوته می‌گوید (سطر ۳)
    gloss: 'لوته: نی، جاکت آبی است که هفتهٔ گذشته خریدم.'
  nl.a2.unit98.lesson06.teach.omar_man:
    title: عمر می‌گوید (سطر ۴)
    gloss: 'عمر: مردی که در دوکان کار می‌کند، یک جاکت آبی پیدا کرد.'
  nl.a2.unit98.lesson06.teach.lotte_dank:
    title: لوته می‌گوید (سطر ۵)
    gloss: 'لوته: واقعاً؟ تشکر عمر! پس من به دوکان می‌روم.'
  nl.a2.unit98.lesson06.teach.omar_succes:
    title: عمر می‌گوید (سطر ۶)
    gloss: 'عمر: موفق باشی! از مردی که جاکت را پیدا کرد بپرس.'
exercises:
  nl.a2.unit98.lesson01.exercise01.choose_man_winkel:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: De man die in de winkel werkt.
    distractors:
    - De man dat in de winkel werkt.
    - De man die in de winkel werken.
    - Het man die in de winkel werkt.
    accepted_answers:
    - value: De man die in de winkel werkt.
      status: correct
    feedback: '*De man die in de winkel werkt*: بعد از کلمهٔ de از *die* استفاده می‌شود و فعل *werkt* به آخر می‌رود.'
    prompt_blocks:
    - مردی که در دکان کار می‌کند.
  nl.a2.unit98.lesson01.exercise02.choose_boek:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: Het boek dat ik kocht.
    distractors:
    - Het boek die ik kocht.
    - Het boek dat kocht ik.
    - De boek dat ik kocht.
    accepted_answers:
    - value: Het boek dat ik kocht.
      status: correct
    feedback: '*Het boek dat ik kocht*: بعد از کلمهٔ het از *dat* استفاده می‌شود و فعل *kocht* به آخر می‌رود.'
    prompt_blocks:
    - کتابی که خریدم.
  nl.a2.unit98.lesson01.exercise03.match_phrases:
    instruction: هر عبارت هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: de man die in de winkel werkt
        right: مردی که در دکان کار می‌کند
      - left: de tas die ik zoek
        right: کیفی که دنبالش می‌گردم
      - left: het boek dat ik kocht
        right: کتابی که خریدم
      - left: de klant die mijn telefoon vond
        right: مشتری‌ای که تیلفون مرا پیدا کرد
      - left: het horloge dat ik verloor
        right: ساعتی که گم کردم
      - left: de collega die mij helpt
        right: همکاری که به من کمک می‌کند
      status: correct
    feedback: 'هر عبارت یک شخص یا یک چیز را نام می‌برد و بعد می‌گوید کدام یک: *die* یا *dat*، و بعد فعل در آخر.'
    pairs:
    - left: de man die in de winkel werkt
      right: مردی که در دکان کار می‌کند
    - left: de tas die ik zoek
      right: کیفی که دنبالش می‌گردم
    - left: het boek dat ik kocht
      right: کتابی که خریدم
    - left: de klant die mijn telefoon vond
      right: مشتری‌ای که تیلفون مرا پیدا کرد
    - left: het horloge dat ik verloor
      right: ساعتی که گم کردم
    - left: de collega die mij helpt
      right: همکاری که به من کمک می‌کند
  nl.a2.unit98.lesson01.exercise04.order_dit_is:
    instruction: کلمات را طوری ترتیب کنید که معنی «این کتابی است که خریدم.» را بدهد.
    correct_option: Dit is het boek dat ik kocht
    accepted_answers:
    - value: Dit is het boek dat ik kocht
      status: correct
    feedback: '*Dit is het boek dat ik kocht.* فعل *kocht* در آخر است.'
  nl.a2.unit98.lesson01.exercise05.complete_die:
    instruction: جمله را با ضمیر نسبی درست کامل کنید.
    correct_option: die
    accepted_answers:
    - value: die
      status: correct
    feedback: '*Man* کلمهٔ de است، پس *die*.'
  nl.a2.unit98.lesson01.exercise06.translate_vrouw:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: De vrouw die in de winkel werkt, is mijn collega.
      status: correct
    - value: De vrouw die in de winkel werkt, is mijn collega
      status: correct
    - value: De vrouw die in de winkel werkt is mijn collega
      status: correct
    - value: De vrouw die in de winkel werkt is mijn collega.
      status: correct
    - value: De vrouw die werkt in de winkel, is mijn collega.
      status: correct
    - value: De vrouw die werkt in de winkel is mijn collega.
      status: correct
    - value: Mijn collega is de vrouw die in de winkel werkt.
      status: correct
    - value: Mijn collega is de vrouw die in de winkel werkt
      status: correct
    feedback: 'ترجمهٔ درست: *De vrouw die in de winkel werkt, is mijn collega.*'
    prompt_blocks:
    - زنی که در دکان کار می‌کند، همکار من است.
  nl.a2.unit98.lesson01.exercise07.write_boek:
    instruction: عبارت هالندی را بنویسین.
    correct_option: Het boek dat ik kocht
    accepted_answers:
    - value: Het boek dat ik kocht
      status: correct
    - value: het boek dat ik kocht
      status: correct
    - value: Het boek dat ik kocht.
      status: correct
    - value: het boek dat ik kocht.
      status: correct
    feedback: '*Het boek dat ik kocht.*'
    prompt_blocks:
    - عبارت هلندی «کتابی که خریدم» را بنویس. از dat و زمان گذشتهٔ ساده kocht استفاده کن.
  nl.a2.unit98.lesson02.exercise01.choose_schoenen:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: De schoenen die ik kocht.
    distractors:
    - De schoenen dat ik kocht.
    - Het schoenen die ik kocht.
    - De schoenen die kocht ik.
    accepted_answers:
    - value: De schoenen die ik kocht.
      status: correct
    feedback: '*Schoenen* جمع است، پس *die*.'
    prompt_blocks:
    - بوت‌هایی که خریدم.
  nl.a2.unit98.lesson02.exercise02.choose_horloge:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: Het horloge dat ik zoek.
    distractors:
    - Het horloge die ik zoek.
    - De horloge dat ik zoek.
    - Het horloge dat zoek ik.
    accepted_answers:
    - value: Het horloge dat ik zoek.
      status: correct
    feedback: '*Horloge* کلمهٔ het است، پس *dat*.'
    prompt_blocks:
    - ساعتی که دنبالش می‌گردم.
  nl.a2.unit98.lesson02.exercise03.match_die_dat:
    instruction: هر عبارت دری را با عبارت هالندی‌اش جور کنید.
    accepted_answers:
    - value:
      - left: کتاب‌هایی که خریدم
        right: de boeken die ik kocht
      - left: ساعتی که گم کردم
        right: het horloge dat ik verloor
      - left: تحفه‌ای که خریدم
        right: het cadeau dat ik kocht
      - left: چتری که گم کردم
        right: de paraplu die ik verloor
      - left: بوت‌هایی که دنبالشان می‌گردم
        right: de schoenen die ik zoek
      - left: تکتی که پیدا کردم
        right: het kaartje dat ik vond
      status: correct
    feedback: 'اول اسم را ببینین: کلمهٔ de یا جمع، *die* می‌گیرد؛ کلمهٔ het در حالت مفرد، *dat* می‌گیرد.'
    pairs:
    - left: کتاب‌هایی که خریدم
      right: de boeken die ik kocht
    - left: ساعتی که گم کردم
      right: het horloge dat ik verloor
    - left: تحفه‌ای که خریدم
      right: het cadeau dat ik kocht
    - left: چتری که گم کردم
      right: de paraplu die ik verloor
    - left: بوت‌هایی که دنبالشان می‌گردم
      right: de schoenen die ik zoek
    - left: تکتی که پیدا کردم
      right: het kaartje dat ik vond
    localize_pair_lefts: 'yes'
  nl.a2.unit98.lesson02.exercise04.order_horloge:
    instruction: کلمات را طوری ترتیب کنید که معنی «ساعتی را که گم کردم می‌جویم.» را بدهد.
