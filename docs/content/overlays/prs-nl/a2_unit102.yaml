  notes: 'Derived from en-nl by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Dari (Afghanistan) string was translated and adapted. Needs native Dari (Afghanistan) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
course:
  title: هالندی A2
  description: هالندی A2 مبتنی بر گرامر برای رفع سوءتفاهم‌ها با niet و geen.
  learning_goal: '«هنوز نه»، «دیگر نه» و «هیچ» را بگویین: جای niet را درست بگذارین، میان niet و geen انتخاب کنید و nog niet، niet meer و geen ... meer را به کار ببرید.'
units:
  nl.a2.unit102.nog_niet_geen_meer:
    title: هنوز نه، هیچ، دیگر نه
    description: سوءتفاهم دربارهٔ رزروها، سفارش‌ها و وعده‌های ملاقات را با niet، geen، nog niet، niet meer و geen ... meer درست کنید.
lessons:
  nl.a2.unit102.lesson01.niet_en_geen:
    title: Niet و geen
  nl.a2.unit102.lesson02.plaats_van_niet:
    title: Niet کجا می‌آید؟
  nl.a2.unit102.lesson03.niet_of_geen:
    title: انتخاب میان niet و geen
  nl.a2.unit102.lesson04.nog_niet_nog_geen:
    title: هنوز نه
  nl.a2.unit102.lesson05.niet_meer_geen_meer:
    title: دیگر نه، دیگر هیچ
  nl.a2.unit102.lesson06.lotte_en_omar_kamer:
    title: لوته، عمر و اتاق
teaching:
  nl.a2.unit102.lesson01.teach.restaurant:
    title: در رستورانت
    gloss: رستورانت / میز / رزرو / سفارش
    note: این چهار اسم در تمام این بخش دوباره می‌آیند.
    example_gloss:
    - من در رستورانت میز دارم.
    - عمر رزرو دارد.
    - نور سفارش دارد.
  nl.a2.unit102.lesson01.teach.hotel:
    title: در هوتل
    gloss: هوتل / اتاق / رزرو
    note: '*Hotel* کلمهٔ het است؛ *kamer* و *boeking* کلمه‌های de استند.'
    example_gloss:
    - هوتل در اوترشت است.
    - لوته اتاق دارد.
    - من رزرو را می‌شناسم.
  nl.a2.unit102.lesson01.teach.afspraak:
    title: وعده‌های ملاقات و پیام‌ها
    gloss: وعدهٔ ملاقات / داکتر / وقت / پیام
    note: '*Tijd* در این معنا جمع ندارد: به وقت به‌طور کلی اشاره می‌کند.'
    example_gloss:
    - من با داکتر وعدهٔ ملاقات دارم.
    - عمر وقت دارد.
    - نور پیام دارد.
  nl.a2.unit102.lesson01.teach.gn_niet_einde:
    title: Niet در آخر جمله
    gloss: من کار نمی‌کنم. من رستورانت را نمی‌شناسم.
    note: در جملهٔ کوتاه، *niet* در آخر می‌آید. مفعول معرفه (*het restaurant*، *de dokter*) پیش از *niet* قرار می‌گیرد.
  nl.a2.unit102.lesson01.teach.gn_geen:
    title: Geen به جای een
    gloss: من یک میز دارم. من میز ندارم.
    note: '*Geen* جای *een* را می‌گیرد و اسم را منفی می‌کند. معمولاً *niet een* گفته نمی‌شود.'
  nl.a2.unit102.lesson01.teach.zinnen:
    title: سه جملهٔ منفی
    gloss: من رزرو ندارم. من هوتل را نمی‌شناسم. من وقت ندارم.
  nl.a2.unit102.lesson02.teach.eigenschappen:
    title: کلمه‌های توصیفی
    gloss: باز / آماده / گران / بزرگ / خالی
    note: این کلمه‌ها بعد از *is* اسم را توصیف می‌کنند.
    example_gloss:
    - رستورانت باز است.
    - اتاق بزرگ است.
    - میز خالی است.
  nl.a2.unit102.lesson02.teach.werkwoorden:
    title: فعل‌ها برای رزرو
    gloss: زنگ زدن / رزرو کردن / آمدن / توانستن / رفتن؛ زنگ زده / رزرو کرده
    note: 'بسیاری از فعل‌ها زمان ماضی را با *heb* + صفت فعلی می‌سازند: *Ik heb gebeld*. بعد از *Kan* یک فعل دوم به شکل مصدر می‌آید: *Ik kan komen*.'
    example_gloss:
    - لوته زنگ زده است.
    - من اتاق را رزرو کرده‌ام.
    - من آمده می‌توانم.
    - من به رستورانت می‌روم.
  nl.a2.unit102.lesson02.teach.tijd:
    title: کلمه‌های زمان
    gloss: امروز / فردا / اکثراً
    note: کلمه‌های زمان معمولاً پیش از *niet* می‌آیند.
    example_gloss:
    - امروز می‌آیم.
    - عمر فردا زنگ می‌زند.
    - نور اکثراً زنگ می‌زند.
  nl.a2.unit102.lesson02.teach.gn_niet_voor:
    title: Niet پیش از ...
    gloss: اتاق کلان نیست. به رستورانت نمی‌روم. آمده نمی‌توانم. زنگ نزده‌ام.
    note: '*Niet* پیش از صفت (*niet groot*)، پیش از گروه حرف اضافه (*niet naar het restaurant*) و پیش از فعل دوم (*niet komen*، *niet gebeld*) می‌آید.'
  nl.a2.unit102.lesson02.teach.gn_niet_na:
    title: Niet بعد از ...
    gloss: اتاق را بوکینگ نکرده‌ام. فردا نمی‌آیم.
    note: مفعول معین (*de kamer*) و کلمه زمان (*morgen*، *vandaag*) پیش از *niet* می‌آیند. اگر بعد از آن اسم مفعول یا فعل دوم بیاید، *niet* پیش از آن قرار می‌گیرد؛ اما در جمله ساده مثل *Ik kom morgen niet*، *niet* در آخر می‌آید.
  nl.a2.unit102.lesson03.teach.meervoud:
    title: جمع و اسم‌های ناشمارا
    gloss: اتاق‌ها / میزها / جای / پول / قهوه
    note: '*Kamers* و *tafels* جمع استند. *Geld* و *koffie* در این کاربرد *een* ندارند و جمع هم نمی‌شوند.'
    example_gloss:
    - اتاق‌ها موجود است.
    - قهوه موجود است.
    - ما میز داریم.
    - من پول دارم.
  nl.a2.unit102.lesson03.teach.gn_geen_regels:
    title: چه وقت geen را بگیریم
    gloss: من وعده ملاقات ندارم. اتاق موجود نیست. وقت ندارم.
    note: 'وقتی *geen* را به کار ببریم که اسم *een* داشته باشد، artikel نداشته باشد یا جمع باشد: *een afspraak*، *tijd*، *kamers*.'
  nl.a2.unit102.lesson03.teach.gn_niet_regels:
    title: Niet یا geen؟
    gloss: داکتر را نمی‌شناسم. قهوه گران نیست. این رستورانت نیست.
    note: '*Niet* را برای اسم معین (*de dokter*)، برای صفت (*duur*) و برای فعل‌ها به کار ببرید. *Het is een restaurant* می‌شود *Het is geen restaurant*.'
  nl.a2.unit102.lesson04.teach.betalen:
    title: پرداخت و تأیید
    gloss: بل / تأیید / پرداخت شده / سفارش شده / آنجا
    note: '*Betaald* و *besteld* اسم مفعول استند، مثل *gebeld* و *geboekt*.'
    example_gloss:
    - بل را پرداخته‌ام.
    - تأییدیه اینجاست.
    - نور قهوه سفارش داده است.
  nl.a2.unit102.lesson04.teach.gn_nog_niet:
    title: Nog niet = هنوز نه
    gloss: اتاق را هنوز بوکینگ نکرده‌ام. اتاق هنوز آماده نیست.
    note: '*Nog niet* یعنی هنوز نه: یعنی بعداً می‌شود. جای آن مثل *niet* است و *nog* پیش از آن می‌آید.'
  nl.a2.unit102.lesson04.teach.gn_nog_geen:
    title: Nog geen = هنوز ... نه
    gloss: هنوز اتاق بوکینگ نکرده‌ام. هنوز پیام نداریم.
    note: '*Nog geen* + اسم یعنی هنوز ... نیست. *Nog* پیش از *geen* می‌آید.'
  nl.a2.unit102.lesson04.teach.antwoord:
    title: جواب‌های کوتاه
    gloss: اتاق آماده است؟ هنوز نه. میز داری؟ هنوز نه.
  nl.a2.unit102.lesson05.teach.woorden:
    title: کلمه‌های مفید
    gloss: بیشتر / افسوس که / پر / می‌خواهد / پس
    note: '*Meer* کلمه کلیدی این درس است.'
    example_gloss:
    - افسوس که هوتل پر است.
    - عمر یک اتاق می‌خواهد.
    - من دیگر وقت ندارم.
  nl.a2.unit102.lesson05.teach.gn_niet_meer:
    title: Niet meer = دیگر نه
    gloss: رستورانت دیگر باز نیست. من دیگر کار نمی‌کنم.
    note: '*Niet meer* یعنی پیش‌تر چنین بود، اما حالا نیست. جای آن مثل *niet* است.'
  nl.a2.unit102.lesson05.teach.gn_geen_meer:
    title: Geen ... meer = دیگر ... نیست
    gloss: دیگر اتاق باقی نمانده. دیگر وقت ندارم.
    note: '*Geen ... meer* یعنی چیزی باقی نمانده. *Meer* بعد از اسم می‌آید.'
  nl.a2.unit102.lesson05.teach.gn_contrast:
    title: Nog niet یا niet meer؟
    gloss: اتاق هنوز خالی نیست. اتاق دیگر خالی نیست.
    note: '*Nog niet*: بعداً می‌شود. *Niet meer*: تمام شده. این دو معنای مخالف هم دارند.'
  nl.a2.unit102.lesson05.teach.reading:
    title: لوته اتاق لازم دارد
    gloss: لوته می‌خواهد فردا یک اتاق بوکینگ کند. به هوتل زنگ می‌زند، اما افسوس که هوتل پر است. دیگر اتاق باقی نمانده. لوته هنوز اتاق دیگری ندارد. پس به یک هوتل دیگر زنگ می‌زند، اما آن هوتل دیگر باز نیست. پس لوته هنوز اتاق ندارد.
  nl.a2.unit102.lesson06.teach.ask_kamer:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، اتاق را بوکینگ کردی؟'
  nl.a2.unit102.lesson06.teach.nog_niet:
    title: Omar جواب می‌دهد
    gloss: 'عمر: هنوز نه. امروز وقت ندارم.'
  nl.a2.unit102.lesson06.teach.tafel:
    title: لوته می‌پرسد
    gloss: 'لوته: تو در رستورانت میز داری، درست است؟'
  nl.a2.unit102.lesson06.teach.klopt_niet:
    title: عمر او را اصلاح می‌کند
    gloss: 'عمر: نه، درست نیست. من میز ندارم. رستورانت پر است.'
  nl.a2.unit102.lesson06.teach.geen_meer:
    title: لوته دوباره می‌پرسد
    gloss: 'لوته: دیگر میز باقی نمانده؟'
  nl.a2.unit102.lesson06.teach.helaas:
    title: عمر گپ را ختم می‌کند
    gloss: 'عمر: نه، افسوس که نه. فردا زنگ می‌زنم.'
exercises:
  nl.a2.unit102.lesson01.exercise01.choose_geen:
    instruction: جمله درست هالندی را برای «من ریزرو ندارم.» انتخاب کنید.
    correct_option: Ik heb geen reservering.
    distractors:
    - Ik heb niet reservering.
    - Ik heb reservering niet.
    - Ik niet heb een reservering.
    accepted_answers:
    - value: Ik heb geen reservering.
      status: correct
    feedback: '*Een reservering* می‌شود *geen reservering*.'
    prompt_blocks:
    - من رزرو ندارم.
  nl.a2.unit102.lesson01.exercise02.choose_niet:
    instruction: جمله درست هالندی را برای «من هوتل را نمی‌شناسم.» انتخاب کنید.
    correct_option: Ik ken het hotel niet.
    distractors:
    - Ik ken geen het hotel.
    - Ik niet ken het hotel.
    - Ik ken het hotel geen.
    accepted_answers:
    - value: Ik ken het hotel niet.
      status: correct
    feedback: با مفعول معین (*het hotel*)، *niet* را بعد از آن بیاورید.
    prompt_blocks:
    - من هوتل را نمی‌شناسم.
  nl.a2.unit102.lesson01.exercise03.match_words:
    instruction: هر اسم هالندی را با معنای دری آن جور کنید.
    accepted_answers:
    - value:
      - left: de tafel
        right: میز
      - left: de reservering
        right: رزرو
      - left: de bestelling
        right: سفارش
      - left: de kamer
        right: اتاق
      - left: de afspraak
        right: وقت ملاقات
      - left: het bericht
        right: پیام
      - left: de tijd
        right: ساعت
      - left: de dokter
        right: داکتر
      status: correct
    feedback: این اسم‌ها در هر درس این واحد به کار می‌روند.
    pairs:
    - left: de tafel
      right: میز
    - left: de reservering
      right: رزرو
    - left: de bestelling
      right: سفارش
    - left: de kamer
      right: اتاق
    - left: de afspraak
      right: وقت ملاقات
    - left: het bericht
      right: پیام
    - left: de tijd
      right: ساعت
    - left: de dokter
      right: داکتر
  nl.a2.unit102.lesson01.exercise04.order_geen_tijd:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «من وقت ندارم.»
    correct_option: Ik heb geen tijd
    accepted_answers:
    - value: Ik heb geen tijd
      status: correct
    - value: Geen tijd heb ik
      status: correct
    feedback: '*Geen tijd* = وقت ندارم.'
  nl.a2.unit102.lesson01.exercise05.complete_geen:
    instruction: جمله را کامل کنید تا بگویین وعده ملاقات ندارین.
    correct_option: geen
    accepted_answers:
    - value: geen
      status: correct
    feedback: '*Een afspraak* می‌شود *geen afspraak*.'
  nl.a2.unit102.lesson01.exercise06.translate_no_time:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Ik heb geen tijd.
      status: correct
    - value: Ik heb geen tijd
      status: correct
    feedback: '*Ik heb geen tijd* = وقت ندارم.'
    prompt_blocks:
    - من وقت ندارم.
  nl.a2.unit102.lesson01.exercise07.write_dont_know:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Ik ken het hotel niet.
    accepted_answers:
    - value: Ik ken het hotel niet.
      status: correct
    - value: Ik ken het hotel niet
      status: correct
    - value: Het hotel ken ik niet.
      status: correct
    - value: Het hotel ken ik niet
      status: correct
    feedback: '*Het hotel* معین است، پس *niet* بعد از آن می‌آید.'
    prompt_blocks:
    - 'به هالندی بنویسین: من هوتل را نمی‌شناسم.'
  nl.a2.unit102.lesson02.exercise01.choose_groot:
    instruction: جمله‌ای را انتخاب کنید که niet در جای درست آن است.
    correct_option: De kamer is niet groot.
    distractors:
    - De kamer is groot niet.
    - De kamer niet is groot.
    - Niet de kamer is groot.
    accepted_answers:
    - value: De kamer is niet groot.
      status: correct
    feedback: '*Niet* پیش از صفت *groot* می‌آید.'
    prompt_blocks:
    - اتاق بزرگ نیست.
  nl.a2.unit102.lesson02.exercise02.choose_morgen:
    instruction: جمله‌ای را انتخاب کنید که niet در جای درست آن است.
    correct_option: Ik kan morgen niet komen.
    distractors:
    - Ik kan morgen komen niet.
    - Ik niet kan morgen komen.
    - Niet ik kan morgen komen.
    accepted_answers:
    - value: Ik kan morgen niet komen.
      status: correct
    feedback: اول کلمه زمان *morgen* می‌آید، بعد *niet*، بعد فعل دوم *komen*.
    prompt_blocks:
    - من فردا آمده نمی‌توانم.
  nl.a2.unit102.lesson02.exercise03.match_niet:
    instruction: هر جملهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: اتاق بزرگ نیست.
        right: اتاق بزرگ نیست.
      - left: Ik ken het hotel niet.
        right: من هوتل را نمی‌شناسم.
      - left: Ik ga niet naar het restaurant.
        right: من به رستورانت نمی‌روم.
      - left: Ik kan niet komen.
        right: من آمده نمی‌توانم.
      - left: Ik heb de kamer niet geboekt.
        right: من اتاق را رزرو نکرده‌ام.
      - left: رستورانت باز نیست.
        right: رستورانت باز نیست.
      status: correct
    feedback: ببینین *niet* در هر جمله کجا قرار دارد.
    pairs:
    - left: اتاق بزرگ نیست.
      right: اتاق بزرگ نیست.
    - left: Ik ken het hotel niet.
      right: من هوتل را نمی‌شناسم.
    - left: Ik ga niet naar het restaurant.
      right: من به رستورانت نمی‌روم.
    - left: Ik kan niet komen.
      right: من آمده نمی‌توانم.
    - left: Ik heb de kamer niet geboekt.
      right: من اتاق را رزرو نکرده‌ام.
    - left: رستورانت باز نیست.
      right: رستورانت باز نیست.
    localize_pair_lefts: 'yes'
  nl.a2.unit102.lesson02.exercise04.order_geboekt:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «من اتاق را بوکینگ نکرده‌ام.»
    correct_option: Ik heb de kamer niet geboekt
    accepted_answers:
    - value: Ik heb de kamer niet geboekt
      status: correct
    - value: De kamer heb ik niet geboekt
      status: correct
    feedback: مفعول معین *de kamer* پیش از *niet* می‌آید؛ *geboekt* در آخر است.
  nl.a2.unit102.lesson02.exercise05.complete_naar:
    instruction: جمله را کامل کنید تا بگویین به رستورانت نمی‌روید.
    correct_option: niet
    accepted_answers:
    - value: niet
      status: correct
    feedback: '*Niet* پیش از گروه حرف اضافه *naar het restaurant* می‌آید.'
  nl.a2.unit102.lesson02.exercise06.translate_today:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Ik kan vandaag niet komen.
      status: correct
    - value: Ik kan vandaag niet komen
      status: correct
    - value: Vandaag kan ik niet komen.
      status: correct
    - value: Vandaag kan ik niet komen
      status: correct
    feedback: '*Vandaag* پیش از *niet* می‌آید و *komen* در آخر است.'
    prompt_blocks:
    - من امروز آمده نمی‌توانم.
  nl.a2.unit102.lesson02.exercise07.write_called:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Ik heb niet gebeld.
    accepted_answers:
    - value: Ik heb niet gebeld.
      status: correct
    - value: Ik heb niet gebeld
      status: correct
