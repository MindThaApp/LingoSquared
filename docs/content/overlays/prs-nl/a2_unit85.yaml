    gloss: قطار از قبل رفته بود. پیشخوان هنوز باز نبود.
    note: Al را برای رویدادی به کار ببرید که پیشتر تمام شده بود و nog niet را برای چیزی که در آن نقطهٔ گذشته هنوز تمام نشده بود.
