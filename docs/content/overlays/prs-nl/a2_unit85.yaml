    gloss: وقتی رسیدم، قطار از قبل رفته بود.
    note: رسیدن نقطهٔ بعدی در گذشته است. Was vertrokken حرکت قطار را پیش از آن قرار می‌دهد.
  nl.a2.unit85.lesson01.teach.gn_bouw:
    title: ساختن ماضی بعید
    gloss: 'ماضی بعید: had یا was به‌اضافهٔ اسم مفعول.'
    note: در هالندی به این زمان voltooid verleden tijd می‌گویند. از had/was استفاده کنید؛ اسم مفعول و انتخاب فعل کمکی مثل perfectum است.
