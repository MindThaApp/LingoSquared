  nl.a2.unit85.lesson04.teach.gn_nadat:
    title: Nadat با had در آخر
    gloss: بعد از اینکه غذا خورده بودم، به ایستگاه رفتم.
    note: 'در جملهٔ پیروِ nadat، اسم مفعول پیش از فعل کمکی در آخر می‌آید: gegeten had. جملهٔ اصلی بعدی با فعل شروع می‌شود: ging ik.'
  nl.a2.unit85.lesson04.teach.gn_zijn:
    title: Nadat با was در آخر
    gloss: بعد از اینکه قطار رفته بود، به Omar زنگ زدم.
    note: 'Vertrekken با zijn می‌آید، پس جملهٔ پیرو با vertrokken was تمام می‌شود. جملهٔ پیروی که اول می‌آید باعث جابه‌جایی فعل و فاعل می‌شود: belde ik.'
  nl.a2.unit85.lesson05.teach.reading:
    title: چترِ گم‌شدهٔ Noor
    gloss: Noor دیر به ایستگاه رسید. قطارش از قبل رفته بود. او چترش را در قطار قبلی فراموش کرده بود. در پیشخوان اشیای پیداشده شنید که کسی چتر را پیدا کرده بود.
    note: 'دو رویداد پیشین را دنبال کنید: قطار رفت و Noor پیش از رسیدن به پیشخوان چترش را فراموش کرده بود.'
    glosses:
      laat: دیر
      vertrokken: چپ
      paraplu: چتر
      vergeten: فراموش‌شده
      voorwerpen: اشیای گم‌شده
      gevonden: پیدا شده
  nl.a2.unit85.lesson05.teach.gn_reading:
    title: تعیین رویداد پیشین
    gloss: ماضی بعید با had یا was و یک اسم مفعول، رویدادی را پیش از نقطه‌ای بعدی در گذشته قرار می‌دهد.
    note: در داستان Noor، *was vertrokken* و *had vergeten* رویدادهایی را نشان می‌دهند که در نقطه‌های بعدی از قبل تمام شده بودند.
  nl.a2.unit85.lesson06.teach.lotte_vraag:
    title: Lotte از دیر آمدن می‌پرسد
    gloss: 'Lotte: چرا به قرار ما دیر آمدی؟'
