    - فردا من یک وعدهٔ ملاقات دارم.
    - نمی‌خواهم قطار را از دست بدهم.
    - من پیش پیشخوان انتظار می‌کشم.
  nl.a2.unit85.lesson03.teach.vormen:
    title: نزد پیشخوان
    gloss: پیشخوان هنوز باز نبود. من قرارم را از دست دادم.
  nl.a2.unit85.lesson03.teach.gn_contrast:
    title: ماضی نقلی در برابر ماضی بعید
    gloss: من کیفم را گم کرده‌ام. وقتی به پیشخوان رسیدم، کیفم را از قبل گم کرده بودم.
    note: ماضی نقلی رویدادِ تمام‌شده را گزارش می‌دهد. ماضی بعید آن را صریحاً پیش از نقطهٔ دیگری در گذشته قرار می‌دهد.
