  nl.a2.unit85.lesson06.teach.lotte_tas:
    title: Lotte درباره‌ی کیف می‌پرسد
    gloss: 'Lotte: و کیفت؟'
  nl.a2.unit85.lesson06.teach.omar_tas:
    title: Omar توضیح می‌دهد که کیفش گم شده
    gloss: 'Omar: آن را در قطار قبلی جا گذاشته بودم، اما دفتر اشیای گم‌شده هنوز باز نشده بود.'
