units:
  nl.a2.unit81.een_drukke_ochtend:
    title: یک صبحِ پرمشغله
    description: یک صبح یا مسیر رفت‌وآمد را گام به گام با فعل‌های جداشدنی در ماضی نقلی توصیف کنید.
lessons:
  nl.a2.unit81.lesson01.ge_in_het_midden:
    title: ge- در میانهٔ فعل
  nl.a2.unit81.lesson02.stappen_op_volgorde:
    title: گام‌ها به ترتیب
  nl.a2.unit81.lesson03.wel_of_geen_ge:
    title: با ge- یا بدون ge-؟
  nl.a2.unit81.lesson04.de_ochtend_ging_mis:
    title: صبح خراب شد
  nl.a2.unit81.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit81.lesson06.lotte_en_noor:
    title: Lotte و Noor بعد از کار گپ می‌زنند
teaching:
  nl.a2.unit81.lesson01.teach.ochtend_reis:
    title: صبح و رفت‌وآمد
    gloss: صبح، ساعت زنگ‌دار، بس، بایسکل، کیف
    note: کلمه‌های اصلی برای آماده شدن و رفت‌وآمد.
    example_gloss:
    - صبح زود شروع می‌شود.
    - ساعت زنگ‌دارم ساعت هفت زنگ می‌زند.
    - بس در ایستگاه است.
    - بایسکلم بیرون است.
    - کیفم آماده است.
  nl.a2.unit81.lesson01.teach.verbindingswoorden:
    title: گام‌ها را به ترتیب بیاورید
    gloss: اول، بعد از آن، بعدتر، در آخر
    note: این کلمه‌های ربط یک گزارشِ گام‌به‌گام را منظم می‌کنند. وقتی یکی از آن‌ها جملهٔ اصلی را آغاز کند، فعلِ صرف‌شده پیش از فاعل می‌آید.
    example_gloss:
    - اول ناشتا می‌کنم.
    - بعد از آن کیفم را آماده می‌کنم.
    - بعدتر بیرون می‌روم.
    - در آخر سوار بس می‌شوم.
  nl.a2.unit81.lesson01.teach.gn_midden:
    title: اسم مفعول دور ge- ساخته می‌شود
    gloss: بیدار شدن ← بیدار شد؛ رسیدن ← رسید؛ پایین شدن ← پایین شد؛ سوار شدن ← سوار شد
    note: 'در فعلِ جداشدنی، *ge-* میان پیشوند و فعل می‌نشیند: *op-ge-staan*، *aan-ge-komen*، *uit-ge-stapt*، *in-ge-stapt*.'
  nl.a2.unit81.lesson01.teach.gn_zinnen:
    title: گام‌های تمام‌شدهٔ صبح
    gloss: من وقت بیدار شدم. بس خیلی دیر رسید. من در ایستگاه پایین شدم.
    note: این فعل‌های حرکت و تغییرِ موقعیت در ماضی نقلی با *zijn* می‌آیند.
  nl.a2.unit81.lesson01.teach.gn_hulpwerkwoord:
    title: این فعل‌ها با zijn می‌آیند
    gloss: من بیدار شدم؛ بس رسید؛ من سوار شدم و پایین شدم.
    note: در این رویدادهای تمام‌شدهٔ حرکت یا تغییرِ موقعیت، *ben/is* را با اسم مفعول به کار ببرید.
  nl.a2.unit81.lesson02.teach.klaarmaken:
    title: آماده شدن
    gloss: لباس پوشیدن، جمع‌وجور کردن، ظرف شستن، با خود بردن
    note: هر چهار فعل جداشدنی استند.
    example_gloss:
    - امروز لباس پوشیدن زود تمام می‌شود.
    - بعد از ناشتا خودم جمع‌وجور می‌کنم.
    - بعد از غذا من ظرف‌ها را می‌شویم.
    - با خود ببرم یا در خانه بگذارم؟
  nl.a2.unit81.lesson02.teach.gn_participles:
    title: اسم مفعول‌های جداشدنیِ بیشتر
    gloss: لباس پوشید؛ جمع‌وجور کرد؛ ظرف شست؛ با خود برد
    note: 'پیشوند در جلو می‌ماند و *ge-* در میان می‌آید: *aan-ge-kleed*، *op-ge-ruimd*، *af-ge-wassen*، *mee-ge-nomen*.'
  nl.a2.unit81.lesson02.teach.stappen:
    title: یک روتین چهارگامی
    gloss: اول بیدار شدم. بعد از آن لباس پوشیدم. بعدتر پیالهٔ چای‌ام را شستم. در آخر کیفم را با خود بردم.
    note: هر کلمهٔ ربط گام تمام‌شدهٔ بعدی را نشان می‌دهد.
  nl.a2.unit81.lesson03.teach.contrastwerkwoorden:
    title: سه فعل بدون ge- اضافی
    gloss: فراموش کردن، حرکت کردن، ناشتا کردن
    note: این فعل‌ها با پیشوندهای جدانشدنی شروع می‌شوند و اسم مفعولشان را بدون *ge-* اضافی می‌سازند.
    example_gloss:
    - فراموش کردن کارِ انسان است.
    - ما می‌خواهیم ساعت هشت حرکت کنیم.
    - من در خانه ناشتا می‌کنم.
  nl.a2.unit81.lesson03.teach.gn_contrast:
    title: جداشدنی در برابر جدانشدنی
    gloss: 'جداشدنی: بیدار شدن ← بیدار شد. جدانشدنی: فراموش کردن ← فراموش کرد، حرکت کردن ← حرکت کرد، ناشتا کردن ← ناشتا کرد.'
    note: '*opgestaan* را به کار ببرید، اما *vergeten*، *vertrokken* و *ontbeten* را بدون *ge-* دیگر.'
  nl.a2.unit81.lesson03.teach.contrastzinnen:
    title: شکل‌ها را مقایسه کنید
    gloss: من بیدار شدم و ناشتا کردم. بعد از آن حرکت کردم. کیفم را فراموش کردم.
    note: تنها فعلِ جداشدنیِ *opstaan* است که *ge-* را بعد از پیشوندش می‌گذارد.
  nl.a2.unit81.lesson03.teach.gn_modal:
    title: فعل جداشدنی بعد از فعل کمکیِ وجهی
    gloss: من می‌خواهم وقت بیدار شوم. باید آشپزخانه را جمع‌وجور کنم. می‌توانم در ایستگاه پایین شوم.
    note: 'بعد از *wil, moet* یا *kan* مصدر یکجا می‌ماند و در آخر جمله می‌آید: *opstaan, opruimen, uitstappen*.'
  nl.a2.unit81.lesson04.teach.op_tijd_snel:
    title: صبح چطور گذشت
    gloss: به وقت، زود، با این‌هم / با وجود این
    note: با این کلمه‌ها زمان و نتیجهٔ موفقِ غیرمنتظره را توضیح بدهین.
    example_gloss:
    - می‌خواهم به وقت برسم.
    - بس تیز می‌رود.
    - باران می‌بارد، اما با این‌هم می‌روم.
  nl.a2.unit81.lesson04.teach.gn_negatie:
    title: گام‌های منفی
    gloss: من کیفم را با خود نبردم. من به وقت بیدار نشدم.
    note: '*niet* را پیش از جزئی بگذارین که منفی می‌شود: اسم مفعولِ جداشدنی، یا عبارت *op tijd*.'
  nl.a2.unit81.lesson04.teach.gn_dat:
    title: ماضی نقلی در جملهٔ dat
    gloss: گفتم که من وقت بیدار شدم. شنیدم که بس خیلی دیر رسید.
    note: 'بعد از *dat* هر دو بخشِ فعل به آخر می‌روند: *ben opgestaan*، *is aangekomen*.'
  nl.a2.unit81.lesson04.teach.scenario:
    title: صبحی که خراب شد
    gloss: اول به وقت بیدار نشدم. بعد از آن زود لباس پوشیدم. بعدتر کیفم را با خود نبردم. در آخر سوار بس شدم.
    note: کلمه‌های ربط به گام‌های ناکام و تمام‌شده ترتیبی روشن می‌دهند.
  nl.a2.unit81.lesson05.teach.noor_bericht:
    title: صبحِ پرمشغلهٔ Noor
    gloss: سلام Lotte! صبحم خیلی پرمشغله بود. اول خیلی دیر بیدار شدم. بعد از آن زود لباس پوشیدم و ناشتا کردم. بعدتر آشپزخانه را جمع‌وجور کردم، اما ناهارم را با خود نبردم. با بایسکل تا بس‌ایستگاه رفتم و سوار بس شدم. در آخر با این‌هم به وقت به کار رسیدم.
    note: متن را برای ترتیب رویدادها و آن یک چیزی که Noor با خود نبرد بخوانین.
    glosses:
      erg: خیلی
      druk: پرمشغله
      bushalte: ایستگاه بس
      lunch: ناهار
      toch: بازهم / با وجود آن
  nl.a2.unit81.lesson06.teach.lotte_vraag:
    title: لوته در مورد صبح می‌پرسد
    gloss: 'لوته: سلام نور، صبحت چطور گذشت؟'
  nl.a2.unit81.lesson06.teach.noor_eerst:
    title: نور اولین مشکل را می‌گوید
    gloss: 'نور: خیلی خوب نبود. اول، دیر از خواب بیدار شدم.'
  nl.a2.unit81.lesson06.teach.lotte_daarna:
    title: لوته می‌پرسد بعد چه شد
    gloss: 'لوته: آه نه! بعدش چی شد؟'
  nl.a2.unit81.lesson06.teach.noor_tas:
    title: نور قدم‌های بعدی را می‌گوید
    gloss: 'نور: بعدش زود لباس پوشیدم، ولی کیفم را با خود نبردم.'
  nl.a2.unit81.lesson06.teach.lotte_reis:
    title: لوته در مورد رفت‌وآمد می‌پرسد
    gloss: 'لوته: چطور به سر کارت رفتی؟'
  nl.a2.unit81.lesson06.teach.noor_aankomst:
    title: نور گزارشش را تمام می‌کند
    gloss: 'نور: سوار بس شدم. آخر سر بازهم به وقت رسیدم.'
  nl.a2.unit81.lesson06.teach.vraag:
    title: یک سوال
    gloss: سوال
    note: '*Een vraag stellen* یعنی سوال کردن.'
    example_gloss: لوته در مورد صبح سوال می‌کند.
exercises:
