course:
  title: هالندی A2
  description: دستور زبان هالندی سطح A2 برای صحبت دربارهٔ احساسات و مراقبت از خود.
  learning_goal: از فعل‌های انعکاسی با جدول کامل me, je, zich, ons, je, zich استفاده کنید تا بگویین چه احساسی دارید و چگونه از خود مراقبت می‌کنین.
units:
  nl.a2.unit103.zorg_voor_jezelf:
    title: مراقبت از خود
    description: با فعل‌های انعکاسی بگویین چه احساسی دارید و چگونه از خود مراقبت می‌کنین.
lessons:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je:
    title: چطور احساس میکنی؟
  nl.a2.unit103.zorg_voor_jezelf.lesson02.het_hele_rijtje:
    title: مجموعهٔ کامل
  nl.a2.unit103.zorg_voor_jezelf.lesson03.wassen_of_zich_wassen:
    title: Wassen یا zich wassen؟
  nl.a2.unit103.zorg_voor_jezelf.lesson04.bij_de_kapper_en_thuis:
    title: پیش سلمانی و در خانه
  nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar:
    title: Lotte و Omar
teaching:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gezondheid:
    title: صحت
    gloss: مریض / صحتمند / خسته / درد / سر / شکم / داکتر
    note: این کلمه‌ها می‌گویند بدن شما چه احساسی دارد.
    example_gloss:
    - Noor مریض است.
    - Lotte صحتمند است.
    - Omar خسته است.
    - سرم درد می‌کند.
    - شکمم درد می‌کند.
    - Noor پیش داکتر می‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gevoelens:
    title: احساسات
    gloss: خوشحال / خشمگین / ترسیده / غمگین / آرام / دلواپس
    note: این صفت‌ها احساسات را نام می‌برند. آن‌ها را بعد از شکلی از zijn یا بعد از voelen + ضمیر انعکاسی به کار ببرید.
    example_gloss:
    - Omar خوشحال است.
    - Noor خشمگین است.
    - Lotte دلواپس است.
    - من ترسیده استم.
    - او غمگین است.
    - ما آرام استیم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.verzorging:
    title: مراقبت شخصی
    gloss: سلمانی / موی / ریش / دست
    note: کلمه‌هایی برای مراقبت از ظاهر خود.
    example_gloss:
    - Omar پیش سلمانی می‌رود.
    - Lotte موی دراز دارد.
    - مرد ریش دارد.
    - من یک دست دارم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gn_voelen:
    title: 'Zich voelen: جدول کامل'
    gloss: من احساس می‌کنم / تو احساس می‌کنی / او (مرد) احساس می‌کند / او (زن) احساس می‌کند / ما احساس می‌کنیم / شما احساس می‌کنین / آن‌ها احساس می‌کنند
    note: 'Zich voelen فعل انعکاسی است: ضمیر انعکاسی همیشه با فاعل مطابقت دارد. Ik: me. Jij: je. Hij, zij: zich. Wij: ons. Jullie: je. Zij (آن‌ها): zich.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.vraag:
    title: پرسیدن از احساس کسی
    gloss: حالت چطور است؟ من خوبم.
    note: 'هر دو je لازم است: اولی فاعل است، دومی ضمیر انعکاسی.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.zinnen:
    title: احساسات در جمله
    gloss: من احساس خستگی می‌کنم. او احساس مریضی می‌کند. ما احساس خوشحالی می‌کنیم. Lotte مریض است. او احساس خوبی ندارد.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.werkwoorden:
    title: سه فعل انعکاسی
    gloss: خود را شستن / عجله کردن / ریش تراشیدن
    note: در قاموس این فعل‌ها با zich آمده‌اند. در جمله، zich با فاعل تغییر می‌کند.
    example_gloss:
    - من هر صبح خودم را می‌شویم.
    - Noor برای رفتن به کارش عجله می‌کند.
    - Omar امروز ریش می‌تراشد.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.tijd:
    title: وقت و سرعت
    gloss: هر صبح / امروز / امشب / همیشه / زود / کار
    note: کلمه‌های زمان اکثراً در اول جمله می‌آیند.
    example_gloss:
    - هر صبح عجله می‌کنم.
    - امروز احساس خوبی دارم.
    - امشب در خانه استم.
    - تو همیشه عجله می‌کنی.
    - ما زود خود مان را می‌شوییم.
    - Lotte به سر کار می‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_rijtje:
    title: 'ضمیرهای انعکاسی: me, je, zich, ons'
    gloss: من عجله می‌کنم / تو عجله می‌کنی / او (مرد) عجله می‌کند / او (زن) عجله می‌کند / ما عجله می‌کنیم / شما عجله می‌کنین / آن‌ها عجله می‌کنند
    note: 'ضمیر انعکاسی بعد از فاعل می‌آید: ik: me؛ jij: je؛ hij، zij، het: zich؛ wij: ons؛ jullie: je؛ zij (آن‌ها): zich. به آخر فعل‌ها هم توجه کنید: ik haast، jij haast، wij haasten.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_zich:
    title: Zich برای نام‌ها و اسم‌های جمع هم می‌آید
    gloss: Lotte خودش را می‌شوید. بچه‌ها خود شان را می‌شویند. تو ریشت را می‌تراشی. ما خود مان را می‌شوییم.
    note: 'نام یا اسم (Lotte, de kinderen) درست مثل hij، zij یا het، zich می‌گیرد. فقط ik، jij، wij و jullie شکل‌های خودشان را دارند: me, je, ons, je.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.zinnen:
    title: چهار جملهٔ کوتاه
    gloss: من خودم را می‌شویم. تو خودت را می‌شویی. او ریشش را می‌تراشد. ما عجله می‌کنیم.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.lichaam:
    title: چیزهایی که می‌شود شست
    gloss: روی / دست‌ها / دندان‌ها / موتر / طفل / بچه‌ها
    note: وقتی نام عضو بدن را می‌گیرین، از mijn، je یا zijn استفاده کنید (عضو بدن خودتان مفعول انعکاسی نیست).
    example_gloss:
    - من دست‌هایم را می‌شویم.
    - تو رویت را می‌شویی.
    - او دندان‌های قشنگ دارد.
    - Lotte موتر را می‌شوید.
    - Omar طفل را می‌شوید.
    - بچه‌ها در خانه استند.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_lichaam:
    title: عضو بدن یا تمام شخص
    gloss: من دست‌هایم را می‌شویم. من خودم را می‌شویم. تو رویت را می‌شویی. تو خودت را می‌شویی.
    note: 'اگر نام عضو بدن را بگیرین، ضمیر ملکی (mijn, je, zijn) به کار می‌رود و ضمیر انعکاسی نمی‌آید. اگر نام عضو را نگیرید، ضمیر انعکاسی می‌آید. دقت کنید: je می‌تواند «ـت» باشد (je gezicht) یا «خودت» (wast je).'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_ander:
    title: شخص دیگر یا خودتان
    gloss: Lotte موتر را می‌شوید. Lotte خودش را می‌شوید. او ریشش را می‌تراشد. او خودش را می‌تراشد.
    note: Zich فقط وقتی به کار می‌رود که فاعل و مفعول یک شخص باشند. مفعول دیگر (de auto, zijn baard) zich نمی‌گیرد.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.altijd_zich:
    title: همیشه انعکاسی
    gloss: اشتباه کردن / دل‌تنگ شدن
    note: در این معناها، این دو فعل همیشه zich می‌گیرند (vervelen می‌تواند معنای اذیت کردن کسی را هم بدهد، ولی در این درس نه). ضمیر بخشی از فعل است.
    example_gloss:
    - ببخشین، من اشتباه می‌کنم.
    - او امروز دلش تنگ است.
    - من دل‌تنگ استم.
    - تو اشتباه نمی‌کنی.
    - ما هرگز دل‌تنگ نمی‌شویم.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_voelen_pijn:
    title: Voelen با me و بدون me
    gloss: من احساس مریضی می‌کنم. من درد را احساس می‌کنم.
    note: Voelen وقتی انعکاسی است که حال خودتان را بگویین (ik voel me ziek). وقتی چیزی را احساس می‌کنین، مثل de pijn، انعکاسی نیست.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_zelf:
    title: تأکید با -zelf
    gloss: من خودم را می‌شویم. تو خودت را می‌شویی. او خودش را می‌شوید.
    note: -zelf را فقط برای تأکید اضافه کنید، مثلاً وقتی معمولاً کس دیگری آن کار را می‌کند. در جمله‌های عادی me، je و zich کافی است.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.ontspannen:
    title: آرام گرفتن و آرایشگر
    gloss: آرام گرفتن / چیدن / حمام / گرم
    note: Zich ontspannen مثل فعل‌های دیگر این درس انعکاسی است.
    example_gloss:
    - من در یک حمام گرم آرام می‌گیرم.
    - آرایشگر موهایم را می‌چیند.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.volgorde_woorden:
    title: ترتیب و زمان
    gloss: اول / بعد / بعدش / روز شنبه / آخر هفته / چرا / هرگز
    note: از eerst، dan و daarna استفاده کنید تا یک برنامهٔ کوتاه را به ترتیب بگویین.
    example_gloss:
    - اول ریشم را می‌تراشم.
    - بعد پیش آرایشگر می‌روم.
    - بعدش در خانه استم.
    - روز شنبه پیش آرایشگر می‌روم.
    - در آخر هفته آرام می‌گیرم.
    - چرا او عجله می‌کند؟
    - من هیچ‌وقت ملول نمی‌شوم.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag:
    title: سؤال با فعل انعکاسی
    gloss: حالت خوب است؟ او عجله می‌کند؟ دل‌تنگ استی؟ چرا او عجله می‌کند؟
    note: 'در سؤال بلی/نخیر اول فعل می‌آید، بعد فاعل، بعد ضمیر انعکاسی: voel jij je. با کلمهٔ پرسشی (waarom) اول کلمهٔ پرسشی می‌آید، بعد فعل. وقتی jij بعد از فعل بیاید، پسوند -t می‌افتد (jij voelt، ولی voel jij).'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_voorop:
    title: اول کلمهٔ زمان
    gloss: بعدش آرام می‌گیرم. اول ریشم را می‌تراشم. امروز احساس خستگی می‌کنم.
    note: 'وقتی جمله با کلمهٔ زمان شروع شود، فعل در جای دوم می‌ماند و فاعل بعد از آن می‌آید. ضمیر انعکاسی باز هم بعد از فاعل می‌آید: ontspan ik me.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_bijzin:
    title: ضمیر انعکاسی بعد از dat
    gloss: فکر می‌کنم او عجله می‌کند. فکر می‌کنم تو اشتباه می‌کنی.
    note: 'بعد از dat، ضمیر انعکاسی بعد از فاعل می‌آید و فعل صرف‌شده به آخر جمله می‌رود: dat hij zich haast.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.bevel:
    title: به کسی گفتن که چه کند
    gloss: عجله کن! آرام بگیر!
    note: در امر با jij، فعل -t ندارد و ضمیر انعکاسی je بعد از آن می‌آید.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.scenario:
    title: برنامهٔ روز شنبه
    gloss: روز شنبه پیش آرایشگر می‌روم. آرایشگر موهایم را می‌چیند. بعدش در خانه آرام می‌گیرم.
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading:
    title: پیام Noor
    gloss: سلام Lotte و Omar، این هفته حالم خوب نیست. خسته استم و سرم درد می‌کند. هر صبح برای رفتن به کار عجله می‌کنم. امشب در یک حمام گرم آرام می‌گیرم. شما هم احساس خستگی می‌کنین؟ با سلام‌های گرم، Noor
    note: همهٔ فعل‌های انعکاسی و ضمیری را که با آن می‌آید پیدا کنید.
    glosses:
      deze: این
      week: هفته
      ook: هم
      groetjes: با سلام‌های گرم
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra:
    title: کلمه‌های پیام
    gloss: این هفته / هم / با سلام‌های گرم
    note: Groetjes راه دوستانه‌ای برای ختم کردن پیام به دوستان است.
    example_gloss:
    - این هفته خسته استم.
    - تو هم احساس خستگی می‌کنی؟
    - با سلام‌های گرم، Lotte
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1:
    title: Lotte از Omar می‌پرسد چه احساسی دارد
    gloss: 'Lotte: سلام Omar، امروز حالت چطور است؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2:
    title: Omar می‌گوید خسته است
    gloss: 'Omar: خسته استم. هر صبح برای رفتن به کار عجله می‌کنم.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3:
    title: Lotte نصیحت می‌کند
    gloss: 'Lotte: پس در آخر هفته آرام بگیر!'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4:
    title: Omar برنامه می‌سازد
    gloss: 'Omar: بلی، روز شنبه پیش آرایشگر می‌روم. بعدش در خانه آرام می‌گیرم.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5:
    title: Lotte دربارهٔ دل‌تنگی می‌پرسد
    gloss: 'Lotte: پس دل‌تنگ نمی‌شوی؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6:
    title: Omar جواب می‌دهد
    gloss: 'Omar: نخیر، من هرگز دل‌تنگ نمی‌شوم.'
exercises:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise01.kies_moe:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ik voel me moe.
    distractors:
    - Ik voel moe.
    - Ik ben me moe.
    - Ik voel je moe.
    accepted_answers:
    - value: Ik voel me moe.
      status: correct
    feedback: 'Voelen وقتی حال خودتان را بیان می‌کند، ضمیر انعکاسی *me* لازم دارد: *Ik voel me moe*.'
    prompt_blocks:
    - من احساس خستگی می‌کنم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise02.kies_blij:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Omar voelt zich blij.
    distractors:
    - Omar voelt me blij.
    - Omar voelt ons blij.
    - Omar voelt je blij.
    accepted_answers:
    - value: Omar voelt zich blij.
      status: correct
    feedback: با hij، zij یا یک نام، ضمیر انعکاسی *zich* است.
    prompt_blocks:
    - Omar احساس خوشحالی می‌کند.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise03.match_gevoelens:
    instruction: هر کلمهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: ziek
        right: مریض
      - left: moe
        right: خسته
      - left: blij
        right: خوشحال
      - left: boos
        right: عصبانی
      - left: bang
        right: ترسیده
      - left: rustig
        right: آرام
      status: correct
    feedback: این‌ها کلمه‌های صحت و احساس استند که بعد از *voelen* به کار می‌برید.
    pairs:
    - left: ziek
      right: مریض
    - left: moe
      right: خسته
    - left: blij
      right: خوشحال
    - left: boos
      right: عصبانی
    - left: bang
      right: ترسیده
    - left: rustig
      right: آرام
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise04.volgorde_hoe:
    instruction: کلمه‌ها را طوری مرتب کنید که بپرسین «حالت چطور است؟»
    correct_option: Hoe voel je je
    accepted_answers:
    - value: Hoe voel je je
      status: correct
    feedback: '*Hoe voel je je?* = حالت چطور است؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise05.vul_ons:
    instruction: با ضمیر انعکاسی مربوط به wij کامل کنید.
    correct_option: ons
    accepted_answers:
    - value: ons
      status: correct
    feedback: ضمیر انعکاسی برای *wij* همان *ons* است.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise06.vertaal_hoe:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Hoe voel je je?
      status: correct
    - value: Hoe voel je je
      status: correct
    - value: Hoe voel jij je?
      status: correct
