teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: خوش، غمگین و خشمگین
    gloss: خوش، غمگین، خشمگین
    note: سه کلمهٔ ساده و رایج احساس که با zijn (بودن) به کار می‌روند تا بگویین چه احساسی دارید.
    example_gloss:
    - من خوش هستم.
    - من غمگین استم.
    - من خشمگین هستم.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: گفتن اینکه خوش استی
    gloss: من خوش هستم.
    note: '*Zijn* (بودن) + صفت احساس، الگوی اساسی است؛ در دری هم می‌گوییم «من خوش استم»، یعنی با فعل بودن.'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: مقایسه‌ی احساسات
    gloss: من خشمگین نیستم، غمگین هستم.
    note: '*Niet* مستقیم *boos* را منفی می‌کند؛ بعد جملهٔ دوم احساس واقعی را می‌گوید.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: پرسیدن سبب
    gloss: چرا خوش استی؟
    note: '*Waarom* (چرا) کلمهٔ پرسش معمول برای پرسیدن دلیل است.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: گفتن سبب
    gloss: من خوش هستم چون یک آپارتمان نو دارم.
    note: '*Omdat* (چون) جملهٔ دلیل را شروع می‌کند؛ فعل به آخر همان جمله می‌رود (*heb* بعد از *appartement* می‌آید).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: یک سبب منفی
    gloss: من غمگین هستم چون باران می‌بارد.
    note: '*regent* (باران می‌بارد) از درس هوا دوباره به عنوان جملهٔ دلیل آمده است.'
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: عصبی
    gloss: عصبی
    note: کلمه‌ی معمول برای دلواپسی و اضطراب.
    example_gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: گفتن اینکه از چه دلواپس استی
    gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
    note: '*Voor* (لفظاً «برای») نشان می‌دهد عصبی بودن دربارهٔ چیست؛ در دری برای این معنا معمولاً «از» یا «بخاطر» می‌گوییم.'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: دلداری دادن به کسی
    gloss: غم نخور.
    note: '*Maak je geen zorgen* (لفظاً «برای خود غم نساز») عبارت ثابت و معمول برای دلداری دادن است.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: پرسیدن اینکه کسی چه احساس دارد
    gloss: Omar چطور احساس می‌کند؟
    note: '*Voelen zich* (احساس کردن، بازتابی) راه معمول برای پرسیدن یا گفتن حالت روحی است؛ با *voelen* جسمی در درس‌های صحت واحد 16 فرق دارد.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: گفتن اینکه کسی چه احساس دارد
    gloss: او دلواپس است.
    note: '*Zich* ضمیر بازتابی سوم شخص است و با *voelt* می‌آید.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: پرسیدن اینکه چرا کسی چنین احساسی دارد
    gloss: چرا او دلواپس است؟
    note: '*waarom* با الگوی *voelt zich* از جملهٔ *Hij voelt zich zenuwachtig* یکجا شده است.'
  nl.a1.unit21.lesson05.teach.bericht:
    title: خواندن پیام درباره‌ی احساسات
    gloss: سلام Lotte، من برای اولین نوبت کاری‌ام که تنها استم، کمی عصبی استم. ولی خوش هم استم، چون کار تازه و اپارتمان تازه دارم. فکر می‌کنم همه‌چیز خوب می‌شود.
    note: بفهم که نویسنده از چه دلواپس است، چه چیز او را خوش می‌کند و دید کلی‌اش چیست.
    glosses:
      beetje: کمی
      zenuwachtig: عصبی
      eerste: اولین
      dienst: نوبت کاری
      alleen: تنها
      blij: خوشحال
      want: چون
      nieuwe: نو
      baan: کار
      nieuw: نو
      appartement: آپارتمان
      denk: فکر کردن
      komt: 'درست شدن (اینجا: خوب می‌شود)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte از Omar می‌پرسد چه احساسی دارد
    gloss: 'Lotte: سلام Omar، برای اولین نوبت کاری‌ات چه احساسی داری؟'
    note: '*Voor je eerste dienst* (دربارهٔ اولین نوبت کاری‌ات) الگوی *voor* + اسم را از درس 3 تکرار می‌کند.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar اعتراف می‌کند که عصبی است
    gloss: 'Omar: راستش کمی عصبی استم.'
    note: '*Eerlijk gezegd* (راستش) اعتراف را نرم‌تر می‌سازد.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte به او دلداری می‌دهد
    gloss: 'Lotte: نگران نباش، تو خوب از عهده‌اش برمی‌آیی!'
    note: '*Je kunt het goed* (لفظاً «تو آن را خوب می‌توانی») عبارت ثابت برای دلگرم کردن است.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar از او تشکر می‌کند
    gloss: 'Omar: تشکر، واقعاً کمک می‌کند.'
    note: '*Helpt* شکل سوم شخص *helpen* (کمک کردن) است.'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte نتیجه را پیش‌بینی می‌کند
    gloss: 'Lotte: و بعدش حتماً خیلی خوش و سرفراز می‌شوی.'
    note: '*Vast* (حتماً) پیش‌بینی با اطمینان را نشان می‌دهد؛ *trots* (سرفراز) صفت تازه و مفید است.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar موافقت می‌کند
    gloss: 'Omar: بلی، من هم همین فکر را می‌کنم.'
    note: '*Dat denk ik ook* (لفظاً «آن را من هم فکر می‌کنم») راه طبیعی برای موافقت با نظر کسی است.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: خلاصه کردن با is، zijn و hem
    gloss: Omar از اولین نوبت کاری‌اش عصبی است. Lotte به او کمک می‌کند.
    note: '*Is* شکل سوم شخص *zijn* (بودن) است؛ *zijn* اینجا به معنای «مال او» (ملکیت) است؛ *hem* یعنی «او» (ضمیر مفعولی) -- سه کلمهٔ کوچک ولی ضروری برای حرف زدن دربارهٔ شخص دیگر.'
