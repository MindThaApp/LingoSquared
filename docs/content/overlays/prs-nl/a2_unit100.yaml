course:
  title: هالندی A2
  description: هلندی A2 با تمرکز بر دستور زبان برای توصیف چیزها
  learning_goal: یک چیز را با اندازه، رنگ، جنس و صاحب آن دقیق توصیف کنید و پایان درست صفت را به کار ببرید.
units:
  nl.a2.unit100.een_mooie_rode_jas:
    title: یک کوت سرخ قشنگ
    description: 'چیزها را با صفت توصیف کنید: چه وقت صفت -e می‌گیرد و چه وقت نمی‌گیرد.'
lessons:
  nl.a2.unit100.lesson01.kleren_en_kleuren:
    title: لباس، رنگ‌ها و چیزها
  nl.a2.unit100.lesson02.de_rode_jas_het_rode_huis:
    title: کوت سرخ، خانهٔ سرخ
  nl.a2.unit100.lesson03.een_rood_huis_een_rode_jas:
    title: یک خانهٔ سرخ، یک کوت سرخ
  nl.a2.unit100.lesson04.groot_oud_van_hout:
    title: بزرگ، کهنه و چوبی
  nl.a2.unit100.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit100.lesson06.jas_kwijt:
    title: لوته کوتش را گم کرده است
teaching:
  nl.a2.unit100.lesson01.teach.kleding:
    title: لباس
    gloss: کوت / سویتر / پتلون / شال / پیراهن / بوت
    note: واژه‌های لباس از A1 دوباره می‌آیند. همهٔ آن‌ها واژه‌های *de* اند. جمع *schoen*، *schoenen* است.
    example_gloss:
    - من یک کوت دارم.
    - سویتر آبی است.
    - پتلون دراز است.
    - بوت‌ها سیاه اند.
  nl.a2.unit100.lesson01.teach.kleuren:
    title: رنگ‌ها
    gloss: سرخ / آبی / سبز / زرد / سیاه / سفید
    note: واژه‌های رنگ صفت اند. در این درس یاد می‌گیرین که چه وقت پایان می‌گیرند.
    example_gloss:
    - کوت سرخ است.
    - کیف سیاه است.
    - کاغذ سفید است.
  nl.a2.unit100.lesson01.teach.grootte:
    title: اندازه
    gloss: بزرگ / کوچک / دراز / کوتاه
    example_gloss:
    - خانه بزرگ است.
    - کلید کوچک است.
    - شال دراز است.
    - پیراهن کوتاه است.
  nl.a2.unit100.lesson01.teach.huis:
    title: در خانه
    gloss: میز / چوکی / چراغ / تخت / خانه / کتاب / کاغذ
    note: 'هر اسم را همراه با *de* یا *het* یاد بگیرین. از حالا به بعد این برای صفت‌ها مهم است: *bed, huis, boek* و *papier* کلمه‌های *het* استند.'
    example_gloss:
    - میز بزرگ است.
    - تخت کوچک است.
    - کتاب آبی است.
    - چراغ زرد است.
  nl.a2.unit100.lesson01.teach.kwijt:
    title: چیزهای گم‌شده
    gloss: کیف / کلید / چتر / کیف پول / گم
    note: '*Kwijt zijn* یعنی چیزی را گم کرده باشی و ندانی کجا است.'
    example_gloss:
    - کیفم گم شده است.
    - کلید کوچک است.
    - چتر سبز است.
    - کیف پول سرخ است.
  nl.a2.unit100.lesson01.teach.gn_na_zijn:
    title: بعد از zijn پایان نمی‌آید
    gloss: کوت سرخ است. خانه بزرگ است. کوت‌ها سرخ اند.
    note: 'بعد از *zijn* صفت همان‌طور می‌ماند، بدون *-e*: *de jas is rood، het huis is groot، de jassen zijn rood*. *-e* فقط وقتی می‌آید که صفت پیش از اسم بیاید.'
  nl.a2.unit100.lesson02.teach.eigenschappen:
    title: صفت‌های بیشتر
    gloss: قشنگ / کهنه / نو / گرم / نرم
    example_gloss:
    - چراغ قشنگ است.
    - خانه کهنه است.
    - سویتر نو است.
    - شال گرم است.
    - تخت نرم است.
  nl.a2.unit100.lesson02.teach.gn_bepaald:
    title: 'با de یا het: همیشه -e'
    gloss: کوت سرخ، کیف بزرگ، سویتر آبی؛ خانهٔ سرخ، تخت بزرگ، کاغذ سفید
    note: 'بعد از *de* یا *het* صفتی که پیش از اسم می‌آید همیشه با *-e* تمام می‌شود، چه واژهٔ *de* باشد چه واژهٔ *het*: *de rode jas* و *het rode huis*.'
  nl.a2.unit100.lesson02.teach.gn_spelling:
    title: تغییر املا
    gloss: 'سرخ، بزرگ، سفید، زرد: املای آن‌ها پیش از اسم'
    note: 'با اضافه شدن *-e* ممکن است املای کلمه تغییر کند. مصوت بلندی که دوبل نوشته می‌شود، یک حرف خود را از دست می‌دهد: *rood → rode, groot → grote, geel → gele*. مصوت کوتاه پیش از یک همخوان آخر، آن همخوان را دوبل می‌کند: *wit → witte*.'
  nl.a2.unit100.lesson02.teach.gn_regelmatig:
    title: بیشتر صفت‌ها فقط -e می‌گیرند
    gloss: آبی، سیاه، سبز، نو، کهنه، قشنگ، کوچک، دراز، کوتاه، گرم، نرم
    note: بیشتر صفت‌ها بدون هیچ تغییر املا فقط *-e* می‌گیرند.
  nl.a2.unit100.lesson02.teach.zinnen:
    title: سه جمله
    gloss: کوت سرخ قشنگ است. کاغذ سفید نو است. چوکی سبز کهنه است.
    note: 'صفتی که پیش از اسم می‌آید *-e* می‌گیرد؛ بعد از *is* ساده می‌ماند: *de jas is mooi*.'
  nl.a2.unit100.lesson03.teach.hebben:
    title: داشتن چیزها
    gloss: من یک تخت بزرگ دارم. او یک کیف بزرگ دارد. او بوت‌های سرخ دارد. او یک کتاب آبی دارد.
    note: '*Zij* و *ze* هر دو یعنی «او» (برای زن). به پایان‌ها توجه کنید: *groot bed* اما *grote tas*.'
  nl.a2.unit100.lesson03.teach.gn_een:
    title: با een
    gloss: یک کوت سرخ، یک کیف بزرگ؛ یک خانهٔ سرخ، یک تخت بزرگ
    note: بعد از *een*، واژهٔ *de* همان *-e* را نگه می‌دارد (*een rode jas*)، اما واژهٔ *het* پایان نمی‌گیرد (*een rood huis*). پس *het rode huis* اما *een rood huis*.
  nl.a2.unit100.lesson03.teach.gn_zonder:
    title: بدون حرف تعریف
    gloss: کاغذ سفید، کاغذ سرخ؛ کوت‌های سرخ، خانه‌های سرخ، کیف‌های بزرگ
    note: واژهٔ *het* در حالت مفرد و بدون حرف تعریف پایان نمی‌گیرد (*wit papier*). جمع همیشه *-e* می‌گیرد (*rode jassen, rode huizen*)، هر اسمی که باشد.
  nl.a2.unit100.lesson03.teach.gn_contrast:
    title: واژهٔ het یا واژهٔ de؟
    gloss: خانهٔ سرخ ← یک خانهٔ سرخ؛ کوتی سرخ ← یک کوتی سرخ
    note: 'پیش از اسم، فقط یک حالت بدون *-e* می‌آید: واژهٔ مفرد *het* با *een* یا بدون حرف تعریف. در همهٔ حالت‌های دیگر آخرش *-e* می‌آید.'
  nl.a2.unit100.lesson04.teach.materiaal:
    title: جنس
    gloss: ساخته شده از چوب / ساخته شده از پشم / ساخته شده از پنبه / ساخته شده از چرم
    note: برای گفتن اینکه چیزی از چه ساخته شده، *van* و بعد نام جنس را بگویین.
    example_gloss:
    - میز از چوب ساخته شده است.
    - سویتر از پشم ساخته شده است.
    - کیف از چرم ساخته شده است.
    - پتلون از پنبه ساخته شده است.
  nl.a2.unit100.lesson04.teach.bezit:
    title: صاحب
    gloss: من / تو (از تو) / او (مذکر) / او (مؤنث)
    note: '*Je* و *jouw* هر دو برای یک دوست به معنی «ـِ تو» اند.'
    example_gloss:
    - میز کهنهٔ من از چوب ساخته شده است.
    - کوتی نوی تو از پشم ساخته شده است.
    - کتاب کوچک او نو است.
    - کیف بزرگ او سیاه است.
  nl.a2.unit100.lesson04.teach.gn_bezit:
    title: کلمه‌های مالکیت مثل de یا het عمل می‌کنند
    gloss: خانهٔ سرخ من، کیف بزرگ او، کتاب کهنهٔ او، کوتی نوی تو
    note: 'بعد از *mijn، jouw، je، zijn* و *haar* صفت به *-e* ختم می‌شود، حتی برای واژه‌های *het*: *mijn rode huis*، *zijn oude boek*.'
  nl.a2.unit100.lesson04.teach.gn_volgorde:
    title: اندازه، رنگ، جنس
    gloss: یک کیف بزرگ سرخ از چرم؛ خانهٔ کوچک سفید
    note: 'وقتی چند صفت باشد، هر کدام همان پایان را می‌گیرد. اندازه پیش از رنگ می‌آید: *een grote rode tas*. جنس با *van* بعد از اسم می‌آید: *een tas van leer*.'
  nl.a2.unit100.lesson04.teach.zinnen:
    title: دو جمله
    gloss: عمر یک کیف بزرگ سیاه از چرم دارد. سویتر او از پشم ساخته شده است.
  nl.a2.unit100.lesson05.teach.bericht:
    title: نور کیفش را گم می‌کند
    gloss: سلام لوته، کیفم گم شده! یک کیف کوچک سیاه از چرم است. در کیف یک کیف پول سرخ و یک کلید است. کلید خانهٔ من است. شال دراز زردِ پشمی من هم گم شده. چترم سبز و نو است. می‌توانی به من کمک کنی؟ با مهر، نور
    note: 'به پایان‌ها دقت کنید: *kleine zwarte tas*، اما *paraplu is groen*.'
    glosses:
      weg: گم شده
      helpen: کمک کردن
      mij: به من
      Groetjes: با مهر
      zit: است (در)
      Ook: همچنان / هم
  nl.a2.unit100.lesson06.teach.vraag:
    title: عمر می‌پرسد چه شده
    gloss: 'عمر: لوته، چه شده؟'
  nl.a2.unit100.lesson06.teach.jas_kwijt:
    title: لوته می‌گوید کوتی‌اش را گم کرده
    gloss: 'لوته: کوتی‌ام گم شده.'
  nl.a2.unit100.lesson06.teach.wat_voor:
    title: عمر می‌پرسد چه نوع کوتی است
    gloss: 'عمر: چه نوع کوتی است؟'
  nl.a2.unit100.lesson06.teach.beschrijving:
    title: لوته کوتی را توضیح می‌دهد
    gloss: 'لوته: یک کوتی دراز سبز از پشم.'
  nl.a2.unit100.lesson06.teach.oud_of_nieuw:
    title: عمر می‌پرسد کهنه است یا نو
    gloss: 'عمر: کوتی کهنهٔ تو است یا کوتی نوی تو؟'
  nl.a2.unit100.lesson06.teach.nieuwe_jas:
    title: لوته می‌گوید کوتی نو است
    gloss: 'لوته: کوتی نوی من. سبز و خیلی قشنگ است.'
exercises:
  nl.a2.unit100.lesson01.exercise01.kies_rood:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: De jas is rood.
    distractors:
    - De jas is blauw.
    - De jas is groot.
    - De tas is rood.
    accepted_answers:
    - value: De jas is rood.
      status: correct
    feedback: '*Rood* = سرخ، *jas* = کوتی.'
    prompt_blocks:
    - کوت سرخ است.
  nl.a2.unit100.lesson01.exercise02.kies_groot:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: De tafel is groot.
    distractors:
    - De tafel is klein.
    - De stoel is groot.
    - De lamp is groot.
    accepted_answers:
    - value: De tafel is groot.
      status: correct
    feedback: '*Groot* = بزرگ، *tafel* = میز.'
    prompt_blocks:
    - میز بزرگ است.
  nl.a2.unit100.lesson01.exercise03.kleuren:
    instruction: هر رنگ هلندی را با معنی دری‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: rood
        right: سرخ
      - left: blauw
        right: آبی
      - left: groen
        right: سبز
      - left: geel
        right: زرد
      - left: zwart
        right: سیاه
      - left: wit
        right: سفید
      status: correct
    feedback: این‌ها شش رنگ اصلی این درس اند.
    pairs:
    - left: rood
      right: سرخ
    - left: blauw
      right: آبی
    - left: groen
      right: سبز
    - left: geel
      right: زرد
    - left: zwart
      right: سیاه
    - left: wit
      right: سفید
  nl.a2.unit100.lesson01.exercise04.trui:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «سویتر سبز است.»
    correct_option: De trui is groen
    accepted_answers:
    - value: De trui is groen
      status: correct
    feedback: '*De trui is groen*: بعد از *is* پایانی نمی‌آید.'
  nl.a2.unit100.lesson01.exercise05.sjaal:
    instruction: جمله را با کلمهٔ هلندیِ «زرد» کامل کنید.
    correct_option: geel
    accepted_answers:
    - value: geel
      status: correct
    feedback: '*Geel* = زرد، و بعد از *is* پایانی نمی‌آید.'
  nl.a2.unit100.lesson01.exercise06.tas:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: De tas is zwart.
      status: correct
    - value: De tas is zwart
      status: correct
    feedback: '*De tas is zwart.* — کیف سیاه است.'
    prompt_blocks:
    - کیف سیاه است.
  nl.a2.unit100.lesson01.exercise07.bed:
    instruction: جمله را به هلندی بنویسین.
    accepted_answers:
    - value: Het bed is groot.
      status: correct
    - value: Het bed is groot
      status: correct
    feedback: '*Het bed is groot.* *Bed* واژهٔ *het* است.'
    correct_option: Het bed is groot.
    prompt_blocks:
    - تخت بزرگ است.
  nl.a2.unit100.lesson02.exercise01.groene_stoel:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: de groene stoel
    distractors:
    - de groen stoel
    - het groene stoel
    - de stoel groene
    accepted_answers:
    - value: de groene stoel
      status: correct
    feedback: '*Stoel* واژهٔ *de* است و صفت بعد از *de* به *-e* ختم می‌شود: *de groene stoel*.'
    prompt_blocks:
    - چوکی سبز
  nl.a2.unit100.lesson02.exercise02.wit_papier:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: het witte papier
    distractors:
    - het wit papier
    - de witte papier
    - de wit papier
    accepted_answers:
    - value: het witte papier
      status: correct
    feedback: '*Papier* واژهٔ *het* است. بعد از *het* هم صفت به *-e* ختم می‌شود: *het witte papier*.'
    prompt_blocks:
    - کاغذ سفید
  nl.a2.unit100.lesson02.exercise03.vormen:
    instruction: هر صفت را با شکل -eدارش وصل کنید.
    accepted_answers:
    - value:
      - left: rood
        right: rode
      - left: groot
        right: grote
      - left: wit
        right: witte
      - left: geel
        right: gele
      - left: blauw
        right: blauwe
      - left: zwart
        right: zwarte
      status: correct
    feedback: 'به املا دقت کنید: *rode, grote, witte, gele*.'
    pairs:
    - left: rood
      right: rode
    - left: groot
      right: grote
    - left: wit
      right: witte
    - left: geel
      right: gele
    - left: blauw
      right: blauwe
    - left: zwart
      right: zwarte
  nl.a2.unit100.lesson02.exercise04.groot_bed:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «بستر بزرگ کهنه است.»
    correct_option: Het grote bed is oud
    accepted_answers:
    - value: Het grote bed is oud
      status: correct
    feedback: '*Het grote bed* *-e* دارد؛ بعد از *is*، *oud* بدون پایان می‌ماند.'
  nl.a2.unit100.lesson02.exercise05.rood_huis:
    instruction: جمله را با کلمهٔ هلندیِ «سرخ» پیش از اسم کامل کنید.
    correct_option: rode
    accepted_answers:
    - value: rode
      status: correct
    feedback: 'بعد از *het* صفت به *-e* ختم می‌شود: *het rode huis*.'
  nl.a2.unit100.lesson02.exercise06.groot_huis:
    instruction: به هالندی ترجمه کنید.
    accepted_answers:
    - value: Het grote huis is oud.
      status: correct
    - value: Het grote huis is oud
      status: correct
    feedback: '*Het grote huis is oud.* — خانهٔ بزرگ کهنه است.'
    prompt_blocks:
    - خانهٔ بزرگ کهنه است.
  nl.a2.unit100.lesson02.exercise07.nieuwe_lamp:
    instruction: جمله را به هلندی بنویسین.
    accepted_answers:
    - value: De nieuwe lamp is mooi.
      status: correct
    - value: De nieuwe lamp is mooi
      status: correct
    feedback: '*De nieuwe lamp is mooi.* — چراغ نو قشنگ است.'
    correct_option: De nieuwe lamp is mooi.
    prompt_blocks:
    - چراغ نو قشنگ است.
  nl.a2.unit100.lesson03.exercise01.een_rood_huis:
    instruction: عبارت درست هالندی را انتخاب کنید.
    correct_option: een rood huis
    distractors:
    - een rode huis
    - het rood huis
    - een rood huizen
    accepted_answers:
    - value: een rood huis
      status: correct
    feedback: '*Huis* واژهٔ *het* است، پس بعد از *een* پایان *-e* نمی‌آید: *een rood huis*.'
    prompt_blocks:
    - یک خانهٔ سرخ
  nl.a2.unit100.lesson03.exercise02.wit_papier:
    instruction: عبارت درست هالندی را انتخاب کنید.
