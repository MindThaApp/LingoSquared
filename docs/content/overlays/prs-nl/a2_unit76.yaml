    gloss: این هفته هیچ شب آزاد ندارم.
    note: '*Vrije avond* (شام آزاد) از شکل *vrije* استفاده می‌کند، یعنی شکل تصریف‌شدهٔ *vrij* پیش از کلمه‌ای که با *de* می‌آید.'
