  nl.a2.unit76.lesson01.teach.rooster:
    title: برنامه
    gloss: جدول اوقات
    note: '*Het rooster* اسم خنثی (het) است و برای جدول اوقات کاری یا درسی به کار می‌رود.'
    example_gloss: من هر هفته جدول اوقاتم را می‌بینم.
  nl.a2.unit76.lesson01.teach.maandag_woensdag:
    title: گفتن کار روزهای مختلف
    gloss: روز دوشنبه کار می‌کنم و روز چهارشنبه کورس دارم.
    note: '*Op* + نام روز، شکل معمول برای گفتن یک روز مشخص هفته در هلندی است.'
  nl.a2.unit76.lesson01.teach.wat_doe_je:
    title: پرسیدن اینکه کسی در طول هفته معمولاً چه می‌کند
    gloss: تو در طول هفته معمولاً چه کار می‌کنی؟
    note: '*Door de week* (در طول هفته، لفظاً «از میان هفته») روزهای کاری را یکجا نشان می‌دهد و در برابر *het weekend* قرار می‌گیرد.'
  nl.a2.unit76.lesson02.teach.volgorde:
    title: ترتیب
    gloss: ترتیب
    note: '*De volgorde* اسم عام (de) است و برای ترتیبی که کارها در آن اتفاق می‌افتند به کار می‌رود.'
    example_gloss: ترتیب روز من همیشه یکسان است.
  nl.a2.unit76.lesson02.teach.eerst_daarna:
    title: ترتیب دادن با eerst و daarna
    gloss: اول کار می‌کنم، بعد می‌روم ورزش می‌کنم.
    note: '*Eerst* (اول) و *daarna* (بعد از آن) دو رابط ترتیبی بسیار رایج در هلندی اند.'
  nl.a2.unit76.lesson02.teach.ten_slotte:
    title: ترتیب دادن با ten slotte
    gloss: در آخر یک چیزی برای شام می‌پزم.
    note: '*Ten slotte* (در آخر) ترتیبی را می‌بندد که با *eerst* شروع شده و با *daarna* ادامه یافته است.'
  nl.a2.unit76.lesson03.teach.doordeweekse_dag:
    title: روز کاری
    gloss: روز کاری
    note: '*De doordeweekse dag* گروه اسمی عام (de) است و در برابر *het weekend* قرار می‌گیرد.'
    example_gloss: در روز کاری زود بیدار می‌شوم.
  nl.a2.unit76.lesson03.teach.vroeg_op_uitslapen:
    title: مقایسه‌ی روزهای کاری و آخر هفته
    gloss: در طول هفته زود بیدار می‌شوم، اما آخر هفته تا دیر می‌خوابم.
    note: '*Uitslapen* (تا دیر خوابیدن) فعل جداشدنی است؛ *uit* به آخر جمله می‌رود.'
  nl.a2.unit76.lesson03.teach.wat_is_verschil:
    title: پرسیدن درباره‌ی فرق
    gloss: فرق میان روزهای کاری تو و آخر هفته چیست؟
    note: '*Het verschil tussen ... en ...* (فرق میان ... و ...) قالب معمول برای مقایسه است.'
  nl.a2.unit76.lesson04.teach.agenda:
