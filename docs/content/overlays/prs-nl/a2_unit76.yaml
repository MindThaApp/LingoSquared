    gloss: هفته‌ی آینده وقت بیشتر دارم.
    note: '*Volgende week* (هفته‌ی آینده) در برابر *deze week* (این هفته) قرار دارد که پیشتر در همین درس آمده بود.'
  nl.a2.unit76.lesson05.teach.ninas_week:
    title: خواندن درباره‌ی هفته‌ی پرمشغله‌ی Nina
    gloss: هفته‌ی Nina پرمشغله به نظر می‌رسد. روزهای دوشنبه و سه‌شنبه در کتابخانه کار می‌کند. چهارشنبه شب کورس زبان دارد. پنجشنبه با دوستانش ورزش می‌کند و جمعه برای خانواده‌اش آشپزی می‌کند. آخر هفته استراحت می‌کند و کتاب می‌خواند.
    note: '*Ziet er druk uit* (پرمشغله به نظر می‌رسد) از *eruitzien* (به نظر رسیدن) ساخته شده که فعل جداشدنی است؛ *er ... uit* توصیف را در میان می‌گیرد.'
    glosses:
      ziet: به نظر می‌رسد (سوم شخص مفرد zien؛ بخشی از ziet ... uit)
      druk: پرمشغله
      uit: پیشوند جداشدنی در اینجا (ziet...uit = به نظر می‌رسد؛ rust...uit = استراحت می‌کند)
      maandag: دوشنبه
      dinsdag: سه‌شنبه
      werkt: کار می‌کند (سوم شخص مفرد werken)
      bibliotheek: کتابخانه
      woensdagavond: چهارشنبه شب
      heeft: دارد (سوم شخص مفرد hebben)
      taalcursus: کورس زبان
      donderdag: پنجشنبه
      sport: ورزش می‌کند (سوم شخص مفرد sporten)
      vrienden: دوستان
      vrijdag: جمعه
      kookt: آشپزی می‌کند (سوم شخص مفرد koken)
      haar: مال او
      familie: خانواده
      weekend: آخر هفته
      rust: استراحت می‌کند (سوم شخص مفرد rusten)
      leest: می‌خواند (سوم شخص مفرد lezen)
      boek: کتاب
