  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: ساختار Ik vind
    gloss: '*Ik vind* + فصل + صفت می‌گوید که شما دربارهٔ یک فصل چه نظر دارید: من تابستان را دوست دارم.'
    note: این همان ساختار نظر *Ik vind X Y* است که قبلاً آموخته‌اید (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig) — دستور تازه نیست، فقط کاربرد تازهٔ آن است. *vind* اینجا بدون -t می‌آید، چون فاعل *Ik* است (شخص اول)؛ در جملهٔ پرسشی *Welk seizoen vind jij mooi?* هم -t نیست، چون *jij* بعد از فعل می‌آید (وارونگی). شکل شخص سوم *vindt* (مثل *Omar vindt ...*) نکتهٔ دستوری جداگانه و بعدی است که هنوز آموخته نشده.
