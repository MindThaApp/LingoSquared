  nl.a1.unit43.lesson05.teach.tekst:
    title: یک گپ‌وگفت درباره فصل‌ها
    gloss: 'حالا بهار است. تولیپ‌ها قشنگ استند. نینا می‌پرسد: تو کدام فصل را قشنگ می‌دانی؟ عمر می‌گوید: من تابستان را دوست دارم. در تابستان شنا می‌کنیم. لوته می‌گوید: من زمستان را دوست دارم. در زمستان اسکیت می‌کنیم.'
    note: گفتگوی taalcafé در درس چهارم را با نقل قول مستقیم خلاصه می‌کند، مثل خواندنی‌های مقایسه‌ای واحدهای خانه، محله، پست، آشپزی، شخصیت و رنگ‌ها.
