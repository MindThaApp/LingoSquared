    note: '*Bericht* یک پیام کوتاه نوشتاری یا دیجیتالی است، *uitnodiging* کسی را به یک فعالیت یا مراسم دعوت می‌کند، و *taalcafé* (یک کلمهٔ مرکب، با همین آکسان) جای دیدار گروه است.'
