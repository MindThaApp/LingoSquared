    gloss: جمعه ساعت 2:30 قرار بگذاریم؟
    note: این جمله روز هفته از بخش ۳ را با *om* و وقت از بخش ۴ ترکیب می‌کند.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: half drie یعنی ۲:۳۰
    gloss: half drie = ۲:۳۰؛ om half drie وقت قرار را می‌دهد.
    note: 'هالندی به سمت ساعت بعدی می‌شمارد: *half drie* نیمه‌راه تا ساعت سه است، پس یعنی ۲:۳۰. در دری هم «دو و نیم» می‌گوییم، اما در هالندی ساعت بعدی مبنا است.'
