  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: رفتن به سینما
    gloss: رفتن به سینما
    note: '*Naar de film gaan* راه معمولی برای گفتن رفتن به سینما است، بدون اینکه کلمهٔ تازه‌ای برای جای بیاید.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: قهوه بنوشیم؟
    gloss: قهوه بنوشیم؟
    note: '*Zullen we ...?* الگوی معمول هالندی برای پیشنهاد یک کار دسته‌جمعی است.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: استفاده از Zullen we
    gloss: Zullen we + فعالیت؟ راه معمول برای پیشنهاد کردن یک کار باهم است.
    note: 'فعالیت را بعد از *we* بگذارین و فعل را در آخر بیاورید: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: دل داری سینما برویم؟
    gloss: دل داری سینما برویم؟
    note: '*Heb je zin om ...?* به شکل غیررسمی می‌پرسد که طرف مقابل دل دارد کاری را بکند یا نه. اینجا پیش از *gaan* کلمهٔ *te* را بیاورید.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: بلی، چه خوب!
    gloss: بلی، چه خوب!
    note: '*Ja, leuk!* یک قبول کردن کوتاه و پرشور است.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: فکر خوب
    gloss: فکر خوب است!
    note: '*Goed idee!* پیشنهاد را با ارزیابی مثبت قبول می‌کند.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: این برنامهٔ خوب است
    gloss: این برنامهٔ خوب است.
    note: این یک جواب مثبت کمی کامل‌تر است.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: رد کردن با دلیل
    gloss: معذرت، نمی‌توانم، چون کار دارم.
    note: '*Sorry* رد کردن را نرم می‌سازد و *want* دلیل کوتاه را معرفی می‌کند.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: وقت ندارم
    gloss: وقت ندارم.
    note: '*Ik heb geen tijd* دلیل مستقیم اما معمولی برای رد کردن است.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: رد کردن دوستانه
    gloss: Sorry + نمی‌توانم + یک دلیل کوتاه، رد کردن را مهربانانه می‌سازد.
    note: در گپ‌وگفت آوردن دلیل ضروری نیست، اما این نمونه را مفیدتر و مؤدبانه‌تر می‌سازد.
  nl.a1.unit11.lesson03.teach.afspreken:
