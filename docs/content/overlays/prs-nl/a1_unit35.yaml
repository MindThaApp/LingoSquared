  nl.a1.unit35.lesson05.teach.tekst:
    title: کی چه می‌خواند؟
    gloss: ساندر فقط کار نمی‌کند، درس هم می‌خواند. او در مرکز آموزش بزرگسالان کورس زبان هسپانوی می‌گیرد. او هر هفته لغت‌های نو یاد می‌گیرد. فنا در کالج تحصیل می‌کند. او آنجا صحت عامه می‌خواند. هر دوی شان درس خواندن را دوست دارند. شما چه می‌خوانید، یا دوست دارید چه چیزی یاد بگیرین؟
    note: درس‌های ساندر و فنا را با هم مقایسه می‌کند، مثل متن مقایسهٔ بخش تکنالوژی.
    glosses:
