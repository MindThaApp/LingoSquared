teaching:
  nl.a2.unit27.lesson01.teach.huisarts:
    title: داکتر خانوادگی
    gloss: داکتر خانوادگی
    note: 'یک اسم با جنسیت عام: de huisarts، که از درس‌های صحی واحد 16 دوباره آمده است.'
    example_gloss: می‌خواهم از داکتر خانوادگی وقت بگیرم.
  nl.a2.unit27.lesson01.teach.afspraak_huisarts:
    title: درخواست وقت
    gloss: می‌خواهم از داکتر خانوادگی وقت بگیرم.
    note: الگوی afspraak maken از دیدار شاروالی در واحد 24 دوباره آمده، این بار با bij de huisarts.
  nl.a2.unit27.lesson01.teach.reden_bezoek:
    title: منشی دلیل را می‌پرسد
    gloss: دلیل مراجعه شما چیست؟
    note: یک پرسش رسمی معمول هنگام گرفتن وقت داکتر.
  nl.a2.unit27.lesson01.teach.paar_dagen_niet_lekker:
    title: گفتن اینکه چند وقت است احساس ناخوشی دارید
    gloss: چند روز است که احساس خوبی ندارم.
    note: Al een paar dagen (چند روز است) عبارت voel me niet lekker واحد 16 را با مدت زمان گسترش می‌دهد.
  nl.a2.unit27.lesson02.teach.klachten:
    title: علایم / شکایت‌ها
    gloss: علایم / شکایت‌ها
    note: 'یک اسم جمع با جنسیت عام: de klachten، اصطلاح معمول طبی برای علایم.'
    example_gloss: علایم شما چیست؟
  nl.a2.unit27.lesson02.teach.wat_zijn_klachten:
    title: داکتر از علایم می‌پرسد
    gloss: علایم شما چیست؟
    note: پرسش رسمی آغاز یک مشورت.
  nl.a2.unit27.lesson02.teach.drie_dagen_klachten:
    title: بیان علایم همراه با مدت
    gloss: سه روز است که سردرد و تب دارم.
    note: Al drie dagen (سه روز است) با زمان حال heb می‌آید تا علامه‌ای را که ادامه دارد بیان کند، مثل ساختار sinds vorige maand در واحد 24.
  nl.a2.unit27.lesson02.teach.hoe_erg_pijn:
    title: پرسیدن درباره شدت
    gloss: درد چقدر شدید است؟
    note: Hoe erg (چقدر شدید) درباره شدت می‌پرسد؛ یک پرسش بعدی طبیعی.
  nl.a2.unit27.lesson03.teach.griepje:
    title: انفلونزای خفیف
    gloss: یک انفلونزای خفیف / زکام
    note: 'یک اسم خنثی: het griepje، شکل تصغیر griep (انفلونزا) -- تصغیر آن را سبک می‌کند، یعنی مریضی کوچک، نه جدی.'
    example_gloss: احتمالاً یک انفلونزای خفیف دارید.
  nl.a2.unit27.lesson03.teach.waarschijnlijk_griepje:
    title: دادن تشخیص احتمالی
    gloss: احتمالاً یک انفلونزای خفیف دارید.
    note: Waarschijnlijk (احتمالاً) تشخیص را به شکل مناسب نرم می‌کند، چون داکتر پیش از معاینه‌های بیشتر صحبت می‌کند.
  nl.a2.unit27.lesson03.teach.niet_ernstig:
    title: اطمینان دادن درباره شدت
    gloss: جدی نیست.
    note: Ernstig (جدی) صفت کلیدی برای بیان شدت یک مریضی است.
  nl.a2.unit27.lesson03.teach.geen_zorgen_formeel:
    title: اطمینان دادن به شکل رسمی
    gloss: غم نخور.
    note: برابر رسمی maak je geen zorgen غیررسمی در واحد 21، با u/zich به جای je.
  nl.a2.unit27.lesson04.teach.recept:
    title: نسخه
    gloss: نسخه
    note: 'یک اسم خنثی: het recept.'
    example_gloss: برایتان دوا می‌نویسم.
  nl.a2.unit27.lesson04.teach.schrijf_voor:
    title: داکتر دوا می‌نویسد
    gloss: برایتان دوا می‌نویسم.
    note: Voorschrijven (نسخه نوشتن) یک فعل جداشدنی است؛ voor به آخر جمله می‌رود.
  nl.a2.unit27.lesson04.teach.pillen_innemen:
    title: خوردن دوا
    gloss: گولی‌ها را روزی دو بار بخورید و خوب استراحت کنید.
    note: Innemen (دوا خوردن) یک فعل جداشدنی است و با nemen به تنهایی فرق دارد؛ in به آخر جمله می‌رود.
  nl.a2.unit27.lesson04.teach.terugkomen_als:
    title: یک هدایت بعدی شرطی
    gloss: اگر بهتر نشد، بعد از یک هفته دوباره بیایین.
    note: Als (اگر) شرط را معرفی می‌کند؛ terugkomen (دوباره آمدن) فعل جداشدنی است و terug در آخر جمله می‌آید.
  nl.a2.unit27.lesson04.teach.infinitives_note:
    title: شکل‌های مصدر
    gloss: قرص‌ها را خوردن و دوباره آمدن، مصدرهای این دو فعل جداشدنی اند.
    note: Innemen و terugkomen شکل‌های مصدر (شکل اصلی در قاموس) اند و با شکل‌های امری صرف‌شده (neem ... in, kom ... terug) که در جاهای دیگر این درس آمده فرق دارند.
  nl.a2.unit27.lesson05.teach.samenvatting:
    title: خواندن خلاصهٔ معاینه
    gloss: 'تشخیص: انفلوانزای خفیف. مشوره: خوب استراحت کنید و آب زیاد بنوشید. قرص‌های تجویزشده را روزی دو بار بخورید. بعد از یک هفته هم هنوز بهتر نشده‌اید؟ پس وقت ملاقات تازه بگیرین.'
    note: تشخیص، دو مشورهٔ مربوط به شیوهٔ زندگی، هدایت دوا و شرط مراجعهٔ بعدی را دنبال کنید.
    glosses:
      Diagnose: تشخیص
      griepje: یک انفلوانزای خفیف (شکل کوچک‌شدهٔ griep که آن را سبک‌تر نشان می‌دهد)
      Advies: نصیحت
      rust: استراحت کن (امر؛ با 'uit' = استراحت کردن)
      uit: جزء جداشدنی 'rust uit' = استراحت کردن
      drink: بنوش (امر drinken)
      veel: زیاد، بسیار
      Neem: بگیر، بخور (امر nemen)
      voorgeschreven: تجویزشده (صفت مفعولی voorschrijven)
      pillen: قرص‌ها
      keer: بار ('twee keer' = دو بار)
      dag: روز ('per dag' = در هر روز)
      in: جزء جداشدنی 'innemen' = خوردن دوا
      Voelt: احساس کردن ('Voelt u zich' = آیا احساس می‌کنین)
      zich: خود (ضمیر انعکاسی)
      na: بعد از
      nog: هنوز (در 'nog steeds' = هنوز هم)
      steeds: هنوز (در 'nog steeds' = هنوز هم)
      beter: بهتر
      Maak: بگیر، بساز (امر maken)
      dan: پس، آن وقت
      nieuwe: نو
      afspraak: وقت ملاقات
  nl.a2.unit27.lesson06.teach.huisarts_ask_symptoms:
    title: داکتر معاینه را آغاز می‌کند
    gloss: 'داکتر: صبح بخیر، چه شکایتی دارید؟'
    note: سؤال wat zijn uw klachten? از درس دوم دوباره آمده است.
  nl.a2.unit27.lesson06.teach.omar_symptoms:
    title: Omar علایم مریضی‌اش را شرح می‌دهد
    gloss: 'Omar: سه روز است که سردرد و تب دارم.'
    note: دقیقاً با مثال آموزشی درس دوم یکی است -- این معاینهٔ واقعی Omar است.
  nl.a2.unit27.lesson06.teach.huisarts_react_diagnose:
    title: داکتر واکنش نشان می‌دهد و تشخیص می‌دهد
    gloss: 'داکتر: ناراحت‌کننده است. احتمالاً انفلوانزای خفیف دارید.'
    note: Klinkt (به نظر می‌رسد) همان الگوی dat klinkt fijn واحد ۱۸ است، اینجا با vervelend (ناخوشایند).
  nl.a2.unit27.lesson06.teach.omar_ask_serious:
    title: Omar می‌پرسد که جدی است یا نه
    gloss: 'Omar: جدی است؟'
    note: یک سؤال کوتاه و مستقیم با ernstig (جدی) از درس سوم.
  nl.a2.unit27.lesson06.teach.huisarts_reassure_prescribe:
    title: داکتر اطمینان می‌دهد و نسخه می‌نویسد
    gloss: 'داکتر: نه، جدی نیست. برای تان نسخه می‌نویسم.'
    note: اطمینان‌دهیِ درس سوم با الگوی نسخه نوشتنِ درس چهارم یکجا شده است.
  nl.a2.unit27.lesson06.teach.omar_thanks_doctor:
    title: Omar از داکتر تشکر می‌کند
    gloss: 'Omar: تشکر، داکتر صاحب.'
    note: Dokter شیوهٔ معمول و کمی غیررسمی برای خطاب مستقیم به داکتر است و با huisarts (عنوان حرفه‌ای) فرق دارد.
  nl.a2.unit27.lesson06.teach.huisarts_final_instructions:
    title: داکتر آخرین هدایات را می‌دهد
    gloss: 'داکتر: قرص‌ها را روزی دو بار بخورید و خوب استراحت کنید. غصه نخورید.'
    note: هدایت دوا از درس چهارم با اطمینان‌دهی رسمی درس سوم یکجا شده است.
  nl.a2.unit27.lesson06.teach.summary_grammar:
    title: خلاصهٔ معاینه
    gloss: Omar انفلوانزای خفیف دارد. او باید قرص‌ها را روزی دو بار بخورد.
    note: moet + مصدر (moet ... innemen) ضرورت را بیان می‌کند و جزء in در آخر جمله، پیش از innemen نمی‌رود بلکه به آن چسبیده می‌ماند.
