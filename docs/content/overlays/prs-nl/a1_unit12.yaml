teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: گذشتهٔ روزمرهٔ هلندی
    gloss: در گفتگو، برای رویداد تمام‌شده معمولاً hebben یا zijn همراه با اسم مفعول می‌آید.
    note: در هلندیِ گفتاری، برای گفتن آنچه گذشته است معمولاً همین شکل ماضی نقلی به کار می‌رود. *Ik heb koffie gedronken* هم «من قهوه نوشیدم» معنا می‌دهد و هم «من قهوه نوشیده‌ام».
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: من قهوه نوشیدم
    gloss: نوشیدن ← من قهوه نوشیدم.
    note: '*Heb* فعل کمکی است و *gedronken* اسم مفعولِ *drinken* است.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: من به سوپرمارکیت رفتم
    gloss: رفتن ← من به سوپرمارکیت رفتم.
    note: '*Gaan* با *zijn* می‌آید: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: اسم مفعول در آخر می‌آید
    gloss: 'اسم مفعول در آخر جمله می‌آید: Ik heb koffie gedronken. به جای op در آخر Ik sta op فکر کنید.'
    note: در درس ۱۰ یاد گرفتید که به عنصر مهمِ آخر جمله گوش کنید. اینجا عنصر آخر، اسم مفعول است.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: بیشتر فعل‌ها hebben می‌گیرند
    gloss: بیشتر فعل‌ها hebben می‌گیرند.
    note: در این درس، *hebben* را با *drinken*، *eten*، *werken* و *kopen* به کار ببرید.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken با hebben
    gloss: نوشیدن ← من قهوه نوشیدم.
    note: 'الگوی کامل این است: *ik + heb + مفعول + gedronken*.'
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten با hebben
    gloss: خوردن ← من نان خوردم.
    note: اسم مفعولِ *eten*، *gegeten* است.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken با hebben
    gloss: کار کردن ← من کار کردم.
    note: اسم مفعولِ *werken*، *gewerkt* است.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen با hebben
    gloss: خریدن ← من سیب خریدم.
    note: اسم مفعولِ *kopen*، *gekocht* است.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan و komen با zijn می‌آیند
    gloss: با gaan و komen، zijn به کار ببرید.
    note: این دو فعل حرکتیِ رایج، در ساختار رویداد تمام‌شده که اینجا یاد می‌گیرین، *zijn* می‌گیرند نه *hebben*.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan با zijn
    gloss: رفتن ← من به سوپرمارکیت رفتم.
    note: با *ik* از *ben* استفاده کن و *gegaan* را در آخر جمله بگذار.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen با zijn
    gloss: آمدن ← من به کافهٔ زبان آمدم.
    note: با *ik* از *ben* استفاده کن و *gekomen* را در آخر جمله بگذار.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: مقایسهٔ فعل‌های کمکی
    gloss: من کار کردم، ولی به سوپرمارکیت رفتم.
    note: '*Werken* با *hebben* می‌آید؛ *gaan* با *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: دیروز، امروز صبح
    gloss: دیروز، امروز صبح
    note: '*Gisteren* روز پیش از امروز را نشان می‌دهد؛ *vanmorgen* به صبح امروز اشاره دارد.'
    example_gloss:
    - دیروز کار کردم.
    - امروز صبح ساعت هشت قهوه نوشیدم.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: دیروز کار کردم
    gloss: دیروز کار کردم.
    note: وقتی جمله با *gisteren* شروع شود، *heb* پیش از *ik* می‌آید.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: قهوه امروز صبح
    gloss: امروز صبح ساعت هشت قهوه نوشیدم.
    note: اینجا *om acht uur* از سیستم ساعت درس ۴ دوباره آمده است.
  nl.a1.unit12.lesson04.teach.time_order:
    title: قید زمان در اول، ترتیب جمله را تغییر می‌دهد
    gloss: 'بعد از Gisteren یا Vanmorgen، فعل پیش از ik می‌آید: Gisteren heb ik ...'
    note: 'این همان ترتیبی است که در درس ۱۰ بعد از *daarna* دیدیم: فعل پیش از *ik*.'
  nl.a1.unit12.lesson05.teach.recent_text:
    title: گزارش یک واقعهٔ نزدیک
    gloss: امروز صبح به سوپرمارکت رفتم. سیب خریدم. بعد از آن به کافهٔ زبان رفتم. آنجا قهوه نوشیدم.
    note: متن را بخوانین و به یک اشارهٔ زمانی، جاها و هر کار انجام‌شده توجه کنید.
    glosses:
      Vanmorgen: امروز صبح
      supermarkt: سوپرمارکیت
      gegaan: رفته / رفتم
      appels: سیب‌ها
      gekocht: خریده / خریدم
      Daarna: بعد از آن
      taalcafé: کافهٔ زبان
      Daar: آنجا
      koffie: قهوه
      gedronken: نوشیده / نوشیدم
  nl.a1.unit12.lesson06.teach.question:
    title: دیروز چه کار کردی؟
    gloss: 'لوته: دیروز چه کار کردی، عمر؟'
    note: '*Wat heb je ... gedaan?* سوال عادیِ غیررسمی برای پرسیدن از کار انجام‌شدهٔ کسی است.'
  nl.a1.unit12.lesson06.teach.answer:
    title: سه کار عمر
    gloss: 'عمر: کار کردم. بعد به سوپرمارکت رفتم. سیب خریدم.'
    note: جواب، سه کار ساده و انجام‌شده را در جمله‌های جداگانه می‌گوید.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: و امروز صبح؟
    gloss: 'لوته: و امروز صبح چه کار کردی؟'
    note: '*gisteren* را با *vanmorgen* عوض کنید تا دربارهٔ زمان نزدیک دیگری بپرسین.'
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: عمر به کافهٔ زبان آمد
    gloss: 'عمر: امروز صبح ساعت هشت به کافهٔ زبان آمدم.'
    note: '*Komen* با *zijn* می‌آید: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: لوته قهوه نوشید
    gloss: 'لوته: خوب است. من امروز صبح قهوه نوشیدم.'
    note: '*Drinken* با *hebben* می‌آید: *heb ... gedronken*.'
