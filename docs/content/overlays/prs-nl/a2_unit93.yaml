course:
  title: هالندی A2
  description: دستور زبان هالندی سطح A2 برای ترتیب دادن رویدادها با voordat، nadat، wanneer و als.
  learning_goal: رویدادها را با جمله‌های «قبل از»، «بعد از» و «وقتی» ترتیب بدهین، با فعل در آخر جملهٔ پیرو و جابه‌جایی در جملهٔ اصلی.
units:
  nl.a2.unit93.voordat_nadat_wanneer:
    title: قبل، بعد، وقتی
    description: رویدادهای روزمره و سفر را با voordat، nadat، wanneer و als ترتیب بدهین.
lessons:
  nl.a2.unit93.lesson01.voordat_ik_ga:
    title: قبل از رفتن
  nl.a2.unit93.lesson02.nadat_ik_gegeten_heb:
    title: بعد از غذا خوردن
  nl.a2.unit93.lesson03.voordat_of_nadat:
    title: Voordat یا nadat؟
  nl.a2.unit93.lesson04.wanneer_en_als:
    title: Wanneer و als
  nl.a2.unit93.lesson05.een_reisdag:
    title: یک روز سفر
  nl.a2.unit93.lesson06.lotte_en_omar:
    title: لوته و عمر برای سفر پلان می‌گیرند
teaching:
  nl.a2.unit93.lesson01.teach.dagelijks:
    title: کارهای روزمره
    gloss: دوش گرفتن / ناشتا کردن / خوردن / پختن / جمع‌وجور کردن / زنگ زدن
    note: '*Opruimen* فعل جداشدنی است: *ik ruim op*.'
    example_gloss:
    - من دوش می‌گیرم و ناشتا می‌کنم.
    - من یک ساندویچ می‌خورم و چای می‌نوشم.
    - من آشپزی می‌کنم و آشپزخانه را جمع‌وجور می‌کنم.
    - من به لوته زنگ می‌زنم.
  nl.a2.unit93.lesson01.teach.plaatsen:
    title: جاها و وقت‌ها
    gloss: کار / به خانه (جهت) / در خانه / دکان / به بستر
    note: '*Naar huis* جهت را نشان می‌دهد؛ *thuis* نشان می‌دهد که شما کجا استین.'
    example_gloss:
    - من سر کار می‌روم.
    - من به خانه می‌روم.
    - من ساعت شش در خانه هستم.
    - من به دکان می‌روم.
    - من ساعت یازده می‌خوابم.
  nl.a2.unit93.lesson01.teach.voordat:
    title: Voordat
    gloss: پیش از
    note: '*Voordat* رویدادی را معرفی می‌کند که دوم اتفاق می‌افتد.'
    example_gloss:
    - پیش از آن که غذا بخورم، به لوته زنگ می‌زنم.
    - قبل از اینکه آشپزی کنم، به دکان می‌روم.
    - پیش از آن که بخوابم، چای می‌نوشم.
  nl.a2.unit93.lesson01.teach.gn_voordat:
    title: Voordat با فعل در آخر جمله
    gloss: قبل از اینکه سر کارم بروم، ناشتا می‌کنم.
    note: 'بعد از *voordat* فعل صرف‌شده به آخر جمله می‌رود: *ik naar mijn werk ga*.'
  nl.a2.unit93.lesson01.teach.gn_inversie:
    title: جابه‌جایی بعد از جمله‌ی آغازین
    gloss: بعد از voordat فعل در آخر می‌آید. اگر جمله‌ی پیرو اول بیاید، جمله‌ی اصلی با فعل صرف‌شده شروع می‌شود و بعد فاعل می‌آید.
    note: 'ویرگول جمله‌ی پیرو را می‌بندد. بعد جمله‌ی اصلی با فعل شروع می‌شود: *ontbijt ik*، نه *ik ontbijt*.'
  nl.a2.unit93.lesson01.teach.zinnen:
    title: دو جمله با voordat
    gloss: پیش از آن که ناشتا کنم، دوش می‌گیرم. پیش از آن که به خانه بروم، به لوته زنگ می‌زنم.
  nl.a2.unit93.lesson02.teach.deelwoorden:
    title: صفت‌های مفعولی
    gloss: خوردن – خورده؛ پختن – پخته؛ دوش گرفتن – دوش گرفته؛ زنگ زدن – زنگ زده؛ کار کردن – کار کرده؛ جمع‌وجور کردن – جمع‌وجور کرده
    note: 'فعل‌های باقاعده صفت مفعولی را با *ge-* و *-t* یا *-d* می‌سازند؛ *eten* بی‌قاعده است (*gegeten*)؛ در *opruimen* پیشوند *ge* در وسط می‌آید: *opgeruimd*.'
    example_gloss:
    - من خورده‌ام.
    - من پخته‌ام.
    - من به لوته زنگ زده‌ام.
    - من کار کرده‌ام و دوش گرفته‌ام.
    - من آشپزخانه را جمع‌وجور کرده‌ام.
  nl.a2.unit93.lesson02.teach.aankomen:
    title: رسیدن
    gloss: رسیدن – رسیده
    note: '*Aankomen* فعل جداشدنی است: *ik kom aan*.'
    example_gloss:
    - من ساعت شش می‌رسم.
    - من ساعت شش رسیدم.
  nl.a2.unit93.lesson02.teach.nadat:
    title: Nadat
    gloss: بعد از آن که
    note: '*Nadat* رویدادی را معرفی می‌کند که اول اتفاق افتاده است.'
    example_gloss:
    - بعد از اینکه غذا خوردم، جمع‌وجور می‌کنم.
    - بعد از آن که کار کردم، دوش می‌گیرم.
    - بعد از آن که پختم، غذا می‌خورم.
  nl.a2.unit93.lesson02.teach.gn_nadat:
    title: Nadat با زمان ماضی نقلی
    gloss: بعد از اینکه غذا خوردم، جمع‌وجور می‌کنم.
    note: 'بعد از *nadat* ماضی نقلی می‌آید و هر دو فعل در آخر جمله قرار می‌گیرند: *gegeten heb*.'
  nl.a2.unit93.lesson02.teach.gn_nadat_regel:
    title: قاعده‌ی nadat
    gloss: بعد از nadat ماضی نقلی (با زمان حال کمکی) به کار می‌رود. صفت مفعولی و heb در آخر می‌آیند. بعد جمله‌ی اصلی با فعل صرف‌شده شروع می‌شود.
    note: 'جابه‌جایی مثل بعد از *voordat* کار می‌کند: *Nadat ik gegeten heb, ruim ik op* (نه *ik ruim op*).'
  nl.a2.unit93.lesson02.teach.gn_volgorde:
    title: دو ترتیب ممکن برای فعل‌ها
    gloss: 'این هم درست است: بعد از آن که غذا خوردم، جمع‌وجور می‌کنم.'
    note: در جمله‌ی پیرو هم *gegeten heb* درست است و هم *heb gegeten*. در این بخش بیشتر *gegeten heb* آمده است.
  nl.a2.unit93.lesson02.teach.gn_aankomen:
    title: Ben با aankomen
    gloss: بعد از اینکه رسیدم، به لوته زنگ می‌زنم.
    note: '*Aankomen* با *zijn* می‌آید، نه با *hebben*: *aangekomen ben*.'
  nl.a2.unit93.lesson03.teach.reis_woorden:
    title: واژه‌های سفر
    gloss: ریل / ستیشن / تکت / بکس
    note: '*Het kaartje* تکت ریل است.'
    example_gloss:
    - ریل در ایستگاه است.
    - من یک تکت می‌خرم.
    - بکس من آماده است.
  nl.a2.unit93.lesson03.teach.reis_werkwoorden:
    title: فعل‌های سفر
    gloss: حرکت کردن – حرکت کرده؛ بسته‌بندی کردن – بسته‌بندی کرده؛ خریدن – خریده
    note: '*Vertrekken* با *zijn* می‌آید (*vertrokken ben*)؛ *inpakken* و *kopen* با *hebben* می‌آیند. *Inpakken* جداشدنی است: *ik pak in*.'
    example_gloss:
    - ریل ساعت نه حرکت می‌کند.
    - من ساعت نه حرکت می‌کنم.
    - من بکسم را بسته‌بندی می‌کنم.
    - من یک تکت خریده‌ام.
  nl.a2.unit93.lesson03.teach.gn_voordat_reis:
    title: 'Voordat: رویداد دوم'
    gloss: پیش از آن که حرکت کنم، بکسم را بسته‌بندی می‌کنم.
    note: 'جمله‌ی *voordat* رویداد دومی است: اول بسته‌بندی، بعد حرکت.'
  nl.a2.unit93.lesson03.teach.gn_nadat_reis:
    title: 'Nadat: رویداد اول'
    gloss: بعد از آن که بکسم را بسته‌بندی کردم، حرکت می‌کنم.
    note: 'جمله‌ی *nadat* رویداد اولی است: اول بسته‌بندی، بعد حرکت. ترتیب رویدادها مثل پیش است، فقط حرف ربط فرق دارد.'
  nl.a2.unit93.lesson03.teach.gn_vergelijk:
    title: voordat یا nadat
    gloss: Voordat رویدادی را نام می‌برد که بعداً می‌آید. Nadat رویدادی را نام می‌برد که پیشتر می‌آید.
    note: از خود بپرسین کدام رویداد در زمان اول است. در زمان حال، در این بخش بعد از *nadat* ماضی نقلی و بعد از *voordat* زمان حال ساده می‌آید.
  nl.a2.unit93.lesson03.teach.gn_hoofdzin_eerst:
    title: اول جمله‌ی اصلی
    gloss: من بکسم را بسته‌بندی می‌کنم، پیش از آن که حرکت کنم.
    note: 'اگر جمله‌ی اصلی اول بیاید، جابه‌جایی نداریم: *Ik pak ...*، و جمله‌ی پیرو با فعل در آخر دنبال آن می‌آید.'
  nl.a2.unit93.lesson03.teach.gn_had:
    title: Nadat در قصه‌ای از گذشته
    gloss: بعد از آن که غذا خورده بودم، به لوته زنگ زدم.
    note: 'در قصه‌ای از گذشته، *had* جای *heb* می‌آید (و *was* جای *ben*): *gegeten had*. جمله‌ی اصلی هم در گذشته است (*belde*).'
  nl.a2.unit93.lesson04.teach.toestand:
    title: خسته، زود، دیر، گرسنه
    gloss: خسته / زود / دیر / گرسنگی
    note: '*Honger hebben* یعنی گرسنه بودن.'
    example_gloss:
    - من خسته استم.
    - من زود می‌خوابم.
    - من دیر به خانه می‌آیم.
    - من گشنه استم.
  nl.a2.unit93.lesson04.teach.gewoonte:
    title: عادت‌ها
    gloss: به خانه آمدن / بایسکل / گرفتن / باران آمدن
    note: '*Thuiskomen* جداشدنی است: *ik kom thuis*؛ در جمله‌ی پیرو یک کلمه است: *als ik thuiskom*.'
    example_gloss:
    - من ساعت شش به خانه می‌آیم.
    - من بایسکل می‌گیرم.
    - من بس می‌گیرم.
    - باران می‌آید.
  nl.a2.unit93.lesson04.teach.wanneer_als:
    title: Wanneer و als
    gloss: هر وقت / وقتی
    note: 'در این کاربرد *wanneer* و *als* یک معنا دارند: هر وقت چیزی بارها تکرار می‌شود.'
    example_gloss:
    - هر وقت خسته می‌شوم، زود می‌خوابم.
    - وقتی گرسنه استم، یک ساندویچ می‌خورم.
    - هر وقت باران می‌بارد، بس می‌گیرم.
  nl.a2.unit93.lesson04.teach.gn_als:
    title: Als با زمان حال
    gloss: وقتی خسته استم، زود می‌خوابم.
    note: 'عادت در زمان حال می‌آید. فعل به آخر جمله می‌رود: *ik moe ben*.'
  nl.a2.unit93.lesson04.teach.gn_wanneer_regel:
    title: قاعده‌ی wanneer و als
    gloss: با wanneer یا als می‌گویید چه چیزی بارها اتفاق می‌افتد، یا چه چیزی بعداً اتفاق می‌افتد. فعل در آخر می‌آید و جمله‌ی اصلی با فعل صرف‌شده شروع می‌شود.
    note: 'دقت کنید: *als* می‌تواند معنای *اگر* هم بدهد. *Wanneer* فقط معنای *وقتی* دارد.'
  nl.a2.unit93.lesson04.teach.gn_toen:
    title: Toen در برابر als
    gloss: وقتی به خانه آمدم، لوته زنگ زد. وقتی به خانه می‌رسم، به لوته زنگ می‌زنم.
    note: '*Toen* به یک لحظه در گذشته تعلق دارد و با گذشته‌ی ساده می‌آید. *Wanneer* و *als* به عادت‌ها و زمان حال تعلق دارند.'
  nl.a2.unit93.lesson04.teach.gn_toen_regel:
    title: انتخاب toen یا wanneer
    gloss: toen را برای یک لحظه در گذشته به کار می‌برید. wanneer یا als را برای عادت یا زمان حال به کار می‌برید.
    note: Toen در بخش پیشین آموزش داده شد؛ این فقط یک یادآوری کوتاه است.
  nl.a2.unit93.lesson05.teach.lezen:
    title: روز سفر نور
    gloss: نور فردا با ریل می‌رود. پیش از آن که حرکت کند، بکسش را بسته‌بندی می‌کند. بعد از آن که بکسش را بسته‌بندی کرد، ناشتا می‌کند. او به ستیشن می‌رود و یک تکت می‌خرد. پیش از آن که ریل حرکت کند، قهوه می‌نوشد. وقتی می‌رسد، به لوته زنگ می‌زند.
    note: 'ترتیب رویدادها را دنبال کنید: کدام جمله می‌گوید چه چیزی اول می‌آید؟'
    glosses:
      morgen: فردا
      met: با
      pakt: بسته‌بندی می‌کند
      heeft: دارد
      koopt: می‌خرد
      drinkt: می‌نوشد
      koffie: قهوه
      aankomt: می‌رسد
      belt: تیلفون می‌کند
      haar: او (ملکیت)
  nl.a2.unit93.lesson06.teach.lotte_vertrek:
    title: Lotte دربارهٔ فردا می‌پرسد
    gloss: 'Lotte: سلام Omar، فردا ساعت چند حرکت می‌کنی؟'
  nl.a2.unit93.lesson06.teach.omar_koffer:
    title: Omar برنامه‌اش را می‌گوید
    gloss: 'Omar: ساعت نُه. قبل از اینکه حرکت کنم، بکسم را بسته می‌کنم.'
  nl.a2.unit93.lesson06.teach.lotte_bel:
    title: Lotte زنگ زدن می‌خواهد
    gloss: 'Lotte: بعد از اینکه رسیدی، به من زنگ می‌زنی؟'
  nl.a2.unit93.lesson06.teach.omar_ja:
    title: Omar موافقت می‌کند
    gloss: 'Omar: بلی، بعد از اینکه رسیدم، به تو زنگ می‌زنم.'
  nl.a2.unit93.lesson06.teach.lotte_te_laat:
    title: Lotte دربارهٔ تأخیر می‌پرسد
    gloss: 'Lotte: اگر قطار دیر کند، چه کار می‌کنی؟'
  nl.a2.unit93.lesson06.teach.omar_koffie:
    title: Omar جواب می‌دهد
    gloss: 'Omar: اگر قطار دیر کند، قهوه می‌نوشم.'
exercises:
  nl.a2.unit93.lesson01.exercise01.kies_werk:
    instruction: جملهٔ هالندی «قبل از اینکه به کارم بروم، ناشتا می‌کنم.» را انتخاب کنید.
    correct_option: Voordat ik naar mijn werk ga, ontbijt ik.
    distractors:
    - Voordat ik naar mijn werk ga, ik ontbijt.
    - Voordat ik ga naar mijn werk, ontbijt ik.
    - Voordat ik ontbijt, ga ik naar mijn werk.
    accepted_answers:
    - value: Voordat ik naar mijn werk ga, ontbijt ik.
      status: correct
    feedback: 'بعد از جملهٔ فرعی که با *voordat* شروع می‌شود، جملهٔ اصلی با فعل شروع می‌شود: *ontbijt ik*. گزینهٔ آخر ترتیب کارها را برعکس می‌گذارد.'
    prompt_blocks:
    - قبل از اینکه سر کارم بروم، ناشتا می‌کنم.
  nl.a2.unit93.lesson01.exercise02.kies_douche:
    instruction: جملهٔ درست هالندی را برای «قبل از اینکه ناشتا کنم، دوش می‌گیرم.» انتخاب کنید.
    correct_option: Voordat ik ontbijt, douche ik.
    distractors:
    - Voordat ik ontbijt, ik douche.
    - Voordat ontbijt ik, douche ik.
    - Voordat ik douche, ontbijt ik.
    accepted_answers:
    - value: Voordat ik ontbijt, douche ik.
      status: correct
    feedback: '*Voordat ik ontbijt, douche ik* = قبل از اینکه ناشتا کنم، دوش می‌گیرم. گزینهٔ آخر ترتیب کارها را برعکس می‌کند.'
    prompt_blocks:
    - قبل از اینکه ناشتا کنم، دوش می‌گیرم.
  nl.a2.unit93.lesson01.exercise03.match_voordat:
    instruction: هر جملهٔ فرعی هالندی با voordat را با معنای دری‌اش جور کنید.
    accepted_answers:
    - value:
      - left: voordat ik ontbijt
        right: قبل از اینکه ناشتا کنم
      - left: voordat ik naar mijn werk ga
        right: قبل از اینکه سر کار بروم
      - left: voordat ik kook
        right: قبل از اینکه آشپزی کنم
      - left: voordat ik naar bed ga
        right: قبل از اینکه بخوابم
      - left: voordat ik naar huis ga
        right: قبل از اینکه به خانه بروم
      - left: voordat ik Lotte bel
        right: قبل از اینکه به لوته زنگ بزنم
      status: correct
    feedback: در هر جملهٔ فرعی با voordat، فعل در آخر می‌آید.
    pairs:
    - left: voordat ik ontbijt
      right: قبل از اینکه ناشتا کنم
    - left: voordat ik naar mijn werk ga
      right: قبل از اینکه سر کار بروم
    - left: voordat ik kook
      right: قبل از اینکه آشپزی کنم
    - left: voordat ik naar bed ga
      right: قبل از اینکه بخوابم
    - left: voordat ik naar huis ga
      right: قبل از اینکه به خانه بروم
    - left: voordat ik Lotte bel
      right: قبل از اینکه به لوته زنگ بزنم
  nl.a2.unit93.lesson01.exercise04.order_douche:
    instruction: کلمه‌ها را طوری ترتیب کنید که بگویین «قبل از اینکه ناشتا کنم، دوش می‌گیرم.»
    correct_option: Voordat ik ontbijt douche ik
    accepted_answers:
