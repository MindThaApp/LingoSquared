  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar، Fenna و Sander دربارهٔ حیوانات
    gloss: 'Omar و Fenna هر دو حیوانات را دوست دارند، اما هیچ‌کدام‌شان حیوان خانگی ندارد. Omar سگ‌ها را دوست دارد و Fenna گربه‌ها را. Sander حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      houden: خیلی دوست دارند
      allebei: هر دو
      dieren: حیوانات
      beiden: هر دو
      huisdier: حیوان خانگی
      honden: سگ‌ها
      katten: پشک‌ها
      kat: پشک
      speelt: بازی می‌کند
      geeft: می‌دهد
      elke: هر
      eten: غذا
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander اکثراً با گربه‌اش بازی می‌کند
    gloss: Sander اکثراً با گربه‌اش بازی می‌کند.
    note: '*vaak* (اکثراً) که قبلاً در یک واحد پیشین برای کارهای روزمرهٔ Omar آمده بود، دوباره به کار می‌رود.'
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
