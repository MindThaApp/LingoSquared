teaching:
  nl.a2.unit24.lesson01.teach.inschrijven:
    title: ثبت‌نام کردن
    gloss: ثبت‌نام کردن
    note: 'یک فعل بازتابی و جداشدنی: zich inschrijven. ضمیر بازتابی با فاعل تغییر می‌کند (me, je, zich, ...).'
    example_gloss: می‌خواهم در شاروالی ثبت‌نام کنم.
  nl.a2.unit24.lesson01.teach.afspraak_maken:
    title: درخواست وقت ملاقات
    gloss: می‌خواهم برای ثبت‌نام وقت ملاقات بگیرم.
    note: ساختار om ... te + مصدر مقصود را بیان می‌کند («برای اینکه»)؛ در me in te schrijven فعل جداشدنی inschrijven دور ضمیر بازتابی تقسیم می‌شود.
  nl.a2.unit24.lesson01.teach.wanneer_tijd:
    title: پرسیدن درباره وقت آزاد
    gloss: شما کی وقت دارید؟
    note: یک راه مستقیم و عملی برای پرسیدن درباره زمان‌بندی، با استفاده از u رسمی.
  nl.a2.unit24.lesson01.teach.zou_schikken:
    title: شرطی مؤدبانه
    gloss: روز چهارشنبه ساعت ده برای شما مناسب است؟
    note: Zou + مصدر شرطی مؤدبانه است و از یک جملهٔ مستقیم نرم‌تر به نظر می‌رسد؛ نشانهٔ زبان رسمی در سطح A2.
  nl.a2.unit24.lesson01.teach.komt_goed_uit:
    title: تأیید کردن یک وقت
    gloss: بلی، مناسب است.
    note: Komt goed uit (لفظاً «خوب بیرون می‌آید») راه طبیعی برای تأیید این است که وقت یا برنامهٔ پیشنهادشده برایتان مناسب است.
  nl.a2.unit24.lesson02.teach.paspoort:
    title: پاسپورت
    gloss: پاسپورت
    note: 'یک اسم خنثی: het paspoort.'
    example_gloss: پاسپورتتان همراهتان است؟
  nl.a2.unit24.lesson02.teach.huurcontract:
    title: قرارداد کرایه
    gloss: قرارداد کرایهٔ خانه
    note: 'یک اسم خنثی: het huurcontract، ترکیبی از huren (کرایه کردن) و *contract*.'
    example_gloss: قرارداد کرایه دارید؟
  nl.a2.unit24.lesson02.teach.geboorteakte:
    title: سند تولد
    gloss: سند تولد
    note: 'یک اسم از جنس مشترک: de geboorteakte.'
    example_gloss: آیا باید سند تولد خود را هم با خود بیاورم؟
  nl.a2.unit24.lesson02.teach.wat_heb_ik_nodig:
    title: پرسیدن دربارهٔ موارد لازم
    gloss: برای ثبت‌نام چه چیز لازم دارم؟
    note: om ... te + مصدر دوباره مقصود را بیان می‌کند و همان الگوی درس‌های پیش را به کار می‌برد.
  nl.a2.unit24.lesson02.teach.paspoort_huurcontract:
    title: بیان شرط‌ها به شکل رسمی
    gloss: به یک پاسپورت معتبر و قرارداد کرایهٔ خانهٔ شما ضرورت دارید.
    note: U heeft ... nodig (لفظاً «شما ... لازم دارید») شکل معمول رسمی برای بیان یک شرط است.
  nl.a2.unit24.lesson02.teach.moet_ik_meenemen:
    title: پرسیدن دربارهٔ یک سند اضافی
    gloss: آیا باید سند تولد خود را هم با خود بیاورم؟
    note: Meenemen (با خود آوردن) یک فعل جداشدنی است؛ اینجا بعد از moet به شکل مصدر در آخر پرسش می‌ماند.
  nl.a2.unit24.lesson03.teach.mag_ik_zien:
    title: خواهش دیدن اسناد
    gloss: می‌توانم پاسپورت و قرارداد کرایهٔ شما را ببینم؟
    note: Mag ik ... zien? راه مؤدبانهٔ معمول است که یک کارمند برای دیدن اسناد می‌پرسد.
  nl.a2.unit24.lesson03.teach.sinds_wanneer:
    title: پرسیدن «از کی»
    gloss: از کی در این آدرس زندگی می‌کنین؟
    note: Sinds wanneer (از کی) راه رسمی و دقیق برای پرسیدن دربارهٔ مدت است و در مصاحبه‌های رسمی زیاد استفاده می‌شود.
  nl.a2.unit24.lesson03.teach.sinds_vorige_maand:
    title: بیان نقطهٔ آغاز
    gloss: از ماه گذشته اینجا زندگی می‌کنم.
    note: Sinds + عبارت زمانی نشان می‌دهد وضعیتی که هنوز ادامه دارد از کی شروع شده است؛ با زمان حال woon به کار می‌رود (نه زمان گذشته)، چون زندگی کردن ادامه دارد.
  nl.a2.unit24.lesson04.teach.bsn:
    title: نمبر BSN
    gloss: نمبر BSN (نمبر خدمات شهروندی)
    note: 'یک اسم خنثی: het BSN-nummer، نمبر شناسایی شخصی ملی در هالند.'
    example_gloss: نمبر BSN چیست؟
  nl.a2.unit24.lesson04.teach.wat_is_bsn:
    title: پرسیدن اینکه BSN چیست
    gloss: نمبر BSN چیست؟
    note: یک پرسش ساده برای پیدا کردن تعریف، که برای هر اصطلاح رسمی ناآشنا مفید است.
  nl.a2.unit24.lesson04.teach.bsn_uitleg:
    title: توضیح دادن BSN
    gloss: نمبر BSN نمبر شخصی شما نزد دولت است.
    note: Bij de overheid (نزد حکومت) مشخص می‌کند که این نمبر به کدام اداره تعلق دارد.
  nl.a2.unit24.lesson04.teach.nodig_voor:
    title: شمردن موارد استفاده
    gloss: آن را برای کار، بانک و داکتر خانوادگی لازم دارید.
    note: Nodig hebben voor (لازم داشتن برای) الگوی nodig hebben را دوباره به کار می‌برد و voor هر مورد استفاده را معرفی می‌کند.
  nl.a2.unit24.lesson04.teach.digid:
    title: معرفی DigiD
    gloss: با DigiD می‌توانین کارهای تان را آنلاین انجام بدهین.
    note: DigiD سیستم هویت دیجیتال هالند برای خدمات دولتی است؛ zaken regelen (انجام دادن کارها) عبارت عمومی و معمول برای پیگیری کارهای اداری است.
  nl.a2.unit24.lesson05.teach.brief:
    title: خواندن یک نامهٔ رسمی ثبت‌نام
    gloss: 'برای ثبت‌نام در شاروالی اسناد زیر را لازم دارید: پاسپورت معتبر، قرارداد کرایه و در صورت لزوم، سند تولد. از قبل وقت بگیرین. بعد از ثبت‌نام، نمبر BSN شما در ظرف چند روز با پُست به شما می‌رسد.'
    note: به اسناد لازم، کاری که باید از قبل بکنین و آنچه بعداً اتفاق می‌افتد توجه کنید.
    glosses:
      Om: برای اینکه (om ... te مقصود را بیان می‌کند)
      schrijven: ثبت‌نام کردن (اینجا بخشی از فعل جداشدنی inschrijven که به شکل in te schrijven جدا شده است)
      gemeente: شاروالی
      volgende: آینده / زیر
      documenten: اسناد
      nodig: لازم (heeft ... nodig = «لازم دارد»)
      geldig: معتبر
      paspoort: پاسپورت
      huurcontract: قرارداد کرایه
      indien: اگر / در صورتی که (رسمی)
      toepassing: کاربرد (indien van toepassing = «در صورت لزوم»)
      geboorteakte: سند تولد
      Maak: بگیرین / بسازید (امر از maken)
      vooraf: از قبل / پیشاپیش
      afspraak: وقت ملاقات
      Na: بعد از
      inschrijving: ثبت‌نام
      ontvangt: دریافت می‌کنین (از ontvangen)
      binnen: در ظرف
      enkele: چند / چندین
      BSN-nummer: نمبر BSN (نمبر خدمات شهروندی)
      post: پُست
  nl.a2.unit24.lesson06.teach.ambtenaar_greet:
    title: کارمند به عمر سلام می‌دهد
    gloss: 'کارمند: عصر بخیر، چطور می‌توانم کمکتان کنم؟'
    note: Waarmee kan ik u helpen? سلام و احوال‌پرسی رسمی معمول در ادارات است و همان u رسمی را که در برخورد‌های خدماتی درس‌های پیش بود ادامه می‌دهد.
  nl.a2.unit24.lesson06.teach.omar_state_reason:
    title: عمر دلیل آمدنش را می‌گوید
    gloss: 'عمر: عصر بخیر، من برای ثبت‌نام در آدرس جدیدم وقت دارم.'
    note: Op mijn nieuwe adres (در آدرس جدیدم) مشخص می‌کند که این ثبت‌نام برای کدام آدرس است.
  nl.a2.unit24.lesson06.teach.ambtenaar_ask_documents:
    title: کارمند اسناد را می‌خواهد
    gloss: 'کارمند: لطفاً پاسپورت و قرارداد کرایه‌تان را نشان بدهین، می‌توانم ببینم؟'
    note: الگوی mag ik ... zien? را دوباره به کار می‌برد و alstublieft را برای ادب بیشتر اضافه می‌کند.
  nl.a2.unit24.lesson06.teach.omar_hand_over:
    title: عمر اسناد را می‌دهد
    gloss: 'عمر: بفرمایید. من از ماه گذشته در Utrecht زندگی می‌کنم.'
    note: با واقعیت sinds vorige maand که در مثال آموزشی درس پیش آمد مطابقت دارد.
  nl.a2.unit24.lesson06.teach.ambtenaar_confirm:
    title: کارمند تأیید می‌کند
    gloss: 'کارمند: تشکر. همه‌چیز درست است. نمبر BSN شما در ظرف چند روز با پُست به شما می‌رسد.'
    note: Alles is in orde (همه‌چیز درست است) عبارت معمول تأیید بعد از بررسی اسناد است.
  nl.a2.unit24.lesson06.teach.omar_thanks:
    title: عمر از کارمند تشکر می‌کند
    gloss: 'عمر: عالی، از کمک‌تان بسیار تشکر!'
    note: Voor uw hulp (برای کمک شما) گفتگوی رسمی را مؤدبانه به پایان می‌رساند.
  nl.a2.unit24.lesson06.teach.summary_grammar:
    title: خلاصهٔ این ملاقات
    gloss: عمر در gemeente ثبت‌نام کرد. او نمبر BSN خود را با پُست دریافت می‌کند.
    note: Heeft ... ingeschreven شکل ماضی نقلی zich inschrijven است (ingeschreven صفت مفعولی است)؛ zijn در اینجا ضمیر ملکی «او/ش» است، نه فعل «بودن».
