course:
  title: هالندی A2
  description: 'زبان هالندی در سطح ابتدایی بالاتر برای انجام یک ملاقات رسمی ثبت‌نام نزد مقام‌های محلی: وقت گرفتن، فهمیدن اسناد لازم و پیگیری یک گفتگوی واقعی در gemeente.'
