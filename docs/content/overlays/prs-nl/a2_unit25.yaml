teaching:
  nl.a2.unit25.lesson01.teach.fietspad:
    title: مسیر بایسکل
    gloss: مسیر بایسکل
    note: 'اسم خنثی: het fietspad، ترکیبی از fiets (بایسکل) و pad (راه).'
    example_gloss: مسیر بایسکل نو است.
  nl.a2.unit25.lesson01.teach.wat_vind_je:
    title: پرسیدن نظر
    gloss: دربارهٔ جادهٔ نوی بایسکل چه فکر می‌کنی؟
    note: Vinden van (تحت‌اللفظی «پیدا کردن از») راه معمول برای پرسیدن یا گفتن نظر درباره‌ی یک چیز مشخص است.
  nl.a2.unit25.lesson01.teach.wat_is_mening:
    title: مستقیم پرسیدن نظر
    gloss: نظر تو چیست؟
    note: Mening (نظر) شکل اسمی مستقیم است و وقتی به کار می‌رود که vinden van زیاد غیرمستقیم به نظر برسد.
  nl.a2.unit25.lesson02.teach.volgens_mij_goed:
    title: بیان نظر
    gloss: به نظر من، مسیر بایسکل فکر خوبی است.
    note: Volgens mij (به نظر من) رایج‌ترین راه برای شروع کردن یک نظر شخصی در هلندی است.
  nl.a2.unit25.lesson02.teach.gevaarlijk:
    title: خطرناک
    gloss: خطرناک
    note: صفتی رایج برای توصیف خطر.
    example_gloss: بعضی‌ها مسیر بایسکل را خطرناک می‌دانند.
  nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk:
    title: نظر همراه با دلیل
    gloss: به نظر من، مسیر بایسکل خطرناک است، چون خیلی تنگ است.
    note: Omdat (چون) جمله‌ی دلیل را شروع می‌کند؛ فعل در آن جمله به آخر می‌رود (is بعد از te smal می‌آید).
  nl.a2.unit25.lesson03.teach.ben_het_eens:
    title: موافق بودن
    gloss: من با تو موافقم.
    note: Het eens zijn met (تحت‌اللفظی «در آن موافقت بودن با») عبارت ثابت برای موافقت است.
  nl.a2.unit25.lesson03.teach.niet_eens:
    title: مخالف بودن
    gloss: من با تو موافق نیستم.
    note: 'Niet عبارت ثابت را منفی می‌کند: het niet met je eens zijn.'
  nl.a2.unit25.lesson03.teach.gedeeltelijk_eens:
    title: تا حدی موافق بودن
    gloss: من تا حدی موافقم.
    note: Gedeeltelijk (تا حدی) داخل همان عبارت ثابت het met je eens zijn می‌آید و برای جواب دادن با ظرافت مفید است.
  nl.a2.unit25.lesson04.teach.veiliger_kinderen:
    title: آوردن نکته‌ی مقابل
    gloss: از طرف دیگر، مسیر بایسکل برای کودکان امن‌تر است.
    note: Aan de andere kant (از طرف دیگر) نکته‌ی متضاد را شروع می‌کند؛ wel در اینجا تضاد را تأکید می‌کند و فقط به معنای «بلی» نیست.
  nl.a2.unit25.lesson04.teach.duur_bespaart:
    title: سنجیدن هزینه و فایده
    gloss: گران است، ولی از طرف دیگر در وقت صرفه می‌شود.
    note: Maar (ولی) همراه با aan de andere kant یک تضاد کلاسیک میان خوبی‌ها و بدی‌ها می‌سازد.
  nl.a2.unit25.lesson05.teach.voetgangers:
    title: عابران پیاده
    gloss: عابران پیاده
    note: 'اسم جمع رایج با حرف تعریف de: de voetgangers، از voet (پا) و gangers (رونده‌ها).'
    example_gloss: مسیر بایسکل برای عابران پیاده تنگ است.
  nl.a2.unit25.lesson05.teach.forumbericht:
    title: خواندن یک پیام در فورم
    gloss: فکر می‌کنم مسیر جدید بایسکل فکر بدی است. خیلی تنگ است و برای عابران پیاده جای کافی نیست. از طرف دیگر، می‌فهمم که شاروالی بایسکل‌سوار بیشتر می‌خواهد. به نظر من باید مسیر را عریض‌تر بسازند.
    note: به نظر نویسنده، دلیلش، نکته‌ی مقابلی که قبول می‌کند و پیشنهادش توجه کن.
    glosses:
      vind: فکر کردن (درباره‌ی) / دانستن — بیان نظر
      nieuwe: نو
      fietspad: مسیر بایسکل
      slecht: بد
      idee: فکر
      te: خیلی (زیاد از حد)
      smal: تنگ
      weinig: کم
      ruimte: جا
      voetgangers: عابران پیاده
      andere: دیگر
      kant: طرف (aan de andere kant = از طرف دیگر)
      snap: فهمیدن (از snappen، محاوره‌ای)
      gemeente: شاروالی
      meer: بیشتر
      fietsers: بایسکل‌سوارها
      wil: می‌خواهد (از willen)
      Volgens: مطابق (Volgens mij = به نظر من)
      moeten: باید
      pad: راه
      breder: عریض‌تر (صفت تفضیلی از breed)
      maken: ساختن
  nl.a2.unit25.lesson06.teach.lotte_ask:
    title: Lotte نظر Omar را می‌پرسد
    gloss: 'Lotte: درباره‌ی مسیر جدید بایسکل چه فکر می‌کنی، Omar؟'
    note: الگوی wat vind je van ...? از درس‌های پیشین دوباره به کار می‌رود، این بار مستقیم خطاب به Omar.
  nl.a2.unit25.lesson06.teach.omar_opinion:
    title: Omar نظرش را می‌گوید
    gloss: 'Omar: به نظر من فکر خوبی است، چون برای بایسکل‌سوارها امن‌تر است.'
    note: volgens mij با دلیل omdat ترکیب شده است، مثل الگوی درس‌های پیشین.
  nl.a2.unit25.lesson06.teach.lotte_disagree:
    title: Lotte تا حدی مخالف است
    gloss: 'Lotte: من با این کاملاً موافق نیستم. برای عابران پیاده خیلی تنگ است.'
    note: Daar (آنجا / با آن) به نظر Omar برمی‌گردد؛ helemaal (کاملاً) مخالفت را نرم می‌کند، یعنی «نه کاملاً» و نه رد مطلق.
  nl.a2.unit25.lesson06.teach.omar_concede:
    title: Omar می‌پذیرد و جواب می‌دهد
    gloss: 'Omar: این را می‌فهمم، ولی از طرف دیگر حالا در سرک موترهای کمتر است.'
    note: Dat snap ik (من این را می‌فهمم) نکتهٔ لوته را می‌پذیرد و بعد با aan de andere kant یک نکتهٔ مقابل را مطرح می‌کند.
  nl.a2.unit25.lesson06.teach.lotte_agree_maybe:
    title: لوته موقف خود را نرم می‌کند
    gloss: 'لوته: درست است. شاید اگر آن را عریض‌تر بسازند، بهتر شود.'
    note: Als (اگر) یک جملهٔ شرطی را آغاز می‌کند؛ wordt زمان حال فعل worden (شدن) است.
  nl.a2.unit25.lesson06.teach.omar_final_agree:
    title: Omar موافقت می‌کند
    gloss: 'Omar: بلی، من هم همین فکر را می‌کنم.'
    note: Dat denk ik ook از صحبت تلفنی واحد ۲۲ دوباره به کار رفته است.
  nl.a2.unit25.lesson06.teach.vindt_form:
    title: 'Vindt: شکل «او»'
    gloss: عمر فکر می‌کند راه بایسکل‌رو فکر خوبی است.
    note: Vindt شکل سوم شخص فعل vinden (فکر کردن/دانستن) است و وقتی نظر شخص دیگری را بیان می‌کنیم به کار می‌رود.
