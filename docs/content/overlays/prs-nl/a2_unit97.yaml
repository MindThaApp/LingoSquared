    instruction: 'کلمه‌ها را به ترتیب درست بگذار تا بگویی: «او می‌پرسد که آیا عمر وقت دارد.»'
    correct_option: Ze vraagt of Omar tijd heeft
    accepted_answers:
    - value: Ze vraagt of Omar tijd heeft
      status: correct
