course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر گرامر برای رساندن پیام.
  learning_goal: آنچه کسی گفته یا پرسیده است را با zegt dat، vraagt of و laat weten انتقال بدهین.
units:
  nl.a2.unit97.doorgeven_wat_iemand_zegt:
    title: رساندن گفتهٔ دیگران
    description: با zegt dat، vraagt of و laat weten در زمان حال پیام برسانید.
lessons:
  nl.a2.unit97.lesson01.wat_zegt_hij:
    title: او چه می‌گوید؟
  nl.a2.unit97.lesson02.ze_vraagt_of:
    title: او می‌پرسد که آیا ...
  nl.a2.unit97.lesson03.van_ik_naar_hij:
    title: از «من» به «او»
  nl.a2.unit97.lesson04.een_bericht_doorgeven:
    title: رساندن یک پیام
  nl.a2.unit97.lesson05.een_briefje_lezen:
    title: خواندن یک یادداشت
  nl.a2.unit97.lesson06.de_collega_belt:
    title: همکار زنگ می‌زند
teaching:
  nl.a2.unit97.lesson01.teach.berichten:
    title: پیام‌ها و یادداشت‌ها
    gloss: پیام / یادداشت / تلفون / زنگ زدن
    note: het bericht کلمهٔ عمومی برای پیام است؛ het briefje یک یادداشت کوتاه نوشته‌شده است.
    example_gloss:
    - نور به عمر زنگ می‌زند.
    - یک پیام دارم.
    - یادداشت در خانه است.
  nl.a2.unit97.lesson01.teach.tijd:
    title: چه وقت و کجا
    gloss: بعداً / امروز / فردا / امشب / در خانه
    note: این کلمه‌های کوچک تقریباً در هر پیام می‌آیند.
    example_gloss:
    - من بعداً می‌آیم.
    - لوته امروز کار می‌کند.
    - فردا من در خانه هستم.
    - امشب من وقت دارم.
  nl.a2.unit97.lesson01.teach.voornaamwoorden:
    title: چه کسی صحبت می‌کند
    gloss: او (مرد) / او (زن) / او (زن) / من / تو / تو
    note: Ze و zij هر دو در اینجا «او» (زن) معنی می‌دهند. Je و jij هر دو میان دوستان «تو» معنی می‌دهند؛ jij شکل تأکیدی و je شکل روزمره است.
    example_gloss:
    - او امروز کار می‌کند.
    - او بعداً می‌آید.
    - من در خانه هستم.
  nl.a2.unit97.lesson01.teach.werkwoorden:
    title: فعل‌های پیام
    gloss: آمدن / کار کردن / گفتن / پرسیدن / هم / نه
    note: Zeggen و vragen دو فعل اصلی برای رساندن یک پیام استند.
    example_gloss:
    - من کار نمی‌کنم.
    - او هم می‌آید.
  nl.a2.unit97.lesson01.teach.gn_dat:
    title: Zeggen با dat
    gloss: 'عمر می‌گوید: «من بعداً می‌آیم.» عمر می‌گوید که او بعداً می‌آید.'
    note: برای رساندن یک گفته از zegt dat استفاده کنید. سخن گوینده بعد از dat یک جملهٔ فرعی می‌شود و فعل (همان که با نهاد هماهنگ است) به آخر همان جمله می‌رود. ik گوینده به hij یا ze تبدیل می‌شود.
  nl.a2.unit97.lesson01.teach.zinnen:
    title: دو گفتهٔ منتقل‌شده
    gloss: عمر می‌گوید که او بعداً می‌آید. نور می‌گوید که او امروز کار می‌کند.
  nl.a2.unit97.lesson02.teach.werk:
    title: کلمه‌های کاری
    gloss: قرار ملاقات / جلسه / همکار / کار / وقت
    note: 'Tijd بدون حرف تعریف به معنی «وقت» به‌طور کلی است: Ik heb tijd.'
    example_gloss:
    - جلسه امروز است.
    - همکار من فردا کار می‌کند.
    - من وقت دارم.
  nl.a2.unit97.lesson02.teach.vraagwoorden:
    title: کلمه‌های پرسشی
    gloss: کجا / کی / چه کسی / آیا (که) / است / دارد / منتظر می‌ماند
    note: Of در گفتار منتقل‌شده برای پرسش‌های بلی/نخیر به کار می‌رود.
    example_gloss:
    - همکار کی است؟
    - عمر کجاست؟
    - لوته کی می‌آید؟
    - آیا نور وقت دارد؟
    - آیا عمر فردا کار می‌کند؟
    - نور کجا منتظر می‌ماند؟
  nl.a2.unit97.lesson02.teach.gn_of:
    title: Vragen با of
    gloss: 'او می‌پرسد: «آیا نور وقت دارد؟» او می‌پرسد که آیا نور وقت دارد.'
    note: یک پرسش بلی/نخیر به of به‌علاوهٔ یک جملهٔ فرعی تبدیل می‌شود که فعل در آخر آن می‌آید. ترتیب کلمات پرسش (فعل در آغاز) از بین می‌رود.
  nl.a2.unit97.lesson02.teach.gn_vraagwoord:
    title: Vragen با waar و wanneer
    gloss: 'او می‌پرسد: «جلسه کجاست؟» او می‌پرسد که جلسه کجاست.'
    note: پرسشی که کلمهٔ پرسشی دارد، همان کلمه (waar، wanneer) را نگه می‌دارد و فعل به آخر می‌رود. کلمهٔ اضافی مثل dat یا of افزوده نمی‌شود.
  nl.a2.unit97.lesson02.teach.zinnen:
    title: دو پرسش منتقل‌شده
    gloss: او می‌پرسد که آیا عمر وقت دارد. او می‌پرسد که جلسه کجاست.
  nl.a2.unit97.lesson03.teach.modaal:
    title: کلمه‌های کوچکی که تغییر می‌کنند
    gloss: می‌توانم / می‌خواهم / باید / من (ملکیت) / او (مرد، ملکیت) / او (زن، ملکیت)
    note: Zijn می‌تواند معنی «بودن» هم بدهد، اما پیش از یک اسم، مثل zijn telefoon، معنی «از او (مرد)» می‌دهد.
    example_gloss:
    - من می‌توانم بیایم.
    - من می‌خواهم کار کنم.
    - من باید کار کنم.
    - تلفون او (زن) در خانه است.
    - قرار ملاقات من امروز است.
  nl.a2.unit97.lesson03.teach.gn_voornaamwoord:
    title: ضمیرها را تغییر بدهین
    gloss: 'عمر می‌گوید: «من تلفونم را دارم.» عمر می‌گوید که او تلفونش را دارد.'
    note: 'وقتی پیامی را می‌رسانید، ik به hij یا ze تبدیل می‌شود و mijn به zijn (برای مرد) یا haar (برای زن). فعل هم تغییر می‌کند: ik heb به hij heeft تبدیل می‌شود.'
  nl.a2.unit97.lesson03.teach.gn_contrast:
    title: گفتار مستقیم در برابر رساندن آن
    gloss: 'عمر می‌گوید: «من بعداً می‌آیم.» عمر می‌گوید که او بعداً می‌آید.'
    note: 'گفتار مستقیم: دو نقطه، سخن خود گوینده، و فعل در جایگاه دوم (ik kom). رساندن آن: dat، hij به‌جای ik، و فعل در آخر (hij later komt).'
  nl.a2.unit97.lesson03.teach.gn_modaal:
    title: دو فعل در آخر
    gloss: 'عمر می‌گوید: «من نمی‌توانم بیایم.» عمر می‌گوید که او نمی‌تواند بیاید.'
    note: 'با kan، wil یا moet دو فعل وجود دارد. در جملهٔ فرعی با dat هر دو در آخر می‌آیند و فعل کمکی (فعل صرف‌شده) پیش از مصدر قرار می‌گیرد: dat hij niet kan komen.'
  nl.a2.unit97.lesson03.teach.zinnen:
    title: دو گفتهٔ منتقل‌شدهٔ دیگر
    gloss: نور می‌گوید که تلفونش در خانه است. عمر می‌گوید که او نمی‌تواند بیاید.
  nl.a2.unit97.lesson04.teach.doorgeven:
    title: رساندن
    gloss: رساندن / خبر دادن / از / آنجا
    note: 'Laten weten یعنی «به کسی خبر دادن». در جمله: Lotte laat weten dat ...'
    example_gloss:
    - من می‌خواهم پیام را برسانم.
    - یک پیام از نور هست.
    - لوته به ما خبر می‌دهد که می‌آید.
  nl.a2.unit97.lesson04.teach.gn_opening:
    title: چگونه شروع کنیم
    gloss: یک پیام از نور هست. او می‌گوید که امشب در خانه است.
    note: با Er is een bericht van ... شروع کنید و بعد محتوا را با zegt dat یا vraagt of برسانید. بعد از جملهٔ اول می‌توانین hij یا ze به کار ببرید.
  nl.a2.unit97.lesson04.teach.gn_laat_weten:
    title: Laten weten
    gloss: نور به ما خبر می‌دهد که فردا می‌آید. عمر به ما خبر می‌دهد که آیا وقت دارد یا نه.
    note: 'Laat weten dat راه خوبی برای رساندن خبر در یک پیام است. مثل zegt dat کار می‌کند: فعل به آخر می‌رود. Laat weten of می‌رساند که چیزی درست است یا نه، مثل Omar laat weten of hij tijd heeft.'
  nl.a2.unit97.lesson04.teach.zinnen:
    title: یک رساندن کوتاه
    gloss: یک پیام از عمر هست. او خبر می‌دهد که فردا کار می‌کند.
  nl.a2.unit97.lesson05.teach.reading:
    title: یک یادداشت از عمر
    gloss: سلام لوته، یک پیام از نور هست. او می‌گوید که امشب نمی‌تواند بیاید، چون باید کار کند. او می‌پرسد که آیا تو فردا وقت داری. یک همکار خبر می‌دهد که جلسه ساعت نُه است.
    note: 'عمر در این یادداشت دو پیام می‌رساند: پیام نور و پیام یک همکار.'
  nl.a2.unit97.lesson06.teach.d01:
    title: عمر دربارهٔ تماس تلفونی به لوته می‌گوید
    gloss: 'عمر: سلام لوته، همکار زنگ می‌زند.'
  nl.a2.unit97.lesson06.teach.d02:
    title: لوته می‌پرسد او چه می‌گوید
    gloss: 'لوته: آه بلی؟ او چه می‌گوید؟'
  nl.a2.unit97.lesson06.teach.d03:
    title: عمر پیام را می‌رساند
    gloss: 'عمر: او می‌گوید که جلسه فردا ساعت نُه است.'
  nl.a2.unit97.lesson06.teach.d04:
    title: لوته دربارهٔ یک پرسش می‌پرسد
    gloss: 'لوته: آیا او می‌پرسد که من وقت دارم یا نه؟'
  nl.a2.unit97.lesson06.teach.d05:
    title: Omar تأیید می‌کند
    gloss: 'عمر: بلی، او می‌پرسد که آیا تو فردا وقت داری.'
  nl.a2.unit97.lesson06.teach.d06:
    title: Lotte جواب می‌دهد
    gloss: 'لوته: خوب است، من وقت دارم. به همکار خبر می‌دهم که می‌آیم.'
