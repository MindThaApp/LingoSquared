      status: correct
    feedback: Omar zegt dat hij later komt = عمر می‌گوید که او بعداً می‌آید.
    prompt_blocks:
    - عمر می‌گوید که دیرتر می‌آید.
  nl.a2.unit97.lesson01.ex02.choose_works:
