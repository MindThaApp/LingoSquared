    example_gloss: قهوهٔ شما همین حالا می‌آید!
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: عصر بخیر، چی میل دارید بنوشید؟
    gloss: 'کارمند: عصر بخیر، چی میل دارید بنوشید؟ لوته: یک قهوه می‌خواهم، لطفاً.'
    note: یک گفتگوی رسمی خدماتی — توجه کنید که لوته با کارمند *alstublieft* می‌گوید، برخلاف گپ غیررسمی‌اش با عمر.
  nl.a1.unit06.lesson06.teach.lines04_06:
    title: آیا چیزی هم می‌خواهین بخورید؟
    gloss: 'کارمند: و چیزی هم میل دارید بخورید؟ لوته: بلی، یک ساندویچ پنیر، لطفاً. کارمند: همین حالا می‌آید!'
    note: '*En wilt u ook iets eten?* راه طبیعی است که کارمند می‌پرسد آیا غذا هم می‌خواهین.'
