teaching:
  nl.a2.unit80.lesson01.teach.verzetten:
    title: تغییر دادن وقت ملاقات
    gloss: جابه‌جا کردن (وقت ملاقات) / لغو کردن
    note: '*Een afspraak verzetten* یعنی آن را به وقت دیگر انتقال دادن. *Annuleren* یعنی آن را کاملاً لغو کردن.'
    example_gloss:
    - می‌خواهم وقت ملاقاتم را جابه‌جا کنم.
    - باید وقت ملاقاتم را لغو کنم.
  nl.a2.unit80.lesson01.teach.helaas_sorry:
    title: معذرت خواستن
    gloss: متأسفانه / ببخشین
    note: '*Helaas* راه مؤدبانهٔ دادن خبر بد است. *Sorry* معذرت‌خواهی روزمره است.'
    example_gloss:
    - متأسفانه آمده نمی‌توانم.
    - ببخشین، دیر کردم.
  nl.a2.unit80.lesson01.teach.kapsalon:
    title: آرایشگاه
    gloss: آرایشگاه
    note: '*Het kapsalon* خود جا است؛ *de kapper* خود شخص است. مردم برای هر دو اغلب می‌گویند *naar de kapper*.'
    example_gloss: آرایشگاه از ساعت نُه تا شش باز است.
  nl.a2.unit80.lesson01.teach.kan_verzetten:
    title: خواستن جابه‌جایی وقت ملاقات
    gloss: آیا می‌توانم وقت ملاقاتم را تغییر بدهم؟
    note: 'سؤال بلی/نخیر با فعل شروع می‌شود: *Kan ik ...?* مصدر *verzetten* در آخر جمله می‌آید.'
  nl.a2.unit80.lesson01.teach.helaas_niet_komen:
    title: گفتن اینکه آمده نمی‌توانید
    gloss: متأسفانه آمده نمی‌توانم.
  nl.a2.unit80.lesson01.teach.gn_kan:
    title: Kan + مصدر
    gloss: روز پنجشنبه آمده نمی‌توانم. آیا می‌توانم وقت ملاقات را جابه‌جا کنم؟
    note: 'بعد از *kan* فعل دوم به شکل مصدر در آخر جمله می‌آید. در جملهٔ خبری، *niet* پیش از آن مصدر می‌آید: *Ik kan donderdag niet komen*. کلمهٔ زمان مثل *donderdag* پیش از *niet* می‌آید. در سؤال، *kan* اول می‌آید: *Kan ik de afspraak verzetten?*'
  nl.a2.unit80.lesson02.teach.andere_dag:
    title: روز دیگر
    gloss: یک روز دیگر
    note: در اینجا *andere* بعد از *een* با -e تمام می‌شود، چون *dag* کلمهٔ de است.
    example_gloss: آیا در روز دیگر هم شده می‌تواند؟
  nl.a2.unit80.lesson02.teach.kan_ook_maandag:
    title: پیشنهاد کردن یک روز
    gloss: می‌شود روز دوشنبه هم باشد؟
    note: 'در هلندی پیش از نام روز هفته در اینجا حرف اضافه لازم نیست: *maandag*، نه *op maandag*.'
  nl.a2.unit80.lesson02.teach.kan_ook_dinsdag:
    title: روز دیگر
    gloss: می‌شود روز سه‌شنبه هم باشد؟
  nl.a2.unit80.lesson02.teach.komt_uit:
    title: برای شما مناسب است؟
    gloss: آیا روز جمعه برای شما مناسب است؟ (محترمانه)
    note: '*Uitkomen* یعنی «مناسب آمدن». این فعل جداشدنی است، پس *uit* به آخر جمله می‌رود: *Komt vrijdag u uit?* ضمیر مؤدبانهٔ *u* با کسی به کار می‌رود که او را خوب نمی‌شناسید.'
  nl.a2.unit80.lesson02.teach.komt_goed_uit:
    title: گفتن بلی
    gloss: بلی، برایم خوب است.
  nl.a2.unit80.lesson02.teach.helaas_niet:
    title: مؤدبانه نخیر گفتن
    gloss: متأسفانه نه.
  nl.a2.unit80.lesson02.teach.gn_uitkomen:
    title: برای شما مناسب است؟
    gloss: آیا روز جمعه برای شما مناسب است؟ بلی، برایم خوب است. نخیر، متأسفانه نه.
    note: '*Uitkomen* فعل جداشدنی است: در زمان حال، *uit* به آخر جمله می‌رود. سؤال با فعل شروع می‌شود: *Komt vrijdag u uit?* جملهٔ *Ja, dat komt goed uit* تأیید است. رد مؤدبانه این است: *Nee, helaas niet*.'
  nl.a2.unit80.lesson03.teach.want:
    title: چون و متأسفم
    gloss: چون / متأسفم
    note: '*Want* دو جملهٔ کامل را وصل می‌کند و دلیل می‌دهد. *Het spijt me* معذرت‌خواهی محتاطانه‌تر از *sorry* است.'
    example_gloss:
    - نمی‌توانم بیایم، چون مریض هستم.
    - متأسفم.
  nl.a2.unit80.lesson03.teach.ongemak:
    title: زحمت
    gloss: زحمت
    note: '*Sorry voor het ongemak* جملهٔ مؤدبانه‌ای است که بعد از دادن زحمت اضافی به کسی گفته می‌شود.'
    example_gloss: بابت زحمت ببخشین.
  nl.a2.unit80.lesson03.teach.werken:
    title: 'دلیل: کار'
    gloss: آمده نمی‌توانم، چون باید کار کنم.
  nl.a2.unit80.lesson03.teach.andere_afspraak:
    title: 'دلیل: وقت ملاقات دیگر'
    gloss: نمی‌توانم بیایم، چون وقت ملاقات دیگری دارم.
  nl.a2.unit80.lesson03.teach.gn_want:
    title: 'چون: want'
    gloss: نمی‌توانم بیایم، چون مریض هستم.
    note: 'بعد از *want* ترتیب کلمات عادی است: اول فاعل، بعد فعل. پیش از *want* کامه می‌آید: *Ik kan niet komen, want ik ben ziek.* با *omdat* مقایسه کنید که فعل را به آخر جمله می‌برد؛ اینجا از *want* استفاده کنید.'
  nl.a2.unit80.lesson04.teach.afspreken:
    title: قرار گذاشتن و از قبل
    gloss: قرار گذاشتن / از قبل
    note: '*Afspreken* یعنی با هم دربارهٔ وقت یا جا توافق کردن. *Van tevoren* یعنی «پیشاپیش»، «از قبل».'
    example_gloss:
    - آیا با هم قرار بگذاریم؟
    - یک روز قبل زنگ بزنید.
  nl.a2.unit80.lesson04.teach.maandag_tien:
    title: قبول کردن یک وقت
    gloss: روز دوشنبه ساعت ده خوب است.
  nl.a2.unit80.lesson04.teach.kunt_u:
    title: پرسیدن اینکه وقت مناسب است یا نه
    gloss: آیا دوشنبه ساعت ده آمده می‌توانین؟ (محترمانه)
    note: '*Kunt u* شکل مؤدبانهٔ *kun je* است. مصدر *komen* در آخر جمله می‌آید.'
  nl.a2.unit80.lesson04.teach.zie_u_maandag:
    title: نهایی کردن قرار
    gloss: پس روز دوشنبه شما را می‌بینم.
  nl.a2.unit80.lesson04.teach.nieuwe_afspraak:
    title: گرفتن وقت ملاقات نو
    gloss: پس یک وقت ملاقات نو می‌گیرم.
  nl.a2.unit80.lesson04.teach.gn_tijd:
    title: اول روز، بعد ساعت
    gloss: دوشنبه ساعت ده خوب است. آیا دوشنبه ساعت ده آمده می‌توانین؟
    note: 'وقتی روز و ساعت را می‌گویید، اول روز می‌آید و بعد *om* + ساعت: *maandag om tien uur*. در سؤال مؤدبانه از *Kunt u ...?* استفاده کنید و مصدر را در آخر جمله بگذارین.'
  nl.a2.unit80.lesson05.teach.kapsalon_bericht:
    title: پیام از آرایشگاه
    gloss: Omar عزیز، وقت ملاقات شما جابه‌جا شده است. وقت ملاقات نوی شما دوشنبه ساعت ده است. برایتان مناسب نیست؟ پس یک روز قبل به ما زنگ بزنید. بعد یک وقت ملاقات نو می‌گیریم. تا دوشنبه! آرایشگاه Jansen
    note: این یک پیام کوتاه معمولی از یک مؤسسه است، پس ضمیرهای مؤدبانهٔ *u* و *uw* در آن به کار رفته. *Is verzet* یعنی «جابه‌جا شده است».
    glosses:
      beste: عزیز
      omar: Omar
      uw: از شما (محترمانه)
      afspraak: وقت ملاقات
      verzet: جابه‌جا شده
      nieuwe: نو
      maandag: دوشنبه
      tien: ده
      uur: ساعت
      komt: مناسب می‌آید
      dit: این
      niet: نه
      uit: (بخش دوم فعل «مناسب آمدن»)
      bel: زنگ زدن
      ons: ما را
      dan: پس
      tevoren: از قبل
      maken: می‌سازیم / می‌گیریم
      we: ما
      tot: تا، به امید دیدار
      kapsalon: آرایشگاه
      jansen: Jansen
  nl.a2.unit80.lesson06.teach.kapper_opening:
    title: آرایشگاه جواب می‌دهد
    gloss: 'آرایشگر: آرایشگاه Jansen، عصر بخیر.'
  nl.a2.unit80.lesson06.teach.omar_vraagt:
    title: Omar توضیح می‌دهد و می‌پرسد
    gloss: 'Omar: عصر بخیر، با Omar صحبت می‌کنین. روز پنجشنبه وقت ملاقات دارم، اما متأسفانه آمده نمی‌توانم. آیا می‌توانم وقت ملاقات را جابه‌جا کنم؟'
  nl.a2.unit80.lesson06.teach.kapper_vrijdag:
    title: آرایشگر روز جمعه را پیشنهاد می‌کند
    gloss: 'آرایشگر: البته. آیا روز جمعه برای شما مناسب است؟'
  nl.a2.unit80.lesson06.teach.omar_maandag:
    title: عمر روز دوشنبه را پیشنهاد می‌کند
    gloss: 'عمر: متأسفانه نه، چون باید کار کنم. می‌شود روز دوشنبه باشد؟'
  nl.a2.unit80.lesson06.teach.kapper_tien:
    title: آرایشگر قبول می‌کند
    gloss: 'آرایشگر: دوشنبه ساعت ده خوب است.'
  nl.a2.unit80.lesson06.teach.omar_dank:
    title: عمر قبول می‌کند و معذرت می‌خواهد
    gloss: 'عمر: برایم مناسب است. خیلی تشکر و ببخشین که زحمت شد.'
  nl.a2.unit80.lesson06.teach.kapper_einde:
    title: آرایشگر گپ را ختم می‌کند
    gloss: 'آرایشگر: مشکلی نیست. تا دوشنبه!'
