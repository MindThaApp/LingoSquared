teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: صفر تا چهار
    gloss: 0 — صفر، 1 — یک، 2 — دو، 3 — سه، 4 — چهار
    note: nul در هالندی یعنی صفر، از جمله رقم اول شمارهٔ تیلفون. نشانه‌های روی één آن را در نوشتار از حرف تعریف een جدا می‌کنند؛ در متن‌های معمولی هالندی، وقتی معنا روشن باشد، گاهی این نشانه‌ها نوشته نمی‌شوند.
    example_gloss:
    - من صفر یورو دارم.
    - من یک کتاب دارم.
    - من دو چوکی دارم.
    - من سه کتاب دارم.
    - چهار نفر استند.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: پنج تا هشت
    gloss: 5 — پنج، 6 — شش، 7 — هفت، 8 — هشت
    note: vijf، zes، zeven و acht از همان الگوی ساده‌ای پیروی می‌کنند که اعداد صفر تا چهار.
    example_gloss:
    - من پنج یورو دارم.
    - من شش کتاب دارم.
    - من هفت چوکی دارم.
    - هشت نفر استند.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: نُه تا دوازده
    gloss: 9 — نُه، 10 — ده، 11 — یازده، 12 — دوازده
    note: negen، tien، elf و twaalf اعداد تا دوازده را کامل می‌کنند.
    example_gloss:
    - من نُه یورو دارم.
    - من ده چوکی دارم.
    - من یازده کتاب دارم.
    - دوازده نفر استند.
  nl.a1.unit02.lesson01.teach.how_many:
    title: پرسیدن مقدار
    gloss: چند؟
    note: Hoeveel دربارهٔ عدد یا مقدار می‌پرسد.
  nl.a1.unit02.lesson02.teach.teens:
    title: اعداد سیزده تا نوزده
    gloss: '13–19: سیزده، چهارده، پانزده، شانزده، هفده، هجده، نوزده'
    note: شکل‌های هالندی از سیزده تا نوزده به -tien ختم می‌شوند.
    example_gloss:
    - عمرم سیزده سال است.
    - من چهارده یورو دارم.
    - عمرم پانزده سال است.
    - من شانزده کتاب دارم.
    - هفده نفر استند.
    - عمرم هجده سال است.
    - من نوزده چوکی دارم.
  nl.a1.unit02.lesson02.teach.tens:
    title: دهگان‌ها
    gloss: '20–90: بیست، سی، چهل، پنجاه، شصت، هفتاد، هشتاد، نود'
    note: این دهگان‌ها را به‌عنوان پایه برای اعداد دو رقمی بزرگ‌تر یاد بگیرین.
    example_gloss:
    - عمرم بیست سال است.
    - این سی یورو قیمت دارد.
    - من چهل یورو دارم.
    - پنجاه نفر استند.
    - عمرم شصت سال است.
    - این هفتاد یورو قیمت دارد.
    - هشتاد نفر استند.
    - من نود یورو دارم.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: یکی‌ها پیش از دهگان‌ها می‌آیند
    gloss: '21 تا 99، به‌جز 30، 40 و دیگر دهگان‌های کامل: یکی + en + دهگان'
    note: 'در هالندی معمولاً اول رقم یکی گفته می‌شود: 42 در اصل «دو و چهل» است. دهگان‌های کامل فقط با کلمهٔ دهگان گفته می‌شوند.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: بیست و یک
    gloss: 21 — بیست و یک
    note: eenentwintig از een + en + twintig ساخته شده و به شکل یک کلمه نوشته می‌شود.
    example_gloss: کافهٔ زبان در اتاق بیست و یک است.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: بیست و دو
    gloss: 22 — بیست و دو
    note: دو نقطهٔ روی ë در tweeëntwintig نشان می‌دهد که مصوت‌های کنار هم از هجاهای جداگانه شروع می‌شوند.
    example_gloss: عمرم بیست و دو سال است.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: سی و دو
    gloss: 32 — سی و دو
    note: tweeëndertig به شکل یک کلمه نوشته می‌شود و روی ë که دو بخش را وصل می‌کند، دو نقطه می‌آید.
    example_gloss: عمر Omar سی و دو سال است.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: چهل و دو
    gloss: 42 چهل و دو است.
    note: 'اول یکان را بگو، بعد دهگان را: twee-en-veertig؛ این عدد یکجا مثل tweeënveertig نوشته می‌شود.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: چهل و هشت
    gloss: 48 — چهل و هشت
    note: Achtenveertig از acht + en + veertig ساخته شده و یک کلمه نوشته می‌شود.
    example_gloss: من در نمبر چهل و هشت زندگی می‌کنم.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: هفتاد و پنج
    gloss: 75 — هفتاد و پنج
    note: در vijfenzeventig اول vijf می‌آید و بعد zeventig.
    example_gloss: قیمتش هفتاد و پنج سنت است.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: نود و نُه
    gloss: 99 — نود و نُه
    note: Negenennegentig یک کلمهٔ مرکب است.
    example_gloss: من نود و نُه ساله استم.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: پرسیدن نمبر تیلفون
    gloss: نمبر تیلفون تو چند است؟
    note: Je پرسش را غیررسمی نگه می‌دارد، مثل فضای کافهٔ زبان لوته و عمر.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: نمبر موبایل هالندی را بگو
    gloss: نمبر تیلفون من 06 21 43 65 87 است.
    note: نمبرهای موبایل هالند با 06 شروع می‌شوند و معمولاً به شکل 06 و بعد هشت رقم نوشته می‌شوند.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: نمبر تیلفون را گروه‌گروه بگو
    gloss: صفر شش، بیست و یک، چهل و سه، شصت و پنج، هشتاد و هفت
    note: مردم رقم‌های تیلفون را به شکل‌های مختلف گروه‌بندی می‌کنند. در این کورس، 06 و بعد گروه‌های دو رقمی استفاده شده؛ وقتی وضاحت مهم باشد، رقم به رقم گفتن هم عادی است.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: نمبر خانه را بپرس
    gloss: نمبر خانهٔ تو چند است؟
    note: Huisnummer نمبری است که در آدرس خانه، کنار نام سرک می‌آید.
  nl.a1.unit02.lesson03.teach.house_number:
    title: نمبر خانه را بگو
    gloss: نمبر خانهٔ من 48 است.
    note: در آدرس یا فورم، نوشتن با رقم طبیعی است.
  nl.a1.unit02.lesson03.teach.live_number:
    title: با نمبر بگو کجا زندگی می‌کنی
    gloss: من در نمبر چهل و هشت زندگی می‌کنم.
    note: وقتی سرک معلوم باشد، Op nummer ... راه طبیعی گفتن نمبر خانه است.
  nl.a1.unit02.lesson03.teach.repeat:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: وقتی نمبر تیلفون تیز گفته شود و نفهمیده باشی، به کار می‌آید.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: پرسیدن سن به شکل غیررسمی
    gloss: عمرت چند سال است؟
    note: این جمله je غیررسمی را دارد؛ پرسیدن سن فقط وقتی مناسب است که موقعیت ایجاب کند.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: گفتن سن
    gloss: من بیست و هشت ساله هستم.
    note: در دری می‌گوییم «من بیست و هشت ساله استم»، اما هالندی می‌گوید Ik ben ... jaar، یعنی «من ... سال استم».
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: سن عمر را بگو
    gloss: عمر سی و دو ساله است.
    note: هنگام گفتن سن، بعد از عدد jaar جمع بسته نمی‌شود.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: پرسیدن تعداد آدم‌ها
    gloss: چند نفر استند؟
    note: Hoeveel درست پیش از اسم mensen می‌آید.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: گفتن تعداد آدم‌ها
    gloss: دوازده نفر استند.
    note: Er zijn ساختار عادی برای «وجود دارند» در حالت جمع است.
  nl.a1.unit02.lesson04.teach.three_books:
    title: شمردن کتاب‌ها
    gloss: من سه کتاب دارم.
    note: 'بعد از عددهای بزرگ‌تر از یک، boek جمع بسته می‌شود: boeken.'
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: شمردن چوکی‌ها
    gloss: هفت چوکی
    note: Stoelen جمع stoel است.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: یورو
    note: 'Euro بعد از مقدار معین معمولاً مفرد می‌ماند: twee euro، نه twee euro''s.'
    example_gloss: قیمتش دو یورو است.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: سنت
    note: Cent هم در قیمت‌ها بعد از عدد معمولاً مفرد می‌ماند.
    example_gloss: این پنجاه سنت است.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: پرسیدن قیمت
    gloss: این چند است؟
    note: Hoeveel مقدار را می‌پرسد و kost یعنی «قیمت دارد».
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: دو یورو و پنجاه
    gloss: €2.50 — دو یورو و پنجاه
    note: در هالندی به‌جای نقطه، ویرگول اعشاری نوشته می‌شود. در گفتار روزمره €2,50 معمولاً twee euro vijftig گفته می‌شود، بدون en.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: هفتاد و پنج سنت
    gloss: €0.75 — هفتاد و پنج سنت
    note: وقتی مقدار کمتر از یک یورو باشد، فقط گفتن سنت طبیعی است.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: دوازده یورو
    gloss: €12 — دوازده یورو
    note: برای قیمتی که یورو کامل باشد، گفتن سنت لازم نیست.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: چهار یورو و پنجاه
    gloss: €4.50 — چهار یورو و پنجاه
    note: همین الگوی گفتاری برای قیمت‌های دیگرِ یورو و سنت هم کار می‌کند.
  nl.a1.unit02.lesson05.teach.costs:
    title: گفتن قیمت
    gloss: قیمتش دو یورو و پنجاه است.
    note: Dat kost ... مستقیم جواب Hoeveel kost dit? است.
  nl.a1.unit02.lesson06.teach.opening:
    title: ثبت‌نام عمر
    gloss: 'کارمند: روز بخیر. برای کافهٔ زبان آمده‌اید؟ عمر: بلی، می‌خواهم ثبت‌نام کنم.'
    note: این صحنه ادامهٔ رفتن‌های عمر به کافهٔ زبان کتابخانه از درس ۱ است.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: گفتن نمبر تیلفون
    gloss: 'کارمند: خوب. نمبر تیلفون تو چند است؟ عمر: 06 21 43 65 87.'
    note: عمر نمبر را در گروه‌های دو رقمی که قبلاً تمرین شد، می‌گوید.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: نمبر خانه را بگو
    gloss: 'کارمند: و نمبر خانهٔ تو چند است؟ عمر: چهل و هشت.'
    note: وقتی پرسش خودش زمینه را می‌دهد، جواب کوتاه فقط با نمبر طبیعی است.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: فهمیدن مبلغ بدل
    gloss: 'کارمند: بدل عضویت دو یورو و پنجاه است. عمر: خوب است.'
    note: قیمت گفتاری از الگوی روزمرهٔ یورو و سنت پیروی می‌کند.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: پرسیدن تعداد اعضای گروه
    gloss: 'عمر: در گروه چند نفر استند؟ کارمند: دوازده.'
    note: این صحنه الگوی پرسش Hoeveel mensen ... را که قبلاً در این درس آمد، دوباره به کار می‌برد.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: پیدا کردن نمبر اتاق
    gloss: 'کارمند: کافهٔ زبان در تالار بیست و یک است.'
    note: Zaal اتاق یا تالاری است که برای یک فعالیت استفاده می‌شود.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: پیدا کردن میز لوته
    gloss: 'لوته: سلام عمر! ما سر میز هفت نشسته‌ایم.'
    note: گفتگو با پیوند دوبارهٔ عمر و لوته در همان فضای غیررسمی تمام می‌شود.
