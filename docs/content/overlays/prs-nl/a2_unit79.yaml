teaching:
  nl.a2.unit79.lesson01.teach.vakantie:
    title: رخصتی‌ها
    gloss: رخصتی / رخصتی تابستان
    note: هر دو کلمه با de می‌آیند. *Vakantie* کلمهٔ عمومی است؛ *de zomervakantie* رخصتی طولانی تابستان است.
    example_gloss:
    - در ماه اگست رخصتی دارم.
    - رخصتی تابستان در ماه جولای شروع می‌شود.
  nl.a2.unit79.lesson01.teach.volgende_week:
    title: چه وقت اتفاق می‌افتد
    gloss: هفتهٔ آینده / سال آینده / به زودی
    note: '*Week* با de می‌آید، پس *volgende week* می‌شود. *Jaar* با het می‌آید، پس *volgend jaar* می‌شود (بدون -e در آخر).'
    example_gloss:
    - هفتهٔ آینده یک قرار ملاقات دارم.
    - سال آینده می‌خواهم به بلجیم بروم.
    - به زودی رخصتی دارم.
  nl.a2.unit79.lesson01.teach.reizen_boeken:
    title: سه فعل سفر
    gloss: سفر کردن / رزرو کردن / ماندن
    note: اینها مصدر استند. *Boeken* به شکل اسم، معنی «کتاب‌ها» را هم می‌دهد، اما اینجا فعل «رزرو کردن» است.
    example_gloss:
    - سفر کردن با ریل را دوست دارم.
    - میخواهم یک اتاق رزرو کنم.
    - یک هفته می‌مانم.
  nl.a2.unit79.lesson01.teach.hotel_camping:
    title: جای ماندن
    gloss: هوتل / کمپ
    note: '*Het hotel* با het می‌آید و *de camping* با de. می‌گویید *op de camping* می‌خوابید، اما *in een hotel*.'
    example_gloss:
    - هوتل نزدیک ساحل است.
    - ما در کمپ می‌خوابیم.
  nl.a2.unit79.lesson01.teach.vraag:
    title: پرسیدن دربارهٔ پلان‌های رخصتی
    gloss: در رخصتی تابستان چه کار می‌کنی؟
    note: 'اینجا *gaan* فعل کمکی است: *ga* در جای دوم و مصدر *doen* در آخر جمله می‌آید.'
  nl.a2.unit79.lesson01.teach.gn_gaan:
    title: 'پلان‌های نزدیک: gaan + مصدر'
    gloss: در ماه اگست به آلمان سفر می‌کنم. یک هوتل رزرو می‌کنم.
    note: 'برای گفتن اینکه می‌خواهین چه کار کنید، یک شکل فعل *gaan* را در جای دوم بگذارین و مصدر را در آخر جمله بیاورید: *Ik ga een hotel boeken*. هر چیز دیگر (زمان، جا، مفعول) در میان می‌آید. اگر کلمهٔ زمان اول بیاید، *ga* باز هم در جای دوم می‌ماند: *Volgende week ga ik een hotel boeken*.'
  nl.a2.unit79.lesson01.teach.hotel_boeken:
    title: رزرو کردن هوتل
    gloss: من می‌خواهم یک هوتل رزرو کنم.
  nl.a2.unit79.lesson02.teach.cursus_verhuizen:
    title: سه پلان برای بعد
    gloss: کورس خواندن / خانه تغییر دادن / پس‌انداز کردن
    note: '*Een cursus volgen* عبارت ثابت برای کورس خواندن است. *Verhuizen* رفتن به یک خانهٔ نو است.'
    example_gloss:
    - می‌خواهم کورس بخوانم.
    - کاکایم می‌خواهد خانه تغییر بدهد.
    - می‌خواهم برای یک بایسکل نو پس‌انداز کنم.
  nl.a2.unit79.lesson02.teach.later_over:
    title: دورتر در آینده
    gloss: بعداً / بعد از یک ماه
    note: '*Over een maand* یعنی «یک ماه بعد از حالا». با مدت‌های دیگر هم کار می‌کند: *over een week*.'
    example_gloss:
    - بعداً می‌خواهم یک خانه بخرم.
    - بعد از یک ماه کورسم شروع می‌شود.
  nl.a2.unit79.lesson02.teach.cursus_begint:
    title: کورسی که شروع می‌شود
    gloss: بعد از یک ماه کورسم شروع می‌شود.
  nl.a2.unit79.lesson02.teach.gn_van_plan:
    title: 'قصد و نیت: van plan zijn om ... te'
    gloss: قصد دارم یک کورس بخوانم.
    note: 'برای گفتن کاری که قصد انجامش را دارید، *ik ben van plan om* را بگویین و بعد بقیهٔ جمله را. مصدر در آخر جمله می‌آید و *te* درست پیش از آن است: *een cursus te volgen*. این برای کارهایی است که می‌خواهین بکنین، نه برای برنامه‌های قطعی.'
  nl.a2.unit79.lesson02.teach.verhuizen:
    title: قصد خانه‌تبدیلی
    gloss: قصد دارم خانه تغییر بدهم.
  nl.a2.unit79.lesson02.teach.sparen:
    title: قصد پس‌انداز
    gloss: قصد دارم پس‌انداز کنم.
  nl.a2.unit79.lesson02.teach.gn_contrast:
    title: Gaan یا van plan zijn؟
    gloss: فردا به بازار می‌روم. بعداً قصد دارم خانه‌ام را تغییر بدهم.
    note: '*Gaan* را برای آیندهٔ نزدیک و قطعی به کار ببرید: *Morgen ga ik naar de markt*. *Van plan zijn* را برای قصدی به کار ببرید که دورتر یا کمتر قطعی است: *Later ben ik van plan om te verhuizen*.'
  nl.a2.unit79.lesson03.teach.misschien:
    title: شاید و حتماً
    gloss: شاید / حتماً
    note: '*Misschien* شک را نشان می‌دهد. *Zeker* یعنی «حتماً» یا «یقیناً».'
    example_gloss:
    - شاید فردا باران ببارد.
    - این حتماً مزه‌دار است.
  nl.a2.unit79.lesson03.teach.dit_jaar:
    title: امسال، این تابستان
    gloss: امسال / این تابستان
    note: '*Jaar* کلمهٔ het است، پس *dit jaar*. *Zomer* کلمهٔ de است، پس *deze zomer*.'
    example_gloss:
    - امسال به رخصتی نمی‌روم.
    - این تابستان در خانه می‌مانم.
  nl.a2.unit79.lesson03.teach.blijf_thuis:
    title: ماندن در خانه
    gloss: این تابستان در خانه می‌مانم.
  nl.a2.unit79.lesson03.teach.gn_misschien:
    title: Misschien و ترتیب کلمات
    gloss: فردا کار می‌روم. شاید بعداً به سینما بروم.
    note: '*Misschien* در آغاز جمله جای اولین جزء را می‌گیرد، پس فعل درست بعد از آن می‌آید: *Misschien ga ik later naar de bioscoop*، نه *Misschien ik ga*. بعد از هر کلمهٔ زمان هم همین‌طور است: *Morgen ga ik werken*.'
  nl.a2.unit79.lesson03.teach.gn_niet:
    title: گفتن اینکه نمی‌روید
    gloss: به سفر تفریحی نمی‌روم. قصد ندارم خانه‌ام را تغییر بدهم.
    note: '*Niet* را بعد از *ga* یا *ben* و پیش از بقیهٔ برنامه بگذارین: *Ik ga niet op vakantie*. با *van plan zijn*، *niet* پیش از *van plan* می‌آید: *Ik ben niet van plan om te verhuizen*.'
  nl.a2.unit79.lesson04.teach.met_wie:
    title: دو عبارت پرسشی
    gloss: با کی / چه مدت
    note: '*Met wie* دربارهٔ کسی می‌پرسد که با او کاری می‌کنین. *Hoe lang* دربارهٔ یک مدت زمان می‌پرسد.'
    example_gloss:
    - با کی به ساحل می‌روی؟
    - چه مدت می‌مانی؟
  nl.a2.unit79.lesson04.teach.waar_naartoe:
    title: کجا می‌روی؟
    gloss: کجا می‌روی؟
    note: '*Naartoe* در آخر سوال می‌آید و جهت را نشان می‌دهد.'
  nl.a2.unit79.lesson04.teach.met_wie_vakantie:
    title: با کی؟
    gloss: با کی به رخصتی می‌روی؟
  nl.a2.unit79.lesson04.teach.hoe_lang_daar:
    title: چه مدت؟
    gloss: آنجا چه قدر وقت می‌مانی؟
  nl.a2.unit79.lesson04.teach.met_mijn_zus:
    title: جواب دادن
    gloss: با خواهرم می‌روم.
  nl.a2.unit79.lesson04.teach.wij_blijven:
    title: ما
    gloss: ما دو هفته می‌مانیم.
  nl.a2.unit79.lesson04.teach.weken:
    title: هفته‌ها
    gloss: یک هفته / دو هفته
    note: جمع *week* می‌شود *weken*.
    example_gloss:
    - یک هفته می‌مانم.
    - ما دو هفته می‌مانیم.
  nl.a2.unit79.lesson04.teach.gn_vragen:
    title: سوال‌ها با gaan
    gloss: کجا می‌روی؟ با کی می‌روی؟ چه مدت می‌مانی؟
    note: 'اول کلمهٔ پرسشی را بگذارین، بعد *ga* در جای دوم، بعد *je*. مصدر، اگر باشد، در آخر می‌آید: *Hoe lang ga je blijven?*'
  nl.a2.unit79.lesson05.teach.noor_bericht:
    title: پیامی از Noor
    gloss: سلام Lotte! به زودی رخصتی دارم. در ماه اگست با خواهرم به بلجیم می‌روم. یک هفته در هوتل می‌مانیم. بعد از آن دو روز پیش والدینم می‌روم. سال آینده قصد دارم یک کورس بخوانم. شاید آن وقت خانه‌ام را هم تغییر بدهم. تو چه کار می‌کنی؟
    note: 'Noor برنامه‌های نزدیک را با *gaan* و قصد درازمدت را با *van plan zijn* بیان می‌کند. توجه کنید که هر مصدر در آخر جملهٔ خود است: *blijven*، *te volgen*، *verhuizen*.'
    glosses:
      binnenkort: به زودی
      vakantie: رخصتی
      augustus: اگست
      zus: خواهر
      naar: به
      belgië: بلجیم
      hotel: هوتل
      blijven: ماندن
      daarna: بعد از آن
      ouders: والدین
      dagen: روزها
      volgend: بعدی
      jaar: سال
      plan: قصد، نقشه (قصد داشتن)
      cursus: کورس
      volgen: دنبال کردن، خواندن (کورس)
      misschien: شاید
      verhuizen: خانه تغییر دادن
      dan: آن وقت
      ook: همچنان / هم
  nl.a2.unit79.lesson06.teach.lotte_vraag:
    title: Lotte از Omar دربارهٔ برنامه‌هایش می‌پرسد
    gloss: 'Lotte: سلام Omar! آیا برای رخصتی‌های تابستان برنامه‌ای داری؟'
  nl.a2.unit79.lesson06.teach.omar_duitsland:
    title: Omar جواب می‌دهد
    gloss: 'Omar: بلی! در ماه اگست به جرمنی می‌روم. یک هوتل رزرو می‌کنم.'
  nl.a2.unit79.lesson06.teach.lotte_met_wie:
    title: Lotte می‌پرسد با کی می‌رود
    gloss: 'Lotte: عالی! با کی می‌روی؟'
  nl.a2.unit79.lesson06.teach.omar_oom:
    title: Omar می‌گوید با کی و چه مدت
    gloss: 'Omar: با کاکایم. یک هفته می‌مانیم.'
  nl.a2.unit79.lesson06.teach.lotte_later:
    title: Lotte دربارهٔ بعد می‌پرسد
    gloss: 'Lotte: و بعداً؟ چه قصدی داری؟'
  nl.a2.unit79.lesson06.teach.omar_cursus:
    title: Omar قصدش را می‌گوید و از او می‌پرسد
    gloss: 'Omar: سال آینده قصد دارم یک کورس بخوانم. و تو؟'
  nl.a2.unit79.lesson06.teach.lotte_antwoord:
    title: Lotte جواب می‌دهد
    gloss: 'Lotte: در ماه جولای کار می‌کنم. شاید بعد از آن پیش والدینم بروم.'
