teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: '*Voelen* در اینجا انعکاسی است (*je*/*me voelen*)؛ *niet lekker* راه عمومی و ملایم گفتن این است که حال آدم درست نیست.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: مریض
    gloss: مریض
    note: صفت پایه که با *zijn* (بودن) به کار می‌رود.
    example_gloss: من مریض استم.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: مریض بودن
    gloss: من مریض استم.
    note: '*Ziek* حالت عمومی‌تر و شدیدتر از *niet lekker* را می‌رساند.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: سردرد
    gloss: سردرد
    note: 'بعد از *hebben* بدون حرف تعریف می‌آید: *Ik heb hoofdpijn*، نه *Ik heb een hoofdpijn*.'
    example_gloss: سردرد دارم.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: در هالندی نشانه‌های مریضی معمولاً با *hebben* (داشتن) می‌آیند.
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: دل‌درد
    gloss: دل‌درد
    note: همان الگوی بدون حرف تعریفِ *hoofdpijn*.
    example_gloss: دل‌درد دارم.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: از همان الگوی *hebben* مثل *hoofdpijn* پیروی می‌کند.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: پرسیدن به شکل عمومی
    gloss: چی شده؟
    note: راه عمومی و همه‌منظوره برای پرسیدن اینکه آیا مشکلی هست.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: یک اصطلاح رایج
    gloss: چی شده؟
    note: '*Scheelt eraan* یک اصطلاح ثابت است (تقریباً نزدیک به «در این مورد چی کم است»)؛ آن را کلمه به کلمه ترجمه نکنین.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: گلودرد
    gloss: گلودرد
    note: همان الگوی بدون حرف تعریفِ *hoofdpijn*/*buikpijn*.
    example_gloss: گلودرد دارم.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *hebben* مثل نشانه‌های دیگر پیروی می‌کند.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: خبر گرفتن از کسی
    gloss: حالت خوب است؟ نه، حالم خوب نیست.
    note: '*Gaat het?* پرسش بسیار رایج و دوستانه برای احوال‌پرسی میان دوستان است.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: تب
    gloss: تب
    note: مثل نشانه‌های دیگر، بعد از *hebben* بدون حرف تعریف می‌آید.
    example_gloss: تب دارم.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *hebben* پیروی می‌کند.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: زکام بودن
    gloss: زکام بودن
    note: صفتی است که با *zijn* می‌آید، نه اسمی که با *hebben* بیاید -- جای اشتباه رایج.
    example_gloss: من زکام استم.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: گفتن اینکه زکام استید
    gloss: من زکام استم.
    note: در هالندی *zijn* + *verkouden* به کار می‌رود، نه «داشتن» + اسم؛ *Ik heb een verkouden* نگویید.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn یا hebben به نوع کلمه بستگی دارد، نه به مدت حالت
    gloss: 'Ziek و verkouden صفت اند و با zijn می‌آیند: مریض هستم، سرما خورده‌ام. Koorts و hoofdpijn اسم اند و با hebben می‌آیند.'
    note: انتخاب بین *zijn* و *hebben* به نوع دستوری کلمه (صفت یا اسمِ نشانه) بستگی دارد، نه به موقتی بودن حالت -- *koorts* (اسم) به اندازه‌ی *verkouden* (صفت) موقتی است، ولی باز هم *hebben* می‌گیرد، نه *zijn*.
  nl.a1.unit16.lesson04.teach.apotheek:
    title: دواخانه
    gloss: دواخانه
    note: 'اسمی با حرف تعریف عمومی: *de apotheek*.'
    example_gloss: من به دواخانه می‌روم.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: سلام‌واحوال‌پرسی دواخانه‌دار
    gloss: چطور کمک‌تان کنم؟
    note: '*Waarmee kan ik u helpen?* سلام رسمی و معمول در خدمات است و همان رسمیت *u* را از درس‌های واحد ۱ و ۱۵ ادامه می‌دهد.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: خواستن چیزی برای یک نشانه مریضی
    gloss: برای سردرد چیزی دارید؟
    note: '*Iets tegen* + نشانه، راه طبیعی برای خواستن دوا است.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: یک قرص
    gloss: یک قرص
    note: 'اسم خنثی: *het tablet*، هرچند اینجا نامعین و به شکل *een tablet* آمده است.'
    example_gloss: من یک قرص می‌خورم.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: دستور استفاده از دوا
    gloss: روزانه دو بار یک قرص بخور.
    note: '*Neem* فعل امر *nemen* (گرفتن) است و برای دستورها به کار می‌رود.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: زبان رسمی در دواخانه
    gloss: در دواخانه شکل مؤدبانه‌ی u را به کار ببرید.
    note: دواخانه‌دار یک بزرگسالِ ناآشنا در نقش خدماتی است، همان قاعده‌ی رسمیت باجه‌ی تکت در واحد ۱۵.
  nl.a1.unit16.lesson05.teach.advies:
    title: خواندن یک نصیحت دواخانه
    gloss: 'نصیحت: روزی دو بار یک قرص با آب بخور. خوب استراحت کن و آب زیاد بنوش. بعد از سه روز هم‌چنان احساس خوبی نداری؟ پس نزد دکتر برو.'
    note: به مقدار دوا، دو توصیهٔ دیگر غیر از دوا و وقت رفتن نزد دکتر توجه کن.
    glosses:
      Advies: نصیحت
      neem: گرفتن
      keer: بار
      dag: روز
      tablet: قرص
      Rust: استراحت کن
      drink: بنوش
      Voel: احساس کردن
      steeds: هنوز
      lekker: خوب
      huisarts: دکتر
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte احوال می‌گیرد
    gloss: 'Lotte: سلام Omar، حالت چطور است؟ حالا بهتر شدی؟'
    note: '*Al* (حالا/قبلاً) نشان می‌دهد که Lotte می‌پرسد آیا Omar از آخرین صحبت‌شان بهتر شده است.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar هنوز مریض است
    gloss: 'Omar: هنوز آنقدر خوب نیستم. هنوز هم سرم درد می‌کند و خسته هستم.'
    note: '*Nog steeds* (هنوز هم) نشان می‌دهد که سردردِ قبلی خوب نشده؛ *moe* (خسته) یک صفت تازه و مفید است.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte درباره‌ی دوا می‌پرسد
    gloss: 'Lotte: قرص خوردی؟'
    note: '*Genomen* اسم مفعولِ *nemen* است، با همان الگوی *heb* + اسم مفعول از واحد ۱۲.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar تأیید می‌کند
    gloss: 'Omar: بلی، یک قرص خوردم. حالا می‌روم استراحت کنم.'
    note: '*Ga nu rusten* (حالا می‌روم استراحت کنم) از الگوی آینده‌ی نزدیک *gaan* + مصدر استفاده می‌کند.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte برایش آرزوی صحتمندی می‌کند
    gloss: 'Lotte: فکر خوبی است. خوب استراحت کن. زود صحتیاب شوی!'
    note: '*Beterschap!* عبارت ثابت و معمول برای آرزوی صحتیابی زودِ کسی است.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar خداحافظی می‌کند
    gloss: 'Omar: تشکر، تا فردا!'
    note: '*Tot morgen!* همان الگوی *tot* + زمان را از خداحافظی‌های واحدهای قبلی تکرار می‌کند.'
