course:
  title: هالندی A2
  description: دستور زبان هلندی سطح A2 برای بیان دلیل و نتیجه.
  learning_goal: با omdat، want و dus در یک پیام دلیل و نتیجه را بیان کنید.
units:
  nl.a2.unit92.omdat_want_dus:
    title: چون، زیرا، پس
    description: با گفتن دلیل و نتیجه، بهانه یا تغییر پلان را توضیح بدهین.
lessons:
  nl.a2.unit92.lesson01.reden_en_gevolg:
    title: دلیل و نتیجه
  nl.a2.unit92.lesson02.omdat_werkwoord_achteraan:
    title: 'Omdat: فعل در آخر'
  nl.a2.unit92.lesson03.omdat_want_of_dus:
    title: Omdat، want یا dus؟
  nl.a2.unit92.lesson04.afspraak_verzetten:
    title: تغییر وقت وعده
  nl.a2.unit92.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit92.lesson06.lotte_en_omar:
    title: Lotte و Omar
teaching:
  nl.a2.unit92.lesson01.teach.klachten:
    title: دلیل‌های نیامدن
    gloss: مریض / خسته / مصروف / سردرد
    note: این کلمه‌ها اغلب دلیل را می‌رسانند.
    example_gloss:
    - من مریض استم.
    - Omar خسته است.
    - Lotte مصروف است.
    - سردرد دارم.
  nl.a2.unit92.lesson01.teach.plannen:
    title: پلان، کار و هوا
    gloss: وعده / کار / هوا / قطار
    note: وعده، کار و هوا دلیل‌های معمول برای تغییر پلان استند.
    example_gloss:
    - من با Noor وعده دارم.
    - من کار زیاد دارم.
    - هوا خراب است.
    - باران می‌بارد.
    - قطار دیر کرده است.
  nl.a2.unit92.lesson01.teach.gevolgen:
    title: آنچه بعد می‌آید
    gloss: ماندن / آمدن / در خانه / بعداً / نه
    note: این کلمه‌ها می‌گویند که شما به‌خاطر یک دلیل چه کار می‌کنین.
    example_gloss:
    - من در خانه می‌مانم.
    - Omar در خانه می‌ماند.
    - من بعداً می‌آیم.
    - من نمی‌آیم.
  nl.a2.unit92.lesson01.teach.gn_reden_gevolg:
    title: دلیل و نتیجه
    gloss: 'نتیجه: من در خانه می‌مانم. دلیل: باران می‌بارد. یک پیام، هم دلیل را می‌گوید و هم نتیجه را.'
    note: دلیل می‌گوید چرا. نتیجه می‌گوید به‌خاطر آن دلیل چه اتفاق می‌افتد. در این درس هر دو را در یک پیام می‌آورید.
  nl.a2.unit92.lesson01.teach.gn_want:
    title: want دلیل را می‌رساند
    gloss: 'با want دلیل را می‌گویید. ترتیب کلمه‌ها تغییر نمی‌کند: من در خانه می‌مانم، چون باران می‌بارد.'
    note: '*Want* دو جملهٔ اصلی عادی را به هم وصل می‌کند. هر جمله ترتیب همیشگی‌اش را نگه می‌دارد: در *het regent* فعل در جای دوم است.'
  nl.a2.unit92.lesson01.teach.gn_dus:
    title: dus نتیجه را می‌رساند
    gloss: 'با dus نتیجه را می‌گویید: باران می‌بارد، پس من در خانه می‌مانم.'
    note: '*Dus* دو جملهٔ اصلی را وصل می‌کند: *het regent, dus ik blijf thuis*. در این درس الگوی *dus ik ...* را تمرین می‌کنین.'
  nl.a2.unit92.lesson01.teach.zinnen:
    title: دو پیام کامل
    gloss: من خسته هستم، پس در خانه می‌مانم. من نمی‌آیم، چون سردرد دارم.
  nl.a2.unit92.lesson02.teach.waarom:
    title: چرا و چون
    gloss: چرا / چون
    note: '*Waarom* دلیل را می‌پرسد؛ *omdat* جواب را شروع می‌کند.'
    example_gloss:
    - چرا نمی‌آیی؟
    - چون مریض هستم.
    - چرا در خانه می‌مانی؟
    - چون باران می‌بارد.
  nl.a2.unit92.lesson02.teach.modaal:
    title: باید، توانستن و امشب
    gloss: باید / توانستن / کار کردن / امشب
    note: این فعل‌ها در بهانه‌ها زیاد استفاده می‌شوند.
    example_gloss:
    - من باید کار کنم.
    - من امشب نمی‌توانم بیایم.
    - Omar باید کار کند.
  nl.a2.unit92.lesson02.teach.gn_omdat:
    title: omdat فعل را به آخر می‌فرستد
    gloss: 'بعد از omdat فعل صرف‌شده آخر جمله می‌آید: چون باران می‌بارد؛ چون مریض هستم؛ چون قرار ملاقات دارم.'
    note: '*Omdat* یک جملهٔ پیرو را شروع می‌کند. فعل صرف‌شده به آخر جمله می‌رود: *omdat ik ziek ben*، نه *omdat ik ben ziek*.'
  nl.a2.unit92.lesson02.teach.gn_omdat_modaal:
    title: دو فعل در آخر جمله
    gloss: 'با moeten یا kunnen دو فعل در آخر می‌آیند: چون باید کار کنم؛ چون نمی‌توانم بیایم.'
    note: 'در جملهٔ پیرو هر دو فعل در آخر می‌آیند و فعل کمکی اول است: *moet werken*، *kan komen*.'
  nl.a2.unit92.lesson02.teach.zinnen:
    title: دو جمله با omdat
    gloss: من در خانه می‌مانم چون مریض هستم. من نمی‌آیم چون باید کار کنم.
  nl.a2.unit92.lesson03.teach.woorden:
    title: زمان و افسوس
    gloss: امروز / فردا / متأسفانه / افسوس
    note: '*Helaas* و *jammer* اکثراً بهانه را شروع می‌کنند.'
    example_gloss:
    - امروز من در خانه می‌مانم.
    - فردا من بعداً می‌آیم.
    - متأسفانه من سردرد دارم.
    - افسوس، من نمی‌توانم بیایم.
  nl.a2.unit92.lesson03.teach.gn_contrast:
    title: omdat در برابر want و dus
    gloss: 'Omdat: فعل در آخر می‌آید. Want: ترتیب کلمه‌ها تغییر نمی‌کند. Dus: نتیجه را می‌رساند.'
    note: '*Omdat* و *want* یک معنا دارند، اما ترتیب کلمه‌هایشان فرق می‌کند: *omdat ik ziek ben* ولی *want ik ben ziek*.'
  nl.a2.unit92.lesson03.teach.gn_voorop:
    title: جملهٔ omdat در آغاز
    gloss: 'اگر جملهٔ omdat اول بیاید، جملهٔ اصلی با فعل شروع می‌شود و بعد نهاد می‌آید: چون باران می‌بارد، من در خانه می‌مانم.'
    note: 'بعد از جملهٔ *omdat* که در آغاز آمده، در جملهٔ اصلی جای فعل و نهاد عوض می‌شود: *blijf ik thuis*. *Want* این کار را نمی‌کند: *want ik blijf thuis*، نه *want blijf ik thuis*.'
  nl.a2.unit92.lesson03.teach.zinnen:
    title: جملهٔ omdat اول
    gloss: چون باران می‌بارد، من در خانه می‌مانم. چون ریل دیر کرده، من بعداً می‌آیم.
  nl.a2.unit92.lesson04.teach.verzetten:
    title: تغییر دادن یک برنامه
    gloss: ببخشین / همکار / به وقت دیگر انداختن / وقت
    note: با این کلمه‌ها می‌توانین مؤدبانه قرار را لغو کنید و وقت تازه پیشنهاد بدهین.
    example_gloss:
    - ببخشین، من نمی‌توانم بیایم.
    - همکارم مریض است.
    - می‌شود وعده را به وقت دیگر بگذاریم؟
    - فردا وقت داری؟
  nl.a2.unit92.lesson04.teach.gn_bericht:
    title: پیامی با دلیل و نتیجه
    gloss: 'یک پیام خوب «ببخشین»، یک نتیجه، یک دلیل و یک سؤال دارد: ببخشین، من نمی‌توانم بیایم، چون باید کار کنم. می‌شود قرار را به وقت دیگر بیندازیم؟'
    note: اول نتیجه را بگویین (*ik kan niet komen*)، بعد با *omdat* یا *want* دلیل را اضافه کنید، و آخر یک سؤال بپرسین.
  nl.a2.unit92.lesson04.teach.collega:
    title: اول دلیل، بعد نتیجه
    gloss: همکارم مریض است، پس من باید کار کنم.
  nl.a2.unit92.lesson05.teach.woorden:
    title: کلمه‌ها برای پیام
    gloss: همچنین / شدید / پس‌فردا / خدا نگهدار (خداحافظی دوستانه)
    note: این کلمه‌ها در پیام Noor آمده‌اند.
    example_gloss:
    - همچنین باران می‌بارد.
    - باران شدید می‌بارد.
    - پس فردا وقت داری؟
    - خدا نگهدار، Omar.
  nl.a2.unit92.lesson05.teach.reading:
    title: Noor برنامه را تغییر می‌دهد
    gloss: سلام Lotte، ببخشین، من امشب نمی‌توانم بیایم، چون سردرد دارم. همچنین باران شدید می‌بارد، پس در خانه می‌مانم. فردا هم نمی‌توانم، چون باید کار کنم. پس‌فردا وقت داری؟ می‌شود قرار را به وقت دیگر بیندازیم؟ خدا نگهدار، Noor
    note: در هر جمله دلیل و نتیجه را پیدا کنید.
    glosses:
      Hoi: سلام
      vanavond: امشب
      hoofdpijn: سردرد
      ook: همچنان / هم
      hard: شدید
      overmorgen: پس‌فردا
      groetjes: خدا نگهدار
      verzetten: به وقت دیگر انداختن
  nl.a2.unit92.lesson06.teach.lotte_vraagt:
    title: لوته می‌پرسد
    gloss: سلام Omar، امشب می‌آیی؟
  nl.a2.unit92.lesson06.teach.omar_nee:
    title: Omar نمی‌پذیرد
    gloss: نه، ببخشین، من نمی‌توانم بیایم.
  nl.a2.unit92.lesson06.teach.lotte_waarom:
    title: Lotte دلیل را می‌پرسد
    gloss: چرا نمی‌آیی؟
  nl.a2.unit92.lesson06.teach.omar_reden:
    title: Omar دلیل و نتیجه را می‌گوید
    gloss: چون همکارم مریض است. او نمی‌تواند کار کند، پس من امشب کار می‌کنم.
  nl.a2.unit92.lesson06.teach.lotte_verzetten:
    title: Lotte تغییر را پیشنهاد می‌کند
    gloss: افسوس! می‌شود قرار را به وقت دیگر بیندازیم؟
  nl.a2.unit92.lesson06.teach.omar_graag:
    title: Omar قبول می‌کند و می‌پرسد
    gloss: بلی، خوب است. تو فردا وقت داری؟
  nl.a2.unit92.lesson06.teach.lotte_morgen:
    title: Lotte یک روز را قبول می‌کند
    gloss: بلی، فردا وقت دارم.
exercises:
  nl.a2.unit92.lesson01.exercise01.choose_want:
    instruction: جملهٔ هلندی را که معنایش با جملهٔ داده‌شده یکی است انتخاب کنید.
    correct_option: Ik blijf thuis, want ik ben ziek.
    distractors:
    - Ik blijf thuis, dus ik ben ziek.
    - Ik ben ziek, want ik blijf thuis.
    - Ik blijf thuis, want ik ben niet ziek.
    accepted_answers:
    - value: Ik blijf thuis, want ik ben ziek.
      status: correct
    feedback: '*Want ik ben ziek* دلیل را می‌گوید؛ جملهٔ اصلی *Ik blijf thuis* می‌گوید چه اتفاق می‌افتد.'
    prompt_blocks:
    - من در خانه می‌مانم، چون مریض استم.
  nl.a2.unit92.lesson01.exercise02.choose_dus:
    instruction: جملهٔ هلندی را که معنایش با جملهٔ داده‌شده یکی است انتخاب کنید.
