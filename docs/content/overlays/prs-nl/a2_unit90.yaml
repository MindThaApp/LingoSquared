course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر گرامر برای دادن و جواب دادن به مشوره‌های ساده.
  learning_goal: مشوره دادن با je moet، je zou ... moeten، het is beter om ... te و waarom ... niet، و جواب دادن به مشوره.
units:
  nl.a2.unit90.goede_raad:
    title: مشورهٔ خوب
    description: دادن مشوره و جواب دادن به آن دربارهٔ مشکلات صحی، درسی و پولی.
lessons:
  nl.a2.unit90.lesson01.je_moet_rusten:
    title: باید استراحت کنی
  nl.a2.unit90.lesson02.je_zou_moeten:
    title: خوب می‌شد
  nl.a2.unit90.lesson03.moet_zou_of_beter:
    title: باید، خوب می‌شد یا بهتر است
  nl.a2.unit90.lesson04.waarom_niet:
    title: چرا نه؟
  nl.a2.unit90.lesson05.bericht_van_lotte:
    title: پیامی از Lotte
  nl.a2.unit90.lesson06.lotte_en_omar:
    title: Lotte و Omar
teaching:
  nl.a2.unit90.lesson01.teach.gezondheid:
    title: کلمه‌های صحت
    gloss: سردرد / داکتر / دواخانه / مریض / خسته
    note: این کلمه‌ها یک مشکل کوچک صحی را بیان می‌کنند.
    example_gloss:
    - سردرد دارم.
    - من مریضم.
    - من خسته استم.
  nl.a2.unit90.lesson01.teach.werkwoorden:
    title: فعل‌ها برای مشوره
    gloss: استراحت کردن / خوابیدن / نوشیدن / رفتن / آب
    note: بعد از *moet*، فعل کار به شکل مصدر می‌ماند و معمولاً در آخر جمله می‌آید.
    example_gloss:
    - من آب می‌نوشم.
    - من به دواخانه می‌روم.
    - من زیاد می‌خوابم.
  nl.a2.unit90.lesson01.teach.gn_je_moet:
    title: دادن مشورهٔ قوی با je moet
    gloss: باید استراحت کنی. باید آب بنوشی. باید پیش داکتر بروی.
    note: 'مشورهٔ قوی و مستقیم: *je moet* + بقیهٔ جمله + مصدر در آخر جمله. *Moeten* مصدر است؛ با *je* به شکل *moet* می‌آید.'
  nl.a2.unit90.lesson01.teach.jij:
    title: Je یا jij
    gloss: تو باید استراحت کنی. تو هم باید استراحت کنی.
    note: '*Je* و *jij* هر دو به معنای «تو» اند؛ *jij* کمی تأکیدی‌تر است.'
  nl.a2.unit90.lesson01.teach.vraag:
    title: مشوره خواستن
    gloss: من چه کنم؟ (مشوره خواستن)
    note: '*Doen* مصدر است و در آخر جمله می‌آید.'
  nl.a2.unit90.lesson02.teach.studie:
    title: کلمات درسی
    gloss: امتحان / کار خانگی / درس خواندن، یاد گرفتن / تمرین کردن / هر روز / فردا
    note: '*Leren* هم به معنای درس خواندن آمده می‌تواند و هم یاد گرفتن.'
    example_gloss:
    - من فردا امتحان دارم.
    - من کار خانگی‌ام را می‌کنم.
  nl.a2.unit90.lesson02.teach.geld:
    title: کلمات پول
    gloss: پول / پس‌انداز کردن / خرچ کردن / کمتر / بیشتر / کم
    note: با این کلمات می‌توانین دربارهٔ مشکلات پولی صحبت کنید.
    example_gloss:
    - من پول کم دارم.
    - می‌خواهم بیشتر پس‌انداز کنم.
  nl.a2.unit90.lesson02.teach.gn_zou_moeten:
    title: 'مشورهٔ نرم‌تر دادن: je zou ... moeten'
    gloss: خوب می‌شود استراحت کنی. خوب می‌شود آب بنوشی. خوب می‌شود کمتر پول خرچ کنی.
    note: 'مشورهٔ نرم‌تر: *je zou* + بقیهٔ جمله + *moeten* + مصدر. *Moeten* و مصدر در آخر جمله با هم می‌آیند: *moeten drinken*، *moeten uitgeven*.'
  nl.a2.unit90.lesson02.teach.problemen:
    title: دو مشکل
    gloss: من پول کم دارم. من فردا امتحان دارم.
  nl.a2.unit90.lesson03.teach.tijd:
    title: کلمات زمان
    gloss: زود / دیر / هفته / امروز / بستر
    note: برای خواب رفتن از *naar bed gaan* استفاده کنید.
    example_gloss:
    - من امروز زود می‌خوابم.
    - من هر هفته پس‌انداز می‌کنم.
  nl.a2.unit90.lesson03.teach.gn_beter_om:
    title: Het is beter om ... te (مشوره)
    gloss: بهتر است زود بخوابی. بهتر است هر هفته پس‌انداز کنی.
    note: 'مشورهٔ آرام و بی‌طرف: *Het is beter om* + بقیه + *te* + مصدر در آخر. کلمهٔ *te* درست پیش از مصدر می‌آید.'
  nl.a2.unit90.lesson03.teach.gn_contrast:
    title: سه راه مشوره دادن
    gloss: باید استراحت کنی. خوب می‌شود استراحت کنی. بهتر است استراحت کنی.
    note: 'سه درجهٔ مشوره: *je moet* قوی است، *je zou ... moeten* نرم‌تر است و *het is beter om ... te* آرام و بی‌طرف است. وقتی مطمئن نیستین، با دوستان از شکل‌های نرم‌تر استفاده کنید.'
  nl.a2.unit90.lesson03.teach.voorbeelden:
    title: مثال‌های بیشتر
    gloss: بهتر است آب بنوشی. بهتر است هر روز تمرین کنی.
  nl.a2.unit90.lesson04.teach.woorden:
    title: مشکل، مشوره، نکته
    gloss: مشکل / مشوره / نکته
    note: '*Advies* کلمهٔ عمومی برای مشوره است؛ برای یک مشورهٔ کوچک معمولاً *een tip* می‌گویند.'
    example_gloss:
    - من یک مشکل دارم.
    - این یک نکتهٔ خوب است.
  nl.a2.unit90.lesson04.teach.gn_waarom_niet:
    title: Waarom ... niet? به عنوان مشوره
    gloss: چرا پیش داکتر نمی‌روی؟ چرا کمی بیشتر پس‌انداز نمی‌کنی؟ چرا هر روز تمرین نمی‌کنی؟
    note: 'راه دوستانهٔ پیشنهاد دادن: *Waarom* + فعل + *je* + *niet* + بقیه. فعل درست بعد از *waarom* و پیش از *je* می‌آید.'
  nl.a2.unit90.lesson04.teach.gn_reageren:
    title: جواب دادن به مشوره
    gloss: فکر خوب است. این کار را می‌کنم. از نکته‌ات تشکر.
    note: 'راه‌های کوتاه جواب دادن به مشوره: *Goed idee* (خوشت آمده)، *Dat doe ik* (این کار را می‌کنی)، *Bedankt voor de tip* (از آن شخص تشکر می‌کنی).'
  nl.a2.unit90.lesson04.teach.zin:
    title: کمک خواستن
    gloss: من یک مشکل دارم. چه کنم؟
  nl.a2.unit90.lesson05.teach.lezen:
    title: مشورهٔ لوته
    gloss: سلام عمر، از پیامت تشکر. تو سردردی داری و خسته استی. امروز باید استراحت کنی و آب زیاد بنوشی. خوب می‌شود کمتر قهوه هم بنوشی. بهتر است زود بخوابی. چرا فردا پیش داکتر نمی‌روی؟ دوست تو، لوته
    note: لوته به عمر هر سه نوع مشوره را می‌دهد و یک پیشنهاد *waarom ... niet?* هم.
  nl.a2.unit90.lesson06.teach.omar_probleem:
    title: Omar مشکلش را می‌گوید
    gloss: 'عمر: سلام لوته، من یک مشکل دارم. سردردی دارم.'
  nl.a2.unit90.lesson06.teach.lotte_rusten:
    title: لوته مشورهٔ قوی می‌دهد
    gloss: 'لوته: چه بد! باید استراحت کنی و آب بنوشی.'
  nl.a2.unit90.lesson06.teach.omar_idee:
    title: عمر مشوره را می‌پذیرد و مشکل دومی را هم می‌گوید
    gloss: 'عمر: فکر خوب است. من پول هم کم دارم.'
  nl.a2.unit90.lesson06.teach.lotte_geld:
    title: لوته مشورهٔ نرم‌تر و بی‌طرف می‌دهد
    gloss: 'لوته: خوب می‌شود کمتر پول خرچ کنی. بهتر است هر هفته پس‌انداز کنی.'
  nl.a2.unit90.lesson06.teach.omar_bedankt:
    title: عمر وعده می‌دهد و تشکر می‌کند
    gloss: 'عمر: این کار را می‌کنم. از نکته‌هایت تشکر!'
  nl.a2.unit90.lesson06.teach.lotte_bed:
    title: لوته با یک پیشنهاد ختم می‌کند
    gloss: 'لوته: خواهش می‌کنم! چرا زود نمی‌خوابی؟'
exercises:
  nl.a2.unit90.lesson01.exercise01.kies_rusten:
    instruction: جملهٔ هالندی را انتخاب کنید که معنایش «باید استراحت کنی» است.
    correct_option: Je moet rusten.
    distractors:
    - Je moet slapen.
    - Je moet water drinken.
    - Ik moet rusten.
    accepted_answers:
    - value: Je moet rusten.
      status: correct
    feedback: '*Je moet rusten* = باید استراحت کنی.'
    prompt_blocks:
    - باید استراحت کنی.
  nl.a2.unit90.lesson01.exercise02.kies_dokter:
    instruction: جملهٔ هالندی را انتخاب کنید که معنایش «باید پیش داکتر بروی» است.
    correct_option: Je moet naar de dokter gaan.
    distractors:
    - Je moet naar de apotheek gaan.
    - Ik moet naar de dokter gaan.
    - Je naar de dokter moet gaan.
    accepted_answers:
