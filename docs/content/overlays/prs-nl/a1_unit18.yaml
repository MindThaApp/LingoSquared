teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: آپارتمان، اتاق نشیمن، اتاق خواب
    gloss: آپارتمان، اتاق نشیمن، اتاق خواب
    note: '*Het appartement* اسم خنثی است؛ *de woonkamer* و *de slaapkamer* اسم‌های غیرخنثی (عام) اند.'
    example_gloss:
    - من یک آپارتمان دارم.
    - من یک اتاق نشیمن دارم.
    - من یک اتاق خواب دارم.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: آشپزخانه، تشناب‌خانه
    gloss: آشپزخانه، تشناب‌خانه
    note: '*De keuken* و *de badkamer* هر دو اسم‌های غیرخنثی (عام) اند.'
    example_gloss:
    - من یک آشپزخانه دارم.
    - من یک حمام دارم.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: گفتن اینکه آپارتمان دارید
    gloss: من یک آپارتمان دارم.
    note: '*Hebben* (داشتن) فعل طبیعی برای گفتن این است که چه خانه‌ای دارید، درست مثل «داشتن» در دری. این یک مثال عمومی است؛ اپارتمان مشخص عمر (در اوترخت) بعداً در همین بخش معرفی می‌شود.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: شمردن همه اتاق‌ها
    gloss: من یک اتاق نشیمن، یک اتاق خواب، یک آشپزخانه و یک حمام دارم.
    note: هر چهار اتاقی که در لغات این درس آمده در یک جمله ذکر شده است؛ با کامه از هم جدا شده‌اند و پیش از آخرین مورد *en* آمده.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: پرسیدن تعداد اتاق‌ها
    gloss: شما چند اتاق دارید؟
    note: '*Hoeveel* (چند / چقدر) همان الگوی سوال مقدار را که در درس‌های قبلی عددها بود، دوباره به کار می‌برد.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: گفتن تعداد اتاق‌ خواب
    gloss: من دو اتاق خواب دارم.
    note: '*Slaapkamers* جمع *slaapkamer* است که به شکل منظم با -s ساخته می‌شود.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: گفتن تعداد کل اتاق‌ها
    gloss: آپارتمان سه اتاق دارد.
    note: '*Kamers* کلمهٔ عمومی برای اتاق‌ها است و فقط به خوابگاه‌ها محدود نیست.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: بالکن، باغچه
    gloss: بالکن، باغچه
    note: '*Het balkon* خنثی است؛ *de tuin* اسم غیرخنثی (عام) است.'
    example_gloss:
    - یک بالکن هست.
    - باغچه نیست.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: گفتن اینکه چیزی وجود دارد
    gloss: یک بالکن هست.
    note: '*Er is* ساختار معمول هالندی برای گفتن وجود چیزی است، مثل «وجود دارد» یا «هست» در دری.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: گفتن اینکه چیزی وجود ندارد
    gloss: باغچه نیست.
    note: '*Geen* اسم نامعین را منفی می‌کند -- *geen tuin*، نه *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: دنج
    gloss: دنج
    note: صفتی بسیار رایج و خاص هالندی برای فضای گرم و دلچسپ؛ برابر دقیق یک کلمهٔ مشخص دری نیست.
    example_gloss: آپارتمان کوچک است ولی دنج.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: یک الگوی رایج برای توصیف
    gloss: آپارتمان کوچک است ولی دنج.
    note: '*Klein maar gezellig* راه بسیار رایج و طبیعی است که هالندی‌زبان‌ها یک خانهٔ کوچک را به شکل مثبت توصیف می‌کنند.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: توصیف اندازهٔ یک اتاق
    gloss: اتاق نشیمن بزرگ است.
    note: '*Groot* یک اتاق مشخص را توصیف می‌کند، نه تمام خانه را.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: توصیف اندازهٔ اتاقی دیگر
    gloss: آشپزخانه کوچک است.
    note: همان الگوی *groot* در کارت قبلی، اما برای اتاق دیگری و با *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: خواندن اعلان خانه
    gloss: 'اپارتمان در اوترخت: یک خوابگاه، یک اتاق نشیمن، یک آشپزخانه و یک تشناب. بالکن دارد، اما باغچه ندارد. اپارتمان کوچک است، اما دلچسپ.'
    note: به تعداد اتاق‌ها، امکاناتی که هست یا نیست، و برداشت کلی توجه کنید.
    glosses:
      Appartement: آپارتمان
      slaapkamer: اتاق خواب
      woonkamer: اتاق نشیمن
      keuken: آشپزخانه
      badkamer: تشناب
      balkon: بالکن
      tuin: باغچه
      klein: کوچک
      gezellig: دنج
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: لوته دربارهٔ اپارتمان می‌پرسد
    gloss: 'لوته: سلام عمر، اپارتمان نوی تو در اوترخت چطور است؟'
    note: '*Nieuwe* شکل صرف‌شدهٔ *nieuw* (نو) است که پیش از اسم می‌آید.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: عمر آن را توصیف می‌کند
    gloss: 'عمر: کوچک است، اما دلچسپ. یک خوابگاه، یک اتاق نشیمن، یک آشپزخانه و یک تشناب دارم.'
    note: دقیقاً با اعلان خانه که در درس پنجم خوانده شد مطابقت دارد -- این اپارتمان واقعی عمر است.
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: لوته دربارهٔ بالکن می‌پرسد
    gloss: 'لوته: بالکن داری؟'
    note: یک سوال مستقیم بلی/نه که *heb je ...?* را از بخش‌های قبلی دوباره به کار می‌برد.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: عمر جواب می‌دهد
    gloss: 'عمر: بلی، بالکن دارم، اما باغچه ندارم.'
    note: با حقیقت بالکن/بدون باغچه در اعلان درس پنجم مطابقت دارد.
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: استفاده از hij برای عمر
    gloss: 'به‌جای عمر می‌توانین hij هم بگویین: او بالکن دارد.'
    note: وقتی عمر در گفتگو معرفی شد، *hij* (او) می‌تواند جای نام او بیاید.
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: لوته با گرمی واکنش نشان می‌دهد
    gloss: 'لوته: چه خوب! یک وقت زود پیشت می‌آیم.'
    note: '*Komen langs* (سر زدن / دیدن کردن) فعل جداشدنی است؛ *langs* به آخر جمله می‌رود.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: عمر او را خوش‌آمد می‌گوید
    gloss: 'عمر: خوب است، همیشه خوش آمدی.'
    note: '*Altijd welkom* راه گرم و طبیعی برای دعوت دوبارهٔ کسی است.'
