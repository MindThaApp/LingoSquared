teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: ساختن درجهٔ تفضیلی
    gloss: در مقایسه‌ها معمولاً -er را به صفت اضافه می‌کنین و dan را به کار می‌برید.
    note: '*Dan* در هالندی معادل «از» در مقایسه است و همیشه بعد از صفتِ تفضیلی می‌آید.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: بزرگ، کوچک
    gloss: بزرگ، کوچک
    note: '*Groot* و *klein* صفت‌های پایه‌اند، پیش از اضافه شدن -er.'
    example_gloss:
    - بکس پشتی بزرگ است.
    - کیف کوچک است.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: بکس پشتی بزرگ‌تر است
    gloss: بکس پشتی از کیف بزرگ‌تر است.
    note: '*Groter* از *groot* + *er* ساخته شده؛ *dan* چیز دوم مقایسه را معرفی می‌کند.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: کیف کوچک‌تر است
    gloss: کیف از بکس پشتی کوچک‌تر است.
    note: '*Kleiner* از *klein* + *er* ساخته شده، با همان الگو.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: قیمت بکس پشتی
    gloss: بکس پشتی چهل و پنج یورو قیمت دارد.
    note: '*Kost* شکل سوم شخص مفرد *kosten* به معنی «قیمت داشتن» است.'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: قیمت کیف
    gloss: کیف بیست یورو قیمت دارد.
    note: قیمتی پایین‌تر از بکس پشتی، که زمینهٔ مقایسهٔ بعدی را آماده می‌کند.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: گران، ارزان
    gloss: گران، ارزان
    note: '*Duur* و *goedkoop* صفت‌های پایه‌اند، پیش از اضافه شدن *-der* یا *-er*.'
    example_gloss:
    - بکس پشتی گران است.
    - کیف ارزان است.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: بکس پشتی گران‌تر است
    gloss: بکس پشتی از کیف گران‌تر است.
    note: '*Duurder* از *duur* + *der* ساخته شده. بعد از کلمه‌یی که به r ختم می‌شود، در هالندی *-der* اضافه می‌شود، نه *-er*.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: کیف ارزان‌تر است
    gloss: کیف از بکس پشتی ارزان‌تر است.
    note: '*Goedkoper* از *goedkoop* + *er* ساخته شده، عکسِ جملهٔ قبلی.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: مقایسهٔ برابر
    gloss: برای برابر مقایسه کردن دو چیز، net zo و صفت و als را به کار ببرید.
    note: این ساختار در هالندی مثل «به اندازهٔ ... » در دری است.
  nl.a1.unit14.lesson03.teach.mooi:
    title: به اندازهٔ هم قشنگ
    gloss: این بکس پشتی به اندازهٔ آن کیف قشنگ است.
    note: '*Mooi* (قشنگ) بدون تغییر بین *net zo* و *als* می‌آید؛ در این الگو -er نمی‌گیرد.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: به اندازهٔ هم کاربردی
    gloss: بکس پشتی به اندازهٔ کیف کاربردی است.
    note: هر صفت ساده می‌تواند در همین جای *net zo ... als* بیاید.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: ساختن درجهٔ عالی
    gloss: برای درجهٔ عالی معمولاً het و صفت و st را به کار می‌برید.
    note: این شکل (که بعد از *is* می‌آید) صرف‌نظر از جنسیت اسم، *het* می‌گیرد.
  nl.a1.unit14.lesson04.teach.duurst:
    title: گران‌ترین از میان دو تا
    gloss: از بین این دو، کوله‌پشتی از همه گران‌تر است.
    note: '*Duurst* از *duur* + *st* ساخته می‌شود. در هالندی حتی وقتی فقط دو چیز را باهم مقایسه می‌کنیم، می‌شود از صفت عالی کار گرفت. در دری هم گاهی می‌گوییم «از این دو، بهترین آن».'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'بی‌قاعده: goed، beter، best'
    gloss: '«Goed، beter، best» بی‌قاعده اند: این بهترین انتخاب است. «Veel، meer، meest» هم به همین شکل کار می‌کند.'
    note: در دری هم «خوب، بهتر، بهترین» و «زیاد، زیادتر، زیادترین» از قاعدهٔ عادی پیروی نمی‌کنند. در هالندی هم هر دو زنجیره (*goed/beter/best* و *veel/meer/meest*) از قاعدهٔ عادی -er/-st پیروی نمی‌کنند.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: بهترین انتخاب برای سفر
    gloss: این کوله‌پشتی بهترین انتخاب برای یک سفر طولانی با ریل است.
    note: '*Beste* شکل صفت پیش از اسم است و پسوند -e می‌گیرد؛ صفت‌های هالندی معمولاً پیش از اسم این پسوند را می‌گیرند.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: جای بیشتر
    gloss: کوله‌پشتی از بیگ جای بیشتر دارد.
    note: '*Meer* صفت تفضیلی بی‌قاعدهٔ *veel* (زیاد) است، مثل «زیادتر» که در دری شکل دیگری دارد.'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: یک اعلان دوکان را بخوانین
    gloss: 'کوله‌پشتی Bergsport: چهل و پنج یورو. این کوله‌پشتی بزرگ و محکم است. بیگ شانه‌ای Stad: بیست یورو. این بیگ از کوله‌پشتی کوچک‌تر و سبک‌تر است، ولی کم‌تر محکم است. برای سفر طولانی، کوله‌پشتی بهترین انتخاب است، چون محکم‌تر است و جای بیشتر دارد.'
    note: به قیمت، اندازه و محصولی که اعلان پیشنهاد می‌کند و دلیلش توجه کنید.
    glosses:
      Rugzak: کوله‌پشتی
      vijfenveertig: چهل و پنج
      euro: یورو
      groot: بزرگ
      sterk: محکم
      Schoudertas: بیگ شانه‌ای
      twintig: بیست
      tas: بیگ
      kleiner: کوچک‌تر
      lichter: سبک‌تر
      minder: کم‌تر
      lange: دراز
      reis: سفر
      beste: بهترین
      keuze: انتخاب
      sterker: محکم‌تر
      ruimte: جا
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: لوته اندازه را نشان می‌دهد
    gloss: 'لوته: ببین، این کوله‌پشتی از آن بیگ بزرگ‌تر است.'
    note: '*Kijk* (ببین) راه معمول برای جلب توجه کسی به یک چیز است.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: عمر توضیح می‌دهد چرا به آن ضرورت دارد
    gloss: 'عمر: بلی، و جای بیشتر هم دارد. برای سفر با ریل یک بیگ بزرگ ضرورت دارم.'
    note: '*Nodig hebben* (ضرورت داشتن) یک ترکیب ثابت است؛ چیزی که به آن ضرورت داریم بین *hebben* و *nodig* می‌آید.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: لوته انتخاب را تأیید می‌کند
    gloss: 'لوته: پس کوله‌پشتی بهترین انتخاب برای تو است.'
    note: '*Dan* در اینجا به معنی «پس / در آن صورت» است، نه *dan*ی مقایسه از درس اول؛ املای هر دو یکی است.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: عمر نظر لوته را می‌پرسد
    gloss: 'عمر: دقیقاً. به نظر تو کدام بیگ از همه قشنگ‌تر است؟'
    note: '*Vind jij het mooist* همان الگوی بیان نظر از درس‌های *vinden* در واحد ۱۳ است.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: لوته بیگ شانه‌ای را انتخاب می‌کند
    gloss: 'لوته: به نظر من این بیگ شانه‌ای از همه قشنگ‌تر است. و سبک هم است.'
    note: '*Licht* (سبک از نظر وزن) یک صفت تازه و مفید برای توصیف بیگ و بار سفر است.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: آن‌ها تصمیم را نهایی می‌کنند
    gloss: 'عمر: خوب، پس من کوله‌پشتی را می‌خرم و تو بیگ شانه‌ای را.'
    note: در جملهٔ دوم فعل تکراری *koop* حذف شده است؛ در هالندی گفتاری وقتی از متن معلوم باشد، این کار طبیعی است. در دری هم همین‌طور فعل تکراری را می‌اندازیم.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop و koopt
    gloss: Koop شکل «من» فعل kopen (خریدن) است؛ koopt شکل «او» است.
    note: 'الگوی عادی زمان حال: *ik koop*، *jij/hij/zij koopt*.'
