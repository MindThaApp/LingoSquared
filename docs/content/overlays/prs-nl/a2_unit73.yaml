teaching:
  nl.a2.unit73.lesson01.teach.vacature:
    title: بست خالی
    gloss: بست خالی / جای کار
    note: 'اسم با جنس عام: de vacature.'
    example_gloss: نینا یک بست خالی را آنلاین می‌بیند.
  nl.a2.unit73.lesson01.teach.solliciteren_voor:
    title: درخواست دادن برای یک بست خالی
    gloss: می‌خواهم برای این بست خالی درخواست بدهم.
    note: Wil graag درخواست را نرم‌تر می‌کند؛ solliciteren voor جفت ثابت فعل و حرف اضافه برای درخواست دادن به چیزی است.
  nl.a2.unit73.lesson01.teach.kantoor_bloem_zoekt:
    title: شرکت نیازش را بیان می‌کند
    gloss: دفتر بلوم یک کارمند اداری می‌خواهد.
    note: Zoekt (از zoeken، جستجو کردن) فعل معمولی است که اعلان کار برای بیان بست خالی به کار می‌برد.
  nl.a2.unit73.lesson02.teach.sollicitatiegesprek:
    title: مصاحبهٔ کاری
    gloss: مصاحبهٔ کاری
    note: 'اسم خنثی: het sollicitatiegesprek، که معنای تحت‌اللفظی آن «گفتگوی درخواست» است.'
    example_gloss: مصاحبهٔ کاری هفتهٔ آینده است.
  nl.a2.unit73.lesson02.teach.afspraak_maken:
    title: خواستن وقت ملاقات
    gloss: آیا می‌توانم برای مصاحبهٔ کاری وقت ملاقات بگیرم؟
    note: Een afspraak maken voor همان الگوی وقت گرفتن را از واحد 46 دوباره به کار می‌برد.
  nl.a2.unit73.lesson02.teach.natuurlijk_dinsdag:
    title: تعیین وقت
    gloss: البته، می‌توانین روز سه‌شنبه ساعت ده بیایین؟
    note: Langskomen (آمدن و سر زدن) همان فعل جدا‌شدنی است که در تماس woningcorporatie در واحد 28 دیدید.
  nl.a2.unit73.lesson03.teach.ervaring:
    title: تجربه
    gloss: تجربه
    note: 'اسم با جنس عام: de ervaring.'
    example_gloss: من به حیث داوطلب تجربه دارم.
  nl.a2.unit73.lesson03.teach.vaardigheid:
    title: مهارت
    gloss: مهارت
    note: 'اسم با جنسیت مشترک: de vaardigheid.'
    example_gloss: تایپ کردن یک مهارت مهم است.
  nl.a2.unit73.lesson03.teach.ervaring_bibliotheek:
    title: بیان تجربهٔ مشخص
    gloss: من در کتابخانه به حیث داوطلب تجربه دارم.
    note: Als vrijwilliger (به حیث داوطلب) نقش را بیان می‌کند؛ in de bibliotheek همان کتابخانهٔ واحد ۴۷ را دوباره به کار می‌برد.
  nl.a2.unit73.lesson03.teach.goede_vaardigheden:
    title: بیان مهارت‌های عمومی
    gloss: من مهارت‌های خوب دارم.
    note: Vaardigheden شکل جمع vaardigheid است.
  nl.a2.unit73.lesson04.teach.beschikbaar:
    title: خالی
    gloss: خالی؛ در دسترس
    note: یک صفت؛ چه قبل از zijn بیاید چه بعد از آن، تغییر نمی‌کند.
    example_gloss: نینا از روز دوشنبه در دسترس است.
  nl.a2.unit73.lesson04.teach.werktijden:
    title: اوقات کار
    gloss: ساعات کار
    note: 'اسم جمع: de werktijden، همیشه به شکل جمع استعمال می‌شود.'
    example_gloss: ساعات کار چه وقت است؟
  nl.a2.unit73.lesson04.teach.beschikbaar_dagen:
    title: بیان روزهای مشخص آمادگی
    gloss: من روزهای دوشنبه، چهارشنبه و جمعه وقت دارم.
    note: Op + فهرست روزها نشان می‌دهد که کدام روزها وقت آزاد دارید.
  nl.a2.unit73.lesson04.teach.werktijden_precies:
    title: پرسیدن سوال برای روشن شدن موضوع
    gloss: اوقات کار دقیقاً چیست؟
    note: Precies (دقیقاً) سوال را مشخص‌تر می‌سازد؛ در مصاحبه یک سوال پیگیری طبیعی است.
  nl.a2.unit73.lesson05.teach.vacature_tekst:
    title: خواندن یک اعلان کار
    gloss: 'Kantoor Bloem یک کارمند اداری می‌خواهد. تجربه در تماس با مشتری یک امتیاز است. اوقات کار: دوشنبه، چهارشنبه و جمعه، از ساعت نُه تا پنج. برای مصاحبهٔ کاری زنگ بزنید.'
    note: عنوان وظیفه، تجربهٔ ترجیحی و روزها و ساعت‌های کار را دنبال کنید.
    glosses:
      zoekt: می‌خواهد، دنبال ... می‌گردد (از zoeken)
      administratief: اداری
      medewerker: کارمند / همکار
      Ervaring: تجربه
      klantcontact: تماس با مشتری
      pre: امتیاز / برتری (اصطلاح معمول در اعلان‌های کاری هلندی)
      Werktijden: اوقات کار
      maandag: دوشنبه
      woensdag: چهارشنبه
      vrijdag: جمعه
      negen: نُه
      tot: تا
      vijf: پنج
      uur: ساعت
      Bel: زنگ بزنید (امر از bellen)
      sollicitatiegesprek: مصاحبهٔ کاری
  nl.a2.unit73.lesson05.teach.ervaring_klantcontact:
    title: بیان تجربهٔ مرتبط
    gloss: من در تماس با مشتری تجربه دارم.
    note: Klantcontact (تماس با مشتری) همان کلمهٔ اعلان کار است.
  nl.a2.unit73.lesson06.teach.jansen_greet:
    title: خانم یانسن به نینا خوش‌آمد می‌گوید
    gloss: 'خانم یانسن: صبح بخیر، به Kantoor Bloem خوش آمدید. لطفاً دربارهٔ تجربهٔ تان برایم بگویین.'
    note: Vertelt u eens over... راه معمول و رسمی برای شروع سوال مصاحبه است.
  nl.a2.unit73.lesson06.teach.nina_ervaring:
    title: نینا تجربهٔ خود را شرح می‌دهد
    gloss: 'نینا: صبح بخیر. من به حیث داوطلب در کتابخانه تجربه دارم. آنجا با مشتریان زیاد تماس داشتم.'
    note: Had گذشتهٔ ساده از hebben است و اینجا برای دورهٔ تمام‌شدهٔ کار داوطلبانه به کار رفته است.
  nl.a2.unit73.lesson06.teach.jansen_beschikbaar:
    title: خانم یانسن دربارهٔ آمادگی می‌پرسد
    gloss: 'خانم یانسن: خوب است. روزهای دوشنبه، چهارشنبه و جمعه وقت دارید؟'
    note: تقریباً همان جملهٔ آموزشی درس ۴ است، این بار به شکل سوال.
  nl.a2.unit73.lesson06.teach.nina_dat_kan:
    title: نینا تأیید می‌کند و خودش می‌پرسد
    gloss: 'نینا: بلی، ممکن است. اوقات کار دقیقاً چیست؟'
    note: Dat kan (ممکن است) راه طبیعی تأیید آمادگی پیش از پرسیدن سوال بعدی است.
  nl.a2.unit73.lesson06.teach.jansen_uren_contact:
    title: خانم یانسن جواب می‌دهد و صحبت را ختم می‌کند
    gloss: 'خانم یانسن: از ساعت نُه تا پنج. ما همین هفته با شما تماس می‌گیریم.'
    note: Contact met u op nemen همان ساختار فعل جداشدنی تماس woningcorporatie در واحد ۲۸ را دوباره به کار می‌برد.
  nl.a2.unit73.lesson06.teach.nina_dank_gesprek:
    title: نینا از خانم یانسن تشکر می‌کند
    gloss: 'نینا: بابت مصاحبه تشکر.'
    note: Dank u wel همان تشکر رسمی است که در سراسر کورس A2 به کار رفته است.
  nl.a2.unit73.lesson06.teach.summary_grammar:
    title: خلاصهٔ مصاحبه
    gloss: نینا در Kantoor Bloem درخواست کار داد. او به حیث داوطلب در کتابخانه تجربه دارد.
    note: Heeft ... gesolliciteerd شکل ماضی نقلی solliciteren است (gesolliciteerd صفت فعلی گذشته است)؛ zij ضمیر شخص سوم مفرد «او» برای زن است.
