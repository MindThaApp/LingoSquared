teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: تکت
    gloss: تکت
    note: '*Het kaartje* اسم خنثی است؛ از *het* استفاده کنید، نه *de*.'
    example_gloss: من یک تکت به اوترخت می‌خواهم.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: تکت خواستن
    gloss: من یک تکت به اوترخت می‌خواهم.
    note: '*Wil graag* درخواست را مؤدبانه‌تر می‌سازد، همان الگویی که در بخش ۶ برای سفارش غذا دیدیم.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: کارمند می‌پرسد کدام نوع
    gloss: تکت یک‌طرفه می‌خواهین یا رفت و برگشت؟
    note: '*Wilt u* شکل محترمانهٔ فعل *willen* برای «شما» است و اینجا برای کارمند ناآشنای ایستگاه به کار می‌رود.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: مؤدبانه جواب دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*Alstublieft* «لطفاً»ی محترمانه است و با سطح محترمانهٔ *u* در این گفتگو می‌خواند.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: شیوه سخن گفتن در کانتر
    gloss: نزد باجه معمولاً شکل محترمانهٔ u را به کار می‌برید.
    note: 'تفاوت *jij*/*je* و *u* که در بخش ۱ آمد ادامه دارد: با کسانی که ناآشنا استند و کار خدماتی می‌کنند، معمولاً *u* گفته می‌شود.'
  nl.a1.unit15.lesson02.teach.perron:
    title: پلاتفورم
    gloss: پلاتفورم
    note: '*Het perron* خنثی است؛ از *het* استفاده کنید، نه *de*.'
    example_gloss: ریل اوترخت از کدام پلت‌فورم حرکت می‌کند؟
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: پرسیدن از پلاتفورم
    gloss: ریل اوترخت از کدام پلت‌فورم حرکت می‌کند؟
    note: '*Van welk perron* مخصوصاً پلت‌فورم را می‌پرسد، نه یک جای عمومی را.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: گفتن معلومات حرکت
    gloss: ریل ساعت ده کم یک چارک از پلاتفورم پنج حرکت می‌کنه.
    note: '*Kwart voor tien* همان الگوی گفتن وقت در بخش ۴ است.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: پرسیدن از وقت رسیدن
    gloss: ریل ساعت چند می‌رسه؟
    note: '*Komt ... aan* فعل جداشونده است (*aankomen*)؛ *aan* در آخر سوال می‌آید.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: گفتن وقت رسیدن
    gloss: ریل ساعت یازده می‌رسه.
    note: '*Komt aan* دوباره نشان می‌دهد که دو بخش فعل جداشونده در جمله از هم جدا می‌شوند.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: به وقت / تأخیر
    gloss: به وقت؛ تأخیر
    note: '*Op tijd* عبارت ثابت است و یعنی کاری مطابق وقت مقرر شود. *De vertraging* (تاخیر) اسم با جنسیت de است.'
    example_gloss:
    - ریل به وقت حرکت نمی‌کنه.
    - 'توجه: ریل اوترخت تاخیر دارد.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: یک اعلان
    gloss: 'توجه: ریل اوترخت تاخیر دارد.'
    note: '*Let op* (لفظاً «توجه کنید») اعلان ایستگاه را شروع می‌کند، مثل «توجه کنید، مسافران محترم» در دری.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: منفی کردن «به وقت»
    gloss: ریل به وقت حرکت نمی‌کنه.
    note: '*Niet* درست پیش از *op tijd* می‌آید تا کل عبارت را منفی کند.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: تغییر پلاتفورم
    gloss: ریل به جای پلاتفورم پنج، از پلاتفورم سه حرکت می‌کنه.
    note: '*In plaats van* یعنی «به جای».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: گفتن اندازهٔ تأخیر
    gloss: ریل ده دقیقه تأخیر دارد.
    note: '*Heeft vertraging* (لفظاً «تاخیر دارد») راه طبیعی گفتن تاخیر است، در کنار صفت *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: دروازه، خروجی، اتاق انتظار
    gloss: ورودی؛ خروجی؛ اتاق انتظار
    note: '*De ingang*، *de uitgang* و *de wachtruimte* همه اسم‌های با جنسیت de استند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - اتاق انتظار کجاست؟
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: پرسیدن جای پلاتفورم
    gloss: پلاتفورم هفت کجاست؟
    note: این الگوی *Waar is...?* از درس‌های پرسیدن راه در بخش ۹ است.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: آدرس دادن
    gloss: مستقیم بروید و بعد به راست.
    note: '*Rechtdoor* و *rechts* همان کلمه‌های جهت در بخش ۹ استند که اینجا در ایستگاه دوباره به کار رفته‌اند.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: پرسیدن از اتاق انتظار
    gloss: اتاق انتظار کجاست؟
    note: همان الگوی سؤال برای یک جای تازه.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: خواندن تکت چاپ‌شده
    gloss: 'تکت: امستردام مرکزی به اوترخت مرکزی. حرکت: ده و ده دقیقه، پلت‌فورم هفت. رسیدن: ده دقیقه به یازده. رفت و برگشت. قیمت: دوازده یورو و چهل.'
    note: وقت حرکت و پلاتفورم، وقت رسیدن، نوع تکت و قیمت را دنبال کنید.
    glosses:
      Kaartje: تکت
      Vertrek: حرکت
      tien: ده
      perron: پلاتفورم
      zeven: هفت
      Aankomst: رسیدن
      elf: یازده
      Retour: تکت رفت و برگشت
      Prijs: قیمت
      twaalf: دوازده
      euro: یورو
      veertig: چهل
  nl.a1.unit15.lesson06.teach.omar_open:
    title: عمر نقشه را می‌گوید
    gloss: 'عمر: ما باید به پلت‌فورم هفت برویم. ریل ساعت ده و ده دقیقه حرکت می‌کند.'
    note: '*Moeten* (باید) اینجا ضرورت عملی را می‌رساند، نه اجبار سخت.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: لوته تخته را می‌خواند
    gloss: 'لوته: ببین، تخته آنجاست: تاخیر، ده دقیقه.'
    note: '*Daar staat* (لفظاً «آنجا ایستاده») راه طبیعی گفتن این است که تخته چیزی را نشان می‌دهد.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: عمر آرام می‌ماند
    gloss: 'عمر: مشکلی نیست، هنوز برای یک قهوه وقت داریم.'
    note: '*Geen probleem* جملهٔ دلداری‌دهندهٔ عادی و غیررسمی است.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: ریل می‌رسد
    gloss: 'لوته: فکر خوب است. اوه، ریل همین حالا آمد. پلت‌فورم هفت، درست!'
    note: '*Al* (همین حالا/قبلاً) نشان می‌دهد که ریل با وجود تاخیرِ اعلان‌شده زودتر از انتظار رسید.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: سوار ریل می‌شوند
    gloss: 'عمر: بیا، سوار شویم. اوترخت، ما آمدیم!'
    note: '*Stappen in* (سوار شدن) فعل جداشونده است؛ *in* به آخر جمله می‌رود. *We komen eraan* (لفظاً «ما به آن می‌آییم») راه طبیعی هالندی برای گفتن «ما آمدیم!» است و ترجمهٔ کلمه به کلمه‌اش عجیب به نظر می‌رسد.'
