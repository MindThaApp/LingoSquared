  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: پرسیدن از هوا
    gloss: هوا چطور است؟
    note: '*Wat voor* + اسم یعنی «چه نوع». این یک پرسش عمومی بسیار معمول است.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: آفتابی
    gloss: هوا آفتابی است.
    note: '*Het is* + صفت هوا الگوی معمول است و در آن ضمیر بی‌فاعل *het* به کار می‌رود.'
  nl.a1.unit19.lesson01.teach.regent:
    title: باران
    gloss: باران می‌بارد.
    note: '*Regenen* (باریدن) بی‌فاعل به کار می‌رود: *het regent*؛ صفت جداگانه لازم نیست.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: ابری
    gloss: هوا ابری است.
    note: از همان الگوی *het is* + صفت پیروی می‌کند، مثل *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: سرد
    gloss: امروز هوا سرد است.
    note: '*Vandaag* (امروز) توصیف هوا را به زمان وصل می‌کند.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: امروز هوا گرم است.
    note: '*Warm* در صحبت روزمرهٔ هالندی دربارهٔ هوا هم «گرم» و هم «داغ» را می‌رساند.'
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: مقایسهٔ دما
    gloss: هوا سرد نیست، گرم است.
    note: '*Niet* درست پیش از صفت می‌آید و *koud* را منفی می‌کند.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا
    note: 'اسم خنثی: *het weerbericht*؛ ترکیبی از *weer* (هوا) و *bericht* (گزارش).'
    example_gloss: پیش‌بینی هوا چیست؟
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: هوای فردا
    gloss: فردا هوا آفتابی است.
    note: '*Morgen* (فردا) به اول جمله می‌آید، به همین دلیل بعد از آن *is het* جابه‌جا می‌شود.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: پیش‌بینی دو روز
    gloss: شنبه هوا آفتابی و گرم است، ولی یکشنبه تمام روز باران می‌بارد.
    note: '*De hele dag* (تمام روز) طولانی بودن باران را تأکید می‌کند.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: قدم‌زدن
    gloss: قدم‌زدن
    note: 'اسم با جنس معمول: *de wandeling*.'
    example_gloss: برویم قدم بزنیم؟
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: پیشنهاد قدم زدن
    gloss: برویم قدم بزنیم؟
    note: '*Zullen we...?* همان الگوی پیشنهاد نقشه در بخش ۱۱ است؛ *een wandeling maken* (به معنی لفظی «یک قدم‌زنی ساختن») شکل ثابت برای «قدم زدن» است.'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: برنامهٔ شرطی
    gloss: اگر باران ببارد، داخل می‌مانیم.
    note: '*Als* (اگر) شرط را معرفی می‌کند؛ چون جملهٔ als اول آمده، در جملهٔ اصلی *blijven we binnen* فاعل و فعل جابه‌جا می‌شوند.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: موافقت و پیشنهاد
    gloss: فکر خوب است! برویم قدم بزنیم.
    note: '*Laten we...* (بیایین...) راه معمول دیگری برای پیشنهاد یک کار است، در کنار *Zullen we...?* از بخش ۱۱.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: خواندن پیش‌بینی دو روز
    gloss: 'پیش‌بینی هوا: شنبه هوا آفتابی و گرم است. یکشنبه تمام روز باران می‌بارد.'
    note: دقت کنید که هر روز چه وضعیتی دارد.
    glosses:
      Weerbericht: پیش‌بینی هوا
      zaterdag: شنبه
      zonnig: آفتابی
      warm: گرم
      Zondag: یکشنبه
      regent: باران می‌بارد
      hele: تمام
      dag: روز
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte دربارهٔ آخر هفته می‌پرسد
    gloss: 'Lotte: آخر این هفته هوا چطور است؟'
    note: '*Dit weekend* (آخر این هفته) پرسش را به آیندهٔ نزدیک وصل می‌کند.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar گزارش هوا را می‌گوید
    gloss: 'Omar: روز شنبه هوا آفتابی و گرم است، ولی یکشنبه تمام روز باران می‌بارد.'
    note: دقیقاً با پیش‌بینی‌ای که در درس پنجم خواندید یکی است.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte یک نقشه پیشنهاد می‌کند
    gloss: 'Lotte: پس روز شنبه قدم بزنیم؟'
    note: '*Dan* (پس) پیشنهاد را مستقیم به هوای خوبی که Omar گفت وصل می‌کند.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar موافقت می‌کند و برای یکشنبه نقشه می‌کشد
    gloss: 'Omar: فکر خوب است. و یکشنبه خوش و راحت در خانه می‌مانیم.'
    note: '*Lekker* در اینجا کلمهٔ تزئینی است و معنی‌اش چیزی مثل «خوش و راحت» است؛ پیش از صفت یا فعل می‌آید تا جمله دلچسب‌تر شود.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte نقشه را نهایی می‌کند
    gloss: 'Lotte: عالی، پس فلم تماشا می‌کنیم.'
    note: '*Kijken* (تماشا کردن) به طور طبیعی با *een film* (یک فلم) می‌آید.'
