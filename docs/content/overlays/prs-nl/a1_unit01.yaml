teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: سلام و های
    gloss: سلام
    note: '*Hallo* عادی است و هم در دیدارهای غیررسمی و هم در دیدارهای رسمی کار می‌رود. *Hoi* رایج و غیررسمی است.'
    example_gloss:
    - سلام، شما اینجا تازه‌وارد استید؟
    - سلام، من نور استم.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: '«تو/شما»: شکل غیررسمی و رسمی'
    gloss: تو (غیررسمی، با تأکید) / تو (غیررسمی، بدون تأکید) / شما (رسمی)
    note: '*Jij* شکل غیررسمی مفرد است و وقتی روی کلمه تأکید یا مقایسه باشد استفاده می‌شود. *Je* شکل معمول غیررسمی مفرد بدون تأکید در گفتار روزمره است. *U* فاصلهٔ احترام را نشان می‌دهد. در هالند با بعضی اشخاص بزرگسال ناشناس و در روابط کاملاً رسمی طبیعی است، ولی jij/je در بسیاری از دکان‌ها و محل‌های کار بین بزرگسالان هم رایج است.'
    example_gloss:
    - تو اینجا تازه آمده‌ای؟ (غیررسمی، با تأکید)
    - تو اینجا تازه آمده‌ای. (غیررسمی، بدون تأکید)
    - شما اینجا تازه آمده‌اید؟ (رسمی)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: پرسیدن از هم‌سن که تازه آمده یا نه
    gloss: تو اینجا تازه آمده‌ای؟
    note: 'در سوال، *jij bent* به *ben jij* تبدیل می‌شود: وقتی *jij* بعد از فعل بیاید، -t می‌افتد.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: پرسیدن رسمی که کسی تازه آمده یا نه
    gloss: شما اینجا تازه آمده‌اید؟
    note: با *u* باید *bent u* گفت. -t می‌ماند.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: انتخاب شکل «تو/شما»
    gloss: 'jij/je: غیررسمی · u: رسمی یا محترمانه'
    note: '*jij/je* را با دوستان، هم‌سن‌ها، کودکان و در بسیاری از محیط‌های آزاد امروزی استفاده کنید. *u* را وقتی استفاده کنید که رابطه احترام یا فاصله می‌خواهد؛ ترجیح‌ها فرق می‌کند، پس از طرف مقابل پیروی کنید.'
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: سلام صبح، چاشت و شام
    gloss: صبح بخیر / روز بخیر (بعد از چاشت) / شام بخیر
    note: '*Goedemorgen* در صبح تا نزدیک ظهر گفته می‌شود. *Goedemiddag* از نزدیک ظهر تا آخر بعد از چاشت گفته می‌شود. *Goedenavond* سلام وقت شام است.'
    example_gloss:
    - صبح بخیر! چطور استی؟
    - روز بخیر، چطور استید؟ (رسمی)
    - شام بخیر! شما اینجا تازه آمده‌اید؟
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: احوال چطور است؟
    gloss: شما چطور استید؟
    note: '*Hoe gaat het?* راه عادی و معمولی برای پرسیدن احوال است.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: چطور استی؟ غیررسمی
    gloss: شما چطور استید؟
    note: '*Met je* شخص مخاطب را روشن و غیررسمی می‌سازد.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: چطور استید؟ رسمی
    gloss: شما چطور استید؟
    note: وقتی دیدار خطاب رسمی می‌خواهد، *met u* را استفاده کنید.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'خوبم، تشکر: غیررسمی'
    gloss: خوبم، تشکر.
    note: '*Dank je* با خطاب غیررسمی جور است.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'خوبم، تشکر: رسمی'
    gloss: خوبم، تشکر.
    note: '*Dank u* با خطاب رسمی جور است.'
  nl.a1.unit01.lesson02.teach.prima:
    title: عالی
    gloss: عالی / خوب
    note: '*Prima* یک جواب کوتاه و مثبت است.'
    example_gloss: عالی، تشکر.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: بد نیست
    gloss: بد نیست
    note: '*Niet slecht* معمولاً یک جواب نسبتاً مثبت است.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: و تو؟ غیررسمی
    gloss: و شما؟
    note: '*Jou* بعد از *met* شکل غیررسمی با تأکید است.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: و شما؟ رسمی
    gloss: و شما؟
    note: '*U* سوال برگشتی را رسمی نگه می‌دارد.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: پرسیدن نام به شکل غیررسمی
    gloss: نام شما چیست؟
    note: '*Hoe heet je?* سوال عادی غیررسمی برای پرسیدن نام است.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: پرسیدن نام به شکل رسمی
    gloss: نام شما چیست؟
    note: '*Hoe heet u?* محترمانه است؛ *Wat is uw naam?* راه رسمی دیگری است که بیشتر اداری به نظر می‌رسد و اینجا آزمایش نمی‌شود.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: گفتن نام خود
    gloss: نام من نور است.
    note: '*Ik heet ...* راه مستقیم و معیاری برای گفتن نام است.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: معرفی طبیعی خود
    gloss: من نور استم.
    note: '*Ik ben ...* به‌خصوص در معرفی‌های شفاهی رایج است.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: نام من
    gloss: نام من نور است.
    note: '*Mijn naam is ...* درست است، ولی کمی صریح‌تر از *Ik ben ...* یا *Ik heet ...* است.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: از آشنایی خوشحال شدم
    gloss: از آشنایی با شما خوشحال شدم.
    note: این جمله در اولین دیدار دوستانه و طبیعی است.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: خوشبخت شدم
    gloss: خوشبخت شدم
    note: '*Aangenaam* رسمی و قراردادی است و از *Leuk je te ontmoeten* رسمی‌تر است.'
    example_gloss: خوشبخت شدم! من نور استم.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: پرسیدن اینکه کسی از کجاست
    gloss: شما از کجا استید؟
    note: '*Kom je* شکل غیررسمی سوال است.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: پرسیدن رسمی اینکه کسی از کجاست
    gloss: شما از کجا استید؟
    note: 'با *u* فعل *komt* می‌شود: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: از هالند
    gloss: من از هالند استم.
    note: قبل از نام کشور اصلی، *uit* را استفاده کنید.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: از بلجیم
    gloss: من از بلجیم استم.
    note: در *België* بالای e دوم دو نقطه است.
  nl.a1.unit01.lesson04.teach.from_germany:
    title: از آلمان
    gloss: من از آلمان استم.
    note: '*Duitsland* نام کشور است؛ *Duits* نام زبان است.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: تابعیت هالندی
    gloss: من هالندی استم.
    note: '*Nederlands* هم تابعیت را می‌رساند و هم زبان هالندی را؛ در دری هم «هالندی» به همین دو معنا می‌آید.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: تابعیت بلجیمی
    gloss: من بلجیمی استم.
    note: '*Belgisch* در اینجا تابعیت بلجیمی را می‌رساند.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: هالندی صحبت کردن
    gloss: من هالندی صحبت می‌کنم.
    note: در هالندی نام زبان‌ها با حرف بزرگ نوشته می‌شود، که در دری چنین چیزی نیست.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: انگلیسی صحبت کردن
    gloss: من انگلیسی صحبت می‌کنم.
    note: '*Engels* در هالندی برای زبان انگلیسی گفته می‌شود.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: آلمانی صحبت کردن
    gloss: من آلمانی صحبت می‌کنم.
    note: '*Duits* در هالندی برای زبان آلمانی گفته می‌شود.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: کافهٔ زبان و کتابخانه
    gloss: کافهٔ زبان / کتابخانه
    note: '*taalcafé* یک گردهمایی آرام برای تمرین هالندی با دیگران است. کتابخانه‌های عمومی هالند اغلب برنامه‌های محلی، از جمله کافهٔ زبان، دایر می‌کنند.'
    example_gloss:
    - من برای کافهٔ زبان اینجا استم.
    - من در کتابخانه هالندی یاد می‌گیرم.
  nl.a1.unit01.lesson05.teach.location:
    title: محل دیدار
    gloss: کافهٔ زبان در کتابخانه است.
    note: این جمله صحنهٔ گفتگو را معرفی می‌کند.
  nl.a1.unit01.lesson05.teach.here_for:
    title: پرسیدن دربارهٔ برنامهٔ مشترک
    gloss: تو برای کافهٔ زبان اینجا استی؟
    note: وقتی دو نفر برای یک برنامه می‌آیند، این یک شروع غیررسمی و طبیعی است.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: تأیید کردن برنامه
    gloss: بلی، من برای کافهٔ زبان اینجا استم.
    note: جواب، برنامه را واضح تکرار می‌کند.
  nl.a1.unit01.lesson05.teach.learning:
    title: گفتن اینکه چه یاد می‌گیرین
    gloss: من هالندی یاد می‌گیرم.
    note: '*Leer* شکل اول شخص مفرد فعل *leren* به معنای یاد گرفتن است.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: من هم
    gloss: من هم.
    note: '*Ik ook* راه کوتاه و طبیعی برای گفتن یک موضوع مشترک است.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: پرسیدن اینکه بار اول کسی است یا نه
    gloss: این بار اولت است؟
    note: این گپ دوستانه در برنامه‌ای است که تکرار می‌شود.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: گفتن اینکه بار اول شما است
    gloss: بلی، این بار اولم است.
    note: '*Mijn* یعنی «مال من».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: لوته صحبت را شروع می‌کند
    gloss: 'لوته: سلام، من لوته استم. نام تو چیست؟'
    note: لوته در این جمع دوستانه از *je* غیررسمی استفاده می‌کند.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: عمر نامش را می‌گوید
    gloss: 'عمر: نامم عمر است. از دیدنت خوش شدم.'
    note: او به سوال نام جواب می‌دهد و از آشنایی ابراز خوشی می‌کند.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: لوته درباره‌ی محل اصلی می‌پرسد
    gloss: 'لوته: من هم! تو از کجا استی؟'
    note: '*Jou ook!* جواب کوتاه و طبیعی برای *Leuk je te ontmoeten* است.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: عمر می‌گوید از کجا است
    gloss: 'عمر: من از مصر استم. و تو؟'
    note: '*En jij?* همان سوال را به شکل غیررسمی پس می‌پرسد.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: لوته صحبت را ادامه می‌دهد
    gloss: 'لوته: من از هالند استم. این بار اولت در کافهٔ زبان است؟'
    note: '*Bij het taalcafé* یعنی در کافهٔ زبان، به‌عنوان یک برنامه.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: عمر جواب می‌دهد و می‌گوید چه چیزی یاد می‌گیرد
    gloss: 'عمر: بلی، این بار اولم است. من هلندی یاد می‌گیرم.'
    note: او اول به سوال لوته جواب می‌دهد و بعد یک معلومات ساده دربارهٔ خودش اضافه می‌کند.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: خداحافظی
    gloss: خداحافظ!
    note: '*Tot ziens* یک خداحافظی معمولی است.'
  nl.a1.unit01.lesson06.teach.closing:
    title: یک ختم طبیعی
    gloss: 'لوته: خوب! هفتهٔ آینده می‌بینیم. عمر: هفتهٔ آینده می‌بینیم!'
    note: وقتی هر دو انتظار دارند دوباره بیایند، تکرار *Tot volgende week* طبیعی است.
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: کدام گزینه دو شکل غیررسمی مفرد «تو» را دارد؟
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij و je شکل غیررسمی مفرد استند؛ u رسمی است.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: ضمیر رسمی را برای تکمیل سوال انتخاب کنید.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? خطاب رسمی را به کار می‌برد.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: گوش کنید و وضعیتی را انتخاب کنید که با سوال جور می‌آید.
    correct_option: از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا تازه آمده یا نه.
    distractors:
    - از یک همسال پرسیده می‌شود که اینجا تازه آمده یا نه.
    - از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا زندگی می‌کند یا نه.
    - از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که از اینجا است یا نه.
    accepted_answers:
    - value: از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا تازه آمده یا نه.
      status: correct
    feedback: Bent u nieuw hier? برای خطاب رسمی از u و bent استفاده می‌کند.
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: هر شکل هلندی را با سطح رسمیت‌اش جور کنید.
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
    feedback: Jij/je غیررسمی است؛ u رسمی یا مؤدبانه است.
    pairs:
    - left: jij / je
      right: informeel
    - left: u
      right: formeel of beleefd
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که رسمی بپرسین: «شما اینجا تازه آمده‌اید؟»'
    accepted_answers:
    - value:
      - Bent
      - u
      - nieuw
      - hier
      status: correct
    feedback: 'سوال رسمی این است: Bent u nieuw hier?'
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: گوش کنید و سوال غیررسمی را ترتیب کنید.
    accepted_answers:
    - value:
      - Ben
      - jij
      - nieuw
      - hier
      status: correct
    feedback: 'در صدا گفته می‌شود: Ben jij nieuw hier?'
  nl.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: سوال رسمی را کامل کنید.
    accepted_answers:
    - value: Bent
      status: correct
    - value: bent
