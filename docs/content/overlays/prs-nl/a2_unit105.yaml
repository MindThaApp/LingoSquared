course:
  title: هالندی A2
  description: دستور زبان هلندی در سطح A2 برای توصیف آنچه همین حالا جریان دارد.
  learning_goal: با aan het + مصدر و zitten/staan/liggen/lopen te بگویین که خودتان یا کس دیگری همین حالا مشغول چه کاری است.
units:
  nl.a2.unit105.ik_ben_aan_het_koken:
    title: من دارم آشپزی می‌کنم
    description: 'بگویین همین حالا چه می‌گذرد: aan het + مصدر، و نشسته، ایستاده، دراز کشیده یا قدم‌زنان کاری را انجام دادن.'
lessons:
  nl.a2.unit105.lesson01.wat_ben_je_aan_het_doen:
    title: تو چه کار می‌کنی؟
  nl.a2.unit105.lesson02.met_een_object:
    title: با مفعول
  nl.a2.unit105.lesson03.nu_of_altijd:
    title: همین حالا یا هر روز؟
  nl.a2.unit105.lesson04.zitten_staan_liggen_lopen:
    title: نشسته، ایستاده، دراز کشیده، قدم‌زنان
  nl.a2.unit105.lesson05.omars_bericht:
    title: پیام Omar
  nl.a2.unit105.lesson06.lotte_en_omar_bellen:
    title: Lotte و Omar در تلفون
teaching:
  nl.a2.unit105.lesson01.teach.huishouden:
    title: کارهای خانه
    gloss: پختن / ظرف شستن / صفایی کردن / لباس‌های چرکین / انجام دادن
    note: '*De was doen* یعنی لباس‌ها را شستن؛ *doen* فعل در *wat ben je aan het doen?* است.'
    example_gloss:
    - Omar خوب آشپزی کرده می‌تواند.
    - من می‌روم ظرف‌ها را بشویم.
    - Noor می‌رود خانه را صفایی کند.
  nl.a2.unit105.lesson01.teach.telefoon:
    title: تلفون و وقت آزاد
    gloss: تلفون کردن / خواندن / خوابیدن / تلفون / با / مال من / مادر / خواهر
    note: '*Bellen* یعنی به کسی تلفون کردن؛ برای گفتن اینکه با کی صحبت می‌کنی، *met* را اضافه کن.'
    example_gloss:
    - Lotte با مادرش تلفونی صحبت می‌کند.
    - یک کتاب خواندم.
    - خواهرم خواب است.
  nl.a2.unit105.lesson01.teach.wie:
    title: آدم‌ها، حالا و در خانه
    gloss: من / تو (تأکیدی) / تو / او (مرد) / او (زن) / چه / حالا / در خانه / Lotte / Omar / Noor
    note: '*Jij* شکل تأکیدی *je* است؛ هر دو برای دوست «تو» معنی می‌دهند.'
    example_gloss:
    - من در خانه هستم.
    - او حالا در خانه است.
    - Noor چه کار می‌کند؟
  nl.a2.unit105.lesson01.teach.aanhet:
    title: Aan het + مصدر
    gloss: دارم آشپزی می‌کنم. دارم تلفون می‌کنم. دارم می‌خوانم.
    note: برای کاری که همین حالا در وسط آن استی، *zijn* + *aan het* + مصدر را به کار ببر. مصدر در آخر جمله می‌آید.
  nl.a2.unit105.lesson01.teach.vraag:
    title: پرسیدن اینکه کسی چه کار می‌کند
    gloss: چه کار می‌کنی؟ دارم آشپزی می‌کنم.
    note: 'در سوال فعل پیش از فاعل می‌آید: *ben je*. در جملهٔ خبری ترتیب *je bent* است.'
  nl.a2.unit105.lesson02.teach.zijn:
    title: فعل zijn
    gloss: دارم آشپزی می‌کنم. تو داری می‌خوانی. او دارد تلفون می‌کند. ما داریم ظرف می‌شوییم. تو داری آشپزی می‌کنی؟ بلی، دارم آشپزی می‌کنم.
    note: '*Zijn* با فاعل تغییر می‌کند: *ben, bent, is, zijn*. در سوال با *je* حرف t می‌افتد: *ben je*.'
  nl.a2.unit105.lesson02.teach.eten:
    title: غذا و آشپزخانه
    gloss: غذا / شوربا / آشپزخانه / ظرف‌های چرکین / ساختن
    note: '*De afwas doen* راه معمول برای گفتن ظرف شستن است.'
    example_gloss:
    - غذا آماده است.
    - شوربا گرم است.
    - من چای می‌سازم.
  nl.a2.unit105.lesson02.teach.object:
    title: مفعول پیش از aan het
    gloss: دارم لباس‌ها را می‌شویم. Omar دارد شوربا می‌پزد. Noor دارد آشپزخانه را صفایی می‌کند.
    note: 'مفعول بین شکل *zijn* و *aan het* می‌آید: *ik ben de was aan het doen*. *Aan het* + مصدر با هم در آخر جمله می‌مانند.'
  nl.a2.unit105.lesson02.teach.moeder:
    title: تلفون کردن به کسی
    gloss: Lotte دارد به مادرش تلفون می‌کند. ما داریم غذا می‌پزیم. تو داری ظرف می‌شویی.
    note: 'با *bellen* کسی که به او تلفون می‌کنی مفعول است: *haar moeder aan het bellen*.'
  nl.a2.unit105.lesson03.teach.tijd:
    title: کی؟
    gloss: هر روز / اکثراً / در همین لحظه / هر شنبه / حالا
    note: '*Elke dag, vaak* و *elke zaterdag* عادت را نشان می‌دهند. *Nu* و *op dit moment* لحظهٔ حال را نشان می‌دهند.'
    example_gloss:
    - هر روز فرق دارد.
    - اکثراً شلوغ است.
    - در همین لحظه آرام است.
  nl.a2.unit105.lesson03.teach.presens:
    title: زمان حال ساده
    gloss: من هر روز آشپزی می‌کنم. او هر روز آشپزی می‌کند. من اکثراً تلفون می‌کنم. او اکثراً تلفون می‌کند. من لباس‌ها را می‌شویم. او لباس‌ها را می‌شوید.
    note: زمان حال ساده (*ik kook, hij kookt*) برای عادت‌ها و حقیقت‌هاست. پسوند -t برای *hij/ze/het* اضافه می‌شود، و برای *jij/je* وقتی پیش از فعل بیاید (*jij kookt*).
  nl.a2.unit105.lesson03.teach.contrast:
    title: عادت یا همین حالا؟
    gloss: من هر روز آشپزی می‌کنم. حالا دارم آشپزی می‌کنم. Lotte اکثراً به مادرش تلفون می‌کند. حالا دارد به مادرش تلفون می‌کند.
    note: 'زمان حال ساده: آنچه به طور منظم اتفاق می‌افتد. *Zijn* + *aan het* + مصدر: آنچه همین لحظه جریان دارد.'
  nl.a2.unit105.lesson03.teach.nu_voorop:
    title: Nu در اول جمله
    gloss: حالا دارم لباس‌ها را می‌شویم. در همین لحظه Omar دارد آشپزی می‌کند.
    note: 'وقتی *nu* یا *op dit moment* جمله را شروع کند، فعل در جای دوم می‌ماند: *nu ben ik*. هر دو ترتیب درست است: *ik ben nu de was aan het doen*.'
  nl.a2.unit105.lesson04.teach.plekken:
    title: جاها و چیزها
    gloss: صوفه / روزنامه / بستر / در بستر / باغ
    note: '*Op de bank* = روی صوفه؛ *in bed* = در بستر.'
    example_gloss:
    - صوفه بزرگ است.
    - او روزنامه می‌خواند.
    - باغ قشنگ است.
  nl.a2.unit105.lesson04.teach.houdingen:
    title: فعل‌های حالت بدن
    gloss: نشستن / ایستاده بودن / خوابیده بودن / راه رفتن / منتظر ماندن
    note: 'این فعل‌ها نشان می‌دهند کسی چگونه کاری را انجام می‌دهد: نشسته، ایستاده، خوابیده یا در حال راه رفتن.'
    example_gloss:
    - می‌خواهم بنشینم.
    - او می‌خواهد بایستد.
    - او باید صبر کند.
  nl.a2.unit105.lesson04.teach.te:
    title: Zitten, staan, liggen, lopen + te
    gloss: او نشسته تلفون می‌کند. او ایستاده آشپزی می‌کند. او خوابیده و در خواب است. او راه می‌رود و تلفون می‌کند.
    note: برای گفتن اینکه کسی در حال نشستن، ایستادن، خوابیدن یا راه رفتن چه کار می‌کند، *zit / staat / ligt / loopt* + *te* + مصدر را به کار ببر. در هالندی گفتاری بسیار رایج است.
  nl.a2.unit105.lesson04.teach.object_te:
    title: مفعول و جا پیش از te
    gloss: او نشسته روزنامه می‌خواند. Omar در آشپزخانه ایستاده شوربا می‌پزد. Lotte روی صوفه نشسته می‌خواند.
    note: 'مفعول و جا پیش از *te* می‌آیند؛ مصدر در آخر است. فعل صرف‌شده در جای دوم می‌ماند: *Hij zit ... te lezen.*'
  nl.a2.unit105.lesson04.teach.vergelijk:
    title: Aan het یا zitten te
    gloss: او دارد می‌خواند. او نشسته می‌خواند. او دارد آشپزی می‌کند. او ایستاده آشپزی می‌کند.
    note: هر دو شکل نشان می‌دهند که کاری در جریان است. *Zit/staat/ligt/loopt te* حالت بدن را هم نشان می‌دهد، پس فعلی را انتخاب کن که با کار واقعی شخص جور باشد.
  nl.a2.unit105.lesson05.teach.reading:
    title: پیام Omar برای Lotte
    gloss: سلام Lotte! من در خانه هستم. دارم شوربا می‌پزم. خواهرم روی صوفه نشسته و به مادرم تلفون می‌کند. Noor دارد ظرف می‌شوید. و تو؟ چه کار می‌کنی؟
    note: پیدا کن که همین لحظه کی چه کار می‌کند.
    glosses:
      zus: خواهر
      moeder: مادر
      afwas: ظرف‌های چرکین
      soep: شوربا
      bank: صوفه
  nl.a2.unit105.lesson06.teach.beurt1:
    title: لوته از عمر می‌پرسد
    gloss: 'Lotte: سلام Omar، چه کار می‌کنی؟'
  nl.a2.unit105.lesson06.teach.beurt2:
    title: Omar جواب می‌دهد و می‌پرسد
    gloss: 'Omar: دارم شوربا می‌پزم. و تو؟'
  nl.a2.unit105.lesson06.teach.beurt3:
    title: Lotte جواب می‌دهد
    gloss: 'Lotte: دارم لباس‌ها را می‌شویم.'
  nl.a2.unit105.lesson06.teach.beurt4:
    title: Omar دربارهٔ Noor می‌پرسد
    gloss: 'Omar: و Noor چه کار می‌کند؟'
  nl.a2.unit105.lesson06.teach.beurt5:
    title: Lotte حال Noor را می‌گوید
    gloss: 'Lotte: Noor روی صوفه نشسته و تلفون می‌کند.'
exercises:
  nl.a2.unit105.lesson01.exercise01.choose_koken:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: Ik ben aan het koken.
    distractors:
    - Ik ben aan het bellen.
    - Ik ben aan het slapen.
    - Ik ben aan het lezen.
    accepted_answers:
    - value: Ik ben aan het koken.
      status: correct
    feedback: '*Aan het koken* = در وسط آشپزی بودن.'
    prompt_blocks:
    - من دارم آشپزی می‌کنم.
  nl.a2.unit105.lesson01.exercise02.choose_question:
    instruction: سوال درست هالندی را انتخاب کنید.
    correct_option: Wat ben je aan het doen?
    distractors:
    - Wat je ben aan het doen?
    - Wat ben je doen aan het?
    - تو چی استی که کار می‌کنی؟
    accepted_answers:
    - value: Wat ben je aan het doen?
      status: correct
    feedback: در سوال، *ben* درست بعد از *wat* می‌آید، بعد *je*، بعد *aan het doen*.
    prompt_blocks:
    - جمله‌ای را انتخاب کنید که معنایش «تو چه کار می‌کنی؟» باشد.
  nl.a2.unit105.lesson01.exercise03.match_verbs:
    instruction: هر فعل هالندی را با معنی آن جور کن.
    accepted_answers:
    - value:
      - left: koken
        right: آشپزی کردن
      - left: afwassen
        right: ظرف شستن
      - left: schoonmaken
        right: پاک کردن
      - left: bellen
        right: تلفون کردن
      - left: lezen
        right: خواندن
      - left: slapen
        right: خوابیدن
      status: correct
    feedback: این مصدرها بعد از *aan het* می‌آیند.
    pairs:
    - left: koken
      right: آشپزی کردن
    - left: afwassen
      right: ظرف شستن
    - left: schoonmaken
      right: پاک کردن
    - left: bellen
      right: تلفون کردن
    - left: lezen
      right: خواندن
    - left: slapen
      right: خوابیدن
  nl.a2.unit105.lesson01.exercise04.complete_aan:
    instruction: جمله را با کلمهٔ جاافتاده کامل کن.
    correct_option: aan
    accepted_answers:
    - value: aan
      status: correct
    feedback: '*Ik ben aan het koken*: همیشه *aan het* پیش از مصدر می‌آید.'
  nl.a2.unit105.lesson01.exercise05.order_question:
    instruction: کلمه‌ها را طوری ترتیب کن که بپرسی «چه کار می‌کنی؟»
    correct_option: Wat ben je aan het doen
    accepted_answers:
    - value: Wat ben je aan het doen
      status: correct
    feedback: '*Wat ben je aan het doen?*'
  nl.a2.unit105.lesson01.exercise06.translate_calling:
    instruction: به هالندی ترجمه کن و از aan het استفاده کن.
    accepted_answers:
    - value: Ik ben aan het bellen.
      status: correct
    - value: Ik ben aan het bellen
      status: correct
    feedback: '*Ik ben aan het bellen* = همین حالا مصروف تلفون هستم.'
    prompt_blocks:
    - من دارم تلفون می‌کنم. از aan het استفاده کنید.
  nl.a2.unit105.lesson02.exercise01.complete_is:
    instruction: با شکل درست zijn کامل کن.
    correct_option: is
    accepted_answers:
    - value: is
      status: correct
    feedback: '*Omar* با *is* می‌آید.'
  nl.a2.unit105.lesson02.exercise02.match_sentences:
    instruction: هر جملهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: Ik ben de was aan het doen
        right: من دارم لباس می‌شویم
      - left: Omar دارد شوربا درست می‌کند
        right: Omar دارد شوربا درست می‌کند
      - left: Noor دارد آشپزخانه را پاک می‌کند
        right: Noor دارد آشپزخانه را پاک می‌کند
      - left: Lotte دارد به مادرش تیلفون می‌کند
        right: Lotte دارد به مادرش تلفون می‌کند
      - left: Wij zijn de afwas aan het doen
        right: ما داریم ظرف می‌شوییم
      - left: Jij bent het eten aan het koken
        right: تو داری غذا می‌پزی
      status: correct
    feedback: در هر جمله مفعول پیش از *aan het* می‌آید.
    pairs:
    - left: Ik ben de was aan het doen
      right: من دارم لباس می‌شویم
    - left: Omar دارد شوربا درست می‌کند
      right: Omar دارد شوربا درست می‌کند
    - left: Noor دارد آشپزخانه را پاک می‌کند
      right: Noor دارد آشپزخانه را پاک می‌کند
    - left: Lotte دارد به مادرش تیلفون می‌کند
      right: Lotte دارد به مادرش تلفون می‌کند
    - left: Wij zijn de afwas aan het doen
      right: ما داریم ظرف می‌شوییم
    - left: Jij bent het eten aan het koken
      right: تو داری غذا می‌پزی
    localize_pair_lefts: 'yes'
  nl.a2.unit105.lesson02.exercise03.choose_order:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ik ben de was aan het doen.
    distractors:
    - Ik ben aan het de was doen.
    - Ik ben aan het doen de was.
    - Ik ben de was doen aan het.
    accepted_answers:
    - value: Ik ben de was aan het doen.
      status: correct
    feedback: مفعول *de was* پیش از *aan het doen* می‌آید.
    prompt_blocks:
    - کدام جمله ترتیب درست کلمات را دارد؟
  nl.a2.unit105.lesson02.exercise04.order_mother:
    instruction: 'کلمه‌ها را ترتیب کن: Lotte دارد به مادرش تلفون می‌کند.'
    correct_option: Lotte is haar moeder aan het bellen
    accepted_answers:
    - value: Lotte is haar moeder aan het bellen
      status: correct
    feedback: 'جمله درست این است: *Lotte is haar moeder aan het bellen.*'
  nl.a2.unit105.lesson02.exercise05.complete_bent:
    instruction: با شکل درست zijn کامل کن.
    correct_option: bent
    accepted_answers:
    - value: bent
      status: correct
    feedback: '*Jij* با *bent* می‌آید.'
  nl.a2.unit105.lesson02.exercise06.translate_soup:
    instruction: به هالندی ترجمه کن و از aan het استفاده کن.
    accepted_answers:
    - value: Omar is soep aan het maken.
      status: correct
    - value: Omar is soep aan het maken
      status: correct
    - value: Omar is soep aan het koken.
      status: correct
    - value: Omar is soep aan het koken
      status: correct
    feedback: '*Omar is soep aan het maken* (یا *aan het koken*).'
    prompt_blocks:
    - Omar دارد شوربا می‌پزد. از aan het استفاده کنید.
  nl.a2.unit105.lesson03.exercise01.choose_now:
    instruction: جمله‌ای را انتخاب کن که دربارهٔ همین حالاست.
    correct_option: Omar is nu aan het koken.
    distractors:
    - Omar kookt elke dag.
    - Lotte belt vaak haar moeder.
    - Ik doe elke zaterdag de was.
    accepted_answers:
    - value: Omar is nu aan het koken.
      status: correct
    feedback: '*Nu* و *aan het koken* نشان می‌دهند که در همین لحظه اتفاق می‌افتد.'
    prompt_blocks:
    - کدام جمله می‌گوید همین حالا چه اتفاقی می‌افتد؟
  nl.a2.unit105.lesson03.exercise02.listen_habit:
    instruction: گوش کنید و آنچه را می‌شنوید انتخاب کنید.
    correct_option: Lotte belt vaak haar moeder.
    distractors:
    - لوته همین حالا به مادرش تیلفون می‌کند.
    - Omar kookt elke dag.
    - عمر همین حالا مصروف پختن است.
    accepted_answers:
    - value: Lotte belt vaak haar moeder.
      status: correct
    feedback: تو *Lotte belt vaak haar moeder* را شنیدی (یک عادت).
  nl.a2.unit105.lesson03.exercise03.match_contrast:
    instruction: هر جملهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: Ik kook elke dag
        right: من هر روز آشپزی می‌کنم
