    gloss: کتاب را کی باید پس بدهم؟
    note: Moet ... terug راه ساده و طبیعی برای پرسیدن است که یک چیز امانتی کی باید پس داده شود.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: گفتن تاریخ پس دادن
    gloss: به تاریخ 21 اپریل.
    note: جواب کوتاه از op، بعد روز و ماه با حرف کوچک ساخته می‌شود.
  nl.a1.unit03.lesson05.teach.due_words:
    title: گفتن تاریخ پس دادن با حروف
    gloss: کتاب باید به بیست‌ویکم اپریل پس داده شود.
    note: وقتی عدد ترتیبی با حروف نوشته می‌شود، بعد از op کلمهٔ de می‌آید.
  nl.a1.unit03.lesson05.teach.label:
    title: خواندن برچسب تاریخ پس دادن
    gloss: 'تاریخ پس دادن: 21-4-2026'
