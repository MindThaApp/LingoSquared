    gloss: 'روزها معمولاً حرف بزرگ ندارند: دوشنبه، جمعه.'
    note: در دری حروف بزرگ نداریم، اما در هلندی نام روزهای هفته جز در آغاز جمله با حرف کوچک نوشته می‌شود.
  nl.a1.unit03.lesson02.teach.jan_mar:
