    gloss: جنوری، فبروری، مارچ
    note: در هلندی نام ماه‌ها معمولاً با حرف کوچک شروع می‌شود.
    example_gloss:
    - تولد من در جنوری است.
    - من در ماه فبروری هلندی یاد می‌گیرم.
    - تولد من در مارچ است.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: اپریل تا جون
    gloss: اپریل، می، جون
    note: Mei یعنی می و juni یعنی جون.
    example_gloss:
    - من در ماه اپریل هلندی یاد می‌گیرم.
    - تولد من در می است.
    - من در ماه جون هلندی یاد می‌گیرم.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: جولای تا سپتمبر
    gloss: جولای، اگست، سپتمبر
    note: کلمه‌های juli و juni در مصوت آخر فرق دارند.
    example_gloss:
    - تولد من در جولای است.
    - من در ماه اگست هلندی یاد می‌گیرم.
    - تولد من در سپتمبر است.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: اکتوبر تا دسمبر
    gloss: اکتوبر، نومبر، دسمبر
    note: oktober در هلندی با k نوشته می‌شود.
    example_gloss:
    - من در ماه اکتوبر هلندی یاد می‌گیرم.
    - تولد من در ماه نومبر است.
    - من در ماه دسمبر هلندی یاد می‌گیرم.
  nl.a1.unit03.lesson02.teach.year:
