    gloss: '۲۵ تا ۲۹: بیست‌وپنجم، بیست‌وششم، بیست‌وهفتم، بیست‌وهشتم، بیست‌ونهم'
    note: این عددهای ترتیبیِ مرکب به -ste ختم می‌شوند و یک‌جا به صورت یک کلمه نوشته می‌شوند.
    example_gloss:
    - امروز بیست‌وپنجم اپریل است.
    - امروز بیست‌وششم اپریل است.
    - امروز بیست‌وهفتم اپریل است.
    - امروز بیست‌وهشتم اپریل است.
    - امروز بیست‌ونهم اپریل است.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: سی‌ام و سی‌ویکم
    gloss: '۳۰ و ۳۱: سی‌ام، سی‌ویکم'
    note: این‌ها دو شمارهٔ آخرِ ممکنِ روز در یک ماه اند.
    example_gloss:
    - امروز سی‌ام اپریل است.
    - امروز سی‌ویکم دسمبر است.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: گفتن تاریخ با عدد ترتیبی
    gloss: ۳ اپریل — سوم اپریل
    note: این بخش عدد ترتیبی را وقتی نشان می‌دهد که شمارهٔ روز کامل گفته شود؛ در هلندی روز پیش از ماه می‌آید.
  nl.a1.unit03.lesson03.teach.on_date:
