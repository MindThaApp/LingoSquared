    gloss: امروز ۳ اپریل 2026 است.
    note: ترتیب تاریخ در هلندی روز–ماه–سال است و april با حرف کوچک می‌ماند.
  nl.a1.unit03.lesson04.teach.date_words:
    title: گفتن روز با عدد ترتیبی
    gloss: امروز سوم اپریل است.
    note: 'عدد ترتیبی که با حروف نوشته شود، de هم دارد: de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: ترتیب روز–ماه–سال
    gloss: 'روز–ماه–سال: ۳ اپریل 2026 یا 3-4-2026'
    note: 'شکل عددی به ترتیب ماه–روز–سال نیست: 3-4-2026 یعنی ۳ اپریل 2026.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: ترکیب روز هفته و تاریخ
    gloss: امروز جمعه 10 اپریل است.
