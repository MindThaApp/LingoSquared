    gloss: 'ماه‌ها معمولاً حرف بزرگ ندارند: اپریل، سپتمبر.'
    note: در دری حروف بزرگ نداریم، اما در هلندی نام ماه‌ها جز در آغاز جمله با حرف کوچک نوشته می‌شود.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: اول تا چهارم
    gloss: '۱ تا ۴: اول، دوم، سوم، چهارم'
    note: Eerste، tweede و derde شکل‌هایی اند که باید مستقیم یاد گرفته شوند؛ vierde از vier ساخته شده است.
    example_gloss:
    - امروز اول اپریل است.
    - امروز دوم اپریل است.
    - امروز سوم اپریل است.
    - امروز چهارم اپریل است.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: پنجم تا هشتم
    gloss: '۵ تا ۸: پنجم، ششم، هفتم، هشتم'
    note: 'شکل‌های تاریخ این‌ها اند: vijfde، zesde، zevende و achtste.'
    example_gloss:
    - امروز پنجم اپریل است.
    - امروز ششم اپریل است.
    - امروز هفتم اپریل است.
    - امروز 8 اپریل 2026 است.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: نهم تا دوازدهم
    gloss: '۹ تا ۱۲: نهم، دهم، یازدهم، دوازدهم'
    note: این شکل‌ها تاریخ‌های اوایل ماه را که بعداً در این بخش به کار می‌روند، در بر می‌گیرند.
    example_gloss:
    - امروز نهم اپریل است.
    - امروز دهم اپریل است.
    - امروز یازدهم اپریل است.
    - امروز دوازدهم اپریل است.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: سیزدهم تا نزدهم
    gloss: '۱۳ تا ۱۹: سیزدهم، چهاردهم، پانزدهم، شانزدهم، هفدهم، هجدهم، نزدهم'
    note: این عددهای ترتیبیِ روز که با حروف نوشته می‌شوند، به -de ختم می‌شوند.
    example_gloss:
    - امروز سیزدهم اپریل است.
    - امروز چهاردهم اپریل است.
    - امروز پانزدهم اپریل است.
    - امروز شانزدهم اپریل است.
    - امروز هفدهم اپریل است.
    - امروز هجدهم اپریل است.
    - امروز نزدهم اپریل است.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: بیستم تا بیست‌وچهارم
    gloss: '۲۰ تا ۲۴: بیستم، بیست‌ویکم، بیست‌ودوم، بیست‌وسوم، بیست‌وچهارم'
    note: از twintig به بالا، این شکل‌های ترتیبی به -ste ختم می‌شوند و یک کلمهٔ نوشتاری باقی می‌مانند.
    example_gloss:
    - امروز بیستم اپریل است.
    - کتاب باید تا بیست‌ویکم اپریل واپس داده شود.
    - امروز بیست‌ودوم اپریل است.
    - امروز بیست‌وسوم اپریل است.
    - امروز بیست‌وچهارم اپریل است.
