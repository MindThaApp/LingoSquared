  nl.a1.unit03.lesson04.teach.ask_date:
    title: پرسیدن تاریخ تقویم
    gloss: تاریخ امروز چند است؟
    note: Welke datum ... صریحاً تاریخ تقویم را می‌پرسد.
  nl.a1.unit03.lesson04.teach.ask_which_date:
