  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: لوته روز هفته را می‌پرسد
    gloss: 'لوته: امروز چه روز است؟ عمر: چهارشنبه است.'
    note: در جواب نام یک روز هفته گفته می‌شود.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: لوته تاریخ را می‌پرسد
    gloss: 'لوته: و تاریخ امروز چند است؟ عمر: 8 اپریل 2026 است.'
    note: در جواب گفتاری هالندی عدد ترتیبی de achtste استفاده می‌شود؛ 8 اپریل 2026 واقعاً چهارشنبه است و با جملهٔ قبلی جور می‌آید.
  nl.a1.unit03.lesson06.teach.next:
    title: بعدی
    gloss: بعدی
    note: Volgende نوبت بعدی را نشان می‌دهد.
    example_gloss: کافهٔ زبان بعدی کی است؟
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: پرسیدن از تاریخ دیدار بعدی
    gloss: 'لوته: کافهٔ زبان بعدی کی است؟ عمر: روز جمعه 10 اپریل.'
    note: جواب از op، روز هفته با حرف کوچک، شمارهٔ روز و ماه با حرف کوچک ساخته می‌شود. 10 اپریل 2026 واقعاً جمعه است، دو روز بعد از هشتم.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: ختم صحبت
    gloss: 'لوته: خوب، تا جمعه! عمر: تا آن وقت!'
    note: Tot vrijdag روز دیدار بعدی را می‌گوید.
