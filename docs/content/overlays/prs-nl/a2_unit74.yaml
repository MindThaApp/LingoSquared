teaching:
  nl.a2.unit74.lesson01.teach.vertraging:
    title: تأخیر
    gloss: تأخیر
    note: '*De vertraging* یک اسم معمول با حرف تعریف (de) است.'
    example_gloss: ده دقیقه تأخیر است.
  nl.a2.unit74.lesson01.teach.trein_vertraging:
    title: خبر دادن از تأخیر قطار
    gloss: قطار من تأخیر دارد.
    note: '*Vertraging hebben* (لفظاً «تأخیر داشتن») شیوهٔ معمول گفتن این است که قطار یا بس دیر کرده است.'
  nl.a2.unit74.lesson01.teach.reden_vertraging:
    title: پرسیدن سبب تأخیر
    gloss: سبب تأخیر چیست؟
    note: '*De reden* (سبب) یک اسم معمول با حرف تعریف (de) است.'
  nl.a2.unit74.lesson02.teach.seinstoring:
    title: خرابی سیگنال
    gloss: خرابی سیگنال
    note: '*De seinstoring* اصطلاح معمول شرکت راه‌آهن هالند (NS) برای خرابی تخنیکی در سیستم سیگنال‌دهی راه‌آهن است.'
    example_gloss: قطار من به سبب خرابی سیگنال لغو شده است.
  nl.a2.unit74.lesson02.teach.trein_valt_uit:
    title: گفتن اینکه قطارتان لغو شده است
    gloss: قطار من به سبب خرابی سیگنال لغو شده است.
    note: '*Uitvallen* (لغو شدن، از کار افتادن) فعل جداشدنی است؛ *uit* به آخر جمله می‌رود.'
  nl.a2.unit74.lesson02.teach.volgende_trein:
    title: پرسیدن اینکه قطار بعدی کی حرکت می‌کند
    gloss: قطار بعدی کی حرکت می‌کند؟
    note: '*Rijden* (رفتن، حرکت کردن) برای قطار و بس که طبق جدول وقت حرکت می‌کنند هم به کار می‌رود، نه فقط برای رانندگی با موتر.'
  nl.a2.unit74.lesson03.teach.aansluiting:
    title: اتصال (قطار یا بس بعدی)
    gloss: قطار پیوندی
    note: '*De aansluiting* اسم با حرف تعریف de است و برای قطار یا بس اتصالی به کار می‌رود.'
    example_gloss: من اتصالم را در اوترخت از دست می‌دهم.
  nl.a2.unit74.lesson03.teach.aansluiting_missen:
    title: گفتن اینکه اتصالتان را از دست داده‌اید
    gloss: من به سبب تأخیر، قطار بعدی‌ام را از دست می‌دهم.
    note: فعل *missen* (از دست دادن) در هالندی مفعول مستقیم می‌گیرد، یعنی بدون حرف اضافه؛ مثل Ik mis mijn aansluiting.
  nl.a2.unit74.lesson03.teach.andere_trein:
    title: پرسیدن درباره گرفتن قطار دیگر
    gloss: آیا می‌توانم قطار دیگری بگیرم؟
    note: در *een andere trein* (قطار دیگر) شکل *andere* شکل معمول صفت قبل از کلمه‌های *de* است.
  nl.a2.unit74.lesson04.teach.servicebalie:
    title: میز خدمات
    gloss: میز خدمات
    note: '*De servicebalie* اسم با حرف تعریف de است و کلمه معمول برای میز کمک در ستیشن است.'
    example_gloss: من برای کمک پیش میز خدمات می‌روم.
  nl.a2.unit74.lesson04.teach.help_alternatief:
    title: خواستن کمک برای یافتن مسیر دیگر
    gloss: آیا در پیدا کردن مسیر دیگر به من کمک کرده می‌توانین؟
    note: '*Kunt u* شکل رسمی و مودبانه فعل *kunnen* (توانستن) با ضمیر *u* است.'
  nl.a2.unit74.lesson04.teach.via_amsterdam:
    title: شنیدن یک مسیر دیگر
    gloss: شما می‌توانین با اینترسیتی از راه آمرسفورت سفر کنید.
    note: '*Via* (از راه) ایستگاه میانی یک مسیر دیگر را معرفی می‌کند.'
  nl.a2.unit74.lesson05.teach.mededeling:
    title: خواندن اعلان اختلال
    gloss: 'اعلان مهم: به خاطر خرابی سیگنال، میان اوترخت و آرنهم هیچ قطاری حرکت نمی‌کند. مسافران می‌توانند از راه آمرسفورت سفر کنند. انتظار می‌رود تأخیر تا حدود ساعت سه ادامه داشته باشد. به مسافران توصیه می‌کنیم به برنامه‌ریز سفر مراجعه کنند.'
    note: '*Vijftien uur* شکل ساعت ۲۴ ساعته برای ساعت سه بعد از ظهر است و در اعلان‌های عمومی هالند معمول است.'
    glosses:
