      mededeling: اعلان، اطلاعیه
      door: به خاطر، به سبب
      seinstoring: خرابی سیگنال
      rijden: حرکت می‌کنند؛ رانندگی کردن
      tussen: میان
      geen: هیچ، نه
      treinen: قطارها
      Reizigers: مسافران
      kunnen: می‌توانند، توانایی دارند
      omreizen: از راه دیگر سفر کردن
      via: از راه، از طریق
      vertraging: تأخیر
      duurt: دوام می‌کند
      tot: تا
      ongeveer: حدود، تقریباً
      vijftien: پانزده
      uur: ساعت
      Wij: ما
      adviseren: توصیه می‌کنند
      reizigers: مسافران
      reisplanner: برنامه‌ریز سفر
      raadplegen: مراجعه کردن، دیدن
  nl.a2.unit74.lesson06.teach.medewerker_open:
    title: کارمند گفتگو را شروع می‌کند
    gloss: 'کارمند: NS، روز بخیر. چطور می‌توانم کمکتان کنم؟'
  nl.a2.unit74.lesson06.teach.lotte_uitgevallen:
    title: لوته از لغو شدن قطار خبر می‌دهد
    gloss: 'لوته: روز بخیر، قطار من به آرنهم لغو شده است. می‌خواهم بدانم حالا چطور به آنجا برسم.'
  nl.a2.unit74.lesson06.teach.medewerker_seinstoring:
    title: کارمند سبب را توضیح می‌دهد
    gloss: 'کارمند: بلی، واقعاً خرابی سیگنال است. شما می‌توانین از راه آمرسفورت سفر کنید.'
  nl.a2.unit74.lesson06.teach.lotte_ask_time:
    title: لوته وقت حرکت را می‌پرسد
    gloss: 'لوته: آن قطار ساعت چند حرکت می‌کند؟'
  nl.a2.unit74.lesson06.teach.medewerker_platform:
    title: کارمند پلاتفورم و وقت را می‌گوید
    gloss: 'کارمند: ده دقیقه دیگر، از پلاتفورم چهار.'
  nl.a2.unit74.lesson06.teach.lotte_bericht_sturen:
    title: لوته تصمیم می‌گیرد پیام بفرستد
    gloss: 'لوته: تشکر. یک پیام می‌فرستم که دیرتر می‌رسم.'
  nl.a2.unit74.lesson06.teach.grammar_uitgevallen:
    title: ماضی نقلی فعل uitvallen و کلمه‌های haar و zij
    gloss: قطار او لغو شده است. او می‌تواند از راه دیگر سفر کند.
    note: '*Is uitgevallen* ماضی نقلی فعل *uitvallen* (لغو شدن) است و چون تغییر حالت را نشان می‌دهد، با *zijn* ساخته می‌شود. *Haar* (مال او، ملکیت) و *zij* (او، فاعل) شکل‌های سوم شخص مؤنث‌اند که وقتی درباره لوته خلاصه می‌گوییم به کار می‌روند.'
