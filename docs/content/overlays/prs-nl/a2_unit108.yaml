course:
  title: هالندی A2
  description: هلندی A2 با تمرکز بر دستور زبان، برای خواندن، شنیدن و بازگویی یک قصهٔ کوتاه.
  learning_goal: یک قصهٔ کوتاه را در گذشتهٔ ساده بخوانی یا بشنوی و آن را با کلمه‌های ترتیب و گذشتهٔ نقلی به ترتیب بازگو کنی.
units:
  nl.a2.unit108.een_kort_verhaal:
    title: یک قصهٔ کوتاه
    description: یک قصهٔ کوتاه دربارهٔ یک روز گشت‌وگذار را بخوان یا بشنو و آن را به ترتیب بازگو کن.
lessons:
  nl.a2.unit108.lesson01.eerst_daarna_toen:
    title: اول، بعد، سپس
  nl.a2.unit108.lesson02.verhaal_in_het_imperfectum:
    title: قصه گفتن
  nl.a2.unit108.lesson03.opschrijven_of_vertellen:
    title: نوشتن یا گفتن
  nl.a2.unit108.lesson04.een_boottocht:
    title: گشت با قایق
  nl.a2.unit108.lesson05.een_dag_in_het_pretpark:
    title: یک روز در پارک تفریحی
  nl.a2.unit108.lesson06.vertel_eens:
    title: برایم بگو!
teaching:
  nl.a2.unit108.lesson01.teach.uitjes:
    title: روزهای گشت‌وگذار
    gloss: باغ وحش / گشت با قایق / شهربازی / ترن هوایی
    note: این‌ها جاهای گشت‌وگذار در این درس اند.
    example_gloss:
    - ما به باغ وحش می‌رویم.
    - گشت با قایق خیلی مزه دارد.
    - Lotte ترن هوایی را دوست دارد.
  nl.a2.unit108.lesson01.teach.dieren:
    title: حیوانات باغ وحش
    gloss: بوزینه / فیل / شیر / پنگوئن
    note: 'جمع: *apen, olifanten, leeuwen, pinguïns*.'
    example_gloss:
    - بوزینه‌ها خنده‌دار اند.
    - فیل‌ها بزرگ اند.
    - شیرها خوابیده اند.
  nl.a2.unit108.lesson01.teach.dingen:
    title: چیزهای یک روز گشت‌وگذار
    gloss: عکس / آیس‌کریم / قایق / کانال
    note: چیزهای کوچکی که در قصه‌ها تکرار می‌شوند.
    example_gloss:
    - Noor عکس می‌گیرد.
    - Omar آیس‌کریم می‌خورد.
    - قایق از کانال می‌گذرد.
  nl.a2.unit108.lesson01.teach.volgorde_woorden:
    title: کلمه‌ها برای ترتیب رویدادها
    gloss: اول / بعد از آن / بعد / سپس / بعدتر / آخرش
    note: این کلمه‌ها رویدادهای یک قصه را به ترتیب می‌آورند. در قصه، *toen* یعنی «بعد». این با *toen* به معنای «وقتی که» فرق دارد.
    example_gloss:
    - اول تکت می‌خریم.
    - بعد از آن آیس‌کریم می‌خوریم.
    - آخرش به خانه می‌رویم.
  nl.a2.unit108.lesson01.teach.gn_volgorde:
    title: اول کلمهٔ ترتیب، بعد فعل
    gloss: اول به باغ وحش رفتیم. بعد از آن بوزینه‌ها را دیدیم.
    note: 'وقتی کلمهٔ ترتیب در آغاز جمله بیاید، فعل بعد از آن می‌آید و فاعل بعد از فعل: *Eerst gingen we*, *Daarna zagen we*. کلمهٔ ترتیب را بعدتر در جمله هم گذاشته می‌توانی: *We gingen eerst naar de dierentuin*.'
  nl.a2.unit108.lesson01.teach.verhaal:
    title: یک قصهٔ کوتاه به ترتیب
    gloss: اول Lotte، Omar و Noor به باغ وحش رفتند. بعد از آن بوزینه‌ها را دیدند. بعد آیس‌کریم خوردند. آخرش با بس به خانه رفتند.
  nl.a2.unit108.lesson02.teach.dingen2:
    title: دم دروازهٔ ورودی
    gloss: تکت / قهوه / صف
    note: 'جمع: *kaartjes*.'
    example_gloss:
    - من یک تکت دارم.
    - Omar قهوه می‌نوشد.
    - صف طولانی است.
  nl.a2.unit108.lesson02.teach.werkwoorden:
    title: فعل‌ها برای یک روز گشت‌وگذار
    gloss: رفتن / دیدن / خوردن / گرفتن / قدم زدن / نوشیدن / خریدن / ساختن / انتظار کشیدن / خندیدن
    note: دو کارت بعدی شکل‌های گذشتهٔ ساده را نشان می‌دهند.
    example_gloss:
    - ما به باغ وحش می‌رویم.
    - من شیرها را می‌بینم.
    - Noor منتظر قایق است.
  nl.a2.unit108.lesson02.teach.gn_onregelmatig:
    title: 'روایت: گذشتهٔ سادهٔ بی‌قاعده'
    gloss: رفتن ← رفت؛ دیدن ← دید؛ خوردن ← خورد؛ گرفتن ← گرفت؛ قدم زدن ← قدم زد؛ نوشیدن ← نوشید؛ بودن ← بود/بودند
    note: قصه‌ها به گذشتهٔ ساده نوشته می‌شوند. شکل مفرد با *ik*, *jij/je*, *hij*, *zij* (او، زن) و یک نام مثل *Noor* می‌آید؛ شکل جمع با *we*, *jullie* و *ze* (آنها). این‌ها را یکجا یاد بگیر.
  nl.a2.unit108.lesson02.teach.gn_regelmatig:
    title: 'روایت: گذشتهٔ ساده با قاعده'
    gloss: ساختن ← ساخت؛ انتظار کشیدن ← انتظار کشید؛ خندیدن ← خندید؛ خریدن ← خرید
    note: 'در بسیاری از فعل‌های با قاعده، به ریشه *-te* (مفرد) یا *-ten* (جمع) اضافه می‌شود؛ این‌جا ریشه‌ها به آوایی ختم می‌شوند که *-te(n)* می‌گیرد. فعل‌های با قاعدهٔ دیگر *-de(n)* می‌گیرند که بعداً می‌آید. *Kopen* حالت خاص است: *kocht, kochten*.'
  nl.a2.unit108.lesson02.teach.zinnen:
    title: رویدادهای کوچک در گذشتهٔ ساده
    gloss: Lotte تکت‌ها را خرید. Omar قهوه نوشید. Noor خندید. آن‌ها مدت طولانی در صف انتظار کشیدند.
  nl.a2.unit108.lesson03.teach.woorden:
    title: دربارهٔ دیروز گفتن
    gloss: دیروز / باهم / خوب، مزه‌دار / زیاد / حیوانات
    note: وقتی به دوستت می‌گویی چه کار کردی، به کار می‌آید.
    example_gloss:
    - دیروز ما در باغ وحش بودیم.
    - ما باهم در باغ وحش بودیم.
    - مزه داشت.
    - من حیوانات زیادی دیدم.
    - حیوانات بزرگ بودند.
  nl.a2.unit108.lesson03.teach.gn_perfectum:
    title: 'برای دوست گفتن: گذشتهٔ نقلی'
    gloss: اول به باغ وحش رفتیم. بعد از آن بوزینه‌ها را دیدیم.
    note: 'در گپ زدن معمولاً آنچه را کرده‌ای با *hebben* یا *zijn* و یک اسم مفعول می‌گویی. فعل کمکی در جای دوم می‌آید و اسم مفعول در آخر: *Eerst zijn we … gegaan*, *Daarna hebben we … gezien*.'
  nl.a2.unit108.lesson03.teach.gn_deelwoorden:
    title: اسم مفعول با hebben
    gloss: دیده / خورده / گرفته / نوشیده / خریده / ساخته / انتظار کشیده / خندیده
    note: 'بیشتر اسم‌های مفعول با *ge-* شروع می‌شوند. فعل‌های با قاعده به *-t* ختم می‌شوند (*gemaakt, gewacht*)؛ فعل‌های بی‌قاعده به *-en* (*gezien, gegeten, genomen, gedronken*). *Gekocht* با این‌که *kopen* در گذشتهٔ ساده بی‌قاعده است به *-t* ختم می‌شود، و *lachen* استثنا است: *gelachen*.'
  nl.a2.unit108.lesson03.teach.gn_hulpwerkwoord:
    title: hebben یا zijn؟
    gloss: من بوزینه‌ها را دیدم. Noor قهوه نوشید. ما خندیدیم. من به شهربازی رفتم. Omar در باغ وحش بود. ما آمدیم.
    note: 'بیشتر فعل‌ها با *hebben* می‌آیند. فعل‌های رفتن و آمدن (حرکت به سوی یک جا) و خود *zijn* با *zijn* می‌آیند: *gegaan, gekomen, geweest*. شکل‌ها: *ik heb / ben, Noor heeft / is, wij hebben / zijn*.'
  nl.a2.unit108.lesson03.teach.gn_contrast:
    title: قصه یا گپ؟
    gloss: اول آن‌ها به باغ وحش رفتند. اول ما به باغ وحش رفتیم.
    note: قصهٔ نوشتاری گذشتهٔ ساده (*gingen*) را به کار می‌برد. وقتی به دوستت می‌گویی چه کار کردی، معمولاً گذشتهٔ نقلی (*zijn … gegaan*) را به کار می‌بری. ترتیب رویدادها در هر دو با همان کلمه‌ها نشان داده می‌شود.
  nl.a2.unit108.lesson03.teach.zinnen:
    title: دربارهٔ دیروز گفتن
    gloss: دیروز ما باهم به باغ وحش رفتیم. حیوانات زیادی دیدیم. مزه داشت.
  nl.a2.unit108.lesson04.teach.plaatsen:
    title: در گشت با قایق
    gloss: شهر / پل
    note: هر دو را از قایق می‌بینی.
    example_gloss:
    - شهر زیبا است.
    - پل کهنه است.
    - ما پل را می‌بینیم.
  nl.a2.unit108.lesson04.teach.gn_stappen:
    title: یک اسم مفعول دیگر با zijn
    gloss: Noor سوار قایق شد. Omar از پل عکس گرفت.
    note: '*Stappen* (قدم گذاشتن، سوار شدن) با قاعده است: *gestapt*. چون حرکت به داخل یک جا را می‌رساند، با *zijn* می‌آید. *Een foto maken* با *hebben* می‌آید: *gemaakt*.'
  nl.a2.unit108.lesson04.teach.verhaal:
    title: گشت با قایق به ترتیب
    gloss: دیروز Omar و Noor گشت با قایق کردند. اول تکت خریدند. بعد از آن سوار قایق شدند. بعد از پل عکس گرفتند. سپس شهر را دیدند. بعدتر قهوه نوشیدند. آخرش به خانه رفتند.
  nl.a2.unit108.lesson05.teach.lees:
    title: یک روز در پارک تفریحی
    gloss: روز شنبه Lotte، Omar و Noor به شهربازی رفتند. اول تکت خریدند. بعد از آن سوار ترن هوایی شدند. Noor ترسیده بود، اما Omar خندید. بعد آیس‌کریم خوردند. بعدتر مدت طولانی در صف انتظار کشیدند. بعد از این‌که انتظار کشیدند، یک بار دیگر سوار ترن هوایی شدند. آخرش با بس به خانه رفتند.
    note: قصه به گذشتهٔ ساده نوشته می‌شود. کلمه‌های ترتیب را پیدا کن تا ترتیب را دنبال کنی. یک جمله *hadden gewacht* دارد (فقط برای خواندن).
    glosses:
      Zaterdag: شنبه
      bang: ترسیده
      maar: اما
      Nadat: بعد از
      hadden: داشتند
      gewacht: انتظار کشیده (اسم مفعول)
      nog: باز هم، یک بار دیگر
      keer: وقت
  nl.a2.unit108.lesson05.teach.gn_voltooid_verleden:
    title: 'شناختن: چیزی که قبلاً شده بود (فقط برای خواندن)'
    gloss: بعد از این‌که انتظار کشیدند، یک بار دیگر سوار ترن هوایی شدند.
    note: '*Hadden gewacht* (hadden + اسم مفعول) گذشتهٔ بعید است. نشان می‌دهد چیزی پیش از یک لحظهٔ دیگرِ گذشته تمام شده بود. بعد از *nadat* فعل‌ها به آخر بند می‌روند و جملهٔ اصلی که بعدش می‌آید با فعلش شروع می‌شود: *gingen ze*. تو فقط وقتی می‌خوانی یا می‌شنوی باید آن را بشناسی؛ وقتی خودت قصه می‌گویی، گذشتهٔ ساده یا گذشتهٔ نقلی را به کار ببر.'
  nl.a2.unit108.lesson06.teach.beurt1:
    title: لوته می‌پرسد
    gloss: 'Lotte: سلام Omar، دیروز چه کار کردی؟'
  nl.a2.unit108.lesson06.teach.beurt2:
    title: Omar جواب می‌دهد
    gloss: 'Omar: من و Noor گشت با قایق کردیم.'
  nl.a2.unit108.lesson06.teach.beurt3:
    title: Lotte می‌پرسد اول چه بود
    gloss: 'Lotte: خوب! و اول چه کار کردید؟'
  nl.a2.unit108.lesson06.teach.beurt4:
    title: Omar رویدادهای اول را می‌گوید
    gloss: 'Omar: اول تکت خریدیم. بعد از آن سوار قایق شدیم.'
  nl.a2.unit108.lesson06.teach.beurt5:
    title: Lotte می‌پرسد بعدش چه شد
    gloss: 'Lotte: و بعد؟'
  nl.a2.unit108.lesson06.teach.beurt6:
    title: Omar قصه را تمام می‌کند
    gloss: 'Omar: بعد شهر را دیدیم. آخرش قهوه نوشیدیم.'
exercises:
  nl.a2.unit108.lesson01.exercise01.hoor_begin:
    instruction: گوش کنید و آنچه را می‌شنوید انتخاب کنید.
    correct_option: Eerst gingen ze naar de dierentuin.
    distractors:
    - Daarna gingen ze naar de dierentuin.
    - Eerst zagen ze de apen.
    - Uiteindelijk gingen ze naar de dierentuin.
    accepted_answers:
    - value: Eerst gingen ze naar de dierentuin.
      status: correct
    feedback: شنیدی *Eerst gingen ze naar de dierentuin.* کلمهٔ اول نشان می‌دهد که این رویداد اول است.
  nl.a2.unit108.lesson01.exercise02.kies_laatste:
    instruction: کلمهٔ هلندی را انتخاب کن.
    correct_option: uiteindelijk
    distractors:
