  notes: 'Derived from en-nl by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Dari (Afghanistan) string was translated and adapted. Needs native Dari (Afghanistan) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
course:
  title: هالندی A2
  description: هلندی A2 دستورمحور برای اشاره کردن به چیزها و مشخص کردن آن‌ها.
  learning_goal: هنگام خرید یا انتخاب، با dit، dat، deze و die به چیزها اشاره کنید و آن‌ها را مشخص کنید و از شکل تصغیر کار بگیرین.
units:
  nl.a2.unit101.deze_die_dit_dat:
    title: این یکی، آن یکی
    description: در بازار، نانوایی، گل‌فروشی و کتاب‌فروشی با dit، dat، deze، die و شکل‌های تصغیر به چیزها اشاره کنید و انتخاب کنید.
lessons:
  nl.a2.unit101.lesson01.dit_en_deze:
    title: 'این (نزدیک): dit و deze'
  nl.a2.unit101.lesson02.die_en_dat:
    title: 'آن (دور) و جمع: die و dat'
  nl.a2.unit101.lesson03.verkleinwoorden:
    title: 'چیزهای کوچک: تصغیر با -je'
  nl.a2.unit101.lesson04.winkelen:
    title: 'خرید: پرسیدن قیمت و انتخاب کردن'
  nl.a2.unit101.lesson05.bericht_van_noor:
    title: 'خواندن: پیامی از نور'
  nl.a2.unit101.lesson06.lotte_en_omar:
    title: 'گفتگو: لوته و عمر در بازار'
teaching:
  nl.a2.unit101.lesson01.teach.markt:
    title: در بازار
    gloss: بازار / دکان / سیب / بانجان رومی / پنیر
    note: 'هر اسم را با حرف تعریفش یاد بگیرین: de یا het. همهٔ اسم‌های این کارت کلمهٔ de استند.'
    example_gloss:
    - من در بازار استم.
    - من یک دکان را می‌بینم.
    - من یک سیب می‌گیرم.
  nl.a2.unit101.lesson01.teach.bakker:
    title: در نانوایی
    gloss: نانوا / نان / کیک / بسکویت
    note: '*Brood* کلمهٔ het است؛ بقیه کلمه‌های de استند.'
    example_gloss:
    - من پیش نانوا استم.
    - نان تازه است.
    - کیک خوشمزه است.
  nl.a2.unit101.lesson01.teach.bloemist:
    title: در گل‌فروشی
    gloss: گل‌فروش / گل سرخ / دسته گل
    note: '*Boeket* کلمهٔ het است؛ *roos* کلمهٔ de است.'
    example_gloss:
    - در گل‌فروشی یک گل سرخ می‌بینم.
    - دسته گل قشنگ است.
    - من یک دسته گل می‌گیرم.
  nl.a2.unit101.lesson01.teach.boekwinkel:
    title: در کتاب‌فروشی
    gloss: کتاب‌فروشی / کتاب / رمان / روزنامه
    note: '*Boek* کلمهٔ het است؛ بقیه کلمه‌های de استند.'
    example_gloss:
    - در کتاب‌فروشی دنبال یک کتاب می‌گردم.
    - من دنبال یک رمان می‌گردم.
    - روزنامه گران است.
  nl.a2.unit101.lesson01.teach.bijvoeglijk:
    title: توصیف چیزها
    gloss: تازه / خوشمزه / قشنگ / ارزان / گران / بزرگ / کوچک
    note: این کلمه‌ها بعد از *is* می‌آیند و تغییر نمی‌کنند.
    example_gloss:
    - بانجان رومی کوچک است.
    - کتاب ارزان است.
    - دکان بزرگ است.
  nl.a2.unit101.lesson01.teach.gn_dit_deze:
    title: 'این: dit یا deze'
    gloss: het brood → این نان؛ de taart → این کیک؛ de roos → این گل سرخ؛ het boek → این کتاب.
    note: 'برای اشاره به چیزی که نزدیک شما است، *dit* را با کلمهٔ het و *deze* را با کلمهٔ de به کار ببرید. پس باید حرف تعریف را بدانین: *dit brood* (het brood)، *deze taart* (de taart).'
  nl.a2.unit101.lesson01.teach.zinnen:
    title: دو جمله
    gloss: این نان تازه است. این کیک خوشمزه است.
  nl.a2.unit101.lesson02.teach.meervoud:
    title: جمع
    gloss: سیب‌ها / بانجان‌های رومی / گل‌های سرخ / کتاب‌ها / روزنامه‌ها
    note: 'اسم‌های جمع به -s یا -en ختم می‌شوند. *Het boek* به *de boeken* تبدیل می‌شود: در جمع هر اسم *de* می‌گیرد.'
    example_gloss:
    - سیب‌ها ارزان استند.
    - بانجان‌های رومی خوشمزه استند.
    - گل‌های سرخ قشنگ استند.
  nl.a2.unit101.lesson02.teach.gn_die_dat:
    title: 'آن: dat یا die'
    gloss: het brood → آن نان؛ de taart → آن کیک؛ het boek → آن کتاب؛ de roos → آن گل سرخ.
    note: 'برای اشاره به چیزی که دورتر است، *dat* را با کلمهٔ het و *die* را با کلمهٔ de به کار ببرید. الگو مثل *dit* و *deze* است: *dit/dat* برای کلمه‌های het و *deze/die* برای کلمه‌های de.'
  nl.a2.unit101.lesson02.teach.gn_meervoud:
    title: 'جمع: همیشه deze یا die'
    gloss: deze appels، deze boeken ← این سیب‌ها، این کتاب‌ها؛ die rozen، die boeken ← آن گل‌های سرخ، آن کتاب‌ها.
    note: 'با اسم جمع همیشه *deze* (نزدیک) یا *die* (دور) را به کار می‌برید، حتی وقتی مفرد آن کلمهٔ het است: *dit boek*، ولی *deze boeken*. پیش از اسم، *dit* و *dat* فقط برای کلمه‌های مفرد het استند (به‌تنهایی، مثل *Wat is dat?*، می‌توانند به هر چیزی اشاره کنند).'
  nl.a2.unit101.lesson02.teach.zinnen:
    title: سه جمله
    gloss: آن کیک بزرگ است. آن نان کوچک است. آن سیب‌ها ارزان استند.
  nl.a2.unit101.lesson03.teach.verkleinwoorden:
    title: چیزهای کوچک
    gloss: نان کوچک / کتاب کوچک / بسکویت کوچک / گل سرخ کوچک / سیب کوچک / دسته گل کوچک
    note: تصغیر نام چیزی کوچک یا دوست‌داشتنی است. نانوا، گل‌فروش و کتاب‌فروش همیشه از آن کار می‌گیرند.
    example_gloss:
    - این نان کوچک خوشمزه است.
    - دسته گل کوچک قشنگ است.
    - کتاب کوچک ارزان است.
  nl.a2.unit101.lesson03.teach.gn_je:
    title: 'تصغیر: -je'
    gloss: نان → نان کوچک؛ کتاب → کتابچه؛ کلچه → کلچهٔ کوچک؛ گل سرخ → گل سرخ کوچک؛ بادنجان رومی → بادنجان رومی کوچک.
    note: 'به بیشتر کلمه‌ها فقط -je اضافه می‌شود: *brood* می‌شود *broodje* و *boek* می‌شود *boekje*.'
  nl.a2.unit101.lesson03.teach.bijzonder:
    title: دو اسم دیگر
    gloss: درخت / میز
    example_gloss:
    - من یک درخت می‌بینم.
    - میز بزرگ است.
  nl.a2.unit101.lesson03.teach.gn_tje_pje:
    title: 'تصغیر: -tje و -pje'
    gloss: سیب → سیب کوچک؛ میز → میز کوچک؛ درخت → درخت کوچک؛ دکان → دکان کوچک؛ گل → دسته گل کوچک.
    note: بعد از -el، -tje اضافه می‌شود (*appeltje*). بعد از -m با مصوت بلند، -pje اضافه می‌شود (*boompje*، *kraampje*). چند کلمه بیشتر تغییر می‌کنند، مثل *bloem* که *bloemetje* می‌شود. این‌ها را وقتی به آن‌ها برخورد می‌کنین یاد بگیرین.
  nl.a2.unit101.lesson03.teach.gn_het:
    title: تصغیر همیشه کلمهٔ het است
    gloss: 'سیب → سیب کوچک: این سیب کوچک، آن سیب کوچک. گل سرخ → گل سرخ کوچک: این گل سرخ کوچک، آن گل سرخ کوچک.'
    note: هر تصغیر کلمهٔ het است، حتی وقتی کلمهٔ اصلی کلمهٔ de باشد. پس *de appel* می‌شود *het appeltje* و شما می‌گویید *dit appeltje* و *dat appeltje*، هرگز *deze appeltje* نه.
  nl.a2.unit101.lesson03.teach.gn_meervoud_je:
    title: جمع تصغیر
    gloss: 'نان کوچک → نان‌های کوچک: این نان‌های کوچک. کتابچه → کتابچه‌ها: آن کتابچه‌ها. دسته گل کوچک → دسته گل‌های کوچک. گل سرخ کوچک → گل‌های سرخ کوچک.'
    note: 'جمع تصغیر به -jes ختم می‌شود: *broodjes*، *boekjes*، *appeltjes*، *roosjes*. در جمع، مثل هر جمع دیگر، *deze* و *die* به کار می‌رود.'
  nl.a2.unit101.lesson04.teach.prijzen:
    title: قیمت‌ها
    gloss: قیمتش چند است / قیمتشان چند است / یورو / دو / سه / چهار / پنج
    note: با یک چیز *kost* و با بیشتر از یک چیز *kosten* به کار ببرید.
    example_gloss:
    - این نان کوچک دو یورو است.
    - این گل‌های سرخ پنج یورو استند.
    - آن کتاب سه یورو است.
  nl.a2.unit101.lesson04.teach.gn_kost:
    title: Kost یا kosten
    gloss: قیمت این نان کوچک چند است؟ قیمت این نان‌های کوچک چند است؟
    note: 'فعل با اسمی که به آن اشاره می‌شود مطابقت می‌کند: برای یک چیز *kost* و برای چند چیز *kosten* می‌آید.'
  nl.a2.unit101.lesson04.teach.kiezen:
    title: انتخاب کردن و پرسیدن
    gloss: من آن کتابچه را می‌گیرم. من دنبال یک رمان می‌گردم. این دسته گل کوچک دو یورو است.
  nl.a2.unit101.lesson04.teach.gn_alleen:
    title: dit و dat به‌تنهایی
    gloss: آن چیست؟ آن یک گل سرخ است.
    note: 'وقتی بدون اسم اشاره می‌کنین و می‌پرسید چیزی چیست، *dit* یا *dat* می‌گویید، حتی اگر آن چیز کلمهٔ de باشد: *Wat is dat? Dat is een roos.*'
  nl.a2.unit101.lesson05.teach.reading:
    title: پیام نور
    gloss: سلام لوته! من در بازار استم. این سیب‌ها ارزان استند و آن بادنجان‌های رومی خوشمزه استند. نزد نانوا این نان کوچک است، اما آن نان بزرگ است. من این نان کوچک را می‌گیرم. آن گل‌های سرخ قشنگ استند، اما این دسته گل کوچک ارزان است. من این دسته گل کوچک را برای تو می‌گیرم!
    note: 'دقت کنید نور با هر اسم کدام کلمه را به کار می‌برد: dit/dat با کلمه‌های het، و deze/die با کلمه‌های de و با جمع‌ها.'
    glosses:
      hoi: سلام
      maar: اما
      voor: برای
      jou: تو
      bij: نزد / در
  nl.a2.unit101.lesson06.teach.lotte_brood:
    title: لوته نان را نشان می‌دهد
    gloss: 'لوته: عمر، ببین! این نان تازه است.'
  nl.a2.unit101.lesson06.teach.omar_broodje:
    title: عمر به نان کوچکی که دورتر است اشاره می‌کند
    gloss: 'عمر: بلی، و آن نان کوچک ارزان است.'
  nl.a2.unit101.lesson06.teach.lotte_neemt:
    title: لوته انتخاب می‌کند
    gloss: 'لوته: پس من آن نان کوچک را می‌گیرم. و تو؟'
  nl.a2.unit101.lesson06.teach.omar_taart:
    title: عمر انتخاب می‌کند
    gloss: 'عمر: من این کیک و این کلچه را می‌گیرم.'
  nl.a2.unit101.lesson06.teach.lotte_bloemetje:
    title: لوته دسته گل را می‌بیند
    gloss: 'لوته: ببین، این دسته گل کوچک قشنگ است!'
  nl.a2.unit101.lesson06.teach.omar_rozen:
    title: عمر به گل‌های سرخ اشاره می‌کند
    gloss: 'عمر: بلی، و آن گل‌های سرخ هم قشنگ استند.'
