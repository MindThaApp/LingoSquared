  nl.a2.unit101.lesson01.exercise05.volgorde_taart:
    instruction: 'کلمه‌ها را مرتب کنید: «این کیک خوشمزه است.»'
    correct_option: Deze taart is lekker
    accepted_answers:
    - value: Deze taart is lekker
      status: correct
    feedback: '*Deze taart is lekker.* یعنی: این کیک خوشمزه است.'
  nl.a2.unit101.lesson01.exercise06.vertaal_boek:
