teaching:
  nl.a2.unit26.lesson01.teach.bankrekening:
    title: حساب بانکی
    gloss: حساب بانکی
    note: 'اسمی با جنس عام: de bankrekening، مرکب از bank و rekening (حساب).'
    example_gloss: می‌خواهم یک حساب بانکی باز کنم.
  nl.a2.unit26.lesson01.teach.rekening_openen:
    title: درخواست باز کردن حساب
    gloss: می‌خواهم یک حساب بانکی باز کنم.
    note: Wil graag درخواست را مؤدبانه‌تر می‌سازد؛ همین الگو در تمام این کورس دوباره استفاده می‌شود.
  nl.a2.unit26.lesson01.teach.welke_rekening:
    title: کارمند می‌پرسد کدام نوع
    gloss: چه نوع حسابی می‌خواهین باز کنید؟
    note: Wat voor + اسم یعنی «چه نوع»؛ مصدر openen بعد از فعل کمکی wilt به آخر سوال می‌رود.
  nl.a2.unit26.lesson02.teach.betaalrekening:
    title: حساب پرداخت
    gloss: حساب پرداخت / حساب جاری
    note: 'اسمی با جنس عام: de betaalrekening، حساب جاری معمول روزمره در هالند.'
    example_gloss: یک حساب پرداخت برای معاش خودم می‌خواهم.
  nl.a2.unit26.lesson02.teach.salaris:
    title: معاش
    gloss: معاش
    note: 'اسمی با جنس خنثی: het salaris.'
    example_gloss: کارفرمای شما معاش تان را به این حساب واریز می‌کند.
  nl.a2.unit26.lesson02.teach.betaalrekening_salaris:
    title: بیان هدف حساب
    gloss: یک حساب پرداخت برای معاش خودم می‌خواهم.
    note: Voor mijn salaris هدف حساب را مشخص می‌کند.
  nl.a2.unit26.lesson02.teach.werkgever_stort:
    title: معاش چطور می‌رسد
    gloss: کارفرمای شما معاش تان را به این حساب واریز می‌کند.
    note: Storten (واریز کردن) فعل معمول برای انتقال پول به حساب است؛ op deze rekening مقصد را مشخص می‌کند.
  nl.a2.unit26.lesson02.teach.storten_infinitive:
    title: شکل مصدر
    gloss: Storten مصدر stort است.
    note: شکل قاموسی یا مصدر، که با شکل صرف‌شدهٔ شخص سوم در جملهٔ بالا فرق دارد.
  nl.a2.unit26.lesson03.teach.identiteitsbewijs:
    title: سند هویت
    gloss: سند هویت
    note: 'اسمی با جنس خنثی: het identiteitsbewijs، اصطلاح عمومی هالندی که پاسپورت یا کارت هویت را در بر می‌گیرد.'
    example_gloss: آیا نمبر BSN و یک سند هویت معتبر همراه تان است؟
  nl.a2.unit26.lesson03.teach.bsn_nodig:
    title: کارمند اسناد را می‌خواهد
    gloss: آیا نمبر BSN و یک سند هویت معتبر همراه تان است؟
    note: Bij zich hebben (همراه داشتن) همان الگوی رسمی ملاقات در شاروالی در درس ۲۴ است.
  nl.a2.unit26.lesson03.teach.hier_is:
    title: تسلیم کردن اسناد
    gloss: بلی، این هم پاسپورت و نمبر BSN من.
    note: Hier is (این است) راه طبیعی در هالندی برای دادن چیزی به کسی است.
  nl.a2.unit26.lesson04.teach.bankpas:
    title: کارت بانکی
    gloss: کارت بانکی
    note: 'اسمی با جنس عام: de bankpas، کارت دیبت هالندی.'
    example_gloss: کارت بانکی تان را ظرف یک هفته از طریق پست دریافت می‌کنین.
  nl.a2.unit26.lesson04.teach.bankpas_uitleg:
    title: توضیح رسیدن کارت
    gloss: کارت بانکی تان را ظرف یک هفته از طریق پست دریافت می‌کنین.
    note: Binnen een week (ظرف یک هفته) مدت زمان را بیان می‌کند؛ الگوی ontvangt... per post از نمبر BSN در درس ۲۴ دوباره می‌آید.
  nl.a2.unit26.lesson04.teach.mobiel_bankieren:
    title: معرفی بانکداری موبایلی
    gloss: با اپلیکیشن می‌توانین بانکداری موبایلی هم بکنین.
    note: Mobiel bankieren (بانکداری موبایلی) اصطلاح معمول هالندی برای کار بانکی از طریق اپلیکیشن موبایل است.
  nl.a2.unit26.lesson05.teach.folder:
    title: خواندن بروشور حساب بانکی
    gloss: برای باز کردن حساب پرداخت به یک سند هویت معتبر و نمبر BSN تان ضرورت دارید. کارفرمای شما از این حساب برای واریز معاش تان استفاده می‌کند. بعد از باز شدن حساب، ظرف یک هفته یک کارت بانکی از طریق پست دریافت می‌کنین.
    note: به اسناد ضروری، هدف حساب و زمان رسیدن کارت توجه کنید.
    glosses:
      betaalrekening: حساب پرداخت / حساب جاری
      openen: باز کردن
      heeft: دارید (شکل رسمی؛ «heeft u ... nodig» یعنی ضرورت دارید)
      geldig: معتبر
      identiteitsbewijs: سند هویت / کارت هویت
      BSN-nummer: نمبر خدمات شهروندی (نمبر هویت اجتماعی و مالیاتی در هالند)
      nodig: ضروری (nodig hebben یعنی ضرورت داشتن)
      werkgever: کارفرما
      gebruikt: استفاده می‌کند (شخص سوم gebruiken)
      rekening: حساب
      salaris: معاش
      storten: پول انتقال دادن
      opening: افتتاح (حساب)
      ontvangt: دریافت کردن (شکل رسمی «u ontvangt» = شما دریافت می‌کنین)
      binnen: ظرف
      week: هفته
      bankpas: کارت بانکی
      post: پُست (‌«per post» = از طریق پُست)
  nl.a2.unit26.lesson05.teach.ik_heb_nodig:
    title: گفتن آنچه خودتان نیاز دارید
    gloss: من یک هویت‌نامهٔ معتبر و شمارهٔ BSN خودم را لازم دارم.
    note: Heb شکل «ik» فعل hebben است. اینجا به جای شکل رسمی heeft u ... nodig در بروشور آمده تا همان نیازمندی از نگاه خودتان گفته شود.
  nl.a2.unit26.lesson06.teach.medewerker_greet:
    title: کارمند به عمر سلام می‌دهد
    gloss: 'کارمند: صبح بخیر، چطور کمکتان کنم؟'
    note: Waarmee kan ik u helpen? همان احوال‌پرسی رسمی خدمات است که در دیدار از گمیونه در واحد ۲۴ آمده بود.
  nl.a2.unit26.lesson06.teach.omar_state_purpose:
    title: عمر مقصدش را می‌گوید
    gloss: 'عمر: صبح بخیر، می‌خواهم برای معاشم یک حساب پرداخت باز کنم.'
    note: درخواست‌های درس اول و درس دوم در یک جملهٔ آغازین طبیعی یکجا شده‌اند.
  nl.a2.unit26.lesson06.teach.medewerker_ask_documents:
    title: کارمند اسناد را می‌خواهد
    gloss: 'کارمند: البته. شمارهٔ BSN و یک هویت‌نامهٔ معتبر همراهتان است؟'
    note: دقیقاً مطابق عبارتی است که در درس سوم آموزش داده شد.
  nl.a2.unit26.lesson06.teach.omar_hand_over:
    title: عمر اسناد را می‌دهد
    gloss: 'عمر: بلی، این هم پاسپورتم و شمارهٔ BSN من.'
    note: با شمارهٔ BSN ای که عمر در واحد ۲۴ گرفت مطابقت دارد.
  nl.a2.unit26.lesson06.teach.medewerker_confirm:
    title: کارمند تأیید می‌کند
    gloss: 'کارمند: تشکر. کارت بانکی‌تان را ظرف یک هفته از طریق پُست دریافت می‌کنین و با اپلیکیشن می‌توانین بانکداری موبایلی هم بکنین.'
    note: معلومات رسیدن کارت و بانکداری موبایلی از درس چهارم یکجا شده‌اند.
  nl.a2.unit26.lesson06.teach.omar_thanks:
    title: عمر از کارمند تشکر می‌کند
    gloss: 'عمر: عالی، بسیار تشکر از کمکتان!'
    note: جملهٔ پایانی dank u wel voor uw hulp از دیدار گمیونه در واحد ۲۴ دوباره آمده است.
  nl.a2.unit26.lesson06.teach.summary_grammar:
    title: خلاصهٔ این دیدار
    gloss: عمر یک حساب بانکی باز کرد. کارت بانکی‌اش را از طریق پُست دریافت می‌کند.
    note: Heeft ... geopend شکل ماضی نقلی فعل openen است (geopend اسم مفعول است)؛ zijn اینجا ضمیر ملکی «او (مرد)» است.
