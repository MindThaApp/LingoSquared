course:
  title: هالندی A2
  description: گرامر هلندی سطح A2 برای پیش‌بینی کردن و وعده دادن.
  learning_goal: با zullen بگویین چه اتفاقی می‌افتد و وعده بدهین، آن را با gaan مقایسه کنید و با misschien تردید را بیان کنید.
units:
  nl.a2.unit86.voorspellingen_en_beloftes:
    title: پیش‌بینی‌ها و وعده‌ها
    description: هوا را پیش‌بینی کنید، وعده بدهین و بگویین چه چیزی ممکن است اتفاق بیفتد.
lessons:
  nl.a2.unit86.lesson01.het_weer_van_morgen:
    title: هوای فردا
  nl.a2.unit86.lesson02.ik_zal_het_doen:
    title: من آن را انجام می‌دهم
  nl.a2.unit86.lesson03.zullen_of_gaan:
    title: Zullen یا gaan؟
  nl.a2.unit86.lesson04.misschien:
    title: شاید
  nl.a2.unit86.lesson05.bericht_en_mededeling:
    title: یک پیام و یک اطلاعیه
  nl.a2.unit86.lesson06.lotte_en_omar_beloven:
    title: لوته و عمر وعده می‌دهند
teaching:
  nl.a2.unit86.lesson01.teach.weer:
    title: هوا
    gloss: هوا / آفتاب / فردا / امروز / سرد / گرم
    note: این کلمه‌ها هوا و روز را توصیف می‌کنند.
    example_gloss:
    - امروز هوا گرم است.
    - آفتاب می‌تابد.
    - فردا هوا سرد است.
  nl.a2.unit86.lesson01.teach.werkwoorden:
    title: فعل‌های هوا
    gloss: باران باریدن / تابیدن / بودن
    note: '*Regent* و *schijnt* شکل‌های زمان حال برای امروز استند. این درس آینده را اضافه می‌کند.'
    example_gloss:
    - امروز باران می‌بارد.
    - امروز آفتاب می‌تابد.
    - هوا گرم است.
  nl.a2.unit86.lesson01.teach.verwachting:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا / طبق
    note: '*Volgens* منبع یک پیش‌بینی را معرفی می‌کند.'
    example_gloss:
    - پیش‌بینی هوا خوب است.
    - طبق پیش‌بینی هوا، فردا هوا گرم است.
  nl.a2.unit86.lesson01.teach.gn_zullen_vormen:
    title: 'Zullen: شکل‌ها'
    gloss: من خواهم / تو خواهی / او خواهد / ما، آن‌ها خواهیم، خواهند
    note: '*Zullen* فعل پیش‌بینی و وعده است. شکل مفرد *zal* است (با *jij/je* همچنین *zult*) و شکل جمع *zullen* است. در گفتار کوتاه‌شده: *we, ze, je*.'
  nl.a2.unit86.lesson01.teach.gn_zullen_zin:
    title: Zullen + مصدر
    gloss: فردا باران خواهد بارید. فردا باران خواهد بارید.
    note: '*Zal* فعل صرف‌شده است و در جایگاه دوم می‌ماند؛ مصدر در آخر جمله می‌آید. اگر یک کلمه‌ی زمان در اول بیاید، فاعل بعد از *zal* می‌آید: *Morgen zal het regenen*. برای پیش‌بینی از *zullen* استفاده کنید.'
  nl.a2.unit86.lesson01.teach.zinnen:
    title: جمله‌های پیش‌بینی
    gloss: طبق پیش‌بینی هوا، فردا آفتاب خواهد تابید. هوا سرد خواهد بود.
  nl.a2.unit86.lesson02.teach.beloftes:
    title: کلمه‌های وعده
    gloss: وعده دادن / وعده / انجام دادن / کمک کردن / تیلفون کردن
    note: این فعل‌ها در وعده‌ها زیاد به کار می‌روند.
    example_gloss:
    - وعده می‌دهم.
    - این یک وعده است.
    - من می‌توانم به تو کمک کنم.
    - ممکن است به من تیلفون کنی؟
  nl.a2.unit86.lesson02.teach.afspraken:
    title: تعهدها
    gloss: به وقت / حتماً / فراموش کردن / آمدن / نه
    note: '*Op tijd* یعنی به وقت، نه دیر.'
    example_gloss:
    - او به وقت می‌آید.
    - من آن را فراموش نکرده‌ام.
    - من حتماً آن را انجام می‌دهم.
  nl.a2.unit86.lesson02.teach.gn_belofte:
    title: Zullen برای وعده
    gloss: من آن را انجام می‌دهم. من به تو کمک می‌کنم. من به تو تیلفون می‌کنم.
    note: با *ik*، فعل *zal* می‌تواند یک وعده یا یک تعهد قاطع بسازد. مصدر (*doen, helpen, bellen*) در آخر جمله می‌آید.
  nl.a2.unit86.lesson02.teach.gn_niet:
    title: Niet و op tijd
    gloss: من آن را فراموش نمی‌کنم. من به وقت می‌آیم.
    note: '*Niet* معمولاً بعد از *het* و پیش از مصدر پایانی می‌آید: *het niet vergeten*. عبارتی مثل *op tijd* هم پیش از مصدر پایانی می‌آید.'
  nl.a2.unit86.lesson02.teach.zinnen:
    title: جمله‌های وعده
    gloss: ما به وقت می‌آییم. من حتماً آن را انجام می‌دهم.
  nl.a2.unit86.lesson03.teach.signalen:
    title: نشانه‌ها و برنامه‌ها
    gloss: ببین / ابر / تاریک / امشب / کار کردن / آشپزی کردن
    note: '*Kijk* توجه را به چیزی که می‌بینین جلب می‌کند.'
    example_gloss:
    - ببین، ابرها تاریک‌اند.
    - عمر امروز کار می‌کند.
    - من می‌خواهم امشب آشپزی کنم.
  nl.a2.unit86.lesson03.teach.gn_gaan_plan:
    title: Gaan برای برنامه
    gloss: من فردا قصد دارم کار کنم. عمر امشب قصد دارد آشپزی کند.
    note: '*Gaan* + مصدر می‌گوید کسی چه کاری را برنامه‌ریزی کرده است. مصدر در آخر جمله می‌آید.'
  nl.a2.unit86.lesson03.teach.gn_gaan_zicht:
    title: Gaan برای چیزی که می‌بینین
    gloss: ببین، ابرها تاریک‌اند. باران می‌بارد.
    note: 'وقتی نشانه را همین حالا می‌بینین از *gaan* استفاده کنید: ابرهای تاریک، پس *Het gaat regenen*.'
  nl.a2.unit86.lesson03.teach.gn_contrast:
    title: Zullen در مقابل gaan
    gloss: فردا باران خواهد بارید (پیش‌بینی). ببین، باران می‌بارد (آن را می‌بینم). من فردا قصد دارم کار کنم (برنامه). من آن را انجام می‌دهم (وعده).
    note: 'در این درس: *zullen* برای پیش‌بینی یا وعده، *gaan* برای برنامه یا چیزی که نشانه‌اش را می‌بینین. در گفتار روزمره *gaan* برای پیش‌بینی و حتی برای وعده هم رایج است (*Ik ga het doen*)؛ *zullen* بیشتر در پیش‌بینی‌ها، اطلاعیه‌ها و وعده‌های رسمی به کار می‌رود.'
  nl.a2.unit86.lesson03.teach.zinnen:
    title: جمله‌های gaan
    gloss: ببین، باران می‌بارد. من فردا قصد دارم کار کنم.
  nl.a2.unit86.lesson04.teach.misschien_woorden:
    title: شاید و دیر
    gloss: شاید / بعداً / دیر / خیلی دیر
    note: '*Misschien* نشان می‌دهد که مطمئن نیستین.'
    example_gloss:
    - شاید بعداً بیایم.
    - دیر شده است.
    - بس دیر کرده است.
  nl.a2.unit86.lesson04.teach.week:
    title: کار و وقت ملاقات
    gloss: وقت ملاقات / کار / همکار / دوشنبه / جمعه / شنبه
    note: روزهای هفته در زبان هلندی با حرف کوچک نوشته می‌شوند.
    example_gloss:
    - لوته روز جمعه وقت ملاقات دارد.
    - عمر روز دوشنبه کار دارد.
    - نور روز شنبه کار می‌کند.
  nl.a2.unit86.lesson04.teach.gn_misschien_voorop:
    title: «شاید» در آغاز جمله
    gloss: شاید نور فردا بیاید. شاید باران ببارد.
    note: 'وقتی *misschien* در آغاز جمله می‌آید، فعل بلافاصله بعد از آن می‌آید و فاعل بعد از فعل: *komt Noor*، *regent het*. فاعل را پیش از فعل نگذارید.'
  nl.a2.unit86.lesson04.teach.gn_misschien_midden:
    title: «شاید» بعد از فعل
    gloss: شاید نور فردا بیاید. شاید باران ببارد.
    note: '*Misschien* بعد از فعل هم آمده می‌تواند. فعل در جای دوم می‌ماند و معنا یکسان است.'
  nl.a2.unit86.lesson04.teach.gn_zeker:
    title: Zeker یا misschien
    gloss: حتماً باران می‌بارد. شاید باران ببارد.
    note: '*Zeker* نشان می‌دهد که شما مطمئن استین و *misschien* نشان می‌دهد که مطمئن نیستین. هر دو با *zal* می‌آیند.'
  nl.a2.unit86.lesson04.teach.zinnen:
    title: جمله‌های «شاید»
    gloss: شاید من دیر کنم. شاید عمر وقت داشته باشد. شاید هوا سرد باشد.
  nl.a2.unit86.lesson05.teach.bericht_woorden:
    title: کلمه‌های پیام
    gloss: ماندن / خریدن / قهوه / بسکویت / هم / پس، آنوقت / تا / در خانه
    note: '*Tot zaterdag* یعنی روز شنبه می‌بینمت.'
    example_gloss:
    - من در خانه می‌مانم.
    - می‌خواهم قهوه بخرم.
    - فردا می‌بینمت!
  nl.a2.unit86.lesson05.teach.mededeling_woorden:
    title: کلمه‌های اطلاعیه
    gloss: اطلاعیه / جلسه / ساعت نه / همه / آنجا
    note: '*Om negen uur* وقت را می‌گوید. *Er zal koffie zijn* یعنی قهوه خواهد بود.'
    example_gloss:
    - این یک اطلاعیه است.
    - جلسه امروز است.
    - همه آنجا استند.
  nl.a2.unit86.lesson05.teach.gn_weerbericht:
    title: سبک پیش‌بینی هوا
    gloss: صبح آفتاب می‌تابد. چاشت باران می‌بارد.
    note: در پیش‌بینی هوا و اطلاعیه‌ها اکثراً *zullen* به کار می‌رود. وقتی عبارت زمان در آغاز جمله می‌آید، *zal* بعد از آن می‌آید و فاعل بعد از zal.
  nl.a2.unit86.lesson05.teach.lezen_bericht:
    title: پیام نور
    gloss: سلام لوته و عمر، طبق پیش‌بینی هوا روز شنبه باران می‌بارد. شاید آنوقت ما در خانه بمانیم. من قهوه و بسکویت می‌خرم. من هم به وقت می‌آیم. تا روز شنبه! نور
    note: پیش‌بینی، پلان نامطمئن و وعده‌ها را پیدا کنید.
    glosses:
      volgens: طبق
      weersverwachting: پیش‌بینی هوا
      blijven: ماندن
      koffie: قهوه
      koekjes: بسکویت‌ها
      kopen: خریدن
      tot: تا / به امید دیدار
  nl.a2.unit86.lesson05.teach.lezen_mededeling:
    title: یک اطلاعیه
    gloss: اطلاعیه. فردا جلسه ساعت نه شروع می‌شود. همه به وقت می‌آیند. قهوه هم خواهد بود.
    note: اطلاعیه می‌گوید چه چیزی واقع خواهد شد.
    glosses:
      vergadering: جلسه
      negen: نُه
      uur: ساعت
      iedereen: همه
      koffie: قهوه
  nl.a2.unit86.lesson06.teach.lotte1:
    title: لوته درباره روز شنبه می‌پرسد
    gloss: 'لوته: سلام عمر، روز شنبه کار می‌کنی؟'
  nl.a2.unit86.lesson06.teach.omar1:
    title: عمر مطمئن نیست
    gloss: 'عمر: شاید روز شنبه کار کنم. به تو زنگ می‌زنم.'
  nl.a2.unit86.lesson06.teach.lotte2:
    title: لوته پیش‌بینی هوا را می‌گوید
    gloss: 'لوته: طبق پیش‌بینی هوا روز شنبه باران می‌بارد.'
  nl.a2.unit86.lesson06.teach.omar2:
    title: عمر پلان می‌گیرد
    gloss: 'عمر: پس شاید در خانه بمانم. می‌خواهم آشپزی کنم.'
  nl.a2.unit86.lesson06.teach.lotte3:
    title: لوته می‌گوید بسکویت می‌خرد
    gloss: 'لوته: عالی! من بسکویت می‌خرم.'
  nl.a2.unit86.lesson06.teach.omar3:
    title: عمر وعده می‌خواهد
    gloss: 'عمر: وعده می‌دهی؟'
  nl.a2.unit86.lesson06.teach.lotte4:
    title: لوته وعده می‌دهد
    gloss: 'لوته: وعده می‌دهم.'
exercises:
  nl.a2.unit86.lesson01.exercise01.kies_regenen:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: Het zal morgen regenen.
    distractors:
    - Het regent vandaag.
    - Het zal morgen koud zijn.
    - De zon schijnt vandaag.
    accepted_answers:
    - value: Het zal morgen regenen.
      status: correct
    feedback: '*Het zal morgen regenen* = فردا باران می‌بارد.'
    prompt_blocks:
    - فردا باران می‌بارد.
  nl.a2.unit86.lesson01.exercise02.kies_zon:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: De zon zal schijnen.
    distractors:
    - De zon schijnt vandaag.
    - Het zal koud zijn.
    - Het zal morgen regenen.
    accepted_answers:
    - value: De zon zal schijnen.
      status: correct
    feedback: '*De zon zal schijnen* = آفتاب می‌تابد.'
    prompt_blocks:
    - آفتاب می‌تابد.
  nl.a2.unit86.lesson01.exercise03.woordenschat:
    instruction: هر کلمهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: weer
        right: هوا
      - left: zon
        right: آفتاب
      - left: morgen
        right: فردا
      - left: vandaag
        right: امروز
      - left: koud
        right: سرد
      - left: warm
        right: گرم
      - left: regenen
        right: باران باریدن
      - left: schijnen
        right: تابیدن
      status: correct
    feedback: این‌ها کلمه‌های مهم پیش‌بینی هوا استند.
    pairs:
    - left: weer
      right: هوا
    - left: zon
      right: آفتاب
    - left: morgen
      right: فردا
    - left: vandaag
      right: امروز
    - left: koud
      right: سرد
    - left: warm
      right: گرم
    - left: regenen
      right: باران باریدن
    - left: schijnen
      right: تابیدن
  nl.a2.unit86.lesson01.exercise04.volgorde_koud:
    instruction: کلمه‌ها را مرتب کنید تا بگویین «فردا هوا سرد خواهد بود.»
    correct_option: Het zal morgen koud zijn
    accepted_answers:
    - value: Het zal morgen koud zijn
      status: correct
    - value: Morgen zal het koud zijn
      status: correct
    feedback: '*Zal* در جای دوم است؛ *zijn* در آخر. وقتی *Morgen* اول می‌آید، فاعل بعد از *zal* می‌آید.'
  nl.a2.unit86.lesson01.exercise05.vul_zal:
    instruction: با شکل مفرد فعل zullen جای خالی را پر کنید.
    correct_option: zal
    accepted_answers:
    - value: zal
      status: correct
    feedback: '*Het zal morgen regenen.*'
  nl.a2.unit86.lesson01.exercise06.vertaal_warm:
    instruction: با استفاده از zullen به هالندی ترجمه کنید.
    accepted_answers:
    - value: Het zal morgen warm zijn.
      status: correct
    - value: Het zal morgen warm zijn
      status: correct
    - value: Morgen zal het warm zijn.
      status: correct
    - value: Morgen zal het warm zijn
      status: correct
    feedback: '*Het zal morgen warm zijn* یا *Morgen zal het warm zijn*.'
    prompt_blocks:
    - فردا هوا گرم می‌شود.
  nl.a2.unit86.lesson01.exercise07.schrijf_zon:
    instruction: جمله هلندی خواسته‌شده را با zullen بنویسین.
    correct_option: De zon zal morgen schijnen.
    accepted_answers:
    - value: De zon zal morgen schijnen.
      status: correct
    - value: De zon zal morgen schijnen
      status: correct
    - value: Morgen zal de zon schijnen.
      status: correct
    - value: Morgen zal de zon schijnen
      status: correct
    feedback: '*De zon zal morgen schijnen.*'
    prompt_blocks:
    - 'به هلندی بنویسین: فردا آفتاب می‌تابد.'
  nl.a2.unit86.lesson02.exercise01.kies_helpen:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: Ik zal je helpen.
    distractors:
    - Ik zal je bellen.
    - Ik zal het doen.
    - Ik zal het niet vergeten.
    accepted_answers:
    - value: Ik zal je helpen.
      status: correct
    feedback: '*Ik zal je helpen* = من به تو کمک می‌کنم.'
    prompt_blocks:
    - من به تو کمک می‌کنم.
  nl.a2.unit86.lesson02.exercise02.kies_vergeten:
    instruction: جملهٔ هالندی را انتخاب کنید.
    correct_option: Ik zal het niet vergeten.
    distractors:
    - Ik zal het vergeten.
    - Ik zal het doen.
    - Ik zal op tijd komen.
    accepted_answers:
    - value: Ik zal het niet vergeten.
      status: correct
    feedback: '*Niet* پیش از مصدر آخر جمله می‌آید.'
    prompt_blocks:
    - من آن را فراموش نمی‌کنم.
  nl.a2.unit86.lesson02.exercise03.beloftes:
    instruction: هر وعده هلندی را با معنای آن در دری جور کنید.
    accepted_answers:
    - value:
      - left: Ik zal je helpen
        right: من به تو کمک می‌کنم
      - left: Ik zal je bellen
        right: من به تو تیلفون می‌کنم
      - left: Ik zal het doen
        right: من آن را انجام می‌دهم
      - left: Ik zal het niet vergeten
        right: من آن را فراموش نمی‌کنم
      - left: Ik zal op tijd komen
        right: من به وقت می‌آیم
