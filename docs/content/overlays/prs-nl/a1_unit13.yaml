teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden برای خوراکی و نوشیدنی
    gloss: برای خوراکی و نوشیدنی، هلندی اغلب lekker vinden را به کار می‌برد.
    note: در دری برای همه چیز «دوست داشتن» می‌گوییم، اما در هلندی برای مزه می‌گویند *Ik vind ... lekker*، یعنی «آن را خوشمزه می‌یابم».
  nl.a1.unit13.lesson01.teach.koffie:
    title: دوست داشتن قهوه
    gloss: من قهوه را دوست دارم.
    note: خوراکی یا نوشیدنی بین *vind* و *lekker* می‌آید.
  nl.a1.unit13.lesson01.teach.thee:
    title: دوست نداشتن چای
    gloss: من چای را دوست ندارم.
    note: برای رد کردن مزه، *niet* را پیش از *lekker* بگذار.
  nl.a1.unit13.lesson01.teach.question:
    title: پرسیدن دربارهٔ مزه
    gloss: سوپ بادرنگ رومی را دوست داری؟
    note: در سوال غیررسمی، *vind* پیش از *je* می‌آید. این ادامهٔ سبک *jij/je* در این کورس است.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden برای کارها و فعالیت‌ها
    gloss: 'برای فعالیت‌ها، هلندی اغلب leuk vinden را به کار می‌برد: من بایسکل‌سواری را دوست دارم.'
    note: برای فعالیتی مثل بایسکل‌سواری از *leuk* استفاده کن، نه *lekker*.
  nl.a1.unit13.lesson02.teach.walking:
    title: دوست داشتن قدم زدن
    gloss: من قدم زدن را دوست دارم.
    note: فعالیت *wandelen* بین *vind* و *leuk* می‌آید.
  nl.a1.unit13.lesson02.teach.dislike:
    title: دوست نداشتن خرید کردن
    gloss: من خرید کردن را دوست ندارم.
    note: '*Niet* پیش از *leuk* می‌آید.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: پرسیدن دربارهٔ فعالیت‌ها
    gloss: چه کاری را دوست داری؟
    note: '*Wat vind je leuk om te doen?* یک سوال عمومی و طبیعی دربارهٔ کارهای دلخواه کسی است.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: علاقهٔ قوی‌تر یا عمومی
    gloss: Houden van علاقهٔ قوی یا عمومی را بیان می‌کند.
    note: آن را کم به کار ببر. برای واکنش‌های معمولی به یک خوراکی یا فعالیت مشخص، *lekker vinden* یا *leuk vinden* طبیعی‌تر است.
  nl.a1.unit13.lesson03.teach.music:
    title: علاقه داشتن به موسیقی
    gloss: من عاشق موسیقی هستم / به موسیقی خیلی علاقه دارم.
    note: '*Houd* شکل *ik* فعل *houden* است؛ *van* بعد از آن می‌آید.'
  nl.a1.unit13.lesson03.teach.films:
    title: دوست نداشتن فلم‌ها
    gloss: من فلم‌ها را دوست ندارم.
    note: در شکل منفی، *niet* بین *houd* و *van* قرار می‌گیرد.
  nl.a1.unit13.lesson03.teach.contrast:
    title: انتخاب عبارت طبیعی
    gloss: 'برای یک مزهٔ معمولی این را هم بگو: من قهوه را دوست دارم. برای یک فعالیت: من قدم زدن را دوست دارم.'
    note: هر «دوست داشتن» دری را ماشینی با *houden van* ترجمه نکن.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: دو گزینه پیشنهاد کردن
    gloss: قهوه می‌خواهی یا چای؟
    note: '*Wil je ... of ...?* از طرف مقابل می‌خواهد که انتخاب کند.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: گفتن اینکه کدام را ترجیح می‌دهی
    gloss: من چای را ترجیح می‌دهم.
    note: در این الگوی عادیِ انتخاب، *liever* بعد از *wil* می‌آید.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: ترجیح دادن یک چیز
    gloss: من switer آبی را ترجیح می‌دهم.
    note: وقتی یک چیز را بر چیز دیگر انتخاب می‌کنین، *Ik heb liever ...* هم طبیعی است.
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever گزینهٔ مورد نظر را نشان می‌دهد
    gloss: Liever نشان می‌دهد که شما یک گزینه را بر گزینهٔ دیگر انتخاب می‌کنین.
    note: وقتی هر دو گزینه از گفتگو معلوم باشد، مقایسه می‌تواند نگفته بماند.
  nl.a1.unit13.lesson05.teach.message:
    title: خواندن چند ترجیح
    gloss: سلام لوته، فلم برایم خوش می‌آید، ولی عمر فلم را دوست ندارد. او بیشتر می‌خواهد به پارک برود. قدم زدن هم برایم خوش می‌آید.
    note: دقت کنید که فلم را کی دوست دارد، کی فلم را دوست ندارد و عمر کدام گزینهٔ دیگر را انتخاب می‌کند.
    glosses:
      Hoi: سلام
      vind: خوش آمدن / دانستن
      film: فلم
      leuk: خوب / خوش‌آیند
      maar: اما
      houdt: دوست دارد
      films: فلم‌ها
      wil: می‌خواهد
      liever: بیشتر / ترجیح می‌دهد
      park: پارک
      wandelen: قدم زدن
  nl.a1.unit13.lesson06.teach.food_question:
    title: لوته دو نوع غذا پیشنهاد می‌کند
    gloss: 'لوته: عمر، چی می‌خواهی بخوری؟ نان می‌خواهی یا شوروای تماټه؟'
    note: سوال دوم دو گزینه را پیش می‌گذارد.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: عمر شوروا را انتخاب می‌کند
    gloss: 'عمر: من شوروای تماټه را ترجیح می‌دهم. شوروای تماټه برایم مزه می‌کند. و تو؟'
    note: عمر اول با *liever* انتخاب می‌کند، بعد با *lekker* آن را به‌عنوان ذائقه توضیح می‌دهد.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: لوته نان را انتخاب می‌کند
    gloss: 'لوته: من نان را ترجیح می‌دهم. شوروای تماټه را زیاد دوست ندارم.'
    note: '*Niet zo lekker* نفی را نرم‌تر می‌کند و در گپ‌وگفت دوستانه طبیعی است.'
  nl.a1.unit13.lesson06.teach.activity:
    title: انتخاب کار بعدی
    gloss: 'عمر: بعد از غذا می‌خواهی چه کار کنی؟ لوته: قدم زدن برایم خوش می‌آید.'
    note: '*Leuk* فعالیت *wandelen* را توصیف می‌کند.'
  nl.a1.unit13.lesson06.teach.plan:
    title: آن‌ها علاقهٔ مشترک دارند
    gloss: 'عمر: من هم. من قدم زدن را خیلی دوست دارم. برویم پارک؟ لوته: فکر خوبی است.'
    note: این به زبانِ غیررسمیِ برنامه‌ریزی در درس ۱۱ دوباره وصل می‌شود.
