teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: بیدار شدن
    gloss: بیدار شدن ← بیدار می‌شوم
    note: '*Opstaan* در جملهٔ اصلی جدا می‌شود: *Ik sta op*. پیشوند *op* به آخر جمله می‌رود.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: لباس پوشیدن
    gloss: لباس پوشیدن ← لباس می‌پوشم
    note: '*Zich aankleden* انعکاسی و جداشدنی است. با *ik* از *me* استفاده کنید و *aan* را به آخر ببرید: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: ناشتا کردن
    gloss: ناشتا کردن ← ناشتا می‌کنم
    note: '*Ontbijten* جدا نمی‌شود: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: کار
    gloss: کار کردن ← کار می‌کنم
    note: '*Werken* جدا نمی‌شود: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: خوردن
    gloss: خوردن ← می‌خورم
    note: 'شکل *ik* برای *eten* می‌شود *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: ظرف شستن
    gloss: ظرف شستن ← ظرف می‌شویم
    note: '*Afwassen* جدا می‌شود: *Ik was af*. پیشوند *af* به آخر جمله می‌رود.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: خوابیدن
    gloss: خوابیدن ← می‌خوابم
    note: '*Slapen* جدا نمی‌شود. شکل *ik* آن مصوت بلند دارد: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: الگوی جدا شدن
    gloss: 'در یک جملهٔ اصلی معمولی، بخش اول به آخر جمله می‌رود: opstaan → Ik sta op.'
    note: نگویید *Ik opsta*. فعل اصلی را صرف کنید و پیشوند کوتاه را در آخر جملهٔ اصلی بگذارین.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan در جمله
    gloss: 'بیدار شدن: من ساعت هفت بیدار می‌شوم.'
    note: قید وقت میان *sta* و پیشوند پایانی *op* می‌آید.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden در جمله
    gloss: 'لباس پوشیدن: من لباس می‌پوشم.'
    note: 'الگو این است: *Ik* + *kleed* + *me* + *aan*. *Aan* در آخر می‌ماند.'
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen در جمله
    gloss: 'ظرف شستن: من بعد از غذا ظرف می‌شویم.'
    note: '*Na het eten* میان *was* و پیشوند پایانی *af* می‌آید.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: فعل‌هایی که جدا نمی‌شوند
    gloss: 'جداشدنی نیست: ناشتا می‌کنم. کار می‌کنم. می‌خوابم. هیچ بخشی به آخر جمله نمی‌رود.'
    note: '*Ontbijten*، *werken* و *slapen* در این جمله‌های اصلی به شکل یک فعل واحد می‌مانند.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: بیدار شدن ساعت هفت و نیم
    gloss: من ساعت هفت و نیم بیدار می‌شوم.
    note: در هلندی *half acht* یعنی نیم ساعت مانده به هشت، یعنی 7:30؛ در دری می‌گوییم «هفت و نیم». *Op* در آخر می‌ماند.
  nl.a1.unit10.lesson03.teach.dress_time:
    title: لباس پوشیدن ساعت هشت کم ربع
    gloss: من ساعت هشت کم ربع لباس می‌پوشم.
    note: وقت پیش از پیشوند جداشدنیِ پایانی *aan* می‌آید.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: ناشتا کردن ساعت هشت
    gloss: من ساعت هشت ناشتا می‌کنم.
    note: پیش از وقت از *om* استفاده کنید. *Ontbijt* جدا نمی‌شود.
  nl.a1.unit10.lesson03.teach.work_time:
    title: کار از نُه تا پنج
    gloss: من از ساعت نُه تا ساعت پنج کار می‌کنم.
    note: '*Van ... tot ...* وقت شروع و پایان را می‌رساند.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: غذا خوردن ساعت شش و نیم
    gloss: من ساعت شش و نیم بعد از چاشت غذا می‌خورم.
    note: '*''s Avonds* شب بودن را روشن می‌کند، پس *half zeven* اینجا 18:30 است.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: خوابیدن ساعت یازده
    gloss: من ساعت یازده می‌خوابم.
    note: 'پیش از وقت از *om* استفاده کنید: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: اول، بعد، بعد از آن
    gloss: اول، بعد، بعد از آن
    note: '*Eerst* فعالیت اول را نشان می‌دهد، *dan* به فعالیت بعدی می‌رود و *daarna* به چیزی که پیش‌تر آمده وصل می‌شود.'
    example_gloss:
    - اول بیدار می‌شوم.
    - بعد لباس می‌پوشم.
    - بعد از آن ناشتا می‌کنم.
  nl.a1.unit10.lesson04.teach.sequence:
    title: یک صبح در سه مرحله
    gloss: اول بیدار می‌شوم. بعد لباس می‌پوشم. بعد از آن ناشتا می‌کنم.
    note: 'پیشوندهای جداشدنی باز هم در آخر جمله می‌آیند: *sta ik op*؛ *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: فعل پیش از ik
    gloss: 'بعد از eerst، dan و daarna فعل پیش از ik می‌آید: Daarna ontbijt ik.'
    note: وقتی جمله با کلمهٔ ترتیب شروع شود، *Ik ontbijt* به *Daarna ontbijt ik* تبدیل می‌شود.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: روز من
    gloss: روز من — ساعت هفت و نیم بیدار می‌شوم. بعد از آن لباس می‌پوشم و ساعت هشت ناشتا می‌کنم. از ساعت نُه تا پنج کار می‌کنم. ساعت شش و نیم بعد از چاشت غذا می‌خورم. بعد از آن ظرف می‌شویم. ساعت یازده می‌خوابم.
    note: هم به ترتیب فعالیت‌ها و هم به وقت‌های آن‌ها توجه کنید. به *op*، *aan* و *af* در آخر جمله‌های دارای فعل جداشدنی دقت کنید.
    glosses:
      Mijn: من / ام
      dag: روز
      sta: بلند شدن (از خواب)
      half: نیم ساعت مانده به ساعت بعدی (7:30)
      acht: هشت
      Daarna: بعد از آن
      kleed: لباس پوشیدن
      uur: ساعت
      ontbijt: ناشتا کردن
      werk: کار کردن
      negen: نُه
      vijf: پنج
      zeven: هفت
      avonds: در وقت شام
      eet: نان خوردن
      was: ظرف شستن
      elf: یازده
      slaap: خواب کردن
  nl.a1.unit10.lesson06.teach.question:
    title: پرسیدن در بارهٔ یک روز
    gloss: 'Lotte: روز تو چطور می‌گذرد، Omar؟'
    note: '*Hoe ziet jouw dag eruit?* یک راه غیررسمی است تا از کسی بخواهیم روزش را شرح بدهد. *Eruitzien* جداشدنی است: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: صبح Omar
    gloss: 'Omar: من ساعت هفت و نیم بلند می‌شوم. بعد لباس می‌پوشم و ساعت هشت ناشتا می‌کنم.'
    note: Omar سه فعالیت صبح را به هم وصل می‌کند و *op* و *aan* را در آخر جمله‌هایشان نگه می‌دارد.
  nl.a1.unit10.lesson06.teach.work:
    title: روز کاری Omar
    gloss: 'Lotte: چه وقت کار می‌کنی؟ Omar: از ساعت نُه تا ساعت پنج کار می‌کنم.'
    note: Lotte و Omar با هم از *je* غیررسمی استفاده می‌کنند.
  nl.a1.unit10.lesson06.teach.evening:
    title: شام Omar
    gloss: 'Omar: ساعت شش و نیم شب غذا می‌خورم. بعد ظرف‌ها را می‌شویم. ساعت یازده می‌خوابم.'
    note: 'وقتی جمله با وقت یا *daarna* شروع شود، فعل پیش از *ik* می‌آید: *eet ik*، *was ik*، *slaap ik*. *Af* در آخر می‌ماند.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: صبح Lotte
    gloss: 'Lotte: من ساعت شش بلند می‌شوم، اما تا شش و نیم ناشتا نمی‌کنم.'
    note: '*Pas* اینجا یعنی «تا ... نه». Lotte وقت بلند شدنش را با وقت ناشتایش مقایسه می‌کند.'
