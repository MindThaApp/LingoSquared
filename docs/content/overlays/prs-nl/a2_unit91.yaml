course:
  title: هالندی A2
  description: هلندی A2 بر پایهٔ گرامر برای صحبت دربارهٔ شروع کردن، ترک کردن و تلاش برای تغییر عادت‌ها.
  learning_goal: با te + مصدر، stoppen met و staan/zitten/liggen te بگویین چه کاری را شروع کردید، ترک کردید، سعی کردید یا فراموش کردید.
units:
  nl.a2.unit91.beginnen_stoppen_proberen:
    title: شروع کردن، ترک کردن، تلاش کردن
    description: بگویین چه کاری را شروع کردید، ترک کردید، سعی کردید یا فراموش کردید، و کسی مصروف چه کاری است.
lessons:
  nl.a2.unit91.lesson01.ik_begin_te_sporten:
    title: من شروع می‌کنم ورزش کنم
  nl.a2.unit91.lesson02.stoppen_met:
    title: ترک کردن
  nl.a2.unit91.lesson03.proberen_en_vergeten:
    title: سعی کردن و فراموش کردن
  nl.a2.unit91.lesson04.hij_zit_te_lezen:
    title: او نشسته و کتاب می‌خواند
  nl.a2.unit91.lesson05.noors_plan:
    title: پلان نور
  nl.a2.unit91.lesson06.lotte_en_omar_sporten:
    title: لوته و عمر ورزش می‌کنند
teaching:
  nl.a2.unit91.lesson01.teach.gewoontes:
    title: عادت‌ها
    gloss: ورزش کردن / خوابیدن / خوردن / صحتمند / زودتر
    note: این کلمات عادت‌هایی را نام می‌برند که در این بخش دربارهٔ آن‌ها صحبت می‌کنین.
    example_gloss:
    - می‌خواهم ورزش کنم.
    - می‌خواهم صحتمندانه غذا بخورم.
    - می‌خواهم زودتر بخوابم.
  nl.a2.unit91.lesson01.teach.sportschool:
    title: در سالون ورزش
    gloss: سالون ورزش / هر روز / اغلب
    note: '*Vaak* یعنی اغلب؛ *elke dag* یعنی هر روز.'
    example_gloss:
    - من هر روز به سالون ورزش می‌روم.
    - نور اغلب به سالون ورزش می‌رود.
    - من اغلب ورزش می‌کنم.
  nl.a2.unit91.lesson01.teach.gn_beginnen_te:
    title: beginnen + te + مصدر
    gloss: من شروع می‌کنم ورزش کنم. من شروع می‌کنم صحتمندانه غذا بخورم. نور شروع می‌کند زودتر بخوابد.
    note: بعد از *beginnen*، کلمهٔ *te* را درست پیش از مصدر بگذارین. مصدر (*sporten, eten, slapen*) در آخر می‌آید. می‌گوییم *ik begin* ولی *Noor begint*.
  nl.a2.unit91.lesson01.teach.gn_te_achteraan:
    title: کلمات دیگر پیش از te می‌آیند
    gloss: من شروع می‌کنم هر روز به سالون ورزش بروم. او اغلب شروع می‌کند ورزش کند.
    note: کلمات دیگر (*elke dag, naar de sportschool, vaak*) بین *beginnen* و *te* قرار می‌گیرند. جفت *te* + مصدر در آخر کنار هم می‌ماند.
  nl.a2.unit91.lesson01.teach.zin:
    title: دو کار
    gloss: من شروع می‌کنم ورزش کنم و صحتمندانه غذا بخورم.
    note: وقتی دو کار باشد، در هلندی معمولاً پیش از هر مصدر دوباره *te* می‌آید.
  nl.a2.unit91.lesson02.teach.schermtijd:
    title: عادت‌هایی که ترک می‌شوند
    gloss: سگرت کشیدن / شیرینی خوردن / بازی ویدیویی کردن / تیلفون / وقت صفحه
    note: '*Snoepen* یعنی خوردن شیرینی یا تنقلات.'
    example_gloss:
    - سگرت کشیدن صحتمند نیست.
    - من هر روز شیرینی می‌خورم.
    - من اغلب روی تیلفونم بازی می‌کنم.
    - وقت صفحهٔ من زیاد است.
  nl.a2.unit91.lesson02.teach.minder:
    title: دیگر نه، کمتر
    gloss: ترک کردن / شروع کردن / دیگر نه / کمتر
    note: '*Niet meer* یعنی دیگر نه.'
    example_gloss:
    - من دیگر سگرت نمی‌کشم.
    - من کمتر گیم می‌کنم.
    - من شیرینی کمتر می‌خورم.
  nl.a2.unit91.lesson02.teach.gn_stoppen_met:
    title: ترک کردن با met
    gloss: من سگرت کشیدن را ترک می‌کنم. نور گیم کردن را ترک می‌کند. او شیرینی خوردن را ترک می‌کند.
    note: 'بعد از *stoppen* کلمهٔ *met* با یک اسم یا مصدر می‌آید. اینجا *te* نمی‌آید: *stoppen te roken* غلط است. می‌گوییم *ik stop* ولی *Noor stopt*.'
  nl.a2.unit91.lesson02.teach.gn_beginnen_met:
    title: شروع کردن با met
    gloss: من ورزش کردن را شروع می‌کنم. نور شروع می‌کند غذای صحی بخورد.
    note: '*Beginnen* را هم می‌شود با *met* و مصدر یا اسم، بدون *te* به کار برد. *Ik begin te sporten* و *Ik begin met sporten* یک معنی دارند.'
  nl.a2.unit91.lesson02.teach.zin:
    title: کمتر و دیگر نه
    gloss: من شیرینی کمتر می‌خورم و دیگر گیم نمی‌کنم.
    note: '*Minder* و *niet meer* نشان می‌دهند که یک عادت را تا چه اندازه تغییر داده‌اید.'
  nl.a2.unit91.lesson03.teach.proberen:
    title: سعی کردن و فراموش کردن
    gloss: کوشش کردن / فراموش کردن / تیلفون کردن / خواندن
    note: '*Bellen* یعنی به کسی تیلفون کردن.'
    example_gloss:
    - من کوشش می‌کنم.
    - من اکثراً آن را فراموش می‌کنم.
    - من به لوته تیلفون می‌کنم.
    - نور هر روز می‌خواند.
  nl.a2.unit91.lesson03.teach.gn_proberen_te:
    title: Proberen + te
    gloss: من کوشش می‌کنم زودتر بخوابم. من کوشش می‌کنم کمتر گیم کنم. نور کوشش می‌کند ورزش کند.
    note: بعد از *proberen*، *te* + مصدر می‌آید و مصدر در آخر جمله می‌ماند. می‌گوییم *ik probeer* ولی *Noor probeert*.
  nl.a2.unit91.lesson03.teach.gn_vergeten_te:
    title: Vergeten + te
    gloss: من اکثراً فراموش می‌کنم تیلفون کنم. من فراموش کردم تیلفون کنم. من فراموش کردم به لوته تیلفون کنم.
    note: '*Vergeten* هم با *te* + مصدر می‌آید. مفعول کوتاه (*Lotte*) پیش از *te* می‌آید: *Lotte te bellen*.'
  nl.a2.unit91.lesson03.teach.gn_om_te:
    title: om ... te اختیاری
    gloss: من کوشش می‌کنم زودتر بخوابم. من فراموش کردم تیلفون کنم.
    note: 'بعد از *proberen* و *vergeten* می‌توانین *om* هم بیاورید: *om ... te*. معنی یکی است. در این بخش بیشتر شکل کوتاه، بدون *om*، به کار رفته است.'
  nl.a2.unit91.lesson03.teach.gn_perfectum:
    title: زمان ماضی نقلی (perfectum)
    gloss: من شروع کردم ورزش کنم. من سگرت کشیدن را ترک کردم. من کوشش کردم زودتر بخوابم. من فراموش کردم تیلفون کنم.
    note: در زمان ماضی نقلی (perfectum)، *beginnen, stoppen* و *vergeten* با *zijn* می‌آیند، ولی *proberen* با *hebben* می‌آید. با *ik* از *ben* و *heb* استفاده می‌کنیم. *te* + مصدر (یا *met* + فعالیت) در آخر جمله می‌آید.
  nl.a2.unit91.lesson03.teach.gn_modaal:
    title: با te یا بدون te
    gloss: من می‌خواهم ورزش کنم. من کوشش می‌کنم ورزش کنم. من باید بخوابم. من کوشش می‌کنم بخوابم.
    note: بعد از *willen* و *moeten* مصدر بدون *te* می‌آید. بعد از *beginnen, proberen* و *vergeten* باید *te* بیاید.
  nl.a2.unit91.lesson04.teach.posities:
    title: ایستاده، نشسته، خوابیده
    gloss: ایستاده بودن / نشسته بودن / خوابیده بودن / چوکی دراز (صوفه) / بستر / دروازه
    note: در هلندی اکثراً می‌گویند که کسی ایستاده، نشسته یا خوابیده است.
    example_gloss:
    - او روی چوکی دراز نشسته است.
    - او در بستر خوابیده است.
    - او کنار دروازه ایستاده است.
  nl.a2.unit91.lesson04.teach.tv:
    title: پرده و کتاب
    gloss: تماشا کردن / تلویزیون / کتاب
    note: '*Kijken naar* یعنی نگاه کردن یا تماشا کردن.'
    example_gloss:
    - او تلویزیون تماشا می‌کند.
    - او کتاب می‌خواند.
  nl.a2.unit91.lesson04.teach.uren:
    title: از چند ساعت به این طرف
    gloss: از قبل / ساعت‌ها
    note: '*Al uren* یعنی از چند ساعت به این طرف.'
    example_gloss:
    - او از چند ساعت به این طرف روی چوکی دراز نشسته است.
    - من از چند ساعت به این طرف گیم می‌کنم.
  nl.a2.unit91.lesson04.teach.gn_staan_te:
    title: Staan، zitten، liggen + te
    gloss: او (نشسته) کتاب می‌خواند. او (خوابیده) خواب است. او (ایستاده) تیلفون می‌کند. او (نشسته) گیم می‌کند.
    note: '*Staan, zitten* یا *liggen* + *te* + مصدر نشان می‌دهد که کسی همین حالا چه کار می‌کند. فعل اول حالت بدن را نشان می‌دهد: *zit, ligt, staat*.'
  nl.a2.unit91.lesson04.teach.gn_plaats:
    title: جای عمل پیش از te
    gloss: او روی چوکی دراز کتاب می‌خواند. او در بستر خواب است. او کنار دروازه تیلفون می‌کند.
    note: 'معمولاً جای عمل پیش از *te* + مصدر می‌آید. در گپ زدن بعد از آن هم می‌شنوید: *Hij zit te lezen op de bank*.'
  nl.a2.unit91.lesson04.teach.zin:
    title: او چه کار می‌کند؟
    gloss: او چه کار می‌کند؟ او از چند ساعت به این طرف نشسته گیم می‌کند.
    note: '*Al uren* پیش از *te gamen* می‌آید و نشان می‌دهد که این کار چه مدت است ادامه دارد.'
  nl.a2.unit91.lesson05.teach.reading:
    title: پلان نور
    gloss: سلام لوته، من یک پلان دارم. هر شب ساعت‌ها نشسته گیم می‌کنم و این صحی نیست. حالا گیم کردن را ترک می‌کنم. کوشش می‌کنم زودتر بخوابم. روز دوشنبه ورزش را شروع می‌کنم. دیروز فراموش کردم به تو تیلفون کنم، ببخش! فردا به تو تیلفون می‌کنم.
    note: پیدا کنید که نور چه چیز را ترک می‌کند، به چه کوشش می‌کند، چه چیز را شروع می‌کند و چه چیز را فراموش می‌کند.
    glosses:
      plan: پلان
      avond: شب
      uren: ساعات کاری
      dat: که
      Nu: حالا
      Maandag: دوشنبه
      Gisteren: دیروز
      je: تو
      sorry: ببخش
      Morgen: فردا
      heb: داشتن
  nl.a2.unit91.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، آیا ورزش را شروع کرده‌ای؟'
  nl.a2.unit91.lesson06.teach.omar_gym:
    title: Omar جواب می‌دهد
    gloss: 'عمر: بلی، شروع کرده‌ام! کوشش می‌کنم هفته‌ای سه بار به جیم بروم.'
  nl.a2.unit91.lesson06.teach.lotte_snoepen:
    title: لوته دربارهٔ شیرینی خوردن می‌پرسد
    gloss: 'لوته: آفرین! و آیا شیرینی خوردن را ترک کرده‌ای؟'
  nl.a2.unit91.lesson06.teach.omar_nee:
    title: عمر اعتراف می‌کند
    gloss: 'عمر: نه، هنوز نمی‌شود. هر شب روی چوکی دراز نشسته شیرینی می‌خورم.'
  nl.a2.unit91.lesson06.teach.lotte_vergeten:
    title: لوته خودش را می‌گوید
    gloss: 'لوته: افسوس! من هم امروز فراموش کردم ورزش کنم.'
  nl.a2.unit91.lesson06.teach.omar_samen:
    title: عمر پیشنهاد می‌کند
    gloss: 'عمر: پس فردا با هم کوشش می‌کنیم!'
exercises:
  nl.a2.unit91.lesson01.exercise01.choose_begin:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ik begin te sporten.
    distractors:
    - Ik begin sporten.
    - Ik begin te sport.
    - Ik begin sporten te.
    accepted_answers:
    - value: Ik begin te sporten.
      status: correct
    feedback: 'بعد از *beginnen* باید *te* + مصدر بیاید: *Ik begin te sporten.*'
    prompt_blocks:
    - من شروع می‌کنم ورزش کنم.
  nl.a2.unit91.lesson01.exercise02.choose_ze_begint:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ze begint gezond te eten.
    distractors:
    - Ze begin gezond te eten.
    - Ze begint te gezond eten.
    - Ze begint gezond eten te.
    accepted_answers:
    - value: Ze begint gezond te eten.
      status: correct
    feedback: 'با *ze/hij/Noor* فعل به -t ختم می‌شود: *begint*. *Te* درست پیش از مصدر *eten* می‌آید.'
    prompt_blocks:
    - او شروع می‌کند صحتمندانه غذا بخورد.
  nl.a2.unit91.lesson01.exercise03.match_gewoontes:
    instruction: هر کلمهٔ هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: sporten
        right: ورزش کردن
      - left: slapen
        right: خوابیدن
      - left: eten
        right: غذا خوردن
      - left: gezond
        right: صحتمند
      - left: vroeger
        right: زودتر
      - left: de sportschool
        right: آن باشگاه ورزشی
      status: correct
    feedback: اینها کلمات عادت‌ها در این بخش استند.
    pairs:
    - left: sporten
      right: ورزش کردن
    - left: slapen
      right: خوابیدن
    - left: eten
      right: غذا خوردن
    - left: gezond
      right: صحتمند
    - left: vroeger
      right: زودتر
    - left: de sportschool
      right: آن باشگاه ورزشی
  nl.a2.unit91.lesson01.exercise04.order_noor:
    instruction: 'کلمات را طوری ترتیب کنید که بگویین: «نور شروع می‌کند زودتر بخوابد.»'
    correct_option: Noor begint vroeger te slapen
    accepted_answers:
    - value: Noor begint vroeger te slapen
      status: correct
    feedback: '*Noor begint vroeger te slapen*: *te* + مصدر در آخر جمله می‌آید.'
  nl.a2.unit91.lesson01.exercise05.complete_te:
    instruction: جمله را با یک کلمه کامل کنید.
    correct_option: te
    accepted_answers:
    - value: te
      status: correct
    feedback: '*Ik begin elke dag naar de sportschool te gaan.* کلمهٔ *te* پیش از مصدر *gaan* می‌آید.'
  nl.a2.unit91.lesson01.exercise06.translate_eat:
    instruction: به هلندی ترجمه کنید. از beginnen + te استفاده کنید.
    accepted_answers:
    - value: Ik begin gezond te eten
      status: correct
    - value: Ik begin gezond te eten.
      status: correct
    feedback: '*Ik begin gezond te eten* = من شروع می‌کنم غذای صحی بخورم.'
    prompt_blocks:
    - من شروع می‌کنم صحتمندانه غذا بخورم. از beginnen + te استفاده کنید.
  nl.a2.unit91.lesson01.exercise07.write_sleep:
    instruction: جملهٔ خواسته‌شده را به هالندی بنویسین.
    correct_option: Ik begin vroeger te slapen.
    accepted_answers:
    - value: Ik begin vroeger te slapen
      status: correct
    - value: Ik begin vroeger te slapen.
      status: correct
    feedback: '*Ik begin vroeger te slapen* = من شروع می‌کنم زودتر بخوابم.'
    prompt_blocks:
    - 'با استفاده از beginnen + te به هلندی بنویسین: من شروع می‌کنم زودتر بخوابم.'
  nl.a2.unit91.lesson02.exercise01.choose_stop:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ik stop met roken.
    distractors:
    - Ik stop te roken.
    - Ik stop roken.
    - Ik stop met te roken.
    accepted_answers:
    - value: Ik stop met roken.
      status: correct
    feedback: '*Stoppen* با *met* می‌آید و *te* ندارد.'
    prompt_blocks:
    - من سگرت کشیدن را ترک می‌کنم.
  nl.a2.unit91.lesson02.exercise02.choose_ze_stopt:
    instruction: جملهٔ درست هالندی را انتخاب کنید.
    correct_option: Ze stopt met snoepen.
    distractors:
    - Ze stopt te snoepen.
    - Ze stop met snoepen.
    - Ze stopt snoepen met.
    accepted_answers:
    - value: Ze stopt met snoepen.
      status: correct
    feedback: '*Ze stopt met snoepen*: با *ze* فعل به -t ختم می‌شود و *met* پیش از فعالیت می‌آید.'
    prompt_blocks:
    - او خوردن شیرینی را ترک می‌کند.
  nl.a2.unit91.lesson02.exercise03.match_stoppen:
    instruction: هر عبارت هالندی را با معنی دری آن جفت کنید.
    accepted_answers:
    - value:
      - left: stoppen met roken
        right: ترک کردن سگرت کشیدن
      - left: stoppen met snoepen
        right: ترک کردن شیرینی خوردن
      - left: stoppen met gamen
        right: ترک کردن بازی ویدیویی
      - left: beginnen met sporten
        right: شروع کردن به ورزش
      - left: niet meer
        right: دیگر نه
      - left: minder
