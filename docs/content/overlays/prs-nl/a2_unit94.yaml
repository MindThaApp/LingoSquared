course:
  title: هالندی A2
  description: هالندی سطح A2 با تمرکز بر گرامر، برای گفتن اینکه کاری را برای چی می‌کنین.
  learning_goal: با om ... te بگویین که کاری را برای چی می‌کنین، همراه با فعل‌های جدا‌شدنی، و zodat را بشناسید.
units:
  nl.a2.unit94.om_te_en_zodat:
    title: برای اینکه
    description: 'بگویین کاری را برای چی می‌کنین: کارهای روزمره، یاد گرفتن و پس‌انداز پول.'
lessons:
  nl.a2.unit94.lesson01.sparen_om_te:
    title: پس‌انداز برای خریدن
  nl.a2.unit94.lesson02.scheidbare_werkwoorden:
    title: 'جمع کردن: فعل‌های جدا‌شدنی'
  nl.a2.unit94.lesson03.omdat_en_zodat:
    title: Omdat یا zodat
  nl.a2.unit94.lesson04.een_lijstje:
    title: فهرست کارهای امروز
  nl.a2.unit94.lesson05.noors_dag:
    title: روز پر کار نور
  nl.a2.unit94.lesson06.lotte_en_omar:
    title: لوته و عمر کارهای روزمره را انجام می‌دهند
teaching:
  nl.a2.unit94.lesson01.teach.sparen:
    title: پس‌انداز و خریدن
    gloss: پس‌انداز کردن / پول / خریدن / بایسکل
    note: این‌ها اولین کلمه‌هایی اند که برای صحبت درباره‌ی هدف ضرورت دارید.
    example_gloss:
    - من پول پس‌انداز می‌کنم.
    - من یک بایسکل می‌خرم.
  nl.a2.unit94.lesson01.teach.boodschappen:
    title: کارهای روزمره
    gloss: بانک / دفتر پوسته / سوپرمارکت / نان / نامه / بسته
    note: جاها و چیزهایی که برای کارهای روزمره ضرور اند.
    example_gloss:
    - من به بانک می‌روم.
    - من به دفتر پوسته می‌روم.
    - من در سوپرمارکت نان می‌خرم.
  nl.a2.unit94.lesson01.teach.leren:
    title: یاد گرفتن
    gloss: یاد گرفتن / هالندی / صحبت کردن / کورس خواندن
    note: '*Een cursus volgen* یعنی در یک کورس درس خواندن.'
    example_gloss:
    - من هالندی یاد می‌گیرم.
    - من در یک کورس درس می‌خوانم.
    - من با لوته صحبت می‌کنم.
  nl.a2.unit94.lesson01.teach.gn_om_te:
    title: 'Om ... te: کاری را برای چی می‌کنین'
    gloss: من پس‌انداز می‌کنم تا بایسکل بخرم.
    note: 'برای گفتن مقصد یک کار، *om ... te* را با مصدر به کار ببرید. در این بخش مصدر (*kopen*) در آخر عبارت می‌آید و *te* درست پیش از آن قرار می‌گیرد: *om een fiets te kopen*. فاعل همان فاعل بخش اول است (اینجا: *ik*).'
  nl.a2.unit94.lesson01.teach.zinnen:
    title: سه مقصد
    gloss: من به سوپرمارکت می‌روم تا نان بخرم. من به دفتر پوسته می‌روم تا یک نامه بفرستم. من هالندی یاد می‌گیرم تا با لوته صحبت کنم.
    note: '*Sturen* یعنی فرستادن.'
  nl.a2.unit94.lesson02.teach.scheidbaar:
    title: فعل‌هایی با جزء جدا‌شدنی
    gloss: بیرون کشیدن پول / گرفتن یک بسته / قرار گذاشتن / جمع کردن / زنگ زدن
    note: 'در جمله‌ی اصلی، کلمه‌ی کوچک (*op*، *af*) به آخر جمله می‌رود: *Ik neem geld op.* (*Bellen* کلمه‌ی کوچک ندارد.)'
    example_gloss:
    - من پول بیرون می‌کشم.
    - من یک بسته می‌گیرم.
    - من با لوته قرار می‌گذارم.
    - من جمع می‌کنم.
    - من به لوته زنگ می‌زنم.
  nl.a2.unit94.lesson02.teach.gn_scheidbaar:
    title: Te میان جزء و فعل می‌آید
    gloss: بیرون کشیدن؛ گرفتن؛ قرار گذاشتن؛ جمع کردن
    note: 'در فعل جدا‌شدنی، *te* میان جزء و فعل قرار می‌گیرد: *op te nemen*، *af te spreken*. فعل‌های بدون جزء، *te* را فقط پیش از خود می‌گیرند: *te kopen*، *te sturen*.'
  nl.a2.unit94.lesson02.teach.zinnen:
    title: چهار کار روزمره
    gloss: من به بانک می‌روم تا پول بیرون بکشم. من به دفتر پوسته می‌روم تا یک بسته بگیرم. من به لوته زنگ می‌زنم تا قرار بگذاریم. من به خانه می‌روم تا جمع کنم.
  nl.a2.unit94.lesson03.teach.vragen:
    title: چرا و برای چی
    gloss: چرا / برای چی / چون / تا / ضرور
    note: '*Waarom* دلیل را می‌پرسد؛ *waarvoor* مقصد را می‌پرسد.'
    example_gloss:
    - چرا پس‌انداز می‌کنی؟
    - برای چی پس‌انداز می‌کنی؟
    - من به پول ضرورت دارم.
  nl.a2.unit94.lesson03.teach.gn_omdat:
    title: Omdat دلیل می‌دهد
    gloss: چرا پس‌انداز می‌کنی؟ چون به یک بایسکل ضرورت دارم.
    note: '*Omdat* دلیل را می‌گوید، نه مقصد را. فعل صرف‌شده به آخر جمله‌ی *omdat* می‌رود: *omdat ik een fiets nodig heb*. این جمله فاعل و فعل خودش را دارد.'
  nl.a2.unit94.lesson03.teach.gn_doel:
    title: Om ... te مقصد را می‌گوید
    gloss: برای چی پس‌انداز می‌کنی؟ تا یک بایسکل بخرم.
    note: '*Om ... te* به *waarvoor?* جواب می‌دهد و هدف را می‌گوید. فاعل خودش را ندارد: کسی که کار را می‌کند همان کسی است که در بخش اصلی جمله است.'
  nl.a2.unit94.lesson03.teach.gn_zodat:
    title: 'Zodat: شخص دیگر'
    gloss: من به عمر کمک می‌کنم تا او به وقت آماده شود. من آن را یادداشت می‌کنم تا تو فراموش نکنی.
    note: '*Zodat* هم مقصد را می‌گوید، معمولاً با فاعل تازه (*hij*، *jij*)، و فعل صرف‌شده به آخر جمله‌اش می‌رود. فعلاً فقط آن را بشناسید؛ وقتی خودتان کار را می‌کنین بیشتر *om ... te* را به کار می‌برید.'
  nl.a2.unit94.lesson04.teach.lijstje:
    title: فهرست من
    gloss: فهرست / امروز / اول / بعد از آن / نانوا / دکان بایسکل‌فروشی
    note: '*Eerst* و *daarna* کارهای شما را به ترتیب می‌آورند.'
    example_gloss:
    - فهرست من برای امروز.
    - من از نانوایی نان می‌خرم.
    - من در دکان بایسکل‌فروشی یک بایسکل نو می‌خرم.
  nl.a2.unit94.lesson04.teach.gn_voorop:
    title: اول عبارت om
    gloss: برای بیرون کشیدن پول به بانک می‌روم. برای خریدن نان پیش نانوا می‌روم.
    note: 'می‌توانین جمله را با عبارت *om ... te* شروع کنید. بعد فعل درست پس از آن و پیش از فاعل می‌آید: *Om brood te kopen ga ik ...*، نه *Om brood te kopen ik ga ...*.'
  nl.a2.unit94.lesson04.teach.zinnen:
    title: کارهای روزمره به ترتیب
    gloss: اول به بانک می‌روم تا پول بیرون بکشم. بعد از آن پیش نانوا می‌روم تا نان بخرم.
    note: 'بعد از *eerst* یا *daarna* در آغاز جمله، فعل در جای دوم می‌ماند: *ga ik*.'
  nl.a2.unit94.lesson05.teach.reading:
    title: فهرست نور
    gloss: نور کارهای زیاد دارد. اول به بانک می‌رود تا پول بیرون بکشد. بعد از آن به دفتر پوسته می‌رود تا یک بسته بفرستد. او هر ماه پول پس‌انداز می‌کند تا یک بایسکل نو بخرد. لوته به او کمک می‌کند تا به وقت آماده شود.
  nl.a2.unit94.lesson06.teach.beurt1:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، به دفتر پوسته می‌روی؟'
  nl.a2.unit94.lesson06.teach.beurt2:
    title: Omar توضیح می‌دهد
    gloss: 'عمر: بلی، به دفتر پوسته می‌روم تا یک بسته بگیرم.'
  nl.a2.unit94.lesson06.teach.beurt3:
    title: لوته کارش را می‌گوید
    gloss: 'لوته: من به بانک می‌روم تا پول بیرون بکشم.'
  nl.a2.unit94.lesson06.teach.beurt4:
    title: عمر می‌پرسد برای چی
    gloss: 'عمر: برای چی به پول ضرورت داری؟'
  nl.a2.unit94.lesson06.teach.beurt5:
    title: لوته هدفش را می‌گوید
    gloss: 'لوته: پس‌انداز می‌کنم تا یک بایسکل نو بخرم.'
  nl.a2.unit94.lesson06.teach.beurt6:
    title: عمر پیشنهاد می‌کند که صبر کند
    gloss: 'عمر: عالی! منتظرت می‌مانم تا با هم برویم.'
