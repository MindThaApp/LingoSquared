course:
  title: هالندی A2
  description: هلندی A2 با تمرکز بر گرامر برای صحبت دربارهٔ حادثه‌های گذشته.
  learning_goal: یک وضعیت پس‌زمینه و یک رویداد را با شکل‌های بی‌قاعدهٔ گذشتهٔ ساده، toen و terwijl به هم وصل کنید.
units:
  nl.a2.unit83.wat_gebeurde_er:
    title: چه اتفاق افتاد؟
    description: یک حادثهٔ کوچک، تغییر هوا یا مشکل ترافیک را در گذشتهٔ ساده توضیح بدهین.
lessons:
  nl.a2.unit83.lesson01.onregelmatige_vormen:
    title: چه اتفاق افتاد؟
  nl.a2.unit83.lesson02.vormen_combineren:
    title: ترکیب شکل‌ها
  nl.a2.unit83.lesson03.toen_en_terwijl:
    title: Toen و terwijl
  nl.a2.unit83.lesson04.een_klein_incident:
    title: یک حادثهٔ کوچک
  nl.a2.unit83.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit83.lesson06.lotte_en_omar:
    title: لوته و عمر در راه
teaching:
  nl.a2.unit83.lesson01.teach.incidenten:
    title: حادثه‌های کوچک
    gloss: تایر پنچر / رگبار / تأخیر
    note: این اسم‌ها مشکلاتی را که در این درس آمده نام می‌برند.
    example_gloss:
    - تایر بایسکلم پنچر است.
    - ناگهان یک رگبار آمد.
    - بس تأخیر داشت.
  nl.a2.unit83.lesson01.teach.verkeer:
    title: در راه
    gloss: بایسکل / بس / ایستگاه بس / در راه
    note: '*Onderweg* یعنی در جریان سفر بودن.'
    example_gloss:
    - بایسکلم در ایستگاه بس بود.
    - بس دیر رسید.
    - در راه باران شروع شد.
  nl.a2.unit83.lesson01.teach.weer:
    title: هوا و زمان
    gloss: باران باریدن / شدید / ناگهان / دیر
    note: '*Hard regenen* یعنی شدید باران باریدن.'
    example_gloss:
    - باران شدید شروع شد.
    - ناگهان بس رسید.
    - بس دیر رسید.
  nl.a2.unit83.lesson01.teach.gn_irregular_basis:
    title: شش فعل بی‌قاعده در گذشتهٔ ساده
    gloss: بودن ← بود/بودند؛ داشتن ← داشت/داشتند؛ رفتن ← رفت/رفتند؛ آمدن ← آمد/آمدند؛ دیدن ← دید/دیدند؛ گفتن ← گفت/گفتند
    note: 'این شکل‌های گذشتهٔ ساده را به صورت یک مجموعه یاد بگیرین. مفرد و جمع اغلب فرق دارند: *was/waren, ging/gingen, kwam/kwamen*.'
  nl.a2.unit83.lesson01.teach.gn_irregular_set:
    title: شش شکل بی‌قاعدهٔ دیگر
    gloss: گرفتن ← گرفت؛ دادن ← داد؛ ایستادن ← ایستاد؛ نشستن ← نشست؛ پیاده رفتن ← پیاده رفت؛ راندن ← راند
    note: 'شکل‌های مفرد این‌ها اند: *nam, gaf, stond, zat, liep,* و *reed*.'
  nl.a2.unit83.lesson01.teach.vraag:
    title: بپرس چه اتفاق افتاد
    gloss: در راه چه اتفاق افتاد؟
    note: '*Gebeurde* گذشتهٔ ساده *gebeuren* است.'
  nl.a2.unit83.lesson01.teach.zinnen:
    title: شکل‌های بی‌قاعده در جمله
    gloss: من در راه بودم. بس تأخیر داشت. یک رگبار دیدم و سوار بس شدم.
  nl.a2.unit83.lesson02.teach.handeling:
    title: فعل‌های حادثه
    gloss: انتظار کشیدن / زنگ زدن / بایسکل راندن / شروع کردن / گرفتن
    note: این فعل‌ها پس‌زمینه و رویداد را می‌سازند.
    example_gloss:
    - باید منتظر بس بمانم.
    - لوته می‌خواهد به من زنگ بزند.
    - می‌خواهم با بایسکل به خانه بروم.
    - ممکن است باران شروع شود.
    - ممکن است تایرم پنچر شود.
  nl.a2.unit83.lesson02.teach.regular_review:
    title: گذشتهٔ ساده منظم و بی‌قاعده
    gloss: انتظار کشید / زنگ زد / بایسکل راند / اتفاق افتاد / شروع شد / گرفت
    note: شکل‌های منظم *wachtte, belde,* و *fietste* از قاعدهٔ درس ۸۲ پیروی می‌کنند. *Begon* و *kreeg* بی‌قاعده اند.
  nl.a2.unit83.lesson02.teach.phrases:
    title: چهار جملهٔ حادثه
    gloss: من با بایسکل به خانه می‌رفتم. لوته زنگ زد. باران شروع شد. تایرم پنچر شد.
  nl.a2.unit83.lesson03.teach.connectors:
    title: پیوندهای زمانی
    gloss: وقتی / در حالی که / پهلوی
    note: '*toen* را برای یک لحظهٔ گذشته و *terwijl* را برای وضعیت‌های همزمان به کار ببرید.'
    example_gloss:
    - وقتی خانه آمدم، Lotte زنگ زد.
    - تا وقتی که منتظر بودم، باران می‌بارید.
    - من کنار بایسکلم ایستاده بودم.
  nl.a2.unit83.lesson03.teach.gn_toen:
    title: Toen با فعل در آخر جمله
    gloss: وقتی با بایسکل خانه می‌رفتم، باران شروع شد.
    note: 'بعد از *toen* فعل جملهٔ پیرو به آخر جمله می‌رود: *ik naar huis fietste*.'
  nl.a2.unit83.lesson03.teach.gn_terwijl:
    title: Terwijl برای وضعیت پس‌زمینه
    gloss: تا وقتی که منتظر بس بودم، Lotte زنگ زد.
    note: 'بعد از *terwijl* فعل در آخر می‌آید: *ik op de bus wachtte*.'
  nl.a2.unit83.lesson03.teach.gn_inversion:
    title: جابه‌جایی فعل و فاعل بعد از جملهٔ آغازین
    gloss: 'بعد از جملهٔ آغازین با toen یا terwijl، در جملهٔ اصلی فعل صرف‌شده پیش از فاعل می‌آید: begon het؛ belde Lotte.'
    note: ویرگول جملهٔ پیرو را می‌بندد؛ جملهٔ اصلی با *begon het* یا *belde Lotte* شروع می‌شود.
  nl.a2.unit83.lesson03.teach.gn_contrast:
    title: Toen در برابر terwijl
    gloss: Toen لحظه‌ای را می‌گوید که چیزی در آن اتفاق افتاد. Terwijl دو وضعیت را که هم‌زمان جریان داشتند به هم وصل می‌کند.
    note: در این درس همهٔ کارهای روایت‌شده در گذشتهٔ ساده آمده‌اند.
  nl.a2.unit83.lesson04.teach.halte:
    title: در ایستگاه
    gloss: ایستگاه / در خانه / کنار بایسکل
    note: '*Halte* می‌تواند ایستگاه بس یا ترامواى باشد.'
    example_gloss:
    - من در ایستگاه منتظر ماندم.
    - من دیر به خانه رسیدم.
    - من کنار بایسکل ایستاده بودم.
  nl.a2.unit83.lesson04.teach.regende:
    title: آب‌وهوا در پس‌زمینه
    gloss: تا وقتی که کنار بایسکلم ایستاده بودم، باران شدید می‌بارید.
  nl.a2.unit83.lesson04.teach.reeks:
    title: یک حادثهٔ کوتاه
    gloss: وقتی خانه می‌رفتم، تایر بایسکلم پنچر شد. تا ایستگاه پیاده رفتم و بس گرفتم.
  nl.a2.unit83.lesson05.teach.reading:
    title: راه خانهٔ Noor
    gloss: دیروز Noor بعد از کارش با بایسکل خانه رفت. وقتی از مسیر بایسکل‌رانی می‌رفت، تایر بایسکلش پنچر شد. تا وقتی که در ایستگاه ایستاده بود، بس دیر آمد. او بیست دقیقه در بس نشست. وقتی به خانه رسید، به Lotte زنگ زد.
    note: وضعیت‌های پس‌زمینه و رویدادهایی را که در جریان آن‌ها اتفاق افتادند، دنبال کنید.
    glosses:
      Gisteren: دیروز
      reed: با بایسکل رفت
      fietspad: مسیر بایسکل‌رانی
      lekke: پنچر
      band: تایر
      halte: ایستگاه
      twintig: بیست
      minuten: دقیقه
  nl.a2.unit83.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'Lotte: سلام Omar، در راه چه اتفاق افتاد؟'
  nl.a2.unit83.lesson06.teach.omar_band:
    title: Omar حادثه را می‌گوید
    gloss: 'Omar: وقتی با بایسکل خانه می‌رفتم، تایرم پنچر شد.'
  nl.a2.unit83.lesson06.teach.lotte_toen:
    title: Lotte می‌پرسد بعد چه شد
    gloss: 'Lotte: وای نه! بعدش چی شد؟'
  nl.a2.unit83.lesson06.teach.omar_regen:
    title: Omar تغییر هوا را اضافه می‌کند
    gloss: 'Omar: تا وقتی که کنار بایسکلم ایستاده بودم، باران شدید شروع شد.'
  nl.a2.unit83.lesson06.teach.lotte_thuis:
    title: Lotte می‌پرسد چطور خانه رسید
    gloss: 'Lotte: چطور خانه رسیدی؟'
  nl.a2.unit83.lesson06.teach.omar_bus:
    title: Omar قصه را تمام می‌کند
    gloss: 'Omar: تا ایستگاه بس پیاده رفتم و بس گرفتم.'
exercises:
  nl.a2.unit83.lesson01.exercise01.choose_had:
    instruction: جمله هالندی را که در زمان گذشته ساده (ماضی) است انتخاب کنید.
    correct_option: De bus had vertraging.
    distractors:
    - De bus heeft vertraging.
    - De bus waren vertraging.
    - De bus hadden vertraging.
    accepted_answers:
    - value: De bus had vertraging.
      status: correct
    feedback: '*Had* شکل مفرد گذشتهٔ ساده فعل *hebben* است.'
    prompt_blocks:
    - بس تأخیر داشت.
  nl.a2.unit83.lesson01.exercise02.choose_saw:
    instruction: جمله هالندی را که در زمان گذشته ساده (ماضی) است انتخاب کنید.
    correct_option: Ik zag een regenbui.
    distractors:
    - Ik zie een regenbui.
    - Ik zagen een regenbui.
    - Ik was een regenbui.
    accepted_answers:
    - value: Ik zag een regenbui.
      status: correct
    feedback: '*Zag* شکل مفرد گذشتهٔ ساده فعل *zien* است.'
    prompt_blocks:
    - من یک رگبار دیدم.
  nl.a2.unit83.lesson01.exercise03.match_forms:
    instruction: هر مصدر را با شکل مفرد ماضی آن وصل کنید.
    accepted_answers:
    - value:
      - left: zijn
        right: was
      - left: hebben
        right: had
      - left: gaan
        right: ging
      - left: komen
        right: kwam
      - left: zien
        right: zag
      - left: nemen
        right: nam
      status: correct
    feedback: این شش فعل پرکاربرد در گذشتهٔ ساده بی‌قاعده‌اند.
    pairs:
    - left: zijn
      right: was
    - left: hebben
      right: had
    - left: gaan
      right: ging
    - left: komen
      right: kwam
    - left: zien
      right: zag
    - left: nemen
      right: nam
  nl.a2.unit83.lesson01.exercise04.order_delay:
    instruction: کلمات را طوری مرتب کنید که بگویین «بس تأخیر داشت.»
    correct_option: De bus had vertraging
    accepted_answers:
    - value: De bus had vertraging
      status: correct
    feedback: '*De bus had vertraging* از شکل گذشتهٔ ساده *had* استفاده می‌کند.'
  nl.a2.unit83.lesson01.exercise05.complete_saw:
    instruction: جمله را با شکل مفرد گذشتهٔ ساده فعل zien کامل کنید.
    correct_option: zag
    accepted_answers:
    - value: zag
      status: correct
    feedback: '*Ik zag een regenbui* = من یک رگبار دیدم.'
  nl.a2.unit83.lesson01.exercise06.translate_took_bus:
    instruction: به هلندی ترجمه کنید. از گذشتهٔ ساده فعل nemen استفاده کنید.
    accepted_answers:
    - value: Ik nam de bus.
      status: correct
    - value: Ik nam de bus
      status: correct
    feedback: '*Ik nam de bus* = من بس گرفتم.'
    prompt_blocks:
    - من سوار بس شدم.
  nl.a2.unit83.lesson01.exercise07.write_was_underway:
    instruction: جملهٔ هلندیِ خواسته‌شده را با گذشتهٔ ساده فعل zijn بنویسین.
    correct_option: Ik was onderweg.
    accepted_answers:
    - value: Ik was onderweg.
      status: correct
    - value: Ik was onderweg
      status: correct
    feedback: '*Ik was onderweg* = من در راه بودم.'
    prompt_blocks:
    - 'با گذشتهٔ ساده فعل zijn به زبان هلندی بنویسین: من در راه بودم.'
  nl.a2.unit83.lesson02.exercise01.choose_cycled:
    instruction: جملهٔ هلندی را که در گذشتهٔ ساده است انتخاب کنید.
    correct_option: Ik fietste naar huis.
    distractors:
    - Ik fiets naar huis.
    - Ik fietsten naar huis.
    - Ik reed de bus.
    accepted_answers:
    - value: Ik fietste naar huis.
      status: correct
    feedback: '*Fietste* شکل مفرد گذشتهٔ ساده فعل *fietsen* است.'
    prompt_blocks:
    - من با بایسکل به خانه می‌رفتم.
  nl.a2.unit83.lesson02.exercise02.choose_got_flat:
    instruction: جمله‌ای را انتخاب کنید که معنایش «تایرم پنچر شد.» است.
    correct_option: Ik kreeg een lekke band.
    distractors:
    - Ik krijg een lekke band.
    - Ik kregen een lekke band.
    - Ik had vertraging.
    accepted_answers:
    - value: Ik kreeg een lekke band.
      status: correct
    feedback: '*Kreeg* شکل مفرد گذشتهٔ ساده فعل *krijgen* است.'
    prompt_blocks:
    - تایر بایسکلم پنچر شد.
  nl.a2.unit83.lesson02.exercise03.match_past:
    instruction: هر مصدر را با شکل مفرد ماضی آن وصل کنید.
    accepted_answers:
    - value:
      - left: wachten
        right: wachtte
      - left: bellen
        right: belde
      - left: fietsen
        right: fietste
      - left: beginnen
        right: begon
      - left: krijgen
        right: kreeg
      - left: gebeuren
        right: gebeurde
      status: correct
    feedback: سه فعل اول با قاعده‌اند؛ *begon* و *kreeg* بی‌قاعده‌اند.
    pairs:
    - left: wachten
      right: wachtte
    - left: bellen
      right: belde
    - left: fietsen
      right: fietste
    - left: beginnen
      right: begon
    - left: krijgen
      right: kreeg
    - left: gebeuren
      right: gebeurde
  nl.a2.unit83.lesson02.exercise04.order_flat:
    instruction: کلمات را طوری مرتب کنید که بگویین «تایرم پنچر شد.»
    correct_option: Ik kreeg een lekke band
    accepted_answers:
    - value: Ik kreeg een lekke band
      status: correct
    feedback: '*Ik kreeg een lekke band* از گذشتهٔ ساده *kreeg* استفاده می‌کند.'
  nl.a2.unit83.lesson02.exercise05.complete_rain:
    instruction: با شکل مفرد گذشتهٔ ساده فعل beginnen کامل کنید.
    correct_option: begon
    accepted_answers:
    - value: begon
      status: correct
    feedback: '*Het begon te regenen* = باران شروع شد.'
  nl.a2.unit83.lesson02.exercise06.translate_lotte_called:
    instruction: با گذشتهٔ ساده فعل bellen به هلندی ترجمه کنید.
    accepted_answers:
    - value: Lotte belde.
      status: correct
    - value: Lotte belde
      status: correct
    feedback: '*Lotte belde* = Lotte زنگ زد.'
    prompt_blocks:
    - لوته زنگ زد. از گذشتهٔ ساده استفاده کنید.
  nl.a2.unit83.lesson02.exercise07.write_cycled_home:
    instruction: جملهٔ خواسته‌شده را با گذشتهٔ ساده فعل fietsen بنویسین.
    correct_option: Ik fietste naar huis.
    accepted_answers:
    - value: Ik fietste naar huis.
      status: correct
    - value: Ik fietste naar huis
      status: correct
    feedback: '*Ik fietste naar huis* = من با بایسکل خانه می‌رفتم.'
    prompt_blocks:
    - 'با گذشتهٔ ساده فعل fietsen به زبان هلندی بنویسین: من با بایسکل به خانه می‌رفتم.'
  nl.a2.unit83.lesson03.exercise01.choose_toen:
    instruction: ترتیب درست کلمات را بعد از toen انتخاب کنید.
    correct_option: Toen ik naar huis fietste, begon het te regenen.
    distractors:
    - Toen ik fietste naar huis, het begon te regenen.
    - Toen fietste ik naar huis, begon het te regenen.
    - Toen ik naar huis fietste, het begon te regenen.
    accepted_answers:
    - value: Toen ik naar huis fietste, begon het te regenen.
      status: correct
    feedback: 'فعل جملهٔ پیرو در *toen ik naar huis fietste* در آخر است و بعدش فعل و فاعل جابه‌جا می‌شوند: *begon het*.'
    prompt_blocks:
    - جمله‌ای را انتخاب کنید که با toen شروع می‌شود و در جملهٔ پیرو فعل در آخر می‌آید.
  nl.a2.unit83.lesson03.exercise02.listen_while:
    instruction: گوش کنید و آنچه را می‌شنوید انتخاب کنید.
    correct_option: Terwijl ik op de bus wachtte, belde Lotte.
    distractors:
    - Toen ik naar huis fietste, begon het te regenen.
    - Terwijl ik naast mijn fiets stond, kwam de bus.
    - Toen ik de bus zag, liep ik naar de halte.
    accepted_answers:
    - value: Terwijl ik op de bus wachtte, belde Lotte.
      status: correct
    feedback: 'شنیدید: *Terwijl ik op de bus wachtte, belde Lotte*.'
  nl.a2.unit83.lesson03.exercise03.match_links:
    instruction: هر جملهٔ پیرو با toen یا terwijl را با معنایش جفت کنید.
    accepted_answers:
    - value:
      - left: Toen ik naar huis fietste
        right: وقتی با بایسکل به خانه می‌رفتم
      - left: Terwijl ik op de bus wachtte
        right: در حالی که منتظر بس بودم
      - left: Toen ik onderweg was
        right: وقتی در راه بودم
      - left: Terwijl ik naast mijn fiets stond
        right: در حالی که پهلوی بایسکلم ایستاده بودم
      - left: Toen ik de bus zag
