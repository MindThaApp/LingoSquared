teaching:
  de.a1.unit13.lesson01.teach.gestern:
    title: gestern
    gloss: 昨天
    note: '*gestern* 表明事件发生在不久前的过去。'
    example_gloss: 昨天我在公园里。
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: 您昨天做了什么？
    note: 德语描述近期已经完成的事件时，常使用 *haben* 加过去分词的结构。
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: 我买了面包。
    note: 过去分词 *gekauft* 放在句末。
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: 我喝了汤。
    note: '*gegessen* 是 *essen* 的过去分词。'
    example_gloss: 在此语境中：我买了面包，还喝了汤。
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: 我去了市场。
    note: 表示前往某地时使用 *bin ... gegangen*，不能使用 *habe ... gegangen*。
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: 非常好。
    note: '*war* 是 *sein*（是）的简单过去时：*es ist*（现在是）变为 *es war*（过去是）。'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: 简短叙述
    note: 这段叙述依次讲述了几个已经完成的动作。
    example_gloss: 昨天我去了市场。
  de.a1.unit13.lesson02.teach.line01:
    title: 费利克斯询问昨天的事
    gloss: 费利克斯：您昨天做了什么？
    note: 这是询问对方昨天做了什么的常用说法。
  de.a1.unit13.lesson02.teach.line02:
    title: 安娜描述她的一天
    gloss: 安娜：我去了市场。我买了面包，还喝了汤。
    note: 安娜用 *bin* 表示去，用 *habe* 表示买和吃。
    example_gloss: 在此语境中：我买了面包。
  de.a1.unit13.lesson02.teach.line03:
    title: 费利克斯询问感觉如何
    gloss: 费利克斯：感觉好吗？
    note: '*War es gut?* 用于询问这件事感觉如何。'
  de.a1.unit13.lesson02.teach.line04:
    title: 安娜说感觉很好
    gloss: 安娜：是的，非常好。
    note: 这是一个简短的总结性评价。
