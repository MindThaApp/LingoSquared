teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: 头痛
    note: '*Kopfschmerzen* 在形式上是复数，但可用来表示“头痛”。'
    example_gloss: 我头痛。
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: 肚子痛
    note: '*Bauch* 指肚子或胃；*Schmerzen* 指疼痛。'
    example_gloss: 我肚子痛。
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: 喉咙／脖子
    note: '*Hals* 根据语境可指喉咙或脖子。'
    example_gloss: 我喉咙痛。
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: 我头痛。
    note: 德语用身体部位作主语，并用 *tut weh* 表示该部位疼痛。
    example_gloss: 我肚子痛。
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: 我觉得恶心。
    note: '*Mir ist schlecht* 是表示“我觉得恶心”的自然说法，不能逐词直译。'
    example_gloss: 我觉得恶心；我肚子痛。
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: 您需要帮助吗？
    note: 正式称呼 *Sie* 使问句保持礼貌。
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: 我需要水。
    note: '*brauche* 的意思是“需要”，不是“使用”。'
    example_gloss: 根据语境：我需要水，还需要休息一下。
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: 休息
    note: '*eine Pause*指短暂的休息。'
    example_gloss: 我需要休息一下。
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: 喝水。休息一下。
    note: 正式称谓*Sie*使指示听起来更礼貌。
    example_gloss: 休息一下。
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: 安娜的问题
    gloss: Anna 的症状
    note: 这段短文说明了症状和眼下的需要。
    example_gloss: 她需要水。
  de.a1.unit17.lesson02.teach.line01:
    title: 费利克斯询问安娜的情况
    gloss: 费利克斯：安娜，您还好吗？
    note: 费利克斯对安娜仍使用正式称谓*Ihnen*。
  de.a1.unit17.lesson02.teach.line02:
    title: 安娜说出自己的不适
    gloss: 安娜：不，我头疼。
    note: 这个回答直接说明了症状。
  de.a1.unit17.lesson02.teach.line03:
    title: 费利克斯提出帮忙
    gloss: 费利克斯：您需要帮助吗？
    note: 这是一个简单的主动帮助用语。
  de.a1.unit17.lesson02.teach.line04:
    title: 安娜说出自己的需要
    gloss: 安娜：好的，谢谢。我需要水，还需要休息一下。
    note: 回答先说*Ja, bitte*，再说明眼下的需要。
    example_gloss: 根据语境：我需要水，还需要休息一下。
