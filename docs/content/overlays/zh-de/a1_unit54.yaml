teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词或短语：*lesen*（阅读）、*Sport treiben*（锻炼或做运动）和*kochen*（做饭）。Sport是名词，所以首字母要大写。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Die Freizeit*是阴性名词，应始终连同冠词die一起记忆。它是谈论爱好时的关键词。'
    example_gloss: 我空闲时喜欢阅读。
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Lese*是*lesen*（阅读）与ich搭配时的形式。句子以时间短语开头时，动词仍位于第二位：in meiner Freizeit lese ich gern。'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个表示爱好的短语：*Musik hören*（听音乐）、*zeichnen*（画画）和*Videospiele spielen*（玩电子游戏）。Musik和Videospiele是名词，所以首字母要大写。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: 德语说 *Musik hören*，不使用介词。
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Mit Freunden*（和朋友一起）：mit 后面始终接第三格，因此 Freunde 变为 Freunden。'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个核心频率副词是 immer、oft、manchmal、nie。它们通常紧跟在动词后面：ich spiele nie。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Jede Woche* 和 *jedes Wochenende* 都表示“每”，但词尾会随名词的性而变化，详见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede 与 jedes
    gloss: Die Woche 是阴性名词，所以说 jede Woche。Das Wochenende 是中性名词，所以说 jedes Wochenende。
    note: '*Woche* 是阴性名词（*die Woche*），所以搭配 *jede*；*Wochenende* 是中性名词（*das Wochenende*），所以搭配 *jedes*。记名词时连同冠词一起记，就能知道该用哪个词尾。'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna 谈起爱好
    gloss: Anna：我们经常一起散步。不过 Felix，你空闲时还做些什么？
    note: '*Wir gehen oft zusammen spazieren* 使用 gehen 加另一个动词：变位动词 gehen 位于第二位，不定式 spazieren 放在句末。'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Felix 的爱好
    gloss: Felix：我喜欢做饭，在家也做。我还经常锻炼。
    note: '*Auch zu Hause*（在家也做）说明 Felix 做饭是出于爱好，不只是在餐厅工作时做。'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna 很惊讶
    gloss: Anna：你在家也做饭？你上班时不是已经整天都在做饭了吗！
    note: '*Den ganzen Tag*（一整天）使用第四格，因此 der Tag 变为 den Tag。像这样的时间段使用第四格。'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix 作出解释
    gloss: Felix：是的，不过我觉得做饭让人放松。你呢？你喜欢做什么？
    note: '*Kochen finde ich entspannend* 把 Kochen 放在句首以示强调。动词仍位于第二位，所以 ich 移到动词后面。'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Anna 的爱好
    gloss: Anna：我喜欢阅读，也经常听音乐。
    note: 这个句子用 *und*（和）连接了第 01—02 课学过的两个表示爱好的动词。
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix 询问电子游戏爱好
    gloss: Felix：你也玩电子游戏吗？
    note: 这是一个简短的是非问句：动词放在句首，即 spielst du ...?。
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna 回答
    gloss: Anna：不，我从不玩电子游戏。不过我有时会画画！
    note: 回答中对比使用了第 03 课学过的 *Nie*（从不）和 *manchmal*（有时）。两者都紧跟在动词后面。
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: 比较爱好
    gloss: Felix 和我经常一起散步。不过我们也有其他爱好。Felix 喜欢做饭，在家也做，而且他经常锻炼。我喜欢阅读，也经常听音乐。我有时画画，但从不玩电子游戏。你空闲时喜欢做什么？
    note: Anna 的留言回顾了第 04 课中的信息，并在结尾向读者提出了本单元的核心问题。
    glosses:
      spazieren: 散步
      oft: 经常
      zusammen: 一起
      andere: 其他的
      kocht: 做饭
      gern: 喜欢
      Hause: 在家
      Sport: 锻炼
      lese: 阅读
      höre: 听
      Musik: 音乐
      zeichne: 画画
      manchmal: 有时
      spiele: 玩电子游戏
      nie: 从不
      freien: 空闲的
      Zeit: 时间
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix 询问周末安排
    gloss: Felix：你这个周末做什么？
    note: '*Dieses Wochenende*（这个周末）带有中性词尾 -es，因为 das Wochenende 是中性名词。'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna 还没决定
    gloss: Anna：我还不知道。我喜欢阅读，但也想出去走走。
    note: '*Nach draußen*（到外面去，字面意思为“去外面”）是表达想出门的一种常见说法。'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix 提议一项安排
    gloss: Felix：我们一起去散步好吗？之后我给我们做饭。
    note: '*Danach*（之后）放在句首，因此接下来是动词，主语放在动词后面：danach koche ich。'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna 表示同意
    gloss: Anna：好主意！散步和做饭我都喜欢。
    note: 动词后的 *Gern* 表示喜欢做某事：ich gehe gern spazieren、ich koche gern。它几乎可以和任何动词搭配。
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix 确认安排
    gloss: Felix：太好了。那么周六见！
    note: 这是一句友好的结束语，用于确认 *Samstag*（周六）的安排。星期前使用 *am*：am Samstag。
