course:
  title: 德语 A1
  description: 德语初级课程，学习描述人物的基本外貌：身高和年龄给人的印象、头发和眼睛的颜色、核心问句 Wie sieht ... aus?，以及比较两个人的外貌。
units:
  de.a1.unit55.aussehen:
    title: 描述外貌
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: 高、矮、年老和年轻
  de.a1.unit55.lesson02.haare_beschreiben:
    title: 描述头发
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: 眼睛和询问某人的外貌
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna 描述 Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: 比较 Jonas 和 Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix 认出 Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Groß* 形容个子高的人，*klein* 形容个子矮的人。德语形容人的身高时用 groß，而不用表示长度的 lang。'
    example_gloss:
    - Lena 个子很高。
    - Jonas 个子很矮。
  de.a1.unit55.lesson01.teach.alt_jung:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: 这里的 *Alt* 和 *jung* 描述的是对年龄的大致印象，而不是确切的岁数。
    example_gloss:
    - 爷爷年纪大了。
    - Felix 很年轻。
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: Alt：确切岁数或大致印象
    gloss: Alt 可以和具体岁数连用，如 Ich bin dreißig Jahre alt；也可以表达大致印象，如 Opa ist alt。
    note: 询问某人的确切年龄时，可以说 *Wie alt bist du?*。这里的 *alt* 描述某人看起来多大，不带具体数字。
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena 个子高，Jonas 个子矮
    gloss: Lena 个子高，Jonas 个子矮。
    note: 这是一个使用 *und*（和）连接的简单句，为第 05 课中的直接比较作铺垫。
  de.a1.unit55.lesson02.teach.die_haare:
    title: 头发
    gloss: 头发
    note: '*Haare* 是复数名词：*die Haare*。德语也有单数形式 das Haar，但谈论头上的头发时通常使用 Haare。'
    example_gloss: Felix 留着黑色短发。
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色：blond、braun、grau。放在不带冠词的复数名词前时，它们要加词尾 -e：blonde、braune、graue Haare。
    example_gloss:
    - Anna 留着金发。
    - Jonas 留着棕发。
    - 爷爷头发灰白。
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Kurz*（短）和 *lang*（长）描述头发的长度。这里同样要加词尾 -e：kurze Haare、lange Haare。'
    example_gloss:
    - Lena 留着长发。
    - Jonas 留着短发。
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare 前的形容词加词尾 -e
    gloss: Haare 是复数且不带冠词，所以形容词以 -e 结尾：kurze Haare、lange Haare、blonde Haare、braune Haare、graue Haare、schwarze Haare。
    note: 复数名词不带冠词时，名词前的形容词要加词尾 -e。这与第 03 课中 *Augen* 的用法相同。
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: Ihre：她的
    gloss: Ihre 在这里表示“她的”：ihre Haare＝她的头发。Anna 留着长发，她的头发是金色的。
    note: '*Ihre*（小写 i）是表示“她的”的物主词，并与复数名词 Haare 保持一致。首字母大写的 *Ihre* 表示正式用语中的“您的”。'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix 留着黑色短发
    gloss: Felix 留着黑色短发。
    note: 这里再次使用 *schwarz*（黑色），这次用来描述头发：schwarze Haare。
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna 留着金色长发
    gloss: Anna 留着金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  de.a1.unit55.lesson03.teach.die_augen:
    title: 眼睛
    gloss: 眼睛
    note: '*Augen* 是 *das Auge* 的复数形式。德语通常使用复数，因为人有两只眼睛。'
    example_gloss: Felix 有一双棕色眼睛。
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: 颜色：blau（蓝色）、braun（棕色）和 grün（绿色）。
    example_gloss:
    - Anna 有一双蓝眼睛。
    - Jonas 有一双棕色眼睛。
    - Lena 有一双绿眼睛。
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen 前的形容词加 -e
    gloss: Augen 是复数，所以形容词以 -e 结尾：blaue Augen、braune Augen、grüne Augen。
    note: 这与 Haare 的规则相同：复数名词不带冠词时，形容词加词尾 -e。
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Anna 长什么样？
    gloss: Anna 长什么样？
    note: '*Wie sieht ... aus?* 是本单元的核心问句。*Aussehen* 是可分动词：sieht ... aus。'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna 留着金色长发，有一双蓝眼睛
    gloss: Anna 留着金色长发，有一双蓝眼睛。
    note: 这是一个用 *und* 在同一句中结合头发和眼睛特征的示范回答。
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna 介绍 Nina
    gloss: Anna：一位新来的女孩要来语言咖啡馆。她叫 Nina。
    note: '*Ein neues Mädchen kommt* 用来引出一位新人物。在 *kommt* 之后，表示方向的 *ins*（in das）Sprachcafé 要求使用第四格。'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix 询问她长什么样
    gloss: Felix：好的！她长什么样？
    note: 这里再次使用本单元的核心问句，并用 *sie*（她）代替姓名：wie sieht sie aus?
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna 描述 Nina 的身高和头发
    gloss: Anna：她个子矮，留着金色短发。
    note: 这里把 *klein* 与第 02 课的头发词汇结合起来。第二个 *sie* 被省略了：sie ist klein und hat ...
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix 询问她的眼睛
    gloss: Felix：那她的眼睛呢？
    note: 这里的 *Ihre* 表示“她的”，是物主词，并不是“您”的某种形式。它与复数名词 Augen 保持一致。
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna 描述 Nina 的眼睛
    gloss: Anna：她有一双绿眼睛。
    note: 这里再次使用第 03 课中的 *grüne Augen*。
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix 会认出她
    gloss: Felix：谢谢！那我一定能认出她。
    note: '*Dann erkenne ich sie bestimmt* 表示“那我一定能认出她”。在 *dann* 之后，动词仍位于第二位：dann erkenne ich sie。'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: 比较 Jonas 和 Lena
    gloss: Jonas 和 Lena 是兄妹，但他们长得不一样。Jonas 个子矮，留着棕色短发，眼睛是棕色的。Lena 比 Jonas 高，留着棕色长发，眼睛是绿色的。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      Bruder: 兄弟
      Schwester: 姐妹
      sehen: 看起来
      unterschiedlich: 不同的
      klein: 矮的
      kurze: 矮的
      braune: 棕色的
      Haare: 头发
      Augen: 眼睛
      größer: 更高的
      lange: 长的
      grüne: 绿色的
      aus: （aussehen 的一部分，意为“看起来”）
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: 再次学习比较级
    gloss: 你已经知道“形容词＋-er＋als（比）”这个结构了。这里用它来比较人物：Lena 比 Jonas 高。
    note: 这里使用的是比较单元中相同的 *-er + als* 结构。Groß 变为 größer：元音要加变音符号。
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena 的头发比 Jonas 的长
    gloss: Lena 的头发比 Jonas 的长。
    note: '*Längere Haare*：länger 位于不带冠词的复数名词前时要加 -e；lang 构成比较级时，元音还要加变音符号。'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 这是一个使用 *Ich habe ...* 的第一人称示范句，描述自己的外貌时可以直接套用。
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix 认出了 Nina
    gloss: Felix：你看，那是 Nina 吗？她留着金色短发，眼睛是绿色的。
    note: '*Schau mal*（你看）是一种友好地提醒别人注意某事的说法，是对 du 使用的命令式。'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna 确认了
    gloss: Anna：对，那就是 Nina！
    note: 这是一个简短自然的肯定回答。
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina 向 Felix 问好
    gloss: Nina：你好，你是 Felix 吗？
    note: 这是一个简单的非正式问句：*bist du ...?*（你是……吗？）。Bist 是 sein 与 du 搭配时的形式。
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix 回应 Nina 的问候
    gloss: Felix：对！很高兴认识你，Nina。
    note: '*Freut mich* 是初次见面时的常用表达，第 2 单元学过。遇到认识的人时，可以说 *Schön, dich zu sehen*。'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 这段对话到此结束——Felix 根据 Anna 之前的描述成功认出了 Nina。
