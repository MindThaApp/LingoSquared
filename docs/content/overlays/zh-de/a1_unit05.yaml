teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: 几点了？
    note: 字面意思是“有多晚了？”，这是询问时间的标准说法。
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: 三点。
    note: '*Uhr* 意为“点钟”。整点的表达方式是数字加 *Uhr*。'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: 三点半（3:30）。
    note: 德语用即将到来的下一个整点表示半点：*halb vier* 的意思是“到四点的一半”，即3:30，而不是4:30。
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: 五点。
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: 三点一刻（3:15）。
    note: '*Viertel* 意为“一刻钟”；*nach* 表示“过”。'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: 差一刻四点（3:45）。
    note: '*vor* 表示“在……之前／差……”。'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: 四点十分（4:10）。
    note: 表达整点之后的分钟数时，使用“分钟数＋*nach*＋整点”。
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: 差十分五点（4:50）。
    note: 表达距离下一个整点还有多少分钟时，使用“分钟数＋*vor*＋下一个整点”。
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: 早晨
    note: '*Morgen* 是表示早晨的名词，大约指早上6点到中午12点。'
    example_gloss: 早上好，菲利克斯！
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: 中午
    note: '*Mittag* 指中午本身，是 Morgen 和 Nachmittag 之间的时点。'
    example_gloss: 现在是中午。
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: 下午
    note: '*Nachmittag* 大约指中午12点到下午6点。'
    example_gloss: 我下午工作。
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: 晚上
    note: '*Abend* 大约指下午6点到晚上10点。'
    example_gloss: 晚上好，安娜！
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: 夜晚
    note: '*Nacht* 大约指晚上10点到早上6点。'
    example_gloss: 晚安，菲利克斯！
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: 午夜
    note: '*Mitternacht* 指午夜12点整，即0 Uhr。'
    example_gloss: 聚会在午夜结束。
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: 十八
    note: '*achtzehn* 表示18，此处用于正式时间中的24小时制（achtzehn Uhr 即下午6点）。'
    example_gloss: 商店在18:00（下午6点）关门。
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: 商店早上九点开门。
    note: '*um* 加时间表示“在某个时间”；*morgens* 意为“在早晨”。'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: 商店在18:00（下午6点）关门。
    note: '*schließt* 意为“关门”。正式营业时间使用24小时制。'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: 什么时候
    note: '*Wann* 用于询问时间。'
    example_gloss: 你什么时候来？
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: 打开
    note: '*öffnet* 是 *öffnen*（打开）的第三人称单数形式；*die* 是阴性／复数定冠词，在这里与 *die Bibliothek* 的阴性相呼应。'
    example_gloss: 图书馆什么时候开门？
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 图书馆
    note: '*Bibliothek* 是阴性名词（*die Bibliothek*），也就是第4单元中出现过的那个地点。'
    example_gloss: 我要去图书馆。
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: 它／她／他们／她们（小写）
    note: 这里的 *sie* 是代替阴性名词 *die Bibliothek* 的第三人称代词，意思是“它”。不要将其与大写的 *Sie*（尊称“您”）混淆；安娜和费利克斯彼此就使用这一尊称。
    example_gloss: 我喜欢这家图书馆。我经常去那里。
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: 到时；然后
    note: 这里的 *dann* 用在告别语 *Bis dann!*（“到时见！”）中。
    example_gloss: 到时见！
  de.a1.unit05.lesson04.teach.line01:
    title: 费利克斯询问图书馆的情况
    gloss: 费利克斯说：图书馆什么时候开门？
  de.a1.unit05.lesson04.teach.line02:
    title: 安娜回答
    gloss: 安娜说：它早上九点开门。
    note: 这里的 *Sie* 意为“它”，指的是 *die Bibliothek*；它大写只是因为位于句首。
  de.a1.unit05.lesson04.teach.line03:
    title: 费利克斯接着提问
    gloss: 费利克斯说：那它什么时候关门？
  de.a1.unit05.lesson04.teach.line04:
    title: 安娜再次回答
    gloss: 安娜说：它18:00（下午6点）关门。
  de.a1.unit05.lesson04.teach.line05:
    title: 费利克斯告别
    gloss: 费利克斯说：好，到时见！
  de.a1.unit05.lesson04.teach.schild:
    title: 门上的告示
    gloss: 开放时间：9:00至18:00。
    note: '*Öffnungszeiten*＝“开放时间”；*bis*＝“直到／到”。'
