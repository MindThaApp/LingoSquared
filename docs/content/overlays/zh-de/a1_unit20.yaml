teaching:
  de.a1.unit20.lesson01.teach.wetter:
    title: Wetter
    gloss: 天气
    note: '*Wetter* 是中性：*das Wetter*。'
    example_gloss: 天气怎么样？
  de.a1.unit20.lesson01.teach.sonnig:
    title: sonnig
    gloss: 晴朗的
    note: 用 *Es ist sonnig* 表示“天气晴朗”。
    example_gloss: 天气晴朗。
  de.a1.unit20.lesson01.teach.kalt:
    title: kalt
    gloss: 寒冷的
    note: '*kalt* 用来描述温度。'
    example_gloss: 天气很冷。
  de.a1.unit20.lesson01.teach.warm:
    title: warm
    gloss: 暖和的
    note: '*warm* 表示温度暖和，需按德语发音。'
    example_gloss: 天气很暖和。
  de.a1.unit20.lesson01.teach.regnet:
    title: Es regnet.
    gloss: 正在下雨。
    note: 德语在这里必须保留 *Es*，不能省略主语。
  de.a1.unit20.lesson02.teach.dann:
    title: dann
    gloss: 然后
    note: '*dann* 把天气情况与接下来的安排联系起来。'
    example_gloss: 然后我们去咖啡馆。
  de.a1.unit20.lesson02.teach.ins_cafe:
    title: Wir gehen ins Cafe.
    gloss: 我们要去咖啡馆。
    note: 与 *das Cafe* 这类中性地点搭配时，*ins* 表示“进入／去往该地点”。
    example_gloss: 结合语境：然后我们就去咖啡馆。
  de.a1.unit20.lesson02.teach.morgen:
    title: morgen
    gloss: 明天
    note: 小写的 *morgen* 表示“明天”。
    example_gloss: 明天天气晴朗。
  de.a1.unit20.lesson02.teach.forecast:
    title: 天气预报
    gloss: 天气预报
    note: 这则预报对比了今天和明天的天气。
    example_gloss: 明天天气晴朗。
  de.a1.unit20.lesson02.teach.line01:
    title: Anna 询问天气
    gloss: Anna：今天天气怎么样？
    note: 这是直接询问天气的问句。
  de.a1.unit20.lesson02.teach.line02:
    title: Felix 描述今天的天气
    gloss: Felix：天气很冷，而且正在下雨。
    note: 这个回答同时说明了气温和降雨情况。
  de.a1.unit20.lesson02.teach.line03:
    title: Anna 提出安排
    gloss: Anna：那我们就去咖啡馆吧。
    note: 这个安排是根据下雨的天气作出的。
  de.a1.unit20.lesson02.teach.line04:
    title: Felix 提到明天
    gloss: Felix：好主意。明天会是晴天。
    note: Felix 补充说明了明天的天气。
