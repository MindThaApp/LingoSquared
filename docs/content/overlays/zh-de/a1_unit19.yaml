    note: 这段简短描述介绍了地点、房间和家具。
    example_gloss: 我的公寓在柏林。
  de.a1.unit19.lesson02.teach.line01:
    title: Felix 询问公寓的情况
    gloss: Felix：Anna，您的公寓怎么样？
    note: 正式用语 *Ihre* 与 *Sie* 相对应。
    example_gloss: 您的公寓怎么样？
  de.a1.unit19.lesson02.teach.line02:
    title: Anna 描述各个房间
    gloss: Anna：我的公寓很小，但很明亮。里面有两个房间、一间厨房和一间浴室。
    note: Anna 说明了公寓的大小、采光和房间数量。这里的 *Sie hat* 表示“它有”：*Sie* 指代前面出现的 *die Wohnung*。
    example_gloss: 它有两个房间。
  de.a1.unit19.lesson02.teach.line03:
    title: Felix 询问家具
    gloss: Felix：有桌子吗？
    note: '*Gibt es...?* 用来询问是否有某个事物。'
  de.a1.unit19.lesson02.teach.line04:
    title: Anna 说明桌子的位置
    gloss: Anna：有，桌子在客厅里。
    note: 回答说明了家具的位置。
    example_gloss: 桌子在客厅里。
