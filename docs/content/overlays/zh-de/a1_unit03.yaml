teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: 零、一、二、三、四
    note: 德语中的数字0至4。
    example_gloss:
    - 我有零个苹果。
    - 我是第一名！
    - 我有两个苹果。
    - 我有三个苹果。
    - 我有四个苹果。
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: 五、六、七、八、九、十
    note: 德语数字5至10。
    example_gloss:
    - 我有五个苹果。
    - 我有六个苹果。
    - 我有七个苹果。
    - 我有八个苹果。
    - 我有九个苹果。
    - 我有十个苹果。
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: 十一、十二
    note: '*elf*和*zwölf*是不规则形式，不遵循从13开始使用的“-zehn”构词规律。'
    example_gloss:
    - 我的门牌号是十一号。
    - 我的门牌号是十二号。
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: 十三、十四、十五、十六
    note: 从13开始，德语数字由个位数词加 *-zehn* 构成，类似于英语的 *-teen*。注意是 *sechzehn*，而不是 *sechszehn*——这里省略了 *s*。
    example_gloss:
    - 我的门牌号是十三号。
    - 我的门牌号是十四号。
    - 我的门牌号是十五号。
    - 我的门牌号是十六号。
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: 十七、十八、十九、二十
    note: 注意是*siebzehn*，而不是*siebenzehn*——在*-zehn*前，*sieben*末尾的*-en*要省略。
    example_gloss:
    - 我的门牌号是十七号。
    - 我的门牌号是十八号。
    - 我的门牌号是十九号。
    - 我的门牌号是二十号。
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: 三十、四十、五十
    note: 注意是*dreißig*，而不是*dreizig*——30以*-ßig*结尾，而不是*-zig*（20的*zwanzig*也是不规则形式）。
    example_gloss:
    - 那个要30欧元。
    - 那个要40欧元。
    - 那个要50欧元。
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: 六十、七十、八十、九十
    note: 从40开始，构词规律是个位数加*-zig*（其中表示六和七的部分会像十几的数字一样缩写为*sech-*和*sieb-*）。
    example_gloss:
    - 那个要60欧元。
    - 那个要70欧元。
    - 那个要80欧元。
    - 那个要90欧元。
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: 一百
    note: '*hundert*单独使用时表示“一百”——前面不需要加*ein*（也可以说*einhundert*，但日常口语中不太常见）。'
    example_gloss: 那个要100欧元。
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: 二十一
    note: 德语中21至99的合成数词采用“个位数＋*und*（和）＋十位数”的顺序，并且全部连写成一个词。*einundzwanzig*＝*ein*（一）＋*und*（和）＋*zwanzig*（二十），字面意思是“一和二十”。
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: 三十二
    note: 构词规律相同：*zwei*（二）＋*und*＋*dreißig*（三十）＝“二和三十”＝32。
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: 您多大年纪？
    note: '*alt*表示“年老的”——字面意思是“您有多老”。'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: 你多大？
    note: 这是使用*du*的非正式说法。
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: 我二十八岁。
    note: '*Jahre alt*（……岁）始终放在数字后面。德语用“我＋是＋数字＋岁”来表达年龄。'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix询问Anna的年龄
    gloss: Felix说：冒昧问一下，您多大年纪？
    note: '*wenn ich fragen darf*（如果我可以问的话）可以缓和原本可能显得有些直接的问题；两人继续使用正式称呼*Sie*时，加上这句话会显得更礼貌。'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna回答并反问
    gloss: Anna说：我二十八岁。您呢？
    note: Anna说出自己的年龄后，又把同一个问题反问给Felix，沿用了第2单元学过的表达方式。
  de.a1.unit03.lesson05.teach.line03:
    title: Felix回答
    gloss: Felix说：我三十一岁。
    note: 这说明Felix比Anna大三岁。
