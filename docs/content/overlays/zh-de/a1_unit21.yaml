  de.a1.unit21.kleidung:
    title: 服装
teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: 服装
    note: '*Kleidung* 是衣服的统称。'
    example_gloss: 我在买衣服。
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: 衬衫
    note: '*Hemd* 指衬衫，通常是纽扣衬衫。'
    example_gloss: 我在找一件衬衫。
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: 裤子
    note: 在德语中，一条裤子用单数 *Hose* 表示。
    example_gloss: 我在找一条裤子。
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: 夹克
    note: '*Jacke* 指夹克或外套。'
    example_gloss: 这件夹克很暖和。
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: 我在找一件衬衫。
    note: '*suche* 在商店里很实用，表示“在找”。'
    example_gloss: 我在找一件夹克。
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: 尺码
    note: '*Größe* 表示服装尺码。'
    example_gloss: 请给我 M 码。
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: 蓝色
    note: 用德语提出颜色要求时，可以说 *in Blau*。
    example_gloss: 我在找一件蓝色衬衫。
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: 红色
    note: '*rot* 表示红色。'
    example_gloss: 这件夹克是红色的。
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: 这件衬衫合身。
    note: 在服装语境中，*passt* 表示“合身”。
    example_gloss: 结合语境：是的，这件衬衫很合身。
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: 我在找一件蓝色衬衫，M 码。
    note: 这个请求说明了商品、颜色和尺码。
  de.a1.unit21.lesson02.teach.label:
    title: 服装标签
    gloss: 服装标签
    note: 标签上可以标明颜色、尺码和价格。
    example_gloss: 颜色：蓝色。尺码：M。
  de.a1.unit21.lesson02.teach.line01:
    title: 店员询问需求
    gloss: 店员：您好。您在找什么？
    note: 店员询问顾客在找什么。
    example_gloss: 您在找什么？
  de.a1.unit21.lesson02.teach.line02:
    title: Felix 说明商品、颜色和尺码
    gloss: Felix：我在找一件蓝色衬衫，M 码。
    note: Felix 说出了要求的全部三项信息。
  de.a1.unit21.lesson02.teach.line03:
    title: 店员把商品递给顾客
    gloss: 店员：给您。您想买下它吗？
    note: 正式称呼 *Sie* 让商店里的对话保持礼貌。
    example_gloss: 您想买下它吗？
  de.a1.unit21.lesson02.teach.line04:
    title: Felix 确认是否合身并询问价格
    gloss: Felix：是的，这件衬衫很合身。它多少钱？
    note: Felix 表示衬衫很合身，并询问价格。
    example_gloss: 结合语境：是的，这件衬衫很合身。
