teaching:
  de.a1.unit16.lesson01.teach.bahnhof:
    title: Bahnhof
    gloss: 火车站
    note: '*Bahnhof* 指火车站。'
    example_gloss: 我在火车站。
  de.a1.unit16.lesson01.teach.gleis:
    title: Gleis
    gloss: 站台／轨道
    note: 德国铁路信息用 *Gleis* 加数字表示站台编号。
    example_gloss: 根据语境：三号站台在哪里？
  de.a1.unit16.lesson01.teach.zug:
    title: Zug
    gloss: 火车
    note: '*Zug* 是阳性名词：*der Zug*。'
    example_gloss: 这列火车开往柏林。
  de.a1.unit16.lesson01.teach.fahrkarte:
    title: Fahrkarte
    gloss: 车票
    note: '*Fahrkarte* 指乘车票。'
    example_gloss: 根据语境：请给我一张去柏林的车票。
  de.a1.unit16.lesson01.teach.abfahrt:
    title: Abfahrt
    gloss: 发车
    note: '*Abfahrt* 表示出发时间。'
    example_gloss: 九点出发。
  de.a1.unit16.lesson02.teach.einfach:
    title: einfach
    gloss: 单程
    note: 在售票窗口，*einfach* 表示单程。
    example_gloss: 根据语境：请给我单程票。
  de.a1.unit16.lesson02.teach.hin_zurueck:
    title: hin und zurück
    gloss: 往返
    note: 字面意思是“去和回”。
    example_gloss: 根据语境：单程还是往返？
  de.a1.unit16.lesson02.teach.faerht:
    title: Der Zug fährt um neun Uhr von Gleis drei.
    gloss: 火车九点从三号站台出发。
    note: 谈到交通工具时，*fährt* 表示“行驶”或“出发”。
  de.a1.unit16.lesson02.teach.plan_text:
    title: Fahrkarte
    gloss: 车票
    note: 车票或时刻表上会显示目的地、出发时间、站台和票种。
    example_gloss: 票种：单程。
  de.a1.unit16.lesson02.teach.line01:
    title: Felix 买车票
    gloss: Felix：您好，请给我一张去柏林的车票。
    note: 礼貌购票时要说明目的地。
    example_gloss: 根据语境：请给我一张去柏林的车票。
  de.a1.unit16.lesson02.teach.line02:
    title: 售票员询问票种
    gloss: 售票员：单程还是往返？
    note: 售票员询问要单程票还是往返票。
  de.a1.unit16.lesson02.teach.line03:
    title: Felix 选择单程票
    gloss: Felix：请给我单程票。
    note: 只需简短回答要单程票即可。
  de.a1.unit16.lesson02.teach.line04:
    title: 售票员告知时间和站台
    gloss: 售票员：火车九点从三号站台出发。
    note: 行程的关键信息是时间和站台。
  de.a1.unit16.lesson02.teach.line05:
    title: Felix 询问站台在哪里
    gloss: Felix：谢谢。三号站台在哪里？
    note: 这是在车站很实用的后续提问。
    example_gloss: 根据语境：三号站台在哪里？
  de.a1.unit16.lesson02.teach.line06:
    title: 售票员指路
    gloss: 售票员：一直往前走，然后右转。
    note: 出行时也可以使用第 10 单元学过的指路用语。
