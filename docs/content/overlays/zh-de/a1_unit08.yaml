  de.a1.unit08.einkaufen:
    title: 购物：价格与数量
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: 一磅苹果
    note: 在德国，*Pfund* 至今仍常用于非正式场合；德国的一个 *Pfund* 正好是500克（半公斤），比英制磅略重，尽管德国正式采用公制。
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: 一打鸡蛋
    note: '*Dutzend* 表示一打（十二个）。'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: 一瓶水
    note: '*Flasche* 表示瓶。'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: 一袋大米
    note: '*Tüte* 表示袋。'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: 一公斤西红柿
    note: '*Kilo* 是标准的公制重量单位；除日常随意表达数量的场合外，它远比 *Pfund* 常用。'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: 苹果多少钱？
    note: '*kosten* 表示“价格为”——按字面结构理解就是“苹果价格是多少？”'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: 苹果每磅两欧元。
    note: 这里的 *Sie* 表示“它们”（指苹果），而不是正式称呼“您”。正式称呼 *Sie* 和表示“它们”的复数 *sie* 使用完全相同的动词形式（*kosten*）；位于句首时两者也都会大写，因此只能根据语境判断。这里谈论的主语是苹果，而不是人。
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: 请给我两磅，可以吗？
    note: 这是一种礼貌的请求句式，与第7单元的 *Ich möchte..., bitte* 类似。
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: 它新鲜吗？
    note: '*frisch* 表示新鲜。这里的 *es* 与中性名词一致（如 das Brot）；询问阳性物品时要说 *Ist er frisch?*（der Reis），询问阴性物品时要说 *Ist sie frisch?*（die Milch）。代词会随名词的语法性别变化，并不固定使用 *es*。'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: 每磅
    note: '*pro* 表示“每”——价格标签和口头报价中都会使用。'
    example_gloss: 苹果每磅两欧元。
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: 市场价格牌
    note: 这是一块简单的价格牌，列出了三种商品及其单位价格。
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: 一共八欧元。
    note: '*Das macht...* 是报总价的标准表达，第7单元中已经学过。'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix 询问价格
    gloss: Felix 说：苹果多少钱？
    note: 这与第2课的问题相同，现在用于真实对话中。
  de.a1.unit08.lesson04.teach.line02:
    title: Anna 报出价格
    gloss: Anna 说：苹果每磅两欧元。
    note: 完整的回答会说明每单位的价格。
  de.a1.unit08.lesson04.teach.line03:
    title: Felix 点单
    gloss: Felix 说：好的，请给我两磅，可以吗？
    note: 这里的 *Gut* 表示“好的”，即接受价格后再下单。
  de.a1.unit08.lesson04.teach.line04:
    title: Anna 询问是否还要别的
    gloss: Anna 说：当然。还要别的吗？
    note: '*Natürlich* 表示“当然”。'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix 继续点单
    gloss: Felix 说：是的，还要一打鸡蛋。
    note: '*auch* 表示“也、还”。'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna 报出总价
    gloss: Anna 说：一共八欧元。
    note: 两磅苹果（4€）加一打鸡蛋（4€），总计八欧元。
