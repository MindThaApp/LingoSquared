    gloss: Anna：一直往前走，然后在街角向左转。
    note: 完整的回答用 *dann* 连接两个路线步骤。
  de.a1.unit10.lesson04.teach.line03:
    title: Felix 确认路线并继续询问
    gloss: Felix：在街角向左转，好的。远吗？
    note: Felix 复述路线以确认自己听懂了，然后自然地继续询问。
  de.a1.unit10.lesson04.teach.line04:
    title: Anna 回答有多远
    gloss: Anna：不远，离这里仅有两分钟路程。您不会找不到的。
    note: 这是一个完整且让人安心的回答。
