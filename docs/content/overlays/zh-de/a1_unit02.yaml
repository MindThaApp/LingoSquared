teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: 您叫什么名字？
    note: '*Wie heißen Sie?* 的字面意思是“您是怎么被称呼的？”，使用了第 1 单元学过的正式称呼 *Sie*。'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: 我叫 Anna。
    note: '*heißen* 表示“叫作”，这是介绍自己姓名的标准说法。'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: 你叫什么名字？
    note: 这是使用第 1 单元学过的 *du* 的非正式说法。
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: 我叫 Felix。
    note: 句式与 *Ich heiße Anna* 相同，只是姓名不同。
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: 很高兴认识你。
    note: 这是表达很高兴认识对方的一种简短常用说法，正式和非正式场合都可以使用。
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: 我也一样。／这是我的荣幸。
    note: 这是对 *Freut mich* 的自然回应，字面意思是“我这边完全一样”。
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: 我
    note: 德语中的 *ich* 通常小写，只有位于句首时才大写，如 *Ich bin Anna.*；中文没有大小写之分。
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: 你（非正式）
    note: 这个词已在第 1 单元介绍过，这里将复习它作为完整句子的主语时的用法。
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: 我是 Anna。
    note: '*bin* 是动词 *sein*（是）与 *ich* 搭配时的形式。'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: 你是 Felix。
    note: '*bist* 是动词 *sein* 与 *du* 搭配时的形式。'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: 德国
    note: 德语中的国名通常不需要冠词，只说 *Deutschland*，而不说 *das Deutschland*。
    example_gloss: 我来自德国。
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: 英格兰
    note: England 的拼写需要注意，其发音遵循德语的读音规则。
    example_gloss: 我来自英格兰。
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: 法国
    note: 注意德语写作 Frankreich，法语则写作 *France*。
    example_gloss: 我来自法国。
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: 意大利
    note: 发音大致为“伊塔利恩”。
    example_gloss: 我来自意大利。
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: 西班牙
    note: 发音大致为“施帕尼恩”。
    example_gloss: 我来自西班牙。
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: 俄罗斯
    note: 这个词由 *Russ-* 和 *-land* 构成，与 *Deutschland* 的构词方式类似。
    example_gloss: 我来自俄罗斯。
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: 您来自哪里？
    note: '*Woher* 本身就包含“从哪里”的意思；德语用一个词表达中文“从哪里”所包含的两部分含义。'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: 我来自德国。
    note: 用 *aus* 加国名可以说明来自哪里；现阶段不需要使用区分性别的国籍词。
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: 你来自哪里？
    note: 这是使用 *du* 的非正式说法。
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: 我来自英格兰。
    note: 句式与 *Ich komme aus Deutschland* 相同，只是国家不同。
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: 您呢？
    note: 这是使用与 *Sie* 一致的正式称呼来简短反问对方。
  de.a1.unit02.lesson05.teach.line01:
    title: Felix 向 Anna 问好
    gloss: 费利克斯说：您好！
    note: 费利克斯和安娜是邻居，之前见过一次（第1单元），但没有互通姓名。这次他们又在公交车站偶遇了。
  de.a1.unit02.lesson05.teach.line02:
    title: 安娜回礼并询问他的姓名
    gloss: 安娜说：您好！您叫什么名字？
    note: 安娜使用正式称呼 *Sie*，延续了两人在第1单元中以陌生人身份交谈时采用的语体。
  de.a1.unit02.lesson05.teach.line03:
    title: 费利克斯说出自己的姓名并反问对方
    gloss: 费利克斯说：我叫费利克斯。您呢？
    note: 费利克斯回答后，用正式称呼反问对方。
  de.a1.unit02.lesson05.teach.line04:
    title: 安娜说出自己的姓名
    gloss: 安娜说：我叫安娜。很高兴认识您。
    note: 安娜也说出自己的姓名，并加上一句客套话。
  de.a1.unit02.lesson05.teach.line05:
    title: 费利克斯回应并询问她来自哪里
    gloss: 费利克斯说：我也很高兴。您来自哪里？
    note: 费利克斯回应这句客套话，接着把话题转向对方的来处。
  de.a1.unit02.lesson05.teach.line06:
    title: 安娜回答并反问对方
    gloss: 安娜说：我来自德国。您呢？
    note: 这里确认了安娜是德国人，也符合两人都住在一座德语城市并且是邻居的背景。
  de.a1.unit02.lesson05.teach.line07:
    title: 费利克斯回答
    gloss: 费利克斯说：我来自英格兰。
    note: 现在我们得知，费利克斯来自英格兰，是一位住在德国的邻居。
  de.a1.unit02.lesson05.teach.line08:
    title: 安娜道别
    gloss: 安娜说：再见！
    note: 这是第1单元学过的正式道别语，与他们继续使用 *Sie* 的正式语体相符。
  de.a1.unit02.lesson05.teach.line09:
    title: 费利克斯道别
    gloss: 费利克斯说：再见！
    note: 费利克斯用同样的方式结束对话，在整场偶遇中始终保持相同的语体。
  de.a1.unit02.lesson05.teach.steckbrief:
    title: 一张简短的书面资料卡
    gloss: 姓名：费利克斯。国家：英格兰。
    note: 这是一张简单的书面资料卡，列出了姓名和一项身份信息，也就是费利克斯之前在对话中口头提供的信息。
