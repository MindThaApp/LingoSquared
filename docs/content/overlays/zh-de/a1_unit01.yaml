teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: 你好／嗨
    note: '*Hallo*是一种随意、通用的问候语，一天中任何时候都可以使用，相当于中文里的“你好”或“嗨”。'
    example_gloss: 你好，Felix！
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: 早上好
    note: '*Guten Morgen*在早晨使用，一般可以用到临近中午时。'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: 日安／你好
    note: '*Guten Tag*是白天使用的标准问候语，略为正式，从上午较晚时到下午都可以使用。'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: 晚上好
    note: '*Guten Abend*用于晚上到达某处时打招呼，是问候语，不是告别语。'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: 再见
    note: '*Tschüss*是一种随意且非常常用的告别说法，适合对朋友和熟人使用。'
    example_gloss: 再见，回头见！
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: 再见（正式）
    note: '*Auf Wiedersehen*的字面意思是“直到我们再次见面”，是标准且较正式的告别语，适合对陌生人说或在职场等正式场合使用。'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: 回头见
    note: 如果预计不久后还会再见到对方，可以用*Bis bald*友好地告别。
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: 待会儿见
    note: 如果当天晚些时候还会再见到对方，可以使用*Bis später*。
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: 晚安
    note: '*Gute Nacht*用于对方准备睡觉或一天即将结束时。它与*Guten Abend*不同，是告别语而不是问候语。'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: 您／您们
    note: '*Sie*是正式的第二人称代词，即使出现在句中也要大写，用于称呼陌生人、长辈，或在正式及职场场合使用。中文通常用“您”表达敬意，但德语的这一正式称呼还会影响相关代词和动词形式。'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: 你／你们
    note: '*du*是非正式的第二人称代词，用于称呼朋友、家人和儿童。对陌生人使用*du*可能显得过于亲近，甚至不礼貌。'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: 您好吗？
    note: 这是询问对方近况的正式说法。*Ihnen*是与*Sie*这一正式称呼相对应的第二人称与格形式。
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: 最近怎么样？
    note: '*Wie geht''s*是*Wie geht es*的缩略形式，是日常询问熟人近况的非正式说法。'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: 很好，谢谢。
    note: 这是一种简单、中性的回答，无论使用正式还是非正式称呼都适用。
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: 非常好，谢谢。
    note: 这个回答比*Gut, danke.*显得更热情。
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: 您呢？
    note: 这是用正式称呼反问对方的说法，与*Sie*的称呼方式一致。
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: 你呢？
    note: 这是用非正式称呼反问对方的说法。*dir*是与*du*这一非正式称呼相对应的第二人称与格形式。
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: 谢谢
    note: '*Danke*此前已经出现在回答中，这里学习的是它单独使用时的含义。'
    example_gloss: 非常感谢！
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: 请／不客气
    note: '*Bitte*根据语境确实有两种常见含义：提出请求时表示“请”，回应感谢时表示“不客气”。具体含义由语境决定；这两种用法都完全符合标准德语。'
    example_gloss:
    - 请来一杯咖啡。
    - 非常乐意，不客气！
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: 打扰一下／对不起
    note: '*Entschuldigung*既可以用于礼貌地引起他人注意，也可以用于简短道歉。'
    example_gloss: 打扰一下，请问洗手间在哪里？
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: 没关系
    note: 这是一种随意、友好的回应，相当于中文里的“没关系”或“没问题”。
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: 不客气
    note: 与较简短的*Bitte*相比，这是表达“不客气”时更完整、更明确的说法。
  de.a1.unit01.lesson05.teach.line01:
    title: Anna向Felix问好
    gloss: Anna说：您好！
    note: Anna和Felix住在同一栋公寓楼里，这是两位邻居第一次见面。
  de.a1.unit01.lesson05.teach.line02:
    title: Felix回礼并询问她的近况
    gloss: Felix说：您好！您好吗？
    note: Felix使用正式的*Sie*称呼方式，因为两人刚刚认识。
  de.a1.unit01.lesson05.teach.line03:
    title: Anna回答并反问对方
    gloss: Anna说：谢谢，我很好。您呢？
    note: Anna回答后用正式称呼反问对方，与Felix使用的称呼方式一致。
  de.a1.unit01.lesson05.teach.line04:
    title: Felix回答
    gloss: Felix说：非常好，谢谢。
    note: 这个回答比简单的*Gut, danke.*稍显热情。
  de.a1.unit01.lesson05.teach.line05:
    title: Anna告别
    gloss: Anna说：再见！
    note: Anna使用较正式的告别语，与两人一直使用的*Sie*称呼方式一致。
  de.a1.unit01.lesson05.teach.line06:
    title: Felix告别并说回头见
    gloss: Felix说：再见，回头见！
    note: Felix将正式的告别语与“回头见”连用，与两人在初次见面时始终采用的*Sie*称呼方式一致。
