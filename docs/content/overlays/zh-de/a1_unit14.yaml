  de.a1.unit14.lesson01.teach.moegen_sie:
    title: Mögen Sie Kaffee?
    gloss: 您喜欢咖啡吗？
    note: 正式问句形式：*Mögen Sie...?*
  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: 我喜欢茶。
    note: '*ich mag* 的意思是“我喜欢”。'
    example_gloss: 在语境中：是的，我喜欢咖啡。
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: 我不喜欢咖啡。
    note: 在这个德语句型中，*nicht* 放在不喜欢的事物之后，而不是紧跟在 *ich* 后面。
    example_gloss: 在语境中：我不喜欢茶。
  de.a1.unit14.lesson01.teach.lieber:
    title: lieber
    gloss: 更喜欢
    note: '*lieber* 表示在多个选项中有所偏爱。'
    example_gloss: 在语境中：我更喜欢喝茶。
  de.a1.unit14.lesson01.teach.nehmen:
    title: Ich nehme Wasser.
    gloss: 我要水。
    note: 选择某样东西时，使用 *nehmen* 很自然。
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: 您要什么？
    note: 这是使用正式称呼 *Sie*、询问对方选择的问句；回答使用 *ich nehme*。
    example_gloss: 您要什么？我要水。
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: 但是
    note: '*aber* 用于连接形成对比的内容。'
    example_gloss: 在语境中：我喜欢咖啡，但更喜欢喝茶。
  de.a1.unit14.lesson02.teach.preference_text:
    title: Vorlieben im Cafe
    gloss: 咖啡馆里的偏好
    note: 这段短文对比了 Anna 和 Felix 的选择。
    example_gloss: 他要水。
  de.a1.unit14.lesson02.teach.line01:
    title: Felix 询问对方是否喜欢咖啡
