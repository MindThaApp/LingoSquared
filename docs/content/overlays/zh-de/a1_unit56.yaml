    title: Anna 有一只狗
    gloss: Anna：是的，我有一只狗。
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix 询问它长什么样
    gloss: Felix：它长什么样？
    note: 这里再次使用外貌单元学过的问句 *Wie sieht ... aus?*，不过现在问的是动物：wie sieht er aus?（它长什么样？）
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna 描述她的狗
    gloss: Anna：它有棕色的毛，而且个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: 用 er／ihn 指代动物
    gloss: 指代动物时，由名词的语法性别决定代词：der Hund 用 er，die Katze 用 sie。
    note: 德语代词与名词的语法性别一致：der Hund → er（第四格：ihn），die Katze → sie，das Tier → es。
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix 询问遛狗的事
    gloss: Felix：你每天都遛它吗？
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna 描述她的日常安排
    gloss: Anna：是的，我每天都遛它，还会给它喂食。
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix、Lena 和 Jonas 谈动物
    gloss: Felix 和 Lena 都喜欢动物，但他们俩都没有宠物。Felix 喜欢狗，Lena 喜欢猫。Jonas 确实有一只宠物：一只猫。他经常和自己的猫一起玩，而且每天都喂猫。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      lieben: 喜爱
      beide: 两者都
      Tiere: 动物
      beiden: 两者都
      Haustier: 宠物
      Hunde: 狗
      Katzen: 猫
      Katze: 猫
      spielt: 玩
      gibt: 给
      jeden: 每一
      Futter: 食物
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas 经常和他的猫一起玩
    gloss: Jonas 经常和他的猫一起玩。
    note: '*Oft* 通常紧跟在动词之后：Jonas spielt oft mit seiner Katze。'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
