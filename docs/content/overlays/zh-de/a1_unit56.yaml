    - Jonas 养了一只猫。
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: 这和你在前面单元学过的疑问句式 *Hast du ...?* 一样：动词放在句首。
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*Kein* 否定名词短语 *ein Haustier*：请参阅语法说明。'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: Kein：否定名词
    gloss: Kein 用于否定原本会带 ein- 的名词：Ich habe einen Hund 表示“我有一只狗”，而 Ich habe kein Haustier 表示“我没有宠物”。
    note: 在否定句中，*Kein* 取代 *ein*，并采用相同的词尾变化：ein Haustier 变为 kein Haustier，einen Hund 变为 keinen Hund。否定动词和形容词时则使用 *nicht*。
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: 遛（动物）
    gloss: 遛（动物）
    note: 这是一个可分动词——请参阅语法说明。
    example_gloss: 我每天遛狗。
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen 是可分动词
    gloss: Ausführen 和 aufstehen 一样是可分动词：ich führe den Hund aus。
    note: 这里沿用了日常活动类动词中学过的可分动词句式：词干位于前面，前缀放在句末。
  de.a1.unit56.lesson02.teach.futter_geben:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: 和……玩
    gloss: 和……玩
    example_gloss: Jonas 和他的猫一起玩。
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: 这里把 *ausführen* 和 *jeden Tag*（每天）结合起来使用。因为 Tag 是阳性名词，并在此处使用第四格，所以 *Jeden* 以 -en 结尾。
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: 这里把 *Futter geben* 和 *jeden Tag* 结合起来使用。表示动物的成分用第三格：der Katze（给猫）。
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 德语名词的复数形式各不相同：der Hund → die Hunde，die Katze → die Katzen，der Vogel → die Vögel。学习每个名词时要连同它的复数形式一起记。
    note: 这里首次以动物名词为例介绍德语名词的常见复数构成方式。
  de.a1.unit56.lesson03.teach.hunde_katzen:
