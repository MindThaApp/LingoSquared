teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Tier* 是“动物”的统称；*Haustier*（字面意思是“家养动物”）专指宠物。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
