  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna 问 Nina
    gloss: Anna：Nina，你也有宠物吗？
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Er heißt Pico* 再次使用了第一单元学过的表示名字的动词 *heißen*。Er 指代 der Vogel。'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix 作出回应
    gloss: Felix：真好！你每天会和它一起做什么？
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Felix 也喜欢鸟
    gloss: Felix：我也喜欢鸟。
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna 结束对话
