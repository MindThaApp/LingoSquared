  de.a1.unit09.lesson04.teach.line01:
    title: Felix 问路
    gloss: Felix 说：打扰一下，请问药店在哪里？
    note: 这里使用了与上方独立短语相同的礼貌开场语，现在把它放进了真实对话中。
  de.a1.unit09.lesson04.teach.line02:
    title: Anna 说明位置
    gloss: Anna 说：它在医院对面。
    note: 完整的回答会以一个熟悉的地标为参照，说明药店的位置。
  de.a1.unit09.lesson04.teach.line03:
    title: Felix 询问距离
    gloss: Felix 说：离这里远吗？
    note: 知道大致方向后，这是一句自然的追问。
  de.a1.unit09.lesson04.teach.line04:
    title: Anna 回答距离问题
    gloss: Anna 说：不，不远。它在银行和公园之间。
    note: 完整的回答先说明距离不远，再提供另一个更精确的地标。
