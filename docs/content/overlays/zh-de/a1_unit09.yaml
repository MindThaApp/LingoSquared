    title: Sie ist neben dem Park.
    gloss: 它在公园旁边。
    note: 这里的 *Sie* 表示“它”，指代阴性名词 *die Bank*。它大写只是因为位于句首。动词 *ist* 表明它不是正式称呼“您”；后者应搭配 *Sie sind*。
