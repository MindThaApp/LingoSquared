teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: 星期一
    note: 在德语国家，*Montag* 是一周的第一天；这也符合中国通常采用的星期顺序。
    example_gloss: 我星期一有时间。
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: 星期二
    note: '*Dienstag* 是一周的第二天。'
    example_gloss: 我星期二有时间。
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: 星期三
    note: '*Mittwoch* 的字面意思是“一周中间”；它确实位于德国工作周的中间。'
    example_gloss: 我星期三有时间。
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: 星期四
    note: '*Donnerstag* 得名于日耳曼神祇多纳尔（雷神托尔）。'
    example_gloss: 我星期四有时间。
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: 星期五
    note: '*Freitag* 得名于日耳曼女神弗丽嘉。'
    example_gloss: 我星期五有时间。
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: 星期六
    note: 在德国大部分地区，*Samstag* 是“星期六”的标准说法；*Sonnabend* 是德国北部和东部使用的地区性说法。
    example_gloss: 我星期六有时间。
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: 星期日
    note: '*Sonntag* 的字面意思是“太阳日”。'
    example_gloss: 我星期日有时间。
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: 今天星期几？
    note: '*heute* 的意思是“今天”；*Welcher Tag* 的意思是“哪一天”。'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: 一月
    note: '*Januar* 是一年中的第一个月。'
    example_gloss: 我的生日在一月。
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: 三月
    note: '*März* 是一年中的第三个月。'
    example_gloss: 我的生日在三月。
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: 五月
    note: '*Mai* 很短，容易记忆。'
    example_gloss: 我的生日在五月。
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: 七月
    note: '*Juli* 是一年中的第七个月。'
    example_gloss: 我的生日在七月。
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: 九月
    note: '*September* 表示“九月”。'
    example_gloss: 我的生日在九月。
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: 十二月
    note: '*Dezember* 是一年中的最后一个月。'
    example_gloss: 我的生日在十二月。
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: 现在是几月？
    note: '*Monat* 的意思是“月份”；*es* 的意思是“它”。'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: 今天是几号？
    note: 这是德语中询问日期的标准说法。
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: 今天是7月7日。
    note: 德语先说日期，再说月份：*der siebte Juli* 表示“七月七日”。请将 *der siebte Juli* 作为一个完整短语来学习。
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: 今天是星期二，7月7日。
    note: 在日期前加上星期几，并用逗号隔开。
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: 也可以写成7.7.。
    note: 德语的纯数字日期先写日，再写月，并在两者后面分别加句点：7.7. 表示7月7日。中文日期通常也按月、日顺序书写，因此要注意两者顺序相反。
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: 您的生日是什么时候？（正式）
    note: 德语用 *haben* 来表达“过生日”，字面结构相当于“有生日”。
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: 我的生日是3月3日。
    note: '*Mein Geburtstag* 的意思是“我的生日”；*der dritte März* 的意思是“3月3日”（先说日期，再说月份）。'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: 开门
    note: '*öffnet* 是 *öffnen*（打开、开门）的第三人称单数形式，用于表示商店或图书馆等“开门”。'
    example_gloss: 商店星期一开门。
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: 再次
    note: '*wieder* 的意思是“再次”，这里用于询问某处何时重新开放。'
    example_gloss: 图书馆星期一重新开放。
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: 这个／这些（阴性／复数定冠词）
    note: '*die* 是阴性单数名词和所有复数名词使用的定冠词；这里与阴性名词 *Bibliothek* 搭配。'
    example_gloss: 这座图书馆很大。
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: 图书馆
    note: '*Bibliothek* 是阴性名词（*die Bibliothek*）。'
    example_gloss: 我要去图书馆。
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: 在……时／于
    note: '*am* 是 *an dem* 的缩合形式，用在星期和日期前（*am Montag* 表示“在星期一”）。'
    example_gloss: 星期一我工作。
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: 这个（阳性宾格定冠词）
    note: '*den* 是 *der* 的阳性宾格形式。它会出现在星期几之后的完整日期中，例如 *am Donnerstag, den neunten Juli*。现阶段请将其作为固定句型来学习，不必分析格的变化。（在 *am* 后也会看到 *dem*，这同样正确。）'
    example_gloss: 我们约在7月9日星期四见面。
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: 第九
    note: '*neunten* 是 *neun*（九）的序数词变格形式，用于日期：在这个完整日期结构中，主格形式 *der neunte Juli* 变为 *den neunten Juli*。'
    example_gloss: 我的生日是7月9日。
  de.a1.unit04.lesson04.teach.line01:
    title: 费利克斯询问日期
    gloss: 费利克斯说：“今天是几号？”
  de.a1.unit04.lesson04.teach.line02:
    title: 安娜说出日期
    gloss: 安娜说：“今天是星期二，7月7日。”
  de.a1.unit04.lesson04.teach.line03:
    title: 费利克斯询问图书馆的情况
    gloss: 菲利克斯问：图书馆什么时候重新开放？
  de.a1.unit04.lesson04.teach.line04:
    title: 安娜回答
    gloss: 安娜说：7月9日星期四重新开放。
    note: 这里的 *Sie* 意为“它”，指代前文中的阴性名词 *die Bibliothek*。
  de.a1.unit04.lesson04.teach.line05:
    title: 菲利克斯道别
    gloss: 菲利克斯说：好的，星期四见。
    note: '*bis Donnerstag* 意为“到星期四”，是表达“星期四见”的常用说法。'
  de.a1.unit04.lesson04.teach.notiz:
    title: 门上的通知
    gloss: 关闭至7月9日星期四。
    note: '*Geschlossen* 意为“关闭”。'
