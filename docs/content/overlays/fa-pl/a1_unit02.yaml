teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: نقطه‌ی شروع همه‌ی اعدادی که در این واحد می‌آید.
    example_gloss: امروز صفر درجه است.
  pl.a1.unit02.lesson01.teach.jeden:
    title: یک
    gloss: یک
    note: '*Jeden* بعد از خودش اسم مفرد معمولی می‌گیرد، برخلاف همه‌ی اعداد دیگر این درس.'
    example_gloss: من یک تلفن دارم.
  pl.a1.unit02.lesson01.teach.dwa:
    title: دو
    gloss: دو
    note: '*Dwa*، *trzy* و *cztery* یک شکل جمع ویژه برای اسم می‌گیرند (مثل *psy* به معنی «سگ‌ها») -- که با شکل جمع بعد از *pięć* و بالاتر فرق دارد.'
    example_gloss: من دو سگ دارم.
  pl.a1.unit02.lesson01.teach.trzy:
    title: سه
    gloss: سه
    note: 'همان الگوی جمع *dwa*: *trzy złote* (سه زلوتی)، نه *trzy złotych*.'
    example_gloss: قهوه سه زلوتی است.
  pl.a1.unit02.lesson01.teach.cztery:
    title: چهار
    gloss: چهار
    note: آخرین عدد از سه عددی (*dwa*، *trzy*، *cztery*) که این الگوی جمع را دارند.
    example_gloss: من چهار کتاب دارم.
  pl.a1.unit02.lesson01.teach.piec:
    title: پنج
    gloss: پنج
    note: از *pięć* به بعد، اعداد شکل جمع دیگری از اسم می‌گیرند (حالت اضافی جمع، مثلاً *minut* به‌جای *minuty*) -- این الگو در بقیه‌ی این واحد ادامه دارد.
    example_gloss: من پنج دقیقه وقت دارم.
  pl.a1.unit02.lesson01.teach.szesc:
    title: شش
    gloss: شش
    note: 'همان الگوی حالت اضافی جمع *pięć*: *sześć jabłek* (شش سیب).'
    example_gloss: من شش تا سیب دارم.
  pl.a1.unit02.lesson01.teach.siedem:
    title: هفت
    gloss: هفت
    note: عددی کاربردی برای صحبت درباره‌ی روزهای هفته.
    example_gloss: هفته هفت روز دارد.
  pl.a1.unit02.lesson01.teach.osiem:
    title: هشت
    gloss: هشت
    note: '*Mam osiem lat* تحت‌اللفظی یعنی «هشت سال دارم» -- در لهستانی سن را با *mieć* («داشتن») می‌گویند، درست مثل فارسی. این الگو را در درس ۳ کامل تمرین می‌کنید.'
    example_gloss: من هشت سال دارم.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: نه
    gloss: نه
    note: 'باز هم حالت اضافی جمع: *dziewięć osób* (نه نفر).'
    example_gloss: نه نفر در صف منتظرند.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: ده
    gloss: ده
    note: آخرین عدد تک‌رقمی -- درس ۲ با اعداد یازده تا نوزده و دهگان‌ها ادامه پیدا می‌کند.
    example_gloss: من ده انگشت دارم.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: یازده
    gloss: یازده
    note: 'اعداد ۱۱ تا ۱۹ به *-naście* ختم می‌شوند. مثل *pięć* و بالاتر، حالت اضافی جمع می‌گیرند: *jedenaście osób*.'
    example_gloss: کلاس یازده نفر دارد.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: دوازده
    gloss: دوازده
    note: همان الگوی *-naście* مثل *jedenaście*.
    example_gloss: سال دوازده ماه دارد.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: پانزده
    gloss: پانزده
    note: 'هنوز همان الگوی *-naście*: *piętnaście minut* (پانزده دقیقه).'
    example_gloss: من پانزده دقیقه استراحت دارم.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: بیست
    gloss: بیست
    note: اعداد ۲۰ تا ۴۰ به *-dzieści* ختم می‌شوند -- الگویی متفاوت با *-naście*. خود *Dwadzieścia* هنوز حالت اضافی جمع می‌گیرد (*dwadzieścia lat*)، ولی در درس ۳ ببینید وقتی رقم یکان به آن اضافه شود چه می‌شود.
    example_gloss: من بیست سال دارم.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: بیست و یک
    gloss: بیست و یک
    note: 'عدد مرکب در لهستانی این‌طور ساخته می‌شود: اول دهگان، بعد یکان، بدون هیچ حرف ربطی؛ در فارسی بین آن‌ها «و» می‌آید.'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: سی
    gloss: سی
    note: هنوز همان الگوی *-dzieści* که در *dwadzieścia* دیدید.
    example_gloss: بلیت سی زلوتی است.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: پنجاه
    gloss: پنجاه
    note: اعداد ۵۰ تا ۹۰ به‌جای *-dzieści* الگوی سوم یعنی *-dziesiąt* را دارند.
    example_gloss: من پنجاه زلوتی دارم.
  pl.a1.unit02.lesson02.teach.sto:
    title: صد
    gloss: صد
    note: عددی گرد و ساده که پایان مرکب ندارد.
    example_gloss: این صد زلوتی است.
  pl.a1.unit02.lesson02.teach.ile:
    title: چقدر / چند تا
    gloss: چقدر؛ چند تا
    note: کلمه‌ی پرسشی برای پرسیدن درباره‌ی هر مقدار یا قیمت.
    example_gloss: این چقدر است؟
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: پرسیدن قیمت
    gloss: این چقدر است؟
    note: '*Kosztować* («قیمت داشتن») فعل است و *to* («این/آن») فاعل. کل این سؤال یک الگوی ثابت و بسیار رایج است.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: گفتن قیمت
    gloss: این بیست زلوتی است.
    note: '*Złotych* حالت اضافی جمع *złoty* (پول لهستان) است -- همان شکل جمعی که خود *dwadzieścia* می‌گیرد.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: پرسیدن شماره تلفن از یک مرد
    gloss: شماره تلفن شما چند است؟ (به یک مرد، رسمی)
    note: تحت‌اللفظی یعنی «شماره تلفن آقا چیست». *Pana* شکل مالکیت (حالت اضافی) *pan* است -- «مال آقا»، یعنی «مال شما».
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: پرسیدن شماره تلفن از یک زن
    gloss: شماره تلفن شما چند است؟ (به یک زن، رسمی)
    note: برای خطاب رسمی به یک زن، *pana* را با *pani* عوض کنید، مثل الگوی واحد ۱.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: پرسیدن شماره تلفن، خودمانی
    gloss: شماره تلفنت چند است؟ (خودمانی)
    note: '*Twój* («مال تو»، خودمانی) در صحبت با دوست یا هم‌سن‌وسال جای *pana*/*pani* می‌نشیند.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: شروع گفتن شماره
    gloss: شماره این است...
    note: جمله‌ی کوتاه و طبیعی پیش از خواندن تک‌تک ارقام -- روشی که لهستانی‌ها معمولاً شماره تلفن را بلند می‌گویند.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: یک شماره تلفن نمونه
    gloss: شش، یک، پنج، صفر، دو.
    note: شماره‌های تلفن در لهستانی رقم‌به‌رقم خوانده می‌شوند، همان‌طور که در فارسی هم می‌شود -- همه‌ی ارقام اینجا از اعدادی هستند که در همین واحد یاد گرفته‌اید.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: پرسیدن سن، خودمانی
    gloss: تو چند سالته؟ (صمیمی)
    note: تحت‌اللفظی یعنی «چند سال داری» -- در لهستانی سن را با *mieć* («داشتن») می‌گویند، مثل فارسی؛ همان الگویی که در کارت *osiem* دیدید.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: پرسیدن سن، رسمی
    gloss: چند سال دارید؟ (به یک مرد، رسمی)
    note: '*Ma* همان شکل سوم‌شخص فعل است که در واحد ۱ با *pan jest*/*pan ma* دیدید -- *pan* از نظر دستوری «آقا» است، یعنی فاعل سوم‌شخص.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: گفتن سن
    gloss: من بیست و هشت سال دارم.
    note: '*Mam* صورت اول‌شخص *mieć* («داشتن») است. *Dwadzieścia osiem* به *osiem* (هشت) ختم می‌شود، پس مثل هر عددی که به ۵ تا ۹ ختم شود *lat* می‌گیرد -- در دیالوگ درس ۳ به عددی با پایان دیگر دقت کنید.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa شماره‌ی Marek را می‌پرسد
    gloss: Ewa رسمی شماره تلفن Marek را می‌پرسد.
    note: دقیقاً همان سؤال رسمی شماره تلفن این درس را به کار می‌برد.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek شماره‌اش را می‌دهد
    gloss: Marek شماره تلفنش را رقم‌به‌رقم می‌خواند.
    note: همه‌ی ارقام اینجا را قبلاً در درس‌های ۱ و ۲ این واحد یاد گرفته‌اید.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa سن Marek را می‌پرسد
    gloss: Ewa تشکر می‌کند و رسمی سنش را می‌پرسد.
    note: '*Dziękuję* («متشکرم») و *A* («و») با سطح رسمیت تغییر نمی‌کنند، مثل کارت *dziękuję* در واحد ۱.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek سنش را می‌گوید و سؤال را برمی‌گرداند
    gloss: Marek می‌گوید بیست‌وهشت سال دارد و رسمی سن Ewa را می‌پرسد.
    note: '*A pani?* سؤال را رسمی به یک زن برمی‌گرداند، همان الگوی کوتاهی که واحد ۱ برای *A pan?* آموخت.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa سنش را می‌گوید
    gloss: Ewa می‌گوید سی‌ودو سال دارد.
    note: '*Trzydzieści dwa* به *dwa* (دو) ختم می‌شود، پس برخلاف *dwadzieścia osiem* (که به هشت ختم می‌شود و *lat* می‌گیرد)، این عدد *lata* می‌گیرد -- اعدادی که به ۲، ۳ یا ۴ ختم می‌شوند (به‌جز نوزده‌ها و همتایانش) از این شکل جمع متفاوت استفاده می‌کنند. این یک نکته‌ی دستوری واقعی است: *lat* و *lata* جای هم نمی‌نشینند و درست بودنشان به آخرین رقم عدد بستگی دارد.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek گفتگو را تمام می‌کند
    gloss: Marek می‌گوید صحبت کردن با او خوب بود و خداحافظی می‌کند.
    note: '*Do zobaczenia* همان خداحافظی «به امید دیدار» واحد ۱ است.'
