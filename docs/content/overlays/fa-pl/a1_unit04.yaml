teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: ساعت یک، دو، سه
    gloss: ساعت یک؛ ساعت دو؛ ساعت سه
    note: لهستانی ساعت را با عددهای ترتیبی مؤنث می‌گوید، چون با اسم مؤنثِ نگفته‌ی *godzina* (ساعت) هماهنگ است؛ *pierwsza* در واقع یعنی «ساعتِ اول».
    example_gloss:
    - ساعت یک است.
    - ساعت دو است.
    - ساعت سه است.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: ساعت چهار، پنج، شش
    gloss: ساعت چهار؛ ساعت پنج؛ ساعت شش
    note: همان الگوی ترتیبی مؤنث *pierwsza*، *druga*، *trzecia*.
    example_gloss:
    - ساعت چهار است.
    - ساعت پنج است.
    - ساعت شش است.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: ساعت هفت، هشت، نه
    gloss: ساعت هفت؛ ساعت هشت؛ ساعت نه
    note: سه ساعتِ میانیِ دوازده ساعت، با همان الگو.
    example_gloss:
    - ساعت هفت است.
    - ساعت هشت است.
    - ساعت نه است.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: ساعت ده، یازده، دوازده
    gloss: ساعت ده؛ ساعت یازده؛ ساعت دوازده
    note: سه ساعت آخر که مجموعه‌ی کامل ۱ تا ۱۲ را تمام می‌کنند.
    example_gloss:
    - ساعت ده است.
    - ساعت یازده است.
    - ساعت دوازده است.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: تحت‌اللفظی یعنی «کدام است ساعت؟». *która* با *godzina* که مؤنث است هماهنگ می‌شود؛ همین هماهنگی را در سراسر این درس می‌بینید.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: واژهٔ godzina مؤنث است
    gloss: می‌گوییم pierwsza، druga، trzecia، نه pierwszy، drugi، trzeci.
    note: '*Pierwszy*، *drugi* و *trzeci* شکل مذکر همین عددهای ترتیبی هستند و در جاهای دیگر زبان لهستانی برای اسم‌های مذکر به کار می‌روند؛ اما برای گفتن ساعت هرگز استفاده نمی‌شوند، چون *godzina* مؤنث است.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: صبح، ظهر، بعدازظهر
    gloss: صبح؛ ظهر؛ بعدازظهر
    note: '*Rano* تنها می‌آید (بدون حرف اضافه)؛ اما *w południe* و *po południu* هرکدام حرف اضافهٔ ثابت خودشان را دارند. بهتر است این سه تا را به‌صورت عبارت ثابت حفظ کنید، نه اینکه از روی یک قاعدهٔ کلی درستشان کنید.'
    example_gloss:
    - صبح‌ها قهوه می‌خورم.
    - من ظهر ناهار می‌خورم.
    - من بعدازظهرها کار می‌کنم.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: عصر، شب
    gloss: عصر؛ شب
    note: '*Wieczorem* یک قید ثابت است (حرف اضافه نمی‌خواهد)؛ *w nocy* حرف اضافهٔ *w* را با حالت مکانی واژهٔ *noc* (شب) به کار می‌برد.'
    example_gloss:
    - عصرها تلویزیون تماشا می‌کنم.
    - شب می‌خوابم.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: پرسیدن ساعتِ یک کار
    gloss: چه ساعتی؟
    note: وقتی می‌خواهید بپرسید یک اتفاق چه ساعتی می‌افتد، نه اینکه الان ساعت چند است، این را به جای *Która jest godzina?* به کار ببرید.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: گفتن «در ساعت …»
    gloss: ساعت چهار، هفت، ده -- ولی در ساعت چهار، در ساعت هفت، در ساعت ده.
    note: 'بعد از *o* («در ساعت»)، پایانهٔ *-a* واژهٔ ساعت به *-ej* تبدیل می‌شود: *czwarta* ← *o czwartej*، *siódma* ← *o siódmej*، *dziesiąta* ← *o dziesiątej*. همهٔ ساعت‌ها از همین الگو پیروی می‌کنند؛ فقط در املا یک استثنا هست: *druga* ← *o drugiej* که بعد از *g* یک *i* اضافه می‌شود.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: اوا زود بیدار می‌شود
    gloss: اوا ساعت ۷ صبح بیدار می‌شود.
    note: '*Wstaje* سوم‌شخص مفرد فعل *wstawać* (بیدار شدن، بلند شدن) است.'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: ساعت حرکت قطار
    gloss: قطار ساعت ۴ بعدازظهر حرکت می‌کند.
    note: '*Odjeżdża* سوم‌شخص مفرد فعل *odjeżdżać* (حرکت کردن، راه افتادن) است.'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: قرار ملاقات
    gloss: جلسه
    note: همان واژه‌ای که در درس ۳ دیدید (*Kiedy jest spotkanie?*)، وقتی اوا و مارک دربارهٔ روز و تاریخ یک قرار دوباره توافق کردند.
    example_gloss: قرار ملاقات جمعه است.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: پرسیدن ساعت قرار
    gloss: جمعه، پانزدهم ماه مه، چه ساعتی می‌توانیم همدیگر را ببینیم؟
    note: '*o której godzinie* همین درس را با روز و تاریخ درس ۳ ترکیب می‌کند؛ اوا و مارک قبلاً روی جمعه، پانزدهم ماه مه توافق کرده‌اند و حالا باید ساعت دقیق را مشخص کنند.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: پیشنهاد ساعت
    gloss: شاید ساعت ۴ بعدازظهر؟
    note: '*Może* به‌تنهایی یعنی «شاید»؛ راهی طبیعی و ملایم برای پیشنهاد دادن یک ساعت.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: تأیید مناسب بودن ساعت
    gloss: ساعت ۴ بعدازظهر برای من خوب است.
    note: 'همان الگوی *[time] + mi + odpowiada* است که در درس ۳ در *Piątek mi odpowiada* دیدید: خود زمان فاعل جمله است و فعل *odpowiadać* همیشه شخص را در حالت مفعول غیرمستقیم می‌گیرد (*mi*، یعنی «برای من»).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: تأیید برنامهٔ کامل
    gloss: پانزدهم ماه مه ساعت ۴ می‌بینمتان!
    note: خداحافظیِ *Do zobaczenia* از درس ۱ این‌جا همراه با تاریخ و ساعت به کار رفته است.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: اوا ساعت را می‌پرسد
    gloss: اوا از مارک می‌پرسد جمعه، پانزدهم ماه مه، چه ساعتی می‌توانند همدیگر را ببینند.
    note: دقیقاً همان سؤال ابتدای این درس است.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: مارک ساعت ۴ بعدازظهر را پیشنهاد می‌دهد
    gloss: مارک ساعت ۴ بعدازظهر را پیشنهاد می‌دهد.
    note: یک پیشنهاد ملایم است، نه یک جملهٔ قطعی؛ *może* همین را نشان می‌دهد.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: اوا قبول می‌کند
    gloss: اوا می‌گوید ساعت ۴ بعدازظهر برایش خوب است.
    note: همان ساختار دَتیو در گفتگوی «جمعه برای من خوب است» درس ۳.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: مارک برنامه را نهایی می‌کند
    gloss: مارک می‌گوید عالی، پانزدهم ماه مه ساعت ۴ می‌بینمت!
    note: '*Świetnie* همان عبارت ابراز شادی درس ۳ است.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: اوا خداحافظی می‌کند
    gloss: اوا هم خداحافظی می‌کند.
    note: کوتاه‌ترین پایان ممکن؛ فقط خود خداحافظی.
