teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *czytać* (کتاب خوندن)، *uprawiać sport* (ورزش کردن) و *gotować* (آشپزی کردن).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Wolny czas* عبارت کلیدی برای حرف زدن درباره‌ی سرگرمی‌هاست. صفت *wolny* (آزاد) با اسم مذکر *czas* هماهنگ می‌شه؛ در *w wolnym czasie* هر دو در حالت مکانی هستن.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: 'بعد از *lubię* (دوست دارم) مصدر میاد: *lubię czytać*. در *W wolnym czasie* از *w* + حالت مکانی استفاده شده.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگه: *słuchać muzyki* (به موسیقی گوش دادن)، *rysować* (نقاشی کشیدن) و *grać w gry* (بازی کردن).'
    example_gloss:
    - دوست دارم موسیقی گوش بدم.
    - اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم موسیقی گوش بدم.
    note: '*Słuchać* همیشه حالت ملکی می‌گیره: *słucham muzyki* و نه *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Z przyjaciółmi* (با دوستان) از *z* + حالت ابزاریِ جمع استفاده می‌کنه.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید بسامد اصلی: *zawsze*، *często*، *czasami*، *nigdy*. این‌ها هیچ‌وقت تغییر نمی‌کنن و *nigdy* قبل از فعل به *nie* نیاز داره: *Nigdy nie gram.*'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Co tydzień* و *co weekend* هر دو یعنی «هر ...»؛ بعد از *co* حالت مفعولی میاد و خود co هیچ‌وقت تغییر نمی‌کنه - کارت بعدی رو ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - هر آخر هفته ورزش می‌کنم.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + حالت مفعولی
    gloss: '*Co* + حالت مفعولی یعنی «هر»: هر هفته، هر آخر هفته، هر ماه.'
    note: '*Co* برای «هر» یک واژه‌ی ثابته، هر اسمی که باشه. اسم‌های مذکر بی‌جان مثل *tydzień*، *weekend* و *miesiąc* در حالت نهادی و مفعولی یک شکل دارن.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی اوقات فراغتت چه کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: اوا از سرگرمی‌ها حرف می‌زنه
    gloss: 'اوا: ما اغلب با هم قدم می‌زنیم. ولی تو در اوقات فراغتت دیگه چه کار می‌کنی، مارک؟'
    note: '*Spacerujemy* شکل *my* (ما) از *spacerować* است؛ *Marku* حالت ندا است که وقتی مستقیم صدا می‌زنید به کار می‌ره.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: سرگرمی‌های مارک
    gloss: 'مارک: من آشپزی رو دوست دارم، توی خونه هم. و اغلب ورزش می‌کنم.'
    note: '*Także w domu* (توی خونه هم) نشون می‌ده مارک از سر علاقه آشپزی می‌کنه، نه فقط برای کارش در رستوران؛ *w domu* حالت مکانی است.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: اوا تعجب می‌کنه
    gloss: 'اوا: توی خونه هم آشپزی می‌کنی؟ تو که تمام روز سر کار آشپزی می‌کنی!'
    note: '*Cały dzień* (تمام روز) تأکید می‌کنه که مارک سر کار هم کلی آشپزی می‌کنه؛ *przecież* معنی «آخه، مگه نه» می‌ده.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: مارک توضیح می‌ده
    gloss: 'مارک: آره، ولی آشپزی منو آروم می‌کنه. تو چی، تو چه کاری رو دوست داری؟'
    note: '*Gotowanie mnie odpręża* تحت‌اللفظی یعنی «آشپزی مرا آرام می‌کند»: در لهستانی اغلب خودِ فعالیت نهاد جمله می‌شه و *mnie* (من) در حالت مفعولی میاد.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: سرگرمی‌های اوا
    gloss: 'اوا: من خوندن رو دوست دارم و اغلب به موسیقی گوش می‌دم.'
    note: دو فعل سرگرمی از درس اول و دوم با *i* (و) در یک جمله کنار هم اومدن.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: مارک درباره‌ی بازی می‌پرسه
    gloss: 'مارک: تو بازی هم می‌کنی؟'
    note: یک سؤال کوتاه بله/خیر با *grać w gry* از درس دوم؛ *też* یعنی «هم».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: اوا جواب می‌ده
    gloss: 'اوا: نه، من هیچ‌وقت بازی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Nigdy* (هیچ‌وقت) و *czasami* (گاهی) از درس سوم، در یک جواب کنار هم. به نفی مضاعف توجه کنید: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: مقایسهٔ سرگرمی‌ها
    gloss: مارک و من اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگه‌ای هم داریم. مارک آشپزی رو دوست داره، توی خونه هم، و اغلب ورزش می‌کنه. من خوندن رو دوست دارم و اغلب به موسیقی گوش می‌دم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی نمی‌کنم. شما در اوقات فراغتتون دوست دارید چه کار کنید؟
    note: پیام اوا مطالب درس‌های قبل رو مرور می‌کنه و با پرسش اصلی این واحد به پایان می‌رسه.
    glosses:
      spacerujemy: قدم می‌زنیم
      często: اغلب
      razem: با هم
      inne: دیگر
      gotować: آشپزی می‌کند
      lubi: دوست دارد
      domu: توی خانه
      uprawia: ورزش می‌کند
      czytać: بخوانم
      słucham: گوش می‌دهم
      muzyki: موسیقی
      rysuję: نقاشی می‌کشم
      czasami: گاهی
      gram: بازی ویدیویی می‌کنم
      nigdy: هیچ‌وقت
      wolnym: آزاد
      czasie: وقت
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: مارک درباره‌ی آخر هفته می‌پرسه
    gloss: 'مارک: این آخر هفته چه کار می‌کنی؟'
    note: '*W ten weekend* (این آخر هفته) برای بیان زمان از *w* + حالت مفعولی استفاده می‌کنه.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: اوا هنوز تصمیم نگرفته
    gloss: 'اوا: هنوز نمی‌دونم. خوندن رو دوست دارم، ولی می‌خوام بیرون هم برم.'
    note: '*Wyjść na dwór* (رفتن بیرون) راه رایجی برای گفتن اینه که می‌خواید از خونه بیرون برید؛ *chcę* + مصدر یعنی «می‌خوام».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: مارک یک برنامه پیشنهاد می‌ده
    gloss: 'مارک: با هم بریم قدم بزنیم؟ بعدش برای ما یه چیزی می‌پزم.'
    note: '*Potem* (بعدش) واژه‌ی ترتیب است؛ *ugotuję* شکل کامل است، چون آشپزی یک نتیجه‌ی تمام‌شده است.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: اوا موافقت می‌کنه
    gloss: 'اوا: ایده‌ی خوبیه! هم قدم زدن رو دوست دارم هم آشپزی.'
    note: '*Lubię i ..., i ...* («هم ... هم ...») نشون می‌ده اوا دو کار رو به یک اندازه دوست داره، نه یکی رو بیشتر.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: مارک قطعی می‌کنه
    gloss: 'مارک: عالی. پس شنبه می‌بینمت!'
    note: یک جمله‌ی دوستانه برای پایان که برنامه‌ی شنبه رو تأیید می‌کنه؛ *w sobotę* یعنی *w* + حالت مفعولی برای روز هفته.
