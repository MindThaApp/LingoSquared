answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: لهستانی A1
  description: یاد می‌گیرید در زبان لهستانی سلام و احوال‌پرسی کنید، خودتان را معرفی کنید و اطلاعات اولیهٔ شخصی را رد و بدل کنید. در این درس به تفاوت رسمی و غیررسمی بین pan، pani و ty، هماهنگی پایان فعل‌ها و انتخاب لحن مناسب توجه ویژه می‌شود.
units:
  pl.a1.unit01.greetings:
    title: سلام و احوال‌پرسی و اولین دیدارها
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'پان، پانی و تی: چطور حال کسی را بپرسیم'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: سلام و خداحافظی در ساعت‌های مختلف روز
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: اسم، نام خانوادگی و اهل کجا بودن
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: خطاب رسمی به یک آقا
    gloss: آقا؛ جناب (خطاب رسمی به آقایان)
    note: 'در لهستانی هم مثل فارسی بین خطاب رسمی و صمیمی فرق هست. *pan* را برای آقایی به کار می‌برید که نمی‌شناسید یا باید به او احترام بگذارید. از نظر دستوری، *pan* مثل فاعل سوم‌شخص رفتار می‌کند: «pan jest» در اصل یعنی «آقا هستند»، نه یک شکل واقعی دوم‌شخص، هرچند معنایش «شما هستید» است.'
  pl.a1.unit01.lesson01.teach.pani:
    title: خطاب رسمی به یک خانم
    gloss: خانم (خطاب رسمی به خانم‌ها)
    note: شکل مؤنث *pan*. *pani* را برای خانمی به کار می‌برید که نمی‌شناسید یا باید به او احترام بگذارید. هر خانم بزرگسالی را، چه متأهل چه مجرد، *pani* خطاب می‌کنند؛ در گفتار روزمرهٔ لهستانی فرقی بین این دو نیست.
  pl.a1.unit01.lesson01.teach.ty:
    title: «تو» به شکل صمیمی
    gloss: تو (صمیمی، مفرد)
    note: '*Ty* را برای یک دوست، هم‌سن‌وسال، عضو خانواده، بچه یا هر کسی که با او رابطهٔ صمیمی دارید به کار می‌برید. برخلاف *pan* و *pani*، فعلِ *ty* پایان واقعی دوم‌شخص می‌گیرد، مثلاً *masz* («داری/هستی»)، نه پایان سوم‌شخص.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: احوال‌پرسی رسمی با یک آقا
    gloss: حال شما چطور است؟ (به آقا، رسمی)
    note: تحت‌اللفظی یعنی «آقا چطور هستند». *Ma* شکل سوم‌شخص فعل است (هماهنگ با *pan* به عنوان فاعل) و همان پایانی است که برای *on* («او») هم به کار می‌رود.
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: احوال‌پرسی رسمی با یک خانم
    gloss: حال شما چطور است؟ (به خانم، رسمی)
    note: همان الگوی *Jak się pan ma?* است، فقط به جای *pan* کلمهٔ *pani* می‌آید. شکل فعل یعنی *ma* عوض نمی‌شود؛ جنسیت مخاطب روی آن اثری ندارد.
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: پرسیدن حال به شکل صمیمی
    gloss: چطوری؟ / حالت چطوره؟ (دوستانه)
    note: با *ty*، فعل پایان واقعی دوم‌شخص یعنی *masz* می‌گیرد، نه *ma*. شکل رسمی *Jak się pan/pani ma?* را با شکل صمیمی *Jak się masz?* مقایسه کنید؛ این بهترین جفت برای شنیدن تفاوت pan/pani و ty در خود فعل است.
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: یک پاسخ معمول
    gloss: خوبم، ممنون.
    note: '*Dziękuję* («ممنون») با لحن عوض نمی‌شود؛ چه جواب *pan* را بدهید، چه *pani* و چه *ty*، همین کلمه است. فقط خودِ سؤال رسمی یا صمیمی بودن را نشان می‌دهد.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: برگرداندن سؤال به شکل رسمی
    gloss: و شما؟ (به آقا، رسمی)
    note: روشی کوتاه برای برگرداندن سؤال به آقایی که رسمی با او صحبت می‌کنید. اگر مخاطب خانم است، *pan* را با *pani* عوض کنید («A pani?»).
  pl.a1.unit01.lesson01.teach.a_ty:
    title: برگرداندن سؤال به شکل صمیمی
    gloss: تو چطوری؟ (خودمانی)
    note: برای برگرداندن سؤال به دوست یا هم‌سن‌وسال از *ty* استفاده کنید.
  pl.a1.unit01.lesson02.teach.czesc:
    title: سلام و خداحافظی صمیمی
    gloss: سلام؛ خداحافظ (صمیمی، برای هر دو)
    note: در فارسی برای سلام و خداحافظی دو کلمهٔ جدا داریم، ولی *Cześć* در لهستانی هر دو معنی را در لحن صمیمی می‌دهد. فقط در رابطه‌هایی به کار می‌رود که با *ty* صحبت می‌کنید، نه با *pan* و *pani*.
    example_gloss: سلام، حالت چطوره؟
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: سلام در تمام طول روز
    gloss: صبح بخیر؛ روز بخیر
    note: '*Dzień dobry* تا قبل از عصر در هر زمانی به کار می‌رود و برخلاف *cześć* از نظر لحن خنثی است؛ با *pan*، *pani* و *ty* هر سه می‌شود گفتش. برای کسی که خوب نمی‌شناسید، امن‌ترین سلام است.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: سلام عصرگاهی
    gloss: عصر بخیر
    note: وقتی هوا شب شد، جای *dzień dobry* را می‌گیرد. از نظر لحن خنثی است.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: خداحافظی شبانه
    gloss: شب بخیر
    note: برخلاف *dzień dobry* و *dobry wieczór*، *dobranoc* سلام نیست بلکه خداحافظی است؛ وقتی کسی برای شب می‌رود یا می‌خوابد می‌گویید، نه برای شروع صحبت.
    example_gloss: شب بخیر، پیوتر!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: خداحافظی معمول
    gloss: خداحافظ
    note: روش خنثی و بی‌خطر برای خداحافظی است و با *pan*، *pani* و *ty* می‌شود گفتش. نسبت به *do zobaczenia* حالت قطعی‌تری دارد.
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: خداحافظی با امید به دیدار
    gloss: می‌بینمت
    note: تحت‌اللفظی یعنی «تا دیدن [همدیگر]». نشان می‌دهد انتظار دارید دوباره همدیگر را ببینید، برخلاف *do widzenia* که خنثی‌تر است.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: آرزوی مؤدبانه هنگام خداحافظی
    gloss: روز خوبی داشته باشید!
    note: '*Miłego dnia* در این آرزو حالت اضافی (ملکی) دارد، مثل *smacznego* («نوش جان»). این یک ساختار ثابت است و بهتر است کل عبارت را یاد بگیرید، نه اینکه در این مرحله حالتش را تجزیه کنید.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: پرسیدن اسم، رسمی
    gloss: اسم شما چیست؟ (به آقا، رسمی)
    note: تحت‌اللفظی یعنی «آقا خودشان را چه می‌نامند». *nazywać się* فعل بازتابی و به معنی «نامیده شدن» است. اگر مخاطب خانم است، *pan* را با *pani* عوض کنید.
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: پرسیدن اسم کوچک، صمیمی
    gloss: اسمت چیه؟ (اسم کوچک)
    note: 'از اصطلاح دیگری استفاده می‌کند: *mieć na imię* («اسم کوچکِ ... را داشتن») و مشخصاً اسم کوچک را می‌پرسد، نه اسم کامل یا نام خانوادگی. این روش طبیعی و صمیمی برای پرسیدن اسم هم‌سن‌وسال است.'
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: گفتن اسم کامل
    gloss: اسم من آنا کوالسکا است.
    note: شکل اول‌شخص *nazywać się* است که معمولاً اسم کوچک و نام خانوادگی با هم بعد از آن می‌آید؛ روش رسمی‌تر و کامل‌تر برای معرفی خود.
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: گفتن اسم کوچک
    gloss: اسم من آنا است.
    note: شکل اول‌شخص *mieć na imię* است که معمولاً فقط اسم کوچک بعد از آن می‌آید؛ معادل صمیمی‌تر *Nazywam się...*.
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: ابراز خوشحالی از آشنایی
    gloss: از آشنایی با شما خوشحالم.
    note: عبارتی ثابت و پرکاربرد هنگام آشنایی که هم در موقعیت رسمی و هم صمیمی مناسب است.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: پرسیدن اهل کجا بودن، صمیمی
    gloss: شما اهل کجایید؟
    note: '*Skąd* یعنی «از کجا». اینجا شکل صمیمی با *ty* آمده است؛ شکل رسمی آن، *Skąd pan/pani jest?*، در گفت‌وگوی پایانی همین درس می‌آید.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: گفتن اهل کجا بودن
    gloss: من اهل کانادا هستم.
    note: '*Z* («از») بعد از خود حالت اضافی می‌گیرد، برای همین *Kanada* می‌شود *Kanady*. بیشتر اسم کشورها بعد از *z* همین الگو را دارند.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: گفتن محل زندگی
    gloss: من در ورشو زندگی می‌کنم.
    note: '*W* («در») اینجا حالت مکانی می‌گیرد، برای همین *Warszawa* می‌شود *Warszawie*. مبدأ (با *z*) و محل زندگی فعلی (با *w*) حالت‌های متفاوتی برای اسم مکان می‌خواهند؛ بهتر است این را یک الگو ببینید، نه یک استثنا که باید حفظ شود.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: شروع آشنایی
    gloss: اوا به مارک سلام می‌کند و رسمی اسمش را می‌پرسد.
    note: اوا با کسی که تازه می‌شناسد از *pan* رسمی استفاده می‌کند؛ انتخاب امن برای اولین برخورد کاری یا با غریبه.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: شروع آشنایی، پاسخ
    gloss: مارک اسم کاملش را می‌گوید و می‌گوید از آشنایی خوشحال است.
    note: '*Nazywam się* همراه با اسم کامل، پاسخ طبیعی و کامل به سؤال رسمیِ اسم است.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: پرسیدن دربارهٔ اصالت
    gloss: اوا هم اظهار خوشحالی می‌کند و رسمی می‌پرسد مارک اهل کجاست.
    note: '*Skąd pan jest?* که معادل رسمی *Skąd jesteś?* همین درس است، از *jest* استفاده می‌کند؛ همان الگوی سوم‌شخصی که قبلاً در *pan jest* و *pan ma* دیدید.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: پرسیدن دربارهٔ اصالت، پاسخ
    gloss: مارک می‌گوید اهل کاناداست ولی در ورشو زندگی می‌کند.
    note: '*Ale* («ولی») تضاد بین محل اصلی مارک و محل زندگی فعلی‌اش را به هم وصل می‌کند؛ همان تفاوتی که *jestem z* و *mieszkam w* نشان می‌دهند.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: پرسیدن دربارهٔ توانایی زبانی
    gloss: اوا رسمی می‌پرسد مارک لهستانی صحبت می‌کند یا نه.
    note: '*Czy* مثل «آیا» در فارسی، سؤال بله/خیری را شروع می‌کند. در لهستانی فعل کمکی اضافه نمی‌شود؛ خود *czy* نشان می‌دهد که جمله سؤالی است.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: پرسیدن دربارهٔ زبان، جواب و پایان صحبت
    gloss: مارک می‌گوید کمی صحبت می‌کند و هنوز در حال یادگیری است، بعد خداحافظی می‌کند.
    note: '*Jeszcze się uczę* («هنوز دارم یاد می‌گیرم») روشی طبیعی و فروتنانه برای گفتن از تلاشی مداوم است؛ شما هم به‌عنوان زبان‌آموز می‌توانید دربارهٔ خودتان بگویید.'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: کدام کلمه برای خطاب رسمی و محترمانه به یک آقا به کار می‌رود؟
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: Pan برای خطاب رسمی به آقا به کار می‌رود و فعل سوم‌شخص می‌گیرد.
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: کدام کلمه برای خطاب رسمی و محترمانه به یک خانم به کار می‌رود؟
    correct_option: pani
    distractors:
    - pan
    - ty
    accepted_answers:
    - pani
    feedback: Pani برای خطاب رسمی به خانم به کار می‌رود و مثل pan فعل سوم‌شخص می‌گیرد.
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: کدام کلمه برای خطاب صمیمی به یک دوست یا هم‌سن‌وسال است؟
    correct_option: ty
    distractors:
    - pan
    - pani
    accepted_answers:
    - ty
    feedback: Ty با دوستان، هم‌سن‌وسال‌ها و در رابطه‌های صمیمی به کار می‌رود و پایان واقعی دوم‌شخص می‌گیرد.
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: سؤال رسمی احوال‌پرسی (به آقا) را مرتب کنید.
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: سؤال صمیمی احوال‌پرسی را مرتب کنید.
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: سؤال را با حفظ لحن محترمانه برگردانید.
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan? یا A pani? هنگام برگرداندن سؤال لحن رسمی را حفظ می‌کند.
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: سؤال را به یک دوست یا هم‌سن‌وسال برگردانید.
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty? روش صمیمی برگرداندن سؤال است.
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: سؤال صمیمی را درست کنید؛ در آن ty با پایان نادرست فعل آمده است.
    accepted_answers:
    - Jak się masz?
    - Jak się masz
    - Jak ty się masz?
    - Jak się ty masz?
    feedback: Ty پایان masz می‌گیرد، نه ma؛ ma فقط با pan/pani (یا on/ona) به کار می‌رود.
  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: مؤدبانه به پرسش جواب بدهید.
    accepted_answers:
    - Dobrze, dziękuję.
    - Dobrze, dziękuję
    - Dziękuję, dobrze.
    - Dobrze, dziękuję. A pan?
    - Dziękuję, dobrze. A pan?
    - Dobrze, dziękuję. A pani?
    - Dziękuję, dobrze. A pani?
  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: صمیمی جواب بدهید، تشکر کنید و همان پرسش را برگردانید.
    accepted_answers:
    - Dobrze, dziękuję. A ty?
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję. A ty
