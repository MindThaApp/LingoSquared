teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: بلند شدن، بلند می‌شوم
    gloss: بلند شدن (از خواب)؛ بلند می‌شوم
    note: Wstawać مصدر است؛ wstaję شکل رایجِ «من» است که برای گفتن از برنامه‌ی روزانه‌ی خودتان به کار می‌برید.
    example_gloss: ساعت هفت صبح بلند می‌شوم.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: خوردن، می‌خورم
    gloss: خوردن؛ می‌خورم
    note: Jeść کمی بی‌قاعده است، اما jem («می‌خورم») شکلی است که بیشتر به کار می‌برید -- لهستانی‌ها دقیقاً همین را برای هر وعده‌ی غذایی می‌گویند.
    example_gloss: صبح‌ها صبحانه می‌خورم.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: صبحانه
    gloss: صبحانه
    note: Śniadanie بعد از jem تغییر نمی‌کند -- «صبحانه می‌خورم» فقط jem śniadanie است و پایانه‌ی اضافه‌ای برای یاد گرفتن نیست.
    example_gloss: صبح صبحانه می‌خورم.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: نوشیدن، می‌نوشم
    gloss: نوشیدن؛ می‌نوشم
    note: Pić مصدر است؛ piję شکل «من» است و مثل jem و wstaję به کار می‌رود.
    example_gloss: من صبح‌ها قهوه می‌خورم.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: حرف زدن درباره‌ی خودتان
    gloss: Wstaję, jem, piję -- در این درس فقط درباره‌ی خودمان حرف می‌زنیم، با شخص اول (من)، درست مثل وقتی که روز خودتان را توصیف می‌کنید.
    note: این درس عمداً فقط سراغ شکل «من» هر فعل می‌رود -- *wstaję* (بلند می‌شوم)، *jem* (می‌خورم)، *piję* (می‌نوشم) -- تا بتوانید روی توصیف برنامه‌ی روزانه‌ی خودتان تمرکز کنید و لازم نباشد هم‌زمان یاد بگیرید هر فعل برای «تو»، «او (مرد)» یا «او (زن)» چطور عوض می‌شود.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: ساعت هفت صبح بلند می‌شوم
    gloss: ساعت هفت صبح بلند می‌شوم.
    note: 'الگوی نکته‌ی دستوری در عمل: o به‌همراه شکل مکانی (حالت اضافی) ساعت، یعنی siódmej، معنی «در ساعت…» می‌دهد، دقیقاً مثل درس قبلی درباره‌ی زمان.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: صبحانه می‌خورم و قهوه می‌نوشم
    gloss: صبحانه می‌خورم و قهوه می‌نوشم.
    note: دو فعل اول‌شخص که با i (و) به هم وصل شده‌اند؛ راه طبیعی برای گفتنِ کارهای صبحِ خودتان.
  pl.a1.unit10.lesson02.teach.obiad:
    title: ناهار
    gloss: ناهار / وعده‌ی غذایی نیمروز
    note: مثل śniadanie، کلمه‌ی obiad هم بعد از jem شکلش عوض نمی‌شود؛ jem obiad یعنی «ناهار می‌خورم».
    example_gloss: ظهر ناهار می‌خورم.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: کار کردن، کار می‌کنم
    gloss: کار کردن؛ کار می‌کنم
    note: Pracować همان الگوی -ować ← -uję را دارد که در درس خرید در kosztować ← kosztuje دیدید، فقط این بار برای اول‌شخص.
    example_gloss: من بعدازظهرها کار می‌کنم.
  pl.a1.unit10.lesson02.teach.dom:
    title: خانه
    gloss: خانه
    note: کلمه‌ی روزمره برای خانه؛ در عبارت «به خانه رفتن/آمدن» دائم به کار می‌رود.
    example_gloss: خانه آن‌جاست.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: به خانه
    gloss: 'به خانه؛ بعد از do حالت اضافی می‌آید و حالت اضافیِ dom با -u تمام می‌شود: domu، دقیقاً مثل bank ← banku، park ← parku، hotel ← hotelu.'
    note: '*Do domu* («به خانه»، مثل «دارم به خانه می‌روم») همان پایانه‌ی *-u* حالت اضافی را دارد که بعد از *do* با bank، hotel و park یاد گرفته‌اید؛ یک اسم دیگر با همان الگو.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: برگشتن، برمی‌گردم
    gloss: برگشتن؛ برمی‌گردم
    note: با do domu می‌گویید «به خانه می‌روم» یا «به خانه برمی‌گردم»؛ یکی از پرکاربردترین عبارت‌های روزمره‌ی لهستانی.
    example_gloss: عصر به خانه برمی‌گردم.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: ظهر، بعدازظهر، عصر
    gloss: ظهر؛ بعدازظهر؛ عصر
    note: 'مرور درس قبلی درباره‌ی زمان: این عبارت‌ها همراه با rano و w nocy تمام شبانه‌روز را پوشش می‌دهند.'
    example_gloss:
    - ظهر ناهار می‌خورم.
    - من بعدازظهرها کار می‌کنم.
    - عصر به خانه برمی‌گردم.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: بعدازظهر کار می‌کنم، بعد به خانه برمی‌گردم
    gloss: بعدازظهر کار می‌کنم، بعد به خانه برمی‌گردم.
    note: همان الگوی ویرگول + potem از درس مسیرها، این بار برای وصل کردن دو بخش از برنامه‌ی روزانه.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: خوابیدن، می‌خوابم
    gloss: خوابیدن؛ می‌خوابم
    note: در śpię صدای واکه نسبت به مصدر spać تغییر کرده و بی‌قاعده به نظر می‌رسد، ولی فعلی بسیار پرکاربرد است و بهتر است همان‌طور که هست حفظش کنید.
    example_gloss: من شب‌ها می‌خوابم.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: تو چی؟ من هم.
    gloss: تو چی؟ / من هم.
    note: A ty? ساده‌ترین راه برای پس دادنِ حرف به طرف مقابل است؛ ja też یعنی «من هم» و هر دو در گفت‌وگوهای روزمره مدام به کار می‌روند.
    example_gloss: من هم صبح صبحانه می‌خورم.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: اما، چای، نه
    gloss: اما؛ چای (در نقش مفعول)؛ نه
    note: Ale تضاد می‌آورد؛ وقتی nie درست قبل از یک کلمه (نه قبل از فعل) بیاید یعنی «نه فلان چیز»؛ piję herbatę, nie kawę یعنی «چای می‌نوشم، نه قهوه».
    example_gloss: چای می‌نوشم، اما قهوه نه.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: زود، ساعت ده
    gloss: زود؛ ساعت ده — همان پایانه‌ی -ej در ساعت‌ها بعد از «o»، مثل czwartej و siódmej از درس قبل.
    note: '*O dziesiątej* («ساعت ده») همان الگوی ساعتی را دارد که قبلاً یاد گرفته‌اید: *dziesiąta* بعد از *o* می‌شود *dziesiątej*، درست مثل *czwarta* ← *czwartej* و *siódma* ← *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: اوا صبحش را توصیف می‌کند
    gloss: اوا می‌گوید ساعت هفت صبح بلند می‌شود و قهوه می‌نوشد.
    note: همان الگوی جمله‌ی اولِ این بخش، این بار در یک گفت‌وگوی واقعی.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: اوا روزش را ادامه می‌دهد
    gloss: اوا می‌گوید صبحانه می‌خورد، بعد بعدازظهر کار می‌کند.
    note: دو کار اول‌شخص با potem به هم وصل شده‌اند، همان الگوی درس ۲.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: اوا حرفش را تمام می‌کند و از مارک می‌پرسد
    gloss: اوا می‌گوید عصر به خانه برمی‌گردد. تو چی؟
    note: A ty? بدون هیچ ساختار سؤالیِ تازه‌ای حرف را به مارک می‌دهد.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: مارک از صبح خودش می‌گوید
    gloss: مارک می‌گوید من هم ساعت هفت بلند می‌شوم! ولی چای می‌نوشم، نه قهوه.
    note: Ja też یک نکته‌ی مشترک (ساعت بیدار شدن) را تأیید می‌کند و بعد با ale…nie تضاد نوشیدنی را می‌آورد.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: مارک روزش را توصیف می‌کند
    gloss: مارک می‌گوید صبح کار می‌کند، بعد ظهر ناهار می‌خورد.
    note: 'ترتیب روزانه‌اش با اوا فرق دارد: اول کار، بعد وعده‌ی نیمروز.'
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: مارک از خوابش می‌گوید
    gloss: مارک می‌گوید زود می‌خوابد، ساعت ده شب.
    note: گفت‌وگو با فعل تازه‌ی spać/śpię و الگوی ساعتِ مرورشده در این درس تمام می‌شود.
