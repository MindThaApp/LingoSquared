teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: خانه، هست، دارد — دوباره
    gloss: Dom، jest، ma، Marek، Ewa — این کلمه‌ها را از درس‌های قبل می‌شناسید، مثلاً Dom jest tam. (خانه آنجاست).
    note: یک یادآوری کوتاه، قبل از اینکه در این درس از این کلمه‌ها برای حرف زدن درباره‌ی خانه‌تان استفاده کنیم.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: آپارتمان
    gloss: آپارتمان
    note: یک واحد آپارتمانی، نه یک خانه‌ی کامل.
    example_gloss: اِوا یک آپارتمان دارد.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: بزرگ
    gloss: خانه بزرگ است. — کلمه‌ی *duży* با اسم‌های مذکر مثل *dom* به کار می‌رود.
    note: این اولین بار در این دوره است که کلمه‌ای اندازه را توصیف می‌کند — فعلاً فقط برای *dom* به کار می‌رود.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: خانه‌ی مارک
    gloss: مارک یک خانه دارد. خانه بزرگ است.
    note: واقعیتی که کل این درس درباره‌ی مارک روی آن بنا شده است.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: خانه‌ی اِوا
    gloss: اِوا یک آپارتمان دارد.
    note: واقعیتی که کل این درس درباره‌ی اِوا روی آن بنا شده است.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: اتاق
    gloss: اتاق
    note: کلمه‌ای کلی برای هر اتاق در خانه.
    example_gloss: اتاق کجاست؟
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: چند تا اتاق؟
    gloss: چند تا اتاق داری؟ من دو تا اتاق دارم. — Ile، عددها و mam/masz را از درس‌های قبل می‌شناسید؛ *pokoi* و *pokoje* شکل‌هایی از کلمه‌ی *pokój* هستند.
    note: '*Pokoi* درست بعد از *Ile* می‌آید؛ *pokoje* درست بعد از *dwa*، *trzy* یا *cztery* (دو، سه، چهار) می‌آید.'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: چند تا اتاق داری؟
    gloss: چند تا اتاق داری؟
    note: سؤالی طبیعی درباره‌ی خانه‌ی کسی.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: من دو تا اتاق دارم
    gloss: من دو تا اتاق دارم.
    note: جواب طبیعی برای سؤال بالا.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: آشپزخانه
    gloss: آشپزخانه
    note: یکی از رایج‌ترین اتاق‌های هر خانه.
    example_gloss: آشپزخانه کوچک است.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: کوچیک
    gloss: آشپزخانه کوچک است. — کلمه‌ی *mała* با اسم‌های مؤنث مثل *kuchnia* به کار می‌رود.
    note: این کلمه‌ای جدا از *duży* (بزرگ) است — فعلاً فقط برای *kuchnia* به کار می‌رود.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: اتاق خواب
    gloss: اتاق خواب
    note: اتاقی که در آن می‌خوابید.
    example_gloss: اتاق خواب کجاست؟
  pl.a1.unit18.lesson02.teach.lazienka:
    title: حمام
    gloss: حمام
    note: اتاقی که دوش و توالت دارد.
    example_gloss: حمام کجاست؟
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: کجا، آنجا — دوباره
    gloss: Gdzie، tam — این کلمه‌ها را از درس‌های قبل می‌شناسید، مثلاً Bank jest tam. (بانک آنجاست).
    note: یک یادآوری کوتاه، قبل از اینکه در این درس از این کلمه‌ها برای حرف زدن درباره‌ی اتاق‌ها استفاده کنیم.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: توی اتاق، توی آشپزخانه...
    gloss: 'W + اتاق، آشپزخانه، اتاق خواب، حمام: w pokoju، w kuchni، w sypialni، w łazience — همان الگوی w szkole (توی مدرسه) یا w biurze (توی دفتر).'
    note: همان ایده‌ی کلمه‌های محل کار که قبلاً یاد گرفتید است — پایانه‌ی کلمه کمی عوض می‌شود تا بگوید «توی» آن اتاق.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: حمام کجاست؟
    gloss: حمام کجاست؟ حمام اون‌جاست.
    note: یه گفت‌وگوی طبیعی برای پیدا کردن یه اتاق توی خونهٔ کسی.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: آشپزخونه کوچیکه
    gloss: آشپزخانه کوچک است.
    note: دوباره از کلمهٔ اندازه‌ای استفاده می‌کنیم که پیش‌تر توی همین درس دیدید.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: بله، و، هستند -- دوباره
    gloss: Tak, i, są, A, ja, jeden -- این کلمه‌ها را از درس‌های قبلی می‌شناسید.
    note: یه یادآوری سریع پیش از گفت‌وگوی این درس.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: یخچال
    gloss: یخچال
    note: یکی از وسایل رایج آشپزخونه.
    example_gloss: توی آشپزخونه یه یخچال هست.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: فر
    gloss: فر
    note: یکی دیگه از وسایل رایج آشپزخونه.
    example_gloss: توی آشپزخونه یه فر هست.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: مارک دربارهٔ خونه‌اش حرف می‌زنه
    gloss: یه خونه دارم. خونه بزرگه.
    note: مارک گفت‌وگو را با توصیف خونه‌اش شروع می‌کنه.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: اوا دربارهٔ اتاق‌ها می‌پرسه
    gloss: چند تا اتاق داری؟
    note: اوا یه سؤال طبیعیِ بعدی می‌پرسه.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: مارک جواب می‌ده
    gloss: دو تا اتاق دارم. توی خونه آشپزخونه، اتاق خواب و حمام هست.
    note: مارک تعداد اتاق‌هاش را می‌گه و اتاق‌های خونه‌اش را یکی‌یکی نام می‌بره.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: اوا خونه‌اش را توصیف می‌کنه
    gloss: ولی من یه آپارتمان دارم. یه اتاق دارم.
    note: اوا سراغ توصیف خونهٔ کوچیک‌تر خودش می‌ره.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: اوا دربارهٔ آشپزخونه می‌پرسه
    gloss: آشپزخونه کوچیکه؟
    note: اوا دربارهٔ آشپزخونهٔ مارک یه سؤال بعدی می‌پرسه.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: مارک جواب می‌ده
    gloss: بله، آشپزخونه کوچیکه. توی آشپزخونه یه یخچال و یه فر هست.
    note: مارک می‌گه آشپزخونه کوچیکه و دو تا از وسایلش را نام می‌بره.
