teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: جوان
    gloss: جوان
    note: یک صفت توصیفی ساده — نقطه‌ی شروع شکل‌های تفضیلی این درس.
    example_gloss: مارک جوونه.
  pl.a1.unit14.lesson01.teach.stary:
    title: پیر
    gloss: مسن
    note: متضاد młody — صفت دیگری که این درس آن را به شکل تفضیلی در می‌آورد.
    example_gloss: پدربزرگ مسنه.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'ساختن مقایسه: -szy اضافه کنید'
    gloss: 'در صفت‌های کوتاه مثل stary و młody، پایانه‌ی -y به -szy تبدیل می‌شود: stary می‌شود starszy و młody می‌شود młodszy. همه‌ی صفت‌ها این‌طور نیستند.'
    note: 'الگویی ساده برای این دو کلمه: *-y* آخر را بردارید و *-szy* بگذارید تا شکل تفضیلی به دست بیاید. خیلی از صفت‌های دیگر پایانه‌ی متفاوتی دارند، پس آن را همه‌جا به کار نبرید.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: مسن‌تر
    gloss: مسن‌تر
    note: Starszy برای مرد (یا on) و starsza برای زن (یا ona) به کار می‌رود — شکل تفضیلی stary.
    example_gloss:
    - پدربزرگ از پدر مسن‌تره.
    - مادربزرگ از مادر مسن‌تره.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: جوان‌تر
    gloss: جوان‌تر
    note: Młodszy برای مرد، młodsza برای زن — شکل تفضیلی młody.
    example_gloss:
    - پدر از پدربزرگ جوان‌تره.
    - مادر از مادربزرگ جوان‌تره.
  pl.a1.unit14.lesson01.teach.niz:
    title: از (در مقایسه)
    gloss: از (در مقایسه)
    note: Niż دو چیزی را که مقایسه می‌شوند به هم وصل می‌کند — کلمه‌ی بعد از niż به شکل ساده و عادی خودش می‌ماند.
    example_gloss: پسر از پدر کوچک‌تر است.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: صفت‌های تفضیلی با جنسیت هماهنگ می‌شوند
    gloss: Starszy/starsza و młodszy/młodsza مثل byłem/byłam با جنسیت عوض می‌شوند. Starszy و młodszy برای مرد (on)؛ starsza و młodsza برای زن (ona).
    note: الگو مثل *byłem*/*byłam* است؛ پایانِ کلمه بسته به اینکه درباره‌ی مرد حرف می‌زنید یا زن، عوض می‌شود.
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: اوا از مارک بزرگ‌تر است
    gloss: اوا از مارک بزرگ‌تر است.
    note: این یک واقعیت درباره‌ی دو شخصیت ماست؛ اوا ۳۲ سال دارد و مارک ۲۸ سال.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: مارک از اوا کوچک‌تر است
    gloss: مارک از اوا کوچک‌تر است.
    note: همین واقعیت، از طرف دیگر گفته شده.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: باز هم «خوب»
    gloss: Dobry (خوب) را از Dzień dobry از قبل می‌شناسید.
    note: همان صفتی که از همان درس اول دیده‌اید؛ حالا برای ساختن صفت تفضیلی به کار می‌رود.
  pl.a1.unit14.lesson02.teach.zly:
    title: بد
    gloss: بد
    note: متضاد dobry؛ کلمه‌ای کاملاً جدید در این درس.
    example_gloss: این یک روز بد است.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry و zły بی‌قاعده‌اند
    gloss: 'Dobry و zły بی‌قاعده‌اند: dobry می‌شود lepszy و zły می‌شود gorszy؛ پسوند -szy اضافه نمی‌کنید.'
    note: برخلاف *stary*/*młody*، این دو از الگوی منظم *-szy* پیروی نمی‌کنند؛ شکل تفضیلی‌شان را باید جداگانه حفظ کرد.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: بهتر
    gloss: بهتر
    note: Lepszy برای مرد، lepsza برای زن (یا برای کلمه‌ی مؤنثی مثل kawa)؛ صفت تفضیلی بی‌قاعده‌ی dobry.
    example_gloss:
    - او از من بهتر است.
    - قهوه از چای بهتر است.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: بدتر
    gloss: بدتر
    note: Gorszy/gorsza؛ صفت تفضیلی بی‌قاعده‌ی zły.
    example_gloss:
    - او از من بدتر است.
    - چای از قهوه بدتره.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: باز هم قهوه و چای
    gloss: Kawa و herbata را از درس قبلی درباره‌ی نوشیدنی‌ها می‌شناسید.
    note: یک یادآوری کوتاه، قبل از اینکه در این درس آن‌ها را با هم مقایسه کنیم.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: همان الگوی قبل
    gloss: Lepszy/lepsza و gorszy/gorsza دقیقاً مثل starszy/starsza در درس قبل با جنسیت عوض می‌شوند.
    note: همان تفاوت مذکر و مؤنث که الان یاد گرفتید، این بار برای دو کلمه‌ی جدید.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: من، هستم، تو
    gloss: Ja، jestem، ty؛ این کلمه‌ها را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: بله، نه، باشه
    gloss: Tak، nie و dobrze را هم از قبل می‌شناسید.
    note: یک یادآوری کوتاه دیگر قبل از گفت‌وگو.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: باز هم «اما»
    gloss: Ale (اما) را از درس‌های قبل می‌شناسید. دو جمله‌ی متضاد را به هم وصل می‌کند.
    note: یک حرف ربط کوتاه که تضاد را نشان می‌دهد، مثل «اما» در فارسی.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: مارک می‌گوید چای بهتر است
    gloss: چای از قهوه بهتر است!
    note: مارک با نظر خودش شروع می‌کند، همان چیزی که قبلاً در درس سلیقه‌ها گفته بود.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: اوا مخالفت می‌کند
    gloss: نه، نه! قهوه از چای بهتر است!
    note: اوا با نظر خودش جواب می‌دهد، که با حرف قبلی‌اش هم می‌خواند.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: مارک بحث را به سن می‌برد
    gloss: باشه، باشه. ولی من از تو کوچک‌ترم!
    note: مارک بحث نوشیدنی را رها می‌کند و سراغ چیزی می‌رود که در موردش مطمئن است.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: اوا قبول می‌کند و دوباره نظرش را می‌گوید
    gloss: بله، من بزرگ‌ترم. ولی قهوه بهتر است!
    note: اوا درباره‌ی سن تأیید می‌کند و بعد دوباره به نظرش درباره‌ی قهوه برمی‌گردد.
