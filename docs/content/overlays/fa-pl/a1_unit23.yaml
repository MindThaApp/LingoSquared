teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: '*W sumie* (روی‌هم) روشن می‌کند که قیمت کل را می‌خواهید، نه قیمت یک مورد.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: گفتن قیمت کل
    gloss: روی‌هم صد زلوتی تمام می‌شود.
    note: '*Kosztuje* شکل *on/ona/ono* فعل *kosztować* (قیمت داشتن) است. بعد از اعداد از 5 به بالا جمع حالت اضافه می‌آید: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: '*Płacić kartą* (با کارت پرداخت کردن) و *płacić gotówką* (نقد پرداخت کردن) هر دو بعد از *płacić* حالت ابزاری می‌گیرند: *kartą*، *gotówką*.'
    example_gloss:
    - می‌توانم اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌توانم اینجا با کارت پرداخت کنم؟
    note: '*Tu* (اینجا) سؤال را به همین مکان مربوط می‌کند؛ *czy* سؤال بله/نه را شروع می‌کند و *mogę* یعنی «می‌توانم».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*Czy chce pan ...?* شکل رسمی *Czy chcesz ...?* است و اینجا صندوق‌دارِ ناآشنا از آن استفاده می‌کند (*pan* برای مرد، *pani* برای زن).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: 'اسم مذکر: *rachunek* (حالت اضافه *rachunku*).'
    example_gloss: حساب را تقسیم کنیم؟
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*Może podzielimy ...?* راه مؤدبانه‌ای برای پیشنهاد کاری مشترک است؛ *podzielimy* شکل *my* فعل *podzielić* است.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*Osobno* (جداگانه) با *zapłacić* (پرداخت کردن، کامل‌شده: یک پرداخت تمام‌شده) می‌آید.'
  pl.a1.unit23.lesson04.teach.reszta:
    title: باقی‌مانده پول
    gloss: پول خرد
    note: 'اسم مؤنث: *reszta* (حالت اضافه *reszty*، مثل *nie potrzebuję reszty*).'
    example_gloss: بفرمایید، پول خردتان.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، پول خردتان.
    note: '*Pana* شکل رسمی «مال شما» است (برای مرد؛ برای زن *pani*) و با لحن رسمی پشت پیشخوان جور است.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: '*Nie potrzebuję* + حالت اضافه: وقتی جمله منفی است، مفعول در حالت اضافه می‌آید، پس *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: سی‌وپنج
    gloss: سی‌وپنج
    note: '*Trzydzieści pięć* دو کلمه‌ی جدا نوشته می‌شود: اول دهگان، بعد یکان (30 + 5).'
    example_gloss: صد و چهل زلوتی تمام می‌شود.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو غذای اصلی و دو قهوه. جمع: صد و چهل زلوتی. با کارت پرداخت شد.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      Rachunek: صورت‌حساب
      dwa: دو
      dania: غذاهای اصلی (dania główne)
      kawy: قهوه‌ها
      Razem: مجموع
      złotych: زلوتی
      Zapłacono: پرداخت‌شده
      kartą: کارت
      sto: صد
      czterdzieści: چهل
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: اوا صورت‌حساب را می‌خواهد
    gloss: 'اوا: صورت‌حساب رو بخوایم؟'
    note: '*Poprosić o* (درخواست کردن) بعدش حالت مفعولی می‌آید: *o rachunek*. *Poprosimy* آینده‌ی کامل‌شده است.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: مارک مبلغ کل را می‌پرسد
    gloss: 'مارک: آره، فکر خوبیه. روی‌هم چقدر می‌شه؟'
    note: همان سؤال *Ile to kosztuje w sumie?* از درس 1 دوباره آمده است.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: اوا مبلغ کل را می‌گوید
    gloss: 'اوا: صد و چهل زلوتی می‌شه. تقسیمش کنیم؟'
    note: '*Podzielimy się?* (تحت‌اللفظی: «تقسیم کنیم؟») با ضمیر بازتابی *się* به معنی تقسیم کردن صورت‌حساب است.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: مارک اصرار دارد خودش پرداخت کند
    gloss: 'مارک: نه، امروز من حساب می‌کنم. خیلی کمکم کردی!'
    note: '*Dzisiaj ja płacę* (تحت‌اللفظی: «امروز من پرداخت می‌کنم») راه معمول پیشنهاد پرداخت است؛ *pomogłaś* گذشته‌ی مؤنث *pomóc* (کمک کردن) است، چون مارک با اوا حرف می‌زند.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: اوا دلش گرم می‌شود
    gloss: 'اوا: لطف داری! ممنون.'
    note: '*Miło z twojej strony* (از شما/تو لطفه) تعریف گرم و رایجی برای کار بخشنده‌ای است؛ *z* + حالت اضافه: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: مارک می‌پرسد می‌تواند با کارت پرداخت کند
    gloss: 'مارک: می‌تونم اینجا با کارت پرداخت کنم؟'
    note: همان سؤال *Czy mogę tu zapłacić kartą?* از درس 2 است، این بار در خود رستوران.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: شکل سوم‌شخص مفرد'
    gloss: مارک صورت‌حساب را پرداخت می‌کند.
    note: '*Płaci* شکل *on/ona/ono* فعل *płacić* (پرداخت کردن) است.'
