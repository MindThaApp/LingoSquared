  pl.a1.unit03.lesson01.dni_tygodnia:
    title: روزهای هفته
  pl.a1.unit03.lesson02.miesiace_i_daty:
    title: ماه‌ها و تاریخ‌ها
  pl.a1.unit03.lesson03.umawiamy_sie:
    title: قرار ملاقات می‌گذاریم
teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: دوشنبه
    gloss: دوشنبه
    note: اولین روز هفته در لهستان؛ در ایران هفته از شنبه شروع می‌شود، ولی در لهستان از دوشنبه.
    example_gloss: امروز دوشنبه است.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: سه‌شنبه
    gloss: سه‌شنبه
    note: 'حواستان به این یکی باشد -- برای گفتن «روز سه‌شنبه» باید *we* بگویید، نه *w*: *we wtorek*. بعداً در همین درس بیشتر دربارهٔ آن می‌خوانید.'
    example_gloss: امروز سه‌شنبه است.
  pl.a1.unit03.lesson01.teach.sroda:
    title: چهارشنبه
    gloss: چهارشنبه
    note: اسم مؤنث است، برخلاف بیشتر روزهای دیگر هفته.
    example_gloss: امروز چهارشنبه است.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: پنجشنبه
    gloss: پنجشنبه
    note: الگوی مذکر مثل *poniedziałek*، *wtorek* و *piątek*.
    example_gloss: امروز پنجشنبه است.
  pl.a1.unit03.lesson01.teach.piatek:
    title: جمعه
    gloss: جمعه
    note: این روز را بعداً در همین واحد دوباره می‌بینید -- روزی است که اوا و مارک قرار می‌گذارند دوباره همدیگر را ببینند.
    example_gloss: امروز جمعه است.
  pl.a1.unit03.lesson01.teach.sobota:
    title: شنبه
    gloss: شنبه
    note: بخشی از آخر هفته؛ در لهستان خیلی‌ها از کلمهٔ *weekend* هم استفاده می‌کنند که از زبانی دیگر وام گرفته شده است.
    example_gloss: امروز شنبه است.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: یکشنبه
    gloss: یکشنبه
    note: آخرین روز از هفت روز هفته که در این درس یاد می‌گیرید.
    example_gloss: امروز یکشنبه است.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: پرسیدن روز هفته
    gloss: امروز چه روزی از هفته است؟
    note: یک جملهٔ پرسشی مستقیم -- *dzień tygodnia* یعنی «روز هفته».
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: استثنای w/we
    gloss: دوشنبه، پنجشنبه، جمعه -- ولی سه‌شنبه (برای تلفظ راحت‌تر) با شکل دیگری.
    note: 'بیشتر روزهای هفته با الگوی «*w* + روز» می‌آیند و یعنی «در روز ...». *Wtorek* تنها استثنای واقعی است: لهستانی‌ها می‌گویند *we wtorek*، نه *w wtorek*، فقط چون گفتنش راحت‌تر است -- یک بی‌قاعدگی واقعی است، نه غلط املایی.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: جمعه به سینما می‌روم
    gloss: جمعه می‌رم سینما.
    note: '*Piątek* بعد از *w* تغییر نمی‌کند -- فقط *środa*، *sobota* و *niedziela* تغییر می‌کنند (که برای ساده ماندن درس در سطح A1 نیامده‌اند).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: ژانویه، فوریه، مارس
    gloss: ژانویه؛ فوریه؛ مارس
    note: از نظر دستوری *Luty* متفاوت است -- مثل صفت رفتار می‌کند، نه مثل اسم معمولی (شکل «در فوریه» را بعداً در همین واحد می‌بینید).
    example_gloss:
    - تولدم در ژانویه است.
    - فوریه می‌رم ورشو.
    - تولدم در ماه مارس است.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: آوریل، مه، ژوئن
    gloss: آوریل؛ مه؛ ژوئن
    note: '*Maj* ماهی است که در داستان همین واحد برای هر دو تاریخ می‌بینید.'
    example_gloss:
    - آوریل می‌رم ورشو.
    - تولدم در مه است.
    - ژوئن می‌رم ورشو.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: ژوئیه، اوت، سپتامبر
    gloss: ژوئیه؛ اوت؛ سپتامبر
    note: 'یک بی‌قاعدگی واقعی دیگر: «در سپتامبر» می‌شود *we wrześniu*، نه *w wrześniu* -- همان جایگزینیِ *we* برای تلفظ راحت‌تر که قبلاً در *wtorek* دیدید.'
    example_gloss:
    - ژوئیه مرخصی‌ام.
    - اوت می‌رم ورشو.
    - تولدم در سپتامبر است.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: اکتبر، نوامبر، دسامبر
    gloss: اکتبر؛ نوامبر؛ دسامبر
    note: سه ماه آخر سال که مجموعهٔ دوازده‌تایی ماه‌ها را کامل می‌کنند.
    example_gloss:
    - اکتبر می‌رم ورشو.
    - تولد من در نوامبر است.
    - دسامبر مرخصی‌ام.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: تولد
    gloss: تولد
    note: '*Urodziny* در لهستانی همیشه جمع است، حتی برای تولدِ یک نفر -- با *są* (فعل جمع) می‌آید، نه *jest* (فعل مفرد). همین نکته را در تمرینی بعدی در همین درس تمرین می‌کنید.'
    example_gloss: تولدم در مه است.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: کی / چه موقع
    gloss: کی / چه وقت
    note: کلمهٔ پرسشی برای پرسیدن دربارهٔ هر زمانی.
    example_gloss: جلسه کِی است؟
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: پرسیدن تاریخ تولد کسی
    gloss: تولدت کیه؟
    note: '*Są*، نه *jest*، چون با *urodziny* که جمع است مطابقت دارد -- همان الگویی که در کارت *urodziny* گفته شد.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: گفتن تاریخ تولد
    gloss: تولد من دهم مه است.
    note: '*Dziesiątego maja* -- روز با *-ego* تمام می‌شود و ماه با *-a*، آن هم بدون هیچ حرف اضافه‌ای. لهستانی تاریخ مشخص را این‌طوری می‌گوید. الگوی کامل را در نکته‌ی دستوری بعدی همین درس می‌بینید.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: پرسیدن زمان جلسه
    gloss: جلسه کِی است؟
    note: '*Spotkanie* (جلسه، دیدار) -- کلمه‌ای که در گفت‌وگوی درس سوم دوباره می‌بینید.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: گفتن تاریخ جلسه
    gloss: جلسه پانزدهم مه است.
    note: همان الگوی تاریخ با *-ego* و *-a* مثل *dziesiątego maja*، فقط با عدد روز دیگری.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: طرز گفتن تاریخ در لهستانی
    gloss: 'تاریخ: روز به -ego ختم می‌شود، ماه به -a (ولی فوریه lutego می‌شود)، بدون حرف اضافه -- دهم مه، پانزدهم مه.'
    note: این را با «روز جمعه» مقایسه کنید (*w piątek*، با حرف اضافهٔ *w*) -- گفتن یک تاریخ مشخص تقویمی فرق دارد و هیچ‌وقت حرف اضافه نمی‌گیرد.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: پیشنهاد دیدار دوباره
    gloss: کِی می‌تونیم دوباره همدیگه را ببینیم؟
    note: '*Znowu* یعنی «دوباره» -- راهی طبیعی برای شروع صحبت دربارهٔ قرار یک دیدار دیگر.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: پرسیدن رسمی از یک آقا که جمعه مناسب است یا نه
    gloss: جمعه برای شما مناسب است؟ (به یک آقا، رسمی)
    note: '*Panu* صورتِ حالت مفعولیِ غیرمستقیمِ کلمهٔ *pan* است. فعل *odpowiadać* («مناسب بودن، جور بودن») همیشه مفعولش را در همین حالت می‌گیرد. در فارسی می‌گوییم «جمعه برای شما مناسب است» و حرف اضافهٔ *برای* می‌آید، ولی در لهستانی به‌جای حرف اضافه، خودِ کلمه تغییر می‌کند.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: پرسیدن رسمی از یک خانم که جمعه مناسب است یا نه
    gloss: جمعه برای شما مناسب است؟ (به یک خانم، رسمی)
    note: برای خطاب رسمی به یک خانم، *panu* را با *pani* عوض کنید -- *pani* در حالت نهادی و دادی یکسان می‌ماند، برخلاف *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: پرسیدن از دوست که جمعه خوبه یا نه، به شکل دوستانه
    gloss: جمعه برات خوبه؟ (دوستانه)
    note: وقتی با دوست یا هم‌سن‌وسال خودتان حرف می‌زنید، *ci* به‌جای *panu*/*pani* می‌آید؛ یعنی «به تو» به شکل دوستانه.
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: گفتن اینکه جمعه برایتان خوبه
    gloss: جمعه برام خوبه.
    note: '*Mi* شکل اول‌شخص همان حالت است، مثل *panu*/*pani*/*ci*، فقط برای «به من» به‌جای «به شما».'
  pl.a1.unit03.lesson03.teach.data:
    title: تاریخ
    gloss: تاریخ (روز تقویم)
    note: data یعنی تاریخ دقیق یک روز در تقویم، نه اسم روز هفته.
    example_gloss: تاریخش چندمه؟
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: پرسیدن اینکه چه تاریخی است
    gloss: تاریخش چندمه؟
    note: وقتی دو نفر روز هفته را قبول کرده‌اند ولی هنوز تاریخ دقیق را نمی‌دانند، این سؤال طبیعی است.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: اِوا پیشنهاد دیدار دوباره می‌دهد
    gloss: اِوا از مارک می‌پرسد کی می‌توانند دوباره همدیگر را ببینند.
    note: دقیقاً همان سؤال ابتدای این درس است.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: مارک رسمی جمعه را پیشنهاد می‌کند
    gloss: مارک رسمی از اِوا می‌پرسد جمعه برایش خوب است یا نه.
    note: اِوا را با *pani* خطاب می‌کند؛ همان سطح رسمی که از درس اول ادامه دارد.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: اِوا قبول می‌کند و تاریخ را می‌پرسد
    gloss: اِوا می‌گوید جمعه برایش خوب است و بعد می‌پرسد تاریخ دقیقش چندم است.
    note: '*Tak* («بله») را در درس اول دیدید؛ اِوا با آن موافقتش را شروع می‌کند، قبل از اینکه تاریخ دقیق را بپرسد.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: مارک تاریخ را می‌گوید
    gloss: مارک می‌گوید پانزدهم مه.
    note: هر دو کلمه‌ی اینجا در درس دوم همین بخش آمده بودند.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: اِوا تأیید می‌کند و خداحافظی می‌کند
    gloss: اِوا می‌گوید عالی، و می‌گوید پانزدهم مه می‌بینمتان.
    note: '*Do zobaczenia* همان خداحافظی درس اول است، این بار همراه با یک تاریخ مشخص.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: مارک گفتگو را تمام می‌کند
    gloss: مارک هم خداحافظی می‌کند.
    note: 'کوتاه‌ترین پایان ممکن: فقط خود خداحافظی.'
