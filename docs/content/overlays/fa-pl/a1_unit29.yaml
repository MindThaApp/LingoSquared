    gloss: اوا هر روز به مارک زنگ می‌زند. از گوشی استفاده می‌کند، نه برنامه. مارک در خانه کامپیوتر ندارد، ولی با گوشی‌اش از اینترنت استفاده می‌کند. تومک هر صبح پیش‌بینی هوا را نگاه می‌کند. بعد برای دویدن می‌رود. کاشا اغلب برای اوا پیام می‌فرستد. شما هم هر روز از گوشی‌تان استفاده می‌کنید؟
    note: عادت‌های استفاده از دستگاه را در هر چهار شخصیت مقایسه می‌کند، مثل متن مقایسه‌ای درس ورزش.
