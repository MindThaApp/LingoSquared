teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: خوشحال، ناراحت و عصبانی
    gloss: خوشحال، ناراحت، عصبانی
    note: سه واژه پایه برای احساس که با *jestem* (من هستم) به کار می‌روند. این‌ها شکل مذکرند؛ زن می‌گوید *szczęśliwa, smutna, zła*.
    example_gloss:
    - من خوشحالم.
    - غمگینم.
    - من عصبانی هستم.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: گفتن اینکه خوشحالید
    gloss: من خوشحالم.
    note: '*Jestem* (من هستم، از *być*) + صفت الگوی پایه است. صفت با گوینده جور می‌شود: *szczęśliwy* (مرد)، *szczęśliwa* (زن). در فارسی صفت برای مرد و زن فرقی نمی‌کند، ولی در لهستانی شکلش عوض می‌شود.'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: مقایسه‌ی احساسات
    gloss: من عصبانی نیستم، ناراحتم.
    note: '*Nie* درست قبل از فعل می‌آید: *Nie jestem zły*. جمله دوم بعد احساس واقعی را می‌گوید.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: پرسیدن دلیل
    gloss: چرا خوشحالی؟
    note: '*Dlaczego* (چرا) واژه پرسشی استاندارد برای پرسیدن دلیل است.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: گفتن دلیل
    gloss: من خوشحالم چون آپارتمان جدیدی دارم.
    note: '*Bo* (چون) دلیل را معرفی می‌کند؛ بعد از *mam* (دارم) اسم در حالت مفعولی است: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: یک دلیل منفی
    gloss: من ناراحتم چون دارد باران می‌آید.
    note: '*Pada deszcz* (باران می‌آید، تحت‌اللفظی «باران می‌افتد») عبارت رایج برای هوا است که اینجا به‌عنوان دلیل آمده.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: مضطرب
    gloss: مضطرب
    note: کلمه‌ی معمول برای استرس و دلهره.
    example_gloss: از اولین شیفت کاری‌ام استرس دارم.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: گفتن اینکه برای چه چیزی دلشوره دارید
    gloss: از اولین شیفت کاری‌ام استرس دارم.
    note: 'در فارسی می‌گوییم «بابت اولین شیفت»، ولی در لهستانی برای بیان اینکه اضطراب درباره چیست، *przed* (تحت‌اللفظی «قبل از») + حالت ابزاری می‌آید: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: دلداری دادن به کسی
    gloss: نگران نباش.
    note: '*Nie martw się* (تحت‌اللفظی «خودت را نگران نکن») عبارت دلداری رایج است؛ *się* ضمیر بازتابی است.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: پرسیدن حال کسی
    gloss: مارک چه حسی دارد؟
    note: '*Czuć się* (احساس داشتن، بازتابی) روش استاندارد پرسیدن یا توصیف حالت احساسی است: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: توصیف حال کسی
    gloss: او استرس دارد.
    note: '*Się* کنار فعل می‌ماند: *on czuje się*. صفت مذکر است تا با *on* جور شود: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: پرسیدن دلیل حال کسی
    gloss: چرا استرس دارد؟
    note: '*dlaczego* (چرا) را با الگوی *czuje się* از *On czuje się zdenerwowany* ترکیب می‌کند.'
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: خواندن یک پیام درباره‌ی احساسات
    gloss: سلام اوا، من قبل از اولین شیفت مستقلم کمی مضطربم. ولی خوشحال هم هستم، چون کار جدید و آپارتمان جدید دارم. فکر می‌کنم همه‌چیز خوب پیش می‌رود.
    note: دقت کنید نویسنده برای چه چیزی دلشوره دارد، چه چیزی او را خوشحال می‌کند و دید کلی‌اش چیست.
    glosses:
      trochę: یک کم
      zdenerwowany: مضطرب
      pierwszą: اولین
      zmianą: شیفت
      samodzielną: تنها
      szczęśliwy: خوشحال
      bo: چون
      nową: جدید
      pracę: شغل
      nowe: جدید
      mieszkanie: آپارتمان
      myślę: فکر کردن
      będzie: 'درست می‌شود (اینجا: همه‌چیز درست می‌شود)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: اوا می‌پرسد مارک چه حسی دارد
    gloss: 'اوا: سلام مارک، قبل از اولین شیفتت چه حسی داری؟'
    note: '*Przed pierwszą zmianą* (درباره اولین شیفتت) همان الگوی *przed* + حالت ابزاری درس ۳ است. *Czujesz się* شکل *ty* است.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: مارک اعتراف می‌کند مضطرب است
    gloss: 'مارک: راستش کمی مضطربم.'
    note: '*Szczerze mówiąc* (راستش، تحت‌اللفظی «صادقانه گفتن») اعتراف را نرم‌تر می‌کند.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: اوا به او دلداری می‌دهد
    gloss: 'اوا: نگران نباش، خوب از پسش برمی‌آیی!'
    note: '*Dobrze sobie poradzisz* (تحت‌اللفظی «خوب از پسش برمی‌آیی») عبارت ثابت دلگرم‌کننده است؛ *poradzisz* آینده *ty* از *poradzić sobie* است.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: مارک از او تشکر می‌کند
    gloss: 'مارک: مرسی، واقعاً کمک می‌کند.'
    note: '*Pomaga* شکل *on/ona/ono* از *pomagać* (کمک کردن) است؛ *dzięki* «مرسی» محاوره‌ای است.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: اوا نتیجه را پیش‌بینی می‌کند
    gloss: 'اوا: و بعدش حتماً خیلی خوشحال و سربلند خواهی بود.'
    note: '*Na pewno* (حتماً) پیش‌بینی مطمئن را نشان می‌دهد؛ *dumny* (سربلند) صفت جدید و مفیدی است. *Będziesz* آینده *być* است.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: مارک موافقت می‌کند
    gloss: 'مارک: آره، من هم همین‌طور فکر می‌کنم.'
    note: '*Ja też tak myślę* (تحت‌اللفظی «من هم این‌طور فکر می‌کنم») روش طبیعی موافقت است؛ *ja* اینجا برای تأکید آمده.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: جمع‌بندی با jest و mu
    gloss: مارک قبل از اولین شیفتش مضطرب است. اوا به او کمک می‌کند.
    note: '*Jest* شکل *on/ona* از *być* (بودن) است؛ *mu* یعنی «به او» (حالت اهدایی، چون *pomagać* حالت اهدایی می‌گیرد). واژه‌های کوچکی‌اند، ولی برای حرف زدن درباره دیگران ضروری‌اند.'
