teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: موسیقی
    gloss: موسیقی
    note: موضوعی رایج برای صحبت دربارهٔ چیزهایی که دوست داریم یا نداریم -- شبیه واژهٔ فارسی «موزیک» است و راحت یاد گرفته می‌شود.
    example_gloss: من موسیقی دوست دارم.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: بعد از lubić (دوست داشتن) وقتی مفعول می‌آید، muzyka به muzykę تبدیل می‌شود، درست مثل kawa که kawę می‌شود. Lubię muzykę درست است، نه Lubię muzyka.
    note: 'همان الگویی که می‌شناسید: *muzyka* وقتی مفعولِ *lubię* است، *muzykę* می‌شود، درست مثل *kawa* که *kawę* می‌شود.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: دوست داری
    gloss: دوست داری (خودمانی، ty)
    note: شکل «ty» از lubić -- چیزی که لازم دارید تا مستقیم از دوستتان بپرسید چیزی را دوست دارد یا نه.
    example_gloss: موسیقی دوست داری؟
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (دوست داشتن): lubię (من)، lubisz (تو)، lubi (او). lubię و lubi را از قبل می‌دانید -- lubisz شکل تازه است، برای کسی که با او حرف می‌زنید.'
    note: '*Lubię* و *lubi* حالا دیگر آشنا هستند -- *lubisz* شکل «تو» از همین فعل است که جایش خالی بود.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: موسیقی دوست داری؟
    gloss: موسیقی دوست داری؟
    note: Czy سؤال بله/خیر را شروع می‌کند -- راه طبیعی برای پرسیدن از دوست دربارهٔ سلیقه‌اش.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: بله، دوست دارم.
    gloss: بله، دوست دارم.
    note: جواب کوتاه و طبیعی -- لازم نیست کلمهٔ muzykę را تکرار کنید.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: نه، دوست ندارم.
    gloss: نه، دوست ندارم.
    note: Nie, nie lubię دوبار nie دارد ولی غلط نیست -- اولی جواب سؤال است و دومی فعل lubię را منفی می‌کند.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: جواب‌های کوتاه
    gloss: 'جواب کوتاه: Tak, lubię. / Nie, nie lubię. -- لازم نیست کلمهٔ muzykę را تکرار کنید، چون از سؤال معلوم است موضوع چیست.'
    note: همان‌طور که *Pyszny?* می‌تواند تنها بیاید، *Tak, lubię.* هم لازم نیست موضوع را دوباره بگوید -- موقعیت خودش آن را می‌رساند.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: من موسیقی را خیلی دوست دارم
    gloss: من موسیقی را خیلی دوست دارم.
    note: Bardzo (خیلی) یک ترجیح ساده را قوی‌تر می‌کند -- bardzo را از همان درس اول دیده‌اید.
  pl.a1.unit13.lesson02.teach.wole:
    title: ترجیح می‌دهم
    gloss: ترجیح می‌دهم
    note: فعل کاملاً تازهٔ این درس، woleć (ترجیح دادن) -- فقط شکل «من» آموزش داده می‌شود، مثل lubię.
    example_gloss: چای را ترجیح می‌دهم.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: در این درس فقط wolę'
    gloss: 'Woleć (ترجیح دادن): wolę (من) -- این درس فقط شکل «من» را یاد می‌دهد، مثل lubię. Wolę kawę. = قهوه را ترجیح می‌دهم.'
    note: فعلاً فقط شکل *ja* (من) از *woleć*، دقیقاً به همان اندازه‌ای که *lubię* اولِ کار یاد داده شد.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: باز هم قهوه و چای
    gloss: 'Wolę + مفعول: kawa به kawę و herbata به herbatę تبدیل می‌شود -- همان الگویی که از قبل می‌دانید.'
    note: 'همان الگوی مفعولی قبلی، فقط با یک فعل تازه: *wolę kawę*، *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: قهوه را ترجیح می‌دهم
    gloss: قهوه رو ترجیح می‌دم.
    note: بیان ساده‌ای از ترجیح با wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: چای را ترجیح می‌دهم
    gloss: چای را ترجیح می‌دهم.
    note: همان الگو، این بار با herbatę به‌جای kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy به معنی «یا»
    gloss: czy در Kawa czy herbata? همان czy ابتدای سؤال بله/خیر نیست -- اینجا دو گزینه را به هم وصل می‌کند، مثل «یا» در فارسی. Kawa czy herbata? = قهوه یا چای؟
    note: 'حواستان باشد: *czy* معمولاً سؤال بله/خیر را شروع می‌کند، ولی بین دو اسم این‌طور فقط یعنی «یا».'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: قهوه یا چای؟
    gloss: قهوه یا چای؟
    note: یک راه کوتاه و طبیعی برای این که به کسی یک انتخاب پیشنهاد بدهید.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: من هم
    gloss: من هم
    note: یک راه کوتاه برای موافقت با حرفی که کسی همین الان زده.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też، دوباره
    gloss: Ja też یعنی «من هم» — این را از درس روتین روزانه می‌شناسید (Ja też wstaję o siódmej، «من هم ساعت هفت بلند می‌شم»).
    note: یادآوری کوتاه که این عبارت قبلاً هم آمده است.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? فعل لازم ندارد
    gloss: مثل Pyszny? در درس قبلی، سؤال کوتاه Kawa czy herbata? فعل لازم ندارد — بافت کافی است.
    note: همان الگوی *Pyszny?* — یک سؤال کوتاه بدون فعل که بافت آن را کاملاً روشن می‌کند.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: مارک از اوا می‌پرسد موسیقی دوست دارد یا نه
    gloss: موسیقی دوست داری؟
    note: مارک گفت‌وگو را با سؤالی شروع می‌کند که همین درس یاد داده شد.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: اوا دوست دارد و سؤال را برمی‌گرداند
    gloss: بله، خیلی دوست دارم! تو چطور؟
    note: A ty? («تو چطور؟») سؤال را به مارک برمی‌گرداند؛ همان الگویی که در درس‌های قبلی دیدید.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: مارک موافقت می‌کند و درباره‌ی نوشیدنی می‌پرسد
    gloss: من هم دوست دارم. قهوه یا چای؟
    note: Ja też lubię علاقه‌ی خود مارک را می‌گوید، پیش از آن که با یک سؤال انتخابی تازه بحث را عوض کند.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: اوا قهوه را ترجیح می‌دهد
    gloss: قهوه رو ترجیح می‌دم.
    note: ترجیح خود اوا با wolę — همان قهوه‌خوری که در درس روتین دیدیم.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: مارک چای را ترجیح می‌دهد
    gloss: چای را ترجیح می‌دهم.
    note: ترجیح خود مارک — برعکس انتخاب اوا.
