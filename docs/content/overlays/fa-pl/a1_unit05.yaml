teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: خانواده
    gloss: خانواده
    note: واژهٔ کلی برای «خانواده» است و برای همهٔ اعضای خانه به کار می‌رود، نه فقط یک نسبت خاص.
    example_gloss: این خانوادهٔ من است.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: مادر، پدر
    gloss: مادر؛ پدر
    note: این دو واژه، واژه‌های اصلی برای پدر و مادرند. در گفتار روزمره mama و tata را هم که محبت‌آمیزترند می‌شنوید، ولی matka و ojciec شکل‌های معمول و خنثی‌اند که اینجا یاد می‌گیرید.
    example_gloss:
    - این مادر من است.
    - این پدر من است.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: برادر، خواهر
    gloss: برادر؛ خواهر
    note: 'هر دو اسم معمولی‌اند: brat مذکر و siostra مؤنث است، و این در نکتهٔ دستوری همین درس دربارهٔ مطابقت mój و moja اهمیت دارد.'
    example_gloss:
    - این برادر من است.
    - این خواهر من است.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: پدر و مادر
    gloss: والدین
    note: Rodzice جمع مذکر شخصی است و شکل مالکیت مخصوص خودش را می‌گیرد، یعنی moi (نه mój و moja). این را در مثال و نکتهٔ دستوری همین درس می‌بینید.
    example_gloss: پدر و مادرم در ورشو زندگی می‌کنند.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: '«من»: mój یا moja یا moi'
    gloss: پدرم، برادرم -- مادرم، خواهرم -- پدر و مادرم.
    note: 'صفت ملکی لهستانی با جنسیت اسمی که توصیف می‌کند مطابقت دارد: *mój* قبل از اسم مذکر (*mój ojciec*، *mój brat*)، *moja* قبل از اسم مؤنث (*moja matka*، *moja siostra*)، و شکل بی‌قاعدهٔ جداگانهٔ *moi* مخصوص جمع مذکر شخصی *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: این پدر من است
    gloss: این پدر من است.
    note: '*To jest* (این ... است) برای هر جنسیتی یکسان است و فقط صفت ملکی mój یا moja عوض می‌شود.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: پدربزرگ، مادربزرگ
    gloss: پدربزرگ؛ مادربزرگ
    note: واژه‌های معمول و روزمره برای پدربزرگ و مادربزرگ که هم بچه‌ها و هم بزرگ‌ترها به کار می‌برند.
    example_gloss:
    - این پدربزرگ من است.
    - این مادربزرگ من است.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: عمو/دایی، عمه/خاله
    gloss: عمو/دایی؛ عمه/خاله
    note: هم برای برادر یا خواهر پدر و مادر و هم برای همسر آن‌ها به کار می‌رود؛ برخلاف فارسی که برای عمو، دایی، عمه و خاله واژه‌های جدا دارد.
    example_gloss:
    - این عموی من است.
    - این عمه‌ی من است.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: پسر، دختر
    gloss: پسر؛ دختر
    note: 'مثال‌ها شکل مفعولی لازم بعد از *mieć* (داشتن) را نشان می‌دهند: *syn* می‌شود *syna* و *córka* می‌شود *córkę*. نکته‌های دستوری بعدی دلیل تغییر پایان را توضیح می‌دهند.'
    example_gloss:
    - من یک پسر دارم.
    - من یک دختر دارم.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'داشتن: mam, masz, ma'
    gloss: 'داشتن: من دارم، تو داری، او دارد -- من یک برادر دارم، تو یک خواهر داری، او یک پسر دارد.'
    note: '*Mieć* یعنی «داشتن». *Mam* (من دارم) و *ma* (او دارد) شکل‌های تازهٔ اصلی این درس‌اند؛ *masz* (تو داری) را قبلاً در واحد ۲ هنگام پرسیدن سن دیده‌اید.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: گفتن اینکه چه دارید
    gloss: 'بعد از «داشتن»، پایان اسم عوض می‌شود: brat -> brata، siostra -> siostrę، syn -> syna، córka -> córkę.'
    note: این حالت مفعولی است، یعنی شکلی که اسم به‌عنوان مفعول مستقیم فعلی مثل *mieć* می‌گیرد. اسم‌های مذکر برای انسان (و حیوان)، مثل *brat* و *syn*، پایان *-a* می‌گیرند؛ اسم‌های مؤنث مثل *siostra* و *córka* به‌جای *-a* پایانی، *-ę* می‌گیرند.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: من یک برادر و یک خواهر دارم
    gloss: من یک برادر و یک خواهر دارم.
    note: پایان‌های حالت مفعولی نکتهٔ دستوری را در یک جملهٔ کامل به کار می‌برد، همراه با حرف ربط تازهٔ *i* (و).
  pl.a1.unit05.lesson03.teach.lub:
    title: یا
    gloss: یا
    note: مثل «یا» در فارسی، در پرسش بله/خیر برای پیشنهاد دو گزینه به کار می‌رود.
    example_gloss: برادر داری یا خواهر؟
  pl.a1.unit05.lesson03.teach.tylko:
    title: فقط
    gloss: فقط
    note: درست قبل از واژه‌ای می‌آید که محدودش می‌کند، مثل «فقط» در فارسی.
    example_gloss: من فقط یک خواهر دارم.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: کجا
    gloss: کجا
    note: یک واژهٔ پرسشی پایه است که به‌طور طبیعی با mieszkać (زندگی کردن) می‌آید، مثل گفت‌وگوی همین درس.
    example_gloss: برادرت کجا زندگی می‌کند؟
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: او (مرد)، او (زن) -- و «زندگی کردن»
    gloss: 'او (مرد)، او (زن) -- زندگی کردن: من زندگی می‌کنم، او زندگی می‌کند. او در Gdańsk زندگی می‌کند. او در Kraków زندگی می‌کند.'
    note: '*On* (او، مرد) و *ona* (او، زن) ضمیرهای سوم شخص‌اند. *Mieszkać* (زندگی کردن) همان الگوی اول و سوم شخص *mieć* را دارد: *mieszkam* (زندگی می‌کنم، از *Mieszkam w Warszawie* در واحد ۱) و *mieszka* (او زندگی می‌کند). نام مکان‌ها بعد از *w* حالت مکانی می‌گیرند: *Gdańsk* می‌شود *w Gdańsku* و *Kraków* می‌شود *w Krakowie*، درست مثل *Mieszkam w Warszawie* در واحد ۱.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: مارک دربارهٔ خواهر و برادر می‌پرسد
    gloss: مارک از اوا می‌پرسد برادر دارد یا خواهر.
    note: یک پرسش بله/خیر با *Czy*، همان نشانهٔ پرسشی واحد ۱. اوا و مارک حالا همدیگر را خوب می‌شناسند، برای همین از *pan*/*pani* رسمی به *ty* غیررسمی رفته‌اند (*masz*، *A ty?*، *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: اوا جواب می‌دهد و می‌پرسد
    gloss: اوا می‌گوید یک برادر و یک خواهر دارد، بعد همان سؤال را از مارک می‌پرسد.
    note: '*A ty?* («و تو؟») راهی کوتاه و طبیعی است که سؤال را به طرف مقابل برمی‌گردانید.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: مارک جواب می‌دهد
    gloss: مارک می‌گوید فقط یک خواهر دارد که در Kraków زندگی می‌کند، بعد دربارهٔ برادر اوا می‌پرسد.
    note: مارک برادر ندارد و فقط *tylko siostrę* (فقط یک خواهر) دارد. پرسیدن دربارهٔ برادر اوا اشکالی ندارد چون اوا قبلاً گفته که برادر دارد.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: اوا جواب می‌دهد
    gloss: اوا می‌گوید برادرش در Gdańsk زندگی می‌کند و یک پسر و یک دختر دارد.
    note: الگوی حالت مفعولی syn و córka از درس دوم همین واحد دوباره به کار رفته است.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: واکنش مارک
    gloss: 'مارک می‌گوید: چه خانوادهٔ خوبی!'
    note: '*Fajna* واژه‌ای غیررسمی و روزمره برای «خوب» یا «باحال» است و واکنشی طبیعی برای پایان گفت‌وگو؛ هم‌سطح *Świetnie!* در واحد ۴.'
