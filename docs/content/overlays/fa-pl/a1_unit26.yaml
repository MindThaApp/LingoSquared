  description: 'لهستانی مقدماتی برای صحبت درباره‌ی حیوانات خانگی و حیوانات رایج: اسم بردن از آن‌ها، مراقبت‌های ساده (پیاده‌روی، غذا دادن، بازی کردن)، گفتن اینکه عاشق چه حیواناتی هستید حتی اگر حیوان خانگی ندارید، و جمع بسته‌ی قاعده‌مند در لهستانی.'
