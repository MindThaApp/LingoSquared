    title: Marek و Kasia و Tomek درباره‌ی حیوانات
    gloss: 'Marek و Kasia هر دو عاشق حیوانات‌اند، ولی هیچ‌کدامشان حیوان خانگی ندارند. Marek عاشق سگ‌هاست و Kasia عاشق گربه‌ها. Tomek حیوان خانگی دارد: یک گربه. او اغلب با گربه‌اش بازی می‌کند و هر روز بهش غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      kochają: خیلی دوست دارد
      oboje: هر دو
      zwierzęta: حیوان‌ها
      zwierzaka: حیوان خانگی
      psy: سگ‌ها
      koty: گربه‌ها
      kota: گربه
      bawi: بازی می‌کند
      daje: می‌دهد
      co: هر
      jeść: غذا
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
