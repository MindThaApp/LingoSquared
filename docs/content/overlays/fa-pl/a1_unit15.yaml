  pl.a1.unit15.lesson01.teach.dworzec:
    title: ایستگاه
    gloss: ایستگاه
    note: جایی که قطارها و اتوبوس‌ها می‌یان و می‌رن؛ نقطهٔ شروع کل این درس.
    example_gloss: ایستگاه نزدیک هتله.
  pl.a1.unit15.lesson01.teach.bilet:
    title: بلیت
    gloss: بلیت
    note: قبل از سوار شدن به قطار یا اتوبوس به این نیاز دارید.
    example_gloss: بلیت بیست زلوتی قیمت داره.
  pl.a1.unit15.lesson01.teach.peron:
    title: سکو
    gloss: سکو
    note: جایی که واقعاً می‌ایستید و منتظر قطارتون می‌مونید.
    example_gloss: سکوی شمارهٔ یک اون‌جاست.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: سکوی شمارهٔ یک، دو، ...
    gloss: 'برای گفتن شمارهٔ سکو می‌تونید بگید Peron numer + عدد: Peron numer jeden، Peron numer dwa.'
    note: 'از چیزی که به نظر می‌رسه ساده‌تره: فقط *peron* + *numer* + یه عدد معمولی که از قبل بلدید. (در اعلام‌های ایستگاه معمولاً به‌جاش عددهای ترتیبی می‌گن، مثل *peron pierwszy* یعنی «سکوی یک»، ولی *peron numer jeden* همیشه فهمیده می‌شه.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: باز هم قطار
    gloss: Pociąg odjeżdża o czwartej po południu -- این جمله رو از درس ساعت می‌شناسید.
    note: همون واقعیت درس ساعت، این بار در یه صحنهٔ سفر.
  pl.a1.unit15.lesson01.teach.krakow:
    title: کراکوف
    gloss: کراکوف
    note: یه شهر واقعی لهستانی؛ اولین مقصد این درس.
    example_gloss: کراکوف دوره.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: به کراکوف
    gloss: 'وقتی داریم جایی می‌ریم، do + شکل دیگه‌ای از اسم شهر می‌گیم: do Krakowa (نه do Kraków). این شکل رو یک‌جا حفظ کنید.'
    note: سعی نکنید *Krakowa* رو از روی یه قاعده بسازید؛ فعلاً *do Krakowa* رو فقط مثل یه عبارت ثابت یاد بگیرید.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: یه بلیت به کراکوف، لطفاً
    gloss: یه بلیت به کراکوف، لطفاً.
    note: دقیقاً عبارتی که پشت باجهٔ بلیت‌فروشی می‌گید.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (با وسیلهٔ نقلیه رفتن): jadę (من می‌رم)، jedzie (او می‌ره). فردا می‌رم کراکوف. ماره‌ک می‌ره کراکوف.'
    note: 'فعلاً فقط دو شکل: *jadę* برای خودتون، *jedzie* برای یکی دیگه.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: ماره‌ک داره می‌ره کراکوف
    gloss: ماره‌ک فردا می‌ره کراکوف.
    note: سفر خود ماره‌ک؛ داستانش در گفتگوی این درس ادامه داره.
  pl.a1.unit15.lesson02.teach.autobus:
    title: اتوبوس
    gloss: اتوبوس
    note: راه معمول دیگه برای سفر بین شهرها.
    example_gloss: اتوبوس توی ایستگاهه.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: ورشو
    gloss: ورشو
    note: پایتخت لهستان؛ دومین مقصد این درس.
    example_gloss: ورشو دوره.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: به ورشو
    gloss: 'Warszawa جور دیگه‌ای از Kraków تغییر می‌کنه: do Warszawy (نه do Warszawa). هر شهر شکل مخصوص خودش رو داره؛ هر دو رو جدا حفظ کنید.'
    note: '*Krakowa* و *Warszawy* از یه الگو پیروی نمی‌کنن؛ برای همین هرکدوم رو جداگانه حفظ می‌کنیم، نه با یه قاعدهٔ مشترک.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: کجا (به کدوم سمت)
    gloss: به کجا
    note: دربارهٔ مقصد می‌پرسه، نه مکان؛ با پرسیدن «کجا هست» برای چیزی که از قبل یه جایی هست فرق داره.
    example_gloss: اتوبوس به کجا می‌ره؟
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: ساعت هفت، دوباره
    gloss: Siódmej -- این شکل ساعت رو از درس ساعت می‌شناسید (o siódmej = ساعت هفت).
    note: همون الگوی شکل ساعت، این بار برای زمان حرکت.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: اتوبوس ورشو ساعت هفت حرکت می‌کنه
    gloss: اتوبوس ورشو ساعت هفت حرکت می‌کنه.
    note: الگوهای مقصد و زمان این درس رو در یه جملهٔ واقعی کنار هم می‌ذاره.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: باز هم «کی»
    gloss: Kiedy -- این کلمه رو از درس تاریخ‌ها می‌شناسید. اتوبوس کی حرکت می‌کنه؟
    note: سؤال طبیعی قبل از هر سفر.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: اِوا داره می‌ره ورشو
    gloss: اِوا فردا می‌ره ورشو.
    note: سفر خود اِوا؛ داستانش در گفتگوی این درس کنار ماره‌ک ادامه داره.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: «من»، دوباره
    gloss: Ja -- این کلمه رو از درس‌های قبلی می‌شناسید.
    note: یه یادآوری کوتاه قبل از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: «مال من»، دوباره
    gloss: Mój -- این کلمه رو از درس خانواده می‌شناسید.
    note: یه یادآوری کوتاه قبل از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: ساعت ده صبح، دوباره
    gloss: Dziesiątej و rano -- هر دو شکل رو از درس ساعت می‌شناسید (o dziesiątej rano = ساعت ده صبح).
    note: یه یادآوری کوتاه قبل از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: ممنون و به امید دیدار
    gloss: Dziękuję و Do zobaczenia -- این‌ها رو از درس‌های قبلی می‌شناسید.
    note: یه یادآوری کوتاه قبل از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: سفر خوبی داشته باشید!
    gloss: Miłej podróży! یعنی برای کسی آرزوی سفر خوب می‌کنید؛ این رو مثل یه عبارت کامل به کار می‌بریم، نه کلمه‌به‌کلمه ترجمه‌اش کنیم.
    note: یه خداحافظی ثابت و اصطلاحی؛ اون رو یک‌جا یاد بگیرید، همون‌طور که *Dzień dobry* رو یاد گرفتید.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: ماره‌ک فردا می‌ره کراکوف
    gloss: فردا می‌رم کراکوف. قطارم ساعت چهار بعدازظهر حرکت می‌کنه.
    note: ماره‌ک با برنامهٔ سفر خودش شروع می‌کنه؛ همون چیزی که درس اول دربارهٔ او گفته بود.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: اِوا فردا می‌ره ورشو
    gloss: من می‌رم ورشو. اتوبوسم ساعت ده صبح حرکت می‌کنه.
    note: اِوا برنامهٔ خودش رو می‌گه؛ همون چیزی که درس دوم دربارهٔ او گفته بود.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: ماره‌ک برای اِوا آرزوی سفر خوب می‌کنه
    gloss: سفر خوبی داشته باشید!
    note: ماره‌ک با اصطلاح جدید این درس برای اِوا آرزوی خوشی می‌کنه.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: اِوا از ماره‌ک تشکر می‌کنه و خداحافظی می‌کنه
    gloss: ممنون! به امید دیدار!
    note: یه پایان ساده و آشنا برای گفتگو.
