teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: چه‌جور، هست، امروز، نه -- دوباره
    gloss: Jaka, jest, Dziś, nie -- این کلمه‌ها را از درس‌های قبلی می‌شناسید.
    note: یه یادآوری سریع پیش از این‌که این درس از این کلمه‌ها برای حرف زدن دربارهٔ آب‌وهوا استفاده کنه.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: آب‌وهوا
    gloss: هوا (وضع هوا)
    note: کلمهٔ کلی برای آب‌وهوا یا شرایط جوی.
    example_gloss: هوا چطوره؟
  pl.a1.unit19.lesson01.teach.zimno:
    title: سرد
    gloss: سرد
    note: دما را توصیف می‌کنه -- برای مذکر و مؤنث تغییر نمی‌کنه.
    example_gloss: هوا سرده.
  pl.a1.unit19.lesson01.teach.goraco:
    title: گرم
    gloss: گرم
    note: برعکس *zimno* -- اون هم برای مذکر و مؤنث تغییر نمی‌کنه.
    example_gloss: هوا گرمه.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: هوا سرده، هوا گرمه
    gloss: 'Jest zimno. Jest gorąco. -- توی لهستانی آب‌وهوا را این‌طوری توصیف می‌کنیم: *jest* به‌اضافهٔ یه کلمهٔ آب‌وهوایی، بدون هیچ تطابق جنسیتی.'
    note: همین الگوی ساده برای همهٔ کلمه‌های آب‌وهوایی این واحد جواب می‌ده.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: هوا چطوره؟
    gloss: هوا چطوره؟
    note: یه راه طبیعی برای پرسیدن از وضع هوای الان.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: امروز هوا سرده
    gloss: امروز هوا سرده.
    note: واقعیتی که کل این درس درباره‌ی هوای امروز روی آن بنا شده.
  pl.a1.unit19.lesson02.teach.pada:
    title: باران می‌آید
    gloss: باران می‌آید
    note: بدون فاعل و تنها به کار می‌رود؛ در لهستانی برای گفتن «باران می‌آید» همین شکل عادی است.
    example_gloss: امروز بارون میاد.
  pl.a1.unit19.lesson02.teach.snieg:
    title: برف
    gloss: برف
    note: کلمه‌ی «برف»؛ وقتی با *pada* بیاید یعنی «برف می‌آید».
    example_gloss: برف می‌آید.
  pl.a1.unit19.lesson02.teach.mgla:
    title: مه
    gloss: مه
    note: یکی دیگر از حالت‌های رایج هوا.
    example_gloss: هوا مه‌آلود است.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: خوب
    gloss: Pogoda jest dobra. -- «*dobra*» با اسم‌های مؤنث مثل «*pogoda*» می‌آید.
    note: شکل مؤنث «*dobry*» (مثل *Dzień dobry*)؛ همان الگوی -y/-a در *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: افتضاح
    gloss: Jaka straszna pogoda! -- «*straszna*» هم مثل «*dobra*» با «*pogoda*» می‌آید.
    note: کلمه‌ای قوی است؛ فقط برای هوای واقعاً بد به کار ببرید.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: چه هوای افتضاحی!
    gloss: چه هوای افتضاحی!
    note: جمله‌ی تعجبی طبیعی درباره‌ی هوای بد.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: هوا خوب است
    gloss: هوا خوب است.
    note: استفاده‌ی دوباره از کلمه‌ی «هوا» که قبلاً در همین درس دیدید.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: بله، و، من، هم – دوباره
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- این کلمه‌ها را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه پیش از گفت‌وگوی این درس.
  pl.a1.unit19.lesson03.teach.bo:
    title: چون
    gloss: چون
    note: یک برنامه را به دلیلش، یعنی هوا، وصل می‌کند.
    example_gloss: به پارک نمی‌روم، چون باران می‌آید.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: نمی‌خواهم بروم، چون باران می‌آید
    gloss: نمی‌خواهم به پارک بروم، چون باران می‌آید.
    note: توصیف هوا همراه با یک برنامه‌ی واقعی؛ دقیقاً همان چیزی که این درس به آن می‌رسد.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: در کراکوف – دوباره
    gloss: W Krakowie -- این را از درس‌های قبل می‌شناسید، مثلاً «Ona mieszka w Krakowie» (او در کراکوف زندگی می‌کند).
    note: یک یادآوری کوتاه پیش از اینکه گفت‌وگوی این درس هوای دو شهر را مقایسه کند.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: مارک درباره‌ی هوا می‌پرسد
    gloss: امروز هوا چطوره؟
    note: مارک گفت‌وگو را با پرسیدن درباره‌ی هوای امروز شروع می‌کند.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: اوا جواب می‌دهد
    gloss: باران می‌آید. هوا سرد است.
    note: اوا هوای واقعی امروز را توصیف می‌کند.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: مارک واکنش نشان می‌دهد و برنامه می‌ریزد
    gloss: چه هوای افتضاحی! نمی‌خواهم به پارک بروم، چون باران می‌آید.
    note: مارک به هوا واکنش نشان می‌دهد و برنامه‌اش را به‌خاطر آن می‌گوید.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: اوا موافقت می‌کند
    gloss: من هم به پارک نمی‌روم.
    note: اوا همان برنامه‌ی مارک را دارد.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: مارک درباره‌ی کراکوف می‌پرسد
    gloss: در کراکوف چطور؟ آنجا هوا چطور است؟
    note: مارک بحث را به هوای شهری دیگر می‌برد.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: اوا جواب می‌دهد
    gloss: در کراکوف برف می‌آید. آنجا خیلی سرد است.
    note: اوا هوای متفاوت و سردتر کراکوف را توصیف می‌کند.
