teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*Zadzwonię* آینده‌ی کامل فعل *zadzwonić* (زنگ زدن، یک بار) است. در لهستانی برای قول دادن از آن استفاده می‌شود، مثل «بهت زنگ می‌زنم».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: جواب دادن به تلفن
    gloss: الو، اِوا هستم.
    note: '*Tu* + اسم (تحت‌اللفظی «اینجا ...») روش معمول معرفی خود در تلفن است. در فارسی هم می‌گوییم «... هستم»، ولی در لهستانی از tu استفاده می‌شود.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: مارک هم همین‌طور جواب می‌دهد
    gloss: الو، مارک هستم.
    note: همان الگوی *tu* + اسم در *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Z kim rozmawiam?* (تحت‌اللفظی «با چه کسی دارم صحبت می‌کنم؟») عبارت معمول برای تماس‌گیرنده‌ی ناشناس است؛ *kim* حالت ابزاری است که بعد از *z* می‌آید.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: معرفی رسمی خود
    gloss: شما با اِوا صحبت می‌کنید.
    note: '*Rozmawia pan z Ewą* شکل رسمی است: *pan* (برای مرد) یا *pani* (برای زن) با فعل سوم‌شخص، و *z* + حالت ابزاری.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*Możesz* (می‌تونی، از *móc*) + مصدر *powtórzyć* (تکرار کردن) + *to* (این/آن).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*Nie mów* امر منفی است (حرف نزن)؛ *tak szybko* یعنی «این‌قدر تند».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: '*Nie słyszę cię dobrze* مشکل شنیدن را بیان می‌کند؛ *cię* حالت مفعولی *ty* است و *dobrze* یعنی «خوب».'
  pl.a1.unit22.lesson04.teach.sms:
    title: پیامک
    gloss: پیام متنی
    note: '*SMS* اسم مذکر است: *ten SMS*. در فارسی جنسیت دستوری نداریم، ولی در لهستانی هر اسمی جنسیت دارد.'
    example_gloss: پیامک از اِوا است.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: بهت پیام می‌دم.
    note: '*Wysłać* (فرستادن) برای شخص حالت دایی *ci* (برای تو) و برای چیزِ فرستاده‌شده حالت مفعولی می‌گیرد: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: '*Oddzwonić* (دوباره زنگ زدن) در لهستانی یک فعل واحد است: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: خواندن گفتگوی پیامکی
    gloss: 'مارک: سلام اِوا، می‌شه بهم زنگ بزنی؟ باید یه چیزی بهت بگم. اِوا: آره، حتماً، پنج دقیقه‌ی دیگه بهت زنگ می‌زنم.'
    note: دقت کنید مارک چه چیزی می‌خواهد، چرا، و اِوا می‌گوید کی دوباره زنگ می‌زند.
    glosses:
      Cześć: سلام
      możesz: می‌تونی
      zadzwonić: زنگ زدن
      Muszę: باید
      coś: یه چیزی
      powiedzieć: گفتن
      oczywiście: حتماً
      oddzwonię: زنگ زدن
      pięć: پنج
      minut: دقیقه
      za: پس دادن
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: مارک تلفن را جواب می‌دهد
    gloss: 'مارک: الو، مارک هستم.'
    note: 'همان الگوی *tu* + اسم از درس اول، این بار در یک تماس واقعی: کسی که گوشی را برمی‌دارد اول حرف می‌زند و اسمش را می‌گوید.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: اِوا خودش را معرفی می‌کند
    gloss: 'اِوا: سلام مارک، اِوا هستم. مارک: چه خوب که زنگ زدی!'
    note: '*Fajnie, że* ... (چه خوب که ...) واکنشی مثبت به یک اتفاق است؛ *że* جمله‌ی بعدی را وصل می‌کند.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: اِوا درباره‌ی شیفت می‌پرسد
    gloss: 'اِوا: اولین شیفتت چطور بود؟'
    note: '*Jak ci poszła ...?* (تحت‌اللفظی «... برات چطور رفت؟») درباره‌ی چیزی می‌پرسد که قبلاً اتفاق افتاده. *Ci* حالت دایی *ty* است و *poszła* با اسم مؤنث *zmiana* مطابقت دارد.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: مارک خبر خوب می‌دهد
    gloss: 'مارک: خیلی خوب گذشت، بهتر از چیزی که فکر می‌کردم.'
    note: '*Poszło* گذشته‌ی *iść* با پایان *-o* است («آن»؛ اینجا یعنی «پیش رفتن»)؛ *myślałem* گذشته‌ی *myśleć* (فکر کردن) با پایانِ گوینده‌ی مرد است.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'زمان گذشته: było، poszło، myślałem'
    gloss: 'زمان گذشته: *było* (بود) از *być* (بودن)، *poszło* (رفت) از *iść* (رفتن)، *myślałem* (فکر می‌کردم) از *myśleć* (فکر کردن).'
    note: 'گذشته در لهستانی با *-ł-* به‌اضافه‌ی پایانِ جنسیت ساخته می‌شود: *myślał* (او، مرد)، *myślała* (او، زن)، *było* (آن). فعلاً *było*، *poszło* و *myślałem* را به‌صورت عبارت‌های ثابت در همین موقعیت‌های درس یاد بگیرید.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: اِوا افتخار می‌کند
    gloss: 'اِوا: چه خوب که اینو می‌شنوم! بهت افتخار می‌کنم.'
    note: '*Dumny z* (مغرور/سربلند از) ترکیبی ثابت است: *z* + حالت اضافی، پس *z ciebie*. اِوا زن است، برای همین *dumna* می‌گوید.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: مارک تحت تأثیر قرار می‌گیرد
    gloss: 'مارک: خیلی ممنون، این برام خیلی ارزش داره.'
    note: '*Znaczy* شکل *on/ona/ono* فعل *znaczyć* (یعنی داشتن، معنی دادن) است؛ *dla mnie* (برای من) نشان می‌دهد این موضوع برای چه کسی اهمیت دارد.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Jego* (مال او، مرد) هیچ‌وقت تغییر نمی‌کند و قبل از اسم می‌آید: *jego pierwsza zmiana*؛ مؤنث بودن اسم روی آن اثری ندارد.'
