teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: هست، هستند، این، لطفاً — دوباره
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do — این کلمه‌ها را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه، قبل از اینکه این درس از این کلمه‌ها برای صحبت درباره‌ی خرید لباس استفاده کند.
  pl.a1.unit20.lesson01.teach.sklep:
    title: مغازه
    gloss: مغازه / فروشگاه
    note: کلمه‌ی عمومی برای مغازه.
    example_gloss: دارم می‌روم مغازه.
  pl.a1.unit20.lesson01.teach.koszula:
    title: پیراهن
    gloss: پیراهن
    note: اسم مؤنث است — صفت‌هایش هم شکل مؤنث می‌گیرند.
    example_gloss: این یک پیراهن است.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: شلوار
    gloss: شلوار
    note: در لهستانی همیشه جمع است، حتی برای یک شلوار — شکل مفرد ندارد.
    example_gloss: این‌ها شلوار هستند.
  pl.a1.unit20.lesson01.teach.kupic:
    title: خریدن
    gloss: خریدن
    note: 'بعد از ''*chcę*'' (می‌خواهم) می‌آید، درست مثل ''*iść*'' (رفتن) در یک درس قبلی: ''*chcę kupić*'' — می‌خواهم بخرم.'
    example_gloss: می‌خواهم یک پیراهن بخرم.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: می‌خواهم شلوار بخرم
    gloss: می‌خواهم شلوار بخرم.
    note: همان الگوی chcę + مصدر، این بار با شلوار.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: پیراهن چند است؟
    gloss: پیراهن چند است؟
    note: روشی طبیعی برای پرسیدن قیمت یک جنس مشخص؛ همان '*Ile kosztuje*' درس خرید است.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: چه جور — شکل مذکر
    gloss: Jaki, Jaka — '*Jaki*' درباره‌ی اسم‌های مذکر می‌پرسد و '*Jaka*' درباره‌ی اسم‌های مؤنث (شما '*Jaka*' را از درس هوا می‌شناسید).
    note: '''*Kolor*'' (رنگ) مذکر است، برای همین با ''*Jaki*'' می‌آید، نه ''*Jaka*''.'
  pl.a1.unit20.lesson02.teach.kolor:
    title: رنگ
    gloss: رنگ
    note: یک اسم مذکر.
    example_gloss: چه رنگی؟
  pl.a1.unit20.lesson02.teach.sukienka:
    title: لباس زنانه
    gloss: پیراهن زنانه (لباس)
    note: یک اسم مؤنث دیگر، مثل '*koszula*'.
    example_gloss: این یک پیراهن زنانه است.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: آبی
    gloss: Koszula jest niebieska. — '*niebieska*' با اسم‌های مؤنث مثل '*koszula*' جور است.
    note: فقط همین شکل — فعلاً در این دوره به '*koszula*' وابسته است.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: قرمز
    gloss: Sukienka jest czerwona. — '*czerwona*' هم با اسم‌های مؤنث جور است، درست مثل '*niebieska*'.
    note: این شکل در اینجا به '*sukienka*' وابسته است، همان‌طور که '*niebieska*' به '*koszula*'.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: پیراهن آبی است
    gloss: پیراهن آبی است.
    note: جمله‌ای که این واحد بعداً دوباره به کار می‌برد، وقتی مارک دنبال پیراهن می‌گردد.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: لباس زنانه قرمز است
    gloss: لباس زنانه قرمز است.
    note: همان الگوی jest + رنگ برای یک جنس دیگر.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: روز بخیر، لطفاً، خیلی — دوباره
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co — این کلمه‌ها را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه قبل از گفت‌وگوی این درس در مغازه.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: سایز
    gloss: سایز
    note: اندازه‌ی لباس در لهستان معمولاً فقط با حرف‌های S، M و L مشخص می‌شود.
    example_gloss: چه سایزی؟
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: آقا، می‌خواهد
    gloss: Co pan chce kupić? — '*pan*' شکل محترمانه‌ی خطاب به یک مرد است، درست مثل '*pani*' برای یک زن (شما '*pani*' را از درس خرید می‌شناسید).
    note: '''*chce*'' شکل او (مفرد سوم‌شخص) فعل ''*chcieć*'' است — ''*chcę*'' (می‌خواهم) و ''*chcesz*'' (می‌خواهی) را قبلاً یاد گرفته‌اید.'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: آقا، چه می‌خواهید بخرید؟
    gloss: آقا، چه می‌خواهید بخرید؟
    note: فروشنده این‌طور مؤدبانه صحبت را با یک مشتری مرد شروع می‌کند.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: فروشنده به مارک سلام می‌کند
    gloss: روز بخیر! آقا، چه می‌خواهید بخرید؟
    note: Sprzedawca (فروشنده) با همان لحن مؤدبانه‌ای شروع می‌کند که مغازه‌دار بازار در واحد خرید قبلی داشت.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: مارک می‌گوید چه می‌خواهد
    gloss: می‌خواهم یک پیراهن و شلوار بخرم.
    note: مارک هر دو چیزی را که دنبالشان است می‌گوید.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: فروشنده سایز را می‌پرسد
    gloss: چه سایزی؟
    note: چه سایزی؟
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: مارک سایزش را می‌گوید
    gloss: سایز M.
    note: مارک فقط با حرف سایز جواب می‌دهد، که طبیعی‌ترین راه است.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: فروشنده موجودی و قیمت را تأیید می‌کند
    gloss: یک پیراهن آبی و شلوار داریم. روی هم صد زلوتی.
    note: '''*Mamy*'' یعنی «داریم» (مثل ''*mam*''/''*masz*''). بعد از آن ''*koszula*'' به ''*koszulę*'' و ''*niebieska*'' به ''*niebieską*'' تغییر می‌کند — همان تغییری که در ''*Chcę kupić koszulę*'' دیدید. رنگ هم با پیراهن آبیِ درس دوم یکی است.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: مارک قبول می‌کند
    gloss: خوب است، برمی‌دارم.
    note: مارک خرید را تأیید می‌کند و گفت‌وگو تمام می‌شود.
