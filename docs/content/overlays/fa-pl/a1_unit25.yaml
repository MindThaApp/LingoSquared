teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Wysoki* برای آدم قدبلند و *niski* برای آدم قدکوتاه است. برای یک خانم می‌گوییم *wysoka* یا *niska*.'
    example_gloss:
    - کاشا قدبلند است.
    - تومک قدکوتاه است.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Stary* و *młody* اینجا یک تصور کلی را بیان می‌کنند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - پدربزرگ مسنه.
    - مارک جوان است.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: تصور کلی یا سن'
    gloss: '*Stary* یک تصور کلی را بیان می‌کند، مثل *Dziadek jest stary*. برای گفتن سن دقیق، لهستانی ساختار دیگری دارد: *Ile masz lat?*'
    note: اینکه کسی پیر یا جوان به نظر می‌رسد را با *stary* یا *młody* می‌گویید؛ برای سن دقیق می‌پرسید *Ile masz lat?* و جواب می‌دهید *mam ... lat* (من ... سال دارم).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: کاشا قدبلند است و تومک قدکوتاه
    gloss: کاشا قدبلند است و تومک قدکوتاه.
    note: یک جمله‌ی ساده با *a* (و، به معنی تقابل). *Wysoka* و *niski* با فاعل مؤنث و مذکر هماهنگ می‌شوند و زمینه را برای مقایسه در درس پنجم آماده می‌کنند.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: مو
    gloss: مو
    note: '*Włosy* در لهستانی همیشه جمع است: *długie włosy* (موی بلند).'
    example_gloss: مارک موهای کوتاه مشکی دارد.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: سه رنگ مو. *Blond* هیچ‌وقت تغییر نمی‌کند؛ *brązowe* و *siwe* شکل جمع‌اند تا با *włosy* هماهنگ شوند.
    example_gloss:
    - اوا موهای بلوند دارد.
    - تومک موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Długie* (بلند) و *krótkie* (کوتاه) شکل جمع‌اند تا با *włosy* هماهنگ شوند.'
    example_gloss:
    - کاشا موهای بلند دارد.
    - تومک موهای کوتاه دارد.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy صفت جمع می‌گیرد
    gloss: '*Włosy* جمع است، پس صفت هم جمع می‌شود: موی بلند، موی کوتاه، موی قهوه‌ای، موی مشکی.'
    note: 'اسم‌های جمعی که مذکرِ انسان نیستند، صفتی با پایان *-e* می‌گیرند: *długie włosy*. فقط *blond* استثنا است: هیچ‌وقت تغییر نمی‌کند (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: همیشه جمع'
    gloss: '*Włosy* (مو) همیشه جمع است: *jej włosy są długie* (موهایش بلند است؛ تحت‌اللفظی: «موهایش بلندند»). *Jej* یعنی «او (زن)، مال او».'
    note: در لهستانی، مو اسم جمع است، پس فعل و صفت هم جمع می‌شوند. *Jej* («مال او») تغییر نمی‌کند، حتی اگر چیزهای زیادی مال او باشد.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: مارک موهای کوتاه مشکی دارد
    gloss: مارک موهای کوتاه مشکی دارد.
    note: '*Czarne* (مشکی) شکل جمع است تا با *włosy* هماهنگ شود.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: اوا موهای بلند بلوند دارد
    gloss: اوا موهای بلند بلوند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  pl.a1.unit25.lesson03.teach.oczy:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Oczy* جمع *oko* است؛ در لهستانی معمولاً هر دو چشم را با شکل جمع می‌گویند.'
    example_gloss: مارک چشم‌های قهوه‌ای دارد.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: 'سه رنگ چشم، به شکل جمع تا با *oczy* هماهنگ باشند: *niebieskie*، *brązowe*، *zielone*.'
    example_gloss:
    - اوا چشم‌های آبی دارد.
    - تومک چشم‌های قهوه‌ای دارد.
    - کاشا چشم‌های سبز دارد.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy پایان -e می‌گیرد
    gloss: '*Oczy* جمع است، پس صفت با *-e* تمام می‌شود: چشم آبی، چشم قهوه‌ای، چشم سبز.'
    note: 'همان پایان جمع که در درس دوم با *włosy* دیدید: *niebieskie oczy*، *brązowe oczy*، *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: اوا چه شکلی است؟
    gloss: اوا چه شکلی است؟
    note: '*Jak wygląda ...?* سؤال اصلی این واحد است؛ با آن می‌توانید درباره‌ی ظاهر هر کسی بپرسید.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: اوا موهای بلند بلوند و چشم‌های آبی دارد
    gloss: اوا موهای بلند بلوند و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *i* (و) در یک جمله می‌آورد.
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: اوا نینا را معرفی می‌کند
    gloss: 'اوا: یک دختر تازه به کافه‌ی زبان می‌آید. اسمش نینا است.'
    note: '*Przychodzi* (دارد می‌آید) آدمی تازه را وارد صحنه می‌کند؛ در *do kawiarni językowej* بعد از *do* حالت اضافه‌ای می‌آید.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: مارک می‌پرسد او چه شکلی است
    gloss: 'مارک: باشه! چه شکلی است؟'
    note: همان سؤال اصلی این واحد، این بار با *ona* (او، زن) به جای اسم.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: اوا قد و موی نینا را توصیف می‌کند
    gloss: 'اوا: قدش کوتاه است و موهای کوتاه بلوند دارد.'
    note: '*niska* از درس اول (شکل مؤنث *niski*) را با واژه‌های مو از درس دوم ترکیب می‌کند.'
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: مارک درباره‌ی چشم‌هایش می‌پرسد
    gloss: 'مارک: چشم‌هایش چی؟'
    note: '*Jej* اینجا یعنی «مال او (زن)»، پس *jej oczy* یعنی «چشم‌های او»؛ *jej* هیچ‌وقت تغییر نمی‌کند.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: اوا چشم‌های نینا را توصیف می‌کند
    gloss: 'اوا: چشم‌های سبز دارد.'
    note: '*zielone oczy* از درس سوم دوباره آمده است.'
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: مارک او را می‌شناسد
    gloss: 'مارک: مرسی! پس می‌شناسمش.'
    note: '*Rozpoznam* آینده‌ی کامل است («خواهم شناخت»)؛ *ją* حالت مفعولی *ona* (او، زن) است.'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: مقایسه‌ی تومک و کاشا
    gloss: تومک و کاشا برادر و خواهرند، ولی ظاهرشان فرق دارد. تومک قدکوتاه است و موهای کوتاه قهوه‌ای و چشم‌های قهوه‌ای دارد. قد کاشا از تومک بلندتر است و موهای بلند قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      brat: برادر
      siostra: خواهر
      wyglądają: به نظر رسیدن
      inaczej: متفاوت
      niski: کوتاه‌قد
      krótkie: کوتاه‌قد
      brązowe: قهوه‌ای
      włosy: مو
      oczy: چشم‌ها
      wyższa: قدبلندتر
      długie: بلند
      zielone: سبز
      wyglądasz: ظاهر تو چه شکلی است (خودمانی)
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: استفاده‌ی دوباره از صفت تفضیلی
    gloss: 'صفت تفضیلی: *wysoki* (قدبلند) می‌شود *wyższy* (قدبلندتر) و نفر مقابل بعد از *niż* (از) می‌آید: قد کاشا از تومک بلندتر است.'
    note: 'در لهستانی صفت تفضیلی با عوض شدن پایان صفت ساخته می‌شود و صفت هنوز با جنسیت هماهنگ می‌شود: برای کاشا (مؤنث) می‌شود *wyższa*.'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: موهای کاشا از موهای تومک بلندتر است
    gloss: موهای کاشا از موهای تومک بلندتر است.
    note: '*Dłuższe* (بلندتر) جمع است تا با *włosy* هماهنگ شود، و *niż* (از) مقایسه را وارد می‌کند.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: یک جمله‌ی نمونه با *Mam ...* برای وقتی که می‌خواهید ظاهر خودتان را توصیف کنید.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek، Nina را می‌بیند
    gloss: 'Marek: ببین، این Nina است؟ موهای کوتاه و بلوند و چشم‌های سبز دارد.'
    note: '*Patrz* (نگاه کن) فعل امر از *patrzeć* است. *Czy to Nina?* یعنی «این Nina است؟»'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa تأیید می‌کند
    gloss: 'Ewa: بله، این Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina به Marek سلام می‌کند
    gloss: 'Nina: سلام، شما Marek هستید؟'
    note: 'یک سؤال ساده‌ی سلام و احوال‌پرسی خودمانی. بعد از *być*، اسم شخص در حالت ابزاری می‌آید: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek هم به Nina سلام می‌کند
    gloss: 'Marek: بله! از آشنایی با شما خوشبختم، Nina.'
    note: '*Miło cię poznać* عبارت معمول اولین دیدار است («از آشنایی خوشحالم»؛ *poznać* یعنی «آشنا شدن»). Nina در حالت ندا صدا زده شده: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: 'پایان گفت‌وگو: Marek با توصیف قبلی Ewa توانست Nina را بشناسد.'
