    - Ewa موهای بلند و قهوه‌ای دارد.
    - Ewa موهای سفید دارد.
    accepted_answers:
    - value: اوا موهای بلند بلوند دارد.
      status: correct
    feedback: Ewa ma długie blond włosy.
  pl.a1.unit25.lesson02.exercise02.listen_marek_ma_krotkie:
    instruction: گوش بدهید و چیزی را که گوینده می‌گوید انتخاب کنید.
    correct_option: مارک موهای کوتاه مشکی دارد.
    distractors:
