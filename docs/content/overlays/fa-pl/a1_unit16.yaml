teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: درد می‌کنه
    gloss: 'Boleć (درد کردن)، زمان حال: boli (او) و bolą (آن‌ها). Głowa mnie boli یعنی «سرم درد می‌کنه» -- تحت‌اللفظی «سر به من درد می‌کنه».'
    note: برای دردها، فعل *boleć* در زمان حال فقط همین دو شکل را داره -- عضو بدن نهاد جمله است و *mnie* می‌گه مال کیه، پس اینجا شکل «من درد می‌کنم» وجود نداره.
  pl.a1.unit16.lesson01.teach.glowa:
    title: سر
    gloss: سر
    note: رایج‌ترین چیزی که آدم می‌گه درد می‌کنه.
    example_gloss: سرم درد می‌کنه.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: گلو
    gloss: گلو
    note: برای توصیف سرماخوردگی یا گلودرد به کار میاد.
    example_gloss: گلویم درد می‌کند.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: شکم
    gloss: شکم
    note: بعد از یک غذای سنگین یا وقتی چیزی به شما نمی‌سازه به کار میاد.
    example_gloss: شکمم درد می‌کند.
  pl.a1.unit16.lesson01.teach.zeby:
    title: دندان‌ها
    gloss: دندان‌ها
    note: اینجا همیشه جمع به کار می‌ره، درست مثل چیزی که یک لهستانی واقعاً می‌گه -- برای همین *bolą* (نه *boli*) باهاش میاد.
    example_gloss: دندان‌هام درد می‌کنن.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: چی دردت می‌کنه؟
    gloss: چی دردت می‌کنه؟
    note: سؤال طبیعی برای کسی که حالش خوب نیست.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: حالتان چطور است؟
    gloss: 'Czuć się (احساس کردن): czuję się (من)، czujesz się (تو). حالت چطوره؟'
    note: فعلاً فقط دو شکل -- *czuję* برای خودتان، *czujesz* برای پرسیدن از کس دیگه.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: خوب و بد
    gloss: حالم خوبه. حالم بده. -- dobrze را از قبل بلدید، źle ضد اونه.
    note: همون *dobrze* که از همون درس اول به کار برده‌اید، حالا کنار ضدش.
  pl.a1.unit16.lesson02.teach.zle:
    title: بد
    gloss: بد
    note: کلمه‌ای که برای گفتن اینکه حالتان خوب نیست لازم دارید.
    example_gloss: حالم بده.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: تب
    gloss: تب
    note: یک نشانه‌ی ساده و رایج که باید اسمش را بدونید.
    example_gloss: تب دارم.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa، ma -- دوباره
    gloss: Ewa, ma -- این اسم و این شکل فعل mieć (داشتن) را از درس‌های قبل می‌شناسید (Mam, masz, ma).
    note: یادآوری کوتاه قبل از اینکه این درس از هر دو استفاده کنه.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: بیمار
    gloss: بیمار (مذکر) / بیمار (مؤنث)
    note: همون الگوی -y/-a که با *młodszy/starsza* یاد گرفتید -- *chory* برای مرد، *chora* برای زن.
    example_gloss:
    - او (مرد) بیماره.
    - او (زن) بیماره.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa حالش خوب نیست
    gloss: حالم بده. تب دارم.
    note: Ewa نشانه‌های خودش را توصیف می‌کنه -- همون چیزی که در گفت‌وگوی این بخش دوباره می‌گه.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek، دوباره
    gloss: Marek -- این اسم را از درس‌های قبل می‌شناسید.
    note: یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: «و»، دوباره
    gloss: I -- این کلمه را از درس‌های قبل می‌شناسید.
    note: یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: «لطفاً» و «آب»، دوباره
    gloss: Proszę و wodę -- هر دو کلمه را از درس‌های قبل می‌شناسید.
    note: یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: «ممنون»، دوباره
    gloss: Dziękuję -- این کلمه را از درس‌های قبل می‌شناسید.
    note: یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: استراحت کردن
    gloss: استراحت کردن
    note: درست مثل وقتی که از کسی می‌خواهید مستقیم برود یا به سمتی بپیچه، با *Proszę* میاد -- *Proszę* + مصدر، بدون نیاز به امر.
    example_gloss: لطفاً استراحت کنید.
  pl.a1.unit16.lesson03.teach.pic:
    title: نوشیدن
    gloss: نوشیدن
    note: یک مصدر دیگه که به همین شکل بعد از *Proszę* میاد.
    example_gloss: لطفاً آب بنوشید.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek می‌پرسه حال Ewa چطوره
    gloss: Ewa، حالت چطوره؟
    note: Marek می‌بینه یه مشکلی هست و مستقیم می‌پرسه.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa نشانه‌هاش را توضیح می‌ده
    gloss: حالم بده. گلوم درد می‌کنه و تب دارم.
    note: Ewa دو نشانه را واضح می‌گه -- همون چیزهایی که قبلاً در همین بخش دیدیم.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek یک توصیه‌ی ساده می‌کنه
    gloss: لطفاً استراحت کنید و آب بنوشید.
    note: توصیه‌ای ساده و غیرتخصصی -- دستور پزشکی نیست، فقط عقل سلیمه.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa از Marek تشکر می‌کنه
    gloss: باشه، ممنون Marek.
    note: پایان ساده و آشنای گفت‌وگو.
