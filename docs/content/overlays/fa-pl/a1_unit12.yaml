teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: دیروز
    gloss: دیروز
    note: کلمه‌ی پایه برای صحبت درباره‌ی روزی که به‌تازگی تمام شده -- به‌طور طبیعی با شکل‌های گذشته‌ای که در این درس یاد می‌گیرید می‌آید.
    example_gloss: دیروز سینما بودم.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: دیروز چی شد؟
    gloss: دیروز چی شد؟
    note: روش طبیعی برای خواستنِ تعریفِ یک اتفاقِ اخیر -- było برای جواب‌دهنده عوض نمی‌شود، پس این سؤال را از هر کسی می‌توانید بپرسید.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było شکلِ گذشته‌ی «آن» (خنثی) از فعل być (بودن) است -- با co (چه) هماهنگ است، برای همین وقتی کلی می‌پرسیم چه اتفاقی افتاد به کار می‌رود: Co było wczoraj? همیشه همین یک کلمه است، هر که جواب بدهد.'
    note: '*Było* شکلِ خنثیِ «بود» است -- با *co* (چه) جور است، نه با کسی که ازش می‌پرسید؛ پس در سؤال باز مثل *Co było wczoraj?* یعنی «چی شد» یا «چه خبر بود».'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: من بودم (مرد / زن)
    gloss: من بودم (مرد می‌گوید) / من بودم (زن می‌گوید)
    note: 'گذشته در لهستانی جنسیتِ گوینده را نشان می‌دهد: اگر مرد حرف بزند byłem و اگر زن حرف بزند byłam. هر دو یعنی «من بودم».'
    example_gloss:
    - دیروز سینما بودم.
    - دیروز سینما بودم.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'گذشته: -em یا -am'
    gloss: 'فعل‌های گذشته بسته به جنسیتِ گوینده پایانِ متفاوتی دارند: وقتی مرد حرف می‌زند -em (byłem) و وقتی زن حرف می‌زند -am (byłam). این برای همه‌ی فعل‌ها در گذشته صدق می‌کند، نه فقط być.'
    note: 'به حرف‌های آخر دقت کنید: *-em* نشانه‌ی گوینده‌ی مرد و *-am* نشانه‌ی گوینده‌ی زن است. همین الگو را در همه‌ی فعل‌های گذشته‌ی این درس می‌بینید.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: در سینما
    gloss: 'Kino بعد از w پایانش عوض می‌شود: idę do kina (به کجا؟) شکلی متفاوت از jestem w kinie (کجا؟) دارد. W kinie حالتِ مکانی است -- می‌گوید چیزی کجا اتفاق می‌افتد، نه کسی به کجا می‌رود.'
    note: 'دو پایان، دو سؤالِ متفاوت: *do kina* جوابِ «به کجا؟» است (در درس برنامه‌ها یاد گرفتید) و *w kinie* جوابِ «کجا؟» -- این دو را با هم قاطی نکنید.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: دیروز سینما بودم (مرد)
    gloss: دیروز سینما بودم.
    note: byłem، wczoraj و w kinie را کنار هم می‌گذارد -- همان‌طور که یک مرد می‌گوید کجا بوده.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: دیروز سینما بودم (زن)
    gloss: دیروز سینما بودم.
    note: همان جمله با byłam -- همان‌طور که یک زن می‌گوید کجا بوده.
  pl.a1.unit12.lesson02.teach.film:
    title: فیلم
    gloss: فیلم
    note: کلمه‌ای روزمره برای گفتن اینکه چه چیزی تماشا کرده‌اید -- وقتی از رفتن به سینما تعریف می‌کنید مدام به کار می‌آید.
    example_gloss: یک فیلم خوب دیدم.
  pl.a1.unit12.lesson02.teach.dobry:
    title: خوب
    gloss: خوب
    note: dobry را قبلاً در dzień dobry (روز بخیر) دیده‌اید -- اینجا تنهایی و به‌عنوان یک صفت معمولی به معنی «خوب» آمده.
    example_gloss: یک فیلم خیلی خوب!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: من دیدم (مرد / زن)
    gloss: من دیدم (مرد می‌گوید) / من دیدم (زن می‌گوید)
    note: Zobaczyć یک بار دیدنِ تمام‌شده را می‌گوید (برخلاف widzieć که دیدنِ ادامه‌دار است) -- مرد می‌گوید zobaczyłem و زن می‌گوید zobaczyłam، همان الگوی -em/-am مثل byłem/byłam.
    example_gloss:
    - یک فیلم خوب دیدم.
    - یک فیلم خوب دیدم.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: همان الگوی byłem/byłam
    gloss: 'همان الگوی byłem/byłam: zobaczyłem را مرد می‌گوید و zobaczyłam را زن. Zobaczyć فعلِ کامل است -- یک اتفاقِ تمام‌شده را بیان می‌کند.'
    note: 'همان پایان، فعلی تازه: *zobaczyłem/zobaczyłam* دقیقاً از الگوی *byłem/byłam* که الان یاد گرفتید پیروی می‌کند.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: من درست کردم / انجام دادم (مرد / زن)
    gloss: من درست کردم / انجام دادم (مرد می‌گوید) / من درست کردم / انجام دادم (زن می‌گوید)
    note: Zrobić هم «ساختن» است و هم «انجام دادن» برای یک کارِ تمام‌شده -- مرد zrobiłem و زن zrobiłam می‌گوید، باز هم همان الگو.
    example_gloss:
    - ناهار درست کردم.
    - ناهار درست کردم.
  pl.a1.unit12.lesson02.teach.obiad:
    title: ناهار
    gloss: ناهار / وعده‌ی غذایی ظهر
    note: شاید obiad را از درس برنامه‌ی روزانه یادتان باشد -- اینجا غذای اصلیِ روز است که مارک درست می‌کند.
    example_gloss: این یک ناهار خوشمزه است.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: خوشمزه
    gloss: خوشمزه
    note: روشی گرم و روزمره برای تعریف از غذا -- درست بعد از obiad طبیعی به کار می‌آید.
    example_gloss: این یک ناهار خوشمزه است.
  pl.a1.unit12.lesson03.teach.jaki:
    title: چه جور / کدام
    gloss: چه جور / کدام
    note: 'jaki را قبلاً برای پرسیدن شماره تلفن و روزهای هفته دیده‌اید -- اینجا هم همان‌طور برای پرسیدن جزئیات به کار می‌رود: کدام فیلم؟'
    example_gloss: این چه فیلمی است؟
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: سؤال‌های کوتاه یک‌کلمه‌ای
    gloss: در گفت‌وگو می‌شود فقط با یک کلمه سؤال کرد، مثلاً Pyszny? به‌جای سؤال کامل Czy obiad był pyszny? -- طبیعی و سریع به نظر می‌رسد، درست مثل گفت‌وگوی روزمره.
    note: در گفت‌وگوی واقعی وقتی موقعیت روشن است، جمله‌ی کامل را نمی‌گویند -- *Pyszny?* به‌تنهایی یعنی «خوشمزه بود؟»
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: مارک می‌پرسد چی شده
    gloss: سلام اوا! دیروز چی شد؟
    note: اولین سؤالی که در این درس یاد گرفتید دوباره آمده و حالا شروع یک گفت‌وگوی واقعی است.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: اوا سینما بوده
    gloss: سینما بودم! یک فیلم خوب دیدم.
    note: Byłam و zobaczyłam هر دو مؤنث هستند و نشان می‌دهند گوینده اوا است.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: مارک می‌پرسد کدام فیلم
    gloss: چه فیلمی؟
    note: یک سؤال پیگیریِ کوتاه و طبیعی با jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: اوا جواب می‌دهد و می‌پرسد
    gloss: خیلی خوب! تو چی؟
    note: A ty? (تو چی؟) بدون هیچ دستور تازه‌ای صحبت را به مارک برمی‌گرداند.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: مارک ناهار درست کرده
    gloss: ناهار درست کردم!
    note: Zrobiłem (مذکر) نشان می‌دهد گوینده مارک است -- کارِ تمام‌شده‌ی خودش در آن روز.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: اوا می‌پرسد خوشمزه بود
    gloss: خوشمزه است؟
    note: یک سؤال تک‌کلمه‌ای، دقیقاً همان الگویی که در نکتهٔ دستوری این درس آمده.
