teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: خواستن، می‌خوام
    gloss: خواستن؛ می‌خوام
    note: Chcieć مصدر است و chcę شکل معمولی اول‌شخص است که برای گفتنِ چیزی که می‌خواهید به کار می‌برید.
    example_gloss: می‌خوام برم سینما.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: تو می‌خوای
    gloss: می‌خوای (خودمونی)
    note: Chcesz شکل خودمونیِ «تو» است و مثل masz و jesteś به کار می‌رود. همین را وقتی می‌پرسید دوستتان چه می‌خواهد، می‌گویید.
    example_gloss: قهوه می‌خوای؟
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: می‌خوام، می‌خوای
    gloss: 'Chcę، chcesz -- همان الگوی masz (داشتن) و jesteś (بودن): chcesz شکل «تو» (دوم‌شخص) است و وقتی از کسی می‌پرسید چیزی می‌خواهد یا نه، به کار می‌رود.'
    note: 'در این درس فقط «من» کافی نیست: *chcę* (می‌خوام) و *chcesz* (می‌خوای) دقیقاً همان الگوی شخصی‌اند که از *masz* و *jesteś* می‌شناسید، فقط برای یک فعل تازه.'
  pl.a1.unit11.lesson01.teach.kino:
    title: سینما
    gloss: سینما
    note: کلمهٔ رایج برای سینما است و موقع برنامه‌ریزی مدام به کار می‌رود.
    example_gloss: این سینما است.
  pl.a1.unit11.lesson01.teach.razem:
    title: با هم
    gloss: با هم
    note: Razem در خرید به معنی «جمعاً» هم هست و شاید از درس خرید یادتان باشد. اینجا معنی رایج دیگرش یعنی «با هم» را دارد.
    example_gloss: می‌خوای با هم بریم؟
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: می‌خوای بری سینما؟
    gloss: می‌خوای بری سینما؟
    note: Czy یک پرسش بله/نه را شروع می‌کند و chcesz iść do kina می‌پرسد طرف مقابل چه کاری می‌خواهد بکند. این راه اصلی پیشنهاد دادن برنامه است.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: می‌خوای جمعه با هم بریم سینما؟
    gloss: می‌خوای جمعه با هم بریم سینما؟
    note: 'پیشنهادِ کامل: razem (با هم) و w piątek (جمعه) به سؤالی که تازه یاد گرفتید اضافه شده‌اند.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: توانستن، می‌تونم
    gloss: توانستن؛ می‌تونم
    note: Móc مصدر است و mogę شکل اول‌شخص. شاید możemy («می‌تونیم») را از درس‌های قبلی تاریخ و ساعت یادتان باشد؛ همین فعل است، فقط مفرد.
    example_gloss: جمعه می‌تونم بیام.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: می‌تونی
    gloss: می‌تونی (خودمونی)
    note: Możesz شکل خودمونیِ «تو» است و همان الگوی دوم‌شخصِ chcesz را دارد. برای پرسیدن اینکه کس دیگری می‌تواند کاری بکند یا نه، به کار می‌رود.
    example_gloss: شنبه می‌تونی؟
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: آمدن
    gloss: آمدن
    note: فعلِ آمدن برای دیدن کسی است و با mogę/możesz خوب جور می‌شود تا بگویید چه کسی می‌تواند بیاید یا نمی‌تواند.
    example_gloss: می‌خوام جمعه بیام.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: می‌تونم، می‌تونی
    gloss: 'Móc: mogę، możesz -- همان دوم‌شخص (تو) مثل chcesz. Mogę به‌اضافهٔ مصدر می‌گوید چه کاری از دستتان برمی‌آید: mogę przyjść (می‌تونم بیام)، mogę iść (می‌تونم برم).'
    note: '*Mogę* به‌اضافهٔ یک مصدرِ ساده می‌گوید چه کاری از دستتان برمی‌آید. *mogę przyjść* («می‌تونم بیام») و *mogę iść* («می‌تونم برم») هر دو همین الگوی ساده را دارند.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: با کمال میل
    gloss: با کمال میل
    note: راهی گرم و مشتاقانه برای قبول کردن یک برنامه است و برای گرمی بیشتر اغلب با tak (بله) یا bardzo (خیلی) می‌آید.
    example_gloss: بله، با کمال میل!
  pl.a1.unit11.lesson02.teach.niestety:
    title: متأسفانه
    gloss: متأسفانه
    note: کلمهٔ مناسب برای مؤدبانه رد کردن یک برنامه است و تقریباً همیشه بعدش nie mogę (نمی‌تونم) می‌آید.
    example_gloss: متأسفانه نمی‌تونم.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: شنبه
    gloss: 'W + روز هفته: روزهای مذکر (piątek، poniedziałek، czwartek) پایانه‌شان عوض نمی‌شود -- w piątek. روزهای مؤنث (sobota، środa، niedziela) پایانهٔ مفعولی -ę می‌گیرند، مثل kawa ← kawę -- w sobotę.'
    note: 'بعد از *w* همهٔ روزها یکسان نیستند: نام روزهای مؤنث مثل *sobota* به *sobotę* تبدیل می‌شود، همان پایانهٔ *-a* ← *-ę* که برای *kawa* ← *kawę* و *herbata* ← *herbatę* یاد گرفتید. روزهای مذکر مثل *piątek* همان‌طور می‌مانند.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: شنبه می‌تونی بیای؟
    gloss: شنبه می‌تونی بیای؟
    note: możesz، przyjść و شکل تازهٔ w sobotę را کنار هم می‌گذارد؛ راهی کامل برای پرسیدن دربارهٔ یک روز جایگزین.
  pl.a1.unit11.lesson03.teach.moze:
    title: شاید، چطوره
    gloss: شاید / چطوره
    note: کلمه‌ای برای پیشنهاد جایگزین است و هر وقت برنامهٔ اول جور نشد و بخواهید چیز دیگری پیشنهاد کنید، به کار می‌رود.
    example_gloss: شنبه چطوره؟
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może و mogę
    gloss: 'Może و mogę شبیه هم‌اند ولی معنی‌شان فرق دارد: może («شاید») چیز تازه‌ای پیشنهاد می‌کند؛ mogę (شکل «من» از فعل، «می‌تونم») می‌گوید چه کاری از دستتان برمی‌آید.'
    note: 'روی کاغذ راحت قاطی می‌شوند: *może* («شاید»، برای پیشنهاد دادن) و *mogę* («می‌تونم»، فعل اول‌شخص) در جمله کار متفاوتی می‌کنند، هرچند از یک ریشه‌اند. به حرف آخر دقت کنید.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: ساعت چند؟
    gloss: ساعت چند؟
    note: راه معمول برای پرسیدن ساعت دقیق است، وقتی روز از قبل مشخص شده. شاید o której را از درس ساعت یادتان باشد.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: اِوا سینما را پیشنهاد می‌دهد
    gloss: اِوا از مارِک می‌پرسد جمعه می‌خواهد برود سینما یا نه.
    note: اولین سؤالِ همین درس، این بار در یک گفتگوی واقعی.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: مارِک جمعه نمی‌تواند
    gloss: مارِک می‌گوید متأسفانه جمعه نمی‌تواند.
    note: Niestety رد کردن را نرم می‌کند و بعدش nie mogę آن را ساده می‌گوید.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: مارِک شنبه را پیشنهاد می‌دهد
    gloss: 'مارِک می‌پرسد: شنبه چطوره؟'
    note: Może به‌جای تمام کردن گفتگو با یک «نه»، گزینهٔ دیگری پیشنهاد می‌دهد.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: اِوا با کمال میل قبول می‌کند
    gloss: 'اِوا می‌گوید: شنبه؟ با کمال میل!'
    note: روزِ پیشنهادشده را تکرار می‌کند (با همان شکل w sobotę) و بعد با chętnie قبول می‌کند.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: اِوا ساعت را می‌پرسد
    gloss: 'اِوا می‌پرسد: ساعت چند؟'
    note: وقتی روز مشخص شد، آخرین جزئیات همان ساعت است.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: مارِک ساعت را تأیید می‌کند
    gloss: 'مارِک می‌گوید: ساعت چهار بعدازظهر.'
    note: توافق را با ساعتی مشخص تمام می‌کند و همان الگوی ساعت از درس‌های قبلی را به کار می‌برد.
