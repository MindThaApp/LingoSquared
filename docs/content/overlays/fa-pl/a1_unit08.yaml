teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: بانک، اداره پست
    gloss: بانک؛ اداره پست
    note: دو کار روزمره‌ی ساده — bank شبیه کلمه‌ی «بانک» در فارسی است؛ poczta جایی است که برای فرستادن نامه یا بسته می‌روید.
    example_gloss:
    - این یک بانک است.
    - این یک اداره پست است.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: داروخانه، رستوران
    gloss: داروخانه؛ رستوران
    note: Apteka جایی است که دارو می‌خرید (نه فروشگاه عمومی)؛ restauracja هم شبیه «رستوران» فارسی است.
    example_gloss:
    - این یک داروخانه است.
    - این یک رستوران است.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: هتل؛ پارک
    note: هر دو شبیه «هتل» و «پارک» در فارسی‌اند — هم در نوشتار و هم در گفتار راحت شناخته می‌شوند.
    example_gloss:
    - این یک هتل است.
    - این یک پارک است.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: '... کجاست؟ (Gdzie jest + [مکان]?)'
    gloss: 'Gdzie jest + [مکان]? — Gdzie (کجا) به‌علاوه‌ی jest (است) برای پرسیدن مکان به کار می‌رود: Gdzie jest bank? Gdzie jest apteka?'
    note: '*Gdzie* یعنی «کجا» و *jest* یعنی «است» — با هم، *Gdzie jest...?* الگوی پرسش روزمره برای پرسیدن جای هر مکانی است. وقتی درباره‌ی یک مکان می‌پرسید همین‌طور به کار ببرید؛ برای چند مکان، لهستانی به‌جای آن *są* («هستند») می‌گوید.'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: بانک کجاست؟
    gloss: بانک کجاست؟
    note: الگوی نکته‌ی دستوری با اولین کلمه‌ی مکان این درس به کار رفته است.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: نزدیک، دور
    gloss: نزدیک؛ دور
    note: یک جفت متضاد ساده که مستقیماً بعد از jest می‌آید تا بگوید جایی چقدر نزدیک یا دور است.
    example_gloss:
    - پارک نزدیک است.
    - هتل دور است.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: نه چندان دور
    gloss: نه چندان دور
    note: در اصل *nie* («نه») و *daleko* («دور») در یک کلمه به هم چسبیده‌اند — راهی ملایم و بسیار رایج برای اطمینان دادن به کسی که جایی در دسترس است.
    example_gloss: داروخانه چندان دور نیست.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: کنار، روبه‌روی
    gloss: کنار؛ روبه‌روی
    note: هر دو موقعیت یک مکان را نسبت به یک نشانه بیان می‌کنند، نه فقط میزان نزدیکی را. هر دو می‌خواهند اسمِ بعدشان به حالت اضافی برود — به نکته‌ی دستوری همین درس نگاه کنید.
    example_gloss:
    - داروخانه کنار بانک است.
    - رستوران روبه‌روی هتل است.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'بعد از ''obok''/''naprzeciwko''/''blisko + اسم'': حالت اضافی'
    gloss: 'بعد از «کنار»/«روبه‌روی»/«نزدیکِ» + مکان: حالت اضافی — bank -> banku، hotel -> hotelu، park -> parku. Apteka jest obok banku. Restauracja jest naprzeciwko hotelu. Restauracja jest blisko parku.'
    note: '*Obok*، *naprzeciwko* و *blisko* (وقتی بعدش مکانی بیاید و تنها نباشد) همگی حالت اضافی می‌خواهند، برای همین اسم بعدشان پایانش عوض می‌شود. برای این سه اسم مذکر باقاعده، یعنی اضافه کردن *-u*: *bank* می‌شود *banku*، *hotel* می‌شود *hotelu*، *park* می‌شود *parku*. وقتی *blisko* تنها می‌آید اصلاً به حالت اضافی نیاز ندارد — *To jest blisko* («آنجا نزدیک است») درست همان‌قدر درست است که *blisko parku* («نزدیک پارک»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: داروخانه کنار بانک است
    gloss: داروخانه کنار بانک است.
    note: 'الگوی پایانهٔ -u از نکتهٔ دستوری را در یک جمله‌ی واقعی به کار می‌بریم: بعد از obok، bank می‌شود banku.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: ببخشید
    gloss: ببخشید / معذرت می‌خواهم
    note: روش رایج برای جلب توجه یک غریبه پیش از پرسیدن سؤال؛ این کلمه قبل از خود سؤال گفته می‌شود، نه بعد از آن.
    example_gloss: ببخشید، بانک کجاست؟
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: اوا جای داروخانه را می‌پرسد
    gloss: اوا می‌گوید ببخشید و می‌پرسد داروخانه کجاست.
    note: Przepraszam سؤال را شروع می‌کند، همان‌طور که در نکتهٔ واژگان همین درس آمده؛ حتی با کسی که او را می‌شناسد، مثل Marek، این روش مؤدبانه است برای وسط حرف آمدن و پرسیدن چیزی.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: مارک جای داروخانه را می‌گوید
    gloss: مارک می‌گوید داروخانه دور نیست، کنار بانک است.
    note: niedaleko و obok + banku را که هر دو از نکتهٔ دستوری درس ۲ هستند، با هم ترکیب می‌کند.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: اوا از مارک تشکر می‌کند و دربارهٔ رستوران می‌پرسد
    gloss: اوا تشکر می‌کند و می‌پرسد رستوران کجاست.
    note: Dziękuję را از واحدهای قبل می‌شناسید؛ A (و) سؤال تازه را به سؤال قبلی وصل می‌کند.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: مارک جای رستوران را می‌گوید
    gloss: مارک می‌گوید رستوران روبه‌روی هتل و نزدیک پارک است.
    note: naprzeciwko + hotelu (حالت اضافی، با همان الگوی banku) و blisko برای نشانی دوم.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: اوا دوباره از مارک تشکر می‌کند
    gloss: اوا می‌گوید خیلی ممنون.
    note: Bardzo (خیلی) معنای dziękuję را قوی‌تر می‌کند، درست مثل proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: مارک جواب می‌دهد
    gloss: مارک می‌گوید خواهش می‌کنم.
    note: Proszę bardzo، پاسخ معمول به تشکر، که از واحد خرید تکرار شده است.
