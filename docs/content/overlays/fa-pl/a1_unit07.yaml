teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: موز
    gloss: موز
    note: میوه‌ای رایج که در هر بازار یا مغازه‌ای عددی یا وزنی فروخته می‌شود.
    example_gloss: این یک موز است.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: گوجه‌فرنگی، خیار
    gloss: گوجه‌فرنگی؛ خیار
    note: هر دو مذکرِ بی‌جان‌اند -- شکل جمعِ ملکی‌شان (pomidorów، ogórków) وقتی بخواهید کیلویی بخرید، بعداً در همین درس به کارتان می‌آید.
    example_gloss:
    - این یک گوجه‌فرنگی است.
    - این یک خیار است.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: سیب‌زمینی، پیاز
    gloss: سیب‌زمینی؛ پیاز
    note: Ziemniak مذکرِ بی‌جان است (با همان خانوادهٔ جمعِ ملکیِ -ów مثل banan و pomidor)؛ cebula مؤنث است.
    example_gloss:
    - این یک سیب‌زمینی است.
    - این یک پیاز است.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: ارزان، گران
    gloss: ارزان؛ گران
    note: '*Tanio* و *drogo* قید هستند و در لهستانی مستقیم با *kosztować* («قیمت داشتن») می‌آیند، برخلاف فارسی که می‌گوییم «قیمتش بالاست/گران است» -- *To kosztuje drogo* یعنی تحت‌اللفظی «این گران قیمت دارد»، یعنی «این گران است».'
    example_gloss:
    - خیلی ارزان!
    - خیلی گران!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'قیمت داشتن: kosztuje، kosztują'
    gloss: 'قیمت داشتن: kosztuje (برای یک چیز)، kosztują (برای بیش از یکی) -- موز ارزان است. موزها ارزان‌اند.'
    note: '*Kosztować* یعنی «قیمت داشتن». برای یک چیز از *kosztuje* و برای بیش از یکی از *kosztują* استفاده کنید -- درست مثل *jest* و *są* («است» و «هستند») ولی برای قیمت. رعایت این تطابق مهم است: فروشندهٔ بازار در هر دو حالت منظورتان را می‌فهمد، اما *banany kosztują* چیزی است که لهستانی‌زبان‌ها واقعاً می‌گویند.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: موز چند است؟
    gloss: موز چند است؟
    note: سؤال همیشگی برای شروع چانه‌زنی -- *Ile* (چقدر) به‌اضافهٔ *kosztuje* به شکل مفرد، چون دربارهٔ یک موز می‌پرسیم.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: گریپ‌فروت
    gloss: گریپ‌فروت
    note: مذکرِ بی‌جان، مثل pomidor و ziemniak -- بعد از proszę o پایانش تغییر نمی‌کند.
    example_gloss: این یک گریپ‌فروت است.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: نارنگی، پرتقال
    gloss: نارنگی؛ پرتقال
    note: هر دو مؤنث‌اند، مثل kawa و herbata در درس غذا -- در شکل مفعولی -a به -ę تبدیل می‌شود، ولی این درس فقط به شکل اصلی‌شان نیاز دارد.
    example_gloss:
    - این یک نارنگی است.
    - این یک پرتقال است.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: یک کیلو، نیم کیلو
    gloss: یک کیلو؛ نیم کیلو
    note: '*Kilo* پایانش هرگز عوض نمی‌شود، چه چیزی بکشید و چند کیلو بخواهید -- این اسمِ بعد از *kilo* است که تغییر می‌کند، همان‌طور که نکتهٔ دستوری این درس توضیح می‌دهد.'
    example_gloss:
    - یک کیلو گوجه‌فرنگی، لطفاً.
    - نیم کیلو موز، لطفاً.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: می‌خواهم (لطفاً)
    gloss: می‌خواهم / لطفاً به من بدهید
    note: '*Poproszę* جایگزینی روزمره و کمی مؤدبانه‌تر برای *proszę o* از درس غذاست -- هر دو تقریباً یعنی «می‌خواهم» و لهستانی‌زبان‌ها راحت بین‌شان جابه‌جا می‌شوند. بعد از *Poproszę* مستقیم چیزی که می‌خواهید می‌آید و *o* لازم نیست.'
    example_gloss: یک گریپ‌فروت می‌خواهم، لطفاً.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'بعد از «kilo»: پایان -ów'
    gloss: 'جمعِ ملکی بعد از «kilo»: banan -> bananów (موز)، pomidor -> pomidorów (گوجه‌فرنگی)، ziemniak -> ziemniaków (سیب‌زمینی).'
    note: 'وقتی مقدار را با وزن می‌گویید -- *kilo*، *pół kilo* -- اسمِ بعدی به شکل دیگری درمی‌آید که جمعِ ملکی نام دارد. برای این سه اسم مذکرِ باقاعده فقط کافی است *-ów* اضافه کنید: *banan* می‌شود *bananów*، *pomidor* می‌شود *pomidorów* و *ziemniak* می‌شود *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: یک کیلو گوجه‌فرنگی، لطفاً
    gloss: یک کیلو گوجه‌فرنگی، لطفاً.
    note: الگوی -ów از نکتهٔ دستوری را در یک درخواست واقعی به کار می‌برد -- بعد از kilo، pomidor می‌شود pomidorów.
  pl.a1.unit07.lesson03.teach.dla:
    title: برای
    gloss: برای
    note: حرف اضافه‌ای ساده به معنی «برای» -- فروشنده در *Co dla pani?* (تحت‌اللفظی «چه چیزی برای شما؟») از آن استفاده می‌کند تا رسمی بپرسد مشتری چه می‌خواهد.
    example_gloss: این برای شماست.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: تازه، خیلی
    gloss: تازه؛ خیلی
    note: دو کلمهٔ روزمره که فروشندهٔ بازار مدام به کار می‌برد -- برای تعریف از تازگی جنس، یا ارزان یا گران بودنش.
    example_gloss:
    - گوجه‌فرنگی‌ها تازه‌اند.
    - خیلی ارزان!
  pl.a1.unit07.lesson03.teach.trochę:
    title: کمی
    gloss: کمی / یک ذره
    note: گله را مؤدبانه نرم می‌کند -- trochę drogo («کمی گران») در چانه‌زنی دوستانه خیلی طبیعی‌تر از drogo تنهاست.
    example_gloss: کمی گران است.
  pl.a1.unit07.lesson03.teach.razem:
    title: جمعاً / با هم
    gloss: جمعاً / با هم
    note: چیزی که فروشنده درست قبل از گفتن مبلغ نهایی می‌گوید.
    example_gloss: جمعاً ده زلوتی.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: چی میل دارید؟
    gloss: چی میل دارید؟
    note: تحت‌اللفظی «چه چیزی برای شما (رسمی)» -- سؤال آغازین طبیعی فروشنده از مشتری.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: فروشنده به اوا سلام می‌کند
    gloss: فروشنده سلام می‌کند و از اوا می‌پرسد چه می‌خواهد.
    note: Dzień dobry که در سلام‌وعلیک‌های درس ۱ آمده بود.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: اوا قیمت موز را می‌پرسد
    gloss: اوا می‌پرسد موزها چند است.
    note: Kosztują — شکل جمع از نکته‌ی دستوری همین درس، چون درباره‌ی موزها به‌صورت گروهی سؤال می‌شود.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: فروشنده قیمت را می‌گوید
    gloss: فروشنده می‌گوید کیلویی پنج زلوتی است و خیلی تازه‌اند.
    note: یک عبارت قیمت کوتاه و طبیعی — فروشنده‌ی لهستانی نرخ هر کیلو را به شکل «[قیمت] kilo» می‌گوید و به کلمه‌ی جداگانه‌ای برای «هر» نیازی نیست.
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: اوا موز سفارش می‌دهد
    gloss: اوا می‌گوید باشه و یک کیلو موز می‌خواهد.
    note: poproszę را با kilo + bananów ترکیب می‌کند، همان الگوی نکته‌ی دستوری درس ۲.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: فروشنده از گوجه‌فرنگی می‌گوید
    gloss: فروشنده درباره‌ی گوجه‌فرنگی هم می‌پرسد و می‌گوید کیلویی هشت زلوتی است.
    note: همان الگوی قیمت کوتاه جمله‌ی ۳، این بار برای کالایی دیگر.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: اوا آرام چانه می‌زند و سفارش می‌دهد
    gloss: اوا می‌گوید کمی گران است، ولی نیم کیلو می‌گیرد.
    note: Trochę drogo گلایه را نرم می‌کند — اوا باز هم می‌خرد، فقط مقدار کمتری.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: فروشنده مبلغ کل را می‌گوید
    gloss: فروشنده می‌گوید بفرمایید و جمعاً نه زلوتی می‌شود.
    note: 5 złotych برای موزها به‌علاوه‌ی 4 złotych برای نیم کیلو گوجه‌فرنگی — جمعاً نه złotych، مطابق همه‌ی قیمت‌هایی که قبلاً در صحنه گفته شد.
