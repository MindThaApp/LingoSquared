teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: رفتن، رسیدن به
    gloss: رفتن؛ رسیدن به
    note: 'دو فعل حرکتی نزدیک به هم: iść یعنی «رفتن/راه رفتن» به‌طور کلی، و dojść مشخصاً یعنی «رسیدن به» یک مقصد؛ این فعل در الگوی سؤال همین درس به کار می‌رود.'
    example_gloss:
    - لطفاً مستقیم بروید.
    - چطور به بانک برسم؟
  pl.a1.unit09.lesson01.teach.prosto:
    title: مستقیم
    gloss: مستقیم
    note: ساده‌ترین واژهٔ جهت؛ درست بعد از iść می‌آید تا بگوید «مستقیم بروید».
    example_gloss: لطفاً مستقیم تا پارک بروید.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: آنجا، بعد
    gloss: آنجا؛ بعد
    note: Tam به یک مکان اشاره می‌کند؛ potem مراحل را پشت سر هم می‌آورد («اول این، بعد آن»). هر دو برای پشت هم گفتن آدرس ضروری‌اند.
    example_gloss:
    - بانک آنجاست.
    - بعد، لطفاً مستقیم بروید.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'لطفاً + مصدر: Proszę (لطفاً) به‌اضافهٔ فعل به شکل مصدر (شکل فرهنگ لغت)، روش مؤدبانهٔ روزمره برای راهنمایی کردن است، بدون نیاز به شکل امر جداگانه: لطفاً مستقیم بروید.'
    note: '*Proszę* به‌اضافهٔ یک فعل مصدری روشی است که در لهستانی مؤدبانه از کسی می‌خواهند کاری بکنند: *Proszę iść prosto* («لطفاً مستقیم بروید»). این انتخاب امن و مؤدبانه برای صحبت با غریبه است، پس برای دادن یا فهمیدن آدرس به «شکل امر» جداگانه نیازی ندارید. (بین دوستان معمولاً از همان شکل امر استفاده می‌شود؛ بعداً با آن آشنا می‌شوید.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: چطور به + [مکان] برسم؟
    gloss: 'چطور به + [مکان] برسم؟ Jak (چطور) به‌اضافهٔ dojść (رسیدن به) راه رسیدن به یک مکان را می‌پرسد: چطور به بانک برسم؟ چطور به هتل برسم؟ چطور به پارک برسم؟ اسمی که بعد از do می‌آید همان پایانهٔ حالت اضافی -u را می‌گیرد که در واحد قبل بعد از «کنار» و «روبه‌روی» دیدید: bank -> banku، hotel -> hotelu، park -> parku.'
    note: '*Jak dojść do...?* سؤال روزمره برای پرسیدن راه رسیدن به یک مکان است. نام مکانی که بعد از *do* می‌آید همان پایانهٔ حالت اضافی *-u* را می‌گیرد که بعد از *obok*/*naprzeciwko* یاد گرفته‌اید: *bank* می‌شود *banku*، *hotel* می‌شود *hotelu*، *park* می‌شود *parku*؛ دقیقاً همان الگو، فقط بعد از یک حرف اضافهٔ تازه.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: چطور به بانک برسم؟
    gloss: چطور به بانک برسم؟
    note: الگوی نکتهٔ دستوری، با اولین مقصد این درس.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: راست، چپ
    gloss: راست؛ چپ
    note: 'بعد از na می‌آید تا بگوید چیزی کجاست یا به کدام طرف باید پیچید: na prawo (به راست/سمت راست)، na lewo (به چپ/سمت چپ).'
    example_gloss:
    - بانک سمت راست است.
    - پارک سمت چپ است.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: پیچیدن
    gloss: پیچیدن
    note: فعلِ تغییر جهت؛ با na prawo/na lewo جفت می‌شود و یعنی «به راست بپیچید»/«به چپ بپیچید».
    example_gloss: لطفاً به راست بپیچید.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: لطفاً به چپ بپیچید
    gloss: لطفاً به چپ بپیچید.
    note: همان الگوی Proszę + مصدر، این بار با skręcić و na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: خیابان
    gloss: خیابان
    note: کلمه‌ی معمولی برای هر خیابانی. هر وقت در آدرس‌دادن اسم یک خیابان را بگویند، به کارتان می‌آید.
    example_gloss: خیابان آن‌جاست.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: پشت‌سرهم گفتن مسیر با potem
    gloss: 'Proszę iść prosto, potem skręcić na prawo. -- چند مسیر را می‌شود با یک ویرگول و کلمه‌ی potem (یعنی «بعد») به هم وصل کرد: اول یک کار، بعد کار بعدی.'
    note: 'برای این‌که بیشتر از یک مسیر را پشت‌سرهم بگویید، فقط آن‌ها را با ویرگول و *potem* به هم وصل کنید: *Proszę iść prosto, potem skręcić na prawo* («لطفاً مستقیم بروید، بعد به راست بپیچید»). مسیرهای چندمرحله‌ای واقعی را هم دقیقاً به همین شکل می‌شنوید.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: می‌فهمم
    gloss: می‌فهمم
    note: راه خوبی برای این‌که نشان بدهید مسیر را فهمیده‌اید، قبل از این‌که سؤال بعدی را بپرسید.
    example_gloss: می‌فهمم، ممنون.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: اِوا می‌پرسد چطور به پارک برسد
    gloss: اِوا ببخشید می‌گوید و می‌پرسد چطور به پارک برسد.
    note: Przepraszam سؤال را شروع می‌کند، همان عادت مؤدبانه‌ای که در گفت‌وگوی مربوط به مکان‌ها در درس قبل دیدید.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: رهگذر مسیر پارک را می‌گوید
    gloss: رهگذر می‌گوید مستقیم بروید، بعد به چپ بپیچید. پارک آن‌جاست.
    note: دو مسیر پشت‌سرهم با potem، دقیقاً مثل چیزی که نکته‌ی دستوری این درس می‌گوید.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: اِوا تأیید می‌کند و درباره‌ی بانک می‌پرسد
    gloss: اِوا می‌گوید فهمیده و می‌پرسد چطور به بانک برسد.
    note: Rozumiem نشان می‌دهد که او مسیر اول را فهمیده، قبل از این‌که سؤال تازه‌ای بپرسد.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: رهگذر مسیر بانک را می‌گوید
    gloss: رهگذر می‌گوید به راست بپیچید، بعد مستقیم بروید. بانک سمت راست است.
    note: یک مسیر دومرحله‌ای متفاوت با مسیر پارک، با همان الگوی Proszę + مصدر.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: اِوا تشکر می‌کند
    gloss: اِوا می‌گوید خیلی ممنون.
    note: Dziękuję bardzo، که در درس‌های خرید و مکان‌ها هم آمده بود.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: رهگذر جواب می‌دهد
    gloss: رهگذر می‌گوید خواهش می‌کنم.
    note: Proszę bardzo، جواب معمول به تشکر، که در درس‌های قبل هم آمده بود.
