teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: نان
    gloss: نان
    note: یکی از واژه‌های پایه دربارهٔ غذا که سر هر وعده مدام به کارش می‌برید.
    example_gloss: این نان است.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: کره، پنیر
    gloss: کره؛ پنیر
    note: اولی خنثی و دومی مذکرِ بی‌جان است. هیچ‌کدام بعد از proszę o پایانه‌شان عوض نمی‌شود، همان‌طور که توضیح دستور همین درس می‌گوید.
    example_gloss:
    - این کره است.
    - این پنیر است.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: آب، شیر
    gloss: آب؛ شیر
    note: Woda مؤنث است (شکل مفعولی‌اش یعنی wodę در توضیح دستور همین درس آمده)، ولی mleko خنثی است و هیچ‌وقت تغییر نمی‌کند.
    example_gloss:
    - این آب است.
    - این شیر است.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: قهوه، چای
    gloss: قهوه؛ چای
    note: هر دو مؤنث‌اند. هنگام سفارش دادن، شکل مفعولی‌شان یعنی kawę و herbatę را می‌گویید که در توضیح دستور همین درس آمده.
    example_gloss:
    - این قهوه است.
    - این چای است.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'سفارش دادن: proszę o + مفعولی'
    gloss: 'لطفاً به من بدهید + شکل مفعولی: قهوه ← kawę، چای ← herbatę، آب ← wodę. نان، پنیر و شیر تغییر نمی‌کنند.'
    note: بعد از *Proszę o* (به معنی «لطفاً … بدهید»، تحت‌اللفظی «… می‌خواهم») اسم به شکل مفعولی می‌آید. اسم‌های مؤنثی مثل *kawa*، *herbata* و *woda* پایانهٔ *-a* را با *-ę* عوض می‌کنند. اسم‌های مذکرِ بی‌جان مثل *chleb* و *ser* و اسم‌های خنثی مثل *mleko* همان شکلی را نگه می‌دارند که در فرهنگ لغت دارند.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: قهوه، لطفاً
    gloss: یک قهوه، لطفاً.
    note: روش عادی و مؤدبانه برای سفارش یک چیز. الگوی توضیح دستور را در یک درخواست کامل به کار می‌برید.
  pl.a1.unit06.lesson02.teach.zupa:
    title: سوپ
    gloss: سوپ
    note: غذای رایج ناهار یا شام است و اغلب غذای ویژهٔ روز هم هست، مثل صحنهٔ رستوران همین واحد.
    example_gloss: این سوپ است.
  pl.a1.unit06.lesson02.teach.sok:
    title: آبمیوه
    gloss: آب‌میوه
    note: مذکرِ بی‌جان است، مثل chleb و ser؛ هنگام سفارش دادن پایانه‌اش عوض نمی‌شود.
    example_gloss: این آبمیوه است.
  pl.a1.unit06.lesson02.teach.cukier:
    title: شکر
    gloss: شکر
    note: برای قهوه یا چای به کار می‌آید. این هم مذکرِ بی‌جان است و پایانه‌اش عوض نمی‌شود.
    example_gloss: این شکر است.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: صورت‌حساب
    gloss: صورتحساب
    note: چیزی که آخر غذا می‌خواهید. proszę o rachunek روش استاندارد و مؤدبانهٔ درخواست آن است.
    example_gloss: صورت‌حساب، لطفاً.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'دوست داشتن: lubię، lubi'
    gloss: 'دوست داشتن: من دوست دارم، او دوست دارد — قهوه را دوست دارم. او سوپ را دوست دارد.'
    note: '*Lubić* یعنی «دوست داشتن». اینجا فقط شکل اول‌شخص (*lubię*) و سوم‌شخص (*lubi*) آموزش داده می‌شود. *Lubić* هم مثل *proszę o* مفعولی می‌گیرد: *lubię kawę*، نه *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: من سوپ را دوست دارم
    gloss: من سوپ را دوست دارم.
    note: Zupa در حالت مفعولی به zupę تبدیل می‌شود؛ همان تغییر پایانهٔ مؤنثِ -a به -ę که در توضیح دستور درس اول بود.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: غذای روز
    gloss: غذای روز سوپ است.
    note: '*Dnia* شکل مضاف‌الیهی (اضافی) واژهٔ *dzień* (روز) است. *danie dnia* تحت‌اللفظی «غذای روز» است، همان‌طور که در منو می‌نویسند.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'پیشنهاد دادن: polecam، poleca'
    gloss: 'پیشنهاد دادن: من پیشنهاد می‌کنم، او پیشنهاد می‌کند — قهوه را پیشنهاد می‌کنم. او سوپ را پیشنهاد می‌کند.'
    note: '*Polecać* یعنی «پیشنهاد دادن». گارسون با آن غذایی را پیشنهاد می‌کند و مشتری هم با همین فعل پیشنهاد می‌خواهد. این فعل هم مثل *proszę o* و *lubić* مفعولی می‌گیرد.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: چه چیزی پیشنهاد می‌کنید؟
    gloss: چه چیزی پیشنهاد می‌کنید؟
    note: '*Co* (چه چیز) به‌علاوهٔ *pan* در حالت رسمی. سؤال طبیعی از گارسون است و همان خطاب رسمی واحد اول را دارد.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: بفرمایید / خواهش می‌کنم
    gloss: بفرمایید.
    note: عبارتی انعطاف‌پذیر و روزمره است. هنگام تعارف کردن چیزی به کار می‌رود و در جواب dziękuję (ممنون) هم کاملاً طبیعی است.
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: همین الان می‌آورم
    gloss: همین الان می‌آورم.
    note: تحت‌اللفظی «دارم سرو می‌کنم». جواب معمول گارسون برای تأیید این است که سفارش را شنیده.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: گارسون غذای ویژه را اعلام می‌کند
    gloss: گارسون سلام می‌کند و می‌گوید غذای ویژهٔ امروز سوپ است.
    note: Dzień dobry از احوال‌پرسی‌های واحد اول است.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: اِوا پیشنهاد می‌خواهد
    gloss: اِوا از گارسون می‌پرسد چه چیزی پیشنهاد می‌کند.
    note: سؤالی مؤدبانه و رسمی است. pan با احترام خطاب به گارسون به کار رفته.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: گارسون قهوه پیشنهاد می‌کند
    gloss: گارسون قهوه را پیشنهاد می‌کند.
    note: Polecam همان شکل اول‌شخص از توضیح دستور همین درس است.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: اِوا سفارش می‌دهد
    gloss: اِوا می‌گوید باشه و قهوه و سوپ سفارش می‌دهد.
    note: proszę o را با حرف ربط i (و) از واحد خانواده ترکیب می‌کند و الگوی سفارش درس اول و واژگان سوپ درس دوم را دوباره به کار می‌برد.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: گارسون تأیید می‌کند
    gloss: گارسون می‌گوید سفارش همین الان می‌آید.
    note: تأییدی کوتاه و طبیعی پیش از آمدن غذا.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: اِوا صورتحساب می‌خواهد
    gloss: اِوا تشکر می‌کند و صورتحساب می‌خواهد.
    note: dziękuję از واحد اول و proszę o + rachunek از درس دوم دوباره آمده است.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: گارسون صورتحساب را می‌دهد
    gloss: گارسون می‌گوید بفرمایید.
    note: همان proszę bardzo که پیشتر در این درس آمد؛ این بار هنگام دادن صورتحساب به کار رفته است.
