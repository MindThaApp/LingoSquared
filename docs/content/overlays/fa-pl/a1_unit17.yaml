teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: من مهندس / معلم هستم
    gloss: من مهندس هستم. من معلم هستم. -- کلمه‌های «inżynier» و «nauczycielka» بعد از «Jestem» پایانشان عوض می‌شود.
    note: این اولین بار در این دوره است که پایان یک کلمه برای نشان دادن شغل عوض می‌شود -- فعلاً فقط برای همین دو کلمه‌ی شغلی.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: مهندس
    gloss: مهندس
    note: در لهستانیِ روزمره، این کلمه برای یک زن هم معمولاً همان *inżynier* می‌ماند.
    example_gloss: مارک مهندس است.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: معلم
    gloss: معلم (مذکر) / معلم (مؤنث)
    note: برخلاف *inżynier*، این کلمه‌ی شغلی بسته به جنسیت عوض می‌شود -- *nauczyciel* برای مرد و *nauczycielka* برای زن.
    example_gloss:
    - او معلم است.
    - اوا معلم است.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: دوباره مارک و اوا
    gloss: Marek، Ewa -- این اسم‌ها را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه قبل از اینکه این درس از هر دو استفاده کند.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: «است» -- دوباره
    gloss: Jest -- این کلمه را از درس‌های قبل می‌شناسید، مثلاً «Dom jest tam» (خانه آن‌جاست).
    note: یک یادآوری کوتاه قبل از اینکه این درس از آن برای گفتن درباره‌ی شغل کسی استفاده کند.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: شغل مارک
    gloss: مارک مهندس است.
    note: واقعیتی که کل این بخش درباره‌ی مارک بر پایه‌ی آن ساخته شده است.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: شغل اوا
    gloss: اوا معلم است.
    note: واقعیتی که کل این بخش درباره‌ی اوا بر پایه‌ی آن ساخته شده است.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: کار کردن -- کار می‌کنی
    gloss: 'Pracować (pracuję را از درس‌های قبل می‌شناسید): pracuję (من)، pracujesz (تو). کجا کار می‌کنی؟'
    note: فعلاً فقط دو شکل داریم -- *pracuję* برای خودتان و *pracujesz* برای پرسیدن از کسی دیگر، با همان الگوی *czuć się* در بخش قبل.
  pl.a1.unit17.lesson02.teach.szkola:
    title: مدرسه
    gloss: مدرسه
    note: جایی که معلمی مثل اوا کار می‌کند.
    example_gloss: من در یک مدرسه کار می‌کنم.
  pl.a1.unit17.lesson02.teach.biuro:
    title: دفتر
    gloss: دفتر
    note: جایی که مهندسی مثل مارک کار می‌کند.
    example_gloss: من در یک دفتر کار می‌کنم.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: در مدرسه، در دفتر
    gloss: 'W + محل کار: w szkole، w biurze -- مثل w Warszawie یا w Krakowie.'
    note: همان ایده‌ی اسم شهرهایی است که قبلاً یاد گرفته‌اید (*w Warszawie*، *w Krakowie*)؛ برای گفتنِ *در* یا «توی» آن مکان، آخر کلمه کمی عوض می‌شود.
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: کجا کار می‌کنید؟
    gloss: کجا کار می‌کنید؟
    note: سؤال طبیعی برای پرسیدن درباره‌ی شغل کسی.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: و تو -- دوباره
    gloss: A ty -- این عبارت را از درس‌های قبل می‌شناسید.
    note: یک یادآوری کوتاه قبل از گفت‌وگوی این درس.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: مارک از اوا درباره‌ی کارش می‌پرسد
    gloss: اوا، کجا کار می‌کنی؟
    note: مارک گفت‌وگو را با یک سؤال مستقیم شروع می‌کند.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: جواب اوا
    gloss: من در یک مدرسه کار می‌کنم. من معلم هستم.
    note: اوا هم محل کارش را می‌گوید و هم شغلش را -- همان چیزهایی که پیش‌تر در این بخش گفته شد.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: اوا همان سؤال را از مارک می‌پرسد
    gloss: تو چه‌طور، مارک؟ کجا کار می‌کنی؟
    note: اوا سؤال را به مارک برمی‌گرداند.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: پاسخ‌های مارک
    gloss: من توی یک دفتر کار می‌کنم. مهندس هستم.
    note: مارک هم محل کارش را می‌گوید و هم شغلش را؛ همان چیزهایی که قبلاً در این درس گفته شد.
