teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Grand* برای شخص قدبلند و *petit* برای شخص قدکوتاه استفاده می‌شود. این صفت‌ها با شخص مطابقت می‌کنند: *grand/grande*، *petit/petite*.'
    example_gloss:
    - لئا قدبلند است.
    - توماس قدکوتاه است.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Vieux* و *jeune* در اینجا یک تصور کلی از سن را می‌دهند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - بابه کلان پیر است.
    - ماتیو جوان است.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'سن: یک عدد یا یک تصور'
    gloss: برای سن دقیق در فرانسوی از *avoir* کار گرفته می‌شود (*Il a vingt ans*)، اما *être vieux* یک تصور کلی را می‌رساند (*Mon grand-père est vieux*). در دری هم برای سن دقیق می‌گوییم «بیست ساله است» و برای تصور کلی «پیر است».
    note: شما *Quel âge as-tu ?* را برای پرسیدن سن دقیق می‌دانین. اینجا *vieux* نشان می‌دهد که کسی چقدر پیر به نظر می‌رسد، بدون اینکه عددی گفته شود.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: لئا قدبلند است و توماس قدکوتاه
    gloss: لئا قدبلند است و توماس قدکوتاه.
    note: یک جملهٔ ساده که با *et* (و) ساخته شده و برای مقایسهٔ مستقیم در درس پنجم زمینه می‌سازد.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: مو
    gloss: مو
    note: '*Les cheveux* همیشه جمع و مذکر است، با اینکه در دری «موی سر» را معمولاً مفرد می‌گوییم.'
    example_gloss: ماتیو موی کوتاه و سیاه دارد.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'سه رنگ مو. با *cheveux* رنگ‌ها *s* جمع می‌گیرند: *blonds*، *bruns*. *Gris* از قبل به *s* ختم می‌شود و *noirs* (سیاه) از بخش لباس‌ها تکرار شده است.'
    example_gloss:
    - کامیل موی بور دارد.
    - توماس موی قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Longs* (دراز) مفهوم قد را از درس اول تکرار می‌کند، اما اینجا درازی مو را توصیف می‌کند. *Courts* (کوتاه) در اینجا تازه است و هر دو با *cheveux* *s* جمع می‌گیرند.'
    example_gloss:
    - لئا موی دراز دارد.
    - توماس موی کوتاه دارد.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux صفت جمع می‌گیرد
    gloss: '*Cheveux* همیشه جمع است، پس صفت *s* می‌گیرد: *longs*، *courts*، *blonds*، *bruns*، *noirs*. *Gris* از قبل به *s* ختم می‌شود.'
    note: 'رنگ‌ها و درازی با *cheveux* در حالت جمع مطابقت می‌کنند: *les cheveux longs*. با *yeux* در درس سوم مقایسه کنید که *marron* تغییر نمی‌کند.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: او (مرد) یا او (زن)'
    gloss: '*Ses* پیش از اسم جمع به معنای «مال او» است: *ses cheveux*، *ses yeux*. این کلمه با چیزِ تعلق‌گرفته مطابقت می‌کند، نه با صاحب آن.'
    note: 'در دری ضمیر «او» برای مرد و زن یکی است و در فرانسوی هم اینجا فرق نمی‌کند: *ses yeux* می‌تواند «چشم‌های او (مرد)» یا «چشم‌های او (زن)» باشد و از موضوع صحبت معلوم می‌شود.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: ماتیو موی کوتاه و سیاه دارد
    gloss: ماتیو موی کوتاه و سیاه دارد.
    note: '*Noirs* (سیاه) از بخش لباس‌ها دوباره آمده است.'
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: کامیل موی دراز و بور دارد
    gloss: کامیل موی دراز و بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Les yeux* جمع *l''œil* (چشم) است؛ *yeux* به *x* ختم می‌شود، نه *s*.'
    example_gloss: ماتیو چشم‌های قهوه‌یی دارد.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: '*Bleus* (آبی) پیشتر برای لباس‌ها آمده بود؛ *marron* (قهوه‌یی) هرگز تغییر نمی‌کند؛ *verts* (سبز) تازه است.'
    example_gloss:
    - کامیل چشم‌های آبی دارد.
    - توماس چشم‌های قهوه‌یی دارد.
    - لئا چشم‌های سبز دارد.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux «s» می‌گیرد، marron تغییر نمی‌کند
    gloss: 'با *yeux* (جمع) صفت *s* می‌گیرد: *yeux bleus*، *yeux verts*. *Marron* هرگز تغییر نمی‌کند: *yeux marron*.'
    note: 'با *cheveux* در درس دوم مقایسه کنید: اسم جمع صفت جمع می‌آورد، به جز رنگ‌هایی مثل *marron* که از یک اسم گرفته شده‌اند.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: کامیل چه شکلی است؟
    gloss: کامیل چه شکلی است؟
    note: '*Comment est ... ?* پرسش اصلی این بخش است؛ با آن دربارهٔ ظاهر هر کسی می‌توانین بپرسین.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: کامیل موی دراز و بور و چشم‌های آبی دارد
    gloss: کامیل موی دراز و بور و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *et* در یک جمله می‌آورد.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: کامیل نینا را معرفی می‌کند
    gloss: 'کامیل: یک دختر تازه به کافهٔ زبان‌ها می‌آید. نامش نینا است.'
    note: '*Une nouvelle fille vient* کسی تازه را به صحنه معرفی می‌کند؛ *vient* از *venir* (آمدن) است.'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: ماتیو می‌پرسد که او چه شکلی است
    gloss: 'ماتیو: خوب! او چه شکلی است؟'
    note: 'پرسش اصلی این بار با *elle* (او) به جای نام آمده است: *Comment est-elle ?* خط پیوند فعل و ضمیر را وصل می‌کند.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: کامیل قد و موی نینا را توصیف می‌کند
    gloss: 'کامیل: او قدکوتاه است و موی کوتاه و بور دارد.'
    note: '*petite* از درس اول با واژه‌های مو از درس دوم یکجا شده است؛ *petite* برای دختر *e* می‌گیرد.'
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: ماتیو دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'ماتیو: و چشم‌هایش؟'
    note: '*Ses yeux* در اینجا یعنی «چشم‌های او»: *ses* با *yeux* مطابقت می‌کند، نه با دختر.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: کامیل چشم‌های نینا را توصیف می‌کند
    gloss: 'کامیل: او چشم‌های سبز دارد.'
    note: '*yeux verts* از درس سوم دوباره آمده است.'
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: ماتیو او را می‌شناسد
    gloss: 'ماتیو: تشکر! پس او را می‌شناسم.'
    note: '*Je vais la reconnaître* برای آیندهٔ نزدیک از *aller* + مصدر کار می‌گیرد و *la* یعنی «او را» (برای زن).'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: مقایسهٔ توماس و لئا
    gloss: توماس و لئا برادر و خواهر استند، اما شبیه هم نیستند. توماس قدکوتاه است و موی کوتاه و قهوه‌یی و چشم‌های قهوه‌یی دارد. لئا از توماس قدبلندتر است و موی دراز و قهوه‌یی و چشم‌های سبز دارد. و تو چه شکلی استی؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      frère: برادر
      sœur: خواهر
      ressemblent: ظاهر شدن، به نظر آمدن
      différents: فرق دار
      petit: کوتاه
      courts: کوتاه
      bruns: قهوه‌یی
      cheveux: مو
      marron: قهوه‌یی
      yeux: چشم‌ها
      grande: قدبلندتر
      longs: دراز
      verts: سبز
      se: (بخشی از 'se ressemblent' = شبیه هم استند)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que با اشخاص
    gloss: 'شما الگوی *plus* + صفت + *que* را از قبل می‌دانین. اینجا آن را برای اشخاص به کار می‌برید: لئا از توماس قدبلندتر است.'
    note: همان الگوی *plus ... que* از بخش خریداری، اینجا برای اشخاص به جای اشیا به کار رفته است. *Grande* با *Léa* که زن است مطابقت می‌کند.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: موی لئا از موی توماس درازتر است
    gloss: موی لئا از موی توماس درازتر است.
    note: '*Plus longs que* با *cheveux* (جمع) مطابقت می‌کند: *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جملهٔ نمونه با اول شخص و *J'ai ...*، آماده برای وقتی که ظاهر خود را توصیف می‌کنین.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: ماتیو نینا را می‌بیند
    gloss: 'ماتیو: ببین، این نینا است؟ او موی کوتاه و بور و چشم‌های سبز دارد.'
    note: '*Regarde* (ببین) شکل امری *tu* از *regarder* است که در یک گفت‌وگوی پیشین هم به همین شکل آمده بود.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: کامیل تأیید می‌کند
    gloss: 'کامیل: بلی، این نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: نینا به ماتیو سلام می‌دهد
    gloss: 'نینا: سلام، تو ماتیو استی؟'
    note: 'یک پرسش ساده و دوستانهٔ سلام‌وعلیک: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: ماتیو جواب سلام نینا را می‌دهد
    gloss: 'ماتیو: بلی! از آشنایی با تو خوشحال شدم، نینا.'
    note: '*Ravi de te rencontrer* عبارت معمول برای نخستین دیدار است (*ravi* برای مرد، *ravie* برای زن)، نه *content de te revoir* که برای کسی است که از قبل می‌شناسید.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفت‌وگو را به پایان می‌رساند؛ ماتیو نینا را از روی توصیف کامیل شناخت.
