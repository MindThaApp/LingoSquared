course:
  title: فرانسوی A1
  description: واژه‌های خانوادهٔ نزدیک و دورتر، نظام صفت‌های ملکی mon/ma/mes و توصیف یک خانواده؛ ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو از واحدهای 01 و 02. صفت ملکی فرانسوی با جنسیت اسمی که بعدش می‌آید هماهنگ می‌شود، نه با جنسیت صاحبش.
units:
  fr.a1.unit03.family:
    title: خانواده‌های اینس و ماتیو
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: خانوادهٔ نزدیک
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'صفت‌های ملکی: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: خویشاوندان
  fr.a1.unit03.lesson04.describing_family_size:
    title: در خانه چند نفر اند
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: خواندن معرفی یک خانواده
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: عکس‌های خانوادگی با اینس و ماتیو
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: مادر
    gloss: مادر
    note: '*Mère* مؤنث است. *Maman* در میان اعضای خانواده در گپ روزمره بیشتر استفاده می‌شود، اما *mère* بی‌طرف است و در فهرست‌های واژگان این کورس می‌آید.'
  fr.a1.unit03.lesson01.teach.pere:
    title: پدر
    gloss: پدر
    note: '*Père* مذکر است. *Papa* معادل روزمرهٔ آن است، همان‌طور که *maman* برای *mère* است.'
  fr.a1.unit03.lesson01.teach.frere:
    title: برادر
    gloss: برادر
    note: '*Frère* مذکر مفرد است.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: خواهر
    gloss: خواهر
    note: '*Sœur* مؤنث مفرد است. حرف œ در املای فرانسوی یک حرف واحد است، نه دو حرف جداگانه.'
  fr.a1.unit03.lesson01.teach.fils:
    title: پسر
    gloss: پسر
    note: '*Fils* مذکر است؛ حرف s آخرش، برخلاف قاعده، تلفظ می‌شود و l آن خاموش است.'
  fr.a1.unit03.lesson01.teach.fille:
    title: دختر
    gloss: دختر
    note: '*Fille* مؤنث مفرد است؛ همین کلمه در جاهای دیگر معنای «دختر» را هم می‌دهد.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: پدر و مادر
    note: '*Parents* مذکر جمع است و مادر و پدر را با هم در بر می‌گیرد.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: برادر و خواهر
    gloss: برادران و خواهران؛ برادر و خواهر
    note: فرانسوی برای «برادر و خواهر» یک کلمهٔ واحد و بی‌جنسیت ندارد؛ *frères et sœurs* هر دو را صریح می‌گوید.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: مادرم
    gloss: مادرم
    note: '*Ma* ضمیر ملکی مفرد مؤنث به معنای «من/ام» است و چون *mère* مؤنث است، ma به کار رفته است.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: پدرم
    gloss: پدرم
    note: '*Mon* ضمیر ملکی مفرد مذکر به معنای «من/ام» است و چون *père* مذکر است، mon به کار رفته است.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: برادر و خواهرهایم
    gloss: برادر و خواهرهایم
    note: '*Mes* ضمیر ملکی جمع است و برای هر اسم جمع، چه مذکر و چه مؤنث، به کار می‌رود. مطابقت آن مثل *ma*/*mon* است، با این فرق که به جمع بودن نگاه می‌کند، نه به جنسیت.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: پرسیدن دربارهٔ برادر و خواهر
    gloss: برادر یا خواهر داری؟
    note: '*As-tu* شکل سؤالی (با جابه‌جایی) *tu as* (تو داری) است و در سطح A1 بسیار رایج است.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: گفتن تعداد برادر و خواهر
    gloss: من دو خواهر دارم.
    note: '*J''ai* (من دارم) همراه با یک عدد و اسم خانواده، شکل معمول گفتن تعداد برادر و خواهر است.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: پرسیدن بزرگ بودن خانواده
    gloss: خانوادهٔ تو بزرگ است؟
    note: '*Ta* ضمیر ملکی مفرد مؤنث غیررسمی به معنای «تو/ت» است و با اسم مؤنث *famille* مطابقت دارد.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: توصیف یک خانوادهٔ کوچک
    gloss: خانوادهٔ من کوچک است.
    note: '*Petite* با اسم مؤنث *famille* مطابقت دارد؛ با اسم مذکر شکل مذکر آن، *petit*، می‌آید. این مطابقت با مطابقت *mon*/*ma*/*mes* فرق دارد: آنها مالکیت را نشان می‌دهند، اما petite یک ویژگی را بیان می‌کند.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: پدرکلان
    gloss: پدرکلان
    note: '*Grand-père* یک کلمهٔ مرکب با خط‌پیوند و مذکر است.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: مادرکلان
    gloss: مادرکلان
    note: '*Grand-mère* یک کلمهٔ مرکب با خط‌پیوند و مؤنث است. توجه کنید که *grand-* ثابت می‌ماند و به شکل *grande-mère* درنمی‌آید.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: پدرکلان و مادرکلان
    gloss: پدرکلان و مادرکلان
    note: در *grands-parents* هر دو بخش کلمهٔ مرکب جمع بسته می‌شود (*grands*، نه *grand-*)؛ در حالی که در شکل مفرد *grand-mère*/*grand-père* بخش *grand-* تغییر نمی‌کند.
  fr.a1.unit03.lesson03.teach.oncle:
    title: کاکا / mama
    gloss: کاکا یا ماما
    note: '*Oncle* مذکر است.'
  fr.a1.unit03.lesson03.teach.tante:
    title: خاله یا عمه
    gloss: خاله یا عمه
    note: '*Tante* مؤنث است.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: پسرکاکا / پسرماما (پسر)
    gloss: پسرکاکا یا پسرخاله
    note: '*Cousin* مذکر و مفرد است؛ در فرانسوی جنسیت خویشاوند در خود کلمه نشان داده می‌شود (cousin برای مرد، cousine برای زن).'
  fr.a1.unit03.lesson03.teach.cousine:
    title: دخترکاکا یا دخترخاله
    gloss: دخترکاکا یا دخترخاله
    note: '*Cousine* مؤنث و مفرد است و با افزودن -e به *cousin* ساخته می‌شود.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: پدرکلان و مادرکلان من
    gloss: پدرکلان و مادرکلانم
    note: '*Mes* به کار می‌رود چون *grands-parents* جمع است، حتی اگر این کلمه شامل مذکر و مؤنث هر دو باشد.'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: پرسیدن تعداد خواهر و برادر
    gloss: چند خواهر و برادر داری؟
    note: در فرانسوی بعد از *Combien de* (چند) اسم مستقیم می‌آید و برای سؤال، فعل کمکی جداگانه لازم نیست.
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: گفتن تعداد اعضای خانه
    gloss: ما در خانه شش نفر استیم.
    note: '*On est* (در اصل «یکی است»، اما در گفتار غیررسمی به معنای «ما استیم») شکل طبیعی و بسیار رایج گفتن تعداد اعضای خانه در فرانسوی محاوره‌ای است؛ *nous sommes* رسمی‌تر و بیشتر نوشتاری است.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: توصیف خانوادهٔ کلان
    gloss: خانوادهٔ من کلان است.
    note: '*Grande* با اسم مؤنث *famille* مطابقت دارد؛ با اسم مذکر شکل مذکر آن، *grand*، می‌آید.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: گفتن اینکه پسرکاکا و دخترکاکای زیاد داری
    gloss: من پسرکاکا و دخترکاکای زیاد دارم.
    note: '*Beaucoup de* (بسیار) پیش از اسم می‌آید؛ بعد از آن *de* به *du*/*des* تبدیل نمی‌شود، چون *beaucoup* خودش مقدار را مشخص می‌کند.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: پرسیدن از زندگی نزدیک والدین
    gloss: آیا نزدیک پدر و مادرت زندگی می‌کنی؟
    note: '*Tes* ضمیر ملکی جمع غیررسمی به معنای «تو/ت» است و چون *parents* جمع است، به کار می‌رود.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: گفتن اینکه با کی زندگی می‌کنی
    gloss: من با پدرکلان و مادرکلانم زندگی می‌کنم.
    note: '*Avec* (با) برای گفتن کسانی که با آنها زندگی می‌کنیم به کار می‌رود؛ *j''habite* شکل *je* فعل *habiter* است که در واحد ۱ در *j''habite à Montreuil* دیده بودید.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: معرفی خانوادهٔ Inès
    gloss: 'نام من Inès است. سی و یک ساله هستم و با پدرکلان و مادرکلانم در پاریس زندگی می‌کنم. مادر و پدرم در لیل زندگی می‌کنند. دو خواهر و یک برادر دارم: ما در خانه شش نفر استیم. خواهر کوچکم Camille نام دارد و بیست ساله است.'
    note: این معرفی‌نامه کلمات و ساختارهای درس‌های ۱ تا ۴ را در یک متن کوتاه و پیوسته دوباره می‌آورد، نه در جمله‌های جدا از هم؛ همان مهارت خواندن «چه کسی کیست» که ارزیابی خواندن این واحد روی آن تمرکز دارد.
    glosses:
      trente: سی
      ans: ساله
      grands-parents: پدرکلان و مادرکلان
      mère: مادر
      père: پدر
      habitent: زندگی می‌کند
      deux: دو
      sœurs: خواهرها
      frère: برادر
      six: شش
      maison: خانه
      petite: کوچک
      sœur: خواهر
      vingt: بیست
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: خواهر کوچک
    gloss: خواهر کوچک
    note: '*Petite* (مؤنث *petit*) این‌جا پیش از اسم آمده است، مثل بیشتر صفت‌های کوتاه و رایج فرانسوی؛ در حالی که بیشتر صفت‌ها بعد از اسم می‌آیند.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: زندگی می‌کند (شخص سوم)
    gloss: زندگی می‌کند
    note: '*Habite* شکل سوم شخص مفرد فعل *habiter* است و برای گفتن دربارهٔ دیگران به کار می‌رود (*Inès habite...*)، نه برای گفتن دربارهٔ خود (*j''habite*، که در واحد ۱ و درس ۴ همین واحد دیدید).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: او/شان (اسم جمع)
    gloss: او / شان
    note: '*Ses* شکل جمع *sa*/*son* است. همان‌طور که *sa*/*son* برای اسم مفرد «اش» را می‌رساند، ses برای اسم جمع به کار می‌رود؛ *ses grands-parents* وقتی دربارهٔ Inès حرف می‌زنیم یعنی «پدرکلان و مادرکلانش».'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: دارد (سوم شخص)
    gloss: دارد
    note: '*A* شکل سوم شخص مفرد فعل *avoir* است و برای گفتن دربارهٔ دیگران به کار می‌رود (*elle a vingt ans*)، نه برای گفتن دربارهٔ خود (*j''ai* / *as-tu*، که در درس‌های ۲ تا ۴ همین واحد دیدید).'
  fr.a1.unit03.lesson06.teach.line01:
    title: نشان دادن عکس‌های خانواده
    gloss: Inès یک عکس را به Mathieu نشان می‌دهد و پدر و مادر و خواهر کوچکش را معرفی می‌کند.
    note: '*Voici* (این‌جا است/این‌جا استند) برای نشان دادن چیزی به کار می‌رود و برای نشان دادن عکس عبارت طبیعی است.'
  fr.a1.unit03.lesson06.teach.line02:
    title: واکنش و پرسیدن دربارهٔ خواهر و برادر
    gloss: Mathieu با خوشحالی واکنش نشان می‌دهد و می‌پرسد که آیا برادر یا خواهر دیگری هم دارد.
    note: '*C''est adorable* واکنش طبیعی و گرم در برابر دیدن عکس یک برادر یا خواهر کوچک است.'
  fr.a1.unit03.lesson06.teach.line03:
    title: گفتن تعداد اعضای خانه و پرسیدن همان سوال
    gloss: Inès می‌گوید دو خواهر و یک برادر دارد و در خانه شش نفر استند؛ بعد از خانوادهٔ Mathieu می‌پرسد.
    note: '*On est six à la maison* تعداد اعضای خانه را می‌گوید و الگوی درس ۴ را ادامه می‌دهد.'
  fr.a1.unit03.lesson06.teach.line04:
    title: توصیف خانوادهٔ کوچک‌تر
    gloss: 'Mathieu می‌گوید خانوادهٔ او کوچک‌تر است، فقط سه نفر: پدر و مادرش و خودش؛ اما پسرکاکا و دخترکاکاهای زیاد دارد.'
    note: '*Mais* (اما) تضاد را نشان می‌دهد: خانوادهٔ نزدیک کوچک است، ولی خویشاوندان دورتر زیاد استند.'
  fr.a1.unit03.lesson06.teach.line05:
    title: پرسیدن از نزدیکی به والدین
    gloss: Inès می‌پرسد که آیا Mathieu نزدیک پدر و مادرش زندگی می‌کند.
    note: '*Près de* (نزدیک) راه رایج گفتن نزدیکی در مکان است.'
  fr.a1.unit03.lesson06.teach.line06:
    title: توضیح فاصله و در تماس ماندن
    gloss: Mathieu می‌گوید نه، آنها در لیون زندگی می‌کنند و هر هفته با تلفون با هم حرف می‌زنند.
    note: 'این جمله همان چیزی را ادامه می‌دهد که در واحد ۱ آمد: Mathieu از لیون است؛ پدر و مادرش آن‌جا مانده‌اند و او در Saint-Ouen زندگی می‌کند.'
  fr.a1.unit03.lesson06.teach.line07:
    title: همدردی کردن و گفتن وضعیت خودت
    gloss: Inès می‌گوید می‌فهمد و خودش این‌جا در پاریس با پدرکلان و مادرکلانش زندگی می‌کند.
    note: '*Je comprends* (می‌فهمم) راه کوتاه و طبیعی است برای نشان دادن اینکه حرف طرف مقابل را شنیده‌ایم، پیش از آنکه چیزی از خود بگوییم.'
  fr.a1.unit03.lesson06.teach.line08:
    title: پایان دادن با یک حرف گرم
    gloss: Mathieu می‌گوید خوب است که آدم خانواده‌اش را نزدیک خود داشته باشد.
    note: '*C''est bien d''avoir sa famille près de soi* گفتگو را با لحن گرم و متفکرانه تمام می‌کند و الگوی *près de* درس ۴ را تکرار می‌کند.'
