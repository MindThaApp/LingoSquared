  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: کی چطور سفر می‌کند؟
    gloss: کمیل هر روز با ریل به کارش می‌رود. ماتیو بیشتر با بایسکل می‌رود، اما وقتی باران می‌بارد با ریل هم می‌رود. توماس ترجیح می‌دهد با موتر برود. لیا خیلی نزدیک زندگی می‌کند و پیاده به کارش می‌رود. تو چطور به کارت می‌روی؟
    note: چهار راه مختلف رفتن به کار و یک شرط (باران) را مقایسه می‌کند، مثل متن مقایسهٔ ورزش در بخش قبلی.
