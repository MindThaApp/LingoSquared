    note: زبان‌آموزان گاهی این عبارت‌ها را با حرف اضافهٔ دیگر می‌گویند، مثلاً *par vélo* یا *dans le train*. *à vélo*، *à pied*، *en train* و *en voiture* را مثل عبارت‌های ثابت یاد بگیرین.
