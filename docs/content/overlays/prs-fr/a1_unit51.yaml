teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چند تمام می‌شود؟
    note: '*En tout* (در مجموع) واضح می‌کند که قیمت کل را می‌خواهی، نه قیمت یک چیز را.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: گفتن قیمت مجموع
    gloss: در مجموع بیست و پنج یورو تمام می‌شود.
    note: '*Ça coûte* ضمیر *ça* (آن) را با *coûte* دارد، شکل فعل *coûter* (قیمت داشتن) برای یک چیز.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: '*Payer par carte* راه معمول گفتن پرداخت با کارت است و *payer en espèces* یعنی پرداخت نقد. با *carte* از *par* و با *espèces* از *en* کار بگیر.'
    example_gloss:
    - اینجا می‌توانم با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: پرسیدن امکان پرداخت با کارت
    gloss: اینجا می‌توانم با کارت پرداخت کنم؟
    note: '*Ici* (اینجا) سؤال را به همان کاونتری که ایستاده‌ای ربط می‌دهد.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*Vous voulez ... ?* شکل رسمی پرسیدن است که صندوق‌دار برای کسی که نمی‌شناسد به کار می‌برد؛ دوستان می‌گویند *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: حساب
    gloss: حساب
    note: '*Addition* مؤنث است: *l''addition*. *La* پیش از مصوت به *l''* کوتاه می‌شود.'
    example_gloss: حساب را تقسیم کنیم؟
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*On ... ?* پیشنهاد انجام دادن کاری با هم است، مثل *On partage ?*. *Partager* (تقسیم کردن) با *l''addition* می‌آید.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*Séparément* (جدا) درست بعد از *payer* می‌آید؛ راه مؤدبانهٔ خواستن حساب جداگانه است.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: پول خورد
    gloss: پول خورد
    note: '*Monnaie* مؤنث است: *la monnaie*. یعنی سکه‌ها و پول خوردی که پس می‌گیری.'
    example_gloss: این هم پول خوردتان.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: دادن پول خورد
    gloss: این هم پول خوردتان.
    note: '*Votre* شکل رسمی «تان» است و با رسمیت *vous* در کاونتر هماهنگ است.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: 'بعد از *Avoir besoin de* (ضرورت داشتن) اسم می‌آید: *Je n''ai pas besoin de monnaie.* بعد از *ne ... pas*، *de* جای *de la* را می‌گیرد.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: سی و پنج
    gloss: سی و پنج
    note: '*Trente-cinq* با خط پیوند نوشته می‌شود و اول دهگان می‌آید: سی + پنج.'
    example_gloss: سی و پنج یورو تمام می‌شود.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'حساب: دو غذای اصلی و دو قهوه. مجموع: سی و پنج یورو. با کارت پرداخت شد.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      Addition: حساب
      deux: دو
      plats: غذاهای اصلی
      cafés: قهوه‌ها
      Total: مجموع
      trente-cinq: سی و پنج
      euros: یورو
      Payé: پرداخت شده
      carte: کارت
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: کامیل حساب را می‌خواهد
    gloss: 'کامیل: حساب را بخواهیم؟'
    note: '*Demander* (خواستن) مفعول مستقیمش یعنی *l''addition* را بدون هیچ کلمهٔ اضافی می‌گیرد.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: ماتیو مجموع را می‌پرسد
    gloss: 'ماتیو: بلی، فکر خوبی است. در مجموع چند می‌شود؟'
    note: سؤال *Combien ça coûte en tout ?* از درس اول دوباره آمده است.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: کامیل مجموع را می‌گوید
    gloss: 'کامیل: سی و پنج یورو می‌شود. باهم تقسیم کنیم؟'
    note: '*Ça fait* + مبلغ، مجموع را می‌گوید و *partager* به صورت حساب اشاره می‌کند.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: ماتیو اصرار می‌کند که خودش پول بدهد
    gloss: 'ماتیو: نه، بگذار امروز من پول بدهم. تو خیلی کمکم کردی.'
    note: '*Laisse-moi* + مصدر پیشنهاد انجام دادن کاری است و *aidé* صفت مفعولی *aider* (کمک کردن) است.'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: کامیل متأثر می‌شود
    gloss: 'کامیل: این از مهربانی تو است! تشکر.'
    note: '*C''est gentil de ta part* (این از مهربانی تو است) تعریف گرم و رایج برای یک کار سخاوتمندانه است.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: ماتیو دربارهٔ پرداخت با کارت می‌پرسد
    gloss: 'ماتیو: اینجا با کارت پول داده می‌توانم؟'
    note: جملهٔ *Je peux payer par carte ici ?* از درس دوم دوباره آمده، حالا در خود رستورانت.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: شکل «او»'
    gloss: ماتیو صورت حساب را پرداخت می‌کند.
    note: '*Paie* شکل *il/elle* فعل *payer* (پرداخت کردن) است: *je paie, tu paies, il paie*.'
