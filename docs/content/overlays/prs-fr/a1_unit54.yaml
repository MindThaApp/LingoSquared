teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Un animal* کلمه عمومی است؛ *un animal de compagnie* (در اصل «حیوان همدم») به‌طور خاص یعنی حیوان خانگی.'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم است.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: سگ و پشک
    gloss: سگ / پشک
    example_gloss:
    - کمیل یک سگ دارد.
    - توماس یک گربه دارد.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدرکلان یک ماهی دارد.
    - Nina یک پرنده دارد.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: همان الگوی سوال *Tu as ... ?* که از واحدهای قبلی می‌شناسید.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: بلی، سگ دارم
    gloss: بلی، یک سگ دارم.
    note: یک جواب مثبت ساده با واژه‌های جدید این درس.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'بعد از منفی، *pas d''* به جای *un* می‌آید: *Je n''ai pas d''animal de compagnie.* یادداشت دستور زبان را ببینین.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: منفی کردن un/une/des'
    gloss: بعد از *ne ... pas*، *un*، *une* و *des* به *de* یا *d'* تبدیل می‌شوند، مثل *Je n'ai pas de temps* (که از قبل می‌دانین) و اینجا *Je n'ai pas d'animal de compagnie*.
    note: 'این همان الگویی است که در *Je n''ai pas de temps* آموختید: دستور تازه نیست، فقط اسم تازه است.'
  fr.a1.unit54.lesson02.teach.promener:
    title: گشت دادن (حیوان)
    gloss: حیوان را به گشت بردن
    note: '*Promener* (قدم دادن) یک فعل باقاعده با پایان *-er* است؛ یادداشت دستور زبان را ببینین.'
    example_gloss: من هر روز سگ را به گشت می‌برم.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener یک فعل باقاعده با پایان -er است
    gloss: '*Promener* یک فعل باقاعده با پایان *-er* است، مثل *cuisiner*: *je promène, tu promènes, il promène le chien*. نشانه روی *e* می‌رساند که تلفظ می‌شود.'
    note: فعل همیشه یک‌تکه می‌ماند، مثل فعل‌های دیگر با پایان *-er* که از قبل می‌شناسید.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به پشک غذا می‌دهم.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: توماس با گربه‌اش بازی می‌کند.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: من هر روز سگ را به گشت می‌برم
    gloss: من هر روز سگ را به گشت می‌برم.
    note: '*promener* را با *tous les jours* (هر روز) که از واحد قبلی می‌شناسید یکجا می‌کند.'
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: من هر روز به پشک غذا می‌دهم
    gloss: من هر روز به پشک غذا می‌دهم.
    note: '*donner à manger* (در اصل «دادن برای خوردن») را با *tous les jours* یکجا می‌کند.'
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'جمع: chien -> chiens'
    gloss: 'در جمع معمولاً یک *s* اضافه می‌شود که شنیده نمی‌شود: *chien -> chiens*، *chat -> chats*. اسم‌های با پایان *-al* به *-aux* تغییر می‌کنند: *animal -> animaux*.'
    note: قاعده جمع باقاعده در فرانسوی که اینجا بار اول با اسم‌های حیوانات معرفی می‌شود.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: سگ‌ها و پشک‌ها
    gloss: سگ‌ها / پشک‌ها
    example_gloss:
    - ماتیو سگ‌ها را دوست دارد.
    - لیا گربه‌ها را دوست دارد.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - کاکا پرنده‌ها را خیلی دوست دارد.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: من حیوانات را خیلی دوست دارم
    gloss: من حیوانات را خیلی دوست دارم.
    note: 'بعد از *Adorer* (خیلی دوست داشتن) مستقیماً اسم می‌آید و برای سلیقه عمومی *les* می‌آید: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: لیا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد
    gloss: لیا گربه‌ها را دوست دارد، اما حیوان خانگی ندارد.
    note: زمینه را برای تضادی آماده می‌کند که متن خواندنی بعدی بر آن ساخته شده است.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: ماتیو درباره حیوان خانگی می‌پرسد
    gloss: 'ماتیو: کمیل، تو حیوان خانگی داری؟'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: کمیل یک سگ دارد
    gloss: 'کمیل: بلی، من یک سگ دارم.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: ماتیو می‌پرسد ظاهرش چطور است
    gloss: 'متیو: شکل و قیافه‌اش چطور است؟'
    note: عبارت *Comment est-il ?* از درس ظاهر دوباره آمده، اما حالا درباره یک حیوان پرسیده می‌شود.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: کامیل سگش را توصیف می‌کند
    gloss: 'کامیل: پشمش قهوه‌یی است و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر و قیافه دوباره آمده‌اند، این بار برای توصیف پشم یک حیوان، نه موی یک شخص.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le برای حیوانات
    gloss: '*Il* (او) و *le* (او را) را برای حیوان نر هم می‌شود به کار برد، نه فقط برای انسان.'
    note: در همه درس‌های قبلی این کورس، *il* و *le* فقط برای انسان به کار رفته بودند؛ اینجا کاربرد آن‌ها برای حیوانات صراحتاً نشان داده می‌شود.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: متیو درباره قدم زدن می‌پرسد
    gloss: 'متیو: هر روز او را قدم می‌دهی؟'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: کامیل کارهای روزانه‌اش را می‌گوید
    gloss: 'کامیل: بلی، هر روز او را قدم می‌دهم و به او غذا می‌دهم.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: متیو، لیا و توماس درباره حیوانات
    gloss: 'متیو و لیا هر دو حیوانات را دوست دارند، اما هیچ‌کدام شان حیوان خانگی ندارند. متیو سگ‌ها را دوست دارد و لیا گربه‌ها را. اما توماس یک حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به آن غذا می‌دهد. تو چه، حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      adorent: خیلی دوست دارند
      tous: هر دو
      animaux: حیوانات
      deux: هر دو
      compagnie: حیوان خانگی
      chiens: سگ‌ها
      chats: پشک‌ها
      chat: پشک
      joue: بازی می‌کند
      donne: می‌دهد
      chaque: هر
      manger: غذا
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: توماس اکثراً با گربه‌اش بازی می‌کند
    gloss: توماس اکثراً با گربه‌اش بازی می‌کند.
    note: '*Souvent* (اکثراً) درست بعد از فعل می‌آید، مثل جمله‌های روتین قبلی.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: کامیل از نینا می‌پرسد
    gloss: 'کامیل: نینا، تو هم حیوان خانگی داری؟'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina یک پرنده به نام Pico دارد
    gloss: 'Nina: بلی، یک پرنده دارم. نامش Pico است.'
    note: '*Il s''appelle* (نامش ... است) همان فعلی است که در درس اول برای معرفی استفاده شد.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: متیو واکنش نشان می‌دهد
    gloss: 'متیو: چه قشنگ! هر روز با او چه کار می‌کنی؟'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina هر روز به او غذا می‌دهد
    gloss: 'Nina: هر روز به او غذا می‌دهم.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: متیو پرنده‌ها را هم دوست دارد
    gloss: 'متیو: من پرنده‌ها را هم دوست دارم.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: کامیل گفتگو را ختم می‌کند
    gloss: 'کامیل: عالی است، ما هر سه حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره حیوانات در این درس را کنار هم جمع‌بندی می‌کند.
