teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: صفر
    gloss: صفر
    note: '*Zéro* هم به عنوان خود عدد به کار می‌رود و هم هنگام خواندن بلند یک ردیف رقم، به عنوان رقم.'
  fr.a1.unit02.lesson01.teach.un:
    title: یک
    gloss: یک
    note: '*Un* مذکر است؛ شکل مؤنث *une* پیش از اسم مؤنث می‌آید (*une tasse*، یک پیاله). به تنهایی، مثل وقت شمردن، *un* می‌ماند.'
  fr.a1.unit02.lesson01.teach.deux:
    title: دو
    gloss: دو
    note: '*Deux* با جنس اسم تغییر نمی‌کند.'
  fr.a1.unit02.lesson01.teach.trois:
    title: سه
    gloss: سه
    note: '*Trois* تغییر نمی‌کند.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: چهار
    gloss: چهار
    note: '*Quatre* تغییر نمی‌کند.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: پنج
    gloss: پنج
    note: '*Cinq* تغییر نمی‌کند. q آخر معمولاً تلفظ می‌شود، برخلاف حرف‌های بی‌صدای آخر چند عدد دیگر فرانسوی.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: شش
    note: '*Six* وقتی به تنهایی گفته شود با صدای /s/ در آخر تلفظ می‌شود، اما پیش از اسمی که با حرف بی‌صدا شروع می‌شود این صدای آخر حذف می‌شود (*six livres* مثل "si livres" شنیده می‌شود).'
  fr.a1.unit02.lesson01.teach.sept:
    title: هفت
    gloss: هفت
    note: '*Sept* تغییر نمی‌کند؛ p بی‌صدا است و فقط t آخر تلفظ می‌شود.'
  fr.a1.unit02.lesson01.teach.huit:
    title: هشت
    gloss: هشت
    note: '*Huit* تغییر نمی‌کند. h بی‌صدا است، مثل تقریباً همهٔ کلمه‌های فرانسوی.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: نه
    gloss: نه
    note: '*Neuf* تغییر نمی‌کند.'
  fr.a1.unit02.lesson01.teach.dix:
    title: ده
    gloss: ده
    note: '*Dix* وقتی به تنهایی گفته شود با صدای /s/ در آخر تلفظ می‌شود و مثل *six* پیش از حرف بی‌صدا صدای آخرش حذف می‌شود.'
  fr.a1.unit02.lesson02.teach.onze:
    title: یازده
    gloss: یازده
    note: '*Onze* تا *seize* (۱۱ تا ۱۶) هر کدام کلمهٔ جداگانه‌اند و از *dix* ساخته نشده‌اند، برخلاف بیست‌ویک به بعد که *vingt* را دوباره به کار می‌برد.'
  fr.a1.unit02.lesson02.teach.douze:
    title: دوازده
    gloss: دوازده
    note: '*Douze* یک کلمهٔ واحد است. آغازش شبیه *deux* است، اما *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.treize:
    title: سیزده
    gloss: سیزده
    note: '*Treize* یک کلمهٔ واحد است. در آغاز به *trois* شباهت دارد، اما *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: چهارده
    gloss: چهارده
    note: '*Quatorze* یک کلمهٔ واحد است. در آغاز به *quatre* شباهت دارد، اما *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: پانزده
    gloss: پانزده
    note: '*Quinze* رابطهٔ دور با *cinq* دارد، اما *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.seize:
    title: شانزده
    gloss: شانزده
    note: '*Seize* آخرین عدد از اعداد چسپیدهٔ مثل «نوزده‌ها» است؛ از *dix-sept* (17) به بعد، *dix* دوباره آشکارا با یکان ترکیب می‌شود.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: بیست
    gloss: بیست
    note: '*Vingt* کلمهٔ جداگانه است. از بیست‌ویک به بعد، دهگان و یکان با هم ترکیب می‌شوند (*vingt et un*، *vingt-deux*)؛ این الگو را در ادامهٔ همین درس دوباره می‌بینیم.'
  fr.a1.unit02.lesson02.teach.trente:
    title: سی
    gloss: سی
    note: '*Trente* با یکانِ بعد از خود به کمک خط پیوند وصل می‌شود (*trente-quatre*)، به‌جز عدد یک که *et* می‌گیرد (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: سی و چهار
    gloss: سی و چهار
    note: '*Trente-quatre* با خط پیوند نوشته می‌شود؛ دهگان و یکان با علامت (-) به هم وصل می‌شوند.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: شصت
    gloss: شصت
    note: '*Soixante* تا شصت‌ونُه مثل یک دهگان معمولی عمل می‌کند (*soixante-quatre*، 64)؛ بخش غیرمنظم از هفتاد شروع می‌شود که بعد از این یاد می‌گیریم.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: هفتاد
    gloss: هفتاد
    note: 'این بزرگ‌ترین شگفتی در اعداد فرانسوی است: برای هفتاد کلمهٔ جداگانه وجود ندارد. *Soixante-dix* در اصل یعنی «شصت-ده» (60 + 10). شمارش تا *soixante-dix-neuf* (79، «شصت-نزده») به همین شکل ادامه می‌یابد و بعد با *quatre-vingts* پایهٔ تازه برای هشتاد شروع می‌شود.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: هشتاد
    gloss: هشتاد
    note: '*Quatre-vingts* در اصل یعنی «چهار بیست» (4 × 20)، یادگاری از نظام قدیمی شمارش بر پایهٔ بیست. حرف s در آخر فقط وقتی می‌آید که عدد تنها باشد یا عدد به همین کلمه ختم شود (*quatre-vingts*، 80)؛ وقتی یکان بعدش بیاید، s می‌افتد (*quatre-vingt-un*، 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: نود
    gloss: نود
    note: '*Quatre-vingt-dix* در اصل یعنی «چهار بیست به علاوهٔ ده» (4×20 + 10)؛ همان الگوی شمارش بر پایهٔ بیست مثل هفتاد تا *quatre-vingt-dix-neuf* (99) ادامه دارد.'
  fr.a1.unit02.lesson02.teach.cent:
    title: صد
    gloss: صد
    note: '*Cent* شکلی است که برای دقیقاً 100 به‌تنهایی و بدون حرف تعریف به‌کار می‌رود (نه «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: پرسیدن سن به شکل غیررسمی
    gloss: عمرت چند سال است؟
    note: فرانسوی در اصل می‌پرسد «چه سن داری»، و برای این کار از فعل *avoir* (داشتن) کار می‌گیرد، نه از *être* («بودن»).
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: گفتن سن خود
    gloss: بیست و هشت ساله استم.
    note: '*Ai* شکل je فعل *avoir* است. گفتن *ans* (سال) در فرانسوی لازم است و نباید حذف شود.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: پرسیدن سن به شکل رسمی
    gloss: عمرت چند سال است؟
    note: '*Avez-vous* شکل *vous* فعل *avoir* را دارد و با سطح رسمی‌ای که در درس 1 دیدیم می‌خواند.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: گفتن سن مرکب
    gloss: من سی و یک ساله استم.
    note: '*Trente et un* به‌جای خط پیوند، *et* (و) می‌گیرد، و این فقط برای شکل‌های «...یک» در سی، چهل، پنجاه و شصت است (*trente et un*، *quarante et un*، *cinquante et un*، *soixante et un*). هفتادویک از این الگو بیرون است: *soixante et onze* (شصت + یازده) می‌شود، نه *soixante et un*، چون هفتادها با شکل‌های *dix* تا *soixante-dix-neuf* (79) ادامه می‌یابند.'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: پرسیدن سن از طرف مقابل
    gloss: و تو، چند ساله استی؟
    note: '*Et toi* سوالِ جوابی را شروع می‌کند؛ *toi* (نه *tu*) ضمیر تأکیدی است که بعد از *et* می‌آید.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: پرسیدن نمبر تیلفون
    gloss: نمبر تیلفونت چند است؟
    note: '*Quel* با اسم مذکر *numéro* هماهنگ است؛ برای اسم مؤنث باید *quelle* گفته شود.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: نمبری که رقم به رقم خوانده می‌شود
    gloss: صفر، شش، یک، پنج، صفر، دو، نه، هفت، چهار، سه
    note: شماره‌های تیلفون واقعی فرانسه ده رقم دارند و معمولاً دو رقم دو رقم خوانده می‌شوند (*zéro six*، *quinze*، *zéro deux*...). شماره‌های این درس شکل واقعی ده‌رقمی (06 15 02 97 43) را دارند، اما رقم به رقم خوانده می‌شوند تا اول رقم‌های تنها را تمرین کنید.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: شروع گفتن نمبر
    gloss: آن ... است
    note: '*Le* (حرف تعریف مذکر) استفاده می‌شود چون *numéro* اسم مذکر است.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: خواستن تکرار
    gloss: لطفاً تکرار کرده می‌توانی؟
    note: '*Peux* شکل *tu* فعل *pouvoir* (توانستن) است؛ وقتی شماره‌ای زود گفته شود و نفهمیدید، به کار می‌آید.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: قبول کردن فوری
    gloss: البته؛ حتماً
    note: '*Bien sûr* راه معمول و دوستانه برای قبول کردن یک خواهش است.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: گفتن مقدار مورد ضرورت
    gloss: من سه دانه تخم ضرورت دارم.
    note: '*J''ai besoin de* (لفظاً «نیاز دارم به») راه فرانسوی برای گفتن نیاز است و به‌جای یک فعل جداگانه، از *avoir* کار می‌گیرد.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: پرسیدن تعداد مورد ضرورت
    gloss: چند دانه تخم ضرورت داری؟
    note: در *De combien d'œufs*، عبارت *de combien* (از چند) پیش از چیزی که شمرده می‌شود می‌آید.
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: گفتن مقدار پیمانه‌شده
    gloss: دو پیالهٔ آرد
    note: '*De* واحد اندازه (*tasses*، پیاله) را به چیزی که اندازه می‌شود (*farine*، آرد) وصل می‌کند.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: گفتن مقدار نیم
    gloss: نیم پیاله بوره
    note: '*Demi-* به‌شکل پیشوند پیش از اسم تغییر نمی‌کند (*une demi-tasse*)، برخلاف صفت *demi* که بعد از اسم می‌آید و هماهنگ می‌شود (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: گفتن آنچه در دست داری
    gloss: من چهار دانه تخم بالای میز دارم.
    note: '*J''ai* (دارم) از چیزی خبر می‌دهد که همین حالا موجود است؛ این با *j''ai besoin de* (نیاز دارم) فرق دارد که از چیزی خبر می‌دهد که هنوز کم است.'
  fr.a1.unit02.lesson06.teach.line01:
    title: پرسیدن تعداد تخم
    gloss: اینس از ماتیو می‌پرسد برای دستورپخت چند تخم لازم دارد.
    note: 'اینس و ماتیو حالا به‌جای *vous* در واحد 1، از *tu* کار می‌گیرند: چون هم‌صنفی‌های کارگاه استند، زود به شکل غیررسمی گذشته‌اند.'
  fr.a1.unit02.lesson06.teach.line02:
    title: گفتن مواد
    gloss: ماتیو می‌گوید سه تخم و دو پیاله آرد لازم دارد.
    note: '*J''ai besoin de* چیزهایی را می‌گوید که برای دستورپخت هنوز لازم است.'
  fr.a1.unit02.lesson06.teach.line03:
    title: پیشنهاد آنچه در دست است
    gloss: اینس می‌گوید چهار تخم بالای میز دارد و می‌پرسد که ماتیو شکر هم لازم دارد یا نه.
    note: '*J''ai* چیزی را می‌گوید که اینس همین حالا دارد، و از آنچه ماتیو لازم دارد جدا است.'
  fr.a1.unit02.lesson06.teach.line04:
    title: تأیید مقدار کم
    gloss: ماتیو می‌گوید بلی، کمی؛ تقریباً نیم پیاله.
    note: '*Environ* اینجا یعنی «تقریباً» و مقدار دقیق را نرم می‌سازد.'
  fr.a1.unit02.lesson06.teach.line05:
    title: پرسیدن نمبر تیلفون
    gloss: اینس می‌گوید عالی، بعد شمارهٔ تیلفون ماتیو را می‌خواهد تا برای درس بعدی برایش پیام بفرستد.
    note: '*Comme ça je t''écris* («تا برایت بنویسم») دلیل پرسیدنِ اینس را می‌گوید؛ پیش از خواستن معلومات تماس، گفتن دلیل در گپ‌وگفت روزمره عادت طبیعی است.'
  fr.a1.unit02.lesson06.teach.line06:
    title: گفتن نمبر تیلفون
    gloss: ماتیو شمارهٔ خود را رقم به رقم می‌خواند.
    note: '*C''est le* شماره را معرفی می‌کند و با اسم مذکر *numéro* هماهنگ است.'
  fr.a1.unit02.lesson06.teach.line07:
    title: تشکر و پرسیدن سن
    gloss: 'اینس تشکر می‌کند، بعد یک سوال دیگر می‌پرسد: عمرش چند است.'
    note: '*Une dernière question* («یک سوال آخر») تغییر طبیعی موضوع در همان گفتگو را نشان می‌دهد.'
  fr.a1.unit02.lesson06.teach.line08:
    title: گفتن سن او
    gloss: ماتیو می‌گوید بیست‌وهشت ساله است و همین سوال را از اینس می‌پرسد.
    note: '*J''ai vingt-huit ans* شکل ترکیبیِ دارای خط پیوند را دارد.'
  fr.a1.unit02.lesson06.teach.line09:
    title: گفتن سن او
    gloss: اینس می‌گوید سی‌ویک ساله است.
    note: '*J''ai trente et un ans* به‌جای خط پیوند، *et* (و) می‌گیرد، چون سی‌ویک از شکل‌های «...یک» است.'
