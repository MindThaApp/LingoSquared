course:
  title: فرانسوی A1
  description: اعداد ۰ تا ۱۰۰ (با شکل‌های soixante-dix، quatre-vingts و quatre-vingt-dix)، سن، شمارهٔ تیلفون و مقدار مواد در دستور پخت، در ادامهٔ اینس و متیو در کارگاه آشپزی واحد اول. راهنمایی‌ها بر بیان سن با avoir، باقی‌ماندهٔ شمارش بیست‌بیستی در اعداد فرانسوی و مطابقت جنس در عبارت‌های مقدار تأکید دارد.
