teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: پرسیدن دربارهٔ شغل کسی
    gloss: شما چه کار می‌کنین؟
    note: راه معمول و دوستانه برای پرسیدن شغل کسی.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: شغل / آشپز
    gloss: شغل؛ آشپز
    note: '*Métier* (شغل) مذکر است: *le métier*. *Cuisinier* برای زن تغییر می‌کند: *un cuisinier*، *une cuisinière*.'
    example_gloss:
    - شغل تو چیست؟
    - من به حیث آشپز کار می‌کنم.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: گفتن اینکه آشپز استین
    gloss: من به حیث آشپز کار می‌کنم.
    note: '*Travailler comme* + شغل الگوی معمول برای گفتن شغل است، و پیش از اسم شغل حرف تعریف نمی‌آید.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: نرس
    gloss: نرس
    note: اصطلاح امروزی و بی‌جنسیت برای این شغل که برای هر جنسیت به کار می‌رود.
    example_gloss: من به حیث نرس کار می‌کنم.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: گفتن اینکه نرس استین
    gloss: من به حیث نرس کار می‌کنم.
    note: از همان الگوی *travailler comme* مثل *cuisinier* پیروی می‌کند؛ مؤنث آن *infirmière* است.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: پرسیدن دربارهٔ محل کار
    gloss: در کجا کار می‌کنی؟
    note: پرسش بعدی مستقیم برای *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: کار در رستورانت
    gloss: من در یک رستورانت کار می‌کنم.
    note: '*Un restaurant* اینجا حرف تعریف نامعین می‌گیرد، چون یکی از رستورانت‌های بسیار است.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: شفاخانه
    gloss: شفاخانه
    note: '*Hôpital* مذکر است و با صدای مصوت شروع می‌شود: *l''hôpital*.'
    example_gloss: من در شفاخانه کار می‌کنم.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: کار در شفاخانه
    gloss: من در شفاخانه کار می‌کنم.
    note: '*À l''hôpital* حرف تعریف معین دارد، چون جای مشخص و شناخته‌شده است؛ *le* پیش از صدای مصوت به *l''* تبدیل می‌شود.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: کار در دفتر
    gloss: بعضی مردم در یک دفتر کار می‌کنند.
    note: '*Dans un bureau* (در یک دفتر) مثل *dans un restaurant* حرف تعریف می‌گیرد.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: وقت شروع
    gloss: من ساعت نُه شروع می‌کنم.
    note: '*Commence* شکل *je* فعل *commencer* (شروع کردن) است؛ *à neuf heures* وقت را نشان می‌دهد.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: روزهای کار
    gloss: من از دوشنبه تا جمعه کار می‌کنم.
    note: '*Du lundi au vendredi* یعنی از دوشنبه تا جمعه؛ *du* از *de* + *le* و *au* از *à* + *le* ساخته می‌شود.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: وقفه
    gloss: وقفه
    note: '*Pause* مؤنث است: *la pause*.'
    example_gloss: من ساعت دوازده وقفه دارم.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: وقفه داشتن
    gloss: من ساعت دوازده وقفه دارم.
    note: '*Avoir une pause* (وقفه داشتن) الگوی ثابت و طبیعی است.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: وقت ختم کار
    gloss: من ساعت پنج ختم می‌کنم.
    note: '*Finis* شکل *je* فعل *finir* (ختم کردن) است.'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: یک روز کامل کاری
    gloss: من ساعت نُه شروع می‌کنم و ساعت پنج ختم می‌کنم.
    note: '*je commence* و *je finis* با *et* در یک جمله جمع شده‌اند و یک روز کامل کاری را بیان می‌کنند.'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: آخر فعل‌ها با il و elle
    gloss: 'با «او» (مذکر یا مؤنث)، فعل‌های باقاعدهٔ -er همان شکل «من» را نگه می‌دارند: من کار می‌کنم، او کار می‌کند.'
    note: '*Travaille* برای *je*، *il* و *elle* یکسان است: فعل‌های باقاعدهٔ *-er* در شخص سوم چیزی اضافه نمی‌کنند.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: کار کامیل
    gloss: کامیل به حیث نرس کار می‌کند.
    note: '*Travaille* با *je*، *il* و *elle* می‌آید: آخر آن صدا نمی‌دهد، پس این سه شکل یکسان شنیده می‌شوند.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: کار ماتیو
    gloss: ماتیو به حیث آشپز کار می‌کند.
    note: آخر فعل مثل *Camille travaille comme infirmière* است.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: استفاده از ضمیرها
    gloss: او در شفاخانه کار می‌کند. او در یک رستورانت کار می‌کند.
    note: '*Elle* و *il* به جای نام‌های کامیل و ماتیو می‌آیند، ولی شکل فعل همان می‌ماند.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: دو معرفی کاری را بخوانین
    gloss: کامیل به حیث نرس در شفاخانه کار می‌کند. او ساعت هفت شروع می‌کند و از دوشنبه تا جمعه کار می‌کند. ماتیو به حیث آشپز در یک رستورانت کار می‌کند. او ساعت یازده شروع می‌کند و ساعت چهار وقفه دارد.
    note: کار، محل کار و ساعت‌های کاری هر شخص را جداگانه دنبال کنید.
    glosses:
      travaille: کار می‌کند
      infirmière: نرس
      l'hôpital: شفاخانه
      commence: شروع می‌شود
      sept: هفت
      lundi: دوشنبه
      vendredi: جمعه
      cuisinier: آشپز / سرآشپز
      restaurant: رستورانت
      onze: یازده
      pause: وقفه
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: کامیل دربارهٔ کار می‌پرسد
    gloss: 'کامیل: سلام ماتیو! کنجکاو شدم، راستی تو چه کار می‌کنی؟'
    note: '*Au fait* (راستی) سؤال را دوستانه و از روی کنجکاوی می‌سازد، نه مثل بازجویی.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: ماتیو جواب می‌دهد
    gloss: 'ماتیو: من به حیث آشپز در یک رستورانت کار می‌کنم. و تو؟'
    note: '*Et toi ?* راه معمول برای برگرداندن سؤال به طرف مقابل است.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: کامیل جواب می‌دهد
    gloss: 'کامیل: من به حیث نرس در شفاخانه کار می‌کنم.'
    note: با کار و محل کاری که پیش‌تر در درس‌های قبلی آمده، هماهنگ است.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: ماتیو دربارهٔ ساعت‌های کار می‌پرسد
    gloss: 'ماتیو: ساعت‌های کارت چطور است؟'
    note: '*Tu fais quels horaires ?* راه طبیعی برای پرسیدن از ساعت‌های کاری کسی است؛ *quels* با جمع *horaires* هماهنگ است.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: کامیل ساعت‌های کارش را می‌گوید
    gloss: 'کامیل: من ساعت هفت شروع می‌کنم و از دوشنبه تا جمعه کار می‌کنم.'
    note: با برنامه‌ای که پیش‌تر در متن خواندنی درس آمده، هماهنگ است.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: واکنش ماتیو
    gloss: 'ماتیو: چقدر زود! من دیرتر شروع می‌کنم، ساعت یازده.'
    note: با وقت شروع ماتیو که پیش‌تر در درس آمده، هماهنگ است.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: کامیل صحبت را تمام می‌کند
    gloss: 'کامیل: فکر می‌کنم هر کار ریتم خودش را دارد.'
    note: یک جملهٔ پایانی طبیعی و تأملی است؛ معنایش را بفهمید، لازم نیست دقیقاً همین‌طور بگویین.
