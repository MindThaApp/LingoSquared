  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*، *de la* یا *de l''* + ورزش می‌گوید کدام ورزش را انجام می‌تین: *faire du yoga*، *faire de la natation*، *faire de la course à pied*. برای فوتبال می‌گویید *jouer au football*.'
    note: یک ساختار برای همهٔ ورزش‌ها کافی است؛ در این سطح لازم نیست برای هر ورزش یک فعل جداگانه یاد بگیرین.
