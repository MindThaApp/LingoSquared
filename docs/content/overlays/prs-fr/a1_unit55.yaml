  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport و faire de la + ورزش
    gloss: 'شما *faire du sport* را از درس سرگرمی‌ها می‌دانین (*Je fais du sport le samedi*). *Faire de la* + ورزش، ورزش مشخص را نام می‌برد: *Je fais de la natation*. هر دو در فرانسوی درست‌اند.'
