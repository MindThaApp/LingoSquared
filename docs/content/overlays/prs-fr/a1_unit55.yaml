    gloss: شما *tous les jours* (هر روز) و *souvent* (اکثراً) را از قبل می‌دانین. *Deux fois par semaine* (هفته‌ای دو بار) راه تازه و دقیق‌تری برای گفتن تکرار یک کار است.
    note: واژه‌های تکرار را که در درس سرگرمی‌ها آموختید گسترش می‌دهد.
