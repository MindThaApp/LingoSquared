teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*Appelle* شکل *je* فعل *appeler* است؛ در فرانسوی برای «زنگ می‌زنم» در آینده هم زمان حال به کار می‌رود.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: جواب دادن به تلفون
    gloss: سلام، من کامیل استم.
    note: '*C''est* + نام شیوهٔ معمول فرانسوی برای معرفی خود در تلفن است؛ در دری می‌گوییم «من … استم».'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: ماتیو هم همین‌طور جواب می‌دهد
    gloss: سلام، من ماتیو استم.
    note: همان الگوی *c'est* + نام مثل *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Qui est à l''appareil ?* شیوهٔ معمول پرسیدن از یک زنگ‌زنندهٔ ناشناس است که کیست.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: معرفی رسمی خود
    gloss: شما با کامیل صحبت می‌کنین.
    note: '*Vous parlez avec* + نام شکل رسمیِ *c''est* + نام است.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*Tu peux ...* (می‌توانی ...؟) به‌همراه مصدر *répéter* (تکرار کردن).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*Ne parle pas si vite* فعل را منفی می‌کند: *ne ... pas* دور *parle* را می‌گیرد و *si* یعنی «این‌قدر».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: '*Entendre* (شنیدن) با *ne ... pas bien* مشکل شنیدن را می‌رساند و با *comprendre* (فهمیدن) فرق دارد.'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: '*SMS* مذکر است: *un SMS*؛ این کلمه از اختصار بین‌المللی گرفته شده است.'
    example_gloss: پیامک از کامیل است.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: فعل *envoyer* (فرستادن) ضمیر *te* (اینجا *t'*) را پیش از فعل می‌گیرد و بعد از آن *un SMS* می‌آید.
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: در *rappeler* (دوباره زنگ زدن) معنی «دوباره» در پیشوند *re-* است؛ *plus tard* یعنی «بعداً».
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'ماتیو: سلام کامیل، می‌تانی به من زنگ بزنی؟ باید یک چیزی برایت بگویم. کامیل: بلی، البته، پنج دقیقهٔ دیگر دوباره زنگ می‌زنم.'
    note: دقت کن که ماتیو چه می‌خواهد، چرا می‌خواهد و کامیل کی دوباره زنگ می‌زند.
    glosses:
      Salut: سلام
      peux: می‌توانی
      m'appeler: زنگ زدن
      dois: باید
      truc: یک چیز
      dire: گفتن
      évidemment: حتماً
      rappelle: دوباره
      cinq: پنج
      minutes: دقیقه
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: ماتیو تیلفون را جواب می‌دهد
    gloss: 'ماتیو: الو، ماتیو استم.'
    note: 'همان ساختار *c''est* + نام از درس اول، حالا در تیلفون واقعی: کسی که جواب می‌دهد اول حرف می‌زند و نامش را می‌گوید.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: کامیل خودش را معرفی می‌کند
    gloss: 'کامیل: سلام ماتیو، کامیل استم. ماتیو: خوش شدم که زنگ زدی!'
    note: '*C''est sympa que* ... (خوب است که ...) واکنش مثبت به یک رویداد را نشان می‌دهد؛ *appelles* شکل خاصی است که فعلاً همین‌قدر حفظش کن.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: کامیل دربارهٔ شفت کاری می‌پرسد
    gloss: 'کامیل: اولین شفت کاری‌ات چطور گذشت؟'
    note: '*Comment s''est passé ... ?* ماضی نقلی فعل *se passer* (اتفاق افتادن) را دارد که با *être* ساخته می‌شود و برای پرسیدن از چگونه گذشتن یک چیز استفاده می‌شود.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: ماتیو خبر خوب می‌دهد
    gloss: 'ماتیو: خیلی خوب گذشت، بهتر از آنچه فکر می‌کردم.'
    note: '*Ça s''est très bien passé* و *je pensais* اینجا عبارت‌های ثابت اند؛ *je pensais* ماضی استمراری *penser* (فکر کردن) است.'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: ماضی نقلی با avoir و être
    gloss: s'est passé ← اتفاق افتادن، j'ai pensé ← فکر کردن، je suis allé ← رفتن
    note: 'ماضی نقلی از *avoir* یا *être* + اسم مفعول ساخته می‌شود: *j''ai pensé*، *je suis allé*. *Ça s''est passé* عبارت ثابت به معنی «گذشت» است؛ فعلاً فقط در همین جاهای این درس آن را حفظ کن.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: کامیل افتخار می‌کند
    gloss: 'کامیل: شنیدنش چقدر خوش است! به تو افتخار می‌کنم.'
    note: '*Fière de* (مفتخر به) ترکیب ثابت است؛ *de* لازم است، نه *pour*؛ *fière* اینجا مؤنث است.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: ماتیو متأثر می‌شود
    gloss: 'ماتیو: خیلی تشکر، برایم خیلی مهم است.'
    note: '*Compter* اینجا یعنی «مهم بودن»: *ça compte pour moi* (برایم مهم است)؛ *pour moi* می‌گوید برای چه کسی مهم است.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Son* اینجا صفت ملکی «او» است، نه فعل: *son premier service* (اولین شفت کاری او)؛ *son* با *service* مذکر هماهنگ است.'
