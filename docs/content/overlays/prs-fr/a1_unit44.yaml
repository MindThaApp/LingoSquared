teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: '*Se sentir* بازتابی است (*je me sens*)؛ *ne ... pas bien* راه عمومی و ملایم برای گفتن این است که چیزی درست نیست.'
  fr.a1.unit44.lesson01.teach.malade:
    title: مریض
    gloss: مریض
    note: 'صفت پایه که با *être* می‌آید: *je suis malade*.'
    example_gloss: من مریض استم.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: مریض بودن
    gloss: من مریض استم.
    note: '*Malade* حالت عمومی‌تر و شدیدتر از *pas bien* را می‌رساند.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: سردرد
    gloss: سردرد
    note: '*Mal à la tête* با *avoir* می‌آید: *j''ai mal à la tête*؛ *à la* چون *tête* مؤنث است.'
    example_gloss: سردرد دارم.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: 'نشانه‌های مریضی با *avoir* (داشتن) می‌آیند: *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: دل‌درد
    gloss: دل‌درد
    note: '*Mal au ventre*: *au* ترکیب *à* + *le* است، چون *ventre* مذکر است.'
    example_gloss: دل‌درد دارم.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: همان الگوی *avoir* مثل *mal à la tête*، با *au* به جای *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: پرسیدن به شکل عمومی
    gloss: چی شده؟
    note: راه عمومی و همه‌منظوره برای پرسیدن اینکه آیا مشکلی هست.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: یک اصطلاح رایج
    gloss: چی شده؟
    note: '*Qu''est-ce qui ne va pas ?* یک پرسش ثابت است، یعنی تقریباً «چه چیز درست نیست»؛ آن را کلمه به کلمه ترجمه نکنین.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: گلودرد
    gloss: گلودرد
    note: '*Mal à la gorge* مثل *mal à la tête* است: *gorge* مؤنث است، پس *à la*.'
    example_gloss: گلودرد دارم.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *avoir* مثل نشانه‌های دیگر پیروی می‌کند.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: خبر گرفتن از کسی
    gloss: حالت خوب است؟ نه، حالم خوب نیست.
    note: '*Ça va ?* پرسش بسیار رایج و دوستانه بین دوستان است.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: تب
    gloss: تب
    note: '*La fièvre* مؤنث است؛ بعد از *avoir* با *de la* می‌آید: *j''ai de la fièvre*.'
    example_gloss: تب دارم.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *avoir* پیروی می‌کند، با *de la* برای مقدار نامشخص.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: زکام بودن
    gloss: زکام بودن
    note: '*Le rhume* اسم مذکر است که با *avoir* می‌آید، نه صفتی که با *être* بیاید.'
    example_gloss: من زکام استم.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: گفتن اینکه زکام استید
    gloss: من زکام استم.
    note: در فرانسوی می‌گویند *j'ai un rhume* («زکام دارم»)؛ *je suis rhume* نگویید.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être یا avoir؟
    gloss: '*Malade* صفت است و با *être* می‌آید: مریض استم. *Mal*، *fièvre* و *rhume* اسم استند و با *avoir* می‌آیند: زکام دارم.'
    note: 'انتخاب بین *être* و *avoir* به نوع کلمه بستگی دارد: صفتی مثل *malade* با *être* می‌آید، اسمی مثل *fièvre* با *avoir*، هر قدر مریضی کوتاه باشد.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: دواخانه
    gloss: دواخانه
    note: '*Pharmacie* مؤنث است: *la pharmacie*.'
    example_gloss: من به دواخانه می‌روم.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: سلام‌واحوال‌پرسی دواخانه‌دار
    gloss: چطور کمک‌تان کنم؟
    note: '*Je peux vous aider ?* احوال‌پرسی رسمی معمول در خدمات است؛ *vous* شکل مؤدبانه است.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: خواستن چیزی برای یک نشانه مریضی
    gloss: برای سردرد چیزی دارید؟
    note: '*Quelque chose contre* + نشانهٔ مریضی راه طبیعی برای خواستن دوا است.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: یک قرص
    gloss: یک قرص
    note: '*Comprimé* مذکر است: *un comprimé*.'
    example_gloss: من یک قرص می‌خورم.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: دستور استفاده از دوا
    gloss: روزانه دو بار یک قرص بخور.
    note: '*Prenez* امر *vous* فعل *prendre* (گرفتن) است و برای دستورها استفاده می‌شود.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: زبان رسمی در دواخانه
    gloss: در دواخانه شکل مؤدبانهٔ *vous* را به کار می‌برید.
    note: دواخانه‌دار یک بزرگسال ناآشنا در نقش خدمات است، پس *vous* می‌گویید، مثل پیش کانتر تکت.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: خواندن یک نصیحت دواخانه
    gloss: 'نصیحت: روزی دو بار یک قرص با آب بخور. خوب استراحت کن و آب زیاد بنوش. بعد از سه روز هم‌چنان احساس خوبی نداری؟ پس نزد دکتر برو.'
    note: به مقدار دوا، دو توصیهٔ دیگر غیر از دوا و وقت رفتن نزد دکتر توجه کن.
    glosses:
      Conseil: نصیحت
      prends: گرفتن
      fois: بار
      jour: روز
      comprimé: قرص
      Repose-toi: استراحت کن
      bois: بنوش
      sens: احساس کردن
      toujours: هنوز
      bien: خوب
      médecin: دکتر
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille احوال می‌گیرد
    gloss: 'Camille: سلام Mathieu، چطوری؟ حالا بهتر شدی؟'
    note: '*Déjà* (حالا/قبلاً) نشان می‌دهد که Camille می‌پرسد آیا Mathieu از آخرین صحبت‌شان بهتر شده است.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu هنوز مریض است
    gloss: 'Mathieu: هنوز زیاد خوب نیستم. هنوز سرم درد می‌کند و خسته استم.'
    note: '*Toujours* (هنوز) نشان می‌دهد که سردرد از بین نرفته؛ *fatigué* (خسته) صفت تازه و مفید است.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille دربارهٔ دوا می‌پرسد
    gloss: 'Camille: قرص خوردی؟'
    note: '*Pris* اسم مفعول *prendre* است و با *as* از *avoir* می‌آید: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu تأیید می‌کند
    gloss: 'Mathieu: بلی، قرص خوردم. حالا می‌روم استراحت کنم.'
    note: '*Je vais me reposer* (می‌روم استراحت کنم) از *aller* + مصدر برای آیندهٔ نزدیک استفاده می‌کند.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille برایش آرزوی صحتمندی می‌کند
    gloss: 'Camille: فکر خوب است. خوب استراحت کن. زود صحتیاب شوی!'
    note: '*Bon rétablissement !* عبارت ثابت و معمول برای آرزوی صحتیابی زود است.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu خداحافظی می‌کند
    gloss: 'Mathieu: تشکر، تا فردا!'
    note: '*À demain !* برای خداحافظی از *à* + زمان استفاده می‌کند: *à demain*، *à bientôt*.'
