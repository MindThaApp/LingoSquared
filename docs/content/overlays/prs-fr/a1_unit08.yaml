teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: دوشنبه
    gloss: دوشنبه
    note: نام روزهای هفته در فرانسوی مذکر است و با حرف کوچک نوشته می‌شود.
    example_gloss: کارگاه هیچ‌وقت روز دوشنبه جمع نمی‌شود.
  fr.a1.unit08.lesson01.teach.samedi:
    title: شنبه
    gloss: شنبه
    note: '*Le samedi* (با حرف تعریف) یعنی «هر شنبه»، به صورت عادت؛ *samedi* به تنهایی یعنی یک شنبهٔ مشخص، یعنی نزدیک‌ترین شنبه، چه آینده و چه گذشته، به اساس زمان فعل.'
    example_gloss: کارگاه هر شنبه برگزار می‌شود.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: یکشنبه
    gloss: یکشنبه
    note: مانند روزهای دیگر، مذکر است و با حرف کوچک نوشته می‌شود.
    example_gloss: نانوایی روزهای یکشنبه بسته است.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: امروز
    gloss: امروز
    note: '*Aujourd''hui* یک کلمهٔ واحد و ثابت است، با آن‌که در گذشته از چند بخش ساخته شده بود.'
    example_gloss: امروز شنبه است.
  fr.a1.unit08.lesson01.teach.demain:
    title: فردا
    gloss: فردا
    note: '*Demain* تغییر نمی‌کند و در هر جمله به همین شکل استفاده می‌شود.'
    example_gloss: دواخانه فردا باز می‌شود.
  fr.a1.unit08.lesson01.teach.hier:
    title: دیروز
    gloss: دیروز
    note: '*Hier* درست متضاد *demain* است.'
    example_gloss: دیروز ماهی خوردم.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: پرسیدن روز
    gloss: امروز کدام روز است؟
    note: '*Quel jour sommes-nous ?* (تحت‌اللفظی «کدام روز استیم») شکل معمول پرسیدن روز هفته است.'
  fr.a1.unit08.lesson02.teach.mars:
    title: مارچ
    gloss: مارچ
    note: نام ماه‌ها هم مثل نام روزها در فرانسوی مذکر است و با حرف کوچک نوشته می‌شود.
    example_gloss: کارگاه در ماه مارچ ختم می‌شود.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: پرسیدن تاریخ
    gloss: امروز چندم است؟
    note: '*Quelle est la date... ?* شکل معمول پرسیدن تاریخ کامل است؛ برخلاف *Quel jour sommes-nous ?* که فقط روز هفته را می‌پرسد.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: گفتن تاریخ
    gloss: پانزدهم مارچ است.
    note: '*Le* + عدد اصلی + نام ماه الگوی معمول تاریخ در فرانسوی است؛ *quinze* (پانزده) عدد اصلی است، نه عدد ترتیبی «پانزدهم» که در دری می‌گوییم.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: گفتن تاریخ امروز
    gloss: امروز پانزدهم مارچ است.
    note: '*Nous sommes le...* برای گفتن تاریخ امروز به همان اندازه رایج است که *C''est le...*.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: اول (ماه)
    gloss: اول
    note: '*Le premier* تنها استثنای قاعدهٔ عدد اصلی است؛ برای هر روز دیگر ماه یک عدد اصلی ساده می‌آید (*le deux*، *le trois*...)، ولی برای روز اول عدد ترتیبی *premier* می‌آید.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: گفتن تاریخ ختم
    gloss: کارگاه در بیست‌ودوم مارچ ختم می‌شود.
    note: '*Se termine* (ختم می‌شود) فعل انعکاسی است؛ *vingt-deux* یک عدد اصلی ساده است و از همان قاعدهٔ *le quinze mars* پیروی می‌کند.'
  fr.a1.unit08.lesson03.teach.line01:
    title: پرسیدن زمان آخرین جلسه
    gloss: اینس می‌پرسد که آخرین جلسهٔ کارگاه کی است.
    note: '*C''est quand... ?* (کی است) راه ساده و طبیعی برای پرسیدن زمان است.'
  fr.a1.unit08.lesson03.teach.line02:
    title: گفتن تاریخ و روز
    gloss: ماتیو می‌گوید فکر می‌کند بیست‌ودوم مارچ است، یک روز شنبه.
    note: '*Un samedi* (بدون *le*) فقط می‌گوید آن تاریخ در کدام روز هفته می‌افتد.'
  fr.a1.unit08.lesson03.teach.line03:
    title: پرسیدن تاریخ امروز
    gloss: اینس می‌پرسد تاریخ امروز چند است.
    note: همان *Quelle est la date aujourd'hui ?* که برای پرسیدن تاریخ یاد گرفتید.
  fr.a1.unit08.lesson03.teach.line04:
    title: گفتن تاریخ امروز و فاصلهٔ زمانی
    gloss: ماتیو می‌گوید امروز پانزدهم مارچ است، پس یک هفتهٔ دیگر مانده.
    note: '*Dans une semaine* (بعد از یک هفته) فاصلهٔ زمانی از امروز را می‌رساند.'
  fr.a1.unit08.lesson03.teach.line05:
    title: واکنش با یک برنامه
    gloss: اینس می‌گوید عالی است، وقت دارد که برای این مناسبت یک شیرینی تهیه کند.
    note: '*J''ai le temps de* + مصدر (وقت دارم که) راه معمول گفتن این است که برای کاری وقت کافی هست.'
  fr.a1.unit08.lesson03.teach.line06:
    title: تأیید برنامه
    gloss: ماتیو می‌گوید فکر خوب است، پس شنبهٔ آینده، بیست‌ودوم، همدیگر را می‌بینیم.
    note: '*Samedi prochain* (شنبهٔ آینده) هم نام روز و هم تاریخ را تأیید می‌کند و گفتگو را ختم می‌کند.'
