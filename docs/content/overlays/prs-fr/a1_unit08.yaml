course:
  title: فرانسوی A1
  description: روزهای هفته و گفتن تاریخ تقویمی (le + عدد اصلی + نام ماه، و le premier تنها استثنای عدد ترتیبی)؛ ادامهٔ داستان کارگاه آشپزی اینس و ماتیو که حالا برنامه‌ریزی آخرین جلسهٔ آن است. در دری تاریخ را معمولاً با عدد ترتیبی می‌گوییم (پانزدهم مارچ)، اما در فرانسوی همهٔ تاریخ‌ها با عدد اصلی گفته می‌شود (le quinze mars)، به جز اول ماه.
