course:
  title: فرانسوی A1
  description: مقایسه‌های ساده (plus/moins/aussi... que) و صفت عالی (le/la plus...)، ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو که هنگام خرید دو نوع پنیر را مقایسه می‌کنند. در این درس تأکید می‌شود که *meilleur* (بهتر) و *le meilleur* (بهترین) بی‌قاعده اند، برخلاف الگوی منظم *plus... que* که برای بیشتر صفت‌های دیگر به کار می‌رود.
