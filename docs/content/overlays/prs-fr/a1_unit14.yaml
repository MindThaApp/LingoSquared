teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: بیشتر از...
    gloss: بیشتر از...
    note: در فرانسوی، صفت‌های مقایسه‌یی با ساختار *Plus + adjective + que* ساخته می‌شوند؛ یعنی «plus» پیش از صفت می‌آید و «que» بعد از آن، و صفت هیچ پسوند جداگانه نمی‌گیرد، درست مثل «-تر» در دری که به آخر صفت وصل می‌شود، اما اینجا کلمهٔ جداگانه است.
    example_gloss: این پنیر از آن یکی گران‌تر است.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: کمتر از...
    gloss: کمتر از...
    note: '*Moins* ضد *plus* است و در همین الگوی مقایسه می‌آید.'
    example_gloss: این طرز تهیه از آن یکی کم‌مشکل‌تر است.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: به اندازهٔ...
    gloss: به اندازهٔ...
    note: '*Aussi + adjective + que* برابری میان دو چیز را بیان می‌کند.'
    example_gloss: تارت به اندازهٔ کیش خوب است.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: بهتر از...
    gloss: بهتر از...
    note: '*Meilleur* شکل بی‌قاعدهٔ تفضیلی *bon* (خوب) است؛ فرانسوی *plus bon* نمی‌گوید.'
    example_gloss: این کیک از اولی بهتر است.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: گران، ارزان
    gloss: گران، ارزان
    note: '*Bon marché* تغییر نمی‌کند، با این‌که ظاهراً باید مثل صفت‌های دیگر جور شود.'
    example_gloss:
    - پنیر گران است.
    - سبزی‌ها ارزان اند.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: آسان، مشکل
    gloss: آسان، مشکل
    note: یک جفت صفت رایج برای توصیف طرز تهیه؛ هر دو در مذکر و مؤنث یک شکل دارند و در جمع -s می‌گیرند (*faciles*، *difficiles*).
    example_gloss:
    - این طرز تهیه آسان است.
    - کیش کمی مشکل است.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: گران‌ترین
    gloss: گران‌ترین
    note: '*Le/la plus + صفت* صفت عالی را می‌سازد؛ برخلاف حالت تفضیلی، حرف تعریف لازم است.'
    example_gloss: این گران‌ترین پنیر بازار است.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: ارزان‌ترین
    gloss: ارزان‌ترین
    note: '*La moins chère* با *recette* که مؤنث است جور می‌آید؛ شکل مذکرش *le moins cher* است.'
    example_gloss: این ارزان‌ترین طرز تهیه است.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: بهترین
    gloss: بهترین
    note: '*Le meilleur* شکل بی‌قاعدهٔ عالی *bon* است و با *meilleur* تفضیلی درس قبلی ارتباط دارد.'
    example_gloss: این بهترین کیک کارگاه است!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: آسان‌ترین
    gloss: آسان‌ترین
    note: یک صفت عالی منظم که مستقیم از الگوی *le/la plus + صفت* پیروی می‌کند.
    example_gloss: این آسان‌ترین طرز تهیه است.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: الگوی صفت عالی
    gloss: le/la plus + صفت؛ meilleur بی‌قاعده است
    note: بیشتر صفت‌های عالی فرانسوی منظم اند (*le/la plus + صفت*)، اما *bon* ← *meilleur* ← *le meilleur* یک استثنا است که باید حفظ شود.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: پیشنهاد مقایسهٔ قیمت‌ها
    gloss: بیایین پیش از خریدن قیمت‌ها را مقایسه کنیم.
    note: '*Comparons* امر برای «ما» (*nous*) از فعل *comparer* است، یعنی «بیایین مقایسه کنیم»؛ جملهٔ طبیعی هنگام خرید.'
  fr.a1.unit14.lesson03.teach.line01:
    title: دیدن دو گزینه
    gloss: اینس می‌گوید ببین، دو نوع پنیر است؛ کدام را بگیریم؟
    note: '*Lequel* (کدام یکی) از طرف مقابل می‌خواهد که بین دو گزینهٔ گفته‌شده انتخاب کند.'
  fr.a1.unit14.lesson03.teach.line02:
    title: مقایسه و ذکر کیفیت
    gloss: ماتیو می‌گوید این یکی از آن یکی گران‌تر است، ولی بهتر معلوم می‌شود.
    note: '*Avoir l''air* + صفت (به نظر رسیدن) ادعا دربارهٔ کیفیتی را که هنوز چشیده نشده، نرم‌تر می‌کند.'
  fr.a1.unit14.lesson03.teach.line03:
    title: مخالفت با یک مقایسه
    gloss: اینس می‌پرسد مطمئنی؟ و می‌گوید به نظرش آن یکی هم به همان اندازه خوب است و ارزان‌تر.
    note: '*Aussi* و *moins* درس اول در یک جواب برای مخالفت مؤدبانه آمده‌اند؛ *que* حذف شده چون از موقعیت معلوم است که با کدام پنیر مقایسه می‌شود.'
  fr.a1.unit14.lesson03.teach.line04:
    title: قبول کردن قیمت
    gloss: ماتیو موافقت می‌کند که درست است، از آن دو ارزان‌تر است.
    note: '*Des deux* (از آن دو) صفت عالی را فقط به همین دو محدود می‌کند، نه به تمام بازار.'
  fr.a1.unit14.lesson03.teach.line05:
    title: تصمیم نهایی
    gloss: اینس می‌گوید پس همان را بگیریم، بهترین گزینه برای کارگاه است.
    note: '*Celui-là* (آن یکی) به پنیر ارزان‌تری که همین حالا دربارهٔ آن حرف زدند اشاره می‌کند.'
  fr.a1.unit14.lesson03.teach.line06:
    title: ذکر فایده
    gloss: ماتیو موافقت می‌کند و می‌گوید برای دسر پول بیشتری برایشان می‌ماند!
    note: '*Il nous reste* (برای ما می‌ماند) راه رایج گفتن «... برای ما باقی مانده» است.'
