course:
  title: فرانسوی A1
  description: 'بیان علاقه، بیزاری و ترجیح‌های ساده و پرسیدن دربارهٔ آن‌ها؛ ادامهٔ داستان کارگاه آشپزی اینس و ماتیو که برای شنبه میان دو طرز تهیه یکی را انتخاب می‌کنند. نکتهٔ مهم: در *préférer X à Y* (X را بر Y ترجیح دادن) از *à* استفاده می‌شود، نه *que*.'
units:
  fr.a1.unit13.preferences:
    title: کدام را ترجیح می‌دهی؟
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: دوست داشتن، ترجیح دادن، بیزار بودن
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: پرسیدن دربارهٔ ترجیح
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: انتخاب طرز تهیهٔ شنبه
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: ترجیح دادن
    gloss: ترجیح دادن
    note: '*Préférer* فعل -ER است که ساقه‌اش تغییر می‌کند: *je préfère*، ولی *nous préférons* (در شکل‌های *nous/vous* علامت accent تغییر نمی‌کند).'
    example_gloss: من تارت چاکلیتی را ترجیح می‌دهم.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: بیشتر دوست داشتن
    gloss: بیشتر دوست داشتن
    note: '*Aimer mieux* جایگزین رایج *préférer* است، ولی مقایسه با *que* می‌آید (*aimer mieux X que Y*)، در حالی که *préférer* با *à* می‌آید (*préférer X à Y*).'
    example_gloss: من غذاهای نمکین را از غذاهای شیرین بیشتر دوست دارم.
  fr.a1.unit13.lesson01.teach.detester:
    title: بیزار بودن
    gloss: بیزار بودن
    note: '*Détester* بیزاری شدید است، قوی‌تر از *ne pas aimer* (دوست نداشتن).'
    example_gloss: ماتیو از مصالحهٔ بسیار تیز بیزار است؛ او غذاهای ملایم را ترجیح می‌دهد.
  fr.a1.unit13.lesson01.teach.plutot:
    title: بیشتر، ترجیحاً
    gloss: بیشتر، ترجیحاً
    note: '*Plutôt* ترجیح را نرم می‌کند: «بیشتر این یکی»، بدون این‌که گزینهٔ دیگر کاملاً رد شود.'
    example_gloss: من بیشتر پنیر می‌گیرم.
  fr.a1.unit13.lesson01.teach.sucre:
    title: شیرین
    gloss: شیرین
    note: '*Sucré* برای مزهٔ غذا است و با *doux* (نرم، ملایم) فرق دارد؛ این دو را با هم اشتباه نکن.'
    example_gloss: این دسر خیلی شیرین است.
  fr.a1.unit13.lesson01.teach.sale:
    title: نمکین / شور
    gloss: نمکین / شور
    note: '*Salé* در واژگان غذایی فرانسوی ضد معمول *sucré* است و هم «نمکین» و هم «شور» را می‌رساند.'
    example_gloss: پنیر شور است.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: طرز تهیه
    gloss: طرز تهیه
    note: '*La recette* همیشه مؤنث است.'
    example_gloss: این طرز تهیه آسان است.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: پرسیدن ترجیح
    gloss: تو کدام را بیشتر دوست داری؟
    note: '*Qu''est-ce que...* راه معمول ساختن پرسش باز «چی» در فرانسوی گفتاری است.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: گفتن ترجیح میان دو چیز
    gloss: من تارت را بر کیش ترجیح می‌دهم.
    note: در *préférer X à Y* گزینهٔ کمتر مطلوب با *à* می‌آید، نه با *que*.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: پرسیدن دربارهٔ میل عمومی
    gloss: تو بیشتر شیرینی دوست داری یا نمکین؟
    note: '*Plutôt* (درس اول) با پرسش انتخابی *ou* (یا) ترکیب شده است.'
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: موافقت یا مخالفت
    gloss: من هم. / من نه.
    note: '*Moi aussi* با جملهٔ مثبت موافقت می‌کند؛ *moi non* مخالفت می‌کند یا ترجیح مخالف را می‌گوید.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: گفتن اینکه برایت فرقی نمی‌کند
    gloss: برایم فرقی نمی‌کند.
    note: '*Ça ne me dérange pas* راه مفید و بی‌طرف برای پذیرفتن هر دو گزینه است، وقتی از تو می‌خواهند انتخاب کنی.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: پیشنهاد کردن یک گزینه
    gloss: می‌توانیم کیش درست کنیم، نه؟
    note: '*On pourrait* (می‌توانیم) + مصدر، یک گزینه را نرم پیشنهاد می‌کند و با *non ?* از دیگری موافقت می‌خواهد.'
  fr.a1.unit13.lesson03.teach.line01:
    title: پرسیدن اینکه چی درست کنیم
    gloss: 'ماتیو می‌پرسد شنبه چی درست می‌کنند: تارت یا کیش؟'
    note: '*Qu''est-ce qu''on prépare... ?* (چی درست می‌کنیم) در گفتار روزمره برای «ما» از *on* استفاده می‌کند.'
  fr.a1.unit13.lesson03.teach.line02:
    title: گفتن ترجیح و پرسیدن از طرف مقابل
    gloss: اینس می‌گوید تارت را ترجیح می‌دهد، آن هم کمی شیرین، و از ماتیو می‌پرسد.
    note: '*Et toi ?* (و تو؟) ساده‌ترین راه برای تبدیل یک جمله به پرسش از طرف مقابل است.'
  fr.a1.unit13.lesson03.teach.line03:
    title: گفتن ترجیح مخالف
    gloss: ماتیو می‌گوید نمکین را بیشتر دوست دارد و کیش را بر تارت ترجیح می‌دهد.
    note: الگوی *préférer X à Y* درس دوم دوباره به کار رفته است.
  fr.a1.unit13.lesson03.teach.line04:
    title: پیشنهاد راه‌حل میانه
    gloss: اینس پیشنهاد می‌کند هر دو را درست کنند، نه؟
    note: '*Les deux* (هر دو) با پیشنهاد درست کردن هر دو طرز تهیه، اختلاف را حل می‌کند.'
  fr.a1.unit13.lesson03.teach.line05:
    title: پذیرفتن راه‌حل میانه
    gloss: ماتیو می‌گوید فکر خوبی است و اصلاً برایش فرقی نمی‌کند.
    note: '*Ça ne me dérange pas du tout* جملهٔ درس دوم را با *du tout* (اصلاً) قوی‌تر می‌کند.'
  fr.a1.unit13.lesson03.teach.line06:
    title: تأیید تصمیم
    gloss: اینس می‌گوید عالی، یک تارت شیرین و یک کیش نمکین برای شنبه.
    note: تصمیم نهایی را واضح دوباره می‌گوید و گفت‌وگو را تمام می‌کند.
