teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: هوا
    gloss: هوا
    note: '*Le temps* هم به معنی «هوا» است و هم «وقت»؛ در فرانسوی مذکر است.'
    example_gloss: هوا چطور است؟
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: پرسیدن از هوا
    gloss: هوا چطور است؟
    note: '*Quel temps fait-il ?* پرسش معمول دربارهٔ هوا است؛ *quel* با اسم مذکر *temps* هماهنگ می‌شود.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: آفتابی
    gloss: هوا آفتابی است.
    note: '*Le temps est* + صفت یک ساختار معمول است؛ صفت با اسم مذکر *temps* هماهنگ می‌شود.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: باران
    gloss: باران می‌بارد.
    note: 'فعل *pleuvoir* (باریدن) بی‌شخص به کار می‌رود: *il pleut*، بدون صفت جداگانه.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: ابری
    gloss: هوا ابری است.
    note: همان ساختار *le temps est* + صفت مثل *ensoleillé* را دارد.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: سرد
    gloss: امروز هوا سرد است.
    note: '*Aujourd''hui* (امروز) هوا را در زمان قرار می‌دهد؛ *il fait froid* با فعل *faire* ساخته می‌شود، نه *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: گرم
    gloss: امروز هوا گرم است.
    note: '*Il fait chaud* در صحبت روزمره دربارهٔ هوا هم «گرم» را می‌رساند و هم «بسیار گرم» را.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: مقایسهٔ دما
    gloss: هوا سرد نیست، گرم است.
    note: '*Ne ... pas* دور فعل می‌آید: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا
    note: '*La météo* مؤنث است و کوتاه‌شدهٔ *la météorologie* می‌باشد.'
    example_gloss: پیش‌بینی هوا چیست؟
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: هوای فردا
    gloss: فردا هوا آفتابی است.
    note: '*Demain* اول جمله می‌آید و بعد از آن ویرگول می‌آید؛ بقیهٔ جمله ترتیب عادی خود را دارد.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: پیش‌بینی دو روز
    gloss: شنبه هوا آفتابی و گرم است، ولی یکشنبه تمام روز باران می‌بارد.
    note: '*Toute la journée* (تمام روز) طولانی بودن باران را نشان می‌دهد.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: قدم‌زدن
    gloss: قدم‌زدن
    note: '*Promenade* در فرانسوی مؤنث است: *la promenade*.'
    example_gloss: برویم قدم بزنیم؟
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: پیشنهاد قدم زدن
    gloss: برویم قدم بزنیم؟
    note: '*On fait une promenade ?* راه دوستانه‌ای برای پیشنهاد یک برنامه است؛ *faire une promenade* عبارت ثابت برای «قدم زدن» است.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: برنامهٔ شرطی
    gloss: اگر باران ببارد، داخل می‌مانیم.
    note: '*S''il pleut* (اگر باران ببارد): *si* + *il* به *s''il* تبدیل می‌شود؛ بعد با *on reste à l''intérieur* می‌گوییم چه می‌کنیم.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: موافقت و پیشنهاد
    gloss: فکر خوب است! برویم قدم بزنیم.
    note: '*Faisons ...* (بیایین ... ) راه معمول دیگری برای پیشنهاد یک کار است، در کنار *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: خواندن پیش‌بینی دو روز
    gloss: 'پیش‌بینی هوا: شنبه هوا آفتابی و گرم است. یکشنبه تمام روز باران می‌بارد.'
    note: دقت کنید که هر روز چه وضعیتی دارد.
    glosses:
      Météo: پیش‌بینی هوا
      samedi: شنبه
      ensoleillé: آفتابی
      chaud: گرم
      Dimanche: یکشنبه
      pleut: باران می‌بارد
      toute: تمام
      journée: روز
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: کامیل دربارهٔ آخر هفته می‌پرسد
    gloss: 'کامیل: این آخر هفته هوا چطور است؟'
    note: '*Ce week-end* (این آخر هفته) پرسش را در آیندهٔ نزدیک قرار می‌دهد.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: ماتیو پیش‌بینی را می‌گوید
    gloss: 'ماتیو: شنبه هوا آفتابی و گرم است، ولی یکشنبه تمام روز باران می‌بارد.'
    note: دقیقاً با پیش‌بینی‌ای که در درس پنجم خواندید یکی است.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: کامیل برنامه پیشنهاد می‌کند
    gloss: 'کامیل: پس شنبه برویم قدم بزنیم؟'
    note: '*Alors* (پس) پیشنهاد را به هوای خوبی که ماتیو گفت وصل می‌کند.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: ماتیو موافقت می‌کند و برای یکشنبه برنامه می‌دهد
    gloss: 'ماتیو: فکر خوب است. و یکشنبه آرام داخل می‌مانیم.'
    note: '*Tranquillement* اینجا یعنی «آرام و بدون عجله» و ماندن در خانه را دلپذیر نشان می‌دهد.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: کامیل برنامه را نهایی می‌کند
    gloss: 'کامیل: عالی، پس فلم تماشا می‌کنیم.'
    note: فعل *regarder* (تماشا کردن) به طور طبیعی با *un film* (یک فلم) می‌آید.
