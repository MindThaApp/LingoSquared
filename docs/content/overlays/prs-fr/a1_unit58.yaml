  fr.a1.unit58.lesson05.teach.thomas_ne_fait:
    title: کی چه می‌خواند؟
    gloss: توماس فقط کار نمی‌کند، درس هم می‌خواند. او در مرکز آموزش بزرگسالان کورس هسپانوی می‌گیرد. هر هفته کلمه‌های تازه یاد می‌گیرد. لیا در کالج یک دورهٔ آموزشی می‌بیند. او آنجا صحت و درمان می‌خواند. هر دوی شان درس خواندن را دوست دارند. شما چه می‌خوانید، یا دوست دارید چه یاد بگیرین؟
    note: درس‌های توماس و لیا را با هم مقایسه می‌کند، مثل متن مقایسه‌ای بخش تکنالوژی.
