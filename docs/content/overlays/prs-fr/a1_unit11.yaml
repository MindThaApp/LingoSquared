teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: فارغ / آزاد
    gloss: فارغ / آزاد
    note: '*Libre* در اینجا فارغ بودن یک شخص را می‌رساند؛ برای چیزی که پول ندارد، فرانسوی *gratuit* می‌گوید.'
    example_gloss: روز شنبه فارغ استی؟
  fr.a1.unit11.lesson01.teach.occupe:
    title: مصروف
    gloss: مصروف
    note: 'ضد مستقیم *libre*. از نظر جنسیت تغییر می‌کند: *occupé* / *occupée*.'
    example_gloss: من جمعه شب مصروف استم.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: همدیگر را دیدن
    gloss: همدیگر را دیدن
    note: در این معنا *se retrouver* متقابل است، یعنی دو یا چند نفر همدیگر را می‌بینند؛ با *trouver* (پیدا کردن) فرق دارد.
    example_gloss: امشب کجا همدیگر را می‌بینیم؟
  fr.a1.unit11.lesson01.teach.vers:
    title: تقریباً (در مورد وقت)
    gloss: تقریباً / نزدیک (وقت)
    note: '*Vers* + وقت، زمان تقریبی را می‌رساند و نرم‌تر از گفتن ساعت دقیق است.'
    example_gloss: تقریباً ساعت هفت می‌آیم.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: چطور است اگر...؟
    gloss: چطور است خریداری را باهم کنیم؟
    note: '*Ça te dit de... ?* + مصدر، روش عادی و دوستانه برای پیشنهاد کاری است؛ راحت‌تر از *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: برای بردن کسی آمدن
    gloss: تقریباً ساعت شش عصر می‌آیی مرا ببری؟
    note: '*Venir chercher quelqu''un* یعنی آمدن و گرفتن کسی با خود، نه فقط «جستجو کردن».'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: باشه، بعداً می‌بینیم
    gloss: باشه، بعداً می‌بینیم!
    note: '*D''accord* (باشه) یک برنامه را تأیید می‌کند؛ *à tout à l''heure* برای دیدن دوباره کسی در همان روز به کار می‌رود.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: رد کردن یک برنامه
    gloss: نمی‌توانم، مصروف استم.
    note: '*Je ne peux pas* (نمی‌توانم) + دلیل، روش ساده و مؤدبانه برای رد کردن است.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: با خوشی قبول کردن
    gloss: با کمال میل!
    note: '*Avec plaisir* (در لفظ «با خوشی») روش گرم و با شوق برای قبول کردن دعوت است.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: پرسیدن وقت
    gloss: ساعت چند همدیگر را می‌بینیم؟
    note: '*On se voit* (در گفتار عادی «همدیگر را می‌بینیم») بدیل عادی و دوستانهٔ *se retrouver* برای قرار گذاشتن است.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: پیشنهاد جا
    gloss: روبه‌روی بازار، برایت خوب است؟
    note: '*Ça te va ?* (برایت خوب است؟) می‌پرسد که جزئیات پیشنهادشده برای طرف دیگر قابل قبول است یا نه.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: تأیید برنامه
    gloss: عالی، پس جمعه می‌بینیم!
    note: '*Alors* در اینجا یعنی «پس»، برای تأیید نتیجه و بستن گفتگوی برنامه‌ریزی.'
  fr.a1.unit11.lesson03.teach.line01:
    title: پیشنهاد خریداری باهم
    gloss: اینس از ماتیو می‌پرسد که می‌خواهد پیش از کارگاه خریداری را باهم کنند یا نه.
    note: '*Ça te dit de... ?* گفتگو را با یک پیشنهاد دوستانه شروع می‌کند.'
  fr.a1.unit11.lesson03.teach.line02:
    title: قبول کردن و پرسیدن جا
    gloss: ماتیو با کمال میل می‌گوید و می‌پرسد کجا همدیگر را ببینند.
    note: '*Avec plaisir* (با کمال میل) با *se retrouver* (همدیگر را دیدن) یکجا شده است.'
  fr.a1.unit11.lesson03.teach.line03:
    title: پیشنهاد جا و روز
    gloss: اینس روبه‌روی بازار، جمعه شب را پیشنهاد می‌کند.
    note: یک پیشنهاد کوتاه که جا (*devant le marché*) و روز (*vendredi soir*) را باهم دارد.
  fr.a1.unit11.lesson03.teach.line04:
    title: قبول کردن و پرسیدن وقت
    gloss: ماتیو قبول می‌کند و می‌پرسد ساعت چند.
    note: '*D''accord* جا و روز را تأیید می‌کند؛ سوال بعدی وقت دقیق را روشن می‌کند.'
  fr.a1.unit11.lesson03.teach.line05:
    title: پیشنهاد یک وقت مشخص
    gloss: اینس می‌پرسد که ماتیو تقریباً ساعت شش عصر می‌آید او را ببرد یا نه.
    note: '*venir chercher* + *vers* با یک ساعت مشخص به کار رفته است.'
  fr.a1.unit11.lesson03.teach.line06:
    title: تأیید همه چیز
    gloss: ماتیو می‌گوید عالی، پس جمعه، ساعت شش عصر، روبه‌روی بازار.
    note: هر سه جزئیات برنامه (روز، وقت، جا) دوباره باهم گفته می‌شود تا گفتگو روشن بسته شود.
