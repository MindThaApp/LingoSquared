  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: فرانسوی A1
  description: پیشنهاد دادن، قبول کردن، رد کردن و تنظیم یک برنامهٔ ساده؛ ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو که قرار می‌گذارند پیش از نشست روز شنبه باهم مواد غذایی بخرند. *se retrouver* (همدیگر را دیدن، بازتابی و متقابل) فعلی است که دو یا چند نفر را برای دیدار باهم نشان می‌دهد، و *vers* + وقت، وقت تقریبی را می‌رساند، نه دقیق.
units:
  fr.a1.unit11.plans:
    title: کی همدیگر را می‌بینیم؟
