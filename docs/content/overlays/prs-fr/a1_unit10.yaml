course:
  title: فرانسوی A1
  description: توصیف یک روال روزمرهٔ ساده با فعل‌های انعکاسی (se réveiller، se lever، se coucher) و کلمه‌های ترتیب (d'abord، ensuite)، در ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو، وقتی اینس از روز شنبهٔ ماتیو می‌پرسد. در زبان فرانسوی فعل‌های انعکاسی ضمیر انعکاسی لازم دارند (je ME réveille)، و در دری برای این ضمیر معادل یک‌کلمه‌یی وجود ندارد.
