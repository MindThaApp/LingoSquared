teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: بیدار شدن
    gloss: بیدار شدن
    note: 'فعل انعکاسی: *je me réveille*، *tu te réveilles*. ضمیر *me/te/se* همیشه با فاعل مطابقت می‌کند.'
    example_gloss: من ساعت هفت بیدار می‌شوم.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: بلند شدن
    gloss: از خواب بلند شدن
    note: با *se réveiller* (بیدار شدن از خواب) فرق دارد؛ *se lever* یعنی از بستر بلند شدن.
    example_gloss: من بعد از آن فوراً بلند می‌شوم.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: دوش گرفتن
    gloss: دوش گرفتن
    note: '*Prendre une douche* (به معنی لفظی «دوش گرفتن») از فعل *prendre* استفاده می‌کند، همان فعلی که برای غذا و وسایل نقلیه هم می‌آید.'
    example_gloss: من صبح دوش می‌گیرم.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: لباس پوشیدن
    gloss: لباس پوشیدن
    note: 'یک فعل انعکاسی دیگر: *je m''habille*؛ پیش از حرف صدادار، me به *m''* تبدیل می‌شود.'
    example_gloss: من پیش از چاشت لباس می‌پوشم.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: چای صبح
    gloss: چای صبح
    note: '*Prendre le petit-déjeuner* (چاشت خوردن) همان الگوی *prendre* در *prendre une douche* را دارد.'
    example_gloss: من ساعت هشت چاشت می‌خورم.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: از خانه بیرون شدن
    gloss: از خانه بیرون شدن
    note: '*Quitter* اینجا یعنی «ترک کردن یک جا»؛ با *partir* اشتباه نشود، چون partir مفعول مستقیم نمی‌گیرد.'
    example_gloss: من ساعت نُه از خانه بیرون می‌شوم.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: اول... بعد...
    gloss: اول بلند می‌شوم، بعد لباس می‌پوشم.
    note: '*D''abord* (اول) و *ensuite* (بعد) کلمه‌های اساسی ترتیب‌اند که برای توضیح قدم‌به‌قدم یک روال به کار می‌روند.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: دوباره به خانه رفتن
    gloss: دوباره به خانه رفتن
    note: '*Rentrer* یعنی برگشتن به خانهٔ خود؛ با *retourner* (برگشتن به یک جا) که عمومی‌تر است فرق دارد.'
    example_gloss: من بعد از کار به خانه برمی‌گردم.
  fr.a1.unit10.lesson02.teach.diner:
    title: نان شب خوردن
    gloss: نان شب خوردن
    note: '*Dîner* می‌تواند فعل (نان شب خوردن) یا اسم (*le dîner*، نان شب) باشد؛ از روی جمله معلوم می‌شود.'
    example_gloss: ما شنبه شب‌ها با هم نان شب می‌خوریم.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: خواب شدن
    gloss: خواب شدن
    note: پایان طبیعی روال روزمره، در برابر *se lever* که در آغاز می‌آید.
    example_gloss: من نزدیک ساعت یازده شب خواب می‌شوم.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: آخر هفته
    gloss: آخر هفته
    note: '*Le week-end* واژه‌یی است که زبان فرانسوی از زبان دیگر گرفته و با خط پیوند نوشته می‌شود.'
    example_gloss: کارگاه آخر هفته برگزار می‌شود.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: معمولاً
    gloss: معمولاً
    note: '*D''habitude* برای یک عادت همیشگی می‌آید، و با *aujourd''hui* (امروز) که برای یک رویداد یک‌باره است فرق دارد.'
    example_gloss: من معمولاً ساعت هفت بلند می‌شوم.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: توصیف یک روز شنبه
    gloss: شنبه‌ها دیر بلند می‌شوم، بعد پیش از کارگاه به بازار می‌روم.
    note: ترتیب‌دهی مثل *d'abord/ensuite* را با *puis* («بعد») ترکیب می‌کند تا یک روز شنبه را توصیف کند.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: چه کار می‌کنی؟
    gloss: شنبه‌ها چه کار می‌کنی؟
    note: '*Qu''est-ce que tu fais... ?* شکل عادیِ غیررسمی برای پرسیدن از کار کسی است.'
  fr.a1.unit10.lesson03.teach.line01:
    title: پرسیدن دربارهٔ شنبه
    gloss: اینس از ماتیو می‌پرسد که شنبه‌ها پیش از کارگاه چه کار می‌کند.
    note: '*Tu fais quoi... ?* شکل طبیعی و غیررسمی برای پرسیدن «چه کار می‌کنی... ؟» است و از *Qu''est-ce que tu fais ?* محاوره‌یی‌تر است.'
  fr.a1.unit10.lesson03.teach.line02:
    title: توصیف بیدار شدن
    gloss: ماتیو می‌گوید اول دیر بیدار می‌شود، نزدیک ساعت نُه.
    note: '*Vers neuf heures* (نزدیک ساعت نُه) الگوی *vers* + وقت را برای زمان تقریبی به کار می‌برد.'
  fr.a1.unit10.lesson03.teach.line03:
    title: پرسیدن از قدم بعدی
    gloss: اینس می‌پرسد بعد چه می‌شود.
    note: یک سؤال کوتاه و طبیعی برای ادامه دادن توصیف روال روزمره.
  fr.a1.unit10.lesson03.teach.line04:
    title: توصیف چاشت و بازار
    gloss: ماتیو می‌گوید بعد چاشت می‌خورد و به بازار می‌رود.
    note: دو کار پیوسته که با *et* وصل شده‌اند و ترتیبی را که با *d'abord* شروع شد ادامه می‌دهند.
  fr.a1.unit10.lesson03.teach.line05:
    title: پرسیدن دربارهٔ برگشتن به خانه
    gloss: اینس می‌پرسد ماتیو ساعت چند به خانه برمی‌گردد.
    note: '*Tu rentres à quelle heure ?* فعل *rentrer* این درس را در یک سؤال مستقیم به کار می‌برد.'
  fr.a1.unit10.lesson03.teach.line06:
    title: توصیف بعد از چاشت
    gloss: ماتیو می‌گوید نزدیک چاشت به خانه برمی‌گردد و بعد از چاشت پیش از کارگاه شب استراحت می‌کند.
    note: '*Se reposer* (استراحت کردن) یک فعل انعکاسی دیگر است: *je me repose*.'
