teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: سلام معمولی
    gloss: سلام؛ روز به خیر
    note: Bonjour با آدم‌های ناآشنا، همکاران و دوستان در طول روز مناسب است. این کلمه هم سلام است و هم معنی «روز به خیر» را دارد.
  fr.a1.unit01.lesson01.teach.salut:
    title: سلام غیررسمی
    gloss: سلام؛ خداحافظ
    note: Salut برای رابطهٔ غیررسمی است. هم برای شروع و هم برای ختم صحبت به کار می‌رود، اما برای یک بزرگسال ناآشنا انتخاب مطمئن نیست.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: خداحافظی معمولی
    gloss: خداحافظ
    note: Au revoir هم در موقعیت‌های رسمی و هم غیررسمی درست است.
  fr.a1.unit01.lesson01.teach.tu:
    title: «تو» در حالت غیررسمی
    gloss: تو (غیررسمی، مفرد)
    note: در دری هم بین «تو» و «شما» فرق هست. tu برای یک دوست، طفل یا کسی که با او رابطهٔ غیررسمی دارید به کار می‌رود و شکل‌های فعل خودش را دارد.
  fr.a1.unit01.lesson01.teach.vous:
    title: «شما» برای احترام یا جمع
    gloss: شما، برای احترام یا جمع
    note: Vous برای یک بزرگسال ناآشنا انتخاب مطمئن است و برای هر گروه هم همین شکل را به کار می‌برند. مثل «شما» در دری، هم احترام را می‌رساند و هم جمع را.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: پرسیدن احوال به شکل رسمی
    gloss: شما چطور استید؟
    note: Allez شکل vous فعل aller است. فعل و ضمیر جابه‌جا شده و با خط فاصله وصل می‌شوند. این یک پرسش مؤدبانهٔ رایج است، نه سوال واقعی دربارهٔ اینکه کسی کجا می‌رود.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: پرسیدن احوال به شکل غیررسمی
    gloss: شما چطور استید؟
    note: Vas شکل tu فعل aller است. وقتی رابطه غیررسمی شود، فرانسوی allez-vous را به vas-tu تغییر می‌دهد؛ مثل اینکه در دری «چطور استید؟» به «چطور استی؟» بدل شود.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: جور کردن سلام با نوع رابطه
    gloss: سلام معمولی با «شما»؛ سلام غیررسمی با «تو»
    note: این جوڑها پیش‌فرض‌های مفیدند، نه قانون مطلق. Bonjour را با دوستان هم می‌شود به کار برد، اما salut همراه vous معمولاً پیام اجتماعی متضاد می‌دهد.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: گفتن نام خود
    gloss: نام من Camille است.
    note: Je m’appelle لفظاً یعنی «خود را صدا می‌کنم». در فرانسوی معمولاً ضمیر فاعلی je لازم است، برخلاف دری که ضمیر فاعلی اغلب حذف می‌شود. مصوت me پیش از appelle می‌افتد و m’appelle ساخته می‌شود.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: پرسیدن نام به شکل مؤدبانه
    gloss: نام شما چیست؟
    note: 'Appelez شکل vous فعل appeler است. vous دوم بعد از فعل می‌آید، چون پرسش با جابه‌جایی فعل و ضمیر ساخته شده: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: پرسیدن نام به شکل غیررسمی
    gloss: نام شما چیست؟
    note: T’appelles شکل tu است و ضمیر انعکاسی te پیش از مصوت کوتاه شده است. در این پرسش روزمره tu پیش از فعل می‌ماند و comment در آخر می‌آید.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: معرفی خود در گفتار
    gloss: من Noé استم.
    note: Moi, c’est یک شیوهٔ معرفی گفتاری است و از ترجمهٔ کلمه به کلمهٔ «من استم» محاوره‌یی‌تر است.
  fr.a1.unit01.lesson02.teach.enchante:
    title: مطابقت مذکر
    gloss: از آشنایی با شما خوشحال شدم.
    note: مرد معمولاً enchanté می‌نویسد. در دری صفت‌ها با جنسیت گوینده تغییر نمی‌کنند، اما این صفت فرانسوی تغییر می‌کند.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: مطابقت مؤنث
    gloss: از آشنایی با شما خوشحال شدم.
    note: زن معمولاً enchantée می‌نویسد و e آخر را اضافه می‌کند. enchanté و enchantée عموماً یک‌جور تلفظ می‌شوند، پس فرق در نوشتار واضح‌تر از گفتار است.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: برگرداندن پرسش به شکل مؤدبانه
    gloss: و شما؟
    note: برای حفظ لحن مؤدبانه یا مخاطب قرار دادن یک گروه، vous را به کار ببرید.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: برگرداندن پرسش به شکل غیررسمی
    gloss: و شما؟
    note: Toi شکل تأکیدی مربوط به tu است. فرانسوی بعد از et از toi کار می‌گیرد، نه از tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: حذف مصوت پیش از مصوت
    gloss: من زندگی می‌کنم
    note: 'Je پیش از habite مصوتش را از دست می‌دهد و آپوستروف این حذف را نشان می‌دهد: j’habite. حرف h در habiter مانع این حذف نمی‌شود.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: پیوند آوایی بعد از vous
    gloss: شما استید
    note: 's آخر vous معمولاً بی‌صدا است، اما پیش از صدای مصوت êtes مثل صدای z وصل می‌شود: vous êtes تقریباً مثل voo-ZEHT شنیده می‌شود. پیوند آوایی به عبارت گفتاری تعلق دارد، نه به املای آن.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: پیوند آوایی بعد از un
    gloss: یک کارگاه
    note: n آخر un به atelier وصل می‌شود. بین این دو کلمه وقفهٔ سخت نیندازید.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: املای مذکر
    gloss: از آشنایی خوش شدم، گوینده مرد
    note: Enchanté برای گوینده مرد با é تمام می‌شود. -an- مصوت خیشومی است، پس صدای n جداگانه تلفظ نکنین.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: املای مؤنث
    gloss: از آشنایی خوش شدم، گوینده زن
    note: Enchantée برای مطابقت مؤنث e می‌گیرد، اما این e معمولاً هجای گفتاری تازه نمی‌سازد.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: خواندن پرسش با جابه‌جایی فعل و ضمیر
    gloss: شما چطور استید؟
    note: allez-vous را به شکل یک واحد پیوسته بخوانین. z نوشتاری در allez اینجا مثل یک صدای z اضافی تلفظ نمی‌شود؛ تلفظ معیاری تقریباً ah-LAY voo است.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: پرسش روزمره دربارهٔ احوال
    gloss: چطور استی؟؛ خوب استی؟
    note: در Ça زیر c علامت سدیل است که c را پیش از a مثل s می‌خواند. همین عبارت بسته به آهنگ صدا می‌تواند سوال باشد یا جواب.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: جواب بسیار مثبت
    gloss: بسیار خوبم، تشکر.
    note: Très کلمهٔ bien را تقویت می‌کند. s آخرش بی‌صدا است.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: جواب مثبت
    gloss: خوبستم.
    note: در این جملهٔ ثابت، فرانسوی ضمیر «من» را نمی‌خواهد؛ در دری هم در «خوبستم» ضمیر جدا نمی‌آید.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: جواب نسبتاً مثبت
    gloss: بد نیست.
    note: Pas mal اغلب کمی مثبت است، مثل «بد نیست» در دری.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: مطابقت صفت مذکر
    gloss: کمی خسته استم.
    note: Suis شکل je فعل être است. مرد fatigué می‌نویسد. در دری «خسته» با جنسیت گوینده تغییر نمی‌کند.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: مطابقت صفت مؤنث
    gloss: کمی خسته استم.
    note: زن fatiguée را با e آخر می‌نویسد. شکل مذکر و مؤنث معمولاً یک‌جور تلفظ می‌شوند.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: برگرداندن مؤدبانهٔ پرسش
    gloss: و شما؟
    note: Vous لحن محترمانه‌یی را که با یک بزرگسال ناآشنا به کار می‌رود حفظ می‌کند.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: برگرداندن غیررسمی پرسش
    gloss: و شما؟
    note: وقتی با یک دوست یا هم‌سن‌وسال غیررسمی صحبت می‌کنین، بعد از et از toi کار بگیرین.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: تأیید دلیل آمدن کسی
    gloss: شما برای کارگاه آمده‌اید؟
    note: Êtes شکل vous فعل être است. فرانسوی فعل کمکی اضافه نمی‌کند؛ آهنگ بالارونده جمله را پرسشی می‌سازد.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: تأیید یک حدس
    gloss: بلی، درست است.
    note: C’est ça یک تأیید طبیعی است، نه ترجمهٔ لفظی «آن همین است».
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: پرسیدن محل سکونت
    gloss: شما در همین محله زندگی می‌کنین؟
    note: Habitez شکل vous فعل habiter است. فرانسوی هم مثل دری می‌تواند ترتیب جملهٔ خبری را نگه دارد و فقط با آهنگ پرسشی بپرسد.
  fr.a1.unit01.lesson05.teach.i_live:
    title: گفتن محل سکونت
    gloss: من در Montreuil زندگی می‌کنم.
    note: J’habite شکل je فعل habiter با حذف مصوت است. À محل یک شهر را نشان می‌دهد و نباید با a، شکل فعلی به معنی «دارد»، اشتباه شود.
  fr.a1.unit01.lesson05.teach.from_here:
    title: پرسیدن دربارهٔ اهل محل بودن
    gloss: شما اهل همین‌جا استید؟
    note: D’ici از de و ici با حذف مصوت ساخته شده است. Êtes همچنان شکل vous فعل être است.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: گفتن اصلیت خود
    gloss: من اهل Lille استم.
    note: Suis شکل je فعل être است. فرانسوی هنگام گفتن اصلیت، پیش از نام شهر de می‌آورد.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: فعالیت شروع می‌شود
    gloss: کارگاه شروع می‌شود.
    note: Atelier مذکر است، پس حرف تعریف مفرد آن le است. پیش از مصوت، le به l’ بدل می‌شود. Commence شکل سوم شخص مفرد است.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: خداحافظی برای دیدار نزدیک
    gloss: بعداً می‌بینیم؛ امروز دوباره می‌بینیم
    note: À tout à l’heure یعنی در همان روز دوباره همدیگر را می‌بینیم، برخلاف خداحافظی عمومی که وقت مشخصی برای دیدار بعدی ندارد.
  fr.a1.unit01.lesson06.teach.line01:
    title: آغاز دیدار
    gloss: Inès به Mathieu سلام می‌دهد و می‌پرسد که برای کارگاه آشپزی آمده یا نه.
    note: گوینده‌ها با vous شروع می‌کنند، چون بزرگسالان ناآشنا استند.
  fr.a1.unit01.lesson06.teach.line02:
    title: آغاز دیدار، جواب
    gloss: Mathieu تأیید می‌کند و نامش را می‌گوید، بعد نام او را می‌پرسد.
    note: Je m’appelle شیوهٔ معیاری گفتن نام است.
  fr.a1.unit01.lesson06.teach.line03:
    title: معرفی نام
    gloss: Inès نامش را می‌گوید و می‌گوید از آشنایی با او خوش شده.
    note: Enchantée با Inès که مؤنث است مطابقت دارد؛ e آخر نوشته می‌شود اما معمولاً شنیده نمی‌شود.
  fr.a1.unit01.lesson06.teach.line04:
    title: معرفی نام، جواب
    gloss: Mathieu همین احساس را برمی‌گرداند و می‌پرسد که او نزدیک همین‌جا زندگی می‌کند یا نه.
    note: Enchanté با Mathieu که مذکر است مطابقت دارد؛ همان کلمه‌یی که Inès گفت، بدون e بی‌صدا.
  fr.a1.unit01.lesson06.teach.line05:
    title: تبادل معلومات دربارهٔ محله
    gloss: Inès تأیید می‌کند و کوچه‌اش را می‌گوید، بعد همین سوال را از Mathieu می‌پرسد.
    note: J’habite همراه با نام کوچه، پیش از rue حرف اضافه نمی‌گیرد.
  fr.a1.unit01.lesson06.teach.line06:
    title: تبادل معلومات دربارهٔ محله، جواب
    gloss: Mathieu می‌گوید در Saint-Ouen زندگی می‌کند و می‌پرسد که او اصلاً اهل اینجاست یا نه.
    note: J’habite à پیش از نام جا حرف à را می‌آورد، برخلاف عبارت کوچه که Inès همین حالا گفت.
  fr.a1.unit01.lesson06.teach.line07:
    title: تبادل معلومات دربارهٔ اصلیت
    gloss: Inès می‌گوید اهل اینجا نیست و از Lille است، بعد از Mathieu می‌پرسد.
    note: Je suis de + نام شهر نشان می‌دهد که کسی اهل کجاست.
  fr.a1.unit01.lesson06.teach.line08:
    title: گفتن اهل کجا بودن، جواب
    gloss: متیو می‌گوید که اهل Lyon است.
    note: همان ساختار je suis de که اینس همین حالا استفاده کرد.
  fr.a1.unit01.lesson06.teach.line09:
    title: قطع کردن گپ
    gloss: اینس می‌بیند که کارگاه شروع می‌شود و می‌گوید که بعد از چند لحظه او را می‌بیند.
    note: À tout à l’heure مناسب است، چون هر دو نفر در همین مجلس می‌مانند.
  fr.a1.unit01.lesson06.teach.line10:
    title: قطع کردن گپ، جواب
    gloss: متیو همان خداحافظی را تکرار می‌کند.
    note: تکرار کردن à tout à l’heure راه طبیعی تأیید کردن آن است.
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: گوش کنید و عبارتی را که می‌شنوید انتخاب کنید.
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
