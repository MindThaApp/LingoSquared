teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: کوت، سویتر
    gloss: کوت، سویتر
    note: '*Le manteau* و *le pull* هر دو مذکر استند.'
    example_gloss:
    - دنبال یک کوت می‌گردم.
    - من یک سویتر دارم.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: پتلون، بوت
    gloss: پتلون، بوت‌ها
    note: '*Pantalon* در فرانسوی مفرد است: برای یک دانه *un pantalon* می‌گویند. *Chaussures* جمع *chaussure* است؛ معمولاً بوت‌ها به شکل جمع گفته می‌شوند.'
    example_gloss:
    - من دنبال یک پتلون می‌گردم.
    - دنبال بوت می‌گردم.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: گفتن اینکه دنبال چه می‌گردید
    gloss: دنبال یک کوت می‌گردم.
    note: '*Chercher* (دنبال چیزی گشتن) مفعول را مستقیم می‌گیرد، بدون حرف اضافه: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: اندازه
    gloss: اندازه
    note: '*Taille* مؤنث است: *la taille*.'
    example_gloss: شما کدام اندازه استید؟
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: پرسیدن در مورد اندازه
    gloss: چه سایز می‌پوشید؟
    note: '*Quelle taille ?* از *quelle* (کدام) کار می‌گیرد، چون *taille* مؤنث است و جواب‌های ممکنش محدود است (S، M، L یا یک عدد).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: گفتن اندازهٔ خود
    gloss: من اندازهٔ M استم.
    note: '*Faire du M* یعنی اندازهٔ M بودن: فرانسوی برای اندازه از *faire* (کردن، ساختن) کار می‌گیرد، نه از فعل «بودن».'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: سیاه، آبی
    gloss: سیاه، آبی
    note: دو صفت رنگ اساسی این درس.
    example_gloss:
    - کوت را به رنگ سیاه می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: درخواست یک رنگ
    gloss: کوت را به رنگ سیاه می‌خواهم.
    note: '*En* + رنگ، شیوهٔ معمول برای مشخص کردن رنگ لباس هنگام سفارش یا درخواست آن است.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: پرسیدن از رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*Aussi* (هم) می‌پرسد که آیا رنگ دیگر هم موجود است؛ اینجا شکل محترمانهٔ *vous* به کار رفته است.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: پرسیدن از اندازه بودن لباس
    gloss: این کوت به تو اندازه است؟
    note: '*Aller* (رفتن) فعل طبیعی برای اندازه و جور بودن لباس است: *il me va bien*، یعنی لفظاً «به من خوب می‌رود».'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: تأیید اندازه بودن
    gloss: به من اندازه است.
    note: '*Bien* (خوب) چگونگی اندازه بودن لباس را بیان می‌کند.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: خیلی کوچک است
    gloss: این خیلی کوچک است.
    note: '*Trop* (خیلی، زیادی) پیش از صفت می‌آید تا زیادی بودن را برساند.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: خیلی بزرگ است
    gloss: این خیلی بزرگ است.
    note: همان الگوی *trop* + صفت کارت قبلی، یعنی *trop petit*.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: نود
    gloss: نود
    note: '*Quatre-vingt-dix* عدد ۹۰ است (لفظاً «چهار بیست ده»)، که اینجا در قیمت کوت آمده است.'
    example_gloss: کوت نود یورو قیمت دارد.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: گفتن قیمت
    gloss: کوت نود یورو قیمت دارد.
    note: '*Coûte* شکل *il* فعل *coûter* (قیمت داشتن) است.'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: خواندن رسید دوکان
    gloss: 'کوت زمستانی: اندازهٔ M، رنگ سیاه. قیمت: نود یورو. این کوت به من اندازه است و گرم است.'
    note: اندازه، رنگ، قیمت و دو ویژگی ذکرشدهٔ کوت را دنبال کنید.
    glosses:
      Parka: کوت زمستانی
      taille: اندازه
      couleur: رنگ
      noire: سیاه
      Prix: قیمت
      quatre-vingt-dix: نود
      euros: یورو
      manteau: کوت
      va: اندازه است
      chaud: گرم
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: کامی کوت را می‌بیند
    gloss: 'کامی: این کوت قشنگ است! تو چه اندازه استی؟'
    note: '*Joli* (قشنگ) واکنش مثبت عمومی است؛ اینجا مذکر آمده تا با *manteau* مطابقت کند.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: ماتیو اجازه می‌خواهد امتحانش کند
    gloss: 'ماتیو: من اندازهٔ M استم. می‌شود امتحانش کنم؟'
    note: '*Je peux ... ?* شیوهٔ معمول اجازه خواستن است؛ *l''essayer* یعنی «امتحان کردن آن» و *l''* به جای کوت آمده است.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: کامی از اندازه بودن می‌پرسد
    gloss: 'کامی: البته. به تو اندازه است؟'
    note: '*Il* (او، آن) به *le manteau* برمی‌گردد که اسم مذکر است.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: ماتیو تأیید می‌کند
    gloss: 'ماتیو: بلی، به من اندازه است و گرم است.'
    note: کاملاً با رسیدی که خواندید مطابقت دارد؛ این همان کوت است.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: کامی از رنگ می‌پرسد
    gloss: 'کامی: عالی! آن را به رنگ سیاه می‌خواهی یا آبی؟'
    note: '*Tu le veux en ... ou en ... ?* یک انتخاب پیشنهاد می‌کند؛ *le* به جای کوت آمده است.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: ماتیو تصمیم می‌گیرد
    gloss: 'ماتیو: سیاهش را می‌گیرم.'
    note: '*Prendre* (گرفتن) فعل طبیعی برای نهایی کردن انتخاب خرید است و با رنگ ذکرشده در رسید مطابقت دارد.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends یا prend
    gloss: '*Prends* شکل «من» و «تو» فعل *prendre* (گرفتن) است؛ *prend* شکل «او» است.'
    note: 'الگوی *prendre*: *je prends, tu prends, il/elle prend*.'
