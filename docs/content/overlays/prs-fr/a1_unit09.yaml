teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: طرف چپ
    gloss: طرف چپ / به چپ
    note: '*À gauche* هم برای محل («طرف چپ است») و هم برای جهت («به چپ بپیچید») استفاده می‌شود.'
    example_gloss: بعد از نانوایی به چپ بپیچید.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: طرف راست
    gloss: طرف راست / به راست
    note: درست مخالف *à gauche* است و به همان شکل استفاده می‌شود.
    example_gloss: دواخانه طرف راست کافه است.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: سیده
    gloss: سیده / مستقیم
    note: '*Tout droit* یعنی «سیده»؛ آن را با *à droite* («طرف راست») که شبیه است ولی معنی دیگر دارد، اشتباه نکنین.'
    example_gloss: تا بازار سیده بروید.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: سر گوشهٔ سرک
    gloss: سر گوشهٔ سرک
    note: '*Au coin de* یعنی «سر گوشهٔ»؛ *au coin de la rue* (سر گوشهٔ سرک) یک عبارت نشانی بسیار رایج است.'
    example_gloss: دوکان سر گوشهٔ سرک است.
  fr.a1.unit09.lesson01.teach.traverser:
    title: عبور کردن
    gloss: عبور کردن
    note: '*Traverser* فعل منظم گروه -ER است: *je traverse*، *tu traverses* و غیره.'
    example_gloss: برای رسیدن به دوکان باید از سرک عبور کنید.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: دوکان
    gloss: دوکان
    note: '*La boutique* معمولاً یک دوکان کوچک تخصصی است، نه یک دوکان بزرگ.'
    example_gloss: دوکان سر گوشهٔ سرک، طرف راست است.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: چهارراهی
    gloss: چهارراهی / تقاطع
    note: '*Le carrefour* جایی است که دو سرک همدیگر را قطع می‌کنند -- یک نشانی رایج در راه‌نمایی زبانی.'
    example_gloss: در چهارراهی به چپ بپیچید.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: پرسیدن راه
    gloss: معذرت، چطور به دوکان بروم، لطفاً؟
    note: '*Pour aller à... ?* (به معنی تحت‌اللفظی «برای رفتن به...») روش معمول و مؤدبانه برای پرسیدن آدرس یک جاست.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: به چپ بپیچ
    gloss: بعد از دواخانه به چپ بپیچید.
    note: '*Tournez* شکل امری *vous* فعل *tourner* (پیچیدن) است -- لحن عادی برای راه‌نمایی به کسی که خوب نمی‌شناسید.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: سیده ادامه بتین
    gloss: تا چهارراهی سیده ادامه بتین.
    note: '*Continuez* (ادامه بتین) + *tout droit* (سیده) روش معمول گفتن این است که بدون پیچیدن به راه ادامه بدهد.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: محل را بگویین
    gloss: سر گوشهٔ سرک، طرف راست است.
    note: '*Au coin de la rue* را با *à droite* یکجا می‌کند تا محل دقیق گفته شود.'
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: بگویین که دور نیست
    gloss: دور نیست، پنج دقیقه پیاده راه است.
    note: '*À cinq minutes à pied* (پنج دقیقه پیاده) همان الگوی زمان راه رفتن است که وقتی Mathieu دربارهٔ دواخانه پرسید، دیدید.'
  fr.a1.unit09.lesson03.teach.line01:
    title: پرسیدن دربارهٔ یک دوکان
    gloss: Inès از Mathieu می‌پرسد که دوکانی برای خریدن ظروف آشپزخانه می‌شناسد یا نه.
    note: '*Tu connais... ?* (می‌شناسی) روش معمول غیررسمی برای پرسیدن است که کسی جایی را می‌شناسد یا نه.'
  fr.a1.unit09.lesson03.teach.line02:
    title: گفتن قدم اول
    gloss: Mathieu می‌گوید بلی، یکی نزدیک اینجا هست -- در چهارراهی به چپ می‌پیچی.
    note: '*Il y en a une* (یکی هست) از *en* استفاده می‌کند تا *boutique* دوباره تکرار نشود -- یک میان‌بر رایج در فرانسوی گفتاری.'
  fr.a1.unit09.lesson03.teach.line03:
    title: تأیید کردن و پرسیدن بیشتر
    gloss: Inès تأیید می‌کند که در چهارراهی به چپ، و می‌پرسد بعدش چه؟
    note: '*Et ensuite ?* (و بعدش؟) روش ساده و طبیعی برای پرسیدن مرحلهٔ بعدی راه است.'
  fr.a1.unit09.lesson03.teach.line04:
    title: گفتن قدم دوم
    gloss: Mathieu می‌گوید بعدش سیده می‌روی و از سرک عبور می‌کنی.
    note: دو فعل جهت با *et* به هم وصل شده‌اند -- روش طبیعی برای گفتن یک مسیر کوتاه.
  fr.a1.unit09.lesson03.teach.line05:
    title: پرسیدن محل دقیق
    gloss: Inès می‌پرسد که دوکان دقیقاً کجاست.
    note: '*Exactement* (دقیقاً) جواب دقیق‌تر از یک جهت کلی می‌خواهد.'
  fr.a1.unit09.lesson03.teach.line06:
    title: گفتن محل دقیق
    gloss: Mathieu می‌گوید سر گوشهٔ سرک، درست مقابل نانوایی است.
    note: '*En face de* (مقابل) محل را با یک نشانی مشخص می‌کند، روش طبیعی برای تمام کردن راه‌نمایی.'
