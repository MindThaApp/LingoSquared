course:
  title: فرانسوی A1
  description: پرسیدن و دادن راه‌نمایی ساده در سرک (à gauche/à droite, tout droit, au coin de la rue, traverser)، در ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو، وقتی اینس دنبال دوکان لوازم آشپزخانه می‌گردد. در فرانسوی راه‌نمایی را می‌شود هم با فعل امری vous داد ("Tournez à gauche") و هم با زمان حال ("Tu tournes à gauche").
