teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: خوش، غمگین و خشمگین
    gloss: خوش، غمگین، خشمگین
    note: سه کلمه‌ی اساسی احساس که با *être* (بودن) به کار می‌روند؛ *content* مؤنث *contente* دارد، ولی *triste* و *en colère* تغییر نمی‌کنند.
    example_gloss:
    - من خوش هستم.
    - من غمگین استم.
    - من خشمگین هستم.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: گفتن اینکه خوش استی
    gloss: من خوش هستم.
    note: '*Être* (بودن) + صفت احساس، ساختار اساسی است، مثل «من ... هستم» در دری.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: مقایسه‌ی احساسات
    gloss: من خشمگین نیستم، غمگین هستم.
    note: '*Ne ... pas* دور فعل می‌آید؛ جمله‌ی دوم بعد از آن احساس واقعی را می‌گوید.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: پرسیدن سبب
    gloss: چرا خوش استی؟
    note: '*Pourquoi* (چرا) کلمه‌ی پرسشی معمول برای پرسیدن سبب است.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: گفتن سبب
    gloss: من خوش هستم چون یک آپارتمان نو دارم.
    note: '*Parce que* (چون) جمله‌ی سبب را شروع می‌کند؛ پیش از *il* به *parce qu''* کوتاه می‌شود.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: یک سبب منفی
    gloss: من غمگین هستم چون باران می‌بارد.
    note: '*il pleut* (باران می‌بارد) از درس هوا دوباره به‌عنوان جمله‌ی سبب آمده است.'
  fr.a1.unit49.lesson03.teach.nerveux:
    title: عصبی
    gloss: عصبی
    note: کلمه‌ی معمول برای دلواپسی و اضطراب.
    example_gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: گفتن اینکه از چه دلواپس استی
    gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
    note: '*Avant* (در اصل «پیش از») چیزی را می‌آورد که دلواپسی درباره‌ی آن است؛ در دری برای این کار «از» می‌گوییم.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: دلداری دادن به کسی
    gloss: غم نخور.
    note: '*Ne t''inquiète pas* (در اصل «خودت را نگران نکن») عبارت ثابت و معمول دلداری است؛ *s''inquiéter* فعل انعکاسی است.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: پرسیدن اینکه کسی چه احساس دارد
    gloss: ماتیو چه احساس دارد؟
    note: '*Se sentir* (احساس کردن، فعل انعکاسی) راه معمول پرسیدن یا گفتن حالت روحی است؛ در درس صحت هم می‌آید.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: گفتن اینکه کسی چه احساس دارد
    gloss: او دلواپس است.
    note: '*Se* ضمیر انعکاسی شخص سوم است و با *sent* می‌آید.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: پرسیدن اینکه چرا کسی چنین احساسی دارد
    gloss: چرا او دلواپس است؟
    note: '*pourquoi* با *se sentir* در *Il se sent nerveux* یکجا شده است؛ *sent-il* با خط پیوند نوشته می‌شود.'
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: خواندن پیام درباره‌ی احساسات
    gloss: سلام کامیل، من از اولین نوبت کاری‌ام به‌تنهایی کمی دلواپس هستم. ولی خوش هم هستم، چون کار نو و آپارتمان نو دارم. فکر می‌کنم همه‌چیز خوب می‌شود.
    note: بفهم که نویسنده از چه دلواپس است، چه چیز او را خوش می‌کند و دید کلی‌اش چیست.
    glosses:
      peu: کمی
      nerveux: عصبی
      premier: اولین
      service: نوبت کاری
      seul: تنها
      content: خوشحال
      car: چون
      nouveau: نو
      travail: کار
      nouvel: نو
      appartement: آپارتمان
      pense: فکر کردن
      aller: 'درست شدن (اینجا: خوب می‌شود)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: کامیل می‌پرسد ماتیو چه احساس دارد
    gloss: 'کامیل: سلام ماتیو، پیش از اولین نوبت کاری‌ات چه احساس داری؟'
    note: '*Avant ton premier service* (پیش از اولین نوبت کاری‌ات) ساختار *avant* + اسم را از درس سوم دوباره می‌آورد.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: ماتیو اعتراف می‌کند که دلواپس است
    gloss: 'ماتیو: راستش کمی دلواپس هستم.'
    note: '*Honnêtement* (راستش) اعتراف را نرم‌تر می‌سازد.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: کامیل به او دلداری می‌دهد
    gloss: 'کامیل: نگران نباش، از عهده‌اش برمی‌آیی!'
    note: '*Tu vas y arriver* (در اصل «به آنجا می‌رسی») عبارت ثابت دلگرم‌کننده است؛ *aller* + مصدر آینده‌ی نزدیک را می‌سازد.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: ماتیو از او تشکر می‌کند
    gloss: 'ماتیو: تشکر، واقعاً کمکم می‌کند.'
    note: '*Aide* شکل *il/elle* فعل *aider* (کمک کردن) است؛ *m''* به‌جای *me* آمده است.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: کامیل نتیجه را پیش‌بینی می‌کند
    gloss: 'کامیل: و بعد از آن حتماً خیلی خوش و سربلند می‌شوی.'
    note: '*Sûrement* (حتماً) پیش‌بینی با اطمینان را می‌رساند؛ *fier* (سربلند) صفت نو و مفید است.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: ماتیو موافقت می‌کند
    gloss: 'ماتیو: بلی، من هم همین‌طور فکر می‌کنم.'
    note: '*Je pense aussi* راه طبیعی موافقت با نظر کسی است.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: خلاصه کردن با il، elle و l'
    gloss: ماتیو از اولین نوبت کاری‌اش دلواپس است. کامیل به او کمک می‌کند.
    note: '*Il* به‌جای نام مرد (*il est nerveux*)، *elle* به‌جای نام زن می‌آید و *l''* (*elle l''aide*) یعنی «او (مرد) را»: سه کلمه‌ی کوچک ولی ضروری برای گفتن درباره‌ی کس دیگر.'
