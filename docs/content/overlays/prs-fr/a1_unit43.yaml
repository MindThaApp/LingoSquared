teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: تکت
    gloss: تکت
    note: '*Billet* مذکر است: *le billet*، *un billet*.'
    example_gloss: یک تکت به لیون می‌خواهم.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: تکت خواستن
    gloss: یک تکت به لیون می‌خواهم.
    note: '*Je voudrais* درخواست را نرم‌تر می‌کند؛ از *je veux* مؤدبانه‌تر است.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: کارمند می‌پرسد کدام نوع
    gloss: تکت یک‌طرفه می‌خواهین یا رفت و برگشت؟
    note: '*Voulez-vous* صورت رسمی *vous* فعل *vouloir* است و اینجا برای کارمند ناآشنای ایستگاه به کار می‌رود.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: مؤدبانه جواب دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*S''il vous plaît* «لطفاً»ی رسمی است و با سطح رسمی *vous* در این گفتگو می‌خواند.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: شیوه سخن گفتن در کانتر
    gloss: پیش دَم کانتر معمولاً از شکل مؤدبانهٔ *vous* استفاده می‌کنند.
    note: با کسانی که کارمند خدمات‌اند و نمی‌شناسید، *vous* به کار می‌رود؛ با دوستان و فامیل *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: پلاتفورم
    gloss: پلاتفورم
    note: '*Quai* مذکر است: *le quai*.'
    example_gloss: قطار لیون از کدام پلت‌فرم حرکت می‌کند؟
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: پرسیدن از پلاتفورم
    gloss: قطار لیون از کدام پلت‌فرم حرکت می‌کند؟
    note: '*De quel quai* مخصوصاً دربارهٔ پلت‌فرم می‌پرسد؛ *quel* با اسم مذکر *quai* مطابقت دارد.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: گفتن معلومات حرکت
    gloss: ریل ساعت ده کم یک چارک از پلاتفورم پنج حرکت می‌کنه.
    note: '*Dix heures moins le quart* یعنی ربع کم ده: فرانسوی برای وقت‌های پیش از ساعت کامل *moins* (منفی) می‌گوید.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: پرسیدن از وقت رسیدن
    gloss: ریل ساعت چند می‌رسه؟
    note: '*À quelle heure arrive ... ?* وقت را می‌پرسد؛ *arriver* فعل با قاعدهٔ *-er* است: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: گفتن وقت رسیدن
    gloss: ریل ساعت یازده می‌رسه.
    note: '*Arrive* صورت *il/elle* فعل *arriver* است؛ فعل‌های *-er* با *il* و *elle* به *-e* ختم می‌شوند.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: به وقت / تأخیر
    gloss: به وقت؛ تأخیر
    note: '*À l''heure* عبارت ثابت برای چیزی است که سر وقت اتفاق می‌افتد. *Le retard* (تأخیر) مذکر است.'
    example_gloss:
    - ریل به وقت حرکت نمی‌کنه.
    - 'توجه: قطار لیون تأخیر دارد.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: یک اعلان
    gloss: 'توجه: قطار لیون تأخیر دارد.'
    note: '*Attention* اعلان ایستگاه را شروع می‌کند، مثل «توجه، مسافران محترم».'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: منفی کردن «به وقت»
    gloss: ریل به وقت حرکت نمی‌کنه.
    note: '*Ne ... pas* دور فعل می‌آید: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: تغییر پلاتفورم
    gloss: ریل به جای پلاتفورم پنج، از پلاتفورم سه حرکت می‌کنه.
    note: '*Au lieu du* یعنی «به جای»؛ *de* + *le* با هم *du* می‌شوند.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: گفتن اندازهٔ تأخیر
    gloss: ریل ده دقیقه تأخیر دارد.
    note: '*A ... de retard* (لفظاً «... تأخیر دارد») راه طبیعی برای گفتن دیر بودن است؛ با *avoir* ساخته می‌شود.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: دروازه، خروجی، اتاق انتظار
    gloss: ورودی؛ خروجی؛ اتاق انتظار
    note: '*L''entrée* پیش از مصوت *e* را از دست می‌دهد و *l''* می‌شود؛ *la sortie* و *la salle d''attente* مؤنث استند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - اتاق انتظار کجاست؟
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: پرسیدن جای پلاتفورم
    gloss: پلاتفورم هفت کجاست؟
    note: '*Où est ... ?* جای چیزی را می‌پرسد؛ *le quai sept* مذکر است.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: آدرس دادن
    gloss: مستقیم بروید و بعد به راست.
    note: '*Tout droit* و *à droite* کلمه‌های جهت استند؛ *à* پیش از *droite* می‌آید.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: پرسیدن از اتاق انتظار
    gloss: اتاق انتظار کجاست؟
    note: همان الگوی سؤال برای یک جای تازه.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: خواندن تکت چاپ‌شده
    gloss: 'تکت: از پاریس گار دو لیون تا لیون پار-دیو. حرکت: ساعت ده و ده دقیقه، پلت‌فرم هفت. رسیدن: ده دقیقه به یازده. رفت و برگشت. قیمت: دوازده یورو و چهل.'
    note: وقت حرکت و پلاتفورم، وقت رسیدن، نوع تکت و قیمت را دنبال کنید.
    glosses:
      Billet: تکت
      Départ: حرکت
      dix: ده
      quai: پلاتفورم
      sept: هفت
      Arrivée: رسیدن
      onze: یازده
      Aller-retour: تکت رفت و برگشت
      Prix: قیمت
      douze: دوازده
      euros: یورو
      quarante: چهل
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: ماتیو برنامه را می‌گوید
    gloss: 'ماتیو: باید به پلت‌فرم هفت برویم. قطار ساعت ده و ده دقیقه حرکت می‌کند.'
    note: '*On doit* (از *devoir*) اینجا ضرورت عملی را می‌رساند، نه اجبار سخت.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: کمیل تخته را می‌خواند
    gloss: 'کمیل: ببین، اینه تخته: تأخیر، ده دقیقه.'
    note: '*Voilà* چیزی را که آنجاست نشان می‌دهد: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: ماتیو آرام می‌ماند
    gloss: 'ماتیو: مشکلی نیست، هنوز وقت داریم که یک چای یا قهوه بخوریم.'
    note: '*Pas de problème* عبارت معمول و غیررسمی برای دلداری دادن است.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: ریل می‌رسد
    gloss: 'کمیل: فکر خوبه. آه، قطار همین حالا آمد. پلت‌فرم هفت، درست سر وقت!'
    note: '*Déjà* (همین حالا / قبلاً) نشان می‌دهد قطار با وجود تأخیرِ اعلان‌شده زودتر از انتظار آمده است.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: سوار ریل می‌شوند
    gloss: 'ماتیو: بیا، سوار شویم. لیون، آمدیم!'
    note: '*On* در گفتار روزمره به جای *nous* (ما) می‌آید و فعل آن مثل *il* صرف می‌شود: *on monte*. *On arrive !* راه طبیعی گفتن «داریم می‌رسیم» است؛ ترجمهٔ کلمه به کلمهٔ آن عجیب به نظر می‌رسد.'
