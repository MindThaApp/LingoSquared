  fr.a1.unit07.lesson01.teach.gare:
    title: ایستگاه قطار
    gloss: ایستگاه قطار
    note: '*Gare* مؤنث است.'
    example_gloss: ایستگاه قطار بزرگ است.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: دواخانه
    gloss: دواخانه
    note: '*Pharmacie* مؤنث است.'
    example_gloss: دواخانه ساعت نُه باز می‌شود.
  fr.a1.unit07.lesson01.teach.banque:
    title: بانک
    gloss: بانک
    note: '*Banque* مؤنث است.'
    example_gloss: بانک روزهای یکشنبه بسته است.
  fr.a1.unit07.lesson01.teach.ecole:
    title: مکتب
    gloss: مکتب
    note: '*École* مؤنث است؛ *l''* پیش از صدای مصوتِ آن کوتاه می‌شود.'
    example_gloss: مکتب پهلوی پارک است.
  fr.a1.unit07.lesson01.teach.cafe:
    title: کافه
    gloss: کافه
    note: '*Café* مذکر است؛ در جاهای دیگر معنی «قهوه» هم می‌دهد.'
    example_gloss: کافه تمام روز باز است.
  fr.a1.unit07.lesson01.teach.poste:
    title: پستخانه
    gloss: پستخانه
    note: '*Poste* (مؤنث) اینجا معنی «پستخانه» دارد؛ *le poste* (مذکر، با معنی دیگر) می‌تواند «وظیفه/پُست» باشد -- جنسیت معنی را تغییر می‌دهد.'
    example_gloss: پستخانه ساعت شش بسته می‌شود.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: مقایسهٔ دو جا
    gloss: ایستگاه قطار بزرگ است و دواخانه کوچک.
    note: '*Grande*/*petite* هر دو اینجا با اسم‌های مؤنث (*la gare*, *la pharmacie*) هماهنگ شده‌اند.'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: پرسیدن جای یک مکان
    gloss: ایستگاه قطار کجاست، لطفاً؟
    note: '*Où est... ?* راه معمول و همه‌کاره برای پرسیدن جای یک مکان است.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: گفتن اینکه جایی روبه‌رو است
    gloss: بانک روبه‌روی ایستگاه قطار است.
    note: '*En face de* (روبه‌روی) به *de* ختم می‌شود و بعدش جای مرجع می‌آید: *en face de la banque*. پیش از اسم مذکر کوتاه می‌شود: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: گفتن اینکه جایی پهلوی چیزی است
    gloss: دواخانه پهلوی بانک است.
    note: '*À côté de* (پهلوی) همان الگوی پیوند با *de* را دارد که *en face de* دارد.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: گفتن اینکه جایی نزدیک است
    gloss: مکتب نزدیک اینجاست.
    note: '*Près de* (نزدیک) پیش از صدای مصوت به *près d''* تبدیل می‌شود، مثل *près d''ici* (نزدیک اینجا).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: گفتن اینکه جایی دور است
    gloss: پستخانه از اینجا دور است.
    note: '*Loin de* (دور از) درست مخالف *près de* است.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: پرسیدن اینکه جایی دور است یا نه
    gloss: از اینجا دور است؟ — نه، دور نیست.
    note: '*C''est loin d''ici ?* سؤال طبیعی بعد از گرفتن آدرس است. برای گفتن «نه»، *ne... pas* را دور فعل بگذارین: *ce n''est pas loin* (دور نیست).'
  fr.a1.unit07.lesson03.teach.line01:
    title: پرسیدن آدرس از یک ناشناس
    gloss: ماتیو با ادب از یک رهگذر می‌پرسد که دواخانه کجاست.
    note: '*Excusez-moi* (معذرت) آغاز مؤدبانهٔ معمول هنگام نزدیک شدن به یک ناشناس است و با *vous* می‌آید.'
  fr.a1.unit07.lesson03.teach.line02:
    title: دادن جای مکان
    gloss: او می‌گوید روبه‌روی بانک و پهلوی کافه است.
    note: '*en face de* و *à côté de* در یک جمله با هم می‌آیند تا جای دقیق را بدهند. *De* + *le café* به *du café* تبدیل می‌شود.'
  fr.a1.unit07.lesson03.teach.line03:
    title: پرسیدن که دور است یا نه
    gloss: ماتیو می‌پرسد که از اینجا دور است یا نه.
    note: همان *C'est loin d'ici ?* که برای پرسیدن فاصله یاد گرفتید.
  fr.a1.unit07.lesson03.teach.line04:
    title: اطمینان دادن که نزدیک است
    gloss: او می‌گوید نه، خیلی نزدیک است -- پنج دقیقه پیاده.
    note: '*À pied* (پیاده) راه معمول برای گفتن این است که با پای پیاده می‌روند.'
  fr.a1.unit07.lesson03.teach.line05:
    title: تشکر از او
    gloss: ماتیو از صمیم دل از او تشکر می‌کند.
    note: '*Merci beaucoup* شکل قوی‌تر *merci* است که از واحدهای قبلی می‌شناسید.'
  fr.a1.unit07.lesson03.teach.line06:
    title: جواب تشکر
    gloss: 'او جواب می‌دهد: خواهش می‌کنم.'
    note: '*Je vous en prie* «خواهش می‌کنم»ِ رسمی‌تر است و با *vous* که با ناشناس به کار می‌رود جور است؛ *De rien* شکل کمتر رسمی و روزمره است.'
