course:
  title: فرانسوی A1
  description: 'جاهای معمول یک محله و پرسیدن/دادن آدرس ساده (en face de, à côté de, près de, loin de)، در ادامهٔ گشتن ماتیو به دنبال دواخانه نزدیک کارگاه. نکتهٔ مهم: همهٔ این عبارت‌های مکانی به de ختم می‌شوند و de پیش از اسم مذکر یا جمع به du/des تبدیل می‌شود (du café, des arbres).'
