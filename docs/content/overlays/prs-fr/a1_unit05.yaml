teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: مرغ
    gloss: گوشت مرغ
    note: '*Poulet* مذکر است.'
    example_gloss: کمی گوشت مرغ می‌خواهم.
  fr.a1.unit05.lesson01.teach.poisson:
    title: ماهی
    gloss: ماهی
    note: '*Poisson* مذکر است.'
    example_gloss: ماهی امروز تازه است.
  fr.a1.unit05.lesson01.teach.salade:
    title: سلاد
    gloss: سالاد
    note: '*Salade* مؤنث است.'
    example_gloss: او سلاد می‌خورد.
  fr.a1.unit05.lesson01.teach.riz:
    title: برنج
    gloss: برنج
    note: '*Riz* مذکر است و شکلش تغییر نمی‌کند (مفرد و جمع آن یکسان نوشته می‌شود، مثل *prix*).'
    example_gloss: برنج با مرغ خوب می‌آید.
  fr.a1.unit05.lesson01.teach.eau:
    title: آب
    gloss: آب
    note: '*Eau* مؤنث است؛ *l''* پیش از صدای واولش کوتاه می‌شود، مثل *l''addition* که بعداً در همین بخش می‌آید.'
    example_gloss: کمی آب می‌خواهم، لطفاً.
  fr.a1.unit05.lesson01.teach.vin:
    title: شراب
    gloss: شراب
    note: '*Vin* مذکر است.'
    example_gloss: شراب سرخ خوشمزه است.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: سفارش مرغ و سلاد
    gloss: مرغ و سلاد می‌خواهم.
    note: '*Du poulet* (مذکر) و *de la salade* (مؤنث) حرف‌های تعریف جزئی (به معنای «کمی») اند و با جنسیت اسم هماهنگ می‌شوند؛ اما بعد از مقدار (مثل *un kilo de*) فقط *de* ساده می‌آید.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: دسر
    note: '*Dessert* مذکر است.'
    example_gloss: دسر امروز رایگان است.
  fr.a1.unit05.lesson02.teach.addition:
    title: حساب
    gloss: بل؛ حساب
    note: '*Addition* مؤنث است؛ *l''* پیش از صدای واولش کوتاه می‌شود. این واژهٔ معمول رستورانت‌های فرانسه است، نه *facture* که صورت‌حساب رسمی است.'
    example_gloss: بل را بیاورید، لطفاً.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: پرسیدن آماده بودن سفارش
    gloss: انتخاب کردید؟
    note: سؤال معمول گارسون وقتی برای گرفتن سفارش پیش میز می‌آید؛ از زمان گذشتهٔ فعل *choisir* (انتخاب کردن) ساخته شده است.
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: سفارش قهوه
    gloss: یک قهوه می‌خواهم، لطفاً.
    note: '*Je voudrais* + چیز مورد نظر؛ همان ساختاری که در خرید به کار رفت، حالا برای غذا و نوشیدنی.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: پرسیدن از چیزهای موجود
    gloss: برای دسر چی دارید؟
    note: '*Qu''est-ce que vous avez comme...?* راه طبیعی و رایج برای پرسیدن از گزینه‌های یک دسته است.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: گفتن اینکه خوشمزه است
    gloss: خوشمزه است!
    note: واکنش پرشور و رایج به غذا؛ *délicieux* اینجا تغییر نمی‌کند، چون *c'est* با اسم دارای جنسیت نمی‌آید.
  fr.a1.unit05.lesson03.teach.line01:
    title: سلام و پرسیدن از سفارش
    gloss: گارسون سلام می‌دهد و می‌پرسد که سفارش‌شان را انتخاب کرده‌اند یا نه.
    note: با *Bonjour* شروع می‌شود که در برخورد با خدمات، شکل مؤدبانه است.
  fr.a1.unit05.lesson03.teach.line02:
    title: سفارش سلاد و آب
    gloss: اینس سلاد و آب سفارش می‌دهد.
    note: '*Je voudrais* را با *et* ترکیب می‌کند تا دو چیز سفارشی را در یک جمله وصل کند.'
  fr.a1.unit05.lesson03.teach.line03:
    title: سفارش مرغ با برنج
    gloss: ماتیو مرغ با برنج سفارش می‌دهد.
    note: '*Avec* (با) غذای اصلی را به همراهش وصل می‌کند؛ ساختار ساده و رایج سفارش.'
  fr.a1.unit05.lesson03.teach.line04:
    title: تأیید و پرسیدن از نوشیدنی
    gloss: گارسون سفارش را تأیید می‌کند و دربارهٔ نوشیدنی می‌پرسد.
    note: '*Et comme boisson pour vous ?* الگوی *comme* را از *Qu''est-ce que vous avez comme dessert ?* دوباره به کار می‌برد، این بار برای نوشیدنی.'
  fr.a1.unit05.lesson03.teach.line05:
    title: سفارش یک گیلاس شراب
    gloss: ماتیو یک گیلاس شراب سرخ سفارش می‌دهد.
    note: '*Un verre de* (یک گیلاس) راه معمول سفارش شراب گیلاسی است.'
  fr.a1.unit05.lesson03.teach.line06:
    title: واکنش به غذا
    gloss: اینس می‌گوید سلاد خوشمزه است.
    note: '*C''est délicieux !* دوباره می‌آید، این بار برای یک غذای مشخص (*cette salade*). *Délicieux* بعد از *c''est* مذکر می‌ماند، با اینکه *salade* مؤنث است؛ *Elle est délicieuse, cette salade !* شکل هماهنگ‌شدهٔ آن است.'
  fr.a1.unit05.lesson03.teach.line07:
    title: توضیح گرسنگی و خواستن بل
    gloss: ماتیو می‌گوید کارگاه آن‌ها را گرسنه کرده و بل می‌خواهد.
    note: '*Nous a donné faim* (لفظاً «گرسنگی به ما داد») راه طبیعی فرانسوی برای گفتن این است که چیزی کسی را گرسنه کرده است.'
  fr.a1.unit05.lesson03.teach.line08:
    title: تأیید آوردن بل
    gloss: گارسون می‌گوید همین حالا بل را می‌آورد.
    note: '*Tout de suite* (همین حالا) عبارت رایج و اطمینان‌بخش در برخورد با خدمات است.'
