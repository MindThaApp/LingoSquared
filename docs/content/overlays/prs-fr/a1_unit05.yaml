course:
  title: فرانسوی A1
  description: واژه‌های عام غذا و نوشیدنی و یک گفتگوی سفارش در کافه؛ داستان کارگاه آشپزی اینس و ماتیو بعد از درس در یک غذای مشترک ادامه می‌یابد. در این بخش به حرف تعریف جزئی du، de la و de l' توجه می‌شود که با نام‌های غذایی ناشمارا می‌آید؛ در دری چنین حرفی وجود ندارد و در فرانسوی باید آن را با نام غذا یاد گرفت.
