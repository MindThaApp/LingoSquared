teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: بازار
    gloss: بازار
    note: '*Marché* مذکر است.'
    example_gloss: بازار روزهای شنبه باز است.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: نانوایی
    gloss: نانوایی
    note: '*Boulangerie* مؤنث است؛ دکانی که مخصوص نان است و با *pâtisserie* (شیرینی‌فروشی) فرق دارد.'
    example_gloss: یک نانوایی خوب همین نزدیکی است.
  fr.a1.unit04.lesson01.teach.legumes:
    title: سبزی‌ها
    gloss: سبزی‌ها
    note: '*Légumes* مذکر جمع است.'
    example_gloss: من برای کارگاه سبزی تازه می‌خرم.
  fr.a1.unit04.lesson01.teach.fruits:
    title: میوه
    gloss: میوه
    note: '*Fruits* مذکر جمع است. در فرانسوی برای میوه به شکل کُلی اغلب صیغهٔ جمع (*les fruits*) به کار می‌رود.'
    example_gloss: میوه در این ماه گران است.
  fr.a1.unit04.lesson01.teach.prix:
    title: قیمت
    gloss: قیمت
    note: '*Prix* مذکر است و تغییر نمی‌کند؛ املای مفرد و جمعش یکی است.'
    example_gloss: قیمت نان چند است؟
  fr.a1.unit04.lesson01.teach.cher:
    title: گران
    gloss: گران
    note: '*Cher* شکل مذکر است؛ *chère* مؤنث و *chers*/*chères* جمع است و با اسمی که توصیف می‌کند مطابقت می‌کند.'
    example_gloss: این پنیر خیلی گران است.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: امروز گران نیست
    gloss: سبزی‌ها امروز گران نیستند.
    note: '*Pas cher(s)* (بدون *ne*) شیوهٔ رایج گفتاری برای ارزان بودن چیزی است؛ شکل کامل نوشتاری آن *ne sont pas chers* است.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: یک کیلو
    gloss: یک کیلو
    note: '*De* مستقیم بعد از مقدار می‌آید، بدون حرف تعریف؛ یادداشت دستوری *de after quantity* را در پایین ببینین.'
    example_gloss: یک کیلو بادرنگ‌رومی می‌خواهم.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: یک لیتر
    gloss: یک لیتر
    note: '*Litre* مذکر است و برای مایعات همان‌طور به کار می‌رود که *kilo* برای چیزهای جامد.'
    example_gloss: یک لیتر شیر، لطفاً.
  fr.a1.unit04.lesson02.teach.euro:
    title: یک یورو
    gloss: یک یورو
    note: '*Euro* به شکل منظم جمع بسته می‌شود: *deux euros*، *cinq euros*.'
    example_gloss: این پنج یورو تمام می‌شود.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De بعد از مقدار
    gloss: از / ـِ
    note: 'بعد از کلمهٔ مقدار (*un kilo*، *un litre*، *beaucoup*، مثل *beaucoup de cousins*) در فرانسوی فقط *de* می‌آید و *du*/*de la*/*des* کاملاً حذف می‌شود: *un kilo de tomates*، نه *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: پرسیدن قیمت
    gloss: قیمتش چند است؟
    note: '*Combien* (چند) با *ça coûte* (قیمتش است) شیوهٔ عمومی و همه‌منظوره برای پرسیدن قیمت است.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: پرسیدن قیمت یک چیز مشخص
    gloss: نان چند است؟
    note: '*C''est combien, [item] ?* چیز مشخصی را که قیمتش پرسیده می‌شود نام می‌برد و جایگزین رایج *Combien ça coûte ?* است.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: پرسیدن مجموع حساب
    gloss: روی هم چند می‌شود؟
    note: '*Ça fait combien ?* مجموع حساب را می‌پرسد، معمولاً در آخر خریداری، نه دربارهٔ یک چیز.'
  fr.a1.unit04.lesson03.teach.line01:
    title: سفارش بادرنگ‌رومی
    gloss: Inès به دکاندار سلام می‌دهد و یک کیلو بادرنگ‌رومی می‌خواهد.
    note: '*Bonjour* با الگوی *je voudrais* + مقدار یکجا شده است.'
  fr.a1.unit04.lesson03.teach.line02:
    title: پرسیدن این‌که چیز دیگری ضرورت است
    gloss: دکاندار قبول می‌کند و می‌پرسد چیز دیگری هم می‌خواهد یا نه.
    note: '*Autre chose ?* (چیز دیگر؟) سوال معمول دکاندار بعد از سفارش است.'
  fr.a1.unit04.lesson03.teach.line03:
    title: اضافه کردن پنیر و پرسیدن قیمتش
    gloss: Inès کمی پنیر هم می‌خواهد و قیمتش را می‌پرسد.
    note: '*Un peu de fromage* (کمی پنیر) همان الگوی *de* بدون حرف تعریف را دارد که *un kilo de* دارد.'
  fr.a1.unit04.lesson03.teach.line04:
    title: گفتن قیمت هر کیلو
    gloss: دکاندار می‌گوید کیلویش هشت یورو است.
    note: '*X euros le kilo* شیوهٔ طبیعی فرانسوی برای گفتن قیمت هر واحد است؛ در اینجا *le* معنی «برای هر» را دارد.'
  fr.a1.unit04.lesson03.teach.line05:
    title: توضیح اینکه چرا نان را از اینجا می‌خواهد
    gloss: Mathieu می‌گوید او هم نان می‌خواهد، ولی نانوایی امروز بسته است.
    note: '*Fermée* (بسته) شکل مؤنث است و با *la boulangerie* مطابقت می‌کند.'
  fr.a1.unit04.lesson03.teach.line06:
    title: پیشنهاد راه دیگر
    gloss: Inès او را مطمئن می‌کند که نان را از اینجا هم می‌شود خرید.
    note: '*On peut* (می‌شود / می‌توانیم) + مصدر شیوهٔ رایج و غیررسمی برای بیان امکان است.'
  fr.a1.unit04.lesson03.teach.line07:
    title: تأیید و گفتن مجموع حساب
    gloss: دکاندار تأیید می‌کند که نان تازه دارد، مجموع حساب را حساب می‌کند و می‌گوید سیزده یورو و پنجاه سنت.
    note: '*Ça fait combien en tout ?* در اینجا دکاندار با خودش حساب می‌کند، پیش از گفتن مجموع؛ واقعاً از Inès نمی‌پرسد.'
  fr.a1.unit04.lesson03.teach.line08:
    title: تشکر از فروشنده
    gloss: Inès هنگام پرداخت با گرمی از او تشکر می‌کند.
    note: '*Voilà* در اینجا هنگام دادن پول گفته می‌شود و کلمهٔ همراه با حرکت است.'
