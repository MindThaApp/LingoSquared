course:
  title: فرانسوی A1
  description: کلمات بازار، پرسیدن قیمت و مقدار با combien/kilo/litre، و تفاوت du/de la با de ساده بعد از عبارت‌های مقدار؛ ادامهٔ داستان کارگاه آشپزی Inès و Mathieu در یک صحنهٔ خرید از بازار. در فرانسوی بعد از مقدار مشخص، حرف تعریف جزئی کاملاً حذف می‌شود (un kilo de tomates، نه un kilo des tomates).
