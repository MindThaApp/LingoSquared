  fr.a1.unit12.lesson02.passe_compose_etre:
    title: ماضی نقلی با être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: ورکشاپ روز شنبهٔ گذشته
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: تیار کردم
    gloss: تیار کردم / ساختم
    note: 'فعل‌های باقاعدهٔ -ER صفت فعلی ماضی نقلی را با *-é* می‌سازند: *préparer* ← *préparé*، همراه با *avoir*.'
    example_gloss: برای ورکشاپ یک کیک ساختم.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: خریدم
    gloss: خریدم
    note: '*Acheter* هم مثل *préparer* از الگوی *avoir* + *-é* پیروی می‌کند.'
    example_gloss: از بازار سبزی خریدم.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: فراموش کردم
    gloss: فراموش کردم
    note: '*Oublier* ← *oublié*، دوباره همان الگوی باقاعده.'
    example_gloss: کوچه را در خانه فراموش کردم!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: خوشت آمد
    gloss: خوشت آمد
    note: '*Tu as* + صفت فعلی، شکل *tu* همین ساختار *avoir* است.'
    example_gloss: کیک خوشت آمد؟
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: چشید
    gloss: چشید
    note: '*Il a* + صفت فعلی، شکل *il* است؛ فعل کمکی *avoir* با فاعل تغییر می‌کند ولی صفت فعلی همان می‌ماند.'
    example_gloss: ماتیو ماست را چشید.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + صفت فعلی ماضی
    gloss: avoir + صفت فعلی ماضی (-é)
    note: بیشتر فعل‌های فرانسوی ماضی نقلی را با فعل کمکی *avoir* می‌سازند و بعد از آن صفت فعلی می‌آید که در فعل‌های باقاعدهٔ -ER به *-é* ختم می‌شود.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: هفتهٔ گذشته
    gloss: هفتهٔ گذشته
    note: '*Dernière* (گذشته) با *semaine* که مؤنث است هماهنگ می‌شود؛ شکل مذکر آن *dernier* است، مثل *samedi dernier* (شنبهٔ گذشته).'
    example_gloss: هفتهٔ گذشته یک کیک ساختم.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: رسیدم
    gloss: رسیدم
    note: '*Arriver* یکی از فعل‌های کمی (بیشتر فعل‌های حرکت) است که به‌جای *avoir* با *être* می‌آید.'
    example_gloss: دیر به ورکشاپ رسیدم.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: رفتم
    gloss: رفتم
    note: '*Aller* هم با *être* می‌آید. صفت فعلی با فاعل هماهنگ می‌شود: *allé* (مذکر) یا *allée* (مؤنث، مثل گفتهٔ اینس).'
    example_gloss: پیش از ورکشاپ به بازار رفتم.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: ماند
    gloss: ماند
    note: '*Rester* (ماندن) فعل دیگری است که با *être* می‌آید و همین الگوی هماهنگی را دارد.'
    example_gloss: ماتیو ماند تا آشپزخانه را پاک کند.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: هماهنگی être + صفت فعلی ماضی
    gloss: être + صفت فعلی ماضی (با فاعل هماهنگ می‌شود)
    note: در فعل‌هایی که با *être* می‌آیند، صفت فعلی در جنس و تعداد با فاعل هماهنگ می‌شود؛ برخلاف فعل‌هایی که با *avoir* می‌آیند.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: دیر
    gloss: دیر
    note: '*En retard* یعنی بعد از وقت مقرر رسیدن؛ همراه همیشگی *arriver*.'
    example_gloss: بس دیر رسید.
  fr.a1.unit12.lesson02.teach.finalement:
    title: آخر / در نهایت
    gloss: آخر / در نهایت
    note: '*Finalement* یک قصهٔ کوتاه را جمع‌بندی می‌کند و نتیجهٔ آخر را بعد از مشکلات پیشین نشان می‌دهد.'
    example_gloss: آخر، کیک خوش‌مزه بود.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: چه اتفاق افتاد؟
    gloss: چه اتفاق افتاد؟
    note: '*Qu''est-ce qui s''est passé ?* راه معمول پرسیدن «چه اتفاق افتاد؟» است.'
    example_gloss: در ورکشاپ چه اتفاق افتاد؟
  fr.a1.unit12.lesson03.teach.line01:
    title: بپرس چه اتفاق افتاد
    gloss: اینس می‌پرسد در ورکشاپ شنبهٔ گذشته چه اتفاق افتاد؛ او نتوانست بیاید.
    note: '*Qu''est-ce qui s''est passé ?* (چه اتفاق افتاد؟) راه معمول پرسیدن دربارهٔ یک رویداد گذشته است.'
  fr.a1.unit12.lesson03.teach.line02:
    title: اتفاق بد را تعریف کن
    gloss: ماتیو می‌گوید وای، دیر رسید و کوچه را در خانه فراموش کرد!
    note: 'دو شکل ماضی نقلی در یک جمله: با *être* (*je suis arrivé*) و با *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: بپرس چه کرد
    gloss: اینس می‌پرسد بعد از آن چه کرد.
    note: '*Qu''est-ce que tu as fait ?* (چه کردی؟) ماضی نقلی بی‌قاعدهٔ *faire* را دارد.'
  fr.a1.unit12.lesson03.teach.line04:
    title: چاره را بیان کن
    gloss: ماتیو می‌گوید زود به دوکان سرکوچه رفت.
    note: '*L''épicerie du coin* (دوکان سرکوچه) از *coin* می‌آید، مثل *au coin de la rue*.'
  fr.a1.unit12.lesson03.teach.line05:
    title: بپرس نتیجه داد یا نه
    gloss: اینس می‌پرسد آیا آنجا کوچه پیدا کرد.
    note: '*Tu as trouvé... ?* (پیدا کردی... ؟) سوال باقاعدهٔ دیگری با *avoir* است.'
  fr.a1.unit12.lesson03.teach.line06:
    title: پایان خوش را بگو
    gloss: ماتیو می‌گوید بلی، و در آخر کیک خوش‌مزه بود!
    note: قصه را با *finalement* به شکل خوش تمام می‌کند و مشکل پیشین را حل‌شده نشان می‌دهد.
