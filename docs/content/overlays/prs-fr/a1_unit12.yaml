course:
  title: فرانسوی A1
  description: 'بیان کوتاه یک رویداد تازهٔ تمام‌شده با ماضی نقلی (passé composé) با هر دو فعل کمکی avoir و être؛ ادامهٔ قصهٔ ورکشاپ آشپزی اینس و ماتیو، وقتی ماتیو از یک اتفاق بد در جلسهٔ روز شنبهٔ گذشته تعریف می‌کند. در فرانسوی دو فعل کمکی مختلف وجود دارد: avoir برای بیشتر فعل‌ها و être برای تعداد کمی از فعل‌ها مثل aller، arriver و rester. صفت فعلی فعل‌هایی که با être می‌آیند با جنس فاعل هماهنگ می‌شود (arrivé / arrivée).'
units:
  fr.a1.unit12.past_events:
    title: چه اتفاق افتاد؟
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
