teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: ساعت؛ وقت
    gloss: ساعت؛ وقت
    note: '*Heure* مؤنث است؛ برای گفتن وقت ساعت هم به کار می‌رود (*dix heures* = ساعت ده).'
    example_gloss: ساعت چند است؟
  fr.a1.unit06.lesson01.teach.matin:
    title: صبح
    gloss: صبح
    note: '*Matin* مذکر است.'
    example_gloss: بازار در وقت صبح باز است.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: بعد از ظهر
    gloss: بعد از ظهر
    note: '*Après-midi* می‌تواند مذکر یا مؤنث باشد (مذکر رایج‌تر است)؛ *l''* پیش از صدای مصوتِ آن حذف می‌شود و کوتاه می‌گردد.'
    example_gloss: من بعدازظهر کار می‌کنم.
  fr.a1.unit06.lesson01.teach.soir:
    title: شام (شب)
    gloss: شام (شب)
    note: '*Soir* مذکر است.'
    example_gloss: کارگاه آشپزی شب‌هنگام است.
  fr.a1.unit06.lesson01.teach.midi:
    title: ظهر
    gloss: چاشت
    note: '*Midi* وقتی برای گفتن وقت به کار می‌رود، حرف تعریف نمی‌گیرد (*à midi*، نه *au midi*).'
    example_gloss: ما ظهر چاشت می‌خوریم.
  fr.a1.unit06.lesson01.teach.minuit:
    title: نیمه‌شب
    gloss: نیمه‌شب
    note: '*Minuit* هم مثل *midi* حرف تعریف نمی‌گیرد.'
    example_gloss: کارگاه هرگز تا بعد از نیمه‌شب نمی‌کشد.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: بگو کارگاه کی است
    gloss: کارگاه شب شروع می‌شود، نه صبح.
    note: '*le soir* و *le matin* را مستقیم در برابر هم می‌گذارد و هر دو واژه از لغات همین درس است.'
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: پرسیدن وقت
    gloss: ساعت چند است؟
    note: '*Quelle heure est-il ?* شیوهٔ معمول و همه‌منظوره برای پرسیدن وقت است؛ در *-il* ضمیر بعد از فعل آمده و نشانهٔ سوالی بودن جمله است.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: گفتن ساعت
    gloss: ساعت ده است.
    note: '*Il est* + عدد + *heures* الگوی پایه برای گفتن هر ساعت است؛ *heures* جمع می‌ماند، به جز *une heure* (ساعت یک).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: گفتن ربع گذشته
    gloss: ساعت ده و ربع است.
    note: '*Et quart* (و ربع) پانزده دقیقه به ساعت گفته‌شده اضافه می‌کند.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: گفتن نیم ساعت
    gloss: ساعت ده و نیم است.
    note: '*Et demie* (و نیم) سی دقیقه اضافه می‌کند؛ *demie* با *heure* مطابقت می‌کند و -e مؤنث می‌گیرد.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: گفتن ربع کم
    gloss: ربع کم یازده است.
    note: '*Moins le quart* (منفی ربع) از ساعت بعدی به عقب می‌شمارد، نه از ساعت فعلی؛ این را خوب به یاد داشته باشین.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: پرسیدن وقت شروع چیزی
    gloss: کارگاه چه وقت شروع می‌شود؟
    note: '*À quelle heure ?* (ساعت چند) برای پرسیدن از رویداد برنامه‌ریزی‌شده به کار می‌رود و با پرسش عمومی *Quelle heure est-il ?* فرق دارد.'
  fr.a1.unit06.lesson03.teach.line01:
    title: پرسیدن وقت شروع هفتهٔ آینده
    gloss: اینس می‌پرسد کارگاه هفتهٔ آینده ساعت چند است.
    note: '*La semaine prochaine* (هفتهٔ آینده) با الگوی پرسش *à quelle heure* در همین درس یکجا آمده است.'
  fr.a1.unit06.lesson03.teach.line02:
    title: گفتن وقت شروع
    gloss: ماتیو می‌گوید گمانم ساعت هجده و سی (شش و نیم شام) شروع می‌شود.
    note: '*Dix-huit heures trente* از شیوهٔ ۲۴ ساعته استفاده می‌کند که در برنامه‌ریزی فرانسوی رایج است و با شکل‌های غیررسمی مثل *et demie* فرق دارد.'
  fr.a1.unit06.lesson03.teach.line03:
    title: تأیید کردن شب بودن
    gloss: 'اینس مطمئن می‌شود: شب است، نه صبح؟'
    note: یک پرسش کوتاه برای تأیید که *le soir* و *le matin* را در برابر هم می‌گذارد.
  fr.a1.unit06.lesson03.teach.line04:
    title: تأیید و توضیح دلیل
    gloss: ماتیو تأیید می‌کند که شب است و بعد از کار راحت‌تر است.
    note: '*Après le travail* (بعد از کار) یک دلیل ساده و عملی می‌دهد.'
  fr.a1.unit06.lesson03.teach.line05:
    title: پرسیدن وقت ختم
    gloss: اینس می‌پرسد ساعت چند ختم می‌شود.
    note: '*Finit* (ختم می‌شود) درست در برابر *commence* (شروع می‌شود) در سطر دوم قرار دارد.'
  fr.a1.unit06.lesson03.teach.line06:
    title: گفتن وقت ختم
    gloss: ماتیو می‌گوید حدود ساعت بیست و پانزده (هشت و ربع شب)، مثل همیشه.
    note: '*Vers* (حدود) وقت تقریبی را نشان می‌دهد و از *à* که وقت دقیق می‌گوید نرم‌تر است.'
  fr.a1.unit06.lesson03.teach.line07:
    title: تأیید برنامه
    gloss: 'اینس تأیید می‌کند: هفتهٔ آینده ساعت هجده و سی می‌بینیم!'
    note: گفتگو را با تکرار وقتِ تأییدشده ختم می‌کند؛ در فرانسوی راه طبیعی برای تأیید کردن یک برنامه است.
