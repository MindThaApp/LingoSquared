course:
  title: فرانسوی A1
  description: بخش‌های روز و گفتن وقت ساعت (heure(s)، et quart، et demie، moins le quart)، و ادامهٔ قصهٔ کارگاه آشپزی اینس و ماتیو تا برنامه‌ریزی نشست بعدی‌شان. در فرانسوی در موقعیت‌های رسمی و برنامه‌ریزی از ساعت ۲۴ ساعته استفاده می‌شود (dix-huit heures trente) و در کنار آن شکل‌های غیررسمی ۱۲ ساعته‌ای که قبلاً در این بخش خواندید هم کار می‌رود.
units:
  fr.a1.unit06.time:
    title: ساعت چند است؟
