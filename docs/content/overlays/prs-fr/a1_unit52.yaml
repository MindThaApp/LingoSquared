  description: 'فرانسوی مقدماتی برای توصیف فعالیت‌های وقت فراغت: لغات سرگرمی‌ها، عبارت‌های تکرار، پرسیدن و جواب دادن اینکه کسی در وقت فراغتش چه می‌کند، و مقایسهٔ سرگرمی‌های دو نفر.'
