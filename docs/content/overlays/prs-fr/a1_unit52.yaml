teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *lire* (خواندن)، *faire du sport* (ورزش کردن) و *cuisiner* (آشپزی کردن).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Temps libre* مذکر است: *le temps libre*. این عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌ها است.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Lis* شکل *je* فعل *lire* (خواندن) است؛ *s* آخر تلفظ نمی‌شود.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *écouter de la musique*، *dessiner* و *jouer aux jeux vidéo*. با بازی‌ها، *jouer à* + *les* به *jouer aux* تبدیل می‌شود.'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*Écouter* مفعولش را مستقیم و بدون کلمهٔ اضافی می‌گیرد: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*Avec des amis* (با دوستان) کلمهٔ *amis* را از درس اول دوباره به کار می‌برد؛ *des* جمع «چند تا» است.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: چهار قید تکرار اصلی. *Souvent* شاید قبلاً آشنا باشد؛ *toujours*، *parfois* و *jamais* تازه‌اند. *Jamais* پیش از فعل به *ne* نیاز دارد.
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Chaque semaine* و *chaque week-end* هر دو یعنی «هر». *Chaque* هرگز تغییر نمی‌کند، جنس اسم هرچه باشد.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque هرگز تغییر نمی‌کند
    gloss: '*Chaque* پیش از اسم‌های مذکر و مؤنث یکسان می‌ماند: *chaque semaine*، *chaque week-end*.'
    note: '*Semaine* مؤنث و *week-end* مذکر است، اما *chaque* برای هر دو یکسان است. با *tous les* / *toutes les* مقایسه کنید که تغییر می‌کند.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: کامیل صحبت سرگرمی‌ها را پیش می‌کشد
    gloss: 'کامیل: ما اغلب باهم قدم می‌زنیم. اما تو در وقت فراغتت دیگر چه می‌کنی، ماتیو؟'
    note: '*On se promène souvent* برای «ما» از *on* استفاده می‌کند و *souvent* درست بعد از فعل می‌آید.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: سرگرمی‌های ماتیو
    gloss: 'ماتیو: آشپزی را دوست دارم، در خانه هم. و اغلب ورزش می‌کنم.'
    note: '*Même à la maison* (حتی در خانه) روشن می‌کند که ماتیو برای تفریح آشپزی می‌کند، نه فقط در کارش.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: کامیل تعجب می‌کند
    gloss: 'کامیل: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کار آشپزی می‌کنی!'
    note: '*Toute la journée* (تمام روز) تأکید می‌کند که ماتیو در کارش چقدر آشپزی می‌کند.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: ماتیو توضیح می‌دهد
    gloss: 'ماتیو: بلی، ولی آشپزی را من آرامش‌بخش می‌دانم. و تو، چه کاری را دوست داری؟'
    note: '*Cuisiner, je trouve ça relaxant* برای تأکید *cuisiner* را اول می‌آورد: لفظ به لفظ «آشپزی، آن را آرامش‌بخش می‌دانم».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: سرگرمی‌های کامیل
    gloss: 'Camille: من خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم.'
    note: در یک جمله با *et* (و) دو سرگرمی درس‌های ۱ و ۲ را یکجا می‌آورد.
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu دربارهٔ بازی‌های ویدیویی می‌پرسد
    gloss: 'Mathieu: تو هم بازی ویدیویی می‌کنی؟'
    note: 'یک سوال کوتاه بلی/نخیر: *Tu joues aussi aux jeux vidéo ?* بلند شدن آهنگ صدا آن را سوال می‌سازد.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille جواب می‌دهد
    gloss: 'Camille: نخیر، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کنم!'
    note: '*Jamais* (هیچ‌وقت) و *parfois* (گاهی) از درس ۳، که در یک جواب در برابر هم آمده‌اند.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: مقایسهٔ سرگرمی‌ها
    gloss: Mathieu و من اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. Mathieu پخت‌وپز را دوست دارد، حتی در خانه، و زیاد ورزش می‌کند. من خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم. گاهی نقاشی می‌کنم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو در وقت فراغتت چه کار کردن را دوست داری؟
    note: پیام Camille معلومات درس ۴ را خلاصه می‌کند و با سوال اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      promène: قدم می‌زنیم
      souvent: اکثراً
      ensemble: با هم
      d'autres: دیگر
      cuisiner: آشپزی می‌کند
      aime: دوست دارد
      maison: در خانه
      sport: ورزش می‌کند
      lire: خواندن
      j'écoute: گوش می‌کنم
      musique: موسیقی
      dessine: نقاشی می‌کنم
      parfois: گاهی
      jeux: ویدیوگیم بازی می‌کنی
      jamais: هرگز
      libre: آزاد
      temps: وقت
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu دربارهٔ آخر هفته می‌پرسد
    gloss: 'Mathieu: این آخر هفته چه کار می‌کنی؟'
    note: در *Ce week-end* (این آخر هفته) چون *week-end* مذکر است، *ce* می‌آید.
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille مردد است
    gloss: 'Camille: هنوز نمی‌دانم. خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*Sortir* (بیرون رفتن) راه معمول گفتن این است که می‌خواهین از خانه بیرون شوین.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu یک پیشنهاد می‌دهد
    gloss: 'Mathieu: با هم قدم بزنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: '*Après* (بعدش) دو برنامه را پشت سر هم می‌آورد، مثل *d''abord* و *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille موافقت می‌کند
    gloss: 'Camille: فکر خوبی است! هم قدم زدن را دوست دارم، هم آشپزی را.'
    note: '*Autant ... que* (به اندازهٔ ...) نشان می‌دهد Camille دو کار را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu تأیید می‌کند
    gloss: 'Mathieu: عالی. پس شنبه می‌بینمت!'
    note: یک جملهٔ دوستانهٔ پایانی که برنامه برای *samedi* (شنبه) را تأیید می‌کند.
