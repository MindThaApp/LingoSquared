    pairs:
    - left: wysoki
      right: قدبلند
    - left: niski
      right: قدکوتاه
    - left: stary
      right: پیر
    - left: młody
      right: جوان
    - left: Kasia jest wysoka.
      right: Kasia قد بلند است.
    - left: Tomek jest niski.
      right: Tomek قد کوتاه است.
    - left: Dziadek jest stary.
      right: بابه کلان پیر است.
  pl.a1.unit25.lesson01.exercise04.order_kasia_jest_wysoka:
    instruction: کلمه‌ها را طوری مرتب کنید که بگویین «Kasia قدبلند است و Tomek قدکوتاه است.»
    correct_option: Kasia jest wysoka a Tomek jest niski
    accepted_answers:
    - value: Kasia jest wysoka a Tomek jest niski
      status: correct
    feedback: Kasia jest wysoka, a Tomek jest niski.
  pl.a1.unit25.lesson01.exercise05.listen_dziadek_jest_stary:
    instruction: گوش کنید و کلمه‌ها را به ترتیبی که می‌شنوید بچینید.
    correct_option: Dziadek jest stary
    accepted_answers:
    - value: Dziadek jest stary
      status: correct
    feedback: 'جمله‌ی کامل این است: Dziadek jest stary.'
  pl.a1.unit25.lesson01.exercise06.translate_mlody:
    instruction: 'به لهستانی ترجمه کنید: جوان.'
    accepted_answers:
    - value: młody
      status: correct
    feedback: Młody یعنی جوان.
    prompt_blocks:
    - جوان
  pl.a1.unit25.lesson02.exercise01.choose_ewa_ma_dlugie:
    instruction: معنی درست جمله‌ی 'Ewa ma długie blond włosy.' را انتخاب کنید.
    correct_option: Ewa موهای بلند بلوند دارد.
    distractors:
    - Ewa موهای سیاه کوتاه دارد.
    - Ewa موهای قهوه‌یی بلند دارد.
    - Ewa موهای خاکستری دارد.
    accepted_answers:
    - value: Ewa موهای بلند بلوند دارد.
      status: correct
    feedback: Ewa ma długie blond włosy.
  pl.a1.unit25.lesson02.exercise02.listen_marek_ma_krotkie:
    instruction: گوش کنید و آنچه را که گوینده می‌گوید انتخاب کنید.
    correct_option: Marek موهای کوتاه سیاه دارد.
    distractors:
    - Marek موهای سیاه بلند دارد.
    - Marek موهای قهوه‌یی کوتاه دارد.
