teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Wysoki* برای شخص قدبلند و *niski* برای شخص قدکوتاه است. برای زن *wysoka* یا *niska* گفته می‌شود.'
    example_gloss:
    - Kasia قد بلند است.
    - Tomek قد کوتاه است.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Stary* و *młody* در اینجا یک تصور کلی را می‌رسانند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - بابه کلان پیر است.
    - Marek جوان است.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: تصور کلی یا سن'
    gloss: '*Stary* یک تصور کلی را می‌رساند، مثل *Dziadek jest stary*. برای گفتن سن دقیق، لهستانی ساختار دیگری دارد: *Ile masz lat?*'
    note: اینکه کسی پیر یا جوان معلوم می‌شود را با *stary* یا *młody* می‌گویید؛ برای سن دقیق می‌پرسید *Ile masz lat?* و جواب می‌تین *mam ... lat* (من ... ساله استم).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia قد بلند است و Tomek قد کوتاه
    gloss: Kasia قد بلند است و Tomek قد کوتاه.
    note: یک جمله‌ی ساده‌ی ترکیبی با *a* (و، به معنی تضاد). *Wysoka* و *niski* با فاعل مؤنث و مذکر هماهنگ می‌شوند و زمینه را برای مقایسه در درس پنجم آماده می‌کنند.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: مو
    gloss: مو
    note: '*Włosy* در لهستانی همیشه جمع است: *długie włosy* (موهای بلند).'
    example_gloss: Marek موهای کوتاه سیاه دارد.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: سه رنگ مو. *Blond* هیچ‌وقت تغییر نمی‌کند؛ *brązowe* و *siwe* شکل جمع اند تا با *włosy* هماهنگ شوند.
    example_gloss:
    - Ewa موهای بلوند دارد.
    - Tomek موهای قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Długie* (بلند) و *krótkie* (کوتاه) شکل جمع اند تا با *włosy* هماهنگ شوند.'
    example_gloss:
    - Kasia موهای بلند دارد.
    - Tomek موهای کوتاه دارد.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy صفت جمع می‌گیرد
    gloss: '*Włosy* جمع است، پس صفت هم جمع می‌شود: موهای بلند، موهای کوتاه، موهای قهوه‌یی، موهای سیاه.'
    note: 'اسم‌های جمع که مذکرِ انسان نیستند، صفتی با پایان *-e* می‌گیرند: *długie włosy*. *Blond* استثنا است: هیچ‌وقت تغییر نمی‌کند (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: همیشه جمع'
    gloss: '*Włosy* (مو) همیشه جمع است: *jej włosy są długie* (موهای او بلند است؛ در لهستانی فعل و صفت جمع می‌آیند). *Jej* یعنی «مال او (زن)».'
    note: مو در لهستانی اسم جمع است، پس فعل و صفت هم به شکل جمع می‌آیند. *Jej* («مال او (زن)») هرقدر هم چیزهای او زیاد باشد، تغییر نمی‌کند.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek موهای کوتاه سیاه دارد
    gloss: Marek موهای کوتاه سیاه دارد.
    note: '*Czarne* (سیاه) شکل جمع است تا با *włosy* هماهنگ شود.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa موهای بلند بلوند دارد
    gloss: Ewa موهای بلند بلوند دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  pl.a1.unit25.lesson03.teach.oczy:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Oczy* جمع *oko* است؛ لهستانی معمولاً از هر دو چشم به شکل جمع حرف می‌زند.'
    example_gloss: Marek چشم‌های قهوه‌یی دارد.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: 'سه رنگ چشم، به شکل جمع تا با *oczy* هماهنگ شوند: *niebieskie*، *brązowe*، *zielone*.'
    example_gloss:
    - Ewa چشم‌های آبی دارد.
    - Tomek چشم‌های قهوه‌یی دارد.
    - Kasia چشم‌های سبز دارد.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy پایان -e می‌گیرد
    gloss: '*Oczy* جمع است، پس صفت به *-e* ختم می‌شود: چشم‌های آبی، چشم‌های قهوه‌یی، چشم‌های سبز.'
    note: 'همان پایان جمع که در درس دوم با *włosy* داشتیم: *niebieskie oczy*، *brązowe oczy*، *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Ewa چه شکلی است؟
    gloss: Ewa چه شکلی است؟
    note: '*Jak wygląda ...?* سوال اصلی این بخش است؛ برای پرسیدن از ظاهر هر کسی از آن کار بگیرین.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa موهای بلند بلوند و چشم‌های آبی دارد
    gloss: Ewa موهای بلند بلوند و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *i* (و) در یک جمله جمع می‌کند.
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa، Nina را معرفی می‌کند
    gloss: 'Ewa: یک دختر نو به کافه‌ی زبان می‌آید. نامش Nina است.'
    note: '*Przychodzi* (می‌آید) کسی تازه را به صحنه معرفی می‌کند؛ *do kawiarni językowej* از *do* همراه با حالت ملکی کار می‌گیرد.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek می‌پرسد او چه شکلی است
    gloss: 'Marek: خوب! او چه شکلی است؟'
    note: سوال اصلی این بخش دوباره می‌آید، این بار با *ona* (او، زن) به جای نام.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa قد و موهای Nina را توصیف می‌کند
    gloss: 'Ewa: قدش کوتاه است و موهای کوتاه بلوند دارد.'
    note: '*Niska* (شکل مؤنث *niski*) از درس اول را با واژه‌های مو از درس دوم ترکیب می‌کند.'
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek درباره‌ی چشم‌هایش می‌پرسد
    gloss: 'Marek: و چشم‌هایش؟'
    note: '*Jej* در اینجا ضمیر ملکی «مال او (زن)» است، پس *jej oczy* یعنی «چشم‌های او»؛ *jej* هیچ‌وقت تغییر نمی‌کند.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa چشم‌های Nina را توصیف می‌کند
    gloss: 'Ewa: چشم‌های سبز دارد.'
    note: '*Zielone oczy* از درس سوم دوباره می‌آید.'
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek او را می‌شناسد
    gloss: 'Marek: تشکر! پس او را می‌شناسم.'
    note: '*Rozpoznam* آینده‌ی کامل است («خواهم شناخت»)؛ *ją* حالت مفعولی *ona* (او، زن) است.'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: مقایسه‌ی Tomek و Kasia
    gloss: Tomek و Kasia برادر و خواهر اند، اما شکل شان فرق دارد. Tomek قد کوتاه دارد، موهای کوتاه قهوه‌یی و چشم‌های قهوه‌یی. Kasia از Tomek قدبلندتر است و موهای بلند قهوه‌یی و چشم‌های سبز دارد. تو چه شکلی استی؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      brat: برادر
      siostra: خواهر
      wyglądają: ظاهر شدن، به نظر آمدن
      inaczej: فرق دار
      niski: قدکوتاه
      krótkie: قدکوتاه
      brązowe: قهوه‌یی
      włosy: مو
      oczy: چشم‌ها
      wyższa: قدبلندتر
      długie: دراز
      zielone: سبز
      wyglądasz: تو چه شکلی استی (خودمانی)، یعنی ظاهر کسی چطور است
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: استفاده‌ی دوباره از صفت تفضیلی
    gloss: 'صفت تفضیلی: *wysoki* (قدبلند) می‌شود *wyższy* (قدبلندتر) و شخص دیگر بعد از *niż* (از) می‌آید: Kasia از Tomek قدبلندتر است.'
    note: 'لهستانی صفت تفضیلی را با تغییر پایان صفت می‌سازد و باز هم با جنسیت هماهنگ می‌شود: برای Kasia (مؤنث) *wyższa*.'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: موهای Kasia از موهای Tomek بلندتر است
    gloss: موهای Kasia از موهای Tomek بلندتر است.
    note: '*Dłuższe* (بلندتر) جمع است تا با *włosy* هماهنگ شود و *niż* (از) مقایسه را معرفی می‌کند.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جمله‌ی نمونه با *Mam ...* که وقتی ظاهر خودتان را توصیف می‌کنین می‌توانین از آن استفاده کنید.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek، Nina را می‌بیند
    gloss: 'Marek: ببین، این Nina است؟ موهای بور کوتاه و چشم‌های سبز دارد.'
    note: '*Patrz* (ببین) شکل امری *patrzeć* است. *Czy to Nina?* یعنی «این Nina است؟»'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa تأیید می‌کند
    gloss: 'Ewa: بلی، این Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina به Marek سلام می‌دهد
    gloss: 'Nina: سلام، تو Marek استی؟'
    note: 'یک سوال ساده‌ی سلام و احوالپرسی غیررسمی. بعد از *być*، نام در حالت ابزاری می‌آید: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek جواب سلام Nina را می‌دهد
    gloss: 'Marek: بلی! از آشنایی با تو خوش شدم، Nina.'
    note: '*Miło cię poznać* عبارت معمول برای اولین دیدار است («از آشنایی خوش شدم»؛ *poznać* یعنی «آشنا شدن»). Nina با حالت ندایی صدا زده شده: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را ختم می‌کند — Marek، Nina را از روی توصیف قبلی Ewa درست شناخت.
exercises:
  pl.a1.unit25.lesson01.exercise01.choose_kasia_jest_wysoka:
    instruction: معنی درست جمله‌ی 'Kasia jest wysoka.' را انتخاب کنید.
    correct_option: Kasia قد بلند است.
    distractors:
    - Kasia قدکوتاه است.
    - Kasia پیر است.
    - Kasia جوان است.
    accepted_answers:
    - value: Kasia قد بلند است.
      status: correct
    feedback: Kasia jest wysoka.
  pl.a1.unit25.lesson01.exercise02.listen_tomek_jest_niski:
    instruction: گوش کنید و آنچه را که گوینده می‌گوید انتخاب کنید.
    correct_option: Tomek قد کوتاه است.
    distractors:
    - Tomek قدبلند است.
    - Tomek پیر است.
    - Tomek جوان است.
    accepted_answers:
    - value: Tomek قد کوتاه است.
      status: correct
    feedback: Tomek jest niski.
  pl.a1.unit25.lesson01.exercise03.match_wysoki_niski_stary:
