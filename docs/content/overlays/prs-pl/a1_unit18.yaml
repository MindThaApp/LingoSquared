teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: خانه، است، دارد -- دوباره
    gloss: Dom, jest, ma, Marek, Ewa -- این کلمه‌ها را از درس‌های قبلی می‌شناسی، مثلاً Dom jest tam (خانه آنجاست).
    note: یک یادآوری کوتاه، پیش از اینکه این درس از آنها برای صحبت دربارهٔ خانهٔ تو استفاده کند.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: آپارتمان
    gloss: اپارتمان
    note: یک منزل در ساختمان، نه یک خانهٔ کامل.
    example_gloss: ایوا یک آپارتمان دارد.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: بزرگ
    gloss: خانه بزرگ است. -- *duży* با اسم‌های مذکر مثل *dom* می‌خواند.
    note: این اولین بار در این کورس است که کلمه‌ای اندازه را توصیف می‌کند -- فعلاً فقط برای *dom* به کار می‌رود.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: خانهٔ مارک
    gloss: مارک یک خانه دارد. خانه بزرگ است.
    note: معلوماتی که تمام این بخش دربارهٔ مارک بر آن ساخته شده است.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: خانهٔ ایوا
    gloss: ایوا یک آپارتمان دارد.
    note: معلوماتی که تمام این بخش دربارهٔ ایوا بر آن ساخته شده است.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: اتاق
    gloss: اتاق
    note: یک کلمهٔ عمومی برای هر اتاق در خانه.
    example_gloss: اتاق کجاست؟
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: چند اتاق؟
    gloss: چند اتاق داری؟ من دو اتاق دارم. -- Ile، عددها و mam/masz را از درس‌های قبلی می‌شناسی؛ *pokoi* و *pokoje* شکل‌های کلمهٔ *pokój* استند.
    note: '*Pokoi* درست بعد از *Ile* می‌آید؛ *pokoje* درست بعد از *dwa*، *trzy* یا *cztery* (دو، سه، چهار) می‌آید.'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: چند اتاق داری؟
    gloss: چند اتاق داری؟
    note: یک سوال معمول دربارهٔ خانهٔ کسی.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: من دو اتاق دارم
    gloss: من دو اتاق دارم.
    note: یک جواب معمول برای سوال بالا.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: آشپزخانه
    gloss: آشپزخانه
    note: یکی از معمول‌ترین اتاق‌های خانه.
    example_gloss: آشپزخانه کوچک است.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: کوچک
    gloss: آشپزخانه کوچک است. -- *mała* با اسم‌های مؤنث مثل *kuchnia* می‌خواند.
    note: این کلمه جدا از *duży* (بزرگ) است -- فعلاً فقط برای *kuchnia* به کار می‌رود.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: اتاق خواب
    gloss: اتاق خواب
    note: اتاقی که در آن می‌خوابی.
    example_gloss: اتاق خواب کجاست؟
  pl.a1.unit18.lesson02.teach.lazienka:
    title: تشناب
    gloss: تشناب‌خانه
    note: اتاقی که دوش و تشناب دارد.
    example_gloss: تشناب کجاست؟
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: کجا، آنجا -- دوباره
    gloss: Gdzie, tam -- این کلمه‌ها را از درس‌های قبلی می‌شناسی، مثلاً Bank jest tam (بانک آنجاست).
    note: یک یادآوری کوتاه، پیش از اینکه این درس از آنها برای صحبت دربارهٔ اتاق‌ها استفاده کند.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: در اتاق، در آشپزخانه...
    gloss: 'W + اتاق، آشپزخانه، اتاق خواب، تشناب: w pokoju، w kuchni، w sypialni، w łazience -- مثل w szkole (در مکتب) یا w biurze (در دفتر).'
    note: همان فکری که در کلمه‌های جای کار آموختی -- ختم کلمه کمی تغییر می‌کند تا «در» آن اتاق را برساند.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: تشناب کجاست؟
    gloss: حمام کجاست؟ حمام آنجاست.
    note: یک گفتگوی طبیعی برای پیدا کردن اتاق در خانهٔ کسی.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: آشپزخانه کوچک است
    gloss: آشپزخانه کوچک است.
    note: دوباره از کلمهٔ اندازه که پیشتر در همین درس آمد استفاده می‌شود.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: بلی، و، استند -- دوباره
    gloss: Tak, i, są, A, ja, jeden -- این کلمه‌ها را از درس‌های قبلی می‌شناسی.
    note: یک یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: یخچال
    gloss: یخچال
    note: یکی از وسایل معمول آشپزخانه.
    example_gloss: در آشپزخانه یخچال است.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: اوون
    gloss: تنور
    note: یکی دیگر از وسایل معمول آشپزخانه.
    example_gloss: در آشپزخانه اوون است.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek خانهٔ خود را توضیح می‌دهد
    gloss: من خانه دارم. خانه بزرگ است.
    note: Marek گفتگو را با توضیح دادن خانهٔ خود شروع می‌کند.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa دربارهٔ اتاق‌ها می‌پرسد
    gloss: چند اتاق داری؟
    note: Ewa یک سؤال طبیعیِ بعدی می‌پرسد.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek جواب می‌دهد
    gloss: من دو اتاق دارم. خانه آشپزخانه، اتاق خواب و حمام دارد.
    note: Marek تعداد اتاق‌ها را می‌گوید و اتاق‌های خانهٔ خود را می‌شمارد.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa خانهٔ خود را توضیح می‌دهد
    gloss: و من اپارتمان دارم. من یک اتاق دارم.
    note: Ewa به توضیح دادن خانهٔ کوچک‌تر خودش می‌پردازد.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa دربارهٔ آشپزخانه می‌پرسد
    gloss: آشپزخانه کوچک است؟
    note: Ewa یک سؤال بعدی دربارهٔ آشپزخانهٔ Marek می‌پرسد.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek جواب می‌دهد
    gloss: بلی، آشپزخانه کوچک است. در آشپزخانه یخچال و اوون است.
    note: Marek کوچک بودن آشپزخانه را تأیید می‌کند و دو چیز آن را نام می‌برد.
