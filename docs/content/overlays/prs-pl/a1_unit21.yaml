teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: خوش، غمگین و خشمگین
    gloss: خوش، غمگین، خشمگین
    note: سه کلمهٔ اساسی احساس که با *jestem* (استم) به کار می‌روند. این‌ها شکل مذکر استند؛ یک زن می‌گوید *szczęśliwa, smutna, zła*.
    example_gloss:
    - من خوش استم.
    - من غمگین استم.
    - من خشمگین هستم.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: گفتن اینکه خوش استی
    gloss: من خوش استم.
    note: 'الگوی اصلی: *jestem* (استم، از *być*) + صفت. صفت با گوینده مطابقت می‌کند: *szczęśliwy* (مرد)، *szczęśliwa* (زن).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: مقایسه‌ی احساسات
    gloss: من خشمگین نیستم، غمگین هستم.
    note: '*Nie* درست پیش از فعل می‌آید: *Nie jestem zły*. جملهٔ دوم بعد از آن احساس واقعی را می‌گوید.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: پرسیدن سبب
    gloss: چرا خوش استی؟
    note: '*Dlaczego* (چرا) کلمهٔ پرسشی معمول برای پرسیدن دلیل است.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: گفتن سبب
    gloss: من خوش استم چون یک آپارتمان نو دارم.
    note: '*Bo* (چون) دلیل را معرفی می‌کند؛ بعد از *mam* (دارم) اسم در حالت مفعولی می‌آید: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: یک سبب منفی
    gloss: من غمگین هستم چون باران می‌بارد.
    note: '*Pada deszcz* (باران می‌بارد، تحت‌اللفظی «باران می‌افتد») عبارت معمول هوا است که اینجا به‌عنوان دلیل آمده.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: عصبی
    gloss: عصبی
    note: کلمه‌ی معمول برای دلواپسی و اضطراب.
    example_gloss: من از اولین نوبت کاری ام نگران استم.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: گفتن اینکه از چه دلواپس استی
    gloss: من از اولین نوبت کاری ام نگران استم.
    note: '*Przed* (تحت‌اللفظی «پیش از») + حالت ابزاری می‌گوید دلواپسی دربارهٔ چیست: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: دلداری دادن به کسی
    gloss: غم نخور.
    note: '*Nie martw się* (تحت‌اللفظی «خودت را غصه نده») عبارت معمول دلداری است؛ *się* ضمیر انعکاسی است.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: پرسیدن اینکه کسی چه احساس دارد
    gloss: Marek چطور احساس می‌کند؟
    note: '*Czuć się* (احساس کردن، انعکاسی) روش معمول پرسیدن یا بیان حالت احساسی است: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: گفتن اینکه کسی چه احساس دارد
    gloss: او احساس نگرانی می کند.
    note: '*Się* با فعل می‌ماند: *on czuje się*. صفت برای مطابقت با *on* مذکر است: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: پرسیدن اینکه چرا کسی چنین احساسی دارد
    gloss: چرا او نگران است؟
    note: '*Dlaczego* (چرا) را با الگوی *czuje się* از *On czuje się zdenerwowany* ترکیب می‌کند.'
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: خواندن پیام درباره‌ی احساسات
    gloss: سلام Ewa، من پیش از اولین نوبت کاری مستقلم کمی عصبی استم. ولی خوشحال هم استم، چون کار نو و خانهٔ نو دارم. فکر می‌کنم همه‌چیز خوب می‌شود.
    note: بفهم که نویسنده از چه دلواپس است، چه چیز او را خوش می‌کند و دید کلی‌اش چیست.
    glosses:
      trochę: کمی
      zdenerwowany: عصبی
      pierwszą: اولین
      zmianą: نوبت کاری
      samodzielną: تنها
      szczęśliwy: خوشحال
      bo: چون
      nową: نو
      pracę: کار
      nowe: نو
      mieszkanie: آپارتمان
      myślę: فکر کردن
      będzie: 'درست شدن (اینجا: خوب می‌شود)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa می‌پرسد Marek چطور احساس می‌کند
    gloss: 'Ewa: سلام Marek، پیش از اولین نوبت کاری‌ات چطور احساس می‌کنی؟'
    note: '*Przed pierwszą zmianą* (دربارهٔ اولین نوبت کاری‌ات) الگوی *przed* + حالت ابزاری درس سوم را دوباره به کار می‌برد. *Czujesz się* شکل *ty* است.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek اعتراف می‌کند که عصبی است
    gloss: 'Marek: راستش کمی عصبی استم.'
    note: '*Szczerze mówiąc* (راستش، تحت‌اللفظی «صادقانه گفته») اعتراف را نرم می‌کند.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa به او دلداری می‌دهد
    gloss: 'Ewa: غصه نخور، خوب از عهده برمی‌آیی!'
    note: '*Dobrze sobie poradzisz* (تحت‌اللفظی «خوب از عهده برمی‌آیی») عبارت ثابت و دلگرم‌کننده است؛ *poradzisz* آیندهٔ *ty* از *poradzić sobie* است.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek از او تشکر می‌کند
    gloss: 'Marek: تشکر، واقعاً کمک می‌کند.'
    note: '*Pomaga* شکل *on/ona/ono* از *pomagać* (کمک کردن) است؛ *dzięki* «تشکر» غیررسمی است.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa نتیجه را پیش‌بینی می‌کند
    gloss: 'Ewa: و بعدش حتماً خیلی خوشحال و سرافراز می‌شوی.'
    note: '*Na pewno* (حتماً) پیش‌بینی با اطمینان را می‌رساند؛ *dumny* (سرافراز) صفت نو و مفید است. *Będziesz* آیندهٔ *być* است.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek موافقت می‌کند
    gloss: 'Marek: بلی، من هم همین‌طور فکر می‌کنم.'
    note: '*Ja też tak myślę* (تحت‌اللفظی «من هم همین‌طور فکر می‌کنم») روش طبیعی موافقت است؛ *ja* اینجا برای تأکید آمده.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: خلاصه کردن با jest و mu
    gloss: Marek پیش از اولین نوبت کاری‌اش عصبی است. Ewa به او کمک می‌کند.
    note: '*Jest* شکل *on/ona* از *być* (بودن) است؛ *mu* یعنی «به او» (حالت داتیو، چون *pomagać* داتیو می‌گیرد). کلمه‌های کوچک، اما برای صحبت دربارهٔ دیگران ضروری.'
