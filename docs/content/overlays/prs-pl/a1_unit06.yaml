teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: نان
    gloss: نان
    note: یک کلمهٔ اساسی غذایی که در هر وعدهٔ غذا بارها شنیده می‌شود.
    example_gloss: این نان است.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: کَچالو، پنیر
    gloss: کَچالو؛ پنیر
    note: اولی اسم خنثی و دومی اسم مذکر غیرجاندار است؛ هیچ‌کدام بعد از proszę o پایانه‌شان تغییر نمی‌کند، چنانکه در یادداشت گرامر این درس آمده است.
    example_gloss:
    - این کَچالو است.
    - این پنیر است.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: آب، شیر
    gloss: آب؛ شیر
    note: Woda مؤنث است (شکل مفعولی‌اش wodę در یادداشت گرامر این درس آمده)؛ mleko خنثی است و هرگز تغییر نمی‌کند.
    example_gloss:
    - این آب است.
    - این شیر است.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: قهوه، چای
    gloss: قهوه؛ چای
    note: هر دو مؤنث استند؛ شکل‌های مفعولی kawę و herbatę همان‌هایی‌اند که هنگام سفارش می‌گویید و در یادداشت گرامر این درس آمده‌اند.
    example_gloss:
    - این قهوه است.
    - این چای است.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'سفارش دادن: proszę o + مفعول'
    gloss: 'لطفاً برایم بتین + مفعول: kawa ← kawę، herbata ← herbatę، woda ← wodę. chleb، ser و mleko تغییر نمی‌کنند.'
    note: بعد از *Proszę o* («لطفاً برایم بتین»، در اصل «می‌خواهم») حالت مفعولی می‌آید. اسم‌های مؤنث مثل *kawa*، *herbata* و *woda* پایانهٔ *-a* را به *-ę* تغییر می‌دهند. اسم‌های مذکر غیرجاندار مثل *chleb* و *ser* و اسم‌های خنثی مثل *mleko* همان شکل قاموسی‌شان را نگه می‌دارند.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: قهوه، لطفاً
    gloss: قهوه، لطفاً.
    note: راه معمول و مؤدبانه برای سفارش یک چیز؛ الگوی یادداشت گرامر را در یک درخواست کامل به کار می‌برد.
  pl.a1.unit06.lesson02.teach.zupa:
    title: سوپ
    gloss: سوپ
    note: یک غذای معمول چاشت یا شام، و اغلب غذای خاص روز، چنانکه در صحنهٔ رستورنت همین بخش است.
    example_gloss: این سوپ است.
  pl.a1.unit06.lesson02.teach.sok:
    title: آبمیوه
    gloss: شربت میوه
    note: مذکر غیرجاندار مثل chleb و ser؛ هنگام سفارش پایانه‌اش تغییر نمی‌کند.
    example_gloss: این آبمیوه است.
  pl.a1.unit06.lesson02.teach.cukier:
    title: بوره
    gloss: بوره
    note: برای قهوه یا چای به کار می‌آید؛ آن هم مذکر غیرجاندار است و پایانه‌اش تغییر نمی‌کند.
    example_gloss: این بوره است.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: حساب
    gloss: بل / حساب
    note: چیزی که در آخر غذا می‌خواهین؛ proszę o rachunek راه معمول و مؤدبانهٔ درخواست آن است.
    example_gloss: بل را بیاورید، لطفاً.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'دوست داشتن: lubię، lubi'
    gloss: 'دوست داشتن: من دوست دارم، او دوست دارد — قهوه را دوست دارم. او سوپ را دوست دارد.'
    note: '*Lubić* فعل «دوست داشتن» است. اینجا فقط شکل‌های اول شخص (*lubię*) و سوم شخص (*lubi*) آموخته می‌شود. *Lubić* هم مفعولی می‌گیرد، مثل *proszę o* — *lubię kawę*، نه *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: سوپ را دوست دارم
    gloss: سوپ را دوست دارم.
    note: Zupa در حالت مفعولی zupę می‌شود، همان تغییر -a به -ę مؤنث‌ها از یادداشت گرامر درس اول.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: غذای روز
    gloss: غذای روز سوپ است.
    note: '*Dnia* شکل اضافی *dzień* (روز) است — *danie dnia* یعنی «غذای روز»، همان‌طور که در منو نوشته می‌شود.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'توصیه کردن: polecam، poleca'
    gloss: 'توصیه کردن: من توصیه می‌کنم، او توصیه می‌کند — قهوه را توصیه می‌کنم. او سوپ را توصیه می‌کند.'
    note: '*Polecać* فعل «توصیه کردن» است — گارسون با آن غذایی را پیشنهاد می‌کند و مشتری با همین فعل پیشنهاد می‌خواهد. این فعل هم مفعولی می‌گیرد، مثل *proszę o* و *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: چه توصیه می‌کنین؟
    gloss: چه توصیه می‌کنین؟
    note: '*Co* (چه) به‌علاوهٔ *pan* رسمی — سوالی طبیعی از گارسون، با همان خطاب رسمی درس اول.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: بفرمایید / خواهش می‌کنم
    gloss: بفرمایید.
    note: عبارتی انعطاف‌پذیر و روزمره — هنگام دادن چیزی گفته می‌شود و در جواب dziękuję (تشکر) هم طبیعی است.
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: همین حالا می‌آید
    gloss: همین حالا می‌آورم.
    note: در اصل «همین حالا می‌آورم» — جواب معمول گارسون که نشان می‌دهد سفارش را شنیده است.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: گارسون غذای خاص را اعلام می‌کند
    gloss: گارسون سلام می‌دهد و اعلام می‌کند که غذای خاص امروز سوپ است.
    note: Dzień dobry از سلام‌های درس اول است.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: اِوا توصیه می‌خواهد
    gloss: اِوا از گارسون می‌پرسد چه توصیه می‌کند.
    note: یک سوال مؤدبانه و رسمی — pan برای احترام به گارسون به کار رفته است.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: گارسون قهوه را توصیه می‌کند
    gloss: گارسون قهوه را توصیه می‌کند.
    note: Polecam — شکل اول شخص از یادداشت گرامر همین درس.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: اِوا سفارش می‌دهد
    gloss: اِوا می‌گوید باشه و قهوه و سوپ سفارش می‌دهد.
    note: proszę o را با حرف ربط i («و») از بخش خانواده یکجا می‌آورد و الگوی سفارش درس اول و واژگان سوپ درس دوم را دوباره به کار می‌برد.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: گارسون تأیید می‌کند
    gloss: گارسون می‌گوید سفارش همین حالا می‌آید.
    note: تأیید کوتاه و طبیعی پیش از رسیدن غذا.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: اِوا بل را می‌خواهد
    gloss: اِوا تشکر می‌کند و بل را می‌خواهد.
    note: dziękuję از درس اول و proszę o + rachunek از درس دوم را دوباره به کار می‌برد.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: گارسون بل را می‌دهد
    gloss: 'گارسون می‌گوید: بفرمایید.'
    note: همان proszę bardzo که پیشتر در همین درس آمد، حالا هنگام دادن بل به کار می‌رود.
