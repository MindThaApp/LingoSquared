teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چقدر تمام می‌شود؟
    note: '*W sumie* (در مجموع) روشن می‌کند که قیمت کلِ همه را می‌خواهین، نه قیمت یک چیز.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: گفتن قیمت مجموع
    gloss: در مجموع صد زلوتی تمام می‌شود.
    note: '*Kosztuje* شکل *on/ona/ono* فعل *kosztować* (تمام شدن، قیمت داشتن) است. عددهای از ۵ به بالا اسم را به شکل جمع مضاف‌الیهی می‌گیرند: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: '*Płacić kartą* (با کارت پرداخت کردن) و *płacić gotówką* (نقد پرداخت کردن) هر دو بعد از *płacić* حالت وسیله‌ای دارند: *kartą*، *gotówką*.'
    example_gloss:
    - آیا می‌توانم اینجا با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: پرسیدن امکان پرداخت با کارت
    gloss: آیا می‌توانم اینجا با کارت پرداخت کنم؟
    note: '*Tu* (اینجا) سؤال را به همین جا ربط می‌دهد؛ *czy* سؤال بلی/نخیر را شروع می‌کند و *mogę* یعنی «می‌توانم».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*Czy chce pan ...?* شکل رسمی *Czy chcesz ...?* است و اینجا کاشیرِ ناشناس آن را به کار می‌برد (*pan* برای مرد، *pani* برای زن).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: حساب
    gloss: حساب
    note: 'اسم مذکر: *rachunek* (حالت اضافی: *rachunku*).'
    example_gloss: حساب را تقسیم کنیم؟
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*Może podzielimy ...?* راه مؤدبانه‌ای است برای پیشنهاد کاری مشترک؛ *podzielimy* شکل *my* (ما) فعل *podzielić* است.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*Osobno* (جدا) با *zapłacić* (پرداخت کردن، شکل تمام‌شده: یک پرداخت کامل) می‌آید.'
  pl.a1.unit23.lesson04.teach.reszta:
    title: پول خورد
    gloss: پول خورد
    note: 'اسم مؤنث: *reszta* (حالت اضافی: *reszty*، مثل *nie potrzebuję reszty*).'
    example_gloss: این هم باقی پولتان.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: دادن پول خورد
    gloss: این هم باقی پولتان.
    note: '*Pana* شکل رسمی «شما، مال شما» است (برای مرد؛ برای زن *pani*) و با حالت رسمی پیش کاونتر می‌خواند.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: '*Nie potrzebuję* + حالت اضافی: در جمله منفی مفعول حالت اضافی می‌گیرد، پس *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: سی و پنج
    gloss: سی و پنج
    note: '*Trzydzieści pięć* دو کلمه نوشته می‌شود: اول دهگان، بعد یکان (۳۰ + ۵).'
    example_gloss: صد و چهل زلوتی تمام می‌شود.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'بل: دو غذای اصلی و دو چای/قهوه. مجموع: صد و چهل زلوتی. با کارت پرداخت شد.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      Rachunek: حساب
      dwa: دو
      dania: غذاهای اصلی (dania główne)
      kawy: قهوه‌ها
      Razem: مجموع
      złotych: زلوتی
      Zapłacono: پرداخت شده
      kartą: کارت
      sto: صد
      czterdzieści: چهل
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa بل را می‌خواهد
    gloss: 'Ewa: بل را بخواهیم؟'
    note: 'بعد از *Poprosić o* (خواستن) حالت مفعولی می‌آید: *o rachunek*. *Poprosimy* آینده تمام‌شده است.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek مجموع را می‌پرسد
    gloss: 'Marek: بلی، فکر خوبی است. در مجموع چند تمام می‌شود؟'
    note: سؤال *Ile to kosztuje w sumie?* از درس اول دوباره آمده است.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa مجموع را می‌گوید
    gloss: 'Ewa: صد و چهل زلوتی است. تقسیم کنیم؟'
    note: '*Podzielimy się?* (در اصل «بین خود تقسیم کنیم؟») با ضمیر بازتابی *się* یعنی بل را بین خود تقسیم کردن.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek اصرار می‌کند که خودش پرداخت کند
    gloss: 'Marek: نخیر، امروز من پرداخت می‌کنم. تو به من خیلی کمک کردی.'
    note: '*Dzisiaj ja płacę* (در اصل «امروز من پرداخت می‌کنم») راه معمول پیشنهاد پرداخت است؛ *pomogłaś* گذشته مؤنث *pomóc* (کمک کردن) است، چون Marek با Ewa صحبت می‌کند.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa خوش می‌شود
    gloss: 'Ewa: چقدر لطف کردی! تشکر.'
    note: '*Miło z twojej strony* (لطف تو است) تعریف گرم و معمول برای کار سخاوتمندانه است؛ *z* + حالت اضافی: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek درباره پرداخت با کارت می‌پرسد
    gloss: 'Marek: اینجا می‌شود با کارت پرداخت کرد؟'
    note: سؤال *Czy mogę tu zapłacić kartą?* از درس دوم دوباره آمده، حالا در خود رستورانت.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: شکل «او»'
    gloss: Marek بل را پرداخت می‌کند.
    note: '*Płaci* شکل *on/ona/ono* (او) فعل *płacić* (پرداخت کردن) است.'
