    title: ساختار Lubię
    gloss: '*Lubię* + فصل می‌گوید کدام فصل را دوست دارید: *Lubię lato.* فصل در حالت مفعولی می‌آید: *wiosnę*، *zimę*.'
    note: '*Lubię* («دوست دارم») مفعول می‌گیرد: اسم‌های مؤنث که به *-a* ختم می‌شوند به *-ę* تبدیل می‌شوند (*zima* ← *zimę*، *wiosna* ← *wiosnę*)، اما *jesień* و *lato* (اسمی که به *-o* ختم می‌شود) همان شکل را دارند. برای گفتن نظر خود دربارهٔ یک فصل از *Uważam* + مفعول + *za* + صفت استفاده کنید: *Uważam jesień za ładną*.'
