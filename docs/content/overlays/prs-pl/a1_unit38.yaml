    title: یک گپ‌وگفت درباره فصل‌ها
    gloss: 'حالا بهار است. لاله‌ها قشنگ استند. نینا می‌پرسد: کدام فصل را قشنگ می‌دانی؟ مارک می‌گوید: تابستان را دوست دارم. در تابستان شنا می‌کنیم. اوا می‌گوید: زمستان را دوست دارم. در زمستان اسکیت می‌کنیم.'
    note: این متن گپ‌وگفت کافهٔ زبان را با نقل قول مستقیم دوباره مرور می‌کند.
    glosses:
