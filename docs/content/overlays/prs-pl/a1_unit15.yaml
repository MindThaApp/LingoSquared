teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: ایستگاه
    gloss: ایستگاه
    note: جایی که قطارها و بس‌ها می‌آیند و می‌روند؛ نقطهٔ آغاز این بخش.
    example_gloss: ایستگاه نزدیک هوتل است.
  pl.a1.unit15.lesson01.teach.bilet:
    title: تکت
    gloss: تکت
    note: پیش از سوار شدن به قطار یا بس، به این ضرورت داری.
    example_gloss: تکت بیست زلوتی قیمت دارد.
  pl.a1.unit15.lesson01.teach.peron:
    title: پلاتفورم
    gloss: پلاتفورم
    note: جایی که ایستاده می‌شوی و منتظر قطارت می‌مانی.
    example_gloss: پلاتفورم نمبر یک آن‌جاست.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: پلاتفورم نمبر یک، دو...
    gloss: 'برای گفتن نمبر پلاتفورم می‌توانی بگویی Peron numer + عدد: Peron numer jeden, Peron numer dwa.'
    note: 'ساده‌تر از آنچه به نظر می‌رسد: فقط *peron* + *numer* + یک عدد معمولی که از قبل می‌دانی. (در اعلان‌های ایستگاه اغلب به‌جای آن عددهای ترتیبی می‌آید، مثل *peron pierwszy* -- «پلاتفورم یک» -- اما *peron numer jeden* همیشه فهمیده می‌شود.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: دوباره قطار
    gloss: Pociąg odjeżdża o czwartej po południu -- این جمله را از درس وقت از قبل می‌دانی.
    note: همان معلومات درس وقت، حالا در صحنهٔ سفر به کار می‌رود.
  pl.a1.unit15.lesson01.teach.krakow:
    title: کراکوف
    gloss: کراکوف
    note: یک شهر واقعی پولند؛ اولین مقصد این بخش.
    example_gloss: کراکوف دور است.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: به کراکوف
    gloss: 'وقتی به جایی می‌رویم، do + شکل دیگر نام شهر را می‌گوییم: do Krakowa (نه do Kraków). این شکل را یکجا حفظ کن.'
    note: سعی نکن *Krakowa* را از روی یک قاعده بسازی؛ فعلاً *do Krakowa* را مثل یک عبارت ثابت یاد بگیر.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: یک تکت به کراکوف، لطفاً
    gloss: یک تکت به کراکوف، لطفاً.
    note: همین عبارت را پیش دریچهٔ فروش تکت می‌گویی.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (با وسیله رفتن): jadę (من می‌روم)، jedzie (او می‌رود). Jutro jadę do Krakowa. Marek jedzie do Krakowa. (فردا به کراکوف می‌روم. مارک به کراکوف می‌رود.)'
    note: 'فعلاً فقط دو شکل: *jadę* برای خودت و *jedzie* برای کس دیگر.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: مارک به کراکوف می‌رود
    gloss: مارک فردا به کراکوف می‌رود.
    note: سفر خود مارک؛ قصهٔ او در گفتگوی این بخش ادامه می‌یابد.
  pl.a1.unit15.lesson02.teach.autobus:
    title: بس
    gloss: بس
    note: راه معمول دیگر برای سفر میان شهرها.
    example_gloss: بس در ایستگاه است.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: وارسا
    gloss: وارسا
    note: پایتخت پولند؛ دومین مقصد این بخش.
    example_gloss: ورشو دور است.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: به ورشو
    gloss: 'Warszawa از Kraków فرق دارد: do Warszawy (نه do Warszawa). هر شهر شکل خودش را دارد؛ هر دو را جداگانه حفظ کن.'
    note: '*Krakowa* و *Warszawy* از یک الگوی مشترک پیروی نمی‌کنند؛ به همین دلیل هر کدام جداگانه حفظ می‌شود، نه با یک قاعدهٔ مشترک.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: به کجا
    gloss: به کجا
    note: از مقصد می‌پرسد، نه از جای بودن؛ فرق دارد با پرسیدن «کجا» برای چیزی که همین حالا در یک جاست.
    example_gloss: بس به کجا می‌رود؟
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: دوباره «ساعت هفت»
    gloss: Siódmej -- این شکل ساعت را از درس وقت از قبل می‌دانی (o siódmej = ساعت هفت).
    note: همان الگوی شکل ساعت، این‌جا برای وقت حرکت دوباره استفاده می‌شود.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: بس ورشو ساعت هفت حرکت می‌کند
    gloss: بس ورشو ساعت هفت حرکت می‌کند.
    note: الگوی مقصد و الگوی وقت این درس در یک جملهٔ واقعی با هم می‌آیند.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: دوباره «کی»
    gloss: Kiedy -- این کلمه را از درس تاریخ‌ها از قبل می‌دانی. Kiedy odjeżdża autobus? (بس کی حرکت می‌کند؟)
    note: سوال طبیعی پیش از هر سفر.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: اِوا به ورشو می‌رود
    gloss: اِوا فردا به ورشو می‌رود.
    note: سفر خود اِوا؛ قصهٔ او در گفتگوی این بخش، کنار قصهٔ مارک، ادامه می‌یابد.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: دوباره «من»
    gloss: Ja -- این کلمه را از درس‌های پیشین از قبل می‌دانی.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: دوباره «مال من»
    gloss: Mój -- این کلمه را از درس خانواده از قبل می‌دانی.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: دوباره «ساعت ده صبح»
    gloss: Dziesiątej و rano -- هر دو شکل را از درس وقت از قبل می‌دانی (o dziesiątej rano = ساعت ده صبح).
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: تشکر و خداحافظی
    gloss: Dziękuję و Do zobaczenia -- این‌ها را از درس‌های پیشین از قبل می‌دانی.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: سفر خوش!
    gloss: Miłej podróży! راهی است برای آرزوی سفر خوش به کسی؛ آن را مثل یک عبارت کامل به کار می‌بریم، نه کلمه به کلمه ترجمه.
    note: یک خداحافظی ثابت و اصطلاحی؛ آن را یکجا یاد بگیر، همان‌طور که *Dzień dobry* را یاد گرفتی.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: مارک فردا به کراکوف می‌رود
    gloss: فردا به کراکوف می‌روم. قطارم ساعت چهار بعد از چاشت حرکت می‌کند.
    note: مارک با پلان سفر خودش شروع می‌کند؛ همان چیزی که درس اول دربارهٔ او گفته بود.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: اِوا فردا به ورشو می‌رود
    gloss: من به ورشو می‌روم. بسم ساعت ده صبح حرکت می‌کند.
    note: اِوا پلان خودش را می‌گوید؛ همان چیزی که درس دوم دربارهٔ او گفته بود.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: مارک برای اِوا سفر خوش می‌خواهد
    gloss: سفر خوش!
    note: مارک با اصطلاح تازهٔ این درس برای اِوا آرزوی خیر می‌کند.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: اِوا از مارک تشکر می‌کند و خداحافظی می‌کند
    gloss: تشکر! به امید دیدار!
    note: پایان ساده و آشنای گفتگو.
