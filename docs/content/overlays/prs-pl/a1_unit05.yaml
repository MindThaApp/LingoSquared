teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: خانواده
    gloss: خانواده
    note: کلمهٔ عمومی برای خانواده؛ برای همهٔ اعضای خانه به کار می‌رود، نه فقط برای یک نسبت.
    example_gloss: این خانوادهٔ من است.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: مادر، پدر
    gloss: مادر؛ پدر
    note: این دو کلمهٔ اصلی برای والدین اند. در گپ روزمره mama و tata را هم که محبت‌آمیز اند می‌شنوید، ولی matka و ojciec شکل‌های معیاری و بی‌طرف اند که در اینجا یاد می‌گیرین.
    example_gloss:
    - این مادرم است.
    - این پدرم است.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: برادر، خواهر
    gloss: برادر؛ خواهر
    note: 'هر دو اسم عادی اند: brat مذکر و siostra مؤنث است، و این در قاعدهٔ دستوری همین درس برای هماهنگی mój/moja مهم است.'
    example_gloss:
    - این برادرم است.
    - این خواهرم است.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: پدر و مادر
    gloss: پدر و مادر
    note: 'Rodzice اسم جمع مذکرِ شخصی است و شکل خاص خودش را می‌گیرد: moi (نه mój/moja). این را در مثال و نکتهٔ دستوری همین درس می‌بینین.'
    example_gloss: والدین من در وارسا زندگی می‌کنند.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: '«من»: mój، moja و moi'
    gloss: پدرم، برادرم -- مادرم، خواهرم -- والدینم.
    note: 'ضمیر ملکی در لهستانی با جنسیت اسمی که توضیح می‌دهد هماهنگ می‌شود: *mój* پیش از اسم مذکر (*mój ojciec*، *mój brat*)، *moja* پیش از اسم مؤنث (*moja matka*، *moja siostra*)، و شکل جدا و بی‌قاعدهٔ *moi* مخصوص جمع مذکرِ شخصی *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: این پدر من است
    gloss: این پدرم است.
    note: '*To jest* (این ... است) برای هر جنسیتی یکسان است؛ فقط ضمیر ملکی mój/moja تغییر می‌کند.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: پدرکلان، مادرکلان
    gloss: پدرکلان؛ مادرکلان
    note: کلمه‌های معیاری و روزمره برای پدرکلان و مادرکلان که کودکان و بزرگ‌سالان هر دو به کار می‌برند.
    example_gloss:
    - این پدرکلانم است.
    - این مادرکلانم است.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: کاکا یا ماما، عمه یا خاله
    gloss: کاکا یا ماما؛ عمه یا خاله
    note: در دری برای هر کدام کلمهٔ جداگانه داریم (کاکا، ماما، عمه، خاله)، ولی در لهستانی یک کلمه هم برای برادر یا خواهر پدر و مادر به کار می‌رود و هم برای همسر آنها.
    example_gloss:
    - این ماما یا کاکای من است.
    - این خالهٔ من است.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: پسر، دختر
    gloss: پسر؛ دختر
    note: 'مثال‌ها شکل مفعولی را نشان می‌دهند که بعد از *mieć* (داشتن) لازم است: *syn* می‌شود *syna* و *córka* می‌شود *córkę*. نکته‌های دستوری بعدی دلیل این تغییر پایان را توضیح می‌دهند.'
    example_gloss:
    - من یک پسر دارم.
    - من یک دختر دارم.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'داشتن: mam، masz، ma'
    gloss: 'داشتن: دارم، داری، دارد -- من یک برادر دارم، تو یک خواهر داری، او یک پسر دارد.'
    note: '*Mieć* فعل «داشتن» است. *Mam* (دارم) و *ma* (او دارد) شکل‌های تازهٔ اصلی این درس اند؛ *masz* (داری) را از واحد ۲ و از پرسیدن سن دیگران قبلاً دیده‌اید.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: گفتن اینکه چه دارید
    gloss: 'بعد از فعل «داشتن» پایان اسم تغییر می‌کند: brat -> brata، siostra -> siostrę، syn -> syna، córka -> córkę.'
    note: این حالت مفعولی است؛ شکلی که اسم به‌عنوان مفعول مستقیم فعلی مثل *mieć* می‌گیرد. اسم‌های مذکر برای انسان (و حیوان) مثل *brat* و *syn* پایان *-a* می‌گیرند؛ اسم‌های مؤنث مثل *siostra* و *córka* به‌جای *-a* آخر، *-ę* می‌گیرند.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: من یک برادر و یک خواهر دارم
    gloss: من یک برادر و یک خواهر دارم.
    note: پایان‌های حالت مفعولی از نکتهٔ دستوری در یک جملهٔ کامل به کار می‌روند، همراه با حرف ربط تازهٔ *i* (و).
  pl.a1.unit05.lesson03.teach.lub:
    title: یا
    gloss: یا
    note: در پرسش بلی/نخیر که دو گزینه می‌دهد، درست مثل «یا» در دری به کار می‌رود.
    example_gloss: برادر داری یا خواهر؟
  pl.a1.unit05.lesson03.teach.tylko:
    title: فقط
    gloss: فقط
    note: درست پیش از کلمه‌ای می‌آید که آن را محدود می‌کند.
    example_gloss: من فقط یک خواهر دارم.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: کجا
    gloss: کجا
    note: یک کلمهٔ پرسشی پایه؛ با mieszkać (زندگی کردن) طبیعی جور می‌آید، چنانکه در گفتگوی همین درس است.
    example_gloss: برادرت کجا زندگی می‌کند؟
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: او (مذکر)، او (مؤنث) -- و «زندگی کردن»
    gloss: 'او (مذکر)، او (مؤنث) -- زندگی کردن: زندگی می‌کنم، زندگی می‌کند. او در Gdańsk زندگی می‌کند. او در Kraków زندگی می‌کند.'
    note: '*On* (او، مذکر) و *ona* (او، مؤنث) ضمیرهای شخص سوم اند. *Mieszkać* (زندگی کردن) در شخص اول و سوم از همان الگوی *mieć* پیروی می‌کند: *mieszkam* (زندگی می‌کنم، از *Mieszkam w Warszawie* در واحد ۱) و *mieszka* (او زندگی می‌کند). بعد از *w* نام شهر به حالت مکانی می‌آید: *Gdańsk* می‌شود *w Gdańsku* و *Kraków* می‌شود *w Krakowie*، همان الگوی *Mieszkam w Warszawie* در واحد ۱.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: مارک دربارهٔ برادر و خواهر می‌پرسد
    gloss: مارک از اِوا می‌پرسد که برادر دارد یا خواهر.
    note: یک پرسش بلی/نخیر با *Czy*، همان نشانهٔ پرسش واحد ۱. اِوا و مارک حالا همدیگر را خوب می‌شناسند، پس از *pan*/*pani* رسمی به *ty* غیررسمی (*masz*، *A ty?*، *twój*) تغییر داده‌اند.
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: اِوا جواب می‌دهد و می‌پرسد
    gloss: اِوا می‌گوید که یک برادر و یک خواهر دارد، بعد همان پرسش را از مارک می‌پرسد.
    note: '*A ty?* («و تو؟») راه کوتاه و طبیعی است برای برگرداندن پرسش به کسی که پرسیده است.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: مارک جواب می‌دهد
    gloss: مارک می‌گوید که فقط یک خواهر دارد که در Kraków زندگی می‌کند، بعد از اِوا دربارهٔ برادرش می‌پرسد.
    note: مارک برادر ندارد؛ فقط *tylko siostrę* (فقط یک خواهر). پرسیدن دربارهٔ برادر اِوا درست است، چون اِوا قبلاً گفته که برادر دارد.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: اِوا جواب می‌دهد
    gloss: اِوا می‌گوید که برادرش در Gdańsk زندگی می‌کند و یک پسر و یک دختر دارد.
    note: الگوی حالت مفعولی syn/córka از درس دوم همین واحد دوباره به کار رفته است.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: مارک واکنش نشان می‌دهد
    gloss: 'مارک می‌گوید: چه خانوادهٔ خوب!'
    note: '*Fajna* کلمهٔ غیررسمی و روزمره برای «خوب» یا «باحال» است؛ یک واکنش پایانی طبیعی، در همان سطح گفتاری *Świetnie!* در واحد ۴.'
