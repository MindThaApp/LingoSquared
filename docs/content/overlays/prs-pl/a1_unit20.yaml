teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: است، استند، این، لطفاً می‌خواهم — دوباره
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do — این کلمه‌ها را از درس‌های قبلی می‌دانین.
    note: یک یادآوری کوتاه، قبل از این‌که این درس از این کلمه‌ها برای صحبت درباره خریدن لباس استفاده کند.
  pl.a1.unit20.lesson01.teach.sklep:
    title: دکان
    gloss: دکان / دوکان
    note: کلمهٔ عمومی برای دکان.
    example_gloss: من به دکان می‌روم.
  pl.a1.unit20.lesson01.teach.koszula:
    title: پیراهن
    gloss: پیراهن
    note: اسم مؤنث است — صفت‌های مؤنث می‌گیرد.
    example_gloss: این یک پیراهن است.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: پتلون
    gloss: پتلون
    note: در زبان پولندی همیشه جمع است، حتی برای یک دانه — شکل مفرد ندارد.
    example_gloss: این‌ها پتلون استند.
  pl.a1.unit20.lesson01.teach.kupic:
    title: خریدن
    gloss: خریدن
    note: 'بعد از ''*chcę*'' (می‌خواهم) می‌آید، درست مثل ''*iść*'' (رفتن) در یک درس قبلی: ''*chcę kupić*'' — می‌خواهم بخرم.'
    example_gloss: می‌خواهم یک پیراهن بخرم.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: می‌خواهم پتلون بخرم
    gloss: می‌خواهم پتلون بخرم.
    note: همان ساختار chcę + مصدر، این بار برای پتلون.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: پیراهن چند قیمت دارد؟
    gloss: پیراهن چند قیمت دارد؟
    note: راه طبیعی برای پرسیدن قیمت یک جنس مشخص، با استفاده دوباره از '*Ile kosztuje*' از درس خریداری.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: چه نوع — شکل مذکر
    gloss: Jaki, Jaka — '*Jaki*' دربارهٔ اسم‌های مذکر می‌پرسد و '*Jaka*' دربارهٔ اسم‌های مؤنث (شما '*Jaka*' را از درس هوا می‌دانین).
    note: '''*Kolor*'' (رنگ) مذکر است، پس با ''*Jaki*'' می‌آید، نه با ''*Jaka*''.'
  pl.a1.unit20.lesson02.teach.kolor:
    title: رنگ
    gloss: رنگ
    note: یک اسم مذکر.
    example_gloss: کدام رنگ؟
  pl.a1.unit20.lesson02.teach.sukienka:
    title: پیراهن زنانه
    gloss: لباس زنانه
    note: یک اسم مؤنث دیگر، مثل '*koszula*'.
    example_gloss: این یک لباس زنانه است.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: آبی
    gloss: Koszula jest niebieska. — '*niebieska*' با اسم‌های مؤنث، مثل '*koszula*'، مطابقت می‌کند.
    note: فقط همین شکل — تا حالا در این کورس با '*koszula*' وصل است.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: سرخ
    gloss: Sukienka jest czerwona. — '*czerwona*' هم با اسم‌های مؤنث مطابقت می‌کند، درست مثل '*niebieska*'.
    note: این شکل در این‌جا با '*sukienka*' وصل است، همان‌طور که '*niebieska*' با '*koszula*' وصل است.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: پیراهن آبی است
    gloss: پیراهن آبی است.
    note: جمله‌ای که این بخش بعداً، وقتی ماریک پیراهن می‌خرد، دوباره از آن استفاده می‌کند.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: لباس سرخ است
    gloss: لباس سرخ است.
    note: همان ساختار jest + رنگ برای یک جنس دیگر.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: روز بخیر، لطفاً، خیلی — دوباره
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co — این کلمه‌ها را از درس‌های قبلی می‌دانین.
    note: یک یادآوری کوتاه قبل از گفتگوی دکان در این درس.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: اندازه
    gloss: سایز
    note: اندازه‌های لباس در پولند معمولاً فقط حرف‌های S، M و L است.
    example_gloss: چه اندازه؟
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: آقا، می‌خواهد
    gloss: Co pan chce kupić? — '*pan*' شکل مؤدبانه برای خطاب کردن یک مرد است، درست مثل '*pani*' برای یک زن (شما '*pani*' را از درس خریداری می‌دانین).
    note: '''*chce*'' شکل او (مفرد سوم شخص) فعل ''*chcieć*'' است — شما ''*chcę*'' (می‌خواهم) و ''*chcesz*'' (می‌خواهی) را می‌دانین.'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: آقا، چه می‌خواهین بخرین؟
    gloss: آقا، چه می‌خواهین بخرین؟
    note: طریقهٔ مؤدبانهٔ شروع صحبت فروشنده با مشتری مرد.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: فروشنده به ماریک سلام می‌دهد
    gloss: روز بخیر! آقا، چه می‌خواهین بخرین؟
    note: Sprzedawca (فروشنده) با همان لحن مؤدبانه شروع می‌کند که دکان‌دار بازار در بخش خریداری قبلی داشت.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: ماریک می‌گوید چه می‌خواهد
    gloss: می‌خواهم یک پیراهن و پتلون بخرم.
    note: ماریک هر دو چیزی را که می‌خواهد بخرد می‌گوید.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: فروشنده اندازه را می‌پرسد
    gloss: چه اندازه؟
    note: یک سوال کوتاه و طبیعی که بعد می‌آید.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: ماریک اندازهٔ خود را می‌گوید
    gloss: اندازهٔ M.
    note: ماریک به طریقهٔ طبیعی، فقط با حرف اندازه جواب می‌دهد.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: فروشنده موجودی و قیمت را تأیید می‌کند
    gloss: پیراهن آبی و پتلون داریم. روی هم صد زلوتی می‌شود.
    note: '''*Mamy*'' یعنی «ما داریم» (مثل ''*mam*''/''*masz*''). بعد از آن، ''*koszula*'' به ''*koszulę*'' و ''*niebieska*'' به ''*niebieską*'' تغییر می‌کند — همان تغییری که در ''*Chcę kupić koszulę*'' دیدید. رنگ با پیراهن آبی درس دوم مطابقت دارد.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: ماریک قبول می‌کند
    gloss: خوب است، می‌گیرم.
    note: ماریک خریدن را تأیید می‌کند و گفتگو تمام می‌شود.
