teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *czytać* (خواندن)، *uprawiać sport* (ورزش کردن) و *gotować* (آشپزی کردن).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Wolny czas* عبارت اصلی برای صحبت درباره‌ی سرگرمی‌هاست. صفت *wolny* (فارغ) با اسم مذکر *czas* هماهنگ می‌شود؛ در *w wolnym czasie* هر دو در حالت مکانی استند.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: 'بعد از *Lubię* (دوست دارم) مصدر می‌آید: *lubię czytać*. در *W wolnym czasie* از *w* + حالت مکانی استفاده می‌شود.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *słuchać muzyki* (موسیقی گوش دادن)، *rysować* (نقاشی کردن) و *grać w gry* (بازی کردن).'
    example_gloss:
    - گوش دادن به موسیقی را دوست دارم.
    - من اغلب نقاشی می‌کنم.
    - بازی ویدیویی با دوستان را دوست دارم.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: گوش دادن به موسیقی را دوست دارم.
    note: '*Słuchać* همیشه حالت اضافی می‌گیرد: *słucham muzyki*، نه *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: بازی ویدیویی با دوستان را دوست دارم.
    note: در *Z przyjaciółmi* (با دوستان) از *z* + حالت ابزاری جمع استفاده می‌شود.
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: *zawsze*، *często*، *czasami*، *nigdy*. شکل این‌ها هرگز تغییر نمی‌کند، و *nigdy* قبل از فعل *nie* لازم دارد: *Nigdy nie gram.*'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Co tydzień* و *co weekend* هر دو یعنی «هر ...»؛ بعد از *co* حالت مفعولی می‌آید و خودش هیچ‌وقت تغییر نمی‌کند - کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + حالت مفعولی
    gloss: '*Co* + حالت مفعولی یعنی «هر»: هر هفته، هر آخر هفته، هر ماه.'
    note: '*Co* برای «هر» یک کلمه‌ی ثابت است، با هر اسمی. اسم‌های مذکر بی‌جان مثل *tydzień*، *weekend* و *miesiąc* در حالت فاعلی و مفعولی یکسان‌اند.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه کار می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: اِوا از سرگرمی‌ها صحبت می‌کند
    gloss: 'اِوا: ما اکثراً با هم قدم می‌زنیم. ولی تو در وقت فراغتت دیگر چه کار می‌کنی، مارک؟'
    note: '*Spacerujemy* شکل *my* (ما) فعل *spacerować* است؛ *Marku* حالت ندایی است و وقتی کسی را مستقیم صدا می‌زنید به کار می‌رود.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: سرگرمی‌های مارک
    gloss: 'مارک: آشپزی کردن را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: '*Także w domu* (در خانه هم) نشان می‌دهد مارک از سر شوق آشپزی می‌کند، نه فقط در کارش در رستورانت؛ *w domu* حالت مکانی است.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: اِوا تعجب می‌کند
    gloss: 'اِوا: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: '*Cały dzień* (تمام روز) تأکید می‌کند که مارک در کارش هم خیلی آشپزی می‌کند؛ *przecież* معنی «ولی آخر» را اضافه می‌کند.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: مارک توضیح می‌دهد
    gloss: 'مارک: بلی، ولی آشپزی مرا آرام می‌کند. و تو، چه کار کردن را دوست داری؟'
    note: '*Gotowanie mnie odpręża* در اصل یعنی «آشپزی مرا آرام می‌کند»: در پولندی اکثراً خود کار فاعل می‌شود و *mnie* (مرا) در حالت مفعولی می‌آید.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: سرگرمی‌های اِوا
    gloss: 'اِوا: کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌دهم.'
    note: دو فعل سرگرمی از درس اول و دوم با *i* (و) در یک جمله آمده‌اند.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: مارک درباره‌ی بازی می‌پرسد
    gloss: 'مارک: تو بازی هم می‌کنی؟'
    note: یک پرسش کوتاه بلی/نخیر با *grać w gry* از درس دوم؛ *też* یعنی «هم».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: اِوا جواب می‌دهد
    gloss: 'اِوا: نخیر، من هرگز بازی نمی‌کنم. ولی گاهی نقاشی می‌کنم!'
    note: '*Nigdy* (هرگز) و *czasami* (گاهی) از درس سوم، در یک جواب در برابر هم آمده‌اند. به منفی دوگانه توجه کنید: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و مارک اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. مارک آشپزی کردن را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌دهم. گاهی نقاشی می‌کنم، ولی هرگز بازی نمی‌کنم. تو در وقت فراغتت چه کار کردن را دوست داری؟
    note: پیام اِوا مطالب درس‌های پیش را خلاصه می‌کند و با پرسش اصلی این واحد به پایان می‌رسد.
    glosses:
      spacerujemy: قدم می‌زنیم
      często: اغلب
      razem: با هم
      inne: دیگر
      gotować: آشپزی می‌کند
      lubi: دوست دارد
      domu: در خانه
      uprawia: ورزش می‌کند
      czytać: خواندن
      słucham: گوش می‌کنم
      muzyki: موسیقی
      rysuję: نقاشی می‌کنم
      czasami: گاهی
      gram: ویدیوگیم بازی می‌کنی
      nigdy: هرگز
      wolnym: آزاد
      czasie: وقت
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: مارک درباره‌ی آخر هفته می‌پرسد
    gloss: 'مارک: این آخر هفته چه کار می‌کنی؟'
    note: در *W ten weekend* (این آخر هفته) برای بیان زمان از *w* + حالت مفعولی استفاده می‌شود.
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: اِوا مطمئن نیست
    gloss: 'اِوا: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*Wyjść na dwór* (بیرون رفتن) راه رایج گفتن این است که می‌خواهین از خانه بیرون شوین؛ *chcę* + مصدر یعنی «می‌خواهم».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: مارک یک برنامه پیشنهاد می‌کند
    gloss: 'مارک: با هم برویم قدم بزنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: '*Potem* (بعدش) کلمه‌ی ترتیب است؛ *ugotuję* شکل تکمیلی است چون آشپزی یک نتیجه‌ی تمام‌شده است.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: اِوا موافقت می‌کند
    gloss: 'اِوا: فکر خوب! هم قدم زدن را دوست دارم و هم آشپزی کردن را.'
    note: '*Lubię i ..., i ...* («هم ... و هم ...») نشان می‌دهد اِوا دو چیز را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: مارک تأیید می‌کند
    gloss: 'مارک: عالی. پس روز شنبه می‌بینمت!'
    note: یک جمله‌ی دوستانه‌ی پایانی که برنامه‌ی شنبه را تأیید می‌کند؛ *w sobotę* برای روز هفته از *w* + حالت مفعولی استفاده می‌کند.
