teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: ساعت یک، دو، سه
    gloss: ساعت یک؛ ساعت دو؛ ساعت سه
    note: در پولندی ساعت با عدد ترتیبی مؤنث گفته می‌شود که با کلمهٔ نگفتهٔ *godzina* (ساعت) هماهنگ است -- *pierwsza* در اصل یعنی «ساعت اول».
    example_gloss:
    - ساعت یک است.
    - ساعت دو است.
    - ساعت سه است.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: ساعت چهار، پنج، شش
    gloss: ساعت چهار؛ ساعت پنج؛ ساعت شش
    note: همان الگوی عدد ترتیبی مؤنث *pierwsza*، *druga*، *trzecia*.
    example_gloss:
    - ساعت چهار است.
    - ساعت پنج است.
    - ساعت شش است.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: ساعت هفت، هشت، نه
    gloss: ساعت هفت؛ ساعت هشت؛ ساعت نه
    note: سه ساعت وسطی از دوازده ساعت، با همان الگو.
    example_gloss:
    - ساعت هفت است.
    - ساعت هشت است.
    - ساعت نه است.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: ساعت ده، یازده، دوازده
    gloss: ساعت ده؛ ساعت یازده؛ ساعت دوازده
    note: سه ساعت آخر که مجموعهٔ کامل ۱ تا ۱۲ را تمام می‌کنند.
    example_gloss:
    - ساعت ده است.
    - ساعت یازده است.
    - ساعت دوازده است.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: به معنی لفظی «کدام است ساعت؟» -- *która* با اسم مؤنث *godzina* هماهنگ می‌شود، و همین الگوی هماهنگی را در سراسر این بخش می‌بینین.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina مؤنث است
    gloss: ما pierwsza, druga, trzecia می‌گوییم -- نه pierwszy, drugi, trzeci.
    note: '*Pierwszy*، *drugi*، *trzeci* شکل‌های مذکر همین عددهای ترتیبی اند که در جاهای دیگر زبان پولندی با اسم‌های مذکر به کار می‌روند -- اما برای گفتن وقت هرگز استفاده نمی‌شوند، چون *godzina* مؤنث است.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: صبح، ظهر، بعد از ظهر
    gloss: در صبح؛ در ظهر؛ بعد از ظهر
    note: '*Rano* تنها می‌آید (بدون حرف اضافه)؛ *w południe* و *po południu* هر کدام حرف اضافهٔ ثابت خودشان را دارند -- بهتر است این سه را به شکل عبارت‌های ثابت یاد بگیرین، نه اینکه از یک قاعدهٔ عمومی بیرون شان کنید.'
    example_gloss:
    - صبح‌ها چای قهوه می‌نوشم.
    - من در ظهر چاشت می‌خورم.
    - من بعدازظهر کار می‌کنم.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: شام، شب
    gloss: در شام؛ در شب
    note: '*Wieczorem* یک قید با شکل ثابت است (حرف اضافه لازم ندارد)؛ *w nocy* حرف *w* را با حالت مکانی کلمهٔ *noc* (شب) می‌آورد.'
    example_gloss:
    - شام‌ها تلویزیون تماشا می‌کنم.
    - در شب می‌خوابم.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: پرسیدن اینکه چه وقت
    gloss: ساعت چند؟
    note: وقتی می‌پرسید که چیزی کی اتفاق می‌افتد، نه اینکه همین حالا ساعت چند است، این را به جای *Która jest godzina?* به کار ببرید.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: گفتن «در ساعت» فلان
    gloss: ساعت چهار، هفت، ده -- اما در ساعت چهار، در ساعت هفت، در ساعت ده.
    note: 'بعد از *o* («در ساعت»)، *-a* آخر کلمهٔ ساعت به *-ej* تبدیل می‌شود: *czwarta* → *o czwartej*، *siódma* → *o siódmej*، *dziesiąta* → *o dziesiątej*. همهٔ ساعت‌ها از همین قاعده پیروی می‌کنند؛ تنها یک فرق املایی وجود دارد: *druga* → *o drugiej* که بعد از *g* یک *i* اضافه می‌شود. در این جمله‌ها i و g هم مهم‌اند: i در drugiej بعد از g می‌آید.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa صبح وقت بیدار می‌شود
    gloss: Ewa ساعت هفت صبح از خواب بیدار می‌شود.
    note: '*Wstaje* شخص سوم مفرد فعل *wstawać* (بیدار شدن، برخاستن) است.'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: وقت حرکت قطار
    gloss: قطار ساعت چهار بعد از ظهر حرکت می‌کند.
    note: '*Odjeżdża* شخص سوم مفرد فعل *odjeżdżać* (حرکت کردن، رفتن) است.'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: جلسه، دیدار
    gloss: جلسه
    note: همان کلمه‌ای که در بخش سوم دیدید (*Kiedy jest spotkanie?*)، وقتی Ewa و Marek دربارهٔ روز و تاریخ دیدار بعدی شان توافق کردند.
    example_gloss: جلسه روز جمعه است.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: پرسیدن ساعت دیدار
    gloss: روز جمعه، پانزدهم می، ساعت چند همدیگر را دیده می‌توانیم؟
    note: '*o której godzinie* همین بخش با روز و تاریخ بخش سوم یکجا شده است -- Ewa و Marek قبلاً روی جمعه، پانزدهم می، توافق کرده‌اند و حالا باید ساعت دقیق را تعیین کنند.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: پیشنهاد وقت
    gloss: شاید ساعت چهار بعد از ظهر؟
    note: '*Może* به تنهایی یعنی «شاید» -- راه طبیعی و نرم برای پیشنهاد کردن یک وقت.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: تأیید کردن یک وقت
    gloss: ساعت چهار بعد از ظهر برایم خوب است.
    note: همان الگوی *[time] + mi + odpowiada* است که در درس سوم در *Piątek mi odpowiada* دیدیم؛ خودِ وقت فاعل جمله است و *odpowiadać* همیشه شخص را در حالت مفعول غیرمستقیم می‌گیرد (*mi*، یعنی «برای من»).
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: تأیید کردن برنامهٔ کامل
    gloss: پانزدهم می، ساعت چهار می‌بینمت!
    note: خداحافظی *Do zobaczenia* از بخش اول دوباره آمده، این بار با تاریخ و ساعت.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa ساعت را می‌پرسد
    gloss: Ewa از Marek می‌پرسد که روز جمعه، پانزدهم می، ساعت چند همدیگر را دیده می‌توانند.
    note: دقیقاً همان پرسش اول همین درس است.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek ساعت چهار بعد از ظهر را پیشنهاد می‌کند
    gloss: Marek ساعت چهار بعد از ظهر را پیشنهاد می‌کند.
    note: یک پیشنهاد نرم است، نه یک گفتهٔ قطعی -- *może* همین را نشان می‌دهد.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa تأیید می‌کند
    gloss: Ewa می‌گوید ساعت چهار بعد از ظهر برایش خوب است.
    note: همان ساختار مفعول غیرمستقیم که در گفتگوی «جمعه برایم خوب است» بخش سوم بود.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek برنامه را قطعی می‌کند
    gloss: Marek می‌گوید عالی، و پانزدهم می، ساعت چهار می‌بینمت!
    note: '*Świetnie* همان کلمهٔ شادی و شوق بخش سوم است.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa خداحافظی می‌کند
    gloss: Ewa هم خداحافظی می‌کند.
    note: کوتاه‌ترین پایان ممکن -- فقط خود خداحافظی.
