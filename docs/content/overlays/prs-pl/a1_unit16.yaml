teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: درد می‌کند
    gloss: 'Boleć (درد کردن)، زمان حال: boli (او) و bolą (آن‌ها). Głowa mnie boli یعنی «سرم درد می‌کند» -- لفظاً «سر مرا درد می‌کند».'
    note: برای دردها، زمان حال *boleć* فقط به همین دو شکل استفاده می‌شود -- عضو بدن فاعل است و *mnie* می‌گوید از کیست، پس اینجا شکل «من درد می‌کنم» وجود ندارد.
  pl.a1.unit16.lesson01.teach.glowa:
    title: سر
    gloss: سر
    note: معمول‌ترین چیزی که درد می‌کند.
    example_gloss: سرم درد می‌کنه.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: گلو
    gloss: گلو
    note: برای گفتن از سرماخوردگی یا گلودردی مفید است.
    example_gloss: گلویم درد می‌کند.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: شکم
    gloss: شکم
    note: بعد از غذای زیاد یا وقتی چیزی به شما نمی‌سازد، مفید است.
    example_gloss: دلم درد می‌کند.
  pl.a1.unit16.lesson01.teach.zeby:
    title: دندان‌ها
    gloss: دندان‌ها
    note: اینجا همیشه به شکل جمع استفاده می‌شود، مثل گفتار یک پولندی‌زبان -- به همین سبب با آن *bolą* (نه *boli*) می‌آید.
    example_gloss: دندان‌هایم درد می‌کنند.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: چه چیزت درد می‌کند؟
    gloss: چه چیزت درد می‌کند؟
    note: سوال طبیعی از کسی که حالش خوب نیست.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: چطور احساس میکنی؟
    gloss: 'Czuć się (احساس کردن): czuję się (من)، czujesz się (تو). حالت چطور است؟'
    note: فعلاً فقط دو شکل -- *czuję* برای خودت، *czujesz* برای پرسیدن از دیگری.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: خوب و بد
    gloss: حالم خوب است. حالم بد است. -- dobrze را از قبل می‌دانین، źle ضد آن است.
    note: همان *dobrze* که از همان درس اول استفاده کرده‌اید، حالا با ضدش جفت شده است.
  pl.a1.unit16.lesson02.teach.zle:
    title: بد
    gloss: بد
    note: کلمه‌ای که برای گفتن «حالم خوب نیست» لازم دارید.
    example_gloss: حالم بد است.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: تب
    gloss: تب
    note: یک نشانه ساده و معمول که نام برده می‌شود.
    example_gloss: تب دارم.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: اوا، دارد -- دوباره
    gloss: Ewa, ma -- این نام و این شکل فعل mieć (داشتن) را از درس‌های قبل می‌دانین (Mam, masz, ma).
    note: یادآوری کوتاه پیش از آنکه این درس از هر دو استفاده کند.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: مریض
    gloss: مریض (مذکر) / مریض (مؤنث)
    note: همان الگوی -y/-a که با *młodszy/starsza* یاد گرفتید -- *chory* برای مرد، *chora* برای زن.
    example_gloss:
    - او (مرد) مریض است.
    - او (زن) مریض است.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: اوا حالش خوب نیست
    gloss: حالم بد است. تب دارم.
    note: اوا نشانه‌های خودش را می‌گوید -- همین را در گفتگوی این بخش دوباره می‌گوید.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: مارک، دوباره
    gloss: Marek -- این نام را از درس‌های قبل می‌دانین.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: و، دوباره
    gloss: I -- این کلمه را از درس‌های قبل می‌دانین.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: لطفاً و آب، دوباره
    gloss: Proszę و wodę -- هر دو کلمه را از درس‌های قبل می‌دانین.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: تشکر، دوباره
    gloss: Dziękuję -- این کلمه را از درس‌های قبل می‌دانین.
    note: یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: استراحت کردن
    gloss: استراحت کردن
    note: با *Proszę* درست مثل وقتی که از کسی می‌خواهین مستقیم برود یا به طرفی بپیچد استفاده می‌شود -- *Proszę* + مصدر، به امر ضرورتی نیست.
    example_gloss: لطفاً استراحت کنید.
  pl.a1.unit16.lesson03.teach.pic:
    title: نوشیدن
    gloss: نوشیدن
    note: مصدر دیگری که به همین شکل بعد از *Proszę* می‌آید.
    example_gloss: لطفاً آب بنوشید.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: مارک می‌پرسد حال اوا چطور است
    gloss: اوا، حالت چطور است؟
    note: مارک می‌بیند که چیزی درست نیست و مستقیم می‌پرسد.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: اوا نشانه‌هایش را می‌گوید
    gloss: حالم بد است. گلویم درد می‌کند و تب دارم.
    note: اوا دو نشانه را واضح می‌گوید -- همان چیزهایی که پیشتر در این بخش گفته بود.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: مارک مشورت ساده می‌دهد
    gloss: لطفاً استراحت کنید و آب بنوشید.
    note: مشورت ساده است، نه دستور طبی -- فقط عقل سلیم.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: اوا از مارک تشکر می‌کند
    gloss: خوب، تشکر مارک.
    note: پایان ساده و آشنای گفتگو.
