teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: جوان
    gloss: جوان
    note: یک صفت توصیفی ساده — نقطهٔ آغاز شکل‌های تفضیلی این واحد.
    example_gloss: مارک جوان است.
  pl.a1.unit14.lesson01.teach.stary:
    title: پیر
    gloss: پیر
    note: متضاد młody — صفت دیگری که این واحد آن را به شکل تفضیلی درمی‌آورد.
    example_gloss: بابه کلان پیر است.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'ساختن مقایسه: افزودن -szy'
    gloss: 'در صفت‌های کوتاه مثل stary و młody پایان -y به -szy تغییر می‌کند: stary می‌شود starszy، młody می‌شود młodszy. هر صفتی این‌طور نمی‌شود.'
    note: 'یک الگوی ساده برای این دو کلمه: *-y* آخر را حذف کن و *-szy* را اضافه کن تا شکل تفضیلی به دست بیاید. صفت‌های دیگر زیاد اند که ختم دیگری دارند، بنابراین این قاعده را همه‌جا استعمال نکن.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: کلان‌تر
    gloss: کلان‌تر
    note: Starszy برای مرد (یا on) و starsza برای زن (یا ona) به کار می‌رود — شکل تفضیلی stary.
    example_gloss:
    - بابه‌کلان از پدر کلان‌تر است.
    - ماما‌کلان از مادر کلان‌تر است.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: جوان‌تر
    gloss: جوان‌تر
    note: Młodszy برای مرد، młodsza برای زن — شکل تفضیلی młody.
    example_gloss:
    - پدر از بابه‌کلان جوان‌تر است.
    - مادر از ماما‌کلان جوان‌تر است.
  pl.a1.unit14.lesson01.teach.niz:
    title: از
    gloss: از
    note: Niż دو چیزِ مورد مقایسه را به هم وصل می‌کند — کلمهٔ بعد از niż به شکل ساده و عادی خودش می‌ماند.
    example_gloss: پسر از پدرش کوچکتر است.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: صفت‌های تفضیلی با جنس هماهنگ می‌شوند
    gloss: Starszy/starsza و młodszy/młodsza با جنس تغییر می‌کنند، درست مثل byłem/byłam. Starszy، młodszy برای مرد (on)؛ starsza، młodsza برای زن (ona).
    note: مثل *byłem*/*byłam* است — آخر کلمه تغییر می‌کند، به این که از یک مرد حرف می‌زنید یا از یک زن.
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa از Marek بزرگتر است
    gloss: Ewa از Marek بزرگتر است.
    note: یک واقعیت دربارهٔ دو شخصیت ما — Ewa 32 ساله و Marek 28 ساله است.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek از Ewa کوچکتر است
    gloss: Marek از Ewa کوچکتر است.
    note: همان واقعیت، از طرف دیگر گفته شده.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: باز هم «خوب»
    gloss: Dobry (خوب) — این را از Dzień dobry از قبل می‌شناسید.
    note: همان صفتی که از درس اول دیده‌اید، حالا برای ساختن صفت تفضیلی به کار می‌رود.
  pl.a1.unit14.lesson02.teach.zly:
    title: بد
    gloss: بد
    note: ضد dobry — یک کلمهٔ کاملاً تازهٔ این درس.
    example_gloss: این یک روز بد است.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry و zły بی‌قاعده‌اند
    gloss: 'Dobry و zły بی‌قاعده‌اند: dobry به lepszy و zły به gorszy تبدیل می‌شود — -szy اضافه نمی‌کنید.'
    note: برخلاف *stary*/*młody*، این دو از قاعدهٔ عادی *-szy* پیروی نمی‌کنند — شکل تفضیلی‌شان را باید جداگانه یاد گرفت.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: بهتر
    gloss: بهتر
    note: Lepszy برای مرد، lepsza برای زن (یا برای کلمهٔ مؤنث مثل kawa) — صفت تفضیلی بی‌قاعدهٔ dobry.
    example_gloss:
    - او از من بهتر است.
    - قهوه از چای بهتر است.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: بدتر
    gloss: بدتر
    note: Gorszy/gorsza — صفت تفضیلی بی‌قاعدهٔ zły.
    example_gloss:
    - او از من بدتر است.
    - چای از قهوه بدتر است.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: باز هم قهوه و چای
    gloss: Kawa و herbata — این کلمه‌ها را از درس قبلی دربارهٔ نوشیدنی‌ها از قبل می‌شناسید.
    note: یک یادآوری کوتاه، پیش از این که این درس آن‌ها را در مقایسه به کار ببرد.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: همان الگوی قبلی
    gloss: Lepszy/lepsza و gorszy/gorsza درست مثل starszy/starsza درس پیش با جنس تغییر می‌کنند.
    note: همان فرق مذکر و مؤنث که تازه یاد گرفتید، این بار برای یک جفت کلمهٔ تازه.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: من، هستم، تو
    gloss: Ja, jestem, ty — این کلمه‌ها را از درس‌های قبلی می‌شناسید.
    note: یک یادآوری کوتاه پیش از مکالمهٔ این درس.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: بلی، نه، خوب
    gloss: Tak، nie و dobrze را هم از قبل می‌شناسید.
    note: یک یادآوری کوتاه دیگر پیش از مکالمه.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: باز هم «ولی»
    gloss: Ale (ولی) — این را از درس‌های قبلی می‌شناسید. دو جملهٔ متضاد را به هم وصل می‌کند.
    note: یک حرف ربط کوتاه که تضاد را نشان می‌دهد؛ در دری هم «ولی» همین کار را می‌کند.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek می‌گوید چای بهتر است
    gloss: چای از قهوه بهتر است!
    note: Marek نظر خودش را می‌گوید، درست مثل چیزی که در درس ترجیحات گفته بود.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa مخالفت می‌کند
    gloss: نه، نه! قهوه از چای بهتر است!
    note: Ewa با نظر خودش جواب می‌دهد — این هم مطابق گفته‌های قبلی‌اش است.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek بحث را به سن می‌کشاند
    gloss: خوب، خوب. ولی من از تو کوچکترم!
    note: Marek بحث نوشیدنی را رها می‌کند و از چیزی حرف می‌زند که به آن مطمئن است.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa قبول می‌کند و نظرش را دوباره می‌گوید
    gloss: بلی، من بزرگترم. ولی قهوه بهتر است!
    note: Ewa واقعیت سن را تأیید می‌کند، بعد دوباره به نظر خودش دربارهٔ قهوه برمی‌گردد.
