teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: موسیقی
    gloss: موسیقی
    note: موضوعی معمول برای صحبت درباره دوست داشتن‌ها و دوست نداشتن‌ها.
    example_gloss: من موسیقی را دوست دارم.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: با lubić (دوست داشتن) و مفعول، muzyka به muzykę تغییر می‌کند، درست مثل kawa که به kawę تغییر می‌کند. Lubię muzykę، نه Lubię muzyka.
    note: 'همان الگوی که از قبل می‌دانین: *muzyka* وقتی مفعول *lubię* باشد به *muzykę* تبدیل می‌شود، درست مثل *kawa* که به *kawę* تبدیل می‌شود.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: تو دوست داری
    gloss: تو دوست داری (غیررسمی، ty)
    note: شکل «ty» فعل lubić -- چیزی که برای پرسیدن مستقیم از یک دوست لازم دارید که فلان چیز را دوست دارد یا نه.
    example_gloss: موسیقی را دوست داری؟
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (دوست داشتن): lubię (من)، lubisz (تو)، lubi (او). Lubię و lubi را از قبل می‌دانین -- lubisz شکل تازه است، برای کسی که با او صحبت می‌کنین.'
    note: '*Lubię* و *lubi* حالا دیگر آشنا استند -- *lubisz* شکل خالی «تو» همین فعل را پر می‌کند.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: موسیقی را دوست داری؟
    gloss: موسیقی را دوست داری؟
    note: Czy سوال بلی/نخیر را شروع می‌کند -- راه طبیعی برای پرسیدن از یک دوست درباره علاقه‌اش.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: بلی، دوست دارم.
    gloss: بلی، دوست دارم.
    note: جواب کوتاه و طبیعی -- لازم نیست کلمه muzykę را تکرار کنید.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: نه، دوست ندارم.
    gloss: نه، دوست ندارم.
    note: Nie nie lubię دوباره به نظر می‌رسد، اما غلط نیست -- nie اول به سوال جواب می‌دهد و nie دوم lubię را منفی می‌کند.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: جواب‌های کوتاه
    gloss: 'جواب کوتاه: Tak, lubię. / Nie, nie lubię. -- لازم نیست کلمه muzykę را تکرار کنید، چون از سوال معلوم است که صحبت درباره چی است.'
    note: همان‌طور که *Pyszny?* می‌تواند به‌تنهایی بیاید، *Tak, lubię.* هم لازم ندارد موضوع صحبت را دوباره بگوید -- موضوع از متن معلوم می‌شود.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: موسیقی را خیلی دوست دارم
    gloss: موسیقی را خیلی دوست دارم.
    note: Bardzo (خیلی) یک علاقه ساده را قوی‌تر می‌سازد -- bardzo را از همان واحد اول دیده‌اید.
  pl.a1.unit13.lesson02.teach.wole:
    title: من بیشتر دوست دارم
    gloss: من بیشتر دوست دارم
    note: فعل کاملاً تازه این واحد، woleć (بیشتر دوست داشتن) -- اینجا فقط شکل «من» آموخته می‌شود، مثل lubię.
    example_gloss: من چای را بیشتر دوست دارم.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: در این واحد فقط wolę'
    gloss: 'Woleć (بیشتر دوست داشتن): wolę (من) -- این درس فقط شکل «من» را می‌آموزاند، مثل lubię. Wolę kawę. = من قهوه را بیشتر دوست دارم.'
    note: فعلاً فقط شکل *ja* (من) فعل *woleć* -- درست به همان اندازه که *lubię* در آغاز معرفی شد.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: باز هم قهوه و چای
    gloss: 'Wolę + مفعول: kawa به kawę و herbata به herbatę تبدیل می‌شود -- همان الگوی که از قبل می‌دانین.'
    note: 'همان الگوی مفعولی قبلی، فقط با یک فعل تازه: *wolę kawę*، *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: قهوه را بیشتر دوست دارم
    gloss: من قهوه را ترجیح می‌دهم.
    note: بیان ساده ترجیح با wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: چای را بیشتر دوست دارم
    gloss: من چای را بیشتر دوست دارم.
    note: همان الگو، با herbatę به جای kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy به معنی «یا»
    gloss: czy در Kawa czy herbata? همان czy نیست که سوال بلی/نخیر را شروع می‌کند -- اینجا دو انتخاب را وصل می‌کند، مثل «یا» در دری. Kawa czy herbata? = قهوه یا چای؟
    note: 'توجه کنید: *czy* معمولاً سوال بلی/نخیر را شروع می‌کند، اما بین دو اسم مثل اینجا فقط معنی «یا» را می‌دهد.'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: قهوه یا چای؟
    gloss: قهوه یا چای؟
    note: یک راه کوتاه و طبیعی برای پیشنهاد کردن انتخاب به کسی.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: من هم
    gloss: من هم
    note: یک راه کوتاه برای موافقت با حرفی که کسی همین حالا گفته.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też، دوباره
    gloss: Ja też یعنی «من هم» / «من نیز» — این را از درس روزمرگی می‌دانی (Ja też wstaję o siódmej، «من هم ساعت هفت بیدار می‌شوم»).
    note: یادآوری کوتاه که این عبارت قبلاً هم آمده است.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? فعل نمی‌خواهد
    gloss: درست مثل Pyszny? در واحد پیش، پرسش کوتاه Kawa czy herbata? به فعل ضرورت ندارد — موقعیت کافی است.
    note: همان الگوی *Pyszny?* — یک پرسش کوتاه بدون فعل که موقعیت آن را کاملاً روشن می‌سازد.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: مارک از اِوا می‌پرسد که موسیقی را دوست دارد یا نه
    gloss: موسیقی را دوست داری؟
    note: مارک گفتگو را با پرسشی شروع می‌کند که همین واحد آموخته است.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: اِوا دوست دارد و پرسش را برمی‌گرداند
    gloss: بلی، خیلی دوست دارم! و تو؟
    note: A ty? (و تو؟) پرسش را دوباره به مارک می‌دهد، همان الگویی که در واحدهای پیشین دیده‌ایم.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: مارک موافقت می‌کند و درباره نوشیدنی می‌پرسد
    gloss: من هم دوست دارم. قهوه یا چای؟
    note: Ja też lubię جواب مارک را تأیید می‌کند، پیش از آن‌که با یک پرسش «این یا آن» موضوع را عوض کند.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: اِوا قهوه را ترجیح می‌دهد
    gloss: من قهوه را ترجیح می‌دهم.
    note: ترجیح خود اِوا با wolę — همان قهوه‌نوشی که در واحد روزمرگی دیدیم.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: مارک چای را ترجیح می‌دهد
    gloss: من چای را بیشتر دوست دارم.
    note: ترجیح خود مارک — برعکس انتخاب اِوا.
