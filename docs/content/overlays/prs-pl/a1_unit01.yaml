teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: خطاب رسمی به یک مرد
    gloss: آقا (خطاب رسمی به مرد)
    note: 'در پولندی انتخاب اجتماعی مهمی وجود دارد: *pan* برای خطاب به مردی است که او را نمی‌شناسید یا از نگاه کاری قابل احترام است. از نظر دستوری، *pan* مثل فاعل سوم شخص عمل می‌کند — "pan jest" در اصل یعنی «آقا هست»، نه صیغهٔ واقعی دوم شخص، با آن‌که به معنای «شما» به کار می‌رود.'
  pl.a1.unit01.lesson01.teach.pani:
    title: خطاب رسمی به یک زن
    gloss: خانم (خطاب رسمی به زن)
    note: مؤنث *pan*. *pani* را برای زنی که نمی‌شناسید یا از نگاه کاری قابل احترام است به کار ببرید. هر زن بزرگسال، چه مجرد چه شوهردار، در خطاب روزمره *pani* گفته می‌شود؛ در پولندی تفاوتی در خطاب میان این دو حالت نیست.
  pl.a1.unit01.lesson01.teach.ty:
    title: «تو» به شکل غیررسمی
    gloss: تو (غیررسمی، مفرد)
    note: '*Ty* را با یک دوست، همسال، عضو فامیل، طفل یا هر کسی که رابطهٔ غیررسمی دارید به کار می‌برید. برخلاف *pan*/ *pani*، با *ty* آخر فعل دوم شخص واقعی می‌آید، مثلاً *masz* («تو داری»)، نه آخر فعل سوم شخص.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: پرسش رسمی احوال، از یک مرد
    gloss: حال شما چطور است؟ (به مرد، رسمی)
    note: در اصل یعنی «آقا چطور احساس می‌کند». *Ma* صیغهٔ سوم شخص فعل است (هماهنگ با *pan* به‌عنوان فاعل دستوری) و همان آخری است که با *on* («او») می‌آید.
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: پرسش رسمی احوال، از یک زن
    gloss: حال شما چطور است؟ (به زن، رسمی)
    note: همان ساختار *Jak się pan ma?* است، فقط به‌جای *pan* کلمهٔ *pani* می‌آید. صیغهٔ فعل *ma* تغییر نمی‌کند؛ صرف نظر از جنسیت مخاطب همان آخر سوم شخص است.
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: پرسیدن احوال به شکل غیررسمی
    gloss: چطور استی؟ (غیررسمی)
    note: با *ty*، فعل آخر واقعی دوم شخص یعنی *masz* می‌گیرد، نه *ma*. *Jak się pan/pani ma?* رسمی را با *Jak się masz?* غیررسمی مقایسه کنید — این بهترین جفت برای شنیدن تفاوت pan/pani و ty در خود فعل است.
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: یک پاسخ معمول
    gloss: خوبم، تشکر.
    note: '*Dziękuję* («تشکر») با لحن تغییر نمی‌کند — چه به *pan* جواب بتین، چه به *pani* یا *ty*، همین کلمه است. فقط خود پرسش رسمی یا غیررسمی بودن را نشان می‌دهد.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: برگرداندن پرسش رسمی
    gloss: و شما؟ (به مرد، رسمی)
    note: راه کوتاه برای برگرداندن پرسش به مردی که با او رسمی صحبت می‌کنین. وقتی پرسش را به یک زن برمی‌گردانید، *pan* را با *pani* عوض کنید ("A pani?").
  pl.a1.unit01.lesson01.teach.a_ty:
    title: برگرداندن پرسش غیررسمی
    gloss: تو چطور؟ (غیررسمی)
    note: '*ty* را برای برگرداندن پرسش به دوست یا همسال به کار ببرید.'
  pl.a1.unit01.lesson02.teach.czesc:
    title: سلام و خداحافظی غیررسمی
    gloss: سلام؛ خداحافظ (غیررسمی، برای هر دو)
    note: '*Cześć* میان سلام‌های پولندی ویژه است: در همان لحن غیررسمی هم برای «سلام» و هم برای «خداحافظ» به کار می‌رود. فقط در رابطه‌های سطح *ty* استفاده می‌شود، هرگز با *pan*/*pani*.'
    example_gloss: سلام، چطور استی؟
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: سلام تمام روز
    gloss: صبح بخیر؛ روز بخیر
    note: '*Dzień dobry* در هر وقت پیش از شام به کار می‌رود و برخلاف *cześć* از نظر لحن بی‌طرف است — با *pan*، *pani* یا *ty* هر سه می‌توانین بگویین. برای کسی که خوب نمی‌شناسید، مطمئن‌ترین سلام است.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: سلام شام
    gloss: شام بخیر
    note: وقتی شام می‌شود، به‌جای *dzień dobry* می‌آید. از نظر لحن هم بی‌طرف است.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: خداحافظی شب
    gloss: شب بخیر
    note: برخلاف *dzień dobry*/*dobry wieczór*، *dobranoc* خداحافظی است نه سلام — وقتی کسی برای شب می‌رود یا می‌خوابد گفته می‌شود، هرگز برای شروع صحبت نه.
    example_gloss: شب بخیر، پیوتر!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: خداحافظی معمول
    gloss: خداحافظ
    note: راه بی‌طرف و مطمئن برای خداحافظی — با *pan*، *pani* یا *ty* به کار می‌رود. نسبت به *do zobaczenia* قطعی‌تر به نظر می‌رسد.
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: خداحافظی «به امید دیدار»
    gloss: می‌بینیم‌تان
    note: در اصل یعنی «تا [همدیگر را] ببینیم». نشان می‌دهد انتظار دارید دوباره ملاقات کنید، برخلاف *do widzenia* که بی‌طرف‌تر است.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: دعای محترمانهٔ ختم دیدار
    gloss: روز خوشی داشته باشین!
    note: '*Miłego dnia* در آرزو حالت اضافی (genitive) را به کار می‌برد، مثل *smacznego* («نوش جان») — ساختاری ثابت است که بهتر است در این مرحله به‌صورت یک عبارت کامل یاد بگیرین، نه این‌که حالت‌به‌حالت تحلیل شود.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: پرسیدن نام، به شکل رسمی
    gloss: اسم شما چیست؟ (به مرد، رسمی)
    note: در اصل یعنی «آقا خود را چه می‌نامد» — *nazywać się* فعل انعکاسی به معنای «نامیده شدن» است. وقتی با یک زن رسمی صحبت می‌کنین، *pan* را با *pani* عوض کنید.
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: پرسیدن نام کوچک، به شکل غیررسمی
    gloss: اسم (کوچک) تو چیست؟
    note: 'اصطلاح دیگری است: *mieć na imię* («به‌عنوان نام کوچک داشتن») و مشخصاً نام کوچک را می‌پرسد، نه نام کامل یا تخلص. راه طبیعی و غیررسمی برای پرسیدن نام یک همسال است.'
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: گفتن نام کامل
    gloss: اسم من آنا کووالسکا است.
    note: صیغهٔ اول شخص *nazywać się* که به‌طور طبیعی نام کوچک و تخلص با هم بعد از آن می‌آید — راه رسمی‌تر و کامل‌تر برای معرفی خود.
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: گفتن نام کوچک
    gloss: نام من آنا است.
    note: صیغهٔ اول شخص *mieć na imię* که معمولاً فقط نام کوچک بعد از آن می‌آید — همتای غیررسمی *Nazywam się...*.
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: خوشحالی از آشنایی
    gloss: از آشنایی با شما بسیار خوشحالم.
    note: عبارت ثابت و پرکاربرد هنگام اولین دیدار با کسی که هم در محیط رسمی و هم غیررسمی مناسب است.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: پرسیدن اصلیت، به شکل غیررسمی
    gloss: شما از کجا استید؟
    note: '*Skąd* یعنی «از کجا». این‌جا شکل غیررسمی *ty* نشان داده شده؛ شکل رسمی آن *Skąd pan/pani jest?* در گفت‌وگوی پایانی همین درس می‌آید.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: گفتن اصلیت خود
    gloss: من از کانادا استم.
    note: '*Z* («از») حالت اضافی (genitive) می‌گیرد، پس *Kanada* به *Kanady* تبدیل می‌شود. بیشتر نام کشورها بعد از *z* همین الگو را دارند.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: گفتن محل سکونت
    gloss: من در ورشو زندگی می‌کنم.
    note: '*W* («در») این‌جا حالت مکانی (locative) می‌گیرد، پس *Warszawa* به *Warszawie* تبدیل می‌شود. اصلیت (با *z*) و محل سکونت فعلی (با *w*) حالت‌های متفاوتی روی نام مکان می‌گیرند — بهتر است آن را به‌عنوان یک الگو ببینین، نه یک استثنا که حفظ شود.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: شروع دیدار
    gloss: اِوا به مارک سلام می‌کند و رسمی اسمش را می‌پرسد.
    note: اِوا با کسی که تازه با او آشنا شده از شکل رسمی *pan* استفاده می‌کند؛ انتخاب مطمئن برای اولین برخورد کاری یا با ناآشنا.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: شروع دیدار، جواب
    gloss: مارک نام کاملش را می‌گوید و می‌گوید از آشنایی خوشحال است.
    note: '*Nazywam się* با نام کامل، راه طبیعی و کامل برای جواب دادن به پرسش رسمی دربارهٔ نام است.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: پرسیدن دربارهٔ اصلیت
    gloss: اِوا همین احساس را جواب می‌دهد و رسمی می‌پرسد مارک از کجاست.
    note: '*Skąd pan jest?* — همتای رسمی *Skąd jesteś?* این درس — از *jest* استفاده می‌کند، همان الگوی فعل سوم شخص که قبلاً با *pan jest*/*pan ma* دیدیم.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: پرسیدن دربارهٔ اصلیت، جواب
    gloss: مارک می‌گوید از کانادا است اما در ورشو زندگی می‌کند.
    note: '*Ale* («اما») تضاد میان اصلیت مارک و جای زندگی فعلی‌اش را وصل می‌کند — همان تفاوتی که *jestem z*/*mieszkam w* نشان می‌دهند.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: پرسیدن دربارهٔ توانایی زبان
    gloss: اِوا رسمی می‌پرسد که مارک پولندی صحبت می‌کند یا نه.
    note: '*Czy* پرسش بلی/نخیر را شروع می‌کند — در پولندی برای این کار فعل کمکی جداگانه لازم نیست؛ خود *czy* نشان می‌دهد که پرسش می‌آید و بقیهٔ جمله به ترتیب معمول ادامه پیدا می‌کند.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: پرسیدن دربارهٔ توانایی زبان، جواب و ختم صحبت
    gloss: مارک می‌گوید کمی صحبت می‌کند و هنوز یاد می‌گیرد، بعد خداحافظی می‌کند.
    note: '*Jeszcze się uczę* («هنوز یاد می‌گیرم») راه طبیعی و متواضعانه برای گفتن تلاش جاری است — برای یک زبان‌آموز واقعی هم مفید است که دربارهٔ خودش بگوید.'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: کدام کلمه یک مرد را رسمی و با احترام خطاب می‌کند؟
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: Pan یک مرد را رسمی خطاب می‌کند و آخر فعل سوم شخص می‌گیرد.
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: کدام کلمه یک زن را رسمی و با احترام خطاب می‌کند؟
    correct_option: pani
    distractors:
    - pan
    - ty
    accepted_answers:
    - pani
    feedback: Pani یک زن را رسمی خطاب می‌کند و مثل pan آخر فعل سوم شخص می‌گیرد.
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: کدام کلمه یک دوست یا همسال را غیررسمی خطاب می‌کند؟
    correct_option: ty
    distractors:
    - pan
    - pani
    accepted_answers:
    - ty
    feedback: Ty با دوستان، همسالان و رابطه‌های غیررسمی به کار می‌رود و آخر فعل دوم شخص واقعی می‌گیرد.
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: پرسش رسمی احوال (به مرد) را به ترتیب درست بگذارین.
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: پرسش غیررسمی احوال را به ترتیب درست بگذارین.
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: پرسش را با حفظ لحن محترمانه برگردانید.
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan?/A pani? هنگام برگرداندن پرسش لحن رسمی را نگه می‌دارد.
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: پرسش را به یک دوست یا همسال برگردانید.
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty? راه غیررسمی برگرداندن پرسش است.
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: پرسش غیررسمی را درست کنید — در آن ty با آخر فعل نادرست مخلوط شده است.
    accepted_answers:
    - Jak się masz?
    - Jak się masz
    - Jak ty się masz?
    - Jak się ty masz?
    feedback: Ty آخر masz می‌گیرد، نه ma — ma فقط با pan/pani (یا on/ona) به کار می‌رود.
  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: به این سوال مؤدبانه جواب بتین.
    accepted_answers:
    - Dobrze, dziękuję.
    - Dobrze, dziękuję
    - Dziękuję, dobrze.
    - Dobrze, dziękuję. A pan?
    - Dziękuję, dobrze. A pan?
    - Dobrze, dziękuję. A pani?
    - Dziękuję, dobrze. A pani?
  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: غیررسمی جواب بتین، تشکر کنید و سوال را برگردانید.
    accepted_answers:
    - Dobrze, dziękuję. A ty?
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję. A ty
    - Dziękuję, dobrze. A ty?
