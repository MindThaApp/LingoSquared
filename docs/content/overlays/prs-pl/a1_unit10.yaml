teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: بلند شدن، بلند می‌شوم
    gloss: بلند شدن؛ بلند می‌شوم
    note: Wstawać مصدر است؛ wstaję شکل روزمرهٔ شخص اول است که برای گفتن از روال خودتان به کار می‌برید.
    example_gloss: ساعت هفت صبح بلند می‌شوم.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: خوردن، می‌خورم
    gloss: خوردن؛ می‌خورم
    note: Jeść کمی بی‌قاعده است، اما jem («می‌خورم») شکلی است که بیشتر به کار می‌برید -- لهستانی‌ها دربارهٔ هر وعدهٔ غذا دقیقاً همین‌طور می‌گویند.
    example_gloss: صبح ناشتا می‌خورم.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: چای صبح
    gloss: چای صبح
    note: Śniadanie بعد از jem تغییر نمی‌کند -- «ناشتا می‌خورم» فقط jem śniadanie است، بدون پایانهٔ اضافه برای یاد گرفتن.
    example_gloss: صبح ناشتا می‌خورم.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: نوشیدن، می‌نوشم
    gloss: نوشیدن؛ می‌نوشم
    note: Pić مصدر است؛ piję شکل شخص اول است و مثل jem و wstaję به کار می‌رود.
    example_gloss: من صبح چای قهوه می‌نوشم.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: گفتن دربارهٔ خودتان
    gloss: Wstaję, jem, piję -- در این بخش فقط دربارهٔ خودمان صحبت می‌کنیم، با شخص اول (من)، درست مثل وقتی که روز خودتان را شرح می‌تین.
    note: این بخش عمداً فقط به شکل «من» هر فعل می‌پردازد -- *wstaję* (بلند می‌شوم)، *jem* (می‌خورم)، *piję* (می‌نوشم) -- تا بتوانید روی گفتن از روال خودتان تمرکز کنید، بدون این‌که هم‌زمان یاد بگیرین هر فعل برای «تو»، «او (مرد)» یا «او (زن)» چطور تغییر می‌کند.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: ساعت هفت صبح از خواب بیدار می‌شوم
    gloss: ساعت هفت صبح بلند می‌شوم.
    note: 'الگوی نکتهٔ دستوری در عمل: o همراه با شکل حالت مکانی ساعت (siódmej) یعنی «در» همان ساعت، درست مثل درس قبلی دربارهٔ وقت.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: ناشتا می‌خورم و قهوه می‌نوشم
    gloss: ناشتا می‌خورم و قهوه می‌نوشم.
    note: دو فعل شخص اول که با i (و) وصل شده‌اند؛ راه طبیعی برای گفتن کارهای صبح خودت.
  pl.a1.unit10.lesson02.teach.obiad:
    title: غذای چاشت
    gloss: غذای چاشت / غذای نیمروز
    note: مثل śniadanie، کلمهٔ obiad هم بعد از jem تغییر نمی‌کند؛ jem obiad به‌سادگی یعنی «غذای چاشت می‌خورم».
    example_gloss: وقت چاشت غذا می‌خورم.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: کار کردن، کار می‌کنم
    gloss: کار کردن؛ کار می‌کنم
    note: Pracować از همان الگوی -ować ← -uję پیروی می‌کند که kosztować ← kosztuje در درس خرید داشت، فقط این بار در شخص اول.
    example_gloss: من بعدازظهر کار می‌کنم.
  pl.a1.unit10.lesson02.teach.dom:
    title: خانه
    gloss: خانه
    note: کلمهٔ روزمره برای خانه؛ در عبارت «به خانه رفتن/آمدن» همیشه می‌آید.
    example_gloss: خانه آن‌جاست.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: به خانه
    gloss: 'به خانه -- بعد از do حالت اضافی می‌آید و حالت اضافی dom با -u ختم می‌شود: domu، درست مثل bank ← banku، park ← parku، hotel ← hotelu.'
    note: '*Do domu* («به خانه»، مثل «به خانه می‌روم») همان پایانهٔ حالت اضافی *-u* را به کار می‌برد که بعد از *do* با bank، hotel و park یاد گرفته‌ای؛ یک اسم دیگر با همان الگو.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: برگشتن، برمی‌گردم
    gloss: برگشتن؛ برمی‌گردم
    note: با do domu می‌آید و یعنی «به خانه می‌روم» یا «به خانه برمی‌گردم»؛ از رایج‌ترین عبارت‌های روزمره در زبان پولندی.
    example_gloss: شام به خانه برمی‌گردم.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: وقت چاشت، بعد از چاشت، شام
    gloss: وقت چاشت؛ بعد از چاشت؛ شام
    note: 'مرور از درس وقت: این عبارت‌ها همراه با rano و w nocy تمام روز را پوشش می‌دهند.'
    example_gloss:
    - وقت چاشت غذا می‌خورم.
    - من بعدازظهر کار می‌کنم.
    - شام به خانه برمی‌گردم.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: بعد از چاشت کار می‌کنم، بعد به خانه می‌روم
    gloss: بعد از چاشت کار می‌کنم، بعد به خانه برمی‌گردم.
    note: همان الگوی کاما + potem از درس راهنمایی، این بار برای وصل کردن دو بخش برنامهٔ روزانه.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: خواب کردن، می‌خوابم
    gloss: خواب کردن؛ می‌خوابم
    note: در śpię نسبت به مصدر spać تغییر صدادار عجیبی دیده می‌شود، ولی فعل بسیار پرکاربردی است و بهتر است همین‌طور حفظش کنی.
    example_gloss: من شب می‌خوابم.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: و تو؟ من هم.
    gloss: و تو؟ / من هم.
    note: A ty? راه ساده برای دادن نوبت صحبت به طرف مقابل است؛ ja też یعنی «من هم»؛ هر دو در گپ‌های روزمره زیاد می‌آیند.
    example_gloss: من هم صبح ناشتا می‌خورم.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: اما، چای، نه
    gloss: اما؛ چای (مفعول)؛ نه
    note: Ale تضاد را معرفی می‌کند؛ وقتی nie پیش از یک کلمه بیاید (نه پیش از فعل) یعنی «نه آن چیز» -- piję herbatę, nie kawę یعنی «چای می‌نوشم، نه قهوه».
    example_gloss: چای می‌نوشم، اما قهوه نه.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: زود، ساعت ده
    gloss: زود؛ ساعت ده -- همان پایانهٔ -ej در ساعت‌ها بعد از 'o'، مثل czwartej و siódmej از درس قبلی.
    note: '*O dziesiątej* («ساعت ده») همان الگوی ساعت را که قبلاً یاد گرفتی دوباره به کار می‌برد -- *dziesiąta* بعد از *o* به *dziesiątej* تبدیل می‌شود، درست مثل *czwarta* ← *czwartej* و *siódma* ← *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: اِوا از صبح خود می‌گوید
    gloss: اِوا می‌گوید ساعت هفت صبح از خواب بیدار می‌شود و قهوه می‌نوشد.
    note: اولین الگوی جملهٔ این درس دوباره می‌آید، این بار در یک گفتگوی واقعی.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: اِوا روزش را ادامه می‌دهد
    gloss: اِوا می‌گوید ناشتا می‌خورد، بعد بعد از چاشت کار می‌کند.
    note: دو کار شخص اول با potem وصل شده‌اند، همان الگوی درس ۲.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: اِوا تمام می‌کند و از مارک می‌پرسد
    gloss: اِوا می‌گوید شام به خانه برمی‌گردد. و تو؟
    note: A ty? نوبت صحبت را بدون هیچ دستور جدیدِ پرسش به مارک می‌دهد.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: مارک از صبح خود می‌گوید
    gloss: مارک می‌گوید او هم ساعت هفت از خواب بیدار می‌شود! اما چای می‌نوشد، نه قهوه.
    note: Ja też یک جزئیات مشترک (وقت بیدار شدن) را تأیید می‌کند، بعد با ale...nie در مورد نوشیدنی تضاد می‌آورد.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: مارک از روز خود می‌گوید
    gloss: مارک می‌گوید صبح کار می‌کند، بعد وقت چاشت غذا می‌خورد.
    note: ترتیب روز او با اِوا فرق دارد -- اول کار، بعد غذای نیمروز.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: مارک از خواب خود می‌گوید
    gloss: مارک می‌گوید زود می‌خوابد، ساعت ده شب.
    note: گفتگو با فعل جدید spać/śpię و الگوی ساعتِ تکرارشدهٔ این درس تمام می‌شود.
