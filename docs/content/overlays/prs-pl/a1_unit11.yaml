teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: خواستن، می‌خواهم
    gloss: خواستن؛ من می‌خواهم
    note: Chcieć شکل مصدر است؛ chcę شکل روزمرهٔ شخص اول است که با آن می‌گویی چه می‌خواهی.
    example_gloss: من می‌خواهم به سینما بروم.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: تو می‌خواهی
    gloss: تو می‌خواهی (غیررسمی)
    note: Chcesz شکل غیررسمی «تو» است و مثل masz و jesteś استفاده می‌شود؛ دقیقاً همان چیزی که وقتی از دوستت می‌پرسی چه می‌خواهد، به کار می‌بری.
    example_gloss: قهوه می‌خواهی؟
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: من می‌خواهم، تو می‌خواهی
    gloss: 'Chcę، chcesz — همان الگوی masz (داشتن) و jesteś (بودن): chcesz شکل «تو» (شخص دوم) است و وقتی از کسی می‌پرسی چه می‌خواهد، آن را به کار می‌بری.'
    note: در این درس به چیزی بیشتر از «من» نیاز داریم — *chcę* (من می‌خواهم) و *chcesz* (تو می‌خواهی) دقیقاً همان الگوی شخصی‌اند که از *masz* و *jesteś* می‌شناسی، فقط روی یک فعل تازه.
  pl.a1.unit11.lesson01.teach.kino:
    title: سینما
    gloss: سینما
    note: کلمهٔ روزمره برای سینما — وقتی برنامه می‌سازی، همیشه به کار می‌آید.
    example_gloss: این سینما است.
  pl.a1.unit11.lesson01.teach.razem:
    title: با هم
    gloss: باهم
    note: Razem در بخش خرید به معنی «مجموع» هم بود (شاید یادت باشد)؛ اینجا در معنای روزمرهٔ دیگرش یعنی «با هم» آمده است.
    example_gloss: می‌خواهی با هم برویم؟
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: می‌خواهی به سینما بروی؟
    gloss: می‌خواهی به سینما بروی؟
    note: Czy پرسش بلی/نه را شروع می‌کند؛ chcesz iść do kina می‌پرسد طرف مقابل چه می‌خواهد بکند — راه اصلی برای پیشنهاد برنامه.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: می‌خواهی روز جمعه با هم به سینما برویم؟
    gloss: می‌خواهی روز جمعه با هم به سینما برویم؟
    note: 'پیشنهاد کامل: razem (با هم) و w piątek (روز جمعه) به پرسشی که همین حالا یاد گرفتی اضافه شده‌اند.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: توانستن، می‌توانم
    gloss: توانستن؛ من می‌توانم
    note: Móc مصدر است؛ mogę شکل شخص اول است — شاید możemy («ما می‌توانیم») را از درس‌های تاریخ و وقت به یاد داشته باشی؛ همین فعل است، به شکل مفرد.
    example_gloss: من روز جمعه می‌توانم بیایم.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: تو می‌توانی
    gloss: تو می‌توانی (غیررسمی)
    note: Możesz شکل غیررسمی «تو» است، با همان الگوی شخص دوم chcesz — برای پرسیدن این‌که کسی می‌تواند کاری بکند یا نه.
    example_gloss: روز شنبه می‌توانی بیایی؟
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: آمدن
    gloss: آمدن
    note: فعلی برای آمدن به دیدن کسی — با mogę/możesz خوب جور می‌شود تا بگویی چه کسی می‌تواند بیاید یا نمی‌تواند.
    example_gloss: من می‌خواهم روز جمعه بیایم.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: من می‌توانم، تو می‌توانی
    gloss: 'Móc: mogę، możesz — همان شخص دوم («تو») مثل chcesz. Mogę به‌علاوهٔ مصدر می‌گوید چه کاری از دستت برمی‌آید: mogę przyjść (می‌توانم بیایم)، mogę iść (می‌توانم بروم).'
    note: '*Mogę* به‌علاوهٔ یک مصدر ساده می‌گوید چه کاری از دستت برمی‌آید — *mogę przyjść* («می‌توانم بیایم») و *mogę iść* («می‌توانم بروم») هر دو از همین الگوی ساده پیروی می‌کنند.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: با میل
    gloss: با کمال میل
    note: راهی گرم و با شوق برای قبول کردن یک برنامه — برای گرمی بیشتر اغلب با tak (بلی) یا bardzo (خیلی) می‌آید.
    example_gloss: بلی، با کمال میل!
  pl.a1.unit11.lesson02.teach.niestety:
    title: متأسفانه
    gloss: افسوس، متأسفانه
    note: کلمهٔ طبیعی برای رد کردن مؤدبانهٔ یک برنامه — تقریباً همیشه بعدش nie mogę (نمی‌توانم) می‌آید.
    example_gloss: متأسفانه، نمی‌توانم.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: روز شنبه
    gloss: 'W + روز هفته: روزهای مذکر (piątek، poniedziałek، czwartek) پایانه‌شان تغییر نمی‌کند — w piątek. روزهای مؤنث (sobota، środa، niedziela) پایانهٔ مفعولی -ę می‌گیرند، مثل kawa ← kawę — w sobotę.'
    note: بعد از *w* همهٔ روزها یک‌جور نیستند — نام روزهای مؤنث مثل *sobota* به *sobotę* تغییر می‌کند، همان پایانهٔ *-a* ← *-ę* که برای *kawa* ← *kawę* و *herbata* ← *herbatę* یاد گرفتی. روزهای مذکر مثل *piątek* همان‌طور می‌مانند.
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: روز شنبه می‌توانی بیایی؟
    gloss: روز شنبه می‌توانی بیایی؟
    note: możesz، przyjść و شکل تازهٔ w sobotę را کنار هم می‌آورد — راهی کامل برای پرسیدن دربارهٔ یک روز دیگر.
  pl.a1.unit11.lesson03.teach.moze:
    title: شاید، چطور است
    gloss: شاید / چطور است
    note: کلمه‌ای برای پیشنهاد گزینهٔ دیگر — هر وقت برنامهٔ اول درست نشود و بخواهی چیز دیگری پیشنهاد کنی، به کار می‌آید.
    example_gloss: روز شنبه چطور است؟
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może در برابر mogę
    gloss: 'Może و mogę شبیه هم‌اند، اما معنی‌شان فرق دارد: może («شاید») چیز تازه‌ای پیشنهاد می‌کند؛ mogę (شکل «من» فعل، «می‌توانم») می‌گوید چه کاری از دستت برمی‌آید.'
    note: 'در نوشته به‌آسانی اشتباه می‌شوند: *może* («شاید»، اینجا برای پیشنهاد) و *mogę* («می‌توانم»، فعل شخص اول) در جمله کار متفاوتی دارند، با این‌که از یک ریشه‌اند — به حرف آخر توجه کن.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: ساعت چند؟
    gloss: ساعت چند؟
    note: راه معمول برای پرسیدن وقت مشخص، وقتی روز قبلاً طی شده — شاید o której را از درس وقت به یاد داشته باشی.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: اِوا سینما را پیشنهاد می‌کند
    gloss: اِوا از مارِک می‌پرسد که روز جمعه می‌خواهد به سینما برود یا نه.
    note: نخستین پرسشی که در این درس یاد گرفتی، حالا در یک گفتگوی واقعی.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: مارِک جمعه نمی‌تواند
    gloss: مارِک می‌گوید متأسفانه روز جمعه نمی‌تواند.
    note: Niestety رد کردن را نرم می‌کند و بعدش nie mogę آن را ساده می‌گوید.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: مارِک شنبه را پیشنهاد می‌کند
    gloss: 'مارِک می‌پرسد: روز شنبه چطور است؟'
    note: Może به‌جای تمام کردن گفتگو با یک رد، گزینهٔ دیگری پیشنهاد می‌کند.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: اِوا با میل قبول می‌کند
    gloss: 'اِوا می‌گوید: شنبه؟ با کمال میل!'
    note: روز پیشنهادشده را تکرار می‌کند (با همان شکل w sobotę) و بعد با chętnie قبول می‌کند.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: اِوا وقت را می‌پرسد
    gloss: 'اِوا می‌پرسد: ساعت چند؟'
    note: وقتی روز مشخص شد، آخرین جزئیات برنامه ساعت است.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: مارِک وقت را تأیید می‌کند
    gloss: 'مارِک می‌گوید: ساعت چهار بعد از چاشت.'
    note: گفتگو را با یک وقت مشخص و توافق‌شده تمام می‌کند و الگوی ساعت را از درس‌های وقت و کارهای روزانه دوباره به کار می‌برد.
