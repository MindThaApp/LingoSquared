teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: رفتن، رسیدن
    gloss: رفتن؛ رسیدن
    note: دو فعل حرکت که به هم نزدیک‌اند — iść «رفتن/قدم زدن» به‌طور کلی است و dojść به‌طور خاص «رسیدن» به یک مقصد؛ در الگوی سؤالی که این درس یاد می‌دهد به کار می‌رود.
    example_gloss:
    - لطفاً سیده بروید.
    - چطور به بانک برسم؟
  pl.a1.unit09.lesson01.teach.prosto:
    title: سیده
    gloss: مستقیم
    note: ساده‌ترین واژهٔ نشانی — درست بعد از iść می‌آید تا بگوید «سیده بروید».
    example_gloss: لطفاً سیده تا پارک بروید.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: آنجا، بعد
    gloss: آنجا؛ بعد
    note: Tam جایی را نشان می‌دهد؛ potem مرحله‌ها را پشت هم می‌آورد («اول این، بعد آن») — هر دو برای پیوند دادن نشانی‌ها ضروری‌اند.
    example_gloss:
    - بانک آنجاست.
    - بعد، لطفاً سیده بروید.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'لطفاً + مصدر — Proszę (لطفاً) به‌اضافهٔ فعل به شکل مصدر راه معمول و مؤدبانه برای گفتن نشانی است، بدون نیاز به شکل جداگانهٔ امر: لطفاً سیده بروید.'
    note: '*Proszę* به‌اضافهٔ فعل مصدری راه مؤدبانهٔ لهستانی برای گفتن کاری به کسی است — *Proszę iść prosto* («لطفاً سیده بروید»). با آدم ناشناس انتخاب امن و مؤدبانه است، پس برای گفتن یا فهمیدن نشانی به «شکل امر» جداگانه نیاز ندارین. (میان دوستان، لهستانی‌زبانان معمولاً همان شکل امر را به کار می‌برند — بعداً با آن آشنا می‌شوید.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: چطور به + [جا] برسم؟
    gloss: 'چطور به + [جا] برسم؟ — Jak (چطور) به‌اضافهٔ dojść (رسیدن) راه یک جا را می‌پرسد: چطور به بانک برسم؟ چطور به هوتل برسم؟ چطور به پارک برسم؟ اسم بعد از do همان پایان حالت اضافهٔ -u را می‌گیرد که در درس پیش بعد از «پهلوی»/«روبه‌روی» دیدید: bank -> banku، hotel -> hotelu، park -> parku.'
    note: '*Jak dojść do...?* سؤال روزمره برای پرسیدن راه رسیدن به یک جاست. نام جایی که بعد از *do* می‌آید همان پایان حالت اضافهٔ *-u* را می‌گیرد که بعد از *obok*/*naprzeciwko* یاد گرفتید — *bank* به *banku* تبدیل می‌شود، *hotel* به *hotelu*، *park* به *parku*؛ دقیقاً همان الگو، فقط بعد از یک حرف اضافهٔ تازه.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: چطور به بانک برسم؟
    gloss: چطور به بانک برسم؟
    note: الگوی یادداشت دستور را با نخستین مقصد این درس به کار می‌برد.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: راست، چپ
    gloss: راست؛ چپ
    note: بعد از na می‌آید تا بگوید چیزی کجاست یا به کدام طرف باید پیچید — na prawo (به راست)، na lewo (به چپ).
    example_gloss:
    - بانک سمت راست است.
    - پارک سمت چپ است.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: پیچیدن
    gloss: پیچیدن
    note: فعل تغییر جهت — با na prawo/na lewo جفت می‌شود و یعنی «به راست بپیچید»/«به چپ بپیچید».
    example_gloss: لطفاً به راست بپیچید.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: لطفاً به چپ بپیچید
    gloss: لطفاً به چپ بپیچید.
    note: همان الگوی Proszę + مصدر، این بار با skręcić و na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: سرک
    gloss: سرک
    note: کلمهٔ عادی برای هر سرک -- هر وقت در راهنمایی از سرکی به نام یاد شود به کار می‌آید.
    example_gloss: سرک آنجاست.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: وصل کردن راهنمایی‌ها با potem
    gloss: 'لطفاً مستقیم بروید، بعد به راست بپیچید. -- چند راهنمایی را می‌شود با کوما و کلمهٔ potem (بعد) وصل کرد: اول یک کار، بعد کار دیگر.'
    note: 'برای دادن چند راهنمایی پشت سر هم، آن‌ها را فقط با کوما و *potem* وصل کنید: *Proszę iść prosto, potem skręcić na prawo* («لطفاً مستقیم بروید، بعد به راست بپیچید»). راهنمایی‌های چندمرحله‌ای واقعی درست به همین شکل ساخته می‌شوند.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: می‌فهمم
    gloss: می‌فهمم
    note: راه خوبی برای تأیید این‌که راهنمایی را فهمیدید، پیش از پرسیدن سوال بعدی.
    example_gloss: می‌فهمم، تشکر.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: ایوا می‌پرسد چطور به پارک برسد
    gloss: ایوا معذرت می‌خواهد و می‌پرسد چطور به پارک برسد.
    note: Przepraszam سوال را شروع می‌کند؛ همان عادت مؤدبانه‌ای که در گفتگوی مکان‌ها در درس قبلی دیدید.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: یک رهگذر راه پارک را نشان می‌دهد
    gloss: رهگذر می‌گوید مستقیم بروید، بعد به چپ بپیچید. پارک آنجاست.
    note: دو راهنمایی پیوسته با potem، دقیقاً مثل توضیح گرامر همین درس.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: ایوا تأیید می‌کند و دربارهٔ بانک می‌پرسد
    gloss: ایوا می‌گوید می‌فهمد و می‌پرسد چطور به بانک برسد.
    note: Rozumiem تأیید می‌کند که ایوا راهنمایی اول را فهمیده، پیش از آن‌که سوال تازه بپرسد.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: رهگذر راه بانک را نشان می‌دهد
    gloss: رهگذر می‌گوید به راست بپیچید، بعد مستقیم بروید. بانک طرف راست است.
    note: مسیر دومرحله‌ای دیگر، متفاوت از مسیر پارک، با همان الگوی Proszę + مصدر.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: ایوا تشکر می‌کند
    gloss: ایوا می‌گوید خیلی تشکر.
    note: Dziękuję bardzo که از درس‌های خرید و مکان‌ها دوباره آمده است.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: رهگذر جواب می‌دهد
    gloss: رهگذر می‌گوید خواهش می‌کنم.
    note: Proszę bardzo، جواب معمول به تشکر، از درس‌های قبلی.
