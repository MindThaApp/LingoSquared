teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: چه‌قسم، است، امروز، نه -- دوباره
    gloss: Jaka, jest, Dziś, nie -- این کلمه‌ها را از درس‌های قبلی می‌شناسی.
    note: یک یادآوری کوتاه پیش از آن که این درس از این کلمه‌ها برای صحبت دربارهٔ هوا استفاده کند.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: هوا
    gloss: هوا
    note: کلمهٔ عمومی برای هوا یا حالت هوا.
    example_gloss: هوا چطور است؟
  pl.a1.unit19.lesson01.teach.zimno:
    title: سرد
    gloss: سرد
    note: حرارت هوا را بیان می‌کند -- برای جنسیت تغییر نمی‌کند.
    example_gloss: هوا سرد است.
  pl.a1.unit19.lesson01.teach.goraco:
    title: گرم
    gloss: گرم
    note: ضد '*zimno*' -- آن هم برای جنسیت تغییر نمی‌کند.
    example_gloss: هوا گرم است.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: هوا سرد است، هوا گرم است
    gloss: 'Jest zimno. Jest gorąco. -- در لهستانی هوا را این‌طور توضیح می‌دهیم: ''*jest*'' به اضافهٔ یک کلمهٔ هوا، بدون جنسیت.'
    note: همین الگوی ساده برای همهٔ کلمه‌های هوا در این بخش کار می‌کند.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: هوا چطور است؟
    gloss: هوا چطور است؟
    note: یک راه طبیعی برای پرسیدن از هوای حالا.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: امروز هوا سرد است
    gloss: امروز هوا سرد است.
    note: حقیقتی که تمام این بخش بر آن ساخته شده، برای هوای امروز.
  pl.a1.unit19.lesson02.teach.pada:
    title: باران می‌بارد
    gloss: باران می‌بارد
    note: بدون فاعل و به‌تنهایی به کار می‌رود؛ در لهستانی راه عادی گفتن «باران می‌بارد» همین است.
    example_gloss: امروز باران می‌بارد.
  pl.a1.unit19.lesson02.teach.snieg:
    title: برف
    gloss: برف
    note: کلمه‌ی برف -- با '*pada*' یعنی «برف می‌بارد».
    example_gloss: برف می‌بارد.
  pl.a1.unit19.lesson02.teach.mgla:
    title: مه
    gloss: مه
    note: یک حالت دیگر و رایج هوا.
    example_gloss: هوا مه‌آلود است.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: خوب
    gloss: Pogoda jest dobra. -- '*dobra*' با اسم‌های مؤنث مثل '*pogoda*' می‌آید.
    note: شکل مؤنث '*dobry*' (مثل '*Dzień dobry*') -- همان الگوی -y/-a مثل *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: وحشتناک
    gloss: Jaka straszna pogoda! -- '*straszna*' هم با '*pogoda*' می‌آید، درست مثل '*dobra*'.
    note: یک کلمه‌ی قوی -- فقط برای هوای واقعاً بد از آن استفاده کنید.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: چه هوای وحشتناکی!
    gloss: چه هوای وحشتناکی!
    note: یک عبارت تعجبی طبیعی درباره‌ی هوای بد.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: هوا خوب است
    gloss: هوا خوب است.
    note: استفاده‌ی دوباره از کلمه‌ی «هوا» که پیشتر در همین درس آمد.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: بلی، و، من، هم -- دوباره
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- شما این کلمه‌ها را از درس‌های پیشتر می‌دانین.
    note: یک یادآوری کوتاه پیش از گفتگوی این درس.
  pl.a1.unit19.lesson03.teach.bo:
    title: چون
    gloss: چون
    note: یک پلان را به دلیل هوایی‌اش وصل می‌کند.
    example_gloss: من به پارک نمی‌روم، چون باران می‌بارد.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: نمی‌خواهم بروم، چون باران می‌بارد
    gloss: نمی‌خواهم به پارک بروم، چون باران می‌بارد.
    note: توصیف هوا همراه با یک پلان واقعی -- دقیقاً همان چیزی که این بخش به آن می‌رسد.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: در کراکوف -- دوباره
    gloss: W Krakowie -- این را از درس‌های پیشتر می‌دانین، مثلاً 'Ona mieszka w Krakowie' (او در کراکوف زندگی می‌کند).
    note: یک یادآوری کوتاه پیش از آن‌که گفتگوی این درس هوای دو شهر را مقایسه کند.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek درباره‌ی هوا می‌پرسد
    gloss: امروز هوا چطور است؟
    note: Marek گفتگو را با پرسیدن از هوای امروز شروع می‌کند.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa جواب می‌دهد
    gloss: باران می‌بارد. هوا سرد است.
    note: Ewa هوای واقعی امروز را توصیف می‌کند.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek واکنش نشان می‌دهد و پلان می‌گیرد
    gloss: چه هوای وحشتناکی! نمی‌خواهم به پارک بروم، چون باران می‌بارد.
    note: Marek به هوا واکنش نشان می‌دهد و به همین سبب پلانش را می‌گوید.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa موافقت می‌کند
    gloss: من هم به پارک نمی‌روم.
    note: Ewa همان پلان Marek را می‌گیرد.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek درباره‌ی کراکوف می‌پرسد
    gloss: و در کراکوف؟ آنجا هوا چطور است؟
    note: Marek گفتگو را به هوای شهر دیگری می‌برد.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa جواب می‌دهد
    gloss: در کراکوف برف می‌بارد. آنجا هوا خیلی سرد است.
    note: Ewa حالت دیگری از هوا را در کراکوف توصیف می‌کند که سردتر است.
