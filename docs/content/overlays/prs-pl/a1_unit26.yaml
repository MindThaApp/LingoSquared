    gloss: 'Ewa: بلی، هر روز او را به گشت می‌برم و به او غذا می‌دهم.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek، Kasia و Tomek دربارهٔ حیوانات
    gloss: 'Marek و Kasia هر دو حیوانات را دوست دارند، اما هیچ‌کدامشان حیوان خانگی ندارد. Marek سگ‌ها را دوست دارد و Kasia گربه‌ها را. Tomek حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      kochają: خیلی دوست دارند
      oboje: هر دو
      zwierzęta: حیوانات
      zwierzaka: حیوان خانگی
      psy: سگ‌ها
      koty: پشک‌ها
      kota: پشک
      bawi: بازی می‌کند
      daje: می‌دهد
      co: هر
      jeść: غذا
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek اکثراً با گربه‌اش بازی می‌کند
    gloss: Tomek اکثراً با گربه‌اش بازی می‌کند.
    note: '*Bawić się z* (بازی کردن با) حالت وسیله‌ای می‌گیرد: *z kotem*. *Często* قید تکرار به معنی «اکثراً» است.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa از Nina می‌پرسد
    gloss: 'Ewa: Nina، تو هم حیوان خانگی داری؟'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina یک پرنده به نام Pico دارد
    gloss: 'Nina: بلی، یک پرنده دارم. نامش Pico است.'
    note: '*Ma na imię* (نامش است) همان عبارتی است که پیشتر برای معرفی نام به کار رفت.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: واکنش Marek
    gloss: 'Marek: چه خوب! هر روز با او چه کار می‌کنی؟'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina هر روز به او غذا می‌دهد
    gloss: 'Nina: هر روز به او غذا می‌دهم.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek هم پرنده‌ها را دوست دارد
    gloss: 'Marek: من هم پرنده‌ها را دوست دارم.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa گفتگو را تمام می‌کند
    gloss: 'Ewa: خوب است که هر سه ما حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره حیوانات در این درس را کنار هم جمع‌بندی می‌کند.
