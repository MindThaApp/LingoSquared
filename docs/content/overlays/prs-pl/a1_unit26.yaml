    gloss: به گردش بردن (حیوان)
    note: '*Wyprowadzać na spacer* عبارت ثابت برای گشت دادن حیوان است؛ فعل ناتمام است چون عادت را می‌رساند. یادداشت دستوری را ببینین.'
