  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: '*Nie mam* + حالت اضافی، چیزی را که ندارین منفی می‌کند: *zwierzaka*. یادداشت دستوری را ببینین.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + حالت اضافی
    gloss: 'بعد از *nie mam* مفعول در حالت اضافی می‌آید: *Nie mam czasu* (وقت ندارم) و اینجا *Nie mam zwierzaka* (حیوان خانگی ندارم).'
    note: این همان الگوی *Nie mam czasu* است؛ فقط اسم تازه است. اسم‌های مذکر جاندار مثل *zwierzak* در حالت مفعولی و اضافی یکسان به نظر می‌رسند، اما اسم‌های مؤنث تغییر را نشان می‌دهند (*Mam rybę* می‌شود *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
