    gloss: 'جمع: *pies* می‌شود *psy*، *kot* می‌شود *koty*، *ryba* می‌شود *ryby*، *ptak* می‌شود *ptaki*. بیشتر جمع‌ها به *-y* ختم می‌شوند و بعد از k و g به *-i*.'
    note: الگوی منظم جمع در لهستانی که اینجا برای اولین بار با اسم‌های حیوانات به عنوان نمونه معرفی می‌شود.
