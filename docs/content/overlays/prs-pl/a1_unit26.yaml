  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On و ona برای حیوانات
    gloss: 'حیوانات جنس دستوری دارند: *on* برای *pies* و *kot*، *ona* برای *ryba*. این ضمیرها می‌توانند به حیوان اشاره کنند، نه فقط به انسان.'
    note: 'ضمیر از جنس اسم پیروی می‌کند: *pies* و *ptak* با *on* می‌آیند، *ryba* با *ona* و *zwierzę* با *ono*.'
