    gloss: '*Wyprowadzać* (ناتمام) عادت را بیان می‌کند: *Codziennie wyprowadzam psa.* شکل تمام *wyprowadzić* برای یک گشتِ تمام‌شده به کار می‌رود.'
    note: 'جفت‌های نوع فعل: شکل ناتمام (*wyprowadzać*) برای کار تکراری است و شکل تمام (*wyprowadzić*) برای یک کار واحد و تمام‌شده.'
