  description: 'لهستانی مقدماتی برای صحبت دربارهٔ حیوانات خانگی و حیوانات معمول: نام بردن آن‌ها، مراقبت ساده (گشت دادن، غذا دادن، بازی کردن)، گفتن اینکه کدام حیوانات را دوست دارید حتی اگر حیوان خانگی ندارین، و جمع منظم لهستانی.'
