    note: جایی که انجنیری مثل Marek کار می‌کند.
    example_gloss: من در یک دفتر کار می‌کنم.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: در مکتب، در دفتر
    gloss: 'W + جای کار: w szkole، w biurze -- با همان الگوی w Warszawie یا w Krakowie.'
    note: این هم مثل نام شهرهایی است که قبلاً یاد گرفتی (*w Warszawie*، *w Krakowie*) -- آخر کلمه کمی تغییر می‌کند تا معنی *در* آن جا را برساند.
