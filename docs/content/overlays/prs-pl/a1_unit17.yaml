    gloss: Ewa معلم است.
    note: واقعیتی که این بخش دربارهٔ Ewa بر آن بنا شده است.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: کار کردن -- تو کار می‌کنی
    gloss: 'Pracować (pracuję را از درس‌های قبلی می‌شناسید): pracuję (من)، pracujesz (تو). تو کجا کار می‌کنی؟'
    note: فعلاً فقط دو شکل -- *pracuję* برای خودتان، *pracujesz* برای پرسیدن از دیگری، با همان الگوی *czuć się* در بخش قبلی.
