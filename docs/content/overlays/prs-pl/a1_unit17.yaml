    example_gloss:
    - او معلم است.
    - Ewa معلم است.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek و Ewa، دوباره
    gloss: Marek، Ewa -- این نام‌ها را از درس‌های قبلی می‌شناسید.
    note: یک یادآوری کوتاه پیش از این درس که از هر دو استفاده می‌کند.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: است -- دوباره
    gloss: Jest -- این کلمه را از درس‌های قبلی می‌شناسید، مثلاً 'Dom jest tam' (خانه آنجا است).
    note: یک یادآوری کوتاه پیش از این درس که از آن برای گفتن دربارهٔ شغل کسی استفاده می‌کند.
