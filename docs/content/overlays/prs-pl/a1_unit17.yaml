    title: من انجنیر / معلم هستم
    gloss: من انجنیر هستم. من معلم هستم. -- 'inżynier' و 'nauczycielka' بعد از 'Jestem' آخرشان تغییر می‌کند.
    note: این اولین بار در این کورس است که آخر یک کلمه تغییر می‌کند تا شغل شما را نشان بدهد -- فعلاً فقط برای همین دو کلمهٔ شغل صدق می‌کند.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: انجنیر
    gloss: انجنیر
    note: در لهستانیِ روزمره این کلمه برای زن هم معمولاً *inżynier* می‌ماند.
    example_gloss: Marek انجنیر است.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: معلم
    gloss: معلم (مرد) / معلم (زن)
