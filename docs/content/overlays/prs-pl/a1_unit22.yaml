teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*Zadzwonię* آیندهٔ کامل فعل *zadzwonić* (زنگ زدن، یک بار) است. پولندی آن را برای قول دادن به کار می‌برد، مثل «زنگ می‌زنم» در دری وقتی قول می‌تین.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: جواب دادن به تلفون
    gloss: سلام، اوا اینجاست.
    note: '*Tu* + نام (لفظاً «اینجا ...») شیوهٔ معمول معرفی خود در تیلفون است؛ در دری می‌گوییم «... اینجاست» یا «من ... هستم».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: مارک هم همین‌طور جواب می‌دهد
    gloss: سلام، مارک اینجاست.
    note: همان الگوی *tu* + نام مثل *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Z kim rozmawiam?* (لفظاً «با که صحبت می‌کنم؟») عبارت معمول برای تماس‌گیرندهٔ ناشناس است؛ *kim* بعد از *z* در حالت ابزاری است.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: معرفی رسمی خود
    gloss: شما با اوا صحبت می‌کنین.
    note: '*Rozmawia pan z Ewą* شکل رسمی است: *pan* (برای مرد) یا *pani* (برای زن) با فعل سوم شخص، و *z* + حالت ابزاری.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*Możesz* (می‌توانی، از *móc*) + مصدر *powtórzyć* (تکرار کردن) + *to* (این/آن).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*Nie mów* امر منفی است (صحبت نکن)؛ *tak szybko* یعنی «این‌قدر تیز».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: '*Nie słyszę cię dobrze* مشکل شنیدن را بیان می‌کند؛ *cię* حالت مفعولی ضمیر *ty* است و *dobrze* یعنی «خوب».'
  pl.a1.unit22.lesson04.teach.sms:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: '*SMS* اسم مذکر است و از زبان دیگر گرفته شده: *ten SMS*. در پولندی هر اسم جنس دستوری دارد.'
    example_gloss: پیامک از اوا است.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: '*Wysłać* (فرستادن) برای شخص حالت داتیو *ci* (به تو) و برای چیزی که فرستاده می‌شود حالت مفعولی می‌گیرد: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: '*Oddzwonić* (دوباره زنگ زدن) در پولندی یک فعل واحد است: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'مارک: سلام اوا، می‌توانی به من زنگ بزنی؟ باید چیزی به تو بگویم. اوا: بلی، البته، پنج دقیقهٔ دیگر زنگ می‌زنم.'
    note: دقت کنید مارک چی می‌خواهد، چرا، و اوا کی می‌گوید دوباره زنگ می‌زند.
    glosses:
      Cześć: سلام
      możesz: می‌توانی
      zadzwonić: زنگ زدن
      Muszę: باید
      coś: یک چیز
      powiedzieć: گفتن
      oczywiście: حتماً
      oddzwonię: زنگ زدن
      pięć: پنج
      minut: دقیقه
      za: دوباره
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: مارک تیلفون را جواب می‌دهد
    gloss: 'مارک: سلام، مارک اینجاست.'
    note: 'همان الگوی *tu* + نام از درس اول، حالا در تماس واقعی: کسی که تیلفون را جواب می‌دهد اول صحبت می‌کند و نامش را می‌گوید.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: اوا خودش را معرفی می‌کند
    gloss: 'اوا: سلام مارک، اوا اینجاست. مارک: چه خوب که زنگ زدی!'
    note: '*Fajnie, że* ... (چه خوب که ...) واکنش مثبت به یک رویداد را بیان می‌کند؛ *że* جملهٔ بعدی را وصل می‌کند.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: اوا دربارهٔ نوبت کاری می‌پرسد
    gloss: 'اوا: اولین نوبت کاری‌ات چطور گذشت؟'
    note: '*Jak ci poszła ...?* (لفظاً «... برایت چطور رفت؟») دربارهٔ چیزی می‌پرسد که گذشته است. *Ci* حالت داتیو *ty* است و *poszła* با اسم مؤنث *zmiana* هماهنگ است.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: مارک خبر خوب می‌دهد
    gloss: 'مارک: خیلی خوب گذشت، بهتر از آنچه فکر می‌کردم.'
    note: '*Poszło* گذشتهٔ *iść* با پایانهٔ *-o* («آن»؛ اینجا یعنی «سپری شدن») است؛ *myślałem* گذشتهٔ *myśleć* (فکر کردن) با پایانهٔ گوینده مرد است.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'زمان گذشته: było, poszło, myślałem'
    gloss: 'زمان گذشته: *było* (بود) از *być* (بودن)، *poszło* (رفت) از *iść* (رفتن)، *myślałem* (فکر کردم) از *myśleć* (فکر کردن).'
    note: 'گذشتهٔ پولندی با *-ł-* و پایانهٔ جنس ساخته می‌شود: *myślał* (او، مرد)، *myślała* (او، زن)، *było* (آن). فعلاً *było*، *poszło* و *myślałem* را به شکل ثابت در همین درس یاد بگیرین.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: اوا افتخار می‌کند
    gloss: 'اوا: چه خوب که شنیدم! به تو افتخار می‌کنم.'
    note: '*Dumny z* (افتخار کردن به) یک ترکیب ثابت است: *z* + حالت اضافی، پس *z ciebie*. اوا زن است، پس *dumna* می‌گوید.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: مارک متأثر می‌شود
    gloss: 'مارک: خیلی تشکر، این برایم خیلی معنا دارد.'
    note: '*Znaczy* شکل *on/ona/ono* فعل *znaczyć* (معنی دادن) است؛ *dla mnie* (برای من) نشان می‌دهد که این موضوع برای چه کسی مهم است.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Jego* (مال او، مرد) هیچ‌وقت تغییر نمی‌کند و پیش از اسم می‌آید: *jego pierwsza zmiana*؛ اسم مؤنث بر آن اثر ندارد.'
