teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: دیروز
    gloss: دیروز
    note: کلمهٔ اصلی برای صحبت دربارهٔ یک روز نزدیک و تمام‌شده -- به‌طور طبیعی با شکل‌های زمان گذشته‌ای که در این درس یاد می‌گیرین می‌آید.
    example_gloss: دیروز در سینما بودم.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: دیروز چه شد؟
    gloss: دیروز چه شد؟
    note: روش طبیعی برای خواستن حکایت یک رویداد تازه -- było برای کسی که جواب می‌دهد تغییر نمی‌کند، پس این سوال را از هر کسی می‌توانین بپرسین.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było شکل زمان گذشتهٔ «آن» (خنثی) فعل być (بودن) است -- با co (چه) می‌آید، وقتی به‌طور عمومی می‌پرسیم چه اتفاق افتاد: Co było wczoraj? همیشه همین یک کلمه است، جواب‌دهنده هر که باشد.'
    note: '*Było* شکل خنثای «بود» است -- با *co* (چه) مطابقت دارد، نه با کسی که از او می‌پرسید؛ برای همین در سوال باز مثل *Co było wczoraj?* به معنی «چه شد؟ / چه اتفاق افتاد؟» است.'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: من بودم (مرد / زن)
    gloss: من بودم (مرد می‌گوید) / من بودم (زن می‌گوید)
    note: 'زمان گذشتهٔ پولندی جنسیت گوینده را نشان می‌دهد: byłem اگر مرد صحبت کند، byłam اگر زن صحبت کند. هر دو دقیقاً یعنی «من بودم».'
    example_gloss:
    - دیروز در سینما بودم.
    - دیروز در سینما بودم.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'زمان گذشته: -em در برابر -am'
    gloss: 'فعل‌های زمان گذشته بسته به جنسیت گوینده ختم متفاوت دارند: وقتی مرد صحبت می‌کند -em (byłem)، وقتی زن صحبت می‌کند -am (byłam). این در مورد هر فعل زمان گذشته صدق می‌کند، نه فقط być.'
    note: 'به حروف آخر توجه کنید: *-em* نشان می‌دهد که مرد صحبت می‌کند و *-am* نشان می‌دهد که زن صحبت می‌کند. همین الگو را در هر فعل زمان گذشتهٔ این درس می‌بینین.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: در سینما
    gloss: 'Kino بعد از w ختم خود را تغییر می‌دهد: idę do kina (به کجا؟) شکل دیگری دارد از jestem w kinie (در کجا؟). W kinie حالت مکانی است -- می‌گوید چیزی در کجا اتفاق می‌افتد، نه این‌که کسی به کجا می‌رود.'
    note: 'دو ختم متفاوت، دو سوال متفاوت: *do kina* به «به کجا؟» جواب می‌دهد (این را در درس برنامه‌ها یاد گرفتید)، و *w kinie* به «در کجا؟» جواب می‌دهد -- این دو را باهم قاطی نکنین.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: دیروز در سینما بودم (مرد)
    gloss: دیروز در سینما بودم.
    note: byłem، wczoraj و w kinie را کنار هم می‌آورد -- روشی که یک مرد می‌گوید کجا بوده است.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: دیروز در سینما بودم (زن)
    gloss: دیروز در سینما بودم.
    note: همان جمله با byłam -- روشی که یک زن می‌گوید کجا بوده است.
  pl.a1.unit12.lesson02.teach.film:
    title: فلم
    gloss: فلم
    note: کلمه‌ای روزمره برای صحبت دربارهٔ چیزی که تماشا کرده‌اید -- وقتی از رفتن به سینما حکایت می‌کنین، همیشه به کار می‌آید.
    example_gloss: یک فلم خوب دیدم.
  pl.a1.unit12.lesson02.teach.dobry:
    title: خوب
    gloss: خوب
    note: dobry را قبلاً در dzień dobry (روز بخیر) دیده‌اید -- اینجا به‌تنهایی منحیث یک صفت معمولی به معنی «خوب» به کار رفته است.
    example_gloss: یک فلم بسیار خوب!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: من دیدم (مرد / زن)
    gloss: من دیدم (مرد می‌گوید) / من دیدم (زن می‌گوید)
    note: Zobaczyć یک عمل دیدنِ واحد و تمام‌شده را می‌رساند (در برابر widzieć که دیدنِ ادامه‌دار است) -- zobaczyłem اگر مرد صحبت کند، zobaczyłam اگر زن صحبت کند، همان الگوی -em/-am مثل byłem/byłam.
    example_gloss:
    - یک فلم خوب دیدم.
    - یک فلم خوب دیدم.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: همان الگوی byłem/byłam
    gloss: 'همان الگوی byłem/byłam: zobaczyłem را مرد می‌گوید و zobaczyłam را زن. Zobaczyć فعل کامل است -- یک رویداد تمام‌شده را بیان می‌کند.'
    note: 'همان ختم، فعل تازه: *zobaczyłem/zobaczyłam* دقیقاً از الگویی پیروی می‌کند که همین حالا با *byłem/byłam* یاد گرفتید.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: من ساختم / کردم (مرد / زن)
    gloss: من ساختم / کردم (مرد می‌گوید) / من ساختم / کردم (زن می‌گوید)
    note: Zrobić هم «ساختن» و هم «کردن» را برای یک کار تمام‌شده می‌رساند -- zrobiłem برای مرد، zrobiłam برای زن، باز همان الگو.
    example_gloss:
    - غذای چاشت پختم.
    - غذای چاشت پختم.
  pl.a1.unit12.lesson02.teach.obiad:
    title: غذای چاشت
    gloss: غذای چاشت / غذای میانروز
    note: شاید obiad را از درس عادت‌های روزانه به یاد داشته باشین -- اینجا غذای اصلی روز است که Marek آن را می‌پزد.
    example_gloss: این یک غذای چاشت لذیذ است.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: خوشمزه
    gloss: خوش‌مزه / لذیذ
    note: روش گرم و روزمره برای تعریف از غذا -- درست بعد از obiad به‌طور طبیعی می‌آید.
    example_gloss: این یک غذای چاشت لذیذ است.
  pl.a1.unit12.lesson03.teach.jaki:
    title: چه نوع / کدام
    gloss: چه نوع / کدام
    note: 'jaki را قبلاً در پرسش دربارهٔ نمبر تیلفون و روزهای هفته دیده‌اید -- اینجا هم به همان شکل برای پرسیدن یک جزئیات مشخص به کار می‌رود: کدام فلم؟'
    example_gloss: این چه نوع فلم است؟
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: سوال‌های کوتاه یک‌کلمه‌ای
    gloss: در گفتگو می‌توانین سوال کوتاه را فقط با یک کلمه بپرسین، مثلاً Pyszny? به‌جای سوال کامل Czy obiad był pyszny? -- طبیعی و سریع به نظر می‌رسد، درست مثل گفتگوی روزمره.
    note: در گفتگوی واقعی، وقتی از موقعیت معلوم باشد، جملهٔ کامل را نمی‌گویند -- *Pyszny?* به‌تنهایی یعنی «خوش‌مزه بود؟»
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek می‌پرسد چه شد
    gloss: سلام Ewa! دیروز چه شد؟
    note: همان سوال اول این درس را دوباره به کار می‌برد، این بار برای شروع یک گفتگوی واقعی.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa در سینما بود
    gloss: در سینما بودم! یک فلم خوب دیدم.
    note: Byłam و zobaczyłam هر دو (شکل زنانه) نشان می‌دهند که Ewa صحبت می‌کند.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek می‌پرسد کدام فلم
    gloss: کدام فلم؟
    note: یک سوال دنبالهٔ کوتاه و طبیعی با jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa جواب می‌دهد و می‌پرسد
    gloss: بسیار خوب! و تو؟
    note: A ty? (و تو؟) گفتگو را بدون هیچ گرامر تازه دوباره به Marek می‌دهد.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek غذا پخت
    gloss: غذای چاشت پختم!
    note: Zrobiłem (شکل مردانه) نشان می‌دهد که Marek صحبت می‌کند -- کار تمام‌شدهٔ خودش در همان روز.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa می‌پرسد خوش‌مزه بود؟
    gloss: خوشمزه؟
    note: سوال یک‌کلمه‌یی، دقیقاً مطابق الگوی یادداشت دستوری همین درس.
