teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: نقطهٔ آغاز برای تمام اعداد بعدی در این بخش.
    example_gloss: امروز صفر درجه است.
  pl.a1.unit02.lesson01.teach.jeden:
    title: یک
    gloss: یک
    note: '*Jeden* برخلاف همهٔ اعداد دیگر این درس، بعد از خود اسم عادی مفرد می‌گیرد.'
    example_gloss: من یک تلیفون دارم.
  pl.a1.unit02.lesson01.teach.dwa:
    title: دو
    gloss: دو
    note: '*Dwa*، *trzy* و *cztery* شکل جمع خاصی برای اسم می‌گیرند (مثل *psy*، «سگ‌ها») -- که با شکل جمع بعد از *pięć* و بالاتر فرق دارد.'
    example_gloss: من دو سگ دارم.
  pl.a1.unit02.lesson01.teach.trzy:
    title: سه
    gloss: سه
    note: 'همان الگوی جمع *dwa*: *trzy złote* (سه złoty)، نه *trzy złotych*.'
    example_gloss: قهوه سه złoty قیمت دارد.
  pl.a1.unit02.lesson01.teach.cztery:
    title: چهار
    gloss: چهار
    note: آخرین عدد از سه عددی (*dwa*، *trzy*، *cztery*) که این الگوی جمع را دارند.
    example_gloss: من چهار کتاب دارم.
  pl.a1.unit02.lesson01.teach.piec:
    title: پنج
    gloss: پنج
    note: از *pięć* به بعد، اعداد شکل جمع دیگری از اسم می‌گیرند (حالت ملکی جمع، مثلاً *minut* نه *minuty*) -- این الگو در بقیهٔ این بخش ادامه دارد.
    example_gloss: من پنج دقیقه وقت دارم.
  pl.a1.unit02.lesson01.teach.szesc:
    title: شش
    gloss: شش
    note: 'همان الگوی حالت ملکی جمع مثل *pięć*: *sześć jabłek* (شش سیب).'
    example_gloss: من شش سیب دارم.
  pl.a1.unit02.lesson01.teach.siedem:
    title: هفت
    gloss: هفت
    note: عدد مفید برای صحبت دربارهٔ روزهای هفته.
    example_gloss: در یک هفته هفت روز است.
  pl.a1.unit02.lesson01.teach.osiem:
    title: هشت
    gloss: هشت
    note: '*Mam osiem lat* لفظاً یعنی «من هشت سال دارم» -- در پولندی سن با فعل *mieć* («داشتن») بیان می‌شود. این الگو را در درس ۳ کامل تمرین می‌کنین.'
    example_gloss: من هشت ساله استم.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: نه
    gloss: نه
    note: 'باز هم حالت ملکی جمع: *dziewięć osób* (نُه نفر).'
    example_gloss: نُه نفر در صف انتظار استند.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: ده
    gloss: ده
    note: آخرین عدد یک‌رقمی -- درس ۲ با اعداد ۱۱ تا ۱۹ و دهه‌ها ادامه می‌یابد.
    example_gloss: من ده انگشت دارم.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: یازده
    gloss: یازده
    note: 'اعداد ۱۱ تا ۱۹ به *-naście* ختم می‌شوند. مثل *pięć* و بالاتر، حالت ملکی جمع می‌گیرند: *jedenaście osób*.'
    example_gloss: صنف یازده نفر دارد.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: دوازده
    gloss: دوازده
    note: همان الگوی *-naście* مثل *jedenaście*.
    example_gloss: در یک سال دوازده ماه است.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: پانزده
    gloss: پانزده
    note: 'هنوز هم الگوی *-naście*: *piętnaście minut* (پانزده دقیقه).'
    example_gloss: من پانزده دقیقه تفریح دارم.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: بیست
    gloss: بیست
    note: اعداد ۲۰ تا ۴۰ به *-dzieści* ختم می‌شوند -- الگویی متفاوت از *-naście*. خود *dwadzieścia* هم حالت ملکی جمع می‌گیرد (*dwadzieścia lat*)، اما در درس ۳ ببینین وقتی رقم یکان به آن اضافه شود چه می‌شود.
    example_gloss: عمرم بیست سال است.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: بیست و یک
    gloss: بیست و یک
    note: 'در پولندی عدد مرکب بدون کلمهٔ ربط ساخته می‌شود: اول دهگان، بعد یکان؛ در دری میان آن‌ها «و» می‌آید (بیست و یک).'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: سی
    gloss: سی
    note: هنوز الگوی *-dzieści* مثل *dwadzieścia*.
    example_gloss: تکت سی złoty قیمت دارد.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: پنجاه
    gloss: پنجاه
    note: اعداد ۵۰ تا ۹۰ الگوی سومی دارند، *-dziesiąt*، به‌جای *-dzieści*.
    example_gloss: من پنجاه złoty دارم.
  pl.a1.unit02.lesson02.teach.sto:
    title: صد
    gloss: صد
    note: یک عدد گرد ساده بدون ختم مرکب.
    example_gloss: این صد złoty قیمت دارد.
  pl.a1.unit02.lesson02.teach.ile:
    title: چقدر / چند
    gloss: چقدر؛ چند
    note: کلمهٔ پرسش برای پرسیدن دربارهٔ هر مقدار یا قیمت.
    example_gloss: این چقدر قیمت دارد؟
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: پرسیدن قیمت
    gloss: این چقدر قیمت دارد؟
    note: '*Kosztować* («قیمت داشتن») فعل است؛ *to* («این/آن») فاعل است. کل سوال یک الگوی ثابت و بسیار رایج است.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: گفتن قیمت
    gloss: این بیست złoty قیمت دارد.
    note: '*Złotych* حالت ملکی جمع *złoty* (واحد پول پولند) است -- همان شکل جمعی که خود *dwadzieścia* می‌گیرد.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: پرسیدن نمبر تلیفون، از یک مرد
    gloss: نمبر تلیفون شما چند است؟ (به مرد، رسمی)
    note: لفظاً «نمبر تلیفون آقا چند است». *Pana* شکل ملکی *pan* است -- «از آقا»، یعنی «شما».
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: پرسیدن نمبر تلیفون، از یک خانم
    gloss: نمبر تلیفون شما چند است؟ (به خانم، رسمی)
    note: برای خطاب رسمی به یک خانم، *pana* را با *pani* عوض کنید، مثل الگوی بخش ۱.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: پرسیدن نمبر تلیفون، غیررسمی
    gloss: نمبر تلیفونت چند است؟ (غیررسمی)
    note: '*Twój* («از تو»، غیررسمی) وقتی با دوست یا هم‌سن صحبت می‌کنین جای *pana*/*pani* می‌آید.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: گفتن نمبر، جملهٔ آغازین
    gloss: نمبر این است...
    note: جملهٔ آغازین کوتاه و طبیعی پیش از خواندن رقم‌ها یکی‌یکی -- روش عادی گفتن نمبر تلیفون در پولندی.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: یک نمبر تلیفون نمونه
    gloss: شش، یک، پنج، صفر، دو.
    note: نمبرهای تلیفون در پولندی رقم‌به‌رقم خوانده می‌شوند -- هر رقم اینجا عددی است که در این بخش آموخته‌اید.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: پرسیدن سن کسی، غیررسمی
    gloss: تو چند ساله استی؟ (غیررسمی)
    note: لفظاً «چند سال داری» -- در پولندی سن با *mieć* («داشتن») گفته می‌شود، همان الگویی که در کارت *osiem* درس ۱ دیدید.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: پرسیدن سن کسی، رسمی
    gloss: شما چند ساله استید؟ (به مرد، رسمی)
    note: '*Ma* همان شکل سوم‌شخص فعل است که در بخش ۱ با *pan jest*/*pan ma* دیدید -- *pan* از نظر دستوری «آقا»، یعنی فاعل سوم‌شخص، است.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: گفتن سن خود
    gloss: من بیست و هشت ساله هستم.
    note: '*Mam* شکل اول‌شخص *mieć* («داشتن») است. *Dwadzieścia osiem* به *osiem* (هشت) ختم می‌شود، پس مثل هر عددی که به ۵ تا ۹ ختم شود *lat* می‌گیرد -- در دیالوگ درس ۳ عددی را ببینین که ختم دیگری دارد.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa نمبر Marek را می‌پرسد
    gloss: Ewa به شکل رسمی نمبر تلیفون Marek را می‌پرسد.
    note: دقیقاً همان سوال رسمی نمبر تلیفون این درس را دوباره به کار می‌برد.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek نمبرش را می‌گوید
    gloss: Marek نمبر تلیفونش را رقم‌به‌رقم می‌خواند.
    note: همهٔ رقم‌ها قبلاً در درس‌های ۱ و ۲ این بخش آموخته شده‌اند.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa سن Marek را می‌پرسد
    gloss: Ewa تشکر می‌کند و به شکل رسمی سنش را می‌پرسد.
    note: '*Dziękuję* («تشکر») و *A* («و») با تغییر سطح رسمیت تغییر نمی‌کنند، مثل کارت *dziękuję* در بخش ۱.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek سنش را می‌گوید و سوال را برمی‌گرداند
    gloss: Marek می‌گوید بیست و هشت ساله است و به شکل رسمی سن Ewa را می‌پرسد.
    note: '*A pani?* سوال را به شکل رسمی به یک خانم برمی‌گرداند، همان الگوی کوتاهی که بخش ۱ برای *A pan?* آموخت.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa سنش را می‌گوید
    gloss: Ewa می‌گوید سی و دو ساله است.
    note: '*Trzydzieści dwa* به *dwa* (دو) ختم می‌شود، پس برخلاف *dwadzieścia osiem* (که به هشت ختم می‌شود و *lat* می‌گیرد)، این عدد *lata* می‌گیرد -- اعداد ختم‌شده به ۲، ۳ یا ۴ (به‌جز ۱۲ تا ۱۴) این شکل جمع دیگر را به کار می‌برند. *lat* و *lata* جای هم نمی‌آیند و درستی آن به رقم آخر عدد بستگی دارد.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek گفت‌وگو را تمام می‌کند
    gloss: Marek می‌گوید صحبت با او خوب بود و خدا حافظی می‌کند.
    note: '*Do zobaczenia* همان خدا حافظی «به امید دیدار» بخش ۱ را دوباره به کار می‌برد.'
