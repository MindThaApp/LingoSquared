teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: دوشنبه
    gloss: دوشنبه
    note: در تقویم لهستانی، هفته با این روز شروع می‌شود.
    example_gloss: امروز دوشنبه است.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: سه‌شنبه
    gloss: سه‌شنبه
    note: مراقب باشین -- وقتی می‌گویید «روز سه‌شنبه»، کلمهٔ *wtorek* حرف اضافهٔ *we* می‌گیرد، نه *w*. بعداً در همین درس بیشتر می‌خوانید.
    example_gloss: امروز سه‌شنبه است.
  pl.a1.unit03.lesson01.teach.sroda:
    title: چهارشنبه
    gloss: چهارشنبه
    note: در لهستانی این کلمه مؤنث است، برخلاف بیشتر روزهای دیگر هفته.
    example_gloss: امروز چهارشنبه است.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: پنجشنبه
    gloss: پنجشنبه
    note: همان الگوی مذکر مثل *poniedziałek*، *wtorek* و *piątek*.
    example_gloss: امروز پنجشنبه است.
  pl.a1.unit03.lesson01.teach.piatek:
    title: جمعه
    gloss: جمعه
    note: این روز را بعداً در همین واحد دوباره می‌بینین -- روزی که Ewa و Marek قرار می‌گذارند دوباره همدیگر را ببینند.
    example_gloss: امروز جمعه است.
  pl.a1.unit03.lesson01.teach.sobota:
    title: شنبه
    gloss: شنبه
    note: این روز جزو آخر هفته است؛ لهستانی‌ها برای آخر هفته کلمهٔ قرضی *weekend* را هم به کار می‌برند.
    example_gloss: امروز شنبه است.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: یکشنبه
    gloss: یکشنبه
    note: آخرین روز از هفت روز هفته که در این درس یاد می‌گیرین.
    example_gloss: امروز یکشنبه است.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: پرسیدن روز
    gloss: امروز چه روزی از هفته است؟
    note: یک شکل سوال مستقیم -- *dzień tygodnia* در اصل یعنی «روز هفته».
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: استثنای w و we
    gloss: روز دوشنبه، روز پنجشنبه، روز جمعه -- اما روز سه‌شنبه (برای تلفظ آسان‌تر).
    note: 'بیشتر روزهای هفته با «*w* + [روز]» به معنی «در روز ...» می‌آیند. *Wtorek* استثنای واقعی است: لهستانی‌ها *we wtorek* می‌گویند نه *w wtorek*، فقط چون گفتنش آسان‌تر است -- یک بی‌قاعدگی واقعی است، نه غلط املایی.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: روز جمعه به سینما می‌روم
    gloss: روز جمعه به سینما می‌روم.
    note: '*Piątek* بعد از *w* تغییر نمی‌کند -- فقط *środa*، *sobota* و *niedziela* تغییر می‌کردند (برای ساده ماندن سطح A1 در این درس نیامده است).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: جنوری، فبروری، مارچ
    gloss: جنوری؛ فبروری؛ مارچ
    note: از نظر دستوری *Luty* استثناست -- مثل صفت رفتار می‌کند، نه مثل اسم معمولی (شکل «در فبروری» آن را بعداً در همین واحد می‌بینین).
    example_gloss:
    - تولد من در جنوری است.
    - در فبروری به وارسا می‌روم.
    - تولد من در مارچ است.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: اپریل، می، جون
    gloss: اپریل؛ می؛ جون
    note: '*Maj* ماهی است که در داستان همین واحد برای هر دو تاریخ می‌بینین.'
    example_gloss:
    - در اپریل به وارسا می‌روم.
    - تولد من در می است.
    - در جون به وارسا می‌روم.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: جولای، اگست، سپتمبر
    gloss: جولای؛ اگست؛ سپتمبر
    note: 'یک بی‌قاعدگی واقعی دیگر: «در سپتمبر» *we wrześniu* است نه *w wrześniu* -- همان تعویض *we* برای تلفظ آسان‌تر که در *wtorek* دیدید.'
    example_gloss:
    - در جولای رخصتی هستم.
    - در اگست به وارسا می‌روم.
    - تولد من در سپتمبر است.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: اکتوبر، نومبر، دسمبر
    gloss: اکتوبر؛ نومبر؛ دسمبر
    note: سه ماه آخر سال که مجموعهٔ دوازده ماه را کامل می‌کنند.
    example_gloss:
    - در اکتوبر به وارسا می‌روم.
    - تولد من در ماه نومبر است.
    - در دسمبر رخصتی هستم.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: تولد
    gloss: تولد
    note: '*Urodziny* در لهستانی همیشه جمع دستوری است، حتی برای تولد یک نفر -- با *są* («استند») می‌آید، هرگز با *jest* («است»). همین نکته را بعداً در تمرینی از همین درس تمرین می‌کنین.'
    example_gloss: تولد من در می است.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: کی
    gloss: کی
    note: کلمهٔ پرسش برای پرسیدن دربارهٔ هر زمان.
    example_gloss: جلسه کی است؟
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: پرسیدن تولد کسی
    gloss: تولد تو کی است؟
    note: '*Są* نه *jest*، مطابق با *urodziny* که جمع است -- همان الگویی که در کارت *urodziny* گفته شد.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: گفتن تاریخ تولد
    gloss: تولد من دهم می است.
    note: '*Dziesiątego maja* -- روز به *-ego* ختم می‌شود و ماه به *-a*، بدون هیچ حرف اضافه. این شیوهٔ معمول گفتن تاریخ مشخص در لهستانی است؛ الگوی کامل را در یادداشت دستوری بعدی همین درس ببینین.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: پرسیدن زمان جلسه
    gloss: جلسه کی است؟
    note: '*Spotkanie* (جلسه، دیدار) -- کلمه‌ای که در گفتگوی درس سوم دوباره می‌بینین.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: گفتن تاریخ جلسه
    gloss: جلسه پانزدهم می است.
    note: همان الگوی تاریخ *-ego* + *-a* مثل *dziesiątego maja*، فقط با شمارهٔ روز دیگر.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: طرز گفتن تاریخ در لهستانی
    gloss: 'تاریخ: روز به -ego ختم می‌شود، ماه به -a (اما فبروری lutego است)، بدون حرف اضافه -- دهم می، پانزدهم می.'
    note: با «روز جمعه» (*w piątek*، که حرف اضافهٔ *w* لازم دارد) مقایسه کنید -- گفتن تاریخ مشخص تقویمی فرق دارد و هرگز حرف اضافه نمی‌گیرد.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: پیشنهاد دیدار دوباره
    gloss: کی می‌توانیم دوباره همدیگر را ببینیم؟
    note: '*Znowu* یعنی «دوباره» -- راه طبیعی برای شروع صحبت دربارهٔ وقت دیدار بعدی.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: پرسیدن رسمی از یک مرد که جمعه مناسب است یا نه
    gloss: آیا روز جمعه برای شما مناسب است؟ (به مرد، رسمی)
    note: '*Panu* شکل حالت داتیف *pan* است -- فعل *odpowiadać* («مناسب بودن») مفعولش را همیشه در حالت داتیف می‌گیرد. درست مثل «جمعه برای من مناسب است» که حرف اضافهٔ *برای* می‌گیرد.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: پرسیدن رسمی از یک زن که جمعه مناسب است یا نه
    gloss: آیا روز جمعه برای شما مناسب است؟ (به زن، رسمی)
    note: برای خطاب رسمی به زن، *panu* را با *pani* عوض کنید -- *pani* در حالت فاعلی و دادی یکسان می‌ماند، برخلاف *pan* و *panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: پرسیدن از دوست که آیا روز جمعه مناسب است (غیررسمی)
    gloss: جمعه برایت مناسب است؟ (غیررسمی)
    note: وقتی با دوست یا هم‌سن‌وسال خود صحبت می‌کنین، *ci* به جای *panu*/*pani* می‌آید -- شکل غیررسمی «برای تو».
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: گفتن اینکه جمعه برایتان مناسب است
    gloss: جمعه برایم مناسب است.
    note: '*Mi* شکل «برای من» است -- همان الگوی *panu*/*pani*/*ci*، فقط به جای «برای شما/تو» برای «من» به کار می‌رود.'
  pl.a1.unit03.lesson03.teach.data:
    title: تاریخ
    gloss: تاریخ (روز مشخص در تقویم)
    note: Data یعنی تاریخ مشخص یک روز در تقویم، مثلاً پانزدهم ماه؛ نه تاریخ به معنی گذشته‌های یک ملت.
    example_gloss: تاریخ آن چند خواهد بود؟
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: پرسیدن اینکه تاریخ چند خواهد بود
    gloss: تاریخ آن چند خواهد بود؟
    note: وقتی دو نفر روز هفته را قبول کرده‌اند ولی هنوز تاریخ دقیق را نمی‌دانند، این پرسش طبیعی است.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: ایوا پیشنهاد می‌کند دوباره همدیگر را ببینند
    gloss: ایوا از مارک می‌پرسد که کی دوباره می‌توانند همدیگر را ببینند.
    note: عین پرسش آغازین همین درس تکرار شده است.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: مارک روز جمعه را پیشنهاد می‌کند، رسمی
    gloss: مارک به شکل رسمی از ایوا می‌پرسد که جمعه برایش مناسب است یا نه.
    note: مارک ایوا را با *pani* خطاب می‌کند؛ همان سبک رسمی که از واحد اول ادامه دارد.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: ایوا قبول می‌کند و تاریخ را می‌پرسد
    gloss: ایوا می‌گوید جمعه برایش مناسب است، بعد می‌پرسد تاریخ دقیق چند خواهد بود.
    note: '*Tak* («بلی») که در واحد اول یاد گرفتید، جواب ایوا را شروع می‌کند، پیش از آنکه تاریخ دقیق را بپرسد.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: مارک تاریخ را می‌گوید
    gloss: مارک می‌گوید پانزدهم می.
    note: هر دو کلمهٔ اینجا قبلاً در درس دوم همین واحد یاد داده شده بودند.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: ایوا تأیید می‌کند و خداحافظی می‌کند
    gloss: ایوا می‌گوید عالی است و می‌گوید پانزدهم می می‌بینیم.
    note: '*Do zobaczenia* همان خداحافظی واحد اول است، حالا با یک تاریخ مشخص.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: مارک گفتگو را تمام می‌کند
    gloss: مارک هم خداحافظی می‌کند.
    note: کوتاه‌ترین پایان ممکن -- فقط خود خداحافظی.
