teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: کیله
    gloss: کیله
    note: میوهٔ معمول که در هر بازار یا دکان دانه‌دانه یا به وزن فروخته می‌شود.
    example_gloss: این یک کیله است.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: بانجان رومی، بادرنگ
    gloss: بانجان رومی؛ بادرنگ
    note: هر دو مذکرِ غیرجاندار استند -- شکل جمعِ ملکی‌شان (pomidorów, ogórków) وقتی بعداً در همین درس کیلویی می‌خرید، مهم می‌شود.
    example_gloss:
    - این یک بانجان رومی است.
    - این یک بادرنگ است.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: کچالو، پیاز
    gloss: کچالو؛ پیاز
    note: Ziemniak مذکرِ غیرجاندار است (از همان خانوادهٔ جمعِ ملکی -ów مثل banan و pomidor)؛ cebula مؤنث است.
    example_gloss:
    - این یک کچالو است.
    - این یک پیاز است.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: ارزان، گران
    gloss: ارزان؛ گران
    note: '*Tanio* و *drogo* قید استند و در پولندی مستقیم با *kosztować* («قیمت داشتن») می‌آیند، چیزی شبیه «گران تمام می‌شود» در دری -- *To kosztuje drogo* لفظاً یعنی «این گران قیمت دارد»، یعنی «این گران است.»'
    example_gloss:
    - خیلی ارزان!
    - خیلی گران!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'قیمت داشتن: kosztuje, kosztują'
    gloss: 'قیمت داشتن: قیمت دارد (یک چیز)، قیمت دارند (بیشتر از یکی) -- کیله ارزان است. کیله‌ها ارزان استند.'
    note: '*Kosztować* فعل «قیمت داشتن» است. برای یک چیز *kosztuje* و برای بیشتر از یکی *kosztują* بگویین -- درست مثل *jest*/*są* («است»/«استند»)، اما برای قیمت. درست گفتن این فرق مهم است: فروشندهٔ بازار در هر صورت شما را می‌فهمد، اما *banany kosztują* چیزی است که یک پولندی‌زبان واقعاً می‌گوید.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: یک کیله چند است؟
    gloss: یک کیله چند است؟
    note: پرسش هر روزه برای آغاز چانه‌زنی -- *Ile* («چقدر») به‌علاوهٔ *kosztuje* مفرد، چون دربارهٔ یک کیله می‌پرسند.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: گریپ‌فروت
    gloss: گریپ‌فروت
    note: مذکرِ غیرجاندار مثل pomidor و ziemniak -- بعد از proszę o پایانش تغییر نمی‌کند.
    example_gloss: این یک گریپ‌فروت است.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: نارنگی، مالته
    gloss: نارنگی؛ مالته
    note: هر دو مؤنث استند، مثل kawa و herbata در درس غذا -- در حالت مفعولی -a شان به -ę تبدیل می‌شود، اما این درس فقط شکل اصلی‌شان را لازم دارد.
    example_gloss:
    - این یک نارنگی است.
    - این یک مالته است.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: یک کیلو، نیم کیلو
    gloss: یک کیلو؛ نیم کیلو
    note: '*Kilo* هرگز پایانش را تغییر نمی‌دهد، چه چیزی را وزن کنید و چند کیلو بخواهید -- اسمی که بعد از *kilo* می‌آید تغییر می‌کند، چنان‌که یادداشت گرامر همین درس توضیح می‌دهد.'
    example_gloss:
    - یک کیلو بانجان رومی، لطفاً.
    - نیم کیلو کیله، لطفاً.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: می‌خواهم (لطفاً)
    gloss: می‌خواهم / لطفاً بتین
    note: '*Poproszę* جایگزین کمی مؤدبانه‌تر و روزمره برای *proszę o* از درس غذا است -- هر دو تقریباً یعنی «می‌خواهم» و پولندی‌زبانان آزادانه میان‌شان عوض می‌کنند. بعد از *Poproszę* مستقیم چیزی که می‌خواهین می‌آید و *o* لازم نیست.'
    example_gloss: یک گریپ‌فروت می‌خواهم، لطفاً.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'بعد از ''kilo'': پایان -ów'
    gloss: 'جمعِ ملکی بعد از ''kilo'': کیله -> «از کیله‌ها»، بانجان رومی -> «از بانجان رومی‌ها»، کچالو -> «از کچالوها».'
    note: 'وقتی مقدار را با وزن می‌گویید -- *kilo*، *pół kilo* -- اسمی که بعدش می‌آید به شکل دیگری، یعنی جمعِ ملکی، تغییر می‌کند. برای این سه اسم مذکرِ باقاعده، فقط *-ów* اضافه می‌شود: *banan* به *bananów*، *pomidor* به *pomidorów* و *ziemniak* به *ziemniaków* تبدیل می‌شود.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: یک کیلو بانجان رومی، لطفاً
    gloss: یک کیلو بانجان رومی، لطفاً.
    note: الگوی -ów یادداشت گرامر را در یک درخواست واقعی به کار می‌برد -- pomidor بعد از kilo به pomidorów تبدیل می‌شود.
  pl.a1.unit07.lesson03.teach.dla:
    title: برای
    gloss: برای
    note: یک حرف اضافهٔ ساده به معنای «برای» -- فروشنده آن را در *Co dla pani?* (لفظاً «برای شما چه؟») به کار می‌برد تا رسمی از مشتری بپرسد چه می‌خواهد.
    example_gloss: این برای شما است.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: تازه، خیلی
    gloss: تازه؛ خیلی
    note: دو کلمهٔ روزمره که فروشندهٔ بازار دایم به کار می‌برد -- برای ستایش تازگی جنس، یا ارزانی و گرانی آن.
    example_gloss:
    - بانجان رومی‌ها تازه استند.
    - خیلی ارزان!
  pl.a1.unit07.lesson03.teach.trochę:
    title: کمی
    gloss: کمی
    note: شکایت را مؤدبانه نرم می‌کند -- trochę drogo («کمی گران») در چانه‌زنی دوستانه خیلی طبیعی‌تر از drogo تنها است.
    example_gloss: کمی گران.
  pl.a1.unit07.lesson03.teach.razem:
    title: مجموعاً
    gloss: مجموعاً
    note: چیزی که فروشنده درست پیش از گفتن مبلغ نهایی می‌گوید.
    example_gloss: مجموعاً ده زلوتی.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: چی می‌خواهین؟
    gloss: چی می‌خواهین؟
    note: لفظاً «برای شما چه؟» (رسمی) -- پرسش آغازین طبیعی فروشنده از مشتری.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: فروشنده به اوا سلام می‌دهد
    gloss: فروشنده سلام می‌دهد و از اوا می‌پرسد چه می‌خواهد.
    note: Dzień dobry، که از سلام‌های درس اول دوباره آمده است.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: اوا از کیله‌ها می‌پرسد
    gloss: اوا می‌پرسد کیله‌ها چند است.
    note: Kosztują -- شکل جمع از قاعدهٔ دستوری همین واحد، چون دربارهٔ کیله‌ها به صورت گروهی پرسیده می‌شود.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: دوکاندار قیمت را می‌گوید
    gloss: دوکاندار می‌گوید کیلویی پنج زلوتی است و خیلی تازه است.
    note: یک عبارت کوتاه و طبیعی برای قیمت -- دوکاندار پولندی قیمت هر کیلو را به شکل «[قیمت] kilo» می‌گوید و برای «کیلویی» کلمهٔ جداگانه لازم نیست.
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: ایوا کیله سفارش می‌دهد
    gloss: ایوا می‌گوید خوب است و یک کیلو کیله می‌خواهد.
    note: poproszę با kilo + bananów یکجا آمده؛ دقیقاً همان الگوی قاعدهٔ دستوری درس دوم.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: دوکاندار از بانجان رومی یاد می‌کند
    gloss: دوکاندار دربارهٔ بانجان رومی هم می‌پرسد و می‌گوید کیلویی هشت زلوتی است.
    note: همان الگوی کوتاه قیمت جملهٔ سوم، حالا برای جنس دیگر.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: ایوا آرام چانه می‌زند و سفارش می‌دهد
    gloss: ایوا می‌گوید کمی گران است، اما نیم کیلو می‌گیرد.
    note: Trochę drogo شکایت را نرم می‌سازد -- ایوا بازهم می‌خرد، فقط مقدار کمتر.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: دوکاندار مجموع را می‌گوید
    gloss: دوکاندار می‌گوید بفرمایید و مجموع نُه زلوتی می‌شود.
    note: ۵ زلوتی برای کیله به‌علاوهٔ ۴ زلوتی برای نیم کیلو بانجان رومی -- جمعاً نُه زلوتی؛ مطابق همهٔ قیمت‌هایی که پیشتر در صحنه گفته شد.
