teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: بانک، پوسته‌خانه
    gloss: بانک؛ پوسته‌خانه
    note: دو کار روزمرهٔ معمولی -- bank با کلمهٔ مشابه در زبان‌های دیگر شباهت دارد؛ poczta جایی است که برای فرستادن نامه یا بسته می‌رین.
    example_gloss:
    - این یک بانک است.
    - این یک پوسته‌خانه است.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: دواخانه، رستورانت
    gloss: دواخانه؛ رستورانت
    note: Apteka جایی است که دوا می‌خرید (نه دوکان عمومی)؛ restauracja شبیه کلمهٔ «رستورانت» است.
    example_gloss:
    - این یک دواخانه است.
    - این یک رستورانت است.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: هوتل؛ پارک
    note: هر دو شبیه کلمه‌های آشنا استند -- هم در نوشتن و هم در گفتن به‌آسانی شناخته می‌شوند.
    example_gloss:
    - این یک هوتل است.
    - این یک پارک است.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: '[جا] کجاست؟'
    gloss: '[جا] کجاست؟ -- «کجا» همراه با «است» دربارهٔ موقعیت می‌پرسد: بانک کجاست؟ دواخانه کجاست؟'
    note: '*Gdzie* یعنی «کجا» و *jest* یعنی «است» -- با هم، *Gdzie jest...?* الگوی روزمرهٔ پرسیدن جای هر مکان است. وقتی دربارهٔ یک مکان می‌پرسید همین‌طور به کار ببرید؛ برای چند مکان، پولندی به‌جای آن *są* («استند») می‌گوید.'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: بانک کجاست؟
    gloss: بانک کجاست؟
    note: الگوی قاعدهٔ دستوری با اولین کلمهٔ مکان این درس به کار رفته است.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: نزدیک، دور
    gloss: نزدیک؛ دور
    note: یک جفت متضاد ساده، که مستقیم بعد از jest می‌آید تا بگوید جایی نزدیک است یا دور.
    example_gloss:
    - پارک نزدیک است.
    - هوتل دور است.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: نه چندان دور
    gloss: نه چندان دور
    note: در اصل *nie* («نه») و *daleko* («دور») که در یک کلمه یکجا شده‌اند -- راهی نرم و بسیار رایج برای اطمینان دادن به کسی که جایی دسترسی آسان دارد.
    example_gloss: دواخانه چندان دور نیست.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: پهلوی، روبه‌روی
    gloss: پهلوی؛ روبه‌روی
    note: هر دو موقعیت یک جا را نسبت به یک نشانه می‌گویند، نه فقط اینکه چقدر نزدیک است. هر دو می‌خواهند اسم بعدی به حالت اضافی برود -- قاعدهٔ دستوری همین درس را ببینین.
    example_gloss:
    - دواخانه پهلوی بانک است.
    - رستورانت روبه‌روی هوتل است.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'بعد از «پهلوی»/«روبه‌روی»/«نزدیک + اسم»: حالت اضافی'
    gloss: 'بعد از «پهلوی»/«روبه‌روی»/«نزدیک + جا»: حالت اضافی -- بانک، هوتل، پارک در پولندی شکل دیگری می‌گیرند. دواخانه پهلوی بانک است. رستورانت روبه‌روی هوتل است. رستورانت نزدیک پارک است.'
    note: '*Obok*، *naprzeciwko* و *blisko* (وقتی بعدش یک مکان بیاید، نه تنها) همه حالت اضافی می‌خواهند، پس پایان اسم بعدی تغییر می‌کند. برای این سه اسم مذکرِ باقاعده، یعنی افزودن *-u*: *bank* به *banku*، *hotel* به *hotelu* و *park* به *parku* تبدیل می‌شود. *blisko* به‌تنهایی اصلاً حالت اضافی نمی‌خواهد -- *To jest blisko* («آن نزدیک است») درست همان‌قدر درست است که *blisko parku* («نزدیک پارک»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: دواخانه پهلوی بانک است
    gloss: دواخانه پهلوی بانک است.
    note: الگوی -u یادداشت دستور را در یک جمله واقعی به کار می‌برد — bank بعد از obok به banku تبدیل می‌شود.
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: معذرت
    gloss: معذرت
    note: راه معمول برای جلب توجه یک آدم ناشناس پیش از پرسیدن سؤال — پیش از خود سؤال گفته می‌شود، نه بعد از آن.
    example_gloss: معذرت، بانک کجاست؟
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: ایوا دواخانه را می‌پرسد
    gloss: ایوا می‌گوید معذرت و می‌پرسد دواخانه کجاست.
    note: Przepraszam سؤال را باز می‌کند، همان‌طور که یادداشت واژگان این درس می‌گوید — حتی با کسی که می‌شناسد، مثل مارک، این راه مؤدبانهٔ قطع کردن صحبت پیش از پرسیدن چیزی است.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: مارک جای دواخانه را می‌گوید
    gloss: مارک می‌گوید دواخانه دور نیست، پهلوی بانک است.
    note: niedaleko و obok + banku را یکجا به کار می‌برد؛ هر دو از یادداشت دستور درس ۲ استند.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: ایوا از مارک تشکر می‌کند و دربارهٔ رستوران می‌پرسد
    gloss: ایوا تشکر می‌کند و می‌پرسد رستوران کجاست.
    note: Dziękuję از درس‌های پیشین تکرار شده است؛ A (و) سؤال تازه را به سؤال قبلی وصل می‌کند.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: مارک جای رستوران را می‌گوید
    gloss: مارک می‌گوید رستوران روبه‌روی هوتل و نزدیک پارک است.
    note: Naprzeciwko + hotelu (حالت اضافه، با همان الگوی banku) و blisko برای نشانی دومی.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: ایوا دوباره از مارک تشکر می‌کند
    gloss: ایوا می‌گوید خیلی تشکر.
    note: Bardzo (خیلی) معنی dziękuję را قوی‌تر می‌کند، درست مثل proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: مارک جواب می‌دهد
    gloss: مارک می‌گوید خواهش می‌کنم.
    note: Proszę bardzo جواب معمول به تشکر است که در درس خریداری هم آمده بود.
