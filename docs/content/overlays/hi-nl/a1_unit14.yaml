teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: तुलनात्मक रूप बनाना
    gloss: तुलना में आप अक्सर विशेषण में -er जोड़ते हैं और dan का उपयोग करते हैं।
    note: '*Dan* का अर्थ है "से" (तुलना में)। यह हमेशा तुलनात्मक विशेषण के बाद आता है।'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: बड़ा, छोटा
    gloss: बड़ा, छोटा
    note: '*Groot* और *klein* मूल विशेषण हैं, -er जोड़ने से पहले के रूप में।'
    example_gloss:
    - बैकपैक बड़ा है।
    - थैला छोटा है।
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: बैकपैक ज़्यादा बड़ा है
    gloss: बैकपैक थैले से बड़ा है।
    note: '*Groter* यानी *groot* + *er*; *dan* तुलना की जा रही दूसरी चीज़ को लाता है।'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: थैला ज़्यादा छोटा है
    gloss: थैला बैकपैक से छोटा है।
    note: '*Kleiner* यानी *klein* + *er*, उसी नियम से।'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: बैकपैक की कीमत
    gloss: बैकपैक की कीमत पैंतालीस यूरो है।
    note: '*Kost* क्रिया *kosten* (कीमत होना) का तृतीय पुरुष एकवचन रूप है।'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: थैले की कीमत
    gloss: थैले की कीमत बीस यूरो है।
    note: बैकपैक से कम कीमत, जो आगे आने वाली तुलना की तैयारी है।
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: महँगा, सस्ता
    gloss: महँगा, सस्ता
    note: '*Duur* और *goedkoop* मूल विशेषण हैं, *-der*/*-er* जोड़ने से पहले के रूप में।'
    example_gloss:
    - बैकपैक महँगा है।
    - थैला सस्ता है।
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: बैकपैक ज़्यादा महँगा है
    gloss: बैकपैक थैले से महँगा है।
    note: '*Duurder* यानी *duur* + *der*। जो शब्द पहले से r पर समाप्त होता है, उसमें डच *-er* नहीं बल्कि *-der* जोड़ती है।'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: थैला ज़्यादा सस्ता है
    gloss: थैला बैकपैक से सस्ता है।
    note: '*Goedkoper* यानी *goedkoop* + *er*, पिछले वाक्य का उलटा रूप।'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: बराबरी की तुलना
    gloss: दो चीज़ों की बराबरी बताने के लिए net zo + विशेषण + als का उपयोग कीजिए।
    note: हिंदी के "उतना ही ... जितना" वाली बनावट की तरह डच में net zo ... als आता है।
  nl.a1.unit14.lesson03.teach.mooi:
    title: उतना ही सुंदर
    gloss: यह बैकपैक उस थैले जितना ही सुंदर है।
    note: '*Mooi* (सुंदर) *net zo* और *als* के बीच बिना बदले आता है; इस बनावट में -er नहीं लगता।'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: उतना ही व्यावहारिक
    gloss: बैकपैक थैले जितना ही व्यावहारिक है।
    note: कोई भी साधारण विशेषण *net zo ... als* की इसी जगह पर आ सकता है।
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: उत्तमावस्था बनाना
    gloss: उत्तमावस्था के लिए आप अक्सर het + विशेषण + st का उपयोग करते हैं।
    note: यह रूप (*is* के बाद आने पर) संज्ञा के लिंग से स्वतंत्र होकर हमेशा *het* लेता है।
  nl.a1.unit14.lesson04.teach.duurst:
    title: दोनों में सबसे महँगा
    gloss: इन दोनों में रकसैक सबसे महँगा है।
    note: '*Duurst* यानी *duur* + *st*। डच में केवल दो विकल्पों की तुलना करते समय भी उत्तमावस्था का रूप इस्तेमाल हो सकता है।'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'अनियमित रूप: goed, beter, best'
    gloss: 'Goed, beter, best अनियमित हैं: यह सबसे अच्छा विकल्प है। Veel, meer, meest भी इसी तरह चलते हैं।'
    note: दोनों शृंखलाएँ (*goed/beter/best* और *veel/meer/meest*) सामान्य -er/-st नियम का पालन नहीं करतीं।
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: सफ़र के लिए सबसे अच्छा विकल्प
    gloss: लंबी ट्रेन यात्रा के लिए यह रकसैक सबसे अच्छा विकल्प है।
    note: '*Beste* विशेषण का वह रूप है जो संज्ञा से पहले आता है; इसमें वही -e लगता है जो डच विशेषण आम तौर पर संज्ञा से पहले लेते हैं।'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: ज़्यादा जगह
    gloss: रकसैक में बैग से ज़्यादा जगह है।
    note: '*Meer*, *veel* (बहुत) का अनियमित तुलनात्मक रूप है।'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: दुकान का विज्ञापन पढ़ें
    gloss: 'रकसैक Bergsport: पैंतालीस यूरो। यह रकसैक बड़ा और मज़बूत है। कंधे का बैग Stad: बीस यूरो। यह बैग रकसैक से छोटा और हल्का है, लेकिन कम मज़बूत है। लंबी यात्रा के लिए रकसैक सबसे अच्छा विकल्प है, क्योंकि वह ज़्यादा मज़बूत है और उसमें ज़्यादा जगह है।'
    note: दोनों उत्पादों की कीमत और आकार पर ध्यान दीजिए, और यह भी कि विज्ञापन किसे सुझाता है और क्यों।
    glosses:
      Rugzak: रकसैक
      vijfenveertig: पैंतालीस
      euro: यूरो
      groot: बड़ी
      sterk: मज़बूत
      Schoudertas: कंधे का बैग
      twintig: बीस
      tas: बैग
      kleiner: ज़्यादा छोटा
      lichter: ज़्यादा हल्का
      minder: कम
      lange: लंबा
      reis: यात्रा / सफ़र
      beste: सबसे अच्छा
      keuze: विकल्प
      sterker: ज़्यादा मज़बूत
      ruimte: जगह
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte आकार की ओर इशारा करती है
    gloss: 'Lotte: देखो, यह रकसैक उस बैग से बड़ा है।'
    note: '*Kijk* (देखो) किसी का ध्यान किसी चीज़ की ओर खींचने का आम तरीका है।'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar बताता है कि उसे यह क्यों चाहिए
    gloss: 'Omar: हाँ, और उसमें ज़्यादा जगह है। मुझे ट्रेन यात्रा के लिए एक बड़ा बैग चाहिए।'
    note: '*Nodig hebben* (ज़रूरत होना) एक पक्का मेल है; जिस चीज़ की ज़रूरत हो, वह *hebben* और *nodig* के बीच आती है।'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte विकल्प की पुष्टि करती है
    gloss: 'Lotte: तो फिर तुम्हारे लिए रकसैक सबसे अच्छा विकल्प है।'
    note: यहाँ *Dan* का मतलब 'तो फिर' है, पाठ 1 वाला तुलना का *dan* ('से') नहीं; दोनों की वर्तनी एक ही है।
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar, Lotte की राय पूछता है
    gloss: 'Omar: बिल्कुल। तुम्हें कौन-सा बैग सबसे सुंदर लगता है?'
    note: '*Vind jij het mooist* में राय बताने का वही ढाँचा है जो Unit 13 के *vinden* वाले पाठों में था।'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte कंधे का बैग चुनती है
    gloss: 'Lotte: मुझे यह कंधे का बैग सबसे सुंदर लगता है। और यह हल्का भी है।'
    note: '*Licht* (वज़न में हल्का) बैग और सामान का वर्णन करने के लिए एक नया, उपयोगी विशेषण है।'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: वे फ़ैसला पक्का करते हैं
    gloss: 'Omar: ठीक है, तो मैं रकसैक लेता हूँ और तुम कंधे का बैग।'
    note: दूसरे उपवाक्य में दोहराई गई क्रिया *koop* छोड़ दी गई है; संदर्भ से बात साफ़ हो तो बोलचाल की डच में यह स्वाभाविक है।
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop और koopt
    gloss: Koop, kopen (खरीदना) का 'मैं' वाला रूप है; koopt 'वह' वाला रूप है।
    note: 'वर्तमान काल का नियमित ढाँचा: *ik koop*, *jij/hij/zij koopt*।'
