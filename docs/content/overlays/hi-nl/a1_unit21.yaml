teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: खुश, उदास और नाराज़
    gloss: खुश, उदास, नाराज़
    note: तीन बुनियादी, आम भावना-शब्द, जिन्हें zijn (होना) के साथ यह बताने के लिए इस्तेमाल किया जाता है कि आप कैसा महसूस करते हैं।
    example_gloss:
    - मैं खुश हूँ।
    - मैं उदास हूँ।
    - मैं नाराज़ हूँ।
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: खुश होने की बात कहना
    gloss: मैं खुश हूँ।
    note: '*Zijn* (होना) + भावना बताने वाला विशेषण बुनियादी ढाँचा है, जैसे हिंदी में "मैं ... हूँ"।'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: भावनाओं की तुलना करना
    gloss: मैं नाराज़ नहीं हूँ, मैं उदास हूँ।
    note: '*Niet* सीधे *boos* को नकारता है; फिर दूसरा उपवाक्य असली भावना बताता है।'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: कारण पूछना
    gloss: तुम खुश क्यों हो?
    note: '*Waarom* (क्यों) कारण पूछने का सामान्य प्रश्नवाचक शब्द है।'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: कारण बताना
    gloss: मैं खुश हूँ क्योंकि मेरे पास नया अपार्टमेंट है।
    note: '*Omdat* (क्योंकि) कारण वाला उपवाक्य शुरू करता है; उस उपवाक्य में क्रिया अंत में चली जाती है (*heb*, *appartement* के बाद आ जाता है)।'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: नकारात्मक कारण
    gloss: मैं उदास हूँ क्योंकि बारिश हो रही है।
    note: मौसम वाली इकाई का *regent* (बारिश हो रही है) यहाँ कारण वाले उपवाक्य में फिर इस्तेमाल हुआ है।
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: घबराया हुआ
    gloss: घबराया हुआ
    note: घबराहट के लिए सामान्य शब्द।
    example_gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: बताना कि किस बात से घबराहट है
    gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
    note: '*Voor* (शाब्दिक अर्थ ''के लिए'') बताता है कि घबराहट किस बात को लेकर है; हिंदी में हम यहाँ ''को लेकर'' कहते हैं।'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: किसी को तसल्ली देना
    gloss: चिंता मत करो।
    note: '*Maak je geen zorgen* (शाब्दिक अर्थ ''अपने लिए चिंताएँ मत बनाओ'') तसल्ली देने का मानक, बँधा हुआ वाक्यांश है।'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: पूछना कि कोई कैसा महसूस करता है
    gloss: Omar कैसा महसूस करता है?
    note: '*Voelen zich* (महसूस करना, स्ववाचक) भावनात्मक स्थिति पूछने या बताने का सामान्य तरीका है; यह इकाई 16 के स्वास्थ्य वाले पाठों में आए शारीरिक *voelen* से अलग है।'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: बताना कि कोई कैसा महसूस करता है
    gloss: वह घबराया हुआ महसूस कर रहा है।
    note: '*Zich* (स्वयं को) अन्य पुरुष का स्ववाचक सर्वनाम है, जो *voelt* के साथ आता है।'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: पूछना कि कोई ऐसा क्यों महसूस करता है
    gloss: वह घबराया हुआ क्यों महसूस कर रहा है?
    note: यह *waarom* को *Hij voelt zich zenuwachtig* वाले *voelt zich* ढाँचे के साथ जोड़ता है।
  nl.a1.unit21.lesson05.teach.bericht:
    title: भावनाओं के बारे में एक संदेश पढ़ें
    gloss: नमस्ते Lotte, मैं अपनी पहली अकेली शिफ़्ट को लेकर थोड़ा घबराया हुआ हूँ। लेकिन मैं खुश भी हूँ, क्योंकि मुझे नई नौकरी और नया अपार्टमेंट मिला है। मुझे लगता है सब ठीक हो जाएगा।
    note: ध्यान दें कि लिखने वाला किस बात से घबराया है, किस बात से खुश है, और कुल मिलाकर उसका नज़रिया क्या है।
    glosses:
      beetje: थोड़ा
      zenuwachtig: घबराया हुआ
      eerste: पहली
      dienst: शिफ़्ट
      alleen: अकेला
      blij: खुश
      want: क्योंकि
      nieuwe: नया
      baan: काम
      nieuw: नया
      appartement: अपार्टमेंट
      denk: सोचना, मानना
      komt: 'चल जाएगा (यहाँ: सब ठीक हो जाएगा)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte पूछती है कि Omar कैसा महसूस कर रहा है
    gloss: 'Lotte: नमस्ते Omar, अपनी पहली शिफ़्ट को लेकर तुम कैसा महसूस कर रहे हो?'
    note: '*Voor je eerste dienst* (तुम्हारी पहली शिफ़्ट को लेकर) में *voor* + संज्ञा वाला वही ढाँचा है जो पाठ 3 में था।'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar मानता है कि वह घबराया हुआ है
    gloss: 'Omar: सच कहूँ तो मैं थोड़ा घबराया हुआ हूँ।'
    note: '*Eerlijk gezegd* (सच कहूँ तो) इस स्वीकारोक्ति को नरम बना देता है।'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte उसे तसल्ली देती है
    gloss: 'Lotte: चिंता मत करो, तुम यह अच्छे से कर लोगे!'
    note: '*Je kunt het goed* (शाब्दिक अर्थ ''तुम इसे अच्छे से कर सकते हो'') हौसला बढ़ाने वाला बँधा हुआ वाक्यांश है।'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar उसे धन्यवाद देता है
    gloss: 'Omar: शुक्रिया, इससे सच में मदद मिलती है।'
    note: '*Helpt*, *helpen* (मदद करना) का अन्य पुरुष एकवचन रूप है।'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte आगे का अनुमान लगाती है
    gloss: 'Lotte: और बाद में तुम ज़रूर बहुत खुश और गर्वित होगे।'
    note: '*Vast* (ज़रूर, पक्का) भरोसे के साथ अनुमान जताता है; *trots* (गर्वित) एक नया, उपयोगी विशेषण है।'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar सहमत होता है
    gloss: 'Omar: हाँ, मुझे भी ऐसा ही लगता है।'
    note: '*Dat denk ik ook* (शाब्दिक अर्थ ''वह मैं भी सोचता हूँ'') किसी की राय से सहमति जताने का स्वाभाविक तरीका है।'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: is, zijn और hem के साथ सार
    gloss: Omar अपनी पहली शिफ़्ट को लेकर घबराया हुआ है। Lotte उसकी मदद करती है।
    note: '*Is*, *zijn* (होना) का अन्य पुरुष एकवचन रूप है; यहाँ *zijn* का अर्थ ''उसका'' (संबंधवाचक) है; *hem* का अर्थ ''उसे'' (कर्म सर्वनाम) है -- किसी और के बारे में बात करने के लिए तीन छोटे लेकिन ज़रूरी शब्द।'
