teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: फ़ोन करना
    gloss: फ़ोन करना
    note: फ़ोन कॉल करने वाली क्रिया का मूल रूप (क्रिया का मूल रूप)।
    example_gloss: मुझे तुम्हें फ़ोन करना है।
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: फ़ोन करने की बात कहना
    gloss: मैं तुम्हें फ़ोन करूँगा।
    note: '*Bel*, *bellen* का ik के साथ आने वाला रूप है; डच यहाँ वर्तमान काल का प्रयोग करता है, जबकि हिंदी में आम तौर पर भविष्य काल (''फ़ोन करूँगा'') कहा जाता है।'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: फ़ोन उठाना
    gloss: हैलो, मैं लॉटे बोल रही हूँ।
    note: 'फ़ोन पर अपना परिचय देने का मानक डच तरीका *met* + नाम है (शाब्दिक अर्थ: ''नाम के साथ'')। हिंदी में हम "मैं ... बोल रहा हूँ" कहते हैं, डच में बस met और नाम कहा जाता है।'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: ओमार भी इसी तरह जवाब देता है
    gloss: हैलो, मैं ओमार बोल रहा हूँ।
    note: वही *met* + नाम वाला ढाँचा, जो *Hallo, met Lotte* में है।
  nl.a1.unit22.lesson02.teach.met_wie:
    title: पूछना कि फ़ोन किसका है
    gloss: मैं किससे बात कर रहा हूँ?
    note: '*Met wie spreek ik?* अनजान फ़ोन करने वाले से औपचारिक रूप से पूछने का मानक वाक्य है।'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: औपचारिक ढंग से अपना परिचय देना
    gloss: आप लॉटे से बात कर रहे हैं।
    note: '*U spreekt met* + नाम अनौपचारिक *met* + नाम का औपचारिक रूप है।'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: बात दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: '*Kun je* ...? (क्या तुम ... सकते हो?) + *herhalen* (दोहराना) + *dat* (वह)।'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: किसी से धीरे बोलने को कहना
    gloss: कृपया इतनी तेज़ मत बोलो।
    note: '*Niet zo* + विशेषण क्रिया को नहीं, बल्कि मात्रा को नकारता है: इतनी तेज़ नहीं, "बोलो मत" नहीं।'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: कहना कि आवाज़ ठीक से नहीं आ रही
    gloss: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    note: '*Horen* (सुनना) के साथ *niet goed* (ठीक से नहीं) सुनने की समस्या बताता है; यह *verstaan* (समझ पाना) से अलग है।'
  nl.a1.unit22.lesson04.teach.sms:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट मैसेज
    note: '*de sms* एक de वाला शब्द है, जो अंतरराष्ट्रीय संक्षिप्त रूप से सीधे लिया गया है, जैसे हिंदी में भी "एसएमएस" कहा जाता है।'
    example_gloss: यह एसएमएस लॉटे की तरफ़ से है।
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: टेक्स्ट भेजने की बात कहना
    gloss: मैं तुम्हें मैसेज भेज दूँगा।
    note: '*Sturen* (भेजना) में पहले अप्रत्यक्ष कर्म (*je*) आता है, फिर प्रत्यक्ष कर्म (*een sms*)।'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: वापस कॉल करने की बात कहना
    gloss: मैं तुम्हें बाद में वापस कॉल करूँगा।
    note: '*Terug* (वापस) अलग होने वाली क्रिया का अंतिम भाग है; *bellen* + *terug* हिंदी के "वापस फ़ोन करना" जैसा काम करता है।'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: टेक्स्ट बातचीत पढ़ें
    gloss: 'ओमार: हाय लॉटे, क्या तुम मुझे फ़ोन कर सकती हो? मुझे तुम्हें कुछ बताना है। लॉटे: हाँ, ज़रूर, मैं पाँच मिनट में तुम्हें वापस फ़ोन करती हूँ।'
    note: ध्यान दें कि ओमार क्या माँगता है, क्यों, और लॉटे कब वापस फ़ोन करने को कहती है।
    glosses:
      Hoi: हाय
      kun: सकते हो
      bellen: कॉल करना
      moet: करना होगा
      iets: कुछ
      vertellen: बताना
      natuurlijk: ज़रूर
      bel: कॉल करना
      vijf: पाँच
      minuten: मिनट
      terug: वापस
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: ओमार फ़ोन उठाता है
    gloss: 'ओमार: हैलो, मैं ओमार बोल रहा हूँ।'
    note: 'पिछले पाठ वाला वही *met* + नाम का ढाँचा, अब असली फ़ोन कॉल में: जो फ़ोन उठाता है वह पहले बोलता है और अपना नाम बताता है।'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: लॉटे अपना परिचय देती है
    gloss: 'लॉटे: हाय ओमार, मैं लॉटे बोल रही हूँ। ओमार: अच्छा हुआ कि तुमने फ़ोन किया!'
    note: '*Fijn dat* ... (अच्छा है/खुशी है कि ...) किसी घटना पर सकारात्मक प्रतिक्रिया जताता है।'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: लॉटे शिफ़्ट के बारे में पूछती है
    gloss: 'लॉटे: तुम्हारी पहली शिफ़्ट कैसी रही?'
    note: '*Was* *zijn* का सामान्य भूतकाल है। यह यूनिट 12 में पढ़ाए गए पूर्ण भूतकाल (hebben/zijn + भूतकालिक कृदंत, जैसे *Ik heb gewerkt*) से अलग रचना है। अगली पंक्ति के बाद वाला नोट देखें।'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: ओमार अच्छी खबर देता है
    gloss: 'ओमार: बहुत अच्छी रही, मेरी सोच से भी बेहतर।'
    note: '*Ging* *gaan* (जाना) का सामान्य भूतकाल है, यहाँ अर्थ है "(काम का) रहना/निपटना"; *dacht* *denken* (सोचना) का सामान्य भूतकाल है।'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht सामान्य भूतकाल के रूप हैं
    gloss: was → होना, ging → जाना, dacht → सोचना
    note: '*Was*, *ging* और *dacht* सामान्य भूतकाल (verleden tijd) के अनियमित रूप हैं। यह यूनिट 12 के पूर्ण भूतकाल (hebben/zijn + भूतकालिक कृदंत) से अलग ढाँचा है, जो अभी औपचारिक रूप से नहीं पढ़ाया गया है। फ़िलहाल was/ging/dacht को इस पाठ के संदर्भों में तैयार वाक्यांशों की तरह याद रखें; सामान्य भूतकाल के पूरे नियम आगे के स्तर पर आएँगे।'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: लॉटे को गर्व है
    gloss: 'लॉटे: यह सुनकर कितना अच्छा लगा! मुझे तुम पर गर्व है।'
    note: '*Trots op* (...पर गर्व) एक स्थायी जोड़ी है; यहाँ *op* ज़रूरी है, *van* नहीं।'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: ओमार भावुक हो जाता है
    gloss: 'ओमार: धन्यवाद, यह मेरे लिए बहुत मायने रखता है।'
    note: '*Betekent* *betekenen* (मतलब होना) का अन्य पुरुष एकवचन रूप है; *voor me* (मेरे लिए) बताता है कि यह किसके लिए मायने रखता है।'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: उसका
    gloss: उसकी पहली शिफ़्ट बहुत अच्छी रही।
    note: यहाँ *Zijn* संबंधसूचक "उसकी/उसका" है, क्रिया "होना" नहीं। दोनों शब्द एक जैसे दिखते हैं, अंतर संदर्भ से पता चलता है।
