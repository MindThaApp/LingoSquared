teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: खाने-पीने के लिए lekker vinden
    gloss: खाने-पीने की चीज़ों के लिए डच में अक्सर lekker vinden कहा जाता है।
    note: हिंदी के "पसंद है" के लिए डच में एक ही अभिव्यक्ति नहीं है। स्वाद के लिए *Ik vind ... lekker* कहिए, यानी शब्दशः "मुझे ... स्वादिष्ट लगता है"।
  nl.a1.unit13.lesson01.teach.koffie:
    title: कॉफ़ी पसंद करना
    gloss: मुझे कॉफ़ी पसंद है।
    note: खाने या पीने की चीज़ *vind* और *lekker* के बीच आती है।
  nl.a1.unit13.lesson01.teach.thee:
    title: चाय पसंद न करना
    gloss: मुझे चाय पसंद नहीं है।
    note: स्वाद को नकारने के लिए *niet* को *lekker* से पहले रखिए।
  nl.a1.unit13.lesson01.teach.question:
    title: स्वाद के बारे में पूछना
    gloss: क्या तुम्हें टमाटर का सूप पसंद है?
    note: अनौपचारिक प्रश्न में *vind*, *je* से पहले आता है। यह पाठ्यक्रम में चल रहे *jij/je* रूप के अनुरूप है।
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: गतिविधियों के लिए leuk vinden
    gloss: 'गतिविधियों के लिए डच में अक्सर leuk vinden कहा जाता है: मुझे साइकिल चलाना पसंद है।'
    note: साइकिल चलाने जैसी गतिविधि के लिए *lekker* नहीं, *leuk* का प्रयोग कीजिए।
  nl.a1.unit13.lesson02.teach.walking:
    title: सैर करना पसंद करना
    gloss: मुझे सैर करना पसंद है।
    note: गतिविधि *wandelen* *vind* और *leuk* के बीच आती है।
  nl.a1.unit13.lesson02.teach.dislike:
    title: खरीदारी पसंद न करना
    gloss: मुझे खरीदारी करना पसंद नहीं है।
    note: '*Niet*, *leuk* से पहले आता है।'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: गतिविधियों के बारे में पूछना
    gloss: तुम्हें क्या करना पसंद है?
    note: '*Wat vind je leuk om te doen?* किसी की पसंदीदा गतिविधियों के बारे में पूछने का एक स्वाभाविक, सामान्य प्रश्न है।'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: गहरी या सामान्य पसंद
    gloss: Houden van गहरी या सामान्य पसंद व्यक्त करता है।
    note: इसका प्रयोग सोच-समझकर कीजिए। किसी खास खाने या गतिविधि पर सामान्य प्रतिक्रिया *lekker vinden* या *leuk vinden* से ज़्यादा स्वाभाविक रूप से व्यक्त होती है।
  nl.a1.unit13.lesson03.teach.music:
    title: संगीत से लगाव होना
    gloss: मुझे संगीत बहुत पसंद है।
    note: '*Houd*, *houden* का *ik* रूप है; उसके बाद *van* आता है।'
  nl.a1.unit13.lesson03.teach.films:
    title: फ़िल्में पसंद न करना
    gloss: मुझे फ़िल्में पसंद नहीं हैं।
    note: नकारात्मक रूप में *niet*, *houd* और *van* के बीच आता है।
  nl.a1.unit13.lesson03.teach.contrast:
    title: स्वाभाविक अभिव्यक्ति चुनिए
    gloss: 'सामान्य स्वाद के लिए यह भी कहिए: मुझे कॉफ़ी पसंद है। गतिविधि के लिए: मुझे सैर करना पसंद है।'
    note: हर "पसंद है" का अनुवाद यंत्रवत *houden van* से मत कीजिए।
  nl.a1.unit13.lesson04.teach.choice_question:
    title: दो विकल्प देना
    gloss: क्या तुम कॉफ़ी लोगे या चाय?
    note: '*Wil je ... of ...?* सामने वाले से चुनाव करने को कहता है।'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: बताइए कि आप क्या ज़्यादा पसंद करेंगे
    gloss: मैं चाय ज़्यादा पसंद करूँगा/करूँगी।
    note: इस सामान्य चुनाव वाले वाक्य-ढाँचे में *liever*, *wil* के बाद आता है।
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: एक चीज़ को चुनना
    gloss: मुझे नीला स्वेटर ज़्यादा पसंद है।
    note: एक चीज़ को दूसरी पर चुनते समय *Ik heb liever ...* भी स्वाभाविक है।
  nl.a1.unit13.lesson04.teach.liever_note:
    title: पसंदीदा विकल्प को दिखाने वाला शब्द
    gloss: यह शब्द दिखाता है कि आप एक विकल्प को दूसरे से ज़्यादा चुनते हैं।
    note: जब बातचीत से दोनों विकल्प साफ़ हों, तब तुलना को अनकहा छोड़ा जा सकता है।
  nl.a1.unit13.lesson05.teach.message:
    title: कई पसंदें पढ़ना
    gloss: हाय लॉटे, मुझे फ़िल्म अच्छी लगती है, लेकिन ओमर को फ़िल्में पसंद नहीं हैं। वह पार्क जाना ज़्यादा पसंद करेगा। मुझे घूमना-टहलना भी अच्छा लगता है।
    note: ध्यान दीजिए कि किसे फ़िल्म पसंद है, कौन फ़िल्मों को नापसंद करता है, और ओमर कौन-सा विकल्प चुनता है।
    glosses:
      Hoi: हाय
      vind: पसंद करना / लगना
      film: फ़िल्म
      leuk: अच्छा / मज़ेदार
      maar: लेकिन
      houdt: पसंद करता है
      films: फ़िल्में
      wil: चाहती है
      liever: बल्कि / ज़्यादा पसंद
      park: पार्क
      wandelen: घूमना-टहलना
  nl.a1.unit13.lesson06.teach.food_question:
    title: लॉटे दो तरह का खाना पेश करती है
    gloss: 'लॉटे: ओमर, तुम क्या खाना चाहोगे? ब्रेड या टमाटर का सूप?'
    note: दूसरा सवाल दोनों विकल्प सामने रखता है।
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: ओमर सूप चुनता है
    gloss: 'ओमर: मैं टमाटर का सूप ज़्यादा पसंद करूँगा। मुझे टमाटर का सूप स्वादिष्ट लगता है। और तुम?'
    note: ओमर पहले *liever* से अपना चुनाव बताता है, फिर *lekker* से स्वाद के रूप में उसकी वजह बताता है।
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: लॉटे ब्रेड चुनती है
    gloss: 'लॉटे: मुझे ब्रेड ज़्यादा पसंद है। मुझे टमाटर का सूप ज़्यादा स्वादिष्ट नहीं लगता।'
    note: '*Niet zo lekker* नकार को नरम बना देता है और दोस्ताना बातचीत में स्वाभाविक लगता है।'
  nl.a1.unit13.lesson06.teach.activity:
    title: आगे क्या करना है, यह चुनना
    gloss: 'ओमर: खाने के बाद तुम क्या करना चाहोगी? लॉटे: मुझे घूमना-टहलना अच्छा लगता है।'
    note: '*Leuk* गतिविधि *wandelen* के बारे में बताता है।'
  nl.a1.unit13.lesson06.teach.plan:
    title: दोनों की पसंद एक जैसी है
    gloss: 'ओमर: मुझे भी। मुझे घूमना बहुत पसंद है। क्या हम पार्क चलें? लॉटे: अच्छा विचार है।'
    note: यह इकाई 11 की अनौपचारिक योजना बनाने वाली भाषा से जुड़ता है।
