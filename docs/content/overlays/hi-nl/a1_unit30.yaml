teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Lang* लंबे कद वाले व्यक्ति के लिए है; *klein* छोटे कद वाले व्यक्ति के लिए है (यही शब्द इस कोर्स में आगे छोटी वस्तु के लिए भी आता है)।'
    example_gloss:
    - Fenna लंबी है।
    - Sander छोटा है।
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: '*Oud* और *jong* यहाँ रूप-रंग से बनने वाला सामान्य अंदाज़ा बताते हैं, सालों की सटीक संख्या नहीं।'
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - Omar जवान है।
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: संख्या या अंदाज़ा'
    gloss: Oud का मतलब सालों की सटीक संख्या हो सकता है, जैसे Hoe oud ben je? में, या बिना संख्या के सामान्य अंदाज़ा, जैसे Opa is oud. में।
    note: आप *oud* को किसी की सटीक उम्र पूछने से पहले ही जानते हैं (*Hoe oud ben je?*)। यहाँ यह बताता है कि कोई कितना बूढ़ा दिखता है, बिना किसी संख्या के।
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna लंबी है और Sander छोटा है
    gloss: Fenna लंबी है और Sander छोटा है।
    note: '*en* (और) से बना एक सरल संयुक्त वाक्य, जो पाठ 5 में सीधी तुलना की तैयारी करता है।'
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: बाल
    gloss: बाल
    note: '*Haar* एक het-शब्द है: *het haar*।'
    example_gloss: Omar के छोटे काले बाल हैं।
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: बालों के तीन रंग। *Zwart* (काला) पहले कपड़ों के लिए आया था — यहाँ बालों के लिए फिर इस्तेमाल हुआ है।
    example_gloss:
    - Lotte के सुनहरे बाल हैं।
    - Sander के भूरे बाल हैं।
    - दादाजी के बाल स्लेटी हैं।
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Lang* (लंबा) वही शब्द है जो पाठ 1 में कद के लिए आया था; यहाँ यह बालों की लंबाई बताता है। *Kort* (छोटा) यहाँ नया है।'
    example_gloss:
    - Fenna के लंबे बाल हैं।
    - Sander के छोटे बाल हैं।
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar के साथ विशेषण सादा रहता है
    gloss: 'Haar एक het-शब्द है और उसके साथ कोई उपपद नहीं है, इसलिए विशेषण सादा रहता है: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: इस अनिश्चित, बिना उपपद वाले रूप में *haar* से पहले -e नहीं लगता — पाठ 3 के *ogen* से तुलना कीजिए, जिसके साथ -e लगता है।
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: दो अर्थ'
    gloss: 'Haar के दो अर्थ हैं: ''बाल'' (इस पाठ का नया संज्ञा शब्द) और ''उसका'' (यूनिट 5 का संबंधबोधक शब्द, जैसे haar moeder)। संदर्भ से पता चल जाता है कि कौन-सा अर्थ है।'
    note: 'डच में एक सच्चा समरूप शब्द: संज्ञा *haar* (बाल) और संबंधबोधक *haar* (उसका) एक ही तरह लिखे जाते हैं। बाकी वाक्य से हमेशा साफ़ हो जाता है कि कौन-सा अर्थ है।'
    target_text: 'Haar के दो अर्थ हैं: ''बाल'' (इस पाठ का नया संज्ञा शब्द) और ''उसकी'' (स्वामित्व बताने वाला शब्द, जैसे haar moeder)। कौन-सा अर्थ है, यह संदर्भ से पता चलता है।'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar के छोटे काले बाल हैं
    gloss: Omar के छोटे काले बाल हैं।
    note: यूनिट 20 की कपड़ों वाली यूनिट का *zwart* (काला) यहाँ फिर आया है।
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte के लंबे सुनहरे बाल हैं
    gloss: Lotte के लंबे सुनहरे बाल हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: आँखें
    gloss: आँखें
    note: '*Ogen*, *het oog* का बहुवचन है; बहुवचन के साथ हमेशा *de* आता है।'
    example_gloss: Omar की आँखें भूरी हैं।
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: '*Blauw* (नीला) पहले कपड़ों के लिए आया था; *bruin* (भूरा) अभी पाठ 2 में बालों के लिए सिखाया गया; *groen* (हरा) यहाँ नया है।'
    example_gloss:
    - Lotte की आँखें नीली हैं।
    - Sander की आँखें भूरी हैं।
    - Fenna की आँखें हरी हैं।
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen के साथ -e लगता है
    gloss: 'Ogen (बहुवचन) के साथ विशेषण में एक अतिरिक्त -e लगता है: blauwe ogen, bruine ogen, groene ogen.'
    note: पाठ 2 के *haar* से तुलना कीजिए, जहाँ विशेषण सादा रहता है — बहुवचन में de-शब्द और het-शब्द का भेद नहीं पड़ता, -e हमेशा लगता है।
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Lotte कैसी दिखती है?
    gloss: Lotte कैसी दिखती है?
    note: '*Hoe ziet ... eruit?* इस यूनिट का मुख्य प्रश्न है — किसी की भी बनावट पूछने के लिए इसका इस्तेमाल कीजिए।'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: Lotte के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: बाल और आँखों को *en* से एक ही वाक्य में जोड़ने वाला नमूना उत्तर।
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte, Nina का परिचय देती है
    gloss: 'Lotte: taalcafé में एक नई लड़की आ रही है। उसका नाम Nina है।'
    note: '*Er komt* (आ रही है) दृश्य में किसी नए व्यक्ति के आने का परिचय देता है।'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar पूछता है कि वह कैसी दिखती है
    gloss: 'Omar: ठीक है! वह कैसी दिखती है?'
    note: इस यूनिट का मुख्य प्रश्न, अब नाम की जगह *ze* (वह) के साथ।
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte, Nina का कद और बाल बताती है
    gloss: 'Lotte: वह छोटी है और उसके छोटे सुनहरे बाल हैं।'
    note: पाठ 1 के *klein* को पाठ 2 की बालों की शब्दावली के साथ जोड़ता है।
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar उसकी आँखों के बारे में पूछता है
    gloss: 'Omar: और उसकी आँखें?'
    note: '*Haar* यहाँ ''उसकी'' (यूनिट 5 का संबंधबोधक शब्द) है, ''बाल'' नहीं — पाठ 2 का समरूप शब्द वाला नोट देखिए।'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte, Nina की आँखें बताती है
    gloss: 'Lotte: उसकी आँखें हरी हैं।'
    note: पाठ 3 के *groene ogen* का फिर से इस्तेमाल।
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar उसे पहचान लेगा
    gloss: 'Omar: शुक्रिया! तब तो मैं उसे पहचान ही लूँगा।'
    note: '*Herken ik haar wel* — ''मैं उसे ज़रूर पहचान लूँगा'' — यहाँ *haar* फिर से ''उसे'' (सर्वनाम) है, ''बाल'' नहीं।'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Sander और Fenna की तुलना
    gloss: Sander और Fenna भाई-बहन हैं, लेकिन वे अलग-अलग दिखते हैं। Sander छोटा है और उसके छोटे भूरे बाल और भूरी आँखें हैं। Fenna, Sander से लंबी है और उसके लंबे भूरे बाल और हरी आँखें हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      broer: भाई
      zus: बहन
      zien: दिखना
      anders: अलग
      klein: छोटा
      kort: छोटा
      bruin: भूरा
      haar: बाल
      bruine: भूरा
      ogen: आँखें
      langer: ज़्यादा लंबा
      lang: लंबा
      groene: हरा
      eruit: (eruit zien का हिस्सा = दिखना)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: तुलना वाले पैटर्न का फिर से उपयोग
    gloss: 'यह पैटर्न आप तुलना से पहले ही जानते हैं: विशेषण + er + dan। यहाँ इसे लोगों के लिए इस्तेमाल करते हैं: Fenna is langer dan Sander.'
    note: यूनिट 14 की बैकपैक-खरीदारी वाली यूनिट का वही विशेषण *-er dan* पैटर्न, अब वस्तुओं की जगह लोगों का वर्णन करने के लिए।
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna के बाल Sander से लंबे हैं
    gloss: Fenna के बाल Sander से लंबे हैं।
    note: '*Langer*, *haar* (एक het-शब्द) से पहले सादा रहता है, पाठ 2 के नियम की तरह — तुलनात्मक रूप में भी।'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*Ik heb ...* वाला प्रथम पुरुष का नमूना वाक्य, जिसे अपनी बनावट बताते समय दोहराया जा सकता है।'
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar को Nina दिख जाती है
    gloss: 'Omar: देखो, क्या वह Nina है? उसके छोटे सुनहरे बाल और हरी आँखें हैं।'
    note: '*Kijk* (देखो) यूनिट 14 के संवाद में भी इसी तरह आया था।'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte पुष्टि करती है
    gloss: 'Lotte: हाँ, वह Nina है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina, Omar को नमस्ते कहती है
    gloss: 'Nina: हाय, क्या तुम Omar हो?'
    note: एक सरल अनौपचारिक अभिवादन-प्रश्न, *ben jij ...?*
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar भी Nina को नमस्ते कहता है
    gloss: 'Omar: हाँ! तुमसे मिलकर अच्छा लगा, Nina।'
    note: '*Leuk je te ontmoeten* — पहली बार सचमुच मिलने पर कहा जाने वाला सामान्य वाक्यांश (यूनिट 1 देखिए); *leuk je te zien* नहीं, जो पहले से जान-पहचान वाले व्यक्ति के लिए है।'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद का अंत — Omar ने Lotte के पहले दिए वर्णन से Nina को सफलतापूर्वक पहचान लिया।
