    example_gloss: Omar की उम्र बत्तीस साल है।
  nl.a1.unit02.lesson02.teach.forty_two:
    title: बयालीस
    gloss: 42 — बयालीस।
    note: 'पहले इकाई बोलें, फिर दहाई: twee-en-veertig, जिसे एक साथ tweeënveertig लिखा जाता है।'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: अड़तालीस
    gloss: 48 — अड़तालीस
    note: Achtenveertig में acht + en + veertig है, और इसे एक ही शब्द में लिखा जाता है।
    example_gloss: मैं अड़तालीस नंबर पर रहता हूँ।
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: पचहत्तर
    gloss: 75 — पचहत्तर
    note: Vijfenzeventig में vijf पहले आता है और zeventig बाद में।
    example_gloss: इसकी कीमत पचहत्तर सेंट है।
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: निन्यानवे
    gloss: 99 — निन्यानवे
    note: Negenennegentig एक ही संयुक्त शब्द है।
    example_gloss: मेरी उम्र निन्यानवे साल है।
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: फ़ोन नंबर पूछना
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: Je सवाल को अनौपचारिक रखता है, जो Lotte और Omar के भाषा-कैफ़े के माहौल से मेल खाता है।
  nl.a1.unit02.lesson03.teach.phone_number:
    title: नीदरलैंड का मोबाइल नंबर बताएँ
    gloss: मेरा फ़ोन नंबर 06 21 43 65 87 है।
    note: डच मोबाइल नंबर 06 से शुरू होते हैं और आम तौर पर 06 के बाद आठ अंकों के रूप में लिखे जाते हैं।
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: फ़ोन नंबर को समूहों में बोलें
    gloss: शून्य छह, इक्कीस, तैंतालीस, पैंसठ, सतासी
    note: लोग फ़ोन नंबर के अंकों को अलग-अलग तरह से समूहों में बोलते हैं। इस कोर्स में 06 के बाद दो-दो अंकों के समूह लिए गए हैं; स्पष्टता ज़रूरी हो तो अंक एक-एक करके बोलना भी सामान्य है।
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: मकान नंबर पूछें
    gloss: तुम्हारा मकान नंबर क्या है?
    note: Huisnummer पते में लिखा मकान का नंबर होता है।
  nl.a1.unit02.lesson03.teach.house_number:
    title: मकान नंबर बताएँ
    gloss: मेरा मकान नंबर 48 है।
    note: लिखित पते या फ़ॉर्म में अंकों का इस्तेमाल स्वाभाविक है।
  nl.a1.unit02.lesson03.teach.live_number:
    title: नंबर बताकर कहें कि आप कहाँ रहते हैं
    gloss: मैं अड़तालीस नंबर पर रहता हूँ।
    note: जब सड़क का नाम पहले से पता हो, तब मकान नंबर बताने का स्वाभाविक तरीका Op nummer ... है।
  nl.a1.unit02.lesson03.teach.repeat:
    title: दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: जब बोला गया फ़ोन नंबर बहुत तेज़ हो और समझ न आए, तब यह वाक्य काम आता है।
  nl.a1.unit02.lesson04.teach.ask_age:
    title: किसी की उम्र अनौपचारिक ढंग से पूछें
    gloss: तुम्हारी उम्र कितनी है?
    note: यहाँ अनौपचारिक je इस्तेमाल हुआ है; उम्र का सवाल तभी पूछना ठीक है जब संदर्भ में उसकी ज़रूरत हो।
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: उम्र बताएँ
    gloss: मैं अट्ठाईस साल का/की हूँ।
    note: डच में Ik ben ... jaar कहते हैं, यानी शाब्दिक रूप से "मैं ... साल हूँ"; हिंदी में "मेरी उम्र ... साल है" या "मैं ... साल का हूँ" कहा जाता है।
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Omar की उम्र बताएँ
    gloss: Omar बत्तीस साल का है।
    note: उम्र बताते समय संख्या के बाद jaar में बहुवचन का अंत नहीं लगता।
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: लोगों की संख्या पूछें
    gloss: वहाँ कितने लोग हैं?
    note: Hoeveel सीधे संज्ञा mensen से पहले आता है।
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: लोगों की संख्या बताएँ
    gloss: वहाँ बारह लोग हैं।
    note: Er zijn बहुवचन में "हैं" कहने का सामान्य ढाँचा है।
  nl.a1.unit02.lesson04.teach.three_books:
    title: किताबें गिनें
    gloss: मेरे पास तीन किताबें हैं।
    note: एक से बड़ी संख्या के बाद boek का बहुवचन boeken होता है।
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: कुर्सियाँ गिनें
    gloss: सात कुर्सियाँ
    note: Stoelen, stoel का बहुवचन है।
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: यूरो
    note: 'बताई गई राशि के बाद euro आम तौर पर एकवचन ही रहता है: twee euro, twee euro''s नहीं।'
    example_gloss: इसकी कीमत दो यूरो है।
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: सेंट
    note: कीमत में संख्या के बाद cent भी आम तौर पर एकवचन ही रहता है।
    example_gloss: यह पचास सेंट है।
  nl.a1.unit02.lesson05.teach.ask_price:
    title: कीमत पूछें
    gloss: यह कितने का है?
    note: Hoeveel मात्रा पूछता है और kost का अर्थ "कीमत है" है।
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: दो यूरो पचास
    gloss: €2.50 — दो यूरो पचास
    note: डच में दशमलव के लिए अल्पविराम (कॉमा) लिखा जाता है। रोज़ की बोलचाल में €2,50 को आम तौर पर twee euro vijftig कहते हैं, बीच में en के बिना।
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: पचहत्तर सेंट
    gloss: €0.75 — पचहत्तर सेंट
    note: जब राशि एक यूरो से कम हो, तब सिर्फ़ सेंट बोलना स्वाभाविक है।
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: बारह यूरो
    gloss: €12 — बारह यूरो
    note: पूरे यूरो की कीमत में सेंट बोलने की ज़रूरत नहीं होती।
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: चार यूरो पचास
    gloss: €4.50 — चार यूरो पचास
    note: यूरो और सेंट वाली दूसरी कीमतों के लिए भी बोलने का यही ढंग चलता है।
  nl.a1.unit02.lesson05.teach.costs:
    title: कीमत बताना
    gloss: इसकी कीमत दो यूरो पचास है।
    note: Dat kost ..., Hoeveel kost dit? का सीधा जवाब है।
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar पंजीकरण करता है
    gloss: 'कर्मचारी: नमस्ते। क्या आप भाषा-कैफ़े के लिए आए हैं? Omar: जी हाँ, मैं पंजीकरण करना चाहता हूँ।'
    note: यह दृश्य इकाई 1 में Omar के पुस्तकालय के भाषा-कैफ़े में जाने की कहानी को आगे बढ़ाता है।
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: फ़ोन नंबर बताना
    gloss: 'कर्मचारी: बढ़िया। आपका फ़ोन नंबर क्या है? Omar: 06 21 43 65 87।'
    note: Omar नंबर को उन्हीं दो-दो अंकों के समूहों में बोलता है जिनका अभ्यास पहले किया गया था।
  nl.a1.unit02.lesson06.teach.house_turn:
    title: मकान नंबर बताएँ
    gloss: 'कर्मचारी: और आपका मकान नंबर क्या है? Omar: अड़तालीस।'
    note: जब सवाल से संदर्भ साफ़ हो, तब सिर्फ़ संख्या में छोटा-सा जवाब देना स्वाभाविक है।
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: शुल्क समझें
    gloss: 'कर्मचारी: शुल्क दो यूरो पचास है। Omar: ठीक है।'
    note: बोली गई कीमत रोज़मर्रा के यूरो-और-सेंट वाले ढंग का पालन करती है।
  nl.a1.unit02.lesson06.teach.group_turn:
    title: समूह के आकार के बारे में पूछें
    gloss: 'Omar: समूह में कितने लोग हैं? कर्मचारी: बारह।'
    note: इस दृश्य में इकाई में पहले सिखाया गया Hoeveel mensen ... वाला सवाल फिर से आया है।
  nl.a1.unit02.lesson06.teach.room_turn:
    title: कमरे का नंबर ढूँढें
    gloss: 'कर्मचारी: भाषा-कैफ़े कमरा नंबर इक्कीस में है।'
