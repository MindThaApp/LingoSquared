    - पचास लोग हैं।
    - मेरी उम्र साठ साल है।
    - यह सत्तर यूरो का है।
    - अस्सी लोग हैं।
    - मेरे पास नब्बे यूरो हैं।
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: इकाई दहाई से पहले आती है
    gloss: '21–99, तीस, चालीस जैसी पूरी दहाइयों को छोड़कर: इकाई + en + दहाई'
    note: 'डच में आम तौर पर इकाई पहले बोली जाती है: 42 का शाब्दिक रूप "दो-और-चालीस" है। पूरी दहाइयों में केवल दहाई वाला शब्द आता है।'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: इक्कीस
    gloss: 21 — इक्कीस
    note: Eenentwintig में een + en + twintig एक ही लिखित शब्द में जुड़ जाते हैं।
    example_gloss: भाषा कैफ़े कमरा इक्कीस में है।
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: बाईस
    gloss: 22 — बाईस
    note: tweeëntwintig में ë पर लगे दो बिंदु दिखाते हैं कि पास-पास के स्वर अलग-अलग अक्षरों में बोले जाते हैं।
    example_gloss: मेरी उम्र बाईस साल है।
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: बत्तीस
    gloss: 32 — बत्तीस
