teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: उठना
    gloss: उठना → मैं उठता/उठती हूँ
    note: 'मुख्य वाक्य में *opstaan* अलग हो जाता है: *Ik sta op*। उपसर्ग *op* वाक्य के अंत में चला जाता है।'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: कपड़े पहनना
    gloss: कपड़े पहनना → मैं कपड़े पहनता/पहनती हूँ
    note: '*Zich aankleden* आत्मवाचक और वियोज्य क्रिया है। *ik* के साथ *me* आता है और *aan* अंत में जाता है: *Ik kleed me aan*।'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: नाश्ता करना
    gloss: नाश्ता करना → मैं नाश्ता करता/करती हूँ
    note: '*Ontbijten* अलग नहीं होता: *Ik ontbijt*।'
  nl.a1.unit10.lesson01.teach.werken:
    title: काम
    gloss: काम करना → मैं काम करता/करती हूँ
    note: '*Werken* अलग नहीं होता: *Ik werk*।'
  nl.a1.unit10.lesson01.teach.eten:
    title: खाना
    gloss: खाना → मैं खाता/खाती हूँ
    note: '*eten* का *ik* रूप *eet* है: *Ik eet*।'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: बर्तन धोना
    gloss: बर्तन धोना → मैं बर्तन धोता/धोती हूँ
    note: '*Afwassen* अलग हो जाता है: *Ik was af*। उपसर्ग *af* अंत में चला जाता है।'
  nl.a1.unit10.lesson01.teach.slapen:
    title: सोना
    gloss: सोना → मैं सोता/सोती हूँ
    note: '*Slapen* अलग नहीं होता। इसके *ik* रूप में दीर्घ स्वर होता है: *Ik slaap*।'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: अलग होने का तरीका
    gloss: 'सामान्य मुख्य वाक्य में क्रिया का पहला भाग अंत में चला जाता है: opstaan → Ik sta op.'
    note: '*Ik opsta* मत कहिए। मुख्य क्रिया को रूपांतरित कीजिए और छोटा उपसर्ग मुख्य वाक्य के अंत में रखिए।'
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: वाक्य में Opstaan
    gloss: 'उठना: मैं सात बजे उठता/उठती हूँ।'
    note: समय बताने वाला शब्द-समूह *sta* और अंत के उपसर्ग *op* के बीच आता है।
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: वाक्य में Aankleden
    gloss: 'कपड़े पहनना: मैं कपड़े पहनता/पहनती हूँ।'
    note: 'क्रम यह है: *Ik* + *kleed* + *me* + *aan*। *Aan* अंत में ही रहता है।'
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: वाक्य में Afwassen
    gloss: 'बर्तन धोना: मैं खाने के बाद बर्तन धोता/धोती हूँ।'
    note: '*Na het eten* शब्द *was* और अंत के उपसर्ग *af* के बीच आता है।'
  nl.a1.unit10.lesson02.teach.contrast:
    title: अलग न होने वाली क्रियाएँ
    gloss: 'अवियोज्य: मैं नाश्ता करता हूँ। मैं काम करता हूँ। मैं सोता हूँ। अंत में कोई भाग नहीं आता।'
    note: इन मुख्य वाक्यों में *ontbijten*, *werken* और *slapen* एक ही क्रिया-रूप में रहते हैं।
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: साढ़े सात बजे उठना
    gloss: मैं 7:30 बजे उठता/उठती हूँ।
    note: 'डच घड़ी का नियम याद कीजिए: *half acht* का अर्थ है आठ बजने में आधा घंटा बाकी, यानी 07:30। *Op* अंत में ही रहता है।'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: पौने आठ बजे कपड़े पहनना
    gloss: मैं 7:45 बजे कपड़े पहनता/पहनती हूँ।
    note: समय अंत के वियोज्य उपसर्ग *aan* से पहले आता है।
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: आठ बजे नाश्ता करना
    gloss: मैं आठ बजे नाश्ता करता/करती हूँ।
    note: समय से पहले *om* लगाइए। *Ontbijt* अलग नहीं होता।
  nl.a1.unit10.lesson03.teach.work_time:
    title: नौ से पाँच तक काम करना
    gloss: मैं नौ बजे से पाँच बजे तक काम करता/करती हूँ।
    note: '*Van ... tot ...* शुरू और खत्म होने का समय बताता है।'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: साढ़े छह बजे खाना
    gloss: मैं शाम 6:30 बजे खाना खाता/खाती हूँ।
    note: '*''s Avonds* शाम को स्पष्ट करता है, इसलिए यहाँ *half zeven* का अर्थ 18:30 है।'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: ग्यारह बजे सोना
    gloss: मैं ग्यारह बजे सोता/सोती हूँ।
    note: 'समय से पहले *om* लगाइए: *om elf uur*।'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: पहले, फिर, उसके बाद
    gloss: पहले, फिर, उसके बाद
    note: '*Eerst* पहली गतिविधि बताता है, *dan* अगली गतिविधि पर ले जाता है, और *daarna* पिछली बात से जोड़ता है।'
    example_gloss:
    - पहले मैं उठता/उठती हूँ।
    - फिर मैं कपड़े पहनता/पहनती हूँ।
    - उसके बाद मैं नाश्ता करता/करती हूँ।
  nl.a1.unit10.lesson04.teach.sequence:
    title: तीन चरणों की सुबह
    gloss: पहले मैं उठता/उठती हूँ। फिर मैं कपड़े पहनता/पहनती हूँ। उसके बाद मैं नाश्ता करता/करती हूँ।
    note: 'वियोज्य उपसर्ग अब भी अपने उपवाक्य के अंत में आते हैं: *sta ik op*; *kleed ik me aan*।'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: क्रिया ik से पहले
    gloss: 'eerst, dan और daarna के बाद क्रिया ik से पहले आती है: Daarna ontbijt ik.'
    note: क्रमसूचक शब्द से शुरू करने पर *Ik ontbijt* बदलकर *Daarna ontbijt ik* हो जाता है।
  nl.a1.unit10.lesson05.teach.routine_text:
    title: मेरा दिन
    gloss: मेरा दिन — मैं 7:30 बजे उठता/उठती हूँ। उसके बाद मैं कपड़े पहनता/पहनती हूँ और आठ बजे नाश्ता करता/करती हूँ। मैं नौ से पाँच तक काम करता/करती हूँ। शाम 6:30 बजे मैं खाना खाता/खाती हूँ। उसके बाद मैं बर्तन धोता/धोती हूँ। ग्यारह बजे मैं सोता/सोती हूँ।
    note: गतिविधियों के क्रम और उनके समय, दोनों पर ध्यान देते हुए पढ़िए। वियोज्य क्रियाओं वाले उपवाक्यों में अंत के *op*, *aan* और *af* को देखिए।
    glosses:
      Mijn: मेरा
      dag: दिन
      sta: उठना (op के साथ)
      half: अगले घंटे से आधा घंटा पहले (half acht = 7:30)
      acht: आठ
      Daarna: उसके बाद
      kleed: कपड़े पहनना (me ... aan के साथ)
      uur: बजे / घंटा
      ontbijt: नाश्ता करना
      werk: काम
      negen: नौ
      vijf: पाँच
      zeven: सात
      avonds: शाम को
      eet: खाना
      was: बर्तन धोना (af के साथ)
      elf: ग्यारह
      slaap: सोना
  nl.a1.unit10.lesson06.teach.question:
    title: दिन के बारे में पूछना
    gloss: 'लोटे: ओमर, तुम्हारा दिन कैसा रहता है?'
    note: '*Hoe ziet jouw dag eruit?* किसी को अपना दिन बताने के लिए बुलाने का अनौपचारिक तरीका है। *Eruitzien* वियोज्य है: *ziet ... eruit*।'
  nl.a1.unit10.lesson06.teach.morning:
    title: ओमर की सुबह
    gloss: 'ओमर: मैं साढ़े सात बजे उठता हूँ। फिर मैं कपड़े पहनता हूँ और आठ बजे नाश्ता करता हूँ।'
    note: ओमर सुबह की तीन गतिविधियों को जोड़ता है और *op* तथा *aan* को उनके उपवाक्यों के अंत में रखता है।
  nl.a1.unit10.lesson06.teach.work:
    title: ओमर का कार्यदिवस
    gloss: 'लोटे: तुम कब काम करते हो? ओमर: मैं नौ बजे से पाँच बजे तक काम करता हूँ।'
    note: लोटे और ओमर आपस में अनौपचारिक *je* का प्रयोग करते हैं।
  nl.a1.unit10.lesson06.teach.evening:
    title: ओमर की शाम
    gloss: 'ओमर: शाम साढ़े छह बजे मैं खाना खाता हूँ। उसके बाद मैं बर्तन धोता हूँ। ग्यारह बजे मैं सो जाता हूँ।'
    note: 'समय या *daarna* से शुरू करने पर क्रिया *ik* से पहले आती है: *eet ik*, *was ik*, *slaap ik*। *Af* अंत में ही रहता है।'
  nl.a1.unit10.lesson06.teach.lotte:
    title: लोटे की सुबह
    gloss: 'लोटे: मैं छह बजे उठती हूँ, पर नाश्ता साढ़े छह बजे ही करती हूँ।'
    note: यहाँ *pas* का अर्थ है "तभी, उससे पहले नहीं"। लोटे अपने उठने के समय और नाश्ते के समय की तुलना करती है।
