teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: तबीयत ठीक न होना
    gloss: मेरी तबीयत ठीक नहीं है।
    note: यहाँ *voelen* प्रतिवर्ती क्रिया है (*je*/*me voelen*); *niet lekker* कहने का सामान्य, हल्का तरीका है कि कुछ ठीक नहीं है।
  nl.a1.unit16.lesson01.teach.ziek:
    title: बीमार
    gloss: बीमार
    note: मूल विशेषण, जो *zijn* (होना) के साथ आता है।
    example_gloss: मैं बीमार हूँ।
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: बीमार होना
    gloss: मैं बीमार हूँ।
    note: '*Ziek* *niet lekker* से अधिक व्यापक और गंभीर हालत बताता है।'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: सिरदर्द
    gloss: सिरदर्द
    note: '*hebben* के बाद इसके साथ अनिश्चित उपपद नहीं आता: *Ik heb hoofdpijn*, *Ik heb een hoofdpijn* नहीं।'
    example_gloss: मेरे सिर में दर्द है।
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: सिरदर्द होना
    gloss: मेरे सिर में दर्द है।
    note: 'डच में लक्षण आम तौर पर *hebben* (पास होना) के साथ आते हैं: Ik heb hoofdpijn।'
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: पेट दर्द
    gloss: पेट दर्द
    note: '*hoofdpijn* की तरह इसके साथ भी उपपद नहीं आता।'
    example_gloss: मेरे पेट में दर्द है।
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: पेट दर्द होना
    gloss: मेरे पेट में दर्द है।
    note: यह भी *hoofdpijn* जैसा ही *hebben* वाला ढाँचा है।
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: सामान्य रूप से पूछना
    gloss: क्या हुआ?
    note: यह पूछने का एक सामान्य, हर जगह चलने वाला तरीका है कि कोई परेशानी तो नहीं है।
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: एक प्रचलित मुहावरा
    gloss: तुम्हें क्या हुआ?
    note: '*Scheelt eraan* एक स्थायी मुहावरा है; इसका शब्द-दर-शब्द अनुवाद न करें।'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: गले में दर्द
    gloss: गले में दर्द
    note: '*hoofdpijn* और *buikpijn* की तरह इसके साथ भी उपपद नहीं आता।'
    example_gloss: मेरे गले में दर्द है।
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: गले में दर्द होना
    gloss: मेरे गले में दर्द है।
    note: यह भी अन्य लक्षणों जैसा ही *hebben* वाला ढाँचा है।
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: किसी का हालचाल पूछना
    gloss: क्या तुम ठीक हो? नहीं, मेरी तबीयत ठीक नहीं है।
    note: '*Gaat het?* दोस्तों के बीच हालचाल पूछने का बहुत आम, अनौपचारिक प्रश्न है।'
  nl.a1.unit16.lesson03.teach.koorts:
    title: बुखार
    gloss: बुखार
    note: अन्य लक्षणों की तरह *hebben* के बाद इसके साथ उपपद नहीं आता।
    example_gloss: मुझे बुखार है।
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: बुखार होना
    gloss: मुझे बुखार है।
    note: यह *hebben* वाला ढाँचा है।
  nl.a1.unit16.lesson03.teach.verkouden:
    title: जुकाम होना
    gloss: जुकाम होना / जुकाम से पीड़ित
    note: यह विशेषण है और *zijn* के साथ आता है; यह संज्ञा की तरह *hebben* के साथ नहीं आता।
    example_gloss: मुझे जुकाम है।
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: जुकाम होने की बात कहना
    gloss: मुझे जुकाम है।
    note: डच में *zijn* + *verkouden* कहा जाता है; *Ik heb een verkouden* नहीं कहते।
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn या hebben शब्द-वर्ग से तय होता है, अवधि से नहीं
    gloss: 'Ziek और verkouden विशेषण हैं और zijn के साथ आते हैं: मैं बीमार हूँ, मुझे ज़ुकाम है। Koorts और hoofdpijn संज्ञाएँ हैं और hebben के साथ आती हैं।'
    note: '*zijn* और *hebben* का चुनाव व्याकरणिक शब्द-वर्ग (विशेषण या लक्षण-संज्ञा) पर निर्भर है, इस पर नहीं कि हालत कितनी अस्थायी है। *koorts* (संज्ञा) भी *verkouden* (विशेषण) जितना अस्थायी है, फिर भी उसके साथ *hebben* आता है, *zijn* नहीं।'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: दवाखाना
    gloss: दवाखाना
    note: 'de-वाली संज्ञा: *de apotheek*।'
    example_gloss: मैं दवाखाने जा रहा हूँ।
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: दवाखाने में स्वागत का सवाल
    gloss: मैं आपकी क्या मदद कर सकता हूँ?
    note: '*Waarmee kan ik u helpen?* सेवा के समय का मानक औपचारिक अभिवादन है, जो यूनिट 1 और यूनिट 15 के *u* वाले पाठों की बात आगे बढ़ाता है।'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: किसी लक्षण की दवा माँगना
    gloss: क्या आपके पास सिरदर्द की कोई दवा है?
    note: '*Iets tegen* + लक्षण, दवा माँगने का स्वाभाविक तरीका है।'
  nl.a1.unit16.lesson04.teach.tablet:
    title: एक गोली
    gloss: एक गोली
    note: 'यह het-वाली संज्ञा है: *het tablet*, पर यहाँ अनिश्चित रूप में *een tablet* आया है।'
    example_gloss: मैं एक गोली लेता हूँ।
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: दवा लेने के निर्देश
    gloss: दिन में दो बार एक गोली लो।
    note: '*Neem* क्रिया *nemen* (लेना) का आज्ञार्थक रूप है, जो निर्देश देने में काम आता है।'
  nl.a1.unit16.lesson04.teach.register_note:
    title: फ़ार्मेसी में बोलने का तरीक़ा
    gloss: फ़ार्मेसी में आप विनम्र रूप u का प्रयोग करते हैं।
    note: फ़ार्मासिस्ट सेवा देने वाला अपरिचित वयस्क है; यही नियम यूनिट 15 के टिकट काउंटर पर भी लागू था।
  nl.a1.unit16.lesson05.teach.advies:
    title: दवा की सलाह का पर्चा पढ़िए
    gloss: 'सलाह: दिन में दो बार पानी के साथ एक गोली लें। अच्छी तरह आराम करें और खूब पानी पिएँ। क्या तीन दिन बाद भी आप ठीक महसूस नहीं कर रहे? तो डॉक्टर के पास जाएँ।'
    note: खुराक, दवा के अलावा दो सुझाव और डॉक्टर के पास कब जाना है, इन पर ध्यान दीजिए।
    glosses:
      Advies: सलाह
      neem: लो / लीजिए
      keer: बार
      dag: दिन
      tablet: गोली
      Rust: आराम करो
      drink: पियो
      Voel: महसूस करना
      steeds: अब भी
      lekker: अच्छा / अच्छी तरह
      huisarts: डॉक्टर
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte हालचाल पूछती है
    gloss: 'Lotte: हाय Omar, कैसे हो? क्या अब कुछ बेहतर लग रहा है?'
    note: '*Al* (अब तक/पहले ही) दिखाता है कि Lotte जानना चाहती है कि पिछली बातचीत के बाद Omar की हालत सुधरी या नहीं।'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar अब भी बीमार है
    gloss: 'Omar: अभी इतना ठीक नहीं हूँ। मेरे सिर में अब भी दर्द है और मैं थका हुआ हूँ।'
    note: '*Nog steeds* (अब भी) बताता है कि सिरदर्द गया नहीं है; *moe* (थका हुआ) एक नया, उपयोगी विशेषण है।'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte दवा के बारे में पूछती है
    gloss: 'Lotte: क्या तुमने गोली ली?'
    note: '*Genomen* क्रिया *nemen* का भूतकालिक कृदंत है, जो यूनिट 12 वाले *heb* + कृदंत के ढाँचे में आया है।'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar हाँ कहता है
    gloss: 'Omar: हाँ, मैंने गोली ली है। अब मैं आराम करने जा रहा हूँ।'
    note: '*Ga nu rusten* (अब आराम करने जा रहा हूँ) में निकट भविष्य का *gaan* + क्रिया का मूल रूप वाला ढाँचा है।'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte शुभकामना देती है
    gloss: 'Lotte: अच्छा विचार है। अच्छे से आराम करो। जल्दी ठीक हो जाओ!'
    note: '*Beterschap!* किसी के जल्दी ठीक होने की कामना करने का मानक, स्थायी वाक्यांश है।'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar विदा लेता है
    gloss: 'Omar: धन्यवाद, कल मिलते हैं!'
    note: '*Tot morgen!* पिछली यूनिटों की विदाइयों वाला *tot* + समय का ढाँचा दोहराता है।'
