  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: लोटे तय नहीं कर पाई है
    gloss: 'लोटे: अभी पता नहीं। मुझे पढ़ना पसंद है, पर मैं बाहर भी जाना चाहती हूँ।'
    note: '*Naar buiten* (बाहर, शाब्दिक अर्थ ''बाहर की ओर'') घर से निकलने की इच्छा बताने का आम तरीक़ा है।'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
