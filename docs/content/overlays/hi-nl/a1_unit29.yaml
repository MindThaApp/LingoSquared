    gloss: 'ओमर: साथ टहलने चलें? उसके बाद मैं हमारे लिए खाना बनाऊँगा।'
    note: '*Daarna* (उसके बाद) में यूनिट 10 के क्रम बताने वाले शब्द *eerst, dan, daarna* का शब्द फिर आया है।'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
