  nl.a1.unit29.lesson05.teach.vergelijking:
    title: शौक़ों की तुलना
    gloss: ओमर और मैं अक्सर साथ टहलने जाते हैं। लेकिन हमारे और भी शौक़ हैं। ओमर को खाना बनाना पसंद है, घर पर भी, और वह अक्सर कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, लेकिन कभी गेम नहीं खेलती। आप अपने खाली समय में क्या करना पसंद करते हैं?
