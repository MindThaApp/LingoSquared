    gloss: 'ओमर: हाँ, लेकिन मुझे खाना बनाना सुकून देने वाला लगता है। और तुम, तुम्हें क्या करना पसंद है?'
    note: '*Koken vind ik ontspannend* में ज़ोर देने के लिए कर्म *koken* को वाक्य के शुरू में रखा गया है -- शाब्दिक अर्थ: ''खाना बनाना, वह मुझे सुकून देने वाला लगता है''।'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
