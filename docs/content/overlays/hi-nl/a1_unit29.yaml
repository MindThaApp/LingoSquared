    gloss: 'लोटे: अच्छा विचार है! मुझे टहलना और खाना बनाना, दोनों पसंद हैं।'
    note: '*Allebei* (दोनों) दिखाता है कि लोटे को दो चीज़ें बराबर पसंद हैं, एक दूसरी से ज़्यादा नहीं।'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
