    gloss: लोटे हर दिन ओमर को फ़ोन करती है। वह अपना फ़ोन इस्तेमाल करती है, ऐप नहीं। ओमर के पास घर पर कंप्यूटर नहीं है, पर वह अपने फ़ोन पर इंटरनेट इस्तेमाल करता है। सैंडर हर सुबह मौसम का पूर्वानुमान देखता है। फिर वह दौड़ने जाता है। फेना अक्सर लोटे को संदेश भेजती है। क्या आप भी हर दिन अपना फ़ोन इस्तेमाल करते हैं?
