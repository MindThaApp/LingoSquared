teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: किसी का पेशा पूछना
    gloss: आप काम क्या करते हैं?
    note: किसी के पेशे के बारे में पूछने का सामान्य, अनौपचारिक तरीका।
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: पेशा / रसोइया
    gloss: पेशा; रसोइया
    note: '*Het beroep* (पेशा) नपुंसक लिंग वाला संज्ञा शब्द है। *Kok* (रसोइया) एक आम पेशा-शब्द है जो किसी भी लिंग के लिए प्रयोग होता है: *een kok*, *de kok*।'
    example_gloss:
    - आपका पेशा क्या है?
    - मैं रसोइये का काम करता हूँ।
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: बताना कि आप रसोइया हैं
    gloss: मैं रसोइये का काम करता हूँ।
    note: पेशा बताने का सामान्य ढाँचा *werken als* + पेशा है; पेशे वाले शब्द से पहले कोई उपपद नहीं आता।
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: नर्स
    gloss: नर्स
    note: इस पेशे के लिए आधुनिक, लिंग-निरपेक्ष शब्द, जो किसी भी लिंग के लिए प्रयुक्त होता है।
    example_gloss: मैं नर्स का काम करता हूँ।
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: बताना कि आप नर्स हैं
    gloss: मैं नर्स का काम करता हूँ।
    note: यह भी *kok* वाले *werken als* ढाँचे का ही रूप है।
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: कार्यस्थल के बारे में पूछना
    gloss: आप कहाँ काम करते हैं?
    note: यह *Wat doe je voor werk?* के बाद पूछा जाने वाला सीधा प्रश्न है।
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: रेस्तराँ में काम करना
    gloss: मैं एक रेस्तराँ में काम करता हूँ।
    note: यहाँ *een restaurant* में अनिश्चित उपपद आता है, क्योंकि यह अनेक रेस्तराँओं में से कोई एक है।
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: अस्पताल
    gloss: अस्पताल
    note: 'यह नपुंसक लिंग का शब्द है: *het ziekenhuis*।'
    example_gloss: मैं अस्पताल में काम करता हूँ।
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: अस्पताल में काम करना
    gloss: मैं अस्पताल में काम करता हूँ।
    note: '*Het ziekenhuis* में निश्चित उपपद आता है — डच इसे एक विशिष्ट, जानी-पहचानी संस्था मानती है।'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: दफ़्तर में काम करना
    gloss: कुछ लोग दफ़्तर में काम करते हैं।
    note: '*Op kantoor* (दफ़्तर में) एक स्थिर अभिव्यक्ति है जिसमें उपपद नहीं आता, जबकि *in een restaurant* और *in het ziekenhuis* में आता है।'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: काम शुरू करने का समय
    gloss: मैं नौ बजे शुरू करता/करती हूँ।
    note: '*Begin*, *beginnen* (शुरू करना) का ik वाला रूप है; यहाँ इकाई 4 का समय बताने वाला ढाँचा दोहराया गया है।'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: काम के दिन
    gloss: मैं सोमवार से शुक्रवार तक काम करता/करती हूँ।
    note: '*Van... tot...* में इकाई 3 का सप्ताह के दिनों की सीमा बताने वाला ढाँचा दोहराया गया है।'
  nl.a1.unit17.lesson03.teach.pauze:
    title: विराम
    gloss: विराम
    note: 'यह सामान्य लिंग का शब्द है: *de pauze*।'
    example_gloss: मेरा बारह बजे विराम होता है।
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: विराम लेना
    gloss: मेरा बारह बजे विराम होता है।
    note: '*Pauze hebben* (विराम लेना) इसका स्वाभाविक और स्थिर ढाँचा है।'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: काम खत्म करने का समय
    gloss: मैं पाँच बजे खत्म करता/करती हूँ।
    note: '*Stop*, *stoppen* (रुकना/खत्म करना) का ik वाला रूप है।'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: पूरा कार्यदिवस
    gloss: मैं नौ बजे शुरू करता/करती हूँ और पाँच बजे खत्म करता/करती हूँ।
    note: इसमें *begin* और *stop* को *en* से जोड़कर पूरे कार्यदिवस का वर्णन एक वाक्य में किया गया है।
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: अन्य पुरुष के क्रिया-अंत
    gloss: '"वह" (पुल्लिंग या स्त्रीलिंग) के साथ क्रिया में आमतौर पर एक अतिरिक्त -t जुड़ता है: वह काम करता है, वह काम करती है।'
    note: '*hij*/*zij* के साथ *werk* बदलकर *werkt* हो जाता है; यह डच के वर्तमान काल में अन्य पुरुष का सामान्य नियम है।'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: लोटे का काम
    gloss: लोटे नर्स के रूप में काम करती है।
    note: यहाँ *werk* नहीं, *werkt* आता है, क्योंकि कर्ता *ik* नहीं बल्कि अन्य पुरुष का नाम है।
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: ओमर का काम
    gloss: ओमर रसोइये के रूप में काम करता है।
    note: यहाँ भी वही अन्य पुरुष का -t अंत है, जैसा *Lotte werkt als verpleegkundige* में है।
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: सर्वनामों का प्रयोग
    gloss: वह अस्पताल में काम करती है। वह रेस्तराँ में काम करता है।
    note: '*Zij*/*hij* नाम लोटे/ओमर की जगह आते हैं, पर क्रिया का अन्य पुरुष वाला -t रूप वही रहता है।'
  nl.a1.unit17.lesson05.teach.profiel:
    title: दो लोगों के कार्य-परिचय पढ़िए
    gloss: लोटे अस्पताल में नर्स के रूप में काम करती है। वह सात बजे शुरू करती है और सोमवार से शुक्रवार तक काम करती है। ओमर रेस्तराँ में रसोइये के रूप में काम करता है। वह ग्यारह बजे शुरू करता है और चार बजे उसका विश्राम होता है।
    note: हर व्यक्ति का पेशा, कार्यस्थल और समय-सारणी अलग-अलग पहचानिए।
    glosses:
      werkt: काम करता है
      verpleegkundige: नर्स
      ziekenhuis: अस्पताल
      begint: शुरू होता है
      zeven: सात
      maandag: सोमवार
      vrijdag: शुक्रवार
      kok: रसोइया / शेफ़
      restaurant: रेस्तराँ
      elf: ग्यारह
      pauze: विराम
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: लोटे काम के बारे में पूछती है
    gloss: 'लोटे: हाय ओमर! मुझे जानने की उत्सुकता है, तुम वास्तव में काम क्या करते हो?'
    note: '*Eigenlijk* (वास्तव में) प्रश्न को पूछताछ जैसा नहीं, बल्कि मित्रवत जिज्ञासा जैसा बना देता है।'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: ओमर जवाब देता है
    gloss: 'ओमर: मैं रेस्तराँ में रसोइये का काम करता हूँ। और तुम?'
    note: '*En jij?* वही प्रश्न सामने वाले से लौटाकर पूछने का सामान्य तरीका है।'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: लोटे जवाब देती है
    gloss: 'लोटे: मैं अस्पताल में नर्स का काम करती हूँ।'
    note: यह वही पेशा और कार्यस्थल है जो पहले बताया जा चुका है।
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: ओमर काम के घंटों के बारे में पूछता है
    gloss: 'ओमर: तुम्हारे काम के घंटे कैसे रहते हैं?'
    note: '*Uren maken* (शब्दशः "घंटे बनाना") अपने काम का समय-सारणी बताने की एक स्थिर मुहावरेदार अभिव्यक्ति है।'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: लोटे अपने काम के घंटे बताती है
    gloss: 'लोटे: मैं सात बजे शुरू करती हूँ और सोमवार से शुक्रवार तक काम करती हूँ।'
    note: यह वही समय-सारणी है जो पढ़ने वाले परिचय में पहले आ चुकी है।
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: ओमर की प्रतिक्रिया
    gloss: 'ओमर: यह तो बहुत जल्दी है! मैं देर से शुरू करता हूँ, ग्यारह बजे।'
    note: यह ओमर के शुरू करने के उस समय से मेल खाता है जो पाठ 5 में पहले आ चुका है।
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: लोटे बात समाप्त करती है
    gloss: 'लोटे: मेरे ख़याल से हर नौकरी की अपनी लय होती है।'
    note: यह विचारपूर्ण और स्वाभाविक समापन-वाक्य है; इसे अर्थ से पहचानना काफ़ी है, हूबहू दोहराना ज़रूरी नहीं।
