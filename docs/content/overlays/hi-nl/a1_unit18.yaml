    gloss: अपार्टमेंट में तीन कमरे हैं।
    note: '*Kamers* कमरों के लिए सामान्य शब्द है, यह केवल शयनकक्षों तक सीमित नहीं है।'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
