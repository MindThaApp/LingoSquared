    - कोई बगीचा नहीं है।
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: किसी चीज़ के होने की बात कहना
    gloss: एक बालकनी है।
    note: '*Er is* किसी चीज़ के होने को बताने की मानक डच रचना है, हिंदी के "... है" (जैसे "एक बालकनी है") के समान।'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: किसी चीज़ के न होने की बात कहना
    gloss: कोई बगीचा नहीं है।
    note: '*Geen* अनिश्चित संज्ञा को नकारता है -- *geen tuin*, *niet een tuin* नहीं।'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: आरामदायक
    gloss: आरामदायक
    note: गर्मजोशी भरे, सुखद माहौल के लिए प्रयुक्त बहुत आम और खास डच विशेषण -- यह किसी एक हिंदी शब्द का सीधा अनुवाद नहीं है।
    example_gloss: अपार्टमेंट छोटा है, लेकिन आरामदायक है।
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: वर्णन का एक आम ढंग
    gloss: अपार्टमेंट छोटा है, लेकिन आरामदायक है।
    note: '*Klein maar gezellig* डच लोगों द्वारा छोटे घर की सकारात्मक तारीफ़ करने का बहुत आम और स्वाभाविक तरीका है।'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
