  nl.a1.unit18.lesson05.teach.advertentie:
    title: मकान का विज्ञापन पढ़ना
    gloss: 'Utrecht में अपार्टमेंट: एक शयनकक्ष, एक बैठक, एक रसोई और एक स्नानघर। बालकनी है, लेकिन बगीचा नहीं है। अपार्टमेंट छोटा लेकिन आरामदेह है।'
    note: 'ध्यान दीजिए: कितने कमरे हैं, कौन-सी सुविधाएँ हैं और कौन-सी नहीं, और कुल मिलाकर कैसा प्रभाव दिया गया है।'
