    gloss: आपके पास कितने कमरे हैं?
    note: '*Hoeveel* (कितने) संख्या वाले पिछले पाठों के मात्रा-प्रश्न का ही ढाँचा दोहराता है।'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: कमरों की संख्या बताना
    gloss: मेरे पास दो शयनकक्ष हैं।
    note: '*Slaapkamers*, *slaapkamer* का बहुवचन है, जो नियमित रूप से -s लगाकर बनता है।'
  nl.a1.unit18.lesson02.teach.drie_kamers:
