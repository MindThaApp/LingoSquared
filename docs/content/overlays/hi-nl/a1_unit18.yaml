  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Lotte अपार्टमेंट के बारे में पूछती है
    gloss: 'Lotte: नमस्ते Omar, Utrecht में तुम्हारा नया अपार्टमेंट कैसा है?'
    note: '*Nieuwe*, *nieuw* (नया) का रूपांतरित रूप है, जो संज्ञा से पहले आता है।'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar बताता है
    gloss: 'Omar: छोटा है, लेकिन आरामदेह है। मेरे पास एक शयनकक्ष, एक बैठक, एक रसोई और एक स्नानघर है।'
    note: यह पाठ 5 में पढ़े आवास-विज्ञापन से बिल्कुल मेल खाता है -- यही Omar का असली अपार्टमेंट है।
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Lotte बालकनी के बारे में पूछती है
    gloss: 'Lotte: क्या तुम्हारे पास बालकनी है?'
    note: यह सीधा हाँ/नहीं वाला प्रश्न है, जिसमें पिछली इकाइयों का *heb je ...?* फिर आया है।
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar उत्तर देता है
    gloss: 'Omar: हाँ, मेरे पास बालकनी है, लेकिन बगीचा नहीं है।'
    note: 'यह विज्ञापन में बताई गई बात से मेल खाता है: बालकनी है, बगीचा नहीं।'
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: Omar के लिए hij का प्रयोग
    gloss: 'Omar के बजाय आप hij भी कह सकते हैं: उसके पास बालकनी है।'
    note: बातचीत में Omar का परिचय हो जाने के बाद *Hij* (वह) उसके नाम की जगह ले सकता है।
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte गर्मजोशी से प्रतिक्रिया देती है
    gloss: 'Lotte: यह तो बढ़िया लगता है! मैं जल्दी ही किसी दिन मिलने आऊँगी।'
    note: '*Komen langs* (मिलने आना) वियोज्य क्रिया है; *langs* वाक्यांश के अंत में चला जाता है।'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar उसका स्वागत करता है
    gloss: 'Omar: बढ़िया, तुम्हारा हमेशा स्वागत है।'
    note: '*Altijd welkom* किसी को दोबारा आने का न्योता देने का गर्मजोशी भरा, स्वाभाविक तरीका है।'
