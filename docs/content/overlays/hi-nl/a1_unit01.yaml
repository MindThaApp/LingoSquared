teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: नमस्ते और हाय
    gloss: नमस्ते / हाय
    note: '*Hallo* तटस्थ है और अनौपचारिक व औपचारिक, दोनों मौक़ों पर चलता है। *Hoi* आम है और अनौपचारिक है।'
    example_gloss:
    - नमस्ते, क्या आप यहाँ नए हैं?
    - हाय, मैं नूर हूँ।
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: '"आप/तुम": अनौपचारिक और औपचारिक रूप'
    gloss: तुम (अनौपचारिक, ज़ोर देकर) / तुम (अनौपचारिक, सामान्य) / आप (औपचारिक)
    note: '*Jij* अनौपचारिक एकवचन है और तब आता है जब उस शब्द पर ज़ोर हो या तुलना हो। *Je* रोज़मर्रा की बोलचाल में बिना ज़ोर वाला सामान्य अनौपचारिक एकवचन रूप है। *U* सम्मानजनक दूरी दर्शाता है। नीदरलैंड्स में यह कुछ बुज़ुर्ग अजनबियों के साथ और स्पष्ट रूप से औपचारिक संबंधों में स्वाभाविक है, पर कई दुकानों और कार्यस्थलों में वयस्कों के बीच भी jij/je आम है।'
    example_gloss:
    - क्या तुम यहाँ नए हो? (अनौपचारिक, ज़ोर के साथ)
    - तुम यहाँ नए हो। (अनौपचारिक, बिना ज़ोर)
    - क्या आप यहाँ नए हैं? (औपचारिक)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: हमउम्र से पूछें कि क्या वह नया है
    gloss: क्या तुम यहाँ नए हो?
    note: 'प्रश्न में *jij bent* बदलकर *ben jij* हो जाता है: जब *jij* क्रिया के बाद आता है तो -t हट जाता है।'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: औपचारिक रूप से पूछें कि क्या कोई नया है
    gloss: क्या आप यहाँ नए हैं?
    note: '*u* के साथ *bent u* कहें। -t बना रहता है।'
  nl.a1.unit01.lesson01.teach.register_rule:
    title: '"आप/तुम" का रूप चुनना'
    gloss: 'jij/je: अनौपचारिक · u: औपचारिक या शिष्ट'
    note: दोस्तों, हमउम्र लोगों, बच्चों के साथ और कई सहज आधुनिक परिस्थितियों में *jij/je* का प्रयोग करें। जब संबंध में सम्मान या दूरी अपेक्षित हो, तब *u* का प्रयोग करें; पसंद अलग-अलग होती है, इसलिए सामने वाले व्यक्ति का अनुसरण करें।
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: सुबह, दोपहर और शाम के अभिवादन
    gloss: सुप्रभात / नमस्कार (दोपहर) / शुभ संध्या
    note: '*Goedemorgen* सुबह में, आमतौर पर दोपहर के आसपास तक कहा जाता है। *Goedemiddag* दोपहर के आसपास से पूरी दोपहर तक कहा जाता है। *Goedenavond* शाम का अभिवादन है।'
    example_gloss:
    - सुप्रभात! आप कैसे हैं?
    - नमस्कार, आप कैसे हैं? (औपचारिक)
    - शुभ संध्या! क्या आप यहाँ नए हैं?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: कैसा चल रहा है?
    gloss: आप कैसे हैं?
    note: '*Hoe gaat het?* किसी का हालचाल पूछने का आम और तटस्थ तरीक़ा है।'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: तुम कैसे हो? अनौपचारिक
    gloss: आप कैसे हैं?
    note: '*Met je* जिससे बात की जा रही है उसे स्पष्ट करता है और अनौपचारिक है।'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: आप कैसे हैं? औपचारिक
    gloss: आप कैसे हैं?
    note: जब मौक़ा औपचारिक संबोधन माँगे, तब *met u* का प्रयोग करें।
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'ठीक हूँ, धन्यवाद: अनौपचारिक'
    gloss: ठीक हूँ, धन्यवाद।
    note: '*Dank je* अनौपचारिक संबोधन के साथ मेल खाता है।'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'ठीक हूँ, धन्यवाद: औपचारिक'
    gloss: ठीक हूँ, धन्यवाद।
    note: '*Dank u* औपचारिक संबोधन के साथ मेल खाता है।'
  nl.a1.unit01.lesson02.teach.prima:
    title: बढ़िया
    gloss: बढ़िया / ठीक
    note: '*Prima* एक छोटा, सकारात्मक उत्तर है।'
    example_gloss: बढ़िया, धन्यवाद।
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: बुरा नहीं
    gloss: बुरा नहीं
    note: '*Niet slecht* आमतौर पर थोड़ा सकारात्मक उत्तर होता है।'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: और तुम? अनौपचारिक
    gloss: और आप?
    note: '*Jou* *met* के बाद आने वाला ज़ोरदार अनौपचारिक रूप है।'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: और आप? औपचारिक
    gloss: और आप?
    note: '*U* लौटाए गए प्रश्न को भी औपचारिक रखता है।'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: अनौपचारिक रूप से नाम पूछना
    gloss: आपका नाम क्या है?
    note: '*Hoe heet je?* नाम पूछने का सामान्य अनौपचारिक प्रश्न है।'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: औपचारिक रूप से नाम पूछना
    gloss: आपका नाम क्या है?
    note: '*Hoe heet u?* शिष्ट रूप है; *Wat is uw naam?* एक और औपचारिक विकल्प है, जो अधिक प्रशासनिक लगता है और यहाँ अभ्यास में नहीं है।'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: अपना नाम बताना
    gloss: मेरा नाम नूर है।
    note: '*Ik heet ...* अपना नाम बताने का सीधा, मानक तरीक़ा है।'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: स्वाभाविक ढंग से अपना परिचय दें
    gloss: मैं नूर हूँ।
    note: '*Ik ben ...* बोलचाल के परिचयों में विशेष रूप से आम है।'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: मेरा नाम है
    gloss: मेरा नाम नूर है।
    note: '*Mijn naam is ...* सही है, पर *Ik ben ...* या *Ik heet ...* से थोड़ा अधिक स्पष्ट लगता है।'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: आपसे मिलकर अच्छा लगा
    gloss: आपसे मिलकर खुशी हुई।
    note: यह पहली मुलाक़ात में मित्रतापूर्ण और स्वाभाविक है।
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: आपसे मिलकर ख़ुशी हुई
    gloss: आपसे मिलकर ख़ुशी हुई
    note: '*Aangenaam* पारंपरिक है और *Leuk je te ontmoeten* से अधिक औपचारिक है।'
    example_gloss: आपसे मिलकर ख़ुशी हुई! मैं नूर हूँ।
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: पूछें कि कोई कहाँ से है
    gloss: आप कहाँ से हैं?
    note: '*Kom je* अनौपचारिक प्रश्न रूप है।'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: औपचारिक रूप से पूछें कि कोई कहाँ से है
    gloss: आप कहाँ से हैं?
    note: '*u* के साथ क्रिया *komt* होती है: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: नीदरलैंड्स से
    gloss: मैं नीदरलैंड्स से हूँ।
    note: मूल देश से पहले *uit* का प्रयोग करें।
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: बेल्जियम से
    gloss: मैं बेल्जियम से हूँ।
    note: '*België* में दूसरे e के ऊपर दो बिंदु (ट्रेमा) होते हैं।'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: जर्मनी से
    gloss: मैं जर्मनी से हूँ।
    note: '*Duitsland* देश है; *Duits* भाषा है।'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: डच राष्ट्रीयता
    gloss: मैं डच हूँ।
    note: '*Nederlands* राष्ट्रीयता को भी बता सकता है और डच भाषा को भी।'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: बेल्जियाई राष्ट्रीयता
    gloss: मैं बेल्जियाई हूँ।
    note: यहाँ *Belgisch* बेल्जियाई राष्ट्रीयता बताता है।
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: डच बोलना
    gloss: मैं डच बोलता/बोलती हूँ।
    note: डच में भाषाओं के नाम बड़े अक्षर से शुरू होते हैं।
  nl.a1.unit01.lesson04.teach.speak_english:
    title: अंग्रेज़ी बोलना
    gloss: मैं अंग्रेज़ी बोलता/बोलती हूँ।
    note: '*Engels* अंग्रेज़ी के लिए डच शब्द है।'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: जर्मन बोलना
    gloss: मैं जर्मन बोलता/बोलती हूँ।
    note: '*Duits* जर्मन के लिए डच शब्द है।'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: भाषा कैफ़े और पुस्तकालय
    gloss: भाषा कैफ़े / पुस्तकालय
    note: '*Taalcafé* दूसरे लोगों के साथ बिना दबाव के डच का अभ्यास करने की एक सभा है। डच सार्वजनिक पुस्तकालयों में अक्सर स्थानीय गतिविधियाँ होती हैं, जिनमें भाषा कैफ़े भी शामिल हैं।'
    example_gloss:
    - मैं यहाँ भाषा कैफ़े के लिए आया/आई हूँ।
    - मैं पुस्तकालय में डच सीख रहा/रही हूँ।
  nl.a1.unit01.lesson05.teach.location:
    title: मिलने की जगह
    gloss: भाषा कैफ़े पुस्तकालय में है।
    note: इससे दृश्य की जगह तय होती है।
  nl.a1.unit01.lesson05.teach.here_for:
    title: साझा गतिविधि की पुष्टि करें
    gloss: क्या तुम यहाँ भाषा कैफ़े के लिए आए हो?
    note: जब दो लोग एक ही गतिविधि के लिए आते हैं, तब बातचीत शुरू करने का यह स्वाभाविक अनौपचारिक तरीक़ा है।
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: गतिविधि की पुष्टि करें
    gloss: हाँ, मैं यहाँ भाषा कैफ़े के लिए आया/आई हूँ।
    note: उत्तर में गतिविधि को साफ़ दोहराया गया है।
  nl.a1.unit01.lesson05.teach.learning:
    title: बताएँ कि आप क्या सीख रहे हैं
    gloss: मैं डच सीख रहा/रही हूँ।
    note: '*Leer* क्रिया *leren* (सीखना) का उत्तम पुरुष रूप है।'
  nl.a1.unit01.lesson05.teach.me_too:
    title: मैं भी
    gloss: मैं भी।
    note: '*Ik ook* किसी साझा बात को कहने का छोटा, स्वाभाविक तरीक़ा है।'
  nl.a1.unit01.lesson05.teach.first_time:
    title: पूछें कि क्या यह किसी की पहली बार है
    gloss: क्या यह तुम्हारी पहली बार है?
    note: नियमित होने वाली गतिविधि में यह मित्रतापूर्ण हल्की बातचीत है।
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: कहें कि यह आपकी पहली बार है
    gloss: हाँ, यह मेरा पहला मौक़ा है।
    note: '*Mijn* का अर्थ है "मेरा" या "मेरी"।'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte बातचीत शुरू करती है
    gloss: 'Lotte: हाय, मैं Lotte हूँ। आपका नाम क्या है?'
    note: इस आरामदेह समूह में Lotte अनौपचारिक *je* का प्रयोग करती है।
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar अपना नाम बताता है
    gloss: 'Omar: मेरा नाम Omar है। आपसे मिलकर अच्छा लगा।'
    note: वह नाम के सवाल का जवाब देता है और मुलाक़ात पर ख़ुशी जताता है।
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte पूछती है कि वह कहाँ से है
    gloss: 'Lotte: मुझे भी! आप कहाँ से हैं?'
    note: '*Jou ook!* कहना *Leuk je te ontmoeten* का एक स्वाभाविक छोटा जवाब है।'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar बताता है कि वह कहाँ से है
    gloss: 'Omar: मैं मिस्र से हूँ। और आप?'
    note: '*En jij?* वही सवाल अनौपचारिक ढंग से सामने वाले से पूछता है।'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte बातचीत आगे बढ़ाती है
    gloss: 'Lotte: मैं नीदरलैंड से हूँ। क्या आप पहली बार भाषा कैफ़े आए हैं?'
    note: '*Bij het taalcafé* का अर्थ है भाषा कैफ़े में, एक गतिविधि के रूप में।'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar जवाब देता है और बताता है कि वह क्या सीख रहा है
    gloss: 'Omar: हाँ, यह मेरा पहला मौक़ा है। मैं डच सीख रहा हूँ।'
