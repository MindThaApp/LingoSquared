    title: Ik vind वाली संरचना
    gloss: '*Ik vind* + मौसम + विशेषता से पता चलता है कि आपको कोई मौसम कैसा लगता है: मुझे गर्मी का मौसम पसंद है।'
    note: यह पहले सीखी गई राय बताने वाली संरचना *Ik vind X Y* (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig) ही है — कोई नया व्याकरण नहीं, बस एक नया प्रयोग। यहाँ *vind* के अंत में -t नहीं लगता, क्योंकि कर्ता *Ik* (उत्तम पुरुष) है; प्रश्न रूप *Welk seizoen vind jij mooi?* में भी -t नहीं है, क्योंकि *jij* क्रिया के बाद आता है (क्रम उलटने पर)। अन्य पुरुष का रूप *vindt* (जैसे *Omar vindt ...* में) एक अलग व्याकरण बिंदु है, जो आगे सिखाया जाएगा।
