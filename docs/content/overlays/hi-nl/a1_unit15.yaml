  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: विनम्रता से उत्तर देना
    gloss: आने-जाने का, कृपया।
    note: '*Alstublieft* औपचारिक "कृपया" है, जो बातचीत के *u* वाले औपचारिक रूप से मेल खाता है।'
  nl.a1.unit15.lesson01.teach.register_note:
    title: काउंटर पर संबोधन
    gloss: काउंटर पर आप आमतौर पर विनम्र रूप u का इस्तेमाल करते हैं।
    note: 'यह इकाई 1 में आए *jij*/*je* और *u* के भेद को आगे बढ़ाता है: सेवा-कर्मियों जैसे अजनबियों के लिए आमतौर पर *u* ही चलता है।'
  nl.a1.unit15.lesson02.teach.perron:
    title: प्लेटफ़ॉर्म
    gloss: प्लेटफ़ॉर्म
    note: '*Het perron* नपुंसक है; इसके साथ *het* आता है, *de* नहीं।'
    example_gloss: उट्रेख्त की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: प्लेटफ़ॉर्म पूछना
    gloss: उट्रेख्त की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
    note: '*Van welk perron* ख़ास तौर पर प्लेटफ़ॉर्म के बारे में पूछता है, किसी सामान्य जगह के बारे में नहीं।'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: रवानगी की जानकारी देना
    gloss: ट्रेन पौने दस बजे प्लेटफ़ॉर्म पाँच से जाती है।
    note: '*Kwart voor tien* में वही समय बताने का ढंग है जो इकाई 4 में आया था।'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: पहुँचने का समय पूछना
    gloss: ट्रेन किस समय पहुँचती है?
    note: '*Komt ... aan* वियोज्य क्रिया (*aankomen*) है; प्रश्न में *aan* अंत में चला जाता है।'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: पहुँचने का समय बताना
    gloss: ट्रेन ग्यारह बजे पहुँचती है।
    note: '*Komt aan* में फिर दिखता है कि वियोज्य क्रिया के दोनों भाग वाक्य में अलग-अलग जगह आते हैं।'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: समय पर / देरी
    gloss: समय पर; देरी
    note: '*Op tijd* एक स्थिर अभिव्यक्ति है, जिसका मतलब है समय-सारणी के अनुसार होना। *De vertraging* (देरी) de वाली संज्ञा है।'
    example_gloss:
    - ट्रेन समय पर नहीं जाती।
    - 'ध्यान दीजिए: उट्रेख्त की ट्रेन देर से चल रही है।'
  nl.a1.unit15.lesson03.teach.let_op:
    title: एक घोषणा
    gloss: 'ध्यान दीजिए: उट्रेख्त की ट्रेन देर से चल रही है।'
    note: '*Let op* (शब्दशः "ध्यान दो") स्टेशन की घोषणा की शुरुआत करता है, जैसे हिंदी में "यात्रीगण कृपया ध्यान दें"।'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: '"समय पर" का निषेध'
    gloss: ट्रेन समय पर नहीं जाती।
    note: '*Niet* पूरी अभिव्यक्ति को नकारने के लिए *op tijd* के ठीक पहले आता है।'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: प्लेटफ़ॉर्म में बदलाव
    gloss: ट्रेन प्लेटफ़ॉर्म पाँच की जगह प्लेटफ़ॉर्म तीन से जाती है।
    note: '*In plaats van* का मतलब है "की जगह"।'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: देरी की अवधि बताना
    gloss: ट्रेन दस मिनट देरी से चल रही है।
    note: '*Heeft vertraging* (शब्दशः "देरी है") यह कहने का स्वाभाविक तरीक़ा है कि कुछ देर से है; विशेषण *vertraagd* भी इस्तेमाल होता है।'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: प्रवेश, निकास, प्रतीक्षालय
    gloss: प्रवेश; निकास; प्रतीक्षालय
    note: '*De ingang*, *de uitgang* और *de wachtruimte* सभी de वाली संज्ञाएँ हैं।'
    example_gloss:
    - प्रवेश द्वार कहाँ है?
    - निकास कहाँ है?
    - प्रतीक्षालय कहाँ है?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: प्लेटफ़ॉर्म कहाँ है, पूछना
    gloss: प्लेटफ़ॉर्म सात कहाँ है?
    note: इसमें इकाई 9 के रास्ता पूछने वाले पाठों का *Waar is...?* ढाँचा फिर आया है।
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
