  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: प्रतीक्षालय के बारे में पूछना
    gloss: प्रतीक्षालय कहाँ है?
    note: वही प्रश्न-पैटर्न, एक नई जगह के लिए।
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: छपा हुआ टिकट पढ़ना
    gloss: 'टिकट: आम्स्टर्डम सेंट्रल से उट्रेख्त सेंट्रल। प्रस्थान: दस बजकर दस मिनट, प्लेटफ़ॉर्म सात। आगमन: ग्यारह बजने में दस मिनट। आना-जाना। क़ीमत: बारह यूरो चालीस।'
    note: रवानगी का समय और प्लेटफ़ॉर्म, आगमन का समय, टिकट का प्रकार और कीमत पर ध्यान दीजिए।
    glosses:
      Kaartje: टिकट
      Vertrek: रवानगी
      tien: दस
      perron: प्लेटफ़ॉर्म
      zeven: सात
      Aankomst: आगमन
      elf: ग्यारह
      Retour: आने-जाने का टिकट
      Prijs: कीमत
      twaalf: बारह
      euro: यूरो
      veertig: चालीस
  nl.a1.unit15.lesson06.teach.omar_open:
    title: उमर योजना बताता है
    gloss: 'उमर: हमें प्लेटफ़ॉर्म सात पर जाना है। ट्रेन दस बजकर दस मिनट पर चलती है।'
    note: '*Moeten* (ज़रूरत होना) यहाँ व्यावहारिक ज़रूरत बताता है, कड़ी बाध्यता नहीं।'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: लोटे बोर्ड पढ़ती है
    gloss: 'लोटे: देखो, वहाँ बोर्ड लगा है: देरी, दस मिनट।'
    note: '*Daar staat* (शब्दशः "वहाँ खड़ा है") यह कहने का स्वाभाविक तरीक़ा है कि बोर्ड पर कुछ लिखा है।'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: उमर शांत रहता है
    gloss: 'उमर: कोई बात नहीं, हमारे पास अभी कॉफ़ी के लिए समय है।'
    note: '*Geen probleem* तसल्ली देने का आम, अनौपचारिक तरीक़ा है।'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: ट्रेन आ जाती है
    gloss: 'लोटे: अच्छा विचार है। अरे, ट्रेन तो आ भी गई। प्लेटफ़ॉर्म सात, बिल्कुल सही!'
    note: '*Al* (पहले ही) बताता है कि अभी घोषित देरी को देखते हुए ट्रेन उम्मीद से जल्दी आ गई।'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: वे ट्रेन में चढ़ते हैं
    gloss: 'उमर: चलो, ट्रेन में चढ़ते हैं। उट्रेख्त, हम आ रहे हैं!'
    note: '*Stappen in* (चढ़ना) वियोज्य क्रिया है; *in* वाक्यांश के अंत में चला जाता है। *We komen eraan* (शब्दशः "हम उसके पास आ रहे हैं") "हम आ रहे हैं" कहने का स्वाभाविक डच तरीक़ा है; इसका शब्द-दर-शब्द अनुवाद अटपटा लगेगा।'
