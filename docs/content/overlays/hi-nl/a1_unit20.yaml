    gloss: 'ओमर: हाँ, यह अच्छी तरह फ़िट होता है और गर्म है।'
    note: यह वही कोट है जिसकी रसीद आपने पढ़ी थी; बातें बिल्कुल वही हैं।
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: लोटे रंग के बारे में पूछती है
    gloss: 'लोटे: बढ़िया! तुम इसे काले रंग में लोगे या नीले में?'
    note: '*Wil je... of...?* में वही विकल्प देने वाला ढाँचा है जो इकाई 13 के पसंद वाले पाठों में था।'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: ओमर तय करता है
    gloss: 'ओमर: मैं इसे काले रंग में लूँगा।'
    note: '*Nemen* (लेना) ख़रीद का चुनाव पक्का करने के लिए स्वाभाविक क्रिया है, जो रसीद में लिखे रंग से मेल खाती है।'
  nl.a1.unit20.lesson06.teach.neemt_form:
