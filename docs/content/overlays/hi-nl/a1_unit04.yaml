    gloss: क्या मुझे देर हो गई है?
    note: यहाँ *Laat* का अर्थ "देर" है; यह वाक्य समय की बातचीत में स्वाभाविक रूप से आता है।
  nl.a1.unit04.lesson03.teach.on_time:
    title: बताइए कि कोई समय पर है
    gloss: नहीं, तुम समय पर हो।
    note: '*Op tijd* का अर्थ "समय पर" है। *Je* बातचीत को अनौपचारिक रखता है।'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: चौदह सौ घंटे
    gloss: 14:00 — चौदह बजे (24 घंटे की घड़ी)
