    gloss: 2:00 — रात दो बजे
    note: '*''s Nachts* रात के घंटों के लिए है; 02:00 को स्वाभाविक रूप से *twee uur ''s nachts* कहते हैं।'
  nl.a1.unit04.lesson04.teach.day_parts:
