    gloss: 20:00 — शाम आठ बजे
    note: '*''s Avonds* शाम के समय के लिए है, मोटे तौर पर देर दोपहर के बाद से लगभग आधी रात तक।'
  nl.a1.unit04.lesson04.teach.night:
