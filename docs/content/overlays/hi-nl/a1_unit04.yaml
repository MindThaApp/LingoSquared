  nl.a1.unit04.lesson01.teach.three_oclock:
    title: तीन बजे
    gloss: 3:00 — तीन बजे
    note: '*Drie uur* यानी ठीक 3:00।'
  nl.a1.unit04.lesson01.teach.half_three:
    title: तीन की ओर आधा रास्ता
    gloss: 2:30 — ढाई बजे
    note: 'ध्यान दें: डच *half drie* आने वाले घंटे को बताता है, यानी 2:30, 3:30 नहीं। हिंदी का "साढ़े तीन" 3:30 होता है, इसलिए यहाँ सावधान रहिए।'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half अगले घंटे की ओर इशारा करता है
    gloss: तीन बजे की ओर आधा रास्ता = ढाई = 2:30
    note: '*half* + घंटे को उस घंटे की ओर आधा रास्ता समझिए। इसलिए *half vier* यानी 3:30।'
  nl.a1.unit04.lesson01.teach.half_four:
    title: चार की ओर आधा रास्ता
    gloss: 3:30 — साढ़े तीन बजे
    note: '*Half vier* चार की ओर आधा रास्ता है, इसलिए इसका अर्थ 3:30 है।'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: आधा घंटा बताना
    gloss: ढाई बजे हैं।
    note: वर्तमान समय बताने का सामान्य ढाँचा *Het is ...* है।
  nl.a1.unit04.lesson02.teach.quarter:
    title: चौथाई घंटा
    gloss: चौथाई घंटा
    note: '*Kwart* घड़ी की निश्चित अभिव्यक्तियों *kwart over* और *kwart voor* में आता है।'
    example_gloss: एक चौथाई घंटा पंद्रह मिनट का होता है।
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: सवा दो
    gloss: 2:15 — सवा दो बजे
    note: '*Kwart over twee* यानी दो बजने के पंद्रह मिनट बाद।'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over का अर्थ है "बाद"
    gloss: बाद = पूरे घंटे के बाद
    note: घड़ी की अभिव्यक्ति में *over* बीते हुए घंटे से आगे गिनता है।
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: पौने तीन
    gloss: 2:45 — पौने तीन बजे
    note: '*Kwart voor drie* यानी तीन बजने से पंद्रह मिनट पहले, इसलिए 2:45।'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor का अर्थ है "पहले"
    gloss: पहले = अगले पूरे घंटे से पहले
    note: घड़ी की अभिव्यक्ति में *voor* अगले घंटे की ओर इशारा करता है।
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: सवा तीन
    gloss: 3:15 — सवा तीन बजे
    note: '*Over* अभी बीत चुके घंटे को रखता है: *kwart over drie* (सवा तीन)।'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: पौने चार
    gloss: 3:45 — पौने चार
    note: '*Voor* आने वाले घंटे का नाम लेता है: *kwart voor vier* यानी 3:45।'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: '*Hoe laat is het?* अभी का समय पूछने का सामान्य, रोज़मर्रा का प्रश्न है।'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: समय बताइए
    gloss: ढाई बजे हैं।
    note: 'ध्यान रखिए: हिंदी में "साढ़े तीन" का मतलब 3:30 है, पर डच में घंटे का शब्द *drie* होने पर भी यह 2:30 होता है।'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: पूछिए कि कोई कार्यक्रम कब शुरू होता है
    gloss: भाषा कैफ़े कितने बजे शुरू होता है?
    note: '*Hoe laat* घड़ी का समय पूछने वाले प्रश्न की शुरुआत करता है।'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: सवा दो बजे
    gloss: सवा दो बजे।
    note: जब बताना हो कि कोई घटना कब होती है, तो समय से पहले *om* लगाइए।
  nl.a1.unit04.lesson03.teach.at_rule:
    title: कार्यक्रम के समय के लिए om का प्रयोग
    gloss: 'पर/बजे + समय: दो बजे, ढाई बजे'
    note: जब आप *Het is* से केवल अभी का समय बता रहे हों, तब *om* का प्रयोग न करें।
  nl.a1.unit04.lesson03.teach.late:
