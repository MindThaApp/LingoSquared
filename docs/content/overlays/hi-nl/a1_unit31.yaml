    gloss: मुझे जानवर बहुत पसंद हैं।
    note: पहले की एक इकाई के पसंद-नापसंद वाले पाठ से *houden van* को यहाँ फिर से जानवरों के लिए इस्तेमाल किया गया है।
  nl.a1.unit31.lesson03.teach.fenna_katten_geen:
    title: Fenna को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है
    gloss: Fenna को बिल्लियाँ पसंद हैं, लेकिन उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  nl.a1.unit31.lesson04.teach.omar_vraagt_huisdier:
    title: Omar पालतू जानवर के बारे में पूछता है
    gloss: 'Omar: क्या तुम्हारे पास कोई पालतू जानवर है, Lotte?'
  nl.a1.unit31.lesson04.teach.lotte_ja_hond:
    title: Lotte के पास एक कुत्ता है
    gloss: 'Lotte: हाँ, मेरे पास एक कुत्ता है।'
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit:
    title: Omar पूछता है कि वह कैसा दिखता है
    gloss: 'Omar: वह कैसा दिखता है?'
    note: रूप-रंग वाली एक पहले की इकाई से *Hoe ziet ... eruit?* प्रश्न को यहाँ फिर से इस्तेमाल किया गया है, अब किसी जानवर के बारे में।
  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: Lotte अपने कुत्ते का वर्णन करती है
    gloss: 'Lotte: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: जानवरों के लिए hij/hem
    gloss: Hij (वह) और hem (उसे) का प्रयोग जानवर के लिए भी किया जा सकता है, केवल व्यक्ति के लिए नहीं।
    note: इस कोर्स में अब तक hij/hem हर बार किसी व्यक्ति के लिए आया था; यह नोट साफ़ बताता है कि इसका प्रयोग जानवरों के लिए भी होता है।
