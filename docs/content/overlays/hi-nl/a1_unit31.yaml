    title: Omar सैर के बारे में पूछता है
    gloss: 'Omar: क्या तुम उसे हर दिन बाहर घुमाने ले जाती हो?'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
    title: Lotte अपनी दिनचर्या बताती है
    gloss: 'Lotte: हाँ, मैं उसे हर दिन बाहर घुमाने ले जाती हूँ और उसे खाना देती हूँ।'
  nl.a1.unit31.lesson05.teach.tekst:
    title: जानवरों के बारे में Omar, Fenna और Sander
    gloss: 'Omar और Fenna दोनों को जानवर पसंद हैं, लेकिन दोनों में से किसी के पास पालतू जानवर नहीं है। Omar को कुत्ते पसंद हैं और Fenna को बिल्लियाँ। Sander के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन बिल्ली को खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      houden: बहुत पसंद है
      allebei: दोनों
      dieren: जानवर
      beiden: दोनों
      huisdier: पालतू जानवर
      honden: कुत्ते
      katten: बिल्लियाँ
      kat: बिल्ली
      speelt: खेलता है
      geeft: देता है
      elke: हर
      eten: खाना
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Sander अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*vaak* (अक्सर) पहले की एक इकाई में Omar की दिनचर्या के लिए आ चुका है; यहाँ उसे फिर से इस्तेमाल किया गया है।'
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: Lotte, Nina से पूछती है
    gloss: 'Lotte: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  nl.a1.unit31.lesson06.teach.nina_ja_vogel:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Heet* (नाम है) वही क्रिया है जो बिल्कुल पहली इकाई में परिचय देने के लिए आई थी।'
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: Omar की प्रतिक्रिया
    gloss: 'Omar: कितना अच्छा! तुम हर दिन उसके साथ क्या करती हो?'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
    title: Omar को भी पक्षी पसंद हैं
    gloss: 'Omar: मुझे भी पक्षी पसंद हैं।'
  nl.a1.unit31.lesson06.teach.lotte_afsluiting:
    title: Lotte बातचीत समाप्त करती है
    gloss: 'Lotte: कितना अच्छा है कि हम तीनों को जानवर पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
