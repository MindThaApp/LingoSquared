    - मेरी एक बहन है।
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: बच्चा और बच्चे
    gloss: बच्चा / बच्चे
    note: '*Kind* के साथ *het* आता है: *het kind*। बहुवचन *kinderen* के साथ *de* आता है, भले ही एकवचन *kind* के साथ het आता है।'
    example_gloss:
    - मेरी बहन का एक बच्चा है।
    - मेरे चाचा और चाची के दो बच्चे हैं।
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: मेरा एक भाई और एक बहन है
    gloss: मेरा एक भाई और एक बहन है।
    note: अपने परिवार के सदस्यों के बारे में बताने का सामान्य तरीका *Ik heb ...* है।
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: दादा, दादी, चाचा और चाची
    gloss: दादा / दादी / चाचा / चाची
    note: '*Opa* दादा के लिए रोज़ की बोलचाल का शब्द है; *grootvader* अधिक औपचारिक या लिखित रूप है। *Oma* दादी के लिए रोज़ की बोलचाल का शब्द है; *grootmoeder* अधिक औपचारिक या लिखित रूप है। *De oom*। *De tante*।'
    example_gloss:
    - मेरे दादा और दादी रॉटरडैम में रहते हैं।
    - मेरी दादी निन्यानवे साल की हैं।
    - मेरे चाचा एम्स्टर्डम में रहते हैं।
    - मेरे चाचा और चाची के दो बच्चे हैं।
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef और nicht के एक से अधिक अर्थ हैं
    gloss: neef = चचेरा भाई या भतीजा; nicht = चचेरी बहन या भतीजी
    note: डच में चचेरे भाई-बहन और भतीजे-भतीजी के लिए अलग-अलग शब्द नहीं हैं; किसका अर्थ है, यह संदर्भ से पता चलता है। इस इकाई के अभ्यासों में इनकी परीक्षा नहीं होगी; इन्हें यहाँ इसलिए बताया गया है कि आप बाद में इन शब्दों को पहचान सकें।
    target_text: neef = चचेरा/ममेरा भाई या भतीजा/भांजा; nicht = चचेरी/ममेरी बहन या भतीजी/भांजी
  nl.a1.unit05.lesson02.teach.gezin:
    title: परिवार (साथ रहने वाला)
    gloss: परिवार (साथ रहने वाला)
    note: '*Gezin* उस घर-परिवार को कहते हैं जिसमें आप रहते हैं (आमतौर पर माता-पिता और बच्चे); *familie* व्यापक शब्द है, जो विस्तृत परिवार और रिश्तेदारों के लिए आता है।'
    example_gloss: मेरा परिवार यूट्रेख्त में रहता है।
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: मेरे दादा-दादी रॉटरडैम में रहते हैं
    gloss: मेरे दादा और दादी रॉटरडैम में रहते हैं।
    note: कोई कहाँ रहता है, यह बताने के लिए *Wonen in* के साथ शहर का नाम आता है।
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: मेरे चाचा और चाची के दो बच्चे हैं
    gloss: मेरे चाचा और चाची के दो बच्चे हैं।
    note: '*Oom en tante* दो लोगों के लिए है, इसलिए *hebben* का प्रयोग होता है।'
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: मेरा और तुम्हारा (बिना ज़ोर और ज़ोर के साथ)
    gloss: मेरा / तुम्हारा (बिना ज़ोर) / तुम्हारा (ज़ोर के साथ)
    note: '*Mijn* का रूप de और het वाले शब्दों के आगे, एकवचन हो या बहुवचन, हमेशा वही रहता है। *Je* अनौपचारिक रूप है, जो तब आता है जब आप यह नहीं जता रहे कि किसका है; इसका रूप भी हर संज्ञा के आगे वही रहता है। *Jouw*, *je* से ज़्यादा ज़ोरदार है और तब ज़रूरी होता है जब एक व्यक्ति के परिवार के सदस्य की दूसरे से तुलना की जाए; इसका रूप भी हर संज्ञा के आगे वही रहता है।'
    example_gloss:
    - यह मेरा भाई है।
    - क्या यह तुम्हारी बहन है?
    - क्या वह तुम्हारी बहन है?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je और jouw में अंतर
    gloss: je और jouw दोनों का अर्थ अनौपचारिक 'तुम्हारा' है
    note: जब कोई विशेष ज़ोर न हो, तब *je* का प्रयोग करें। जब आप ज़ोर देकर बताना चाहें कि किसका है, खासकर तुलना में, तब *jouw* का प्रयोग करें। तुलना के बिना भी पूरा रूप *jouw* संभव है, पर वहाँ *je* ज़्यादा प्रचलित है।
    target_text: je और jouw, दोनों का अर्थ अनौपचारिक 'तुम्हारा' है। ज़ोर न देना हो तो सामान्यतः je बोला जाता है; jouw ज़्यादा ज़ोरदार है और तुलना या विरोध दिखाने के लिए ज़रूरी है। दोनों हर संज्ञा से पहले एक ही रूप में रहते हैं।
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: यह मेरा भाई है
    gloss: यह मेरा भाई है।
    note: '*Dit is ...* से पास खड़े किसी व्यक्ति का परिचय दिया जाता है।'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: क्या वह तुम्हारी बहन है?
    gloss: क्या वह तुम्हारी बहन है?
    note: '*Dat is ...* का प्रयोग उस व्यक्ति के लिए होता है जो दूर है या जिसकी बात पहले हो चुकी है।'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: उसका (पुरुष) और उसकी (स्त्री) के लिए शब्द
    gloss: उसका (पुरुष के लिए) / उसका (स्त्री के लिए)
    note: '*Mijn*, *je* और *jouw* की तरह *zijn* का रूप भी हमेशा वही रहता है। *Haar* का रूप भी हमेशा वही रहता है।'
    example_gloss:
    - यह उसके पिता हैं।
    - वह उसकी माँ हैं।
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn और haar में अंतर
    gloss: zijn = उसका (पुरुष के लिए), haar = उसका (स्त्री के लिए)
    note: 'इन उदाहरणों में स्वामी पुरुष हो तो *zijn* और स्त्री हो तो *haar* चुनें। आगे आने वाले परिवार के शब्द से चुनाव नहीं बदलता: *zijn vader* और *zijn moeder*; *haar vader* और *haar moeder*।'
    target_text: zijn = 'उस पुरुष का', haar = 'उस स्त्री का'; आगे चाहे जो संज्ञा आए, दोनों का रूप वही रहता है।
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: यह उसके पिता हैं
    gloss: यह उसके पिता हैं।
    note: '*Zijn vader* — उसके पिता।'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: वह उसकी माँ हैं
    gloss: वह उसकी माँ हैं।
    note: '*Haar moeder* — उसकी माँ।'
  nl.a1.unit05.lesson05.teach.heet:
    title: नाम है
    gloss: नाम है
    note: '*Ik heet...* / *Hij heet...* — किसी का नाम बताने का सामान्य तरीका, जो इकाई 1 में आ चुका है।'
    example_gloss: मेरा नाम लॉटे है।
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'परिवार के सदस्यों के नाम: Sander, Fenna, Jan और Marieke'
    gloss: डच पुरुष नाम / डच स्त्री नाम / डच पुरुष नाम / डच स्त्री नाम
    note: ये चारों प्रचलित डच नाम हैं — Sander और Jan पुरुषों के नाम हैं, Fenna और Marieke स्त्रियों के नाम हैं।
    example_gloss:
    - मेरे भाई का नाम सैंडर है।
    - मेरी बहन का नाम फेना है।
    - मेरे पिता का नाम यान है।
    - मेरी माँ का नाम मारीके है।
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: रॉटरडैम
    note: नीदरलैंड का एक बड़ा शहर।
    example_gloss: लॉटे के दादा और दादी रॉटरडैम में रहते हैं।
  nl.a1.unit05.lesson05.teach.profile:
    title: लॉटे के परिवार का परिचय
    gloss: मेरा नाम लॉटे है। मेरा एक भाई और एक बहन है। मेरे भाई का नाम सैंडर है और मेरी बहन का नाम फेना है। मेरे पिता का नाम यान है और मेरी माँ का नाम मारीके है। मेरे दादा और दादी रॉटरडैम में रहते हैं।
    note: लॉटे का अपने परिवार के बारे में छोटा-सा बोला गया परिचय, जिसमें इस इकाई के पिछले पाठों की शब्दावली दोहराई गई है।
  nl.a1.unit05.lesson06.teach.egypte:
    title: मिस्र
    gloss: मिस्र
    note: ओमर का अपना देश, जैसा पिछली इकाइयों में भी था।
    example_gloss: मेरे माता-पिता मिस्र में रहते हैं।
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: हर महीने
    gloss: हर महीने
    note: '*Elke* के साथ एकवचन संज्ञा आने पर ''हर ...'' का अर्थ मिलता है।'
    example_gloss: हाँ, हर महीने।
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: क्या आपके भाई-बहन हैं?
    gloss: 'लॉटे: ओमर, क्या तुम्हारे भाई या बहनें हैं? ओमर: हाँ, मेरी दो बहनें हैं। भाई कोई नहीं। और तुम्हारे? लॉटे: मेरा एक भाई और एक बहन है।'
    note: '*Broers of zussen* — भाई या बहनें, बहुवचन रूपों में।'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: क्या तुम्हारे माता-पिता भी नीदरलैंड में रहते हैं?
    gloss: 'ओमर: क्या तुम्हारे माता-पिता भी नीदरलैंड में रहते हैं? लॉटे: हाँ, मेरे माता-पिता यूट्रेख्त में रहते हैं। और तुम्हारा परिवार? ओमर: मेरे माता-पिता मिस्र में रहते हैं, लेकिन मेरे चाचा यहाँ एम्स्टर्डम में रहते हैं।'
    note: '*Wonen ook in* — भी रहते हैं; यह पूछने के लिए कि क्या यही बात किसी और के लिए भी सच है।'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: क्या तुम उनसे अक्सर मिलते हो?
    gloss: 'लॉटे: अच्छा! क्या तुम उनसे अक्सर मिलते हो? ओमर: हाँ, हर महीने।'
    note: '*Zie je hem vaak?* — मिलने की बारंबारता पूछने का स्वाभाविक और आम तरीका।'
