  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: माता-पिता, भाई और बहन
    gloss: माता-पिता / भाई / बहन
    note: इस अर्थ में *Ouders* हमेशा बहुवचन में होता है; *de broer* और *de zus* दोनों के साथ *de* आता है।
