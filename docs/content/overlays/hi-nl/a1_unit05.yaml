teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: पिता और माँ
    gloss: पिता / माँ
    note: '*Vader* पिता के लिए मानक, तटस्थ शब्द है। *Moeder* माँ के लिए मानक, तटस्थ शब्द है।'
