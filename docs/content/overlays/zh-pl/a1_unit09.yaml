teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: 去，走到
    gloss: 去；走到／到达
    note: 两个意思相近的动作动词——iść 是泛指的“去／走”，dojść 专指“到达”某个目的地，用于本课所教的问路句型。
    example_gloss:
    - 请直走。
    - 去银行怎么走？
  pl.a1.unit09.lesson01.teach.prosto:
    title: 一直往前
    gloss: 一直往前
    note: 最基本的方向词——紧跟在 iść 后面，表示“直走”。
    example_gloss: 请直走到公园。
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: 那里，然后
    gloss: 那里；然后
    note: Tam 指示地点；potem 用来排列步骤（“先这样，然后那样”）——两者对于把指路的话串联起来都必不可少。
    example_gloss:
    - 银行在那里。
    - 然后，请直走。
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + 不定式
    gloss: 请 + 不定式——Proszę（请）加上动词的不定式（词典形式），是日常礼貌地指路的方式，不需要单独的命令形式：请直走。
    note: '*Proszę* 加动词不定式，是波兰语礼貌地请别人做某事的方式——*Proszę iść prosto*（“请直走”）。对陌生人用这种说法最稳妥、最礼貌，所以无论是指路还是听懂路，你都不需要单独的“命令形式”。（朋友之间，波兰人通常改用那种命令形式——以后你会学到。）'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: 去……怎么走？
    gloss: 怎么去……？——Jak（怎么）加 dojść（到达）用来问去某个地方的路：去银行怎么走？去酒店怎么走？去公园怎么走？do 后面的名词和上一单元 obok、naprzeciwko 后面一样，要用 -u 结尾的二格：bank → banku，hotel → hotelu，park → parku。
    note: '*Jak dojść do...?* 是询问如何到达某地的日常问句。*do* 后面的地点名称要用二格，词尾 *-u* 和你在 *obok*、*naprzeciwko* 后面学过的完全一样：*bank* 变成 *banku*，*hotel* 变成 *hotelu*，*park* 变成 *parku*。规律相同，只是换了一个新的前置词。'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: 去银行怎么走？
    gloss: 去银行怎么走？
    note: 把语法要点用在本课的第一个目的地上。
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: 右，左
    gloss: 右；左
    note: 放在 na 后面，表示某物在哪一边或往哪边转：na prawo（向右／在右边），na lewo（向左／在左边）。
    example_gloss:
    - 银行在右边。
    - 公园在左边。
  pl.a1.unit09.lesson02.teach.skrecic:
    title: 转弯
    gloss: 转弯
    note: 表示改变方向的动词，和 na prawo／na lewo 搭配，意思是“右转”“左转”。
    example_gloss: 请右转。
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: 请左转
    gloss: 请左转。
    note: 还是同样的 Proszę 加动词不定式的句型，这次用的是 skręcić 和 na lewo。
  pl.a1.unit09.lesson02.teach.ulica:
    title: 街道
    gloss: 街道
    note: 指任何一条街的普通词语，指路时提到具体街名的时候很有用。
    example_gloss: 那条街在那边。
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: 用 potem 连接指示
    gloss: 请直走，然后右转。——几个指示可以用逗号和 potem（然后）连接起来：先做一件事，再做下一件。
    note: 要连续给出多个指示，只要用逗号和 *potem* 连接即可：*Proszę iść prosto, potem skręcić na prawo*（“请直走，然后右转”）。你听到的真实多步指路，就是这样构成的。
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: 我明白了
    gloss: 我明白了
    note: 在继续追问之前，用来确认你听懂了路线的实用说法。
    example_gloss: 我明白了，谢谢。
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa 问去公园怎么走
    gloss: Ewa 先说“打扰一下”，然后问去公园怎么走。
    note: Przepraszam 用来引出问题，和上一单元地点对话中的礼貌习惯一样。
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: 路人给出去公园的路线
    gloss: 路人说先直走，然后左转。公园就在那边。
    note: 用 potem 连接的两个指示，正如本课语法要点所讲。
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa 确认听懂并问去银行怎么走
    gloss: Ewa 说她明白了，并问去银行怎么走。
    note: Rozumiem 表示她听懂了第一段路线，然后再提出新问题。
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: 路人给出去银行的路线
    gloss: 路人说先右转，然后直走。银行在右边。
    note: 与去公园不同的两步路线，同样使用 Proszę 加动词不定式的句型。
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa 道谢
    gloss: Ewa 说非常感谢。
    note: Dziękuję bardzo，在购物和地点单元中出现过。
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: 路人回应
    gloss: 路人说不客气。
    note: Proszę bardzo，回应感谢的标准说法，前面的单元中出现过。
