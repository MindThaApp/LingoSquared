    title: Lubię 的结构
    gloss: '*Lubię* + 季节，表示你喜欢哪个季节：*Lubię lato.* 季节用宾格：*wiosnę*，*zimę*。'
    note: '*Lubię*（“我喜欢”）后接宾格：以 *-a* 结尾的阴性名词变为 *-ę*（*zima* -> *zimę*，*wiosna* -> *wiosnę*），而 *jesień* 和 *lato*（以 *-o* 结尾的名词）形式不变。要表达你对某个季节的看法，用 *Uważam* + 宾格 + *za* + 形容词：*Uważam jesień za ładną*。'
