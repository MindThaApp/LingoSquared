teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: 我是工程师／老师
    gloss: 我是工程师。我是老师。——inżynier 和 nauczycielka 在 Jestem 之后词尾会发生变化。
    note: 在本课程中，这是第一次用词尾变化来表示职业——目前只适用于这两个职业词。
  pl.a1.unit17.lesson01.teach.inzynier:
    title: 工程师
    gloss: 工程师
    note: 在日常波兰语中，这个词对女性也通常仍说 *inżynier*。
    example_gloss: 马雷克是工程师。
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: 教师
    gloss: 老师（男）／老师（女）
    note: 与 *inżynier* 不同，这个职业词会随性别变化——男性用 *nauczyciel*，女性用 *nauczycielka*。
    example_gloss:
    - 他是老师。
    - 埃娃是老师。
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: 再说马雷克和埃娃
    gloss: Marek、Ewa——你们在之前的课中已经学过这两个名字。
    note: 本课要用到这两个名字，先快速复习一下。
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Jest（是）——再复习
    gloss: Jest（是）——你在之前的课中已经学过这个词，例如 'Dom jest tam'（房子在那里）。
    note: 本课要用它来谈论某人的职业，先快速复习一下。
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: 马雷克的职业
    gloss: 马雷克是工程师。
    note: 本单元围绕马雷克的这个事实展开。
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: 埃娃的职业
    gloss: 埃娃是老师。
    note: 本单元围绕埃娃的这个事实展开。
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: 工作——你工作
    gloss: Pracować（工作；pracuję 你在之前的课中已经学过）：pracuję（我），pracujesz（你）。你在哪里工作？
    note: 目前只学两种形式——说自己用 *pracuję*，问对方用 *pracujesz*，与上一单元的 *czuć się* 规律相同。
  pl.a1.unit17.lesson02.teach.szkola:
    title: 学校
    gloss: 学校
    note: 像埃娃这样的老师工作的地方。
    example_gloss: 我在学校工作。
  pl.a1.unit17.lesson02.teach.biuro:
    title: 办公室
    gloss: 办公室
    note: 像马雷克这样的工程师工作的地方。
    example_gloss: 我在办公室工作。
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: 在学校，在办公室
    gloss: W + 工作地点：w szkole、w biurze——与 w Warszawie、w Krakowie 的规律相同。
    note: 和你已经学过的城市名用法一样（*w Warszawie*、*w Krakowie*）——词尾会稍微变化，用来表示地点“*在*”。
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: 你在哪里工作？
    gloss: 你在哪里工作？
    note: 询问别人工作的自然问法。
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: 那你呢——再复习
    gloss: A ty（那你呢）——你在之前的课中已经学过这个表达。
    note: 进入本课对话之前，先快速复习一下。
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: 马雷克问埃娃的工作
    gloss: 埃娃，你在哪里工作？
    note: 马雷克直接用一个问题开始了对话。
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: 埃娃回答
    gloss: 我在学校工作。我是老师。
    note: 埃娃说了自己的工作地点和职业——正是本单元前面讲过的内容。
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: 埃娃反问马雷克
    gloss: 那你呢，马雷克？你在哪里工作？
    note: 埃娃把问题抛回给马雷克。
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: 马雷克回答
    gloss: 我在办公室工作。我是工程师。
    note: 马雷克说了自己的工作地点和职业——正是本单元前面讲过的内容。
