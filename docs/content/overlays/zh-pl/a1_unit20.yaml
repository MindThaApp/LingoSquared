teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: 是、这是、我想要——再复习
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do——这些词你在前面的课里已经学过了。
    note: 本课要用这些词来谈买衣服，先快速复习一下。
  pl.a1.unit20.lesson01.teach.sklep:
    title: 商店
    gloss: 商店
    note: 表示“店铺”的通用词。
    example_gloss: 我去商店。
  pl.a1.unit20.lesson01.teach.koszula:
    title: 衬衫
    gloss: 衬衫
    note: 阴性名词——要搭配阴性形容词形式。
    example_gloss: 这是一件衬衫。
  pl.a1.unit20.lesson01.teach.spodnie:
    title: 裤子
    gloss: 裤子
    note: 在波兰语中永远是复数，即使只有一条也一样——没有单数形式。
    example_gloss: 这是裤子。
  pl.a1.unit20.lesson01.teach.kupic:
    title: 买
    gloss: 买
    note: 用在 *chcę*（我想）之后，就像前面课里的 *iść*（去）一样：*chcę kupić*——我想买。
    example_gloss: 我想买一件衬衫。
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: 我想买裤子
    gloss: 我想买裤子。
    note: 同样是 chcę 加动词不定式的结构，这里用来说裤子。
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: 这件衬衫多少钱？
    gloss: 这件衬衫多少钱？
    note: 询问某件商品价格的自然说法，沿用了购物课里的 *Ile kosztuje*。
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: 什么样的——阳性形式
    gloss: Jaki, Jaka——*Jaki* 用来询问阳性名词，*Jaka* 用来询问阴性名词（*Jaka* 你在天气课里已经学过）。
    note: '*Kolor*（颜色）是阳性名词，所以与 *Jaki* 搭配，而不是 *Jaka*。'
  pl.a1.unit20.lesson02.teach.kolor:
    title: 颜色
    gloss: 颜色
    note: 阳性名词。
    example_gloss: 什么颜色？
  pl.a1.unit20.lesson02.teach.sukienka:
    title: 连衣裙
    gloss: 连衣裙
    note: 又一个阴性名词，和 *koszula* 一样。
    example_gloss: 这是一条连衣裙。
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: 蓝色
    gloss: Koszula jest niebieska.——*niebieska* 与阴性名词相配，比如 *koszula*。
    note: 目前只学这一个形式——在本课程里它与 *koszula* 搭配。
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: 红色
    gloss: Sukienka jest czerwona.——*czerwona* 也与阴性名词相配，和 *niebieska* 一样。
    note: 这个形式在这里与 *sukienka* 搭配，就像 *niebieska* 与 *koszula* 搭配一样。
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: 这件衬衫是蓝色的
    gloss: 这件衬衫是蓝色的。
    note: 本单元之后马雷克买衬衫时还会用到这句话。
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: 这条连衣裙是红色的
    gloss: 这条连衣裙是红色的。
    note: 用同样的 jest 加颜色的结构来说另一件物品。
  pl.a1.unit20.lesson03.teach.recap_words:
    title: 你好、请、非常——再复习
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co——这些词你在前面的课里已经学过了。
    note: 在进入本课的商店对话之前，先快速复习一下。
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: 尺码
    gloss: 尺码
    note: 波兰的服装尺码通常也只用字母 S、M、L。
    example_gloss: 什么尺码？
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: 先生，想要
    gloss: Co pan chce kupić?——*pan* 是对男士的礼貌称呼，就像对女士用 *pani* 一样（*pani* 你在购物课里已经学过）。
    note: '*chce* 是 *chcieć* 的第三人称单数形式——你已经学过 *chcę*（我想）和 *chcesz*（你想）。'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: 先生，您想买什么？
    gloss: 先生，您想买什么？
    note: 售货员如何礼貌地向男顾客打招呼。
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: 售货员向 Marek 问好
    gloss: 您好！先生，您想买什么？
    note: Sprzedawca（售货员）用的是和前面购物单元里集市摊主一样的礼貌说法。
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek 说出他想买的东西
    gloss: 我想买一件衬衫和一条裤子。
    note: Marek 说出了他要买的两样东西。
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: 售货员询问尺码
    gloss: 什么尺码？
    note: 一个简短而自然的追问。
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek 说出自己的尺码
    gloss: M码。
    note: Marek 只回答尺码字母，这是很自然的说法。
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: 售货员确认有货并报价
    gloss: 我们有一件蓝色衬衫和一条裤子，一共一百兹罗提。
    note: '*Mamy* 的意思是“我们有”（和 *mam*、*masz* 同属一个动词）。在它后面，*koszula* 变成 *koszulę*，*niebieska* 变成 *niebieską*，变化方式和 *Chcę kupić koszulę* 中一样。这里的颜色与第2课的蓝色衬衫相呼应。'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek 接受
    gloss: 好的，我要了。
    note: Marek 确认购买，对话结束。
