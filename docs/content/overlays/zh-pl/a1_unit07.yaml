teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: 香蕉
    gloss: 香蕉
    note: 一种常见的水果，在集市或商店里可以按个卖，也可以按重量卖。
    example_gloss: 这是香蕉。
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: 西红柿、黄瓜
    gloss: 西红柿；黄瓜
    note: 两个词都是阳性非生命名词——本单元稍后按公斤买它们时，会用到它们的复数属格形式（pomidorów、ogórków）。
    example_gloss:
    - 这是西红柿。
    - 这是黄瓜。
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: 土豆、洋葱
    gloss: 土豆；洋葱
    note: Ziemniak 是阳性非生命名词（复数属格和 banan、pomidor 一样是 -ów）；cebula 是阴性名词。
    example_gloss:
    - 这是土豆。
    - 这是洋葱。
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: 便宜、贵
    gloss: 便宜；贵
    note: '*Tanio* 和 *drogo* 是副词，波兰语把它们直接和 *kosztować*（“值多少钱”）搭配——*To kosztuje drogo* 字面意思是“这个值得贵”，也就是“这个很贵”。汉语说“很贵”“很便宜”时用形容词，而波兰语在这里用副词。'
    example_gloss:
    - 很便宜！
    - 很贵！
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 价格：kosztuje，kosztują
    gloss: 值（多少钱）：kosztuje 用于一件东西，kosztują 用于多件东西——香蕉很便宜。（单数与复数）
    note: '*Kosztować* 是“值多少钱、价格为”的意思。一件东西用 *kosztuje*，多件东西用 *kosztują*——和 *jest*／*są*（“是”）的单复数对应一样，只是用于价格。摊主不管你怎么说都能听懂，但母语者实际会说 *banany kosztują*。'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: 香蕉多少钱？
    gloss: 香蕉多少钱？
    note: 开始讨价还价时最常用的问句——*Ile*（多少）加单数的 *kosztuje*，因为问的是一根香蕉。
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: 葡萄柚
    gloss: 葡萄柚
    note: 阳性非生命名词，和 pomidor、ziemniak 一样——在 proszę o 之后词尾不变。
    example_gloss: 这是葡萄柚。
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: 柑橘、橙子
    gloss: 柑橘；橙子
    note: 两个都是阴性名词，和前面饮食单元里的 kawa、herbata 一样——它们的宾格会把 -a 换成 -ę，不过本课只用到它们的词典形式。
    example_gloss:
    - 这是柑橘。
    - 这是橙子。
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: 一公斤、半公斤
    gloss: 一公斤；半公斤
    note: 无论称什么、要多少，*kilo* 自己的词尾都不会变——变化的是 *kilo* 后面的名词，本课的语法说明会讲到。
    example_gloss:
    - 请来一公斤西红柿。
    - 请来半公斤香蕉。
  pl.a1.unit07.lesson02.teach.poprosze:
    title: 我要（请给我）
    gloss: 我要／请给我
    note: '*Poproszę* 是比饮食单元的 *proszę o* 更地道、更日常的说法——两者大致都表示“我要”，波兰人可以随意切换。*Poproszę* 后面直接接想要的东西，不需要 *o*。'
    example_gloss: 请给我一个葡萄柚。
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 在 kilo 之后：-ów 词尾
    gloss: “kilo”之后的复数属格：香蕉 -> 香蕉的（bananów），西红柿 -> 西红柿的（pomidorów），土豆 -> 土豆的（ziemniaków）。
    note: 按重量表示数量时——*kilo*、*pół kilo*——后面的名词要变成另一种形式，即复数属格。这三个规则的阳性名词只需加 *-ów*：*banan* 变成 *bananów*，*pomidor* 变成 *pomidorów*，*ziemniak* 变成 *ziemniaków*。
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: 请来一公斤西红柿
    gloss: 请来一公斤西红柿。
    note: 把语法说明里的 -ów 规律用到真实的请求中——pomidor 在 kilo 之后变成 pomidorów。
  pl.a1.unit07.lesson03.teach.dla:
    title: 给、为
    gloss: 给、为
    note: 一个简单的介词，意思是“给、为”——摊主会用 *Co dla pani?*（字面意思是“给您什么？”）来礼貌地问顾客想要什么。
    example_gloss: 这是给你的。
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: 新鲜的、很
    gloss: 新鲜的；很
    note: 集市摊主经常用到的两个词——夸东西新鲜，或者说东西有多便宜、多贵。
    example_gloss:
    - 西红柿很新鲜。
    - 很便宜！
  pl.a1.unit07.lesson03.teach.trochę:
    title: 一点
    gloss: 一点／有点
    note: 让抱怨听起来更委婉——在友好的讨价还价中，说 trochę drogo（“有点贵”）比直接说一个 drogo 自然得多。
    example_gloss: 有点贵。
  pl.a1.unit07.lesson03.teach.razem:
    title: 一共／一起
    gloss: 一共／一起
    note: 摊主在报出你最终要付的金额之前说的话。
    example_gloss: 一共十兹罗提。
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: 您想要什么？
    gloss: 您想要什么？
    note: 字面意思是“您要什么”（敬称）——摊主招呼顾客时很自然的开场问句。
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: 摊主向埃娃问好
    gloss: 摊主打招呼，并问埃娃想要什么。
    note: Dzień dobry 在第1单元的问候语中学过。
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: 埃娃询问香蕉的价格
    gloss: 埃娃问香蕉多少钱。
    note: Kosztują 是本单元语法说明中的复数形式，因为这里问的是一堆香蕉。
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: 摊主报价
    gloss: 摊主说一公斤五兹罗提，而且非常新鲜。
    note: 这是自然的省略式报价：“[价格] kilo”就是波兰摊主说每公斤价格的方式，不需要再加表示“每”的词。
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: 埃娃点香蕉
    gloss: 埃娃说好的，并要一公斤香蕉。
    note: 把 poproszę 与 kilo + bananów 结合起来，正是第2课语法说明中的句型。
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: 摊主提到西红柿
    gloss: 摊主问她要不要西红柿，并说一公斤八兹罗提。
    note: 与第3句相同的省略式报价，这次用于另一种商品。
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: 埃娃委婉地嫌贵，然后下单
    gloss: 埃娃说有点贵，但她还是要半公斤。
    note: Trochę drogo 让抱怨的语气变得委婉——埃娃仍然买了，只是买得少一些。
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: 摊主报总价
    gloss: 摊主说给您，一共九兹罗提。
    note: 香蕉5兹罗提加上半公斤西红柿4兹罗提——一共九兹罗提，与这一场景中前面说的所有价格相符。
