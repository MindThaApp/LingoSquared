  pl.a1.unit23.lesson06.ewa_i_marek_placa:
    title: Ewa 和 Marek 结账
teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: 询问总价
    gloss: 总共多少钱?
    note: '*W sumie*（总共）说明你想知道的是合计的全部价格，而不是单件的价格。'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: 说出总价
    gloss: 总共一百兹罗提。
    note: '*Kosztuje* 是 *kosztować*（花费、价格为）的 *on/ona/ono* 形式。从 5 起的数词后面接复数二格：*sto złotych*。'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: 刷卡或用现金付款
    gloss: 刷卡支付,用现金支付
    note: '*Płacić kartą*（刷卡支付）和 *płacić gotówką*（用现金支付）在 *płacić* 后都用工具格：*kartą*、*gotówką*。'
    example_gloss:
    - 我可以在这里刷卡支付吗?
    - 我付现金。
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: 询问是否可以刷卡
    gloss: 我可以在这里刷卡支付吗?
    note: '*Tu*（这里）表示就在当前所在的地方；*czy* 引出是非疑问句，*mogę* 的意思是“我可以”。'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡?
    note: '*Czy chce pan ...?* 是 *Czy chcesz ...?* 的正式说法，这里由不认识的收银员使用（对男士用 *pan*，对女士用 *pani*）。'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: 账单
    gloss: 这份账单
    note: 阳性名词：*rachunek*（二格 *rachunku*）。
    example_gloss: 我们分摊账单好吗?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗?
    note: '*Może podzielimy ...?* 是礼貌地提议一起做某事的说法；*podzielimy* 是 *podzielić* 的 *my* 形式。'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: 请求分开付款
    gloss: 我可以分开付款吗?
    note: '*Osobno*（分开地）与 *zapłacić*（付款，完成体：一次完成的付款）搭配。'
  pl.a1.unit23.lesson04.teach.reszta:
    title: 找零
    gloss: 找零
    note: 阴性名词：*reszta*（二格 *reszty*，如 *nie potrzebuję reszty*）。
    example_gloss: 这是您的找零。
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*Pana* 是正式的“您的”（对男士；对女士用 *pani*），与柜台前的正式场合相称。'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*Nie potrzebuję* + 二格：否定句中宾语用二格，所以是 *reszty*。'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: 三十五
    gloss: 三十五
    note: '*Trzydzieści pięć* 写成两个词：先写十位，再写个位（30 + 5）。'
    example_gloss: 这个一百四十兹罗提。
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: 阅读餐厅账单
    gloss: 账单：两份主菜和两杯咖啡。合计：一百四十兹罗提。已刷卡支付。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      Rachunek: 账单
      dwa: 二
      dania: 主菜
      kawy: 咖啡
      Razem: 总额
      złotych: 兹罗提
      Zapłacono: 已支付
      kartą: 银行卡
      sto: 一百
      czterdzieści: 四十
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa 要账单
    gloss: Ewa：我们要不要结账？
    note: '*Poprosić o*（请求、要）后接四格：*o rachunek*。*Poprosimy* 是完成体将来时。'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek 询问总价
    gloss: Marek：好，好主意。一共多少钱？
    note: 重复使用第一课中的 *Ile to kosztuje w sumie?* 这个问句。
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa 说出总价
    gloss: Ewa：一百四十兹罗提。我们分着付吗？
    note: '*Podzielimy się?*（字面意思是“我们分一下吗？”）用反身代词 *się* 表示分摊账单。'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek 坚持要付账
    gloss: Marek：不用，今天我来付。你帮了我那么多。
    note: '*Dzisiaj ja płacę*（字面意思是“今天我付”）是表示要请客的标准说法；*pomogłaś* 是 *pomóc*（帮助）的阴性过去时，因为 Marek 是对 Ewa 说话。'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa 很感动
    gloss: 艾娃：你真贴心！谢谢。
    note: '*Miło z twojej strony*（你真贴心）是对慷慨举动的一种亲切而常用的称赞；*z* 后接属格：*z twojej strony*。'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: 马雷克询问能否刷卡
    gloss: 马雷克：我可以在这里刷卡吗？
    note: 沿用第2课的问句 *Czy mogę tu zapłacić kartą?*，这次是在真正的餐厅里使用。
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: Płaci：他/她的变位形式
    gloss: 马雷克付账。
    note: '*Płaci* 是 *płacić*（付款）的 *on/ona/ono*（他/她/它）形式。'
