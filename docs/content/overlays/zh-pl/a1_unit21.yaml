teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: 开心、伤心和生气
    gloss: 开心，伤心，生气
    note: 三个与 *jestem*（我是）连用的基本情绪词。它们是阳性形式；女性说 *szczęśliwa, smutna, zła*。
    example_gloss:
    - 我很开心。
    - 我很伤心。
    - 我很生气。
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: 表达你很开心
    gloss: 我很高兴。
    note: '*Jestem*（我是，来自 *być*）+ 形容词是基本句型。汉语表达心情常说“我很……”，而波兰语要用 jestem + 形容词。形容词要与说话人的性别一致：*szczęśliwy*（男性）、*szczęśliwa*（女性）。'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: 对比不同的感受
    gloss: 我没有生气，我很难过。
    note: '*Nie* 紧放在动词前面：*Nie jestem zły*。第二个分句再说出真正的感受。'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: 询问原因
    gloss: 你为什么高兴？
    note: '*Dlaczego*（为什么）是询问原因的标准疑问词。'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: 说明原因
    gloss: 我很高兴，因为我有了一套新公寓。
    note: '*Bo*（因为）引出原因；在 *mam*（我有）之后，名词用宾格：*nowe mieszkanie*。'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: 消极的原因
    gloss: 我很难过，因为在下雨。
    note: '*Pada deszcz*（下雨了，字面意思是“雨落下”）是常用的天气说法，这里用来说明原因。'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: 紧张
    gloss: 紧张
    note: 表示紧张的标准词。
    example_gloss: 我对第一次上班很紧张。
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: 说明你为什么紧张
    gloss: 我对第一次上班很紧张。
    note: '*Przed*（字面意思是“在……之前”）+ 工具格用来说明紧张的对象，相当于汉语的“对……紧张”：*przed pierwszą zmianą*。'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: 安慰别人
    gloss: 别担心。
    note: '*Nie martw się*（字面意思是“不要让自己担心”）是标准的安慰用语；*się* 是反身代词。'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: 询问别人的感受
    gloss: Marek 感觉怎么样？
    note: '*Czuć się*（感觉，反身动词）是询问或描述情绪状态的标准说法：*Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: 描述别人的感受
    gloss: 他觉得很紧张。
    note: '*Się* 要和动词放在一起：*on czuje się*。形容词用阳性形式，与 *on* 一致：*zdenerwowany*。'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: 询问别人为什么有某种感受
    gloss: 他为什么觉得紧张？
    note: 把 *dlaczego*（为什么）和 *On czuje się zdenerwowany* 中的 *czuje się* 句型结合在一起。
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: 阅读一条关于感受的消息
    gloss: 嗨，Ewa，我对第一次独自上班有点紧张。不过我也很开心，因为我有了新工作和新公寓。我想会顺利的。
    note: 注意写信的人对什么感到紧张、什么让他高兴，以及他总体的看法。
    glosses:
      trochę: 有点
      zdenerwowany: 紧张的
      pierwszą: 第一个
      zmianą: 班次
      samodzielną: 独自
      szczęśliwy: 高兴
      bo: 因为
      nową: 新的
      pracę: 工作
      nowe: 新的
      mieszkanie: 公寓
      myślę: 认为
      będzie: 会顺利
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa 问 Marek 感觉怎么样
    gloss: Ewa：嗨，Marek，你对第一次上班感觉怎么样？
    note: '*Przed pierwszą zmianą*（对第一次上班）沿用了第3课的 *przed* + 工具格句型。*Czujesz się* 是 *ty*（你）的形式。'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek 承认自己很紧张
    gloss: Marek：说实话，我有点紧张。
    note: '*Szczerze mówiąc*（说实话，字面意思是“坦率地说”）让承认的语气更委婉。'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa 安慰他
    gloss: Ewa：别担心，你会做得很好的！
    note: '*Dobrze sobie poradzisz*（字面意思是“你会应付得很好”）是鼓励人的固定表达；*poradzisz* 是 *poradzić sobie* 的 *ty*（你）将来时形式。'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek 向她道谢
    gloss: Marek：谢谢，这真的很有帮助。
    note: '*Pomaga* 是 *pomagać*（帮助）的 *on/ona/ono*（他/她/它）形式；*dzięki* 是随意的“谢谢”。'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa 预言结果
    gloss: Ewa：之后你一定会非常开心，也很自豪。
    note: '*Na pewno*（一定）表示有把握的预测；*dumny*（自豪的）是一个有用的新形容词。*Będziesz* 是 *być* 的将来时形式。'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek 表示同意
    gloss: Marek：是啊，我也这么想。
    note: '*Ja też tak myślę*（字面意思是“我也这样想”）是表示同意的自然说法；这里加上 *ja* 是为了对比强调。'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: 用 jest 和 mu 来概括
    gloss: 马雷克对第一次上班感到紧张。埃娃在帮他。
    note: '*Jest* 是 *być*（是）的 *on/ona* 形式；*mu* 的意思是“他”（与格，因为 *pomagać* 要求与格）。这些都是小词，但在谈论别人时必不可少。'
