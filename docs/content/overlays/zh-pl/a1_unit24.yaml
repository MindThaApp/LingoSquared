teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词：*czytać*（读书）、*uprawiać sport*（做运动）和 *gotować*（做饭）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Wolny czas*（空闲时间）是谈论爱好的关键短语。形容词 *wolny*（空闲的）与阳性名词 *czas* 保持一致；在 *w wolnym czasie* 中，两者都是位格。'
    example_gloss: 我空闲时喜欢阅读。
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Lubię*（我喜欢）后面接动词不定式：*lubię czytać*。*W wolnym czasie* 使用 *w* + 位格。'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三种爱好：*słuchać muzyki*（听音乐）、*rysować*（画画）和 *grać w gry*（玩游戏）。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Słuchać* 后面总是接属格：*słucham muzyki*，而不是 *muzyka*。'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Z przyjaciółmi*（和朋友们）使用 *z* + 复数工具格。'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个最基本的频率副词：*zawsze*、*często*、*czasami*、*nigdy*。它们不会变形，而且 *nigdy* 需要在动词前加 *nie*：*Nigdy nie gram.*
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Co tydzień* 和 *co weekend* 都表示“每……”；*co* 后接宾格，且自身不变形——见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + 宾格
    gloss: '*Co* + 宾格表示“每”：每周、每个周末、每个月。'
    note: 无论后面是什么名词，*co* 都是表示“每”的固定词。像 *tydzień*、*weekend*、*miesiąc* 这样的阳性非活物名词，主格和宾格形式相同。
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: 艾娃聊起爱好
    gloss: 艾娃：我们经常一起散步。那你在空闲时间还做什么呢，马雷克？
    note: '*Spacerujemy* 是 *spacerować* 的 *my*（我们）形式；*Marku* 是呼格，直接称呼某人时使用。'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: 马雷克的爱好
    gloss: 马雷克：我喜欢做饭，在家也做。我还经常运动。
    note: '*Także w domu*（在家也做）表明马雷克做饭不只是因为餐厅的工作，也是出于兴趣；*w domu* 是位格。'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: 艾娃很惊讶
    gloss: 艾娃：你在家也做饭？你上班不是已经做了一整天了吗！
    note: '*Cały dzień*（一整天）强调马雷克在工作中已经做了很多饭；*przecież* 带有“不是……吗”的语气。'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: 马雷克的解释
    gloss: 马雷克：是啊，但做饭让我放松。那你呢，你喜欢做什么？
    note: '*Gotowanie mnie odpręża* 字面意思是“做饭让我放松”：波兰语常把活动作主语，并把 *mnie*（我）用作宾格。'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: 艾娃的爱好
    gloss: 艾娃：我喜欢读书，也经常听音乐。
    note: 用 *i*（和）把第1课和第2课的两个爱好动词连成一句话。
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek 问起玩游戏
    gloss: Marek：你也玩游戏吗？
    note: 一个简短的是非问句，用了第2课的 *grać w gry*；*też* 的意思是“也”。
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa 的回答
    gloss: Ewa：不，我从来不玩游戏。不过我有时候画画！
    note: 第3课的 *nigdy*（从不）和 *czasami*（有时）在同一个回答中形成对比。注意双重否定：*nigdy nie gram*。
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: 比较爱好
    gloss: Marek 和我经常一起散步。不过我们还有别的爱好。Marek 喜欢做饭，在家也做，而且经常运动。我喜欢读书，也经常听音乐。我有时候画画，但从来不玩游戏。你空闲时间喜欢做什么？
    note: Ewa 的消息回顾了第4课的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      spacerujemy: 散步
      często: 经常
      razem: 一起
      inne: 其他的
      gotować: 做饭
      lubi: 喜欢
      domu: 在家
      uprawia: 锻炼
      czytać: 阅读
      słucham: 听
      muzyki: 音乐
      rysuję: 画画
      czasami: 有时
      gram: 玩电子游戏
      nigdy: 从不
      wolnym: 空闲的
      czasie: 时间
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek 问起周末
    gloss: Marek：这个周末你做什么？
    note: '*W ten weekend*（这个周末）表示时间，用 *w* 加四格。'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa 还没拿定主意
    gloss: Ewa：我还不知道。我喜欢读书，但也想出去走走。
    note: '*Wyjść na dwór*（到外面去）是表示想出门的常用说法；*chcę* 加动词不定式表示“我想……”。'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek 提出一个计划
    gloss: Marek：我们一起去散步好吗？之后我给我们做点吃的。
    note: '*Potem*（之后）是表示先后顺序的词；*ugotuję* 是完成体，因为做饭有了完成的结果。'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa 同意了
    gloss: Ewa：好主意！我既喜欢散步，也喜欢做饭。
    note: '*Lubię i ..., i ...*（“既……又……”）表示 Ewa 对两件事同样喜欢，没有偏好哪一个。'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek 确认约定
    gloss: Marek：太好了。那我们星期六见！
    note: 一句友好的结束语，确认星期六的安排；*w sobotę* 表示星期几，用 *w* 加四格。
