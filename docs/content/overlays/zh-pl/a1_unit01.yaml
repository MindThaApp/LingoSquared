answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: 波兰语 A1
  description: 学习用波兰语问候他人、询问近况、自我介绍并交流基本个人信息。课程重点讲解波兰语特有的 pan/pani/ty 敬称体系（波兰语在语法上区分正式与非正式的称呼）、动词词尾的一致变化，以及自然得体的语体选择。
units:
  pl.a1.unit01.greetings:
    title: 问候与初次见面
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: Pan、pani 和 ty：如何问“近况如何”
  pl.a1.unit01.lesson02.greetings_by_time:
    title: 一天中不同时段的问候与告别
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: 名字、姓氏和来自哪里
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: 对男士的正式称呼
    gloss: 先生（对男士的正式称呼）
    note: 汉语的“您”和“你”区分敬称与普通称呼，波兰语同样需要选择：*pan* 用来称呼不熟悉的或需要尊敬的男士。但在语法上，*pan* 相当于第三人称主语——“pan jest”字面意思是“这位先生是”，并不是真正的第二人称形式，尽管它表示的是“您”。
  pl.a1.unit01.lesson01.teach.pani:
    title: 对女士的正式称呼
    gloss: 女士（对女士的正式称呼）
    note: '*pan* 的阴性对应词。称呼不熟悉的或需要尊敬的女士时用 *pani*。无论婚否，成年女士日常都称 *pani*，波兰语在日常称呼中不区分“小姐”和“夫人”。'
  pl.a1.unit01.lesson01.teach.ty:
    title: 非正式的“你”
    gloss: 你（非正式，单数）
    note: 对朋友、同辈、家人、孩子，以及其他关系随意的人，用 *ty*。与 *pan*／*pani* 不同，*ty* 搭配真正的第二人称动词词尾，例如 *masz*（“你有”），而不是第三人称形式。
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: 对男士的正式问候近况
    gloss: 您好吗？（对男士，正式）
    note: 字面意思是“这位先生过得怎么样”。*Ma* 是动词的第三人称形式（与作为语法主语的 *pan* 一致），和 *on*（“他”）所用的词尾相同。
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: 对女士的正式问候近况
    gloss: 您好吗？（对女士，正式）
    note: 句型与 *Jak się pan ma?* 相同，只是把 *pan* 换成 *pani*。动词形式 *ma* 不变——无论对方性别如何，都是同一个第三人称词尾。
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: 非正式的问候语：近况
    gloss: 你好吗？（非正式）
    note: 与 *ty* 搭配时，动词用真正的第二人称词尾 *masz*，而不是 *ma*。对比正式的 *Jak się pan/pani ma?* 和非正式的 *Jak się masz?*——这是从动词本身听出 pan/pani 与 ty 区别的最有用的一组对比。
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: 标准回答
    gloss: 很好，谢谢。
    note: '*Dziękuję*（“谢谢”）不随语体变化——无论回答 *pan*、*pani* 还是 *ty*，用的都是同一个词。只有问句本身体现正式程度。'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: 把正式的问题回问对方
    gloss: 您呢？（对男士，正式）
    note: 这是向正式称呼的男士回问的简短说法。回问女士时，把 *pan* 换成 *pani*（“A pani?”）。
  pl.a1.unit01.lesson01.teach.a_ty:
    title: 把非正式的问题回问对方
    gloss: 你呢？
    note: 向朋友或同辈回问时用 *ty*。
  pl.a1.unit01.lesson02.teach.czesc:
    title: 非正式的你好与再见
    gloss: 你好；再见（非正式，两种场合都可用）
    note: '*Cześć* 在波兰语问候语中很特别：在同一种非正式语体里，它既可以表示“你好”，也可以表示“再见”，类似汉语里的“嗨”既可打招呼也可道别。它只用于使用 *ty* 的关系，绝不用于 *pan*／*pani*。'
    example_gloss: 嗨，你好吗？
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: 全天通用的问候
    gloss: 早上好；你好
    note: '*Dzień dobry* 在傍晚之前任何时间都可以用，而且与 *cześć* 不同，它在语体上是中性的——对 *pan*、*pani* 或 *ty* 都适用。对不太熟的人，这是最稳妥的默认问候。'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: 晚上的问候
    gloss: 晚上好
    note: 到了晚上，用它代替 *dzień dobry*。语体同样中性。
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: 晚上的告别
    gloss: 晚安
    note: 与 *dzień dobry*／*dobry wieczór* 不同，*dobranoc* 是告别语，不是问候语——在有人要离开过夜或上床睡觉时说，绝不用来开启对话。
    example_gloss: 晚安，彼得！
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: 标准告别
    gloss: 再见
    note: 中性、不会出错的告别方式——对 *pan*、*pani* 或 *ty* 都适用。比 *do zobaczenia* 听起来更有“不再见面”的意味。
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: “回头见”式告别
    gloss: 回头见
    note: 字面意思是“直到（我们）再见面”。暗示你预期还会再见，不同于较中性的 *do widzenia*。
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: 礼貌的祝福语
    gloss: 祝你有愉快的一天！
    note: '*Miłego dnia* 在祝愿中使用二格，与 *smacznego*（“祝您好胃口”）的模式相同——这是固定结构，现阶段最好整句记住，而不必逐个分析格的变化。'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: 正式地询问姓名
    gloss: 请问您叫什么名字？（对男士，正式）
    note: 字面意思是“这位先生怎样称呼自己”——*nazywać się* 是反身动词，意为“被称为、名叫”。正式称呼女士时，把 *pan* 换成 *pani*。
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: 非正式地询问名字
    gloss: 你叫什么名字？
    note: 这里用的是另一个惯用表达 *mieć na imię*（“名字是……”），专门询问名字，而不是全名或姓氏——这是向同辈询问名字的自然非正式说法。
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: 说出全名
    gloss: 我叫安娜·科瓦尔斯卡。
    note: 这是 *nazywać się* 的第一人称形式，后面自然接名字和姓氏——是更正式、更完整的自我介绍方式。
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: 说出名字
    gloss: 我叫安娜。
    note: 这是 *mieć na imię* 的第一人称形式，后面自然只接名字——是 *Nazywam się...* 的随意说法。
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: 认识某人时表达愉快
    gloss: 很高兴认识你。
    note: 初次见面时广泛使用的固定表达，正式和非正式场合都适用。
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: 非正式地询问来自哪里
    gloss: 您是哪里人？
    note: '*Skąd* 的意思是“从哪里”。这里展示的是使用 *ty* 的非正式形式；正式形式 *Skąd pan/pani jest?* 会出现在本课最后的对话中。'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: 说明你来自哪里
    gloss: 我来自加拿大。
    note: '*Z*（“来自”）后接二格，所以 *Kanada* 变成 *Kanady*。大多数国名在 *z* 之后都遵循这一规律。'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: 说明你住在哪里
    gloss: 我住在华沙。
    note: 这里 *w*（“在”）后接六格，所以 *Warszawa* 变成 *Warszawie*。来源地（用 *z*）和现居地（用 *w*）在地名上用不同的格——要把它当作规律来留意，而不是当作例外去死记。
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: 开启对话
    gloss: 艾娃向马雷克问好，并正式地询问他的名字。
    note: 艾娃对刚认识的人使用正式的 *pan* 语体，这是初次见面、工作场合或面对陌生人时稳妥的默认选择。
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: 开启对话，回答
    gloss: 马雷克说出全名，并说很高兴认识她。
    note: 用 *Nazywam się* 加全名，是回答正式问名字的自然而完整的方式。
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: 询问来自哪里
    gloss: 艾娃作出回应，并正式地询问马雷克来自哪里。
    note: '*Skąd pan jest?*——即本课 *Skąd jesteś?* 的正式形式——使用 *jest*，与之前见过的 *pan jest*／*pan ma* 是同样的第三人称动词形式。'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: 询问来自哪里，回答
    gloss: 马雷克说他来自加拿大，但住在华沙。
    note: '*Ale*（“但是”）连接马雷克的出生地与现居地之间的对比——这正是 *jestem z*／*mieszkam w* 所体现的区别。'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: 询问语言能力
    gloss: 艾娃正式地问马雷克会不会说波兰语。
    note: '*Czy* 引出是非问句——与汉语用“吗”结尾不同，波兰语把 *czy* 放在句首，提示后面是一个问句。'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: 询问语言能力、回答并结束对话
    gloss: 马雷克说他会说一点，还在学习，然后道别。
    note: '*Jeszcze się uczę*（“我还在学”）是描述持续努力的自然而谦逊的说法——对真正的学习者来说，用来说自己也很实用。'
