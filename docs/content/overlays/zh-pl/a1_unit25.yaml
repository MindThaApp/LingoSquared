teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Wysoki* 形容个子高的人，*niski* 形容个子矮的人。女性用 *wysoka* 或 *niska*。'
    example_gloss:
    - Kasia 个子高。
    - Tomek 个子矮。
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: 这里的 *stary* 和 *młody* 表示大致的印象，而不是确切的岁数。
    example_gloss:
    - 爷爷年纪大了。
    - Marek 很年轻。
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: Stary：印象还是年龄
    gloss: '*Stary* 表示大致的印象，如 *Dziadek jest stary*（爷爷年纪大了）。要说确切的年龄，波兰语用另一种结构：*Ile masz lat?*'
    note: 说一个人看起来老还是年轻，用 *stary* 或 *młody*；问确切的年龄则说 *Ile masz lat?*，回答用 *mam ... lat*（我……岁）。
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia 个子高，Tomek 个子矮
    gloss: Kasia 个子高，而 Tomek 个子矮。
    note: 用 *a*（表示对比的“而”）连接的简单复合句。*Wysoka* 和 *niski* 分别与阴性和阳性主语保持一致，为第 5 课的比较做准备。
  pl.a1.unit25.lesson02.teach.wlosy:
    title: 头发
    gloss: 头发
    note: '*Włosy* 在波兰语中总是复数：*długie włosy*（长发）。'
    example_gloss: Marek 留着黑色短发。
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色。*Blond* 不变化；*brązowe* 和 *siwe* 是与 *włosy* 搭配的复数形式。
    example_gloss:
    - Ewa 是金发。
    - Tomek 是棕色头发。
    - 爷爷头发灰白。
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Długie*（长的）和 *krótkie*（短的）是与 *włosy* 搭配的复数形式。'
    example_gloss:
    - Kasia 留着长发。
    - Tomek 留着短发。
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy 搭配复数形容词
    gloss: '*Włosy* 是复数，所以形容词也用复数：长发、短发、棕色头发、黑发。'
    note: 非阳性人称的复数名词，其形容词以 *-e* 结尾：*długie włosy*。*Blond* 是例外：它从不变化（*blond włosy*）。
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: Włosy：永远是复数
    gloss: '*Włosy*（头发）总是复数：*jej włosy są długie*（她的头发很长）。汉语的“头发”没有复数形式，而波兰语必须用复数。*Jej* 的意思是“她的”。'
    note: 波兰语中“头发”是复数名词，所以动词和形容词也要用复数。*Jej*（“她的”）不会变化，不管属于她的东西有多少。
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek 留着黑色短发
    gloss: Marek 留着黑色短发。
    note: '*Czarne*（黑色的）是与 *włosy* 搭配的复数形式。'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa 留着金色长发
    gloss: Ewa 留着金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  pl.a1.unit25.lesson03.teach.oczy:
    title: 眼睛
    gloss: 眼睛
    note: '*Oczy* 是 *oko* 的复数；波兰语通常用复数来说双眼。'
    example_gloss: Marek 有一双棕色的眼睛。
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: 三种眼睛的颜色，用复数形式与 *oczy* 搭配：*niebieskie*、*brązowe*、*zielone*。
    example_gloss:
    - Ewa 有一双蓝眼睛。
    - Tomek 有一双棕色眼睛。
    - Kasia 有一双绿眼睛。
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy 搭配 -e
    gloss: '*Oczy* 是复数，所以形容词以 *-e* 结尾：蓝眼睛、棕色眼睛、绿眼睛。'
    note: 与第 2 课 *włosy* 的复数词尾相同：*niebieskie oczy*、*brązowe oczy*、*zielone oczy*。
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Ewa 长什么样？
    gloss: Ewa 长什么样？
    note: '*Jak wygląda ...?* 是本单元的核心问句；可以用它询问任何人的外貌。'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa 留着金色长发，有一双蓝眼睛
    gloss: Ewa 留着金色长发，有一双蓝眼睛。
    note: 示范回答：用 *i*（和）把头发和眼睛合在一句话里。
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa 介绍 Nina
    gloss: Ewa：语言咖啡馆来了一个新女孩。她叫 Nina。
    note: '*Przychodzi*（来了）用来引入场景中的新人物；*do kawiarni językowej* 使用 *do* + 属格。'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek 问她长什么样
    gloss: Marek：好的！她长什么样？
    note: 再次使用本单元的核心问句，这次用 *ona*（她）代替名字。
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa 描述 Nina 的身高和头发
    gloss: Ewa：她个子矮，留着金色短发。
    note: 结合了第 1 课的 *niska*（*niski* 的阴性形式）和第 2 课的头发词汇。
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek 问她的眼睛
    gloss: Marek：那她的眼睛呢？
    note: 这里的 *jej* 是物主词“她的”，所以 *jej oczy* 是“她的眼睛”；*jej* 不会变化。
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa 描述 Nina 的眼睛
    gloss: Ewa：她有一双绿眼睛。
    note: 再次使用第 3 课的 *zielone oczy*。
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek 会认出她
    gloss: Marek：谢谢！这样我就能认出她了。
    note: '*Rozpoznam* 是完成体将来时（“我会认出”）；*ją* 是 *ona*（她）的宾格。'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: 比较 Tomek 和 Kasia
    gloss: Tomek 和 Kasia 是兄妹，但他们长得不一样。Tomek 个子矮，留着棕色短发，有一双棕色的眼睛。Kasia 比 Tomek 高，留着棕色长发，有一双绿眼睛。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      brat: 兄弟
      siostra: 姐妹
      wyglądają: 看起来
      inaczej: 不同的
      niski: 矮的
      krótkie: 矮的
      brązowe: 棕色的
      włosy: 头发
      oczy: 眼睛
      wyższa: 更高的
      długie: 长的
      zielone: 绿色的
      wyglądasz: 你看起来（非正式），用于说外貌
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: 再次使用比较级
    gloss: 比较级：*wysoki*（高）变成 *wyższy*（更高），被比较的另一方放在 *niż*（比）之后：Kasia 比 Tomek 高。
    note: 波兰语通过改变形容词的词尾来构成比较级，并且仍与性保持一致：Kasia 是阴性，所以用 *wyższa*。
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia 的头发比 Tomek 的长
    gloss: Kasia 的头发比 Tomek 的长。
    note: '*Dłuższe*（更长的）是与 *włosy* 搭配的复数形式，*niż*（比）引出比较的对象。'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 使用 *Mam ...* 的第一人称示范句，描述自己的外貌时可以直接套用。
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek 发现了 Nina
    gloss: Marek：看，那是 Nina 吗？她留着金色短发，有一双绿眼睛。
    note: '*Patrz*（看）是 *patrzeć* 的命令式。*Czy to Nina?* 的意思是“那是 Nina 吗？”'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa 确认
    gloss: Ewa：对，是 Nina！
    note: 这是一个简短自然的肯定回答。
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina 向 Marek 打招呼
    gloss: Nina：你好，你是 Marek 吗？
    note: 一个简单的非正式问候问句。*być* 之后，名字用工具格：*jesteś Markiem?*
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek 回应 Nina 的问候
    gloss: Marek：是的！很高兴认识你，Nina。
    note: '*Miło cię poznać* 是初次见面的标准用语（“很高兴认识你”；*poznać* 意为“认识”）。称呼 Nina 时用呼格：*Nino*。'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话到此结束——Marek 根据 Ewa 之前的描述成功认出了 Nina。
