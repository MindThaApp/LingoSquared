teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*Zadzwonię* 是 *zadzwonić*（打一次电话）的完成体将来时。波兰语用它来表示承诺，相当于汉语的“我会给你打电话”。'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: 接电话
    gloss: 你好，我是埃娃。
    note: '*Tu* + 名字（字面意思是“这里是……”）是打电话时自报身份的标准说法，类似汉语的“我是……”。'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: 马雷克也这样回答
    gloss: 你好，我是马雷克。
    note: 与 *Halo, tu Ewa* 相同的 *tu* + 名字结构。
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: '*Z kim rozmawiam?*（字面意思是“我在和谁说话？”）是对不认识的来电者的标准问法；*kim* 是 *z* 之后的工具格。'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: 礼貌地表明身份
    gloss: 您正在和埃娃通话。
    note: '*Rozmawia pan z Ewą* 是正式说法：用 *pan*（对男士）或 *pani*（对女士）加第三人称动词，以及 *z* + 工具格。'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*Możesz*（你能，来自 *móc*）+ 不定式 *powtórzyć*（重复）+ *to*（那个）。'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*Nie mów* 是否定命令式（不要说）；*tak szybko* 的意思是“这么快”。'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: '*Nie słyszę cię dobrze* 表示听不清；*cię* 是 *ty* 的宾格，*dobrze* 的意思是“好”。'
  pl.a1.unit22.lesson04.teach.sms:
    title: 短信
    gloss: 短信
    note: '*SMS* 是阳性名词：*ten SMS*。波兰语名词有性，这一点与汉语不同。'
    example_gloss: 这条短信是埃娃发来的。
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: '*Wysłać*（发送）的接收者用与格 *ci*（给你），发送的东西用宾格：*Wyślę ci SMS*。'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*Oddzwonić*（回电话）在波兰语中是一个单独的动词：*oddzwonię później*。'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: 阅读短信对话
    gloss: 马雷克：嗨，埃娃，你能给我打个电话吗？我有事要告诉你。埃娃：好的，当然，我五分钟后给你回电话。
    note: 注意马雷克请求什么、为什么，以及埃娃说什么时候回电话。
    glosses:
      Cześć: 你好
      możesz: 能够;可以
      zadzwonić: 打电话;称呼
      Muszę: 必须;得
      coś: 某事物
      powiedzieć: 讲述;告诉
      oczywiście: 当然
      oddzwonię: 打电话;称呼
      pięć: 五
      minut: 分钟
      za: 回;返回
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: 马雷克接电话
    gloss: 马雷克：你好，我是马雷克。
    note: 与第1课相同的 *tu* + 名字结构，这次用在真正的通话中：接电话的人先开口并报上名字。
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: 埃娃自报身份
    gloss: 埃娃：嗨，马雷克，我是埃娃。马雷克：太好了，你打来了！
    note: '*Fajnie, że* ...（真好，……）表示对某件事的积极反应；*że* 引出从句。'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: 埃娃问起上班的情况
    gloss: 埃娃：你的第一次上班怎么样？
    note: '*Jak ci poszła ...?*（字面意思是“……对你来说进行得怎么样？”）用来询问已经发生的事。*Ci* 是 *ty* 的与格，*poszła* 与阴性名词 *zmiana* 一致。'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: 马雷克报告好消息
    gloss: 马雷克：非常顺利，比我想的还要好。
    note: '*Poszło* 是 *iść* 的过去时，词尾 *-o* 表示“它”（这里是“进展”的意思）；*myślałem* 是 *myśleć*（想）的过去时，用的是男性说话者的词尾。'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 过去时：było、poszło、myślałem
    gloss: 过去时：*było*（曾是）来自 *być*（是），*poszło*（去了、进行了）来自 *iść*（去），*myślałem*（我想过）来自 *myśleć*（想）。
    note: 波兰语过去时由 *-ł-* 加上表示性别的词尾构成：*myślał*（他）、*myślała*（她）、*było*（中性）。目前请把 *było*、*poszło* 和 *myślałem* 当作固定形式，只在本课出现的语境中使用。
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa 很自豪
    gloss: Ewa：听到这个真高兴！我为你感到骄傲。
    note: '*Dumny z*（为……感到骄傲）是固定搭配：*z* + 二格，所以说 *z ciebie*。Ewa 是女性，所以她说 *dumna*。'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek 很感动
    gloss: Marek：非常谢谢你，这对我意义重大。
    note: '*Znaczy* 是 *znaczyć*（意味着）的 *on/ona/ono* 形式；*dla mnie*（对我来说）表示对谁来说重要。'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: '*Jego*（他的）形式不变，放在名词前：*jego pierwsza zmiana*；阴性名词不会影响它。'
