teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: 疼
    gloss: Boleć（疼），现在时：boli（他／她／它）和 bolą（他们）。Głowa mnie boli 的意思是“我头疼”——字面意思是“头让我疼”。
    note: 表达身体疼痛时，*boleć* 的现在时只用这两种形式——身体部位是主语，*mnie* 表示是谁的，所以这里没有“我疼”这样的人称形式要学。
  pl.a1.unit16.lesson01.teach.glowa:
    title: 头
    gloss: 头
    note: 最常说的疼痛部位。
    example_gloss: 我头疼。
  pl.a1.unit16.lesson01.teach.gardlo:
    title: 喉咙
    gloss: 喉咙
    note: 可用来描述感冒或喉咙痛。
    example_gloss: 我喉咙痛。
  pl.a1.unit16.lesson01.teach.brzuch:
    title: 肚子
    gloss: 肚子
    note: 吃得太多或吃坏东西时很有用。
    example_gloss: 我肚子痛。
  pl.a1.unit16.lesson01.teach.zeby:
    title: 牙齿
    gloss: 牙齿
    note: 这里总是用复数，波兰人也是这样说的——所以搭配的是 *bolą*（而不是 *boli*）。
    example_gloss: 我牙疼。
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: 你哪里疼？
    gloss: 你哪里疼？
    note: 询问身体不舒服的人时很自然的问法。
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: 你感觉怎么样?
    gloss: Czuć się（感觉）：czuję się（我）、czujesz się（你）。你感觉怎么样？
    note: 目前只学两种形式——说自己用 *czuję*，问别人用 *czujesz*。
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: 好与不好
    gloss: 我感觉很好。我感觉不好。——dobrze 你已经学过，źle 是它的反义词。
    note: 从第一课起你就在用 *dobrze*，现在学它的反义词。
  pl.a1.unit16.lesson02.teach.zle:
    title: 不好
    gloss: 不好
    note: 想说自己不舒服时需要的词。
    example_gloss: 我感觉不好。
  pl.a1.unit16.lesson02.teach.goraczka:
    title: 发烧
    gloss: 发烧
    note: 一个常见、基本的症状。
    example_gloss: 我发烧了。
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa，ma——再复习一下
    gloss: Ewa, ma——这个名字和动词 mieć（有）的这个形式，你在之前的课里已经学过（Mam、masz、ma）。
    note: 本课会用到这两者，先快速复习一下。
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: 生病
    gloss: 生病的（男性）／生病的（女性）
    note: 和你学过的 *młodszy/starsza* 一样的 -y/-a 规律——男性用 *chory*，女性用 *chora*。
    example_gloss:
    - 他生病了。
    - 她生病了。
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa 觉得不舒服
    gloss: 我觉得不舒服。我发烧了。
    note: Ewa 在说自己的症状——本单元的对话里她还会再说一遍。
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: 又见 Marek
    gloss: Marek——这个名字你在之前的课程中已经学过。
    note: 进入本课对话之前的简单复习。
  pl.a1.unit16.lesson03.teach.i_recap:
    title: 又见“和”
    gloss: I——这个词你在之前的课程中已经学过。
    note: 进入本课对话之前的简单复习。
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: 又见“请”和“水”
    gloss: Proszę 和 wodę——这两个词你在之前的课程中都已经学过。
    note: 进入本课对话之前的简单复习。
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: 又见“谢谢”
    gloss: Dziękuję——这个词你在之前的课程中已经学过。
    note: 进入本课对话之前的简单复习。
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: 休息
    gloss: 休息
    note: 与 *Proszę* 连用，就像你已经学过的请别人直走或转弯那样——*Proszę* + 动词不定式，不需要用命令式。
    example_gloss: 请休息。
  pl.a1.unit16.lesson03.teach.pic:
    title: 喝
    gloss: 喝
    note: 这是另一个同样跟在 *Proszę* 后面的动词不定式。
    example_gloss: 请喝水。
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek 问 Ewa 感觉怎么样
    gloss: Ewa，你感觉怎么样？
    note: Marek 发现她不对劲，直接问她。
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa 描述自己的症状
    gloss: 我觉得不舒服。我喉咙痛，还发烧。
    note: Ewa 清楚地说出两个症状——和她在本单元前面说过的情况一样。
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek 给出简单的建议
    gloss: 请休息，多喝水。
    note: 这是简单的建议，不是诊断，也不是医嘱，只是常识。
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa 感谢 Marek
    gloss: 好的，谢谢你，Marek。
    note: 一个简单、熟悉的对话结尾。
