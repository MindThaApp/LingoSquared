teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: 面包
    gloss: 面包
    note: 最基本的主食词汇，每顿饭都会用到。
    example_gloss: 这是面包。
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: 黄油，奶酪
    gloss: 黄油；奶酪
    note: 前者是中性名词，后者是阳性非生命名词——按本课语法说明，它们在 proszę o 之后词尾都不变。
    example_gloss:
    - 这是黄油。
    - 这是奶酪。
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: 水，牛奶
    gloss: 水；牛奶
    note: Woda 是阴性名词（它的宾格形式 wodę 出现在本课的语法说明中）；mleko 是中性名词，词形不变。
    example_gloss:
    - 这是水。
    - 这是牛奶。
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: 咖啡，茶
    gloss: 咖啡；茶
    note: 两者都是阴性名词——点餐时实际要说的是宾格形式 kawę／herbatę，本课语法说明中有讲解。
    example_gloss:
    - 这是咖啡。
    - 这是茶。
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 点餐：proszę o + 宾格
    gloss: 请给我＋宾格：咖啡 -> kawę，茶 -> herbatę，水 -> wodę。面包、奶酪和牛奶不变。
    note: '*Proszę o*（“请给我”，字面意思是“我请求”）后面要接宾格。像 *kawa*、*herbata*、*woda* 这样的阴性名词，把词尾的 *-a* 换成 *-ę*。像 *chleb*、*ser* 这样的阳性非生命名词，以及像 *mleko* 这样的中性名词，则保持词典中的原形。'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: 请给我一杯咖啡
    gloss: 请给我一杯咖啡。
    note: 点单个东西时日常而礼貌的说法——把语法说明中的句型用在完整的请求里。
  pl.a1.unit06.lesson02.teach.zupa:
    title: 汤
    gloss: 汤
    note: 午餐或晚餐常见的一道菜，也常常是当日特色菜，就像本单元的餐厅场景那样。
    example_gloss: 这是汤。
  pl.a1.unit06.lesson02.teach.sok:
    title: 果汁
    gloss: 果汁
    note: 和 chleb、ser 一样是阳性非生命名词——点餐时词尾不变。
    example_gloss: 这是果汁。
  pl.a1.unit06.lesson02.teach.cukier:
    title: 糖
    gloss: 糖
    note: 喝咖啡或茶时用得上——同样是阳性非生命名词，词尾不变。
    example_gloss: 这是糖。
  pl.a1.unit06.lesson02.teach.rachunek:
    title: 账单
    gloss: 账单
    note: 用餐结束时要用到的词——proszę o rachunek 是礼貌而标准的买单说法。
    example_gloss: 请买单。
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 喜欢：lubię，lubi
    gloss: 喜欢：我喜欢，他／她喜欢——我喜欢咖啡。他喜欢汤。
    note: '*Lubić* 是动词“喜欢”。这里只学第一人称（*lubię*）和第三人称（*lubi*）形式。*Lubić* 同样要接宾格，与 *proszę o* 的规律相同——说 *lubię kawę*，而不是 *lubię kawa*。'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: 我喜欢汤
    gloss: 我喜欢汤。
    note: Zupa 在宾格中变成 zupę，和第一课语法说明中阴性词尾 -a 变 -ę 的规律一样。
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: 今日特色菜
    gloss: 今日特色菜是汤。
    note: '*Dnia* 是 *dzień*（日、天）的属格——*danie dnia* 字面意思是“当天的菜”，是菜单上的固定说法。'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 推荐：polecam，poleca
    gloss: 推荐：我推荐，他／她推荐——我推荐咖啡。他推荐汤。
    note: '*Polecać* 是动词“推荐”——服务员用它来推荐菜品，顾客也可以用同一个动词请对方推荐。它同样接宾格，与 *proszę o* 和 *lubić* 的规律相同。'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: 您推荐什么？
    gloss: 您推荐什么？
    note: '*Co*（什么）加上正式称呼 *pan*——这是向服务员提问的自然说法，用的是第一单元中的同一种正式称呼。'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: 给您／不客气
    gloss: 给您。
    note: 灵活的日常用语——上菜时可以说，回答 dziękuję（谢谢）时同样自然。
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: 马上就来
    gloss: 马上就来。
    note: 字面意思是“我已经在上了”——服务员确认已听到点单的标准回答。
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: 服务员介绍特色菜
    gloss: 服务员问好，并介绍今天的特色菜是汤。
    note: Dzień dobry 沿用第一单元的问候语。
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa 请服务员推荐
    gloss: Ewa 问服务员他推荐什么。
    note: 礼貌的正式问句——pan 是对服务员的尊称。
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: 服务员推荐咖啡
    gloss: 服务员推荐咖啡。
    note: Polecam——本课语法说明中的第一人称形式。
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa 点餐
    gloss: Ewa 说好的，点了咖啡和汤。
    note: 把 proszę o 与家庭单元中的连词 i（和）结合起来，同时复习了第一课的点餐句型和第二课的汤的词汇。
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: 服务员确认点单
    gloss: 服务员说马上就来。
    note: 食物送上之前简短而自然的确认。
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa 要账单
    gloss: Ewa 道谢并要求买单。
    note: 复用第一单元的 dziękuję 以及第二课的 proszę o + rachunek。
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: 服务员递上账单
    gloss: 服务员说：给您。
    note: 本课前面学过的同一句 proszę bardzo，这里用在递账单的场合。
