teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: 星期一
    gloss: 星期一
    note: 波兰语中一周的第一天，相当于汉语的“星期一”。
    example_gloss: 今天是星期一。
  pl.a1.unit03.lesson01.teach.wtorek:
    title: 星期二
    gloss: 星期二
    note: 注意这个词：说“在星期二”时，*wtorek* 前面用介词 *we*，而不是 *w*。本课稍后会详细讲解。
    example_gloss: 今天是星期二。
  pl.a1.unit03.lesson01.teach.sroda:
    title: 星期三
    gloss: 星期三
    note: 这是一个阴性名词，与其他大多数表示星期的词不同。
    example_gloss: 今天是星期三。
  pl.a1.unit03.lesson01.teach.czwartek:
    title: 星期四
    gloss: 星期四
    note: 与 *poniedziałek*、*wtorek* 和 *piątek* 属于同一种阳性名词类型。
    example_gloss: 今天是星期四。
  pl.a1.unit03.lesson01.teach.piatek:
    title: 星期五
    gloss: 星期五
    note: 本单元后面还会再见到这一天——这是埃娃和马雷克计划再次见面的日子。
    example_gloss: 今天是星期五。
  pl.a1.unit03.lesson01.teach.sobota:
    title: 星期六
    gloss: 星期六
    note: 周末的一部分；*weekend* 是借来的外来词，很多波兰人也这么说。
    example_gloss: 今天是星期六。
  pl.a1.unit03.lesson01.teach.niedziela:
    title: 星期日
    gloss: 星期日
    note: 本课所学一周七天中的最后一天。
    example_gloss: 今天是星期日。
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: 询问星期几
    gloss: 今天星期几？
    note: 一种直接的问句形式——*dzień tygodnia* 字面意思是“一周中的一天”。
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: w 与 we 的例外
    gloss: 星期一、星期四、星期五用 w——但星期二用 we（为了更容易发音）。
    note: 大多数表示星期的词遵循“*w* + 星期名”的结构，表示“在星期几”。*Wtorek* 是唯一真正的例外：波兰人说 *we wtorek*，而不是 *w wtorek*，纯粹因为这样更好发音——这是真正的不规则现象，不是拼写错误。
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: 星期五我去看电影
    gloss: 星期五我去看电影。
    note: '*Piątek* 在 *w* 后面不变化——只有 *środa*、*sobota* 和 *niedziela* 会变（为了让 A1 阶段简单一些，本课不讲）。'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: 一月、二月、三月
    gloss: 一月；二月；三月
    note: '*Luty* 在语法上比较特殊——它的变化方式像形容词，而不像普通名词（本单元后面会看到它表示“在二月”的形式）。'
    example_gloss:
    - 我的生日在一月。
    - 我二月去华沙。
    - 我的生日在三月。
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: 四月、五月、六月
    gloss: 四月；五月；六月
    note: 本单元的故事里，两个日期用的都是 *Maj*。
    example_gloss:
    - 我四月去华沙。
    - 我的生日在五月。
    - 我六月去华沙。
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: 七月、八月、九月
    gloss: 七月；八月；九月
    note: 这里还有一个真正的不规则现象：“在九月”是 *we wrześniu*，而不是 *w wrześniu*——和你已经见过的 *wtorek* 一样，换成更好发音的 *we*。
    example_gloss:
    - 我七月休假。
    - 我八月去华沙。
    - 我的生日在九月。
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: 十月、十一月、十二月
    gloss: 十月；十一月；十二月
    note: 一年的最后三个月，至此十二个月全部学完。
    example_gloss:
    - 我十月去华沙。
    - 我的生日在十一月。
    - 我十二月休假。
  pl.a1.unit03.lesson02.teach.urodziny:
    title: 生日
    gloss: 生日
    note: '*Urodziny* 在波兰语中总是复数，即使指的是一个人的一次生日——它搭配复数形式 *są*，而不是 *jest*。本课稍后会专门练习这一点。'
    example_gloss: 我的生日在五月。
  pl.a1.unit03.lesson02.teach.kiedy:
    title: 什么时候
    gloss: 什么时候
    note: 用来询问任何时间点的疑问词。
    example_gloss: 会议是什么时候？
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: 询问某人的生日
    gloss: 你的生日是什么时候？
    note: 用 *są* 而不是 *jest*，与复数的 *urodziny* 保持一致——这就是 *urodziny* 卡片上提示过的规则。
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: 说出生日日期
    gloss: 我的生日是5月10日。
    note: '*Dziesiątego maja*——表示日的词以 *-ego* 结尾，表示月的词以 *-a* 结尾，完全不用介词。这是波兰语表达具体日期的标准方式；完整规则见本课稍后的语法说明。'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: 询问会议的时间
    gloss: 会议是什么时候？
    note: '*Spotkanie*（会议）——第3课的对话中还会再见到这个词。'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: 说出会议日期
    gloss: 会议在5月15日。
    note: 与 *dziesiątego maja* 是同样的 *-ego* + *-a* 日期结构，只是日期数字不同。
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: 波兰语如何表达日期
    gloss: 日期：表示日的词以 -ego 结尾，表示月的词以 -a 结尾（但二月是 lutego），不用介词——5月10日，5月15日。
    note: 对比“在星期五”（*w piątek*，需要介词 *w*）——表达具体的日历日期则不同，完全不用介词。
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: 提议再次见面
    gloss: 我们什么时候可以再见面？
    note: '*Znowu* 的意思是“再次”——是商量再约一次见面时很自然的开场说法。'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: 正式地问一位先生星期五是否方便
    gloss: 星期五您方便吗？（对男士，正式）
    note: '*Panu* 是 *pan* 的与格形式。动词 *odpowiadać*（表示“适合、合得来”）的宾语总是用与格，就像汉语说“星期五对我合适”时，“*对*”后面引出的对象一样。'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: 正式地问一位女士星期五是否方便
    gloss: 星期五您方便吗？（对女士，正式）
    note: 把 *panu* 换成 *pani*，就是正式地称呼女士——这里 *pani* 的主格和与格形式相同，不像 *pan*/*panu* 那样不同。
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: 随意地问朋友星期五是否合适
    gloss: 你星期五方便吗？
    note: 和朋友或同辈说话时，用 *ci* 代替 *panu*/*pani*，这是非正式的与格“你”。
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: 表示星期五对你合适
    gloss: 我星期五方便。
    note: '*Mi* 是第一人称与格，和 *panu*/*pani*/*ci* 的格形式一致，只是把“你”换成了“我”。'
  pl.a1.unit03.lesson03.teach.data:
    title: 日期
    gloss: 日期（几月几号）
    note: 这个词的拼写和读音与国际通用的“data”（数据、日期）相近，很容易辨认。
    example_gloss: 那会是几号？
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: 询问是几号
    gloss: 那会是几号？
    note: 两人已经定好星期几、但还没定具体日期时，很自然的后续问句。
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa 提议再见面
    gloss: Ewa 问 Marek 他们什么时候可以再见面。
    note: 原样重复了本课开头的问句。
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek 正式地提议星期五
    gloss: Marek 正式地问 Ewa 星期五是否合适。
    note: 用 *pani* 称呼 Ewa，延续了从第一单元起使用的正式语体。
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa 同意并询问日期
    gloss: Ewa 说星期五可以，然后问具体是几号。
    note: '*Tak*（“是”）在第一单元学过，Ewa 先用它表示同意，再询问具体日期。'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek 说出日期
    gloss: Marek 说是5月15日。
    note: 这里的两个词都已在本单元第2课学过。
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa 确认并道别
    gloss: Ewa 说太好了，5月15日见。
    note: '*Do zobaczenia* 沿用了第一单元的告别语，这里再加上具体日期。'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek 结束对话
    gloss: Marek 也向她道别。
    note: 最简短的结束语，只有告别语本身。
