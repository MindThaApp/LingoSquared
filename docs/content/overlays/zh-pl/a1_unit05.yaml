teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: 家庭
    gloss: 家庭
    note: 表示“家庭”的通用词，指整个家，而不是某一种亲属关系。
    example_gloss: 这是我的家人。
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: 母亲，父亲
    gloss: 母亲；父亲
    note: 这是两个最基本的父母称呼。日常口语中你也会听到亲昵的 mama 和 tata，但这里学的 matka 和 ojciec 是中性的标准说法。
    example_gloss:
    - 这是我的母亲。
    - 这是我的父亲。
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: 哥哥/弟弟，姐姐/妹妹
    gloss: 兄弟；姐妹
    note: 两者都是普通名词：brat 是阳性，siostra 是阴性。这关系到本课语法说明中 mój/moja 的搭配。波兰语不区分兄姐和弟妹。
    example_gloss:
    - 这是我的兄弟。
    - 这是我的姐妹。
  pl.a1.unit05.lesson01.teach.rodzice:
    title: 父母
    gloss: 父母
    note: Rodzice 是阳性人称复数名词，它有自己专用的物主形式 moi（不用 mój/moja），本课的例句和语法说明中都会看到。
    example_gloss: 我的父母住在华沙。
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 我的：mój、moja 与 moi
    gloss: 我的父亲、我的兄弟——我的母亲、我的姐妹——我的父母。
    note: 波兰语的物主词要与所修饰名词的性一致：阳性名词前用 *mój*（*mój ojciec*、*mój brat*），阴性名词前用 *moja*（*moja matka*、*moja siostra*），而阳性人称复数 *rodzice* 前则用另一个不规则形式 *moi*。
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: 这是我的父亲
    gloss: 这是我的父亲。
    note: '*To jest*（这是）不论名词是什么性都一样，变化的只有物主词 mój/moja。'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: 祖父/外祖父，祖母/外祖母
    gloss: 祖父；祖母
    note: 称呼爷爷和奶奶的标准日常用语，孩子和成年人都这样说。
    example_gloss:
    - 这是我的祖父。
    - 这是我的祖母。
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: 叔叔/舅舅，阿姨/姑姑
    gloss: 叔叔；阿姨
    note: wujek 和 ciotka 既可指父母的兄弟姐妹，也可指父母兄弟姐妹的配偶。波兰语不像汉语那样区分父系、母系和长幼，一个词就够用。
    example_gloss:
    - 这是我的叔叔。
    - 这是我的姑妈。
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: 儿子，女儿
    gloss: 儿子；女儿
    note: 例句中是 *mieć*（有）后面需要的宾格形式：*syn* 变成 *syna*，*córka* 变成 *córkę*。后面的语法说明会解释为什么词尾会变化。
    example_gloss:
    - 我有一个儿子。
    - 我有一个女儿。
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 有：mam、masz、ma
    gloss: 有：我有、你有、他/她有——我有一个兄弟，你有一个姐妹，他/她有一个儿子。
    note: '*Mieć* 是动词“有”。*Mam*（我有）和 *ma*（他/她有）是本课主要的新形式；*masz*（你有）你在第2单元问年龄时已经见过。'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: 表达“我有……”
    gloss: “有”后面的名词要改变词尾：brat → brata，siostra → siostrę，syn → syna，córka → córkę。
    note: 这就是宾格，即名词作 *mieć* 这类动词的直接宾语时所用的形式。表示人（和动物）的阳性名词，如 *brat* 和 *syn*，加 *-a*；阴性名词，如 *siostra* 和 *córka*，把词尾的 *-a* 换成 *-ę*。
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: 我有一个哥哥／弟弟和一个姐姐／妹妹
    gloss: 我有一个哥哥／弟弟和一个姐姐／妹妹。
    note: 把语法说明中的宾格词尾用到完整的句子里，同时学习新的连接词 *i*（和）。
  pl.a1.unit05.lesson03.teach.lub:
    title: 或者
    gloss: 或者
    note: 在是非问句中提供两个选项时使用，和汉语“还是”的用法相近；不过在陈述句中 lub 相当于“或者”。
    example_gloss: 你有兄弟还是姐妹？
  pl.a1.unit05.lesson03.teach.tylko:
    title: 只
    gloss: 只
    note: 放在它所限定的词的正前方。汉语的“只”则通常放在动词前，位置略有不同。
    example_gloss: 我只有一个姐妹。
  pl.a1.unit05.lesson03.teach.gdzie:
    title: 哪里
    gloss: 哪里
    note: 基本的疑问词，自然地与 mieszkać（住）搭配，就像本课对话中那样。
    example_gloss: 你的兄弟住在哪里？
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: 他、她——以及“住”
    gloss: 他、她——住：我住、他/她住。他住在格但斯克。她住在克拉科夫。
    note: '*On*（他）和 *ona*（她）是第三人称代词。*Mieszkać*（住）的第一、第三人称变化与 *mieć* 相同：*mieszkam*（我住，见第1单元的 *Mieszkam w Warszawie*）和 *mieszka*（他/她住）。地名前用 *w*，后面接位置格：*Gdańsk* 变成 *w Gdańsku*，*Kraków* 变成 *w Krakowie*，与第1单元的 *Mieszkam w Warszawie* 是同一个 w＋位置格的结构。'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: 马雷克问起兄弟姐妹
    gloss: 马雷克问艾娃有没有兄弟或姐妹。
    note: 这是用 *Czy* 构成的是非问句，Czy 就是第1单元学过的疑问标记。艾娃和马雷克现在已经很熟了，所以从正式的 *pan*/*pani* 改用了非正式的 *ty*（*masz*、*A ty?*、*twój*）。
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: 艾娃回答并反问
    gloss: 艾娃说她有一个兄弟和一个姐妹，然后把同样的问题反问马雷克。
    note: '*A ty?*（“那你呢？”）是把问题抛回给提问者的简洁自然的说法。'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: 马雷克回答
    gloss: 马雷克说他只有一个姐妹，她住在克拉科夫，然后问起艾娃的兄弟。
    note: 马雷克没有兄弟，只有 *tylko siostrę*（只有一个姐妹）。他可以放心问艾娃的兄弟，因为艾娃已经说过她有一个兄弟。
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: 艾娃回答
    gloss: 艾娃说她的兄弟住在格但斯克，有一个儿子和一个女儿。
    note: 再次用到本单元第2课学过的 syn/córka 宾格形式。
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: 马雷克的反应
    gloss: 马雷克说：真好的一家人！
    note: '*Fajna* 是日常口语中表示“不错”“很棒”的非正式说法，用作结尾的反应很自然，语体与第4单元的 *Świetnie!* 相同。'
