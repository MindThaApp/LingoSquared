teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: 音乐
    gloss: 音乐
    note: 谈论喜欢和不喜欢时的常见话题。
    example_gloss: 我喜欢音乐。
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: lubić（喜欢）后面接宾语时，muzyka 要变成 muzykę，就像 kawa 变成 kawę 一样。应说 Lubię muzykę，而不是 Lubię muzyka。
    note: 规律和你已经学过的相同：作为 *lubię* 的宾语，*muzyka* 变成 *muzykę*，就像 *kawa* 变成 *kawę*。
  pl.a1.unit13.lesson01.teach.lubisz:
    title: 你喜欢
    gloss: 你喜欢
    note: lubić 的“你”的形式——直接问朋友是否喜欢某样东西时需要它。
    example_gloss: 你喜欢音乐吗？
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: Lubić（喜欢）：lubię（我）、lubisz（你）、lubi（他／她）。lubię 和 lubi 你已经学过——lubisz 是新的形式，用于和你说话的那个人。
    note: '*Lubię* 和 *lubi* 你已经很熟悉了——*lubisz* 补上了同一个动词中缺少的“你”的形式。'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: 你喜欢音乐吗？
    gloss: 你喜欢音乐吗？
    note: Czy 用来引出是非问句——是向朋友询问喜好的自然方式。
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: 是的，我喜欢。
    gloss: 是的，我喜欢。
    note: 简短自然的回答——不必重复 muzykę 这个词。
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: 不，我不喜欢。
    gloss: 不，我不喜欢。
    note: Nie, nie lubię 看起来重复了 nie，但并不是错误——第一个 nie 是回答问题，第二个 nie 是否定 lubię。
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: 简短回答
    gloss: 简短回答：Tak, lubię.／Nie, nie lubię. ——不必重复 muzykę 这个词，因为从问题中已经知道说的是什么。
    note: 就像 *Pyszny?* 可以单独成句一样，*Tak, lubię.* 也不必重复所说的内容——语境已经说明了一切。
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: 我很喜欢音乐
    gloss: 我很喜欢音乐。
    note: Bardzo（很、非常）可以加强一般的喜好程度——从第一单元起你就见过 bardzo 了。
  pl.a1.unit13.lesson02.teach.wole:
    title: 我更喜欢
    gloss: 我更喜欢
    note: 本单元的全新动词 woleć（更喜欢）——这里只学“我”的形式，和 lubię 一样。
    example_gloss: 我更喜欢茶。
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: Woleć：本单元只学 wolę
    gloss: Woleć（更喜欢）：wolę（我）——本课只学“我”的形式，和 lubię 一样。Wolę kawę. = 我更喜欢咖啡。
    note: 目前只学 *woleć* 的 *ja*（我）形式，范围和当初 *lubię* 刚出现时完全一样。
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: 再说咖啡和茶
    gloss: Wolę + 宾语：kawa 变成 kawę，herbata 变成 herbatę——和你已经学过的规律相同。
    note: 宾格的规律和之前一样，只是换了新动词：*wolę kawę*，*wolę herbatę*。
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: 我更喜欢咖啡
    gloss: 我更喜欢咖啡。
    note: 用 wolę 来简单表达偏好。
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: 我更喜欢茶
    gloss: 我更喜欢茶。
    note: 句型相同，只是用 herbatę 代替 kawę。
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy 表示“还是”
    gloss: Kawa czy herbata? 里的 czy 与放在句首引导是非问句的 czy 不同——这里它连接两个选项，相当于汉语的“还是”。Kawa czy herbata? = 咖啡还是茶？
    note: 注意：*czy* 通常用来引导是非问句，但放在两个名词之间时，它的意思就是“还是”。
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: 咖啡还是茶？
    gloss: 咖啡还是茶？
    note: 这是请别人做选择时简短自然的说法。
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: 我也是
    gloss: 我也是
    note: 表示赞同对方刚说的话的简短说法。
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: 再说 Ja też
    gloss: Ja też 的意思是“我也是”——你在日常作息那一课已经学过（Ja też wstaję o siódmej，“我也是七点起床”）。
    note: 提醒一下：这个短语之前出现过。
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? 不需要动词
    gloss: 就像上一单元的 Pyszny? 一样，简短的问句 Kawa czy herbata? 不需要动词——有语境就够了。
    note: 句型和 *Pyszny?* 一样——没有动词的简短问句，语境让意思一目了然。
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek 问 Ewa 喜不喜欢音乐
    gloss: 你喜欢音乐吗？
    note: Marek 用本单元刚学的问句开启了对话。
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa 很喜欢，并反问
    gloss: 是的，我很喜欢！你呢？
    note: A ty?（你呢？）把问题抛回给 Marek，和之前单元里的用法相同。
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek 表示同感，并问起饮品
    gloss: 我也喜欢。咖啡还是茶？
    note: Ja też lubię 表示 Marek 自己也有同感，然后他用新的二选一问句转换了话题。
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa 更喜欢咖啡
    gloss: 我更喜欢咖啡。
    note: Ewa 用 wolę 说出自己的偏好——她就是我们在日常作息单元里见过的爱喝咖啡的那位。
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek 更喜欢茶
    gloss: 我更喜欢茶。
    note: Marek 说出自己的偏好——和 Ewa 的选择相反。
