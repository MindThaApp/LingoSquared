teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: 车站
    gloss: 车站
    note: 火车和公共汽车往来出发、到达的地方——整个单元的起点。
    example_gloss: 车站离酒店很近。
  pl.a1.unit15.lesson01.teach.bilet:
    title: 票
    gloss: 车票
    note: 上火车或公共汽车之前，你需要一张票。
    example_gloss: 票价二十兹罗提。
  pl.a1.unit15.lesson01.teach.peron:
    title: 站台
    gloss: 站台
    note: 你实际站着等火车的地方。
    example_gloss: 一号站台在那边。
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: 一号站台、二号站台……
    gloss: 要说站台号码，可以说 Peron numer + 数字：Peron numer jeden,Peron numer dwa。
    note: 比看上去简单：就是 *peron* + *numer* + 一个你已经学过的普通数字。(车站广播常用序数词，例如 *peron pierwszy*——“第一站台”——但 *peron numer jeden* 任何时候都能听懂。)
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: 再说火车
    gloss: Pociąg odjeżdża o czwartej po południu——这个句子你在时间那一课已经学过。
    note: 和时间单元里完全相同的信息，现在用在旅行场景中。
  pl.a1.unit15.lesson01.teach.krakow:
    title: 克拉科夫
    gloss: 克拉科夫
    note: 波兰的一座真实城市——本单元的第一个目的地。
    example_gloss: 克拉科夫很远。
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: 去克拉科夫
    gloss: 去某地时，我们说 do + 城市名称的另一种形式：do Krakowa(不是 do Kraków)。请把这个形式作为整体记住。
    note: 不要试图用规则推出 *Krakowa*——现在只需把 *do Krakowa* 当作一个固定短语来记。
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: 请给我一张去克拉科夫的票
    gloss: 请给我一张去克拉科夫的票。
    note: 在售票窗口会说的确切用语。
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: 去(乘交通工具)
    gloss: Jechać(乘车去):jadę(我去),jedzie(他/她去)。明天我去克拉科夫。Marek 去克拉科夫。
    note: 目前只学两种形式——说自己用 *jadę*,说别人用 *jedzie*。
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek 要去克拉科夫
    gloss: Marek 明天去克拉科夫。
    note: Marek 自己的行程——他的故事在本单元的对话中继续。
  pl.a1.unit15.lesson02.teach.autobus:
    title: 公共汽车
    gloss: 公共汽车
    note: 城市之间另一种常见的出行方式。
    example_gloss: 公共汽车在车站。
  pl.a1.unit15.lesson02.teach.warszawa:
    title: 华沙
    gloss: 华沙
    note: 波兰的首都——本单元的第二个目的地。
    example_gloss: 华沙很远。
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: 去华沙
    gloss: Warszawa 的变化和 Kraków 不同：do Warszawy(不是 do Warszawa)。每个城市都有自己的形式——请分别记住。
    note: '*Krakowa* 和 *Warszawy* 的变化规律并不相同——正因如此，要分别记住，而不是套用同一条规则。'
  pl.a1.unit15.lesson02.teach.dokad:
    title: 去哪里
    gloss: 去哪里
    note: 问的是目的地，而不是所在位置——不同于询问某物已经在哪里。
    example_gloss: 公共汽车开往哪里？
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: 再说七点
    gloss: Siódmej——这个钟点形式你在时间那一课已经学过(o siódmej = 在七点)。
    note: 同样的钟点变格形式，这里用来表示出发时间。
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: 去华沙的公共汽车七点开
    gloss: 去华沙的公共汽车七点开。
    note: 把本课的目的地和时间用法结合成一个真实的句子。
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: 再说“什么时候”
    gloss: Kiedy——这个词你在日期那一课已经学过。Kiedy odjeżdża autobus?(公共汽车什么时候开？)
    note: 出行前很自然会问的问题。
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa 要去华沙
    gloss: Ewa 明天去华沙。
    note: Ewa 自己的行程——她的故事和 Marek 的一起在本单元的对话中继续。
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: 再说“我”
    gloss: Ja——这个词你在之前的课程中已经学过。
    note: 在本课对话之前的快速复习。
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: 再说“我的”
    gloss: Mój——这个词你在家庭那一课已经学过。
    note: 在本课对话之前的快速复习。
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: 再说早上十点
    gloss: Dziesiątej 和 rano——这两个形式你在时间那一课都已经学过(o dziesiątej rano = 早上十点)。
    note: 在本课对话之前的快速复习。
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: 谢谢，再见
    gloss: Dziękuję 和 Do zobaczenia——这两个说法你在之前的课程中已经学过。
    note: 在本课对话之前的快速复习。
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: 旅途愉快！
    gloss: Miłej podróży! 是祝别人旅途愉快的说法——要把它当作一个整体来用，不要逐字翻译。
    note: 一个固定的惯用告别语——把它当作整块来记，就像你已经学过的 *Dzień dobry* 一样。
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek 明天去克拉科夫
    gloss: 明天我去克拉科夫。我的火车下午四点开。
    note: Marek 一开口就说起自己的出行计划——和第一课告诉我们的关于他的信息一样。
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa 明天去华沙
    gloss: 我去华沙。我的公共汽车早上十点开。
    note: Ewa 说出自己的计划——和第二课告诉我们的关于她的信息一样。
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek 祝 Ewa 旅途愉快
    gloss: 旅途愉快！
    note: Marek 用本课学到的惯用语祝福 Ewa。
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa 感谢 Marek 并道别
    gloss: 谢谢！再见！
    note: 一个简单、熟悉的对话结尾。
