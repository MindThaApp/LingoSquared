teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Zwierzę* 是“动物”的通称；*zwierzak* 是日常说的“宠物”。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Ewa 有一只狗。
    - Tomek 有一只猫。
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: 这和前面单元里学过的 *Masz ...?* 问句句型相同；*masz* 是 *mieć* 的 *ty* 形式。
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*Nie mam* 后面接属格，否定所没有的东西：*zwierzaka*。见语法说明。'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + 属格
    gloss: '*nie mam* 之后，宾语用属格：*Nie mam czasu*（我没有时间），这里是 *Nie mam zwierzaka*（我没有宠物）。'
    note: 这里沿用 *Nie mam czasu* 的句型，只是名词是新的。像 *zwierzak* 这样的阳性有生命名词，宾格和属格形式相同，而阴性名词会有变化（*Mam rybę* 变成 *Nie mam ryby*）。
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*Wyprowadzać na spacer* 是遛动物的固定说法；这里动词用未完成体，因为这是习惯性的动作。见语法说明。'
    example_gloss: 我每天遛狗。
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: 未完成体表示习惯
    gloss: '*Wyprowadzać*（未完成体）表示习惯：*Codziennie wyprowadzam psa.* 完成体 *wyprowadzić* 用于一次已经完成的遛狗。'
    note: 体的配对：未完成体（*wyprowadzać*）用于重复的动作，完成体（*wyprowadzić*）用于单次、已完成的动作。
  pl.a1.unit26.lesson02.teach.karmic:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: 和……玩
    gloss: 和……玩
    example_gloss: Tomek 和他的猫玩。
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: 把 *wyprowadzać na spacer* 与 *codziennie*（每天）结合起来；宾语 *psa* 用宾格。
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: '*Karmić*（喂）后面接动物的宾格：*karmię kota*。这里与 *codziennie* 搭配使用。'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 复数：pies, psy
    gloss: 复数：*pies* 变成 *psy*，*kot* 变成 *koty*，*ryba* 变成 *ryby*，*ptak* 变成 *ptaki*。大多数复数以 *-y* 结尾，在 k 和 g 之后则是 *-i*。
    note: 这是波兰语规则复数的构成方式，这里首次以动物名词为例介绍。
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Marek 爱狗。
    - Kasia 爱猫。
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*Kocham* 是 *kochać* 的 *ja* 形式；它的宾语 *zwierzęta* 是宾格复数。'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia 爱猫，但没有宠物
    gloss: Kasia 爱猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek 问起宠物
    gloss: Marek：你有宠物吗，Ewa？
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa 有一只狗
    gloss: Ewa：有，我有一只狗。
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek 问它长什么样
    gloss: Marek：它长什么样？
    note: 沿用前面课程里学过的 *Jak wygląda ...?* 问句，这次问的是动物；*on* 可以指一只狗。
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa 描述她的狗
    gloss: Ewa：它有棕色的毛，个子很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: 动物的 on 和 ona
    gloss: 波兰语中的动物有语法上的性：*pies* 和 *kot* 用 *on*（他），*ryba* 用 *ona*（她）。这些代词可以指动物，不只是指人。
    note: 代词随名词的性而变：*pies* 和 *ptak* 用 *on*，*ryba* 用 *ona*，*zwierzę* 用 *ono*。
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek 问遛狗的事
    gloss: Marek：你每天都遛它吗？
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa 说起她的日常
    gloss: Ewa：是的，我每天都遛它，还喂它。
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek、Kasia 和 Tomek 谈动物
    gloss: Marek 和 Kasia 都爱动物，但他们俩都没有宠物。Marek 爱狗，Kasia 爱猫。Tomek 有一只宠物：一只猫。他经常和他的猫玩，每天都给猫喂食。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      kochają: 喜爱
      oboje: 两者都
      zwierzęta: 动物
      zwierzaka: 宠物
      psy: 狗
      koty: 猫
      kota: 猫
      bawi: 玩
      daje: 给
      co: 每一
      jeść: 食物
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek 经常和他的猫玩
    gloss: Tomek 经常和他的猫玩。
    note: '*Bawić się z*（和……玩）后面接工具格：*z kotem*。*Często* 是表示“经常”的频率副词。'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa 问 Nina
    gloss: Ewa：Nina，你也有宠物吗？
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Ma na imię*（名叫）和前面介绍名字时用的说法相同。'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek 的反应
    gloss: Marek：真好！你每天和它做什么？
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek 也爱鸟
    gloss: Marek：我也爱鸟。
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa 结束对话
    gloss: Ewa：太好了，我们三个都爱动物！
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
