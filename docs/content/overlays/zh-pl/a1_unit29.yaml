    title: Do widzenia 和 do + 某一天
    gloss: 你已经学过 *Do widzenia!* 你也可以说出具体的日子：*Do soboty!*、*Do jutra!*（*do* 后面接二格（属格））。
    note: 把问候单元中的告别用语扩展到具体的某一天。
