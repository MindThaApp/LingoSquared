    title: 与消息有关的动词：发送和阅读
    gloss: 你已经学过 *prognoza pogody*（天气预报）。*Wiadomość*（消息）可以发送（*wysyłam*、*wysyłasz*），也可以阅读（*czytam*、*czytasz*）。
    note: 把新单词与天气单元中学过的复合名词联系起来。
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa 通过应用发消息
    gloss: Ewa 通过应用发了一条消息。
    note: '*Wysyłać*（发送）用 *przez* + 宾格表示渠道：*przez aplikację*。'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
