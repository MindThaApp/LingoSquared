    gloss: Ewa 每天给 Marek 打电话。她用的是手机，不是应用程序。Marek 家里没有电脑，但他用手机上网。Tomek 每天早上查看天气预报。然后他去跑步。Kasia 常常给 Ewa 发消息。你也每天使用手机吗？
    note: 对比四个人物使用设备的习惯，与运动单元的对比阅读形式相呼应。
