teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: 银行、邮局
    gloss: 银行；邮局
    note: 两个日常办事的地方——bank 是办理银行业务的地方；poczta 是寄信或包裹的地方。
    example_gloss:
    - 这是银行。
    - 这是邮局。
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: 药店、餐厅
    gloss: 药店；餐厅
    note: Apteka 是买药的地方（不是普通商店）；restauracja 是吃饭的地方。
    example_gloss:
    - 这是药店。
    - 这是餐厅。
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: 酒店；公园
    note: 两个词的拼写和发音都很好记，容易辨认。
    example_gloss:
    - 这是酒店。
    - 这是公园。
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Gdzie jest + [地点]？
    gloss: Gdzie jest + [地点]？——Gdzie（哪里）加 jest（是／在）用来询问位置：银行在哪里？药店在哪里？
    note: '*Gdzie* 的意思是“哪里”，*jest* 的意思是“是／在”——合起来，*Gdzie jest...?* 就是询问任何地点位置的日常句型。询问单个地点时直接使用即可；如果问的是多个地点，波兰语要改用 *są*（“是／在”的复数形式）。'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: 银行在哪里？
    gloss: 银行在哪里？
    note: 把语法说明中的句型用在本课的第一个地点词上。
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: 近、远
    gloss: 近；远
    note: 一对简单的反义词，直接放在 jest 之后，用来说明某个地方是近还是远。
    example_gloss:
    - 公园很近。
    - 酒店很远。
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: 不远
    gloss: 不远
    note: 字面意思是 *nie*（不）加 *daleko*（远）合成一个词——这是一种更委婉、非常常用的说法，用来让人放心：那个地方很容易到达。
    example_gloss: 药店不远。
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: 旁边，对面
    gloss: 在……旁边；在……对面
    note: 这两个词都是以某个地标为参照来说明地点的位置，而不只是说距离近不近。两者后面的名词都要变成属格——见本课的语法说明。
    example_gloss:
    - 药店在银行旁边。
    - 餐厅在酒店对面。
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 在 'obok'/'naprzeciwko'/'blisko + 名词' 之后：属格
    gloss: 在 'obok'（旁边）/'naprzeciwko'（对面）/'blisko'（附近）+ 地点之后，名词用属格：bank → banku，hotel → hotelu，park → parku。药店在银行旁边。餐厅在酒店对面。餐厅离公园很近。
    note: '*Obok*、*naprzeciwko* 以及 *blisko*（后面接地点、而不是单独使用时）都要求后面的名词用属格，所以名词的词尾会变化。这三个规则的阳性名词，只需加 *-u*：*bank* 变成 *banku*，*hotel* 变成 *hotelu*，*park* 变成 *parku*。*blisko* 单独使用时完全不需要属格——*To jest blisko*（“这很近”）和 *blisko parku*（“离公园很近”）一样正确。'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: 药店在银行旁边
    gloss: 药店在银行旁边。
    note: 把语法说明中的 -u 规律用到真实的句子里——bank 在 obok 之后变成 banku。
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: 打扰一下
    gloss: 打扰一下／对不起
    note: 在向陌生人提问之前，用来引起对方注意的日常说法——要放在问题之前说，而不是之后。
    example_gloss: 打扰一下，银行在哪里？
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa 询问药店在哪里
    gloss: Ewa 说“打扰一下”，并问药店在哪里。
    note: Przepraszam 用在问题的开头，正如本课词汇说明所讲的那样——即使是对 Marek 这样认识的人，在提问前用它来打断对方也是礼貌的做法。
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek 说明药店的位置
    gloss: Marek 说药店不远，就在银行旁边。
    note: 结合了第二课语法说明中的 niedaleko 和 obok + banku。
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa 感谢 Marek，并询问餐厅的位置
    gloss: Ewa 说谢谢，并问餐厅在哪里。
    note: Dziękuję 在前面的单元里出现过；A（而、那么）把新问题和上一个问题连接起来。
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek 说明餐厅的位置
    gloss: Marek 说餐厅在酒店对面，离公园很近。
    note: Naprzeciwko + hotelu（属格，和 banku 的规律相同），再用 blisko 说出第二个地标。
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa 再次感谢 Marek
    gloss: Ewa 说非常感谢。
    note: Bardzo（非常）加强了 dziękuję 的语气，和 proszę bardzo 里的用法一样。
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek 回应
    gloss: Marek 说不客气。
    note: Proszę bardzo 是回应感谢的标准说法，在购物单元里出现过。
