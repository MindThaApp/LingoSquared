answer_policy:
  diacritics: 'Same standing policy as 第1单元/unit02/unit03: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: 波兰语 A1
units:
  pl.a1.unit04.time:
    title: 时间和钟点
lessons:
  pl.a1.unit04.lesson01.ktora_godzina:
    title: 几点了？
  pl.a1.unit04.lesson02.o_ktorej_godzinie:
    title: 在几点
  pl.a1.unit04.lesson03.ustalamy_godzine_spotkania:
    title: 约定见面时间
teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: 一点、两点、三点
    gloss: 一点钟；两点钟；三点钟
    note: 波兰语用阴性序数词报时，与省略的阴性名词 *godzina*（小时）保持一致——*pierwsza* 字面意思是“第一（个小时）”。
    example_gloss:
    - 现在是1点。
    - 两点钟。
    - 现在三点。
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: 四点、五点、六点
    gloss: 四点钟；五点钟；六点钟
    note: 与 *pierwsza*、*druga*、*trzecia* 相同的阴性序数词规律。
    example_gloss:
    - 四点钟。
    - 五点钟。
    - 现在是6点。
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: 七点、八点、九点
    gloss: 七点钟；八点钟；九点钟
    note: 十二个钟点中的中间三个，规律相同。
    example_gloss:
    - 七点钟。
    - 现在八点。
    - 现在九点。
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: 十点、十一点、十二点
    gloss: 十点;十一点;十二点
    note: 最后三个钟点,至此完整学完1到12点。
    example_gloss:
    - 现在十点。
    - 现在十一点。
    - 现在是12点。
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: 询问时间
    gloss: 几点了？
    note: 字面意思是“哪一个是钟点?”——*która* 与阴性名词 *godzina* 保持一致,这种一致关系在本单元中会反复出现。
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina 是阴性名词
    gloss: 我们说 pierwsza、druga、trzecia,而不说 pierwszy、drugi、trzeci。
    note: '*Pierwszy*、*drugi*、*trzeci* 是这些序数词的阳性形式,在波兰语中用于阳性名词,但报时时不能用,因为 *godzina* 是阴性名词。'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: 早晨、中午、下午
    gloss: 早上;中午;下午
    note: '*Rano* 单独使用(不带前置词);*w południe* 和 *po południu* 各自带有固定的前置词。这三个表达最好当作固定短语来记,而不是靠一般规则推导。'
    example_gloss:
    - 我早上喝咖啡。
    - 我中午吃午饭。
    - 我下午工作。
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: 晚上、夜里
    gloss: 晚上;夜里
    note: '*Wieczorem* 是固定的状语形式(不需要前置词);*w nocy* 是 *w* 加上 *noc*(夜)的位置格。'
    example_gloss:
    - 晚上我看电视。
    - 夜里我睡觉。
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: 询问几点
    gloss: 几点？
    note: 当你想问某件事在几点发生,而不是问现在几点时,用这句,不用 *Która jest godzina?*。
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: 表达“在”几点
    gloss: 四点、七点、十点——但“在四点”“在七点”“在十点”要变形。
    note: 在 *o*(“在”)之后,钟点词末尾的 *-a* 变成 *-ej*:*czwarta* → *o czwartej*,*siódma* → *o siódmej*,*dziesiąta* → *o dziesiątej*。每个钟点都遵循这一规律;唯一的拼写特例是 *druga* → *o drugiej*,在 *g* 后多了一个 *i*。
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa 起得早
    gloss: Ewa 早上七点起床。
    note: '*Wstaje* 是 *wstawać*(起床)的第三人称单数形式。'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: 火车的发车时间
    gloss: 火车下午四点发车。
    note: '*Odjeżdża* 是 *odjeżdżać*(出发、开走)的第三人称单数形式。'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: 会面
    gloss: 会面;见面
    note: 这个词你在第3单元已经见过(*Kiedy jest spotkanie?*),当时 Ewa 和 Marek 约定了再次见面的日期。
    example_gloss: 见面在星期五。
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: 询问见面的时间
    gloss: 我们星期五,也就是5月15日,几点可以见面?
    note: 本单元的 *o której godzinie* 与第3单元的星期和日期结合在一起——Ewa 和 Marek 已经说定5月15日星期五,现在要确定具体时间。
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: 提议时间
    gloss: 也许下午四点?
    note: '*Może* 单独使用时意为“也许”,是委婉地提出建议时间的自然说法。'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: 确认时间可以
    gloss: 下午四点我可以。
    note: 和第3单元的 *Piątek mi odpowiada* 是同一个 *[time] + mi + odpowiada* 结构：时间本身是语法上的主语，而 *odpowiadać* 所指的人总是用与格（*mi*，意为“对我来说”）。
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: 确认完整的安排
    gloss: 5月15日四点见!
    note: 再次使用第1单元的告别语 *Do zobaczenia*,这次加上了日期和时间。
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa 询问时间
    gloss: Ewa 问 Marek 他们5月15日星期五几点可以见面。
    note: 与本课开头的问句完全相同。
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek 提议下午四点
    gloss: Marek 建议下午四点。
    note: 这是委婉的建议,而不是肯定的陈述——*może* 就表达了这层意思。
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa 表示同意
    gloss: Ewa 说下午四点她可以。
    note: 与第3单元“星期五我可以”的对话使用同样的与格结构。
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek 敲定安排
    gloss: Marek 说太好了,5月15日四点见!
    note: '*Świetnie* 再次使用了第3单元中表示热情的感叹。'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa 道别
    gloss: Ewa 也向他道别。
    note: 最简短的结束语——只有告别语本身。
