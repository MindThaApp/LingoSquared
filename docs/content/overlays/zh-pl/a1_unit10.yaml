teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: 起床，我起床
    gloss: 起床；我起床
    note: Wstawać 是动词原形；wstaję 是第一人称形式，用来讲述自己的日常作息，日常最常用。
    example_gloss: 我早上七点起床。
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: 吃，我吃
    gloss: 吃；我吃
    note: Jeść 有点不规则，但最常用的是 jem（“我吃”）——波兰人说“我吃”某一餐，用的正是这个形式。
    example_gloss: 我早上吃早饭。
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: 早餐
    gloss: 早餐
    note: Śniadanie 在 jem 之后形式不变——“我吃早饭”就是 jem śniadanie，不需要再学额外的词尾。
    example_gloss: 早上我吃早饭。
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: 喝，我喝
    gloss: 喝；我喝
    note: Pić 是动词原形；piję 是第一人称形式，用法与 jem 和 wstaję 相同。
    example_gloss: 我早上喝咖啡。
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: 谈谈自己
    gloss: Wstaję, jem, piję——本单元只谈自己，用第一人称（我），就像描述你自己的一天一样。
    note: 本单元刻意只使用每个动词的“我”的形式——*wstaję*（我起床）、*jem*（我吃）、*piję*（我喝），这样你可以专心描述自己的日常，而不必同时学动词如何随“你”“他”“她”变化。
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: 我早上七点起床
    gloss: 我早上七点起床。
    note: 运用语法要点：o + 钟点的位置格形式（siódmej）表示“在”那个钟点，和之前的时间单元一样。
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: 我吃早饭，喝咖啡
    gloss: 我吃早饭，喝咖啡。
    note: 用 i（和）连接两个第一人称动词——列举自己早晨活动的自然说法。
  pl.a1.unit10.lesson02.teach.obiad:
    title: 午饭
    gloss: 午饭／正午的一餐
    note: 和 śniadanie 一样，obiad 在 jem 之后形式不变——jem obiad 就是“我吃午饭”。
    example_gloss: 我中午吃午饭。
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: 工作，我工作
    gloss: 工作；我工作
    note: Pracować 遵循与购物单元中 kosztować → kosztuje 相同的 -ować → -uję 规律，这次用的是第一人称。
    example_gloss: 我下午工作。
  pl.a1.unit10.lesson02.teach.dom:
    title: 家
    gloss: 家／房子
    note: 表示“家”的常用词——在“回家”这个说法中经常出现。
    example_gloss: 房子在那里。
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: 回家
    gloss: 回家——do 后面用属格，dom 的属格词尾是 -u：domu，和 bank → banku、park → parku、hotel → hotelu 的规律完全相同。
    note: '*Do domu*（“到家”／“回家”，如“我回家”）沿用了你已学过的 *do* 后接 bank、hotel、park 时的属格词尾 *-u*——又一个遵循同一规律的名词。'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: 返回，我返回
    gloss: 返回／回去；我返回／回去
    note: 与 do domu 连用，表示“我回家”——波兰语中最常见的日常说法之一。
    example_gloss: 我晚上回家。
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: 中午，下午，晚上
    gloss: 中午；下午；晚上
    note: 复习之前时间单元的内容：这些表示一天中时段的说法，加上 rano 和 w nocy，就涵盖了一整天。
    example_gloss:
    - 我中午吃午饭。
    - 我下午工作。
    - 我晚上回家。
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: 我下午工作，然后回家
    gloss: 我下午工作，然后回家。
    note: 与问路单元相同的“逗号 + potem”连接方式，这次用来连接日常作息的两个部分。
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: 睡觉，我睡觉
    gloss: 睡觉；我睡觉
    note: Śpię 的元音与原形 spać 相比有看似不规则的变化，但它是非常常用的高频动词，值得直接记住。
    example_gloss: 我夜里睡觉。
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: 你呢？我也是。
    gloss: 你呢？／我也是。
    note: A ty? 是把话题交还给对方的简单说法；ja też 意思是“我也是”——两者在日常闲聊中都非常常用。
    example_gloss: 我早上也吃早饭。
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: 但是，茶，不
    gloss: 但是；茶（作宾语）；不
    note: Ale 引出转折；nie 放在某个词前面（而不是动词前面）表示“不是［那个东西］”——piję herbatę, nie kawę 意思是“我喝茶，不喝咖啡”。
    example_gloss: 我喝茶，但不喝咖啡。
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: 早，十点
    gloss: 早；十点——在 o 之后的钟点使用相同的 -ej 词尾，如之前课程中的 czwartej、siódmej。
    note: '*O dziesiątej*（“在十点”）沿用了你已学过的钟点规律——*dziesiąta* 在 *o* 之后变成 *dziesiątej*，就像 *czwarta* → *czwartej*、*siódma* → *siódmej* 一样。'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa 讲述她的早晨
    gloss: Ewa 说她早上七点起床，喝咖啡。
    note: 沿用本单元最先学的句型，这次放在真实的对话中。
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa 继续讲她的一天
    gloss: Ewa 说她吃早饭，然后下午工作。
    note: 用 potem 连接两个第一人称的活动，与第2课的句型相同。
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa 说完后问 Marek
    gloss: Ewa 说她晚上回家。你呢？
    note: A ty? 不需要任何新的疑问句语法，就把话题交给了 Marek。
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek 分享他的早晨
    gloss: Marek 说他也是七点起床！但他喝茶，不喝咖啡。
    note: Ja też 先确认了相同的细节（起床时间），再用 ale…nie 对饮品做对比。
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek 描述他的一天
    gloss: Marek 说他早上工作，然后中午吃午饭。
    note: 日常顺序与 Ewa 不同——先工作，再吃午饭。
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek 谈睡眠
    gloss: Marek 说他睡得早，晚上十点就睡。
    note: 用新动词 spać／śpię 和本课复用的钟点规律结束这段对话。
