answer_policy:
  diacritics: 'Same standing policy as 第1单元： display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: 波兰语 A1
units:
  pl.a1.unit02.numbers:
    title: 数字
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 零到十的数字
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: 十一到一百的数字和价格
  pl.a1.unit02.lesson03.phone_and_age:
    title: 电话号码和年龄
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 零
    note: 本单元后面所有数字的起点。
    example_gloss: 今天零度。
  pl.a1.unit02.lesson01.teach.jeden:
    title: 一
    gloss: 一
    note: '*Jeden* 后面接普通的单数名词，这一点与本课其他数词不同。'
    example_gloss: 我有一部手机。
  pl.a1.unit02.lesson01.teach.dwa:
    title: 二
    gloss: 二
    note: '*Dwa*、*trzy* 和 *cztery* 后面的名词用特殊的复数形式（如 *psy*，“狗”）——与 *pięć* 及以上数词后面的复数形式不同。'
    example_gloss: 我有两条狗。
  pl.a1.unit02.lesson01.teach.trzy:
    title: 三
    gloss: 三
    note: 复数规则与 *dwa* 相同：*trzy złote*（三个 złoty），而不是 *trzy złotych*。
    example_gloss: 咖啡三 złoty。
  pl.a1.unit02.lesson01.teach.cztery:
    title: 四
    gloss: 四
    note: 共用这一复数规则的三个数词（*dwa*、*trzy*、*cztery*）中的最后一个。
    example_gloss: 我有四本书。
  pl.a1.unit02.lesson01.teach.piec:
    title: 五
    gloss: 五
    note: 从 *pięć* 起，数词后面的名词用另一种复数形式（复数第二格，如 *minut* 而不是 *minuty*）——这一规则会贯穿本单元后面的内容。
    example_gloss: 我有五分钟。
  pl.a1.unit02.lesson01.teach.szesc:
    title: 六
    gloss: 六
    note: 与 *pięć* 的复数第二格规则相同：*sześć jabłek*（六个苹果）。
    example_gloss: 我有六个苹果。
  pl.a1.unit02.lesson01.teach.siedem:
    title: 七
    gloss: 七
    note: 谈论一周七天时很有用的数字。
    example_gloss: 一周有七天。
  pl.a1.unit02.lesson01.teach.osiem:
    title: 八
    gloss: 八
    note: '*Mam osiem lat* 字面意思是“我有八年”——波兰语表示年龄用 *mieć*（“有”）。第3课会完整练习这一句式。'
    example_gloss: 我八岁。
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: 九
    gloss: 九
    note: 又是复数第二格：*dziewięć osób*（九个人）。
    example_gloss: 九个人在排队。
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: 十
    gloss: 十
    note: 个位数中的最后一个——第2课接着学十几和整十数。
    example_gloss: 我有十根手指。
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: 十一
    gloss: 十一
    note: 11到19的数词都以 *-naście* 结尾，与汉语“十＋个位数”的构成方式不同，每个都是独立的词。它们和 *pięć* 以上的数词一样，后面接复数第二格：*jedenaście osób*。
    example_gloss: 班里有十一个人。
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: 十二
    gloss: 十二
    note: 与 *jedenaście* 相同的 *-naście* 规则。
    example_gloss: 一年有十二个月。
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: 十五
    gloss: 十五
    note: 仍是 *-naście* 规则：*piętnaście minut*（十五分钟）。
    example_gloss: 我有十五分钟的休息时间。
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: 二十
    gloss: 二十
    note: 20到40的数词以 *-dzieści* 结尾——与以 *-naście* 结尾的十几不同。*Dwadzieścia* 本身仍接复数第二格（*dwadzieścia lat*），但在它后面再加个位数会怎样，请留意第3课。
    example_gloss: 我二十岁。
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: 二十一
    gloss: 二十一
    note: 复合数词的构成与汉语相似：先说十位数，再说个位数，中间不需要连接词。
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: 三十
    gloss: 三十
    note: 仍是 *dwadzieścia* 中出现过的 *-dzieści* 规则。
    example_gloss: 票价三十 złoty。
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: 五十
    gloss: 五十
    note: 50到90的数词采用第三种规则 *-dziesiąt*，而不是 *-dzieści*。
    example_gloss: 我有五十 złoty。
  pl.a1.unit02.lesson02.teach.sto:
    title: 一百
    gloss: 一百
    note: 整百数，没有复合词尾需要操心。
    example_gloss: 那个一百 złoty。
  pl.a1.unit02.lesson02.teach.ile:
    title: 多少
    gloss: 多少；几
    note: 询问任何数量或价格的疑问词。
    example_gloss: 这个多少钱？
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: 询问价格
    gloss: 这个多少钱？
    note: '*Kosztować*（“花费、值”）是动词；*to*（“这个/它”）是主语。整句是固定的、非常常用的句式。'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: 说出价格
    gloss: 这个二十 złoty。
    note: '*Złotych* 是 *złoty*（波兰货币）的复数第二格——与 *dwadzieścia* 本身所要求的复数形式相同。'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: 询问电话号码（对男士）
    gloss: 您的电话号码是多少？（对男士，正式）
    note: 字面意思是“先生的电话号码是什么”。*Pana* 是 *pan* 的所属（第二格）形式——“先生的”，即“您的”。
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: 询问电话号码（对女士）
    gloss: 您的电话号码是多少？（对女士，正式）
    note: 把 *pana* 换成 *pani*，就是正式地称呼女士，与第1单元的规律相同。
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: 非正式地询问电话号码
    gloss: 你的电话号码是多少？（非正式）
    note: 与朋友或同辈交谈时，用 *twój*（你的，非正式）代替 *pana*/*pani*。
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 报号码的开场白
    gloss: 号码是……
    note: 逐个念数字之前简短自然的开场白——波兰人口头报电话号码的通常方式。
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: 电话号码示例
    gloss: 六，一，五，零，二。
    note: 波兰语的电话号码和汉语一样，是逐个数字念的——这里每个数字都是本单元已经学过的。
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: 非正式地询问年龄
    gloss: 你多大？
    note: 字面意思是“你有多少年”——波兰语表示年龄用 *mieć*（“有”），与第1课 *osiem* 卡片上预告过的句式相同。
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: 正式地询问年龄
    gloss: 您多大年纪？（对男士，正式）
    note: '*Ma* 就是第1单元 *pan jest*/*pan ma* 中已出现过的第三人称动词形式——*pan* 在语法上相当于“先生”，是第三人称主语。'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: 说出你的年龄
    gloss: 我二十八岁。
    note: '*Mam* 是 *mieć*（“有”）的第一人称形式。*Dwadzieścia osiem* 以 *osiem*（八）结尾，所以和所有以5–9结尾的数字一样，用 *lat*——请留意第3课对话中结尾不同的数字。'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa 询问 Marek 的号码
    gloss: Ewa 正式地询问 Marek 的电话号码。
    note: 完全沿用本课的正式询问电话号码的句子。
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek 报出他的号码
    gloss: Marek 逐个数字念出他的电话号码。
    note: 这里的每个数字在本单元第1–2课都学过。
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa 询问 Marek 的年龄
    gloss: Ewa 道谢，并正式地询问他的年龄。
    note: '*Dziękuję*（“谢谢”）和 *A*（“那么/呢”）不随正式程度而变化，与第1单元的 *dziękuję* 卡片一样。'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek 回答年龄并反问
    gloss: Marek 说他二十八岁，并正式地反问 Ewa 的年龄。
    note: '*A pani?* 是正式地向女士反问，与第1单元学过的 *A pan?* 是同样的简短句式。'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa 说出她的年龄
    gloss: Ewa 说她三十二岁。
    note: '*Trzydzieści dwa* 以 *dwa*（二）结尾，所以和以八结尾、用 *lat* 的 *dwadzieścia osiem* 不同，这个数字要用 *lata*——以2、3、4结尾的数字（十几除外）都用这种不同的复数形式。这是一个真实的语法细微之处：*lat* 和 *lata* 不能互换，用哪个取决于数字的最后一位。'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek 结束谈话
    gloss: Marek 说聊得很愉快，并道别。
    note: '*Do zobaczenia* 沿用了第1单元的“回头见”告别语。'
