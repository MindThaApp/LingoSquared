teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: 想要，我想要
    gloss: 想要；我想要
    note: Chcieć 是动词不定式；chcę 是日常使用的第一人称形式，用来说你想要什么。
    example_gloss: 我想去看电影。
  pl.a1.unit11.lesson01.teach.chcesz:
    title: 你想要
    gloss: 你想要（非正式）
    note: Chcesz 是非正式的“你”的形式，用法和 masz、jesteś 相同，正好用来问朋友想要什么。
    example_gloss: 你想要咖啡吗？
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: 我想要，你想要
    gloss: Chcę、chcesz，和 masz（mieć）、jesteś（być）的规律相同：chcesz 是“你”的形式（第二人称），用来问对方想要什么。
    note: 这一单元需要的不只是“我”：*chcę*（我想要）和 *chcesz*（你想要）的人称变化，与你已经学过的 *masz* 和 *jesteś* 完全一样，只是用在了新的动词上。
  pl.a1.unit11.lesson01.teach.kino:
    title: 电影院
    gloss: 电影院
    note: 表示电影院的日常用词，约计划时经常会用到。
    example_gloss: 这是电影院。
  pl.a1.unit11.lesson01.teach.razem:
    title: 一起
    gloss: 一起
    note: Razem 在购物场景中也表示“总共”（你也许还记得购物单元），而这里用的是它另一个常见的意思：“一起”。
    example_gloss: 你想一起去吗？
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: 你想去看电影吗？
    gloss: 你想去看电影吗？
    note: Czy 引出是非问句；chcesz iść do kina 问对方想做什么，是提出计划的基本说法。
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: 你想星期五一起去看电影吗？
    gloss: 你想星期五一起去看电影吗？
    note: 完整的提议：在刚学的问句上加上 razem（一起）和 w piątek（在星期五）。
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: 能够，我能
    gloss: 能够／可以；我能
    note: Móc 是动词不定式；mogę 是第一人称形式。你也许还记得前面日期和时间单元里的 możemy（我们能），这是同一个动词，只是用了单数。
    example_gloss: 我星期五可以来。
  pl.a1.unit11.lesson02.teach.mozesz:
    title: 你能
    gloss: 你能（非正式）
    note: Możesz 是非正式的“你”的形式，和 chcesz 一样是第二人称，用来问别人是否能做某事。
    example_gloss: 你星期六有空吗？
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: 来
    gloss: 来
    note: 表示来见某人的动词，很自然地和 mogę／możesz 搭配，说明谁能来或不能来。
    example_gloss: 我想星期五来。
  pl.a1.unit11.lesson02.teach.moc_note:
    title: 我能，你能
    gloss: Móc：mogę、możesz，第二人称（你）的形式与 chcesz 相同。Mogę 加动词不定式表示你能做什么：mogę przyjść（我能来）、mogę iść（我能去）。
    note: '*Mogę* 加上动词原形表示你能做什么：*mogę przyjść*（“我能来”）和 *mogę iść*（“我能去”）都是这个简单的结构。'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: 乐意地
    gloss: 乐意地
    note: 热情地接受计划的说法，常与 tak（是）或 bardzo（很）连用，语气更热情。
    example_gloss: 好啊，非常乐意！
  pl.a1.unit11.lesson02.teach.niestety:
    title: 遗憾的是
    gloss: 遗憾的是
    note: 委婉拒绝计划时的自然缓冲语，后面几乎总是接 nie mogę（我不能）。
    example_gloss: 遗憾的是，我不能。
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: 在星期六
    gloss: W + 星期几：阳性的日子（piątek、poniedziałek、czwartek）词尾不变：w piątek。阴性的日子（sobota、środa、niedziela）要用宾格词尾 -ę，就像 kawa → kawę：w sobotę。
    note: '*w* 后面并不是每个星期几都一样：像 *sobota* 这样的阴性名词变成 *sobotę*，与你学过的 *kawa* → *kawę*、*herbata* → *herbatę* 是同样的 *-a* → *-ę* 变化。而像 *piątek* 这样的阳性名词保持不变。'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: 你星期六能来吗？
    gloss: 你星期六能来吗？
    note: 把 możesz、przyjść 和新学的 w sobotę 组合在一起，是询问另一天的完整说法。
  pl.a1.unit11.lesson03.teach.moze:
    title: 也许，……怎么样
    gloss: 也许／……怎么样
    note: 用来提出替代方案的词，第一个计划行不通、想建议别的时就会用到。
    example_gloss: 星期六怎么样？
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może 与 mogę 的区别
    gloss: Może 和 mogę 看起来很像，但意思不同：może（“也许”）用来提出新的建议；mogę（动词“我”的形式，“我能”）表示你能做什么。
    note: 书写时容易混淆：*może*（“也许”，这里用来提建议）和 *mogę*（“我能”，第一人称动词）在句子中作用不同，尽管词根相同，要注意最后一个字母。
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: 几点？
    gloss: 几点？
    note: 日子已经定下后，询问具体时间的标准说法。你也许还记得前面时间单元里的 o której。
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa 提议去看电影
    gloss: Ewa 问 Marek 星期五想不想去看电影。
    note: 重复本单元最先学的问句，这次放在真实的对话中。
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek 星期五不行
    gloss: Marek 说很遗憾，他星期五不能去。
    note: Niestety 先缓和语气，再直接说 nie mogę。
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek 提议星期六
    gloss: Marek 问：星期六怎么样？
    note: Może 提出替代方案，而不是直接拒绝后结束对话。
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa 乐意答应
    gloss: Ewa 说：星期六？非常乐意！
    note: 先重复对方提议的日子（保持 w sobotę 的形式），再用 chętnie 表示答应。
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa 问时间
    gloss: Ewa 问：几点？
    note: 日子定好后，最后要安排的细节就是时间。
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek 确认时间
    gloss: Marek 说：下午四点。
    note: 以确定的具体时间结束商议，用到了前面时间和日常作息单元里的钟点表达。
