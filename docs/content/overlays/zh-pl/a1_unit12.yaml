teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: 昨天
    gloss: 昨天
    note: 谈论刚刚过去、已经结束的一天时最基本的时间词——和本单元学的过去时形式自然搭配。
    example_gloss: 我昨天去了电影院。
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: 昨天发生了什么？
    gloss: 昨天发生了什么？
    note: 请对方讲讲最近发生的事的自然说法——było 不会随回答的人而变化，所以问谁都可以用。
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: Było 是 być(是、在)的过去时中性(“它”)形式——与 co(什么)保持一致，所以泛泛地问发生了什么时用它：Co było wczoraj? 无论谁来回答，这个词都不变。
    note: '*Było* 是中性的“曾是 / 曾有”形式——它与 *co*(什么)一致，而不是与被问的人一致，所以在 *Co było wczoraj?* 这样的开放式问句中，意思是“有过什么”“发生了什么”。'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: 我曾在(男 / 女)
    gloss: 我曾在(男性说)/ 我曾在(女性说)
    note: 波兰语的过去时会体现说话人的性别：男性说用 byłem,女性说用 byłam。两者都表示“我曾在 / 我曾是”。
    example_gloss:
    - 我昨天去了电影院。
    - 我昨天去了电影院。
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 过去时：-em 与 -am
    gloss: 过去时动词的词尾因说话人的性别而不同：男性说用 -em(byłem),女性说用 -am(byłam)。这适用于所有过去时动词，不只是 być。
    note: 注意最后的字母：*-em* 表示说话的是男性，*-am* 表示说话的是女性。本单元每个过去时动词都是这个规律。
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: 在电影院
    gloss: Kino 在 w 之后词尾会变：idę do kina(去哪里？)和 jestem w kinie(在哪里？)用的是不同的形式。W kinie 是方位格——表示事情发生在哪里，而不是某人要去哪里。
    note: 两种不同的词尾，回答两个不同的问题：*do kina* 回答“去哪里？”(你在计划单元学过),而 *w kinie* 回答“在哪里？”——不要混淆。
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: 我昨天在电影院(男性说)
    gloss: 我昨天去了电影院。
    note: 把 byłem、wczoraj 和 w kinie 组合在一起——男性这样说明自己去了哪里。
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: 我昨天在电影院(女性说)
    gloss: 我昨天去了电影院。
    note: 同一个句子，换成 byłam——女性这样说明自己去了哪里。
  pl.a1.unit12.lesson02.teach.film:
    title: 电影
    gloss: 电影
    note: 谈论看过什么时的日常词汇——讲述去电影院的经历时经常用到。
    example_gloss: 我看了一部好电影。
  pl.a1.unit12.lesson02.teach.dobry:
    title: 好
    gloss: 好的
    note: 你之前在 dzień dobry(你好、日安)里见过 dobry——这里它单独作普通形容词，意思是“好”。
    example_gloss: 一部非常好的电影！
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: 我看到了(男 / 女)
    gloss: 我看到了(男性说)/ 我看到了(女性说)
    note: Zobaczyć 表示一次完成的“看见”(不同于表示持续看的 widzieć)——男性说用 zobaczyłem,女性说用 zobaczyłam,和 byłem/byłam 的 -em/-am 规律相同。
    example_gloss:
    - 我看了一部好电影。
    - 我看了一部好电影。
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: 与 byłem/byłam 相同的规律
    gloss: 与 byłem/byłam 规律相同：zobaczyłem 是男性说的，zobaczyłam 是女性说的。Zobaczyć 是完成体动词——表示一件已经完成的事。
    note: 词尾相同，动词是新的：*zobaczyłem/zobaczyłam* 完全遵循你刚学过的 *byłem/byłam* 的规律。
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: 我做了(男 / 女)
    gloss: 我做了(男性说)/ 我做了(女性说)
    note: Zrobić 既可以表示“做”(制作),也可以表示“做”(从事),指一次完成的动作——男性用 zrobiłem,女性用 zrobiłam,规律还是一样。
    example_gloss:
    - 我做了午饭。
    - 我做了午饭。
  pl.a1.unit12.lesson02.teach.obiad:
    title: 午饭
    gloss: 午饭 / 正餐
    note: 你也许还记得日常作息单元里的 obiad——这里指 Marek 做的一天中的主餐。
    example_gloss: 这是一顿美味的午饭。
  pl.a1.unit12.lesson02.teach.pyszny:
    title: 好吃
    gloss: 好吃 / 美味
    note: 热情、日常的夸赞食物的说法——紧接在 obiad 之后用起来很自然。
    example_gloss: 这是一顿美味的午饭。
  pl.a1.unit12.lesson03.teach.jaki:
    title: 什么样的 / 哪个
    gloss: 什么样的 / 哪个
    note: 在询问电话号码和星期几时，你已经见过 jaki 了。这里用法相同，用来询问具体细节：哪部电影？
    example_gloss: 这是什么电影？
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: 单词简短提问
    gloss: 对话中可以只用一个词来简短提问，例如用 Pyszny? 代替完整的问句 Czy obiad był pyszny? ——听起来自然又快捷，就像日常交谈一样。
    note: 当语境已经说明一切时，真实的对话会省略完整的句子。*Pyszny?* 单独一个词就是“好吃吗？”的意思。
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: 马雷克问发生了什么
    gloss: 嗨，艾娃！昨天怎么样？
    note: 再次用到本单元最先学的问句，现在用来开启一段真实的对话。
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: 艾娃去了电影院
    gloss: 我去电影院了！我看了一部好电影。
    note: Byłam（阴性）和 zobaczyłam（阴性）都表明说话的是女性艾娃。
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: 马雷克问哪部电影
    gloss: 什么电影？
    note: 用 jaki 提出的简短而自然的追问。
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: 艾娃回答并反问
    gloss: 非常好！你呢？
    note: A ty?（你呢？）不需要任何新语法，就把话题交还给了马雷克。
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: 马雷克做了午饭
    gloss: 我做了午饭！
    note: Zrobiłem（阳性）表明说话的是马雷克，说的是他当天完成的一件事。
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: 艾娃问好不好吃
    gloss: 好吃吗？
    note: 一个词的问句，正是本课语法说明中的句型。
