teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: 什么样的、是、今天、不——再复习
    gloss: Jaka、jest、Dziś、nie——这些词你在前面的课里已经学过了。
    note: 在本课用它们谈论天气之前，先快速复习一下。
  pl.a1.unit19.lesson01.teach.pogoda:
    title: 天气
    gloss: 天气
    note: 表示天气或天气状况的通用词。
    example_gloss: 天气怎么样？
  pl.a1.unit19.lesson01.teach.zimno:
    title: 寒冷
    gloss: 冷的
    note: 描述气温——不随性别变化。
    example_gloss: 天气冷。
  pl.a1.unit19.lesson01.teach.goraco:
    title: 热
    gloss: 热
    note: 与 *zimno* 相反——同样不随性别变化。
    example_gloss: 天气热。
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: 天气冷，天气热
    gloss: Jest zimno. Jest gorąco.——波兰语就是这样描述天气的：*jest* 加上表示天气的词，不需要性别一致。
    note: 本单元所有表示天气的词都可以用这个简单的结构。
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: 天气怎么样？
    gloss: 天气怎么样？
    note: 询问当前天气的自然说法。
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: 今天很冷
    gloss: 今天很冷。
    note: 本单元谈论今天天气时所依托的基本句子。
  pl.a1.unit19.lesson02.teach.pada:
    title: 下雨
    gloss: 下雨
    note: 单独使用，没有主语——这是波兰语表达“下雨”的正常方式。
    example_gloss: 今天下雨。
  pl.a1.unit19.lesson02.teach.snieg:
    title: 雪
    gloss: 雪
    note: 表示“雪”的词——与 *pada* 搭配就是“下雪”。
    example_gloss: 下雪了。
  pl.a1.unit19.lesson02.teach.mgla:
    title: 雾
    gloss: 雾
    note: 另一种常见的天气状况。
    example_gloss: 有雾。
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: 好的
    gloss: Pogoda jest dobra.——*dobra* 与阴性名词搭配，例如 *pogoda*。
    note: 这是 *dobry* 的阴性形式（如 *Dzień dobry* 中的 dobry）——与 *chory/chora* 的 -y/-a 变化规律相同。
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: 糟糕的
    gloss: Jaka straszna pogoda!——*straszna* 也与 *pogoda* 搭配，和 *dobra* 一样。
    note: 语气很强的词——用于真正糟糕的天气。
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: 多么糟糕的天气！
    gloss: 多么糟糕的天气！
    note: 对恶劣天气的自然感叹。
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: 天气很好
    gloss: 天气很好。
    note: 再次用到本课前面学过的表示天气的词。
  pl.a1.unit19.lesson03.teach.recap_words:
    title: 是、和、我、也——再复习
    gloss: Tak、A、ja、też、chcę、iść、idę、do、parku、tam、bardzo——这些词你在前面的课里已经学过了。
    note: 在进入本课对话之前，先快速复习一下。
  pl.a1.unit19.lesson03.teach.bo:
    title: 因为
    gloss: 因为
    note: 把计划和背后的天气原因连接起来。
    example_gloss: 我不去公园，因为在下雨。
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: 我不想去，因为在下雨
    gloss: 我不想去公园，因为在下雨。
    note: 把天气描述与实际计划结合起来——正是本单元要达到的目标。
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: 在克拉科夫——再复习
    gloss: W Krakowie——你在前面的课里已经学过，例如 Ona mieszka w Krakowie（她住在克拉科夫）。
    note: 在本课对话比较两个地方的天气之前，先快速复习一下。
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: 马雷克询问天气
    gloss: 今天天气怎么样?
    note: 马雷克一开口就问今天的天气。
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: 埃娃回答
    gloss: 在下雨。很冷。
    note: 埃娃描述今天的实际天气。
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: 马雷克发表感想并做出计划
    gloss: 多么糟糕的天气！我不想去公园，因为在下雨。
    note: 马雷克对天气发表看法，并说出因此做出的打算。
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: 埃娃表示同意
    gloss: 我也不去公园。
    note: 埃娃和马雷克做了同样的决定。
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: 马雷克问起克拉科夫
    gloss: 那克拉科夫呢？那里天气怎么样？
    note: 马雷克把话题转到另一座城市的天气。
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: 埃娃回答
    gloss: 克拉科夫在下雪。那里非常冷。
    note: 埃娃描述克拉科夫另一种更冷的天气状况。
