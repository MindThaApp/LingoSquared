teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: 房子、是、有——再复习一下
    gloss: Dom, jest, ma, Marek, Ewa——这些词你在之前的课里已经学过，例如 'Dom jest tam'（房子在那边）。
    note: 本课要用这些词来谈论你的家，先快速复习一下。
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: 公寓
    gloss: 公寓
    note: 指一套单元房，而不是整栋房子。
    example_gloss: Ewa 有一套公寓。
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: 大
    gloss: 房子很大。——'*duży*' 与阳性名词搭配，例如 '*dom*'。
    note: 这是本课程中第一次出现表示大小的词——目前它只用于 '*dom*'。
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Marek 的家
    gloss: Marek 有一栋房子。房子很大。
    note: 本单元围绕 Marek 的这一情况展开。
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Ewa 的家
    gloss: Ewa 有一套公寓。
    note: 本单元围绕 Ewa 的这一情况展开。
  pl.a1.unit18.lesson01.teach.pokoj:
    title: 房间
    gloss: 房间
    note: 泛指家中任何一个房间的词。
    example_gloss: 房间在哪里？
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: 有几个房间？
    gloss: 你有几个房间？我有两个房间。——你在之前的课里已经学过 'Ile'、数字以及 'mam'/'masz'；'*pokoi*' 和 '*pokoje*' 是 '*pokój*' 的变化形式。
    note: '''*Pokoi*'' 用在 ''*Ile*'' 之后；''*pokoje*'' 用在 ''*dwa*''、''*trzy*'' 或 ''*cztery*''（二、三、四）之后。'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: 你有几个房间？
    gloss: 你有几个房间？
    note: 询问别人家的情况时很自然的问句。
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: 我有两个房间
    gloss: 我有两个房间。
    note: 对上面这个问题很自然的回答。
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: 厨房
    gloss: 厨房
    note: 家中最常见的房间之一。
    example_gloss: 厨房很小。
  pl.a1.unit18.lesson02.teach.mala_note:
    title: 小
    gloss: 厨房很小。——'*mała*' 与阴性名词搭配，例如 '*kuchnia*'。
    note: 这是一个有别于 '*duży*'（大）的词——目前它只用于 '*kuchnia*'。
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: 卧室
    gloss: 卧室
    note: 睡觉的房间。
    example_gloss: 卧室在哪里？
  pl.a1.unit18.lesson02.teach.lazienka:
    title: 浴室
    gloss: 浴室
    note: 有淋浴和马桶的房间。
    example_gloss: 浴室在哪里？
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: 哪里、那里——再复习一下
    gloss: Gdzie, tam——这些词你在之前的课里已经学过，例如 'Bank jest tam'（银行在那边）。
    note: 本课要用这些词来谈论房间，先快速复习一下。
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: 在房间里、在厨房里……
    gloss: W + 房间、厨房、卧室、浴室：w pokoju, w kuchni, w sypialni, w łazience——和 w szkole（在学校）、w biurze（在办公室）的规律相同。
    note: 和你学过的工作场所词汇是同一个道理——词尾稍有变化，表示“在”那个房间里。
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: 浴室在哪里？
    gloss: 浴室在哪里？浴室在那边。
    note: 在别人家里找房间时很自然的一问一答。
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: 厨房很小
    gloss: 厨房很小。
    note: 再次用到本课前面学过的表示大小的词。
  pl.a1.unit18.lesson03.teach.recap_words:
    title: 是的、和、是（复数）——再复习一下
    gloss: Tak, i, są, A, ja, jeden——这些词你在之前的课里已经学过。
    note: 进入本课对话之前，先快速复习一下。
  pl.a1.unit18.lesson03.teach.lodowka:
    title: 冰箱
    gloss: 冰箱
    note: 常见的厨房电器。
    example_gloss: 厨房里有一台冰箱。
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: 烤箱
    gloss: 烤箱
    note: 另一种常见的厨房电器。
    example_gloss: 厨房里有一台烤箱。
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek 介绍他的房子
    gloss: 我有一栋房子。房子很大。
    note: Marek 通过介绍自己的家来开启对话。
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa 问房间数量
    gloss: 你有几个房间？
    note: Ewa 自然地接着问了一个问题。
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek 的回答
    gloss: 我有两个房间。房子里有厨房、卧室和浴室。
    note: Marek 说出房间数量，并列出家里的房间。
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa 介绍她的家
    gloss: 我呢，我有一套公寓。我有一个房间。
    note: Ewa 转而介绍自己较小的家。
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa 问厨房的情况
    gloss: 厨房很小吗？
    note: Ewa 接着问 Marek 他的厨房的情况。
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek 的回答
    gloss: 是的，厨房很小。厨房里有冰箱和烤箱。
    note: Marek 确认了厨房的大小，并说出里面的两样东西。
