teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: 年轻
    gloss: 年轻的
    note: 基础描述性形容词，是本单元学习比较级的起点。
    example_gloss: Marek 很年轻。
  pl.a1.unit14.lesson01.teach.stary:
    title: 年老
    gloss: 年老的
    note: młody 的反义词，本单元也会把它变成比较级。
    example_gloss: 爷爷年纪大了。
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 构成比较级：加 -szy
    gloss: 对于 stary 和 młody 这类短形容词，把词尾 -y 改成 -szy：stary 变成 starszy，młody 变成 młodszy。并不是所有形容词都这样变化。
    note: 这两个词的规则很简单：去掉词尾的 *-y*，加上 *-szy*，就得到比较级。许多其他形容词用的是不同的词尾，所以不要到处套用。
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: 更年长
    gloss: 年纪更大的
    note: Starszy 用于男性（或 on）；starsza 用于女性（或 ona），是 stary 的比较级。
    example_gloss:
    - 爷爷比爸爸年纪大。
    - 奶奶比妈妈年纪大。
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: 更年轻
    gloss: 年纪更小的
    note: Młodszy 用于男性，młodsza 用于女性，是 młody 的比较级。
    example_gloss:
    - 爸爸比爷爷年轻。
    - 妈妈比奶奶年轻。
  pl.a1.unit14.lesson01.teach.niz:
    title: 比
    gloss: 比
    note: Niż 连接被比较的两个对象，niż 后面的词保持原本的基本形式。
    example_gloss: 儿子比父亲年轻。
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: 比较级要与性别一致
    gloss: Starszy/starsza 和 młodszy/młodsza 会随性别变化，就像 byłem/byłam 一样。Starszy、młodszy 用于男性（on）；starsza、młodsza 用于女性（ona）。
    note: 和 *byłem*/*byłam* 的规律相同：词尾会根据说的是男性还是女性而变化。
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa 比 Marek 年纪大
    gloss: Ewa 比 Marek 年纪大。
    note: 这是两位人物的真实情况：Ewa 32 岁，Marek 28 岁。
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek 比 Ewa 年轻
    gloss: Marek 比 Ewa 年轻。
    note: 同一个事实，换个方向来说。
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: 再说“好”
    gloss: Dobry（好）——你在 Dzień dobry 中已经学过这个词。
    note: 这是你从第一单元起就见过的形容词，现在用来构成比较级。
  pl.a1.unit14.lesson02.teach.zly:
    title: 坏
    gloss: 坏的
    note: dobry 的反义词，是本单元的新词。
    example_gloss: 这是糟糕的一天。
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry 和 zły 是不规则的
    gloss: Dobry 和 zły 是不规则的：dobry 变成 lepszy，zły 变成 gorszy，不是加 -szy。
    note: 和 *stary*/*młody* 不同，这两个词不遵循规则的 *-szy* 变化，它们的比较级需要单独记忆。
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: 更好
    gloss: 更好
    note: Lepszy 用于男性，lepsza 用于女性（或 kawa 这样的阴性词），是 dobry 的不规则比较级。
    example_gloss:
    - 他比我好。
    - 咖啡比茶好。
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: 更差
    gloss: 更差的
    note: Gorszy/gorsza 是 zły 的不规则比较级。
    example_gloss:
    - 他比我差。
    - 茶比咖啡差。
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: 再说咖啡和茶
    gloss: Kawa 和 herbata——你在之前关于饮品的课里已经学过这些词。
    note: 在本课用它们做比较之前，先快速复习一下。
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: 与之前规律相同
    gloss: Lepszy/lepsza 和 gorszy/gorsza 随性别变化的方式，与上一课的 starszy/starsza 相同。
    note: 同样的阳性／阴性区分，用在一对新词上。
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: 我、我是、你
    gloss: Ja、jestem、ty——你在之前的课里已经学过这些词。
    note: 在进入本课对话之前，先快速复习一下。
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: 是、不、好的
    gloss: Tak、nie 和 dobrze——这些你也已经熟悉了。
    note: 对话之前再快速复习一下。
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: 再说“但是”
    gloss: Ale（但是）——你在之前的课里已经学过这个词。它连接两个意思相对的句子。
    note: 一个表示转折的简短连接词，和汉语的“但是”用法相近。
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek 说茶更好
    gloss: 茶比咖啡好！
    note: Marek 一开口就表达自己的看法，和他在喜好那一课里说的一致。
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa 不同意
    gloss: 不，不！咖啡比茶好！
    note: Ewa 反驳并说出自己的看法，也和她之前说的一致。
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek 把话题转到年龄上
    gloss: 好吧，好吧。但是我比你年轻！
    note: Marek 不再争论饮品，转而提起自己有把握的事。
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa 同意，并重申自己的看法
    gloss: 是的，我年纪大。但是咖啡更好！
    note: Ewa 确认了年龄的事实，然后回到她对咖啡的看法。
