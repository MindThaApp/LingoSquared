    registers -- flagged in lesson02; (2) Polish REQUIRES a comma before
    że/chociaż/bo/ponieważ -- English speakers often drop it; every
    accepted_answers variant below keeps the comma since it is not
    optional in Polish, unlike the period-vs-comma stylistic choice English
    allows; (3) case government is the main interference risk throughout
    -- z badań (genitive), nad wadami / za kolegami (instrumental), o
    spotkaniu-style complements -- glossed explicitly wherever it appears;
    (4) English lets you run an argument together, whereas the taught
    signposts (po pierwsze, z drugiej strony, mimo to) must actually
    appear -- the culminating lesson06 prompts name the required signposts
    so a correct answer is well-determined. No sibling-direction file
    (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
