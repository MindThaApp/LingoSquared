course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (po pierwsze, na
    przykład, z badań wynika, że), acknowledge the strongest opposing
    point (z jednej strony ... z drugiej strony, chociaż, oczywiście), and
    rebut it without conceding (mimo to, natomiast, to nie zmienia faktu,
    że, podsumowując), around the everyday debate of remote work.

units:
  pl.b2.unit01.argumentacja:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  pl.b2.unit01.lesson01.zajecie_stanowiska:
    title: "Taking a position"
  pl.b2.unit01.lesson02.argumenty_i_dowody:
    title: "Giving reasons and evidence"
  pl.b2.unit01.lesson03.druga_strona:
    title: "Acknowledging the other side"
  pl.b2.unit01.lesson04.kontrargument:
    title: "Rebutting"
  pl.b2.unit01.lesson05.czytanie_argumentu:
    title: "Reading an argument"
  pl.b2.unit01.lesson06.obrona_stanowiska:
    title: "Defending a position"

teaching:
  pl.b2.unit01.lesson01.teach.praca_zdalna:
    title: "remote work"
    gloss: "remote work / working remotely"
    note: "*Praca zdalna* is the everyday term for remote work. *Zdalna* is the feminine adjective agreeing with *praca* (feminine noun). It is the topic this whole unit argues about."
    example_gloss: "Remote work saves time."
  pl.b2.unit01.lesson01.teach.praca_w_biurze:
    title: "office work"
    gloss: "office work / working at the office"
    note: "The opposite pole of the debate. *W biurze* is the locative case of *biuro* ('office'), used after *w* ('in/at')."
  pl.b2.unit01.lesson01.teach.stanowisko:
    title: "a position / viewpoint"
    gloss: "a position / a point of view"
    note: "*Zająć stanowisko* means 'to take a position' -- the claim you are going to defend. This is the thing an argument is built around."
    example_gloss: "I have a clear position."
  pl.b2.unit01.lesson01.teach.uwazam_ze:
    title: "I think that..."
    gloss: "I think that... / I believe that..."
    note: "*Uważam, że...* introduces your own opinion. Polish always requires a comma before *że* -- unlike English, this comma is never optional."
  pl.b2.unit01.lesson01.teach.moim_zdaniem:
    title: "In my opinion..."
    gloss: "In my opinion... / To my mind..."
    note: "*Moim zdaniem* ('in-my opinion', instrumental) is a softer, very common way to open an opinion. No comma is needed after it, since no subordinate clause follows."
  pl.b2.unit01.lesson01.teach.lepsza:
    title: better
    gloss: "better (feminine form, agreeing with praca)"
    note: "*Lepszy* is the dictionary form; *lepsza* is how it appears here because it agrees with the feminine noun *praca*."
    example_gloss: "This approach is better."
  pl.b2.unit01.lesson01.teach.niz:
    title: than
    gloss: than
    note: "*Niż* is 'than' in a comparison: *lepsza niż* = 'better than'."
    example_gloss: "Remote work is better than the commute."
  pl.b2.unit01.lesson01.teach.claim_model:
    title: "Remote work is better than office work."
    gloss: "Remote work is better than office work."
    note: "The model claim for this unit -- notice *lepsza* agrees with feminine *praca*, and *niż* introduces the comparison."
  pl.b2.unit01.lesson01.teach.zgadzam_sie_z_tym:
    title: "I agree with that."
    gloss: "I agree with that."
    note: "*Zgodzić się z czymś* = 'to agree with something', governing the instrumental case: *z tym* ('with that'). The opposite is *nie zgadzam się z tym* (I disagree with that)."
  pl.b2.unit01.lesson01.teach.grammar_stanowisko:
    title: "I think that remote work is better than office work. I agree with that."
    gloss: "I think that remote work is better than office work. I agree with that."
    note: "A claim is the position you will defend. *Uważam, że...* and *Moim zdaniem...* both signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  pl.b2.unit01.lesson02.teach.poniewaz:
    title: because
    gloss: "because (neutral, subordinating)"
    note: "*Ponieważ* gives a reason in a fuller, more neutral register than *bo*. A comma always precedes it: *..., ponieważ jest spokojnie*."
    example_gloss: "I work from home, because it is quiet."
  pl.b2.unit01.lesson02.teach.bo:
    title: "because / for"
    gloss: "because / for (informal, everyday)"
    note: "*Bo* also means 'because', but is the everyday spoken choice. A comma still precedes it in Polish: *..., bo tak jest wygodniej*. English 'because' hides this register split that Polish makes."
    example_gloss: "I stay home, because it's more convenient that way."
  pl.b2.unit01.lesson02.teach.po_pierwsze_drugie:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*Po pierwsze... po drugie...* number your reasons so an argument is easy to follow -- the classic way to signpost support. A comma follows each."
  pl.b2.unit01.lesson02.teach.poza_tym:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*Poza tym* adds a further reason. It usually opens the sentence and, unlike *po pierwsze*, is normally not followed by a comma: *Poza tym w domu pracuje się wydajniej*."
    example_gloss: "In addition, you save money."
  pl.b2.unit01.lesson02.teach.na_przyklad:
    title: "for example"
    gloss: "for example"
    note: "*Na przykład* introduces a concrete example that backs up a reason."
  pl.b2.unit01.lesson02.teach.z_badan_wynika:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*Z badań wynika, że...* is how you cite evidence in an argument. *Badań* is the genitive plural of *badanie* ('a study'), required after *z* ('from')."
  pl.b2.unit01.lesson02.teach.czas_dojazdu:
    title: "commute time"
    gloss: "commute time / travel time"
    note: "*Czas dojazdu* ('time of-commute') pairs the noun *czas* with *dojazdu*, the genitive of *dojazd* ('commute') -- Polish's normal way to build a compound like English's 'commute time'."
    example_gloss: "You save commute time."
  pl.b2.unit01.lesson02.teach.oszczedzac:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Oszczędzać* = to save. Everyday form used here: *oszczędzasz* (you save)."
    example_gloss: "You save a lot of time."
  pl.b2.unit01.lesson02.teach.duzo:
    title: "a lot / much"
    gloss: "a lot / much"
    note: "*Dużo* governs the genitive case of the noun that follows: *dużo czasu* ('a lot of time'), *czasu* being the genitive of *czas*."
    example_gloss: "You save a lot of time."
  pl.b2.unit01.lesson02.teach.wydajniej:
    title: "more efficiently / more productively"
    gloss: "more efficiently / more productively"
    note: "*Wydajniej* is a comparative ADVERB, used here with the impersonal *się* construction *pracuje się wydajniej* ('one works more efficiently') -- this avoids needing to match an adjective's gender to a specific person, the natural Polish way to state a general point in an argument."
    example_gloss: "At home, one works more efficiently."
  pl.b2.unit01.lesson02.teach.w_domu:
    title: "at home"
    gloss: "at home"
    note: "*W domu* is the locative case of *dom* ('home'), used after *w* ('in/at')."
  pl.b2.unit01.lesson02.teach.grammar_argumenty:
    title: "Firstly, you save commute time. In addition, one works more efficiently at home."
    gloss: "Firstly, you save commute time. In addition, one works more efficiently at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*po pierwsze*, *poza tym*), give examples (*na przykład*), and cite evidence (*z badań wynika, że*) so the argument is easy to follow."

  pl.b2.unit01.lesson03.teach.z_jednej_strony:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Z jednej strony...* opens a balanced view; it is almost always paired with *z drugiej strony...* to introduce the opposing point you are about to acknowledge."
  pl.b2.unit01.lesson03.teach.z_drugiej_strony:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Z drugiej strony...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  pl.b2.unit01.lesson03.teach.chociaz:
    title: although
    gloss: although
    note: "*Chociaż* concedes a point. A comma always separates the *chociaż* clause from the main clause: *Chociaż to wygodne, czasami tęsknię...*. It sets up a contrast the main clause will answer."
    example_gloss: "Although it is convenient, I sometimes miss my colleagues."
  pl.b2.unit01.lesson03.teach.oczywiscie:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Oczywiście* concedes that the opposing point is fair ('of course you miss...') -- a polite way to acknowledge before you push back."
    example_gloss: "Of course you are right."
  pl.b2.unit01.lesson03.teach.to_prawda:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*To prawda* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  pl.b2.unit01.lesson03.teach.niektorzy_uwazaja:
    title: "some people think that..."
    gloss: "some people think that..."
    note: "*Niektórzy uważają, że...* introduces a common objection without owning it yourself -- 'some people think that...' -- so you can then answer it."
  pl.b2.unit01.lesson03.teach.koledzy_z_pracy:
    title: colleagues
    gloss: "colleagues (from work)"
    note: "*Koledzy* is the masculine-personal plural of *kolega*. *Z pracy* ('from work') uses the genitive of *praca* -- 'colleagues from work'."
    example_gloss: "I have good colleagues from work."
  pl.b2.unit01.lesson03.teach.tesknic:
    title: "to miss"
    gloss: "to miss (someone)"
    note: "*Tęsknić za kimś* = 'to miss someone', governing the instrumental case: *za kolegami* ('for [my] colleagues'). Forms used here: *tęsknię* (I miss), *tęsknisz* (you miss)."
    example_gloss: "I miss my colleagues."
  pl.b2.unit01.lesson03.teach.czasami:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work at the office."
  pl.b2.unit01.lesson03.teach.przyjemna:
    title: "nice / pleasant"
    gloss: "nice / pleasant (feminine form, agreeing with praca)"
    example_gloss: "Remote work is pleasant."
  pl.b2.unit01.lesson03.teach.grammar_druga_strona:
    title: "On the one hand the work is pleasant, on the other hand you sometimes miss your colleagues from work."
    gloss: "On the one hand the work is pleasant, on the other hand you sometimes miss your colleagues from work."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Z jednej strony... z drugiej strony...*, *chociaż*, *oczywiście*, and *to prawda* all do this without giving up your own position."

  pl.b2.unit01.lesson04.teach.mimo_to:
    title: "nevertheless / still"
    gloss: "nevertheless / still / in spite of that"
    note: "*Mimo to* answers a concession: you grant the objection, then *mimo to...* ('still, ...') reasserts your claim. It is the core rebuttal word of this unit."
    example_gloss: "It is hard, nevertheless I keep working."
  pl.b2.unit01.lesson04.teach.jednak:
    title: however
    gloss: "however / yet"
    note: "*Jednak* pivots from the acknowledged point back to your claim. Slightly more formal than *ale*."
    example_gloss: "Remote work is convenient. However, it can be lonely."
  pl.b2.unit01.lesson04.teach.ale:
    title: but
    gloss: but
    note: "*Ale* is the everyday contrast word."
    example_gloss: "It's convenient, but not perfect."
  pl.b2.unit01.lesson04.teach.natomiast:
    title: "whereas / by contrast"
    gloss: "whereas / by contrast / on the other hand"
    note: "*Natomiast* sets one thing directly against another: 'at the office it's noisy; at home, by contrast, it's quiet'. Stronger and more formal than *ale*."
    example_gloss: "At the office it's noisy; at home, by contrast, it's quiet."
  pl.b2.unit01.lesson04.teach.nie_zmienia_faktu:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*To nie zmienia faktu, że...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. *Faktu* is the genitive of *fakt*, required after *nie zmienia* (negated verbs govern the genitive in Polish)."
  pl.b2.unit01.lesson04.teach.podsumowujac:
    title: "in short"
    gloss: "in short / to sum up"
    note: "*Podsumowując* signposts your conclusion -- it wraps the argument up: 'in short, ...'."
    example_gloss: "In short, remote work is better."
  pl.b2.unit01.lesson04.teach.zalety:
    title: advantages
    gloss: "advantages (plural of zaleta)"
    example_gloss: "Remote work has many advantages."
  pl.b2.unit01.lesson04.teach.wady:
    title: disadvantages
    gloss: "disadvantages (plural of wada)"
    example_gloss: "Remote work also has disadvantages."
  pl.b2.unit01.lesson04.teach.przewazac:
    title: "to outweigh / prevail"
    gloss: "to outweigh / to prevail (carry more weight)"
    note: "*Przeważać nad czymś* = 'to outweigh something', governing the instrumental case: *nad wadami* ('over the disadvantages'). Singular subject form: *przeważa*."
    example_gloss: "The advantages outweigh the disadvantages."
  pl.b2.unit01.lesson04.teach.ma_zalety:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Ma* = 'has' (from *mieć*). *Praca w biurze ma zalety* concedes the other side has advantages -- before you rebut."
  pl.b2.unit01.lesson04.teach.wolnosc:
    title: freedom
    gloss: freedom
    example_gloss: "Remote work gives a lot of freedom."
  pl.b2.unit01.lesson04.teach.grammar_kontrargument:
    title: "That's true, but that does not change the fact that the advantages outweigh the disadvantages. In short, remote work is better."
    gloss: "That's true, but that does not change the fact that the advantages outweigh the disadvantages. In short, remote work is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Mimo to*, *jednak*, *ale*, *natomiast*, and *to nie zmienia faktu, że...* all pivot back to your position; *podsumowując* signposts the conclusion."

  pl.b2.unit01.lesson05.teach.tekst:
    title: "Reading: remote work is a good direction"
    gloss: "More and more people work remotely. I am convinced that this is a good direction. Firstly, you save commute time, and research shows that people who work from home are usually more productive. Of course, some say that at home you lack contact with your colleagues from work. That's true, but that does not change the fact that you can still call or make a video call. In short, the advantages outweigh the disadvantages."
    glosses:
      Coraz: "increasingly (coraz więcej = more and more)"
      więcej: more
      osób: "people (genitive plural of osoba)"
      jestem: "I am"
      przekonany: "convinced (masculine)"
      dobry: good
      kierunek: direction
      a: "and / while (light contrast)"
      osoby: "people (nominative plural)"
      pracujące: "working (present participle, agreeing with osoby)"
      zwykle: usually
      bardziej: more
      wydajne: "productive (agreeing with osoby)"
      mówią: "say (they say)"
      brakuje: "is lacking (brakuje im = they lack)"
      im: "them (dative)"
      kontaktu: "contact (genitive, governed by brakuje)"
      nadal: still
      można: "one can / it is possible"
      zadzwonić: "to call (on the phone)"
      lub: or
      zrobić: "to do / make"
      wideorozmowę: "a video call (accusative)"

  pl.b2.unit01.lesson06.teach.dlaczego_tak_uwazasz:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Dlaczego tak uważasz?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  pl.b2.unit01.lesson06.teach.cos_w_tym_jest:
    title: "There's something to that."
    gloss: "There's something to that. / You have a point."
    note: "*Coś w tym jest* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  pl.b2.unit01.lesson06.teach.dialogue_marek_claim:
    title: "Marek: I think that remote work is better than office work."
    gloss: "Marek: I think that remote work is better than office work."
  pl.b2.unit01.lesson06.teach.dialogue_ewa_why:
    title: "Ewa: Why do you think that?"
    gloss: "Ewa: Why do you think that?"
  pl.b2.unit01.lesson06.teach.dialogue_marek_support:
    title: "Marek: Firstly, you save commute time, and research shows that one works more efficiently at home."
    gloss: "Marek: Firstly, you save commute time, and research shows that one works more efficiently at home."
  pl.b2.unit01.lesson06.teach.dialogue_ewa_objection:
    title: "Ewa: On the other hand, you miss your colleagues from work."
    gloss: "Ewa: On the other hand, you miss your colleagues from work."
  pl.b2.unit01.lesson06.teach.dialogue_marek_rebuttal:
    title: "Marek: That's true, but that does not change the fact that you can call. In short, the advantages outweigh the disadvantages."
    gloss: "Marek: That's true, but that does not change the fact that you can call. In short, the advantages outweigh the disadvantages."
  pl.b2.unit01.lesson06.teach.dialogue_ewa_concede:
    title: "Ewa: There's something to that."
    gloss: "Ewa: There's something to that."
  pl.b2.unit01.lesson06.teach.grammar_pelny_argument:
    title: "I think that remote work is better than office work. Firstly, you save commute time. On the other hand, you miss your colleagues from work. Still, the advantages outweigh the disadvantages."
    gloss: "I think that remote work is better than office work. Firstly, you save commute time. On the other hand, you miss your colleagues from work. Still, the advantages outweigh the disadvantages."
    note: "A complete argument has four moves: claim (*uważam, że...*), support (*po pierwsze...*), acknowledged objection (*z drugiej strony...*), and rebuttal (*mimo to...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  pl.b2.unit01.lesson01.exercise01.recognize_stanowisko:
    instruction: "What does this word mean?"
    correct_option: "a position / viewpoint"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "a position / viewpoint", status: correct}]
    feedback: "Stanowisko is a position or point of view -- the claim you defend."
  pl.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "Remote work is better than office work."
    distractors: ["Office work is better than remote work.", "Remote work is nicer than commuting.", "I know that remote work is better than office work."]
    accepted_answers: [{value: "Remote work is better than office work.", status: correct}]
    feedback: "Praca zdalna jest lepsza niż praca w biurze means remote work is better than office work."
  pl.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"praca zdalna": "remote work", "praca w biurze": "office work", stanowisko: "a position / viewpoint", "Uważam, że...": "I think that...", "Moim zdaniem...": "In my opinion...", lepsza: better, niż: than, "Zgadzam się z tym.": "I agree with that."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  pl.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: Remote work is better than office work."
    accepted_answers:
      - {value: "Praca zdalna jest lepsza niż praca w biurze", status: correct}
    feedback: "Praca zdalna jest lepsza niż praca w biurze means remote work is better than office work."
  pl.b2.unit01.lesson01.exercise05.translate_moim_zdaniem:
    instruction: "Translate into Polish, opening with Moim zdaniem: In my opinion, remote work is better."
    accepted_answers:
      - {value: "Moim zdaniem praca zdalna jest lepsza", status: correct}
    feedback: "Moim zdaniem praca zdalna jest lepsza means in my opinion, remote work is better."
  pl.b2.unit01.lesson01.exercise06.speak_zgadzam_sie:
    instruction: "Say aloud in Polish: I agree with that."
    accepted_answers:
      - {value: "Zgadzam się z tym", status: correct}
    feedback: "Zgadzam się z tym means I agree with that."
  pl.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Polish, using Uważam, że: I think that remote work is better than office work."
