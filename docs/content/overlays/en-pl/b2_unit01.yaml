    wydajniej w domu'; (5) lesson02.exercise07 -- added variant '...
    Poza tym pracuje sie wydajniej w domu'; (6) lesson04.exercise06 --
    unnatural English 'the freedom outweighs it' -> 'freedom outweighs
    it'; (7) lesson05.exercise06 -- added missing 'Jestem
    przekonany/przekonana, ze to jest dobry kierunek' (English 'it is'
    invites jest); (8) lesson04.exercise02 -- distractor 'So the
    advantages outweigh the disadvantages.' was a second correct
    rendering of 'Podsumowujac' -> 'In short, there are no
    disadvantages.' NATIVE CHECK: matching lesson04 lefts jednak
    (however) / mimo to (nevertheless) / ale (but) are near-synonyms in
    English -- confirm the glosses discriminate enough; podsumowujac
