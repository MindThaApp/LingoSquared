  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Listen to the dialogue and choose what movie Nina wants to see.
    correct_option: The new movie.
    distractors:
    - The children's showing.
    - Any movie is fine.
    - She doesn't say.
    accepted_answers:
    - value: The new movie.
      status: correct
    feedback: Nina wants *nowy film*. The adjective *nowy* agrees with masculine *film*; as an inanimate object it stays the same in the accusative.
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Listen to the dialogue and choose what Iga asks Nina about next.
    correct_option: What time she wants the showing.
    distractors:
    - Whether she wants popcorn.
    - Whether she wants a receipt.
    - She doesn't ask anything.
    accepted_answers:
    - value: What time she wants the showing.
      status: correct
    feedback: Iga asks *a na którą godzinę?* *Na* plus the accusative is used for the time a showing is booked for, and *którą* agrees with feminine *godzina*.
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Listen to the dialogue and choose what time Nina wants the showing.
    correct_option: Eight o'clock.
    distractors:
    - Seven o'clock.
    - Six o'clock.
    - The dialogue doesn't say.
    accepted_answers:
    - value: Eight o'clock.
      status: correct
    feedback: Nina says *na ósmą* ('for eight'). The ordinal *ósma* agrees with feminine *godzina* and takes the accusative after *na*.
