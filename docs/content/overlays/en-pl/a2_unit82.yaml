  pl.a2.unit82.lesson06.exercise04.ordena_marek: {"instruction": "Put the words in order to say 'Why were you not at work yesterday? (to a woman)'", "correct_option": "Dlaczego nie byłaś wczoraj w pracy", "accepted_answers": [{"value": "Dlaczego nie byłaś wczoraj w pracy", "status": "correct"}], "feedback": "A question to a woman: *byłaś*."}
  pl.a2.unit82.lesson06.exercise05.responde_chora: {"instruction": "Answer in Polish: say that you were ill (you are Ewa).", "correct_option": "Bo byłam chora.", "accepted_answers": [{"value": "Bo byłam chora.", "status": "correct"}, {"value": "Bo byłam chora", "status": "correct"}, {"value": "Ponieważ byłam chora.", "status": "correct"}, {"value": "Ponieważ byłam chora", "status": "correct"}, {"value": "Byłam chora.", "status": "correct"}, {"value": "Byłam chora", "status": "correct"}], "feedback": "*Bo byłam chora.*"}
  pl.a2.unit82.lesson06.exercise06.traduce_dialogo: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Miałam gorączkę, więc zostałam w domu.", "status": "correct"}, {"value": "Miałam gorączkę, więc zostałam w domu", "status": "correct"}, {"value": "Miałam gorączkę, dlatego zostałam w domu.", "status": "correct"}, {"value": "Miałam gorączkę, dlatego zostałam w domu", "status": "correct"}], "feedback": "Reason, then *więc* or *dlatego*, then the result."}
  pl.a2.unit82.lesson06.exercise07.escribe_dialogo: {"instruction": "Write one Polish sentence.", "correct_option": "Spóźniłem się, bo był korek.", "accepted_answers": [{"value": "Spóźniłem się, bo był korek.", "status": "correct"}, {"value": "Spóźniłem się, bo był korek", "status": "correct"}, {"value": "Spóźniłem się, ponieważ był korek.", "status": "correct"}, {"value": "Spóźniłem się, ponieważ był korek", "status": "correct"}], "feedback": "*Spóźniłem się, bo był korek.*"}
