  pl.a2.unit82.lesson06.exercise01.escucha_apertura: {"instruction": "Listen and select the line you hear.", "correct_option": "Cześć, Ewo. Dlaczego nie byłaś wczoraj w pracy?", "distractors": ["Cześć, Ewo. Dlaczego nie byłaś dzisiaj w pracy?", "Cześć, Ewo. Dlaczego nie jesteś wczoraj w pracy?", "Cześć, Ewo. Dlaczego nie byłeś wczoraj w pracy?"], "accepted_answers": [{"value": "Cześć, Ewo. Dlaczego nie byłaś wczoraj w pracy?", "status": "correct"}], "feedback": "Marek opens with *Dlaczego nie byłaś wczoraj w pracy?*"}
  pl.a2.unit82.lesson06.exercise02.entiende_marek: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "There was a traffic jam.", "distractors": ["He was ill.", "The bus did not come.", "He was sleeping."], "accepted_answers": [{"value": "There was a traffic jam.", "status": "correct"}], "feedback": "Marek says: *Spóźniłem się, bo był korek.*"}
