answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on connecting ideas."
  learning_goal: "Connect ideas in Polish with reasons, sequence, purpose, conditions, indirect questions and reported messages."
units:
  pl.a2.unit82.dlaczego_bo: {"title": "Because I Am Tired", "description": "Give a reason with bo and ponieważ, and name the result with więc and dlatego, in the present and the past."}
lessons:
  pl.a2.unit82.lesson01.bo_i_poniewaz: {"title": "Because It Is Cold"}
  pl.a2.unit82.lesson02.wiec_i_dlatego: {"title": "So and That Is Why"}
  pl.a2.unit82.lesson03.wczoraj: {"title": "Yesterday"}
  pl.a2.unit82.lesson04.dlaczego: {"title": "Why?"}
  pl.a2.unit82.lesson05.ewa_wyjasnia: {"title": "Ewa Explains"}
  pl.a2.unit82.lesson06.rozmowa: {"title": "Ewa and Marek Talk"}
teaching:
  pl.a2.unit82.lesson01.teach.powody: {"title": "Reasons", "gloss": "I am ill (man) / I am tired (woman) / it is raining / it is cold / I have a fever", "note": "Short facts you can use as reasons. *Chory* is a man's form; a woman says *chora*.", "example_gloss": ["Marek is ill.", "Ewa is tired.", "It is raining today.", "It is cold today.", "I have a fever."]}
  pl.a2.unit82.lesson01.teach.zostac: {"title": "Staying in", "gloss": "I stay at home / I am not going to work / I am not going to the cinema / I am not doing the shopping", "note": "These are results that need a reason.", "example_gloss": ["I am staying at home.", "Marek is not going to work.", "Ewa is not going to the cinema.", "I am not doing the shopping today."]}
  pl.a2.unit82.lesson01.teach.gn_bo: {"title": "Bo gives the reason", "gloss": "I am staying at home because it is raining. Ewa is not going to the cinema because she is tired. Marek is not going to work because he is ill.", "note": "Say the result first, then a comma and *bo* with the reason. *Bo* is the everyday word for 'because'."}
  pl.a2.unit82.lesson01.teach.gn_poniewaz: {"title": "Ponieważ is more formal", "gloss": "I am not going to work because I have a fever. I am staying at home because it is cold.", "note": "*Ponieważ* works in the same place as *bo*. It sounds a little more formal, so you hear it more in writing and at work."}
  pl.a2.unit82.lesson01.teach.pytanie: {"title": "Why? Because...", "gloss": "Why are you not going to work? Because I am ill. Why are you staying at home? Because it is raining.", "note": "*Dlaczego* asks for the reason; the answer often starts with *bo*."}
  pl.a2.unit82.lesson02.teach.problemy: {"title": "Problems", "gloss": "I have no time / I have no money / my head hurts / my throat hurts", "note": "After *nie mam* the noun is in the genitive: *czasu*, *pieniędzy*. *Boli mnie* means 'it hurts me'.", "example_gloss": ["I have no time.", "I have no money.", "My head hurts.", "My throat hurts."]}
  pl.a2.unit82.lesson02.teach.wynik: {"title": "Words for the result", "gloss": "so / that is why", "note": "Both words begin the part of the sentence that says what follows from the reason.", "example_gloss": ["It is raining, so I am staying at home.", "I have a fever, that is why I am not going to work.", "I have no time, so I am not going to the cinema."]}
  pl.a2.unit82.lesson02.teach.gn_wiec: {"title": "Więc: reason first, then the result", "gloss": "I have no time, so I am not going to the cinema. I have a fever, so I am staying at home.", "note": "*Więc* means 'so'. The reason comes first, then a comma and *więc* with the result."}
  pl.a2.unit82.lesson02.teach.gn_dlatego: {"title": "Dlatego: that is why", "gloss": "It is raining, that is why I am staying at home. My throat hurts, that is why I am not going to work.", "note": "*Dlatego* works like *więc* but sounds a little stronger: 'for that reason'."}
  pl.a2.unit82.lesson02.teach.gn_kontrast: {"title": "Same fact, two orders", "gloss": "I am staying at home because it is raining. It is raining, so I am staying at home.", "note": "With *bo* the result comes first. With *więc* or *dlatego* the reason comes first."}
  pl.a2.unit82.lesson03.teach.wczoraj: {"title": "Yesterday", "gloss": "yesterday / to be late / there was a traffic jam / the bus did not come / I was ill (woman)", "note": "Past reasons use the past tense, so a woman says *byłam chora* and a man says *byłem chory*.", "example_gloss": ["Yesterday there was a traffic jam.", "The bus did not come.", "Yesterday I was ill (woman).", "Marek was late."]}
  pl.a2.unit82.lesson03.teach.gn_spoznilem: {"title": "Spóźnić się in the past", "gloss": "I was late because there was a traffic jam (man). I was late because the bus did not come (woman).", "note": "A man says *spóźniłem się*, a woman says *spóźniłam się*. The word *się* stays."}
  pl.a2.unit82.lesson03.teach.gn_przyszlam: {"title": "Past tense with a reason", "gloss": "I did not come to work because I was ill (woman). I did not come to work because I was ill (man).", "note": "In the past both parts of the sentence are in the past tense, and the ending shows the gender of the speaker: *-łam* or *-łem*."}
  pl.a2.unit82.lesson03.teach.gn_wiec_past: {"title": "Więc and dlatego in the past", "gloss": "Yesterday I was ill, so I stayed at home (man). Yesterday it was raining, that is why I stayed at home (woman).", "note": "The past tense does not change *więc* or *dlatego*. Only the verbs change."}
  pl.a2.unit82.lesson04.teach.powodu: {"title": "Because of", "gloss": "because of the traffic jam / because of the rain / because of a breakdown", "note": "*Z powodu* is followed by a noun in the genitive: *korek* becomes *korku*, *deszcz* becomes *deszczu*. You only need to recognise it now.", "example_gloss": ["I was late because of the traffic jam.", "We did not go out because of the rain.", "The bus did not come because of a breakdown."]}
  pl.a2.unit82.lesson04.teach.gn_dlaczego: {"title": "Asking why in the past", "gloss": "Why were you late? (to a man) Why did you not come? (to a woman) Because there was a traffic jam. Because I was ill.", "note": "Use *-łeś* when you ask a man and *-łaś* when you ask a woman. The answer begins with *bo*."}
  pl.a2.unit82.lesson04.teach.gn_powod: {"title": "Noun or clause", "gloss": "I was late because of the traffic jam. I was late because there was a traffic jam.", "note": "*Z powodu* is followed by a noun, *bo* by a whole clause with its own verb. Both give the reason."}
  pl.a2.unit82.lesson04.teach.odpowiedzi: {"title": "Short answers", "gloss": "Why? Because I was ill. That is why I stayed at home.", "note": "A short answer can give the reason with *bo* or the result with *dlatego*."}
  pl.a2.unit82.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "I answered the phone (woman) / I was sleeping (woman) / it is better / today", "note": "*Odebrać telefon* means to pick up the phone when it rings.", "example_gloss": ["I did not answer the phone.", "I was sleeping because I was ill.", "Today it is better."]}
  pl.a2.unit82.lesson05.teach.gn_wiec: {"title": "Result in the story", "gloss": "I had a fever, so I stayed at home. Today it is better, that is why I am at work.", "note": "The reason comes first and the result follows after *więc* or *dlatego*."}
  pl.a2.unit82.lesson05.teach.gn_bo: {"title": "Reason in the story", "gloss": "I did not answer the phone because I was sleeping.", "note": "After a negative verb the object is in the genitive: *telefon* becomes *telefonu*."}
  pl.a2.unit82.lesson05.teach.lectura: {"title": "Ewa explains", "gloss": "Yesterday I did not come to work because I was ill. I had a fever, so I stayed at home. Marek called, but I did not answer the phone because I was sleeping. Today it is better, that is why I am at work.", "note": "Ewa uses reasons and results in one story. All her past verbs end in *-łam*.", "glosses": {"bo": "because", "więc": "so", "dlatego": "that is why", "byłam": "I was (woman)", "zostałam": "I stayed (woman)"}}
  pl.a2.unit82.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. Why were you not at work yesterday?"}
  pl.a2.unit82.lesson06.teach.d2: {"title": "Ewa answers", "gloss": "Ewa: Because I was ill. I had a fever, so I stayed at home."}
  pl.a2.unit82.lesson06.teach.d3: {"title": "Marek understands", "gloss": "Marek: That is why you did not answer the phone."}
  pl.a2.unit82.lesson06.teach.d4: {"title": "Ewa asks back", "gloss": "Ewa: Yes, I was sleeping. And you? Why were you late today?"}
  pl.a2.unit82.lesson06.teach.d5: {"title": "Marek explains", "gloss": "Marek: I was late because there was a traffic jam."}
  pl.a2.unit82.lesson06.teach.d6: {"title": "Ewa ends", "gloss": "Ewa: Too bad, but it is good that you are here."}
exercises:
  pl.a2.unit82.lesson01.exercise01.elige_bo: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa nie idzie do kina, bo jest zmęczona.", "distractors": ["Ewa nie idzie do kina, bo jest zmęczony.", "Ewa nie idzie do kina, jest bo zmęczona.", "Ewa nie idzie do kina, bo jest zimno."], "accepted_answers": [{"value": "Ewa nie idzie do kina, bo jest zmęczona.", "status": "correct"}], "feedback": "*Ewa* is a woman, so *zmęczona*, and *bo* comes before the reason."}
  pl.a2.unit82.lesson01.exercise02.elige_deszcz: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Zostaję w domu, bo pada deszcz.", "distractors": ["Pada deszcz, bo zostaję w domu.", "Zostaję w domu, bo jest zimno.", "Nie zostaję w domu, bo pada deszcz."], "accepted_answers": [{"value": "Zostaję w domu, bo pada deszcz.", "status": "correct"}], "feedback": "The result is *zostaję w domu*; the reason after *bo* is *pada deszcz*."}
  pl.a2.unit82.lesson01.exercise03.une_razones: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "bo", "right": "because (everyday)"}, {"left": "ponieważ", "right": "because (a little more formal)"}, {"left": "dlaczego", "right": "why"}, {"left": "jestem chory", "right": "I am ill (said by a man)"}, {"left": "jestem zmęczona", "right": "I am tired (said by a woman)"}, {"left": "pada deszcz", "right": "it is raining"}, {"left": "jest zimno", "right": "it is cold"}, {"left": "mam gorączkę", "right": "I have a fever"}], "status": "correct"}], "feedback": "Words for giving reasons and some reasons."}
  pl.a2.unit82.lesson01.exercise04.ordena_bo: {"instruction": "Put the words in order to say 'I am staying at home because it is raining.'", "correct_option": "Zostaję w domu bo pada deszcz", "accepted_answers": [{"value": "Zostaję w domu bo pada deszcz", "status": "correct"}], "feedback": "Result first, then *bo* and the reason."}
  pl.a2.unit82.lesson01.exercise05.completa_bo: {"instruction": "Complete the sentence with a word meaning 'because'. Two words are possible.", "correct_option": "bo", "accepted_answers": [{"value": "bo", "status": "correct"}, {"value": "ponieważ", "status": "correct"}], "feedback": "*Bo* and *ponieważ* both introduce the reason."}
  pl.a2.unit82.lesson01.exercise06.traduce_bo: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Nie idę do kina, bo jestem zmęczony.", "status": "correct"}, {"value": "Nie idę do kina, bo jestem zmęczony", "status": "correct"}, {"value": "Nie idę do kina, bo jestem zmęczona.", "status": "correct"}, {"value": "Nie idę do kina, bo jestem zmęczona", "status": "correct"}, {"value": "Nie idę do kina, ponieważ jestem zmęczony.", "status": "correct"}, {"value": "Nie idę do kina, ponieważ jestem zmęczony", "status": "correct"}, {"value": "Nie idę do kina, ponieważ jestem zmęczona.", "status": "correct"}, {"value": "Nie idę do kina, ponieważ jestem zmęczona", "status": "correct"}], "feedback": "Result, comma, *bo*, reason."}
  pl.a2.unit82.lesson01.exercise07.escribe_bo: {"instruction": "Write one Polish sentence.", "correct_option": "Zostaję w domu, bo mam gorączkę.", "accepted_answers": [{"value": "Zostaję w domu, bo mam gorączkę.", "status": "correct"}, {"value": "Zostaję w domu, bo mam gorączkę", "status": "correct"}, {"value": "Zostaję w domu, ponieważ mam gorączkę.", "status": "correct"}, {"value": "Zostaję w domu, ponieważ mam gorączkę", "status": "correct"}], "feedback": "*Zostaję w domu, bo mam gorączkę.*"}
  pl.a2.unit82.lesson02.exercise01.elige_wiec: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Nie mam czasu, więc nie idę do kina.", "distractors": ["Nie mam czasu, bo nie idę do kina.", "Nie mam czasu, więc idę do kina.", "Mam czas, więc nie idę do kina."], "accepted_answers": [{"value": "Nie mam czasu, więc nie idę do kina.", "status": "correct"}], "feedback": "The reason (*nie mam czasu*) comes first, then *więc* and the result."}
  pl.a2.unit82.lesson02.exercise02.elige_dlatego: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Boli mnie gardło, dlatego nie idę do pracy.", "distractors": ["Boli mnie gardło, bo nie idę do pracy.", "Boli mnie gardło, dlatego idę do pracy.", "Nie boli mnie gardło, dlatego nie idę do pracy."], "accepted_answers": [{"value": "Boli mnie gardło, dlatego nie idę do pracy.", "status": "correct"}], "feedback": "The reason first, then *dlatego* and the result."}
  pl.a2.unit82.lesson02.exercise03.une_wynik: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "bo", "right": "because: gives the reason"}, {"left": "więc", "right": "so: gives the result"}, {"left": "dlatego", "right": "that is why: gives the result"}, {"left": "nie mam czasu", "right": "I have no time"}, {"left": "nie mam pieniędzy", "right": "I have no money"}, {"left": "boli mnie głowa", "right": "my head hurts"}, {"left": "boli mnie gardło", "right": "my throat hurts"}], "status": "correct"}], "feedback": "Reason and result words, and some problems."}
  pl.a2.unit82.lesson02.exercise04.ordena_wiec: {"instruction": "Put the words in order to say 'I have a fever, so I am staying at home.'", "correct_option": "Mam gorączkę więc zostaję w domu", "accepted_answers": [{"value": "Mam gorączkę więc zostaję w domu", "status": "correct"}], "feedback": "Reason first, then *więc* and the result."}
  pl.a2.unit82.lesson02.exercise05.completa_wiec: {"instruction": "Complete the sentence with a word that introduces the result. Two words are possible.", "correct_option": "więc", "accepted_answers": [{"value": "więc", "status": "correct"}, {"value": "dlatego", "status": "correct"}], "feedback": "*Więc* and *dlatego* both introduce the result."}
  pl.a2.unit82.lesson02.exercise06.traduce_wiec: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Boli mnie głowa, więc zostaję w domu.", "status": "correct"}, {"value": "Boli mnie głowa, więc zostaję w domu", "status": "correct"}, {"value": "Boli mnie głowa, dlatego zostaję w domu.", "status": "correct"}, {"value": "Boli mnie głowa, dlatego zostaję w domu", "status": "correct"}, {"value": "Głowa mnie boli, więc zostaję w domu.", "status": "correct"}, {"value": "Głowa mnie boli, więc zostaję w domu", "status": "correct"}, {"value": "Głowa mnie boli, dlatego zostaję w domu.", "status": "correct"}, {"value": "Głowa mnie boli, dlatego zostaję w domu", "status": "correct"}], "feedback": "Reason, comma, *więc* or *dlatego*, result."}
  pl.a2.unit82.lesson02.exercise07.escribe_wiec: {"instruction": "Write one Polish sentence.", "correct_option": "Jest zimno, więc nie idę do kina.", "accepted_answers": [{"value": "Jest zimno, więc nie idę do kina.", "status": "correct"}, {"value": "Jest zimno, więc nie idę do kina", "status": "correct"}, {"value": "Jest zimno, dlatego nie idę do kina.", "status": "correct"}, {"value": "Jest zimno, dlatego nie idę do kina", "status": "correct"}], "feedback": "*Jest zimno, więc nie idę do kina.*"}
  pl.a2.unit82.lesson03.exercise01.elige_spoznilem: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Spóźniłem się, bo był korek.", "distractors": ["Spóźniłam się, bo był korek.", "Spóźniłem się, bo jest korek.", "Spóźniłem się, więc był korek."], "accepted_answers": [{"value": "Spóźniłem się, bo był korek.", "status": "correct"}], "feedback": "A man says *spóźniłem się*; the traffic jam was in the past, so *był korek*."}
  pl.a2.unit82.lesson03.exercise02.elige_przyszla: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa nie przyszła do pracy, bo była chora.", "distractors": ["Ewa nie przyszedł do pracy, bo był chory.", "Ewa nie przyszła do pracy, bo jest chora.", "Ewa przyszła do pracy, bo była chora."], "accepted_answers": [{"value": "Ewa nie przyszła do pracy, bo była chora.", "status": "correct"}], "feedback": "*Ewa* is a woman: *przyszła*, *była chora*."}
  pl.a2.unit82.lesson03.exercise03.une_przeszlosc: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "spóźniłem się", "right": "I was late (said by a man)"}, {"left": "spóźniłam się", "right": "I was late (said by a woman)"}, {"left": "przyszedłem", "right": "I came (said by a man)"}, {"left": "przyszłam", "right": "I came (said by a woman)"}, {"left": "był korek", "right": "there was a traffic jam"}, {"left": "padał deszcz", "right": "it was raining"}, {"left": "wczoraj", "right": "yesterday"}, {"left": "byłam chora", "right": "I was ill (said by a woman)"}], "status": "correct"}], "feedback": "Past forms and reasons."}
  pl.a2.unit82.lesson03.exercise04.ordena_wczoraj: {"instruction": "Put the words in order to say 'Yesterday it was raining, so I stayed at home. (A woman is speaking.)'", "correct_option": "Wczoraj padał deszcz więc zostałam w domu", "accepted_answers": [{"value": "Wczoraj padał deszcz więc zostałam w domu", "status": "correct"}], "feedback": "Both verbs are in the past tense."}
  pl.a2.unit82.lesson03.exercise05.completa_wczoraj: {"instruction": "Complete the sentence with a word meaning 'because'. Two words are possible.", "correct_option": "bo", "accepted_answers": [{"value": "bo", "status": "correct"}, {"value": "ponieważ", "status": "correct"}], "feedback": "*Bo* or *ponieważ* gives the reason."}
  pl.a2.unit82.lesson03.exercise06.traduce_wczoraj: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Spóźniłem się, bo autobus nie przyjechał.", "status": "correct"}, {"value": "Spóźniłem się, bo autobus nie przyjechał", "status": "correct"}, {"value": "Spóźniłem się, ponieważ autobus nie przyjechał.", "status": "correct"}, {"value": "Spóźniłem się, ponieważ autobus nie przyjechał", "status": "correct"}, {"value": "Spóźniłam się, bo autobus nie przyjechał.", "status": "correct"}, {"value": "Spóźniłam się, bo autobus nie przyjechał", "status": "correct"}, {"value": "Spóźniłam się, ponieważ autobus nie przyjechał.", "status": "correct"}, {"value": "Spóźniłam się, ponieważ autobus nie przyjechał", "status": "correct"}], "feedback": "A man says *spóźniłem się*, a woman *spóźniłam się*."}
  pl.a2.unit82.lesson03.exercise07.escribe_wczoraj: {"instruction": "Write one Polish sentence.", "correct_option": "Wczoraj nie przyszłam do pracy, bo byłam chora.", "accepted_answers": [{"value": "Wczoraj nie przyszłam do pracy, bo byłam chora.", "status": "correct"}, {"value": "Wczoraj nie przyszłam do pracy, bo byłam chora", "status": "correct"}, {"value": "Wczoraj nie przyszłam do pracy, ponieważ byłam chora.", "status": "correct"}, {"value": "Wczoraj nie przyszłam do pracy, ponieważ byłam chora", "status": "correct"}, {"value": "Wczoraj nie przyszedłem do pracy, bo byłem chory.", "status": "correct"}, {"value": "Wczoraj nie przyszedłem do pracy, bo byłem chory", "status": "correct"}, {"value": "Wczoraj nie przyszedłem do pracy, ponieważ byłem chory.", "status": "correct"}, {"value": "Wczoraj nie przyszedłem do pracy, ponieważ byłem chory", "status": "correct"}, {"value": "Nie przyszłam wczoraj do pracy, bo byłam chora.", "status": "correct"}, {"value": "Nie przyszłam wczoraj do pracy, bo byłam chora", "status": "correct"}, {"value": "Nie przyszłam wczoraj do pracy, ponieważ byłam chora.", "status": "correct"}, {"value": "Nie przyszłam wczoraj do pracy, ponieważ byłam chora", "status": "correct"}, {"value": "Nie przyszedłem wczoraj do pracy, bo byłem chory.", "status": "correct"}, {"value": "Nie przyszedłem wczoraj do pracy, bo byłem chory", "status": "correct"}, {"value": "Nie przyszedłem wczoraj do pracy, ponieważ byłem chory.", "status": "correct"}, {"value": "Nie przyszedłem wczoraj do pracy, ponieważ byłem chory", "status": "correct"}], "feedback": "A woman says *przyszłam* and *byłam chora*; a man says *przyszedłem* and *byłem chory*."}
  pl.a2.unit82.lesson04.exercise01.elige_pytanie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Dlaczego nie przyszłaś?", "distractors": ["Dlaczego nie przyszedłeś?", "Dlaczego nie przyszłam?", "Dlaczego przyszłaś?"], "accepted_answers": [{"value": "Dlaczego nie przyszłaś?", "status": "correct"}], "feedback": "Ewa is a woman, so you ask with *-łaś*: *przyszłaś*."}
  pl.a2.unit82.lesson04.exercise02.elige_powod: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Spóźniłem się z powodu korku.", "distractors": ["Spóźniłem się z powodu korek.", "Spóźniłam się z powodu korku.", "Spóźniłem się z powodu deszczu."], "accepted_answers": [{"value": "Spóźniłem się z powodu korku.", "status": "correct"}], "feedback": "*Z powodu* needs the genitive: *korku*. A man says *spóźniłem się*."}
  pl.a2.unit82.lesson04.exercise03.une_dlaczego: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Dlaczego się spóźniłeś?", "right": "Why were you late? (to a man)"}, {"left": "Dlaczego nie przyszłaś?", "right": "Why did you not come? (to a woman)"}, {"left": "Bo był korek.", "right": "Because there was a traffic jam."}, {"left": "Bo byłam chora.", "right": "Because I was ill (said by a woman)."}, {"left": "z powodu korku", "right": "because of the traffic jam"}, {"left": "z powodu deszczu", "right": "because of the rain"}, {"left": "z powodu awarii", "right": "because of a breakdown"}, {"left": "Dlatego zostałem w domu.", "right": "That is why I stayed at home (said by a man)."}], "status": "correct"}], "feedback": "Questions with why, and reasons."}
  pl.a2.unit82.lesson04.exercise04.ordena_dlaczego: {"instruction": "Put the words in order to say 'Why did you not come to work? (to a woman)'", "correct_option": "Dlaczego nie przyszłaś do pracy", "accepted_answers": [{"value": "Dlaczego nie przyszłaś do pracy", "status": "correct"}], "feedback": "A question to a woman uses *-łaś*."}
  pl.a2.unit82.lesson04.exercise05.completa_dlaczego: {"instruction": "Answer the question with the word that opens the reason. Two words are possible.", "correct_option": "Bo", "accepted_answers": [{"value": "Bo", "status": "correct"}, {"value": "Ponieważ", "status": "correct"}], "feedback": "*Bo* or *ponieważ* opens the answer."}
  pl.a2.unit82.lesson04.exercise06.traduce_dlaczego: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Dlaczego się spóźniłeś?", "status": "correct"}, {"value": "Dlaczego się spóźniłeś", "status": "correct"}, {"value": "Dlaczego spóźniłeś się?", "status": "correct"}, {"value": "Dlaczego spóźniłeś się", "status": "correct"}], "feedback": "To a man: *spóźniłeś się*."}
  pl.a2.unit82.lesson04.exercise07.escribe_dlaczego: {"instruction": "Write one Polish sentence.", "correct_option": "Spóźniłam się z powodu deszczu.", "accepted_answers": [{"value": "Spóźniłam się z powodu deszczu.", "status": "correct"}, {"value": "Spóźniłam się z powodu deszczu", "status": "correct"}, {"value": "Spóźniłam się, bo padał deszcz.", "status": "correct"}, {"value": "Spóźniłam się, bo padał deszcz", "status": "correct"}, {"value": "Spóźniłam się, ponieważ padał deszcz.", "status": "correct"}, {"value": "Spóźniłam się, ponieważ padał deszcz", "status": "correct"}], "feedback": "*Z powodu deszczu*, or *bo padał deszcz*."}
  pl.a2.unit82.lesson05.exercise01.lee_chora: {"instruction": "Read the story and choose the answer.", "correct_option": "She was ill.", "distractors": ["There was a traffic jam.", "The bus did not come.", "She had no time."], "accepted_answers": [{"value": "She was ill.", "status": "correct"}], "feedback": "*Wczoraj nie przyszłam do pracy, bo byłam chora.*"}
  pl.a2.unit82.lesson05.exercise02.lee_telefon: {"instruction": "Read the story and choose the answer.", "correct_option": "She was sleeping.", "distractors": ["She was at work.", "She was at the cinema.", "She was cooking."], "accepted_answers": [{"value": "She was sleeping.", "status": "correct"}], "feedback": "*Nie odebrałam telefonu, bo spałam.*"}
  pl.a2.unit82.lesson05.exercise03.une_texto: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Byłam chora.", "right": "I was ill (woman)."}, {"left": "Miałam gorączkę.", "right": "I had a fever."}, {"left": "Zostałam w domu.", "right": "I stayed at home (woman)."}, {"left": "Marek zadzwonił.", "right": "Marek called."}, {"left": "Nie odebrałam telefonu.", "right": "I did not answer the phone."}, {"left": "Spałam.", "right": "I was sleeping (woman)."}, {"left": "Dzisiaj jest lepiej.", "right": "Today it is better."}, {"left": "Jestem w pracy.", "right": "I am at work."}], "status": "correct"}], "feedback": "Sentences from the story."}
  pl.a2.unit82.lesson05.exercise04.ordena_texto: {"instruction": "Put the words in order to say 'I did not answer the phone because I was sleeping. (A woman is speaking.)'", "correct_option": "Nie odebrałam telefonu bo spałam", "accepted_answers": [{"value": "Nie odebrałam telefonu bo spałam", "status": "correct"}], "feedback": "Result first, then *bo* and the reason."}
