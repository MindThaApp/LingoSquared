answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit04.zdania_wzgledne:
    title: "Relative clauses"

lessons:
  pl.b1.unit04.lesson01.ktory_mianownik_biernik:
    title: "Który -- nominative and accusative"
  pl.b1.unit04.lesson02.ktory_dopelniacz_celownik:
    title: "Który -- genitive and dative"
  pl.b1.unit04.lesson03.ktory_narzednik_miejscownik:
    title: "Który -- instrumental and locative"
  pl.b1.unit04.lesson04.podsumowanie:
    title: "People and places in my life"

teaching:
  pl.b1.unit04.lesson01.teach.recap_words:
    title: "I have, is, this, my -- again"
    gloss: "mam, jest, to, mój, moim, dom, praca -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds relative clauses on top of them."

  pl.b1.unit04.lesson01.teach.ktory_note:
    title: "Który/która/które -- the relative pronoun"
    gloss: "*który/która/które* -- who/that/which. Agrees in gender and number with the noun it describes (its antecedent) -- but its CASE depends entirely on its own role inside the relative clause."
    note: "This is the core B1 grammar point of this whole unit: two independent rules working at once, not one."

  pl.b1.unit04.lesson01.teach.sasiad_mianownik:
    title: "Neighbor"
    gloss: "neighbor"
    note: "A masculine noun."
    example_gloss: "This is my neighbor."

  pl.b1.unit04.lesson01.teach.phrase_ktory_mianownik:
    title: "The man who works at the bank is my neighbor"
    gloss: "The man who works at the bank is my neighbor."
    note: "*który* here is the SUBJECT of \"pracuje\" (works) -- so it takes the nominative case, agreeing with masculine singular *mężczyzna*."

  pl.b1.unit04.lesson01.teach.ksiazka_biernik:
    title: "Book"
    gloss: "book"
    note: "A feminine noun. *czytam* (I read)."
    example_gloss: "I am reading an interesting book."

  pl.b1.unit04.lesson01.teach.phrase_ktory_biernik:
    title: "This is the book that I'm reading"
    gloss: "This is the book that I'm reading."
    note: "*którą* here is the DIRECT OBJECT of \"czytam\" (I read) -- accusative feminine, agreeing with *książka*."

  pl.b1.unit04.lesson02.teach.kolega_znam:
    title: "Colleague / friend (male)"
    gloss: "colleague / male friend"
    note: "*znam* (I know); *nie znam* (I don't know)."
    example_gloss: "I don't know this colleague."

  pl.b1.unit04.lesson02.teach.ktorego_note:
    title: "Którego -- genitive after negation"
    gloss: "*którego* -- the genitive form of *który* (masculine). After a negated verb (\"nie znam\"), the object takes the genitive case, not the accusative."
    note: "The same negation-triggers-genitive rule that governs every negated direct object in Polish, now applied to a relative pronoun."

  pl.b1.unit04.lesson02.teach.phrase_ktorego_dopelniacz:
    title: "This is a colleague whom I don't know"
    gloss: "This is a colleague whom I don't know."
    note: "*którego* is the object of the negated \"nie znam\" -- genitive, not accusative."

  pl.b1.unit04.lesson02.teach.przyjaciolka_pomagam:
    title: "Friend (female)"
    gloss: "friend (female)"
    note: "*pomagam* (I help)."
    example_gloss: "I help my friend."

  pl.b1.unit04.lesson02.teach.ktorej_note:
    title: "Której -- dative after pomagać"
    gloss: "*której* -- the dative form of *która* (feminine). \"Pomagać\" (to help) always takes a dative object: pomagam komu? (I help whom?) -- *przyjaciółce* -- so: *przyjaciółka, której pomagam*."
    note: "A real case-governing rule -- \"pomagać\" never takes an accusative object, only dative."

  pl.b1.unit04.lesson02.teach.phrase_ktorej_celownik:
    title: "This is a friend whom I help"
    gloss: "This is a friend whom I help."
    note: "*której* is the object of \"pomagam\" -- dative, because *pomagać* governs dative."

  pl.b1.unit04.lesson03.teach.lekarz_rozmawiam:
    title: "Doctor"
    gloss: "doctor"
    note: "*rozmawiam z* (I talk with) -- \"z\" (with) takes the instrumental case."
    example_gloss: "I'm talking with the doctor."

  pl.b1.unit04.lesson03.teach.ktorym_narzednik_note:
    title: "Z którym -- instrumental after z"
    gloss: "*z którym* -- the instrumental form of *który* (masculine), after the preposition \"z\" (with): *lekarz, z którym rozmawiam*."
    note: "Same instrumental-after-\"z\" pattern already seen with *z ludźmi* and *z jednym elementem* earlier in this course."

  pl.b1.unit04.lesson03.teach.phrase_ktorym_narzednik:
    title: "This is the doctor I talk with"
    gloss: "This is the doctor I talk with."
    note: "*którym* is the object of \"z\" -- instrumental."

  pl.b1.unit04.lesson03.teach.dom_mieszkam:
    title: "I live"
    gloss: "I live"
    note: "*w tym domu* (in this house) -- \"w\" (in) takes the locative case."
    example_gloss: "I live in this house."

  pl.b1.unit04.lesson03.teach.w_ktorym_miejscownik_note:
    title: "W którym -- locative after w"
    gloss: "*w którym* -- the locative form of *który* (masculine/neuter), after the preposition \"w\" (in): *dom, w którym mieszkam*. This is the SAME form as the instrumental -- *którym* -- for masculine/neuter singular."
    note: "A genuine syncretism in Polish adjective declension, not a coincidence -- instrumental and locative singular share one form for masculine/neuter."

  pl.b1.unit04.lesson03.teach.phrase_w_ktorym_miejscownik:
    title: "This is the house I live in"
    gloss: "This is the house I live in."
    note: "*którym* is the object of \"w\" -- locative here, same surface form as the instrumental from the previous card."

  pl.b1.unit04.teach.dialogue.line01:
    title: "Ewa describes her doctor"
    gloss: "This is the doctor I talk with about my health."
    note: "Ewa's stated fact about her doctor -- exactly what this lesson's exercises test about her."
  pl.b1.unit04.teach.dialogue.line02:
    title: "Marek describes his colleague"
    gloss: "And I have a colleague whom I don't know very well."
    note: "Marek's stated fact about his colleague -- genitive *którego* after negation, reused from lesson02."
  pl.b1.unit04.teach.dialogue.line03:
    title: "Ewa describes her house"
    gloss: "This is the house I've lived in for five years."
    note: "*od pięciu lat* -- for five years, a genuine concrete detail this lesson's exercises test."
  pl.b1.unit04.teach.dialogue.line04:
    title: "Marek describes his friend"
    gloss: "Nice house. I have a friend whom I often help with shopping."
    note: "Marek's stated fact about his friend -- dative *której* after *pomagam*, reused from lesson02."
  pl.b1.unit04.teach.dialogue.line05:
    title: "Ewa responds warmly"
    gloss: "That's kind of you."
    note: "A short, natural, friendly response."
  pl.b1.unit04.teach.dialogue.line06:
    title: "Marek closes with a general statement"
    gloss: "I like helping people whom I know well."
    note: "*których* -- the genitive PLURAL form of *który*, a natural extension the learner can recognize from the singular forms already taught."

  pl.b1.unit04.lesson04.teach.zycie:
    title: "Life"
    gloss: "life"
    note: "*w moim życiu* -- in my life (locative)."
    example_gloss: "That's an important person in my life."

  pl.b1.unit04.lesson04.teach.osoba:
    title: "Person"
    gloss: "person"
    note: "A feminine noun. *ważna* (important) -- feminine form, agreeing with *osoba*."
    example_gloss: "That's an important person."

  pl.b1.unit04.lesson04.teach.review_note:
    title: "Który across every case -- a quick review"
    gloss: "Review: *który* (M.), *która* (F.), *które* (N.) -- nominative; *którą* -- accusative F.; *którego* -- genitive M.; *której* -- dative F.; *którym* -- instrumental/locative M./N."
    note: "The full case paradigm this unit has taught, gathered in one place before the wrap-up exercises."

  pl.b1.unit04.lesson04.teach.phrase_podsumowanie:
    title: "The neighbor and the friend are important people in my life"
    gloss: "The neighbor who works at the bank, and the friend whom I help, are important people in my life."
    note: "Combines this unit's full toolkit -- nominative *który* and dative *której* -- into one sentence with two relative clauses."

exercises:
