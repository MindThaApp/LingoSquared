answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and place names (Ewa,
    Marek, Zakopane).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit08.zale:
    title: "Regret"

lessons:
  pl.b1.unit08.lesson01.zaluje_ze_nie:
    title: "I regret that I didn't..."
  pl.b1.unit08.lesson02.trzeba_bylo:
    title: "It was necessary to..."
  pl.b1.unit08.lesson03.narty_w_zakopanem:
    title: "Skiing in Zakopane"
  pl.b1.unit08.lesson04.moj_zal:
    title: "My regret"

teaching:
  pl.b1.unit08.lesson01.teach.recap_words:
    title: "Is, I have, good, we should -- again"
    gloss: "jest, mam, dobry, powinniśmy -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds past-regret constructions on top of them."

  pl.b1.unit08.lesson01.teach.zaluje:
    title: "I regret"
    gloss: "I regret"
    note: "First-person present of *żałować* (to regret)."
    example_gloss: "I regret that we didn't go."

  pl.b1.unit08.lesson01.teach.nie_pojechalismy:
    title: "We didn't go"
    gloss: "we didn't go"
    note: "*że* -- that, connects the regret to what didn't happen."
    example_gloss: "We didn't go skiing."

  pl.b1.unit08.lesson01.teach.zaluje_note:
    title: "Żałuję, że nie + past tense"
    gloss: "\"Żałuję, że nie\" + a verb in the past tense -- expresses regret about something that did NOT happen: *Żałuję, że nie pojechaliśmy na narty* (I regret that we didn't go skiing)."
    note: "The first of this unit's two regret constructions: wishing something had happened."

  pl.b1.unit08.lesson01.teach.phrase_zaluje_ze_nie:
    title: "I regret that we didn't go skiing"
    gloss: "I regret that we didn't go skiing."
    note: "A complete regret sentence using żałuję, że nie."

  pl.b1.unit08.lesson02.teach.trzeba_bylo:
    title: "It was necessary to / should have"
    gloss: "it was necessary to / should have"
    note: "An impersonal past-obligation form -- doesn't change for gender or person."
    example_gloss: "We should have booked earlier."

  pl.b1.unit08.lesson02.teach.zarezerwowac:
    title: "To book earlier"
    gloss: "to book earlier"
    note: "*wcześniej* -- earlier."
    example_gloss: "We should have booked the tickets earlier."

  pl.b1.unit08.lesson02.teach.trzeba_bylo_note:
    title: "Trzeba było + infinitive"
    gloss: "\"Trzeba było\" + infinitive -- expresses what needed to be done in the past but wasn't: *Trzeba było zarezerwować wcześniej* (we should have booked earlier / it was necessary to book earlier)."
    note: "The second of this unit's two regret constructions: should have done / would have been different -- an impersonal form, unlike the person-agreeing powinniśmy byli taught later in this unit."

  pl.b1.unit08.lesson02.teach.bilety:
    title: "Tickets"
    gloss: "tickets"
    note: "Plural of *bilet* (ticket)."
    example_gloss: "We should have booked the tickets."

  pl.b1.unit08.teach.dialogue.line01:
    title: "Ewa states her regret"
    gloss: "I regret that we didn't go skiing last winter."
    note: "The stated regret this lesson's exercises test."
  pl.b1.unit08.teach.dialogue.line02:
    title: "Marek agrees and gives the reason"
    gloss: "I regret it too. I was too busy with work."
    note: "The stated reason -- consistent with Marek's established engineer job."
  pl.b1.unit08.teach.dialogue.line03:
    title: "Ewa explains what happened"
    gloss: "We were supposed to go to Zakopane, but we didn't book tickets."
    note: "The missed plan, stated once."
  pl.b1.unit08.teach.dialogue.line04:
    title: "Marek says what should have happened"
    gloss: "We should have booked earlier, before everything sold out."
    note: "The impersonal trzeba było construction, with a reason clause."
  pl.b1.unit08.teach.dialogue.line05:
    title: "Ewa restates with powinniśmy byli"
    gloss: "We should have booked the tickets in October."
    note: "The person-agreeing should-have form, naming a concrete earlier month -- never contradicted elsewhere."
  pl.b1.unit08.teach.dialogue.line06:
    title: "Marek looks ahead"
    gloss: "You're right. Next year we'll definitely go."
    note: "A forward-looking close that does not reopen or contradict the stated past regret."

  pl.b1.unit08.lesson03.teach.zima_zakopane:
    title: "Last winter, Zakopane"
    gloss: "last winter, Zakopane"
    note: "*mieliśmy pojechać* -- we were supposed to go; Zakopane is a real Polish mountain resort town."
    example_gloss: "Last winter we were supposed to go to Zakopane."

  pl.b1.unit08.lesson03.teach.zbyt_zajety:
    title: "You were too busy"
    gloss: "you were too busy"
    note: "*pracą* -- with work (instrumental)."
    example_gloss: "You were too busy with work."

  pl.b1.unit08.lesson04.teach.powinnam_byla:
    title: "I should have (feminine / masculine)"
    gloss: "I should have"
    note: "*powinnam była* -- a woman speaking; *powinienem był* -- a man speaking. Both extend powinniśmy (we should) into the past."
    example_gloss: "I should have booked the tickets earlier."

  pl.b1.unit08.lesson04.teach.review_note:
    title: "A full past regret has two parts"
    gloss: "A full regret about the past: 1) *żałuję, że nie...* (what didn't happen), 2) *trzeba było / powinniśmy byli...* (what should have been done differently)."
    note: "The two regret constructions, reviewed together before this lesson's final writing task."

