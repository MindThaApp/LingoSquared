review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for pl's second B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "must have missed" is a single perfect-modal construction;
    Polish instead uses a past-tense modal (musiał) governing a PERFECTIVE
    infinitive (przegapić) -- there is no auxiliary "have" to translate,
    flagged explicitly in lesson04; (2) "może" is a genuine homograph
    (the particle "maybe" taught in lesson01 vs. the 3rd-person form of
    "móc", "can/could", first seen in lesson02's "nie może") -- every
    recognize/listen exercise in this file tests a multi-word phrase or
    full sentence specifically so the bare ambiguous word is never graded
    alone; (3) the deduction/guess line "nie może" (cannot be, confident)
    vs. "chyba"/"mógłby" (perhaps/might be, tentative) is a real certainty
    distinction Polish marks explicitly that English sometimes blurs; (4)
    Polish requires a comma before "bo"/"więc" here exactly as in unit01
    -- every accepted_answers variant keeps it. No sibling-direction file
    (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    lesson01.exercise03 matching -- confusable rights pewnie 'surely (I
    bet)' / na pewno 'certainly / for sure' / bez watpienia
    'undoubtedly' (three English synonyms) -> 'I bet / most likely' /
    'for sure' / 'without a doubt'; (2) lesson03.exercise03 matching --
    chyba 'perhaps / I guess' collided with zgaduje, ze 'I guess
    that...' -> chyba 'perhaps'; (3) lesson01.exercise02 -- distractor
    'He's probably on the way.' is a valid reading of 'Pewnie jest w
    drodze' (pewnie colloquially = probably) -> 'Maybe he's on the way.'
    / 'He isn't on the way.'; (4) teach.wiec note falsely said no comma
    precedes wiec (and contradicted its own example) -> comma always
    precedes it; (5) reading lesson05 -- 'Jedno jest pewne: jeszcze nie
    jest w domu, bo jego auto zniknelo' ('he is not home YET', illogical
    when his car is gone) -> 'nie ma go w domu' (+ gloss); (6) reading
    gloss tego wrongly attributed the genitive to 'na pewno' -> genitive
    of negation after nie wiem; (7) missing accepted answers: 'Jest
    prawdopodobnie w drodze' (taught order), 'Jest bez watpienia
    zajety', 'Jeszcze nie ma Tomka', 'Musi byc w korku' (taught in
    teach.musiec example; lesson02.ex05 + lesson06.ex05), 'Chyba jeszcze
    jest w domu'. NATIVE CHECK: whether pewnie really sits ABOVE
    prawdopodobnie on the certainty scale (most speakers treat pewnie as
    colloquial 'probably'); the lesson06 writing task pairs 'he must
    have missed the train' with 'he is probably stuck in traffic' (train
    vs car) -- confirm the scenario reads coherently; 'Moze zaspal' in
    an evening scenario. Prior native-check priorities (moved here from
    required_next_reviewer): Native-Polish confirmation needed (DRAFT).
    Confirm the English glosses match idiomatic Polish, that every
    matching_pairs right-hand gloss discriminates its left on real
    meaning, and that the culminating writing answer (lesson06
    exercise06) accepts the punctuation forms a correct learner would
    actually produce. See the realization file's review block for the
    full priority list.

course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: speculate about causes and consequences
    with graded certainty -- say what may, might, must, or cannot be the
    case (present and past: może, prawdopodobnie, pewnie, na pewno, musi,
    nie może, mógłby, musiał, mógł), and distinguish deduction from
    guesswork, around a friend who is late.

units:
  pl.b2.unit02.spekulacja:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and tell a confident deduction apart from a plain guess.

lessons:
  pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien:
    title: "How certain are you?"
  pl.b2.unit02.lesson02.dedukcja:
    title: "Deduction: it must be so"
  pl.b2.unit02.lesson03.domysl_czy_dedukcja:
    title: "A guess or a deduction?"
  pl.b2.unit02.lesson04.spekulowanie_o_przeszlosci:
    title: "Speculating about the past"
  pl.b2.unit02.lesson05.fakt_czy_spekulacja:
    title: "Fact or speculation?"
  pl.b2.unit02.lesson06.spekulowanie_w_rozmowie:
    title: "Speculating in conversation"

teaching:
  pl.b2.unit02.lesson01.teach.tomka_jeszcze_nie_ma:
    title: "Tomek isn't here yet."
    gloss: "Tomek isn't here yet."
    note: "*Tomka* is the genitive of *Tomek* -- Polish existential negation (*nie ma*, 'there isn't') always takes the genitive of what's missing, not the nominative."
  pl.b2.unit02.lesson01.teach.dlaczego_sie_spoznia:
    title: "Why is he late?"
    gloss: "Why is he late?"
    note: "*Spóźniać się* ('to be running late') is reflexive; *spóźnia* is its 3rd-person singular present form."
  pl.b2.unit02.lesson01.teach.w_drodze:
    title: "on the way"
    gloss: "on the way"
    note: "*Drodze* is the locative of *droga* ('way/road'), used after *w*."
    example_gloss: "He is on the way."
  pl.b2.unit02.lesson01.teach.moze:
    title: maybe
    gloss: maybe
    note: "*Może* here is the particle 'maybe'. It is a genuine homograph of *może* meaning 'can/could' (3rd-person singular of *móc*, seen from lesson02 on) -- context always tells them apart, but be aware they look identical."
    example_gloss: "Maybe he is on the way."
  pl.b2.unit02.lesson01.teach.prawdopodobnie:
    title: probably
    gloss: probably
    example_gloss: "He is probably on the way."
  pl.b2.unit02.lesson01.teach.pewnie:
    title: "surely (I bet)"
    gloss: "surely / I bet (colloquial deduction)"
    note: "*Pewnie* is the everyday spoken hedge for a confident guess -- stronger than *prawdopodobnie*, short of *na pewno*."
    example_gloss: "He's surely on the way."
  pl.b2.unit02.lesson01.teach.na_pewno:
    title: "certainly / for sure"
    gloss: "certainly / for sure"
    example_gloss: "He is certainly on the way."
  pl.b2.unit02.lesson01.teach.bez_watpienia:
    title: undoubtedly
    gloss: undoubtedly
    note: "*Bez wątpienia* ('without doubt') is the strongest, most formal certainty marker in this scale."
    example_gloss: "He is undoubtedly on the way."
  pl.b2.unit02.lesson01.teach.zajety:
    title: busy
    gloss: busy
    example_gloss: "He is undoubtedly busy."
  pl.b2.unit02.lesson01.teach.grammar_pewnosc:
    title: "Maybe he is on the way. He is probably on the way. He's surely on the way. He is certainly on the way. He is undoubtedly on the way."
    gloss: "Maybe he is on the way. He is probably on the way. He's surely on the way. He is certainly on the way. He is undoubtedly on the way."
    note: "A certainty scale, weakest to strongest: może < prawdopodobnie < pewnie < na pewno < bez wątpienia. All five modify the same claim without changing it -- only how sure the speaker is."

  pl.b2.unit02.lesson02.teach.musiec:
    title: "must (deduction)"
    gloss: "must (epistemic deduction, from musieć)"
    note: "*Musi* + infinitive states a confident deduction from evidence -- 'he must be...'. Unlike English's single modal, Polish keeps the SAME structure (modal + infinitive) whether the deduction is about the present or, as lesson04 shows, the past."
    example_gloss: "He must be stuck in traffic."
  pl.b2.unit02.lesson02.teach.korek:
    title: "traffic jam"
    gloss: "a traffic jam"
    note: "*Stać w korku* ('to stand in a jam') is the everyday idiom for being stuck in traffic. *Korku* is the locative form after *w*."
    example_gloss: "He is stuck in traffic."
  pl.b2.unit02.lesson02.teach.musi_stac_w_korku:
    title: "He must be stuck in traffic."
    gloss: "He must be stuck in traffic."
  pl.b2.unit02.lesson02.teach.nie_moze:
    title: "cannot (be)"
    gloss: "cannot be (confident deduction ruling something out)"
    note: "*Nie może* here is *może* ('can/could', from *móc*) negated -- NOT the 'maybe' particle from lesson01, even though the two look identical. *Nie może być chory* = 'he cannot be sick', a confident deduction ruling out a possibility."
    example_gloss: "He cannot be sick."
  pl.b2.unit02.lesson02.teach.to_niemozliwe:
    title: "That's impossible."
    gloss: "That's impossible."
  pl.b2.unit02.lesson02.teach.wiec:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Więc* draws a conclusion from evidence you just stated. Like *bo*, it is always preceded by a comma: *Jego auto zniknęło, więc...*."
    example_gloss: "His car is gone, so he's probably on the way."
  pl.b2.unit02.lesson02.teach.widzialem_dzis_rano:
    title: "I saw him this morning."
    gloss: "I saw him this morning. (said by a man)"
    note: "*Widziałem* is the masculine past-tense form of *widzieć* ('to see') -- Marek is speaking. A woman would say *widziałam* (see lesson06)."
  pl.b2.unit02.lesson02.teach.grammar_dedukcja:
    title: "His car is gone, so he must be on the way. He cannot be sick, because I saw him this morning."
    gloss: "His car is gone, so he must be on the way. He cannot be sick, because I saw him this morning."
    note: "Deduction = a confident conclusion drawn from stated evidence, signposted with *więc* (therefore) and *bo* (because). Compare lesson03's *chyba*/*mógłby*, a plain guess with no evidence behind it."

  pl.b2.unit02.lesson03.teach.moglby:
    title: "might / could"
    gloss: "might / could (tentative possibility)"
    note: "*Mógłby* is the conditional of *móc* ('can'), used here for a tentative present possibility -- weaker than *musi*, with no firm evidence behind it."
    example_gloss: "He might be at home."
  pl.b2.unit02.lesson03.teach.chyba:
    title: "perhaps / I guess"
    gloss: "perhaps / I guess (colloquial, no evidence)"
    note: "*Chyba* marks a plain guess, distinct from *pewnie* (lesson01), which implies more confidence."
    example_gloss: "I guess he's at home."
  pl.b2.unit02.lesson03.teach.zgadywac:
    title: "to guess"
    gloss: "to guess"
    note: "*Zgadywać* = to guess. First-person present: *zgaduję*."
    example_gloss: "I guess he's at home."
  pl.b2.unit02.lesson03.teach.nie_wiem_na_pewno:
    title: "I'm not sure"
    gloss: "I don't know for sure / I'm not sure"
    note: "*Wiem* is 'I know' (from *wiedzieć*). *Nie wiem na pewno* openly signals you are only guessing -- the natural way to close a tentative speculation."
  pl.b2.unit02.lesson03.teach.grammar_domysl:
    title: "I guess he's at home, but I don't know for sure. His car is gone, so he must be on the way."
    gloss: "I guess he's at home, but I don't know for sure. His car is gone, so he must be on the way."
    note: "A guess (*chyba*, *zgaduję*, *mógłby*) admits no evidence backs it; a deduction (*musi*, *więc*) is anchored to stated evidence. Both are legitimate speculation, but a fluent B2 speaker marks the difference honestly."

  pl.b2.unit02.lesson04.teach.przegapic:
    title: "to miss"
    gloss: "to miss (an event, a train)"
    note: "*Przegapić* is the everyday perfective verb for missing something through inattention or lateness."
    example_gloss: "He missed the train."
  pl.b2.unit02.lesson04.teach.pociag:
    title: train
    gloss: train
    example_gloss: "I'm waiting for the train."
  pl.b2.unit02.lesson04.teach.musial_przegapic_pociag:
    title: "He must have missed the train."
    gloss: "He must have missed the train."
    note: "*Musiał* (past of *musieć*) + the PERFECTIVE infinitive *przegapić* is how Polish expresses past epistemic necessity -- there is no separate 'have'-auxiliary construction to learn, unlike English's 'must have missed'."
  pl.b2.unit02.lesson04.teach.stac_sie:
    title: "to happen"
    gloss: "to happen"
    note: "*Stać się* ('to happen/become') is a DIFFERENT verb from *stać* ('to stand', lesson02's 'stuck in traffic') that happens to share the same infinitive spelling -- context always disambiguates them."
    example_gloss: "Something must have happened."
  pl.b2.unit02.lesson04.teach.musialo_sie_cos_stac:
    title: "Something must have happened."
    gloss: "Something must have happened."
    note: "*Musiało* agrees with the neuter subject *coś* ('something') -- Polish modal-past agreement tracks the grammatical subject's gender, unlike the invariant English 'must have'."
  pl.b2.unit02.lesson04.teach.zaspac:
    title: "to oversleep"
    gloss: "to oversleep"
    note: "*Zaspać* is NOT reflexive in Polish, unlike some other European languages -- *zaspałem* alone means 'I overslept'."
    example_gloss: "He overslept that day."
  pl.b2.unit02.lesson04.teach.musial_zaspac:
    title: "He must have overslept."
    gloss: "He must have overslept."
  pl.b2.unit02.lesson04.teach.zapomniec:
    title: "to forget"
    gloss: "to forget"
    example_gloss: "He forgot about the appointment."
  pl.b2.unit02.lesson04.teach.musial_zapomniec_spotkanie:
    title: "He must have forgotten the appointment."
    gloss: "He must have forgotten about the appointment."
    note: "*Zapomnieć o czymś* ('to forget about something') governs the locative case: *o spotkaniu*."
  pl.b2.unit02.lesson04.teach.mogl:
    title: "might have"
    gloss: "might have (done) -- tentative past"
    note: "*Mógł* (past of *móc*) + infinitive is the tentative-past counterpart to *musiał* + infinitive -- 'might have' rather than 'must have', with no firm evidence."
    example_gloss: "He might have overslept."
  pl.b2.unit02.lesson04.teach.grammar_przeszlosc:
    title: "He must have missed the train. Something must have happened. He might have overslept."
    gloss: "He must have missed the train. Something must have happened. He might have overslept."
    note: "Past speculation in Polish is just the present modal-plus-infinitive pattern with the modal pushed into the past tense (musiał/mógł) -- no separate 'perfect' construction to learn."

  pl.b2.unit02.lesson05.teach.tekst:
    title: "Reading: fact or speculation?"
    gloss: "Tomek was supposed to come in the evening, but he still isn't here. His phone is switched off. He's probably stuck in traffic, since it's rush hour. Maybe he overslept, but I don't know that for sure. One thing is certain: he isn't at home, because his car is gone."
    glosses:
      miał: "was supposed to (mieć + infinitive = planned/expected action)"
      przyjść: "to come"
      wieczorem: "in the evening"
      telefon: phone
      wyłączony: "switched off"
      szczyt: "rush hour / peak (short for godzina szczytu)"
      tego: "that (genitive of to, required by the negated verb nie wiem)"
      jedno: "one thing (neuter of jeden)"
      pewne: "certain (neuter form, agreeing with jedno)"

  pl.b2.unit02.lesson06.teach.widzialam_dzis_rano:
    title: "I saw him this morning."
    gloss: "I saw him this morning. (said by a woman)"
    note: "*Widziałam* is the feminine past-tense form -- Ewa is speaking here, matching Marek's masculine *widziałem* from lesson02."
  pl.b2.unit02.lesson06.teach.dialogue_marek_open:
    title: "Marek: Tomek isn't here yet. Why is he late?"
    gloss: "Marek: Tomek isn't here yet. Why is he late?"
  pl.b2.unit02.lesson06.teach.dialogue_ewa_deduction:
    title: "Ewa: He's surely stuck in traffic. It's rush hour."
    gloss: "Ewa: He's surely stuck in traffic. It's rush hour."
  pl.b2.unit02.lesson06.teach.dialogue_marek_possibility:
    title: "Marek: Might he have overslept?"
    gloss: "Marek: Might he have overslept?"
  pl.b2.unit02.lesson06.teach.dialogue_ewa_rule_out:
    title: "Ewa: No, that's impossible. I saw him this morning."
    gloss: "Ewa: No, that's impossible. I saw him this morning."
  pl.b2.unit02.lesson06.teach.dialogue_marek_past_deduction:
    title: "Marek: Then he must have missed the train."
    gloss: "Marek: Then he must have missed the train."
  pl.b2.unit02.lesson06.teach.dialogue_ewa_guess:
    title: "Ewa: Maybe. I don't know that for sure."
    gloss: "Ewa: Maybe. I don't know that for sure."
  pl.b2.unit02.lesson06.teach.grammar_pelna_spekulacja:
    title: "Tomek isn't here yet. He's surely stuck in traffic. He might have overslept, but he must have missed the train."
    gloss: "Tomek isn't here yet. He's surely stuck in traffic. He might have overslept, but he must have missed the train."
    note: "A full speculation moves between present and past causes at different certainty levels -- exactly what the speaking and writing tasks of this lesson require."

exercises:
  pl.b2.unit02.lesson01.exercise01.recognize_moze:
    instruction: "What does this word mean?"
    correct_option: maybe
    distractors: [probably, "for sure", undoubtedly]
    accepted_answers: [{value: maybe, status: correct}]
    feedback: "Może means maybe -- the weakest point on the certainty scale."
  pl.b2.unit02.lesson01.exercise02.listen_pewnie:
    instruction: "Listen and select what you hear."
    correct_option: "He's surely on the way."
    distractors: ["He's surely at home.", "Maybe he's on the way.", "He isn't on the way."]
    accepted_answers: [{value: "He's surely on the way.", status: correct}]
    feedback: "Pewnie jest w drodze means he's surely on the way."
  pl.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {może: maybe, prawdopodobnie: probably, pewnie: "I bet / most likely", "na pewno": "for sure", "bez wątpienia": "without a doubt", "w drodze": "on the way", "spóźnia się": "is running late", "jeszcze nie ma": "isn't here yet"}
        status: correct
    feedback: "These are this lesson's certainty words, weakest to strongest."
  pl.b2.unit02.lesson01.exercise04.order_pewnie:
    instruction: "Put the words in order: He's surely on the way."
    accepted_answers:
      - {value: "Pewnie jest w drodze", status: correct}
    feedback: "Pewnie jest w drodze means he's surely on the way."
  pl.b2.unit02.lesson01.exercise05.translate_prawdopodobnie:
    instruction: "Translate into Polish, using prawdopodobnie: He is probably on the way."
    accepted_answers:
      - {value: "Prawdopodobnie jest w drodze", status: correct}
      - {value: "Jest prawdopodobnie w drodze", status: correct}
    feedback: "Prawdopodobnie jest w drodze means he is probably on the way."
  pl.b2.unit02.lesson01.exercise06.speak_bez_watpienia:
    instruction: "Say aloud in Polish, using bez wątpienia: He is undoubtedly busy."
    accepted_answers:
      - {value: "Bez wątpienia jest zajęty", status: correct}
      - {value: "Jest bez wątpienia zajęty", status: correct}
    feedback: "Bez wątpienia jest zajęty means he is undoubtedly busy."
  pl.b2.unit02.lesson01.exercise07.write_tomka_nie_ma:
    instruction: "Write in Polish: Tomek isn't here yet."
    accepted_answers:
      - {value: "Tomka jeszcze nie ma", status: correct}
      - {value: "Tomka jeszcze nie ma.", status: correct}
      - {value: "Jeszcze nie ma Tomka", status: correct}
    feedback: "Tomka jeszcze nie ma means Tomek isn't here yet."
  pl.b2.unit02.lesson01.exercise08.dictation_pewnie_w_drodze:
    instruction: "Type what you hear."
    correct_response: "Pewnie jest w drodze."
    orthography_strict: true
    feedback: "You heard Pewnie jest w drodze — he's surely on the way."

  pl.b2.unit02.lesson02.exercise01.recognize_nie_moze:
    instruction: "What does this phrase mean?"
    correct_option: "cannot (be)"
    distractors: [maybe, probably, undoubtedly]
    accepted_answers: [{value: "cannot (be)", status: correct}]
    feedback: "Nie może means cannot (be) -- a confident deduction ruling something out."
  pl.b2.unit02.lesson02.exercise02.listen_musi_korku:
    instruction: "Listen and select what you hear."
    correct_option: "He must be stuck in traffic."
    distractors: ["He might be stuck in traffic.", "He was stuck in traffic.", "He cannot be stuck in traffic."]
    accepted_answers: [{value: "He must be stuck in traffic.", status: correct}]
    feedback: "Musi stać w korku means he must be stuck in traffic."
  pl.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {musi: "must (deduction)", "nie może": "cannot (be)", "to niemożliwe": "that's impossible", bo: because, więc: "so / therefore", "w korku": "stuck in traffic", chory: sick, auto: car}
        status: correct
    feedback: "These are this lesson's deduction words."
  pl.b2.unit02.lesson02.exercise04.order_nie_moze_byc_chory:
    instruction: "Put the words in order: He cannot be sick."
    accepted_answers:
      - {value: "Nie może być chory", status: correct}
    feedback: "Nie może być chory means he cannot be sick."
  pl.b2.unit02.lesson02.exercise05.translate_musi_korku:
    instruction: "Translate into Polish, using musi (deduction): He must be stuck in traffic."
    accepted_answers:
      - {value: "Musi stać w korku", status: correct}
      - {value: "Musi być w korku", status: correct}
    feedback: "Musi stać w korku means he must be stuck in traffic."
  pl.b2.unit02.lesson02.exercise06.write_nie_moze:
    instruction: "Write in Polish, using nie może: He cannot be sick."
    accepted_answers:
      - {value: "Nie może być chory", status: correct}
      - {value: "Nie może być chory.", status: correct}
    feedback: "Nie może być chory means he cannot be sick."
  pl.b2.unit02.lesson02.exercise07.translate_bo:
    instruction: "Translate into Polish, using bo to give your evidence: He cannot be sick, because I saw him this morning."
    accepted_answers:
      - {value: "Nie może być chory, bo widziałem go dziś rano", status: correct}
      - {value: "Nie może być chory, bo widziałem go dziś rano.", status: correct}
      - {value: "Nie może być chory, bo widziałam go dziś rano", status: correct}
      - {value: "Nie może być chory, bo widziałam go dziś rano.", status: correct}
    feedback: "Nie może być chory, bo widziałem go dziś rano means he cannot be sick, because I saw him this morning."
  pl.b2.unit02.lesson02.exercise08.dictation_musi_korku:
    instruction: "Type what you hear."
    correct_response: "Musi stać w korku."
    orthography_strict: true
    feedback: "You heard Musi stać w korku — he must be stuck in traffic."

  pl.b2.unit02.lesson03.exercise01.recognize_chyba:
    instruction: "What does this word mean?"
    correct_option: "perhaps / I guess"
    distractors: [because, undoubtedly, therefore]
    accepted_answers: [{value: "perhaps / I guess", status: correct}]
    feedback: "Chyba marks a plain guess, with no evidence behind it."
  pl.b2.unit02.lesson03.exercise02.listen_moglby:
    instruction: "Listen and select what you hear."
    correct_option: "He might be at home."
    distractors: ["He must be at home.", "He is at home.", "He might be on the way."]
    accepted_answers: [{value: "He might be at home.", status: correct}]
    feedback: "Mógłby być w domu means he might be at home."
  pl.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
