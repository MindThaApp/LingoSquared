  pl.b2.unit02.lesson05.exercise01.read_fact:
    instruction: "Which of these does the writer state as a FACT, not as speculation?"
    correct_option: "His car is gone."
    distractors: ["He is stuck in traffic.", "He overslept.", "He forgot the appointment."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "The writer states as fact: jego auto zniknęło (his car is gone)."
  pl.b2.unit02.lesson05.exercise02.read_guess:
    instruction: "Which cause does the writer only GUESS at, admitting they are not sure?"
    correct_option: "That he overslept."
    distractors: ["That he is stuck in traffic.", "That his phone is switched off.", "That his car is gone."]
    accepted_answers: [{value: "That he overslept.", status: correct}]
    feedback: "The writer guesses: może zaspał, ale nie wiem tego na pewno (maybe he overslept, but I don't know that for sure)."
  pl.b2.unit02.lesson05.exercise03.read_deduction:
    instruction: "How certain is the writer that Tomek is stuck in traffic, and on what basis?"
    correct_option: "Fairly certain, deducing it from rush hour."
    distractors: ["Completely certain, having seen it himself.", "Not at all certain, a pure guess with no basis.", "Certain it is false."]
    accepted_answers: [{value: "Fairly certain, deducing it from rush hour.", status: correct}]
    feedback: "Pewnie stoi w korku, bo jest szczyt -- a fairly confident deduction (pewnie), anchored to the evidence that it's rush hour."
  pl.b2.unit02.lesson05.exercise04.read_evidence:
    instruction: "What is the writer's evidence that Tomek is not at home?"
    correct_option: "His car is gone."
    distractors: ["His phone is switched off.", "It is rush hour.", "He is often late."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "The evidence: bo jego auto zniknęło (because his car is gone)."
  pl.b2.unit02.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {wieczorem: "in the evening", telefon: phone, wyłączony: "switched off", szczyt: "rush hour / peak", jedno: "one thing", pewne: certain}
        status: correct
    feedback: "These are the reading's key words."
