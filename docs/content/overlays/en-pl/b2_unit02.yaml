    feedback: "Jego telefon jest wyłączony means his phone is switched off."
  pl.b2.unit02.lesson05.exercise07.write_szczyt:
    instruction: "Write in Polish: It is rush hour."
    accepted_answers:
      - {value: "Jest szczyt", status: correct}
      - {value: "Jest szczyt.", status: correct}
    feedback: "Jest szczyt means it is rush hour."

  pl.b2.unit02.lesson06.exercise01.comprehend_first_cause:
    instruction: "What is Ewa's first explanation for why Tomek is late?"
    correct_option: "He's stuck in traffic."
    distractors: ["He overslept.", "He forgot the meeting.", "He missed the train."]
    accepted_answers: [{value: "He's stuck in traffic.", status: correct}]
    feedback: "Ewa's first explanation: Pewnie stoi w korku."
  pl.b2.unit02.lesson06.exercise02.comprehend_certainty:
    instruction: "When Ewa says 'to niemożliwe' about oversleeping, how certain is she, and why?"
    correct_option: "Completely certain -- she saw him that morning."
    distractors: ["Not certain at all, just guessing.", "Fairly certain, but with no real evidence.", "Certain that he DID oversleep."]
    accepted_answers: [{value: "Completely certain -- she saw him that morning.", status: correct}]
    feedback: "Ewa rules it out completely: Nie, to niemożliwe. Widziałam go dziś rano (No, that's impossible. I saw him this morning)."
  pl.b2.unit02.lesson06.exercise03.comprehend_guess:
    instruction: "Is Ewa's final line ('Może. Nie wiem tego na pewno.') a deduction or a guess?"
    correct_option: "A guess -- she openly admits she isn't sure."
    distractors: ["A deduction from clear evidence.", "A statement of fact.", "A denial of Marek's claim."]
    accepted_answers: [{value: "A guess -- she openly admits she isn't sure.", status: correct}]
    feedback: "Może. Nie wiem tego na pewno -- Ewa marks it explicitly as a guess, not a deduction."
  pl.b2.unit02.lesson06.exercise04.order_widzialam:
    instruction: "Put the words in order: I saw him this morning."
    accepted_answers:
      - {value: "Widziałam go dziś rano", status: correct}
    feedback: "Widziałam go dziś rano means I saw him this morning."
  pl.b2.unit02.lesson06.exercise05.speak_musi_korku:
    instruction: "Tomek's car is gone and it's rush hour, but he isn't here. Speculate aloud about the present cause, using musi (deduction): He must be stuck in traffic."
    accepted_answers:
      - {value: "Musi stać w korku", status: correct}
      - {value: "Musi być w korku", status: correct}
    feedback: "Musi stać w korku means he must be stuck in traffic."
  pl.b2.unit02.lesson06.exercise06.write_past_and_present:
    instruction: "Write TWO Polish sentences speculating about why Tomek is late, at DIFFERENT certainty levels. (1) A PAST cause you are sure of (deduction), using musiał: He must have missed the train. (2) A PRESENT cause you are less sure of, using pewnie: He is probably stuck in traffic."
    accepted_answers:
      - {value: "Musiał przegapić pociąg. Pewnie stoi w korku", status: correct}
      - {value: "Musiał przegapić pociąg. Pewnie stoi w korku.", status: correct}
    feedback: "Two sentences at different certainty levels: Musiał przegapić pociąg. Pewnie stoi w korku."
  pl.b2.unit02.lesson06.exercise07.respond_speculate:
    instruction: "Dlaczego Tomek się spóźnia?"
    correct_option: "He's surely stuck in traffic."
    distractors: ["He never comes on time.", "He isn't coming today.", "He is already here."]
    accepted_answers: [{value: "He's surely stuck in traffic.", status: correct}]
    feedback: "Pewnie stoi w korku means he's surely stuck in traffic -- a reasonable speculation, given it's rush hour."
