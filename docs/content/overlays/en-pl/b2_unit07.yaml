    correct_response: "Robię zakupy."
    orthography_strict: true
    feedback: "You heard Robię zakupy — I'm doing the shopping."

  pl.b2.unit07.lesson02.exercise01.recognize_niestety:
    instruction: "What does this word mean?"
    correct_option: unfortunately
    distractors: [completely, always, unless]
    accepted_answers: [{value: unfortunately, status: correct}]
    feedback: "Niestety means unfortunately."
  pl.b2.unit07.lesson02.exercise02.listen_to_sie_nie_uda:
    instruction: "Listen and select what you hear."
    correct_option: "That won't work."
    distractors: ["That will work.", "That's a good idea.", "That's not true."]
    accepted_answers: [{value: "That won't work.", status: correct}]
    feedback: "To się nie uda means that won't work."
