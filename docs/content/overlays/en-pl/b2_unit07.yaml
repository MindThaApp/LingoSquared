review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for pl's seventh B2 unit (negotiation), authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) this unit's negotiation vocabulary is deliberately built
    from present/future tense throughout (proponuję, mogę, zrobię,
    ugotuję), which never marks gender in Polish -- the one exception,
    "wolałbym/wolałabym nie" (I'd rather not, conditional), is flagged
    explicitly in lesson02 as the single gender-marked frame in this
    unit; (2) Polish requires a comma before "że"/"jeśli"/"chyba że" in
    all the conditional-concession frames, exactly as in earlier units;
    (3) "pod warunkiem że" (on condition that), "o ile" (provided that),
    and "chyba że" (unless) are near-synonymous conditional connectives
    that a learner might blur -- each is glossed with its own English
    equivalent to keep them distinct, though all three are broadly
    interchangeable in this unit's actual usage. No sibling-direction
    file (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    Realization: lesson05 exercise01-04 (reading_comprehension) -- prompt
    never showed the dialogue text -> added it as a pl target_block before
    the question (comprehension-without-text); lesson03 exercise03
    match_conditions -- lefts 'pod warunkiem że' (on condition that) and
    'o ile' (provided that) had interchangeable glosses -> replaced the o
    ile pair with ugotujesz: you'll cook (taught in the same lesson),
    tested_text updated (duplicate/ambiguous). Overlay: matching key
    mirrored; lesson03 exercise02 listen distractor 'I can't cook unless
    you do the dishes.' is logically equivalent to the correct 'I can
    cook, but only if you do the dishes.' -> 'I can't cook today.'
    (second-correct-distractor); missing accepted answers added: lesson01
    exercise05 + A może razem to zrobimy; exercise07 + Dziś/Dzisiaj robimy
    razem kolację, Robimy dzisiaj razem kolację; lesson02 exercise07 + Nie
    mogę wszystkiego zrobić; lesson03 exercise05/07 and lesson06
    exercise06 + ty-dropped variants (że ugotujesz / jeśli zmyjesz -- the
    grader's pronoun-drop rule only covers a clause-initial pronoun);
    exercise06/07 + 'zmyjesz naczynia' variants (prompt says 'do the
    dishes'), exercise06 + perfective Mogę ugotować; lesson04 exercise07 +
    Dzielimy się rachunkiem / Podzielmy rachunek; lesson06 exercise05 +
    fully pronoun-dropped variant. NATIVE CHECK: 'Proponuję, że ja
    ugotuję' (proponować + że + future) -- colloquially common, but
    confirm it is acceptable vs 'Proponuję, że(by)m ja ugotował(a)'.
    Second-pass review 2026-10-19: 2 fixes - false note: teach.wolalbym
    said the -by- particle carries the speaker's gender (it is the past-
    tense stem wolał-/wolała-) -> corrected; missing answers: lesson06
    exercise05 + the two mixed pronoun-drop variants (only one of ja/ty
    dropped -- neither is clause-initial, so the grader's pronoun-drop
    rule does not cover them). NATIVE FLAGS: see realization.

course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: negotiate and resolve a disagreement --
    propose terms (proponuję, że / a może), decline a term politely
    (niestety nie mogę / to się nie uda), offer a conditional concession
    (ale tylko jeśli / pod warunkiem że / o ile / chyba że), and reach
    agreement (umowa stoi / zgoda), around hosting a dinner together.

units:
  pl.b2.unit07.negocjacje:
    title: "Negotiation"
    description: Negotiate an outcome -- propose terms, decline an unacceptable one, offer a conditional concession, and reach or decline an agreement while keeping the relationship intact.

lessons:
  pl.b2.unit07.lesson01.propozycja:
    title: "Making a proposal"
  pl.b2.unit07.lesson02.grzeczna_odmowa:
    title: "A polite refusal"
  pl.b2.unit07.lesson03.warunek:
    title: "Setting a condition"
  pl.b2.unit07.lesson04.dochodzenie_do_porozumienia:
    title: "Reaching an agreement"
  pl.b2.unit07.lesson05.co_zostalo_ustalone:
    title: "What was settled?"
  pl.b2.unit07.lesson06.negocjacje_w_rozmowie:
    title: "Negotiating in conversation"

teaching:
  pl.b2.unit07.lesson01.teach.robimy_kolacje:
    title: "We're making dinner together today."
    gloss: "We're making dinner together today."
    note: "*Kolację* is the accusative of *kolacja* ('dinner'), the object of *robimy* ('we're making')."
  pl.b2.unit07.lesson01.teach.gotowac:
    title: "to cook"
    gloss: "to cook"
    example_gloss: "I like to cook."
  pl.b2.unit07.lesson01.teach.zakupy:
    title: "the shopping / groceries"
    gloss: "the shopping / the groceries"
    example_gloss: "I'm doing the shopping."
  pl.b2.unit07.lesson01.teach.proponuje_ze:
    title: "I propose that..."
    gloss: "I propose that..."
    note: "*Proponuję, że...* states your terms directly. Present tense -- no gender marking."
    example_gloss: "I propose that I cook."
  pl.b2.unit07.lesson01.teach.a_moze:
    title: "how about...?"
    gloss: "how about...? / what if...?"
    example_gloss: "How about we do it together?"
  pl.b2.unit07.lesson01.teach.moj_pomysl:
    title: "my idea is..."
    gloss: "my idea is..."
    example_gloss: "My idea is cooking together."
  pl.b2.unit07.lesson01.teach.grammar_propozycja:
    title: "I propose that I cook. My idea is cooking together. How about we do it together?"
    gloss: "I propose that I cook. My idea is cooking together. How about we do it together?"
    note: "Three ways to state or open a proposal: *proponuję, że*, *mój pomysł to*, and the softer *a może...?*."

  pl.b2.unit07.lesson02.teach.niestety_nie_moge:
    title: "Unfortunately I can't."
    gloss: "Unfortunately I can't."
    note: "*Niestety nie mogę* -- present tense, no gender marking, the polite way to open a decline."
  pl.b2.unit07.lesson02.teach.to_sie_nie_uda:
    title: "That won't work."
    gloss: "That won't work."
  pl.b2.unit07.lesson02.teach.nie_moge_sie_zgodzic:
    title: "I can't agree to that."
    gloss: "I can't agree to that."
    note: "*Zgodzić się na coś* ('to agree to something') governs *na* + accusative: *na to* ('to that')."
  pl.b2.unit07.lesson02.teach.wolalbym:
    title: "I'd rather (masculine / feminine)"
    gloss: "I'd rather... (conditional)"
    note: "*Wolałbym* (a man speaking) / *wolałabym* (a woman speaking) is THE gender-marked frame in this unit -- the past-tense stem before the conditional *-by-* carries the speaker's gender (*wolał-* for a man, *wolała-* for a woman). Always produce the form matching your own gender."
    example_gloss: "I'd rather not. I'd rather not."
  pl.b2.unit07.lesson02.teach.musze_posprzatac:
    title: "I still have to clean"
    gloss: "I still have to clean"
  pl.b2.unit07.lesson02.teach.nie_moge_wszystkiego:
    title: "I can't do everything."
    gloss: "I can't do everything."
    note: "*Wszystkiego* is the genitive of *wszystko* ('everything'), governed by negated *zrobić*."
  pl.b2.unit07.lesson02.teach.grammar_odmowa:
    title: "Unfortunately I can't. That won't work. I can't agree to that."
    gloss: "Unfortunately I can't. That won't work. I can't agree to that."
    note: "A polite decline in Polish stays present-tense and gender-neutral -- *niestety nie mogę*, *to się nie uda*, *nie mogę się na to zgodzić* -- except the softer *wolałbym/wolałabym nie*."

  pl.b2.unit07.lesson03.teach.zmywac_naczynia:
    title: "to do the dishes"
    gloss: "to do the dishes / to wash the dishes"
    example_gloss: "I'm doing the dishes."
  pl.b2.unit07.lesson03.teach.jesli_to:
    title: "If you do the dishes, then I'll cook."
    gloss: "If you do the dishes, then I'll cook."
    note: "*Jeśli...to...* -- the basic if-then frame. *Zmyjesz* is the perfective future ('you will [have] wash[ed]'), not marked for gender."
  pl.b2.unit07.lesson03.teach.ale_tylko_jesli:
    title: "I can cook, but only if you do the dishes."
    gloss: "I can cook, but only if you do the dishes."
  pl.b2.unit07.lesson03.teach.pod_warunkiem:
    title: "on condition that..."
    gloss: "on condition that..."
    example_gloss: "I'll do the shopping, on condition that you cook."
  pl.b2.unit07.lesson03.teach.o_ile:
    title: "provided that"
    gloss: "provided that"
    example_gloss: "I'll cook, provided that you do the dishes."
  pl.b2.unit07.lesson03.teach.chyba_ze:
    title: unless
    gloss: unless
    example_gloss: "I'll do it, unless you prefer otherwise."
  pl.b2.unit07.lesson03.teach.zgadzam_sie_tylko_jesli:
    title: "I agree, but only if you do the dishes."
    gloss: "I agree, but only if you do the dishes."
  pl.b2.unit07.lesson03.teach.grammar_warunek:
    title: "I can cook, but only if you do the dishes. I agree, on condition that you do the shopping."
    gloss: "I can cook, but only if you do the dishes. I agree, on condition that you do the shopping."
    note: "The core negotiation act: a conditional concession. *Ale tylko jeśli*, *pod warunkiem że*, *o ile*, and *chyba że* all attach a condition to what you're willing to give -- all present/future tense, no gender marking."

  pl.b2.unit07.lesson04.teach.umowa_stoi:
    title: "Deal!"
    gloss: "Deal! (literally: 'the agreement stands')"
  pl.b2.unit07.lesson04.teach.zgoda:
    title: "Agreed."
    gloss: "Agreed."
    example_gloss: "Agreed, let's do it that way."
  pl.b2.unit07.lesson04.teach.calkowicie_sie_zgadzam:
    title: "I completely agree."
    gloss: "I completely agree."
  pl.b2.unit07.lesson04.teach.rachunek:
    title: "the bill"
    gloss: "the bill"
    example_gloss: "We're splitting the bill."
  pl.b2.unit07.lesson04.teach.placic_polowe:
    title: "to pay half"
    gloss: "to pay half"
    example_gloss: "You pay half."
  pl.b2.unit07.lesson04.teach.dogadujemy_sie:
    title: "We reach an agreement."
    gloss: "We reach an agreement. / We work it out."
    note: "*Dogadujemy się* is 1st-person PLURAL present -- gender-safe regardless of who is in the pair, since Polish present tense never marks gender."
  pl.b2.unit07.lesson04.teach.grammar_porozumienie:
    title: "Shall we split the bill? Deal. Agreed, I completely agree."
    gloss: "Shall we split the bill? Deal. Agreed, I completely agree."
    note: "Reaching agreement: *umowa stoi*, *zgoda*, *całkowicie się zgadzam*, and *dogadujemy się* all close out a negotiation once terms are settled."

  pl.b2.unit07.lesson05.teach.tekst:
    title: "Reading: what was settled?"
    gloss: "Ewa: I propose that I do the shopping. Can we cook together? Marek: I'll do the shopping, because I have to go out anyway. But I agree, on condition that you do the dishes. Ewa: Deal. And the bill? Marek: We split it half each. We'll talk about dessert tomorrow."
    glosses:
      Możemy: "can we"
      bo: because
      i: and
      tak: "anyway (i tak = anyway)"
      wyjść: "to go out / leave"
      po: "(po połowie = half each)"
      deser: dessert
      porozmawiamy: "we'll talk"
      jutro: tomorrow

  pl.b2.unit07.lesson06.teach.dobry_pomysl:
    title: "Good idea."
    gloss: "Good idea."
  pl.b2.unit07.lesson06.teach.zrobisz_tez:
    title: "Will you also do...?"
    gloss: "Will you also do...?"
  pl.b2.unit07.lesson06.teach.dialogue_marek_open:
    title: "Marek: Shall we make dinner together today?"
    gloss: "Marek: Shall we make dinner together today?"
  pl.b2.unit07.lesson06.teach.dialogue_ewa_propose:
    title: "Ewa: Good idea. I propose that I cook."
    gloss: "Ewa: Good idea. I propose that I cook."
  pl.b2.unit07.lesson06.teach.dialogue_marek_ask:
    title: "Marek: Will you also do the shopping?"
    gloss: "Marek: Will you also do the shopping?"
  pl.b2.unit07.lesson06.teach.dialogue_ewa_decline_concede:
    title: "Ewa: Unfortunately I can't, I still have to clean. But I agree, on condition that you do the dishes."
    gloss: "Ewa: Unfortunately I can't, I still have to clean. But I agree, on condition that you do the dishes."
  pl.b2.unit07.lesson06.teach.dialogue_marek_bill:
    title: "Marek: Deal. And we split the bill."
    gloss: "Marek: Deal. And we split the bill."
  pl.b2.unit07.lesson06.teach.dialogue_ewa_agree:
    title: "Ewa: Agreed."
    gloss: "Ewa: Agreed."
  pl.b2.unit07.lesson06.teach.grammar_pelny_ruch:
    title: "I propose that I cook. Unfortunately I can't do the shopping, but I agree, on condition that you do the dishes."
    gloss: "I propose that I cook. Unfortunately I can't do the shopping, but I agree, on condition that you do the dishes."
    note: "A complete negotiation move has three parts: state terms (*proponuję, że*), decline one task (*niestety nie mogę*), and offer a conditional concession (*pod warunkiem że*) -- exactly what the speaking and writing tasks of this lesson require."

