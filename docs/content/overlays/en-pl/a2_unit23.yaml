review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Third en-pl A2 overlay, written for pl/a2_unit23_w_banku.yaml
    (schema_version 1.1, §19 format from the start). No sibling-direction
    overlay exists yet (pl-en unauthored), so §8 doesn't apply.

    No genuinely ambiguous multi-clause join exists in this unit (the one
    two-clause sentence, "Potrzebuję dowodu osobistego, żeby otworzyć
    konto," uses żeby as the only natural connector for a purpose clause --
    no comma/period/conjunction variant makes sense the way an "and"-joined
    reason clause would). Every note/feedback string mixing Polish text
    inline with English wraps the Polish in *asterisks* per §15. Every
    matching_pairs correct_response and word_order correct_response checked
    token-for-token against the realization's own pairs/word_bank. No stray
    YAML boolean coercion. Pending fresh-context review per AUTHORING_GUIDE
    §9; not self-certified.

answer_policy:
  diacritics: >-
    Same standing policy as unit01-22: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !, ,) may
    be omitted or varied in typed answers, but the fully punctuated form
    remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Marek) and the PESEL
    abbreviation.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit23.w_banku:
    title: "At the bank"

lessons:
  pl.a2.unit23.lesson01.slownictwo_bankowe:
    title: "Bank vocabulary"
  pl.a2.unit23.lesson02.chcialbym_otworzyc_konto:
    title: "I would like to open an account"
  pl.a2.unit23.lesson03.otwieramy_konto:
    title: "We're opening an account"

teaching:
  pl.a2.unit23.lesson01.teach.recap_words:
    title: "Good day, please, thank you -- again"
    gloss: "Dzień, dobry, Proszę, dziękuję, jest, mam, ma, i, w, Tak, Czy, numer, chcę, chce, pan, bardzo -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them to talk about the bank."

  pl.a2.unit23.lesson01.teach.bank:
    title: "Bank"
    gloss: "bank"
    note: "A masculine noun."
    example_gloss: "I'm going to the bank."

  pl.a2.unit23.lesson01.teach.konto:
    title: "Account"
    gloss: "account"
    note: "A neuter noun."
    example_gloss: "I have an account at the bank."

  pl.a2.unit23.lesson01.teach.pieniadze:
    title: "Money"
    gloss: "money"
    note: "Always plural in Polish, like English \"money\" itself."
    example_gloss: "I have a lot of money."

  pl.a2.unit23.lesson01.teach.pesel:
    title: "PESEL number"
    gloss: "PESEL number"
    note: "Poland's universal national ID number, required to open a bank account."
    example_gloss: "I have a PESEL number."

  pl.a2.unit23.lesson01.teach.dowod_osobisty_recap:
    title: "ID card -- again"
    gloss: "ID card"
    note: "You already know this phrase from the office-visit lesson; redeclared here since this is a new file."
    example_gloss: "This is my ID card."

  pl.a2.unit23.lesson02.teach.chcialbym_note:
    title: "I would like to -- masculine form"
    gloss: "Chciałbym -- the masculine form of \"chciałabym\" (you already know \"chciałabym\" from the office-visit lesson)."
    note: "Same grammar point, different gender -- Marek says *chciałbym*, Ewa said *chciałabym*."

  pl.a2.unit23.lesson02.teach.otworzyc_konto_phrase:
    title: "I would like to open a bank account"
    gloss: "I would like to open a bank account."
    note: "*bankowe* is the neuter form of *bankowy*, matching *konto*."

  pl.a2.unit23.lesson02.teach.potrzebuje_genitive_note:
    title: "I need -- with the genitive case"
    gloss: "potrzebować + genitive -- \"potrzebuję dowodu osobistego\" (I need an ID card): *dowód osobisty* changes form after *potrzebuję*."
    note: "A real new grammar point: certain verbs, including *potrzebować*, require the object to be in the genitive case, not the plain dictionary form."

  pl.a2.unit23.lesson02.teach.zeby_note:
    title: "In order to"
    gloss: "żeby + infinitive = \"in order to\", e.g. żeby otworzyć konto (in order to open an account)."
    note: "A purpose clause -- different from *ponieważ*/*bo* (reason), which you saw in earlier lessons."

  pl.a2.unit23.lesson02.teach.potrzebuje_zeby_phrase:
    title: "I need an ID card in order to open an account"
    gloss: "I need an ID card, in order to open an account."
    note: "Combines this lesson's two new grammar points in one natural sentence."

  pl.a2.unit23.lesson03.teach.sto_zlotych:
    title: "One hundred zloty"
    gloss: "one hundred zloty"
    note: "Reused from the shopping/clothing lessons -- the same amount, a fresh context."
    example_gloss: "That costs one hundred zloty."

  pl.a2.unit23.lesson03.teach.wplacic:
    title: "To deposit"
    gloss: "to deposit"
    note: "Used for putting money into an account."
    example_gloss: "I want to deposit money."

  pl.a2.unit23.lesson03.teach.ile_pieniedzy_note:
    title: "How much money?"
    gloss: "Ile pieniędzy...? -- \"ile\" (how much/many) takes the genitive case, asking about quantity."
    note: "The same genitive-government pattern as *potrzebuję dowodu*, applied to a question word."

  pl.a2.unit23.lesson03.teach.swietnie_gotowe:
    title: "Great, ready"
    gloss: "Świetnie, gotowe -- two new words: \"great\" and \"ready\"."
    note: "*gotowe* is the neuter form, matching *konto*."

  pl.a2.unit23.teach.dialogue.line01:
    title: "The bank employee greets Marek"
    gloss: "Good day! How can I help?"
    note: "The same office-visit greeting convention this course already established."
  pl.a2.unit23.teach.dialogue.line02:
    title: "Marek states his request"
    gloss: "I would like to open a bank account."
    note: "Marek uses the masculine conditional this lesson just taught."
  pl.a2.unit23.teach.dialogue.line03:
    title: "The employee asks for documents"
    gloss: "Of course. Do you have your ID card and PESEL number, sir?"
    note: "The two documents genuinely required to open a Polish bank account."
  pl.a2.unit23.teach.dialogue.line04:
    title: "Marek confirms and hands them over"
    gloss: "Yes, I have them. Here you go."
    note: "A short, natural confirmation."
  pl.a2.unit23.teach.dialogue.line05:
    title: "The employee asks the deposit amount"
    gloss: "Thank you. How much money would you like to deposit, sir?"
    note: "Reuses this lesson's genitive-question pattern."
  pl.a2.unit23.teach.dialogue.line06:
    title: "Marek states the amount"
    gloss: "I want to deposit one hundred zloty."
    note: "The specific amount this unit establishes only once."
  pl.a2.unit23.teach.dialogue.line07:
    title: "The employee confirms the account is ready"
    gloss: "Great. The account is ready."
    note: "Closes the exchange -- Marek's account-opening errand is complete."

exercises:
  pl.a2.unit23.lesson01.exercise01.select_bank:
    instruction: "Which word means 'bank'?"
    correct_option: "bank"
    distractors: ["konto", "pieniądze"]
    accepted_answers: ["bank"]

  pl.a2.unit23.lesson01.exercise02.select_konto:
    instruction: "Which word means 'account'?"
    correct_option: "konto"
    distractors: ["bank", "PESEL"]
    accepted_answers: ["konto"]

  pl.a2.unit23.lesson01.exercise03.select_pesel:
    instruction: "Which word refers to Poland's national ID number?"
    correct_option: "PESEL"
    distractors: ["bank", "konto"]
    accepted_answers: ["PESEL"]

  pl.a2.unit23.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "bank": "bank"
      "konto": "account"
      "pieniądze": "money"
      "PESEL": "PESEL number"
      "dowód osobisty": "ID card"

  pl.a2.unit23.lesson01.exercise05.order_mam_konto:
    instruction: "Put the sentence 'I have an account' in order."
    correct_response: ["Mam", "konto"]

  pl.a2.unit23.lesson01.exercise06.order_mam_numer_pesel:
    instruction: "Put the sentence 'I have a PESEL number' in order."
    correct_response: ["Mam", "numer", "PESEL"]

  pl.a2.unit23.lesson01.exercise07.fill_prosze_pesel:
    instruction: "Complete the sentence: 'Please give me your ID card and ___ number.' (PESEL)"
    accepted_answers: ["PESEL"]
    feedback: "Proszę dowód osobisty i numer PESEL -- PESEL is Poland's national ID number."

  pl.a2.unit23.lesson01.exercise08.fix_mam_konto:
    instruction: "Fix the word order -- put the sentence 'I have an account' in the natural order."
    accepted_answers:
      - "Mam konto."
      - "Mam konto"
    feedback: "Mam konto, not Konto mam -- the verb comes first here."

  pl.a2.unit23.lesson01.exercise09.write_pieniadze:
    instruction: "Write the Polish word for 'money'."
    accepted_answers:
      - "pieniądze"

  pl.a2.unit23.lesson02.exercise01.select_chcialbym_otworzyc_konto:
    instruction: "Which sentence politely says 'I would like to open a bank account'?"
    correct_option: "Chciałbym otworzyć konto bankowe."
    distractors: ["Mam numer PESEL.", "Potrzebuję dowodu osobistego."]
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"

  pl.a2.unit23.lesson02.exercise02.select_potrzebuje_zeby:
    instruction: "Which sentence explains a purpose using 'in order to'?"
    correct_option: "Potrzebuję dowodu osobistego, żeby otworzyć konto."
    distractors: ["Chciałbym otworzyć konto bankowe.", "Mam konto."]
    accepted_answers:
      - "Potrzebuję dowodu osobistego, żeby otworzyć konto."
      - "Potrzebuję dowodu osobistego, żeby otworzyć konto"

  pl.a2.unit23.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "bank": "bank"
      "konto": "account"
      "pieniądze": "money"
      "Chciałbym": "I would like (masculine)"
      "otworzyć": "to open"
      "potrzebuję": "I need"
      "żeby": "in order to"

  pl.a2.unit23.lesson02.exercise04.order_chcialbym_otworzyc_konto:
    instruction: "Put the sentence 'I would like to open a bank account' in order."
    correct_response: ["Chciałbym", "otworzyć", "konto", "bankowe"]

  pl.a2.unit23.lesson02.exercise05.order_potrzebuje_zeby:
    instruction: "Put the sentence 'I need an ID card, in order to open an account' in order (no punctuation needed)."
    correct_response: ["Potrzebuję", "dowodu", "osobistego", "żeby", "otworzyć", "konto"]

  pl.a2.unit23.lesson02.exercise06.fill_chcialbym:
    instruction: "Complete the sentence: '___ I would like to open a bank account.'"
    accepted_answers: ["Chciałbym"]
    feedback: "Chciałbym otworzyć konto bankowe -- Chciałbym is the polite masculine 'I would like'."

  pl.a2.unit23.lesson02.exercise07.fix_chcialbym_otworzyc_konto:
    instruction: "Fix the word order -- put the sentence 'I would like to open a bank account' in the natural order."
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"
    feedback: "Chciałbym otworzyć konto bankowe, not Konto bankowe chciałbym otworzyć -- Chciałbym comes first."

  pl.a2.unit23.lesson02.exercise08.reply_w_czym_moge_panu_pomoc:
    instruction: "The employee asks: 'How can I help you, sir?' Answer as Marek: say you'd like to open a bank account."
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"

  pl.a2.unit23.lesson02.exercise09.write_potrzebuje_zeby:
    instruction: "Write: 'I need an ID card, in order to open an account.'"
    accepted_answers:
      - "Potrzebuję dowodu osobistego, żeby otworzyć konto."
      - "Potrzebuję dowodu osobistego, żeby otworzyć konto"

  pl.a2.unit23.lesson02.exercise10.speak_chcialbym_otworzyc_konto:
    instruction: "Say: 'I would like to open a bank account.'"
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"

  pl.a2.unit23.lesson03.exercise01.select_marek_requests_account:
    instruction: "Which line shows Marek requesting to open an account?"
    correct_option: "Chciałbym otworzyć konto bankowe."
    distractors:
      - "Tak, mam. Proszę bardzo."
      - "Chcę wpłacić sto złotych."
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"

  pl.a2.unit23.lesson03.exercise02.select_documents_question:
    instruction: "Which line asks Marek whether he has his documents?"
    correct_option: "Oczywiście. Czy ma pan dowód osobisty i numer PESEL?"
    distractors:
      - "Dzień dobry! W czym mogę pomóc?"
      - "Dziękuję. Ile pieniędzy chce pan wpłacić?"
    accepted_answers:
      - "Oczywiście. Czy ma pan dowód osobisty i numer PESEL?"
      - "Oczywiście. Czy ma pan dowód osobisty i numer PESEL"

  pl.a2.unit23.lesson03.exercise03.comprehend_required_documents:
    instruction: "Read the line. What documents does the employee ask for?"
    correct_option: "ID card and PESEL number"
    distractors:
      - "a passport only"
      - "nothing at all"
    accepted_answers:
      - "dowód osobisty numer PESEL"
      - "ID card and PESEL number"

  pl.a2.unit23.lesson03.exercise04.comprehend_deposit_amount:
    instruction: "Read the line. How much money does Marek deposit?"
    correct_option: "one hundred zloty"
    distractors:
      - "fifty zloty"
      - "two hundred zloty"
    accepted_answers:
      - "sto złotych"
      - "one hundred zloty"

  pl.a2.unit23.lesson03.exercise05.read_account_ready:
    instruction: "According to the dialogue, is Marek's account ready?"
    correct_option: "yes, it's ready"
    distractors:
      - "no, he must come back tomorrow"
      - "the dialogue doesn't say"
    accepted_answers:
      - "Konto jest gotowe"
      - "yes, it's ready"

  pl.a2.unit23.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "bank": "bank"
      "konto": "account"
      "pieniądze": "money"
      "PESEL": "PESEL number"
      "dowód osobisty": "ID card"
      "Chciałbym": "I would like (masculine)"
      "otworzyć": "to open"
      "sto złotych": "one hundred zloty"
      "wpłacić": "to deposit"

  pl.a2.unit23.lesson03.exercise07.order_czy_ma_pan_dowod:
    instruction: "Put the question 'Do you have your ID card and PESEL number, sir?' in order."
    correct_response: ["Czy", "ma", "pan", "dowód", "osobisty", "i", "numer", "PESEL"]

  pl.a2.unit23.lesson03.exercise08.fill_ile_pieniedzy_wplacic:
    instruction: "Complete the question: 'How much money would you like to ___, sir?' (deposit)"
    accepted_answers: ["wpłacić"]
    feedback: "Ile pieniędzy chce pan wpłacić? -- wpłacić is the word for to deposit."

  pl.a2.unit23.lesson03.exercise09.fix_chce_wplacic_sto_zlotych:
    instruction: "Fix the word order -- put the sentence 'I want to deposit one hundred zloty' in the natural order."
    accepted_answers:
      - "Chcę wpłacić sto złotych."
      - "Chcę wpłacić sto złotych"
    feedback: "Chcę wpłacić sto złotych, not Sto złotych chcę wpłacić -- Chcę comes first here."

  pl.a2.unit23.lesson03.exercise10.reply_ile_pieniedzy_chce_pan_wplacic:
    instruction: "The employee asks: 'How much money would you like to deposit, sir?' Answer as Marek: say one hundred zloty."
    accepted_answers:
      - "Chcę wpłacić sto złotych."
      - "Chcę wpłacić sto złotych"

  pl.a2.unit23.lesson03.exercise11.speak_chcialbym_otworzyc_konto:
    instruction: "Say: 'I would like to open a bank account.'"
    accepted_answers:
      - "Chciałbym otworzyć konto bankowe."
      - "Chciałbym otworzyć konto bankowe"
