teaching:
  pl.a2.unit79.lesson01.teach.prosby: {"title": "Polite requests", "gloss": "I'll have, please / I ask for / can you / to me / to help / thank you very much", "note": "Use *poproszę* or *proszę o* when you ask for something. *Czy możesz mi pomóc?* is a direct polite way to ask for help.", "example_gloss": ["I'll have a coffee, please.", "Water, please.", "Can you help me?", "Thank you very much."]}
  pl.a2.unit79.lesson01.teach.rzeczy: {"title": "Things to ask for", "gloss": "coffee / tea / water / window / door / to open / to close", "note": "After *poproszę* and *proszę o* the thing you ask for is in the accusative: *kawę, herbatę, wodę*.", "example_gloss": ["I'll have a tea, please.", "A coffee, please.", "Can you open the window?", "Can you close the door?"]}
  pl.a2.unit79.lesson01.teach.gn_poprosze: {"title": "Asking for something", "gloss": "I'll have a coffee, please. Water, please. I'll have a tea, please.", "note": "*Poproszę* takes the object directly. *Proszę o* needs *o* before the object. Both are polite in a shop or a café."}
  pl.a2.unit79.lesson01.teach.gn_czy_mozesz: {"title": "Asking someone to do something", "gloss": "Can you help me? Can you open the window? Can you close the door?", "note": "*Czy możesz* plus an infinitive is a direct polite request to a friend. *Mi* means 'to me'."}
  pl.a2.unit79.lesson01.teach.fr_prosby: {"title": "Short polite phrases", "gloss": "I'll have water, please. Can you help me? Thank you very much."}
  pl.a2.unit79.lesson02.teach.warunkowy: {"title": "Polite 'could you' and 'I would like'", "gloss": "could you (to a man) / could you (to a woman) / I would like (said by a man) / I would like (said by a woman) / says", "note": "These are polite set phrases. The ending shows gender: *mógłbyś* and *chciałbym* are masculine; *mogłabyś* and *chciałabym* are feminine. Note *ó* in *mógłbyś* and *o* in *mogłabyś*.", "example_gloss": ["Marek, could you help me?", "Ewa, could you help me?", "Marek says: I would like a coffee.", "Ewa says: I would like a tea."]}
  pl.a2.unit79.lesson02.teach.czynnosci: {"title": "More things to ask", "gloss": "to pass, hand / water / to help / to close the door", "note": "After *czy mógłbyś* and *czy mogłabyś* the verb stays in the infinitive.", "example_gloss": ["Marek, could you pass the water?", "Ewa, could you close the door?", "I would like water (said by a woman)."]}
  pl.a2.unit79.lesson02.teach.gn_addressee: {"title": "Gender of the person you ask", "gloss": "Marek, could you open the window? Ewa, could you open the window?", "note": "When you ask a man use *mógłbyś*. When you ask a woman use *mogłabyś*. The infinitive after it never changes."}
  pl.a2.unit79.lesson02.teach.gn_speaker: {"title": "Gender of the person who speaks", "gloss": "Marek says: I would like a coffee. Ewa says: I would like a tea.", "note": "A man says *chciałbym* and a woman says *chciałabym*. Use *chciałbym* or *chciałabym* with a noun, as in a cafe."}
  pl.a2.unit79.lesson02.teach.fr_warunkowy: {"title": "Three polite requests", "gloss": "Marek, could you close the door? Ewa, could you pass the water? I would like a coffee."}
  pl.a2.unit79.lesson03.teach.oferty: {"title": "Offering help", "gloss": "can I / shall I / I will help / I will make / to you / do you need help", "note": "To offer help say *czy mogę* or *czy mam* plus an infinitive, or say *pomogę ci*.", "example_gloss": ["Can I help you?", "Shall I help you?", "I will help you.", "I will make you tea.", "Do you need help?"]}
  pl.a2.unit79.lesson03.teach.gn_oferta: {"title": "Two ways to offer", "gloss": "Can I help you? Shall I help you? Shall I open the door?", "note": "*Czy mogę* means 'may I'. *Czy mam* means 'shall I' and offers to do something. Both take the infinitive."}
  pl.a2.unit79.lesson03.teach.gn_mi_ci: {"title": "Mi and ci", "gloss": "Can you help me? Can I help you? I will help you.", "note": "*Mi* is 'to me' and *ci* is 'to you'. In a request you say *mi*; in an offer you say *ci*."}
  pl.a2.unit79.lesson03.teach.fr_oferty: {"title": "Short offers", "gloss": "I will help you. I will make you tea. Shall I open the door?"}
  pl.a2.unit79.lesson04.teach.odpowiedzi: {"title": "Answering an offer or a request", "gloss": "yes / no / gladly / of course / OK, fine / sorry / I can manage / I can't", "note": "*Dam radę* is a set phrase meaning 'I can manage'. *Nie mogę* means 'I can't'.", "example_gloss": ["Yes, please.", "Gladly, thank you.", "No, thank you, I can manage.", "Sorry, I can't."]}
  pl.a2.unit79.lesson04.teach.gn_akceptuj: {"title": "Accepting politely", "gloss": "Yes, please. Gladly, thank you. Of course.", "note": "To accept an offer say *tak, poproszę* or *chętnie, dziękuję*. To agree to a request say *oczywiście* or *dobrze*."}
  pl.a2.unit79.lesson04.teach.gn_odmow: {"title": "Declining politely", "gloss": "No, thank you, I can manage. Sorry, I can't.", "note": "Decline an offer with *nie, dziękuję, dam radę*. Decline a request with *przepraszam, nie mogę*."}
  pl.a2.unit79.lesson04.teach.fr_dialog: {"title": "A short exchange", "gloss": "Shall I help you? Yes, please. Could you help me? Sorry, I can't."}
  pl.a2.unit79.lesson05.teach.sasiad: {"title": "Words for the story", "gloss": "neighbour / neighbour (as an object) / help / boxes / heavy / are", "note": "*Prosić o pomoc* means to ask for help. *Poprosiła* is what a woman did; *poprosił* is what a man did.", "example_gloss": ["These boxes are heavy.", "Ewa asked the neighbour for help.", "The neighbour answered: Of course.", "Marek asked for help."]}
  pl.a2.unit79.lesson05.teach.czasowniki: {"title": "Verbs for telling the story", "gloss": "I had (said by a woman) / I asked (said by a woman) / I said (said by a woman) / he answered / he asked / then", "note": "A woman telling a story uses the ending *-łam*; a man uses *-łem*.", "example_gloss": ["I had heavy boxes.", "I asked the neighbour for help.", "I said: Thank you.", "Then the neighbour asked: Shall I help?"]}
  pl.a2.unit79.lesson05.teach.lektura: {"title": "Ewa asks a neighbour", "gloss": "Last week I had heavy boxes. I asked the neighbour for help. I said: Sorry, could you help me? The neighbour answered: Of course, gladly. Then he asked: Shall I open the door? I answered: No, thank you, I can manage. At the end I said: Thank you very much!", "note": "Notice the polite request, the offer and the polite refusal in one short story.", "glosses": {"zeszłym": "last", "tygodniu": "week", "końcu": "end", "na": "at, on"}}
  pl.a2.unit79.lesson06.teach.d1: {"title": "Ewa asks politely", "gloss": "Ewa: Marek, could you help me? These boxes are very heavy."}
  pl.a2.unit79.lesson06.teach.d2: {"title": "Marek agrees and offers", "gloss": "Marek: Of course, I will help you. Shall I open the door?"}
  pl.a2.unit79.lesson06.teach.d3: {"title": "Ewa accepts", "gloss": "Ewa: Yes, please. Thank you very much."}
  pl.a2.unit79.lesson06.teach.d4: {"title": "Marek offers water", "gloss": "Marek: You're welcome. Shall I pass you some water?"}
  pl.a2.unit79.lesson06.teach.d5: {"title": "Ewa declines and asks for tea", "gloss": "Ewa: No, thank you. I would like a tea."}
  pl.a2.unit79.lesson06.teach.d6: {"title": "Marek agrees", "gloss": "Marek: OK, I'll gladly make tea."}
