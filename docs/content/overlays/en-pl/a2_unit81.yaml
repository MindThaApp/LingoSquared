  pl.a2.unit81.lesson02.exercise02.elige_przestala: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa przestała siedzieć w telefonie.", "distractors": ["Ewa przestał siedzieć w telefonie.", "Ewa przestała siedzi w telefonie.", "Ewa przestałam siedzieć w telefonie."], "accepted_answers": [{"value": "Ewa przestała siedzieć w telefonie.", "status": "correct"}], "feedback": "*Ewa* is a woman: *przestała*, then the infinitive *siedzieć*."}
  pl.a2.unit81.lesson02.exercise03.une_przestac: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "przestałem", "right": "I stopped (said by a man)"}, {"left": "przestałam", "right": "I stopped (said by a woman)"}, {"left": "przestał", "right": "he stopped"}, {"left": "przestała", "right": "she stopped"}, {"left": "pić kawę", "right": "to drink coffee"}, {"left": "jeść słodycze", "right": "to eat sweets"}, {"left": "siedzieć w telefonie", "right": "to sit on the phone"}, {"left": "oglądać seriale", "right": "to watch series"}], "status": "correct"}], "feedback": "Forms of *przestać* and some habits."}
  pl.a2.unit81.lesson02.exercise04.ordena_przestala: {"instruction": "Put the words in order to say 'Ewa stopped watching series.'", "correct_option": "Ewa przestała oglądać seriale", "accepted_answers": [{"value": "Ewa przestała oglądać seriale", "status": "correct"}], "feedback": "*Ewa przestała oglądać seriale*."}
  pl.a2.unit81.lesson02.exercise05.completa_przestac: {"instruction": "Complete with the past tense of 'to stop' for Ewa.", "correct_option": "przestała", "accepted_answers": [{"value": "przestała", "status": "correct"}], "feedback": "*Teraz nie siedzi* shows that the habit ended: *Ewa przestała*."}
  pl.a2.unit81.lesson02.exercise06.traduce_przestac: {"instruction": "Translate into Polish using the past tense.", "accepted_answers": [{"value": "Przestałem pić kawę.", "status": "correct"}, {"value": "Przestałem pić kawę", "status": "correct"}, {"value": "Przestałam pić kawę.", "status": "correct"}, {"value": "Przestałam pić kawę", "status": "correct"}], "feedback": "A man says *Przestałem pić kawę*, a woman says *Przestałam pić kawę*."}
  pl.a2.unit81.lesson02.exercise07.escribe_przestac: {"instruction": "Write one sentence with two past verbs, joined by *i*.", "correct_option": "Przestałem siedzieć w telefonie i zacząłem czytać.", "accepted_answers": [{"value": "Przestałem siedzieć w telefonie i zacząłem czytać.", "status": "correct"}, {"value": "Przestałem siedzieć w telefonie i zacząłem czytać", "status": "correct"}, {"value": "Przestałam siedzieć w telefonie i zaczęłam czytać.", "status": "correct"}, {"value": "Przestałam siedzieć w telefonie i zaczęłam czytać", "status": "correct"}, {"value": "Zacząłem czytać i przestałem siedzieć w telefonie.", "status": "correct"}, {"value": "Zacząłem czytać i przestałem siedzieć w telefonie", "status": "correct"}, {"value": "Zaczęłam czytać i przestałam siedzieć w telefonie.", "status": "correct"}, {"value": "Zaczęłam czytać i przestałam siedzieć w telefonie", "status": "correct"}], "feedback": "*Przestałem siedzieć w telefonie i zacząłem czytać* (man)."}
  pl.a2.unit81.lesson03.exercise01.elige_probowal: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek próbował wstawać wcześnie.", "distractors": ["Marek zapomniał wstawać wcześnie.", "Marek próbowała wstawać wcześnie.", "Marek próbował wstaje wcześnie."], "accepted_answers": [{"value": "Marek próbował wstawać wcześnie.", "status": "correct"}], "feedback": "*Próbował* means he tried, and *wstawać* stays in the infinitive."}
