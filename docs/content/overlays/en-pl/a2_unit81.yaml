  pl.a2.unit81.lesson03.exercise03.une_probowac: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "próbowałem", "right": "I tried (said by a man)"}, {"left": "spróbowałam", "right": "I gave it a try (said by a woman)"}, {"left": "zapomniałem", "right": "I forgot (said by a man)"}, {"left": "zapomniałam", "right": "I forgot (said by a woman)"}, {"left": "próbował", "right": "he tried"}, {"left": "zapomniała", "right": "she forgot"}, {"left": "zadzwonić", "right": "to call, to phone"}, {"left": "kupić chleb", "right": "to buy bread"}, {"left": "wstawać wcześnie", "right": "to get up early"}], "status": "correct"}], "feedback": "Forms of *próbować*, *spróbować* and *zapomnieć*."}
  pl.a2.unit81.lesson03.exercise04.ordena_probowala: {"instruction": "Put the words in order to say 'Ewa tried to get up early.'", "correct_option": "Ewa próbowała wstawać wcześnie", "accepted_answers": [{"value": "Ewa próbowała wstawać wcześnie", "status": "correct"}], "feedback": "*Ewa próbowała wstawać wcześnie*."}
  pl.a2.unit81.lesson03.exercise05.completa_probowac: {"instruction": "Complete with the past tense of 'to try' for Marek.", "correct_option": "próbował", "accepted_answers": [{"value": "próbował", "status": "correct"}, {"value": "spróbował", "status": "correct"}], "feedback": "*Ale to jest trudne* shows that he tried: *Marek próbował*."}
