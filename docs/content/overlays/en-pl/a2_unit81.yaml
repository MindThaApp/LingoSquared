  pl.a2.unit81.lesson01.exercise07.escribe_zaczac: {"instruction": "Write one sentence in the past tense with *miesiąc temu*.", "correct_option": "Zacząłem pływać miesiąc temu.", "accepted_answers": [{"value": "Zacząłem pływać miesiąc temu.", "status": "correct"}, {"value": "Zacząłem pływać miesiąc temu", "status": "correct"}, {"value": "Zaczęłam pływać miesiąc temu.", "status": "correct"}, {"value": "Zaczęłam pływać miesiąc temu", "status": "correct"}, {"value": "Miesiąc temu zacząłem pływać.", "status": "correct"}, {"value": "Miesiąc temu zacząłem pływać", "status": "correct"}, {"value": "Miesiąc temu zaczęłam pływać.", "status": "correct"}, {"value": "Miesiąc temu zaczęłam pływać", "status": "correct"}], "feedback": "*Zacząłem pływać miesiąc temu* (man) or *Zaczęłam pływać miesiąc temu* (woman)."}
