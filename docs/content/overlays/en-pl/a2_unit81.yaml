  pl.a2.unit81.lesson01.exercise02.elige_zaczela: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa zaczęła uczyć się polskiego.", "distractors": ["Ewa zaczął uczyć się polskiego.", "Ewa zaczęła uczy się polskiego.", "Ewa zaczęłam uczyć się polskiego."], "accepted_answers": [{"value": "Ewa zaczęła uczyć się polskiego.", "status": "correct"}], "feedback": "*Ewa* is a woman: *zaczęła*, followed by the infinitive *uczyć się*."}
  pl.a2.unit81.lesson01.exercise03.une_zaczac: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "zacząłem", "right": "I started (said by a man)"}, {"left": "zaczęłam", "right": "I started (said by a woman)"}, {"left": "zaczął", "right": "he started"}, {"left": "zaczęła", "right": "she started"}, {"left": "zaczęliśmy", "right": "we started"}, {"left": "zaczęłyśmy", "right": "we started (all women)"}, {"left": "biegać", "right": "to run"}, {"left": "pływać", "right": "to swim"}, {"left": "gotować", "right": "to cook"}], "status": "correct"}], "feedback": "Forms of *zacząć* and some infinitives."}
