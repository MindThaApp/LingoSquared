teaching:
  pl.a2.unit81.lesson01.teach.czynnosci: {"title": "Things to do", "gloss": "to run / to swim / to read / to cook / to learn, to study", "note": "These infinitives follow the verbs of this unit. *Uczyć się* is a reflexive verb.", "example_gloss": ["I like running in the morning.", "Marek swims.", "Ewa is learning Polish.", "I am reading a book."]}
  pl.a2.unit81.lesson01.teach.zaczac: {"title": "To start: zacząć", "gloss": "I started (man), I started (woman), he started, she started, we started, we started (women)", "note": "*Zacząć* has an e in the feminine and plural forms: *zaczęła*, *zaczęłam*, but *zaczął* and *zacząłem* for a man.", "example_gloss": ["I started running.", "I started learning Polish.", "Marek started swimming.", "Ewa started cooking."]}
  pl.a2.unit81.lesson01.teach.gn_zaczal: {"title": "Zacząć in the past tense", "gloss": "I started running (man). I started running (woman). Marek started running. Ewa started running. We started running. We started running (women).", "note": "A man says *zacząłem*, a woman says *zaczęłam*. The verb after *zacząć* stays in the infinitive. This verb does not follow the usual pattern: write *zaczęłam* with an e, never *zacząłam*."}
  pl.a2.unit81.lesson01.teach.gn_infinitiv: {"title": "Zacząć + infinitive", "gloss": "I started learning Polish. I started reading a book. Ewa started cooking.", "note": "After *zacząć* the second verb is always an infinitive: *zacząłem czytać*, not *zacząłem czytam*."}
  pl.a2.unit81.lesson01.teach.kiedy: {"title": "When did you start?", "gloss": "when / a year ago / a month ago / two months ago", "note": "*Zacząłeś* is for a man, *zaczęłaś* is for a woman. *Temu* comes after the time: *miesiąc temu*.", "example_gloss": ["When did you start running? (to a man)", "When did you start running? (to a woman)", "I started a year ago.", "I started a month ago."]}
  pl.a2.unit81.lesson02.teach.nawyki: {"title": "Habits", "gloss": "to drink coffee / to eat sweets / to sit on the phone / to watch series", "note": "*Siedzieć w telefonie* is a common way to talk about screen time. *Nie* makes a sentence negative.", "example_gloss": ["Marek drinks coffee in the morning.", "I eat sweets.", "Ewa is sitting on her phone.", "Now Ewa is not sitting on her phone."]}
  pl.a2.unit81.lesson02.teach.przestac: {"title": "To stop: przestać", "gloss": "I stopped (man), I stopped (woman), he stopped, she stopped, we stopped, we stopped (women)", "note": "*Przestać* works like *zacząć* in meaning, but the opposite: it ends a habit.", "example_gloss": ["I stopped drinking coffee.", "I stopped sitting on my phone.", "Marek stopped eating sweets.", "Ewa stopped watching series."]}
  pl.a2.unit81.lesson02.teach.gn_przestal: {"title": "Przestać in the past tense", "gloss": "I stopped drinking coffee (man). I stopped drinking coffee (woman). Marek stopped drinking coffee. Ewa stopped drinking coffee. We stopped drinking coffee. We stopped drinking coffee (women).", "note": "*Przestać* is regular: a man ends in *-łem*, a woman in *-łam*. It is followed by an infinitive."}
  pl.a2.unit81.lesson02.teach.gn_kontrast: {"title": "Zacząć or przestać", "gloss": "I started running and I stopped eating sweets. I started reading and I stopped sitting on my phone.", "note": "*Zacząć* means a habit begins, *przestać* means it ends. The rest of the sentence shows which one is meant. *I* joins the two parts."}
  pl.a2.unit81.lesson02.teach.pytania: {"title": "Questions", "gloss": "Have you stopped drinking coffee? Have you stopped sitting on your phone? Yes, I have stopped (man). No, I have not stopped (woman).", "note": "Questions with *czy* are answered with *tak* or *nie*. The ending shows who is asked: *-łeś* a man, *-łaś* a woman."}
  pl.a2.unit81.lesson03.teach.wiecej: {"title": "More things to do", "gloss": "to get up / early / to call, to phone / to buy / bread", "note": "These infinitives are used after *próbować* and *zapomnieć*. *Wcześnie* is an adverb: it does not change.", "example_gloss": ["Ewa gets up early.", "I have to call.", "I have to buy bread.", "Marek ran in the morning."]}
  pl.a2.unit81.lesson03.teach.probowac: {"title": "To try: próbować, spróbować", "gloss": "I tried (man), I tried (woman), I gave it a try (man), I gave it a try (woman), he tried, she gave it a try", "note": "*Próbowałem* describes trying for a while or several times. *Spróbowałem* is a single try: you gave it a go.", "example_gloss": ["I tried to get up early, but it is difficult.", "I tried running in the morning.", "Marek tried swimming.", "Ewa tried to cook."]}
  pl.a2.unit81.lesson03.teach.zapomniec: {"title": "To forget: zapomnieć", "gloss": "I forgot (man), I forgot (woman), he forgot, she forgot, we forgot, we forgot (women)", "note": "*Zapomnieć* is followed by an infinitive, like the other verbs of this unit. Note *zapomnieliśmy* for the group.", "example_gloss": ["I forgot to call.", "I forgot to buy bread.", "Marek forgot to call.", "Ewa forgot to buy bread."]}
  pl.a2.unit81.lesson03.teach.gn_kontrast: {"title": "Tried or forgot", "gloss": "I tried to get up early. I forgot to call. I tried running in the morning. I forgot to buy bread.", "note": "*Próbować* and *spróbować* mean you made an effort; *zapomnieć* means you did not do it at all. Both are followed by an infinitive."}
  pl.a2.unit81.lesson03.teach.gn_formy: {"title": "Forms of próbować and zapomnieć", "gloss": "Marek tried. Ewa gave it a try. Marek forgot. Ewa forgot.", "note": "A man's forms end in *-ł*, a woman's in *-ła*. With *ja* the endings are *-łem* and *-łam*."}
  pl.a2.unit81.lesson04.teach.sport: {"title": "Sport and screen time", "gloss": "to go to the gym / to ride a bike / to play games / every day / there", "note": "Sport and games: *chodzić na* + gym, *jeździć na* + bike, *grać w* + games.", "example_gloss": ["Marek goes to the gym.", "Ewa rides a bike.", "In the evening I play games.", "Two months ago Ewa started cycling, and now she cycles every day."]}
  pl.a2.unit81.lesson04.teach.skonczyc: {"title": "To finish: skończyć", "gloss": "I finished (man), I finished (woman), he finished, she finished", "note": "*Skończyć* means you finished an activity. *Przestać* means you stopped doing it as a habit.", "example_gloss": ["I finished reading the book.", "I finished cooking.", "Marek finished running.", "Marek goes there every day."]}
  pl.a2.unit81.lesson04.teach.gn_cztery: {"title": "Four verbs together", "gloss": "I started going to the gym. I stopped playing games. I tried riding a bike. I forgot to call.", "note": "Each verb is in the past tense and is followed by an infinitive. The ending of the first verb shows who speaks: *-łem* a man, *-łam* a woman."}
  pl.a2.unit81.lesson04.teach.gn_pytania: {"title": "Asking about habits", "gloss": "Have you stopped playing games? Have you started going to the gym? When did you start riding a bike?", "note": "Use *-łeś* when you ask a man and *-łaś* when you ask a woman. A question with *czy* is answered with *tak* or *nie*."}
  pl.a2.unit81.lesson04.teach.odpowiedzi: {"title": "Answers", "gloss": "Yes, I have stopped (man). No, I have not stopped (woman). Yes, I started (man). No, I forgot (woman).", "note": "A short answer repeats the verb of the question."}
  pl.a2.unit81.lesson05.teach.slowa: {"title": "Words for the text", "gloss": "now / also / I prefer / once / in the evening / in the morning / to Marek (a call to him)", "note": "*Do Marka* is the form of *Marek* after *do*.", "example_gloss": ["I prefer running in the morning.", "Once I forgot to call Marek.", "In the evening I read a book.", "Ewa also runs."]}
  pl.a2.unit81.lesson05.teach.gn_ja: {"title": "Ja, ty, on, ona", "gloss": "I started (woman). You started (man). Ewa, you started. He started. She started.", "note": "*Ja* and *ty* are optional because the ending already shows the person. Use them for contrast."}
  pl.a2.unit81.lesson05.teach.gn_formy: {"title": "Starting and stopping in one story", "gloss": "I started running and I stopped drinking coffee. Marek started swimming and he stopped watching series.", "note": "In a story the speaker's gender stays the same in every verb: all with *-łam*, or all with *-łem*."}
  pl.a2.unit81.lesson05.teach.lectura: {"title": "Ewa opowiada", "gloss": "Two months ago I started running. Now I run in the morning, and in the evening I read a book. I stopped sitting on my phone and I stopped drinking coffee. I also tried swimming, but I prefer running. Once I forgot to call Marek.", "note": "Ewa tells in one voice what she started, stopped, tried and forgot. All her verbs end in *-łam*.", "glosses": {"zaczęłam": "I started (woman)", "przestałam": "I stopped (woman)", "spróbowałam": "I tried (woman)", "zapomniałam": "I forgot (woman)"}}
  pl.a2.unit81.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. Have you started running?"}
  pl.a2.unit81.lesson06.teach.d2: {"title": "Ewa answers", "gloss": "Ewa: Yes, I started two months ago. And you?"}
  pl.a2.unit81.lesson06.teach.d3: {"title": "Marek tells", "gloss": "Marek: I stopped drinking coffee and started going to the gym."}
  pl.a2.unit81.lesson06.teach.d4: {"title": "Ewa asks about the phone", "gloss": "Ewa: Have you stopped sitting on your phone?"}
  pl.a2.unit81.lesson06.teach.d5: {"title": "Marek admits", "gloss": "Marek: No, I have not stopped. I tried, but it is difficult."}
  pl.a2.unit81.lesson06.teach.d6: {"title": "Ewa shares", "gloss": "Ewa: I stopped sitting on my phone in the evening and now I read."}
