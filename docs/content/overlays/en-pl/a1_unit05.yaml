  required_next_reviewer: native_speaker_pass
  notes: >-
    Fifth en-pl overlay, written for pl/a1_unit05_family.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start). No
    sibling-direction overlay exists yet for this unit (pl-en hasn't been
    authored), so the sibling-isolation rule (AUTHORING_GUIDE §8) doesn't
    apply here -- noted for whoever authors pl-en next: do not open this
    file for structure/phrasing reference when doing so.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): 7
    multiple_choice select_* exercises -- prompt.target_blocks displayed
    the correct Polish option itself above the options (rendered as
    text_blocks), giving the answer away -> target_blocks emptied (the
    English instruction carries the cue), comprehension-without-
    text/duplicate class. Overlay: dziadek_babcia note falsely called
    dziadek/babcia informal/childish -> standard everyday words. syn_corka
    note claimed the card shows the accusative (target is nominative;
    examples show it) -> corrected. accusative_note 'Masculine nouns add
    -a' over-generalized (false for inanimates, contradicted by unit 6's
    chleb/ser) -> 'masculine nouns for people (and animals)'.
    Canon/register: units 01-03 have Ewa and Marek on formal pan/pani;
    this dialogue switches to ty unannounced -> dialogue.line01 note now
    explains the switch to ty. lesson03.exercise11.speak_moj_brat_gdansk
    instruction asked for two sentences while tested_text is only 'Mój
    brat mieszka w Gdańsku' -> instruction narrowed, short answer added
    (long kept). Missing accepted answers added: lesson01.exercise09 (To
    moja siostra), lesson02.exercise08 (Mam syna / Tak, mam),
    lesson02.exercise09 (Mam córkę i syna), lesson03.exercise10 (Mam brata
    i siostrę). Word-order alternatives added: lesson02.exercise04 (Mam
    siostrę i brata), lesson03.exercise06 (Czy masz siostrę lub brata),
    lesson03.exercise07 (W Gdańsku mieszka mój brat). NATIVE CHECK: lub vs
    albo in casual spoken question; ciotka vs ciocia as the taught
    everyday form.

    Second-pass review 2026-10-19: 3 fixes - lesson01.exercise02.select_brat
    distractor syn was untaught until lesson 2 -> siostra (sequencing);
    teach.on_ona_mieszka_note falsely tied w + locative to unit 4's time
    expressions (unit 4 used o + locative for hours) -> points to unit 1's
    w Warszawie (false-grammar); lesson03.exercise10 added word-order
    variant "Tak, mam siostrę i brata." (missing-accepted-answer).
    NATIVE FLAGS: Fajna described as same register as Świetnie (Świetnie
    is neutral); matka/ojciec presented as the neutral everyday forms
    (mama/tata far more common in speech) -- left as-is.

answer_policy:
  diacritics: >-
    Same standing policy as unit01-04: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form
    remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit05.family:
    title: "Rodzina"

lessons:
  pl.a1.unit05.lesson01.najblizsza_rodzina:
    title: "Najbliższa rodzina"
  pl.a1.unit05.lesson02.dalsza_rodzina:
    title: "Dalsza rodzina"
  pl.a1.unit05.lesson03.rozmowa_o_rodzinie:
    title: "Rozmowa o rodzinie"

teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: "Family"
    gloss: "family"
    note: "The general word for family -- used for the whole household, not just one relationship."
    example_gloss: "This is my family."

  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: "Mother, father"
    gloss: "mother; father"
    note: "The two core parent words -- you'll also hear the affectionate mama and tata in everyday speech, but matka and ojciec are the neutral, standard forms taught here."
    example_gloss:
      - "This is my mother."
      - "This is my father."

  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: "Brother, sister"
    gloss: "brother; sister"
    note: "Both are regular nouns -- brat is masculine, siostra is feminine, which matters for the mój/moja agreement in this lesson's grammar note."
    example_gloss:
      - "This is my brother."
      - "This is my sister."

  pl.a1.unit05.lesson01.teach.rodzice:
    title: "Parents"
    gloss: "parents"
    note: >-
      Rodzice is a masculine-personal plural noun -- it takes its own
      possessive form moi (not mój/moja), which you'll see in this
      lesson's example and grammar note.
    example_gloss: "My parents live in Warsaw."

  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: "My: mój vs moja vs moi"
    gloss: "my father, my brother -- my mother, my sister -- my parents."
    note: >-
      Polish possessives agree with the gender of the noun they describe:
      *mój* before a masculine noun (*mój ojciec*, *mój brat*), *moja*
      before a feminine noun (*moja matka*, *moja siostra*), and the
      separate irregular form *moi* specifically before the
      masculine-personal plural *rodzice*.

  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: "This is my father"
    gloss: "This is my father."
    note: "*To jest* (this is) works the same way regardless of the noun's gender -- only the possessive mój/moja changes."

  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: "Grandfather, grandmother"
    gloss: "grandfather; grandmother"
    note: "The standard everyday words for grandfather and grandmother, used by children and adults alike."
    example_gloss:
      - "This is my grandfather."
      - "This is my grandmother."

  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: "Uncle, aunt"
    gloss: "uncle; aunt"
    note: "Used for both a parent's brother/sister and a parent's sibling's spouse, same as English \"uncle\"/\"aunt.\""
    example_gloss:
      - "This is my uncle."
      - "This is my aunt."

  pl.a1.unit05.lesson02.teach.syn_corka:
    title: "Son, daughter"
    gloss: "son; daughter"
    note: >-
      The examples show the accusative form you need after *mieć* (to
      have): *syn* becomes *syna*, *córka* becomes *córkę*. The grammar
      notes that follow explain why the ending changes.
    example_gloss:
      - "I have a son."
      - "I have a daughter."

  pl.a1.unit05.lesson02.teach.miec_note:
    title: "To have: mam, masz, ma"
    gloss: "to have: I have, you have, he/she has -- I have a brother, you have a sister, he/she has a son."
    note: >-
      *Mieć* is the verb "to have." *Mam* (I have) and *ma* (he/she has)
      are this lesson's main new forms; *masz* (you have) you've already
      seen from asking someone's age back in unit 2.

  pl.a1.unit05.lesson02.teach.accusative_note:
    title: "Saying what you have"
    gloss: "After 'to have,' the noun changes ending: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę."
    note: >-
      This is the accusative case -- the form a noun takes as the direct
      object of a verb like *mieć*. Masculine nouns for people (and
      animals), like *brat* and *syn*, add *-a*; feminine nouns like
      *siostra* and *córka* swap their final *-a* for *-ę*.

  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: "I have a brother and a sister"
    gloss: "I have a brother and a sister."
    note: "Puts the accusative endings from the grammar note to work in a full sentence, plus the new connector *i* (and)."

  pl.a1.unit05.lesson03.teach.lub:
    title: "Or"
    gloss: "or"
    note: "Used the same way as English \"or\" in a yes/no question offering two options."
    example_gloss: "Do you have a brother or a sister?"

  pl.a1.unit05.lesson03.teach.tylko:
    title: "Only"
    gloss: "only"
    note: "Placed right before the word it limits, same position as English \"only.\""
    example_gloss: "I only have a sister."

  pl.a1.unit05.lesson03.teach.gdzie:
    title: "Where"
    gloss: "where"
    note: "A basic question word -- pairs naturally with mieszkać (to live), as in this lesson's dialogue."
    example_gloss: "Where does your brother live?"

  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: "He, she -- and 'to live'"
    gloss: "he, she = he, she -- to live: I live, he/she lives. He lives in Gdańsk. She lives in Kraków."
    note: >-
      *On* (he) and *ona* (she) are the third-person pronouns. *Mieszkać*
      (to live) follows the same 1st/3rd-person pattern as *mieć*:
      *mieszkam* (I live, from unit 1's *Mieszkam w Warszawie*) and
      *mieszka* (he/she lives). Place names take *w* + the locative case
      after them -- *Gdańsk* becomes *w Gdańsku*, *Kraków* becomes *w
      Krakowie*, the same w + locative pattern as unit 1's *Mieszkam w
      Warszawie*.

  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: "Marek asks about siblings"
    gloss: "Marek asks Ewa if she has a brother or a sister."
    note: "A yes/no question using *Czy*, the same question-marker from unit 1. Ewa and Marek now know each other well, so they have switched from the formal *pan*/*pani* to the informal *ty* (*masz*, *A ty?*, *twój*)."
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: "Ewa answers and asks back"
    gloss: "Ewa says she has a brother and a sister, then asks Marek the same question back."
    note: "*A ty?* (\"And you?\") is a compact, natural way to turn a question back on the person who asked it."
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: "Marek answers"
    gloss: "Marek says he only has a sister, who lives in Kraków, then asks Ewa about her brother."
    note: "Marek has no brother -- only *tylko siostrę* (only a sister). His question about Ewa's brother is safe to ask because Ewa already said she has one."
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: "Ewa answers"
    gloss: "Ewa says her brother lives in Gdańsk and has a son and a daughter."
    note: "Reuses this unit's own syn/córka accusative pattern from lesson 2."
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: "Marek reacts"
    gloss: "Marek says, nice family!"
    note: "*Fajna* is an informal, everyday word for \"nice\"/\"cool\" -- a natural closing reaction, same register as unit 4's *Świetnie!*"

exercises:
  pl.a1.unit05.lesson01.exercise01.select_matka:
    instruction: "Which word means 'mother'?"
    correct_option: "matka"
    distractors: ["ojciec", "siostra"]
    accepted_answers: ["matka"]

  pl.a1.unit05.lesson01.exercise02.select_brat:
    instruction: "Which word means 'brother'?"
    correct_option: "brat"
    distractors: ["ojciec", "siostra"]
    accepted_answers: ["brat"]

  pl.a1.unit05.lesson01.exercise03.select_rodzina:
    instruction: "Which word means 'family'?"
    correct_option: "rodzina"
    distractors: ["rodzice", "matka"]
    accepted_answers: ["rodzina"]

  pl.a1.unit05.lesson01.exercise04.match_family_words:
    instruction: "Match each Polish family word to its English meaning."
    correct_response:
      "rodzina": "family"
      "matka": "mother"
      "ojciec": "father"
      "brat": "brother"
      "siostra": "sister"
      "rodzice": "parents"

  pl.a1.unit05.lesson01.exercise05.order_to_jest_matka:
    instruction: "Put the sentence 'This is my mother' in order."
    correct_response: ["To", "jest", "moja", "matka"]

  pl.a1.unit05.lesson01.exercise06.order_to_jest_brat:
    instruction: "Put the sentence 'This is my brother' in order."
    correct_response: ["To", "jest", "mój", "brat"]

  pl.a1.unit05.lesson01.exercise07.fill_moj_ojciec:
    instruction: "Complete the sentence -- ojciec is masculine, so it needs the masculine possessive."
    accepted_answers: ["mój"]
    feedback: "To jest mój ojciec -- ojciec is masculine, so it takes mój, not moja."

  pl.a1.unit05.lesson01.exercise08.fix_gender_agreement:
    instruction: "Fix the possessive -- brat is masculine, so it needs mój, not moja."
    accepted_answers:
      - "To jest mój brat."
      - "To jest mój brat"
    feedback: "To jest mój brat, not moja brat -- brat is masculine, so the possessive must agree."

  pl.a1.unit05.lesson01.exercise09.speak_moja_siostra:
    instruction: "Say that this is your sister."
    accepted_answers:
      - "To jest moja siostra."
      - "To jest moja siostra"
      - "To moja siostra."

  pl.a1.unit05.lesson02.exercise01.select_dziadek:
    instruction: "Which word means 'grandfather'?"
    correct_option: "dziadek"
    distractors: ["wujek", "ojciec"]
    accepted_answers: ["dziadek"]

  pl.a1.unit05.lesson02.exercise02.select_ciotka:
    instruction: "Which word means 'aunt'?"
    correct_option: "ciotka"
    distractors: ["babcia", "siostra"]
    accepted_answers: ["ciotka"]

  pl.a1.unit05.lesson02.exercise03.match_extended_family:
    instruction: "Match each Polish family word to its English meaning."
    correct_response:
      "dziadek": "grandfather"
      "babcia": "grandmother"
      "wujek": "uncle"
      "ciotka": "aunt"
      "syn": "son"
      "córka": "daughter"
      "matka": "mother"
      "ojciec": "father"
      "brat": "brother"
      "siostra": "sister"

  pl.a1.unit05.lesson02.exercise04.order_mam_brata_siostre:
    instruction: "Put the sentence 'I have a brother and a sister' in order."
    accepted_answers:
      - ["Mam", "brata", "i", "siostrę"]
      - ["Mam", "siostrę", "i", "brata"]

  pl.a1.unit05.lesson02.exercise05.order_to_jest_babcia:
    instruction: "Put the sentence 'This is my grandmother' in order."
    correct_response: ["To", "jest", "moja", "babcia"]

  pl.a1.unit05.lesson02.exercise06.fill_mam_syna:
    instruction: "Complete the sentence to say 'I have a son.'"
    accepted_answers: ["syna"]
    feedback: "Mam syna -- syn becomes syna after mieć."

  pl.a1.unit05.lesson02.exercise07.fix_accusative_ending:
    instruction: "Fix the ending -- after mieć, brat needs its accusative form."
    accepted_answers:
      - "Mam brata."
      - "Mam brata"
    feedback: "Mam brata, not Mam brat -- brat becomes brata as the object of mieć."

  pl.a1.unit05.lesson02.exercise08.reply_czy_masz_syna:
    instruction: "Answer yes, you have a son."
    accepted_answers:
      - "Tak, mam syna."
      - "Tak, mam syna"
      - "Mam syna."
      - "Tak, mam."

  pl.a1.unit05.lesson02.exercise09.speak_mam_syna_corke:
    instruction: "Say that you have a son and a daughter."
    accepted_answers:
      - "Mam syna i córkę."
      - "Mam syna i córkę"
      - "Mam córkę i syna."

  pl.a1.unit05.lesson03.exercise01.select_opening_question:
    instruction: "Which question asks whether someone has a brother or a sister?"
    correct_option: "Czy masz brata lub siostrę?"
    distractors: ["Która jest godzina?", "Gdzie mieszka twój brat?"]
    accepted_answers:
      - "Czy masz brata lub siostrę?"
      - "Czy masz brata lub siostrę"

  pl.a1.unit05.lesson03.exercise02.select_marek_answer:
    instruction: "Which line is Marek's answer about his own family?"
    correct_option: "Ja mam tylko siostrę. Ona mieszka w Krakowie. A twój brat? Gdzie mieszka?"
    distractors: ["Tak, mam brata i siostrę. A ty?", "Mój brat mieszka w Gdańsku. Ma syna i córkę."]
    accepted_answers:
      - "Ja mam tylko siostrę. Ona mieszka w Krakowie. A twój brat? Gdzie mieszka?"

  pl.a1.unit05.lesson03.exercise03.comprehend_marek_sister_city:
    instruction: "Read the line. Where does Marek's sister live?"
    correct_option: "Kraków"
    distractors:
      - "Gdańsk"
      - "Warsaw"
    accepted_answers:
      - "Kraków"
      - "Krakowie"

  pl.a1.unit05.lesson03.exercise04.comprehend_ewa_brother_city:
    instruction: "Read the line. Where does Ewa's brother live?"
    correct_option: "Gdańsk"
    distractors:
      - "Kraków"
      - "Warsaw"
    accepted_answers:
      - "Gdańsk"
      - "Gdańsku"

  pl.a1.unit05.lesson03.exercise05.match_lesson_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "lub": "or"
      "tylko": "only"
      "gdzie": "where"
      "on": "he"
      "ona": "she"
      "twój": "your"
      "dziadek": "grandfather"
      "babcia": "grandmother"
      "wujek": "uncle"
      "ciotka": "aunt"

  pl.a1.unit05.lesson03.exercise06.order_opening_question:
    instruction: "Put the question 'Do you have a brother or a sister?' in order."
    accepted_answers:
      - ["Czy", "masz", "brata", "lub", "siostrę"]
      - ["Czy", "masz", "siostrę", "lub", "brata"]

  pl.a1.unit05.lesson03.exercise07.order_moj_brat_gdansk:
    instruction: "Put the sentence 'My brother lives in Gdańsk' in order."
    accepted_answers:
      - ["Mój", "brat", "mieszka", "w", "Gdańsku"]
      - ["W", "Gdańsku", "mieszka", "mój", "brat"]

  pl.a1.unit05.lesson03.exercise08.fill_tylko:
    instruction: "Complete the sentence to say 'I only have a sister.'"
    accepted_answers: ["tylko"]
    feedback: "Ja mam tylko siostrę -- tylko (only) goes right before the word it limits."

  pl.a1.unit05.lesson03.exercise09.fix_locative_ending:
    instruction: "Fix the city name -- after 'w' (in), Kraków needs its locative form."
    accepted_answers:
      - "Ona mieszka w Krakowie."
      - "Ona mieszka w Krakowie"
    feedback: "Ona mieszka w Krakowie -- Kraków becomes Krakowie after w, the same pattern as Gdańsk becoming Gdańsku."

  pl.a1.unit05.lesson03.exercise10.reply_opening_question:
    instruction: "Answer that yes, you have a brother and a sister."
    accepted_answers:
      - "Tak, mam brata i siostrę."
      - "Tak, mam brata i siostrę"
      - "Tak, mam brata i siostrę. A ty?"
      - "Tak, mam brata i siostrę. A ty"
      - "Mam brata i siostrę."
      - "Tak, mam siostrę i brata."

  pl.a1.unit05.lesson03.exercise11.speak_moj_brat_gdansk:
    instruction: "Say that your brother lives in Gdańsk."
    accepted_answers:
      - "Mój brat mieszka w Gdańsku."
      - "Mój brat mieszka w Gdańsku"
      - "Mój brat mieszka w Gdańsku. Ma syna i córkę."
      - "Mój brat mieszka w Gdańsku. Ma syna i córkę"
