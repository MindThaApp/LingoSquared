answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Marek) and formal
    titles (Kierowniczka).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit03.spotkania_w_pracy:
    title: "Meetings at work"

lessons:
  pl.b1.unit03.lesson01.czy_moglby_pan:
    title: "Could you...?"
  pl.b1.unit03.lesson02.chcialbym_zaproponowac:
    title: "I would like to propose..."
  pl.b1.unit03.lesson03.na_spotkaniu:
    title: "At the project meeting"
  pl.b1.unit03.lesson04.wiadomosc_sluzbowa:
    title: "A professional message"

teaching:
  pl.b1.unit03.lesson01.teach.recap_words:
    title: "Good day, thank you, work, time -- again"
    gloss: "dzień, dobry, dziękuję, jest, mam, praca, czas -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds formal workplace register on top of them."

  pl.b1.unit03.lesson01.teach.spotkanie:
    title: "Meeting"
    gloss: "meeting"
    note: "A neuter noun."
    example_gloss: "This is an important meeting."

  pl.b1.unit03.lesson01.teach.projekt:
    title: "Project"
    gloss: "project"
    note: "A masculine noun."
    example_gloss: "The project is ready."

  pl.b1.unit03.lesson01.teach.czy_moglby_pan_note:
    title: "Could you...? -- the formal request"
    gloss: "*Czy mógłby pan...?* -- Could you...? A formal request: the conditional mood, in the THIRD person (\"he\"), plus \"pan\"/\"pani\" -- Polish formal address grammatically uses third-person verb forms even when speaking directly to someone."
    note: "This is the core B1 grammar point of this unit: the same by-conditional from earlier in this course, now doing formal-register work instead of personal hypotheticals."

  pl.b1.unit03.lesson01.teach.przeslac_raport:
    title: "To send a report"
    gloss: "to send a report"
    note: "*przesłać* -- a perfective verb, a single completed act of sending."
    example_gloss: "Could you send the report?"

  pl.b1.unit03.lesson01.teach.termin:
    title: "Deadline"
    gloss: "deadline"
    note: "Also used for \"appointment\" in other contexts -- here specifically a project deadline."
    example_gloss: "What is the deadline?"

  pl.b1.unit03.lesson02.teach.zaproponowac:
    title: "To propose"
    gloss: "to propose"
    note: "A perfective verb -- one concrete proposal, not an ongoing habit of proposing."
    example_gloss: "I would like to propose a new deadline."

  pl.b1.unit03.lesson02.teach.nowy:
    title: "New"
    gloss: "new"
    note: "Masculine form, agreeing with *projekt* or *termin*."
    example_gloss: "This is a new project."

  pl.b1.unit03.lesson02.teach.phrase_zaproponowac_termin:
    title: "I would like to propose a new deadline"
    gloss: "I would like to propose a new deadline."
    note: "The standard meeting-suggestion opener, built on this course's own by-conditional."

  pl.b1.unit03.lesson02.teach.powinnismy:
    title: "We should"
    gloss: "*powinniśmy* -- we should. The modal verb \"powinien\" in the first person plural."
    note: "Used for group recommendations in a meeting, distinct from the personal *powinienem* (I should)."

  pl.b1.unit03.lesson02.teach.zmienic_termin:
    title: "We should change the deadline"
    gloss: "We should change the deadline."
    note: "A natural, softened group recommendation."

  pl.b1.unit03.lesson03.teach.przedstawic_postepy:
    title: "Present the progress"
    gloss: "present the progress"
    note: "*panie Marku* -- the vocative form of address used when speaking directly to Marek formally."
    example_gloss: "Could you present the progress on the project?"

  pl.b1.unit03.lesson03.teach.oczywiscie_prawie:
    title: "Of course, almost"
    gloss: "of course, almost"
    note: "Two common discourse words -- *oczywiście* opens an agreeing response, *prawie* softens a claim of completeness."
    example_gloss: "Of course. The project is almost ready."

  pl.b1.unit03.lesson03.teach.potrzebowac:
    title: "To need"
    gloss: "to need"
    note: "*potrzebuje* (he/she needs, used with pan/pani) and *potrzebuję* (I need) -- same verb, different persons."
    example_gloss: "I need more time."

  pl.b1.unit03.lesson03.teach.problem_z_elementem:
    title: "A problem with an element"
    gloss: "a problem with an element"
    note: "*z* (with) takes the instrumental case: *element* -> *elementem*, continuing the same preposition-plus-case pattern from earlier in this course."
    example_gloss: "We have a problem with one element."

  pl.b1.unit03.lesson03.teach.przetestowac:
    title: "Test once more"
    gloss: "test once more"
    note: "*go* -- the accusative pronoun \"it,\" referring back to the element."
    example_gloss: "We should test it once more."

  pl.b1.unit03.lesson03.teach.przesunac_termin:
    title: "Postpone the deadline"
    gloss: "postpone the deadline"
    note: "*o tydzień* -- \"by a week,\" the amount of a shift or change."
    example_gloss: "We can postpone the deadline by a week."

  pl.b1.unit03.lesson03.teach.pomoze:
    title: "That will help a lot"
    gloss: "that will help a lot"
    note: "*pomoże* -- the future tense of *pomóc* (to help)."
    example_gloss: "Thank you, that will help a lot."

  pl.b1.unit03.teach.dialogue.line01:
    title: "The manager opens the meeting"
    gloss: "Good day, Mr. Marek. Could you present the progress on the project?"
    note: "A formal, direct meeting opener."
  pl.b1.unit03.teach.dialogue.line02:
    title: "Marek responds and makes his request"
    gloss: "Of course. The project is almost ready. I would like to propose a new deadline."
    note: "Marek's stated request -- exactly the fact this lesson's exercises test about him."
  pl.b1.unit03.teach.dialogue.line03:
    title: "The manager asks why"
    gloss: "Why do you need more time?"
    note: "A natural formal follow-up question."
  pl.b1.unit03.teach.dialogue.line04:
    title: "Marek explains the problem"
    gloss: "We have a problem with one element. We should test it once more."
    note: "Marek's stated problem -- exactly the fact this lesson's exercises test about him."
  pl.b1.unit03.teach.dialogue.line05:
    title: "The manager resolves it"
    gloss: "I understand. We can postpone the deadline by a week."
    note: "The manager's stated resolution -- exactly one week, never contradicted elsewhere."
  pl.b1.unit03.teach.dialogue.line06:
    title: "Marek thanks her"
    gloss: "Thank you, that will help a lot."
    note: "A natural, warm close to the exchange."

  pl.b1.unit03.lesson04.teach.szanowna_pani:
    title: "Dear Madam / Dear Sir"
    gloss: "Dear Madam / Dear Sir"
    note: "The standard formal opening of a Polish professional message."
    example_gloss: "Dear Madam Manager,"

  pl.b1.unit03.lesson04.teach.z_powazaniem:
    title: "Best regards"
    gloss: "*z poważaniem* -- best regards. The standard formal closing of a Polish professional message."
    example_gloss: "Best regards, Marek."

  pl.b1.unit03.lesson04.teach.wiadomosc:
    title: "Message"
    gloss: "message"
    note: "A feminine noun."
    example_gloss: "I am writing this message regarding the project."

  pl.b1.unit03.lesson04.teach.pisze_w_sprawie:
    title: "I am writing regarding..."
    gloss: "*Piszę w sprawie...* -- I am writing regarding... The formal opening line of every professional message."
    note: "*sprawie* is the locative form of *sprawa* (matter), used after \"w\"."

  pl.b1.unit03.lesson04.teach.phrase_full_message:
    title: "A complete formal message"
    gloss: "Dear Madam Manager, I am writing this message regarding the project. I would like to propose a new deadline. Best regards, Marek."
    note: "Combines this unit's full toolkit -- formal opening, the request construction, formal closing -- into one real message."

