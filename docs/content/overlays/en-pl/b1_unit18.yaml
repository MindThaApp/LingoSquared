teaching:
  pl.b1.unit18.lesson01.teach.kiedy_wracam_z_pracy:
    title: "When I get home from work, I always make dinner"
    gloss: "When I get home from work, I always make dinner."
    note: "*Kiedy* + imperfective present in both clauses -- a habitual, repeated routine."
    example_gloss: "Every evening, when I get home from work, I always make dinner."
  pl.b1.unit18.lesson01.teach.kiedy_jestem_zmeczony:
    title: "When I'm tired, I watch television"
    gloss: "When I'm tired, I watch television."
    note: "The same habitual time-clause pattern, a second routine example."
    example_gloss: "In the evening, when I'm tired, I watch television."
  pl.b1.unit18.lesson01.teach.habitualny_note:
    title: "Habitual time clause"
    gloss: "\"Kiedy\" + imperfective verb in both clauses -- describes a REPEATED action, a routine."
    note: "The habitual half of this unit's core contrast."
  pl.b1.unit18.lesson01.teach.recap_basics:
    title: "I live near my parents' house. I forgot my phone at home."
    gloss: "I live near my parents' house. I forgot my phone at home."
    note: "Recap vocabulary used elsewhere in this unit."
    example_gloss: "My house is nearby, and I always have my phone on me."

  pl.b1.unit18.lesson02.teach.gdy_wrocilem_z_pracy_wczoraj:
    title: "When I got home from work yesterday, the phone rang"
    gloss: "When I got home from work yesterday, the phone rang."
    note: "*Gdy* + perfective past in both clauses -- a SINGLE past occasion, one event right after another."
    example_gloss: "Just as I got home from work yesterday, the phone rang."
  pl.b1.unit18.lesson02.teach.to_byla_moja_siostra:
    title: "It was my sister"
    gloss: "It was my sister."
    note: "Answers who was on the phone."
    example_gloss: "I picked up the phone -- it was my sister."
  pl.b1.unit18.lesson02.teach.kiedy_gdy_note:
    title: "Kiedy/gdy + past = a single occasion"
    gloss: "\"Kiedy\"/\"gdy\" + perfective verb in both clauses -- describes a SINGLE past event, one after another. \"Kiedy\" and \"gdy\" are interchangeable here."
    note: "The past-narrative half of this unit's core contrast."

  pl.b1.unit18.teach.dialogue.line01:
    title: "Ewa asks about yesterday evening"
    gloss: "What were you doing yesterday evening?"
    note: "Opens the routine-vs-single-event exchange."
  pl.b1.unit18.teach.dialogue.line02:
    title: "Marek describes his routine"
    gloss: "When I get home from work, I always make dinner -- yesterday it was the same."
    note: "States the habitual routine before the single-occasion interruption."
  pl.b1.unit18.teach.dialogue.line03:
    title: "Marek describes yesterday's interruption"
    gloss: "But when I got home from work yesterday, the phone rang."
    note: "The single past-occasion time clause, contrasting with line02's habitual one."
  pl.b1.unit18.teach.dialogue.line04:
    title: "Ewa asks who called"
    gloss: "Who was it?"
    note: "Prompts the next line's answer."
  pl.b1.unit18.teach.dialogue.line05:
    title: "Marek explains the call and its effect"
    gloss: "It was my sister. We talked for an hour, so I made dinner later."
    note: "Closes the narrative, explaining the deviation from the routine."
  pl.b1.unit18.teach.dialogue.line06:
    title: "Ewa comments on being tired (feminine)"
    gloss: "When I'm tired after a long conversation, I prefer to eat something simple."
    note: "*zmęczona* -- feminine, since Ewa is speaking about herself; a second habitual time-clause example."

  pl.b1.unit18.lesson04.teach.review_note:
    title: "Habitual vs. single-occasion time clauses"
    gloss: "Contrast: 1) routine -- \"kiedy\" + imperfective verb in both clauses (When I get home from work, I always make dinner), 2) a single past event -- \"kiedy\"/\"gdy\" + perfective verb in both clauses (When I got home from work yesterday, the phone rang)."
    note: "The full contrast this unit's culminating exercise requires."

