answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit75.pociag_juz_odjechal: {"title": "The Train Has Already Left", "description": "Explain that something had already happened before a certain point, using the plain Polish past with już, wcześniej, zanim and po tym jak."}
lessons:
  pl.a2.unit75.lesson01.juz_odjechal: {"title": "Already Gone"}
  pl.a2.unit75.lesson02.zanim_i_po_tym_jak: {"title": "Before and After"}
  pl.a2.unit75.lesson03.wczesniejsze_zdarzenie: {"title": "The Earlier Event"}
  pl.a2.unit75.lesson04.zgubilem_zapomnialem: {"title": "Lost and Forgotten"}
  pl.a2.unit75.lesson05.spoznilem_sie: {"title": "I Was Late"}
  pl.a2.unit75.lesson06.ewa_i_marek_rozmawiaja: {"title": "Ewa and Marek Talk"}
teaching:
  pl.a2.unit75.lesson01.teach.dworzec: {"title": "At the station", "gloss": "train / station / to leave (by vehicle) / to arrive (by vehicle) / already / earlier / later / when", "note": "*Odjechać* and *dojechać* are perfective: they name a finished event. Past forms: *odjechał*, *dojechał*.", "example_gloss": ["The train has already left.", "Marek reached the station.", "Marek arrived later.", "The train left earlier.", "When did Marek reach the station?"]}
  pl.a2.unit75.lesson01.teach.gn_juz: {"title": "Same past, with już", "gloss": "The train had already left when I arrived at the station.", "note": "Polish has no separate pluperfect. The plain past tense is used for both events, and *już* ('already') shows that the first one came earlier."}
  pl.a2.unit75.lesson01.teach.gn_wczesniej: {"title": "Wcześniej and później", "gloss": "The train left earlier. Marek arrived later.", "note": "*Wcześniej* ('earlier') and *później* ('later') place the events in order. No special verb form is needed."}
  pl.a2.unit75.lesson01.teach.za_pozno: {"title": "Too late", "gloss": "Too late! The train has already left.", "note": "A short, common reaction at a station."}
  pl.a2.unit75.lesson02.teach.kolejnosc: {"title": "Order of events", "gloss": "before / after / first / then / coffee / to buy", "note": "*Zanim* and *po tym jak* join two events. *Kupić* is perfective: *kupił* means he bought it once and finished.", "example_gloss": ["Before Marek arrived, the train left.", "After the train left, Marek bought a coffee.", "First the train left, then Marek bought a coffee.", "Marek bought a coffee."]}
  pl.a2.unit75.lesson02.teach.gn_zanim: {"title": "Zanim + past", "gloss": "Before I arrived, the train left. Before Ewa arrived, the train left.", "note": "After *zanim* Polish uses the plain past, usually with a perfective verb. English says 'had left'; Polish just says *odjechał*."}
  pl.a2.unit75.lesson02.teach.gn_po_tym_jak: {"title": "Po tym jak + past", "gloss": "After the train left, I bought a coffee. After the train left, Ewa bought a coffee.", "note": "*Po tym jak* is followed by the plain past. The perfective verb shows that the first event was finished before the second."}
  pl.a2.unit75.lesson02.teach.najpierw_potem: {"title": "First, then", "gloss": "First the train left, then I bought a coffee.", "note": "*Najpierw* and *potem* put two events in order."}
  pl.a2.unit75.lesson03.teach.pary: {"title": "Verb pairs", "gloss": "to buy (once) / to buy (repeatedly) / to eat up / to eat / to go out (once) / to go out (repeatedly) / to lose / to lose (repeatedly) / to leave (once) / to leave (repeatedly)", "note": "Most verbs come in pairs. The first of each pair is perfective (a finished event); the second is imperfective (repeated or in progress).", "example_gloss": ["Marek bought a ticket.", "Every day Marek bought coffee.", "Ewa ate breakfast.", "Ewa was eating breakfast.", "Marek left the house.", "Every day Marek left the house at eight.", "Marek lost his ticket.", "Every day the train left at eight."]}
  pl.a2.unit75.lesson03.teach.czas_i_rzeczy: {"title": "Time words and things", "gloss": "breakfast / ticket / every day / yesterday / from home / at eight", "note": "*Codziennie* signals a repeated action; *wczoraj* can signal one finished event.", "example_gloss": ["Yesterday Marek bought a coffee.", "Every day Ewa ate breakfast."]}
  pl.a2.unit75.lesson03.teach.gn_dokonany: {"title": "The earlier event is perfective", "gloss": "Ewa had already eaten breakfast when Marek left the house. Marek had lost his ticket earlier.", "note": "An earlier event that was completed uses the perfective past: *zjadła*, *wyszedł*, *zgubił*. This is how Polish says what 'had happened'."}
  pl.a2.unit75.lesson03.teach.gn_niedokonany: {"title": "Repeated or ongoing: the other verb", "gloss": "While Ewa was eating breakfast, Marek left the house. Every day Marek bought coffee. Yesterday Marek bought a coffee.", "note": "A repeated or ongoing action uses the imperfective: *jadła*, *kupował*. One finished event uses the perfective: *kupił*."}
  pl.a2.unit75.lesson04.teach.zguby: {"title": "Lost and forgotten things", "gloss": "keys / wallet / to forget / yes / no / yet / question word for yes-no questions", "note": "*Zapomnieć* is followed by an infinitive: *zapomniał kupić* means 'forgot to buy'.", "example_gloss": ["Marek lost his keys.", "Ewa lost her wallet.", "Marek forgot to buy a ticket.", "Ewa forgot to buy coffee."]}
  pl.a2.unit75.lesson04.teach.gn_czy_juz: {"title": "Czy już...? Tak, już... Nie, jeszcze nie...", "gloss": "Have you already bought a ticket? Yes, I already have. No, I haven't bought one yet.", "note": "*Czy już...?* asks whether something has happened. Answer *Tak, już...* or *Nie, jeszcze nie...*. The verb stays in the plain past; *-łeś* addresses a man, *-łem* is a man speaking."}
  pl.a2.unit75.lesson04.teach.gn_zapomniec: {"title": "Forgot to do something", "gloss": "I forgot to buy a ticket. I lost my keys and my wallet.", "note": "Past forms show the speaker's gender: *-łem* for a man, *-łam* for a woman (*zapomniałam*, *zgubiłam*)."}
  pl.a2.unit75.lesson04.teach.pytanie_o_jedzenie: {"title": "Have you eaten?", "gloss": "Have you already eaten? Yes, I have already eaten. No, I haven't eaten yet."}
  pl.a2.unit75.lesson05.teach.slowa_czytanki: {"title": "Words for the story", "gloss": "today / to be late, to miss / too late / because / to look for / at home / now / to wait / next", "note": "*Spóźnić się na pociąg* means to miss the train by being late. *Bo* gives the reason.", "example_gloss": ["Today Ewa missed the train.", "Marek left too late because he lost his ticket.", "Marek looked for his keys at home.", "Now Ewa is waiting for the next train."]}
  pl.a2.unit75.lesson05.teach.czytanka: {"title": "Marek tells what happened", "gloss": "Today I missed the train. I left the house too late because I had lost my ticket earlier. I looked for the ticket at home. When I arrived at the station, the train had already left. After the train left, I bought a coffee. Now I am waiting for the next train.", "note": "Notice that the earlier events (*zgubiłem bilet*, *pociąg już odjechał*) use the plain past, helped by *wcześniej* and *już*.", "glosses": {"spóźniłem": "was late", "szukałem": "looked for", "biletu": "ticket (object of 'look for')", "czekam": "I wait", "następny": "next"}}
  pl.a2.unit75.lesson06.teach.d1: {"title": "Ewa asks why", "gloss": "Ewa: Hi, Marek. Why are you late?"}
  pl.a2.unit75.lesson06.teach.d2: {"title": "Marek explains", "gloss": "Marek: The train had already left when I arrived at the station."}
  pl.a2.unit75.lesson06.teach.d3: {"title": "Ewa asks about leaving home", "gloss": "Ewa: Why did you leave the house too late?"}
  pl.a2.unit75.lesson06.teach.d4: {"title": "Marek gives the reason", "gloss": "Marek: I had lost my ticket earlier and I looked for it at home."}
  pl.a2.unit75.lesson06.teach.d5: {"title": "Ewa sympathizes", "gloss": "Ewa: What a pity! Are you waiting for the next train?"}
  pl.a2.unit75.lesson06.teach.d6: {"title": "Marek answers", "gloss": "Marek: Yes, I am. After the train left, I bought a coffee."}
exercises:
  pl.a2.unit75.lesson01.exercise01.elige_juz: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Pociąg już odjechał, kiedy Marek dojechał na dworzec.", "distractors": ["Pociąg już odjechać, kiedy Marek dojechał na dworzec.", "Pociąg już odjechał, kiedy Marek dojechać na dworzec.", "Pociąg już odjechały, kiedy Marek dojechał na dworzec."], "accepted_answers": [{"value": "Pociąg już odjechał, kiedy Marek dojechał na dworzec.", "status": "correct"}], "feedback": "Both events use the plain past: *odjechał* and *dojechał*. *Już* shows the train left first."}
  pl.a2.unit75.lesson01.exercise02.elige_wczesniej: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Pociąg odjechał wcześniej.", "distractors": ["Pociąg odjechała wcześniej.", "Pociąg odjechali wcześniej.", "Pociąg wcześniej odjechać."], "accepted_answers": [{"value": "Pociąg odjechał wcześniej.", "status": "correct"}], "feedback": "*Pociąg* is masculine, so the past form is *odjechał*."}
  pl.a2.unit75.lesson01.exercise03.une_dworzec: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "pociąg", "right": "train"}, {"left": "dworzec", "right": "station"}, {"left": "już", "right": "already"}, {"left": "wcześniej", "right": "earlier"}, {"left": "później", "right": "later"}, {"left": "kiedy", "right": "when"}, {"left": "odjechać", "right": "to leave (by vehicle)"}, {"left": "dojechać", "right": "to arrive (by vehicle)"}], "status": "correct"}], "feedback": "These are the words for the station scene."}
  pl.a2.unit75.lesson01.exercise04.ordena_pozniej: {"instruction": "Put the words in order to say 'Marek arrived at the station later.'", "correct_option": "Marek dojechał na dworzec później", "accepted_answers": [{"value": "Marek dojechał na dworzec później", "status": "correct"}, {"value": "Później Marek dojechał na dworzec", "status": "correct"}, {"value": "Marek dojechał później na dworzec", "status": "correct"}, {"value": "Marek później dojechał na dworzec", "status": "correct"}], "feedback": "*Marek dojechał na dworzec później*."}
  pl.a2.unit75.lesson01.exercise05.completa_juz: {"instruction": "Complete with the Polish word for 'already'.", "correct_option": "już", "accepted_answers": [{"value": "już", "status": "correct"}], "feedback": "*Pociąg już odjechał*: *już* means 'already'."}
  pl.a2.unit75.lesson01.exercise06.traduce_juz: {"instruction": "Translate into Polish using the plain past and *już*.", "accepted_answers": [{"value": "Pociąg już odjechał.", "status": "correct"}, {"value": "Pociąg już odjechał", "status": "correct"}, {"value": "Pociąg odjechał już.", "status": "correct"}, {"value": "Pociąg odjechał już", "status": "correct"}], "feedback": "*Pociąg już odjechał*: Polish uses the plain past."}
  pl.a2.unit75.lesson01.exercise07.escribe_juz: {"instruction": "Write one Polish sentence with *już* and *kiedy*. Use the plain past for both events.", "correct_option": "Pociąg już odjechał, kiedy Marek dojechał.", "accepted_answers": [{"value": "Pociąg już odjechał, kiedy Marek dojechał.", "status": "correct"}, {"value": "Pociąg już odjechał, kiedy Marek dojechał", "status": "correct"}, {"value": "Pociąg już odjechał, kiedy Marek dojechał na dworzec.", "status": "correct"}, {"value": "Pociąg już odjechał, kiedy Marek dojechał na dworzec", "status": "correct"}, {"value": "Kiedy Marek dojechał, pociąg już odjechał.", "status": "correct"}, {"value": "Kiedy Marek dojechał, pociąg już odjechał", "status": "correct"}, {"value": "Kiedy Marek dojechał na dworzec, pociąg już odjechał.", "status": "correct"}, {"value": "Kiedy Marek dojechał na dworzec, pociąg już odjechał", "status": "correct"}], "feedback": "*Pociąg już odjechał, kiedy Marek dojechał.*"}
  pl.a2.unit75.lesson02.exercise01.elige_zanim: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Zanim Marek dojechał, pociąg odjechał.", "distractors": ["Zanim Marek dojechać, pociąg odjechał.", "Zanim Marek dojechał, pociąg odjechały.", "Po tym jak Marek dojechał, pociąg odjechał."], "accepted_answers": [{"value": "Zanim Marek dojechał, pociąg odjechał.", "status": "correct"}], "feedback": "*Zanim* means 'before'. *Po tym jak* would mean 'after' and change the meaning."}
  pl.a2.unit75.lesson02.exercise02.elige_po: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Po tym jak pociąg odjechał, Marek kupił kawę.", "distractors": ["Zanim pociąg odjechał, Marek kupił kawę.", "Po tym jak pociąg odjechał, Marek kupiła kawę.", "Po tym jak pociąg odjechał, Marek kupić kawę."], "accepted_answers": [{"value": "Po tym jak pociąg odjechał, Marek kupił kawę.", "status": "correct"}], "feedback": "*Po tym jak* means 'after'; *Marek* is masculine, so *kupił*."}
  pl.a2.unit75.lesson02.exercise03.une_kolejnosc: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "zanim", "right": "before"}, {"left": "po tym jak", "right": "after"}, {"left": "najpierw", "right": "first"}, {"left": "potem", "right": "then"}, {"left": "kawa", "right": "coffee"}, {"left": "kupić", "right": "to buy"}, {"left": "kupił", "right": "bought"}, {"left": "odjechał", "right": "left"}], "status": "correct"}], "feedback": "These words order two events."}
  pl.a2.unit75.lesson02.exercise04.ordena_po: {"instruction": "Put the words in order to say 'After the train left, Marek bought a coffee.'", "correct_option": "Po tym jak pociąg odjechał Marek kupił kawę", "accepted_answers": [{"value": "Po tym jak pociąg odjechał Marek kupił kawę", "status": "correct"}, {"value": "Marek kupił kawę po tym jak pociąg odjechał", "status": "correct"}], "feedback": "*Po tym jak* introduces the first event."}
  pl.a2.unit75.lesson02.exercise05.completa_odjechal: {"instruction": "Complete with the masculine past form of the verb 'odjechać'.", "correct_option": "odjechał", "accepted_answers": [{"value": "odjechał", "status": "correct"}], "feedback": "*Pociąg odjechał*: a finished event, so the perfective past."}
  pl.a2.unit75.lesson02.exercise06.traduce_zanim: {"instruction": "Translate into Polish using *zanim* and the plain past.", "accepted_answers": [{"value": "Zanim dojechałem, pociąg odjechał.", "status": "correct"}, {"value": "Zanim dojechałem, pociąg odjechał", "status": "correct"}, {"value": "Zanim dojechałam, pociąg odjechał.", "status": "correct"}, {"value": "Zanim dojechałam, pociąg odjechał", "status": "correct"}, {"value": "Zanim dojechałem na dworzec, pociąg odjechał.", "status": "correct"}, {"value": "Zanim dojechałem na dworzec, pociąg odjechał", "status": "correct"}, {"value": "Zanim dojechałam na dworzec, pociąg odjechał.", "status": "correct"}, {"value": "Zanim dojechałam na dworzec, pociąg odjechał", "status": "correct"}, {"value": "Pociąg odjechał, zanim dojechałem.", "status": "correct"}, {"value": "Pociąg odjechał, zanim dojechałem", "status": "correct"}, {"value": "Pociąg odjechał, zanim dojechałam.", "status": "correct"}, {"value": "Pociąg odjechał, zanim dojechałam", "status": "correct"}], "feedback": "*Zanim dojechałem, pociąg odjechał.*"}
  pl.a2.unit75.lesson02.exercise07.escribe_po: {"instruction": "Write one Polish sentence with *po tym jak* and the plain past.", "correct_option": "Po tym jak pociąg odjechał, kupiłem kawę.", "accepted_answers": [{"value": "Po tym jak pociąg odjechał, kupiłem kawę.", "status": "correct"}, {"value": "Po tym jak pociąg odjechał, kupiłem kawę", "status": "correct"}, {"value": "Po tym jak pociąg odjechał, kupiłam kawę.", "status": "correct"}, {"value": "Po tym jak pociąg odjechał, kupiłam kawę", "status": "correct"}, {"value": "Kupiłem kawę, po tym jak pociąg odjechał.", "status": "correct"}, {"value": "Kupiłem kawę, po tym jak pociąg odjechał", "status": "correct"}, {"value": "Kupiłam kawę, po tym jak pociąg odjechał.", "status": "correct"}, {"value": "Kupiłam kawę, po tym jak pociąg odjechał", "status": "correct"}], "feedback": "*Po tym jak pociąg odjechał, kupiłem kawę.*"}
  pl.a2.unit75.lesson03.exercise01.elige_zjadla: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa już zjadła śniadanie.", "distractors": ["Ewa już zjadł śniadanie.", "Ewa już zjeść śniadanie.", "Ewa już zjadły śniadanie."], "accepted_answers": [{"value": "Ewa już zjadła śniadanie.", "status": "correct"}], "feedback": "A finished earlier event: perfective *zjadła*, feminine for *Ewa*."}
  pl.a2.unit75.lesson03.exercise02.elige_codziennie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Codziennie Marek kupował kawę.", "distractors": ["Codziennie Marek kupił kawę.", "Codziennie Marek kupować kawę.", "Codziennie Marek kupowała kawę."], "accepted_answers": [{"value": "Codziennie Marek kupował kawę.", "status": "correct"}], "feedback": "*Codziennie* means a repeated action, so the imperfective *kupował*."}
  pl.a2.unit75.lesson03.exercise03.une_pary: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "kupił", "right": "bought (one finished event)"}, {"left": "kupował", "right": "used to buy"}, {"left": "zjadła", "right": "ate up (finished)"}, {"left": "jadła", "right": "was eating"}, {"left": "wyszedł", "right": "went out (once)"}, {"left": "wychodził", "right": "used to go out"}, {"left": "zgubił", "right": "lost (once)"}, {"left": "odjechał", "right": "left (once)"}, {"left": "odjeżdżał", "right": "used to leave"}], "status": "correct"}], "feedback": "Perfective forms name one finished event; imperfective forms name repeated or ongoing ones."}
  pl.a2.unit75.lesson03.exercise04.ordena_kiedy: {"instruction": "Put the words in order to say 'While Ewa was eating breakfast, Marek left the house.'", "correct_option": "Kiedy Ewa jadła śniadanie Marek wyszedł z domu", "accepted_answers": [{"value": "Kiedy Ewa jadła śniadanie Marek wyszedł z domu", "status": "correct"}, {"value": "Marek wyszedł z domu kiedy Ewa jadła śniadanie", "status": "correct"}], "feedback": "Ongoing *jadła*, finished *wyszedł*."}
  pl.a2.unit75.lesson03.exercise05.completa_kupil: {"instruction": "Complete with the masculine perfective past of 'kupić': the ticket was bought before the train left.", "correct_option": "kupił", "accepted_answers": [{"value": "kupił", "status": "correct"}], "feedback": "*Marek już kupił bilet*: a finished earlier event takes the perfective."}
  pl.a2.unit75.lesson03.exercise06.traduce_zjadla: {"instruction": "Translate into Polish using the perfective past for both events.", "accepted_answers": [{"value": "Ewa już zjadła śniadanie, kiedy Marek wyszedł z domu.", "status": "correct"}, {"value": "Ewa już zjadła śniadanie, kiedy Marek wyszedł z domu", "status": "correct"}, {"value": "Kiedy Marek wyszedł z domu, Ewa już zjadła śniadanie.", "status": "correct"}, {"value": "Kiedy Marek wyszedł z domu, Ewa już zjadła śniadanie", "status": "correct"}, {"value": "Ewa zjadła już śniadanie, kiedy Marek wyszedł z domu.", "status": "correct"}, {"value": "Ewa już zjadła śniadanie, zanim Marek wyszedł z domu.", "status": "correct"}, {"value": "Ewa zjadła już śniadanie, zanim Marek wyszedł z domu.", "status": "correct"}], "feedback": "*Ewa już zjadła śniadanie, kiedy Marek wyszedł z domu.*"}
