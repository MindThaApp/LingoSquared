course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: recount a complex sequence of events with
    shifting time reference -- background (imperfective aspect) vs.
    foreground (perfective aspect), events before other past events
    (zanim, już, poprzedniego wieczoru), and interrupted vs. ongoing vs.
    habitual actions (kiedy/gdy, podczas gdy, zawsze) -- keeping the timeline
    unambiguous, around the story of a missed train.

units:
  pl.b2.unit04.opowiesc:
    title: "Narrative"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, events before other past events, and interrupted or ongoing actions -- keeping the timeline unambiguous.

lessons:
  pl.b2.unit04.lesson01.tlo_jak_to_bylo:
    title: "The background: how it was"
  pl.b2.unit04.lesson02.wydarzenie_i_kolejnosc:
    title: "The event and the sequence"
  pl.b2.unit04.lesson03.kiedy_podczas_gdy_gdy:
    title: "When and while"
  pl.b2.unit04.lesson04.co_wydarzylo_sie_wczesniej:
    title: "What happened earlier"
  pl.b2.unit04.lesson05.co_wydarzylo_sie_najpierw:
    title: "What happened first?"
  pl.b2.unit04.lesson06.opowiadanie_calej_historii:
    title: "Telling the whole story"

teaching:
  pl.b2.unit04.lesson01.teach.bylem_zmeczony:
    title: "I was tired."
    gloss: "I was tired."
    note: "*Byłem* is the imperfective/simple past of *być* ('to be') -- Polish 'to be' has only one aspect, used for background states like this throughout the unit."
  pl.b2.unit04.lesson01.teach.tego_ranka:
    title: "that morning"
    gloss: "that morning"
    note: "*Tego ranka* is the genitive of time -- Polish states a point in past time this way, without a preposition."
    example_gloss: "That morning I was tired."
  pl.b2.unit04.lesson01.teach.padac:
    title: "to rain"
    gloss: "to rain (imperfective)"
    note: "*Padać* is imperfective -- used for describing an ongoing background condition ('it was raining'), not a single completed event."
    example_gloss: "It was raining that morning."
  pl.b2.unit04.lesson01.teach.na_dworze:
    title: outside
    gloss: outside
    example_gloss: "It was raining outside."
  pl.b2.unit04.lesson01.teach.zimno:
    title: cold
    gloss: cold
    example_gloss: "It was cold outside."
  pl.b2.unit04.lesson01.teach.spieszyc_sie:
    title: "to hurry / be in a hurry"
    gloss: "to hurry / be in a hurry (imperfective)"
    note: "*Śpieszyć się* is reflexive and imperfective -- an ongoing state, like the other background verbs in this lesson."
    example_gloss: "I was hurrying."
  pl.b2.unit04.lesson01.teach.bylo_jeszcze_ciemno:
    title: "It was still dark."
    gloss: "It was still dark."
  pl.b2.unit04.lesson01.teach.grammar_tlo:
    title: "It was raining. I was tired. I was hurrying."
    gloss: "It was raining. I was tired. I was hurrying."
    note: "Background = the scene-setting description, told with IMPERFECTIVE aspect (padało, byłem, śpieszyłem się) -- Polish marks 'background vs. foreground' through this aspect choice, not through a separate tense."

  pl.b2.unit04.lesson02.teach.przegapilem_pociag:
    title: "I missed the train."
    gloss: "I missed the train."
    note: "*Przegapiłem* is PERFECTIVE (the completed, foregrounded event), contrasting with Lesson 1's imperfective background verbs."
  pl.b2.unit04.lesson02.teach.spoznilem_sie:
    title: "I was late."
    gloss: "I was late. / I ended up late."
  pl.b2.unit04.lesson02.teach.najpierw:
    title: first
    gloss: first
    example_gloss: "First it was raining."
  pl.b2.unit04.lesson02.teach.potem:
    title: "then / after that"
    gloss: "then / after that"
    example_gloss: "After that I was hurrying."
  pl.b2.unit04.lesson02.teach.w_koncu:
    title: "in the end / eventually"
    gloss: "in the end / eventually"
    example_gloss: "In the end I missed the train."
  pl.b2.unit04.lesson02.teach.grammar_wydarzenie:
    title: "I was tired. I was hurrying. In the end I missed the train."
    gloss: "I was tired. I was hurrying. In the end I missed the train."
    note: "The foregrounded event (przegapiłem, PERFECTIVE) is the point of the story -- sequence markers (najpierw, potem, w końcu) show how it follows from the background."

  pl.b2.unit04.lesson03.teach.stacja:
    title: "station"
    gloss: "the station"
    note: "*Stacji* is the locative form after *na* ('at')."
    example_gloss: "I was at the station."
  pl.b2.unit04.lesson03.teach.dotrzec:
    title: "to arrive / reach"
    gloss: "to arrive / to reach (perfective)"
    example_gloss: "I arrived at the station."
  pl.b2.unit04.lesson03.teach.odjechac:
    title: "to depart / leave"
    gloss: "to depart / to leave (perfective)"
    example_gloss: "The train left."
  pl.b2.unit04.lesson03.teach.kiedy_dotarlem:
    title: "When I arrived at the station, the train had just left."
    gloss: "When I arrived at the station, the train had just left."
    note: "*Kiedy* ('when') introduces the time clause; the PERFECTIVE verbs (*dotarłem*, *odjechał*) are what make this a single completed moment. A comma follows the *kiedy*-clause."
  pl.b2.unit04.lesson03.teach.szef:
    title: boss
    gloss: "the boss"
    example_gloss: "My boss called."
  pl.b2.unit04.lesson03.teach.ubierac_sie:
    title: "to get dressed"
    gloss: "to get dressed (imperfective)"
    example_gloss: "I was getting dressed."
  pl.b2.unit04.lesson03.teach.zadzwonic:
    title: "to call (phone)"
    gloss: "to call on the phone (perfective)"
    example_gloss: "He called me."
  pl.b2.unit04.lesson03.teach.podczas_gdy:
    title: "While I was getting dressed, my boss called."
    gloss: "While I was getting dressed, my boss called."
    note: "*Podczas gdy* ('while') explicitly marks an ONGOING action during which something else happens. The ongoing verb (*ubierałem się*) is imperfective; the interrupting event (*zadzwonił*) is perfective."
  pl.b2.unit04.lesson03.teach.gdy_habit:
    title: "Whenever I'm late, I always call my boss."
    gloss: "Whenever I'm late, I always call my boss."
    note: "*Gdy* means 'when', just like *kiedy* -- the two are largely interchangeable (*gdy* is slightly more formal). The HABIT reading here comes from the imperfective present (*spóźniam się*, *dzwonię*) plus *zawsze* ('always'), not from *gdy* itself."
  pl.b2.unit04.lesson03.teach.grammar_kiedy_gdy:
    title: "When I arrived at the station, the train had just left. While I was getting dressed, my boss called. Whenever I'm late, I always call my boss."
    gloss: "When I arrived at the station, the train had just left. While I was getting dressed, my boss called. Whenever I'm late, I always call my boss."
    note: "*Kiedy* and *gdy* both mean 'when' and are largely interchangeable; *podczas gdy* means 'while'. What sets the three time relations apart is aspect and framing: a perfective verb = a single completed moment; *podczas gdy* + imperfective = an ongoing action; imperfective present + *zawsze* = a habit."

  pl.b2.unit04.lesson04.teach.nastawic_budzik:
    title: "to set the alarm"
    gloss: "to set the alarm clock"
    note: "*Nastawić* is PERFECTIVE (one completed setting), so it has no present tense. The example uses its imperfective partner *nastawiać*: *nastawiam* = 'I'm setting'."
    example_gloss: "I'm setting the alarm."
  pl.b2.unit04.lesson04.teach.nie_nastawilem_budzika:
    title: "I hadn't set my alarm."
    gloss: "I hadn't set my alarm."
    note: "Polish has no dedicated pluperfect tense here -- the negated PERFECTIVE past (*nie nastawiłem*) combined with *poprzedniego wieczoru* ('the evening before') carries the 'had (not) done' pre-past meaning."
  pl.b2.unit04.lesson04.teach.poprzedniego_wieczoru:
    title: "the evening before"
    gloss: "the evening before"
    note: "This adverbial, not a special verb form, is what signals 'this happened even earlier than the rest of the story'."
    example_gloss: "The evening before, I was tired."
  pl.b2.unit04.lesson04.teach.juz:
    title: already
    gloss: already
    note: "*Już* with a perfective past verb is how Polish marks that something had already happened by a reference point -- the functional equivalent of English 'had already'."
    example_gloss: "The train had already left."
  pl.b2.unit04.lesson04.teach.zanim:
    title: before
    gloss: before
    example_gloss: "Before I left, it was raining."
  pl.b2.unit04.lesson04.teach.zanim_juz_odjechal:
    title: "By the time I arrived at the station, the train had already left."
    gloss: "By the time I arrived at the station, the train had already left."
    note: "*Zanim ... już ...* together give the pre-past 'had already' reading -- Polish's genuine device for this, not a calque of a foreign pluperfect."
  pl.b2.unit04.lesson04.teach.grammar_wczesniej:
    title: "I hadn't set my alarm. By the time I arrived at the station, the train had already left."
    gloss: "I hadn't set my alarm. By the time I arrived at the station, the train had already left."
    note: "The PRE-PAST (the event before the other past events) is marked in Polish through *już*/*zanim*/*poprzedniego wieczoru* plus ordinary past tense -- there is no separate pluperfect verb form to learn."

  pl.b2.unit04.lesson05.teach.tekst:
    title: "Reading: what happened first?"
    gloss: "In the end I missed the train. When I arrived at the station, the train had already left. It was raining that morning and I was hurrying. But this began earlier: the evening before, I hadn't set my alarm. That's why I woke up too late."
    glosses:
      i: and
      zaczęło: "began (zaczęło się = it began)"
      wcześniej: earlier
      Dlatego: "that's why / therefore"
      obudziłem: "woke up (obudziłem się = I woke up)"
      za: too
      późno: late

  pl.b2.unit04.lesson06.teach.dlaczego_byles_spozniony:
    title: "Why were you so late this morning?"
    gloss: "Why were you so late this morning?"
    note: "*Byłeś* is the masculine 2nd-person past of *być*, addressed to Marek."
  pl.b2.unit04.lesson06.teach.czyli:
    title: "so / that means"
    gloss: "so / that means"
    example_gloss: "So that happened first."
  pl.b2.unit04.lesson06.teach.wydarzyc_sie:
    title: "to happen"
    gloss: "to happen"
    example_gloss: "That happened first."
  pl.b2.unit04.lesson06.teach.dokladnie:
    title: exactly
    gloss: exactly
    example_gloss: "Exactly so."
  pl.b2.unit04.lesson06.teach.dialogue_ewa_open:
    title: "Ewa: Why were you so late this morning?"
    gloss: "Ewa: Why were you so late this morning?"
  pl.b2.unit04.lesson06.teach.dialogue_marek_outcome:
    title: "Marek: I missed the train. When I arrived at the station, the train had already left."
    gloss: "Marek: I missed the train. When I arrived at the station, the train had already left."
  pl.b2.unit04.lesson06.teach.dialogue_ewa_why:
    title: "Ewa: And why were you late getting to the station?"
    gloss: "Ewa: And why were you late getting to the station?"
  pl.b2.unit04.lesson06.teach.dialogue_marek_prepast:
    title: "Marek: I woke up too late. The evening before, I hadn't set my alarm."
    gloss: "Marek: I woke up too late. The evening before, I hadn't set my alarm."
  pl.b2.unit04.lesson06.teach.dialogue_ewa_order:
    title: "Ewa: So that happened first, and then you missed the train."
    gloss: "Ewa: So that happened first, and then you missed the train."
  pl.b2.unit04.lesson06.teach.dialogue_marek_confirm:
    title: "Marek: Exactly. First the alarm, then the train."
    gloss: "Marek: Exactly. First the alarm, then the train."
  pl.b2.unit04.lesson06.teach.grammar_cala_historia:
    title: "It was raining that morning. The evening before, I hadn't set my alarm. In the end I missed the train."
    gloss: "It was raining that morning. The evening before, I hadn't set my alarm. In the end I missed the train."
    note: "A complete account layers all three: background (imperfective), pre-past (już/poprzedniego wieczoru + perfective), and foreground outcome (perfective) -- exactly what the speaking and writing tasks of this lesson require."

exercises:
  pl.b2.unit04.lesson01.exercise01.recognize_padalo:
    instruction: "What does this word mean?"
    correct_option: "it was raining"
    distractors: ["it was cold", "it was dark", "it was late"]
    accepted_answers: [{value: "it was raining", status: correct}]
    feedback: "Padało means it was raining -- the imperfective background verb."
  pl.b2.unit04.lesson01.exercise02.listen_padalo:
    instruction: "Listen and select what you hear."
    correct_option: "It was raining that morning."
    distractors: ["It was cold that morning.", "It rained the evening before.", "It was raining that evening."]
    accepted_answers: [{value: "It was raining that morning.", status: correct}]
    feedback: "Padało tego ranka means it was raining that morning."
  pl.b2.unit04.lesson01.exercise03.match_background_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"tego ranka": "that morning", padać: "to rain", zmęczony: tired, zimno: cold, "na dworze": outside, "śpieszyć się": "to hurry / be in a hurry"}
        status: correct
    feedback: "These are this lesson's background-description words."
  pl.b2.unit04.lesson01.exercise04.order_bylo_ciemno:
    instruction: "Put the words in order: It was still dark."
    accepted_answers:
      - {value: "Było jeszcze ciemno", status: correct}
    feedback: "Było jeszcze ciemno means it was still dark."
  pl.b2.unit04.lesson01.exercise05.translate_padalo:
    instruction: "Translate into Polish, setting the background scene with the imperfective past: It was raining that morning."
    accepted_answers:
      - {value: "Padało tego ranka", status: correct}
      - {value: "Tego ranka padało", status: correct}
    feedback: "Padało tego ranka means it was raining that morning."
  pl.b2.unit04.lesson01.exercise06.write_bylem_zmeczony:
    instruction: "Write in Polish, using the imperfective past for background: I was tired."
    accepted_answers:
      - {value: "Byłem zmęczony", status: correct}
      - {value: "Byłem zmęczony.", status: correct}
      - {value: "Byłam zmęczona", status: correct}
      - {value: "Byłam zmęczona.", status: correct}
    feedback: "Byłem zmęczony means I was tired."
  pl.b2.unit04.lesson01.exercise07.speak_spieszylem_sie:
    instruction: "Say aloud in Polish, using the imperfective past: I was hurrying."
    accepted_answers:
      - {value: "Śpieszyłem się", status: correct}
      - {value: "Śpieszyłam się", status: correct}
      - {value: "Śpieszyłam się.", status: correct}
      - {value: "Spieszyłem się", status: correct}
      - {value: "Spieszyłam się", status: correct}
    feedback: "Śpieszyłem się means I was hurrying."
  pl.b2.unit04.lesson01.exercise08.dictation_padalo_ranka:
    instruction: "Type what you hear."
    correct_response: "Padało tego ranka."
    orthography_strict: true
    feedback: "You heard Padało tego ranka — it was raining that morning."

  pl.b2.unit04.lesson02.exercise01.recognize_przegapilem:
    instruction: "What does this word mean?"
    correct_option: "I missed"
    distractors: ["I was tired", "I was hurrying", "I called"]
    accepted_answers: [{value: "I missed", status: correct}]
    feedback: "Przegapiłem means I missed -- perfective, the completed foreground event."
  pl.b2.unit04.lesson02.exercise02.listen_przegapilem:
    instruction: "Listen and select what you hear."
    correct_option: "I missed the train."
    distractors: ["I missed the bus.", "I caught the train.", "I waited for the train."]
    accepted_answers: [{value: "I missed the train.", status: correct}]
    feedback: "Przegapiłem pociąg means I missed the train."
  pl.b2.unit04.lesson02.exercise03.match_sequence_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {najpierw: first, potem: "then / after that", "w końcu": "in the end / eventually", pociąg: "the train", "spóźniłem się": "I was late", przegapiłem: "I missed"}
        status: correct
    feedback: "These are this lesson's sequence and event words."
  pl.b2.unit04.lesson02.exercise04.order_spoznilem_sie:
    instruction: "Put the words in order: I was late."
    accepted_answers:
      - {value: "Spóźniłem się", status: correct}
    feedback: "Spóźniłem się means I was late."
  pl.b2.unit04.lesson02.exercise05.translate_przegapilem:
    instruction: "Translate into Polish, using the perfective past for the completed event: I missed the train."
    accepted_answers:
      - {value: "Przegapiłem pociąg", status: correct}
      - {value: "Przegapiłam pociąg", status: correct}
      - {value: "Przegapiłam pociąg.", status: correct}
    feedback: "Przegapiłem pociąg means I missed the train."
  pl.b2.unit04.lesson02.exercise06.write_w_koncu:
    instruction: "Write in Polish, starting with w końcu: In the end I missed the train."
    accepted_answers:
      - {value: "W końcu przegapiłem pociąg", status: correct}
      - {value: "W końcu przegapiłem pociąg.", status: correct}
      - {value: "W końcu przegapiłam pociąg", status: correct}
      - {value: "W końcu przegapiłam pociąg.", status: correct}
    feedback: "W końcu przegapiłem pociąg means in the end I missed the train."
  pl.b2.unit04.lesson02.exercise07.write_potem:
    instruction: "Write in Polish, starting with potem, using the imperfective past: After that I was hurrying."
    accepted_answers:
      - {value: "Potem śpieszyłem się", status: correct}
      - {value: "Potem śpieszyłem się.", status: correct}
      - {value: "Potem śpieszyłam się", status: correct}
      - {value: "Potem śpieszyłam się.", status: correct}
      - {value: "Potem się śpieszyłem", status: correct}
      - {value: "Potem się śpieszyłam", status: correct}
    feedback: "Potem śpieszyłem się means after that I was hurrying."
  pl.b2.unit04.lesson02.exercise08.dictation_przegapilem_pociag:
    instruction: "Type what you hear."
    correct_response: "Przegapiłem pociąg."
    orthography_strict: true
    feedback: "You heard Przegapiłem pociąg — I missed the train."

  pl.b2.unit04.lesson03.exercise01.recognize_kiedy:
    instruction: "What does this word mean?"
    correct_option: when
    distractors: [before, already, then]
    accepted_answers: [{value: when, status: correct}]
    feedback: "Kiedy means when; it introduces a time clause."
  pl.b2.unit04.lesson03.exercise02.listen_kiedy_dotarlem:
    instruction: "Listen and select what you hear."
    correct_option: "When I arrived at the station, the train had just left."
    distractors: ["When I arrived at the station, the train hadn't left yet.", "When I arrived home, the train had just left.", "While I was at the station, the train left."]
    accepted_answers: [{value: "When I arrived at the station, the train had just left.", status: correct}]
    feedback: "Kiedy dotarłem na stację, pociąg właśnie odjechał means when I arrived at the station, the train had just left."
  pl.b2.unit04.lesson03.exercise03.match_time_words:
