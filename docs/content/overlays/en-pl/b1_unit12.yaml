  pl.b1.unit12.obowiazki:
    title: "Obligations"

lessons:
  pl.b1.unit12.lesson01.trzeba_zebys:
    title: "Trzeba, żebyś... (It's necessary that you...)"
  pl.b1.unit12.lesson02.trzeba_bylo:
    title: "Trzeba było... (It was necessary...)"
  pl.b1.unit12.lesson03.zasady_w_bloku:
    title: "Building rules"
  pl.b1.unit12.lesson04.moje_obowiazki:
    title: "My obligations"

teaching:
  pl.b1.unit12.lesson01.teach.trzeba_wynosic:
    title: "It's necessary to take out the trash on Mondays"
    gloss: "It's necessary to take out the trash on Mondays."
    note: "*Trzeba* is invariant and impersonal -- it never conjugates for person."
    example_gloss: "In this building it's necessary to take out the trash on Mondays."

  pl.b1.unit12.lesson01.teach.trzeba_ogolne_note:
    title: "Trzeba + infinitive (general obligation)"
    gloss: "\"Trzeba\" + infinitive expresses a GENERAL obligation, without naming a specific person: *Trzeba wynosić śmieci* -- we don't say who exactly has to do it."
    note: "The general, impersonal half of this outcome's necessity construction."

  pl.b1.unit12.lesson01.teach.trzeba_zebys_wyniosl:
    title: "You need to take out the trash today"
    gloss: "It's necessary that you take out the trash today."
    note: "*żebyś* -- \"that you\" (fused personal ending); *wyniósł* -- masculine past participle, addressed to Marek."
    example_gloss: "It's necessary that you take out the trash still today."

  pl.b1.unit12.lesson01.teach.zebys_note:
    title: "Trzeba, żeby + past tense with a personal ending (specific person)"
    gloss: "\"Trzeba, żeby\" + a past-tense verb with a personal ending fused onto \"żeby\" (żebym, żebyś, żeby, żebyśmy, żebyście, żeby) -- used when the obligation is aimed at a SPECIFIC person: *Trzeba, żebyś wyniósł śmieci* -- exactly YOU have to do this."
    note: "The specific-person half of this outcome's necessity construction."

  pl.b1.unit12.lesson01.teach.trzeba_zebym_podpisala:
    title: "I need to sign the building rules"
    gloss: "It's necessary that I sign the building rules."
    note: "*żebym* -- \"that I\"; *podpisała* -- feminine past participle, since Ewa is speaking about herself."
    example_gloss: "It's necessary that I sign this building rules document still today."

  pl.b1.unit12.lesson02.teach.trzeba_bylo_zaplacic:
    title: "It was necessary to pay the rent earlier"
    gloss: "It was necessary to pay the rent earlier."
    note: "*Trzeba było* -- the past-tense frame for an obligation that was NOT fulfilled."
    example_gloss: "This month it was necessary to pay the rent earlier."

  pl.b1.unit12.lesson02.teach.trzeba_bylo_note:
    title: "Trzeba było + infinitive (general past regret)"
    gloss: "\"Trzeba było\" + infinitive -- a GENERAL obligation in the past that was NOT fulfilled: *Trzeba było zapłacić czynsz wcześniej* -- someone didn't do it."
    note: "The general, impersonal half of this unit's past-regret construction."

  pl.b1.unit12.lesson02.teach.trzeba_bylo_zebys_zaplacil:
    title: "You should have paid the rent earlier"
    gloss: "It was necessary that you pay the rent earlier."
    note: "*żebyś zapłacił* -- masculine, addressed to Marek, who didn't pay on time."
    example_gloss: "It was necessary that you pay the rent before the fifth."

  pl.b1.unit12.lesson02.teach.przed_piatym:
    title: "Before the fifth"
    gloss: "before the fifth (of the month)"
    note: "A concrete deadline for the rent-payment obligation."

  pl.b1.unit12.lesson02.teach.trzeba_bylo_zebym_podpisala:
    title: "I should have signed the building rules earlier"
    gloss: "It was necessary that I sign the building rules earlier."
    note: "Same specific-person past-regret frame, now first-person feminine (Ewa)."
    example_gloss: "It was necessary that I sign the building rules earlier, but I forgot."

  pl.b1.unit12.lesson02.teach.zapomniala_note:
    title: "General vs specific-person past regret"
    gloss: "The only difference is whether the obligation targets a specific person: \"trzeba było\" (in general) vs \"trzeba było, żeby...\" (specifically you/me/us)."
    note: "*zapomniałam* -- \"I forgot\" (feminine)."

  pl.b1.unit12.teach.dialogue.line01:
    title: "Marek asks if Ewa read the rules"
    gloss: "Ewa, did you read the building rules?"
    note: "Opens the building-rules exchange this lesson's exercises test."
  pl.b1.unit12.teach.dialogue.line02:
    title: "Ewa states the general trash rule"
    gloss: "Yes, it's necessary to take out the trash on Mondays and Wednesdays."
    note: "General \"trzeba\" + infinitive, no specific person named."
  pl.b1.unit12.teach.dialogue.line03:
    title: "Marek mentions the prohibition"
    gloss: "And do you know that it's not allowed to smoke on the balcony?"
    note: "*nie wolno* -- the SEPARATE modal used for prohibition, not \"nie trzeba\"."
  pl.b1.unit12.teach.dialogue.line04:
    title: "Ewa contrasts her old apartment"
    gloss: "Really? At my old apartment it was allowed."
    note: "*było wolno* -- \"it was allowed\" (past tense of the same *wolno*), a real contrast, not a new fact contradicting anything established."
  pl.b1.unit12.teach.dialogue.line05:
    title: "Marek admits he forgot the rent deadline"
    gloss: "Not here. And it was necessary to pay the rent by the fifth day of the month -- I forgot!"
    note: "*trzeba było* (general, unfulfilled) -- Marek is confessing his own missed obligation."
  pl.b1.unit12.teach.dialogue.line06:
    title: "Ewa tells Marek what he needs to do"
    gloss: "It's necessary that you call the management office and explain this."
    note: "*Trzeba, żebyś* -- specific-person present necessity, addressed to Marek."

  pl.b1.unit12.lesson04.teach.nowy_obowiazek:
    title: "I have a new duty at work"
    gloss: "I have a new duty at work."
    note: "A fresh vocabulary bridge into this lesson's review of all three necessity forms."
    example_gloss: "Starting today I have a new duty at work."

  pl.b1.unit12.lesson04.teach.review_note:
    title: "Three forms of this obligation"
    gloss: "Three forms of this obligation: 1) trzeba/trzeba było + infinitive (in general), 2) trzeba/trzeba było, żeby + a personal past form (a specific person), 3) nie wolno (prohibition) -- different from \"nie trzeba\" (not necessary)."
    note: "The full three-part contrast this unit's culminating exercise requires."

