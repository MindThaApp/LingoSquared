  notes: >-
    Fourth en-pl A2 overlay, written for pl/a2_unit24_u_lekarza.yaml
    (schema_version 1.1, §19 format from the start). No sibling-direction
    overlay exists yet (pl-en unauthored), so §8 doesn't apply.

    No genuinely ambiguous multi-clause join in this unit -- every taught
    sentence is a single clause (duration/severity/instruction statements),
    so §12 doesn't add a second accepted form anywhere. Every note/feedback
    string mixing Polish text inline with English wraps the Polish in
    *asterisks* per §15. Every matching_pairs correct_response and
    word_order correct_response checked token-for-token against the
    realization's own pairs/word_bank. No stray YAML boolean coercion.
    Pending fresh-context review per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    false-grammar -- the three grammar_check prompts presented CORRECT
    Polish as errors ("Gardło boli mnie.", "Od trzech dni gardło mnie
    boli.", "Za tydzień proszę wrócić." are all grammatical; Polish order
    is free here): replaced with genuine errors -- lesson01.exercise08 ->
    "Boli ja gardło." (pronoun case), lesson02.exercise07 -> "Boli mnie
    gardło od trzy dni." (od + genitive), lesson03.exercise09 -> "Proszę
    wrócić od tydzień." (za vs od); overlay instructions/feedback
    rewritten to match and natural alternative orders (Gardło mnie
    boli..., Od trzech dni..., Za tydzień proszę wrócić) accepted. (2)
    comprehension-without-text -- lesson03.exercise04.comprehend_fever
    showed only the doctor's question, not Ewa's answer: added "Tak, mam.
    Bardzo mnie boli." block; lesson03.exercise05.read_follow_up showed
    only the question: added Ewa's question + "Proszę wrócić za tydzień."
    blocks. (3) missing-accepted-answer -- lesson02.exercise08 + Boli mnie
    bardzo; lesson02.exercise10/lesson03.exercise10 + Gardło mnie boli od
    trzech dni / Od trzech dni boli mnie gardło / Od trzech dni gardło
    mnie boli; lesson02.exercise09 + Pani powinna brać... (4)
    underdetermined-prompt -- lesson02.exercise09 pinned to
    formal-to-a-woman (powinna pani), lesson03.exercise11 pinned "as Ewa"
    (powinnam vs powinienem). NATIVE CHECK: none.

    Second-pass review 2026-10-19: 1 fix - lesson02.exercise08 (say it hurts a
    lot) + Bardzo boli (natural answer without mnie).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-23: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the
    model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit24.u_lekarza:
    title: "At the doctor's"

lessons:
  pl.a2.unit24.lesson01.slownictwo_medyczne:
    title: "Medical vocabulary"
  pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo:
    title: "How long and how much"
  pl.a2.unit24.lesson03.wizyta_u_lekarza:
    title: "The doctor's appointment"

teaching:
  pl.a2.unit24.lesson01.teach.recap_words:
    title: "Good day, please, thank you -- again"
    gloss: "Dzień, dobry, Proszę, dziękuję, jest, mam, ma, Tak, Czy, kiedy, i, dwa, bardzo, to, pani, panią -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them at the doctor's office."

  pl.a2.unit24.lesson01.teach.boli_mnie_gardlo:
    title: "Throat"
    gloss: "throat"
    note: "You already know *boli*/*mnie* from the earlier health lesson (\"boli mnie głowa\") -- redeclared here since this is a new file, now with a different body part."
    example_gloss: "My throat hurts."

  pl.a2.unit24.lesson01.teach.goraczka:
    title: "Fever"
    gloss: "fever"
    note: "You already know this word from the earlier health lesson; redeclared here."
    example_gloss: "I have a fever."

  pl.a2.unit24.lesson01.teach.trzy_dni:
    title: "Three days"
    gloss: "three days"
    note: "*trzech* is the genitive form of *trzy*, needed after *od* (since/for)."
    example_gloss: "I've been waiting three days."

  pl.a2.unit24.lesson01.teach.od_note:
    title: "Since / for -- with the genitive case"
    gloss: "od + genitive = \"since/for\" (duration), e.g. od trzech dni (for three days)."
    note: "A real new grammar point for saying how long something has been going on."

  pl.a2.unit24.lesson02.teach.boli_od_trzech_dni_phrase:
    title: "My throat has hurt for three days"
    gloss: "My throat has hurt for three days."
    note: "Combines this unit's symptom with the duration pattern this lesson is built around."

  pl.a2.unit24.lesson02.teach.jak_bardzo_boli:
    title: "How much does it hurt?"
    gloss: "How much does it hurt?"
    note: "A natural way a doctor asks about severity."

  pl.a2.unit24.lesson02.teach.bardzo_mnie_boli:
    title: "It hurts a lot"
    gloss: "It hurts me a lot."
    note: "A direct answer to the severity question."

  pl.a2.unit24.lesson02.teach.powinna_note:
    title: "Should -- feminine forms"
    gloss: "powinna, powinnam -- \"should\": powinna pani (you should, to a woman), powinnam (I should, said by a woman)."
    note: "A real new modal-verb paradigm for giving and receiving advice."

  pl.a2.unit24.lesson02.teach.lekarstwo:
    title: "Medicine"
    gloss: "medicine"
    note: "A neuter noun."
    example_gloss: "This is medicine."

  pl.a2.unit24.lesson02.teach.brac:
    title: "To take"
    gloss: "to take"
    note: "Used for taking medicine."
    example_gloss: "I have to take medicine."

  pl.a2.unit24.lesson02.teach.dwa_razy_dziennie:
    title: "Twice daily"
    gloss: "twice daily"
    note: "*razy* is the plural of *raz* (time/occurrence); *dziennie* means \"daily\"."
    example_gloss: "I take medicine twice a day."

  pl.a2.unit24.lesson02.teach.powinna_brac_phrase:
    title: "You should take this medicine twice a day"
    gloss: "You should take this medicine twice a day."
    note: "The doctor's actual treatment instruction, combining this lesson's grammar and vocabulary."

  pl.a2.unit24.lesson03.teach.wrocic:
    title: "To come back"
    gloss: "to come back / return"
    note: "Used for a follow-up visit."
    example_gloss: "I want to go back home."

  pl.a2.unit24.lesson03.teach.za_tydzien:
    title: "In a week"
    gloss: "in a week"
    note: "*za* + a time word gives \"in [amount of time]\"."
    example_gloss: "I'm coming back in a week."

  pl.a2.unit24.teach.dialogue.line01:
    title: "The doctor greets Ewa and asks what's wrong"
    gloss: "Good day! What hurts you, madam?"
    note: "A direct, formal opening question."
  pl.a2.unit24.teach.dialogue.line02:
    title: "Ewa describes her symptom and its duration"
    gloss: "My throat has hurt for three days."
    note: "Ewa uses this lesson's duration pattern to give real detail, not just a bare symptom."
  pl.a2.unit24.teach.dialogue.line03:
    title: "The doctor asks about fever"
    gloss: "Do you have a fever, madam?"
    note: "A standard follow-up question in a real appointment."
  pl.a2.unit24.teach.dialogue.line04:
    title: "Ewa confirms and adds severity"
    gloss: "Yes, I do. It hurts a lot."
    note: "Ewa answers, then volunteers the severity detail unprompted."
  pl.a2.unit24.teach.dialogue.line05:
    title: "The doctor gives treatment instructions"
    gloss: "You should take this medicine twice a day."
    note: "A genuine treatment instruction, not just \"get well soon.\""
  pl.a2.unit24.teach.dialogue.line06:
    title: "Ewa asks about follow-up"
    gloss: "Thank you. When should I come back?"
    note: "Ewa uses the first-person *powinnam* form of the same modal the doctor just used."
  pl.a2.unit24.teach.dialogue.line07:
    title: "The doctor gives the follow-up instruction"
    gloss: "Please come back in a week."
    note: "Closes the appointment with a concrete follow-up timeframe."

exercises:
  pl.a2.unit24.lesson01.exercise01.select_gardlo:
    instruction: "Which word means 'throat'?"
    correct_option: "gardło"
    distractors: ["gorączka", "trzy dni"]
    accepted_answers: ["gardło"]

  pl.a2.unit24.lesson01.exercise02.select_goraczka:
    instruction: "Which word means 'fever'?"
    correct_option: "gorączka"
    distractors: ["gardło", "trzy dni"]
    accepted_answers: ["gorączka"]

  pl.a2.unit24.lesson01.exercise03.select_trzy_dni:
    instruction: "Which phrase means 'three days'?"
    correct_option: "trzy dni"
    distractors: ["gardło", "gorączka"]
    accepted_answers: ["trzy dni"]

  pl.a2.unit24.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "gardło": "throat"
      "boli": "hurts"
      "gorączka": "fever"
      "trzy dni": "three days"
      "od": "since / for"

  pl.a2.unit24.lesson01.exercise05.order_boli_mnie_gardlo:
    instruction: "Put the sentence 'My throat hurts' in order."
    correct_response: ["Boli", "mnie", "gardło"]

  pl.a2.unit24.lesson01.exercise06.order_mam_goraczke:
    instruction: "Put the sentence 'I have a fever' in order."
    correct_response: ["Mam", "gorączkę"]

  pl.a2.unit24.lesson01.exercise07.fill_mam_goraczke:
    instruction: "Complete the sentence: 'Ewa says: I have ___.' (a fever)"
    accepted_answers: ["gorączkę"]
    feedback: "Mam gorączkę -- gorączkę is the accusative form used after mam."

  pl.a2.unit24.lesson01.exercise08.fix_boli_mnie_gardlo:
    instruction: "Fix the error in the sentence 'My throat hurts'."
    accepted_answers:
      - "Boli mnie gardło."
      - "Boli mnie gardło"
      - "Gardło mnie boli."
      - "Gardło mnie boli"
    feedback: "Boli mnie gardło, not Boli ja gardło -- the person who hurts goes in the form mnie (me), not ja (I)."

  pl.a2.unit24.lesson01.exercise09.write_goraczka:
    instruction: "Write the Polish word for 'fever'."
    accepted_answers:
      - "gorączka"

  pl.a2.unit24.lesson02.exercise01.select_boli_od_trzech_dni:
    instruction: "Which sentence says a symptom has lasted three days?"
    correct_option: "Boli mnie gardło od trzech dni."
    distractors: ["Powinna pani brać to lekarstwo dwa razy dziennie.", "Jak bardzo boli?"]
    accepted_answers:
      - "Boli mnie gardło od trzech dni."
      - "Boli mnie gardło od trzech dni"

  pl.a2.unit24.lesson02.exercise02.select_powinna_brac:
    instruction: "Which sentence gives a treatment instruction?"
    correct_option: "Powinna pani brać to lekarstwo dwa razy dziennie."
    distractors: ["Boli mnie gardło od trzech dni.", "Bardzo mnie boli."]
    accepted_answers:
      - "Powinna pani brać to lekarstwo dwa razy dziennie."
      - "Powinna pani brać to lekarstwo dwa razy dziennie"

  pl.a2.unit24.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "gardło": "throat"
      "gorączka": "fever"
      "lekarstwo": "medicine"
      "brać": "to take"
      "dwa razy dziennie": "twice daily"
      "powinna": "should (formal, to a woman)"
      "powinnam": "I should (a woman speaking)"

  pl.a2.unit24.lesson02.exercise04.order_jak_bardzo_boli:
    instruction: "Put the question 'How much does it hurt?' in order."
    correct_response: ["Jak", "bardzo", "boli"]

  pl.a2.unit24.lesson02.exercise05.order_bardzo_mnie_boli:
    instruction: "Put the sentence 'It hurts me a lot' in order."
    correct_response: ["Bardzo", "mnie", "boli"]

  pl.a2.unit24.lesson02.exercise06.fill_dwa_razy_dziennie:
    instruction: "Complete the sentence: 'Please take the medicine twice ___.' (daily)"
    accepted_answers: ["dziennie"]
    feedback: "Proszę brać lekarstwo dwa razy dziennie -- dziennie is the word for daily."

  pl.a2.unit24.lesson02.exercise07.fix_boli_od_trzech_dni:
    instruction: "Fix the error in the sentence 'My throat has hurt for three days'."
    accepted_answers:
      - "Boli mnie gardło od trzech dni."
      - "Boli mnie gardło od trzech dni"
      - "Gardło mnie boli od trzech dni."
      - "Gardło mnie boli od trzech dni"
      - "Od trzech dni boli mnie gardło."
      - "Od trzech dni boli mnie gardło"
      - "Od trzech dni gardło mnie boli."
      - "Od trzech dni gardło mnie boli"
    feedback: "Boli mnie gardło od trzech dni, not od trzy dni -- od takes the genitive, so trzy dni becomes trzech dni."

  pl.a2.unit24.lesson02.exercise08.reply_jak_bardzo_boli:
    instruction: "The doctor asks: 'How much does it hurt?' Answer: say it hurts a lot."
    accepted_answers:
      - "Bardzo mnie boli."
      - "Bardzo mnie boli"
      - "Boli mnie bardzo."
      - "Boli mnie bardzo"
      - "Bardzo boli."
      - "Bardzo boli"

  pl.a2.unit24.lesson02.exercise09.write_powinna_brac:
    instruction: "Write the doctor's instruction to Ewa (formal, to a woman): 'You should take this medicine twice a day.'"
    accepted_answers:
      - "Powinna pani brać to lekarstwo dwa razy dziennie."
      - "Powinna pani brać to lekarstwo dwa razy dziennie"
      - "Pani powinna brać to lekarstwo dwa razy dziennie."
      - "Pani powinna brać to lekarstwo dwa razy dziennie"

  pl.a2.unit24.lesson02.exercise10.speak_boli_od_trzech_dni:
    instruction: "Say: 'My throat has hurt for three days.'"
    accepted_answers:
      - "Boli mnie gardło od trzech dni."
      - "Boli mnie gardło od trzech dni"
      - "Gardło mnie boli od trzech dni."
      - "Gardło mnie boli od trzech dni"
      - "Od trzech dni boli mnie gardło."
      - "Od trzech dni boli mnie gardło"
      - "Od trzech dni gardło mnie boli."
      - "Od trzech dni gardło mnie boli"

  pl.a2.unit24.lesson03.exercise01.select_ewas_symptom:
    instruction: "Which line describes Ewa's symptom and its duration?"
    correct_option: "Boli mnie gardło od trzech dni."
    distractors:
      - "Tak, mam. Bardzo mnie boli."
      - "Dziękuję. Kiedy powinnam wrócić?"
    accepted_answers:
      - "Boli mnie gardło od trzech dni."
      - "Boli mnie gardło od trzech dni"

  pl.a2.unit24.lesson03.exercise02.select_treatment_instruction:
    instruction: "Which line gives the treatment instruction?"
    correct_option: "Powinna pani brać to lekarstwo dwa razy dziennie."
    distractors:
      - "Dzień dobry! Co panią boli?"
      - "Czy ma pani gorączkę?"
    accepted_answers:
      - "Powinna pani brać to lekarstwo dwa razy dziennie."
      - "Powinna pani brać to lekarstwo dwa razy dziennie"

  pl.a2.unit24.lesson03.exercise03.comprehend_duration:
    instruction: "Read the line. How long has Ewa's throat hurt?"
    correct_option: "three days"
    distractors:
      - "one day"
      - "a week"
    accepted_answers:
      - "trzech dni"
      - "three days"

  pl.a2.unit24.lesson03.exercise04.comprehend_fever:
    instruction: "Read the lines. Does Ewa have a fever?"
    correct_option: "yes"
    distractors:
      - "no"
      - "the dialogue doesn't say"
    accepted_answers:
      - "Tak mam"
      - "yes"

  pl.a2.unit24.lesson03.exercise05.read_follow_up:
    instruction: "According to the dialogue, when should Ewa come back to the doctor?"
    correct_option: "in a week"
    distractors:
      - "tomorrow"
      - "in a month"
    accepted_answers:
      - "za tydzień"
      - "in a week"

  pl.a2.unit24.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "gardło": "throat"
      "gorączka": "fever"
      "trzy dni": "three days"
      "lekarstwo": "medicine"
      "brać": "to take"
      "dwa razy dziennie": "twice daily"
      "wrócić": "to come back"
      "za tydzień": "in a week"

  pl.a2.unit24.lesson03.exercise07.order_co_pania_boli:
    instruction: "Put the question 'What hurts you, madam?' in order."
    correct_response: ["Co", "panią", "boli"]

  pl.a2.unit24.lesson03.exercise08.fill_kiedy_powinnam_wrocic:
    instruction: "Complete the question: 'Ewa asks: When should I ___?' (come back)"
    accepted_answers: ["wrócić"]
    feedback: "Kiedy powinnam wrócić? -- wrócić is the word for to come back."

  pl.a2.unit24.lesson03.exercise09.fix_prosze_wrocic_za_tydzien:
    instruction: "Fix the error in the sentence 'Please come back in a week'."
    accepted_answers:
      - "Proszę wrócić za tydzień."
      - "Proszę wrócić za tydzień"
      - "Za tydzień proszę wrócić."
      - "Za tydzień proszę wrócić"
    feedback: "Proszę wrócić za tydzień, not od tydzień -- za + a time word means \"in (a week)\"; od means \"since/for\"."

  pl.a2.unit24.lesson03.exercise10.reply_co_pania_boli:
    instruction: "The doctor asks: 'What hurts you, madam?' Answer as Ewa: describe your throat and its duration."
    accepted_answers:
      - "Boli mnie gardło od trzech dni."
      - "Boli mnie gardło od trzech dni"
      - "Gardło mnie boli od trzech dni."
      - "Gardło mnie boli od trzech dni"
      - "Od trzech dni boli mnie gardło."
      - "Od trzech dni boli mnie gardło"
      - "Od trzech dni gardło mnie boli."
      - "Od trzech dni gardło mnie boli"

  pl.a2.unit24.lesson03.exercise11.speak_kiedy_powinnam_wrocic:
    instruction: "Say, as Ewa: 'When should I come back?'"
    accepted_answers:
      - "Kiedy powinnam wrócić?"
      - "Kiedy powinnam wrócić"
