teaching:
  pl.a2.unit77.lesson01.teach.pytanie: {"title": "Asking permission", "gloss": "question word / I can, I may / you can, you may / here / to sit down / to make a call", "note": "*Czy* opens a yes/no question. *Mogę* (I may) is followed by an infinitive.", "example_gloss": ["May I sit here?", "May I make a call?", "Yes, you may.", "Yes, you may sit here."]}
  pl.a2.unit77.lesson01.teach.miejsca: {"title": "Rules about a place", "gloss": "one can, it is possible / it is allowed / to park / to smoke / to eat / yes / no", "note": "*Można* and *wolno* have no subject. They are followed by an infinitive.", "example_gloss": ["Can one park here?", "Is smoking allowed here?", "Can one eat here?", "Yes, it is allowed."]}
  pl.a2.unit77.lesson01.teach.gn_mozna: {"title": "I may, or it is allowed", "gloss": "May I sit here? Can one park here? Is smoking allowed here?", "note": "With *mogę* a person asks for themselves. With *można* and *wolno* the rule is general, nobody is named. In all three the verb that follows stays in the infinitive."}
  pl.a2.unit77.lesson01.teach.odpowiedzi: {"title": "Short answers", "gloss": "Yes, it is allowed. Yes, one can. No, it is not allowed. No, one cannot.", "note": "Repeat *wolno* or *można* in the answer."}
  pl.a2.unit77.lesson02.teach.zakazy: {"title": "Things that are not allowed", "gloss": "to go in, to enter / to run / to make noise / to sleep", "note": "*Nie wolno* and *nie można* both forbid something. The verb stays in the infinitive.", "example_gloss": ["Smoking is not allowed here.", "Entering is not allowed.", "Running is not allowed.", "Making noise is not allowed."]}
  pl.a2.unit77.lesson02.teach.gn_zakaz: {"title": "Forbidding", "gloss": "Smoking is not allowed here. Entering is not allowed. Making noise is not allowed.", "note": "Put *nie* before *wolno* or *można*. Compare *Wolno tu palić* (allowed) with *Nie wolno tu palić* (forbidden)."}
  pl.a2.unit77.lesson02.teach.gn_odpowiedz: {"title": "Asking and answering", "gloss": "Is running allowed here? No, it is not allowed. Can one sleep here? Yes, one can.", "note": "The answer repeats the word from the question. A forbidding answer has two *nie*: *Nie, nie wolno*."}
  pl.a2.unit77.lesson03.teach.trzeba: {"title": "What you have to do", "gloss": "one has to / you have to / to wash one's hands / to take off one's shoes / to take a shower / at the pool", "note": "*Trzeba* has no subject. *Musisz* is said to one person. Both are followed by an infinitive.", "example_gloss": ["You have to wash your hands.", "You have to take off your shoes.", "At the pool you have to take a shower."]}
  pl.a2.unit77.lesson03.teach.bilet: {"title": "Tickets and waiting", "gloss": "ticket / to pay / free of charge / so / to wait", "note": "*Za darmo* means free of charge.", "example_gloss": ["The ticket is free.", "The ticket is free, so you do not have to pay.", "You have to wait."]}
  pl.a2.unit77.lesson03.teach.gn_trzeba: {"title": "Have to, must not, do not have to", "gloss": "You have to take off your shoes. You must not run. You do not have to pay.", "note": "These three are different. *Musisz* is a duty. *Nie wolno* is a ban. *Nie musisz* is not a ban: it means you are free to choose."}
  pl.a2.unit77.lesson03.teach.gn_kontrast: {"title": "One verb, three meanings", "gloss": "You have to wait. You do not have to wait. You must not wait.", "note": "*Nie musisz* is not the opposite of a ban. *Nie musisz czekać* means waiting is not needed; *nie wolno czekać* means waiting is forbidden."}
  pl.a2.unit77.lesson04.teach.mieszkanie: {"title": "In a shared flat", "gloss": "in the kitchen / in the room / to cook / to clean / light / to switch off / after ten", "note": "A short list of house rules uses the same words as before.", "example_gloss": ["In the kitchen one can cook.", "Smoking is not allowed in the room.", "After ten making noise is not allowed.", "You have to switch off the light.", "You do not have to clean."]}
  pl.a2.unit77.lesson04.teach.gn_moze: {"title": "Asking about someone else", "gloss": "May Ewa sleep here? May she make a call? Yes, she may.", "note": "For another person use *może* (she may) instead of *mogę*. The verb after it stays in the infinitive."}
  pl.a2.unit77.lesson04.teach.gn_lista: {"title": "A list of rules", "gloss": "In the kitchen one can cook. Smoking is not allowed in the room. After ten making noise is not allowed. You have to switch off the light.", "note": "A list of rules can mix *można*, *nie wolno* and *trzeba*, each with an infinitive."}
  pl.a2.unit77.lesson04.teach.pytania_ewa: {"title": "Questions about Ewa", "gloss": "May she sit here? May Ewa eat here? Yes, she may. No, it is not allowed.", "note": "Ask about Ewa with *Czy Ewa może*."}
  pl.a2.unit77.lesson05.teach.zasady: {"title": "Words for the notice", "gloss": "rules / pool / also / and / to shout", "note": "A notice lists rules one after another.", "example_gloss": ["Pool rules.", "You also have to take off your shoes.", "Running is not allowed and shouting is not allowed."]}
  pl.a2.unit77.lesson05.teach.gn_podsumowanie: {"title": "Three kinds of rule", "gloss": "You have to wash your hands. You must not run. You do not have to pay.", "note": "A duty uses *trzeba* or *musisz*, a ban uses *nie wolno*, and *nie musisz* says you are free not to."}
  pl.a2.unit77.lesson05.teach.ogloszenie: {"title": "Marek reads the pool notice", "gloss": "Pool rules. At the pool you have to take a shower and wash your hands. You also have to take off your shoes. Running is not allowed and shouting is not allowed. Eating is not allowed here. The ticket is free, so you do not have to pay.", "note": "Marek reads the notice aloud. It has duties, bans and one thing you do not have to do.", "glosses": {"zasady": "rules", "basenie": "pool (at the)", "prysznic": "shower", "darmo": "free (za darmo: free of charge)"}}
  pl.a2.unit77.lesson06.teach.slowa: {"title": "Words for the visit", "gloss": "hi / and, as for (starts a new question) / but", "note": "*A* can open a new question. *Ale* means 'but'.", "example_gloss": ["Hi, Marek.", "And may I make a call here?", "But you do not have to clean."]}
  pl.a2.unit77.lesson06.teach.d1: {"title": "Ewa asks", "gloss": "Ewa: Hi, Marek. Is smoking allowed here?"}
  pl.a2.unit77.lesson06.teach.d2: {"title": "Marek explains", "gloss": "Marek: No, smoking is not allowed here. After ten making noise is not allowed."}
  pl.a2.unit77.lesson06.teach.d3: {"title": "Ewa asks about a call", "gloss": "Ewa: And may I make a call here?"}
  pl.a2.unit77.lesson06.teach.d4: {"title": "Marek answers", "gloss": "Marek: Yes, you may. In the kitchen one can eat and cook."}
  pl.a2.unit77.lesson06.teach.d5: {"title": "Ewa asks about shoes", "gloss": "Ewa: Do you have to take off your shoes?"}
  pl.a2.unit77.lesson06.teach.d6: {"title": "Marek answers", "gloss": "Marek: Yes, you have to take off your shoes. But you do not have to clean."}
