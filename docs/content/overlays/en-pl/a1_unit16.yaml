review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Sixteenth en-pl overlay, written for pl/a1_unit16_health.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start). No
    sibling-direction overlay exists yet for this unit (pl-en hasn't been
    authored), so the sibling-isolation rule (AUTHORING_GUIDE §8) doesn't
    apply here -- noted for whoever authors pl-en next: do not open this file
    for structure/phrasing reference when doing so.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    lesson03.teach.dialogue.line04 + overlay lesson03.exercise02 distractor --
    'Dobrze, dziękuję Marek.' -> 'Dobrze, dziękuję, Marek.', Polish
    orthography sets off a direct address with commas. (2) lesson01.exercise09
    / lesson03.exercise09 grammar_check -- instruction 'who does the throat
    hurt? Something is missing' + feedback 'mnie has to be there' ->
    instruction pins 'MY throat hurts', feedback says Gardło boli only means
    'the throat hurts' (Gardło boli is not ungrammatical; the old claim was
    false); added 'Boli mnie gardło...' word-order variants. (3)
    lesson01.exercise10 -- added 'Bolą mnie zęby.' (equally natural order).
    (4) lesson03.exercise10 dialogue_response -- added 'Źle się czuję i gardło
    mnie boli.', 'Źle się czuję. Boli mnie gardło.', 'Czuję się źle. Gardło
    mnie boli.' NATIVE CHECK: 'Proszę odpocząć i pić wodę' as friend-to-friend
    advice (an imperative 'Odpocznij i pij wodę' is the more natural register)
    -- kept as the disclosed Proszę+infinitive convention. NATIVE CHECK:
    nominative-for-vocative address ('Ewa, jak się czujesz?', 'dziękuję,
    Marek') -- colloquially normal, vocative (Ewo/Marku) not taught at A1.

answer_policy:
  diacritics: >-
    Same standing policy as unit01-15: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit16.zdrowie:
    title: "Health"

lessons:
  pl.a1.unit16.lesson01.co_cie_boli:
    title: "What hurts you?"
  pl.a1.unit16.lesson02.zle_sie_czuje:
    title: "I feel bad"
  pl.a1.unit16.lesson03.rozmowa_o_zdrowiu:
    title: "A conversation about health"

teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: "It hurts"
    gloss: "Boleć (to hurt): only boli (he/she/it) and bolą (they). Głowa mnie boli means 'my head hurts' -- literally 'the head hurts me.'"
    note: >-
      *Boleć* only exists in these two forms in real Polish -- there's no
      "I hurt" or "you hurt" form to learn, so this is actually simpler than
      it looks.

  pl.a1.unit16.lesson01.teach.glowa:
    title: "Head"
    gloss: "head"
    note: "The most common thing to say hurts."
    example_gloss: "My head hurts."

  pl.a1.unit16.lesson01.teach.gardlo:
    title: "Throat"
    gloss: "throat"
    note: "Useful for describing a cold or sore throat."
    example_gloss: "My throat hurts."

  pl.a1.unit16.lesson01.teach.brzuch:
    title: "Stomach"
    gloss: "stomach"
    note: "Useful after a big meal, or when something disagrees with you."
    example_gloss: "My stomach hurts."

  pl.a1.unit16.lesson01.teach.zeby:
    title: "Teeth"
    gloss: "teeth"
    note: >-
      Always used in the plural here, the same way a real Polish speaker
      would say it -- this is why *bolą* (not *boli*) is used with it.
    example_gloss: "My teeth hurt."

  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: "What hurts you?"
    gloss: "What hurts you?"
    note: "The natural question to ask someone who doesn't feel well."

  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: "How do you feel?"
    gloss: "Czuć się (to feel): czuję się (I), czujesz się (you). How do you feel?"
    note: >-
      Only two forms for now -- *czuję* for yourself, *czujesz* for asking
      someone else.

  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: "Well and badly"
    gloss: "I feel well. I feel bad. -- you already know dobrze; źle is its opposite."
    note: "The same *dobrze* you've used since your very first lesson, now paired with its opposite."

  pl.a1.unit16.lesson02.teach.zle:
    title: "Badly"
    gloss: "badly"
    note: "The word you need to say you're not feeling well."
    example_gloss: "I feel bad."

  pl.a1.unit16.lesson02.teach.goraczka:
    title: "Fever"
    gloss: "fever"
    note: "A common, basic symptom to name."
    example_gloss: "I have a fever."

  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: "Ewa, has -- again"
    gloss: "Ewa, ma -- you already know this name and this form of the verb mieć (to have) from earlier lessons (Mam, masz, ma)."
    note: "A quick reminder before this lesson uses both."

  pl.a1.unit16.lesson02.teach.chory_chora:
    title: "Sick"
    gloss: "sick (masculine) / sick (feminine)"
    note: >-
      Same -y/-a pattern you already learned with *młodszy/starsza* --
      *chory* for a man, *chora* for a woman.
    example_gloss:
      - "He is sick."
      - "She is sick."

  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: "Ewa doesn't feel well"
    gloss: "I feel bad. I have a fever."
    note: "Ewa describing her own symptoms -- the same thing she says again in this unit's dialogue."

  pl.a1.unit16.lesson03.teach.marek_recap:
    title: "Marek, again"
    gloss: "Marek -- you already know this name from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit16.lesson03.teach.i_recap:
    title: "And, again"
    gloss: "I -- you already know this word from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: "Please, and water, again"
    gloss: "Proszę and wodę -- you already know both words from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: "Thank you, again"
    gloss: "Dziękuję -- you already know this word from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit16.lesson03.teach.odpoczac:
    title: "To rest"
    gloss: "to rest"
    note: >-
      Used with *Proszę* the same way you already ask someone to go straight
      or turn a certain way -- *Proszę* + infinitive, no imperative needed.
    example_gloss: "Please rest."

  pl.a1.unit16.lesson03.teach.pic:
    title: "To drink"
    gloss: "to drink"
    note: "Another infinitive that follows *Proszę* the same way."
    example_gloss: "Please drink water."

  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: "Marek asks how Ewa feels"
    gloss: "Ewa, how do you feel?"
    note: "Marek notices something's wrong and asks directly."
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: "Ewa describes her symptoms"
    gloss: "I feel bad. My throat hurts and I have a fever."
    note: "Ewa states two symptoms clearly -- the same facts she already told us earlier in this unit."
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: "Marek gives simple advice"
    gloss: "Please rest and drink water."
    note: "Simple, non-diagnostic advice -- not a medical instruction, just common sense."
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: "Ewa thanks Marek"
    gloss: "OK, thank you Marek."
    note: "A simple, familiar close to the conversation."

exercises:
  pl.a1.unit16.lesson01.exercise01.select_glowa:
    instruction: "Which word means 'head'?"
    correct_option: "głowa"
    distractors: ["gardło", "brzuch"]
    accepted_answers: ["głowa"]

  pl.a1.unit16.lesson01.exercise02.select_gardlo:
    instruction: "Which word means 'throat'?"
    correct_option: "gardło"
    distractors: ["głowa", "zęby"]
    accepted_answers: ["gardło"]

  pl.a1.unit16.lesson01.exercise03.select_brzuch:
    instruction: "Which word means 'stomach'?"
    correct_option: "brzuch"
    distractors: ["gardło", "zęby"]
    accepted_answers: ["brzuch"]

  pl.a1.unit16.lesson01.exercise04.select_zeby:
    instruction: "Which word means 'teeth'?"
    correct_option: "zęby"
    distractors: ["głowa", "brzuch"]
    accepted_answers: ["zęby"]

  pl.a1.unit16.lesson01.exercise05.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "głowa": "head"
      "gardło": "throat"
      "brzuch": "stomach"
      "zęby": "teeth"
      "boli": "hurts (singular)"
      "bolą": "hurt (plural)"
      "mnie": "me"
      "cię": "you (informal)"
      "Co": "what"

  pl.a1.unit16.lesson01.exercise06.order_glowa_mnie_boli:
    instruction: "Put the sentence 'My head hurts' in order."
    correct_response: ["Głowa", "mnie", "boli"]

  pl.a1.unit16.lesson01.exercise07.order_zeby_mnie_bola:
    instruction: "Put the sentence 'My teeth hurt' in order."
    correct_response: ["Zęby", "mnie", "bolą"]

  pl.a1.unit16.lesson01.exercise08.fill_brzuch:
    instruction: "Complete the sentence: 'I'm eating lunch. My stomach hurts.'"
    accepted_answers: ["Brzuch", "brzuch"]
    feedback: "Brzuch mnie boli -- brzuch is the word for 'stomach.'"

  pl.a1.unit16.lesson01.exercise09.fix_gardlo_mnie_boli:
    instruction: "Fix the sentence so it says 'MY throat hurts' -- add the missing word."
    accepted_answers:
      - "Gardło mnie boli."
      - "Gardło mnie boli"
      - "Boli mnie gardło."
    feedback: "Gardło mnie boli -- Gardło boli only says 'the throat hurts'; mnie ('me') makes it your throat."

  pl.a1.unit16.lesson01.exercise10.speak_zeby_mnie_bola:
    instruction: "Say: 'My teeth hurt.'"
    accepted_answers:
      - "Zęby mnie bolą."
      - "Zęby mnie bolą"
      - "Bolą mnie zęby."

  pl.a1.unit16.lesson02.exercise01.select_goraczka:
    instruction: "Which word means 'fever'?"
    correct_option: "gorączka"
    distractors: ["źle", "chory"]
    accepted_answers: ["gorączka"]

  pl.a1.unit16.lesson02.exercise02.select_zle:
    instruction: "Which word means 'badly'?"
    correct_option: "źle"
    distractors: ["gorączka", "chora"]
    accepted_answers: ["źle"]

  pl.a1.unit16.lesson02.exercise03.select_chory:
    instruction: "Which word means 'sick' (for a man)?"
    correct_option: "chory"
    distractors: ["chora", "gorączka"]
    accepted_answers: ["chory"]

  pl.a1.unit16.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "czuję": "I feel"
      "czujesz": "you feel"
      "Jak": "how"
      "źle": "badly"
      "gorączka": "fever"
      "gorączkę": "fever (accusative, after mam)"
      "chory": "sick (masculine)"
      "chora": "sick (feminine)"

  pl.a1.unit16.lesson02.exercise05.order_zle_sie_czuje:
    instruction: "Put the sentence 'I feel bad' in order."
    correct_response: ["Źle", "się", "czuję"]

  pl.a1.unit16.lesson02.exercise06.order_ewa_ma_goraczke:
    instruction: "Put the sentence 'Ewa has a fever' in order."
    correct_response: ["Ewa", "ma", "gorączkę"]

  pl.a1.unit16.lesson02.exercise07.fill_chora:
    instruction: "Complete the sentence: 'Ewa has a fever. She is sick.'"
    accepted_answers: ["chora"]
    feedback: "Ona jest chora -- chora agrees with ona (she)."

  pl.a1.unit16.lesson02.exercise08.fix_ewa_jest_chora:
    instruction: "Fix the sentence -- Ewa needs the feminine form of 'sick.'"
    accepted_answers:
      - "Ewa jest chora."
      - "Ewa jest chora"
    feedback: "Ewa jest chora, not Ewa jest chory -- chora is the feminine form."

  pl.a1.unit16.lesson02.exercise09.speak_zle_sie_czuje:
    instruction: "Say: 'I feel bad.'"
    accepted_answers:
      - "Źle się czuję."
      - "Źle się czuję"

  pl.a1.unit16.lesson03.exercise01.select_ewa_fever_line:
    instruction: "Which line says Ewa has a fever?"
    correct_option: "Źle się czuję. Gardło mnie boli i mam gorączkę."
    distractors:
      - "Ewa, jak się czujesz?"
      - "Proszę odpocząć i pić wodę."
    accepted_answers:
      - "Źle się czuję. Gardło mnie boli i mam gorączkę."
      - "Źle się czuję Gardło mnie boli i mam gorączkę"

  pl.a1.unit16.lesson03.exercise02.select_marek_advice_line:
    instruction: "Which line tells Ewa what to do?"
    correct_option: "Proszę odpocząć i pić wodę."
    distractors:
      - "Ewa, jak się czujesz?"
      - "Dobrze, dziękuję, Marek."
    accepted_answers:
      - "Proszę odpocząć i pić wodę."
      - "Proszę odpocząć i pić wodę"

  pl.a1.unit16.lesson03.exercise03.comprehend_ewa_gardlo:
    instruction: "Read the line. What does Ewa say hurts?"
    correct_option: "throat"
    distractors:
      - "head"
      - "stomach"
    accepted_answers:
      - "gardło"
      - "throat"

  pl.a1.unit16.lesson03.exercise04.comprehend_marek_advice:
    instruction: "Read the line. What does Marek tell Ewa to do?"
    correct_option: "rest and drink water"
    distractors:
      - "go to the doctor"
      - "eat lunch"
    accepted_answers:
      - "odpocząć i pić wodę"
      - "rest and drink water"
      - "rest, drink water"

  pl.a1.unit16.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "i": "and"
      "Proszę": "please"
      "wodę": "water"
      "Dziękuję": "thank you"
      "odpocząć": "to rest"
      "pić": "to drink"
      "gorączkę": "fever"
      "boli": "hurts"
      "źle": "badly"

  pl.a1.unit16.lesson03.exercise06.order_jak_sie_czujesz:
    instruction: "Put the question 'How do you feel?' in order."
    correct_response: ["Jak", "się", "czujesz"]

  pl.a1.unit16.lesson03.exercise07.order_prosze_odpoczac:
    instruction: "Put the sentence 'Please rest and drink water' in order."
    correct_response: ["Proszę", "odpocząć", "i", "pić", "wodę"]

  pl.a1.unit16.lesson03.exercise08.fill_goraczke:
    instruction: "Complete the sentence: 'My throat hurts and I have a fever.'"
    accepted_answers: ["gorączkę"]
    feedback: "Gardło mnie boli i mam gorączkę -- gorączkę is the accusative form after mam."

  pl.a1.unit16.lesson03.exercise09.fix_gardlo_mnie_boli_i_mam:
    instruction: "Fix the sentence so it says 'MY throat hurts and I have a fever' -- add the missing word."
    accepted_answers:
      - "Gardło mnie boli i mam gorączkę."
      - "Gardło mnie boli i mam gorączkę"
      - "Boli mnie gardło i mam gorączkę."
    feedback: "Gardło mnie boli i mam gorączkę -- Gardło boli only says 'the throat hurts'; mnie ('me') makes it your throat."

  pl.a1.unit16.lesson03.exercise10.reply_zle_sie_czuje:
    instruction: "Answer as Ewa: say you feel bad and your throat hurts."
    accepted_answers:
      - "Źle się czuję. Gardło mnie boli."
      - "Źle się czuję. Gardło mnie boli"
      - "Źle się czuję, gardło mnie boli."
      - "Źle się czuję i gardło mnie boli."
      - "Źle się czuję. Boli mnie gardło."
      - "Czuję się źle. Gardło mnie boli."

  pl.a1.unit16.lesson03.exercise11.speak_prosze_odpoczac:
    instruction: "Say: 'Please rest and drink water.'"
    accepted_answers:
      - "Proszę odpocząć i pić wodę."
      - "Proszę odpocząć i pić wodę"
