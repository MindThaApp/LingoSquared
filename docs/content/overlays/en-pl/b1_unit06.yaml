answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit06.rady:
    title: "Advice"

lessons:
  pl.b1.unit06.lesson01.na_twoim_miejscu:
    title: "If I were you..."
  pl.b1.unit06.lesson02.powinnas:
    title: "You should..."
  pl.b1.unit06.lesson03.zle_sie_czuje:
    title: "I feel bad"
  pl.b1.unit06.lesson04.moja_rada:
    title: "My advice"

teaching:
  pl.b1.unit06.lesson01.teach.recap_words:
    title: "Is, I have, good, we should -- again"
    gloss: "jest, mam, dobry, powinniśmy -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds advice constructions on top of them."

  pl.b1.unit06.lesson01.teach.na_twoim_miejscu:
    title: "If I were you"
    gloss: "if I were you / in your place"
    note: "Literally \"in your place\" -- introduces advice, always paired with a conditional verb."
    example_gloss: "If I were you, I'd go to the doctor."

  pl.b1.unit06.lesson01.teach.poszedlbym:
    title: "I would go"
    gloss: "I would go"
    note: "*do lekarza* -- to the doctor."
    example_gloss: "I would go to the doctor."

  pl.b1.unit06.lesson01.teach.advice_note:
    title: "Na twoim miejscu + conditional"
    gloss: "\"Na twoim miejscu\" + a verb in the conditional mood (-bym/-byś) -- a way of giving advice that literally means \"in your place\": *Na twoim miejscu poszedłbym do lekarza* (if I were you, I'd go to the doctor)."
    note: "The same -bym/-byś conditional morphology from earlier in the course, now used for advice instead of hypothetical self-description."

  pl.b1.unit06.lesson01.teach.phrase_na_twoim_miejscu:
    title: "If I were you, I'd go to the doctor"
    gloss: "If I were you, I'd go to the doctor."
    note: "A complete advice sentence using the na twoim miejscu construction."

  pl.b1.unit06.lesson02.teach.powinnas:
    title: "You should (to a woman)"
    gloss: "you should"
    note: "Addressed to a woman."
    example_gloss: "You should go to bed earlier."

  pl.b1.unit06.lesson02.teach.klasc_sie_wczesniej:
    title: "To go to bed earlier"
    gloss: "to go to bed earlier"
    note: "*kłaść się* -- to lie down/go to bed (reflexive); *wcześniej* -- earlier."
    example_gloss: "You should go to bed earlier."

  pl.b1.unit06.lesson02.teach.powinnas_note:
    title: "Powinnaś vs powinieneś"
    gloss: "\"Powinnaś\" (you should, said to a woman) + infinitive -- the singular \"you\" form of *powinniśmy* (we should), which you already know. To a man: *powinieneś*."
    note: "Polish should-forms agree with the addressee's gender, unlike English \"should\"."

  pl.b1.unit06.lesson02.teach.phrase_powinnas:
    title: "You should go to bed earlier"
    gloss: "You should go to bed earlier."
    note: "A complete should-advice sentence."

  pl.b1.unit06.lesson02.teach.odpoczac:
    title: "To rest"
    gloss: "to rest"
    note: "An infinitive, paired with powinnaś or na twoim miejscu."
    example_gloss: "You should rest this weekend."

  pl.b1.unit06.lesson03.teach.zle_sie_czuje:
    title: "I feel bad, a hard week"
    gloss: "I feel bad, I had a very hard week"
    note: "*miałam* -- I had (feminine past)."
    example_gloss: "I feel bad, I had a very hard week."

  pl.b1.unit06.lesson03.teach.nie_spie:
    title: "I'm not sleeping well"
    gloss: "I'm not sleeping well"
    note: "*od tygodnia* -- for a week (literally \"since a week\")."
    example_gloss: "I haven't been sleeping well for a week."

  pl.b1.unit06.lesson03.teach.a_moze:
    title: "How about..."
    gloss: "how about / what if"
    note: "*spróbujesz* -- you'll try."
    example_gloss: "How about you try to rest this weekend?"

  pl.b1.unit06.lesson03.teach.a_moze_note:
    title: "A może + a 'you' verb"
    gloss: "\"A może\" + a second-person (\"you\") verb, often a perfective one like *spróbujesz* (you'll try) -- a lighter way of suggesting than \"powinnaś\": *A może spróbujesz?* (how about you try?)"
    note: "The lightest of this lesson's three advice constructions -- a genuine suggestion, not a should-statement."

  pl.b1.unit06.teach.dialogue.line01:
    title: "Ewa describes her week"
    gloss: "I feel bad, I had a very hard week. I haven't been sleeping well for a week."
    note: "The stated problem this lesson's exercises test."
  pl.b1.unit06.teach.dialogue.line02:
    title: "Marek advises seeing a doctor"
    gloss: "If I were you, I'd go to the doctor."
    note: "The first piece of advice, using na twoim miejscu."
  pl.b1.unit06.teach.dialogue.line03:
    title: "Ewa accepts"
    gloss: "You're right, I'll book an appointment tomorrow."
    note: "Ewa accepting Marek's advice -- comprehension-tested, not a separate production requirement."
  pl.b1.unit06.teach.dialogue.line04:
    title: "Marek suggests an earlier bedtime"
    gloss: "Good. How about you try going to bed earlier?"
    note: "The second, lighter piece of advice, using a może."
  pl.b1.unit06.teach.dialogue.line05:
    title: "Ewa asks a follow-up"
    gloss: "At what time? Right now I go to bed at midnight."
    note: "Ewa's follow-up question, satisfying the outcome's \"asking a follow-up\" clause."
  pl.b1.unit06.teach.dialogue.line06:
    title: "Marek gives a concrete answer"
    gloss: "You should go to bed before eleven."
    note: "A concrete should-advice closing the exchange."

  pl.b1.unit06.lesson04.teach.stres_w_pracy:
    title: "Stress at work"
    gloss: "stress at work"
    note: "*mam* -- I have."
    example_gloss: "I have a lot of stress at work."

  pl.b1.unit06.lesson04.teach.co_bys_zrobil:
    title: "What would you do in my place?"
    gloss: "What would you do in my place?"
    note: "A question asking for advice, in the same conditional mood; *zrobił* to a man, *zrobiła* to a woman."

  pl.b1.unit06.lesson04.teach.porozmawialbym:
    title: "I would talk to the boss"
    gloss: "I would talk to the boss"
    note: "*z szefem* -- with the boss (instrumental after z)."
    example_gloss: "If I were you, I'd talk to the boss."

