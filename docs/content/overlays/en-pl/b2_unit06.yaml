      bez: without
      życie: life
      traci: "loses (traci sens = loses its meaning)"
      sens: meaning
      potrzebujemy: "we need"
      zasad: "rules (genitive plural of zasada, governed by potrzebujemy)"
      łatwe: easy
      warto: "it's worth"
      walczyć: "to fight"

