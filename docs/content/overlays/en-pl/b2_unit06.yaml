course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: give a QUALIFIED opinion on an abstract
    topic and respond directly to an opposing view -- state your opinion
    (uważam, że / moim zdaniem / jestem przekonany/przekonana, że),
    soften it with a qualifier (do pewnego stopnia, niekoniecznie, to
    zależy), and respond to an opposing view by conceding partly then
    pushing back (to prawda, ale... / rozumiem twój punkt widzenia,
    jednak...), around the debate of whether freedom is more important
    than security.

units:
  pl.b2.unit06.abstrakcja:
    title: "Abstract ideas and values"
    description: Give a qualified opinion on an abstract topic and respond directly to an opposing view, distinguishing a flat opinion from a qualified one and an agreement from a direct rebuttal.

