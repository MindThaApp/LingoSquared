    title: "Reading: an opinion on freedom and security"
    gloss: "I think that freedom is more important than security. I understand that security matters, but without freedom life loses its meaning. To a certain extent it is true that we need rules. Still, I'm convinced that freedom is more important for society. It is not necessarily easy, but it's worth fighting for."
    glosses:
