    title: The Poproszę construction
    gloss: '*Poproszę* + colour says which colour you choose: *Poproszę różowe.* The colour ends in *-e* because the tulips are plural.'
    note: '*Poproszę* (''I''ll have, please'') is a handy way to order or choose something. Colours are adjectives and agree with the noun: *tulipany* is plural, so the ending is *-e* (*różowe*, *czerwone*). On its own, the colour name is masculine singular (*różowy*), because it agrees with *kolor*.'
