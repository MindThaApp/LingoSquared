teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: "Yesterday"
    gloss: "yesterday"
    note: "The basic time word for talking about a recent, completed day -- pairs naturally with the past-tense forms this unit teaches."
    example_gloss: "I was at the cinema yesterday."

  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: "What happened yesterday?"
    gloss: "What happened yesterday?"
    note: "The natural way to ask someone to recount a recent event -- było doesn't change for who's answering, so this question works no matter who you're asking."

  pl.a1.unit12.lesson01.teach.bylo_note:
    title: "Było"
    gloss: "Było is the form of być (to be) with no specific person attached -- used when asking generally what happened: Co było wczoraj? The same word, no matter who answers."
    note: >-
      *Było* doesn't pick a gender or a person -- it's the neutral "there
      was" / "it happened" form, perfect for an open question like *Co
      było wczoraj?*

  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: "I was (a man / a woman)"
    gloss: "I was (said by a man) / I was (said by a woman)"
    note: "Polish past tense marks the speaker's gender: byłem if a man is speaking, byłam if a woman is speaking. Both mean exactly 'I was.'"
    example_gloss:
      - "I was at the cinema yesterday."
      - "I was at the cinema yesterday."

  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: "Past tense: -em vs. -am"
    gloss: "Past-tense verbs end differently depending on the speaker's gender: -em when a man is speaking (byłem), -am when a woman is speaking (byłam). This applies to every verb in the past tense, not just być."
    note: >-
      Keep an eye on the last letters: *-em* marks a man speaking, *-am*
      marks a woman speaking. You'll see this same pattern on every past-
      tense verb in this unit.

  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: "In the cinema"
    gloss: "Kino changes its ending after w: idę do kina (where to?) uses a different form than jestem w kinie (where at?). W kinie is the locative case -- it says WHERE something happens, not where someone is going."
    note: >-
      Two different endings, two different questions: *do kina* answers
      "where to?" (you learned this in the plans unit), while *w kinie*
      answers "where at?" -- don't mix them up.

  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: "I was at the cinema yesterday (a man)"
    gloss: "I was at the cinema yesterday."
    note: "Puts together byłem, wczoraj, and w kinie -- the way a man would report where he was."

  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: "I was at the cinema yesterday (a woman)"
    gloss: "I was at the cinema yesterday."
    note: "The same sentence with byłam -- the way a woman would report where she was."

  pl.a1.unit12.lesson02.teach.film:
    title: "Movie"
    gloss: "movie / film"
    note: "An everyday word for talking about what you watched -- comes up constantly when recounting a trip to the cinema."
    example_gloss: "I saw a good movie."

  pl.a1.unit12.lesson02.teach.dobry:
    title: "Good"
    gloss: "good"
    note: "You've seen dobry before inside dzień dobry (good day) -- here it's used on its own as an ordinary adjective, 'good.'"
    example_gloss: "A very good movie!"

  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: "I saw (a man / a woman)"
    gloss: "I saw (said by a man) / I saw (said by a woman)"
    note: "Zobaczyć describes a single, completed act of seeing (as opposed to widzieć, ongoing seeing) -- zobaczyłem if a man is speaking, zobaczyłam if a woman is speaking, the same -em/-am pattern as byłem/byłam."
    example_gloss:
      - "I saw a good movie."
      - "I saw a good movie."

  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: "Same pattern as byłem/byłam"
    gloss: "The same pattern as byłem/byłam: zobaczyłem is said by a man, zobaczyłam by a woman. Zobaczyć is a perfective verb -- it describes one finished event."
    note: >-
      Same ending, new verb: *zobaczyłem/zobaczyłam* follows the exact
      pattern you just learned with *byłem/byłam*.

  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: "I made / did (a man / a woman)"
    gloss: "I made / I did (said by a man) / I made / I did (said by a woman)"
    note: "Zrobić covers both 'to make' and 'to do' for a single completed action -- zrobiłem for a man, zrobiłam for a woman, same pattern again."
    example_gloss:
      - "I made lunch."
      - "I made lunch."

  pl.a1.unit12.lesson02.teach.obiad:
    title: "Lunch"
    gloss: "lunch / midday meal"
    note: "You may recall obiad from the routines unit -- here it's what Marek makes for the day's main meal."
    example_gloss: "This is a delicious lunch."

  pl.a1.unit12.lesson02.teach.pyszny:
    title: "Tasty"
    gloss: "tasty / delicious"
    note: "A warm, everyday way to praise food -- comes up naturally right after obiad."
    example_gloss: "This is a delicious lunch."

  pl.a1.unit12.lesson03.teach.jaki:
    title: "What kind of / which"
    gloss: "what kind of / which"
    note: "You've seen jaki before asking about phone numbers and days of the week -- here it's used the same way to ask for a specific detail: which movie?"
    example_gloss: "What movie is this?"

  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: "Short one-word questions"
    gloss: "In conversation, you can ask a short question with just one word, e.g. Pyszny? instead of the full question Czy obiad był pyszny? -- it sounds natural and quick, just like in everyday conversation."
    note: >-
      Real conversation skips the full sentence when context already makes
      it clear -- *Pyszny?* on its own means "Was it tasty?"

  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: "Marek asks what happened"
    gloss: "Hi Ewa! What happened yesterday?"
    note: "Reuses this unit's very first taught question, now opening a real conversation."
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: "Ewa was at the cinema"
    gloss: "I was at the cinema! I saw a good movie."
    note: "Byłam (feminine) and zobaczyłam (feminine) both mark Ewa as the speaker."
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: "Marek asks which movie"
    gloss: "What movie?"
    note: "A short, natural follow-up question using jaki."
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: "Ewa answers and asks back"
    gloss: "Very good! And you?"
    note: "A ty? (and you?) hands the conversation back to Marek without needing any new grammar."
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: "Marek made lunch"
    gloss: "I made lunch!"
    note: "Zrobiłem (masculine) marks Marek as the speaker -- his own completed event for the day."
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: "Ewa asks if it was tasty"
    gloss: "Tasty?"
    note: "A one-word question, exactly the pattern from this lesson's grammar note."

exercises:
  pl.a1.unit12.lesson01.exercise01.select_wczoraj:
    instruction: "Which word means 'yesterday'?"
    correct_option: "wczoraj"
    distractors: ["było", "byłem"]
    accepted_answers: ["wczoraj"]

  pl.a1.unit12.lesson01.exercise02.select_bylo:
    instruction: "Which word means 'there was / happened'?"
    correct_option: "było"
    distractors: ["wczoraj", "byłam"]
    accepted_answers: ["było"]

  pl.a1.unit12.lesson01.exercise03.select_bylem:
    instruction: "Which word means 'I was,' said by a man?"
    correct_option: "byłem"
    distractors: ["byłam", "było"]
    accepted_answers: ["byłem"]

  pl.a1.unit12.lesson01.exercise04.match_wczoraj_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "wczoraj": "yesterday"
      "było": "there was / happened"
      "byłem": "I was (a man)"
      "byłam": "I was (a woman)"
      "kinie": "(in) the cinema"
      "co": "what"

  pl.a1.unit12.lesson01.exercise05.order_co_bylo_wczoraj:
    instruction: "Put the question 'What happened yesterday?' in order."
    correct_response: ["Co", "było", "wczoraj"]

  pl.a1.unit12.lesson01.exercise06.order_bylam_wczoraj_w_kinie:
    instruction: "Put the sentence 'I was at the cinema yesterday' (a woman speaking) in order."
    correct_response: ["Byłam", "wczoraj", "w", "kinie"]

  pl.a1.unit12.lesson01.exercise07.fill_bylem_marek:
    instruction: "Complete Marek's sentence: 'I was at the cinema yesterday.'"
    accepted_answers: ["Byłem"]
    feedback: "Mówi Marek: Byłem wczoraj w kinie -- byłem is 'I was,' the form a man uses."

  pl.a1.unit12.lesson01.exercise08.fix_bylam_gender:
    instruction: "Fix the verb -- Marek is speaking, so he should say 'byłem,' not 'byłam.'"
    accepted_answers:
      - "Byłem wczoraj w kinie."
      - "Byłem wczoraj w kinie"
      - "Mówi Marek: Byłem wczoraj w kinie."
    feedback: "Byłem wczoraj w kinie, not Byłam wczoraj w kinie -- Marek is a man, so he uses byłem."

  pl.a1.unit12.lesson01.exercise09.speak_bylam_w_kinie:
    instruction: "Say, as a woman: 'I was at the cinema yesterday.'"
    accepted_answers:
      - "Byłam wczoraj w kinie."
      - "Byłam wczoraj w kinie"
      - "Wczoraj byłam w kinie."

  pl.a1.unit12.lesson02.exercise01.select_film:
    instruction: "Which word means 'movie'?"
    correct_option: "film"
    distractors: ["dobry", "obiad"]
    accepted_answers: ["film"]

  pl.a1.unit12.lesson02.exercise02.select_zobaczylem:
    instruction: "Which word means 'I saw,' said by a man?"
    correct_option: "zobaczyłem"
    distractors: ["zobaczyłam", "zrobiłem"]
    accepted_answers: ["zobaczyłem"]

  pl.a1.unit12.lesson02.exercise03.select_pyszny:
    instruction: "Which word means 'tasty'?"
    correct_option: "pyszny"
    distractors: ["dobry", "obiad"]
    accepted_answers: ["pyszny"]

  pl.a1.unit12.lesson02.exercise04.match_film_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "film": "movie"
      "dobry": "good"
      "zobaczyłem": "I saw (a man)"
      "zobaczyłam": "I saw (a woman)"
      "zrobiłem": "I made / did (a man)"
      "zrobiłam": "I made / did (a woman)"
      "obiad": "lunch"
      "pyszny": "tasty"

  pl.a1.unit12.lesson02.exercise05.order_zobaczylem_dobry_film:
    instruction: "Put the sentence 'I saw a good movie' (a man speaking) in order."
    correct_response: ["Zobaczyłem", "dobry", "film"]

  pl.a1.unit12.lesson02.exercise06.order_zrobilam_pyszny_obiad:
    instruction: "Put the sentence 'I made a delicious lunch' (a woman speaking) in order."
    correct_response: ["Zrobiłam", "pyszny", "obiad"]

  pl.a1.unit12.lesson02.exercise07.fill_zobaczylam_ewa:
    instruction: "Complete Ewa's sentence: 'I saw a good movie.'"
    accepted_answers: ["Zobaczyłam"]
    feedback: "Mówi Ewa: Zobaczyłam dobry film -- zobaczyłam is 'I saw,' the form a woman uses."

  pl.a1.unit12.lesson02.exercise08.fix_zrobilam_gender:
    instruction: "Fix the verb -- Marek is speaking, so he should say 'zrobiłem,' not 'zrobiłam.'"
    accepted_answers:
      - "Zrobiłem obiad."
      - "Zrobiłem obiad"
      - "Mówi Marek: Zrobiłem obiad."
    feedback: "Zrobiłem obiad, not Zrobiłam obiad -- Marek is a man, so he uses zrobiłem."

  pl.a1.unit12.lesson02.exercise09.speak_zobaczylem_dobry_film:
    instruction: "Say, as a man: 'I saw a good movie.'"
    accepted_answers:
      - "Zobaczyłem dobry film."
      - "Zobaczyłem dobry film"

  pl.a1.unit12.lesson03.exercise01.select_ask_what_happened_line:
