      "obiad": "lunch"
      "pyszny": "tasty"

  pl.a1.unit12.lesson03.exercise06.order_zobaczylam_dobry_film:
    instruction: "Put the sentence 'I saw a good movie' (a woman speaking) in order."
    correct_response: ["Zobaczyłam", "dobry", "film"]

  pl.a1.unit12.lesson03.exercise07.order_zrobilem_obiad:
    instruction: "Put the sentence 'I made lunch' (a man speaking) in order."
    correct_response: ["Zrobiłem", "obiad"]

  pl.a1.unit12.lesson03.exercise08.fill_bylam_dialogue:
    instruction: "Complete Ewa's line: 'I was at the cinema! I saw a good movie.'"
    accepted_answers: ["Byłam"]
    feedback: "Mówi Ewa: Byłam w kinie! Zobaczyłam dobry film -- byłam is the form a woman uses."

  pl.a1.unit12.lesson03.exercise09.fix_zobaczylam_gender_dialogue:
    instruction: "Fix the verb -- Marek is speaking, so he should say 'zobaczyłem,' not 'zobaczyłam.'"
    accepted_answers:
      - "Zobaczyłem dobry film."
      - "Zobaczyłem dobry film"
      - "Mówi Marek: Zobaczyłem dobry film."
    feedback: "Zobaczyłem dobry film, not Zobaczyłam dobry film -- Marek is a man, so he uses zobaczyłem."

  pl.a1.unit12.lesson03.exercise10.reply_what_happened:
    instruction: "Answer as Ewa: say you were at the cinema and saw a good movie."
    accepted_answers:
      - "Byłam w kinie! Zobaczyłam dobry film."
      - "Byłam w kinie! Zobaczyłam dobry film"
