  pl.a1.unit12.lesson03.exercise05.match_yesterday_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "wczoraj": "yesterday"
      "było": "there was / happened"
      "byłam": "I was (a woman)"
      "zobaczyłam": "I saw (a woman)"
      "film": "movie"
      "jaki": "what kind of / which"
