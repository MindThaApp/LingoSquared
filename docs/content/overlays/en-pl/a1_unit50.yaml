  pl.a1.unit50.lesson04.exercise02.comprehend_bilet_na_koncert:
    instruction: Listen to the dialogue and choose what Nina wants a ticket for.
    correct_option: The band.
    distractors:
    - A guide.
    - A program.
    - She doesn't say.
    accepted_answers:
    - value: The band.
      status: correct
    feedback: Nina wants *bilet na koncert zespołu*. *Zespołu* is the genitive ('of the band'), which Polish uses for 'belonging to'.
  pl.a1.unit50.lesson04.exercise03.comprehend_czy_chce_pani:
    instruction: Listen to the dialogue and choose what Jan asks Nina about next.
    correct_option: Whether she wants a program.
    distractors:
    - Whether she wants a guide.
    - Whether she wants a table.
    - He doesn't ask anything.
    accepted_answers:
    - value: Whether she wants a program.
      status: correct
    feedback: Jan asks *czy chce pani też program?* *Program* is masculine but not a person, so the accusative is the same as the nominative.
  pl.a1.unit50.lesson04.exercise04.comprehend_nie_trzeba:
    instruction: Listen to the dialogue and choose whether Nina wants a program.
    correct_option: No, she says it's not necessary.
    distractors:
    - Yes, she wants one.
    - She doesn't answer.
    - She asks for two programs.
    accepted_answers:
    - value: No, she says it's not necessary.
      status: correct
    feedback: Nina says *Nie, dziękuję, nie trzeba.* *Nie trzeba* means 'it is not needed', and *dziękuję* is 'thank you'.
  pl.a1.unit50.lesson04.exercise05.order_tak_poprosze_bilet:
