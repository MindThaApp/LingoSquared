    correct_option: Tak poproszę bilet na koncert zespołu
    accepted_answers:
    - value: Tak poproszę bilet na koncert zespołu
      status: correct
    feedback: '*Zespołu* is the genitive (''of the band''). *Na koncert* uses *na* plus the accusative for an event you go to.'
  pl.a1.unit50.lesson04.exercise06.respond_nie_dziekuje_nie:
    instruction: 'Answer in Polish: no, thank you, that''s not necessary.'
