answer_policy:
  diacritics: >-
    Same standing policy as unit01-14: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek) and place
    names (Kraków, Krakowa, Warszawa, Warszawy).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit15.podroz:
    title: "Travel"

lessons:
  pl.a1.unit15.lesson01.na_dworcu:
    title: "At the station"
  pl.a1.unit15.lesson02.kiedy_odjezdza_autobus:
    title: "When does the bus leave?"
  pl.a1.unit15.lesson03.rozmowa_na_dworcu:
    title: "A conversation at the station"

teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: "Station"
    gloss: "station"
    note: "The place where trains and buses come and go -- the starting point for this whole unit."
    example_gloss: "The station is close to the hotel."

  pl.a1.unit15.lesson01.teach.bilet:
    title: "Ticket"
    gloss: "ticket"
    note: "You'll need one of these before you get on a train or bus."
    example_gloss: "The ticket costs twenty zloty."

  pl.a1.unit15.lesson01.teach.peron:
    title: "Platform"
    gloss: "platform"
    note: "Where you actually stand and wait for your train."
    example_gloss: "Platform number one is over there."

  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: "Platform number one, two..."
    gloss: "To say a platform number, we say Peron numer + number: Peron numer jeden, Peron numer dwa (we don't say 'the first platform,' 'the second platform')."
    note: >-
      Simpler than it looks: just *peron* + *numer* + an ordinary number you
      already know, no special "first/second" word needed.

  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: "The train, again"
    gloss: "Pociąg odjeżdża o czwartej po południu -- you already know this sentence from the lesson about time."
    note: "The exact same fact from the time unit, now put to work in a travel scene."

  pl.a1.unit15.lesson01.teach.krakow:
    title: "Krakow"
    gloss: "Krakow"
    note: "A real Polish city -- this unit's first destination."
    example_gloss: "Krakow is far away."

  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: "To Krakow"
    gloss: "When going somewhere, we say do + a different form of the city name: do Krakowa (not do Kraków). Memorize this form as a whole."
    note: >-
      Don't try to derive *Krakowa* from a rule -- just learn *do Krakowa* as
      one fixed phrase for now.

  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: "A ticket to Krakow, please"
    gloss: "A ticket to Krakow, please."
    note: "The exact phrase you'd say at a ticket window."

  pl.a1.unit15.lesson01.teach.jechac_note:
    title: "To go (by vehicle)"
    gloss: "Jechać (to go by vehicle): jadę (I go), jedzie (he/she goes). Tomorrow I'm going to Krakow. Marek is going to Krakow."
    note: >-
      Only two forms for now -- *jadę* for yourself, *jedzie* for someone
      else.

  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: "Marek is going to Krakow"
    gloss: "Marek is going to Krakow tomorrow."
    note: "Marek's own trip -- his story continues in this unit's dialogue."

  pl.a1.unit15.lesson02.teach.autobus:
    title: "Bus"
    gloss: "bus"
    note: "The other common way to travel between cities."
    example_gloss: "The bus is at the station."

  pl.a1.unit15.lesson02.teach.warszawa:
    title: "Warsaw"
    gloss: "Warsaw"
    note: "Poland's capital -- this unit's second destination."
    example_gloss: "Warsaw is far away."

  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: "To Warsaw"
    gloss: "Warsaw changes differently than Krakow: do Warszawy (not do Warszawa). Each city has its own form -- memorize both separately."
    note: >-
      *Krakowa* and *Warszawy* don't follow the same pattern as each other --
      that's exactly why each is memorized on its own, not as one shared
      rule.

  pl.a1.unit15.lesson02.teach.dokad:
    title: "Where to"
    gloss: "where to"
    note: "Asks about a destination, not a location -- different from asking 'where' something already is."
    example_gloss: "Where's the bus going?"

  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: "At seven, again"
    gloss: "Siódmej -- you already know this hour form from the lesson about time (o siódmej = at seven o'clock)."
    note: "The same locative hour-form pattern, just reused for a departure time."

  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: "The bus to Warsaw leaves at seven"
    gloss: "The bus to Warsaw leaves at seven."
    note: "Combines this lesson's destination and time patterns into one real sentence."

  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: "When, again"
    gloss: "Kiedy -- you already know this word from the lesson about dates. When does the bus leave?"
    note: "The natural question to ask before a trip."

  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: "Ewa is going to Warsaw"
    gloss: "Ewa is going to Warsaw tomorrow."
    note: "Ewa's own trip -- her story continues in this unit's dialogue, alongside Marek's."

  pl.a1.unit15.lesson03.teach.ja_recap:
    title: "I, again"
    gloss: "Ja -- you already know this word from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit15.lesson03.teach.moj_recap:
    title: "My, again"
    gloss: "Mój -- you already know this word from the lesson about family."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: "At ten in the morning, again"
    gloss: "Dziesiątej and rano -- you already know both forms from the lesson about time (o dziesiątej rano = at ten in the morning)."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: "Thank you, and see you"
    gloss: "Dziękuję and Do zobaczenia -- you already know these from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: "Have a nice trip!"
    gloss: "Miłej podróży! is how you wish someone a good trip -- we use this as one whole expression, not translated word by word."
    note: >-
      A fixed, idiomatic farewell -- learn it as a single chunk, the same way
      you already learned *Dzień dobry*.

  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: "Marek is going to Krakow tomorrow"
    gloss: "Tomorrow I'm going to Krakow. My train leaves at four in the afternoon."
    note: "Marek opens with his own travel plan -- the same fact lesson01 already told us about him."
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: "Ewa is going to Warsaw tomorrow"
    gloss: "I'm going to Warsaw. My bus leaves at ten in the morning."
    note: "Ewa shares her own plan -- the same fact lesson02 already told us about her."
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: "Marek wishes Ewa a good trip"
    gloss: "Have a nice trip!"
    note: "Marek uses this lesson's new idiom to wish Ewa well."
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: "Ewa thanks Marek and says goodbye"
    gloss: "Thank you! See you!"
    note: "A simple, familiar close to the conversation."

exercises:
  pl.a1.unit15.lesson01.exercise01.select_dworzec:
    instruction: "Which word means 'station'?"
    correct_option: "dworzec"
    distractors: ["peron", "bilet"]
    accepted_answers: ["dworzec"]

  pl.a1.unit15.lesson01.exercise02.select_bilet:
    instruction: "Which word means 'ticket'?"
    correct_option: "bilet"
    distractors: ["dworzec", "peron"]
    accepted_answers: ["bilet"]

  pl.a1.unit15.lesson01.exercise03.select_peron:
    instruction: "Which word means 'platform'?"
    correct_option: "peron"
    distractors: ["bilet", "dworzec"]
    accepted_answers: ["peron"]

  pl.a1.unit15.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "dworzec": "station"
      "bilet": "ticket"
      "peron": "platform"
      "numer": "number"
      "Kraków": "Krakow"
      "jedzie": "goes (by vehicle, he/she)"
      "jutro": "tomorrow"
      "proszę": "please"

  pl.a1.unit15.lesson01.exercise05.order_peron_jeden:
    instruction: "Put the phrase 'Platform number one' in order."
    correct_response: ["Peron", "numer", "jeden"]

  pl.a1.unit15.lesson01.exercise06.order_marek_jedzie:
    instruction: "Put the sentence 'Marek is going to Krakow tomorrow' in order."
    correct_response: ["Marek", "jedzie", "do", "Krakowa", "jutro"]

  pl.a1.unit15.lesson01.exercise07.fill_bilet:
    instruction: "Complete the sentence: 'The ticket costs twenty zloty.'"
    accepted_answers: ["bilet", "Bilet"]
    feedback: "Bilet kosztuje dwadzieścia złotych -- bilet is the word for 'ticket.'"

  pl.a1.unit15.lesson01.exercise08.fix_do_krakowa:
    instruction: "Fix the sentence -- the destination form after 'do' is missing."
    accepted_answers:
      - "Bilet do Krakowa, proszę."
      - "Bilet do Krakowa, proszę"
      - "Bilet do Krakowa proszę"
    feedback: "Bilet do Krakowa, not Bilet do Kraków -- Krakowa is the memorized destination form."

  pl.a1.unit15.lesson01.exercise09.speak_marek_jedzie:
    instruction: "Say: 'Marek is going to Krakow tomorrow.'"
    accepted_answers:
      - "Marek jedzie do Krakowa jutro."
      - "Marek jedzie do Krakowa jutro"

  pl.a1.unit15.lesson02.exercise01.select_autobus:
    instruction: "Which word means 'bus'?"
    correct_option: "autobus"
    distractors: ["dworzec", "peron"]
    accepted_answers: ["autobus"]

  pl.a1.unit15.lesson02.exercise02.select_dokad:
    instruction: "Which word means 'where to'?"
    correct_option: "Dokąd"
    distractors: ["Kiedy", "Jak"]
    accepted_answers: ["Dokąd"]

  pl.a1.unit15.lesson02.exercise03.select_warszawa:
    instruction: "Which word means 'Warsaw'?"
    correct_option: "Warszawa"
    distractors: ["Kraków", "dworzec"]
    accepted_answers: ["Warszawa"]

  pl.a1.unit15.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "autobus": "bus"
      "Dokąd": "where to"
      "Warszawa": "Warsaw"
      "siódmej": "at seven o'clock"
      "odjeżdża": "departs"
      "jedzie": "goes (by vehicle, he/she)"
      "jutro": "tomorrow"
      "Kiedy": "when"

  pl.a1.unit15.lesson02.exercise05.order_kiedy_odjezdza:
    instruction: "Put the question 'When does the bus leave?' in order."
    correct_response: ["Kiedy", "odjeżdża", "autobus"]

  pl.a1.unit15.lesson02.exercise06.order_ewa_jedzie:
    instruction: "Put the sentence 'Ewa is going to Warsaw tomorrow' in order."
    correct_response: ["Ewa", "jedzie", "do", "Warszawy", "jutro"]

  pl.a1.unit15.lesson02.exercise07.fill_warszawy:
    instruction: "Complete the sentence: 'The bus to Warsaw leaves at seven.'"
    accepted_answers: ["Warszawy"]
    feedback: "Autobus do Warszawy odjeżdża o siódmej -- Warszawy is the memorized destination form."

  pl.a1.unit15.lesson02.exercise08.fix_do_warszawy:
    instruction: "Fix the sentence -- Warsaw needs its destination form after 'do.'"
    accepted_answers:
      - "Autobus do Warszawy odjeżdża o siódmej."
      - "Autobus do Warszawy odjeżdża o siódmej"
    feedback: "Autobus do Warszawy, not Autobus do Warszawa -- Warszawy is the memorized destination form."

  pl.a1.unit15.lesson02.exercise09.speak_dokad_autobus:
    instruction: "Say: 'Where's the bus going?'"
    accepted_answers:
      - "Dokąd jedzie autobus?"
      - "Dokąd jedzie autobus"

  pl.a1.unit15.lesson03.exercise01.select_marek_krakow_line:
    instruction: "Which line says Marek is going to Krakow?"
    correct_option: "Jutro jadę do Krakowa. Mój pociąg odjeżdża o czwartej po południu."
    distractors:
      - "Ja jadę do Warszawy. Mój autobus odjeżdża o dziesiątej rano."
      - "Miłej podróży!"
    accepted_answers:
      - "Jutro jadę do Krakowa. Mój pociąg odjeżdża o czwartej po południu."
      - "Jutro jadę do Krakowa Mój pociąg odjeżdża o czwartej po południu"

  pl.a1.unit15.lesson03.exercise02.select_ewa_ten_line:
    instruction: "Which line says Ewa's bus leaves at ten in the morning?"
    correct_option: "Ja jadę do Warszawy. Mój autobus odjeżdża o dziesiątej rano."
    distractors:
      - "Jutro jadę do Krakowa. Mój pociąg odjeżdża o czwartej po południu."
      - "Dziękuję! Do zobaczenia!"
    accepted_answers:
      - "Ja jadę do Warszawy. Mój autobus odjeżdża o dziesiątej rano."
      - "Ja jadę do Warszawy Mój autobus odjeżdża o dziesiątej rano"

  pl.a1.unit15.lesson03.exercise03.comprehend_marek_krakow:
    instruction: "Read the line. Where does Marek say he's going?"
    correct_option: "Krakow"
    distractors:
      - "Warsaw"
      - "he doesn't say"
    accepted_answers:
      - "Kraków"
      - "Krakow"

  pl.a1.unit15.lesson03.exercise04.comprehend_ewa_ten:
    instruction: "Read the line. What time does Ewa's bus leave?"
    correct_option: "ten in the morning"
    distractors:
      - "four in the afternoon"
      - "she doesn't say"
    accepted_answers:
      - "dziesiątej"
      - "ten in the morning"
      - "10am"

  pl.a1.unit15.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "Jutro": "tomorrow"
      "jadę": "I go (by vehicle)"
      "Mój": "my"
      "pociąg": "train"
      "autobus": "bus"
      "dziesiątej": "at ten o'clock"
      "Miłej podróży": "have a nice trip"
      "Dziękuję": "thank you"

  pl.a1.unit15.lesson03.exercise06.order_jutro_jade:
    instruction: "Put the sentence 'Tomorrow I'm going to Krakow' in order."
    correct_response: ["Jutro", "jadę", "do", "Krakowa"]

  pl.a1.unit15.lesson03.exercise07.order_moj_autobus:
    instruction: "Put the sentence 'My bus leaves at ten in the morning' in order."
    correct_response: ["Mój", "autobus", "odjeżdża", "o", "dziesiątej", "rano"]

  pl.a1.unit15.lesson03.exercise08.fill_dziesiatej:
    instruction: "Complete the sentence: 'My bus leaves at ten in the morning.'"
    accepted_answers: ["dziesiątej"]
    feedback: "Mój autobus odjeżdża o dziesiątej rano -- dziesiątej is the locative hour form for 'ten.'"

  pl.a1.unit15.lesson03.exercise09.fix_jutro_jade:
    instruction: "Fix the sentence -- Krakow needs its destination form after 'do.'"
    accepted_answers:
      - "Jutro jadę do Krakowa."
      - "Jutro jadę do Krakowa"
    feedback: "Jutro jadę do Krakowa, not Jutro jadę do Kraków -- Krakowa is the memorized destination form."

  pl.a1.unit15.lesson03.exercise10.reply_mila_podrozy:
    instruction: "Answer as Marek: wish Ewa a nice trip."
    accepted_answers:
      - "Miłej podróży!"
      - "Miłej podróży"

  pl.a1.unit15.lesson03.exercise11.speak_mila_podrozy:
    instruction: "Say: 'Have a nice trip!'"
    accepted_answers:
      - "Miłej podróży!"
      - "Miłej podróży"
