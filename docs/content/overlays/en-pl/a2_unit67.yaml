  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns (Kwiatowa).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
