teaching:
  pl.a2.unit67.lesson01.teach.sluchawki:
    title: The headphones
    gloss: the headphones
    note: '*Słuchawki* (headphones) is a plural noun in Polish, as in English, so it takes plural forms: *te słuchawki są zepsute*.'
    example_gloss: I bought new headphones.
  pl.a2.unit67.lesson01.teach.te_sluchawki_sa:
    title: Reporting the headphones are broken
    gloss: These headphones are broken.
    note: '*Zepsuty* (broken) describes any object that no longer works, from electronics to furniture. It agrees with the noun, so with *słuchawki* it becomes *zepsute*.'
  pl.a2.unit67.lesson01.teach.lewa_strona_nie:
    title: Describing which side doesn't work
    gloss: The left side doesn't work.
    note: '*Nie działa* (literally "does not function") is the standard way to say that a device or a part is not working.'
  pl.a2.unit67.lesson02.teach.zwrot_pieniedzy:
    title: The money back
    gloss: the money back/refund
    note: '*Zwrot pieniędzy* (a refund) is a fixed noun phrase. *Zwrot* is masculine, and *pieniędzy* (money) is the genitive.'
    example_gloss: I would like my money back.
  pl.a2.unit67.lesson02.teach.prosze_o_zwrot:
    title: Requesting a refund
    gloss: I would like my money back.
    note: '*Proszę o ...* (literally "I ask for ...") is the polite, neutral way to make a request, and it works for a man or a woman. *O* takes the accusative: *o zwrot*.'
  pl.a2.unit67.lesson02.teach.czy_moge_wymienic:
    title: Asking about exchange or refund
    gloss: Can I exchange it or get my money back?
    note: '*Wymienić* (to exchange) and *dostać zwrot pieniędzy* (to get a refund) are the two standard solutions to a complaint.'
  pl.a2.unit67.lesson03.teach.paragon:
    title: The receipt
    gloss: the receipt
    note: '*Paragon* (receipt) is a masculine noun. Its genitive is *paragonu*, as in *nie mam paragonu*.'
    example_gloss: I still have the receipt, here it is.
  pl.a2.unit67.lesson03.teach.czy_ma_pan:
    title: Asking if the customer has the receipt
    gloss: Do you still have the receipt?
    note: '*Jeszcze* (still, yet) checks whether the customer still has the item; in a negative sentence it becomes *już nie* (no longer).'
  pl.a2.unit67.lesson03.teach.kupilem_je_osiem:
    title: Saying when you bought something
    gloss: I bought it eight days ago.
    note: '*Temu* (ago) follows the time period: *osiem dni temu*, *tydzień temu*. *Je* is the accusative plural "them", matching *słuchawki*. A woman says *Kupiłam je ...*.'
  pl.a2.unit67.lesson04.teach.zasady_zwrotow:
    title: The return policy
    gloss: the return policy
    note: '*Zasady zwrotów* (return policy) is a plural noun phrase: *zasady* (rules, policy) + the genitive plural *zwrotów* (of returns).'
    example_gloss: What's this shop's return policy?
  pl.a2.unit67.lesson04.teach.moze_pan_zwrocic:
    title: Stating the return window
    gloss: You can return an item within thirty days.
    note: '*W ciągu* (within) + genitive is the standard construction for a deadline or time window: *w ciągu trzydziestu dni*. The number is in the genitive too.'
  pl.a2.unit67.lesson04.teach.zalatwie_to_dla:
    title: Offering to arrange something
    gloss: I'll arrange that for you.
    note: '*Załatwić* (to arrange, to sort out) is a common reassuring verb used by staff who help a customer: *Załatwię to dla pana.*'
  pl.a2.unit67.lesson05.teach.zasady_zwrotow_towar:
    title: Reading a return policy notice
    gloss: 'Return policy: you can return an item within thirty days of purchase. Bring the receipt. For a defective item, you''ll get your money back or you can exchange it for a new one.'
    note: '*W przypadku* + genitive (in the case of) introduces the specific case covered by this part of the policy: *w przypadku wadliwego towaru* (for a defective item). *Wadliwy* (defective) agrees with *towar*.'
    glosses:
      zwrotów: return policy
      można: one can, it is possible (impersonal form of móc)
      towar: item / article
      ciągu: within
      trzydziestu: thirty
      dni: days
      po: after
      zakupie: purchase
      zwrócić: to bring back / return
      zabrać: to take (infinitive; proszę zabrać = please take)
      paragon: receipt
      sobą: with oneself (part of ze sobą = along)
      przypadku: in the case of / for
      wadliwego: defective / faulty
      otrzymuje: get (3rd person singular of otrzymywać)
      swoich: your (formal)
      pieniędzy: money
      zwrot: back
      lub: or
      wymienić: to exchange
      na: for / in exchange for
      nowy: new
      egzemplarz: unit / copy (of a product)
  pl.a2.unit67.lesson06.teach.dzien_dobry_w:
    title: Employee opens the conversation
    gloss: 'Employee: Good afternoon, how can I help you?'
  pl.a2.unit67.lesson06.teach.dzien_dobry_te:
    title: Marek reports the problem
    gloss: 'Marek: Good afternoon, these headphones are broken. The left side doesn''t work.'
  pl.a2.unit67.lesson06.teach.przykro_mi_czy:
    title: Employee asks for the receipt
    gloss: 'Employee: That''s annoying. Do you still have the receipt?'
  pl.a2.unit67.lesson06.teach.tak_prosze_kupilem:
    title: Marek confirms and gives the purchase date
    gloss: 'Marek: Yes, here it is. I bought it eight days ago.'
  pl.a2.unit67.lesson06.teach.to_nie_problem:
    title: Employee confirms it's within the window
    gloss: 'Employee: That''s not a problem, that''s within the thirty days. Would you like to exchange it or get your money back?'
  pl.a2.unit67.lesson06.teach.prosze_o_zwrot:
    title: Marek chooses a refund
    gloss: 'Marek: I would like my money back.'
  pl.a2.unit67.lesson06.teach.dobrze_zaraz_to:
    title: Employee confirms it's arranged
    gloss: 'Employee: Great, I''ll arrange that for you.'
  pl.a2.unit67.lesson06.teach.on_kupil_sluchawki:
    title: 'Past tense, third person: kupił, dostała'
    gloss: He bought the headphones. She got her money back.
    note: 'In the past tense the verb agrees with the subject in gender: *on kupił* (he bought, masculine -ł), *ona dostała* (she got, feminine -ła). *On* and *ona* are written here for contrast; Polish normally drops them. The first-person forms are *kupiłem* (a man speaking) and *kupiłam* (a woman speaking).'
