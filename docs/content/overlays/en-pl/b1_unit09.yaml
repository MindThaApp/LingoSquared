answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit09.plany:
    title: "Plans"

lessons:
  pl.b1.unit09.lesson01.zamierzam:
    title: "I intend to..."
  pl.b1.unit09.lesson02.chyba_prawdopodobnie:
    title: "Probably..."
  pl.b1.unit09.lesson03.plany_na_weekend:
    title: "Weekend plans"
  pl.b1.unit09.lesson04.moj_plan_na_przyszlosc:
    title: "My plan for the future"

teaching:
  pl.b1.unit09.lesson01.teach.recap_words:
    title: "Is, I have, good -- again"
    gloss: "jest, mam, dobry -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds three future-reference forms."

  pl.b1.unit09.lesson01.teach.zamierzam:
    title: "I intend to"
    gloss: "I intend to"
    note: "First-person present of *zamierzać* (to intend)."
    example_gloss: "I intend to learn to swim."

  pl.b1.unit09.lesson01.teach.nauczyc_sie_plywac:
    title: "To learn to swim"
    gloss: "to learn to swim"
    note: "*nauczyć się* -- reflexive \"to learn\", + *pływać* (to swim), an infinitive."
    example_gloss: "I intend to learn to swim this year."

  pl.b1.unit09.lesson01.teach.w_tym_roku:
    title: "This year"
    gloss: "this year"
    note: "*roku* -- locative of *rok* (year), after *w* (in)."
    example_gloss: "I intend to learn to swim this year."

  pl.b1.unit09.lesson01.teach.zamierzam_note:
    title: "Zamierzam + infinitive"
    gloss: "\"Zamierzam\" + infinitive -- expresses an INTENTION, a plan for the future that hasn't happened yet: *Zamierzam nauczyć się pływać* (I intend to learn to swim)."
    note: "The \"intention\" category of this outcome's three-way future distinction (fixed arrangement / intention / uncertain prediction)."

  pl.b1.unit09.lesson01.teach.phrase_zamierzam:
    title: "I intend to learn to swim this year"
    gloss: "I intend to learn to swim this year."
    note: "A complete intention sentence using zamierzam + infinitive."

  pl.b1.unit09.lesson02.teach.chyba:
    title: "Probably / I guess"
    gloss: "probably / I guess"
    note: "A colloquial certainty marker for an uncertain guess."
    example_gloss: "It'll probably rain."

  pl.b1.unit09.lesson02.teach.bedzie_padac:
    title: "It'll rain"
    gloss: "it'll rain"
    note: "*padać* (to rain) is an impersonal verb -- only the *będzie* (it will) form is used, never a personal form like *będziemy*."
    example_gloss: "It'll probably rain this weekend."

  pl.b1.unit09.lesson02.teach.weekend:
    title: "This weekend"
    gloss: "this weekend"
    note: "A common borrowed word in Polish, used exactly like English \"weekend\"."
    example_gloss: "It'll probably rain this weekend."

  pl.b1.unit09.lesson02.teach.prawdopodobnie:
    title: "Probably"
    gloss: "probably"
    note: "A more neutral/written-register synonym of *chyba*, both marking an uncertain prediction."
    example_gloss: "We probably won't go for a walk."

  pl.b1.unit09.lesson02.teach.nie_pojdziemy_na_spacer:
    title: "We won't go for a walk"
    gloss: "we won't go for a walk"
    note: "*pójdziemy* -- perfective future \"we will go\"; *na spacer* -- for a walk."
    example_gloss: "We probably won't go for a walk."

  pl.b1.unit09.lesson02.teach.chyba_note:
    title: "Chyba / prawdopodobnie + future tense"
    gloss: "\"Chyba\" and \"prawdopodobnie\" + future tense -- express an uncertain prediction, something probable but not certain: *Chyba będzie padać* (It'll probably rain). *Padać* is an impersonal verb -- only *będzie* (it will) is used, never *będziemy/będziesz*."
    note: "The \"uncertain prediction\" category of this outcome's three-way future distinction."

  pl.b1.unit09.lesson03.teach.wizyta_u_dentysty:
    title: "Dentist appointment, on Monday"
    gloss: "a dentist appointment, on Monday"
    note: "*mam wizytę* -- present tense \"I have an appointment\", used for a FIXED, already-arranged future event."
    example_gloss: "On Monday I have a dentist appointment."

  pl.b1.unit09.lesson03.teach.obejrzymy_film:
    title: "We'll watch a movie"
    gloss: "we'll watch a movie"
    note: "*obejrzymy* -- perfective future \"we will watch\"."
    example_gloss: "Maybe we'll watch a movie?"

  pl.b1.unit09.lesson03.teach.na_pewno:
    title: "Definitely"
    gloss: "definitely"
    note: "A strong certainty marker, contrasting with the uncertain *chyba/prawdopodobnie*."
    example_gloss: "We'll definitely do that."

  pl.b1.unit09.lesson03.teach.robic_forms:
    title: "We do / you all do"
    gloss: "\"Robić\" (to do): *robimy* -- we do, *robicie* -- you all do. What are we doing this weekend? / What are you all doing this weekend?"
    note: "Two persons of the same verb, both used to ask about weekend plans."

  pl.b1.unit09.teach.dialogue.line01:
    title: "Ewa states her fixed appointment"
    gloss: "On Monday I have a dentist appointment."
    note: "A FIXED arrangement -- present tense of *mieć* (to have)."
  pl.b1.unit09.teach.dialogue.line02:
    title: "Marek states his intention"
    gloss: "I have plans too -- I intend to learn to swim."
    note: "An INTENTION -- zamierzam + infinitive."
  pl.b1.unit09.teach.dialogue.line03:
    title: "Ewa asks about the weekend"
    gloss: "Great idea! And what are we doing this weekend?"
    note: "Sets up the weekend-plan question that lesson04's prediction answers."
  pl.b1.unit09.teach.dialogue.line04:
    title: "Marek gives an uncertain prediction"
    gloss: "It'll probably rain, so we probably won't go for a walk."
    note: "An UNCERTAIN PREDICTION -- chyba/prawdopodobnie + future tense, distinct from the fixed appointment and the stated intention."
  pl.b1.unit09.teach.dialogue.line05:
    title: "Ewa suggests an alternative"
    gloss: "Too bad. Maybe we'll watch a movie?"
    note: "A reaction to the rain prediction, not a new fact to contradict."
  pl.b1.unit09.teach.dialogue.line06:
    title: "Marek agrees, certainly"
    gloss: "Good idea, we'll definitely do that."
    note: "*na pewno* -- a certain statement, contrasting with the earlier uncertain prediction."

  pl.b1.unit09.lesson04.teach.w_przyszlym_tygodniu:
    title: "Next week, I'm going to my parents'"
    gloss: "next week, I'm going to my parents'"
    note: "*jadę* -- present tense of a motion verb, used for a FIXED arrangement, the same pattern as *mam wizytę*."
    example_gloss: "Next week I'm going to my parents'."

  pl.b1.unit09.lesson04.teach.review_note:
    title: "Three ways to talk about the future"
    gloss: "Three ways to talk about the future: 1) present tense for FIXED plans (*jadę*, *mam wizytę*), 2) *zamierzam* + infinitive for INTENTIONS, 3) *chyba/prawdopodobnie* + future tense for UNCERTAIN predictions."
    note: "The three-way distinction this outcome names literally, reviewed together before this lesson's culminating writing task."

