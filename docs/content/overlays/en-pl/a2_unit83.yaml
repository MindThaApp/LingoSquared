  pl.a2.unit83.lesson06.exercise01.escucha_apertura: {"instruction": "Listen and select the line you hear.", "correct_option": "Cześć, Ewo. Co robiłaś w sobotę?", "distractors": ["Cześć, Ewo. Co robiłaś w niedzielę?", "Cześć, Ewo. Co zrobiłaś w sobotę?", "Cześć, Ewo. Co robiłeś w sobotę?"], "accepted_answers": [{"value": "Cześć, Ewo. Co robiłaś w sobotę?", "status": "correct"}], "feedback": "Marek opens with *Co robiłaś w sobotę?*"}
  pl.a2.unit83.lesson06.exercise02.entiende_ewa: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She drank coffee.", "distractors": ["She cooked dinner.", "She went to the pool.", "She phoned Nina."], "accepted_answers": [{"value": "She drank coffee.", "status": "correct"}], "feedback": "Ewa says: *Zanim wyszłam z domu, wypiłam kawę.*"}
  pl.a2.unit83.lesson06.exercise03.une_dialogo: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Co robiłaś w sobotę?", "right": "What did you do on Saturday?"}, {"left": "Zanim wyszłam z domu, wypiłam kawę.", "right": "Before I left the house, I drank coffee."}, {"left": "Potem pojechałam do miasta.", "right": "Then I went to the town."}, {"left": "Ugotowałam obiad.", "right": "I cooked dinner."}, {"left": "Kiedy gotowałam, zadzwoniła Nina.", "right": "While I was cooking, Nina called."}, {"left": "Najpierw zjadłem śniadanie.", "right": "First I ate breakfast (man)."}, {"left": "Zadzwonię, zanim wyjdę z domu.", "right": "I will call before I leave the house."}], "status": "correct"}], "feedback": "Lines from the conversation."}
  pl.a2.unit83.lesson06.exercise04.ordena_marek: {"instruction": "Put the words in order to say 'First I ate breakfast, then I went to the pool. (A man is speaking.)'", "correct_option": "Najpierw zjadłem śniadanie potem poszedłem na basen", "accepted_answers": [{"value": "Najpierw zjadłem śniadanie potem poszedłem na basen", "status": "correct"}], "feedback": "Two events in order with *najpierw* and *potem*."}
  pl.a2.unit83.lesson06.exercise05.responde_obiad: {"instruction": "Answer as Ewa: say that you cooked dinner.", "correct_option": "Ugotowałam obiad.", "accepted_answers": [{"value": "Ugotowałam obiad.", "status": "correct"}, {"value": "Ugotowałam obiad", "status": "correct"}, {"value": "Po tym jak wróciłam, ugotowałam obiad.", "status": "correct"}, {"value": "Po tym jak wróciłam, ugotowałam obiad", "status": "correct"}], "feedback": "*Ugotowałam obiad.*"}
  pl.a2.unit83.lesson06.exercise06.traduce_dialogo: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Zadzwonię, zanim wyjdę z domu.", "status": "correct"}, {"value": "Zadzwonię, zanim wyjdę z domu", "status": "correct"}, {"value": "Zanim wyjdę z domu, zadzwonię.", "status": "correct"}, {"value": "Zanim wyjdę z domu, zadzwonię", "status": "correct"}], "feedback": "Both verbs are perfective future forms."}
  pl.a2.unit83.lesson06.exercise07.escribe_dialogo: {"instruction": "Write one Polish sentence.", "correct_option": "Zanim wyszłam z domu, wypiłam kawę. Potem pojechałam do miasta.", "accepted_answers": [{"value": "Zanim wyszłam z domu, wypiłam kawę. Potem pojechałam do miasta.", "status": "correct"}, {"value": "Zanim wyszłam z domu, wypiłam kawę. Potem pojechałam do miasta", "status": "correct"}], "feedback": "*Zanim wyszłam z domu, wypiłam kawę. Potem pojechałam do miasta.*"}
