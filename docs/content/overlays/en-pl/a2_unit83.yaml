teaching:
  pl.a2.unit83.lesson01.teach.kolejnosc: {"title": "Order words", "gloss": "first / then, afterwards / later / finally", "note": "These words put events in order. *Potem* and *później* both mean 'afterwards'.", "example_gloss": ["First I drank coffee.", "Then I ate breakfast.", "Later I called Marek.", "Finally I left the house."]}
  pl.a2.unit83.lesson01.teach.czynnosci: {"title": "Morning actions", "gloss": "to drink up a coffee / to eat breakfast / to wash / to leave the house", "note": "These verbs are perfective: they name a finished action.", "example_gloss": ["Ewa drank a coffee.", "Marek ate breakfast.", "I washed.", "Ewa left the house."]}
  pl.a2.unit83.lesson01.teach.gn_zanim: {"title": "Zanim: before", "gloss": "Before I left the house, I drank coffee. Before Ewa left the house, she ate breakfast.", "note": "*Zanim* means 'before'. The verb after *zanim* is in the past tense and perfective (*wyszedłem*). Polish does not add *nie* here."}
  pl.a2.unit83.lesson01.teach.gn_odwrotnie: {"title": "Zanim can come second", "gloss": "I drank coffee before I left the house. Ewa ate breakfast before she left the house.", "note": "The *zanim* clause can also come second. The action after *zanim* always happens later."}
  pl.a2.unit83.lesson01.teach.pytanie: {"title": "What first?", "gloss": "What did you do first? First I drank coffee, then I ate breakfast.", "note": "Use *najpierw* and *potem* to answer in order."}
  pl.a2.unit83.lesson02.teach.czynnosci: {"title": "Evening actions", "gloss": "to come home / to cook dinner / to eat dinner / to phone Marek", "note": "Again these are perfective verbs for finished actions.", "example_gloss": ["Marek came home.", "Ewa cooked dinner.", "I ate dinner.", "I phoned Marek."]}
  pl.a2.unit83.lesson02.teach.gn_po_tym_jak: {"title": "Po tym jak: after", "gloss": "After I came home, I cooked dinner. After Ewa ate dinner, she phoned Marek.", "note": "*Po tym jak* introduces a whole clause: 'after something happened'. The verb is past and perfective. The clause after *po tym jak* is the earlier event."}
  pl.a2.unit83.lesson02.teach.gn_kolejnosc: {"title": "Zanim or po tym jak", "gloss": "Before I cooked dinner, I came home. After I came home, I cooked dinner.", "note": "Both sentences tell the same story in the same order. With *zanim* the earlier event is in the main clause; with *po tym jak* it is in the *po tym jak* clause."}
  pl.a2.unit83.lesson02.teach.gn_po: {"title": "Po + a noun", "gloss": "After work I came home. After dinner Ewa phoned Marek.", "note": "With a noun, *po* is followed by the locative: *praca* becomes *pracy*, *obiad* becomes *obiedzie*."}
  pl.a2.unit83.lesson03.teach.pary: {"title": "Aspect pairs", "gloss": "to be coming back – to come back / to be cooking – to cook (finish) / to be writing – to write (finish)", "note": "The first verb of each pair names an activity in progress (imperfective). The second names a finished action (perfective).", "example_gloss": ["Marek was on his way home.", "Marek came home.", "Ewa was cooking dinner.", "Ewa cooked dinner (and finished it)."]}
  pl.a2.unit83.lesson03.teach.gn_kiedy_dok: {"title": "Kiedy + finished action", "gloss": "When I had come home, I cooked dinner. When Ewa had eaten breakfast, she left the house.", "note": "*Kiedy* with a perfective verb means 'once that was finished': the second event follows the first."}
  pl.a2.unit83.lesson03.teach.gn_kiedy_niedok: {"title": "Kiedy + activity in progress", "gloss": "When I was on my way home, I bought bread. While I was cooking dinner, Marek called.", "note": "*Kiedy* with an imperfective verb means 'while': the second event happens during the first."}
  pl.a2.unit83.lesson03.teach.gn_aspekt: {"title": "One letter, two meanings", "gloss": "When I had come home, Marek called. While I was on my way home, Marek called.", "note": "The two sentences differ only in the aspect: *wróciłem* (arrived) and *wracałem* (on the way)."}
  pl.a2.unit83.lesson04.teach.plan: {"title": "A plan", "gloss": "tomorrow / I will buy bread / I will cook dinner / I will phone Marek / I will come home", "note": "These perfective forms look like the present tense but mean one finished action in the future.", "example_gloss": ["Tomorrow I will buy bread.", "In the evening I will cook dinner.", "I will phone Marek.", "I will come home at six."]}
  pl.a2.unit83.lesson04.teach.gn_zanim_przyszly: {"title": "Zanim in a plan", "gloss": "Before I come home, I will buy bread. Before I phone Marek, I will drink a coffee.", "note": "When you plan ahead, the verb after *zanim* has the perfective future form (*wrócę*), but it is translated with 'before I come'."}
  pl.a2.unit83.lesson04.teach.gn_po_przyszly: {"title": "Po tym jak in a plan", "gloss": "After I come home, I will cook dinner. After Marek arrives, we will eat supper.", "note": "After *po tym jak* use the same perfective future form (*wrócę*, *przyjdzie*)."}
  pl.a2.unit83.lesson04.teach.gn_plan: {"title": "A whole plan", "gloss": "First I will buy bread, then I will come home, and in the evening I will cook dinner.", "note": "Connect a plan with *najpierw*, *potem* and *a wieczorem*."}
  pl.a2.unit83.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "on Saturday / I was on my way back (woman) / from the town / I drank a coffee (woman)", "note": "*W sobotę* means 'on Saturday'. *Z miasta* means 'from the town'.", "example_gloss": ["On Saturday I woke up early.", "I was coming back from the town.", "Ewa drank a coffee."]}
  pl.a2.unit83.lesson05.teach.gn_ewa: {"title": "Ewa's order", "gloss": "Before I left the house, I drank coffee. After I came home, I cooked dinner.", "note": "Ewa tells her day with *zanim* and *po tym jak*, all in the feminine past."}
  pl.a2.unit83.lesson05.teach.gn_ewa_kiedy: {"title": "Ewa's trip", "gloss": "While I was on my way home, I bought bread.", "note": "*Wracałam* shows the shop was on the way."}
  pl.a2.unit83.lesson05.teach.lectura: {"title": "Ewa's Saturday", "gloss": "On Saturday I woke up early. Before I left the house, I drank coffee and ate breakfast. While I was coming back from the town, I bought bread. After I came home, I cooked dinner. Then I phoned Marek.", "note": "Ewa tells her Saturday in order. All her verbs end in *-łam*.", "glosses": {"zanim": "before", "kiedy": "while / when", "po": "after", "potem": "then", "wracałam": "I was on my way back (woman)", "wróciłam": "I came back (woman)"}}
  pl.a2.unit83.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. What did you do on Saturday?"}
  pl.a2.unit83.lesson06.teach.d2: {"title": "Ewa begins", "gloss": "Ewa: Before I left the house, I drank coffee. Then I went to the town."}
  pl.a2.unit83.lesson06.teach.d3: {"title": "Marek asks more", "gloss": "Marek: And after you came home?"}
  pl.a2.unit83.lesson06.teach.d4: {"title": "Ewa continues", "gloss": "Ewa: I cooked dinner. While I was cooking, Nina called."}
  pl.a2.unit83.lesson06.teach.d5: {"title": "Marek tells", "gloss": "Marek: First I ate breakfast, then I went to the pool."}
  pl.a2.unit83.lesson06.teach.d6: {"title": "Ewa asks", "gloss": "Ewa: Call me tomorrow."}
  pl.a2.unit83.lesson06.teach.d7: {"title": "Marek promises", "gloss": "Marek: I will call before I leave the house."}
exercises:
