  pl.a2.unit83.lesson04.exercise01.elige_plan: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Zanim wrócę do domu, kupię chleb.", "distractors": ["Zanim wrócę do domu, kupiłem chleb.", "Zanim wróciłem do domu, kupię chleb.", "Po tym jak wrócę do domu, kupię chleb."], "accepted_answers": [{"value": "Zanim wrócę do domu, kupię chleb.", "status": "correct"}], "feedback": "A plan uses the future form after *zanim* and in the main clause."}
