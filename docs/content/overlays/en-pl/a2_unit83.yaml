  pl.a2.unit83.lesson02.exercise01.elige_po: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Po tym jak wróciłem do domu, ugotowałem obiad.", "distractors": ["Po tym jak ugotowałem obiad, wróciłem do domu.", "Po tym jak wróciłam do domu, ugotowałem obiad.", "Zanim wróciłem do domu, ugotowałem obiad."], "accepted_answers": [{"value": "Po tym jak wróciłem do domu, ugotowałem obiad.", "status": "correct"}], "feedback": "The clause with *po tym jak* names the earlier event, coming home."}
