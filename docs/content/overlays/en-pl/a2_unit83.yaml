  pl.a2.unit83.lesson04.exercise03.une_plan: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "jutro", "right": "tomorrow"}, {"left": "kupię chleb", "right": "I will buy bread"}, {"left": "ugotuję obiad", "right": "I will cook dinner"}, {"left": "zadzwonię do Marka", "right": "I will phone Marek"}, {"left": "wrócę do domu", "right": "I will come home"}, {"left": "wypiję kawę", "right": "I will drink a coffee"}, {"left": "zjemy kolację", "right": "we will eat supper"}, {"left": "po tym jak", "right": "after (a clause)"}], "status": "correct"}], "feedback": "A plan in the future."}
  pl.a2.unit83.lesson04.exercise04.ordena_plan: {"instruction": "Put the words in order to say 'Before I come home, I will buy bread.'", "correct_option": "Zanim wrócę do domu kupię chleb", "accepted_answers": [{"value": "Zanim wrócę do domu kupię chleb", "status": "correct"}, {"value": "Kupię chleb zanim wrócę do domu", "status": "correct"}], "feedback": "Either clause can come first."}
  pl.a2.unit83.lesson04.exercise05.completa_plan: {"instruction": "Complete with the verb 'to come back' in the future form (I).", "correct_option": "wrócę", "accepted_answers": [{"value": "wrócę", "status": "correct"}], "feedback": "After *zanim* use *wrócę* for a plan."}
  pl.a2.unit83.lesson04.exercise06.traduce_plan: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Po tym jak wrócę do domu, ugotuję obiad.", "status": "correct"}, {"value": "Po tym jak wrócę do domu, ugotuję obiad", "status": "correct"}, {"value": "Ugotuję obiad, po tym jak wrócę do domu.", "status": "correct"}, {"value": "Ugotuję obiad, po tym jak wrócę do domu", "status": "correct"}], "feedback": "*Wrócę* and *ugotuję* are both perfective future forms."}
  pl.a2.unit83.lesson04.exercise07.escribe_plan: {"instruction": "Write one Polish sentence.", "correct_option": "Zanim zadzwonię do Marka, wypiję kawę.", "accepted_answers": [{"value": "Zanim zadzwonię do Marka, wypiję kawę.", "status": "correct"}, {"value": "Zanim zadzwonię do Marka, wypiję kawę", "status": "correct"}, {"value": "Wypiję kawę, zanim zadzwonię do Marka.", "status": "correct"}, {"value": "Wypiję kawę, zanim zadzwonię do Marka", "status": "correct"}], "feedback": "*Zanim zadzwonię do Marka, wypiję kawę.*"}
  pl.a2.unit83.lesson05.exercise01.lee_zanim: {"instruction": "Read the story and choose the answer.", "correct_option": "She drank coffee and ate breakfast.", "distractors": ["She cooked dinner.", "She bought bread.", "She phoned Marek."], "accepted_answers": [{"value": "She drank coffee and ate breakfast.", "status": "correct"}], "feedback": "*Zanim wyszłam z domu, wypiłam kawę i zjadłam śniadanie.*"}
  pl.a2.unit83.lesson05.exercise02.lee_chleb: {"instruction": "Read the story and choose the answer.", "correct_option": "On her way home.", "distractors": ["Before she left the house.", "After she cooked dinner.", "After she phoned Marek."], "accepted_answers": [{"value": "On her way home.", "status": "correct"}], "feedback": "*Kiedy wracałam z miasta, kupiłam chleb.*"}
  pl.a2.unit83.lesson05.exercise03.une_texto: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Obudziłam się wcześnie.", "right": "I woke up early (woman)."}, {"left": "Wypiłam kawę.", "right": "I drank a coffee (woman)."}, {"left": "Zjadłam śniadanie.", "right": "I ate breakfast (woman)."}, {"left": "Kupiłam chleb.", "right": "I bought bread (woman)."}, {"left": "Wróciłam do domu.", "right": "I came home (woman)."}, {"left": "Ugotowałam obiad.", "right": "I cooked dinner (woman)."}, {"left": "Zadzwoniłam do Marka.", "right": "I phoned Marek (woman)."}], "status": "correct"}], "feedback": "Sentences from the story."}
  pl.a2.unit83.lesson05.exercise04.ordena_texto: {"instruction": "Put the words in order to say 'After I came home, I cooked dinner. (A woman is speaking.)'", "correct_option": "Po tym jak wróciłam do domu ugotowałam obiad", "accepted_answers": [{"value": "Po tym jak wróciłam do domu ugotowałam obiad", "status": "correct"}, {"value": "Ugotowałam obiad po tym jak wróciłam do domu", "status": "correct"}], "feedback": "Both orders are possible."}
  pl.a2.unit83.lesson05.exercise05.traduce_texto: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Kiedy wracałam z miasta, kupiłam chleb.", "status": "correct"}, {"value": "Kiedy wracałam z miasta, kupiłam chleb", "status": "correct"}], "feedback": "*Wracałam* is the activity in progress."}
  pl.a2.unit83.lesson05.exercise06.dicta_zanim: {"instruction": "Type what you hear.", "correct_response": "Zanim wyszłam z domu, wypiłam kawę.", "orthography_strict": true, "feedback": "You heard *Zanim wyszłam z domu, wypiłam kawę.*"}
