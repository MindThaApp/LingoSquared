  pl.a2.unit83.lesson02.exercise07.escribe_po: {"instruction": "Write one Polish sentence.", "correct_option": "Po tym jak wróciłem do domu, ugotowałem obiad.", "accepted_answers": [{"value": "Po tym jak wróciłem do domu, ugotowałem obiad.", "status": "correct"}, {"value": "Po tym jak wróciłem do domu, ugotowałem obiad", "status": "correct"}, {"value": "Po tym jak wróciłam do domu, ugotowałam obiad.", "status": "correct"}, {"value": "Po tym jak wróciłam do domu, ugotowałam obiad", "status": "correct"}, {"value": "Ugotowałem obiad, po tym jak wróciłem do domu.", "status": "correct"}, {"value": "Ugotowałem obiad, po tym jak wróciłem do domu", "status": "correct"}, {"value": "Ugotowałam obiad, po tym jak wróciłam do domu.", "status": "correct"}, {"value": "Ugotowałam obiad, po tym jak wróciłam do domu", "status": "correct"}], "feedback": "A man: *wróciłem*, *ugotowałem*. A woman: *wróciłam*, *ugotowałam*."}
