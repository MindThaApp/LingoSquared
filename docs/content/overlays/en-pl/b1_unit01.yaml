answer_policy:
  diacritics: >-
    Same standing policy as pl's A1-A2 units: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the
    model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek, Kraków).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit01.warunki_hipotetyczne:
    title: "Hypothetical conditions"

lessons:
  pl.b1.unit01.lesson01.chcialbym_wiecej_czasu:
    title: "I would like to have more time"
  pl.b1.unit01.lesson02.gdybym_zmienil_prace:
    title: "If I changed jobs"
  pl.b1.unit01.lesson03.przeprowadzka:
    title: "Moving to another city"
  pl.b1.unit01.lesson04.gdyby_nie_praca:
    title: "If it weren't for work..."

teaching:
  pl.b1.unit01.lesson01.teach.recap_words:
    title: "I, you, time, work, home -- again"
    gloss: "ja, ty, mam, mieć, jestem, czas, praca, dom, dużo -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds the conditional mood on top of them."

  pl.b1.unit01.lesson01.teach.chcialbym:
    title: "I would like (a man speaking)"
    gloss: "*chciałbym* -- the conditional form of \"chcieć\" (to want) for a man speaking about himself: I would like."
    note: "Built from *chciał* (the past-tense form) plus the movable particle *by* plus the ending *-m* for \"I.\" This *L-participle + by + ending* pattern is the whole B1 conditional mood in one formula."

  pl.b1.unit01.lesson01.teach.podrozowac:
    title: "To travel"
    gloss: "to travel"
    note: "An imperfective verb -- describes the ongoing activity of traveling, not one completed trip."
    example_gloss: "I would like to travel more."

  pl.b1.unit01.lesson01.teach.wiecej:
    title: "More"
    gloss: "more"
    note: "Used with a genitive noun: *więcej czasu* -- more (of) time."
    example_gloss: "I would like to have more time."

  pl.b1.unit01.lesson01.teach.chcialabym:
    title: "I would like (a woman speaking)"
    gloss: "*chciałabym* -- the same construction, but a woman speaking about herself: I would like."
    note: "Same formula as *chciałbym*, with the feminine past-tense stem *chciała* instead of *chciał*."

  pl.b1.unit01.lesson01.teach.phrase_wiecej_czasu:
    title: "I would like to have more time"
    gloss: "I would like to have more time."
    note: "A genuinely useful B1 sentence -- softens a wish rather than stating a flat fact."

  pl.b1.unit01.lesson02.teach.zmienic:
    title: "To change"
    gloss: "to change"
    note: "A perfective verb -- a completed change, not an ongoing process."
    example_gloss: "I would like to change jobs."

  pl.b1.unit01.lesson02.teach.gdybym_note:
    title: "If I -- the hypothetical conjunction"
    gloss: "*gdybym* -- the conditional form of \"gdyby\" (if) for \"I\": gdy + by + m."
    note: "After *gdybym*, the verb takes only its plain past-tense form -- no second *by* is added there; the *by* already sits on *gdybym* itself."

  pl.b1.unit01.lesson02.teach.zostac_instrumental:
    title: "I would become -- with the instrumental case"
    gloss: "*zostałbym* -- I would become. \"Zostać\" (to become) takes the instrumental case: zostać kim? (become who?) -- *zostałbym nauczycielem* (instrumental *nauczyciel* -> *nauczycielem*)."
    note: "A real case-marking rule, not decoration: naming what you'd become always needs the instrumental, never the accusative."

  pl.b1.unit01.lesson02.teach.phrase_zmienic_prace:
    title: "If I changed jobs, I would become a teacher"
    gloss: "If I changed jobs, I would become a teacher."
    note: "The full gdyby-clause plus result-clause pattern in one sentence."

  pl.b1.unit01.lesson02.teach.cos_innego:
    title: "Something different"
    gloss: "something different"
    note: "*coś* (something) + *innego* (genitive of *inne*, different) -- a fixed pairing."
    example_gloss: "I would do something different."

  pl.b1.unit01.lesson02.teach.gdybys_note:
    title: "If you -- the \"you\" hypothetical"
    gloss: "*gdybyś* -- the same form for \"you\" (informal): gdy + by + ś. *Co robiłbyś, gdybyś zmienił pracę?* -- What would you do if you changed jobs?"
    note: "Same formula pattern as *gdybym*, just a different personal ending."

  pl.b1.unit01.lesson03.teach.miasto:
    title: "City"
    gloss: "city"
    note: "A neuter noun."
    example_gloss: "Kraków is a beautiful city."

  pl.b1.unit01.lesson03.teach.moglbym_mieszkac:
    title: "I could live in another city"
    gloss: "*mógłbym mieszkać w innym mieście* -- I could live in another city. \"W\" (in) takes the locative case: *miasto* -> *mieście*, *inny* -> *innym*."
    note: "*mógłbym* is the conditional of *móc* (can/to be able) -- \"could\" rather than a flat \"can.\""

  pl.b1.unit01.lesson03.teach.przeprowadzic_sie:
    title: "To move (relocate)"
    gloss: "to move / to relocate"
    note: "A reflexive verb -- always needs *się*."
    example_gloss: "I would like to move to Kraków."

  pl.b1.unit01.lesson03.teach.dokad:
    title: "To where"
    gloss: "*dokąd* -- to where. \"Do\" (to) takes the genitive case: *Kraków* -> *Krakowa*. *Dokąd pojechałbyś?* -- Where would you go?"
    note: "*pojechałbyś* is the conditional of *pojechać* (to go, by vehicle) for \"you.\""

  pl.b1.unit01.lesson03.teach.blizej_gor:
    title: "Closer to the mountains"
    gloss: "*bliżej gór* -- closer to the mountains. \"Bliżej\" (closer) takes the genitive case: *góry* -> *gór*."
    note: "Another genitive-governing word, like *więcej* from lesson01."

  pl.b1.unit01.lesson03.teach.zostac_stay:
    title: "To stay (here)"
    gloss: "*zostałabym* -- I would stay (a woman speaking). Here *zostać* means \"to stay/remain,\" not \"to become\" as in lesson02 -- the same verb, a different sense from context."
    example_gloss: "I would stay here."

  pl.b1.unit01.lesson03.teach.marzenia:
    title: "Dreams"
    gloss: "dreams"
    note: "*Każdy* (everyone) + *inne* (different, neuter plural agreeing with *marzenia*)."
    example_gloss: "Everyone has different dreams."

  pl.b1.unit01.teach.dialogue.line01:
    title: "Ewa asks where Marek would go"
    gloss: "If you could live in another city, where would you go?"
    note: "Ewa opens with a genuine hypothetical question, using both *gdybyś* and the conditional result clause."
  pl.b1.unit01.teach.dialogue.line02:
    title: "Marek names his destination"
    gloss: "I would go to Kraków. I've always wanted to live there."
    note: "*Zawsze chciałem* (I've always wanted) is a plain past tense, not conditional -- a genuine long-standing wish, not a hypothetical one."
  pl.b1.unit01.teach.dialogue.line03:
    title: "Ewa asks why"
    gloss: "Why Kraków specifically?"
    note: "A natural, short follow-up question."
  pl.b1.unit01.teach.dialogue.line04:
    title: "Marek gives his reason"
    gloss: "Because it's closer to the mountains, and I love mountains."
    note: "Marek's stated reason for Kraków -- this exact fact, and no other, is what this lesson's exercises test."
  pl.b1.unit01.teach.dialogue.line05:
    title: "Ewa says she would stay"
    gloss: "And I would stay here. I have my friends here."
    note: "Ewa's own contrasting choice and her own stated reason -- her job and friends, distinct from Marek's mountains."
  pl.b1.unit01.teach.dialogue.line06:
    title: "Marek accepts the difference"
    gloss: "I understand. Everyone has different dreams."
    note: "A natural, friendly close to the exchange."

