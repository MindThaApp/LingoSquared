answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polish A1
  description: 'Beginner Polish for describing free-time activities: hobby vocabulary, frequency expressions, asking and answering what someone does in their free time, and comparing two people''s hobbies.'
units:
  pl.a1.unit24.hobby:
    title: Hobbies and free time
lessons:
  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Reading, exercising, and cooking
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Music, drawing, and gaming
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: What do you do in your free time?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa and Marek talk about hobbies
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek and Ewa compare their hobbies
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Planning a weekend together
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *czytać* (to read), *uprawiać sport* (to do sport), and *gotować* (to cook).'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Free time
    gloss: free time
    note: '*Wolny czas* is the key phrase for talking about hobbies. The adjective *wolny* (free) agrees with the masculine noun *czas*; in *w wolnym czasie* both are in the locative.'
    example_gloss: In my free time, I like to read.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Lubię* (I like) is followed by an infinitive: *lubię czytać*. *W wolnym czasie* uses *w* + locative.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobbies: *słuchać muzyki* (to listen to music), *rysować* (to draw), and *grać w gry* (to play games).'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Słuchać* always takes the genitive: *słucham muzyki*, not *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Z przyjaciółmi* (with friends) uses *z* + instrumental plural.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'The four core frequency adverbs: *zawsze*, *często*, *czasami*, *nigdy*. They never change form, and *nigdy* needs *nie* before the verb: *Nigdy nie gram.*'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Co tydzień* and *co weekend* both mean ''every ...''; *co* is followed by the accusative and never changes - see the next card.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + accusative
    gloss: '*Co* + accusative means ''every'': every week, every weekend, every month.'
    note: '*Co* is one fixed word for ''every'', whatever the noun. Masculine inanimate nouns like *tydzień*, *weekend* and *miesiąc* look the same in the nominative and the accusative.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa brings up hobbies
    gloss: 'Ewa: We often walk together. But what else do you do in your free time, Marek?'
    note: '*Spacerujemy* is the *my* (we) form of *spacerować*; *Marku* is the vocative, used when you address someone directly.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Marek's hobbies
    gloss: 'Marek: I like cooking, at home too. And I exercise often.'
    note: '*Także w domu* (at home too) shows Marek cooks for fun, not just at his restaurant job; *w domu* is the locative.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa is surprised
    gloss: 'Ewa: You cook at home too? You already cook all day at your job!'
    note: '*Cały dzień* (all day) emphasizes how much Marek already cooks at work; *przecież* adds ''but surely''.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek explains
    gloss: 'Marek: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Gotowanie mnie odpręża* is literally ''cooking relaxes me'': Polish often makes the activity the subject and puts *mnie* (me) in the accusative.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Ewa's hobbies
    gloss: 'Ewa: I like reading and I often listen to music.'
    note: Combines two hobby verbs from lessons 1 and 2 in one sentence with *i* (and).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek asks about gaming
    gloss: 'Marek: Do you also game?'
    note: A short yes/no question using *grać w gry* from lesson 2; *też* means 'also'.
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa answers
    gloss: 'Ewa: No, I never game. But I sometimes draw!'
    note: '*Nigdy* (never) and *czasami* (sometimes) from lesson 3, contrasted in one answer. Note the double negative: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Comparing hobbies
    gloss: Marek and I often walk together. But we also have other hobbies. Marek likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Ewa's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      spacerujemy: walk
      często: often
      razem: together
      inne: other
      gotować: cooks
      lubi: likes to
      domu: at home
      uprawia: exercises
      czytać: read
      słucham: listen
      muzyki: music
      rysuję: draw
      czasami: sometimes
      gram: play video games
      nigdy: never
      wolnym: free
      czasie: time
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek asks about the weekend
    gloss: 'Marek: What are you doing this weekend?'
    note: '*W ten weekend* (this weekend) uses *w* + accusative for a time expression.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa is undecided
    gloss: 'Ewa: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Wyjść na dwór* (to go outside) is a common way to say you want to leave the house; *chcę* + infinitive means ''I want to''.'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek suggests a plan
    gloss: 'Marek: Shall we walk together? I''ll cook for us afterward.'
    note: '*Potem* (afterward) is the sequencing word; *ugotuję* is perfective because the cooking is a finished result.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa agrees
    gloss: 'Ewa: Good idea! I like both walking and cooking.'
    note: '*Lubię i ..., i ...* (''both ... and ...'') shows Ewa likes two things equally, not one over the other.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek confirms
    gloss: 'Marek: Perfect. Then I''ll see you Saturday!'
    note: A friendly closing line confirming the plan for Saturday; *w sobotę* is *w* + accusative for a day of the week.
