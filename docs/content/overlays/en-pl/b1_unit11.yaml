review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eleventh en-pl B1 overlay, written for pl/b1_unit11_cele.yaml (schema_
    version 1.1, §19 format from the start). No sibling-direction overlay
    exists yet, so §8 doesn't apply.

    Every note/feedback string mixing Polish text inline with English
    wraps the Polish in *asterisks* per §15. Every matching_pairs
    correct_response and word_order correct_response checked token-for-
    token against the realization's own pairs/word_bank. No stray YAML
    boolean coercion. Feminine AND masculine first-person variants
    included in accepted_answers everywhere lesson04's żebym-zdała
    construction is produced by the learner (rule #6), since the learner
    could be either gender and this form genuinely inflects. Pending
    fresh-context review per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    (1) underdetermined-prompt -- lesson04.exercise07 "write about your
    goals" open prompt graded against fixed strings -> instruction now
    names the two exact sentences (both genders still accepted);
    lesson04.exercise08 "answer with your same-subject purpose" (several
    taught żeby + infinitive sentences fit) -> now names "study English
    in order to get a better job". (2) false-gloss -- lesson03.
    exercise06 "żeby skończyła projekt" -> "so that she finishes the
    project" (mirrors the realization); lesson02.exercise06 hint
    "(finished)" -> "(finishes -- use the feminine past-tense form
    required after żeby)" (the form has no past meaning here).
    (3) false-grammar -- lesson03.exercise09 instruction implied "żeby
    mogła" is ungrammatical; it is grammatical but means "so that SHE can
    rest" -> instruction now explains the you/she contrast. NATIVE
    CHECK: dialogue line06 "Uczę się właśnie po to, żeby cieszyć się
    takimi chwilami" -- confirm it reads naturally as a reply to the
    seaside plan.

answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit11.cele:
    title: "Goals"

lessons:
  pl.b1.unit11.lesson01.zeby_bezokolicznik:
    title: "Żeby + infinitive"
  pl.b1.unit11.lesson02.zeby_czas_przeszly:
    title: "Żeby + past tense"
  pl.b1.unit11.lesson03.moje_cele:
    title: "My goals"
  pl.b1.unit11.lesson04.moj_cel:
    title: "My goal"

teaching:
  pl.b1.unit11.lesson01.teach.recap_words:
    title: "Is, I have, good -- again"
    gloss: "jest, mam, dobry -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds purpose-clause constructions."

  pl.b1.unit11.lesson01.teach.uczy_sie_angielskiego:
    title: "I study English in order to get a better job"
    gloss: "I study English, in order to get a better job"
    note: "*żeby* -- in order to / so that; *dostać* is an infinitive, since the SAME person (I) both studies and gets the job."
    example_gloss: "Every day I study English in order to get a better job."

  pl.b1.unit11.lesson01.teach.oszczedzam_pieniadze:
    title: "I'm saving money in order to buy a new car"
    gloss: "I'm saving money, in order to buy a new car"
    note: "Same-subject pattern again: I save AND I buy, so *kupić* is an infinitive."
    example_gloss: "I'm saving money in order to buy a new car."

  pl.b1.unit11.lesson01.teach.zeby_note:
    title: "Żeby + infinitive (same subject)"
    gloss: "\"Żeby\" + infinitive -- used when the main-clause subject and the purpose-clause subject are the SAME person: *Uczę się angielskiego, żeby dostać lepszą pracę* (I study English in order to get a better job). The infinitive (dostać, kupić) is used when the same person does both actions."
    note: "The same-subject half of this outcome's purpose-clause construction."

  pl.b1.unit11.lesson01.teach.phrase_oszczedzam:
    title: "I'm saving money in order to buy a new car next year"
    gloss: "I'm saving money in order to buy a new car next year."
    note: "A complete purpose sentence combining the goal with a timeframe."

  pl.b1.unit11.lesson02.teach.marek_pomaga_ewie:
    title: "Marek helps Ewa so that she finishes the project faster"
    gloss: "Marek helps Ewa, so that she finishes the project faster"
    note: "*skończyła* -- feminine past tense with the personal ending fused to *żeby* (implied: żeby ona skończyła). DIFFERENT subjects: Marek helps, Ewa finishes."
    example_gloss: "Marek helps Ewa every day, so that she finishes this project faster."

  pl.b1.unit11.lesson02.teach.zebysmy_pojechali:
    title: "Marek is saving money so that we go on vacation"
    gloss: "Marek is saving money, so that we would go on vacation"
    note: "*żebyśmy* -- \"so that we\", the 1st-person-plural ending fused onto żeby. DIFFERENT subjects: Marek saves, WE go."
    example_gloss: "Marek is saving money so that we go on vacation together."

  pl.b1.unit11.lesson02.teach.zeby_przeszly_note:
    title: "Żeby + past tense with a personal ending (different subject)"
    gloss: "\"Żeby\" + a past-tense verb with a personal ending fused onto \"żeby\" (żebym, żebyś, żeby, żebyśmy, żebyście, żeby) -- used when the purpose-clause subject is DIFFERENT from the main-clause subject: *Marek pomaga Ewie, żeby (ona) szybciej skończyła projekt* -- Marek helps, but it's Ewa who finishes the project."
    note: "The different-subject half of this outcome's purpose-clause construction."

  pl.b1.unit11.lesson03.teach.w_miedzynarodowej_firmie:
    title: "To get a job at an international company"
    gloss: "to get a job at an international company"
    note: "Elaborates lesson01's goal with a concrete destination."
    example_gloss: "I study English in order to get a job at an international company."

  pl.b1.unit11.lesson03.teach.nad_morze_odpoczac:
    title: "To the seaside, so that you can rest"
    gloss: "to the seaside, so that you can rest"
    note: "*żebyś* -- \"so that you\" (singular), + *mogła* (feminine \"could\", referring to Ewa)."
    example_gloss: "I want to go to the seaside, so that you can finally rest."

  pl.b1.unit11.teach.dialogue.line01:
    title: "Marek asks about Ewa's goal"
    gloss: "Why are you studying English so intensively?"
    note: "Opens the goal-explaining exchange this lesson's exercises test."
  pl.b1.unit11.teach.dialogue.line02:
    title: "Ewa states her purpose (same subject)"
    gloss: "I study English in order to get a job at an international company."
    note: "żeby + infinitive -- Ewa studies AND Ewa gets the job, same subject."
  pl.b1.unit11.teach.dialogue.line03:
    title: "Marek states his own goal"
    gloss: "That's a beautiful goal! I have a goal too -- I'm saving money so that we go on vacation together."
    note: "żebyśmy -- Marek saves, but WE (both) go, different subject from the main clause's \"I\"."
  pl.b1.unit11.teach.dialogue.line04:
    title: "Ewa asks where"
    gloss: "Really? Where do you want to go?"
    note: "A follow-up question, not a new fact to contradict."
  pl.b1.unit11.teach.dialogue.line05:
    title: "Marek names the purpose for Ewa"
    gloss: "I want to go to the seaside, so that you can rest."
    note: "żebyś -- Marek wants to go, but Ewa is the one who rests, different subject."
  pl.b1.unit11.teach.dialogue.line06:
    title: "Ewa restates her own purpose (same subject)"
    gloss: "Great idea! I study precisely so that I can enjoy moments like this."
    note: "żeby + infinitive again -- Ewa studies AND Ewa enjoys, same subject, closing the unit's two-construction contrast."

  pl.b1.unit11.lesson04.teach.marek_pomaga_mi:
    title: "Marek helps me so that I pass the exam"
    gloss: "Marek helps me, so that I would pass the exam"
    note: "*żebym* -- \"so that I\", the 1st-person-singular ending fused onto żeby; *zdała/zdał* -- feminine/masculine past tense, since this is a first-person form the LEARNER produces about themselves."
    example_gloss: "Marek helps me every day, so that I pass this exam."

  pl.b1.unit11.lesson04.teach.review_note:
    title: "Żeby has two forms"
    gloss: "\"Żeby\" has two forms: 1) żeby + infinitive, when the subject is the same (*Uczę się, żeby dostać pracę*), 2) żeby + a past-tense verb with a personal ending, when the subject is different (*Marek pomaga, żebym zdała egzamin*)."
    note: "The two-construction contrast this outcome names, reviewed together before this lesson's culminating writing task."

