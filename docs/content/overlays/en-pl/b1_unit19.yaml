teaching:
  pl.b1.unit19.lesson01.teach.najpierw_pojechalismy_na_dworzec:
    title: "First we went to the station"
    gloss: "First we went to the station."
    note: "*Najpierw* opens the three-step sequence this lesson teaches."
    example_gloss: "Last weekend, first we went to the station."
  pl.b1.unit19.lesson01.teach.potem_czekalismy_na_peronie:
    title: "Then we waited on the platform"
    gloss: "Then we waited on the platform."
    note: "*Potem* -- the second step; *czekaliśmy* is imperfective (an ongoing wait)."
    example_gloss: "Then we waited on the platform for almost half an hour."
  pl.b1.unit19.lesson01.teach.w_koncu_wsiedlismy:
    title: "Finally we got on the train"
    gloss: "Finally we got on the train."
    note: "*W końcu* -- the third and final step, completing the sequence."
    example_gloss: "The train was late, but finally we got on the train."
  pl.b1.unit19.lesson01.teach.sekwencja_note:
    title: "Sequencing connectors"
    gloss: "Sequencing connectors: \"najpierw\" (first in order) -- \"potem\" (the next step) -- \"w końcu\" (the last step). They link three events into one narrative."
    note: "The core sequencing pattern this unit's culminating exercise requires."
  pl.b1.unit19.lesson01.teach.recap_basics:
    title: "Last weekend we were on a trip"
    gloss: "Last weekend we were on a trip."
    note: "Recap vocabulary used elsewhere in this unit."
    example_gloss: "It was a short trip, but we were traveling all day."

  pl.b1.unit19.lesson02.teach.podczas_gdy_czekalismy:
    title: "While we were waiting on the platform, it started to rain"
    gloss: "While we were waiting on the platform, it started to rain."
    note: "*Podczas gdy* + imperfective (background, ongoing) + perfective (mainline, interrupting event)."
    example_gloss: "While we were waiting on the platform, it unexpectedly started to rain."
  pl.b1.unit19.lesson02.teach.nie_mielismy_parasola:
    title: "Unfortunately we didn't have an umbrella"
    gloss: "Unfortunately we didn't have an umbrella."
    note: "The consequence of the mainline interrupting event."
    example_gloss: "It started to rain, and unfortunately we didn't have an umbrella."
  pl.b1.unit19.lesson02.teach.tlo_i_glowne_zdarzenie_note:
    title: "Background vs. mainline event"
    gloss: "\"Podczas gdy\" + imperfective verb (background, something was ongoing) + perfective verb (the mainline event that interrupted the background)."
    note: "The background/mainline contrast this unit's outcome names explicitly."

  pl.b1.unit19.teach.dialogue.line01:
    title: "Ewa asks about the trip"
    gloss: "Tell me about your trip last weekend."
    note: "Opens the narrative-recounting exchange."
  pl.b1.unit19.teach.dialogue.line02:
    title: "Marek gives the three-step sequence"
    gloss: "First we went to the station, then we waited on the platform, finally we got on the train."
    note: "The full sequencing pattern from lesson01, delivered in one breath."
  pl.b1.unit19.teach.dialogue.line03:
    title: "Marek marks the background event"
    gloss: "While we were waiting on the platform, it unexpectedly started to rain."
    note: "The background/mainline construction from lesson02."
  pl.b1.unit19.teach.dialogue.line04:
    title: "Ewa recalls her reported warning"
    gloss: "I remember! I told you back then that the train would be late."
    note: "*Powiedziałam, że pociąg się spóźni* -- the outcome's secondary reported-speech requirement, ONE line only. Future tense *spóźni* is retained (no backshift), the same rule established in b1_unit05 -- not re-taught here, only reused."
  pl.b1.unit19.teach.dialogue.line05:
    title: "Marek confirms and adds a detail"
    gloss: "Yes, and you were right -- we waited at the station twenty more minutes."
    note: "Closes the reported-speech aside and returns to the main narrative."
  pl.b1.unit19.teach.dialogue.line06:
    title: "Ewa closes with a silver lining"
    gloss: "At least you didn't get very wet."
    note: "A light closing remark, not a new narrative fact."

  pl.b1.unit19.lesson04.teach.review_note:
    title: "Three elements of a narrative"
    gloss: "Three elements of a narrative: 1) sequencing -- \"first...then...finally\", 2) background and mainline event -- \"podczas gdy\" + imperfective + perfective, 3) reported speech -- \"he/she said that...\" (the tense of the original statement stays unchanged)."
    note: "The full three-part contrast this unit's culminating exercise requires."

