  notes: >-
    Nineteenth en-pl B1 overlay, written for pl/b1_unit19_opowiadanie_o_
    przeszlosci.yaml (schema_version 1.1, §19 format from the start). No
    sibling-direction overlay exists yet, so §8 doesn't apply. This
    COMPLETES the canonical 19-outcome B1 tier's en-pl overlay set.

    Every note/feedback string mixing Polish text inline with English wraps
    the Polish in *asterisks* per §15. Every matching_pairs correct_response
    and word_order correct_response checked token-for-token against the
    realization's own pairs/word_bank. No stray YAML boolean coercion. The
    reported-speech line (lesson03.line04, Ewa's "że pociąg się spóźni")
    is glossed with an explicit no-backshift note pointing back to
    b1_unit05 rather than re-explaining the rule from scratch, consistent
    with keeping this unit's secondary reported-speech component genuinely
    secondary. Pending fresh-context review per AUTHORING_GUIDE §9; not
    self-certified.

answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully punctuated
    form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

