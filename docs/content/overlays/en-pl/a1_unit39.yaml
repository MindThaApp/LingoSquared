    gloss: 'At the language café in the library there is a fire. The staff member says: Go to the emergency exit! Nina needs help. Ewa is with Nina. Marek calls the fire brigade. Everyone is outside. That is good!'
    note: This text retells the fire scene in the present tense. *Idźcie* is the command for several people, and *przy Ninie* uses the locative after *przy* ('next to').
