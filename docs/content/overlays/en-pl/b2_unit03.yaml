review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for pl's third B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "actually" covers both *właściwie* (mild hedge) and can also
    imply contradiction, which Polish keeps apart -- glossed narrowly
    here as a softener; (2) Polish has no direct cleft equivalent to
    English "it is X that..." -- the taught frame "to właśnie X sprawia,
    że..." is a genuine but structurally different Polish focus device,
    flagged explicitly in lesson04 so learners don't try to word-for-word
    translate an English cleft; (3) "jak najbardziej" (most certainly) is
    an idiom, not compositional from "jak" + "najbardziej" in isolation --
    glossed as a fixed phrase; (4) stacking two degree adverbs before an
    adjective (naprawdę niesamowicie dobry) is natural Polish but has no
    single-word English equivalent, so the English gloss uses two adverbs
    too. No sibling-direction file (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    jak najbardziej -- 'Film jest jak najbardziej dobry' (unnatural
    collocation; jak najbardziej pairs with e.g. wart obejrzenia,
    sluszny, mozliwy) -> 'Film jest jak najbardziej wart obejrzenia' in
    teach.jak_najbardziej example and lesson04.exercise06 (tested_text,
    instruction, answers, feedback); (2) lesson05.exercise07 and
    lesson06.exercise04 -- instruction said 'wedlug mnie (opening)' but
    the key placed it after jest -> removed '(opening)' and added the
    sentence-initial variants 'Wedlug mnie film jest ...'; (3)
    lesson05.exercise01 -- distractor 'That the film is worth watching.'
    is also hedged in the text (Powiedzialbym, ze ...) -> 'That the film
    is too long.'; (4) English 'What is good, is the music.' (comma
    error) -> 'What is good is the music.' NATIVE CHECK: 'To, co dobre,
    to muzyka' register/naturalness; 'Wydaje sie, ze film odniosl
    sukces' glossed 'is a success'. Prior native-check priorities (moved
    here from required_next_reviewer): Native-Polish confirmation needed
    (DRAFT). Confirm the English glosses match idiomatic Polish, that
    every matching_pairs right-hand gloss discriminates its left on real
    meaning, and that the culminating writing/speaking answers
    (lesson06) accept the punctuation forms a correct learner would
    actually produce. See the realization file's review block for the
    full priority list.

course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: express nuance -- soften a statement with
    hedges (właściwie, dość, trochę, według mnie, wydaje się, że) or
    strengthen it with emphasis and focus devices (naprawdę, bardzo,
    niesamowicie, to właśnie ... sprawia, że, jak najbardziej), so the
    same content can be delivered tentatively, neutrally, or emphatically,
    around a shared opinion of a film.

units:
  pl.b2.unit03.niuanse:
    title: "Nuance"
    description: Express nuance -- soften or strengthen a statement so the same content can be delivered tentatively, neutrally, or emphatically.

lessons:
  pl.b2.unit03.lesson01.lagodzenie_opinii:
    title: "Softening an opinion"
  pl.b2.unit03.lesson02.ostrozne_sformulowania:
    title: "Tentative framing"
  pl.b2.unit03.lesson03.podkreslanie:
    title: "Emphasis"
  pl.b2.unit03.lesson04.podkreslanie_waznej_rzeczy:
    title: "Putting the focus on something"
  pl.b2.unit03.lesson05.recenzja:
    title: "A review"
  pl.b2.unit03.lesson06.niuanse_w_rozmowie:
    title: "Nuance in conversation"

teaching:
  pl.b2.unit03.lesson01.teach.film_jest_dobry:
    title: "The film is good."
    gloss: "The film is good."
    note: "The blunt, neutral base claim this whole unit softens or strengthens without ever changing."
  pl.b2.unit03.lesson01.teach.wlasciwie:
    title: actually
    gloss: actually
    note: "*Właściwie* is a mild softener, placed after the verb: *jest właściwie dobry*."
    example_gloss: "The film is actually good."
  pl.b2.unit03.lesson01.teach.dosc:
    title: "quite / fairly"
    gloss: "quite / fairly"
    example_gloss: "The film is quite good."
  pl.b2.unit03.lesson01.teach.troche:
    title: "a bit"
    gloss: "a bit / a little"
    example_gloss: "This film is a bit slow."
  pl.b2.unit03.lesson01.teach.powolny:
    title: slow
    gloss: slow
    note: "*Ten* ('this') is the demonstrative pronoun agreeing with masculine *film*."
    example_gloss: "This film is slow."
  pl.b2.unit03.lesson01.teach.raczej:
    title: rather
    gloss: rather
    example_gloss: "The film is rather slow."
  pl.b2.unit03.lesson01.teach.wedlug_mnie:
    title: "in my view"
    gloss: "in my view / to my mind"
    note: "*Według mnie* is a common way to hedge an opinion by openly marking it as your own view rather than a stated fact."
    example_gloss: "In my view the film is good."
  pl.b2.unit03.lesson01.teach.grammar_lagodzenie:
    title: "The film is good. The film is actually quite good, in my view."
    gloss: "The film is good. The film is actually quite good, in my view."
    note: "Hedging softens a claim without changing its content. *Właściwie*, *dość*, *trochę*, *raczej*, and *według mnie* can all combine on the same base statement."

  pl.b2.unit03.lesson02.teach.w_pewnym_sensie:
    title: "in a sense"
    gloss: "in a sense"
    note: "*W pewnym sensie* ('in a certain sense') hedges by admitting the claim is only partly true or true from one angle."
    example_gloss: "In a sense it is a comedy."
  pl.b2.unit03.lesson02.teach.wydaje_sie_ze:
    title: "it seems that..."
    gloss: "it seems that..."
    note: "*Wydaje się, że...* distances you from a flat assertion -- 'it seems that', not 'it is'."
    example_gloss: "It seems that the film is a success."
  pl.b2.unit03.lesson02.teach.powiedzialbym_ze:
    title: "I would say that..."
    gloss: "I would say that..."
    note: "*Powiedziałbym* is the conditional of *powiedzieć* ('to say') -- the same *by*-particle conditional pattern used for hedging a claim tentatively."
    example_gloss: "I would say that the film is good."
  pl.b2.unit03.lesson02.teach.zbyt:
    title: too
    gloss: "too (excessively)"
    example_gloss: "The film is too long."
  pl.b2.unit03.lesson02.teach.grammar_ostroznosc:
    title: "I would say that the film is good. It seems that the film is a success."
    gloss: "I would say that the film is good. It seems that the film is a success."
    note: "*Powiedziałbym, że* and *wydaje się, że* are more tentative than the lesson01 hedges -- they distance the speaker from a flat assertion rather than just softening its degree."

  pl.b2.unit03.lesson03.teach.naprawde:
    title: really
    gloss: really
    example_gloss: "The film is really good."
  pl.b2.unit03.lesson03.teach.bardzo:
    title: very
    gloss: very
    example_gloss: "The film is very good."
  pl.b2.unit03.lesson03.teach.niesamowicie:
    title: incredibly
    gloss: incredibly
    example_gloss: "The film is incredibly gripping."
  pl.b2.unit03.lesson03.teach.absolutnie:
    title: absolutely
    gloss: absolutely
    note: "*Wart obejrzenia* ('worth of-watching') uses the genitive *obejrzenia* after *wart* ('worth')."
    example_gloss: "The film is absolutely worth watching."
  pl.b2.unit03.lesson03.teach.zdecydowanie:
    title: definitely
    gloss: definitely
    example_gloss: "The film is definitely worth watching."
  pl.b2.unit03.lesson03.teach.naprawde_niesamowicie:
    title: "really incredibly"
    gloss: "really incredibly (stacked emphasis)"
    example_gloss: "The film is really incredibly good."
  pl.b2.unit03.lesson03.teach.grammar_podkreslanie:
    title: "The film is good. The film is really incredibly good."
    gloss: "The film is good. The film is really incredibly good."
    note: "Emphasis strengthens a claim without changing its content. Two degree adverbs can stack (*naprawdę niesamowicie*), raising the speaker's commitment even further."

  pl.b2.unit03.lesson04.teach.to_wlasnie_sprawia_ze:
    title: "it's precisely ... that makes..."
    gloss: "it's precisely ... that makes / causes..."
    note: "Polish has no direct cleft like English 'it is X that...'. *To właśnie X sprawia, że...* ('it's precisely X that causes...') is Polish's own genuine focus device for singling something out as the cause."
    example_gloss: "It's precisely the music that makes the film good."
  pl.b2.unit03.lesson04.teach.to_co_to:
    title: "what ... is, is ..."
    gloss: "what ... is, is ... (pseudo-cleft)"
    note: "*To, co dobre, to muzyka* ('that which [is] good, [that] is the music') puts focus on *muzyka* by fronting the description first."
    example_gloss: "What is good is the music."
  pl.b2.unit03.lesson04.teach.problem:
    title: problem
    gloss: problem
    example_gloss: "That's precisely the problem."
  pl.b2.unit03.lesson04.teach.jak_najbardziej:
    title: "most certainly"
    gloss: "most certainly / absolutely (insistent confirmation)"
    note: "*Jak najbardziej* is a fixed idiom used to insist emphatically that something IS the case, often answering doubt."
    example_gloss: "The film is most certainly worth watching."
  pl.b2.unit03.lesson04.teach.grammar_focus:
    title: "The music makes the film good. It's precisely the music that makes the film good."
    gloss: "The music makes the film good. It's precisely the music that makes the film good."
    note: "Focus constructions single out ONE element as the important one, without changing the underlying claim. *To właśnie ... sprawia, że*, the pseudo-cleft *to, co ... to ...*, and *jak najbardziej* are this unit's three focus devices."

  pl.b2.unit03.lesson05.teach.tekst:
    title: "Reading: a film review"
    gloss: "The new film is, in my view, a bit predictable. The beginning is fairly slow. But the music is really incredibly beautiful. It's precisely the music that saves this film. I would say that the film is worth watching."
    glosses:
      Nowy: new
      przewidywalny: predictable
      Początek: beginning
      piękna: "beautiful (feminine, agreeing with muzyka)"
      ratuje: "saves (from ratować)"

  pl.b2.unit03.lesson06.teach.co_sadzisz_o_filmie:
    title: "What do you think of the film?"
    gloss: "What do you think of the film?"
    note: "*Sądzić o czymś* ('to think about something') governs the locative case: *o filmie*."
  pl.b2.unit03.lesson06.teach.fabula:
    title: "the plot / story"
    gloss: "the plot / the story"
    example_gloss: "The plot is interesting."
  pl.b2.unit03.lesson06.teach.przewidywalna:
    title: predictable
    gloss: "predictable (feminine form, agreeing with fabuła)"
    example_gloss: "The plot is predictable."
  pl.b2.unit03.lesson06.teach.tak:
    title: "Yes"
    gloss: "Yes"
    example_gloss: "Yes, that's true."
  pl.b2.unit03.lesson06.teach.zakonczenie:
    title: "the ending"
    gloss: "the ending"
    example_gloss: "The ending is interesting."
  pl.b2.unit03.lesson06.teach.dialogue_ewa_ask:
    title: "Ewa: What do you think of the film?"
    gloss: "Ewa: What do you think of the film?"
  pl.b2.unit03.lesson06.teach.dialogue_marek_hedge:
    title: "Marek: The plot is actually quite predictable, in my view."
    gloss: "Marek: The plot is actually quite predictable, in my view."
  pl.b2.unit03.lesson06.teach.dialogue_ewa_emphasis:
    title: "Ewa: Yes, but the music is really incredibly beautiful!"
    gloss: "Ewa: Yes, but the music is really incredibly beautiful!"
  pl.b2.unit03.lesson06.teach.dialogue_marek_focus:
    title: "Marek: That's true. It's precisely the music that saves this film."
    gloss: "Marek: That's true. It's precisely the music that saves this film."
  pl.b2.unit03.lesson06.teach.dialogue_ewa_hedge:
    title: "Ewa: I would say it's worth watching."
    gloss: "Ewa: I would say it's worth watching."
  pl.b2.unit03.lesson06.teach.dialogue_marek_absolutnie:
    title: "Marek: Definitely!"
    gloss: "Marek: Definitely!"
  pl.b2.unit03.lesson06.teach.grammar_niuanse:
    title: "The film is good. The film is, in my view, actually quite good. The film is really incredibly good."
    gloss: "The film is good. The film is, in my view, actually quite good. The film is really incredibly good."
    note: "The same base claim, delivered three ways: neutral, hedged, and emphatic -- exactly what the speaking and writing tasks of this lesson require."

exercises:
  pl.b2.unit03.lesson01.exercise01.recognize_wlasciwie:
    instruction: "What does this word mean?"
    correct_option: actually
    distractors: [very, rather, "in a sense"]
    accepted_answers: [{value: actually, status: correct}]
    feedback: "Właściwie means actually -- a mild hedge."
  pl.b2.unit03.lesson01.exercise02.listen_wlasciwie_dosc:
    instruction: "Listen and select what you hear."
    correct_option: "The film is actually quite good."
    distractors: ["The film is very good.", "The film is actually quite slow.", "The film is quite good."]
    accepted_answers: [{value: "The film is actually quite good.", status: correct}]
    feedback: "Film jest właściwie dość dobry means the film is actually quite good."
  pl.b2.unit03.lesson01.exercise03.match_hedges:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {właściwie: actually, dość: "quite / fairly", trochę: "a bit", raczej: rather, "według mnie": "in my view", powolny: slow}
        status: correct
    feedback: "These are this lesson's hedging words."
  pl.b2.unit03.lesson01.exercise04.order_wlasciwie_dosc:
    instruction: "Put the words in order: The film is actually quite good."
    accepted_answers:
      - {value: "Film jest właściwie dość dobry", status: correct}
    feedback: "Film jest właściwie dość dobry means the film is actually quite good."
  pl.b2.unit03.lesson01.exercise05.translate_wedlug_mnie:
    instruction: "Translate into Polish, opening with według mnie: In my view the film is good."
    accepted_answers:
      - {value: "Według mnie film jest dobry", status: correct}
    feedback: "Według mnie film jest dobry means in my view the film is good."
  pl.b2.unit03.lesson01.exercise06.write_soften:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is good. Hedge it using właściwie and dość (both before 'dobry'): The film is actually quite good."
    accepted_answers:
      - {value: "Film jest właściwie dość dobry", status: correct}
      - {value: "Film jest właściwie dość dobry.", status: correct}
    feedback: "Film jest właściwie dość dobry means the film is actually quite good."
  pl.b2.unit03.lesson01.exercise07.speak_troche_powolny:
    instruction: "Say aloud in Polish, using trochę: This film is a bit slow."
    accepted_answers:
      - {value: "Ten film jest trochę powolny", status: correct}
    feedback: "Ten film jest trochę powolny means this film is a bit slow."
  pl.b2.unit03.lesson01.exercise08.dictation_wlasciwie_dosc:
    instruction: "Type what you hear."
    correct_response: "Film jest właściwie dość dobry."
    orthography_strict: true
    feedback: "You heard Film jest właściwie dość dobry — the film is actually quite good."

  pl.b2.unit03.lesson02.exercise01.recognize_w_pewnym_sensie:
    instruction: "What does this phrase mean?"
    correct_option: "in a sense"
    distractors: ["it seems that", "too much", definitely]
    accepted_answers: [{value: "in a sense", status: correct}]
    feedback: "W pewnym sensie means in a sense."
  pl.b2.unit03.lesson02.exercise02.listen_powiedzialbym:
    instruction: "Listen and select what you hear."
    correct_option: "I would say that the film is good."
    distractors: ["I know that the film is good.", "It seems that the film is good.", "I would say that the film is a success."]
    accepted_answers: [{value: "I would say that the film is good.", status: correct}]
    feedback: "Powiedziałbym, że film jest dobry means I would say that the film is good."
  pl.b2.unit03.lesson02.exercise03.match_tentative:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"w pewnym sensie": "in a sense", "wydaje się, że...": "it seems that...", "powiedziałbym, że...": "I would say that...", zbyt: too, komedia: comedy, sukces: success}
        status: correct
    feedback: "These are this lesson's tentative-framing words."
  pl.b2.unit03.lesson02.exercise04.order_odniosl_sukces:
    instruction: "Put the words in order: The film was a success."
    accepted_answers:
      - {value: "Film odniósł sukces", status: correct}
    feedback: "Film odniósł sukces means the film was a success."
  pl.b2.unit03.lesson02.exercise05.translate_wydaje_sie:
    instruction: "Translate into Polish, using wydaje się, że: It seems that the film is a success."
    accepted_answers:
      - {value: "Wydaje się, że film odniósł sukces", status: correct}
      - {value: "Wydaje się, że film odniósł sukces.", status: correct}
    feedback: "Wydaje się, że film odniósł sukces means it seems that the film is a success."
  pl.b2.unit03.lesson02.exercise06.write_hedge_success:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is a success. Hedge it by opening with wydaje się, że: It seems that the film is a success."
    accepted_answers:
      - {value: "Wydaje się, że film odniósł sukces", status: correct}
      - {value: "Wydaje się, że film odniósł sukces.", status: correct}
    feedback: "Wydaje się, że film odniósł sukces means it seems that the film is a success."
  pl.b2.unit03.lesson02.exercise07.speak_w_pewnym_sensie:
    instruction: "Say aloud in Polish, opening with w pewnym sensie: In a sense it is a comedy."
    accepted_answers:
      - {value: "W pewnym sensie to komedia", status: correct}
    feedback: "W pewnym sensie to komedia means in a sense it is a comedy."

  pl.b2.unit03.lesson03.exercise01.recognize_niesamowicie:
    instruction: "What does this word mean?"
    correct_option: incredibly
    distractors: [rather, "a bit", "in a sense"]
    accepted_answers: [{value: incredibly, status: correct}]
    feedback: "Niesamowicie means incredibly -- a strong emphasis word."
  pl.b2.unit03.lesson03.exercise02.listen_naprawde_niesamowicie:
    instruction: "Listen and select what you hear."
    correct_option: "The film is really incredibly good."
    distractors: ["The film is quite good.", "The film is really quite good.", "The film is incredibly slow."]
    accepted_answers: [{value: "The film is really incredibly good.", status: correct}]
    feedback: "Film jest naprawdę niesamowicie dobry means the film is really incredibly good."
  pl.b2.unit03.lesson03.exercise03.match_emphasis:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {naprawdę: really, bardzo: very, niesamowicie: incredibly, absolutnie: absolutely, zdecydowanie: definitely, wciągający: gripping, "wart obejrzenia": "worth watching"}
        status: correct
    feedback: "These are this lesson's emphasis words."
  pl.b2.unit03.lesson03.exercise04.order_naprawde_niesamowicie:
    instruction: "Put the words in order: The film is really incredibly good."
    accepted_answers:
      - {value: "Film jest naprawdę niesamowicie dobry", status: correct}
    feedback: "Film jest naprawdę niesamowicie dobry means the film is really incredibly good."
  pl.b2.unit03.lesson03.exercise05.translate_absolutnie:
    instruction: "Translate into Polish, using absolutnie: The film is absolutely worth watching."
    accepted_answers:
      - {value: "Film jest absolutnie wart obejrzenia", status: correct}
    feedback: "Film jest absolutnie wart obejrzenia means the film is absolutely worth watching."
  pl.b2.unit03.lesson03.exercise06.write_emphasize:
    instruction: "Strengthen this weak statement into an emphatic one. Weak: The film is good. Emphasize it using naprawdę and niesamowicie (both before 'dobry'): The film is really incredibly good."
    accepted_answers:
      - {value: "Film jest naprawdę niesamowicie dobry", status: correct}
      - {value: "Film jest naprawdę niesamowicie dobry.", status: correct}
    feedback: "Film jest naprawdę niesamowicie dobry means the film is really incredibly good."
  pl.b2.unit03.lesson03.exercise07.speak_bardzo:
    instruction: "Say aloud in Polish, emphasizing with bardzo: The film is very good."
    accepted_answers:
      - {value: "Film jest bardzo dobry", status: correct}
    feedback: "Film jest bardzo dobry means the film is very good."
  pl.b2.unit03.lesson03.exercise08.dictation_naprawde_niesamowicie:
    instruction: "Type what you hear."
    correct_response: "Film jest naprawdę niesamowicie dobry."
    orthography_strict: true
    feedback: "You heard Film jest naprawdę niesamowicie dobry — the film is really incredibly good."

  pl.b2.unit03.lesson04.exercise01.recognize_jak_najbardziej:
    instruction: "What does this phrase mean?"
    correct_option: "most certainly"
    distractors: [rather, "a bit", "it seems that"]
    accepted_answers: [{value: "most certainly", status: correct}]
    feedback: "Jak najbardziej means most certainly -- an insistent confirmation."
  pl.b2.unit03.lesson04.exercise02.listen_to_wlasnie_muzyka:
    instruction: "Listen and select what you hear."
    correct_option: "It's precisely the music that makes the film good."
    distractors: ["The music makes the film good.", "It's precisely the plot that makes the film good.", "It's precisely the music that makes the film bad."]
    accepted_answers: [{value: "It's precisely the music that makes the film good.", status: correct}]
    feedback: "To właśnie muzyka sprawia, że film jest dobry means it's precisely the music that makes the film good."
  pl.b2.unit03.lesson04.exercise03.match_focus:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"to właśnie ... sprawia, że...": "it's precisely ... that makes...", "to, co ... to ...": "what ... is, is ...", właśnie: precisely, "jak najbardziej": "most certainly", muzyka: music, problem: problem}
        status: correct
    feedback: "These are this lesson's focus words."
  pl.b2.unit03.lesson04.exercise04.order_to_jest_wlasnie_problem:
    instruction: "Put the words in order: That's precisely the problem."
    accepted_answers:
      - {value: "To jest właśnie problem", status: correct}
    feedback: "To jest właśnie problem means that's precisely the problem."
  pl.b2.unit03.lesson04.exercise05.translate_pseudo_cleft:
    instruction: "Translate into Polish, using the focus frame to, co ... to ...: What is good is the music."
    accepted_answers:
      - {value: "To, co dobre, to muzyka", status: correct}
    feedback: "To, co dobre, to muzyka means what is good is the music."
  pl.b2.unit03.lesson04.exercise06.write_jak_najbardziej:
    instruction: "Someone doubts the film is worth watching. Insist it is, using jak najbardziej (before 'wart obejrzenia'): The film is most certainly worth watching."
    accepted_answers:
      - {value: "Film jest jak najbardziej wart obejrzenia", status: correct}
      - {value: "Film jest jak najbardziej wart obejrzenia.", status: correct}
    feedback: "Film jest jak najbardziej wart obejrzenia means the film is most certainly worth watching."
  pl.b2.unit03.lesson04.exercise07.speak_cleft:
    instruction: "Say aloud in Polish, using the focus frame to właśnie ... sprawia, że to put focus on the music: It's precisely the music that makes the film good."
    accepted_answers:
      - {value: "To właśnie muzyka sprawia, że film jest dobry", status: correct}
    feedback: "To właśnie muzyka sprawia, że film jest dobry means it's precisely the music that makes the film good."

  pl.b2.unit03.lesson05.exercise01.read_hedge:
    instruction: "Which opinion does the writer HEDGE -- present tentatively rather than assert flatly?"
    correct_option: "That the film is predictable."
    distractors: ["That the film is a success.", "That the music is beautiful.", "That the film is too long."]
    accepted_answers: [{value: "That the film is predictable.", status: correct}]
    feedback: "The writer hedges: Nowy film jest według mnie trochę przewidywalny (the new film is, in my view, a bit predictable)."
  pl.b2.unit03.lesson05.exercise02.read_hedge_words:
    instruction: "Which words mark the writer's hedge about the film being predictable?"
    correct_option: "według mnie and trochę"
    distractors: ["naprawdę and niesamowicie", "to właśnie", "jak najbardziej"]
    accepted_answers: [{value: "według mnie and trochę", status: correct}]
    feedback: "Według mnie ('in my view') and trochę ('a bit') both soften the claim."
  pl.b2.unit03.lesson05.exercise03.read_emphasis:
    instruction: "Which claim does the writer state most emphatically?"
    correct_option: "That the music is beautiful."
    distractors: ["That the beginning is slow.", "That the film is predictable.", "That the film is a success."]
    accepted_answers: [{value: "That the music is beautiful.", status: correct}]
    feedback: "The writer states emphatically: muzyka jest naprawdę niesamowicie piękna (the music is really incredibly beautiful)."
  pl.b2.unit03.lesson05.exercise04.read_focus:
    instruction: "The writer uses the focus construction 'To właśnie muzyka ratuje ten film.' What does it single out?"
    correct_option: "The music, as the one thing that saves the film."
    distractors: ["The plot.", "The beginning.", "The ending."]
    accepted_answers: [{value: "The music, as the one thing that saves the film.", status: correct}]
    feedback: "To właśnie muzyka ratuje ten film singles out the music as precisely what saves the film."
  pl.b2.unit03.lesson05.exercise05.match_reading:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {nowy: new, początek: beginning, piękna: beautiful, ratuje: saves, przewidywalny: predictable, "wart obejrzenia": "worth watching"}
        status: correct
    feedback: "These are the reading's key words."
  pl.b2.unit03.lesson05.exercise06.translate_poczatek:
    instruction: "Translate into Polish, using dość: The beginning is fairly slow."
    accepted_answers:
      - {value: "Początek jest dość powolny", status: correct}
    feedback: "Początek jest dość powolny means the beginning is fairly slow."
  pl.b2.unit03.lesson05.exercise07.write_hedge_predictable:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The film is predictable. Hedge it using według mnie and trochę: The film is, in my view, a bit predictable."
    accepted_answers:
      - {value: "Film jest według mnie trochę przewidywalny", status: correct}
      - {value: "Film jest według mnie trochę przewidywalny.", status: correct}
      - {value: "Według mnie film jest trochę przewidywalny", status: correct}
    feedback: "Film jest według mnie trochę przewidywalny means the film is, in my view, a bit predictable."

  pl.b2.unit03.lesson06.exercise01.classify_hedge:
    instruction: "Marek says the story is 'właściwie dość przewidywalna, według mnie'. Is he hedging, stating it neutrally, or emphasizing -- and what does that say about his commitment?"
    correct_option: "He is hedging -- he lowers his commitment to the claim."
    distractors: ["He is stating it neutrally, with no stance marked.", "He is emphasizing -- he raises his commitment.", "He is denying the claim entirely."]
    accepted_answers: [{value: "He is hedging -- he lowers his commitment to the claim.", status: correct}]
    feedback: "Właściwie dość ... według mnie together mark a hedge -- Marek presents this tentatively, not flatly."
  pl.b2.unit03.lesson06.exercise02.classify_emphasis:
    instruction: "How does Ewa present her claim about the music ('muzyka jest naprawdę niesamowicie piękna')?"
    correct_option: "Emphatically -- she raises her commitment with two stacked intensifiers."
    distractors: ["Tentatively, hedging her opinion.", "Neutrally, with no stance marked.", "As a question, unsure of her own view."]
    accepted_answers: [{value: "Emphatically -- she raises her commitment with two stacked intensifiers.", status: correct}]
    feedback: "Naprawdę niesamowicie stacks two emphasis words, raising Ewa's commitment to the claim."
  pl.b2.unit03.lesson06.exercise03.classify_focus:
    instruction: "What does Marek do with 'To właśnie muzyka ratuje ten film.'?"
    correct_option: "He singles out the music as precisely what saves the film."
    distractors: ["He hedges his opinion about the music.", "He denies that the music is good.", "He changes the subject to the plot."]
    accepted_answers: [{value: "He singles out the music as precisely what saves the film.", status: correct}]
    feedback: "The focus construction to właśnie ... ratuje picks the music out as THE thing that saves the film."
  pl.b2.unit03.lesson06.exercise04.speak_same_hedged:
    instruction: "Deliver the claim 'The film is good' as a HEDGE that lowers your commitment. Use według mnie, then właściwie dość: The film is, in my view, actually quite good."
    accepted_answers:
      - {value: "Film jest według mnie właściwie dość dobry", status: correct}
      - {value: "Według mnie film jest właściwie dość dobry", status: correct}
    feedback: "Film jest według mnie właściwie dość dobry means the film is, in my view, actually quite good."
  pl.b2.unit03.lesson06.exercise05.speak_same_emphatic:
    instruction: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using naprawdę niesamowicie: The film is really incredibly good."
    accepted_answers:
      - {value: "Film jest naprawdę niesamowicie dobry", status: correct}
    feedback: "Film jest naprawdę niesamowicie dobry means the film is really incredibly good."
  pl.b2.unit03.lesson06.exercise06.write_both_ways:
    instruction: "Write the SAME claim about the ending TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using trochę: The ending is a bit predictable. (2) EMPHATIC, raising commitment, using naprawdę bardzo: The ending is really very predictable."
    accepted_answers:
      - {value: "Zakończenie jest trochę przewidywalne. Zakończenie jest naprawdę bardzo przewidywalne", status: correct}
      - {value: "Zakończenie jest trochę przewidywalne. Zakończenie jest naprawdę bardzo przewidywalne.", status: correct}
    feedback: "Zakończenie jest trochę przewidywalne. Zakończenie jest naprawdę bardzo przewidywalne -- the same claim, hedged then emphasized."
  pl.b2.unit03.lesson06.exercise07.respond_emphatic:
    instruction: "Co sądzisz o muzyce?"
    correct_option: "The music is really incredibly beautiful."
    distractors: ["The music is a bit predictable.", "I don't really have an opinion.", "The music is not very good."]
    accepted_answers: [{value: "The music is really incredibly beautiful.", status: correct}]
    feedback: "Muzyka jest naprawdę niesamowicie piękna means the music is really incredibly beautiful -- an emphatic, committed answer."
