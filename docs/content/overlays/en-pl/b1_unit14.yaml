answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully punctuated
    form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit14.zgoda_i_sprzeciw:
    title: "Agreement and disagreement"

lessons:
  pl.b1.unit14.lesson01.nie_zgadzam_sie:
    title: "Nie zgadzam się z tym, że... (I disagree with that...)"
  pl.b1.unit14.lesson02.zgadzam_sie:
    title: "Zgadzam się z tym, że... (I agree with that...)"
  pl.b1.unit14.lesson03.dyskusja_przy_kawie:
    title: "A discussion over coffee"
  pl.b1.unit14.lesson04.moja_opinia:
    title: "My opinion"

teaching:
  pl.b1.unit14.lesson01.teach.media_marnuja_czas:
    title: "Social media wastes time"
    gloss: "Social media wastes time."
    note: "The opinion this lesson's disagreement responds to."
    example_gloss: "I think that social media wastes time."

  pl.b1.unit14.lesson01.teach.nie_zgadzam_sie_z_tym:
    title: "I disagree with that, because thanks to it I stay in touch with friends"
    gloss: "I disagree with the claim that social media wastes time, because thanks to it I stay in touch with friends."
    note: "*z tym, że...* reports the other person's claim; *bo* introduces your own reason."
    example_gloss: "I disagree with that, because thanks to social media I stay in touch with friends."

  pl.b1.unit14.lesson01.teach.zgadzam_note:
    title: "(Nie) zgadzam się z tym, że... + bo"
    gloss: "\"(Nie) zgadzam się z tym, że...\" + bo -- \"z tym, że...\" reports/references the OTHER person's statement, and \"bo\" introduces YOUR OWN reason."
    note: "The core construction of this unit: agreement/disagreement grounded in a that-clause plus a reason."

  pl.b1.unit14.lesson02.teach.lepiej_gotowac_w_domu:
    title: "It's better to cook at home than to eat out"
    gloss: "It's better to cook at home than to eat out."
    note: "The opinion this lesson's agreement responds to."
    example_gloss: "I think that it's better to cook at home than to eat out."

  pl.b1.unit14.lesson02.teach.zgadzam_sie_z_tym:
    title: "I agree with that, because eating out is expensive"
    gloss: "I agree with the claim that it's better to cook at home, because eating out is expensive."
    note: "Same construction as the disagreement form, now in the affirmative -- *zgadzam się* (no *nie*)."
    example_gloss: "I agree with that, because eating out is really expensive."

  pl.b1.unit14.lesson02.teach.naprawde_note:
    title: "Same construction, without 'nie'"
    gloss: "The same construction as \"nie zgadzam się\", just without \"nie\": \"zgadzam się z tym, że...\" + bo -- your own reason."
    note: "Confirms agreement and disagreement share one construction, differing only by the negation."

  pl.b1.unit14.teach.dialogue.line01:
    title: "Marek states his opinion on social media"
    gloss: "I think that social media wastes time."
    note: "Opens the debate exchange this lesson's exercises test."
  pl.b1.unit14.teach.dialogue.line02:
    title: "Ewa disagrees, with a reason"
    gloss: "I disagree with the claim that social media wastes time, because thanks to it I stay in touch with friends."
    note: "*nie zgadzam się z tym, że* + *bo* -- disagreement grounded in a reason."
  pl.b1.unit14.teach.dialogue.line03:
    title: "Marek concedes the point but restates his concern"
    gloss: "I understand your point of view, but I spend too much time there."
    note: "A concession-plus-restatement, not a new claim contradicting his first line."
  pl.b1.unit14.teach.dialogue.line04:
    title: "Ewa shifts to a new topic and agrees on it"
    gloss: "It's true that one needs to be careful. But I agree with the claim that it's better to cook at home than to eat out, because eating out is expensive."
    note: "*zgadzam się z tym, że* + *bo* -- agreement grounded in a reason, on a fresh topic."
  pl.b1.unit14.teach.dialogue.line05:
    title: "Marek agrees"
    gloss: "I agree with that!"
    note: "A short affirmative closing the exchange."

  pl.b1.unit14.lesson04.teach.review_note:
    title: "The agree/disagree construction, reviewed"
    gloss: "\"(Nie) zgadzam się z tym, że...\" + bo -- \"z tym, że...\" references the other person's opinion, \"bo\" gives YOUR reason."
    note: "The full construction this unit's culminating exercise requires."

