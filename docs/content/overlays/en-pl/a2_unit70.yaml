teaching:
  pl.a2.unit70.lesson01.teach.przelozyc_odwolac:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Przełożyć wizytę* means to move it to another time. *Odwołać* means to cancel it completely. Both verbs are perfective.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  pl.a2.unit70.lesson01.teach.niestety_przepraszam:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Niestety* is a polite way to give bad news. *Przepraszam* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  pl.a2.unit70.lesson01.teach.salon_fryzjerski:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Salon fryzjerski* is the place; *fryzjer* (man) or *fryzjerka* (woman) is the person. People often say *iść do fryzjera* for both.'
    example_gloss: The salon is open from nine to six.
  pl.a2.unit70.lesson01.teach.czy_moge_przelozyc:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question can start with *czy*: *Czy mogę ...?* The infinitive *przełożyć* follows *mogę*.'
  pl.a2.unit70.lesson01.teach.nie_moge_niestety:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  pl.a2.unit70.lesson01.teach.w_czwartek_nie:
    title: Mogę + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *mogę* (''I can'') the second verb is an infinitive: *Nie mogę przyjść*. *Nie* goes directly before *mogę*. A time word can open the sentence: *W czwartek nie mogę przyjść*. In a question, use *czy*: *Czy mogę przełożyć wizytę?*'
  pl.a2.unit70.lesson02.teach.inny_dzien:
    title: Another day
    gloss: another day
    note: '*Inny dzień* is masculine; after *w* the locative is *w innym dniu*.'
    example_gloss: Can it also be on another day?
  pl.a2.unit70.lesson02.teach.czy_moze_byc:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: For a day of the week Polish uses *w* (*w poniedziałek*, *we wtorek*), where English says 'on'.
  pl.a2.unit70.lesson02.teach.czy_piatek_panu:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Odpowiadać* (''to suit'') takes the person in the dative: *panu* = ''suits you''. The thing that suits is the subject: *piątek odpowiada*. *Pan* is the polite ''you'' for a man (*pani* for a woman).'
  pl.a2.unit70.lesson02.teach.tak_to_mi:
    title: Saying yes
    gloss: Yes, that suits me well.
  pl.a2.unit70.lesson02.teach.niestety_nie:
    title: Saying no politely
    gloss: Unfortunately not.
  pl.a2.unit70.lesson02.teach.czy_piatek_panu_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: 'To ask whether a time suits someone, use *odpowiadać* and the dative: *Czy piątek panu odpowiada?* A polite yes is *Tak, to mi odpowiada*. A polite refusal is *Nie, niestety nie*.'
  pl.a2.unit70.lesson03.teach.bo_przykro_mi:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Bo* joins two full sentences and gives the reason. *Przykro mi* (''I am sorry'') is a more careful apology than *przepraszam*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  pl.a2.unit70.lesson03.teach.klopot:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Przepraszam za kłopot* is a polite phrase after you have caused someone extra trouble. After *za* the accusative is used.'
    example_gloss: Sorry for the inconvenience.
  pl.a2.unit70.lesson03.teach.nie_moge_przyjsc:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  pl.a2.unit70.lesson03.teach.nie_moge_przyjsc_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  pl.a2.unit70.lesson03.teach.nie_moge_przyjsc_3:
    title: 'Because: bo'
    gloss: I cannot come, because I am ill.
    note: 'After *bo* the word order stays ordinary. Always put a comma before *bo*: *Nie mogę przyjść, bo jestem chory.* In more formal writing *ponieważ* also works.'
  pl.a2.unit70.lesson04.teach.umowic_sie_wczesniej:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Umówić się* is to agree on a time or place together. *Wcześniej* means ''earlier'', here ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  pl.a2.unit70.lesson04.teach.w_poniedzialek_o:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  pl.a2.unit70.lesson04.teach.czy_moze_pan:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Czy może pan ...?* is the polite way to ask a man to do something; to a woman, say *Czy może pani ...?* The infinitive *przyjść* is at the end.'
  pl.a2.unit70.lesson04.teach.w_takim_razie:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  pl.a2.unit70.lesson04.teach.wtedy_umowie_nowa:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  pl.a2.unit70.lesson04.teach.w_poniedzialek_o_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: Give the day with *w* (*w poniedziałek*) and the clock time with *o* + the ordinal in the locative (*o dziesiątej*). In a polite question use *Czy może pan ...?* and put the infinitive at the end.
  pl.a2.unit70.lesson05.teach.szanowny_panie_marku:
    title: A message from the salon
    gloss: Dear Marek, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this time not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Nowak hairdresser's
    note: This is a typical short message from a business, so it uses the polite *pan* (here *Pana wizyta*, 'your appointment'). *Została przełożona* means 'has been moved' (feminine, agreeing with *wizyta*).
    glosses:
      szanowny: dear
      marku: Marek
      pana: your (formal)
      wizyta: appointment
      przełożona: moved
      nowa: new
      poniedziałek: Monday
      dziesiątej: ten (tenth)
      godzinie: hour (o godzinie = at)
      odpowiada: suits (odpowiada)
      ten: this
      nie: not
      czy: (starts a yes/no question)
      zadzwonić: call
      nas: us
      wtedy: then
      wcześniej: in advance
      umówimy: we will arrange
      proszę: please
      zobaczenia: see you (do zobaczenia)
      salon: hairdresser's
      nowak: Nowak
  pl.a2.unit70.lesson06.teach.salon_fryzjerski_nowak:
    title: The salon answers
    gloss: 'Hairdresser: Nowak hairdresser''s, good afternoon.'
  pl.a2.unit70.lesson06.teach.dzien_dobry_mowi:
    title: Marek explains and asks
    gloss: 'Marek: Good afternoon, you are speaking to Marek. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  pl.a2.unit70.lesson06.teach.oczywiscie_czy_piatek:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  pl.a2.unit70.lesson06.teach.niestety_nie_bo:
    title: Marek suggests Monday
    gloss: 'Marek: Unfortunately not, because I have to work. Can it also be Monday?'
  pl.a2.unit70.lesson06.teach.w_poniedzialek_o:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  pl.a2.unit70.lesson06.teach.to_mi_odpowiada:
    title: Marek accepts and apologises
    gloss: 'Marek: That suits me well. Thank you very much and sorry for the inconvenience.'
  pl.a2.unit70.lesson06.teach.nie_ma_problemu:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
