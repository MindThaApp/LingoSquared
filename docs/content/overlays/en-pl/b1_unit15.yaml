teaching:
  pl.b1.unit15.lesson01.teach.odpowiadam_za_dokumentacje:
    title: "I'm responsible for the technical documentation"
    gloss: "I'm responsible for the technical documentation."
    note: "*Odpowiadam za* + accusative -- states an ongoing job responsibility."
    example_gloss: "On this project I'm responsible for the technical documentation."

  pl.b1.unit15.lesson01.teach.odpowiadam_note:
    title: "Odpowiadam za + accusative"
    gloss: "\"Odpowiadam za\" + accusative -- describes YOUR ongoing responsibility at work, not a one-time task."
    note: "The core responsibility-stating construction this unit opens with."

  pl.b1.unit15.lesson01.teach.za_co_pan_odpowiada:
    title: "What are you responsible for on this project?"
    gloss: "What are you (formal, to a man) responsible for on this project?"
    note: "The formal question form, asking a colleague about his responsibility."
    example_gloss: "Excuse me, what are you responsible for on this project?"

  pl.b1.unit15.lesson01.teach.raport_sprzedazy:
    title: "The sales report"
    gloss: "the sales report"
    note: "A concrete deliverable used in this unit's status-update examples."

  pl.b1.unit15.lesson02.teach.skonczylem_raport:
    title: "I finished the sales report"
    gloss: "I finished the sales report."
    note: "*Skończyłem* + accusative -- the \"complete\" status, masculine (Marek)."
    example_gloss: "I just finished the sales report."

  pl.b1.unit15.lesson02.teach.dokumentacja_opozniona:
    title: "The documentation is unfortunately delayed"
    gloss: "The documentation is unfortunately delayed."
    note: "*jest opóźniona* -- the \"delayed\" status, agreeing with the feminine noun *dokumentacja*."
    example_gloss: "The technical documentation is unfortunately delayed by two days."

  pl.b1.unit15.lesson02.teach.jestem_w_trakcie:
    title: "I'm in the process of translating the documents"
    gloss: "I'm in the process of translating the documents."
    note: "*jestem w trakcie* + genitive -- the \"in progress\" status."
    example_gloss: "I'm currently in the process of translating the documents."

  pl.b1.unit15.lesson02.teach.status_note:
    title: "Three task statuses"
    gloss: "Three task statuses: \"skończyłem\" + accusative (done), \"jestem w trakcie\" + genitive (in progress), \"jest opóźniony/opóźniona\" (delayed)."
    note: "The three-way status contrast for work updates."

  pl.b1.unit15.teach.dialogue.line01:
    title: "The manager asks about the project status"
    gloss: "Mr. Marek, what's the status of the project?"
    note: "Opens the status-update exchange this lesson's exercises test."
  pl.b1.unit15.teach.dialogue.line02:
    title: "Marek describes his responsibility and reports completion"
    gloss: "Ma'am, I'm responsible for the technical documentation. I already finished the sales report."
    note: "Combines the responsibility statement with a \"complete\" status update."
  pl.b1.unit15.teach.dialogue.line03:
    title: "The manager asks about the documentation"
    gloss: "Great. And the technical documentation?"
    note: "A follow-up question, not a new fact to contradict."
  pl.b1.unit15.teach.dialogue.line04:
    title: "Marek reports a delay"
    gloss: "The documentation is unfortunately delayed -- I need two more days."
    note: "*jest opóźniona* -- the \"delayed\" status, with a concrete timeframe."
  pl.b1.unit15.teach.dialogue.line05:
    title: "Marek asks a colleague for help"
    gloss: "Mr. Piotr, could you help me with translating the documentation?"
    note: "*czy mógłby mi pan pomóc* -- the formal help-request frame, addressed to a peer colleague per this office's professional register."
  pl.b1.unit15.teach.dialogue.line06:
    title: "Piotr agrees to help"
    gloss: "Of course, I'll gladly help you."
    note: "Closes the exchange -- the colleague agrees to help."

  pl.b1.unit15.lesson04.teach.review_note:
    title: "Three parts of this topic"
    gloss: "Three parts of this topic: 1) describe a responsibility (\"odpowiadam za...\"), 2) give a task status (\"skończyłem\"/\"jestem w trakcie\"/\"jest opóźniony\"), 3) ask a colleague for help (\"czy mógłby mi pan/mogłaby mi pani pomóc z...\")."
    note: "The full three-part contrast this unit's culminating exercise requires."

