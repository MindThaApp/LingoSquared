  pl.a1.unit28.lesson04.teach.jezdzic_narzednik_jezdze:
    title: Jeździć takes the instrumental
    gloss: 'With transport, Polish puts the vehicle in the instrumental: *jeżdżę rowerem*, *jeżdżę samochodem*, *jadę pociągiem*.'
    note: 'The vehicle is in the instrumental (''by bike'') and the verb is conjugated normally: *jeżdżę*, *jeździsz*, *jeździ*.'
