teaching:
  pl.a2.unit78.lesson01.teach.dni: {"title": "Days of the week", "gloss": "Monday / Tuesday / Wednesday / Thursday / Friday / Saturday / Sunday", "note": "These are the seven days. To say 'on' a day, use *w* and a slightly changed form.", "example_gloss": ["On Saturday I can come.", "On Sunday I can't.", "On Wednesday I can.", "On Monday I can't.", "On Friday I can come."]}
  pl.a2.unit78.lesson01.teach.gn_dni: {"title": "On a day: w + accusative", "gloss": "on Monday, on Tuesday, on Wednesday, on Thursday, on Friday, on Saturday, on Sunday", "note": "After *w* the days ending in -a change: *środa* becomes *środę*, *sobota* becomes *sobotę*, *niedziela* becomes *niedzielę*. The others stay the same. Before *wtorek* the preposition is *we*."}
  pl.a2.unit78.lesson01.teach.gn_moc: {"title": "Móc: present tense", "gloss": "I can, you can, he can, she can, we can, they can", "note": "*Móc* means 'to be able to' because of the situation, for example when you are free. It is followed by an infinitive."}
  pl.a2.unit78.lesson01.teach.pytania: {"title": "Asking and answering", "gloss": "when / question word for yes-no questions / to come / yes / no", "note": "*Kiedy* asks about time. *Czy* opens a yes-no question. The infinitive *przyjść* stays unchanged after *móc*.", "example_gloss": ["When can you come?", "Can you come on Friday?", "Yes, I can.", "No, I can't.", "Ewa can come on Wednesday.", "Marek can come on Friday."]}
  pl.a2.unit78.lesson01.teach.frazy: {"title": "Three sentences", "gloss": "When can you? On Saturday I can. On Sunday I can't."}
  pl.a2.unit78.lesson02.teach.umiejetnosci: {"title": "Skills", "gloss": "to swim / to cook / to dance / to sing / to draw", "note": "These infinitives name skills. After *umieć* the verb stays in the infinitive.", "example_gloss": ["I can swim.", "Marek can cook.", "I can't dance.", "Ewa can sing.", "Ewa can't draw."]}
  pl.a2.unit78.lesson02.teach.gn_umiec: {"title": "Umieć: present tense", "gloss": "I can, you can, he can, she can, we can, they can", "note": "*Umieć* means 'to know how to': a skill you have learned. It is followed by an infinitive."}
  pl.a2.unit78.lesson02.teach.gn_potrafic: {"title": "Potrafić: present tense", "gloss": "I am able to, you are able to, he is able to, she is able to, we are able to, they are able to", "note": "*Potrafić* is close in meaning to *umieć*. Both are followed by an infinitive."}
  pl.a2.unit78.lesson02.teach.pytanie: {"title": "Do you know how?", "gloss": "Can you swim? Yes, I can. No, I can't.", "note": "In a short answer the infinitive can be left out: *Tak, umiem.*", "example_gloss": ["Can you cook?", "Yes, I can.", "No, I can't.", "I am able to sing."]}
  pl.a2.unit78.lesson03.teach.przyczyny: {"title": "Why not?", "gloss": "today / because / but", "note": "*Bo* gives the reason. *Ale* joins two sentences that contrast.", "example_gloss": ["Today I can't, because I have work.", "I can swim, but today I can't.", "Today I can come."]}
  pl.a2.unit78.lesson03.teach.mam: {"title": "Having work or a lesson", "gloss": "I have / he or she has / work / a lesson", "note": "Work and a lesson are reasons why you cannot do something: they belong to *móc*.", "example_gloss": ["I have work.", "Ewa has a lesson.", "Marek has work.", "On Saturday I can't come, because I have a lesson."]}
  pl.a2.unit78.lesson03.teach.gn_contrast: {"title": "Móc or umieć?", "gloss": "I can't, because I have work. I don't know how to dance.", "note": "Use *móc* when the situation allows or prevents something: time, work, a plan. Use *umieć* for a skill you have learned. You can swim but still not be able to come today."}
  pl.a2.unit78.lesson03.teach.zdanie: {"title": "A sentence with both", "gloss": "I can swim, but today I can't."}
  pl.a2.unit78.lesson04.teach.mozliwosc: {"title": "Maybe and might", "gloss": "tomorrow / to rain / I will come / he or she will come / to be", "note": "*Może* before a verb means 'maybe' or 'might'. It is the same word as 'he can', but here no one is the subject.", "example_gloss": ["Tomorrow it might rain.", "Maybe I will come on Saturday.", "Maybe Ewa will come on Friday.", "Maybe."]}
  pl.a2.unit78.lesson04.teach.gn_moze: {"title": "Może: maybe", "gloss": "Tomorrow it might rain. Maybe I will come on Saturday. Perhaps Ewa will come on Friday.", "note": "*Może* with a verb expresses a possibility. *Być może* means 'perhaps'."}
  pl.a2.unit78.lesson04.teach.gn_pytania: {"title": "Asking about days and skills", "gloss": "When can you? Tomorrow I can. Can you swim? Yes, I can. No, I can't.", "note": "Ask *Kiedy możesz?* about availability and *Czy umiesz...?* about a skill. Answer with a day or with *Tak, umiem* / *Nie, nie umiem*."}
  pl.a2.unit78.lesson04.teach.frazy_moze: {"title": "Three sentences", "gloss": "It might rain. Maybe I will come. Perhaps."}
  pl.a2.unit78.lesson05.teach.slowa: {"title": "Small words", "gloss": "hi / also, too / and", "note": "*Też* usually comes after the day or the subject; *i* joins two verbs.", "example_gloss": ["Hi, Ewa.", "On Wednesday I can too.", "I can cook and swim."]}
  pl.a2.unit78.lesson05.teach.lektura: {"title": "Marek writes to Ewa", "gloss": "Hi, Ewa. I can cook and swim, but I can't dance. On Monday I can't, because I have work. On Wednesday I can, on Friday I can too. On Saturday I can come. On Sunday I can't.", "note": "Notice how Marek separates skills (*umiem*) from days when he is free (*mogę*).", "glosses": {"cześć": "hi", "też": "also, too", "pracę": "work"}}
  pl.a2.unit78.lesson05.teach.zapamietaj: {"title": "Remember", "gloss": "I can cook. I can't dance. On Friday I can."}
  pl.a2.unit78.lesson06.teach.d1: {"title": "Ewa asks", "gloss": "Ewa: Hi, Marek. When can you come?"}
  pl.a2.unit78.lesson06.teach.d2: {"title": "Marek answers", "gloss": "Marek: On Saturday I can, but on Sunday I can't."}
  pl.a2.unit78.lesson06.teach.d3: {"title": "Ewa suggests Friday", "gloss": "Ewa: On Saturday I can't, because I have a lesson. Can you on Friday?"}
  pl.a2.unit78.lesson06.teach.d4: {"title": "Marek agrees", "gloss": "Marek: Yes, on Friday I can come. I can cook."}
  pl.a2.unit78.lesson06.teach.d5: {"title": "Ewa mentions a skill", "gloss": "Ewa: Great! I can't cook, but I can dance."}
  pl.a2.unit78.lesson06.teach.d6: {"title": "Marek ends", "gloss": "Marek: Good. I will come on Friday, but I can't dance."}
