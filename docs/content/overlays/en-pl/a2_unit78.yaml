course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit78.umiem_i_moge: {"title": "What I Can Do", "description": "Say what you can and cannot do and what might happen, and describe your availability on different days of the week."}
