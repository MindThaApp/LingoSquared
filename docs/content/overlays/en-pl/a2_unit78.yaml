answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
