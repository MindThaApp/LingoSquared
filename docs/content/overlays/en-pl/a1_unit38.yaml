  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: The Lubię construction
    gloss: '*Lubię* + season says which season you like: *Lubię lato.* The season is in the accusative: *wiosnę*, *zimę*.'
    note: '*Lubię* (''I like'') takes the accusative: feminine nouns in *-a* change to *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), while *jesień* and *lato* (a noun in *-o*) look the same. To say what you think of a season, use *Uważam* + accusative + *za* + adjective: *Uważam jesień za ładną*.'
