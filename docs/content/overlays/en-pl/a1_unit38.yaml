  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: A conversation about seasons
    gloss: 'It is now spring. The tulips are beautiful. Nina asks: Which season do you find beautiful? Marek says: I like summer. In summer we swim. Ewa says: I like winter. In winter we skate.'
    note: Recaps lesson04's language café conversation via direct-quote narration, mirroring the household/neighborhood/post/cooking/personality/colors units' own comparison-reading shape.
    glosses:
      wiosna: spring
      Tulipany: tulips
      ładne: beautiful
      pyta: asks
      porę: season
      uważasz: think / find
      mówi: says
      lato: summer
      Lubię: nice / fun
      pływamy: swim
      zimę: winter
      łyżwach: ice-skate
  pl.a1.unit38.lesson05.teach.rozmowa_o_porach:
    title: The conversation is fun
    gloss: The conversation about the seasons is fun.
  pl.a1.unit38.lesson06.teach.tomek_czesc_wszystkim:
