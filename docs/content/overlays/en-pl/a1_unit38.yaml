    gloss: 'Ewa: I like winter. In winter we skate.'
  pl.a1.unit38.lesson06.teach.tomek_uwazam_jesien:
    title: Tomek answers
    gloss: 'Tomek: I find fall beautiful. Fall is calm.'
  pl.a1.unit38.lesson06.teach.marek_cztery_pory:
