teaching:
  pl.a2.unit66.lesson01.teach.grafik:
    title: The schedule
    gloss: the schedule/timetable
    note: '*Grafik* (schedule, rota) is a masculine noun, used for a work or class timetable.'
    example_gloss: I check my schedule every week.
  pl.a2.unit66.lesson01.teach.w_poniedzialek_pracuje:
    title: Naming two different days' activities
    gloss: On Monday I work, and on Wednesday I have a course.
    note: '*W* + accusative gives the day: *w poniedziałek* (on Monday), *w środę* (on Wednesday). Before a word that starts with *w*, *w* becomes *we*: *we wtorek*.'
  pl.a2.unit66.lesson01.teach.co_zwykle_robisz:
    title: Asking what someone usually does during the week
    gloss: What do you usually do during the week?
    note: '*W tygodniu* (during the week, literally "in the week") refers to the weekdays as a group, in contrast to *w weekend*.'
  pl.a2.unit66.lesson02.teach.kolejnosc:
    title: The order/sequence
    gloss: the order/sequence
    note: '*Kolejność* (order, sequence) is a feminine noun, used for the order in which things happen.'
    example_gloss: The order of my day is always the same.
  pl.a2.unit66.lesson02.teach.najpierw_pracuje_potem:
    title: Sequencing with najpierw and potem
    gloss: First I work, then I go exercise.
    note: '*Najpierw* (first) and *potem* (then, after that) are the two most common sequencing words in Polish. They can be joined with *a*: *Najpierw pracuję, a potem idę ćwiczyć.*'
  pl.a2.unit66.lesson02.teach.na_koncu_gotuje:
    title: Sequencing with na końcu
    gloss: Finally I cook something for dinner.
    note: '*Na końcu* (finally, at the end) closes a sequence started with *najpierw* and continued with *potem*.'
  pl.a2.unit66.lesson03.teach.dzien_powszedni:
    title: The weekday
    gloss: the weekday
    note: '*Dzień powszedni* (weekday) is a masculine noun phrase, contrasted with *weekend*. *Dni robocze* is also used for working days.'
    example_gloss: On a weekday I get up early.
  pl.a2.unit66.lesson03.teach.w_tygodniu_wstaje:
    title: Contrasting weekdays and the weekend
    gloss: During the week I get up early, but on the weekend I sleep in.
    note: '*Spać długo* (literally "to sleep long") is the Polish way to say you sleep in. *Wstawać* (to get up) is imperfective, because it is a daily habit: *wstaję*.'
  pl.a2.unit66.lesson03.teach.jaka_jest_roznica:
    title: Asking about the difference
    gloss: What's the difference between your weekdays and the weekend?
    note: '*Różnica między ... a ...* (the difference between ... and ...) is the standard comparison frame. The two things are linked with *a*, and both are in the instrumental after *między*: *między dniami powszednimi a weekendem*.'
  pl.a2.unit66.lesson04.teach.kalendarz:
    title: The schedule/planner
    gloss: the schedule/planner
    note: '*Kalendarz* (calendar, planner) is a masculine noun, used for a personal planner or a calendar of appointments.'
    example_gloss: My schedule is completely full this week.
  pl.a2.unit66.lesson04.teach.w_tym_tygodniu:
    title: Saying your schedule is completely full
    gloss: My schedule is completely full this week.
    note: '*Pełny* (full) describes a calendar crammed with appointments. *Mieć pełny kalendarz* is the usual way to say you are fully booked.'
  pl.a2.unit66.lesson04.teach.w_tym_tygodniu_2:
    title: Saying you have no free evening
    gloss: I have no free evening this week.
    note: 'After a negated verb the object is in the genitive: *nie mam wolnego wieczoru*. *Wolny* (free) agrees with the masculine *wieczór*.'
  pl.a2.unit66.lesson04.teach.w_przyszlym_tygodniu:
    title: Looking ahead to next week
    gloss: Next week I'll have more time.
    note: '*W przyszłym tygodniu* (next week) contrasts with *w tym tygodniu* (this week), used earlier in this lesson. Both use *w* + locative.'
  pl.a2.unit66.lesson05.teach.tydzien_niny_wyglada:
    title: Reading about Nina's busy week
    gloss: Nina's week looks busy. On Monday and Tuesday she works at the library. On Wednesday evening she has a language course. On Thursday she exercises with friends, and on Friday she cooks for her family. On the weekend she rests and reads a book.
    note: '*Wyglądać na* + adjective (to look, to seem) describes how something appears: *wygląda na pracowity*. Days use *w* (*we* before *wtorek*).'
    glosses:
      wygląda: looks, appears (3rd person singular of wyglądać)
      pracowity: busy
      na: part of wyglądać na (= looks like)
      poniedziałek: Monday
      wtorek: Tuesday
      pracuje: works (3rd person singular of pracować)
      bibliotece: library
      środę: Wednesday evening
      ma: has (3rd person singular of mieć)
      kurs: language course
      czwartek: Thursday
      ćwiczy: exercises (3rd person singular of ćwiczyć)
      przyjaciółmi: friends
      piątek: Friday
      gotuje: cooks (3rd person singular of gotować)
      swojej: her
      rodziny: family
      weekend: weekend
      odpoczywa: rests (3rd person singular of odpoczywać)
      czyta: reads (3rd person singular of czytać)
      książkę: book
  pl.a2.unit66.lesson06.teach.jak_wyglada_twoj:
    title: Ewa asks about Marek's week
    gloss: 'Ewa: What does your week look like, Marek?'
  pl.a2.unit66.lesson06.teach.dosc_pracowicie_najpierw:
    title: Marek describes his work schedule
    gloss: 'Marek: Pretty busy. First I work from Monday to Thursday, then I have Friday off.'
  pl.a2.unit66.lesson06.teach.co_robisz_w:
    title: Ewa asks about his day off
    gloss: 'Ewa: What do you do on your day off?'
  pl.a2.unit66.lesson06.teach.w_piatki_zwykle:
    title: Marek describes Friday
    gloss: 'Marek: On Fridays I usually exercise, and in the evening I cook something tasty.'
  pl.a2.unit66.lesson06.teach.a_w_weekend:
    title: Ewa asks about the weekend
    gloss: 'Ewa: And on the weekend?'
  pl.a2.unit66.lesson06.teach.w_weekend_odpoczywam:
    title: Marek describes the weekend
    gloss: 'Marek: On the weekend I rest. During the week I just don''t have time.'
  pl.a2.unit66.lesson06.teach.najpierw_pracuje_potem:
    title: 'Third person: najpierw, potem, na końcu'
    gloss: She works first. Then she exercises. Finally she rests.
    note: 'The same sequencing words work with a third-person subject. Only the verb ending changes: *pracuję* becomes *pracuje*, *ćwiczę* becomes *ćwiczy*, *odpoczywam* becomes *odpoczywa*. Polish drops the pronoun *ona* (she) unless you want to stress it.'
