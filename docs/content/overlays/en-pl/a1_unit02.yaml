answer_policy:
  diacritics: >-
    Same standing policy as unit01: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form remains
    the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (pan/pani vs ty) rather than written punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit02.numbers:
    title: "Liczby"

lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: "Liczby od zera do dziesięciu"
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: "Liczby od jedenastu do stu i ceny"
  pl.a1.unit02.lesson03.phone_and_age:
    title: "Numer telefonu i wiek"

teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: "Zero"
    gloss: "zero"
    note: "The starting point for every number that follows in this unit."
    example_gloss: "Today it's zero degrees."

  pl.a1.unit02.lesson01.teach.jeden:
    title: "One"
    gloss: "one"
    note: >-
      *Jeden* takes a normal singular noun after it, unlike every other
      number in this lesson.
    example_gloss: "I have one phone."

  pl.a1.unit02.lesson01.teach.dwa:
    title: "Two"
    gloss: "two"
    note: >-
      *Dwa*, *trzy*, and *cztery* take a special plural noun form (like
      *psy*, "dogs") -- different from the plural form used after *pięć*
      and up.
    example_gloss: "I have two dogs."

  pl.a1.unit02.lesson01.teach.trzy:
    title: "Three"
    gloss: "three"
    note: "Same plural pattern as *dwa*: *trzy złote* (three złoty), not *trzy złotych*."
    example_gloss: "Coffee costs three złoty."

  pl.a1.unit02.lesson01.teach.cztery:
    title: "Four"
    gloss: "four"
    note: "The last of the three numbers (*dwa*, *trzy*, *cztery*) that share this plural pattern."
    example_gloss: "I have four books."

  pl.a1.unit02.lesson01.teach.piec:
    title: "Five"
    gloss: "five"
    note: >-
      From *pięć* onward, numbers take a different plural noun form (the
      genitive plural, e.g. *minut* rather than *minuty*) -- you'll see
      this pattern continue through the rest of this unit.
    example_gloss: "I have five minutes."

  pl.a1.unit02.lesson01.teach.szesc:
    title: "Six"
    gloss: "six"
    note: "Same genitive-plural pattern as *pięć*: *sześć jabłek* (six apples)."
    example_gloss: "I have six apples."

  pl.a1.unit02.lesson01.teach.siedem:
    title: "Seven"
    gloss: "seven"
    note: "A useful number to know for talking about the days of the week."
    example_gloss: "There are seven days in a week."

  pl.a1.unit02.lesson01.teach.osiem:
    title: "Eight"
    gloss: "eight"
    note: >-
      *Mam osiem lat* literally means "I have eight years" -- Polish
      states age with *mieć* ("to have"), not "to be," the way English
      does. You'll practice this pattern fully in lesson 3.
    example_gloss: "I am eight years old."

  pl.a1.unit02.lesson01.teach.dziewiec:
    title: "Nine"
    gloss: "nine"
    note: "Genitive plural again: *dziewięć osób* (nine people)."
    example_gloss: "Nine people are waiting in line."

  pl.a1.unit02.lesson01.teach.dziesiec:
    title: "Ten"
    gloss: "ten"
    note: "The last of the single-digit numbers -- lesson 2 continues into the teens and tens."
    example_gloss: "I have ten fingers."

  pl.a1.unit02.lesson02.teach.jedenascie:
    title: "Eleven"
    gloss: "eleven"
    note: >-
      Numbers 11-19 end in *-naście*, similar to English "-teen" (13-19).
      Like *pięć* and up, they take the genitive plural: *jedenaście
      osób*.
    example_gloss: "The class has eleven people."

  pl.a1.unit02.lesson02.teach.dwanascie:
    title: "Twelve"
    gloss: "twelve"
    note: "Same *-naście* pattern as *jedenaście*."
    example_gloss: "There are twelve months in a year."

  pl.a1.unit02.lesson02.teach.pietnascie:
    title: "Fifteen"
    gloss: "fifteen"
    note: "Still the *-naście* teens pattern: *piętnaście minut* (fifteen minutes)."
    example_gloss: "I have a fifteen-minute break."

  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: "Twenty"
    gloss: "twenty"
    note: >-
      Numbers 20-40 end in *-dzieści* -- a different pattern from the
      *-naście* teens. *Dwadzieścia* itself still takes the genitive
      plural (*dwadzieścia lat*), but watch lesson 3 for what happens once
      you add a unit digit on top of it.
    example_gloss: "I am twenty years old."

  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: "Twenty-one"
    gloss: "twenty-one"
    note: >-
      Compound numbers are built the same way as English: the ten, then
      the unit, no linking word needed.

  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: "Thirty"
    gloss: "thirty"
    note: "Still the *-dzieści* pattern seen with *dwadzieścia*."
    example_gloss: "The ticket costs thirty złoty."

  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: "Fifty"
    gloss: "fifty"
    note: >-
      Numbers 50-90 switch to a third pattern, *-dziesiąt*, instead of
      *-dzieści*.
    example_gloss: "I have fifty złoty."

  pl.a1.unit02.lesson02.teach.sto:
    title: "One hundred"
    gloss: "one hundred"
    note: "A clean round number with no compound ending to worry about."
    example_gloss: "That costs one hundred złoty."

  pl.a1.unit02.lesson02.teach.ile:
    title: "How much / how many"
    gloss: "how much; how many"
    note: "The question word for asking about any quantity or price."
    example_gloss: "How much does this cost?"

  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: "Asking a price"
    gloss: "How much does this cost?"
    note: >-
      *Kosztować* ("to cost") is the verb; *to* ("this/it") is the
      subject. The whole question is a fixed, very common pattern.

  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: "Stating a price"
    gloss: "This costs twenty złoty."
    note: >-
      *Złotych* is the genitive plural of *złoty* (the Polish currency) --
      the same plural pattern *dwadzieścia* itself already takes.

  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: "Ask a phone number, to a man"
    gloss: "What's your phone number? (to a man, formal)"
    note: >-
      Literally "what is the gentleman's phone number." Adapted from the
      real FSI Polish course, which uses the bare fragment *Pana/pani
      numer?* when routing a long-distance call -- expanded here into a
      full question for everyday personal use.

  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: "Ask a phone number, to a woman"
    gloss: "What's your phone number? (to a woman, formal)"
    note: "Swap *pana* for *pani* to address a woman formally, same as unit 1's pattern."

  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: "Ask a phone number, informally"
    gloss: "What's your phone number? (informal)"
    note: >-
      *Twój* (your, informal) replaces *pana*/*pani* when speaking with a
      friend or peer.

  pl.a1.unit02.lesson03.teach.numer_to:
    title: "Giving a number, lead-in"
    gloss: "The number is..."
    note: >-
      A short, natural lead-in before reading out the digits one at a
      time -- the normal way Polish speakers give a phone number aloud.

  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: "A sample phone number"
    gloss: "Six, one, five, zero, two."
    note: >-
      Polish phone numbers are read digit by digit, just like English --
      every digit here reuses a number already taught in this unit.

  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: "Ask someone's age, informally"
    gloss: "How old are you? (informal)"
    note: >-
      Literally "how many years do you have" -- Polish states age with
      *mieć* ("to have"), the same pattern previewed on the *osiem* card
      in lesson 1. Freshly authored: the FSI source course never asks age
      this way, only by birthday date.

  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: "Ask someone's age, formally"
    gloss: "How old are you? (to a man, formal)"
    note: >-
      *Ma* is the same third-person verb form already seen with *pan
      jest*/*pan ma* in unit 1 -- *pan* grammatically behaves as "the
      gentleman," a third-person subject.

  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: "State your age"
    gloss: "I am twenty-eight years old."
    note: >-
      *Mam* is the first-person form of *mieć* ("to have"). *Dwadzieścia
      osiem* ends in *osiem* (eight), so like every number ending in
      5-9, it takes *lat* -- watch lesson 3's dialogue for a number that
      ends differently.

  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: "Ewa asks for Marek's number"
    gloss: "Ewa asks Marek for his phone number, formally."
    note: "Reuses this lesson's formal phone-number question exactly."
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: "Marek gives his number"
    gloss: "Marek reads out his phone number, digit by digit."
    note: "Every digit here was already taught in lessons 1-2 of this unit."
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: "Ewa asks Marek's age"
    gloss: "Ewa thanks him and asks his age, formally."
    note: >-
      *Dziękuję* ("thank you") and *A* ("and") don't change with
      register, same as unit 1's *dziękuję* card.
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: "Marek gives his age and returns the question"
    gloss: "Marek says he's twenty-eight and asks Ewa's age back, formally."
    note: "*A pani?* returns the question formally to a woman, the same short pattern unit 1 taught for *A pan?*."
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: "Ewa gives her age"
    gloss: "Ewa says she is thirty-two."
    note: >-
      *Trzydzieści dwa* ends in *dwa* (two), so unlike *dwadzieścia
      osiem* (which ends in eight and takes *lat*), this number takes
      *lata* instead -- numbers ending in 2, 3, or 4 (except the teens)
      use this different plural form. A genuine, real grammar nuance:
      *lat* and *lata* are not interchangeable, and which one is correct
      depends on the last digit of the number.
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: "Marek closes the conversation"
    gloss: "Marek says it was nice talking with her, and says goodbye."
    note: "*Do zobaczenia* reuses unit 1's see-you farewell."

exercises:
  pl.a1.unit02.lesson01.exercise01.select_dwa:
    instruction: "Which word means the number 2?"
    correct_option: "dwa"
    distractors: ["jeden", "trzy"]
    accepted_answers: ["dwa"]

  pl.a1.unit02.lesson01.exercise02.select_siedem:
    instruction: "Which word means the number 7?"
    correct_option: "siedem"
    distractors: ["sześć", "osiem"]
    accepted_answers: ["siedem"]

  pl.a1.unit02.lesson01.exercise03.select_dziesiec:
    instruction: "Which word means the number 10?"
    correct_option: "dziesięć"
    distractors: ["dziewięć", "jeden"]
    accepted_answers: ["dziesięć"]

  pl.a1.unit02.lesson01.exercise04.match_digits_zero_to_ten:
    instruction: "Match each Polish number word to its digit."
    correct_response:
      "zero": "0"
      "jeden": "1"
      "dwa": "2"
      "trzy": "3"
      "cztery": "4"
      "pięć": "5"
      "sześć": "6"
      "siedem": "7"
      "osiem": "8"
      "dziewięć": "9"
      "dziesięć": "10"

  pl.a1.unit02.lesson01.exercise05.order_count_to_three:
    instruction: "Put the numbers in order: one, two, three."
    correct_response: ["jeden", "dwa", "trzy"]

  pl.a1.unit02.lesson01.exercise06.order_count_four_to_six:
    instruction: "Put the numbers in order: four, five, six."
    correct_response: ["cztery", "pięć", "sześć"]

  pl.a1.unit02.lesson01.exercise07.order_count_eight_to_ten:
    instruction: "Put the numbers in order: eight, nine, ten."
    correct_response: ["osiem", "dziewięć", "dziesięć"]

  pl.a1.unit02.lesson01.exercise08.fill_week_days:
    instruction: "Complete the true statement about the days in a week."
    accepted_answers: ["siedem"]
    feedback: "Siedem -- there are seven days in a week."

  pl.a1.unit02.lesson01.exercise09.speak_count_to_ten:
    instruction: "Count out loud from zero to ten in Polish."
    accepted_answers:
      - "Zero, jeden, dwa, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć, dziesięć."
      - "zero jeden dwa trzy cztery pięć sześć siedem osiem dziewięć dziesięć"

  pl.a1.unit02.lesson02.exercise01.select_dwadziescia:
    instruction: "Which word means the number 20?"
    correct_option: "dwadzieścia"
    distractors: ["dwanaście", "trzydzieści"]
    accepted_answers: ["dwadzieścia"]

  pl.a1.unit02.lesson02.exercise02.select_sto:
    instruction: "Which word means the number 100?"
    correct_option: "sto"
    distractors: ["dziesięć", "pięćdziesiąt"]
    accepted_answers: ["sto"]

  pl.a1.unit02.lesson02.exercise03.match_teens_and_tens:
    instruction: "Match each Polish number word to its digit."
    correct_response:
      "jedenaście": "11"
      "dwanaście": "12"
      "piętnaście": "15"
      "dwadzieścia": "20"
      "trzydzieści": "30"
      "pięćdziesiąt": "50"
      "sto": "100"

  pl.a1.unit02.lesson02.exercise04.order_twenty_one:
    instruction: "Build the number 21."
    correct_response: ["dwadzieścia", "jeden"]

  pl.a1.unit02.lesson02.exercise05.order_cost_question:
    instruction: "Put the price question in order."
    correct_response: ["Ile", "to", "kosztuje"]

  pl.a1.unit02.lesson02.exercise06.fill_ticket_price:
    instruction: "Complete the ticket's price, in words."
    accepted_answers: ["trzydzieści"]
    feedback: "Bilet kosztuje trzydzieści złotych -- the ticket costs thirty złoty."

  pl.a1.unit02.lesson02.exercise07.fix_cost_question_order:
    instruction: "Fix the word order of this price question."
    accepted_answers:
      - "Ile to kosztuje?"
      - "Ile to kosztuje"
    feedback: "Ile to kosztuje? -- the question word Ile comes first."

  pl.a1.unit02.lesson02.exercise08.reply_price_hundred:
    instruction: "Answer that it costs one hundred złoty."
    accepted_answers:
      - "To kosztuje sto złotych."
      - "To kosztuje sto złotych"

  pl.a1.unit02.lesson02.exercise09.speak_ticket_price:
    instruction: "Say how much the ticket costs."
    accepted_answers:
      - "Bilet kosztuje trzydzieści złotych."
      - "Bilet kosztuje trzydzieści złotych"

  pl.a1.unit02.lesson03.exercise01.select_formal_phone_question_man:
    instruction: "Which question formally asks a man for his phone number?"
    correct_option: "Jaki jest pana numer telefonu?"
    distractors: ["Jaki jest twój numer telefonu?", "Ile pan ma lat?"]
    accepted_answers: ["Jaki jest pana numer telefonu?", "Jaki jest pana numer telefonu"]

  pl.a1.unit02.lesson03.exercise02.select_informal_phone_question:
    instruction: "Which question informally asks a friend for their phone number?"
    correct_option: "Jaki jest twój numer telefonu?"
    distractors: ["Jaki jest pana numer telefonu?", "Ile masz lat?"]
    accepted_answers: ["Jaki jest twój numer telefonu?", "Jaki jest twój numer telefonu"]

  pl.a1.unit02.lesson03.exercise03.comprehend_marek_number:
    instruction: "Read the line. What is Marek's phone number?"
    correct_option: "6, 1, 5, 0, 2"
    distractors:
      - "6, 1, 5, 0, 8"
      - "5, 1, 6, 0, 2"
    accepted_answers:
      - "6, 1, 5, 0, 2"
      - "sześć jeden pięć zero dwa"

  pl.a1.unit02.lesson03.exercise04.comprehend_marek_age:
    instruction: "Read the line. How old is Marek?"
    correct_option: "28"
    distractors:
      - "82"
      - "38"
    accepted_answers:
      - "28"
      - "dwadzieścia osiem"

  pl.a1.unit02.lesson03.exercise05.match_questions_and_answers:
    instruction: "Match each question with its natural answer."
    correct_response:
      "Jaki jest pana numer telefonu?": "Numer to sześć, jeden, pięć, zero, dwa."
      "Jaki jest twój numer telefonu?": "Numer to..."
      "Ile masz lat?": "Mam dwadzieścia osiem lat."
      "Ile pan ma lat?": "Mam trzydzieści dwa lata."
      "Ile to kosztuje?": "To kosztuje sto złotych."
      "Miło było porozmawiać.": "Do zobaczenia!"

  pl.a1.unit02.lesson03.exercise06.order_thirty_two:
    instruction: "Build the number 32."
    correct_response: ["trzydzieści", "dwa"]

  pl.a1.unit02.lesson03.exercise07.fill_marek_age:
    instruction: "Complete Marek's age, in words, based on the dialogue."
    accepted_answers: ["dwadzieścia osiem"]
    feedback: "Marek ma dwadzieścia osiem lat -- Marek is twenty-eight years old."

  pl.a1.unit02.lesson03.exercise08.check_lat_lata_agreement:
    instruction: "Correct the sentence -- dwa needs a different plural ending than the one shown."
    accepted_answers:
      - "Mam dwa lata."
      - "Mam dwa lata"
    feedback: "Numbers ending in 2, 3, or 4 (except the teens) take lata, not lat: Mam dwa lata."

  pl.a1.unit02.lesson03.exercise09.reply_own_number:
    instruction: "Answer with the lead-in for giving your own phone number."
    accepted_answers:
      - "Numer to..."
      - "Numer to"

  pl.a1.unit02.lesson03.exercise10.write_ewa_age:
    instruction: "Write how old Ewa is, based on the dialogue."
    accepted_answers:
      - "trzydzieści dwa lata"
      - "Trzydzieści dwa lata."

  pl.a1.unit02.lesson03.exercise11.perform_marek_reply:
    instruction: "Take Marek's role and give his phone number out loud."
    accepted_answers:
      - "Numer to sześć, jeden, pięć, zero, dwa."
      - "sześć jeden pięć zero dwa"
