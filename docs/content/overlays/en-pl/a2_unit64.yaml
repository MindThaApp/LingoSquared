teaching:
  pl.a2.unit64.lesson01.teach.opoznienie:
    title: The delay
    gloss: the delay
    note: '*Opóźnienie* is a neuter noun (*to opóźnienie*); its genitive is *opóźnienia*.'
    example_gloss: There's a delay of ten minutes.
  pl.a2.unit64.lesson01.teach.moj_pociag_ma:
    title: Reporting your train is delayed
    gloss: My train is delayed.
    note: '*Mieć opóźnienie* (literally "to have a delay") is the standard way to say a train or bus is running late.'
  pl.a2.unit64.lesson01.teach.jaki_jest_powod:
    title: Asking the reason for a delay
    gloss: What's the reason for the delay?
    note: '*Powód* (reason) is a masculine noun. What the reason is about goes into the genitive: *powód opóźnienia* (the reason for the delay).'
  pl.a2.unit64.lesson02.teach.awaria_sygnalizacji:
    title: The signal failure
    gloss: the signal failure
    note: '*Awaria sygnalizacji* is the standard railway term for a fault in the signalling system. *Awaria* is feminine; *sygnalizacji* is the genitive and says what failed.'
    example_gloss: My train is cancelled because of a signal failure.
  pl.a2.unit64.lesson02.teach.moj_pociag_zostal:
    title: Reporting your train is cancelled
    gloss: My train is cancelled because of a signal failure.
    note: '*Został odwołany* (literally "was cancelled") is the passive: *zostać* plus a participle that agrees with the noun (*pociąg został odwołany*, *podróż została odwołana*). *Z powodu* + genitive means "because of".'
  pl.a2.unit64.lesson02.teach.kiedy_odjezdza_nastepny:
    title: Asking when the next train leaves
    gloss: When does the next train leave?
    note: '*Odjeżdżać* (to depart) is the verb for trains and buses leaving a station. *Następny* (next) agrees with the masculine noun *pociąg*.'
  pl.a2.unit64.lesson03.teach.przesiadka:
    title: The connection
    gloss: the connection
    note: '*Przesiadka* (a connection, a change of trains) is a feminine noun. After *na* it takes the accusative: *na przesiadkę*.'
    example_gloss: I'm missing my connection in Warsaw.
  pl.a2.unit64.lesson03.teach.przez_opoznienie_nie:
    title: Reporting a missed connection
    gloss: I'm missing my connection because of the delay.
    note: '*Nie zdążyć na* + accusative means "to fail to make it in time for" something, which is how Polish says you are missing a connection. *Zdążę* is a future form, so *nie zdążę* = "I won''t make it".'
  pl.a2.unit64.lesson03.teach.czy_moge_pojechac:
    title: Asking about taking another train
    gloss: Can I take another train?
    note: 'After *jechać / pojechać* (to travel) you name the vehicle in the instrumental: *pojechać innym pociągiem* (to take another train). *Inny* (another) agrees with *pociąg*.'
  pl.a2.unit64.lesson04.teach.punkt_obslugi:
    title: The service desk
    gloss: the service desk
    note: '*Punkt obsługi* (service desk) is a masculine noun phrase. After *do* it takes the genitive: *do punktu obsługi*.'
    example_gloss: I'm going to the service desk for help.
  pl.a2.unit64.lesson04.teach.czy_moze_mi:
    title: Asking for help with an alternative
    gloss: Can you help me with an alternative connection?
    note: '*Czy może mi pan pomóc ...?* is the polite way to ask a man for help (say *pani* to a woman). *Pomóc* (to help) takes the dative: *mi* (me).'
  pl.a2.unit64.lesson04.teach.moze_pan_pojechac:
    title: Being told an alternative route
    gloss: You can travel with the intercity via Koluszki.
    note: '*Przez* + accusative introduces the place you travel through: *przez Koluszki*. *Pociągiem Intercity* is the instrumental: the train you travel by.'
  pl.a2.unit64.lesson05.teach.wazny_komunikat_wskutek:
    title: Reading a disruption notice
    gloss: 'Important notice: due to a signal failure, no trains are running between Warsaw and Łódź. Travelers can reroute via Koluszki. The delay is expected to last until about three o''clock. We advise travelers to check the journey planner.'
    note: '*Godzina piętnasta* is the 24-hour clock form of three o''clock in the afternoon, standard on Polish public notices. After *do* the hour is in the genitive: *do godziny piętnastej*.'
    glosses:
      Ważny: important (masculine form of ważny, agreeing with komunikat)
      komunikat: notice, announcement
      wskutek: because of, due to
      awarii: signal failure
      kursują: run (of trains); drive
      między: between
      nie: no, not any
      pociągi: trains (nominative plural of pociąg)
      Podróżni: travelers, passengers
      mogą: can, are able to
      objazdem: to reroute, travel around
      przez: via, by way of
      Opóźnienie: delay
      potrwa: will last (perfective future of potrwać)
      do: until
      około: about, approximately
      piętnastej: fifteen
      godziny: o'clock; hour
      Zalecamy: advise
      podróżnym: travelers, passengers
      wyszukiwarce: journey planner
      sprawdzić: to consult, check
  pl.a2.unit64.lesson06.teach.pracownik_pkp_intercity:
    title: Employee opens the conversation
    gloss: 'Employee: PKP Intercity, good afternoon. How can I help you?'
  pl.a2.unit64.lesson06.teach.ewa_dzien_dobry:
    title: Ewa reports the cancellation
    gloss: 'Ewa: Good afternoon, my train to Łódź is cancelled. I''d like to know how to get there now.'
  pl.a2.unit64.lesson06.teach.pracownik_rzeczywiscie_jest:
    title: Employee explains the cause
    gloss: 'Employee: There is indeed a signal failure. You can reroute via Koluszki.'
  pl.a2.unit64.lesson06.teach.ewa_o_ktorej:
    title: Ewa asks the departure time
    gloss: 'Ewa: What time does that train leave?'
  pl.a2.unit64.lesson06.teach.pracownik_za_dziesiec:
    title: Employee gives the platform and time
    gloss: 'Employee: In ten minutes, from platform four.'
  pl.a2.unit64.lesson06.teach.ewa_dziekuje_bardzo:
    title: Ewa decides to send a message
    gloss: 'Ewa: Thank you. I''ll just send a message that I''m coming later.'
  pl.a2.unit64.lesson06.teach.jej_pociag_zostal:
    title: The passive "został odwołany", and "jej" (her)
    gloss: Her train is cancelled. She can reroute.
    note: '*Został odwołany* is the passive: a form of *zostać* plus a participle that agrees with the noun (masculine *pociąg*). *Jej* (her) is the possessive of *ona* (she). Polish usually drops the subject pronoun, so *Może jechać objazdem* already means "she can reroute"; *ona* is added only for contrast.'
