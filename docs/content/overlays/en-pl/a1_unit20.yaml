answer_policy:
  diacritics: >-
    Same standing policy as unit01-19: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek) and the
    borrowed size letters (S, M, L).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit20.ubrania:
    title: "Clothes"

lessons:
  pl.a1.unit20.lesson01.w_sklepie:
    title: "In the store"
  pl.a1.unit20.lesson02.jaki_kolor:
    title: "What color?"
  pl.a1.unit20.lesson03.kupujemy_ubrania:
    title: "We're buying clothes"

teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: "Is, are, this, I'd like -- again"
    gloss: "Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them to talk about clothes shopping."

  pl.a1.unit20.lesson01.teach.sklep:
    title: "Store"
    gloss: "store / shop"
    note: "The general word for a shop."
    example_gloss: "I'm going to the store."

  pl.a1.unit20.lesson01.teach.koszula:
    title: "Shirt"
    gloss: "shirt"
    note: "A feminine noun -- it will take feminine adjective forms."
    example_gloss: "This is a shirt."

  pl.a1.unit20.lesson01.teach.spodnie:
    title: "Pants"
    gloss: "pants / trousers"
    note: "Always plural in Polish, even for one pair -- there's no singular form."
    example_gloss: "These are pants."

  pl.a1.unit20.lesson01.teach.kupic:
    title: "To buy"
    gloss: "to buy"
    note: "Used after '*chcę*' (I want), just like '*iść*' (to go) in an earlier lesson: '*chcę kupić*' -- I want to buy."
    example_gloss: "I want to buy a shirt."

  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: "I want to buy pants"
    gloss: "I want to buy pants."
    note: "The same chcę + infinitive pattern, applied to pants."

  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: "How much does the shirt cost?"
    gloss: "How much does the shirt cost?"
    note: "A natural way to ask the price of a specific item, reusing '*Ile kosztuje*' from the shopping lesson."

  pl.a1.unit20.lesson02.teach.jaki_note:
    title: "What kind of -- masculine form"
    gloss: "Jaki, Jaka -- '*Jaki*' asks about masculine nouns, '*Jaka*' about feminine nouns (you already know '*Jaka*' from the weather lesson)."
    note: "'*Kolor*' (color) is masculine, so it pairs with '*Jaki*', not '*Jaka*'."

  pl.a1.unit20.lesson02.teach.kolor:
    title: "Color"
    gloss: "color"
    note: "A masculine noun."
    example_gloss: "What color?"

  pl.a1.unit20.lesson02.teach.sukienka:
    title: "Dress"
    gloss: "dress"
    note: "Another feminine noun, like '*koszula*'."
    example_gloss: "This is a dress."

  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: "Blue"
    gloss: "Koszula jest niebieska. -- '*niebieska*' matches feminine nouns, like '*koszula*'."
    note: "This exact form only -- it's tied to '*koszula*' in this course so far."

  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: "Red"
    gloss: "Sukienka jest czerwona. -- '*czerwona*' also matches feminine nouns, just like '*niebieska*'."
    note: "This exact form is tied to '*sukienka*' here, the same way '*niebieska*' is tied to '*koszula*'."

  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: "The shirt is blue"
    gloss: "The shirt is blue."
    note: "The fact this unit will reuse later when Marek shops for a shirt."

  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: "The dress is red"
    gloss: "The dress is red."
    note: "Reusing the same jest + color pattern for a different item."

  pl.a1.unit20.lesson03.teach.recap_words:
    title: "Good day, please, very -- again"
    gloss: "Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's store dialogue."

  pl.a1.unit20.lesson03.teach.rozmiar:
    title: "Size"
    gloss: "size"
    note: "Polish clothing sizes are usually just the letters S, M, and L, exactly like in English."
    example_gloss: "What size?"

  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: "Sir, wants"
    gloss: "Co pan chce kupić? -- '*pan*' is the polite way to address a man, just like '*pani*' for a woman (you already know '*pani*' from the shopping lesson)."
    note: "'*chce*' is the he/she form of '*chcieć*' -- you already know '*chcę*' (I want) and '*chcesz*' (you want)."

  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: "What do you want to buy, sir?"
    gloss: "What do you want to buy, sir?"
    note: "How a shop assistant politely opens a conversation with a male customer."

  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: "The shop assistant greets Marek"
    gloss: "Good day! What do you want to buy, sir?"
    note: "Sprzedawca (the shop assistant) opens with the same polite register unit07's shopkeeper used."
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: "Marek says what he wants"
    gloss: "I want to buy a shirt and pants."
    note: "Marek states both items he's shopping for."
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: "The shop assistant asks the size"
    gloss: "What size?"
    note: "A short, natural follow-up question."
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: "Marek gives his size"
    gloss: "Size M."
    note: "Marek answers with just the size letter, the natural way."
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: "The shop assistant confirms stock and price"
    gloss: "We have a blue shirt. That's 100 zloty total."
    note: "The color matches what this unit's own lesson02 already established for '*koszula*'."
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: "Marek accepts"
    gloss: "Good, I'll take it."
    note: "Marek confirms the purchase, closing the exchange."

exercises:
  pl.a1.unit20.lesson01.exercise01.select_sklep:
    instruction: "Which word means 'store'?"
    correct_option: "sklep"
    distractors: ["koszula", "spodnie"]
    accepted_answers: ["sklep"]

  pl.a1.unit20.lesson01.exercise02.select_koszula:
    instruction: "Which word means 'shirt'?"
    correct_option: "koszula"
    distractors: ["sklep", "spodnie"]
    accepted_answers: ["koszula"]

  pl.a1.unit20.lesson01.exercise03.select_spodnie:
    instruction: "Which word means 'pants'?"
    correct_option: "spodnie"
    distractors: ["sklep", "koszula"]
    accepted_answers: ["spodnie"]

  pl.a1.unit20.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "sklep": "store"
      "koszula": "shirt"
      "spodnie": "pants"
      "kupić": "to buy"
      "chcę": "I want"
      "Poproszę": "I'd like / please"
      "Ile": "how much"
      "kosztuje": "costs"

  pl.a1.unit20.lesson01.exercise05.order_chce_kupic_koszule:
    instruction: "Put the sentence 'I want to buy a shirt' in order."
    correct_response: ["Chcę", "kupić", "koszulę"]

  pl.a1.unit20.lesson01.exercise06.order_ile_kosztuje_koszula:
    instruction: "Put the question 'How much does the shirt cost?' in order."
    correct_response: ["Ile", "kosztuje", "koszula"]

  pl.a1.unit20.lesson01.exercise07.fill_marek_chce_kupic:
    instruction: "Complete the sentence: 'Marek says: I want to ___ a shirt.' (buy)"
    accepted_answers: ["kupić"]
    feedback: "Chcę kupić koszulę -- kupić is the word for to buy."

  pl.a1.unit20.lesson01.exercise08.fix_ile_kosztuje_koszula:
    instruction: "Fix the word order -- put the question 'How much does the shirt cost?' in the natural order."
    accepted_answers:
      - "Ile kosztuje koszula?"
      - "Ile kosztuje koszula"
    feedback: "Ile kosztuje koszula?, not Koszula ile kosztuje? -- Ile comes first in this question."

  pl.a1.unit20.lesson01.exercise09.speak_chce_kupic_spodnie:
    instruction: "Say: 'I want to buy pants.'"
    accepted_answers:
      - "Chcę kupić spodnie."
      - "Chcę kupić spodnie"

  pl.a1.unit20.lesson02.exercise01.select_kolor:
    instruction: "Which word means 'color'?"
    correct_option: "kolor"
    distractors: ["sukienka", "niebieska"]
    accepted_answers: ["kolor"]

  pl.a1.unit20.lesson02.exercise02.select_sukienka:
    instruction: "Which word means 'dress'?"
    correct_option: "sukienka"
    distractors: ["kolor", "niebieska"]
    accepted_answers: ["sukienka"]

  pl.a1.unit20.lesson02.exercise03.select_niebieska:
    instruction: "Which word means 'blue'?"
    correct_option: "niebieska"
    distractors: ["kolor", "sukienka"]
    accepted_answers: ["niebieska"]

  pl.a1.unit20.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "kolor": "color"
      "sukienka": "dress"
      "niebieska": "blue"
      "czerwona": "red"
      "Jaki": "what kind of"
      "koszula": "shirt"
      "spodnie": "pants"

  pl.a1.unit20.lesson02.exercise05.order_koszula_jest_niebieska:
    instruction: "Put the sentence 'The shirt is blue' in order."
    correct_response: ["Koszula", "jest", "niebieska"]

  pl.a1.unit20.lesson02.exercise06.order_sukienka_jest_czerwona:
    instruction: "Put the sentence 'The dress is red' in order."
    correct_response: ["Sukienka", "jest", "czerwona"]

  pl.a1.unit20.lesson02.exercise07.fill_koszula_kolor:
    instruction: "Complete the sentence: 'Marek asks what color the shirt is. The shirt is ___.' (blue)"
    accepted_answers: ["niebieska"]
    feedback: "Koszula jest niebieska -- niebieska is the word for blue, matching koszula."

  pl.a1.unit20.lesson02.exercise08.fix_koszula_jest_niebieska:
    instruction: "Fix the word order -- put the sentence 'The shirt is blue' in the natural order."
    accepted_answers:
      - "Koszula jest niebieska."
      - "Koszula jest niebieska"
    feedback: "Koszula jest niebieska, not Niebieska koszula jest -- jest comes right after the subject, not at the end."

  pl.a1.unit20.lesson02.exercise09.speak_sukienka_czerwona:
    instruction: "Say: 'The dress is red.'"
    accepted_answers:
      - "Sukienka jest czerwona."
      - "Sukienka jest czerwona"

  pl.a1.unit20.lesson03.exercise01.select_marek_wants_shirt_pants_line:
    instruction: "Which line says Marek wants to buy a shirt and pants?"
    correct_option: "Chcę kupić koszulę i spodnie."
