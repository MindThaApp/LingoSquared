      - "Mamy niebieską koszulę. Razem sto złotych."
    accepted_answers:
      - "Jaki rozmiar?"
      - "Jaki rozmiar"

  pl.a1.unit20.lesson03.exercise03.comprehend_marek_size:
    instruction: "Read the line. What size does Marek want?"
    correct_option: "M"
    distractors:
      - "S"
      - "L"
    accepted_answers:
      - "rozmiar M"
      - "M"
      - "size M"

  pl.a1.unit20.lesson03.exercise04.comprehend_marek_wants:
    instruction: "Read the line. What does Marek want to buy?"
    correct_option: "a shirt and pants"
    distractors:
      - "a dress and shoes"
      - "a coat"
    accepted_answers:
      - "koszulę spodnie"
      - "koszulę, spodnie"
      - "a shirt and pants"

  pl.a1.unit20.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "sklep": "store"
      "koszula": "shirt"
      "spodnie": "pants"
      "kupić": "to buy"
      "kolor": "color"
      "sukienka": "dress"
      "niebieska": "blue"
      "czerwona": "red"
      "rozmiar": "size"
      "pan": "sir / formal you"
      "chce": "wants"

  pl.a1.unit20.lesson03.exercise06.order_chce_kupic_koszule_i_spodnie:
    instruction: "Put the sentence 'I want to buy a shirt and pants' in order."
    correct_response: ["Chcę", "kupić", "koszulę", "i", "spodnie"]

  pl.a1.unit20.lesson03.exercise07.order_jaki_rozmiar:
    instruction: "Put the question 'What size?' in order."
    correct_response: ["Jaki", "rozmiar"]

  pl.a1.unit20.lesson03.exercise08.fill_jaki_rozmiar:
    instruction: "Complete the question: 'The shop assistant asks: What ___?' (size)"
    accepted_answers: ["rozmiar"]
    feedback: "Jaki rozmiar? -- rozmiar is the word for size."

  pl.a1.unit20.lesson03.exercise09.fix_co_pan_chce_kupic:
    instruction: "Fix the word order -- put the question 'What do you want to buy, sir?' in the natural order."
    accepted_answers:
      - "Co pan chce kupić?"
      - "Co pan chce kupić"
    feedback: "Co pan chce kupić?, not Chce pan co kupić? -- Co comes first in this question."

  pl.a1.unit20.lesson03.exercise10.reply_jaki_rozmiar:
    instruction: "Answer as Marek: say your size is M."
    accepted_answers:
      - "Rozmiar M."
      - "Rozmiar M"

  pl.a1.unit20.lesson03.exercise11.speak_chce_kupic_koszule_i_spodnie:
    instruction: "Say: 'I want to buy a shirt and pants.'"
    accepted_answers:
      - "Chcę kupić koszulę i spodnie."
      - "Chcę kupić koszulę i spodnie"
