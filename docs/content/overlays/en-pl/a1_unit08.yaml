    instruction: "Which word means 'far'?"
    correct_option: "daleko"
    distractors: ["blisko", "niedaleko"]
    accepted_answers: ["daleko"]

  pl.a1.unit08.lesson02.exercise03.select_obok:
    instruction: "Which word means 'next to'?"
    correct_option: "obok"
    distractors: ["naprzeciwko", "daleko"]
    accepted_answers: ["obok"]

  pl.a1.unit08.lesson02.exercise04.match_location_words:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "blisko": "near"
      "daleko": "far"
      "niedaleko": "not far"
      "obok": "next to"
      "naprzeciwko": "across from"

  pl.a1.unit08.lesson02.exercise05.order_apteka_obok_banku:
    instruction: "Put the sentence 'The pharmacy is next to the bank' in order."
    correct_response: ["Apteka", "jest", "obok", "banku"]

  pl.a1.unit08.lesson02.exercise06.order_restauracja_naprzeciwko_hotelu:
    instruction: "Put the sentence 'The restaurant is across from the hotel' in order."
    correct_response: ["Restauracja", "jest", "naprzeciwko", "hotelu"]

  pl.a1.unit08.lesson02.exercise07.fill_banku:
    instruction: "Complete the sentence to say 'The pharmacy is next to the bank.'"
    accepted_answers: ["banku"]
    feedback: "Apteka jest obok banku -- bank becomes banku after obok."

  pl.a1.unit08.lesson02.exercise08.fix_genitive_ending:
    instruction: "Fix the ending -- after obok, bank needs its genitive form."
    accepted_answers:
      - "Apteka jest obok banku."
      - "Apteka jest obok banku"
    feedback: "Apteka jest obok banku, not Apteka jest obok bank -- bank becomes banku as the object of obok."

  pl.a1.unit08.lesson02.exercise09.speak_restauracja_naprzeciwko_hotelu:
    instruction: "Say 'The restaurant is across from the hotel.'"
