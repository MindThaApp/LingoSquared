      - "Restauracja jest naprzeciwko hotelu"
    feedback: "Restauracja jest naprzeciwko hotelu, not Restauracja jest naprzeciwko hotel -- hotel becomes hotelu as the object of naprzeciwko."

  pl.a1.unit08.lesson03.exercise10.reply_gdzie_jest_restauracja:
