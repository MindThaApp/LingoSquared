  pl.a1.unit08.lesson03.exercise06.order_przepraszam_gdzie_jest_apteka:
    instruction: "Put the question 'Excuse me, where is the pharmacy?' in order."
    correct_response: ["Przepraszam", "gdzie", "jest", "apteka"]

  pl.a1.unit08.lesson03.exercise07.order_apteka_niedaleko_obok_banku:
    instruction: "Put the sentence 'The pharmacy is not far, next to the bank' in order."
    correct_response: ["Apteka", "jest", "niedaleko", "obok", "banku"]

  pl.a1.unit08.lesson03.exercise08.fill_naprzeciwko:
    instruction: "Complete the sentence to say 'The restaurant is across from the hotel.'"
    accepted_answers: ["naprzeciwko"]
