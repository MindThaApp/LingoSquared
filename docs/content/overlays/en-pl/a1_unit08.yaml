    instruction: "Which word means 'bank'?"
    correct_option: "bank"
    distractors: ["poczta", "apteka"]
    accepted_answers: ["bank"]

  pl.a1.unit08.lesson01.exercise02.select_apteka:
    instruction: "Which word means 'pharmacy'?"
    correct_option: "apteka"
    distractors: ["restauracja", "hotel"]
    accepted_answers: ["apteka"]

  pl.a1.unit08.lesson01.exercise03.select_hotel:
    instruction: "Which word means 'hotel'?"
    correct_option: "hotel"
    distractors: ["park", "bank"]
    accepted_answers: ["hotel"]

  pl.a1.unit08.lesson01.exercise04.match_places_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "bank": "bank"
      "poczta": "post office"
      "apteka": "pharmacy"
      "restauracja": "restaurant"
      "hotel": "hotel"
      "park": "park"

  pl.a1.unit08.lesson01.exercise05.order_gdzie_jest_bank:
    instruction: "Put the question 'Where is the bank?' in order."
    correct_response: ["Gdzie", "jest", "bank"]

  pl.a1.unit08.lesson01.exercise06.order_gdzie_jest_apteka:
    instruction: "Put the question 'Where is the pharmacy?' in order."
    correct_response: ["Gdzie", "jest", "apteka"]

  pl.a1.unit08.lesson01.exercise07.fill_gdzie:
    instruction: "Complete the question to say 'Where is the post office?'"
    accepted_answers: ["Gdzie"]
    feedback: "Gdzie jest poczta? -- gdzie means 'where.'"

  pl.a1.unit08.lesson01.exercise08.fix_word_order:
    instruction: "Fix the word order -- Polish asks 'Gdzie jest...?', not '[place] gdzie jest?'"
    accepted_answers:
      - "Gdzie jest hotel?"
      - "Gdzie jest hotel"
    feedback: "Gdzie jest hotel?, not Hotel gdzie jest? -- gdzie jest always opens the question."

  pl.a1.unit08.lesson01.exercise09.speak_gdzie_jest_poczta:
    instruction: "Say 'Where is the post office?'"
    accepted_answers:
      - "Gdzie jest poczta?"
      - "Gdzie jest poczta"

  pl.a1.unit08.lesson02.exercise01.select_blisko:
    instruction: "Which word means 'near'?"
    correct_option: "blisko"
    distractors: ["daleko", "obok"]
