teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: "Bank, post office"
    gloss: "bank; post office"
    note: "Two ordinary everyday errands -- bank is a direct cognate; poczta is where you'd go to mail a letter or package."
    example_gloss:
      - "This is a bank."
      - "This is a post office."

  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: "Pharmacy, restaurant"
    gloss: "pharmacy; restaurant"
    note: "Apteka is where you'd buy medicine (not a general store); restauracja is a near-cognate of 'restaurant.'"
    example_gloss:
      - "This is a pharmacy."
      - "This is a restaurant."

  pl.a1.unit08.lesson01.teach.hotel_park:
    title: "Hotel, park"
    gloss: "hotel; park"
    note: "Both direct cognates -- easy to recognize in writing and speech alike."
    example_gloss:
      - "This is a hotel."
      - "This is a park."

  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: "Where is + [place]?"
    gloss: "Where is + [place]? -- Gdzie (where) plus jest (is) asks about a location: Where is the bank? Where is the pharmacy?"
    note: >-
      *Gdzie* means "where," and *jest* means "is" -- put together, *Gdzie
      jest...?* is the everyday question pattern for asking where any
      place is. It never changes regardless of what place you're asking
      about, since a single place is always singular.

  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: "Where is the bank?"
    gloss: "Where is the bank?"
    note: "The grammar note's pattern put to work with this lesson's first place word."

  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: "Near, far"
    gloss: "near; far"
    note: "A simple opposite pair, used directly after jest to describe how close or far away a place is."
    example_gloss:
      - "The park is near."
      - "The hotel is far."

  pl.a1.unit08.lesson02.teach.niedaleko:
    title: "Not far"
    gloss: "not far"
    note: "Literally *nie* (not) plus *daleko* (far) fused into one word -- a softer, very common way to reassure someone a place is within easy reach."
    example_gloss: "The pharmacy is not far."

  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: "Next to, across from"
    gloss: "next to; across from"
    note: >-
      Both describe a place's position relative to a landmark rather than
      just how close it is. Like most Polish prepositions, both require
      the following noun to shift into the genitive case -- see this
      lesson's grammar note.
    example_gloss:
      - "The pharmacy is next to the bank."
      - "The restaurant is across from the hotel."

  pl.a1.unit08.lesson02.teach.genitive_note:
    title: "After 'obok'/'naprzeciwko'/'blisko + noun': the genitive"
    gloss: "After 'next to'/'across from'/'near + a place': genitive case -- bank -> of the bank, hotel -> of the hotel, park -> of the park. The pharmacy is next to the bank. The restaurant is across from the hotel. The restaurant is near the park."
    note: >-
      *Obok*, *naprzeciwko*, and *blisko* (when it's followed by a place,
      not standing alone) all govern the genitive case, so the noun that
      follows changes its ending. For these three regular masculine
      nouns, that means adding *-u*: *bank* becomes *banku*, *hotel*
      becomes *hotelu*, *park* becomes *parku*. Used alone, *blisko*
      needs no genitive at all -- *To jest blisko* ("That's near") is
      just as correct as *blisko parku* ("near the park").

  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: "The pharmacy is next to the bank"
    gloss: "The pharmacy is next to the bank."
    note: "Puts the grammar note's -u pattern to work in a real sentence -- bank becomes banku after obok."

  pl.a1.unit08.lesson03.teach.przepraszam:
    title: "Excuse me"
    gloss: "excuse me / sorry"
    note: "The everyday way to get a stranger's attention before asking a question -- said before, not after, the question itself."
    example_gloss: "Excuse me, where is the bank?"

  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: "Ewa asks for the pharmacy"
    gloss: "Ewa says excuse me and asks where the pharmacy is."
    note: "Przepraszam opens the question, exactly as this lesson's vocabulary note describes."
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: "Marek gives the pharmacy's location"
    gloss: "Marek says the pharmacy isn't far, next to the bank."
    note: "Combines niedaleko and obok + banku, both from lesson 2's grammar note."
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: "Ewa thanks Marek and asks about the restaurant"
    gloss: "Ewa says thank you, and asks where the restaurant is."
    note: "Dziękuję, reused from earlier units; A (and) links the new question to the last one."
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: "Marek gives the restaurant's location"
    gloss: "Marek says the restaurant is across from the hotel, near the park."
    note: "Naprzeciwko + hotelu (genitive, same pattern as banku) plus blisko for a second landmark."
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: "Ewa thanks Marek again"
    gloss: "Ewa says thank you very much."
    note: "Bardzo intensifies dziękuję, the same pairing seen in earlier units."
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: "Marek responds"
    gloss: "Marek says you're welcome."
    note: "Proszę bardzo, the standard reply to thanks, reused from the shopping unit."

exercises:
