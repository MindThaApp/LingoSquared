teaching:
  pl.a2.unit71.lesson01.teach.rzeczy: {"title": "Things for breakfast", "gloss": "breakfast / coffee / tea / sandwich", "note": "These are the things we eat and drink in the morning. After a verb they change: kawa becomes kawę, kanapka becomes kanapkę.", "example_gloss": ["I ate breakfast.", "I drank coffee.", "Marek ate a sandwich.", "Ewa drank tea."]}
  pl.a2.unit71.lesson01.teach.czas: {"title": "Time words", "gloss": "in the morning / today / at six / at seven / at eight / at nine", "note": "Use o plus the hour to say at what time: o szóstej, o siódmej.", "example_gloss": ["This morning I ate breakfast.", "I drank coffee at eight.", "Marek ate a sandwich at nine.", "Ewa drank tea at seven."]}
  pl.a2.unit71.lesson01.teach.gn_past: {"title": "The past tense: -łem and -łam", "gloss": "I ate breakfast (man speaking). I ate breakfast (woman speaking). I drank coffee (man speaking). I drank coffee (woman speaking).", "note": "The Polish past tense shows who is speaking. A man says -łem, a woman says -łam. The verbs are zjeść (to eat up) and wypić (to drink up); their past stems are zjad- and wypi-."}
  pl.a2.unit71.lesson01.teach.gn_ty: {"title": "Asking a man or a woman", "gloss": "Did you eat breakfast (to a man)? Did you eat breakfast (to a woman)? Did you drink coffee (to a man)? Did you drink coffee (to a woman)?", "note": "When you ask one person, use -łeś for a man and -łaś for a woman."}
  pl.a2.unit71.lesson01.teach.gn_on_ona: {"title": "He and she: -ł and -ła", "gloss": "Marek ate a sandwich. Ewa ate a sandwich. Marek drank tea. Ewa drank tea.", "note": "For a man or a boy the verb ends in -ł (zjadł), for a woman or a girl in -ła (zjadła). Never mix them: Marek zjadł, Ewa zjadła."}
  pl.a2.unit71.lesson01.teach.gn_byc: {"title": "Był and była", "gloss": "Marek was at home. Ewa was at home. The morning was busy.", "note": "The verb być (to be) follows the same pattern: był for masculine words such as poranek, była for feminine words. Zabiegany means busy."}
  pl.a2.unit71.lesson02.teach.zwrotne: {"title": "Reflexive verbs", "gloss": "to wake up / to wash (oneself) / to get dressed", "note": "Verbs with się are reflexive: the action returns to the person. The infinitive ends in się, and so does the past tense.", "example_gloss": ["I woke up at six.", "I washed quickly.", "Marek got dressed.", "Ewa woke up at seven."]}
  pl.a2.unit71.lesson02.teach.jak: {"title": "How and when", "gloss": "early / late / quickly", "note": "These words tell how or when something happened.", "example_gloss": ["Marek woke up early.", "Ewa got dressed quickly.", "I woke up late."]}
  pl.a2.unit71.lesson02.teach.gn_sie: {"title": "Się stays after the verb", "gloss": "I woke up (man speaking). I woke up (woman speaking). I washed (man speaking). I washed (woman speaking).", "note": "In the past tense you keep się and put it after the verb. The verb takes -łem or -łam, but się never changes."}
  pl.a2.unit71.lesson02.teach.gn_3_os: {"title": "He, she and we", "gloss": "Marek washed. Ewa washed. We woke up (a mixed group or men). We washed (women only).", "note": "He takes -ł, she takes -ła. For we, use -liśmy for men or a mixed group and -łyśmy for a group of only women."}
  pl.a2.unit71.lesson02.teach.gn_pytania: {"title": "Questions with się", "gloss": "Did you wake up (to a man)? Did you wake up (to a woman)? Did you get dressed (to a woman)? What time did you wake up (to a man)? What time did you wash (to a woman)?", "note": "Czy makes a question from any sentence. After a question word such as o której (at what time), się comes right after it."}
  pl.a2.unit71.lesson03.teach.ruch: {"title": "Verbs of motion", "gloss": "to go out (on foot) / to leave (by vehicle) / to get to a place (by vehicle) / to arrive (by vehicle)", "note": "The prefix changes the meaning: wy- means out of, do- means as far as, przy- means arrival. Jechać is travel by vehicle, iść is travel on foot.", "example_gloss": ["I went out of the house at seven.", "Marek left the house at eight (by vehicle).", "I got to work at nine.", "I arrived at the station."]}
  pl.a2.unit71.lesson03.teach.miejsca: {"title": "Places and transport", "gloss": "home, house / work / station / bus / tram", "note": "Means of transport take the ending -em: autobus becomes autobusem, tramwaj becomes tramwajem (by bus, by tram).", "example_gloss": ["Ewa went out of the house.", "Marek got to work by bus.", "Ewa arrived at the station by tram.", "I arrived at the station."]}
  pl.a2.unit71.lesson03.teach.gn_wyjsc: {"title": "Wyjść: an irregular verb", "gloss": "I went out of the house (man speaking). I went out of the house (woman speaking). Marek went out of the house. Ewa went out of the house. We went out of the house (men or mixed group). We went out of the house (women only).", "note": "Wyjść has an irregular past: only the masculine singular has the -e- (wyszedłem, wyszedł). All the other forms are built on wyszł-: wyszłam, wyszła, wyszliśmy, wyszłyśmy."}
  pl.a2.unit71.lesson03.teach.gn_przyimki: {"title": "Z, do and na", "gloss": "I went out of the house. I got to work. I arrived at the station. I left the house.", "note": "Z means out of and goes with wyjść and wyjechać: z domu. Do means to and goes with dojechać: do pracy. Na means to for a station or a stop: na stację. Dom and praca change their endings after these words."}
  pl.a2.unit71.lesson03.teach.gn_regularne: {"title": "Wyjechać, dojechać, przyjechać", "gloss": "I left the house (man speaking). I left the house (woman speaking). We got to work (men or mixed group). We got to work (women only). Marek arrived at the station. Marek and Ewa arrived at the station.", "note": "These three verbs are regular: -łem, -łam, -ł, -ła, -liśmy, -łyśmy. A mixed group (Marek i Ewa) takes -li."}
  pl.a2.unit71.lesson04.teach.kolejnosc: {"title": "Sequence words", "gloss": "first / then / later / finally, in the end", "note": "These words put the steps of a morning in order. W końcu is the last step.", "example_gloss": ["First I washed.", "Then I drank coffee.", "Later I went out of the house.", "Finally I got to work."]}
  pl.a2.unit71.lesson04.teach.gn_czas: {"title": "At what time?", "gloss": "At what time did you go out of the house? I went out at seven. At what time did you get to work? I got to work at eight.", "note": "O której asks for the time. The answer uses o and the hour: o siódmej, o ósmej."}
  pl.a2.unit71.lesson04.teach.gn_teraz: {"title": "Habit now, event today", "gloss": "I usually wake up at seven. Today I woke up at six. Marek usually wakes up at seven. Today Marek woke up at six.", "note": "Use the present for what you usually do (zwykle) and the past for something that happened today (dziś). The past of obudzić się is a different form from the present budzę się."}
  pl.a2.unit71.lesson04.teach.gn_zdanie: {"title": "Linking the steps", "gloss": "I woke up at six, washed and drank coffee. I only drank coffee, but I ate a sandwich. I went out at seven and got there at eight.", "note": "Join the steps with a comma and i (and). Ale means but, a means and or while when you contrast two things, and tylko means only. Each verb has its own past ending."}
  pl.a2.unit71.lesson04.teach.pytania: {"title": "Questions about the morning", "gloss": "How did your morning go? At what time did you go out of the house? How did you get to work?", "note": "Use these questions to ask a friend about their morning."}
  pl.a2.unit71.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "morning / busy / very / my", "note": "Mój poranek means my morning. Zabiegany is a masculine adjective because poranek is masculine.", "example_gloss": ["My morning was very busy.", "Today the morning was busy."]}
  pl.a2.unit71.lesson05.teach.gn_opis: {"title": "Telling the story in order", "gloss": "First I woke up. Then I washed. Finally I went out of the house.", "note": "A story of a morning is a chain of past forms. Start with najpierw, continue with potem, finish with w końcu."}
  pl.a2.unit71.lesson05.teach.gn_rodzaj: {"title": "Who is speaking", "gloss": "I woke up at six (man speaking). I woke up at six (woman speaking).", "note": "In the reading Marek speaks, so all his past forms end in -łem. Ewa would use -łam in the same sentences."}
  pl.a2.unit71.lesson05.teach.zdania: {"title": "Useful sentences", "gloss": "This morning I woke up at six. I went out of the house at seven. I got to work by bus."}
  pl.a2.unit71.lesson05.teach.marek_opowiada: {"title": "Marek tells about his morning", "gloss": "Today my morning was very busy. I woke up at six. First I washed, then I got dressed and quickly drank coffee. At seven I went out of the house. I got to work by bus at eight. Finally I ate a sandwich.", "note": "Notice how Marek tells the steps in order, with najpierw, potem and w końcu.", "glosses": {"zabiegany": "busy", "szybko": "quickly", "autobusem": "by bus", "kanapkę": "sandwich"}}
  pl.a2.unit71.lesson06.teach.d1: {"title": "Ewa asks", "gloss": "Ewa: Hi, Marek! How did your morning go?"}
  pl.a2.unit71.lesson06.teach.d2: {"title": "Marek answers", "gloss": "Marek: It was very busy. I woke up at six, washed and quickly drank coffee."}
  pl.a2.unit71.lesson06.teach.d3: {"title": "Ewa asks about the time", "gloss": "Ewa: At what time did you go out of the house?"}
  pl.a2.unit71.lesson06.teach.d4: {"title": "Marek describes the trip", "gloss": "Marek: I went out at seven, and I got to work by bus at eight."}
  pl.a2.unit71.lesson06.teach.d5: {"title": "Ewa asks about breakfast", "gloss": "Ewa: And what did you eat for breakfast?"}
  pl.a2.unit71.lesson06.teach.d6: {"title": "Marek explains", "gloss": "Marek: I only drank coffee, but in the end I ate a sandwich at work."}
exercises:
  pl.a2.unit71.lesson01.exercise01.elige_zjadl: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek zjadł śniadanie.", "distractors": ["Marek zjadła śniadanie.", "Marek zjadłem śniadanie.", "Marek zjeść śniadanie."], "accepted_answers": [{"value": "Marek zjadł śniadanie.", "status": "correct"}], "feedback": "A man or a boy takes -ł: *Marek zjadł śniadanie*."}
  pl.a2.unit71.lesson01.exercise02.elige_wypila: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa wypiła kawę.", "distractors": ["Ewa wypił kawę.", "Ewa wypiłem kawę.", "Ewa wypić kawę."], "accepted_answers": [{"value": "Ewa wypiła kawę.", "status": "correct"}], "feedback": "A woman takes -ła: *Ewa wypiła kawę*."}
  pl.a2.unit71.lesson01.exercise03.une_formy: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "zjadłem", "right": "I ate (man speaking)"}, {"left": "zjadłam", "right": "I ate (woman speaking)"}, {"left": "wypiłem", "right": "I drank (man speaking)"}, {"left": "wypiłam", "right": "I drank (woman speaking)"}, {"left": "zjadł", "right": "he ate"}, {"left": "zjadła", "right": "she ate"}, {"left": "wypił", "right": "he drank"}, {"left": "wypiła", "right": "she drank"}, {"left": "był", "right": "he was, it was (masculine)"}, {"left": "była", "right": "she was, it was (feminine)"}], "status": "correct"}], "feedback": "The ending shows the gender of the person."}
  pl.a2.unit71.lesson01.exercise04.ordena_kawa: {"instruction": "Put the words in order to say 'Marek drank coffee at eight.'", "correct_option": "Marek wypił kawę o ósmej", "accepted_answers": [{"value": "Marek wypił kawę o ósmej", "status": "correct"}, {"value": "O ósmej Marek wypił kawę", "status": "correct"}, {"value": "Marek o ósmej wypił kawę", "status": "correct"}], "feedback": "*Marek wypił kawę o ósmej*: subject, verb, object, time."}
