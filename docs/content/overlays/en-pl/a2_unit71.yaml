  pl.a2.unit71.lesson01.exercise06.traduce_sniadanie: {"instruction": "Translate into Polish using the past tense. Use the ending that fits you.", "accepted_answers": [{"value": "Zjadłem śniadanie.", "status": "correct"}, {"value": "Zjadłem śniadanie", "status": "correct"}, {"value": "Zjadłam śniadanie.", "status": "correct"}, {"value": "Zjadłam śniadanie", "status": "correct"}, {"value": "Śniadanie zjadłem.", "status": "correct"}, {"value": "Śniadanie zjadłem", "status": "correct"}, {"value": "Śniadanie zjadłam.", "status": "correct"}, {"value": "Śniadanie zjadłam", "status": "correct"}], "feedback": "*Zjadłem śniadanie.* (a woman says: Zjadłam śniadanie.)"}
  pl.a2.unit71.lesson01.exercise07.escribe_kawa: {"instruction": "Write the sentence in the past tense.", "correct_option": "Wypiłem kawę o ósmej.", "accepted_answers": [{"value": "Wypiłem kawę o ósmej.", "status": "correct"}, {"value": "Wypiłem kawę o ósmej", "status": "correct"}, {"value": "Wypiłam kawę o ósmej.", "status": "correct"}, {"value": "Wypiłam kawę o ósmej", "status": "correct"}, {"value": "O ósmej wypiłem kawę.", "status": "correct"}, {"value": "O ósmej wypiłem kawę", "status": "correct"}, {"value": "O ósmej wypiłam kawę.", "status": "correct"}, {"value": "O ósmej wypiłam kawę", "status": "correct"}, {"value": "Kawę wypiłem o ósmej.", "status": "correct"}, {"value": "Kawę wypiłem o ósmej", "status": "correct"}, {"value": "Kawę wypiłam o ósmej.", "status": "correct"}, {"value": "Kawę wypiłam o ósmej", "status": "correct"}], "feedback": "*Wypiłem kawę o ósmej.* (a woman says: Wypiłam kawę o ósmej.)"}
  pl.a2.unit71.lesson02.exercise01.elige_ubral: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek ubrał się.", "distractors": ["Marek ubrała się.", "Marek ubrałem się.", "Marek ubrać się."], "accepted_answers": [{"value": "Marek ubrał się.", "status": "correct"}], "feedback": "A man takes -ł, and się stays: *Marek ubrał się*."}
  pl.a2.unit71.lesson02.exercise02.elige_obudzilas: {"instruction": "Choose the correct Polish question.", "correct_option": "Ewa, czy obudziłaś się wcześnie?", "distractors": ["Ewa, czy obudziłeś się wcześnie?", "Ewa, czy obudziła się wcześnie?", "Ewa, czy obudzić się wcześnie?"], "accepted_answers": [{"value": "Ewa, czy obudziłaś się wcześnie?", "status": "correct"}], "feedback": "Ewa is a woman, so you ask with -łaś: *obudziłaś się*."}
  pl.a2.unit71.lesson02.exercise03.une_zwrotne: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "obudziłem się", "right": "I woke up (man speaking)"}, {"left": "obudziłam się", "right": "I woke up (woman speaking)"}, {"left": "umyłem się", "right": "I washed (man speaking)"}, {"left": "umyłam się", "right": "I washed (woman speaking)"}, {"left": "ubrał się", "right": "he got dressed"}, {"left": "ubrała się", "right": "she got dressed"}, {"left": "obudziliśmy się", "right": "we woke up (men or mixed group)"}, {"left": "umyłyśmy się", "right": "we washed (women only)"}, {"left": "wcześnie", "right": "early"}], "status": "correct"}], "feedback": "The verb shows the gender, się stays the same."}
  pl.a2.unit71.lesson02.exercise04.ordena_obudzila: {"instruction": "Put the words in order to say 'Ewa woke up early.'", "correct_option": "Ewa obudziła się wcześnie", "accepted_answers": [{"value": "Ewa obudziła się wcześnie", "status": "correct"}, {"value": "Ewa wcześnie się obudziła", "status": "correct"}, {"value": "Ewa się wcześnie obudziła", "status": "correct"}], "feedback": "*Ewa obudziła się wcześnie*: się follows the verb."}
  pl.a2.unit71.lesson02.exercise05.completa_umyl: {"instruction": "Complete with the past form of the verb 'to wash' (he).", "correct_option": "umył", "accepted_answers": [{"value": "umył", "status": "correct"}], "feedback": "*Marek umył się szybko*: a man takes -ł."}
  pl.a2.unit71.lesson02.exercise06.traduce_wczesnie: {"instruction": "Translate into Polish using the past tense of the reflexive verb.", "accepted_answers": [{"value": "Obudziłem się wcześnie.", "status": "correct"}, {"value": "Obudziłem się wcześnie", "status": "correct"}, {"value": "Obudziłam się wcześnie.", "status": "correct"}, {"value": "Obudziłam się wcześnie", "status": "correct"}, {"value": "Wcześnie się obudziłem.", "status": "correct"}, {"value": "Wcześnie się obudziłem", "status": "correct"}, {"value": "Wcześnie się obudziłam.", "status": "correct"}, {"value": "Wcześnie się obudziłam", "status": "correct"}, {"value": "Wcześnie obudziłem się.", "status": "correct"}, {"value": "Wcześnie obudziłem się", "status": "correct"}, {"value": "Wcześnie obudziłam się.", "status": "correct"}, {"value": "Wcześnie obudziłam się", "status": "correct"}], "feedback": "*Obudziłem się wcześnie.* (a woman says: Obudziłam się wcześnie.)"}
  pl.a2.unit71.lesson02.exercise07.escribe_dwa: {"instruction": "Write exactly two sentences in the past tense with reflexive verbs.", "correct_option": "Obudziłem się o szóstej. Umyłem się.", "accepted_answers": [{"value": "Obudziłem się o szóstej. Umyłem się.", "status": "correct"}, {"value": "Obudziłem się o szóstej. Umyłem się", "status": "correct"}, {"value": "Obudziłam się o szóstej. Umyłam się.", "status": "correct"}, {"value": "Obudziłam się o szóstej. Umyłam się", "status": "correct"}], "feedback": "*Obudziłem się o szóstej. Umyłem się.* (a woman says: Obudziłam się o szóstej. Umyłam się.)"}
  pl.a2.unit71.lesson03.exercise01.elige_wyszedl: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek wyszedł z domu o siódmej.", "distractors": ["Marek wyszła z domu o siódmej.", "Marek wyszłem z domu o siódmej.", "Marek wyjść z domu o siódmej."], "accepted_answers": [{"value": "Marek wyszedł z domu o siódmej.", "status": "correct"}], "feedback": "Wyjść has the irregular masculine form *wyszedł*."}
  pl.a2.unit71.lesson03.exercise02.elige_stacja: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa przyjechała na stację.", "distractors": ["Ewa przyjechał na stację.", "Ewa przyjechałam na stację.", "Ewa przyjechać na stację."], "accepted_answers": [{"value": "Ewa przyjechała na stację.", "status": "correct"}], "feedback": "Ewa is a woman, so *przyjechała*; na goes with *stację*."}
  pl.a2.unit71.lesson03.exercise03.une_ruch: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "wyszedłem", "right": "I went out (man speaking)"}, {"left": "wyszłam", "right": "I went out (woman speaking)"}, {"left": "wyszliśmy", "right": "we went out (men or mixed group)"}, {"left": "wyszła", "right": "she went out"}, {"left": "wyjechałem", "right": "I left by vehicle (man speaking)"}, {"left": "dojechałam", "right": "I got there by vehicle (woman speaking)"}, {"left": "przyjechał", "right": "he arrived by vehicle"}, {"left": "z domu", "right": "out of the house"}, {"left": "do pracy", "right": "to work"}, {"left": "na stację", "right": "to the station"}], "status": "correct"}], "feedback": "Notice the prefixes wy-, do- and przy-."}
  pl.a2.unit71.lesson03.exercise04.ordena_autobus: {"instruction": "Put the words in order to say 'Marek got to work by bus.'", "correct_option": "Marek dojechał do pracy autobusem", "accepted_answers": [{"value": "Marek dojechał do pracy autobusem", "status": "correct"}, {"value": "Marek dojechał autobusem do pracy", "status": "correct"}], "feedback": "*Marek dojechał do pracy autobusem*."}
