  pl.a2.unit71.lesson01.zjadlem_sniadanie: {"title": "I Had Breakfast"}
  pl.a2.unit71.lesson02.obudzilem_sie: {"title": "I Woke Up"}
  pl.a2.unit71.lesson03.wyszedlem_z_domu: {"title": "I Left the House"}
  pl.a2.unit71.lesson04.najpierw_potem: {"title": "First, Then, Finally"}
  pl.a2.unit71.lesson05.poranek_marka: {"title": "Marek's Morning"}
