teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Happy, sad, and angry
    gloss: happy, sad, angry
    note: Three basic feeling words used with *jestem* (I am). They are masculine forms; a woman says *szczęśliwa, smutna, zła*.
    example_gloss:
    - I am happy.
    - I am sad.
    - I am angry.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Saying you're happy
    gloss: I am happy.
    note: '*Jestem* (I am, from *być*) + adjective is the basic pattern, like English ''I am ...''. The adjective matches the speaker: *szczęśliwy* (man), *szczęśliwa* (woman).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Contrasting feelings
    gloss: I am not angry, I am sad.
    note: '*Nie* goes right before the verb: *Nie jestem zły*. The second clause then states the actual feeling.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Asking why
    gloss: Why are you happy?
    note: '*Dlaczego* (why) is the standard question word for a reason.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Giving a reason
    gloss: I am happy because I have a new apartment.
    note: '*Bo* (because) introduces the reason; after *mam* (I have) the noun is in the accusative: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: A negative reason
    gloss: I am sad because it is raining.
    note: '*Pada deszcz* (it is raining, literally ''rain falls'') is the usual weather phrase, here used as the reason.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nervous
    gloss: nervous
    note: The standard word for nervousness.
    example_gloss: I am nervous about my first shift.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Stating what you're nervous about
    gloss: I am nervous about my first shift.
    note: '*Przed* (literally ''before'') + instrumental says what the nervousness is about, where English says ''about'': *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Reassuring someone
    gloss: Don't worry.
    note: '*Nie martw się* (literally ''don''t worry yourself'') is the standard reassurance phrase; *się* is the reflexive pronoun.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Asking how someone feels
    gloss: How does Marek feel?
    note: '*Czuć się* (to feel, reflexive) is the standard way to ask about or describe an emotional state: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Describing how someone feels
    gloss: He feels nervous.
    note: '*Się* stays with the verb: *on czuje się*. The adjective is masculine to match *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Asking why someone feels a certain way
    gloss: Why does he feel nervous?
    note: Combines *dlaczego* (why) with the *czuje się* pattern from *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Read a message about feelings
    gloss: Hi Ewa, I'm a little nervous about my first shift alone. But I'm also happy, because I have a new job and a new apartment. I think it'll be fine.
    note: Track what the writer is nervous about, what makes him happy, and his overall outlook.
    glosses:
      trochę: a little
      zdenerwowany: nervous
      pierwszą: first
      zmianą: shift
      samodzielną: alone
      szczęśliwy: happy
      bo: because
      nową: new
      pracę: job
      nowe: new
      mieszkanie: apartment
      myślę: think
      będzie: 'turns out (here: will be fine)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa asks how Marek feels
    gloss: 'Ewa: Hi Marek, how are you feeling about your first shift?'
    note: '*Przed pierwszą zmianą* (about your first shift) reuses the *przed* + instrumental pattern from lesson 3. *Czujesz się* is the *ty* form.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek admits he's nervous
    gloss: 'Marek: I''m a bit nervous, honestly.'
    note: '*Szczerze mówiąc* (honestly, literally ''speaking sincerely'') softens the admission.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa reassures him
    gloss: 'Ewa: Don''t worry, you can do it well!'
    note: '*Dobrze sobie poradzisz* (literally ''you will cope well'') is an encouraging fixed expression; *poradzisz* is the *ty* future of *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek thanks her
    gloss: 'Marek: Thanks, that really helps.'
    note: '*Pomaga* is the *on/ona/ono* form of *pomagać* (to help); *dzięki* is informal ''thanks''.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa predicts the outcome
    gloss: 'Ewa: And afterward you''ll definitely be very happy and proud.'
    note: '*Na pewno* (definitely) expresses confident prediction; *dumny* (proud) is a new, useful adjective. *Będziesz* is the future of *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek agrees
    gloss: 'Marek: Yes, I think so too.'
    note: '*Ja też tak myślę* (literally ''I too think so'') is the natural way to agree; *ja* is added here for contrast.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Summarizing with jest and mu
    gloss: Marek is nervous about his first shift. Ewa helps him.
    note: '*Jest* is the *on/ona* form of *być* (to be); *mu* means ''him'' (dative, because *pomagać* takes the dative). Small words, but essential for talking about someone else.'
