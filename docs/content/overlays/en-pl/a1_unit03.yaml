answer_policy:
  diacritics: >-
    Same standing policy as unit01/unit02: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form remains
    the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (pan/pani/ci vs formal-only) rather than written punctuation or
    diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit03.dates:
    title: "Dni tygodnia i daty"

lessons:
  pl.a1.unit03.lesson01.dni_tygodnia:
    title: "Dni tygodnia"
  pl.a1.unit03.lesson02.miesiace_i_daty:
    title: "Miesiące i daty"
  pl.a1.unit03.lesson03.umawiamy_sie:
    title: "Umawiamy się na spotkanie"

teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: "Monday"
    gloss: "Monday"
    note: "The first day of the week in Polish, same as in English convention."
    example_gloss: "Today is Monday."

  pl.a1.unit03.lesson01.teach.wtorek:
    title: "Tuesday"
    gloss: "Tuesday"
    note: >-
      Watch this one -- *wtorek* takes the preposition *we*, not *w*, when
      you say "on Tuesday." More on that later in this lesson.
    example_gloss: "Today is Tuesday."

  pl.a1.unit03.lesson01.teach.sroda:
    title: "Wednesday"
    gloss: "Wednesday"
    note: "A feminine noun, unlike most of the other weekdays."
    example_gloss: "Today is Wednesday."

  pl.a1.unit03.lesson01.teach.czwartek:
    title: "Thursday"
    gloss: "Thursday"
    note: "Same masculine pattern as *poniedziałek*, *wtorek*, and *piątek*."
    example_gloss: "Today is Thursday."

  pl.a1.unit03.lesson01.teach.piatek:
    title: "Friday"
    gloss: "Friday"
    note: "You'll see this day again later in the unit -- it's the day Ewa and Marek plan to meet again."
    example_gloss: "Today is Friday."

  pl.a1.unit03.lesson01.teach.sobota:
    title: "Saturday"
    gloss: "Saturday"
    note: "Part of the weekend, *weekend* (a borrowed English word many Poles also use)."
    example_gloss: "Today is Saturday."

  pl.a1.unit03.lesson01.teach.niedziela:
    title: "Sunday"
    gloss: "Sunday"
    note: "The last of the seven weekdays taught in this lesson."
    example_gloss: "Today is Sunday."

  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: "Asking the day"
    gloss: "What day of the week is it today?"
    note: >-
      A direct question form -- *dzień tygodnia* literally means "day of
      the week."

  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: "The w/we exception"
    gloss: "On Monday, on Thursday, on Friday -- but on Tuesday (for easier pronunciation)."
    note: >-
      Most weekdays follow "*w* + [day]" to mean "on [day]." *Wtorek* is
      the one real exception: Polish speakers say *we wtorek*, not
      *w wtorek*, purely because it's easier to say -- a genuine, source-
      confirmed irregularity, not a typo.

  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: "On Friday I'm going to the movies"
    gloss: "On Friday I'm going to the movies."
    note: "*Piątek* doesn't change after *w* -- only *środa*, *sobota*, and *niedziela* would (not covered in this lesson to keep things simple at A1)."

  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: "January, February, March"
    gloss: "January; February; March"
    note: >-
      *Luty* is the odd one out grammatically -- it behaves like an
      adjective rather than a regular noun (you'll see this again in its
      "in February" form later in the unit).
    example_gloss:
      - "I have my birthday in January."
      - "I'm going to Warsaw in February."
      - "I have my birthday in March."

  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: "April, May, June"
    gloss: "April; May; June"
    note: "*Maj* is the month you'll see used for both dates in this unit's own story."
    example_gloss:
      - "I'm going to Warsaw in April."
      - "I have my birthday in May."
      - "I'm going to Warsaw in June."

  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: "July, August, September"
    gloss: "July; August; September"
    note: >-
      Another real irregularity here: "in September" is *we wrześniu*, not
      *w wrześniu* -- the same easier-to-pronounce *we* swap you already
      saw with *wtorek*.
    example_gloss:
      - "I have vacation in July."
      - "I'm going to Warsaw in August."
      - "I have my birthday in September."

  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: "October, November, December"
    gloss: "October; November; December"
    note: "The last three months of the year, rounding out the full set of twelve."
    example_gloss:
      - "I'm going to Warsaw in October."
      - "I have my birthday in November."
      - "I have vacation in December."

  pl.a1.unit03.lesson02.teach.urodziny:
    title: "Birthday"
    gloss: "birthday"
    note: >-
      *Urodziny* is always grammatically plural in Polish, even for one
      person's one birthday -- it pairs with *są* ("are"), never *jest*
      ("is"). You'll practice this exact point in an exercise later in
      this lesson.
    example_gloss: "My birthday is in May."

  pl.a1.unit03.lesson02.teach.kiedy:
    title: "When"
    gloss: "when"
    note: "The question word for asking about any point in time."
    example_gloss: "When is the meeting?"

  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: "Asking someone's birthday"
    gloss: "When is your birthday?"
    note: "*Są*, not *jest*, agreeing with plural *urodziny* -- the pattern flagged on the *urodziny* card."

  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: "Stating a birthday"
    gloss: "My birthday is on May 10th."
    note: >-
      *Dziesiątego maja* -- the day ends in *-ego* and the month ends in
      *-a*, with no preposition at all. This is the standard way Polish
      states a specific date; see the grammar note later in this lesson
      for the full pattern.

  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: "Asking when the meeting is"
    gloss: "When is the meeting?"
    note: "*Spotkanie* (meeting) -- a word you'll see again in lesson 3's dialogue."

  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: "Stating the meeting date"
    gloss: "The meeting is on May 15th."
    note: "Same *-ego* + *-a* date pattern as *dziesiątego maja*, just a different day number."

  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: "How Polish states a date"
    gloss: "A date: the day ends in -ego, the month ends in -a, with no preposition -- May 10th, May 15th."
    note: >-
      Compare this to "on Friday" (*w piątek*, needs the preposition *w*)
      -- stating a specific calendar date works differently and never
      takes a preposition at all.

  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: "Suggesting to meet again"
    gloss: "When can we meet again?"
    note: >-
      *Znowu* means "again" -- a natural way to open a conversation about
      scheduling another meeting.

  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: "Asking a man if Friday works, formally"
    gloss: "Does Friday work for you? (to a man, formal)"
    note: >-
      *Panu* is the dative form of *pan* -- *odpowiadać* ("to suit/work
      for") always takes its object in the dative case, the same way
      English says "Friday works *for* me."

  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: "Asking a woman if Friday works, formally"
    gloss: "Does Friday work for you? (to a woman, formal)"
    note: "Swap *panu* for *pani* to address a woman formally -- *pani* stays the same in both nominative and dative here, unlike *pan*/*panu*."

  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: "Asking a friend if Friday works, informally"
    gloss: "Does Friday work for you? (informal)"
    note: >-
      *Ci* replaces *panu*/*pani* when speaking with a friend or peer --
      the informal dative "you."

  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: "Saying Friday works for you"
    gloss: "Friday works for me."
    note: >-
      *Mi* is the first-person dative -- the same case pattern as
      *panu*/*pani*/*ci*, just for "me" instead of "you."

  pl.a1.unit03.lesson03.teach.data:
    title: "Date"
    gloss: "date (calendar date)"
    note: >-
      A near-cognate of the English word "date" -- easy to recognize.
    example_gloss: "What date will that be?"

  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: "Asking what date it will be"
    gloss: "What date will that be?"
    note: "A natural follow-up once two people have agreed on a day of the week but not yet the exact date."

  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: "Ewa suggests meeting again"
    gloss: "Ewa asks Marek when they can meet again."
    note: "Reuses this lesson's opening question exactly."
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: "Marek proposes Friday, formally"
    gloss: "Marek asks Ewa, formally, if Friday works for her."
    note: "Addresses Ewa with *pani*, continuing the formal register established since unit01."
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: "Ewa agrees and asks the date"
    gloss: "Ewa says Friday works for her, then asks what the exact date will be."
    note: >-
      *Tak* ("yes") is new here -- a simple, high-frequency word worth
      learning alongside this exchange.
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: "Marek gives the date"
    gloss: "Marek says May 15th."
    note: "Both words here were already taught in lesson 2 of this unit."
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: "Ewa confirms and says goodbye"
    gloss: "Ewa says great, and says see you on May 15th."
    note: "*Do zobaczenia* reuses unit01's farewell, now combined with a specific date."
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: "Marek closes the conversation"
    gloss: "Marek says goodbye back."
    note: "The shortest possible closing -- just the farewell itself."

exercises:
  pl.a1.unit03.lesson01.exercise01.select_sroda:
    instruction: "Which word means Wednesday?"
    correct_option: "środa"
    distractors: ["poniedziałek", "piątek"]
    accepted_answers: ["środa"]

  pl.a1.unit03.lesson01.exercise02.select_piatek:
    instruction: "Which word means Friday?"
    correct_option: "piątek"
    distractors: ["środa", "sobota"]
    accepted_answers: ["piątek"]

  pl.a1.unit03.lesson01.exercise03.select_niedziela:
    instruction: "Which word means Sunday?"
    correct_option: "niedziela"
    distractors: ["sobota", "czwartek"]
    accepted_answers: ["niedziela"]

  pl.a1.unit03.lesson01.exercise04.match_weekdays:
    instruction: "Match each Polish weekday to its English translation."
    correct_response:
      "poniedziałek": "Monday"
      "wtorek": "Tuesday"
      "środa": "Wednesday"
      "czwartek": "Thursday"
      "piątek": "Friday"
      "sobota": "Saturday"
      "niedziela": "Sunday"

  pl.a1.unit03.lesson01.exercise05.order_day_question:
    instruction: "Put the question 'What day of the week is it today?' in order."
    correct_response: ["Jaki", "dziś", "jest", "dzień", "tygodnia"]

  pl.a1.unit03.lesson01.exercise06.order_friday_cinema:
    instruction: "Put the sentence in order: 'On Friday I'm going to the movies.'"
    correct_response: ["W", "piątek", "idę", "do", "kina"]

  pl.a1.unit03.lesson01.exercise07.fill_wednesday:
    instruction: "Complete the sentence with the correct day."
    accepted_answers: ["środa"]
    feedback: "Dziś jest środa -- today is Wednesday."

  pl.a1.unit03.lesson01.exercise08.fix_we_wtorek:
    instruction: "Fix the preposition -- Tuesday needs 'we', not 'w'."
    accepted_answers:
      - "we wtorek"
      - "We wtorek"
    feedback: "We wtorek, not w wtorek -- Tuesday is the one real exception to the usual w + [day] pattern."

  pl.a1.unit03.lesson01.exercise09.speak_weekdays:
    instruction: "Name the days of the week from Monday to Sunday, out loud."
    accepted_answers:
      - "Poniedziałek, wtorek, środa, czwartek, piątek, sobota, niedziela."
      - "poniedziałek wtorek środa czwartek piątek sobota niedziela"

  pl.a1.unit03.lesson02.exercise01.select_maj:
    instruction: "Which word means May?"
    correct_option: "maj"
    distractors: ["marzec", "czerwiec"]
    accepted_answers: ["maj"]

  pl.a1.unit03.lesson02.exercise02.select_pazdziernik:
    instruction: "Which word means October?"
    correct_option: "październik"
    distractors: ["listopad", "wrzesień"]
    accepted_answers: ["październik"]

  pl.a1.unit03.lesson02.exercise03.match_months:
    instruction: "Match each Polish month to its English translation."
    correct_response:
      "styczeń": "January"
      "luty": "February"
      "marzec": "March"
      "kwiecień": "April"
      "maj": "May"
      "czerwiec": "June"
      "lipiec": "July"
      "sierpień": "August"
      "wrzesień": "September"
      "październik": "October"
      "listopad": "November"
      "grudzień": "December"

  pl.a1.unit03.lesson02.exercise04.order_birthday_question:
    instruction: "Put the question 'When is your birthday?' in order."
    correct_response: ["Kiedy", "są", "twoje", "urodziny"]

  pl.a1.unit03.lesson02.exercise05.order_birthday_date:
    instruction: "Put the sentence 'My birthday is on May 10th' in order."
    correct_response: ["Moje", "urodziny", "są", "dziesiątego", "maja"]

  pl.a1.unit03.lesson02.exercise06.fill_birthday_ordinal:
    instruction: "Complete the date -- Ewa's birthday, in words."
    accepted_answers: ["dziesiątego"]
    feedback: "Moje urodziny są dziesiątego maja -- my birthday is on May 10th."

  pl.a1.unit03.lesson02.exercise07.fix_urodziny_agreement:
    instruction: "Correct the sentence -- urodziny needs a plural verb."
    accepted_answers:
      - "Moje urodziny są dziesiątego maja."
      - "Moje urodziny są dziesiątego maja"
    feedback: "Urodziny is always plural in Polish, so it takes są, not jest: Moje urodziny są dziesiątego maja."

  pl.a1.unit03.lesson02.exercise08.reply_meeting_date:
    instruction: "Answer that the meeting is on May 15th."
    accepted_answers:
      - "Spotkanie jest piętnastego maja."
      - "Spotkanie jest piętnastego maja"

  pl.a1.unit03.lesson02.exercise09.speak_meeting_date:
    instruction: "Say when the meeting is."
    accepted_answers:
      - "Spotkanie jest piętnastego maja."
      - "Spotkanie jest piętnastego maja"

  pl.a1.unit03.lesson03.exercise01.select_formal_friday_question_man:
    instruction: "Which question formally asks a man if Friday works for him?"
    correct_option: "Czy piątek panu odpowiada?"
    distractors: ["Czy piątek pani odpowiada?", "Kiedy jest spotkanie?"]
    accepted_answers: ["Czy piątek panu odpowiada?", "Czy piątek panu odpowiada"]

  pl.a1.unit03.lesson03.exercise02.select_informal_friday_question:
    instruction: "Which question informally asks a friend if Friday works?"
    correct_option: "Czy piątek ci odpowiada?"
    distractors: ["Czy piątek panu odpowiada?", "Jaka to będzie data?"]
    accepted_answers: ["Czy piątek ci odpowiada?", "Czy piątek ci odpowiada"]

  pl.a1.unit03.lesson03.exercise03.comprehend_agreed_day:
    instruction: "Read the line. What day did Ewa agree to?"
    correct_option: "Friday"
    distractors:
      - "Wednesday"
      - "Saturday"
    accepted_answers:
      - "Friday"
      - "piątek"

  pl.a1.unit03.lesson03.exercise04.comprehend_agreed_date:
    instruction: "Read the line. What is the exact date of the meeting?"
    correct_option: "May 15th"
    distractors:
      - "May 10th"
      - "May 5th"
    accepted_answers:
      - "May 15th"
      - "piętnastego maja"

  pl.a1.unit03.lesson03.exercise05.match_questions_and_answers:
    instruction: "Match each question with its natural answer."
    correct_response:
      "Jaki dziś jest dzień tygodnia?": "Dziś jest piątek."
      "Kiedy są twoje urodziny?": "Moje urodziny są dziesiątego maja."
      "Kiedy jest spotkanie?": "Spotkanie jest piętnastego maja."
      "Czy piątek pani odpowiada?": "Piątek mi odpowiada."
      "Jaka to będzie data?": "Piętnastego maja."
      "Kiedy możemy się znowu spotkać?": "Czy piątek ci odpowiada?"

  pl.a1.unit03.lesson03.exercise06.order_friday_suits_me:
    instruction: "Put the sentence 'Friday works for me' in order."
    correct_response: ["Piątek", "mi", "odpowiada"]

  pl.a1.unit03.lesson03.exercise07.order_meet_again_question:
    instruction: "Put the question 'When can we meet again?' in order."
    correct_response: ["Kiedy", "możemy", "się", "znowu", "spotkać"]

  pl.a1.unit03.lesson03.exercise08.fill_formal_woman_question:
    instruction: "Complete the formal question, asked to a woman."
    accepted_answers: ["pani"]
    feedback: "Czy piątek pani odpowiada? -- does Friday work for you (formal, to a woman)?"

  pl.a1.unit03.lesson03.exercise09.fix_dative_form:
    instruction: "Fix the case -- this needs the dative form of 'pan'."
    accepted_answers:
      - "Czy piątek panu odpowiada?"
      - "Czy piątek panu odpowiada"
    feedback: "Czy piątek panu odpowiada? -- odpowiadać takes its object in the dative case (panu, not pan)."

  pl.a1.unit03.lesson03.exercise10.reply_to_friday_question:
    instruction: "Answer that Friday works for you."
    accepted_answers:
      - "Piątek mi odpowiada."
      - "Piątek mi odpowiada"

  pl.a1.unit03.lesson03.exercise11.speak_meeting_date:
    instruction: "Take Ewa's role and say when she and Marek are meeting."
    accepted_answers:
      - "Spotkanie jest piętnastego maja."
      - "Spotkanie jest piętnastego maja"
