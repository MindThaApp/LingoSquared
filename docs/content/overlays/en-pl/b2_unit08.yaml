course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: synthesize and evaluate multiple sources --
    attribute a claim (według / twierdzić / utrzymywać / wynika z... że),
    compare two sources (oba/obie / podczas gdy / w przeciwieństwie do),
    name where they agree (zgadzają się co do) and where they conflict
    (różnią się w opinii co do), and give a reasoned judgement (bardziej
    przekonujący), around two conflicting restaurant reviews.

units:
  pl.b2.unit08.synteza:
    title: "Synthesis"
    description: Synthesize and evaluate multiple sources -- name where two sources agree, where they conflict, and give a reasoned judgement between them.

lessons:
  pl.b2.unit08.lesson01.kto_co_mowi:
    title: "Who says what?"
  pl.b2.unit08.lesson02.dwa_zrodla_obok_siebie:
    title: "Two sources side by side"
  pl.b2.unit08.lesson03.w_czym_sie_zgadzaja:
    title: "Where do they agree?"
  pl.b2.unit08.lesson04.w_czym_sie_roznia:
    title: "Where do they differ?"
  pl.b2.unit08.lesson05.dwie_recenzje:
    title: "Two reviews side by side"
  pl.b2.unit08.lesson06.synteza_w_rozmowie:
    title: "Summarizing and judging"

