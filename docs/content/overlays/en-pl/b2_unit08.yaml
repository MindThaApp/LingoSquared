    title: "to claim / state"
    gloss: "to claim / to state (twierdzi = claims)"
    note: "*Twierdzić* attributes a flat assertion -- neutral, not necessarily doubted."
    example_gloss: "Zosia claims that it is not expensive."
  pl.b2.unit08.lesson01.teach.utrzymywac:
    title: "to maintain / assert"
    gloss: "to maintain / to assert (utrzymuje = maintains)"
    note: "*Utrzymywać* attributes a claim the writer holds firmly to, often against pushback -- slightly stronger/more insistent than *twierdzić*."
