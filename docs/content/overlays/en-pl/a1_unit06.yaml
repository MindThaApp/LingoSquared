    title: "W restauracji"

teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: "Bread"
    gloss: "bread"
    note: "A basic staple food word -- comes up constantly at any meal."
    example_gloss: "This is bread."

  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: "Butter, cheese"
    gloss: "butter; cheese"
    note: "Both are neuter and masculine-inanimate nouns respectively -- neither changes ending after proszę o, as this lesson's grammar note explains."
    example_gloss:
      - "This is butter."
      - "This is cheese."

  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: "Water, milk"
    gloss: "water; milk"
    note: "Woda is feminine (its accusative form wodę appears in this lesson's grammar note); mleko is neuter and never changes."
    example_gloss:
      - "This is water."
      - "This is milk."

  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: "Coffee, tea"
    gloss: "coffee; tea"
    note: "Both feminine -- their accusative forms kawę/herbatę are what you actually say when ordering, covered in this lesson's grammar note."
    example_gloss:
      - "This is coffee."
      - "This is tea."

  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: "Ordering: proszę o + accusative"
    gloss: "Please give me + accusative: coffee -> kawę, tea -> herbatę, water -> wodę. Bread, cheese, and milk don't change."
    note: >-
      *Proszę o* ("please give me," literally "I ask for") is followed by
      the accusative case. Feminine nouns like *kawa*, *herbata*, and
      *woda* swap their final *-a* for *-ę*. Masculine-inanimate nouns
      like *chleb* and *ser*, and neuter nouns like *mleko*, keep exactly
      the same form they have in the dictionary.

  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: "Coffee, please"
    gloss: "Coffee, please."
    note: "The everyday, polite way to order a single item -- puts the grammar note's pattern to work in a full request."

  pl.a1.unit06.lesson02.teach.zupa:
    title: "Soup"
    gloss: "soup"
    note: "A common lunch or dinner item, and often the day's featured dish, as in this unit's own restaurant scene."
    example_gloss: "This is soup."

  pl.a1.unit06.lesson02.teach.sok:
    title: "Juice"
    gloss: "juice"
    note: "Masculine-inanimate, like chleb and ser -- no ending change when you order it."
    example_gloss: "This is juice."

  pl.a1.unit06.lesson02.teach.cukier:
    title: "Sugar"
    gloss: "sugar"
    note: "Useful for coffee or tea -- also masculine-inanimate, no ending change."
    example_gloss: "This is sugar."

  pl.a1.unit06.lesson02.teach.rachunek:
    title: "The bill"
    gloss: "the bill / the check"
    note: "What you ask for at the end of a meal -- proszę o rachunek is the standard, polite way to request it."
    example_gloss: "The bill, please."

  pl.a1.unit06.lesson02.teach.lubic_note:
    title: "To like: lubię, lubi"
    gloss: "to like: I like, he/she likes -- I like coffee. He likes soup."
    note: >-
      *Lubić* is the verb "to like." Like *mieć* back in unit 5, only the
      1st-person (*lubię*) and 3rd-person (*lubi*) forms are taught here.
      *Lubić* also takes the accusative, the same pattern *proszę o*
      uses -- *lubię kawę*, not *lubię kawa*.

  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: "I like soup"
    gloss: "I like soup."
    note: "Zupa becomes zupę in the accusative, the same feminine -a -> -ę shift from lesson 1's grammar note."

  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: "The dish of the day"
    gloss: "The dish of the day is soup."
    note: "*Dnia* is the genitive of *dzień* (day) -- *danie dnia* literally \"the dish of the day,\" the same fixed way a menu would say it."

  pl.a1.unit06.lesson03.teach.polecac_note:
    title: "To recommend: polecam, poleca"
    gloss: "to recommend: I recommend, he/she recommends -- I recommend coffee. He recommends soup."
    note: >-
      *Polecać* is the verb "to recommend" -- a waiter uses it to suggest
      a dish, and a customer uses the same verb to ask for a suggestion.
      It also takes the accusative, same pattern as *proszę o* and
      *lubić*.

  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: "What do you recommend?"
    gloss: "What do you recommend?"
    note: "*Co* (what) plus the formal *pan* -- the natural question to ask a waiter, using the same formal address from unit 1."

  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: "Here you are / you're welcome"
    gloss: "Here you are."
    note: "A flexible, everyday phrase -- said when serving something, and equally natural as a reply to dziękuję (thank you)."

  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: "Coming right up"
    gloss: "Coming right up."
    note: "Literally \"I'm already serving it\" -- a waiter's standard reply confirming an order was heard."

  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: "The waiter announces the special"
    gloss: "The waiter says hello and announces that today's special is soup."
    note: "Dzień dobry, reused from unit 1's greetings."
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: "Ewa asks for a recommendation"
    gloss: "Ewa asks the waiter what he recommends."
    note: "A polite, formal question -- pan addresses the waiter respectfully."
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: "The waiter recommends coffee"
    gloss: "The waiter recommends the coffee."
    note: "Polecam -- the 1st-person form from this lesson's grammar note."
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: "Ewa places her order"
    gloss: "Ewa says okay, and orders coffee and soup."
    note: "Combines proszę o with the new connector i (and), reusing both lesson 1's ordering pattern and this lesson's own soup vocabulary."
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: "The waiter confirms"
    gloss: "The waiter says the order is coming right up."
    note: "A short, natural confirmation before the food arrives."
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: "Ewa asks for the bill"
    gloss: "Ewa says thank you and asks for the bill."
    note: "Reuses dziękuję from unit 1 and proszę o + rachunek from lesson 2."
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: "The waiter hands it over"
    gloss: "The waiter says, here you are."
    note: "The same proszę bardzo taught earlier in this lesson, now doing double duty as a bill hand-off."

exercises:
  pl.a1.unit06.lesson01.exercise01.select_chleb:
    instruction: "Which word means 'bread'?"
    correct_option: "chleb"
    distractors: ["ser", "mleko"]
    accepted_answers: ["chleb"]

  pl.a1.unit06.lesson01.exercise02.select_kawa:
    instruction: "Which word means 'coffee'?"
    correct_option: "kawa"
    distractors: ["herbata", "woda"]
    accepted_answers: ["kawa"]

  pl.a1.unit06.lesson01.exercise03.select_woda:
    instruction: "Which word means 'water'?"
    correct_option: "woda"
    distractors: ["mleko", "kawa"]
    accepted_answers: ["woda"]

  pl.a1.unit06.lesson01.exercise04.match_food_words:
    instruction: "Match each Polish food or drink word to its English meaning."
    correct_response:
      "chleb": "bread"
      "masło": "butter"
      "ser": "cheese"
      "woda": "water"
      "mleko": "milk"
      "kawa": "coffee"
      "herbata": "tea"

  pl.a1.unit06.lesson01.exercise05.order_prosze_o_kawe:
    instruction: "Put the request 'Coffee, please' in order."
    correct_response: ["Proszę", "o", "kawę"]

  pl.a1.unit06.lesson01.exercise06.order_prosze_o_wode:
    instruction: "Put the request 'Water, please' in order."
    correct_response: ["Proszę", "o", "wodę"]

  pl.a1.unit06.lesson01.exercise07.fill_prosze_o_kawe:
    instruction: "Complete the sentence to say 'Coffee, please.'"
    accepted_answers: ["kawę"]
    feedback: "Proszę o kawę -- kawa becomes kawę after proszę o."

  pl.a1.unit06.lesson01.exercise08.fix_accusative_ending:
    instruction: "Fix the ending -- after proszę o, kawa needs its accusative form."
    accepted_answers:
      - "Proszę o kawę."
      - "Proszę o kawę"
    feedback: "Proszę o kawę, not Proszę o kawa -- kawa becomes kawę as the object of proszę o."

  pl.a1.unit06.lesson01.exercise09.speak_prosze_o_herbate:
    instruction: "Say 'Tea, please.'"
    accepted_answers:
      - "Proszę o herbatę."
      - "Proszę o herbatę"

  pl.a1.unit06.lesson02.exercise01.select_zupa:
    instruction: "Which word means 'soup'?"
    correct_option: "zupa"
    distractors: ["sok", "cukier"]
    accepted_answers: ["zupa"]

  pl.a1.unit06.lesson02.exercise02.select_sok:
    instruction: "Which word means 'juice'?"
    correct_option: "sok"
    distractors: ["cukier", "rachunek"]
    accepted_answers: ["sok"]

  pl.a1.unit06.lesson02.exercise03.select_rachunek:
    instruction: "Which word means 'the bill'?"
    correct_option: "rachunek"
    distractors: ["zupa", "sok"]
    accepted_answers: ["rachunek"]

  pl.a1.unit06.lesson02.exercise04.match_more_food_words:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "zupa": "soup"
      "sok": "juice"
      "cukier": "sugar"
      "rachunek": "the bill"
      "chleb": "bread"
      "kawa": "coffee"
      "herbata": "tea"
      "woda": "water"

  pl.a1.unit06.lesson02.exercise05.order_lubie_zupe:
    instruction: "Put the sentence 'I like soup' in order."
    correct_response: ["Lubię", "zupę"]

  pl.a1.unit06.lesson02.exercise06.order_prosze_o_rachunek:
    instruction: "Put the request 'The bill, please' in order."
    correct_response: ["Proszę", "o", "rachunek"]

  pl.a1.unit06.lesson02.exercise07.fill_lubie_zupe:
    instruction: "Complete the sentence to say 'I like soup.'"
    accepted_answers: ["zupę"]
    feedback: "Lubię zupę -- zupa becomes zupę after lubić, same as after proszę o."

  pl.a1.unit06.lesson02.exercise08.fix_accusative_ending:
    instruction: "Fix the ending -- after lubić, zupa needs its accusative form."
    accepted_answers:
      - "Lubię zupę."
      - "Lubię zupę"
    feedback: "Lubię zupę, not Lubię zupa -- zupa becomes zupę as the object of lubić."

  pl.a1.unit06.lesson02.exercise09.speak_lubie_kawe:
    instruction: "Say 'I like coffee.'"
    accepted_answers:
      - "Lubię kawę."
      - "Lubię kawę"

  pl.a1.unit06.lesson03.exercise01.select_recommendation_question:
    instruction: "Which question asks what the waiter recommends?"
    correct_option: "Co pan poleca?"
    distractors: ["Ile to kosztuje?", "Jak się pan ma?"]
    accepted_answers:
      - "Co pan poleca?"
      - "Co pan poleca"

  pl.a1.unit06.lesson03.exercise02.select_dish_of_the_day:
    instruction: "Which line announces today's dish of the day?"
    correct_option: "Dzień dobry! Danie dnia to zupa."
    distractors: ["Polecam kawę.", "Już podaję."]
    accepted_answers:
      - "Dzień dobry! Danie dnia to zupa."

  pl.a1.unit06.lesson03.exercise03.comprehend_waiter_recommendation:
    instruction: "Read the line. What does the waiter recommend?"
    correct_option: "coffee"
    distractors:
      - "tea"
      - "soup"
    accepted_answers:
      - "kawę"
      - "kawa"
      - "coffee"

  pl.a1.unit06.lesson03.exercise04.comprehend_ewa_order:
    instruction: "Read the line. What does Ewa order?"
    correct_option: "coffee and soup"
    distractors:
      - "tea and bread"
      - "juice and cheese"
    accepted_answers:
      - "kawę i zupę"
      - "coffee and soup"

  pl.a1.unit06.lesson03.exercise05.match_restaurant_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "danie": "dish"
      "polecam": "I recommend"
      "już": "already"
      "bardzo": "very much"
      "dziękuję": "thank you"
      "rachunek": "the bill"
      "zupa": "soup"
      "kawa": "coffee"

  pl.a1.unit06.lesson03.exercise06.order_co_pan_poleca:
    instruction: "Put the question 'What do you recommend?' in order."
    correct_response: ["Co", "pan", "poleca"]

  pl.a1.unit06.lesson03.exercise07.order_prosze_o_kawe_i_zupe:
    instruction: "Put the request 'Coffee and soup, please' in order."
    correct_response: ["Proszę", "o", "kawę", "i", "zupę"]

  pl.a1.unit06.lesson03.exercise08.fill_danie_dnia:
    instruction: "Complete the sentence to say 'The dish of the day is soup.'"
    accepted_answers: ["zupa"]
    feedback: "Danie dnia to zupa -- danie dnia (the dish of the day) is the subject here, so zupa stays in its dictionary form."

  pl.a1.unit06.lesson03.exercise09.fix_order_ending:
    instruction: "Fix the endings -- after proszę o, both kawa and zupa need their accusative forms."
    accepted_answers:
      - "Proszę o kawę i zupę."
      - "Proszę o kawę i zupę"
    feedback: "Proszę o kawę i zupę -- both feminine nouns take the -ę ending after proszę o."

  pl.a1.unit06.lesson03.exercise10.reply_co_pan_poleca:
    instruction: "Answer as the waiter: say you recommend the coffee."
    accepted_answers:
      - "Polecam kawę."
      - "Polecam kawę"

  pl.a1.unit06.lesson03.exercise11.speak_thanks_and_bill:
    instruction: "Say thank you, and ask for the bill."
    accepted_answers:
      - "Dziękuję! Proszę o rachunek."
      - "Dziękuję, proszę o rachunek."
      - "Dziękuję Proszę o rachunek"
