teaching:
  pl.a2.unit84.lesson01.teach.miejsca: {"title": "Where and what for", "gloss": "to the shop / to grandmother's / to Kraków / what for", "note": "*Po co* asks for the aim of an action.", "example_gloss": ["I am going to the shop.", "Ewa is going to her grandmother's.", "Marek is going to Kraków.", "What are you going to the shop for?", "I am phoning Marek."]}
  pl.a2.unit84.lesson01.teach.cele: {"title": "Aims", "gloss": "to buy bread / to visit grandmother / to arrange a meeting / to work in Poland / to be healthy", "note": "These infinitives will follow *żeby*.", "example_gloss": ["I want to buy bread.", "Ewa wants to visit her grandmother.", "Marek wants to arrange a meeting.", "Ewa wants to work in Poland."]}
  pl.a2.unit84.lesson01.teach.gn_zeby: {"title": "Żeby + infinitive", "gloss": "I am going to the shop to buy bread. Ewa is going to Kraków to visit her grandmother.", "note": "*Żeby* means 'in order to'. When the same person does both things, the second verb is an infinitive."}
  pl.a2.unit84.lesson01.teach.gn_po_co: {"title": "Po co? Żeby...", "gloss": "What are you going to the shop for? To buy bread. What are you calling Marek for? To arrange a meeting.", "note": "The answer to *po co* starts with *żeby* and an infinitive. It does not need a full sentence."}
  pl.a2.unit84.lesson01.teach.gn_praca: {"title": "More aims", "gloss": "I am learning Polish to work in Poland. Marek exercises to be healthy.", "note": "The infinitive after *żeby* can be any verb: *pracować*, *być*."}
  pl.a2.unit84.lesson02.teach.cele: {"title": "Aims to avoid or reach", "gloss": "so as not to be late / so as not to forget / to rest", "note": "For a negative aim put *nie* after *żeby*.", "example_gloss": ["I get up early so as not to be late.", "I write the number down so as not to forget.", "Marek goes to the park to rest."]}
  pl.a2.unit84.lesson02.teach.gn_zeby_nie: {"title": "Żeby nie", "gloss": "I get up early so as not to be late. I write the number down so as not to forget.", "note": "*Żeby nie* + infinitive says what you want to avoid. The reflexive *się* stands between *żeby* and *nie*: *żeby się nie spóźnić*."}
  pl.a2.unit84.lesson02.teach.gn_po_to: {"title": "Po to, żeby", "gloss": "Marek learns Polish in order to work in Poland. I go to the park in order to rest.", "note": "*Po to, żeby* is a stronger way to say 'for the purpose of'. After the comma the sentence works like *żeby* alone."}
  pl.a2.unit84.lesson02.teach.gn_bo_zeby: {"title": "Reason or aim", "gloss": "I am going to the shop because I have no bread. I am going to the shop to buy bread.", "note": "*Bo* gives a reason: a fact that already holds. *Żeby* gives an aim: what you want to happen next."}
  pl.a2.unit84.lesson03.teach.braki: {"title": "Missing things", "gloss": "I have no bread / I have no milk / I have no time", "note": "After *nie mam* the object is in the genitive: *chleba*, *mleka*, *czasu*.", "example_gloss": ["I have no bread.", "I have no milk.", "I have no time.", "I am going to the shop because I have no milk."]}
  pl.a2.unit84.lesson03.teach.gn_bo: {"title": "Two questions", "gloss": "I am going to the shop because I have no milk. I am going to the shop to buy milk.", "note": "*Bo* answers 'why' with a fact. *Żeby* answers 'what for' with a goal."}
  pl.a2.unit84.lesson03.teach.gn_pytanie: {"title": "Dlaczego or po co", "gloss": "Why are you going to the shop? Because I have no milk. What are you going to the shop for? To buy milk.", "note": "Match the question to the answer: *dlaczego* with *bo*, *po co* with *żeby*."}
  pl.a2.unit84.lesson03.teach.gn_dom: {"title": "One action, two answers", "gloss": "Marek is staying at home because he is ill. Marek is staying at home to rest.", "note": "The same action can have a reason and an aim."}
  pl.a2.unit84.lesson04.teach.prosby: {"title": "Wishes about other people", "gloss": "I want you to come (man) / I ask you to call (man) / Marek wants Ewa to come", "note": "When the person who does the second action is a different person, *żeby* is followed by a past form (here you only need to recognise it). *Cię* means 'you' (object).", "example_gloss": ["I want you to come (to a man).", "I want you to come (to a woman).", "I ask you to call (to a man).", "Marek wants Ewa to come."]}
  pl.a2.unit84.lesson04.teach.gn_zebys: {"title": "Żebyś + past form", "gloss": "I want you to come (to a man). I want you to come (to a woman).", "note": "*Żebyś* is *żeby* + *-ś* (you). The verb has a past-tense ending that matches the gender: *przyszedł* for a man, *przyszła* for a woman."}
  pl.a2.unit84.lesson04.teach.gn_trzecia: {"title": "Żeby with a name", "gloss": "Marek wants Ewa to come. Ewa wants Marek to call.", "note": "With a name or *on*/*ona* there is no ending on *żeby*: *żeby Ewa przyszła*. The past form agrees with the person who acts."}
  pl.a2.unit84.lesson04.teach.gn_ja: {"title": "Same person or different person", "gloss": "Marek wants me to come (I am a man). I want to come. I want you to come.", "note": "If the same person wants and acts, use an infinitive (*chcę przyjść*). If different people, use *żeby* + past form. *Żebym* means 'that I'."}
  pl.a2.unit84.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "I am learning / today / for the lesson", "note": "*Na lekcję* is the aim of a trip or a deadline: late for the lesson.", "example_gloss": ["I am learning Polish.", "Today I am going to the shop.", "I am late for the lesson."]}
  pl.a2.unit84.lesson05.teach.gn_ewa: {"title": "Ewa's aims", "gloss": "I am learning Polish to work in Poland. I get up early so as not to be late for the lesson.", "note": "Ewa links her habits with their aims."}
  pl.a2.unit84.lesson05.teach.gn_ewa2: {"title": "Ewa and Marek", "gloss": "Then I phone Marek to arrange a meeting. I want him to come.", "note": "The last sentence has a different subject: *chcę, żeby przyszedł*."}
  pl.a2.unit84.lesson05.teach.lectura: {"title": "Ewa tells her day", "gloss": "I am learning Polish to work in Poland. I get up early so as not to be late for the lesson. Today I am going to the shop to buy milk. Then I phone Marek to arrange a meeting. I want him to come.", "note": "Ewa explains her day in one voice, with an aim for each action.", "glosses": {"żeby": "in order to", "pracować": "to work", "kupić": "to buy", "umówić": "to arrange", "przyszedł": "he came / come"}}
  pl.a2.unit84.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. What are you going to the shop for?"}
  pl.a2.unit84.lesson06.teach.d2: {"title": "Ewa answers", "gloss": "Ewa: To buy milk and bread. I have no milk."}
  pl.a2.unit84.lesson06.teach.d3: {"title": "Marek says", "gloss": "Marek: I am going to the park to rest."}
  pl.a2.unit84.lesson06.teach.d4: {"title": "Ewa asks", "gloss": "Ewa: I want you to call Nina."}
  pl.a2.unit84.lesson06.teach.d5: {"title": "Marek asks why", "gloss": "Marek: What for should I call?"}
  pl.a2.unit84.lesson06.teach.d6: {"title": "Ewa explains", "gloss": "Ewa: To arrange a meeting."}
  pl.a2.unit84.lesson06.teach.d7: {"title": "Marek agrees", "gloss": "Marek: All right, I will call."}
exercises:
  pl.a2.unit84.lesson01.exercise01.elige_zeby: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Idę do sklepu, żeby kupić chleb.", "distractors": ["Idę do sklepu, żeby kupuję chleb.", "Idę do sklepu, bo kupić chleb.", "Idę do sklepu żeby kupiłem chleb."], "accepted_answers": [{"value": "Idę do sklepu, żeby kupić chleb.", "status": "correct"}], "feedback": "After *żeby* the same person uses the infinitive: *kupić*."}
  pl.a2.unit84.lesson01.exercise02.elige_babcia: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa jedzie do Krakowa, żeby odwiedzić babcię.", "distractors": ["Ewa jedzie do Krakowa, żeby odwiedza babcię.", "Ewa jedzie do Krakowa, żeby odwiedzić babcia.", "Ewa jedzie do Krakowa, bo odwiedzić babcię."], "accepted_answers": [{"value": "Ewa jedzie do Krakowa, żeby odwiedzić babcię.", "status": "correct"}], "feedback": "*Żeby odwiedzić babcię*: infinitive, and *babcię* as the object."}
  pl.a2.unit84.lesson01.exercise03.une_cele: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "żeby", "right": "in order to"}, {"left": "po co", "right": "what for"}, {"left": "do sklepu", "right": "to the shop"}, {"left": "kupić chleb", "right": "to buy bread"}, {"left": "odwiedzić babcię", "right": "to visit grandmother"}, {"left": "umówić spotkanie", "right": "to arrange a meeting"}, {"left": "pracować w Polsce", "right": "to work in Poland"}, {"left": "być zdrowy", "right": "to be healthy"}], "status": "correct"}], "feedback": "Aims and the word for 'in order to'."}
  pl.a2.unit84.lesson01.exercise04.ordena_zeby: {"instruction": "Put the words in order to say 'I am going to the shop to buy bread.'", "correct_option": "Idę do sklepu żeby kupić chleb", "accepted_answers": [{"value": "Idę do sklepu żeby kupić chleb", "status": "correct"}, {"value": "Żeby kupić chleb idę do sklepu", "status": "correct"}], "feedback": "The aim can also come first."}
