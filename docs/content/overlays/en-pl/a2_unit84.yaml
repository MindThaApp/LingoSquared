  pl.a2.unit84.lesson04.exercise05.completa_zebys: {"instruction": "Complete with the word that means 'that you'.", "correct_option": "żebyś", "accepted_answers": [{"value": "żebyś", "status": "correct"}], "feedback": "*Żebyś* + *przyszła* when speaking to a woman."}
