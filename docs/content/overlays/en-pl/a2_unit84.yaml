  pl.a2.unit84.lesson03.exercise07.escribe_dom: {"instruction": "Write one Polish sentence.", "correct_option": "Marek zostaje w domu, żeby odpocząć.", "accepted_answers": [{"value": "Marek zostaje w domu, żeby odpocząć.", "status": "correct"}, {"value": "Marek zostaje w domu, żeby odpocząć", "status": "correct"}, {"value": "Marek zostaje w domu po to, żeby odpocząć.", "status": "correct"}, {"value": "Marek zostaje w domu po to, żeby odpocząć", "status": "correct"}], "feedback": "An aim: *żeby odpocząć*."}
  pl.a2.unit84.lesson04.exercise01.elige_zebys: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Chcę, żebyś przyszedł.", "distractors": ["Chcę, żebyś przyjść.", "Chcę, żebyś przyszła.", "Chcę, żeby przyszedł."], "accepted_answers": [{"value": "Chcę, żebyś przyszedł.", "status": "correct"}], "feedback": "To a man: *żebyś przyszedł*."}
  pl.a2.unit84.lesson04.exercise02.elige_ewa: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek chce, żeby Ewa przyszła.", "distractors": ["Marek chce, żeby Ewa przyszedł.", "Marek chce, żeby Ewa przyjść.", "Marek chce, żebym Ewa przyszła."], "accepted_answers": [{"value": "Marek chce, żeby Ewa przyszła.", "status": "correct"}], "feedback": "*Ewa* is a woman, so *przyszła*."}
  pl.a2.unit84.lesson04.exercise03.une_formy: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "żebyś przyszedł", "right": "that you (man) come"}, {"left": "żebyś przyszła", "right": "that you (woman) come"}, {"left": "żebym przyszedł", "right": "that I (man) come"}, {"left": "żeby Ewa przyszła", "right": "that Ewa come"}, {"left": "chcę przyjść", "right": "I want to come (I do both)"}, {"left": "chcę, żebyś przyszedł", "right": "I want you to come"}, {"left": "proszę cię", "right": "I ask you"}, {"left": "żebyś zadzwonił", "right": "that you (man) call"}], "status": "correct"}], "feedback": "Forms with żeby."}
