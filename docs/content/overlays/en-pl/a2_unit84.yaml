  pl.a2.unit84.lesson02.exercise06.traduce_nie: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Marek wstaje wcześnie, żeby się nie spóźnić.", "status": "correct"}, {"value": "Marek wstaje wcześnie, żeby się nie spóźnić", "status": "correct"}], "feedback": "*Wstaje* for he, and *żeby się nie spóźnić*."}
  pl.a2.unit84.lesson02.exercise07.escribe_nie: {"instruction": "Write one Polish sentence.", "correct_option": "Idę do parku, żeby odpocząć.", "accepted_answers": [{"value": "Idę do parku, żeby odpocząć.", "status": "correct"}, {"value": "Idę do parku, żeby odpocząć", "status": "correct"}, {"value": "Idę do parku po to, żeby odpocząć.", "status": "correct"}, {"value": "Idę do parku po to, żeby odpocząć", "status": "correct"}], "feedback": "*Idę do parku, żeby odpocząć.*"}
  pl.a2.unit84.lesson03.exercise01.elige_bo: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Idę do sklepu, bo nie mam mleka.", "distractors": ["Idę do sklepu, żeby nie mam mleka.", "Idę do sklepu, żeby mleka.", "Idę do sklepu, bo kupić mleko."], "accepted_answers": [{"value": "Idę do sklepu, bo nie mam mleka.", "status": "correct"}], "feedback": "A fact (*nie mam mleka*) needs *bo*."}
  pl.a2.unit84.lesson03.exercise02.elige_zeby: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Idę do sklepu, żeby kupić mleko.", "distractors": ["Idę do sklepu, bo kupić mleko.", "Idę do sklepu, żeby kupuję mleko.", "Idę do sklepu, żeby nie kupić mleka."], "accepted_answers": [{"value": "Idę do sklepu, żeby kupić mleko.", "status": "correct"}], "feedback": "A goal (*kupić mleko*) needs *żeby* and an infinitive."}
  pl.a2.unit84.lesson03.exercise03.une_pytania: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Dlaczego?", "right": "Why? (asks for a reason)"}, {"left": "Po co?", "right": "What for? (asks for an aim)"}, {"left": "bo", "right": "because (a reason)"}, {"left": "żeby", "right": "in order to (an aim)"}, {"left": "nie mam mleka", "right": "I have no milk"}, {"left": "kupić mleko", "right": "to buy milk"}, {"left": "zostaje w domu", "right": "he stays at home"}, {"left": "jest chory", "right": "he is ill"}], "status": "correct"}], "feedback": "Questions, answers and facts."}
  pl.a2.unit84.lesson03.exercise04.ordena_dom: {"instruction": "Put the words in order to say 'Marek is staying at home because he is ill.'", "correct_option": "Marek zostaje w domu bo jest chory", "accepted_answers": [{"value": "Marek zostaje w domu bo jest chory", "status": "correct"}], "feedback": "*Bo* gives the reason."}
  pl.a2.unit84.lesson03.exercise05.completa_bo: {"instruction": "Complete with the word that gives the reason. Two words are possible.", "correct_option": "bo", "accepted_answers": [{"value": "bo", "status": "correct"}, {"value": "ponieważ", "status": "correct"}], "feedback": "A fact is introduced by *bo* or *ponieważ*."}
