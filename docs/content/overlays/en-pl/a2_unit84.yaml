  pl.a2.unit84.lesson01.exercise06.traduce_zeby: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Dzwonię do Marka, żeby umówić spotkanie.", "status": "correct"}, {"value": "Dzwonię do Marka, żeby umówić spotkanie", "status": "correct"}, {"value": "Żeby umówić spotkanie, dzwonię do Marka.", "status": "correct"}, {"value": "Żeby umówić spotkanie, dzwonię do Marka", "status": "correct"}], "feedback": "*Żeby umówić spotkanie* is the aim."}
  pl.a2.unit84.lesson01.exercise07.escribe_zeby: {"instruction": "Write one Polish sentence.", "correct_option": "Jadę do Krakowa, żeby odwiedzić babcię.", "accepted_answers": [{"value": "Jadę do Krakowa, żeby odwiedzić babcię.", "status": "correct"}, {"value": "Jadę do Krakowa, żeby odwiedzić babcię", "status": "correct"}], "feedback": "*Jadę do Krakowa, żeby odwiedzić babcię.*"}
  pl.a2.unit84.lesson02.exercise01.elige_nie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Wstaję wcześnie, żeby się nie spóźnić.", "distractors": ["Wstaję wcześnie, żeby nie się spóźnić.", "Wstaję wcześnie, żeby się spóźnić.", "Wstaję wcześnie, bo się nie spóźnić."], "accepted_answers": [{"value": "Wstaję wcześnie, żeby się nie spóźnić.", "status": "correct"}], "feedback": "*Się* goes before *nie*: *żeby się nie spóźnić*."}
  pl.a2.unit84.lesson02.exercise02.elige_odpoczac: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek idzie do parku, żeby odpocząć.", "distractors": ["Marek idzie do parku, żeby odpoczywa.", "Marek idzie do parku, żeby nie odpocząć.", "Marek idzie do parku, bo odpocząć."], "accepted_answers": [{"value": "Marek idzie do parku, żeby odpocząć.", "status": "correct"}], "feedback": "*Żeby odpocząć*: the aim in the infinitive."}
  pl.a2.unit84.lesson02.exercise03.une_nie: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "żeby się nie spóźnić", "right": "so as not to be late"}, {"left": "żeby nie zapomnieć", "right": "so as not to forget"}, {"left": "żeby odpocząć", "right": "to rest"}, {"left": "po to, żeby", "right": "in order to (stronger)"}, {"left": "bo", "right": "because (a reason)"}, {"left": "żeby", "right": "in order to (an aim)"}, {"left": "wstaję wcześnie", "right": "I get up early"}, {"left": "zapisuję numer", "right": "I write the number down"}], "status": "correct"}], "feedback": "Aims and reasons."}
