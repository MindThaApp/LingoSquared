answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polish A1
  description: 'Beginner Polish for handling basic money matters: asking a total price, choosing a payment method, splitting a bill, and handling change.'
units:
  pl.a1.unit23.pieniadze:
    title: Money and paying
lessons:
  pl.a1.unit23.lesson01.ile_to_kosztuje_w:
    title: How much does it cost in total?
  pl.a1.unit23.lesson02.karta_czy_gotowka:
    title: Card or cash?
  pl.a1.unit23.lesson03.dzielenie_rachunku:
    title: Splitting the bill
  pl.a1.unit23.lesson04.reszta:
    title: Change
  pl.a1.unit23.lesson05.czytanie_rachunku_z_restauracji:
    title: Reading a restaurant receipt
  pl.a1.unit23.lesson06.ewa_i_marek_placa:
    title: Ewa and Marek pay the bill
teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Asking the total price
    gloss: How much does it cost in total?
    note: '*W sumie* (in total) clarifies that you want the full combined price, not one item''s price.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Stating a total price
    gloss: It costs twenty-five zloty in total.
    note: '*Kosztuje* is the *on/ona/ono* form of *kosztować* (to cost). Numbers from 5 up take the genitive plural: *dwadzieścia pięć złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Paying by card or in cash
    gloss: to pay by card, to pay cash
    note: '*Płacić kartą* (to pay by card) and *płacić gotówką* (to pay cash) both use the instrumental after *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Can I pay by card here?
    - I'm paying in cash.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Asking if card payment is possible
    gloss: Can I pay by card here?
    note: '*Tu* (here) places the question at the current location; *czy* opens a yes/no question and *mogę* means ''I can''.'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Asking about payment preference
    gloss: Would you like to pay cash or by card?
    note: '*Czy chce pan ...?* is the formal version of *Czy chcesz ...?*, used here by an unfamiliar cashier (*pan* for a man, *pani* for a woman).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: The bill
    gloss: the bill
    note: 'A masculine noun: *rachunek* (genitive *rachunku*).'
    example_gloss: Shall we split the bill?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Suggesting to split the bill
    gloss: Shall we split the bill?
    note: '*Może podzielimy ...?* is a polite way to suggest something together; *podzielimy* is the *my* form of *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Asking to pay separately
    gloss: May I pay separately?
    note: '*Osobno* (separately) goes with *zapłacić* (to pay, perfective: one finished payment).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: The change
    gloss: the change
    note: 'A feminine noun: *reszta* (genitive *reszty*, as in *nie potrzebuję reszty*).'
    example_gloss: Here's your change.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Handing over change
    gloss: Here's your change.
    note: '*Pana* is the formal ''your'' (to a man; *pani* for a woman), matching the formal register at a counter.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Declining change
    gloss: I don't need change.
    note: '*Nie potrzebuję* + genitive: negation puts the object in the genitive, so *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Thirty-five
    gloss: thirty-five
    note: '*Trzydzieści pięć* is written as two words: tens first, then units (30 + 5).'
    example_gloss: It costs thirty-five zloty.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Read a restaurant bill
    gloss: 'Bill: two main courses and two coffees. Total: thirty-five zloty. Paid by card.'
    note: Track what was ordered, the total, and how it was paid.
    glosses:
      Rachunek: bill
      dwa: two
      dania główne: main courses
      kawy: coffees
      Razem: total
      trzydzieści pięć: thirty-five
      złotych: zloty
      Zapłacono: paid
      kartą: card
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa asks for the bill
    gloss: 'Ewa: Shall we ask for the bill?'
    note: '*Poprosić o* (to ask for) is followed by the accusative: *o rachunek*. *Poprosimy* is the perfective future.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek asks the total
    gloss: 'Marek: Yes, good idea. How much does it cost in total?'
    note: Reuses the *Ile to kosztuje w sumie?* question from lesson 1.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa states the total
    gloss: 'Ewa: It''s thirty-five zloty. Shall we split it?'
    note: '*Podzielimy się?* (literally ''shall we divide?'') uses the reflexive *się* to mean sharing the bill.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek insists on paying
    gloss: 'Marek: No, let me pay today. You''ve helped me so much.'
    note: '*Dzisiaj ja płacę* (literally ''today I pay'') is the standard way to offer to pay; *pomogłaś* is the feminine past of *pomóc* (to help), since Marek speaks to Ewa.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa is touched
    gloss: 'Ewa: That''s sweet of you! Thank you.'
    note: '*Miło z twojej strony* (kind of you) is a warm, common compliment for a generous gesture; *z* + genitive: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek asks about paying by card
    gloss: 'Marek: Can I pay by card here?'
    note: Reuses the *Czy mogę tu zapłacić kartą?* question from lesson 2, now in the actual restaurant.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: the he/she form'
    gloss: Marek pays the bill.
    note: '*Płaci* is the *on/ona/ono* form of *płacić* (to pay).'
