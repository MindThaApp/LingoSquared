answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on connecting ideas."
  learning_goal: "Connect ideas in Polish with reasons, sequence, purpose, conditions, indirect questions and reported messages."
units:
  pl.a2.unit86.nie_wiem_czy: {"title": "I Don't Know Where the Station Is", "description": "Ask and report indirect questions with czy, gdzie, kiedy, o której godzinie and ile, after nie wiem, wiesz, pytam and chcę wiedzieć."}
lessons:
  pl.a2.unit86.lesson01.czy: {"title": "I Don't Know Whether"}
  pl.a2.unit86.lesson02.gdzie_kiedy: {"title": "Where, When, How Much"}
  pl.a2.unit86.lesson03.wiesz_czy_wie_pan: {"title": "Do You Know?"}
  pl.a2.unit86.lesson04.pytam: {"title": "I Ask Whether"}
  pl.a2.unit86.lesson05.ewa_na_dworcu: {"title": "Ewa at the Station"}
  pl.a2.unit86.lesson06.rozmowa: {"title": "Ewa and Marek Talk"}
teaching:
  pl.a2.unit86.lesson01.teach.wiem: {"title": "To know", "gloss": "I know / I do not know / you know", "note": "*Wiedzieć* is irregular: *wiem*, *wiesz*, *wie*. It starts many indirect questions.", "example_gloss": ["I do not know whether I have time.", "Do you know whether Marek has time?", "I know that Ewa is at work."]}
  pl.a2.unit86.lesson01.teach.pytania: {"title": "Direct questions", "gloss": "Will Marek come? Do you have time? Is the train leaving?", "note": "These are direct yes or no questions with *czy*.", "example_gloss": ["Will Marek come?", "Do you have time?", "Does the train leave at six?"]}
  pl.a2.unit86.lesson01.teach.gn_czy: {"title": "Indirect yes or no question", "gloss": "I do not know whether Marek will come. I do not know whether I have time.", "note": "After *nie wiem* the question becomes part of the sentence. Keep *czy* and the words as in the direct question. The sentence ends with a full stop."}
  pl.a2.unit86.lesson01.teach.gn_wiesz: {"title": "Asking someone", "gloss": "Do you know whether Marek will come? Do you know whether the train leaves at six?", "note": "If you ask *wiesz*, the whole sentence is a question, so it ends with a question mark."}
  pl.a2.unit86.lesson01.teach.gn_mam: {"title": "Same word order", "gloss": "I do not know whether I have time. I do not know whether the train leaves at six.", "note": "The verb keeps its person: *mam*, *odjeżdża*. Only *czy* is added."}
  pl.a2.unit86.lesson02.teach.miejsca: {"title": "Places and things", "gloss": "station / bank / office / ticket", "note": "Common things to ask about in town.", "example_gloss": ["The station is near.", "The bank is near.", "The office is in the town.", "The ticket is at home."]}
  pl.a2.unit86.lesson02.teach.pytania: {"title": "Question words", "gloss": "where / when / at what time / how much does it cost", "note": "Question words for details.", "example_gloss": ["Where is the station?", "When does the train leave?", "At what time does the train leave?", "How much does the ticket cost?"]}
  pl.a2.unit86.lesson02.teach.gn_gdzie: {"title": "Gdzie", "gloss": "I do not know where the station is. I do not know where Marek lives.", "note": "The question word stands at the start of the clause; there is no *czy*. The rest keeps its order."}
  pl.a2.unit86.lesson02.teach.gn_kiedy: {"title": "Kiedy and o której", "gloss": "I do not know when the train leaves. I do not know at what time the meeting is.", "note": "*Kiedy* asks for a time in general, *o której godzinie* for a clock time."}
  pl.a2.unit86.lesson02.teach.gn_ile: {"title": "Ile", "gloss": "I do not know how much the ticket costs. I do not know how much it costs.", "note": "*Ile* asks about price or amount."}
  pl.a2.unit86.lesson03.teach.grzecznie: {"title": "Polite forms", "gloss": "excuse me / do you know (to a man) / do you know (to a woman)", "note": "To a stranger use *pan* for a man and *pani* for a woman, with *wie* (not *wiesz*).", "example_gloss": ["Excuse me, do you know where the bank is? (to a man)", "Excuse me, do you know when the train leaves? (to a woman)", "Do you know when the train leaves? (to a friend)"]}
  pl.a2.unit86.lesson03.teach.gn_bezposrednie: {"title": "Direct and indirect", "gloss": "Where is the station? Do you know where the station is?", "note": "To make a direct question indirect, add *wiesz* in front. The question word and the word order stay the same."}
  pl.a2.unit86.lesson03.teach.gn_pan: {"title": "Polite", "gloss": "Do you know where the bank is? (to a man) Do you know when the train leaves? (to a woman)", "note": "With strangers, *czy wie pan* or *czy wie pani* is the polite form. The second *czy* is not needed."}
  pl.a2.unit86.lesson03.teach.gn_porzadek: {"title": "Free subject order", "gloss": "I do not know where Marek lives. I do not know where Marek lives.", "note": "The subject may stand before or after the verb; both are correct."}
  pl.a2.unit86.lesson04.teach.pytam: {"title": "Asking verbs", "gloss": "I ask / he asks, she asks / I want to know", "note": "*Pytać* means to ask a question. *Chcę wiedzieć* opens an indirect question too.", "example_gloss": ["I am asking whether you have time.", "Ewa asks whether Marek will come.", "I want to know how much the ticket costs."]}
  pl.a2.unit86.lesson04.teach.gn_pytam: {"title": "Pytam", "gloss": "I am asking whether you have time. I am asking where the bank is.", "note": "*Pytam* works like *nie wiem*: *czy* for yes or no, a question word for details."}
  pl.a2.unit86.lesson04.teach.gn_pyta: {"title": "Pyta", "gloss": "Ewa asks whether Marek will come. Marek asks where the station is.", "note": "*Pyta* is for he or she. The rest of the sentence keeps the same words."}
  pl.a2.unit86.lesson04.teach.gn_chce: {"title": "Chcę wiedzieć", "gloss": "I want to know how much the ticket costs. I want to know whether the train leaves.", "note": "*Chcę wiedzieć* is a plain way to say you need information."}
  pl.a2.unit86.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "at the station / to Kraków / I ask the gentleman", "note": "*Na dworcu* is the locative of *dworzec*: at the station.", "example_gloss": ["I am at the station.", "The train goes to Kraków.", "I ask the gentleman where the bank is."]}
  pl.a2.unit86.lesson05.teach.gn_ewa: {"title": "What Ewa does not know", "gloss": "I do not know at what time the train to Kraków leaves. I do not know how much the ticket costs.", "note": "Ewa uses *nie wiem* with two different question words."}
  pl.a2.unit86.lesson05.teach.gn_ewa2: {"title": "Ewa asks", "gloss": "I ask the gentleman whether he knows where the bank is.", "note": "Two indirect questions in a row: *czy wie* and *gdzie jest bank*."}
  pl.a2.unit86.lesson05.teach.lectura: {"title": "Ewa at the station", "gloss": "I am at the station. I do not know at what time the train to Kraków leaves. I do not know how much the ticket costs. I ask the gentleman whether he knows where the bank is.", "note": "Ewa is at the station and asks for help. She is the only speaker.", "glosses": {"wiem": "I know (with nie: I do not know)", "pytam": "I ask", "czy": "whether", "gdzie": "where", "ile": "how much"}}
  pl.a2.unit86.lesson06.teach.d1: {"title": "Ewa asks", "gloss": "Ewa: Hi, Marek. Do you know where the station is?"}
  pl.a2.unit86.lesson06.teach.d2: {"title": "Marek answers", "gloss": "Marek: Yes, it is near. What are you asking for?"}
  pl.a2.unit86.lesson06.teach.d3: {"title": "Ewa explains", "gloss": "Ewa: I want to know at what time the train to Kraków leaves."}
  pl.a2.unit86.lesson06.teach.d4: {"title": "Marek offers", "gloss": "Marek: I do not know, but I will ask at the station."}
  pl.a2.unit86.lesson06.teach.d5: {"title": "Ewa thanks", "gloss": "Ewa: Thank you! I do not know whether I have time."}
  pl.a2.unit86.lesson06.teach.d6: {"title": "Marek adds", "gloss": "Marek: I will also ask how much the ticket costs."}
