  pl.a2.unit86.lesson06.exercise01.escucha_apertura: {"instruction": "Listen and select the line you hear.", "correct_option": "Cześć, Marku. Wiesz, gdzie jest dworzec?", "distractors": ["Cześć, Ewo. Wiesz, gdzie jest dworzec?", "Cześć, Marku. Wiesz, gdzie jest bank?", "Cześć, Marku. Wiesz, kiedy jest dworzec?"], "accepted_answers": [{"value": "Cześć, Marku. Wiesz, gdzie jest dworzec?", "status": "correct"}], "feedback": "Ewa opens with *Wiesz, gdzie jest dworzec?*"}
  pl.a2.unit86.lesson06.exercise02.entiende_ewa: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "When the train to Kraków leaves.", "distractors": ["Where the bank is.", "How much a ticket costs.", "Where Marek lives."], "accepted_answers": [{"value": "When the train to Kraków leaves.", "status": "correct"}], "feedback": "Ewa says: *Chcę wiedzieć, o której godzinie odjeżdża pociąg do Krakowa.*"}
  pl.a2.unit86.lesson06.exercise03.une_dialogo: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Wiesz, gdzie jest dworzec?", "right": "Do you know where the station is?"}, {"left": "Tak, jest blisko.", "right": "Yes, it is near."}, {"left": "Po co pytasz?", "right": "What are you asking for?"}, {"left": "Chcę wiedzieć, o której godzinie odjeżdża pociąg.", "right": "I want to know at what time the train leaves."}, {"left": "Nie wiem, ale zapytam.", "right": "I do not know, but I will ask."}, {"left": "Nie wiem, czy mam czas.", "right": "I do not know whether I have time."}, {"left": "Zapytam, ile kosztuje bilet.", "right": "I will ask how much the ticket costs."}], "status": "correct"}], "feedback": "Lines from the conversation."}
  pl.a2.unit86.lesson06.exercise04.ordena_ewa: {"instruction": "Put the words in order to say 'I want to know at what time the train leaves. (Ewa is speaking.)'", "correct_option": "Chcę wiedzieć o której godzinie odjeżdża pociąg", "accepted_answers": [{"value": "Chcę wiedzieć o której godzinie odjeżdża pociąg", "status": "correct"}], "feedback": "*Chcę wiedzieć* + *o której godzinie*."}
  pl.a2.unit86.lesson06.exercise05.responde_dworzec: {"instruction": "Answer as Marek: say yes, it is near.", "correct_option": "Tak, jest blisko.", "accepted_answers": [{"value": "Tak, jest blisko.", "status": "correct"}, {"value": "Tak, jest blisko", "status": "correct"}, {"value": "Tak, wiem. Jest blisko.", "status": "correct"}, {"value": "Tak, wiem. Jest blisko", "status": "correct"}], "feedback": "*Tak, jest blisko.*"}
  pl.a2.unit86.lesson06.exercise06.traduce_dialogo: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Chcę wiedzieć, kiedy odjeżdża pociąg.", "status": "correct"}, {"value": "Chcę wiedzieć, kiedy odjeżdża pociąg", "status": "correct"}, {"value": "Chcę wiedzieć, kiedy pociąg odjeżdża.", "status": "correct"}, {"value": "Chcę wiedzieć, kiedy pociąg odjeżdża", "status": "correct"}], "feedback": "*Chcę wiedzieć* + *kiedy*."}
