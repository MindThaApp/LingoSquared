  pl.a2.unit86.lesson04.exercise01.elige_pyta: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek pyta, gdzie jest dworzec.", "distractors": ["Marek pyta, że jest dworzec.", "Marek pyta, czy gdzie jest dworzec.", "Marek pyta, gdzie jest dworca."], "accepted_answers": [{"value": "Marek pyta, gdzie jest dworzec.", "status": "correct"}], "feedback": "*Pyta* + *gdzie* + the clause."}
