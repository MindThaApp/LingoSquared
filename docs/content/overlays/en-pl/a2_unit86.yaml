  pl.a2.unit86.lesson01.exercise02.elige_wiesz: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Wiesz, czy Ewa ma czas?", "distractors": ["Wiesz, że Ewa ma czas?", "Wiesz, czy Ewa miała czas?", "Wiem, czy Ewa ma czas."], "accepted_answers": [{"value": "Wiesz, czy Ewa ma czas?", "status": "correct"}], "feedback": "*Wiesz, czy Ewa ma czas?* is a question about a fact."}
