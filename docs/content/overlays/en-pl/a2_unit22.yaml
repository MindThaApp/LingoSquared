  required_next_reviewer: native_speaker_pass
  notes: >-
    Second en-pl A2 overlay, written for pl/a2_unit22_opinie.yaml
    (schema_version 1.1, §19 format from the start). No sibling-direction
    overlay exists yet (pl-en unauthored), so §8 doesn't apply -- noted for
    whoever authors pl-en next: do not consult this file for structure or
    phrasing.

    This unit has no genuinely two-clause accepted_answers case beyond what
    a single natural sentence with an embedded reason already covers
    (Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne is one
    fluid sentence, not two independent clauses joined by "and" -- there is
    no comma/period/conjunction-variant ambiguity the way unit21's
    reason-clause answer had, since "bo" here is the ONLY natural connector
    a learner would produce for this specific opinion-plus-reason
    construction). Every note/feedback string mixing Polish text inline
    with English wraps the Polish in *asterisks* per §15. Every
    matching_pairs correct_response and word_order correct_response checked
    token-for-token against the realization's own pairs/word_bank. No stray
    YAML boolean coercion. Pending fresh-context review per AUTHORING_GUIDE
    §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    teach.sprobuje_jeszcze_raz example_gloss updated to match the new example;
    lesson02.exercise08 -- instruction "give your opinion and reason" was
    underdetermined against one keyed sentence -> pinned to "say that in your
    opinion the restaurant is good, because the food is tasty", plus
    *ponieważ* and subject-dropped (*Moim zdaniem jest dobra...*) variants;
    lesson03.exercise05 -- instruction matched to the now-shown two lines;
    lesson03.exercise10 -- instruction said "Marek asks ... Answer as Marek"
    (Marek answering himself; canon is Ewa praising the restaurant) -> "Ewa
    asks"; added *Nie, nie zgadzam się.* and *Nie zgadzam się z tobą.*
    (natural replies to a yes/no question, the latter taught in lesson02).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-21: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !, ,) may
    be omitted or varied in typed answers, but the fully punctuated form
    remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit22.opinie:
    title: "Opinions"

lessons:
  pl.a2.unit22.lesson01.slownictwo_opinii:
    title: "Opinion vocabulary"
  pl.a2.unit22.lesson02.moim_zdaniem:
    title: "In my opinion"
  pl.a2.unit22.lesson03.rozmowa_o_restauracji:
    title: "A conversation about the restaurant"

teaching:
  pl.a2.unit22.lesson01.teach.recap_words:
    title: "Is, are, this, yes, no -- again"
    gloss: "jest, są, to, tak, nie, ale, bardzo, lubię, restauracja -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them to talk about opinions."

  pl.a2.unit22.lesson01.teach.opinia:
    title: "Opinion"
    gloss: "opinion"
    note: "A feminine noun."
    example_gloss: "I have an opinion about the movie."

  pl.a2.unit22.lesson01.teach.mysle_ze:
    title: "I think that"
    gloss: "I think that"
    note: "*że* (that) introduces the thought that follows -- a common way to lead into an opinion."
    example_gloss: "I think that you're right."

  pl.a2.unit22.lesson01.teach.bo:
    title: "Because"
    gloss: "because"
    note: "The everyday, casual way to give a reason -- lighter register than *ponieważ* (which you saw in the office-visit lesson)."
    example_gloss: "I like it, because it's tasty."

  pl.a2.unit22.lesson01.teach.jedzenie:
    title: "Food"
    gloss: "food"
    note: "A neuter noun."
    example_gloss: "The food is tasty."

  pl.a2.unit22.lesson01.teach.smaczne:
    title: "Tasty"
    gloss: "tasty / delicious"
    note: "The neuter form, matching *jedzenie*."
    example_gloss: "This is very tasty."

  pl.a2.unit22.lesson02.teach.moim_zdaniem:
    title: "In my opinion"
    gloss: "in my opinion"
    note: "A fixed phrase (literally \"by my judgment\") -- learn it as a set unit, not word-by-word grammar."
    example_gloss: "In my opinion that's a good idea."

  pl.a2.unit22.lesson02.teach.dobra:
    title: "Good (feminine)"
    gloss: "good (feminine)"
    note: "Matches feminine nouns like *restauracja*."
    example_gloss: "The restaurant is good."

  pl.a2.unit22.lesson02.teach.droga:
    title: "Expensive (feminine)"
    gloss: "expensive (feminine)"
    note: "Also matches feminine nouns like *restauracja*. (This word also means \"road\" in other contexts.)"
    example_gloss: "The restaurant is expensive."

  pl.a2.unit22.lesson02.teach.za_note:
    title: "Too -- intensifier"
    gloss: "za + adjective = \"too\" + adjective, e.g. za droga (too expensive)."
    note: "A real new grammar pattern for saying something is excessively so."

  pl.a2.unit22.lesson02.teach.zgadzam_sie:
    title: "I agree"
    gloss: "I agree"
    note: "A reflexive verb -- the standard way to agree with someone's stated opinion."
    example_gloss: "I agree with you."

  pl.a2.unit22.lesson02.teach.nie_zgadzam_sie:
    title: "I disagree"
    gloss: "I disagree"
    note: "Simply *nie* + the verb you just learned."
    example_gloss: "I disagree with you."

  pl.a2.unit22.lesson02.teach.moim_zdaniem_dobra_bo_phrase:
    title: "In my opinion the restaurant is good, because the food is tasty"
    gloss: "In my opinion the restaurant is good, because the food is tasty."
    note: "The full opinion-plus-reason construction this unit is built around."

  pl.a2.unit22.lesson02.teach.za_droga_phrase:
    title: "In my opinion it's too expensive"
    gloss: "In my opinion it's too expensive."
    note: "A contrasting opinion, ready for the next lesson's dialogue."

  pl.a2.unit22.lesson03.teach.recap_words:
    title: "Maybe, there, to eat -- again"
    gloss: "może, tam, jeść -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's restaurant conversation."

  pl.a2.unit22.lesson03.teach.sprobuje_jeszcze_raz:
    title: "I'll try (it) once more"
    gloss: "I'll try (it) once more"
    note: "A natural way to concede without fully agreeing."
    example_gloss: "I'll try once more tomorrow."

  pl.a2.unit22.teach.dialogue.line01:
    title: "Ewa gives her opinion"
    gloss: "In my opinion the restaurant is good, because the food is tasty."
    note: "Ewa opens with the opinion-plus-reason construction from lesson02."
  pl.a2.unit22.teach.dialogue.line02:
    title: "Marek disagrees"
    gloss: "I disagree. In my opinion it's too expensive."
    note: "Marek uses *nie zgadzam się* to directly respond to Ewa's opinion, then gives his own."
  pl.a2.unit22.teach.dialogue.line03:
    title: "Ewa concedes a little, but holds her ground"
    gloss: "Maybe you're right, but I like eating there."
    note: "A natural way to partly accept a counter-opinion while keeping your own preference."
  pl.a2.unit22.teach.dialogue.line04:
    title: "Marek softens"
    gloss: "OK, I'll try it once more."
    note: "Marek doesn't fully agree, but he's open to reconsidering -- a realistic conversational close."

exercises:
  pl.a2.unit22.lesson01.exercise01.select_opinia:
    instruction: "Which word means 'opinion'?"
    correct_option: "opinia"
    distractors: ["bo", "jedzenie"]
    accepted_answers: ["opinia"]

  pl.a2.unit22.lesson01.exercise02.select_bo:
    instruction: "Which word means 'because'?"
    correct_option: "bo"
    distractors: ["opinia", "smaczne"]
    accepted_answers: ["bo"]

  pl.a2.unit22.lesson01.exercise03.select_smaczne:
    instruction: "Which word means 'tasty'?"
    correct_option: "smaczne"
    distractors: ["opinia", "bo"]
    accepted_answers: ["smaczne"]

  pl.a2.unit22.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "opinia": "opinion"
      "myślę, że": "I think that"
      "bo": "because"
      "jedzenie": "food"
      "smaczne": "tasty"
      "restauracja": "restaurant"

  pl.a2.unit22.lesson01.exercise05.order_jedzenie_jest_smaczne:
    instruction: "Put the sentence 'The food is tasty' in order."
    correct_response: ["Jedzenie", "jest", "smaczne"]

  pl.a2.unit22.lesson01.exercise06.order_lubie_to_jedzenie:
    instruction: "Put the sentence 'I like this food' in order."
    correct_response: ["Lubię", "to", "jedzenie"]

  pl.a2.unit22.lesson01.exercise07.fill_jedzenie_smaczne:
    instruction: "Complete the sentence: 'The food is ___.' (tasty)"
    accepted_answers: ["smaczne"]
    feedback: "Jedzenie jest smaczne -- smaczne is the word for tasty."

  pl.a2.unit22.lesson01.exercise08.fix_jedzenie_jest_smaczne:
    instruction: "Fix the word order -- put the sentence 'The food is tasty' in the natural order."
    accepted_answers:
      - "Jedzenie jest smaczne."
      - "Jedzenie jest smaczne"
    feedback: "Jedzenie jest smaczne, not Smaczne jedzenie jest -- jest comes right after the subject."

  pl.a2.unit22.lesson01.exercise09.write_opinia:
    instruction: "Write the Polish word for 'opinion'."
    accepted_answers:
      - "opinia"

  pl.a2.unit22.lesson02.exercise01.select_moim_zdaniem:
    instruction: "Which phrase means 'in my opinion'?"
    correct_option: "Moim zdaniem"
    distractors: ["Nie zgadzam się", "za droga"]
    accepted_answers: ["Moim zdaniem"]

  pl.a2.unit22.lesson02.exercise02.select_full_opinion:
    instruction: "Which sentence gives an opinion with a reason?"
    correct_option: "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne."
    distractors: ["Moim zdaniem jest za droga.", "Nie zgadzam się."]
    accepted_answers:
      - "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne."
      - "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne"

  pl.a2.unit22.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "opinia": "opinion"
      "bo": "because"
      "jedzenie": "food"
      "smaczne": "tasty"
      "Moim zdaniem": "in my opinion"
      "dobra": "good (feminine)"
      "droga": "expensive (feminine)"
      "zgadzam się": "I agree"
      "nie zgadzam się": "I disagree"

  pl.a2.unit22.lesson02.exercise04.order_moim_zdaniem_za_droga:
    instruction: "Put the sentence 'In my opinion it's too expensive' in order."
    correct_response: ["Moim", "zdaniem", "jest", "za", "droga"]

  pl.a2.unit22.lesson02.exercise05.order_nie_zgadzam_sie:
    instruction: "Put the sentence 'I disagree' in order."
    correct_response: ["Nie", "zgadzam", "się"]

  pl.a2.unit22.lesson02.exercise06.fill_za_droga:
    instruction: "Complete the sentence: 'In my opinion the restaurant is too ___.' (expensive)"
    accepted_answers: ["droga"]
    feedback: "Moim zdaniem restauracja jest za droga -- droga is the feminine form of expensive."

  pl.a2.unit22.lesson02.exercise07.fix_moim_zdaniem_za_droga:
    instruction: "Fix the word order -- put the sentence 'In my opinion it's too expensive' in the natural order."
    accepted_answers:
      - "Moim zdaniem jest za droga."
      - "Moim zdaniem jest za droga"
    feedback: "Moim zdaniem jest za droga, not Zdaniem moim jest za droga -- moim comes before zdaniem."

  pl.a2.unit22.lesson02.exercise08.reply_co_myslisz_o_restauracji:
    instruction: "Marek asks: 'What do you think of this restaurant?' Answer as Ewa: say that in your opinion the restaurant is good, because the food is tasty."
    accepted_answers:
      - "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne."
      - "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne"
      - "Moim zdaniem restauracja jest dobra, ponieważ jedzenie jest smaczne."
      - "Moim zdaniem jest dobra, bo jedzenie jest smaczne."

  pl.a2.unit22.lesson02.exercise09.write_nie_zgadzam_sie:
    instruction: "Write: 'I disagree.'"
    accepted_answers:
      - "Nie zgadzam się."
      - "Nie zgadzam się"

  pl.a2.unit22.lesson02.exercise10.speak_moim_zdaniem_za_droga:
    instruction: "Say: 'In my opinion it's too expensive.'"
    accepted_answers:
      - "Moim zdaniem jest za droga."
      - "Moim zdaniem jest za droga"

  pl.a2.unit22.lesson03.exercise01.select_marek_disagrees:
    instruction: "Which line shows Marek disagreeing and calling the restaurant too expensive?"
    correct_option: "Nie zgadzam się. Moim zdaniem jest za droga."
    distractors:
      - "Dobrze, spróbuję jeszcze raz."
      - "Może masz rację, ale lubię tam jeść."
    accepted_answers:
      - "Nie zgadzam się. Moim zdaniem jest za droga."
      - "Nie zgadzam się. Moim zdaniem jest za droga"

  pl.a2.unit22.lesson03.exercise02.select_ewa_likes_eating_there:
    instruction: "Which line shows Ewa still liking to eat there?"
    correct_option: "Może masz rację, ale lubię tam jeść."
    distractors:
      - "Moim zdaniem restauracja jest dobra, bo jedzenie jest smaczne."
      - "Nie zgadzam się. Moim zdaniem jest za droga."
    accepted_answers:
      - "Może masz rację, ale lubię tam jeść."
      - "Może masz rację, ale lubię tam jeść"

  pl.a2.unit22.lesson03.exercise03.comprehend_why_marek_disagrees:
    instruction: "Read the line. Why does Marek disagree with Ewa?"
    correct_option: "it's too expensive"
    distractors:
      - "the food isn't tasty"
      - "he doesn't like restaurants"
    accepted_answers:
      - "za droga"
      - "it's too expensive"

  pl.a2.unit22.lesson03.exercise04.comprehend_why_ewa_likes_it:
    instruction: "Read the line. Why does Ewa think the restaurant is good?"
    correct_option: "the food is tasty"
    distractors:
      - "it's cheap"
      - "it's close to home"
    accepted_answers:
      - "smaczne"
      - "the food is tasty"

  pl.a2.unit22.lesson03.exercise05.read_ewas_opinion:
    instruction: "Read the dialogue (Ewa speaks first, then Marek). What is Ewa's opinion of the restaurant, and why?"
    correct_option: "it's good, because the food is tasty"
    distractors:
      - "it's too expensive"
      - "she has no opinion"
    accepted_answers:
      - "dobra jedzenie smaczne"
      - "it's good, because the food is tasty"

  pl.a2.unit22.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "opinia": "opinion"
      "bo": "because"
      "jedzenie": "food"
      "smaczne": "tasty"
      "Moim zdaniem": "in my opinion"
      "dobra": "good (feminine)"
      "droga": "expensive (feminine)"
      "zgadzam się": "I agree"
      "nie zgadzam się": "I disagree"
      "może": "maybe"

  pl.a2.unit22.lesson03.exercise07.order_moze_masz_racje:
    instruction: "Put the sentence 'Maybe you're right' in order."
    correct_response: ["Może", "masz", "rację"]

  pl.a2.unit22.lesson03.exercise08.fill_za_droga_dialogue:
    instruction: "Complete the sentence: 'Marek says: I disagree. In my opinion it's too ___.' (expensive)"
    accepted_answers: ["droga"]
    feedback: "Moim zdaniem jest za droga -- droga is the word Marek uses."

  pl.a2.unit22.lesson03.exercise09.fix_moze_masz_racje:
    instruction: "Fix the word order -- put the sentence 'Maybe you're right' in the natural order."
    accepted_answers:
      - "Może masz rację."
      - "Może masz rację"
    feedback: "Może masz rację, not Rację masz może -- może comes first."

  pl.a2.unit22.lesson03.exercise10.reply_czy_zgadzasz_sie:
    instruction: "Ewa asks: 'Do you agree that the restaurant is good?' Answer as Marek: say you disagree."
    accepted_answers:
      - "Nie zgadzam się."
      - "Nie zgadzam się"
      - "Nie, nie zgadzam się."
      - "Nie zgadzam się z tobą."

  pl.a2.unit22.lesson03.exercise11.speak_dobrze_sprobuje_jeszcze_raz:
    instruction: "Say: 'OK, I'll try it once more.'"
    accepted_answers:
      - "Dobrze, spróbuję jeszcze raz."
      - "Dobrze, spróbuję jeszcze raz"
