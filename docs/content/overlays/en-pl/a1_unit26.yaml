teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Zwierzę* is the general word for animal; *zwierzak* is the everyday word for a pet.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Ewa has a dog.
    - Tomek has a cat.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: The same *Masz ...?* question pattern you already know from earlier units; *masz* is the *ty* form of *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*Nie mam* + genitive negates the thing you do not have: *zwierzaka*. See the grammar note.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + genitive
    gloss: 'After *nie mam* the object goes in the genitive: *Nie mam czasu* (I have no time) and here *Nie mam zwierzaka* (I have no pet).'
    note: This reuses the *Nie mam czasu* pattern; only the noun is new. Masculine animate nouns such as *zwierzak* look the same in the accusative and the genitive, while feminine nouns show the change (*Mam rybę* becomes *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*Wyprowadzać na spacer* is the set phrase for walking an animal; the verb is imperfective because it is a habit. See the grammar note.'
    example_gloss: I walk the dog every day.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfective for habits
    gloss: '*Wyprowadzać* (imperfective) describes a habit: *Codziennie wyprowadzam psa.* The perfective *wyprowadzić* is used for one finished walk.'
    note: 'Aspect pairs: the imperfective (*wyprowadzać*) is for something repeated, the perfective (*wyprowadzić*) for a single, completed action.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: To play with
    gloss: to play with
    example_gloss: Tomek plays with his cat.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: Combines *wyprowadzać na spacer* with *codziennie* (every day); the object *psa* is in the accusative.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: '*Karmić* (to feed) takes the accusative of the animal: *karmię kota*. Here it is combined with *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Plural: pies, psy'
    gloss: 'Plural: *pies* becomes *psy*, *kot* becomes *koty*, *ryba* becomes *ryby*, *ptak* becomes *ptaki*. Most plurals end in *-y*, or *-i* after k and g.'
    note: The regular Polish plural pattern, introduced here for the first time with animal nouns as the example set.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Marek loves dogs.
    - Kasia loves cats.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: I love animals
    gloss: I love animals.
    note: '*Kocham* is the *ja* form of *kochać*; its object *zwierzęta* is in the accusative plural.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia loves cats, but has no pet
    gloss: Kasia loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek asks about a pet
    gloss: 'Marek: Do you have a pet, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa has a dog
    gloss: 'Ewa: Yes, I have a dog.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek asks what it looks like
    gloss: 'Marek: What does he look like?'
    note: Reuses the *Jak wygląda ...?* question from an earlier lesson, now asked about an animal; *on* can refer to a dog.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa describes her dog
    gloss: 'Ewa: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On and ona for animals
    gloss: 'Animals have a grammatical gender: *on* (he) for *pies* and *kot*, *ona* (she) for *ryba*. These pronouns can refer to an animal, not only to a person.'
    note: 'The pronoun follows the noun''s gender: *pies* and *ptak* take *on*, *ryba* takes *ona*, and *zwierzę* takes *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek asks about walks
    gloss: 'Marek: Do you walk him every day?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa describes her routine
    gloss: 'Ewa: Yes, I walk him every day and I feed him.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia, and Tomek on animals
    gloss: 'Marek and Kasia both love animals, but neither of them has a pet. Marek loves dogs and Kasia loves cats. Tomek does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      kochają: love
      oboje: both
      zwierzęta: animals
      zwierzaka: pet
      psy: dogs
      koty: cats
      kota: cat
      bawi: plays
      daje: gives
      co: every
      jeść: food
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek often plays with his cat
    gloss: Tomek often plays with his cat.
    note: '*Bawić się z* (to play with) takes the instrumental: *z kotem*. *Często* is the frequency adverb for ''often''.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa asks Nina
    gloss: 'Ewa: Nina, do you have a pet too?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Ma na imię* (is named) is the same phrase used for introducing a name earlier.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek reacts
    gloss: 'Marek: How nice! What do you do with him every day?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek loves birds too
    gloss: 'Marek: I love birds too.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa closes the conversation
    gloss: 'Ewa: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
