  pl.a1.unit25.lesson02.exercise02.listen_marek_ma_krotkie:
    instruction: Listen and choose what the speaker says.
    correct_option: Marek has short black hair.
    distractors:
    - Marek has long black hair.
    - Marek has short brown hair.
    - Marek has short blond hair.
    accepted_answers:
