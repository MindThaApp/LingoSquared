    accepted_answers:
    - value: Ma zielone oczy.
      status: correct
    - value: Ma zielone oczy
      status: correct
    feedback: Ma zielone oczy.
  pl.a1.unit25.lesson04.exercise08.write_nina_jest_niska:
    instruction: 'Write in Polish: say Nina is short and has short blond hair.'
    accepted_answers:
    - value: Nina jest niska i ma krótkie blond włosy.
      status: correct
    - value: Nina jest niska i ma krótkie blond włosy
      status: correct
    feedback: '*Nina jest niska i ma krótkie blond włosy.* *Jest* + adjective describes height; *ma* + noun describes hair.'
  pl.a1.unit25.lesson05.exercise01.read_wygladaja_inaczej:
    instruction: Read the text and choose whether Tomek and Kasia look alike.
    correct_option: No, the text says they look different.
    distractors:
    - Yes, they look identical.
    - The text does not say.
    - Only their hair looks the same.
    accepted_answers:
    - value: No, the text says they look different.
