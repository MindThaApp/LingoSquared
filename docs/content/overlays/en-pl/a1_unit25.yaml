    feedback: Oczy means eyes; niebieski/brązowy/zielony are eye colors.
  pl.a1.unit25.lesson03.exercise04.order_jak_wyglada_ewa:
    instruction: Put the words in order to ask 'What does Ewa look like?'
    correct_option: Jak wygląda Ewa
    accepted_answers:
