    - short, with long black hair
    - tall, with short brown hair
    accepted_answers:
    - value: short, with short blond hair
      status: correct
    feedback: 'Ewa says: *Jest niska i ma krótkie blond włosy.* *Niska* is feminine because it describes a girl.'
  pl.a1.unit25.lesson04.exercise04.comprehend_ma_zielone_oczy:
