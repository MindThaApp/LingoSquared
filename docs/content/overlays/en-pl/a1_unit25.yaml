answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polish A1
  description: 'Beginner Polish for describing a person''s basic physical appearance: height and age impressions, hair and eye color, the core question Jak wygląda ...?, and comparing two people''s appearance.'
units:
  pl.a1.unit25.wyglad:
    title: Describing appearance
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Tall, short, old, and young
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Describing hair
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Eyes and what does someone look like?
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa describes Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Comparing Tomek and Kasia
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek recognizes Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Tall and short
    gloss: tall / short
    note: '*Wysoki* describes a tall person and *niski* a short one. A woman is *wysoka* or *niska*.'
    example_gloss:
    - Kasia is tall.
    - Tomek is short.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Old and young
    gloss: old / young
    note: '*Stary* and *młody* here describe a general impression, not an exact number of years.'
    example_gloss:
    - Grandpa is old.
    - Marek is young.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: impression or age'
    gloss: '*Stary* describes a general impression, as in *Dziadek jest stary*. To give an exact age, Polish uses a different structure: *Ile masz lat?*'
    note: You describe how old someone looks with *stary* or *młody*; for an exact age you ask *Ile masz lat?* and answer with *mam ... lat* (I am ... years old).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia is tall and Tomek is short
    gloss: Kasia is tall and Tomek is short.
    note: A simple combined sentence using *a* (and, in contrast). *Wysoka* and *niski* agree with a feminine and a masculine subject, setting up the comparison in lesson 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Hair
    gloss: the hair
    note: '*Włosy* is always plural in Polish: *długie włosy* (long hair).'
    example_gloss: Marek has short black hair.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: Three hair colors. *Blond* never changes; *brązowe* and *siwe* are plural forms to match *włosy*.
    example_gloss:
    - Ewa has blond hair.
    - Tomek has brown hair.
    - Grandpa has grey hair.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Długie* (long) and *krótkie* (short) are plural forms to match *włosy*.'
    example_gloss:
    - Kasia has long hair.
    - Tomek has short hair.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy takes plural adjectives
    gloss: '*Włosy* is plural, so the adjective is plural too: long hair, short hair, brown hair, black hair.'
    note: 'Plural nouns that are not masculine persons take adjectives ending in *-e*: *długie włosy*. *Blond* is the exception: it never changes (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: always plural'
    gloss: '*Włosy* (hair) is always plural: *jej włosy są długie* (her hair is long, literally ''her hairs are long''). *Jej* means ''her''.'
    note: Hair is a plural noun in Polish, so verbs and adjectives agree in the plural. *Jej* ('her') never changes, however many things belong to her.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek has short black hair
    gloss: Marek has short black hair.
    note: '*Czarne* (black) is the plural form to match *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa has long blond hair
    gloss: Ewa has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Eyes
    gloss: the eyes
    note: '*Oczy* is the plural of *oko*; Polish usually talks about both eyes in the plural.'
    example_gloss: Marek has brown eyes.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: 'Three eye colors, in the plural to match *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa has blue eyes.
    - Tomek has brown eyes.
    - Kasia has green eyes.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy takes -e
    gloss: '*Oczy* is plural, so the adjective ends in *-e*: blue eyes, brown eyes, green eyes.'
    note: 'The same plural ending as with *włosy* in lesson 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: What does Ewa look like?
    gloss: What does Ewa look like?
    note: '*Jak wygląda ...?* is this unit''s core question; reuse it to ask about anyone''s appearance.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa has long blond hair and blue eyes
    gloss: Ewa has long blond hair and blue eyes.
    note: A model answer combining hair and eyes in one sentence with *i* (and).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa introduces Nina
    gloss: 'Ewa: A new girl is coming to the language café. Her name is Nina.'
    note: '*Przychodzi* (is coming) introduces someone new to the scene; *do kawiarni językowej* uses *do* + genitive.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek asks what she looks like
    gloss: 'Marek: Okay! What does she look like?'
    note: Reuses this unit's core question, now with *ona* (she) instead of a name.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa describes Nina's height and hair
    gloss: 'Ewa: She is short and she has short blond hair.'
    note: Combines lesson 1's *niska* (the feminine of *niski*) with lesson 2's hair vocabulary.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek asks about her eyes
    gloss: 'Marek: And her eyes?'
    note: '*Jej* here is the possessive ''her'', so *jej oczy* means ''her eyes''; *jej* never changes.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa describes Nina's eyes
    gloss: 'Ewa: She has green eyes.'
    note: Reuses *zielone oczy* from lesson 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek will recognize her
    gloss: 'Marek: Thanks! Then I''ll recognize her.'
    note: '*Rozpoznam* is the perfective future (''I will recognize''); *ją* is the accusative of *ona* (her).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Comparing Tomek and Kasia
    gloss: Tomek and Kasia are brother and sister, but they look different. Tomek is short and has short brown hair and brown eyes. Kasia is taller than Tomek and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      brat: brother
      siostra: sister
      wyglądają: look
      inaczej: different
      niski: short
      krótkie: short
      brązowe: brown
      włosy: hair
      oczy: eyes
      wyższa: taller
      długie: long
      zielone: green
      wyglądasz: you look (informal), as in how someone looks
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Reusing the comparative
    gloss: 'Comparative: *wysoki* (tall) becomes *wyższy* (taller), and the other person follows *niż* (than): Kasia is taller than Tomek.'
    note: 'Polish forms the comparative by changing the adjective''s ending, and it still agrees in gender: *wyższa* for Kasia (feminine).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia has longer hair than Tomek
    gloss: Kasia has longer hair than Tomek.
    note: '*Dłuższe* (longer) is plural to match *włosy*, and *niż* (than) introduces the comparison.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: A model first-person sentence using *Mam ...*, ready to reuse when describing your own appearance.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek spots Nina
    gloss: 'Marek: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Patrz* (look) is the imperative of *patrzeć*. *Czy to Nina?* asks ''is that Nina?'''
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa confirms
    gloss: 'Ewa: Yes, that''s Nina!'
    note: A short, natural confirmation.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina greets Marek
    gloss: 'Nina: Hi, are you Marek?'
    note: 'A simple informal greeting question. After *być*, a name takes the instrumental: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek greets Nina back
    gloss: 'Marek: Yes! Nice to meet you, Nina.'
    note: '*Miło cię poznać* is the standard phrase for a first meeting (''nice to meet you''; *poznać* means ''to get to know''). Nina is addressed in the vocative: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Marek successfully recognized Nina from Ewa's earlier description.
