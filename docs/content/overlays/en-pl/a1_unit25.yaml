        right: Kasia is tall.
      - left: Tomek jest niski.
        right: Tomek is short.
      - left: Dziadek jest stary.
        right: Grandpa is old.
      status: correct
    feedback: Lang/klein/stary/młody describe general height and age impressions.
  pl.a1.unit25.lesson01.exercise04.order_kasia_jest_wysoka:
