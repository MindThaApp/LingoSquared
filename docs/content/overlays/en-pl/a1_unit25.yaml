    - Kasia is short.
    - Kasia is old.
    - Kasia is young.
    accepted_answers:
    - value: Kasia is tall.
      status: correct
    feedback: Kasia jest wysoka.
  pl.a1.unit25.lesson01.exercise02.listen_tomek_jest_niski:
