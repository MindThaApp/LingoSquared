      status: correct
    feedback: Jak wygląda Ewa?
  pl.a1.unit25.lesson03.exercise07.respond_marek_ma_krotkie:
    instruction: 'Answer in Polish: say Marek has short black hair and brown eyes.'
    accepted_answers:
    - value: Marek ma krótkie czarne włosy i brązowe oczy.
      status: correct
    - value: Marek ma krótkie czarne włosy i brązowe oczy
      status: correct
    feedback: '*Marek ma krótkie czarne włosy i brązowe oczy.* *Ma* is the *on* form of *mieć*; the plural nouns *włosy* and *oczy* take plural adjectives.'
  pl.a1.unit25.lesson04.exercise01.listen_do_kawiarni_jezykowej:
    instruction: Listen and choose what Ewa says.
    correct_option: A new girl is coming to the language café. Her name is Nina.
    distractors:
    - A new boy is coming to the language café.
    - Nina is not coming to the language café.
    - Nina already came to the language café.
    accepted_answers:
    - value: A new girl is coming to the language café. Her name is Nina.
      status: correct
    feedback: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.
  pl.a1.unit25.lesson04.exercise02.comprehend_ma_na_imie:
