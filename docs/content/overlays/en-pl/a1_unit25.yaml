      status: correct
    feedback: '*Ma krótkie blond włosy.* The subject *ona* is left out because the verb form *ma* already shows it.'
  pl.a1.unit25.lesson04.exercise06.respond_jest_niska_i:
    instruction: 'Answer in Polish: describe Nina using the facts from this dialogue (height, hair, eyes).'
    accepted_answers:
    - value: Jest niska i ma krótkie blond włosy i zielone oczy.
      status: correct
    - value: Jest niska i ma krótkie blond włosy i zielone oczy
      status: correct
    - value: Ona jest niska i ma krótkie blond włosy i zielone oczy.
      status: correct
    - value: Ona jest niska i ma krótkie blond włosy i zielone oczy
      status: correct
    feedback: '*Jest niska i ma krótkie blond włosy i zielone oczy.* *Jest niska* uses the feminine adjective; *ma* goes with the plural nouns *włosy* and *oczy*.'
  pl.a1.unit25.lesson04.exercise07.listen_ma_zielone_oczy:
