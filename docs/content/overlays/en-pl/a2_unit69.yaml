    instruction: Choose the Polish sentence meaning 'I am going to book a hotel.'
    correct_option: Zarezerwuję hotel.
    distractors:
    - Zarezerwuj hotel.
    - Zarezerwowałem hotel.
    - Będę zarezerwować hotel.
    accepted_answers:
    - value: Zarezerwuję hotel.
      status: correct
    feedback: '*Zarezerwuję hotel* = I am going to book a hotel. The perfective verb in the future form (zarezerwuję) says you will do it once and finish it.'
  pl.a2.unit69.lesson01.exercise02.listen_co_bedziesz_robic:
