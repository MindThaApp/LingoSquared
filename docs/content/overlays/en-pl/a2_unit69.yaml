teaching:
  pl.a2.unit69.lesson01.teach.urlop_wakacje:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Urlop* is time off from work. *Wakacje* (always plural) are the summer school holidays and any holiday trip: *jadę na wakacje*.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  pl.a2.unit69.lesson01.teach.w_przyszlym_tygodniu:
    title: When something happens
    gloss: next week / next year / soon
    note: 'Time phrases with *w* take the locative: *w przyszłym tygodniu*, *w przyszłym roku*. *Wkrótce* means ''soon''.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to the Czech Republic.
    - Soon I have a holiday.
  pl.a2.unit69.lesson01.teach.podrozowac_zarezerwowac_zostac:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: 'These are infinitives. *Zarezerwować* is perfective (one finished booking); the imperfective *rezerwować* is the process. *Zostać* is perfective too: *zostanę* = ''I will stay''.'
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  pl.a2.unit69.lesson01.teach.hotel_kemping:
    title: Where to stay
    gloss: the hotel / the campsite
    note: You stay *w hotelu* (locative of hotel) but *na kempingu* (na + locative).
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  pl.a2.unit69.lesson01.teach.co_bedziesz_robic:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: '*Będziesz robić* is the future of the imperfective verb *robić*: będę, będziesz, będzie + infinitive.'
  pl.a2.unit69.lesson01.teach.w_sierpniu_bede:
    title: 'Near plans: będę + infinitive, or the perfective future'
    gloss: In August I am going to travel around Germany. I am going to book a hotel.
    note: 'Polish has no helper verb like English ''going to''. For an activity, use the future of *być* with an imperfective infinitive: *będę podróżować*. For a single action you will complete, use a perfective verb in its future form: *zarezerwuję hotel*. Never combine *będę* with a perfective infinitive (*będę zarezerwować* is wrong).'
  pl.a2.unit69.lesson01.teach.zarezerwuje_hotel:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  pl.a2.unit69.lesson02.teach.zapisac_sie_na:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Zapisać się na kurs* means to sign up for a course. *Przeprowadzić się* is to move to a new home; it has the reflexive *się*. *Oszczędzać* is to save money.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  pl.a2.unit69.lesson02.teach.pozniej_za_miesiac:
    title: Further ahead
    gloss: later / in a month
    note: '*Za miesiąc* means ''a month from now''. It works with other periods too: *za tydzień*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  pl.a2.unit69.lesson02.teach.za_miesiac_zaczyna:
    title: A course that starts
    gloss: In a month my course starts.
  pl.a2.unit69.lesson02.teach.zamierzam_zapisac_sie:
    title: 'Intentions: zamierzam + infinitive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *zamierzam* and then an infinitive: *zamierzam zapisać się na kurs*. No small word is needed before the infinitive. This is for things you want to do, not for fixed arrangements.'
  pl.a2.unit69.lesson02.teach.zamierzam_sie_przeprowadzic:
    title: Planning to move house
    gloss: I plan to move house.
  pl.a2.unit69.lesson02.teach.zamierzam_oszczedzac:
    title: Planning to save
    gloss: I plan to save money.
  pl.a2.unit69.lesson02.teach.jutro_ide_na:
    title: Present tense or zamierzam?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use the present tense for a near, settled plan: *Jutro idę na targ*. Use *zamierzam* for an intention that is further away or less certain: *Później zamierzam się przeprowadzić*.'
  pl.a2.unit69.lesson03.teach.moze_na_pewno:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Może* expresses doubt. *Na pewno* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  pl.a2.unit69.lesson03.teach.w_tym_roku:
    title: This year, this summer
    gloss: this year / this summer
    note: '*W tym roku* uses w + locative; *tego lata* is the genitive with no preposition.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  pl.a2.unit69.lesson03.teach.tego_lata_zostaje:
    title: Staying at home
    gloss: This summer I am staying at home.
  pl.a2.unit69.lesson03.teach.jutro_ide_do:
    title: Może and the future
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: '*Może* is followed by an ordinary future verb: *Może później pójdę do kina*. The present tense works for a plan that is already fixed: *Jutro idę do pracy*. Polish word order is flexible; the verb usually follows the time word.'
  pl.a2.unit69.lesson03.teach.nie_jade_na:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *nie* directly before the verb: *Nie jadę na wakacje*. After *nie zamierzam* use an imperfective infinitive: *Nie zamierzam się przeprowadzać* (not *przeprowadzić*).'
  pl.a2.unit69.lesson04.teach.z_kim_jak:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Z kim* asks about the person you do something with (z + instrumental: *z siostrą*). *Jak długo* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  pl.a2.unit69.lesson04.teach.dokad_sie_wybierasz:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Dokąd się wybierasz?* asks where you are heading. *Dokąd* means ''to where''; *gdzie* asks about a place without movement.'
  pl.a2.unit69.lesson04.teach.z_kim_jedziesz:
    title: Who with?
    gloss: Who are you going on holiday with?
  pl.a2.unit69.lesson04.teach.jak_dlugo_tam:
    title: How long?
    gloss: How long are you staying there?
  pl.a2.unit69.lesson04.teach.jade_z_siostra:
    title: Answering
    gloss: I am going with my sister.
  pl.a2.unit69.lesson04.teach.tydzien_dwa_tygodnie:
    title: Weeks
    gloss: one week / two weeks
    note: After 2, 3 and 4 the plural is *tygodnie*; from 5 on it is *tygodni*.
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  pl.a2.unit69.lesson04.teach.dokad_sie_wybierasz_2:
    title: 'Question words: dokąd, z kim, jak długo'
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first and the verb right after it: *Dokąd się wybierasz?* For a length of stay use the future *zostaniesz* or the present *zostajesz*. No helper verb is needed.'
  pl.a2.unit69.lesson05.teach.czesc_ewo_wkrotce:
    title: A message from Kasia
    gloss: Hi Ewa! Soon I have a holiday. In August I am going to the Czech Republic with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Kasia uses the present tense for fixed plans (*jadę*), the future for what comes next (*zostaniemy*) and *zamierzam* for a longer-term intention. Notice the infinitive after *zamierzam*: *zapisać się*.'
    glosses:
      wkrótce: soon
      urlop: holiday
      sierpniu: August
      siostrą: sister
      do: to
      czech: the Czech Republic
      hotelu: hotel
      zostaniemy: we will stay
      potem: after that
      rodziców: parents
      dni: days
      przyszłym: next
      roku: year
      zamierzam: I plan to (zamierzać = to plan to)
      kurs: course
      zapisać: to sign up
      może: maybe
      przeprowadzę: I will move house
      wtedy: then
      też: also
  pl.a2.unit69.lesson06.teach.czesc_marku_masz:
    title: Ewa asks Marek about his plans
    gloss: 'Ewa: Hi Marek! Do you have plans for the summer holiday yet?'
  pl.a2.unit69.lesson06.teach.tak_w_sierpniu:
    title: Marek answers
    gloss: 'Marek: Yes! In August I am going to Germany. I am going to book a hotel.'
  pl.a2.unit69.lesson06.teach.swietnie_z_kim:
    title: Ewa asks who he is going with
    gloss: 'Ewa: Nice! Who are you going with?'
  pl.a2.unit69.lesson06.teach.z_wujkiem_zostaniemy:
    title: Marek says who and how long
    gloss: 'Marek: With my uncle. We are going to stay for a week.'
  pl.a2.unit69.lesson06.teach.a_pozniej_co:
    title: Ewa asks about later
    gloss: 'Ewa: And later? What do you plan to do?'
  pl.a2.unit69.lesson06.teach.w_przyszlym_roku:
    title: Marek names an intention and asks back
    gloss: 'Marek: Next year I plan to take a course. And you?'
  pl.a2.unit69.lesson06.teach.w_lipcu_bede:
    title: Ewa answers
    gloss: 'Ewa: In July I am going to work. Maybe I will go to my parents'' after that.'
exercises:
