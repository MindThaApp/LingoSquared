review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Seventeenth en-pl overlay, written for pl/a1_unit17_work.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start). No
    sibling-direction overlay exists yet for this unit (pl-en hasn't been
    authored), so the sibling-isolation rule (AUTHORING_GUIDE §8) doesn't
    apply here -- noted for whoever authors pl-en next: do not open this file
    for structure/phrasing reference when doing so.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    lesson02.teach.w_miejsce_pracy_note (realization + overlay gloss/note) --
    'tak samo jak w Warszawie czy w południe' -> 'w Warszawie czy w Krakowie';
    'w południe' is w + accusative (time), not the locative 'w szkole/w
    biurze' pattern, so the claim was false grammar; overlay note no longer
    mentions time-of-day words. (2) lesson01.teach.inzynier overlay note --
    'never changes for gender' -> 'normally stays inżynier for a woman too'
    (inżynierka exists). (3) lesson01.teach.nauczyciel_nauczycielka -- added
    'nauczycielem' to introduced_tokens: the form is displayed on that card's
    example ('On jest nauczycielem.') and is used in lesson01.exercise07's
    prompt target_blocks. Canon checked: no earlier unit pins Ewa/Marek jobs.
    NATIVE CHECK: nominative-for-vocative address 'Gdzie pracujesz, Ewa?' / 'A
    ty, Marek?' (colloquially normal).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-16: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit17.praca:
    title: "Work"

lessons:
  pl.a1.unit17.lesson01.jestem_inzynierem:
    title: "I am an engineer"
  pl.a1.unit17.lesson02.gdzie_pracujesz:
    title: "Where do you work?"
  pl.a1.unit17.lesson03.rozmowa_o_pracy:
    title: "A conversation about work"

teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: "I am an engineer / a teacher"
    gloss: "I am an engineer. I am a teacher. -- 'inżynier' and 'nauczycielka' change their ending after 'Jestem.'"
    note: >-
      This is the first time in this course a word's ending changes to show
      what your job is -- for now it only applies to these two specific job
      words.

  pl.a1.unit17.lesson01.teach.inzynier:
    title: "Engineer"
    gloss: "engineer"
    note: >-
      In everyday Polish this word normally stays *inżynier* for a woman
      too.
    example_gloss: "Marek is an engineer."

  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: "Teacher"
    gloss: "teacher (masculine) / teacher (feminine)"
    note: >-
      Unlike *inżynier*, this job word does change for gender -- *nauczyciel*
      for a man, *nauczycielka* for a woman.
    example_gloss:
      - "He is a teacher."
      - "Ewa is a teacher."

  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: "Marek and Ewa, again"
    gloss: "Marek, Ewa -- you already know these names from earlier lessons."
    note: "A quick reminder before this lesson uses both."

  pl.a1.unit17.lesson01.teach.jest_recap:
    title: "Is -- again"
    gloss: "Jest -- you already know this word from earlier lessons, e.g. 'Dom jest tam' (the house is there)."
    note: "A quick reminder before this lesson uses it to talk about someone's job."

  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: "Marek's job"
    gloss: "Marek is an engineer."
    note: "The fact this whole unit builds on for Marek."

  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: "Ewa's job"
    gloss: "Ewa is a teacher."
    note: "The fact this whole unit builds on for Ewa."

  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: "To work -- you work"
    gloss: "Pracować (you already know pracuję from earlier lessons): pracuję (I), pracujesz (you). Where do you work?"
    note: >-
      Only two forms for now -- *pracuję* for yourself, *pracujesz* for
      asking someone else, the same pattern as *czuć się* in the last unit.

  pl.a1.unit17.lesson02.teach.szkola:
    title: "School"
    gloss: "school"
    note: "Where a teacher like Ewa works."
    example_gloss: "I work at a school."

  pl.a1.unit17.lesson02.teach.biuro:
    title: "Office"
    gloss: "office"
    note: "Where an engineer like Marek works."
    example_gloss: "I work at an office."

  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: "At school, at the office"
    gloss: "W + workplace: w szkole, w biurze -- the same pattern as w Warszawie or w Krakowie."
    note: >-
      Same idea as the city names you already learned (*w Warszawie*, *w
      Krakowie*) -- the ending changes a little to say *in/at* that place.

  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: "Where do you work?"
    gloss: "Where do you work?"
    note: "The natural question to ask about someone's job."

  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: "And you -- again"
    gloss: "A ty -- you already know this expression from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: "Marek asks Ewa about work"
    gloss: "Where do you work, Ewa?"
    note: "Marek opens the conversation with a direct question."
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: "Ewa answers"
    gloss: "I work at a school. I am a teacher."
    note: "Ewa states both her workplace and her job -- the same facts stated earlier in this unit."
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: "Ewa asks Marek back"
    gloss: "And you, Marek? Where do you work?"
    note: "Ewa turns the question back to Marek."
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: "Marek answers"
    gloss: "I work at an office. I am an engineer."
    note: "Marek states both his workplace and his job -- the same facts stated earlier in this unit."

exercises:
  pl.a1.unit17.lesson01.exercise01.select_inzynier:
    instruction: "Which word means 'engineer'?"
    correct_option: "inżynier"
    distractors: ["nauczyciel", "nauczycielka"]
    accepted_answers: ["inżynier"]

  pl.a1.unit17.lesson01.exercise02.select_nauczyciel:
    instruction: "Which word means 'teacher' (for a man)?"
    correct_option: "nauczyciel"
    distractors: ["nauczycielka", "inżynier"]
    accepted_answers: ["nauczyciel"]

  pl.a1.unit17.lesson01.exercise03.select_nauczycielka:
    instruction: "Which word means 'teacher' (for a woman)?"
    correct_option: "nauczycielka"
    distractors: ["nauczyciel", "inżynier"]
    accepted_answers: ["nauczycielka"]

  pl.a1.unit17.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "inżynier": "engineer"
      "nauczyciel": "teacher (masculine)"
      "nauczycielka": "teacher (feminine)"
      "inżynierem": "engineer (after Jestem/jest)"
      "nauczycielką": "teacher (after Jestem/jest, feminine)"
      "Jestem": "I am"
      "jest": "is"

  pl.a1.unit17.lesson01.exercise05.order_jestem_inzynierem:
    instruction: "Put the sentence 'I am an engineer' in order."
    correct_response: ["Jestem", "inżynierem"]

  pl.a1.unit17.lesson01.exercise06.order_marek_jest_inzynierem:
    instruction: "Put the sentence 'Marek is an engineer' in order."
    correct_response: ["Marek", "jest", "inżynierem"]

  pl.a1.unit17.lesson01.exercise07.fill_inzynierem:
    instruction: "Complete the sentence: 'Marek is not a teacher. Marek is an engineer.'"
    accepted_answers: ["inżynierem"]
    feedback: "Marek jest inżynierem -- inżynierem is the form used after jest."

  pl.a1.unit17.lesson01.exercise08.fix_ewa_nauczycielka:
    instruction: "Fix the sentence -- Ewa needs the feminine form of 'teacher,' and the ending after jest."
    accepted_answers:
      - "Ewa jest nauczycielką."
      - "Ewa jest nauczycielką"
    feedback: "Ewa jest nauczycielką, not Ewa jest nauczyciel -- nauczycielką is the feminine form, with the ending that follows jest."

  pl.a1.unit17.lesson01.exercise09.speak_jestem_inzynierem:
    instruction: "Say: 'I am an engineer.'"
    accepted_answers:
      - "Jestem inżynierem."
      - "Jestem inżynierem"

  pl.a1.unit17.lesson02.exercise01.select_szkola:
    instruction: "Which word means 'school'?"
    correct_option: "szkoła"
    distractors: ["biuro", "dom"]
    accepted_answers: ["szkoła"]

  pl.a1.unit17.lesson02.exercise02.select_biuro:
    instruction: "Which word means 'office'?"
    correct_option: "biuro"
    distractors: ["szkoła", "dom"]
    accepted_answers: ["biuro"]

  pl.a1.unit17.lesson02.exercise03.select_gdzie_pracujesz:
    instruction: "What does this question mean?"
    correct_option: "Where do you work?"
    distractors: ["What do you do?", "Where do you live?"]
    accepted_answers: ["Where do you work?"]

  pl.a1.unit17.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "szkoła": "school"
      "biuro": "office"
      "pracuję": "I work"
      "pracujesz": "you work"
      "Gdzie": "where"
      "w": "in / at"

  pl.a1.unit17.lesson02.exercise05.order_gdzie_pracujesz:
    instruction: "Put the question 'Where do you work?' in order."
    correct_response: ["Gdzie", "pracujesz"]

  pl.a1.unit17.lesson02.exercise06.order_pracuje_w_szkole:
    instruction: "Put the sentence 'I work at a school' in order."
    correct_response: ["Pracuję", "w", "szkole"]

  pl.a1.unit17.lesson02.exercise07.fill_biurze:
    instruction: "Complete the sentence: 'I don't work at a school. I work at an office.'"
    accepted_answers: ["biurze"]
    feedback: "Pracuję w biurze -- biurze is the form used after w."

  pl.a1.unit17.lesson02.exercise08.fix_pracuje_w_szkole:
    instruction: "Fix the sentence -- 'school' needs its ending after w."
    accepted_answers:
      - "Pracuję w szkole."
      - "Pracuję w szkole"
    feedback: "Pracuję w szkole, not Pracuję w szkoła -- szkole is the form used after w."

  pl.a1.unit17.lesson02.exercise09.speak_gdzie_pracujesz:
    instruction: "Say: 'Where do you work?'"
    accepted_answers:
      - "Gdzie pracujesz?"
      - "Gdzie pracujesz"

  pl.a1.unit17.lesson03.exercise01.select_ewa_school_line:
    instruction: "Which line says Ewa works at a school?"
    correct_option: "Pracuję w szkole. Jestem nauczycielką."
    distractors:
      - "Gdzie pracujesz, Ewa?"
      - "Pracuję w biurze. Jestem inżynierem."
    accepted_answers:
      - "Pracuję w szkole. Jestem nauczycielką."
      - "Pracuję w szkole Jestem nauczycielką"

  pl.a1.unit17.lesson03.exercise02.select_marek_office_line:
    instruction: "Which line says Marek works at an office?"
    correct_option: "Pracuję w biurze. Jestem inżynierem."
    distractors:
      - "Pracuję w szkole. Jestem nauczycielką."
      - "A ty, Marek? Gdzie pracujesz?"
    accepted_answers:
      - "Pracuję w biurze. Jestem inżynierem."
      - "Pracuję w biurze Jestem inżynierem"

  pl.a1.unit17.lesson03.exercise03.comprehend_ewa_job:
    instruction: "Read the line. What is Ewa's job?"
    correct_option: "teacher"
    distractors:
      - "engineer"
      - "secretary"
    accepted_answers:
      - "nauczycielka"
      - "teacher"

  pl.a1.unit17.lesson03.exercise04.comprehend_marek_workplace:
    instruction: "Read the line. Where does Marek work?"
    correct_option: "office"
    distractors:
      - "school"
      - "home"
    accepted_answers:
      - "biuro"
      - "biurze"
      - "office"

  pl.a1.unit17.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "szkoła": "school"
      "biuro": "office"
      "inżynier": "engineer"
      "nauczycielka": "teacher (feminine)"
      "Gdzie": "where"
      "pracujesz": "you work"
      "A": "and"
      "ty": "you"
      "Jestem": "I am"

  pl.a1.unit17.lesson03.exercise06.order_jestem_nauczycielka:
    instruction: "Put the sentence 'I am a teacher' in order."
    correct_response: ["Jestem", "nauczycielką"]

  pl.a1.unit17.lesson03.exercise07.order_pracuje_w_biurze:
    instruction: "Put the sentence 'I work at an office' in order."
    correct_response: ["Pracuję", "w", "biurze"]

  pl.a1.unit17.lesson03.exercise08.fill_nauczycielka_context:
    instruction: "Complete the sentence: 'I work at a school. I am a teacher.'"
    accepted_answers: ["nauczycielką"]
    feedback: "Jestem nauczycielką -- nauczycielką is the feminine form used after Jestem."

  pl.a1.unit17.lesson03.exercise09.fix_pracuje_w_biuro:
    instruction: "Fix the sentence -- 'office' needs its ending after w."
    accepted_answers:
      - "Pracuję w biurze."
      - "Pracuję w biurze"
    feedback: "Pracuję w biurze, not Pracuję w biuro -- biurze is the form used after w."

  pl.a1.unit17.lesson03.exercise10.reply_gdzie_pracujesz:
    instruction: "Answer as Ewa: say you work at a school and you are a teacher."
    accepted_answers:
      - "Pracuję w szkole. Jestem nauczycielką."
      - "Pracuję w szkole. Jestem nauczycielką"
      - "Pracuję w szkole, jestem nauczycielką."
      - "Pracuję w szkole i jestem nauczycielką."

  pl.a1.unit17.lesson03.exercise11.speak_pracuje_w_biurze:
    instruction: "Say: 'I work at an office. I am an engineer.'"
    accepted_answers:
      - "Pracuję w biurze. Jestem inżynierem."
      - "Pracuję w biurze. Jestem inżynierem"
      - "Pracuję w biurze, jestem inżynierem."
      - "Pracuję w biurze i jestem inżynierem."
