  pl.b1.unit13.lesson04.moje_mozliwosci:
    title: "My abilities"

teaching:
  pl.b1.unit13.lesson01.teach.moge_powiedziec_ze_termin:
    title: "I can say that the appointment is free"
    gloss: "I can say that the appointment is free."
    note: "*Mogę* + *że* embeds a full statement, not just a bare modal + verb."
    example_gloss: "Sir, I can say that the appointment is free on Monday."

  pl.b1.unit13.lesson01.teach.moge_note:
    title: "Móc + że-clause (embedded statement)"
    gloss: "\"Móc\" + a \"że\"-clause -- not just bare \"mogę pomóc\" (I can help), but a whole embedded fact: *Mogę powiedzieć, że termin jest wolny* (I can say THAT the appointment is free)."
    note: "The present-ability half of this outcome's embedded-clause construction."

  pl.b1.unit13.lesson01.teach.czy_moze_pani_powiedziec:
    title: "Could you tell me whether the appointment is free?"
    gloss: "Could you (formal, to a woman) say whether the appointment is free?"
    note: "*czy* here means \"whether\" -- introducing an embedded yes/no question, a second kind of embedded clause."
    example_gloss: "Good day, could you say whether the appointment is still free?"

  pl.b1.unit13.lesson01.teach.dzien_dobry_jeszcze:
    title: "Good day"
    gloss: "Good day / hello"
    note: "A standard formal greeting for this unit's office-call setting."

  pl.b1.unit13.lesson02.teach.nie_moglam_jeszcze:
    title: "Last week I couldn't yet say the appointment was free"
    gloss: "Last week I couldn't yet say that the appointment was free."
    note: "*mogłam* -- simple past ability (feminine, the Urzędniczka speaking about herself), contrasted with present *mogę*."
    example_gloss: "I'm sorry, last week I couldn't yet say that the appointment was free."

  pl.b1.unit13.lesson02.teach.moglam_note:
    title: "Mogłam/mogłem (simple past ability)"
    gloss: "\"Mogłam\"/\"mogłem\" -- simple past tense: describes what someone COULD (or couldn't) do at a specific moment in the past, in contrast to present-tense \"mogę\"."
    note: "The past-ability half of this unit's present/past/hypothetical contrast."

  pl.b1.unit13.lesson02.teach.moglabym_oddzwonic:
    title: "If you gave me your number, I could call back tomorrow"
    gloss: "If you gave your number, I could call back tomorrow."
    note: "*mogłabym* -- conditional/hypothetical ability (feminine, the Urzędniczka), depending on an unmet condition."
    example_gloss: "If you gave your phone number, I could call back tomorrow morning."

  pl.b1.unit13.lesson02.teach.moglabym_note:
    title: "Mogłabym/mógłbym (conditional ability)"
    gloss: "\"Mogłabym\"/\"mógłbym\" -- conditional (hypothetical) form: describes what someone WOULD BE ABLE to do under a certain condition, not what they actually did."
    note: "The hypothetical-ability half of this unit's contrast."

  pl.b1.unit13.teach.dialogue.line01:
    title: "Ewa asks about her appointment"
    gloss: "Good day, could you tell me whether my appointment at the office is still free?"
    note: "Opens the office-call exchange this lesson's exercises test."
  pl.b1.unit13.teach.dialogue.line02:
    title: "Urzędniczka confirms the appointment"
    gloss: "One moment... yes, I can say that the appointment is free on Monday."
    note: "*mogę* -- present-ability embedded clause, confirming availability."
  pl.b1.unit13.teach.dialogue.line03:
    title: "Ewa asks about last week"
    gloss: "Great! And last week you couldn't say that yet?"
    note: "A follow-up question about the clerk's past ability, not a new fact to contradict."
  pl.b1.unit13.teach.dialogue.line04:
    title: "Urzędniczka explains the delay"
    gloss: "No, last week the system still wasn't working."
    note: "Explains why past ability (mogłam) was unavailable."
  pl.b1.unit13.teach.dialogue.line05:
    title: "Ewa asks for a hypothetical callback"
    gloss: "I understand. If I gave my phone number, could you call back with a confirmation?"
    note: "*Gdybym* + *mogłaby pani* -- a hypothetical condition posed to the clerk."
  pl.b1.unit13.teach.dialogue.line06:
    title: "Urzędniczka agrees"
    gloss: "Of course, I could call back tomorrow morning with a confirmation."
    note: "*mogłabym* -- conditional ability, closing the unit's three-way contrast."

  pl.b1.unit13.lesson04.teach.review_note:
    title: "Móc across three tenses/moods"
    gloss: "\"Móc\" + \"że\"/\"czy\"-clause: mogę (now) vs mogłam/mogłem (past) vs mogłabym/mógłbym (hypothetical -- under some condition)."
    note: "The full three-part contrast this unit's culminating exercise requires."

