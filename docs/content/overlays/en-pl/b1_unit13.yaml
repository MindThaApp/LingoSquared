lessons:
  pl.b1.unit13.lesson01.moge_powiedziec_ze:
    title: "Mogę powiedzieć, że... (I can say that...)"
  pl.b1.unit13.lesson02.mogłam_i_mogłabym:
    title: "Mogłam and mogłabym (past and hypothetical ability)"
  pl.b1.unit13.lesson03.rozmowa_w_urzedzie:
