answer_policy:
  diacritics: >-
    Same standing policy as unit01-18: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek, Kraków/
    Krakowie).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit19.pogoda:
    title: "Weather"

lessons:
  pl.a1.unit19.lesson01.jaka_pogoda:
    title: "What's the weather like?"
  pl.a1.unit19.lesson02.pada_snieg:
    title: "It's snowing"
  pl.a1.unit19.lesson03.rozmowa_o_pogodzie:
    title: "A conversation about the weather"

teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: "What, is, today, not -- again"
    gloss: "Jaka, jest, Dziś, nie -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them to talk about the weather."

  pl.a1.unit19.lesson01.teach.pogoda:
    title: "Weather"
    gloss: "weather"
    note: "The general word for weather or weather conditions."
    example_gloss: "What's the weather like?"

  pl.a1.unit19.lesson01.teach.zimno:
    title: "Cold"
    gloss: "cold"
    note: "Describes the temperature -- it doesn't change form for gender."
    example_gloss: "It's cold."

  pl.a1.unit19.lesson01.teach.goraco:
    title: "Hot"
    gloss: "hot"
    note: "The opposite of '*zimno*' -- also doesn't change form for gender."
    example_gloss: "It's hot."

  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: "It's cold, it's hot"
    gloss: "Jest zimno. Jest gorąco. -- this is how we describe weather in Polish: '*jest*' plus a weather word, with no gender agreement."
    note: "The same simple pattern works for every weather word in this unit."

  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: "What's the weather like?"
    gloss: "What's the weather like?"
    note: "A natural way to ask about current weather."

  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: "It's cold today"
    gloss: "It's cold today."
    note: "The fact this whole unit builds on for today's weather."

  pl.a1.unit19.lesson02.teach.pada:
    title: "It's raining"
    gloss: "it's raining / it rains"
    note: "Used alone, with no subject -- this is the normal way to say it's raining in Polish."
    example_gloss: "It's raining today."

  pl.a1.unit19.lesson02.teach.snieg:
    title: "Snow"
    gloss: "snow"
    note: "The word for snow -- paired with '*pada*' it means 'it's snowing.'"
    example_gloss: "It's snowing."

  pl.a1.unit19.lesson02.teach.mgla:
    title: "Fog"
    gloss: "fog"
    note: "Another common weather condition."
    example_gloss: "It's foggy."

  pl.a1.unit19.lesson02.teach.dobra_note:
    title: "Good"
    gloss: "Pogoda jest dobra. -- '*dobra*' matches feminine nouns, like '*pogoda*.'"
    note: "The feminine form of '*dobry*' (as in '*Dzień dobry*') -- the same -y/-a pattern as *chory/chora*."

  pl.a1.unit19.lesson02.teach.straszna_note:
    title: "Terrible"
    gloss: "Jaka straszna pogoda! -- '*straszna*' also matches '*pogoda*,' just like '*dobra*.'"
    note: "A strong word -- use it for genuinely bad weather."

  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: "What awful weather!"
    gloss: "What awful weather!"
    note: "A natural exclamation about bad weather."

  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: "The weather is good"
    gloss: "The weather is good."
    note: "Reusing the weather word from earlier in this lesson."

  pl.a1.unit19.lesson03.teach.recap_words:
    title: "Yes, and, I, also -- again"
    gloss: "Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit19.lesson03.teach.bo:
    title: "Because"
    gloss: "because"
    note: "Connects a plan to the weather reason behind it."
    example_gloss: "I'm not going to the park, because it's raining."

  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: "I don't want to go, because it's raining"
    gloss: "I don't want to go to the park, because it's raining."
    note: "A weather description paired with a real plan -- exactly what this unit is building toward."

  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: "In Kraków -- again"
    gloss: "W Krakowie -- you already know this from earlier lessons, e.g. 'Ona mieszka w Krakowie' (She lives in Kraków)."
    note: "A quick reminder before this lesson's dialogue compares the weather in two places."

  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: "Marek asks about the weather"
    gloss: "What's the weather like today?"
    note: "Marek opens the conversation by asking about today's weather."
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: "Ewa answers"
    gloss: "It's raining. It's cold."
    note: "Ewa describes today's actual weather."
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: "Marek reacts and makes a plan"
    gloss: "What awful weather! I don't want to go to the park, because it's raining."
    note: "Marek reacts to the weather and states his plan because of it."
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: "Ewa agrees"
    gloss: "I'm also not going to the park."
    note: "Ewa makes the same plan as Marek."
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: "Marek asks about Kraków"
    gloss: "And in Kraków? What's the weather like there?"
    note: "Marek turns the conversation to a different city's weather."
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: "Ewa answers"
    gloss: "In Kraków it's snowing. It's very cold there."
    note: "Ewa describes a different, colder weather condition in Kraków."

exercises:
  pl.a1.unit19.lesson01.exercise01.select_pogoda:
    instruction: "Which word means 'weather'?"
    correct_option: "pogoda"
    distractors: ["zimno", "gorąco"]
    accepted_answers: ["pogoda"]

  pl.a1.unit19.lesson01.exercise02.select_zimno:
    instruction: "Which word means 'cold'?"
    correct_option: "zimno"
    distractors: ["pogoda", "gorąco"]
    accepted_answers: ["zimno"]

  pl.a1.unit19.lesson01.exercise03.select_goraco:
    instruction: "Which word means 'hot'?"
    correct_option: "gorąco"
    distractors: ["pogoda", "zimno"]
    accepted_answers: ["gorąco"]

  pl.a1.unit19.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "pogoda": "weather"
      "zimno": "cold"
      "gorąco": "hot"
      "Jaka": "what"
      "jest": "is"
      "Dziś": "today"

  pl.a1.unit19.lesson01.exercise05.order_dzis_jest_zimno:
    instruction: "Put the sentence 'It's cold today' in order."
    correct_response: ["Dziś", "jest", "zimno"]

  pl.a1.unit19.lesson01.exercise06.order_jaka_jest_pogoda:
    instruction: "Put the question 'What's the weather like?' in order."
    correct_response: ["Jaka", "jest", "pogoda"]

  pl.a1.unit19.lesson01.exercise07.fill_marek_pyta_pogoda:
    instruction: "Complete the question: 'What's the weather like? It's cold today.'"
    accepted_answers: ["pogoda"]
    feedback: "Jaka jest pogoda? -- pogoda is the word for weather."

  pl.a1.unit19.lesson01.exercise08.fix_jaka_jest_pogoda:
    instruction: "Fix the word order -- put the question 'What's the weather like?' in the natural order."
    accepted_answers:
      - "Jaka jest pogoda?"
      - "Jaka jest pogoda"
    feedback: "Jaka jest pogoda?, not Pogoda jaka jest? -- Jaka comes first in this question."

  pl.a1.unit19.lesson01.exercise09.speak_dzis_jest_zimno:
    instruction: "Say: 'It's cold today.'"
    accepted_answers:
      - "Dziś jest zimno."
      - "Dziś jest zimno"

  pl.a1.unit19.lesson02.exercise01.select_pada:
    instruction: "Which word means 'it's raining'?"
    correct_option: "pada"
    distractors: ["śnieg", "mgła"]
    accepted_answers: ["pada"]

  pl.a1.unit19.lesson02.exercise02.select_snieg:
    instruction: "Which word means 'snow'?"
    correct_option: "śnieg"
    distractors: ["pada", "mgła"]
    accepted_answers: ["śnieg"]

  pl.a1.unit19.lesson02.exercise03.select_mgla:
    instruction: "Which word means 'fog'?"
    correct_option: "mgła"
    distractors: ["pada", "śnieg"]
    accepted_answers: ["mgła"]

  pl.a1.unit19.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "pada": "it's raining"
      "śnieg": "snow"
      "mgła": "fog"
      "dobra": "good"
      "straszna": "terrible"
      "Jaka": "what"

  pl.a1.unit19.lesson02.exercise05.order_pada_snieg:
    instruction: "Put the sentence 'It's snowing' in order."
    correct_response: ["Pada", "śnieg"]

  pl.a1.unit19.lesson02.exercise06.order_jaka_straszna_pogoda:
    instruction: "Put the exclamation 'What awful weather!' in order."
    correct_response: ["Jaka", "straszna", "pogoda"]

  pl.a1.unit19.lesson02.exercise07.fill_dobra_pogoda:
    instruction: "Complete the sentence: 'The weather isn't terrible. The weather is ___.'"
    accepted_answers: ["dobra"]
    feedback: "Pogoda jest dobra -- dobra is the word for good, matching pogoda."

  pl.a1.unit19.lesson02.exercise08.fix_jaka_straszna_pogoda:
    instruction: "Fix the word order -- put the exclamation 'What awful weather!' in the natural order."
    accepted_answers:
      - "Jaka straszna pogoda!"
      - "Jaka straszna pogoda"
    feedback: "Jaka straszna pogoda!, not Straszna jaka pogoda! -- Jaka comes first."

  pl.a1.unit19.lesson02.exercise09.speak_jaka_straszna_pogoda:
    instruction: "Say: 'What awful weather!'"
    accepted_answers:
      - "Jaka straszna pogoda!"
      - "Jaka straszna pogoda"

  pl.a1.unit19.lesson03.exercise01.select_marek_no_park_line:
    instruction: "Which line says Marek doesn't want to go to the park?"
    correct_option: "Jaka straszna pogoda! Nie chcę iść do parku, bo pada."
    distractors:
      - "Jaka dziś jest pogoda?"
      - "A w Krakowie? Jaka tam jest pogoda?"
    accepted_answers:
      - "Jaka straszna pogoda! Nie chcę iść do parku, bo pada."
      - "Jaka straszna pogoda Nie chcę iść do parku bo pada"

  pl.a1.unit19.lesson03.exercise02.select_ewa_also_no_park_line:
    instruction: "Which line says Ewa is also not going to the park?"
    correct_option: "Ja też nie idę do parku."
    distractors:
      - "Pada. Jest zimno."
      - "W Krakowie pada śnieg. Tam jest bardzo zimno."
    accepted_answers:
      - "Ja też nie idę do parku."
      - "Ja też nie idę do parku"

  pl.a1.unit19.lesson03.exercise03.comprehend_today_weather:
    instruction: "Read the line. What's the weather like today?"
    correct_option: "raining and cold"
    distractors:
      - "hot and sunny"
      - "snowing and foggy"
    accepted_answers:
      - "pada zimno"
      - "pada, zimno"
      - "raining and cold"

  pl.a1.unit19.lesson03.exercise04.comprehend_krakow_weather:
    instruction: "Read the line. What's the weather like in Kraków?"
    correct_option: "snowing and very cold"
    distractors:
      - "hot and dry"
      - "raining and foggy"
    accepted_answers:
      - "śnieg zimno"
      - "śnieg, bardzo zimno"
      - "snowing and very cold"

  pl.a1.unit19.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "pogoda": "weather"
      "zimno": "cold"
      "gorąco": "hot"
      "pada": "it's raining"
      "śnieg": "snow"
      "mgła": "fog"
      "dobra": "good"
      "straszna": "terrible"
      "bo": "because"

  pl.a1.unit19.lesson03.exercise06.order_nie_chce_isc_do_parku:
    instruction: "Put the sentence 'I don't want to go to the park' in order."
    correct_response: ["Nie", "chcę", "iść", "do", "parku"]

  pl.a1.unit19.lesson03.exercise07.order_ja_tez_nie_ide_do_parku:
    instruction: "Put the sentence 'I'm also not going to the park' in order."
    correct_response: ["Ja", "też", "nie", "idę", "do", "parku"]

  pl.a1.unit19.lesson03.exercise08.fill_bo_pada:
    instruction: "Complete the sentence: 'I'm not going to the park, ___ it's raining.'"
    accepted_answers: ["bo"]
    feedback: "Nie idę do parku, bo pada -- bo is the word for because."

  pl.a1.unit19.lesson03.exercise09.fix_w_krakowie_pada_snieg:
    instruction: "Fix the word order -- put the sentence 'In Kraków it's snowing' in the natural order."
    accepted_answers:
      - "W Krakowie pada śnieg."
      - "W Krakowie pada śnieg"
    feedback: "W Krakowie pada śnieg, not Krakowie w pada śnieg -- w must come directly before Krakowie."

  pl.a1.unit19.lesson03.exercise10.reply_jaka_dzis_pogoda:
    instruction: "Answer as Ewa: say it's raining and cold."
    accepted_answers:
      - "Pada. Jest zimno."
      - "Pada, jest zimno."
      - "Pada i jest zimno."
      - "Pada. Jest zimno"
      - "Jest zimno i pada."
      - "Jest zimno. Pada."
      - "Dziś pada. Jest zimno."
      - "Dziś pada i jest zimno."

  pl.a1.unit19.lesson03.exercise11.speak_nie_chce_isc_bo_pada:
    instruction: "Say: 'I don't want to go to the park, because it's raining.'"
    accepted_answers:
      - "Nie chcę iść do parku, bo pada."
      - "Nie chcę iść do parku bo pada"
