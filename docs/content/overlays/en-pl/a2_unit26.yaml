    No genuinely ambiguous multi-clause join in this unit -- every taught
    sentence is a single clause, so §12 doesn't add a second accepted form
    anywhere. Every note/feedback string mixing Polish text inline with
    English wraps the Polish in *asterisks* per §15. Every matching_pairs
    correct_response and word_order correct_response checked
    token-for-token against the realization's own pairs/word_bank. No
    stray YAML boolean coercion. Pending fresh-context review per
    AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    false-grammar -- grammar_check prompts "Pytania mam." and "Od razu
    jestem dostępny." are grammatical Polish presented as errors: replaced
