    underdetermined-prompt -- lesson02.exercise09/10 and
    lesson03.exercise11 pinned "as Marek" (dostępny/pracowałem vs feminine
    forms). NATIVE CHECK: none.

    Second-pass review 2026-10-19: 1 fix - lesson03.teach.godziny_elastyczne
    introduces elastyczne (later tested in a fill and a match) but the card
    only glossed "working hours" -> note now states elastyczne means flexible.

    Second-pass follow-up 2026-10-19: 1 fix - teaching line06 note "directly serving this unit's spine outcome" -> learner-facing wording about interview questions (internal-jargon).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-25: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the
    model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit26.rozmowa_kwalifikacyjna:
    title: "Job interview"

lessons:
  pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej:
    title: "Job interview vocabulary"
  pl.a2.unit26.lesson02.pracowalem_jako_inzynier:
    title: "I worked as an engineer"
  pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej:
    title: "At the job interview"

teaching:
  pl.a2.unit26.lesson01.teach.recap_words:
    title: "Good day, please, thank you -- again"
    gloss: "Dzień, dobry, Proszę, dziękuję, jest, jestem, są, mam, ma, i, w, Tak, Czy, kiedy, pracować, pracuję, trzy, inżynier, pan -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them for a job interview."

  pl.a2.unit26.lesson01.teach.praca:
    title: "Job / work"
    gloss: "job / work"
    note: "A feminine noun."
    example_gloss: "I'm looking for a job."

  pl.a2.unit26.lesson01.teach.rozmowa_kwalifikacyjna:
    title: "Job interview"
    gloss: "job interview"
    note: "The standard Polish term for a job interview."
    example_gloss: "I have a job interview."

  pl.a2.unit26.lesson01.teach.doswiadczenie:
    title: "Experience"
    gloss: "experience"
    note: "A neuter noun."
    example_gloss: "I have a lot of experience."

  pl.a2.unit26.lesson01.teach.pytania:
    title: "Questions"
    gloss: "questions"
    note: "The plural of *pytanie*."
    example_gloss: "I have questions."

  pl.a2.unit26.lesson02.teach.pracowalem_note:
    title: "I worked -- masculine past tense"
    gloss: "pracowałem -- the past tense of \"pracować\" (a man speaking about himself): I worked."
    note: "Extends the past tense you already know (from the earlier past-events lesson) to a new verb, in a genuinely new context: describing work experience."

  pl.a2.unit26.lesson02.teach.jako:
    title: "As"
    gloss: "as"
    note: "Used to name a role, e.g. \"as an engineer\"."
    example_gloss: "I work as an engineer."

  pl.a2.unit26.lesson02.teach.trzy_lata_doswiadczenia_phrase:
    title: "I worked three years as an engineer"
    gloss: "I worked three years as an engineer."
    note: "*lata* is the plural of *rok* (year) used after the number three."

  pl.a2.unit26.lesson02.teach.dostepny:
    title: "Available"
    gloss: "available"
    note: "The masculine form."
    example_gloss: "I'm available."

  pl.a2.unit26.lesson02.teach.od_razu:
    title: "Right away"
    gloss: "right away / immediately"
    note: "A fixed idiomatic phrase."
    example_gloss: "I can start right away."

  pl.a2.unit26.lesson02.teach.jestem_dostepny_od_razu_phrase:
    title: "I'm available right away"
    gloss: "I'm available right away."
    note: "A direct, useful answer to an availability question."

  pl.a2.unit26.lesson03.teach.godziny_elastyczne:
    title: "Working hours"
    gloss: "working hours"
    note: "*godziny* (hours) + *pracy* (of work, genitive of *praca*). In the example, *elastyczne* means \"flexible\"."
    example_gloss: "The working hours are flexible."

  pl.a2.unit26.teach.dialogue.line01:
    title: "The recruiter asks about experience"
    gloss: "Good day! What experience do you have, sir?"
    note: "A direct, standard opening interview question."
  pl.a2.unit26.teach.dialogue.line02:
    title: "Marek describes his experience"
    gloss: "I worked three years as an engineer."
    note: "Marek uses this lesson's past-tense-plus-duration construction."
  pl.a2.unit26.teach.dialogue.line03:
    title: "The recruiter asks about availability"
    gloss: "Great. When are you available, sir?"
    note: "A natural interview follow-up."
  pl.a2.unit26.teach.dialogue.line04:
    title: "Marek states his availability"
    gloss: "I'm available right away."
    note: "A confident, direct answer."
  pl.a2.unit26.teach.dialogue.line05:
    title: "The recruiter invites questions"
    gloss: "Excellent. Do you have any questions, sir?"
    note: "The standard interview close, inviting the candidate to ask something."
  pl.a2.unit26.teach.dialogue.line06:
    title: "Marek asks a clarifying question"
    gloss: "Yes. What are the working hours?"
    note: "Marek's own clarifying question about the role, exactly the kind of question worth asking in an interview."
  pl.a2.unit26.teach.dialogue.line07:
    title: "The recruiter answers"
    gloss: "The working hours are flexible."
    note: "A concrete, useful answer to Marek's question."

exercises:
  pl.a2.unit26.lesson01.exercise01.select_praca:
    instruction: "Which word means 'job/work'?"
    correct_option: "praca"
    distractors: ["doświadczenie", "pytania"]
    accepted_answers: ["praca"]

  pl.a2.unit26.lesson01.exercise02.select_doswiadczenie:
    instruction: "Which word means 'experience'?"
    correct_option: "doświadczenie"
    distractors: ["praca", "pytania"]
    accepted_answers: ["doświadczenie"]

  pl.a2.unit26.lesson01.exercise03.select_pytania:
    instruction: "Which word means 'questions'?"
    correct_option: "pytania"
    distractors: ["praca", "doświadczenie"]
    accepted_answers: ["pytania"]

  pl.a2.unit26.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "praca": "job / work"
      "rozmowa kwalifikacyjna": "job interview"
      "doświadczenie": "experience"
      "pytania": "questions"
      "inżynier": "engineer"

  pl.a2.unit26.lesson01.exercise05.order_mam_rozmowe_kwalifikacyjna:
    instruction: "Put the sentence 'I have a job interview' in order."
    correct_response: ["Mam", "rozmowę", "kwalifikacyjną"]

  pl.a2.unit26.lesson01.exercise06.order_mam_pytania:
    instruction: "Put the sentence 'I have questions' in order."
    correct_response: ["Mam", "pytania"]

  pl.a2.unit26.lesson01.exercise07.fill_mam_doswiadczenie:
    instruction: "Complete the sentence: 'Marek says: I have a lot of ___.' (experience)"
    accepted_answers: ["doświadczenie"]
    feedback: "Mam duże doświadczenie -- doświadczenie is the word for experience."

  pl.a2.unit26.lesson01.exercise08.fix_mam_pytania:
    instruction: "Fix the error in the sentence 'I have questions'."
    accepted_answers:
      - "Mam pytania."
      - "Mam pytania"
      - "Ja mam pytania."
      - "Ja mam pytania"
    feedback: "Mam pytania, not Ja ma pytania -- with ja (I) the verb form is mam; ma means he/she has."

  pl.a2.unit26.lesson01.exercise09.write_doswiadczenie:
    instruction: "Write the Polish word for 'experience'."
    accepted_answers:
      - "doświadczenie"

  pl.a2.unit26.lesson02.exercise01.select_pracowalem_trzy_lata:
    instruction: "Which sentence describes three years of work experience?"
    correct_option: "Pracowałem trzy lata jako inżynier."
    distractors: ["Jestem dostępny od razu.", "Mam pytania."]
    accepted_answers:
      - "Pracowałem trzy lata jako inżynier."
      - "Pracowałem trzy lata jako inżynier"

  pl.a2.unit26.lesson02.exercise02.select_jestem_dostepny_od_razu:
    instruction: "Which sentence says you're available right away?"
    correct_option: "Jestem dostępny od razu."
    distractors: ["Pracowałem trzy lata jako inżynier.", "Mam doświadczenie."]
    accepted_answers:
      - "Jestem dostępny od razu."
      - "Jestem dostępny od razu"

  pl.a2.unit26.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "praca": "job / work"
      "doświadczenie": "experience"
      "pracowałem": "I worked (masculine)"
      "jako": "as"
      "dostępny": "available"
      "od razu": "right away"

  pl.a2.unit26.lesson02.exercise04.order_pracowalem_trzy_lata:
    instruction: "Put the sentence 'I worked three years as an engineer' in order."
    correct_response: ["Pracowałem", "trzy", "lata", "jako", "inżynier"]

  pl.a2.unit26.lesson02.exercise05.order_jestem_dostepny_od_razu:
    instruction: "Put the sentence 'I'm available right away' in order."
    correct_response: ["Jestem", "dostępny", "od", "razu"]

  pl.a2.unit26.lesson02.exercise06.fill_pracowalem_jako:
    instruction: "Complete the sentence: 'I worked three years ___ an engineer.' (as)"
    accepted_answers: ["jako"]
    feedback: "Pracowałem trzy lata jako inżynier -- jako is the word for as."

  pl.a2.unit26.lesson02.exercise07.fix_jestem_dostepny_od_razu:
    instruction: "Fix the error in Marek's sentence 'I'm available right away'."
    accepted_answers:
      - "Jestem dostępny od razu."
      - "Jestem dostępny od razu"
      - "Ja jestem dostępny od razu."
      - "Ja jestem dostępny od razu"
      - "Od razu jestem dostępny."
      - "Od razu jestem dostępny"
    feedback: "Jestem dostępny od razu, not Ja jest dostępny od razu -- with ja (I) the verb form is jestem; jest means he/she/it is."

  pl.a2.unit26.lesson02.exercise08.reply_jakie_ma_pan_doswiadczenie:
    instruction: "The recruiter asks: 'Do you have experience, sir?' Answer as Marek: say you worked three years as an engineer."
    accepted_answers:
      - "Pracowałem trzy lata jako inżynier."
      - "Pracowałem trzy lata jako inżynier"
      - "Tak, pracowałem trzy lata jako inżynier."
      - "Tak, pracowałem trzy lata jako inżynier"
      - "Tak. Pracowałem trzy lata jako inżynier."
      - "Trzy lata pracowałem jako inżynier."
      - "Trzy lata pracowałem jako inżynier"
      - "Pracowałem jako inżynier trzy lata."
      - "Pracowałem jako inżynier trzy lata"

  pl.a2.unit26.lesson02.exercise09.write_jestem_dostepny_od_razu:
    instruction: "Write, as Marek: 'I'm available right away.'"
    accepted_answers:
      - "Jestem dostępny od razu."
      - "Jestem dostępny od razu"
      - "Od razu jestem dostępny."
      - "Od razu jestem dostępny"

  pl.a2.unit26.lesson02.exercise10.speak_pracowalem_trzy_lata:
    instruction: "Say, as Marek: 'I worked three years as an engineer.'"
    accepted_answers:
      - "Pracowałem trzy lata jako inżynier."
      - "Pracowałem trzy lata jako inżynier"
      - "Trzy lata pracowałem jako inżynier."
      - "Trzy lata pracowałem jako inżynier"
      - "Pracowałem jako inżynier trzy lata."
      - "Pracowałem jako inżynier trzy lata"

  pl.a2.unit26.lesson03.exercise01.select_marek_describes_experience:
    instruction: "Which line shows Marek describing his experience?"
    correct_option: "Pracowałem trzy lata jako inżynier."
    distractors:
      - "Jestem dostępny od razu."
      - "Tak. Jakie są godziny pracy?"
    accepted_answers:
      - "Pracowałem trzy lata jako inżynier."
      - "Pracowałem trzy lata jako inżynier"

  pl.a2.unit26.lesson03.exercise02.select_marek_asks_hours:
    instruction: "Which line shows Marek asking about working hours?"
    correct_option: "Tak. Jakie są godziny pracy?"
    distractors:
      - "Pracowałem trzy lata jako inżynier."
      - "Jestem dostępny od razu."
    accepted_answers:
      - "Tak. Jakie są godziny pracy?"
      - "Tak. Jakie są godziny pracy"

  pl.a2.unit26.lesson03.exercise03.comprehend_experience_length:
    instruction: "Read the line. How many years of experience does Marek have?"
    correct_option: "three years"
    distractors:
      - "one year"
      - "five years"
    accepted_answers:
      - "trzy lata"
      - "three years"

  pl.a2.unit26.lesson03.exercise04.comprehend_availability:
    instruction: "Read the line. When is Marek available?"
    correct_option: "right away"
    distractors:
      - "next month"
      - "in two weeks"
    accepted_answers:
      - "od razu"
      - "right away"

  pl.a2.unit26.lesson03.exercise05.read_working_hours_answer:
    instruction: "According to the dialogue, what are the working hours like?"
    correct_option: "flexible"
    distractors:
      - "nine to five, fixed"
      - "night shifts only"
    accepted_answers:
      - "elastyczne"
      - "flexible"

  pl.a2.unit26.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "praca": "job / work"
      "doświadczenie": "experience"
      "pracowałem": "I worked (masculine)"
      "dostępny": "available"
      "od razu": "right away"
      "godziny pracy": "working hours"
      "elastyczne": "flexible"
      "pytania": "questions"

  pl.a2.unit26.lesson03.exercise07.order_jakie_ma_pan_doswiadczenie:
    instruction: "Put the question 'What experience do you have, sir?' in order."
    correct_response: ["Jakie", "ma", "pan", "doświadczenie"]

  pl.a2.unit26.lesson03.exercise08.fill_godziny_pracy_elastyczne:
    instruction: "Complete the sentence: 'The recruiter says: The working hours are ___.' (flexible)"
    accepted_answers: ["elastyczne"]
    feedback: "Godziny pracy są elastyczne -- elastyczne is the word for flexible."

  pl.a2.unit26.lesson03.exercise09.fix_jakie_sa_godziny_pracy:
    instruction: "Fix the word order -- put the question 'What are the working hours?' in the natural order."
    accepted_answers:
      - "Jakie są godziny pracy?"
      - "Jakie są godziny pracy"
    feedback: "Jakie są godziny pracy?, not Godziny są jakie pracy? -- Jakie must open this question."

  pl.a2.unit26.lesson03.exercise10.reply_czy_ma_pan_pytania:
    instruction: "The recruiter asks: 'Do you have any questions, sir?' Answer as Marek: say yes, and ask about the working hours."
    accepted_answers:
      - "Tak. Jakie są godziny pracy?"
      - "Tak, jakie są godziny pracy?"
      - "Tak. Jakie są godziny pracy"
      - "Tak, jakie są godziny pracy"

  pl.a2.unit26.lesson03.exercise11.speak_jestem_dostepny_od_razu:
    instruction: "Say, as Marek: 'I'm available right away.'"
    accepted_answers:
      - "Jestem dostępny od razu."
      - "Jestem dostępny od razu"
      - "Od razu jestem dostępny."
      - "Od razu jestem dostępny"
