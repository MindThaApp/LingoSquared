teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: To call
    gloss: to call
    note: The infinitive of the verb for making a phone call.
    example_gloss: I have to call you.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Saying you'll call
    gloss: I'll call you.
    note: '*Zadzwonię* is the perfective future of *zadzwonić* (to call, once). Polish uses it for a promise, like English ''I''ll call''.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Answering the phone
    gloss: Hello, this is Ewa.
    note: '*Tu* + name (literally ''here ...'') is the standard way to identify yourself on the phone, where English says ''this is''.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek answers the same way
    gloss: Hello, this is Marek.
    note: Same *tu* + name pattern as *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Asking who's calling
    gloss: Who am I speaking with?
    note: '*Z kim rozmawiam?* (literally ''with whom am I talking?'') is the standard phrase for an unfamiliar caller; *kim* is the instrumental after *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Identifying yourself formally
    gloss: You're speaking with Ewa.
    note: '*Rozmawia pan z Ewą* is the formal version: *pan* (to a man) or *pani* (to a woman) with the 3rd-person verb, and *z* + instrumental.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Asking for repetition
    gloss: Can you repeat that?
    note: '*Możesz* (can you, from *móc*) + the infinitive *powtórzyć* (to repeat) + *to* (that).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Asking someone to slow down
    gloss: Don't speak so fast, please.
    note: '*Nie mów* is the negative imperative (don''t speak); *tak szybko* means ''so fast''.'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Saying you can't hear well
    gloss: I can't hear you well.
    note: '*Nie słyszę cię dobrze* states a hearing problem; *cię* is the accusative of *ty* and *dobrze* means ''well''.'
  pl.a1.unit22.lesson04.teach.sms:
    title: Text message
    gloss: the text message
    note: '*SMS* is a masculine noun borrowed from English: *ten SMS*.'
    example_gloss: The text message is from Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Saying you'll send a text
    gloss: I'll send you a text.
    note: '*Wysłać* (to send) takes the dative *ci* (to you) for the person and the accusative for the thing sent: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Saying you'll call back
    gloss: I'll call you back later.
    note: '*Oddzwonić* (to call back) is a single verb in Polish: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Read a text exchange
    gloss: 'Marek: Hi Ewa, can you call me? I need to tell you something. Ewa: Yes of course, I''ll call you back in five minutes.'
    note: Track what Marek asks for, why, and when Ewa says she'll call back.
    glosses:
      Cześć: hi
      możesz: can
      zadzwonić: call
      Muszę: need to / must
      coś: something
      powiedzieć: tell
      oczywiście: of course
      oddzwonię: call
      pięć: five
      minut: minutes
      za: back
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek answers the call
    gloss: 'Marek: Hello, this is Marek.'
    note: 'The same *tu* + name pattern from lesson 1, now used in the actual phone call: the person who picks up speaks first and gives their name.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa identifies herself
    gloss: 'Ewa: Hi Marek, this is Ewa. Marek: Nice that you''re calling!'
    note: '*Fajnie, że* ... (nice that ...) expresses a positive reaction to an event; *że* introduces the clause.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa asks about the shift
    gloss: 'Ewa: How was your first shift?'
    note: '*Jak ci poszła ...?* (literally ''how did ... go for you?'') asks about something that already happened. *Ci* is the dative of *ty*, and *poszła* agrees with the feminine noun *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek reports good news
    gloss: 'Marek: It went really well, better than I thought.'
    note: '*Poszło* is the past of *iść* with the ending *-o* (''it''; here ''to turn out''); *myślałem* is the past of *myśleć* (to think), with the ending for a male speaker.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Past tense: było, poszło, myślałem'
    gloss: 'Past tense: *było* (was) from *być* (to be), *poszło* (went) from *iść* (to go), *myślałem* (I thought) from *myśleć* (to think).'
    note: 'Polish past tense is built with *-ł-* plus a gender ending: *myślał* (he), *myślała* (she), *było* (it). For now, learn *było*, *poszło* and *myślałem* as fixed forms in the contexts they appear in this lesson.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa is proud
    gloss: 'Ewa: How nice to hear! I''m proud of you.'
    note: '*Dumny z* (proud of) is a fixed combination: *z* + genitive, so *z ciebie*. Ewa is a woman, so she says *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek is touched
    gloss: 'Marek: Thank you, that means a lot to me.'
    note: '*Znaczy* is the *on/ona/ono* form of *znaczyć* (to mean); *dla mnie* (for me) says who it matters to.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: His
    gloss: His first shift went really well.
    note: '*Jego* (his) never changes and goes before the noun: *jego pierwsza zmiana*; the feminine noun does not affect it.'
