teaching:
  pl.a2.unit65.lesson01.teach.ekran:
    title: The screen
    gloss: the screen
    note: '*Ekran* (screen) is a masculine noun.'
    example_gloss: I often look at my screen.
  pl.a2.unit65.lesson01.teach.uzywam_telefonu_czesto:
    title: Saying you use your phone often
    gloss: I use my phone often.
    note: '*Często* (often) can stand before or after the verb phrase. *Używać* (to use) takes the genitive: *używam telefonu*, not *telefon*.'
  pl.a2.unit65.lesson01.teach.jak_czesto_korzystasz:
    title: Asking how often someone uses social media
    gloss: How often do you use social media?
    note: '*Media społecznościowe* (social media) is a plural noun phrase. After *korzystać z* it is in the genitive plural: *korzystasz z mediów społecznościowych*.'
  pl.a2.unit65.lesson02.teach.aplikacja:
    title: The app
    gloss: the app
    note: '*Aplikacja* (app) is a feminine noun. In the genitive it is *aplikacji*, as in *używam aplikacji*.'
    example_gloss: I use an app to chat.
  pl.a2.unit65.lesson02.teach.czesto_pisze_z:
    title: Saying you chat with friends
    gloss: I often chat with friends on my phone.
    note: '*Pisać z kimś* (literally "to write with someone") is the everyday way to say you chat or text with a person. *Z* takes the instrumental: *z przyjaciółmi*.'
  pl.a2.unit65.lesson02.teach.ktorych_aplikacji_uzywasz:
    title: Asking which apps someone uses most
    gloss: Which apps do you use most?
    note: '*Najczęściej* (most often) is the superlative of *często*. *Których aplikacji* is the genitive plural, because *używać* takes the genitive.'
  pl.a2.unit65.lesson03.teach.czas_przed_ekranem:
    title: Screen time
    gloss: screen time
    note: '*Czas przed ekranem* (screen time) is a phrase made of *czas* (time, masculine) + *przed* (in front of) + the instrumental *ekranem*.'
    example_gloss: I have too much screen time this week.
  pl.a2.unit65.lesson03.teach.uwazam_ze_spedzam:
    title: Giving an opinion about your own screen time
    gloss: I think I have too much screen time.
    note: '*Uważam, że ...* (I think that ...) is the standard way to introduce an opinion. A comma always comes before *że*.'
  pl.a2.unit65.lesson03.teach.to_nie_jest:
    title: Saying something isn't good for your eyes
    gloss: It's not good for your eyes.
    note: '*Dla twoich oczu* (for your eyes): *dla* takes the genitive, and *twoich* is the informal "your", matching this unit''s informal register.'
  pl.a2.unit65.lesson04.teach.nawyk:
    title: The habit
    gloss: the habit
    note: '*Nawyk* (habit) is a masculine noun.'
    example_gloss: It's a bad habit to keep checking your phone.
  pl.a2.unit65.lesson04.teach.moim_zdaniem_powinno:
    title: Giving an opinion with moim zdaniem
    gloss: In my opinion, you should spend less time on your phone.
    note: '*Moim zdaniem* (in my opinion, literally "in my view") is another standard way to introduce an opinion, alongside *uważam, że*. *Powinno się* (literally "one should") gives advice without addressing anyone directly, so it needs no masculine or feminine form.'
  pl.a2.unit65.lesson04.teach.zgadzam_sie_z:
    title: Agreeing with someone's opinion
    gloss: I agree with that.
    note: '*Zgadzać się z czymś* (to agree with something) is the set phrase. *Z* takes the instrumental: *zgadzam się z tym*; *z tym* refers back to what was just said.'
  pl.a2.unit65.lesson05.teach.wiele_osob_uzywa:
    title: Reading a blog post about screen time
    gloss: Many people use their phone more than four hours a day. Social media is fun, but too much screen time isn't healthy. Try spending an hour every evening without your phone. That's good for your eyes and your sleep.
    note: '*Spróbuj* is the imperative of *spróbować* (to try). It is followed directly by an infinitive, *spędzić* (to spend): *Spróbuj spędzić godzinę bez telefonu.* This is a common way to make a suggestion.'
    glosses:
      Wiele: many / a lot of
      osób: people (genitive plural of osoba)
      używa: use (3rd person singular of używać)
      swojego: their
      telefonu: phone
      więcej: more
      niż: than (więcej niż = more than)
      cztery: four
      godziny: hour(s)
      dziennie: day
      społecznościowe: social (adjective, from sociaal)
      Media: media
      są: are (3rd person plural of być, to be)
      fajne: fun / nice
      ale: but
      dużo: a lot, much (zbyt dużo = too much)
      ekranem: screen time
      nie: not
      zdrowe: healthy
      Spróbuj: try (imperative of spróbować)
      każdego: every / each
      wieczoru: evening
      bez: without
      spędzić: to spend (time); from spędzić
      To: that
      dobrze: good
      oczy: eyes (plural of oko)
      sen: sleep
  pl.a2.unit65.lesson06.teach.marek_jak_czesto:
    title: Marek asks how often
    gloss: 'Marek: How often do you use social media, Ewa?'
  pl.a2.unit65.lesson06.teach.ewa_wlasciwie_dosc:
    title: Ewa answers with a number
    gloss: 'Ewa: Actually pretty often. I do look at my screen about three hours a day.'
  pl.a2.unit65.lesson06.teach.marek_to_calkiem:
    title: Marek questions the amount
    gloss: 'Marek: That''s quite a lot. Don''t you think that''s too much?'
  pl.a2.unit65.lesson06.teach.ewa_owszem_wlasciwie:
    title: Ewa agrees it's too much
    gloss: 'Ewa: Yes, I actually think it''s too much. I want to spend less time on my phone.'
  pl.a2.unit65.lesson06.teach.marek_moze_moglabys:
    title: Marek suggests putting the phone away
    gloss: 'Marek: Maybe you could put your phone away in the evenings.'
  pl.a2.unit65.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa agrees to try it
    gloss: 'Ewa: Good idea. I''ll try that starting today.'
  pl.a2.unit65.lesson06.teach.ewa_uwaza_ze:
    title: 'Third person singular: uważa, spędza, chce'
    gloss: Ewa thinks she has too much screen time. She wants to spend less time on her phone.
    note: 'In the third person singular the verbs end in *-a* or *-e*: *uważa* (thinks), *spędza* (spends), *chce* (wants). Polish usually drops the pronoun *ona* (she), because the ending already shows the person. Compare *uważam* (I think) and *uważasz* (you think).'
