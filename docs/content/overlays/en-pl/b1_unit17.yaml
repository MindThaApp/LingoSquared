teaching:
  pl.b1.unit17.lesson01.teach.jesli_zdaze_na_czas:
    title: "If I make it in time, I'll catch the eight o'clock train"
    gloss: "If I make it in time, I'll catch the eight o'clock train."
    note: "*Jeśli zdążę na czas* -- a real/likely condition, future tense in both clauses."
    example_gloss: "Tomorrow morning, if I make it in time, I'll catch the eight o'clock train."
  pl.b1.unit17.lesson01.teach.jesli_nie_zdaze:
    title: "If I don't make it in time, I'll catch the next train"
    gloss: "If I don't make it in time, I'll catch the next train."
    note: "*Jeśli nie zdążę* -- negating only the condition clause; the result clause is a DIFFERENT sentence, not just negated."
    example_gloss: "And if I don't make it in time, I'll catch the next train."
  pl.b1.unit17.lesson01.teach.negacja_note:
    title: "Negating the condition"
    gloss: "Negating the condition: \"jeśli nie\" + verb -- negates ONLY the if-clause, the result stays as its own separate outcome."
    note: "The outcome's own explicit negation requirement."
  pl.b1.unit17.lesson01.teach.recap_basics:
    title: "Today I'm going to work by train"
    gloss: "Today I'm going to work by train."
    note: "Recap vocabulary used elsewhere in this unit."
    example_gloss: "Every day I go to work by train, not by car."

  pl.b1.unit17.lesson02.teach.jesli_starczy_mi_pieniedzy:
    title: "If I have enough money, I'll buy new shoes"
    gloss: "If I have enough money, I'll buy new shoes."
    note: "*Starczyć* + dative (to whom) + genitive (of what) -- literally \"money suffices to me\"."
    example_gloss: "On Saturday I'm going shopping -- if I have enough money, I'll buy new shoes."
  pl.b1.unit17.lesson02.teach.jesli_nie_starczy:
    title: "If I don't have enough money, I'll wait until next month"
    gloss: "If I don't have enough money, I'll wait until next month."
    note: "The negated condition, same *starczyć* construction; *do przyszłego miesiąca* takes the genitive after \"do\"."
    example_gloss: "But if I don't have enough money, I'll wait until next month."
  pl.b1.unit17.lesson02.teach.starczyc_note:
    title: "Starczyć + dative + genitive"
    gloss: "\"Starczyć\" + dative (to whom) + genitive (of what) -- literally \"something suffices to someone\", i.e. \"I have enough\"."
    note: "The second real-planning topic's core construction."

  pl.b1.unit17.teach.dialogue.line01:
    title: "Ewa asks about tomorrow's meeting"
    gloss: "What time are you going tomorrow to the meeting?"
    note: "Opens the train-planning exchange."
  pl.b1.unit17.teach.dialogue.line02:
    title: "Marek states the real condition and its negation"
    gloss: "If I make it in time, I'll catch the eight o'clock train. If I don't make it, I'll catch the next one."
    note: "Both halves of lesson01's contrast in one line."
  pl.b1.unit17.teach.dialogue.line03:
    title: "Marek asks about the shopping trip"
    gloss: "And you, are you going shopping tomorrow for new shoes?"
    note: "Transitions to the shopping-budget topic."
  pl.b1.unit17.teach.dialogue.line04:
    title: "Ewa states her real condition"
    gloss: "Yes, if I have enough money, I'll buy new shoes."
    note: "*Jeśli starczy mi pieniędzy* -- the affirmative half."
  pl.b1.unit17.teach.dialogue.line05:
    title: "Marek asks about the negated case"
    gloss: "And if you don't have enough money?"
    note: "Prompts the negated condition Ewa answers in the next line."
  pl.b1.unit17.teach.dialogue.line06:
    title: "Ewa states her fallback plan"
    gloss: "Then I'll wait until next month."
    note: "The negated condition's result, completing the contrast."

  pl.b1.unit17.lesson04.teach.review_note:
    title: "Real condition + negation"
    gloss: "Real condition + negation: \"jeśli\" + future tense (a possible event), \"jeśli nie\" + future tense (negating ONLY the condition, with a different result)."
    note: "The full pattern this unit's culminating exercise requires."

