review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eighteenth en-pl overlay, written for pl/a1_unit18_housing.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start). No
    sibling-direction overlay exists yet for this unit (pl-en hasn't been
    authored), so the sibling-isolation rule (AUTHORING_GUIDE §8) doesn't
    apply here -- noted for whoever authors pl-en next: do not open this file
    for structure/phrasing reference when doing so.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    lesson02.exercise08.fix_lazienka_location -- error sentence 'Łazienka tam
    jest.' is grammatical Polish (free word order), so marking it wrong and
    the feedback 'jest comes right after the subject' taught a false rule ->
    error sentence 'Łazienka są tam.' (verb-agreement error; są taught since
    unit03), instruction/feedback rewritten to target the verb. (2)
    lesson01.teach.ile_pokoi_note overlay note -- 'pokoje is used right after
    a number like dwa' -> 'after dwa, trzy or cztery' (pięć takes pokoi).
    NATIVE CHECK: 'W domu są kuchnia, sypialnia i łazienka' / 'W kuchni są
    lodówka i piekarnik' -- plural są with a list of singular subjects is
    acceptable, but 'jest' (agreement with nearest noun) may be more natural.
    NATIVE CHECK: lesson01.exercise08 'Marek dom ma.' marked wrong --
    marked/emphatic rather than strictly ungrammatical.

answer_policy:
  diacritics: >-
    Same standing policy as unit01-17: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit18.dom:
    title: "Home"

lessons:
  pl.a1.unit18.lesson01.moj_dom:
    title: "My home"
  pl.a1.unit18.lesson02.pokoje_w_domu:
    title: "Rooms in the house"
  pl.a1.unit18.lesson03.rozmowa_o_mieszkaniu:
    title: "A conversation about housing"

teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: "House, is, has -- again"
    gloss: "Dom, jest, ma, Marek, Ewa -- you already know these words from earlier lessons, e.g. 'Dom jest tam' (the house is there)."
    note: "A quick reminder before this lesson uses them to talk about your home."

  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: "Apartment"
    gloss: "apartment"
    note: "A flat, rather than a whole house."
    example_gloss: "Ewa has an apartment."

  pl.a1.unit18.lesson01.teach.duzy_note:
    title: "Big"
    gloss: "The house is big. -- '*duży*' matches masculine nouns, like '*dom*.'"
    note: >-
      This is the first time in this course a word describes size -- for now
      it only applies to '*dom*.'

  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: "Marek's home"
    gloss: "Marek has a house. The house is big."
    note: "The fact this whole unit builds on for Marek."

  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: "Ewa's home"
    gloss: "Ewa has an apartment."
    note: "The fact this whole unit builds on for Ewa."

  pl.a1.unit18.lesson01.teach.pokoj:
    title: "Room"
    gloss: "room"
    note: "A general word for any room in a home."
    example_gloss: "Where is the room?"

  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: "How many rooms?"
    gloss: "How many rooms do you have? I have two rooms. -- you already know 'Ile,' numbers, and 'mam'/'masz' from earlier lessons; '*pokoi*' and '*pokoje*' are forms of the word '*pokój*.'"
    note: >-
      '*Pokoi*' is used right after '*Ile*'; '*pokoje*' is used right after
      '*dwa*', '*trzy*' or '*cztery*' (two, three, four).

  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: "How many rooms do you have?"
    gloss: "How many rooms do you have?"
    note: "A natural question to ask about someone's home."

  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: "I have two rooms"
    gloss: "I have two rooms."
    note: "A natural answer to the question above."

  pl.a1.unit18.lesson02.teach.kuchnia:
    title: "Kitchen"
    gloss: "kitchen"
    note: "One of the most common rooms in a home."
    example_gloss: "The kitchen is small."

  pl.a1.unit18.lesson02.teach.mala_note:
    title: "Small"
    gloss: "The kitchen is small. -- '*mała*' matches feminine nouns, like '*kuchnia*.'"
    note: >-
      This is a separate word from '*duży*' (big) -- for now it only applies
      to '*kuchnia*.'

  pl.a1.unit18.lesson02.teach.sypialnia:
    title: "Bedroom"
    gloss: "bedroom"
    note: "The room where you sleep."
    example_gloss: "Where is the bedroom?"

  pl.a1.unit18.lesson02.teach.lazienka:
    title: "Bathroom"
    gloss: "bathroom"
    note: "The room with the shower and toilet."
    example_gloss: "Where is the bathroom?"

  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: "Where, there -- again"
    gloss: "Gdzie, tam -- you already know these words from earlier lessons, e.g. 'Bank jest tam' (the bank is there)."
    note: "A quick reminder before this lesson uses them to talk about rooms."

  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: "In the room, in the kitchen..."
    gloss: "W + room, kitchen, bedroom, bathroom: w pokoju, w kuchni, w sypialni, w łazience -- the same pattern as w szkole (at school) or w biurze (at the office)."
    note: >-
      Same idea as the workplace words you already learned -- the ending
      changes a little to say "in" that room.

  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: "Where's the bathroom?"
    gloss: "Where is the bathroom? The bathroom is there."
    note: "A natural exchange for finding a room in someone's home."

  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: "The kitchen is small"
    gloss: "The kitchen is small."
    note: "Reusing the size word from earlier in this lesson."

  pl.a1.unit18.lesson03.teach.recap_words:
    title: "Yes, and, are -- again"
    gloss: "Tak, i, są, A, ja, jeden -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit18.lesson03.teach.lodowka:
    title: "Refrigerator"
    gloss: "refrigerator / fridge"
    note: "A common kitchen appliance."
    example_gloss: "There's a fridge in the kitchen."

  pl.a1.unit18.lesson03.teach.piekarnik:
    title: "Oven"
    gloss: "oven"
    note: "Another common kitchen appliance."
    example_gloss: "There's an oven in the kitchen."

  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: "Marek describes his house"
    gloss: "I have a house. The house is big."
    note: "Marek opens the conversation by describing his home."
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: "Ewa asks about rooms"
    gloss: "How many rooms do you have?"
    note: "Ewa asks a natural follow-up question."
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: "Marek answers"
    gloss: "I have two rooms. The house has a kitchen, a bedroom, and a bathroom."
    note: "Marek states his room count and lists the rooms in his house."
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: "Ewa describes her home"
    gloss: "And I have an apartment. I have one room."
    note: "Ewa turns to describing her own, smaller home."
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: "Ewa asks about the kitchen"
    gloss: "Is the kitchen small?"
    note: "Ewa asks Marek a follow-up question about his kitchen."
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: "Marek answers"
    gloss: "Yes, the kitchen is small. There's a fridge and an oven in the kitchen."
    note: "Marek confirms the kitchen's size and names two objects in it."

exercises:
  pl.a1.unit18.lesson01.exercise01.select_mieszkanie:
    instruction: "Which word means 'apartment'?"
    correct_option: "mieszkanie"
    distractors: ["dom", "pokój"]
    accepted_answers: ["mieszkanie"]

  pl.a1.unit18.lesson01.exercise02.select_pokoj:
    instruction: "Which word means 'room'?"
    correct_option: "pokój"
    distractors: ["dom", "mieszkanie"]
    accepted_answers: ["pokój"]

  pl.a1.unit18.lesson01.exercise03.select_duzy:
    instruction: "Which word means 'big'?"
    correct_option: "duży"
    distractors: ["mieszkanie", "pokój"]
    accepted_answers: ["duży"]

  pl.a1.unit18.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "dom": "house"
      "mieszkanie": "apartment"
      "pokój": "room"
      "duży": "big"
      "Ile": "how many"
      "dwa": "two"
      "masz": "you have"
      "Mam": "I have"

  pl.a1.unit18.lesson01.exercise05.order_dom_jest_duzy:
    instruction: "Put the sentence 'The house is big' in order."
    correct_response: ["Dom", "jest", "duży"]

  pl.a1.unit18.lesson01.exercise06.order_ile_pokoi_masz:
    instruction: "Put the question 'How many rooms do you have?' in order."
    correct_response: ["Ile", "pokoi", "masz"]

  pl.a1.unit18.lesson01.exercise07.fill_ewa_mieszkanie:
    instruction: "Complete the sentence: 'Marek has a house. Ewa has an apartment.'"
    accepted_answers: ["mieszkanie"]
    feedback: "Ewa ma mieszkanie -- mieszkanie is the word for apartment."

  pl.a1.unit18.lesson01.exercise08.fix_marek_ma_dom:
    instruction: "Fix the word order -- put the sentence 'Marek has a house' in the natural order."
    accepted_answers:
      - "Marek ma dom."
      - "Marek ma dom"
    feedback: "Marek ma dom, not Marek dom ma -- the verb ma comes right after the subject."

  pl.a1.unit18.lesson01.exercise09.speak_mam_dwa_pokoje:
    instruction: "Say: 'I have two rooms.'"
    accepted_answers:
      - "Mam dwa pokoje."
      - "Mam dwa pokoje"

  pl.a1.unit18.lesson02.exercise01.select_kuchnia:
    instruction: "Which word means 'kitchen'?"
    correct_option: "kuchnia"
    distractors: ["sypialnia", "łazienka"]
    accepted_answers: ["kuchnia"]

  pl.a1.unit18.lesson02.exercise02.select_sypialnia:
    instruction: "Which word means 'bedroom'?"
    correct_option: "sypialnia"
    distractors: ["kuchnia", "łazienka"]
    accepted_answers: ["sypialnia"]

  pl.a1.unit18.lesson02.exercise03.select_lazienka:
    instruction: "Which word means 'bathroom'?"
    correct_option: "łazienka"
    distractors: ["kuchnia", "sypialnia"]
    accepted_answers: ["łazienka"]

  pl.a1.unit18.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "kuchnia": "kitchen"
      "sypialnia": "bedroom"
      "łazienka": "bathroom"
      "mała": "small"
      "Gdzie": "where"
      "tam": "there"

  pl.a1.unit18.lesson02.exercise05.order_kuchnia_jest_mala:
    instruction: "Put the sentence 'The kitchen is small' in order."
    correct_response: ["Kuchnia", "jest", "mała"]

  pl.a1.unit18.lesson02.exercise06.order_gdzie_jest_lazienka:
    instruction: "Put the question 'Where is the bathroom?' in order."
    correct_response: ["Gdzie", "jest", "łazienka"]

  pl.a1.unit18.lesson02.exercise07.fill_sypialni_locative:
    instruction: "Complete the pattern: kuchnia -> w kuchni; sypialnia -> w ___."
    accepted_answers: ["sypialni"]
    feedback: "w sypialni -- sypialni is the form used after w, the same pattern as w kuchni."

  pl.a1.unit18.lesson02.exercise08.fix_lazienka_location:
    instruction: "Fix the verb -- there is only one bathroom: 'The bathroom is there.'"
    accepted_answers:
      - "Łazienka jest tam."
      - "Łazienka jest tam"
    feedback: "Łazienka jest tam, not Łazienka są tam -- one bathroom takes jest (is); są means 'are.'"

  pl.a1.unit18.lesson02.exercise09.speak_gdzie_jest_lazienka:
    instruction: "Say: 'Where is the bathroom?'"
    accepted_answers:
      - "Gdzie jest łazienka?"
      - "Gdzie jest łazienka"

  pl.a1.unit18.lesson03.exercise01.select_marek_kitchen_small_line:
    instruction: "Which line says Marek's kitchen is small?"
    correct_option: "Tak, kuchnia jest mała. W kuchni są lodówka i piekarnik."
    distractors:
      - "Mam dom. Dom jest duży."
      - "Mam dwa pokoje. W domu są kuchnia, sypialnia i łazienka."
    accepted_answers:
      - "Tak, kuchnia jest mała. W kuchni są lodówka i piekarnik."
      - "Tak kuchnia jest mała W kuchni są lodówka i piekarnik"

  pl.a1.unit18.lesson03.exercise02.select_ewa_one_room_line:
    instruction: "Which line says Ewa has one room?"
    correct_option: "A ja mam mieszkanie. Mam jeden pokój."
    distractors:
      - "Ile pokoi masz?"
      - "Kuchnia jest mała?"
    accepted_answers:
      - "A ja mam mieszkanie. Mam jeden pokój."
      - "A ja mam mieszkanie Mam jeden pokój"

  pl.a1.unit18.lesson03.exercise03.comprehend_marek_room_count:
    instruction: "Read the line. How many rooms does Marek have?"
    correct_option: "two"
    distractors:
      - "one"
      - "three"
    accepted_answers:
      - "dwa"
      - "two"

  pl.a1.unit18.lesson03.exercise04.comprehend_kitchen_contents:
    instruction: "Read the line. What is in the kitchen?"
    correct_option: "a fridge and an oven"
    distractors:
      - "a table and a chair"
      - "a bed and a lamp"
    accepted_answers:
      - "lodówka i piekarnik"
      - "lodówka piekarnik"
      - "a fridge and an oven"

  pl.a1.unit18.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "dom": "house"
      "mieszkanie": "apartment"
      "pokój": "room"
      "kuchnia": "kitchen"
      "sypialnia": "bedroom"
      "łazienka": "bathroom"
      "lodówka": "fridge"
      "piekarnik": "oven"
      "duży": "big"
      "mała": "small"

  pl.a1.unit18.lesson03.exercise06.order_mam_jeden_pokoj:
    instruction: "Put the sentence 'I have one room' in order."
    correct_response: ["Mam", "jeden", "pokój"]

  pl.a1.unit18.lesson03.exercise07.order_ewa_ma_mieszkanie:
    instruction: "Put the sentence 'Ewa has an apartment' in order."
    correct_response: ["Ewa", "ma", "mieszkanie"]

  pl.a1.unit18.lesson03.exercise08.fill_kuchnia_piekarnik:
    instruction: "Complete the sentence: 'There's a fridge and an oven in the kitchen.'"
    accepted_answers: ["piekarnik"]
    feedback: "W kuchni są lodówka i piekarnik -- piekarnik is the word for oven."

  pl.a1.unit18.lesson03.exercise09.fix_ewa_jeden_pokoj_order:
    instruction: "Fix the word order -- put the sentence 'Ewa has one room' in the natural order."
    accepted_answers:
      - "Ewa ma jeden pokój."
      - "Ewa ma jeden pokój"
    feedback: "Ewa ma jeden pokój, not Ewa ma pokój jeden -- the number comes right before the noun."

  pl.a1.unit18.lesson03.exercise10.reply_ile_pokoi_masz:
    instruction: "Answer as Marek: say you have two rooms."
    accepted_answers:
      - "Mam dwa pokoje."
      - "Mam dwa pokoje"
      - "Mam dwa pokoje, a ty?"

  pl.a1.unit18.lesson03.exercise11.speak_kuchnia_jest_mala:
    instruction: "Say: 'The kitchen is small.'"
    accepted_answers:
      - "Kuchnia jest mała."
      - "Kuchnia jest mała"
