  pl.a2.unit87.lesson02.exercise06.traduce_powiedziala: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Ewa powiedziała, że jest w pracy.", "status": "correct"}, {"value": "Ewa powiedziała, że jest w pracy", "status": "correct"}], "feedback": "The second verb is still present: *jest*."}
