teaching:
  pl.a2.unit87.lesson01.teach.mowic: {"title": "To say", "gloss": "I say / you say / he says, she says", "note": "*Mówić* is used for what someone says. Add *że* ('that') and a comma to pass the words on.", "example_gloss": ["Marek says that he is ill.", "Ewa says that she has time.", "I say that it is difficult.", "Nina says that she is at work."]}
  pl.a2.unit87.lesson01.teach.gn_ze: {"title": "Mówi, że...", "gloss": "Marek says that he is ill. Ewa says that she has time.", "note": "To pass on a statement, use *mówi, że* and keep the verb in the same tense as the original words. Marek said: *Jestem chory*. You report: *Marek mówi, że jest chory*."}
  pl.a2.unit87.lesson01.teach.gn_osoby: {"title": "Change the person", "gloss": "I say that I have time. You say that you have time. Marek says that he has time.", "note": "The verb after *że* matches the person who has the time: *mam*, *masz*, *ma*."}
  pl.a2.unit87.lesson01.teach.gn_przyszlosc: {"title": "Future stays future", "gloss": "Marek says that he will come tomorrow. Ewa says that she will call.", "note": "A promise stays in the future after *że*."}
  pl.a2.unit87.lesson02.teach.powiedziec: {"title": "To say (past)", "gloss": "he said / she said / I said (woman) / I said (man)", "note": "*Powiedzieć* is the past tense for reporting what someone said.", "example_gloss": ["Marek said that he is ill.", "Ewa said that she has time.", "I said that I am at work (woman).", "I said that I have time (man)."]}
  pl.a2.unit87.lesson02.teach.gn_powiedzial: {"title": "Powiedział, że...", "gloss": "Marek said that he is ill. Ewa said that she has time.", "note": "Even after a past verb like *powiedział*, the second verb keeps the tense of the original words. Marek said *Jestem chory*, so: *powiedział, że jest chory* (present), not a past form."}
  pl.a2.unit87.lesson02.teach.gn_przyszlosc: {"title": "Said that he will", "gloss": "Nina said that she will come tomorrow. Marek said that he will call.", "note": "A future promise stays in the future after *powiedział, że*."}
  pl.a2.unit87.lesson02.teach.gn_ja: {"title": "I said that", "gloss": "I said that I have time (woman). I said that I am at work (man).", "note": "When you report your own words, the verb *powiedzieć* shows your gender: *-łam* or *-łem*."}
  pl.a2.unit87.lesson03.teach.pytac: {"title": "To ask", "gloss": "he asks, she asks / he asked / she asked", "note": "Use *czy* after these verbs to pass on a yes or no question.", "example_gloss": ["Ewa asks whether I have time.", "Marek asked whether I am at work.", "Nina asked whether Marek will come."]}
  pl.a2.unit87.lesson03.teach.gn_pyta: {"title": "Pyta, czy...", "gloss": "Ewa asks whether I have time. Marek asks whether I am at home.", "note": "The direct question was *Czy masz czas?* (to you). When you report it to someone else, *you* becomes *I*: *czy mam czas*."}
  pl.a2.unit87.lesson03.teach.gn_zapytal: {"title": "Zapytał, czy...", "gloss": "Marek asked whether I am at work. Nina asked whether Marek will come.", "note": "Again the tense of the original question stays the same after *czy*."}
  pl.a2.unit87.lesson03.teach.gn_gdzie: {"title": "Pyta, gdzie / kiedy", "gloss": "Ewa asks where Marek is. Marek asked when the train leaves.", "note": "For questions with a question word, use that word instead of *czy*."}
  pl.a2.unit87.lesson04.teach.prosic: {"title": "To ask for something", "gloss": "he asks, she asks / he asked / she asked", "note": "Use these verbs to pass on a request.", "example_gloss": ["Marek asks you to call (to a man).", "Nina asked me to write to Marek (a woman speaking).", "Can I pass something on?"]}
  pl.a2.unit87.lesson04.teach.gn_prosi: {"title": "Prosi, żebyś", "gloss": "Marek asks you to call. Ewa asks you to come.", "note": "A request passed on uses *żeby* and a past-tense-looking form, as in the earlier unit about aims. *Żebyś* means 'that you'."}
  pl.a2.unit87.lesson04.teach.gn_poprosil: {"title": "Poprosił, żebym", "gloss": "Nina asked me to write to Marek. Marek asked me to call.", "note": "*Żebym* means 'that I'. The ending shows the gender of the person who acts: *napisała* for a woman."}
  pl.a2.unit87.lesson04.teach.gn_przekazac: {"title": "Passing on a message", "gloss": "Can I pass something on? I can pass the message on to Ewa.", "note": "*Przekazać* is the verb for passing on a message. *Ewie* is the dative of *Ewa*: the person who receives it."}
  pl.a2.unit87.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "she called / she cannot come / I called (woman)", "note": "*Dzwoniła Nina* means 'Nina called'.", "example_gloss": ["Nina called today.", "Nina cannot come.", "I called Marek."]}
  pl.a2.unit87.lesson05.teach.gn_ewa: {"title": "What Nina said", "gloss": "She said that she is at work and cannot come. She asked whether I have time tomorrow.", "note": "Ewa passes on a statement with *że* and a question with *czy*."}
  pl.a2.unit87.lesson05.teach.gn_ewa2: {"title": "What Nina asked", "gloss": "She asked me to call Marek. I said that I have time.", "note": "Ewa passes on a request with *żebym* and tells her own answer with *powiedziałam, że*."}
  pl.a2.unit87.lesson05.teach.lectura: {"title": "Ewa passes it on", "gloss": "Nina called today. She said that she is at work and cannot come. She asked whether I have time tomorrow. She asked me to call Marek. I said that I have time, and I called Marek.", "note": "Ewa tells in one voice what Nina said, asked and requested.", "glosses": {"powiedziała": "she said", "zapytała": "she asked", "poprosiła": "she asked for", "żebym": "that I", "czy": "whether"}}
  pl.a2.unit87.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. Did anyone call?"}
  pl.a2.unit87.lesson06.teach.d2: {"title": "Ewa reports", "gloss": "Ewa: Yes, Nina called. She says that she is at work and cannot come."}
  pl.a2.unit87.lesson06.teach.d3: {"title": "Marek asks more", "gloss": "Marek: And what else?"}
  pl.a2.unit87.lesson06.teach.d4: {"title": "Ewa continues", "gloss": "Ewa: She asks whether you have time tomorrow. She asks you to call."}
  pl.a2.unit87.lesson06.teach.d5: {"title": "Marek decides", "gloss": "Marek: I have time. I will call Nina."}
  pl.a2.unit87.lesson06.teach.d6: {"title": "Ewa agrees", "gloss": "Ewa: Good. Call right away."}
exercises:
