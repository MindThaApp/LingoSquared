  pl.a2.unit87.lesson04.exercise01.elige_prosi: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek prosi, żebyś zadzwonił.", "distractors": ["Marek prosi, żebyś zadzwonić.", "Marek prosi, że zadzwonił.", "Marek prosi, żebyś zadzwoniła."], "accepted_answers": [{"value": "Marek prosi, żebyś zadzwonił.", "status": "correct"}], "feedback": "A request: *prosi, żebyś zadzwonił*."}
  pl.a2.unit87.lesson04.exercise02.elige_przekazac: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Czy mogę coś przekazać?", "distractors": ["Czy mogę coś przekazuję?", "Czy możesz coś przekazać?", "Czy mogę coś przekazał?"], "accepted_answers": [{"value": "Czy mogę coś przekazać?", "status": "correct"}], "feedback": "*Czy mogę* + the infinitive *przekazać*."}
  pl.a2.unit87.lesson04.exercise03.une_prosi: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "prosi", "right": "he asks, she asks (for something)"}, {"left": "poprosił", "right": "he asked (for something)"}, {"left": "poprosiła", "right": "she asked (for something)"}, {"left": "żebyś zadzwonił", "right": "that you (man) call"}, {"left": "żebym napisała", "right": "that I (woman) write"}, {"left": "przekazać", "right": "to pass on"}, {"left": "wiadomość", "right": "message"}, {"left": "Czy mogę coś przekazać?", "right": "Can I pass something on?"}], "status": "correct"}], "feedback": "Requests and passing on messages."}
