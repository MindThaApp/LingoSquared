  pl.a2.unit87.lesson03.exercise06.traduce_zapytal: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Marek zapytał, czy jestem w pracy.", "status": "correct"}, {"value": "Marek zapytał, czy jestem w pracy", "status": "correct"}], "feedback": "*Czy jestem w pracy* keeps the present."}
