  pl.a2.unit87.lesson03.exercise01.elige_pyta: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa pyta, czy mam czas.", "distractors": ["Ewa pyta, że mam czas.", "Ewa pyta, czy ma czas.", "Ewa pyta, czy miałem czas."], "accepted_answers": [{"value": "Ewa pyta, czy mam czas.", "status": "correct"}], "feedback": "*Czy mam czas* because I am the one with time."}
