  pl.a2.unit87.lesson04.exercise06.traduce_poprosila: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Nina poprosiła, żebym napisała do Marka.", "status": "correct"}, {"value": "Nina poprosiła, żebym napisała do Marka", "status": "correct"}], "feedback": "*Żebym napisała*."}
