  pl.a2.unit87.lesson01.exercise05.completa_ze: {"instruction": "Complete with the word that means 'that'.", "correct_option": "że", "accepted_answers": [{"value": "że", "status": "correct"}], "feedback": "*Że* connects the report to the words."}
  pl.a2.unit87.lesson01.exercise06.traduce_marek: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Marek mówi, że przyjdzie jutro.", "status": "correct"}, {"value": "Marek mówi, że przyjdzie jutro", "status": "correct"}], "feedback": "*Przyjdzie* stays in the future."}
  pl.a2.unit87.lesson01.exercise07.escribe_ewa: {"instruction": "Write one Polish sentence.", "correct_option": "Ewa mówi, że jest w pracy.", "accepted_answers": [{"value": "Ewa mówi, że jest w pracy.", "status": "correct"}, {"value": "Ewa mówi, że jest w pracy", "status": "correct"}], "feedback": "*Ewa mówi, że jest w pracy.*"}
  pl.a2.unit87.lesson02.exercise01.elige_powiedzial: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek powiedział, że jest chory.", "distractors": ["Marek powiedział, że był chory.", "Marek powiedziała, że jest chory.", "Marek powiedział, że jestem chory."], "accepted_answers": [{"value": "Marek powiedział, że jest chory.", "status": "correct"}], "feedback": "Marek is he: *powiedział*, then *jest chory*."}
