  pl.a2.unit87.lesson05.exercise01.lee_nina: {"instruction": "Read the story and choose the answer.", "correct_option": "That she is at work and cannot come.", "distractors": ["That she is ill.", "That she is at the station.", "That she has no time tomorrow."], "accepted_answers": [{"value": "That she is at work and cannot come.", "status": "correct"}], "feedback": "*Powiedziała, że jest w pracy i nie może przyjść.*"}
