  pl.a2.unit87.lesson01.exercise02.elige_ewa: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa mówi, że ma czas.", "distractors": ["Ewa mówi, że mam czas.", "Ewa mówi, że masz czas.", "Ewa mówi, że miała czas."], "accepted_answers": [{"value": "Ewa mówi, że ma czas.", "status": "correct"}], "feedback": "*Ewa* is she: *ma czas*."}
  pl.a2.unit87.lesson01.exercise03.une_mowi: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "mówię", "right": "I say"}, {"left": "mówisz", "right": "you say"}, {"left": "mówi", "right": "he says, she says"}, {"left": "że", "right": "that"}, {"left": "Marek mówi, że jest chory.", "right": "Marek says that he is ill."}, {"left": "Ewa mówi, że ma czas.", "right": "Ewa says that she has time."}, {"left": "Nina mówi, że jest w pracy.", "right": "Nina says that she is at work."}, {"left": "Marek mówi, że przyjdzie jutro.", "right": "Marek says that he will come tomorrow."}], "status": "correct"}], "feedback": "Forms of mówić and sentences with że."}
