answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit72.kiedy_bylem_maly: {"title": "When I Was Little", "description": "Describe how life used to be, in childhood or at an earlier home, with the imperfective past, and say how it differs from now."}
lessons:
  pl.a2.unit72.lesson01.kiedys_mieszkalem: {"title": "I Used to Live"}
  pl.a2.unit72.lesson02.bylem_i_mialem: {"title": "I Was and I Had"}
  pl.a2.unit72.lesson03.kiedys_i_teraz: {"title": "Then and Now"}
  pl.a2.unit72.lesson04.dom_szkola_jedzenie: {"title": "Home, School, Food"}
  pl.a2.unit72.lesson05.lato_u_babci: {"title": "Summer at Grandma's"}
  pl.a2.unit72.lesson06.jak_to_bylo: {"title": "What Was It Like?"}
teaching:
  pl.a2.unit72.lesson01.teach.czasowniki: {"title": "Verbs for everyday life", "gloss": "to live / to play / to eat / to read / to go on foot, to attend / to go by vehicle, to ride", "note": "These verbs are all imperfective: they describe what went on or happened again and again. *Chodzić* and *jeździć* are the verbs for repeated going (on foot / by vehicle).", "example_gloss": ["Once I lived in the countryside.", "Ewa lived in a small house.", "Marek played football.", "Ewa read books.", "Marek went to school.", "Ewa rode a bike."]}
  pl.a2.unit72.lesson01.teach.kiedys: {"title": "Then and now", "gloss": "once, in the past / in the old days / now / always / often", "note": "*Kiedyś* and *dawniej* look back at the past; *teraz* is the present. *Zawsze* and *często* mark a habit.", "example_gloss": ["Once I played football.", "In the old days Ewa read books.", "In the old days Marek read books.", "Marek always played football.", "Ewa often rode a bike.", "Once Ewa lived in the countryside, now she lives in the city."]}
  pl.a2.unit72.lesson01.teach.gn_koncowki: {"title": "The past tense of mieszkać", "gloss": "I lived (a man speaking). I lived (a woman speaking). He lived. She lived. We lived. We lived (all women).", "note": "The past tense is built on the infinitive stem plus -ł- and an ending. A man says -łem, a woman says -łam; he is -ł, she is -ła; we is -liśmy, or -łyśmy for an all-female group. English 'used to' is rendered with this plain imperfective past; the 'używać/zwykle + infinitive' pattern is not taught here."}
  pl.a2.unit72.lesson01.teach.gn_jesc: {"title": "The past tense of jeść", "gloss": "I ate (a man speaking). I ate (a woman speaking). He ate. She ate. We ate. We ate (all women).", "note": "*Jeść* has an irregular stem: *jad-* in most forms, but *jedliśmy* for a mixed or male group. Learn these forms as a set."}
  pl.a2.unit72.lesson01.teach.frazy: {"title": "Three sentences", "gloss": "Once I lived in the countryside. Marek often played football. Ewa always read books.", "note": "Habit words like *często* and *zawsze* usually stand before the verb."}
  pl.a2.unit72.lesson02.teach.dziecinstwo: {"title": "Childhood words", "gloss": "when / house / garden / dog / cat / school / town", "note": "*Kiedy* introduces a time clause. *Być* (to be) and *mieć* (to have) in the past describe states, how things were.", "example_gloss": ["When I was little, I had a dog.", "Ewa had a cat.", "We had a big garden.", "The house was big and the school was small.", "The town was small."]}
  pl.a2.unit72.lesson02.teach.opis: {"title": "Small and big", "gloss": "small (m.) / small (f.) / small (n.) / big (m.) / big (f.) / big (n.)", "note": "The adjective matches the noun: -y for masculine, -a for feminine, -e for neuter.", "example_gloss": ["Marek was little.", "Ewa was little.", "The yard was big.", "The school was big."]}
  pl.a2.unit72.lesson02.teach.gn_byc: {"title": "The past tense of być", "gloss": "I was (a man speaking). I was (a woman speaking). He was. She was. It was. We were. We were (all women).", "note": "*Był* goes with a masculine noun, *była* with a feminine one and *było* with a neuter one. A speaker adds -em or -am to say 'I was'."}
  pl.a2.unit72.lesson02.teach.gn_miec: {"title": "The past tense of mieć", "gloss": "I had a dog (a man speaking). I had a dog (a woman speaking). He had a dog. She had a dog. We had a dog. We had a dog (all women).", "note": "*Mieć* in the past works like the other verbs, but the plural for a mixed or male group is *mieliśmy*."}
  pl.a2.unit72.lesson02.teach.gn_zgoda: {"title": "Was and the noun", "gloss": "The house was big. The school was big. The town was big.", "note": "The past of *być* and the adjective both follow the gender of the noun: dom (m.) was *był duży*, szkoła (f.) *była duża*, miasto (n.) *było duże*."}
  pl.a2.unit72.lesson03.teach.markery: {"title": "Habit words", "gloss": "every day / every summer / each day / a lot / little", "note": "These words tell us that something happened again and again, so the verb is imperfective.", "example_gloss": ["Marek went to school every day.", "Every day I went to school.", "Every summer we went to Grandma's.", "Each day Ewa read books.", "Once I read a lot, now I read little."]}
  pl.a2.unit72.lesson03.teach.teraz: {"title": "The present for now", "gloss": "I live / he or she lives / I play / he or she plays / I read / he or she reads", "note": "To say how things are now, use the present tense with *teraz*.", "example_gloss": ["Now I live in the city.", "Marek now lives in the city.", "Now Ewa reads little.", "Marek plays football."]}
  pl.a2.unit72.lesson03.teach.gn_kontrast: {"title": "Then and now", "gloss": "Once I lived in the countryside, now I live in the city. In the old days I played football, now I read books.", "note": "Put the past before the comma and the present after it: the past goes with *kiedyś* and *dawniej*, the present with *teraz*."}
  pl.a2.unit72.lesson03.teach.gn_aspekt: {"title": "A habit and a single event", "gloss": "Every summer we went to Grandma's. One summer we went to the sea.", "note": "A repeated habit uses the imperfective *jeździć*. One finished trip uses the perfective *pojechać*. Only this one contrast is taught here; learn *pewnego lata* ('one summer') as a set phrase."}
  pl.a2.unit72.lesson03.teach.fraza: {"title": "A useful sentence", "gloss": "It used to be like this, now it is different.", "note": "*Było* and *jest* are the past and present of *być*."}
  pl.a2.unit72.lesson04.teach.dom: {"title": "Home and school", "gloss": "room / yard / kitchen / classroom / teacher", "note": "After *w* and *na* the noun changes its ending (*dom* becomes *domu*, *podwórko* becomes *podwórku*). Learn these as chunks.", "example_gloss": ["In the house there was a big room.", "In the yard Marek often played football.", "There was soup in the kitchen.", "There was a teacher in the classroom."]}
  pl.a2.unit72.lesson04.teach.jedzenie: {"title": "Food and hobbies", "gloss": "soup / bread / milk / coffee / cartoons / to watch / to drink", "note": "*Pić* in the past is *pił* (he), *piła* (she), *piłem* or *piłam* (I). The present is *piję*, *pije*.", "example_gloss": ["Ewa drank milk every day.", "Marek watched cartoons.", "Ewa watched cartoons.", "For lunch we ate soup.", "Once I drank milk, now I drink coffee.", "Now Ewa drinks coffee."]}
  pl.a2.unit72.lesson04.teach.gn_bylo: {"title": "What there was", "gloss": "In the house there was a big room. There was soup in the kitchen. There was milk in the kitchen.", "note": "To say what there was, use *był*, *była* or *było* to match the thing that was there."}
  pl.a2.unit72.lesson04.teach.gn_lancuch: {"title": "Then and now, in two sentences", "gloss": "Once I drank milk, now I drink coffee. In the old days I watched cartoons, now I read books.", "note": "Describe a change with a past clause and a present clause, joined by a comma."}
  pl.a2.unit72.lesson04.teach.pytania: {"title": "Questions about the past", "gloss": "Where did you live once (to a man)? Where did you live once (to a woman)? What did you play (to a man)? What did you play (to a woman)?", "note": "To ask a man, end the past with -łeś; to ask a woman, end it with -łaś."}
  pl.a2.unit72.lesson05.teach.wies: {"title": "At the grandparents'", "gloss": "grandmother / grandfather / village, countryside / to cook / to love", "note": "*Gotować* (to cook) is another imperfective verb. *Kocham* is the present tense 'I love'.", "example_gloss": ["Grandma cooked soup.", "Grandpa often read books.", "I love the countryside.", "I used to go to Grandma's.", "Ewa always played in the garden."]}
  pl.a2.unit72.lesson05.teach.gn_do_babci: {"title": "To Grandma's and at Grandma's", "gloss": "I went to Grandma's and Grandpa's. I ate soup at Grandma's. They lived in the countryside.", "note": "After *do* and *u* the words *babcia* and *dziadek* change: *do babci*, *do dziadka*, *u babci*. Learn these as chunks."}
  pl.a2.unit72.lesson05.teach.gn_ona: {"title": "Ewa tells the story", "gloss": "I went (a woman speaking). I ate (a woman speaking). I drank (a woman speaking). I played (a woman speaking). I read (a woman speaking).", "note": "Ewa is a woman, so she says -łam. Marek would say -łem for the same verbs."}
  pl.a2.unit72.lesson05.teach.gn_mieszkali: {"title": "Two people in the past", "gloss": "Grandma lived in the countryside. Grandpa lived in the countryside. Grandma and Grandpa lived in the countryside.", "note": "For a group that includes a man, the past ends in -li: *mieszkali*."}
  pl.a2.unit72.lesson05.teach.lektura: {"title": "Ewa writes about her summers", "gloss": "Every summer I went to Grandma's and Grandpa's. They lived in the countryside, in a small house. Every day I ate bread and drank milk. Grandpa often read books and Grandma cooked soup. I always played in the garden. Now I live in the city, but I love the countryside.", "note": "Notice the habit words *co lato*, *codziennie*, *często*, *zawsze* and the contrast with *teraz*.", "glosses": {"babci": "grandmother's", "dziadka": "grandfather's", "wsi": "countryside", "kocham": "I love"}}
  pl.a2.unit72.lesson06.teach.d1: {"title": "Marek asks about childhood", "gloss": "Marek: Ewa, where did you live when you were little?"}
  pl.a2.unit72.lesson06.teach.d2: {"title": "Ewa answers", "gloss": "Ewa: I lived in the city, but every summer I went to Grandma's in the countryside."}
  pl.a2.unit72.lesson06.teach.d3: {"title": "Marek asks what she did", "gloss": "Marek: What did you do there?"}
  pl.a2.unit72.lesson06.teach.d4: {"title": "Ewa describes her days", "gloss": "Ewa: I played in the garden and read books."}
  pl.a2.unit72.lesson06.teach.d5: {"title": "Marek asks about food", "gloss": "Marek: And what did you eat at Grandma's?"}
  pl.a2.unit72.lesson06.teach.d6: {"title": "Ewa describes the food", "gloss": "Ewa: I always ate soup and bread."}
exercises:
  pl.a2.unit72.lesson01.exercise01.elige_czytal: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek czytał książki.", "distractors": ["Marek czytała książki.", "Marek czytam książki.", "Marek czytać książki."], "accepted_answers": [{"value": "Marek czytał książki.", "status": "correct"}], "feedback": "*Marek* is a man, so the past ends in *-ł*: *czytał*."}
  pl.a2.unit72.lesson01.exercise02.elige_jezdzila: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa jeździła na rowerze.", "distractors": ["Ewa jeździł na rowerze.", "Ewa jeździć na rowerze.", "Ewa jeżdżę na rowerze."], "accepted_answers": [{"value": "Ewa jeździła na rowerze.", "status": "correct"}], "feedback": "*Ewa* is a woman, so the past ends in *-ła*: *jeździła*."}
  pl.a2.unit72.lesson01.exercise03.une_czasowniki: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "mieszkała", "right": "she lived"}, {"left": "grał", "right": "he played"}, {"left": "czytała", "right": "she read"}, {"left": "jadł", "right": "he ate"}, {"left": "chodził", "right": "he went to (on foot)"}, {"left": "jeździła", "right": "she rode / travelled"}, {"left": "kiedyś", "right": "once, in the past"}, {"left": "teraz", "right": "now"}, {"left": "zawsze", "right": "always"}, {"left": "często", "right": "often"}], "status": "correct"}], "feedback": "Past forms of the six verbs and the time words."}
  pl.a2.unit72.lesson01.exercise04.ordena_mieszkala: {"instruction": "Put the words in order to say 'Once Ewa lived in the countryside.'", "correct_option": "Kiedyś Ewa mieszkała na wsi", "accepted_answers": [{"value": "Kiedyś Ewa mieszkała na wsi", "status": "correct"}, {"value": "Ewa kiedyś mieszkała na wsi", "status": "correct"}, {"value": "Ewa mieszkała kiedyś na wsi", "status": "correct"}], "feedback": "*Kiedyś Ewa mieszkała na wsi.*"}
  pl.a2.unit72.lesson01.exercise05.completa_gral: {"instruction": "Complete with the imperfective past of *grać* for *Marek*.", "correct_option": "grał", "accepted_answers": [{"value": "grał", "status": "correct"}], "feedback": "*Dawniej Marek grał w piłkę*: a man's past ends in *-ł*."}
  pl.a2.unit72.lesson01.exercise06.traduce_gralem: {"instruction": "Translate into Polish using the imperfective past.", "accepted_answers": [{"value": "Grałem w piłkę.", "status": "correct"}, {"value": "Grałem w piłkę", "status": "correct"}, {"value": "Grałam w piłkę.", "status": "correct"}, {"value": "Grałam w piłkę", "status": "correct"}, {"value": "Kiedyś grałem w piłkę.", "status": "correct"}, {"value": "Kiedyś grałem w piłkę", "status": "correct"}, {"value": "Kiedyś grałam w piłkę.", "status": "correct"}, {"value": "Kiedyś grałam w piłkę", "status": "correct"}, {"value": "Dawniej grałem w piłkę.", "status": "correct"}, {"value": "Dawniej grałem w piłkę", "status": "correct"}, {"value": "Dawniej grałam w piłkę.", "status": "correct"}, {"value": "Dawniej grałam w piłkę", "status": "correct"}], "feedback": "*Grałem w piłkę.* A woman says *Grałam w piłkę.*"}
  pl.a2.unit72.lesson01.exercise07.escribe_zawsze: {"instruction": "Write one sentence in the imperfective past with the word for 'always'.", "correct_option": "Marek zawsze grał w piłkę.", "accepted_answers": [{"value": "Marek zawsze grał w piłkę.", "status": "correct"}, {"value": "Marek zawsze grał w piłkę", "status": "correct"}, {"value": "Zawsze Marek grał w piłkę.", "status": "correct"}, {"value": "Zawsze Marek grał w piłkę", "status": "correct"}], "feedback": "*Marek zawsze grał w piłkę.*"}
  pl.a2.unit72.lesson02.exercise01.elige_pies: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Kiedy Marek był mały, miał psa.", "distractors": ["Kiedy Marek była mały, miał psa.", "Kiedy Marek był mały, miałam psa.", "Kiedy Marek być mały, mieć psa."], "accepted_answers": [{"value": "Kiedy Marek był mały, miał psa.", "status": "correct"}], "feedback": "*Marek* is a man: *był mały, miał psa*."}
  pl.a2.unit72.lesson02.exercise02.elige_ogrod: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ogród był duży.", "distractors": ["Ogród była duży.", "Ogród było duży.", "Ogród był duża."], "accepted_answers": [{"value": "Ogród był duży.", "status": "correct"}], "feedback": "*Ogród* is masculine, so *był duży*."}
  pl.a2.unit72.lesson02.exercise03.une_byc_miec: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "byłem", "right": "I was (a man speaking)"}, {"left": "byłam", "right": "I was (a woman speaking)"}, {"left": "był", "right": "he was"}, {"left": "była", "right": "she was"}, {"left": "było", "right": "it was"}, {"left": "byliśmy", "right": "we were"}, {"left": "miałem", "right": "I had (a man speaking)"}, {"left": "miała", "right": "she had"}, {"left": "mieliśmy", "right": "we had"}], "status": "correct"}], "feedback": "Forms of *być* and *mieć* in the past."}
  pl.a2.unit72.lesson02.exercise04.ordena_kot: {"instruction": "Put the words in order to say 'When Ewa was little, she had a cat.'", "correct_option": "Kiedy Ewa była mała miała kota", "accepted_answers": [{"value": "Kiedy Ewa była mała miała kota", "status": "correct"}, {"value": "Ewa miała kota kiedy była mała", "status": "correct"}], "feedback": "*Kiedy Ewa była mała, miała kota.*"}
  pl.a2.unit72.lesson02.exercise05.completa_podworko: {"instruction": "Complete with the past of *być* to match the noun.", "correct_option": "było", "accepted_answers": [{"value": "było", "status": "correct"}], "feedback": "*Podwórko* is neuter, so *było duże*."}
  pl.a2.unit72.lesson02.exercise06.traduce_kot: {"instruction": "Translate into Polish using the past of *być* and *mieć*.", "accepted_answers": [{"value": "Kiedy byłem mały, miałem kota.", "status": "correct"}, {"value": "Kiedy byłem mały, miałem kota", "status": "correct"}, {"value": "Kiedy byłam mała, miałam kota.", "status": "correct"}, {"value": "Kiedy byłam mała, miałam kota", "status": "correct"}, {"value": "Miałem kota, kiedy byłem mały.", "status": "correct"}, {"value": "Miałem kota, kiedy byłem mały", "status": "correct"}, {"value": "Miałam kota, kiedy byłam mała.", "status": "correct"}, {"value": "Miałam kota, kiedy byłam mała", "status": "correct"}], "feedback": "*Kiedy byłem mały, miałem kota.* A woman says *Kiedy byłam mała, miałam kota.*"}
  pl.a2.unit72.lesson02.exercise07.escribe_dom: {"instruction": "Write two sentences in the past, in the order given.", "correct_option": "Dom był duży. Marek miał psa.", "accepted_answers": [{"value": "Dom był duży. Marek miał psa.", "status": "correct"}, {"value": "Dom był duży. Marek miał psa", "status": "correct"}, {"value": "Marek miał psa. Dom był duży.", "status": "correct"}, {"value": "Marek miał psa. Dom był duży", "status": "correct"}], "feedback": "*Dom był duży. Marek miał psa.*"}
  pl.a2.unit72.lesson03.exercise01.elige_kontrast: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Kiedyś Ewa mieszkała na wsi, teraz mieszka w mieście.", "distractors": ["Kiedyś Ewa mieszka na wsi, teraz mieszkała w mieście.", "Kiedyś Ewa mieszkała na wsi, teraz mieszkała w mieście.", "Kiedyś Ewa mieszka na wsi, teraz mieszka w mieście."], "accepted_answers": [{"value": "Kiedyś Ewa mieszkała na wsi, teraz mieszka w mieście.", "status": "correct"}], "feedback": "*Kiedyś* takes the past, *teraz* takes the present."}
  pl.a2.unit72.lesson03.exercise02.elige_co_lato: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Co lato jeździliśmy do babci.", "distractors": ["Co lato jeździłem do babci.", "Co lato jeździmy do babci.", "Co lato jeździli do babci."], "accepted_answers": [{"value": "Co lato jeździliśmy do babci.", "status": "correct"}], "feedback": "*Jeździliśmy* is the past for 'we'; *co lato* shows a habit."}
  pl.a2.unit72.lesson03.exercise03.une_markery: {"instruction": "Match each Polish word to its meaning.", "accepted_answers": [{"value": [{"left": "codziennie", "right": "every day"}, {"left": "co lato", "right": "every summer"}, {"left": "zawsze", "right": "always"}, {"left": "często", "right": "often"}, {"left": "kiedyś", "right": "in the past"}, {"left": "teraz", "right": "now"}, {"left": "dużo", "right": "a lot"}, {"left": "mało", "right": "little"}], "status": "correct"}], "feedback": "Habit words and time words."}
  pl.a2.unit72.lesson03.exercise04.ordena_kontrast: {"instruction": "Put the words in order to say 'In the old days Marek played football, now he reads books.'", "correct_option": "Dawniej Marek grał w piłkę teraz czyta książki", "accepted_answers": [{"value": "Dawniej Marek grał w piłkę teraz czyta książki", "status": "correct"}], "feedback": "*Dawniej Marek grał w piłkę, teraz czyta książki.*"}
