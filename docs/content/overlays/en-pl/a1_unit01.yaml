answer_policy:
  diacritics: >-
    Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In
    typed A1 answers, accept a variant with the diacritic dropped or
    swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when
    every other letter and word is correct -- these are genuinely hard
    to type on a non-Polish keyboard and this is a beginner course, not
    a spelling test. Do not extend this tolerance to ł vs l at the
    START of a word where it changes which real word is meant (not a
    relevant case in this unit's vocabulary, but noted for future
    units). Punctuation marks (?, !) may be omitted in typed answers,
    but the fully punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Anna, Marek,
    Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (pan/pani vs ty) rather than written punctuation or diacritics.

course:
  title: "Polish A1"
  description: >-
    Learn to greet people, ask how someone is doing, introduce
    yourself, and exchange basic personal information in Polish.
    English-specific guidance highlights the pan/pani/ty formality
    system (a real grammatical distinction Polish marks that English
    doesn't), verb-ending agreement, and natural register choices.

units:
  pl.a1.unit01.greetings:
    title: "Powitania i pierwsze spotkania"

lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: "Pan, pani i ty: jak zapytać, co słychać"
  pl.a1.unit01.lesson02.greetings_by_time:
    title: "Powitania i pożegnania o różnych porach dnia"
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: "Imię, nazwisko i skąd jesteś"

teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: "Formal address, to a man"
    gloss: "Mr.; sir (formal address to a man)"
    note: >-
      English uses "you" for everyone. Polish marks a real social
      choice: *pan* addresses an unfamiliar or professionally
      respected man. Grammatically, *pan* behaves like a third-person
      subject -- "pan jest" literally means "the gentleman is," not a
      true second-person form, even though it's used to mean "you."

  pl.a1.unit01.lesson01.teach.pani:
    title: "Formal address, to a woman"
    gloss: "Mrs.; ma'am (formal address to a woman)"
    note: >-
      The feminine counterpart of *pan*. Use *pani* with an unfamiliar
      or professionally respected woman. Any adult woman is addressed
      as *pani* regardless of marital status -- Polish has no
      equivalent of the English Miss/Mrs. distinction in everyday
      address.

  pl.a1.unit01.lesson01.teach.ty:
    title: "Informal you"
    gloss: "you (informal, singular)"
    note: >-
      *Ty* is used with one friend, peer, family member, child, or
      anyone else the relationship is informal with. Unlike *pan*/
      *pani*, *ty* takes true second-person verb endings, e.g. *masz*
      ("you have/are"), not third-person ones.

  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: "Formal wellbeing question, to a man"
    gloss: "How are you? (to a man, formal)"
    note: >-
      Literally "how does the gentleman feel." *Ma* is the third-person
      form of the verb (agreeing with *pan* as a grammatical subject),
      the same ending used for *on* ("he").

  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: "Formal wellbeing question, to a woman"
    gloss: "How are you? (to a woman, formal)"
    note: >-
      Same pattern as *Jak się pan ma?*, with *pani* in place of *pan*.
      The verb form *ma* doesn't change -- it's the same third-person
      ending regardless of the addressee's gender.

  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: "Informal wellbeing question"
    gloss: "How are you? (informal)"
    note: >-
      With *ty*, the verb takes the true second-person ending *masz*,
      not *ma*. Compare formal *Jak się pan/pani ma?* with informal
      *Jak się masz?* -- this is the single most useful minimal pair
      for hearing the pan/pani-vs-ty distinction in the verb itself.

  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: "A standard reply"
    gloss: "Fine, thank you."
    note: >-
      *Dziękuję* ("thank you") doesn't change with register -- it's the
      same word whether you're replying to *pan*, *pani*, or *ty*. Only
      the question itself marks formality.

  pl.a1.unit01.lesson01.teach.a_pan:
    title: "Return the formal question"
    gloss: "And you? (to a man, formal)"
    note: >-
      A short way to return the question to a man you're addressing
      formally. Swap *pan* for *pani* ("A pani?") when returning the
      question to a woman.

  pl.a1.unit01.lesson01.teach.a_ty:
    title: "Return the informal question"
    gloss: "And you? (informal)"
    note: "Use *ty* to return the question to a friend or peer."

  pl.a1.unit01.lesson02.teach.czesc:
    title: "Informal hello and goodbye"
    gloss: "hi; bye (informal, both directions)"
    note: >-
      *Cześć* is unusual among Polish greetings: it works as both
      "hi" and "bye" in the same informal register, similar to how
      "hey" can open or close a casual English exchange. It's only
      used with *ty*-register relationships, never with *pan*/*pani*.
    example_gloss: "Hi, how are you?"

  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: "All-day greeting"
    gloss: "good morning; good day"
    note: >-
      *Dzień dobry* works any time before evening and, unlike *cześć*,
      is neutral for register -- use it with *pan*, *pani*, or *ty*
      alike. It's the safest default greeting for someone you don't
      know well.

  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: "Evening greeting"
    gloss: "good evening"
    note: "Switches in for *dzień dobry* once it's evening. Same register-neutral usage."

  pl.a1.unit01.lesson02.teach.dobranoc:
    title: "Night farewell"
    gloss: "good night"
    note: >-
      Unlike *dzień dobry*/*dobry wieczór*, *dobranoc* is a farewell,
      not a greeting -- said when someone is leaving for the night or
      going to bed, never to open an exchange.
    example_gloss: "Good night, Piotr!"

  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: "Standard farewell"
    gloss: "goodbye"
    note: >-
      The neutral, register-safe way to say goodbye -- works with
      *pan*, *pani*, or *ty*. More final-sounding than *do zobaczenia*.

  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: "See-you farewell"
    gloss: "see you"
    note: >-
      Literally "until [we] see [each other]." Implies you expect to
      meet again, unlike the more neutral *do widzenia*.

  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: "Polite closing wish"
    gloss: "Have a nice day!"
    note: >-
      *Miłego dnia* uses the genitive case in a wish, the same pattern
      as *smacznego* ("enjoy your meal") -- a fixed construction worth
      learning as a whole phrase rather than analyzing case-by-case at
      this stage.

  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: "Ask a name, formally"
    gloss: "What's your name? (to a man, formal)"
    note: >-
      Literally "how does the gentleman call himself" -- *nazywać się*
      is a reflexive verb meaning "to be called." Swap *pan* for *pani*
      when addressing a woman formally.

  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: "Ask a first name, informally"
    gloss: "What's your (first) name?"
    note: >-
      Uses a different idiom, *mieć na imię* ("to have as a first
      name"), and specifically asks for a first name rather than a
      full name or surname -- the natural informal way to ask a peer's
      name.

  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: "Give your full name"
    gloss: "My name is Anna Kowalska."
    note: >-
      The first-person form of *nazywać się*, naturally followed by a
      first name and surname together -- the more formal or complete
      way to introduce yourself.

  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: "Give your first name"
    gloss: "My name is Anna."
    note: >-
      The first-person form of *mieć na imię*, naturally followed by
      just a first name -- the casual counterpart to *Nazywam się...*.

  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: "Pleasure at meeting someone"
    gloss: "Very nice to meet you."
    note: >-
      A fixed, widely-used expression on first meeting someone,
      appropriate in both formal and informal settings.

  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: "Ask origin, informally"
    gloss: "Where are you from?"
    note: >-
      *Skąd* means "from where." This informal *ty*-register form is
      shown here; the formal counterpart *Skąd pan/pani jest?* appears
      in this lesson's closing dialogue.

  pl.a1.unit01.lesson03.teach.jestem_z:
    title: "State your origin"
    gloss: "I'm from Canada."
    note: >-
      *Z* ("from") takes the genitive case, so *Kanada* becomes
      *Kanady*. Most country names follow this same pattern after *z*.

  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: "State where you live"
    gloss: "I live in Warsaw."
    note: >-
      *W* ("in") takes the locative case here, so *Warszawa* becomes
      *Warszawie*. Origin (with *z*) and current residence (with *w*)
      use different cases on the place name -- worth noticing as a
      pattern, not memorizing as an exception.

  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: "Opening the encounter"
    gloss: "Ewa greets Marek and formally asks his name."
    note: >-
      Ewa uses the formal *pan* register with someone she's just
      meeting, the safe default for a first professional or unfamiliar
      encounter.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: "Opening the encounter, reply"
    gloss: "Marek gives his full name and says it's nice to meet her."
    note: >-
      *Nazywam się* with a full name is the natural, complete way to
      answer a formal name question.

  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: "Ask about origin"
    gloss: "Ewa returns the sentiment and asks where Marek is from, formally."
    note: >-
      *Skąd pan jest?* -- the formal counterpart to this lesson's
      *Skąd jesteś?* -- uses *jest*, the same third-person verb pattern
      already seen with *pan jest*/*pan ma*.
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: "Ask about origin, reply"
    gloss: "Marek says he's from Canada but lives in Warsaw."
    note: >-
      *Ale* ("but") links the contrast between where Marek is
      originally from and where he currently lives -- the same
      distinction *jestem z*/*mieszkam w* draws.

  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: "Ask about language ability"
    gloss: "Ewa asks if Marek speaks Polish, formally."
    note: >-
      *Czy* opens a yes/no question -- Polish has no equivalent of
      English "do/does" here; *czy* alone signals a question is coming.
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: "Ask about language ability, reply, and close"
    gloss: "Marek says he speaks a little and is still learning, then says goodbye."
    note: >-
      *Jeszcze się uczę* ("I'm still learning") is a natural, humble
      way to describe an ongoing effort -- useful for a real learner to
      say about themselves too.

exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: "Which word formally and respectfully addresses a man?"
    correct_option: "pan"
    distractors: ["pani", "ty"]
    accepted_answers: ["pan"]
    feedback: "Pan formally addresses a man and takes third-person verb forms."

  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: "Which word formally and respectfully addresses a woman?"
    correct_option: "pani"
    distractors: ["pan", "ty"]
    accepted_answers: ["pani"]
    feedback: "Pani formally addresses a woman and takes the same third-person verb forms as pan."

  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: "Which word addresses one friend or peer informally?"
    correct_option: "ty"
    distractors: ["pan", "pani"]
    accepted_answers: ["ty"]
    feedback: "Ty is used with friends, peers, and informal relationships, and takes true second-person verb endings."

  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: "Put the formal wellbeing question (to a man) in order."
    accepted_answers:
      - ["Jak", "się", "pan", "ma"]
      - ["Jak", "pan", "się", "ma"]

  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: "Put the informal wellbeing question in order."
    correct_response: ["Jak", "się", "masz"]

  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: "Return the question, keeping the respectful register."
    correct_option: "A pan?"
    distractors: ["A ty?", "Jak się masz?"]
    accepted_answers: ["A pan?", "A pan", "A pani?", "A pani"]
    feedback: "A pan?/A pani? keeps the formal register when returning the question."

  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: "Return the question to a friend or peer."
    correct_option: "A ty?"
    distractors: ["A pan?", "A pani?"]
    accepted_answers: ["A ty?", "A ty"]
    feedback: "A ty? is the informal way to return the question."

  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: "Correct the informal question -- it mixes ty with the wrong verb ending."
    accepted_answers:
      - "Jak się masz?"
      - "Jak się masz"
      - "Jak ty się masz?"
      - "Jak się ty masz?"
    feedback: "Ty takes the ending masz, not ma -- ma is only used with pan/pani (or on/ona)."

  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: "Reply politely to the question."
    accepted_answers:
      - "Dobrze, dziękuję."
      - "Dobrze, dziękuję"
      - "Dziękuję, dobrze."
      - "Dobrze, dziękuję. A pan?"
      - "Dziękuję, dobrze. A pan?"
      - "Dobrze, dziękuję. A pani?"
      - "Dziękuję, dobrze. A pani?"

  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: "Answer informally, thank the speaker, and return the question."
    accepted_answers:
      - "Dobrze, dziękuję. A ty?"
      - "Dobrze, dziękuję, a ty?"
      - "Dobrze, dziękuję. A ty"
      - "Dziękuję, dobrze. A ty?"

  pl.a1.unit01.lesson02.exercise01.select_hi:
    instruction: "Which word can informally mean both hi and bye?"
    correct_option: "Cześć"
    distractors: ["Dzień dobry", "Do widzenia"]
    accepted_answers: ["Cześć"]

  pl.a1.unit01.lesson02.exercise02.select_evening:
    instruction: "Which greeting is used in the evening?"
    correct_option: "Dobry wieczór"
    distractors: ["Dzień dobry", "Dobranoc"]
    accepted_answers: ["Dobry wieczór"]

  pl.a1.unit01.lesson02.exercise03.select_night_meaning:
    instruction: "What does this word mean?"
    correct_option: "Good night."
    distractors: ["Good evening.", "See you."]
    accepted_answers: ["Good night."]
    feedback: "Dobranoc is a farewell said when someone is leaving for the night, not a greeting."

  pl.a1.unit01.lesson02.exercise04.order_morning:
    instruction: "Put the all-day greeting in order."
    correct_response: ["Dzień", "dobry"]

  pl.a1.unit01.lesson02.exercise05.order_goodbye:
    instruction: "Put the standard farewell in order."
    correct_response: ["Do", "widzenia"]

  pl.a1.unit01.lesson02.exercise06.order_see_you:
    instruction: "Put the see-you farewell in order."
    correct_response: ["Do", "zobaczenia"]

  pl.a1.unit01.lesson02.exercise07.order_nice_day:
    instruction: "Build the polite closing wish."
    correct_response: ["Miłego", "dnia"]

  pl.a1.unit01.lesson02.exercise08.reply_to_evening:
    instruction: "Return the evening greeting, then say goodbye."
    accepted_answers:
      - "Dobry wieczór. Do widzenia."
      - "Dobry wieczór, do widzenia."

  pl.a1.unit01.lesson02.exercise09.speak_friendly_closing:
    instruction: "Say a friendly see-you farewell."
    accepted_answers:
      - "Do zobaczenia."
      - "Do zobaczenia"

  pl.a1.unit01.lesson03.exercise01.select_formal_name_question:
    instruction: "Which question formally asks a man's name?"
    correct_option: "Jak się pan nazywa?"
    distractors: ["Jak masz na imię?", "Skąd jesteś?"]
    accepted_answers: ["Jak się pan nazywa?", "Jak się pan nazywa"]

  pl.a1.unit01.lesson03.exercise02.select_informal_name_question:
    instruction: "Which question informally asks a friend's first name?"
    correct_option: "Jak masz na imię?"
    distractors: ["Jak się pan nazywa?", "Jak się masz?"]
    accepted_answers: ["Jak masz na imię?", "Jak masz na imię"]

  pl.a1.unit01.lesson03.exercise03.comprehend_origin:
    instruction: "Read the line. Where is Marek from, and where does he live?"
    correct_option: "He is from Canada and lives in Warsaw."
    distractors:
      - "He is from Poland and lives in Canada."
      - "He is from Warsaw and lives in Canada."
    accepted_answers:
      - "He is from Canada and lives in Warsaw."
      - "Canada; Warsaw"

  pl.a1.unit01.lesson03.exercise04.comprehend_language_ability:
    instruction: "Read the line. What does Marek say about his Polish?"
    correct_option: "He speaks a little and is still learning."
    distractors:
      - "He doesn't speak any Polish."
      - "He speaks Polish fluently."
    accepted_answers: ["He speaks a little and is still learning."]

  pl.a1.unit01.lesson03.exercise05.order_informal_origin:
    instruction: "Put the informal origin question in order."
    correct_response: ["Skąd", "jesteś"]

  pl.a1.unit01.lesson03.exercise06.order_from_canada:
    instruction: "Build the statement of Canadian origin."
    correct_response: ["Jestem", "z", "Kanady"]

  pl.a1.unit01.lesson03.exercise07.order_live_warsaw:
    instruction: "Build the residence statement."
    correct_response: ["Mieszkam", "w", "Warszawie"]

  pl.a1.unit01.lesson03.exercise08.match_questions_and_answers:
    instruction: "Match each question with its natural answer."
    correct_response:
      "Jak się pan nazywa?": "Nazywam się Anna Kowalska."
      "Jak masz na imię?": "Mam na imię Anna."
      "Skąd jesteś?": "Jestem z Kanady."
      "Czy pan mówi po polsku?": "Tak, trochę."
      "Jak się pan ma?": "Dobrze, dziękuję."

  pl.a1.unit01.lesson03.exercise09.fill_in_first_name:
    instruction: "Complete the full-name introduction."
    correct_option: "Anna"
    distractors: ["Marek", "Kowalska"]
    accepted_answers: ["Anna"]
    feedback: "Nazywam się is naturally followed by first name and surname together: Anna Kowalska."

  pl.a1.unit01.lesson03.exercise10.reply_from_canada:
    instruction: "Answer that you are from Canada."
    accepted_answers:
      - "Jestem z Kanady."
      - "Jestem z Kanady"
      - "Z Kanady."

  pl.a1.unit01.lesson03.exercise11.reply_still_learning:
    instruction: "Say you speak a little Polish and are still learning."
    accepted_answers:
      - "Tak, trochę. Jeszcze się uczę."
      - "Tak, trochę, jeszcze się uczę."
      - "Trochę. Jeszcze się uczę."

  pl.a1.unit01.lesson03.exercise12.speak_self_introduction:
    instruction: "Introduce yourself as Anna Kowalska, giving your full name, and say you live in Warsaw."
    accepted_answers:
      - "Nazywam się Anna Kowalska. Mieszkam w Warszawie."
      - "Nazywam się Anna Kowalska, mieszkam w Warszawie."
