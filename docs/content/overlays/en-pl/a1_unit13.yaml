answer_policy:
  diacritics: >-
    Same standing policy as unit01-12: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit13.lubie_i_wole:
    title: "Likes and preferences"

lessons:
  pl.a1.unit13.lesson01.czy_lubisz:
    title: "Do you like...?"
  pl.a1.unit13.lesson02.kawa_czy_herbata:
    title: "Coffee or tea?"
  pl.a1.unit13.lesson03.rozmowa_o_muzyce_i_piciu:
    title: "A conversation about music and drinks"

teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: "Music"
    gloss: "music"
    note: "A common topic for talking about likes and dislikes -- an easy word to recognize since it's close to the English cognate."
    example_gloss: "I like music."

  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: "Muzyka -> muzykę"
    gloss: "With lubić (to like) + object, muzyka changes to muzykę, the same way kawa changes to kawę. Lubię muzykę, not Lubię muzyka."
    note: >-
      Same pattern you already know: *muzyka* becomes *muzykę* as the object
      of *lubię*, just like *kawa* becomes *kawę*.

  pl.a1.unit13.lesson01.teach.lubisz:
    title: "You like"
    gloss: "you like (informal, ty)"
    note: "The 'ty' form of lubić -- the piece needed to ask a friend directly whether they like something."
    example_gloss: "Do you like music?"

  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: "Lubić: lubię, lubisz, lubi"
    gloss: "Lubić (to like): lubię (I), lubisz (you), lubi (he/she). You already know lubię and lubi -- lubisz is the new form, for the person you're talking to."
    note: >-
      *Lubię* and *lubi* are old friends by now -- *lubisz* fills in the
      missing "you" form of the same verb.

  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: "Do you like music?"
    gloss: "Do you like music?"
    note: "Czy opens a yes/no question -- the natural way to ask a friend about a preference."

  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: "Yes, I like it."
    gloss: "Yes, I like it."
    note: "A short, natural answer -- no need to repeat the word muzykę."

  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: "No, I don't."
    gloss: "No, I don't like it."
    note: "Nie nie lubię looks doubled but isn't a mistake -- the first nie answers the question, the second nie negates lubię."

  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: "Short answers"
    gloss: "Short answer: Tak, lubię. / Nie, nie lubię. -- you don't need to repeat the word muzykę, since it's already clear from the question."
    note: >-
      Just like *Pyszny?* could stand alone, *Tak, lubię.* doesn't need to
      restate what you're talking about -- context already carries it.

  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: "I like music a lot"
    gloss: "I like music a lot."
    note: "Bardzo (a lot / very) makes a plain preference stronger -- you've seen bardzo since the very first unit."

  pl.a1.unit13.lesson02.teach.wole:
    title: "I prefer"
    gloss: "I prefer"
    note: "A brand-new verb this unit, woleć (to prefer) -- only the 'I' form is taught here, the same as lubię."
    example_gloss: "I prefer tea."

  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: "Woleć: only wolę this unit"
    gloss: "Woleć (to prefer): wolę (I) -- this lesson only teaches the 'I' form, the same as lubię. Wolę kawę. = I prefer coffee."
    note: >-
      Just the *ja* (I) form of *woleć* for now, exactly the same scope as
      *lubię* got when it was first introduced.

  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: "Coffee and tea, again"
    gloss: "Wolę + object: kawa becomes kawę, herbata becomes herbatę -- the same pattern you already know."
    note: >-
      Same accusative pattern as before, just with a new verb: *wolę kawę*,
      *wolę herbatę*.

  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: "I prefer coffee"
    gloss: "I prefer coffee."
    note: "A plain statement of preference using wolę."

  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: "I prefer tea"
    gloss: "I prefer tea."
    note: "The same pattern with herbatę instead of kawę."

  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: "Czy as 'or'"
    gloss: "The czy in Kawa czy herbata? isn't the same czy that opens a yes/no question -- here it links two choices, like English 'or.' Kawa czy herbata? = Coffee or tea?"
    note: >-
      Watch out: *czy* usually opens a yes/no question, but between two
      nouns like this it just means "or."

  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: "Coffee or tea?"
    gloss: "Coffee or tea?"
    note: "A short, natural way to offer someone a choice."

  pl.a1.unit13.lesson03.teach.ja_tez:
    title: "Me too"
    gloss: "me too / I also"
    note: "A short way to agree with what someone just said."

  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: "Ja też, again"
    gloss: "Ja też means 'me too' / 'I also' -- you already know this from the routines lesson (Ja też wstaję o siódmej, 'I also get up at seven')."
    note: "A quick reminder that this phrase has come up before."

  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: "Kawa czy herbata? needs no verb"
    gloss: "Just like Pyszny? from the last unit, the short question Kawa czy herbata? doesn't need a verb -- context is enough."
    note: >-
      Same pattern as *Pyszny?* -- a short, verb-less question that context
      makes perfectly clear.

  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: "Marek asks if Ewa likes music"
    gloss: "Do you like music?"
    note: "Marek opens the conversation with the question this unit just taught."
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: "Ewa likes it and asks back"
    gloss: "Yes, I like it a lot! And you?"
    note: "A ty? (and you?) hands the question back to Marek, the same pattern seen in earlier units."
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: "Marek agrees and asks about drinks"
    gloss: "Me too. Coffee or tea?"
    note: "Ja też lubię confirms Marek's own answer before he changes the subject with a new either/or question."
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: "Ewa prefers coffee"
    gloss: "I prefer coffee."
    note: "Ewa's own stated preference, using wolę -- the same coffee-drinker we met in the routines unit."
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: "Marek prefers tea"
    gloss: "I prefer tea."
    note: "Marek's own stated preference -- the opposite choice from Ewa's."

exercises:
  pl.a1.unit13.lesson01.exercise01.select_muzyka:
    instruction: "Which word means 'music'?"
    correct_option: "muzyka"
    distractors: ["lubisz", "Tak"]
    accepted_answers: ["muzyka"]

  pl.a1.unit13.lesson01.exercise02.select_lubisz:
    instruction: "Which word means 'you like'?"
    correct_option: "lubisz"
    distractors: ["muzyka", "nie"]
    accepted_answers: ["lubisz"]

  pl.a1.unit13.lesson01.exercise03.select_tak:
    instruction: "Which word means 'yes'?"
    correct_option: "Tak"
    distractors: ["nie", "Czy"]
    accepted_answers: ["Tak"]

  pl.a1.unit13.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "muzyka": "music"
      "lubisz": "you like"
      "lubię": "I like"
      "Czy": "question particle (yes/no question)"
      "Tak": "yes"
      "nie": "no / not"

  pl.a1.unit13.lesson01.exercise05.order_czy_lubisz_muzyke:
    instruction: "Put the question 'Do you like music?' in order."
    correct_response: ["Czy", "lubisz", "muzykę"]

  pl.a1.unit13.lesson01.exercise06.order_bardzo_lubie_muzyke:
    instruction: "Put the sentence 'I like music a lot' in order."
    accepted_answers:
      - {value: ["Bardzo", "lubię", "muzykę"], status: correct}
      - {value: ["Lubię", "bardzo", "muzykę"], status: correct}

  pl.a1.unit13.lesson01.exercise07.fill_lubisz_marek:
    instruction: "Complete Marek's question: 'Do you like music?'"
    accepted_answers: ["lubisz"]
    feedback: "Mówi Marek: Czy lubisz muzykę? -- lubisz is the 'you' form, used to ask a friend directly."

  pl.a1.unit13.lesson01.exercise08.fix_muzyka_case:
    instruction: "Fix the sentence -- muzyka needs to become muzykę after lubię."
    accepted_answers:
      - "Lubię muzykę."
      - "Lubię muzykę"
    feedback: "Lubię muzykę, not Lubię muzyka -- the object of lubić takes the accusative ending."

  pl.a1.unit13.lesson01.exercise09.speak_lubie_muzyke:
    instruction: "Say: 'I like music.'"
    accepted_answers:
      - "Lubię muzykę."
      - "Lubię muzykę"
      - "Ja lubię muzykę."
      - "Ja lubię muzykę"

  pl.a1.unit13.lesson02.exercise01.select_wole:
    instruction: "Which word means 'I prefer'?"
    correct_option: "wolę"
    distractors: ["lubisz", "muzyka"]
    accepted_answers: ["wolę"]

  pl.a1.unit13.lesson02.exercise02.select_kawa:
    instruction: "Which word means 'coffee'?"
    correct_option: "kawa"
    distractors: ["herbata", "wolę"]
    accepted_answers: ["kawa"]

  pl.a1.unit13.lesson02.exercise03.select_herbata:
    instruction: "Which word means 'tea'?"
    correct_option: "herbata"
    distractors: ["kawa", "muzyka"]
    accepted_answers: ["herbata"]

  pl.a1.unit13.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "wolę": "I prefer"
      "kawa": "coffee"
      "herbata": "tea"
      "muzyka": "music"
      "lubisz": "you like"
      "Tak": "yes"

  pl.a1.unit13.lesson02.exercise05.order_wole_kawe:
    instruction: "Put the sentence 'I prefer coffee' in order."
    correct_response: ["Wolę", "kawę"]

  pl.a1.unit13.lesson02.exercise06.order_wole_herbate:
    instruction: "Put the sentence 'I prefer tea' in order."
    correct_response: ["Wolę", "herbatę"]

  pl.a1.unit13.lesson02.exercise07.fill_wole_marek:
    instruction: "Complete Ewa's sentence: 'I prefer coffee.'"
    accepted_answers: ["Wolę"]
    feedback: "Mówi Ewa: Wolę kawę -- wolę is 'I prefer.'"

  pl.a1.unit13.lesson02.exercise08.fix_wole_kawe_case:
    instruction: "Fix the sentence -- Ewa is talking about coffee, so kawa needs to become kawę."
    accepted_answers:
      - "Wolę kawę."
      - "Wolę kawę"
    feedback: "Wolę kawę, not Wolę kawa -- the object of wolę takes the accusative ending."

  pl.a1.unit13.lesson02.exercise09.speak_kawa_czy_herbata:
    instruction: "Say: 'Coffee or tea?'"
    accepted_answers:
      - "Kawa czy herbata?"
      - "Kawa czy herbata"

  pl.a1.unit13.lesson03.exercise01.select_ask_like_music_line:
    instruction: "Which line asks if you like music?"
    correct_option: "Czy lubisz muzykę?"
    distractors:
      - "Ja też lubię. Kawa czy herbata?"
      - "Tak, bardzo lubię! A ty?"
    accepted_answers:
      - "Czy lubisz muzykę?"
      - "Czy lubisz muzykę"

  pl.a1.unit13.lesson03.exercise02.select_ewa_likes_and_asks_back:
    instruction: "Which line says Ewa likes it a lot and asks Marek back?"
    correct_option: "Tak, bardzo lubię! A ty?"
    distractors:
      - "Ja też lubię. Kawa czy herbata?"
      - "Ja wolę herbatę."
    accepted_answers:
      - "Tak, bardzo lubię! A ty?"
      - "Tak, bardzo lubię! A ty"

  pl.a1.unit13.lesson03.exercise03.comprehend_marek_preference:
    instruction: "Read the line. What does Marek prefer to drink?"
    correct_option: "tea"
    distractors:
      - "coffee"
      - "music"
    accepted_answers:
      - "herbatę"
      - "tea"

  pl.a1.unit13.lesson03.exercise04.comprehend_ewa_preference:
    instruction: "Read the line. What does Ewa prefer to drink?"
    correct_option: "coffee"
    distractors:
      - "tea"
      - "music"
    accepted_answers:
      - "kawę"
      - "coffee"

  pl.a1.unit13.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "Ja też": "me too"
      "bardzo": "very / a lot"
      "A ty?": "And you?"
      "wolę": "I prefer"
      "Kawa czy herbata?": "Coffee or tea?"
      "lubisz": "you like"
      "muzyka": "music"

  pl.a1.unit13.lesson03.exercise06.order_ja_tez_lubie:
    instruction: "Put the sentence 'I like it too' in order."
    correct_response: ["Ja", "też", "lubię"]

  pl.a1.unit13.lesson03.exercise07.order_ja_wole_kawe:
    instruction: "Put Marek's sentence 'I prefer tea' (emphasizing 'I') in order."
    correct_response: ["Ja", "wolę", "herbatę"]

  pl.a1.unit13.lesson03.exercise08.fill_a_ty:
    instruction: "Complete Ewa's line: 'Yes, I like it a lot! And you?'"
    accepted_answers: ["A"]
    feedback: "Mówi Ewa: Tak, bardzo lubię! A ty? -- A ty? hands the question back."

  pl.a1.unit13.lesson03.exercise09.fix_herbata_case:
    instruction: "Fix the sentence -- herbata needs to become herbatę after wolę."
    accepted_answers:
      - "Wolę herbatę."
      - "Wolę herbatę"
    feedback: "Wolę herbatę, not Wolę herbata -- the object of wolę takes the accusative ending."

  pl.a1.unit13.lesson03.exercise10.reply_kawa_czy_herbata:
    instruction: "Answer as Ewa: say you prefer coffee."
    accepted_answers:
      - "Wolę kawę."
      - "Wolę kawę"
      - "Ja wolę kawę."
      - "Ja wolę kawę"

  pl.a1.unit13.lesson03.exercise11.speak_czy_lubisz_muzyke:
    instruction: "Say, to a friend: 'Do you like music?'"
    accepted_answers:
      - "Czy lubisz muzykę?"
      - "Czy lubisz muzykę"
      - "Lubisz muzykę?"
      - "Lubisz muzykę"
