answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit02.dyskusja_z_niuansami:
    title: "Debate with nuance"

lessons:
  pl.b1.unit02.lesson01.choc_lubie_biuro:
    title: "Although I like the office..."
  pl.b1.unit02.lesson02.mimo_ze_brakuje_mi:
    title: "Even though I miss the contact..."
  pl.b1.unit02.lesson03.dyskusja_o_pracy:
    title: "A debate about remote work"
  pl.b1.unit02.lesson04.podsumowanie:
    title: "My opinion on the topic"

teaching:
  pl.b1.unit02.lesson01.teach.recap_words:
    title: "In my opinion, I think, because -- again"
    gloss: "moim zdaniem, myślę, że, bo, lubię, praca, dom -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds concession and nuance on top of them."

  pl.b1.unit02.lesson01.teach.zdalnie:
    title: "To work remotely"
    gloss: "to work remotely"
    note: "*zdalnie* is an adverb -- describes how the work happens, not the work itself."
    example_gloss: "I prefer to work remotely."

  pl.b1.unit02.lesson01.teach.wole:
    title: "I prefer"
    gloss: "I prefer"
    note: "A genuinely useful B1 opinion verb, stronger than *lubię* (I like)."
    example_gloss: "I prefer to work remotely rather than in the office."

  pl.b1.unit02.lesson01.teach.biuro:
    title: "Office"
    gloss: "office"
    note: "A neuter noun. *w biurze* (locative, in the office) is the form used after \"w.\""
    example_gloss: "I work in the office."

  pl.b1.unit02.lesson01.teach.choc_note:
    title: "Although -- the concessive connector"
    gloss: "*chociaż* -- although. Introduces a concession -- one genuinely valid point on the other side -- before returning to your own position."
    note: "This is the core B1 grammar point of this unit: concede a point, then restate your own view."

  pl.b1.unit02.lesson01.teach.phrase_choc_lubie_biuro:
    title: "Although I like the office, I prefer to work remotely"
    gloss: "Although I like the office, I prefer to work remotely."
    note: "A complete concession-then-restatement sentence in one go."

  pl.b1.unit02.lesson02.teach.wygodna:
    title: "Convenient"
    gloss: "convenient"
    note: "Feminine form, agreeing with *praca* (feminine noun)."
    example_gloss: "Remote work is convenient."

  pl.b1.unit02.lesson02.teach.mimo_ze_note:
    title: "Even though -- a stronger concessive connector"
    gloss: "*mimo że* -- even though. A stronger, slightly more formal synonym of *chociaż*."
    note: "Use this when the conceded point is a bigger one, or the register is a bit more careful."

  pl.b1.unit02.lesson02.teach.brakuje:
    title: "I miss / lack -- with the genitive case"
    gloss: "*brakuje mi* -- I miss/lack. \"Brakuje\" always takes the genitive case: *brakuje mi kontaktu* (genitive *kontakt* -> *kontaktu*) *z ludźmi* (with people)."
    note: "A real case-governing rule -- \"brakuje\" never takes an accusative object, only genitive."

  pl.b1.unit02.lesson02.teach.phrase_mimo_ze_brakuje:
    title: "Even though remote work is convenient, I miss contact with people"
    gloss: "Even though remote work is convenient, I miss contact with people."
    note: "Ewa's own genuine concession about remote work, before she restates her preference for the office."

  pl.b1.unit02.lesson02.teach.jednak:
    title: "However"
    gloss: "however"
    note: "A stronger contrastive connector than *ale* (but) -- signals a real pivot in the argument, not just a small add-on."
    example_gloss: "Remote work is convenient. However, I prefer the office."

  pl.b1.unit02.lesson03.teach.dojazd:
    title: "Commute"
    gloss: "commute"
    note: "*oszczędzam* (I save) -- used with time: *oszczędzam czas* (I save time)."
    example_gloss: "Remote work saves me commute time."

  pl.b1.unit02.lesson03.teach.spontaniczna_rozmowa:
    title: "Spontaneous conversation"
    gloss: "spontaneous conversation"
    note: "*łatwiejsza* (easier) -- comparative form, feminine to agree with *rozmowa*."
    example_gloss: "In the office, spontaneous conversation is easier."

  pl.b1.unit02.lesson03.teach.koncentracja:
    title: "Concentration"
    gloss: "concentration"
    note: "*lepsza* (better) -- comparative form, feminine to agree with *koncentracja*. *w domu* (at home)."
    example_gloss: "At home, I have better concentration."

  pl.b1.unit02.teach.dialogue.line01:
    title: "Ewa states her position"
    gloss: "In my opinion, office work is better."
    note: "Ewa opens the debate directly with her own opinion."
  pl.b1.unit02.teach.dialogue.line02:
    title: "Ewa concedes a point"
    gloss: "Even though remote work is convenient, I miss contact with people."
    note: "Ewa's genuine concession -- exactly the fact this lesson's exercises test about her."
  pl.b1.unit02.teach.dialogue.line03:
    title: "Marek responds"
    gloss: "I understand, but I prefer to work remotely."
    note: "A short, natural pivot before Marek makes his own case."
  pl.b1.unit02.teach.dialogue.line04:
    title: "Marek concedes a point"
    gloss: "Although spontaneous conversation is easier in the office, I have better concentration at home."
    note: "Marek's genuine concession -- exactly the fact this lesson's exercises test about him."
  pl.b1.unit02.teach.dialogue.line05:
    title: "Ewa uses two-sided structure"
    gloss: "On one hand that's true. On the other hand, I miss my colleagues."
    note: "*z jednej strony... z drugiej strony* -- the multi-point argument structure this unit's spine outcome names directly."
  pl.b1.unit02.teach.dialogue.line06:
    title: "Marek restates his position"
    gloss: "However, remote work saves me commute time."
    note: "Marek's final restated position, using *jednak* as the pivot."
  pl.b1.unit02.teach.dialogue.line07:
    title: "Ewa restates her position"
    gloss: "That's true, but I still prefer the office."
    note: "Ewa's own final restated position."
  pl.b1.unit02.teach.dialogue.line08:
    title: "Marek closes the debate"
    gloss: "Everyone has different priorities."
    note: "A natural, friendly close that accepts the disagreement without resolving it."

