answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit74.czy_kiedys_byles: {"title": "Have You Ever Been?", "description": "Ask and say what you have or have never done, and whether you have already done something yet, using the Polish past tense with kiedyś, już, jeszcze nie and nigdy nie."}
lessons:
  pl.a2.unit74.lesson01.czy_kiedys_bylas: {"title": "Have You Ever Been to Kraków?"}
  pl.a2.unit74.lesson02.nigdy_nie_jeszcze_nie: {"title": "Never and Not Yet"}
  pl.a2.unit74.lesson03.czasowniki_doswiadczen: {"title": "Experience Verbs"}
  pl.a2.unit74.lesson04.ile_razy: {"title": "How Many Times?"}
  pl.a2.unit74.lesson05.list_ewy: {"title": "Ewa's Message"}
  pl.a2.unit74.lesson06.porownujemy: {"title": "Comparing Experiences"}
teaching:
  pl.a2.unit74.lesson01.teach.byc: {"title": "Past of być", "gloss": "I was (a man), I was (a woman), you were (to a man), you were (to a woman), he was, she was", "note": "Polish past forms show the gender of the person: -łem or -łam for I, -łeś or -łaś for you.", "example_gloss": ["Marek was in Gdańsk.", "Ewa was in Kraków."]}
  pl.a2.unit74.lesson01.teach.miejsca: {"title": "Places", "gloss": "in Kraków, in Warsaw, in Gdańsk, at the seaside", "note": "After w the place name takes a special ending: Kraków becomes w Krakowie. Learn these as set phrases.", "example_gloss": ["I was in Warsaw. (a man speaking)", "I was in Warsaw. (a woman speaking)", "Ewa was at the seaside.", "Marek was in Warsaw."]}
  pl.a2.unit74.lesson01.teach.pytanie_slowa: {"title": "Question and answer words", "gloss": "(question word), ever, yes, no, never", "note": "*Czy* opens a yes-no question. *Kiedyś* means 'at some time', so it is the word for 'ever'.", "example_gloss": ["Have you ever been to Kraków? (to a man)", "Have you ever been to Gdańsk? (to a woman)", "Yes, I have been to Kraków. (a man speaking)", "No, I have never been to Gdańsk. (a woman speaking)"]}
  pl.a2.unit74.lesson01.teach.gn_pytanie: {"title": "Asking about experience", "gloss": "Have you ever been to Kraków? (to a man) Have you ever been to Kraków? (to a woman)", "note": "Polish has no present perfect. To ask what someone has done in their life, use *czy* + *kiedyś* + the past tense. The ending of the verb shows whether you ask a man (-łeś) or a woman (-łaś)."}
  pl.a2.unit74.lesson01.teach.gn_odpowiedz: {"title": "Answering", "gloss": "Yes, I have been to Kraków. (a man speaking) Yes, I have been to Kraków. (a woman speaking) No, I have never been to Kraków. (a man speaking) No, I have never been to Kraków. (a woman speaking)", "note": "The answer is also the past tense. The speaker uses -łem (a man) or -łam (a woman). *Nigdy nie* + past means 'never'; *nie* must always stay before the verb."}
  pl.a2.unit74.lesson01.teach.krotkie: {"title": "Short answers", "gloss": "Yes, I have. (a man speaking) Yes, I have. (a woman speaking) No, never.", "note": "In a conversation you can answer with just the verb: *Tak, byłem.*"}
  pl.a2.unit74.lesson02.teach.jesc: {"title": "Past of jeść and food", "gloss": "I ate (a man), I ate (a woman), you ate (to a man), you ate (to a woman), he ate, she ate, sushi, pizza, bigos (a Polish stew)", "note": "*Jeść* has the past stem *jad-*. Pizza becomes *pizzę* after the verb.", "example_gloss": ["I have eaten sushi. (a man speaking)", "Ewa has eaten pizza.", "Marek has eaten bigos.", "Have you ever eaten sushi? (to a woman)"]}
  pl.a2.unit74.lesson02.teach.gn_nigdy: {"title": "Nigdy nie", "gloss": "I have never been to Gdańsk. I have never eaten sushi. Ewa has never been to Gdańsk.", "note": "Polish uses double negation: *nigdy* (never) is always followed by *nie* before the verb. Never say *nigdy byłem*; it must be *nigdy nie byłem*."}
  pl.a2.unit74.lesson02.teach.juz_jeszcze: {"title": "Już and jeszcze nie", "gloss": "already, not yet", "note": "*Już* shows something is done before now. *Jeszcze nie* means 'not yet'.", "example_gloss": ["Ewa has already been to Kraków.", "Marek has not eaten sushi yet.", "I have not been to Gdańsk yet. (a man speaking)"]}
  pl.a2.unit74.lesson02.teach.gn_kontrast: {"title": "Not yet or never?", "gloss": "I have not been to Gdańsk yet. I have never been to Gdańsk.", "note": "*Jeszcze nie* means it has not happened so far, but it may happen later. *Nigdy nie* means it has never happened in your whole life. Both use *nie* and the past tense."}
  pl.a2.unit74.lesson02.teach.gn_juz: {"title": "Już in the past", "gloss": "I have already eaten sushi. I have not eaten sushi yet.", "note": "*Już* + past tense says the experience is behind you; *jeszcze nie* + past tense says it is still to come."}
  pl.a2.unit74.lesson02.teach.krotkie2: {"title": "Questions and short answers", "gloss": "Have you been to Kraków yet? (to a man) Yes, I have already. Not yet.", "note": "A short answer needs only *Jeszcze nie.* for 'not yet'."}
  pl.a2.unit74.lesson03.teach.czasowniki: {"title": "Experience verbs", "gloss": "to eat, to see, to try, to fly in a plane, to swim, to ride a horse", "note": "These are the infinitives. In a question about life experience the past form of this imperfective verb is used.", "example_gloss": ["Have you ever eaten bigos? (to a man)", "Have you ever seen the sea? (to a man)", "Have you ever ridden a horse? (to a woman)", "Have you ever tried sushi? (to a man)", "Have you ever flown in a plane? (to a man)", "Have you ever swum in the sea? (to a man)", "Have you ever ridden a horse? (to a man)"]}
  pl.a2.unit74.lesson03.teach.formy: {"title": "Past forms for I", "gloss": "I ate (a man), I ate (a woman), I saw (a man), I saw (a woman), I tried (a man), I tried (a woman), I flew (a man), I flew (a woman), I swam (a man), I swam (a woman), I rode (a man), I rode (a woman)", "note": "A man says -łem and a woman says -łam. The pairs are listed man first, then woman.", "example_gloss": ["I have eaten bigos. (a man speaking)", "I have seen the sea. (a man speaking)", "I have tried sushi. (a man speaking)", "I have flown in a plane. (a man speaking)", "I have swum in the sea. (a man speaking)", "I have ridden a horse. (a man speaking)", "Marek has never flown in a plane.", "Ewa has never flown in a plane."]}
  pl.a2.unit74.lesson03.teach.gn_aspekt: {"title": "General experience or one finished fact", "gloss": "Have you ever eaten sushi? I have already eaten lunch.", "note": "A question about experience in general uses the imperfective verb (*jeść*, *jadłeś*). A single finished action uses the perfective verb (*zjeść*, *zjadłem*): one lunch, eaten up."}
  pl.a2.unit74.lesson03.teach.dokonane: {"title": "Perfective verbs", "gloss": "to eat up, to catch sight of, to try once, lunch", "note": "The perfective verb names one complete event. It has a prefix: zjeść, zobaczyć, spróbować.", "example_gloss": ["I have already eaten lunch. (a man speaking)", "Ewa has already eaten lunch.", "Marek saw the sea in Gdańsk.", "I tried sushi in Kraków. (a man speaking)"]}
  pl.a2.unit74.lesson03.teach.gn_para: {"title": "Question and concrete answer", "gloss": "Have you ever tried sushi? Yes, I tried sushi in Kraków.", "note": "The question asks about experience, so it uses the imperfective *próbowałeś*. The answer names one occasion, so the perfective *spróbowałem* is natural."}
  pl.a2.unit74.lesson03.teach.krotkie3: {"title": "Short answers with verbs", "gloss": "Have you ever ridden a horse? (to a man) Yes, I have. No, I have never ridden a horse.", "note": "You can repeat the verb as a short answer."}
  pl.a2.unit74.lesson04.teach.razy: {"title": "Counting times", "gloss": "once, twice, three times, several times, how many times", "note": "After dwa, trzy and kilka the word is *razy*. For one time it is *raz*.", "example_gloss": ["I have been to Kraków twice. (a man speaking)", "Ewa has been to Warsaw twice.", "Ewa has eaten sushi several times.", "I have been to Gdańsk once. (a man speaking)", "How many times have you been to Warsaw? (to a man)"]}
  pl.a2.unit74.lesson04.teach.gn_razy: {"title": "Saying how often", "gloss": "I have been to Kraków once. I have been to Kraków twice. I have been to Kraków several times.", "note": "Add the count after the past tense verb. The count can also stand at the front: *Dwa razy byłem w Krakowie.*"}
  pl.a2.unit74.lesson04.teach.gn_ani: {"title": "Ani razu", "gloss": "I have not been to Gdańsk even once. I have never been to Gdańsk.", "note": "*Ani razu nie* + past is a stronger way to say 'not even once'. As always, *nie* stays before the verb."}
  pl.a2.unit74.lesson04.teach.lacznik: {"title": "Linking words", "gloss": "there, and, but, also, and you", "note": "These small words help you build longer answers.", "example_gloss": ["I have been to Kraków and to Warsaw. (a man speaking)", "I have been to Kraków, but I have not been to Gdańsk. (a man speaking)", "Ewa has also been to Kraków.", "I have been there twice, and you? (a man speaking)"]}
  pl.a2.unit74.lesson04.teach.gn_podsumowanie: {"title": "Possible answers", "gloss": "Have you ever eaten sushi? Yes, I have several times. No, never. Not yet.", "note": "Choose the answer that matches the truth: a count, *nigdy nie* for never or *jeszcze nie* for not yet."}
  pl.a2.unit74.lesson04.teach.pytania: {"title": "Questions and answers", "gloss": "How many times have you been to Kraków? (to a man) I have been there three times. Have you ever swum in the sea? (to a man) Yes, I have swum several times.", "note": "Ask with *ile razy* and answer with a count."}
  pl.a2.unit74.lesson05.teach.slowa: {"title": "Words for the message", "gloss": "hi, what, I will tell", "note": "*Cześć* is an informal hello between friends.", "example_gloss": ["Hi, Marek!", "What have I already seen? (a woman speaking)"]}
  pl.a2.unit74.lesson05.teach.gn_ja: {"title": "Ja też", "gloss": "I have not flown in a plane either. I have eaten sushi too. (a woman speaking)", "note": "*Ja* (I) is used here for emphasis. A woman speaking about herself uses -łam."}
  pl.a2.unit74.lesson05.teach.zdania: {"title": "Three sentences from Ewa", "gloss": "I have been to Kraków three times. I have not been to Gdańsk yet. I have never ridden a horse. (a woman speaking)", "note": "Ewa is a woman, so her past forms end in -łam."}
  pl.a2.unit74.lesson05.teach.lektura: {"title": "Ewa writes to Marek", "gloss": "Hi, Marek! I have been to Kraków three times and to Warsaw twice, but I have not been to Gdańsk yet. I have seen the sea, but I have never swum in the sea. I have eaten sushi several times. I have never ridden a horse and I have never flown in a plane. And you? Have you ever been to Gdańsk?", "note": "Notice how Ewa mixes counts, jeszcze nie and nigdy nie, all with the past tense.", "glosses": {"cześć": "hi", "widziałam": "I have seen", "pływałam": "I have swum", "jeździłam": "I have ridden", "leciałam": "I have flown"}}
  pl.a2.unit74.lesson06.teach.d1: {"title": "Ewa asks about Gdańsk", "gloss": "Ewa: Marek, have you ever been to Gdańsk?"}
  pl.a2.unit74.lesson06.teach.d2: {"title": "Marek answers", "gloss": "Marek: Yes, I have been there twice. I have swum in the sea too."}
  pl.a2.unit74.lesson06.teach.d3: {"title": "Ewa asks about flying", "gloss": "Ewa: I have not been to Gdańsk yet. Have you ever flown in a plane?"}
  pl.a2.unit74.lesson06.teach.d4: {"title": "Marek answers and asks back", "gloss": "Marek: No, I have never flown in a plane. And you?"}
  pl.a2.unit74.lesson06.teach.d5: {"title": "Ewa mentions sushi", "gloss": "Ewa: I have not flown either. But I have eaten sushi several times. Have you ever eaten sushi?"}
  pl.a2.unit74.lesson06.teach.d6: {"title": "Marek answers", "gloss": "Marek: I have not eaten sushi yet. But I want to try it!"}
exercises:
  pl.a2.unit74.lesson01.exercise01.elige_pytanie: {"instruction": "Choose the correct Polish question.", "correct_option": "Czy kiedyś byłeś w Krakowie?", "distractors": ["Czy kiedyś byłaś w Krakowie?", "Czy kiedyś byłem w Krakowie?", "Czy kiedyś był w Krakowie?"], "accepted_answers": [{"value": "Czy kiedyś byłeś w Krakowie?", "status": "correct"}], "feedback": "You ask a man, so the ending is -łeś: *byłeś*."}
  pl.a2.unit74.lesson01.exercise02.elige_odpowiedz: {"instruction": "Choose the correct Polish answer.", "correct_option": "Tak, byłam w Warszawie.", "distractors": ["Tak, byłem w Warszawie.", "Tak, byłaś w Warszawie.", "Tak, była w Warszawie."], "accepted_answers": [{"value": "Tak, byłam w Warszawie.", "status": "correct"}], "feedback": "A woman speaking about herself uses *-łam*: *byłam*."}
  pl.a2.unit74.lesson01.exercise03.une_zdania: {"instruction": "Match each Polish sentence or word to its meaning.", "accepted_answers": [{"value": [{"left": "Czy kiedyś byłeś w Krakowie?", "right": "Have you ever been to Kraków? (to a man)"}, {"left": "Czy kiedyś byłaś w Gdańsku?", "right": "Have you ever been to Gdańsk? (to a woman)"}, {"left": "Tak, byłem w Krakowie.", "right": "Yes, I have been to Kraków. (a man speaking)"}, {"left": "Tak, byłam w Warszawie.", "right": "Yes, I have been to Warsaw. (a woman speaking)"}, {"left": "Nie, nigdy nie byłem w Gdańsku.", "right": "No, I have never been to Gdańsk. (a man speaking)"}, {"left": "Nie, nigdy nie byłam w Gdańsku.", "right": "No, I have never been to Gdańsk. (a woman speaking)"}, {"left": "kiedyś", "right": "ever, at some time"}, {"left": "nigdy", "right": "never"}], "status": "correct"}], "feedback": "Notice -łeś and -łaś for you, -łem and -łam for I."}
  pl.a2.unit74.lesson01.exercise04.ordena_pytanie: {"instruction": "Put the words in order to ask a man: 'Have you ever been to Gdańsk?'", "correct_option": "Czy kiedyś byłeś w Gdańsku", "accepted_answers": [{"value": "Czy kiedyś byłeś w Gdańsku", "status": "correct"}, {"value": "Czy byłeś kiedyś w Gdańsku", "status": "correct"}], "feedback": "*Czy kiedyś byłeś w Gdańsku?*"}
  pl.a2.unit74.lesson01.exercise05.completa_byc: {"instruction": "Complete with the past form of być for a woman you are asking.", "correct_option": "byłaś", "accepted_answers": [{"value": "byłaś", "status": "correct"}], "feedback": "*Czy kiedyś byłaś w Gdańsku?* You ask a woman, so the ending is -łaś."}
  pl.a2.unit74.lesson01.exercise06.traduce_nigdy: {"instruction": "Translate into Polish. Use nigdy nie and the past tense.", "accepted_answers": [{"value": "Nigdy nie byłem w Gdańsku.", "status": "correct"}, {"value": "Nigdy nie byłem w Gdańsku", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku.", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku", "status": "correct"}], "feedback": "*Nigdy nie byłem w Gdańsku.* (a woman says *byłam*)"}
  pl.a2.unit74.lesson01.exercise07.escribe_dos: {"instruction": "Write exactly two sentences in the past tense, the first with tak and the second with nigdy nie.", "correct_option": "Tak, byłem w Krakowie. Nie, nigdy nie byłem w Gdańsku.", "accepted_answers": [{"value": "Tak, byłem w Krakowie. Nie, nigdy nie byłem w Gdańsku.", "status": "correct"}, {"value": "Tak, byłem w Krakowie. Nie, nigdy nie byłem w Gdańsku", "status": "correct"}, {"value": "Tak, byłam w Krakowie. Nie, nigdy nie byłam w Gdańsku.", "status": "correct"}, {"value": "Tak, byłam w Krakowie. Nie, nigdy nie byłam w Gdańsku", "status": "correct"}], "feedback": "*Tak, byłem w Krakowie. Nie, nigdy nie byłem w Gdańsku.* (a woman says *byłam*)"}
  pl.a2.unit74.lesson02.exercise01.elige_nigdy: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Nigdy nie jadłem sushi.", "distractors": ["Nigdy jadłem sushi.", "Nigdy nie jadłam sushi.", "Nie nigdy jadłem sushi."], "accepted_answers": [{"value": "Nigdy nie jadłem sushi.", "status": "correct"}], "feedback": "*Nigdy* needs *nie* before the verb, and a man says *jadłem*."}
  pl.a2.unit74.lesson02.exercise02.elige_jeszcze: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek jeszcze nie jadł sushi.", "distractors": ["Marek już jadł sushi.", "Marek jeszcze nie jadła sushi.", "Marek jeszcze jadł nie sushi."], "accepted_answers": [{"value": "Marek jeszcze nie jadł sushi.", "status": "correct"}], "feedback": "*Jeszcze nie* + past: *jeszcze nie jadł*. *Marek* is a man, so *jadł*."}
  pl.a2.unit74.lesson02.exercise03.une_kontrast: {"instruction": "Match each Polish sentence or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "Nigdy nie byłem w Gdańsku.", "right": "I have never been to Gdańsk."}, {"left": "Jeszcze nie byłem w Gdańsku.", "right": "I have not been to Gdańsk yet."}, {"left": "Już byłem w Krakowie.", "right": "I have already been to Kraków."}, {"left": "Nigdy nie jadłem sushi.", "right": "I have never eaten sushi."}, {"left": "Jeszcze nie jadłem sushi.", "right": "I have not eaten sushi yet."}, {"left": "Już jadłem sushi.", "right": "I have already eaten sushi."}, {"left": "jeszcze nie", "right": "not yet"}, {"left": "nigdy nie", "right": "never"}], "status": "correct"}], "feedback": "Nigdy nie = never; jeszcze nie = not yet; już = already."}
  pl.a2.unit74.lesson02.exercise04.ordena_jeszcze: {"instruction": "Put the words in order to say 'Ewa has not been to Gdańsk yet.'", "correct_option": "Ewa jeszcze nie była w Gdańsku", "accepted_answers": [{"value": "Ewa jeszcze nie była w Gdańsku", "status": "correct"}, {"value": "Ewa nie była jeszcze w Gdańsku", "status": "correct"}], "feedback": "*Ewa jeszcze nie była w Gdańsku.*"}
  pl.a2.unit74.lesson02.exercise05.completa_jeszcze: {"instruction": "Complete with the Polish word for 'not yet' (before nie).", "correct_option": "jeszcze", "accepted_answers": [{"value": "jeszcze", "status": "correct"}], "feedback": "*Marek jeszcze nie jadł sushi.* = Marek has not eaten sushi yet."}
  pl.a2.unit74.lesson02.exercise06.traduce_juz: {"instruction": "Translate into Polish. Use już and the past tense.", "accepted_answers": [{"value": "Już byłem w Krakowie.", "status": "correct"}, {"value": "Już byłem w Krakowie", "status": "correct"}, {"value": "Już byłam w Krakowie.", "status": "correct"}, {"value": "Już byłam w Krakowie", "status": "correct"}, {"value": "Byłem już w Krakowie.", "status": "correct"}, {"value": "Byłem już w Krakowie", "status": "correct"}, {"value": "Byłam już w Krakowie.", "status": "correct"}, {"value": "Byłam już w Krakowie", "status": "correct"}], "feedback": "*Już byłem w Krakowie.* (a woman says *byłam*)"}
  pl.a2.unit74.lesson02.exercise07.escribe_contraste: {"instruction": "Write exactly two sentences in the past tense: nigdy nie in the first and jeszcze nie in the second.", "correct_option": "Nigdy nie byłem w Gdańsku. Jeszcze nie jadłem sushi.", "accepted_answers": [{"value": "Nigdy nie byłem w Gdańsku. Jeszcze nie jadłem sushi.", "status": "correct"}, {"value": "Nigdy nie byłem w Gdańsku. Jeszcze nie jadłem sushi", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku. Jeszcze nie jadłam sushi.", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku. Jeszcze nie jadłam sushi", "status": "correct"}, {"value": "Nigdy nie byłem w Gdańsku. Nie jadłem jeszcze sushi.", "status": "correct"}, {"value": "Nigdy nie byłem w Gdańsku. Nie jadłem jeszcze sushi", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku. Nie jadłam jeszcze sushi.", "status": "correct"}, {"value": "Nigdy nie byłam w Gdańsku. Nie jadłam jeszcze sushi", "status": "correct"}], "feedback": "*Nigdy nie byłem w Gdańsku. Jeszcze nie jadłem sushi.* (a woman says *byłam* and *jadłam*)"}
  pl.a2.unit74.lesson03.exercise01.elige_samolot: {"instruction": "Choose the correct Polish question.", "correct_option": "Czy kiedyś leciałeś samolotem?", "distractors": ["Czy kiedyś leciałaś samolotem?", "Czy kiedyś lecieć samolotem?", "Czy kiedyś leciałem samolotem?"], "accepted_answers": [{"value": "Czy kiedyś leciałeś samolotem?", "status": "correct"}], "feedback": "You ask a man: *leciałeś*."}
  pl.a2.unit74.lesson03.exercise02.elige_obiad: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Zjadłem już obiad.", "distractors": ["Zjadłam już obiad.", "Zjadł już obiad.", "Zjeść już obiad."], "accepted_answers": [{"value": "Zjadłem już obiad.", "status": "correct"}], "feedback": "One finished lunch uses the perfective *zjadłem*. A man says *-łem*."}
  pl.a2.unit74.lesson03.exercise03.une_czasowniki: {"instruction": "Match each Polish verb to its meaning.", "accepted_answers": [{"value": [{"left": "jeść", "right": "to eat (in general)"}, {"left": "zjeść", "right": "to eat up, to finish a meal"}, {"left": "widzieć", "right": "to see (in general)"}, {"left": "zobaczyć", "right": "to catch sight of, to see once"}, {"left": "próbować", "right": "to try (in general)"}, {"left": "spróbować", "right": "to try once, to taste"}, {"left": "pływać", "right": "to swim"}, {"left": "jeździć konno", "right": "to ride a horse"}], "status": "correct"}], "feedback": "Pairs with a prefix (zjeść, zobaczyć, spróbować) name one finished event."}
  pl.a2.unit74.lesson03.exercise04.ordena_morze: {"instruction": "Put the words in order to ask a man: 'Have you ever seen the sea?'", "correct_option": "Czy kiedyś widziałeś morze", "accepted_answers": [{"value": "Czy kiedyś widziałeś morze", "status": "correct"}, {"value": "Czy widziałeś kiedyś morze", "status": "correct"}], "feedback": "*Czy kiedyś widziałeś morze?*"}
