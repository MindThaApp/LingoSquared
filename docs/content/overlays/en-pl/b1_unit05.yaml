answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek, Kasia,
    Kraków).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit05.mowa_zalezna:
    title: "Reported speech"

lessons:
  pl.b1.unit05.lesson01.powiedzial_ze:
    title: "He said that..."
  pl.b1.unit05.lesson02.zapytal_czy:
    title: "He asked whether..."
  pl.b1.unit05.lesson03.wiadomosc_od_kasi:
    title: "News from Kasia"
  pl.b1.unit05.lesson04.zapytal_gdzie:
    title: "He asked where..."

teaching:
  pl.b1.unit05.lesson01.teach.recap_words:
    title: "Is, I have, good, whether -- again"
    gloss: "jest, mam, dobry, czy, ja, ty -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds reported speech on top of them."

  pl.b1.unit05.lesson01.teach.powiedzial:
    title: "He said"
    gloss: "he said"
    note: "Past tense of *powiedzieć* (to say), masculine form."
    example_gloss: "Marek said that he is tired."

  pl.b1.unit05.lesson01.teach.zmeczony:
    title: "Tired"
    gloss: "tired"
    note: "*że* -- that, the connector that introduces the reported clause."
    example_gloss: "I am tired."

  pl.b1.unit05.lesson01.teach.no_backshift_note:
    title: "Polish does NOT shift tense in reported speech"
    gloss: "Unlike English, Polish does NOT \"backshift\" tense in reported speech -- the verb stays in the SAME tense as the original statement. Only the person changes: \"Jestem zmęczony\" (I am tired) -> \"Powiedział, że jest zmęczony\" (he said that he IS tired, not \"was\")."
    note: "The single most important contrast-with-English point in this whole unit -- an English speaker's instinct to shift to past tense here is wrong in Polish."

  pl.b1.unit05.lesson01.teach.phrase_powiedzial_ze:
    title: "Marek said that he is tired"
    gloss: "Marek said that he is tired."
    note: "A complete reported-statement sentence, present tense preserved."

  pl.b1.unit05.lesson02.teach.zapytala:
    title: "She asked"
    gloss: "she asked"
    note: "Past tense of *zapytać* (to ask), feminine form."
    example_gloss: "Ewa asked whether Marek has time."

  pl.b1.unit05.lesson02.teach.czy_note:
    title: "He/she asked whether..."
    gloss: "*zapytał/zapytała, czy...* -- he/she asked whether... We use \"czy\" to report yes/no questions -- the same \"czy\" that opens a direct yes/no question."
    note: "Reported yes/no questions use exactly the same word Polish already uses to ask them directly."

  pl.b1.unit05.lesson02.teach.phrase_zapytala_czy:
    title: "Ewa asked whether Marek has time"
    gloss: "Ewa asked whether Marek has time."
    note: "A complete reported-question sentence using czy."

  pl.b1.unit05.lesson02.teach.zapytal:
    title: "He asked"
    gloss: "he asked"
    note: "Past tense of *zapytać*, masculine form."
    example_gloss: "Marek asked whether Ewa is tired."

  pl.b1.unit05.lesson02.teach.zmeczona:
    title: "Tired (feminine)"
    gloss: "tired (feminine)"
    note: "Feminine form of *zmęczony*, agreeing with Ewa."
    example_gloss: "Ewa is tired."

  pl.b1.unit05.lesson03.teach.kasia_wczoraj:
    title: "Kasia, yesterday"
    gloss: "*Rozmawiałam z Kasią* -- I talked with Kasia (instrumental after \"z\")."
    note: "Kasia -- a mutual friend of Ewa and Marek's, introduced fresh in this unit."
    example_gloss: "I talked with Kasia yesterday."

  pl.b1.unit05.lesson03.teach.przeprowadza_sie:
    title: "She is moving"
    gloss: "she is moving (relocating)"
    note: "The reflexive verb from earlier in this course, now in the third person."
    example_gloss: "Kasia is moving to Kraków."

  pl.b1.unit05.lesson03.teach.w_przyszlym_miesiacu:
    title: "Next month"
    gloss: "next month"
    note: "*przyszłym* -- next/upcoming, *miesiącu* -- locative of *miesiąc* (month), after \"w\"."
    example_gloss: "She's moving next month."

  pl.b1.unit05.lesson03.teach.pomoc_weekend:
    title: "To help, weekend"
    gloss: "to help, weekend"
    note: "*możemy* -- we can; *mamy* -- we have."
    example_gloss: "Can we help her this weekend?"

  pl.b1.unit05.teach.dialogue.line01:
    title: "Ewa shares Kasia's news"
    gloss: "I talked with Kasia yesterday. She said that she's moving to Kraków."
    note: "The reported statement this lesson's exercises test -- Kasia's own actual, real plan, distinct from Marek's hypothetical wish in unit01."
  pl.b1.unit05.teach.dialogue.line02:
    title: "Marek reacts and asks directly"
    gloss: "Really? When is she moving?"
    note: "A direct question, not reported speech -- Marek asks Ewa this himself."
  pl.b1.unit05.teach.dialogue.line03:
    title: "Ewa reports Kasia's answer"
    gloss: "I asked her the same thing. She said next month."
    note: "The reported timing -- exactly the fact this lesson's exercises test."
  pl.b1.unit05.teach.dialogue.line04:
    title: "Marek asks about Kasia's question"
    gloss: "And did she ask whether we can help her?"
    note: "A reported yes/no question, using czy."
  pl.b1.unit05.teach.dialogue.line05:
    title: "Ewa confirms"
    gloss: "Yes, she asked whether we have time this weekend."
    note: "Confirms exactly what Kasia asked -- this weekend, never contradicted elsewhere."
  pl.b1.unit05.teach.dialogue.line06:
    title: "Marek concludes"
    gloss: "We should help her. She's a good friend."
    note: "A warm, natural close using this course's own *powinniśmy* from an earlier unit."

  pl.b1.unit05.lesson04.teach.gdzie:
    title: "Where"
    gloss: "where"
    note: "A question word, now used inside a reported clause."
    example_gloss: "He asked where I live."

  pl.b1.unit05.lesson04.teach.wh_note:
    title: "Wh-word reported questions don't need czy"
    gloss: "Questions with \"gdzie/kiedy/dlaczego\" (where/when/why) in reported speech do NOT need \"czy\" -- the question word itself introduces the clause: *Zapytał, gdzie mieszkam* (He asked where I live). *Zapytał, kiedy wracam* (He asked when I'm coming back)."
    note: "\"Czy\" is only for yes/no questions -- a wh-word question already has its own introducing word."

  pl.b1.unit05.lesson04.teach.wracam:
    title: "I'm coming back"
    gloss: "I'm coming back / I'm returning"
    note: "*kiedy* -- when."
    example_gloss: "He asked when I'm coming back."

  pl.b1.unit05.lesson04.teach.dlaczego_jestem_zmeczony:
    title: "He asked why I'm tired"
    gloss: "He asked why I'm tired."
    note: "*dlaczego* -- why. The same wh-word-introduces-the-clause pattern, extended to a third question word."

