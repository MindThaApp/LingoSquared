answer_policy:
  diacritics: >-
    Same standing policy as unit01-13: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the model
    answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit14.porownania:
    title: "Comparisons"

lessons:
  pl.a1.unit14.lesson01.starszy_i_mlodszy:
    title: "Older and younger"
  pl.a1.unit14.lesson02.lepszy_i_gorszy:
    title: "Better and worse"
  pl.a1.unit14.lesson03.rozmowa_ewy_i_marka:
    title: "Ewa and Marek's conversation"

teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: "Young"
    gloss: "young"
    note: "A basic descriptive adjective -- the starting point for this unit's comparative forms."
    example_gloss: "Marek is young."

  pl.a1.unit14.lesson01.teach.stary:
    title: "Old"
    gloss: "old"
    note: "The opposite of młody -- another adjective this unit will turn into a comparative."
    example_gloss: "Grandpa is old."

  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: "Making a comparison: add -szy"
    gloss: "For short adjectives like stary and młody, you change the -y ending to -szy: stary becomes starszy, młody becomes młodszy. Not every adjective works this way."
    note: >-
      A simple pattern for these two words: drop the final *-y* and add
      *-szy* to get the comparative form. Many other adjectives use a
      different ending, so don't apply it everywhere.

  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: "Older"
    gloss: "older"
    note: "Starszy is used for a man (or on); starsza for a woman (or ona) -- the comparative of stary."
    example_gloss:
      - "Grandpa is older than father."
      - "Grandma is older than mother."

  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: "Younger"
    gloss: "younger"
    note: "Młodszy for a man, młodsza for a woman -- the comparative of młody."
    example_gloss:
      - "Father is younger than grandpa."
      - "Mother is younger than grandma."

  pl.a1.unit14.lesson01.teach.niz:
    title: "Than"
    gloss: "than"
    note: "Niż connects the two things being compared -- the word after niż stays in its plain, normal form."
    example_gloss: "The son is younger than the father."

  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: "Comparatives agree with gender"
    gloss: "Starszy/starsza and młodszy/młodsza change with gender, just like byłem/byłam. Starszy, młodszy for a man (on); starsza, młodsza for a woman (ona)."
    note: >-
      Same pattern as *byłem*/*byłam* -- the ending changes depending on
      whether you're talking about a man or a woman.

  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: "Ewa is older than Marek"
    gloss: "Ewa is older than Marek."
    note: "A real fact about our two characters -- Ewa is 32, Marek is 28."

  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: "Marek is younger than Ewa"
    gloss: "Marek is younger than Ewa."
    note: "The same fact, said the other way around."

  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: "Good, again"
    gloss: "Dobry (good) -- you already know this from Dzień dobry."
    note: "The same adjective you've seen since the very first unit, now used to build a comparative."

  pl.a1.unit14.lesson02.teach.zly:
    title: "Bad"
    gloss: "bad"
    note: "The opposite of dobry -- a brand-new word this unit."
    example_gloss: "This is a bad day."

  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: "Dobry and zły are irregular"
    gloss: "Dobry and zły are irregular: dobry becomes lepszy, zły becomes gorszy -- you don't add -szy."
    note: >-
      Unlike *stary*/*młody*, these two don't follow the regular *-szy*
      pattern -- their comparative forms just have to be learned.

  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: "Better"
    gloss: "better"
    note: "Lepszy for a man, lepsza for a woman (or for a feminine word like kawa) -- the irregular comparative of dobry."
    example_gloss:
      - "He is better than me."
      - "Coffee is better than tea."

  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: "Worse"
    gloss: "worse"
    note: "Gorszy/gorsza -- the irregular comparative of zły."
    example_gloss:
      - "He is worse than me."
      - "Tea is worse than coffee."

  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: "Coffee and tea, again"
    gloss: "Kawa and herbata -- you already know these words from the earlier lesson about drinks."
    note: "A quick reminder before this lesson puts them into a comparison."

  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: "Same pattern as before"
    gloss: "Lepszy/lepsza and gorszy/gorsza change with gender the same way starszy/starsza did in the last lesson."
    note: "The same masculine/feminine split you just learned, applied to a new pair of words."

  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: "I, I am, you"
    gloss: "Ja, jestem, ty -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's dialogue."

  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: "Yes, no, OK"
    gloss: "Tak, nie, and dobrze -- also already familiar."
    note: "Another quick reminder before the dialogue."

  pl.a1.unit14.lesson03.teach.ale_recap:
    title: "But, again"
    gloss: "Ale (but) -- you already know this from earlier lessons. It connects two contrasting sentences."
    note: "A short connector that sets up a contrast, like in English."

  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: "Marek says tea is better"
    gloss: "Tea is better than coffee!"
    note: "Marek opens with his own opinion, matching what he already told us in the preferences lesson."
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: "Ewa disagrees"
    gloss: "No, no! Coffee is better than tea!"
    note: "Ewa pushes back with her own opinion -- also consistent with what she said before."
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: "Marek changes the subject to age"
    gloss: "OK, OK. But I am younger than you!"
    note: "Marek gives up the drinks argument and brings up something he's confident about instead."
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: "Ewa agrees, and restates her opinion"
    gloss: "Yes, I am older. But coffee is better!"
    note: "Ewa confirms the age fact, then returns to her own opinion about coffee."

exercises:
  pl.a1.unit14.lesson01.exercise01.select_starszy:
    instruction: "Which word means 'older' (for a man)?"
    correct_option: "starszy"
    distractors: ["stary", "młodszy"]
    accepted_answers: ["starszy"]

  pl.a1.unit14.lesson01.exercise02.select_mlodszy:
    instruction: "Which word means 'younger' (for a man)?"
    correct_option: "młodszy"
    distractors: ["młody", "starszy"]
    accepted_answers: ["młodszy"]

  pl.a1.unit14.lesson01.exercise03.select_niz:
    instruction: "Which word means 'than'?"
    correct_option: "niż"
    distractors: ["jest", "stary"]
    accepted_answers: ["niż"]

  pl.a1.unit14.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "stary": "old"
      "młody": "young"
      "starszy": "older (for a man)"
      "starsza": "older (for a woman)"
      "młodszy": "younger (for a man)"
      "młodsza": "younger (for a woman)"
      "niż": "than"

  pl.a1.unit14.lesson01.exercise05.order_ewa_starsza:
    instruction: "Put the sentence 'Ewa is older than Marek' in order."
    correct_response: ["Ewa", "jest", "starsza", "niż", "Marek"]

  pl.a1.unit14.lesson01.exercise06.order_marek_mlodszy:
    instruction: "Put the sentence 'Marek is younger than Ewa' in order."
    correct_response: ["Marek", "jest", "młodszy", "niż", "Ewa"]

  pl.a1.unit14.lesson01.exercise07.fill_ewa_starsza:
    instruction: "Complete the sentence: 'Ewa is older than Marek.'"
    accepted_answers: ["starsza"]
    feedback: "Ewa jest starsza niż Marek -- starsza is the feminine form, since Ewa is a woman."

  pl.a1.unit14.lesson01.exercise08.fix_ewa_gender:
    instruction: "Fix the sentence -- Ewa is a woman, so the adjective needs the feminine form."
    accepted_answers:
      - "Ewa jest starsza niż Marek."
      - "Ewa jest starsza niż Marek"
    feedback: "Ewa jest starsza, not Ewa jest starszy -- the adjective must agree with Ewa's gender."

  pl.a1.unit14.lesson01.exercise09.speak_marek_mlodszy:
    instruction: "Say: 'Marek is younger than Ewa.'"
    accepted_answers:
      - "Marek jest młodszy niż Ewa."
      - "Marek jest młodszy niż Ewa"

  pl.a1.unit14.lesson02.exercise01.select_zly:
    instruction: "Which word means 'bad'?"
    correct_option: "zły"
    distractors: ["dobry", "lepszy"]
    accepted_answers: ["zły"]

  pl.a1.unit14.lesson02.exercise02.select_lepsza:
    instruction: "Which word means 'better'?"
    correct_option: "lepsza"
    distractors: ["gorsza", "zły"]
    accepted_answers: ["lepsza"]

  pl.a1.unit14.lesson02.exercise03.select_gorszy:
    instruction: "Which word means 'worse'?"
    correct_option: "gorszy"
    distractors: ["lepszy", "dobry"]
    accepted_answers: ["gorszy"]

  pl.a1.unit14.lesson02.exercise04.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "dobry": "good"
      "zły": "bad"
      "lepszy": "better (for a man)"
      "lepsza": "better (for a woman/kawa/herbata)"
      "gorszy": "worse (for a man)"
      "gorsza": "worse (for a woman/kawa/herbata)"
      "kawa": "coffee"
      "herbata": "tea"

  pl.a1.unit14.lesson02.exercise05.order_kawa_lepsza:
    instruction: "Put the sentence 'Coffee is better than tea' in order."
    correct_response: ["Kawa", "jest", "lepsza", "niż", "herbata"]

  pl.a1.unit14.lesson02.exercise06.order_herbata_gorsza:
    instruction: "Put the sentence 'Tea is worse than coffee' in order."
    correct_response: ["Herbata", "jest", "gorsza", "niż", "kawa"]

  pl.a1.unit14.lesson02.exercise07.fill_kawa_lepsza:
    instruction: "Complete the sentence: 'Coffee is better than tea.'"
    accepted_answers: ["lepsza"]
    feedback: "Kawa jest lepsza niż herbata -- lepsza is the feminine form, since kawa is a feminine word."

  pl.a1.unit14.lesson02.exercise08.fix_kawa_gender:
    instruction: "Fix the sentence -- kawa is a feminine word, so the adjective needs the feminine form."
    accepted_answers:
      - "Kawa jest lepsza niż herbata."
      - "Kawa jest lepsza niż herbata"
    feedback: "Kawa jest lepsza, not Kawa jest lepszy -- the adjective must agree with kawa's gender."

  pl.a1.unit14.lesson02.exercise09.speak_herbata_lepsza:
    instruction: "Say: 'Tea is better than coffee.'"
    accepted_answers:
      - "Herbata jest lepsza niż kawa."
      - "Herbata jest lepsza niż kawa"

  pl.a1.unit14.lesson03.exercise01.select_kawa_lepsza_line:
    instruction: "Which line says tea is better than coffee?"
    correct_option: "Herbata jest lepsza niż kawa!"
    distractors:
      - "Nie, nie! Kawa jest lepsza niż herbata!"
      - "Dobrze, dobrze. Ale ja jestem młodszy niż ty!"
    accepted_answers:
      - "Herbata jest lepsza niż kawa!"
      - "Herbata jest lepsza niż kawa"

  pl.a1.unit14.lesson03.exercise02.select_marek_mlodszy_line:
    instruction: "Which line says Marek is younger than Ewa?"
    correct_option: "Dobrze, dobrze. Ale ja jestem młodszy niż ty!"
    distractors:
      - "Herbata jest lepsza niż kawa!"
      - "Tak, jestem starsza. Ale kawa jest lepsza!"
    accepted_answers:
      - "Dobrze, dobrze. Ale ja jestem młodszy niż ty!"
      - "Dobrze, dobrze. Ale ja jestem młodszy niż ty"

  pl.a1.unit14.lesson03.exercise03.comprehend_ewa_older:
    instruction: "Read the line. Who does Ewa say is older?"
    correct_option: "Ewa (herself)"
    distractors:
      - "Marek"
      - "neither of them"
    accepted_answers:
      - "starsza"
      - "Ewa (herself)"
      - "Ewa"

  pl.a1.unit14.lesson03.exercise04.comprehend_marek_younger:
    instruction: "Read the line. Who does Marek say is younger?"
    correct_option: "Marek (himself)"
    distractors:
      - "Ewa"
      - "neither of them"
    accepted_answers:
      - "młodszy"
      - "Marek (himself)"
      - "Marek"

  pl.a1.unit14.lesson03.exercise05.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "Ale": "but"
      "ja": "I"
      "jestem": "I am"
      "ty": "you (informal)"
      "Nie": "no"
      "Dobrze": "OK / well"
      "Tak": "yes"
      "starsza": "older (for a woman)"
      "młodszy": "younger (for a man)"
      "niż": "than"

  pl.a1.unit14.lesson03.exercise06.order_marek_younger_line:
    instruction: "Put Marek's line in order: 'But I am younger than you!'"
    correct_response: ["Ale", "ja", "jestem", "młodszy", "niż", "ty"]

  pl.a1.unit14.lesson03.exercise07.order_ewa_older_start:
    instruction: "Put the start of Ewa's line in order: 'Yes, I am older.'"
    correct_response: ["Tak", "jestem", "starsza"]

  pl.a1.unit14.lesson03.exercise08.fill_ale:
    instruction: "Complete Marek's line: 'OK, OK. But I am younger than you!'"
    accepted_answers: ["Ale"]
    feedback: "Dobrze, dobrze. Ale ja jestem młodszy niż ty! -- ale sets up the contrast with what Ewa just said."

  pl.a1.unit14.lesson03.exercise09.fix_ewa_starsza_gender:
    instruction: "Fix the sentence -- Ewa is a woman, so the adjective needs the feminine form."
    accepted_answers:
      - "Tak, jestem starsza."
      - "Tak, jestem starsza"
    feedback: "Jestem starsza, not jestem starszy -- Ewa is speaking about herself, a woman."

  pl.a1.unit14.lesson03.exercise10.reply_kawa_lepsza:
    instruction: "Answer as Ewa: disagree, and say coffee is better than tea."
    accepted_answers:
      - "Nie, nie! Kawa jest lepsza niż herbata!"
      - "Nie, nie! Kawa jest lepsza niż herbata"
      - "Nie, nie, kawa jest lepsza niż herbata"
      - "Nie! Kawa jest lepsza niż herbata!"
      - "Nie, kawa jest lepsza niż herbata."
      - "Nie, kawa jest lepsza niż herbata"

  pl.a1.unit14.lesson03.exercise11.speak_jestem_starsza:
    instruction: "Say, as Ewa: 'I am older.'"
    accepted_answers:
      - "Jestem starsza."
      - "Jestem starsza"
      - "Ja jestem starsza."
      - "Ja jestem starsza"
