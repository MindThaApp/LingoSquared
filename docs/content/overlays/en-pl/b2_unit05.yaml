review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for pl's fifth B2 unit (register), authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English has ONE 'you'; Polish's informal ty (usually
    DROPPED, carried only by the verb ending: masz, możesz) vs formal
    Państwo (always stated, 3rd-plural verb: mają, mogą, mogliby) has no
    English anchor and is drilled explicitly in lesson01; (2) English
    requests can stay direct and sound polite ('Can you...?'), whereas
    formal Polish marks respect by going indirect (Czy mogliby Państwo /
    Czy byłoby możliwe, żeby) -- lesson03 contrasts these against the
    informal direct question so a learner does not carry English
    directness into a formal Polish letter; (3) letter openings/closings
    differ sharply by register (Cześć/Pozdrawiam vs Szanowni Państwo / Z
    poważaniem / Łączę wyrazy szacunku) and are taught as fixed formulas
    in lesson02, including the VOCATIVE case for direct address (Ewo, not
    Ewa) -- a real Polish-specific feature with no English equivalent;
    (4) 'proszę' does NOT split by register in Polish the way Dutch
    alsjeblieft/alstublieft does -- flagged explicitly so a learner does
    not go looking for a separate formal 'please'. This unit
    DELIBERATELY teaches both registers -- each individual exercise stays
    in one consistent register, and every production prompt names the
    register AND the frame wanted so a correct answer in the OTHER
    register is not marked wrong. No sibling-direction file (pl-en) was
    consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    Realization: lesson05 exercise01-04 (reading_comprehension) -- prompt
    showed only the English question, never the two messages it asks about
    -> added both messages (labelled Message 1 / Message 2) as
    target_blocks before the question (comprehension-without-text).
    Overlay: missing accepted answers added (all valid for prompts that do
    not pin the frame): lesson01 exercise05 + Mają Państwo czas / Czy
    Państwo mają czas; exercise06 + Czy możesz pomóc; exercise07 + Mogą
    Państwo pomóc / Czy Państwo mogą pomóc; lesson03 exercise05 + Możesz
    to zrobić; exercise07 + Mogliby Państwo pomóc / Czy Państwo mogliby
    pomóc; lesson04 exercise05 + Możemy przełożyć spotkanie; exercise07 +
    W poniedziałek nie mogę; lesson05 exercise06 + Pasowałby przyszły
    tydzień / Czy pasowałby Państwu przyszły tydzień; lesson06 exercise04
    + Możesz przełożyć spotkanie. NATIVE CHECK: (a) 'Czy byłoby możliwe,
    żeby pomóc?' (lesson03, no object, żeby+infinitive) -- natural, or
    should it be e.g. 'Czy byłaby możliwość pomocy?'; (b) the claim that
    bare-nominative 'Cześć Ewa!' would 'sound slightly odd' (teach.ewo
    note) may overstate it -- it is common in casual speech; (c)
    'Pozdrawiam' glossed informal-neutral is also widely used in
    neutral/semi-formal e-mail.
    Second-pass review 2026-10-19: 8 fixes - false notes:
    teach.czy_maja_panstwo_czas claimed Czy marks a formal question (it is
    the neutral yes/no particle, used in both registers) -> reworded;
    teach.czy_mozemy_przelozyc claimed the request uses dropped ty (it
    uses we-form możemy) -> reworded; teach.ewo overstated that plain
    'Ewa' in address sounds odd -> softened (vocative standard in writing,
    nominative common in speech); teach.lacze_wyrazy_szacunku + lesson02
    exercise07 feedback called Łączę wyrazy szacunku 'more distant' than Z
    poważaniem (Z poważaniem is the cooler formula) -> 'more deferential
    and ceremonial'; lesson05 exercise04 correct option claimed Message 1
    uses dropped ty (it has no 2nd-person form) -> contrasts Szanowni
    Państwo/Czy byłoby możliwe with Cześć/czy możemy; Dutch comparisons
    removed from learner-facing teach.prosze note and lesson03 exercise01
    feedback (English-speaker course); missing answers: lesson06
    exercise06 + versions without nasze (the quoted source sentence has
    none); canon: formal letter surname Kowalski -> Wójcik (gloss key
    updated). NATIVE FLAGS: see realization.

course:
  title: Polish B2
  description: >-
    Upper-intermediate Polish: adapt your formality to the audience -- say
    the same thing appropriately to a close friend and to an office.
    Switch between dropped-ty and formal Państwo, between Cześć/Pozdrawiam
    and Szanowni Państwo / Z poważaniem, and between a direct request
    (czy możesz...?) and an indirect polite one (czy byłoby możliwe,
    żeby...?), around the everyday task of rescheduling an appointment.

units:
  pl.b2.unit05.rejestr:
    title: "Register"
    description: Adapt your formality to who you are addressing -- deliver the same request appropriately to a close friend and to an office, switching pronouns, greetings, closings and directness.

lessons:
  pl.b2.unit05.lesson01.ty_czy_panstwo:
    title: "You or you (formal)?"
  pl.b2.unit05.lesson02.powitanie_pozegnanie:
    title: "Greeting and closing"
  pl.b2.unit05.lesson03.bezposrednio_czy_uprzejmie:
    title: "Direct or polite?"
  pl.b2.unit05.lesson04.przelozenie_spotkania:
    title: "Rescheduling the appointment"
  pl.b2.unit05.lesson05.dwie_wiadomosci:
    title: "Two messages, two readers"
  pl.b2.unit05.lesson06.wybor_rejestru:
    title: "Choosing the right register"

teaching:
  pl.b2.unit05.lesson01.teach.marek_pisze:
    title: "Marek is writing a message."
    gloss: "Marek is writing a message."
    note: "The situation this whole unit works with: Marek has to send the same request to two very different readers. *Wiadomość* = 'a message'."
  pl.b2.unit05.lesson01.teach.ty:
    title: "you (informal)"
    gloss: "you (informal)"
    note: "*Ty* is the informal 'you' -- for friends, family, peers, like Marek with Ewa. Polish usually DROPS the subject pronoun in the ty-register; the verb ending alone carries the person: *masz* already means 'you have', no *ty* needed."
    example_gloss: "I'm writing to you."
  pl.b2.unit05.lesson01.teach.panstwo:
    title: "you (formal, institutional)"
    gloss: "you (formal, to an institution)"
    note: "*Państwo* is the formal 'you' used for an office or institution -- it takes 3RD-PERSON-PLURAL verb forms (*mają*, *mogą*) and is capitalized as a mark of respect. It deliberately sidesteps guessing whether the reader is *Pan* (a man) or *Pani* (a woman), which you rarely know when writing to an office."
    example_gloss: "I'm writing to you (the office)."
  pl.b2.unit05.lesson01.teach.masz_czas:
    title: "Do you have time? (informal)"
    gloss: "Do you have time?"
    note: "Informal. *Masz...?* is the *ty*-form of *mieć* ('to have') with the pronoun dropped, as Polish normally does."
  pl.b2.unit05.lesson01.teach.czy_maja_panstwo_czas:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "Formal. *Czy* is the yes/no question particle (used in both registers, but it makes a question sound more careful, so formal questions almost always have it); *mają Państwo* uses the 3rd-plural form of *mieć*, not the 2nd-singular *masz*. This verb shift is the heart of switching into the formal register."
  pl.b2.unit05.lesson01.teach.mozesz_pomoc:
    title: "Can you help? (informal)"
    gloss: "Can you help?"
    note: "Informal. *Możesz...?* is the *ty*-form of *móc* ('can'), pronoun dropped. Direct and perfectly polite between friends."
  pl.b2.unit05.lesson01.teach.czy_moga_panstwo_pomoc:
    title: "Can you help? (formal)"
    gloss: "Can you help?"
    note: "Formal. *Czy mogą Państwo...?* -- again the 3rd-plural form (*mogą*), not *możesz*. Same question, shifted up in formality."
  pl.b2.unit05.lesson01.teach.grammar_ty_panstwo:
    title: "Do you have time? / Do you have time? Can you help? / Can you help?"
    gloss: "Do you have time? (informal / formal). Can you help? (informal / formal)."
    note: "The core move of this unit: *ty -> Państwo* changes the verb too. *masz -> mają Państwo*, *możesz -> mogą Państwo*. Choose *ty* for a friend and *Państwo* for an office."

  pl.b2.unit05.lesson02.teach.czesc:
    title: "Hi"
    gloss: "Hi"
    note: "*Cześć* is the informal greeting -- for a friend, a text, a chat. Also doubles as an informal goodbye."
    example_gloss: "Hi, how are you?"
  pl.b2.unit05.lesson02.teach.ewo:
    title: "Ewa (direct address)"
    gloss: "Ewa (vocative -- used when directly addressing her)"
    note: "*Ewo* is the VOCATIVE case of *Ewa* -- Polish personal names change form in direct address, unlike English. *Cześć Ewo!* is exactly how Marek opens a message to her. In writing the vocative is the standard, careful form; in casual speech many people also just say *Ewa*."
    example_gloss: "Hi Ewa!"
  pl.b2.unit05.lesson02.teach.pozdrawiam:
    title: "Best wishes (sign-off)"
    gloss: "Best wishes / regards"
    note: "*Pozdrawiam* ('I greet you') is the everyday, register-neutral-to-informal way to sign off a message to a friend."
    example_gloss: "Best wishes, Marek."
  pl.b2.unit05.lesson02.teach.szanowni_panstwo:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam"
    note: "*Szanowni Państwo* ('respected Sir/Madam-collective') is the standard formal salutation when you don't know the reader's name -- the opener for a letter or e-mail to an office."
  pl.b2.unit05.lesson02.teach.z_powazaniem:
    title: "Kind regards"
    gloss: "Kind regards / Sincerely"
    note: "*Z poważaniem* ('with regard/respect') is the everyday formal closing -- the standard way to end a polite e-mail or letter, at any level of officialdom."
  pl.b2.unit05.lesson02.teach.lacze_wyrazy_szacunku:
    title: "Yours faithfully"
    gloss: "Yours faithfully (most formal)"
    note: "*Łączę wyrazy szacunku* ('I convey expressions of respect') is the MOST formal sign-off -- more deferential and ceremonial than *Z poważaniem*, reserved for very official correspondence or a reader you especially respect."
  pl.b2.unit05.lesson02.teach.szanowna_pani:
    title: "Dear Madam / Dear Sir"
    gloss: "Dear Madam / Dear Sir (+ name, neutral-formal)"
    note: "*Szanowna Pani* / *Szanowny Panie* + a name is the neutral-formal middle ground -- warmer than the anonymous *Szanowni Państwo*, used once you know the specific reader. The name that follows also takes the vocative case."
    example_gloss: "Dear Ewa,"
  pl.b2.unit05.lesson02.teach.grammar_powitanie:
    title: "Hi Ewa! Best wishes. Dear Sir or Madam, Kind regards."
    gloss: "Hi Ewa! Best wishes. Dear Sir or Madam, Kind regards."
    note: "Openings and closings come in matched registers. Informal: *Cześć* ... *Pozdrawiam*. Formal: *Szanowni Państwo* ... *Z poważaniem* (or *Łączę wyrazy szacunku* for the most official). Mixing them reads as a mistake."

  pl.b2.unit05.lesson03.teach.czy_mozesz_to_zrobic:
    title: "Can you do this? (informal)"
    gloss: "Can you do this?"
    note: "Informal and direct: *Czy możesz to zrobić?* Between friends, a direct request is the normal, friendly choice."
  pl.b2.unit05.lesson03.teach.prosze:
    title: please
    gloss: please
    note: "*Proszę* is simply 'please' -- Polish does NOT have a separate formal 'please'; *proszę* is used in both registers."
    example_gloss: "Can you do this, please?"
  pl.b2.unit05.lesson03.teach.czy_mogliby_panstwo:
    title: "Could you do this? (formal)"
    gloss: "Could you do this?"
    note: "Formal and indirect. *Mogliby* is the conditional 3rd-plural of *móc* ('can'), agreeing with *Państwo* -- softer and more polite than a plain *mogą*."
  pl.b2.unit05.lesson03.teach.czy_byloby_mozliwe:
    title: "Would it be possible to...?"
    gloss: "Would it be possible to...?"
    note: "*Czy byłoby możliwe, żeby...?* is a very common polite, indirect way to make a formal request. *Byłoby* is the impersonal neuter conditional -- it agrees with the impersonal 'it', NOT with the speaker's gender, so this frame never needs a gender-specific form."
    example_gloss: "Would it be possible to help?"
  pl.b2.unit05.lesson03.teach.grammar_bezposredniosc:
    title: "Can you do this? Could you do this? Would it be possible to help?"
    gloss: "Can you do this? Could you do this? Would it be possible to help?"
    note: "Directness is a register signal. Informal: a direct *Czy możesz...?* + *proszę*. Formal: an indirect *Czy mogliby Państwo...?* or *Czy byłoby możliwe, żeby...?* The more indirect, the more formal."

  pl.b2.unit05.lesson04.teach.spotkanie:
    title: "the appointment"
    gloss: "the appointment / meeting"
    example_gloss: "I have an appointment."
  pl.b2.unit05.lesson04.teach.przelozyc:
    title: "to reschedule"
    gloss: "to reschedule / move"
    note: "*Przełożyć spotkanie* = 'to reschedule the appointment'. *Chcę* = 'I want' (present tense, no gender marking)."
    example_gloss: "I want to reschedule the appointment."
  pl.b2.unit05.lesson04.teach.poniedzialek:
    title: Monday
    gloss: Monday
    note: "*Nie mogę w poniedziałek* = 'I can't (make it) on Monday'."
    example_gloss: "I can't on Monday."
  pl.b2.unit05.lesson04.teach.przyszly_tydzien:
    title: "next week"
    gloss: "next week"
    note: "*W przyszłym tygodniu* is the locative form of *przyszły tydzień*, used after *w* ('in')."
    example_gloss: "Can we do it next week?"
  pl.b2.unit05.lesson04.teach.czy_mozemy_przelozyc:
    title: "Can we reschedule the appointment? (informal)"
    gloss: "Can we reschedule the appointment?"
    note: "The request in its informal form, to a friend: a direct question in the 'we' form (*możemy*), with no *Państwo* and no softening frame."
  pl.b2.unit05.lesson04.teach.czy_byloby_mozliwe_spotkanie:
    title: "Would it be possible to reschedule our appointment? (formal)"
    gloss: "Would it be possible to reschedule our appointment?"
    note: "The SAME request in formal form, to an office. *Nasze* = 'our'."
  pl.b2.unit05.lesson04.teach.grammar_spotkanie:
    title: "Can we reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can we reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "One request, two registers -- the whole point of this unit."

  pl.b2.unit05.lesson05.teach.pasowac:
    title: "to suit / work (for a time)"
    gloss: "to suit / to work (for a time)"
    note: "*Pasować* = '(for a time) to suit'. *Czy pasowałby przyszły tydzień?* -- a polite way to propose a new time; *pasowałby* agrees with *tydzień* (a masculine noun), NOT with the speaker, so this is gender-safe regardless of who is asking."
    example_gloss: "Would next week suit?"
  pl.b2.unit05.lesson05.teach.tekst_nieformalny:
    title: "Informal message (to Ewa)"
    gloss: "Hi Ewa! Can we reschedule the appointment? I can't on Monday. Maybe next week? Best wishes, Marek"
  pl.b2.unit05.lesson05.teach.tekst_formalny:
    title: "Formal message (to an office)"
    gloss: "Dear Sir or Madam, Would it be possible to reschedule our appointment? I can't on Monday. Would next week suit? Kind regards, Marek Wójcik"
    glosses:
      Wójcik: "Wójcik (Marek's surname)"

  pl.b2.unit05.lesson06.teach.zaden_problem:
    title: "No problem."
    gloss: "No problem."
  pl.b2.unit05.lesson06.teach.kiedy:
    title: when
    gloss: when
    example_gloss: "When can you?"
  pl.b2.unit05.lesson06.teach.urzad:
    title: "the office"
    gloss: "the office (a government/administrative office)"
    note: "*Urząd* -- a classic institution you'd write to formally. *Urzędu* is its genitive form after *do* ('to')."
    example_gloss: "I'm writing to the office."
  pl.b2.unit05.lesson06.teach.inaczej:
    title: differently
    gloss: differently
    note: "*Do urzędu piszesz inaczej* = 'to the office you write differently' -- exactly the skill of this unit."
    example_gloss: "You write to the office differently."
  pl.b2.unit05.lesson06.teach.dialogue_marek_open:
    title: "Marek: Hi Ewa, can we reschedule the appointment? I can't on Monday."
    gloss: "Marek: Hi Ewa, can we reschedule the appointment? I can't on Monday."
  pl.b2.unit05.lesson06.teach.dialogue_ewa_ok:
    title: "Ewa: No problem. And when can you?"
    gloss: "Ewa: No problem. And when can you?"
  pl.b2.unit05.lesson06.teach.dialogue_marek_urzad:
    title: "Marek: Maybe next week? And I still have to write to the office."
    gloss: "Marek: Maybe next week? And I still have to write to the office."
  pl.b2.unit05.lesson06.teach.dialogue_ewa_inaczej:
    title: "Ewa: Yeah, to the office you obviously write differently."
    gloss: "Ewa: Yeah, to the office you obviously write differently."
  pl.b2.unit05.lesson06.teach.grammar_oba_rejestry:
    title: "Can you reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader."

exercises:
  pl.b2.unit05.lesson01.exercise01.recognize_panstwo:
    instruction: "Who do you address as 'Państwo'?"
    correct_option: "someone you treat formally (an office or institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (an office or institution)", status: correct}]
    feedback: "Państwo is the formal 'you' -- for offices and institutions. For a friend you use ty."
  pl.b2.unit05.lesson01.exercise02.listen_czy_maja_panstwo:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (formal)"
    distractors: ["Do you have time? (informal)", "Can you help? (formal)", "Do you have an appointment? (formal)"]
    accepted_answers: [{value: "Do you have time? (formal)", status: correct}]
    feedback: "Czy mają Państwo czas? is the formal 'do you have time?' -- Państwo takes the 3rd-plural verb mają."
  pl.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each Polish word or phrase with its meaning and register."
    accepted_answers:
      - value: {ty: "you (informal)", Państwo: "you (formal, institutional)", "Masz czas?": "Do you have time? (informal)", "Czy mają Państwo czas?": "Do you have time? (formal)", "Możesz pomóc?": "Can you help? (informal)", "Czy mogą Państwo pomóc?": "Can you help? (formal)", wiadomość: message, "do ciebie": "to you (informal)"}
        status: correct
    feedback: "ty is the informal pronoun; Państwo is the formal one -- and the verb follows (możesz vs mogą Państwo)."
  pl.b2.unit05.lesson01.exercise04.order_masz_czas:
    instruction: "Put the words in order, informal: Do you have time?"
    accepted_answers:
      - {value: "Masz czas", status: correct}
    feedback: "Masz czas? -- the informal ty-form of mieć, pronoun dropped."
  pl.b2.unit05.lesson01.exercise05.translate_czy_maja_panstwo:
    instruction: "Translate into Polish, formal (addressing the reader as Państwo): Do you have time?"
    accepted_answers:
      - {value: "Czy mają Państwo czas", status: correct}
      - {value: "Mają Państwo czas", status: correct}
      - {value: "Czy Państwo mają czas", status: correct}
    feedback: "Czy mają Państwo czas? -- with Państwo the verb is mają, not masz."
  pl.b2.unit05.lesson01.exercise06.translate_mozesz_pomoc:
    instruction: "Translate into Polish, informal (addressing the reader as ty): Can you help?"
    accepted_answers:
      - {value: "Możesz pomóc", status: correct}
      - {value: "Czy możesz pomóc", status: correct}
    feedback: "Możesz pomóc? -- the informal ty-form of móc, pronoun dropped."
  pl.b2.unit05.lesson01.exercise07.speak_czy_moga_panstwo:
    instruction: "Say aloud in Polish, formal (addressing the reader as Państwo): Can you help?"
    accepted_answers:
      - {value: "Czy mogą Państwo pomóc", status: correct}
      - {value: "Mogą Państwo pomóc", status: correct}
      - {value: "Czy Państwo mogą pomóc", status: correct}
    feedback: "Czy mogą Państwo pomóc? -- with Państwo the verb is mogą, not możesz."
  pl.b2.unit05.lesson01.exercise08.dictation_czy_maja_panstwo:
    instruction: "Type what you hear."
    correct_response: "Czy mają Państwo czas?"
    orthography_strict: true
    feedback: "You heard Czy mają Państwo czas? — the formal 'do you have time?'."

  pl.b2.unit05.lesson02.exercise01.recognize_szanowni_panstwo:
    instruction: "When would you write 'Szanowni Państwo'?"
    correct_option: "to open a formal letter to someone whose name you don't know"
    distractors: ["to text a friend", "to sign off a message to your sister", "to greet a child"]
    accepted_answers: [{value: "to open a formal letter to someone whose name you don't know", status: correct}]
    feedback: "Szanowni Państwo is the formal salutation when the reader is unknown -- for an office, not a friend."
  pl.b2.unit05.lesson02.exercise02.listen_z_powazaniem:
    instruction: "Listen and select what you hear."
    correct_option: "Kind regards (formal closing)"
    distractors: ["Best wishes (informal-neutral sign-off)", "Dear Sir or Madam (formal opening)", "Yours faithfully (most formal closing)"]
    accepted_answers: [{value: "Kind regards (formal closing)", status: correct}]
    feedback: "Z poważaniem is the everyday formal closing -- 'kind regards'."
  pl.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each opening or closing with its meaning and register."
    accepted_answers:
      - value: {Cześć: "informal 'hi'", Pozdrawiam: "informal-neutral sign-off (best wishes)", "Szanowni Państwo": "formal salutation (Dear Sir or Madam)", "Z poważaniem": "formal closing (kind regards)", "Łączę wyrazy szacunku": "most formal closing (yours faithfully)", "Szanowna Pani": "neutral-formal 'Dear Madam' + name"}
        status: correct
    feedback: "Informal Cześć/Pozdrawiam, formal Szanowni Państwo / Z poważaniem, most formal Łączę wyrazy szacunku."
  pl.b2.unit05.lesson02.exercise04.order_z_powazaniem:
    instruction: "Put the words in order, the formal closing: Kind regards."
    accepted_answers:
      - {value: "Z poważaniem", status: correct}
    feedback: "Z poważaniem -- the standard formal sign-off."
  pl.b2.unit05.lesson02.exercise05.translate_szanowni_panstwo:
    instruction: "Write the formal Polish salutation for a letter to someone you don't know: Dear Sir or Madam."
    accepted_answers:
      - {value: "Szanowni Państwo", status: correct}
      - {value: "Szanowni Państwo,", status: correct}
    feedback: "Szanowni Państwo -- the formal opening when you don't know the reader's name."
  pl.b2.unit05.lesson02.exercise06.write_pozdrawiam:
    instruction: "Write an informal Polish sign-off to a friend, from Marek: Best wishes, Marek."
    accepted_answers:
      - {value: "Pozdrawiam, Marek", status: correct}
      - {value: "Pozdrawiam Marek", status: correct}
    feedback: "Pozdrawiam, Marek -- the informal way to close a message to a friend."
  pl.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal?"
    correct_option: "Łączę wyrazy szacunku"
    distractors: [Pozdrawiam, "Cześć", "Z poważaniem"]
    accepted_answers: [{value: "Łączę wyrazy szacunku", status: correct}]
    feedback: "Łączę wyrazy szacunku ('yours faithfully') is the most formal sign-off -- more deferential and ceremonial than Z poważaniem."

  pl.b2.unit05.lesson03.exercise01.recognize_prosze:
    instruction: "What does this word mean, and in which register?"
    correct_option: "please (used in BOTH registers)"
    distractors: ["please (informal only)", "please (formal only)", "thank you"]
    accepted_answers: [{value: "please (used in BOTH registers)", status: correct}]
    feedback: "Polish has no separate formal 'please' -- proszę covers both registers."
  pl.b2.unit05.lesson03.exercise02.listen_czy_mogliby_panstwo:
    instruction: "Listen and select what you hear."
    correct_option: "Could you do this? (formal)"
    distractors: ["Can you do it? (informal)", "Do you want to do it? (informal)", "Would it be possible to do it? (formal)"]
    accepted_answers: [{value: "Could you do this? (formal)", status: correct}]
    feedback: "Czy mogliby Państwo to zrobić? is the formal, polite request -- 'could you do this?'."
  pl.b2.unit05.lesson03.exercise03.match_directness:
    instruction: "Match each form with its meaning and register."
    accepted_answers:
      - value: {"Czy możesz to zrobić?": "Can you do this? (informal, direct)", proszę: please, "Czy mogliby Państwo to zrobić?": "Could you do this? (formal, polite)", "Czy byłoby możliwe, żeby...?": "Would it be possible to...?", zrobić: "to do", pomóc: "to help"}
        status: correct
    feedback: "Informal and direct: Czy możesz. Formal and indirect: Czy mogliby Państwo, Czy byłoby możliwe."
  pl.b2.unit05.lesson03.exercise04.order_czy_mogliby:
    instruction: "Put the words in order, formal and polite: Could you do this?"
    accepted_answers:
      - {value: "Czy mogliby Państwo to zrobić", status: correct}
    feedback: "Czy mogliby Państwo to zrobić? -- the formal register softens the request with the conditional."
  pl.b2.unit05.lesson03.exercise05.translate_czy_mozesz:
    instruction: "Translate into Polish, informal and direct: Can you do this?"
    accepted_answers:
      - {value: "Czy możesz to zrobić", status: correct}
      - {value: "Możesz to zrobić", status: correct}
    feedback: "Czy możesz to zrobić? -- direct is the friendly, normal choice between friends."
  pl.b2.unit05.lesson03.exercise06.translate_czy_byloby_mozliwe:
    instruction: "Translate into Polish, formal and indirect, using czy byłoby możliwe, żeby: Would it be possible to help?"
    accepted_answers:
      - {value: "Czy byłoby możliwe, żeby pomóc", status: correct}
      - {value: "Czy byłoby możliwe, żeby pomóc?", status: correct}
    feedback: "Czy byłoby możliwe, żeby pomóc? -- the formal register goes indirect to sound respectful."
  pl.b2.unit05.lesson03.exercise07.speak_czy_mogliby:
    instruction: "Say aloud in Polish, formal, using czy mogliby Państwo: Could you help?"
    accepted_answers:
      - {value: "Czy mogliby Państwo pomóc", status: correct}
      - {value: "Mogliby Państwo pomóc", status: correct}
      - {value: "Czy Państwo mogliby pomóc", status: correct}
    feedback: "Czy mogliby Państwo pomóc? -- a very common polite, indirect formal frame."

  pl.b2.unit05.lesson04.exercise01.recognize_przelozyc:
    instruction: "What does this word mean?"
    correct_option: "to reschedule / move"
    distractors: ["to cancel", "to confirm", "to attend"]
    accepted_answers: [{value: "to reschedule / move", status: correct}]
    feedback: "Przełożyć means to move an appointment to another time -- to reschedule."
  pl.b2.unit05.lesson04.exercise02.listen_czy_mozemy:
    instruction: "Listen and select what you hear."
    correct_option: "Can we reschedule the appointment? (informal)"
    distractors: ["Would it be possible to reschedule the appointment? (formal)", "Can we cancel the appointment? (informal)", "Do we have an appointment? (informal)"]
    accepted_answers: [{value: "Can we reschedule the appointment? (informal)", status: correct}]
    feedback: "Czy możemy przełożyć spotkanie? is the informal form of the request -- direct, no softening frame."
  pl.b2.unit05.lesson04.exercise03.match_appointment_words:
    instruction: "Match each Polish word or phrase with its meaning."
    accepted_answers:
      - value: {spotkanie: appointment, przełożyć: "to reschedule / move", poniedziałek: Monday, "w przyszłym tygodniu": "next week", mam: "I have", chcę: "I want"}
        status: correct
    feedback: "These are the words the request is built from -- the same content will be wrapped in either register."
  pl.b2.unit05.lesson04.exercise04.order_czy_mozemy:
    instruction: "Put the words in order, informal: Can we reschedule the appointment?"
    accepted_answers:
      - {value: "Czy możemy przełożyć spotkanie", status: correct}
    feedback: "Czy możemy przełożyć spotkanie? -- direct and informal, for a friend."
  pl.b2.unit05.lesson04.exercise05.translate_czy_mozemy:
    instruction: "Translate into Polish, informal (to your friend Ewa): Can we reschedule the appointment?"
    accepted_answers:
      - {value: "Czy możemy przełożyć spotkanie", status: correct}
      - {value: "Możemy przełożyć spotkanie", status: correct}
    feedback: "Czy możemy przełożyć spotkanie? -- direct and informal, for a friend."
  pl.b2.unit05.lesson04.exercise06.translate_czy_byloby_mozliwe_spotkanie:
    instruction: "Translate into Polish, formal (to an office, using czy byłoby możliwe, żeby): Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
      - {value: "Czy byłoby możliwe, żeby przełożyć nasze spotkanie?", status: correct}
    feedback: "Czy byłoby możliwe, żeby przełożyć nasze spotkanie? -- the SAME request, wrapped for an office."
  pl.b2.unit05.lesson04.exercise07.write_nie_moge_poniedzialek:
    instruction: "Write in Polish: I can't on Monday."
    accepted_answers:
      - {value: "Nie mogę w poniedziałek", status: correct}
      - {value: "Nie mogę w poniedziałek.", status: correct}
      - {value: "W poniedziałek nie mogę", status: correct}
    feedback: "Nie mogę w poniedziałek -- present tense, the same in either register."
  pl.b2.unit05.lesson04.exercise08.dictation_czy_mozemy:
    instruction: "Type what you hear."
    correct_response: "Czy możemy przełożyć spotkanie?"
    orthography_strict: true
    feedback: "You heard Czy możemy przełożyć spotkanie? — the informal way to ask to move a meeting."

  pl.b2.unit05.lesson05.exercise01.read_friend:
    instruction: "Which message is written to a close friend?"
    correct_option: "The one that opens 'Cześć Ewo!' and signs off 'Pozdrawiam'."
    distractors: ["The one that opens 'Szanowni Państwo' and signs off 'Z poważaniem'.", "Neither -- both are formal.", "Both are informal."]
    accepted_answers: [{value: "The one that opens 'Cześć Ewo!' and signs off 'Pozdrawiam'.", status: correct}]
    feedback: "Cześć Ewo! and Pozdrawiam are informal -- markers of a message to a friend."
  pl.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to an office/institution?"
    correct_option: "The one that opens 'Szanowni Państwo' and signs off 'Z poważaniem'."
    distractors: ["The one that opens 'Cześć Ewo!' and signs off 'Pozdrawiam'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Szanowni Państwo' and signs off 'Z poważaniem'.", status: correct}]
    feedback: "Szanowni Państwo and Z poważaniem are formal -- markers of a message to an office."
  pl.b2.unit05.lesson05.exercise03.read_same_request:
    instruction: "Both messages make the SAME request. What is it?"
    correct_option: "To reschedule the appointment."
    distractors: ["To cancel the appointment.", "To confirm Monday.", "To ask for directions."]
    accepted_answers: [{value: "To reschedule the appointment.", status: correct}]
    feedback: "Both ask to reschedule (przełożyć spotkanie) -- same content, different register."
  pl.b2.unit05.lesson05.exercise04.read_signal:
    instruction: "Which feature marks the second message as the one for an institution?"
    correct_option: "It uses 'Szanowni Państwo' and 'Czy byłoby możliwe', not 'Cześć' and 'czy możemy'."
    distractors: ["It is shorter.", "It asks about a different day.", "It does not mention the appointment."]
    accepted_answers: [{value: "It uses 'Szanowni Państwo' and 'Czy byłoby możliwe', not 'Cześć' and 'czy możemy'.", status: correct}]
    feedback: "The formal message marks its audience through Szanowni Państwo and the indirect Czy byłoby możliwe frame."
  pl.b2.unit05.lesson05.exercise05.match_register_features:
    instruction: "Match each register feature with what it is."
    accepted_answers:
      - value: {"Cześć Ewo": "informal greeting (to a friend)", "Szanowni Państwo": "formal greeting (to an institution)", Pozdrawiam: "informal-neutral closing", "Z poważaniem": "formal closing", pasować: "to suit / work (for a time)", "przyszły tydzień": "next week"}
        status: correct
    feedback: "The greetings and closings are what most clearly signal who each message is for."
  pl.b2.unit05.lesson05.exercise06.translate_pasowalby:
    instruction: "Translate into Polish, formal, using pasować: Would next week suit?"
    accepted_answers:
      - {value: "Czy pasowałby przyszły tydzień", status: correct}
      - {value: "Pasowałby przyszły tydzień", status: correct}
      - {value: "Czy pasowałby Państwu przyszły tydzień", status: correct}
    feedback: "Czy pasowałby przyszły tydzień? -- pasować is the polite, formal way to propose a new time."
  pl.b2.unit05.lesson05.exercise07.write_moze_przyszly_tydzien:
    instruction: "Write in Polish, informal: Maybe next week?"
    accepted_answers:
      - {value: "Może w przyszłym tygodniu", status: correct}
      - {value: "Może w przyszłym tygodniu?", status: correct}
    feedback: "Może w przyszłym tygodniu? -- the informal way to propose next week to a friend."

  pl.b2.unit05.lesson06.exercise01.comprehend_register_fit:
    instruction: "How does Marek address Ewa, and does that register fit the situation?"
    correct_option: "Informally, with 'ty' -- and it fits, because Ewa is a close friend."
    distractors: ["Formally, with 'Państwo' -- and it fits, because she is a stranger.", "Informally, with 'ty' -- but it does not fit; he should use 'Państwo'.", "Formally, with 'Państwo' -- but it does not fit; he should use 'ty'."]
    accepted_answers: [{value: "Informally, with 'ty' -- and it fits, because Ewa is a close friend.", status: correct}]
    feedback: "Marek uses the informal ty with Ewa, which is exactly right for a friend -- the register fits the audience."
  pl.b2.unit05.lesson06.exercise02.comprehend_mismatch:
    instruction: "What would it signal if Marek wrote to the urząd in the SAME informal way he talks to Ewa?"
    correct_option: "It would come across as too casual and disrespectful for an office."
    distractors: ["It would come across as more efficient and clear.", "It would come across as too formal and distant.", "It would make no difference at all."]
    accepted_answers: [{value: "It would come across as too casual and disrespectful for an office.", status: correct}]
    feedback: "As Ewa says, 'do urzędu piszesz oczywiście inaczej' -- informal register with an office reads as too casual."
  pl.b2.unit05.lesson06.exercise03.comprehend_request:
    instruction: "What does Marek want to do?"
    correct_option: "Reschedule the appointment."
    distractors: ["Cancel the appointment for good.", "Meet Ewa on Monday after all.", "Complain to the office."]
    accepted_answers: [{value: "Reschedule the appointment.", status: correct}]
    feedback: "Marek asks 'czy możemy przełożyć spotkanie?' -- he wants to reschedule."
  pl.b2.unit05.lesson06.exercise04.speak_informal:
    instruction: "Say aloud in Polish the SAME request, first to your friend Ewa -- informal: Can you reschedule the appointment?"
    accepted_answers:
      - {value: "Czy możesz przełożyć spotkanie", status: correct}
      - {value: "Możesz przełożyć spotkanie", status: correct}
    feedback: "Czy możesz przełożyć spotkanie? -- direct and informal, the right register for Ewa."
  pl.b2.unit05.lesson06.exercise05.speak_formal:
    instruction: "Now say aloud in Polish the SAME request to an office -- formal: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
    feedback: "Czy byłoby możliwe, żeby przełożyć nasze spotkanie? -- indirect and formal, the right register for an office."
  pl.b2.unit05.lesson06.exercise06.write_rewrite_formal:
    instruction: "Rewrite this informal message to Ewa as a FORMAL one to an office. Informal: 'Cześć Ewo, czy możemy przełożyć spotkanie?' Write the formal version as two parts: the salutation Szanowni Państwo, then the request using Czy byłoby możliwe, żeby."
    accepted_answers:
      - {value: "Szanowni Państwo, Czy byłoby możliwe, żeby przełożyć nasze spotkanie?", status: correct}
      - {value: "Szanowni Państwo, Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
      - {value: "Szanowni Państwo Czy byłoby możliwe, żeby przełożyć nasze spotkanie?", status: correct}
      - {value: "Szanowni Państwo Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
      - {value: "Szanowni Państwo, czy byłoby możliwe, żeby przełożyć spotkanie?", status: correct}
      - {value: "Szanowni Państwo, czy byłoby możliwe, żeby przełożyć to spotkanie?", status: correct}
    feedback: "The formal rewrite swaps 'Cześć Ewo' for 'Szanowni Państwo' and the direct question for the indirect 'Czy byłoby możliwe, żeby przełożyć nasze spotkanie?'."
  pl.b2.unit05.lesson06.exercise07.write_both_registers:
    instruction: "Write the SAME request TWICE. (1) informally to your friend Ewa, using czy możesz: Can you reschedule the appointment? (2) formally to an office, using czy byłoby możliwe, żeby: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Czy możesz przełożyć spotkanie? Czy byłoby możliwe, żeby przełożyć nasze spotkanie?", status: correct}
      - {value: "Czy możesz przełożyć spotkanie? Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
      - {value: "Czy możesz przełożyć spotkanie Czy byłoby możliwe, żeby przełożyć nasze spotkanie?", status: correct}
      - {value: "Czy możesz przełożyć spotkanie Czy byłoby możliwe, żeby przełożyć nasze spotkanie", status: correct}
    feedback: "Same request, two registers: informal 'Czy możesz przełożyć spotkanie?' for Ewa, formal 'Czy byłoby możliwe, żeby przełożyć nasze spotkanie?' for an office."
