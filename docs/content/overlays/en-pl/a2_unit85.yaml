teaching:
  pl.a2.unit85.lesson01.teach.pogoda: {"title": "Tomorrow's weather", "gloss": "nice weather / it will rain / it will be warm / it will be cold", "note": "*Będzie* is the future of *być*. *Będzie padać* is the future of an ongoing action: it will be raining.", "example_gloss": ["Tomorrow the weather will be nice.", "Tomorrow it will rain.", "Tomorrow it will be warm.", "Tomorrow it will be cold."]}
  pl.a2.unit85.lesson01.teach.plany: {"title": "Plans", "gloss": "we will go to the park / we will stay at home / we will go to the sea / I will cook dinner", "note": "These are future forms; the first three are for 'we', the last is for 'I'.", "example_gloss": ["We will go to the park.", "We will stay at home.", "We will go to the sea.", "I will cook dinner."]}
  pl.a2.unit85.lesson01.teach.gn_jesli: {"title": "Jeśli: if", "gloss": "If the weather is nice, we will go to the park. If it rains, we will stay at home.", "note": "*Jeśli* means 'if' for something that may really happen. Both parts are in the future: *będzie*, *pójdziemy*. English uses the present after 'if', but Polish does not."}
  pl.a2.unit85.lesson01.teach.gn_cieplo: {"title": "More conditions", "gloss": "If it is warm tomorrow, we will go to the sea. If it is cold tomorrow, I will cook dinner.", "note": "The time word, such as *jutro*, can stand after *jeśli*."}
  pl.a2.unit85.lesson01.teach.gn_druga: {"title": "Condition second", "gloss": "We will go to the park if the weather is nice. We will stay at home if it rains.", "note": "The *jeśli* clause can come second. The words do not change."}
  pl.a2.unit85.lesson02.teach.ludzie: {"title": "Single events", "gloss": "he will come / you will call / I will come / I will stay", "note": "These are perfective verbs: they look like the present but name one action in the future.", "example_gloss": ["Marek will come.", "You will call me.", "I will come at six.", "I will stay at home."]}
  pl.a2.unit85.lesson02.teach.gn_przyszly: {"title": "Jeśli + a single event", "gloss": "If Marek comes, I will cook dinner. If you call me, I will come.", "note": "For a single event, use the perfective future form after *jeśli*: *przyjdzie*, *zadzwonisz*. It looks like the present but refers to later."}
  pl.a2.unit85.lesson02.teach.gn_nie: {"title": "Jeśli nie", "gloss": "If you do not call, I will not come. If Marek does not come, I will stay at home.", "note": "Put *nie* right before the verb. The result keeps its own form."}
  pl.a2.unit85.lesson02.teach.gn_miec: {"title": "Będziesz miał / miała", "gloss": "If you have time (man), you will call me. If you have time (woman), you will write to me.", "note": "For a state, such as having time, use *będę*, *będziesz* + the past-looking form: *miał* for a man, *miała* for a woman."}
  pl.a2.unit85.lesson03.teach.slowa: {"title": "Small words", "gloss": "if (everyday) / when / if not", "note": "In speech *jak* often replaces *jeśli*. *Kiedy* means 'when' for something sure to happen.", "example_gloss": ["If it rains, I will stay at home.", "When it is warm, we will go to the sea.", "If it does not rain, we will go to the park."]}
  pl.a2.unit85.lesson03.teach.gn_jak: {"title": "Jak = jeśli", "gloss": "If it rains, I will stay at home. If I have time (man), I will call Marek.", "note": "In everyday talk *jak* works like *jeśli*. *Jeśli* is safer in writing."}
  pl.a2.unit85.lesson03.teach.gn_kiedy: {"title": "Kiedy or jeśli", "gloss": "When it is warm, we will go to the sea. If it is warm, we will go to the sea.", "note": "With *kiedy* the speaker is sure it will happen. With *jeśli* it may or may not."}
  pl.a2.unit85.lesson03.teach.gn_nie: {"title": "Jeśli nie będzie", "gloss": "If it does not rain, we will go to the park. If I have no time (man), I will write.", "note": "Put *nie* before *będzie*. After *nie będę miał* the object is in the genitive: *czasu*."}
  pl.a2.unit85.lesson04.teach.rozkazy: {"title": "Commands", "gloss": "rest / stay / call / write / come (to one person)", "note": "These perfective commands are addressed to one person.", "example_gloss": ["You are tired, rest.", "Stay at home.", "Call Marek.", "Write to me.", "Come tomorrow."]}
  pl.a2.unit85.lesson04.teach.gn_rozkaz: {"title": "Jeśli + present + command", "gloss": "If you are tired, rest. If you are ill, stay at home.", "note": "When the condition is true now, use the present after *jeśli*. The result can be a command."}
  pl.a2.unit85.lesson04.teach.gn_nie_mozesz: {"title": "Advice with jeśli", "gloss": "If you cannot come, call. If you have time, write to me.", "note": "This pattern gives simple instructions: condition, comma, command."}
  pl.a2.unit85.lesson04.teach.gn_chcesz: {"title": "Jeśli chcesz", "gloss": "If you like, come tomorrow.", "note": "*Jeśli chcesz* is a polite way to offer a choice."}
  pl.a2.unit85.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "on Saturday / with Marek / to him", "note": "*Z Markiem* means 'with Marek' (instrumental). *Do niego* means 'to him'.", "example_gloss": ["On Saturday I will go to the park.", "I will go with Marek.", "I will write to him."]}
  pl.a2.unit85.lesson05.teach.gn_ewa: {"title": "Plan A", "gloss": "On Saturday, if the weather is nice, I will go to the park with Marek.", "note": "Ewa puts the day first, then the condition."}
  pl.a2.unit85.lesson05.teach.gn_ewa2: {"title": "Plan C", "gloss": "If Marek does not call, I will write to him.", "note": "The condition and the result are both future."}
  pl.a2.unit85.lesson05.teach.lectura: {"title": "Ewa's plans", "gloss": "On Saturday, if the weather is nice, I will go to the park with Marek. If it rains, we will stay at home and I will cook dinner. If Marek does not call, I will write to him.", "note": "Ewa makes plans for different situations, with a condition for each.", "glosses": {"jeśli": "if", "będzie": "there will be", "zostaniemy": "we will stay", "napiszę": "I will write"}}
  pl.a2.unit85.lesson06.teach.d1: {"title": "Marek asks", "gloss": "Marek: Hi, Ewa. What are you doing on Saturday?"}
  pl.a2.unit85.lesson06.teach.d2: {"title": "Ewa plans", "gloss": "Ewa: If the weather is nice, I will go to the park."}
  pl.a2.unit85.lesson06.teach.d3: {"title": "Marek asks more", "gloss": "Marek: And if it rains?"}
  pl.a2.unit85.lesson06.teach.d4: {"title": "Ewa invites", "gloss": "Ewa: I will stay at home and cook dinner. If you like, come."}
  pl.a2.unit85.lesson06.teach.d5: {"title": "Marek answers", "gloss": "Marek: Gladly! If I have time, I will come at six."}
  pl.a2.unit85.lesson06.teach.d6: {"title": "Ewa ends", "gloss": "Ewa: Good. If you do not come, I will call."}
