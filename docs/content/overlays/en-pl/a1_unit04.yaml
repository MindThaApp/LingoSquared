answer_policy:
  diacritics: >-
    Same standing policy as unit01/unit02/unit03: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit04.time:
    title: "Czas i godziny"

lessons:
  pl.a1.unit04.lesson01.ktora_godzina:
    title: "Która godzina?"
  pl.a1.unit04.lesson02.o_ktorej_godzinie:
    title: "O której godzinie"
  pl.a1.unit04.lesson03.ustalamy_godzine_spotkania:
    title: "Ustalamy godzinę spotkania"

teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: "One, two, three o'clock"
    gloss: "one o'clock; two o'clock; three o'clock"
    note: >-
      Polish tells time with feminine ordinal numbers, agreeing with the
      unspoken feminine noun *godzina* (hour) -- *pierwsza* literally
      means "the first (hour)."
    example_gloss:
      - "It's one o'clock."
      - "It's two o'clock."
      - "It's three o'clock."

  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: "Four, five, six o'clock"
    gloss: "four o'clock; five o'clock; six o'clock"
    note: "Same feminine ordinal pattern as *pierwsza*, *druga*, *trzecia*."
    example_gloss:
      - "It's four o'clock."
      - "It's five o'clock."
      - "It's six o'clock."

  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: "Seven, eight, nine o'clock"
    gloss: "seven o'clock; eight o'clock; nine o'clock"
    note: "The middle three of the twelve hours, same pattern."
    example_gloss:
      - "It's seven o'clock."
      - "It's eight o'clock."
      - "It's nine o'clock."

  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: "Ten, eleven, twelve o'clock"
    gloss: "ten o'clock; eleven o'clock; twelve o'clock"
    note: "The last three hours, completing the full 1-12 set."
    example_gloss:
      - "It's ten o'clock."
      - "It's eleven o'clock."
      - "It's twelve o'clock."

  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: "Asking the time"
    gloss: "What time is it?"
    note: >-
      Literally "which is the hour?" -- *która* agrees with the feminine
      *godzina*, the same agreement pattern you'll see throughout this
      unit.

  pl.a1.unit04.lesson01.teach.godzina_note:
    title: "Godzina is feminine"
    gloss: "We say pierwsza, druga, trzecia -- not pierwszy, drugi, trzeci."
    note: >-
      *Pierwszy*, *drugi*, *trzeci* are the masculine forms of these same
      ordinal numbers, used for masculine nouns elsewhere in Polish --
      but never for telling time, since *godzina* is feminine.

  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: "Morning, noon, afternoon"
    gloss: "in the morning; at noon; in the afternoon"
    note: >-
      *Rano* stands alone (no preposition); *w południe* and *po
      południu* each keep their own fixed preposition -- these three are
      worth memorizing as set phrases rather than working out from a
      general rule.
    example_gloss:
      - "In the morning I drink coffee."
      - "I eat lunch at noon."
      - "I work in the afternoon."

  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: "Evening, night"
    gloss: "in the evening; at night"
    note: >-
      *Wieczorem* is a fixed adverbial form (no preposition needed); *w
      nocy* pairs *w* with the locative of *noc* (night).
    example_gloss:
      - "In the evening I watch TV."
      - "At night I sleep."

  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: "Asking at what time"
    gloss: "At what time?"
    note: >-
      Use this instead of *Która jest godzina?* when asking when
      something will happen, rather than what time it is right now.

  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: "Saying 'at' an hour"
    gloss: "Four, seven, ten o'clock -- but at four, at seven, at ten o'clock."
    note: >-
      After *o* ("at"), the hour word's final *-a* becomes *-ej*: *czwarta* →
      *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*.
      Every hour follows this same pattern; the one spelling wrinkle is
      *druga* → *o drugiej*, which adds an *i* after the *g*.

  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: "Ewa gets up early"
    gloss: "Ewa gets up at 7 in the morning."
    note: "*Wstaje* is the third-person singular of *wstawać* (to get up)."

  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: "The train's departure time"
    gloss: "The train departs at 4 in the afternoon."
    note: "*Odjeżdża* is the third-person singular of *odjeżdżać* (to depart)."

  pl.a1.unit04.lesson03.teach.spotkanie:
    title: "Meeting"
    gloss: "meeting"
    note: "The same word you met in unit 3 (*Kiedy jest spotkanie?*), when Ewa and Marek agreed on a day and date to meet again."
    example_gloss: "The meeting is on Friday."

  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: "Asking what time to meet"
    gloss: "At what time can we meet on Friday, May 15th?"
    note: >-
      Combines this unit's *o której godzinie* with unit 3's day and date
      -- Ewa and Marek already agreed on Friday, May 15th, and now need
      to fix an exact time.

  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: "Proposing a time"
    gloss: "Maybe at 4 in the afternoon?"
    note: "*Może* on its own means \"maybe\" -- a natural, soft way to float a suggested time."

  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: "Confirming a time works"
    gloss: "4 in the afternoon works for me."
    note: >-
      Same *[time] + mi + odpowiada* pattern as unit 3's *Piątek mi
      odpowiada* -- the time itself is the grammatical subject, and
      *odpowiadać* always takes its person in the dative (*mi*, "for
      me").

  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: "Confirming the full plan"
    gloss: "See you May 15th at 4!"
    note: "Reuses unit 1's farewell *Do zobaczenia*, now combined with both a date and a time."

  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: "Ewa asks for a time"
    gloss: "Ewa asks Marek what time they can meet on Friday, May 15th."
    note: "Reuses this lesson's opening question exactly."
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: "Marek proposes 4pm"
    gloss: "Marek suggests 4 in the afternoon."
    note: "A soft suggestion, not a firm statement -- that's what *może* signals."
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: "Ewa confirms"
    gloss: "Ewa says 4 in the afternoon works for her."
    note: "The same dative construction as unit 3's Friday-works-for-me exchange."
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: "Marek closes the plan"
    gloss: "Marek says great, and see you May 15th at 4!"
    note: "*Świetnie* reuses unit 3's exclamation of enthusiasm."
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: "Ewa says goodbye"
    gloss: "Ewa says goodbye back."
    note: "The shortest possible closing -- just the farewell itself."

exercises:
  pl.a1.unit04.lesson01.exercise01.select_trzecia:
    instruction: "Which word means three o'clock?"
    correct_option: "trzecia"
    distractors: ["pierwsza", "piąta"]
    accepted_answers: ["trzecia"]

  pl.a1.unit04.lesson01.exercise02.select_siodma:
    instruction: "Which word means seven o'clock?"
    correct_option: "siódma"
    distractors: ["szósta", "ósma"]
    accepted_answers: ["siódma"]

  pl.a1.unit04.lesson01.exercise03.select_dwunasta:
    instruction: "Which word means twelve o'clock?"
    correct_option: "dwunasta"
    distractors: ["dziesiąta", "jedenasta"]
    accepted_answers: ["dwunasta"]

  pl.a1.unit04.lesson01.exercise04.match_hours:
    instruction: "Match each Polish hour word to its English meaning."
    correct_response:
      "pierwsza": "one o'clock"
      "druga": "two o'clock"
      "trzecia": "three o'clock"
      "czwarta": "four o'clock"
      "piąta": "five o'clock"
      "szósta": "six o'clock"
      "siódma": "seven o'clock"
      "ósma": "eight o'clock"
      "dziewiąta": "nine o'clock"
      "dziesiąta": "ten o'clock"
      "jedenasta": "eleven o'clock"
      "dwunasta": "twelve o'clock"

  pl.a1.unit04.lesson01.exercise05.order_time_question:
    instruction: "Put the question 'What time is it?' in order."
    correct_response: ["Która", "jest", "godzina"]

  pl.a1.unit04.lesson01.exercise06.order_its_three:
    instruction: "Put the sentence 'It's three o'clock' in order."
    correct_response: ["Jest", "trzecia"]

  pl.a1.unit04.lesson01.exercise07.fill_current_time:
    instruction: "Complete the sentence to say 'It's five o'clock.'"
    accepted_answers: ["piąta"]
    feedback: "Jest piąta -- it's five o'clock."

  pl.a1.unit04.lesson01.exercise08.fix_hour_gender:
    instruction: "Fix the ending -- godzina is feminine, so the number needs the feminine form."
    accepted_answers:
      - "Jest piąta."
      - "Jest piąta"
    feedback: "Jest piąta, not Jest piąty -- godzina is feminine, so every hour number takes the feminine ending."

  pl.a1.unit04.lesson01.exercise09.speak_hours:
    instruction: "Name the hours from one to twelve, out loud."
    accepted_answers:
      - "Pierwsza, druga, trzecia, czwarta, piąta, szósta, siódma, ósma, dziewiąta, dziesiąta, jedenasta, dwunasta."
      - "pierwsza druga trzecia czwarta piąta szósta siódma ósma dziewiąta dziesiąta jedenasta dwunasta"

  pl.a1.unit04.lesson02.exercise01.select_rano:
    instruction: "Which word means 'in the morning'?"
    correct_option: "rano"
    distractors: ["wieczorem", "w nocy"]
    accepted_answers: ["rano"]

  pl.a1.unit04.lesson02.exercise02.select_wieczorem:
    instruction: "Which word means 'in the evening'?"
    correct_option: "wieczorem"
    distractors: ["rano", "w południe"]
    accepted_answers: ["wieczorem"]

  pl.a1.unit04.lesson02.exercise03.match_times_of_day:
    instruction: "Match each Polish time expression to its English meaning."
    correct_response:
      "rano": "in the morning"
      "w południe": "at noon"
      "po południu": "in the afternoon"
      "wieczorem": "in the evening"
      "w nocy": "at night"
      "o czwartej": "at four o'clock"
      "o siódmej": "at seven o'clock"

  pl.a1.unit04.lesson02.exercise04.order_at_what_time:
    instruction: "Put the question 'At what time?' in order."
    correct_response: ["O", "której", "godzinie"]

  pl.a1.unit04.lesson02.exercise05.order_ewa_wakes:
    instruction: "Put the sentence 'Ewa gets up at 7 in the morning' in order."
    accepted_answers:
      - ["Ewa", "wstaje", "o", "siódmej", "rano"]
      - ["Ewa", "wstaje", "rano", "o", "siódmej"]
      - ["Rano", "Ewa", "wstaje", "o", "siódmej"]

  pl.a1.unit04.lesson02.exercise06.fill_train_time:
    instruction: "Complete the sentence to say the train departs at 4 in the afternoon."
    accepted_answers: ["czwartej"]
    feedback: "Pociąg odjeżdża o czwartej po południu -- the train departs at 4 in the afternoon."

  pl.a1.unit04.lesson02.exercise07.fix_locative_hour:
    instruction: "Fix the hour -- after 'o' (at), the hour needs the -ej ending."
    accepted_answers:
      - "Pociąg odjeżdża o czwartej po południu."
      - "Pociąg odjeżdża o czwartej po południu"
    feedback: "Pociąg odjeżdża o czwartej po południu -- czwarta becomes czwartej after o."

  pl.a1.unit04.lesson02.exercise08.reply_train_time:
    instruction: "Answer that the train departs at 4 in the afternoon."
    accepted_answers:
      - "Pociąg odjeżdża o czwartej po południu."
      - "Pociąg odjeżdża o czwartej po południu"
      - "Odjeżdża o czwartej po południu."
      - "O czwartej po południu."
      - "Pociąg odjeżdża o czwartej."

  pl.a1.unit04.lesson02.exercise09.speak_ewa_wakes:
    instruction: "Say what time Ewa gets up."
    accepted_answers:
      - "Ewa wstaje o siódmej rano."
      - "Ewa wstaje o siódmej rano"
      - "Ewa wstaje o siódmej."
      - "Ewa wstaje rano o siódmej."
      - "O siódmej rano."

  pl.a1.unit04.lesson03.exercise01.select_time_question:
    instruction: "Which question asks what time Ewa and Marek can meet on Friday, May 15th?"
    correct_option: "O której godzinie możemy się spotkać w piątek, piętnastego maja?"
    distractors: ["Kiedy są twoje urodziny?", "Jaki dziś jest dzień tygodnia?"]
    accepted_answers:
      - "O której godzinie możemy się spotkać w piątek, piętnastego maja?"
      - "O której godzinie możemy się spotkać w piątek, piętnastego maja"

  pl.a1.unit04.lesson03.exercise02.select_time_proposal:
    instruction: "Which line is Marek's suggested time?"
    correct_option: "Może o czwartej po południu?"
    distractors: ["Ewa wstaje o siódmej rano.", "Pociąg odjeżdża o czwartej po południu."]
    accepted_answers: ["Może o czwartej po południu?", "Może o czwartej po południu"]

  pl.a1.unit04.lesson03.exercise03.comprehend_agreed_time:
    instruction: "Read the line. What time did Ewa agree to?"
    correct_option: "4 PM"
    distractors:
      - "7 AM"
      - "3 PM"
    accepted_answers:
      - "4 PM"
      - "czwartej po południu"

  pl.a1.unit04.lesson03.exercise04.comprehend_agreed_date:
    instruction: "Read the line. What date will Ewa and Marek meet?"
    correct_option: "May 15th"
    distractors:
      - "May 10th"
      - "May 5th"
    accepted_answers:
      - "May 15th"
      - "piętnastego maja"

  pl.a1.unit04.lesson03.exercise05.match_time_questions_and_answers:
    instruction: "Match each question with its natural answer."
    correct_response:
      "Która jest godzina?": "Jest trzecia."
      "O której godzinie wstaje Ewa?": "Ewa wstaje o siódmej rano."
      "O której godzinie odjeżdża pociąg?": "Pociąg odjeżdża o czwartej po południu."
      "O której godzinie jest spotkanie?": "Spotkanie jest o czwartej po południu."
      "Może o czwartej po południu?": "Czwarta po południu mi odpowiada."

  pl.a1.unit04.lesson03.exercise06.order_meeting_time_question:
    instruction: "Put the question 'At what time can we meet on Friday?' in order."
    accepted_answers:
      - ["O", "której", "godzinie", "możemy", "się", "spotkać", "w", "piątek"]
      - ["O", "której", "godzinie", "w", "piątek", "możemy", "się", "spotkać"]
      - ["W", "piątek", "o", "której", "godzinie", "możemy", "się", "spotkać"]

  pl.a1.unit04.lesson03.exercise07.order_train_departure:
    instruction: "Put the sentence 'The train departs at 4 in the afternoon' in order."
    accepted_answers:
      - ["Pociąg", "odjeżdża", "o", "czwartej", "po", "południu"]
      - ["Pociąg", "odjeżdża", "po", "południu", "o", "czwartej"]
      - ["O", "czwartej", "po", "południu", "pociąg", "odjeżdża"]

  pl.a1.unit04.lesson03.exercise08.fill_suits_me:
    instruction: "Complete the sentence -- say that the time works for you."
    accepted_answers: ["odpowiada"]
    feedback: "Czwarta po południu mi odpowiada -- 4 in the afternoon works for me."

  pl.a1.unit04.lesson03.exercise09.fix_verb_agreement:
    instruction: "Fix the verb -- the subject is 'czwarta' (third person), not 'I'."
    accepted_answers:
      - "Czwarta po południu mi odpowiada."
      - "Czwarta po południu mi odpowiada"
    feedback: "Czwarta po południu mi odpowiada, not odpowiadam -- the hour itself is the subject, so the verb needs the third-person form."

  pl.a1.unit04.lesson03.exercise10.reply_confirm_time:
    instruction: "Answer that 4 in the afternoon works for you."
    accepted_answers:
      - "Czwarta po południu mi odpowiada."
      - "Czwarta po południu mi odpowiada"
      - "Tak, czwarta po południu mi odpowiada."
      - "Czwarta mi odpowiada."
      - "Tak, czwarta mi odpowiada."

  pl.a1.unit04.lesson03.exercise11.speak_marek_proposal:
    instruction: "Take Marek's role and suggest 4 in the afternoon."
    accepted_answers:
      - "Może o czwartej po południu?"
      - "Może o czwartej po południu"
      - "Może o czwartej?"
