answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit76.prognoza_i_obietnice: {"title": "Tomorrow It Will Rain", "description": "Predict the weather and plans with the Polish future, say what will probably happen, and make a simple promise."}
lessons:
  pl.a2.unit76.lesson01.bedzie_padac: {"title": "It Will Rain"}
  pl.a2.unit76.lesson02.zadzwonie: {"title": "I Will Call"}
  pl.a2.unit76.lesson03.pisac_czy_napisac: {"title": "Will Be Writing or Will Write"}
  pl.a2.unit76.lesson04.wezme_parasol: {"title": "I Will Take an Umbrella"}
  pl.a2.unit76.lesson05.prognoza_marka: {"title": "Marek's Forecast"}
  pl.a2.unit76.lesson06.ewa_i_marek: {"title": "Ewa and Marek Talk"}
teaching:
  pl.a2.unit76.lesson01.teach.pogoda: {"title": "Weather words", "gloss": "weather / rain / sun / to fall (rain) / to shine / cold / warm", "note": "These words describe the weather. *Padać* is used for rain: *pada deszcz* or just *pada*.", "example_gloss": ["Today it is raining.", "Today the sun is shining.", "Today it is cold.", "Today it is warm."]}
  pl.a2.unit76.lesson01.teach.gn_bede: {"title": "The future of być", "gloss": "I will be, you will be, he will be, she will be, we will be, they will be", "note": "These are the future forms of *być*. With another verb they make the imperfective future: *będę* plus the infinitive."}
  pl.a2.unit76.lesson01.teach.gn_pogoda: {"title": "Weather in the future", "gloss": "Tomorrow it will rain. Tomorrow rain will fall. The sun will shine. It will be cold. It will be warm.", "note": "For the weather Polish uses *będzie*: *będzie* plus an infinitive (*padać*, *świecić*) or plus an adverb (*zimno*, *ciepło*)."}
  pl.a2.unit76.lesson01.teach.czas: {"title": "When?", "gloss": "tomorrow / today / on Saturday / on Sunday / in the evening / in the morning", "note": "*W sobotę* and *w niedzielę* answer the question 'when?'. *A* here means 'and' or 'but' in a contrast.", "example_gloss": ["Tomorrow it will rain.", "On Saturday it will be cold, and on Sunday it will be warm.", "In the evening it will be warm.", "In the morning the sun will shine."]}
  pl.a2.unit76.lesson01.teach.czynnosci: {"title": "Things people will be doing", "gloss": "to wait / to read / to write / to sleep / at home / message", "note": "With people, *będę*, *będziesz*, *będzie* and *będziemy* change with the person; the verb stays in the infinitive.", "example_gloss": ["I will wait at home.", "Marek will be reading.", "Ewa will be sleeping.", "We will be writing a message."]}
  pl.a2.unit76.lesson01.teach.frazy1: {"title": "Short phrases", "gloss": "Tomorrow it will rain. It will be cold. I will wait."}
  pl.a2.unit76.lesson02.teach.dokonane: {"title": "Verbs for one finished action", "gloss": "to call / to buy / to write / to do, make / to come / to come back", "note": "These verbs name one action that will be completed. *Bilet* is a ticket.", "example_gloss": ["Tomorrow I will call.", "I will buy a ticket.", "I will write a message.", "I will come back in the evening.", "I will come on Saturday."]}
  pl.a2.unit76.lesson02.teach.gn_dokonane: {"title": "One finished action: the I-form", "gloss": "to call, I will call. to buy, I will buy. to write, I will write. to do, I will do. to come, I will come. to come back, I will come back", "note": "These verbs have no *będę* future. Their present-looking forms already mean the future: *zadzwonię* is 'I will call (and finish the call)'. Never say *będę zadzwonię*."}
  pl.a2.unit76.lesson02.teach.gn_osoby: {"title": "Other persons", "gloss": "I will call. Will you call? Ewa will call. We will call.", "note": "The endings follow the present tense: -ę, -isz, -i, -imy. The meaning stays future and completed."}
  pl.a2.unit76.lesson02.teach.obietnica: {"title": "Promising", "gloss": "I promise / certainly / don't worry / to be late", "note": "A promise is *Obiecuję, że* plus the finished-action future. *Nie martw się* is said to one friend.", "example_gloss": ["I promise that I will call.", "I promise that I will not be late.", "I will certainly come.", "Don't worry, I will buy a ticket."]}
  pl.a2.unit76.lesson02.teach.frazy2: {"title": "Promises", "gloss": "I promise. I will certainly come back. Don't worry."}
  pl.a2.unit76.lesson03.teach.pewnosc: {"title": "How sure are you?", "gloss": "certainly / probably / maybe", "note": "These words say how sure you are: *na pewno* is sure, *prawdopodobnie* is likely, *może* is possible.", "example_gloss": ["It will certainly rain.", "It will probably be cold.", "Maybe the sun will shine.", "Maybe I will call."]}
  pl.a2.unit76.lesson03.teach.kontekst: {"title": "Time frames", "gloss": "at eight in the evening / by the evening / all day", "note": "*O ósmej wieczorem* and *cały dzień* describe a time during which something goes on. *Do wieczora* sets a deadline for a finished action.", "example_gloss": ["At eight in the evening I will be writing a message.", "By the evening I will write the message.", "I will be waiting all day.", "By the evening I will buy a ticket."]}
  pl.a2.unit76.lesson03.teach.gn_aspekt: {"title": "Will be doing or will do", "gloss": "I will be writing a message. I will write the message (and finish it).", "note": "*Będę pisać* shows the action in progress. *Napiszę* shows one finished action with a result."}
  pl.a2.unit76.lesson03.teach.gn_kontekst: {"title": "The time frame decides", "gloss": "I will be writing all day. By the evening I will write the message.", "note": "A time during which something goes on needs *będę* plus the infinitive. A deadline or a result needs the finished-action form."}
  pl.a2.unit76.lesson03.teach.gn_pewnosc: {"title": "Certainty words", "gloss": "It will certainly rain. It will probably be cold. Maybe it will be warm.", "note": "The certainty word usually comes right before the verb or at the start of the sentence."}
  pl.a2.unit76.lesson03.teach.frazy3: {"title": "Short phrases", "gloss": "I will certainly write. Maybe I will call. I will probably be waiting."}
  pl.a2.unit76.lesson04.teach.weekend: {"title": "The weekend trip", "gloss": "weekend / trip / train / umbrella / jacket / Kraków / to Kraków / by train", "note": "*Do Krakowa* means 'to Kraków'; *pociągiem* means 'by train'.", "example_gloss": ["There will be a trip at the weekend.", "I will buy a ticket for the train to Kraków.", "We will go by train.", "I will take an umbrella and a jacket."]}
  pl.a2.unit76.lesson04.teach.plany: {"title": "Verbs for plans", "gloss": "to take / I will take / to go (by vehicle) / we will go / but", "note": "*Wezmę* and *pojedziemy* are finished-action futures, like *kupię*.", "example_gloss": ["I will take an umbrella.", "I will take a jacket.", "On Saturday we will go to Kraków.", "It will rain, but I will take an umbrella."]}
  pl.a2.unit76.lesson04.teach.gn_wzorzec: {"title": "Prediction, then plan", "gloss": "It will certainly rain. I will take an umbrella. Maybe it will be cold. I will take a jacket.", "note": "A prediction uses *będzie*; the plan or promise that follows uses the finished-action I-form."}
  pl.a2.unit76.lesson04.teach.gn_my: {"title": "We-forms", "gloss": "We will go. We will call. We will buy a ticket. We will come back in the evening.", "note": "The we-form ends in -my. It is a finished-action future, like the I-form."}
  pl.a2.unit76.lesson04.teach.frazy4: {"title": "Short phrases", "gloss": "Don't worry. We will certainly go."}
  pl.a2.unit76.lesson05.teach.prognoza: {"title": "The forecast", "gloss": "forecast / I read, I am reading / hi / and / for the weekend", "note": "*Prognozę* is the form of *prognoza* after *czytam*.", "example_gloss": ["I am reading the forecast for the weekend.", "Hi, Ewa.", "It will rain and it will be cold."]}
  pl.a2.unit76.lesson05.teach.gn_na: {"title": "Na for what something is meant for", "gloss": "The forecast for the weekend. The forecast for Sunday. A ticket for the train.", "note": "*Na* shows what a forecast or ticket is for. Feminine nouns change -a to -ę after it: *niedziela*, *niedzielę*."}
  pl.a2.unit76.lesson05.teach.frazy5: {"title": "Marek's phrases", "gloss": "Don't worry. By the evening I will call."}
  pl.a2.unit76.lesson05.teach.lectura: {"title": "Marek writes to Ewa", "gloss": "Hi, Ewa. I am reading the forecast for the weekend. On Saturday it will probably rain and be cold. On Sunday the sun will certainly shine. Maybe it will be warm. Don't worry, the trip will happen. I promise that I will buy a ticket for the train and take an umbrella. By the evening I will call.", "note": "Marek predicts with *prawdopodobnie*, *na pewno* and *może* and then makes promises with finished-action verbs.", "glosses": {"prognozę": "forecast", "wycieczka": "trip", "parasol": "umbrella", "bilet": "ticket"}}
  pl.a2.unit76.lesson06.teach.d1: {"title": "Ewa is worried", "gloss": "Ewa: I'm worried about the trip. Will it rain tomorrow?"}
  pl.a2.unit76.lesson06.teach.d2: {"title": "Marek predicts", "gloss": "Marek: Probably yes, but on Sunday the sun will certainly shine."}
  pl.a2.unit76.lesson06.teach.d3: {"title": "Ewa asks about the ticket", "gloss": "Ewa: And the ticket? Will you buy a ticket for the train?"}
  pl.a2.unit76.lesson06.teach.d4: {"title": "Marek reassures her", "gloss": "Marek: Don't worry, I will buy the ticket by the evening."}
  pl.a2.unit76.lesson06.teach.d5: {"title": "Ewa asks for a promise", "gloss": "Ewa: Do you promise that you will call in the evening?"}
  pl.a2.unit76.lesson06.teach.d6: {"title": "Marek promises", "gloss": "Marek: I promise. I will call in the evening and take an umbrella."}
exercises:
  pl.a2.unit76.lesson01.exercise01.elige_padac: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Jutro będzie padać.", "distractors": ["Jutro jest padać.", "Jutro będzie pada.", "Jutro będziemy padać."], "accepted_answers": [{"value": "Jutro będzie padać.", "status": "correct"}], "feedback": "For the weather use *będzie* plus the infinitive: *będzie padać*."}
  pl.a2.unit76.lesson01.exercise02.elige_czekac: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Będę czekać w domu.", "distractors": ["Będzie czekać w domu.", "Będę czeka w domu.", "Jestem czekać w domu."], "accepted_answers": [{"value": "Będę czekać w domu.", "status": "correct"}], "feedback": "*Będę* plus the infinitive *czekać* gives 'I will wait'."}
  pl.a2.unit76.lesson01.exercise03.une_przyszlosc: {"instruction": "Match each Polish phrase to its meaning.", "accepted_answers": [{"value": [{"left": "będę czekać", "right": "I will wait"}, {"left": "będziesz czekać", "right": "you will wait"}, {"left": "będzie czekać", "right": "he will wait"}, {"left": "będziemy czekać", "right": "we will wait"}, {"left": "będzie padać", "right": "it will rain"}, {"left": "będzie zimno", "right": "it will be cold"}, {"left": "będzie ciepło", "right": "it will be warm"}, {"left": "będzie świecić słońce", "right": "the sun will shine"}], "status": "correct"}], "feedback": "The future of *być* plus an infinitive or an adverb."}
  pl.a2.unit76.lesson01.exercise04.ordena_czytac: {"instruction": "Put the words in order to say 'Marek will be reading at home.'", "correct_option": "Marek będzie czytać w domu", "accepted_answers": [{"value": "Marek będzie czytać w domu", "status": "correct"}, {"value": "W domu Marek będzie czytać", "status": "correct"}, {"value": "Marek w domu będzie czytać", "status": "correct"}], "feedback": "*Marek będzie czytać w domu*: subject, *będzie*, infinitive."}
  pl.a2.unit76.lesson01.exercise05.completa_bedzie: {"instruction": "Complete with the correct future form.", "correct_option": "będzie", "accepted_answers": [{"value": "będzie", "status": "correct"}], "feedback": "*Jutro będzie świecić słońce*: the sun is singular, so *będzie*."}
  pl.a2.unit76.lesson01.exercise06.traduce_zimno: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Jutro będzie zimno.", "status": "correct"}, {"value": "Jutro będzie zimno", "status": "correct"}], "feedback": "*Jutro będzie zimno* = Tomorrow it will be cold."}
  pl.a2.unit76.lesson01.exercise07.escribe_pogoda: {"instruction": "Write exactly two sentences with the future of the weather (*będzie*).", "correct_option": "W sobotę będzie padać. W niedzielę będzie ciepło.", "accepted_answers": [{"value": "W sobotę będzie padać. W niedzielę będzie ciepło.", "status": "correct"}, {"value": "W sobotę będzie padać. W niedzielę będzie ciepło", "status": "correct"}, {"value": "W sobotę będzie padać deszcz. W niedzielę będzie ciepło.", "status": "correct"}, {"value": "W sobotę będzie padać deszcz. W niedzielę będzie ciepło", "status": "correct"}], "feedback": "*W sobotę będzie padać. W niedzielę będzie ciepło.*"}
  pl.a2.unit76.lesson02.exercise01.elige_zadzwonie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Jutro zadzwonię.", "distractors": ["Jutro zadzwonić.", "Jutro zadzwoni.", "Jutro będę zadzwonię."], "accepted_answers": [{"value": "Jutro zadzwonię.", "status": "correct"}], "feedback": "*Zadzwonię* is the I-form; it already means 'I will call'."}
  pl.a2.unit76.lesson02.exercise02.elige_kupie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Kupię bilet.", "distractors": ["Kupisz bilet.", "Będę kupię bilet.", "Kupić bilet."], "accepted_answers": [{"value": "Kupię bilet.", "status": "correct"}], "feedback": "*Kupię* is the I-form of *kupić* and already refers to the future."}
  pl.a2.unit76.lesson02.exercise03.une_dokonane: {"instruction": "Match each Polish form to its meaning.", "accepted_answers": [{"value": [{"left": "zadzwonię", "right": "I will call"}, {"left": "kupię", "right": "I will buy"}, {"left": "napiszę", "right": "I will write"}, {"left": "zrobię", "right": "I will do"}, {"left": "przyjdę", "right": "I will come"}, {"left": "wrócę", "right": "I will come back"}, {"left": "Ewa zadzwoni.", "right": "Ewa will call."}, {"left": "Obiecuję.", "right": "I promise."}], "status": "correct"}], "feedback": "Eight forms for a finished future action."}
  pl.a2.unit76.lesson02.exercise04.ordena_obiecuje: {"instruction": "Put the words in order to say 'I promise that I will come back in the evening.'", "correct_option": "Obiecuję że wrócę wieczorem", "accepted_answers": [{"value": "Obiecuję że wrócę wieczorem", "status": "correct"}, {"value": "Obiecuję że wieczorem wrócę", "status": "correct"}, {"value": "Wieczorem obiecuję że wrócę", "status": "correct"}], "feedback": "*Obiecuję, że wrócę wieczorem*."}
  pl.a2.unit76.lesson02.exercise05.completa_kupie: {"instruction": "Complete with the first-person singular future of the verb meaning 'to buy'.", "correct_option": "kupię", "accepted_answers": [{"value": "kupię", "status": "correct"}], "feedback": "*Nie martw się, kupię bilet*: the I-form of the finished action."}
  pl.a2.unit76.lesson02.exercise06.traduce_obiecuje: {"instruction": "Translate into Polish.", "accepted_answers": [{"value": "Obiecuję, że zadzwonię.", "status": "correct"}, {"value": "Obiecuję, że zadzwonię", "status": "correct"}], "feedback": "*Obiecuję, że zadzwonię*."}
  pl.a2.unit76.lesson02.exercise07.escribe_obietnica: {"instruction": "Write the promise with a verb for one finished action (no *będę*).", "correct_option": "Nie martw się, wrócę wieczorem.", "accepted_answers": [{"value": "Nie martw się, wrócę wieczorem.", "status": "correct"}, {"value": "Nie martw się, wrócę wieczorem", "status": "correct"}, {"value": "Nie martw się. Wrócę wieczorem.", "status": "correct"}, {"value": "Nie martw się. Wrócę wieczorem", "status": "correct"}, {"value": "Nie martw się, wieczorem wrócę.", "status": "correct"}, {"value": "Nie martw się, wieczorem wrócę", "status": "correct"}, {"value": "Nie martw się. Wieczorem wrócę.", "status": "correct"}, {"value": "Nie martw się. Wieczorem wrócę", "status": "correct"}], "feedback": "*Nie martw się, wrócę wieczorem.*"}
  pl.a2.unit76.lesson03.exercise01.elige_pisac: {"instruction": "Choose the correct Polish sentence.", "correct_option": "O ósmej wieczorem będę pisać wiadomość.", "distractors": ["O ósmej wieczorem będziemy pisać wiadomość.", "O ósmej wieczorem będę pisze wiadomość.", "O ósmej wieczorem pisać wiadomość."], "accepted_answers": [{"value": "O ósmej wieczorem będę pisać wiadomość.", "status": "correct"}], "feedback": "'Will be writing' (in progress at a given time) needs *będę pisać*."}
  pl.a2.unit76.lesson03.exercise02.elige_prawdopodobnie: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Prawdopodobnie będzie zimno.", "distractors": ["Na pewno będzie zimno.", "Prawdopodobnie jest zimno.", "Prawdopodobnie będziesz zimno."], "accepted_answers": [{"value": "Prawdopodobnie będzie zimno.", "status": "correct"}], "feedback": "*Prawdopodobnie* means 'probably' and the future needs *będzie*."}
  pl.a2.unit76.lesson03.exercise03.une_pewnosc: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "będę pisać", "right": "I will be writing"}, {"left": "napiszę", "right": "I will write (and finish)"}, {"left": "będę czekać", "right": "I will be waiting"}, {"left": "o ósmej wieczorem", "right": "at eight in the evening"}, {"left": "do wieczora", "right": "by the evening"}, {"left": "cały dzień", "right": "all day"}, {"left": "na pewno", "right": "certainly"}, {"left": "prawdopodobnie", "right": "probably"}, {"left": "może", "right": "maybe"}], "status": "correct"}], "feedback": "Time frames and certainty words."}
  pl.a2.unit76.lesson03.exercise04.ordena_napisze: {"instruction": "Put the words in order to say 'By the evening I will write the message.'", "correct_option": "Do wieczora napiszę wiadomość", "accepted_answers": [{"value": "Do wieczora napiszę wiadomość", "status": "correct"}, {"value": "Napiszę wiadomość do wieczora", "status": "correct"}, {"value": "Wiadomość napiszę do wieczora", "status": "correct"}, {"value": "Do wieczora wiadomość napiszę", "status": "correct"}], "feedback": "*Do wieczora napiszę wiadomość*: a deadline needs the finished-action form."}
  pl.a2.unit76.lesson03.exercise05.completa_marek: {"instruction": "Complete with the correct future form.", "correct_option": "będzie", "accepted_answers": [{"value": "będzie", "status": "correct"}], "feedback": "*Marek będzie pisać*: a named subject takes *będzie*."}
