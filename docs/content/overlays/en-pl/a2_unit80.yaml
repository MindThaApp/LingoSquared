teaching:
  pl.a2.unit80.lesson01.teach.problemy: {"title": "Problems", "gloss": "my head hurts / I am tired (said by a man) / I am tired (said by a woman) / I have an exam / I have little money", "note": "A man says *zmęczony*, a woman says *zmęczona*. These are common problems that friends talk about.", "example_gloss": ["My head hurts.", "Marek is tired.", "Ewa is tired.", "I have an exam.", "I have little money."]}
  pl.a2.unit80.lesson01.teach.rady: {"title": "What to do", "gloss": "to rest / to sleep / to drink water / to go to the doctor / a lot / to work", "note": "These infinitives are the things we advise people to do. *Do lekarza* means 'to the doctor'.", "example_gloss": ["Marek sleeps a lot.", "Marek drinks water.", "Ewa is going to the doctor.", "Ewa works a lot."]}
  pl.a2.unit80.lesson01.teach.gn_powinien: {"title": "Powinien and powinna + infinitive", "gloss": "Marek should rest. Ewa should go to the doctor. Marek, you should sleep a lot. Ewa, you should drink water.", "note": "To give advice, use *powinien* (about a man) or *powinna* (about a woman) plus the infinitive. Speaking to a man, say *powinieneś*; to a woman, say *powinnaś*."}
  pl.a2.unit80.lesson01.teach.fr_ja: {"title": "I should", "gloss": "I should rest (said by a man). I should go to the doctor (said by a woman).", "note": "A man says *powinienem*, a woman says *powinnam*."}
  pl.a2.unit80.lesson02.teach.lepiej: {"title": "Better to...", "gloss": "better / why not / you will go / that you (as a chunk) / rested (a man) / rested (a woman)", "note": "*Lepiej* plus an infinitive is a general suggestion that fits any person.", "example_gloss": ["It is better to rest.", "It is better to sleep.", "Why don't you go to the doctor?", "Why don't you go to sleep?"]}
  pl.a2.unit80.lesson02.teach.gn_zebys: {"title": "Lepiej, żebyś...", "gloss": "It is better that you rest (to a man). It is better that you rest (to a woman).", "note": "Learn *lepiej, żebyś* as a set chunk. The verb after it is a past-looking form: *odpoczął* for a man, *odpoczęła* for a woman."}
  pl.a2.unit80.lesson02.teach.gn_dlaczego: {"title": "Dlaczego nie...?", "gloss": "Why don't you go to the doctor? Why don't you go to sleep?", "note": "*Dlaczego nie pójdziesz...?* is a friendly suggestion. It is the same for a man and a woman."}
  pl.a2.unit80.lesson02.teach.fr_lepiej: {"title": "General suggestions", "gloss": "It is better to rest. It is better to go to the doctor.", "note": "No change is needed for a man or a woman here."}
  pl.a2.unit80.lesson03.teach.slowa: {"title": "More advice words", "gloss": "so much / water / today / is / good (feminine)", "note": "*Tyle* means 'so much'. The word for water is *woda*; after a verb like *pić* it becomes *wodę*.", "example_gloss": ["Today my head hurts.", "Marek works so much!", "Water is good.", "Today I am not working."]}
  pl.a2.unit80.lesson03.teach.gn_rozkaz: {"title": "Short advice with the imperative", "gloss": "Go to the doctor. Drink water. Rest. Don't work so much.", "note": "The singular imperative gives direct advice to one friend and is the same for a man and a woman. Put *nie* before it to say 'don't'."}
  pl.a2.unit80.lesson03.teach.gn_kontrast: {"title": "Imperative or powinien", "gloss": "You should rest. Rest. You should not work so much. Don't work so much.", "note": "*Powinnaś odpocząć* is a gentle suggestion and shows who is advised; *Odpocznij* is shorter and more direct. *Nie powinieneś* means 'you should not'."}
  pl.a2.unit80.lesson03.teach.fr_dwie: {"title": "Two pieces of advice", "gloss": "Rest and drink water. Don't work so much."}
  pl.a2.unit80.lesson04.teach.odpowiedzi: {"title": "Answering advice", "gloss": "good idea / you are right / I think so / I do not know if it will help / thank you for the advice", "note": "Use these short replies after a friend gives you advice.", "example_gloss": ["Good idea!", "You are right.", "I think so.", "I don't know if it will help.", "Thank you for the advice."]}
  pl.a2.unit80.lesson04.teach.fr_problem: {"title": "Asking for advice", "gloss": "I have a problem. What should I do (said by a man)? What should I do (said by a woman)?", "note": "Use *powinienem* if you are a man and *powinnam* if you are a woman."}
  pl.a2.unit80.lesson04.teach.gn_czy: {"title": "Nie wiem, czy...", "gloss": "I don't know if it will help. I don't know if it is a good idea.", "note": "*Czy* here means 'whether' and always follows a comma."}
  pl.a2.unit80.lesson04.teach.gn_rada: {"title": "Rada and pomysł", "gloss": "Thank you for the advice. That is good advice. That is a good idea.", "note": "*Rada* is a feminine word, so it takes *dobra*, and after *za* it becomes *radę*. *Pomysł* is masculine, so it takes *dobry*."}
  pl.a2.unit80.lesson05.teach.wiadomosc: {"title": "Words for the message", "gloss": "also / says / uncle / grandmother / but", "note": "*Mówi* is 'says' for he or she.", "example_gloss": ["I also have an exam.", "My uncle says: Drink water.", "My grandmother says: Rest.", "It is a good idea, but I don't know if it will help."]}
  pl.a2.unit80.lesson05.teach.lektura: {"title": "Marek has a problem", "gloss": "I have a problem. Today my head hurts and I am tired. I also have an exam and I have little money. Ewa says: It is better that you rest. My uncle says: You should go to the doctor. My grandmother says: Drink water and don't work so much. It is a good idea, but I don't know if it will help. Thank you for the advice.", "note": "Marek describes his problem and the advice he got from three people.", "glosses": {"zmęczony": "tired (a man)", "pieniędzy": "of money"}}
  pl.a2.unit80.lesson06.teach.d1: {"title": "Ewa tells her problem", "gloss": "Ewa: Hi, Marek. I am tired and my head hurts."}
  pl.a2.unit80.lesson06.teach.d2: {"title": "Marek advises", "gloss": "Marek: You should rest. Why don't you go to the doctor?"}
  pl.a2.unit80.lesson06.teach.d3: {"title": "Ewa answers", "gloss": "Ewa: Good idea, but I have an exam."}
  pl.a2.unit80.lesson06.teach.d4: {"title": "Marek gives more advice", "gloss": "Marek: It is better to rest. Drink water and don't work so much."}
  pl.a2.unit80.lesson06.teach.d5: {"title": "Ewa responds", "gloss": "Ewa: You are right. I don't know if it will help, but thank you for the advice."}
  pl.a2.unit80.lesson06.teach.d6: {"title": "Marek closes", "gloss": "Marek: I think so. It is better that you rest."}
