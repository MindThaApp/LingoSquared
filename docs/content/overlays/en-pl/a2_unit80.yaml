  pl.a2.unit80.lesson02.lepiej: {"title": "It Is Better to Rest"}
  pl.a2.unit80.lesson03.idz_do_lekarza: {"title": "Go to the Doctor"}
  pl.a2.unit80.lesson04.dziekuje_za_rade: {"title": "Thanks for the Advice"}
