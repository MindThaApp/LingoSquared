    title: Uczyć się vs chodzić na kurs
    gloss: '*Uczyć się* is general (to learn something new, with the genitive: *czegoś nowego*); *chodzić na kurs* is specific (you attend a school or programme).'
    note: Distinguishes the general verb from the specific enrolled-course phrase.
