    title: What sport do you do?
    gloss: What sport do you do?
  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: I play football
    gloss: I play football.
    note: '*Gram w piłkę nożną* (literally ''I play in football'') uses *grać w* + accusative; other sports use other verbs. See the grammar note.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: A verb for each sport
    gloss: 'Each sport has its own verb: *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: One construction covers every sport -- no need to learn a separate verb per sport at this level.
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: Times a week
    gloss: times a week
    example_gloss: I do yoga twice a week.
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: You already know *codziennie* (every day) and *często* (often). *Dwa razy w tygodniu* (twice a week) is a new, more specific way to say how often.
    note: Extends the frequency vocabulary already established in the hobbies unit.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: I do yoga twice a week
    gloss: I do yoga twice a week.
  pl.a1.unit27.lesson02.teach.marek_czesto_gra:
    title: Marek often plays football
    gloss: Marek often plays football.
    note: '*Często* (often) is the frequency adverb and goes before the verb: *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport vs gram w
    gloss: '*Uprawiam sport* says in general that you exercise. A verb like *gram w piłkę nożną* names the specific sport. Both are correct Polish.'
    note: '*Uprawiać sport* is the general verb from the hobbies lesson; verbs such as *grać w* name the specific sport. One is general, the other specific.'
  pl.a1.unit27.lesson03.teach.uprawiac_sport:
    title: To exercise
    gloss: to exercise / do sport
    example_gloss: I exercise every day.
  pl.a1.unit27.lesson03.teach.uwielbiac_plywac:
    title: To love swimming
    gloss: to love swimming
    example_gloss: Kasia loves swimming.
  pl.a1.unit27.lesson03.teach.kasia_uwielbia_plywac:
    title: Kasia loves swimming
    gloss: Kasia loves swimming.
    note: '*Uwielbiać* (to adore, to love) can be followed by an infinitive: *Kasia uwielbia pływać*.'
  pl.a1.unit27.lesson04.teach.marek_czesto_biegasz:
    title: Marek asks Tomek
    gloss: 'Marek: Do you run often, Tomek?'
  pl.a1.unit27.lesson04.teach.tomek_tak_biegam:
    title: Tomek answers
    gloss: 'Tomek: Yes, I run twice a week.'
  pl.a1.unit27.lesson04.teach.marek_gdzie_biegasz:
    title: Marek asks where
    gloss: 'Marek: Where do you run?'
  pl.a1.unit27.lesson04.teach.tomek_w_parku:
    title: Tomek answers where
    gloss: 'Tomek: In the park, close to my house.'
  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać changes with the person
    gloss: '*Biegać* (to run) changes its ending with the person: *biegam* (I run), *biegasz* (you run), *biega* (he runs).'
    note: 'Polish verbs take a different ending for each person, so the subject pronoun is usually dropped: *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: Marek reacts
    gloss: 'Marek: How nice, I often play football there.'
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: Ewa and Kasia on sport
    gloss: Ewa does yoga twice a week. She loves moving calmly. Kasia doesn't do yoga, but she loves swimming. Kasia swims often, almost every week. What sport do you do?
    note: Contrasts two different sports and two different frequency expressions in one short reading.
    glosses:
      ćwiczy: does
      dwa: two
      razy: times
      tygodniu: week
      jogę: yoga
      uwielbia: loves
      spokojny: calmly
      ruch: move
      pływać: swimming
      pływa: swims
      często: often
      prawie: almost
      jaki: which
      sport: sport
  pl.a1.unit27.lesson05.teach.kasia_czesto_plywa:
    title: Kasia swims often, almost every week
    gloss: Kasia swims often, almost every week.
  pl.a1.unit27.lesson05.teach.gram_w_pilke:
    title: I play football. I love football.
    gloss: I play football. I love football.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  pl.a1.unit27.lesson06.teach.ewa_moze_pocwiczymy:
    title: Ewa proposes
    gloss: 'Ewa: Shall we exercise together?'
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
    title: Może poćwiczymy ...?
    gloss: '*Może poćwiczymy ...?* (''maybe we will exercise?'') proposes doing something together; you may already know this pattern from an earlier lesson.'
    note: Reuses the exact plan-proposing construction from the plans unit.
  pl.a1.unit27.lesson06.teach.kasia_tak_fajnie:
    title: Kasia agrees
    gloss: 'Kasia: Yes, nice! I love swimming.'
  pl.a1.unit27.lesson06.teach.marek_wole_grac:
    title: Marek prefers football
    gloss: 'Marek: I''d rather play football.'
  pl.a1.unit27.lesson06.teach.tomek_a_ja:
    title: Tomek likes running
    gloss: 'Tomek: And I like running.'
  pl.a1.unit27.lesson06.teach.ewa_to_w:
    title: Ewa closes the conversation
    gloss: 'Ewa: Then the four of us will exercise together this week!'
    note: Closes the loop across all four characters' sport preferences from this unit.
