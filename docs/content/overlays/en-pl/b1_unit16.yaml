answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully punctuated
    form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit16.warunki_realne_i_nierealne:
    title: "Real and unreal conditions"

lessons:
  pl.b1.unit16.lesson01.jesli_pogoda_bedzie_dobra:
    title: "If the weather is good..."
  pl.b1.unit16.lesson02.gdybym_mial_wiecej_pieniedzy:
    title: "If I had more money..."
  pl.b1.unit16.lesson03.rozmowa_o_wycieczce:
    title: "A conversation about the trip"
  pl.b1.unit16.lesson04.warunki_podsumowanie:
    title: "Conditions -- summary"

teaching:
  pl.b1.unit16.lesson01.teach.jesli_pogoda_bedzie_dobra:
    title: "If the weather is good, we'll go on a bike trip"
    gloss: "If the weather is good, we'll go on a bike trip."
    note: "*Jeśli* + future tense in both clauses -- a real/possible condition, no *by* particle."
    example_gloss: "On Saturday, if the weather is good, we'll go on a bike trip."
  pl.b1.unit16.lesson01.teach.jesli_bedzie_padac:
    title: "If it rains, we'll stay home"
    gloss: "If it rains, we'll stay home."
    note: "The negative-outcome branch of the same real-condition pattern."
    example_gloss: "But if it rains, we'll stay home."
  pl.b1.unit16.lesson01.teach.warunek_realny_note:
    title: "Real/possible condition"
    gloss: "Real/possible condition: \"jeśli\" + future tense in BOTH clauses -- no *by* particle. Describes something that could really happen."
    note: "The contrast point this unit builds toward -- compare with lesson02's unreal *gdyby* form."
  pl.b1.unit16.lesson01.teach.recap_basics:
    title: "I have time on Saturday"
    gloss: "I have time on Saturday."
    note: "Recap of basic vocabulary used elsewhere in this unit."
    example_gloss: "This week I have little time, but on Saturday I have time."

  pl.b1.unit16.lesson02.teach.gdybym_mial_wiecej_pieniedzy:
    title: "If I had more money, I would buy a new bike"
    gloss: "If I had more money, I would buy a new bike. (masculine)"
    note: "*Gdybym miał* -- unreal-present condition, masculine (Marek)."
    example_gloss: "This bike is already old -- if I had more money, I would buy a new bike."
  pl.b1.unit16.lesson02.teach.gdybym_miala_wiecej_czasu:
    title: "If I had more time, I would ride my bike more often"
    gloss: "If I had more time, I would ride my bike more often. (feminine)"
    note: "*Gdybym miała* -- the same unreal-present pattern, feminine (Ewa); *jeździłabym* is imperfective (a repeated habit, not one bounded trip)."
    example_gloss: "Ewa says: if I had more time, I would ride my bike more often."
  pl.b1.unit16.lesson02.teach.warunek_nierealny_note:
    title: "Unreal (present) condition"
    gloss: "Unreal (present) condition: \"gdyby\" + the -ł form + \"by\" + a personal ending. Describes something that isn't true right now."
    note: "The unreal counterpart of lesson01's real condition."

  pl.b1.unit16.teach.dialogue.line01:
    title: "Ewa proposes a bike trip"
    gloss: "If the weather is good on Saturday, shall we go on a bike trip?"
    note: "Opens the real-condition exchange this lesson's exercises test."
  pl.b1.unit16.teach.dialogue.line02:
    title: "Marek agrees and names the alternative"
    gloss: "Sure! And if it rains, we'll stay home and cook lunch."
    note: "The negated-weather branch of the real condition."
  pl.b1.unit16.teach.dialogue.line03:
    title: "Ewa regrets her old bike"
    gloss: "It's a shame my bike is already so old."
    note: "Sets up the unreal-present wish that follows."
  pl.b1.unit16.teach.dialogue.line04:
    title: "Marek makes an unreal-present offer"
    gloss: "If I had more money, I would buy you a new bike."
    note: "*Gdybym miał* -- unreal-present, masculine (Marek)."
  pl.b1.unit16.teach.dialogue.line05:
    title: "Marek references an unreal-past regret"
    gloss: "Remember yesterday? If I had known it would rain, I would have taken an umbrella."
    note: "Same *gdybym* morphology as line04, now read as PAST because of *wczoraj* (yesterday) -- Polish's gdyby-clause is tense-neutral. *że będzie padać* keeps the future tense from the original direct thought, per this course's no-backshift rule (b1_unit05)."
  pl.b1.unit16.teach.dialogue.line06:
    title: "Ewa confirms he got soaked"
    gloss: "Yes, you got completely soaked! If I had had an umbrella, I would have given it to you."
    note: "*Gdybym miała* -- unreal-past, feminine (Ewa), same tense-neutral form disambiguated by context."

  pl.b1.unit16.lesson04.teach.review_note:
    title: "Real vs. unreal conditions"
    gloss: "Contrast: 1) real condition -- \"jeśli\" + future tense (If the weather is good...), 2) unreal condition -- \"gdyby\" + the -ł form + by (If I had more money...), the SAME form for present and past -- only a word like \"yesterday\" tells them apart."
    note: "The full contrast this unit's culminating exercise requires."

