answer_policy:
  diacritics: >-
    Same standing policy as unit01-08: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form remains
    the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit09.directions:
    title: "How to get there?"

lessons:
  pl.a1.unit09.lesson01.jak_dojsc:
    title: "How to get there?"
  pl.a1.unit09.lesson02.na_prawo_na_lewo:
    title: "Turn right, turn left"
  pl.a1.unit09.lesson03.jak_dojsc_do_parku:
    title: "How do I get to the park?"

teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: "To go, to get to"
    gloss: "to go; to get to / arrive at"
    note: "Two closely related motion verbs -- iść is the general 'go/walk,' dojść is specifically 'reach/get to' a destination, used in the question pattern this lesson teaches."
    example_gloss:
      - "Please go straight ahead."
      - "How do I get to the bank?"

  pl.a1.unit09.lesson01.teach.prosto:
    title: "Straight ahead"
    gloss: "straight ahead"
    note: "The most basic direction word -- used right after iść to say 'go straight.'"
    example_gloss: "Please go straight to the park."

  pl.a1.unit09.lesson01.teach.tam_potem:
    title: "There, then"
    gloss: "there; then"
    note: "Tam points to a location; potem sequences steps ('first this, then that') -- both essential for stringing directions together."
    example_gloss:
      - "The bank is there."
      - "Then, please go straight."

  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: "Please + infinitive"
    gloss: "Please + infinitive -- Proszę (please) plus a verb in its infinitive (dictionary) form is the everyday polite way to give a direction, without a separate command form: Please go straight ahead."
    note: >-
      *Proszę* plus an infinitive verb is how Polish politely tells someone
      to do something -- *Proszę iść prosto* ("Please go straight"). It is
      the safe, polite choice with a stranger, so you don't need a
      separate "command form" to give or understand directions. (Between
      friends, Polish speakers usually use that command form instead --
      you'll meet it later.)

  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: "How do I get to + [place]?"
    gloss: "How do I get to + [place]? -- Jak (how) plus dojść (to get to) asks the way to a place: How do I get to the bank? How do I get to the hotel? How do I get to the park? The noun after 'do' takes the same -u genitive ending as after 'next to'/'across from' in the last unit: bank -> banku, hotel -> hotelu, park -> parku."
    note: >-
      *Jak dojść do...?* is the everyday question for asking how to reach a
      place. The place name that follows *do* takes the same *-u* genitive
      ending you already learned after *obok*/*naprzeciwko* -- *bank*
      becomes *banku*, *hotel* becomes *hotelu*, *park* becomes *parku*, the
      exact same pattern, just after a new preposition.

  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: "How do I get to the bank?"
    gloss: "How do I get to the bank?"
    note: "The grammar note's pattern put to work with this lesson's first destination."

  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: "Right, left"
    gloss: "right; left"
    note: "Used after na to say where something is or which way to turn -- na prawo (to/on the right), na lewo (to/on the left)."
    example_gloss:
      - "The bank is on the right."
      - "The park is on the left."

  pl.a1.unit09.lesson02.teach.skrecic:
    title: "To turn"
    gloss: "to turn"
    note: "The verb for changing direction -- paired with na prawo/na lewo to mean 'turn right'/'turn left.'"
    example_gloss: "Please turn right."

  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: "Please turn left"
    gloss: "Please turn left."
    note: "The same Proszę + infinitive pattern, this time with skręcić and na lewo."

  pl.a1.unit09.lesson02.teach.ulica:
    title: "Street"
    gloss: "street"
    note: "An ordinary word for any street -- useful whenever directions mention a specific one by name."
    example_gloss: "The street is there."

  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: "Chaining directions with potem"
    gloss: "Please go straight, then turn right. -- Several directions can be chained with a comma and the word potem (then): do one thing, then the next."
    note: >-
      To give more than one direction in a row, just join them with a comma
      and *potem*: *Proszę iść prosto, potem skręcić na prawo* ("Please go
      straight, then turn right"). You'll hear real multi-step directions
      built exactly this way.

  pl.a1.unit09.lesson03.teach.rozumiem:
    title: "I understand"
    gloss: "I understand"
    note: "A useful way to confirm you followed directions before asking a follow-up question."
    example_gloss: "I understand, thank you."

  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: "Ewa asks how to get to the park"
    gloss: "Ewa says excuse me and asks how to get to the park."
    note: "Przepraszam opens the question, the same polite habit from the places dialogue in the previous unit."
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: "A passer-by gives directions to the park"
    gloss: "The passer-by says go straight, then turn left. The park is there."
    note: "Two chained directions using potem, exactly as this lesson's grammar note describes."
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: "Ewa confirms and asks about the bank"
    gloss: "Ewa says she understands, and asks how to get to the bank."
    note: "Rozumiem confirms she followed the first set of directions before asking a new question."
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: "The passer-by gives directions to the bank"
    gloss: "The passer-by says turn right, then go straight. The bank is on the right."
    note: "A different two-step route than the park's, reusing the same Proszę + infinitive pattern."
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: "Ewa says thank you"
    gloss: "Ewa says thank you very much."
    note: "Dziękuję bardzo, reused from the shopping and places units."
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: "The passer-by responds"
    gloss: "The passer-by says you're welcome."
    note: "Proszę bardzo, the standard reply to thanks, reused from earlier units."

exercises:
  pl.a1.unit09.lesson01.exercise01.select_prosto:
    instruction: "Which word means 'straight ahead'?"
    correct_option: "prosto"
    distractors: ["tam", "potem"]
    accepted_answers: ["prosto"]

  pl.a1.unit09.lesson01.exercise02.select_dojsc:
    instruction: "Which word means 'to get to'?"
    correct_option: "dojść"
    distractors: ["iść", "prosto"]
    accepted_answers: ["dojść"]

  pl.a1.unit09.lesson01.exercise03.select_tam:
    instruction: "Which word means 'there'?"
    correct_option: "tam"
    distractors: ["potem", "prosto"]
    accepted_answers: ["tam"]

  pl.a1.unit09.lesson01.exercise04.match_direction_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "iść": "to go"
      "dojść": "to get to"
      "prosto": "straight ahead"
      "tam": "there"
      "potem": "then"

  pl.a1.unit09.lesson01.exercise05.order_jak_dojsc_do_banku:
    instruction: "Put the question 'How do I get to the bank?' in order."
    correct_response: ["Jak", "dojść", "do", "banku"]

  pl.a1.unit09.lesson01.exercise06.order_prosze_isc_prosto:
    instruction: "Put the sentence 'Please go straight ahead' in order."
    correct_response: ["Proszę", "iść", "prosto"]

  pl.a1.unit09.lesson01.exercise07.fill_jak:
    instruction: "Complete the question to say 'How do I get to the hotel?'"
    accepted_answers: ["Jak"]
    feedback: "Jak dojść do hotelu? -- jak means 'how.'"

  pl.a1.unit09.lesson01.exercise08.fix_word_order:
    instruction: "Fix the word order -- Polish asks 'Jak dojść do...?', not '[verb] jak do...?'"
    accepted_answers:
      - "Jak dojść do parku?"
      - "Jak dojść do parku"
    feedback: "Jak dojść do parku?, not Dojść jak do parku? -- jak dojść comes before the place you're asking about."

  pl.a1.unit09.lesson01.exercise09.speak_jak_dojsc_do_banku:
    instruction: "Say 'How do I get to the bank?'"
    accepted_answers:
      - "Jak dojść do banku?"
      - "Jak dojść do banku"

  pl.a1.unit09.lesson02.exercise01.select_prawo:
    instruction: "Which word means 'right'?"
    correct_option: "prawo"
    distractors: ["lewo", "prosto"]
    accepted_answers: ["prawo"]

  pl.a1.unit09.lesson02.exercise02.select_lewo:
    instruction: "Which word means 'left'?"
    correct_option: "lewo"
    distractors: ["prawo", "skręcić"]
    accepted_answers: ["lewo"]

  pl.a1.unit09.lesson02.exercise03.select_skrecic:
    instruction: "Which word means 'to turn'?"
    correct_option: "skręcić"
    distractors: ["iść", "dojść"]
    accepted_answers: ["skręcić"]

  pl.a1.unit09.lesson02.exercise04.match_direction_words:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "prawo": "right"
      "lewo": "left"
      "skręcić": "to turn"
      "ulica": "street"
      "potem": "then"
      "tam": "there"

  pl.a1.unit09.lesson02.exercise05.order_skrecic_na_prawo:
    instruction: "Put the sentence 'Please turn right' in order."
    correct_response: ["Proszę", "skręcić", "na", "prawo"]

  pl.a1.unit09.lesson02.exercise06.order_skrecic_na_lewo:
    instruction: "Put the sentence 'Please turn left' in order."
    correct_response: ["Proszę", "skręcić", "na", "lewo"]

  pl.a1.unit09.lesson02.exercise07.fill_skrecic:
    instruction: "Complete the sentence to say 'Please turn right.'"
    accepted_answers: ["skręcić"]
    feedback: "Proszę skręcić na prawo -- skręcić means 'to turn.'"

  pl.a1.unit09.lesson02.exercise08.fix_broken_order:
    instruction: "Fix the word order -- Polish says 'Proszę skręcić na prawo,' not 'Na prawo skręcić proszę.'"
    accepted_answers:
      - "Proszę skręcić na prawo."
      - "Proszę skręcić na prawo"
    feedback: "Proszę skręcić na prawo, not Na prawo skręcić proszę -- proszę plus the infinitive opens the instruction."

  pl.a1.unit09.lesson02.exercise09.speak_skrecic_na_lewo:
    instruction: "Say 'Please turn left.'"
    accepted_answers:
      - "Proszę skręcić na lewo."
      - "Proszę skręcić na lewo"
      - "Proszę skręcić w lewo."
      - "Proszę skręcić w lewo"

  pl.a1.unit09.lesson03.exercise01.select_przepraszam_jak_dojsc:
    instruction: "Which line politely asks how to get to the park?"
    correct_option: "Przepraszam, jak dojść do parku?"
    distractors:
      - "Proszę iść prosto, potem skręcić na lewo."
      - "Proszę bardzo!"
    accepted_answers:
      - "Przepraszam, jak dojść do parku?"
      - "Przepraszam, jak dojść do parku"

  pl.a1.unit09.lesson03.exercise02.select_park_directions:
    instruction: "Which line gives directions to the park?"
    correct_option: "Proszę iść prosto, potem skręcić na lewo. Park jest tam."
    distractors:
      - "Przepraszam, jak dojść do parku?"
      - "Proszę skręcić na prawo, potem iść prosto. Bank jest na prawo."
    accepted_answers:
      - "Proszę iść prosto, potem skręcić na lewo. Park jest tam."

  pl.a1.unit09.lesson03.exercise03.comprehend_park_directions:
    instruction: "Read the line. How do you get to the park?"
    correct_option: "straight, then turn left"
    distractors:
      - "turn right, then straight"
      - "turn left, then straight"
    accepted_answers:
      - "prosto, potem na lewo"
      - "straight, then turn left"

  pl.a1.unit09.lesson03.exercise04.comprehend_bank_directions:
    instruction: "Read the line. How do you get to the bank?"
    correct_option: "turn right, then straight"
    distractors:
      - "straight, then turn left"
      - "turn left, then straight"
    accepted_answers:
      - "na prawo, potem prosto"
      - "turn right, then straight"

  pl.a1.unit09.lesson03.exercise05.match_direction_vocabulary_full:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "iść": "to go"
      "dojść": "to get to"
      "prosto": "straight ahead"
      "tam": "there"
      "potem": "then"
      "prawo": "right"
      "lewo": "left"
      "skręcić": "to turn"
      "ulica": "street"
      "rozumiem": "I understand"

  pl.a1.unit09.lesson03.exercise06.order_przepraszam_jak_dojsc_do_parku:
    instruction: "Put the question 'Excuse me, how do I get to the park?' in order."
    correct_response: ["Przepraszam", "jak", "dojść", "do", "parku"]

  pl.a1.unit09.lesson03.exercise07.order_bank_directions:
    instruction: "Put the sentence 'Please turn right, then go straight' in order."
    correct_response: ["Proszę", "skręcić", "na", "prawo", "potem", "iść", "prosto"]

  pl.a1.unit09.lesson03.exercise08.fill_rozumiem:
    instruction: "Complete Ewa's line to say 'I understand! And how do I get to the bank?'"
    accepted_answers: ["Rozumiem"]
    feedback: "Rozumiem! A jak dojść do banku? -- rozumiem means 'I understand.'"

  pl.a1.unit09.lesson03.exercise09.fix_park_directions:
    instruction: "Fix the word order -- Polish says 'Proszę iść prosto, potem skręcić na lewo,' not this scrambled version."
    accepted_answers:
      - "Proszę iść prosto, potem skręcić na lewo."
      - "Proszę iść prosto, potem skręcić na lewo"
    feedback: "Proszę iść prosto, potem skręcić na lewo -- proszę plus the infinitive opens each instruction, joined by potem."

  pl.a1.unit09.lesson03.exercise10.reply_jak_dojsc_do_banku:
    instruction: "Answer as the passer-by: turn right, then go straight. The bank is on the right."
    accepted_answers:
      - "Proszę skręcić na prawo, potem iść prosto. Bank jest na prawo."
      - "Proszę skręcić na prawo, potem iść prosto, bank jest na prawo."
      - "Proszę skręcić na prawo, potem iść prosto. Bank jest na prawo"
      - "Proszę skręcić w prawo, potem iść prosto. Bank jest na prawo."
      - "Proszę skręcić w prawo, potem iść prosto. Bank jest na prawo"

  pl.a1.unit09.lesson03.exercise11.speak_rozumiem:
    instruction: "Say 'I understand!'"
    accepted_answers:
      - "Rozumiem!"
      - "Rozumiem"
