  pl.a1.unit29.lesson01.teach.uzywam_telefonu_codziennie:
    title: I use my phone every day
    gloss: I use my phone every day.
    note: '*Codziennie* means every day and can stand after the verb: *Używam telefonu codziennie.*'
  pl.a1.unit29.lesson02.teach.aplikacja:
    title: The app
    gloss: the app
    example_gloss: I have an app for the weather forecast.
  pl.a1.unit29.lesson02.teach.wiadomosc:
    title: The message
    gloss: the message
    example_gloss: I'll send a message through the app.
  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Verbs for a message: send and read'
    gloss: You already know *prognoza pogody* (the weather forecast). *Wiadomość* is a message you can send (*wysyłam*, *wysyłasz*) or read (*czytam*, *czytasz*).
    note: Ties the new word to the already-taught compound noun from the weather unit.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa sends a message through the app
    gloss: Ewa sends a message through the app.
    note: '*Wysyłać* (to send) uses *przez* + accusative for the channel: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
    title: Marek reads the message
    gloss: Marek reads the message.
  pl.a1.unit29.lesson03.teach.sprawdzac:
    title: To look up
    gloss: to look up
    example_gloss: I look up the weather forecast.
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Two verbs, two cases
    gloss: '*Sprawdzam* takes the accusative: *prognozę pogody*. *Używam* takes the genitive: *telefonu*.'
    note: Most verbs take the accusative, but *używać* is an exception and needs the genitive.
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
    title: Tomek looks up the weather forecast
    gloss: Tomek looks up the weather forecast.
  pl.a1.unit29.lesson03.teach.potem_idzie_biegac:
    title: Then he goes running
    gloss: Then he goes running.
    note: '*Idzie biegać* means goes running: *iść* + infinitive.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa proposes
    gloss: 'Ewa: Shall we exercise Saturday at ten?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek agrees
    gloss: 'Marek: Good idea! I''ll look up the weather forecast.'
    note: '*Dobry pomysł!* is a short reply to a suggestion; the adjective *dobry* agrees with masculine *pomysł*.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek checks the weather
    gloss: 'Marek: It''s sunny on Saturday!'
    note: '*Słonecznie* is an adverb: *jest słonecznie* means it is sunny, and no subject is needed.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek sees the message
    gloss: 'Tomek: I see the message. See you Saturday!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia and do + a day
    gloss: 'You already know *Do widzenia!* You can also name a day: *Do soboty!*, *Do jutra!* (*do* is followed by the genitive).'
    note: Extends the greetings unit's farewell pattern to a specific day.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Who uses what?
    gloss: Ewa calls Marek every day. She uses her phone, not an app. Marek has no computer at home, but he uses internet on his phone. Tomek looks up the weather forecast every morning. Then he goes running. Kasia often sends Ewa a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
    glosses:
      dzwoni: calls
      każdego: every
      dnia: day
      używa: uses
      telefonu: phone
      aplikacji: app
      komputera: computer
      domu: at home
      internetu: internet
      sprawdza: looks up
      ranka: morning
      prognozę: weather forecast
      idzie: goes
      biegać: running
      wysyła: sends
      często: often
      wiadomość: message
      używasz: use
  pl.a1.unit29.lesson05.teach.tomek_kazdego_ranka:
    title: Tomek looks up the forecast every morning
    gloss: Tomek looks up the weather forecast every morning.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Kasia often messages Ewa
    gloss: Kasia often sends Ewa a message.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Ewa confirms the plan
    gloss: 'Ewa: I see the message. Shall we exercise Saturday at ten in the park?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Marek confirms the weather
    gloss: 'Marek: Yes, and it''s sunny on Saturday!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: Tomek's plan
    gloss: 'Tomek: I''ll run then. Afterward I''ll also play football.'
    note: '*Wtedy* (then) and *potem* (afterwards) mark the order of events; *pobiegam* and *zagram* are perfective, so they sound like plans.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: Kasia's plan
    gloss: 'Kasia: I''d rather swim, but I''m coming to the park too.'
    note: '*Wolę* means I prefer and is followed by an infinitive: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Ewa closes the conversation
    gloss: 'Ewa: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
