    Tenth en-pl B1 overlay, written for pl/b1_unit10_streszczenie.yaml
    (schema_version 1.1, §19 format from the start). No sibling-direction
    overlay exists yet, so §8 doesn't apply.

    Every note/feedback string mixing Polish text inline with English
    wraps the Polish in *asterisks* per §15. Every matching_pairs
    correct_response and word_order correct_response checked token-for-
    token against the realization's own pairs/word_bank. No stray YAML
    boolean coercion. Pending fresh-context review per AUTHORING_GUIDE
    §9; not self-certified.

answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and place names (Ewa,
    Marek, Kasia, Kraków).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit10.streszczenie:
    title: "Summary"

lessons:
  pl.b1.unit10.lesson01.w_skrocie:
    title: "In short..."
  pl.b1.unit10.lesson02.chodzi_o_to_ze:
    title: "The point is that..."
  pl.b1.unit10.lesson03.co_slychac_u_kasi:
    title: "What's new with Kasia?"
  pl.b1.unit10.lesson04.streszczenie_historii:
    title: "Summarizing the story"

teaching:
  pl.b1.unit10.lesson01.teach.recap_words:
    title: "Is, I have, good -- again"
    gloss: "jest, mam, dobry -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds summary-marking connectors."

  pl.b1.unit10.lesson01.teach.kasia_krakow:
    title: "Kasia is moving to Kraków"
    gloss: "Kasia is moving to Kraków"
    note: "A recap of the fact established in an earlier unit -- restated here from scratch so this file is self-contained."
    example_gloss: "Kasia is moving to Kraków."

  pl.b1.unit10.lesson01.teach.zmienia_prace:
    title: "Is changing jobs, because"
    gloss: "is changing jobs, because"
    note: "*bo* -- because, links the job change to the reason."
    example_gloss: "Kasia is changing jobs because she's moving to Kraków."

  pl.b1.unit10.lesson01.teach.w_skrocie:
    title: "In short"
    gloss: "in short"
    note: "A summary-marking connector, introducing the condensed main point."
    example_gloss: "In short, Kasia is changing jobs."

  pl.b1.unit10.lesson01.teach.w_skrocie_note:
    title: "W skrócie + main point"
    gloss: "\"W skrócie\" -- used to give the most important information after a longer story, omitting the details: *W skrócie, Kasia zmienia pracę* (In short, Kasia is changing jobs)."
    note: "The core discourse skill this unit teaches: compressing detail into a main point."

  pl.b1.unit10.lesson01.teach.phrase_w_skrocie:
    title: "In short, Kasia is changing jobs because she's moving to Kraków"
    gloss: "In short, Kasia is changing jobs because she's moving to Kraków."
    note: "A complete summary sentence combining the reason and the connector."

  pl.b1.unit10.lesson02.teach.chodzi_o_to_ze:
    title: "The point is that"
    gloss: "the point is that"
    note: "A second summary-marking connector, more conversational than *w skrócie*."
    example_gloss: "The point is that she got a new job."

  pl.b1.unit10.lesson02.teach.dostala_nowa_prace:
    title: "Got a new job"
    gloss: "got a new job"
    note: "*dostała* -- feminine past tense of *dostać* (to get), referring to Kasia."
    example_gloss: "The point is that she got a new job."

  pl.b1.unit10.lesson02.teach.najwazniejsze_jest_ze:
    title: "The most important thing is that"
    gloss: "the most important thing is that"
    note: "A third summary-marking connector, for emphasizing the single most important fact."
    example_gloss: "The most important thing is that she starts next month."

  pl.b1.unit10.lesson02.teach.zaczyna_w_przyszlym_miesiacu:
    title: "Starts next month"
    gloss: "starts next month"
    note: "*zaczyna* -- present tense, used for a near-future start date."
    example_gloss: "The most important thing is that she starts next month."

  pl.b1.unit10.lesson02.teach.szczegoly_nie_sa_wazne:
    title: "The details aren't important"
    gloss: "the details aren't important"
    note: "Names directly what a summary leaves out."
    example_gloss: "The details aren't important."

  pl.b1.unit10.lesson02.teach.chodzi_note:
    title: "Chodzi o to, że / najważniejsze jest, że"
    gloss: "\"Chodzi o to, że\" and \"najważniejsze jest, że\" -- both introduce the most important point of a story, omitting the details: *Chodzi o to, że dostała pracę* / *Najważniejsze jest, że zaczyna w przyszłym miesiącu*."
    note: "Two more ways to state the main point, alongside w skrócie from lesson01."

  pl.b1.unit10.teach.dialogue.line01:
    title: "Marek asks about Kasia"
    gloss: "Have you heard anything about Kasia?"
    note: "Opens the retelling this lesson's exercises test."
  pl.b1.unit10.teach.dialogue.line02:
    title: "Ewa gives the full detailed story"
    gloss: "Yes, she told me yesterday. She looked for work in Kraków for two months, sent fifteen applications, and had four interviews."
    note: "The DETAIL half of the summarize-and-retell skill -- lots of specific facts, none of which is the main point on its own."
  pl.b1.unit10.teach.dialogue.line03:
    title: "Marek reacts to the detail"
    gloss: "That's a lot of details! So what happened in the end?"
    note: "Names the detail as detail and asks for the main point -- exactly the skill this outcome names."
  pl.b1.unit10.teach.dialogue.line04:
    title: "Ewa gives the main point"
    gloss: "The point is that she got a job at a big company downtown."
    note: "The MAIN POINT half -- compresses the whole search into one fact."
  pl.b1.unit10.teach.dialogue.line05:
    title: "Marek asks when"
    gloss: "Great! When does she start?"
    note: "A follow-up question, not a new fact to contradict."
  pl.b1.unit10.teach.dialogue.line06:
    title: "Ewa states the most important remaining fact"
    gloss: "The most important thing is that she already starts next month."
    note: "A second main-point statement, using the unit's third connector."

  pl.b1.unit10.lesson04.teach.reading_passage:
    title: "The full story about Kasia"
    gloss: "Kasia is changing jobs because she's moving to Kraków. First she looked for work in Kraków for two months. She sent fifteen applications and had four interviews. In the end she got a job at a big company downtown. She starts the new job next month."
    note: "The detailed source passage this lesson's culminating exercise asks the learner to summarize -- keeping only the main points."

  pl.b1.unit10.lesson04.teach.znalazla_note:
    title: "Found, it"
    gloss: "found, it (feminine object pronoun)"
    note: "*znalazła* -- feminine past of *znaleźć* (to find); *ją* -- \"it\" (feminine accusative pronoun, referring to *pracę*, the job)."
    example_gloss: "In short, Kasia found a new job in Kraków and starts it next month."

  pl.b1.unit10.lesson04.teach.summary_note:
    title: "How to summarize a story"
    gloss: "To summarize a story: leave out the details (how many months, how many applications) and give only the main point, e.g. \"In short, Kasia found a new job in Kraków and starts it next month.\""
    note: "The culminating skill this lesson's writing task requires."

  pl.b1.unit10.lesson04.teach.mozesz_strescic:
    title: "Can you summarize the story?"
    gloss: "can you summarize the story?"
    note: "A request for a summary -- the question this lesson's culminating dialogue_response exercise answers."
    example_gloss: "Can you summarize Kasia's story?"

