answer_policy:
  diacritics: >-
    Same standing policy as unit01-10: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form remains
    the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit11.plans:
    title: "Plans"

lessons:
  pl.a1.unit11.lesson01.propozycja:
    title: "Proposal"
  pl.a1.unit11.lesson02.tak_czy_nie:
    title: "Yes or no"
  pl.a1.unit11.lesson03.umawiamy_sie_na_kino:
    title: "Making plans for the cinema"

teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: "To want, I want"
    gloss: "to want; I want"
    note: "Chcieć is the infinitive; chcę is the everyday first-person form you'll use to say what you want."
    example_gloss: "I want to go to the cinema."

  pl.a1.unit11.lesson01.teach.chcesz:
    title: "You want"
    gloss: "you want (informal)"
    note: "Chcesz is the informal 'you' form, used the same way as masz and jesteś -- exactly what you'll use to ask a friend what they want."
    example_gloss: "Do you want coffee?"

  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: "I want, you want"
    gloss: "Chcę, chcesz -- the same pattern as masz (to have) and jesteś (to be): chcesz is the 'you' form (second person), used when you're asking someone else what they want."
    note: >-
      This unit needs a little more than "I" -- *chcę* (I want) and
      *chcesz* (you want) are the exact same person pattern you already
      know from *masz* and *jesteś*, just applied to a new verb.

  pl.a1.unit11.lesson01.teach.kino:
    title: "Cinema"
    gloss: "cinema / movie theater"
    note: "The everyday word for the cinema -- comes up constantly when making plans."
    example_gloss: "This is the cinema."

  pl.a1.unit11.lesson01.teach.razem:
    title: "Together"
    gloss: "together"
    note: "Razem also means 'total' in a shopping context (you may recall it from the shopping unit) -- here it's used in its other everyday sense, 'together.'"
    example_gloss: "Do you want to go together?"

  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: "Do you want to go to the cinema?"
    gloss: "Do you want to go to the cinema?"
    note: "Czy opens a yes/no question; chcesz iść do kina asks what the other person wants to do -- the core way to propose a plan."

  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: "Do you want to go to the cinema together on Friday?"
    gloss: "Do you want to go to the cinema together on Friday?"
    note: "The full proposal: razem (together) and w piątek (on Friday) added onto the question you just learned."

  pl.a1.unit11.lesson02.teach.moc_moge:
    title: "To be able to, I can"
    gloss: "to be able to / can; I can"
    note: "Móc is the infinitive; mogę is the first-person form -- you may recall możemy ('we can') from the earlier date and time units, this is the same verb, singular."
    example_gloss: "I can come on Friday."

  pl.a1.unit11.lesson02.teach.mozesz:
    title: "You can"
    gloss: "you can (informal)"
    note: "Możesz is the informal 'you' form, the same second-person pattern as chcesz -- used to ask whether someone else is able to do something."
    example_gloss: "Can you make it on Saturday?"

  pl.a1.unit11.lesson02.teach.przyjsc:
    title: "To come"
    gloss: "to come"
    note: "The verb for coming to meet someone -- pairs naturally with mogę/możesz to say who can or can't make it."
    example_gloss: "I want to come on Friday."

  pl.a1.unit11.lesson02.teach.moc_note:
    title: "I can, you can"
    gloss: "Móc: mogę, możesz -- the same second person (you) as chcesz. Mogę plus an infinitive says what you're able to do: mogę przyjść (I can come), mogę iść (I can go)."
    note: >-
      *Mogę* + a plain infinitive verb says what you're able to do --
      *mogę przyjść* ("I can come") and *mogę iść* ("I can go") both
      follow this same simple pattern.

  pl.a1.unit11.lesson02.teach.chetnie:
    title: "Gladly"
    gloss: "gladly"
    note: "A warm, enthusiastic way to accept a plan -- often paired with tak (yes) or bardzo (very) for extra warmth."
    example_gloss: "Yes, very gladly!"

  pl.a1.unit11.lesson02.teach.niestety:
    title: "Unfortunately"
    gloss: "unfortunately"
    note: "The natural softener for declining a plan politely -- almost always followed by nie mogę (I can't)."
    example_gloss: "Unfortunately, I can't."

  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: "On Saturday"
    gloss: "W + day of the week: masculine days (piątek, poniedziałek, czwartek) don't change their ending -- w piątek. Feminine days (sobota, środa, niedziela) get the accusative ending -ę, just like kawa -> kawę -- w sobotę."
    note: >-
      Not every day works the same way after *w* -- feminine day names
      like *sobota* change to *sobotę*, the exact same *-a* -> *-ę*
      ending you already learned for *kawa* -> *kawę* and *herbata* ->
      *herbatę*. Masculine days like *piątek* stay exactly as they are.

  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: "Can you come on Saturday?"
    gloss: "Can you come on Saturday?"
    note: "Puts together możesz, przyjść, and the new w sobotę form -- a complete way to ask about an alternative day."

  pl.a1.unit11.lesson03.teach.moze:
    title: "Maybe, how about"
    gloss: "maybe / how about"
    note: "The word for proposing an alternative -- comes up whenever a first plan doesn't work and you want to suggest something else."
    example_gloss: "How about Saturday?"

  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: "Może vs. mogę"
    gloss: "Może and mogę look alike, but they mean different things: może ('maybe') proposes something new; mogę (the verb's 'I' form, 'I can') says what you're able to do."
    note: >-
      Easy to mix up on the page: *może* ("maybe," used here to suggest
      something) and *mogę* ("I can," the first-person verb) do different
      jobs in a sentence, even though they come from the same root --
      watch the last letter.

  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: "At what time?"
    gloss: "At what time?"
    note: "The standard way to ask for a specific time once a day is already agreed -- you may recall o której from the earlier time unit."

  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: "Ewa proposes the cinema"
    gloss: "Ewa asks if Marek wants to go to the cinema on Friday."
    note: "Reuses this unit's very first taught question, now inside a real conversation."
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: "Marek can't make Friday"
    gloss: "Marek says unfortunately, he can't on Friday."
    note: "Niestety softens the decline before nie mogę states it plainly."
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: "Marek proposes Saturday"
    gloss: "Marek asks, how about Saturday?"
    note: "Może offers an alternative instead of simply ending the conversation with a decline."
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: "Ewa accepts gladly"
    gloss: "Ewa says: Saturday? Gladly!"
    note: "Echoes the proposed day (keeping the w sobotę form) before accepting with chętnie."
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: "Ewa asks the time"
    gloss: "Ewa asks: At what time?"
    note: "With the day settled, the last detail to schedule is the time."
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: "Marek confirms the time"
    gloss: "Marek says: At four in the afternoon."
    note: "Closes the negotiation with a specific, agreed time, reusing the hour pattern from the earlier time and routines units."

exercises:
  pl.a1.unit11.lesson01.exercise01.select_chce:
    instruction: "Which word means 'I want'?"
    correct_option: "chcę"
    distractors: ["chcesz", "kino"]
    accepted_answers: ["chcę"]

  pl.a1.unit11.lesson01.exercise02.select_chcesz:
    instruction: "Which word means 'you want'?"
    correct_option: "chcesz"
    distractors: ["chcę", "razem"]
    accepted_answers: ["chcesz"]

  pl.a1.unit11.lesson01.exercise03.select_kino:
    instruction: "Which word means 'cinema'?"
    correct_option: "kino"
    distractors: ["razem", "chcesz"]
    accepted_answers: ["kino"]

  pl.a1.unit11.lesson01.exercise04.match_proposal_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "chcę": "I want"
      "chcesz": "you want"
      "kino": "cinema"
      "razem": "together"
      "iść": "to go"
      "piątek": "Friday"

  pl.a1.unit11.lesson01.exercise05.order_czy_chcesz_isc_do_kina:
    instruction: "Put the question 'Do you want to go to the cinema?' in order."
    correct_response: ["Czy", "chcesz", "iść", "do", "kina"]

  pl.a1.unit11.lesson01.exercise06.order_czy_chcesz_isc_razem_do_kina_w_piatek:
    instruction: "Put the question 'Do you want to go to the cinema together on Friday?' in order."
    correct_response: ["Czy", "chcesz", "iść", "razem", "do", "kina", "w", "piątek"]

  pl.a1.unit11.lesson01.exercise07.fill_chcesz:
    instruction: "Complete the question to ask 'Do you want to go to the cinema?'"
    accepted_answers: ["chcesz"]
    feedback: "Czy chcesz iść do kina? -- chcesz means 'you want.'"

  pl.a1.unit11.lesson01.exercise08.fix_chcesz_conjugation:
    instruction: "Fix the verb -- Polish says 'chcesz,' not the bare infinitive 'chcieć,' when asking someone directly."
    accepted_answers:
      - "Czy chcesz iść do kina?"
      - "Czy chcesz iść do kina"
    feedback: "Czy chcesz iść do kina?, not Czy chcieć iść do kina? -- chcesz is the conjugated 'you' form."

  pl.a1.unit11.lesson01.exercise09.speak_propose_cinema_friday:
    instruction: "Say 'Do you want to go to the cinema together on Friday?'"
    accepted_answers:
      - "Czy chcesz iść razem do kina w piątek?"
      - "Czy chcesz iść razem do kina w piątek"

  pl.a1.unit11.lesson02.exercise01.select_moge:
    instruction: "Which word means 'I can'?"
    correct_option: "mogę"
    distractors: ["możesz", "przyjść"]
    accepted_answers: ["mogę"]

  pl.a1.unit11.lesson02.exercise02.select_mozesz:
    instruction: "Which word means 'you can'?"
    correct_option: "możesz"
    distractors: ["mogę", "chętnie"]
    accepted_answers: ["możesz"]

  pl.a1.unit11.lesson02.exercise03.select_chetnie:
    instruction: "Which word means 'gladly'?"
    correct_option: "chętnie"
    distractors: ["niestety", "mogę"]
    accepted_answers: ["chętnie"]

  pl.a1.unit11.lesson02.exercise04.match_response_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "mogę": "I can"
      "możesz": "you can"
      "przyjść": "to come"
      "chętnie": "gladly"
      "niestety": "unfortunately"
      "sobotę": "Saturday"

  pl.a1.unit11.lesson02.exercise05.order_moge_przyjsc_w_piatek:
    instruction: "Put the sentence 'I can come on Friday' in order."
    correct_response: ["Mogę", "przyjść", "w", "piątek"]

  pl.a1.unit11.lesson02.exercise06.order_czy_mozesz_przyjsc_w_sobote:
    instruction: "Put the question 'Can you come on Saturday?' in order."
    correct_response: ["Czy", "możesz", "przyjść", "w", "sobotę"]

  pl.a1.unit11.lesson02.exercise07.fill_niestety_moge:
    instruction: "Complete the sentence to say 'Unfortunately, I can't.'"
    accepted_answers: ["mogę"]
    feedback: "Niestety, nie mogę -- mogę means 'I can,' so nie mogę means 'I can't.'"

  pl.a1.unit11.lesson02.exercise08.fix_sobote_accusative:
    instruction: "Fix the ending -- Polish says 'w sobotę,' not 'w sobota,' for 'on Saturday.'"
    accepted_answers:
      - "Czy możesz przyjść w sobotę?"
      - "Czy możesz przyjść w sobotę"
    feedback: "Czy możesz przyjść w sobotę?, not Czy możesz przyjść w sobota? -- sobota takes the -ę accusative ending after w, same as kawa -> kawę."

  pl.a1.unit11.lesson02.exercise09.speak_accept_saturday:
    instruction: "Say 'Yes, gladly! I can come on Saturday.'"
    accepted_answers:
      - "Tak, chętnie! Mogę przyjść w sobotę."
      - "Tak, chętnie. Mogę przyjść w sobotę."
      - "Tak, chętnie! Mogę przyjść w sobotę"

  pl.a1.unit11.lesson03.exercise01.select_propose_line:
    instruction: "Which line proposes going to the cinema?"
    correct_option: "Czy chcesz iść do kina w piątek?"
    distractors:
      - "Może w sobotę?"
      - "O której godzinie?"
    accepted_answers:
      - "Czy chcesz iść do kina w piątek?"
      - "Czy chcesz iść do kina w piątek"

  pl.a1.unit11.lesson03.exercise02.select_decline_line:
    instruction: "Which line declines Friday?"
    correct_option: "Niestety, nie mogę w piątek."
    distractors:
      - "Może w sobotę?"
      - "W sobotę? Bardzo chętnie!"
    accepted_answers:
      - "Niestety, nie mogę w piątek."
      - "Niestety, nie mogę w piątek"

  pl.a1.unit11.lesson03.exercise03.comprehend_marek_unavailable_day:
    instruction: "Read the line. What day can Marek NOT make it?"
    correct_option: "Friday"
    distractors:
      - "Saturday"
      - "Sunday"
    accepted_answers:
      - "piątek"
      - "Friday"

  pl.a1.unit11.lesson03.exercise04.comprehend_agreed_time:
    instruction: "Read the line. What time do they agree to meet?"
    correct_option: "four in the afternoon"
    distractors:
      - "seven in the morning"
      - "Friday"
    accepted_answers:
      - "o czwartej po południu"
      - "four in the afternoon"

  pl.a1.unit11.lesson03.exercise05.match_plans_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "chcesz": "you want"
      "mogę": "I can"
      "możesz": "you can"
      "przyjść": "to come"
      "chętnie": "gladly"
      "niestety": "unfortunately"
      "może": "maybe / how about"
      "kino": "cinema"
      "razem": "together"
      "sobotę": "Saturday"

  pl.a1.unit11.lesson03.exercise06.order_niestety_nie_moge_w_piatek:
    instruction: "Put the sentence 'Unfortunately, I can't on Friday' in order."
    correct_response: ["Niestety", "nie", "mogę", "w", "piątek"]

  pl.a1.unit11.lesson03.exercise07.order_moze_w_sobote:
    instruction: "Put the question 'How about Saturday?' in order."
    correct_response: ["Może", "w", "sobotę"]

  pl.a1.unit11.lesson03.exercise08.fill_moze:
    instruction: "Complete the question to say 'How about Saturday?'"
    accepted_answers: ["Może", "może"]
    feedback: "Może w sobotę? -- może means 'maybe' or 'how about.'"

  pl.a1.unit11.lesson03.exercise09.fix_moze_w_sobote_accusative:
    instruction: "Fix the ending -- Polish says 'w sobotę,' not 'w sobota,' for 'on Saturday.'"
    accepted_answers:
      - "Może w sobotę?"
      - "Może w sobotę"
    feedback: "Może w sobotę?, not Może w sobota? -- sobota takes the -ę accusative ending after w."

  pl.a1.unit11.lesson03.exercise10.reply_decline_friday:
    instruction: "Answer as Marek: say that unfortunately, you can't on Friday."
    accepted_answers:
      - "Niestety, nie mogę w piątek."
      - "Niestety, nie mogę w piątek"
      - "Niestety, w piątek nie mogę."

  pl.a1.unit11.lesson03.exercise11.speak_accept_saturday_glad:
    instruction: "Say 'Saturday? Gladly!'"
    accepted_answers:
      - "W sobotę? Bardzo chętnie!"
      - "W sobotę? Bardzo chętnie"
      - "W sobotę? Chętnie!"
