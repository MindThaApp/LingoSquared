answer_policy:
  diacritics: >-
    Same standing policy as pl's earlier units: display and teach all
    Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a
    variant with the diacritic dropped or swapped for its plain-letter
    equivalent when every other letter and word is correct. Punctuation
    marks (?, !) may be omitted in typed answers, but the fully
    punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and formal address
    (Marek, Pan, Pani).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish B1"

units:
  pl.b1.unit07.reklamacja:
    title: "Complaint"

lessons:
  pl.b1.unit07.lesson01.chcialbym_zlozyc_reklamacje:
    title: "I would like to make a complaint"
  pl.b1.unit07.lesson02.juz_dzwonilem:
    title: "I already called"
  pl.b1.unit07.lesson03.rozmowa_z_konsultantka:
    title: "Talking to the customer-service agent"
  pl.b1.unit07.lesson04.moja_reklamacja:
    title: "My complaint"

teaching:
  pl.b1.unit07.lesson01.teach.recap_words:
    title: "Is, I have, good, I would like -- again"
    gloss: "jest, mam, dobry, chciałbym -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson builds a formal complaint on top of them."

  pl.b1.unit07.lesson01.teach.zlozyc_reklamacje:
    title: "To make a complaint"
    gloss: "to make a complaint"
    note: "*reklamację* -- the accusative form of *reklamacja* (complaint)."
    example_gloss: "I would like to make a complaint."

  pl.b1.unit07.lesson01.teach.pralka:
    title: "Washing machine"
    gloss: "washing machine"
    note: "*nie działa* -- doesn't work."
    example_gloss: "My washing machine doesn't work."

  pl.b1.unit07.lesson01.teach.formal_note:
    title: "Chciałbym / chciałabym + infinitive"
    gloss: "\"Chciałbym\" (said by a man) / \"chciałabym\" (said by a woman) + infinitive -- the polite, formal opener for a complaint: *Chciałbym złożyć reklamację* (I would like to make a complaint)."
    note: "The formal-register opener this whole unit's complaint is built around, matching a stranger/service context rather than Ewa-and-Marek's usual informal ty."

  pl.b1.unit07.lesson01.teach.phrase_chcialbym_zlozyc:
    title: "I would like to make a complaint. My washing machine doesn't work."
    gloss: "I would like to make a complaint. My washing machine doesn't work."
    note: "A complete complaint-opening sentence pair, naming the problem."

  pl.b1.unit07.lesson02.teach.juz_dzwonilem:
    title: "I already called"
    gloss: "I already called"
    note: "*już* -- already."
    example_gloss: "I already called a week ago."

  pl.b1.unit07.lesson02.teach.tydzien_temu:
    title: "A week ago"
    gloss: "a week ago"
    note: "*temu* -- ago, follows the time expression."
    example_gloss: "I called a week ago."

  pl.b1.unit07.lesson02.teach.juz_note:
    title: "Już + past tense -- saying what already happened"
    gloss: "\"Już\" + a verb in the past tense -- describes what has already happened, important for a complaint: *Już dzwoniłem, ale nikt nie odpowiedział* (I already called, but no one answered)."
    note: "How to say what already happened, using a construction this course hasn't used before."

  pl.b1.unit07.lesson02.teach.kupilem:
    title: "I bought"
    gloss: "I bought"
    note: "Past tense, masculine, of *kupić* (to buy)."
    example_gloss: "I bought the washing machine two weeks ago."

  pl.b1.unit07.lesson03.teach.dzien_dobry_pomoc:
    title: "How can I help?"
    gloss: "how can I help?"
    note: "The standard formal customer-service phrase."
    example_gloss: "Good day, how can I help you?"

  pl.b1.unit07.lesson03.teach.czy_moge_prosic:
    title: "To ask for a replacement"
    gloss: "to ask for a replacement"
    note: "*wymianę* -- the accusative form of *wymiana* (replacement)."
    example_gloss: "Could I ask for a replacement?"

  pl.b1.unit07.lesson03.teach.przykro_mi:
    title: "I'm sorry, of course"
    gloss: "I'm sorry (to hear that), of course"
    note: "*wyślemy* -- we will send; *nową* -- new (feminine accusative, agreeing with pralkę)."
    example_gloss: "I'm sorry to hear that. Of course, we'll send you a new washing machine."

  pl.b1.unit07.teach.dialogue.line01:
    title: "The agent greets Marek"
    gloss: "Good day, how can I help?"
    note: "The formal opening line, addressed to a stranger."
  pl.b1.unit07.teach.dialogue.line02:
    title: "Marek states the problem"
    gloss: "Good day. I would like to make a complaint. My washing machine doesn't work."
    note: "The stated problem this lesson's exercises test."
  pl.b1.unit07.teach.dialogue.line03:
    title: "The agent asks when it was bought"
    gloss: "I'm sorry to hear that. When did you buy it?"
    note: "*Pan* -- the formal \"you\", addressing Marek."
  pl.b1.unit07.teach.dialogue.line04:
    title: "Marek explains what already happened"
    gloss: "I bought it two weeks ago. I already called a week ago, but no one answered."
    note: "The \"say what already happened\" fact this lesson's exercises test."
  pl.b1.unit07.teach.dialogue.line05:
    title: "Marek asks for a replacement"
    gloss: "Could I ask for a replacement?"
    note: "Marek uses the taught request frame directly, in his own voice."
  pl.b1.unit07.teach.dialogue.line06:
    title: "The agent apologizes and offers a resolution"
    gloss: "I'm very sorry for the delay. Could I offer a replacement, or would you prefer a repair?"
    note: "The concrete resolution offer, naming both options."
  pl.b1.unit07.teach.dialogue.line07:
    title: "Marek chooses a resolution"
    gloss: "I prefer a replacement, if that's possible."
    note: "Marek's stated preference -- the resolution requested, never contradicted elsewhere in the file."

  pl.b1.unit07.lesson04.teach.na_pewno:
    title: "Certainly, thank you for your patience"
    gloss: "certainly, thank you for your patience"
    note: "A polite closing pair for a resolved complaint."
    example_gloss: "We will certainly send you a new washing machine. Thank you for your patience."

  pl.b1.unit07.lesson04.teach.review_note:
    title: "A full complaint has three parts"
    gloss: "A full complaint: 1) *chciałbym złożyć reklamację* (state what's wrong), 2) *już dzwoniłem/kupiłem* (say what already happened), 3) *czy mogę prosić o wymianę* (a concrete resolution)."
    note: "The three-part structure of a complaint, reviewed together before this lesson's final writing task."

