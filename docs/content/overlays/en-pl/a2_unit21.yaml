  required_next_reviewer: native_speaker_pass
  notes: >-
    First en-pl A2 overlay, written for pl/a2_unit21_sprawy_urzedowe.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start). No
    sibling-direction overlay exists yet for this unit (pl-en hasn't been
    authored), so the sibling-isolation rule (AUTHORING_GUIDE §8) doesn't
    apply -- noted for whoever authors pl-en next: do not open this file for
    structure/phrasing reference when doing so.

    Every multi-clause accepted_answers list carries both a comma-joined
    (canonical, matching the realization's own punctuation) and a
    period-joined form per §12, for the two exercises whose answer is a full
    reason clause (lesson02.exercise08, lesson03's dialogue is comprehension/
    reading only so no multi-clause production answer there beyond the
    reason clause already covered in lesson02). Every note/feedback string
    mixing Polish text inline with English explanation wraps the Polish in
    *asterisks* per §15. Every matching_pairs correct_response and
    word_order correct_response checked token-for-token against the
    realization file's own pairs/word_bank. No stray YAML boolean coercion
    (grepped for unquoted yes/no/true/false). Pending fresh-context review
    per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    teach.urzad example_gloss -- "I'm going to the office." -> "This is an
    office." (gloss did not match *To jest urząd.*); lesson01.exercise06 /
    lesson02.exercise04 / lesson02.exercise05 word_order -- correct_response
    -> accepted_answers adding the valid clitic placements of *się* (e.g.
    *Chcę się zameldować w urzędzie*, *...ponieważ przeprowadziłam się*, *Do
    kiedy muszę zameldować się*), which were graded wrong
    (missing-accepted-answer; compiler emits intentional permutation WARNs);
    lesson02.exercise06 -- added *bo* (taught in A1 unit13/19, fits the
    blank); lesson02.exercise08 + exercise10 -- added *się*-placement and *bo*
    variants; exercise10 instruction pinned to Ewa ("As Ewa, say") since
    chciałabym/przeprowadziłam are feminine (underdetermined-prompt);
    lesson02.exercise07/09 + lesson03.exercise11 -- added *Do kiedy muszę
    zameldować się?*; lesson03.exercise05 -- instruction rewritten to match
    the now-shown clerk line; lesson03.exercise10 -- added *Ulica Kwiatowa
    10.*, *Kwiatowa dziesięć.*, *Kwiatowa 10.* (digit/street-word-dropped
    answers were graded wrong).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-20: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !, ,) may
    be omitted or varied in typed answers, but the fully punctuated form
    remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek) and proper
    nouns (Kwiatowa).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit21.sprawy_urzedowe:
    title: "Official matters"

lessons:
  pl.a2.unit21.lesson01.slownictwo_urzedowe:
    title: "Office vocabulary"
  pl.a2.unit21.lesson02.chcialabym_sie_zameldowac:
    title: "I would like to register"
  pl.a2.unit21.lesson03.w_urzedzie:
    title: "At the office"

teaching:
  pl.a2.unit21.lesson01.teach.recap_words:
    title: "Good day, please, thank you -- again"
    gloss: "Dzień, dobry, Proszę, dziękuję, jest, mam, nowy, chcę, w, i -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson uses them to talk about a visit to the office."

  pl.a2.unit21.lesson01.teach.urzad:
    title: "Office"
    gloss: "office (government/administrative)"
    note: "The general word for a government office."
    example_gloss: "This is an office."

  pl.a2.unit21.lesson01.teach.adres:
    title: "Address"
    gloss: "address"
    note: "A masculine noun."
    example_gloss: "I have a new address."

  pl.a2.unit21.lesson01.teach.dokumenty:
    title: "Documents"
    gloss: "documents"
    note: "The plural of *dokument*."
    example_gloss: "Documents, please."

  pl.a2.unit21.lesson01.teach.dowod_osobisty:
    title: "ID card"
    gloss: "ID card"
    note: "Poland's standard national identity card."
    example_gloss: "This is my ID card."

  pl.a2.unit21.lesson01.teach.zameldowac_sie:
    title: "To register (residence)"
    gloss: "to register one's residence"
    note: "The official verb for registering where you live -- a required civic step after moving in Poland."
    example_gloss: "I want to register my residence at the office."

  pl.a2.unit21.lesson01.teach.mieszkanie_recap:
    title: "Apartment -- again"
    gloss: "apartment"
    note: "You already know this word from the housing lesson; redeclared here since this is a new file."
    example_gloss: "I have a new apartment."

  pl.a2.unit21.lesson02.teach.chcialabym_note:
    title: "I would like to -- feminine polite form"
    gloss: "Chciałabym -- the polite form of \"chcę\", used by a woman in formal situations (a man would say \"chciałbym\"). An official may ask: \"W czym mogę pomóc?\" (How can I help?)"
    note: "This is a real new grammar point (the conditional mood), not just a harder word -- it's the natural way to soften a request in an official setting."

  pl.a2.unit21.lesson02.teach.poniewaz_note:
    title: "Because"
    gloss: "ponieważ -- joins a clause with the reason, e.g. \"..., ponieważ się przeprowadziłam\" (..., because I moved)."
    note: "A real subordinate clause -- an A2 step up from A1's short standalone statements."

  pl.a2.unit21.lesson02.teach.przeprowadzilam_sie:
    title: "I moved (feminine)"
    gloss: "I moved / relocated (feminine)"
    note: "Past tense of the reflexive verb *przeprowadzić się*. A man would say *przeprowadziłem się*."
    example_gloss: "I moved last week."

  pl.a2.unit21.lesson02.teach.chcialabym_sie_zameldowac_phrase:
    title: "I would like to register, because I moved"
    gloss: "I would like to register, because I moved."
    note: "The polite request plus its reason, in one sentence -- this unit's key A2 construction."

  pl.a2.unit21.lesson02.teach.musze_note:
    title: "I must / have to"
    gloss: "muszę -- \"I must / I have to\", e.g. \"Do kiedy muszę się zameldować?\" (By when do I have to register?)"
    note: "A modal verb used to ask about an obligation or deadline."

  pl.a2.unit21.lesson02.teach.do_kiedy_musze_phrase:
    title: "By when do I have to register?"
    gloss: "By when do I have to register?"
    note: "A natural follow-up question once the clerk has heard the request."

  pl.a2.unit21.lesson03.teach.recap_words:
    title: "Madam, what kind of, is -- again"
    gloss: "pani, jaki, jest -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson's office dialogue."

  pl.a2.unit21.lesson03.teach.w_czym_moge_pomoc:
    title: "How can I help?"
    gloss: "How can I help?"
    note: "The standard way a Polish clerk or clerk-like service worker opens an interaction."

  pl.a2.unit21.lesson03.teach.umowa_najmu:
    title: "Lease agreement"
    gloss: "lease agreement"
    note: "The rental contract, one of the two documents Ewa needs to bring."
    example_gloss: "I have a lease agreement."

  pl.a2.unit21.lesson03.teach.trzydziesci_dni:
    title: "Thirty days"
    gloss: "thirty days"
    note: "The registration deadline stated in this unit's dialogue."
    example_gloss: "I have thirty days."

  pl.a2.unit21.teach.dialogue.line01:
    title: "The clerk greets Ewa"
    gloss: "Good day! How can I help?"
    note: "Urzędniczka (the clerk) opens with the same polite register unit07's shopkeeper used."
  pl.a2.unit21.teach.dialogue.line02:
    title: "Ewa states her request and reason"
    gloss: "I would like to register, because I moved."
    note: "Ewa uses the polite conditional plus the reason clause this lesson just taught."
  pl.a2.unit21.teach.dialogue.line03:
    title: "The clerk asks for the new address"
    gloss: "What is your new address, madam?"
    note: "A direct, formal question."
  pl.a2.unit21.teach.dialogue.line04:
    title: "Ewa gives her address"
    gloss: "Kwiatowa Street, ten."
    note: "The Polish convention of street name followed by the building number."
  pl.a2.unit21.teach.dialogue.line05:
    title: "The clerk lists the required documents"
    gloss: "ID card and lease agreement, please."
    note: "The two documents needed, matching what lesson02's own note already flagged."
  pl.a2.unit21.teach.dialogue.line06:
    title: "Ewa hands them over and asks the deadline"
    gloss: "Here you go. By when do I have to register?"
    note: "Ewa reuses lesson02's own deadline question."
  pl.a2.unit21.teach.dialogue.line07:
    title: "The clerk gives the deadline and confirms"
    gloss: "You have thirty days from the move. Thank you, everything's ready."
    note: "Closes the exchange with the deadline fact this unit establishes only once."

exercises:
  pl.a2.unit21.lesson01.exercise01.select_urzad:
    instruction: "Which word means 'office'?"
    correct_option: "urząd"
    distractors: ["adres", "dokumenty"]
    accepted_answers: ["urząd"]

  pl.a2.unit21.lesson01.exercise02.select_adres:
    instruction: "Which word means 'address'?"
    correct_option: "adres"
    distractors: ["urząd", "dokumenty"]
    accepted_answers: ["adres"]

  pl.a2.unit21.lesson01.exercise03.select_zameldowac_sie:
    instruction: "Which phrase means 'to register (residence)'?"
    correct_option: "zameldować się"
    distractors: ["urząd", "dowód osobisty"]
    accepted_answers: ["zameldować się"]

  pl.a2.unit21.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "urząd": "office"
      "adres": "address"
      "dokumenty": "documents"
      "dowód osobisty": "ID card"
      "zameldować się": "to register (residence)"
      "mieszkanie": "apartment"

  pl.a2.unit21.lesson01.exercise05.order_mam_nowy_adres:
    instruction: "Put the sentence 'I have a new address' in order."
    correct_response: ["Mam", "nowy", "adres"]

  pl.a2.unit21.lesson01.exercise06.order_chce_zameldowac_sie:
    instruction: "Put the sentence 'I want to register at the office' in order."
    accepted_answers:
      - "Chcę zameldować się w urzędzie"
      - "Chcę się zameldować w urzędzie"

  pl.a2.unit21.lesson01.exercise07.fill_prosze_dokumenty:
    instruction: "Complete the sentence: 'The clerk says: ___, please.' (documents)"
    accepted_answers: ["dokumenty"]
    feedback: "Proszę dokumenty -- dokumenty is the word for documents."

  pl.a2.unit21.lesson01.exercise08.fix_mam_nowy_adres:
    instruction: "Fix the word order -- put the sentence 'I have a new address' in the natural order."
    accepted_answers:
      - "Mam nowy adres."
      - "Mam nowy adres"
    feedback: "Mam nowy adres, not Nowy mam adres -- the verb comes first, then the adjective and noun together."

  pl.a2.unit21.lesson01.exercise09.write_dowod_osobisty:
    instruction: "Write the Polish phrase for 'ID card'."
    accepted_answers:
      - "dowód osobisty"

  pl.a2.unit21.lesson02.exercise01.select_chcialabym_sie_zameldowac:
    instruction: "Which sentence politely says 'I would like to register'?"
    correct_option: "Chciałabym się zameldować."
    distractors: ["Mam nowy adres.", "Proszę dokumenty."]
    accepted_answers:
      - "Chciałabym się zameldować."
      - "Chciałabym się zameldować"

  pl.a2.unit21.lesson02.exercise02.select_reason_clause:
    instruction: "Which sentence gives a reason using 'because'?"
    correct_option: "Chciałabym się zameldować, ponieważ się przeprowadziłam."
    distractors: ["Mam nowy adres.", "Do kiedy muszę się zameldować?"]
    accepted_answers:
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam."
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam"

  pl.a2.unit21.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "urząd": "office"
      "adres": "address"
      "dokumenty": "documents"
      "zameldować się": "to register (residence)"
      "Chciałabym": "I would like (feminine)"
      "ponieważ": "because"
      "przeprowadziłam się": "I moved (feminine)"
      "muszę": "I must / have to"

  pl.a2.unit21.lesson02.exercise04.order_chcialabym_sie_zameldowac:
    instruction: "Put the sentence 'I would like to register, because I moved' in order (no punctuation needed)."
    accepted_answers:
      - "Chciałabym się zameldować ponieważ się przeprowadziłam"
      - "Chciałabym się zameldować ponieważ przeprowadziłam się"
      - "Chciałabym zameldować się ponieważ się przeprowadziłam"
      - "Chciałabym zameldować się ponieważ przeprowadziłam się"

  pl.a2.unit21.lesson02.exercise05.order_do_kiedy_musze:
    instruction: "Put the question 'By when do I have to register?' in order."
    accepted_answers:
      - "Do kiedy muszę się zameldować"
      - "Do kiedy muszę zameldować się"

  pl.a2.unit21.lesson02.exercise06.fill_poniewaz_reason:
    instruction: "Complete the sentence: 'I would like to register, ___ I moved.' (because)"
    accepted_answers: ["ponieważ", "bo"]
    feedback: "Chciałabym się zameldować, ponieważ się przeprowadziłam -- ponieważ introduces the reason."

  pl.a2.unit21.lesson02.exercise07.fix_do_kiedy_musze:
    instruction: "Fix the word order -- put the question 'By when do I have to register?' in the natural order."
    accepted_answers:
      - "Do kiedy muszę się zameldować?"
      - "Do kiedy muszę się zameldować"
      - "Do kiedy muszę zameldować się?"
    feedback: "Do kiedy muszę się zameldować?, not Muszę się do kiedy zameldować? -- Do kiedy comes first in this question."

  pl.a2.unit21.lesson02.exercise08.reply_dlaczego_chce_sie_zameldowac:
    instruction: "The clerk asks: 'How can I help?' Answer as Ewa: say you'd like to register, because you moved."
    accepted_answers:
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam."
      - "Chciałabym się zameldować. Ponieważ się przeprowadziłam."
      - "Chciałabym się zameldować, ponieważ przeprowadziłam się."
      - "Chciałabym zameldować się, ponieważ się przeprowadziłam."
      - "Chciałabym zameldować się, ponieważ przeprowadziłam się."
      - "Chciałabym się zameldować, bo się przeprowadziłam."
      - "Chciałabym się zameldować, bo przeprowadziłam się."

  pl.a2.unit21.lesson02.exercise09.write_do_kiedy_musze:
    instruction: "Write the question: 'By when do I have to register?'"
    accepted_answers:
      - "Do kiedy muszę się zameldować?"
      - "Do kiedy muszę się zameldować"
      - "Do kiedy muszę zameldować się?"

  pl.a2.unit21.lesson02.exercise10.speak_chcialabym_sie_zameldowac:
    instruction: "As Ewa, say: 'I would like to register, because I moved.'"
    accepted_answers:
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam."
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam"
      - "Chciałabym się zameldować, ponieważ przeprowadziłam się."
      - "Chciałabym zameldować się, ponieważ się przeprowadziłam."
      - "Chciałabym zameldować się, ponieważ przeprowadziłam się."
      - "Chciałabym się zameldować, bo się przeprowadziłam."
      - "Chciałabym się zameldować, bo przeprowadziłam się."

  pl.a2.unit21.lesson03.exercise01.select_ewa_gives_address:
    instruction: "Which line gives Ewa's new address?"
    correct_option: "Ulica Kwiatowa dziesięć."
    distractors:
      - "Chciałabym się zameldować, ponieważ się przeprowadziłam."
      - "Proszę bardzo. Do kiedy muszę się zameldować?"
    accepted_answers:
      - "Ulica Kwiatowa dziesięć."
      - "Ulica Kwiatowa dziesięć"

  pl.a2.unit21.lesson03.exercise02.select_documents_line:
    instruction: "Which line lists the required documents?"
    correct_option: "Proszę dowód osobisty i umowę najmu."
    distractors:
      - "Dzień dobry! W czym mogę pomóc?"
      - "Ma pani trzydzieści dni od przeprowadzki. Dziękuję, wszystko gotowe."
    accepted_answers:
      - "Proszę dowód osobisty i umowę najmu."
      - "Proszę dowód osobisty i umowę najmu"

  pl.a2.unit21.lesson03.exercise03.comprehend_deadline:
    instruction: "Read the line. How many days does Ewa have to register?"
    correct_option: "thirty days"
    distractors:
      - "ten days"
      - "three days"
    accepted_answers:
      - "trzydzieści dni"
      - "thirty days"

  pl.a2.unit21.lesson03.exercise04.comprehend_reason:
    instruction: "Read the line. Why does Ewa need to register?"
    correct_option: "she moved"
    distractors:
      - "she lost her ID card"
      - "she got married"
    accepted_answers:
      - "przeprowadziłam"
      - "she moved"

  pl.a2.unit21.lesson03.exercise05.read_required_documents:
    instruction: "Read the clerk's line. What documents does she ask for?"
    correct_option: "ID card and lease agreement"
    distractors:
      - "a passport and a photo"
      - "nothing, just her name"
    accepted_answers:
      - "dowód osobisty i umowę najmu"
      - "ID card and lease agreement"

  pl.a2.unit21.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "urząd": "office"
      "adres": "address"
      "dokumenty": "documents"
      "dowód osobisty": "ID card"
      "zameldować się": "to register (residence)"
      "umowa najmu": "lease agreement"
      "trzydzieści dni": "thirty days"
      "przeprowadziłam się": "I moved (feminine)"

  pl.a2.unit21.lesson03.exercise07.order_w_czym_moge_pomoc:
    instruction: "Put the question 'How can I help?' in order."
    correct_response: ["W", "czym", "mogę", "pomóc"]

  pl.a2.unit21.lesson03.exercise08.fill_umowe_najmu:
    instruction: "Complete the sentence: 'The clerk says: ID card and ___, please.' (lease agreement)"
    accepted_answers: ["umowę najmu"]
    feedback: "Proszę dowód osobisty i umowę najmu -- umowę najmu is the accusative form of umowa najmu, used after proszę."

  pl.a2.unit21.lesson03.exercise09.fix_jaki_jest_adres:
    instruction: "Fix the word order -- put the question 'What is your new address, madam?' in the natural order."
    accepted_answers:
      - "Jaki jest pani nowy adres?"
      - "Jaki jest pani nowy adres"
    feedback: "Jaki jest pani nowy adres?, not Pani jest jaki nowy adres? -- Jaki jest comes first in this question."

  pl.a2.unit21.lesson03.exercise10.reply_jaki_jest_adres:
    instruction: "Answer as Ewa: give your address, Kwiatowa Street, ten."
    accepted_answers:
      - "Ulica Kwiatowa dziesięć."
      - "Ulica Kwiatowa dziesięć"
      - "Ulica Kwiatowa 10."
      - "Kwiatowa dziesięć."
      - "Kwiatowa 10."

  pl.a2.unit21.lesson03.exercise11.speak_do_kiedy_musze:
    instruction: "Say: 'By when do I have to register?'"
    accepted_answers:
      - "Do kiedy muszę się zameldować?"
      - "Do kiedy muszę się zameldować"
      - "Do kiedy muszę zameldować się?"
