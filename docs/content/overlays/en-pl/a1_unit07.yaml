teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: "Banana"
    gloss: "banana"
    note: "A common fruit, sold by the piece or by weight at any market or shop."
    example_gloss: "This is a banana."

  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: "Tomato, cucumber"
    gloss: "tomato; cucumber"
    note: "Both masculine-inanimate -- their genitive plural forms (pomidorów, ogórków) will matter once you're buying them by the kilo, later in this unit."
    example_gloss:
      - "This is a tomato."
      - "This is a cucumber."

  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: "Potato, onion"
    gloss: "potato; onion"
    note: "Ziemniak is masculine-inanimate (same -ów genitive-plural family as banan and pomidor); cebula is feminine."
    example_gloss:
      - "This is a potato."
      - "This is an onion."

  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: "Cheap, expensive"
    gloss: "cheap(ly); expensive(ly)"
    note: >-
      *Tanio* and *drogo* are adverbs, and Polish pairs them directly
      with *kosztować* ("to cost") the way English pairs "cost a lot"
      with an adverb -- *To kosztuje drogo* literally means "that costs
      expensively," i.e. "that's expensive."
    example_gloss:
      - "Very cheap!"
      - "Very expensive!"

  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: "To cost: kosztuje, kosztują"
    gloss: "to cost: it costs (one thing), they cost (more than one) -- A banana is cheap. Bananas are cheap."
    note: >-
      *Kosztować* is the verb "to cost." Use *kosztuje* for one item and
      *kosztują* for more than one -- exactly like *jest*/*są* ("is"/
      "are"), but for prices. Getting this agreement right matters: a
      market vendor will understand you either way, but *banany
      kosztują* is what a native speaker actually says.

  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: "How much does a banana cost?"
    gloss: "How much does a banana cost?"
    note: "The everyday question to open a price negotiation -- *Ile* (how much) plus the singular *kosztuje*, since one banana is being asked about."

  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: "Grapefruit"
    gloss: "grapefruit"
    note: "Masculine-inanimate, like pomidor and ziemniak -- no ending change after proszę o."
    example_gloss: "This is a grapefruit."

  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: "Tangerine, orange"
    gloss: "tangerine; orange"
    note: "Both feminine, like kawa and herbata back in the food unit -- their accusative forms would swap -a for -ę, though this lesson only needs their plain dictionary form."
    example_gloss:
      - "This is a tangerine."
      - "This is an orange."

  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: "A kilo, half a kilo"
    gloss: "a kilo; half a kilo"
    note: "*Kilo* never changes its own ending, no matter what you're weighing or how many of it you ask for -- it's the noun that follows *kilo* that changes, as this lesson's grammar note explains."
    example_gloss:
      - "A kilo of tomatoes, please."
      - "Half a kilo of bananas, please."

  pl.a1.unit07.lesson02.teach.poprosze:
    title: "I'd like (please)"
    gloss: "I'd like / please give me"
    note: >-
      *Poproszę* is a slightly more polished, everyday alternative to
      *proszę o* from the food unit -- both mean roughly "I'd like,"
      and Polish speakers move between the two freely. *Poproszę* is
      followed directly by the thing you want, no *o* needed.
    example_gloss: "I'd like a grapefruit, please."

  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: "After 'kilo': the -ów ending"
    gloss: "Genitive plural after 'kilo': banana -> of bananas, tomato -> of tomatoes, potato -> of potatoes."
    note: >-
      When you name a quantity by weight -- *kilo*, *pół kilo* -- the
      noun that follows shifts into a different form, the genitive
      plural. For these three regular masculine nouns, that just means
      adding *-ów*: *banan* becomes *bananów*, *pomidor* becomes
      *pomidorów*, *ziemniak* becomes *ziemniaków*.

  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: "A kilo of tomatoes, please"
    gloss: "A kilo of tomatoes, please."
    note: "Puts the grammar note's -ów pattern to work in a real request -- pomidor becomes pomidorów after kilo."

  pl.a1.unit07.lesson03.teach.dla:
    title: "For"
    gloss: "for"
    note: "A simple preposition -- a vendor uses it to ask who an item is for, addressing a customer formally."
    example_gloss: "This is for you."

  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: "Fresh, very"
    gloss: "fresh; very"
    note: "Two everyday words a market vendor reaches for constantly -- praising how fresh something is, or how cheap/expensive it is."
    example_gloss:
      - "The tomatoes are fresh."
      - "Very cheap!"

  pl.a1.unit07.lesson03.teach.trochę:
    title: "A bit"
    gloss: "a bit / a little"
    note: "Softens a complaint politely -- trochę drogo (\"a bit expensive\") is much more natural in a friendly haggle than a flat drogo alone."
    example_gloss: "A bit expensive."

  pl.a1.unit07.lesson03.teach.razem:
    title: "Total / together"
    gloss: "total / together"
    note: "What a vendor says right before naming the final amount you owe."
    example_gloss: "Ten zlotys total."

  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: "What would you like?"
    gloss: "What would you like?"
    note: "Literally \"what for you (formal)\" -- a vendor's natural opening question to a customer."

  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: "The vendor greets Ewa"
    gloss: "The vendor says hello and asks Ewa what she'd like."
    note: "Dzień dobry, reused from unit 1's greetings."
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: "Ewa asks about bananas"
    gloss: "Ewa asks how much the bananas cost."
    note: "Kosztują -- the plural form from this unit's own grammar note, since bananas are being asked about as a group."
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: "The vendor names the price"
    gloss: "The vendor says five zlotys a kilo, and that they're very fresh."
    note: "A natural elliptical price phrase -- \"[price] kilo\" is how a Polish vendor states a per-kilo rate, no extra word for \"per\" needed."
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: "Ewa orders bananas"
    gloss: "Ewa says okay, and asks for a kilo of bananas."
    note: "Combines poproszę with kilo + bananów, the exact pattern from lesson 2's grammar note."
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: "The vendor mentions tomatoes"
    gloss: "The vendor asks about tomatoes too, and says they're eight zlotys a kilo."
    note: "The same elliptical price pattern as line 3, now for a different item."
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: "Ewa haggles gently and orders"
    gloss: "Ewa says it's a bit expensive, but she'll take half a kilo."
    note: "Trochę drogo softens the complaint -- Ewa still buys, just a smaller quantity."
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: "The vendor states the total"
    gloss: "The vendor says here you are, and that the total is nine zlotys."
    note: "5 złotych for the bananas plus 4 złotych for the half-kilo of tomatoes -- nine złotych total, matching every price stated earlier in the scene."

exercises:
  pl.a1.unit07.lesson01.exercise01.select_banan:
    instruction: "Which word means 'banana'?"
    correct_option: "banan"
    distractors: ["pomidor", "ziemniak"]
    accepted_answers: ["banan"]

  pl.a1.unit07.lesson01.exercise02.select_pomidor:
    instruction: "Which word means 'tomato'?"
    correct_option: "pomidor"
    distractors: ["ogórek", "cebula"]
    accepted_answers: ["pomidor"]

  pl.a1.unit07.lesson01.exercise03.select_ziemniak:
    instruction: "Which word means 'potato'?"
    correct_option: "ziemniak"
    distractors: ["cebula", "pomidor"]
    accepted_answers: ["ziemniak"]

  pl.a1.unit07.lesson01.exercise04.match_produce_words:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "banan": "banana"
      "pomidor": "tomato"
      "ogórek": "cucumber"
      "ziemniak": "potato"
      "cebula": "onion"
      "tanio": "cheap"
      "drogo": "expensive"

  pl.a1.unit07.lesson01.exercise05.order_ile_kosztuje_banan:
    instruction: "Put the question 'How much does a banana cost?' in order."
    correct_response: ["Ile", "kosztuje", "banan"]

  pl.a1.unit07.lesson01.exercise06.order_ile_kosztuja_banany:
    instruction: "Put the question 'How much do bananas cost?' in order."
    correct_response: ["Ile", "kosztują", "banany"]

  pl.a1.unit07.lesson01.exercise07.fill_kosztuje:
    instruction: "Complete the sentence to say 'The banana costs a lot.'"
    accepted_answers: ["kosztuje"]
    feedback: "Banan kosztuje drogo -- one banana takes the singular kosztuje."

  pl.a1.unit07.lesson01.exercise08.fix_kosztuje_agreement:
    instruction: "Fix the verb -- bananas (plural) need kosztują, not kosztuje."
    accepted_answers:
      - "Banany kosztują tanio."
      - "Banany kosztują tanio"
    feedback: "Banany kosztują tanio, not Banany kosztuje tanio -- a plural subject needs kosztują."

  pl.a1.unit07.lesson01.exercise09.speak_ile_kosztuje_pomidor:
    instruction: "Say 'How much does the tomato cost?'"
    accepted_answers:
      - "Ile kosztuje pomidor?"
      - "Ile kosztuje pomidor"

  pl.a1.unit07.lesson02.exercise01.select_grejpfrut:
    instruction: "Which word means 'grapefruit'?"
    correct_option: "grejpfrut"
    distractors: ["mandarynka", "pomarańcza"]
    accepted_answers: ["grejpfrut"]

  pl.a1.unit07.lesson02.exercise02.select_mandarynka:
    instruction: "Which word means 'tangerine'?"
    correct_option: "mandarynka"
    distractors: ["pomarańcza", "grejpfrut"]
    accepted_answers: ["mandarynka"]

  pl.a1.unit07.lesson02.exercise03.select_pomarancza:
    instruction: "Which word means 'orange'?"
    correct_option: "pomarańcza"
    distractors: ["grejpfrut", "mandarynka"]
    accepted_answers: ["pomarańcza"]

  pl.a1.unit07.lesson02.exercise04.match_more_produce_words:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "grejpfrut": "grapefruit"
      "mandarynka": "tangerine"
      "pomarańcza": "orange"
      "kilo": "kilogram"
      "pół": "half"
      "poproszę": "I'd like / please"
      "banan": "banana"
      "pomidor": "tomato"

  pl.a1.unit07.lesson02.exercise05.order_poprosze_kilo_pomidorow:
    instruction: "Put the request 'A kilo of tomatoes, please' in order."
    correct_response: ["Poproszę", "kilo", "pomidorów"]

  pl.a1.unit07.lesson02.exercise06.order_pol_kilo_bananow:
    instruction: "Put the phrase 'half a kilo of bananas' in order."
    correct_response: ["pół", "kilo", "bananów"]

  pl.a1.unit07.lesson02.exercise07.fill_genitive_pomidorow:
    instruction: "Complete the sentence to say 'A kilo of tomatoes, please.'"
    accepted_answers: ["pomidorów"]
    feedback: "Poproszę kilo pomidorów -- pomidor becomes pomidorów after kilo."

  pl.a1.unit07.lesson02.exercise08.fix_genitive_ending:
    instruction: "Fix the ending -- after kilo, banan needs its genitive plural form."
    accepted_answers:
      - "Poproszę kilo bananów."
      - "Poproszę kilo bananów"
    feedback: "Poproszę kilo bananów, not Poproszę kilo banany -- banan becomes bananów as the object of kilo."

  pl.a1.unit07.lesson02.exercise09.speak_pol_kilo_ziemniakow:
    instruction: "Say 'Half a kilo of potatoes, please.'"
    accepted_answers:
      - "Poproszę pół kilo ziemniaków."
      - "Poproszę pół kilo ziemniaków"
      - "Proszę pół kilo ziemniaków."
      - "Proszę pół kilo ziemniaków"

  pl.a1.unit07.lesson03.exercise01.select_what_would_you_like:
    instruction: "Which question asks what the customer would like?"
    correct_option: "Co dla pani?"
    distractors: ["Ile kosztują banany?", "Razem dziewięć złotych."]
    accepted_answers:
      - "Co dla pani?"
      - "Co dla pani"

  pl.a1.unit07.lesson03.exercise02.select_banana_price:
    instruction: "Which line states the price of the bananas?"
    correct_option: "Pięć złotych kilo, bardzo świeże."
    distractors: ["Co dla pani?", "Razem dziewięć złotych."]
    accepted_answers:
      - "Pięć złotych kilo, bardzo świeże."

  pl.a1.unit07.lesson03.exercise03.comprehend_tomato_price:
    instruction: "Read the line. How much do the tomatoes cost per kilo?"
    correct_option: "eight zlotys"
    distractors:
      - "five zlotys"
      - "nine zlotys"
    accepted_answers:
      - "osiem złotych"
      - "osiem"
      - "eight zlotys"
      - "eight"

  pl.a1.unit07.lesson03.exercise04.comprehend_total:
    instruction: "Read the line. What is the total?"
    correct_option: "nine zlotys"
    distractors:
      - "five zlotys"
      - "eight zlotys"
    accepted_answers:
      - "dziewięć złotych"
      - "dziewięć"
      - "nine zlotys"
      - "nine"

  pl.a1.unit07.lesson03.exercise05.match_market_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "dla": "for"
      "świeże": "fresh"
      "bardzo": "very"
      "trochę": "a bit"
      "razem": "total / together"
      "dziewięć": "nine"
      "osiem": "eight"
      "pięć": "five"

  pl.a1.unit07.lesson03.exercise06.order_co_dla_pani:
    instruction: "Put the question 'What would you like?' in order."
    correct_response: ["Co", "dla", "pani"]

  pl.a1.unit07.lesson03.exercise07.order_poprosze_kilo_bananow:
    instruction: "Put the request 'A kilo of bananas, please' in order."
    correct_response: ["Poproszę", "kilo", "bananów"]

  pl.a1.unit07.lesson03.exercise08.fill_total:
    instruction: "Complete the sentence to say 'Nine zlotys total.'"
    accepted_answers: ["dziewięć"]
    feedback: "Razem dziewięć złotych -- the price stated earlier in the scene (5 for bananas + 4 for the tomatoes)."

  pl.a1.unit07.lesson03.exercise09.fix_verb_agreement:
    instruction: "Fix the verb -- tomatoes (plural) need kosztują, not kosztuje."
    accepted_answers:
      - "Pomidory kosztują osiem złotych kilo."
      - "Pomidory kosztują osiem złotych kilo"
    feedback: "Pomidory kosztują osiem złotych kilo, not Pomidory kosztuje -- a plural subject needs kosztują."

  pl.a1.unit07.lesson03.exercise10.reply_ile_kosztuja_pomidory:
    instruction: "Answer as the vendor: tomatoes cost eight zlotys a kilo."
    accepted_answers:
      - "Osiem złotych kilo."
      - "Osiem złotych kilo"
      - "Pomidory kosztują osiem złotych kilo."
      - "Pomidory kosztują osiem złotych kilo"
      - "Kosztują osiem złotych kilo."
      - "Kosztują osiem złotych kilo"

  pl.a1.unit07.lesson03.exercise11.speak_trochę_drogo_pol_kilo:
    instruction: "Say: 'A bit expensive, but I'll take half a kilo.'"
    accepted_answers:
      - "Trochę drogo, ale poproszę pół kilo."
      - "Trochę drogo ale poproszę pół kilo."
      - "Trochę drogo ale poproszę pół kilo"
