answer_policy:
  diacritics: 'Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks may be omitted or varied in typed answers.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and proper nouns.
  gender: Where the English prompt does not show the speaker's gender, accept both the masculine (-łem, -łeś) and feminine (-łam, -łaś) past forms.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: "Polish A2"
  description: "Intermediate Polish continuing the Ewa and Marek storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Polish with the right form and aspect for each situation."
units:
  pl.a2.unit73.co_sie_dzialo: {"title": "What Was Going On", "description": "Say what was going on when something else happened, using the imperfective past for the background, the perfective past for the interruption, and weather expressions."}
lessons:
  pl.a2.unit73.lesson01.co_robiles: {"title": "What Were You Doing?"}
  pl.a2.unit73.lesson02.nagle_zadzwonil_telefon: {"title": "Suddenly the Phone Rang"}
  pl.a2.unit73.lesson03.gotowalem_kiedy: {"title": "I Was Cooking When the Phone Rang"}
  pl.a2.unit73.lesson04.maly_incydent: {"title": "A Small Incident"}
  pl.a2.unit73.lesson05.deszczowy_wieczor: {"title": "A Rainy Evening"}
  pl.a2.unit73.lesson06.ewa_i_marek: {"title": "Ewa and Marek Talk"}
teaching:
  pl.a2.unit73.lesson01.teach.czynnosci: {"title": "Activities", "gloss": "to cook / to read / to go on foot / to watch / to sleep / to wait", "note": "These verbs name actions that take time. In the past they say what was going on.", "example_gloss": ["Marek was cooking dinner.", "Ewa was reading a book.", "We were walking home.", "Marek was sleeping.", "Ewa was watching a film.", "We were watching a film.", "We were waiting for the bus."]}
  pl.a2.unit73.lesson01.teach.gn_przeszly: {"title": "Imperfective past: what was going on", "gloss": "I was cooking (a man speaking). I was cooking (a woman speaking). Marek was reading. Ewa was reading. It was raining.", "note": "The past tense has endings that show gender: -łem / -łam for I (man / woman), -ł for he, -ła for she, -ło for it (weather), -liśmy for we. The imperfective past describes an action in progress or a background situation."}
  pl.a2.unit73.lesson01.teach.pogoda: {"title": "Weather", "gloss": "to fall (rain) / rain / to shine / sun / cold / warm", "note": "Weather in the past: *padało* is impersonal (neuter), *padał deszcz* has the masculine noun *deszcz* as subject. *Było* goes with *zimno* and *ciepło*.", "example_gloss": ["It was raining.", "Yesterday it was raining.", "The sun was shining.", "It was cold.", "It was warm.", "It was raining and it was cold.", "Yesterday evening it was cold and it was raining."]}
  pl.a2.unit73.lesson01.teach.gn_kiedy: {"title": "Kiedy: when, while", "gloss": "When we were walking home, it was raining. It was raining when we were walking home.", "note": "*Kiedy* introduces a situation. The clause with *kiedy* can come first or second; a comma separates the two parts."}
  pl.a2.unit73.lesson01.teach.pytania: {"title": "What were you doing?", "gloss": "What were you doing yesterday evening? (to a man) What were you doing yesterday evening? (to a woman)", "note": "The question shows the gender of the person you are talking to: *robiłeś* for a man, *robiłaś* for a woman."}
  pl.a2.unit73.lesson02.teach.zdarzenia: {"title": "Sudden events", "gloss": "to ring / to begin / to go out (light) / to be late / to break down / to come, arrive / suddenly", "note": "These verbs name something that happens once and is over: an event. They are perfective.", "example_gloss": ["Suddenly the phone rang.", "Suddenly it started to rain.", "The rain started to fall.", "Suddenly the light went out.", "The bus was late.", "The bus broke down.", "Ewa came."]}
  pl.a2.unit73.lesson02.teach.gn_dokonane: {"title": "Perfective past: one completed event", "gloss": "The phone rang. It started to rain. The light went out. The bus broke down.", "note": "The perfective past tells about one event that happened and is finished. It has the same endings as the imperfective past (-ł, -ła, -ło), but it answers 'what happened?' and not 'what was going on?'."}
  pl.a2.unit73.lesson02.teach.pary: {"title": "Aspect pairs", "gloss": "to do, be doing – to do, make (finish) / to read – to read through / to ring – to ring once / to be starting – to begin / to be going back – to come back / to cook – to cook (finish)", "note": "Many Polish verbs come in pairs: the first (imperfective) is for an action in progress, the second (perfective) for an action seen as finished or as a single event.", "example_gloss": ["Ewa was making coffee.", "Ewa made coffee.", "Marek read the book through.", "Marek cooked dinner.", "We were on our way home.", "We got home.", "The phone was ringing."]}
  pl.a2.unit73.lesson02.teach.gn_para: {"title": "The pair idea", "gloss": "I was reading a book (a woman speaking). I read the book through. I was cooking dinner. I cooked dinner and finished it.", "note": "Compare each pair: *czytałam* is the activity in progress, *przeczytałam* is the result. The imperfective is good for the background; the perfective is good for the event that interrupts it."}
  pl.a2.unit73.lesson02.teach.nagle_wtedy: {"title": "Suddenly, then", "gloss": "Suddenly the phone rang. Then the light went out.", "note": "*Nagle* (suddenly) and *wtedy* (then, at that moment) point to a single event, so the verb is perfective."}
  pl.a2.unit73.lesson03.teach.gn_kiedy2: {"title": "Background and interruption", "gloss": "I was cooking when the phone rang (a man speaking). I was walking to work when it started to rain (a woman speaking). Marek was walking home when the light went out.", "note": "The long background action is imperfective (*gotowałem*, *szłam*, *szedł*). The event that interrupts it is perfective (*zadzwonił*, *zaczęło*, *zgasło*)."}
  pl.a2.unit73.lesson03.teach.gn_kolejnosc: {"title": "The kiedy clause first", "gloss": "When I was cooking, the phone rang (a man speaking). When Ewa was walking to work, it started to rain.", "note": "The order can change, but the aspects stay the same: the clause with *kiedy* that describes the background is imperfective, the event is perfective."}
  pl.a2.unit73.lesson03.teach.jednoczesne: {"title": "At the same time", "gloss": "while / and meanwhile / then, at that moment / afterwards / for a long time / at last", "note": "*Podczas gdy* and *a w tym czasie* join two actions that go on at the same time.", "example_gloss": ["Ewa was cooking while Marek was reading.", "Marek was reading and meanwhile Ewa was making coffee.", "Then the phone rang.", "Afterwards Ewa came.", "It was raining for a long time.", "At last the bus came."]}
  pl.a2.unit73.lesson03.teach.gn_dwa_tla: {"title": "Two background actions", "gloss": "Ewa was cooking while Marek was reading. Marek was watching a film and meanwhile Ewa was sleeping.", "note": "When two actions go on at the same time, both verbs are imperfective. No interruption is involved."}
  pl.a2.unit73.lesson03.teach.pytania2: {"title": "What were you doing when...?", "gloss": "What were you doing when the phone rang? (to a man) What were you doing when the light went out? (to a woman)", "note": "The question has the same pattern as the answer: imperfective for what you were doing, perfective after *kiedy* for the event."}
  pl.a2.unit73.lesson04.teach.ruch: {"title": "Traffic", "gloss": "traffic jam / street / car / to stand / to go, travel / slowly", "note": "A traffic jam is a background situation, so *był*, *stał*, *jechał* are imperfective. *Stały* is the plural for things (cars).", "example_gloss": ["There was a traffic jam on the street.", "The bus was standing in a traffic jam.", "The cars were standing still.", "The bus was going slowly.", "Marek was late for work."]}
  pl.a2.unit73.lesson04.teach.pogoda2: {"title": "Weather changes", "gloss": "to stop / to become / dark / wet", "note": "A change in the weather is an event, so it is perfective: *zrobiło się*, *przestało*.", "example_gloss": ["It stopped raining.", "It got cold.", "It got dark.", "Marek was wet."]}
  pl.a2.unit73.lesson04.teach.gn_pogoda: {"title": "Weather: state and change", "gloss": "It was raining, and then it got cold. The sun was shining when suddenly it started to rain.", "note": "A weather state uses the imperfective (*padało*, *świeciło*). The moment the weather changes uses the perfective (*zrobiło się*, *zaczęło*)."}
  pl.a2.unit73.lesson04.teach.gn_porzadek: {"title": "A short account", "gloss": "The bus was going slowly. Then it broke down. We waited a long time.", "note": "A small incident usually has three parts: the background (imperfective), the event (perfective), and what went on afterwards (often imperfective again)."}
  pl.a2.unit73.lesson04.teach.pytania3: {"title": "What happened?", "gloss": "What happened? What was going on? What was going on then?", "note": "*Co się stało?* asks about an event (perfective). *Co się działo?* asks about what was going on (imperfective)."}
  pl.a2.unit73.lesson05.teach.slowa: {"title": "Words for the story", "gloss": "but / very / wet / to get off", "note": "*Wysiąść* is perfective; here it is followed by the imperfective *szedłem*.", "example_gloss": ["It was warm, but it was raining.", "Marek was very wet.", "I got off and walked home (a man speaking)."]}
  pl.a2.unit73.lesson05.teach.gn_pierwsza: {"title": "First person: man and woman", "gloss": "I came back (a man). I came back (a woman). I was wet (a man). I was wet (a woman). I was walking (a man). I was walking (a woman).", "note": "A man says -łem (*wróciłem*, *byłem*), a woman says -łam (*wróciłam*, *byłam*). The verb *iść* is irregular: *szedłem* (man), *szłam* (woman). Marek tells the story below, so he uses the masculine forms."}
  pl.a2.unit73.lesson05.teach.opowiadanie: {"title": "Telling a story", "gloss": "Yesterday evening I was going home. Suddenly the bus broke down. At last I got home.", "note": "A story has a background (imperfective), an event (perfective) and an ending (perfective)."}
  pl.a2.unit73.lesson05.teach.gn_ale: {"title": "Ale: but", "gloss": "It was warm, but it was raining. It was raining, but the sun was shining.", "note": "*Ale* joins two facts that contrast. A comma comes before it."}
  pl.a2.unit73.lesson05.teach.lektura: {"title": "Marek tells about yesterday evening", "gloss": "Yesterday evening I was going home. It was raining and it was cold. There was a traffic jam on the street and the bus was going slowly. Suddenly the bus broke down. I got off and walked home. I had been walking for a long time when it stopped raining. At last I got home. I was very wet.", "note": "Notice the pattern: the background is imperfective, the events (*zepsuł się*, *przestało*, *wróciłem*) are perfective.", "glosses": {"jechałem": "I was going (by vehicle)", "wysiadłem": "I got off", "szedłem": "I was walking", "mokry": "wet", "bardzo": "very", "wróciłem": "I got back", "przestało": "it stopped"}}
  pl.a2.unit73.lesson06.teach.d1: {"title": "Ewa asks", "gloss": "Ewa: I phoned you yesterday evening. Why didn't you answer?"}
  pl.a2.unit73.lesson06.teach.d2: {"title": "Marek apologises", "gloss": "Marek: Sorry. I was going home when the bus broke down."}
  pl.a2.unit73.lesson06.teach.d3: {"title": "Ewa asks what happened next", "gloss": "Ewa: And what was going on then?"}
  pl.a2.unit73.lesson06.teach.d4: {"title": "Marek explains", "gloss": "Marek: I was walking home in the rain. When you phoned, it was raining and I couldn't hear the phone."}
  pl.a2.unit73.lesson06.teach.d5: {"title": "Ewa asks about now", "gloss": "Ewa: And now? Are you home already?"}
  pl.a2.unit73.lesson06.teach.d6: {"title": "Marek answers", "gloss": "Marek: Yes, I got back at last. I am making tea now."}
exercises:
  pl.a2.unit73.lesson01.exercise01.elige_gotowal: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek gotował obiad.", "distractors": ["Marek gotowała obiad.", "Marek gotować obiad.", "Marek gotowaliśmy obiad."], "accepted_answers": [{"value": "Marek gotował obiad.", "status": "correct"}], "feedback": "With *Marek* the masculine past form *gotował* is needed."}
  pl.a2.unit73.lesson01.exercise02.elige_slonce: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Świeciło słońce.", "distractors": ["Świeciła słońce.", "Świecić słońce.", "Świeciliśmy słońce."], "accepted_answers": [{"value": "Świeciło słońce.", "status": "correct"}], "feedback": "*Słońce* is neuter, so the past form ends in -ło: *świeciło*."}
  pl.a2.unit73.lesson01.exercise03.une_czasowniki: {"instruction": "Match each Polish verb to its meaning.", "accepted_answers": [{"value": [{"left": "gotować", "right": "to cook"}, {"left": "czytać", "right": "to read"}, {"left": "iść", "right": "to go on foot"}, {"left": "oglądać", "right": "to watch"}, {"left": "spać", "right": "to sleep"}, {"left": "czekać", "right": "to wait"}, {"left": "padać", "right": "to fall (rain)"}, {"left": "świecić", "right": "to shine"}], "status": "correct"}], "feedback": "These verbs describe things that go on for a while."}
  pl.a2.unit73.lesson01.exercise04.ordena_kiedy: {"instruction": "Put the words in order to say 'When we were walking home, it was raining.'", "correct_option": "Kiedy szliśmy do domu padało", "accepted_answers": [{"value": "Kiedy szliśmy do domu padało", "status": "correct"}, {"value": "Padało kiedy szliśmy do domu", "status": "correct"}], "feedback": "*Kiedy szliśmy do domu, padało*: both parts describe what was going on."}
  pl.a2.unit73.lesson01.exercise05.completa_ogladala: {"instruction": "Complete with the imperfective past form of the verb that means 'to watch'.", "correct_option": "oglądała", "accepted_answers": [{"value": "oglądała", "status": "correct"}], "feedback": "*Ewa oglądała film*: *Ewa* is feminine, so the past form ends in -ła."}
  pl.a2.unit73.lesson01.exercise06.traduce_czekali: {"instruction": "Translate into Polish using the imperfective past.", "accepted_answers": [{"value": "Czekaliśmy na autobus.", "status": "correct"}, {"value": "Czekaliśmy na autobus", "status": "correct"}, {"value": "Czekałyśmy na autobus.", "status": "correct"}, {"value": "Czekałyśmy na autobus", "status": "correct"}], "feedback": "*Czekaliśmy na autobus* = We were waiting for the bus."}
  pl.a2.unit73.lesson01.exercise07.escribe_pogoda: {"instruction": "Write one Polish sentence in the past with two weather facts joined by *i*.", "correct_option": "Wczoraj wieczorem padało i było zimno.", "accepted_answers": [{"value": "Wczoraj wieczorem padało i było zimno.", "status": "correct"}, {"value": "Wczoraj wieczorem padało i było zimno", "status": "correct"}, {"value": "Wczoraj wieczorem padał deszcz i było zimno.", "status": "correct"}, {"value": "Wczoraj wieczorem padał deszcz i było zimno", "status": "correct"}, {"value": "Wczoraj wieczorem było zimno i padało.", "status": "correct"}, {"value": "Wczoraj wieczorem było zimno i padało", "status": "correct"}, {"value": "Wczoraj wieczorem było zimno i padał deszcz.", "status": "correct"}, {"value": "Wczoraj wieczorem było zimno i padał deszcz", "status": "correct"}], "feedback": "*Wczoraj wieczorem padało i było zimno.*"}
  pl.a2.unit73.lesson02.exercise01.elige_telefon: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Nagle zadzwonił telefon.", "distractors": ["Nagle zadzwoniła telefon.", "Nagle zadzwonić telefon.", "Nagle zadzwonili telefon."], "accepted_answers": [{"value": "Nagle zadzwonił telefon.", "status": "correct"}], "feedback": "*Nagle* introduces a single event, so the perfective *zadzwonił* is used; *telefon* is masculine."}
  pl.a2.unit73.lesson02.exercise02.elige_swiatlo: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Nagle zgasło światło.", "distractors": ["Nagle zgasł światło.", "Nagle zgasła światło.", "Nagle zgasły światło."], "accepted_answers": [{"value": "Nagle zgasło światło.", "status": "correct"}], "feedback": "*Światło* is neuter, so the past form is *zgasło*."}
  pl.a2.unit73.lesson02.exercise03.une_pary: {"instruction": "Match each Polish verb to its meaning.", "accepted_answers": [{"value": [{"left": "robić", "right": "to be doing, to be making"}, {"left": "zrobić", "right": "to do, to make (and finish)"}, {"left": "czytać", "right": "to be reading"}, {"left": "przeczytać", "right": "to read through"}, {"left": "dzwonić", "right": "to be ringing"}, {"left": "zadzwonić", "right": "to ring once, to call"}, {"left": "zaczynać", "right": "to be starting"}, {"left": "zacząć", "right": "to begin"}], "status": "correct"}], "feedback": "In each pair the first verb is in progress and the second is a finished event."}
  pl.a2.unit73.lesson02.exercise04.ordena_dwa: {"instruction": "Put the words in order to say 'Suddenly the light went out and it started to rain.'", "correct_option": "Nagle zgasło światło i zaczęło padać", "accepted_answers": [{"value": "Nagle zgasło światło i zaczęło padać", "status": "correct"}], "feedback": "Two events, both perfective: *zgasło* and *zaczęło*."}
  pl.a2.unit73.lesson02.exercise05.completa_zadzwonil: {"instruction": "Complete with the past form of the verb for 'to ring', as one sudden event.", "correct_option": "zadzwonił", "accepted_answers": [{"value": "zadzwonił", "status": "correct"}], "feedback": "*Nagle zadzwonił telefon*: a sudden single event needs the perfective *zadzwonił*."}
  pl.a2.unit73.lesson02.exercise06.traduce_zaczelo: {"instruction": "Translate into Polish using the perfective past.", "accepted_answers": [{"value": "Nagle zaczęło padać.", "status": "correct"}, {"value": "Nagle zaczęło padać", "status": "correct"}, {"value": "Zaczęło nagle padać.", "status": "correct"}, {"value": "Zaczęło nagle padać", "status": "correct"}, {"value": "Nagle zaczął padać deszcz.", "status": "correct"}, {"value": "Nagle zaczął padać deszcz", "status": "correct"}, {"value": "Zaczął nagle padać deszcz.", "status": "correct"}, {"value": "Zaczął nagle padać deszcz", "status": "correct"}], "feedback": "*Nagle zaczęło padać* = Suddenly it started to rain."}
  pl.a2.unit73.lesson02.exercise07.escribe_kawa: {"instruction": "Write exactly two sentences: first the imperfective past, then the perfective past.", "correct_option": "Ewa robiła kawę. Ewa zrobiła kawę.", "accepted_answers": [{"value": "Ewa robiła kawę. Ewa zrobiła kawę.", "status": "correct"}, {"value": "Ewa robiła kawę. Ewa zrobiła kawę", "status": "correct"}, {"value": "Ewa robiła kawę. Zrobiła kawę.", "status": "correct"}, {"value": "Ewa robiła kawę. Zrobiła kawę", "status": "correct"}], "feedback": "*Ewa robiła kawę. Ewa zrobiła kawę.*"}
  pl.a2.unit73.lesson03.exercise01.elige_kiedy: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Marek gotował, kiedy zadzwonił telefon.", "distractors": ["Marek ugotował, kiedy dzwonił telefon.", "Marek gotowała, kiedy zadzwonił telefon.", "Marek gotować, kiedy zadzwonić telefon."], "accepted_answers": [{"value": "Marek gotował, kiedy zadzwonił telefon.", "status": "correct"}], "feedback": "Background: *gotował* (imperfective). Event: *zadzwonił* (perfective)."}
  pl.a2.unit73.lesson03.exercise02.elige_szla: {"instruction": "Choose the correct Polish sentence.", "correct_option": "Ewa szła do pracy, kiedy zaczęło padać.", "distractors": ["Ewa szedł do pracy, kiedy zaczęło padać.", "Ewa szła do pracy, kiedy zaczynać padać.", "Ewa szła do pracy, kiedy zaczęła padać."], "accepted_answers": [{"value": "Ewa szła do pracy, kiedy zaczęło padać.", "status": "correct"}], "feedback": "*Ewa szła* is feminine; the weather event is neuter: *zaczęło padać*."}
  pl.a2.unit73.lesson03.exercise03.une_laczniki: {"instruction": "Match each Polish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "podczas gdy", "right": "while"}, {"left": "kiedy", "right": "when"}, {"left": "a w tym czasie", "right": "and meanwhile"}, {"left": "nagle", "right": "suddenly"}, {"left": "wtedy", "right": "then, at that moment"}, {"left": "potem", "right": "afterwards"}, {"left": "długo", "right": "for a long time"}, {"left": "w końcu", "right": "at last"}], "status": "correct"}], "feedback": "These words organise a story in time."}
  pl.a2.unit73.lesson03.exercise04.ordena_ewa_pracy: {"instruction": "Put the words in order to say 'Ewa was walking to work when it started to rain.'", "correct_option": "Ewa szła do pracy kiedy zaczęło padać", "accepted_answers": [{"value": "Ewa szła do pracy kiedy zaczęło padać", "status": "correct"}, {"value": "Kiedy Ewa szła do pracy zaczęło padać", "status": "correct"}], "feedback": "*Szła* is the background, *zaczęło padać* is the event."}
  pl.a2.unit73.lesson03.exercise05.completa_zgaslo: {"instruction": "Complete with the past form of the verb for 'to go out', as one sudden event.", "correct_option": "zgasło", "accepted_answers": [{"value": "zgasło", "status": "correct"}], "feedback": "*Marek czytał książkę, kiedy zgasło światło*: *światło* is neuter."}
  pl.a2.unit73.lesson03.exercise06.traduce_gotowalem: {"instruction": "Translate into Polish: imperfective for cooking, perfective for the ring.", "accepted_answers": [{"value": "Gotowałem, kiedy zadzwonił telefon.", "status": "correct"}, {"value": "Gotowałem, kiedy zadzwonił telefon", "status": "correct"}, {"value": "Gotowałam, kiedy zadzwonił telefon.", "status": "correct"}, {"value": "Gotowałam, kiedy zadzwonił telefon", "status": "correct"}, {"value": "Kiedy gotowałem, zadzwonił telefon.", "status": "correct"}, {"value": "Kiedy gotowałem, zadzwonił telefon", "status": "correct"}, {"value": "Kiedy gotowałam, zadzwonił telefon.", "status": "correct"}, {"value": "Kiedy gotowałam, zadzwonił telefon", "status": "correct"}], "feedback": "*Gotowałem, kiedy zadzwonił telefon.* (A woman says *gotowałam*.)"}
  pl.a2.unit73.lesson03.exercise07.escribe_dwa_tla: {"instruction": "Write one sentence with two background actions in the imperfective past, linked with *podczas gdy* or *a w tym czasie*.", "correct_option": "Ewa czytała, podczas gdy Marek gotował.", "accepted_answers": [{"value": "Ewa czytała, podczas gdy Marek gotował.", "status": "correct"}, {"value": "Ewa czytała, podczas gdy Marek gotował", "status": "correct"}, {"value": "Ewa czytała, a w tym czasie Marek gotował.", "status": "correct"}, {"value": "Ewa czytała, a w tym czasie Marek gotował", "status": "correct"}, {"value": "Podczas gdy Ewa czytała, Marek gotował.", "status": "correct"}, {"value": "Podczas gdy Ewa czytała, Marek gotował", "status": "correct"}, {"value": "Marek gotował, podczas gdy Ewa czytała.", "status": "correct"}, {"value": "Marek gotował, podczas gdy Ewa czytała", "status": "correct"}, {"value": "Marek gotował, a w tym czasie Ewa czytała.", "status": "correct"}, {"value": "Marek gotował, a w tym czasie Ewa czytała", "status": "correct"}], "feedback": "*Ewa czytała, podczas gdy Marek gotował.*"}
