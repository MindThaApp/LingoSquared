  notes: >-
    Fifth en-pl A2 overlay, written for
    pl/a2_unit25_naprawa_w_mieszkaniu.yaml (schema_version 1.1, §19 format
    from the start). No sibling-direction overlay exists yet (pl-en
    unauthored), so §8 doesn't apply.

    No genuinely ambiguous multi-clause join in this unit -- every taught
    sentence is a single clause or a short question-and-answer pair, so
    §12 doesn't add a second accepted form anywhere. Every note/feedback
    string mixing Polish text inline with English wraps the Polish in
    *asterisks* per §15. Every matching_pairs correct_response and
    word_order correct_response checked token-for-token against the
    realization's own pairs/word_bank. No stray YAML boolean coercion.
    Pending fresh-context review per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    canon -- A1 unit18 established Marek with a house (Mam dom. Dom jest
    duży.) and Ewa with the apartment (A ja mam mieszkanie; A2 unit21 Ewa
    moved into a new mieszkanie), so Marek reporting "Ogrzewanie w moim
    mieszkaniu" contradicted canon: reassigned the three tenant lines
    (dialogue line01/03/05) to Ewa -- every line is speaker-gender-neutral
    (mógłby pan addresses the male Administrator), so no Polish text
    changed; lesson01.exercise07 prompt "Marek mówi" -> "Ewa mówi";
    overlay titles/notes/instructions Marek -> Ewa; register_policy
    updated. (2) false-grammar -- lesson02.teach.moglby_note claimed
    mógłby is "used by a man" (używana przez mężczyznę); it is used when
    addressing a man (Czy mógłby pan...?): realization text and overlay
    gloss corrected. (3) comprehension-without-text --
    lesson03.exercise05.read_the_problem showed only the question: added
    the problem line as a block. (4) missing-accepted-answer --
    lesson02.exercise07 + Czy mógłby pan jak najszybciej przyjść?;
    lesson02.exercise09 + that order and Czy pan mógłby przyjść jak
    najszybciej?; lesson02.exercise10 + W moim mieszkaniu nie działa
    ogrzewanie / Ogrzewanie nie działa w moim mieszkaniu;
    lesson03.exercise09 + Jutro rano mogę przyjść. (5)
    underdetermined-prompt -- lesson02.exercise09 pinned to
    formal-to-a-man. (6) other -- overlay dialogue line06 note said
    "ending the call" for an in-person scene -> "conversation". NATIVE
    CHECK: none.

    Second-pass review 2026-10-19: 2 fixes -
    lesson03.exercise02.select_repair_time distractor "Do zobaczenia jutro."
    also states the repair day (tomorrow), so it was arguably a second correct
    answer -> replaced with "Świetnie, dziękuję."; lesson02.exercise10 + W
    moim mieszkaniu ogrzewanie nie działa (natural order).

    Second-pass follow-up 2026-10-19: 1 fix - teaching line04 note "exactly what the spine outcome asks for" -> learner-facing wording about arranging a repair (internal-jargon).

answer_policy:
  diacritics: >-
    Same standing policy as unit01-24: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed answers, accept a variant with
    the diacritic dropped or swapped for its plain-letter equivalent when
    every other letter and word is correct. Punctuation marks (?, !) may be
    omitted in typed answers, but the fully punctuated form remains the
    model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A2"

units:
  pl.a2.unit25.naprawa_w_mieszkaniu:
    title: "A repair in the apartment"

lessons:
  pl.a2.unit25.lesson01.slownictwo_naprawy:
    title: "Repair vocabulary"
  pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc:
    title: "Could you come?"
  pl.a2.unit25.lesson03.rozmowa_z_administratorem:
    title: "A conversation with the building manager"

teaching:
  pl.a2.unit25.lesson01.teach.recap_words:
    title: "Good day, please, thank you -- again"
    gloss: "Dzień, dobry, Proszę, dziękuję, jest, mam, ma, Tak, Czy, kiedy, i, w, mieszkanie, mieszkaniu, moim, mój, mogę, może, wczoraj, jutro, pan -- you already know these words from earlier lessons."
    note: "A quick reminder before this lesson reports a broken heater."

  pl.a2.unit25.lesson01.teach.ogrzewanie:
    title: "Heating"
    gloss: "heating (system)"
    note: "A neuter noun."
    example_gloss: "The heating is broken."

  pl.a2.unit25.lesson01.teach.nie_dziala:
    title: "Isn't working"
    gloss: "isn't working / doesn't function"
    note: "A high-frequency everyday complaint construction."
    example_gloss: "The heating isn't working."

  pl.a2.unit25.lesson01.teach.zepsute:
    title: "Broken"
    gloss: "broken"
    note: "The neuter form, matching *ogrzewanie*."
    example_gloss: "This is broken."

  pl.a2.unit25.lesson01.teach.naprawic:
    title: "To fix"
    gloss: "to fix / repair"
    note: "The verb for getting something fixed."
    example_gloss: "I have to fix this."

  pl.a2.unit25.lesson02.teach.moim_mieszkaniu_phrase:
    title: "The heating in my apartment isn't working"
    gloss: "The heating in my apartment isn't working."
    note: "*moim mieszkaniu* is the locative form of *moje mieszkanie*, used after *w* (in)."

  pl.a2.unit25.lesson02.teach.od_kiedy_note:
    title: "Since when?"
    gloss: "Od kiedy...? -- asks when a problem started (since when...?)."
    note: "A genuine information question about duration, the question-form counterpart of the earlier lesson's *od + genitive* statement."

  pl.a2.unit25.lesson02.teach.od_wczoraj_phrase:
    title: "Since yesterday"
    gloss: "Since yesterday."
    note: "A short, natural answer to *Od kiedy...?*"

  pl.a2.unit25.lesson02.teach.moglby_note:
    title: "Could -- masculine conditional of móc"
    gloss: "mógłby -- the conditional form of \"móc\" (can/to be able), used in a polite request addressed to a man (e.g. Czy mógłby pan...? -- Could you, sir...?)."
    note: "The same conditional mood as *chciałbym*, now applied to a different verb -- a real, productive grammar pattern, not one memorized phrase."

  pl.a2.unit25.lesson02.teach.przyjsc:
    title: "To come"
    gloss: "to come"
    note: "Used for someone arriving to do the repair."
    example_gloss: "I want to come tomorrow."

  pl.a2.unit25.lesson02.teach.jak_najszybciej:
    title: "As soon as possible"
    gloss: "as soon as possible"
    note: "A fixed idiomatic phrase."
    example_gloss: "Please come as soon as possible."

  pl.a2.unit25.lesson02.teach.czy_moglby_pan_przyjsc_phrase:
    title: "Could you come as soon as possible?"
    gloss: "Could you come as soon as possible?"
    note: "The full polite request this lesson is built around."

  pl.a2.unit25.lesson03.teach.jutro_rano:
    title: "Tomorrow morning"
    gloss: "tomorrow morning"
    note: "*rano* means \"morning\"; combined with *jutro* (tomorrow), it gives a specific time."
    example_gloss: "I'll come tomorrow morning."

  pl.a2.unit25.teach.dialogue.line01:
    title: "Ewa reports the problem"
    gloss: "Good day. The heating in my apartment isn't working."
    note: "Ewa opens with a direct, clear problem report."
  pl.a2.unit25.teach.dialogue.line02:
    title: "The building manager asks since when"
    gloss: "Since when hasn't it been working?"
    note: "A natural first follow-up question."
  pl.a2.unit25.teach.dialogue.line03:
    title: "Ewa answers and requests urgency"
    gloss: "Since yesterday. Could you come as soon as possible?"
    note: "Ewa combines the duration answer with the polite request this lesson taught."
  pl.a2.unit25.teach.dialogue.line04:
    title: "The building manager agrees and gives a time"
    gloss: "Of course. I can come tomorrow morning."
    note: "A concrete, specific repair time -- exactly the kind of detail you need when arranging a repair."
  pl.a2.unit25.teach.dialogue.line05:
    title: "Ewa thanks him"
    gloss: "Great, thank you."
    note: "A short, natural close."
  pl.a2.unit25.teach.dialogue.line06:
    title: "The building manager confirms"
    gloss: "See you tomorrow."
    note: "Confirms the arrangement one more time before ending the conversation."

exercises:
  pl.a2.unit25.lesson01.exercise01.select_ogrzewanie:
    instruction: "Which word means 'heating'?"
    correct_option: "ogrzewanie"
    distractors: ["zepsute", "naprawić"]
    accepted_answers: ["ogrzewanie"]

  pl.a2.unit25.lesson01.exercise02.select_zepsute:
    instruction: "Which word means 'broken'?"
    correct_option: "zepsute"
    distractors: ["ogrzewanie", "naprawić"]
    accepted_answers: ["zepsute"]

  pl.a2.unit25.lesson01.exercise03.select_naprawic:
    instruction: "Which word means 'to fix'?"
    correct_option: "naprawić"
    distractors: ["ogrzewanie", "zepsute"]
    accepted_answers: ["naprawić"]

  pl.a2.unit25.lesson01.exercise04.match_lesson1_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "ogrzewanie": "heating"
      "nie działa": "isn't working"
      "zepsute": "broken"
      "naprawić": "to fix"
      "mieszkanie": "apartment"

  pl.a2.unit25.lesson01.exercise05.order_ogrzewanie_nie_dziala:
    instruction: "Put the sentence 'The heating isn't working' in order."
    correct_response: ["Ogrzewanie", "nie", "działa"]

  pl.a2.unit25.lesson01.exercise06.order_ogrzewanie_jest_zepsute:
    instruction: "Put the sentence 'The heating is broken' in order."
    correct_response: ["Ogrzewanie", "jest", "zepsute"]

  pl.a2.unit25.lesson01.exercise07.fill_ogrzewanie_nie_dziala:
    instruction: "Complete the sentence: 'Ewa says: The heating isn't ___.' (working)"
    accepted_answers: ["działa"]
    feedback: "Ogrzewanie nie działa -- działa is the word for works/functions."

  pl.a2.unit25.lesson01.exercise08.fix_ogrzewanie_nie_dziala:
    instruction: "Fix the word order -- put the sentence 'The heating isn't working' in the natural order."
    accepted_answers:
      - "Ogrzewanie nie działa."
      - "Ogrzewanie nie działa"
    feedback: "Ogrzewanie nie działa, not Nie ogrzewanie działa -- nie must come right before the verb it negates."

  pl.a2.unit25.lesson01.exercise09.write_naprawic:
    instruction: "Write the Polish word for 'to fix'."
    accepted_answers:
      - "naprawić"

  pl.a2.unit25.lesson02.exercise01.select_moim_mieszkaniu:
    instruction: "Which sentence reports that the heating in the apartment isn't working?"
    correct_option: "Ogrzewanie w moim mieszkaniu nie działa."
    distractors: ["Czy mógłby pan przyjść jak najszybciej?", "Od wczoraj."]
    accepted_answers:
      - "Ogrzewanie w moim mieszkaniu nie działa."
      - "Ogrzewanie w moim mieszkaniu nie działa"

  pl.a2.unit25.lesson02.exercise02.select_czy_moglby_pan_przyjsc:
    instruction: "Which sentence politely asks someone to come as soon as possible?"
    correct_option: "Czy mógłby pan przyjść jak najszybciej?"
    distractors: ["Ogrzewanie w moim mieszkaniu nie działa.", "Od wczoraj."]
    accepted_answers:
      - "Czy mógłby pan przyjść jak najszybciej?"
      - "Czy mógłby pan przyjść jak najszybciej"

  pl.a2.unit25.lesson02.exercise03.match_lesson2_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "ogrzewanie": "heating"
      "zepsute": "broken"
      "naprawić": "to fix"
      "mógłby": "could (masculine)"
      "przyjść": "to come"
      "jak najszybciej": "as soon as possible"

  pl.a2.unit25.lesson02.exercise04.order_od_wczoraj:
    instruction: "Put the phrase 'Since yesterday' in order."
    correct_response: ["Od", "wczoraj"]

  pl.a2.unit25.lesson02.exercise05.order_czy_moglby_pan_przyjsc:
    instruction: "Put the question 'Could you come as soon as possible?' in order."
    correct_response: ["Czy", "mógłby", "pan", "przyjść", "jak", "najszybciej"]

  pl.a2.unit25.lesson02.exercise06.fill_jak_najszybciej:
    instruction: "Complete the sentence: 'Please come as ___ as possible.' (soon)"
    accepted_answers: ["najszybciej"]
    feedback: "Proszę przyjść jak najszybciej -- najszybciej is the word for soonest."

  pl.a2.unit25.lesson02.exercise07.fix_czy_moglby_pan_przyjsc:
    instruction: "Fix the word order -- put the question 'Could you come as soon as possible?' in the natural order."
    accepted_answers:
      - "Czy mógłby pan przyjść jak najszybciej?"
      - "Czy mógłby pan przyjść jak najszybciej"
      - "Czy mógłby pan jak najszybciej przyjść?"
      - "Czy mógłby pan jak najszybciej przyjść"
    feedback: "Czy mógłby pan przyjść jak najszybciej?, not Pan czy mógłby jak najszybciej przyjść? -- Czy must open a yes/no question."

  pl.a2.unit25.lesson02.exercise08.reply_od_kiedy_nie_dziala:
    instruction: "The building manager asks: 'Since when hasn't it been working?' Answer: say since yesterday."
    accepted_answers:
      - "Od wczoraj."
      - "Od wczoraj"

  pl.a2.unit25.lesson02.exercise09.write_czy_moglby_pan_przyjsc:
    instruction: "Write, politely asking the building manager (formal, to a man): 'Could you come as soon as possible?'"
    accepted_answers:
      - "Czy mógłby pan przyjść jak najszybciej?"
      - "Czy mógłby pan przyjść jak najszybciej"
      - "Czy mógłby pan jak najszybciej przyjść?"
      - "Czy mógłby pan jak najszybciej przyjść"
      - "Czy pan mógłby przyjść jak najszybciej?"
      - "Czy pan mógłby przyjść jak najszybciej"

  pl.a2.unit25.lesson02.exercise10.speak_ogrzewanie_nie_dziala_moim:
    instruction: "Say: 'The heating in my apartment isn't working.'"
    accepted_answers:
      - "Ogrzewanie w moim mieszkaniu nie działa."
      - "Ogrzewanie w moim mieszkaniu nie działa"
      - "W moim mieszkaniu nie działa ogrzewanie."
      - "W moim mieszkaniu nie działa ogrzewanie"
      - "Ogrzewanie nie działa w moim mieszkaniu."
      - "Ogrzewanie nie działa w moim mieszkaniu"
      - "W moim mieszkaniu ogrzewanie nie działa."
      - "W moim mieszkaniu ogrzewanie nie działa"

  pl.a2.unit25.lesson03.exercise01.select_marek_reports_problem:
    instruction: "Which line shows Ewa reporting the problem?"
    correct_option: "Dzień dobry. Ogrzewanie w moim mieszkaniu nie działa."
    distractors:
      - "Świetnie, dziękuję."
      - "Od wczoraj. Czy mógłby pan przyjść jak najszybciej?"
    accepted_answers:
      - "Dzień dobry. Ogrzewanie w moim mieszkaniu nie działa."
      - "Dzień dobry. Ogrzewanie w moim mieszkaniu nie działa"

  pl.a2.unit25.lesson03.exercise02.select_repair_time:
    instruction: "Which line gives the repair time?"
    correct_option: "Oczywiście. Mogę przyjść jutro rano."
    distractors:
      - "Od kiedy nie działa?"
      - "Świetnie, dziękuję."
    accepted_answers:
      - "Oczywiście. Mogę przyjść jutro rano."
      - "Oczywiście. Mogę przyjść jutro rano"

  pl.a2.unit25.lesson03.exercise03.comprehend_since_when:
    instruction: "Read the line. Since when has the heating been broken?"
    correct_option: "since yesterday"
    distractors:
      - "since last week"
      - "since this morning"
    accepted_answers:
      - "wczoraj"
      - "since yesterday"

  pl.a2.unit25.lesson03.exercise04.comprehend_repair_time:
    instruction: "Read the line. When will the building manager come to repair it?"
    correct_option: "tomorrow morning"
    distractors:
      - "today"
      - "next week"
    accepted_answers:
      - "jutro rano"
      - "tomorrow morning"

  pl.a2.unit25.lesson03.exercise05.read_the_problem:
    instruction: "According to the dialogue, what problem does Ewa report?"
    correct_option: "the heating isn't working"
    distractors:
      - "the water isn't working"
      - "the door is broken"
    accepted_answers:
      - "Ogrzewanie nie działa"
      - "the heating isn't working"

  pl.a2.unit25.lesson03.exercise06.match_lesson3_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "ogrzewanie": "heating"
      "zepsute": "broken"
      "naprawić": "to fix"
      "mógłby": "could (masculine)"
      "przyjść": "to come"
      "jak najszybciej": "as soon as possible"
      "jutro rano": "tomorrow morning"
      "wczoraj": "yesterday"

  pl.a2.unit25.lesson03.exercise07.order_od_kiedy_nie_dziala:
    instruction: "Put the question 'Since when hasn't it been working?' in order."
    correct_response: ["Od", "kiedy", "nie", "działa"]

  pl.a2.unit25.lesson03.exercise08.fill_moge_przyjsc_jutro_rano:
    instruction: "Complete the sentence: 'I can come tomorrow ___.' (morning)"
    accepted_answers: ["rano"]
    feedback: "Mogę przyjść jutro rano -- rano is the word for morning."

  pl.a2.unit25.lesson03.exercise09.fix_moge_przyjsc_jutro_rano:
    instruction: "Fix the word order -- put the sentence 'I can come tomorrow morning' in the natural order."
    accepted_answers:
      - "Mogę przyjść jutro rano."
      - "Mogę przyjść jutro rano"
      - "Jutro rano mogę przyjść."
      - "Jutro rano mogę przyjść"
    feedback: "Mogę przyjść jutro rano, not Rano jutro mogę przyjść -- jutro rano is a fixed order (tomorrow morning), not rano jutro."

  pl.a2.unit25.lesson03.exercise10.reply_od_kiedy_nie_dziala_dialogue:
    instruction: "The building manager asks: 'Since when hasn't it been working?' Answer as Ewa: say since yesterday."
    accepted_answers:
      - "Od wczoraj."
      - "Od wczoraj"

  pl.a2.unit25.lesson03.exercise11.speak_swietnie_dziekuje:
    instruction: "Say: 'Great, thank you.'"
    accepted_answers:
      - "Świetnie, dziękuję."
      - "Świetnie, dziękuję"
