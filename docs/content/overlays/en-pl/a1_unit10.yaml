answer_policy:
  diacritics: >-
    Same standing policy as unit01-09: display and teach all Polish
    diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant
    with the diacritic dropped or swapped for its plain-letter equivalent
    when every other letter and word is correct. Punctuation marks (?, !)
    may be omitted in typed answers, but the fully punctuated form remains
    the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or diacritics.

course:
  title: "Polish A1"

units:
  pl.a1.unit10.routines:
    title: "My day"

lessons:
  pl.a1.unit10.lesson01.rano:
    title: "In the morning"
  pl.a1.unit10.lesson02.praca_i_dom:
    title: "Work and home"
  pl.a1.unit10.lesson03.rozmowa_o_dniu:
    title: "Talking about the day"

teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: "To get up, I get up"
    gloss: "to get up; I get up"
    note: "Wstawać is the infinitive; wstaję is the everyday first-person form you'll use to talk about your own routine."
    example_gloss: "I get up at seven in the morning."

  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: "To eat, I eat"
    gloss: "to eat; I eat"
    note: "Jeść is slightly irregular, but jem ('I eat') is the form you'll use most -- it's exactly how a Pole says 'I eat' about any meal."
    example_gloss: "I eat breakfast in the morning."

  pl.a1.unit10.lesson01.teach.sniadanie:
    title: "Breakfast"
    gloss: "breakfast"
    note: "Śniadanie doesn't change form after jem -- 'I eat breakfast' is simply jem śniadanie, no extra ending to learn."
    example_gloss: "In the morning I eat breakfast."

  pl.a1.unit10.lesson01.teach.pic_pije:
    title: "To drink, I drink"
    gloss: "to drink; I drink"
    note: "Pić is the infinitive; piję is the first-person form, used the same way as jem and wstaję."
    example_gloss: "I drink coffee in the morning."

  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: "Talking about yourself"
    gloss: "Wstaję, jem, piję -- in this unit we only talk about ourselves, in the first person (I), the same way you'd describe your own day."
    note: >-
      This whole unit deliberately sticks to the "I" form of every verb --
      *wstaję* (I get up), *jem* (I eat), *piję* (I drink) -- so you can
      focus on describing your own routine without also learning how
      every verb changes for "you," "he," or "she" at the same time.

  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: "I get up at seven in the morning"
    gloss: "I get up at seven in the morning."
    note: "The grammar note's pattern put to work: o + the hour's locative form (siódmej) says 'at' that hour, exactly as in the earlier time unit."

  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: "I eat breakfast and drink coffee"
    gloss: "I eat breakfast and drink coffee."
    note: "Two first-person verbs joined with i (and) -- a natural way to list your own morning activities."

  pl.a1.unit10.lesson02.teach.obiad:
    title: "Lunch"
    gloss: "lunch / midday meal"
    note: "Like śniadanie, obiad doesn't change form after jem -- jem obiad simply means 'I eat lunch.'"
    example_gloss: "I eat lunch at noon."

  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: "To work, I work"
    gloss: "to work; I work"
    note: "Pracować follows the same -ować -> -uję pattern as kosztować -> kosztuje from the shopping unit, just in the first person this time."
    example_gloss: "I work in the afternoon."

  pl.a1.unit10.lesson02.teach.dom:
    title: "Home"
    gloss: "home / house"
    note: "The everyday word for home -- comes up constantly in the phrase 'go/come home.'"
    example_gloss: "The house is there."

  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: "To home"
    gloss: "To home -- do takes the genitive, and dom's genitive ends in -u: domu, the exact same pattern as bank -> banku, park -> parku, hotel -> hotelu."
    note: >-
      *Do domu* ("to home" / "home," as in "I'm going home") reuses the
      same *-u* genitive ending you already learned after *do* with bank,
      hotel, and park -- one more noun following the same pattern.

  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: "To return, I return"
    gloss: "to return / go back; I return / go back"
    note: "Used with do domu to say 'I go home' or 'I return home' -- one of the most common everyday phrases in Polish."
    example_gloss: "I return home in the evening."

  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: "At noon, in the afternoon, in the evening"
    gloss: "at noon; in the afternoon; in the evening"
    note: "Review from the earlier time unit: together with rano and w nocy, these time-of-day expressions cover the whole day."
    example_gloss:
      - "I eat lunch at noon."
      - "I work in the afternoon."
      - "I return home in the evening."

  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: "I work in the afternoon, then I go home"
    gloss: "I work in the afternoon, then I return home."
    note: "The same comma + potem chaining pattern from the directions unit, now used to link two parts of a daily routine."

  pl.a1.unit10.lesson03.teach.spac_spie:
    title: "To sleep, I sleep"
    gloss: "to sleep; I sleep"
    note: "Śpię has an irregular-looking vowel change from the infinitive spać, but it's a very common, high-frequency verb worth memorizing as-is."
    example_gloss: "I sleep at night."

  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: "And you? Me too."
    gloss: "And you? / I too."
    note: "A ty? is the simple way to hand a conversation back to the other person; ja też means 'me too' -- both come up constantly in everyday small talk."
    example_gloss: "I too eat breakfast in the morning."

  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: "But, tea, not"
    gloss: "but; tea (as an object); not"
    note: "Ale introduces a contrast; nie right before a word (rather than before a verb) means 'not [that thing]' -- piję herbatę, nie kawę means 'I drink tea, not coffee.'"
    example_gloss: "I drink tea, but not coffee."

  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: "Early, at ten o'clock"
    gloss: "early; at ten o'clock -- the same -ej ending in hours after 'o' as czwartej, siódmej from the earlier lesson."
    note: >-
      *O dziesiątej* ("at ten") reuses the exact same hour pattern you
      already learned -- *dziesiąta* becomes *dziesiątej* after *o*, just
      like *czwarta* -> *czwartej* and *siódma* -> *siódmej*.

  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: "Ewa describes her morning"
    gloss: "Ewa says she gets up at seven in the morning and drinks coffee."
    note: "Reuses this unit's very first taught sentence pattern, now inside a real conversation."
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: "Ewa continues her day"
    gloss: "Ewa says she eats breakfast, then works in the afternoon."
    note: "Chains two first-person activities with potem, the same pattern from Lesson 2."
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: "Ewa finishes and asks Marek"
    gloss: "Ewa says she returns home in the evening. And you?"
    note: "A ty? hands the conversation to Marek without needing any new question grammar."
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: "Marek shares his morning"
    gloss: "Marek says he also gets up at seven! But he drinks tea, not coffee."
    note: "Ja też confirms a shared detail (the wake-up time) before contrasting with ale...nie for the drink."
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: "Marek describes his day"
    gloss: "Marek says he works in the morning, then eats lunch at noon."
    note: "A different daily order than Ewa's -- work first, then a midday meal."
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: "Marek talks about sleep"
    gloss: "Marek says he sleeps early, at ten in the evening."
    note: "Closes out the conversation with the new spać/śpię verb and this lesson's reused hour pattern."

exercises:
  pl.a1.unit10.lesson01.exercise01.select_wstaje:
    instruction: "Which word means 'I get up'?"
    correct_option: "wstaję"
    distractors: ["jem", "piję"]
    accepted_answers: ["wstaję"]

  pl.a1.unit10.lesson01.exercise02.select_sniadanie:
    instruction: "Which word means 'breakfast'?"
    correct_option: "śniadanie"
    distractors: ["rano", "kawę"]
    accepted_answers: ["śniadanie"]

  pl.a1.unit10.lesson01.exercise03.select_pije:
    instruction: "Which word means 'I drink'?"
    correct_option: "piję"
    distractors: ["jem", "wstaję"]
    accepted_answers: ["piję"]

  pl.a1.unit10.lesson01.exercise04.match_morning_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "wstaję": "I get up"
      "jem": "I eat"
      "śniadanie": "breakfast"
      "piję": "I drink"
      "rano": "in the morning"
      "kawę": "coffee"

  pl.a1.unit10.lesson01.exercise05.order_wstaje_o_siodmej_rano:
    instruction: "Put the sentence 'I get up at seven in the morning' in order."
    accepted_answers:
      - ["Wstaję", "o", "siódmej", "rano"]
      - ["rano", "Wstaję", "o", "siódmej"]

  pl.a1.unit10.lesson01.exercise06.order_sniadanie_kawa:
    instruction: "Put the sentence 'I eat breakfast and drink coffee' in order."
    correct_response: ["Jem", "śniadanie", "i", "piję", "kawę"]

  pl.a1.unit10.lesson01.exercise07.fill_sniadanie:
    instruction: "Complete the sentence to say 'I eat breakfast in the morning.'"
    accepted_answers: ["śniadanie"]
    feedback: "Jem śniadanie rano -- śniadanie means 'breakfast.'"

  pl.a1.unit10.lesson01.exercise08.fix_locative_hour:
    instruction: "Fix the mistake -- Polish says 'o siódmej,' not 'o siódma,' for telling time."
    accepted_answers:
      - "Wstaję o siódmej rano."
      - "Wstaję o siódmej rano"
    feedback: "Wstaję o siódmej rano, not Wstaję o siódma rano -- the hour takes the -ej ending after o."

  pl.a1.unit10.lesson01.exercise09.speak_pije_kawe_rano:
    instruction: "Say 'I drink coffee in the morning.'"
    accepted_answers:
      - "Piję kawę rano."
      - "Piję kawę rano"
      - "Rano piję kawę."

  pl.a1.unit10.lesson02.exercise01.select_obiad:
    instruction: "Which word means 'lunch'?"
    correct_option: "obiad"
    distractors: ["śniadanie", "dom"]
    accepted_answers: ["obiad"]

  pl.a1.unit10.lesson02.exercise02.select_pracuje:
    instruction: "Which word means 'I work'?"
    correct_option: "pracuję"
    distractors: ["wracam", "jem"]
    accepted_answers: ["pracuję"]

  pl.a1.unit10.lesson02.exercise03.select_wracam:
    instruction: "Which word means 'I return' / 'I go back'?"
    correct_option: "wracam"
    distractors: ["pracuję", "jem"]
    accepted_answers: ["wracam"]

  pl.a1.unit10.lesson02.exercise04.match_work_home_vocabulary:
    instruction: "Match each Polish word or phrase to its English meaning."
    correct_response:
      "obiad": "lunch"
      "pracuję": "I work"
      "dom": "home"
      "wracam": "I return"
      "po południu": "in the afternoon"
      "wieczorem": "in the evening"

  pl.a1.unit10.lesson02.exercise05.order_pracuje_po_poludniu:
    instruction: "Put the sentence 'I work in the afternoon' in order."
    accepted_answers:
      - ["Pracuję", "po", "południu"]
      - ["po", "południu", "Pracuję"]

  pl.a1.unit10.lesson02.exercise06.order_wracam_do_domu_wieczorem:
    instruction: "Put the sentence 'I return home in the evening' in order."
    accepted_answers:
      - ["Wracam", "do", "domu", "wieczorem"]
      - ["wieczorem", "Wracam", "do", "domu"]

  pl.a1.unit10.lesson02.exercise07.fill_domu:
    instruction: "Complete the sentence to say 'I return home in the evening.'"
    accepted_answers: ["domu"]
    feedback: "Wracam do domu wieczorem -- domu is the genitive form of dom, used after do."

  pl.a1.unit10.lesson02.exercise08.fix_genitive_dom:
    instruction: "Fix the mistake -- Polish says 'do domu,' not 'do dom,' for 'to home.'"
    accepted_answers:
      - "Wracam do domu wieczorem."
      - "Wracam do domu wieczorem"
    feedback: "Wracam do domu wieczorem, not Wracam do dom wieczorem -- dom takes the -u genitive ending after do, just like bank -> banku."

  pl.a1.unit10.lesson02.exercise09.speak_pracuje_po_poludniu:
    instruction: "Say 'I work in the afternoon.'"
    accepted_answers:
      - "Pracuję po południu."
      - "Pracuję po południu"
      - "Po południu pracuję."

  pl.a1.unit10.lesson03.exercise01.select_ewa_morning_line:
    instruction: "Which line says Ewa gets up at seven and drinks coffee?"
    correct_option: "Wstaję o siódmej rano i piję kawę."
    distractors:
      - "Jem śniadanie, potem pracuję po południu."
      - "Ja też wstaję o siódmej! Ale piję herbatę, nie kawę."
    accepted_answers:
      - "Wstaję o siódmej rano i piję kawę."
      - "Wstaję o siódmej rano i piję kawę"

  pl.a1.unit10.lesson03.exercise02.select_marek_tea_line:
    instruction: "Which line says Marek also gets up at seven, but drinks tea?"
    correct_option: "Ja też wstaję o siódmej! Ale piję herbatę, nie kawę."
    distractors:
      - "Wstaję o siódmej rano i piję kawę."
      - "Śpię wcześnie, o dziesiątej wieczorem."
    accepted_answers:
      - "Ja też wstaję o siódmej! Ale piję herbatę, nie kawę."
      - "Ja też wstaję o siódmej Ale piję herbatę nie kawę"

  pl.a1.unit10.lesson03.exercise03.comprehend_ewa_drink:
    instruction: "Read the line. What does Ewa drink?"
    correct_option: "coffee"
    distractors:
      - "tea"
      - "water"
    accepted_answers:
      - "kawa"
      - "coffee"

  pl.a1.unit10.lesson03.exercise04.comprehend_marek_sleep_time:
    instruction: "Read the line. What time does Marek go to sleep?"
    correct_option: "at ten in the evening"
    distractors:
      - "at seven in the morning"
      - "at noon"
    accepted_answers:
      - "o dziesiątej wieczorem"
      - "at ten in the evening"

  pl.a1.unit10.lesson03.exercise05.match_full_routine_vocabulary:
    instruction: "Match each Polish word to its English meaning."
    correct_response:
      "wstaję": "I get up"
      "śniadanie": "breakfast"
      "piję": "I drink"
      "obiad": "lunch"
      "pracuję": "I work"
      "wracam": "I return"
      "dom": "home"
      "śpię": "I sleep"
      "herbatę": "tea"
      "kawę": "coffee"

  pl.a1.unit10.lesson03.exercise06.order_wieczorem_wracam_do_domu:
    instruction: "Put the sentence 'In the evening I return home' in order."
    accepted_answers:
      - ["Wieczorem", "wracam", "do", "domu"]
      - ["wracam", "do", "domu", "Wieczorem"]

  pl.a1.unit10.lesson03.exercise07.order_marek_full_day:
    instruction: "Put the sentence 'I work in the morning, then I eat lunch at noon' in order."
    accepted_answers:
      - ["Pracuję", "rano", "potem", "jem", "obiad", "w", "południe"]
      - ["rano", "Pracuję", "potem", "jem", "obiad", "w", "południe"]
      - ["Pracuję", "rano", "potem", "w", "południe", "jem", "obiad"]
      - ["rano", "Pracuję", "potem", "w", "południe", "jem", "obiad"]

  pl.a1.unit10.lesson03.exercise08.fill_spie:
    instruction: "Complete Marek's line to say 'I sleep early, at ten in the evening.'"
    accepted_answers: ["Śpię", "śpię"]
    feedback: "Śpię wcześnie, o dziesiątej wieczorem -- śpię means 'I sleep.'"

  pl.a1.unit10.lesson03.exercise09.fix_locative_hour_full_sentence:
    instruction: "Fix the mistake -- Polish says 'o siódmej,' not 'o siódma,' for telling time."
    accepted_answers:
      - "Wstaję o siódmej rano i piję kawę."
      - "Wstaję o siódmej rano i piję kawę"
    feedback: "Wstaję o siódmej rano i piję kawę, not Wstaję o siódma rano i piję kawę -- the hour takes the -ej ending after o."

  pl.a1.unit10.lesson03.exercise10.reply_a_ty:
    instruction: "Answer as Marek: say you also get up at seven, but you drink tea, not coffee."
    accepted_answers:
      - "Ja też wstaję o siódmej! Ale piję herbatę, nie kawę."
      - "Ja też wstaję o siódmej. Ale piję herbatę, nie kawę."
      - "Ja też wstaję o siódmej! Ale piję herbatę, nie kawę"
      - "Też wstaję o siódmej! Ale piję herbatę, nie kawę."
      - "Ja też wstaję o siódmej rano! Ale piję herbatę, nie kawę."
      - "Ja też wstaję o siódmej! Ale piję herbatę, a nie kawę."

  pl.a1.unit10.lesson03.exercise11.speak_spie_wczesnie:
    instruction: "Say 'I sleep early, at ten in the evening.'"
    accepted_answers:
      - "Śpię wcześnie, o dziesiątej wieczorem."
      - "Śpię wcześnie o dziesiątej wieczorem"
