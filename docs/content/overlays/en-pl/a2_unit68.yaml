    - value: Pojechałem do wujka w niedzielę
      status: correct
    - value: W niedzielę pojechałam do wujka.
      status: correct
    - value: W niedzielę pojechałam do wujka
      status: correct
    - value: Pojechałam do wujka w niedzielę.
      status: correct
    - value: Pojechałam do wujka w niedzielę
      status: correct
    feedback: '*W niedzielę pojechałem do wujka* = On Sunday I went to my uncle''s. A woman says *pojechałam*. *Pojechałem do wujka w niedzielę* is also correct.'
  pl.a2.unit68.lesson02.exercise01.choose_jezdzilem_na_rowerze:
    instruction: Which is the correct past tense for "I" (masculine) of *jeździć na rowerze* (to cycle)?
    correct_option: jeździłem na rowerze
    distractors:
    - jeździłeś na rowerze
    - jeździł na rowerze
    - jeździć na rowerze
    accepted_answers:
    - value: jeździłem na rowerze
      status: correct
    feedback: '*Jeździłem na rowerze* = I cycled. Take the infinitive *jeździć*, drop *-ć* and add *-łem*. A woman says *jeździłam*. *Jeździłeś* is "you cycled" and *jeździł* is "he cycled".'
  pl.a2.unit68.lesson02.exercise02.listen_jezdzilem_na_rowerze:
