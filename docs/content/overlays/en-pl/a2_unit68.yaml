teaching:
  pl.a2.unit68.lesson01.teach.weekend_zeszly_weekend:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Weekend* is a masculine noun. *Zeszły weekend* means the weekend that has just passed, so *w zeszły weekend* is the natural phrase for "last weekend" when you tell a story about it.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  pl.a2.unit68.lesson01.teach.sobota_niedziela:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: Day names are not capitalised in Polish unless they start a sentence.
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  pl.a2.unit68.lesson01.teach.robic_zakupy:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Robić zakupy* is the fixed phrase for shopping. *Zakupy* is a plural noun with no singular in this meaning. The past tense of *zrobić* is *zrobiłem* (m) / *zrobiłam* (f).'
    example_gloss: Every Saturday I do the shopping.
  pl.a2.unit68.lesson01.teach.odwiedzac:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Odwiedzać* (to visit) takes the accusative: *odwiedzam wujka*, because the person you visit is a direct object. *Pojechać do wujka* (to go to your uncle''s) uses *do* + genitive.'
    example_gloss: I often go and visit my uncle.
  pl.a2.unit68.lesson01.teach.targ_park_kino:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Targ* and *park* are masculine nouns, *kino* is neuter. After *na* the market is *na targu* (locative); after *do* the cinema is *do kina* (genitive).'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  pl.a2.unit68.lesson01.teach.pracowac_gotowac_jesc:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  pl.a2.unit68.lesson01.teach.co_robiles_w:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Robiłeś* is the past tense of *robić* addressed to a man (*robiłaś* to a woman). The question word *co* comes first.
  pl.a2.unit68.lesson01.teach.w_sobote_zrobilem:
    title: 'The past tense: stem + -ł- + ending'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'The Polish past tense is built from the infinitive: drop *-ć* and add *-ł-* plus a personal ending. *Zrobić* becomes *zrobiłem* when a man speaks and *zrobiłam* when a woman speaks, so the ending shows both the person and the gender, and the pronoun *ja* is not needed. *Pojechać* works the same way: *pojechałem / pojechałam*. In this course the examples use the masculine form; a woman says *-łam* instead of *-łem*. Lesson 3 adds irregular forms, aspect and the neuter.'
  pl.a2.unit68.lesson02.teach.spacerowac_jezdzic_na:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*Grać* is used for games, ball sports and instruments: *grać w piłkę nożną* (*w* + accusative), *grać na gitarze* (*na* + locative). *Ćwiczyć* means doing sport or exercises in general. *Jeździć na rowerze* is "to ride a bike".'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  pl.a2.unit68.lesson02.teach.pracowac_pracowalem_gotowac:
    title: 'Regular verbs: infinitive minus -ć, plus -łem / -łam'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'Regular verbs form the past tense from the infinitive: take off *-ć* and add *-łem* (a man speaking) or *-łam* (a woman speaking). *pracować* → *pracowałem / pracowałam*, *gotować* → *gotowałem*, *spacerować* → *spacerowałem*, *grać* → *grałem*, *jeździć* → *jeździłem*, *ćwiczyć* → *ćwiczyłem*. Other persons: *-łeś / -łaś* for "you" (*pracowałeś*), and *-ł / -ła / -ło* for "he / she / it" (*on pracował, ona pracowała*). The pronoun is normally left out.'
  pl.a2.unit68.lesson02.teach.cwicze_cwiczylem:
    title: Present and past side by side
    gloss: I exercise. I exercised.
    note: 'Compare the present and the past: *ćwiczę* (I exercise) and *ćwiczyłem* (I exercised). The past ending is added to the infinitive stem (*ćwiczy-*), not to the present *ja*-form.'
  pl.a2.unit68.lesson02.teach.spacerowalem_po_parku:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Spacerować* is imperfective: it describes a process (walking around). *Po parku* uses *po* + locative, meaning "around the park".'
  pl.a2.unit68.lesson02.teach.gralem_w_pilke:
    title: Playing football
    gloss: I played football.
    note: 'Ball sports take *grać w* + accusative: *grałem w piłkę nożną* (I played football).'
  pl.a2.unit68.lesson03.teach.miec_byc:
    title: To have and to be
    gloss: to have / to be
    note: '*Mieć* (to have) and *być* (to be) are two of the most common verbs. Past tense of *być*: *byłem / byłam* (I was), *był / była / było* (he / she / it was). Past tense of *mieć*: *miałem / miałam*.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  pl.a2.unit68.lesson03.teach.widziec_widzialem_jesc:
    title: 'Irregular forms: learn them as whole words'
    gloss: see → saw, eat → ate, go → went, can → could, take → took
    note: 'Most verbs follow the pattern infinitive minus *-ć* plus *-łem*, but some change their stem: *widzieć* → *widziałem*, *jeść* → *jadłem*, *iść* → *szedłem* (a woman says *szłam*), *móc* → *mogłem*, *wziąć* → *wziąłem*. Quick check: if you cannot get the past form by dropping *-ć* and adding *-łem*, it is irregular, and you have to learn it as a whole word.'
  pl.a2.unit68.lesson03.teach.widzialem_film:
    title: Watching a film
    gloss: I saw a film.
    note: '*Widziałem film* simply says that you saw a film. To say that you watched a whole film, Polish prefers the perfective *obejrzałem film*.'
  pl.a2.unit68.lesson03.teach.dlugo_spalem_i:
    title: Two past forms in one sentence
    gloss: I slept for a long time and read a book.
    note: 'Each verb carries its own ending: *spałem ... czytałem*. A woman says *Długo spałam i czytałam książkę*.'
  pl.a2.unit68.lesson03.teach.odwiedzilem_wujka:
    title: 'A perfective verb: visiting someone'
    gloss: I visited my uncle.
    note: '*Odwiedzić* (perfective, "to pay a visit") is the finished-action partner of *odwiedzać* (imperfective, "to visit regularly"). *Odwiedziłem wujka* = I visited my uncle (one visit, finished). *Byłem u wujka* (I was at my uncle''s) means nearly the same.'
  pl.a2.unit68.lesson03.teach.widzialem_film_pojechalem:
    title: Aspect and gender in the past tense
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'Polish verbs come in two aspects. Imperfective verbs describe a process, a habit or an action without stressing its result: *widziałem, byłem, pracowałem*. Perfective verbs describe one finished action with a result: *pojechałem, zostałem, zjadłem*. Quick test: ask "Was it completed?" If yes, use the perfective verb. The past tense also shows gender: *byłem* (m) / *byłam* (f) / *było* (neuter, as in *Zrobiło się późno*, "It got late").'
  pl.a2.unit68.lesson03.teach.pojsc_poszedlem_przyjsc:
    title: 'Perfective verbs: a finished result'
    gloss: go → went, come → came, stay → stayed, eat up → ate, buy → bought
    note: 'Perfective verbs describe a single, finished action: *poszedłem* (I went, I set off on foot), *przyszedłem* (I arrived), *zostałem* (I stayed), *zjadłem* (I ate it up), *kupiłem* (I bought it). Their imperfective partners describe a process or a habit: *chodziłem, przychodziłem, zostawałem, jadłem, kupowałem*.'
  pl.a2.unit68.lesson04.teach.najpierw_potem:
    title: First and then
    gloss: first / after that
    note: '*Najpierw* and *potem* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  pl.a2.unit68.lesson04.teach.najpierw_poszedlem_na:
    title: 'Telling it in order: najpierw, potem'
    gloss: First I went to the market, then I cooked.
    note: 'Polish word order is flexible, and the verb ending already shows who acts, so no pronoun is needed: *Najpierw poszedłem na targ, potem gotowałem.* You can join the two parts with *a* before *potem*: *..., a potem gotowałem.*'
  pl.a2.unit68.lesson04.teach.nie_pracowalem_nie:
    title: 'Saying what you did not do: nie'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'In Polish *nie* goes directly in front of the verb, also in the past tense: *Nie pracowałem*, *Nie pojechałem do wujka*. After a negated verb the direct object changes from the accusative to the genitive: *czytałem książkę* becomes *Nie czytałem tej książki*. Do not put *nie* after the verb.'
  pl.a2.unit68.lesson04.teach.nie_pilem_kawy:
    title: 'Saying you had none: the genitive after nie'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'Polish has no separate word for "no" + noun. The verb gets *nie* and the noun goes into the genitive: *piłem kawę* → *Nie piłem kawy*; *miałem czas* → *Nie miałem czasu*; *widziałem film* → *Nie widziałem filmu*. Plural nouns take the genitive plural: *Nie robiłam zakupów*.'
  pl.a2.unit68.lesson04.teach.cwiczyles:
    title: Ewa asks about exercise
    gloss: 'Ewa: Did you exercise?'
    note: 'In a yes/no question the word order does not change: *Ćwiczyłeś?* You can also start with *Czy*: *Czy ćwiczyłeś?*'
  pl.a2.unit68.lesson04.teach.nie_nie_cwiczylem:
    title: Marek says no
    gloss: 'Marek: No, I didn''t exercise.'
  pl.a2.unit68.lesson05.teach.czesc_ewo_to:
    title: A message from Kasia
    gloss: Hi Ewa! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Kasia is telling Ewa about her weekend in order: Saturday morning, afternoon and evening, then Sunday. She is a woman, so all her past-tense verbs end in *-łam* (*poszłam, kupiłam, gotowałam*); a man would say *-łem*. *Po południu* means "in the afternoon" and *wieczorem* "in the evening".'
    glosses:
      Cześć: hi
      spokojny: quiet, calm
      weekend: weekend
      był: 'was (past tense of być, masculine: weekend is masculine)'
      sobotę: Saturday morning
      targ: market
      chleb: bread
      kupiłam: bought (feminine past tense of kupić)
      południu: afternoon (locative of południe; po południu = in the afternoon)
      parku: park
      spacerowałam: walked (feminine past tense of spacerować)
      Wieczorem: in the evening (instrumental of wieczór)
      gotowałam: cooked (feminine past tense of gotować)
      nie: not
      ćwiczyłam: exercised (feminine past tense of ćwiczyć)
      żadnego: no, not any
      filmu: film
      widziałam: saw (feminine past tense of widzieć)
      niedzielę: Sunday
      zostałam: stayed (feminine past tense of zostać)
      długo: long, for a long time
      spałam: slept (feminine past tense of spać)
      książkę: book
      czytałam: read (feminine past tense of czytać)
  pl.a2.unit68.lesson06.teach.czesc_marku_co:
    title: Ewa asks Marek about his weekend
    gloss: 'Ewa: Hi Marek! What did you do last weekend?'
  pl.a2.unit68.lesson06.teach.w_sobote_pojechalem:
    title: Marek describes Saturday
    gloss: 'Marek: On Saturday I went to my uncle''s in Kraków. I ate at my uncle''s.'
    note: '*U wujka* means "at my uncle''s place" (*u* + genitive); *do wujka* is the direction ("to my uncle''s"). *Zjadłem* is the perfective of *jeść*.'
  pl.a2.unit68.lesson06.teach.fajnie_a_w:
    title: Ewa asks about Sunday
    gloss: 'Ewa: Nice! And Sunday?'
  pl.a2.unit68.lesson06.teach.w_niedziele_zostalem:
    title: Marek describes Sunday and asks back
    gloss: 'Marek: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  pl.a2.unit68.lesson06.teach.pojechalam_do_rodzicow:
    title: Ewa describes her weekend
    gloss: 'Ewa: I went to my parents''. I didn''t do any shopping, but I cooked.'
