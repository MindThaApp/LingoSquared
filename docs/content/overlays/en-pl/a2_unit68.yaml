  pl.a2.unit68.lesson03.exercise01.choose_jadlem:
    instruction: Which of these past forms is irregular (not simply the infinitive minus *-ć* plus *-łem*)?
    correct_option: jadłem
    distractors:
    - pracowałem
    - gotowałem
