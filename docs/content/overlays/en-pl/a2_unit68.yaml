  pl.a2.unit68.lesson03.exercise03.match_pracowac_pracowalem_widziec:
    instruction: 'Match each verb and its past form to its aspect: imperfective (a process or habit) or perfective (a finished result).'
    accepted_answers:
    - value:
      - left: pracować → pracowałem
        right: imperfective
      - left: widzieć → widziałem
        right: imperfective
      - left: spać → spałem
        right: imperfective
      - left: pójść → poszedłem
        right: perfective
      - left: przyjść → przyszedłem
        right: perfective
      - left: zostać → zostałem
        right: perfective
      - left: zjeść → zjadłem
        right: perfective
      - left: kupić → kupiłem
        right: perfective
      status: correct
    feedback: 'Imperfective verbs (*niedokonany* in Polish) describe a process or a repeated action: *pracowałem, widziałem, spałem*. Perfective verbs (*dokonany* in Polish) describe one finished action with a result: *poszedłem, przyszedłem, zostałem, zjadłem, kupiłem*.'
