teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: Chiedere a qualcuno che lavoro fa
    gloss: Che lavoro fai?
    note: Un modo standard e informale per chiedere a qualcuno che lavoro fa.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: Mestiere / cuoco
    gloss: il mestiere; cuoco
    note: '*Het beroep* (professione) è un nome neutro. *Kok* (cuoco) è un nome di professione comune, valido per qualsiasi genere: *een kok*, *de kok*.'
    example_gloss:
    - Che lavoro fai?
    - Lavoro come cuoco.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: Dire che fai il cuoco
    gloss: Lavoro come cuoco.
    note: '*Werken als* + professione è lo schema standard per dire il proprio lavoro, senza articolo davanti al nome della professione.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: Infermiere
    gloss: infermiera
    note: Il termine moderno e neutro per questa professione, usato per qualsiasi genere.
    example_gloss: Lavoro come infermiera.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: Dire che fai l'infermiere
    gloss: Lavoro come infermiera.
    note: Segue lo stesso schema *werken als* di *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: Chiedere dove si lavora
    gloss: Dove lavori?
    note: Una domanda che segue direttamente *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: Lavorare in un ristorante
    gloss: Lavoro in un ristorante.
    note: '*Een restaurant* qui ha l''articolo indeterminativo perché è uno fra tanti ristoranti.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: L'ospedale
    gloss: l'ospedale
    note: 'È un nome neutro: *het ziekenhuis*.'
    example_gloss: Lavoro in ospedale.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: Lavorare in ospedale
    gloss: Lavoro in ospedale.
    note: '*Het ziekenhuis* vuole l''articolo determinativo, come in italiano «in ospedale / nell''ospedale»: l''olandese lo tratta come un''istituzione specifica e nota.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: Lavorare in un ufficio
    gloss: Alcune persone lavorano in un ufficio.
    note: '*Op kantoor* (in ufficio) è un''espressione fissa senza articolo, a differenza di *in een restaurant* e *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: L'orario di inizio
    gloss: Comincio alle nove.
    note: '*Begin* è la forma di *beginnen* (iniziare) per ik e riprende lo schema degli orari dell''Unità 4.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: I giorni di lavoro
    gloss: Lavoro dal lunedì al venerdì.
    note: '*Van... tot...* riprende lo schema dell''intervallo tra giorni della settimana dell''Unità 3.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: La pausa
    gloss: la pausa
    note: 'Sostantivo di genere comune: *de pauze*.'
    example_gloss: Ho una pausa alle dodici.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: Fare una pausa
    gloss: Ho una pausa alle dodici.
    note: '*Pauze hebben* (fare una pausa) è l''espressione fissa naturale.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: L'orario di fine
    gloss: Finisco alle cinque.
    note: '*Stop* è la forma con ik di *stoppen* (smettere, finire).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: Una giornata di lavoro completa
    gloss: Comincio alle nove e finisco alle cinque.
    note: Unisce *begin* e *stop* con *en* in un'unica frase che descrive un'intera giornata di lavoro.
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: Le desinenze del verbo alla terza persona
    gloss: 'Con lui o lei, il verbo di solito prende una -t in più: lui lavora, lei lavora.'
    note: '*Werk* diventa *werkt* con *hij*/*zij*: è la normale regola olandese per la terza persona singolare del presente.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Il lavoro di Lotte
    gloss: Lotte lavora come infermiera.
    note: '*Werkt* (non *werk*) perché il soggetto è un nome di terza persona, non *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Il lavoro di Omar
    gloss: Omar lavora come cuoco.
    note: Stessa desinenza -t della terza persona di *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: Usare i pronomi
    gloss: Lei lavora in ospedale. Lui lavora in un ristorante.
    note: '*Zij*/*hij* sostituiscono i nomi Lotte/Omar, ma il verbo mantiene la stessa -t della terza persona.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: Leggi due profili di lavoro
    gloss: Lotte lavora come infermiera in ospedale. Comincia alle sette e lavora dal lunedì al venerdì. Omar lavora come cuoco in un ristorante. Comincia alle undici e ha la pausa alle quattro.
    note: Tieni separati il lavoro, il luogo di lavoro e l'orario di ciascuna persona.
    glosses:
      werkt: lavora
      verpleegkundige: infermiera
      ziekenhuis: ospedale
      begint: inizia
      zeven: sette
      maandag: lunedì
      vrijdag: venerdì
      kok: cuoco / chef
      restaurant: ristorante
      elf: undici
      pauze: pausa
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte chiede del lavoro
    gloss: 'Lotte: Ciao Omar! Sono curiosa: che lavoro fai, in realtà?'
    note: '*Eigenlijk* (in realtà) addolcisce la domanda: dà l''idea di una curiosità amichevole, non di un interrogatorio.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar risponde
    gloss: 'Omar: Lavoro come cuoco in un ristorante. E tu?'
    note: '*En jij?* è il modo standard per rigirare la domanda all''altra persona.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte risponde
    gloss: 'Lotte: Lavoro come infermiera in ospedale.'
    note: Corrisponde al lavoro e al luogo di lavoro già presentati nelle lezioni precedenti.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar chiede degli orari
    gloss: 'Omar: Che orari fai?'
    note: '*Uren maken* (letteralmente «fare ore») è un''espressione fissa per parlare dell''orario di lavoro.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte dice i suoi orari
    gloss: 'Lotte: Comincio alle sette e lavoro dal lunedì al venerdì.'
    note: Corrisponde all'orario già presentato nel testo di lettura della lezione.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar reagisce
    gloss: 'Omar: Presto! Io comincio più tardi, alle undici.'
    note: Corrisponde all'orario d'inizio di Omar già visto in una lezione precedente.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte chiude l'argomento
    gloss: 'Lotte: Ogni lavoro ha il suo ritmo, penso.'
    note: 'Una battuta finale naturale e riflessiva: riconoscila per il significato, non serve saperla riprodurre esattamente.'
