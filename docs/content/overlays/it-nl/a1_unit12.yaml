teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: Il passato olandese di ogni giorno
    gloss: Nelle conversazioni, un evento concluso si esprime di solito con hebben o zijn più un participio passato.
    note: In olandese questa forma del passato composto è la normale per raccontare un evento concluso, come in italiano il passato prossimo. *Ik heb koffie gedronken* significa «ho bevuto il caffè».
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: Ho bevuto il caffè
    gloss: bere → Ho bevuto il caffè.
    note: '*Heb* è l''ausiliare e *gedronken* è il participio passato di *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: Sono andato/a al supermercato
    gloss: andare → Sono andato/a al supermercato.
    note: '*Gaan* usa *zijn*: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: Il participio va in fondo alla frase
    gloss: 'Il participio passato sta alla fine: Ik heb koffie gedronken. Pensa alla posizione finale di op in Ik sta op.'
    note: Nell'unità 10 hai già imparato a prestare attenzione a un elemento importante alla fine della frase. Qui l'elemento finale è il participio passato.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: La maggior parte dei verbi usa hebben
    gloss: La maggior parte dei verbi usa hebben.
    note: In questa unità usa *hebben* con *drinken*, *eten*, *werken* e *kopen*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken con hebben
    gloss: bere → Ho bevuto il caffè.
    note: Lo schema completo è *ik + heb + complemento + gedronken*.
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten con hebben
    gloss: mangiare → Ho mangiato il pane.
    note: Il participio passato di *eten* è *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken con hebben
    gloss: lavorare → Ho lavorato.
    note: Il participio passato di *werken* è *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen con hebben
    gloss: comprare → Ho comprato le mele.
    note: Il participio passato di *kopen* è *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan e komen usano zijn
    gloss: Con gaan e komen si usa zijn.
    note: Questi due verbi di movimento molto comuni usano *zijn*, non *hebben*, nella costruzione dell'evento concluso presentata qui.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan con zijn
    gloss: andare → Sono andato/a al supermercato.
    note: Usa *ben* con *ik* e metti *gegaan* alla fine.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen con zijn
    gloss: venire → Sono venuto/a al caffè linguistico.
    note: Usa *ben* con *ik* e metti *gekomen* alla fine.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: Confronta gli ausiliari
    gloss: Ho lavorato, ma sono andato/a al supermercato.
    note: '*Werken* vuole *hebben*; *gaan* vuole *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: Ieri, stamattina
    gloss: ieri, stamattina
    note: '*Gisteren* indica il giorno prima di oggi; *vanmorgen* si riferisce alla mattina di oggi.'
    example_gloss:
    - Ieri ho lavorato.
    - Stamattina alle otto ho bevuto il caffè.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: Ieri ho lavorato
    gloss: Ieri ho lavorato.
    note: Quando la frase inizia con *gisteren*, *heb* viene prima di *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: Il caffè di stamattina
    gloss: Stamattina alle otto ho bevuto il caffè.
    note: Qui si riprende *om acht uur* dal sistema dell'orologio dell'unità 4.
  nl.a1.unit12.lesson04.teach.time_order:
    title: Se il tempo è all'inizio, l'ordine cambia
    gloss: 'Dopo Gisteren o Vanmorgen, il verbo viene prima di ik: Gisteren heb ik ...'
    note: È lo stesso ordine, con il verbo prima di *ik*, già visto dopo *daarna* nell'unità 10.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: Il racconto di eventi recenti
    gloss: Stamattina sono andato/a al supermercato. Ho comprato delle mele. Poi sono andato/a al caffè linguistico. Lì ho bevuto un caffè.
    note: Leggi cercando il riferimento temporale, i luoghi e ogni azione conclusa.
    glosses:
      Vanmorgen: stamattina
      supermarkt: supermercato
      gegaan: andato/a
      appels: mele
      gekocht: comprato
      Daarna: dopo
      taalcafé: caffè delle lingue
      Daar: lì
      koffie: caffè
      gedronken: bevuto
  nl.a1.unit12.lesson06.teach.question:
    title: Che cosa hai fatto ieri?
    gloss: 'Lotte: Che cosa hai fatto ieri, Omar?'
    note: '*Wat heb je ... gedaan?* è la normale domanda informale per chiedere che cosa ha fatto qualcuno.'
  nl.a1.unit12.lesson06.teach.answer:
    title: Le tre azioni di Omar
    gloss: 'Omar: Ho lavorato. Poi sono andato al supermercato. Ho comprato delle mele.'
    note: La risposta presenta tre semplici azioni concluse in frasi separate.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: E stamattina?
    gloss: 'Lotte: E che cosa hai fatto stamattina?'
    note: Sostituisci *gisteren* con *vanmorgen* per chiedere di un altro momento recente.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar è venuto al caffè linguistico
    gloss: 'Omar: Stamattina alle otto sono venuto al caffè linguistico.'
    note: '*Komen* usa *zijn*: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte ha bevuto il caffè
    gloss: 'Lotte: Che bello. Stamattina ho bevuto il caffè.'
    note: '*Drinken* usa *hebben*: *heb ... gedronken*.'
