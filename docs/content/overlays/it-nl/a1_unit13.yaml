teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden per cibo e bevande
    gloss: Per cibo e bevande l'olandese usa spesso lekker vinden.
    note: In olandese non esiste un'unica espressione corrispondente a «piacere». Per un sapore si dice *Ik vind ... lekker*, letteralmente «trovo ... buono».
  nl.a1.unit13.lesson01.teach.koffie:
    title: Il caffè che piace
    gloss: Il caffè mi piace.
    note: Il cibo o la bevanda sta tra *vind* e *lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: Il tè che non piace
    gloss: Il tè non mi piace.
    note: Metti *niet* prima di *lekker* per dire che il sapore non ti piace.
  nl.a1.unit13.lesson01.teach.question:
    title: Chiedere di un sapore
    gloss: Ti piace la zuppa di pomodoro?
    note: Nella domanda informale *vind* viene prima di *je*. Si continua con il registro *jij/je* del corso.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden per le attività
    gloss: 'Con le attività l''olandese usa spesso leuk vinden: mi piace andare in bicicletta.'
    note: Per un'attività come andare in bicicletta usa *leuk*, non *lekker*.
  nl.a1.unit13.lesson02.teach.walking:
    title: Piace passeggiare
    gloss: Mi piace passeggiare.
    note: L'attività *wandelen* sta tra *vind* e *leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: Non piace fare shopping
    gloss: Non mi piace fare shopping.
    note: '*Niet* viene prima di *leuk*.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: Chiedere delle attività
    gloss: Che cosa ti piace fare?
    note: '*Wat vind je leuk om te doen?* è una domanda generale e naturale sulle attività preferite di qualcuno.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: Un piacere più forte o generale
    gloss: Houden van esprime un affetto forte o un piacere generale.
    note: Usalo con moderazione. Le reazioni comuni a un cibo o a un'attività si esprimono più naturalmente con *lekker vinden* o *leuk vinden*.
  nl.a1.unit13.lesson03.teach.music:
    title: Amare la musica
    gloss: Amo la musica / Mi piace molto la musica.
    note: '*Houd* è la forma di *houden* per *ik*; dopo viene *van*.'
  nl.a1.unit13.lesson03.teach.films:
    title: Non amare i film
    gloss: Non mi piacciono i film.
    note: Nella forma negativa *niet* sta tra *houd* e *van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: Scegliere l'espressione naturale
    gloss: 'Per un gusto comune di'' anche: mi piace il caffè. Per un''attività: mi piace passeggiare.'
    note: Non tradurre automaticamente ogni «piacere» italiano con *houden van*.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: Offrire due opzioni
    gloss: Vuoi caffè o tè?
    note: '*Wil je ... of ...?* chiede all''altra persona di scegliere.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: Dire che cosa preferisci
    gloss: Preferisco il tè.
    note: In questo schema di scelta comune *liever* segue *wil*.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: Preferire un oggetto
    gloss: Preferisco il maglione blu.
    note: '*Ik heb liever ...* è naturale anche quando si sceglie un oggetto rispetto a un altro.'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever indica l'opzione preferita
    gloss: Liever mostra che scegli un'opzione piuttosto che un'altra.
    note: Il confronto può restare implicito quando le due scelte sono chiare dalla conversazione.
  nl.a1.unit13.lesson05.teach.message:
    title: Leggere più preferenze
    gloss: Ciao Lotte, il film mi piace, ma a Omar non piacciono i film. Preferisce andare al parco. Anche a me piace passeggiare.
    note: Individua a chi piace il film, a chi non piacciono i film e quale alternativa sceglie Omar.
    glosses:
      Hoi: ciao
      vind: piacere / trovare
      film: film
      leuk: bello / divertente
      maar: ma
      houdt: ama, piace (houdt van)
      films: film
      wil: vuole
      liever: piuttosto / preferisce
      park: parco
      wandelen: passeggiare
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte propone due cibi
    gloss: 'Lotte: Che cosa vuoi mangiare, Omar? Vuoi pane o zuppa di pomodoro?'
    note: La seconda domanda offre le due scelte.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar sceglie la zuppa
    gloss: 'Omar: Preferisco la zuppa di pomodoro. Mi piace la zuppa di pomodoro. E tu?'
    note: Omar prima sceglie con *liever*, poi lo spiega come gusto con *lekker*.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte sceglie il pane
    gloss: 'Lotte: Preferisco il pane. La zuppa di pomodoro non mi piace molto.'
    note: '*Niet zo lekker* attenua la negazione ed è naturale in una conversazione amichevole.'
  nl.a1.unit13.lesson06.teach.activity:
    title: Scegliere che cosa fare dopo
    gloss: 'Omar: Che cosa vuoi fare dopo mangiato? Lotte: Mi piace passeggiare.'
    note: '*Leuk* descrive l''attività *wandelen*.'
  nl.a1.unit13.lesson06.teach.plan:
    title: Condividono una preferenza
    gloss: 'Omar: Anche a me. Amo passeggiare. Andiamo al parco? Lotte: Bella idea.'
    note: Questo si ricollega al linguaggio informale per fare progetti dell'Unità 11.
