teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *lezen* (leggere), *sporten* (fare sport) e *koken* (cucinare).'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: Tempo libero
    gloss: tempo libero
    note: '*De vrije tijd* è un sostantivo di genere comune: *de vrije tijd*. È l''espressione chiave per parlare degli hobby.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Lees* è la prima persona singolare di *lezen* (leggere).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre verbi per gli hobby: *muziek luisteren* (ascoltare musica), *tekenen* (disegnare) e *gamen* (giocare ai videogiochi), un prestito dall''inglese molto diffuso in olandese.'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*Luisteren naar* (ascoltare) vuole sempre *naar* davanti al complemento.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Met vrienden* (con gli amici) riprende *vrienden* dalla lezione 1.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: I quattro avverbi di frequenza fondamentali. *Vaak* era già comparso nell'unità 5 in *Zie je hem vaak?*; gli altri tre sono nuovi.
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Elke week* ed *elk weekend* significano entrambi «ogni», ma la forma cambia in base al genere del sostantivo: vedi la scheda successiva.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke o elk
    gloss: Con le parole de, come week, si usa elke. Con le parole het, come weekend, si usa elk.
    note: '*Week* è una parola de (*de week*), quindi vuole *elke*; *weekend* è una parola het (*het weekend*), quindi vuole *elk*. È lo stesso accordo de/het di *de rekening* e *het wisselgeld* nell''unità 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte introduce il tema degli hobby
    gloss: 'Lotte: Facciamo spesso passeggiate insieme. Ma tu che cos''altro fai nel tempo libero, Omar?'
    note: '*We wandelen vaak samen* richiama l''unità 13, in cui sia Lotte sia Omar dicevano che gli piace *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Gli hobby di Omar
    gloss: 'Omar: Mi piace cucinare, anche a casa. E faccio spesso sport.'
    note: '*Ook thuis* (anche a casa) chiarisce che Omar cucina per piacere, non solo nel suo lavoro al ristorante.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte è sorpresa
    gloss: 'Lotte: Cucini anche a casa? Cucini già tutto il giorno al lavoro!'
    note: '*Al de hele dag* (già tutto il giorno) sottolinea quanto Omar cucini già al lavoro.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar spiega
    gloss: 'Omar: Sì, ma per me cucinare è rilassante. E tu, che cosa ti piace fare?'
    note: '*Koken vind ik ontspannend* mette in prima posizione l''oggetto *koken* per enfasi, letteralmente «cucinare, lo trovo rilassante».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Gli hobby di Lotte
    gloss: 'Lotte: Mi piace leggere e ascolto spesso musica.'
    note: Unisce in una frase due verbi per gli hobby delle lezioni 1-2 con *en* (e).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar chiede dei videogiochi
    gloss: 'Omar: Giochi anche tu ai videogiochi?'
    note: Una breve domanda sì/no con *gamen* della lezione 2.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte risponde
    gloss: 'Lotte: No, non gioco mai ai videogiochi. Ma ogni tanto disegno!'
    note: '*Nooit* (mai) e *soms* (ogni tanto) dalla lezione 3, messi a confronto in un''unica risposta.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: Confronto tra hobby
    gloss: Io e Omar facciamo spesso passeggiate insieme. Ma abbiamo anche altri hobby. A Omar piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. Ogni tanto disegno, ma non gioco mai ai videogiochi. E a te, che cosa piace fare nel tempo libero?
    note: Il messaggio di Lotte riassume i fatti della lezione 4 e finisce ponendo a chi legge la domanda centrale dell'unità.
    glosses:
      wandelen: passeggiamo
      vaak: spesso
      samen: insieme
      andere: altri
      kookt: cucina
      graag: piace
      thuis: a casa
      sport: fa sport
      lees: leggere
      luister: ascolto
      muziek: musica
      teken: disegno
      soms: a volte
      game: gioco ai videogiochi
      nooit: mai
      vrije: libero
      tijd: tempo
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar chiede del fine settimana
    gloss: 'Omar: Che fai questo weekend?'
    note: '*Dit weekend* (questo weekend) riprende l''espressione di tempo dell''unità 19.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte è indecisa
    gloss: 'Lotte: Non lo so ancora. Mi piace leggere, ma voglio anche uscire all''aperto.'
    note: '*Naar buiten* (fuori, letteralmente «verso l''esterno») è un modo comune per dire che si vuole uscire di casa.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar propone un programma
    gloss: 'Omar: Facciamo una passeggiata insieme? Dopo cucino io per noi.'
    note: '*Daarna* (dopo) riprende la parola di sequenza *eerst, dan, daarna* dell''unità 10.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte accetta
    gloss: 'Lotte: Bella idea! Mi piacciono sia le passeggiate sia cucinare.'
    note: '*Allebei* (entrambi) mostra che a Lotte piacciono due cose allo stesso modo, senza preferenze.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar conferma
    gloss: 'Omar: Perfetto. Allora ci vediamo sabato!'
    note: Una battuta finale cordiale che conferma il programma per *zaterdag* (sabato).
