course:
  title: Olandese A1
  description: 'Olandese per principianti per parlare delle attività del tempo libero: lessico degli hobby, espressioni di frequenza, come chiedere e dire che cosa si fa nel tempo libero e come confrontare gli hobby di due persone.'
