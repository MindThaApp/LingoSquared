teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: Ora
    gloss: l'ora
    note: '*Uur* segue il numero per indicare un''ora esatta: *twee uur* sono le due in punto.'
    example_gloss: Sono le due in punto.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: Le due in punto
    gloss: 2:00 — le due in punto
    note: Per un'ora intera, di' il numero seguito da *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: Le tre in punto
    gloss: 3:00 — le tre in punto
    note: '*Drie uur* sono esattamente le 3:00.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: A metà verso le tre
    gloss: 2:30 — le due e mezza
    note: 'Differenza fondamentale rispetto all''italiano: in olandese *half drie* indica l''ora che sta per arrivare, quindi sono le 2:30, non le 3:30. Attenzione: in italiano «le tre e mezza» è 3:30.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half rimanda all'ora successiva
    gloss: half drie = a metà strada verso le tre = 2:30
    note: Leggi *half* + ora come «a metà strada verso quell'ora». Quindi *half vier* è 3:30.
  nl.a1.unit04.lesson01.teach.half_four:
    title: A metà verso le quattro
    gloss: 3:30 — le tre e mezza
    note: '*Half vier* è a metà strada verso le quattro, quindi significa 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: Dire una mezz'ora
    gloss: Sono le due e mezza.
    note: '*Het is ...* è la formula normale per dire l''ora attuale.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: Quarto d'ora
    gloss: il quarto d'ora
    note: '*Kwart* si usa nelle espressioni fisse dell''ora *kwart over* e *kwart voor*.'
    example_gloss: Un quarto d'ora è quindici minuti.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: Le due e un quarto
    gloss: 2:15 — le due e un quarto
    note: '*Kwart over twee* sono quindici minuti dopo le due.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over significa «e»
    gloss: e (dopo) = dopo l'ora intera
    note: Nelle espressioni dell'ora, *over* conta in avanti a partire dall'ora appena passata.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: Le tre meno un quarto
    gloss: 2:45 — le tre meno un quarto
    note: '*Kwart voor drie* sono quindici minuti prima delle tre, quindi è 2:45.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor significa «meno»
    gloss: meno = prima dell'ora intera successiva
    note: Nelle espressioni dell'ora, *voor* guarda verso l'ora successiva.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: Le tre e un quarto
    gloss: 3:15 — le tre e un quarto
    note: '*Over* indica l''ora appena trascorsa: *kwart over drie* = le tre e un quarto.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: Le quattro meno un quarto
    gloss: 3:45 — le quattro meno un quarto
    note: '*Voor* indica l''ora che sta per arrivare: *kwart voor vier* sono le 3:45.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: '*Hoe laat is het?* è la domanda abituale di ogni giorno per chiedere l''ora.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: Dire l'ora
    gloss: Sono le due e mezza.
    note: 'Attenzione: in olandese *half drie* si riferisce alle tre, ma indica le 2:30, cioè mezz''ora prima delle tre.'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: Chiedere quando inizia un'attività
    gloss: A che ora inizia il caffè linguistico?
    note: '*Hoe laat* introduce una domanda in cui si chiede un orario.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: Alle due e un quarto
    gloss: Alle due e un quarto.
    note: Usa *om* davanti all'ora quando dici a che ora avviene qualcosa.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: Usare om per l'ora di un evento
    gloss: 'a + ora: alle due, alle due e mezza'
    note: Non usare *om* quando dici semplicemente che ora è con *Het is*.
  nl.a1.unit04.lesson03.teach.late:
    title: Chiedere se sei in ritardo
    gloss: Sono in ritardo?
    note: Qui *laat* significa «tardi, in ritardo»; la frase è tipica di uno scambio sugli orari.
  nl.a1.unit04.lesson03.teach.on_time:
    title: Dire che qualcuno è puntuale
    gloss: No, sei in orario.
    note: '*Op tijd* significa «in orario». *Je* mantiene lo scambio informale.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: Le quattordici
    gloss: 14:00 — le quattordici
    note: Orari e annunci usano spesso le 24 ore. *Veertien uur* è una lettura parlata di 14:00 che non lascia dubbi.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: Le diciotto
    gloss: 18:00 — le diciotto
    note: '*Achttien uur* è la forma a 24 ore per le 6 del pomeriggio.'
  nl.a1.unit04.lesson04.teach.morning:
    title: Le sette del mattino
    gloss: 7:00 — le sette del mattino
    note: '*''s Ochtends* significa «di mattina». Il *''s* iniziale fa parte dell''espressione fissa.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: Le due del pomeriggio
    gloss: 14:00 — le due del pomeriggio
    note: '*''s Middags* copre il pomeriggio, a partire da mezzogiorno circa; distingue le 14:00 dalle 2:00 quando si parla con le 12 ore.'
  nl.a1.unit04.lesson04.teach.evening:
    title: Le otto di sera
    gloss: 20:00 — le otto di sera
    note: '*''s Avonds* si usa per la sera, più o meno dal tardo pomeriggio fino a mezzanotte.'
  nl.a1.unit04.lesson04.teach.night:
    title: Le due di notte
    gloss: 2:00 — le due di notte
    note: '*''s Nachts* si usa per le ore notturne; le 2:00 sono naturalmente *twee uur ''s nachts*.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: Le parti della giornata
    gloss: la mattina · il pomeriggio · la sera · la notte
    note: 'I confini sono approssimativi, come in italiano: *ochtend* arriva fino a mezzogiorno circa, *middag* va da mezzogiorno lungo il pomeriggio, *avond* copre la sera e *nacht* il periodo notturno.'
    example_gloss:
    - La mattina bevo il caffè.
    - Il caffè linguistico è nel pomeriggio.
    - La sera leggo.
    - Di notte dormo.
  nl.a1.unit04.lesson05.teach.schedule:
    title: Orario
    gloss: l'orario
    note: Un *rooster* elenca le attività e i loro orari.
    example_gloss: Leggo l'orario.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: Orari di apertura del caffè linguistico
    gloss: 'Caffè linguistico aperto: 14:00–16:00'
    note: Negli orari olandesi si usa spesso il punto tra ore e minuti, mentre in italiano si usano di solito i due punti o la virgola; 14.00 è la stessa ora di 14:00.
  nl.a1.unit04.lesson05.teach.welcome:
    title: Orario di benvenuto
    gloss: 14:15 Benvenuto
    note: 14.15 si può dire *kwart over twee* nel linguaggio quotidiano a 12 ore.
  nl.a1.unit04.lesson05.teach.workshop:
    title: Orario del workshop
    gloss: 14:45 Workshop
    note: '14.45 è *kwart voor drie*: il quarto prima delle tre.'
  nl.a1.unit04.lesson05.teach.break:
    title: Orario della pausa
    gloss: 15:30 Pausa
    note: '15.30 è *half vier*, cioè a metà strada verso le quattro: non «le quattro e mezza».'
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: Chiedere un orario del programma
    gloss: A che ora inizia il laboratorio?
    note: '*Begint* chiede quando inizia l''attività.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: Dire l'orario del workshop
    gloss: Alle tre meno un quarto.
    note: Le 14.45 del programma corrispondono a *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: Confermare l'orario del caffè linguistico
    gloss: 'Lotte: A che ora inizia il caffè linguistico venerdì? Omar: Alle due e un quarto, quindi alle 14:15.'
    note: 'Omar dà entrambe le forme: *kwart over twee* e 14.15 indicano la stessa ora, come l''orario di benvenuto nel programma della lezione 5.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: Chiedere del workshop
    gloss: 'Lotte: E a che ora inizia il workshop? Omar: Alle tre meno un quarto.'
    note: '*Kwart voor drie* sono le 14:45, come nel programma della lezione 5.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: Indicare l'ora di arrivo
    gloss: 'Lotte: Bene. Allora io sono lì alle due.'
    note: Lotte pensa di arrivare alle 14:00, quindici minuti prima dell'inizio delle 14:15.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: Chiudere l'accordo
    gloss: 'Omar: Perfetto, ci vediamo venerdì pomeriggio!'
    note: '*Vrijdagmiddag* è un composto naturale che significa «venerdì pomeriggio».'
