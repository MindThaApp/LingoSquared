teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: Il tempo
    gloss: il tempo (meteorologico)
    note: 'Un sostantivo neutro: *het weer*.'
    example_gloss: Che tempo fa?
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: Chiedere che tempo fa
    gloss: Che tempo fa?
    note: '*Wat voor* + sostantivo chiede «che tipo di»; è una domanda generale molto comune.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: Soleggiato
    gloss: C'è il sole.
    note: '*Het is* + aggettivo del tempo è lo schema standard, con il *het* impersonale (soggetto neutro).'
  nl.a1.unit19.lesson01.teach.regent:
    title: Pioggia
    gloss: Piove.
    note: '*Regenen* (piovere) si usa in modo impersonale: *het regent*, senza bisogno di un aggettivo.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: Nuvoloso
    gloss: È nuvoloso.
    note: Segue lo stesso schema *het is* + aggettivo di *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: Freddo
    gloss: Oggi fa freddo.
    note: '*Vandaag* (oggi) colloca nel tempo la descrizione del meteo.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: Oggi fa caldo.
    note: '*Warm* copre sia «caldo» sia «molto caldo» nel linguaggio quotidiano sul tempo.'
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: Temperature a confronto
    gloss: Non fa freddo, fa caldo.
    note: '*Niet* nega *koud* direttamente, davanti all''aggettivo.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: Le previsioni del tempo
    gloss: le previsioni del tempo
    note: 'Un sostantivo neutro: *het weerbericht*, composto da *weer* (tempo atmosferico) e *bericht* (notizia, bollettino).'
    example_gloss: Quali sono le previsioni del tempo?
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: Il tempo di domani
    gloss: Domani c'è il sole.
    note: '*Morgen* (domani) va all''inizio della frase, quindi *is het* si inverte dopo di esso.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: Previsioni per due giorni
    gloss: Sabato c'è il sole e fa caldo, ma domenica piove tutto il giorno.
    note: '*De hele dag* (tutto il giorno) sottolinea quanto dura la pioggia.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: La passeggiata
    gloss: la passeggiata
    note: 'Un sostantivo di genere comune: *de wandeling*.'
    example_gloss: Facciamo una passeggiata?
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: Proporre una passeggiata
    gloss: Facciamo una passeggiata?
    note: '*Zullen we...?* riprende lo schema per proporre un programma dell''unità 11; *een wandeling maken* (letteralmente «fare una camminata») è il modo fisso per dire «fare una passeggiata».'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: Un programma condizionato
    gloss: Se piove, restiamo in casa.
    note: '*Als* (se) introduce la condizione; la principale *blijven we binnen* inverte soggetto e verbo perché la frase con als viene prima.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: Accettare e proporre
    gloss: Buona idea! Facciamo una passeggiata.
    note: '*Laten we...* (facciamo...) è un altro modo comune per proporre un''attività, accanto a *Zullen we...?* dell''unità 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: Leggi le previsioni di due giorni
    gloss: 'Previsioni del tempo: sabato c''è il sole e fa caldo. Domenica piove tutto il giorno.'
    note: Fai attenzione a quale giorno ha quali condizioni.
    glosses:
      Weerbericht: previsioni del tempo
      zaterdag: sabato
      zonnig: soleggiato
      warm: caldo
      Zondag: domenica
      regent: piove
      hele: intera
      dag: giorno
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte chiede del fine settimana
    gloss: 'Lotte: Che tempo fa questo fine settimana?'
    note: '*Dit weekend* (questo fine settimana) colloca la domanda nel futuro prossimo.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar dà le previsioni del tempo
    gloss: 'Omar: Sabato è soleggiato e caldo, ma domenica piove tutto il giorno.'
    note: Corrisponde esattamente alle previsioni lette nella lezione 5.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte propone un programma
    gloss: 'Lotte: Allora facciamo una passeggiata sabato?'
    note: '*Dan* (allora) collega la proposta direttamente al bel tempo appena descritto da Omar.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar accetta e programma la domenica
    gloss: 'Omar: Buona idea. E domenica restiamo tranquilli in casa.'
    note: '*Lekker* qui è una parola di colore che significa più o meno «piacevolmente»; si usa spesso davanti a un aggettivo o a un verbo per renderlo più invitante.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte conclude il programma
    gloss: 'Lotte: Perfetto, allora guardiamo un film.'
    note: '*Kijken* (guardare) si abbina naturalmente a *een film* (un film).'
