    title: La struttura Ik vind
    gloss: '*Ik vind* + stagione + qualità indica che cosa pensi di una stagione: Mi piace l''estate.'
    note: 'Si riprende la struttura *Ik vind X Y* già vista per esprimere un''opinione (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig): nessuna grammatica nuova, solo un nuovo uso. *vind* resta senza -t perché il soggetto è *Ik* (1ª persona); anche nella domanda *Welk seizoen vind jij mooi?* non c''è la -t, perché *jij* segue il verbo (inversione). La forma di 3ª persona *vindt* (come in *Omar vindt ...*) è un punto grammaticale a parte, che vedrai più avanti.'
