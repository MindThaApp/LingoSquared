    gloss: 'Ora è primavera. I tulipani sono belli. Nina chiede: Quale stagione trovi bella? Omar dice: Mi piace l''estate. In estate nuotiamo. Lotte dice: Mi piace l''inverno. In inverno pattiniamo.'
