teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: Insieme
    gloss: insieme
    note: '*Samen* chiarisce che le persone fanno l''attività insieme.'
    example_gloss: Prendiamo un caffè insieme?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: Prendere un caffè
    gloss: prendere un caffè
    note: In italiano si dice «prendere un caffè»; in olandese si usa *koffie drinken*, letteralmente «bere caffè».
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: Andare al cinema
    gloss: andare al cinema
    note: '*Naar de film gaan* è un modo comune per dire che si va al cinema senza aggiungere un''altra parola per il luogo.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: Prendiamo un caffè?
    gloss: Prendiamo un caffè?
    note: '*Zullen we ...?* è la formula olandese standard per proporre un''attività da fare insieme.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Usare Zullen we
    gloss: Zullen we + attività? è il modo più comune per proporre di fare qualcosa insieme.
    note: 'Metti l''attività dopo *we* e il verbo alla fine: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: Hai voglia di andare al cinema?
    gloss: Hai voglia di andare al cinema?
    note: '*Heb je zin om ...?* chiede in modo informale se l''altra persona ha voglia di fare qualcosa. Qui si usa *te* prima di *gaan*.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: Sì, che bello!
    gloss: Sì, che bello!
    note: '*Ja, leuk!* è un''accettazione breve ed entusiasta.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: Buona idea
    gloss: Buona idea!
    note: '*Goed idee!* accetta la proposta valutandola in modo positivo.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: È un bel programma
    gloss: È un bel programma.
    note: È una risposta positiva un po' più completa.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: Rifiutare con un motivo
    gloss: Mi dispiace, non posso, perché lavoro.
    note: '*Sorry* attenua il rifiuto e *want* introduce il breve motivo.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: Non ho tempo
    gloss: Non ho tempo.
    note: '*Ik heb geen tijd* è un motivo diretto ma normale per rifiutare.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: Un rifiuto gentile
    gloss: Sorry + non posso + un breve motivo rende gentile un rifiuto.
    note: In conversazione il motivo è facoltativo, ma rende la risposta più utile e cortese.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: Darsi appuntamento
    gloss: darsi appuntamento
    note: '*Afspreken* si scrive in una parola dopo *Zullen we*. In *We spreken vrijdag af* si divide in *spreken* e *af*.'
    example_gloss: Ci vediamo venerdì alle 2:30?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: Appuntamento venerdì alle due e mezza
    gloss: Ci vediamo venerdì alle 2:30?
    note: Qui si uniscono il giorno della settimana dell'Unità 3 e *om* più l'ora dell'Unità 4.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie significa le 2:30
    gloss: half drie = le 2:30; om half drie indica l'ora dell'appuntamento.
    note: 'In olandese si conta verso l''ora successiva: *half drie* è a metà strada verso le tre, quindi significa le 2:30. In italiano, invece, si dice «le due e mezza».'
  nl.a1.unit11.lesson03.teach.date_time:
    title: Una data e un'ora
    gloss: venerdì 17 aprile alle 3:15
    note: I giorni della settimana e i mesi restano in minuscolo. Usa *op* per la data e *om* per l'ora.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: Confermare l'orario
    gloss: Sì, venerdì alle 2:30 va bene.
    note: '*Is goed* conferma che l''orario proposto va bene.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: Messaggio, invito, caffè delle lingue
    gloss: il messaggio, l'invito, il caffè delle lingue
    note: '*Bericht* è un breve messaggio scritto o digitale, una *uitnodiging* invita qualcuno a partecipare a un''attività o a un evento, e *taalcafé* (una sola parola composta, con l''accento) è il luogo di ritrovo del gruppo.'
    example_gloss:
    - Ho un messaggio di Lotte.
    - Questo è un invito al caffè delle lingue.
    - Prendiamo un caffè al caffè delle lingue.
  nl.a1.unit11.lesson04.teach.invitation:
    title: L'invito di Lotte
    gloss: Ciao Omar, hai voglia di prendere un caffè al caffè linguistico sabato 18 aprile alle 2:30? Un saluto, Lotte.
    note: 'Leggi cercando quattro dettagli: attività, data, ora e luogo.'
    glosses:
      Hoi: ciao
      zin: desiderio (heb je zin = hai voglia di)
      zaterdag: sabato
      april: aprile
      half: mezz'ora PRIMA dell'ora successiva (half acht = 7:30)
      drie: tre
      koffie: caffè
      drinken: bere / prendere
      taalcafé: caffè delle lingue
      Groet: un saluto
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: Un messaggio di proposta
    gloss: Ciao Omar, prendiamo un caffè venerdì alle 2:30? Un saluto, Lotte.
    note: Il messaggio contiene un saluto, un'attività, un giorno, un orario e una chiusura.
    glosses:
      Hoi: ciao
      zullen: '(proposta: «prendiamo?»)'
      vrijdag: venerdì
      half: mezz'ora PRIMA dell'ora successiva (half acht = 7:30)
      drie: tre
      koffie: caffè
      drinken: bere / prendere
      Groet: un saluto
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: Un messaggio di conferma
    gloss: Ciao Lotte, sì, volentieri! Venerdì alle 2:30 va bene. A venerdì! Omar.
    note: La risposta accetta l'attività e ripete l'orario per confermarlo.
    glosses:
      Hoi: ciao
      leuk: che bello / che bella idea
      Vrijdag: venerdì
      half: mezz'ora PRIMA dell'ora successiva (half acht = 7:30)
      drie: tre
      goed: va bene / è comodo
      Tot: fino a / a presto
      vrijdag: venerdì
  nl.a1.unit11.lesson05.teach.message_shape:
    title: Cosa contiene un messaggio
    gloss: Un messaggio breve indica l'attività, il giorno o la data e l'ora.
    note: Il saluto e la chiusura sono utili, ma i dettagli importanti sono l'attività e il momento in cui si svolge.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte propone un caffè
    gloss: 'Lotte: Prendiamo un caffè venerdì? Omar: Sì, volentieri! A che ora?'
    note: Omar accetta l'attività prima di chiedere l'ora.
  nl.a1.unit11.lesson06.teach.first_time:
    title: Il primo orario di Lotte
    gloss: 'Lotte: Alle 2:30.'
    note: '*Half drie* significa le 2:30, secondo la convenzione dell''Unità 4.'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar propone un altro orario
    gloss: 'Omar: Mi dispiace, alle 2:30 non posso. Si può alle 3:15?'
    note: '*Kan het om ...?* è un modo conciso per chiedere se va bene un altro orario.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: Confermano il programma finale
    gloss: 'Lotte: Sì, le 3:15 vanno bene. Omar: Ottimo. Allora ci vediamo venerdì alle 3:15.'
    note: 'Qui *afspreken* si divide: *spreken* all''inizio e *af* alla fine.'
