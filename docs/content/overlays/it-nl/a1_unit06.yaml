  nl.a1.unit06.lesson01.teach.koffie_thee_water:
    title: Caffè, tè, acqua
    gloss: caffè, tè, acqua
    note: '*De koffie*, *de thee*, *het water*: nota gli articoli diversi.'
    example_gloss:
