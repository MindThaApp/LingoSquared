    - Del succo, per favore.
  nl.a1.unit06.lesson02.teach.brood_broodje_kaas_appel:
    title: Pane, panino al formaggio, mela
    gloss: pane, panino al formaggio, mela
    note: '*Het brood*, *de appel*. *Broodje* indica un panino o un rosetta piccola; *broodje kaas* è un''ordinazione molto comune di ogni giorno.'
    example_gloss:
    - Vorrei del pane.
    - Vorrei un panino al formaggio.
    - Vorrei una mela.
  nl.a1.unit06.lesson02.teach.ik_wil_graag:
    title: Vorrei ...
    gloss: Vorrei ...
    note: '*Ik wil graag ...* è un modo educato e comune per ordinare qualcosa nel parlare quotidiano.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie:
    title: Vorrei un caffè
    gloss: Vorrei un caffè.
    note: '*Een* significa ''un'', ''uno'' o ''una'' ed è invariabile: resta uguale con qualsiasi sostantivo olandese, senza distinzione di genere.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje:
    title: Vorrei un panino al formaggio
    gloss: Vorrei un panino al formaggio.
    note: 'Si dice *een broodje kaas*: *kaas* segue direttamente *broodje*, senza preposizione.'
  nl.a1.unit06.lesson03.teach.alstublieft_alsjeblieft:
    title: Per favore (formale e informale)
    gloss: per favore (formale), per favore (informale)
    note: Usa *alstublieft* quando ti rivolgi a qualcuno in modo formale con *u*, e *alsjeblieft* quando ti rivolgi a qualcuno in modo informale con *jij* o *je*.
    example_gloss:
    - Un caffè, per favore. (formale)
    - Un caffè, per favore. (informale)
  nl.a1.unit06.lesson03.teach.please_note:
    title: Alstublieft o alsjeblieft
    gloss: alstublieft = per favore formale, alsjeblieft = per favore informale
    note: Scegli *alstublieft* con *u* e *alsjeblieft* con *jij* o *je*.
    target_text: alstublieft = «per favore» formale (con u); alsjeblieft = «per favore» informale (con jij/je)
  nl.a1.unit06.lesson03.teach.twee_thee:
    title: Vorrei due tè, per favore
    gloss: Vorrei due tè, per favore.
    note: Nell'ordinazione al bar, *twee thee* significa naturalmente due tazze di tè; qui *thee* resta al singolare.
  nl.a1.unit06.lesson04.teach.wat_wilt_u:
    title: Che cosa desidera da bere? (formale)
    gloss: Che cosa desidera da bere?
    note: '*Wilt u* è la forma formale abituale nei Paesi Bassi.'
  nl.a1.unit06.lesson04.teach.wat_wil_je:
    title: Che cosa vuoi mangiare? (informale)
    gloss: Che cosa desidera mangiare?
    note: Prima di *je* o *jij* si usa *wil*, non *wilt*, come in questa domanda.
  nl.a1.unit06.lesson04.teach.wilt_wil_note:
    title: Wilt o wil
    gloss: wilt u ... ma wil je/jij ...
    note: Quando il verbo precede il soggetto, si dice *wilt u* ma *wil je* o *wil jij*. Non dire *wilt je* né *wilt jij*.
    target_text: 'wilt u (formale) ma wil je (informale): quando wil precede je o jij, non ha la t'
  nl.a1.unit06.lesson04.teach.appelsap:
    title: Succo di mela
    gloss: succo di mela
    note: Scrivi *appelsap* come una sola parola, non come *appel sap*.
    example_gloss: Posso avere un succo di mela, per favore?
  nl.a1.unit06.lesson04.teach.mag_ik:
    title: Posso avere un succo di mela, per favore?
    gloss: Posso avere un succo di mela, per favore?
    note: '*Mag ik ...?* è un altro modo comune, un po'' più informale, per ordinare, oltre a *ik wil graag ...*'
  nl.a1.unit06.lesson05.teach.euro_vijftig:
    title: Due euro e cinquanta
    gloss: €2,50 — due euro e cinquanta
    note: €2,50 si dice di solito *twee euro vijftig*, senza *en* e senza *cent*.
  nl.a1.unit06.lesson05.teach.menu:
    title: Menù
    gloss: 'Menù — Caffè: €2,50. Tè: €2,00. Panino al formaggio: €3,50. Succo di mela: €2,50.'
    note: 'Come in italiano, i menù olandesi scrivono i prezzi con la virgola decimale: €2,50, €2,00 e €3,50.'
    glosses:
      Menukaart: menu
      Koffie: caffè
      Thee: tè
      Broodje: panino
      kaas: formaggio
      Appelsap: succo di mela
  nl.a1.unit06.lesson06.teach.goedemiddag:
    title: Buon pomeriggio
    gloss: buon pomeriggio
    note: Un saluto naturale al bancone di un bar nel pomeriggio.
    example_gloss: Buon pomeriggio, che cosa desidera da bere?
  nl.a1.unit06.lesson06.teach.komt_eraan:
    title: Arriva subito!
    gloss: Arriva subito!
    note: Una frase naturale e comune che il personale dice dopo aver preso l'ordinazione.
    example_gloss: Il suo caffè arriva subito!
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: Buon pomeriggio, che cosa desidera da bere?
    gloss: 'Addetto: Buon pomeriggio, che cosa desidera da bere? Lotte: Vorrei un caffè, per favore.'
    note: 'Una situazione di servizio formale: nota che Lotte usa *alstublieft* con l''addetto, a differenza di come parla in modo informale con Omar.'
  nl.a1.unit06.lesson06.teach.lines04_06:
    title: Desidera anche qualcosa da mangiare?
    gloss: 'Addetto: E desidera anche qualcosa da mangiare? Lotte: Sì, un panino al formaggio, per favore. Addetto: Arriva subito!'
    note: '*En wilt u ook iets eten?* è un modo naturale con cui il personale chiede se vuoi anche qualcosa da mangiare.'
