teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: Da zero a quattro
    gloss: 0 — zero, 1 — uno, 2 — due, 3 — tre, 4 — quattro
    note: In olandese nul è zero, anche come prima cifra di un numero di telefono. Gli accenti di één distinguono nello scritto il numero dall'articolo een; nei testi comuni a volte si omettono quando il senso è chiaro.
    example_gloss:
    - Ho zero euro.
    - Ho un libro.
    - Ho due sedie.
    - Ho tre libri.
    - Ci sono quattro persone.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: Da cinque a otto
    gloss: 5 — cinque, 6 — sei, 7 — sette, 8 — otto
    note: Vijf, zes, zeven e acht seguono lo stesso schema semplice dei numeri da zero a quattro.
    example_gloss:
    - Ho cinque euro.
    - Ho sei libri.
    - Ho sette sedie.
    - Ci sono otto persone.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: Da nove a dodici
    gloss: 9 — nove, 10 — dieci, 11 — undici, 12 — dodici
    note: Negen, tien, elf e twaalf completano i numeri fino a dodici.
    example_gloss:
    - Ho nove euro.
    - Ho dieci sedie.
    - Ho undici libri.
    - Ci sono dodici persone.
  nl.a1.unit02.lesson01.teach.how_many:
    title: Chiedere «quanti»
    gloss: Quanti?
    note: Hoeveel serve a chiedere un numero o una quantità.
  nl.a1.unit02.lesson02.teach.teens:
    title: Da tredici a diciannove
    gloss: '13–19: tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove'
    note: In olandese le forme da tredici a diciannove terminano in -tien.
    example_gloss:
    - Ho tredici anni.
    - Ho quattordici euro.
    - Ho quindici anni.
    - Ho sedici libri.
    - Ci sono diciassette persone.
    - Ho diciotto anni.
    - Ho diciannove sedie.
  nl.a1.unit02.lesson02.teach.tens:
    title: Le decine
    gloss: '20–90: venti, trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta'
    note: Impara queste decine come base per i numeri più grandi a due cifre.
    example_gloss:
    - Ho vent'anni.
    - Costa trenta euro.
    - Ho quaranta euro.
    - Ci sono cinquanta persone.
    - Ho sessant'anni.
    - Costa settanta euro.
    - Ci sono ottanta persone.
    - Ho novanta euro.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: Prima le unità, poi le decine
    gloss: '21–99, tranne 30, 40 e le altre decine tonde: unità + en + decina'
    note: 'A differenza dell''italiano, l''olandese di norma dice prima l''unità: 42 è letteralmente «due-e-quaranta». Le decine tonde usano solo la parola della decina.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: Ventuno
    gloss: 21 — ventuno
    note: Eenentwintig unisce een + en + twintig in un'unica parola scritta.
    example_gloss: Il caffè linguistico è nell'aula ventuno.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: Ventidue
    gloss: 22 — ventidue
    note: I due puntini sulla ë di tweeëntwintig indicano che le vocali vicine appartengono a sillabe diverse.
    example_gloss: Ho ventidue anni.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: Trentadue
    gloss: 32 — trentadue
    note: Tweeëndertig si scrive in una sola parola, con i due puntini sulla ë di giunzione.
    example_gloss: Omar ha trentadue anni.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: Quarantadue
    gloss: 42 è quarantadue.
    note: 'In olandese si dice prima l''unità e poi la decina: twee-en-veertig, che si scrive tutto attaccato: tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: Quarantotto
    gloss: 48 — quarantotto
    note: Achtenveertig è acht + en + veertig, e si scrive in una sola parola.
    example_gloss: Abito al numero quarantotto.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: Settantacinque
    gloss: 75 — settantacinque
    note: In vijfenzeventig vijf viene prima di zeventig.
    example_gloss: Costa settantacinque centesimi.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: Novantanove
    gloss: 99 — novantanove
    note: Negenennegentig è una parola composta unica.
    example_gloss: Ho novantanove anni.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: Chiedere il numero di telefono
    gloss: Qual è il tuo numero di telefono?
    note: Con je la domanda resta informale, come si addice al caffè linguistico di Lotte e Omar.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: Dire un numero di cellulare olandese
    gloss: Il mio numero di telefono è 06 21 43 65 87.
    note: I cellulari olandesi iniziano con 06 e di solito si scrivono come 06 seguito da otto cifre.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: Dire il numero di telefono a gruppi
    gloss: zero sei, ventuno, quarantatré, sessantacinque, ottantasette
    note: Ognuno raggruppa le cifre a modo suo. In questo corso si usa 06 seguito da gruppi di due cifre; dire le cifre una per una è altrettanto normale quando serve chiarezza.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: Chiedere il numero civico
    gloss: Qual è il tuo numero civico?
    note: Huisnummer è il numero che fa parte di un indirizzo.
  nl.a1.unit02.lesson03.teach.house_number:
    title: Dire il numero civico
    gloss: Il mio numero civico è 48.
    note: In un indirizzo scritto o in un modulo è naturale usare le cifre.
  nl.a1.unit02.lesson03.teach.live_number:
    title: Dire dove abiti con il numero
    gloss: Abito al numero quarantotto.
    note: Op nummer ... è un modo naturale di indicare il numero civico quando la via è già nota.
  nl.a1.unit02.lesson03.teach.repeat:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: Utile quando un numero di telefono detto a voce è troppo veloce per essere capito.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: Chiedere l'età a qualcuno in modo informale
    gloss: Quanti anni hai?
    note: Qui si usa je informale; chiedere l'età è appropriato solo quando il contesto lo rende rilevante.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: Dire la propria età
    gloss: Ho ventotto anni.
    note: 'In olandese si dice Ik ben ... jaar, alla lettera «sono ... anno»: a differenza dell''italiano, che usa «ho ... anni», si usa il verbo «essere» e jaar resta al singolare.'
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Dire l'età di Omar
    gloss: Omar ha trentadue anni.
    note: Quando si dice l'età, jaar non prende la desinenza del plurale dopo il numero.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: Chiedere quante persone ci sono
    gloss: Quante persone ci sono?
    note: Hoeveel sta subito davanti al sostantivo mensen.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: Dire quante persone ci sono
    gloss: Ci sono dodici persone.
    note: Er zijn è la costruzione normale al plurale per «ci sono».
  nl.a1.unit02.lesson04.teach.three_books:
    title: Contare i libri
    gloss: Ho tre libri.
    note: Dopo i numeri maggiori di uno, boek prende il plurale boeken.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: Contare le sedie
    gloss: sette sedie
    note: Stoelen è il plurale di stoel.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: l'euro
    note: 'Dopo una quantità, euro di norma resta al singolare: twee euro, non twee euro''s.'
    example_gloss: Costa due euro.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: il centesimo
    note: Anche cent di solito resta al singolare dopo un numero in un prezzo.
    example_gloss: Fa cinquanta centesimi.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: Chiedere il prezzo
    gloss: Quanto costa questo?
    note: Hoeveel chiede la quantità e kost significa «costa».
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: Due euro e cinquanta
    gloss: €2,50 — due euro e cinquanta
    note: Come in italiano, l'olandese scrive la virgola decimale. Nel parlato quotidiano €2,50 si dice di solito twee euro vijftig, senza en, mentre in italiano si dice «due euro e cinquanta».
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: Settantacinque centesimi
    gloss: €0,75 — settantacinque centesimi
    note: Quando l'importo è inferiore a un euro, è naturale dire solo i centesimi.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: Dodici euro
    gloss: €12 — dodici euro
    note: Un prezzo in euro interi non richiede l'indicazione dei centesimi.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: Quattro euro e cinquanta
    gloss: €4,50 — quattro euro e cinquanta
    note: Lo stesso schema parlato vale per altri prezzi in euro e centesimi.
  nl.a1.unit02.lesson05.teach.costs:
    title: Dire un prezzo
    gloss: Costa due euro e cinquanta.
    note: Dat kost ... risponde direttamente a Hoeveel kost dit?
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar si iscrive
    gloss: 'Addetto: Buon pomeriggio. Sei qui per il caffè linguistico? Omar: Sì, vorrei iscrivermi.'
    note: La scena prosegue le visite di Omar al caffè linguistico della biblioteca, iniziate nell'Unità 1.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: Dare il numero di telefono
    gloss: 'Addetto: Bene. Qual è il tuo numero di telefono? Omar: 06 21 43 65 87.'
    note: Omar dice il numero a gruppi di due cifre, come esercitato prima.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: Dire il numero civico
    gloss: 'Addetto: E qual è il tuo numero civico? Omar: Quarantotto.'
    note: Una risposta breve, solo con il numero, è naturale quando la domanda dà già il contesto.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: Capire la quota
    gloss: 'Addetto: La quota è di due euro e cinquanta. Omar: Va bene.'
    note: Il prezzo detto a voce segue lo schema quotidiano euro + centesimi.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: Chiedere quante persone ci sono nel gruppo
    gloss: 'Omar: Quante persone ci sono nel gruppo? Addetto: Dodici.'
    note: Questa scena riprende lo schema della domanda Hoeveel mensen ... già visto nell'unità.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: Trovare il numero della sala
    gloss: 'Addetto: Il caffè linguistico è nella sala ventuno.'
    note: Zaal è una sala o un locale usato per un'attività.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Trovare il tavolo di Lotte
    gloss: 'Lotte: Ciao Omar! Siamo seduti al tavolo sette.'
    note: Il dialogo finisce riportando Omar da Lotte, nello stesso contesto informale.
