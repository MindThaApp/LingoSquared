teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: Padre e madre
    gloss: padre / madre
    note: '*Vader* è la parola standard e neutra per «padre». *Moeder* è la parola standard e neutra per «madre».'
    example_gloss:
    - Questo è mio padre.
    - Quella è mia madre.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: Genitori, fratello e sorella
    gloss: genitori / fratello / sorella
    note: '*Ouders* in questo senso è sempre plurale; *de broer* e *de zus* hanno entrambi l''articolo *de*.'
    example_gloss:
    - I miei genitori abitano a Utrecht.
    - Ho un fratello.
    - Ho una sorella.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: Figlio e figli
    gloss: il bambino / i bambini
    note: '*Kind* è una parola con het: *het kind*. Il plurale *kinderen* vuole *de*, anche se il singolare *kind* vuole *het*.'
    example_gloss:
    - Mia sorella ha un figlio.
    - I miei zii hanno due figli.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: Ho un fratello e una sorella
    gloss: Ho un fratello e una sorella.
    note: '*Ik heb ...* è il modo standard per dire quali familiari hai.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: Nonno, nonna, zio e zia
    gloss: nonno / nonna / zio / zia
    note: '*Opa* è la parola di uso quotidiano per «nonno»; *grootvader* è più formale o scritto. *Oma* è la parola di uso quotidiano per «nonna»; *grootmoeder* è più formale o scritto. *De oom*. *De tante*.'
    example_gloss:
    - I miei nonni vivono a Rotterdam.
    - Mia nonna ha novantanove anni.
    - Mio zio vive ad Amsterdam.
    - I miei zii hanno due figli.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef e nicht sono ambigui
    gloss: neef = cugino o nipote (maschio); nicht = cugina o nipote (femmina)
    note: 'In olandese «cugino» e «nipote (di zii)» non si distinguono con parole diverse: è il contesto a chiarire il significato, mentre l''italiano usa parole diverse. In questa unità non viene verificato negli esercizi: è qui solo perché tu riconosca queste parole più avanti.'
    target_text: neef = cugino OPPURE nipote (maschio); nicht = cugina OPPURE nipote (femmina)
  nl.a1.unit05.lesson02.teach.gezin:
    title: Famiglia (nucleo familiare)
    gloss: famiglia (nucleo familiare)
    note: '*Gezin* indica il nucleo familiare con cui vivi (di solito genitori e figli); *familie* è la parola più ampia per la famiglia allargata e i parenti in generale.'
    example_gloss: La mia famiglia vive a Utrecht.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: I miei nonni vivono a Rotterdam
    gloss: I miei nonni vivono a Rotterdam.
    note: '*Wonen in* + nome di città indica dove vive qualcuno.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: I miei zii hanno due figli
    gloss: I miei zii hanno due figli.
    note: Si usa *hebben* perché *oom en tante* indica due persone.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: Mio e tuo (non accentuato e accentuato)
    gloss: mio / tuo (non accentuato) / tuo (accentuato)
    note: '*Mijn* mantiene sempre la stessa forma davanti ai nomi con de e con het, al singolare e al plurale. *Je* è la forma informale più usata quando non si sottolinea di chi è; anch''essa resta invariata davanti a ogni nome. *Jouw* è più forte di *je* e serve quando si contrappone il familiare di una persona a quello di un''altra; anch''esso resta invariato davanti a ogni nome.'
    example_gloss:
    - Questo è mio fratello.
    - Questa è tua sorella?
    - Quella è tua sorella?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je o jouw
    gloss: je e jouw significano entrambi «tuo» (informale)
    note: Usa *je* quando non c'è un'enfasi particolare. Usa *jouw* quando metti in risalto di chi si tratta, soprattutto in un contrasto. La forma piena *jouw* è possibile anche senza contrasto, ma lì *je* è più usuale.
    target_text: je e jouw significano entrambi «tuo/tua» (informale). Je è la forma usuale, senza enfasi; jouw è più forte e serve per il contrasto. Entrambi restano invariati davanti a qualsiasi nome.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: Questo è mio fratello
    gloss: Questo è mio fratello.
    note: '*Dit is ...* serve a presentare qualcuno che è vicino.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: Quella è tua sorella?
    gloss: Quella è tua sorella?
    note: '*Dat is ...* si riferisce a qualcuno più lontano o già nominato.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: Suo (di lui) e suo (di lei)
    gloss: suo (di lui) / suo (di lei)
    note: '*Zijn* resta sempre invariato, come *mijn*, *je* e *jouw*. Anche *haar* resta sempre invariato.'
    example_gloss:
    - Questo è suo padre.
    - Quella è sua madre.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn o haar
    gloss: zijn = suo (di lui), haar = suo (di lei)
    note: 'Per le persone di questi esempi, scegli *zijn* se il possessore è un uomo e *haar* se è una donna. Il nome di famiglia che segue non influisce sulla scelta: *zijn vader* e *zijn moeder*; *haar vader* e *haar moeder*.'
    target_text: zijn = suo (di lui), haar = suo (di lei); restano invariati qualunque sia il nome che segue.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: Questo è suo padre
    gloss: Questo è suo padre.
    note: '*Zijn vader* — suo padre (di lui).'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: Quella è sua madre
    gloss: Quella è sua madre.
    note: '*Haar moeder* — sua madre (di lei).'
  nl.a1.unit05.lesson05.teach.heet:
    title: Si chiama
    gloss: si chiama
    note: '*Ik heet...* / *Hij heet...* — il modo standard per dire il nome di qualcuno, già visto nell''Unità 1.'
    example_gloss: Mi chiamo Lotte.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'Nomi dei familiari: Sander, Fenna, Jan e Marieke'
    gloss: Sander (nome maschile olandese) / Fenna (nome femminile olandese) / Jan (nome maschile olandese) / Marieke (nome femminile olandese)
    note: 'Sono tutti e quattro nomi olandesi comuni: Sander e Jan sono nomi maschili, Fenna e Marieke sono nomi femminili.'
    example_gloss:
    - Mio fratello si chiama Sander.
    - Mia sorella si chiama Fenna.
    - Mio padre si chiama Jan.
    - Mia madre si chiama Marieke.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Rotterdam
    note: Una delle principali città olandesi.
    example_gloss: I nonni di Lotte vivono a Rotterdam.
  nl.a1.unit05.lesson05.teach.profile:
    title: Il profilo della famiglia di Lotte
    gloss: Mi chiamo Lotte. Ho un fratello e una sorella. Mio fratello si chiama Sander e mia sorella si chiama Fenna. Mio padre si chiama Jan e mia madre si chiama Marieke. I miei nonni vivono a Rotterdam.
    note: Una breve presentazione parlata della famiglia di Lotte, che riprende il lessico delle lezioni precedenti di questa unità.
  nl.a1.unit05.lesson06.teach.egypte:
    title: Egitto
    gloss: Egitto
    note: Il paese d'origine di Omar, coerente con le unità precedenti.
    example_gloss: I miei genitori vivono in Egitto.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: Ogni mese
    gloss: ogni mese
    note: '*Elke* + nome singolare esprime «ogni ...».'
    example_gloss: Sì, ogni mese.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: Hai fratelli o sorelle?
    gloss: 'Lotte: Hai fratelli o sorelle, Omar? Omar: Sì, ho due sorelle. Nessun fratello. E tu? Lotte: Ho un fratello e una sorella.'
    note: '*Broers of zussen* — fratelli o sorelle, con le forme del plurale.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: Anche i tuoi genitori vivono nei Paesi Bassi?
    gloss: 'Omar: Anche i tuoi genitori vivono nei Paesi Bassi? Lotte: Sì, i miei genitori vivono a Utrecht. E la tua famiglia? Omar: I miei genitori vivono in Egitto, ma mio zio vive qui ad Amsterdam.'
    note: '*Wonen ook in* — vivono anche in, per chiedere se lo stesso vale per un''altra persona.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: Lo vedi spesso?
    gloss: 'Lotte: Che bello! Lo vedi spesso? Omar: Sì, ogni mese.'
    note: '*Zie je hem vaak?* — un modo naturale e comune per chiedere con che frequenza ci si vede.'
