course:
  title: Olandese A1
  description: 'Olandese per principianti per parlare di animali domestici e animali comuni: come si chiamano, le cure di base (portare fuori, dare da mangiare, giocare), come dire quali animali ami anche senza averne uno, e il plurale regolare olandese.'
units:
  nl.a1.unit31.animals:
    title: Animali e animali domestici
lessons:
  nl.a1.unit31.lesson01.huisdieren_woorden:
    title: Cane, gatto, pesce e uccello
  nl.a1.unit31.lesson02.zorg_voor_huisdieren:
    title: Prendersi cura di un animale
  nl.a1.unit31.lesson03.van_dieren_houden:
    title: Amare gli animali
  nl.a1.unit31.lesson04.taalcafe_lottes_hond:
    title: Omar chiede del cane di Lotte
  nl.a1.unit31.lesson05.omar_fenna_sander_dieren:
    title: Omar, Fenna e Sander parlano di animali
  nl.a1.unit31.lesson06.taalcafe_ninas_vogel:
    title: L'uccellino di Nina
teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Dier* è la parola generica per «animale»; *huisdier* (letteralmente «animale di casa») indica in particolare un animale domestico.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  nl.a1.unit31.lesson01.teach.hond_kat:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Lotte ha un cane.
    - Sander ha un gatto.
  nl.a1.unit31.lesson01.teach.vis_vogel:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: È lo stesso schema di domanda *Heb je ...?* che conosci già dalle unità precedenti.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*Geen* nega il nome indeterminato *een huisdier*: vedi la nota di grammatica.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen: negare un nome indeterminato'
    gloss: Geen nega un nome indeterminato, come in Ik heb geen tijd (che già conosci) e qui in Ik heb geen huisdier.
    note: 'È lo stesso schema con *geen* già visto in *Ik heb geen tijd*: non è una regola nuova, solo un nuovo nome a cui applicarla.'
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: 'Un verbo separabile: vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten è un verbo separabile
    gloss: 'Uitlaten è separabile, proprio come opstaan e aankleden di una lezione precedente: ik laat de hond uit.'
    note: È lo stesso schema dei verbi separabili (radice + ... + prefisso alla fine) già visto con i verbi della routine quotidiana.
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  nl.a1.unit31.lesson02.teach.spelen_met:
    title: Giocare con
    gloss: giocare con
    example_gloss: Sander gioca con il suo gatto.
  nl.a1.unit31.lesson02.teach.uitlaten_phrase:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: Unisce *uitlaten* a *elke dag* (ogni giorno), già visto in un'unità precedente.
  nl.a1.unit31.lesson02.teach.eten_phrase:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: Unisce *eten geven* a *elke dag*.
  nl.a1.unit31.lesson03.teach.meervoud_note:
    title: 'Plurale: hond -> honden'
    gloss: 'Plurale in -en: hond -> honden, dier -> dieren. Dopo una vocale breve la consonante si raddoppia: kat -> katten.'
    note: Il plurale regolare olandese, presentato qui per la prima volta con i nomi di animali come esempi.
  nl.a1.unit31.lesson03.teach.honden_katten:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Omar ama i cani.
    - Fenna ama i gatti.
  nl.a1.unit31.lesson03.teach.vissen_vogels:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  nl.a1.unit31.lesson03.teach.ik_houd_van_dieren:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: Riprende *houden van* della lezione sulle preferenze di un'unità precedente, ora applicato agli animali.
  nl.a1.unit31.lesson03.teach.fenna_katten_geen:
    title: Fenna ama i gatti, ma non ha un animale domestico
    gloss: Fenna ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  nl.a1.unit31.lesson04.teach.omar_vraagt_huisdier:
    title: Omar chiede di un animale domestico
    gloss: 'Omar: Hai un animale domestico, Lotte?'
  nl.a1.unit31.lesson04.teach.lotte_ja_hond:
    title: Lotte ha un cane
    gloss: 'Lotte: Sì, ho un cane.'
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit:
    title: Omar chiede com'è
    gloss: 'Omar: Com''è?'
    note: Riprende la domanda *Hoe ziet ... eruit?* di un'unità precedente sull'aspetto fisico, ora riferita a un animale.
  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: Lotte descrive il suo cane
    gloss: 'Lotte: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: Hij/hem per gli animali
    gloss: Hij («lui») e hem («lo/gli») si possono usare anche per un animale, non solo per una persona.
    note: 'In tutte le unità precedenti hij/hem si riferivano a una persona: qui si indica espressamente che si usano anche per gli animali.'
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit:
    title: Omar chiede delle passeggiate
    gloss: 'Omar: Lo porti fuori ogni giorno?'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
    title: Lotte descrive la sua routine
    gloss: 'Lotte: Sì, lo porto fuori ogni giorno e gli do da mangiare.'
  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar, Fenna e Sander parlano di animali
    gloss: 'Omar e Fenna amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Omar ama i cani e Fenna ama i gatti. Sander, invece, ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. Tu hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      houden: adorare / piacere molto
      allebei: entrambi
      dieren: animali
      beiden: entrambi
      huisdier: animale domestico
      honden: cani
      katten: gatti
      kat: gatto
      speelt: gioca
      geeft: dà
      elke: ogni / tutti
      eten: cibo
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander gioca spesso con il suo gatto
    gloss: Sander gioca spesso con il suo gatto.
    note: Riprende *vaak* (spesso), già visto per le abitudini di Omar in un'unità precedente.
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: Lotte chiede a Nina
    gloss: 'Lotte: Nina, hai anche tu un animale domestico?'
  nl.a1.unit31.lesson06.teach.nina_ja_vogel:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Heet* («si chiama») riprende il verbo delle presentazioni della primissima unità.'
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: Omar reagisce
    gloss: 'Omar: Che bello! Che cosa fai ogni giorno con lui?'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
    title: Anche Omar ama gli uccelli
    gloss: 'Omar: Anch''io amo gli uccelli.'
  nl.a1.unit31.lesson06.teach.lotte_afsluiting:
    title: Lotte chiude la conversazione
    gloss: 'Lotte: Che bello che tutti e tre amiamo gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
