teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: Cappotto, maglione
    gloss: il cappotto, il maglione
    note: '*De jas* e *de trui* sono entrambi sostantivi di genere comune: in olandese hanno l''articolo «de».'
    example_gloss:
    - Cerco un cappotto.
    - Ho un maglione.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: Pantaloni, scarpe
    gloss: i pantaloni, le scarpe
    note: '*Broek* in olandese è singolare, anche se in italiano «pantaloni» si usa spesso al plurale: *een broek*, non *broeken*, per un paio. *Schoenen* è il plurale di *schoen*; come in italiano, le scarpe si indicano quasi sempre al plurale.'
    example_gloss:
    - Cerco dei pantaloni.
    - Cerco delle scarpe.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: Dire che cosa cerchi
    gloss: Cerco un cappotto.
    note: '*Zoeken* (cercare) qui vuole il complemento oggetto diretto, senza preposizione, come l''italiano «cercare qualcosa». (Esiste anche *zoeken naar*, ma l''oggetto semplice è lo schema più facile.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: Taglia
    gloss: la taglia
    note: 'Un sostantivo di genere comune: *de maat*.'
    example_gloss: Che taglia porti?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: Chiedere la taglia
    gloss: Che taglia porti?
    note: '*Welke* (quale) si usa perché per *maat* c''è un insieme ristretto di risposte possibili (S, M, L o un numero).'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: Dire la propria taglia
    gloss: Porto la taglia M.
    note: 'Qui si usa *hebben* (avere): in olandese la taglia si «ha», a differenza dell''italiano, che dice «porto la taglia» o «sono una taglia».'
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: Nero, blu
    gloss: nero, blu
    note: I due aggettivi di colore di base di questa lezione.
    example_gloss:
    - Voglio il cappotto nero.
    - Ha anche questo in blu?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: Chiedere un colore
    gloss: Voglio il cappotto nero.
    note: '*In het* + colore è il modo standard per specificare il colore di un capo quando lo si ordina o lo si chiede.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: Chiedere un altro colore
    gloss: Ha anche questo in blu?
    note: '*Ook* (anche) serve a chiedere se è disponibile un altro colore, con il registro formale *u*.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: Chiedere se calza bene
    gloss: Questo cappotto ti sta bene?
    note: '*Passen* (stare, calzare) è il verbo naturale per la vestibilità di un capo; non confonderlo con *passen* nel senso di «provare».'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: Confermare che calza bene
    gloss: Mi sta bene.
    note: '*Goed* (bene) descrive come veste il capo.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: Troppo piccolo
    gloss: È troppo piccolo.
    note: '*Te* (troppo) precede l''aggettivo per esprimere eccesso.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: Troppo grande
    gloss: È troppo grande.
    note: Stesso schema *te* + aggettivo di *te klein* nella carta precedente.
  nl.a1.unit20.lesson05.teach.negentig:
    title: Novanta
    gloss: novanta
    note: '*Negentig* è il numero 90, qui usato per il prezzo del cappotto.'
    example_gloss: Il cappotto costa novanta euro.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: Dire un prezzo
    gloss: Il cappotto costa novanta euro.
    note: '*Kost* è la terza persona singolare di *kosten* (costare).'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: Leggere uno scontrino del negozio
    gloss: 'Giaccone invernale: taglia M, colore nero. Prezzo: novanta euro. Questo cappotto mi sta bene ed è caldo.'
    note: Individua la taglia, il colore, il prezzo e le due qualità citate per il cappotto.
    glosses:
      Winterjas: giaccone invernale
      maat: taglia
      kleur: colore
      zwart: nero
      Prijs: prezzo
      negentig: novanta
      euro: euro
      jas: cappotto
      past: sta bene
      warm: caldo
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte nota il cappotto
    gloss: 'Lotte: Che bel cappotto! Che taglia porti?'
    note: '*Mooi* (bello) è una reazione positiva generica, già vista nelle unità precedenti.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar chiede di provarlo
    gloss: 'Omar: Porto la taglia M. Posso provarlo?'
    note: '*Mag ik ...?* (Posso ...?) è il modo educato standard per chiedere il permesso; qui *passen* significa «provare», non «stare/calzare».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte chiede della vestibilità
    gloss: 'Lotte: Certo. Ti sta bene?'
    note: '*Hij* (lui/esso) si riferisce a *de jas*, un sostantivo di genere comune.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar conferma
    gloss: 'Omar: Sì, mi sta bene ed è caldo.'
    note: 'Corrisponde esattamente allo scontrino letto prima: è lo stesso cappotto.'
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte chiede del colore
    gloss: 'Lotte: Ottimo! Lo vuoi nero o blu?'
    note: '*Wil je... of...?* riprende lo schema per offrire una scelta visto nelle lezioni sulle preferenze dell''Unità 13.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar decide
    gloss: 'Omar: Lo prendo nero.'
    note: '*Nemen* (prendere) è il verbo naturale per concludere la scelta di un acquisto, in linea con il colore indicato sullo scontrino.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem e neemt
    gloss: Neem è la forma per «io» di nemen (prendere); neemt è la forma per «lui/lei».
    note: 'Schema regolare del presente: *ik neem, jij/hij/zij neemt*.'
