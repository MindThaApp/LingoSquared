teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: Formare il comparativo
    gloss: Nei confronti si aggiunge spesso -er all'aggettivo e si usa dan.
    note: '*Dan* corrisponde all''italiano «di» o «che» nei confronti. Segue sempre l''aggettivo al comparativo.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: Grande, piccolo
    gloss: grande, piccolo
    note: '*Groot* e *klein* sono gli aggettivi di base, prima di aggiungere -er.'
    example_gloss:
    - Lo zaino è grande.
    - La borsa è piccola.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: Lo zaino è più grande
    gloss: Lo zaino è più grande della borsa.
    note: '*Groter* è *groot* + *er*; *dan* introduce il secondo termine del confronto.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: La borsa è più piccola
    gloss: La borsa è più piccola dello zaino.
    note: '*Kleiner* è *klein* + *er*, secondo lo stesso schema.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: Il prezzo dello zaino
    gloss: Lo zaino costa quarantacinque euro.
    note: '*Kost* è la terza persona singolare di *kosten*, «costare».'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: Il prezzo della borsa
    gloss: La borsa costa venti euro.
    note: Un prezzo più basso di quello dello zaino, per preparare il confronto che segue.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: Caro, economico
    gloss: caro, economico
    note: '*Duur* e *goedkoop* sono gli aggettivi di base, prima di aggiungere *-der*/*-er*.'
    example_gloss:
    - Lo zaino è caro.
    - La borsa è economica.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: Lo zaino è più caro
    gloss: Lo zaino è più caro della borsa.
    note: '*Duurder* è *duur* + *der*. Dopo una parola che termina già in r, l''olandese aggiunge *-der* invece di *-er*.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: La borsa è più economica
    gloss: La borsa è più economica dello zaino.
    note: '*Goedkoper* è *goedkoop* + *er*, l''opposto della frase precedente.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: Confronto di uguaglianza
    gloss: Usa net zo + aggettivo + als per dire che due cose sono uguali.
    note: Questa struttura serve a dire che due cose sono uguali, come «tanto ... quanto» o «così ... come» in italiano.
  nl.a1.unit14.lesson03.teach.mooi:
    title: Ugualmente bello
    gloss: Questo zaino è bello come quella borsa.
    note: '*Mooi* («bello») sta tra *net zo* e *als* senza cambiare: in questa struttura non c''è la desinenza -er.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: Ugualmente pratico
    gloss: Lo zaino è pratico quanto la borsa.
    note: Qualsiasi aggettivo semplice può occupare lo stesso spazio in *net zo ... als*.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: Formare il superlativo
    gloss: Per il superlativo si usa spesso het + aggettivo + st.
    note: Questa forma predicativa (dopo *is*) richiede *het*, qualunque sia il genere del nome.
  nl.a1.unit14.lesson04.teach.duurst:
    title: Il più caro dei due
    gloss: Tra questi due, lo zaino è il più caro.
    note: '*Duurst* è *duur* + *st*. L''olandese può usare il superlativo anche confrontando solo due opzioni, come in italiano si dice talvolta «il migliore dei due».'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'Irregolari: goed, beter, best'
    gloss: 'Goed, beter, best sono irregolari: questa è la scelta migliore. Veel, meer, meest funziona allo stesso modo.'
    note: Come in italiano buono/migliore/ottimo e molto/più, nessuna delle due serie (*goed/beter/best*, *veel/meer/meest*) segue lo schema regolare -er/-st.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: La scelta migliore per il viaggio
    gloss: Questo zaino è la scelta migliore per un lungo viaggio in treno.
    note: '*Beste* è la forma attributiva (davanti a un nome), con la -e che gli aggettivi olandesi di solito prendono davanti a un nome.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: Più spazio
    gloss: Lo zaino ha più spazio della borsa.
    note: '*Meer* è il comparativo irregolare di *veel* («molto/molti»), proprio come in italiano «più» non deriva regolarmente da «molto».'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: Leggi un annuncio di un negozio
    gloss: 'Zaino Bergsport: quarantacinque euro. Questo zaino è grande e resistente. Borsa a tracolla Stad: venti euro. Questa borsa è più piccola e più leggera dello zaino, ma meno resistente. Per un lungo viaggio lo zaino è la scelta migliore, perché è più resistente e ha più spazio.'
    note: Individua prezzi e dimensioni dei due prodotti e quale consiglia l'annuncio, e perché.
    glosses:
      Rugzak: zaino
      vijfenveertig: quarantacinque
      euro: euro
      groot: grande
      sterk: forte, resistente
      Schoudertas: borsa a tracolla
      twintig: venti
      tas: borsa
      kleiner: più piccolo
      lichter: più leggero
      minder: meno
      lange: lungo
      reis: viaggio
      beste: migliore
      keuze: scelta
      sterker: più resistente
      ruimte: spazio
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte fa notare la dimensione
    gloss: 'Lotte: Guarda, questo zaino è più grande di quella borsa.'
    note: '*Kijk* («guarda») è un modo comune per attirare l''attenzione di qualcuno su qualcosa.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar spiega perché gli serve
    gloss: 'Omar: Sì, e ha più spazio. Mi serve una borsa grande per il viaggio in treno.'
    note: '*Nodig hebben* («aver bisogno di») è un''espressione fissa; ciò di cui hai bisogno va tra *hebben* e *nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte conferma la scelta
    gloss: 'Lotte: Allora lo zaino è la scelta migliore per te.'
    note: 'Qui *dan* significa «allora», «in quel caso», e non è il *dan* del comparativo visto nella lezione 1: la grafia è la stessa per entrambi gli usi.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar chiede l'opinione di Lotte
    gloss: 'Omar: Esatto. Quale borsa trovi più bella?'
    note: '*Vind jij het mooist* riprende lo schema per esprimere un''opinione visto nelle lezioni su *vinden* dell''unità 13.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte sceglie la borsa a tracolla
    gloss: 'Lotte: Trovo questa borsa a tracolla la più bella. Ed è leggera.'
    note: '*Licht* («leggero», di peso) è un aggettivo nuovo e utile per descrivere borse e bagagli.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: Decidono
    gloss: 'Omar: Bene, allora io compro lo zaino e tu la borsa a tracolla.'
    note: 'Nella seconda frase manca il verbo *koop*, già detto: come in italiano, nel parlato è naturale quando è chiaro dal contesto.'
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop e koopt
    gloss: Koop è la forma di «io» di kopen («comprare»); koopt è la forma di «lui/lei».
    note: 'Schema regolare del presente: *ik koop*, *jij/hij/zij koopt*.'
