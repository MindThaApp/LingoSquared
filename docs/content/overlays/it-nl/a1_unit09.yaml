teaching:
  nl.a1.unit09.lesson01.teach.links_rechts:
    title: Sinistra e destra
    gloss: sinistra, destra
    note: '*Links* significa sinistra e *rechts* significa destra.'
    example_gloss:
    - La banca è a sinistra.
    - La stazione è a destra.
  nl.a1.unit09.lesson01.teach.linksaf_rechtsaf_rechtdoor:
    title: Gira a sinistra, gira a destra, dritto
    gloss: a sinistra / gira a sinistra, a destra / gira a destra, dritto
    note: '*Linksaf*, *rechtsaf* e *rechtdoor* si scrivono ciascuno in una sola parola; nelle indicazioni di solito seguono *sla*: *sla linksaf*, *sla rechtsaf*.'
    example_gloss:
    - Gira a sinistra.
    - Gira a destra.
    - Vai dritto.
  nl.a1.unit09.lesson02.teach.ga_sla_loop_tot:
    title: Vai, gira, cammina, fino a
    gloss: vai, gira, cammina, fino a
    note: '*Ga* dice a una persona di andare, *sla* di girare e *loop* di camminare; *tot* indica il punto in cui finisce un passaggio dell''indicazione.'
    example_gloss:
    - Vai dritto.
    - Gira a sinistra.
    - Cammina fino alla banca.
    - Vai dritto fino alla stazione.
  nl.a1.unit09.lesson02.teach.ga_rechtdoor:
    title: Vai dritto
    gloss: Vai dritto.
    note: '*Ga* è seguito direttamente da *rechtdoor*.'
  nl.a1.unit09.lesson02.teach.sla_linksaf:
    title: Girare a sinistra
    gloss: Gira a sinistra.
    note: '*Sla linksaf* è la tipica indicazione breve del parlato.'
  nl.a1.unit09.lesson02.teach.sla_rechtsaf:
    title: Girare a destra
    gloss: Gira a destra.
    note: '*Sla rechtsaf* è la tipica indicazione breve del parlato.'
  nl.a1.unit09.lesson02.teach.loop_tot:
    title: Cammina fino a
    gloss: Cammina fino a ...
    note: 'Dopo *tot* aggiungi un luogo: *Loop tot de bank*.'
  nl.a1.unit09.lesson02.teach.imperative_note:
    title: Forme brevi dell'imperativo
    gloss: 'Nell''imperativo informale l''olandese di norma omette jij o je, proprio come l''italiano omette tu: ga, sla, loop.'
    note: Questi imperativi vanno bene per il modo in cui Lotte e Omar si parlano. Non aggiungere *jij* o *je*.
  nl.a1.unit09.lesson03.teach.supermarkt_station_review:
    title: Supermercato e stazione
    gloss: il supermercato, la stazione
    note: Ricorda *de supermarkt* e *het station* dall'Unità 8. *Supermarkt* si scrive in una sola parola.
    example_gloss:
    - Come arrivo al supermercato?
    - Come arrivo alla stazione da qui?
  nl.a1.unit09.lesson03.teach.hoe_kom_ik_bij:
