    title: La biblioteca è di fronte alla banca
    gloss: La biblioteca è di fronte alla banca.
    note: Qui si riutilizza *tegenover* per confermare la destinazione dopo un passaggio del percorso.
  nl.a1.unit09.lesson05.teach.buurtkaart_route:
    title: Mappa del quartiere e percorso
    gloss: la mappa del quartiere, il percorso
    note: Ricorda *buurtkaart* dall'Unità 8 (si scrive in una sola parola); *de route* è il tragitto dalla partenza alla destinazione.
    example_gloss:
    - Ecco la mappa del quartiere.
    - Questo è il percorso per il supermercato.
  nl.a1.unit09.lesson05.teach.start_doel:
    title: Partenza e destinazione
    gloss: PARTENZA, DESTINAZIONE
    note: '*START* indica dove inizia il percorso e *DOEL* indica dove finisce.'
    example_gloss:
    - 'PARTENZA: biblioteca.'
    - 'DESTINAZIONE: supermercato.'
  nl.a1.unit09.lesson05.teach.marked_route:
    title: Un percorso segnato
    gloss: 'PARTENZA: biblioteca. Vai dritto fino alla stazione, poi gira a destra. DESTINAZIONE: supermercato. Il supermercato è accanto alla stazione; la banca è accanto al supermercato.'
    note: Il percorso segnato contiene solo due passaggi.
    glosses:
      BUURTKAART: MAPPA DEL QUARTIERE
      START: PARTENZA
      bibliotheek: biblioteca
      Route: percorso
      ga: vanno
      rechtdoor: dritto
      station: stazione
      sla: gira (imperativo)
      rechtsaf: a destra
      DOEL: DESTINAZIONE
      supermarkt: supermercato
      naast: accanto a
      bank: banca
  nl.a1.unit09.lesson06.teach.taalcafe_review:
    title: Caffè linguistico
    gloss: il caffè linguistico
    note: Ricorda *taalcafé* dalle unità precedenti. Si scrive in una sola parola, con l'accento.
    example_gloss: Sono qui per il caffè linguistico.
  nl.a1.unit09.lesson06.teach.question:
    title: Omar chiede la strada
    gloss: 'Omar: Lotte, come arrivo al supermercato?'
    note: Omar usa con Lotte la domanda informale per chiedere la strada.
  nl.a1.unit09.lesson06.teach.directions:
    title: Lotte dà due indicazioni
    gloss: 'Lotte: Vai dritto fino alla stazione. Gira a destra.'
    note: La risposta si limita a due brevi passaggi.
  nl.a1.unit09.lesson06.teach.location:
    title: Lotte conferma dov'è
    gloss: 'Lotte: Il supermercato è accanto alla stazione.'
    note: L'espressione di luogo dell'Unità 8 conferma dove finisce il percorso.
  nl.a1.unit09.lesson06.teach.closing:
    title: Ringraziare Lotte
    gloss: 'Omar: Perfetto, grazie! Lotte: Di niente!'
    note: Lo scambio si chiude in modo informale.
