    gloss: Come arrivo a ...?
    note: Usa *Hoe kom ik bij ...?* per chiedere la strada per un luogo.
  nl.a1.unit09.lesson03.teach.ask_supermarket:
    title: Come arrivo al supermercato?
    gloss: Come arrivo al supermercato?
    note: 'Usa *bij* davanti alla destinazione: *bij de supermarkt*.'
