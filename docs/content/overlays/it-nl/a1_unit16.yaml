teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: Non sentirsi bene
    gloss: Non mi sento bene.
    note: Qui *voelen* è riflessivo (*je*/*me voelen*); *niet lekker* è il modo generico e leggero per dire che qualcosa non va.
  nl.a1.unit16.lesson01.teach.ziek:
    title: Malato
    gloss: malato
    note: L'aggettivo di base, usato con *zijn* (essere).
    example_gloss: Sono malato.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: Essere malati
    gloss: Sono malato.
    note: '*Ziek* descrive uno stato più generale e più forte di *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: Mal di testa
    gloss: un mal di testa
    note: 'Si usa senza articolo dopo *hebben*: *Ik heb hoofdpijn*, non *Ik heb een hoofdpijn*.'
    example_gloss: Ho mal di testa.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: Avere mal di testa
    gloss: Ho mal di testa.
    note: In olandese, come in italiano, i sintomi si esprimono di solito con *hebben* (avere).
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: Mal di stomaco
    gloss: un mal di stomaco
    note: Stesso schema senza articolo di *hoofdpijn*.
    example_gloss: Ho mal di stomaco.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: Avere mal di stomaco
    gloss: Ho mal di stomaco.
    note: Segue lo stesso schema con *hebben* di *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: Chiedere in generale
    gloss: Che cos'hai?
    note: Un modo generico, valido in ogni situazione, per chiedere se c'è qualche problema.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: Un'espressione comune
    gloss: Che cos'hai?
    note: '*Scheelt eraan* è un''espressione fissa (letteralmente vicina a «che cosa manca a questo»): non tradurla parola per parola.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: Mal di gola
    gloss: un mal di gola
    note: Stesso schema senza articolo di *hoofdpijn* e *buikpijn*.
    example_gloss: Ho mal di gola.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: Avere mal di gola
    gloss: Ho mal di gola.
    note: Segue lo stesso schema con *hebben* degli altri sintomi.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: Chiedere a qualcuno come sta
    gloss: Stai bene? No, non mi sento bene.
    note: '*Gaat het?* è una domanda molto comune e informale per chiedere a un amico come sta.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: Febbre
    gloss: una febbre
    note: Si usa senza articolo dopo *hebben*, come gli altri sintomi.
    example_gloss: Ho la febbre.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: Avere la febbre
    gloss: Ho la febbre.
    note: Segue lo schema con *hebben*.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: Essere raffreddato
    gloss: raffreddato / avere il raffreddore
    note: 'Un aggettivo usato con *zijn*, non un sostantivo usato con *hebben*: in italiano diciamo «avere la febbre», ma «essere raffreddato» si dice con «essere» come in olandese, quindi attenzione a non confonderli.'
    example_gloss: Ho il raffreddore.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: Dire che hai il raffreddore
    gloss: Ho il raffreddore.
    note: 'In olandese si usa *zijn* + *verkouden*, mentre in italiano si dice «avere» + sostantivo («ho il raffreddore»): non dire *Ik heb een verkouden*.'
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn o hebben dipende dalla categoria grammaticale, non dalla durata
    gloss: 'Ziek e verkouden sono aggettivi e usano zijn: sono malato, sono raffreddato. Koorts e hoofdpijn sono nomi e usano hebben.'
    note: 'La scelta tra *zijn* e *hebben* dipende dalla categoria grammaticale (aggettivo o nome del sintomo), non da quanto sia temporanea la condizione: *koorts* (un nome) è temporanea quanto *verkouden* (un aggettivo), ma vuole comunque *hebben*, non *zijn*.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: La farmacia
    gloss: la farmacia
    note: 'È un nome di genere comune: *de apotheek*.'
    example_gloss: Vado in farmacia.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: Il saluto del farmacista
    gloss: Come posso aiutarla?
    note: '*Waarmee kan ik u helpen?* è una formula di cortesia standard per accogliere i clienti e continua il registro con *u* delle lezioni sul registro dell''Unità 1 e dell''Unità 15.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: Chiedere qualcosa per un sintomo
    gloss: Ha qualcosa per il mal di testa?
    note: '*Iets tegen* + sintomo è il modo naturale di chiedere un rimedio.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: Una pastiglia
    gloss: una pastiglia / compressa
    note: 'È un nome neutro: *het tablet*, anche se qui è usato come indeterminativo: *een tablet*.'
    example_gloss: Prendo una pastiglia.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: Istruzioni per la dose
    gloss: Prendi una pastiglia due volte al giorno.
    note: '*Neem* è l''imperativo di *nemen* (prendere), usato per dare istruzioni.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: Il registro in farmacia
    gloss: In farmacia si usa la forma di cortesia u.
    note: 'Il farmacista è un adulto sconosciuto che svolge un servizio: vale la stessa regola di registro del bancone dei biglietti dell''Unità 15.'
  nl.a1.unit16.lesson05.teach.advies:
    title: Leggi un consiglio della farmacia
    gloss: 'Consiglio: prendi una pastiglia due volte al giorno con acqua. Riposa bene e bevi molta acqua. Dopo tre giorni continui a non sentirti bene? Allora vai dal medico.'
    note: Individua la posologia, i due consigli che non riguardano il farmaco e quando andare dal medico.
    glosses:
      Advies: consiglio
      neem: prendi
      keer: volte
      dag: giorno
      tablet: pastiglia
      Rust: riposa
      drink: bevi
      Voel: sentirsi
      steeds: ancora
      lekker: bene
      huisarts: medico
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte chiede come sta
    gloss: 'Lotte: Ciao Omar, come va? Ti senti già meglio?'
    note: '*Al* (già) indica che Lotte vuole sapere se Omar è migliorato dall''ultima volta che si sono sentiti.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar sta ancora male
    gloss: 'Omar: Non ancora molto bene. Ho ancora mal di testa e sono stanco.'
    note: '*Nog steeds* (ancora) indica che il mal di testa di prima non è passato; *moe* (stanco) è un aggettivo nuovo e utile.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte chiede della medicina
    gloss: 'Lotte: Hai preso una compressa?'
    note: '*Genomen* è il participio passato di *nemen*, con lo stesso schema *heb* + participio dell''Unità 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar conferma
    gloss: 'Omar: Sì, ho preso una compressa. Ora vado a riposare.'
    note: '*Ga nu rusten* (vado a riposare ora) usa lo schema del futuro prossimo *gaan* + infinito.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte gli fa gli auguri
    gloss: 'Lotte: Buona idea. Riposati bene. Guarisci presto!'
    note: '*Beterschap!* è l''espressione fissa standard per augurare a qualcuno una pronta guarigione.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar saluta
    gloss: 'Omar: Grazie, a domani!'
    note: '*Tot morgen!* riprende lo schema *tot* + tempo dei saluti delle unità precedenti.'
