course:
  title: Olandese A1
  description: 'Olandese di base per descrivere l''aspetto fisico di una persona: altezza e impressione di età, colore di capelli e occhi, la domanda chiave Hoe ziet ... eruit? e il confronto tra l''aspetto di due persone.'
units:
  nl.a1.unit30.appearance:
    title: Descrivere l'aspetto
lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong:
    title: Alto, basso, anziano e giovane
  nl.a1.unit30.lesson02.haar_beschrijven:
    title: Descrivere i capelli
  nl.a1.unit30.lesson03.ogen_en_eruitzien:
    title: Gli occhi e «Com'è?»
  nl.a1.unit30.lesson04.taalcafe_nina:
    title: Lotte descrive Nina
  nl.a1.unit30.lesson05.sander_fenna_vergelijken:
    title: Confronto tra Sander e Fenna
  nl.a1.unit30.lesson06.taalcafe_herkenning:
    title: Omar riconosce Nina
teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: Alto e basso
    gloss: alto / basso
    note: '*Lang* descrive una persona alta; *klein* descrive una persona bassa (è la stessa parola usata altrove in questo corso per un oggetto piccolo).'
    example_gloss:
    - Fenna è alta.
    - Sander è basso.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: Qui *oud* e *jong* descrivono un'impressione generale dell'aspetto, non un numero esatto di anni.
    example_gloss:
    - Il nonno è anziano.
    - Omar è giovane.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: un numero o un''impressione'
    gloss: Oud può indicare un numero preciso di anni, come in Hoe oud ben je?, oppure un'impressione generale senza numero, come in Opa is oud.
    note: Conosci già *oud* dalla domanda sull'età esatta di qualcuno (*Hoe oud ben je?*). Qui descrive quanti anni qualcuno DIMOSTRA, senza alcun numero.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna è alta e Sander è basso
    gloss: Fenna è alta e Sander è basso.
    note: Una semplice frase composta con *en* (e), che prepara il confronto diretto della lezione 5.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: I capelli
    gloss: i capelli
    note: '*Haar* è una parola het: *het haar*.'
    example_gloss: Omar ha i capelli neri e corti.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: Tre colori di capelli. *Zwart* (nero) è già comparso con i vestiti e qui viene riutilizzato per i capelli.
    example_gloss:
    - Lotte ha i capelli biondi.
    - Sander ha i capelli castani.
    - Il nonno ha i capelli grigi.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Lang* (lungo) riprende la parola per l''altezza della lezione 1, ora riferita alla lunghezza dei capelli. *Kort* (corto) è nuovo.'
    example_gloss:
    - Fenna ha i capelli lunghi.
    - Sander ha i capelli corti.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar vuole l'aggettivo senza -e
    gloss: 'Haar è una parola het senza articolo, quindi l''aggettivo resta senza desinenza: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: 'Davanti a *haar* in questa forma indeterminata e senza articolo non c''è la desinenza -e: confrontalo con *ogen* nella lezione 3, che invece la vuole.'
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: due significati'
    gloss: 'Haar ha due significati: «capelli» (il nuovo sostantivo di questa lezione) e «suo/sua» (il possessivo dell''Unità 5, per esempio haar moeder). Il contesto ti dice quale dei due è.'
    note: 'Un vero omonimo olandese: *haar* sostantivo (capelli) e *haar* possessivo (suo/sua) si scrivono allo stesso modo. Il resto della frase chiarisce sempre quale dei due è.'
    target_text: 'Haar ha due significati: «capelli» (il nuovo sostantivo di questa lezione) e «suo/sua» (il possessivo, per esempio haar moeder). Il contesto ti dice quale dei due è. '
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar ha i capelli neri e corti
    gloss: Omar ha i capelli neri e corti.
    note: Riprende *zwart* (nero) dall'unità 20 sui vestiti.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte ha i capelli biondi e lunghi
    gloss: Lotte ha i capelli biondi e lunghi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: Gli occhi
    gloss: gli occhi
    note: '*Ogen* è il plurale di *het oog*; il plurale vuole sempre *de*.'
    example_gloss: Omar ha gli occhi castani.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: '*Blauw* (blu) è già comparso con i vestiti; *bruin* (marrone) è appena stato introdotto nella lezione 2 per i capelli; *groen* (verde) è nuovo.'
    example_gloss:
    - Lotte ha gli occhi azzurri.
    - Sander ha gli occhi castani.
    - Fenna ha gli occhi verdi.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen vuole la -e
    gloss: 'Con ogen (plurale) l''aggettivo prende una -e in più: blauwe ogen, bruine ogen, groene ogen.'
    note: 'Confrontalo con *haar* della lezione 2, che lascia l''aggettivo senza desinenza: i plurali prendono sempre la -e, che la parola sia de o het.'
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Che aspetto ha Lotte?
    gloss: Che aspetto ha Lotte?
    note: '*Hoe ziet ... eruit?* è la domanda chiave di questa unità: usala per chiedere l''aspetto di chiunque.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte ha i capelli biondi e lunghi e gli occhi azzurri
    gloss: Lotte ha i capelli biondi e lunghi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in un'unica frase con *en*.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte presenta Nina
    gloss: 'Lotte: Al taalcafé arriva una nuova ragazza. Si chiama Nina.'
    note: '*Er komt* (arriva) introduce una persona nuova nella scena.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar chiede che aspetto ha
    gloss: 'Omar: Ok! Che aspetto ha?'
    note: Riprende la domanda chiave di questa unità, ora con *ze* (lei) al posto di un nome.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte descrive la statura e i capelli di Nina
    gloss: 'Lotte: È bassa e ha i capelli biondi e corti.'
    note: Unisce *klein* della lezione 1 con il lessico dei capelli della lezione 2.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar chiede degli occhi
    gloss: 'Omar: E i suoi occhi?'
    note: Qui *haar* significa «suo/sua» (il possessivo dell'Unità 5), non «capelli». Vedi la nota sugli omonimi della lezione 2.
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte descrive gli occhi di Nina
    gloss: 'Lotte: Ha gli occhi verdi.'
    note: Riprende *groene ogen* dalla lezione 3.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar la riconoscerà
    gloss: 'Omar: Grazie! Allora la riconoscerò.'
    note: '*Herken ik haar wel* significa «la riconoscerò di sicuro». Qui *haar* è di nuovo il pronome «lei/la», non «capelli».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Sander e Fenna a confronto
    gloss: Sander e Fenna sono fratello e sorella, ma non si assomigliano. Sander è basso e ha i capelli castani e corti e gli occhi marroni. Fenna è più alta di Sander e ha i capelli castani e lunghi e gli occhi verdi. E tu, come sei?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      broer: fratello
      zus: sorella
      zien: essere (di aspetto)
      anders: diverso
      klein: basso
      kort: basso
      bruin: castano
      haar: i capelli
      bruine: castano
      ogen: gli occhi
      langer: più alto
      lang: lungo
      groene: verde
      eruit: (parte di 'eruit zien' = avere un certo aspetto)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: Riusare la struttura del comparativo
    gloss: 'Questo schema lo conosci già dai confronti: aggettivo + er + dan. Qui lo usi per le persone: Fenna è più alta di Sander.'
    note: Esattamente lo schema *aggettivo + -er + dan* dell'Unità 14 sugli zaini, ora applicato alla descrizione delle persone invece che degli oggetti.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna ha i capelli più lunghi di Sander
    gloss: Fenna ha i capelli più lunghi di Sander.
    note: '*Langer* resta senza -e davanti a *haar* (una parola het), la stessa regola della nota sull''accordo della lezione 2, anche al comparativo.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello in prima persona con *Ik heb ...*, da riutilizzare per descrivere il tuo aspetto.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar nota Nina
    gloss: 'Omar: Guarda, è Nina quella? Ha i capelli biondi e corti e gli occhi verdi.'
    note: '*Kijk* (guarda) era già stato usato allo stesso modo nel dialogo dell''Unità 14.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte conferma
    gloss: 'Lotte: Sì, è Nina!'
    note: Una conferma breve e naturale.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina saluta Omar
    gloss: 'Nina: Ciao, sei Omar?'
    note: Una semplice domanda informale di saluto, *ben jij ...?*
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar ricambia il saluto a Nina
    gloss: 'Omar: Sì! Piacere di conoscerti, Nina.'
    note: '*Leuk je te ontmoeten* è la formula usata quando si incontra qualcuno per la prima volta (vedi Unità 1); *leuk je te zien* invece si usa con chi già conosci.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Omar ha riconosciuto Nina grazie alla descrizione di Lotte.'
