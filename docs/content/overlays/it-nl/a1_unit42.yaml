  nl.a1.unit42.lesson03.teach.ik_wil_grammar:
    title: La struttura Ik wil graag
    gloss: '*Ik wil graag* + colore indica quale colore scegli: Vorrei il rosa.'
    note: 'Si riprende la struttura *Ik wil graag ...* già vista per ordinare (Ik wil graag appels, Ik wil graag een koffie): nessuna grammatica nuova, solo un nuovo uso. I colori si usano sempre così (come complemento di *wil* o come parte nominale dopo *zijn*), mai direttamente davanti a un nome: in quel caso in olandese la desinenza del colore cambia (*rood* diventa *rode*), e questa regola non è ancora trattata in questo corso.'
