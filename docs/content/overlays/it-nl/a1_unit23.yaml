teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*In totaal* (in totale) chiarisce che vuoi il prezzo complessivo, non quello di un singolo articolo.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: Dire il prezzo totale
    gloss: Costa venticinque euro in totale.
    note: '*Kost* è la terza persona singolare di *kosten* (costare).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: '*Pinnen* è un verbo tipicamente olandese per pagare con la carta, derivato dal codice PIN usato per autorizzare il pagamento; *contant betalen* (letteralmente «in contanti pagare») è l''equivalente per il denaro contante, con *contant* prima di *betalen* come avverbio.'
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*Hier* (qui) colloca la domanda nel luogo in cui ti trovi.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*Wilt u* ...? è la forma di cortesia di *wil je* ...?, usata qui da un cassiere che non conosci.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: Il conto
    gloss: il conto
    note: 'Un sostantivo di genere comune: *de rekening*.'
    example_gloss: Dividiamo il conto?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*Zullen we* ...? riprende la struttura per proporre un piano vista nelle unità 11 e 19.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*Apart* (separatamente) modifica *afrekenen* (saldare il conto), quasi sinonimo di *betalen* usato in particolare per concludere un pagamento.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: Il resto
    gloss: il resto
    note: 'Un sostantivo neutro: *het wisselgeld*, composto da *wisselen* (cambiare) e *geld* (denaro).'
    example_gloss: Ecco il suo resto.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*Uw* è il possessivo di cortesia «suo», adatto al registro formale alla cassa o al banco.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*Nodig hebben* (avere bisogno di) riprende la struttura di *rugzak nodig hebben* dell''unità 14.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: Trentacinque
    gloss: trentacinque
    note: '*Vijfendertig* (letteralmente «cinque-e-trenta») segue il normale schema olandese dei numeri composti: prima le unità, poi le decine.'
    example_gloss: Costa trentacinque euro.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due piatti principali e due caffè. Totale: trentacinque euro. Pagato con carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      Rekening: conto
      twee: due
      hoofdgerechten: piatti principali
      koffies: caffè
      Totaal: totale
      vijfendertig: trentacinque
      euro: euro
      Betaald: pagato
      pin: carta
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte chiede il conto
    gloss: 'Lotte: Chiediamo il conto?'
    note: '*Vragen* (chiedere) ha *de rekening* come complemento oggetto.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar chiede il totale
    gloss: 'Omar: Sì, buona idea. Quanto costa in totale?'
    note: Riprende la domanda *hoeveel kost het in totaal?* della lezione 1.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte dice il totale
    gloss: 'Lotte: Sono trentacinque euro. Dividiamo?'
    note: '*Delen* (dividere) qui si riferisce a *de rekening*, che si capisce dal contesto.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar insiste per pagare
    gloss: 'Omar: No, oggi lascia pagare a me. Mi hai aiutato tanto.'
    note: '*Laat mij* ... (lascia che io ...) è il modo normale per offrirsi di fare qualcosa; *geholpen* è il participio passato di *helpen* (aiutare).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte è commossa
    gloss: 'Lotte: Che gentile da parte tua! Grazie.'
    note: '*Lief van je* (gentile da parte tua) è un complimento caloroso e comune per un gesto generoso.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar chiede se può pagare con il bancomat
    gloss: 'Omar: Posso pagare con il bancomat qui?'
    note: Riprende la domanda *kan ik hier pinnen?* della lezione 2, ora nel ristorante vero e proprio.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: la forma di lui/lei'
    gloss: Omar paga il conto.
    note: '*Betaalt* è la forma della terza persona di *betalen* (pagare).'
