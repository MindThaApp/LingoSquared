teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: Mercato, negozio, bancarella
    gloss: il mercato, il negozio, la bancarella
    note: '*De markt* può indicare un mercato in generale o il mercato all''aperto che si tiene regolarmente. *De winkel* è un negozio. Una *kraam* è una bancarella di un mercato all''aperto.'
    example_gloss:
    - Vado al mercato.
    - Vado al negozio.
    - La bancarella vende mele.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: Mele, pere, pomodori, peperoni
    gloss: mele, pere, pomodori, peperoni
    note: Il singolare è *appel*; il plurale è *appels*. Il singolare è *peer*; il plurale è *peren*. Il singolare è *tomaat*; il plurale è *tomaten*. In olandese *paprika* indica il peperone; il plurale scritto è *paprika's*, con l'apostrofo.
    example_gloss:
    - Vorrei delle mele.
    - Vorrei delle pere.
    - Vorrei dei pomodori.
    - Vorrei dei peperoni.
  nl.a1.unit07.lesson02.teach.kilo:
    title: Un chilo
    gloss: un chilo
    note: '*Een kilo* è un chilogrammo.'
    example_gloss: Voglio un chilo di mele.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: al chilo
    note: Nei cartellini del mercato il prezzo è spesso indicato al chilo.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: Quanto costa un chilo di mele?
    gloss: Quanto costa un chilo di mele?
    note: '*Hoeveel kost ...?* chiede il prezzo. Qui ciò che costa è *een kilo*, quindi si usa *kost* al singolare.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: Un chilo di mele costa 2,50 €
    gloss: Un chilo di mele costa 2,50 €.
    note: 'In olandese i prezzi si scrivono con la virgola decimale: €2,50, come in italiano. Il simbolo € però si mette davanti al numero.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: Due euro e cinquanta
    gloss: 2,50 € — due euro e cinquanta
    note: €2,50 si dice di solito *twee euro vijftig*, senza *en* e senza *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: Grammi, mezzo chilo, un pezzo, due pezzi
    gloss: cento grammi, un pond = 500 grammi, un pezzo, due pezzi
    note: 'Dopo un numero, l''olandese qui usa *gram*, non *grammen*. Nell''olandese di tutti i giorni *een pond* indica 500 grammi: è un termine informale piuttosto antico, non un''unità metrica ufficiale. *Per stuk* significa che ogni pezzo ha il suo prezzo; quando si indica da solo un numero di pezzi superiore a uno, si usa *stuks*, come in *twee stuks*.'
    example_gloss:
    - Voglio 100 grammi di formaggio.
    - Mezzo chilo di mele, per favore.
    - Posso averne uno, per favore?
    - Ne vorrei due, per favore.
  nl.a1.unit07.lesson03.teach.how_much:
    title: Quanto ne desidera?
    gloss: Quanto ne desidera?
    note: Il venditore usa la forma di cortesia *u*. *Hoeveel* può riferirsi sia a un peso sia a un numero di pezzi.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: Mezzo chilo di pomodori, per favore
    gloss: Un pond (500 g) di pomodori, per favore.
    note: È una risposta breve completa e naturale quando il venditore chiede *Hoeveel wilt u?*
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: Cartellino del prezzo
    gloss: il cartellino del prezzo
    note: '*Prijskaartje* si scrive in una sola parola. Impara qui la parola intera.'
    example_gloss: Il cartellino del prezzo dice 2,50 €.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: Cartellini dei prezzi al mercato
    gloss: 'Mele: 2,50 € al chilo. Pere: 3,00 € al chilo. Pomodori: 2,00 € al chilo. Peperoni: 1,00 € al pezzo.'
    note: Leggi *per kilo* come «al chilo» e *per stuk* come «al pezzo». Nei cartellini olandesi i prezzi usano la virgola, come in italiano.
    glosses:
      Appels: mele
      kilo: chilogrammo
      Peren: pere
      Tomaten: pomodori
      stuk: pezzo
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: Che cosa le servo?
    gloss: Che cosa desidera?
    note: '*Wat mag het zijn?* è una domanda cordiale e molto comune da parte di un venditore al mercato o di un commesso.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: Allora prendo un chilo di pere
    gloss: Allora prendo un chilo di pere, per favore.
    note: '*Dan neem ik ...* è un modo naturale per decidere che cosa comprare dopo aver sentito il prezzo.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: Altro?
    gloss: Altro?
    note: Una breve domanda di rito che il venditore fa spesso.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: No, grazie
    gloss: No, grazie.
    note: '*Dank u* corrisponde al registro di cortesia con *u* usato con il venditore.'
  nl.a1.unit07.lesson05.teach.total:
    title: Fanno 3,00 €
    gloss: Fanno 3,00 € — tre euro.
    note: '*Dat is dan ...* è un modo comune in cui il venditore dice il totale. Il prezzo scritto €3,00 si pronuncia *drie euro*.'
  nl.a1.unit07.lesson05.teach.pin:
    title: Posso pagare con la carta?
    gloss: Posso pagare con la carta?
    note: '*Pinnen* è il verbo olandese di uso quotidiano per pagare con carta di debito o di credito al terminale.'
  nl.a1.unit07.lesson06.teach.opening:
    title: Il saluto e la richiesta del prezzo
    gloss: 'Venditore: Buon pomeriggio. Che cosa desidera? Lotte: Buon pomeriggio. Quanto costa un chilo di mele?'
    note: Questo è uno scambio cordiale e cortese tra una cliente e un venditore.
  nl.a1.unit07.lesson06.teach.purchase:
    title: Scegliere la quantità
    gloss: 'Venditore: Due euro e cinquanta al chilo. Lotte: Allora ne prendo un chilo, per favore.'
    note: Dato che dalla battuta precedente si capisce che si parla di mele, Lotte può dire semplicemente *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: Pagare con la carta
    gloss: 'Venditore: Fanno due euro e cinquanta. Lotte: Posso pagare con la carta? Venditore: Sì, certo.'
    note: '*Kan ik pinnen?* è la normale domanda pratica che si fa al momento di pagare.'
  nl.a1.unit07.lesson06.teach.closing:
    title: Chiudere lo scambio
    gloss: 'Lotte: Grazie. Arrivederci! Venditore: Arrivederci!'
    note: '*Tot ziens* è adatto per concludere questo cortese scambio tra cliente e venditore.'
