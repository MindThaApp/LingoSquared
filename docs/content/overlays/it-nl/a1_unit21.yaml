teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: Felice, triste e arrabbiato
    gloss: contento, triste, arrabbiato
    note: 'Tre parole di base, molto comuni, per i sentimenti: si usano con zijn (essere) per dire come ti senti.'
    example_gloss:
    - Sono contento.
    - Sono triste.
    - Sono arrabbiato.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: Dire che si è contenti
    gloss: Sono contento.
    note: '*Zijn* (essere) + aggettivo di emozione è lo schema di base, come in italiano «Sono…».'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: Contrapporre le emozioni
    gloss: Non sono arrabbiato, sono triste.
    note: '*Niet* nega direttamente *boos*; la seconda frase dice poi l''emozione reale.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: Chiedere perché
    gloss: Perché sei felice?
    note: '*Waarom* (perché) è la parola interrogativa standard per chiedere una ragione.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: Dare un motivo
    gloss: Sono contento perché ho un nuovo appartamento.
    note: '*Omdat* (perché) introduce la frase che spiega il motivo; il verbo va alla fine di quella frase (*heb* va dopo *appartement*).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: Un motivo negativo
    gloss: Sono triste perché piove.
    note: Riprende *regent* (piove) dall'unità sul tempo atmosferico come frase che spiega il motivo.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: Nervoso
    gloss: nervoso
    note: La parola standard per indicare il nervosismo.
    example_gloss: Sono nervoso per il mio primo turno.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: Dire per che cosa si è agitati
    gloss: Sono nervoso per il mio primo turno.
    note: '*Voor* (letteralmente «per») introduce ciò che causa il nervosismo, dove in italiano si direbbe «per» o «a proposito di».'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: Rassicurare qualcuno
    gloss: Non ti preoccupare.
    note: '*Maak je geen zorgen* (letteralmente «non farti preoccupazioni») è la formula fissa standard per rassicurare.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: Chiedere come si sente qualcuno
    gloss: Come si sente Omar?
    note: '*Voelen zich* (sentirsi, riflessivo) è il modo standard per chiedere o descrivere uno stato d''animo, diverso dal *voelen* fisico usato nelle lezioni sulla salute dell''Unità 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: Descrivere come si sente qualcuno
    gloss: Si sente nervoso.
    note: '*Zich* (si) è il pronome riflessivo di terza persona, abbinato a *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: Chiedere perché qualcuno si sente in un certo modo
    gloss: Perché si sente nervoso?
    note: Combina *waarom* con lo schema *voelt zich* di *Hij voelt zich zenuwachtig*.
  nl.a1.unit21.lesson05.teach.bericht:
    title: Leggi un messaggio sulle emozioni
    gloss: Ciao Lotte, sono un po' nervoso per il mio primo turno da solo. Ma sono anche felice, perché ho un nuovo lavoro e un nuovo appartamento. Penso che andrà bene.
    note: Cerca di capire per che cosa è agitato chi scrive, che cosa lo rende contento e come vede la situazione nel complesso.
    glosses:
      beetje: un po'
      zenuwachtig: nervoso
      eerste: primo
      dienst: turno
      alleen: da solo
      blij: contento
      want: perché
      nieuwe: nuovo
      baan: lavoro
      nieuw: nuovo
      appartement: appartamento
      denk: pensare
      komt: 'andare (qui: andrà bene)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte chiede a Omar come si sente
    gloss: 'Lotte: Ciao Omar, come ti senti per il tuo primo turno?'
    note: '*Voor je eerste dienst* (per il tuo primo turno) riprende lo schema *voor* + sostantivo della lezione 03.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar ammette di essere nervoso
    gloss: 'Omar: Sono un po'' nervoso, onestamente.'
    note: '*Eerlijk gezegd* (onestamente, a dire il vero) attenua l''ammissione.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte lo rassicura
    gloss: 'Lotte: Non preoccuparti, ce la fai benissimo!'
    note: '*Je kunt het goed* (letteralmente «sai farlo bene») è un''espressione fissa di incoraggiamento.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar la ringrazia
    gloss: 'Omar: Grazie, mi aiuta davvero.'
    note: '*Helpt* è la forma della terza persona singolare di *helpen* (aiutare).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte prevede come andrà a finire
    gloss: 'Lotte: E dopo sarai sicuramente molto felice e orgoglioso.'
    note: '*Vast* (di sicuro) esprime una previsione sicura; *trots* (orgoglioso) è un aggettivo nuovo e utile.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar è d'accordo
    gloss: 'Omar: Sì, lo penso anch''io.'
    note: '*Dat denk ik ook* (letteralmente «questo penso io anche») è il modo naturale per essere d''accordo con l''opinione di qualcuno.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: Riassumere con is, zijn e hem
    gloss: Omar è nervoso per il suo primo turno. Lotte lo aiuta.
    note: '*Is* è la terza persona singolare di *zijn* (essere); qui *zijn* significa «suo» (possessivo); *hem* significa «lo/lui» (pronome complemento): tre paroline essenziali per parlare di un''altra persona.'
