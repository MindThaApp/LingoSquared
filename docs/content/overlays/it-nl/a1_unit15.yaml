teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: Il biglietto
    gloss: il biglietto
    note: '*Het kaartje* è un sostantivo neutro: si usa *het*, non *de*.'
    example_gloss: Vorrei un biglietto per Utrecht.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: Chiedere un biglietto
    gloss: Vorrei un biglietto per Utrecht.
    note: '*Wil graag* attenua una richiesta, lo stesso schema usato per ordinare da mangiare nell''Unità 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: L'addetto chiede che tipo di biglietto
    gloss: Desidera un biglietto di sola andata o di andata e ritorno?
    note: '*Wilt u* è la forma di cortesia di *willen*, usata qui con un impiegato della stazione che non conosci.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: Rispondere con cortesia
    gloss: Andata e ritorno, per favore.
    note: '*Alstublieft* è il "per favore" formale, in linea con il registro *u* dello scambio.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: Il registro allo sportello
    gloss: Allo sportello di solito si usa la forma di cortesia u.
    note: 'Riprende la distinzione tra *jij*/*je* e *u* introdotta nell''Unità 1: con chi lavora in un servizio e non conosci si usa di norma *u*.'
  nl.a1.unit15.lesson02.teach.perron:
    title: Il binario
    gloss: il binario
    note: '*Het perron* è neutro: si usa *het*, non *de*.'
    example_gloss: Da quale binario parte il treno per Utrecht?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: Chiedere quale binario
    gloss: Da quale binario parte il treno per Utrecht?
    note: '*Van welk perron* chiede proprio il binario, a differenza di una domanda generica sul luogo.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: Indicare i dettagli della partenza
    gloss: Il treno parte alle dieci meno un quarto dal binario cinque.
    note: '*Kwart voor tien* riprende lo schema dell''ora dell''Unità 4.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: Chiedere l'orario di arrivo
    gloss: A che ora arriva il treno?
    note: '*Komt ... aan* è un verbo separabile (*aankomen*): *aan* va alla fine della domanda.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: Indicare l'orario di arrivo
    gloss: Il treno arriva alle undici.
    note: Anche qui *komt aan* mostra le due parti del verbo separabile divise nella frase.
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: In orario / il ritardo
    gloss: in orario; il ritardo
    note: '*Op tijd* è un''espressione fissa per ciò che avviene secondo l''orario previsto. *De vertraging* (il ritardo) è un sostantivo di genere comune.'
    example_gloss:
    - Il treno non parte in orario.
    - 'Attenzione: il treno per Utrecht è in ritardo.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: Un annuncio
    gloss: 'Attenzione: il treno per Utrecht è in ritardo.'
    note: '*Let op* (letteralmente "fai attenzione") apre un annuncio in stazione, come in italiano "Attenzione, prego".'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: Negare «in orario»
    gloss: Il treno non parte in orario.
    note: '*Niet* sta subito prima di *op tijd* e nega l''intera espressione.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: Un cambio di binario
    gloss: Il treno parte dal binario tre invece che dal binario cinque.
    note: '*In plaats van* significa "al posto di".'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: Indicare la durata del ritardo
    gloss: Il treno ha dieci minuti di ritardo.
    note: '*Heeft vertraging* (letteralmente "ha ritardo") è il modo naturale per dire che qualcosa è in ritardo, accanto all''aggettivo *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: Ingresso, uscita, sala d'attesa
    gloss: l'ingresso; l'uscita; la sala d'attesa
    note: '*De ingang*, *de uitgang* e *de wachtruimte* sono tutti sostantivi di genere comune.'
    example_gloss:
    - Dov'è l'ingresso?
    - Dov'è l'uscita?
    - Dov'è la sala d'attesa?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: Chiedere dov'è un binario
    gloss: Dov'è il binario sette?
    note: Riprende lo schema *Waar is...?* delle lezioni sulle indicazioni stradali dell'Unità 9.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: Dare indicazioni
    gloss: Dritto e poi a destra.
    note: '*Rechtdoor* e *rechts* sono le stesse parole di direzione dell''Unità 9, qui riutilizzate in stazione.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: Chiedere della sala d'attesa
    gloss: Dov'è la sala d'attesa?
    note: Lo stesso schema di domanda applicato a un nuovo luogo.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: Leggere un biglietto stampato
    gloss: 'Biglietto: Amsterdam Centraal – Utrecht Centraal. Partenza: dieci e dieci, binario sette. Arrivo: le undici meno dieci. Andata e ritorno. Prezzo: dodici euro e quaranta.'
    note: Individua l'orario di partenza e il binario, l'orario di arrivo, il tipo di biglietto e il prezzo.
    glosses:
      Kaartje: biglietto
      Vertrek: partenza
      tien: dieci
      perron: binario
      zeven: sette
      Aankomst: arrivo
      elf: undici
      Retour: biglietto di andata e ritorno
      Prijs: prezzo
      twaalf: dodici
      euro: euro
      veertig: quaranta
  nl.a1.unit15.lesson06.teach.omar_open:
    title: Omar espone il piano
    gloss: 'Omar: Dobbiamo andare al binario sette. Il treno parte alle dieci e dieci.'
    note: Qui *moeten* (dovere) esprime una necessità pratica, non un obbligo rigido.
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: Lotte legge il tabellone
    gloss: 'Lotte: Guarda, ecco il tabellone: ritardo, dieci minuti.'
    note: '*Daar staat* (letteralmente "lì sta") è il modo naturale per dire che un cartello o un tabellone indica qualcosa.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: Omar resta calmo
    gloss: 'Omar: Nessun problema, abbiamo ancora tempo per un caffè.'
    note: '*Geen probleem* è una rassicurazione comune e informale.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: Arriva il treno
    gloss: 'Lotte: Buona idea. Oh, il treno è già qui. Binario sette, esatto!'
    note: '*Al* (già) indica che il treno è arrivato prima del previsto, visto il ritardo appena annunciato.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: Salgono sul treno
    gloss: 'Omar: Dai, saliamo. Utrecht, arriviamo!'
    note: '*Stappen in* (salire) è un verbo separabile: *in* va alla fine della frase. *We komen eraan* (letteralmente "stiamo venendo a esso") è il modo naturale olandese per dire "stiamo arrivando"; tradurlo parola per parola suonerebbe strano.'
