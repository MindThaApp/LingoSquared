teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: Appartamento, soggiorno, camera
    gloss: l'appartamento, il soggiorno, la camera
    note: '*Het appartement* è un sostantivo neutro; *de woonkamer* e *de slaapkamer* sono sostantivi di genere comune.'
    example_gloss:
    - Ho un appartamento.
    - Ho un soggiorno.
    - Ho una camera.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: Cucina, bagno
    gloss: la cucina, il bagno
    note: '*De keuken* e *de badkamer* sono entrambi sostantivi di genere comune (articolo de).'
    example_gloss:
    - Ho una cucina.
    - Ho un bagno.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: Dire che hai un appartamento
    gloss: Ho un appartamento.
    note: '*Hebben* (avere) è il verbo naturale per dire che casa hai, proprio come in italiano. Questo è un esempio generale; l''appartamento di Omar (a Utrecht) viene presentato più avanti in questa unità.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: Elencare tutte le stanze
    gloss: Ho un soggiorno, una camera da letto, una cucina e un bagno.
    note: Elenca in una sola frase tutte e quattro le stanze del vocabolario di questa lezione, separate da virgole e con *en* (e) prima dell'ultima.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: Chiedere quante stanze ci sono
    gloss: Quante stanze hai?
    note: '*Hoeveel* (quanti/quanto) riprende lo schema delle domande sulla quantità delle lezioni precedenti sui numeri.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: Dire quante camere ci sono
    gloss: Ho due camere.
    note: '*Slaapkamers* è il plurale di *slaapkamer*, formato regolarmente con -s.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: Dire il numero totale di stanze
    gloss: L'appartamento ha tre stanze.
    note: '*Kamers* è una parola generica per «stanze», non si riferisce solo alle camere da letto.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: Balcone, giardino
    gloss: il balcone, il giardino
    note: '*Het balkon* è neutro; *de tuin* è un sostantivo di genere comune.'
    example_gloss:
    - C'è un balcone.
    - Non c'è il giardino.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: Dire che qualcosa c'è
    gloss: C'è un balcone.
    note: '*Er is* è la costruzione olandese standard per dire che qualcosa esiste o c''è, corrisponde all''italiano «c''è».'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: Dire che qualcosa non c'è
    gloss: Non c'è il giardino.
    note: '*Geen* nega un sostantivo indeterminato: si dice *geen tuin*, non *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: Accogliente
    gloss: accogliente
    note: Un aggettivo olandese molto comune e tipico per un'atmosfera calda e piacevole; non ha un equivalente italiano esatto e può corrispondere a «accogliente» o «carino».
    example_gloss: L'appartamento è piccolo ma accogliente.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: Uno schema comune di descrizione
    gloss: L'appartamento è piccolo ma accogliente.
    note: '*Klein maar gezellig* è un modo molto comune e naturale con cui gli olandesi descrivono in positivo una casa piccola.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: Descrivere la grandezza di una stanza
    gloss: Il soggiorno è grande.
    note: '*Groot* descrive una stanza specifica, non l''intera casa.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: Descrivere la grandezza di un'altra stanza
    gloss: La cucina è piccola.
    note: Stesso schema di *groot* nella carta precedente, applicato a un'altra stanza con *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: Leggere un annuncio immobiliare
    gloss: 'Appartamento a Utrecht: una camera da letto, un soggiorno, una cucina e un bagno. C''è un balcone, ma non c''è il giardino. L''appartamento è piccolo ma accogliente.'
    note: Fai attenzione al numero di stanze, a ciò che c'è e a ciò che non c'è, e all'impressione generale che viene data.
    glosses:
      Appartement: appartamento
      slaapkamer: la camera
      woonkamer: il soggiorno
      keuken: la cucina
      badkamer: il bagno
      balkon: balcone
      tuin: giardino
      klein: piccolo
      gezellig: accogliente
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Lotte chiede dell'appartamento
    gloss: 'Lotte: Ciao Omar, com''è il tuo nuovo appartamento a Utrecht?'
    note: '*Nieuwe* è la forma flessa di *nieuw* (nuovo), usata davanti a un sostantivo.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar lo descrive
    gloss: 'Omar: È piccolo ma accogliente. Ho una camera da letto, un soggiorno, una cucina e un bagno.'
    note: 'Corrisponde esattamente all''annuncio immobiliare letto nella lezione 5: è proprio l''appartamento di Omar.'
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Lotte chiede del balcone
    gloss: 'Lotte: Hai un balcone?'
    note: Una domanda diretta con risposta sì/no che riprende *heb je ...?* delle unità precedenti.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar risponde
    gloss: 'Omar: Sì, ho un balcone, ma non il giardino.'
    note: 'Corrisponde ai dati dell''annuncio: c''è il balcone, non c''è il giardino.'
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: Usare hij per Omar
    gloss: 'Al posto di Omar puoi dire anche hij: lui ha un balcone.'
    note: '*Hij* (lui) può sostituire il nome di Omar una volta che è già stato nominato nella conversazione.'
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte reagisce con calore
    gloss: 'Lotte: Che bello! Passo a trovarti presto.'
    note: '*Komen langs* (passare a trovare qualcuno) è un verbo separabile: *langs* va alla fine della frase.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar le dà il benvenuto
    gloss: 'Omar: Che bello, sei sempre la benvenuta.'
    note: '*Altijd welkom* è un modo caloroso e naturale per invitare di nuovo qualcuno.'
