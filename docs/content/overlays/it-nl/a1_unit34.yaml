    title: Tot ziens e Tot + giorno
    gloss: 'Conosci già *Tot ziens!* Puoi anche indicare un giorno: *Tot zaterdag!*, *Tot morgen!*'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  nl.a1.unit34.lesson05.teach.tekst:
    title: Chi usa cosa?
    gloss: Lotte chiama Omar ogni giorno. Usa il telefono, non un'app. Omar non ha un computer a casa, ma usa internet sul telefono. Sander cerca le previsioni del tempo ogni mattina. Poi va a correre. Fenna manda spesso un messaggio a Lotte. Anche tu usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
