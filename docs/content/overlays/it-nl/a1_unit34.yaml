    title: Opzoeken è separabile
    gloss: 'Opzoeken è separabile, proprio come *opstaan* e *uitlaten*: ik zoek het op, jij zoekt het op. Ma *gebruiken* non è separabile: ik gebruik het.'
    note: 'Si contrappone ai verbi separabili dell''unità sulle routine: gebruiken (con il prefisso ge-) non si separa mai.'
