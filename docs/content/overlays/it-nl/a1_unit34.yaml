    title: Weerbericht e bericht
    gloss: Conosci già *het weerbericht* (weer + bericht). *Bericht* significa un messaggio che puoi mandare (ik stuur, jij/hij stuurt) o leggere (ik lees, jij/hij leest).
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
