    correct_option: A una persona a cui si dà del Lei si chiede se è nuova di qui.
    distractors:
    - A una persona della stessa età, con cui ci si dà del tu, si chiede se è nuova di qui.
    - A una persona a cui si dà del Lei si chiede se abita qui.
    - A una persona a cui si dà del Lei si chiede se è di qui.
    accepted_answers:
    - value: A una persona a cui si dà del Lei si chiede se è nuova di qui.
      status: correct
    feedback: Bent u nieuw hier? usa u e bent, la forma di cortesia.
  nl.a1.unit01.lesson01.exercise04.match_register:
