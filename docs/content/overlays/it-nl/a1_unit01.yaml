teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: Ciao e salve
    gloss: ciao
    note: '*Hallo* è neutro e va bene sia in contesti informali sia formali. *Hoi* è comune e informale.'
    example_gloss:
    - Salve, sei nuovo qui?
    - Ciao, sono Noor.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 'Tu e Lei: forme informali e formali'
    gloss: tu (informale, accentato) / tu (informale, non accentato) / Lei (formale)
    note: '*Jij* è la forma informale singolare e si usa quando la parola è accentata o in contrasto. *Je* è la forma informale singolare non accentata, la più usata nel parlato quotidiano. *U* indica una distanza rispettosa. Nei Paesi Bassi è naturale con alcuni sconosciuti più anziani e nei rapporti esplicitamente formali, ma tra adulti jij/je è molto diffuso anche in tanti negozi e luoghi di lavoro.'
    example_gloss:
    - Sei nuovo qui? (informale, accentato)
    - Sei nuovo qui. (informale, non accentato)
    - È nuovo qui? (formale)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: Chiedere a un coetaneo se è nuovo
    gloss: Sei nuovo qui?
    note: 'Nella domanda *jij bent* diventa *ben jij*: la -t cade quando *jij* segue il verbo.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: Chiedere in modo formale se qualcuno è nuovo
    gloss: È nuovo qui?
    note: Con *u* si usa *bent u*. La -t resta.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: Scegliere la forma di cortesia
    gloss: 'jij/je: informale · u: formale o di cortesia'
    note: Usa *jij/je* con amici, coetanei, bambini e in molti contesti moderni e rilassati. Usa *u* quando il rapporto richiede rispetto o distanza; le preferenze variano, quindi segui l'esempio dell'altra persona.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: Saluti del mattino, del pomeriggio e della sera
    gloss: buongiorno (mattina) / buon pomeriggio / buonasera
    note: '*Goedemorgen* si usa al mattino, di solito fino a mezzogiorno circa. *Goedemiddag* si usa da mezzogiorno circa per tutto il pomeriggio. *Goedenavond* è un saluto serale.'
    example_gloss:
    - Buongiorno! Come stai?
    - Buon pomeriggio, come sta? (formale)
    - Buonasera! Sei nuovo qui?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: Come va?
    gloss: Come sta?
    note: '*Hoe gaat het?* è un modo comune e neutro per chiedere come sta qualcuno.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: Come stai? Informale
    gloss: Come sta?
    note: '*Met je* indica chiaramente la persona a cui ti rivolgi, in modo informale.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: Come sta? Formale
    gloss: Come sta?
    note: Usa *met u* quando la situazione richiede il Lei.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'Bene, grazie: informale'
    gloss: Bene, grazie.
    note: '*Dank je* corrisponde al tu informale.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'Bene, grazie: formale'
    gloss: Bene, grazie.
    note: '*Dank u* corrisponde al Lei formale.'
  nl.a1.unit01.lesson02.teach.prima:
    title: Benissimo
    gloss: benissimo / bene
    note: '*Prima* è una risposta breve e positiva.'
    example_gloss: Benissimo, grazie.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: Non male
    gloss: non male
    note: '*Niet slecht* di solito è una risposta leggermente positiva.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: E tu? Informale
    gloss: E Lei?
    note: '*Jou* è la forma informale accentata dopo *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: E Lei? Formale
    gloss: E Lei?
    note: '*U* mantiene formale anche la domanda di ritorno.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: Chiedere il nome in modo informale
    gloss: Come si chiama?
    note: '*Hoe heet je?* è la normale domanda informale per chiedere il nome.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: Chiedere il nome in modo formale
    gloss: Come si chiama?
    note: '*Hoe heet u?* è di cortesia; *Wat is uw naam?* è un''altra formula formale, dal tono più amministrativo, che qui non viene verificata.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: Dire il proprio nome
    gloss: Mi chiamo Noor.
    note: '*Ik heet ...* è un modo diretto e standard per dire il proprio nome.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: Presentarsi in modo naturale
    gloss: Sono Noor.
    note: '*Ik ben ...* è particolarmente comune nelle presentazioni parlate.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: Il mio nome è
    gloss: Il mio nome è Noor.
    note: '*Mijn naam is ...* è corretto, ma un po'' più esplicito di *Ik ben ...* o *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: Piacere di conoscerti
    gloss: Piacere.
    note: È una frase cordiale e naturale in un primo incontro.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: Piacere
    gloss: piacere
    note: '*Aangenaam* è convenzionale e più formale di *Leuk je te ontmoeten*.'
    example_gloss: Piacere! Sono Noor.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: Chiedere di dove è qualcuno
    gloss: Di dov'è Lei?
    note: '*Kom je* è la forma informale della domanda.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: Chiedere in modo formale di dove è qualcuno
    gloss: Di dov'è Lei?
    note: 'Con *u* il verbo è *komt*: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: Dai Paesi Bassi
    gloss: Vengo dai Paesi Bassi.
    note: Usa *uit* davanti al paese di provenienza.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: Dal Belgio
    gloss: Vengo dal Belgio.
    note: '*België* ha la dieresi sulla seconda e.'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: Dalla Germania
    gloss: Vengo dalla Germania.
    note: '*Duitsland* è il paese; *Duits* è la lingua.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: Nazionalità olandese
    gloss: Sono olandese.
    note: '*Nederlands* può indicare sia la nazionalità sia la lingua olandese. In italiano invece si usano parole diverse solo in parte: «olandese» vale per entrambe, ma la lingua ha l''articolo («l''olandese»).'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: Nazionalità belga
    gloss: Sono belga.
    note: Qui *Belgisch* indica la nazionalità belga.
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: Parlare olandese
    gloss: Parlo olandese.
    note: In olandese i nomi delle lingue si scrivono con l'iniziale maiuscola, a differenza dell'italiano.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: Parlare inglese
    gloss: Parlo inglese.
    note: '*Engels* è la parola olandese per «inglese»; si scrive con l''iniziale maiuscola, a differenza dell''italiano.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: Parlare tedesco
    gloss: Parlo tedesco.
    note: '*Duits* è la parola olandese per «tedesco»; si scrive con l''iniziale maiuscola, a differenza dell''italiano.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: Caffè linguistico e biblioteca
    gloss: il caffè linguistico / la biblioteca
    note: Un *taalcafé* è un ritrovo informale, senza pressioni, per praticare l'olandese con altre persone. Le biblioteche pubbliche olandesi spesso ospitano attività locali, tra cui i caffè linguistici.
    example_gloss:
    - Sono qui per il caffè linguistico.
    - Sto imparando l'olandese in biblioteca.
  nl.a1.unit01.lesson05.teach.location:
    title: Il luogo dell'incontro
    gloss: Il caffè linguistico è in biblioteca.
    note: Questa frase presenta l'ambientazione della scena.
  nl.a1.unit01.lesson05.teach.here_for:
    title: Verificare l'attività in comune
    gloss: Sei qui per il caffè linguistico?
    note: È un'apertura informale e naturale quando due persone arrivano per la stessa attività.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: Confermare l'attività
    gloss: Sì, sono qui per il caffè linguistico.
    note: La risposta ripete chiaramente l'attività.
  nl.a1.unit01.lesson05.teach.learning:
    title: Dire che cosa stai imparando
    gloss: Sto imparando l'olandese.
    note: '*Leer* è la forma della prima persona singolare di *leren*, «imparare».'
  nl.a1.unit01.lesson05.teach.me_too:
    title: Anch'io
    gloss: Anch'io.
    note: '*Ik ook* è un modo breve e naturale per dire che si condivide qualcosa.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: Chiedere se è la prima volta di qualcuno
    gloss: È la tua prima volta?
    note: È una conversazione cordiale in un'attività che si ripete.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: Dire che è la tua prima volta
    gloss: Sì, è la mia prima volta.
    note: '*Mijn* significa «mio/mia».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte inizia la conversazione
    gloss: 'Lotte: Ciao, sono Lotte. Come ti chiami?'
    note: In questo gruppo informale Lotte usa il *je* confidenziale.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar dice il suo nome
    gloss: 'Omar: Mi chiamo Omar. Piacere di conoscerti.'
    note: Risponde alla domanda sul nome e saluta per l'incontro.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte chiede la provenienza
    gloss: 'Lotte: Piacere mio! Di dove sei?'
    note: '*Jou ook!* è una risposta breve e naturale a *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar dice da dove viene
    gloss: 'Omar: Vengo dall''Egitto. E tu?'
    note: '*En jij?* rivolge la stessa domanda all''altra persona, in modo informale.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte continua la conversazione
    gloss: 'Lotte: Io vengo dai Paesi Bassi. È la tua prima volta al caffè linguistico?'
    note: '*Bij het taalcafé* significa «al caffè linguistico», inteso come attività.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar risponde e dice che cosa sta imparando
    gloss: 'Omar: Sì, è la mia prima volta. Sto imparando l''olandese.'
    note: Risponde alla domanda di Lotte prima di aggiungere un'informazione di base su di sé.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: Arrivederci
    gloss: Arrivederci!
    note: '*Tot ziens* è un saluto di congedo neutro.'
  nl.a1.unit01.lesson06.teach.closing:
    title: Una chiusura naturale
    gloss: 'Lotte: Bene! Ci vediamo la settimana prossima. Omar: Ci vediamo la settimana prossima!'
    note: Ripetere *Tot volgende week* è naturale quando entrambi pensano di tornare.
exercises:
