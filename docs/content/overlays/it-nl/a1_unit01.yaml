    instruction: Quale opzione contiene le due forme singolari informali di «tu»?
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij e je sono forme singolari informali; u è la forma di cortesia.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: Scegli il pronome di cortesia per completare la domanda.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? usa la forma di cortesia.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
