teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: Da lunedì a mercoledì
    gloss: lunedì, martedì, mercoledì
    note: In olandese i nomi dei giorni della settimana di norma iniziano con la minuscola, come in italiano.
    example_gloss:
    - Oggi è lunedì.
    - Oggi è martedì.
    - Oggi è mercoledì.
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: Giovedì, venerdì
    gloss: giovedì, venerdì
    note: Donderdag e vrijdag continuano la serie dei giorni della settimana, sempre in minuscolo.
    example_gloss:
    - Oggi è giovedì.
    - Il caffè linguistico è venerdì.
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: Sabato, domenica
    gloss: Sabato, domenica
    note: Zaterdag e zondag sono i giorni del fine settimana.
    example_gloss:
    - Oggi è sabato.
    - Oggi è domenica.
  nl.a1.unit03.lesson01.teach.ask_day:
    title: Chiedere che giorno della settimana è
    gloss: Che giorno è oggi?
    note: Welke dag ... chiede il giorno della settimana, non la data del calendario.
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: Dire che giorno è oggi
    gloss: Oggi è mercoledì.
    note: Il giorno della settimana resta in minuscolo anche all'interno della frase.
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: Giorni della settimana in minuscolo
    gloss: 'I giorni di norma non hanno la maiuscola: lunedì, venerdì.'
    note: Come in italiano, in olandese i nomi dei giorni della settimana non si scrivono con la maiuscola, tranne a inizio frase.
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: Da gennaio a marzo
    gloss: gennaio, febbraio, marzo
    note: In olandese i nomi dei mesi di norma iniziano con la minuscola, come in italiano.
    example_gloss:
    - Il mio compleanno è a gennaio.
    - Imparo l'olandese a febbraio.
    - Il mio compleanno è a marzo.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: Da aprile a giugno
    gloss: aprile, maggio, giugno
    note: L'olandese mei è maggio; juni è giugno.
    example_gloss:
    - Imparo l'olandese ad aprile.
    - Il mio compleanno è a maggio.
    - Imparo l'olandese a giugno.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: Da luglio a settembre
    gloss: luglio, agosto, settembre
    note: 'Attenzione: juli e juni si assomigliano molto e si distinguono solo per una lettera (l / n).'
    example_gloss:
    - Il mio compleanno è a luglio.
    - Imparo l'olandese ad agosto.
    - Il mio compleanno è a settembre.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: Da ottobre a dicembre
    gloss: ottobre, novembre, dicembre
    note: In olandese oktober si scrive con la k, mentre in italiano si scrive «ottobre».
    example_gloss:
    - Imparo l'olandese a ottobre.
    - Il mio compleanno è a novembre.
    - Imparo l'olandese a dicembre.
  nl.a1.unit03.lesson02.teach.year:
    title: Anno
    gloss: l'anno
    note: Jaar è la parola che si usa per l'anno di calendario.
    example_gloss: Quest'anno imparo l'olandese.
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: Nomi dei mesi in minuscolo
    gloss: 'I mesi di norma non hanno la maiuscola: aprile, settembre.'
    note: Come in italiano, in olandese i nomi dei mesi si scrivono con la minuscola, tranne a inizio frase.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: Dal primo al quarto
    gloss: '1–4: il primo, il secondo, il terzo, il quarto'
    note: Eerste, tweede e derde sono forme da imparare a memoria; vierde si forma a partire da vier.
    example_gloss:
    - È il primo aprile.
    - È il 2 aprile.
    - È il 3 aprile.
    - È il 4 aprile.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: Dal quinto all'ottavo
    gloss: '5–8: il quinto, il sesto, il settimo, l''ottavo'
    note: Queste forme per la data sono vijfde, zesde, zevende e achtste.
    example_gloss:
    - È il 5 aprile.
    - È il 6 aprile.
    - È il 7 aprile.
    - È l'8 aprile 2026.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: Dal nono al dodicesimo
    gloss: '9–12: il nono, il decimo, l''undicesimo, il dodicesimo'
    note: Queste forme coprono le date dei primi giorni del mese che useremo più avanti nell'unità.
    example_gloss:
    - È il 9 aprile.
    - È il 10 aprile.
    - È l'11 aprile.
    - È il 12 aprile.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: Dal tredicesimo al diciannovesimo
    gloss: '13–19: il tredicesimo, il quattordicesimo, il quindicesimo, il sedicesimo, il diciassettesimo, il diciottesimo, il diciannovesimo'
    note: Questi ordinali dei giorni, scritti per esteso, terminano in -de.
    example_gloss:
    - È il 13 aprile.
    - È il 14 aprile.
    - È il 15 aprile.
    - È il 16 aprile.
    - È il 17 aprile.
    - È il 18 aprile.
    - È il 19 aprile.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: Dal ventesimo al ventiquattresimo
    gloss: '20–24: il ventesimo, il ventunesimo, il ventiduesimo, il ventitreesimo, il ventiquattresimo'
    note: Da twintig in su, questi ordinali terminano in -ste e si scrivono in una sola parola.
    example_gloss:
    - È il 20 aprile.
    - Il libro va restituito il 21 aprile.
    - È il 22 aprile.
    - È il 23 aprile.
    - È il 24 aprile.
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: Dal venticinquesimo al ventinovesimo
    gloss: '25–29: il venticinquesimo, il ventiseiesimo, il ventisettesimo, il ventottesimo, il ventinovesimo'
    note: Questi ordinali composti terminano in -ste e si scrivono in una sola parola.
    example_gloss:
    - È il 25 aprile.
    - È il 26 aprile.
    - È il 27 aprile.
    - È il 28 aprile.
    - È il 29 aprile.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: Il trentesimo e il trentunesimo
    gloss: '30–31: il trentesimo, il trentunesimo'
    note: Sono gli ultimi due numeri possibili per il giorno di un mese.
    example_gloss:
    - È il 30 aprile.
    - È il 31 dicembre.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: Dire una data con l'ordinale
    gloss: 3 aprile — il tre aprile
    note: Quando il giorno si pronuncia per intero, in olandese si usa il numero ordinale (de derde april), mentre in italiano di solito si usa il numero cardinale (il tre aprile). Come in italiano, il giorno viene prima del mese.
  nl.a1.unit03.lesson03.teach.on_date:
    title: In una data
    gloss: il 3 aprile — il tre aprile
    note: Con la cifra scritta si usa op 3 april; quando l'ordinale è scritto per esteso si usa op de derde april.
  nl.a1.unit03.lesson04.teach.ask_date:
    title: Chiedere la data del calendario
    gloss: Che data è oggi?
    note: Welke datum ... chiede esplicitamente la data del calendario.
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: Chiedere quale giorno del mese è
    gloss: Quanti ne abbiamo oggi?
    note: De hoeveelste ... è un modo comune, nella conversazione, di chiedere il numero del giorno.
  nl.a1.unit03.lesson04.teach.date_answer:
    title: Dire una data completa
    gloss: È il 3 aprile 2026.
    note: Come in italiano, l'ordine della data in olandese è giorno–mese–anno, e april resta in minuscolo.
  nl.a1.unit03.lesson04.teach.date_words:
    title: Dire il giorno con l'ordinale
    gloss: È il tre aprile.
    note: 'L''ordinale scritto per esteso comprende de: de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: Ordine giorno–mese–anno
    gloss: 'giorno–mese–anno: 3 aprile 2026 oppure 3-4-2026'
    note: 'La forma numerica segue l''ordine giorno–mese–anno, come in italiano: 3-4-2026 significa 3 aprile 2026.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: Unire giorno della settimana e data
    gloss: Oggi è venerdì 10 aprile.
    note: Sia vrijdag sia april si scrivono con l'iniziale minuscola in mezzo alla frase. Il 10 aprile 2026 è davvero un venerdì.
  nl.a1.unit03.lesson05.teach.when:
    title: Quando
    gloss: quando
    note: Wanneer chiede in quale momento o in quale data succede qualcosa.
    example_gloss: Quando c'è il caffè linguistico?
  nl.a1.unit03.lesson05.teach.book:
    title: Libro
    gloss: il libro
    note: Qui boek è un libro della biblioteca.
    example_gloss: Ho il libro.
  nl.a1.unit03.lesson05.teach.due_date:
    title: Data di restituzione
    gloss: la data di restituzione
    note: Una inleverdatum è la data entro cui bisogna restituire qualcosa.
    example_gloss: Qual è la data di restituzione del libro?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: Chiedere quando va restituito un libro
    gloss: Quando deve essere restituito il libro?
    note: Moet ... terug è un modo semplice e naturale per chiedere quando va restituito un oggetto preso in prestito.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: Dare la data di restituzione
    gloss: Il 21 aprile.
    note: La risposta breve usa op seguito dal giorno e dal mese in minuscolo.
  nl.a1.unit03.lesson05.teach.due_words:
    title: Dire la data di restituzione a parole
    gloss: Il libro deve essere restituito il ventuno aprile.
    note: Con l'ordinale scritto in lettere, dopo op si mette de.
  nl.a1.unit03.lesson05.teach.label:
    title: Leggere un'etichetta con la data di restituzione
    gloss: 'Data di restituzione: 21-4-2026'
    note: Questa etichetta numerica segue l'ordine giorno–mese–anno.
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Lotte chiede che giorno della settimana è
    gloss: 'Lotte: Che giorno è oggi? Omar: È mercoledì.'
    note: La risposta indica un giorno della settimana.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Lotte chiede la data
    gloss: 'Lotte: E che data è? Omar: È l''8 aprile 2026.'
    note: 'Nella risposta parlata in olandese si usa l''ordinale de achtste (in italiano useremmo il numero cardinale: «l''otto aprile»). L''8 aprile 2026 è davvero un mercoledì, come nella battuta precedente.'
  nl.a1.unit03.lesson06.teach.next:
    title: Prossimo
    gloss: prossimo
    note: Volgende indica l'occorrenza successiva.
    example_gloss: Quando c'è il prossimo caffè linguistico?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: Chiedere la data del prossimo incontro
    gloss: 'Lotte: Quando c''è il prossimo caffè linguistico? Omar: Venerdì 10 aprile.'
    note: La risposta combina op, un giorno della settimana in minuscolo, il numero del giorno e un mese in minuscolo. Il 10 aprile 2026 è davvero un venerdì, due giorni dopo l'8.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: Chiudere la conversazione
    gloss: 'Lotte: Bene, a venerdì! Omar: A presto!'
    note: Tot vrijdag indica il giorno del prossimo incontro.
