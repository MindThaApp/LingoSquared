teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: Stazione, supermercato, biblioteca, ospedale
    gloss: la stazione, il supermercato, la biblioteca, l'ospedale
    note: 'Con *station* si usa *het*: *het station*. In olandese *supermarkt* si scrive in una parola sola: *de supermarkt*. Con *bibliotheek* si usa *de*: *de bibliotheek*. In olandese *ziekenhuis* si scrive in una parola sola: *het ziekenhuis*.'
    example_gloss:
    - Dov'è la stazione?
    - Il supermercato è accanto alla stazione.
    - La biblioteca è di fronte alla stazione.
    - L'ospedale è dietro la biblioteca.
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: Banca, ufficio postale, fermata dell'autobus
    gloss: la banca, l'ufficio postale, la fermata dell'autobus
    note: 'Per la banca come istituto finanziario l''olandese usa *de bank*. *Postkantoor* si scrive in una parola sola e vuole *het*: *het postkantoor*. *Bushalte* si scrive in una parola sola e vuole *de*: *de bushalte*.'
    example_gloss:
    - La banca è accanto al supermercato.
    - L'ufficio postale è tra la biblioteca e l'ospedale.
    - La fermata dell'autobus è davanti alla stazione.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: Accanto a, di fronte a
    gloss: accanto a, di fronte a
    note: '*Naast* indica che una cosa è subito accanto a un''altra. *Tegenover* indica che due luoghi si trovano uno di fronte all''altro, spesso ai due lati di una strada o di una piazza.'
    example_gloss:
    - La banca è accanto al supermercato.
    - La biblioteca è di fronte alla stazione.
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: Il supermercato è accanto alla stazione
    gloss: Il supermercato è accanto alla stazione.
    note: '*Naast* significa subito accanto: *De supermarkt is naast het station*.'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: La biblioteca è di fronte alla stazione
    gloss: La biblioteca è di fronte alla stazione.
    note: 'Con *station* resta sempre *het*: *tegenover het station*.'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: Dietro, davanti a
    gloss: dietro, davanti a
    note: '*Achter* indica un luogo dietro un altro. Qui *voor* significa davanti a, ma in altre frasi può avere altri significati.'
    example_gloss:
    - L'ospedale è dietro la biblioteca.
    - La fermata dell'autobus è davanti alla stazione.
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: L'ospedale è dietro la biblioteca
    gloss: L'ospedale è dietro la biblioteca.
    note: 'Metti *achter* prima dell''altro luogo: *achter de bibliotheek*.'
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: La fermata dell'autobus è davanti alla stazione
    gloss: La fermata dell'autobus è davanti alla stazione.
    note: Qui *voor* indica dove si trova la fermata dell'autobus.
  nl.a1.unit08.lesson04.teach.waar_is:
    title: Dov'è ...?
    gloss: Dov'è ...?
    note: Usa *Waar is ...?* per chiedere dove si trova un luogo.
  nl.a1.unit08.lesson04.teach.where_post_office:
    title: Dov'è l'ufficio postale?
    gloss: Dov'è l'ufficio postale?
    note: Nella domanda resta *het* con *postkantoor*.
  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: Tra, vicino a / presso
    gloss: tra, vicino a / presso
    note: Usa *tussen ... en ...* per collocare un luogo tra altri due. *Bij* indica che un luogo è vicino a un altro; è meno preciso di *naast*.
    example_gloss:
    - L'ufficio postale è tra la biblioteca e l'ospedale.
    - Il supermercato è vicino alla stazione.
  nl.a1.unit08.lesson04.teach.in_de_buurt_van:
    title: Vicino
    gloss: vicino a
    note: Le parole *in de buurt van*, insieme, indicano che un luogo è nelle vicinanze.
  nl.a1.unit08.lesson04.teach.post_office_between:
    title: L'ufficio postale è tra due luoghi
    gloss: L'ufficio postale è tra la biblioteca e l'ospedale.
    note: Usa *en* tra i due altri luoghi.
  nl.a1.unit08.lesson04.teach.supermarket_near:
    title: Il supermercato è vicino alla stazione
    gloss: Il supermercato è vicino alla stazione.
    note: '*Bij* indica un luogo nelle vicinanze, senza dire che gli edifici siano uno accanto all''altro.'
  nl.a1.unit08.lesson04.teach.library_vicinity:
    title: La biblioteca è vicina alla stazione
    gloss: La biblioteca è vicina alla stazione.
    note: 'Impara *in de buurt van* come un''unica espressione: *in de buurt van het station*.'
  nl.a1.unit08.lesson05.teach.kaart_buurtkaart:
    title: Mappa, mappa del quartiere
    gloss: la mappa, la mappa del quartiere
    note: '*De kaart* può essere una mappa o un altro tipo di carta o tessera; qui significa mappa. *Buurtkaart* si scrive in una parola sola: *de buurtkaart*.'
    example_gloss:
    - Dov'è la mappa?
    - Ecco la mappa del quartiere.
  nl.a1.unit08.lesson05.teach.map_labels:
    title: Le indicazioni sulla mappa del quartiere
    gloss: 'Biblioteca: di fronte alla stazione. Ospedale: dietro la biblioteca. Ufficio postale: tra la biblioteca e l''ospedale. Supermercato: accanto alla stazione. Banca: accanto al supermercato. Fermata dell''autobus: davanti alla stazione.'
    note: Ogni indicazione nomina un luogo e dice dov'è.
    glosses:
      BUURTKAART: MAPPA DEL QUARTIERE
      Bibliotheek: biblioteca
      tegenover: di fronte a
      station: stazione
      Ziekenhuis: ospedale
      achter: dietro
      Postkantoor: ufficio postale
      tussen: tra
      Supermarkt: supermercato
      naast: accanto a
      Bank: banca
      Bushalte: fermata dell'autobus
  nl.a1.unit08.lesson06.teach.opening:
    title: Guardando la mappa
    gloss: 'Lotte: Guarda, ecco la mappa del quartiere. Omar: Bene. Dov''è la fermata dell''autobus?'
    note: Lotte e Omar si parlano in modo informale, come sempre.
  nl.a1.unit08.lesson06.teach.stop_location:
    title: Dov'è la fermata dell'autobus
    gloss: 'Lotte: La fermata dell''autobus è davanti alla stazione.'
    note: Lotte risponde con una sola indicazione diretta.
  nl.a1.unit08.lesson06.teach.more_places:
    title: Dov'è il supermercato
    gloss: 'Omar: E dov''è il supermercato? Lotte: Il supermercato è accanto alla stazione, vicino alla banca.'
    note: La risposta dice dove si trova il supermercato rispetto a due luoghi.
  nl.a1.unit08.lesson06.teach.library:
    title: Dov'è la biblioteca
    gloss: 'Omar: Dov''è la biblioteca? Lotte: La biblioteca è di fronte alla stazione. Il caffè delle lingue è nella biblioteca.'
    note: Qui si ritrova la biblioteca già incontrata in precedenza nel corso.
