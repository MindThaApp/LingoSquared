teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*Bel* è la forma di *bellen* per ik; qui l''olandese usa il presente, come spesso anche l''italiano per un''azione imminente («ti chiamo»).'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: Rispondere al telefono
    gloss: Pronto, sono Lotte.
    note: '*Met* + nome (letteralmente «con nome») è il modo standard in olandese di presentarsi al telefono, mentre in italiano si dice «sono…».'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Omar risponde allo stesso modo
    gloss: Pronto, sono Omar.
    note: Stessa struttura *met* + nome di *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*Met wie spreek ik?* è la formula standard e formale per chi chiama senza essere conosciuto.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Lotte.
    note: '*U spreekt met* + nome è la controparte formale di *met* + nome.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*Kun je* ...? («Puoi...?») + *herhalen* («ripetere») + *dat* («questo/quello»).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*Niet zo* + aggettivo nega il grado, non il verbo: non così veloce, non «non parlare».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: '*Horen* («sentire») con *niet goed* («non bene») indica un problema di udito, diverso da *verstaan* («capire»).'
  nl.a1.unit22.lesson04.teach.sms:
    title: Messaggio
    gloss: il messaggio
    note: 'Un sostantivo di genere comune: *de sms*, preso dall''abbreviazione internazionale, come in italiano «sms».'
    example_gloss: L'sms è di Lotte.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: '*Sturen* («inviare») prende il complemento di termine (*je*) prima dell''oggetto diretto (*een sms*).'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*Terug* («indietro») è una particella separabile, posta in fondo alla frase; *bellen* + *terug* corrisponde a «richiamare».'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: Leggi uno scambio di messaggi
    gloss: 'Omar: Ciao Lotte, puoi chiamarmi? Devo dirti una cosa. Lotte: Sì, certo, ti richiamo tra cinque minuti.'
    note: Individua cosa chiede Omar, perché e quando Lotte dice che richiamerà.
    glosses:
      Hoi: ciao
      kun: puoi
      bellen: chiamare
      moet: devo
      iets: qualcosa
      vertellen: raccontare
      natuurlijk: certo
      bel: chiamare
      vijf: cinque
      minuten: minuti
      terug: restituire
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Omar risponde alla chiamata
    gloss: 'Omar: Pronto, sono Omar.'
    note: 'Stessa struttura *met* + nome della lezione 1, ora in una vera telefonata: chi risponde parla per primo e dice il proprio nome.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Lotte si presenta
    gloss: 'Lotte: Ciao Omar, sono Lotte. Omar: Che bello che mi chiami!'
    note: '*Fijn dat* ... («che bello che...», «che piacere che...») esprime una reazione positiva a un evento.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Lotte chiede del turno
    gloss: 'Lotte: Com''è stato il tuo primo turno?'
    note: '*Was* è il passato semplice di *zijn*, una costruzione diversa dal passato prossimo (hebben/zijn + participio passato, ad es. *Ik heb gewerkt*) della Unità 12; vedi la nota dopo la prossima riga.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: Omar dà una buona notizia
    gloss: 'Omar: È andata molto bene, meglio di quanto pensassi.'
    note: '*Ging* è il passato semplice di *gaan* («andare», qui nel senso di «andare a finire»); *dacht* è il passato semplice di *denken* («pensare»).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht sono forme del passato semplice
    gloss: was → essere, ging → andare, dacht → pensare
    note: '*Was*, *ging* e *dacht* sono forme irregolari del passato semplice (verleden tijd), un modello diverso dal passato prossimo dell''unità 12 (hebben/zijn + participio passato), che per ora non è ancora trattato in modo formale. Per ora memorizza was/ging/dacht come espressioni fisse nei contesti in cui compaiono in questa lezione; le regole complete di coniugazione del passato semplice arriveranno in un livello successivo.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: Lotte è orgogliosa
    gloss: 'Lotte: Che bello sentirlo! Sono fiera di te.'
    note: '*Trots op* («fiero di») è una combinazione fissa: ci vuole *op*, non *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: Omar è commosso
    gloss: 'Omar: Grazie, significa molto per me.'
    note: '*Betekent* è la terza persona di *betekenen* («significare»); *voor me* («per me») indica a chi importa.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: '*Zijn* qui è il possessivo «suo», non il verbo «essere»: il contesto distingue le due parole identiche.'
