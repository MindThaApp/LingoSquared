course:
  title: Olandese A1
  description: Olandese per principianti per gestire una semplice telefonata o uno scambio di messaggi, anche chiedendo a qualcuno di ripetere o di parlare più lentamente.
units:
  nl.a1.unit22.communication:
    title: Chiamare e scrivere messaggi
