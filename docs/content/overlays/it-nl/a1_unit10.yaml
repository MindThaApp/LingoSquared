teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: Alzarsi
    gloss: alzarsi → mi alzo
    note: 'In una frase principale *opstaan* si separa: *Ik sta op*. Il prefisso *op* va in fondo alla frase.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: Vestirsi
    gloss: vestirsi → mi vesto
    note: '*Zich aankleden* è riflessivo e separabile. Con *ik* si usa *me* e *aan* va in fondo: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: Fare colazione
    gloss: fare colazione → faccio colazione
    note: '*Ontbijten* non si separa: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: Il lavoro
    gloss: lavorare → lavoro
    note: '*Werken* non si separa: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: Mangiare
    gloss: mangiare → mangio
    note: 'La forma di *eten* con *ik* è *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: Lavare i piatti
    gloss: lavare i piatti → lavo i piatti
    note: '*Afwassen* si separa: *Ik was af*. Il prefisso *af* va in fondo alla frase.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: Dormire
    gloss: dormire → dormo
    note: '*Slapen* non si separa. La forma con *ik* ha la vocale lunga: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: Lo schema della separazione
    gloss: 'In una normale frase principale la prima parte va in fondo: opstaan → Ik sta op.'
    note: Non dire *Ik opsta*. Coniuga il verbo base e metti il breve prefisso alla fine della frase principale.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan in una frase
    gloss: 'alzarsi: mi alzo alle sette.'
    note: L'indicazione di tempo va tra *sta* e il prefisso finale *op*.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden in una frase
    gloss: 'vestirsi: mi vesto.'
    note: Lo schema è *Ik* + *kleed* + *me* + *aan*. *Aan* resta in fondo.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen in una frase
    gloss: 'lavare i piatti: lavo i piatti dopo aver mangiato.'
    note: '*Na het eten* va tra *was* e il prefisso finale *af*.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: Verbi che non si separano
    gloss: 'Non separabili: faccio colazione, lavoro, dormo. Nessuna parte va alla fine.'
    note: '*Ontbijten*, *werken* e *slapen* restano un''unica forma verbale in queste frasi principali.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: Alzarsi alle sette e mezza
    gloss: Mi alzo alle 7:30.
    note: 'Ricorda come si dice l''ora in olandese: *half acht* indica la metà verso le otto, quindi le 7:30 (in italiano diremmo «le sette e mezza»). *Op* resta alla fine.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: Vestirsi alle otto meno un quarto
    gloss: Mi vesto alle 7:45.
    note: L'ora viene prima del prefisso separabile finale *aan*.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: Fare colazione alle otto
    gloss: Faccio colazione alle otto.
    note: Usa *om* davanti all'ora. *Ontbijt* non si separa.
  nl.a1.unit10.lesson03.teach.work_time:
    title: Lavorare dalle nove alle cinque
    gloss: Lavoro dalle nove alle cinque.
    note: '*Van ... tot ...* indica l''ora di inizio e quella di fine.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: Mangiare alle sei e mezza
    gloss: Mangio alle 18:30.
    note: '*''s Avonds* rende esplicita la sera, quindi qui *half zeven* sono le 18:30.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: Dormire alle undici
    gloss: Dormo alle undici.
    note: 'Usa *om* davanti all''ora: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: Prima, poi, dopo
    gloss: prima, poi, dopo
    note: '*Eerst* indica la prima attività, *dan* passa alla successiva e *daarna* si collega a ciò che è venuto prima.'
    example_gloss:
    - Prima mi alzo.
    - Poi mi vesto.
    - Dopo faccio colazione.
  nl.a1.unit10.lesson04.teach.sequence:
    title: Una mattina in tre passi
    gloss: Prima mi alzo. Poi mi vesto. Dopo faccio colazione.
    note: 'I prefissi separabili chiudono comunque la frase: *sta ik op*; *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: Verbo prima di ik
    gloss: 'Dopo eerst, dan e daarna il verbo viene prima di ik: Daarna ontbijt ik.'
    note: Se si inizia con una parola di sequenza, *Ik ontbijt* diventa *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: La mia giornata
    gloss: La mia giornata — Mi alzo alle 7:30. Dopo mi vesto e alle otto faccio colazione. Lavoro dalle nove alle cinque. Alle 18:30 mangio. Dopo lavo i piatti. Alle undici dormo.
    note: Leggi facendo attenzione sia all'ordine delle attività sia agli orari. Nota *op*, *aan* e *af* alla fine delle frasi con verbi separabili.
    glosses:
      Mijn: mio
      dag: giorno
      sta: alzarsi (con op)
      half: mezza, verso l'ora successiva (half acht = 7:30)
      acht: otto
      Daarna: dopo
      kleed: vestirsi (con me ... aan)
      uur: ora / in punto
      ontbijt: fare colazione
      werk: lavorare
      negen: nove
      vijf: cinque
      zeven: sette
      avonds: di sera, del pomeriggio
      eet: mangiare
      was: lavare i piatti (con af)
      elf: undici
      slaap: dormire
  nl.a1.unit10.lesson06.teach.question:
    title: Chiedere della giornata
    gloss: 'Lotte: Com''è la tua giornata, Omar?'
    note: '*Hoe ziet jouw dag eruit?* è un modo informale per invitare qualcuno a descrivere la sua giornata. *Eruitzien* è separabile: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: La mattina di Omar
    gloss: 'Omar: Mi alzo alle 7:30. Poi mi vesto e alle otto faccio colazione.'
    note: Omar collega tre attività della mattina e tiene *op* e *aan* alla fine delle rispettive frasi.
  nl.a1.unit10.lesson06.teach.work:
    title: La giornata di lavoro di Omar
    gloss: 'Lotte: Quando lavori? Omar: Lavoro dalle nove alle cinque.'
    note: Lotte e Omar si danno del *je* informale.
  nl.a1.unit10.lesson06.teach.evening:
    title: La sera di Omar
    gloss: 'Omar: Alle 18:30 mangio. Poi lavo i piatti. Alle undici dormo.'
    note: 'Se si inizia con un''ora o con *daarna*, il verbo va prima di *ik*: *eet ik*, *was ik*, *slaap ik*. *Af* resta alla fine.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: La mattina di Lotte
    gloss: 'Lotte: Mi alzo alle sei, ma faccio colazione solo alle sei e mezza.'
    note: '*Pas* qui significa «non prima di». Lotte mette a confronto l''ora in cui si alza con quella della colazione.'
