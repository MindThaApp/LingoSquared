  ar.a1.unit39.lesson06.teach.lyla_ahb_alshtaa:
    title: Layla antwortet
    gloss: 'Layla: Ich mag den Winter. Im Winter laufen wir Schlittschuh.'
  ar.a1.unit39.lesson06.teach.krym_ara_alkhryf:
    title: Karim antwortet
    gloss: 'Karim: Ich finde den Herbst schön. Der Herbst ist ruhig.'
