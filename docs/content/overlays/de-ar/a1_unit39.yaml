  ar.a1.unit39.lesson05.teach.alan_alrbya_alwrwd:
    title: Ein Gespräch über die Jahreszeiten
    gloss: 'Jetzt ist Frühling. Die Rosen sind schön. Nour fragt: Welche Jahreszeit findest du schön? Yusuf sagt: Ich mag den Sommer. Im Sommer schwimmen wir. Layla sagt: Ich mag den Winter. Im Winter laufen wir Schlittschuh.'
    note: Ein kurzer Text, der das Gespräch über die Jahreszeiten zusammenfasst. Die Jahreszeiten sind maskuline Wörter mit ال, zum Beispiel الصيف (aṣ-ṣayf) und الشتاء (ash-shitāʾ).
    glosses:
      الربيع: der Frühling
      الورود: Rosen
      جميلة: schön
      تسأل: fragt
      فصل: Jahreszeit
      تراه: denken / finden
      يقول: sagt
      الصيف: der Sommer
      أحب: mögen (ich mag)
      نسبح: schwimmen
      الشتاء: der Winter
      نتزلج: Schlittschuh laufen
