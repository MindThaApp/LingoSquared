course:
  title: Arabisch A1
  description: 'Arabisch für Anfänger: die äußere Erscheinung einer Person beschreiben – Größe und Alter, Haar- und Augenfarbe, die Frage كيف تبدو؟ (kayfa tabdū?) und der Vergleich zweier Personen mit أطول من (aṭwal min).'
