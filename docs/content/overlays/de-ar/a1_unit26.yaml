teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Groß und klein
    gloss: groß / klein
    note: 'طويل (ṭawīl) bedeutet „groß“ und قصير (qaṣīr) „klein“. Bei einer Frau erhalten sie die Endung ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara ist groß.
    - Karim ist klein.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Alt und jung
    gloss: alt / jung
    note: كبير في السن (kabīr fī as-sinn) und صغير في السن (ṣaghīr fī as-sinn) beschreiben einen allgemeinen Eindruck vom Alter, nicht eine genaue Zahl von Jahren.
    example_gloss:
    - Opa ist alt.
    - Yusuf ist jung.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Alter: eine Zahl oder ein Eindruck'
    gloss: كم عمرك؟ (kam ʿumruka?) fragt nach einer Anzahl von Jahren, während كبير في السن (kabīr fī as-sinn) einen allgemeinen Eindruck ohne Zahl wiedergibt, wie in الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Mit كم عمرك؟ fragen Sie, wie alt jemand genau ist. كبير في السن beschreibt hier nur, wie alt jemand wirkt.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara ist groß und Karim ist klein
    gloss: Sara ist groß und Karim ist klein.
    note: 'و (wa-) verbindet die beiden Sätze und wird an das folgende Wort angeschlossen: وكريم (wa-karīm). Die Adjektive richten sich nach dem Bezugswort: سارة طويلة ist feminin, كريم قصير ist maskulin.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Haare
    gloss: die Haare
    note: 'الشعر (ash-shaʿr) bedeutet „das Haar“. ش ist ein Sonnenbuchstabe, daher wird das ل des Artikels ال nicht gesprochen: ash-shaʿr.'
    example_gloss: Yusuf hat kurze schwarze Haare.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: 'أشقر (ashqar), بني (bunnī) und رمادي (ramādī) beschreiben das Haar und stehen nach dem Nomen: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla hat blonde Haare.
    - Karim hat braune Haare.
    - Opa hat graue Haare.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: 'طويل (ṭawīl) und قصير (qaṣīr) beschreiben auch das Haar: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Sie stehen nach شعر, das maskulin ist.'
    example_gloss:
    - Sara hat lange Haare.
    - Karim hat kurze Haare.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Das Adjektiv steht nach dem Nomen
    gloss: 'Im Arabischen steht das Adjektiv nach dem Nomen und richtet sich nach ihm: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) ist maskulin, deshalb stehen auch seine Adjektive im Maskulinum. Bei einem unbestimmten Nomen nimmt keines der beiden Wörter ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Haar und ihr Haar
    gloss: شعر (shaʿr) bedeutet „Haar“. Fügen Sie das Pronomen ها (hā, „ihr“) an, erhalten Sie شعرها (shaʿruhā, „ihr Haar“).
    note: 'Die Endung ها zeigt die Besitzerin an: شعرها („ihr Haar“), اسمها („ihr Name“), عيناها („ihre Augen“). Sie wird an das Wort angeschlossen.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf hat kurze schwarze Haare
    gloss: Yusuf hat kurze schwarze Haare.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) vor einem Namen bedeutet „hat“ und wird an den Namen angeschlossen.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla hat lange blonde Haare
    gloss: Layla hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Augen
    gloss: die Augen
    note: 'العينان (al-ʿaynān) bedeutet „die Augen“. Es ist ein Dual: Das Arabische hat eine eigene Endung ان für genau zwei.'
    example_gloss: Yusuf hat braune Augen.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: 'أزرق (azraq) „blau“, بني (bunnī) „braun“ und أخضر (akhḍar) „grün“ sind die maskulinen Formen. Bei عينان verwendet man die Dualformen: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla hat blaue Augen.
    - Karim hat braune Augen.
    - Sara hat grüne Augen.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Augen im Dual, Adjektiv im Dual
    gloss: 'عينان (ʿaynān) steht im Dual, also steht auch das Adjektiv im Dual: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: Im Dual wird die Endung ان sowohl an das Nomen als auch an das Adjektiv angehängt. Das Adjektiv ist außerdem feminin, weil عين ein feminines Nomen ist.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Wie sieht Layla aus?
    gloss: Wie sieht Layla aus?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) fragt, wie Layla aussieht. تبدو (tabdū) ist feminin, weil Layla eine Frau ist; bei einem Mann heißt es يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla hat lange blonde Haare und blaue Augen
    gloss: Layla hat lange blonde Haare und blaue Augen.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + Name bedeutet „hat“, und و verbindet Haare und Augen.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla stellt Nour vor
    gloss: 'Layla: Ein neues Mädchen kommt ins Sprachencafé. Sie heißt Nour.'
    note: 'ستأتي (sa-taʾtī) bedeutet „sie wird kommen“: س (sa-) kennzeichnet das Futur und ت (ta-) bedeutet „sie“. اسمها (ismuhā) bedeutet „ihr Name“.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf fragt, wie sie aussieht
    gloss: 'Yusuf: Okay! Wie sieht sie aus?'
    note: 'كيف تبدو؟ (kayfa tabdū?) enthält diesmal keinen Namen: Das Verb تبدو bedeutet bereits „sie sieht aus“.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla beschreibt Nours Größe und Haare
    gloss: 'Layla: Sie ist klein und hat kurze blonde Haare.'
    note: قصيرة (qaṣīra) ist feminin, weil Nour eine Frau ist, aber شعر قصير أشقر bleibt maskulin, weil شعر ein maskulines Nomen ist.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf fragt nach ihren Augen
    gloss: 'Yusuf: Und ihre Augen?'
    note: 'وعيناها (wa-ʿaynāhā) bedeutet „und ihre Augen“: و (wa-) wird an das Nomen angeschlossen, und ها (hā) am Ende bedeutet „ihr“.'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla beschreibt Nours Augen
    gloss: 'Layla: Sie hat grüne Augen.'
    note: 'لها (lahā) bedeutet „sie hat“: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) ist ein Dual-Nomen mit einem Dual-Adjektiv.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf wird sie erkennen
    gloss: 'Yusuf: Danke! Dann erkenne ich sie.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) bedeutet „ich werde sie erkennen“: س (sa-) kennzeichnet das Futur, und ها in عليها bedeutet „sie“.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Karim und Sara im Vergleich
    gloss: Karim und Sara sind Bruder und Schwester, aber sie sehen unterschiedlich aus. Karim ist klein und hat kurze braune Haare und braune Augen. Sara ist größer als Karim und hat lange braune Haare und grüne Augen. Wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      أخ: Bruder
      أخت: Schwester
      تبدو: ist ... (vom Aussehen her)
      مختلفان: verschieden
      القامة: klein (von der Körpergröße)
      قصير: klein
      بني: braun
      شعر: Haare
      بنيتان: braun
      وعينان: Augen
      أطول: größer
      طويل: lang
      خضراوان: grün
      المظهر: Aussehen (wie jemand aussieht)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Vergleichen mit أفعل
    gloss: 'Zum Vergleichen verwendet man die Form أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), „Sara ist größer als Karim“.'
    note: طويل (ṭawīl) wird im Komparativ zu أطول (aṭwal), und من (min) bedeutet „als“. Die Form ändert sich bei einer Frau nicht.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara hat längere Haare als Karim
    gloss: Sara hat längere Haare als Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول bleibt maskulin, weil شعر ein maskulines Nomen ist.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: 'لدي (ladayya) bedeutet „ich habe“; das Arabische hat kein Verb für „haben“. Die Adjektive stehen nach dem Nomen: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf entdeckt Nour
    gloss: 'Yusuf: Schau mal, ist das Nour? Sie hat kurze blonde Haare und grüne Augen.'
    note: انظري (unẓurī) ist der Imperativ an eine Frau, weil Yusuf mit Layla spricht; an einen Mann gerichtet heißt es انظر (unẓur). هذه (hādhihi) bedeutet „diese“ und steht bei einem femininen Nomen.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla bestätigt
    gloss: 'Layla: Ja, das ist Nour!'
    note: Eine kurze, natürliche Bestätigung.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour begrüßt Yusuf
    gloss: 'Nour: Hallo, bist du Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) ist eine Ja-Nein-Frage: هل (hal) + ein Satz ohne Verb für „sein“.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf begrüßt Nour zurück
    gloss: 'Yusuf: Ja! Freut mich, dich kennenzulernen, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) ist die höfliche Wendung bei einer ersten Begegnung. ب (bi-) wird an معرفتك angeschlossen, und das ك am Ende bedeutet „dich“.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour erwidert die Begrüßung
    gloss: 'Nour: Freut mich auch, dich kennenzulernen!'
    note: 'Das Gespräch endet: Yusuf hat Nour anhand von Laylas Beschreibung erfolgreich erkannt.'
