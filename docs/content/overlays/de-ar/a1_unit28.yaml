course:
  title: Arabisch A1
  description: 'Arabisch für Anfänger über Sport und Bewegung: gängige Sportarten benennen, sagen, wie oft man sie macht, die Verben أمارس (umāris) und ألعب (alʿab) und einen gemeinsamen Sportplan machen.'
