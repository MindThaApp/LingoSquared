    title: Ich spiele Fußball
    gloss: Ich spiele Fußball.
    note: 'ألعب (alʿab) ist das Verb für Ballspiele: ألعب كرة القدم (alʿab kurat al-qadam). Wörtlich ist كرة القدم „der Ball des Fußes“.'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Verben für Sport: أمارس und ألعب'
    gloss: 'Sagen Sie أمارس (umāris, „ich übe aus“) vor den meisten Sportarten: أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Bei Ballspielen sagen Sie ألعب (alʿab, „ich spiele“): ألعب كرة القدم.'
    note: أمارس (umāris) passt zu den meisten Sportarten, aber Ballspiele verlangen ألعب (alʿab). Lernen Sie das Verb daher gemeinsam mit der Sportart.
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Mal pro Woche
    gloss: Mal pro Woche
    example_gloss: Ich mache zweimal pro Woche Yoga.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Mal pro Woche
    gloss: كثيرا (kathīran) und كل يوم (kull yawm) sind allgemein; مرتين في الأسبوع (marratayn fī al-usbūʿ) sagt genau, wie oft. مرتين ist der Dual von مرة (marra, „Mal“).
    note: Erweitert den Wortschatz zur Häufigkeit, der in der Hobby-Lektion schon eingeführt wurde.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
