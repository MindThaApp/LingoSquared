  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: Etwas gemeinsam vorschlagen
    gloss: 'Um etwas gemeinsam vorzuschlagen, verwenden Sie هل (hal) + ein Verb in der Wir-Form: هل نتمشى؟ (hal natamashshā?) und هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Verwendet genau die Konstruktion für Vorschläge aus der Lektion über Pläne.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: Sara stimmt zu
    gloss: 'Sara: Ja, schön! Ich liebe das Schwimmen.'
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
    title: Yusuf spielt lieber Fußball
