  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Zwei Arten, über Sport zu sprechen
    gloss: أمارس الرياضة (umāris ar-riyāḍa) spricht über Sport im Allgemeinen, während أمارس اليوغا (umāris al-yūghā) die konkrete Sportart nennt. Beides ist richtig.
    note: رياضة (riyāḍa) ist ein feminines Nomen, und اليوغا (al-yūghā) ist ein Sportname mit angehängtem ال.
