  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: Das Verb ändert sich mit der Person
    gloss: 'Das Verb ändert sich mit der Person: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'Der erste Buchstabe des Verbs zeigt, wer handelt: أ (a-) steht für „ich“, ي (ya-) für „er“ und ت (ta-) für „du“ oder „sie“.'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Yusuf reagiert
    gloss: 'Yusuf: Wie schön, ich spiele dort oft Fußball.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla und Sara über Sport
    gloss: Layla macht zweimal pro Woche Yoga. Sie bewegt sich gern ruhig. Sara macht kein Yoga, aber sie liebt das Schwimmen. Sara schwimmt oft, fast jede Woche. Welchen Sport machen Sie?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) und سارة تسبح (sāra tasbaḥ) haben Verben, die mit ت (ta-) beginnen, weil beide Frauen sind. لا vor einem Verb macht es verneint.
    glosses:
      تمارس: macht
      مرتين: zweimal (zwei Mal)
      الأسبوع: Woche
      اليوغا: Yoga
      تحب: liebt
      بهدوء: ruhig
      تتحرك: bewegen
      السباحة: schwimmen
      تسبح: schwimmt
      كثيرا: oft
      تقريبا: fast
      ما: welchen
      الرياضة: Sport
  ar.a1.unit28.lesson05.teach.sara_tsbh_kthyra:
