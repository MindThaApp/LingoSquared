  ar.a1.unit32.lesson03.teach.ytsl_aldmyr_balfal:
    title: Pronomen, die am Verb hängen
    gloss: 'Ein Pronomen wird an das Ende des Verbs angehängt: أدعوك (adʿūka, ich lade dich ein), أدعوه (adʿūhu, ich lade ihn ein), أدعوها (adʿūhā, ich lade sie ein).'
