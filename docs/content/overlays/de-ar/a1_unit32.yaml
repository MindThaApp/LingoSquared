  ar.a1.unit32.lesson06.teach.ywsf_ayd_mylad:
    title: Yusuf gratuliert Sara
    gloss: 'Yusuf: Alles Gute zum Geburtstag, Sara!'
  ar.a1.unit32.lesson06.teach.lyla_mbrwk_hdhh:
    title: Layla überreicht ein Geschenk
    gloss: 'Layla: Herzlichen Glückwunsch! Hier ist ein Geschenk für dich.'
  ar.a1.unit32.lesson06.teach.sara_shkra_lkma:
    title: Sara bedankt sich
    gloss: 'Sara: Danke euch beiden! Das ist wirklich lieb.'
