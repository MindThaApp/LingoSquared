  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: Wer macht was für die Party?
    gloss: Am Samstag hat Sara Geburtstag. Wir feiern mit einer Party. Yusuf lädt Karim und Layla zur Party ein. Karim feiert gern mit Freunden. Layla kommt auch zur Party. Alle freuen sich für Sara.
    note: Fasst den Plan für die Party zusammen.
    glosses:
      السبت: Samstag
      ميلاد: Geburt (wie in Geburtstag)
      نحتفل: feiern
      بحفلة: Party
      يدعو: lädt ein
      إلى: zu (Teil von „lädt … zur Party ein“)
      الاحتفال: feiert
      يحب: mag
      الأصدقاء: Freunde
      ستأتي: kommt
      الجميع: alle
      سعداء: glücklich
