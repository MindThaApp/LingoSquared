teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Eins
    gloss: eins
    note: واحد (wāḥid) wird auch allein, ohne Nomen, verwendet, um auf „Wie viele?“ zu antworten.
    example_gloss: Ich habe ein Buch.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Zwei
    gloss: zwei
    note: اثنان (ithnān) ist die eigenständige Grundform von zwei.
    example_gloss: Ich habe zwei Brüder.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Drei
    gloss: drei
    note: ثلاثة (thalātha) ist die eigenständige Grundform von drei.
    example_gloss: Eins, zwei, drei.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Vier
    gloss: vier
    note: أربعة (arbaʿa) ist die eigenständige Grundform von vier.
    example_gloss: Ich habe vier Bücher.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Fünf
    gloss: fünf
    note: خمسة (khamsa) ist die eigenständige Grundform von fünf.
    example_gloss: Ich habe fünf Bücher.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Sechs
    gloss: sechs
    note: ستة (sitta) ist die eigenständige Grundform von sechs.
    example_gloss: Ich habe sechs Bücher.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Sieben
    gloss: sieben
    note: سبعة (sabʿa) ist die eigenständige Grundform von sieben.
    example_gloss: Ich habe sieben Bücher.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Acht
    gloss: acht
    note: ثمانية (thamāniya) ist die eigenständige Grundform von acht.
    example_gloss: Ich habe acht Bücher.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Neun
    gloss: neun
    note: تسعة (tisʿa) ist die eigenständige Grundform von neun.
    example_gloss: Ich habe neun Dirham.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Zehn
    gloss: zehn
    note: عشرة (ʿashara) ist die eigenständige Grundform von zehn.
    example_gloss: Ich habe zehn Dinar.
  ar.a1.unit03.lesson03.teach.kam:
    title: Wie viel kostet das?
    gloss: Wie viel kostet das?
    note: كم هذا؟ (kam hādhā) ist eine einfache Art, nach dem Preis zu fragen; auch بكم هذا؟ (bi-kam hādhā, „für wie viel ist das?“) ist sehr gebräuchlich.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Zahl
    gloss: Nummer
    note: رقم (raqam) ist das allgemeine Wort für eine Zahl bzw. Nummer, etwa eine Telefonnummer.
    example_gloss: Meine Nummer ist eins.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Nach dem Preis fragen
    gloss: Yusuf fragt, was etwas kostet.
    note: كم هذا؟ eröffnet das Gespräch.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Den Preis nennen
    gloss: Layla sagt, dass es fünf kostet.
    note: بخمسة hängt die Präposition بـ (für/zu) direkt an die Zahl an.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Nach einem anderen Artikel fragen
    gloss: Yusuf zeigt auf etwas anderes.
    note: وهذا؟ verkürzt die Frage, indem es den vorherigen Zusammenhang aufgreift.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Den zweiten Preis nennen
    gloss: Layla sagt, dass es zehn kostet.
    note: بعشرة folgt demselben Muster wie بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Danke sagen
    gloss: Yusuf bedankt sich bei ihr.
    note: شكرا aus der Einheit über Begrüßungen beschließt das Gespräch.
