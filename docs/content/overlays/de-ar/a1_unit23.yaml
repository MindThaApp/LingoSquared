  ar.a1.unit23.lesson01.teach.phone:
    title: Telefon
    gloss: Handy
    note: هاتف (hātif) bedeutet „Telefon“.
    example_gloss: Das ist ein Telefon.
  ar.a1.unit23.lesson01.teach.hear:
    title: Ich höre Sie / dich
    gloss: ich höre dich
    note: أسمعك (asmaʿuka zu einem Mann, asmaʿuki zu einer Frau) bedeutet „ich höre dich“; لا أسمعك (lā asmaʿuk) bedeutet „ich kann dich nicht hören“.
    example_gloss: Ich kann dich nicht hören.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Wiederholen
    gloss: wiederhole
    note: 'أعد (aʿid) sagt man zu einem Mann; zu einer Frau: أعيدي (aʿīdī). أعد من فضلك bittet höflich darum, etwas zu wiederholen.'
    example_gloss: Ich kann dich nicht hören. Bitte wiederhole.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Langsam sprechen
    gloss: sprich langsam
    note: 'تكلم ببطء (takallam bi-buṭʾ) sagt man zu einem Mann; zu einer Frau: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Bitte sprich langsam.
  ar.a1.unit23.lesson02.teach.message:
    title: Nachricht
    gloss: Nachricht
    note: رسالة (risāla) bedeutet „Nachricht“; es kann auch „Brief“ bedeuten.
    example_gloss: Das ist eine Nachricht.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Termin
    gloss: der Termin
    note: موعد (mawʿid) bedeutet „Termin“; الموعد (al-mawʿid) heißt „der Termin“.
    example_gloss: Der Termin ist um fünf Uhr.
  ar.a1.unit23.lesson02.teach.line01:
    title: Telefon abnehmen
    gloss: Yusuf begrüßt Layla am Telefon und nennt seinen Namen.
    note: Am Telefon sagt man mit أنا يوسف (anā Yūsuf), wer anruft.
    example_gloss: 'Yusuf sagte: Hallo, ich bin Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Nicht hören können
    gloss: Layla sagt, dass sie Yusuf nicht hören kann.
    note: Das leitet die Bitte um Klärung ein.
    example_gloss: 'Layla sagte: Hallo Yusuf, ich kann dich nicht hören.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Um langsames Sprechen bitten
    gloss: Layla bittet Yusuf, langsam zu sprechen.
    note: من فضلك macht die Bitte höflich; Layla sagt تكلم, weil sie mit einem Mann spricht.
    example_gloss: 'Layla sagte: Bitte sprich langsam.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Wichtige Information
    gloss: Yusuf sagt, dass der Termin um fünf Uhr ist.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) bedeutet „um fünf Uhr“.
    example_gloss: 'Yusuf sagte: Der Termin ist um fünf Uhr.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Um Wiederholung bitten
    gloss: Layla bittet Yusuf, es zu wiederholen.
    note: أعد من فضلك ist die Bitte um Wiederholung.
    example_gloss: 'Layla sagte: Bitte wiederhole.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Information wiederholen
    gloss: Yusuf wiederholt die Uhrzeit des Termins.
    note: Die Wiederholung bestätigt die Uhrzeit.
    example_gloss: 'Yusuf sagte: Der Termin ist um fünf Uhr.'
