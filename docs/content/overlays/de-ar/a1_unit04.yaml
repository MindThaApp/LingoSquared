    title: Mai
    gloss: Mai
    note: مايو (māyū) ist der Name für den Mai in Ägypten und weiten Teilen der arabischen Welt; im Libanon, in Syrien, Jordanien und im Irak heißt derselbe Monat أيار (ayyār).
