    title: Nour und Layla kaufen Rosen
    gloss: Nour und Layla gehen am Samstag zum Blumenmarkt. Welche Farbe möchte Layla? Layla hätte gern Rot. Welche Farbe möchte Nour? Nour hätte gern Gelb. Sie kaufen fünf Rosen. Es kostet zehn Dirham. Die Rosen sind sehr schön!
    note: 'Ein kurzer Text über den Marktbesuch. Eine Farbe richtet sich nach dem, was sie beschreibt: الأحمر (al-aḥmar) ist die Farbe selbst, aber الورود حمراء (al-wurūd ḥamrāʾ) steht im Femininum für „die Rosen“.'
