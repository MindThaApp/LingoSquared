    title: Größer
    gloss: größer
    note: أكبر (akbar) kommt von كبير (kabīr, groß). Vergleichswörter wie أكبر, أصغر, أقرب und أرخص beginnen alle mit أ und haben für maskuline und feminine Nomen dieselbe Form.
    example_gloss: Der Markt ist größer als das Café.
  ar.a1.unit15.lesson01.teach.smaller:
