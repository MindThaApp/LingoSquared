  ar.a1.unit15.lesson02.teach.line01:
    title: Nach einer Vorliebe fragen
    gloss: Layla fragt, was Yusuf bevorzugt.
    note: 'Layla sagt تفضل (tufaḍḍil), weil sie einen Mann fragt; zu einer Frau sagt man: ماذا تفضلين؟'
    example_gloss: 'Layla sagte: Was bevorzugst du?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Das Café bevorzugen
    gloss: Yusuf sagt, dass er das Café bevorzugt.
    note: Nach أفضل kann ein Ort als bevorzugte Wahl stehen.
    example_gloss: 'Yusuf sagte: Ich bevorzuge das Café.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Entfernung vergleichen
    gloss: Yusuf sagt, dass das Café näher ist als der Markt.
    note: أقرب من nennt den Grund.
    example_gloss: 'Yusuf sagte: Das Café ist näher als der Markt.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Größe vergleichen
    gloss: Nour fügt hinzu, dass der Markt größer ist als das Café.
    note: 'والسوق (was-sūq) ist و („und“), mit السوق verbunden: und der Markt.'
    example_gloss: 'Nour sagte: Und der Markt ist größer als das Café.'
