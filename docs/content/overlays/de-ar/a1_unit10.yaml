  ar.a1.unit10.lesson01.teach.right:
    title: Rechts
    gloss: rechts (Richtung)
    note: يمين (yamīn) bezeichnet die rechte Seite; اليمين (al-yamīn) heißt „das Rechte“, „die rechte Seite“.
    example_gloss: Nach rechts.
  ar.a1.unit10.lesson01.teach.left:
    title: Links
    gloss: links (Richtung)
    note: يسار (yasār) bezeichnet die linke Seite; اليسار (al-yasār) heißt „das Linke“, „die linke Seite“.
    example_gloss: Nach links.
  ar.a1.unit10.lesson01.teach.forward:
    title: Geradeaus
    gloss: geradeaus
    note: إلى الأمام (ilā l-amām) bedeutet wörtlich „nach vorn“; so sagt man üblicherweise „geradeaus“ oder „vorwärts“.
    example_gloss: Die Bibliothek ist geradeaus.
  ar.a1.unit10.lesson01.teach.to_right:
    title: Nach rechts
    gloss: nach rechts
    note: إلى (ilā) drückt die Bewegung zu einer Richtung oder einem Ort hin aus.
    example_gloss: Der Markt ist rechts.
  ar.a1.unit10.lesson02.teach.walk:
    title: Gehen
    gloss: geh / gehen
    note: امش (imshi) ist der Befehl „Geh!“ an einen Mann; an eine Frau gerichtet heißt es امشي (imshī). Es ist das übliche Verb, um Wegbeschreibungen zu Fuß zu geben.
    example_gloss: Geh geradeaus.
  ar.a1.unit10.lesson02.teach.then:
    title: Dann
    gloss: dann
    note: ثم (thumma) verbindet zwei Schritte einer Route in der richtigen Reihenfolge.
    example_gloss: Geh geradeaus, dann nach rechts.
  ar.a1.unit10.lesson02.teach.route:
    title: Zwei Wegschritte
    gloss: Geh geradeaus, dann nach rechts
    note: Erster Schritt + ثم + zweiter Schritt. Das Verb wird nach ثم nicht wiederholt.
    example_gloss: 'Layla sagte: Geh geradeaus, dann nach rechts.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Nach der Bibliothek fragen
    gloss: Yusuf fragt, wo die Bibliothek ist.
    note: أين المكتبة؟ kam bereits bei den Orten vor.
    example_gloss: 'Yusuf sagte: Wo ist die Bibliothek?'
  ar.a1.unit10.lesson02.teach.line02:
    title: Den Weg beschreiben
    gloss: Layla nennt zwei einfache Wegschritte.
    note: Layla sagt امش, weil sie mit einem Mann spricht; zu einer Frau würde sie امشي sagen.
    example_gloss: 'Layla sagte: Geh geradeaus, dann nach rechts.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Sich bedanken
    gloss: Yusuf bedankt sich.
    note: شكرا beendet das Gespräch, in dem man Hilfe erhalten hat, höflich.
    example_gloss: 'Yusuf sagte: Danke.'
  ar.a1.unit10.lesson02.teach.line04:
    title: Den Ort bestätigen
    gloss: Layla sagt, dass die Bibliothek in der Nähe des Marktes ist.
    note: 'Hier kommt قرب aus der Einheit über Orte wieder vor: Die Bibliothek ist in der Nähe des Marktes.'
    example_gloss: 'Layla sagte: Die Bibliothek ist in der Nähe des Marktes.'
