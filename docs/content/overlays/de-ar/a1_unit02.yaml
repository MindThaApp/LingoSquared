teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Wie heißen Sie?
    gloss: Wie heißen Sie?
    note: ما اسمك؟ (mā ismuk) ist die übliche Art, nach dem Namen zu fragen; ohne Vokalzeichen geschrieben, passt die Form für jeden Gesprächspartner.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Mein Name ist
    gloss: mein Name [ist]
    note: اسمي (ismī) setzt sich aus اسم („Name“) und der Possessivendung ـي („mein“) zusammen.
    example_gloss: Ich heiße Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: ich
    gloss: ich
    note: أنا (anā) ist das selbstständige Pronomen für „ich“. Arabische Verben kennzeichnen die Person zwar auch selbst, aber أنا steht zur Betonung und in einfachen Nominalsätzen wie diesem.
    example_gloss: Ich bin Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Schön, dich kennenzulernen
    gloss: freut mich
    note: تشرفنا (tasharrafnā), wörtlich „wir sind geehrt“, ist die übliche gegenseitige Antwort beim Kennenlernen – beide können es zuerst sagen.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: Woher kommst du?
    gloss: Woher kommen Sie?
    note: من أين أنت؟ (min ayna anta zu einem Mann, min ayna anti zu einer Frau) fragt nach der Herkunft; in der unvokalisierten Schreibweise sind beide Formen gleich.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Ich komme aus
    gloss: Ich komme aus
    note: Auf أنا من (anā min) folgt direkt der Name eines Landes oder einer Stadt.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Libanon
    gloss: Libanon
    note: لبنان (lubnān) hat keinen bestimmten Artikel, anders als die meisten anderen Länder in dieser Lektion.
    example_gloss: Ich komme aus dem Libanon.
  ar.a1.unit02.lesson02.teach.misr:
    title: Ägypten
    gloss: Ägypten
    note: مصر (miṣr) hat ebenfalls keinen bestimmten Artikel.
    example_gloss: Ich komme aus Ägypten.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Jordanien
    gloss: Jordanien
    note: الأردن (al-ʾurdun) trägt den bestimmten Artikel الـ immer als Teil des Namens, ebenso wie المغرب und العراق in dieser Lektion.
    example_gloss: Ich komme aus Jordanien.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Marokko
    gloss: Marokko
    note: المغرب (al-maghrib) bedeutet wörtlich „der Westen“ – von derselben Wurzel wie die Zeit des Abendgebets bei Sonnenuntergang.
    example_gloss: Ich komme aus Marokko.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Syrien
    gloss: Syrien
    note: سوريا (sūryā) hat keinen bestimmten Artikel.
    example_gloss: Ich komme aus Syrien.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) trägt den bestimmten Artikel.
    example_gloss: Ich komme aus dem Irak.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Kommst du aus …?
    gloss: Kommst du aus Ägypten?
    note: هل (hal) ist ein Fragewort für Ja-Nein-Fragen am Satzanfang; es hat selbst keine eigene Bedeutung.
  ar.a1.unit02.lesson03.teach.naam:
    title: Ja
    gloss: ja
    note: نعم (naʿam) ist die übliche bejahende Antwort.
    example_gloss: Ja, ich komme aus Ägypten.
  ar.a1.unit02.lesson03.teach.laa:
    title: Nein
    gloss: nein
    note: لا (lā) ist die übliche verneinende Antwort.
    example_gloss: Nein, ich komme aus dem Libanon.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Es hat mich gefreut, dich kennenzulernen
    gloss: Es hat mich gefreut, dich kennenzulernen
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) ist eine herzlichere Abschlussformel als تشرفنا und wird oft kurz vor dem Abschied gesagt.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Willkommen bei dir
    gloss: willkommen / du bist hier willkommen
    note: 'مرحبا بك (marḥaban bik) fügt بك hinzu, „dir“: die Präposition بـ mit dem angehängten Pronomen ـك (du) – dasselbe بك wie in أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Begrüßung zu Beginn
    gloss: Yusuf begrüßt Layla.
    note: Das Gespräch beginnt mit einem einfachen مرحبا, bevor Namen genannt werden.
  ar.a1.unit02.lesson04.teach.line02:
    title: Begrüßung zu Beginn, Antwort
    gloss: Layla grüßt zurück.
    note: Dasselbe Wort مرحبا passt für beide Seiten einer Begrüßung.
  ar.a1.unit02.lesson04.teach.line03:
    title: Nach dem Namen fragen
    gloss: Yusuf fragt sie nach ihrem Namen.
    note: ما اسمك؟ eröffnet die Vorstellung.
  ar.a1.unit02.lesson04.teach.line04:
    title: Nach dem Namen fragen, Antwort
    gloss: Layla antwortet und fragt ihn zurück.
    note: وأنت؟ greift die Frage wieder auf, statt den ganzen Satz zu wiederholen – eine gängige Abkürzung.
  ar.a1.unit02.lesson04.teach.line05:
    title: Antwort und gegenseitige Freude
    gloss: Yusuf nennt seinen Namen und sagt, dass er sich freut, sie kennenzulernen.
    note: تشرفنا beschließt den Austausch der Namen.
  ar.a1.unit02.lesson04.teach.line06:
    title: Gegenseitige Freude, Antwort
    gloss: Layla gibt dieselbe Formel zurück.
    note: تشرفنا sagen ganz selbstverständlich beide, nicht nur einer.
  ar.a1.unit02.lesson04.teach.line07:
    title: Nach der Herkunft fragen
    gloss: Yusuf fragt, woher sie kommt.
    note: من أين أنت؟ lenkt das Gespräch auf die Herkunft.
  ar.a1.unit02.lesson04.teach.line08:
    title: Nach der Herkunft fragen, Antwort
    gloss: Layla antwortet und fragt ihn zurück.
    note: Sie benutzt wieder وأنت؟, dieselbe Abkürzung wie zuvor.
  ar.a1.unit02.lesson04.teach.line09:
    title: Die Herkunft nennen
    gloss: Yusuf sagt, dass er aus dem Libanon kommt.
    note: أنا من لبنان folgt demselben Muster wie in dieser Lektion gelernt.
  ar.a1.unit02.lesson04.teach.line10:
    title: Das Gespräch beenden
    gloss: Layla sagt, dass es sie gefreut hat, ihn kennenzulernen.
    note: سعدت بلقائك zeigt, dass das Gespräch langsam zu Ende geht.
  ar.a1.unit02.lesson04.teach.line11:
    title: Verabschiedung
    gloss: Yusuf sagt, dass sie jederzeit willkommen ist, und verabschiedet sich.
    note: دائما („immer“) macht aus مرحبا بك eine offene Einladung, bevor die Verabschiedung مع السلامة folgt.
  ar.a1.unit02.lesson04.teach.line12:
    title: Verabschiedung, Antwort
    gloss: Layla verabschiedet sich.
    note: مع السلامة beschließt das Gespräch; es wurde in a1_unit01 behandelt.
