    title: Bitte sehr
    gloss: bitte sehr
    note: تفضلي (tafaḍḍalī) sagt man zu einer Frau, wenn man ihr etwas reicht; zu einem Mann sagt man تفضل (tafaḍḍal).
    example_gloss: 'Der Kellner sagte: Bitte sehr.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Eine Bestellung aufgeben
    gloss: Layla bestellt höflich Wasser und Kaffee.
    note: Die Bitte besteht aus أريد plus den gewünschten Dingen.
    example_gloss: 'Layla sagte: Hallo. Ich möchte Wasser und Kaffee, bitte.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Nachfragen
    gloss: Der Kellner fragt, ob sie Brot möchte.
    note: هل leitet eine Ja-Nein-Frage ein.
    example_gloss: 'Der Kellner sagte: Möchten Sie Brot?'
  ar.a1.unit07.lesson02.teach.line03:
    title: Auf die Nachfrage antworten
    gloss: Layla sagt ja und bittet um ein Stück Brot.
    note: نعم ist die Antwort „ja“.
    example_gloss: 'Layla sagte: Ja, ich möchte ein Stück Brot.'
  ar.a1.unit07.lesson02.teach.line04:
    title: Die Bestellung servieren
    gloss: 'Der Kellner sagt: Bitte sehr.'
    note: تفضلي schließt den Austausch ab.
    example_gloss: 'Der Kellner sagte: Bitte sehr.'
