    example_gloss: Ich möchte Wasser, bitte.
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: Möchten Sie Brot?
    gloss: Möchten Sie Brot?
    note: تريدين (turīdīna) heißt „du möchtest“, an eine Frau gerichtet, hier an Layla; zu einem Mann sagt man تريد (turīdu).
    example_gloss: 'Der Kellner sagte: Möchten Sie Brot?'
