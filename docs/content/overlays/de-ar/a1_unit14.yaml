teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: ich mag
    gloss: ich mag
    note: أحب (uḥibbu) bedeutet ich mag. Das Arabische setzt ال (der/die/das) bei Dingen im Allgemeinen, daher heißt Ich mag Kaffee أحب القهوة, wörtlich „ich mag den Kaffee“.
    example_gloss: Ich mag Kaffee.
  ar.a1.unit14.lesson01.teach.tea:
    title: Tee
    gloss: Tee
    note: شاي (shāy) ist Tee; الشاي (ash-shāy) hat ال, wie es im Arabischen üblich ist, wenn man von Tee im Allgemeinen spricht.
    example_gloss: Ich mag keinen Tee.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Ich mag nicht
    gloss: ich mag nicht
    note: 'Im Arabischen braucht man kein Hilfsverb: Die Verneinung لا steht einfach vor أحب.'
    example_gloss: Ich mag keinen Tee.
  ar.a1.unit14.lesson01.teach.water:
    title: Wasser
    gloss: das Wasser
    note: الماء (al-māʾ) ist ماء (Wasser, aus der Lektion zum Essen) mit ال, verwendet für Wasser im Allgemeinen.
    example_gloss: Ich mag Wasser.
  ar.a1.unit14.lesson01.teach.and_not:
    title: Und nicht
    gloss: und nicht
    note: 'ولا (wa-lā) ist و (und) mit لا (nicht) verbunden: Es fügt nach etwas, das man mag, etwas hinzu, das man nicht mag.'
    example_gloss: Ich mag Kaffee und ich mag keinen Tee.
  ar.a1.unit14.lesson02.teach.prefer:
    title: ich bevorzuge
    gloss: ich ziehe vor
    note: 'أفضل (ufaḍḍilu) bedeutet ich bevorzuge: Man wählt eine Möglichkeit statt einer anderen.'
    example_gloss: Ich bevorzuge Kaffee.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Was bevorzugst du?
    gloss: Was bevorzugst du?
    note: تفضل ist hier tufaḍḍil, du bevorzugst, an einen Mann gerichtet; an eine Frau gerichtet heißt es تفضلين (tufaḍḍilīn). Es ist ein anderes Wort als تفضل (tafaḍḍal, bitte sehr) aus der Lektion zum Essen, obwohl es gleich geschrieben wird.
    example_gloss: 'Nour sagte: Was bevorzugst du, Yusuf?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour fragt
    gloss: Nour fragt Yusuf, was er bevorzugt.
    note: 'نور (Nour) ist Yusufs Schwester. Sie sagt تفضل, weil sie einen Mann fragt; zu einer Frau sagt man: ماذا تفضلين؟'
    example_gloss: 'Nour sagte: Was bevorzugst du, Yusuf?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf bevorzugt Kaffee
    gloss: Yusuf sagt, dass er Kaffee bevorzugt.
    note: أفضل wählt eine Möglichkeit vor den anderen aus; أحب sagt einfach, dass man etwas mag.
    example_gloss: 'Yusuf sagte: Ich bevorzuge Kaffee.'
  ar.a1.unit14.lesson02.teach.line03:
    title: Yusuf mag keinen Tee
    gloss: Yusuf sagt, dass er keinen Tee mag.
    note: لا أحب drückt schlicht Abneigung aus.
    example_gloss: 'Yusuf sagte: Ich mag keinen Tee.'
  ar.a1.unit14.lesson02.teach.line04:
    title: Nour mag Wasser
    gloss: Nour sagt, dass sie Wasser mag.
    note: أنا (ich) kann zur Betonung hinzugefügt werden.
    example_gloss: 'Nour sagte: Ich mag Wasser.'
