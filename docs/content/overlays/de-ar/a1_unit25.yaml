course:
  title: Arabisch A1
  description: 'Arabisch für Anfänger zum Thema Freizeitaktivitäten: Hobby-Wortschatz, Häufigkeitsausdrücke, Fragen und Antworten dazu, was jemand in seiner Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
