teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: القراءة (al-qirāʾa) heißt das Lesen, ممارسة الرياضة (mumārasat ar-riyāḍa) heißt Sport treiben und الطبخ (aṭ-ṭabkh) heißt das Kochen. Jedes davon ist ein Nomen, daher ist der Artikel ال angehängt.
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Freizeit
    gloss: Freizeit
    note: وقت الفراغ (waqt al-farāgh) heißt wörtlich „die Zeit der Leere“. Das erste Wort hat kein ال; nur das zweite Wort bekommt es.
    example_gloss: In meiner Freizeit lese ich gern.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: أحب (uḥibb) heißt ich mag und ist für Mann und Frau gleich. Das ي am Ende von فراغي (farāghī) bedeutet mein.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) heißt Musik hören, الرسم (ar-rasm) heißt zeichnen und لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) heißt Videospiele spielen.
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: 'الاستماع (al-istimāʿ) braucht إلى (ilā, zu) vor dem, was man hört: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: 'مع (maʿa) heißt mit: مع الأصدقاء (maʿa al-aṣdiqāʾ). Der Artikel ال bleibt an الأصدقاء angehängt.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) und أبدا (abadan) sind Adverbien und verändern sich deshalb nie nach Geschlecht. Das letzte ا (Alif) wird ohne Zeichen geschrieben.
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: كل أسبوع (kull usbūʿ) und كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) verwenden beide كل (kull, jeder/jede); siehe die nächste Karte.
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Jeder/Jede: كل'
    gloss: 'Nach كل (kull, jeder/jede) steht das Nomen im Singular und ohne ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) verändert sich nie: Dasselbe Wort steht vor einem maskulinen Nomen wie أسبوع und vor einem femininen wie عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla spricht das Thema Hobbys an
    gloss: 'Layla: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Yusuf?'
    note: Der Anfangsbuchstabe ن (na-) bei نتمشى (natamashshā) bedeutet wir, daher braucht das Arabische kein eigenes Wort für „wir“. معا (maʿan) heißt zusammen.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Yusufs Hobbys
    gloss: 'Yusuf: Ich koche gern, auch zu Hause. Und ich treibe viel Sport.'
    note: في البيت أيضا (fī al-bayt ayḍan) bedeutet „auch zu Hause“. وأمارس (wa-umāris) verbindet و („und“) mit dem Verb und wird zusammengeschrieben.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla ist überrascht
    gloss: 'Layla: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: تطبخ (taṭbukh) ist die Form für „du“ bei einem Mann; zu einer Frau sagt man تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) bedeutet „den ganzen Tag lang“.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf erklärt
    gloss: 'Yusuf: Ja, aber ich finde Kochen entspannend. Und du, was machst du gern?'
    note: 'أجد (ajid) bedeutet „ich finde“ und مريحا (murīḥan) „entspannend“. وأنت (wa-anta) verbindet و mit أنت: „und du“.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Laylas Hobbys
    gloss: 'Layla: Ich lese gern und höre oft Musik.'
    note: 'و verbindet die beiden Hobbys: أحب القراءة (uḥibb al-qirāʾa) und وأستمع (wa-astamiʿ, „und ich höre“). Es wird an das folgende Wort angeschrieben.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf fragt nach Videospielen
    gloss: 'Yusuf: Spielst du auch Videospiele?'
    note: تلعبين (talʿabīn) ist die Form für „du“ bei einer Frau, denn Yusuf fragt Layla; bei einem Mann heißt es تلعب (talʿab). هل (hal) leitet eine Ja-Nein-Frage ein.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla antwortet
    gloss: 'Layla: Nein, ich spiele nie Videospiele. Aber ich zeichne manchmal!'
    note: 'أبدا (abadan) bedeutet „nie“ und أحيانا (aḥyānan) „manchmal“. Das Verb wird mit لا (lā) verneint: لا ألعب (lā alʿab) heißt „ich spiele nicht“.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Hobbys im Vergleich
    gloss: Yusuf und ich gehen oft zusammen spazieren. Aber wir haben auch noch andere Hobbys. Yusuf kocht gern, auch zu Hause, und treibt viel Sport. Ich lese gern und höre oft Musik. Manchmal zeichne ich, aber Videospiele spiele ich nie. Was machst du gern in deiner Freizeit?
    note: Laylas Nachricht fasst Bekanntes aus der Einheit zusammen und endet mit der Kernfrage der Einheit an die Leserin oder den Leser.
    glosses:
      نتمشى: spazieren gehen
      كثيرا: oft
      معا: zusammen
      أخرى: andere
      يطبخ: kocht
      يحب: mag
      البيت: das Haus (zu Hause)
      ويمارس: macht Sport
      أقرأ: lesen
      وأستمع: hören
      الموسيقى: Musik
      أرسم: zeichne
      أحيانا: manchmal
      ألعب: spielen (Videospiele)
      أبدا: nie
      فراغك: deine freie (Zeit)
      وقت: Zeit
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf fragt nach dem Wochenende
    gloss: 'Yusuf: Was machst du dieses Wochenende?'
    note: 'ستفعلين (sa-tafʿalīn) steht im Futur: Der Anfangsbuchstabe س (sa-) markiert es, die Endung ين steht für eine Frau. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) bedeutet „Wochenende“.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla ist unentschlossen
    gloss: 'Layla: Ich weiß noch nicht. Ich lese gern, aber ich möchte auch rausgehen.'
    note: لا أعرف بعد (lā aʿrif baʿd) bedeutet „ich weiß noch nicht“. أن أخرج (an akhruj) bedeutet „auszugehen / rauszugehen“.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf macht einen Vorschlag
    gloss: 'Yusuf: Sollen wir zusammen spazieren gehen? Danach koche ich für uns.'
    note: 'هل نتمشى (hal natamashshā) ist die übliche Art, etwas gemeinsam vorzuschlagen: هل + Verb in der „wir“-Form. لنا (lanā) besteht aus ل („für“) + نا („uns“) und wird zusammengeschrieben.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla stimmt zu
    gloss: 'Layla: Gute Idee! Ich mag Spazierengehen und Kochen beides.'
    note: 'كليهما (kilayhimā) bedeutet „beide“ und steht am Ende; es bezieht sich auf die zwei Dinge: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf bestätigt
    gloss: 'Yusuf: Perfekt. Dann sehen wir uns am Samstag!'
    note: يوم السبت (yawm as-sabt) bedeutet „am Samstag“. Das ل von ال wird vor س, einem Sonnenbuchstaben, nicht gesprochen; deshalb schreiben wir as-sabt.
