  ar.a1.unit17.lesson01.teach.pain:
    title: Schmerz
    gloss: Schmerz
    note: ألم (alam) bedeutet Schmerz; عندي ألم (ʿindī alam) heißt „Ich habe Schmerzen“.
    example_gloss: Ich habe Schmerzen.
  ar.a1.unit17.lesson01.teach.head:
    title: Kopf
    gloss: der Kopf
    note: الرأس (ar-raʾs) ist der Kopf. Auf Arabisch sagt man عندي ألم في الرأس, wörtlich „ein Schmerz im Kopf“, während man im Deutschen meist „Ich habe Kopfschmerzen“ als ein Wort sagt.
    example_gloss: Ich habe Schmerzen im Kopf.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Magen
    gloss: der Bauch
    note: البطن (al-baṭn) bezeichnet den Bauch bzw. die Magengegend.
    example_gloss: Ich habe Schmerzen im Bauch.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Schmerzen im Kopf
    gloss: Ich habe Kopfschmerzen
    note: عندي ألم, wörtlich „bei mir (ist) Schmerz“, ist die arabische Art zu sagen „Ich habe Schmerzen“; في + Körperteil gibt an, wo.
    example_gloss: 'Layla sagte: Ich habe Kopfschmerzen.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Was ist das Problem?
    gloss: Was ist das Problem?
    note: ما (mā) fragt „was“; المشكلة (al-mushkila) bedeutet „das Problem“.
    example_gloss: Was ist das Problem, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Wasser trinken
    gloss: trink Wasser
    note: اشربي (ishrabī) ist der Befehl „Trink!“ an eine Frau, hier Layla; an einen Mann gerichtet heißt es اشرب (ishrab).
    example_gloss: 'Yusuf sagte: Trink Wasser.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Ruhe
    gloss: ruhen Sie sich aus
    note: استريحي (istarīḥī) ist der Befehl „Ruh dich aus!“ an eine Frau; an einen Mann gerichtet heißt es استرح (istariḥ).
    example_gloss: Ruh dich heute aus.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Ich brauche Hilfe
    gloss: Ich brauche Hilfe
    note: أحتاج (aḥtāj) bedeutet „ich brauche“ und مساعدة (musāʿada) „Hilfe“. Sie werden auch أحتاج إلى مساعدة mit إلى begegnen; beides ist richtig.
    example_gloss: Ich habe Schmerzen. Ich brauche Hilfe.
  ar.a1.unit17.lesson02.teach.line01:
    title: Nach dem Problem fragen
    gloss: Yusuf fragt Layla, was das Problem ist.
    note: يا ليلى spricht Layla mit Namen an.
    example_gloss: 'Yusuf sagte: Was ist das Problem, Layla?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Das Symptom nennen
    gloss: Layla sagt, dass sie Kopfschmerzen hat.
    note: Das Symptom wird direkt genannt.
    example_gloss: 'Layla sagte: Ich habe Kopfschmerzen.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Ein einfacher Rat
    gloss: Yusuf rät Layla, Wasser zu trinken und sich auszuruhen.
    note: 'Beide Befehle stehen in der weiblichen Form, weil Yusuf zu Layla spricht; و (wa, „und“) wird mit dem nächsten Wort zusammengeschrieben: واستريحي.'
    example_gloss: 'Yusuf sagte: Trink Wasser und ruh dich aus.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Danke
    gloss: Layla sagt danke.
    note: شكرا beschließt den kurzen Austausch.
    example_gloss: 'Layla sagte: Danke.'
