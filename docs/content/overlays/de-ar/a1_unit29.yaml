    title: Das Verb ändert sich mit der Person
    gloss: 'Das Verb verändert sich mit der Person: أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī) – „Ich fahre mit dem Fahrrad zur Arbeit“, يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi) – „Yusuf fährt mit dem Fahrrad zu seiner Arbeit“.'
    note: Der Anfangsbuchstabe أ (a-) steht für „ich“, ي (ya-) für „er“. Die Endung ي an عملي bedeutet „mein“, die Endung ه an عمله bedeutet „sein“.
