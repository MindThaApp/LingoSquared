  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Wer fährt wie?
    gloss: Layla fährt jeden Tag mit dem Zug zur Arbeit. Yusuf fährt meistens mit dem Fahrrad, aber wenn es regnet, nimmt er auch den Zug. Karim fährt lieber mit dem Auto. Sara wohnt in der Nähe und geht zu Fuß zur Arbeit. Wie kommen Sie zur Arbeit?
    note: Die Verben der Frauen (تسافر, تسكن, تمشي) beginnen mit ت (ta-), die Verben der Männer (يركب, يذهب, يقود, يفضل) beginnen mit ي (ya-).
    glosses:
      تسافر: reist, fährt
      كل: jeder
      يوم: Tag
      بالقطار: mit dem Zug
      عملها: arbeiten
      يركب: fährt Rad
      غالبا: normalerweise
      أمطرت: regnet
      يذهب: nimmt
      يقود: fährt Auto
      يفضل: bevorzugt, zieht vor
      السيارة: das Auto
      تسكن: wohnt
      قريبا: in der Nähe
      وتمشي: geht zu Fuß
      تذهب: reist, fährst
