teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Haus
    gloss: Haus
    note: بيت (bayt) ist ein Haus; die Endung ـي bedeutet „mein“, also ist بيتي (baytī) „mein Haus“.
    example_gloss: Mein Haus ist in der Nähe der Bibliothek.
  ar.a1.unit19.lesson01.teach.room:
    title: Zimmer
    gloss: Zimmer
    note: غرفة (ghurfa) ist feminin (sie endet auf ة), deshalb folgt die feminine Form واحدة.
    example_gloss: In meinem Haus gibt es ein Zimmer.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Küche
    gloss: Küche
    note: 'مطبخ (maṭbakh) ist eine Küche. Arabisch hat hier kein Wort für „es gibt“: Der Beginn mit في بيتي („in meinem Haus“) übernimmt diese Aufgabe.'
    example_gloss: In meinem Haus gibt es eine Küche.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Ein Zimmer
    gloss: ein Zimmer
    note: 'Die Zahl „eins“ steht nach dem Nomen und richtet sich nach ihm: غرفة واحدة (ghurfa wāḥida); bei einem maskulinen Nomen heißt es واحد.'
    example_gloss: In meinem Haus gibt es ein Zimmer.
  ar.a1.unit19.lesson02.teach.table:
    title: Tisch
    gloss: Tisch
    note: طاولة (ṭāwila) ist ein Tisch; wie غرفة endet das Wort auf ة und ist feminin.
    example_gloss: Ich habe einen Tisch im Zimmer.
  ar.a1.unit19.lesson02.teach.in_room:
    title: Im Zimmer
    gloss: im Zimmer
    note: الغرفة (al-ghurfa) bedeutet „das Zimmer“.
    example_gloss: Der Tisch ist im Zimmer.
  ar.a1.unit19.lesson02.teach.near_library:
    title: In der Nähe der Bibliothek
    gloss: in der Nähe der Bibliothek
    note: قرب (qurb) bedeutet „nahe“; المكتبة ist die Bibliothek aus der Lektion über Orte.
    example_gloss: Mein Haus ist in der Nähe der Bibliothek.
  ar.a1.unit19.lesson02.teach.line01:
    title: Nach dem Ort fragen
    gloss: Layla fragt, wo Yusufs Haus ist.
    note: أين fragt nach dem Ort („wo“); بيتك (baytuka) heißt „dein Haus“, an einen Mann gerichtet; an eine Frau heißt es baytuki, geschrieben ist es gleich.
    example_gloss: 'Layla sagte: Wo ist dein Haus, Yusuf?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Lage des Hauses
    gloss: Yusuf sagt, dass sein Haus in der Nähe der Bibliothek ist.
    note: بيتي bedeutet „mein Haus“.
    example_gloss: 'Yusuf sagte: Mein Haus ist in der Nähe der Bibliothek.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Zimmer
    gloss: Yusuf sagt, dass sein Haus ein Zimmer und eine Küche hat.
    note: 'و (wa, „und“) verbindet die beiden Teile des Hauses und wird mit dem folgenden Wort zusammengeschrieben: ومطبخ.'
    example_gloss: 'Yusuf sagte: In meinem Haus gibt es ein Zimmer und eine Küche.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Nach einem Gegenstand fragen
    gloss: Layla fragt, ob Yusuf einen Tisch hat.
    note: هل leitet eine Ja-Nein-Frage ein; عندك (ʿindaka) heißt „du hast“, an einen Mann gerichtet; an eine Frau heißt es ʿindaki, geschrieben ist es gleich.
    example_gloss: 'Layla sagte: Hast du einen Tisch?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Ort des Gegenstands
    gloss: Yusuf sagt, dass er einen Tisch im Zimmer hat.
    note: عندي drückt Besitz aus.
    example_gloss: 'Yusuf sagte: Ja, ich habe einen Tisch im Zimmer.'
