  ar.a1.unit21.lesson01.teach.clothes:
    title: Kleidung
    gloss: Kleidung
    note: ملابس (malābis) ist ein Pluralnomen und bedeutet „Kleidung“.
    example_gloss: Ich möchte Kleidung.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Hemd
    gloss: Hemd
    note: 'قميص (qamīṣ) bedeutet „Hemd“; nach أريد steht es im Akkusativ mit der Endung -an: قميصا (qamīṣan).'
    example_gloss: Ich möchte ein Hemd.
  ar.a1.unit21.lesson01.teach.blue:
    title: Blau
    gloss: blau
    note: 'أزرق (azraq) ist die maskuline Form passend zu قميص; bei einem femininen Nomen heißt es زرقاء (zarqāʾ). Nach أريد bekommt أزرق kein zusätzliches Alif: قميصا أزرق.'
    example_gloss: Ich möchte ein blaues Hemd.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Ein blaues Hemd
    gloss: ein blaues Hemd
    note: 'Im Arabischen steht die Farbe nach dem Gegenstand: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Ich möchte ein blaues Hemd.
  ar.a1.unit21.lesson02.teach.size:
    title: Größe
    gloss: die Größe
    note: مقاس (maqās) bedeutet „Größe“; ما المقاس؟ (mā l-maqās) fragt nach der Größe.
    example_gloss: Welche Größe?
  ar.a1.unit21.lesson02.teach.medium:
    title: Mittlere Größe
    gloss: mittlere Größe
    note: 'متوسط (mutawassiṭ) bedeutet „mittel“; mit بـ (bi-, „in“) wird es an einen Gegenstand angeschlossen: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), ein Hemd in mittlerer Größe.'
    example_gloss: Ich möchte ein Hemd in mittlerer Größe.
  ar.a1.unit21.lesson02.teach.price:
    title: Zehn Dirham
    gloss: zehn Dirham
    note: 'بعشرة (bi-ʿashara) bedeutet „für zehn“: Das Präfix بـ kennzeichnet den Preis, wie in der Einheit zum Einkaufen.'
    example_gloss: Das Hemd kostet zehn Dirham.
  ar.a1.unit21.lesson02.teach.line01:
    title: Um einen Artikel bitten
    gloss: Layla bittet um ein blaues Hemd.
    note: من فضلك macht die Bitte höflich.
    example_gloss: 'Layla sagte: Ich möchte ein blaues Hemd, bitte.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Nach der Größe fragen
    gloss: Der Verkäufer fragt nach der Größe.
    note: 'Der Verkäufer fragt nach der Größe: ما المقاس؟'
    example_gloss: 'Der Verkäufer sagte: Welche Größe?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Die Größe nennen
    gloss: 'Layla sagt: mittlere Größe.'
    note: Das ist die direkte Antwort auf die Frage nach der Größe.
    example_gloss: 'Layla sagte: Mittlere Größe.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Artikel und Preis nennen
    gloss: Der Verkäufer gibt das Hemd und nennt den Preis.
    note: 'تفضلي (tafaḍḍalī) sagt man zu einer Frau, wenn man ihr etwas reicht; zu einem Mann sagt man: تفضل (tafaḍḍal).'
    example_gloss: 'Der Verkäufer sagte: Bitte sehr. Das Hemd kostet zehn Dirham.'
