  ar.a1.unit06.lesson01.teach.i_have:
    title: Ich habe
    gloss: ich habe
    note: عندي (ʿindī, wörtlich „bei mir“) ist die einfache Art auf A1-Niveau, auszudrücken, dass man etwas hat; لدي (ladayya) ist eine formellere Entsprechung.
    example_gloss: Ich habe eine Schwester.
  ar.a1.unit06.lesson02.teach.in_family:
    title: In deiner Familie
    gloss: in deiner Familie
    note: 'Hier ist من man, „wer“, nicht min, „aus“, wie in من أين أنت؟ – beide werden gleich geschrieben. عائلتك bedeutet „deine Familie“: ʿāʾilatuka zu einem Mann, ʿāʾilatuki zu einer Frau.'
    example_gloss: Wer gehört zu deiner Familie?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Sie heißt Nour
    gloss: sie heißt Nour
    note: اسمها bedeutet „ihr Name“.
    example_gloss: 'Yusuf sagte: Sie heißt Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Nach der Familie fragen
    gloss: Layla fragt, wer zu Yusufs Familie gehört.
    note: من (man) bedeutet hier „wer“. يا يوسف spricht Yusuf mit Namen an.
    example_gloss: 'Layla sagte: Wer gehört zu deiner Familie, Yusuf?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Die Familie beschreiben
    gloss: Yusuf sagt, dass er einen Vater, eine Mutter und eine Schwester hat.
    note: و verbindet die Familienmitglieder.
    example_gloss: 'Yusuf sagte: Ich habe einen Vater, eine Mutter und eine Schwester.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Nach dem Namen der Schwester fragen
    gloss: Layla fragt nach dem Namen seiner Schwester.
    note: 'أختك bedeutet „deine Schwester“: ukhtuka zu einem Mann, ukhtuki zu einer Frau. Hier fragt Layla Yusuf, also ukhtuka.'
    example_gloss: 'Layla sagte: Wie heißt deine Schwester?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Ihren Namen nennen
    gloss: Yusuf sagt, dass sie Nour heißt.
    note: 'Die Endung ـها bedeutet „ihr“: اسمها (ismuhā), „ihr Name“.'
    example_gloss: 'Yusuf sagte: Sie heißt Nour.'
