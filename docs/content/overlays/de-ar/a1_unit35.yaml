    gloss: 'Layla: Toll! Danke, auf Wiedersehen!'
  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Layla schickt ein Paket
    gloss: Layla hat ein Paket für ihren Opa und ihre Oma in Beirut. Sie kauft auf der Post eine Briefmarke. Sie schreibt die Adresse auf das Paket. Das Paket kommt morgen bei ihnen an. Der Brief braucht drei Tage.
    note: 'Ein kurzer Text über das Paket. Ein Verb richtet sich nach seinem Subjekt: الطرد يصل (aṭ-ṭard yaṣil) bei einem maskulinen Nomen, aber ليلى تشتري (Layla tashtarī) bei einer Frau.'
    glosses:
      طرد: Paket
      لجدها: für ihren Opa
      وجدتها: und ihre Oma
      تشتري: kauft
      طابعا: Briefmarke
      البريد: Post (die Briefpost)
      تكتب: schreibt
      العنوان: Adresse
      يصل: kommt an (maskulines Verb)
      غدا: morgen
      إليهما: zu ihnen (den beiden); das Verb plus dieses Wort bedeutet „kommt bei ihnen an“
      الرسالة: Brief
      تستغرق: braucht (eine Zeitspanne)
      ثلاثة: drei
      أيام: Tage
  ar.a1.unit35.lesson05.teach.lyla_trsl_trda:
