    title: Das Verb richtet sich nach dem Nomen
    gloss: Das Paket ist maskulin, deshalb sagt man يصل (yaṣil). Der Brief ist feminin, deshalb sagt man تصل (taṣil).
    note: Ein Verb im Präsens beginnt bei einem maskulinen Subjekt mit ي und bei einem femininen mit ت, wie in الطرد يصل (aṭ-ṭard yaṣil) und الرسالة تصل (ar-risāla taṣil).
