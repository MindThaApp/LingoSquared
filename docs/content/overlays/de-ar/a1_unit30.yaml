course:
  title: Arabisch A1
  description: 'Arabisch für Anfänger zum Thema Technik: Telefon, Computer und Internet benennen, Nachrichten über eine App senden und lesen, online etwas nachschlagen und all das nutzen, um mit Freunden einen echten Plan zu machen.'
