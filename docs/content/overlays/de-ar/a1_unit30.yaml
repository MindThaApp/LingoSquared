  ar.a1.unit30.lesson01.teach.astkhdm_hatfy_kl:
    title: Ich benutze mein Handy jeden Tag
    gloss: Ich benutze mein Handy jeden Tag.
    note: أستخدم (astakhdim) bedeutet ich benutze. Das ي am Ende von هاتفي bedeutet mein.
  ar.a1.unit30.lesson02.teach.alttbyq:
    title: Die App
    gloss: die App
    example_gloss: Ich habe eine App für die Wettervorhersage.
  ar.a1.unit30.lesson02.teach.alrsala:
    title: Die Nachricht
    gloss: die Nachricht
    example_gloss: Ich schicke eine Nachricht über die App.
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Nachricht: senden und lesen'
    gloss: رسالة (risāla) bedeutet eine Nachricht, die man sendet (أرسل رسالة, ursil risāla) oder liest (أقرأ رسالة, aqraʾ risāla).
    note: Verknüpft das neue Wort mit dem Text zur Wettervorhersage und mit den Nachrichten, die Menschen senden und lesen.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla sendet eine Nachricht über die App
    gloss: Layla sendet eine Nachricht über die App.
    note: 'ترسل (tursil) bedeutet sie sendet: Der Anfangsbuchstabe ت (ta-) steht für sie. عبر (ʿabra) bedeutet durch oder über.'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf liest die Nachricht
    gloss: Yusuf liest die Nachricht.
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: Nachschlagen
    gloss: nachschauen; suchen
    example_gloss: Ich schaue die Wettervorhersage nach.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Ein Verb mit عن
    gloss: 'Auf das Verb أبحث (abḥath) folgt عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). Dagegen nimmt أستخدم (astakhdim) sein Objekt direkt: أستخدم هاتفي.'
    note: عن (ʿan) bedeutet über oder nach. Jedes arabische Verb hat seine eigene Präposition, lernen Sie sie also gemeinsam.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim schlägt die Wettervorhersage nach
    gloss: Karim schlägt die Wettervorhersage nach.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Danach geht er joggen
    gloss: Danach geht er joggen.
    note: 'ثم (thumma) bedeutet dann und ist ein eigenes Wort, anders als و. يذهب للركض (yadhhab li-r-rakḍ) bedeutet er geht joggen: ل + الركض wird zu للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla macht einen Vorschlag
    gloss: 'Layla: Sollen wir am Samstag um zehn Uhr Sport machen?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf stimmt zu
    gloss: 'Yusuf: Gute Idee! Ich schlage die Wettervorhersage nach.'
    note: 'فكرة جيدة (fikra jayyida): Das Adjektiv جيدة endet wie das Nomen auf ة, weil beide feminin sind. سأبحث (sa-abḥath) ist das Futur: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf prüft das Wetter
    gloss: 'Yusuf: Am Samstag ist es sonnig!'
    note: الجو مشمس (al-jaww mushmis) bedeutet das Wetter ist sonnig, ganz ohne Wort für ist. مشمس ist maskulin, passend zu الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim sieht die Nachricht
    gloss: 'Karim: Ich sehe die Nachricht. Bis Samstag!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + ein Tag
    gloss: 'Sie kennen إلى اللقاء (ilā al-liqāʾ, auf Wiedersehen). Man kann einen Tag hinzufügen: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Wer nutzt was?
    gloss: Layla ruft Yusuf jeden Tag an. Sie benutzt ihr Telefon, keine App. Yusuf hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Telefon. Karim schlägt jeden Morgen die Wettervorhersage nach. Dann geht er joggen. Sara schickt Layla oft eine Nachricht. Benutzt du dein Telefon auch jeden Tag?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
    glosses:
      تتصل: ruft an
      كل: jeder
      يوم: Tag
      تستخدم: benutzt
      هاتفها: Handy
      تطبيقا: App
      حاسوب: Computer
      البيت: zu Hause
      الإنترنت: Internet
      يبحث: schaut nach
      صباح: der Morgen
      توقعات: Vorhersage (Wettervorhersage)
      يذهب: geht
      للركض: zum Laufen
      ترسل: schickt
      كثيرا: oft
      رسالة: Nachricht
      تستعمل: benutze
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim schlägt jeden Morgen die Vorhersage nach
    gloss: Karim schlägt jeden Morgen die Wettervorhersage nach.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Sara schreibt Layla oft
    gloss: Sara schickt Layla oft eine Nachricht.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Layla bestätigt den Plan
    gloss: 'Layla: Ich sehe die Nachricht. Sollen wir am Samstag um zehn Uhr im Park Sport machen?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf bestätigt das Wetter
    gloss: 'Yusuf: Ja, und am Samstag ist es sonnig!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: Karims Plan
    gloss: 'Karim: Dann laufe ich. Danach spiele ich auch noch Fußball.'
    note: 'سأركض (sa-arkuḍ) bedeutet ich werde laufen: س markiert das Futur. بعد ذلك (baʿda dhālik) bedeutet danach.'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Saras Plan
    gloss: 'Sara: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: أفضل (ufaḍḍil) bedeutet ich bevorzuge. لكنني (lākinnanī) bedeutet aber ich, und سآتي (sa-ātī) bedeutet ich werde kommen.
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla beendet das Gespräch
    gloss: 'Layla: Schön! Bis Samstag im Park!'
    note: Schließt in einer Zeile den Nachrichtenverlauf dieser Lektion und den Plan aus der Sport-Lektion ab.
