    gloss: Layla fragt nach dem Wetter von heute.
    note: اليوم bedeutet „heute“.
    example_gloss: 'Layla sagte: Wie ist das Wetter heute?'
  ar.a1.unit20.lesson02.teach.line02:
    title: Sonnig und heiß
    gloss: Yusuf sagt, dass das Wetter sonnig und heiß ist.
    note: 'و (wa, „und“) verbindet die beiden Wetterwörter und wird an das nächste Wort angeschlossen: وحار.'
    example_gloss: 'Yusuf sagte: Das Wetter ist sonnig und heiß.'
  ar.a1.unit20.lesson02.teach.line03:
    title: Das Café vorschlagen
    gloss: Layla schlägt vor, ins Café zu gehen.
    note: هل نذهب fragt „gehen wir?“
