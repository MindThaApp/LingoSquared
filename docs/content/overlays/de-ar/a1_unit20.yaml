    gloss: lass uns Wasser trinken
    note: هيا (hayyā) + ein Verb in der „wir“-Form bedeutet „lass uns …“; نشرب (nashrab) bedeutet „wir trinken“.
    example_gloss: Das Wetter ist heiß. Lass uns Wasser trinken.
