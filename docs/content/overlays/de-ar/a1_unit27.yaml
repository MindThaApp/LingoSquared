teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: حيوان (ḥayawān) bedeutet Tier und حيوان أليف (ḥayawān alīf) bedeutet Haustier. أليف (alīf) ist ein Adjektiv mit der Bedeutung „zahm“ und steht deshalb nach dem Nomen.
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Layla hat einen Hund.
    - Karim hat eine Katze.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nour hat einen Vogel.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: 'هل لديك (hal ladayka) fragt „Hast du?“. Zu einer Frau schreibt man es gleich, aber der letzte Vokal ist i: ladayki. هل (hal) leitet eine Ja-Nein-Frage ein.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: 'ليس لدي (laysa ladayya) bedeutet „ich habe nicht“: ليس (laysa) verneint, und لدي (ladayya) bedeutet „ich habe“.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Nicht haben: ليس لدي'
    gloss: 'Um zu sagen, dass Sie etwas nicht haben, verwenden Sie ليس لدي (laysa ladayya): ليس لدي وقت (Ich habe keine Zeit), ليس لدي حيوان أليف (Ich habe kein Haustier).'
    note: ليس لدي passt zu jedem Nomen und ändert sich nicht nach dem Geschlecht des Nomens. Für „er“ und „sie“ sagt man ليس لديه (laysa ladayhi) und ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) bedeutet wörtlich „das Tier auf einen Ausflug mitnehmen“. Das Verb ist أخذ, nehmen.
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Das Verb ändert sich mit der Person
    gloss: 'Das Verb verändert sich mit der Person: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), ich gehe mit dem Hund spazieren; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), Karim geht mit seinem Hund spazieren.'
    note: Der Anfangsbuchstabe أ (a-) steht für „ich“, ي (ya-) für „er“. نزهة (nuzha) ist ein Spaziergang oder ein kurzer Ausflug.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Karim spielt mit seiner Katze.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: 'كل يوم (kull yawm) bedeutet „jeden Tag“: كل + Nomen im Singular ohne ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: أطعم (uṭʿim) bedeutet „ich füttere“. القطة (al-qiṭṭa) ist feminin, und das ال ist am Nomen angehängt.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Plural: كلب → كلاب'
    gloss: 'Viele Pluralformen sind unregelmäßig, deshalb lernt man sie zusammen mit dem Nomen: كلب (kalb) wird zu كلاب (kilāb), قطة (qiṭṭa) zu قطط (qiṭaṭ) und طائر (ṭāʾir) zu طيور (ṭuyūr).'
    note: Im Arabischen sind die meisten Pluralformen sogenannte gebrochene Plurale, daher lernt man jeden Plural zusammen mit seinem Nomen; der Plural von Tieren bekommt ein Adjektiv im Femininum Singular.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Yusuf liebt Hunde.
    - Sara liebt Katzen.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) bedeutet „Ich liebe Tiere“. Der Plural endet auf ات und hat den angehängten Artikel ال.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara liebt Katzen, hat aber kein Haustier
    gloss: Sara liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf fragt nach einem Haustier
    gloss: 'Yusuf: Hast du ein Haustier, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla hat einen Hund
    gloss: 'Layla: Ja, ich habe einen Hund.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf fragt, wie er aussieht
    gloss: 'Yusuf: Wie sieht er aus?'
    note: كيف يبدو؟ (kayfa yabdū?) fragt, wie er aussieht. يبدو (yabdū) ist maskulin, weil كلب, Hund, ein maskulines Nomen ist.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla beschreibt ihren Hund
    gloss: 'Layla: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Pronomen für Tiere
    gloss: 'Jedes Tierwort ist maskulin oder feminin: Der Hund ist هو (huwa, er) und die Katze ist هي (hiya, sie). Die Endung ه in أطعمه (uṭʿimuhu) bedeutet „ihn“ oder „es“.'
    note: Ein maskulines Tierwort wie كلب hat maskuline Pronomen und Adjektive; ein feminines wie قطة hat feminine.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf fragt nach den Spaziergängen
    gloss: 'Yusuf: Gehst du jeden Tag mit ihm spazieren?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla beschreibt ihren Alltag
    gloss: 'Layla: Ja, ich gehe jeden Tag mit ihm spazieren und füttere ihn.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara und Karim über Tiere
    gloss: 'Yusuf und Sara lieben beide Tiere, aber keiner von beiden hat ein Haustier. Yusuf liebt Hunde und Sara liebt Katzen. Karim dagegen hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und gibt ihr jeden Tag Futter. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      يحبان: lieben
      كلاهما: beide
      الحيوانات: Tiere
      منهما: von ihnen (keiner von beiden)
      أليف: 'Haustier (wörtlich: zahm)'
      الكلاب: Hunde
      القطط: Katzen
      قطة: Katze
      يلعب: spielt
      ويعطي: gibt
      كل: jeder
      طعاما: Futter
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim spielt oft mit seiner Katze
    gloss: Karim spielt oft mit seiner Katze.
    note: 'قطته (qiṭṭatuhu) bedeutet „seine Katze“: Die Endung ه (hu) bedeutet „sein“, und das ة von قطة wird davor zu ت.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla fragt Nour
    gloss: 'Layla: Nour, hast du auch ein Haustier?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour hat einen Vogel namens Pico
    gloss: 'Nour: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: اسمه (ismuhu) bedeutet „sein Name“; das ه am Ende bedeutet „sein“. بيكو (bīkū) ist der Name des Vogels.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reagiert
    gloss: 'Yusuf: Wie schön! Was machst du jeden Tag mit ihm?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour füttert ihn jeden Tag
    gloss: 'Nour: Ich füttere ihn jeden Tag.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Yusuf liebt auch Vögel
    gloss: 'Yusuf: Ich liebe Vögel auch.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla beendet das Gespräch
    gloss: 'Layla: Wie schön, dass wir drei Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
