  title: Arabisch A1
  description: 'Arabisch für Anfänger über Haustiere und häufige Tiere: sie benennen, grundlegende Pflege (Gassi gehen, füttern, spielen), sagen, welche Tiere man liebt, auch ohne eines zu besitzen, und gebräuchliche Pluralformen.'
