teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Gestern
    gloss: gestern
    note: أمس (ams) bedeutet „gestern“. Es steht zusammen mit einem Verb in der Vergangenheit wie ذهبت und kann am Satzende oder am Satzanfang stehen.
    example_gloss: Ich war gestern auf dem Markt.
  ar.a1.unit13.lesson01.teach.went:
    title: Ich bin gegangen
    gloss: ich bin gegangen
    note: 'ذهبت (dhahabtu) bedeutet „ich bin gegangen“: Die Endung -tu der Vergangenheit steht für „ich“. Ohne Vokalzeichen kann man dieselben Buchstaben auch als dhahabta / dhahabti („du bist gegangen“, zu einem Mann / zu einer Frau) oder dhahabat („sie ist gegangen“) lesen; der Kontext zeigt, was gemeint ist.'
    example_gloss: Ich bin zum Markt gegangen.
  ar.a1.unit13.lesson01.teach.bought:
    title: Ich habe gekauft
    gloss: ich habe gekauft
    note: اشتريت (ishtaraytu) bedeutet „ich habe gekauft“; wie ذهبت endet es auf -tu für „ich“.
    example_gloss: Ich habe Äpfel gekauft.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Äpfel
    gloss: Äpfel
    note: تفاحا (tuffāḥan) ist تفاح („Äpfel“, aus der Einkaufslektion) als Objekt des Verbs; das zusätzliche ا schreibt die Endung -an.
    example_gloss: Ich habe Äpfel gekauft.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Was hast du gestern gemacht?
    gloss: Was hast du gestern gemacht?
    note: 'ماذا (mādhā) fragt „was“; فعلت bedeutet hier „du hast gemacht“: faʿalta zu einem Mann, faʿalti zu einer Frau (geschrieben sieht es gleich aus). Yusuf fragt Layla, also sagt er faʿalti.'
    example_gloss: 'Yusuf sagte: Was hast du gestern gemacht?'
  ar.a1.unit13.lesson02.teach.drank:
    title: ich habe getrunken
    gloss: ich habe getrunken
    note: شربت (sharibtu) bedeutet „ich habe getrunken“; es hat dieselbe Endung -tu („ich“) wie ذهبت und اشتريت.
    example_gloss: Ich habe Kaffee getrunken.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Ablauf eines kürzlichen Ereignisses
    gloss: Ich war auf dem Markt. Ich habe Äpfel gekauft. Ich habe Kaffee getrunken.
    note: Mehrere kurze Sätze in der Vergangenheit hintereinander erzählen, was man getan hat. Jedes Verb endet auf -tu für „ich“.
    example_gloss: Gestern war ich auf dem Markt. Ich habe Äpfel gekauft. Ich habe Kaffee getrunken.
  ar.a1.unit13.lesson02.teach.line01:
    title: Frage nach gestern
    gloss: Yusuf fragt, was Layla gestern gemacht hat.
    note: Yusuf fragt Layla, eine Frau, deshalb liest man فعلت hier faʿalti; zu einem Mann sagt man faʿalta.
    example_gloss: 'Yusuf sagte: Was hast du gestern gemacht?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Auf dem Markt gewesen
    gloss: Layla sagt, dass sie auf dem Markt war.
    note: ذهبت zeigt eine abgeschlossene Bewegung.
    example_gloss: 'Layla sagte: Ich war auf dem Markt.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Äpfel gekauft
    gloss: Layla sagt, dass sie Äpfel gekauft hat.
    note: Das fügt eine zweite abgeschlossene Handlung hinzu.
    example_gloss: 'Layla sagte: Ich habe Äpfel gekauft.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Kaffee getrunken
    gloss: Layla sagt, dass sie Kaffee getrunken hat.
    note: Das vervollständigt den kurzen Bericht über das Ereignis.
    example_gloss: 'Layla sagte: Ich habe Kaffee getrunken.'
