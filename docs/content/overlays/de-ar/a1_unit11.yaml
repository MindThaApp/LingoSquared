  ar.a1.unit11.lesson01.teach.every_day:
    title: Jeden Tag
    gloss: jeden Tag
    note: كل يوم (kull yawm) steht oft nach dem Verb (أدرس كل يوم), kann aber auch am Satzanfang stehen (كل يوم أدرس).
    example_gloss: Ich lerne jeden Tag.
  ar.a1.unit11.lesson01.teach.wake:
    title: Ich wache auf
    gloss: ich stehe auf
    note: أستيقظ (astayqiẓ) bedeutet „ich stehe auf, ich wache auf“; das أ am Anfang kennzeichnet „ich“ bei Verben im Präsens. السابعة (as-sābiʿa) ist „sieben“ bei Uhrzeiten.
    example_gloss: Ich wache um sieben Uhr auf.
  ar.a1.unit11.lesson01.teach.study:
    title: Ich lerne
    gloss: ich lerne
    note: أدرس (adrus) bedeutet „ich lerne, ich studiere“; es hat dieselbe Wurzel wie درس („Unterrichtsstunde“). التاسعة (at-tāsiʿa) ist „neun“ bei Uhrzeiten.
    example_gloss: Ich lerne um neun Uhr.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Ich schlafe
    gloss: ich schlafe / ich gehe schlafen
    note: أنام (anām) bedeutet „ich schlafe“; mit einer Uhrzeit heißt es „ich gehe schlafen“. العاشرة (al-ʿāshira) ist „zehn“ bei Uhrzeiten.
    example_gloss: Ich schlafe um zehn Uhr.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Was machst du jeden Tag?
    gloss: Was machst du jeden Tag?
    note: ماذا (mādhā) fragt „was“, und تفعل (tafʿal) bedeutet „du machst“, an einen Mann gerichtet; an eine Frau gerichtet heißt es تفعلين (tafʿalīn).
    example_gloss: 'Layla sagte: Was machst du jeden Tag?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Drei Sätze zum Tagesablauf
    gloss: Ich stehe um sieben auf. Ich lerne um neun. Ich gehe um zehn schlafen.
    note: Jeder Satz besteht aus einem Verb + في الساعة + der Uhrzeit; zusammen beschreiben sie einen ganzen Tag.
    example_gloss: Jeden Tag stehe ich um sieben auf. Ich lerne um neun. Ich gehe um zehn schlafen.
  ar.a1.unit11.lesson02.teach.line01:
    title: Nach dem Tagesablauf fragen
    gloss: Layla fragt, was Yusuf jeden Tag macht.
    note: 'Layla sagt تفعل, weil sie einen Mann fragt; an eine Frau gerichtet: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla sagte: Was machst du jeden Tag?'
  ar.a1.unit11.lesson02.teach.line02:
    title: Aufstehzeit
    gloss: Yusuf sagt, dass er um sieben aufsteht.
    note: Vor der Uhrzeit steht في الساعة.
    example_gloss: 'Yusuf sagte: Ich stehe um sieben Uhr auf.'
  ar.a1.unit11.lesson02.teach.line03:
    title: Lernzeit
    gloss: Yusuf sagt, dass er um neun lernt.
    note: Dasselbe Muster für die Uhrzeit funktioniert auch mit أدرس.
    example_gloss: 'Yusuf sagte: Ich lerne um neun Uhr.'
  ar.a1.unit11.lesson02.teach.line04:
    title: Schlafenszeit
    gloss: Yusuf sagt, dass er um zehn ins Bett geht.
    note: Die letzte Tätigkeit seines Tages folgt mit أنام demselben Muster für die Uhrzeit.
    example_gloss: 'Yusuf sagte: Ich schlafe um zehn Uhr.'
