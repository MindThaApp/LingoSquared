    title: Morgen
    gloss: morgen
    note: غدا (ghadan) verlegt eine Handlung in die nahe Zukunft.
    example_gloss: Ich lerne morgen.
  ar.a1.unit12.lesson01.teach.go:
    title: Wir gehen
    gloss: wir gehen
    note: نذهب (nadh-hab) bedeutet „wir gehen“; das ن am Anfang steht für „wir“. Mit غدا beschreibt das Präsens einen Plan.
    example_gloss: Wir gehen ins Café.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Morgen um fünf
    gloss: morgen um fünf Uhr
    note: في الساعة („um … Uhr“) steht vor der Uhrzeit, wie in der Einheit zur Uhrzeit.
    example_gloss: Wir gehen morgen um fünf Uhr.
  ar.a1.unit12.lesson02.teach.propose:
    title: Einen Plan vorschlagen
    gloss: Sollen wir morgen ins Café gehen?
    note: 'هل (hal) macht aus einer Aussage eine Ja-Nein-Frage; mit نذهب wirkt es wie ein Vorschlag: Sollen wir gehen?'
    example_gloss: 'Layla sagte: Sollen wir morgen ins Café gehen?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Mit einer Uhrzeit zusagen
    gloss: Ja, um fünf Uhr
    note: Sie können einfach mit نعم plus der Uhrzeit antworten; ein Verb ist nicht nötig.
    example_gloss: 'Yusuf sagte: Ja, um fünf Uhr.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Einfach absagen
    gloss: Nein, ich habe Unterricht
    note: لا ist eine einfache Absage, gefolgt von einem Grund mit عندي („ich habe“).
    example_gloss: Nein, ich habe morgen Unterricht.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla macht einen Vorschlag
    gloss: Layla schlägt vor, morgen ins Café zu gehen.
    note: Dieser Satz eröffnet das Gespräch über den Plan.
    example_gloss: 'Layla sagte: Sollen wir morgen ins Café gehen?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Yusuf sagt zu
    gloss: Yusuf sagt zu und nennt die Uhrzeit.
    note: Der Plan enthält jetzt eine Aktivität, einen Tag und eine Uhrzeit.
    example_gloss: 'Yusuf sagte: Ja, um fünf Uhr.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla bestätigt
    gloss: Layla sagt „gut“ und verabschiedet sich.
    note: جيد (jayyid) bedeutet „gut“; hier bestätigt es den Plan. إلى اللقاء ist der Abschiedsgruß aus der Lektion über Begrüßungen.
    example_gloss: 'Layla sagte: Gut. Auf Wiedersehen.'
