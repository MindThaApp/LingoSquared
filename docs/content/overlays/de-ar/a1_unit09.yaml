    title: Ort
    gloss: Ort
    note: مكان (makān) ist das allgemeine Wort für „Ort“. هذا („dies“) kam bei den Zahlen vor.
    example_gloss: Das ist ein Ort.
  ar.a1.unit09.lesson01.teach.library:
    title: Bibliothek
    gloss: Bibliothek
    note: مكتبة (maktaba) kann „Bibliothek“ oder „Buchhandlung“ bedeuten; hier ist es eine Bibliothek. المكتبة (al-maktaba) heißt „die Bibliothek“.
    example_gloss: Die Bibliothek ist hier.
  ar.a1.unit09.lesson01.teach.market:
    title: Markt
    gloss: Markt
    note: سوق (sūq) bedeutet „Markt“; السوق (as-sūq) heißt „der Markt“.
    example_gloss: Der Markt ist hier.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Café
    gloss: Café
    note: مقهى (maqhā) bedeutet „Café“; das Wort ist mit قهوة („Kaffee“) verwandt. المقهى (al-maqhā) heißt „das Café“.
    example_gloss: Das Café ist hier.
  ar.a1.unit09.lesson01.teach.here:
    title: Hier
    gloss: hier
    note: 'هنا (hunā) steht meistens nach dem Ort: المقهى هنا, „das Café ist hier“. In diesem Satz braucht das Arabische kein Wort für „ist“.'
    example_gloss: Das Café ist hier.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Wo ist die Bibliothek?
    gloss: Wo ist die Bibliothek?
    note: أين (ayna) fragt nach dem Ort („wo“); Sie sind ihm schon in من أين أنت؟ („Woher kommst du?“) begegnet.
    example_gloss: 'Yusuf sagte: Wo ist die Bibliothek?'
  ar.a1.unit09.lesson02.teach.near:
    title: In der Nähe
    gloss: in der Nähe von
    note: 'قرب (qurba) bedeutet „nahe bei“ und steht vor dem Ort, auf den es sich bezieht: قرب المكتبة, „nahe der Bibliothek“. بالقرب من (bi-l-qurbi min) bedeutet dasselbe.'
    example_gloss: Das Café ist in der Nähe der Bibliothek.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: Die Bibliothek ist in der Nähe des Marktes
    gloss: Die Bibliothek ist in der Nähe des Marktes
    note: Das Arabische braucht hier kein eigenes Wort für „ist“.
    example_gloss: 'Layla sagte: Die Bibliothek ist in der Nähe des Marktes.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Nach dem Ort fragen
    gloss: Yusuf fragt, wo die Bibliothek ist.
    note: أين leitet die Frage nach dem Ort ein.
    example_gloss: 'Yusuf sagte: Wo ist die Bibliothek?'
  ar.a1.unit09.lesson02.teach.line02:
    title: Die Bibliothek beschreiben
    gloss: Layla sagt, die Bibliothek ist hier in der Nähe des Marktes.
    note: 'هنا und قرب können zusammen vorkommen: hier, in der Nähe des Marktes.'
    example_gloss: 'Layla sagte: Die Bibliothek ist hier in der Nähe des Marktes.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Nach dem Café fragen
    gloss: Yusuf fragt, wo das Café ist.
    note: 'و (wa, „und“) wird mit dem nächsten Wort zusammengeschrieben: وأين (wa-ayna), „und wo“.'
    example_gloss: 'Yusuf sagte: Und wo ist das Café?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Das Café beschreiben
    gloss: Layla sagt, das Café ist in der Nähe der Bibliothek.
    note: 'Ort + قرب + zweiter Ort: المقهى قرب المكتبة, „das Café ist in der Nähe der Bibliothek“.'
    example_gloss: 'Layla sagte: Das Café ist in der Nähe der Bibliothek.'
