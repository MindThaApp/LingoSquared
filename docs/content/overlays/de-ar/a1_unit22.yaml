  ar.a1.unit22.lesson02.teach.how_feel:
    title: Wie fühlst du dich?
    gloss: Wie fühlst du dich?
    note: 'كيف تشعر؟ (kayfa tashʿur) fragt einen Mann, wie er sich fühlt; zu einer Frau sagt man: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Wie fühlst du dich, Yusuf?
  ar.a1.unit22.lesson02.teach.tired:
    title: Müde
    gloss: müde
    note: متعب (mutʿab) beschreibt einen Mann; متعبة (mutʿaba) beschreibt eine Frau, deshalb sagt Layla أنا متعبة.
    example_gloss: Ich bin müde.
  ar.a1.unit22.lesson02.teach.okay:
    title: In Ordnung
    gloss: in Ordnung
    note: بخير (bi-khayr) bedeutet „in Ordnung, gut“, wörtlich „bei guter (Gesundheit)“.
    example_gloss: Geht es dir gut?
  ar.a1.unit22.lesson02.teach.line01:
    title: Nach dem Befinden fragen
    gloss: Layla fragt, wie sich Yusuf fühlt.
    note: يا (yā) steht vor dem Namen der angesprochenen Person.
    example_gloss: 'Layla sagte: Wie fühlst du dich, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Gefühl und Grund
    gloss: Yusuf sagt, dass er glücklich ist, weil das Wetter sonnig ist.
    note: Dieser Satz nennt sowohl das Gefühl als auch den Grund.
    example_gloss: 'Yusuf sagte: Ich bin glücklich, weil das Wetter sonnig ist.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Ein anderes Gefühl
    gloss: Layla sagt, dass sie müde ist, weil sie Arbeit hat.
    note: متعبة richtet sich nach Layla (feminin).
    example_gloss: 'Layla sagte: Ich bin müde, weil ich Arbeit habe.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Nachfragen, ob alles in Ordnung ist
    gloss: Yusuf fragt, ob es Layla gut geht.
    note: 'هل (hal) leitet eine Ja-Nein-Frage ein. Yusuf fragt Layla, daher wird أنت hier „anti“ gelesen (zu einem Mann: anta).'
    example_gloss: 'Yusuf sagte: Geht es dir gut?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Ja sagen
    gloss: Layla sagt ja und bedankt sich bei ihm.
    note: نعم ist die Antwort „ja“.
    example_gloss: 'Layla sagte: Ja, danke.'
