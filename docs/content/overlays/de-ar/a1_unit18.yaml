    note: أعمل (aʿmal) heißt „ich arbeite“; es hat dieselbe Wurzel wie عمل („Arbeit“), und das أ am Anfang kennzeichnet „ich“.
    example_gloss: 'Yusuf sagte: Ich arbeite in einem Büro.'
