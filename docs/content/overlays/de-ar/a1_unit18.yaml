    note: 'و (wa, „und“) verbindet die beiden Tätigkeiten und wird mit dem folgenden Wort zusammengeschrieben: وأقرأ.'
    example_gloss: 'Yusuf sagte: Ich schreibe und lese bei der Arbeit.'
