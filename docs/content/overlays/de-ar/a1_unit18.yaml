    title: Nach der Arbeit fragen
    gloss: Layla fragt Yusuf nach seiner Arbeit.
    note: يا يوسف spricht Yusuf mit seinem Namen an.
    example_gloss: 'Layla sagte: Was arbeitest du, Yusuf?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Beruf nennen
    gloss: Yusuf sagt, dass er Ingenieur ist.
    note: Ein eigenes Wort für „bin“ ist nicht nötig.
    example_gloss: 'Yusuf sagte: Ich bin Ingenieur.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Arbeitsplatz nennen
    gloss: Yusuf sagt, dass er in einem Büro arbeitet.
    note: أعمل في nennt den Arbeitsplatz.
    example_gloss: 'Yusuf sagte: Ich arbeite in einem Büro.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Nach der Tätigkeit fragen
    gloss: Layla fragt, was Yusuf jeden Tag macht.
    note: 'Hier wird die Frage nach dem Alltag wieder verwendet; تفعل richtet sich an einen Mann. An eine Frau: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla sagte: Was machst du jeden Tag?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Tätigkeit nennen
