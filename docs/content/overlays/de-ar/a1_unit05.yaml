    title: Die Uhrzeit
    gloss: die Uhrzeit / die Stunde
    note: الساعة (as-sāʿa) bedeutet wörtlich „die Stunde“ (auch „die Uhr“); Uhrzeitangaben beginnen damit.
    example_gloss: Es ist drei Uhr.
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: Wie spät ist es?
    gloss: Wie spät ist es?
    note: 'كم الساعة؟ fragt wörtlich: „Wie viel ist die Stunde?“'
    example_gloss: 'Layla sagte: Wie spät ist es?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: Drei Uhr
    gloss: Es ist drei Uhr.
    note: 'الثالثة (ath-thālitha) ist die weibliche Ordnungszahl „dritte“ und richtet sich nach dem weiblichen الساعة: wörtlich „die dritte Stunde“.'
    example_gloss: 'Layla sagte: Es ist drei Uhr.'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: Fünf Uhr
    gloss: Es ist fünf Uhr.
    note: الخامسة (al-khāmisa), „die fünfte (Stunde)“. In dieser A1-Einheit geht es nur um volle Stunden.
    example_gloss: 'Layla sagte: Es ist fünf Uhr.'
  ar.a1.unit05.lesson01.teach.sabah:
    title: Am Morgen
    gloss: morgens
    note: صباحا (ṣabāḥan) kann eine Uhrzeit als Vormittagszeit kennzeichnen; في الصباح sagt dasselbe.
    example_gloss: Es ist fünf Uhr morgens.
  ar.a1.unit05.lesson01.teach.masaa:
    title: Am Abend
    gloss: abends
    note: مساء (masāʾan) kann eine Uhrzeit als Abendzeit kennzeichnen; في المساء sagt dasselbe.
    example_gloss: Es ist fünf Uhr abends.
  ar.a1.unit05.lesson02.teach.mata:
    title: Wann
    gloss: wann
    note: متى (matā) fragt, wann etwas stattfindet.
    example_gloss: Wann ist der Unterricht?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: Wann ist der Unterricht?
    gloss: Wann ist der Unterricht?
    note: In dieser einfachen Frage entfällt im Arabischen das Wort für „ist“.
    example_gloss: 'Yusuf sagte: Wann ist der Unterricht?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: Der Unterricht ist um fünf
    gloss: Der Unterricht ist um fünf Uhr.
    note: الساعة kann auch eine geplante Uhrzeit einleiten.
    example_gloss: 'Layla sagte: Der Unterricht ist um fünf Uhr.'
  ar.a1.unit05.lesson02.teach.line01:
    title: Nach der Uhrzeit fragen
    gloss: Yusuf fragt nach der Uhrzeit.
    note: كم الساعة؟ fragt nach der aktuellen Uhrzeit.
    example_gloss: 'Yusuf sagte: Wie spät ist es?'
  ar.a1.unit05.lesson02.teach.line02:
    title: Die Uhrzeit sagen
    gloss: Layla sagt, es ist drei Uhr.
    note: Die Antwort beginnt mit الساعة.
    example_gloss: 'Layla sagte: Es ist drei Uhr.'
  ar.a1.unit05.lesson02.teach.line03:
