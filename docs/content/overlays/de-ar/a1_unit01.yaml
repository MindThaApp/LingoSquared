teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: Arabisch läuft von rechts nach links
    gloss: Arabisch wird von rechts nach links geschrieben.
    note: Lesen Sie Arabisch vom rechten Rand zum linken hin.
  ar.a1.unit01.lesson01.teach.mim:
    title: Der Buchstabe م
    gloss: m
    note: م steht für einen m-Laut und verändert seine Form je nach Position im Wort.
  ar.a1.unit01.lesson01.teach.ra:
    title: Der Buchstabe ر
    gloss: r
    note: ر steht für ein gerolltes r und verbindet sich nicht mit dem folgenden Buchstaben.
  ar.a1.unit01.lesson01.teach.ha:
    title: Der Buchstabe ح
    gloss: ḥ
    note: ح ist ein hauchender h-Laut, der tief im Rachen gebildet wird. Er unterscheidet sich vom deutschen h, das im Kehlkopf entsteht.
  ar.a1.unit01.lesson01.teach.ba:
    title: Der Buchstabe ب
    gloss: b
    note: ب steht für einen b-Laut und verbindet sich mit den Nachbarbuchstaben.
  ar.a1.unit01.lesson01.teach.alef:
    title: Der Buchstabe ا
    gloss: ā / a
    note: ا kennzeichnet einen langen Vokal ā und verbindet sich nicht mit dem folgenden Buchstaben.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Bauen Sie مرحبا
    gloss: hallo
    note: مرحبا wird marḥaban gelesen. Kurze Vokale werden in der arabischen Schrift normalerweise nicht geschrieben.
    example_gloss: Hallo! Ich bin Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Hallo
    gloss: hallo
    note: مرحبا ist ein herzlicher Allzweckgruß, der in fast jeder Situation passt.
    example_gloss: Hallo, wie geht's?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Guten Morgen
    gloss: guten Morgen
    note: صباح الخير wird ṣabāḥ al-khayr gelesen und bedeutet wörtlich „Morgen des Guten“.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Guten Tag oder guten Abend
    gloss: guten Tag / guten Abend
    note: مساء الخير wird masāʾ al-khayr gelesen und ab dem späteren Nachmittag bis in den Abend verwendet.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Verabschiedung
    gloss: auf Wiedersehen
    note: مع السلامة wird maʿa as-salāma gelesen und bedeutet wörtlich „mit Sicherheit“ – der übliche allgemeine Abschiedsgruß.
    example_gloss: Danke, auf Wiedersehen!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Danke
    gloss: danke
    note: شكرا wird shukran gelesen und passt in jedem Register.
    example_gloss: Vielen Dank.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Bitte / Gern geschehen
    gloss: bitte / gern geschehen
    note: عفوا (ʿafwan) ist die übliche Antwort auf شكرا; in anderem Zusammenhang kann es auch „Entschuldigung“ bedeuten.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Gute Nacht
    gloss: gute Nacht
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) sagt man beim Abschied am Abend oder vor dem Schlafengehen, nicht als Begrüßung. تصبح ist die Form für einen Mann; zu einer Frau sagt man تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Willkommen
    gloss: willkommen
    note: أهلا وسهلا (ahlan wa sahlan) heißt einen Gast willkommen oder begrüßt jemanden herzlich bei der Ankunft.
    example_gloss: Willkommen! Herzlich willkommen bei uns.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Bis bald
    gloss: bis bald / bis zum Wiedersehen
    note: إلى اللقاء (ilā al-liqāʾ) ist ein gepflegter, neutraler Abschiedsgruß.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Guten Morgen, Antwort
    gloss: guten Morgen [Antwort]
    note: صباح النور (ṣabāḥ an-nūr, „Morgen des Lichts“) ist die übliche Antwort auf صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Guten Abend, Antwort
    gloss: guten Abend [Antwort]
    note: مساء النور (masāʾ an-nūr) ist die übliche Antwort auf مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Schönen Tag noch
    gloss: schönen Tag noch
    note: يوما سعيدا (yawman saʿīdan) ist ein herzlicher Abschiedswunsch.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Wie geht es Ihnen? / Wie geht’s?
    gloss: Wie geht es Ihnen?
    note: كيف حالك؟ (kayfa ḥāluk) ist die übliche Art zu fragen, wie es jemandem geht; ohne Vokalzeichen passt die Schreibung für jede angesprochene Person.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: „Du“ männlich und weiblich
    gloss: du (m.) / du (w.)
    note: Gesprochen unterscheidet das Arabische أنتَ (anta, zu einem Mann) von أنتِ (anti, zu einer Frau) – und ebenso حالَك von حالِك. Ohne die hier gezeigten Vokalzeichen sind die in diesem Kurs verwendeten Schreibungen für beide gleich.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Gut / in Ordnung
    gloss: gut / in Ordnung
    note: بخير (bikhayr) ist die übliche positive Antwort auf كيف حالك؟
    example_gloss: Mir geht es heute gut.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Gott sei Dank
    gloss: Gott sei Dank / Lob sei Gott
    note: الحمد لله (al-ḥamdu lillāh) folgt in einer Antwort sehr häufig auf بخير, unabhängig davon, wie religiös die sprechende Person ist. Es dient als gewöhnlicher Gesprächsabschluss, ähnlich wie „zum Glück“ oder „Gott sei Dank“ im Deutschen.
    example_gloss: Gut, Gott sei Dank.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: Und dir? / Und Ihnen?
    gloss: Und Sie?
    note: وأنت؟ (wa anta zu einem Mann, wa anti zu einer Frau) gibt die Frage zurück; die Schreibung ohne Vokalzeichen ist für beide gleich.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Ausgezeichnet
    gloss: ausgezeichnet / großartig
    note: ممتاز (mumtāz) ist eine begeisterte Steigerung gegenüber بخير.
    example_gloss: Mir geht es heute großartig!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Nicht schlecht
    gloss: nicht schlecht
    note: لا بأس (lā baʾs) ist eine natürliche, mittelmäßige Antwort und keine Klage.
