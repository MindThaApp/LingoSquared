course:
  title: Arabisch A1
  description: Modernes Hocharabisch (Fusha) für Anfänger – die Schrift lesen, alltägliche Begrüßungen und kurze höfliche Gespräche meistern.
units:
  ar.a1.unit01.greetings:
    title: Begrüßung und Abschied
