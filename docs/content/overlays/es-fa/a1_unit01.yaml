teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: El persa se escribe de derecha a izquierda
    gloss: El persa se escribe de derecha a izquierda.
    note: Lee el persa desde el borde derecho hacia la izquierda.
  fa.a1.unit01.lesson01.teach.seen:
    title: La letra س
    gloss: s
    note: س normalmente representa el sonido s.
  fa.a1.unit01.lesson01.teach.lam:
    title: La letra ل
    gloss: l
    note: ل representa el sonido l y se une a las letras vecinas.
  fa.a1.unit01.lesson01.teach.alef:
    title: La letra ا
    gloss: ā / a
    note: ا suele marcar una â larga y no se une a la letra siguiente.
  fa.a1.unit01.lesson01.teach.mim:
    title: La letra م
    gloss: m
    note: م representa el sonido m y cambia de forma al unirse.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Construye سلام
    gloss: hola
    note: سلام se lee salâm. En la escritura persa normalmente se omiten las vocales breves.
    example_gloss: ¡Hola! Soy Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Hola
    gloss: hola
    note: سلام sirve tanto en situaciones formales como informales.
    example_gloss: Hola, ¿cómo estás?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Buenos días
    gloss: buenos días
    note: صبح بخیر es un saludo matutino neutro y cortés.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Buenas tardes o buenas noches
    gloss: buenas tardes / buenas noches
    note: عصر بخیر se usa desde la tarde avanzada hasta la noche.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Despedida
    gloss: adiós
    note: خداحافظ se lee khodâhâfez y es la despedida general estándar.
    example_gloss: ¡Adiós, hasta luego!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Gracias
    gloss: gracias
    note: ممنون es común y natural; متشکرم es algo más formal.
    example_gloss: Muchas gracias.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: De nada
    gloss: de nada
    note: خواهش می‌کنم es la respuesta habitual a un agradecimiento.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: ¿Cómo está usted? Forma hablada cortés
    gloss: ¿Cómo está usted?
    note: حالتون چطوره؟ es persa iraní hablado, neutro y cortés. حال شما چطور است؟ es su equivalente más formal o escrito.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Estoy bien
    gloss: estoy bien
    note: خوبم combina خوب con la terminación de primera persona ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Buen día
    gloss: buenos días
    note: روز بخیر es cortés, pero se usa menos que سلام en el habla informal.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Buenas noches
    gloss: buenas noches (para ir a dormir)
    note: شب بخیر suele ser una despedida o un deseo antes de dormir, no un saludo de apertura.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Bienvenido
    gloss: bienvenido
    note: خوش آمدید es la forma cortés que se usa para uno o varios invitados.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Espero verte
    gloss: espero verte / hasta que nos veamos
    note: به امید دیدار es una despedida elegante, neutra y cortés.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Hasta luego
    gloss: hasta luego
    note: فعلاً es coloquial y menos formal que خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Que tenga un buen día
    gloss: que tengas un buen día
    note: باشید marca la forma cortés en esta despedida fija.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Forma hablada neutra y cortés
    gloss: ¿Cómo está usted?
    note: Usa حالتون چطوره؟ con un adulto que no conoces o en una conversación cortés normal. La forma explícitamente formal o escrita es حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Informal
    gloss: ¿Cómo está usted?
    note: چطوری؟ es coloquial y apropiado con amigos, familiares y personas de tu edad cuando la relación lo permite.
  fa.a1.unit01.lesson04.teach.to:
    title: Tú (trato informal)
    gloss: usted
    note: تو es singular e informal; no lo uses por defecto con un adulto que no conoces.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Muy bien
    gloss: estoy muy bien
    note: خیلی refuerza خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: No está mal
    gloss: no estoy mal, gracias
    note: بد نیستم es una respuesta moderada y natural, no una queja.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: ¿Y usted? Forma cortés
    gloss: ¿Y usted?
    note: Usa شما چطور؟ para devolver la pregunta con cortesía.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: ¿Y tú? Informal
    gloss: ¿Y usted?
    note: تو چطور؟ corresponde a una relación informal.
  fa.a1.unit01.lesson05.teach.chai:
    title: Té
    gloss: té
    note: '*چای* es la bebida (té). La oirás en el ofrecimiento *چای بفرمایید* (toma un té).'
    example_gloss: Por favor, ¿le apetece un té?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Adelante, por favor
    gloss: por favor / adelante / aquí tiene
    note: '*بفرمایید* cambia según la situación: puede significar «aquí tienes» (al ofrecer té), «pasa» (en una puerta) o «después de ti».'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Es usted muy amable
    gloss: es usted muy amable
    note: لطف دارید devuelve un cumplido con cortesía.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Por favor, no se moleste
    gloss: por favor, no se tome la molestia
    note: زحمت نکشید puede ser un rechazo sincero o una primera respuesta cortés ante un ofrecimiento concreto.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Gracias por su amabilidad
    gloss: gracias por su amabilidad
    note: Es más cálido y explícito que ممنون solo.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: normas iraníes de cortesía que dependen del contexto
    note: El taarof se refiere a las convenciones, según el contexto, para ofrecer, rechazar, agradecer y mostrar respeto. La práctica varía según la relación, la generación, la región y la situación; ningún número fijo de rechazos o repeticiones determina si un ofrecimiento es sincero.
  fa.a1.unit01.lesson06.teach.line01:
    title: Bienvenido
    gloss: Ali da la bienvenida a Narges.
    note: El intercambio empieza con el saludo antes de las presentaciones.
  fa.a1.unit01.lesson06.teach.line02:
    title: Bienvenida, respuesta
    gloss: Narges le devuelve el saludo y le da las gracias.
    note: ممنون (gracias) es una respuesta natural a una bienvenida.
  fa.a1.unit01.lesson06.teach.line03:
    title: Intercambiar nombres
    gloss: Ali dice quién es.
    note: '*من علی هستم* significa «Soy Ali». *هستم* (soy) va al final de la frase.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Intercambiar nombres, respuesta
    gloss: Narges dice quién es.
    note: Es el mismo patrón *من ... هستم* que acaba de usar Ali.
  fa.a1.unit01.lesson06.teach.line05:
    title: Mucho gusto
    gloss: Ali dice que se alegra de conocerla.
    note: '*خوشوقتم* significa «me alegro». Con *از آشنایی با شما* forma la frase cortés habitual al conocer a alguien.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Encantado de conocerte, respuesta
    gloss: Narges le devuelve el sentimiento.
    note: همین‌طور significa «igualmente» en esta respuesta.
  fa.a1.unit01.lesson06.teach.line07:
    title: Preguntar cómo está alguien
    gloss: Ali le pregunta con cortesía cómo está.
    note: Ali usa la forma hablada neutra y cortés con ـتون porque es un primer encuentro formal.
  fa.a1.unit01.lesson06.teach.line08:
    title: Preguntar cómo está alguien, respuesta
    gloss: Narges responde y le devuelve la pregunta.
    note: شما چطور؟ repite la pregunta para devolverla, un atajo muy común.
  fa.a1.unit01.lesson06.teach.line09:
    title: Invitación
    gloss: Ali dice que él también está bien e invita a Narges a pasar.
    note: '*بفرمایید داخل* significa «pasa, por favor». *داخل* (dentro) indica lo que se ofrece.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Rechazo cortés
    gloss: Narges le da las gracias, pero explica que debe irse.
    note: Un rechazo cortés empieza con un agradecimiento antes de la negativa. *ولی باید برم* significa «pero tengo que irme».
  fa.a1.unit01.lesson06.teach.line11:
    title: Cerrar la conversación
    gloss: Ali acepta su respuesta y espera volver a verla.
    note: La invitación rechazada lleva de forma natural a la despedida.
  fa.a1.unit01.lesson06.teach.line12:
    title: Cerrar la conversación, respuesta
    gloss: Narges se despide.
    note: '*خداحافظ* es la despedida general más habitual.'
