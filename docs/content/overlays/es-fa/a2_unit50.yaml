teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: Una cita y cómo cambiarla
    gloss: cita, nuestra cita, cambiar, mañana
    note: '*قرار* es una cita para encontrarse. *قرارمون* es «nuestra cita» (*ـمون* significa «nuestro/a»). *عوض کردن* significa «cambiar» y se usa con *رو*.'
    example_gloss:
    - Mañana tengo una cita con Nima.
    - Estamos cambiando nuestra cita.
    - Hoy cambiamos nuestra cita.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: Perdón, lamentablemente, no puedo
    gloss: disculpa / perdón, lamentablemente, no puedo, no podemos
    note: '*ببخشید* y *متأسفانه* suavizan las malas noticias. *نمی‌تونم* es «no puedo» y *نمی‌تونیم* es «no podemos».'
    example_gloss:
    - Perdón, mañana no puedo venir.
    - Lamentablemente mañana tengo trabajo.
    - Lamentablemente Nima no puede venir mañana.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: Retrasos y no estar disponible
    gloss: retraso, estoy ocupado/a, urgente
    note: '*تأخیر دارم* indica que vas con retraso. *گرفتارم* significa que estás ocupado/a, y *فوری* describe algo urgente.'
    example_gloss:
    - Voy con retraso.
    - Estoy ocupado/a; no puedo ir.
    - Tengo trabajo urgente.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: Una petición educada para cambiar
    gloss: Perdona, ¿podemos cambiar nuestra cita?
    note: '*می‌شه … ؟* pregunta con cortesía si algo es posible. El verbo termina en *ـیم* («nosotros») porque la petición usa «nosotros».'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'Dos maneras de preguntar: می‌شه y می‌تونیم'
    gloss: ¿Se puede cambiar nuestra cita? ¿Podemos cambiar nuestra cita?
    note: Las dos preguntas son corteses. *می‌شه* es la forma hablada más habitual; *می‌تونیم* suena algo más directa. Después de cualquiera de las dos, el verbo va en la forma *کنیم*, no en *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: Dar una razón
    gloss: porque, tener que, trabajo, estoy enfermo/a
    note: '*چون* introduce la causa y puede ir al principio o en la segunda parte de la frase. *باید کار کنم* significa «tengo que trabajar».'
    example_gloss:
    - No puedo ir porque estoy enfermo/a.
    - Como tengo que trabajar, llego tarde.
    - Como tengo trabajo, no puedo.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'Primero la causa, después el resultado: برای همین'
    gloss: Estoy enfermo/a, por eso no puedo ir.
    note: '*برای همین* significa «por eso». Se usa después de la causa en lugar de *چون*; no pongas ambos en la misma frase.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: Días y horas para una nueva cita
    gloss: jueves, viernes, las cuatro, las seis
    note: Di primero el día y luego *ساعت* más el número.
    example_gloss:
    - Tengo tiempo el viernes a las cuatro.
    - Puedo ir el jueves a las seis.
    - Mañana a las seis tengo trabajo.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: Proponer una hora
    gloss: ¿Te viene bien el viernes a las cuatro? ¿Puedes venir?
    note: '*برات خوبه؟* pregunta si la hora le viene bien a una persona de confianza. Con alguien a quien tratas de *شما*, di *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: Cambiar una cita en tres pasos
    gloss: Mañana no puedo ir porque tengo que trabajar. ¿Te viene bien el viernes a las cuatro?
    note: Primero di que no puedes ir, luego da la razón con *چون* y después propón un nuevo día y una nueva hora. Dar una razón hace que la petición suene cortés.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: Terminar y llamar
    gloss: terminó, termine / esté terminado, te llamaré, llámame
    note: '*تموم شد* es pasado («terminó»); *تموم بشه* es la forma que se usa después de *وقتی* para hablar del futuro.'
    example_gloss:
    - Mi trabajo terminó.
    - Mi trabajo termina a las seis.
    - Mañana te llamo.
    - Por favor, llámame.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: Confirmar o aplazar
    gloss: confirmado, atrás / más tarde, pongamos
    note: '*قطعی* indica que una cita está confirmada. *عقب بندازیم* es la manera hablada y natural de decir «aplacemos».'
    example_gloss:
    - Nuestra cita quedó confirmada.
    - Aplacemos nuestra cita.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی con el futuro y con el pasado
    gloss: Cuando termine mi trabajo, te llamaré. Cuando terminó mi trabajo, te llamé.
    note: Para el futuro, la oración con *وقتی* usa la forma con *ب* (*تموم بشه*) y el verbo principal va en presente simple (*زنگ می‌زنم*). Para el pasado, ambos verbos van en pasado.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه y بعد از اینکه
    gloss: Antes de irme, te llamaré. Después de llegar, te llamaré.
    note: 'Después de *قبل از اینکه* («antes de que») y *بعد از اینکه* («después de que») se usa un verbo con *ب* cuando el plan es futuro: *برم*, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: El mismo patrón en pasado
    gloss: Cuando llegué, te llamé. Después de llegar, te llamé.
    note: 'En pasado, la oración usa un verbo pasado normal: *رسیدم*. Compáralo con el futuro, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: Si, adecuado, ¿qué tal?, peluquería, bici
    gloss: si, no es adecuado, ¿qué tal?, peluquería, bicicleta
    note: '*چطوره؟* sugiere una alternativa: *دوشنبه چطوره؟* significa «¿Qué tal el lunes?».'
    example_gloss:
    - ¿Qué tal el lunes?
    - ¿No te viene bien el sábado?
    - El jueves tengo cita en la peluquería.
    - Quiero una bici.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه para una situación posible
    gloss: Si tienes tiempo, podemos ir el sábado. Si llueve, cambiaremos nuestra cita.
    note: Después de *اگه* se usa la forma con *ب* o *داشته باشی*; la oración principal va en presente simple. Pon primero la parte con *اگه* y una coma después.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: Plan B con اگه
    gloss: Si no puedes venir, llámame. Si el sábado no te viene bien, ¿qué tal el lunes?
    note: '*اگه … نمی‌تونی* le da a la otra persona una salida, y *چطوره؟* ofrece un nuevo día.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: Peticiones corteses a un negocio
    gloss: Por favor, deme otra cita. ¿Puedo cambiar mi cita?
    note: Usa *لطفا* y el verbo en forma *شما* (*بدید*) con una peluquería, una tienda o un lugar de alquiler. *می‌شه … ؟* sirve igual con *شما* y con *تو*.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: Una nota para cambiar una cita
    gloss: Sara, ¡hola! Lamentablemente mañana no puedo ir, porque tengo que trabajar. ¿Podemos cambiar nuestra cita? ¿Te viene bien el viernes a las cuatro? Si el viernes no puedes, yo puedo el sábado a las diez. Cuando termine mi trabajo, te llamaré.
    note: Lee una vez para encontrar la razón y otra vez para encontrar las dos horas propuestas.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: Sara se lo recuerda a Nima
    gloss: Nima, mañana a las diez tenemos nuestra cita.
    note: Sara menciona la cita.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: Nima pide un cambio
    gloss: Perdona, Sara, lamentablemente mañana no puedo ir, porque tengo que trabajar. ¿Podemos cambiar nuestra cita?
    note: Nima se disculpa, da la razón y pide con cortesía.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: Sara acepta y propone el viernes
    gloss: Sí, no hay problema. ¿Te viene bien el viernes a las diez?
    note: Sara acepta y ofrece una nueva hora.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: Nima dice que no y sugiere el sábado
    gloss: El viernes no puedo, porque tengo cita con el médico. ¿Qué tal el sábado?
    note: Nima da una razón y una alternativa.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: Sara acepta el sábado
    gloss: El sábado a las diez está bien. Reservaré las bicis para el sábado.
    note: Las bicis también pasan al nuevo día.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: Nima da las gracias a Sara
    gloss: ¡Genial, gracias! Cuando termine mi trabajo, te llamaré.
    note: Nima termina con una oración temporal.
