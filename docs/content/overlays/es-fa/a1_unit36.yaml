teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Amable
    gloss: amable / cariñoso/a
    note: '*مهربون* describe a alguien amable o de buen corazón.'
    example_gloss: Sara es muy amable.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Gracioso
    gloss: gracioso
    note: '*بامزه* describe a alguien gracioso o divertido.'
    example_gloss: Nima es gracioso.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Tímido
    gloss: tímido
    note: '*خجالتی* describe a alguien tímido.'
    example_gloss: Es un poco tímido/a.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Serio
    gloss: serio/a
    note: '*جدی* describe a alguien que es serio.'
    example_gloss: Nuestro profesor es serio.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Cómo se une el «es» fusionado a las palabras de personalidad
    gloss: es amable / gracioso/a / tímido/a (cópula fusionada)
    note: '*مهربونه* une directamente *مهربون* + *است*, porque *مهربون* termina en consonante. *بامزه‌ست* lleva un ZWNJ escrito antes de *ست*, porque *بامزه* ya termina en la vocal *ه*. *خجالتیه* añade *ه* directamente a una palabra terminada en *ی*, igual que *قهوه‌ایه* de la unidad de apariencia.'
    target_text: مهربونه = مهربون + است (la forma fusionada de «es» tras consonante) / بامزه‌ست = بامزه + است (tras vocal, con ZWNJ) / خجالتیه = خجالتی + ه (tras ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Inteligente
    gloss: listo/a / inteligente
    note: '*زرنگ* describe a alguien listo o astuto, sobre todo ingenioso en lo práctico.'
    example_gloss: Maryam es muy lista.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Perezoso
    gloss: perezoso
    note: '*تنبل* describe a alguien perezoso.'
    example_gloss: Hoy estoy un poco perezoso/a.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Trabajador
    gloss: trabajador, esforzado
    note: '*زحمت‌کش* describe a alguien que trabaja duro y se esfuerza de verdad.'
    example_gloss: Mi padre es muy trabajador.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Paciente
    gloss: paciente
    note: '*صبور* describe a alguien paciente.'
    example_gloss: Nuestro profesor es muy paciente.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Cómo negar un rasgo de personalidad
    gloss: no es perezoso/a
    note: '*نیست* niega la cópula fusionada: *تنبل نیست* significa «no es perezoso/a», el mismo *نیست* que ya aprendiste para negar sentimientos.'
    target_text: تنبل نیست (no es perezoso/a) -- نیست niega la cópula fusionada
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Personalidad
    gloss: personalidad
    note: '*شخصیت* significa «personalidad» o «carácter».'
    example_gloss: Su personalidad es muy buena.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: ¿Cómo es su personalidad?
    gloss: ¿Cómo es su personalidad?
    note: '*چطوره؟* («¿cómo es...?») ya se vio en la unidad de saludos; *ش* es el sufijo posesivo «su» (de él/ella), unido a *شخصیت* («personalidad»).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: Es muy amable e inteligente
    gloss: Es muy amable e inteligente
    note: '*و* significa «y» y une dos palabras de personalidad.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: ¿Cómo es?
    gloss: ¿Cómo es?
    note: '*چه جوریه؟* es una forma informal y común de preguntar «¿cómo es él/ella?», una alternativa a *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Personalidad / ¿cómo es...? / ¿cómo es...?
    gloss: personalidad / ¿cómo es...? / ¿cómo es...?
    note: Estas tres expresiones te permiten preguntar por la personalidad de alguien y nombrarla.
    target_text: شخصیت (personalidad) / چطوره؟ (¿cómo es...?) / چه جوریه؟ (¿qué tal es...?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / en absoluto / solo / genial
    gloss: Nima / Sara / Maryam / en absoluto / solo / genial
    note: '*مریم* es amiga de *سارا* y ya apareció en la unidad de apariencia. *اصلاً* significa «en absoluto». *فقط* significa «solo». *باحال* significa «genial» o «simpático».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Me gustaría conocerla más
    gloss: Me gustaría conocerla más
    note: '*بیشتر* significa «más». *باهاش* significa «con él/ella». *آشنا بشم* significa «llegar a conocer».'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, ¿cómo es Maryam?'
    gloss: Sara, ¿cómo es Maryam?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: Es muy amable e inteligente.'
    gloss: Es muy amable e inteligente.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: ¿No es perezosa?'
    gloss: ¿No es perezosa?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: No, para nada, además es muy trabajadora. Solo es un poco tímida.'
    gloss: No, para nada, además es muy trabajadora. Solo es un poco tímida.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: ¡Qué bien! Me gustaría conocerla más.'
    gloss: ¡Qué bien! Me gustaría conocerla más.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lectura: la personalidad de Maryam'
    gloss: Maryam es amiga de Sara. Es muy amable e inteligente. En su trabajo también es muy trabajadora y nunca es perezosa. Solo es un poco tímida, por eso no habla mucho en grupos grandes.
    note: La lectura describe la personalidad de Maryam en tercera persona, con los mismos rasgos del diálogo.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Nunca (con verbo negativo)
    gloss: nunca
    note: '*هیچ‌وقت* se combina con un verbo negativo (*نیست*, *نمی‌زنه*) y significa «nunca». En persa la negación se repite, como en español en «no ... nunca».'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Creo que soy muy trabajador/a, pero también un poco perezoso/a
    gloss: Creo que soy muy trabajador/a, pero también un poco perezoso/a
    note: '*فکر می‌کنم* significa «creo». *زحمت‌کشم* une *زحمت‌کش* + *هستم* («soy»). *هستم* es la forma completa, sin fusionar, de «soy», y aquí se usa después de *هم* («también») para dar énfasis.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: ¿Cómo es tu personalidad?
    gloss: ¿Cómo es tu personalidad?
    note: '*شخصیتت* añade a *شخصیت* el sufijo posesivo informal *ت* («tu»), la versión en registro *تو* de *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Amable / gracioso/a / tímido/a / serio/a / listo/a / trabajador/a / paciente
    gloss: amable / gracioso/a / tímido/a / serio/a / listo/a / perezoso/a / trabajador/a / paciente
    note: Estas son las ocho palabras básicas de personalidad de esta unidad.
