teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: Pequeños problemas
    gloss: Me duele la cabeza, me siento mal, tengo un examen, no tengo dinero
    note: 'Estos son los problemas sobre los que la unidad da consejos: salud, estudio y dinero. *سرم درد می‌کنه* dice literalmente «mi cabeza duele».'
    example_gloss:
    - Hoy me duele la cabeza.
    - Mañana tengo un examen.
    - Me siento mal y no tengo dinero.
  fa.a2.unit32.lesson01.teach.helpers:
    title: Palabras de salud, estudio y dinero
    gloss: descanso, médico, farmacia, medicina, agua, café, lección/estudio, gasto
    note: '*داروخونه* es la forma hablada habitual de «farmacia». *درس* es «lección» y también el objeto de «estudiar»: *درس بخونی*.'
    example_gloss:
    - Tengo agua y café.
    - Esta noche tengo una clase.
    - El médico y la farmacia.
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: Formas verbales para dar consejos
    gloss: descanses, vayas, bebas, estudies, duermas, gastes; temprano, más, menos
    note: 'Son las formas de *تو* terminadas en *-ی*: *کنی، بری، بخوری، بخونی، بخوابی*. Son el subjuntivo y van después de *بهتره*.'
    example_gloss:
    - (que) te acuestes temprano.
    - (que) estudies más.
    - (que) gastes menos.
  fa.a2.unit32.lesson01.teach.bahtare:
    title: بهتره + subjuntivo
    gloss: Es mejor que vayas al médico; es mejor que descanses
    note: '*بهتره* significa «es mejor (que)…» y sirve para dar consejos con suavidad. El verbo que va después está en subjuntivo, aquí con la terminación *-ی* de *تو*: *بهتره بری*, *بهتره استراحت کنی*. No hay ninguna palabra adicional entre *بهتره* y el verbo.'
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: En mi opinión
    gloss: creo, en mi opinión
    note: '*به نظرم* dice literalmente «a mi parecer» y es la manera habitual de suavizar un consejo.'
    example_gloss:
    - Creo que sería mejor que bebieras agua.
    - Creo que sería mejor que fueras al médico.
  fa.a2.unit32.lesson02.teach.opinion_rule:
    title: به نظرم antes de بهتره
    gloss: Creo que sería mejor que estudies más
    note: 'Pon *به نظرم* al principio y mantén la misma estructura después: *به نظرم بهتره + subjunctive*. Así el consejo suena a opinión tuya y no a una orden.'
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: Formas verbales negativas
    gloss: (que) no bebas, no vayas, no duermas, no hagas; tarde, mucho, muy
    note: 'El negativo de cada forma de subjuntivo de *تو* añade *نـ* delante: *بخوری → نخوری*, *بری → نری*, *بخوابی → نخوابی*, *کنی → نکنی*.'
    example_gloss:
    - (que) no bebas café.
    - (que) no te acuestes tarde.
    - (que) no gastes mucho.
  fa.a2.unit32.lesson03.teach.must:
    title: Deber
    gloss: deber, tener que
    note: '*باید* expresa una obligación fuerte: *باید بری دکتر* = «tienes que ir al médico».'
    example_gloss:
    - Mañana tienes que estudiar más.
    - Hoy tienes que ir al médico.
  fa.a2.unit32.lesson03.teach.negative_rule:
    title: Consejos en negativo
    gloss: Es mejor que no bebas café; es mejor que no te acuestes tarde
    note: 'Para decir «es mejor que no…», mantén *بهتره* y pon *نـ* en el verbo: *بهتره قهوه نخوری*. No pongas la negación en *بهتره*.'
  fa.a2.unit32.lesson03.teach.must_vs_better:
    title: باید es más fuerte que بهتره
    gloss: Tienes que ir al médico; es mejor que vayas al médico
    note: Usa *بهتره* para un consejo amistoso que se puede ignorar y *باید* cuando algo es realmente necesario. Ambos van seguidos de la misma forma verbal del tipo *بری*.
  fa.a2.unit32.lesson04.teach.question:
    title: ¿Qué hago?
    gloss: ¿Qué hago?
    note: '*چیکار کنم؟* es la forma hablada habitual de pedir consejo. El verbo *کنم* es la forma de subjuntivo de *من*.'
  fa.a2.unit32.lesson04.teach.responses:
    title: Responder a un consejo
    gloss: sí, tienes razón, es una buena idea, no lo sé, quizás, no
    note: '*حق با توئه* dice literalmente «la razón está contigo». Son formas amistosas de aceptar un consejo, dudar o rechazarlo.'
    example_gloss:
    - Sí, tienes razón.
    - Es una buena idea.
    - No lo sé, quizás.
  fa.a2.unit32.lesson04.teach.respond_rule:
    title: Tres maneras de responder a un consejo
    gloss: Sí, buena idea; no lo sé, quizás
    note: Acepta con *آره، حق با توئه* o *فکر خوبیه*. Si no estás seguro, di *نمی‌دونم، شاید*. Un simple *نه* es posible, pero suena seco.
  fa.a2.unit32.lesson05.teach.reading:
    title: Un mensaje y una respuesta
    gloss: Hola, Sara. Mañana tengo un examen, pero me duele la cabeza y me siento mal. ¿Qué hago? Hola, Nima. Creo que lo mejor es que esta noche descanses y bebas agua. Es mejor que no tomes café y que te acuestes temprano.
    note: Las tres primeras frases son el mensaje de Nima; el resto es la respuesta de Sara. Busca primero el problema y después los tres consejos.
  fa.a2.unit32.lesson06.teach.turn01:
    title: Turno 1
    gloss: Nima describe su problema y pregunta qué hacer.
    note: Da dos datos y luego pide consejo.
  fa.a2.unit32.lesson06.teach.turn02:
    title: Turno 2
    gloss: Sara da dos consejos.
    note: '*به نظرم* suaviza el consejo.'
  fa.a2.unit32.lesson06.teach.turn03:
    title: Turno 3
    gloss: Nima acepta el consejo, pero dice que tiene que estudiar.
    note: '*باید* aquí expresa la obligación fuerte de Nima mismo.'
  fa.a2.unit32.lesson06.teach.turn04:
    title: Turno 4
    gloss: Sara le aconseja que no estudie esta noche y que se acueste temprano.
    note: Consejo negativo y luego consejo afirmativo.
  fa.a2.unit32.lesson06.teach.turn05:
    title: Turno 5
    gloss: Nima no está seguro, pero admite que ella puede tener razón.
    note: Una respuesta dudosa a un consejo.
  fa.a2.unit32.lesson06.teach.turn06:
    title: Turno 6
    gloss: 'Sara añade: entonces es mejor que vayas al médico mañana.'
    note: '*پس* significa «entonces, pues».'
