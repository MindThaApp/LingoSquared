teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: Personas y tiempo
    gloss: yo, tú, Sara, Nima, hoy, mañana (parte del día), tarde
    note: '*امروز صبح* significa «esta mañana». En persa suele omitirse *من* porque la terminación del verbo ya indica «yo».'
    example_gloss:
    - Esta mañana me desperté tarde.
    - Sara llamó hoy a Nima.
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: Palabras de la mañana y del trayecto
    gloss: casa, ducha, ropa, desayuno, llave, puerta, coche, autobús
    note: '*صبحونه* es la forma hablada habitual de «desayuno»; en la escritura cuidada se usa *صبحانه*.'
    example_gloss:
    - Me duché en casa.
    - Desayuné y me vestí.
    - Mi llave estaba en el coche.
  fa.a2.unit22.lesson01.teach.actions:
    title: Cuatro acciones de la mañana
    gloss: Me desperté, me duché, me vestí, desayuné
    note: Cada expresión termina en un verbo ligero en pasado simple. Aprende la expresión completa como una sola acción.
    example_gloss:
    - Me desperté esta mañana.
    - Luego me duché.
    - Me vestí y desayuné.
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: Verbos compuestos en pasado
    gloss: Me desperté, me duché, me vestí
    note: 'Muchas acciones en persa constan de dos partes: un sustantivo o adjetivo más un verbo ligero. La segunda parte lleva el tiempo pasado: *بیدار شدم*, *دوش گرفتم*, *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: Puertas, coches, llamadas y cartas
    gloss: Abrí la puerta, cerré la puerta, arranqué el coche, llamé, escribí una carta
    note: '*رو* marca un complemento directo determinado en lengua hablada: *در رو* es «la puerta» y *ماشین رو* es «el coche».'
    example_gloss:
    - Abrí la puerta y luego la cerré.
    - Arranqué el coche.
    - Llamé a Sara y escribí una carta.
  fa.a2.unit22.lesson02.teach.small_words:
    title: Palabras pequeñas útiles
    gloss: a, un, y, pero, qué, llegué
    note: '*یه* es la forma hablada habitual de «un/una». *رسیدم* cierra el relato de un trayecto: «llegué».'
    example_gloss:
    - Llamé a Sara.
    - Escribí una carta, pero llegué tarde.
  fa.a2.unit22.lesson02.teach.sequence:
    title: Palabras para ordenar los pasos
    gloss: primero, luego, después de eso, al final, para entonces
    note: 'Usa estas palabras para dejar claro el orden. *تا اون موقع* significa «para entonces». Con ella, el hecho anterior va en pretérito pluscuamperfecto (participio + بود): *اتوبوس رفته بود* = el autobús ya se había ido. Practicarás esta forma en una unidad posterior.'
    example_gloss:
    - Primero abrí la puerta.
    - Después de eso arranqué el coche.
    - Para entonces ya era tarde; al final llegué.
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: El verbo ligero lleva el tiempo
    gloss: abrí, encendí, llamé, me desperté
    note: 'El primer elemento nombra la acción; el segundo cambia según el tiempo y la persona: *باز کردم*, *روشن کردم*, *زنگ زدم*, *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: رو para lo determinado, یه para lo indeterminado
    gloss: Abrí la puerta; escribí una carta
    note: 'Usa *رو* hablado después de un complemento determinado: *در رو باز کردم*. Un complemento indeterminado con *یه* normalmente no lleva *رو*: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: Verbos compuestos en negativo
    gloss: No trabajé, no llamé, no desayuné, no abrí la puerta
    note: 'Pon *نـ* en el verbo ligero conjugado: *کار نکردم*, *زنگ نزدم*, *صبحونه نخوردم*. El sustantivo no cambia.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: Niega el verbo ligero, no el sustantivo
    gloss: نـ se une al verbo ligero
    note: Di *کار نکردم* y *زنگ نزدم*. Si pasas la negación al sustantivo, la forma es incorrecta.
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو presente o ausente
    gloss: Cerré la puerta; escribí una carta
    note: '*در* es una puerta conocida y determinada, por eso lleva *رو*. *یه نامه* es indeterminado, por eso no lo lleva.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: Cuando la mañana sale mal
    gloss: Lo encontré, no lo encontré, se me olvidó, perdí el autobús
    note: '*از دستم رفت* dice literalmente que algo «se me fue de la mano»; con un autobús significa «lo perdí».'
    example_gloss:
    - Encontré mi llave.
    - No encontré mi llave y perdí el autobús.
    - Se me olvidó la carta.
  fa.a2.unit22.lesson04.teach.question:
    title: ¿Qué pasó después?
    gloss: ¿Qué pasó esta mañana? ¿Qué pasó después?
    note: Estas preguntas piden un relato ordenado; responde con palabras de secuencia y formas de pasado.
  fa.a2.unit22.lesson05.teach.reading:
    title: Una mañana que salió mal
    gloss: Esta mañana me desperté tarde. Primero me duché y me vestí. No desayuné. Después cerré la puerta, pero no encontré mi llave. Para entonces el autobús ya se había ido. Al final llamé a Sara y llegué en coche.
    note: Lee una vez para ver las acciones en orden y otra vez para fijarte en los dos pasos que no salieron como se esperaba.
  fa.a2.unit22.lesson06.teach.turn01:
    title: Sara pregunta qué pasó
    gloss: 'Sara le pregunta a Nima: ¿Qué pasó esta mañana?'
    note: La pregunta inicial pide toda la secuencia.
  fa.a2.unit22.lesson06.teach.turn02:
    title: Nima empieza el relato
    gloss: Nima se despertó tarde
    showered and dressed: null
    but did not eat breakfast.: null
    note: El paso negativo contrasta con los pasos que sí se completaron.
  fa.a2.unit22.lesson06.teach.turn03:
    title: Sara pregunta por el siguiente paso
    gloss: 'Sara pregunta: ¿Qué pasó después?'
    note: '*بعدش* mantiene el relato en marcha.'
  fa.a2.unit22.lesson06.teach.turn04:
    title: El problema del trayecto
    gloss: Nima no encontró su llave y para entonces el autobús ya se había ido.
    note: Los dos hechos explican dónde se torció la mañana.
  fa.a2.unit22.lesson06.teach.turn05:
    title: Sara pregunta por el final
    gloss: 'Sara pregunta: ¿Qué hiciste al final?'
    note: '*آخرش* señala el último paso.'
  fa.a2.unit22.lesson06.teach.turn06:
    title: Nima termina el relato
    gloss: Nima llamó a Sara
    started the car: null
    and finally arrived.: null
    note: Las dos últimas acciones completadas resuelven el problema del trayecto.
