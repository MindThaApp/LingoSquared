teaching:
  fa.a1.unit31.lesson01.teach.tavallod_word:
    title: Cumpleaños
    gloss: cumpleaños
    note: '*تولد* es la palabra habitual para «cumpleaños».'
    example_gloss: Hoy es mi cumpleaños.
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Fiesta
    gloss: fiesta
    note: '*مهمونی* es la palabra hablada de uso cotidiano para «fiesta» o «reunión»; la forma escrita es *مهمانی*.'
    example_gloss: La fiesta es hoy.
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Pastel
    gloss: pastel
    note: '*کیک* es la palabra habitual para «pastel» o «tarta».'
    example_gloss: Este pastel está delicioso.
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Regalo
    gloss: regalo
    note: '*هدیه* significa «regalo».'
    example_gloss: Me gusta el regalo.
  fa.a1.unit31.lesson01.teach.review_words:
    title: Hoy / año / tengo / y
    gloss: hoy / año / tengo / y
    note: '*امروز*, *سال*, *دارم* y *و* son palabras conocidas que vuelven a aparecer aquí para hablar de celebraciones.'
    target_text: امروز (hoy) / سال (año) / دارم (tengo) / و (y)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: Cumpleaños + mi + es = es mi cumpleaños
    gloss: cumpleaños + mi + es = es mi cumpleaños
    note: '*تولد* + la terminación posesiva *-م* («mi») + la *-ه* coloquial («es») da *تولدمه*, «es mi cumpleaños».'
    target_text: تولد (cumpleaños) + م + ه = تولدمه (es mi cumpleaños)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Hoy es mi cumpleaños y tengo una fiesta
    gloss: Hoy es mi cumpleaños y tengo una fiesta
    note: '*امروز تولدمه و مهمونی دارم* combina *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Cuándo
    gloss: cuándo
    note: '*کِی* significa «cuándo»; fíjate en la kasra, que lo distingue de *کی* («quién»).'
    example_gloss: ¿Cuándo es la fiesta?
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: ¿Cuándo es tu cumpleaños?
    gloss: ¿Cuándo es tu cumpleaños?
    note: '*تولدت کِیه؟* combina *تولد* + el posesivo informal *-ت* («tu», como en *چند سالته؟*) + *کِیه* (*کِی* + la *-ه* coloquial, «es»).'
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: El 10 / Ordibehesht
    gloss: décimo / Ordibehesht (2.º mes iraní)
    note: '*دهم* y *اردیبهشت* vuelven a aparecer aquí para dar una fecha real.'
    target_text: دهم (décimo) / اردیبهشت (Ordibehesht, 2.º mes iraní)
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: Mi cumpleaños es el 10 de Ordibehesht
    gloss: Mi cumpleaños es el 10 de Ordibehesht
    note: '*تولدم دهم اردیبهشته* añade la *-ه* coloquial («es») al nombre del mes, como en otras fechas que ya has visto.'
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Invitación / sin falta / voy (vengo)
    gloss: invitación / sin falta / vengo
    note: '*دعوت*, *حتماً* y *میام* vuelven a aparecer aquí para hablar de fiestas.'
    target_text: دعوت (invitación) / حتماً (seguro, sin falta) / میام (voy, vengo)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Vengo -> vienes (informal)
    gloss: vengo -> vienes (informal)
    note: '*میای* es la forma informal de «tú» de *میام* («yo vengo»), igual que *می‌خونی* corresponde a *می‌خونم*.'
    target_text: میام (voy, vengo) -> میای (vas, vienes; informal)
  fa.a1.unit31.lesson03.teach.review_be:
    title: A
    gloss: a
    note: '*به* («a») vuelve a aparecer aquí en «a la fiesta».'
    target_text: به (a)
  fa.a1.unit31.lesson03.teach.question_invite:
    title: ¿Vienes a mi fiesta de cumpleaños?
    gloss: ¿Vienes a mi fiesta de cumpleaños?
    note: '*میای به مهمونی تولدم؟* reúne todas las piezas de esta lección.'
  fa.a1.unit31.lesson03.teach.review_are:
    title: Sí
    gloss: sí
    note: '*آره* («sí», informal) vuelve a aparecer aquí.'
    target_text: آره (sí, coloquial)
  fa.a1.unit31.lesson03.teach.answer_accept_invite:
    title: ¡Sí, claro que voy!
    gloss: ¡Sí, claro que voy!
    note: '*آره، حتماً میام!* acepta la invitación.'
  fa.a1.unit31.lesson04.teach.mobarak_word:
    title: Felicidades / feliz
    gloss: felicidades / feliz
    note: '*مبارک* se usa en expresiones como *تولدت مبارک* («feliz cumpleaños»).'
    example_gloss: ¡Feliz cumpleaños!
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: Mañana / gracias / qué bonito
    gloss: mañana / gracias / qué bien
    note: '*فردا*, *ممنون* y *چه خوب* vuelven a aparecer aquí.'
    target_text: فردا (mañana) / ممنون (gracias) / چه خوب (qué bien)
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Nima: ¡Sara, mañana es mi cumpleaños!'
    gloss: ¡Sara, mañana es mi cumpleaños!
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Sara: ¡Feliz cumpleaños, Nima!'
    gloss: ¡Feliz cumpleaños, Nima!
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Nima: ¡Gracias! ¿Vienes a la fiesta?'
    gloss: ¡Gracias! ¿Vienes a la fiesta?
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Sara: Sí, claro que voy. Te compro un regalo.'
    gloss: Sí, claro que voy. Te compro un regalo.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Nima: ¡Qué bien! Gracias, Sara.'
    gloss: ¡Qué bien! Gracias, Sara.
  fa.a1.unit31.lesson05.teach.review_migire:
    title: Recibo -> él/ella recibe
    gloss: compro -> compra (él/ella)
    note: '*می‌گیره* es la forma coloquial de tercera persona de *می‌گیرم*, igual que *می‌خونه* viene de *می‌خونم*.'
    target_text: می‌گیرم (compro, recibo) -> می‌گیره (él/ella compra, recibe)
  fa.a1.unit31.lesson05.teach.review_barash:
    title: Para ti -> para él/ella
    gloss: para ti -> para él/ella
    note: '*براش* («para él/ella») es la versión de tercera persona de *برات* («para ti»).'
    target_text: برات (para ti) -> براش (para él/ella)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: Él/ella / es de Nima / él/ella viene
    gloss: él/ella / es de Nima / viene (él/ella)
    note: '*او* y *میاد* se necesitan para hablar de *نیما* en tercera persona; *نیماست* une *نیما* + *است* («es»).'
    target_text: او (él/ella) / نیماست (es de Nima) / میاد (él/ella viene)
  fa.a1.unit31.lesson05.teach.reading_text:
    title: 'Lectura: el cumpleaños de Nima'
    gloss: Mañana es el cumpleaños de Nima. Sara le compra un regalo y va a la fiesta.
    note: Esta lectura cuenta el diálogo en tercera persona.
  fa.a1.unit31.lesson06.teach.jashn_word:
    title: Celebración
    gloss: celebración
    note: '*جشن* es la palabra general para «celebración», distinta de la más concreta *مهمونی* («fiesta»).'
    example_gloss: Es mi celebración de cumpleaños.
  fa.a1.unit31.lesson06.teach.review_ha_plural:
    title: Fiestas / cumpleaños
    gloss: celebraciones / cumpleaños
    note: '*جشن‌ها* y *تولدها* añaden el sufijo de plural *-ها* directamente a *جشن* y *تولد*.'
    target_text: جشن‌ها (fiestas, celebraciones) / تولدها (cumpleaños)
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: Yo / marcador de objeto directo / me gusta
    gloss: yo / marcador de objeto directo / me gusta
    note: '*من*, *رو* y *دوست* se combinan aquí en una frase para expresar gustos sobre las celebraciones.'
    target_text: من (yo) / رو (marcador de objeto) / دوست دارم (me gusta)
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: Me gustan las celebraciones y los cumpleaños
    gloss: Me gustan las celebraciones y los cumpleaños
    note: '*من جشن‌ها و تولدها رو دوست دارم* usa el conocido patrón de *دوست دارم* y *رو*.'
