course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: nombrar palabras de celebraciones y cumpleaños (cumpleaños, fiesta, pastel, regalo), preguntar y decir cuándo es tu cumpleaños (*تولدت کِیه؟*) con el vocabulario de meses y ordinales ya aprendido, invitar a alguien a una fiesta y aceptar una invitación (*میای به مهمونی؟* / *آره، حتماً میام*), un diálogo de cumpleaños entre Nima y Sara que presenta *تولدت مبارک* («feliz cumpleaños»), una lectura sobre el cumpleaños de Nima y un repaso final para nombrar las celebraciones que te gustan y escribir tu propia invitación o mensaje de felicitación.'
