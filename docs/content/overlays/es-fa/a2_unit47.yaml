teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: Ahora mismo
    gloss: ahora, ahora mismo, libro, qué estás haciendo
    note: '*الان* es «ahora»; *همین الان* es «ahora mismo, en este mismo momento».'
    example_gloss:
    - Ahora estoy leyendo un libro.
    - Ahora mismo estoy leyendo un libro.
    - ¿Qué estás haciendo ahora?
  fa.a2.unit47.lesson01.teach.persons:
    title: Estar en plena acción
    gloss: estoy (haciendo), estás, él / ella está, estamos, ustedes están, ellos están
    note: Pon *دارم* (o *داری, داره …*) delante del verbo en presente. Indica que estás en medio de la acción en este momento.
    example_gloss:
    - Estoy leyendo un libro.
    - Estás leyendo un libro.
    - Él / ella está leyendo un libro.
    - Estamos leyendo un libro.
    - Ustedes están leyendo un libro.
    - Ellos están leyendo un libro.
  fa.a2.unit47.lesson01.teach.verbs:
    title: Presente de خوندن
    gloss: leo, lees, él / ella lee, leemos, ustedes leen, ellos leen
    note: 'Las dos partes del progresivo llevan la misma persona: *دارم … می‌خونم*, *داری … می‌خونی*.'
    example_gloss:
    - Leo todos los días.
    - Lees todos los días.
    - Él / ella lee todos los días.
    - Leemos todos los días.
    - Ustedes leen todos los días.
    - Ellos leen todos los días.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم más el presente
    gloss: Estoy leyendo un libro; él está leyendo un libro
    note: 'Toma el presente hablado (*می‌خونم*) y pon *دارم* delante. Cambia ambos según la persona: *دارم … می‌خونم*, *داره … می‌خونه*. El complemento directo queda entre los dos.'
  fa.a2.unit47.lesson02.teach.habit:
    title: Palabras para los hábitos
    gloss: cada, día, por las noches, trabajo
    note: '*هر روز* y *شب‌ها* indican que la acción es un hábito, no algo que ocurre ahora mismo.'
    example_gloss:
    - Trabajo todos los días.
    - Por las noches leo libros.
  fa.a2.unit47.lesson02.teach.work:
    title: Trabajar
    gloss: trabajo, estoy trabajando
    note: '*کار می‌کنم* puede ser un hábito («trabajo»); *دارم کار می‌کنم* indica que estás trabajando en este momento.'
    example_gloss:
    - Ahora mismo estoy trabajando.
    - Trabajo todos los días.
  fa.a2.unit47.lesson02.teach.contrast:
    title: Hábito o ahora mismo
    gloss: Trabajo todos los días; ahora mismo estoy trabajando
    note: El presente simple (*کار می‌کنم*) sirve para hábitos y hechos. Con *دارم* el mismo verbo indica que estás en plena acción ahora. En la lengua hablada el presente simple también puede usarse para el momento actual, pero *دارم* lo deja claro.
  fa.a2.unit47.lesson02.teach.negative:
    title: Decir que no
    gloss: Ahora no estoy leyendo un libro
    note: 'Para la negación no se usa *دارم*. Se usa el presente negativo simple: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - Ahora no estoy leyendo un libro.
  fa.a2.unit47.lesson03.teach.things:
    title: Palabras de las tareas del hogar
    gloss: la ropa, los platos, barrer (escoba), la cena
    note: '*لباس‌ها* y *ظرف‌ها* son sustantivos en plural; con *رو* son las cosas que se lavan.'
    example_gloss:
    - Ahora estoy lavando la ropa.
    - Ahora estoy lavando los platos.
    - Ahora estoy barriendo.
    - Ahora estoy preparando la cena.
  fa.a2.unit47.lesson03.teach.verbs:
    title: Verbos de las tareas del hogar
    gloss: lavo, barro, preparo
    note: '*شستن* da *می‌شورم*; *جارو کردن* y *درست کردن* son combinaciones de sustantivo + verbo.'
    example_gloss:
    - Estoy lavando la ropa.
    - Estoy barriendo.
    - Estoy preparando la cena.
  fa.a2.unit47.lesson03.teach.others:
    title: Otra persona
    gloss: Nima, él lava, él hace
    note: 'Para otra persona, cambian tanto *دارم* como el verbo: *داره … می‌شوره*.'
    example_gloss:
    - Nima está lavando los platos.
    - Nima está barriendo.
  fa.a2.unit47.lesson03.teach.rule:
    title: El objeto entre las dos partes
    gloss: Estoy lavando los platos; Nima está lavando los platos
    note: El objeto con *رو* va entre *دارم* y el verbo. Con una combinación de sustantivo + verbo como *جارو می‌کنم*, *دارم* va antes de toda la expresión.
  fa.a2.unit47.lesson04.teach.calls:
    title: Empezar una llamada
    gloss: hola (al teléfono), dónde estás, qué haces
    note: '*الو* es como se contesta o se empieza una llamada telefónica.'
    example_gloss:
    - Hola, ¿dónde estás?
    - Hola, ¿qué haces ahora?
  fa.a2.unit47.lesson04.teach.arrive:
    title: En camino
    gloss: voy, llego
    note: '*دارم میام* significa «ya voy / estoy en camino»; *دارم می‌رسم* significa «ya estoy llegando».'
    example_gloss:
    - Ya voy.
    - Ya estoy llegando.
  fa.a2.unit47.lesson04.teach.talk:
    title: Hablar y llamar
    gloss: con, mi mamá, hablar, hablo, llamar, ella / él llama
    note: '*حرف زدن* es «hablar» y *زنگ زدن* es «llamar por teléfono».'
    example_gloss:
    - Estoy hablando con mi mamá.
    - Mi mamá está llamando.
  fa.a2.unit47.lesson04.teach.rule:
    title: El progresivo al teléfono
    gloss: Ya voy; estoy hablando con mi mamá
    note: 'Al teléfono se usa mucho el progresivo: le dice a la otra persona lo que estás haciendo en ese momento. *میام* es la forma hablada normal de «vengo»; *دارم میام* dice que estás en camino.'
  fa.a2.unit47.lesson05.teach.words:
    title: Palabras para el texto
    gloss: es de noche, todos, estamos en casa, los niños, la televisión, ven, también
    note: '*شبه* es «es de noche»; *خونه‌ایم* es «estamos en casa».'
    example_gloss:
    - Ya es de noche y estamos todos en casa.
    - Los niños están viendo la tele.
    - Mi mamá también está llamando.
  fa.a2.unit47.lesson05.teach.reading:
    title: Una noche en casa
    gloss: Ya es de noche y estamos todos en casa. Estoy preparando la cena. Nima está lavando los platos. Los niños están viendo la tele. Mi mamá también está llamando.
    note: Lee una vez para ver quién hace qué y otra vez para fijarte en las formas verbales con *دارم, داره, دارن*.
  fa.a2.unit47.lesson06.teach.turn01:
    title: Sara llama a Nima
    gloss: 'Sara: Hola, Nima, ¿dónde estás?'
    note: '*کجایی؟* pregunta dónde estás.'
  fa.a2.unit47.lesson06.teach.turn02:
    title: Nima está en camino
    gloss: 'Nima: Ya voy. ¿Y tú qué haces?'
    note: '*دارم میام* dice que está en camino.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: Sara está cocinando
    gloss: 'Sara: Estoy preparando la cena.'
    note: '*دارم … درست می‌کنم* es el progresivo.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: Nima pregunta por los niños
    gloss: 'Nima: ¿Y los niños?'
    note: Una pregunta corta que retoma el tema.
  fa.a2.unit47.lesson06.teach.turn05:
    title: Sara responde
    gloss: 'Sara: Están viendo la tele.'
    note: '*دارن … می‌بینن* es la forma de «ellos».'
  fa.a2.unit47.lesson06.teach.turn06:
    title: Nima está llegando
    gloss: 'Nima: Bien. Ya estoy llegando.'
    note: '*دارم می‌رسم* dice que ya casi está allí.'
