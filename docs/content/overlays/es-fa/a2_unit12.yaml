teaching:
  fa.a2.unit12.lesson01.teach.doctor_word:
    title: Médico
    gloss: médico/médica
    note: '*دکتر* es la palabra general para médico.'
    example_gloss: نیما fue al médico.
  fa.a2.unit12.lesson01.teach.headache_word:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: '*سردرد* significa dolor de cabeza.'
    example_gloss: Tengo un fuerte dolor de cabeza.
  fa.a2.unit12.lesson01.teach.symptoms_word:
    title: Síntomas
    gloss: síntomas
    note: '*علائم* es la palabra general para síntomas.'
    example_gloss: El médico preguntó por mis síntomas.
  fa.a2.unit12.lesson01.teach.duration_word:
    title: Duración
    gloss: duración / período de tiempo
    note: '*مدت* es la palabra general para una duración o un período de tiempo.'
    example_gloss: ¿Cuánto tiempo lleva así?
  fa.a2.unit12.lesson01.teach.prescription_word:
    title: Receta
    gloss: receta
    note: '*نسخه* significa receta médica.'
    example_gloss: El médico dio una receta.
  fa.a2.unit12.lesson01.teach.rest_word:
    title: Descanso
    gloss: descanso
    note: '*استراحت* significa reposo.'
    example_gloss: Tengo que descansar unos días.
  fa.a2.unit12.lesson01.teach.bayad_note:
    title: Deber / tener que
    gloss: deber / tener que
    note: '*باید* expresa obligación o consejo: «tener que» o «deber». Es la gramática de nivel A2 que usan las indicaciones del médico en esta unidad.'
    target_text: باید (deber / tener que)
  fa.a2.unit12.lesson02.teach.headache_three_days_severe:
    title: Expresar un síntoma con duración e intensidad
    gloss: Desde hace tres días tengo un fuerte dolor de cabeza.
    note: '*از ... پیش* (desde hace ...) indica la duración; *شدید* (fuerte) indica la intensidad. Es un paso más allá de simplemente nombrar el síntoma, como en A1.'
  fa.a2.unit12.lesson02.teach.doctor_instruction:
    title: Una indicación del médico
    gloss: El médico dijo que tengo que recoger la receta y descansar.
    note: '*باید* aquí transmite la indicación del médico como consejo.'
  fa.a2.unit12.lesson02.teach.full_symptom_and_instruction:
    title: Combinar el síntoma y la indicación
    gloss: Desde hace tres días tengo un fuerte dolor de cabeza. El médico dijo que tengo que descansar.
    note: Es el patrón completo de síntoma más indicación en torno al cual gira esta lección.
  fa.a2.unit12.lesson03.teach.appointment_word:
    title: Cita
    gloss: cita
    note: '*نوبت* es la palabra general para cita o turno.'
    example_gloss: Mi cita es el martes a las 11 de la mañana.
  fa.a2.unit12.lesson03.teach.earlier_word:
    title: Más temprano
    gloss: más temprano
    note: '*زودتر* significa más temprano o antes.'
    example_gloss: Por favor, llegue 15 minutos antes.
  fa.a2.unit12.lesson03.teach.confirmation_text:
    title: Una confirmación de cita
    gloss: Su cita con el Dr. Rezaei es el martes a las 11 de la mañana. Por favor, llegue 15 minutos antes. Si los síntomas no mejoran después de una semana, vuelva a llamar.
    note: Una breve confirmación oficial de cita, en el registro escrito que enseña esta unidad.
  fa.a2.unit12.lesson04.teach.whats_wrong:
    title: ¿Qué pasa?
    gloss: Adelante, ¿qué le pasa?
    note: '*بفرمایید، چی شده؟* es una fórmula cortés habitual para empezar en la consulta del médico.'
  fa.a2.unit12.lesson04.teach.turn01:
    title: دکتر رضایی pregunta qué le pasa
    gloss: El doctor Rezaei lo invita a hablar y le pregunta qué le pasa.
    note: Retoma la frase de apertura de esta misma lección.
  fa.a2.unit12.lesson04.teach.turn02:
    title: نیما describe su síntoma
    gloss: نیما dice que desde hace tres días tiene un dolor de cabeza fuerte.
    note: 'Retoma el patrón de la lección 2: síntoma con duración e intensidad.'
  fa.a2.unit12.lesson04.teach.turn03:
    title: دکتر رضایی pregunta por la fiebre
    gloss: El doctor Rezaei le pregunta si también tiene fiebre.
    note: '*تب هم دارید؟* pregunta por un síntoma adicional.'
  fa.a2.unit12.lesson04.teach.turn04:
    title: نیما responde sobre la fiebre
    gloss: نیما dice que no, que es solo dolor de cabeza, pero fuerte.
    note: '*فقط ... ولی ...* (solo... pero...) delimita y contrasta.'
  fa.a2.unit12.lesson04.teach.turn05:
    title: دکتر رضایی da indicaciones
    gloss: El doctor Rezaei dice que bien, que recoja esta receta y descanse unos días.
    note: 'La indicación del médico para el tratamiento: receta y descanso.'
  fa.a2.unit12.lesson04.teach.turn06:
    title: نیما da las gracias al médico
    gloss: نیما dice que por supuesto, gracias, doctor.
    note: '*چشم* es una forma cortés y respetuosa de decir «por supuesto» o «así lo haré» a alguien con autoridad.'
