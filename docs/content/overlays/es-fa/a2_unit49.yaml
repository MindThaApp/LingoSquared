teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: Lugares y eventos a los que invitar a alguien
    gloss: cine, concierto, teatro, cumpleaños, entrada
    note: '*کنسرت* es un concierto y *تئاتر* es una obra de teatro o el teatro. *بلیت* es la entrada que puedes tener para un evento.'
    example_gloss:
    - Tengo dos entradas para el concierto.
    - La obra de teatro fue muy buena.
    - El viernes voy al cine.
    - Compré un regalo para el cumpleaños de mi amigo.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: Invitación y «vamos»
    gloss: invitación, vamos / ¿vamos?
    note: '*دعوت* es una invitación. *بریم* («vamos / ¿vamos?») cierra una propuesta amistosa, a menudo con *با هم* («juntos»).'
    example_gloss:
    - Gracias por la invitación.
    - Nima invita a Sara.
    - ¿Vamos juntos al cine?
    - ¿Vamos al parque esta noche?
  fa.a2.unit49.lesson01.teach.more_events:
    title: Más tipos de reuniones
    gloss: fiesta, picnic, reunión informal, celebración
    note: '*مهمونی* es una fiesta, *پیک‌نیک* es un picnic, *دورهمی* es una reunión informal entre amigos y *جشن* es una celebración.'
    example_gloss:
    - Esta noche tenemos una fiesta.
    - El viernes vamos de picnic.
    - El sábado tenemos una celebración y reunión.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: Más palabras de invitación
    gloss: almuerzo, paseo, tarjeta de invitación
    note: '*ناهار* es el almuerzo, *گردش* es un paseo y *دعوتنامه* es una tarjeta de invitación o una invitación escrita.'
    example_gloss:
    - El viernes almorzamos juntos.
    - ¿Vamos juntos de paseo?
    - Tengo una tarjeta de invitación.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: Tres formas sencillas de invitar
    gloss: ¿Quieres venir a un concierto? ¿Vienes conmigo al teatro? ¿Vamos juntos al cine?
    note: Las tres son preguntas. *می‌خوای بیای ...؟* pregunta si la otra persona quiere venir. *با من میای ...؟* pregunta directamente. *با هم بریم ...؟* propone ir juntos. Añade antes una palabra de tiempo (*فردا*, *جمعه شب*) para que la invitación quede clara.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: Palabras para decir que sí
    gloss: sí, por supuesto, qué bien, genial, vale, iré
    note: '*آره* y *باشه* dicen que sí. *حتما* añade «por supuesto». *چه خوب* y *عالیه* muestran que te alegras.'
    example_gloss:
    - Sí, seguro que iré.
    - ¡Qué bien! Gracias.
    - Vale, las ocho está bien.
    - ¡Genial! Iré el sábado.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: Preguntar los detalles
    gloss: a qué hora, dónde, cuándo
    note: 'Después de aceptar, pregunta el detalle que necesitas: *ساعت چند؟* (a qué hora), *کجا؟* (dónde), *کی؟* (cuándo).'
    example_gloss:
    - ¿A qué hora vamos?
    - ¿Adónde vamos?
    - ¿Cuándo vamos?
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: Decir que sí y decir quizá
    gloss: ¡Gracias por la invitación! Seguro que iré; puedo ir; quizá pueda ir
    note: 'Un sí seguro es *حتما میام*. *می‌تونم بیام* dice que puedes venir. *شاید بتونم بیام* es un «quizá» prudente: no es una promesa. Empieza con *ممنون از دعوت* para ser cortés.'
  fa.a2.unit49.lesson03.teach.decline_words:
    title: Palabras para decir que no con cortesía
    gloss: lamentablemente, perdona, no puedo, pero
    note: Suaviza un rechazo con *متاسفانه* o *ببخشید* antes de *نمی‌تونم بیام*.
    example_gloss:
    - Lamentablemente no puedo ir.
    - Perdona, el viernes no puedo.
    - Gracias, pero no puedo.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: Motivos para decir que no
    gloss: tengo trabajo, tengo una cita, tengo una reunión, estoy enfermo, tengo que estudiar, tengo que ir a clase
    note: '*باید* («tener que») va antes de un verbo corto: *باید درس بخونم*, *باید برم کلاس*. Otros motivos usan *دارم*: *کار دارم*, *قرار دارم*.'
    example_gloss:
    - El viernes tengo trabajo.
    - Esta noche tengo una cita.
    - Mañana tengo una reunión.
    - Hoy estoy enfermo.
    - Tengo que estudiar.
    - Tengo que ir a clase.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: Un motivo sobre tus planes
    gloss: porque mañana voy al norte, porque el fin de semana voy a Teherán
    note: 'Un motivo puede ser un plan: *چون* más *می‌خوام برم* y un lugar.'
    example_gloss:
    - Porque mañana voy al norte.
    - Porque el fin de semana voy a Teherán.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: Ser anfitrión y tu agenda
    gloss: anfitrión, invitado, ocupado, libre
    note: '*میزبان* es el anfitrión y *مهمون* es un invitado. Usa *مشغولم* cuando estás ocupado y *آزادم* cuando estás libre.'
    example_gloss:
    - Sara es la anfitriona de la fiesta.
    - Esta noche tengo un invitado.
    - El viernes estoy ocupado y el sábado libre.
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: Recibir invitados y tener tiempo
    gloss: hospitalidad como anfitrión, atención a los invitados, oportunidad / tiempo
    note: '*میزبانی* es el hecho de ser anfitrión. *پذیرایی* es atender o servir a los invitados. *فرصت* significa oportunidad o tiempo suficiente para hacer algo.'
    example_gloss:
    - Sara es la anfitriona.
    - Sara atiende al invitado.
    - El sábado tengo tiempo.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: Decir que no con un motivo
    gloss: Lo siento, no puedo ir, porque tengo que estudiar
    note: 'Un rechazo cortés tiene tres partes: una disculpa (*ببخشید* o *متاسفانه*), la negativa (*نمی‌تونم بیام*) y la razón con *چون*. La razón también puede ir primero: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: Proponer otro día
    gloss: pero, ¿qué tal el sábado?, la semana que viene, otro día
    note: '*ولی* («pero») une la negativa con la nueva propuesta. *شنبه چطوره؟* propone un día distinto.'
    example_gloss:
    - El viernes no puedo, pero el sábado sí.
    - ¿Qué tal el sábado?
    - La semana que viene sí puedo.
    - Iremos otro día.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: Si tienes tiempo
    gloss: si tienes tiempo
    note: '*اگه* («si») más el presente forma una condición amistosa: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - Si tienes tiempo, vamos juntos.
    - Si tienes tiempo el sábado, ven.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: No, con una razón y otra propuesta
    gloss: No puedo ir, porque tengo trabajo. Pero el sábado sí puedo
    note: 'Una buena negativa no se queda en el no. Da la razón con *چون* y luego ofrece otro momento con *ولی*: *ولی شنبه می‌تونم*. También puedes preguntar *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: La invitación de Sara
    gloss: ¡Hola, Nima! El viernes por la noche tengo dos entradas para un concierto. ¿Quieres venir conmigo? Vamos a las ocho. Hasta luego, Sara
    note: Encuentra el evento, el día y la hora.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: La respuesta de Nima
    gloss: ¡Hola, Sara! Gracias por la invitación. Lamentablemente el viernes no puedo ir, porque tengo que estudiar. Pero el sábado sí puedo. ¿Vamos juntos al teatro el sábado por la noche? Hasta luego, Nima
    note: Encuentra el agradecimiento, la negativa, la razón y la nueva propuesta.
  fa.a2.unit49.lesson06.teach.turn01:
    title: Sara invita a Nima
    gloss: ¡Hola, Nima! El viernes por la noche, ¿quieres venir conmigo a un concierto?
    note: Sara invita con *می‌خوای*.
  fa.a2.unit49.lesson06.teach.turn02:
    title: Nima le da las gracias y rechaza la invitación
    gloss: ¡Gracias por la invitación! Pero lamentablemente el viernes no puedo, porque tengo que estudiar.
    note: Agradecimiento, negativa y razón en una sola intervención.
  fa.a2.unit49.lesson06.teach.turn03:
    title: Sara propone otro día
    gloss: ¿Qué tal el sábado? ¿Quieres ir al teatro?
    note: Un día nuevo y un evento nuevo.
  fa.a2.unit49.lesson06.teach.turn04:
    title: Nima acepta y pregunta la hora
    gloss: Sí, el sábado puedo. ¿A qué hora?
    note: Nima acepta y pregunta un detalle.
  fa.a2.unit49.lesson06.teach.turn05:
    title: Sara dice la hora
    gloss: A las ocho.
    note: Una respuesta corta.
  fa.a2.unit49.lesson06.teach.turn06:
    title: Nima confirma
    gloss: ¡Genial! Entonces voy el sábado. ¡Hasta luego!
    note: '*پس* («entonces») confirma el plan.'
