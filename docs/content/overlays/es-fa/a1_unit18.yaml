  fa.a1.unit18.lesson01.teach.doctoram_word:
    title: Soy médico
    gloss: soy médico/a
    note: دکترم es la contracción coloquial de دکتر هستم («soy médico/a»).
    example_gloss: Soy médico.
  fa.a1.unit18.lesson01.teach.man_word:
    title: yo
    gloss: yo
    note: '*من* significa «yo» (repaso). Puedes ponerlo antes de *مهندسم*, *معلمم* o *دکترم* para una frase más completa: *من مهندسم*.'
