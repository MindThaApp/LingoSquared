teaching:
  fa.a2.unit43.lesson01.teach.foods:
    title: En el mercado
    gloss: manzana, naranja, pan, pastel
    note: '*نون* es la forma hablada de *نان*.'
    example_gloss:
    - La manzana es barata.
    - La naranja es cara.
    - El pan está aquí.
    - El pastel está allí.
  fa.a2.unit43.lesson01.teach.pointing:
    title: Este, aquel, uno, cuánto
    gloss: este, aquel, uno (de ellos), cuánto cuesta
    note: '*این یکی* significa «este», *اون یکی* «aquel».'
    example_gloss:
    - ¿Cuánto cuesta esta manzana?
    - Aquella naranja es barata.
    - Este es caro.
    - Aquel es barato.
  fa.a2.unit43.lesson01.teach.oneword:
    title: این y اون van antes del sustantivo
    gloss: esta manzana; aquella naranja; este; aquel
    note: '*این* señala algo cercano y *اون* algo lejano. Van antes del sustantivo. Para no repetir el sustantivo, se usa *یکی*: *این یکی*, *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'Elegir: quiero aquel'
    gloss: Quiero aquel; quiero este
    note: 'Cuando eliges una cosa concreta, *رو* va detrás: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: Flores y libros
    gloss: flor, libro, novela
    note: '*گل* es una flor.'
    example_gloss:
    - La flor es bonita.
    - El libro está aquí.
    - La novela está allí.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + plural
    gloss: estas manzanas; aquellas flores; estos libros; aquellas naranjas
    note: 'Añade *‌ها* (con un semiespacio) al sustantivo y mantén *این* o *اون* delante: *این سیب‌ها* es «estas manzanas». En la lengua hablada, *-ها* suele pasar a *-ا* (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: Preguntar y elegir con plurales
    gloss: ¿Cuánto cuestan estas manzanas? Quiero aquellas flores.
    note: Un plural que eliges también lleva *رو*. Después de *این* o *اون* + plural, la forma habitual de preguntar el precio es con *چنده؟*.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: En la librería
    gloss: quiero, ¿tienen?, deme
    note: '*دارید؟* es el «¿tienen?» o «¿tiene usted?» educado y *بدید* el «deme» educado.'
    example_gloss:
    - Quiero un libro.
    - ¿Tienen una novela?
    - Deme aquel libro.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'La terminación -ی: un / algún'
    gloss: Quiero un libro (cualquiera); ¿tienen una novela?
    note: 'Añade *ی* al sustantivo cuando quieres decir «un / algún» y no importa cuál sea. Normalmente no lleva *رو*: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: ¿Indefinido o definido?
    gloss: Quiero un libro. Quiero aquel libro.
    note: 'Compara: *کتابی* es un libro cualquiera (sin *رو*); *اون کتاب رو* es un libro concreto (con *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: Algo, panadería, floristería
    gloss: algo, panadería, floristería
    note: '*چیزی* es «algo»; ya termina en la *ی* indefinida.'
    example_gloss:
    - Quiero algo.
    - La panadería está allí.
    - La floristería está aquí.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: algún, uno cualquiera'
    gloss: algo de pan; una flor; un pastel; algo
    note: 'En la lengua hablada se suele combinar *یه* delante del sustantivo con *ی* detrás: *یه نونی*, *یه گلی*. Suena como «algún / un ... cualquiera». Después de una *ی* final, la terminación se escribe *ای*: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: Pedir algo no específico
    gloss: Deme algo de pan. Quiero una flor.
    note: Usa *یه ... ی* cuando pides algo y no importa exactamente cuál, por ejemplo en una panadería o en una floristería.
  fa.a2.unit43.lesson05.teach.reading:
    title: Una visita al mercado
    gloss: Hoy fui al mercado. Primero fui a la panadería. Compré pan. Luego fui a la floristería. Vi esas flores rojas. Estas flores eran baratas, pero aquella era cara. Compré dos flores. Después también compré un libro.
    note: Lee una vez fijándote en las tiendas y otra vez en *این*, *اون* y las terminaciones *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: El vendedor saluda a Sara
    gloss: 'Vendedor: Aquí tiene. ¿Qué desea?'
    note: '*می‌خواید* es el «usted quiere» de cortesía.'
  fa.a2.unit43.lesson06.teach.turn02:
    title: Sara pide una flor
    gloss: 'Sara: Quisiera una flor. ¿Cuánto cuestan estas flores?'
    note: '*یه گلی* es inespecífico; *این گل‌ها* señala «estas flores».'
  fa.a2.unit43.lesson06.teach.turn03:
    title: El vendedor compara
    gloss: 'Vendedor: Esas flores rojas son baratas. Esta es cara.'
    note: '*گل‌های قرمز*: sustantivo plural + adjetivo, unidos por el ezafe (el sonido de enlace *-e*, que aquí se escribe *ی* tras la vocal).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: Sara elige
    gloss: 'Sara: Quiero aquella. Deme dos.'
    note: '*دو تا* significa «dos (de ellas)».'
  fa.a2.unit43.lesson06.teach.turn05:
    title: El vendedor se las entrega
    gloss: 'Vendedor: Aquí tiene.'
    note: '*بفرمایید* se dice al entregar algo.'
