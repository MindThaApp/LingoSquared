teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: Personas y tiempo
    gloss: yo, tú, Sara, Nima, esta noche, mañana
    note: '*امشب* significa «esta noche» y *فردا* significa «mañana». En persa normalmente se omite *من* porque la terminación del verbo ya indica la persona.'
    example_gloss:
    - Mañana puedo venir.
    - Sara no puede venir esta noche.
  fa.a2.unit30.lesson01.teach.skills:
    title: Habilidades
    gloss: tocar la guitarra, conducir, cocinar, nadar, hablar inglés
    note: Son habilidades. Cada una se forma con un sustantivo y un verbo ligero, y el verbo ligero cambia según la persona.
    example_gloss:
    - Puedo tocar la guitarra.
    - No puedo conducir.
    - Nima sabe hablar inglés.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: Verbos después de «poder»
    gloss: que venga, que vaya, que toque, que lea, que haga
    note: Son las formas verbales de «que yo...» (el subjuntivo). El persa hablado coloca una de ellas después de *می‌تونم*.
    example_gloss:
    - Puedo venir.
    - No puedo ir.
    - Puedo hablar inglés.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: Poder y no poder
    gloss: puedo, puedes, él/ella puede; no puedo, no puedes, él/ella no puede
    note: 'El verbo hablado para «poder» es *می‌تونم* (puedo), *می‌تونی* (puedes), *می‌تونه* (él/ella puede). Pon *نـ* delante para decir «no puedo»: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: Poder + el verbo de «que yo...»
    gloss: puedo venir; no puedo hablar
    note: 'Después de *می‌تونم* el segundo verbo va en subjuntivo, no en infinitivo: *می‌تونم بیام*, *نمی‌تونم صحبت کنم*. El segundo verbo lleva la misma terminación de persona que *می‌تونم*.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: Tú y él/ella
    gloss: tú, él o ella
    note: '*اون* significa «él» o «ella» en persa hablado; la terminación del verbo indica a quién se refiere.'
    example_gloss:
    - Él o ella puede venir.
    - Puedes ir.
  fa.a2.unit30.lesson02.teach.endings:
    title: Tres personas
    gloss: que yo/tú/él venga, vaya, toque
    note: 'La terminación del subjuntivo sigue a la persona: -م (yo), -ی (tú), -ه o -د (él/ella). El mismo patrón aparece en todos los verbos.'
    example_gloss:
    - Puedes tocar la guitarra.
    - Él o ella puede ir.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: Habilidades de trabajo y tecnología
    gloss: enviar un correo electrónico, sacar una foto, leer persa, trabajar con un ordenador, con un móvil
    note: Estas habilidades vienen del trabajo y la tecnología. *با* significa «con» o «en».
    example_gloss:
    - Nima puede trabajar con un ordenador.
    - Puedo enviar un correo electrónico.
    - Puedes sacar fotos con un móvil.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: Los dos verbos concuerdan
    gloss: puedo venir, puedes venir, él/ella puede venir
    note: 'Cambia la persona en los dos verbos a la vez: *می‌تونم بیام*, *می‌تونی بیای*, *می‌تونه بیاد*. Una combinación como *می‌تونی بیام* es incorrecta.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: Deber, quizá, tal vez
    gloss: tener que, es posible que, tal vez
    note: '*باید* expresa necesidad. *ممکنه* y *شاید* expresan posibilidad. Los tres van seguidos del subjuntivo.'
    example_gloss:
    - Tengo que ir.
    - Quizá venga.
    - Tal vez vaya.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: Tarde, lluvia, no venir
    gloss: tarde, que llegue, lluvia, que no vaya, que no venga
    note: '*نیام* y *نرم* son subjuntivos negativos: *نـ* va delante del verbo.'
    example_gloss:
    - Quizá llegue tarde.
    - Puede que llueva.
    - Quizá no venga.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: Poder, deber, quizá
    gloss: puedo ir; tengo que ir; quizá vaya
    note: 'El verbo que sigue es el mismo, pero la primera palabra cambia el significado: *می‌تونم برم* (puedo o tengo libertad para ir), *باید برم* (tengo que ir), *ممکنه برم* (es posible que vaya).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'Posibilidad: ممکنه / شاید + subjuntivo'
    gloss: quizá llegue tarde; tal vez llueva; quizá no venga
    note: '*ممکنه* no cambia según la persona; el verbo que le sigue, sí: *ممکنه دیر برسم*, *ممکنه نیما نیاد*. *شاید* funciona igual. Para decir «quizá no», niega el segundo verbo: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: Disponibilidad
    gloss: tengo tiempo, no tengo tiempo, estoy libre, estoy ocupado/a, tengo una reunión, el fin de semana
    note: '*وقت دارم* y *آزادم* indican que estás disponible; *وقت ندارم* y *مشغولم* indican que no lo estás.'
    example_gloss:
    - Mañana tengo tiempo.
    - Esta noche estoy ocupado/a.
    - El fin de semana estoy libre.
  fa.a2.unit30.lesson04.teach.linkers:
    title: Porque, pero, no y
    gloss: porque, pero, no, y
    note: '*چون* da una razón y *ولی* añade un contraste.'
    example_gloss:
    - Esta noche no puedo ir porque tengo una reunión.
    - Mañana estoy libre, pero puede que llegue tarde.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'Quizá pueda: شاید بتونم'
    gloss: quizá pueda venir
    note: 'Para decir «quizá pueda», pon *شاید* antes de *بتونم* (el subjuntivo de «poder») y después un segundo verbo en subjuntivo: *شاید بتونم بیام*. En este curso, *شاید بتونم* es el modelo.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: No poder + motivo
    gloss: Esta noche no puedo venir porque tengo una reunión
    note: 'Una negativa suena natural con un motivo: *نمی‌تونم بیام، چون ...*. El motivo es una oración simple en presente.'
  fa.a2.unit30.lesson05.teach.reading:
    title: Un mensaje de Nima
    gloss: ¡Hola, Sara! Esta noche no puedo ir, porque tengo una reunión. Mañana estoy libre y puedo ir, pero puede que llegue tarde. Sé trabajar con el ordenador, pero no sé tocar la guitarra. Quizá también pueda sacar fotos.
    note: Lee una vez para ver qué puede y qué no puede hacer Nima, y otra vez para ver qué podría pasar.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: Palabras para responder
    gloss: sí, vale, no hay problema, más temprano
    note: '*اشکالی نداره* es una respuesta amable que significa «no hay problema». *زودتر* significa «más temprano».'
    example_gloss:
    - Vale, no hay problema.
    - Quizá pueda venir más temprano.
  fa.a2.unit30.lesson06.teach.turn01:
    title: Sara invita a Nima
    gloss: 'Sara pregunta: Nima, ¿puedes venir esta noche?'
    note: El comienzo pregunta por la capacidad y la disponibilidad.
  fa.a2.unit30.lesson06.teach.turn02:
    title: Nima rechaza la invitación
    gloss: 'Nima: No, esta noche no puedo ir. Tengo una reunión.'
    note: Una negativa con un motivo.
  fa.a2.unit30.lesson06.teach.turn03:
    title: Sara pregunta por mañana
    gloss: 'Sara: ¿Y mañana? ¿Tienes tiempo mañana?'
    note: '*فردا چی؟* lleva la conversación a otro momento.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'Nima: puedo, pero puede que llegue tarde'
    gloss: 'Nima: Sí, mañana estoy libre. Puedo ir, pero puede que llegue tarde.'
    note: Capacidad y posibilidad en una sola respuesta.
  fa.a2.unit30.lesson06.teach.turn05:
    title: Sara pregunta por las fotos
    gloss: 'Sara: Vale, no hay problema. ¿Puedes sacar fotos con el móvil?'
    note: Una nueva pregunta sobre capacidad.
  fa.a2.unit30.lesson06.teach.turn06:
    title: Nima termina la conversación
    gloss: 'Nima: Sí, puedo. Quizá pueda venir más temprano.'
    note: Capacidad y, después, una posibilidad esperanzadora.
