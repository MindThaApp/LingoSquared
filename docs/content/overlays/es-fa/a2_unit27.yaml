teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: Expresiones de tiempo para los planes
    gloss: mañana, el fin de semana, la semana que viene, el mes que viene, el año que viene, hoy, ahora
    note: '*هفته‌ی بعد*, *ماه دیگه* y *سال دیگه* son las formas habituales de decir «la semana que viene / el mes que viene / el año que viene». *آخر هفته* es «el fin de semana»; el contexto indica de qué fin de semana se habla.'
    example_gloss:
    - Mañana tengo clase.
    - El mes que viene me voy de viaje.
    - El año que viene tendré una casa nueva.
  fa.a2.unit27.lesson01.teach.course_house:
    title: Cursos y mudanza
    gloss: curso, clase, idioma, inscripción, casa, caja
    note: '*ثبت‌نام* significa «inscripción / matrícula». Usarás estas palabras para el curso de idiomas de Sara y la mudanza de Nima.'
    example_gloss:
    - Tengo un curso de idiomas.
    - Tengo clase de idiomas.
    - Tengo cajas.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: Verbos de planes
    gloss: voy, empiezo, me inscribo, me mudo de casa, compro cajas
    note: '*خونه عوض کردن* es la forma coloquial de decir «mudarse de casa» (literalmente, «cambiar de casa»).'
    example_gloss:
    - Mañana voy a clase.
    - La semana que viene empiezo las clases.
    - Mañana me inscribo.
    - El mes que viene me mudo de casa.
    - Mañana compro cajas.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: Cosas para comprar
    gloss: alfombra, cortina, pastel
    note: Usa estos sustantivos cotidianos para hablar de recados y de cosas que piensas comprar.
    example_gloss:
    - Mañana compro una alfombra.
    - Mañana compro cortinas.
    - Mañana compro un pastel.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: Lugares y eventos
    gloss: restaurante, cafetería, fiesta
    note: '*مهمونی* es la forma coloquial habitual de «fiesta».'
    example_gloss:
    - Mañana voy a un restaurante.
    - Mañana voy a una cafetería.
    - El fin de semana tengo una fiesta.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: El presente puede expresar un plan
    gloss: Mañana voy; la semana que viene empiezo
    note: El persa hablado usa el presente normal (*می‌رم*, *شروع می‌کنم*) para expresar un plan. Una expresión de tiempo como *فردا* o *هفته‌ی بعد* indica que la acción es futura. En el habla cotidiana no hay un verbo de futuro aparte.
  fa.a2.unit27.lesson02.teach.i_want:
    title: Quiero, quieres
    gloss: quiero, quieres, un/una
    note: '*یه* es el «un / una» normal del habla. *تو چی می‌خوای؟* significa «¿Qué quieres?»'
    example_gloss:
    - Quiero comprar una casa.
    - ¿Qué quieres?
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: Formas verbales cortas
    gloss: ir, comprar, empezar, inscribirse, encontrar, aprender
    note: 'Estas son las formas verbales cortas que van después de *می‌خوام*. En los verbos de dos partes cambia la segunda parte: *شروع کنم*, *ثبت‌نام کنم*, *پیدا کنم*.'
    example_gloss:
    - Quiero ir a clase.
    - Quiero comprar cajas.
    - Quiero encontrar una casa.
    - Quiero aprender un idioma.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + verbo corto
    gloss: Quiero ir; quiero comprar; quiero empezar
    note: 'Para decir lo que quieres o piensas hacer, usa *می‌خوام* más una forma verbal corta. El segundo verbo no lleva *می‌*: se dice *می‌خوام برم*, nunca *می‌خوام می‌رم*. La terminación del segundo verbo concuerda con la persona que quiere.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: El segundo verbo sigue a la persona
    gloss: quiero ir; quieres ir; él/ella quiere ir
    note: 'El verbo corto cambia según la persona: *برم* (yo), *بری* (tú), *بره* (él/ella). El mismo patrón sirve con *بخرم / بخری / بخره*. En esta unidad producirás sobre todo las formas de *من*.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: Palabras de costumbre
    gloss: todos los días, todas las semanas, siempre, normalmente
    note: Estas palabras indican una costumbre repetida. El verbo es el mismo presente que se usa en un plan; la expresión de tiempo te dice qué significado tiene.
    example_gloss:
    - Voy a clase todos los días.
    - Siempre voy a clase.
    - Normalmente me quedo en casa.
    - Tengo clase dos días cada semana.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: El mismo verbo, otra expresión de tiempo
    gloss: Voy todos los días; mañana voy
    note: '*می‌رم* puede expresar un hábito o un plan. *هر روز* y *همیشه* lo convierten en hábito; *فردا*, *هفته‌ی بعد* y *ماه دیگه* lo convierten en plan. Fíjate siempre primero en la palabra de tiempo.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: ¿Plan o intención?
    gloss: Mañana voy; quiero ir
    note: '*فردا می‌رم* anuncia un plan con una palabra de tiempo. *می‌خوام برم* dice lo que quieres o piensas hacer y no necesita palabra de tiempo. Recuerda: después de *می‌خوام*, el segundo verbo pierde el *می‌*.'
  fa.a2.unit27.lesson03.teach.decided:
    title: Decidir, tener intención
    gloss: decidí, tengo la intención de
    note: '*تصمیم گرفتم* y *قصد دارم* son otras dos formas de hablar de una intención. Ambas van seguidas de una forma verbal corta.'
    example_gloss:
    - Decidí mudarme de casa.
    - Tengo la intención de aprender un idioma.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + verbo corto
    gloss: Decidí ir; decidí empezar
    note: '*گرفتم* está en pasado porque la decisión ya está tomada, pero el verbo que sigue va en forma corta (*برم*, *شروع کنم*) porque la acción aún está por venir. No le pongas *می‌*.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: Preguntar por los planes
    gloss: ¿Qué haces mañana? ¿Qué quieres hacer? ¿Y tú?
    note: Para preguntar por un plan, usa el presente con una palabra de tiempo. Para preguntar por una intención, usa *می‌خوای ... کنی؟*.
    example_gloss:
    - ¿Qué haces el fin de semana?
    - ¿Qué quieres hacer el año que viene?
    - Empiezo las clases; ¿y tú?
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: La respuesta refleja la pregunta
    gloss: tú haces → yo hago; tú quieres hacer → yo quiero hacer
    note: 'Responde a una pregunta sobre un plan con el presente y la misma palabra de tiempo: *فردا جعبه می‌خرم*. Responde a una pregunta sobre una intención con *می‌خوام* y un verbo corto cuya terminación cambia de «tú» a «yo»: *می‌خوای چیکار کنی؟* pasa a *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: Palabras para un mensaje
    gloss: hola, trabajo, no voy, viaje
    note: '*نمی‌رم* es la forma negativa de *می‌رم*: «no voy». *برم سفر* significa «ir de viaje».'
    example_gloss:
    - ¡Hola, Sara!
    - Voy al trabajo todos los días.
    - Mañana no voy a clase.
    - El año que viene me voy de viaje.
  fa.a2.unit27.lesson05.teach.reading:
    title: Un mensaje de Nima
    gloss: ¡Hola, Sara! Voy al trabajo todos los días, pero mañana no voy. Mañana compro cajas. El mes que viene me mudo de casa. He decidido irme de viaje el año que viene.
    note: Lee una vez fijándote en el hábito, en los planes cercanos y en la intención más lejana.
  fa.a2.unit27.lesson06.teach.nice:
    title: ¡Qué buena noticia!
    gloss: qué bien
    note: '*چه خوب!* es una reacción amistosa ante los planes de alguien.'
    example_gloss:
    - ¡Qué bien! ¿Te inscribes mañana?
  fa.a2.unit27.lesson06.teach.turn01:
    title: Sara pregunta por mañana
    gloss: 'Sara pregunta a Nima: ¿Qué haces mañana?'
    note: La pregunta usa el presente y una palabra de tiempo.
  fa.a2.unit27.lesson06.teach.turn02:
    title: Nima cuenta dos planes
    gloss: 'Nima: Mañana compro cajas. El mes que viene me mudo de casa. ¿Y tú?'
    note: Dos planes con dos palabras de tiempo.
  fa.a2.unit27.lesson06.teach.turn03:
    title: Sara cuenta sus planes
    gloss: 'Sara: Mañana me inscribo. La semana que viene empiezo clases de idiomas.'
    note: Aquí se dice *من* para responder a *تو چی؟*.
  fa.a2.unit27.lesson06.teach.turn04:
    title: Nima pregunta por las intenciones
    gloss: 'Nima: ¡Qué bien! ¿Qué quieres hacer el año que viene?'
    note: La pregunta usa *می‌خوای ... کنی؟*.
  fa.a2.unit27.lesson06.teach.turn05:
    title: Sara cuenta una decisión
    gloss: 'Sara: He decidido aprender un idioma. ¿Y tú?'
    note: '*تصمیم گرفتم* va seguido de una forma verbal corta.'
  fa.a2.unit27.lesson06.teach.turn06:
    title: Nima cuenta una intención
    gloss: 'Nima: Quiero irme de viaje.'
    note: '*می‌خوام برم* expresa la intención.'
