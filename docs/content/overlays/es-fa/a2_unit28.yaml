teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: Palabras del tiempo para un pronóstico
    gloss: mañana, tiempo, lluvia, nieve, frío, caliente, soleado
    note: '*بارون* es la forma hablada de uso diario de «lluvia»; en la escritura cuidada se usa *باران*. *آفتابیه* significa «hace sol».'
    example_gloss:
    - Mañana hará sol.
    - Mañana lloverá.
    - Mañana nevará.
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: Dos verbos del pronóstico
    gloss: llueve, se vuelve / se pone
    note: '*می‌باره* significa «llueve / nieva». *می‌شه* significa «se vuelve / se pone» y va con un adjetivo: *سرد می‌شه* = «hará frío / se pondrá frío».'
    example_gloss:
    - Mañana hará frío.
    - Mañana hará calor.
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: El presente hablado para el futuro
    gloss: Mañana lloverá. Mañana hará frío.
    note: 'En persa se hacen predicciones con el presente normal más una palabra de tiempo. *فردا بارون می‌باره* es «Mañana lloverá». No existe un futuro hablado aparte: *فردا* indica que se trata del futuro.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: Quizá y probablemente
    gloss: quizá, probablemente, Nima, Sara
    note: '*شاید* significa «quizá» y *احتمالا* significa «probablemente». Nima y Sara son los amigos habituales del curso.'
    example_gloss:
    - Quizá venga Nima.
    - Probablemente lloverá.
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: Verbos después de شاید
    gloss: viene, no viene, se vuelve / sea
    note: 'Después de *شاید* el verbo va en subjuntivo: *بیاد* (venga), *نیاد* (no venga), *بشه* (sea / se vuelva). El subjuntivo lleva *ب-* y no lleva *می‌*.'
    example_gloss:
    - Quizá llueva.
    - Quizá no llueva.
    - Quizá haga frío.
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + subjuntivo
    gloss: Quizá llueva. Quizá haga frío. Quizá no llueva.
    note: 'Usa *شاید* cuando algo solo es posible. El verbo va en subjuntivo, sin *می‌*: *شاید بارون بیاد*. Negativo: *شاید بارون نیاد*. Compáralo con la predicción simple *بارون می‌باره*, que lleva *می‌*.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالا + presente
    gloss: Probablemente lloverá. Probablemente hará frío.
    note: 'Usa *احتمالا* cuando algo es probable. El verbo se queda en el presente normal, igual que en una predicción simple: *احتمالا بارون می‌باره*. Solo la palabra *احتمالا* cambia el grado de certeza.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: Pronóstico negativo
    gloss: no llueve
    note: '*نمی‌باره* es la forma negativa de *می‌باره*: *فردا بارون نمی‌باره* = «Mañana no lloverá».'
    example_gloss:
    - Mañana no lloverá.
    - Probablemente mañana no llueva.
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: ¿Seguro, probable o posible?
    gloss: Lloverá. Probablemente lloverá. Quizá llueva.
    note: 'Tres niveles. Predicción simple: *بارون می‌باره* (presente, *می‌*). Probable: *احتمالا بارون می‌باره* (presente, *می‌*). Solo posible: *شاید بارون بیاد* (subjuntivo, sin *می‌*). Aquí no uses *شاید* con *می‌باره*.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: Negativos lado a lado
    gloss: No lloverá. Quizá no llueva.
    note: 'Negativo simple: *نمی‌باره* (presente, *نمی‌*). Negativo posible: *شاید بارون نیاد* (subjuntivo *نیاد*). Ambos usan *ن-*, pero solo el segundo no lleva *می‌*.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: Palabras de promesa
    gloss: prometo, sin falta, tarde, llamada, ayudarte, entonces, no estarás
    note: '*قول می‌دم* = «prometo». *حتما* = «sin falta / seguro». *زنگ* con *زدن* es «llamar». *کمکت* es *کمک* + *ت*, «te ayuda / ayudarte». *دیر* = «tarde».'
    example_gloss:
    - Llamaré sin falta.
    - Prometo ayudarte.
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: Verbos para promesas
    gloss: no haga, llame (subjuntivo), haga (subjuntivo), venga (subjuntivo), llamo, llamas
    note: 'Después de *قول می‌دم* el verbo va en subjuntivo: *نکنم*, *بزنم*, *کنم*, *بیام*. El presente simple *می‌زنم* se usa con *حتما*.'
    example_gloss:
    - Prometo no llegar tarde.
    - Prometo llamar.
    - Prometo venir.
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + subjuntivo
    gloss: Prometo no llegar tarde. Prometo llamar. Prometo venir.
    note: 'Una promesa es *قول می‌دم* seguido de un verbo en subjuntivo (sin *می‌*): *قول می‌دم دیر نکنم*. La negación *ن-* va en el verbo en subjuntivo. Aquí el persa no usa un tiempo futuro; el subjuntivo expresa aquello a lo que te comprometes.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + presente, شاید + subjuntivo
    gloss: Llamaré sin falta. Quizá llame.
    note: Para una promesa firme puedes decir *حتما زنگ می‌زنم* (presente con *می‌*). Para algo de lo que no estás seguro, *شاید زنگ بزنم* (subjuntivo, sin *می‌*). Es el mismo contraste que con el tiempo.
  fa.a2.unit28.lesson05.teach.message_words:
    title: Palabras para un mensaje
    gloss: hola, después, de, trabajo, cita, tenemos, fin, semana, te / a ti, y, pero, hora, diez, también, cómo está
    note: '*قرار داریم* significa «tenemos una cita acordada». *بعد از کار* es «después del trabajo». *آخر هفته* es «el fin de semana». *بهت* es la forma hablada de «a ti / te».'
    example_gloss:
    - Mañana después del trabajo tenemos una cita.
    - El fin de semana hará sol.
    - Te llamaré sin falta.
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: Palabras de boletines y avisos
    gloss: meteorología, lluvia (escrito), nublado, aviso, oficina, cerrado, futuro (escrito), era / ser, llovió, se volvió
    note: Estas palabras son propias de boletines meteorológicos y avisos escritos. *باران* es la forma escrita de *بارون*, que es la hablada. *خواهد* es el «futuro» escrito, en *خواهد بود* y *خواهد شد*.
    example_gloss:
    - Aviso meteorológico
    - La oficina estará cerrada mañana.
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: Futuro escrito con خواهد (solo reconocimiento)
    gloss: Se nublará. Lloverá. La oficina estará cerrada.
    note: 'Solo escrito/formal. Los boletines meteorológicos y los avisos usan un futuro escrito: *خواهد* + una forma verbal corta, como en *خواهد شد* (se volverá), *خواهد بارید* (lloverá), *خواهد بود* (será/estará). Solo necesitas RECONOCERLO al leer. En el habla y en mensajes a amigos, di *می‌شه*, *می‌باره*, *هست*; no uses *خواهد* tú mismo.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: Un mensaje de Sara
    gloss: ¡Hola, Nima! Mañana después del trabajo tenemos una cita. Mañana hará frío y probablemente lloverá. Quizá nieve el fin de semana. Prometo no llegar tarde y te llamaré sin falta.
    note: Lee una vez para ver la predicción simple, luego para lo que solo es probable o posible, y después para la promesa.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: Un boletín meteorológico
    gloss: 'Aviso meteorológico: Mañana el cielo se nublará y lloverá. El fin de semana hará frío.'
    note: Este es un boletín escrito. Las formas con *خواهد* son solo para reconocerlas.
  fa.a2.unit28.lesson06.teach.turn01:
    title: Sara pregunta por mañana
    gloss: 'Sara le pregunta a Nima: ¿Qué tiempo hará mañana?'
    note: La pregunta pide una predicción.
  fa.a2.unit28.lesson06.teach.turn02:
    title: Nima hace una predicción
    gloss: 'Nima: Probablemente lloverá. Quizá también nieve.'
    note: '*احتمالا* indica algo probable; *شاید* indica algo solo posible.'
  fa.a2.unit28.lesson06.teach.turn03:
    title: Sara confirma el plan
    gloss: 'Sara: Mañana a las diez tenemos una cita. ¿No llegarás tarde, verdad?'
    note: Sara pide un compromiso con *دیر نمی‌کنی؟*
  fa.a2.unit28.lesson06.teach.turn04:
    title: Nima promete
    gloss: 'Nima: Prometo no llegar tarde.'
    note: '*قول می‌دم* + subjuntivo.'
  fa.a2.unit28.lesson06.teach.turn05:
    title: Sara pregunta por una llamada
    gloss: 'Sara: Entonces, ¿me llamarás?'
    note: El presente con *می‌* sirve para preguntar por un plan firme.
  fa.a2.unit28.lesson06.teach.turn06:
    title: Nima se compromete
    gloss: 'Nima: Te llamaré sin falta.'
    note: '*حتما* + presente expresa una promesa firme.'
