course:
  title: Persa A2
  description: 'Persa iraní de nivel preintermedio: cómo gestionar una cita formal para actualizar tu dirección en una oficina de servicios gubernamentales: vocabulario, cómo pedir la cita, lectura de un aviso oficial y la cita en sí.'
units:
  fa.a2.unit09.bureaucracy:
    title: Trámites administrativos
