teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: Cita
    gloss: cita / hora disponible
    note: '*وقت* significa literalmente «tiempo»; *وقت گرفتن* (tomar una cita) es la forma cotidiana de decir «pedir cita» en persa.'
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: Documento
    gloss: documento
    note: '*مدرک* es la palabra general para un documento oficial o un papel de identificación.'
  fa.a2.unit09.lesson01.teach.address_word:
    title: Dirección
    gloss: dirección
    note: '*آدرس* es la palabra cotidiana para la dirección de una casa o una dirección postal.'
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: Factura de servicios
    gloss: factura de servicios
    note: '*قبض* se refiere a una factura (de agua, electricidad o gas) que suele aceptarse como prueba de residencia.'
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: Documento nacional de identidad
    gloss: documento nacional de identidad
    note: '*کارت ملی* es el documento nacional de identidad de Irán, el documento que se actualiza en esta unidad.'
  fa.a2.unit09.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace más común y se usa a lo largo de toda esta unidad.'
  fa.a2.unit09.lesson02.teach.request_appointment:
    title: Pedir una cita
    gloss: Quería pedir una cita para cambiar mi dirección.
    note: '*می‌خواستم* (literalmente «yo estaba queriendo») suaviza una petición, igual que el imperfecto de cortesía en español: «quería pedir...».'
  fa.a2.unit09.lesson02.teach.because_moved:
    title: Explicar el motivo con چون (porque)
    gloss: Como me he mudado de casa, tengo que cambiar mi dirección.
    note: '*چون* introduce el motivo: es una oración subordinada propia del nivel A2, un paso más allá de las oraciones simples del A1.'
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Preguntar con cortesía qué hay que traer
    gloss: ¿Podría decirme qué tengo que traer?
    note: '*می‌شه...؟* («¿sería posible...?») es una forma cortés de pregunta indirecta.'
  fa.a2.unit09.lesson03.teach.lease_word:
    title: Contrato de alquiler
    gloss: contrato de alquiler
    note: '*اجاره‌نامه* es un contrato de alquiler, uno de los posibles documentos que prueban la residencia.'
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: Plazo
    gloss: plazo
    note: '*مهلت* es la palabra general para un plazo o límite de tiempo.'
  fa.a2.unit09.lesson03.teach.notice_text:
    title: Un aviso de la oficina sobre la actualización de la dirección
    gloss: Para cambiar su dirección, traiga por favor su antiguo documento nacional de identidad y una factura de agua o de electricidad. El plazo de inscripción termina a finales de este mes.
    note: Un aviso oficial breve, en estilo escrito neutro. Aun así usa la forma hablada cotidiana *بیارید* (en lugar de *بیاورید*), que es como suelen redactarse estos avisos.
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: Decir lo que vas a traer
    gloss: Traeré la factura del agua.
    note: '*میارم* es la contracción hablada cotidiana de *می‌آورم* (traigo).'
  fa.a2.unit09.lesson04.teach.turn01:
    title: El empleado saluda a سارا
    gloss: El empleado la invita a pasar y le pregunta en qué puede ayudarla.
    note: '*بفرمایید* la invita a acercarse; *چه کمکی از دستم برمیاد؟* es una forma cortés y habitual en que un empleado ofrece ayuda.'
  fa.a2.unit09.lesson04.teach.turn02:
    title: سارا pide una cita
    gloss: سارا dice que quería pedir una cita para cambiar su dirección.
    note: Reutiliza el patrón de petición *می‌خواستم* de la lección 2.
  fa.a2.unit09.lesson04.teach.turn03:
    title: El empleado pregunta desde cuándo
    gloss: El empleado le pregunta desde cuándo vive en la nueva dirección.
    note: '*از کی...؟* significa «¿desde cuándo...?».'
  fa.a2.unit09.lesson04.teach.turn04:
    title: سارا responde y pregunta qué debe traer
    gloss: Dice que desde el mes pasado y pregunta qué debe traer.
    note: Combina el dato *از ماه پیش* con la pregunta *می‌شه بگید...؟* de la lección 2.
  fa.a2.unit09.lesson04.teach.turn05:
    title: El empleado enumera los documentos
    gloss: El empleado dice que bastan el antiguo documento nacional de identidad y una factura de agua o de electricidad.
    note: '*کافیه* (forma coloquial de *کافی است*) significa «es suficiente».'
  fa.a2.unit09.lesson04.teach.turn06:
    title: سارا propone un día
    gloss: Pregunta si puede ir el martes.
    note: '*می‌تونم...؟* pregunta por la posibilidad o el permiso; es la forma coloquial de *می‌توانم*.'
  fa.a2.unit09.lesson04.teach.turn07:
    title: El empleado confirma y da un código de seguimiento
    gloss: El empleado confirma el martes a las diez y le da el código de seguimiento 2214.
    note: '*کد پیگیری* es el código de seguimiento o de referencia de la cita.'
