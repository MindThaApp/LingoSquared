teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Sábado, domingo
    gloss: sábado, domingo
    note: شنبه y یکشنبه son los dos primeros días de la semana iraní, que empieza el sábado.
    example_gloss:
    - Hoy es sábado.
    - Mañana es domingo.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Lunes, martes
    gloss: lunes, martes
    note: دوشنبه y سه‌شنبه vienen después de شنبه y یکشنبه.
    example_gloss:
    - El lunes tengo clase.
    - El martes tengo una cita.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Miércoles, jueves
    gloss: miércoles, jueves
    note: چهارشنبه y پنجشنبه son los días de la mitad y del final de la semana.
    example_gloss:
    - El miércoles trabajo.
    - Nos vemos el jueves.
  fa.a1.unit10.lesson01.teach.jome:
    title: Viernes
    gloss: viernes
    note: جمعه es el último día de la semana y el tradicional día de descanso semanal en Irán.
    example_gloss: El viernes es festivo.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: El día de descanso semanal
    gloss: El viernes es el día libre de la semana.
    note: جمعه (viernes) es el día de descanso semanal tradicional en Irán, aunque algunos lugares de trabajo modernos también cierran el jueves por la tarde.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (1.er mes)
    gloss: Farvardin, el primer mes del año solar iraní
    note: فروردین inicia el año solar iraní, aproximadamente a finales de marzo (en torno al equinoccio de primavera y Nowruz).
    example_gloss: Farvardin es el primer mes del año.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (2.º mes)
    gloss: Ordibehesht, el segundo mes
    note: اردیبهشت viene después de فروردین, aproximadamente en abril-mayo.
    example_gloss: En Ordibehesht hace buen tiempo.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (3.er mes)
    gloss: Khordad, el tercer mes
    note: خرداد viene después de اردیبهشت, aproximadamente en mayo-junio.
    example_gloss: Nací en Khordad.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: El calendario solar iraní
    gloss: Irán usa el calendario Hégira solar (persa).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* indica que Irán usa este calendario para las fechas cotidianas; es el mismo sistema que usa Afganistán, pero con nombres de meses de origen persa en lugar de los de origen árabe de Afganistán.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: ¿Qué día es hoy?
    gloss: ¿Qué día es hoy?
    note: امروز چندشنبه‌ست؟ pregunta literalmente «hoy, ¿qué día de la semana es?»; es la contracción coloquial en -e de چندشنبه است.
  fa.a1.unit10.lesson03.teach.today_word:
    title: Hoy
    gloss: hoy
    note: امروز significa «hoy».
    example_gloss: ¿A qué fecha estamos hoy?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Hoy es jueves, 10 de Ordibehesht.
    gloss: Hoy es jueves, 10 de Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته combina en una sola frase el día de la semana, la fecha ordinal y el nombre del mes, con la contracción coloquial en -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Fecha
    gloss: fecha
    note: '*تاریخ* significa «fecha»: la palabra general para una fecha del calendario, como en *تاریخ جلسه* (la fecha de la reunión).'
    example_gloss: ¿Qué fecha es hoy?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: ¿Qué día es la reunión?
    gloss: ¿Qué día es la reunión?
    note: جلسه کدوم روزه؟ pregunta en qué día de la semana será un evento.
  fa.a1.unit10.lesson05.teach.which_date:
    title: ¿Qué fecha es el martes en Ordibehesht?
    gloss: ¿Qué fecha es el martes en Ordibehesht?
    note: سه‌شنبه چندم اردیبهشته؟ pide la fecha numérica concreta de un día determinado.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8.º
    gloss: octavo
    note: '*هشتم* significa «el 8» (del mes).'
    example_gloss: Hoy es día 8.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, ¿qué día es la reunión?
    gloss: Reza, ¿qué día es la reunión?
    note: Maryam empieza preguntando directamente a Reza, usando su nombre.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Creo que es el martes.
    gloss: Creo que es el martes.
    note: فکر کنم («creo que») suaviza la respuesta de Reza, que no está del todo seguro.
  fa.a1.unit10.lesson06.teach.turn03:
    title: ¿Qué fecha es el martes en Ordibehesht?
    gloss: ¿Qué fecha es el martes en Ordibehesht?
    note: Maryam sigue preguntando por la fecha numérica concreta.
  fa.a1.unit10.lesson06.teach.turn04:
    title: El martes es 8 de Ordibehesht.
    gloss: El martes es 8 de Ordibehesht.
    note: Reza da la fecha concreta.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Vale, bien. ¿Y el viernes? ¿Tienes tiempo?
    gloss: Vale, bien. ¿Y el viernes? ¿Tienes tiempo?
    note: Maryam confirma la fecha y luego pregunta por otro día.
  fa.a1.unit10.lesson06.teach.turn06:
    title: No, el viernes estoy ocupado.
    gloss: No, el viernes estoy ocupado.
    note: سرم شلوغه (literalmente «mi cabeza está ocupada/llena») es la forma coloquial natural en Irán de decir que estás ocupado.
  fa.a1.unit10.lesson06.teach.turn07:
    title: No hay problema, nos vemos el martes.
    gloss: No hay problema, nos vemos el martes.
    note: مشکلی نیست («no hay problema») acepta con cortesía la negativa de Reza, y می‌بینمت significa «te veo / nos vemos», con lo que se confirma el martes como día de la reunión, de acuerdo con los turnos 02 y 04.
  fa.a1.unit10.lesson06.teach.va_and:
    title: Y
    gloss: y
    note: '*و* significa «y». Puede unir dos días, como en *دوشنبه و سه‌شنبه*, o dos preguntas relacionadas, como en *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: Tengo clase el lunes y el martes.
