teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: Me despierto
    gloss: me despierto
    note: بیدار می‌شم es la forma coloquial de Teherán de بیدار می‌شوم.
    example_gloss: Me despierto a las siete todos los días.
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: Desayuno
    gloss: desayuno
    note: صبحونه می‌خورم usa la forma coloquial صبحونه (desayuno) en lugar de la más formal صبحانه.
    example_gloss: Desayuno y me voy al trabajo.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: Voy al trabajo
    gloss: voy al trabajo
    note: میرم سر کار es la forma coloquial de می‌روم سر کار.
    example_gloss: Luego voy al trabajo.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: Me voy a dormir
    gloss: me voy a dormir
    note: می‌خوابم significa duermo o me voy a dormir.
    example_gloss: Me acuesto temprano por la noche.
  fa.a1.unit11.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace habitual para unir actividades de la rutina, como ya se vio en la Unidad 9.'
    example_gloss: Me despierto y desayuno.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: ¿A qué hora te despiertas?
    gloss: ¿A qué hora te despiertas?
    note: '*ساعت چند بیدار می‌شی؟* reutiliza *ساعت چند* (¿a qué hora?) de las lecciones sobre la hora de la Unidad 9.'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: Me despierto a las siete.
    gloss: Me despierto a las siete.
    note: ساعت هفت بیدار می‌شم indica una hora concreta de despertarse.
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: Cada día
    gloss: cada día
    note: هر روز significa todos los días y presenta la rutina como algo habitual.
    example_gloss: Me despierto a las siete todos los días.
  fa.a1.unit11.lesson03.teach.bad:
    title: Después de eso
    gloss: después de eso
    note: بعدش significa «después de eso» y sirve para ordenar en secuencia las actividades de la rutina.
    example_gloss: Me despierto y luego desayuno.
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: Mañana, mediodía, tarde, noche
    gloss: mañana, mediodía, tarde, noche
    note: '*صبح*, *ظهر*, *عصر* y *شب* son las cuatro partes del día, que repasas de la Unidad 9.'
    example_gloss:
    - Me despierto por la mañana.
    - Almuerzo al mediodía.
    - Trabajo por la tarde.
    - Duermo de noche.
  fa.a1.unit11.lesson03.teach.night_routine:
    title: Por la noche me acuesto a las once.
    gloss: Por la noche me acuesto a las once.
    note: '*شب‌ها ساعت یازده می‌خوابم* se apoya en *شب* (noche) del vocabulario de partes del día de la Unidad 9; *شب‌ها* significa «por las noches», como costumbre.'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: Texto sobre la rutina
    gloss: Todos los días me despierto a las siete. Después desayuno y me voy al trabajo.
    note: Este es un texto real y conectado que describe una rutina matutina, con هر روز y بعدش para ordenar las actividades.
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: ¿Y tú?
    gloss: ¿Y tú?
    note: تو چی؟ se usa para devolver la pregunta a la otra persona.
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: Un poco más tarde
    gloss: un poco más tarde
    note: یه‌کم دیرتر significa un poco más tarde y se usa para comparar dos rutinas.
  fa.a1.unit11.lesson06.teach.turn01:
    title: ¿A qué hora te despiertas todos los días?
    gloss: ¿A qué hora te despiertas todos los días?
    note: Sara empieza preguntando a Nima a qué hora se despierta.
  fa.a1.unit11.lesson06.teach.turn02:
    title: Me despierto a las siete. ¿Y tú?
    gloss: Me despierto a las siete. ¿Y tú?
    note: Nima responde y le devuelve la pregunta a Sara.
  fa.a1.unit11.lesson06.teach.turn03:
    title: Yo un poco más tarde, a las ocho.
    gloss: Yo un poco más tarde, a las ocho.
    note: Sara compara su hora de despertarse con la de Nima.
  fa.a1.unit11.lesson06.teach.turn04:
    title: ¿Qué haces después de despertarte?
    gloss: ¿Qué haces después de despertarte?
    note: Nima pregunta por el siguiente paso de la rutina de Sara.
  fa.a1.unit11.lesson06.teach.turn05:
    title: Desayuno y me voy al trabajo. Por la noche normalmente me acuesto a las once.
    gloss: Desayuno y me voy al trabajo. Por la noche normalmente me acuesto a las once.
    note: Sara describe el resto de su rutina en una sola respuesta, coherente con las mismas horas de despertarse y acostarse usadas antes en la unidad.
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: Él/ella se despierta, él/ella se acuesta
    gloss: él/ella se despierta, él/ella se acuesta
    note: بیدار می‌شه y می‌خوابه son las formas de tercera persona (او), necesarias para resumir lo que hace Sara o Nima, frente a las formas de primera persona (بیدار می‌شم، می‌خوابم) usadas en el resto de esta unidad.
