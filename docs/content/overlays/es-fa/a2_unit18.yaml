teaching:
  fa.a2.unit18.lesson01.teach.broken_word:
    title: Estropeado
    gloss: roto
    note: '*خراب* es la palabra general para algo roto o defectuoso; *خرابه* es su forma coloquial hablada (*خراب* + *است*).'
    example_gloss: Estos auriculares están estropeados.
  fa.a2.unit18.lesson01.teach.receipt_word:
    title: Recibo
    gloss: recibo
    note: '*رسید* es la palabra para el recibo de una compra.'
    example_gloss: Perdí mi recibo.
  fa.a2.unit18.lesson01.teach.return_item_note:
    title: Devolver un artículo (verbo compuesto)
    gloss: devolver (un artículo)
    note: '*پس دادن* significa literalmente «dar de vuelta»; es otra construcción con verbo ligero, como *باز کردن* de la unidad sobre el banco.'
  fa.a2.unit18.lesson01.teach.exchange_word:
    title: Cambio
    gloss: cambio de divisas
    note: '*تعویض* es la palabra para un cambio; *تعویض کردن* (cambiar) es la forma con verbo ligero.'
    example_gloss: Quiero cambiar este artículo.
  fa.a2.unit18.lesson01.teach.refund_word:
    title: Reembolso
    gloss: reembolso
    note: '*بازپرداخت* es la palabra habitual para el reembolso de dinero.'
    example_gloss: El reembolso tarda dos días.
  fa.a2.unit18.lesson01.teach.deadline_word:
    title: Plazo
    gloss: plazo
    note: '*مهلت* es la palabra general para un plazo o un margen de tiempo permitido.'
    example_gloss: El plazo de devolución es de siete días.
  fa.a2.unit18.lesson01.teach.recap_headphones:
    title: Compré estos auriculares
    gloss: Compré estos auriculares
    note: Frase de repaso que presenta *هدفون* (auriculares), el artículo en torno al cual gira la situación de esta unidad.
  fa.a2.unit18.lesson02.teach.no_sound_word:
    title: No tiene sonido
    gloss: no tiene sonido
    note: '*صدا نداره* (literalmente «sonido no tiene») describe un aparato sin salida de audio.'
    example_gloss: Estos auriculares no tienen sonido.
  fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund:
    title: Quiero cambiarlos o que me devuelvan el dinero
    gloss: Quiero cambiar estos auriculares o que me devuelvan el dinero.
    note: '*یا* (o) le ofrece a la tienda elegir entre las dos soluciones que cubre esta frase.'
  fa.a2.unit18.lesson02.teach.full_complaint_sentence:
    title: Explica el problema y tu petición juntos
    gloss: Compré estos auriculares pero no tienen sonido. Quiero cambiarlos o que me devuelvan el dinero.
    note: 'El patrón completo de reclamación en que se basa esta lección: primero el problema y luego la petición.'
  fa.a2.unit18.lesson03.teach.purchase_date_word:
    title: Fecha de compra
    gloss: fecha de compra
    note: '*تاریخ خرید* es la expresión habitual para la fecha en que se compró algo.'
    example_gloss: La fecha de compra está en el recibo.
  fa.a2.unit18.lesson03.teach.policy_notice_text:
    title: Aviso de la política de devoluciones de una tienda
    gloss: 'Plazo de devolución de productos: siete días desde la fecha de compra, con recibo.'
    note: Un aviso oficial breve de una tienda, el registro escrito que enseña esta lección.
  fa.a2.unit18.lesson04.teach.please_word:
    title: Por favor
    gloss: por favor
    note: '*لطفاً* es una palabra de cortesía que se coloca al final de una petición.'
    example_gloss: Cámbielo, por favor.
  fa.a2.unit18.lesson04.teach.turn01:
    title: نیما explica el problema
    gloss: نیما dice con educación que compró estos auriculares pero no tienen sonido.
    note: Combina la frase de repaso de la lección 1 con *صدا نداره* de la lección 2.
  fa.a2.unit18.lesson04.teach.turn02:
    title: فروشنده pide el recibo y la fecha
    gloss: El empleado le pregunta si tiene el recibo y qué día lo compró.
    note: '*خریدینش* es la forma hablada y cortés de «usted lo compró» (por escrito *خریدید*, más el pronombre *-ش* para «lo»).'
  fa.a2.unit18.lesson04.teach.turn03:
    title: نیما confirma y da la fecha
    gloss: 'نیما dice que sí, aquí tiene: lo compró hace tres días.'
    note: '*بفرمایید* aquí significa «aquí tiene» al entregar algo.'
  fa.a2.unit18.lesson04.teach.turn04:
    title: فروشنده confirma que está dentro del plazo y ofrece elegir
    gloss: El empleado dice que no hay problema, que está dentro del plazo de siete días, y le pregunta si quiere un cambio o que le devuelvan el dinero.
    note: '*تو مهلت هفت روزه هستید* (está dentro del plazo de siete días) confirma que cumple las condiciones.'
  fa.a2.unit18.lesson04.teach.turn05:
    title: نیما pide el cambio
    gloss: نیما pide el cambio con educación.
    note: '*کنید* es la forma de imperativo cortés de *کردن* (hacer).'
  fa.a2.unit18.lesson04.teach.turn06:
    title: فروشنده completa el cambio
    gloss: El empleado dice que de acuerdo, que ahora mismo le da unos auriculares nuevos.
    note: '*بهتون می‌دم* (le doy) cierra el cambio.'
