teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: Personas, días y palabras pequeñas
    gloss: yo, tú, él/ella, ellos/ellas, Sara, Nima, hoy, mañana, tarde, un/una, y, o, no
    note: '*اون* significa «él/ella/eso» y *اونا* significa «ellos/ellas». El persa no tiene palabras distintas para «él» y «ella».'
    example_gloss:
    - Tú y yo.
    - Sara y Nima.
    - Hoy o mañana.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: Tener trabajo o tiempo
    gloss: tengo trabajo, tienes tiempo, tiene tiempo
    note: '*کار دارم* significa «tengo trabajo / estoy ocupado/a». La terminación cambia según la persona: *دارم*, *داری*, *داره*.'
    example_gloss:
    - Hoy tengo trabajo.
    - ¿Tienes tiempo mañana?
    - Sara tiene tiempo mañana.
  fa.a2.unit39.lesson01.teach.message_words:
    title: Mensajes y notas
    gloss: mensaje, nota, teléfono, mi colega, mi amigo/a
    note: Un mensaje de teléfono es un *پیغام*; uno escrito puede ser una *یادداشت*. *همکارم* y *دوستم* no indican si la persona es hombre o mujer.
    example_gloss:
    - Mi amigo/a tiene un mensaje.
    - Mi colega tiene una nota.
    - Sara tiene un teléfono.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: Estar en casa
    gloss: casa, está, no está, estás
    note: '*خونه هست* significa «está en casa». *هستی* es la forma de «tú» y *هست* la de «él/ella».'
    example_gloss:
    - Nima está en casa.
    - Sara no está en casa.
    - ¿Estás en casa?
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: Verbos para transmitir un mensaje
    gloss: dice, dicen, pregunta, quiere
    note: Cada verbo está en presente y en tercera persona. Usa *می‌گه* para transmitir una afirmación, *می‌پرسه* para una pregunta y *می‌خواد* para una petición.
    example_gloss:
    - Mi amigo dice.
    - Dicen.
    - Mi colega pregunta.
    - Sara quiere.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: Llegar tarde
    gloss: llego tarde, llega tarde
    note: El mismo verbo *می‌رسه* sirve para «él» y para «ella».
    example_gloss:
    - Hoy llego tarde.
    - Sara llega tarde.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'Transmitir una afirmación: می‌گه که'
    gloss: Llego tarde. Sara dice que llega tarde.
    note: 'Para transmitir una afirmación, di quién habla, luego *می‌گه که* y después lo que se dijo. El verbo se queda en presente. Cambia la persona: *دیر می‌رسم* (yo) pasa a *دیر می‌رسه* (él/ella). *که* («que») puede omitirse al hablar, pero hace que el mensaje transmitido sea más claro.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: A mí, a ti, a él/ella, para ti
    gloss: a mí, a ti, a él/ella, para ti
    note: 'Estas formas cortas añaden la persona al verbo: *بهم* (a mí), *بهت* (a ti), *بهش* (a él/ella).'
    example_gloss:
    - Tengo un mensaje para usted.
    - Sara tiene un mensaje para él/ella.
    - Nima tiene un mensaje para mí.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: Lo que quiere que hagas
    gloss: llames, vengas, respondas, leas
    note: 'Después de *می‌خواد که*, el segundo verbo es una forma de «tú» con *ب*: *بزنی*, *بیای*, *بدی*, *بخونی*.'
    example_gloss:
    - Sara quiere que la llames.
    - Nima quiere que vengas mañana.
    - Mi colega quiere que respondas.
    - Mi amigo quiere que leas la nota.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: Llamo, él/ella llama
    gloss: Llamo, él/ella llama
    note: 'El presente también se usa para un plan: *فردا زنگ می‌زنم* puede significar «mañana llamaré».'
    example_gloss:
    - Mañana llamaré.
    - Sara llamará mañana.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: ¿Cuándo? Llegas
    gloss: cuándo, llegas
    note: '*کی* es una palabra interrogativa. En una pregunta transmitida se mantiene igual: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - ¿Cuándo llegas mañana?
    - Mi colega pregunta cuándo llegas.
    - ¿Cuándo estás en casa?
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'Transmitir una pregunta: می‌پرسه'
    gloss: Pregunta si tienes tiempo. Pregunta cuándo llegas.
    note: 'Una pregunta de sí o no pasa a ser *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. La palabra interrogativa se queda en su lugar: *می‌پرسه که کی می‌رسی*. Desaparece el signo de interrogación y el verbo sigue en presente.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'Transmitir una petición: می‌خواد که + forma con ب'
    gloss: Quiere que lo/la llames.
    note: 'Para transmitir una petición, usa *می‌خواد که* y un verbo con *ب*: *می‌خواد که بهش زنگ بزنی*. No significa «quiere llamar»: la terminación de «tú» *ـی* indica que eres tú quien debe actuar. El *که* puede omitirse: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: Llave y coche
    gloss: llave, coche, mi llave, su llave, es el coche
    note: 'Añade *ـم* para «mi» y *ـش* para «su»: *کلیدم*, *کلیدش*. En *تو ماشینه*, *تو* significa «en» y *ـه* significa «es/está».'
    example_gloss:
    - Mi llave está en el coche.
    - Su llave está en el coche.
    - Sara tiene coche.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: Llegan, tienen
    gloss: llegan, tienen
    note: 'La terminación de «ellos» es *ـن*: *می‌رسن*, *دارن*, *می‌گن*.'
    example_gloss:
    - Llegan tarde.
    - Mañana tienen trabajo.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: ¿Afirmación, pregunta o petición?
    gloss: Dice que mañana tiene tiempo. Pregunta si tú tienes tiempo mañana. Quiere que lo/la llames.
    note: El verbo te indica qué tipo de mensaje es. *می‌گه* es una afirmación y termina con un verbo de tercera persona (*داره*). *می‌پرسه* es una pregunta y su verbo se refiere a «tú» (*داری*). *می‌خواد* es una petición y va seguido de un verbo con *ب* (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: Qué cambia al transmitir un mensaje
    gloss: Tengo trabajo. Dice que tiene trabajo. Mi llave. Su llave.
    note: 'Al transmitir un mensaje, el «yo» original pasa a ser «él/ella». La terminación verbal *ـم* se convierte en *ـه* (*دارم* → *داره*) y el posesivo *ـم* se convierte en *ـش* (*کلیدم* → *کلیدش*). El persa no marca el género, así que *داره* significa tanto «él tiene» como «ella tiene». El tiempo verbal no cambia: el presente sigue en presente.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'Una persona o varias: می‌گه y می‌گن'
    gloss: Dice que llega tarde. Dicen que llegan tarde.
    note: 'Una sola letra distingue a una persona de varias: *می‌گه … می‌رسه* (él/ella) y *می‌گن … می‌رسن* (ellos). Los dos verbos del mensaje transmitido deben concordar.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: Ahora, esta noche, reunión
    gloss: ahora, esta noche, reunión
    note: '*جلسه* es una reunión, a menudo de trabajo.'
    example_gloss:
    - Ahora tengo una reunión.
    - ¿Estás en casa esta noche?
    - Mi colega tiene una reunión esta noche.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: Frases para mensajes de teléfono
    gloss: ¿Qué dice tu colega? ¿Qué más? ¿De quién? Sí.
    note: Estas frases cortas mantienen viva una conversación sobre un mensaje.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: Una nota con una afirmación y una pregunta
    gloss: Mi colega dice que hoy llega tarde y pregunta si estás en casa.
    note: 'En una nota escrita, une los dos mensajes con *و* y repite el verbo en cada uno: *می‌گه که …* y *می‌پرسه که … یا نه*. Primero va quien habla, y no se repite.'
  fa.a2.unit39.lesson05.teach.reading:
    title: Una nota para Nima
    gloss: Nima, tengo un mensaje para ti. Tu colega dice que hoy tiene una reunión y llega tarde. Pregunta si tienes tiempo mañana y quiere que lo/la llames.
    note: Lee una vez para saber quién envía el mensaje y otra vez para distinguir la afirmación, la pregunta y la petición.
  fa.a2.unit39.lesson06.teach.turn01:
    title: Sara tiene un mensaje
    gloss: Sara le dice a Nima que tiene un mensaje para él.
    note: La frase inicial anuncia el mensaje.
  fa.a2.unit39.lesson06.teach.turn02:
    title: Nima pregunta de quién es
    gloss: ¿De quién?
    note: Una pregunta corta pide saber quién lo envía.
  fa.a2.unit39.lesson06.teach.turn03:
    title: Sara indica quién lo envía y da la primera afirmación
    gloss: De tu colega. Dice que hoy llega tarde.
    note: Sara transmite una afirmación con *می‌گه که*.
  fa.a2.unit39.lesson06.teach.turn04:
    title: Nima pide más información
    gloss: ¿Qué más dice?
    note: '*دیگه چی* pide la siguiente parte.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: Sara transmite una pregunta y una petición
    gloss: Pregunta si tienes tiempo mañana y quiere que lo/la llames.
    note: Un mensaje es una pregunta; el otro, una petición.
  fa.a2.unit39.lesson06.teach.turn06:
    title: Nima responde
    gloss: Sí, mañana tengo tiempo. Ahora mismo lo/la llamo.
    note: Nima responde en primera persona, porque habla por sí mismo.
