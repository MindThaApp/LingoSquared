    title: Nota de ejemplo sobre síntomas
    gloss: Tengo dolor de cabeza y fiebre. Estoy cansado/a.
    note: Una nota breve en primera persona que combina el vocabulario de síntomas de esta unidad.
  fa.a1.unit17.lesson06.teach.names:
    title: Nima y Sara
    gloss: Nima, Sara
    note: Nombres iraníes comunes que se usan a lo largo de este curso.
    example_gloss:
    - Nima tiene dolor de cabeza.
    - Sara ayuda a Nima.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: También
    gloss: también
    note: هم significa «también» y se coloca después de la palabra a la que se refiere (آب هم بخور = bebe agua también).
    target_text: هم (también)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: Bien
    gloss: bien
    note: باشه es la contracción coloquial de باشد (vale, de acuerdo).
    example_gloss: Vale, descansaré.
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: Gracias
    gloss: gracias
    note: ممنون significa gracias.
    example_gloss: Gracias por tu ayuda.
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: Tiene
    gloss: tiene
    note: داره es la forma coloquial de tercera persona de دارد («tiene»); sigue el mismo patrón que دارم en primera persona.
    target_text: داره (tiene, tercera persona coloquial)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Nima dice
    gloss: No me siento bien. Tengo dolor de cabeza y fiebre.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: Sara aconseja
    gloss: Descansa. Bebe agua también.
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: Nima responde
    gloss: Vale, gracias.
