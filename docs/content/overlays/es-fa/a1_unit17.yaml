teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: No me siento bien
    gloss: No me siento bien
    note: 'حالم خوب نیست significa literalmente «mi estado no es bueno»: es la forma habitual de decir que no te encuentras bien.'
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: سردرد significa dolor de cabeza.
    example_gloss: Me duele la cabeza.
  fa.a1.unit17.lesson01.teach.daram_word:
    title: Tengo
    gloss: tengo
    note: دارم significa tengo y se usa con un sustantivo de síntoma (سردرد دارم = tengo dolor de cabeza).
    target_text: دارم (tengo)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Fiebre
    gloss: fiebre
    note: تب significa «fiebre».
    example_gloss: Tengo fiebre.
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: Me duele el estómago
    gloss: me duele el estómago
    note: 'دلم درد می‌کنه significa literalmente «mi estómago hace dolor»: es la forma coloquial de decir que te duele el estómago.'
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Estoy cansado
    gloss: estoy cansado/a
    note: '*خسته‌ام* significa «estoy cansado/a»: la terminación *-ام* es la forma corta de *هستم* (soy/estoy) unida a *خسته* (cansado).'
    example_gloss: Hoy estoy cansado.
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Ayuda
    gloss: ayuda
    note: کمک significa «ayuda».
    example_gloss: ¿Puedes ayudarme?
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: Puedes
    gloss: puedes
    note: می‌تونی es la contracción coloquial de می‌توانی («puedes»), segunda persona informal.
    target_text: می‌تونی (puedes, informal)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: ¿Puede ayudarme?
    gloss: ¿Puede ayudarme?
    note: '*می‌تونی کمکم کنی؟* combina *می‌تونی* (puedes) con *کمکم کنی* (literalmente «hacer mi ayuda», es decir, ayudarme).'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: Médico
    gloss: médico
    note: دکتر significa «médico» o «doctor».
    example_gloss: El médico dijo que descansara.
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: Medicina
    gloss: medicina
    note: دارو significa «medicina» o «medicamento».
    example_gloss: Toma esta medicina.
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: Descansa (orden)
    gloss: descansa
    note: 'استراحت کن es el imperativo informal: «¡descansa!».'
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Bebe agua (orden)
    gloss: bebe agua
    note: 'آب بخور es el imperativo informal: «¡bebe agua!».'
  fa.a1.unit17.lesson04.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
