teaching:
  fa.a1.unit05.lesson01.teach.hotel:
    title: Hotel
    gloss: hotel
    note: هتل es la palabra persa habitual para «hotel».
    example_gloss: Nuestro hotel está cerca.
  fa.a1.unit05.lesson01.teach.restoran:
    title: Restaurante
    gloss: restaurante
    note: رستوران es un préstamo común que se usa para «restaurante».
    example_gloss: Este restaurante es bueno.
  fa.a1.unit05.lesson01.teach.dastshooyi:
    title: Baño
    gloss: baño
    note: دستشویی es la palabra cotidiana para decir baño o servicios.
    example_gloss: ¿Dónde está el baño?
  fa.a1.unit05.lesson01.teach.inja_oonja:
    title: Aquí, allí
    gloss: aquí, allí
    note: اینجا (aquí) y اونجا (allí; forma coloquial hablada de آنجا) son las formas habituales en la lengua hablada.
  fa.a1.unit05.lesson01.teach.kojast:
    title: ¿Dónde está el hotel?
    gloss: ¿Dónde está el hotel?
    note: کجاست une کجا (dónde) con است (es/está).
  fa.a1.unit05.lesson01.teach.bebakhshid:
    title: Disculpa, ¿dónde está el hotel?
    gloss: Disculpe, ¿dónde está el hotel?
    note: ببخشید (disculpe) es la forma educada habitual para empezar una pregunta a un desconocido.
  fa.a1.unit05.lesson02.teach.samt:
    title: Lado, dirección
    gloss: lado, dirección
    note: سمت se usa con راست/چپ para decir «el lado derecho/izquierdo».
    example_gloss: El hotel está por aquí.
  fa.a1.unit05.lesson02.teach.rast:
    title: Derecha
    gloss: derecha
    note: راست también significa «verdadero/correcto» en otros contextos, pero aquí indica la dirección.
    example_gloss: Vaya a la derecha.
  fa.a1.unit05.lesson02.teach.chap:
    title: Izquierda
    gloss: izquierda
    note: چپ, la dirección (izquierda).
    example_gloss: Vaya a la izquierda.
  fa.a1.unit05.lesson02.teach.samte_rast:
    title: Está a la derecha
    gloss: Está a la derecha.
    note: En el habla cotidiana, سمت راست است se convierte en سمت راسته.
  fa.a1.unit05.lesson02.teach.samte_chap:
    title: Está a la izquierda
    gloss: Está a la izquierda.
    note: En el habla cotidiana, سمت چپ است se convierte en سمت چپه.
  fa.a1.unit05.lesson02.teach.restoran_samte_rast:
    title: El restaurante está a la derecha
    gloss: El restaurante está a la derecha.
    note: Combina رستوران con la expresión de lugar de esta lección.
  fa.a1.unit05.lesson03.teach.mostaghim:
    title: Todo recto
    gloss: todo recto
    note: مستقیم, la palabra cotidiana para ir recto.
    example_gloss: Vaya todo recto.
  fa.a1.unit05.lesson03.teach.berid:
    title: Vaya (formal)
    gloss: vaya (formal)
    note: برید es la forma respetuosa para indicarle a un desconocido que vaya a algún sitio.
    example_gloss: Vaya a la derecha.
  fa.a1.unit05.lesson03.teach.mostaghim_berid:
    title: Sigue recto
    gloss: Sigue recto.
    note: 'مستقیم برید: la indicación educada habitual.'
  fa.a1.unit05.lesson03.teach.bad:
    title: Después, luego
    gloss: después, luego
    note: بعد enlaza dos pasos de una indicación.
    example_gloss: Luego vaya a la izquierda.
  fa.a1.unit05.lesson03.teach.mostaghim_bad_samte_rast:
    title: Siga recto; hay un restaurante a la derecha
    gloss: Siga recto. Luego hay un restaurante a la derecha.
    note: Retoma سمت راست (a la derecha) de la lección anterior y lo completa con un punto de referencia.
  fa.a1.unit05.lesson03.teach.mamnoon:
    title: Gracias. De nada.
    gloss: Gracias. De nada.
    note: ممنون / خواهش می‌کنم es el intercambio educado habitual, ya visto en la Unidad 1.
  fa.a1.unit05.lesson04.teach.kenar:
    title: Al lado de
    gloss: junto a, al lado de
    note: 'کنار coloca una cosa junto a otra: هتل کنار رستورانه significa «el hotel está junto al restaurante».'
    example_gloss: El hotel está junto al restaurante.
  fa.a1.unit05.lesson04.teach.azadi:
    title: Azadi (nombre)
    gloss: Azadi (libertad)
    note: آزادی se usa mucho en nombres de lugares y negocios de Irán, así que هتل آزادی suena como un nombre de hotel natural.
    example_gloss: La plaza Azadi es famosa.
  fa.a1.unit05.lesson04.teach.hamoon:
    title: Ese mismo
    gloss: ese mismo
    note: همون es la forma hablada habitual de همان y remite al restaurante que se acaba de mencionar.
    example_gloss: Ese mismo restaurante es bueno.
  fa.a1.unit05.lesson04.teach.dialogue_line1:
    title: Disculpe, ¿dónde está el hotel Azadi?
    gloss: 'Sara: Disculpe, ¿dónde está el hotel Azadi?'
    note: Sara es el personaje que ya conoces de la Unidad 2.
  fa.a1.unit05.lesson04.teach.dialogue_line2:
    title: Siga recto; el hotel está junto al restaurante
    gloss: 'Transeúnte: Siga recto. Luego hay un restaurante a la derecha. El hotel está junto a ese restaurante.'
    note: کنار significa «junto a»; همون رستورانه remite al restaurante que se acaba de mencionar.
  fa.a1.unit05.lesson04.teach.dialogue_line3:
    title: Gracias
    gloss: 'Sara: Gracias.'
    note: Sara da las gracias al transeúnte.
  fa.a1.unit05.lesson04.teach.dialogue_line4:
    title: De nada
    gloss: 'Transeúnte: De nada.'
    note: El transeúnte cierra el intercambio con cortesía.
