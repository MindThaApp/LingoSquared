teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: yo
    gloss: yo
    note: '*من*, que ya conoces bien, vuelve a aparecer aquí para hablar de cómo te desplazas.'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: En / con
    gloss: en / con
    note: '*با* es la preposición que se usa con un vehículo: *با* + nombre del vehículo + *می‌رم* significa «voy en [vehículo]».'
    target_text: با (en / con)
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Autobús
    gloss: autobús
    note: '*اتوبوس* es la palabra cotidiana para «autobús».'
    example_gloss: Voy en autobús.
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: Voy en autobús
    gloss: voy en autobús
    note: '*با اتوبوس می‌رم* combina *با* + *اتوبوس* + *می‌رم* («voy»).'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Metro
    gloss: metro
    note: '*مترو* es un préstamo directo y cotidiano; el metro de Teherán se llama realmente *مترو*.'
    example_gloss: Voy en metro.
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: Voy en metro
    gloss: voy en metro
    note: '*با مترو می‌رم* sigue exactamente el mismo patrón *با* + vehículo + *می‌رم* que el autobús.'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Coche
    gloss: coche
    note: '*ماشین* es la palabra cotidiana para «coche».'
    example_gloss: Voy en coche.
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: Voy en coche
    gloss: voy en coche
    note: '*با ماشین می‌رم* sigue el mismo patrón *با* + vehículo + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Bicicleta
    gloss: bicicleta
    note: '*دوچرخه* significa «bicicleta»; literalmente, «dos ruedas».'
    example_gloss: Voy en bicicleta.
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: Voy en bicicleta
    gloss: voy en bicicleta
    note: '*با دوچرخه می‌رم* mantiene el mismo patrón una vez más.'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: Cada día
    gloss: cada día
    note: '*هر روز* vuelve a aparecer aquí para describir un trayecto habitual.'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: Al trabajo
    gloss: trabajar
    note: '*سر کار* significa «al trabajo»; no hace falta preposición, solo *می‌رم* + *سر کار*.'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: Todos los días voy al trabajo en coche
    gloss: Todos los días voy al trabajo en coche
    note: '*هر روز با ماشین می‌رم سر کار* reúne todo lo de esta lección: frecuencia, vehículo y destino.'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: A pie
    gloss: a pie
    note: '*پیاده* significa «a pie». A diferencia de los vehículos vistos hasta ahora, NO lleva *با*: se dice *پیاده می‌رم*, no *با پیاده می‌رم*.'
    example_gloss: Voy a pie.
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: Voy a pie (sin با)
    gloss: voy a pie
    note: '*پیاده می‌رم*: aquí *پیاده* funciona como un adverbio, igual que en español «voy a pie» o «camino» no llevan el mismo tipo de preposición que un vehículo («en autobús»).'
    target_text: پیاده می‌رم (sin با)
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Taxi
    gloss: taxi
    note: '*تاکسی* es un préstamo directo y cotidiano para «taxi», y SÍ lleva *با* como los demás vehículos.'
    example_gloss: Voy en taxi.
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: Voy en taxi
    gloss: voy en taxi
    note: '*با تاکسی می‌رم* sigue el patrón regular *با* + vehículo.'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Cuál
    gloss: cuál
    note: '*کدوم* significa «cuál»; se usa aquí para preguntar qué transporte es mejor.'
