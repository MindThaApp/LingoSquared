  fa.a1.unit28.lesson05.teach.reading_text:
    title: 'Lectura: los trayectos de Nima y Sara'
    gloss: Nima va al trabajo en autobús todos los días. A veces también va a pie. Sara va a la escuela en bicicleta todos los días.
    note: Esta lectura reutiliza todas las construcciones de las lecciones 1 a 4 y el *می‌ره* y *مدرسه* de la lección 5; casi no hay vocabulario nuevo, solo practicas reconocerlo en un texto continuo.
  fa.a1.unit28.lesson06.teach.tochi_review:
