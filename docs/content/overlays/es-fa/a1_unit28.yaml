    note: '*یا* une aquí las dos opciones de transporte.'
    target_text: یا (o)
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: ¿Autobús o metro, cuál es mejor?
    gloss: ¿Autobús o metro, cuál es mejor?
    note: '*اتوبوس یا مترو، کدوم بهتره؟* combina *یا* para enumerar las opciones con *کدوم بهتره؟* para pedir una recomendación.'
  fa.a1.unit28.lesson04.teach.belit_review:
