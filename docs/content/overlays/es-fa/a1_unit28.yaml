  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: 'Nima: Voy al trabajo en autobús todos los días. ¿Y tú?'
    gloss: Voy al trabajo en autobús todos los días. ¿Y tú?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Sara: Yo voy a la escuela en bicicleta.'
    gloss: Yo voy a la escuela en bicicleta.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Nima: ¿Autobús o bicicleta, qué es mejor?'
    gloss: ¿Autobús o bicicleta, qué es mejor?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Sara: La bicicleta es mejor, porque es ejercicio.'
    gloss: La bicicleta es mejor, porque es ejercicio.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Nima: Sí, pero a veces también voy a pie.'
    gloss: Sí, pero a veces también voy a pie.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Sara: ¡Qué bien!'
    gloss: ¡Qué bien!
