  fa.a1.unit28.lesson04.teach.cheghadr_review:
    title: Cuánto
    gloss: cuánto
    note: '*چقدر* se usa aquí para preguntar el precio de un billete.'
  fa.a1.unit28.lesson04.teach.belit_cheghadr_phrase:
    title: ¿Cuánto cuesta un billete de autobús?
    gloss: ¿Cuánto cuesta un billete de autobús?
    note: '*بلیط اتوبوس چقدره؟* combina *بلیط اتوبوس* con *چقدره* («cuánto cuesta»).'
  fa.a1.unit28.lesson04.teach.daghighe_review:
