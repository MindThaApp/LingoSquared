course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: nombrar medios para desplazarse (autobús, metro, coche, bicicleta, a pie, taxi), decir cómo te desplazas habitualmente (todos los días en autobús al trabajo), preguntar qué transporte es mejor (اتوبوس یا مترو، کدوم بهتره؟), preguntar el precio de un billete local y leer una frase breve de horarios de transporte, una lectura sobre los trayectos habituales de نیما y سارا, y un diálogo final entre نیما y سارا en el que comparan cómo se desplaza cada uno.'
