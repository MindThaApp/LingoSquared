teaching:
  fa.a2.unit14.lesson01.teach.interview_word:
    title: Entrevista
    gloss: entrevista
    note: '*مصاحبه* es la palabra general para «entrevista».'
    example_gloss: Mañana tengo una entrevista.
  fa.a2.unit14.lesson01.teach.experience_word:
    title: Experiencia
    gloss: experiencia
    note: '*تجربه* es la palabra general para «experiencia».'
    example_gloss: Tengo tres años de experiencia laboral.
  fa.a2.unit14.lesson01.teach.skill_word:
    title: Habilidad
    gloss: habilidad
    note: '*مهارت* es la palabra general para «habilidad».'
    example_gloss: ¿Qué habilidades tiene usted?
  fa.a2.unit14.lesson01.teach.salary_word:
    title: Sueldo
    gloss: sueldo
    note: '*حقوق* significa «sueldo».'
    example_gloss: ¿Cuál es el sueldo de este trabajo?
  fa.a2.unit14.lesson01.teach.job_opportunity_word:
    title: Oportunidad laboral
    gloss: oportunidad laboral
    note: '*فرصت شغلی* significa «oportunidad laboral».'
    example_gloss: Esta es una buena oportunidad laboral.
  fa.a2.unit14.lesson01.teach.resume_word:
    title: Currículum
    gloss: currículum
    note: '*رزومه* es la palabra persa estándar (tomada del francés y del inglés) para «currículum».'
    example_gloss: Envié mi currículum.
  fa.a2.unit14.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace habitual que se usa a lo largo de esta unidad.'
    target_text: و (y)
  fa.a2.unit14.lesson01.teach.ra_note:
    title: Object marker
    gloss: (marca un complemento directo determinado)
    note: '*رو* (forma coloquial de *را* en el registro formal) marca un complemento directo determinado: va justo después de aquello sobre lo que recae la acción.'
    target_text: رو (marca del objeto directo)
  fa.a2.unit14.lesson02.teach.three_years_experience:
    title: Expresar la experiencia laboral con una duración
    gloss: Tengo tres años de experiencia laboral.
    note: '*سه سال تجربه‌ی کار* indica la duración de la experiencia, un paso más allá de limitarse a nombrar el trabajo, como en A1.'
  fa.a2.unit14.lesson02.teach.can_start_next_week:
    title: Expresar la disponibilidad
    gloss: Puedo empezar la semana que viene.
    note: '*از هفته‌ی دیگه* (a partir de la semana que viene) indica cuándo estás disponible para empezar.'
  fa.a2.unit14.lesson02.teach.clarifying_question:
    title: Hacer una pregunta para aclarar
    gloss: ¿Cuál es el horario de este trabajo?
    note: '*ساعت کاری این شغل چطوره؟* es una pregunta aclaratoria natural para hacerle a quien te entrevista.'
  fa.a2.unit14.lesson03.teach.salesperson_word:
    title: Vendedor
    gloss: vendedor
    note: '*فروشنده* es la palabra general para «vendedor» o «vendedora».'
    example_gloss: La tienda necesita un vendedor.
  fa.a2.unit14.lesson03.teach.at_least_word:
    title: Al menos
    gloss: al menos / mínimo
    note: '*حداقل* significa «al menos» o «mínimo».'
    example_gloss: Se necesita al menos un año de experiencia.
  fa.a2.unit14.lesson03.teach.posting_text:
    title: Una oferta de trabajo
    gloss: La tienda necesita un vendedor con al menos un año de experiencia. Sueldo adecuado. Las entrevistas se harán esta semana.
    note: Una oferta de trabajo breve en estilo escrito neutro, aunque aún usa las formas habladas cotidianas *داره* y *می‌شه*.
  fa.a2.unit14.lesson04.teach.tell_me_about_experience:
    title: Hábleme de su experiencia
    gloss: Por favor, hábleme de su experiencia laboral.
    note: '*لطفاً از تجربه‌ی کاریتون بگید.* es una frase de apertura habitual del entrevistador.'
  fa.a2.unit14.lesson04.teach.turn01:
    title: مصاحبه‌کننده pregunta por la experiencia
    gloss: El entrevistador le pide a آرش que le hable de su experiencia laboral.
    note: Retoma la frase de apertura de esta misma lección.
  fa.a2.unit14.lesson04.teach.turn02:
    title: آرش describe su experiencia
    gloss: آرش dice que trabajó tres años en una oficina.
    note: Retoma el patrón de duración de la experiencia de la lección 2, en una forma algo distinta.
  fa.a2.unit14.lesson04.teach.turn03:
    title: مصاحبه‌کننده pregunta por las habilidades
    gloss: El entrevistador le pregunta qué habilidades tiene.
    note: '*چه مهارت‌هایی دارید؟* pregunta específicamente por las habilidades.'
  fa.a2.unit14.lesson04.teach.turn04:
    title: آرش describe sus habilidades
    gloss: آرش dice que se le dan bien el trabajo en equipo y la resolución de problemas.
    note: '*تو ... خوبم* (se me da bien ...) expresa una habilidad.'
  fa.a2.unit14.lesson04.teach.turn05:
    title: مصاحبه‌کننده pregunta por la disponibilidad
    gloss: El entrevistador le pregunta si puede empezar la semana que viene.
    note: Retoma el patrón de disponibilidad de la lección 2 en forma de pregunta.
  fa.a2.unit14.lesson04.teach.turn06:
    title: آرش confirma
    gloss: آرش dice que sí, que puede.
    note: Una confirmación breve y directa.
