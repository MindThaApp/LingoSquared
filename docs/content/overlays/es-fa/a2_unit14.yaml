course:
  title: Persa A2
  description: 'Farsi iraní de nivel intermedio bajo: describir la experiencia laboral y la disponibilidad, leer una oferta de trabajo y seguir una entrevista de trabajo básica, desde la pregunta hasta la respuesta.'
