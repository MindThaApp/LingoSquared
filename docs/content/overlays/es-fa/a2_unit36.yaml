teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: Ir a lugares
    gloss: fui, voy, ayer, hoy
    note: '*رفتم* es el pasado simple (fui); *می‌رم* es el presente hablado (voy / estoy yendo).'
    example_gloss:
    - Ayer fui al mercado.
    - Hoy voy al banco.
  fa.a2.unit36.lesson01.teach.places:
    title: Lugares de gestiones
    gloss: banco, oficina de correos, mercado
    note: El persa hablado dice *رفتم بانک* sin ninguna palabra para «a».
    example_gloss:
    - Ayer fui al banco.
    - Hoy voy a correos.
    - Ayer fui al mercado.
  fa.a2.unit36.lesson01.teach.things:
    title: Cosas para las gestiones
    gloss: dinero, paquete, carta, libro, un / uno
    note: '*یه* es la forma hablada normal de «un / uno».'
    example_gloss:
    - Tengo dinero.
    - Tengo un paquete.
    - Tengo una carta.
    - Tengo un libro.
  fa.a2.unit36.lesson01.teach.connectors:
    title: Dos formas de decir «para»
    gloss: para / para que, para / para que (corta, hablada)
    note: '*برای اینکه* es el conector completo; *تا* es el más corto y muy común en la lengua hablada. Los dos van seguidos de la misma forma verbal.'
    example_gloss:
    - Fui al banco para sacar dinero.
    - Fui al banco a sacar dinero.
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: Verbos de la finalidad
    gloss: (que) saque, (que) compre, (que) envíe
    note: Estas terminaciones (*بـ* + raíz + *م*) son el subjuntivo. Indican el objetivo que aún no se ha cumplido.
    example_gloss:
    - Fui al banco a sacar dinero.
    - Fui al mercado para comprar un libro.
    - Fui a correos para enviar una carta.
  fa.a2.unit36.lesson01.teach.post_items:
    title: Correo y documentos de viaje
    gloss: sobre, sello, pasaporte, documentos
    note: '*پاکت* y *تمبر* son útiles en la oficina de correos; *پاسپورت* y *مدارک* son cosas que hay que preparar antes de viajar.'
    example_gloss:
    - Tengo un sobre y un sello.
    - Tengo mi pasaporte y mis documentos.
  fa.a2.unit36.lesson01.teach.travel_items:
    title: Preparación del viaje
    gloss: maleta, divisas, lista, destino
    note: '*چمدون* es la forma hablada habitual para decir «maleta». *مقصد* es el lugar al que planeas llegar.'
    example_gloss:
    - Tengo una maleta.
    - Tengo divisas y una lista.
    - Para ir al destino.
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + subjuntivo
    gloss: Fui al banco para sacar dinero
    note: 'Di lo que hiciste, luego *برای اینکه* y después el objetivo en subjuntivo: *رفتم بانک برای اینکه پول بگیرم*. El verbo del objetivo no indica «pasado»: apunta hacia el objetivo.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: Palabras para aprender
    gloss: clase, inglés, (para) aprender, (para) hablar
    note: '*یاد بگیرم* y *حرف بزنم* son verbos de dos partes; el *بـ* del subjuntivo va en la parte verbal (*بگیرم*, *بزنم*).'
    example_gloss:
    - Voy a clase para aprender inglés.
    - Leo libros para hablar inglés.
  fa.a2.unit36.lesson02.teach.saving_words:
    title: Palabras para ahorrar y leer
    gloss: ahorro dinero, coche, (para) leer
    note: '*پول جمع می‌کنم* es la expresión habitual para ahorrar dinero. *جمع کنم* es su subjuntivo.'
    example_gloss:
    - Ahorro dinero para comprar un coche.
    - Leo libros para aprender inglés.
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: Formación del subjuntivo
    gloss: obtengo, para obtener; compro, para comprar
    note: 'Quita *می‌* y pon *بـ* delante de la raíz: *می‌گیرم* pasa a *بگیرم*, *می‌خرم* pasa a *بخرم*. Con *کردن* normalmente se omite el *بـ*: *جمع می‌کنم* pasa a *جمع کنم*. Las terminaciones no cambian (*-م* para «yo»).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + subjuntivo (y تا بتونم)
    gloss: para sacar dinero; para poder hablar inglés
    note: '*تا* funciona como *برای اینکه*: *رفتم بانک تا پول بگیرم*. Usa *تا بتونم* («para poder») cuando el objetivo es poder hacer algo; *بتونم* ya es un subjuntivo y el verbo siguiente también lo es.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + sustantivo o nombre verbal
    gloss: para hacer compras; para enviar una carta
    note: Después de *برای* puedes poner un sustantivo simple (*خرید*, compras) o un nombre verbal en *-ن* (*فرستادن*, enviar). Entonces no hay subjuntivo ni *اینکه*.
  fa.a2.unit36.lesson03.teach.reason_words:
    title: Palabras de causa
    gloss: porque, por qué, qué, necesitaba, me gusta
    note: '*چون* da una razón. *لازم داشتم* («necesitaba») y *دوست دارم* («me gusta») son verbos normales, no subjuntivos.'
    example_gloss:
    - Fui al banco porque necesitaba dinero.
    - Voy a clase porque me gusta el inglés.
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: Causa (چون) frente a finalidad (تا)
    gloss: porque necesitaba dinero / para sacar dinero
    note: '*چون* mira hacia atrás, a la causa, y usa un verbo normal: *چون پول لازم داشتم*. *تا* y *برای اینکه* miran hacia delante, al objetivo, y usan el subjuntivo: *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: Fíjate en el verbo para distinguirlos
    gloss: porque necesitaba dinero / para sacar dinero
    note: Si la oración tiene un tiempo normal (*داشتم*, *دارم*), el conector es *چون*. Si tiene un subjuntivo (*بگیرم*, *بخرم*), el conector es *برای اینکه* o *تا*.
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: Preguntar para qué
    gloss: ¿Para qué fuiste al banco? ¿Para qué quieres dinero? ¿Para qué vas a clase?
    note: '*برای چی؟* pregunta por el objetivo. La respuesta es una finalidad con *تا* o *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: Pregunta y respuesta
    gloss: ¿Para qué fuiste al banco? Fui para sacar dinero.
    note: Responde a *برای چی؟* con la acción más *تا* o *برای اینکه* y el subjuntivo. Una respuesta corta, solo *تا پول بگیرم*, también es natural.
  fa.a2.unit36.lesson05.teach.reading:
    title: Un día de recados
    gloss: Hoy tenía cosas que hacer. Primero fui al banco para sacar dinero. Luego fui a correos para enviar una carta. Por último fui al mercado a hacer compras. Ahorro dinero para comprar un coche.
    note: Lee una vez para identificar los tres recados y otra vez para ver el objetivo de cada uno.
  fa.a2.unit36.lesson06.teach.turn01:
    title: Sara le pregunta a Nima por qué llega tarde
    gloss: 'Sara pregunta: Nima, ¿por qué llegaste tarde?'
    note: '*چرا* pregunta por la razón.'
  fa.a2.unit36.lesson06.teach.turn02:
    title: Nima da una razón
    gloss: 'Nima: Porque el banco estaba lleno.'
    note: '*چون* más un verbo normal en pasado da una razón.'
  fa.a2.unit36.lesson06.teach.turn03:
    title: Sara pregunta para qué
    gloss: 'Sara: ¿Para qué fuiste al banco?'
    note: Ahora *برای چی* pregunta por el objetivo.
  fa.a2.unit36.lesson06.teach.turn04:
    title: Dos recados con sus objetivos
    gloss: 'Nima: Fui al banco para sacar dinero. Luego fui a correos para enviar un paquete.'
    note: Un objetivo usa *تا* más subjuntivo; el otro usa *برای* más un nombre verbal.
  fa.a2.unit36.lesson06.teach.turn05:
    title: Sara pregunta por el dinero
    gloss: 'Sara: ¿Para qué quieres dinero?'
    note: Otra pregunta con *برای چی* sobre un objetivo.
  fa.a2.unit36.lesson06.teach.turn06:
    title: Nima dice el objetivo
    gloss: 'Nima: Ahorro dinero para comprar un coche.'
    note: '*تا ماشین بخرم* expresa el objetivo.'
