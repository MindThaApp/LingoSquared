course:
  title: Persa A2
  description: 'Farsi de Irán de nivel preintermedio: avisar al portero del edificio de una tubería que gotea, leer la confirmación de una solicitud de mantenimiento y entender la llamada en la que se organiza la reparación.'
units:
  fa.a2.unit13.maintenance:
    title: Avisar de un problema en casa
lessons:
  fa.a2.unit13.lesson01.maintenance_vocabulary:
    title: Palabras de problemas domésticos
  fa.a2.unit13.lesson02.reporting_the_problem:
    title: Avisar del problema
  fa.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Leer un aviso de mantenimiento
  fa.a2.unit13.lesson04.maintenance_call_dialogue:
    title: La llamada telefónica
teaching:
  fa.a2.unit13.lesson01.teach.pipe_word:
    title: Tubería
    gloss: tubería
    note: '*لوله* es la palabra general para «tubería».'
    example_gloss: La tubería del baño está goteando.
  fa.a2.unit13.lesson01.teach.leak_word:
    title: Gotera
    gloss: gotera / goteo
    note: '*چکه* significa gotera o goteo y se usa con *کردن*: *چکه کردن* (gotear).'
    example_gloss: La tubería está goteando.
  fa.a2.unit13.lesson01.teach.radiator_word:
    title: Radiador
    gloss: radiador / calefactor
    note: '*شوفاژ* es la palabra persa habitual para «radiador» o «calefactor».'
    example_gloss: El radiador está estropeado.
  fa.a2.unit13.lesson01.teach.broken_word:
    title: Estropeado
    gloss: roto
    note: '*خراب* significa estropeado y se usa con *شدن*: *خراب شدن* (estropearse).'
    example_gloss: El radiador está estropeado.
  fa.a2.unit13.lesson01.teach.super_word:
    title: Portero del edificio
    gloss: portero / encargado del edificio
    note: '*سرایدار* es la persona que se encarga de la gestión y el mantenimiento de un edificio de apartamentos.'
    example_gloss: Llamé al portero del edificio.
  fa.a2.unit13.lesson01.teach.repair_word:
    title: Reparación
    gloss: reparación
    note: '*تعمیر* es la palabra general para una reparación.'
    example_gloss: ¿Cuándo viene la reparación?
  fa.a2.unit13.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: '*و* es la palabra de enlace más común y se usa a lo largo de esta unidad.'
    target_text: و (y)
  fa.a2.unit13.lesson01.teach.ra_note:
    title: Object marker
    gloss: (marca un complemento directo determinado)
    note: '*رو* (forma coloquial de *را*) marca un complemento directo determinado y va justo después de aquello sobre lo que recae la acción.'
    target_text: رو (marcador de objeto directo)
  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: Explicar el problema
    gloss: La tubería del baño está goteando.
    note: '*داره چکه می‌کنه* usa el presente progresivo *داره + verbo* para describir un problema que está ocurriendo ahora, no un hecho puntual.'
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: Preguntar cuándo pueden repararlo
    gloss: ¿Cuándo pueden venir a repararlo?
    note: '*کی می‌تونید ...؟* pregunta con cortesía cuándo puede alguien hacer algo.'
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: Unir el aviso y la pregunta
    gloss: La tubería del baño está goteando. ¿Cuándo pueden venir a repararla?
    note: El patrón completo de aviso más pregunta en el que se basa esta lección.
  fa.a2.unit13.lesson03.teach.request_word:
    title: Solicitud
    gloss: solicitud
    note: '*درخواست* es la palabra general para una solicitud; aquí se usa con *ثبت شد* (fue registrada).'
    example_gloss: Su solicitud de reparación ha sido registrada.
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: Técnico de reparaciones
    gloss: técnico de reparaciones
    note: '*تعمیرکار* es la persona que viene a hacer una reparación.'
    example_gloss: El técnico viene mañana.
  fa.a2.unit13.lesson03.teach.notice_text:
    title: Confirmación de una solicitud de mantenimiento
    gloss: Su solicitud de reparación ha sido registrada. El técnico vendrá mañana a las 10 de la mañana. Por favor, esté en casa.
    note: Una breve confirmación oficial en estilo escrito neutro, aunque aún usa *میاد* y *خونه*, propios de la lengua hablada cotidiana.
  fa.a2.unit13.lesson04.teach.since_when:
    title: Preguntar desde cuándo
    gloss: ¿Desde cuándo está así?
    note: '*از کی این‌طوریه؟* pregunta desde cuándo ocurre un problema.'
  fa.a2.unit13.lesson04.teach.turn01:
    title: سارا explica el problema
    gloss: سارا saluda y dice que la tubería de su baño está goteando.
    note: Retoma el patrón de presente progresivo de la lección 2.
  fa.a2.unit13.lesson04.teach.turn02:
    title: El سرایدار pregunta desde cuándo
    gloss: El portero pregunta desde cuándo está así.
    note: Retoma la pregunta inicial de esta misma lección.
  fa.a2.unit13.lesson04.teach.turn03:
    title: سارا indica la duración y añade más detalles
    gloss: سارا dice que desde ayer. El agua está cayendo al suelo.
    note: '*از دیروز* (desde ayer) indica la duración; una segunda oración añade un detalle.'
  fa.a2.unit13.lesson04.teach.turn04:
    title: El سرایدار acepta ir
    gloss: El portero dice que de acuerdo, que mañana por la mañana irá a repararla.
    note: '*میام* (forma coloquial de *می‌آیم*, «voy / vengo») expresa su propio plan.'
  fa.a2.unit13.lesson04.teach.turn05:
    title: سارا confirma que estará en casa
    gloss: سارا da las gracias y dice que está en casa hasta las 11.
    note: '*خونه‌ام* (forma coloquial de *خانه هستم*, «estoy en casa») expresa su propia disponibilidad.'
  fa.a2.unit13.lesson04.teach.turn06:
    title: El سرایدار confirma
    gloss: El portero dice que muy bien, que nos vemos entonces.
    note: '*می‌بینمتون* («los veré / nos vemos») cierra la llamada con cortesía.'
