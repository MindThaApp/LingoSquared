teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Casa
    gloss: casa
    note: خونه significa «casa» o «hogar» (forma coloquial de خانه).
    example_gloss: Mi casa es grande.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Dormitorio
    gloss: dormitorio
    note: 'اتاق خواب significa literalmente «cuarto de dormir»: dormitorio.'
    example_gloss: Tiene dos dormitorios.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Cocina
    gloss: cocina
    note: آشپزخانه significa «cocina».
    example_gloss: La cocina es grande.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Baño
    gloss: baño
    note: حموم significa «cuarto de baño» (forma coloquial de حمام).
    example_gloss: El baño está limpio.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Cuántos
    gloss: cuántos / cuántas
    note: چند تا significa «cuántos» y se usa con sustantivos contables.
    target_text: چند تا (cuántos)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Dos
    gloss: dos
    note: دو تا significa «dos» (de algo contable).
    example_gloss: Tiene dos baños.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Tiene
    gloss: tiene
    note: داره es la contracción coloquial de دارد («tiene») y se usa para describir lo que hay en una casa.
    target_text: داره (tiene, coloquial)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Cama
    gloss: cama
    note: تخت significa «cama».
    example_gloss: La cama está en el dormitorio.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Mesa
    gloss: mesa
    note: میز significa «mesa».
    example_gloss: La mesa está junto a la ventana.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Silla
    gloss: silla
    note: صندلی significa «silla».
    example_gloss: Hay una silla junto a la mesa.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Un/uno
    gloss: un / uno
    note: یه es la contracción coloquial de یک («un/una»).
    target_text: یه (un/una, coloquial)
  fa.a1.unit19.lesson03.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
  fa.a1.unit19.lesson04.teach.too_word:
    title: En / dentro de
    gloss: en / dentro de
    note: تو significa «en» o «dentro de» e indica ubicación dentro de una habitación.
    target_text: تو (en/dentro de)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: Junto a
    gloss: al lado de
    note: کنار significa «junto a».
    target_text: کنار (junto a)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Encima de
    gloss: encima de / sobre
    note: بالای significa «encima de» o «sobre».
    target_text: بالای (encima de)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: Es la cama
    gloss: es la cama
    note: '*تخته* es *تخت* (cama) más la -e coloquial que equivale a «es» (de *است*). En *میز کنار تخته*, la -e final es lo que convierte la expresión en oración: la mesa [está] junto a la cama.'
    target_text: تخته (es la cama, coloquial)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: Es la cocina
    gloss: es la cocina
    note: '*آشپزخانه‌س* es *آشپزخانه* (cocina) más el «es» coloquial tras vocal (de *است*). En *صندلی تو آشپزخانه‌س* cierra la oración: la silla [está] en la cocina.'
    target_text: آشپزخانه‌س (es la cocina, coloquial)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: También
    gloss: también
    note: هم significa «también» y se coloca después de la palabra a la que se refiere.
    target_text: هم (también)
  fa.a1.unit19.lesson05.teach.man_word:
    title: yo
    gloss: yo
    note: من significa «yo».
    example_gloss: Mi casa tiene dos dormitorios.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: Casa de / mi casa
    gloss: casa de / mi casa
    note: خونه‌ی es la forma con ezafe de خونه y se usa ante el poseedor (خونه‌ی من = mi casa).
    target_text: خونه‌ی (casa de / mi casa, forma con ezafe)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Ejemplo de descripción de una vivienda
    gloss: Mi casa tiene dos dormitorios. También tiene una cocina y un baño.
    note: Una breve descripción en primera persona que combina el vocabulario de la vivienda de esta unidad.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima y Sara
    gloss: Nima, Sara
    note: Nombres iraníes comunes que se usan a lo largo de este curso.
    example_gloss:
    - La casa de Nima es grande.
    - La casa de Sara es pequeña.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: ¿Cómo es tu casa?
    gloss: ¿Cómo es tu casa?
    note: خونه‌ت چطوره؟ combina خونه‌ت («tu casa») con چطوره؟ («¿cómo es?»).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: Está bien
    gloss: está bien
    note: خوبه es la contracción coloquial de خوب است («es bueno»).
    example_gloss: Esta casa está bien.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Sí
    gloss: sí
    note: آره es la forma coloquial de بله («sí»).
    example_gloss: Sí, está bien.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Nima pregunta
    gloss: ¿Cómo es tu casa?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Sara responde
    gloss: Está bien. Tiene dos dormitorios y una cocina.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Nima pregunta
    gloss: ¿También tiene baño?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Sara responde
    gloss: Sí, también tiene un baño.
