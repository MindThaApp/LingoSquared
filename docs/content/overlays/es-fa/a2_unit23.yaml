teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: Expresiones de tiempo de la infancia
    gloss: antes, en aquel entonces, cuando era niño/a, todos los días, todos los veranos
    note: '*قبلا* y *اون موقع* sitúan una escena en el pasado. *هر روز* y *هر تابستون* indican repetición, por lo que se combinan de forma natural con el pasado habitual con *می‌*.'
    example_gloss:
    - Iba a la escuela a pie todos los días.
    - En aquel entonces yo era un niño.
    - Todos los veranos jugábamos en el parque.
  fa.a2.unit23.lesson01.teach.places:
    title: Lugares de la casa y del barrio
    gloss: casa, patio, barrio, escuela, parque
    note: '*توی* es la forma hablada habitual de «en». Con *رفتن*, al hablar se puede mantener u omitir *به*: *به مدرسه می‌رفتم* y *می‌رفتم مدرسه*.'
    example_gloss:
    - Nuestra casa tenía un patio.
    - Nuestro barrio era tranquilo.
    - Iba a la escuela a pie.
    - Jugábamos en el parque.
  fa.a2.unit23.lesson01.teach.descriptions:
    title: Describir lugares
    gloss: tranquilo, concurrido, grande, cerca, lejos
    note: Úsalas con el pasado *بود* para describir cómo era un lugar. En persa hablado, *دوره* significa «queda lejos».
    example_gloss:
    - El barrio era tranquilo.
    - La escuela estaba muy concurrida.
    - El patio era grande.
    - La escuela estaba cerca.
    - Ahora el parque queda lejos.
  fa.a2.unit23.lesson01.teach.activities:
    title: Actividades de la infancia
    gloss: a pie, libro, fútbol, jugar, leer, construir
    note: '*بازی کردن* es un verbo compuesto. En el pasado habitual, *می‌* va en *کردن*: *بازی می‌کردم*.'
    example_gloss:
    - Iba a la escuela a pie.
    - Leía libros.
    - Jugaba al fútbol.
    - Construían algo en el patio.
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: La forma del pasado habitual
    gloss: yo iba, yo leía, yo hacía, ellos construían
    note: 'Para una costumbre repetida del pasado, pon *می‌* antes de la raíz del pasado y añade la terminación de persona: *می‌رفت + م* → *می‌رفتم*. Mantén el espacio sin separación (ZWNJ) después de *می‌*.'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: Personas y enlaces útiles
    gloss: yo, nosotros, ellos, con, un/una, algo, por las tardes
    note: En persa hablado se omiten a menudo los pronombres sujeto; estas palabras aclaran la persona o el contexto cuando hace falta.
    example_gloss:
    - Leía un libro todos los días.
    - Jugábamos en el parque.
    - Construían algo.
    - Jugaba al fútbol con Nima.
    - Teníamos un patio grande.
    - Jugábamos por las tardes.
  fa.a2.unit23.lesson02.teach.now_words:
    title: Ahora y ya no
    gloss: ahora, ya no, no, allí, cómo
    note: '*دیگه* con un verbo negativo significa «ya no»: *دیگه بازی نمی‌کنم*.'
    example_gloss:
    - Ahora el barrio está concurrido.
    - Ya no juego allí.
    - No, la escuela no quedaba lejos.
    - ¿Cómo era tu barrio?
  fa.a2.unit23.lesson02.teach.full_forms:
    title: Las terminaciones de persona con می‌رفت
    gloss: yo, tú, él/ella, nosotros, ellos iba/ibas/iba/íbamos/iban
    note: 'Las terminaciones del pasado no cambian: *-م، -ی،* sin terminación, *-یم، -ن*. La tercera persona del plural hablada es *می‌رفتن*.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: Costumbres de lectura y de juego
    gloss: tú/él/nosotros leíamos (leías, leía, leíamos); yo/nosotros jugábamos (jugaba, jugábamos)
    note: 'El mismo patrón funciona con otras raíces del pasado. Un verbo compuesto mantiene el sustantivo separado: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: Estados del pasado con بودن y داشتن
    gloss: yo era niño/a; el barrio era tranquilo; teníamos un patio grande
    note: Usa el pasado de *بودن* y *داشتن* para descripciones de fondo. Son estados, así que aquí las formas naturales son *بودم، بود، داشتیم*, sin *می‌* habitual.
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: Costumbre frente a un hecho único
    gloss: Iba a la escuela todos los días. Ayer fui a la escuela.
    note: '*هر روز می‌رفتم* es un pasado repetido. *دیروز رفتم* es un solo viaje terminado. La expresión de tiempo y la presencia o ausencia de *می‌* funcionan juntas.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: El pasado habitual negativo
    gloss: No solía ir; no solía leer; no solía jugar
    note: 'Pon *نـ* antes de *می‌*: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. Mantén *نمی‌* unido a la raíz con un espacio sin separación (ZWNJ).'
  fa.a2.unit23.lesson04.teach.then_now:
    title: Antes frente a ahora
    gloss: Antes nuestro barrio era tranquilo; ahora está concurrido.
    note: Combina *قبلا* o *اون موقع* con la descripción del pasado, y luego *حالا* con el contraste del presente.
  fa.a2.unit23.lesson05.teach.reading:
    title: El barrio de la infancia
    gloss: Cuando era niño, nuestro barrio era tranquilo. Teníamos una casa con un patio grande. Iba a la escuela a pie todos los días. Por las tardes jugaba al fútbol en el patio. Ahora el barrio está concurrido y ya no juego allí.
    note: El texto combina un estado del pasado, costumbres repetidas y un contraste con el presente.
  fa.a2.unit23.lesson06.teach.names:
    title: Sara y Nima
    gloss: Sara, Nima
    note: Sara y Nima son los amigos habituales de esta conversación.
    example_gloss:
    - Sara habla de su infancia.
    - Nima habla de su barrio.
  fa.a2.unit23.lesson06.teach.turn01:
    title: Sara pregunta por el barrio de antes
    gloss: Cuando eras niño, ¿cómo era tu barrio?
    note: Sara pregunta por un estado del pasado con una forma pasada del verbo ser.
  fa.a2.unit23.lesson06.teach.turn02:
    title: Nima describe su infancia
    gloss: Nuestro barrio era tranquilo. Teníamos una casa con un patio grande. Todos los días iba a la escuela a pie y por las tardes jugaba al fútbol en el patio. ¿Y tú?
    note: Nima mezcla estados del pasado (era, teníamos) con costumbres repetidas (iba a pie, jugaba).
  fa.a2.unit23.lesson06.teach.turn03:
    title: Sara añade un contraste entre antes y ahora
    gloss: Nuestra escuela estaba cerca. Todos los veranos jugábamos en el parque. Ahora el parque queda lejos y ya no juego allí.
    note: Sara termina con *حالا ... دیگه ... نمی‌کنم* para contrastar el presente con el pasado.
