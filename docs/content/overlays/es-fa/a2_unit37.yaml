teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: Palabras del tiempo
    gloss: tiempo (atmosférico), lluvia, nieve, soleado, frío, cálido, mañana, hoy
    note: '*بارون* es la forma hablada habitual de «lluvia»; en la escritura cuidada se usa *باران*. Las formas habladas *آفتابیه*, *سرده* y *گرمه* terminan en *-ه* con el sentido de «es/está».'
    example_gloss:
    - Mañana hace sol.
    - Hoy hace frío.
    - Hace calor.
  fa.a2.unit37.lesson01.teach.plan_words:
    title: Lugares y verbos de planes
    gloss: parque, casa, mercado, cine, fuera, en, vamos, no vamos, nos quedamos
    note: 'El presente se usa para los planes: *می‌ریم* es «vamos» o «vamos a ir», y *نمی‌ریم* es «no vamos a ir».'
    example_gloss:
    - Mañana vamos al parque.
    - Nos quedamos en casa.
    - Hoy no salimos.
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه y los verbos de la condición
    gloss: si, venga (llueva), sea/esté, viene (presente)
    note: '*اگه* es la forma hablada de *اگر* («si»). *بارون بیاد* dice literalmente «lluvia venga», que es como el persa dice «llueve».'
    example_gloss:
    - Si nieva, no salimos.
    - Si hace frío, no vamos al parque.
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه más subjuntivo
    gloss: Si llueve, no vamos al parque.
    note: 'Para una condición posible, pon el verbo en subjuntivo después de *اگه*: *بیاد*, *باشه*. El resultado va en presente normal: *نمی‌ریم*. Pon una coma entre las dos partes.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه más presente
    gloss: Si mañana llueve, nos quedaremos en casa.
    note: 'También oirás el presente después de *اگه*: *اگه بارون میاد*. Significa lo mismo: una condición real. En esta unidad producirás el subjuntivo (*بیاد*); la forma de presente es para reconocerla cuando la oigas.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: Tiempo, cansado, trabajo
    gloss: tiempo, cansado, trabajo, yo, nosotros
    note: '*وقت دارم* significa «tengo tiempo». No se refiere a la hora del reloj.'
    example_gloss:
    - Mañana tengo tiempo.
    - Hoy no tengo tiempo.
    - Hoy tenemos trabajo.
  fa.a2.unit37.lesson02.teach.come_forms:
    title: Formas de «venir» y «tener tiempo»
    gloss: vengo, vienes, no vengo, tenga (subjuntivo), tengas (subjuntivo), estemos
    note: '*میام* es el «vengo / iré» hablado. En una condición usa *داشته باشم*, *داشته باشی*, *خسته باشیم*: son formas de subjuntivo.'
    example_gloss:
    - ¿Vienes mañana?
    - Hoy no vengo.
  fa.a2.unit37.lesson02.teach.person_endings:
    title: Une la terminación con la persona
    gloss: tengo, tienes, él o ella tiene, tenemos
    note: 'La terminación después de *داشته* cambia según la persona: *باشم* (yo), *باشی* (tú), *باشه* (él/ella), *باشیم* (nosotros). El persa suele omitir el pronombre porque la terminación indica la persona, como ocurre en español.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: El resultado va en presente
    gloss: Si tengo tiempo, iré.
    note: Aquí el persa no necesita una forma de futuro. El presente en el resultado, *میام*, ya significa «iré».
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: Cuando, llegar, trabajo terminado, tienda
    gloss: cuando, llegue, mi trabajo, terminado, se vuelve/queda, tienda, abierto, a, te llamaré
    note: '*وقتی* significa «cuando». *کارم تموم بشه* es «mi trabajo termine». *بهت زنگ می‌زنم* es «te llamaré».'
    example_gloss:
    - Cuando termine mi trabajo, iré.
    - Mañana te llamaré.
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: Formas negativas de la condición e «ir/quedarse»
    gloss: no vengas, no venga, no sea/esté, no tenga, solo, voy, me quedo
    note: 'Pon *نـ* en el verbo en subjuntivo para hacer negativa la condición: *نیای*, *نیاد*, *نباشه*, *نداشته باشم*.'
    example_gloss:
    - Voy solo.
    - Hoy me quedo en casa.
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: Una condición negativa
    gloss: Si no vienes, iré solo. Si no llueve, iremos al parque.
    note: 'Una condición negativa sigue siendo una condición posible. Pon el verbo en subjuntivo en negativo con *نـ*: *اگه نیای*, *اگه بارون نیاد*. El resultado puede ser afirmativo o negativo.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه es «quizá», وقتی es «seguro»
    gloss: Cuando termine mi trabajo, iré. Si tengo tiempo, iré.
    note: Usa *وقتی* cuando el hecho sucederá seguro y solo dices cuándo. Usa *اگه* cuando puede que no suceda. Ambos pueden ir seguidos de un verbo en subjuntivo y un resultado en presente.
  fa.a2.unit37.lesson04.teach.shop_words:
    title: Palabras de tienda
    gloss: recibo, dinero, artículo, defectuoso, descuento, este, usted tiene, está abierto
    note: '*جنس* es la mercancía o el artículo que compras. *رسید دارید؟* es una pregunta educada a un cliente.'
    example_gloss:
    - Este artículo es defectuoso.
    - ¿Tiene el recibo?
    - La tienda está abierta hoy.
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: Verbos de las normas de la tienda
    gloss: lo cambiamos, devolvemos, compran, reciben, tengan, su dinero
    note: 'El personal de la tienda habla a los clientes con las terminaciones educadas de *شما*: *داشته باشید*, *بخرید*, *می‌گیرید*, y *-تون* en *پولتون*. *رو* sigue a un complemento directo determinado.'
    example_gloss:
    - Cambiamos este artículo.
    - Hoy reciben un descuento.
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: Una norma de tienda con اگه
    gloss: Si tienen el recibo, les devolvemos su dinero.
    note: 'Una norma de tienda tiene la misma forma que un plan: *اگه* más una condición en subjuntivo y luego un resultado en presente. Con los clientes se usan las terminaciones educadas *-ید* y *-تون*.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: ¿Y si...?
    gloss: ¿Y si llueve? ¿Y si no tengo el recibo?
    note: Añade *چی؟* después de la condición para preguntar «¿y si...?».
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: ¿Y si llueve?
    note: 'La condición mantiene su verbo en subjuntivo y *چی؟* va al final, sin oración de resultado. La otra persona responde con el resultado: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: Palabras de mensajes y avisos
    gloss: hola, bien, ven (orden), no puedes, venir, a mí, llama (orden), aviso
    note: '*بیا* y *بزن* son órdenes amistosas. *بهم زنگ بزن* significa «llámame».'
    example_gloss:
    - ¡Hola! Hace buen tiempo.
    - Si no puedes venir, llámame.
  fa.a2.unit37.lesson05.teach.message:
    title: Un mensaje sobre mañana
    gloss: ¡Hola, Nima! Mañana, si hace sol, vamos al parque. Si llueve, vamos al cine. Si tienes tiempo, ven. Si no puedes venir, llámame.
    note: Lee fijándote en cada condición y su resultado.
  fa.a2.unit37.lesson05.teach.notice:
    title: Un aviso de tienda
    gloss: 'Aviso de la tienda: si el artículo es defectuoso, lo cambiamos. Si tienen el recibo, les devolvemos su dinero. Si no tienen el recibo, no devolvemos el dinero. Si compran hoy, reciben un descuento.'
    note: Cada oración es una norma con una condición y un resultado.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: Sí, bien, después
    gloss: sí, bien, después
    note: '*آره* es el «sí» hablado habitual. *بعدش* significa «después de eso».'
    example_gloss:
    - Sí, vamos mañana.
    - ¡Bien! Después vamos al mercado.
  fa.a2.unit37.lesson06.teach.turn01:
    title: Sara propone el parque
    gloss: 'Sara pregunta: Nima, ¿vamos mañana al parque?'
    note: Una pregunta en presente puede referirse a un plan.
  fa.a2.unit37.lesson06.teach.turn02:
    title: Nima expresa una condición
    gloss: 'Nima responde: Sí, si no llueve.'
    note: 'Una condición negativa puede ser toda la respuesta: *اگه بارون نیاد، آره.*'
  fa.a2.unit37.lesson06.teach.turn03:
    title: Sara pregunta «¿y si...?»
    gloss: 'Sara pregunta: ¿Y si llueve?'
    note: '*اگه ... چی؟* pregunta por la otra posibilidad.'
  fa.a2.unit37.lesson06.teach.turn04:
    title: Nima da el otro plan
    gloss: 'Nima responde: Si llueve, iremos al cine.'
    note: La respuesta es una condición más un resultado en presente.
  fa.a2.unit37.lesson06.teach.turn05:
    title: Sara añade un segundo plan
    gloss: 'Sara dice: Bien. Si tienes tiempo, después iremos al mercado.'
    note: El segundo plan depende de una nueva condición.
  fa.a2.unit37.lesson06.teach.turn06:
    title: Nima distingue «si» y «cuando»
    gloss: 'Nima dice: Si tengo tiempo, iré. Cuando termine mi trabajo, te llamaré.'
    note: '*اگه* indica una posibilidad; *وقتی* indica algo que va a suceder.'
exercises:
  fa.a2.unit37.lesson01.exercise01.recognize_rain_condition:
    instruction: ¿Qué significa esta frase?
    correct_option: Si llueve, no vamos al parque.
    distractors:
    - Cuando llueve, siempre vamos al parque.
    - Está lloviendo, así que vamos al parque.
    - Llueva o no, vamos al parque.
    accepted_answers:
    - value: Si llueve, no vamos al parque.
      status: correct
    feedback: '*اگه بارون بیاد* es la condición «si llueve»; *نمی‌ریم پارک* es el resultado.'
  fa.a2.unit37.lesson01.exercise02.recognize_present_condition:
    instruction: ¿Qué significa esta frase? Usa el presente después de اگه.
    correct_option: Si mañana llueve, nos quedaremos en casa.
    distractors:
    - Si ayer llovió, nos quedamos en casa.
    - Mañana lloverá y saldremos.
    - Si nos quedamos en casa, lloverá.
    accepted_answers:
    - value: Si mañana llueve, nos quedaremos en casa.
      status: correct
    feedback: '*اگه بارون میاد* es la forma en presente de expresar la misma condición real.'
