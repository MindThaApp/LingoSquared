    - Si vengo, tendré tiempo.
    accepted_answers:
    - value: Si tengo tiempo, iré.
      status: correct
    feedback: '*باشم* es la terminación de «yo», y *میام* es el resultado en presente: «vendré».'
  fa.a2.unit37.lesson02.exercise02.recognize_tired_condition:
    instruction: ¿Qué significa esta frase?
    correct_option: Si estás cansado, no salimos.
    distractors:
