teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: Cosas de las que hablar
    gloss: libro, regalo, bolso
    note: '*یه* es el «un / una» de la lengua hablada.'
    example_gloss:
    - Tengo un libro.
    - Tengo un regalo.
    - Tengo un bolso.
  fa.a2.unit46.lesson01.teach.verbs:
    title: Verbos en pasado
    gloss: compré, vi, leí, conseguí, (marca del objeto directo)
    note: '*رو* va después de aquello sobre lo que recae el verbo. Las terminaciones del pasado son *-م* (yo), *-ی* (tú) y ninguna (él / ella).'
    example_gloss:
    - Compré el libro.
    - Vi el regalo.
    - Leí el libro.
    - Conseguí el bolso.
  fa.a2.unit46.lesson01.teach.clitic:
    title: Verbo más ش
    gloss: lo compré, lo vi, lo leí, lo conseguí
    note: 'La terminación *-ش* representa la cosa o la persona de la que ya se habló: «lo», «la». Se añade al final del verbo.'
    example_gloss:
    - Ayer lo compré.
    - Ayer lo vi.
    - Ayer lo leí.
    - Ayer lo conseguí.
  fa.a2.unit46.lesson01.teach.you:
    title: Preguntar «¿lo viste?»
    gloss: viste, lo viste, conseguiste
    note: '*دیدی* es «viste»; si añades *-ش* tienes «lo viste».'
    example_gloss:
    - ¿Viste el regalo?
    - ¿Dónde lo viste?
    - ¿Conseguiste el bolso?
  fa.a2.unit46.lesson01.teach.rule:
    title: Dilo una vez y luego usa ش
    gloss: Compré el libro; lo compré
    note: 'La primera vez, nombra la cosa con *رو*. Después, quita el sustantivo y *رو* y añade *-ش* al verbo: *کتاب رو خریدم*, y luego *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: Personas
    gloss: mi amigo/a, mis amigos/as, los niños
    note: '*دوستم* es «mi amigo/a» y *دوستام* es «mis amigos/as».'
    example_gloss:
    - Vi a mi amigo.
    - Vi a mis amigos.
    - Vi a los niños.
  fa.a2.unit46.lesson02.teach.them:
    title: Decir «los» y «te»
    gloss: los vi, te vi
    note: La terminación *-شون* significa «los / las»; *-ت* significa «te». Ambas se añaden al verbo, igual que *-ش*.
    example_gloss:
    - Ayer los vi.
    - Ayer te vi.
  fa.a2.unit46.lesson02.teach.when:
    title: Ayer y dónde
    gloss: ayer, dónde
    note: '*دیروز* es «ayer»; *کجا* es «dónde».'
    example_gloss:
    - Ayer te vi.
    - ¿Dónde lo viste?
  fa.a2.unit46.lesson02.teach.three:
    title: Tres terminaciones
    gloss: lo / la vi; los / las vi; te vi
    note: '*-ش* es una persona o cosa, *-شون* es más de una, y *-ت* es «te». Usa *-شون* para más de una persona o cosa.'
  fa.a2.unit46.lesson03.teach.actions:
    title: Dar, devolver, pedir prestado
    gloss: di, de vuelta, pedí prestado
    note: '*پس دادم* es «devolví»; *قرض گرفتم* es «pedí prestado».'
    example_gloss:
    - Di el libro.
    - Devolví el libro.
    - Pedí prestado el libro.
  fa.a2.unit46.lesson03.teach.fused:
    title: Preposición más ش
    gloss: a él / ella, de él / ella, para él / ella, con él / ella
    note: 'En la lengua hablada, *به، از، برای، با* se unen a la terminación de persona: *بهش, ازش, براش, باهاش*. Se refieren a una persona ya mencionada.'
    example_gloss:
    - Le di el libro.
    - Se lo pedí prestado.
    - Le compré el regalo.
    - Fui con él / ella.
  fa.a2.unit46.lesson03.teach.me:
    title: A mí, para mí
    gloss: a mí, para mí
    note: Con *-م* las mismas palabras significan «a mí» y «para mí».
    example_gloss:
    - Me lo dio.
    - Me lo compró.
  fa.a2.unit46.lesson03.teach.names:
    title: Nombrar primero a la persona
    gloss: Nima, Sara, fui
    note: 'Primero nombra a la persona y luego refiérete a ella: *از نیما قرض گرفتم*, y después *ازش*.'
    example_gloss:
    - Se lo pedí prestado a Nima.
    - Fui con Sara.
  fa.a2.unit46.lesson03.teach.rule:
    title: Preposiciones con pronombre pegado
    gloss: Pedí prestado a Nima; se lo pedí prestado a él
    note: Sustituye *از نیما* por *ازش*, *با سارا* por *باهاش*, *برای مینا* por *براش*. Como ya se sabe de quién se trata, no hace falta el nombre.
  fa.a2.unit46.lesson04.teach.questions:
    title: Preguntar por ello
    gloss: ¿lo compraste?, ¿lo leíste?, ¿lo conseguiste?
    note: 'Para «tú», la terminación del pasado es *-ی* y luego *-ش*: *خریدی* pasa a *خریدیش*.'
    example_gloss:
    - ¿Compraste el regalo?
    - ¿Lo compraste ayer?
    - ¿Lo leíste ayer?
    - ¿Lo conseguiste ayer?
  fa.a2.unit46.lesson04.teach.negative:
    title: Decir que no
    gloss: no lo vi, no lo compré, no lo leí, no lo conseguí
    note: 'Pon *ن* delante del verbo en pasado: *دیدم* pasa a *ندیدم*, y *-ش* sigue yendo al final: *ندیدمش*.'
    example_gloss:
    - Ayer no lo vi.
    - Ayer no lo compré.
    - Ayer no lo leí.
    - Ayer no lo conseguí.
  fa.a2.unit46.lesson04.teach.answers:
    title: Sí y no
    gloss: sí, no
    note: '*آره* es el «sí» de la lengua hablada.'
    example_gloss:
    - Sí, lo vi.
    - No, no lo vi.
  fa.a2.unit46.lesson04.teach.rule:
    title: Respuestas cortas
    gloss: ¿Leíste el libro? Sí, lo leí. No, no lo leí.
    note: 'Una respuesta corta no necesita el sustantivo. Repite el verbo con *-ش*: *آره، خوندمش* o *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: Palabras para el texto
    gloss: cumpleaños, fue, tienda, en, luego, contento/a, se puso, también, dio
    note: '*خوشحال شد* es «se puso contento/a». *هم* significa «también».'
    example_gloss:
    - Ayer fue el cumpleaños de Nima.
    - En la tienda vi un libro.
    - Luego le di el libro.
    - Se puso muy contento.
    - Nima también me dio un bolso.
  fa.a2.unit46.lesson05.teach.reading:
    title: El cumpleaños de Nima
    gloss: Ayer fue el cumpleaños de Nima. En la tienda vi un libro y lo compré. Luego le di el libro. Se puso muy contento. Nima también me dio un bolso.
    note: Lee una vez para entender lo que pasó y otra vez para encontrar a qué se refiere cada ش.
  fa.a2.unit46.lesson06.teach.turn01:
    title: Sara pregunta por el libro
    gloss: 'Sara: Nima, ¿leíste el libro?'
    note: El sustantivo *کتاب* se menciona una sola vez, con *رو*.
  fa.a2.unit46.lesson06.teach.turn02:
    title: Nima responde
    gloss: 'Nima: Sí, lo leí. Estuvo muy bien.'
    note: '*خوندمش* se refiere al libro.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: Sara pregunta por el regalo
    gloss: 'Sara: ¿Compraste el regalo para Mina?'
    note: '*مینا* es un nombre; el regalo se menciona una sola vez.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: Nima responde
    gloss: 'Nima: Sí, lo compré y ayer se lo di.'
    note: '*خریدمش* se refiere al regalo y *بهش* se refiere a Mina.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: Sara pregunta por Mina
    gloss: 'Sara: ¿Se puso contenta?'
    note: El sujeto se entiende por la conversación.
  fa.a2.unit46.lesson06.teach.turn06:
    title: Nima responde
    gloss: 'Nima: Sí, se puso muy contenta.'
    note: Una respuesta breve y natural.
