teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Me gusta
    gloss: me gusta
    note: دوست دارم significa literalmente «tengo amistad (con ello)»; es la forma habitual de decir «me gusta».
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Café
    gloss: café
    note: قهوه significa «café».
    example_gloss: Me gusta el café.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Té
    gloss: té
    note: چای significa «té».
    example_gloss: No me gusta el té.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: No me gusta
    gloss: no me gusta
    note: دوست ندارم es la forma negativa de دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: yo
    gloss: yo
    note: من significa «yo». A menudo es opcional porque la terminación del verbo ya indica el sujeto, pero se puede añadir para dar énfasis.
    example_gloss: Me gusta la música.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Cuál
    gloss: cuál
    note: کدوم significa «cuál».
    example_gloss: ¿Cuál te gusta?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: La música
    gloss: música
    note: موسیقی significa «música».
    example_gloss: Me gusta la música.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Tú quieres
    gloss: quieres
    note: می‌خوای es la forma coloquial e informal de la segunda persona de می‌خواهی (quieres).
    target_text: می‌خوای (quieres, informal)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: ¿Cuál te gusta?
    gloss: ¿Cuál te gusta?
    note: کدوم رو دوست داری؟ -- رو marca el complemento directo (en registro formal, را) y داری es la segunda persona de داشتن (tener).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Más
    gloss: más
    note: بیشتر significa «más».
    example_gloss: Me gusta más el café.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: O
    gloss: o
    note: یا significa «o» y sirve para ofrecer una elección entre dos cosas.
    target_text: یا (o)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: ¿Café o té?
    gloss: ¿Café o té?
    note: قهوه یا چای؟ ofrece elegir entre las dos bebidas presentadas en la lección 1.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Porque
    gloss: porque
    note: 'چون introduce una razón: «porque».'
    target_text: چون (porque)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: Es delicioso
    gloss: es delicioso
    note: خوشمزه‌ست es la contracción coloquial de خوشمزه است (es delicioso).
    example_gloss: El café está delicioso.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: Es interesante
    gloss: es interesante
    note: جالبه es la contracción coloquial de جالب است (es interesante).
    example_gloss: Esta música es interesante.
  fa.a1.unit14.lesson04.teach.va_word:
    title: Y
    gloss: y
    note: '*و* significa «y» y puede unir dos enunciados cortos, por ejemplo, que algo te gusta y cómo lo describes. Es más laxo que *چون* (porque), que da la razón directamente.'
    target_text: و (y)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Un nombre femenino iraní muy común.
    example_gloss: A Sara le gusta el té.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Le gusta
    gloss: le gusta
    note: داره es la forma coloquial de la tercera persona de دارد (tiene). دوست داره significa «le gusta», igual que el patrón دوست دارم en primera persona.
    target_text: دوست داره (le gusta, tercera persona coloquial)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: No le gusta
    gloss: no le gusta
    note: 'نداره es la forma negativa coloquial de la tercera persona: دوست نداره significa «no le gusta».'
    target_text: دوست نداره (no le gusta, tercera persona coloquial)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: Está caliente
    gloss: está caliente
    note: گرمه es la contracción coloquial de گرم است (está caliente).
    example_gloss: El té está caliente.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Texto de ejemplo sobre preferencias
    gloss: A Sara le gusta el té porque está caliente. A Sara no le gusta la música.
    note: Un breve relato en tercera persona que combina el vocabulario de preferencias de esta unidad.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima y Sara
    gloss: Nima, Sara
    note: Nombres iraníes comunes que se usan a lo largo de este curso.
    example_gloss:
    - A Nima le gusta el té.
    - A Sara le gusta el café.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: ¿Y tú?
    gloss: ¿Y tú?
    note: تو چی؟ es una forma corta y común de devolver la pregunta a la otra persona.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Es genial
    gloss: es genial
    note: عالیه es la contracción coloquial de عالی است (es genial).
    example_gloss: Esto es genial.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima pregunta
    gloss: ¿Té o café? ¿Cuál le gusta más?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara responde
    gloss: Me gusta más el café porque es delicioso. ¿Y usted?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima responde
    gloss: Me gusta el té porque está caliente.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reacciona
    gloss: ¡Genial!
