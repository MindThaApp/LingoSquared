course:
  title: Persa A1
  description: 'Persa iraní para principiantes: nombrar aparatos de uso cotidiano (teléfono, ordenador, internet, aplicación), acciones con el teléfono (enviar un mensaje, llamar, hacer una foto, descargar una aplicación), preguntar y responder cuántas veces usas el teléfono (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), una lectura sobre los hábitos de *نیما* y *سارا* con sus dispositivos, y un diálogo final entre *نیما* y *سارا* sobre cómo usa cada uno la tecnología.'
