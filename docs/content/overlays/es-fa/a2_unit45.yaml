teaching:
  fa.a2.unit45.lesson01.teach.time:
    title: Hoy y el grado
    gloss: hoy, muy, un poco
    note: امروز dice cuándo; *خیلی* y *یکم* dicen cuánto.
    example_gloss:
    - Hoy estoy muy contento/a.
    - Hoy estoy un poco cansada.
  fa.a2.unit45.lesson01.teach.feel:
    title: Sentimientos
    gloss: estoy contento/a, estoy disgustado/a, estoy cansado/a, estoy enfadado/a, estoy preocupado/a
    note: 'La terminación hablada *-م* significa «yo estoy»: *خسته‌م* es «estoy cansado/a».'
    example_gloss:
    - Hoy estoy contento/a.
    - Hoy estoy disgustado/a.
    - Hoy estoy cansado/a.
    - Hoy estoy enfadado/a.
    - Hoy estoy preocupado/a.
  fa.a2.unit45.lesson01.teach.hal:
    title: Cómo te sientes
    gloss: mi estado, tu estado, está bien, está mal, cómo está
    note: '*حال* es el estado en que estás, así que *حالم* es «cómo me siento» y *حالت* es «cómo te sientes». *حالم خوبه* significa «me siento bien»; *حالم بده* significa «me siento mal».'
    example_gloss:
    - Me siento bien.
    - Me siento mal.
    - ¿Cómo te sientes?
  fa.a2.unit45.lesson01.teach.shape:
    title: Dos formas de decir cómo estás
    gloss: estoy cansado/a; me siento mal; ¿cómo te sientes?
    note: 'O añades *-م* a la palabra del sentimiento (*خسته‌م*, *نگرانم*), o dices *حالم* más *خوبه* o *بده*. Para preguntar, cambia la terminación: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: Cuidado y de
    gloss: cuidado, de
    note: '*مراقبت می‌کنم* significa «cuido». La persona a quien cuidas va después de *از*.'
    example_gloss:
    - Cuido a mi amigo.
  fa.a2.unit45.lesson02.teach.verbs:
    title: Presente de کردن
    gloss: yo hago, tú haces, él / ella hace, nosotros hacemos, ustedes hacen, ellos hacen
    note: 'Estas son las terminaciones del presente hablado: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - Cuido.
    - Cuidas.
    - Él / ella cuida.
    - Cuidamos.
    - Ustedes cuidan.
    - Ellos cuidan.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: Yo mismo/a, tú mismo/a, él mismo / ella misma
    gloss: yo mismo/a, tú mismo/a, él mismo / ella misma
    note: '*خود* significa «uno mismo». Toma las mismas terminaciones que otros sustantivos: *-م* (mi), *-ت* (tu), *-ش* (su).'
    example_gloss:
    - Me cuido a mí mismo/a.
    - Te cuidas a ti mismo/a.
    - Él / ella se cuida a sí mismo/a.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: Nosotros mismos, ustedes mismos, ellos mismos
    gloss: nosotros mismos, ustedes mismos (o usted mismo, formal), ellos mismos
    note: En el habla, las terminaciones del plural son *-مون, -تون, -شون*. *خودتون* también es la forma de cortesía para una sola persona.
    example_gloss:
    - Nos cuidamos a nosotros mismos.
    - Ustedes se cuidan a sí mismos.
    - Ellos se cuidan a sí mismos.
  fa.a2.unit45.lesson02.teach.careful:
    title: Cuídate
    gloss: atento/a, sé (a un amigo), sean (a varias personas, o de cortesía)
    note: '*مواظب خودت باش* es lo que le dices a un amigo que se va o que está enfermo. Para varias personas, o por cortesía, di *مواظب خودتون باشین*.'
    example_gloss:
    - Cuídate.
    - Cuídense.
  fa.a2.unit45.lesson02.teach.agree:
    title: خود concuerda con el sujeto
    gloss: me cuido a mí mismo/a; te cuidas a ti mismo/a
    note: 'La terminación de *خود* concuerda con el sujeto, y el verbo también: *من* va con *خودم* y *می‌کنم*; *تو* va con *خودت* y *می‌کنی*; *ما* va con *خودمون* y *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: Cuándo lo haces
    gloss: por las mañanas, por las noches, todos los días
    note: La terminación *-ها* en *صبح* y *شب* da «por las mañanas» y «por las noches» como hábitos.
    example_gloss:
    - Por las mañanas me ducho.
    - Por las noches me cepillo los dientes.
    - Todos los días hago ejercicio.
  fa.a2.unit45.lesson03.teach.body:
    title: Lavarse y limpiarse
    gloss: ducha, cepillado de dientes, mis manos, mi cara
    note: '*دوش* es una ducha y *مسواک* es un cepillo de dientes; *دست‌هام* es «mis manos» y *صورتم* es «mi cara».'
    example_gloss:
    - Me ducho.
    - Me cepillo los dientes.
    - Me lavo las manos.
    - Me lavo la cara.
  fa.a2.unit45.lesson03.teach.verbs:
    title: Verbos de cuidado
    gloss: tomo, me cepillo, lavo
    note: 'El farsi usa un verbo distinto para cada acción: *دوش می‌گیرم* (me ducho), *مسواک می‌زنم* (me cepillo los dientes), *می‌شورم* (lavo).'
    example_gloss:
    - Me ducho.
    - Me cepillo los dientes.
    - Me lavo la cara.
  fa.a2.unit45.lesson03.teach.rest:
    title: Ejercicio y descanso
    gloss: ejercicio, descanso, duermo, temprano
    note: '*ورزش* y *استراحت* se combinan con *می‌کنم*: *ورزش می‌کنم* y *استراحت می‌کنم*.'
    example_gloss:
    - Hago deporte todos los días.
    - Descanso un poco.
    - Me acuesto temprano.
  fa.a2.unit45.lesson03.teach.light:
    title: Sustantivo más verbo
    gloss: me ducho; me cepillo los dientes; hago ejercicio; descanso
    note: La mayoría de las acciones de cuidado personal se forman con un sustantivo más un verbo. El sustantivo no cambia; solo el verbo cambia según la persona. Cada sustantivo va con un verbo fijo, así que apréndelos como parejas.
  fa.a2.unit45.lesson03.teach.ask:
    title: Preguntar cómo
    gloss: ¿Cómo te cuidas?
    note: '*چطور* significa «cómo».'
  fa.a2.unit45.lesson03.teach.phrase:
    title: Cuidarse
    gloss: Me cuido (mi aspecto y mi bienestar)
    note: '*به خودم می‌رسم* es una expresión fija y cotidiana para dedicarte tiempo a cuidarte. Apréndela como un bloque.'
  fa.a2.unit45.lesson04.teach.state:
    title: Prepararse, cansarse
    gloss: listo, cansado, (marca de objeto), hice
    note: '*آماده کردم* es literalmente «dejé listo» y *خسته کردم* «dejé cansado»; con *خودم رو* pasan a ser «me preparé» y «me agoté». *رو* marca lo que recibe la acción.'
    example_gloss:
    - Me preparé.
    - Me agoté.
  fa.a2.unit45.lesson04.teach.time:
    title: Esta semana
    gloss: esta, semana
    note: '*این هفته* significa «esta semana».'
    example_gloss:
    - Esta semana me agoté.
  fa.a2.unit45.lesson04.teach.make:
    title: Preparar la cena
    gloss: cena, preparar, preparaste
    note: '*درست کردم* significa «preparé»: *شام درست کردم* es «preparé la cena».'
    example_gloss:
    - Preparé la cena yo mismo.
    - ¿Lo preparaste tú mismo?
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود como complemento directo
    gloss: me preparé; me agoté
    note: 'Cuando la acción recae sobre uno mismo, *خود* con su terminación lleva *رو* y va antes del verbo: *خودم رو آماده کردم*. En el habla rápida, *خودم رو* suele decirse *خودمو*.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود para enfatizar
    gloss: preparé la cena yo mismo; ¿lo preparaste tú mismo?
    note: '*خود* antes del verbo, sin *رو*, destaca que lo hiciste tú y no otra persona. La oración se construye exactamente igual que sin *خودم*.'
  fa.a2.unit45.lesson05.teach.words:
    title: Palabras para el texto
    gloss: trabajo, tuve, estuve, estaba, mal, viernes, primero, después, un/una, hora, ahora, y
    note: '*بودم* es «estuve/era» y *بود* es «estaba/fue»; *داشتم* es «tuve/tenía».'
    example_gloss:
    - Esta semana tuve trabajo.
    - Estaba cansado y me sentía mal.
    - El viernes, primero me duché.
    - Después descansé una hora.
    - Ahora estoy contento.
  fa.a2.unit45.lesson05.teach.reading:
    title: Una semana y un viernes
    gloss: Esta semana tuve mucho trabajo. Estaba cansado y me sentía mal. El viernes me cuidé. Primero me duché. Después descansé una hora. Ahora estoy contento y me siento bien.
    note: Lee una vez para captar los sentimientos y otra vez para ver qué hizo el hablante para sentirse mejor.
  fa.a2.unit45.lesson06.teach.turn01:
    title: Sara pregunta cómo se siente Nima
    gloss: 'Sara: Nima, ¿cómo te sientes?'
    note: '*حالت چطوره؟* pregunta cómo te sientes.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: Nima dice que está cansado
    gloss: 'Nima: Estoy muy cansado. Esta semana me agoté.'
    note: '*خودم رو خسته کردم* muestra el patrón reflexivo.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: Sara da un consejo
    gloss: 'Sara: Tienes que cuidarte.'
    note: '*باید* más *کنی* indica lo que alguien debe hacer.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: Nima describe su rutina
    gloss: 'Nima: Sí. Por las mañanas me ducho, pero no hago ejercicio.'
    note: '*ولی* significa «pero»; *نمی‌کنم* es la forma negativa de *می‌کنم*.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: Sara le dice que se cuide
    gloss: 'Sara: ¡Cuídate! Descansa un poco.'
    note: '*استراحت کن* es el imperativo amistoso: se quita *می‌* y la terminación.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: Nima acepta
    gloss: 'Nima: Vale. Esta noche me acuesto temprano.'
    note: '*باشه* significa «vale».'
