teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: Personas
    gloss: yo, Sara, Nima
    note: Sara y Nima son amigos que hablan de sus hábitos. *من* normalmente se omite porque la terminación del verbo ya indica «yo».
    example_gloss:
    - Vi a Nima.
    - Sara y Nima son amigos.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: Palabras de deporte y aficiones
    gloss: correr, nadar, hacer ejercicio, leer libros, gimnasio, parque
    note: 'Las actividades se nombran con un sustantivo verbal terminado en *-ن*: *دویدن* (correr), *خوندن* (leer). Los compuestos usan *کردن*: *شنا کردن*, *ورزش کردن*.'
    example_gloss:
    - Empecé a correr en el parque.
    - Hago ejercicio en el gimnasio.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: Palabras de pantallas y comida
    gloss: móvil, televisión, refresco, dulces, agua, hora
    note: '*نگاه کردن* es el verbo hablado habitual para ver la tele: *تلویزیون نگاه کردن*. El plural *شب‌ها* significa «por las noches» como hábito.'
    example_gloss:
    - Por la noche veo la tele durante una hora.
    - Uso el móvil durante una hora.
  fa.a2.unit33.lesson01.teach.time_words:
    title: Palabras de tiempo y hábito
    gloss: cada día, mes, semana, hace (tiempo), desde, ya no, temprano, tarde, menos
    note: '*از ماه پیش* significa «desde hace un mes»; *پیش* después de una palabra de tiempo significa «hace». *دیگه* con un verbo negativo significa «ya no».'
    example_gloss:
    - Desde hace un mes corro cada día.
    - Desde la semana pasada me acuesto temprano por la noche.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'Empezar: شروع کردم به + sustantivo verbal'
    gloss: Empecé a correr; empecé a nadar
    note: 'Para decir que empezaste un hábito, usa *شروع کردم به* seguido del sustantivo verbal (la forma en *-ن*): *شروع کردم به دویدن*. No conjugues el segundo verbo.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'Dejar: دیگه ... نمی‌کنم y ترک کردم'
    gloss: Ya no bebo refrescos; dejé los dulces
    note: 'Dos formas naturales de dejar algo: *دیگه* más un verbo en presente negativo (*دیگه نمی‌دوم* = ya no corro), o *X رو ترک کردم* (dejé X) con la marca de objeto definido *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: Verbos en la forma de «deseo»
    gloss: que yo duerma, me despierte, corra, coma/beba, llame, vaya, haga
    note: 'Estas terminaciones (*-م*) siguen a *سعی* y *یادم رفت*. Los compuestos mantienen el sustantivo y cambian el verbo ligero: *ورزش کنم*, *زنگ بزنم*, *بیدار شم*.'
    example_gloss:
    - Quiero correr todos los días.
    - Tengo que despertarme temprano.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: Intentar y olvidar
    gloss: intentar, olvidé, que, ayer, hoy
    note: '*یادم رفت* se forma con *یاد* (memoria) + *م* + *رفت*: «se me fue de la memoria». La misma estructura sirve para cualquier persona: *یادش رفت*, *یادت رفت*.'
    example_gloss:
    - Ayer olvidé beber agua.
    - Hoy intento acostarme temprano.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'Intentar: سعی می‌کنم / سعی کردم + subjuntivo'
    gloss: Intento dormir temprano; intenté despertarme temprano
    note: '*سعی می‌کنم* es «intento / estoy intentando» y *سعی کردم* es «intenté». El segundo verbo va siempre en la forma con *ب-* y con la misma terminación de persona, sin *به*: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'Olvidar: یادم رفت (که) + subjuntivo'
    gloss: Olvidé llamar; olvidé beber agua
    note: '*یادم رفت* más la forma con *ب-* significa «olvidé hacerlo». La palabra *که* es opcional al hablar: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: Cómo se forma la forma de «deseo»
    gloss: ب + raíz + terminación personal
    note: 'La mayoría de los verbos añaden *ب-* delante de la raíz: *بدوم*, *بخورم*, *بخوابم*. Los verbos compuestos lo ponen en el verbo ligero (*زنگ بزنم*) o usan *کنم* y *شم*. Al hablar, *بیدار بشم* suele acortarse a *بیدار شم*.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: Cuatro estructuras, cuatro significados
    gloss: empecé a correr / intenté correr / olvidé correr / ya no corro
    note: 'La misma actividad cambia de significado según la estructura: *شروع کردم به دویدن* (empecé), *سعی کردم بدوم* (intenté), *یادم رفت بدوم* (olvidé), *دیگه نمی‌دوم* (ya no).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: ¿Sustantivo verbal o forma de «deseo»?
    gloss: به + sustantivo verbal vs. forma con ب-
    note: 'Después de *شروع کردم به* va el sustantivo verbal (*شنا کردن*). Después de *سعی کردم* y *یادم رفت* va la forma personal en *-م* (*شنا کنم*). No las mezcles: *سعی کردم به شنا کردن* es incorrecto.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + negativo significa «ya no»
    gloss: Ya no veo la tele por las noches
    note: '*دیگه* antes de un verbo negativo indica que algo solía ocurrir y ha dejado de ocurrir. Sin *دیگه*, *نوشابه نمی‌خورم* es un hecho general («no bebo refrescos»), no un cambio.'
  fa.a2.unit33.lesson04.teach.questions:
    title: Preguntas sobre hábitos
    gloss: ¿Desde cuándo empezaste? ¿Qué dejaste?
    note: 'La pregunta termina en la forma de «tú» en *-ی*: *شروع کردی* = empezaste, *ترک کردی* = dejaste. Responde con la forma en *-م*.'
    example_gloss:
    - ¿Desde cuándo empezaste?
    - ¿Qué dejaste?
  fa.a2.unit33.lesson04.teach.answer_since:
    title: Responder con el momento de inicio
    gloss: desde hace un mes empecé a correr
    note: 'Pon primero el tiempo: *از ماه پیش شروع کردم به دویدن*. Para algo que dejaste, pon primero el objeto y usa *رو*: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: Palabras de enlace
    gloss: pero, también, apagado
    note: '*هم* después de un sustantivo o una frase verbal significa «también». *خاموش کردن* es «apagar» y lleva *رو* con un objeto definido.'
    example_gloss:
    - Apagué el móvil.
    - Lo intenté, pero se me olvidó.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: Un texto sobre hábitos que cambian
    gloss: ''
    note: Lee una vez para ver los dos cambios (un hábito empezado y dos dejados) y otra vez para ver lo que intenta el hablante y lo que olvidó.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: Palabras de conversación
    gloss: cómo va, está bien, bien hecho, perdona, entonces, por qué, no, bebes, no llamaste
    note: '*آفرین* felicita a un amigo («bien hecho»). *ببخش* es el «perdona» informal; usa *ببخشید* con desconocidos.'
    example_gloss:
    - ¿Cómo va el ejercicio? ¡Bien!
    - Entonces, ¿por qué no llamaste?
  fa.a2.unit33.lesson06.teach.turn01:
    title: Sara pregunta por el ejercicio
    gloss: 'Sara le pregunta a Nima: ¿Cómo va el ejercicio?'
    note: La pregunta abre la conversación sobre sus nuevos hábitos.
  fa.a2.unit33.lesson06.teach.turn02:
    title: Nima dice lo que empezó
    gloss: 'Nima: ¡Bien! Hace un mes empecé a correr.'
    note: '*شروع کردم به* más el sustantivo verbal *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: Sara felicita y pregunta
    gloss: 'Sara: ¡Bien hecho! ¿Y bebes refrescos?'
    note: '*هم* significa «también».'
  fa.a2.unit33.lesson06.teach.turn04:
    title: Nima dejó los refrescos
    gloss: 'Nima: No, dejé los refrescos. También intento usar menos el móvil.'
    note: Un hábito dejado (*ترک کردم*) y un esfuerzo (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: Sara pregunta por qué no llamó
    gloss: 'Sara: Entonces, ¿por qué no llamaste ayer?'
    note: La pregunta usa la forma de «tú» en *-ی*.
  fa.a2.unit33.lesson06.teach.turn06:
    title: Nima admite que se le olvidó
    gloss: 'Nima: Perdona, olvidé llamar.'
    note: '*یادم رفت* más la forma con *ب-*.'
