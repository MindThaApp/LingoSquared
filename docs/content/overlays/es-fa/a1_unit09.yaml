teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Hora / reloj
    gloss: hora / reloj
    note: ساعت significa tanto «hora» como «reloj» y es la palabra base para decir la hora.
    example_gloss: ¿Qué hora es?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minuto
    gloss: minuto
    note: دقیقه es la palabra para «minuto».
    example_gloss: Espera cinco minutos.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Mitad
    gloss: mitad / media
    note: نیم significa «media» y se usa para la media hora.
    example_gloss: Son las siete y media.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Cuarto
    gloss: cuarto
    note: ربع significa «cuarto» y se usa para el cuarto de hora.
    example_gloss: Son las ocho menos cuarto.
  fa.a1.unit09.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra de enlace más común y se usa en toda esta unidad.
    target_text: و (y)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Pregunta qué hora es
    gloss: ¿Qué hora es?
    note: ساعت چنده؟ es la forma coloquial habitual de preguntar la hora.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: La contracción coloquial en -e (repaso)
    gloss: چنده es la contracción hablada habitual de چند است.
    note: Es la misma contracción que ya has visto en palabras del tiempo atmosférico y de compras como آفتابیه y تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Di que son las tres y media
    gloss: Son las tres y media.
    note: ساعت سه و نیمه combina la hora, و (y) y la forma contraída نیمه (media).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: La contracción coloquial en -e, aplicada a نیم
    gloss: نیمه es la contracción hablada habitual de نیم است.
    note: Es el mismo patrón que چنده, aplicado a نیم en lugar de چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Mañana (por la mañana)
    gloss: mañana (parte del día)
    note: صبح es la parte del día que corresponde a la mañana.
    example_gloss: Me despierto temprano por la mañana.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Mediodía
    gloss: mediodía
    note: ظهر es el mediodía.
    example_gloss: Almuerzo al mediodía.
  fa.a1.unit09.lesson04.teach.asr:
    title: La tarde
    gloss: tarde
    note: عصر es la parte del día que corresponde a la tarde y el principio de la noche.
    example_gloss: Trabajo por la tarde.
  fa.a1.unit09.lesson04.teach.shab:
    title: Noche
    gloss: noche
    note: شب es la noche.
    example_gloss: Me acuesto temprano por la noche.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Cita
    gloss: cita
    note: قرار es la palabra general para una cita o un encuentro acordado.
    example_gloss: Tengo una cita.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Preguntar a qué hora es una cita
    gloss: ¿A qué hora es la cita?
    note: قرار ساعت چنده؟ aplica a una cita concreta la pregunta sobre la hora de la lección 2.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Decir una hora con la parte del día
    gloss: las cuatro de la tarde
    note: ساعت چهار عصر une la hora con عصر para distinguir la mañana de la tarde.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Mañana (repaso)
    gloss: mañana
    note: فردا se presentó en una unidad anterior; aquí se usa para plantear la cita.
    example_gloss: Mañana tengo una cita.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Decir que llegarás un poco tarde
    gloss: Voy a llegar un poco tarde.
    note: '*یکم دیر می‌شه* usa el coloquial *یکم* (un poco) y *دیر* (tarde).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar pregunta a qué hora es la cita de mañana
    gloss: Negar pregunta a qué hora es la cita de mañana.
    note: قرار فردا ساعت چنده؟ combina la pregunta sobre la cita de la lección 5 con فردا (mañana).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash responde sin estar seguro
    gloss: Arash dice que cree que son las cuatro.
    note: فکر کنم (creo que) suaviza la respuesta, porque él no está del todo seguro.
  fa.a1.unit09.lesson06.teach.turn03:
    title: Negar pregunta si es por la mañana o por la tarde
    gloss: Negar pregunta si las cuatro son de la tarde o de la mañana.
    note: Esto aclara una posible ambigüedad, ya que ساعت چهار por sí solo no indica de qué cuatro se trata.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash lo aclara
    gloss: Arash dice que de la tarde.
    note: Una respuesta de una sola palabra es natural cuando la pregunta ya ha fijado el contexto.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar acepta y ajusta su hora de llegada
    gloss: Negar acepta y dice que llegará a las cuatro y cuarto.
    note: ساعت چهار و ربع une la hora con ربع (cuarto).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash pregunta por qué el cuarto de hora extra
    gloss: Arash pregunta por qué dice «y cuarto».
    note: '*چرا ربع؟* es una forma breve de preguntar «¿Por qué el cuarto?»'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar explica que llegará un poco tarde
    gloss: Negar explica que saldrá un poco tarde del trabajo.
    note: '*چون* (porque) introduce el motivo, con *یکم دیر می‌شه* (llegaré un poco tarde), que acabas de aprender en esta lección.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash la tranquiliza
    gloss: Arash dice que vale, que no hay problema.
    note: 'مشکلی نیست (no hay problema) tranquiliza a Negar: el pequeño retraso no importa.'
