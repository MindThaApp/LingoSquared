course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: describir la estatura de una persona (alto/bajo), el pelo (largo y color: negro, rubio), el color de ojos (marrón, verde, azul) y si lleva gafas, preguntar «¿Cómo es él/ella?», un texto breve sobre el aspecto del propio نیما y un diálogo final entre نیما y سارا para reconocer a مریم, amiga de سارا.'
