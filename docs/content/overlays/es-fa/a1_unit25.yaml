teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Él / ella
    gloss: él / ella
    note: '*او* vuelve a aparecer aquí como sujeto de las descripciones físicas.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Estatura
    gloss: estatura
    note: '*قد* vuelve a aparecer aquí solo. *قدش* añade el sufijo posesivo *-ش* (su estatura), el mismo patrón que *امتحانش* de la Unidad 20.'
    example_gloss: Nima es alto.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Alto
    gloss: alto
    note: '*بلند* significa «alto» (o «largo»). *قدش بلنده* significa literalmente «su estatura es alta»: la forma coloquial natural de decir que alguien es alto.'
    example_gloss: Su estatura es alta.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Bajo
    gloss: bajo
    note: '*کوتاه* significa «bajo» (de estatura) o «corto».'
    example_gloss: Su estatura es baja.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: El pelo
    gloss: pelo
    note: '*مو* significa «pelo». *موی* es la forma con ezafe (de enlace) que se usa ante un adjetivo, como en *موی بلند* (pelo largo).'
    example_gloss: Tiene el pelo largo.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Su pelo
    gloss: su pelo
    note: '*موهاش* combina el plural *موها* (pelos) con el sufijo posesivo *-ش*: «su pelo».'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Negro
    gloss: negro
    note: '*مشکی* es la palabra coloquial habitual para el pelo o los ojos negros; aquí es más natural que *سیاه* de la Unidad 20, que va mejor con la ropa que con el pelo.'
    example_gloss: Su pelo es negro.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Rubio
    gloss: rubio
    note: '*بلوند* (un préstamo) significa «rubio».'
    example_gloss: Su pelo es rubio.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Ojo
    gloss: ojo
    note: '*چشم* significa «ojo». *چشمای* es la forma coloquial del plural con ezafe (ojos de...), como en *چشمای آبی* (ojos azules).'
    example_gloss: Tiene los ojos marrones.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Sus ojos
    gloss: sus ojos
    note: '*چشماش* combina el plural coloquial *چشما* con el sufijo posesivo *-ش*: «sus ojos». Fíjate en que *چشماش آبیه* usa la terminación singular *-ه* aunque *چشما* sea plural: es normal en persa, donde las cosas plurales que no son personas suelen llevar el verbo en singular.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Marrón
    gloss: marrón
    note: '*قهوه‌ای* (literalmente «color café») significa «marrón».'
    example_gloss: Sus ojos son marrones.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Verde
    gloss: verde
    note: '*سبز* significa «verde».'
    example_gloss: Sus ojos son verdes.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Azul
    gloss: azul
    note: '*آبی* vuelve a aparecer aquí para el color de ojos.'
    example_gloss: Sus ojos son azules.
  fa.a1.unit25.lesson04.teach.man_review:
    title: yo
    gloss: yo
    note: '*من*, ya bien conocido, vuelve a aparecer aquí para describirse a uno mismo.'
    example_gloss: Tengo el pelo marrón.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Tengo / tiene
    gloss: tengo / tiene
    note: '*دارم*/*داره* funcionan igual con un rasgo físico: *موی مشکی دارم* significa «Tengo el pelo negro».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Gafas
    gloss: gafas
    note: '*عینک* significa «gafas».'
    example_gloss: Él usa gafas.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Usa (gafas)
    gloss: usa (gafas)
    note: '*می‌زنه* (literalmente «golpea») es el verbo natural para llevar gafas: *عینک می‌زنه* significa «lleva gafas», un verbo distinto de *می‌کنم* (hago) de las Unidades 8 y 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: ¿Cómo es él/ella físicamente?
    gloss: ¿cómo es él/ella?
    note: '*چه شکلیه؟* significa literalmente «¿qué forma tiene?»: la manera coloquial estándar de preguntar cómo es alguien.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: Y
    gloss: y
    note: '*و* significa «y», y ya se usó así en las Unidades 14 y 24.'
    example_gloss: Es alto y tiene el pelo negro.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, presentado como personaje en la Unidad 11, vuelve a aparecer aquí.'
    example_gloss: Nima es amigo de Sara.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lectura: el aspecto de Nima'
    gloss: Nima es alto. Tiene el pelo negro y los ojos marrones. Usa gafas.
    note: 'Esta lectura reutiliza todas las construcciones de las lecciones 1 a 4: casi no hay vocabulario nuevo, solo practicas reconocerlo en un texto continuo.'
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* es un personaje nuevo: una amiga de سارا a quien نیما aún no conoce.'
    example_gloss: Maryam es amiga de Sara.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Ahora
    gloss: ahora
    note: '*الان* vuelve a aparecer aquí.'
    example_gloss: Maryam viene ahora.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Viene
    gloss: viene
    note: '*میاد* es la forma coloquial del presente de *آمدن* (venir).'
    example_gloss: Maryam viene ahora.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: ¿De qué color es?
    gloss: ¿de qué color es?
    note: '*چه رنگیه؟* combina *چه* (qué, de la lección 4) con *رنگی* (de color, de *رنگ* + *-ی*) + *-ه* (es): «¿de qué color es?».'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Vale, gracias
    gloss: vale, gracias
    note: '*باشه* y *ممنون*, vistos antes, se combinan aquí como una frase de cierre natural.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam viene ahora.'
    gloss: Maryam viene ahora.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: ¿Cómo es Maryam?'
    gloss: ¿Cómo es Maryam?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: Es alta y tiene el pelo negro.'
    gloss: Es alta y tiene el pelo negro.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: ¿De qué color son sus ojos?'
    gloss: ¿De qué color son sus ojos?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Sus ojos son marrones.'
    gloss: Sus ojos son marrones.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Vale, gracias.'
    gloss: Vale, gracias.
