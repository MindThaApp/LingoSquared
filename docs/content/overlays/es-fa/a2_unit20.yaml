teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: Vacaciones, verano
    gloss: vacaciones, verano
    note: En el habla, *تابستون* es la forma habitual de *تابستان* (verano). *تعطیلات* parece plural, pero es la palabra normal para «vacaciones».
    example_gloss:
    - En verano tengo vacaciones.
    - Las vacaciones son geniales.
  fa.a2.unit20.lesson01.teach.when:
    title: La semana que viene, el año que viene, agosto
    gloss: la semana que viene, el año que viene, agosto (Mordad)
    note: '*بعد* después de una palabra de tiempo significa «que viene»: *هفته‌ی بعد*, *سال بعد*. *مرداد* es el mes iraní que cae sobre todo en agosto.'
    example_gloss:
    - La semana que viene tengo una cita.
    - El año que viene voy a Isfahán.
    - En Mordad tengo vacaciones.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: Viajar, reservar
    gloss: viajar, reservar
    note: 'Ambos son sustantivo + *کردن*: *سفر* (un viaje) + *کردن* = viajar; *رزرو* (una reserva) + *کردن* = reservar. En presente el *می‌* va en *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*.'
    example_gloss:
    - La semana que viene viajo.
    - Estoy reservando un hotel.
  fa.a2.unit20.lesson01.teach.north:
    title: El norte, hotel
    gloss: el norte (la costa del Caspio), hotel
    note: '*شمال* (norte) es también como los iraníes llaman a la costa del Caspio, la región clásica de vacaciones de verano: *می‌رم شمال* = «voy al norte (de vacaciones)».'
    example_gloss:
    - En verano voy al norte.
    - En el norte reservo un hotel.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: Con, mi hermana, mi mamá, mi hermano
    gloss: con, mi hermana, mi mamá, mi hermano
    note: 'La terminación *-م* significa «mi»: *خواهر* (hermana) pasa a *خواهرم*, *مامان* a *مامانم* y *برادر* a *برادرم*.'
    example_gloss:
    - Voy al norte con mi hermana.
    - Me quedo en casa de mi mamá.
    - Viajo con mi hermano.
  fa.a2.unit20.lesson01.teach.question:
    title: ¿Qué haces en verano?
    gloss: ¿Qué haces en verano?
    note: 'La misma pregunta que significa «¿qué haces?» también significa «¿qué vas a hacer?»: la palabra de tiempo (*تابستون*) indica que se trata del futuro.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: Los planes cercanos usan el presente
    gloss: En Mordad voy al norte, reservo un hotel.
    note: 'El persa no tiene un tiempo futuro de uso cotidiano. Para planes fijos o cercanos se usa el presente con *می‌* más una palabra de tiempo: *مرداد می‌رم شمال* es literalmente «en Mordad voy al norte» y significa «en Mordad me voy al norte». La palabra de tiempo indica a quien escucha que se trata del futuro.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: Curso, dinero
    gloss: curso, dinero
    note: '*دوره* es un curso o una serie de clases: *یه دوره‌ی زبان* (un curso de idioma). *دوره‌ی* con *-ی* lo une al sustantivo que viene después.'
    example_gloss:
    - Tengo un curso de idioma.
    - No tengo nada de dinero.
  fa.a2.unit20.lesson02.teach.later:
    title: Más tarde, dentro de un mes
    gloss: más tarde, dentro de un mes
    note: '*یه ماه دیگه* es literalmente «un mes más» y significa «dentro de un mes». *بعدا* es un «más tarde» general.'
    example_gloss:
    - Más tarde voy al norte.
    - Dentro de un mes viajo.
  fa.a2.unit20.lesson02.teach.want_course:
    title: Quiero hacer un curso.
    gloss: Quiero hacer un curso. / Pienso hacer un curso.
    note: '*می‌خوام* (quiero) más un segundo verbo en su forma corta con *be-*: *بگیرم* (de *گرفتن*, tomar / conseguir). Ambos verbos llevan la terminación *-م*: *می‌خوام بگیرم*. El mismo patrón con *رفتن* (ir) da *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: Quiero mudarme de casa.
    gloss: Quiero mudarme de casa. / Pienso mudarme de casa.
    note: '*خونه عوض کردن* significa mudarse de casa. En el patrón con *می‌خوام* el verbo pasa a *کنم*: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: Quiero ahorrar dinero.
    gloss: Quiero ahorrar dinero. / Pienso ahorrar dinero.
    note: '*پول جمع کردن* significa ahorrar dinero (literalmente «juntar dinero»). Mismo patrón: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: Tengo la intención de hacer un curso.
    gloss: Tengo la intención de hacer un curso.
    note: '*قصد دارم* (tengo la intención) es algo más formal que *می‌خوام*, pero va seguido del mismo verbo corto: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + un verbo corto
    gloss: quiero ir, quiero hacer (un curso), quiero ahorrar
    note: 'Para planes más lejanos o deseos, usa *می‌خوام* + un segundo verbo en la forma corta con *be-*: *برم* (ir), *بگیرم* (tomar), *بخرم* (comprar) y *کنم* (hacer, como en *پول جمع کنم*). Ambos verbos llevan la misma terminación (*-م* para «yo»): *می‌خوام برم*. Para planes cercanos y fijos se usa el presente simple: *فردا می‌رم*, pero *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: Quizá, seguro
    gloss: quizá, seguro
    note: '*شاید* y *حتما* van al comienzo de la oración e indican lo seguro que estás.'
    example_gloss:
    - Quizá vaya al cine.
    - Seguro que voy.
  fa.a2.unit20.lesson03.teach.this_year:
    title: Este año, este verano
    gloss: este año, este verano
    note: '*این* delante de una palabra de tiempo significa «este»: *این تابستون*. *امسال* es una sola palabra para «este año».'
    example_gloss:
    - Este año me quedo en casa.
    - Este verano trabajo.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: Quizá lleva el verbo corto
    gloss: Quizá vaya, seguro que voy
    note: '*شاید* va seguido de la forma corta con *be-* (*برم*), porque el plan es solo una posibilidad (como el subjuntivo en español). *حتما* va seguido del presente normal (*می‌رم*), porque el plan es seguro: *شاید برم سینما*, pero *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: No quiero
    gloss: No quiero
    note: 'Pon *نـ* delante de *می‌خوام* para decir que no quieres o no piensas hacer algo: *نمی‌خوام برم*. Para un plan negativo simple, niega el presente: *می‌رم* pasa a *نمی‌رم*.'
    example_gloss:
    - No quiero mudarme de casa.
    - Este año no voy al norte.
    - Este verano no viajo.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: Quizá vaya al cine más tarde.
    gloss: Quizá vaya al cine más tarde.
    note: La palabra de tiempo *بعدا* puede ir entre *شاید* y el verbo.
  fa.a2.unit20.lesson04.teach.q_words:
    title: Dónde, con quién, cuántas semanas
    gloss: dónde, con quién, cuántas semanas
    note: '*با کی* significa literalmente «con quién»: sirve para preguntar con quién vas. *چند هفته* pregunta cuánto tiempo (cuántas semanas).'
    example_gloss:
    - ¿Adónde vas?
    - ¿Con quién vas?
    - ¿Cuántas semanas te quedas?
  fa.a2.unit20.lesson04.teach.q_where:
    title: ¿Adónde vas?
    gloss: ¿Adónde vas?
    note: 'La palabra interrogativa va primero y el verbo lleva la terminación *-ی* (tú): *می‌ری* (vas).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: ¿Con quién vas?
    gloss: ¿Con quién vas?
    note: 'Responde con *با* + la persona + el verbo: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: ¿Cuántas semanas te quedas?
    gloss: ¿Cuántas semanas te quedas?
    note: '*می‌مونی* es la forma de *tú* de *می‌مونم* (me quedo).'
  fa.a2.unit20.lesson04.teach.durations:
    title: Una semana, dos semanas, dos días
    gloss: una semana, dos semanas, dos días
    note: 'Después de un número, el sustantivo se queda en singular: *دو هفته*, *دو روز*. *یه هفته* es «una semana» en lengua hablada.'
    example_gloss:
    - Me quedo una semana.
    - Voy de viaje dos semanas.
    - Me quedo allí dos días.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: Quieres, haces (forma corta)
    gloss: quieres, haces (forma corta)
    note: '*می‌خوای* es la forma de *tú* de *می‌خوام*; el verbo corto que sigue también lleva la terminación de *tú*: *کنی* (de *کنم*), *بری* (de *برم*).'
    example_gloss:
    - ¿Qué quieres hacer?
    - ¿Quieres ir?
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: Tú vas / yo voy
    gloss: ¿Vas? Voy.
    note: Las preguntas usan la terminación de *tú* *-ی* (*می‌ری*, *می‌مونی*, *می‌کنی*); tu respuesta usa la terminación de *yo* *-م* (*می‌رم*, *می‌مونم*, *می‌کنم*). El tiempo y el verbo siguen siendo los mismos.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: Reconoce el tipo de plan
    gloss: voy, quiero, quizá vaya
    note: 'Al leer, fíjate en lo seguro que es cada plan: un presente simple con *می‌* (*می‌رم*) es algo decidido, *می‌خوام* es una intención y *شاید* es solo una posibilidad.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: Un mensaje sobre las vacaciones
    gloss: ¡Hola! En verano tengo vacaciones. En Mordad voy al norte con mi hermana. Nos quedamos una semana en un hotel. Después voy dos días a casa de mi mamá. El año que viene quiero hacer un curso. Quizá también vaya a Isfahán.
    note: Un mensaje corto sobre planes de verano. Léelo una vez para ver los planes y otra para ver lo seguro que es cada uno.
  fa.a2.unit20.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: Los dos amigos de unidades anteriores.
    example_gloss:
    - Sara trabaja en Tir.
    - Nima va a Turquía en Mordad.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: Sara pregunta por las vacaciones
    gloss: Sara le pregunta a Nima qué va a hacer en las vacaciones de verano.
    note: La pregunta habitual sobre los planes de vacaciones.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: El plan de Nima
    gloss: Nima dice que va a Turquía en Mordad y que reserva un hotel.
    note: Dos planes decididos, ambos en presente con *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: Sara pregunta con quién
    gloss: Sara dice que qué bien y le pregunta con quién va.
    note: '*با کی* pregunta con quién va.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: Con quién y cuánto tiempo
    gloss: Nima dice que va con su hermano y que se quedan allí una semana.
    note: 'En la respuesta se puede omitir el verbo: basta con *با برادرم*.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: Sara pregunta por el año que viene
    gloss: 'Sara pregunta: ¿y el año que viene? ¿Qué quieres hacer?'
    note: '*می‌خوای* es la forma de *tú* de *می‌خوام*; *کنی* es el verbo corto con la terminación de *tú*.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: La intención de Nima
    gloss: 'Nima dice que quiere hacer un curso y le pregunta a Sara: ¿y tú?'
    note: Una intención con *می‌خوام* y un verbo corto.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: Los planes de Sara
    gloss: Sara dice que trabaja en Tir y que quizá después vaya a casa de su mamá.
    note: Un plan decidido en presente y una posibilidad con *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: Él/ella va, se queda, hace, quiere
    gloss: él/ella va, se queda, hace, quiere
    note: 'Para contar el plan de otra persona se usa la terminación de *él/ella* *-ه* en el presente (*می‌ره*, *می‌مونه*, *می‌کنه*). *می‌خواد* es la forma de *él/ella* de *می‌خوام*, y el verbo corto que sigue también termina en *-ه*: *می‌خواد بره*, *می‌خواد بگیره*.'
    example_gloss:
    - Nima quiere hacer un curso.
    - Sara quiere ir a casa de su mamá.
