teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Universidad
    gloss: universidad
    note: '*دانشگاه* es la palabra estándar y cotidiana para «universidad».'
    example_gloss: Esta universidad es buena.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Estudiante
    gloss: estudiante
    note: '*دانشجو* significa «estudiante universitario». *من دانشجو هستم* («Soy estudiante») usa la forma *هستم*, que ya conoces.'
    example_gloss: Soy estudiante.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Lección / asignatura
    gloss: lección / asignatura
    note: '*درس* significa tanto «lección» como, en sentido más amplio, «asignatura».'
    example_gloss: Esta asignatura es interesante.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Idioma
    gloss: idioma
    note: '*زبان* es la palabra estándar para «idioma» o «lengua».'
    example_gloss: El persa es un idioma.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Yo / esto
    gloss: yo / este
    note: '*من* y *این* vuelven aquí para hablar de tus estudios.'
    target_text: من (yo) / این (esto)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: En
    gloss: en
    note: '*در* significa «en» y aquí se usa para decir «en la universidad».'
    target_text: در (en)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Estudiar/leer + yo = yo estudio/leo
    gloss: estudiar/leer + yo = estudio/leo
    note: '*خوندن* («leer» o «estudiar», como en *کتاب خوندن*) lleva la misma terminación de presente *-م* que *می‌کنم*, y da *می‌خونم*, «estudio» o «leo».'
    target_text: خوندن (estudiar/leer) + م = می‌خونم (estudio/leo)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Estudio en la universidad
    gloss: Estudio en la universidad
    note: '*من در دانشگاه درس می‌خونم* combina *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Matemáticas
    gloss: matemáticas
    note: '*ریاضی* es la palabra habitual para decir «matemáticas».'
    example_gloss: Las matemáticas son interesantes.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Carrera / campo de estudio
    gloss: carrera / especialidad
    note: '*رشته* significa «especialidad» o «campo de estudio» en la universidad. En *رشته‌ی من* («mi especialidad»), la *ی* adicional une el sustantivo con *من*.'
    example_gloss: Mi carrera es lenguas.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Inglés
    gloss: inglés
    note: '*انگلیسی* («inglés») vuelve a aparecer aquí para nombrar una materia que podrías estudiar.'
    target_text: انگلیسی (inglés)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Aprender + yo = estoy aprendiendo
    gloss: aprender + yo = estoy aprendiendo
    note: '*یاد گرفتن* significa «aprender». Su presente *یاد می‌گیرم* usa el mismo verbo *گرفتن* que *عکس می‌گیرم* («saco una foto»), pero con otro sentido.'
    target_text: یاد گرفتن (aprender) + م = یاد می‌گیرم (estoy aprendiendo)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Tú estudias/lees (informal)
    gloss: tú estudias / lees (informal)
    note: '*می‌خونی* es la forma informal de segunda persona de *می‌خونم*, y se usa para preguntar directamente a alguien.'
    target_text: می‌خونی (estudias/lees, informal)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Qué
    gloss: qué
    note: '*چی* («qué») vuelve a aparecer aquí.'
    target_text: چی (qué)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: ¿Qué estudias?
    gloss: ¿Qué estudias?
    note: '*چی درس می‌خونی؟* reúne todas las piezas de esta lección.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Mi especialidad es matemáticas. También estoy aprendiendo inglés.
    gloss: Mi especialidad es matemáticas. También estoy aprendiendo inglés.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* indica tu especialidad y una materia adicional, con el marcador de objeto *رو* y *هم* («también»).'
  fa.a1.unit30.lesson03.teach.review_koja:
    title: Dónde
    gloss: dónde
    note: '*کجا* («dónde») funciona por sí solo como palabra interrogativa, además de en preguntas como *کجاست؟*.'
    target_text: کجا (dónde)
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: ¿Dónde estudias?
    gloss: ¿Dónde estudia usted?
    note: '*کجا درس می‌خونی؟* pregunta dónde estudia alguien.'
  fa.a1.unit30.lesson03.teach.review_be:
    title: A
    gloss: a
    note: '*به* («a») vuelve a aparecer aquí en «a la universidad».'
    target_text: به (a)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Voy
    gloss: voy
    note: '*می‌رم* («voy») vuelve a aparecer aquí para ir a la universidad.'
    target_text: می‌رم (voy)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: Todos los días
    gloss: cada día
    note: '*هر روز* («cada día») vuelve a aparecer aquí.'
    target_text: هر روز (todos los días)
  fa.a1.unit30.lesson03.teach.answer_frequency:
    title: Voy a la universidad todos los días
    gloss: Voy a la universidad todos los días
    note: '*هر روز به دانشگاه می‌رم* reúne todas las piezas de esta lección.'
  fa.a1.unit30.lesson04.teach.sakhte_word:
    title: Es difícil
    gloss: es difícil
    note: '*سخته* (*سخت* + la cópula coloquial *-ه*) describe algo difícil.'
    example_gloss: Las matemáticas son difíciles.
  fa.a1.unit30.lesson04.teach.review_jalebe:
    title: Es interesante
    gloss: es interesante
    note: '*جالبه* («es interesante») vuelve a aparecer aquí.'
    target_text: جالبه (es interesante)
  fa.a1.unit30.lesson04.teach.review_vali:
    title: Pero
    gloss: pero
    note: '*ولی* («pero») vuelve a aparecer aquí.'
    target_text: ولی (pero)
  fa.a1.unit30.lesson04.teach.review_are:
    title: Sí
    gloss: sí
    note: '*آره* («sí», coloquial) vuelve a aparecer aquí.'
    target_text: آره (sí)
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, ¿qué estudias?'
    gloss: Sara, ¿qué estudias?
  fa.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Sara: Yo estudio inglés. ¿Dónde estudias tú?'
    gloss: Yo estudio inglés. ¿Dónde estudias tú?
  fa.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Nima: Yo estudio matemáticas en la universidad.'
    gloss: Estudio matemáticas en la universidad.
  fa.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Sara: Las matemáticas son difíciles, ¿verdad?'
    gloss: Las matemáticas son difíciles, ¿verdad?
  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Nima: Sí, son difíciles, pero interesantes.'
    gloss: Sí, son difíciles, pero interesantes.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Sara: ¡Qué bien!'
    gloss: ¡Qué bien!
  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: Él/ella estudia / lee
    gloss: él/ella estudia / lee
    note: '*می‌خونه* es la forma coloquial de tercera persona de *می‌خونم*, necesaria para hablar de نیما y سارا en esta lectura.'
    target_text: می‌خونه (él/ella estudia/lee)
  fa.a1.unit30.lesson05.teach.review_mire:
    title: Él/ella va
    gloss: él/ella va
    note: '*می‌ره* es la forma coloquial de tercera persona de *می‌رم* («voy»).'
    target_text: می‌ره (él/ella va)
  fa.a1.unit30.lesson05.teach.review_oo:
    title: Él / ella
    gloss: él / ella
    note: '*او* es el pronombre de tercera persona.'
    target_text: او (él/ella)
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Nima
    gloss: Nima
    note: '*نیما* es uno de los dos amigos que te encuentras en estos diálogos.'
  fa.a1.unit30.lesson05.teach.reading_text:
    title: 'Lectura: los estudios de Nima y Sara'
    gloss: Nima estudia matemáticas en la universidad. Las matemáticas son difíciles, pero interesantes. Sara estudia inglés. Ella va a la universidad todos los días.
    note: Esta lectura cuenta el diálogo en tercera persona. Casi no hay vocabulario nuevo, así que sirve para practicar el reconocimiento de palabras en un texto continuo.
  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: Me gusta / tiempo / no tengo
    gloss: me gusta / tiempo / no tengo
    note: '*دوست دارم*, *وقت* y *ندارم* se combinan aquí en una frase natural que expresa una preferencia y una limitación al hablar de estudiar.'
    target_text: دوست دارم (me gusta) / وقت (tiempo) / ندارم (no tengo)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: A veces
    gloss: a veces
    note: '*گاهی* («a veces») vuelve a aparecer aquí.'
    target_text: گاهی (a veces)
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: Me gusta estudiar, pero a veces es difícil
    gloss: Me gusta estudiar, pero a veces es difícil
    note: '*درس رو دوست دارم ولی گاهی سخته* combina una preferencia con una dificultad mediante *ولی*.'
