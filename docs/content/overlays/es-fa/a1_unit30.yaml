course:
  title: Persa A1
  description: 'Persa iraní para principiantes: vocabulario universitario y de estudios (universidad, estudiante universitario, lección/asignatura, idioma), hablar de qué materia estudias o aprendes (matemáticas, una carrera o campo de estudio, el inglés como asignatura), preguntar y responder dónde estudias (*کجا درس می‌خونی؟*) y con qué frecuencia vas, una lectura sobre los estudios de *نیما* y *سارا*, y un diálogo final entre *نیما* y *سارا* sobre sus materias y lo que opinan de ellas (difíciles pero interesantes).'
