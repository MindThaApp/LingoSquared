teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: El dinero
    gloss: dinero
    note: پول es la palabra general para «dinero».
    example_gloss: ¿Dónde está mi dinero?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Banco
    gloss: banco
    note: بانک es la palabra general para «banco».
    example_gloss: El banco está cerca.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dólar
    gloss: dólar
    note: دلار es la palabra para «dólar» (estadounidense), la divisa extranjera más habitual en las conversaciones cotidianas sobre cambio de moneda.
    example_gloss: Tengo dólares.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Cambio
    gloss: cambio de divisas
    note: 'تبدیل significa «cambio/conversión» y se usa con کردن (hacer): تبدیل کردن.'
    example_gloss: Quiero cambiar (dinero).
  fa.a1.unit21.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra habitual para unir elementos («y»); es un repaso de unidades anteriores.
    target_text: و (y)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Decir que quieres cambiar divisas
    gloss: Quiero cambiar dólares a tomanes.
    note: می‌خوام دلار به تومن تبدیل کنم usa به («a») para marcar la moneda de destino.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Preguntar cuántos dólares
    gloss: ¿Cuántos dólares tiene usted?
    note: '*چقدر دلار دارید؟* usa *چقدر* (cuánto/cuántos), una palabra que ya viste en preguntas de cantidad anteriores.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Cajero automático
    gloss: cajero automático
    note: خودپرداز significa literalmente «que paga por sí mismo» y es la palabra estándar para «cajero automático».
    example_gloss: El cajero automático está allí.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Decir que quieres retirar dinero
    gloss: Quiero sacar dinero del cajero automático.
    note: می‌خوام از خودپرداز پول بردارم usa از («de») y بردارم («saco/retiro»).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Pedir cambio
    gloss: ¿Tiene cambio?
    note: پول خرد دارید؟ usa خرد («menudo/suelto») después de پول («dinero»).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Aquí tiene (repaso)
    gloss: aquí tiene / adelante
    note: '*بفرمایید* se presentó en una unidad anterior; aquí se usa al entregar algo.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Tasa
    gloss: tasa de cambio
    note: نرخ es la palabra para «tasa» o «tipo» (de cambio).
    example_gloss: ¿A cuánto está el cambio hoy?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Decir el precio por dólar
    gloss: Cada dólar son 30 tomanes.
    note: هر دلار سی تومنه usa هر (cada) y la contracción coloquial -e (*تومنه* = *تومن است*) que ya conoces.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Cien
    gloss: cien
    note: صد es el número 100.
    example_gloss: Tengo cien dólares.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Hágalo, por favor
    gloss: cámbielo, por favor
    note: لطفاً تبدیل کنید es la forma imperativa cortés de تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara pide cambiar divisas
    gloss: Sara saluda al empleado y dice que quiere cambiar dólares a tomanes.
    note: Reutiliza می‌خوام دلار به تومن تبدیل کنم de la lección 2.
  fa.a1.unit21.lesson06.teach.turn02:
    title: El empleado pregunta cuántos dólares tiene
    gloss: El empleado saluda a Sara y le pregunta cuántos dólares tiene.
    note: Reutiliza چقدر دلار دارید؟ de la lección 2.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara dice la cantidad y pregunta por el cambio
    gloss: Sara dice que tiene cien dólares y pregunta a cuánto está el cambio hoy.
    note: صد (cien) es nuevo; نرخ امروز چنده؟ reutiliza la pregunta sobre la tasa de la lección 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: El empleado dice la tasa
    gloss: El empleado dice que cada dólar son 30 tomanes.
    note: Reutiliza هر دلار سی تومنه de la lección 5.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara acepta y pide al empleado que continúe
    gloss: Sara acepta y le pide al empleado que haga el cambio, por favor.
    note: لطفاً تبدیل کنید, aprendido antes en esta lección.
  fa.a1.unit21.lesson06.teach.turn06:
    title: El empleado entrega el total
    gloss: Aquí tiene, tres mil tomanes.
    note: '*سه هزار تومن* = 100 dólares × 30 tomanes por dólar. *هزار* (mil) se repasa de la unidad de los números.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara da las gracias y pide también cambio
    gloss: Gracias. ¿Tiene también cambio?
    note: Reutiliza پول خرد دارید؟ de la lección 4 con هم («también»).
  fa.a1.unit21.lesson06.teach.turn08:
    title: El empleado confirma y lo entrega
    gloss: Sí, aquí tiene.
    note: بله («sí») es una palabra de repaso; بفرمایید cierra el intercambio.
