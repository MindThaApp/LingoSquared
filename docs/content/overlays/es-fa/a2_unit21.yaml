teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: Cita, peluquería
    gloss: cita, peluquería (salón)
    note: '*وقت* significa tanto «tiempo» como «hueco para una cita»: *وقت دارم* = «tengo cita» (o «tengo tiempo»). *آرایشگاه* es la peluquería o el salón de belleza.'
    example_gloss:
    - El jueves tengo cita en la peluquería.
    - Tengo cita con el médico.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: Cambiar, cancelar
    gloss: cambiar (una cita), cancelar
    note: 'Ambos son verbos con *کردن*. El complemento directo *وقتم* lleva *رو*: *وقتم رو عوض می‌کنم*. *کنسل کردن* es la palabra habitual para «cancelar».'
    example_gloss:
    - Estoy cambiando mi cita.
    - Estoy cancelando mi cita.
  fa.a2.unit21.lesson01.teach.sorry:
    title: Lamentablemente, perdón
    gloss: lamentablemente, perdón
    note: '*متأسفانه* introduce una negativa cortés o una mala noticia. *ببخشید* es el «disculpa / perdón» de uso diario. *متأسفانه* se escribe a menudo *متاسفانه*, sin la hamza; se aceptan ambas.'
    example_gloss:
    - Por desgracia no puedo.
    - Perdón, ¿puedo venir?
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: Lamentablemente no puedo ir el jueves.
    gloss: Lamentablemente no puedo ir el jueves.
    note: '*نمی‌تونم* (no puedo) va seguido del verbo corto *بیام* (de *اومدن*, venir). El día va antes del verbo: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: ¿Puedo cambiar mi cita?
    gloss: ¿Puedo cambiar mi cita?
    note: '*می‌تونم* (puedo) + el verbo corto *کنم*. Es la forma cortés de pedir que se cambie tu cita.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: Poder y no poder + verbo corto
    gloss: puedo venir, no puedo venir, puedo cambiar
    note: '*می‌تونم* (puedo) y *نمی‌تونم* (no puedo) van seguidos de la forma corta del verbo con *be-*: *بیام* (venir), *کنم* (hacer). Los dos verbos llevan la misma terminación (*-م*): *نمی‌تونم بیام*. Para *usted* (formal) ambos toman *-ید*: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: Otro día, sábado, lunes
    gloss: otro día, sábado, lunes
    note: '*دیگه* después de un sustantivo significa «otro» o «más»: *یه روز دیگه* es «otro día». En Irán la semana empieza el *شنبه* (sábado).'
    example_gloss:
    - Tengo cita otro día.
    - El sábado no puedo.
    - El lunes tengo tiempo.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: ¿Puede ser el lunes?
    gloss: ¿Puede ser el lunes?
    note: '*می‌شه* (¿es posible?) + el día + *باشه* (que sea). Es la forma habitual de proponer otro día: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: ¿Le viene bien el sábado?
    gloss: ¿Le viene bien el sábado? (formal)
    note: '*براتون مناسبه؟* pregunta si algo te viene bien. *براتون* es el *usted* de cortesía; con un amigo dirías *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: Sí, está bien.
    gloss: Sí, está bien.
    note: '*خوبه* (está bien) es una forma breve de aceptar una hora.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: No, lamentablemente no.
    gloss: No, lamentablemente no.
    note: 'Una forma cortés de rechazar: *نه* más *متأسفانه* suaviza la respuesta.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: «Tú» y «usted»
    gloss: ¿Te viene bien? / ¿Le viene bien? (amigo / formal)
    note: 'Con un amigo la terminación es *-ت*: *برات*. Para una ventanilla de atención o alguien que no conoces se usa *-تون*: *براتون*. En esta unidad la peluquería usa la forma formal.'
  fa.a2.unit21.lesson03.teach.because:
    title: Porque, estoy enfermo
    gloss: porque, estoy enfermo/a
    note: '*چون* (porque) une el motivo a la oración principal: *نمی‌تونم بیام چون مریضم*. *مریضم* es *مریض* (enfermo) + *-م* (soy/estoy).'
    example_gloss:
    - No puedo ir porque estoy enfermo.
    - Como tengo trabajo, no puedo.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: Porque tengo que trabajar.
    gloss: Porque tengo que trabajar.
    note: '*باید* (tener que) + el verbo corto *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: Porque tengo otra cita.
    gloss: Porque tengo otra cita.
    note: '*یه وقت دیگه* es «otra cita».'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: ¿Por qué no puedes? Porque estoy enfermo.
    gloss: ¿Por qué no puedes? Porque estoy enfermo.
    note: '*چرا؟* pregunta por qué; un motivo breve que empieza con *چون* puede ser la respuesta por sí solo. *نمی‌تونی* es la forma de *tú* de *نمی‌تونم*.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: Perdón por las molestias.
    gloss: Perdón por las molestias.
    note: '*بابت زحمت* significa «por las molestias». Se dice cuando causas trabajo extra a alguien, por ejemplo al cambiar una cita.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: Oración principal y después el motivo
    gloss: No puedo ir porque tengo que trabajar.
    note: 'Pon primero la negativa y después el motivo con *چون*. Una respuesta breve puede empezar con *چون*: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: A las diez, un día antes
    gloss: las diez, un día antes
    note: 'La hora se dice *ساعت* + el número: *ساعت ده* (las diez). *قبل* significa «antes»: *یه روز قبل* es «un día antes».'
    example_gloss:
    - El lunes a las diez está bien.
    - Llamaré un día antes.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: El lunes a las diez está bien.
    gloss: El lunes a las diez está bien.
    note: 'Primero el día y luego la hora: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: ¿Puede venir el lunes a las diez?
    gloss: ¿Puede venir el lunes a las diez? (formal)
    note: '*می‌تونید* y *بیاید* llevan la terminación formal de *usted*, *-ید*.'
  fa.a2.unit21.lesson04.teach.see_you:
    title: Entonces nos vemos el lunes.
    gloss: Entonces nos vemos el lunes. (formal)
    note: '*پس* (entonces) cierra el acuerdo; *می‌بینمتون* es «le veré» (formal).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: Pediré una cita nueva.
    gloss: Pediré una cita nueva.
    note: '*وقت گرفتن* (literalmente «tomar un tiempo») es la forma habitual de decir que pides cita.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: Primero el día, después la hora
    gloss: el lunes a las diez
    note: 'Di primero el día y luego la hora, sin preposición: *دوشنبه ساعت ده*. Si añades el verbo, va al final: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: Localiza el día y la hora
    gloss: el lunes a las diez, un día antes
    note: Cuando leas un mensaje sobre una cita, busca el día, la hora y lo que tienes que hacer si no te viene bien.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: Un mensaje de la peluquería
    gloss: ¡Hola, señor Nima! Su cita se ha cambiado al lunes a las diez. Si esta hora no le viene bien, por favor llame un día antes. Concertaremos una cita nueva.
    note: Un mensaje breve de la peluquería. Léelo una vez para ver la nueva hora y otra para saber qué hacer si no te viene bien.
  fa.a2.unit21.lesson06.teach.names:
    title: Nima, la peluquería
    gloss: Nima, la peluquería
    note: Nima, el amigo de unidades anteriores, llama a la peluquería. Quien atiende está identificado como *آرایشگاه*.
    example_gloss:
    - Nima llama a la peluquería.
  fa.a2.unit21.lesson06.teach.please_great:
    title: Adelante, por supuesto, gracias, de nada
    gloss: adelante, por supuesto, gracias, de nada
    note: '*بفرمایید* es lo que dice quien contesta el teléfono para invitarte a hablar. *البته* significa «por supuesto», *ممنون* significa «gracias» y *خواهش می‌کنم* responde a «gracias».'
    example_gloss:
    - Peluquería, dígame.
    - Sí, claro.
    - Gracias. De nada.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: La peluquería contesta
    gloss: La peluquería contesta el teléfono.
    note: 'Una forma cortés de contestar: el nombre del lugar y *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: Nima explica y pregunta
    gloss: Nima dice que tiene cita el jueves pero que lamentablemente no puede ir, y pregunta si puede cambiarla.
    note: '*ولی* une la cita y el problema.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: El salón propone el sábado
    gloss: El salón dice que sí, por supuesto, y le pregunta si le viene bien el sábado.
    note: El *براتون* de cortesía.
  fa.a2.unit21.lesson06.teach.dlg4:
    title: Nima rechaza y propone el lunes
    gloss: Nima dice que, lamentablemente, no, porque tiene que trabajar, y pregunta si puede ser el lunes.
    note: Una negativa, un motivo y una nueva propuesta.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: El salón acepta
    gloss: El salón dice que el lunes a las diez está bien.
    note: Primero el día y después la hora.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: Nima da las gracias y se disculpa
    gloss: Nima dice que genial, gracias, y perdón por las molestias.
    note: '*ببخشید بابت زحمت* es la disculpa cortés para despedirse.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: El salón se despide
    gloss: El salón dice de nada, y hasta el lunes.
    note: '*خواهش می‌کنم* responde a «gracias».'
  fa.a2.unit21.lesson06.teach.third_person:
    title: Él no puede venir, ella dice
    gloss: él/ella no puede venir, él/ella dice, él/ella quiere
    note: 'Para contar lo que otra persona dice o puede hacer, usa las terminaciones de *él/ella*: *نمی‌تونه* (no puede), *می‌گه* (dice), *می‌خواد* (quiere), y el verbo corto *بیاد* (venir).'
    example_gloss:
    - Nima no puede venir el jueves.
    - El salón dice que el lunes a las diez está bien.
