teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: Cosas de todos los días
    gloss: libro, bolso, llave, móvil, reloj
    note: '*ساعت* significa tanto «reloj» como «hora» (en punto); la oración te indica cuál.'
    example_gloss:
    - Tengo un libro.
    - Tengo un bolso.
    - Tengo una llave.
    - Tengo un teléfono.
    - Tengo un reloj.
  fa.a2.unit40.lesson01.teach.verbs:
    title: Compré, perdí, encontré
    gloss: compré, perdí, encontré
    note: 'Los tres están en pretérito simple, primera persona. *گم کردم* y *پیدا کردم* son verbos de dos palabras: primero va el sustantivo.'
    example_gloss:
    - Ayer compré un libro.
    - Ayer perdí una llave.
    - Ayer encontré un móvil.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'Sustantivo + ی + که: «el/la ... que ...»'
    gloss: el libro que compré; el bolso que perdí; la llave que encontré
    note: 'Para decir a qué cosa te refieres, añade *ی* al sustantivo, luego *که* y una oración corta: *کتاب* + *ی* + *که خریدم*. Todo el grupo funciona como un solo sustantivo. Igual que en español, la oración no lleva un pronombre extra: *کتابی که خریدم*, no «el libro que lo compré».'
  fa.a2.unit40.lesson01.teach.rel2:
    title: El grupo es el sujeto de la oración
    gloss: El libro que compré es bueno; el bolso que perdí era pequeño
    note: 'El grupo *کتابی که خریدم* puede ir al principio de la oración como cualquier sustantivo, y después viene el verbo o el adjetivo: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: Personas en el trabajo
    gloss: compañero de trabajo, jefe, cliente, hombre, señora
    note: '*همکارم* es «mi compañero de trabajo». *خانم* también es el tratamiento cortés «señora/señorita».'
    example_gloss:
    - Mi compañero de trabajo está aquí.
    - El jefe está allí.
    - El cliente está aquí.
    - Ese hombre está allí.
    - Esa señora está aquí.
  fa.a2.unit40.lesson02.teach.verbs:
    title: Trabaja, está sentado, llamó
    gloss: él/ella trabaja, está sentado/a, llamó
    note: '*نشسته* significa «está sentado» (un estado). *زنگ زد* es «llamó (por teléfono)».'
    example_gloss:
    - Mi compañero de trabajo trabaja en un banco.
    - El jefe está sentado allí.
    - El cliente llamó ayer.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: 'Quien: el mismo patrón para personas'
    gloss: el hombre que está sentado allí; el compañero que trabaja en el banco; el cliente que llamó
    note: Para las personas, el persa usa el mismo *که* que para las cosas; no hay una palabra distinta para «quien». La persona es quien realiza el verbo de la oración.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: Escritura de ی después de ه y de ی
    gloss: 'tras consonante: ی; tras una ه muda o una ی final: ‌ای'
    note: 'Después de una consonante la terminación es *ی* (*کتابی*). Después de una *ه* muda o de *ی* se escribe *ای* con un pequeño espacio: *خونه‌ای*, *مشتری‌ای*. Al hablar se oye el mismo sonido «i».'
  fa.a2.unit40.lesson03.teach.which:
    title: Cuál, ese, ese mismo
    gloss: cuál, ese, ese mismo
    note: '*کدوم؟* pregunta «¿cuál?». *اون* señala algo; *همون* significa «ese mismo».'
    example_gloss:
    - ¿Qué libro?
    - Ese libro es bueno.
    - Ese mismo libro está aquí.
  fa.a2.unit40.lesson03.teach.answer:
    title: Responde a «¿cuál?» con un grupo relativo
    gloss: ¿Qué bolso? El bolso que perdí.
    note: 'La respuesta más fácil a *کدوم؟* es un grupo relativo. Puedes añadir *اون* o *همون* delante: *همون کیفی که گم کردم* (ese mismo bolso que perdí).'
  fa.a2.unit40.lesson03.teach.time:
    title: Más palabras dentro del grupo
    gloss: el libro que compré ayer; el reloj que encontré hoy
    note: 'La oración puede llevar más palabras (una expresión de tiempo, un lugar) antes del verbo. El verbo sigue yendo al final: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: Cosas que la gente pierde
    gloss: gafas, cartera, color
    note: '*کیف پول* es «cartera»: *کیف* (bolso) + *پول* (dinero).'
    example_gloss:
    - Mis gafas están aquí.
    - Mi cartera está allí.
    - Este color es bonito.
  fa.a2.unit40.lesson04.teach.colours:
    title: Los colores y «¿de qué color?»
    gloss: negro, rojo, azul, qué
    note: '*چه رنگیه؟* pregunta «¿de qué color es?».'
    example_gloss:
    - Mi bolso es negro.
    - Mis gafas son rojas.
    - Mi móvil es azul.
    - ¿De qué color es tu bolso?
  fa.a2.unit40.lesson04.teach.describe:
    title: Describir lo que perdiste
    gloss: ¿De qué color es el bolso que perdió usted? El bolso que perdí es negro.
    note: 'En una oficina de objetos perdidos, el empleado pregunta por el objeto con un grupo relativo, y tú respondes con otro o solo con el color: *سیاهه*. El empleado usa *شما* (*گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: Un bolso perdido
    gloss: 'Ayer Sara perdió su bolso. El bolso que perdió era negro. Dentro del bolso había un móvil y una llave. Hoy Sara fue a la oficina de objetos perdidos. El empleado que trabaja allí dijo: «El bolso que encontramos es negro». Sara se puso contenta.'
    note: Lee una vez para entender lo que pasó y otra vez para fijarte en los grupos con *که*.
  fa.a2.unit40.lesson06.teach.turn01:
    title: Nima avisa de que ha perdido un bolso
    gloss: 'Nima: Disculpe, he perdido un bolso.'
    note: '*گم کردم* es «perdí» / «he perdido».'
  fa.a2.unit40.lesson06.teach.turn02:
    title: El empleado pide una descripción
    gloss: 'Empleado: ¿De qué color es el bolso que perdió?'
    note: 'El empleado usa *شما*: *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: Nima responde
    gloss: 'Nima: Es negro.'
    note: Una respuesta corta basta.
  fa.a2.unit40.lesson06.teach.turn04:
    title: El empleado pregunta cuál
    gloss: 'Empleado: ¿Qué bolso? ¿El que es pequeño?'
    note: '*اونی که کوچیکه* es «el que es pequeño»: *اونی* sustituye al sustantivo.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: Nima confirma
    gloss: 'Nima: Sí, ese mismo bolso que es pequeño.'
    note: '*همون کیفی که کوچیکه* repite la descripción.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: El empleado señala a un compañero
    gloss: 'Empleado: El compañero que está sentado allí ha encontrado el bolso. El bolso que ha encontrado es negro.'
    note: '*پیدا کرده* es el pretérito perfecto: «ha encontrado».'
