teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: Feliz
    gloss: feliz
    note: خوشحال significa «feliz» o «contento».
    example_gloss: Estoy contento.
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: Triste
    gloss: triste
    note: ناراحت significa «triste».
    example_gloss: Estoy triste.
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: Soy (contraído)
    gloss: soy / estoy (contraído con un adjetivo)
    note: '*خوشحالم* es *خوشحال* + *هستم* contraído en *-م*. Después de una *-ه* muda, la misma terminación se escribe *-ام*, como en *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (estoy contento/a, contraído)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Cansado
    gloss: cansado
    note: خسته significa «cansado» o «cansada».
    example_gloss: Estoy cansado.
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: No estoy bien
    gloss: no estoy bien
    note: خوب نیستم niega el ya aprendido خوبم (estoy bien) usando نیستم, la forma negativa de هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Con hambre
    gloss: con hambre
    note: '*گشنه* significa «hambriento/a». Es la forma hablada habitual de *گرسنه*, que viste en la Unidad 4.'
    example_gloss: Tengo hambre.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Un poco
    gloss: un poco
    note: یکم suaviza un sentimiento, como «un poco» o «algo» en español.
    example_gloss: Estoy un poco cansado/a.
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: Enfadado/a
    gloss: enfadado/a
    note: عصبانی significa «enfadado/a».
    example_gloss: ¿Por qué estás enfadado/a?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Preocupado/a
    gloss: preocupado/a
    note: نگران significa «preocupado/a».
    example_gloss: Estoy preocupado/a.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Por qué
    gloss: por qué
    note: '*چرا* significa «por qué»; *هستی* es la forma informal de «eres/estás» y se contrae en *-ی*: *نگران هستی* se convierte en *نگرانی*.'
    target_text: چرا (por qué)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: Trabajé
    gloss: trabajé
    note: کار کردم significa literalmente «trabajo hice».
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: Es festivo
    gloss: es festivo
    note: تعطیله significa que es día libre o festivo.
    example_gloss: Hoy es festivo.
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Hoy
    gloss: hoy
    note: امروز significa «hoy».
    example_gloss: Hoy estoy cansado.
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: Mucho
    gloss: mucho
    note: زیاد significa «mucho» o «demasiado».
    example_gloss: Trabajé mucho.
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Sara
    gloss: Sara
    note: سارا, presentada como personaje en la Unidad 14, vuelve a aparecer aquí.
    example_gloss: Sara está cansada.
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 'Lectura: el día de Sara'
    gloss: Sara está un poco cansada hoy porque ha trabajado mucho. Sara no está triste, solo cansada.
    note: '*خسته‌ست* y *کرده* son las formas coloquiales de tercera persona de *خسته‌ام* y *کردم*; *نیست* es la negación de *هست*; *فقط* significa «solo».'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: ¡Qué bien!
    gloss: ¡qué bien!
    note: چه خوب! es una reacción positiva muy común, como «¡qué bien!» o «¡genial!».
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, ¿cómo estás?'
    gloss: Sara, ¿cómo estás?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Sara: Estoy un poco cansada...'
    gloss: Hoy estoy un poco cansada porque he trabajado mucho. ¿Y tú?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Nima: Estoy contento...'
    gloss: Estoy contento porque hoy es festivo.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Sara: ¡Qué bien!'
    gloss: ¡Qué bien!
