    example_gloss: Estaba cruzando la calle cuando el coche se detuvo.
  fa.a2.unit24.lesson04.teach.incident_pattern:
    title: Acción de fondo más interrupción
    gloss: Estaba ... cuando ... ocurrió
    note: Usa el pasado progresivo para la acción de fondo y un verbo en pasado simple después de *که* para la interrupción.
  fa.a2.unit24.lesson05.teach.reading:
    title: Un incidente en el autobús
    gloss: Ayer iba a casa en autobús. En el tráfico estaba leyendo un libro cuando el autobús se detuvo. Esperé unos minutos. Luego el autobús volvió a ponerse en marcha.
    note: Lee una vez para fijarte en las acciones de fondo y otra para el hecho puntual que interrumpe.
  fa.a2.unit24.lesson06.teach.question:
    title: ¿Qué estabas haciendo?
    gloss: ¿Qué estabas haciendo?
    note: '*داشتی چیکار می‌کردی؟* sirve para preguntar a un amigo qué actividad estaba en curso.'
  fa.a2.unit24.lesson06.teach.turn01:
    title: Sara pregunta por la lluvia
    gloss: Ayer, cuando empezó a llover, ¿qué estabas haciendo?
    note: Sara pregunta por una acción de fondo en curso.
  fa.a2.unit24.lesson06.teach.turn02:
    title: Nima responde
    gloss: Iba a casa. ¿Y tú?
    note: Nima responde con el pasado progresivo en primera persona.
  fa.a2.unit24.lesson06.teach.turn03:
    title: Sara cuenta el corte de luz
    gloss: Estaba preparando la cena cuando se fue la luz.
    note: Sara une su actividad de fondo con un hecho puntual.
  fa.a2.unit24.lesson06.teach.turn04:
    title: Nima pregunta qué pasó después
    gloss: ¿Y qué pasó después?
    note: Una pregunta corta hace avanzar la historia.
  fa.a2.unit24.lesson06.teach.turn05:
    title: Sara termina el relato
    gloss: Esperé unos minutos. Luego volvió la luz.
    note: Dos hechos en pasado simple cierran el incidente.
exercises:
