teaching:
  fa.a2.unit24.lesson01.teach.incident_words:
    title: Ayer
    when: null
    an incident: null
    gloss: ayer, cuando, un incidente
    note: '*وقتی* introduce el momento en que ocurrió algo; *که* puede unir una acción en curso con el hecho que la interrumpió.'
    example_gloss:
    - Ayer ocurrió un incidente.
