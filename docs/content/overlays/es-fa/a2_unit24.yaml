  fa.a2.unit24.lesson01.teach.weather_traffic:
    title: Lluvia
    traffic: null
    bus: null
    power: null
    gloss: lluvia, tráfico, autobús, electricidad / luz
    note: Estas son las palabras para los pequeños incidentes de esta unidad.
    example_gloss:
    - Empezó a llover.
    - El autobús se detuvo en el tráfico.
    - Se fue la luz.
  fa.a2.unit24.lesson01.teach.actions:
    title: La casa y las actividades de fondo
    gloss: casa, libro, cena, ir, leer, hacer
    note: Estas actividades se pueden presentar como ya en curso.
    example_gloss:
    - Iba a casa.
    - Estaba leyendo un libro.
    - Estaba preparando la cena.
  fa.a2.unit24.lesson01.teach.past_events:
    title: Hechos puntuales del pasado
    gloss: empezó, se detuvo, se fue (la luz), llegué, ocurrió
    note: Estas formas del pasado simple nombran el único hecho que ocurrió en medio de una actividad.
    example_gloss:
    - Empezó a llover.
    - El autobús se detuvo.
    - Cuando llegué, se fue la luz.
  fa.a2.unit24.lesson01.teach.progressive_form:
    title: El pasado progresivo
    gloss: iba, estaba leyendo, estaba preparando
    note: 'Para una acción en curso en el pasado, usa *داشتن* en pasado más la forma del pasado con *می‌* correspondiente: *داشتم می‌رفتم*. Ambos verbos concuerdan con la misma persona.'
  fa.a2.unit24.lesson02.teach.people_forms:
    title: yo
    you: null
    he/she: null
    we: null
    they: null
    gloss: yo, tú, él/ella, nosotros, ellos
    note: En persa estos pronombres suelen omitirse, porque las terminaciones de los verbos ya indican la persona, como en español.
    example_gloss:
    - Yo iba.
    - Tú ibas.
    - Él/ella iba.
    - Nosotros íbamos.
    - Ellos iban.
  fa.a2.unit24.lesson02.teach.form_agreement:
    title: Une las dos terminaciones verbales
    gloss: iba, ibas, iba (él/ella), íbamos, iban
    note: 'Los dos verbos llevan terminaciones iguales: *داشتم می‌رفتم*, *داشتی می‌رفتی*, *داشت می‌رفت*, *داشتیم می‌رفتیم*, *داشتن می‌رفتن*.'
  fa.a2.unit24.lesson02.teach.linkers:
    title: Dos formas de enlazar el hecho
    gloss: Iba andando cuando empezó a llover. Cuando llegué, ellos se iban.
    note: Pon *که* después de la actividad de fondo, o empieza con *وقتی* más el hecho. En ambos patrones, una oración está en curso y la otra es un hecho puntual.
  fa.a2.unit24.lesson03.teach.time_contrast:
    title: Cada día
    at that moment: null
    usually: null
    gloss: todos los días, en ese momento, normalmente
    note: Estas expresiones de tiempo distinguen una costumbre repetida del pasado de una escena en curso.
    example_gloss:
    - Todos los días iba a casa.
    - En ese momento iba a casa.
    - Normalmente leía libros.
  fa.a2.unit24.lesson03.teach.habit_contrast:
    title: Costumbre frente a acción en curso
    gloss: Iba todos los días. En ese momento iba de camino.
    note: '*می‌رفتم* solo puede describir una costumbre repetida del pasado. *داشتم می‌رفتم* se centra en una acción en curso en un momento concreto del pasado.'
  fa.a2.unit24.lesson04.teach.more_incidents:
    title: Calle
    car: null
    I waited: null
    then: null
    gloss: calle, coche, esperé, después
    note: Usa estas palabras para terminar el relato breve de un incidente.
    example_gloss:
    - Estaba cruzando la calle.
    - El coche se detuvo.
    - Después esperé.
  fa.a2.unit24.lesson04.teach.crossing:
