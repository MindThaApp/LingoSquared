teaching:
  fa.a2.unit16.lesson01.teach.social_media_word:
    title: Redes sociales
    gloss: las redes sociales
    note: '*شبکه‌ی اجتماعی* es la expresión habitual para «redes sociales».'
    example_gloss: Uso las redes sociales todos los días.
  fa.a2.unit16.lesson01.teach.app_word:
    title: Aplicación
    gloss: aplicación
    note: '*اپلیکیشن* es el préstamo habitual para una aplicación del móvil o del ordenador.'
    example_gloss: Mi aplicación favorita es Instagram.
  fa.a2.unit16.lesson01.teach.screen_word:
    title: Pantalla
    gloss: pantalla
    note: '*صفحه* es la palabra para pantalla, por ejemplo la del móvil o la del ordenador.'
    example_gloss: La pantalla de mi móvil es grande.
  fa.a2.unit16.lesson01.teach.useful_word:
    title: Útil
    gloss: útil
    note: '*مفید* es la palabra para «útil»; *مفیده* es su forma coloquial hablada (*مفید* + *است*).'
    example_gloss: Leer las noticias es útil.
  fa.a2.unit16.lesson01.teach.news_word:
    title: Noticias
    gloss: noticias
    note: '*خبر* es la palabra general para «noticia».'
    example_gloss: Leo las noticias todos los días.
  fa.a2.unit16.lesson01.teach.entertaining_word:
    title: Entretenido
    gloss: entretenido / divertido
    note: '*سرگرم‌کننده* describe algo entretenido o divertido de usar.'
    example_gloss: Esta aplicación es muy entretenida.
  fa.a2.unit16.lesson01.teach.waste_time_note:
    title: Perder el tiempo (verbo compuesto)
    gloss: perder el tiempo
    note: '*وقت تلف کردن* significa literalmente «tiempo desperdicio hacer»: otra construcción con verbo compuesto, como *باز کردن* de la unidad anterior sobre el banco.'
    target_text: وقت تلف کردن (perder el tiempo, verbo compuesto)
  fa.a2.unit16.lesson01.teach.recap_opinion_pattern:
    title: En mi opinión... porque...
    gloss: en mi opinión... porque...
    note: Repaso de la estructura *به نظر من ... چون ...* de la unidad anterior sobre opiniones, que aquí se usa para unir un hábito con una opinión.
  fa.a2.unit16.lesson02.teach.about_word:
    title: Alrededor de / aproximadamente
    gloss: alrededor de / aproximadamente
    note: '*حدود* va delante de una cantidad y significa «alrededor de» o «aproximadamente».'
    example_gloss: Tenía unas dos horas.
  fa.a2.unit16.lesson02.teach.how_much_word:
    title: ¿Cuánto usas las redes sociales cada día?
    gloss: ¿Cuánto usas las redes sociales cada día?
    note: '*چقدر* pregunta «cuánto»; aquí, por el tiempo dedicado a una actividad.'
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: Expresar tu propio hábito con una frecuencia
    gloss: Uso las redes sociales unas dos horas al día.
    note: Combina *هر روز* (todos los días) con *حدود دو ساعت* (unas dos horas) para expresar un hábito con su duración.
  fa.a2.unit16.lesson03.teach.world_word:
    title: Mundo
    gloss: mundo
    note: '*دنیا* es la palabra general para «mundo».'
    example_gloss: Me gusta saber lo que pasa en el mundo.
  fa.a2.unit16.lesson03.teach.message_text:
    title: Un mensaje sobre leer las noticias en internet
    gloss: ¡Hola! Leo las noticias alrededor de una hora todos los días. En mi opinión, leer las noticias es útil, porque estoy al tanto de lo que pasa en el mundo.
    note: Un mensaje escrito breve con la estructura de opinión *به نظر من ... چون ...*, en el estilo informal hablado que se usa en los mensajes a los amigos.
  fa.a2.unit16.lesson04.teach.favorite_word:
    title: Favorito
    gloss: favorito
    note: '*مورد علاقه* significa «favorito»; en *علاقه‌ام* se añade el sufijo posesivo de «mi».'
    example_gloss: Mi color favorito es el azul.
  fa.a2.unit16.lesson04.teach.turn01:
    title: نیما le pregunta a سارا cuánto usa las redes sociales
    gloss: نیما le pregunta a سارا cuánto usa las redes sociales cada día.
    note: Retoma la pregunta de «cuánto» de la lección 2.
  fa.a2.unit16.lesson04.teach.turn02:
    title: سارا cuenta su costumbre
    gloss: سارا dice que unas dos horas; su aplicación favorita es Instagram.
    note: Retoma el patrón con *حدود* («alrededor de») de la lección 2.
  fa.a2.unit16.lesson04.teach.turn03:
    title: نیما le pregunta su opinión
    gloss: نیما le pregunta si le parece útil.
    note: '*به نظرت* («en tu opinión») es la forma de segunda persona de *به نظر من*.'
  fa.a2.unit16.lesson04.teach.turn04:
    title: سارا da su opinión
    gloss: سارا dice que, en su opinión, es entretenido, pero a veces pierde el tiempo.
    note: '*هم ... هم ...* («tanto... como...») une dos cualidades de lo mismo; aquí, una positiva y otra negativa.'
  fa.a2.unit16.lesson04.teach.turn05:
    title: نیما contrapone su propia costumbre
    gloss: نیما dice que lee sobre todo noticias, no redes sociales.
    note: '*بیشتر ..., نه ...* («sobre todo..., no...») expresa una preferencia por contraste.'
  fa.a2.unit16.lesson04.teach.turn06:
    title: سارا reacciona
    gloss: 'سارا dice: ¡qué bien!'
    note: 'Una reacción cotidiana breve: *چه خوب!* significa «¡qué bien!».'
