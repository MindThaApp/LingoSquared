teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Esto
    gloss: este
    note: این significa «esto».
    example_gloss: Esto es más grande que aquello.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Aquello
    gloss: aquello
    note: اون significa «ese/aquel» o «eso/aquello» (forma coloquial de آن).
    example_gloss: Aquello es más pequeño que esto.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Es más grande
    gloss: es más grande
    note: بزرگ‌تره es la contracción coloquial de بزرگ‌تر است («es más grande»). بزرگ‌تر es el comparativo de بزرگ (grande).
    example_gloss: Esto es más grande que aquello.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Es más pequeño
    gloss: es más pequeño
    note: کوچیک‌تره es la contracción coloquial de کوچیک‌تر است («es más pequeño»).
    example_gloss: Aquello es más pequeño que esto.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Que (comparación)
    gloss: que
    note: 'از marca el punto de comparación: X از Y بزرگ‌تره significa «X es más grande que Y».'
    target_text: از (que, en comparaciones)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Es más caro
    gloss: es más caro
    note: گرون‌تره es la contracción coloquial de گرون‌تر است. گرون‌تر es el comparativo de گرون (caro).
    example_gloss: Esto es más caro que aquello.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Es más barato
    gloss: es más barato
    note: ارزون‌تره es la contracción coloquial de ارزون‌تر است. ارزون‌تر es el comparativo de ارزون (barato).
    example_gloss: Aquello es más barato que esto.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima y Sara
    gloss: Nima, Sara
    note: Nombres iraníes comunes que se usan a lo largo de este curso.
    example_gloss:
    - Nima es más alto que Sara.
    - Sara es más joven que Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Más alto
    gloss: más alto / es más alto, es más alta
    note: '*قد بلندتره* significa literalmente «la estatura es más larga»: *قد* (estatura) + *بلندتر* (más alto, comparativo de *بلند*, alto/largo) + *است* (es), contraído en *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Más joven
    gloss: más joven / es más joven
    note: جوون‌تره es la contracción coloquial de جوون‌تر است. جوون‌تر es el comparativo de جوون (joven).
    example_gloss: Sara es más joven que Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Es mejor
    gloss: es mejor
    note: '*بهتره* es la contracción coloquial de *بهتر است*. *بهتر* (mejor) es el comparativo irregular de *خوب* (bueno).'
    example_gloss: Esto es mejor que aquello.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Es peor
    gloss: es peor
    note: '*بدتره* es la contracción coloquial de *بدتر است*. *بدتر* (peor) es el comparativo regular de *بد* (malo): la misma palabra más la terminación normal *تر*, a diferencia de *بهتر*, que es irregular.'
    example_gloss: Aquello es peor que esto.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Porque
    gloss: porque
    note: 'چون introduce una razón: «porque».'
    target_text: چون (porque)
  fa.a1.unit15.lesson04.teach.va_word:
    title: Y
    gloss: y
    note: و significa «y» y une dos oraciones o elementos.
    target_text: و (y)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Texto de comparación de ejemplo
    gloss: Nima es más alto que Sara. Sara es más joven que Nima.
    note: Una comparación breve en tercera persona que combina el vocabulario de esta unidad.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima y Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima dijo que este es más caro.
    - Sara dijo que aquel es más barato.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Pero
    gloss: pero
    note: ولی significa «pero» e introduce un contraste.
    target_text: ولی (pero)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Sí
    gloss: sí
    note: آره es la forma coloquial de بله («sí»).
    example_gloss: Sí, es verdad.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima dice
    gloss: Esto es más caro que aquello, pero es mejor.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara responde
    gloss: Sí, pero aquel es más barato.
