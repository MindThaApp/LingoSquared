teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: Ropa y bolsos
    gloss: camisa, zapatos, bolso, pantalón, abrigo
    note: '*کفش* es «zapatos» (una sola palabra para el par).'
    example_gloss:
    - Tengo una camisa.
    - Tengo un par de zapatos.
    - Tengo un bolso.
    - Tengo un pantalón.
    - Tengo un abrigo.
  fa.a2.unit42.lesson01.teach.colours:
    title: Colores
    gloss: blanco, negro, rojo, azul, verde
    note: Los colores son adjetivos y van después del sustantivo.
    example_gloss:
    - Mi camisa es blanca.
    - Mi bolso es negro.
    - Mis zapatos son rojos.
    - Mi pantalón es azul.
    - Mi abrigo es verde.
  fa.a2.unit42.lesson01.teach.size_age:
    title: Grande, pequeño, nuevo, viejo
    gloss: grande, pequeño, nuevo, viejo
    note: '*نو* y *قدیمی* indican lo nuevo o lo viejo que es algo.'
    example_gloss:
    - Mi bolso es grande.
    - Mis zapatos son pequeños.
    - Mi abrigo no es nuevo.
    - Mi camisa es vieja.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'Sustantivo + adjetivo: el sonido de enlace'
    gloss: un bolso rojo; una camisa blanca; zapatos nuevos
    note: 'En persa el adjetivo va después del sustantivo. Una vocal breve de enlace *-e* (el ezafe) los une al hablar: *کیف قرمز* se dice «kif-e qermez». Después de consonante, esta vocal no se escribe.'
  fa.a2.unit42.lesson02.teach.owners:
    title: Poseedores
    gloss: Sara, Nima, quién, de quién es
    note: '*کیه؟* significa «¿quién es?» o «¿de quién es?».'
    example_gloss:
    - ¿De quién es este bolso?
    - ¿De quién son estos zapatos?
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: Sustantivo + poseedor
    gloss: el bolso de Sara; los zapatos de Nima; la camisa del gerente
    note: 'El poseedor va después de la cosa, unido con la misma vocal de enlace *-e*: *کیف سارا* es «kif-e Sara». Como en español («el bolso de Sara»), primero se dice la cosa y después el poseedor, pero en persa no hay preposición «de»: solo se usa el enlace -e.'
  fa.a2.unit42.lesson02.teach.whose:
    title: ¿De quién es?
    gloss: ¿De quién es este bolso? El bolso de Sara.
    note: 'Pregunta *این ... کیه؟* y responde con la cosa y su poseedor. Para decir «es de Nima», añade *است* al nombre: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: Hogar y ropa
    gloss: casa, abrigo, silla, mesa
    note: '*خونه* termina en una *ه* muda; *پالتو* termina en la vocal *و*; *صندلی* termina en *ی*.'
    example_gloss:
    - La casa es grande.
    - El abrigo es negro.
    - La silla está aquí.
    - La mesa está allí.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'Después de una ه muda: ه‌ی'
    gloss: la casa grande; la casa de Nima
    note: 'Después de una *ه* muda, la vocal de enlace se escribe *ی* con un semiespacio: *خونه‌ی بزرگ*, *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: Después de و y ی
    gloss: el abrigo negro; el abrigo de Sara; la silla de Nima
    note: 'Después de *و* la vocal de enlace se escribe *ی*: *پالتوی سیاه*. Después de *ی* se pronuncia «-ye», pero no se escribe nada más: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: Materiales y un sofá
    gloss: de cuero (adj.), de madera, sofá
    note: '*چرمی* significa «de cuero» y *چوبی* «de madera».'
    example_gloss:
    - Mi bolso es de cuero.
    - La mesa es de madera.
    - El sofá está aquí.
  fa.a2.unit42.lesson04.teach.chain1:
    title: Sustantivo + adjetivo + poseedor
    gloss: el bolso rojo de Sara; el abrigo negro de Nima; la casa grande de Nima
    note: 'Puedes seguir añadiendo palabras después del sustantivo, cada una unida con la vocal de enlace. El poseedor va al final: *کیف قرمز سارا* (kif-e qermez-e Sara). El poseedor es el último eslabón.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: Sustantivo + dos adjetivos
    gloss: un bolso de cuero negro; una mesa grande de madera; un sofá nuevo rojo
    note: 'Dos adjetivos siguen el mismo patrón. Se dan ambos órdenes; es algo más habitual poner el material antes del color o del tamaño: *کیف چرمی سیاه*, *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: Un bolso perdido
    gloss: Perdí mi bolso. Mi bolso es rojo, de cuero y pequeño. En el bolso hay un teléfono negro. Mi teléfono negro es viejo. En el bolso también hay unas gafas azules. Las gafas azules son de Nima.
    note: Lee una vez para el bolso y otra vez para las cosas que hay dentro.
  fa.a2.unit42.lesson06.teach.turn01:
    title: El dependiente enseña un abrigo
    gloss: 'Dependiente: Disculpe, ¿este abrigo negro es suyo?'
    note: '*مال شماست* es la forma cortés de decir «es suyo / le pertenece».'
  fa.a2.unit42.lesson06.teach.turn02:
    title: Nima describe su propio abrigo
    gloss: 'Nima: No, mi abrigo es azul. Mi abrigo azul es grande.'
    note: '*پالتوی آبی من*: sustantivo + adjetivo + poseedor.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: El dependiente ofrece un bolso
    gloss: 'Dependiente: No tengo ningún abrigo azul grande. ¿Y este bolso rojo de cuero?'
    note: '*کیف قرمز چرمی*: sustantivo + color + material (*کیف چرمی قرمز* también es correcto).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: Nima dice de quién es
    gloss: 'Nima: Ese bolso es de Sara. El bolso de Sara es rojo.'
    note: '*ساراست* es la forma hablada de *سارا است*.'
