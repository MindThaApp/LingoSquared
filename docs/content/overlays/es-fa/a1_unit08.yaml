teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: Tienda
    gloss: tienda
    note: مغازه es la palabra general para una tienda pequeña o comercio.
    example_gloss: Esta tienda es grande.
  fa.a1.unit08.lesson01.teach.price_word:
    title: Precio
    gloss: precio
    note: قیمت es la palabra general para «precio».
    example_gloss: ¿Cuál es el precio de esto?
  fa.a1.unit08.lesson01.teach.discount_word:
    title: Descuento
    gloss: descuento
    note: تخفیف significa «descuento», una palabra habitual al comprar y regatear en la vida cotidiana de Irán.
    example_gloss: ¿Tienen descuento?
  fa.a1.unit08.lesson01.teach.apple_word:
    title: Manzana
    gloss: manzana
    note: سیب es un producto de ejemplo muy común para practicar precios y cantidades.
    example_gloss: Quiero una manzana.
  fa.a1.unit08.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra de enlace más común y se usa en toda esta unidad.
    target_text: و (y)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Preguntar cuánto cuesta algo
    gloss: ¿Cuánto cuesta esto?
    note: این چنده؟ es la forma coloquial y cotidiana de preguntar un precio; es una contracción de این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Decir un precio por kilo
    gloss: Son 30 tomanes el kilo.
    note: کیلویی سی تومنه indica un precio por kilo con la contracción coloquial en -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: La contracción coloquial en -e (repaso)
    gloss: تومنه es la contracción hablada de uso diario de تومن است.
    note: Es el mismo patrón de contracción que ya viste con palabras del tiempo como آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Pedir un kilo de manzanas
    gloss: Quiero un kilo de manzanas.
    note: یک کیلو سیب می‌خوام usa کیلو (kilo) como unidad de medida.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Pedir medio kilo
    gloss: Quiero medio kilo.
    note: نصف کیلو می‌خوام usa نصف (mitad) en lugar de un kilo entero.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Pedir un descuento
    gloss: ¿Me hace un descuento?
    note: 'تخفیف می‌دید؟ es una pregunta natural y muy común en los bazares y tiendas de Irán: regatear es una parte normal y esperada de las compras, no es de mala educación ni algo raro.'
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: El tendero ofrece un precio más bajo
    gloss: Se lo dejo en 28 tomanes.
    note: برات بیست و هشت تومن حساب می‌کنم ofrece un pequeño descuento sobre el precio original de 30 tomanes.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Decir que pagarás en efectivo
    gloss: Pagaré en efectivo.
    note: نقدی حساب می‌کنم indica la forma de pago con نقدی (en efectivo).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Preguntar si se paga con tarjeta
    gloss: ¿Aceptan tarjeta?
    note: کارت می‌گیرید؟ pregunta si se acepta el pago con tarjeta.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Adelante / por favor (repaso)
    gloss: adelante / por favor
    note: بفرمایید se presentó en la unidad de saludos; aquí el tendero lo usa para invitar al cliente a pasar.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Gracias (repaso)
    gloss: gracias
    note: ممنون se presentó en la unidad de saludos.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: No es molestia (repaso)
    gloss: no es molestia / de nada
    note: قابلی نداره es una forma modesta y común de restar importancia a un agradecimiento; ya apareció en una unidad anterior.
  fa.a1.unit08.lesson06.teach.turn01:
    title: El tendero saluda al cliente
    gloss: El tendero saluda al cliente y lo invita a pasar.
    note: بفرمایید invita al cliente a mirar o a preguntar lo que quiera.
  fa.a1.unit08.lesson06.teach.turn02:
    title: El cliente pregunta el precio
    gloss: El cliente saluda al tendero y pregunta el precio de las manzanas.
    note: این چنده؟ de la lección 2, aplicado a سیب‌ها (las manzanas).
  fa.a1.unit08.lesson06.teach.turn03:
    title: El tendero dice el precio
    gloss: El tendero dice que son 30 tomanes el kilo.
    note: کیلویی سی تومنه de la lección 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: El cliente hace el pedido y pide un descuento
    gloss: El cliente dice que quiere un kilo y pide un descuento.
    note: Combina el patrón de cantidad de la lección 3 con la pregunta del descuento de la lección 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: El tendero acepta bajar el precio
    gloss: El tendero acepta y ofrece 28 tomanes.
    note: باشه (de acuerdo) expresa conformidad antes de decir el precio con descuento.
  fa.a1.unit08.lesson06.teach.turn06:
    title: El cliente da las gracias y paga
    gloss: El cliente da las gracias al tendero y dice que pagará en efectivo.
    note: Combina el vocabulario de pago de la lección 5 con un simple agradecimiento.
  fa.a1.unit08.lesson06.teach.turn07:
    title: El tendero cierra la conversación
    gloss: El tendero resta importancia al agradecimiento y le dice que adelante.
    note: قابلی نداره، بفرمایید cierra la compra con cortesía.
