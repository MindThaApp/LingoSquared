teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: Lugares y antojos para un día de paseo
    gloss: zoológico, barco, parque de atracciones, helado
    note: '*سوار قایق شدن* es «subir a un barco / hacer un paseo en barco».'
    example_gloss:
    - Ayer fuimos al zoológico.
    - Subimos a un barco.
    - Mañana vamos al parque de atracciones.
    - Comimos helado.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'Lo que hicimos: pasado con ـیم'
    gloss: fuimos, vimos, compramos, comimos, sacamos / tomamos, subimos
    note: La terminación de «nosotros» en pasado es *ـیم*. El verbo suele ir al final de la oración.
    example_gloss:
    - Vimos leones y elefantes.
    - Compramos entradas.
    - Sacamos fotos.
    - Subimos a un barco.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: Palabras para ordenar los hechos
    gloss: primero, luego / después, después de eso, al final
    note: '*بعدش* y *بعد* significan ambas «luego, después de eso». *آخرش* es «al final» e introduce el último hecho.'
    example_gloss:
    - Primero compramos las entradas.
    - Luego vimos un león.
    - Después sacamos fotos.
    - Al final comimos helado.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: Contar un día en orden
    gloss: Primero fuimos al zoológico, luego subimos a un barco y al final fuimos al parque de atracciones.
    note: Un relato sigue el orden de los hechos. Pon *اول*, *بعدش* o *بعد*, y *آخرش* al inicio de cada parte, con un verbo en pasado en cada una. Puedes omitir *ما* porque la terminación *ـیم* ya indica «nosotros».
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'Lo que hicieron: pasado con ـن'
    gloss: fueron, vieron, compraron, comieron, llegaron, volvieron
    note: En pasado, «ellos» termina en *ـن* (*رفتن*) y «nosotros» termina en *ـیم* (*رفتیم*). El *ـن* hablado tiene la misma forma que el infinitivo, así que es la oración la que indica quién es.
    example_gloss:
    - Sara y Nima fueron ayer al zoológico.
    - Vieron un león.
    - Compraron entradas.
    - Al final volvieron a casa.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: Tuvo miedo, se rio
    gloss: él/ella tuvo miedo, él/ella se rio, ellos tuvieron miedo, ellos se rieron
    note: '*ترسید* y *خندید* son formas de «él/ella»; *ترسیدن* y *خندیدن* son las formas de «ellos».'
    example_gloss:
    - Nima tuvo miedo.
    - Sara se rio.
    - Sara y Nima se rieron mucho.
    - Tuvieron miedo.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی en un relato
    gloss: Cuando llegaron, compraron entradas. Cuando subieron al barco, Nima tuvo miedo.
    note: En un relato, después de *وقتی* va un verbo en pasado y luego el verbo principal en pasado. La parte con *وقتی* indica el momento y la oración principal dice qué pasó entonces.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: Empezar un relato
    gloss: Sara y Nima fueron ayer al zoológico.
    note: Un relato suele empezar diciendo quién, cuándo y dónde.
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: Lo que estaba en curso
    gloss: íbamos, él/ella iba, ellos estaban comiendo, él/ella estaba sacando fotos
    note: '*داشت* más un verbo con *می‌* indica una acción que estaba en curso. Úsalo para lo que ocurría mientras pasaba otra cosa.'
    example_gloss:
    - Íbamos al zoológico.
    - Sara estaba sacando fotos.
    - Estaban comiendo helado.
    - Yo estaba sacando fotos.
    - El barco avanzaba.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: Dos cosas a la vez
    gloss: Mientras el barco avanzaba, Sara estaba sacando fotos.
    note: La primera parte presenta la escena (*قایق داشت می‌رفت*); la segunda dice qué más estaba pasando (*سارا داشت عکس می‌گرفت*). Usa esta forma solo en afirmativas, no en negativas.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: Lo que ya había pasado
    gloss: él/ella había comprado, habíamos ido, habían llegado, yo había visto
    note: '*بود/بودیم/بودن/بودم* después de la forma en *ـه* del verbo significa «había / habíamos…».'
    example_gloss:
    - Nima había comprado las entradas.
    - Habíamos ido antes.
    - Habían llegado.
    - Yo había visto un león antes.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: Algo que pasó antes
    gloss: Cuando llegamos, Nima ya había comprado las entradas.
    note: El pluscuamperfecto muestra que un hecho pasado ocurrió antes que otro. Los dos hechos son *رسیدیم* (después) y *خریده بود* (antes).
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: Cada año, cuando era niño/niña
    gloss: cada año, yo era niño/niña, mi mamá
    note: '*هر سال* y *وقتی بچه بودم* indican que algo ocurría una y otra vez en el pasado.'
    example_gloss:
    - Cada año íbamos al parque de atracciones.
    - Cuando era niño/niña, íbamos con mi mamá.
    - A mi mamá le gustan los parques de atracciones.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: ¿Alguna vez…?
    gloss: hasta ahora / alguna vez, he ido, no he ido, hemos ido, tú te has subido / has subido
    note: '*تا حالا* pregunta o dice si algo ha ocurrido hasta ahora. En el habla también puedes usar el pasado simple: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - Nunca he ido a un parque de atracciones.
    - ¿Alguna vez te has subido a un barco?
    - Hemos ido al zoológico.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: ¿Qué pasado para qué relato?
    gloss: Fuimos ayer; íbamos todos los años; habíamos ido; hemos ido hasta ahora.
    note: Usa el pasado simple para un hecho terminado, el pasado con *می‌ـ* para una costumbre, *بود* para «había» y *تا حالا* con la forma en *ـه* para la experiencia hasta ahora.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: Preguntar por la experiencia
    gloss: ¿Alguna vez te has subido a un barco? Sí, una vez.
    note: 'Una pregunta corta y una respuesta corta: *یه بار* significa «una vez».'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: Un día de paseo
    gloss: Ayer Sara y Nima fueron al zoológico. Cuando llegaron, Nima ya había comprado las entradas. Primero vieron leones y elefantes. Luego subieron a un barco. Mientras el barco avanzaba, Nima tenía miedo, pero Sara estaba sacando fotos. Después fueron al parque de atracciones y se rieron mucho. Al final comieron helado y volvieron a casa.
    note: Lee una vez para ver el orden de los lugares y otra vez para ver quién hizo qué.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: Nima empieza
    gloss: ¡Sara, ayer lo pasamos muy bien!
    note: Nima abre diciendo cómo fue el día.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: Sara empieza el relato
    gloss: ¡Sí! Primero fuimos al zoológico y vimos leones y elefantes.
    note: '*اول* inicia el relato.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: Nima continúa
    gloss: Luego subimos a un barco. Cuando el barco estaba avanzando, me asusté.
    note: '*بعدش* continúa el orden; *داشت می‌رفت* es el trasfondo.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: Sara añade
    gloss: ¡Pero yo me reí e hice fotos! Después fuimos al parque de atracciones.
    note: '*بعد* hace avanzar la historia.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: Nima termina
    gloss: Al final tomamos helado. Yo nunca antes había ido a un parque de atracciones.
    note: '*نرفته بودم* mira hacia algo anterior.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: Sara propone otra salida
    gloss: ¡Entonces la semana que viene volvemos a ir!
    note: Un plan expresado con el presente simple.
