teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*وقت آزاد* significa «tiempo libre»; literalmente, «tiempo libre/abierto».'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Afición
    gloss: afición
    note: '*سرگرمی* significa «afición» o «pasatiempo».'
    example_gloss: Leer es un pasatiempo.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Leer libros
    gloss: leer libros
    note: '*کتاب خوندن* significa literalmente «lectura de libros»: *کتاب* (libro) se vio antes, *خوندن* (leer) es nuevo aquí.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Me gusta...
    gloss: me gusta
    note: '*دوست دارم* funciona igual con una actividad que con una cosa: *کتاب خوندن دوست دارم* significa «Me gusta leer libros».'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: La música
    gloss: música
    note: '*موسیقی* vuelve a aparecer aquí.'
    example_gloss: Escucho música.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Escucho
    gloss: escucho
    note: '*گوش می‌دم* significa literalmente «doy oído»: es la forma natural de decir «escucho» en farsi.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Película
    gloss: película
    note: '*فیلم* vuelve a aparecer aquí.'
    example_gloss: Veo películas.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Veo / miro
    gloss: veo / miro
    note: '*می‌بینم* es el presente del verbo cuyo pasado (*دیدم*, «vi») se vio antes.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Deporte / ejercicio
    gloss: deporte / ejercicio
    note: '*ورزش* significa tanto «deporte» como «ejercicio» en general.'
    example_gloss: Hago ejercicio.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Hago
    gloss: hago
    note: '*می‌کنم* es el verbo general «hago» que se usa en verbos compuestos como *ورزش می‌کنم* (hago deporte).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Fútbol
    gloss: fútbol
    note: '*فوتبال* significa «fútbol».'
    example_gloss: Me gusta el fútbol.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Juego al fútbol
    gloss: Juego al fútbol
    note: '*بازی* significa «juego»; *فوتبال بازی می‌کنم* es literalmente «hago juego de fútbol», es decir, «juego al fútbol».'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Semana
    gloss: semana
    note: '*هفته* significa «semana».'
    example_gloss: Hago ejercicio cada semana.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: Cada semana
    gloss: cada semana
    note: '*هر* se combina de la misma manera con *هفته* para formar *هر هفته* (cada semana).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: A veces
    gloss: a veces
    note: '*گاهی* significa «a veces».'
    example_gloss: A veces leo libros.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: ¿Qué haces en tu tiempo libre?
    gloss: ¿Qué haces en tu tiempo libre?
    note: '*چیکار می‌کنی* se vio antes; aquí se reutiliza para preguntar específicamente por el tiempo libre.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, presentado como personaje en la Unidad 11, vuelve a aparecer aquí.'
    example_gloss: A Nima le gusta leer libros.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: Unos pocos / cuántos
    gloss: unos pocos / cuántos
    note: '*چند* (cuántos/varios) se combina con el contador *تا* para significar «unos cuantos» o «cuántos» ante un sustantivo contable.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: Él/ella lee
    gloss: él/ella lee
    note: '*می‌خونه* es la forma coloquial de tercera persona de *خوندن* (leer).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: También
    gloss: también
    note: '*هم* significa «también», y ya se usó así en la Unidad 11.'
    example_gloss: Nima también juega al fútbol.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: Él/ella hace
    gloss: él/ella hace
    note: '*می‌کنه* es la forma coloquial de tercera persona de *می‌کنم* (hago).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Lectura: el tiempo libre de Nima'
    gloss: A Nima le gusta leer libros. Cada semana lee unos cuantos libros. A veces también juega al fútbol.
    note: '*چند تا* antes de *کتاب* significa «unos cuantos libros»; *می‌خونه* y *می‌کنه* son las formas coloquiales de tercera persona que se usan para hablar de otra persona.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, presentada como personaje en la Unidad 14, vuelve a aparecer aquí.'
    example_gloss: A Sara le gusta ver películas.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Ver / mirar
    gloss: ver / mirar
    note: '*دیدن* es el infinitivo del verbo cuyo presente (*می‌بینم*) se enseñó en la lección 2 y cuyo pasado (*دیدم*) se enseñó en la Unidad 13.'
    example_gloss: Me gusta ver películas.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Voy al cine
    gloss: Voy al cine
    note: '*سینما* (cine) se vio antes; *می‌رم* (voy) se vio antes en *می‌رم سر کار* (voy al trabajo).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Qué
    gloss: qué
    note: '*چی* significa «qué», y ya se usó así en *تو چی؟* (¿y tú?) de la Unidad 14.'
    example_gloss: ¿Y tú?
  fa.a1.unit24.lesson06.teach.va_word:
    title: Y
    gloss: y
    note: '*و* significa «y», y ya se usó así en la Unidad 14.'
    example_gloss: Me gusta leer y me gusta el fútbol.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: ¡Qué bien!
    gloss: ¡qué bien!
    note: '*چه خوب!* se vio antes: es una reacción positiva muy común, como «¡qué bien!».'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, ¿qué haces en tu tiempo libre?'
    gloss: Sara, ¿qué haces en tu tiempo libre?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Me gusta ver películas...'
    gloss: Me gusta ver películas. Voy al cine cada semana. ¿Y tú?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Me gusta leer libros...'
    gloss: Me gusta leer libros. A veces también juego al fútbol.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: ¡Qué bien!'
    gloss: ¡Qué bien!
