course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: nombrar el concepto de afición/tiempo libre, cuatro actividades cotidianas (leer, escuchar música, ver películas, deporte/fútbol), hablar de con qué frecuencia las haces, preguntar a alguien qué hace en su tiempo libre, un texto breve sobre las aficiones de نیما y un diálogo final entre نیما y سارا.'
