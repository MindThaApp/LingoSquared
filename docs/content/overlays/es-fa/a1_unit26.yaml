course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: nombrar mascotas y animales comunes (perro, gato, pájaro, pez), preguntar «¿Tienes mascota?», decir el nombre de una mascota y darle de comer, describir su color y tamaño, un texto breve sobre la gata de سارا, پشمک, y un diálogo final entre سارا y نیما admirando a پشمک.'
