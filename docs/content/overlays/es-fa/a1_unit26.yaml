teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: yo
    gloss: yo
    note: '*من*, ya bien conocido, vuelve a aparecer aquí para hablar de tu propia mascota.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: Él / ella
    gloss: él / ella
    note: '*او* vuelve a aparecer aquí.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: Tengo / tiene / no tengo
    gloss: tengo / tiene / no tengo
    note: '*دارم*/*داره* funcionan igual con una mascota. *ندارم* (no tengo) y *نداره* (no tiene) son las formas negativas correspondientes; ambas ya se usaron juntas en el diálogo familiar de la Unidad 4.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Animal
    gloss: animal
    note: '*حیوان* significa «animal».'
    example_gloss: Un gato es un animal.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Mascota
    gloss: mascota
    note: '*حیوان خونگی* significa literalmente «animal de casa»: la forma estándar de decir «mascota».'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Perro
    gloss: perro
    note: '*سگ* significa «perro».'
    example_gloss: Tengo un perro.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Gato
    gloss: gato
    note: '*گربه* significa «gato».'
    example_gloss: Él tiene un gato.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Pájaro
    gloss: pájaro
    note: '*پرنده* significa «pájaro».'
    example_gloss: Ella tiene un pájaro.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Pescado
    gloss: pescado
    note: '*ماهی* significa «pez» o «pescado».'
    example_gloss: Tengo un pez.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Tienes
    gloss: tienes
    note: '*داری* vuelve a aparecer aquí, en la misma forma informal de segunda persona.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: ¿Tienes una mascota?
    gloss: ¿tienes mascota?
    note: '*حیوان خونگی داری؟* combina *حیوان خونگی* de la lección 1 con *داری*: la forma natural de preguntar a alguien si tiene mascota.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Sí
    gloss: sí
    note: '*آره* es la palabra coloquial habitual para «sí».'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Nombre
    gloss: nombre
    note: '*اسم* funciona igual para el nombre de una mascota.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: ¿Cómo se llama?
    gloss: ¿cómo se llama?
    note: '*اسمش چیه؟* combina el sufijo posesivo *-ش* (ya visto en *قدش*/*موهاش* en la Unidad 25) con *چیه؟* de la Unidad 2: «¿cómo se llama?».'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: La comida
    gloss: comida
    note: '*غذا* es la misma palabra que se usa para la comida de las mascotas.'
    example_gloss: Me gusta la comida.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Doy de comer
    gloss: doy de comer
    note: '*می‌دم* (literalmente «doy»), ya visto en *گوش می‌دم* de la Unidad 24, es el verbo natural para dar de comer a una mascota junto con *غذا*.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Mi perro
    gloss: mi perro
    note: '*سگم* combina *سگ* con el sufijo posesivo *-م*: «mi perro», el mismo patrón fusionado que *اسمم* de la Unidad 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Doy de comer a mi perro.
    gloss: Doy de comer a mi perro.
    note: '*سگم رو غذا می‌دم* usa *رو* (la marca de objeto, ya vista en *قهوه رو بیشتر دوست دارم* de la Unidad 14) para marcar *سگم* como quien recibe la comida.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: ¿De qué color es?
    gloss: ¿de qué color es?
    note: '*چه رنگیه؟* funciona igual para describir el color de una mascota.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Blanco
    gloss: blanco
    note: '*سفید* vuelve a aparecer aquí para el color de una mascota. *گربه‌ی* es la forma con ezafe de *گربه* ante un poseedor, como en *گربه‌ی من* (mi gato), el mismo patrón que *خونه‌ی من* de la Unidad 19, que se usa con sustantivos terminados en vocal en lugar de un sufijo fusionado.'
    example_gloss: Mi gato es blanco.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Pequeño
    gloss: pequeño
    note: '*کوچیک* vuelve a aparecer aquí para el tamaño de una mascota.'
    example_gloss: Mi pez es pequeño.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Grande
    gloss: grande
    note: '*بزرگ* vuelve a aparecer aquí para el tamaño de una mascota.'
    example_gloss: Mi perro es grande.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, presentada como personaje en la Unidad 2, vuelve a aparecer aquí.'
    example_gloss: Sara tiene un gato.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Uno / un
    gloss: uno / un, una
    note: '*یک* se usa aquí como artículo indefinido: «un/una».'
  fa.a1.unit26.lesson05.teach.va_review:
    title: Y
    gloss: y
    note: '*و* significa «y», y ya se usó así en las Unidades 14, 24 y 25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Pashmak
    gloss: Pashmak
    note: '*پشمک* (literalmente «algodón de azúcar») es un nombre de mascota muy común en Irán: el nombre de la gata de Sara.'
    example_gloss: El gato de Sara se llama Pashmak.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: Cada día
    gloss: cada día
    note: '*هر روز* funciona igual aquí para dar de comer a una mascota.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: Él/ella da / da de comer
    gloss: él/ella da / da de comer
    note: '*می‌ده* es la forma coloquial de tercera persona del mismo verbo que *می‌دم* de la lección 3 (doy/doy de comer).'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Lectura: el gato de Sara'
    gloss: Sara tiene un gato. Se llama Pashmak. Pashmak es blanco y pequeño. Sara da de comer a Pashmak todos los días.
    note: 'Esta lectura reutiliza todas las construcciones de las lecciones 1 a 4: casi no hay vocabulario nuevo, solo practicas reconocerlo en un texto continuo.'
  fa.a1.unit26.lesson06.teach.in_word:
    title: Esto
    gloss: este
    note: '*این* significa «este/esta».'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: ¿De quién es?
    gloss: ¿de quién es?
    note: '*کیه* se usa aquí para preguntar de quién es una mascota.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: Es mío
    gloss: es mío
    note: '*منه* es la contracción coloquial de *من است*: «es mío/mía». *گربه‌ی منه* significa «es mi gato».'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: Es mi perro
    gloss: es mi perro
    note: '*سگمه* combina *سگم* (mi perro), de la lección 3, con la misma terminación *-ه* («es») que *منه*: «es mi perro».'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Bonito
    gloss: bonito, lindo
    note: '*خوشگل* significa «lindo/a» o «bonito/a». *خیلی* significa «muy».'
    example_gloss: El gato de Sara es muy lindo.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Gracias
    gloss: gracias
    note: '*ممنون* vuelve a aparecer aquí como una frase final natural.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima: ¿De quién es este gato?'
    gloss: ¿De quién es este gato?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara: Es mi gato. Se llama Pashmak.'
    gloss: Es mi gato. Se llama Pashmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima: ¿De qué color es?'
    gloss: ¿De qué color es?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara: Es blanco y pequeño.'
    gloss: Es blanco y pequeño.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima: ¡Qué lindo!'
    gloss: ¡Qué lindo!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara: ¡Gracias!'
    gloss: ¡Gracias!
