course:
  title: Persa A1
  description: Persa iraní para principiantes, centrado en leer la escritura, entender el habla cotidiana y desenvolverte con cortesía en conversaciones prácticas.
units:
  fa.a1.unit03.numbers:
    title: Los números
lessons:
  fa.a1.unit03.lesson01.zero_to_ten:
    title: Del cero al diez
  fa.a1.unit03.lesson02.eleven_to_ninety_nine:
    title: Del once al noventa y nueve
  fa.a1.unit03.lesson03.phone_numbers:
    title: Números de teléfono
  fa.a1.unit03.lesson04.ages_and_quantities:
    title: Edades y cantidades
  fa.a1.unit03.lesson05.prices:
    title: Precios en tomanes
  fa.a1.unit03.lesson06.dialogue_phone_numbers:
