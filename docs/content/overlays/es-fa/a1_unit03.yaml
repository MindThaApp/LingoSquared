  fa.a1.unit03.lesson03.exercise01.shomare_meaning:
    instruction: Elige el significado de شماره.
    correct_option: número (de identificación, p. ej., de teléfono o de casa)
    distractors:
    - un precio (cuánto cuesta)
    - una edad (cuántos años)
    - una cantidad (cuántos)
    accepted_answers:
    - value: número (de identificación, p. ej., de teléfono o de casa)
      status: correct
    feedback: شماره se usa para un número de identificación, como el de teléfono o el de una casa.
  fa.a1.unit03.lesson03.exercise02.telefon_meaning:
    instruction: Elige el significado de تلفن.
    correct_option: teléfono
    distractors:
    - número
    - dirección
    - mensaje
    accepted_answers:
    - value: teléfono
      status: correct
    feedback: تلفن significa «teléfono».
  fa.a1.unit03.lesson03.exercise03.recognize_ask_reading:
    instruction: ¿Qué se pregunta en esta pregunta?
    correct_option: el número de teléfono de quien escucha
    distractors:
