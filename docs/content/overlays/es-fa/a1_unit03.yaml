teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Número
    gloss: número
    note: عدد es la palabra general para «número».
    example_gloss: Esto es un número.
  fa.a1.unit03.lesson01.teach.zero:
    title: Cero
    gloss: 0 — cero
    note: صفر se usa para el cero, también como dígito dentro de un número largo, como un número de teléfono.
    example_gloss: El cero es un número.
  fa.a1.unit03.lesson01.teach.one:
    title: Uno
    gloss: 1 — uno
    note: یک significa «uno».
    example_gloss: Tengo un libro.
  fa.a1.unit03.lesson01.teach.two:
    title: Dos
    gloss: 2 — dos
    note: دو significa «dos».
    example_gloss: Tengo dos manzanas.
  fa.a1.unit03.lesson01.teach.three:
    title: Tres
    gloss: 3 — tres
    note: سه significa «tres».
    example_gloss: Tiene tres hermanos.
  fa.a1.unit03.lesson01.teach.four:
    title: Cuatro
    gloss: 4 — cuatro
    note: چهار significa «cuatro».
    example_gloss: Son las cuatro.
  fa.a1.unit03.lesson01.teach.five:
    title: Cinco
    gloss: 5 — cinco
    note: پنج significa «cinco».
    example_gloss: Espera cinco minutos.
  fa.a1.unit03.lesson01.teach.six:
    title: Seis
    gloss: 6 — seis
    note: شش significa «seis».
    example_gloss: Hay seis sillas.
  fa.a1.unit03.lesson01.teach.seven:
    title: Siete
    gloss: 7 — siete
    note: هفت significa «siete».
    example_gloss: Una semana tiene siete días.
  fa.a1.unit03.lesson01.teach.eight:
    title: Ocho
    gloss: 8 — ocho
    note: هشت significa «ocho».
    example_gloss: Nos vemos a las ocho.
  fa.a1.unit03.lesson01.teach.nine:
    title: Nueve
    gloss: 9 — nueve
    note: نه significa «nueve». También es la palabra normal para «no»; el contexto (oírla dentro de una cuenta o de un número) indica cuál de los dos significados es.
    example_gloss: Aquí hay nueve estudiantes.
  fa.a1.unit03.lesson01.teach.ten:
    title: Diez
    gloss: 10 — diez
    note: ده significa «diez».
    example_gloss: Tengo diez dedos.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Once
    gloss: 11 — once
    note: یازده significa «once».
    example_gloss: Tengo clase a las once.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Doce
    gloss: 12 — doce
    note: دوازده significa «doce».
    example_gloss: Un año tiene doce meses.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Trece
    gloss: 13 — trece
    note: سیزده significa «trece».
    example_gloss: Tiene trece años.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Catorce
    gloss: 14 — catorce
    note: چهارده significa «catorce».
    example_gloss: Vendré dentro de catorce días.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Quince
    gloss: 15 — quince
    note: پانزده significa «quince».
    example_gloss: Tiene quince libros.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Dieciséis
    gloss: 16 — dieciséis
    note: شانزده significa «dieciséis»; no se deduce de شش (seis) + ده (diez), así que conviene aprenderlo como una palabra aparte.
    example_gloss: Tiene dieciséis años.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Diecisiete
    gloss: 17 — diecisiete
    note: هفده significa «diecisiete».
    example_gloss: Vinieron diecisiete personas.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Dieciocho
    gloss: 18 — dieciocho
    note: هجده significa «dieciocho».
    example_gloss: Tiene dieciocho años.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Diecinueve
    gloss: 19 — diecinueve
    note: نوزده significa «diecinueve».
    example_gloss: Faltan diecinueve días.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Veinte
    gloss: 20 — veinte
    note: بیست significa «veinte».
    example_gloss: Tengo veinte libros.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Treinta
    gloss: 30 — treinta
    note: سی significa «treinta».
    example_gloss: Este mes tiene treinta días.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: De cuarenta a noventa
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود son el resto de las decenas.
    example_gloss:
    - Tiene cuarenta años.
    - Hay cincuenta sillas.
    - Sesenta minutos son una hora.
    - Este libro tiene setenta páginas.
    - Tiene ochenta libros.
    - Tiene noventa años.
  fa.a1.unit03.lesson02.teach.combining:
    title: Combinar decenas y unidades
    gloss: veinticinco
    note: 'بیست و پنج significa literalmente «veinte y cinco»: palabra de la decena, و y palabra de la unidad.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Número (de algo)
    gloss: número
    note: شماره se usa para un número de identificación, como el de teléfono o el de una casa; es distinto del sentido general de «número» de عدد.
    example_gloss: Este es mi número de teléfono.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Teléfono
    gloss: teléfono
    note: تلفن sirve para los teléfonos en general, incluidos los móviles.
    example_gloss: No tengo teléfono.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Pedir un número de teléfono
    gloss: ¿Cuál es tu número de teléfono?
    note: شماره تلفنتون چنده؟ es la forma cortés y habitual de pedir un número de teléfono. Leer un número dígito a dígito siempre se entiende y es lo más seguro para empezar; agrupar los dígitos también es normal en el habla real, pero esta lección practica primero la forma más sencilla, dígito a dígito.
  fa.a1.unit03.lesson03.teach.chande:
    title: ¿Cuánto es? / ¿Qué número es?
    gloss: ¿cuál es? / ¿cuánto es?
    note: چنده؟ es la contracción de چند است y pregunta por un número, una cantidad o un precio, según el contexto.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Leer un número dígito a dígito
    gloss: cero, nueve, uno, dos, tres, cuatro, cinco, seis, siete, ocho, ocho
    note: Esta lección practica la lectura de números dígito a dígito. Un número de móvil iraní real tiene 11 dígitos y empieza por 0, por ejemplo 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Año
    gloss: año
    note: سال se usa tanto para los años del calendario como para decir la edad de alguien.
    example_gloss: Tengo veinte años.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Yo (repaso)
    gloss: yo
    note: Un breve recordatorio de من, necesario aquí para decir tu propia edad en una oración completa.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Preguntar la edad a alguien (informal)
    gloss: ¿Qué edad tienes?
    note: چند سالته؟ es la forma informal en singular; چند سالتونه؟ es la equivalente cortés.
  fa.a1.unit03.lesson04.teach.salame:
    title: Decir tu edad
    gloss: Tengo 25 años.
    note: سالمه añade directamente a سال la terminación posesiva ـم («mi») y después la cópula coloquial ـه («es»); literalmente, «mi-año-es».
  fa.a1.unit03.lesson04.teach.ta:
    title: Clasificador de conteo
    gloss: (palabra para contar, sin equivalente directo en español)
    note: 'تا es el clasificador de uso general para contar la mayoría de los objetos: número + تا + sustantivo.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Manzana
    gloss: manzana
    note: سیب significa «manzana».
    example_gloss: Me gustan las manzanas.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Libro
    gloss: libro
    note: کتاب significa «libro».
    example_gloss: Este es un buen libro.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Pedir una cantidad
    gloss: Quiero dos manzanas.
    note: دو تا سیب می‌خوام coloca la cantidad contada antes del sustantivo, como es habitual con تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Precio
    gloss: precio
    note: قیمت es la palabra general para «precio».
    example_gloss: ¿Cuál es el precio de esto?
  fa.a1.unit03.lesson05.teach.toman:
    title: Tomán
    gloss: tomán (moneda iraní, uso cotidiano)
    note: La moneda oficial de Irán es el rial, pero los precios en el habla cotidiana casi siempre se dan en tomanes (1 tomán = 10 riales).
    example_gloss: Esto cuesta diez mil tomanes.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Mil
    gloss: mil
    note: هزار significa «mil»; los precios suelen decirse en miles de tomanes.
    example_gloss: Tengo mil tomanes.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Pregunta un precio
    gloss: ¿Cuánto cuesta esto?
    note: این چنده؟ es la forma normal de preguntar el precio de algo que tienes delante.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Di un precio
    gloss: Son 30 000 tomanes.
    note: تومنه es la contracción de تومن است; el patrón completo es número + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara propone practicar juntas
    gloss: Sara dice que quiere que practiquen farsi juntas y le pide a Mina su número de teléfono.
    note: باهم significa «juntos»; می‌خوام ... تمرین کنیم significa «quiero que practiquemos». Solo تمرین کنیم, como pregunta, también puede significar «¿practicamos?».
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina da su número
    gloss: Mina acepta y dice su número de 11 dígitos, dígito por dígito.
    note: شماره‌ام es la forma contraída de شماره من; هشته es la contracción de هشت است y cierra la cuenta.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara comprueba que ha anotado bien el número
    gloss: Sara le pide a Mina que espere mientras escribe el número y luego lo repite para confirmarlo.
    note: درسته؟ («¿es correcto?») es una forma habitual de comprobar un número o un dato que acabas de oír.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina confirma y pregunta a su vez
    gloss: Mina confirma que es correcto y le pide a Sara su número.
    note: آره es un «sí» informal, más coloquial que بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara da su número
    gloss: Sara dice su propio número de 11 dígitos, dígito por dígito.
    note: یکه es la contracción de یک است y termina la cuenta igual que هشته terminó el número de Mina.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina acepta llamar
    gloss: Mina dice que llamará a Sara mañana.
    note: زنگ می‌زنم بهت significa «te llamo»; literalmente, «golpeo el timbre hacia ti».
