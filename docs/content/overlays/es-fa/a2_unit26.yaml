teaching:
  fa.a2.unit26.lesson04.teach.arrived:
    title: Él o ella llegó
    gloss: él/ella llegó
    note: '*رسید* es la tercera persona del pasado de *رسیدن*: *نیما رسید* = Nima llegó. Compara con *رسیدم* = llegué.'
    example_gloss:
    - Cuando Nima llegó, la tienda ya había cerrado.
  fa.a2.unit26.lesson01.teach.time_words:
    title: Marcadores de tiempo
    gloss: cuando, para cuando, antes/ya, ya no/ya, todavía/aún, recién
    note: '*قبلا* y *دیگه* suelen reforzar que el hecho ya estaba completo; *هنوز* con un verbo negativo significa todavía no.'
    example_gloss:
    - Cuando llegué, el tren se había ido.
    - Para cuando llegué, la tienda había cerrado.
    - Ya había comprado un billete.
    - El tren ya se había ido.
    - Todavía no había comido.
    - Acababa de llegar.
  fa.a2.unit26.lesson01.teach.travel:
    title: Palabras de viaje
    gloss: tren, billete, estación, llegué, tarde
    note: Palabras básicas para trenes perdidos y llegadas tardías.
    example_gloss:
    - El tren se había ido.
    - Había comprado un billete.
    - Llegué a la estación.
    - Llegué tarde.
  fa.a2.unit26.lesson01.teach.places_items:
    title: Lugares y objetos perdidos
    gloss: tienda, casa, llaves, comida
    note: Palabras básicas para las situaciones de la unidad.
    example_gloss:
    - La tienda había cerrado.
    - Volví a casa.
    - Había dejado las llaves en casa.
    - Había comido.
  fa.a2.unit26.lesson01.teach.grammar_shape:
    title: Forma del pluscuamperfecto
    gloss: participio pasado + pasado de بودن
    note: '*رفته بودم* es literalmente el participio *رفته* más *بودم*. Sitúa la acción de ir antes de otro punto del pasado.'
  fa.a2.unit26.lesson02.teach.actions:
    title: Participios útiles
    gloss: comprado, comido, cerrado, dejado olvidado, volví
    note: Estas formas se combinan con *بودم / بود / بودن*.
    example_gloss:
    - Había comprado un billete.
    - Había comido.
    - La tienda había cerrado.
    - Había dejado las llaves en casa.
    - Volví a casa.
  fa.a2.unit26.lesson02.teach.people_forms:
    title: Personas y conectores
    gloss: yo, tú, ellos, Nima, Sara, marca de objeto directo, a, y, pero, también
    note: Nima y Sara son amigos ya conocidos.
    example_gloss:
    - Llegué tarde.
    - Habías comprado un billete.
    - Habían comido.
    - Nima llegó a la estación.
    - Sara estaba en casa.
  fa.a2.unit26.lesson02.teach.grammar_endings:
    title: Terminaciones habladas
    gloss: yo/tú/él o ella/nosotros/ustedes/ellos habíamos ido
    note: En el habla informal, los plurales usan *بودین* y *بودن*.
  fa.a2.unit26.lesson03.teach.contrast_note:
    title: Secuencia frente a hecho anterior
    gloss: pasado simple frente a pluscuamperfecto
    note: '*رسیدم و قطار رفت* narra dos hechos en secuencia. *وقتی رسیدم، قطار رفته بود* marca la salida del tren como anterior.'
  fa.a2.unit26.lesson03.teach.perfect_contrast:
    title: Pretérito perfecto frente a pluscuamperfecto
    gloss: رفته‌م frente a رفته بودم
    note: '*رفته‌م* conecta un hecho pasado con el presente; *رفته بودم* lo sitúa antes de otro punto del pasado.'
  fa.a2.unit26.lesson05.teach.reading:
    title: Nima perdió el tren
    gloss: Nima llegó tarde a la estación. Cuando llegó, el tren se había ido. Ya había comprado un billete, pero había dejado las llaves en casa y había vuelto por ellas.
    note: Fíjate en qué hechos ocurrieron antes de la llegada a la estación.
  fa.a2.unit26.lesson06.teach.line1:
    title: Sara pregunta por qué
    gloss: ¿Por qué llegaste tarde?
    note: Sara pide una explicación.
  fa.a2.unit26.lesson06.teach.line2:
    title: Nima explica
    gloss: Cuando llegué, el tren se había ido.
    note: La salida del tren es anterior.
  fa.a2.unit26.lesson06.teach.line3:
    title: Sara pregunta por el billete
    gloss: ¿Habías comprado un billete?
    note: Una pregunta en pretérito pluscuamperfecto.
  fa.a2.unit26.lesson06.teach.line4:
    title: Nima explica el retraso
    gloss: Sí, pero me había dejado las llaves en casa y volví.
    note: Las llaves se quedaron olvidadas antes de que él regresara.
  fa.a2.unit26.lesson06.teach.line5:
    title: Sara pregunta qué pasó después
    gloss: ¿Qué pasó después?
    note: Una pregunta natural y coloquial para seguir la conversación.
  fa.a2.unit26.lesson06.teach.line6:
    title: La tienda estaba cerrada
    gloss: Cuando llegué, la tienda también había cerrado.
    note: El cierre ocurrió antes de la llegada.
