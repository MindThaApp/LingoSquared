teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: Pedidos y reservas
    gloss: pedido, habitación, reserva, listo
    note: '*سفارش دادن* es «pedir»; *رزرو کردن* es «reservar».'
    example_gloss:
    - El pedido está aquí.
    - La habitación está aquí.
    - La reserva está aquí.
    - La habitación está lista.
  fa.a2.unit44.lesson01.teach.neg:
    title: Todavía no
    gloss: todavía no, no ha llegado, no di, no hice
    note: '*هنوز* con un verbo negativo significa «todavía no».'
    example_gloss:
    - Mi pedido todavía no ha llegado.
    - Todavía no he pedido.
    - Todavía no he reservado.
    - La habitación todavía no está lista.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + negación = todavía no
    gloss: Mi pedido todavía no ha llegado; todavía no he pedido; la habitación todavía no está lista
    note: 'Pon *هنوز* antes de un verbo negativo para decir que algo todavía no ha pasado. Sirven tanto el pretérito perfecto (*نیومده*) como el pasado simple (*ندادم*). Con un verbo afirmativo, *هنوز* significa «todavía»: *اتاق هنوز اینجاست* (la habitación todavía está aquí).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: Citas
    gloss: cita (hueco de tiempo), médico, libre, trabajo
    note: '*وقت* es una cita o un hueco de tiempo libre.'
    example_gloss:
    - La cita del médico está aquí.
    - El médico está aquí.
    - Este hueco está libre.
  fa.a2.unit44.lesson02.teach.dige:
    title: Ya no
    gloss: ya no, no quiero, no (trabaja)
    note: '*دیگه* con un verbo negativo significa «ya no».'
    example_gloss:
    - Ya no lo quiero.
    - El médico ya no trabaja aquí.
    - Este hueco ya no está libre.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + negación = ya no
    gloss: Ya no quiero café; el médico ya no trabaja aquí; este hueco ya no está libre
    note: Pon *دیگه* antes de un verbo negativo para decir que algo antes era verdad, pero ahora ya no lo es. *دیگه* también significa «otro» en otras frases, pero con un verbo negativo significa «ya no».
  fa.a2.unit44.lesson03.teach.hich_words:
    title: Nada, nadie, ningún...
    gloss: nada, nadie, ningún
    note: '*هیچ* con un verbo negativo significa «ningún / ninguno / nada».'
    example_gloss:
    - No quiero nada.
    - No hay nadie aquí.
    - Ninguna mesa está libre.
    - La mesa está aquí.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + verbo negativo
    gloss: No quiero nada; no vino nadie; ninguna mesa está libre; ninguna habitación está lista
    note: 'El persa usa *هیچ* junto con un verbo negativo, como el español en «no quiero nada»: *هیچی نمی‌خوام*. Con un sustantivo, se añade *ی*: *هیچ میزی*, *هیچ اتاقی*. En persa hay dos elementos negativos (*هیچ* y el verbo), igual que en «no vino nadie».'
  fa.a2.unit44.lesson04.teach.answers:
    title: Respuestas cortas
    gloss: ¿Ya pidieron? No, todavía no. ¿Quieren café? No, ya no. ¿Quieren algo? No, nada.
    note: 'Para corregir un error rápidamente, empieza con *نه* y luego una palabra corta: *هنوز نه*, *دیگه نه*, *هیچی*. Después puedes añadir la frase completa.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: Comprobar y corregir
    gloss: es correcto, solo, agua
    note: '*درسته؟* pregunta «¿es correcto?».'
    example_gloss:
    - Dos cafés, ¿es correcto?
    - Solo quiero agua.
  fa.a2.unit44.lesson05.teach.reading:
    title: Un problema con la reserva
    gloss: 'Nima reservó una habitación para dos noches. Hoy fue al hotel, pero la habitación todavía no estaba lista. El empleado dijo: «No hay ninguna habitación libre». Nima dijo: «Entonces ya no quiero este hotel».'
    note: Lee una vez para entender lo que pasó y otra vez fijándote en *هنوز*, *هیچ* y *دیگه*.
  fa.a2.unit44.lesson06.teach.turn01:
    title: El camarero trae un pedido
    gloss: 'Camarero: Disculpe, su pedido está listo. Dos cafés, ¿correcto?'
    note: '*درسته؟* pide confirmación.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'Nima corrige: todavía no'
    gloss: 'Nima: No, todavía no he pedido.'
    note: '*هنوز ... ندادم* significa «todavía no».'
  fa.a2.unit44.lesson06.teach.turn03:
    title: El camarero lo entiende
    gloss: 'Camarero: Entonces estos cafés no son suyos.'
    note: '*مال شما نیست* es la forma negativa de *مال شماست*.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: Nima corrige otra vez
    gloss: 'Nima: Hoy ya tomé café, así que ya no quiero más café. No quiero nada, solo agua.'
    note: '*دیگه* y *هیچی* se usan ambos con un verbo en forma negativa.'
