teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: Palabras para dar motivos
    gloss: lluvia, tráfico, trabajo, enfermo, ayer, hoy
    note: '*بارون* es la forma hablada de «lluvia». Son los motivos cotidianos de las excusas y los cambios de planes.'
    example_gloss:
    - Ayer estuvo lluvioso.
    - Hoy hay tráfico.
    - Hoy tengo trabajo.
    - Ayer tuve trabajo.
    - Ayer estuve enfermo.
  fa.a2.unit34.lesson01.teach.past_actions:
    title: Resultados
    gloss: llovió, no vine, no vengo, llegué tarde
    note: 'Estas formas breves son los resultados que unirás a un motivo (pasado: *نیومدم*; presente: *نمیام*). *نیومدم* es la forma negativa de *اومدم* (vine).'
    example_gloss:
    - Ayer llovió.
    - Ayer no vine.
    - Hoy no vengo.
    - Hoy llegué tarde.
  fa.a2.unit34.lesson01.teach.connectors:
    title: Tres conectores
    gloss: porque, por eso, por (causa de)
    note: Tres maneras de unir un motivo y un resultado. *چون* y *به خاطر* introducen el motivo; *برای همین* introduce el resultado.
    example_gloss:
    - Como llovió, no vine.
    - Llovió, por eso no vine.
    - No vine por la lluvia.
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: Causas del clima
    gloss: calor, frío
    note: Usa estos sustantivos del clima después de *به خاطر* para dar un motivo.
    example_gloss:
    - Me enfermé por el calor.
    - Me enfermé por el frío.
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: Causas cotidianas
    gloss: cansancio, sueño, horas extra, proyecto
    note: Estos sustantivos dan motivos comunes relacionados con el cansancio y el trabajo.
    example_gloss:
    - Llegué tarde por el cansancio.
    - Llegué tarde por el sueño.
    - Hice horas extra por el proyecto.
  fa.a2.unit34.lesson01.teach.chon:
    title: چون introduce el motivo
    gloss: Como llovió, no vine.
    note: '*چون* + una oración completa (con su propio verbo) da el motivo, y el resultado va después de la coma: *چون بارون اومد، نیومدم*.'
  fa.a2.unit34.lesson01.teach.baraye_hamin:
    title: برای همین introduce el resultado
    gloss: Llovió, por eso no vine.
    note: 'Di primero el motivo como una oración independiente y luego *برای همین* + el resultado: *بارون اومد، برای همین نیومدم*. Significa «por eso».'
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: Excusas y cambios de planes
    gloss: se me averió el coche, no fui a trabajar, no pude venir, cambiamos nuestra cita
    note: '*قرار* es una cita o un plan acordado. *سر کار نرفتم* = «no fui a trabajar». *نتونستم بیام* = «no pude venir».'
    example_gloss:
    - Se me averió el coche.
    - Ayer no fui a trabajar.
    - Hoy no pude venir.
    - Cambiamos nuestra cita.
  fa.a2.unit34.lesson02.teach.khater:
    title: به خاطر + sustantivo
    gloss: No vine por la lluvia.
    note: '*به خاطر* va seguido de un sustantivo, sin verbo propio: *به خاطر بارون*, *به خاطر ترافیک*, *به خاطر کار*. El resto de la oración da el resultado: *به خاطر ترافیک دیر رسیدم*.'
  fa.a2.unit34.lesson02.teach.khater_vs_chon:
    title: El mismo significado, dos formas
    gloss: por el tráfico = porque había tráfico
    note: '*به خاطر ترافیک* y *چون ترافیک بود* dan el mismo motivo. Usa *به خاطر* cuando el motivo es solo un sustantivo y *چون* cuando dices una oración completa.'
  fa.a2.unit34.lesson03.teach.order:
    title: Primero el motivo, después el resultado
    gloss: Como tenía trabajo, no vine / Tenía trabajo, por eso no vine
    note: Con *چون*, la oración del motivo abre la frase y el resultado la cierra. Con *برای همین*, el motivo es una oración independiente al principio y el resultado viene después de *برای همین*. En ambos casos, el motivo se dice antes que el resultado.
  fa.a2.unit34.lesson03.teach.clause_vs_noun:
    title: Oración o sustantivo
    gloss: چون + oración, به خاطر + sustantivo
    note: Después de *چون* hace falta un verbo (*بارون اومد*, *ترافیک بود*). Después de *به خاطر* solo se usa un sustantivo (*بارون*, *ترافیک*). No digas *به خاطر بارون اومد* para «porque llovió».
  fa.a2.unit34.lesson03.teach.one_connector:
    title: Un conector para cada unión
    gloss: No combines چون y برای همین en una misma unión
    note: Usa *چون ... ،* o *... ، برای همین ...* para un solo motivo y su resultado. Decir ambos en la misma unión repite el significado y suena mal.
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: Preguntar por qué
    gloss: por qué, perdón, llegaste, no viniste, y
    note: '*چرا* pregunta por un motivo. *ببخشید* abre una disculpa. *و* une dos hechos.'
    example_gloss:
    - ¿Por qué no viniste ayer?
    - ¿Por qué llegaste tarde?
    - Perdón, llegué tarde.
    - Llovió y había tráfico.
  fa.a2.unit34.lesson04.teach.answer_chon:
    title: Responder a چرا
    gloss: La respuesta a چرا empieza con چون
    note: 'La respuesta natural a *چرا* empieza con *چون* y da solo el motivo: *چون ترافیک بود*. Si quieres, añade el resultado con una segunda oración.'
  fa.a2.unit34.lesson05.teach.message:
    title: Un mensaje sobre una cita perdida
    gloss: Hola, Sara. Ayer no pude venir porque se me averió el coche. Por la lluvia, además, había tráfico. Hoy estoy enfermo, así que cambié nuestra cita.
    note: Lee una vez para encontrar los tres motivos y otra vez para ver qué resultó de cada uno.
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: Palabras para la conversación
    gloss: nosotros, sí, bueno, no, teníamos una cita, ¿vienes?, vengo, no vengo
    note: '*آره* es la forma hablada de «sí». *میای؟* pregunta «¿vienes?»; las respuestas son *میام* y *نمیام*.'
    example_gloss:
    - Ayer teníamos una cita.
    - Sí, vengo.
    - Bueno, ¿vienes hoy?
    - No, hoy no vengo.
  fa.a2.unit34.lesson06.teach.turn01:
    title: Sara pregunta por qué
    gloss: 'Sara le pregunta a Nima: Nima, ¿por qué no viniste ayer?'
    note: La pregunta *چرا* pide un motivo.
  fa.a2.unit34.lesson06.teach.turn02:
    title: Nima da el motivo
    gloss: 'Nima: Porque llovió.'
    note: Una respuesta corta a *چرا* empieza con *چون*.
  fa.a2.unit34.lesson06.teach.turn03:
    title: Sara se lo recuerda
    gloss: 'Sara: Pero habíamos quedado.'
    note: '*قرار داشتیم* significa «habíamos quedado» (teníamos una cita).'
  fa.a2.unit34.lesson06.teach.turn04:
    title: Nima explica el resultado
    gloss: 'Nima: Sí, llovió y había tráfico, por eso no pude venir.'
    note: Dos motivos se unen con *و*, y luego *برای همین* da el resultado.
  fa.a2.unit34.lesson06.teach.turn05:
    title: Sara pregunta por hoy
    gloss: 'Sara: Bueno, ¿vienes hoy?'
    note: Una pregunta en presente sobre el plan.
  fa.a2.unit34.lesson06.teach.turn06:
    title: Nima da un motivo en presente
    gloss: 'Nima: No, como hoy tengo trabajo, no voy.'
    note: Un motivo en presente con *چون*, y después el resultado.
