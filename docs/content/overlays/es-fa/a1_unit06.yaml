      status: correct
    feedback: یک چای می‌خواستم، لطفاً significa «Quisiera un té, por favor» (cortés).
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: Une cada verbo para pedir con la situación en que se usa.
    accepted_answers:
