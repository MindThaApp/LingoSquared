course:
  title: Persa A1
  description: 'Farsi iraní básico: vocabulario de comida y bebida, pedir con cortesía en un restaurante, preguntar por el menú y las recomendaciones, cantidades y etiqueta en el restaurante, incluido pedir la cuenta.'
units:
  fa.a1.unit06.food:
    title: La comida y cómo pedir una comida
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Comida y bebida
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Pedir con cortesía
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Pregunta por la carta y pide una recomendación
  fa.a1.unit06.lesson04.quantities:
    title: Pedir cantidades concretas
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Etiqueta en el restaurante y la cuenta
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Una conversación completa en el restaurante
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Pan
    gloss: pan
    note: نان es un alimento básico de todas las comidas iraníes; suele ser pan plano y se sirve con casi todo.
    example_gloss: Me gusta el pan.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Arroz
    gloss: arroz
    note: برنج es una parte central de la mayoría de los platos principales iraníes.
    example_gloss: El arroz con pollo está delicioso.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Pollo
    gloss: pollo
    note: مرغ significa tanto el ave como su carne.
    example_gloss: Como pollo.
  fa.a1.unit06.lesson01.teach.ab:
    title: Agua
    gloss: agua
    note: آب es la palabra habitual para decir «agua».
    example_gloss: Quiero agua.
  fa.a1.unit06.lesson01.teach.chai:
    title: Té
    gloss: té
    note: چای es la bebida que se ofrece casi en cualquier lugar de Irán; ya apareció en la lección de taarof de la unidad 1.
    example_gloss: Un té, por favor.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Café
    gloss: café
    note: قهوه es cada vez más común en las ciudades iraníes, junto al té.
    example_gloss: El café está caliente.
  fa.a1.unit06.lesson01.teach.mive:
    title: Fruta
    gloss: fruta
    note: میوه es una palabra general que abarca cualquier fruta.
    example_gloss: Me gusta la fruta.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: Y / o
    gloss: و (y), یا (o)
    note: Ambas son palabras de enlace habituales para unir comidas y bebidas en un pedido.
    target_text: و (y)، یا (o)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Pedir té con cortesía
    gloss: Quisiera un té.
    note: 'می‌خواستم es literalmente una forma de pasado de «querer», pero funciona como una petición cortés y suavizada: es el registro natural con un camarero o un tendero a quien no conoces.'
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Por favor
    gloss: por favor
    note: Puedes añadir لطفاً para suavizar casi cualquier petición.
    example_gloss: Por favor, ayúdame.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Pedir té de manera informal
    gloss: Quiero un té.
    note: 'یه چای می‌خوام usa el coloquial یه (un/una) y می‌خوام (quiero): resérvalo para un amigo cercano o un familiar, no para un camarero que acabas de conocer.'
  fa.a1.unit06.lesson02.teach.register_note:
    title: Elegir el verbo adecuado para pedir
    gloss: Usa می‌خواستم con un desconocido o un camarero; usa می‌خوام solo con un amigo cercano.
    note: Esta es la versión para pedir de la diferencia de registro que ya vimos en los saludos de la unidad 1.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Pedir pan con cortesía
    gloss: Quisiera un poco de pan.
    note: El mismo patrón con می‌خواستم sirve para cualquier sustantivo de comida o bebida.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Carta
    gloss: carta (menú)
    note: منو es un préstamo y se usa igual que «menú» en español.
    example_gloss: La carta, por favor.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Pedir la carta
    gloss: ¿Tienen carta?
    note: منو دارید؟ significa literalmente «¿tienen carta?» y es la forma habitual de pedirla.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Pedir una recomendación
    gloss: ¿Qué recomienda?
    note: چی توصیه می‌کنید؟ es una pregunta natural y muy común para un camarero.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Lo que te pregunta el camarero
    gloss: ¿Qué desea?
    note: چی میل دارید؟ es la forma cortés y habitual con la que el camarero abre el pedido.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Kebab de pollo
    gloss: kebab de pollo
    note: جوجه‌کباب (pollo marinado a la parrilla) es uno de los platos más comunes en una carta iraní.
    example_gloss: Pido el kebab de pollo.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: El camarero recomienda el plato
    gloss: El kebab de pollo está muy bueno hoy.
    note: خوبه es la contracción hablada e informal de خوب است, natural en una recomendación casual del camarero.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Sí, aquí tiene
    gloss: Sí, aquí tiene.
    note: بله significa «sí»; بفرمایید (ya visto en la lección de taarof de la unidad 1) se usa de nuevo aquí al entregar algo, como la carta, a alguien.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Un vaso de té
    gloss: un vaso de té
    note: لیوان (vaso) es la palabra de medida para las bebidas que se sirven en vaso.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Dos panes
    gloss: dos panes
    note: تا es un contador que se coloca después de un número al contar la mayoría de los elementos contables; aquí, dos piezas de pan.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Un plato de arroz
    gloss: un plato de arroz
    note: بشقاب (plato) es la palabra de medida para la comida que se sirve en un plato.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Combina un pedido completo
    gloss: Un plato de arroz y dos panes, por favor.
    note: Puedes unir varias cantidades con و (y) en un mismo pedido.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: El contador تا
    gloss: 'تا va después de un número con elementos contables: دو تا (dos), سه تا (tres).'
    note: Es el mismo patrón general de conteo que se enseñó con los números en la unidad 3, aplicado aquí a pedir comida.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: La cuenta
    gloss: la cuenta
    note: صورت‌حساب es la palabra habitual para la cuenta de un restaurante.
    example_gloss: La cuenta, por favor.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Pedir la cuenta
    gloss: ¿Nos trae la cuenta, por favor?
    note: صورت‌حساب رو لطف می‌کنید؟ es una forma cortés y natural de pedir la cuenta en un restaurante.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Di que la comida estaba deliciosa
    gloss: Estaba muy rico.
    note: خیلی خوشمزه بود es un cumplido natural para decirle al camarero o al anfitrión después de una comida.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Buen provecho
    gloss: ¡Buen provecho!
    note: نوش جان se le dice a alguien que está comiendo o va a comer, y equivale más o menos a «buen provecho»; no lo dice la persona que come sobre su propia comida.
  fa.a1.unit06.lesson05.teach.chashm:
    title: La respuesta cortés de un camarero
    gloss: Enseguida.
    note: چشم، الان میارم es una forma respetuosa con la que el personal acepta una petición y dice que la traerá de inmediato.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restaurante
    gloss: restaurante
    note: رستوران es la palabra habitual para «restaurante», el escenario del diálogo de esta unidad.
    example_gloss: Este restaurante es bueno.
  fa.a1.unit06.lesson06.teach.turn01:
    title: El camarero recibe al cliente
    gloss: El camarero da la bienvenida al cliente y le pregunta qué desea.
    note: چی میل دارید؟ es la misma pregunta cortés de apertura de la lección 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: El cliente pide la carta
    gloss: El cliente saluda al camarero y le pide la carta.
    note: منو دارید؟ abre el intercambio del pedido.
  fa.a1.unit06.lesson06.teach.turn03:
    title: El camarero trae la carta
    gloss: El camarero responde que sí y le entrega la carta.
    note: بفرمایید es la misma palabra cortés de ofrecimiento de la unidad 1, usada aquí al entregar algo a alguien.
  fa.a1.unit06.lesson06.teach.turn04:
    title: El cliente pide una recomendación
    gloss: El cliente pregunta qué recomienda el camarero.
    note: چی توصیه می‌کنید؟ ya vista en la lección 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: El camarero recomienda un plato
    gloss: El camarero dice que el kebab de pollo está muy bueno hoy.
    note: جوجه‌کباب امروز خیلی خوبه usa la forma informal خوبه, natural en las recomendaciones habladas.
  fa.a1.unit06.lesson06.teach.turn06:
    title: El cliente hace un pedido completo
    gloss: El cliente acepta y pide pollo kebab con arroz y además un té.
    note: Aquí se usa می‌خواستم, adecuado para un camarero al que no conoces personalmente.
  fa.a1.unit06.lesson06.teach.turn07:
    title: El camarero confirma el pedido
    gloss: El camarero dice que lo trae enseguida.
    note: چشم، الان میارم de la lección 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: El cliente elogia la comida y pide la cuenta
    gloss: El cliente dice que estaba delicioso y pide la cuenta.
    note: Las dos frases reutilizan directamente el vocabulario de la lección 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: El camarero trae la cuenta
    gloss: El camarero accede y dice que la trae enseguida.
    note: البته (por supuesto) es una afirmación cortés y natural en este contexto.
