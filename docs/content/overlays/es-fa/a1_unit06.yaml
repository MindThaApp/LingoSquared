    - ¿Tiene té?
    - El té está bueno.
    accepted_answers:
    - value: Quisiera un té. (cortés)
      status: correct
    feedback: می‌خواستم es la forma cortés para pedir a alguien a quien no conoces bien.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام es apropiado para decírselo a…
    correct_option: un amigo cercano que prepara té en casa
    distractors:
    - un camarero que acabas de conocer
    - un tendero al que no conoces
    - una persona mayor en una cena formal
    accepted_answers:
