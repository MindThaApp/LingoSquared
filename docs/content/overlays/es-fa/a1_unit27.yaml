course:
  title: Persa A1
  description: 'Farsi iraní para principiantes: nombrar deportes (fútbol, baloncesto, voleibol, natación), preguntar «¿Qué deporte te gusta?», decir dónde practicas un deporte (gimnasio, piscina, parque), hablar de la frecuencia (todos los días, cada semana, a veces, N veces), una lectura breve sobre la rutina deportiva de نیما y un diálogo final entre نیما y سارا en el que comparan qué deportes hacen, con qué frecuencia y dónde.'
