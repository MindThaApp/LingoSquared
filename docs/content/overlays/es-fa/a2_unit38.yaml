teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: Fórmulas corteses para empezar
    gloss: perdone, ¿sabe usted?, no sé
    note: '*ببخشید* abre una pregunta cortés a un desconocido. *می‌دونید* es la forma cortés, con *شما*, de «¿sabe usted?».'
    example_gloss:
    - Perdone, ¿sabe qué hora es?
    - No sé, lo siento.
  fa.a2.unit38.lesson01.teach.places:
    title: Lugares y un billete
    gloss: estación, oficina, museo, biblioteca, billete
    note: '*کتابخونه* es la forma hablada habitual de «biblioteca»; en la escritura cuidada se usa *کتابخانه*.'
    example_gloss:
    - La estación está allí.
    - La oficina está aquí.
    - El museo está allí.
    - La biblioteca está aquí.
    - El billete está aquí.
  fa.a2.unit38.lesson01.teach.where_time:
    title: ¿Dónde está? ¿Qué hora es?
    gloss: dónde está, qué hora es, está aquí, está allí
    note: '*ساعت چنده* sirve para preguntar la hora. *اینجاست* y *اونجاست* son respuestas breves típicas sobre un lugar.'
    example_gloss:
    - ¿Dónde está la oficina?
    - ¿Qué hora es?
    - La biblioteca está aquí.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'La fórmula cortés: می‌دونید + pregunta'
    gloss: Perdone, ¿sabe dónde está la estación? Perdone, ¿sabe qué hora es?
    note: 'Para preguntar con cortesía a un desconocido, pon *ببخشید، می‌دونید* delante de la pregunta normal. La pregunta en sí no cambia: *ایستگاه کجاست؟* pasa a ser *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: Abierto, cerrado, hoy, mañana
    gloss: abierto, cerrado, hoy, mañana
    note: '*باز* significa «abierto» y *بسته* significa «cerrado». *هست* indica que algo es así.'
    example_gloss:
    - El museo está abierto hoy.
    - La oficina está cerrada hoy.
    - El museo está abierto mañana.
    - La biblioteca está cerrada mañana.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: Cuándo, o, no, sí
    gloss: cuándo, se vuelve / ocurre, o, no, sí
    note: '*باز می‌شه* significa «abre»; *بسته می‌شه* significa «cierra». *نه* es «no» y también cierra la pareja *یا نه* («o no»).'
    example_gloss:
    - ¿Cuándo abre el museo?
    - ¿Está abierto o no?
    - Sí, está abierto.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: '«Cuándo» indirecto: la palabra interrogativa no se mueve'
    gloss: ¿Sabe cuándo abre el museo?
    note: 'En español la pregunta indirecta suele cambiar el acento y la puntuación («cuándo abre el museo»), y a menudo el verbo va antes del sujeto. En persa no se mueve nada: *موزه کی باز می‌شه؟* simplemente sigue a *می‌دونید*. La palabra interrogativa *کی* se queda donde está en la pregunta directa.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'Sí/no indirecto: ... یا نه'
    gloss: ¿Sabe si el museo está abierto (o no)?
    note: Para «si», toma la oración afirmativa *موزه باز هست* y ciérrala con *یا نه*. El español añade «si» al principio; el persa añade *یا نه* al final.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: Tú a un amigo, usted a un desconocido
    gloss: tú (amigo), usted (cortés), ¿sabes? (amigo)
    note: Sara y Nima son amigos, así que dicen *تو* y *می‌دونی*. A un desconocido se le dice *شما* y *می‌دونید*.
    example_gloss:
    - Sara, ¿sabes dónde está la oficina?
    - ¿Sabe dónde está la oficina? (a un desconocido)
  fa.a2.unit38.lesson03.teach.same_order:
    title: El orden de las palabras no cambia
    gloss: ¿Dónde está la estación? ¿Sabe dónde está la estación?
    note: 'La pregunta directa y la indirecta tienen exactamente las mismas palabras en el mismo orden: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. Solo se añade la fórmula cortés. El persa nunca reorganiza la pregunta.'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: ¿می‌دونی o می‌دونید?
    gloss: ¿sabes? (amigo); ¿sabe? (desconocido)
    note: Usa *می‌دونی* con un amigo y *می‌دونید* con un desconocido, un empleado o cualquier persona a quien trates con cortesía. Una pregunta cortés a un desconocido también empieza con *ببخشید*.
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'No sé ...: una afirmación, no una pregunta'
    gloss: No sé dónde está la estación; no sé dónde está la estación
    note: '*نمی‌دونم* admite la misma pregunta incluida: *نمی‌دونم موزه کی باز می‌شه*. Es una afirmación, así que no lleva signos de interrogación. Puedes añadir *که* después (*نمی‌دونم که ...*), pero en el persa hablado normalmente se omite.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (palabra de enlace opcional)
    gloss: que (palabra de enlace opcional)
    note: Aquí *که* solo une *نمی‌دونم* con la pregunta. No añade nada al significado y normalmente se omite.
    example_gloss:
    - No sé dónde está la oficina.
  fa.a2.unit38.lesson04.teach.directions:
    title: Direcciones que puedes oír
    gloss: recto, vaya (cortés), lado/dirección, derecha, izquierda, luego, y
    note: 'Un desconocido responde con mandatos corteses: *مستقیم برید* «siga recto». *سمت راست* es «a la derecha» y *سمت چپ* «a la izquierda».'
    example_gloss:
    - Vaya todo recto.
    - Vaya a la derecha.
    - Siga recto y luego a la izquierda.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: Horas y agradecimiento
    gloss: las ocho, las cinco, gracias
    note: '*ساعت هشت* es «a las ocho». Di *ممنون* después de cualquier respuesta.'
    example_gloss:
    - El museo abre a las ocho.
    - La oficina cierra a las cinco.
    - ¡Gracias!
  fa.a2.unit38.lesson04.teach.package:
    title: Una fórmula cortés completa
    gloss: Perdone, ¿sabe cuándo cierra la oficina?
    note: 'Construye cada pregunta cortés en tres pasos: *ببخشید*, luego *می‌دونید*, y después la pregunta normal con su propia palabra interrogativa (*کجاست*, *کی ... می‌شه*, *... هست یا نه*). Nada dentro de la pregunta se mueve.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: Hola y yo
    gloss: hola, yo
    note: '*من* casi nunca hace falta, porque la terminación del verbo ya significa «yo». Se añade para contrastar.'
    example_gloss:
    - Hola, no lo sé.
    - Mañana voy al museo.
  fa.a2.unit38.lesson05.teach.reading:
    title: Una nota breve para pedir información
    gloss: Hola. Disculpa, ¿sabes dónde está la oficina? ¿Sabes si mañana está abierta? Yo no lo sé. Gracias. Nima
    note: Lee una vez para encontrar las dos preguntas y otra vez para ver la fórmula de cortesía en cada una.
  fa.a2.unit38.lesson06.teach.passerby:
    title: Transeúnte
    gloss: transeúnte (una persona desconocida en la calle)
    note: 'Fíjate en que la pregunta incluida va después de *می‌دونه* («él/ella sabe») exactamente igual: nada cambia de lugar.'
    example_gloss:
    - El transeúnte sabe dónde está la oficina.
  fa.a2.unit38.lesson06.teach.turn01:
    title: Sara le pregunta a su amigo
    gloss: 'Sara le pregunta a Nima, usando la forma de confianza: ¿Sabes dónde está la oficina?'
    note: Usa *می‌دونی* porque son amigos.
  fa.a2.unit38.lesson06.teach.turn02:
    title: Nima le pregunta a un desconocido
    gloss: Nima no lo sabe, así que le pregunta a un transeúnte con la fórmula de cortesía.
    note: Cambia a *می‌دونید* para el desconocido.
  fa.a2.unit38.lesson06.teach.turn03:
    title: El transeúnte le indica el camino
    gloss: 'Sí: vaya recto. La oficina está a la derecha.'
    note: La respuesta usa órdenes en forma de cortesía.
  fa.a2.unit38.lesson06.teach.turn04:
    title: Nima pregunta si está abierta
    gloss: Gracias. ¿Sabe si la oficina está abierta?
    note: La segunda pregunta usa *یا نه*.
  fa.a2.unit38.lesson06.teach.turn05:
    title: Está abierta y cierra a las cinco
    gloss: Sí, está abierta. Cierra a las cinco.
    note: 'Dos datos: abierta ahora y cierra a las cinco.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: Nima le da las gracias y se lo dice a Sara
    gloss: Gracias. Sara, la oficina está allí.
    note: Da las gracias al desconocido y se lo cuenta a su amiga.
