teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: Palabras del teléfono
    gloss: teléfono, cámara, batería
    note: '*گوشی* es la palabra habitual para el teléfono móvil.'
    example_gloss:
    - Mi teléfono tiene cámara.
    - Este teléfono tiene batería.
    - Este es el teléfono.
  fa.a2.unit41.lesson01.teach.adjs:
    title: Barato, caro, bueno, malo
    gloss: barato, caro, bueno, malo
    note: '*ارزون* y *گرون* son las formas habladas habituales.'
    example_gloss:
    - Este teléfono es barato.
    - Aquel teléfono es caro.
    - Este teléfono es bueno.
    - Aquel teléfono es malo.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'Repaso del comparativo: -تر'
    gloss: más barato, más caro, mejor, peor
    note: 'Ya conoces *-تر* para «más»: *ارزون‌تر*. *بهتر* y *بدتر* son las formas de «bueno» y «malo».'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'El superlativo: -ترین delante del sustantivo'
    gloss: el teléfono más barato, el teléfono más caro, el mejor teléfono, el peor teléfono
    note: 'Añade *-ین* al comparativo y colócalo delante del sustantivo: *ارزون‌تر* pasa a ser *ارزون‌ترین گوشی*. No hay ezafe (*ـِ*) entre las dos palabras.'
  fa.a2.unit41.lesson02.teach.housing:
    title: Palabras de la vivienda
    gloss: apartamento, habitación, casa, estación
    note: '*خونه* es la forma hablada de *خانه*.'
    example_gloss:
    - El apartamento está aquí.
    - La habitación está allí.
    - La casa está aquí.
    - La estación está allí.
  fa.a2.unit41.lesson02.teach.size:
    title: Grande, pequeño, cerca, lejos, bonito
    gloss: grande, pequeño, cerca, lejos, bonito
    note: '*کوچیک* es la forma hablada habitual de *کوچک*.'
    example_gloss:
    - El apartamento es grande.
    - La habitación es pequeña.
    - La estación está cerca.
    - La casa está lejos.
    - La casa es bonita.
  fa.a2.unit41.lesson02.teach.forms:
    title: Cualquier adjetivo + ترین
    gloss: el apartamento más grande; la habitación más pequeña; la estación más cercana; la casa más bonita
    note: 'El patrón es el mismo para todos los adjetivos: adjetivo + *‌ترین* (con un pequeño espacio, escrito con medio espacio) delante del sustantivo.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'En el habla: از همه + comparativo'
    gloss: Este apartamento es el más grande (más grande que todos); esta habitación es la más pequeña
    note: 'Cuando el superlativo es el predicado, en el habla se suele decir «más grande que todos»: *از همه بزرگ‌تره*. Significa «el más grande». El superlativo también puede ser el predicado: *این بزرگ‌ترینه* («este es el más grande»).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: Palabras de vacaciones
    gloss: hotel, viaje, mar, montaña
    note: '*سفر* es un viaje.'
    example_gloss:
    - El hotel está aquí.
    - El viaje es precioso.
    - El mar está allí.
    - La montaña está lejos.
  fa.a2.unit41.lesson03.teach.opinion:
    title: En mi opinión, cuál
    gloss: en mi opinión, cuál, cuál es
    note: '*به نظر من* introduce tu opinión. *کدومه؟* significa «¿cuál es?».'
    example_gloss:
    - En mi opinión, este hotel es bueno.
    - ¿Qué hotel?
  fa.a2.unit41.lesson03.teach.choose:
    title: Preguntar cuál es el mejor
    gloss: ¿Qué hotel es el más barato? El hotel de montaña es el más barato.
    note: Para elegir uno entre tres opciones, pregunta *کدوم ... از همه ...؟* y responde con el mismo patrón.
  fa.a2.unit41.lesson04.teach.asas:
    title: Tan ... como
    gloss: tanto como, no es
    note: Después de *به اندازه‌ی* va aquello con lo que se compara.
    example_gloss:
    - Este teléfono es tan barato como aquel.
    - Aquel teléfono no es tan bueno como este.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: Igualdad y desigualdad
    gloss: Esta casa es tan grande como aquella casa; esta habitación no es tan grande como aquella habitación
    note: '*به اندازه‌ی* + sustantivo + adjetivo indica que dos cosas son iguales. Para «no tan ... como», termina con *نیست*. En afirmativo, el adjetivo lleva la cópula hablada (*بزرگه* = *بزرگ* + *است*). En negativo, la cópula se sustituye por *نیست*, así que se dice *بزرگ نیست*, no *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: Tres apartamentos
    gloss: Quiero conseguir un apartamento. He visto tres apartamentos. El primer apartamento era el más barato, pero era el más pequeño. El segundo apartamento era el más grande, pero estaba muy lejos. El tercer apartamento no era tan grande como el segundo, pero era el más cercano. En mi opinión, el tercer apartamento es el mejor.
    note: Lee una vez para entender los tres apartamentos y otra vez para fijarte en las palabras que terminan en *-ترین*.
  fa.a2.unit41.lesson06.teach.turn01:
    title: Sara pregunta qué teléfono es mejor
    gloss: 'Sara: Nima, ¿qué teléfono es mejor?'
    note: '*بهتره* es el comparativo «mejor».'
  fa.a2.unit41.lesson06.teach.turn02:
    title: Nima da su opinión
    gloss: 'Nima: En mi opinión, este teléfono es el mejor.'
    note: '*بهترین گوشی* usa el superlativo delante del sustantivo.'
  fa.a2.unit41.lesson06.teach.turn03:
    title: Sara menciona el precio
    gloss: 'Sara: Pero este teléfono es el más caro.'
    note: '*از همه گرون‌تره* es el «el más caro» hablado.'
  fa.a2.unit41.lesson06.teach.turn04:
    title: Nima compara
    gloss: 'Nima: Sí. Ese teléfono es el más barato, pero no es tan bueno como este.'
    note: '*ارزون‌ترینه* es el superlativo usado como predicado.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: Sara decide
    gloss: 'Sara: Entonces compro este.'
    note: '*می‌خرم* en la lengua hablada también significa «compraré».'
