teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: El fin de semana pasado
    gloss: el fin de semana pasado
    note: '*آخر هفته‌ی پیش* significa literalmente «el final de la semana pasada», que es como el persa dice «el fin de semana pasado». En Irán el fin de semana son el jueves y el viernes.'
    example_gloss: El fin de semana pasado me quedé en casa.
  fa.a2.unit19.lesson01.teach.days:
    title: Jueves, viernes
    gloss: Jueves, viernes
    note: Estos dos días forman el fin de semana iraní, así que son los que suelen aparecer al contar el fin de semana.
    example_gloss:
    - El jueves fui al parque.
    - El viernes me quedé en casa.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: Mañana, mediodía, tarde
    gloss: mañana, mediodía, tarde
    note: '*عصر* abarca la tarde y el comienzo del anochecer. Pon la parte del día justo después del día: *پنجشنبه صبح* «el jueves por la mañana».'
    example_gloss:
    - El jueves por la mañana fui de compras.
    - Dormí hasta el mediodía.
    - Por la tarde fui al parque.
  fa.a2.unit19.lesson01.teach.places:
    title: Parque, cine, banco
    gloss: parque, cine, banco
    note: 'Con *رفتن* (ir), *به* («a») suele omitirse al hablar: *به پارک رفتم* y *رفتم پارک* significan ambos «fui al parque».'
    example_gloss:
    - El jueves fui al parque.
    - El viernes fui al cine.
    - El jueves fui al banco.
  fa.a2.unit19.lesson01.teach.errands:
    title: De compras
    gloss: compras
    note: '*رفتم خرید* significa «fui de compras». La misma palabra *خرید* es también la forma de pasado de «él/ella» de *خریدن*: «él/ella compró».'
    example_gloss: El jueves por la mañana fui de compras.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: Casa, libro, película
    gloss: casa, libro, película
    note: '*خونه* es la forma hablada de *خانه* (casa, hogar). Al hablar, *یه کتاب* («un libro») es la forma habitual de *یک کتاب*; ambas son correctas.'
    example_gloss:
    - El viernes me quedé en casa.
    - Leí un libro.
    - Vi una película.
  fa.a2.unit19.lesson01.teach.people:
    title: Mi amigo, mi abuela
    gloss: mi amigo, mi abuela
    note: 'La terminación *-م* en un sustantivo significa «mi»: *دوست* (amigo) pasa a *دوستم* (mi amigo).'
    example_gloss:
    - El jueves vino mi amigo.
    - El viernes vino mi abuela.
  fa.a2.unit19.lesson01.teach.visit:
    title: Visitar
    gloss: visitar / ver
    note: '*رفتن دیدن* seguido de una persona significa ir a visitarla: *رفتم دیدن دوستم* «fui a visitar a mi amigo». La misma palabra *دیدن* también significa «ver».'
    example_gloss: Fui a visitar a mi abuela.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: Fui, vine, me quedé
    gloss: Fui, vine, me quedé
    note: Estas son formas de *yo* del pasado simple. El persa hablado dice *اومدم* y *موندم* donde la escritura cuidada tiene *آمدم* y *ماندم*.
    example_gloss:
    - El jueves fui al parque.
    - El viernes vine a casa.
    - El fin de semana pasado me quedé en casa.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: Comí, vi, leí, dormí
    gloss: Comí, vi, leí, dormí
    note: Cuatro formas más de *yo* del pasado simple. *خوندم* es la forma hablada de *خواندم*.
    example_gloss:
    - Almorcé.
    - Vi una película.
    - Leí un libro.
    - El viernes dormí.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: Yo, tú, él/ella, nosotros
    gloss: yo, tú, él / ella, nosotros
    note: El persa hablado suele omitir el pronombre, porque la terminación del verbo ya indica quién actúa. Se añade para enfatizar o contrastar. *اون* significa «él» o «ella».
    example_gloss:
    - Yo fui al parque el jueves.
    - ¿Tú te quedaste en casa?
    - Él vino el viernes.
    - Nosotros fuimos al parque el jueves.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: La raíz del pasado
    gloss: 'Raíces del pasado: fue, comió, vio, leyó, se quedó, vino, durmió'
    note: 'La forma de diccionario (infinitivo) de un verbo termina en *-ن*. Si la quitas, obtienes la raíz del pasado: *رفتن* → *رفت*, *خوردن* → *خورد*, *دیدن* → *دید*, *خوندن* → *خوند*, *موندن* → *موند*, *اومدن* → *اومد*, *خوابیدن* → *خوابید*. Todo el pasado simple se construye sobre esta raíz.'
  fa.a2.unit19.lesson02.teach.endings:
    title: Terminaciones sobre la raíz del pasado
    gloss: fui, fuiste, él/ella fue, fuimos, ustedes fueron, ellos fueron
    note: 'Añade la terminación a la raíz: *-م* (yo), *-ی* (tú), sin terminación (él/ella), *-یم* (nosotros), *-ین* (ustedes o forma de cortesía, al hablar: *رفتین*), *-ن* (ellos). La escritura cuidada tiene *-ید* para «ustedes» (*رفتید*) y *-ند* para «ellos» (*رفتند*). Ten en cuenta que *رفتن* también significa «ir»; el contexto los distingue. Y no confundas las dos *-م*: en un sustantivo significa «mi» (*دوستم*), en un verbo en pasado significa «yo» (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: Las mismas terminaciones con خورد
    gloss: comí, comiste, él/ella comió, comimos
    note: 'Mismas terminaciones, otra raíz: *خورد* + *-م*, *-ی*, nada, *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: Las mismas terminaciones con موند
    gloss: me quedé, te quedaste, él/ella se quedó, nos quedamos
    note: 'La raíz *موند* toma las mismas terminaciones. En la forma de «él/ella» no hay nada que añadir: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: Pero, y
    gloss: pero, y
    note: '*ولی* une dos oraciones que se contraponen; *و* simplemente añade una cosa más.'
    example_gloss:
    - Fui al parque, pero no fui al cine.
    - El viernes me quedé en casa y leí un libro.
  fa.a2.unit19.lesson03.teach.time_words:
    title: Ayer, hoy, todos los días
    gloss: ayer, hoy, todos los días
    note: 'Las palabras de tiempo ayudan a elegir el tiempo verbal: *دیروز* apunta al pasado y *هر روز* (un hábito) al presente. *امروز* puede ir con ambos: *امروز نمی‌رم پارک* «hoy no voy al parque», pero *امروز رفتم پارک* «hoy fui al parque» cuando ya ha ocurrido.'
    example_gloss:
    - Ayer fui al parque.
    - Hoy no voy al parque.
    - Todos los días voy al parque.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'Pasado negativo: نـ + verbo'
    gloss: No fui, no comí, no vi, no leí, no me quedé
    note: 'Para decir que NO hiciste algo, pon *نـ* justo delante del verbo en pasado y no cambies nada más: *رفتم* → *نرفتم*, *خوردم* → *نخوردم*, *ندیدم*, *نخوندم*, *نموندم*. Las terminaciones siguen igual: *نرفتم*, *نرفتی*, *نرفت*, *نرفتیم*. Escribe *نـ* unida al verbo: no es la palabra independiente *نه* (''no''): *نه، نرفتم* significa ''No, no fui''.'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'La excepción: اومدن'
    gloss: No vine, no viniste, él/ella no vino, no vinimos
    note: '*اومدن* (''venir'') empieza por vocal, así que *نـ* + *ا* se convierte en *نی*: *اومدم* → *نیومدم* (nunca *ناومدم*). Las demás terminaciones siguen el patrón habitual: *نیومدی*, *نیومد*, *نیومدیم*. En la escritura formal, *آمدم* → *نیامدم*.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: ¿Pasado o presente?
    gloss: Voy, fui, no voy, no fui
    note: 'El pasado simple no lleva *می‌* y usa la raíz de pasado (*رفتم*); el presente lleva *می‌* más la raíz de presente (*می‌رم*). La raíz y *می‌* juntas indican el tiempo. Los negativos funcionan igual: *نرفتم* ''no fui'', pero *نمی‌رم* ''no voy''. Pronunciación: el negativo del pasado es *na-* (*نرفتم*, ''na-raftam''), mientras que *نمی‌* es *ne-* (*نمی‌رم*, ''ne-miram'').'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: Primero, luego, al final
    gloss: primero, luego / después, al final
    note: '*اول* abre una secuencia, *بعد* la continúa (se puede repetir) y *آخرش* la cierra.'
    example_gloss:
    - Primero fui al banco.
    - Luego fui de compras.
    - Al final volví a casa.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: Contar los hechos en orden
    gloss: Primero fui al banco, luego fui de compras y al final volví a casa.
    note: 'Cuenta los hechos en el orden en que ocurrieron. Cada oración tiene su propio verbo en pasado (con *رفتن* el verbo suele ir antes del lugar: *رفتم بانک*). Une las oraciones con una coma o con *و*: *اول رفتم بانک و بعد رفتم خرید*. Pon el hecho negativo donde le corresponde en la historia: *بعد رفتم پارک، ولی سینما نرفتم* o *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* (''llegué a casa'') es una forma natural de cerrar el día.'
  fa.a2.unit19.lesson04.teach.question:
    title: ¿Qué hiciste el fin de semana pasado?
    gloss: ¿Qué hiciste el fin de semana pasado?
    note: '*چیکار کردی؟* (literalmente ''¿qué hiciste?'') es la forma habitual de preguntar. Respondes con verbos en pasado, una oración por cada cosa que hiciste.'
  fa.a2.unit19.lesson04.teach.sport:
    title: Ejercicio
    gloss: ejercicio / deporte
    note: '*ورزش کردن* significa hacer ejercicio o practicar deporte.'
    example_gloss: El jueves hice ejercicio.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: Negar verbos como خرید کردن
    gloss: Fui de compras, no fui de compras, hice ejercicio, no hice ejercicio
    note: 'Verbos como *خرید کردن* (''ir de compras'') y *ورزش کردن* son un sustantivo más *کردن* (''hacer''). Pon *نـ* en el verbo, no en el sustantivo: *خرید نکردم*, nunca *نخرید کردم*. La forma de ''él/ella'' es *نکرد*: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: Responder a una pregunta de sí o no en pasado
    gloss: ¿Fuiste al cine? No, no fui.
    note: 'Para responder que no a una pregunta sobre el pasado, repite el verbo con *نـ*: *نرفتم*. Es muy común añadir *نه* (''no'') delante. Para decir que sí, repite el verbo sin ella: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: Detecta el negativo
    gloss: No hice, no fui, no vi
    note: 'Al leer o escuchar, fíjate en el comienzo de cada verbo. Una pequeña *نـ* cambia por completo el significado: *رفتم* ''fui'', pero *نرفتم* ''no fui''. En el relato de un fin de semana, los negativos te dicen lo que NO ocurrió, así que anótalos con tanto cuidado como las actividades.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: El mensaje de Sara a una amiga
    gloss: ¡Hola! El fin de semana pasado, el jueves por la mañana, fui de compras. Luego fui al parque. Por la tarde fui a visitar a mi abuela. El viernes me quedé en casa y leí un libro. Pero no hice ejercicio ni fui al cine.
    note: Un breve relato escrito de un fin de semana. Léelo una vez para ver las actividades y su orden, y otra vez para ver las dos cosas que ella NO hizo.
  fa.a2.unit19.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: Los dos amigos de unidades anteriores.
    example_gloss:
    - Sara fue al parque el jueves.
    - Nima vino el viernes.
  fa.a2.unit19.lesson06.teach.until:
    title: Hasta
    gloss: hasta
    note: '*تا* delante de una hora o un día significa ''hasta'': *تا ظهر* ''hasta el mediodía''.'
    example_gloss: Dormí hasta el mediodía.
  fa.a2.unit19.lesson06.teach.what_about:
    title: ¿Y...?
    gloss: ¿Y el viernes? ¿Y tú?
    note: '*چی؟* después de una palabra significa ''¿y qué tal eso?'': una forma rápida de hacer avanzar la conversación.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: ¡Qué bien!
    gloss: ¡Qué bien!
    note: Una reacción amable ante una buena noticia.
  fa.a2.unit19.lesson06.teach.turn01:
    title: Sara pregunta por el fin de semana pasado
    gloss: Sara le pregunta a Nima qué hizo el fin de semana pasado.
    note: La pregunta habitual para contar un fin de semana pasado.
  fa.a2.unit19.lesson06.teach.turn02:
    title: El jueves de Nima
    gloss: Nima dice que el jueves primero fue al banco y luego fue de compras.
    note: '*اول ... بعد ...* ordena las dos gestiones.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: Sara pregunta por el viernes
    gloss: 'Sara pregunta: ¿y el viernes? ¿Hiciste ejercicio?'
    note: '*ورزش کردی؟* es una pregunta de sí o no sobre una acción pasada.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: El viernes de Nima
    gloss: 'Nima dice que no, que no hizo ejercicio. Durmió hasta el mediodía y por la tarde fue a visitar a su amigo. Le pregunta a Sara: ¿y tú?'
    note: '*ورزش نکردم*: la *نـ* va en el verbo. El resto de su viernes es afirmativo.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: El fin de semana de Sara
    gloss: Sara dice que el jueves fue al parque, y que el viernes se quedó en casa y leyó un libro.
    note: 'Sara usa *من* para responder a *تو چی؟*: un caso en el que el pronombre resulta natural.'
  fa.a2.unit19.lesson06.teach.turn06:
    title: Nima reacciona
    gloss: 'Nima dice: ¡qué bien!'
    note: Una reacción breve y amable para cerrar.
  fa.a2.unit19.lesson06.teach.third_person:
    title: Hablar de otras personas
    gloss: Nima fue, Sara se quedó, Nima no fue, Sara no hizo
    note: 'Cuando cuentas lo que hizo otra persona, usa la raíz sola para ''él/ella'': *نیما رفت بانک*, *سارا خونه موند*. El negativo sigue siendo *نـ* + raíz: *نیما نرفت*, *سارا ورزش نکرد*. No se añade ninguna terminación, así que el nombre (o *اون*) indica quién actuó.'
