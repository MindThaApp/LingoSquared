teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: Reglas y lugares
    gloss: reglas, normas de la casa, biblioteca, piscina, gimnasio
    note: '*قانون* es una regla. Una casa, una biblioteca, una piscina y un gimnasio tienen *قانون‌ها* (reglas).'
    example_gloss:
    - La biblioteca tiene reglas.
    - La piscina y el gimnasio también tienen reglas.
    - Una casa también tiene reglas.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: algo es obligatorio'
    gloss: tienes que ir; tienes que ducharte; tienes que traer una tarjeta
    note: '*باید* + subjuntivo = «tener que / deber». El verbo va después de *باید* en forma de subjuntivo (*بری*, *بگیری*, *بیاری*), sin *می‌*.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: algo está prohibido'
    gloss: no debes comer; no debes gritar
    note: '*نباید* + subjuntivo = «no deber». Indica que la acción está prohibida. El verbo que sigue es afirmativo: *بخوری*, *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: no es necesario'
    gloss: no hace falta que vengas; no hace falta que pagues
    note: '*لازم نیست* + subjuntivo = «no hace falta que». La acción es opcional, no está prohibida.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: Frases de reglas
    gloss: guardar silencio, devolver el libro, traer una toalla, llevar zapatillas deportivas, correr
    note: Cada frase es un subjuntivo que termina en *-ی* para un amigo («tú»). Úsala después de *باید* o *نباید*.
    example_gloss:
    - Tienes que guardar silencio.
    - Tienes que devolver el libro.
    - Tienes que llevar zapatillas deportivas.
  fa.a2.unit29.lesson02.teach.where:
    title: Dónde y cuándo se aplica una regla
    gloss: en la biblioteca, en la piscina, en el gimnasio, antes de la piscina
    note: '*توی* significa «en» y *قبل از* significa «antes de». Suelen ir al principio de la regla.'
    example_gloss:
    - En la biblioteca tienes que guardar silencio.
    - Antes de la piscina tienes que ducharte.
    - En el gimnasio tienes que llevar zapatillas deportivas.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'Desconocidos y carteles: la terminación de شما'
    gloss: deben guardar silencio (formal o plural); deben ducharse (formal o plural)
    note: 'Con desconocidos, autoridades o varias personas, la terminación cambia de *-ی* a *-ید*: *باشی* pasa a *باشید* y *بگیری* pasa a *بگیرید*. Los carteles usan esta forma.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: Sin می‌ después de باید
    gloss: tienes que ir; no debes ir
    note: Después de *باید*, *نباید* y *لازم نیست* el verbo va en subjuntivo simple (*بری*), no en presente con *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید no es لازم نیست
    gloss: no debes venir; no hace falta que vengas
    note: En español también son distintos «no debes» y «no tienes que / no hace falta». *نباید بیای* = venir está prohibido. *لازم نیست بیای* = puedes venir, pero no es obligatorio.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'Carteles: ممنوعه'
    gloss: está prohibido comer; está prohibido correr
    note: 'Los carteles suelen nombrar la acción y añadir *ممنوعه* («prohibido»): *غذا خوردن ممنوعه*. A un amigo le dices *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: Dos reglas más
    gloss: comprar un billete, lavar los platos
    note: 'Estas frases van después de *لازم نیست* en los ejercicios: puedes hacerlo, pero no es obligatorio.'
    example_gloss:
    - No hace falta que compres un billete.
    - No hace falta que laves los platos.
    - No debes comer en la piscina.
  fa.a2.unit29.lesson04.teach.permission:
    title: Pedir permiso
    gloss: ¿Puedo entrar? ¿Te importa si me siento aquí?
    note: '*می‌تونم* + subjuntivo pregunta «¿Puedo?» (*می‌تونم بیام؟*). *مشکلی نداره* + subjuntivo pregunta «¿Te importa si…?» (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: Responder a una petición de permiso
    gloss: Sí, puedes. No, no puedes. Sí, no hay problema. No, está prohibido.
    note: Di que sí con *آره، می‌تونی* o *آره، مشکلی نداره*. Di que no con *نه، نمی‌تونی* o *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: Otra pregunta cortés
    gloss: ¿Me permite entrar?
    note: '*اجازه هست؟* es una forma cortés de preguntar si puedes hacer algo. En esta unidad solo necesitas reconocerla.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'Normas de la casa: separar la basura'
    gloss: separar la basura, tirar el plástico al contenedor de papel
    note: '*زباله رو جدا کردن* es separar la basura. La regla dice que el plástico no va en el contenedor de papel.'
    example_gloss:
    - Tienes que separar la basura.
    - No debes tirar el plástico al contenedor de papel.
  fa.a2.unit29.lesson04.teach.night:
    title: Una regla de horas de silencio
    gloss: Por la noche no debes hablar en voz alta
    note: '*بلند حرف زدن* es hablar en voz alta. *شب* (por la noche) va primero.'
    example_gloss:
    - Por la noche no debes hablar en voz alta.
  fa.a2.unit29.lesson05.teach.notice:
    title: Un cartel de reglas
    gloss: Reglas. En la biblioteca deben guardar silencio. Está prohibido comer. Antes de la piscina deben ducharse. Está prohibido correr en la piscina. En el gimnasio deben llevar zapatillas deportivas, pero no hace falta que traigan toalla. Deben separar la basura.
    note: Un cartel se dirige a desconocidos, por eso usa la terminación *-ید*. Lee una vez para ver qué es obligatorio, qué está prohibido y qué es opcional.
  fa.a2.unit29.lesson06.teach.turn01:
    title: Sara pide permiso
    gloss: Sara pregunta si ella también puede ir a la piscina.
    note: '*مشکلی نداره* + subjuntivo sirve para pedir permiso.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: Permiso y una obligación
    gloss: Nima dice que sí, y que ella tiene que ducharse antes.
    note: La respuesta lo permite y luego añade una obligación.
  fa.a2.unit29.lesson06.teach.turn03:
    title: Sara pregunta qué es obligatorio
    gloss: Sara pregunta si tiene que traer toalla.
    note: '*باید* + *بیارم* pregunta por una obligación.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: Opcional y prohibido
    gloss: Nima dice que no hace falta que traiga toalla, pero que no debe correr en la piscina.
    note: '*لازم نیست* es opcional; *نباید* es prohibido.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: Una segunda pregunta
    gloss: Sara pregunta si después puede ir al gimnasio.
    note: '*می‌تونم* + subjuntivo pregunta «¿Puedo?»'
  fa.a2.unit29.lesson06.teach.turn06:
    title: Una última regla
    gloss: Nima dice que sí, pero que ella tiene que llevar zapatillas deportivas.
    note: 'Otra vez: primero el permiso, luego la regla.'
