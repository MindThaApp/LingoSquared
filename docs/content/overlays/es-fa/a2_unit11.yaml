course:
  title: Persa A2
  description: 'Farsi de Irán de nivel preintermedio: abrir una cuenta bancaria, preguntar qué documentos hacen falta, hacer una petición educada con condición y seguir una conversación en la ventanilla del banco, desde la solicitud hasta la recogida de la tarjeta.'
units:
  fa.a2.unit11.banking:
    title: Abrir una cuenta bancaria
lessons:
  fa.a2.unit11.lesson01.banking_vocabulary:
    title: Palabras del banco
  fa.a2.unit11.lesson02.requesting_an_account:
    title: Solicitar una cuenta
  fa.a2.unit11.lesson03.reading_a_bank_notice:
    title: Leer un aviso del banco
  fa.a2.unit11.lesson04.bank_counter_dialogue:
    title: En la ventanilla del banco
teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: Banco
    gloss: banco
    note: '*بانک* es la palabra general para banco.'
    example_gloss: El banco está cerca de mi casa nueva.
  fa.a2.unit11.lesson01.teach.account_word:
    title: Cuenta
    gloss: cuenta
    note: '*حساب* es la palabra general para cuenta.'
    example_gloss: Quiero abrir una cuenta.
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: Tarjeta bancaria
    gloss: tarjeta bancaria
    note: '*کارت بانکی* es la tarjeta de débito o bancaria estándar que se entrega al abrir una cuenta.'
    example_gloss: Mi tarjeta bancaria tiene PIN.
  fa.a2.unit11.lesson01.teach.pin_word:
    title: PIN
    gloss: PIN / contraseña
    note: '*رمز* es la palabra para un PIN o una contraseña.'
    example_gloss: No olvides el PIN de tu tarjeta.
  fa.a2.unit11.lesson01.teach.balance_word:
    title: Saldo
    gloss: saldo
    note: '*موجودی* es la palabra para el saldo de una cuenta.'
    example_gloss: El saldo de mi cuenta es bajo.
  fa.a2.unit11.lesson01.teach.document_word:
    title: Documento
    gloss: documento
    note: '*مدرک* es la palabra general para documento, ya vista en la unidad anterior sobre el registro.'
    example_gloss: Se necesita un documento para abrir una cuenta.
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: Abrir (verbo compuesto)
    gloss: abrir
    note: '*باز کردن* significa literalmente «abierto hacer»: el farsi forma muchos verbos así, con un sustantivo o adjetivo más un verbo auxiliar como *کردن*.'
  fa.a2.unit11.lesson01.teach.ra_note:
    title: Marcador de objeto directo
    gloss: (marca un complemento directo determinado)
    note: '*رو* (forma coloquial de *را*, en lengua formal) marca un complemento directo determinado y va justo después de lo que recibe la acción.'
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: Documento de identidad y justificante de domicilio
    gloss: documento nacional de identidad y justificante de domicilio
    note: '*کارت ملی* y *مدرک آدرس* son los dos documentos que se necesitan en la visita al banco de esta unidad; ya aparecieron en la unidad anterior sobre el registro.'
  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: Pedir que abran una cuenta
    gloss: Me gustaría abrir una cuenta bancaria.
    note: '*می‌خواستم ...* es la misma forma de petición suavizada y cortés de la unidad anterior sobre el registro.'
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: Expresar una condición con اگر (si)
    gloss: Si trae sus documentos, puede abrir una cuenta hoy mismo.
    note: '*اگر ...، ...* es el paso condicional del nivel A2: primero se expresa la condición y después el resultado.'
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: Combinar la petición y la condición
    gloss: Quisiera abrir una cuenta bancaria. Si trae sus documentos, se puede hacer hoy mismo.
    note: El patrón completo de petición más condición en el que se basa esta lección.
  fa.a2.unit11.lesson03.teach.necessary_word:
    title: Necesario
    gloss: necesario
    note: '*لازم* es la palabra general para necesario.'
    example_gloss: Se necesita el documento de identidad para abrir una cuenta.
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: El horario de trabajo
    gloss: horario de atención
    note: '*ساعت کاری* es la expresión habitual para el horario de atención de un negocio.'
    example_gloss: El horario del banco es de 8 de la mañana a 2 de la tarde.
  fa.a2.unit11.lesson03.teach.notice_text:
    title: Un aviso del banco sobre la apertura de cuentas
    gloss: Para abrir una cuenta se necesitan el documento de identidad y un justificante de domicilio. El horario del banco es de 8 de la mañana a 2 de la tarde.
    note: Un aviso oficial breve en estilo escrito neutro, aunque aún usa el *لازمه* cotidiano de la lengua hablada.
  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: ¿En qué puedo ayudarle?
    gloss: Adelante, ¿en qué puedo ayudarle?
    note: '*بفرمایید، چه کمکی می‌تونم بکنم؟* es la fórmula cortés habitual para empezar a atender en un mostrador.'
  fa.a2.unit11.lesson04.teach.turn01:
    title: El empleado saluda a سارا
    gloss: El empleado saluda y pregunta en qué puede ayudar.
    note: Reutiliza la frase de apertura de esta lección.
  fa.a2.unit11.lesson04.teach.turn02:
    title: سارا expone su petición
    gloss: سارا dice que querría abrir una cuenta bancaria.
    note: Reutiliza el patrón *می‌خواستم ...* de la lección 2.
  fa.a2.unit11.lesson04.teach.turn03:
    title: El empleado pide documentos
    gloss: El empleado le pregunta si tiene su documento de identidad y un justificante de domicilio.
    note: '*کارت ملی* y *مدرک آدرس* ya se vieron en la unidad anterior sobre el registro.'
  fa.a2.unit11.lesson04.teach.turn04:
    title: سارا confirma lo que ha traído
    gloss: سارا dice que sí, que ha traído su documento de identidad y la factura de la luz de su casa nueva.
    note: '*قبض برق* (factura de la luz) reutiliza el vocabulario de *قبض* de la unidad anterior sobre el registro.'
  fa.a2.unit11.lesson04.teach.turn05:
    title: El empleado confirma el plazo
    gloss: 'El empleado dice que perfecto: su tarjeta bancaria estará lista en tres días.'
    note: '*تا سه روز دیگه* (en tres días) indica el plazo de entrega.'
  fa.a2.unit11.lesson04.teach.turn06:
    title: سارا pregunta por el PIN
    gloss: سارا pregunta cuándo recibirá el código PIN.
    note: '*کی* significa «cuándo» aquí; la misma palabra también significa «quién», y el contexto las distingue.'
  fa.a2.unit11.lesson04.teach.turn07:
    title: کارمند responde sobre el PIN
    gloss: El empleado dice que será el mismo día en que ella recoja la tarjeta.
    note: '*همون روزی که ...* significa «el mismo día en que ...».'
