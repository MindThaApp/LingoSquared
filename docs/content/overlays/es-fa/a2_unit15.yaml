teaching:
  fa.a2.unit15.lesson01.teach.train_word:
    title: Tren
    gloss: tren
    note: '*قطار* es la palabra general para tren.'
    example_gloss: Mi tren sale a las nueve.
  fa.a2.unit15.lesson01.teach.delay_word:
    title: Retraso
    gloss: retraso
    note: '*تاخیر* es la palabra general para retraso.'
    example_gloss: Hoy el tren lleva retraso.
  fa.a2.unit15.lesson01.teach.platform_word:
    title: Andén
    gloss: andén
    note: '*سکو* es la palabra para el andén de una estación de tren; *سکوی* es su forma con ezafe ante un número, p. ej. *سکوی سه* (andén tres).'
    example_gloss: El tren sale del andén tres.
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: Cancelado
    gloss: cancelado
    note: '*لغو* es la palabra para cancelado; *لغو شدن* (ser cancelado) es el verbo compuesto formado con ella.'
    example_gloss: Cancelaron el billete de tren.
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: Anuncio
    gloss: anuncio
    note: '*اعلامیه* es la palabra para un anuncio o aviso escrito.'
    example_gloss: Este anuncio es muy importante.
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: Ruta alternativa
    gloss: ruta alternativa
    note: '*مسیر جایگزین* combina *مسیر* (ruta) con *جایگزین* (alternativa/sustituto).'
    example_gloss: La ruta alternativa sale del andén cinco.
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: Horas y números de esta unidad
    gloss: las nueve, las diez, tres, cinco
    note: Repaso de los números y las horas que necesita la situación de esta unidad.
  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: Disculpe, ¿cuándo sale el tren?
    gloss: Disculpe, ¿cuándo sale el tren?
    note: '*ببخشید* abre con cortesía una pregunta a un desconocido o a un empleado.'
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
    title: ¿Hay una ruta alternativa?
    gloss: ¿Hay una ruta alternativa?
    note: '*هست؟* (¿hay?) es la pregunta básica de existencia para saber si algo está disponible.'
  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: Preguntar con cortesía por una alternativa más rápida
    gloss: Disculpe, ¿hay una ruta alternativa para llegar antes?
    note: '*که زودتر برسم* (para llegar antes) añade la finalidad a la simple pregunta de existencia.'
  fa.a2.unit15.lesson03.teach.because_of_note:
    title: Por causa de (+ sustantivo)
    gloss: a causa de ...
    note: '*به خاطر* va seguido directamente de un SUSTANTIVO (*به خاطر مشکل فنی*, a causa de un problema técnico), a diferencia de *چون*, que introduce una oración completa.'
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: Problema técnico
    gloss: problema técnico
    note: '*مشکل فنی* es la expresión habitual para un problema técnico, frecuente en los avisos de viaje.'
    example_gloss: El tren lleva retraso a causa de un problema técnico.
  fa.a2.unit15.lesson03.teach.notice_text:
    title: Un aviso de la estación sobre un retraso
    gloss: 'Atención: el tren de las nueve a Isfahán lleva una hora de retraso por un problema técnico y sale a las diez del andén tres. El autobús alternativo sale a las nueve y media del andén cinco.'
    note: Un breve aviso oficial de estación en estilo escrito neutro, aunque aún usa las terminaciones verbales de la lengua hablada cotidiana (*داره*, *می‌کنه*).
  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: Esperaré el tren
    gloss: Esperaré el tren.
    note: '*منتظر ... می‌مونم* (me quedo esperando ...) es la forma habitual de decir que esperarás algo.'
  fa.a2.unit15.lesson04.teach.turn01:
    title: نیما pregunta cuándo sale el tren
    gloss: نیما pregunta con cortesía cuándo sale el tren de las nueve a Isfahán.
    note: Reutiliza la frase de apertura de esta misma lección.
  fa.a2.unit15.lesson04.teach.turn02:
    title: کارمند explica el retraso
    gloss: El empleado dice que, por desgracia, por un problema técnico lleva una hora de retraso y ahora sale a las diez del andén tres.
    note: '*متاسفانه* (por desgracia) suaviza la comunicación de una mala noticia.'
  fa.a2.unit15.lesson04.teach.turn03:
    title: نیما pregunta por una alternativa
    gloss: نیما pregunta si hay una ruta alternativa para llegar antes.
    note: Reutiliza la pregunta completa sobre la ruta alternativa de la lección 2.
  fa.a2.unit15.lesson04.teach.turn04:
    title: کارمند ofrece el autobús alternativo
    gloss: El empleado dice que sí, que sale un autobús a las nueve y media del andén cinco, pero que Nima tendría que comprar un billete nuevo.
    note: '*باید ... بخرید* (tendría que comprar) indica el coste real de la alternativa.'
  fa.a2.unit15.lesson04.teach.turn05:
    title: نیما lo rechaza y espera
    gloss: 'نیما dice que no, que no pasa nada: esperará el tren.'
    note: '*مشکلی نیست* (no hay problema / está bien) rechaza la oferta con cortesía.'
  fa.a2.unit15.lesson04.teach.turn06:
    title: کارمند confirma el plan
    gloss: El empleado dice que de acuerdo, que entonces espere en el andén tres a las diez.
    note: '*پس* (entonces) extrae la conclusión de lo que acaba de decidir نیما.'
