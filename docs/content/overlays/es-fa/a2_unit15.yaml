course:
  title: Persa A2
  description: 'Farsi iraní de nivel intermedio bajo: cómo afrontar el retraso de un tren: entender un aviso de incidencia, preguntar con cortesía a un empleado de la estación por una ruta alternativa y leer un aviso escrito sobre el mismo retraso.'
units:
  fa.a2.unit15.travel_disruption:
    title: Problemas de viaje
lessons:
  fa.a2.unit15.lesson01.travel_disruption_vocabulary:
    title: Palabras de retraso
  fa.a2.unit15.lesson02.asking_about_alternatives:
    title: Preguntar por una ruta alternativa
  fa.a2.unit15.lesson03.reading_a_station_notice:
