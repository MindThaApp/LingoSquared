      status: correct
    feedback: چ representa el sonido ch.
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: Relaciona cada letra con su sonido aproximado.
    accepted_answers:
    - value:
        ی: y (i)
        ه: h
        ک: k
        گ: g
        و: v / o
        ب: b
        خ: j (como la «j» española)
        ز: z
      status: correct
    feedback: ی puede representar y o i larga; ه es h; ک es k y گ es g; و puede representar v o una vocal y ب es b; خ se romaniza comúnmente como kh y ز es z.
    pairs:
    - left: ی
      right: y (i)
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: v / o
    - left: ب
      right: b
    - left: خ
      right: j (como la «j» española)
    - left: ز
      right: z
