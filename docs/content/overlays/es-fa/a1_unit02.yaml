    instruction: '¿Qué conjunto son: palabras de nacionalidad o nombres de países?'
    correct_option: iraní / inglés / francés (adjetivos de nacionalidad)
    distractors:
    - Irán / Inglaterra / Francia (nombres de países)
    - país / nacionalidad / Irán
