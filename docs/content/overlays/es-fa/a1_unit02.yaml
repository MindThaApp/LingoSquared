course:
  title: Persa A1
  description: Persa iraní para principiantes, centrado en leer la escritura, entender el habla cotidiana y desenvolverte con cortesía en conversaciones prácticas.
units:
  fa.a1.unit02.introductions:
    title: Nombres, orígenes y presentaciones
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Lee las letras usadas en las presentaciones
  fa.a1.unit02.lesson02.names:
    title: Preguntar y decir un nombre
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Pronombres singulares y el verbo ser
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Países y nacionalidades
  fa.a1.unit02.lesson05.origin:
    title: Preguntar de dónde es alguien
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Un encuentro en una clase de farsi
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Las letras ن y ت
    gloss: n y t
    note: ن representa n. ت representa t; ambas se unen a ambos lados.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Las letras ش y چ
    gloss: sh y ch
    note: ش representa sh y چ representa ch.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Las letras ی y ه
    gloss: y / i larga y h
    note: ی suena como y o como una ī larga. ه es h y cambia de forma al unirse a otras letras.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Las letras ک y گ
    gloss: k y g
    note: ک representa k; al escribir con teclado, usa la ک persa, no la letra árabe de aspecto parecido. گ añade un trazo extra a ک y representa g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Las letras ج y د
    gloss: y (como en «yeah» suave, sonido j) y d
    note: ج representa el sonido j. د representa d y no se une a la letra siguiente (a su izquierda).
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Las letras ر y ف
    gloss: r y f
    note: ر representa r y no se une a la letra siguiente; ف representa f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Las letras و y ب
    gloss: v/o/u y b
    note: و puede representar v o una vocal y no se une a la letra siguiente. ب representa b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Las letras خ y ز
    gloss: kh y z
    note: خ es el sonido que suele escribirse kh (como la «j» española); ز representa z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Nombre
    gloss: nombre
    note: اسم se lee esm en el persa corriente de Irán.
    example_gloss: Me llamo Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: yo
    gloss: yo
    note: من es el pronombre de primera persona del singular.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا es un nombre de pila iraní muy común.
    example_gloss: Sara es mi amiga.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Presentación formal o escrita
    gloss: Me llamo Sara.
    note: '*اسم من سارا است* es correcto pero formal; lo verás sobre todo por escrito.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Presentación natural en lengua hablada
    gloss: Me llamo Sara.
    note: اسمم es la contracción de اسم من, y ساراست une سارا y است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Preguntar el nombre con cortesía
    gloss: ¿Cómo te llamas?
    note: اسم شما چیه؟ es persa hablado de Irán, neutro y cortés.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Preguntar el nombre de manera informal
    gloss: ¿Cómo te llamas?
    note: اسمت چیه؟ es singular e informal; úsalo solo cuando la relación lo permita.
  fa.a1.unit02.lesson03.teach.man:
    title: yo
    gloss: yo
    note: من no tiene género gramatical.
  fa.a1.unit02.lesson03.teach.to:
    title: Tú, singular informal
    gloss: usted
    note: تو es singular e informal; para el trato cortés se usa normalmente شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Él o ella
    gloss: él / ella
    note: او no distingue género y puede referirse tanto a un hombre como a una mujer.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Yo soy
    gloss: soy / estoy
    note: هستم es la forma plena de la primera persona del singular de بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Tú eres
    gloss: usted es; ustedes son
    note: هستی concuerda con تو, singular informal.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Él o ella es
    gloss: él/ella es; él/ella está presente
    note: هست es la forma plena de la tercera persona del singular y a menudo expresa existencia o énfasis.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Atributo de identidad en registro formal
    gloss: Es iraní.
    note: En una oración formal escrita que expresa identidad, است es la cópula ordinaria de tercera persona.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Atributo de identidad en lengua hablada
    gloss: Es iraní.
    note: ایرانیه es la contracción hablada natural de ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Irán
    gloss: Irán
    note: ایران es el nombre de un país.
    example_gloss: Soy de Irán.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Iraní
    gloss: iraní
    note: ایرانی puede indicar nacionalidad u origen.
    example_gloss: Soy iraní.
  fa.a1.unit02.lesson04.teach.england:
    title: Inglaterra
    gloss: Inglaterra
    note: '*انگلیس* suele significar Inglaterra; en el habla cotidiana los iraníes a menudo lo usan para todo el Reino Unido.'
    example_gloss: Soy de Inglaterra.
  fa.a1.unit02.lesson04.teach.english:
    title: inglés
    gloss: inglés
    note: 'انگلیسی puede indicar la nacionalidad, el idioma o algo relacionado con Inglaterra; el contexto aclara el significado. Es invariable: no cambia según el género.'
    example_gloss: Soy inglés.
  fa.a1.unit02.lesson04.teach.france:
    title: Francia
    gloss: Francia
    note: فرانسه es el nombre del país Francia.
    example_gloss: Soy de Francia.
  fa.a1.unit02.lesson04.teach.french:
    title: francés
    gloss: francés
    note: 'فرانسوی puede indicar la nacionalidad o algo relacionado con Francia. Es invariable: no cambia según el género.'
    example_gloss: Soy francés.
  fa.a1.unit02.lesson04.teach.country:
    title: País
    gloss: país
    note: کشور es la palabra general para «país».
    example_gloss: Irán es un país.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Nacionalidad
    gloss: nacionalidad
    note: ملیت es el sustantivo formal para «nacionalidad».
    example_gloss: ¿Cuál es su nacionalidad?
  fa.a1.unit02.lesson05.teach.ahl:
    title: De / originario de
    gloss: de / originario de
    note: اهل une a una persona con su lugar de origen; no significa simplemente que viva actualmente en un lugar.
    example_gloss: Él/ella es de Inglaterra.
  fa.a1.unit02.lesson05.teach.koja:
    title: Dónde
    gloss: dónde
    note: کجا sirve para preguntar por un lugar.
    example_gloss: ¿De dónde es usted?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Pregunta formal estándar
    gloss: ¿De dónde eres?
    note: اهل کجا هستید؟ es persa estándar cortés y encaja en el habla formal o en la lectura cuidada.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Pregunta hablada neutra y cortés
    gloss: ¿De dónde eres?
    note: اهل کجا هستین؟ es la forma hablada cortés habitual en el persa de Irán.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Pregunta informal
    gloss: ¿De dónde eres?
    note: اهل کجایی؟ es la forma informal en singular.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Indicar el lugar de origen
    gloss: Soy de Irán.
    note: من اهل ایران هستم indica el origen, no el lugar de residencia actual.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Respuesta breve sobre la nacionalidad
    gloss: Soy iraní.
    note: '*ایرانی‌ام* añade la terminación *ـام* (soy) a *ایرانی*, escrita con un pequeño semiespacio antes de la terminación.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Comprobar el lugar
    gloss: Sara pregunta si esta es la clase de farsi.
    note: ببخشید sirve para llamar la atención con cortesía antes de una pregunta práctica.
  fa.a1.unit02.lesson06.teach.yes:
    title: Sí
    gloss: sí
    note: بله es la palabra neutra y cortés para «sí».
    example_gloss: Sí, claro.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina se presenta
    gloss: Mina confirma el lugar, se presenta y pregunta el nombre de Sara.
    note: La pregunta hablada y cortés es adecuada para dos adultos que se conocen en una clase.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara dice su nombre
    gloss: Me llamo Sara.
    note: Sara usa el patrón hablado compacto que se vio antes.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina pregunta por el origen
    gloss: ¿De dónde eres?
    note: هستین mantiene el intercambio cortés pero conversacional.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Intercambiar orígenes
    gloss: Sara dice que es de Inglaterra y pregunta si Mina es de Irán.
    note: Las dos hablantes mantienen las formas corteses porque acaban de conocerse.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Intercambiar orígenes, respuesta
    gloss: Mina confirma que es iraní.
    note: '*ایرانی‌ام* es la forma corta de *ایرانی هستم* (soy iraní).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Responder a la presentación
    gloss: Sara dice que mucho gusto en conocer a Mina.
    note: از آشنایی با شما خوشوقتم es un cierre natural para su intercambio.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Devolver el saludo y entrar en la clase
    gloss: Mina dice que el gusto es suyo también e invita a Sara a pasar.
    note: من هم همین‌طور responde al saludo cortés de Sara antes de que بفرمایید داخل haga avanzar la escena de la clase.
