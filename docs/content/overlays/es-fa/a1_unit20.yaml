teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: Camisa
    gloss: camisa
    note: پیراهن es una palabra general para «camisa».
    example_gloss: Quiero una camisa.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: Pantalones
    gloss: pantalón
    note: شلوار significa «pantalón».
    example_gloss: ¿Cuánto cuestan estos pantalones?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: Zapatos
    gloss: zapatos
    note: کفش significa «zapatos».
    example_gloss: ¿Tiene zapatos?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Chaqueta
    gloss: chaqueta
    note: کت significa «chaqueta» (como la de un traje o un blazer); un abrigo grueso de invierno suele llamarse de otra manera.
    example_gloss: Quiero una chaqueta.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Bonito
    gloss: bonito
    note: قشنگ es una palabra cotidiana muy común para «bonito», y suele usarse con la contracción -e (قشنگه).
    example_gloss: Esta chaqueta es bonita.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Quiero (repaso)
    gloss: quiero
    note: '*می‌خوام* es la forma hablada habitual de *می‌خواهم*. Ya la viste en una unidad anterior; en esta se usa para pedir prendas de ropa.'
    target_text: می‌خوام (quiero)
  fa.a1.unit20.lesson01.teach.va_word:
    title: Y (repaso)
    gloss: y
    note: '*و* es la palabra de enlace habitual para «y», que repasas de una unidad anterior.'
    target_text: و (y)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Color
    gloss: color
    note: رنگ es la palabra general para «color».
    example_gloss: ¿Qué color quiere?
  fa.a1.unit20.lesson02.teach.red_word:
    title: Rojo
    gloss: rojo
    note: قرمز significa «rojo».
    example_gloss: Esta camisa es roja.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: Azul
    gloss: azul
    note: آبی significa «azul»; con la contracción -e (آبیه) se dice «es azul».
    example_gloss: Mi pantalón es azul.
  fa.a1.unit20.lesson02.teach.black_word:
    title: Negro
    gloss: negro
    note: سیاه significa «negro».
    example_gloss: Los zapatos negros son bonitos.
  fa.a1.unit20.lesson02.teach.white_word:
    title: Blanco
    gloss: blanco
    note: سفید significa «blanco».
    example_gloss: Quiero una chaqueta blanca.
  fa.a1.unit20.lesson03.teach.size_word:
    title: Talla
    gloss: talla
    note: سایز es la palabra cotidiana para «talla» de ropa.
    example_gloss: ¿Qué talla quiere?
  fa.a1.unit20.lesson03.teach.big_word:
    title: Grande
    gloss: grande
    note: بزرگ significa «grande».
    example_gloss: Quiero una talla grande.
  fa.a1.unit20.lesson03.teach.small_word:
    title: Pequeño
    gloss: pequeño
    note: کوچیک significa «pequeño»; con la contracción -e (کوچیکه) se dice «es pequeño».
    example_gloss: Estos zapatos son pequeños.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: Mediana
    gloss: mediano
    note: متوسط significa «mediano» o de talla media.
    example_gloss: ¿Tiene talla mediana?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: Pedir probarse algo
    gloss: ¿Puedo probármelo?
    note: می‌تونم امتحانش کنم؟ es la forma coloquial habitual de pedir probarse una prenda.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: Sí, adelante
    gloss: Sí, dígame.
    note: '*بله، بفرمایید* es una forma cortés en que el vendedor responde afirmativamente; reutiliza *بفرمایید* de una unidad anterior.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: La contracción coloquial می‌تونم (repaso)
    gloss: puedo (forma hablada)
    note: 'En el habla cotidiana, el -ان- escrito suele pasar a -ون-: *می‌توانم* se convierte en *می‌تونم* (puedo). Ya viste el mismo cambio en *تومن*, la forma hablada de *تومان*.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: Una etiqueta de ropa
    gloss: 'Talla: grande. Color: rojo.'
    note: Una etiqueta corta de ropa, con el mismo formato que verías en una prenda real.
