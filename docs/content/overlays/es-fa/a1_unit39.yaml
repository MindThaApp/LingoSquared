    example_gloss: ¡Se necesita la policía!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulancia
    gloss: ambulancia
    note: '*آمبولانس* significa «ambulancia».'
    example_gloss: ¡Se necesita una ambulancia!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: Bomberos
    gloss: bomberos
    note: '*آتش‌نشانی* significa «bomberos» o «cuerpo de bomberos».'
