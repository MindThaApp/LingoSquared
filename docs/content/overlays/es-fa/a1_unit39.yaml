    title: Sobre este aviso
    gloss: Accidente / peligro / fuego
    note: En el aviso, cada tipo de emergencia va seguido de un signo de interrogación, como si se preguntara «¿En caso de accidente?». El servicio al que hay que llamar viene justo después.
