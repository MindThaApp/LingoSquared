    title: 'Lectura: aviso de emergencia'
    gloss: ¿Accidente? ¡Se necesita una ambulancia! ¿Peligro? ¡Se necesita la policía! ¿Fuego? ¡Se necesitan los bomberos! ¡Llamen rápido!
    note: Un aviso breve que indica a qué servicio llamar según el tipo de emergencia.
