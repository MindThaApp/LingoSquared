course:
  title: Persa A1
  description: 'Persa de Irán para principiantes: nombrar los tres servicios de emergencia (policía, ambulancia, bomberos), decir qué se necesita, pedir ayuda con órdenes corteses, un diálogo con una llamada de emergencia y la lectura de un breve aviso de emergencia.'
