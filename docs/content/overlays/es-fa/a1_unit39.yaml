    example_gloss: ¡Fuego! ¡Se necesitan los bomberos!
  fa.a1.unit39.lesson02.teach.khatar:
    title: Peligro
    gloss: peligro
    note: '*خطر* significa «peligro».'
    example_gloss: ¡Peligro! ¡Se necesita la policía!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Repaso: órdenes formales e informales'
    gloss: ¡haga! o ¡hagan! (formal) / ¡haz! (informal)
    note: '*کنید* es la terminación del imperativo formal o plural. La forma informal *کن*, que usaste con amigos en *استراحت کن* («descansa»), es la que se usa para una sola persona cercana.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: ¡Ayuda!
    gloss: ¡Ayuda!
    note: '*کمک کنید!* es la forma cortés de pedir ayuda, adecuada para desconocidos y servicios de emergencia.'
