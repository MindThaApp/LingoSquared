teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: Palabras para abrir y cerrar
    gloss: hola, qué tal, qué hay de nuevo, perdona, hasta luego
    note: Un mensaje amistoso empieza con *سلام* y el nombre, y luego suele llevar *خوبی؟* o *چه خبر؟*. *ببخش که ...* es una disculpa breve. *فعلا* cierra un mensaje como «hasta luego».
    example_gloss:
    - Hola, Nima, ¿qué tal?
    - ¿Qué hay de nuevo?
    - Perdona que no te llamé.
    - Hasta luego, Sara
  fa.a2.unit48.lesson01.teach.time_words:
    title: Palabras de tiempo para un mensaje
    gloss: ayer, el fin de semana, viernes, sábado, mañana, más tarde
    note: 'Pon primero la palabra de tiempo: indica a tu amigo si hablas de lo que pasó o de lo que viene después.'
    example_gloss:
    - Ayer estaba cansado.
    - El fin de semana tuve trabajo.
    - El viernes fui al parque.
    - Mañana te llamo.
    - El sábado vendré.
    - Más tarde te llamo.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: La estructura de un mensaje amistoso
    gloss: Hola, Sara, ¿qué tal? El viernes fui al parque. Mañana quiero ir al cine. Hasta luego, Nima
    note: 'Un mensaje informal tiene cuatro partes: saludo, lo que pasó (pasado), lo que viene (futuro) y despedida. Las frases cortas y las formas habladas *می‌خوام* y *بهت* son normales; no hace falta un encabezado de carta formal.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: Cumpleaños y regalo
    gloss: cumpleaños (fiesta), regalo
    note: '*تولد* es un cumpleaños, y al hablar *رفتم تولد دوستم* también significa «fui a la fiesta de cumpleaños de mi amigo».'
    example_gloss:
    - El viernes fui al cumpleaños de mi amigo.
    - Compré un regalo para mi amigo.
    - Sara tiene un regalo.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: Celebraciones y felicitaciones
    gloss: fiesta, boda, felicitación, feliz
    note: '*جشن* es una fiesta o celebración, *عروسی* es una boda, y *مبارک* va después de la ocasión en felicitaciones breves y amistosas.'
    example_gloss:
    - El viernes fui a una fiesta.
    - La boda fue el viernes.
    - ¡Feliz cumpleaños, felicidades!
  fa.a2.unit48.lesson02.teach.message_news:
    title: Compartir noticias en un mensaje
    gloss: envié, oí, éxito, gracias
    note: Usa estas palabras para decir lo que enviaste o oíste y para reaccionar al éxito de un amigo.
    example_gloss:
    - Envié un mensaje.
    - Oí la noticia.
    - ¡Felicidades por tu éxito!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: Verbos en pasado para contar lo que pasó
    gloss: fui, vi, comí, vine, me quedé, compré, escribí, fuimos
    note: 'La terminación del pasado es *ـم* para «yo» y *ـیم* para «nosotros». La negación añade *ن*: *نرفتم*, *نیومدم*, *نزدم*.'
    example_gloss:
    - Ayer fui al cine.
    - Vi una película.
    - Cené y volví a casa.
    - El sábado me quedé en casa.
    - Te escribí un mensaje.
    - Sara y yo fuimos al parque.
  fa.a2.unit48.lesson02.teach.past_story:
    title: Contar los hechos en orden
    gloss: El viernes fui al cumpleaños de mi amigo y compré un regalo; fuimos al cine y después cenamos
    note: Di primero el momento y luego los hechos en el orden en que ocurrieron. Únelos con *و* y usa *بعدش* («después de eso») para marcar el paso siguiente. Todos los verbos van en pasado simple.
  fa.a2.unit48.lesson03.teach.want_to:
    title: Decir lo que vas a hacer
    gloss: quiero ir, quiero venir, quiero comprar, quiero comer
    note: '*می‌خوام* más un verbo corto (*برم*, *بیام*, *بخرم*, *بخورم*) es la forma habitual de decir lo que vas a hacer. En un mensaje suena a plan, no solo a deseo.'
    example_gloss:
    - Mañana quiero ir al cine.
    - El sábado quiero venir.
    - Quiero comprar un regalo.
    - Después del cine quiero cenar.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: Sentimientos y recuerdos
    gloss: recuerdo, disgustado, echar de menos, interesante
    note: '*ناراحت* dice que estás disgustado, mientras que *دلتنگ* dice que echas de menos a alguien. *جالب* describe algo interesante.'
    example_gloss:
    - El recuerdo era interesante.
    - Ayer estaba disgustado.
    - Te echaba de menos.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: El presente simple para los planes
    gloss: vendré, iré, compraré, te llamaré
    note: Con una palabra de tiempo como *فردا* o *بعدا*, el presente simple también expresa futuro. Tanto *می‌خوام برم* como *می‌رم* sirven en un mensaje.
    example_gloss:
    - El sábado vendré.
    - Mañana voy al parque.
    - Más tarde compro un regalo.
    - Mañana te llamo.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: Qué viene ahora
    gloss: Mañana quiero ir al cine; después del cine te llamo
    note: Pon primero la palabra de tiempo y luego el plan. Usa *بعد از* con un lugar o un evento (*بعد از سینما*) y *بعدش* cuando el paso anterior ya está claro.
  fa.a2.unit48.lesson04.teach.reasons:
    title: Motivos en pasado
    gloss: estaba cansado, tenía trabajo, estaba enfermo, hacía buen tiempo
    note: 'Las razones sobre el pasado van en pasado: *بودم*, *داشتم*. El tiempo atmosférico va en tercera persona: *هوا خوب بود*.'
    example_gloss:
    - Ayer estaba cansado.
    - El fin de semana tuve trabajo.
    - El sábado estaba enfermo.
    - El viernes hizo buen tiempo.
  fa.a2.unit48.lesson04.teach.because_so:
    title: Porque y por eso
    gloss: Como estaba cansado, no vine; estaba cansado, por eso no vine
    note: '*چون* introduce la causa: *چون خسته بودم، نیومدم* o *نیومدم، چون خسته بودم*. *برای همین* introduce el resultado y va después de la causa: *خسته بودم، برای همین نیومدم*. No pongas ambos en una misma frase.'
  fa.a2.unit48.lesson05.teach.reading:
    title: Un mensaje de Nima
    gloss: Hola, Sara, ¿qué tal? Perdona que no te llamé, porque el fin de semana tuve mucho trabajo. El viernes fui al cumpleaños de mi amigo y compré un regalo. El cumpleaños estuvo muy bien, pero llegué tarde a casa y estaba cansado. Por eso el sábado no fui a clase. Mañana quiero ir al cine y después del cine te llamo. Hasta luego, Nima
    note: Lee una vez para ver las cuatro partes (saludo, lo que pasó, lo que viene, despedida) y otra vez para fijarte en las razones.
  fa.a2.unit48.lesson06.teach.turn01:
    title: Sara pregunta qué hay de nuevo
    gloss: ¡Hola, Nima! ¿Qué hay de nuevo? ¿Qué hiciste el fin de semana?
    note: Sara saluda a Nima y le pregunta qué hizo.
  fa.a2.unit48.lesson06.teach.turn02:
    title: Nima cuenta lo que pasó
    gloss: ¡Hola, Sara! El viernes fui al cumpleaños de mi amigo. Compré un regalo y estuvo muy bien.
    note: Nima usa el pasado simple para los hechos.
  fa.a2.unit48.lesson06.teach.turn03:
    title: Sara pregunta por el sábado
    gloss: ¡Genial! ¿Y el sábado?
    note: Una pregunta breve para continuar.
  fa.a2.unit48.lesson06.teach.turn04:
    title: Nima da una razón
    gloss: El sábado me quedé en casa porque estaba cansado.
    note: '*چون* da la razón.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: Sara pregunta por mañana
    gloss: ¿Qué quieres hacer mañana?
    note: Sara pregunta por el plan.
  fa.a2.unit48.lesson06.teach.turn06:
    title: Nima dice lo que viene después
    gloss: Mañana quiero ir al cine. Después del cine te llamo.
    note: Los planes usan *می‌خوام* y el presente simple.
  fa.a2.unit48.lesson06.teach.turn07:
    title: Sara se despide
    gloss: Vale. ¡Hasta luego!
    note: La conversación termina con *فعلا*.
