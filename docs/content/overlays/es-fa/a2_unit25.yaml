teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    title: Alguna vez, nunca, todavía, antes, una vez
    gloss: alguna vez / hasta ahora; nunca; todavía / aún; antes; una vez
    note: '*تا حالا* introduce una experiencia de vida. Usa *هیچ‌وقت* con un verbo negativo para decir «nunca», y *هنوز* con un verbo negativo para decir «todavía no».'
    example_gloss:
    - ¿Has estado alguna vez en Shiraz?
    - Nunca he comido comida india.
    - Todavía no he estado en Isfahán.
    - Ya he visto esta película antes.
    - Me he subido a un caballo una vez.
  fa.a2.unit25.lesson01.teach.people_places:
    title: Personas y lugares
    gloss: yo, tú, Sara, Nima, Shiraz, Isfahán
    note: En persa se omiten a menudo *من* y *تو*, porque la terminación del verbo indica la persona, como en español. Sara y Nima son amigos ya conocidos.
    example_gloss:
    - He estado en Shiraz.
    - ¿Has estado en Isfahán?
    - Sara ya ha estado en Shiraz antes.
    - Nima todavía no ha estado en Isfahán.
    - He estado en Shiraz.
    - No he estado en Isfahán.
  fa.a2.unit25.lesson01.teach.experiences:
    title: Comida, películas y montar
    gloss: comida india, comida coreana, película, a caballo
    note: '*رو* es el marcador hablado del objeto directo en *این فیلم رو دیده‌م*. La expresión *سوار اسب شدن* significa montar a caballo.'
    example_gloss:
    - He comido comida india.
    - No he comido comida coreana.
    - He visto esta película.
    - He montado a caballo.
  fa.a2.unit25.lesson01.teach.perfect_shape:
    title: El pretérito perfecto hablado
    gloss: he ido, he comido, he visto, me he vuelto / he montado
    note: 'El pretérito perfecto se forma con el participio pasado en *-ه* más una terminación de persona corta. Para «yo», el persa hablado añade *-م*: *رفت + ه + م* → *رفته‌م*.'
  fa.a2.unit25.lesson01.teach.negative_shape:
    title: Pretérito perfecto negativo
    gloss: no he ido, no he comido, no he visto, no me he vuelto / no he montado
    note: 'Pon *نـ* al principio del participio: *رفته‌م* → *نرفته‌م*. Con *هیچ‌وقت*, el verbo debe seguir siendo negativo.'
  fa.a2.unit25.lesson01.teach.written_recognition:
    title: 'Forma escrita: solo para reconocer'
    gloss: رفته‌ام es el equivalente escrito de رفته‌م, que es la forma hablada
    note: En textos escritos cuidados puedes ver *رفته‌ام*. Reconócelo, pero usa la forma coloquial *رفته‌م* en las actividades de producción de esta unidad.
  fa.a2.unit25.lesson02.teach.verbs:
    title: Cuatro verbos de experiencia
    gloss: ir, comer, ver, volverse / hacerse
    note: Sus participios son *رفته، خورده، دیده، شده*. Con *سوار اسب*, *شدن* forma la experiencia «montar a caballo».
    example_gloss:
    - Ir a Shiraz es agradable.
    - Comer comida india es agradable.
    - Ver esta película es agradable.
    - Montar a caballo es agradable.
  fa.a2.unit25.lesson02.teach.pronouns:
    title: Él/ella, nosotros, ustedes, ellos
    gloss: él/ella, nosotros, ustedes (plural/formal), ellos
    note: Estos pronombres hacen visibles las terminaciones de persona. En una conversación normal, omite el pronombre cuando el contexto ya está claro.
    example_gloss:
    - Él/ella ha estado en Shiraz.
    - Hemos estado en Shiraz.
    - ¿Han estado ustedes en Shiraz?
    - Ellos han estado en Shiraz.
  fa.a2.unit25.lesson02.teach.clitics:
    title: Terminaciones de persona
    gloss: yo, tú, él/ella, nosotros, ustedes, ellos hemos ido
    note: El conjunto hablado es *-م، -ای،* sin terminación, *-ایم، -این، -ن*. Esta unidad practica solo las formas que se muestran aquí.
  fa.a2.unit25.lesson02.teach.other_participles:
    title: Las mismas terminaciones en otros participios
    gloss: tú has / él/ella ha comido, visto, montado
    note: 'La terminación de persona se une a cada participio de la misma manera: *خورده‌ای، دیده‌ای، شده‌ای*.'
  fa.a2.unit25.lesson03.teach.specific_time:
    title: El año pasado, ayer
    gloss: el año pasado, ayer
    note: Estas palabras indican un tiempo terminado, así que se usa el pasado simple y no el pretérito perfecto de experiencia.
    example_gloss:
    - El año pasado fui a Shiraz.
    - Ayer comí comida india.
  fa.a2.unit25.lesson03.teach.simple_past:
    title: Hecho terminado frente a experiencia
    gloss: El año pasado fui a Shiraz. He estado en Shiraz.
    note: '*پارسال* indica cuándo ocurrió, así que se usa *رفتم*. Con *تا حالا* y sin un tiempo terminado, se usa *رفته‌م* para una experiencia de vida.'
  fa.a2.unit25.lesson04.teach.responses:
    title: Sí; yo también
    gloss: sí; yo también
    note: Responde a una pregunta sobre experiencias con la misma forma del pretérito perfecto. *منم* significa «yo también».
    example_gloss:
    - Sí, he ido una vez.
    - Yo tampoco lo he comido todavía.
  fa.a2.unit25.lesson04.teach.question_pattern:
    title: ¿Has estado alguna vez en Shiraz?
    gloss: ¿Has estado alguna vez en Shiraz?
    note: 'Usa *تا حالا* con el pretérito perfecto en segunda persona *رفته‌ای؟* para preguntar por una experiencia. En el habla cotidiana se usa a menudo el pretérito simple con *تا حالا*: *تا حالا رفتی؟*. Ambas formas son correctas.'
  fa.a2.unit25.lesson05.teach.reading:
    title: Un mensaje sobre experiencias
    gloss: He estado en Shiraz y antes he comido comida india. Nunca he montado a caballo y todavía no he comido comida coreana. ¿Has estado alguna vez en Shiraz?
    note: Lee una primera vez para fijarte en las experiencias que sí han ocurrido y una segunda vez para ver las que nunca han ocurrido o todavía no han ocurrido.
  fa.a2.unit25.lesson06.teach.turn01:
    title: Sara le pregunta a Nima
    gloss: Nima, ¿has estado alguna vez en Shiraz?
    note: Sara hace una pregunta sobre experiencias con *تا حالا*.
  fa.a2.unit25.lesson06.teach.turn02:
    title: Nima responde y pregunta
    gloss: Sí, he estado una vez. ¿Has comido alguna vez comida india?
    note: Nima cuenta una experiencia y devuelve una nueva pregunta sobre experiencias.
  fa.a2.unit25.lesson06.teach.turn03:
    title: Sara contrasta dos comidas
    gloss: Sí, la he comido antes, pero nunca he comido comida coreana.
    note: '*ولی* contrasta una experiencia positiva con algo que Sara nunca ha hecho.'
  fa.a2.unit25.lesson06.teach.turn04:
    title: Nima está de acuerdo
    gloss: Yo tampoco lo he comido todavía.
    note: '*هنوز نخورده‌م* significa que no ha ocurrido hasta ahora.'
