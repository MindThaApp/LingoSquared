teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Teléfono
    gloss: teléfono
    note: تلفن es la palabra general para «teléfono».
    example_gloss: ¿Dónde está mi teléfono?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Mensaje
    gloss: mensaje
    note: پیام es un mensaje escrito o de texto.
    example_gloss: Tengo un mensaje.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Llamar
    gloss: llamar
    note: زنگ زدن (literalmente «hacer sonar») es el verbo habitual para llamar a alguien por teléfono.
    example_gloss: Llámame.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Voz
    gloss: voz
    note: صدا significa «voz» y se usa para describir cómo suena alguien en una llamada.
    example_gloss: Tu voz suena bien.
  fa.a1.unit22.lesson01.teach.va_word:
    title: Y
    gloss: y
    note: و es la palabra habitual para unir elementos («y»); es un repaso de unidades anteriores.
    target_text: و (y)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Hola (al teléfono)
    gloss: hola, dígame
    note: الو es el saludo propio del teléfono (no se usa cara a cara); بفرمایید aquí significa algo como «dime, te escucho».
  fa.a1.unit22.lesson02.teach.its_me:
    title: Soy yo, Narges
    gloss: hola, soy yo, Narges
    note: '*منم* es *من* (yo) más la terminación verbal -م («soy»), así que significa «soy yo», una forma muy común de identificarte en una llamada. (La misma grafía también puede significar «yo también», que es *من هم*; aquí el contexto lo deja claro.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: ¿Puedes repetirlo?
    gloss: ¿puede repetir eso?
    note: می‌شه (forma coloquial de می‌شود, «es posible») + تکرار کنید (repita) es la fórmula estándar para pedir algo con cortesía.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Por favor, hable más despacio
    gloss: por favor, hable más despacio
    note: 'آهسته‌تر es el comparativo de آهسته (despacio): «más despacio».'
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Tengo un mensaje para ti
    gloss: tengo un mensaje para ti
    note: برات contrae برای («para») + ت («ti», informal).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Ven a la cafetería mañana a las cuatro
    gloss: ven a la cafetería mañana a las cuatro
    note: بیا es el imperativo informal formado con la raíz sola del verbo آمدن (venir), el mismo patrón ya visto en otros imperativos del A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Adiós, hablamos luego
    gloss: adiós, hablamos luego
    note: بعداً significa «luego»; صحبت می‌کنیم es el presente/futuro «hablamos / hablaremos».
  fa.a1.unit22.lesson05.teach.better_now:
    title: ¿Ya está mejor?
    gloss: ¿ya está mejor?
    note: الان significa «ahora»; بهتر شد significa literalmente «se volvió mejor», la forma natural en pasado que usa el farsi para esta pregunta, mientras que en español solemos decir «¿ya está mejor?» en presente.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Hola, Narges, ¿cómo estás?
    gloss: hola, Narges, ¿cómo estás?
    note: '*چطوری* es el «¿cómo estás?» informal, apropiado aquí porque Ali y Narges son amigos.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Se te corta la voz
    gloss: se te corta la voz
    note: 'قطع و وصل می‌شه significa literalmente «se corta y se conecta»: la expresión natural en persa para una llamada con mala señal.'
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali contesta
    gloss: 'Ali: Hola, dime.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges se identifica
    gloss: 'Narges: Hola, Ali, soy yo, Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali devuelve el saludo
    gloss: 'Ali: Hola, Narges, ¿cómo estás?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges le pide que hable más despacio
    gloss: 'Narges: Estoy bien, gracias. ¿Puedes hablar más despacio, por favor? Se te corta la voz.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali comprueba
    gloss: 'Ali: Vale, ¿ya está mejor?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges da el mensaje
    gloss: 'Narges: Sí, mejor. Tengo un mensaje para ti: ven mañana a la cafetería a las cuatro.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Ellos van (informal)
    gloss: ellos van (forma hablada)
    note: '*می‌رن* es la forma hablada informal de *می‌روند* (ellos van), en el mismo registro coloquial del resto del curso.'
    target_text: می‌رن (ellos van, informal/coloquial)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali confirma
    gloss: 'Ali: Vale, claro que iré.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges termina la llamada
    gloss: 'Narges: Adiós, hablamos luego.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali se despide
    gloss: 'Ali: Adiós.'
