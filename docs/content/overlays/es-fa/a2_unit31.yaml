  fa.a2.unit31.lesson05.exercise04.listen_decline:
    instruction: Escucha sin transcripción. ¿Qué hace la persona que habla?
    correct_option: Rechaza la ayuda y dice que lo hará ella sola.
    distractors:
    - Acepta la ayuda con cortesía.
    - Pide a alguien que abra la puerta.
    - Le dice a alguien que no venga.
    accepted_answers:
    - value: Rechaza la ayuda y dice que lo hará ella sola.
      status: correct
    feedback: La persona dice que no, gracias, y que lo hará ella misma.
  fa.a2.unit31.lesson05.exercise05.listen_warning:
    instruction: Escucha sin transcripción. ¿Qué se les dice a los oyentes?
    correct_option: Que no vayan allí y que no toquen.
    distractors:
    - Que vayan allí y lo toquen.
    - Que cierren la puerta y vengan aquí.
    - Que vayan allí y compren pan.
    accepted_answers:
    - value: Que no vayan allí y que no toquen.
      status: correct
    feedback: Los dos verbos están en mandato negativo cortés.
