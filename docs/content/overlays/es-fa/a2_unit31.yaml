teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: Palabras corteses para empezar
    gloss: hola, disculpe, se puede / podría, por favor, gracias
    note: '*ببخشید* sirve para llamar la atención con cortesía, y *لطفا* significa «por favor». *می‌شه* pregunta literalmente «¿es posible?»'
    example_gloss:
    - Hola, disculpe.
    - Gracias, por favor.
  fa.a2.unit31.lesson01.teach.things:
    title: Cosas que pides
    gloss: puerta, ventana, agua, vaso, pan, (marca de objeto), un/una
    note: '*رو* marca un complemento directo determinado en lengua hablada: *در رو*, *پنجره رو*. *یه* es el «un/una» hablado.'
    example_gloss:
    - Un vaso de agua.
    - Una barra de pan.
    - La puerta y la ventana.
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: Verbos para pedir con cortesía
    gloss: cerrar, abrir, traer, dar, ayudar
    note: Son formas de plural de cortesía que terminan en *-ید*. Son las que usas con vecinos, tenderos y otros desconocidos.
    example_gloss:
    - Cierre la puerta.
    - Abra la ventana.
    - Traiga un vaso de agua.
    - Ayúdeme.
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: می‌شه + subjuntivo
    gloss: ¿Podría cerrar la puerta? ¿Podría ayudarme?
    note: 'Para pedir algo con cortesía, di *می‌شه* y después un verbo en subjuntivo con *ب-*: *می‌شه در رو ببندید؟* En los verbos compuestos cambia el verbo ligero: *می‌شه کمکم کنید؟*, *می‌شه پنجره رو باز کنید؟* El objeto va antes del verbo.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: Ofrecer ayuda
    gloss: ¿Quiere ayuda? Permita que yo...
    note: '*کمک می‌خواید؟* pregunta si alguien quiere ayuda. *بذارید من ...* significa «deja que yo ...» y va seguido de un verbo en primera persona (*yo*): *بیارم*, *بخرم*, *ببندم*, *کنم*.'
    example_gloss:
    - ¿Quiere ayuda?
    - Permita que traiga agua.
    - Permita que compre pan.
    - Permita que cierre la puerta.
    - Permita que le ayude.
    - ¿Podría comprar pan?
  fa.a2.unit31.lesson02.teach.reply_words:
    title: Aceptar y rechazar
    gloss: sí, no, claro, yo mismo/a, lo hago (yo), de nada
    note: '*بله، لطفا* acepta un ofrecimiento. *نه، ممنون* lo rechaza, y *خودم انجام می‌دم* añade «lo haré yo mismo/a». *خواهش می‌کنم* se usa para responder a un agradecimiento.'
    example_gloss:
    - Sí, por favor.
    - No, gracias, lo hago yo.
    - De nada.
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'Petición u ofrecimiento: tú o yo'
    gloss: Permita que cierre la puerta.
    note: Una petición con *می‌شه* usa la terminación de *usted* (*ببندید*) porque se lo pides a la otra persona. Un ofrecimiento con *بذارید من* usa la terminación de *yo* (*ببندم*) porque la acción la harás tú. Compara *می‌شه در رو ببندید؟* con *بذارید من در رو ببندم*.
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: Una respuesta cortés tiene dos partes
    gloss: Sí, por favor. No, gracias, lo hago yo.
    note: Para aceptar, di *بله* más *لطفا*. Para rechazar, di *نه، ممنون*, y añade *خودم انجام می‌دم* cuando quieras decir que te encargas tú mismo/a.
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: Órdenes afirmativas
    gloss: ve, ven, haz; vaya (cortés), haga (cortés)
    note: 'A un amigo se le habla con la forma corta: *برو*, *بیا*, *بکن*. A los desconocidos y a los grupos se les habla con la forma en *-ید*: *برید*, *بکنید*.'
    example_gloss:
    - Ve allí.
    - Ven aquí.
    - Haz esto.
    - Vaya allí (cortés).
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: Órdenes negativas
    gloss: no vayas, no vengas, no hagas; versiones corteses y de plural
    note: 'Sustituye *ب-* por *نـ*: *برو* pasa a *نرو*, *بکن* pasa a *نکن*, *بیا* pasa a *نیا*. Las formas corteses son *نرید*, *نکنید* y la expresión fija *دست نزنید* (no toque).'
    example_gloss:
    - No vayas allí.
    - No vengas aquí.
    - No hagas esto.
    - No vaya allí (cortés).
    - No haga esto (cortés).
    - No toque (cortés).
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ sustituye a ب-
    gloss: برو y نرو, بیا y نیا, بکن y نکن
    note: 'La orden afirmativa empieza por *ب-* y la negativa empieza por *نـ*. *بیا* y *نیا* funcionan igual: solo se diferencian en la primera letra. Solo la forma negativa cambia el sentido a «no».'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: Amigo o plural cortés
    gloss: no vayas (a un amigo) y no vaya/n (cortés)
    note: 'Añade *-ید* para un desconocido o para más de una persona: *نرو* pasa a *نرید* y *نکن* pasa a *نکنید*. Los carteles y los tenderos usan las formas en *-ید*: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: Vecinos y tiendas
    gloss: vecino, tienda, dependiente, bolso, té
    note: '*کیفم* significa «mi bolso»; la terminación *-م* significa «mi». *تو مغازه* significa «en la tienda».'
    example_gloss:
    - Perdone, ¿me podría dar un té?
    - Perdone, ¿me podría dar mi bolso?
    - Hola, vecino, ¿quiere ayuda?
    - No toque nada en la tienda.
  fa.a2.unit31.lesson04.teach.shop_request:
    title: Una petición cortés en una tienda
    gloss: Perdone, ¿me podría dar un té? Gracias.
    note: Empieza con *ببخشید*, pide con *می‌شه* y un verbo cortés, y termina con *ممنون*.
  fa.a2.unit31.lesson05.teach.reading:
    title: Una nota para un vecino
    gloss: Hola, perdone. ¿Podría comprar pan hoy? No estoy en casa. Por favor, cierre la puerta y no toque mi bolso. Gracias.
    note: Lee una vez para entender la petición y otra vez para ver la indicación de no tocar el bolso.
  fa.a2.unit31.lesson06.teach.turn01:
    title: Sara pide ayuda
    gloss: 'Sara: Perdone, ¿podría ayudarme?'
    note: Una petición cortés con *می‌شه* y la terminación de *usted*.
  fa.a2.unit31.lesson06.teach.turn02:
    title: El vecino acepta
    gloss: 'Vecino: Sí, claro. ¿Qué hago?'
    note: '*چیکار کنم؟* pregunta qué hacer.'
  fa.a2.unit31.lesson06.teach.turn03:
    title: Una petición concreta
    gloss: 'Sara: ¿Podría abrir la puerta?'
    note: El complemento *در رو* va antes del verbo cortés.
  fa.a2.unit31.lesson06.teach.turn04:
    title: El vecino ofrece más ayuda
    gloss: 'Vecino: Sí. Deje que lleve su bolso.'
    note: '*بذارید من ... ببرم* usa la terminación de *yo*.'
  fa.a2.unit31.lesson06.teach.turn05:
    title: Sara rechaza
    gloss: 'Sara: No, gracias, lo hago yo.'
    note: Un rechazo cortés con un motivo.
  fa.a2.unit31.lesson06.teach.turn06:
    title: El vecino responde
    gloss: 'Vecino: De nada.'
    note: '*خواهش می‌کنم* es la respuesta habitual a un agradecimiento.'
