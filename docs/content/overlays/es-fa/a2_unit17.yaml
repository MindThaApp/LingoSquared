teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: Semana
    gloss: semana
    note: '*هفته* es la palabra general para «semana».'
    example_gloss: Esta semana está muy ocupada.
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: Fin de semana
    gloss: fin de semana
    note: '*آخر هفته* significa literalmente «final de la semana»; en Irán corresponde a *پنجشنبه*/*جمعه* (jueves y viernes), no a sábado y domingo.'
    example_gloss: El fin de semana no trabajo.
  fa.a2.unit17.lesson01.teach.rest_word:
    title: Descanso
    gloss: descanso
    note: '*استراحت کردن* («descansar») es una construcción con verbo ligero, como *باز کردن* de la unidad anterior sobre el banco.'
    example_gloss: Los viernes descanso.
  fa.a2.unit17.lesson01.teach.first_word:
    title: Primero
    gloss: primero
    note: '*اول* abre una secuencia de actividades.'
    example_gloss: Primero desayuno.
  fa.a2.unit17.lesson01.teach.then_word:
    title: Luego
    gloss: luego
    note: '*بعد* continúa una secuencia; *بعدش* («luego», «después de eso») es su forma coloquial habitual.'
    example_gloss: Luego voy al trabajo.
  fa.a2.unit17.lesson01.teach.finally_word:
    title: Por último
    gloss: por último / al final
    note: '*در آخر* cierra una secuencia de actividades.'
    example_gloss: Por último, descanso.
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: Días de la semana
    gloss: sábado, domingo, lunes, martes, miércoles, jueves, viernes
    note: Repaso de los nombres de los días de la semana de la unidad anterior sobre las fechas, que aquí se reutilizan para un horario semanal.
  fa.a2.unit17.lesson02.teach.until_word:
    title: Hasta / a (un intervalo de días)
    gloss: hasta / a
    note: '*تا* une dos días para formar un intervalo, por ejemplo *شنبه تا چهارشنبه* (de sábado a miércoles).'
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: Indica tus días de trabajo como un intervalo
    gloss: Trabajo de sábado a miércoles.
    note: Es una semana laboral habitual en Irán (muchas oficinas y tiendas trabajan de sábado a miércoles), no el esquema de lunes a viernes.
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: El sufijo -ها de costumbre en el nombre de un día
    gloss: los jueves (cada semana)
    note: '*پنجشنبه‌ها* (jueves + -ها) significa «los jueves» como hábito que se repite, no un jueves concreto.'
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: Contrasta la semana con el fin de semana
    gloss: Entre semana trabajo, pero el fin de semana descanso.
    note: '*در طول هفته* (entre semana) contrasta con *آخر هفته* (el fin de semana), unidos por *ولی* (pero).'
  fa.a2.unit17.lesson03.teach.clean_word:
    title: Limpiar
    gloss: limpiar
    note: '*تمیز کردن* es otra construcción con verbo ligero: *تمیز* (limpio) + *کردن* (hacer).'
    example_gloss: Los jueves limpio la casa.
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: El horario semanal escrito de سارا
    gloss: 'Mi horario de la semana: trabajo de sábado a miércoles. Los jueves hago la compra y limpio la casa. Los viernes, el fin de semana, veo a mis amigos y descanso.'
    note: Una nota breve de agenda semanal escrita en estilo hablado y relajado (*خونه*, *دوستامو*).
  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: ¡Qué buena semana tienes!
    gloss: ¡Qué buena semana tienes!
    note: Un comentario amable al final, después de oír el horario semanal de alguien. Comenta la semana que tiene la persona; no es el deseo de despedida «que tengas una buena semana».
  fa.a2.unit17.lesson04.teach.turn01:
    title: نیما pregunta por la semana de سارا
    gloss: نیما le pregunta a سارا cómo es su semana y cuál es su horario.
    note: '*چطوره* y *چیه* son las formas coloquiales contraídas ya conocidas de «¿cómo es?» y «¿qué es?».'
  fa.a2.unit17.lesson04.teach.turn02:
    title: سارا empieza por sus días de trabajo
    gloss: سارا dice que primero va al trabajo de sábado a miércoles.
    note: '*سر کار می‌رم* (voy al trabajo) reutiliza la expresión ya conocida para «ir al trabajo».'
  fa.a2.unit17.lesson04.teach.turn03:
    title: نیما pregunta qué viene después
    gloss: 'نیما pregunta: ¿y después qué?'
    note: '*بعدش چی؟* es una forma breve y natural de preguntar qué viene después.'
  fa.a2.unit17.lesson04.teach.turn04:
    title: سارا describe los jueves
    gloss: سارا dice que después, los jueves, hace la compra y limpia la casa.
    note: Reutiliza la frase sobre el jueves de la lección 3.
  fa.a2.unit17.lesson04.teach.turn05:
    title: سارا describe los viernes
    gloss: سارا dice que por último, los viernes, descansa y ve a sus amigos.
    note: Cierra la secuencia con *در آخر* (por último).
  fa.a2.unit17.lesson04.teach.turn06:
    title: نیما cierra la conversación
    gloss: 'نیما dice: ¡qué buena semana tienes!'
    note: Reutiliza la frase de despedida de esta lección.
