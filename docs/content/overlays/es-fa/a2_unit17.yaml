course:
  title: Persa A2
  description: 'Farsi iraní de nivel intermedio bajo: describir una semana típica, ordenar actividades con اول/بعد/در آخر y contrastar los días laborables con la semana laboral real de Irán, de شنبه a چهارشنبه, y el fin de semana de پنجشنبه/جمعه.'
