teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: Tres conectores de tiempo
    gloss: antes de que, después de que, cuando
    note: '*قبل از اینکه* significa «antes de que», *بعد از اینکه* significa «después de que» y *وقتی* significa «cuando». Cada uno introduce una oración que indica cuándo ocurre algo.'
    example_gloss:
    - Antes de irme, cierro la puerta.
    - Después de que llegué, llamé a Sara.
    - Cuando llegué, llamé a Sara.
  fa.a2.unit35.lesson01.teach.home_words:
    title: Palabras de la casa y de cada día
    gloss: casa, puerta, luz, cepillo de dientes, desayuno, comida, té
    note: '*رو* marca un complemento directo determinado en la lengua hablada: *در رو* es «la puerta». *مسواک* es el cepillo y también la acción en *مسواک می‌زنم*.'
    example_gloss:
    - Cierro la puerta.
    - Apago la luz.
    - Comí y tomé té.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: Verbos después de «antes de que»
    gloss: me vaya, me duerma, llegue, compre, cocine, suba
    note: 'Después de *قبل از اینکه* el verbo va en subjuntivo: *ب* + raíz + terminación (*برم، بخوابم، برسم*). Este verbo no lleva *می‌*. El verbo principal expresa el hábito: *می‌بندم، می‌زنم*.'
    example_gloss:
    - Antes de dormir, me cepillo los dientes.
    - Antes de llegar, llamo a Sara.
    - Antes de subir, compro un billete.
    - Antes de cocinar, lavo las verduras.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: Verbos en pasado simple
    gloss: llegué, llamé, comí
    note: Son verbos normales en pasado simple. Después de *بعد از اینکه* y de *وقتی* en un relato se usa el pasado simple.
    example_gloss:
    - Llegué a la estación.
    - Llamé a Sara.
    - Comí.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + subjuntivo
    gloss: Antes de irme, cierro la puerta
    note: 'Después de *قبل از اینکه* el verbo va en subjuntivo: *برم، بخوابم، برسم*. La acción de la oración con *قبل از اینکه* ocurre en segundo lugar; la de la oración principal, en primero. En *قبل از اینکه برم، در رو می‌بندم* primero se cierra la puerta y después te vas.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: Palabras de viaje
    gloss: tren, billete, estación, subí, compré
    note: '*سوار شدم* es toda la acción de «subí» (a un tren, a un autobús). *بلیت* es un billete.'
    example_gloss:
    - Compré un billete.
    - Subí al tren.
    - Llegué a la estación.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: Más verbos en pasado
    gloss: lavé, cociné, dormí, tomé
    note: Estas formas de pasado simple (*شستم، پختم، خوابیدم، گرفتم*) son los verbos que usamos después de *بعد از اینکه*.
    example_gloss:
    - Lavé las verduras.
    - Cociné.
    - Me di una ducha.
    - Dormí.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + pasado simple
    gloss: Después de que llegué, llamé
    note: 'Después de *بعد از اینکه* se usa el pasado simple: *رسیدم، خریدم، شستم*. La oración con *بعد از اینکه* ocurrió primero. Ejemplo: *بعد از اینکه بلیت خریدم، سوار قطار شدم* significa que primero compraste el billete y luego subiste. Aquí no hay subjuntivo.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: Ir y cerrar, pasado y presente
    gloss: fui, cerré, voy
    note: 'Estas son las formas que comparamos: *رفتم* (fui) y *می‌رم* (voy) frente al subjuntivo *برم*.'
    example_gloss:
    - Salí de casa.
    - Cerré la puerta.
    - Voy.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: Subjuntivo después de قبل, pasado después de بعد
    gloss: antes de que me vaya / después de que me fui
    note: 'Los dos nexos necesitan formas verbales distintas. *قبل از اینکه برم* (antes de que me vaya): subjuntivo, el hecho todavía no ha ocurrido. *بعد از اینکه رفتم* (después de que me fui): pretérito simple, el hecho ya terminó. Compara *برم / رفتم*, *بخرم / خریدم*, *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: El verbo después de قبل sigue en subjuntivo
    gloss: Antes de irme, cerré la puerta
    note: 'El verbo después de *قبل از اینکه* va en subjuntivo aunque el verbo principal esté en pasado: *قبل از اینکه برم، در رو بستم* significa «Antes de irme, cerré la puerta». Nunca pongas *رفتم* después de *قبل از اینکه*.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: Palabras para «cuando»
    gloss: música, escucho, vino, llego, cocino
    note: '*گوش می‌دم* significa «escucho». *اومد* es el pasado coloquial de «vino». *رسیدی* significa «llegaste» y *چیکار کردی؟* significa «¿qué hiciste?».'
    example_gloss:
    - Cuando cocino, escucho música.
    - Cuando llegó el tren, subí.
    - Cuando llego, llamo a Sara.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + pasado o presente
    gloss: Cuando llegué, llamé; cuando llego, llamo
    note: '*وقتی* lleva la forma verbal que corresponde al tiempo. Un hecho terminado usa el pretérito simple: *وقتی رسیدم، زنگ زدم* (cuando llegué, llamé). Un hábito o un plan usa el presente con *می‌*: *وقتی می‌رسم، زنگ می‌زنم* (cuando llego, llamo). *وقتی* no indica qué va primero; para un orden estricto usa *قبل از اینکه* o *بعد از اینکه*.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: Palabras para la lectura
    gloss: ayer, mañana (parte del día), apagué
    note: '*خاموش کردم* es el pretérito simple de «apagué». *دیروز صبح* significa «ayer por la mañana».'
    example_gloss:
    - Ayer por la mañana me duché.
    - Apagué la luz.
  fa.a2.unit35.lesson05.teach.reading:
    title: Una mañana y un tren
    gloss: Ayer por la mañana, después de ducharme, desayuné. Antes de salir de casa, apagué la luz y cerré la puerta. Cuando llegué a la estación, compré un billete. Después de que llegó el tren, me subí.
    note: 'Lee una vez para entender el orden de los hechos y luego busca los tres nexos: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: Palabras para la conversación
    gloss: mañana, a mí, llegues, comimos, bebemos
    note: '*بهم* significa «a mí» y *بهت* significa «a ti». *برسی* es el subjuntivo «llegues». *خوردیم* significa «comimos» y *می‌خوریم* significa «comemos/bebemos».'
    example_gloss:
    - ¿Me llamarás mañana?
    - Sí, te llamaré.
    - Comimos y tomaremos té.
  fa.a2.unit35.lesson06.teach.turn01:
    title: Sara pregunta por ayer
    gloss: 'Sara le pregunta a Nima: Ayer, después de llegar a la estación, ¿qué hiciste?'
    note: Sara usa *بعد از اینکه* con el pasado.
  fa.a2.unit35.lesson06.teach.turn02:
    title: Nima cuenta la secuencia
    gloss: Después de llegar, compré un billete. Cuando llegó el tren, me subí.
    note: Nima responde con *بعد از اینکه* y *وقتی*, ambos con verbos en pasado.
  fa.a2.unit35.lesson06.teach.turn03:
    title: Sara pregunta por mañana
    gloss: Mañana, antes de que llegues, ¿me llamarás?
    note: Sara usa *قبل از اینکه* con el subjuntivo *برسی*.
  fa.a2.unit35.lesson06.teach.turn04:
    title: Nima acepta
    gloss: Sí, antes de llegar, te llamaré.
    note: 'Nima repite el subjuntivo con su propia terminación: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: Sara planea la cena
    gloss: Bien. Antes de que llegues, cocinaré.
    note: 'Cada persona tiene su propio sujeto: *من* y *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: Nima planea el té
    gloss: ¡Genial! Después de comer, tomaremos té.
    note: Aquí la cláusula con *بعد از اینکه* está en pasado y la principal expresa el plan.
