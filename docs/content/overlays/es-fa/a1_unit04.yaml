teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Madre
    gloss: madre
    note: مادر es la palabra neutra, propia de la lengua escrita y formal, para «madre».
    example_gloss: Mi madre es amable.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mamá
    gloss: mamá
    note: مامان es la palabra hablada y cotidiana que usa la mayoría de las familias.
    example_gloss: Mamá, tengo hambre.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Padre
    gloss: padre
    note: پدر es la palabra neutra, propia de la lengua escrita y formal, para «padre».
    example_gloss: Mi padre es médico.
  fa.a1.unit04.lesson01.teach.baba:
    title: Papá
    gloss: papá
    note: بابا es la palabra hablada y cotidiana que usa la mayoría de las familias.
    example_gloss: Papá, ¿dónde estás?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Hermano
    gloss: hermano
    note: برادر; la forma hablada y cariñosa داداش aparece más adelante en esta unidad.
    example_gloss: Tengo un hermano.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Hermana
    gloss: hermana
    note: خواهر, la palabra estándar para «hermana».
    example_gloss: Mi hermana es estudiante universitaria.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Palabras formales y cotidianas
    gloss: Mamá y papá son como madre y padre, pero más coloquiales.
    note: 'El persa tiene dos registros reales para los padres, no una separación estricta entre formal e informal: مامان/بابا son las palabras con las que la mayoría llama a sus propios padres, incluso en situaciones de cortesía.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Tengo
    gloss: tengo
    note: '*دارم* es la primera persona de *داشتن* («tener»), el verbo esencial para describir a la familia.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Uno
    gloss: uno
    note: یک se usa delante de un sustantivo contado, por ejemplo یک برادر (un hermano).
    example_gloss: Tengo una hermana.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Tengo un hermano.
    gloss: Tengo un hermano.
    note: 'Orden de palabras: sujeto, cantidad + sustantivo, verbo; es el orden típico persa SOV.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: No tengo hermana.
    gloss: No tengo hermana.
    note: ندارم es la forma negativa de دارم; no hace falta ninguna palabra aparte para «una».
  fa.a1.unit04.lesson02.teach.family_big:
    title: Mi familia es grande.
    gloss: Mi familia es grande.
    note: بزرگه es la forma contraída, propia de la lengua hablada, de «بزرگ است» (es grande).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Nuestra familia es pequeña.
    gloss: Nuestra familia es pequeña.
    note: کوچیکه es la forma contraída, propia de la lengua hablada, de «کوچک است» (es pequeño), con la pronunciación coloquial کوچیک en lugar de la escrita کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Abuelo
    gloss: abuelo
    note: پدربزرگ, literalmente «padre grande»; se usa para ambos lados de la familia.
    example_gloss: Mi abuelo es anciano.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Abuela
    gloss: abuela
    note: مادربزرگ, literalmente «madre grande»; se usa para ambos lados de la familia.
    example_gloss: Mi abuela es amable.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Tío paterno
    gloss: tío (hermano del padre)
    note: عمو significa específicamente «hermano del padre»; no es una palabra general para «tío».
    example_gloss: Mi tío vive en Teherán.
  fa.a1.unit04.lesson03.teach.amme:
    title: Tía paterna
    gloss: tía (hermana del padre)
    note: عمه significa específicamente «hermana del padre».
    example_gloss: Mi tía es maestra.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Tío materno
    gloss: tío (hermano de la madre)
    note: 'دایی significa específicamente «hermano de la madre»: el persa distingue de qué lado de la familia es cada tío o tía.'
    example_gloss: Mi tío (materno) es ingeniero.
  fa.a1.unit04.lesson03.teach.khale:
    title: Tía materna
    gloss: tía (hermana de la madre)
    note: خاله significa específicamente «hermana de la madre».
    example_gloss: Mi tía (por parte de madre) vive en Isfahán.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Lado paterno y lado materno
    gloss: El tío y la tía paternos son del lado del padre; el tío y la tía maternos son del lado de la madre.
    note: Esta división en cuatro (عمو/عمه frente a دایی/خاله) distingue el lado paterno del materno con palabras distintas, mientras que el español usa solo «tío»/«tía» para ambos lados.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Cuántos
    gloss: cuántos / cuántas
    note: چند تا se usa, de manera informal, antes de contar personas o cosas.
    example_gloss: ¿Cuántas hermanas tienes?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: ¿Cuántos hermanos tiene? (formal)
    gloss: ¿Cuántos hermanos tienes?
    note: دارید es la forma de cortesía/plural de «tener» y concuerda con شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: ¿Cuántos hermanos tienes? (informal)
    gloss: ¿Cuántos hermanos tienes?
    note: داری es la forma informal del singular, que se usa con un igual o con alguien más joven.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: ¿Cuántas personas hay en tu familia?
    gloss: ¿Cuántas personas hay en su familia?
    note: نفر es el contador para personas; نفرن es la forma hablada contraída de «نفر هستند» (son ... personas).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Somos cuatro: yo, mi mamá, mi papá y mi hermano.'
    gloss: 'Somos cuatro: yo, mi mamá, mi papá y mi hermano.'
    note: نفریم = «نفر هستیم» (somos ... personas) contraído, registro hablado.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Marido
    gloss: marido
    note: شوهر es la palabra estándar para «esposo».
    example_gloss: Mi marido es ingeniero.
  fa.a1.unit04.lesson05.teach.zan:
    title: Esposa
    gloss: esposa
    note: زن también significa «mujer» en general; el contexto aclara el significado.
    example_gloss: Mi esposa es profesora.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Casado
    gloss: casado
    note: متأهل es un adjetivo neutro y de uso común para el estado civil.
    example_gloss: Está casado/a.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Soltero/a
    gloss: soltero/a
    note: مجرد es la palabra estándar para «soltero/a».
    example_gloss: Estoy soltero/a.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Soy soltero/a.
    gloss: Soy soltero/a.
    note: مجردم = مجرد + م («soy»), el mismo sufijo de primera persona que en خوبم («estoy bien»).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Estoy casado/a.
    gloss: Estoy casado/a.
    note: متأهلم = متأهل + م («estoy»), el mismo patrón que مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Nieto/a
    gloss: nieto/a
    note: 'نوه sirve para nieto o nieta: en persa aquí no hace falta indicar el género.'
    example_gloss: Tiene un nieto/una nieta.
  fa.a1.unit04.lesson05.teach.example:
    title: Mi hermano está casado; tiene un hijo.
    gloss: Mi hermano está casado; tiene un hijo.
    note: متأهله = «متأهل است» (está casado) contraído, registro hablado; داره = «دارد» (tiene) en registro hablado.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: ¿Es esta la foto de tu familia?
    gloss: ¿Es esta la foto de tu familia?
    note: خانواده‌ته = «خانواده‌ی تو است» (es tu familia) contraído; es un patrón hablado muy común.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Sí. Esta es mi mamá y este es mi papá.
    gloss: Sí. Esta es mi mamá y este es mi papá.
    note: '*آره* es el «sí» hablado (frente al formal *بله*). *مامانمه* es *مامانم* («mi mamá») más la terminación hablada de «es».'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: ¿Quién es este señor?
    gloss: ¿Quién es este señor?
    note: کیه = «کی است» (quién es) contraído, registro hablado.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: Es mi hermano. Tengo un hermano y ninguna hermana.
    gloss: Es mi hermano. Tengo un hermano y ninguna hermana.
    note: داداش es la palabra cariñosa y cotidiana para «hermano», usada aquí en lugar de برادر, más neutra, de la lección 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'Mi familia es al revés: tengo dos hermanas y ningún hermano.'
    gloss: 'Mi familia es al revés: tengo dos hermanas y ningún hermano.'
    note: برعکسه = «برعکس است» (es al revés) contraído.
  fa.a1.unit04.lesson06.teach.closing:
    title: ¡Entonces tu familia también es numerosa y animada!
    gloss: ¡Entonces tu familia también es numerosa y animada!
    note: شلوغه = «شلوغ است» (es bulliciosa/animada) contraído; es una forma cálida y común de describir una familia con varios hijos.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Registro formal: tiene / no tiene / es'
    gloss: 'Hablado: tiene, no tiene. Escrito formal: tiene, no tiene; es mi hermano.'
    note: دارد/ندارد/است son los equivalentes escritos formales de las formas habladas داره/نداره usadas en este diálogo. Además, la escritura formal cambia el cariñoso داداش por el neutro برادر.
