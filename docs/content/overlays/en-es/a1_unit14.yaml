  es.a1.unit14.lesson02.teach.alquilar: {title: "To rent", gloss: "to rent", note: "The infinitive verb, used in *quiero alquilar* (I want to rent)."}
  es.a1.unit14.lesson02.teach.el_edificio: {title: "The building", gloss: "the building", note: "*Edificio* is masculine.", example_gloss: "The building is near the park."}
  es.a1.unit14.lesson02.teach.desocupado: {title: "Available / vacant", gloss: "available / vacant", note: "*Desocupado* describes a rental unit that's currently empty and available."}
  es.a1.unit14.lesson02.teach.grande: {title: "Big", gloss: "big", note: "*Grande* doesn't change form for gender (unlike -o/-a adjectives)."}
  es.a1.unit14.lesson02.teach.pequeno: {title: "Small", gloss: "small", note: "*Pequeño/pequeña*, the opposite of *grande*."}

  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene: {title: "Ask how many bedrooms", gloss: "How many bedrooms does it have?", note: "*¿Cuántos...tiene?* (how many...does it have?) is a standard pattern for asking about a place's features."}
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande: {title: "Describe the bedrooms and kitchen", gloss: "It has two bedrooms and a big kitchen.", note: "*Tiene* (it has) + count + noun, here with *dormitorio*, *cocina* and *grande*."}

  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande: {title: "State the housing goal", gloss: "I want to rent an apartment with a big kitchen.", note: "*Quiero* (I want) + infinitive *alquilar*, with *con* (with) introducing the desired feature."}
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa: {title: "Explain the benefit", gloss: "That way you can cook at home too.", note: "*Así* (that way/thus) + *puedes* (you can) + infinitive links the housing goal back to the whole storyline's cooking theme."}

  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: "Reading an apartment listing"
    gloss: "Available apartment in a building near the park. It has two bedrooms, a bathroom, a living room, and a big kitchen. It's perfect for someone who wants to cook at home."
    note: "A realistic classified-ad-style listing."
    glosses:
      desocupado: "available / vacant"
      edificio: "building"
      cerca: "nearby / close"
      parque: "park"
      Tiene: "has (from tener)"
      dormitorios: "bedrooms"
      baño: "bathroom"
      sala: "living room"
      grande: "big"
      perfecto: "perfect"
      quiere: "wants (from querer)"
      cocinar: "to cook"
  es.a1.unit14.lesson05.teach.para_alguien_que_note: {title: "Para alguien que...", gloss: "How a relative clause describes an ideal tenant.", note: "See the card's own text."}

  es.a1.unit14.lesson06.teach.line01: {title: "State the problem and goal", gloss: "Mateo says his kitchen is very small and he wants to rent an apartment with a big one.", note: "Combines *mi cocina es muy pequeña* (my kitchen is very small) with the goal statement *quiero alquilar un apartamento con una cocina grande*."}
  es.a1.unit14.lesson06.teach.line02: {title: "Suggest checking listings", gloss: "Elena suggests checking the newspaper -- there are many ads.", note: "*El periódico* (the newspaper) and *anuncios* (ads) are new, real-world classified-ad vocabulary."}
  es.a1.unit14.lesson06.teach.line03: {title: "Find a listing", gloss: "Mateo finds a building with an available apartment.", note: "*Este edificio* (this building) and *desocupado* (vacant, available)."}
  es.a1.unit14.lesson06.teach.line04: {title: "Ask about bedrooms", gloss: "Elena asks how many bedrooms it has.", note: "The standard question for asking about a place's features."}
  es.a1.unit14.lesson06.teach.line05: {title: "Answer with the details", gloss: "Mateo says it has two bedrooms and a big kitchen.", note: "*Tiene* (it has) + count + noun."}
  es.a1.unit14.lesson06.teach.line06: {title: "Confirm more features", gloss: "Elena is delighted and notes it also has a bathroom and living room.", note: "*Baño* (bathroom) and *sala* (living room) complete the room list; *también* (too) goes at the end."}
  es.a1.unit14.lesson06.teach.line07: {title: "Decide to call", gloss: "Mateo decides to call the agency today.", note: "*Voy a llamar* (I'm going to call) + *hoy mismo* (this very day); *la agencia* is the rental agency."}
  es.a1.unit14.lesson06.teach.line08: {title: "Approve and close the loop", gloss: "Elena approves and points out he can cook at home too.", note: "*Así puedes cocinar en casa también* (that way you can cook at home too) closes the scene."}

