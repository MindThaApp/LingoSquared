  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: "Elena and Mateo go to the market"

teaching:
  es.a1.unit07.lesson01.teach.el_mercado: {title: "The market", gloss: "the market", note: "*Mercado* is masculine.", example_gloss: "Let's go to the market."}
  es.a1.unit07.lesson01.teach.fruta_verdura: {title: "Fruit, vegetables", gloss: "fruit, vegetable(s)", note: "*Verdura* covers leafy/green vegetables generally, similar to how English \"greens\" or \"vegetables\" is used broadly.", example_gloss: ["I want to buy fruit.", "The vegetables are fresh."]}
  es.a1.unit07.lesson01.teach.huevos_pan: {title: "Eggs, bread", gloss: "eggs, bread", note: "*Huevos* is already plural (the singular is *huevo*); *pan* (bread) is a mass noun, like in English, with no natural plural for the everyday sense.", example_gloss: ["I need eggs.", "The bread is from this morning."]}

  es.a1.unit07.lesson02.teach.cuanto_cuesta: {title: "Ask the price", gloss: "How much does it cost?", note: "*Cuesta* is the third-person form of *costar* (to cost), a new verb for this unit."}
  es.a1.unit07.lesson02.teach.cuanto_es: {title: "Ask the price, alternate form", gloss: "How much is it?", note: "See the following grammar note comparing this to *¿Cuánto cuesta?*."}
  es.a1.unit07.lesson02.teach.cuesta_dos: {title: "State a price", gloss: "It costs two.", note: "A short, complete price answer -- the currency/unit is understood from context, the same way English speakers often just say a number in a shopping exchange."}
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note: {title: "Cuánto cuesta vs. Cuánto es", gloss: "Two equally natural ways to ask a price.", note: "See the card's own text."}

  es.a1.unit07.lesson03.teach.una_docena_de_huevos: {title: "Ask for a dozen eggs", gloss: "A dozen eggs, please.", note: "*Docena* (dozen) is a noun in Spanish, always followed by *de* plus the item, unlike English where \"dozen\" modifies the noun directly."}
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates: {title: "Ask for a kilo of tomatoes", gloss: "A kilo of tomatoes, please.", note: "*Kilo* follows the same *de*-plus-item pattern as *docena*."}
  es.a1.unit07.lesson03.teach.medio_kilo: {title: "Half a kilo", gloss: "half a kilo", note: "*Medio* (half) precedes the noun it modifies, agreeing in gender (*medio kilo*, masculine; *media docena* would be feminine).", example_gloss: "Half a kilo of bread, please."}
  es.a1.unit07.lesson03.teach.un_poco_de: {title: "A little of", gloss: "a little of", note: "*Un poco de* is used for an unspecified small amount, when an exact quantity isn't needed.", example_gloss: "I want a little fruit."}

  es.a1.unit07.lesson04.teach.necesita_algo_mas: {title: "Ask if anything else is needed", gloss: "Do you need anything else?", note: "*Necesita* is the *usted* form of *necesitar*, the polite register a vendor typically uses with a customer."}
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo: {title: "Say you have everything", gloss: "No, I think we already have everything.", note: "*Creo que* (I think that) is a common way to soften a statement, here confirming the shopping list is complete."}
  es.a1.unit07.lesson04.teach.gracias_vendedor: {title: "Thank the vendor", gloss: "Perfect, thank you.", note: "A short, natural closing to a purchase exchange."}

  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: "Reading price labels"
    gloss: "Rosa's stand: tomatoes, two per kilo. Eggs, four a dozen. Bread, six. Fresh fruit every day."
    note: "A realistic market-stall price-label format, reusing this unit's own vocabulary with a new vendor character, Rosa."
    glosses: {Puesto: "stand / stall", tomates: "tomatoes", kilo: "kilo", Huevos: "eggs", docena: "dozen", Pan: "bread", Fruta: "fruit", fresca: "fresh", todos: "every", días: "days"}
  es.a1.unit07.lesson05.teach.el_kilo_note: {title: "El kilo as \"per kilo\"", gloss: "How a unit word after a price means \"per\" that unit.", note: "See the card's own text."}

  es.a1.unit07.lesson06.teach.line01: {title: "Propose going to the market", gloss: "Elena proposes going to the market for ingredients for the next class.", note: "*Para la próxima clase* reuses unit04's established date vocabulary and workshop-schedule fact."}
  es.a1.unit07.lesson06.teach.line02: {title: "Agree and ask what's needed", gloss: "Mateo agrees and asks what they need.", note: "*¿Qué necesitamos?* uses the *nosotros* form of *necesitar*, matching \"we need\" together."}
  es.a1.unit07.lesson06.teach.line03: {title: "Point out fresh tomatoes", gloss: "Elena says vegetables first, and points out how fresh the tomatoes look.", note: "*¡Qué tomates tan frescos!* is an exclamation pattern, similar in structure to unit03's *¡Qué bonito!*."}
  es.a1.unit07.lesson06.teach.line04: {title: "Vendor asks the quantity", gloss: "The vendor asks Elena how much she wants.", note: "*Señorita* is a polite, informal address for a young woman, matching the vendor's *usted* register toward a customer."}
  es.a1.unit07.lesson06.teach.line05: {title: "Order a kilo and ask the price", gloss: "Elena asks for a kilo and asks the price.", note: "Combines lesson03's *un kilo* with lesson02's *¿Cuánto cuesta?* in one natural exchange."}
  es.a1.unit07.lesson06.teach.line06: {title: "State the price", gloss: "The vendor says it costs two.", note: "Reuses lesson02's *Cuesta dos* directly."}
  es.a1.unit07.lesson06.teach.line07: {title: "Mateo orders eggs and bread", gloss: "Mateo says he needs a dozen eggs and bread.", note: "Combines lesson01's *huevos*/*pan* vocabulary with lesson03's *una docena de*."}
  es.a1.unit07.lesson06.teach.line08: {title: "Vendor states both prices", gloss: "The vendor says the eggs cost four, and the bread, six.", note: "*Cuestan* (plural, they cost) agrees with the plural subject *los huevos*, distinct from the singular *cuesta* used for the tomatoes."}

