course:
  title: Spanish C1
  description: >-
    Advanced Spanish persuasion: persuade an audience using rhetorical
    questions, parallelism, emphasis, and appeals, modulating stance and
    intensity to move the listener or reader.

units:
  es.c1.unit08.persuadir_con_recursos_retoricos:
    title: "Persuading with rhetorical devices"
    description: "Persuade an audience using rhetorical questions, parallelism, emphasis, and appeals."

lessons:
  es.c1.unit08.lesson01.el_arte_de_persuadir:
    title: "The art of persuading"
  es.c1.unit08.lesson02.la_pregunta_y_el_paralelismo:
    title: "The rhetorical question and parallelism"
  es.c1.unit08.lesson03.el_enfasis_y_la_apelacion:
    title: "Emphasis and appeal"
  es.c1.unit08.lesson04.modular_la_intensidad:
    title: "Modulating intensity"
  es.c1.unit08.lesson05.analizar_el_discurso:
    title: "Analyzing the speech"
  es.c1.unit08.lesson06.el_discurso_completo:
    title: "The complete speech"

teaching:
  es.c1.unit08.lesson01.teach.persuadir:
    title: "to persuade"
    gloss: "to persuade"
    note: "*Persuadir* means to move someone to act or to change their mind."
    example_gloss: "Persuading is moving the audience to act."
  es.c1.unit08.lesson01.teach.el_discurso:
    title: "the speech"
    gloss: "the speech"
    note: "*El discurso* is a formal spoken address to an audience."
    example_gloss: "A short speech persuades more than a long one."
  es.c1.unit08.lesson01.teach.la_audiencia:
    title: "the audience"
    gloss: "the audience"
    note: "*La audiencia* is the group of people you are speaking to."
    example_gloss: "Get to know the audience before speaking."
  es.c1.unit08.lesson01.teach.la_retorica:
    title: "rhetoric"
    gloss: "rhetoric"
    note: "*La retórica* is the art of persuading through language."
    example_gloss: "Rhetoric is the art of persuading."
  es.c1.unit08.lesson01.teach.el_argumento:
    title: "the argument"
    gloss: "the argument"
    note: "*El argumento* is the reasoning you use to convince."
    example_gloss: "A good argument convinces the audience."
  es.c1.unit08.lesson01.teach.la_opinion:
    title: "the opinion"
    gloss: "the opinion"
    note: "*La opinión* is what someone believes; persuasion changes it."
    example_gloss: "Persuading is changing someone's opinion."
  es.c1.unit08.lesson01.teach.persuadir_note:
    title: "The work of persuading"
    gloss: "Persuading means moving the audience to act or to change their opinion."
    note: "Persuasion has two goals: move the audience to act, or change what they think."

  es.c1.unit08.lesson02.teach.la_pregunta_retorica:
    title: "the rhetorical question"
    gloss: "the rhetorical question"
    note: "*La pregunta retórica* asks without expecting an answer -- it makes the audience think."
    example_gloss: "A rhetorical question expects no answer."
  es.c1.unit08.lesson02.teach.de_verdad:
    title: "really / is it really true that"
    gloss: "really (a rhetorical-question opener)"
    note: "*De verdad* opens a rhetorical question: *¿de verdad...?* means 'do we really...?'."
    example_gloss: "Do we really want to leave our children a planet full of plastic?"
  es.c1.unit08.lesson02.teach.el_paralelismo:
    title: "parallelism"
    gloss: "parallelism"
    note: "*El paralelismo* repeats the same structure to give the sentence rhythm."
    example_gloss: "Parallelism repeats the same structure."
  es.c1.unit08.lesson02.teach.cada:
    title: "each / every"
    gloss: "each / every"
    note: "*Cada... cada... cada...* is a parallel list that builds emphasis."
    example_gloss: "Each bottle, each bag, each gesture leaves a footprint."
  es.c1.unit08.lesson02.teach.el_ritmo:
    title: "the rhythm"
    gloss: "the rhythm"
    note: "*El ritmo* is the pattern parallelism gives to a sentence."
    example_gloss: "Parallelism gives the sentence its rhythm."
  es.c1.unit08.lesson02.teach.dispositivos_note:
    title: "Two devices"
    gloss: "The rhetorical question expects no answer; parallelism repeats to give rhythm."
    note: "A rhetorical question engages the audience; parallelism drives the point home."

  es.c1.unit08.lesson03.teach.el_enfasis:
    title: "emphasis"
    gloss: "emphasis"
    note: "*El énfasis* underlines the most important idea."
    example_gloss: "Emphasis underlines the most important idea."
  es.c1.unit08.lesson03.teach.no_es_solo:
    title: "it is not only... it is..."
    gloss: "it is not only (an emphasis contrast)"
    note: "*No es solo... es...* is an emphasis contrast that raises the stakes."
    example_gloss: "It is not only a question of comfort: it is a question of responsibility."
  es.c1.unit08.lesson03.teach.la_apelacion:
    title: "the appeal"
    gloss: "the appeal"
    note: "*La apelación* is the call that moves the audience to act."
    example_gloss: "An appeal moves the audience to act."
  es.c1.unit08.lesson03.teach.apelar_a:
    title: "to appeal to"
    gloss: "to appeal to"
    note: "*Apelar a* names what you appeal to: reason, emotion, or values."
    example_gloss: "You can appeal to reason, to emotion, or to values."
  es.c1.unit08.lesson03.teach.la_razon:
    title: "reason"
    gloss: "reason"
    note: "*Apelar a la razón* means persuading with facts and logic."
    example_gloss: "Appeal to reason with facts."
  es.c1.unit08.lesson03.teach.la_emocion:
    title: "emotion"
    gloss: "emotion"
    note: "*Apelar a la emoción* means persuading with feeling and stories."
    example_gloss: "Appeal to emotion with stories."
  es.c1.unit08.lesson03.teach.los_valores:
    title: "values"
    gloss: "values"
    note: "*Apelar a los valores* means persuading through shared beliefs."
    example_gloss: "Appeal to shared values."
  es.c1.unit08.lesson03.teach.enfasis_note:
    title: "Emphasis and appeal"
    gloss: "Emphasis underlines; the appeal moves the audience."
    note: "Emphasis points at the key idea; the appeal drives the audience to act."

  es.c1.unit08.lesson04.teach.modular:
    title: "to modulate"
    gloss: "to modulate"
    note: "*Modular* means to adjust the intensity of your speech up or down."
    example_gloss: "Modulating intensity is raising it or lowering it."
  es.c1.unit08.lesson04.teach.la_intensidad:
    title: "the intensity"
    gloss: "the intensity"
    note: "*La intensidad* is how strong or forceful the delivery is."
    example_gloss: "The intensity of the speech rises and falls."
  es.c1.unit08.lesson04.teach.intensificar:
    title: "to intensify"
    gloss: "to intensify"
    note: "*Intensificar* means to make the message stronger, often at the end."
    example_gloss: "Intensify the message at the end."
  es.c1.unit08.lesson04.teach.atenuar:
    title: "to soften / tone down"
    gloss: "to soften / tone down"
    note: "*Atenuar* means to soften the tone so as not to alarm."
    example_gloss: "Soften the tone so as not to alarm."
  es.c1.unit08.lesson04.teach.subir_el_tono:
    title: "to raise the tone"
    gloss: "to raise the tone"
    note: "*Subir el tono* adds force to make a point land."
    example_gloss: "Raise the tone to give it force."
  es.c1.unit08.lesson04.teach.bajar_el_tono:
    title: "to lower the tone"
    gloss: "to lower the tone"
    note: "*Bajar el tono* calms and invites reflection."
    example_gloss: "Lower the tone to calm."
  es.c1.unit08.lesson04.teach.modular_note:
    title: "Modulating"
    gloss: "Modulate your stance and intensity to move the audience."
    note: "A good speaker raises and lowers the intensity on purpose."

  es.c1.unit08.lesson05.teach.el_texto:
    title: "The complete speech"
    gloss: >-
      Do we really want to leave our children a planet full of plastic?
      Each bottle we throw away, each bag we use only once, each gesture we
      do not make leaves a footprint. It is not only a question of comfort:
      it is a question of responsibility. That is why I ask you to change one
      habit today. Together we can reduce plastic, and together we can start
      today.
    glosses:
      queremos: "we want"
      dejar: "to leave"
      nuestros: "our"
      hijos: "children"
      planeta: "planet"
      lleno: "full"
      plástico: "plastic"
      botella: "bottle"
      tiramos: "we throw away"
      bolsa: "bag"
      usamos: "we use"
      sola: "only"
      vez: "time (una sola vez = only once)"
      gesto: "gesture"
      hacemos: "we make / do"
      deja: "leaves"
      huella: "trace / footprint"
      comodidad: "comfort"
      responsabilidad: "responsibility"
      les: "you (formal, to you all)"
      pido: "I ask"
      cambien: "you (formal) change"
      hábito: "habit"
      hoy: "today"
      juntos: "together"
      podemos: "we can"
      reducir: "to reduce"
      empezar: "to start"
    note: "The five-sentence appeal: a rhetorical question, a parallel list, an emphasis, a direct appeal, and a closing call."
  es.c1.unit08.lesson05.teach.elena_empece:
    title: "Elena: I started with a rhetorical question."
    gloss: "Elena: I started with a rhetorical question."
    note: "Elena names the opening device: *una pregunta retórica*."
  es.c1.unit08.lesson05.teach.mateo_paralelismo:
    title: "Mateo: Then you used a parallelism with each bottle, each bag, each gesture."
    gloss: "Mateo: Then you used a parallelism with each bottle, each bag, each gesture."
    note: "Mateo names the parallel structure: *cada botella, cada bolsa, cada gesto*."
  es.c1.unit08.lesson05.teach.elena_enfasis:
    title: "Elena: The emphasis is in the contrast: it is not only a question of comfort."
    gloss: "Elena: The emphasis is in the contrast: it is not only a question of comfort."
    note: "Elena names the emphasis: the *no es solo... es...* contrast."
  es.c1.unit08.lesson05.teach.mateo_apelacion:
    title: "Mateo: The final appeal is direct: I ask you to change one habit today."
    gloss: "Mateo: The final appeal is direct: I ask you to change one habit today."
    note: "Mateo names the appeal and its call to action: *les pido que cambien un hábito hoy*."
  es.c1.unit08.lesson05.teach.analizar_note:
    title: "Analyzing the speech"
    gloss: "Analyze the speech: identify each device and its function."
    note: "Analysis is naming each device and saying what it does for the audience."

  es.c1.unit08.lesson06.teach.elena_discurso_listo:
    title: "Elena: I have the speech ready for the assembly."
    gloss: "Elena: I have the speech ready for the assembly."
    note: "Elena has finished the speech for *la asamblea* (the assembly)."
  es.c1.unit08.lesson06.teach.mateo_leemelo:
    title: "Mateo: Read it to me, please."
    gloss: "Mateo: Read it to me, please."
    note: "Mateo asks to hear it: *Léemelo, por favor*."
  es.c1.unit08.lesson06.teach.modelo_discurso:
    title: "The model speech"
    gloss: >-
      Do we really want to leave our children a planet full of plastic?
      Each bottle we throw away, each bag we use only once, each gesture we
      do not make leaves a footprint. It is not only a question of comfort:
      it is a question of responsibility. That is why I ask you to change one
      habit today. Together we can reduce plastic, and together we can start
      today.
    note: "The complete appeal: a rhetorical question, a parallel list, an emphasis, a direct appeal, and a closing call."

exercises:
  es.c1.unit08.lesson01.exercise01.recognize_persuadir:
    instruction: "What does persuadir mean?"
    correct_option: "To persuade (to move someone to act)."
    distractors: ["To translate.", "To summarize.", "To describe."]
    accepted_answers: [{value: "To persuade (to move someone to act).", status: correct}]
    feedback: "*Persuadir* means to move someone to act or to change their mind."
  es.c1.unit08.lesson01.exercise02.recognize_retorica:
    instruction: "What is la retórica?"
    correct_option: "The art of persuading through language."
    distractors: ["The art of drawing.", "The study of grammar.", "A type of poem."]
    accepted_answers: [{value: "The art of persuading through language.", status: correct}]
    feedback: "*La retórica* is the art of persuading."
  es.c1.unit08.lesson01.exercise03.match_conceptos:
    instruction: "Match each persuasion term to its English meaning."
    accepted_answers:
      - value: {"persuadir": "to persuade", "el discurso": "the speech", "la audiencia": "the audience", "la retórica": "rhetoric", "el argumento": "the argument", "la opinión": "the opinion"}
        status: correct
    feedback: "The core vocabulary of persuasion."
  es.c1.unit08.lesson01.exercise04.order_persuadir:
    instruction: "Put the Spanish words in order to say persuading is moving the audience."
    accepted_answers:
      - {value: "Persuadir es mover a la audiencia", status: correct}
    feedback: "*Persuadir es mover a la audiencia*."
  es.c1.unit08.lesson01.exercise05.translate_persuadir:
    instruction: "Translate into Spanish: To persuade is to change someone's opinion."
    accepted_answers:
      - {value: "Persuadir es cambiar la opinión de alguien", status: correct}
    feedback: "*Persuadir es cambiar la opinión de alguien*."
  es.c1.unit08.lesson01.exercise06.speak_retorica:
    instruction: "Say aloud in Spanish: Rhetoric is the art of persuading."
    accepted_answers:
      - {value: "La retórica es el arte de persuadir", status: correct}
    feedback: "*La retórica es el arte de persuadir*."

  es.c1.unit08.lesson02.exercise01.recognize_pregunta:
    instruction: "What is una pregunta retórica?"
    correct_option: "A question asked for effect, not for an answer."
    distractors: ["A question with a wrong answer.", "A question in a quiz.", "A question about grammar."]
    accepted_answers: [{value: "A question asked for effect, not for an answer.", status: correct}]
    feedback: "*Una pregunta retórica* asks without expecting an answer."
  es.c1.unit08.lesson02.exercise02.recognize_paralelismo:
