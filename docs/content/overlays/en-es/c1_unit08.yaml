    distractors: ["It asks a question.", "It ends the speech.", "It quotes someone."]
    accepted_answers: [{value: "It repeats the same structure to give rhythm.", status: correct}]
    feedback: "*El paralelismo* repeats structure for rhythm."
  es.c1.unit08.lesson02.exercise03.match_dispositivos:
    instruction: "Match each device to its English meaning."
    accepted_answers:
      - value: {"la pregunta retórica": "the rhetorical question", "de verdad": "really (a rhetorical-question opener)", "el paralelismo": "parallelism", "cada": "each / every", "el ritmo": "the rhythm", "la huella": "the trace / footprint"}
        status: correct
    feedback: "The rhetorical question and parallelism."
