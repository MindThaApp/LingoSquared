  es.c1.unit08.lesson04.exercise01.recognize_intensidad:
    instruction: "What is la intensidad?"
    correct_option: "The strength or force of the delivery."
    distractors: ["The length of the speech.", "The number of words.", "The audience size."]
    accepted_answers: [{value: "The strength or force of the delivery.", status: correct}]
