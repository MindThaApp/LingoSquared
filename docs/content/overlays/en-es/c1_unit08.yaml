  es.c1.unit08.lesson04.exercise03.match_intensidad:
    instruction: "Match each modulation term to its English meaning."
    accepted_answers:
      - value: {"modular": "to modulate", "la intensidad": "the intensity", "intensificar": "to intensify", "atenuar": "to soften / tone down", "subir el tono": "to raise the tone", "bajar el tono": "to lower the tone"}
