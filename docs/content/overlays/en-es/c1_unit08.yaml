  es.c1.unit08.lesson03.exercise03.match_enfasis:
    instruction: "Match each emphasis/appeal term to its English meaning."
    accepted_answers:
      - value: {"el énfasis": "emphasis", "no es solo": "it is not only (an emphasis contrast)", "la apelación": "the appeal", "apelar a": "to appeal to", "la razón": "reason", "la emoción": "emotion", "los valores": "values"}
        status: correct
