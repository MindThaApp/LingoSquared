    instruction: "Put the Spanish words in order to say each bottle, each bag, each gesture leaves a footprint."
    accepted_answers:
      - {value: "Cada botella cada bolsa cada gesto deja una huella", status: correct}
    feedback: "*Cada botella, cada bolsa, cada gesto deja una huella*."
  es.c1.unit08.lesson02.exercise05.translate_pregunta:
    instruction: "Translate into Spanish: A rhetorical question expects no answer."
    accepted_answers:
      - {value: "Una pregunta retórica no espera respuesta", status: correct}
    feedback: "*Una pregunta retórica no espera respuesta*."
  es.c1.unit08.lesson02.exercise06.speak_paralelismo:
    instruction: "Say aloud in Spanish: Parallelism repeats the same structure."
