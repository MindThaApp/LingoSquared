    title: Jugar a and hacer with sports
    gloss: 'Use jugar a with sports like football and hacer with others like yoga: juego al fútbol, hago yoga.'
    note: One construction covers every deporte -- no need to learn a separate verb per deporte at this level.
  es.a1.unit54.lesson02.teach.veces_por_semana:
