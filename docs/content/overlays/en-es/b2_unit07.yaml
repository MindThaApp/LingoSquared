course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: negotiate and resolve an everyday
    disagreement -- make a proposal and state your terms (te propongo que,
    qué tal si, mi propuesta es que), decline a term politely (eso no
    puedo hacerlo, prefiero que no), offer a conditional concession (pero
    solo si, siempre que, con tal de que, a menos que), and reach
    agreement (trato hecho, de acuerdo, ¿podríamos llegar a un punto
    medio?), around the everyday puzzle of two friends organizing a
    surprise party together and dividing the tasks.

units:
  es.b2.unit07.negociacion:
    title: Negotiation
    description: Negotiate and resolve a disagreement -- state your terms, decline a term politely, offer a conditional concession ("I can do X, but only if you do Y"), and reach an agreement, while telling what's settled from what's still open.

lessons:
  es.b2.unit07.lesson01.hacer_una_propuesta:
    title: "Making a proposal"
  es.b2.unit07.lesson02.rechazar_con_cortesia:
    title: "Declining politely"
  es.b2.unit07.lesson03.una_condicion:
    title: "Attaching a condition"
  es.b2.unit07.lesson04.llegar_a_un_acuerdo:
    title: "Reaching an agreement"
  es.b2.unit07.lesson05.que_se_ha_acordado:
    title: "What was agreed?"
  es.b2.unit07.lesson06.negociar_en_conversacion:
    title: "Negotiating in conversation"

teaching:
  es.b2.unit07.lesson01.teach.fiesta_setup:
    title: "We're going to organize a surprise party for Sofía."
    gloss: "We're going to organize a surprise party for Sofía."
    note: "The situation this whole unit negotiates: you and a friend are organizing a surprise party together and have to divide the work. *Una fiesta sorpresa* = 'a surprise party'."
  es.b2.unit07.lesson01.teach.cocinar:
    title: "to cook"
    gloss: "to cook"
    note: "*Cocinar* = 'to cook'. *Cocine* is the present SUBJUNCTIVE (1st person) -- it appears after *te propongo que*, which always requires the subjunctive in the clause it introduces."
    example_gloss: "I propose that I cook."
  es.b2.unit07.lesson01.teach.te_propongo:
    title: "I propose that..."
    gloss: "I propose that..."
    note: "*Te propongo que...* opens a proposal. *Proponer que* always takes the SUBJUNCTIVE in the following clause -- *que yo cocine*, not *que yo cocino*."
    example_gloss: "I propose that I cook."
  es.b2.unit07.lesson01.teach.comprar_bebida:
    title: "the drinks"
    gloss: "the drinks"
    note: "*La bebida* = 'the drinks'. *Compres* is the present SUBJUNCTIVE (tú), used after *te propongo que* for the same reason as *cocine* above: *Te propongo que tú compres la bebida*."
    example_gloss: "I propose that you buy the drinks."
  es.b2.unit07.lesson01.teach.que_tal_si:
    title: "how about...? / what if...?"
    gloss: "how about...? / what if...?"
    note: "*¿Qué tal si...?* floats a real, open suggestion -- unlike *te propongo que*, it takes the INDICATIVE: *¿Qué tal si decoramos juntos?* ('what if we decorate together?')."
    example_gloss: "What if we decorate together?"
  es.b2.unit07.lesson01.teach.y_si:
    title: "and what if...?"
    gloss: "and what if...?"
    note: "*¿Y si...?* raises another open possibility, also with the INDICATIVE: *¿Y si compramos la comida juntos?* ('what if we buy the food together?')."
    example_gloss: "What if we buy the food together?"
  es.b2.unit07.lesson01.teach.mi_propuesta:
    title: "my proposal is that..."
    gloss: "my proposal is that..."
    note: "*Mi propuesta es que...* states your terms plainly, and -- like *te propongo que* -- takes the SUBJUNCTIVE: *que tú traigas la música* ('that you bring the music')."
    example_gloss: "My proposal is that you bring the music."
  es.b2.unit07.lesson01.teach.grammar_proponer:
    title: "I propose that I cook. What if we decorate together? My proposal is that you bring the music."
    gloss: "I propose that I cook. What if we decorate together? My proposal is that you bring the music."
    note: "Two families of proposal: *te propongo que* / *mi propuesta es que* + SUBJUNCTIVE state a term you want; *qué tal si* / *y si* + INDICATIVE float an open suggestion. Both put a term on the table -- the opening move of any negotiation."

  es.b2.unit07.lesson02.teach.limpiar:
    title: "to clean"
    gloss: "to clean / to clean up"
    note: "*Limpiar* = 'to clean' -- the task at the center of this unit's core trade. *Tengo que* = 'I have to'."
    example_gloss: "I have to clean up after the party."
  es.b2.unit07.lesson02.teach.eso_no_puedo:
    title: "I can't do that."
    gloss: "I can't do that."
    note: "*Eso no puedo hacerlo* = 'I can't do that' -- a plain, honest decline. *Hacerlo* = 'to do it' (*hacer* + the pronoun *lo*, 'it')."
  es.b2.unit07.lesson02.teach.lo_siento:
    title: "I'm sorry, but I can't clean today."
    gloss: "I'm sorry, but I can't clean today."
    note: "*Lo siento, pero no puedo...* softens a decline with an apology first -- more cushioned than a bare *no puedo*."
  es.b2.unit07.lesson02.teach.prefiero_que_no:
    title: "I'd rather not."
    gloss: "I'd rather not."
    note: "*Prefiero que no* -- the gentlest decline of all, a short, friendly 'I'd rather not'."
  es.b2.unit07.lesson02.teach.no_me_viene_bien:
    title: "That doesn't work for me."
    gloss: "That doesn't work for me."
    note: "*Eso no me viene bien* = 'that doesn't work for me' -- declines because the timing or circumstance is wrong, not because you're unwilling."
  es.b2.unit07.lesson02.teach.no_puedo_con_todo:
    title: "I can't do everything."
    gloss: "I can't handle everything."
    note: "*No puedo con todo* = 'I can't handle everything' -- the honest reason a negotiation is needed at all."
  es.b2.unit07.lesson02.teach.grammar_rechazar:
    title: "I can't do that. I'm sorry, but I can't. I'd rather not. That doesn't work for me."
    gloss: "I can't do that. I'm sorry, but I can't. I'd rather not. That doesn't work for me."
    note: "Declining a term without giving offence: *eso no puedo hacerlo* (plain), *lo siento, pero no puedo* (apologetic), *prefiero que no* (gentle), *eso no me viene bien* (circumstantial). A polite 'no' keeps the negotiation alive."

  es.b2.unit07.lesson03.teach.limpias:
    title: "you clean"
    gloss: "you clean (tú, present indicative)"
    note: "*Limpias* is the INDICATIVE tú form of *limpiar* -- the form you need after *si* (see *pero solo si* below)."
    example_gloss: "You clean very well."
  es.b2.unit07.lesson03.teach.solo_si:
    title: "but only if..."
    gloss: "but only if..."
    note: "*Pero solo si...* attaches a condition. *Si* ('if') is never followed by the present subjunctive, so a present-tense condition stays INDICATIVE: *Puedo cocinar, pero solo si tú limpias* (not *limpies*), even though the cleaning hasn't happened yet."
    example_gloss: "I can cook, but only if you clean."
  es.b2.unit07.lesson03.teach.core_move:
    title: "I can cook, but only if you clean."
    gloss: "I can cook, but only if you clean."
    note: "This is the heart of the unit: a CONDITIONAL CONCESSION -- 'I can do X, but only if you do Y'."
  es.b2.unit07.lesson03.teach.siempre_que:
    title: "as long as / provided that"
    gloss: "as long as / provided that"
    note: "*Siempre que...* in the sense 'as long as' takes the SUBJUNCTIVE (*limpies*, not *limpias*) -- unlike *si*, which never takes the present subjunctive. (With the indicative, *siempre que* means 'whenever' instead.)"
    example_gloss: "I agree, as long as you clean."
  es.b2.unit07.lesson03.teach.con_tal_de_que:
    title: "provided that"
    gloss: "provided that"
    note: "*Con tal de que...* also always takes the SUBJUNCTIVE: *Lo hago, con tal de que tú traigas el pastel* ('I'll do it, provided that you bring the cake')."
    example_gloss: "I'll do it, provided that you bring the cake."
  es.b2.unit07.lesson03.teach.a_menos_que:
    title: unless
    gloss: unless
    note: "*A menos que...* -- the negative conditional, also SUBJUNCTIVE, naming the one case that would change your offer: *Yo lo hago, a menos que prefieras hacerlo tú* ('I'll do it, unless you'd rather do it yourself')."
    example_gloss: "I'll do it, unless you'd rather do it yourself."
  es.b2.unit07.lesson03.teach.estoy_de_acuerdo:
    title: "I agree"
    gloss: "I agree"
    note: "*Estoy de acuerdo* = 'I agree' -- the plain agreement frame this lesson's matching exercise tests, before a condition (*siempre que...*) or a partial hedge (*en parte, pero...*) gets attached to it."
    example_gloss: "I agree, as long as you clean."
  es.b2.unit07.lesson03.teach.estoy_de_acuerdo_pero:
    title: "I partly agree, but..."
    gloss: "I partly agree, but..."
    note: "*Estoy de acuerdo en parte, pero...* accepts some of a proposal while flagging the part you still want to negotiate."
    example_gloss: "I partly agree, but I'd rather clean myself."
  es.b2.unit07.lesson03.teach.grammar_condicion:
    title: "I can cook, but only if you clean. I agree, as long as you clean. I'll do it, provided that you bring the cake."
    gloss: "I can cook, but only if you clean. I agree, as long as you clean. I'll do it, provided that you bring the cake."
    note: "The unit's core grammar contrast: *si* (as in *pero solo si*) never takes the present subjunctive, so the condition stays INDICATIVE (*tú limpias*); *siempre que* ('as long as'), *con tal de que* and *a menos que* always take the SUBJUNCTIVE (*tú limpies*). The choice depends on the connector, not on how certain the condition is. A conditional concession gives ground without giving in -- this is the move that resolves most real disagreements."

  es.b2.unit07.lesson04.teach.trato_hecho:
    title: "Deal!"
    gloss: "Deal! / It's a deal!"
    note: "*¡Trato hecho!* seals an agreement -- the single phrase you say once both sides are happy with the terms."
  es.b2.unit07.lesson04.teach.de_acuerdo:
    title: Agreed.
    gloss: Agreed.
    note: "*De acuerdo* accepts a proposed term -- a plain, friendly yes."
  es.b2.unit07.lesson04.teach.me_parece_bien:
    title: "That sounds good to me."
    gloss: "That sounds good to me."
    note: "*Me parece bien* = 'that sounds good to me' -- a warmer yes than a bare *de acuerdo*."
  es.b2.unit07.lesson04.teach.punto_medio:
    title: "Could we reach a middle ground?"
    gloss: "Could we reach a middle ground?"
    note: "*¿Podríamos llegar a un punto medio?* asks to compromise when neither side's term is fully accepted yet -- *punto medio* = 'middle ground'."
  es.b2.unit07.lesson04.teach.gasto:
    title: "the cost"
    gloss: "the cost / the expense"
    note: "*El gasto* = 'the cost'. *Dividir el gasto* = 'to split the cost' -- the money side of the negotiation, on top of who does which task."
    example_gloss: "We're going to split the cost."
  es.b2.unit07.lesson04.teach.pagar_mitad:
    title: "to pay half"
    gloss: "to pay half"
    note: "*Pagar* = 'to pay'. *La mitad* = 'half'. *Tú pagas la mitad* = 'you pay half'."
    example_gloss: "You pay half."
  es.b2.unit07.lesson04.teach.grammar_acuerdo:
    title: "Could we reach a middle ground? Deal! We're going to split the cost and you pay half."
    gloss: "Could we reach a middle ground? Deal! We're going to split the cost and you pay half."
    note: "Closing the deal: once the terms and any condition are settled, seal it with *¡trato hecho!*, *de acuerdo*, or *me parece bien* -- or, if you're not quite there yet, propose a *punto medio*."

  es.b2.unit07.lesson05.teach.texto:
    title: "Reading: dividing the party"
    gloss: "I propose that I cook. Will you buy the drinks? — Agreed. But I can't clean today because I have to work. — Okay, then I'll clean, but only if you bring the cake. — Deal. About the gift, we'll decide tomorrow."
    glosses:
      compras: "you buy (tú, present indicative)"
      limpio: "I clean (present indicative)"
      traes: "you bring (tú, present indicative)"
      sobre: about
      regalo: gift
      decidimos: "we decide"

  es.b2.unit07.lesson06.teach.idea:
    title: "a good idea"
    gloss: "a good idea"
    note: "*Una buena idea* = 'a good idea' -- how you accept the other side's opening before you add your own terms."
    example_gloss: "It's a good idea."
  es.b2.unit07.lesson06.teach.compro:
    title: "I buy"
    gloss: "I buy (present indicative)"
    note: "*Compro* is the plain INDICATIVE 'I buy' -- used here to state your own new offer, not inside a *que* clause."
    example_gloss: "I'll buy the cake."
  es.b2.unit07.lesson06.teach.dialogue_mateo_open:
    title: "Mateo: What if we organize the party together?"
    gloss: "Mateo: What if we organize the party together?"
  es.b2.unit07.lesson06.teach.dialogue_elena_propose:
    title: "Elena: Good idea. I propose that I cook."
    gloss: "Elena: Good idea. I propose that I cook."
  es.b2.unit07.lesson06.teach.dialogue_mateo_ask:
    title: "Mateo: And you buy the drinks?"
    gloss: "Mateo: And you buy the drinks?"
  es.b2.unit07.lesson06.teach.dialogue_elena_decline_concede:
    title: "Elena: No, I can't do that today. But I'll buy the drinks tomorrow, provided that you bring the cake."
    gloss: "Elena: No, I can't do that today. But I'll buy the drinks tomorrow, provided that you bring the cake."
  es.b2.unit07.lesson06.teach.dialogue_mateo_bill_gift:
    title: "Mateo: Deal. And about the gift?"
    gloss: "Mateo: Deal. And about the gift?"
  es.b2.unit07.lesson06.teach.dialogue_elena_agree:
    title: "Elena: Let's buy it together, okay?"
    gloss: "Elena: Let's buy it together, okay?"
  es.b2.unit07.lesson06.teach.grammar_completo:
    title: "I propose that I cook. I can't do that today, but I'll buy the drinks tomorrow, provided that you bring the cake."
    gloss: "I propose that I cook. I can't do that today, but I'll buy the drinks tomorrow, provided that you bring the cake."
    note: "A whole negotiation move in one breath: STATE a term (*te propongo que yo cocine*), DECLINE another (*eso no puedo hacerlo hoy*), and offer a CONDITIONAL CONCESSION (*pero compro la bebida mañana, con tal de que tú traigas el pastel*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  es.b2.unit07.lesson01.exercise01.recognize_propongo:
    instruction: "What does this word mean?"
    correct_option: "I propose"
    distractors: ["I agree", "I decline", "I pay"]
    accepted_answers: [{value: "I propose", status: correct}]
    feedback: "Propongo means I propose -- te propongo que opens a proposal."
  es.b2.unit07.lesson01.exercise02.listen_te_propongo:
    instruction: "Listen and select what you hear."
    correct_option: "I propose that I cook."
    distractors: ["I propose that you cook.", "What if we cook together?", "I'd rather not cook."]
    accepted_answers: [{value: "I propose that I cook.", status: correct}]
    feedback: "Te propongo que yo cocine means I propose that I cook -- stating your own term."
  es.b2.unit07.lesson01.exercise03.match_proposing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"te propongo que": "I propose that", "qué tal si": "how about...? / what if...?", "y si": "and what if...?", "mi propuesta es que": "my proposal is that", cocinar: "to cook", "la bebida": "the drinks", fiesta: party, sorpresa: surprise}
        status: correct
    feedback: "These put a term on the table: te propongo que and mi propuesta es que + subjunctive state your terms; qué tal si and y si + indicative float an open suggestion."
  es.b2.unit07.lesson01.exercise04.order_te_propongo:
    instruction: "Put the words in order: I propose that I cook."
    accepted_answers:
      - {value: "Te propongo que yo cocine", status: correct}
    feedback: "Te propongo que yo cocine -- proponer que triggers the subjunctive (cocine, not cocino)."
  es.b2.unit07.lesson01.exercise05.translate_que_tal_si:
    instruction: "Translate into Spanish, proposing with qué tal si: What if we decorate together?"
    accepted_answers:
      - {value: "¿Qué tal si decoramos juntos?", status: correct}
    feedback: "¿Qué tal si decoramos juntos? means what if we decorate together? -- an open suggestion, so decoramos stays indicative."
  es.b2.unit07.lesson01.exercise06.speak_mi_propuesta:
    instruction: "Say aloud in Spanish, stating a term with mi propuesta es que: My proposal is that you bring the music."
    accepted_answers:
      - {value: "Mi propuesta es que tú traigas la música", status: correct}
      - {value: "Mi propuesta es que traigas la música", status: correct}
    feedback: "Mi propuesta es que tú traigas la música means my proposal is that you bring the music -- traigas is subjunctive after mi propuesta es que."
  es.b2.unit07.lesson01.exercise07.write_fiesta:
    instruction: "Write in Spanish: We're going to organize a surprise party for Sofía."
    accepted_answers:
      - {value: "Vamos a organizar una fiesta sorpresa para Sofía", status: correct}
      - {value: "Vamos a organizar una fiesta sorpresa para Sofía.", status: correct}
    feedback: "Vamos a organizar una fiesta sorpresa para Sofía means we're going to organize a surprise party for Sofía."
  es.b2.unit07.lesson01.exercise08.dictation_te_propongo:
    instruction: "Type what you hear."
    correct_response: "Te propongo que yo cocine"
    orthography_strict: true
    feedback: "You heard Te propongo que yo cocine -- I propose that I cook."

  es.b2.unit07.lesson02.exercise01.recognize_prefiero:
    instruction: "What does this word mean?"
    correct_option: "I prefer"
    distractors: ["I can", "I clean", "I pay"]
    accepted_answers: [{value: "I prefer", status: correct}]
    feedback: "Prefiero means I prefer -- prefiero que no is the gentlest way to decline."
  es.b2.unit07.lesson02.exercise02.listen_eso_no_puedo:
    instruction: "Listen and select what you hear."
    correct_option: "I can't do that."
    distractors: ["That sounds good to me.", "I agree to that.", "Could we reach a middle ground?"]
    accepted_answers: [{value: "I can't do that.", status: correct}]
    feedback: "Eso no puedo hacerlo means I can't do that -- a plain, honest decline."
  es.b2.unit07.lesson02.exercise03.match_declining:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"eso no puedo hacerlo": "I can't do that", "lo siento pero no puedo": "I'm sorry, but I can't", "prefiero que no": "I'd rather not", "eso no me viene bien": "that doesn't work for me", limpiar: "to clean", "no puedo con todo": "I can't handle everything"}
        status: correct
    feedback: "Different ways to say no politely, from the plainest (eso no puedo hacerlo) to the gentlest (prefiero que no)."
  es.b2.unit07.lesson02.exercise04.order_no_me_viene_bien:
    instruction: "Put the words in order: That doesn't work for me."
    accepted_answers:
      - {value: "Eso no me viene bien", status: correct}
    feedback: "Eso no me viene bien means that doesn't work for me."
  es.b2.unit07.lesson02.exercise05.translate_eso_no_puedo:
    instruction: "Translate into Spanish, declining politely by fronting 'that' and repeating it with a pronoun after the infinitive: I can't do that."
    accepted_answers:
      - {value: "Eso no puedo hacerlo", status: correct}
      - {value: "Eso no puedo hacerlo.", status: correct}
    feedback: "Eso no puedo hacerlo means I can't do that."
  es.b2.unit07.lesson02.exercise06.write_prefiero_que_no:
    instruction: "Write in Spanish, declining gently with the taught three-word 'I'd prefer not' phrase: I'd rather not."
    accepted_answers:
      - {value: "Prefiero que no", status: correct}
      - {value: "Prefiero que no.", status: correct}
    feedback: "Prefiero que no means I'd rather not -- the gentlest way to decline."
  es.b2.unit07.lesson02.exercise07.translate_no_puedo_con_todo:
    instruction: "Translate into Spanish, using no puedo con: I can't handle everything."
    accepted_answers:
      - {value: "No puedo con todo", status: correct}
    feedback: "No puedo con todo means I can't handle everything -- the reason a negotiation is needed."

