  es.b2.unit07.lesson03.exercise03.match_conditions:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"pero solo si": "but only if", "siempre que": "as long as", "con tal de que": "provided that", "a menos que": unless, "estoy de acuerdo": "I agree", limpias: "you clean (tú)"}
        status: correct
    feedback: "These attach a condition to a concession: pero solo si (si + indicative) versus siempre que, con tal de que and a menos que (always + subjunctive)."
