answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spanish A1
  description: 'Beginner Spanish for describing a person''s basic physical appearance: height and age impressions, hair and eye color, the core question ¿Cómo es ...?, and comparing two people''s appearance.'
units:
  es.a1.unit52.appearance:
    title: Describing appearance
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Tall, short, old, and young
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Describing hair
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Eyes and what does someone look like?
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena describes Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Comparing Diego and Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo recognizes Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Tall and short
    gloss: tall / short
    note: '*Alto* describes a tall person and *bajo* a short one; both agree with the person: *alta*, *baja*.'
    example_gloss:
    - Lucía is tall.
    - Diego is short.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Old and young
    gloss: old / young
    note: '*Mayor* and *joven* give a general impression of age, not an exact number of years.'
    example_gloss:
    - Grandpa is old.
    - Mateo is young.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: an impression, not a number'
    gloss: For an exact age you use tener años, as in ¿Cuántos años tienes?; mayor gives a general impression without a number, as in El abuelo es mayor.
    note: 'For an exact age you say *tener años*: *¿Cuántos años tienes?* *Mayor* only gives a general impression, with no number.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía is tall and Diego is short
    gloss: Lucía is tall and Diego is short.
    note: A simple combined sentence with *y* ("and"), setting up the direct comparison in a later lesson.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Hair
    gloss: the hair
    note: '*El pelo* is masculine and stays singular when you talk about someone''s hair as a whole.'
    example_gloss: Mateo has short black hair.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'Three hair colours: *rubio* (blond), *castaño* (brown) and *gris* (grey). *Rubio* agrees with the noun: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena has blond hair.
    - Diego has brown hair.
    - Grandpa has grey hair.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Largo* (long) is reused from the height lesson, now for hair length; *corto* (short) is new: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía has long hair.
    - Diego has short hair.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Adjectives follow the noun
    gloss: 'The adjective comes after the noun: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'In Spanish the adjective comes after the noun and agrees with it: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo and cabello
    gloss: 'Pelo and cabello mean the same thing. This course says pelo: el pelo largo.'
    note: '*Pelo* and *cabello* both mean "hair" in everyday Spanish; this course uses *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo has short black hair
    gloss: Mateo has short black hair.
    note: Reuses *negro* (black) from the unit on clothing.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena has long blond hair
    gloss: Elena has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Eyes
    gloss: the eyes
    note: '*Los ojos* is the plural of *el ojo*; both are masculine.'
    example_gloss: Mateo has brown eyes.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: '*Azul* (blue) and *verde* (green) have one form for both genders; *marrón* (brown) is the usual word for eye colour, while hair is *castaño*.'
    example_gloss:
    - Elena has blue eyes.
    - Diego has brown eyes.
    - Lucía has green eyes.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos takes a plural adjective
    gloss: 'With ojos (plural), the adjective is plural too: ojos azules, ojos marrones, ojos verdes.'
    note: 'Adjectives agree in number: *ojos* is plural, so *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: What does Elena look like?
    gloss: What does Elena look like?
    note: '*¿Cómo es ...?* is this unit''s core question; reuse it to ask about anyone''s appearance.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena has long blond hair and blue eyes
    gloss: Elena has long blond hair and blue eyes.
    note: A model answer combining hair and eyes in one sentence with *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena introduces Nina
    gloss: 'Elena: A new girl is coming to the language café. Her name is Nina.'
    note: '*Viene* ("is coming") introduces someone new; *se llama* means "is called".'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo asks what she looks like
    gloss: 'Mateo: Okay! What does she look like?'
    note: 'Reuses this unit''s core question without a name: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena describes Nina's height and hair
    gloss: 'Elena: She is short and she has short blond hair.'
    note: Combines *baja* from the first lesson with the hair vocabulary; *baja* is feminine because Nina is a girl.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo asks about her eyes
    gloss: 'Mateo: And her eyes?'
    note: '*¿Y los ojos?* picks up the topic with the definite article, so Spanish does not need *sus* here.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena describes Nina's eyes
    gloss: 'Elena: She has green eyes.'
    note: Reuses *los ojos verdes* from the lesson on eyes.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo will recognize her
    gloss: 'Mateo: Thanks! Then I''ll recognize her.'
    note: '*La reconoceré* ("I will recognize her") is a future form; *la* means "her" and goes before the verb.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Comparing Diego and Lucía
    gloss: Diego and Lucía are brother and sister, but they look different. Diego is short and has short brown hair and brown eyes. Lucía is taller than Diego and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      hermano: brother
      hermana: sister
      eres: look
      diferentes: different
      bajo: short
      corto: short
      castaño: brown
      pelo: hair
      marrones: brown
      ojos: eyes
      alta: taller
      largo: long
      verdes: green
      cómo: (part of 'eruit zien' = to look/appear)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Reusing the comparative pattern
    gloss: 'You already know the comparison pattern: más + adjective + que. Here you use it for people: Lucía is taller than Diego.'
    note: The *más + adjective + que* pattern from the unit on comparisons, now applied to people instead of objects.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía has longer hair than Diego
    gloss: Lucía has longer hair than Diego.
    note: '*Más largo que* compares two things: *el pelo más largo que Diego*; *largo* stays masculine because *pelo* is.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: A model first-person sentence with *tengo*, ready to reuse when describing yourself.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo spots Nina
    gloss: 'Mateo: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Mira* ("look") is the informal command of *mirar*, used here to point something out.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena confirms
    gloss: 'Elena: Yes, that''s Nina!'
    note: A short, natural confirmation.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina greets Mateo
    gloss: 'Nina: Hi, are you Mateo?'
    note: 'A simple informal greeting question: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo greets Nina back
    gloss: 'Mateo: Yes! Nice to meet you, Nina.'
    note: '*Encantado de conocerte* is the standard phrase for a first meeting; a woman says *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Mateo successfully recognized Nina from Elena's earlier description.
