answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on reasons, order, purpose, conditions, indirect questions and passing on messages."
  learning_goal: "Talk about real conditions in Spanish with si + present."
units:
  es.a2.unit107.si_llueve: {"title": "If It Rains", "description": "Talk about what happens or will happen if a real condition is met, such as weather plans or shop rules, with si + present."}
lessons:
  es.a2.unit107.lesson01.si_presente: {"title": "If + present"}
  es.a2.unit107.lesson02.futuro: {"title": "If... we will go"}
  es.a2.unit107.lesson03.tiempo_y_planes: {"title": "Weather and plans"}
  es.a2.unit107.lesson04.la_tienda: {"title": "Shop rules"}
  es.a2.unit107.lesson05.la_nota_de_elena: {"title": "Elena's Note"}
  es.a2.unit107.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit107.lesson01.teach.gn_si: {"title": "Si + present, present", "gloss": "If it rains, I do not go out. If I have time, I call Mateo. If Elena is tired, she sleeps.", "note": "*Si* means if. After *si* use a normal present tense. The result can also be in the present. Put a comma between the two parts."}
  es.a2.unit107.lesson01.teach.gn_orden: {"title": "The condition can go last", "gloss": "I do not go out if it rains. I call Mateo if I have time. Elena sleeps if she is tired.", "note": "You can put *si* last, with no comma. The meaning is the same."}
  es.a2.unit107.lesson01.teach.gn_no: {"title": "Si no", "gloss": "If it does not rain, I go out. If I do not have work, I go with you. If you are not tired, you come.", "note": "*Si no* + present says if something is not true. *No* goes just before the verb."}
  es.a2.unit107.lesson01.teach.palabras: {"title": "Words for conditions", "gloss": "if / time / with you / to have time / to be tired", "note": "*Si* (if) has no accent. *Sí* (yes) does. *Contigo* is with you.", "example_gloss": ["If it rains, I do not go out.", "If I have time, I call Mateo.", "If I do not have work, I go with you.", "Elena sleeps if she is tired."]}
  es.a2.unit107.lesson01.teach.frases: {"title": "Three sentences", "gloss": "If it rains, I do not go out. If I have time, I call. If I do not have work, I go with you."}
  es.a2.unit107.lesson02.teach.gn_futuro: {"title": "Si + present, future", "gloss": "If it is sunny, we will go to the village. If it rains tomorrow, we will not go out. If I have time, I will call you.", "note": "The result can be in the future: *iremos*, *saldremos*, *llamaré*. The verb after *si* stays in the present: never *si lloverá*."}
  es.a2.unit107.lesson02.teach.gn_plan: {"title": "Three results", "gloss": "If it is sunny, I go to the village. If it is sunny, we will go to the village. If it is sunny, we go to the village.", "note": "In everyday Spanish the result is often in the present. The future simple sounds a little more certain."}
  es.a2.unit107.lesson02.teach.palabras: {"title": "Weather and plans", "gloss": "it is sunny / it is cold / the village / we will go / we will go out", "note": "*Hace sol* uses *hacer*, like *hace frío*. The future of *ir* is *iré, irás, irá, iremos*; of *salir* it is *saldré, saldremos*.", "example_gloss": ["If it is sunny, we will go to the village.", "If it is cold, we will not go out.", "Elena's grandparents have a house in the village.", "If it rains, we will not go out."]}
  es.a2.unit107.lesson02.teach.gn_pregunta: {"title": "Asking", "gloss": "What do you do if it rains? If it rains, I do not go out. What will we do if it is cold? If it is cold, we will not go out.", "note": "Ask a question with *si* in the middle and answer with *si* at the start."}
  es.a2.unit107.lesson02.teach.frases: {"title": "Three sentences", "gloss": "If it is sunny, we will go to the village. If it is cold, we will not go out. If I have time, I will call you."}
  es.a2.unit107.lesson03.teach.gn_dos_planes: {"title": "Plan A, plan B", "gloss": "If it is sunny, we go to the village. If it rains, we go home. If it is cold, we take the train.", "note": "Use two *si* sentences for plan A and plan B. The present is enough for a plan."}
  es.a2.unit107.lesson03.teach.gn_y_si: {"title": "Y si...?", "gloss": "And if it rains? If it rains, we do not go out. And if you cannot? If I cannot, I write to you.", "note": "*¿Y si...?* asks about another possibility. Answer it with *si* + present."}
  es.a2.unit107.lesson03.teach.gn_quedarse: {"title": "Staying at home", "gloss": "If it rains, I stay at home. If it is cold, Elena stays at home.", "note": "*Quedarse en casa* means to stay at home. You only need to recognise it now: say it as one chunk. *Me quedo* is I stay."}
  es.a2.unit107.lesson03.teach.palabras: {"title": "Plans words", "gloss": "with you / home or house / with the dog / perfect", "note": "*En casa* is at home. *Con el perro* is with the dog.", "example_gloss": ["If it rains, I stay at home with the dog.", "If you come, we take the train.", "And if it rains?", "Perfect, see you tomorrow."]}
  es.a2.unit107.lesson03.teach.frases: {"title": "Three sentences", "gloss": "If it is sunny, we go to the village. And if it rains? If it rains, I stay at home."}
  es.a2.unit107.lesson04.teach.gn_norma: {"title": "Shop rules", "gloss": "If you do not have the receipt, you cannot exchange the product. If you pay by card, you do not pay more. If you buy two, the third is free.", "note": "Shop signs often use *si* + present, then a present result or *puedes* + infinitive. The *tú* form is common in shops for friendly signs."}
  es.a2.unit107.lesson04.teach.gn_usted: {"title": "Usted", "gloss": "If you do not have the receipt, you cannot exchange the product. If you pay by card, you do not pay more.", "note": "In a formal sign or from a shop assistant, use *usted*: *tiene*, *puede*, *paga* (the same form as *él* and *ella*)."}
  es.a2.unit107.lesson04.teach.palabras: {"title": "Shop words", "gloss": "the receipt / to exchange / the product / to pay / the card / free / more", "note": "*Cambiar* here means to exchange a product. *Gratis* does not change.", "example_gloss": ["If you do not have the receipt, you cannot exchange the product.", "If you pay by card, you do not pay more.", "If you buy two, the third is free.", "Elena pays by card."]}
  es.a2.unit107.lesson04.teach.gn_pregunta: {"title": "Asking a shop assistant", "gloss": "Can I exchange the product if I do not have the receipt? No, if you do not have the receipt you cannot exchange it.", "note": "A question about a rule is often *¿Puedo...?* + infinitive + *si* + present."}
  es.a2.unit107.lesson04.teach.frases: {"title": "Three sentences", "gloss": "If you do not have the receipt, you cannot exchange the product. If you pay by card, you do not pay more. If you buy two, the third is free."}
  es.a2.unit107.lesson05.teach.palabras: {"title": "Words for the note", "gloss": "to want to go / come with me / it does not matter / what do you say? / by train", "note": "*Ven* is the command form of *venir* for *tú*; learn it as a chunk. *Conmigo* is with me.", "example_gloss": ["I want to go to the village.", "If you have time, come with me.", "If you cannot, it does not matter.", "What do you say?"]}
  es.a2.unit107.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "If it is sunny, we will go by train. If it rains, we will not go out. If you cannot, it does not matter.", "note": "In the note, find three real conditions and the plan that goes with each."}
  es.a2.unit107.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. Tomorrow I want to go to my grandparents' village. If it is sunny, we will go by train. If it rains, we will not go out. If you have time, come with me. If you cannot, it does not matter. What do you say?", "note": "Look for each *si* and the result after it.", "glosses": {"pueblo": "village", "abuelos": "grandparents", "conmigo": "with me", "tren": "train"}}
  es.a2.unit107.lesson06.teach.d1: {"title": "Mateo asks", "gloss": "Mateo: Hi, Elena. What are you doing tomorrow?"}
  es.a2.unit107.lesson06.teach.d2: {"title": "Elena makes a plan", "gloss": "Elena: If it is sunny, I go to my grandparents' village. Are you coming?"}
  es.a2.unit107.lesson06.teach.d3: {"title": "Mateo asks about rain", "gloss": "Mateo: If I do not have work, I go with you. And if it rains?"}
  es.a2.unit107.lesson06.teach.d4: {"title": "Elena has plan B", "gloss": "Elena: If it rains, we do not go out. I stay at home with the dog."}
  es.a2.unit107.lesson06.teach.d5: {"title": "Mateo promises", "gloss": "Mateo: Then I call you tomorrow. If I can go, I write to you."}
  es.a2.unit107.lesson06.teach.d6: {"title": "Elena agrees", "gloss": "Elena: Perfect. If you come, we take the nine o'clock train."}
exercises:
