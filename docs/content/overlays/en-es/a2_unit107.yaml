  es.a2.unit107.lesson03.exercise01.elige_plan: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si hace sol, vamos al pueblo. Si llueve, vamos a casa.", "distractors": ["Si hace sol, vamos a casa. Si llueve, vamos al pueblo.", "Si hace sol, ir al pueblo. Si llueve, ir a casa.", "Si hace sol, vamos al pueblo. Si llueve, vamos al pueblo."], "accepted_answers": [{"value": "Si hace sol, vamos al pueblo. Si llueve, vamos a casa.", "status": "correct"}], "feedback": "Plan A for sun, plan B for rain."}
