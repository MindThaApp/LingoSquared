  es.a2.unit107.lesson03.exercise06.traduce_pueblo: {"instruction": "Translate into Spanish. Use *si* and the present.", "accepted_answers": [{"value": "Si hace sol, vamos al pueblo.", "status": "correct"}, {"value": "Si hace sol, vamos al pueblo", "status": "correct"}, {"value": "Si hace sol vamos al pueblo.", "status": "correct"}, {"value": "Si hace sol vamos al pueblo", "status": "correct"}, {"value": "Vamos al pueblo si hace sol.", "status": "correct"}, {"value": "Vamos al pueblo si hace sol", "status": "correct"}], "feedback": "*Si hace sol, vamos al pueblo.*"}
  es.a2.unit107.lesson03.exercise07.escribe_dos: {"instruction": "Write exactly two sentences, both with *si*.", "correct_option": "Si hace sol, vamos al pueblo. Si llueve, me quedo en casa.", "accepted_answers": [{"value": "Si hace sol, vamos al pueblo. Si llueve, me quedo en casa.", "status": "correct"}, {"value": "Si hace sol, vamos al pueblo. Si llueve, me quedo en casa", "status": "correct"}, {"value": "Si hace sol vamos al pueblo. Si llueve me quedo en casa.", "status": "correct"}, {"value": "Si hace sol vamos al pueblo. Si llueve me quedo en casa", "status": "correct"}], "feedback": "*Si hace sol, vamos al pueblo. Si llueve, me quedo en casa.*"}
  es.a2.unit107.lesson04.exercise01.elige_ticket: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si no tienes el ticket, no puedes cambiar el producto.", "distractors": ["Si no tienes el ticket, no puedo cambiar el producto.", "Si no tengo el ticket, no puedes cambiar el producto.", "Si no tienes el ticket, cambiar el producto puedes."], "accepted_answers": [{"value": "Si no tienes el ticket, no puedes cambiar el producto.", "status": "correct"}], "feedback": "*Tú* form in both parts: *tienes*, *puedes*."}
  es.a2.unit107.lesson04.exercise02.elige_gratis: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si compras dos, el tercero es gratis.", "distractors": ["Si compras dos, el tercero era gratis.", "Si compras dos, el tercero será gratis.", "Si compres dos, el tercero es gratis."], "accepted_answers": [{"value": "Si compras dos, el tercero es gratis.", "status": "correct"}], "feedback": "Present after *si*, present result."}
