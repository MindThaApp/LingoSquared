  es.a2.unit107.lesson01.exercise06.traduce_tiempo: {"instruction": "Translate into Spanish. Use *si*.", "accepted_answers": [{"value": "Si tengo tiempo, llamo a Mateo.", "status": "correct"}, {"value": "Si tengo tiempo, llamo a Mateo", "status": "correct"}, {"value": "Si tengo tiempo llamo a Mateo.", "status": "correct"}, {"value": "Si tengo tiempo llamo a Mateo", "status": "correct"}, {"value": "Llamo a Mateo si tengo tiempo.", "status": "correct"}, {"value": "Llamo a Mateo si tengo tiempo", "status": "correct"}], "feedback": "*Si tengo tiempo, llamo a Mateo.*"}
  es.a2.unit107.lesson01.exercise07.escribe_cansado: {"instruction": "Write the sentence starting with *Si*.", "correct_option": "Si Elena está cansada, duerme.", "accepted_answers": [{"value": "Si Elena está cansada, duerme.", "status": "correct"}, {"value": "Si Elena está cansada, duerme", "status": "correct"}, {"value": "Si Elena está cansada duerme.", "status": "correct"}, {"value": "Si Elena está cansada duerme", "status": "correct"}, {"value": "Elena duerme si está cansada.", "status": "correct"}, {"value": "Elena duerme si está cansada", "status": "correct"}, {"value": "Si está cansada, Elena duerme", "status": "correct"}], "feedback": "*Si Elena está cansada, duerme.*"}
  es.a2.unit107.lesson02.exercise01.elige_futuro: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si hace sol, iremos al pueblo.", "distractors": ["Si hará sol, iremos al pueblo.", "Si hace sol, ir al pueblo.", "Si haga sol, iremos al pueblo."], "accepted_answers": [{"value": "Si hace sol, iremos al pueblo.", "status": "correct"}], "feedback": "The verb after *si* stays in the present: *si hace sol*."}
  es.a2.unit107.lesson02.exercise02.elige_saldremos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si llueve mañana, no saldremos.", "distractors": ["Si lloverá mañana, no saldremos.", "Si llueve mañana, no saldrán.", "Si llueve mañana, no salir."], "accepted_answers": [{"value": "Si llueve mañana, no saldremos.", "status": "correct"}], "feedback": "Present after *si*; future in the result."}
  es.a2.unit107.lesson02.exercise03.une_tiempo: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "hace sol", "right": "it is sunny"}, {"left": "hace frío", "right": "it is cold"}, {"left": "llueve", "right": "it rains"}, {"left": "el pueblo", "right": "the village"}, {"left": "iremos", "right": "we will go"}, {"left": "saldremos", "right": "we will go out"}, {"left": "te llamaré", "right": "I will call you"}], "status": "correct"}], "feedback": "Weather and future forms."}
  es.a2.unit107.lesson02.exercise04.ordena_pueblo: {"instruction": "Put the words in order to say 'If it is sunny, we will go to the village.'", "correct_option": "Si hace sol iremos al pueblo", "accepted_answers": [{"value": "Si hace sol iremos al pueblo", "status": "correct"}, {"value": "Iremos al pueblo si hace sol", "status": "correct"}], "feedback": "*Si* + present, then the result."}
