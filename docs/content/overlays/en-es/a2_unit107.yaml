  es.a2.unit107.lesson01.exercise02.elige_si_no: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Si no tengo trabajo, voy contigo.", "distractors": ["Si no tengo trabajo, voy con tú.", "Si no tengo trabajo, voy sin ti.", "Si tengo trabajo no, voy contigo."], "accepted_answers": [{"value": "Si no tengo trabajo, voy contigo.", "status": "correct"}], "feedback": "*Si no tengo trabajo* = if I do not have work."}
  es.a2.unit107.lesson01.exercise03.une_condiciones: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "si llueve", "right": "if it rains"}, {"left": "si no llueve", "right": "if it does not rain"}, {"left": "si tengo tiempo", "right": "if I have time"}, {"left": "si estoy cansado", "right": "if I am tired"}, {"left": "contigo", "right": "with you"}, {"left": "el tiempo", "right": "time"}, {"left": "si", "right": "if"}], "status": "correct"}], "feedback": "Conditions with *si*."}
  es.a2.unit107.lesson01.exercise04.ordena_duerme: {"instruction": "Put the words in order to say 'Elena sleeps if she is tired.'", "correct_option": "Elena duerme si está cansada", "accepted_answers": [{"value": "Elena duerme si está cansada", "status": "correct"}, {"value": "Si está cansada Elena duerme", "status": "correct"}, {"value": "Si Elena está cansada duerme", "status": "correct"}], "feedback": "*Si* + present verb."}
