  es.a2.unit107.lesson03.exercise03.une_planes: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "¿Y si llueve?", "right": "And if it rains?"}, {"left": "Si llueve, me quedo en casa.", "right": "If it rains, I stay at home."}, {"left": "Si hace sol, vamos al pueblo.", "right": "If it is sunny, we go to the village."}, {"left": "Si vienes, tomamos el tren.", "right": "If you come, we take the train."}, {"left": "Si puedo, te escribo.", "right": "If I can, I write to you."}, {"left": "con el perro", "right": "with the dog"}], "status": "correct"}], "feedback": "Plans with *si*."}
  es.a2.unit107.lesson03.exercise04.ordena_y_si: {"instruction": "Put the words in order to say 'If it rains, I stay at home.'", "correct_option": "Si llueve me quedo en casa", "accepted_answers": [{"value": "Si llueve me quedo en casa", "status": "correct"}, {"value": "Me quedo en casa si llueve", "status": "correct"}], "feedback": "*Si* + present, then *me quedo*."}
