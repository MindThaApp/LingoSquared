  es.a2.unit107.lesson02.exercise06.traduce_frio: {"instruction": "Translate into Spanish. Use the future of *salir*.", "accepted_answers": [{"value": "Si hace frío, no saldremos.", "status": "correct"}, {"value": "Si hace frío, no saldremos", "status": "correct"}, {"value": "Si hace frío no saldremos.", "status": "correct"}, {"value": "Si hace frío no saldremos", "status": "correct"}, {"value": "Si hace frío, no vamos a salir", "status": "correct"}], "feedback": "*Si hace frío, no saldremos.*"}
