teaching:
  es.a1.unit09.lesson01.teach.la_calle: {title: "The street", gloss: "the street", note: "*Calle* is feminine.", example_gloss: "I live on this street."}
  es.a1.unit09.lesson01.teach.la_esquina: {title: "The corner", gloss: "the corner", note: "*Esquina* is feminine.", example_gloss: "The bank is on the corner."}

  es.a1.unit09.lesson02.teach.seguir_derecho: {title: "Go straight", gloss: "Go straight.", note: "*Sigue* is the informal command form of *seguir* (to follow/continue), reused throughout this unit's directions."}
  es.a1.unit09.lesson02.teach.doblar_izquierda: {title: "Turn left", gloss: "Turn left.", note: "*Dobla* is the informal command form of *doblar* (to turn/fold). See the following grammar note on *doblar* vs. *girar*."}
  es.a1.unit09.lesson02.teach.girar_derecha: {title: "Turn right", gloss: "Turn right.", note: "*Gira* is the informal command form of *girar* (to turn/rotate), fully interchangeable with *doblar*."}
  es.a1.unit09.lesson02.teach.cruzar_la_calle: {title: "Cross the street", gloss: "Cross the street.", note: "*Cruza* is the informal command form of *cruzar* (to cross)."}
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note: {title: "Doblar vs. girar", gloss: "Two equally natural words for \"to turn.\"", note: "See the card's own text."}

  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca: {title: "Ask how to get somewhere", gloss: "How do I get to the library?", note: "*Cómo llego a* (how do I get to) is the standard way to ask for directions to a specific place."}
  es.a1.unit09.lesson03.teach.es_facil: {title: "Say it's easy", gloss: "It's easy.", note: "A common, reassuring phrase said before giving directions."}
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle: {title: "Go straight down this street", gloss: "Go straight down this street.", note: "*Por esta calle* (along/down this street) specifies which street to follow."}
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina: {title: "Turn left at the corner", gloss: "Turn left at the corner.", note: "*En la esquina* (at the corner) says where the turn happens."}

  es.a1.unit09.lesson04.teach.esta_bien_asi: {title: "Ask for confirmation", gloss: "Is that right?", note: "*¿Está bien así?* (is it okay like this?) checks understanding after repeating directions back, the natural next step after being told a route."}
  es.a1.unit09.lesson04.teach.si_asi_es: {title: "Confirm", gloss: "Yes, that's right.", note: "*Así es* (that's how it is) is a natural, brief confirmation."}
  es.a1.unit09.lesson04.teach.no_te_pierdas: {title: "Don't get lost", gloss: "Don't get lost!", note: "*No te pierdas* is the informal negative command of *perderse* (to get lost), a warm, casual send-off."}

  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: "Reading written directions"
    gloss: "To get to the library from the market: go straight down this street. Turn left at the corner. Then, cross the street. The library is on the right."
    note: "Written directions list the steps in order: *Para llegar a...* (to get to...) names the destination, then each step is a *tú* command (*sigue*, *dobla*, *cruza*), and *después* (then) links the steps."
    glosses: {llegar: "to get / arrive", biblioteca: "library", desde: "from", mercado: "market", sigue: "continue / go (from seguir)", derecho: "straight ahead", calle: "street", Dobla: "turn (from doblar)", izquierda: "left", esquina: "corner", Después: "then / afterward", cruza: "cross (from cruzar)", está: "is located (from estar)", derecha: "right"}
  es.a1.unit09.lesson05.teach.desde_note: {title: "Desde (from)", gloss: "How desde marks a route's starting point.", note: "See the card's own text."}

  es.a1.unit09.lesson06.teach.line01: {title: "Ask for directions", gloss: "Mateo asks Elena how to get to the library from the market.", note: "The same *¿Cómo llego a...?* question from earlier in this unit, now with a starting point: *desde el mercado* (from the market)."}
  es.a1.unit09.lesson06.teach.line02: {title: "Give the first step", gloss: "Elena says it's easy and gives the first direction.", note: "*Es fácil* (it's easy) reassures before giving the first step."}
  es.a1.unit09.lesson06.teach.line03: {title: "Repeat back and ask for more", gloss: "Mateo repeats the instruction and asks what comes next.", note: "*Sigo derecho* (I'm going straight) is the first-person form of *seguir*, showing Mateo actively confirming as he follows along."}
  es.a1.unit09.lesson06.teach.line04: {title: "Give the second step", gloss: "Elena tells him to turn left at the corner.", note: "*Dobla* (turn) -- *gira* would mean the same here."}
  es.a1.unit09.lesson06.teach.line05: {title: "Repeat back and confirm", gloss: "Mateo repeats the turn and asks if that's right.", note: "*Doblo* (I turn) mirrors his earlier *Sigo derecho* -- Mateo repeats each step back in the *yo* form to check it."}
  es.a1.unit09.lesson06.teach.line06: {title: "Confirm and give the final steps", gloss: "Elena confirms, then tells him to cross the street -- the library will be on the right.", note: "*Sí, así es* (yes, that's right) confirms, then *después* (then) introduces the last steps of the route."}
  es.a1.unit09.lesson06.teach.line07: {title: "Thank Elena", gloss: "Mateo thanks Elena warmly.", note: "*Muchas gracias* (thanks a lot) is a warmer version of the simple *gracias*."}
  es.a1.unit09.lesson06.teach.line08: {title: "Respond and send off", gloss: "Elena says you're welcome and tells him not to get lost.", note: "*De nada* (you're welcome) is the standard reply to *gracias*."}

