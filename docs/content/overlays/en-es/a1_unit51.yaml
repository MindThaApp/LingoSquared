teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: The ticket
    gloss: the ticket
    note: '*El billete* is masculine, so it takes *un billete*, not *una*.'
    example_gloss: I would like a ticket to Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Requesting a ticket
    gloss: I would like a ticket to Toledo.
    note: '*Quisiera* ("I would like") softens a request and is more polite than *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: The agent asks which kind
    gloss: Would you like a one-way ticket or a return?
    note: '*Quiere* is the formal *usted* form of *querer*, used here for an unfamiliar station employee.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Answering politely
    gloss: A return, please.
    note: '*Por favor* is how you say please; the request stays polite and short.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Register at the counter
    gloss: At the counter, you usually use the polite form usted.
    note: Strangers in a service role are addressed as *usted*, not *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: The platform
    gloss: the platform
    note: '*El andén* is masculine: *un andén*, *el andén*.'
    example_gloss: From which platform does the train to Toledo leave?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Asking which platform
    gloss: From which platform does the train to Toledo leave?
    note: '*¿De qué andén ...?* asks specifically for the platform, not for a general location.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Stating departure details
    gloss: The train leaves at a quarter to ten from platform five.
    note: '*Las diez menos cuarto* reuses the "minus a quarter" clock pattern from the lesson on time.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Asking arrival time
    gloss: What time does the train arrive?
    note: '*¿A qué hora llega ...?* asks for an arrival time; *llegar* is regular and takes *a las* before the time.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Stating arrival time
    gloss: The train arrives at eleven o'clock.
    note: '*Llega a las once* uses *llegar* (to arrive) with *a las* before the time.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: On time / the delay
    gloss: on time; the delay
    note: '*A tiempo* is a fixed expression for something happening as scheduled. *El retraso* (the delay) is masculine.'
    example_gloss:
    - The train does not leave on time.
    - 'Attention: the train to Toledo is delayed.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: An announcement
    gloss: 'Attention: the train to Toledo is delayed.'
    note: '*Atención* opens a station announcement, like English "Attention, passengers."'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: Negating on time
    gloss: The train does not leave on time.
    note: '*No* stands right before the verb and negates the whole sentence: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: A platform change
    gloss: The train leaves from platform three instead of platform five.
    note: '*En lugar de* means "instead of".'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Stating the delay length
    gloss: The train has a ten-minute delay.
    note: '*Lleva retraso* (literally "carries delay") is the natural way to say something is delayed.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Entrance, exit, waiting room
    gloss: the entrance; the exit; the waiting room
    note: '*La entrada*, *la salida* and *la sala de espera* are all feminine nouns.'
    example_gloss:
    - Where is the entrance?
    - Where is the exit?
    - Where is the waiting room?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Asking where a platform is
    gloss: Where is platform seven?
    note: This reuses the *¿Dónde está ...?* pattern from the lessons on directions.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Giving directions
    gloss: Straight ahead and then right.
    note: '*Todo recto* and *a la derecha* are the direction phrases from the lessons on directions, reused in a station.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Asking about the waiting room
    gloss: Where is the waiting room?
    note: The same question pattern applied to a new place.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Read a printed ticket
    gloss: 'Ticket: Madrid Atocha to Toledo. Departure: ten past ten, platform seven. Arrival: ten to eleven. Return. Price: twelve euros forty.'
    note: Track the departure time and platform, the arrival time, the ticket type, and the price.
    glosses:
      Billete: ticket
      Salida: departure
      diez: ten
      andén: platform
      siete: seven
      Llegada: arrival
      once: eleven
      vuelta: return ticket
      Precio: price
      doce: twelve
      euros: euros
      cuarenta: forty
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo states the plan
    gloss: 'Mateo: We need to get to platform seven. The train leaves at ten past ten.'
    note: '*Tenemos que* + infinitive ("we have to") expresses a practical necessity.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena reads the sign
    gloss: 'Elena: Look, there''s the sign: delay, ten minutes.'
    note: '*Ahí está* ("there it is") points out the sign; *el panel* is the information board.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo stays calm
    gloss: 'Mateo: No problem, we still have time for a coffee.'
    note: '*No hay problema* is a common, casual reassurance.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: The train arrives
    gloss: 'Elena: Good idea. Oh, there''s the train already. Platform seven, exactly!'
    note: '*Ya* ("already") signals that the train arrived sooner than expected, given the delay just announced.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: They board the train
    gloss: 'Mateo: Come on, everyone is getting on! Toledo, here we go!'
    note: '*Suben* ("they get on") comes from *subir*, to board; *¡Allá vamos!* is the natural way to say "here we go", where a word-for-word "here we come" would sound odd.'
