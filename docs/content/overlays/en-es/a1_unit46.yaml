teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Feeling unwell
    gloss: I don't feel well.
    note: '*Sentirse* is reflexive (*me siento*, *te sientes*); *no me siento bien* is the general, mild way to say something feels off.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Sick
    gloss: sick
    note: 'A basic adjective, used with *estar* (to be, for states): *estoy enfermo*.'
    example_gloss: I am sick.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Being sick
    gloss: I am sick.
    note: '*Enfermo* names a more general, stronger state than *no me siento bien*; it changes with the speaker''s gender (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Headache
    gloss: a headache
    note: 'Spanish uses *dolor de cabeza* with *tener* and no article: *tengo dolor de cabeza*.'
    example_gloss: I have a headache.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Having a headache
    gloss: I have a headache.
    note: 'Symptoms pair with *tener* (to have): *tengo dolor de cabeza*, like English "I have a headache".'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Stomach ache
    gloss: a stomach ache
    note: 'Same no-article pattern as *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: I have a stomach ache.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Having a stomach ache
    gloss: I have a stomach ache.
    note: Follows the same *tener* pattern as *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Asking generally
    gloss: What's wrong?
    note: A general, all-purpose way to ask if something is the matter.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: A common idiom
    gloss: What's the matter?
    note: '*¿Qué te pasa?* is the natural way to ask what is wrong (literally "what happens to you?"); do not translate it word for word.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Sore throat
    gloss: a sore throat
    note: 'Same pattern as *dolor de cabeza* and *dolor de estómago*: *dolor de garganta*.'
    example_gloss: I have a sore throat.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Having a sore throat
    gloss: I have a sore throat.
    note: Follows the same *tener* pattern as the other symptoms.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Checking in on someone
    gloss: Are you OK? No, I don't feel well.
    note: '*¿Estás bien?* is a very common, casual check-in question among friends; with someone you address as *usted* it becomes *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Fever
    gloss: a fever
    note: 'Used without an article after *tener*, like the other symptoms: *tengo fiebre*.'
    example_gloss: I have a fever.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Having a fever
    gloss: I have a fever.
    note: Follows the *tener* pattern.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Having a cold
    gloss: having a cold / to have a cold
    note: '*Resfriado* is an adjective used with *estar*; you can also say *tengo un resfriado* with the noun *resfriado*.'
    example_gloss: I have a cold.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Saying you have a cold
    gloss: I have a cold.
    note: Spanish can say *estoy resfriado* (adjective) where English says "I have a cold"; the adjective changes with the speaker's gender (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar vs. tener depends on the kind of word
    gloss: 'Enfermo and resfriado are adjectives and use estar: I am sick, I have a cold. Fiebre and dolor de cabeza are nouns and use tener: I have a fever, I have a headache.'
    note: 'The choice between *estar* and *tener* follows the kind of word: adjectives (*enfermo*, *resfriado*) take *estar*, symptom nouns (*fiebre*, *dolor de cabeza*) take *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: The pharmacy
    gloss: the pharmacy
    note: 'A feminine noun: *la farmacia*.'
    example_gloss: I'm going to the pharmacy.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: The pharmacist's greeting
    gloss: How can I help you?
    note: '*¿En qué puedo ayudarle?* is a standard formal service question; *ayudarle* uses the formal *usted* object pronoun *le*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Asking for something for a symptom
    gloss: Do you have something for a headache?
    note: '*Algo para* + symptom is the natural way to ask for a remedy: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: A tablet
    gloss: a tablet / pill
    note: 'A feminine noun: *la pastilla*; *una pastilla* is a pill or tablet.'
    example_gloss: I take a tablet.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Dosage instructions
    gloss: Take a tablet twice a day.
    note: '*Toma* is the informal imperative of *tomar* (to take), used for instructions.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Register at the pharmacy
    gloss: At the pharmacy, you use the polite form usted.
    note: 'The pharmacist is an unfamiliar adult in a service role, so you use *usted*: *¿Tiene algo...?* instead of *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Read a pharmacy advice note
    gloss: 'Advice: take a tablet twice a day with water. Rest well and drink plenty of water. Do you still not feel well after three days? Then go to the doctor.'
    note: Track the dosage, the two non-medicine recommendations, and when to see a doctor.
    glosses:
      Consejo: advice
      toma: take
      veces: times
      día: day
      pastilla: tablet
      Descansa: rest
      bebe: drink
      sentirte: feel
      sigues: still
      bien: well
      médico: doctor / GP
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena checks in
    gloss: 'Elena: Hi Mateo, how''s it going? Are you feeling better yet?'
    note: '*Ya* (already, by now) shows Elena is checking whether Mateo has improved since they last spoke; *te sientes* is the informal *tú* form of *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo is still unwell
    gloss: 'Mateo: Not so good yet. I still have a headache and I''m tired.'
    note: '*Sigo con* (I still have) shows the headache has not gone away; *cansado* (tired) is a new, useful adjective that changes with gender (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena asks about the medicine
    gloss: 'Elena: Did you take a tablet?'
    note: '*Has tomado* is the present perfect: *has* + the participle *tomado*, the same pattern as *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo confirms
    gloss: 'Mateo: Yes, I took a tablet. I''m going to rest now.'
    note: '*Voy a descansar* (I am going to rest) uses the near-future pattern *ir a* + infinitive.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena wishes him well
    gloss: 'Elena: Good idea. Rest well. Get well soon!'
    note: '*¡Que te mejores!* is the standard fixed expression for wishing someone a quick recovery; it uses the subjunctive *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo signs off
    gloss: 'Mateo: Thanks, see you tomorrow!'
    note: '*Hasta mañana* follows the *hasta* + time pattern of farewells like *hasta luego*.'
