teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Get up
    gloss: to get up → I get up
    note: '*Levantarse* is reflexive: the pronoun *me* goes before the verb, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Get dressed
    gloss: to get dressed → I get dressed
    note: '*Vestirse* is also reflexive: *Me visto*. Here *me* means "myself".'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Have breakfast
    gloss: to have breakfast → I have breakfast
    note: '*Desayunar* is not reflexive: *Desayuno*, with no *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Work
    gloss: to work → I work
    note: '*Trabajar* is a regular -ar verb: its *yo* form ends in -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Eat
    gloss: to eat → I eat
    note: '*Comer* is a regular -er verb: its *yo* form ends in -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Do the dishes
    gloss: to do the dishes → I do the dishes
    note: '*Lavar los platos* is not reflexive: *Lavo los platos*. The object *los platos* stays after the verb.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Sleep
    gloss: to sleep → I sleep
    note: '*Dormir* changes its stem vowel in the *yo* form: *duermo* (o becomes ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: The reflexive pattern
    gloss: 'With levantarse and vestirse, the pronoun goes before the verb: levantarse → Me levanto.'
    note: 'With reflexive verbs, put *me* before the conjugated verb: say *Me levanto*, not *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse in a sentence
    gloss: 'to get up: I get up at seven.'
    note: 'The time phrase comes after the verb: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse in a sentence
    gloss: 'to get dressed: I get dressed.'
    note: 'The pattern is *me* + *visto*: the pronoun stays right in front of the verb.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos in a sentence
    gloss: 'to do the dishes: I do the dishes after eating.'
    note: '*Después de comer* ("after eating") uses *de* plus an infinitive and can go at the end.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Verbs without me
    gloss: 'Without a pronoun: I have breakfast. I work. I sleep. These verbs are not reflexive.'
    note: '*Desayuno*, *trabajo* and *duermo* have no *me*: these verbs are not reflexive.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Get up at half past seven
    gloss: I get up at 7:30.
    note: 'Spanish says half past with *y media*: *las siete y media* is 07:30. Use *a las* before the time.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Get dressed at quarter to eight
    gloss: I get dressed at 7:45.
    note: '*Las ocho menos cuarto* counts back from the next hour: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Have breakfast at eight
    gloss: I have breakfast at eight o'clock.
    note: 'Use *a las* before the time: *a las ocho*. For one o''clock it is *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Work from nine to five
    gloss: I work from nine o'clock to five o'clock.
    note: '*De ... a ...* gives a start and an end time: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Eat at half past six
    gloss: I eat at 6:30 p.m.
    note: '*De la tarde* makes the evening explicit, so *las seis y media* is 18:30 here.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Sleep at eleven
    gloss: I sleep at eleven o'clock.
    note: 'Use *a las* before the time: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: First, then, after that
    gloss: first, then, after that
    note: '*Primero* marks the first activity, *luego* the next one and *después* what follows.'
    example_gloss:
    - First I get up.
    - Then I get dressed.
    - After that I have breakfast.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: A three-step morning
    gloss: First I get up. Then I get dressed. After that I have breakfast.
    note: 'Reflexive verbs keep *me* in front of the verb: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Sequence words
    gloss: 'Primero, luego and después put your actions in order; the verb does not change: Después desayuno.'
    note: 'Sequence words open the sentence and the verb form does not change: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: My day
    gloss: My day — I get up at 7:30. After that I get dressed, and at eight I have breakfast. I work from nine to five. At 6:30 p.m. I eat. After that I do the dishes. At eleven I sleep.
    note: Read for both the order of the activities and their times. Notice *me levanto* and *me visto* with *me*.
    glosses:
      Mi: my
      día: day
      levanto: get up (me levanto)
      media: half past (y media = half past)
      ocho: eight
      Después: after that
      visto: get dressed (me visto)
      las: 'the (before clock times: las ocho)'
      desayuno: have breakfast
      Trabajo: work
      nueve: nine
      cinco: five
      siete: seven
      tarde: in the evening
      como: eat
      lavo: wash up (lavo los platos)
      once: eleven
      duermo: sleep
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Asking about a day
    gloss: 'Elena: What does your day look like, Mateo?'
    note: '*¿Cómo es tu día?* is an informal way to ask someone to describe their day; *tu* is the informal "your".'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Mateo's morning
    gloss: 'Mateo: I get up at 7:30. After that I get dressed, and at eight I have breakfast.'
    note: Mateo links three morning activities with *después* and *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Mateo's workday
    gloss: 'Elena: When do you work? Mateo: I work from nine to five.'
    note: 'Elena and Mateo use informal *tú* forms with each other: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Mateo's evening
    gloss: 'Mateo: At 6:30 p.m. I eat. After that I do the dishes. At eleven I sleep.'
    note: '*Después* opens the sentence but the verb form stays the same: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Elena's morning
    gloss: 'Elena: I get up at six, but I don''t have breakfast until 6:30.'
    note: '*No ... hasta* means "not until". Elena contrasts her get-up time with her breakfast time.'
