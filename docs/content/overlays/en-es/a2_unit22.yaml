  es.a2.unit22.lesson04.teach.dialogue.line01: {title: "Ask staff", gloss: "Excuse me, my train is canceled. Is there another option to get to the center?", note: "Elena uses formal service register with station staff."}
  es.a2.unit22.lesson04.teach.dialogue.line02: {title: "Alternative", gloss: "Yes, you can take bus number twelve from the main exit.", note: "*Puede* keeps the employee's answer formal and polite."}
  es.a2.unit22.lesson04.teach.dialogue.line03: {title: "Ask duration", gloss: "Thank you. How long does the bus take?", note: "*¿Cuánto tarda...?* asks how long something takes."}
