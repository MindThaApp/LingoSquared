teaching:
  es.a2.unit22.lesson01.teach.el_retraso: {title: "The delay", gloss: "the delay", note: "*Retraso* is the noun; *llevar retraso* is a natural way to say transport is running late.", example_gloss: "There is a delay of twenty minutes."}
  es.a2.unit22.lesson01.teach.llevar_retraso: {title: "Say the train is late", gloss: "The train is twenty minutes late.", note: "Spanish often says a train *lleva retraso* (carries delay), not a word-for-word English structure."}
  es.a2.unit22.lesson02.teach.cancelado: {title: "Canceled", gloss: "canceled", note: "Use masculine *cancelado* with *el tren* and feminine *cancelada* with feminine nouns.", example_gloss: "The train is canceled."}
