course:
  title: Spanish C1
  description: >-
    Advanced Spanish discourse: structure an extended spoken or written
    contribution -- signpost its direction, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape.

units:
  es.c1.unit01.discurso_extenso:
    title: "Structuring an extended contribution"
    description: "Signpost a long contribution, develop linked points, bound a digression, return explicitly, and sustain cohesion through a synthesis."

lessons:
  es.c1.unit01.lesson01.anunciar_el_rumbo:
    title: "Preview the direction"
  es.c1.unit01.lesson02.desarrollar_los_puntos:
    title: "Develop the points"
  es.c1.unit01.lesson03.hacer_un_parentesis:
    title: "Make a controlled digression"
  es.c1.unit01.lesson04.volver_a_la_idea:
    title: "Return explicitly to the main line"
  es.c1.unit01.lesson05.sostener_la_cohesion:
    title: "Sustain reference and synthesize"
  es.c1.unit01.lesson06.la_intervencion_completa:
    title: "The complete contribution"

teaching:
  es.c1.unit01.lesson01.teach.para_empezar:
    title: "to begin with"
    gloss: "to begin with"
    note: "*Para empezar* opens the first stage and promises an organized route rather than merely adding another point."
  es.c1.unit01.lesson01.teach.primero_despues:
    title: "First I outline the problem; then I explain the benefits."
    gloss: "first ... then ..."
    note: "*Primero ... después ...* gives the listener a two-stage roadmap before the detail begins."
  es.c1.unit01.lesson01.teach.a_grandes_rasgos:
    title: "in broad outline"
    gloss: "in broad terms / in outline"
    note: "*A grandes rasgos* deliberately limits detail and tells the audience to listen for the overall shape."
  es.c1.unit01.lesson01.teach.rumbo:
    title: "A complete roadmap"
    gloss: "To begin, I outline the problem in broad terms; then I explain the benefits."
    note: "This sentence combines an opening boundary, a scope marker (*a grandes rasgos*), and a promised second stage (*después*)."
  es.c1.unit01.lesson02.teach.en_primer_lugar:
    title: "firstly"
    gloss: "firstly"
    note: "*En primer lugar* opens the first numbered point and keeps the development tied to the previewed route."
  es.c1.unit01.lesson02.teach.en_concreto:
    title: "specifically"
    gloss: "specifically"
    note: "*En concreto* specifies the exact content of a general point -- here, what the health benefit consists of."
    example_gloss: "Parks improve health; specifically, they encourage exercise."
  es.c1.unit01.lesson02.teach.es_decir:
    title: "that is to say"
    gloss: "that is to say / in other words"
    note: "*Es decir* restates a general point more precisely, much like 'that is to say'."
    example_gloss: "There is one main benefit, namely health."
  es.c1.unit01.lesson02.teach.ademas:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*Además* does more than mean 'also': it presents the next point as attached to the preceding one."
    example_gloss: "In addition, parks build community."
  es.c1.unit01.lesson02.teach.mejorar:
    title: "to improve"
    gloss: "to improve"
    note: "*Mejorar* = to improve. The parks *mejoran* (improve) the health of a neighbourhood."
    example_gloss: "Parks improve health."
  es.c1.unit01.lesson02.teach.la_salud:
    title: "health"
    gloss: "health"
    note: "*La salud* = health -- the first benefit the parks bring."
    example_gloss: "Exercise improves health."
  es.c1.unit01.lesson02.teach.fomentar:
    title: "to promote"
    gloss: "to promote / encourage"
    note: "*Fomentar* = to promote or encourage. Parks *fomentan* (encourage) exercise."
    example_gloss: "Parks encourage exercise."
  es.c1.unit01.lesson02.teach.crear_comunidad:
    title: "to build community"
    gloss: "to build a sense of community"
    note: "*Crear comunidad* means to build a sense of community -- the second, socially linked benefit."
  es.c1.unit01.lesson02.teach.desarrollo:
    title: "Developing a linked point"
    gloss: "Firstly, parks improve health; specifically, they encourage exercise. In addition, they build community, because the neighbours get to know each other."
    note: "The sequence moves from general claim (*mejoran la salud*) to specification (*en concreto, fomentan el ejercicio*) and then to a related consequence (*además, crean comunidad*)."
  es.c1.unit01.lesson03.teach.hacer_un_parentesis:
    title: "Now I will briefly digress."
    gloss: "now I will briefly make a digression"
    note: "*Hago un pequeño paréntesis* explicitly marks a temporary, bounded departure from the main line."
  es.c1.unit01.lesson03.teach.a_proposito:
    title: "As an aside, I want to mention one objection."
    gloss: "as an aside"
    note: "*A propósito* signals that the following objection is relevant but outside the main route."
  es.c1.unit01.lesson03.teach.preocupacion_comprensible:
    title: "Some people fear that upkeep will be expensive, an understandable concern."
    gloss: "an understandable concern"
    note: "Calling it *una preocupación comprensible* gives the digression genuine relevance instead of treating it as random detail."
  es.c1.unit01.lesson03.teach.grens:
    title: "Bounding the digression"
    gloss: "Now I will briefly digress. As an aside, I want to mention one objection: some people fear that upkeep will be expensive."
    note: "The two boundary markers (*hago un paréntesis*, *a propósito*) tell the audience exactly when the side path begins."
  es.c1.unit01.lesson04.teach.volviendo_a:
    title: "returning to my main idea"
    gloss: "returning to my central point"
    note: "*Volviendo a mi idea principal* names both the return and the precise line being resumed."
  es.c1.unit01.lesson04.teach.eso_no_significa_que:
    title: "That does not mean that we have to give up."
    gloss: "that does not mean that"
    note: "*Eso no significa que...* acknowledges the concern while keeping the main idea intact."
  es.c1.unit01.lesson04.teach.parque_bien_disenado:
    title: "The upkeep of a well-designed park does not cost that much."
    gloss: "a well-designed park"
    note: "*Un parque bien diseñado* is the concrete answer to the digression's worry: good design keeps costs down."
  es.c1.unit01.lesson04.teach.retorno:
    title: "An explicit return"
    gloss: "But returning to my main idea, the upkeep of a well-designed park does not cost that much."
    note: "*Pero* pivots, the return frame (*volviendo a mi idea principal*) restores the route, and the well-designed-park point reconnects the idea to the objection."
  es.c1.unit01.lesson05.teach.esta_propuesta:
    title: "This proposal creates a green area."
    gloss: "this proposal"
    note: "*Esta propuesta* packages the previously described policy into one reusable reference."
  es.c1.unit01.lesson05.teach.dicha_zona:
    title: "That area draws families in."
    gloss: "that area / the aforementioned area"
    note: "*Dicha zona* is a formal-but-natural cohesive device that retrieves the green area just mentioned and makes it the next sentence's topic."
  es.c1.unit01.lesson05.teach.en_definitiva:
    title: "in short / ultimately"
    gloss: "in short / ultimately"
    note: "*En definitiva* signals that the conclusion draws on all developed strands, not only the last sentence."
    example_gloss: "In short, the city improves."
  es.c1.unit01.lesson05.teach.sintesis:
    title: "A cohesive synthesis"
    gloss: "This proposal creates a green area. That area draws families in. In short, more green areas mean a healthier and more connected city."
    note: "Repeated concepts are recast as *esta propuesta*, *dicha zona*, and *en definitiva*, creating cohesion without mechanical repetition."
  es.c1.unit01.lesson06.teach.mateo_pregunta:
    title: "Mateo: Why do you propose more green areas?"
    gloss: "Mateo: Why do you propose more green areas?"
    note: "Mateo uses *tú* (*propones*) to ask Elena to justify her proposal -- the cue that triggers her extended contribution."
  es.c1.unit01.lesson06.teach.intervencion_completa:
    title: "The complete structured contribution"
    gloss: "A sustained contribution with roadmap, development, digression, explicit return, and synthesis."
    note: "Track the whole route: *para empezar* → *en primer lugar* / *además* → *hago un paréntesis* → *volviendo a* → *en definitiva*."

exercises:
  es.c1.unit01.lesson01.exercise01.recognize_para_empezar:
    instruction: "What discourse job does Para empezar perform?"
    correct_option: "It opens the first stage and previews the route."
    distractors: ["It closes the contribution.", "It introduces a contradiction.", "It hides the direction."]
    accepted_answers: [{value: "It opens the first stage and previews the route.", status: correct}]
    feedback: "Para empezar explicitly opens the first stage and promises an organized route."
  es.c1.unit01.lesson01.exercise02.recognize_rumbo:
    instruction: "What does this sentence give the audience before the detail?"
    correct_option: "A two-stage roadmap"
    distractors: ["An unrelated aside", "A final synthesis", "An ironic reversal"]
    accepted_answers: [{value: "A two-stage roadmap", status: correct}]
    feedback: "Primero ... después ... previews two stages."
  es.c1.unit01.lesson01.exercise03.match_rumbo:
    instruction: "Match each Spanish roadmap element to its English clue."
    accepted_answers:
      - value: {"Para empezar": "to begin with", "Primero": "first", "planteo el problema": "I set out the issue", "después": "moves to the following stage", "explico los beneficios": "I explain the positive effects", "a grandes rasgos": "in broad outline", "el problema": "the issue being examined", "los beneficios": "the positive effects"}
        status: correct
    feedback: "These elements announce scope and direction."
  es.c1.unit01.lesson01.exercise04.order_rumbo:
    instruction: "Put the Spanish words in order to open the roadmap."
    accepted_answers:
      - {value: "Para empezar planteo el problema", status: correct}
    feedback: "Para empezar occupies the first position."
  es.c1.unit01.lesson01.exercise05.translate_rasgos:
    instruction: "Translate into Spanish using a grandes rasgos: First I outline the problem in broad terms."
    accepted_answers:
      - {value: "Primero planteo a grandes rasgos el problema", status: correct}
      - {value: "Primero planteo el problema a grandes rasgos", status: correct}
    feedback: "A grandes rasgos marks deliberate overview rather than detail."
  es.c1.unit01.lesson01.exercise06.speak_rumbo:
    instruction: "Say aloud in Spanish: First I outline the problem; then I explain the benefits."
    accepted_answers:
      - {value: "Primero planteo el problema; después explico los beneficios.", status: correct}
      - {value: "Primero planteo el problema. Después explico los beneficios.", status: correct}
      - {value: "Primero planteo el problema y después explico los beneficios.", status: correct}
    feedback: "The exact roadmap uses Primero and después."
  es.c1.unit01.lesson01.exercise07.write_rumbo:
    instruction: "Write in Spanish, using para empezar, a grandes rasgos and después: To begin, I outline the problem in broad terms; then I explain the benefits."
    accepted_answers:
      - {value: "Para empezar, planteo a grandes rasgos el problema; después explico los beneficios.", status: correct}
      - {value: "Para empezar, planteo a grandes rasgos el problema. Después explico los beneficios.", status: correct}
      - {value: "Para empezar, planteo a grandes rasgos el problema y después explico los beneficios.", status: correct}
      - {value: "Para empezar, planteo el problema a grandes rasgos; después explico los beneficios.", status: correct}
      - {value: "Para empezar, planteo el problema a grandes rasgos. Después explico los beneficios.", status: correct}
    feedback: "All three named forms make the promised route explicit."

  es.c1.unit01.lesson02.exercise01.recognize_en_concreto:
    instruction: "What does en concreto do here?"
    correct_option: "It specifies the general point."
    distractors: ["It begins a digression.", "It withdraws the claim.", "It closes the argument."]
    accepted_answers: [{value: "It specifies the general point.", status: correct}]
    feedback: "En concreto introduces the precise content of a general claim."
  es.c1.unit01.lesson02.exercise02.recognize_ademas:
    instruction: "How does además connect this sentence to the preceding one?"
    correct_option: "It adds an associated, linked point."
    distractors: ["It denies the preceding claim.", "It marks an unrelated memory.", "It ends the topic."]
    accepted_answers: [{value: "It adds an associated, linked point.", status: correct}]
    feedback: "Además links the community point to the health point."
  es.c1.unit01.lesson02.exercise03.match_desarrollo:
    instruction: "Match each Spanish development element to its English clue."
    accepted_answers:
      - value: {"en primer lugar": "firstly", "en concreto": "specifically", "es decir": "that is to say", "además": "in addition", "mejorar": "to improve", "la salud": "health", "fomentar": "to promote / encourage", "crear comunidad": "to build community"}
        status: correct
    feedback: "These forms move, specify, and connect the developed points."
  es.c1.unit01.lesson02.exercise04.order_desarrollo:
    instruction: "Put the Spanish words in order to state the first developed point."
    accepted_answers:
      - {value: "En primer lugar los parques mejoran la salud", status: correct}
    feedback: "En primer lugar advances the route into the first point."
  es.c1.unit01.lesson02.exercise05.translate_salud:
    instruction: "Translate into Spanish: Parks improve health."
    accepted_answers:
      - {value: "Los parques mejoran la salud", status: correct}
    feedback: "Los parques mejoran la salud means parks improve health."
  es.c1.unit01.lesson02.exercise06.translate_es_decir:
    instruction: "Translate into Spanish using es decir: There is one main benefit, namely health."
    accepted_answers:
      - {value: "Hay un beneficio principal, es decir la salud", status: correct}
      - {value: "Hay un beneficio principal, es decir, la salud", status: correct}
      - {value: "Hay un beneficio principal es decir la salud", status: correct}
    feedback: "Es decir introduces the precise restatement."
  es.c1.unit01.lesson02.exercise07.write_dos_puntos:
    instruction: "Write these two sentences in Spanish, using en primer lugar and además: Firstly, parks improve health. In addition, they build community."
    accepted_answers:
      - {value: "En primer lugar, los parques mejoran la salud. Además, crean comunidad", status: correct}
      - {value: "En primer lugar, los parques mejoran la salud. Además, crean comunidad.", status: correct}
      - {value: "En primer lugar, los parques mejoran la salud. Además, los parques crean comunidad", status: correct}
      - {value: "En primer lugar, los parques mejoran la salud. Además, los parques crean comunidad.", status: correct}
    feedback: "Two signposted points: En primer lugar, los parques mejoran la salud. Además, crean comunidad."

  es.c1.unit01.lesson03.exercise01.recognize_parentesis:
    instruction: "What boundary does this sentence mark?"
    correct_option: "The start of a brief, bounded digression"
    distractors: ["The final conclusion", "The return to the main line", "The initial roadmap"]
    accepted_answers: [{value: "The start of a brief, bounded digression", status: correct}]
    feedback: "Hago un pequeño paréntesis marks a temporary, bounded departure."
  es.c1.unit01.lesson03.exercise02.recognize_a_proposito:
    instruction: "What status does A propósito give the objection?"
    correct_option: "Relevant but outside the main line"
    distractors: ["The central conclusion", "Established fact", "A promised second section"]
    accepted_answers: [{value: "Relevant but outside the main line", status: correct}]
    feedback: "A propósito frames the objection as an aside."
  es.c1.unit01.lesson03.exercise03.match_parentesis:
    instruction: "Match each Spanish digression element to its English clue."
    accepted_answers:
      - value: {"un pequeño paréntesis": "a temporary side path in the argument", "a propósito": "as an aside", "una objeción": "an objection", "algunos temen": "some people fear", "el mantenimiento": "upkeep / maintenance", "caro": "expensive", "una preocupación comprensible": "a concern that deserves recognition"}
        status: correct
    feedback: "The boundary language and objection vocabulary keep the side path controlled."
  es.c1.unit01.lesson03.exercise04.order_parentesis:
    instruction: "Put the Spanish words in order to mark the start of a digression."
    accepted_answers:
      - {value: "Hago un pequeño paréntesis", status: correct}
    feedback: "Hago un pequeño paréntesis announces the departure."
  es.c1.unit01.lesson03.exercise05.translate_preocupacion:
    instruction: "Translate into Spanish: Some people fear that upkeep will be expensive, an understandable concern."
    accepted_answers:
      - {value: "Algunos temen que el mantenimiento sea caro, una preocupación comprensible", status: correct}
    feedback: "The apposition una preocupación comprensible validates why this aside matters."
  es.c1.unit01.lesson03.exercise06.speak_parentesis:
    instruction: "Say aloud in Spanish: I will briefly digress."
    accepted_answers:
      - {value: "Hago un pequeño paréntesis", status: correct}
    feedback: "Hago un pequeño paréntesis explicitly limits the digression."
  es.c1.unit01.lesson03.exercise07.write_a_proposito:
    instruction: "Write in Spanish, starting with a propósito and introducing the objection with a colon: As an aside, I want to mention one objection: some people fear that upkeep will be expensive."
    accepted_answers:
      - {value: "A propósito, quiero mencionar una objeción: algunos temen que el mantenimiento sea caro.", status: correct}
      - {value: "A propósito, quiero mencionar una objeción. Algunos temen que el mantenimiento sea caro.", status: correct}
    feedback: "The aside is announced before its specific content."

  es.c1.unit01.lesson04.exercise01.recognize_volviendo:
    instruction: "What does this phrase signal?"
    correct_option: "An explicit return to the central line"
    distractors: ["A new unrelated theme", "A final farewell", "An uncertain inference"]
    accepted_answers: [{value: "An explicit return to the central line", status: correct}]
    feedback: "Volviendo a mi idea principal names the line being resumed."
  es.c1.unit01.lesson04.exercise02.recognize_no_significa:
    instruction: "What relationship does Eso no significa que express?"
    correct_option: "The prior concern does not cancel the main idea."
    distractors: ["The main idea is withdrawn.", "The concern is irrelevant.", "A new roadmap begins."]
    accepted_answers: [{value: "The prior concern does not cancel the main idea.", status: correct}]
    feedback: "The construction keeps the main idea after acknowledging the concern."
  es.c1.unit01.lesson04.exercise03.match_retorno:
    instruction: "Match each Spanish return element to its English clue."
    accepted_answers:
      - value: {"volviendo a": "returning to an earlier line", "mi idea principal": "my central claim", "Eso no significa que...": "the preceding point does not cancel what follows", "un parque": "a park", "bien diseñado": "well designed", "no cuesta tanto": "does not cost that much", "el mantenimiento de": "the upkeep of"}
        status: correct
    feedback: "These forms restore the central line and relate it to the aside."
  es.c1.unit01.lesson04.exercise04.order_retorno:
    instruction: "Put the Spanish words in order to signal return to the main idea."
    accepted_answers:
      - {value: "Volviendo a mi idea principal", status: correct}
    feedback: "The full resumptive frame names the central idea."
  es.c1.unit01.lesson04.exercise05.translate_parque:
    instruction: "Translate into Spanish: The upkeep of a well-designed park does not cost that much."
    accepted_answers:
      - {value: "El mantenimiento de un parque bien diseñado no cuesta tanto", status: correct}
      - {value: "El mantenimiento de un parque bien diseñado no cuesta tanto.", status: correct}
    feedback: "The required form keeps the main idea after the aside."
  es.c1.unit01.lesson04.exercise06.speak_retorno:
    instruction: "Say aloud in Spanish, including pero and volviendo a: But returning to my main idea, the upkeep of a well-designed park does not cost that much."
    accepted_answers:
      - {value: "Pero volviendo a mi idea principal, el mantenimiento de un parque bien diseñado no cuesta tanto.", status: correct}
      - {value: "Pero volviendo a mi idea principal, el mantenimiento de un parque bien diseñado no cuesta tanto", status: correct}
      - {value: "Pero, volviendo a mi idea principal, el mantenimiento de un parque bien diseñado no cuesta tanto.", status: correct}
      - {value: "Pero, volviendo a mi idea principal, el mantenimiento de un parque bien diseñado no cuesta tanto", status: correct}
    feedback: "The sentence pivots, resumes, and reconnects to the objection."
  es.c1.unit01.lesson04.exercise07.write_no_significa:
    instruction: "Write in Spanish, using eso no significa que: That does not mean that we have to give up."
    accepted_answers:
      - {value: "Eso no significa que tengamos que renunciar", status: correct}
    feedback: "The required form preserves the main idea."

  es.c1.unit01.lesson05.exercise01.recognize_dicha_zona:
    instruction: "What does Dicha zona refer back to?"
    correct_option: "The green area just mentioned"
    distractors: ["The upkeep cost", "The main proposal's title", "The final conclusion"]
    accepted_answers: [{value: "The green area just mentioned", status: correct}]
    feedback: "Dicha zona resumes the green area named in the previous sentence."
  es.c1.unit01.lesson05.exercise02.recognize_en_definitiva:
    instruction: "What discourse job does this sentence perform?"
    correct_option: "It draws all the strands together into a conclusion."
    distractors: ["It opens the contribution.", "It introduces a digression.", "It returns to the main line."]
    accepted_answers: [{value: "It draws all the strands together into a conclusion.", status: correct}]
    feedback: "En definitiva signals a synthesis of all the developed strands."
  es.c1.unit01.lesson05.exercise03.match_cohesion:
    instruction: "Match each Spanish cohesive element to its English function."
    accepted_answers:
      - value: {"Esta propuesta": "refers to the proposal just discussed", "Dicha zona": "resumes the area already mentioned", "atrae a las familias": "draws families in", "en definitiva": "signals a synthesis of all strands", "significan": "mean / amount to", "una ciudad más sana": "a healthier city", "más unida": "more closely connected"}
        status: correct
    feedback: "The references and synthesis marker sustain cohesion across sentences."
  es.c1.unit01.lesson05.exercise04.order_sintesis:
    instruction: "Put the Spanish words in order to synthesize the argument."
    accepted_answers:
      - {value: "En definitiva más zonas verdes significan una ciudad más sana", status: correct}
    feedback: "En definitiva gathers the preceding strands."
