  es.a2.unit100.lesson01.exercise06.traduce_hoy: {"instruction": "Translate into Spanish. Use *no puedo*.", "accepted_answers": [{"value": "No puedo venir hoy.", "status": "correct"}, {"value": "No puedo venir hoy", "status": "correct"}, {"value": "Hoy no puedo venir.", "status": "correct"}, {"value": "Hoy no puedo venir", "status": "correct"}, {"value": "Yo no puedo venir hoy.", "status": "correct"}, {"value": "Yo no puedo venir hoy", "status": "correct"}, {"value": "Yo hoy no puedo venir.", "status": "correct"}, {"value": "Yo hoy no puedo venir", "status": "correct"}, {"value": "Hoy yo no puedo venir.", "status": "correct"}, {"value": "Hoy yo no puedo venir", "status": "correct"}], "feedback": "*No puedo venir hoy* = I can't come today."}
  es.a2.unit100.lesson01.exercise07.escribe_martes: {"instruction": "Write the requested sentence with *poder*.", "correct_option": "Mateo puede venir el martes.", "accepted_answers": [{"value": "Mateo puede venir el martes.", "status": "correct"}, {"value": "Mateo puede venir el martes", "status": "correct"}, {"value": "El martes Mateo puede venir.", "status": "correct"}, {"value": "El martes Mateo puede venir", "status": "correct"}, {"value": "El martes puede venir Mateo.", "status": "correct"}, {"value": "El martes puede venir Mateo", "status": "correct"}, {"value": "Puede venir Mateo el martes.", "status": "correct"}, {"value": "Puede venir Mateo el martes", "status": "correct"}, {"value": "Mateo el martes puede venir.", "status": "correct"}, {"value": "Mateo el martes puede venir", "status": "correct"}], "feedback": "*Mateo puede venir el martes* = Mateo can come on Tuesday."}
  es.a2.unit100.lesson02.exercise01.elige_cocinar: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena sabe cocinar.", "distractors": ["Elena sé cocinar.", "Elena sabemos cocinar.", "Elena saben cocinar."], "accepted_answers": [{"value": "Elena sabe cocinar.", "status": "correct"}], "feedback": "*Elena* is third person, so the verb is *sabe*."}
  es.a2.unit100.lesson02.exercise02.elige_dolor: {"instruction": "Choose the Spanish sentence with the right meaning.", "correct_option": "Hoy no puedo nadar: tengo trabajo.", "distractors": ["Hoy no sé nadar: tengo trabajo.", "Hoy no pueden nadar: tengo trabajo.", "Hoy no puedes nadar: tengo trabajo."], "accepted_answers": [{"value": "Hoy no puedo nadar: tengo trabajo.", "status": "correct"}], "feedback": "Work stops you today, so use *puedo*. *Sé* is about learned skill."}
  es.a2.unit100.lesson02.exercise03.une_habilidades: {"instruction": "Match each Spanish phrase to its meaning.", "accepted_answers": [{"value": [{"left": "sé nadar", "right": "I know how to swim"}, {"left": "sabes tocar la guitarra", "right": "you know how to play the guitar"}, {"left": "ella sabe cocinar", "right": "she knows how to cook"}, {"left": "nosotros sabemos nadar", "right": "we know how to swim"}, {"left": "ellos saben esquiar", "right": "they know how to ski"}, {"left": "no sé esquiar", "right": "I don't know how to ski"}, {"left": "hoy no puedo nadar", "right": "I can't swim today"}], "status": "correct"}], "feedback": "*Saber* is for skills; *poder* is for today."}
  es.a2.unit100.lesson02.exercise04.ordena_guitarra: {"instruction": "Put the words in order to say 'Mateo knows how to play the guitar.'", "correct_option": "Mateo sabe tocar la guitarra", "accepted_answers": [{"value": "Mateo sabe tocar la guitarra", "status": "correct"}], "feedback": "*Sabe* comes before the infinitive *tocar*."}
  es.a2.unit100.lesson02.exercise05.completa_sabe: {"instruction": "Complete with the right form of *saber*.", "correct_option": "sabe", "accepted_answers": [{"value": "sabe", "status": "correct"}], "feedback": "*Muy bien* describes a learned skill, and *Elena* takes *sabe*."}
  es.a2.unit100.lesson02.exercise06.traduce_esquiar: {"instruction": "Translate into Spanish. Use *no sé*.", "accepted_answers": [{"value": "No sé esquiar.", "status": "correct"}, {"value": "No sé esquiar", "status": "correct"}, {"value": "Yo no sé esquiar.", "status": "correct"}, {"value": "Yo no sé esquiar", "status": "correct"}], "feedback": "*No sé esquiar* = I don't know how to ski."}
  es.a2.unit100.lesson02.exercise07.escribe_nadar: {"instruction": "Write the sentence. Use *sé* for the skill and *puedo* for today.", "correct_option": "Sé nadar, pero hoy no puedo.", "accepted_answers": [{"value": "Sé nadar, pero hoy no puedo.", "status": "correct"}, {"value": "Sé nadar, pero hoy no puedo", "status": "correct"}, {"value": "Sé nadar pero hoy no puedo.", "status": "correct"}, {"value": "Sé nadar pero hoy no puedo", "status": "correct"}, {"value": "Yo sé nadar, pero hoy no puedo.", "status": "correct"}, {"value": "Yo sé nadar, pero hoy no puedo", "status": "correct"}, {"value": "Sé nadar, pero hoy no puedo nadar.", "status": "correct"}, {"value": "Sé nadar, pero hoy no puedo nadar", "status": "correct"}, {"value": "Sé nadar pero hoy no puedo nadar.", "status": "correct"}, {"value": "Sé nadar pero hoy no puedo nadar", "status": "correct"}, {"value": "Yo sé nadar, pero hoy no puedo nadar.", "status": "correct"}, {"value": "Yo sé nadar, pero hoy no puedo nadar", "status": "correct"}, {"value": "Hoy no puedo, pero sé nadar.", "status": "correct"}, {"value": "Hoy no puedo, pero sé nadar", "status": "correct"}, {"value": "Hoy no puedo nadar, pero sé nadar.", "status": "correct"}, {"value": "Hoy no puedo nadar, pero sé nadar", "status": "correct"}], "feedback": "*Sé nadar, pero hoy no puedo.*"}
  es.a2.unit100.lesson03.exercise01.elige_viene: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "A lo mejor Mateo viene.", "distractors": ["A lo mejor Mateo vienen.", "A lo mejor Mateo vengo.", "A lo mejor Mateo venir."], "accepted_answers": [{"value": "A lo mejor Mateo viene.", "status": "correct"}], "feedback": "*Mateo* takes *viene* after *a lo mejor*."}
  es.a2.unit100.lesson03.exercise02.elige_no_puedo: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "A lo mejor no puedo ir.", "distractors": ["A lo mejor no puedes ir.", "A lo mejor no podemos ir.", "A lo mejor no pueden ir."], "accepted_answers": [{"value": "A lo mejor no puedo ir.", "status": "correct"}], "feedback": "The speaker is *yo*, so the verb is *puedo*."}
  es.a2.unit100.lesson03.exercise03.une_quizas: {"instruction": "Match each Spanish phrase to its meaning.", "accepted_answers": [{"value": [{"left": "a lo mejor", "right": "maybe"}, {"left": "puede ser", "right": "it could be"}, {"left": "no lo sé", "right": "I don't know"}, {"left": "a lo mejor viene", "right": "maybe he comes"}, {"left": "a lo mejor no puedo ir", "right": "maybe I can't go"}, {"left": "a lo mejor llueve", "right": "maybe it rains"}, {"left": "a lo mejor trabaja hoy", "right": "maybe he works today"}, {"left": "a lo mejor tengo tiempo", "right": "maybe I have time"}], "status": "correct"}], "feedback": "After *a lo mejor*, use a present-tense verb."}
  es.a2.unit100.lesson03.exercise04.ordena_perro: {"instruction": "Put the words in order to say 'Maybe Elena comes with the dog.'", "correct_option": "A lo mejor Elena viene con el perro", "accepted_answers": [{"value": "A lo mejor Elena viene con el perro", "status": "correct"}], "feedback": "*A lo mejor* comes first, then the subject and the verb."}
  es.a2.unit100.lesson03.exercise05.completa_ser: {"instruction": "Complete the short answer.", "correct_option": "ser", "accepted_answers": [{"value": "ser", "status": "correct"}], "feedback": "*Puede ser* = it could be."}
  es.a2.unit100.lesson03.exercise06.traduce_manana: {"instruction": "Translate into Spanish. Use *a lo mejor*.", "accepted_answers": [{"value": "A lo mejor Elena viene mañana.", "status": "correct"}, {"value": "A lo mejor Elena viene mañana", "status": "correct"}, {"value": "A lo mejor viene Elena mañana.", "status": "correct"}, {"value": "A lo mejor viene Elena mañana", "status": "correct"}, {"value": "A lo mejor mañana viene Elena.", "status": "correct"}, {"value": "A lo mejor mañana viene Elena", "status": "correct"}, {"value": "A lo mejor mañana Elena viene.", "status": "correct"}, {"value": "A lo mejor mañana Elena viene", "status": "correct"}, {"value": "Mañana a lo mejor Elena viene.", "status": "correct"}, {"value": "Mañana a lo mejor Elena viene", "status": "correct"}, {"value": "Elena a lo mejor viene mañana.", "status": "correct"}, {"value": "Elena a lo mejor viene mañana", "status": "correct"}], "feedback": "*A lo mejor Elena viene mañana* = Maybe Elena comes tomorrow."}
  es.a2.unit100.lesson03.exercise07.escribe_no_se: {"instruction": "Write exactly two sentences. Use *a lo mejor* and *no lo sé*.", "correct_option": "A lo mejor no puedo ir. No lo sé.", "accepted_answers": [{"value": "A lo mejor no puedo ir. No lo sé.", "status": "correct"}, {"value": "A lo mejor no puedo ir. No lo sé", "status": "correct"}, {"value": "A lo mejor no puedo ir, no lo sé.", "status": "correct"}, {"value": "A lo mejor no puedo ir, no lo sé", "status": "correct"}, {"value": "No lo sé. A lo mejor no puedo ir.", "status": "correct"}, {"value": "No lo sé. A lo mejor no puedo ir", "status": "correct"}], "feedback": "*A lo mejor no puedo ir. No lo sé.*"}
  es.a2.unit100.lesson04.exercise01.elige_libre: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Estoy libre el lunes por la tarde.", "distractors": ["Estoy libre el lunes por la mañana.", "Estoy ocupado el lunes por la tarde.", "Estoy libre el martes por la tarde."], "accepted_answers": [{"value": "Estoy libre el lunes por la tarde.", "status": "correct"}], "feedback": "*Libre* means free; *por la tarde* means in the afternoon."}
  es.a2.unit100.lesson04.exercise02.elige_ocupada: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena está ocupada esta semana.", "distractors": ["Elena está ocupado esta semana.", "Elena estoy ocupada esta semana.", "Elena está libre esta semana."], "accepted_answers": [{"value": "Elena está ocupada esta semana.", "status": "correct"}], "feedback": "*Elena* is a woman, so use *ocupada*."}
  es.a2.unit100.lesson04.exercise03.une_horarios: {"instruction": "Match each Spanish phrase to its meaning.", "accepted_answers": [{"value": [{"left": "el lunes por la tarde", "right": "Monday afternoon"}, {"left": "el martes por la mañana", "right": "Tuesday morning"}, {"left": "a las seis", "right": "at six"}, {"left": "esta semana", "right": "this week"}, {"left": "estoy libre", "right": "I am free"}, {"left": "estoy ocupado", "right": "I am busy"}, {"left": "tengo tiempo", "right": "I have time"}, {"left": "no tengo tiempo", "right": "I don't have time"}, {"left": "el viernes", "right": "on Friday"}], "status": "correct"}], "feedback": "Days and times answer the question *when?*"}
