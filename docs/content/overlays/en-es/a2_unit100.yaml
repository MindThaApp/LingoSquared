course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with grammar-led blocks on the past, ability and possibility."
  learning_goal: "Talk about the past, ability and possibility in Spanish with the right verb for each situation."
units:
  es.a2.unit100.puedo_o_se: {"title": "Can I, or Do I Know How?", "description": "Say what you can and cannot do and what might happen, and describe your availability, using poder, saber and a lo mejor."}
lessons:
  es.a2.unit100.lesson01.puedo_venir: {"title": "I Can Come"}
  es.a2.unit100.lesson02.se_nadar: {"title": "I Know How to Swim"}
  es.a2.unit100.lesson03.a_lo_mejor: {"title": "Maybe"}
  es.a2.unit100.lesson04.estoy_libre: {"title": "Are You Free?"}
  es.a2.unit100.lesson05.el_mensaje_de_mateo: {"title": "Mateo's Message"}
  es.a2.unit100.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit100.lesson01.teach.gn_poder: {"title": "Poder in the present", "gloss": "I can, you can, he can, she can, we can, they can", "note": "*Poder* means to be able to. The stem is *pued-* for *yo*, *tú*, *él*, *ella* and *ellos*, but *nosotros* keeps *pod-*. The subject pronoun is often dropped."}
  es.a2.unit100.lesson01.teach.gn_infinitivo: {"title": "Poder + infinitive", "gloss": "I can come. You can help. He can help. We can come. They can come.", "note": "After *poder*, the second verb stays in the infinitive: *venir*, *ayudar*. Use it to say whether you are able to do something now or soon."}
  es.a2.unit100.lesson01.teach.palabras: {"title": "Key words", "gloss": "to come / to help / today / tomorrow / on Monday / on Tuesday", "note": "Days of the week take *el* to mean 'on': *el martes* is on Tuesday. *Lunes* and *martes* do not change in the plural.", "example_gloss": ["Can you come on Tuesday?", "On Monday I can't.", "Mateo can help today.", "Tomorrow we can eat at home."]}
  es.a2.unit100.lesson01.teach.gn_no: {"title": "Saying you cannot", "gloss": "I can't. You can't. He can't. We can't. They can't.", "note": "Put *no* before *poder* to say you cannot. With *poder*, the situation decides: the time, the place, or other plans stop you."}
  es.a2.unit100.lesson01.teach.gn_pregunta: {"title": "Asking and answering", "gloss": "Can you come? Yes, I can. Can they come? No, they can't.", "note": "A short answer repeats the verb: *Sí, puedo.* or *No, no puedo.* The second *no* belongs to the verb."}
  es.a2.unit100.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Can you come on Tuesday? On Monday I can't. Mateo can help."}
  es.a2.unit100.lesson02.teach.gn_saber: {"title": "Saber in the present", "gloss": "I know, you know, he knows, she knows, we know, they know", "note": "*Saber* is irregular only in *yo*: *sé* (with an accent). The other forms follow the regular pattern."}
  es.a2.unit100.lesson02.teach.gn_saber_inf: {"title": "Saber + infinitive", "gloss": "I know how to swim. You know how to play the guitar. He knows how to cook. I don't know how to ski.", "note": "*Saber* + infinitive means you have learned how to do something. It talks about a skill, not about today."}
  es.a2.unit100.lesson02.teach.palabras: {"title": "Skills", "gloss": "to swim / to cook / to ski / to play the guitar", "note": "Use *tocar* for playing an instrument. *Muy bien* means very well.", "example_gloss": ["Elena cooks very well.", "Mateo knows how to play the guitar.", "I don't know how to ski, but I know how to swim.", "My grandparents know how to cook."]}
  es.a2.unit100.lesson02.teach.gn_contraste: {"title": "Skill or situation", "gloss": "I know how to swim. Today I can't swim: I have work.", "note": "*Sé nadar* = you learned how. *Hoy no puedo nadar* = you know how, but today something stops you. A skill stays; a situation changes."}
  es.a2.unit100.lesson02.teach.gn_sabes_o_puedes: {"title": "Two different questions", "gloss": "Do you know how to swim? Yes, I know how to swim. Can you swim today? No, I can't today.", "note": "Ask *¿Sabes...?* about a skill and *¿Puedes...?* about today. The answers can be different."}
  es.a2.unit100.lesson02.teach.frases: {"title": "Three sentences", "gloss": "I know how to swim. I don't know how to ski. Elena knows how to cook."}
  es.a2.unit100.lesson03.teach.gn_a_lo_mejor: {"title": "A lo mejor + present", "gloss": "Maybe Mateo comes. Maybe Elena arrives late.", "note": "*A lo mejor* means maybe. It is followed by a normal present-tense verb. *Mateo viene* says it is sure; *a lo mejor Mateo viene* says it is possible."}
  es.a2.unit100.lesson03.teach.gn_formas: {"title": "Every person", "gloss": "Maybe I come. Maybe you come. Maybe he comes. Maybe we come. Maybe they come.", "note": "*A lo mejor* works with every person. *Venir* has an irregular *yo* form, *vengo*, and a stem change in *vienes, viene, vienen*."}
  es.a2.unit100.lesson03.teach.palabras: {"title": "Maybe words", "gloss": "maybe / it could be / I don't know / to go / to arrive", "note": "*No lo sé* is the full way to say *I don't know*. Here *saber* does not take an infinitive.", "example_gloss": ["Maybe Elena comes with the dog.", "Maybe Mateo works today.", "Maybe it rains tomorrow.", "Maybe I have time on Thursday."]}
  es.a2.unit100.lesson03.teach.gn_no: {"title": "A lo mejor + no", "gloss": "Maybe I can't go. Maybe they aren't coming.", "note": "Put *no* after *a lo mejor*, before the verb, to say that something might not happen."}
  es.a2.unit100.lesson03.teach.gn_puede_ser: {"title": "Puede ser", "gloss": "Is Mateo coming? It could be. I don't know.", "note": "*Puede ser* is a short answer meaning it could be. It does not need a verb after it."}
  es.a2.unit100.lesson03.teach.frases: {"title": "Four short lines", "gloss": "Maybe Mateo comes. Maybe I can't go. It could be. I don't know."}
  es.a2.unit100.lesson04.teach.gn_libre: {"title": "Estar libre", "gloss": "I am free. You are free. He is free. We are free. They are free.", "note": "Use *estar* + *libre* to say you have no plans. *Libre* adds *-s* in the plural: *libres*."}
  es.a2.unit100.lesson04.teach.gn_ocupado: {"title": "Ocupado and ocupada", "gloss": "Mateo is busy. Elena is busy. We are busy.", "note": "*Ocupado* changes with the person: *ocupado* for a man, *ocupada* for a woman, *ocupados* for a group."}
  es.a2.unit100.lesson04.teach.palabras: {"title": "Times and days", "gloss": "on Monday afternoon / at six / this week / on Friday morning", "note": "*Por la tarde* is in the afternoon or evening, *por la mañana* is in the morning. *A las* + number gives the hour.", "example_gloss": ["I am free on Monday afternoon.", "We can eat at six.", "This week I am busy.", "On Friday morning I have time."]}
  es.a2.unit100.lesson04.teach.gn_tiempo: {"title": "Having time", "gloss": "I have time. I don't have time. I have time on Tuesday.", "note": "*Tengo tiempo* is another way to say you are available. *No tengo tiempo* means you cannot."}
  es.a2.unit100.lesson04.teach.gn_cuando: {"title": "Day and time first", "gloss": "On Monday afternoon I can't. On Tuesday at six I can.", "note": "Put the day or the time first, then say whether you can. This is the natural order for plans."}
  es.a2.unit100.lesson04.teach.frases: {"title": "Three sentences", "gloss": "Are you free on Monday afternoon? This week I am busy. I don't have time."}
  es.a2.unit100.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "to work / to have to / the office / on Thursday / on Friday", "note": "*Tener que* + infinitive means to have to. *Tengo que trabajar* = I have to work.", "example_gloss": ["Mateo works in the office.", "I have to work on Friday.", "Elena has to go home.", "On Thursday I can come at six."]}
  es.a2.unit100.lesson05.teach.gn_repaso: {"title": "Can't and maybe", "gloss": "On Monday I can't: I work in the office. Maybe I have to work on Friday.", "note": "In the message, *no puedo* gives something certain and *a lo mejor* gives something that might happen."}
  es.a2.unit100.lesson05.teach.lectura: {"title": "Mateo writes to Elena", "gloss": "Hi, Elena. This week I am busy. On Monday I can't: I work in the office. On Tuesday afternoon I am free. On Thursday I can come at six. Maybe I have to work on Friday. And you? Are you free on Tuesday?", "note": "Look for what Mateo is sure about (*no puedo*, *estoy libre*, *puedo venir*) and what is only possible (*a lo mejor*).", "glosses": {"ocupado": "busy", "trabajo": "I work", "oficina": "office", "libre": "free", "jueves": "Thursday", "viernes": "Friday", "tengo": "I have (tengo que: I have to)"}}
  es.a2.unit100.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. Can we go for a walk with the dog this week?"}
  es.a2.unit100.lesson06.teach.d2: {"title": "Mateo offers a day", "gloss": "Mateo: Yes, of course. On Monday I can't, but on Tuesday afternoon I am free."}
  es.a2.unit100.lesson06.teach.d3: {"title": "Elena suggests Thursday", "gloss": "Elena: On Tuesday I am busy. Can you come on Thursday at six?"}
  es.a2.unit100.lesson06.teach.d4: {"title": "Mateo says maybe", "gloss": "Mateo: On Thursday I can. Maybe I will arrive a little late."}
  es.a2.unit100.lesson06.teach.d5: {"title": "Elena agrees", "gloss": "Elena: OK, no problem. Thursday at six, then."}
  es.a2.unit100.lesson06.teach.d6: {"title": "Mateo says goodbye", "gloss": "Mateo: Perfect. See you Thursday, Elena!"}
exercises:
  es.a2.unit100.lesson01.exercise01.elige_podemos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Podemos venir mañana.", "distractors": ["Puedo venir mañana.", "Pueden venir mañana.", "Podemos venir hoy."], "accepted_answers": [{"value": "Podemos venir mañana.", "status": "correct"}], "feedback": "*Nosotros* takes *podemos*, and *mañana* means tomorrow."}
  es.a2.unit100.lesson01.exercise02.elige_puede: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo puede ayudar hoy.", "distractors": ["Mateo puedo ayudar hoy.", "Mateo podemos ayudar hoy.", "Mateo puedes ayudar hoy."], "accepted_answers": [{"value": "Mateo puede ayudar hoy.", "status": "correct"}], "feedback": "*Mateo* is a third-person subject, so the verb is *puede*."}
  es.a2.unit100.lesson01.exercise03.une_formas: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "yo puedo", "right": "I can"}, {"left": "tú puedes", "right": "you can"}, {"left": "ella puede", "right": "she can"}, {"left": "nosotros podemos", "right": "we can"}, {"left": "ellos pueden", "right": "they can"}, {"left": "no puedo", "right": "I can't"}, {"left": "venir", "right": "to come"}, {"left": "ayudar", "right": "to help"}], "status": "correct"}], "feedback": "Each subject has its own form of *poder*."}
