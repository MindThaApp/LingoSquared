exercises:
  es.b1.unit30.lesson01.exercise01.choose_responsible:
    instruction: "Which sentence means \"I am responsible for preparing the office reports\"?"
    correct_option: "Soy responsable de preparar los informes de la oficina."
    distractors: ["Mateo opina que debemos llamar a la oficina.", "Puedo confirmar que tengo una cita."]
    accepted_answers: ["Soy responsable de preparar los informes de la oficina."]
  es.b1.unit30.lesson01.exercise02.listen_responsible:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Soy responsable de preparar los informes de la oficina."
    distractors: ["El informe está listo para la cita.", "Mateo opina que debemos llamar."]
    accepted_answers: ["Soy responsable de preparar los informes de la oficina."]
  es.b1.unit30.lesson01.exercise03.match_responsibility:
    instruction: "Match each word or phrase to its meaning."
    correct_response:
      "Soy responsable de": "I am responsible for"
      "preparar": "to prepare"
      "los informes": "the reports"
      "la oficina": "the office"
      "preparar los informes": "preparing the reports"
      "Mateo": "the accountant"
  es.b1.unit30.lesson01.exercise04.order_responsible:
    instruction: "Build the sentence: I am responsible for preparing the office reports."
    correct_response: [Soy, responsable, de, preparar, los, informes, de, la, oficina]
  es.b1.unit30.lesson01.exercise05.translate_responsible:
    instruction: "Translate to Spanish in professional register: I am responsible for preparing the office reports."
    accepted_answers: ["Soy responsable de preparar los informes de la oficina.", "Soy responsable de preparar los informes de la oficina"]
