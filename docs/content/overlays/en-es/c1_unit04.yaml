      "no": not
      es: is
      una: a
      decisión: decision
      fácil: easy
      Es: is
      cierto: "true / certain"
      que: that
      implica: "implies / involves"
      dejar: "to leave"
      atrás: behind
      el: the
      trabajo: "work / job"
      y: and
      los: the
      amigos: friends
      Sin: without
      embargo: "however (sin embargo)"
      la: the
      experiencia: experience
      el: the
      idioma: language
      se: "itself / one"
      ganan: "are gained / earned"
      son: are
      difíciles: difficult
      de: "of / to"
      conseguir: "to obtain / achieve"
      otra: another
      manera: way
      Por: "on / by"
      un: a
      lado: "side / hand"
      está: is
      seguridad: "security / safety"
      quedarse: "to stay"
      por: "on / by"
      otro: other
      crecimiento: growth
      que: that
      solo: only
      da: gives
      salir: "to go out / leave"
      A: "to / at"
      fin: end
      cuentas: "accounts (a fin de cuentas)"
