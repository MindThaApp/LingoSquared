review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English glosses
    match idiomatic pan-Hispanic Spanish, that every matching_pairs right-hand
    clue discriminates its left on real meaning, and that the culminating
    writing/speaking answers (lesson06) accept the punctuation forms a correct
    learner would actually produce. See the realization file's review block
    for the full priority list.
  notes: >-
    Overlay for Spanish's fourth C1 unit, authored alongside the realization
    (no adaptable public-domain Spanish source was used; see the realization
    provenance note). English speakers' real interference risks for this
    outcome: (1) "es cierto que" / "no cabe duda de que" take the indicative,
    not the subjunctive -- glossed with the indicative; (2) "aunque" and "aun
    asi" both gloss near "although/even so", so their distinct roles
    (concession inside a clause vs concession-and-hold) are spelled out; (3)
    "compensar" maps to both "offset" and "outweigh" -- glossed to cover
    English speakers' single word; (4) the concessive "reconozco que" and
    "admito que" are kept distinct (recognize/acknowledge vs reluctant
    admission) to avoid interchangeable glosses. No sibling-direction file
    (es-en) was consulted.

course:
  title: Spanish C1
  description: >-
    Advanced Spanish argumentation: argue with subtlety -- genuinely concede
    a valid opposing point, qualify or rebut it, and weigh competing
    considerations rather than dismissing them.

units:
  es.c1.unit04.conceder_y_sopesar:
    title: "Conceding and weighing"
    description: "Concede a valid point, qualify or counter it, and weigh competing considerations to reach a judgement."

lessons:
  es.c1.unit04.lesson01.los_movimientos:
    title: "The moves of an argument"
  es.c1.unit04.lesson02.conceder:
    title: "Conceding"
  es.c1.unit04.lesson03.matizar_y_contraargumentar:
    title: "Qualifying and countering"
  es.c1.unit04.lesson04.sopesar:
    title: "Weighing"
  es.c1.unit04.lesson05.leer_un_argumento_matizado:
    title: "Reading a nuanced argument"
  es.c1.unit04.lesson06.argumentar_con_matices:
    title: "Arguing with nuance"

teaching:
  es.c1.unit04.lesson01.teach.el_argumento:
    title: "the argument"
    gloss: "the argument"
    note: "*El argumento* is a line of reasoning; a mature one concedes, qualifies, and weighs."
    example_gloss: "A mature argument weighs both stances."
  es.c1.unit04.lesson01.teach.conceder:
    title: "to concede"
    gloss: "to concede"
    note: "*Conceder* is to accept a valid point from the other side before responding."
    example_gloss: "To concede is to recognize that the other person is right."
  es.c1.unit04.lesson01.teach.matizar:
    title: "to qualify / nuance"
    gloss: "to qualify / nuance"
    note: "*Matizar* is to narrow the scope or soften the force of a claim."
    example_gloss: "To qualify is to delimit the scope of a statement."
  es.c1.unit04.lesson01.teach.el_contraargumento:
    title: "the counterargument"
    gloss: "the counterargument"
    note: "*El contraargumento* is the point raised against the other side, after conceding."
    example_gloss: "After the concession comes the counterargument."
  es.c1.unit04.lesson01.teach.sopesar:
    title: "to weigh"
    gloss: "to weigh"
    note: "*Sopesar* is to weigh the pros and cons before judging."
    example_gloss: "To weigh is to weigh the pros and cons."
  es.c1.unit04.lesson01.teach.el_matiz:
    title: "the nuance"
    gloss: "the nuance"
    note: "*El matiz* is a subtle distinction that changes the force of a claim."
    example_gloss: "A nuance changes the force of a statement."
  es.c1.unit04.lesson01.teach.movimientos_note:
    title: "The moves of an argument"
    gloss: "To concede, to qualify, and to weigh are the moves of a nuanced argument."
    note: "Three moves: *conceder*, *matizar*, *sopesar*."

  es.c1.unit04.lesson02.teach.es_cierto_que:
    title: "It's true that"
    gloss: "It's true that..."
    note: "*Es cierto que...* opens a genuine concession -- you admit the other side has a valid point."
  es.c1.unit04.lesson02.teach.reconozco_que:
    title: "I recognize that"
    gloss: "I recognize that..."
    note: "*Reconozco que...* concedes a point you accept as valid."
  es.c1.unit04.lesson02.teach.admito_que:
    title: "I admit that"
    gloss: "I admit that..."
    note: "*Admito que...* concedes, often reluctantly."
  es.c1.unit04.lesson02.teach.tienes_razon_en:
    title: "you're right that"
    gloss: "you're right that..."
    note: "*Tienes razón en que...* concedes the other's point directly."
  es.c1.unit04.lesson02.teach.no_cabe_duda:
    title: "there's no doubt that"
    gloss: "there's no doubt that..."
    note: "*No cabe duda de que...* concedes a point that is impossible to deny."
  es.c1.unit04.lesson02.teach.la_concesion:
    title: "the concession"
    gloss: "the concession"
    note: "*La concesión* is the move of granting a valid point; it is genuine, not a trick."
    example_gloss: "The concession is genuine: it recognizes the other's point before responding."
  es.c1.unit04.lesson02.teach.conceder_note:
    title: "What conceding is not"
    gloss: "To concede is to recognize a valid point from the other before responding -- it is not giving up."
    note: "Conceding strengthens an argument; it is not surrender."

  es.c1.unit04.lesson03.teach.sin_embargo:
    title: "however"
    gloss: "however"
    note: "*Sin embargo* introduces the counterargument after a concession."
    example_gloss: "I grant the point; however, it does not change my stance."
  es.c1.unit04.lesson03.teach.no_obstante:
    title: "nevertheless"
    gloss: "nevertheless"
    note: "*No obstante* is a formal synonym of *sin embargo*."
    example_gloss: "Nevertheless, the conclusion is different."
  es.c1.unit04.lesson03.teach.aunque:
    title: "although"
    gloss: "although"
    note: "*Aunque* concedes a point in a subordinate clause before the main claim."
    example_gloss: "Although you are right, the decision still stands."
  es.c1.unit04.lesson03.teach.aun_asi:
    title: "even so"
    gloss: "even so"
    note: "*Aun así* concedes the point but insists the conclusion holds."
    example_gloss: "Even so, the advantages weigh more."
  es.c1.unit04.lesson03.teach.la_objecion:
    title: "the objection"
    gloss: "the objection"
    note: "*La objeción* is the opposing point; *matizar* is to delimit its scope."
    example_gloss: "To qualify is to delimit the scope of an objection."
  es.c1.unit04.lesson03.teach.contraargumentar:
    title: "to counterargue"
    gloss: "to counterargue"
    note: "*Contraargumentar* is to argue against the conceded point."
    example_gloss: "After conceding, one qualifies or counterargues."
  es.c1.unit04.lesson03.teach.matizar_note:
    title: "Qualifying and countering"
    gloss: "However, nevertheless, although and even so qualify or counter the concession."
    note: "These connectives turn the concession toward your own conclusion."

  es.c1.unit04.lesson04.teach.por_un_lado:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Por un lado...* presents one side of the weighing."
  es.c1.unit04.lesson04.teach.por_otro_lado:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Por otro lado...* presents the competing consideration."
  es.c1.unit04.lesson04.teach.las_ventajas:
    title: "the advantages"
    gloss: "the advantages"
    note: "*Las ventajas* are the points in favour."
    example_gloss: "The advantages of leaving are real."
  es.c1.unit04.lesson04.teach.los_inconvenientes:
    title: "the drawbacks"
    gloss: "the drawbacks"
    note: "*Los inconvenientes* are the points against."
    example_gloss: "The drawbacks also count."
  es.c1.unit04.lesson04.teach.compensar:
    title: "to outweigh / offset"
    gloss: "to outweigh / offset"
    note: "*Compensar* means the advantages offset the drawbacks."
    example_gloss: "The advantages outweigh the drawbacks."
  es.c1.unit04.lesson04.teach.a_fin_de_cuentas:
    title: "at the end of the day"
    gloss: "at the end of the day"
    note: "*A fin de cuentas* introduces the final weighing."
  es.c1.unit04.lesson04.teach.sopesar_note:
    title: "Weighing"
    gloss: "To weigh is to compare the pros and cons and decide what weighs more."
    note: "Weighing is the last move: which side *pesa más*?"

  es.c1.unit04.lesson05.teach.el_texto:
    title: "A nuanced argument"
    gloss: "A year abroad is not an easy decision. It's true that it means leaving behind your job and your friends. However, the experience and the language you gain are hard to obtain any other way. On the one hand there is the security of staying; on the other, the growth that only leaving gives. At the end of the day, for whoever can afford it, the advantages outweigh the drawbacks."
