      inconvenientes: drawbacks
    note: "A complete nuanced argument: a genuine concession (*es cierto que*), a counter (*sin embargo*), a weighing (*por un lado / por otro lado*), and a final judgement (*a fin de cuentas*)."
  es.c1.unit04.lesson05.teach.la_decision:
    title: "the decision"
    gloss: "the decision"
    note: "*La decisión* is what the argument leads to."
    example_gloss: "Making such a decision is difficult."
  es.c1.unit04.lesson05.teach.el_razonamiento:
    title: "the reasoning"
    gloss: "the reasoning"
    note: "*El razonamiento* is the chain of moves: concede, qualify, weigh."
    example_gloss: "The reasoning concedes, qualifies and weighs."
  es.c1.unit04.lesson05.teach.el_peso:
    title: "the weight"
    gloss: "the weight"
    note: "*El peso* is the relative force of each side; one side ends with more."
    example_gloss: "In the end, one side has more weight."
  es.c1.unit04.lesson05.teach.leer_note:
    title: "Reading a nuanced argument"
    gloss: "A nuanced argument concedes a point, qualifies it, counters it, and weighs both sides."
    note: "Map the moves as you read: concession, qualification, counter, weighing."

  es.c1.unit04.lesson06.teach.mateo_concede:
    title: "Mateo: It's true that a year in Valencia would give you a lot."
    gloss: "Mateo: It's true that a year in Valencia would give you a lot."
    note: "Mateo's genuine concession: *es cierto que* + conditional *daría*."
  es.c1.unit04.lesson06.teach.elena_coste:
    title: "Elena: Yes, but leaving London also has a cost: I lose my students."
    gloss: "Elena: Yes, but leaving London also has a cost: I lose my students."
    note: "Elena concedes then counters with *pero* and the concrete cost."
  es.c1.unit04.lesson06.teach.mateo_califica:
    title: "Mateo: I recognize you're right, although a year is not forever."
    gloss: "Mateo: I recognize you're right, although a year is not forever."
    note: "Mateo concedes (*reconozco que*) then qualifies with *aunque*."
  es.c1.unit04.lesson06.teach.elena_sopesa:
    title: "Elena: At the end of the day, the advantages outweigh the drawbacks."
    gloss: "Elena: At the end of the day, the advantages outweigh the drawbacks."
    note: "Elena's weighing: *a fin de cuentas* + *compensan*."
  es.c1.unit04.lesson06.teach.elena_beneficio:
    title: "Elena: A year in Valencia would give me daily contact with Spanish."
    gloss: "Elena: A year in Valencia would give me daily contact with Spanish."
    note: "Elena's counter: the benefit of *contacto diario* with *el español*."
  es.c1.unit04.lesson06.teach.modelo_argumento:
    title: "A model argument"
    gloss: "It's true that leaving London has a cost: I lose my students. However, a year in Valencia would give me daily contact with Spanish. At the end of the day, the advantages outweigh the drawbacks."
    note: "Concession, then counter, then weighing -- in that order."

exercises:
  es.c1.unit04.lesson01.exercise01.recognize_argumento:
    instruction: "What does el argumento mean?"
    correct_option: "A line of reasoning presented for or against something."
    distractors: ["A single word with no context.", "A greeting between friends.", "A grammatical error."]
    accepted_answers: [{value: "A line of reasoning presented for or against something.", status: correct}]
    feedback: "*El argumento* is a line of reasoning."
  es.c1.unit04.lesson01.exercise02.recognize_conceder:
    instruction: "What does conceder mean?"
    correct_option: "To accept a valid point from the other side."
    distractors: ["To insist on your own point.", "To end the conversation.", "To change the subject."]
    accepted_answers: [{value: "To accept a valid point from the other side.", status: correct}]
    feedback: "*Conceder* is to accept the other's valid point."
  es.c1.unit04.lesson01.exercise03.match_movimientos:
    instruction: "Match each Spanish argumentation word to its English meaning."
    accepted_answers:
      - value: {"el argumento": "the argument", "conceder": "to concede", "matizar": "to qualify / nuance", "el contraargumento": "the counterargument", "sopesar": "to weigh", "el matiz": "the nuance"}
        status: correct
    feedback: "The building blocks of a nuanced argument."
  es.c1.unit04.lesson01.exercise04.order_sopesar:
    instruction: "Put the Spanish words in order to say weigh the pros and cons."
    accepted_answers:
      - {value: "Sopesar los pros y los contras", status: correct}
    feedback: "*Sopesar* is to weigh the pros and cons."
  es.c1.unit04.lesson01.exercise05.translate_argumento:
    instruction: "Translate into Spanish: A mature argument weighs both stances."
    accepted_answers:
      - {value: "Un argumento maduro sopesa las dos posturas", status: correct}
    feedback: "*Sopesa* is the weigh-move; *las dos posturas* are both stances."
  es.c1.unit04.lesson01.exercise06.speak_conceder:
    instruction: "Say aloud in Spanish: To concede is to recognize that the other person is right."
    accepted_answers:
      - {value: "Conceder es reconocer que el otro tiene razón", status: correct}
    feedback: "*Conceder* means granting a valid point."

  es.c1.unit04.lesson02.exercise01.recognize_es_cierto:
    instruction: "What does Es cierto que do?"
    correct_option: "It opens a genuine concession."
    distractors: ["It makes a demand.", "It closes the argument.", "It insults the other side."]
    accepted_answers: [{value: "It opens a genuine concession.", status: correct}]
    feedback: "*Es cierto que...* opens a concession."
  es.c1.unit04.lesson02.exercise02.recognize_reconozco:
    instruction: "What does Reconozco que signal?"
    correct_option: "That you are conceding a valid point."
    distractors: ["That you are refusing to listen.", "That you are asking a question.", "That you are making a joke."]
    accepted_answers: [{value: "That you are conceding a valid point.", status: correct}]
    feedback: "*Reconozco que...* concedes a point."
  es.c1.unit04.lesson02.exercise03.match_conceder:
    instruction: "Match each concession phrase to its English meaning."
    accepted_answers:
      - value: {"es cierto que": "it's true that", "reconozco que": "I recognize / acknowledge that", "admito que": "I admit that (reluctantly)", "tienes razón en que": "you're right that", "no cabe duda de que": "there's no doubt that", "la concesión": "the concession"}
        status: correct
    feedback: "These phrases concede a valid point."
  es.c1.unit04.lesson02.exercise04.order_es_cierto:
    instruction: "Put the Spanish words in order to concede that the other person is right."
    accepted_answers:
      - {value: "Es cierto que el otro tiene razón", status: correct}
    feedback: "*Es cierto que* concedes before you respond."
  es.c1.unit04.lesson02.exercise05.translate_reconozco:
    instruction: "Translate into Spanish: I recognize that the other person is right."
    accepted_answers:
      - {value: "Reconozco que el otro tiene razón", status: correct}
    feedback: "*Reconozco que* concedes the point."
  es.c1.unit04.lesson02.exercise06.speak_no_cabe_duda:
    instruction: "Say aloud in Spanish: There is no doubt that you have a valid point."
    accepted_answers:
      - {value: "No cabe duda de que tiene un punto válido", status: correct}
    feedback: "*No cabe duda de que* concedes an undeniable point."

  es.c1.unit04.lesson03.exercise01.recognize_sin_embargo:
    instruction: "What does sin embargo signal?"
    correct_option: "The counterargument that follows the concession."
    distractors: ["The concession itself.", "A greeting.", "The end of the discussion."]
    accepted_answers: [{value: "The counterargument that follows the concession.", status: correct}]
    feedback: "*Sin embargo* marks the counterargument."
  es.c1.unit04.lesson03.exercise02.recognize_aunque:
    instruction: "What does aunque do in an argument?"
    correct_option: "It concedes a point while holding to the main claim."
    distractors: ["It demands silence.", "It asks a question.", "It concludes the matter."]
    accepted_answers: [{value: "It concedes a point while holding to the main claim.", status: correct}]
    feedback: "*Aunque* concedes in a subordinate clause."
  es.c1.unit04.lesson03.exercise03.match_contraargumentar:
    instruction: "Match each counter-argument word to its English meaning."
    accepted_answers:
      - value: {"sin embargo": "however", "no obstante": "nevertheless", "aunque": "although", "aun así": "even so", "la objeción": "the objection", "contraargumentar": "to counterargue"}
        status: correct
    feedback: "These words qualify or counter the concession."
  es.c1.unit04.lesson03.exercise04.order_sin_embargo:
    instruction: "Put the Spanish words in order: However, it does not change my stance."
    accepted_answers:
      - {value: "Sin embargo no cambia mi postura", status: correct}
    feedback: "*Sin embargo* pivots to your own stance."
  es.c1.unit04.lesson03.exercise05.translate_aun_asi:
    instruction: "Translate into Spanish: Even so, the advantages weigh more."
    accepted_answers:
      - {value: "Aun así, las ventajas pesan más", status: correct}
    feedback: "*Aun así* concedes but holds the conclusion."
  es.c1.unit04.lesson03.exercise06.speak_aunque:
    instruction: "Say aloud in Spanish: Although you are right, the decision stands."
    accepted_answers:
      - {value: "Aunque tienes razón, la decisión sigue en pie", status: correct}
    feedback: "*Aunque* concedes before the main clause."

  es.c1.unit04.lesson04.exercise01.recognize_por_un_lado:
    instruction: "What does por un lado introduce?"
    correct_option: "One side of a weighing."
    distractors: ["A firm conclusion.", "An apology.", "A greeting."]
    accepted_answers: [{value: "One side of a weighing.", status: correct}]
    feedback: "*Por un lado* presents one side."
  es.c1.unit04.lesson04.exercise02.recognize_a_fin_de_cuentas:
    instruction: "What does a fin de cuentas introduce?"
    correct_option: "The final weighing."
    distractors: ["The opening concession.", "A question.", "An insult."]
    accepted_answers: [{value: "The final weighing.", status: correct}]
    feedback: "*A fin de cuentas* introduces the final weighing."
  es.c1.unit04.lesson04.exercise03.match_sopesar:
    instruction: "Match each weighing phrase to its English meaning."
    accepted_answers:
      - value: {"por un lado": "on the one hand", "por otro lado": "on the other hand", "las ventajas": "the advantages", "los inconvenientes": "the drawbacks", "compensar": "to outweigh / offset", "a fin de cuentas": "at the end of the day"}
        status: correct
    feedback: "These phrases weigh competing considerations."
  es.c1.unit04.lesson04.exercise04.order_compensar:
    instruction: "Put the Spanish words in order: The advantages outweigh the drawbacks."
    accepted_answers:
      - {value: "Las ventajas compensan los inconvenientes", status: correct}
    feedback: "*Compensan* means the advantages offset the drawbacks."
  es.c1.unit04.lesson04.exercise05.translate_a_fin_de_cuentas:
    instruction: "Translate into Spanish: At the end of the day, the advantages outweigh the drawbacks."
    accepted_answers:
      - {value: "A fin de cuentas, las ventajas compensan los inconvenientes", status: correct}
    feedback: "*A fin de cuentas* closes the weighing."
  es.c1.unit04.lesson04.exercise06.speak_compensar:
    instruction: "Say aloud in Spanish: The advantages outweigh the drawbacks."
    accepted_answers:
      - {value: "Las ventajas compensan los inconvenientes", status: correct}
    feedback: "*Compensan* is the weighing outcome."

  es.c1.unit04.lesson05.exercise01.read_concesion:
    instruction: "Which argumentative move does the text make with Es cierto que?"
    correct_option: "It concedes the real cost of leaving."
    distractors: ["It makes a demand.", "It closes the argument.", "It insults the reader."]
    accepted_answers: [{value: "It concedes the real cost of leaving.", status: correct}]
    feedback: "The text concedes with *es cierto que*."
  es.c1.unit04.lesson05.exercise02.read_contraargumento:
    instruction: "What does Sin embargo signal in the text?"
    correct_option: "The counterargument that follows the concession."
    distractors: ["The concession itself.", "A greeting.", "The final weighing."]
    accepted_answers: [{value: "The counterargument that follows the concession.", status: correct}]
    feedback: "*Sin embargo* pivots to the counter."
  es.c1.unit04.lesson05.exercise03.read_sopesar:
    instruction: "Which move do Por un lado ... por otro lado introduce?"
    correct_option: "The weighing of competing considerations."
    distractors: ["A concession.", "An apology.", "A firm demand."]
    accepted_answers: [{value: "The weighing of competing considerations.", status: correct}]
    feedback: "These frame the weighing."
  es.c1.unit04.lesson05.exercise04.read_conclusion:
    instruction: "What does A fin de cuentas introduce at the end?"
    correct_option: "The final judgement after weighing."
    distractors: ["A new objection.", "A question.", "A greeting."]
    accepted_answers: [{value: "The final judgement after weighing.", status: correct}]
    feedback: "*A fin de cuentas* closes the weighing."
  es.c1.unit04.lesson05.exercise05.match_argumento:
    instruction: "Match each argument word to its English meaning."
    accepted_answers:
      - value: {"la decisión": "the decision", "el razonamiento": "the reasoning", "el peso": "the weight", "sopesar": "to weigh", "el argumento": "the argument", "la postura": "the stance"}
        status: correct
    feedback: "These words name the argument's parts."
  es.c1.unit04.lesson05.exercise06.translate_razonamiento:
    instruction: "Translate into Spanish: The reasoning concedes, qualifies, and weighs."
    accepted_answers:
      - {value: "El razonamiento concede, matiza y sopesa", status: correct}
    feedback: "*El razonamiento* is the chain of moves."

  es.c1.unit04.lesson06.exercise01.listen_concede:
    instruction: "Listen to the exchange. Which argumentative move does Mateo make in his first line?"
    correct_option: "He concedes that the plan has real value."
