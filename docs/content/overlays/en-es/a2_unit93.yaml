answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit93.una_manana_ocupada: {"title": "A Busy Morning", "description": "Describe step by step how your morning went, from getting up to arriving, with the present perfect and reflexive verbs."}
lessons:
  es.a2.unit93.lesson01.he_desayunado: {"title": "I Have Had Breakfast"}
  es.a2.unit93.lesson02.me_he_levantado: {"title": "I Got Up"}
  es.a2.unit93.lesson03.hoy_o_ayer: {"title": "Today or Yesterday"}
  es.a2.unit93.lesson04.participios_irregulares: {"title": "Irregular Participles"}
  es.a2.unit93.lesson05.el_mensaje_de_mateo: {"title": "Mateo's Message"}
  es.a2.unit93.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit93.lesson01.teach.rutina: {"title": "Morning routine", "gloss": "to get up / to have a shower / to get dressed / to have breakfast / to leave / to arrive", "note": "These infinitives name the steps of a morning. Verbs ending in -se are reflexive.", "example_gloss": ["This morning I got up at six.", "Mateo has had a shower.", "I have had breakfast at home.", "We left at seven."]}
  es.a2.unit93.lesson01.teach.tiempo: {"title": "Time words", "gloss": "this morning / today / at six o'clock / first / then / afterwards / at last", "note": "These words put the steps of the morning in order.", "example_gloss": ["First I had a shower.", "Then I had breakfast.", "Afterwards I left the house.", "At last I have arrived."]}
  es.a2.unit93.lesson01.teach.gn_haber: {"title": "Haber: present tense", "gloss": "I have, you have, he has, she has, we have, they have", "note": "The pretérito perfecto is built with the present tense of *haber* plus a participle. This *haber* is only a helper; it is not the *tener* of possession."}
  es.a2.unit93.lesson01.teach.gn_participio: {"title": "The participle: -ado and -ido", "gloss": "to have breakfast, had breakfast. to arrive, arrived. to leave, left. to eat, eaten", "note": "Verbs in -ar form the participle with -ado; verbs in -er and -ir use -ido. The participle after *haber* never changes for gender or number."}
  es.a2.unit93.lesson01.teach.frases: {"title": "Three sentences", "gloss": "I have had breakfast at home. We left at seven. She has arrived late."}
  es.a2.unit93.lesson02.teach.mas_verbos: {"title": "More morning verbs", "gloss": "to wake up / to brush one's teeth / to comb one's hair / to go to bed / early / late", "note": "More reflexive verbs for a morning. *Temprano* is early, *tarde* is late.", "example_gloss": ["I woke up early.", "You have brushed your teeth.", "Elena has combed her hair.", "We went to bed late."]}
  es.a2.unit93.lesson02.teach.gn_pronombres: {"title": "Reflexive pronouns with haber", "gloss": "I got up, you got up, he/she got up, we got up, they got up", "note": "The reflexive pronoun (*me, te, se, nos, se*) comes before *haber* and never between *haber* and the participle."}
  es.a2.unit93.lesson02.teach.gn_negacion: {"title": "Negative sentences", "gloss": "I have not had a shower. Mateo has not combed his hair. We have not got dressed yet.", "note": "*No* goes before the pronoun: *no me he duchado*. *Todavía no* means 'not yet'."}
  es.a2.unit93.lesson02.teach.fr_pregunta: {"title": "Questions", "gloss": "Did you get up early? What time did you wake up?", "note": "In a question the order stays the same: pronoun, *haber*, participle."}
  es.a2.unit93.lesson03.teach.contraste: {"title": "Contrast words", "gloss": "usually / always / yesterday / already / still, yet", "note": "*Normalmente* and *siempre* go with the present tense; *ayer* goes with a finished day.", "example_gloss": ["I usually get up at seven.", "I always have breakfast at home.", "Yesterday I got up late.", "I have already had breakfast."]}
  es.a2.unit93.lesson03.teach.gn_presente: {"title": "Present for habits, perfecto for this morning", "gloss": "I usually get up at seven. Today I got up at six.", "note": "Use the present tense for what you usually do. Use the pretérito perfecto for something that happened today, in a period that is not over yet."}
  es.a2.unit93.lesson03.teach.gn_ayer: {"title": "Yesterday uses another past", "gloss": "Today I got up early. Yesterday I got up late.", "note": "With *hoy* and *esta mañana* use *he levantado*. With *ayer* the day is over, so Spanish uses the preterite: *me levanté*. This tense is covered in the weekend unit."}
  es.a2.unit93.lesson03.teach.gn_ya: {"title": "Ya and todavía no", "gloss": "I have already had a shower. I have not had breakfast yet.", "note": "*Ya* means 'already'; *todavía no* means 'not yet'. Both are very common with the pretérito perfecto."}
  es.a2.unit93.lesson04.teach.irregulares: {"title": "Irregular participles", "gloss": "to do, make / to see / to put / to say / to write / to come back / to open / to go", "note": "These verbs have an irregular participle; you have to learn them one by one.", "example_gloss": ["I have made coffee.", "Have you seen my keys?", "Mateo has opened the window.", "We have come back home."]}
  es.a2.unit93.lesson04.teach.gn_irregulares: {"title": "Eight irregular participles", "gloss": "to do, done. to see, seen. to put, put. to say, said. to write, written. to come back, come back. to open, opened. to go, gone", "note": "These participles do not end in -ado or -ido. They work with *haber* exactly like the regular ones: *he hecho*, *has visto*, *ha ido*."}
  es.a2.unit93.lesson04.teach.objetos: {"title": "Things in the morning", "gloss": "coffee / window / keys / email, mail / bike / office", "note": "*Ir en bici* means to go by bike.", "example_gloss": ["Mateo has gone to the office by bike.", "I have written an email.", "She has put the coffee on the table."]}
  es.a2.unit93.lesson04.teach.gn_secuencia: {"title": "Telling the steps in order", "gloss": "First I had a shower, then I had breakfast and afterwards I left the house.", "note": "Link the steps with *primero*, *luego*, *después* and *y*. Each step keeps its own *haber*."}
  es.a2.unit93.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "busy / quickly / what a... / how", "note": "*Ocupada* is feminine because *mañana* is feminine. *Qué* in an exclamation means 'what a'.", "example_gloss": ["What a busy morning!", "I have eaten quickly.", "How has your morning been?", "It has been very busy."]}
  es.a2.unit93.lesson05.teach.gn_sido: {"title": "How was your morning?", "gloss": "How has your morning been? It has been very busy.", "note": "*Sido* is the participle of *ser*. It is irregular and is worth learning as a set phrase."}
  es.a2.unit93.lesson05.teach.fr_preguntas: {"title": "Useful questions", "gloss": "What have you done? What time did you arrive? How did you come?", "note": "Question words come first and the rest of the sentence keeps the same order: *haber* plus participle."}
  es.a2.unit93.lesson05.teach.lectura: {"title": "Mateo writes to Elena", "gloss": "Hi Elena. What a busy morning! I got up late and I haven't had breakfast. I had a quick shower and got dressed. I went to the office by bike and arrived at nine. I haven't opened my email yet, but I have already made coffee. And you? How has your morning been?", "note": "Notice how Mateo tells the steps in order and uses *ya* and *todavía no*.", "glosses": {"ocupada": "busy", "rápido": "quickly", "correo": "email", "todavía": "yet, still"}}
  es.a2.unit93.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. How has your morning been?"}
  es.a2.unit93.lesson06.teach.d2: {"title": "Mateo answers", "gloss": "Mateo: Very busy. I got up late and I haven't had breakfast."}
  es.a2.unit93.lesson06.teach.d3: {"title": "Elena asks about the trip", "gloss": "Elena: How did you get to the office?"}
  es.a2.unit93.lesson06.teach.d4: {"title": "Mateo describes the trip", "gloss": "Mateo: I went by bike and I arrived at nine."}
  es.a2.unit93.lesson06.teach.d5: {"title": "Elena asks about coffee", "gloss": "Elena: Have you made coffee already?"}
  es.a2.unit93.lesson06.teach.d6: {"title": "Mateo offers", "gloss": "Mateo: Yes, I have already made coffee. Do you want a coffee?"}
exercises:
  es.a2.unit93.lesson01.exercise01.elige_desayuno: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Esta mañana he desayunado en casa.", "distractors": ["Esta mañana he desayunar en casa.", "Esta mañana ha desayunado en casa.", "Esta mañana he desayunando en casa."], "accepted_answers": [{"value": "Esta mañana he desayunado en casa.", "status": "correct"}], "feedback": "With *yo* the helper is *he*, and the participle of *desayunar* is *desayunado*."}
  es.a2.unit93.lesson01.exercise02.elige_salido: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Hemos salido a las siete.", "distractors": ["Hemos salidado a las siete.", "Han salido a las siete.", "Hemos salir a las siete."], "accepted_answers": [{"value": "Hemos salido a las siete.", "status": "correct"}], "feedback": "*Hemos* goes with *nosotros*, and *salir* gives *salido* (-ir verbs take -ido)."}
  es.a2.unit93.lesson01.exercise03.une_pasos: {"instruction": "Match each Spanish word to its meaning.", "accepted_answers": [{"value": [{"left": "levantarse", "right": "to get up"}, {"left": "ducharse", "right": "to have a shower"}, {"left": "vestirse", "right": "to get dressed"}, {"left": "desayunar", "right": "to have breakfast"}, {"left": "salir", "right": "to leave"}, {"left": "llegar", "right": "to arrive"}, {"left": "primero", "right": "first"}, {"left": "por fin", "right": "at last"}], "status": "correct"}], "feedback": "These are the steps of a morning."}
  es.a2.unit93.lesson01.exercise04.ordena_llegado: {"instruction": "Put the words in order to say 'She has arrived late.'", "correct_option": "Ella ha llegado tarde", "accepted_answers": [{"value": "Ella ha llegado tarde", "status": "correct"}], "feedback": "*Ella ha llegado tarde*: the helper *ha* comes before the participle."}
  es.a2.unit93.lesson01.exercise05.completa_ha: {"instruction": "Complete with the present tense of *haber* for *Mateo*.", "correct_option": "ha", "accepted_answers": [{"value": "ha", "status": "correct"}], "feedback": "*Mateo se ha duchado*: *él* and *ella* use *ha*."}
  es.a2.unit93.lesson01.exercise06.traduce_desayuno: {"instruction": "Translate into Spanish.", "accepted_answers": [{"value": "He desayunado.", "status": "correct"}, {"value": "He desayunado", "status": "correct"}], "feedback": "*He desayunado* = I have had breakfast."}
  es.a2.unit93.lesson01.exercise07.escribe_llegado: {"instruction": "Write the requested Spanish sentence with *por fin*.", "correct_option": "Por fin he llegado.", "accepted_answers": [{"value": "Por fin he llegado.", "status": "correct"}, {"value": "Por fin he llegado", "status": "correct"}], "feedback": "*Por fin he llegado* = At last I have arrived."}
  es.a2.unit93.lesson02.exercise01.elige_pronombre: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Me he despertado temprano.", "distractors": ["He me despertado temprano.", "Me he despertar temprano.", "Se he despertado temprano."], "accepted_answers": [{"value": "Me he despertado temprano.", "status": "correct"}], "feedback": "The pronoun *me* stands before *he*: *me he despertado*."}
  es.a2.unit93.lesson02.exercise02.elige_pregunta: {"instruction": "Choose the correct Spanish question.", "correct_option": "¿Te has levantado temprano?", "distractors": ["¿Has te levantado temprano?", "¿Te ha levantado temprano?", "¿Se has levantado temprano?"], "accepted_answers": [{"value": "¿Te has levantado temprano?", "status": "correct"}], "feedback": "*Te* goes with *tú*, and *tú* takes *has*: *¿Te has levantado?*"}
  es.a2.unit93.lesson02.exercise03.une_frases: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Me he despertado.", "right": "I woke up."}, {"left": "Te has lavado los dientes.", "right": "You have brushed your teeth."}, {"left": "Elena se ha peinado.", "right": "Elena has combed her hair."}, {"left": "Nos hemos acostado.", "right": "We went to bed."}, {"left": "No me he duchado.", "right": "I have not had a shower."}, {"left": "Mateo se ha vestido.", "right": "Mateo has got dressed."}], "status": "correct"}], "feedback": "Pronoun, *haber*, participle."}
  es.a2.unit93.lesson02.exercise04.ordena_vestido: {"instruction": "Put the words in order to say 'Mateo has not got dressed.'", "correct_option": "Mateo no se ha vestido", "accepted_answers": [{"value": "Mateo no se ha vestido", "status": "correct"}], "feedback": "*No* comes before the pronoun *se*."}
  es.a2.unit93.lesson02.exercise05.completa_pronombre: {"instruction": "Complete with the reflexive pronoun for *Elena*.", "correct_option": "se", "accepted_answers": [{"value": "se", "status": "correct"}], "feedback": "*Elena se ha peinado*: *ella* takes *se*."}
  es.a2.unit93.lesson02.exercise06.traduce_acostado: {"instruction": "Translate into Spanish using *haber*.", "accepted_answers": [{"value": "Nos hemos acostado tarde.", "status": "correct"}, {"value": "Nos hemos acostado tarde", "status": "correct"}], "feedback": "*Nos hemos acostado tarde*: pronoun *nos* with *hemos*."}
  es.a2.unit93.lesson02.exercise07.escribe_duchado: {"instruction": "Write the requested Spanish sentence with *todavía no*.", "correct_option": "Todavía no me he duchado.", "accepted_answers": [{"value": "Todavía no me he duchado.", "status": "correct"}, {"value": "Todavía no me he duchado", "status": "correct"}], "feedback": "*Todavía no me he duchado* = I have not had a shower yet."}
  es.a2.unit93.lesson03.exercise01.elige_habito: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Normalmente me levanto a las siete.", "distractors": ["Normalmente me levantas a las siete.", "Normalmente me levantar a las siete.", "Normalmente te levanto a las siete."], "accepted_answers": [{"value": "Normalmente me levanto a las siete.", "status": "correct"}], "feedback": "A habit uses the present tense: *me levanto*."}
  es.a2.unit93.lesson03.exercise02.elige_hoy: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Hoy me he levantado a las seis.", "distractors": ["Hoy me he levantar a las seis.", "Hoy me han levantado a las seis.", "Hoy he me levantado a las seis."], "accepted_answers": [{"value": "Hoy me he levantado a las seis.", "status": "correct"}], "feedback": "With *hoy* the natural choice is the pretérito perfecto: *me he levantado*."}
  es.a2.unit93.lesson03.exercise03.une_contraste: {"instruction": "Match each Spanish word to its meaning.", "accepted_answers": [{"value": [{"left": "normalmente", "right": "usually"}, {"left": "siempre", "right": "always"}, {"left": "ayer", "right": "yesterday"}, {"left": "hoy", "right": "today"}, {"left": "ya", "right": "already"}, {"left": "todavía no", "right": "not yet"}, {"left": "temprano", "right": "early"}, {"left": "tarde", "right": "late"}], "status": "correct"}], "feedback": "These words help choose the tense."}
  es.a2.unit93.lesson03.exercise04.ordena_ya: {"instruction": "Put the words in order to say 'I have already had a shower.'", "correct_option": "Ya me he duchado", "accepted_answers": [{"value": "Ya me he duchado", "status": "correct"}], "feedback": "*Ya* comes first, then pronoun, *haber*, participle."}
  es.a2.unit93.lesson03.exercise05.completa_ayer: {"instruction": "Complete with the preterite of *levantarse* for *yo* (the day is over).", "correct_option": "levanté", "accepted_answers": [{"value": "levanté", "status": "correct"}], "feedback": "*Ayer me levanté tarde*: yesterday is finished, so the preterite *levanté* is used."}
  es.a2.unit93.lesson03.exercise06.traduce_todavia: {"instruction": "Translate into Spanish.", "accepted_answers": [{"value": "Todavía no he desayunado.", "status": "correct"}, {"value": "Todavía no he desayunado", "status": "correct"}], "feedback": "*Todavía no he desayunado*: *todavía no* + *haber* + participle."}
  es.a2.unit93.lesson03.exercise07.escribe_contraste: {"instruction": "Write exactly two sentences: first the present tense with *normalmente*, then the pretérito perfecto with *hoy*.", "correct_option": "Normalmente me levanto a las siete. Hoy me he levantado a las seis.", "accepted_answers": [{"value": "Normalmente me levanto a las siete. Hoy me he levantado a las seis.", "status": "correct"}, {"value": "Normalmente me levanto a las siete. Hoy me he levantado a las seis", "status": "correct"}], "feedback": "*Normalmente me levanto a las siete. Hoy me he levantado a las seis.*"}
  es.a2.unit93.lesson04.exercise01.elige_hecho: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "He hecho café.", "distractors": ["He hacido café.", "He hace café.", "Ha hecho café."], "accepted_answers": [{"value": "He hecho café.", "status": "correct"}], "feedback": "The participle of *hacer* is irregular: *hecho*."}
  es.a2.unit93.lesson04.exercise02.elige_visto: {"instruction": "Choose the correct Spanish question.", "correct_option": "¿Has visto mis llaves?", "distractors": ["¿Has vido mis llaves?", "¿Has ver mis llaves?", "¿Ha visto mis llaves?"], "accepted_answers": [{"value": "¿Has visto mis llaves?", "status": "correct"}], "feedback": "*Ver* gives *visto*, and *tú* takes *has*."}
  es.a2.unit93.lesson04.exercise03.une_participios: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "he hecho", "right": "I have done / made"}, {"left": "he visto", "right": "I have seen"}, {"left": "he puesto", "right": "I have put"}, {"left": "he dicho", "right": "I have said"}, {"left": "he escrito", "right": "I have written"}, {"left": "he vuelto", "right": "I have come back"}, {"left": "he abierto", "right": "I have opened"}, {"left": "he ido", "right": "I have gone"}], "status": "correct"}], "feedback": "Eight irregular participles."}
  es.a2.unit93.lesson04.exercise04.ordena_bici: {"instruction": "Put the words in order to say 'Mateo has gone to the office by bike.'", "correct_option": "Mateo ha ido en bici a la oficina", "accepted_answers": [{"value": "Mateo ha ido en bici a la oficina", "status": "correct"}], "feedback": "*Ha ido*: the participle of *ir* is *ido*."}
  es.a2.unit93.lesson04.exercise05.completa_escrito: {"instruction": "Complete with the participle of *escribir*.", "correct_option": "escrito", "accepted_answers": [{"value": "escrito", "status": "correct"}], "feedback": "*He escrito un correo*: the participle of *escribir* is *escrito*."}
  es.a2.unit93.lesson04.exercise06.traduce_abierto: {"instruction": "Translate into Spanish.", "accepted_answers": [{"value": "Mateo ha abierto la ventana.", "status": "correct"}, {"value": "Mateo ha abierto la ventana", "status": "correct"}], "feedback": "*Mateo ha abierto la ventana*: the participle of *abrir* is *abierto*."}
  es.a2.unit93.lesson04.exercise07.escribe_secuencia: {"instruction": "Write the three steps in one sentence with *primero*, *luego* and *después*. Use the pretérito perfecto.", "correct_option": "Primero me he duchado, luego he desayunado y después he salido de casa.", "accepted_answers": [{"value": "Primero me he duchado, luego he desayunado y después he salido de casa.", "status": "correct"}, {"value": "Primero me he duchado, luego he desayunado y después he salido de casa", "status": "correct"}, {"value": "Primero me he duchado, luego he desayunado, después he salido de casa.", "status": "correct"}, {"value": "Primero me he duchado, luego he desayunado, después he salido de casa", "status": "correct"}, {"value": "Primero me he duchado. Luego he desayunado. Después he salido de casa.", "status": "correct"}, {"value": "Primero me he duchado. Luego he desayunado. Después he salido de casa", "status": "correct"}], "feedback": "*Primero me he duchado, luego he desayunado y después he salido de casa.*"}
  es.a2.unit93.lesson05.exercise01.lee_desayuno: {"instruction": "Read Mateo's message and choose the answer.", "correct_option": "He has not had breakfast.", "distractors": ["He has not had a shower.", "He has not got dressed.", "He has not made coffee."], "accepted_answers": [{"value": "He has not had breakfast.", "status": "correct"}], "feedback": "*Me he levantado tarde y no he desayunado.*"}
  es.a2.unit93.lesson05.exercise02.lee_llegada: {"instruction": "Read Mateo's message and choose the answer.", "correct_option": "By bike.", "distractors": ["By bus.", "On foot.", "By train."], "accepted_answers": [{"value": "By bike.", "status": "correct"}], "feedback": "*He ido en bici a la oficina.*"}
  es.a2.unit93.lesson05.exercise03.une_mensaje: {"instruction": "Match each line from the message to its meaning.", "accepted_answers": [{"value": [{"left": "¡Qué mañana tan ocupada!", "right": "What a busy morning!"}, {"left": "Me he levantado tarde.", "right": "I got up late."}, {"left": "No he desayunado.", "right": "I haven't had breakfast."}, {"left": "He llegado a las nueve.", "right": "I arrived at nine."}, {"left": "Todavía no he abierto el correo.", "right": "I haven't opened my email yet."}, {"left": "Ya he hecho café.", "right": "I have already made coffee."}, {"left": "¿Cómo ha sido tu mañana?", "right": "How has your morning been?"}], "status": "correct"}], "feedback": "These lines come from Mateo's message."}
  es.a2.unit93.lesson05.exercise04.ordena_correo: {"instruction": "Put the words in order to say 'I haven't opened my email yet.'", "correct_option": "Todavía no he abierto el correo", "accepted_answers": [{"value": "Todavía no he abierto el correo", "status": "correct"}], "feedback": "*Todavía no he abierto el correo*."}
  es.a2.unit93.lesson05.exercise05.traduce_sido: {"instruction": "Translate into Spanish.", "accepted_answers": [{"value": "¿Cómo ha sido tu mañana?", "status": "correct"}, {"value": "Cómo ha sido tu mañana", "status": "correct"}], "feedback": "*¿Cómo ha sido tu mañana?* uses *sido*, the participle of *ser*."}
  es.a2.unit93.lesson05.exercise06.dicta_ocupada: {"instruction": "Type what you hear.", "correct_response": "¡Qué mañana tan ocupada!", "orthography_strict": true, "feedback": "You heard *¡Qué mañana tan ocupada!*"}
  es.a2.unit93.lesson05.exercise07.dicta_cafe: {"instruction": "Type what you hear.", "correct_response": "Ya he hecho café.", "orthography_strict": true, "feedback": "You heard *Ya he hecho café.*"}
  es.a2.unit93.lesson06.exercise01.escucha_apertura: {"instruction": "Listen and select Elena's opening question.", "correct_option": "Hola, Mateo. ¿Cómo ha sido tu mañana?", "distractors": ["Hola, Mateo. ¿Cómo has llegado a la oficina?", "Hola, Mateo. ¿Ya has hecho café?", "Hola, Mateo. ¿Cómo ha sido tu tarde?"], "accepted_answers": [{"value": "Hola, Mateo. ¿Cómo ha sido tu mañana?", "status": "correct"}], "feedback": "Elena opens with *¿Cómo ha sido tu mañana?*"}
  es.a2.unit93.lesson06.exercise02.entiende_desayuno: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He has not had breakfast.", "distractors": ["He has not arrived.", "He has not made coffee.", "He has not got up."], "accepted_answers": [{"value": "He has not had breakfast.", "status": "correct"}], "feedback": "Mateo says: *no he desayunado*."}
  es.a2.unit93.lesson06.exercise03.une_dialogo: {"instruction": "Match each line from the dialogue to its meaning.", "accepted_answers": [{"value": [{"left": "¿Cómo ha sido tu mañana?", "right": "How has your morning been?"}, {"left": "Muy ocupada.", "right": "Very busy."}, {"left": "No he desayunado.", "right": "I haven't had breakfast."}, {"left": "¿Cómo has llegado a la oficina?", "right": "How did you get to the office?"}, {"left": "He ido en bici.", "right": "I went by bike."}, {"left": "He llegado a las nueve.", "right": "I arrived at nine."}, {"left": "¿Ya has hecho café?", "right": "Have you made coffee already?"}, {"left": "¿Quieres un café?", "right": "Do you want a coffee?"}], "status": "correct"}], "feedback": "Each line comes from the dialogue."}
  es.a2.unit93.lesson06.exercise04.ordena_bici2: {"instruction": "Put the words in order to say 'I went by bike and I arrived at nine.'", "correct_option": "He ido en bici y he llegado a las nueve", "accepted_answers": [{"value": "He ido en bici y he llegado a las nueve", "status": "correct"}], "feedback": "Two steps, each with its own *he*."}
  es.a2.unit93.lesson06.exercise05.responde_cafe: {"instruction": "Answer in Spanish: say yes, you have already made coffee. Use *ya he hecho*.", "correct_option": "Sí, ya he hecho café.", "accepted_answers": [{"value": "Sí, ya he hecho café.", "status": "correct"}, {"value": "Sí, ya he hecho café", "status": "correct"}, {"value": "Sí, ya lo he hecho", "status": "correct"}], "feedback": "*Sí, ya he hecho café.*"}
  es.a2.unit93.lesson06.exercise06.traduce_llegado: {"instruction": "Translate into Spanish using the pretérito perfecto.", "accepted_answers": [{"value": "Me he levantado tarde y no he desayunado.", "status": "correct"}, {"value": "Me he levantado tarde y no he desayunado", "status": "correct"}], "feedback": "*Me he levantado tarde y no he desayunado.*"}
  es.a2.unit93.lesson06.exercise07.escribe_manana: {"instruction": "Write exactly three sentences in the pretérito perfecto, in the order given, using reflexive verbs for the first two steps and *salir* for the third.", "correct_option": "Me he levantado a las siete. Me he duchado. He salido de casa.", "accepted_answers": [{"value": "Me he levantado a las siete. Me he duchado. He salido de casa.", "status": "correct"}, {"value": "Me he levantado a las siete. Me he duchado. He salido de casa", "status": "correct"}, {"value": "Me he levantado a las siete. Me he duchado. He salido.", "status": "correct"}, {"value": "Me he levantado a las siete. Me he duchado. He salido", "status": "correct"}], "feedback": "*Me he levantado a las siete. Me he duchado. He salido de casa.*"}
