    instruction: "Match each phrase to its meaning."
    correct_response:
      "el internet": "the internet"
      "no funciona": "doesn't work"
      "desde ayer": "since yesterday"
      "El internet no funciona": "the internet doesn't work"
      "El internet no funciona desde ayer": "the internet hasn't worked since yesterday"
  es.b1.unit37.lesson01.exercise04.order_problem:
    instruction: "Build the sentence: the internet hasn't worked since yesterday."
    correct_response: [El, internet, "no", funciona, desde, ayer]
  es.b1.unit37.lesson01.exercise05.translate_problem:
