teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia: {title: "Bank, pharmacy", gloss: "bank, pharmacy", note: "*Banco* is masculine; *farmacia* is feminine.", example_gloss: ["I'm going to the bank.", "The pharmacy opens at nine."]}
  es.a1.unit08.lesson01.teach.parque_restaurante: {title: "Park, restaurant", gloss: "park, restaurant", note: "Both nouns are masculine.", example_gloss: ["The park is very pretty.", "We eat at the restaurant."]}
  es.a1.unit08.lesson01.teach.biblioteca: {title: "Library", gloss: "library", note: "*Biblioteca* is feminine.", example_gloss: "I study at the library."}

  es.a1.unit08.lesson02.teach.cerca_de: {title: "Near", gloss: "The restaurant is near the market.", note: "*Cerca de* (near) always takes *de* before the reference place."}
  es.a1.unit08.lesson02.teach.lejos_de: {title: "Far from", gloss: "The park is far from the market.", note: "*Lejos de* (far from) is the opposite of *cerca de*."}
  es.a1.unit08.lesson02.teach.al_lado_de: {title: "Next to", gloss: "The bank is next to the market.", note: "*Al lado de* (next to) is a fixed phrase (*al* = *a* + *el lado*). Before a masculine noun like *mercado*, *de* + *el* contracts to *del*: *al lado del mercado*."}
  es.a1.unit08.lesson02.teach.enfrente_de: {title: "Across from", gloss: "The pharmacy is across from the market.", note: "*Enfrente de* (across from, facing) describes two places on opposite sides of something, like a street."}
  es.a1.unit08.lesson02.teach.entre: {title: "Between", gloss: "The library is between the bank and the park.", note: "*Entre* (between) needs two reference points, joined here with *y* (and)."}

  es.a1.unit08.lesson03.teach.donde_esta_el_banco: {title: "Ask where the bank is", gloss: "Where is the bank?", note: "*Dónde está* (where is) is the standard question pattern for locating a place."}
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado: {title: "Answer with a location", gloss: "It's next to the market.", note: "*Del* contracts *de* + *el*, required before the masculine *mercado*."}
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia: {title: "Ask where the pharmacy is", gloss: "Where is the pharmacy?", note: "Same question pattern, applied to a feminine-article noun -- the question itself doesn't change for gender."}
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado: {title: "Answer: across from", gloss: "It's across from the market.", note: "*Enfrente de* + *el mercado* becomes *enfrente del mercado*, the same *del* contraction as *al lado del mercado*."}

  es.a1.unit08.lesson04.teach.esta_lejos: {title: "Ask if it's far", gloss: "Is it far?", note: "A short follow-up question, dropping the subject once it's already clear from context."}
  es.a1.unit08.lesson04.teach.no_esta_cerca: {title: "Answer: no, it's close", gloss: "No, it's close.", note: "*Cerca* alone (without *de*) works as a short answer, unlike the full *cerca de* phrase used with a named place."}
  es.a1.unit08.lesson04.teach.si_esta_lejos: {title: "Answer: yes, quite far", gloss: "Yes, it's quite far.", note: "*Bastante* (quite, rather) intensifies *lejos* without being as strong as *muy* (very)."}

  es.a1.unit08.lesson05.teach.barrio_reading:
    title: "Reading about the neighborhood"
    gloss: "This neighborhood has many useful places. The bank is next to the market. The pharmacy is across from the market. The park is far, but the library is between the bank and the park. The restaurant is very close to the market."
    note: "This short text brings together the location phrases from this unit in one description of the neighborhood."
    glosses: {barrio: "neighborhood", hay: "there are (from haber)", muchos: "many", lugares: "places", útiles: "useful", banco: "bank", está: "is located (from estar)", lado: "side", mercado: "market", farmacia: "pharmacy", enfrente: "opposite / across from", parque: "park", lejos: "far", biblioteca: "library", entre: "between", restaurante: "restaurant", cerca: "near"}
  es.a1.unit08.lesson05.teach.hay_note: {title: "Hay (there is/are)", gloss: "Why hay never changes for singular or plural.", note: "See the card's own text."}

  es.a1.unit08.lesson06.teach.line01: {title: "Ask where the bank is", gloss: "Mateo asks Elena where the bank is.", note: "The same *¿Dónde está...?* question from earlier in this unit, opened with Elena's name to get her attention."}
  es.a1.unit08.lesson06.teach.line02: {title: "Answer and reference the market", gloss: "Elena says it's next to the market, where they bought the eggs.", note: "*Donde compramos los huevos* (where we bought the eggs) refers back to their shopping trip in Unit 7."}
  es.a1.unit08.lesson06.teach.line03: {title: "Ask about the pharmacy", gloss: "Mateo acknowledges and asks about the pharmacy.", note: "*Ah, sí* (ah, yes) is a natural brief acknowledgment before the next question."}
  es.a1.unit08.lesson06.teach.line04: {title: "Answer: across from", gloss: "Elena says it's across from the market.", note: "A short answer: the subject (*la farmacia*) is dropped because it's clear from the question."}
  es.a1.unit08.lesson06.teach.line05: {title: "Ask about the park", gloss: "Mateo asks about the park, and if it's close.", note: "Combines two questions in one turn, natural in casual conversation."}
  es.a1.unit08.lesson06.teach.line06: {title: "Answer: far, then mention the library", gloss: "Elena says the park is far, but the library is between the bank and the park.", note: "*Pero* (but) contrasts the park's distance with the library's more convenient location."}
  es.a1.unit08.lesson06.teach.line07: {title: "Thank and ask about the restaurant", gloss: "Mateo thanks Elena and asks about the restaurant where they ate.", note: "*El restaurante donde comimos* (the restaurant where we ate) refers back to their lunch in Unit 6."}
  es.a1.unit08.lesson06.teach.line08: {title: "Confirm it's very close", gloss: "Elena confirms it's very close to the market.", note: "*Muy cerca* (very close): *muy* (very) is stronger than *bastante* (quite), as in *bastante lejos* (quite far)."}

