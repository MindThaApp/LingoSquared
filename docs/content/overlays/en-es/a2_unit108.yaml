teaching:
  es.a2.unit108.lesson01.teach.gn_donde: {"title": "¿Sabes dónde...?", "gloss": "Do you know where the station is? Do you know where Mateo lives? Do you know where the bank is?", "note": "An indirect question is a question inside another one. After *¿sabes...?* put the question word *dónde* and then a normal sentence, without changing the word order and without a second question mark in the middle."}
  es.a2.unit108.lesson01.teach.gn_respuesta: {"title": "Answering", "gloss": "Yes, the station is there. I do not know where Mateo lives. I do not know where the bank is.", "note": "*No sé dónde...* is the usual way to say you do not know. Use the same word order as in the question."}
  es.a2.unit108.lesson01.teach.palabras: {"title": "Words for places", "gloss": "to know / where / to be / to live / the station / the bank / there", "note": "*Sé* is I know and *sabes* is you know. *Dónde* always has an accent in a question.", "example_gloss": ["Do you know where the station is?", "I do not know where Mateo lives.", "The station is there.", "The bank is in the street."]}
  es.a2.unit108.lesson01.teach.gn_orden: {"title": "Direct and indirect", "gloss": "Do you know where Mateo is? Where is Mateo?", "note": "The direct question starts with *dónde*. The indirect, more polite one starts with *¿sabes dónde...?*"}
  es.a2.unit108.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Do you know where the station is? I do not know where Mateo lives. Do you know where the bank is?"}
  es.a2.unit108.lesson02.teach.gn_hora: {"title": "¿Sabes a qué hora...?", "gloss": "Do you know what time the train leaves? Do you know what time Elena arrives? Do you know what time we have dinner?", "note": "*A qué hora* has the same shape as the direct question. After it comes a normal sentence: *sale el tren*, *llega Elena*."}
  es.a2.unit108.lesson02.teach.gn_cuanto: {"title": "¿Sabes cuánto...?", "gloss": "Do you know how much the ticket costs? Do you know how much the bread costs? I do not know how much it costs.", "note": "*Cuánto cuesta* asks for the price of one thing. With several things use *cuánto cuestan*."}
  es.a2.unit108.lesson02.teach.gn_cuando: {"title": "¿Sabes cuándo...?", "gloss": "Do you know when the train arrives? Do you know when Mateo comes? I do not know when he comes.", "note": "*Cuándo* asks for a time or a day. It has an accent in a question."}
  es.a2.unit108.lesson02.teach.palabras: {"title": "Time and price", "gloss": "the time / to leave / to cost / how much / when / the ticket", "note": "*Cuesta* is the form of *costar* for one thing. The vowel changes: *cuesta*, but *costar*.", "example_gloss": ["Do you know what time the train leaves?", "Do you know how much the ticket costs?", "I do not know when Elena arrives.", "The ticket costs twenty euros."]}
  es.a2.unit108.lesson02.teach.frases: {"title": "Three sentences", "gloss": "Do you know what time the train leaves? Do you know how much the ticket costs? I do not know when Elena arrives."}
  es.a2.unit108.lesson03.teach.gn_si: {"title": "¿Sabes si...?", "gloss": "Do you know if Mateo is coming? Do you know if there is a bank here? Do you know if Elena has time?", "note": "When the question has no question word (a yes-or-no question), use *si* (if or whether). *Si* has no accent."}
  es.a2.unit108.lesson03.teach.gn_respuesta: {"title": "Answers", "gloss": "Yes, Mateo is coming. I do not know if Mateo is coming. Yes, there is a bank here. I do not know if there is a bank here.", "note": "You can answer *sí* or *no*, or say you do not know with *no sé si...*"}
  es.a2.unit108.lesson03.teach.gn_contraste: {"title": "Dónde or si?", "gloss": "Do you know where Mateo is? Do you know if Mateo is at home?", "note": "Use *dónde* when you want a place, a time or a price. Use *si* when the answer is yes or no."}
  es.a2.unit108.lesson03.teach.palabras: {"title": "Words for yes or no questions", "gloss": "there is or there are / here / to have time / to come", "note": "*Hay* means there is and there are.", "example_gloss": ["Do you know if there is a bank here?", "I do not know if Mateo is coming.", "Do you know if Elena has time?", "Yes, there is a bank here."]}
  es.a2.unit108.lesson03.teach.frases: {"title": "Three sentences", "gloss": "Do you know if Mateo is coming? Do you know if there is a bank here? I do not know if Elena has time."}
  es.a2.unit108.lesson04.teach.gn_sabe: {"title": "¿Sabe...? with usted", "gloss": "Do you know where the station is? Do you know what time the train leaves? Do you know how much the ticket costs?", "note": "With a stranger or a person at work, use *usted*: *¿sabe...?*. After it comes the same indirect question as with *tú*."}
  es.a2.unit108.lesson04.teach.gn_puede: {"title": "¿Puede decirme...?", "gloss": "Can you tell me where the platform is? Can you tell me what time the train leaves? Can you tell me if there is a café?", "note": "*¿Puede decirme...?* is a very polite way to ask. Then add the question word or *si* and a normal sentence."}
  es.a2.unit108.lesson04.teach.gn_perdone: {"title": "Start with perdone", "gloss": "Excuse me, do you know what time the train leaves? Excuse me, can you tell me where the bank is?", "note": "*Perdone* is excuse me for a person you address as *usted*. A friend would hear *perdona* instead."}
  es.a2.unit108.lesson04.teach.palabras: {"title": "Station words", "gloss": "excuse me / to say or to tell / the platform / the café / thank you / on the right", "note": "*Decirme* is *decir* + *me*: to tell me.", "example_gloss": ["Excuse me, do you know where the platform is?", "Can you tell me if there is a café?", "The platform is on the right.", "Thank you very much."]}
  es.a2.unit108.lesson04.teach.frases: {"title": "Three sentences", "gloss": "Excuse me, do you know where the platform is? Can you tell me what time the train leaves? Can you tell me if there is a café?"}
  es.a2.unit108.lesson05.teach.palabras: {"title": "Words for the list", "gloss": "my questions / for the station / afterwards / to call", "note": "*Mis preguntas* is my questions: *mis* is the plural of *mi*.", "example_gloss": ["These are my questions.", "My questions for the station.", "Afterwards, I call Mateo.", "Today I go to Barcelona."]}
  es.a2.unit108.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "Do you know what time the train leaves? Can you tell me if there is a café?", "note": "In the list, find each indirect question and name the word that follows *sabe* or *decirme*."}
  es.a2.unit108.lesson05.teach.lectura: {"title": "Elena's list", "gloss": "Today I go to Barcelona. My questions for the station: Excuse me, do you know what time the train leaves? Can you tell me where the platform is? Do you know how much the ticket costs? Can you tell me if there is a café? Afterwards, I call Mateo.", "note": "Each question uses *usted* because the person at the station is a stranger.", "glosses": {"preguntas": "questions", "estación": "station", "andén": "platform", "billete": "ticket", "café": "café"}}
  es.a2.unit108.lesson06.teach.d1: {"title": "Elena asks the time", "gloss": "Elena: Excuse me, do you know what time the train to Barcelona leaves?"}
  es.a2.unit108.lesson06.teach.d2: {"title": "The employee answers", "gloss": "Empleado: It leaves at ten."}
  es.a2.unit108.lesson06.teach.d3: {"title": "Elena asks about the platform", "gloss": "Elena: Can you tell me where the platform is?"}
  es.a2.unit108.lesson06.teach.d4: {"title": "The employee points", "gloss": "Empleado: It is there, on the right."}
  es.a2.unit108.lesson06.teach.d5: {"title": "Elena asks the price", "gloss": "Elena: And one more question: do you know how much the ticket costs?"}
  es.a2.unit108.lesson06.teach.d6: {"title": "The employee answers", "gloss": "Empleado: It costs twenty euros."}
  es.a2.unit108.lesson06.teach.d7: {"title": "Elena thanks", "gloss": "Elena: Thank you very much."}
exercises:
