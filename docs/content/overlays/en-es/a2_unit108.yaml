  es.a2.unit108.lesson01.exercise06.traduce_vive: {"instruction": "Translate into Spanish. Use *no sé*.", "accepted_answers": [{"value": "No sé dónde vive Mateo.", "status": "correct"}, {"value": "No sé dónde vive Mateo", "status": "correct"}, {"value": "Yo no sé dónde vive Mateo.", "status": "correct"}, {"value": "Yo no sé dónde vive Mateo", "status": "correct"}], "feedback": "*No sé dónde vive Mateo.*"}
  es.a2.unit108.lesson01.exercise07.escribe_banco: {"instruction": "Write the question with *¿sabes dónde...?*", "correct_option": "¿Sabes dónde está el banco?", "accepted_answers": [{"value": "¿Sabes dónde está el banco?", "status": "correct"}, {"value": "Sabes dónde está el banco", "status": "correct"}, {"value": "Sabes dónde está el banco.", "status": "correct"}], "feedback": "*¿Sabes dónde está el banco?*"}
  es.a2.unit108.lesson02.exercise01.elige_hora: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Sabes a qué hora sale el tren?", "distractors": ["¿Sabes qué hora sale el tren?", "¿Sabes a qué hora el tren sale?", "¿Sabes a qué hora salir el tren?"], "accepted_answers": [{"value": "¿Sabes a qué hora sale el tren?", "status": "correct"}], "feedback": "*A qué hora* + a normal sentence."}
  es.a2.unit108.lesson02.exercise02.elige_cuanto: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Sabes cuánto cuesta el billete?", "distractors": ["¿Sabes cuanto cuesta el billete?", "¿Sabes cuánto costar el billete?", "¿Sabes cuántos cuesta el billete?"], "accepted_answers": [{"value": "¿Sabes cuánto cuesta el billete?", "status": "correct"}], "feedback": "*Cuánto cuesta* for a single thing."}
  es.a2.unit108.lesson02.exercise03.une_hora: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "¿a qué hora?", "right": "at what time?"}, {"left": "¿cuánto cuesta?", "right": "how much does it cost?"}, {"left": "¿cuándo?", "right": "when?"}, {"left": "¿dónde?", "right": "where?"}, {"left": "sale", "right": "it leaves"}, {"left": "llega", "right": "it arrives"}, {"left": "cuesta", "right": "it costs"}], "status": "correct"}], "feedback": "Question words for indirect questions."}
