  es.a2.unit108.lesson02.exercise05.completa_hora: {"instruction": "Complete the noun in the time question.", "correct_option": "hora", "accepted_answers": [{"value": "hora", "status": "correct"}], "feedback": "*¿A qué hora?* asks for the time."}
  es.a2.unit108.lesson02.exercise06.traduce_cuando: {"instruction": "Translate into Spanish. Use *no sé cuándo*.", "accepted_answers": [{"value": "No sé cuándo llega Elena.", "status": "correct"}, {"value": "No sé cuándo llega Elena", "status": "correct"}, {"value": "Yo no sé cuándo llega Elena.", "status": "correct"}, {"value": "Yo no sé cuándo llega Elena", "status": "correct"}], "feedback": "*No sé cuándo llega Elena.*"}
