  es.a2.unit108.lesson03.exercise01.elige_si: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Sabes si Mateo viene?", "distractors": ["¿Sabes sí Mateo viene?", "¿Sabes si viene a Mateo?", "¿Sabes que Mateo viene?"], "accepted_answers": [{"value": "¿Sabes si Mateo viene?", "status": "correct"}], "feedback": "*Si* without accent."}
  es.a2.unit108.lesson03.exercise02.elige_hay: {"instruction": "Choose the correct Spanish question that can be answered with yes or no.", "correct_option": "¿Sabes si hay un banco aquí?", "distractors": ["¿Sabes dónde hay un banco aquí?", "¿Sabes si hay un banco allí aquí?", "¿Sabes hay un banco aquí?"], "accepted_answers": [{"value": "¿Sabes si hay un banco aquí?", "status": "correct"}], "feedback": "A yes-or-no question uses *si*."}
