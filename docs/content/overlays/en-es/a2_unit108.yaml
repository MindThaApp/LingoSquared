  es.a2.unit108.lesson03.exercise06.traduce_hay: {"instruction": "Translate into Spanish, speaking to a friend. Use *si*.", "accepted_answers": [{"value": "¿Sabes si hay un banco aquí?", "status": "correct"}, {"value": "Sabes si hay un banco aquí", "status": "correct"}, {"value": "Sabes si hay un banco aquí.", "status": "correct"}], "feedback": "*¿Sabes si hay un banco aquí?*"}
  es.a2.unit108.lesson03.exercise07.escribe_no_se: {"instruction": "Write the sentence with *no sé si*.", "correct_option": "No sé si Mateo viene.", "accepted_answers": [{"value": "No sé si Mateo viene.", "status": "correct"}, {"value": "No sé si Mateo viene", "status": "correct"}, {"value": "Yo no sé si Mateo viene.", "status": "correct"}, {"value": "Yo no sé si Mateo viene", "status": "correct"}], "feedback": "*No sé si Mateo viene.*"}
  es.a2.unit108.lesson04.exercise01.elige_sabe: {"instruction": "Choose the correct Spanish sentence for a stranger (usted).", "correct_option": "Perdone, ¿sabe dónde está el andén?", "distractors": ["Perdone, ¿sabes dónde está el andén?", "Perdone, ¿sabe dónde el andén está?", "Perdone, ¿sabéis dónde está el andén?"], "accepted_answers": [{"value": "Perdone, ¿sabe dónde está el andén?", "status": "correct"}], "feedback": "With *usted* use *sabe*."}
  es.a2.unit108.lesson04.exercise02.elige_puede: {"instruction": "Choose the correct Spanish sentence for a stranger (usted).", "correct_option": "¿Puede decirme si hay un café?", "distractors": ["¿Puede decirme sí hay un café?", "¿Puedes decirme si hay un café?", "¿Puede decirme si un café hay?"], "accepted_answers": [{"value": "¿Puede decirme si hay un café?", "status": "correct"}], "feedback": "*Usted* form: *puede*. *Si* without accent."}
  es.a2.unit108.lesson04.exercise03.une_usted: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "perdone", "right": "excuse me"}, {"left": "¿sabe...?", "right": "do you know...? (usted)"}, {"left": "¿sabes...?", "right": "do you know...? (tú)"}, {"left": "¿puede decirme...?", "right": "can you tell me...?"}, {"left": "el andén", "right": "the platform"}, {"left": "a la derecha", "right": "on the right"}, {"left": "muchas gracias", "right": "thank you very much"}], "status": "correct"}], "feedback": "Formal and informal forms."}
  es.a2.unit108.lesson04.exercise04.ordena_perdone: {"instruction": "Put the words in order to say 'Excuse me, do you know what time the train leaves?'", "correct_option": "Perdone sabe a qué hora sale el tren", "accepted_answers": [{"value": "Perdone sabe a qué hora sale el tren", "status": "correct"}], "feedback": "*Perdone* first, then *sabe*."}
  es.a2.unit108.lesson04.exercise05.completa_puede: {"instruction": "Complete the *usted* form of *poder*.", "correct_option": "Puede", "accepted_answers": [{"value": "Puede", "status": "correct"}], "feedback": "*¿Puede decirme...?*"}
  es.a2.unit108.lesson04.exercise06.traduce_anden: {"instruction": "Translate into Spanish, speaking to a stranger. Use *puede*.", "accepted_answers": [{"value": "¿Puede decirme dónde está el andén?", "status": "correct"}, {"value": "Puede decirme dónde está el andén", "status": "correct"}, {"value": "Puede decirme dónde está el andén.", "status": "correct"}], "feedback": "*¿Puede decirme dónde está el andén?*"}
  es.a2.unit108.lesson04.exercise07.escribe_sabe: {"instruction": "Write the question with *¿sabe a qué hora...?*", "correct_option": "¿Sabe a qué hora sale el tren?", "accepted_answers": [{"value": "¿Sabe a qué hora sale el tren?", "status": "correct"}, {"value": "Sabe a qué hora sale el tren", "status": "correct"}, {"value": "Perdone, ¿sabe a qué hora sale el tren?", "status": "correct"}, {"value": "Perdone, ¿sabe a qué hora sale el tren", "status": "correct"}, {"value": "Sabe a qué hora sale el tren.", "status": "correct"}], "feedback": "*¿Sabe a qué hora sale el tren?*"}
  es.a2.unit108.lesson05.exercise01.lee_donde: {"instruction": "Read the text and choose the answer.", "correct_option": "Where it is.", "distractors": ["What time it leaves.", "How much it costs.", "If there is a café."], "accepted_answers": [{"value": "Where it is.", "status": "correct"}], "feedback": "*¿Puede decirme dónde está el andén?*"}
