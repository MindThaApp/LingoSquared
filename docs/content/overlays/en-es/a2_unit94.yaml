answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit94.cuando_era_pequeno: {"title": "When I Was Little", "description": "Describe how life used to be, in childhood or at a previous home, and say how it differs from now, with the pretérito imperfecto for habits."}
lessons:
  es.a2.unit94.lesson01.antes_jugaba: {"title": "I Used to Play"}
  es.a2.unit94.lesson02.comia_y_iba: {"title": "I Used to Eat and Go"}
  es.a2.unit94.lesson03.antes_y_ahora: {"title": "Before and Now"}
  es.a2.unit94.lesson04.mi_casa_de_antes: {"title": "My Old House"}
  es.a2.unit94.lesson05.los_veranos_de_elena: {"title": "Elena's Summers"}
  es.a2.unit94.lesson06.como_eras_de_nina: {"title": "What Were You Like as a Girl?"}
teaching:
  es.a2.unit94.lesson01.teach.verbos_ar: {"title": "Verbs in -ar", "gloss": "to play / to walk / to study / to sing / to dance / to help", "note": "These are regular -ar verbs. In this unit we use them to say what used to happen.", "example_gloss": ["Before, I used to play in the park.", "We used to walk to school.", "My friend used to dance a lot.", "I used to study at school."]}
  es.a2.unit94.lesson01.teach.lugares: {"title": "Places and people", "gloss": "before / the park / the school / the street / my friends / my friend", "note": "*Antes* means 'before' or 'in the past'.", "example_gloss": ["Before, I used to play with my friends.", "My friends used to sing in the street.", "My friend used to walk to the park."]}
  es.a2.unit94.lesson01.teach.gn_aba: {"title": "The imperfect of -ar verbs", "gloss": "I used to play, you used to play, he used to play, she used to play, we used to play, they used to play", "note": "Drop -ar and add -aba, -abas, -aba, -ábamos, -aban. The pretérito imperfecto describes what used to happen again and again. Only the *nosotros* form has a written accent. The forms for *yo*, *él* and *ella* are identical."}
  es.a2.unit94.lesson01.teach.gn_uso: {"title": "Using the imperfect", "gloss": "Before, I used to play in the park. Before, we used to sing at school.", "note": "The imperfect often goes with *antes*. It can be translated as 'used to play' or 'played' (when it was a habit). Spanish also has *soler* + infinitive, which is not covered here."}
  es.a2.unit94.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Before, I used to play in the street. You used to sing a lot. They used to study at school."}
  es.a2.unit94.lesson02.teach.verbos_er_ir: {"title": "Verbs in -er and -ir", "gloss": "to eat / to drink / to read / to live", "note": "These verbs end in -er or -ir. Both groups share the same imperfect endings.", "example_gloss": ["Before, I used to eat bread at home.", "You used to drink milk.", "We used to read at school.", "They used to live in the village."]}
  es.a2.unit94.lesson02.teach.sustantivos: {"title": "Words for the past", "gloss": "bread / milk / the village / the city / the house / big / small / very / a lot", "note": "*Pequeña* is feminine because *casa* is feminine.", "example_gloss": ["My house was very big.", "We used to live in a small house.", "Before, I used to read a lot.", "Before, I used to go to the village."]}
  es.a2.unit94.lesson02.teach.gn_ia: {"title": "The imperfect of -er and -ir verbs", "gloss": "I used to eat, you used to eat, he used to live, she used to live, we used to eat, they used to live", "note": "Drop -er or -ir and add -ía, -ías, -ía, -íamos, -ían. The written accent on the *i* is on every form."}
  es.a2.unit94.lesson02.teach.gn_irregulares: {"title": "Three irregular verbs: ser, ir, ver", "gloss": "to be: I was, you were, she was, we were, they were. to go: I used to go, you used to go, she used to go, we used to go, they used to go. to see: I used to see, you used to see, she used to see, we used to see, they used to see", "note": "In the imperfect only *ser*, *ir* and *ver* are irregular. *Ser* has the stem *er-* (*era*, *eras*...), *ir* uses *-aba* endings after *ib-*, and *ver* keeps the *e* (*veía*)."}
  es.a2.unit94.lesson02.teach.frases: {"title": "Three sentences", "gloss": "My house was very big. Before, I used to go to the village. She used to see her friends."}
  es.a2.unit94.lesson03.teach.tiempo: {"title": "Words for then and now", "gloss": "now / as a boy / as a girl / always / every day / sometimes / every summer", "note": "These words show that something happened repeatedly.", "example_gloss": ["As a boy I used to play in the street.", "As a girl I used to sing a lot.", "We always used to eat at home.", "Sometimes we used to go to the park.", "Every summer I used to go to the village."]}
  es.a2.unit94.lesson03.teach.gn_contraste: {"title": "Before and now", "gloss": "Before I lived in a village, now I live in a city.", "note": "Use the imperfect for the past habit or situation and the present tense after *ahora*. The verbs *vivía* and *vivo* come from the same verb."}
  es.a2.unit94.lesson03.teach.gn_frecuencia: {"title": "How often", "gloss": "Every day I used to play in the street. Sometimes we used to eat in the park. I always used to see my friends.", "note": "*Todos los días*, *a veces*, *siempre* and *cada verano* mark a habit, so they go well with the imperfect."}
  es.a2.unit94.lesson03.teach.gn_fui: {"title": "One event is different", "gloss": "Every summer I used to go to the village. One summer I went to Barcelona.", "note": "A single event that happened once uses another past tense: *fui* is a form of *ir* that you will learn later. In this unit we practise only the imperfect."}
  es.a2.unit94.lesson03.teach.frases: {"title": "Three sentences", "gloss": "As a girl I used to sing a lot. Now I sing a little. Before, I used to play every day."}
  es.a2.unit94.lesson04.teach.casa: {"title": "Home and school", "gloss": "bedroom / kitchen / garden / table / to have", "note": "*Tenía* is the imperfect of *tener*. It follows the regular -er pattern.", "example_gloss": ["My house was small and had a garden.", "My bedroom was big.", "The kitchen had a table.", "We used to play in the garden."]}
  es.a2.unit94.lesson04.teach.comida: {"title": "Food and free time", "gloss": "chocolate / TV / in the morning / at night / but", "note": "*Por la mañana* and *por la noche* say when something usually happened.", "example_gloss": ["I used to eat bread with chocolate.", "I used to drink milk in the morning.", "We used to watch TV at night."]}
  es.a2.unit94.lesson04.teach.gn_descripcion: {"title": "Describing the old house", "gloss": "My house was small and had a garden. My bedroom was big, but the kitchen was small.", "note": "Use *era* to say what something was like and *tenía* for what it had. Adjectives agree with the noun: *casa pequeña*, *habitación grande*."}
  es.a2.unit94.lesson04.teach.gn_diferencia: {"title": "How it differs from now", "gloss": "Before, my house was small. Now my house is big.", "note": "*Era* is the past and *es* is the present of *ser*. Put *antes* and *ahora* at the start to show the contrast."}
  es.a2.unit94.lesson04.teach.frases: {"title": "Three sentences", "gloss": "I used to eat bread with chocolate. We used to watch TV at night. Before, I used to play in the garden."}
  es.a2.unit94.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "when / to spend (time) / summer / train / grandparents / grandmother / tomato / cold / happy", "note": "*Cuando era pequeña* means 'when I was little'; a boy says *pequeño*. *Fría* is feminine because *leche* is feminine.", "example_gloss": ["When I was little, I used to spend the summers with my grandparents.", "We used to go to the village by train.", "My grandmother used to make bread.", "We used to drink cold milk."]}
  es.a2.unit94.lesson05.teach.gn_cuando: {"title": "When I was little", "gloss": "When I was little, I used to spend the summers with my grandparents.", "note": "*Cuando era pequeño/a* sets the time frame. After it, the imperfect keeps describing the habits of that time."}
  es.a2.unit94.lesson05.teach.gn_preguntar: {"title": "Asking about someone's childhood", "gloss": "What did you use to do as a boy? What were you like as a girl?", "note": "Ask with the imperfect too: *hacías*, *eras*. *Hacer* is regular in the imperfect (*hacía*, *hacías*...)."}
  es.a2.unit94.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi Mateo. When I was little, I used to spend the summers with my grandparents. Every summer we used to go to the village by train. My grandparents lived in a big house with a garden. In the morning I used to play with my dog and in the afternoon I used to help my grandmother. We used to eat bread with tomato and drink cold milk. I was very happy. And you? What did you use to do as a boy?", "note": "Notice how every verb is in the imperfect: it is a description of habits, not of one day.", "glosses": {"abuelos": "grandparents", "tren": "train", "pueblo": "village", "fría": "cold", "feliz": "happy"}}
  es.a2.unit94.lesson06.teach.d1: {"title": "Mateo asks", "gloss": "Mateo: Elena, what were you like as a girl?"}
  es.a2.unit94.lesson06.teach.d2: {"title": "Elena answers", "gloss": "Elena: I was very happy. I used to spend the summers with my grandparents in the village."}
  es.a2.unit94.lesson06.teach.d3: {"title": "Mateo asks about the days", "gloss": "Mateo: What did you use to do there every day?"}
  es.a2.unit94.lesson06.teach.d4: {"title": "Elena describes her days", "gloss": "Elena: I used to play with my dog and help my grandmother. In the afternoon I used to read in the garden."}
  es.a2.unit94.lesson06.teach.d5: {"title": "Mateo asks about now", "gloss": "Mateo: How lovely! And now? Is it different?"}
  es.a2.unit94.lesson06.teach.d6: {"title": "Elena compares", "gloss": "Elena: Yes. Before, I used to play every day. Now I have less time."}
exercises:
  es.a2.unit94.lesson01.exercise01.elige_jugaba: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Antes jugaba en el parque.", "distractors": ["Antes jugar en el parque.", "Antes jugabas en el parque.", "Antes jugo en el parque."], "accepted_answers": [{"value": "Antes jugaba en el parque.", "status": "correct"}], "feedback": "For *yo* the imperfect of *jugar* is *jugaba*."}
  es.a2.unit94.lesson01.exercise02.elige_caminabamos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Antes caminábamos a la escuela.", "distractors": ["Antes caminaban a la escuela.", "Antes caminaba a la escuela.", "Antes caminando a la escuela."], "accepted_answers": [{"value": "Antes caminábamos a la escuela.", "status": "correct"}], "feedback": "*Nosotros* takes *-ábamos*: *caminábamos*."}
  es.a2.unit94.lesson01.exercise03.une_formas: {"instruction": "Match each Spanish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "yo jugaba", "right": "I used to play"}, {"left": "tú cantabas", "right": "you used to sing"}, {"left": "ella bailaba", "right": "she used to dance"}, {"left": "nosotros caminábamos", "right": "we used to walk"}, {"left": "ellos estudiaban", "right": "they used to study"}, {"left": "antes", "right": "before"}, {"left": "la escuela", "right": "the school"}, {"left": "el parque", "right": "the park"}], "status": "correct"}], "feedback": "These are -ar imperfect forms and places."}
  es.a2.unit94.lesson01.exercise04.ordena_calle: {"instruction": "Put the words in order to say 'Before, we used to play in the street.'", "correct_option": "Antes jugábamos en la calle", "accepted_answers": [{"value": "Antes jugábamos en la calle", "status": "correct"}], "feedback": "*Jugábamos* is the *nosotros* form."}
  es.a2.unit94.lesson01.exercise05.completa_jugabamos: {"instruction": "Complete with the imperfect of *jugar*.", "correct_option": "jugábamos", "accepted_answers": [{"value": "jugábamos", "status": "correct"}], "feedback": "*Nosotros* takes *jugábamos*."}
  es.a2.unit94.lesson01.exercise06.traduce_estudiaba: {"instruction": "Translate into Spanish using the imperfect.", "accepted_answers": [{"value": "Antes estudiaba en la escuela.", "status": "correct"}, {"value": "Antes estudiaba en la escuela", "status": "correct"}, {"value": "Antes yo estudiaba en la escuela.", "status": "correct"}, {"value": "Antes yo estudiaba en la escuela", "status": "correct"}], "feedback": "*Antes estudiaba en la escuela.*"}
  es.a2.unit94.lesson01.exercise07.escribe_jugaban: {"instruction": "Write the requested Spanish sentence using the imperfect.", "correct_option": "Antes jugaban en la calle.", "accepted_answers": [{"value": "Antes jugaban en la calle.", "status": "correct"}, {"value": "Antes jugaban en la calle", "status": "correct"}, {"value": "Antes ellos jugaban en la calle.", "status": "correct"}, {"value": "Antes ellos jugaban en la calle", "status": "correct"}, {"value": "Ellos jugaban en la calle antes.", "status": "correct"}, {"value": "Ellos jugaban en la calle antes", "status": "correct"}], "feedback": "*Antes jugaban en la calle.*"}
  es.a2.unit94.lesson02.exercise01.elige_iba: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Antes iba a la escuela.", "distractors": ["Antes ibas a la escuela.", "Antes ir a la escuela.", "Antes iban a la escuela."], "accepted_answers": [{"value": "Antes iba a la escuela.", "status": "correct"}], "feedback": "*Ir* is irregular: *yo iba*."}
  es.a2.unit94.lesson02.exercise02.elige_comiamos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Antes comíamos en casa.", "distractors": ["Antes comían en casa.", "Antes comía en casa.", "Antes comer en casa."], "accepted_answers": [{"value": "Antes comíamos en casa.", "status": "correct"}], "feedback": "*Nosotros* takes *-íamos*: *comíamos*."}
  es.a2.unit94.lesson02.exercise03.une_irregulares: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "yo era", "right": "I was"}, {"left": "tú eras", "right": "you were"}, {"left": "ella iba", "right": "she used to go"}, {"left": "nosotros íbamos", "right": "we used to go"}, {"left": "yo veía", "right": "I used to see"}, {"left": "ellos veían", "right": "they used to see"}, {"left": "él comía", "right": "he used to eat"}, {"left": "nosotros vivíamos", "right": "we used to live"}], "status": "correct"}], "feedback": "These are -er, -ir and irregular imperfect forms."}
  es.a2.unit94.lesson02.exercise04.ordena_casa: {"instruction": "Put the words in order to say 'Before, my house was very big.'", "correct_option": "Antes mi casa era muy grande", "accepted_answers": [{"value": "Antes mi casa era muy grande", "status": "correct"}], "feedback": "*Era* is the imperfect of *ser* for a singular noun."}
  es.a2.unit94.lesson02.exercise05.completa_iba: {"instruction": "Complete with the imperfect of *ir*.", "correct_option": "iba", "accepted_answers": [{"value": "iba", "status": "correct"}], "feedback": "*Ella* takes *iba*."}
  es.a2.unit94.lesson02.exercise06.traduce_vivir: {"instruction": "Translate into Spanish using the imperfect.", "accepted_answers": [{"value": "Vivíamos en una casa pequeña.", "status": "correct"}, {"value": "Vivíamos en una casa pequeña", "status": "correct"}, {"value": "Antes vivíamos en una casa pequeña.", "status": "correct"}, {"value": "Antes vivíamos en una casa pequeña", "status": "correct"}, {"value": "Nosotros vivíamos en una casa pequeña.", "status": "correct"}, {"value": "Nosotros vivíamos en una casa pequeña", "status": "correct"}], "feedback": "*Vivíamos en una casa pequeña.*"}
  es.a2.unit94.lesson02.exercise07.escribe_leia: {"instruction": "Write the requested Spanish sentence using the imperfect.", "correct_option": "Antes leía mucho.", "accepted_answers": [{"value": "Antes leía mucho.", "status": "correct"}, {"value": "Antes leía mucho", "status": "correct"}, {"value": "Antes él leía mucho.", "status": "correct"}, {"value": "Antes él leía mucho", "status": "correct"}, {"value": "Él leía mucho antes.", "status": "correct"}, {"value": "Él leía mucho antes", "status": "correct"}, {"value": "Leía mucho antes.", "status": "correct"}, {"value": "Leía mucho antes", "status": "correct"}], "feedback": "*Antes leía mucho.*"}
  es.a2.unit94.lesson03.exercise01.elige_contraste: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Antes vivía en un pueblo, ahora vivo en una ciudad.", "distractors": ["Antes vivo en un pueblo, ahora vivía en una ciudad.", "Antes vivía en un pueblo, ahora vivía en una ciudad.", "Antes vivo en un pueblo, ahora vivo en una ciudad."], "accepted_answers": [{"value": "Antes vivía en un pueblo, ahora vivo en una ciudad.", "status": "correct"}], "feedback": "The past habit uses the imperfect (*vivía*); *ahora* uses the present (*vivo*)."}
  es.a2.unit94.lesson03.exercise02.elige_verano: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Cada verano iba al pueblo.", "distractors": ["Cada verano ir al pueblo.", "Cada verano ibas al pueblo.", "Cada verano íbamos al pueblo."], "accepted_answers": [{"value": "Cada verano iba al pueblo.", "status": "correct"}], "feedback": "*Cada verano* marks a habit; *yo* takes *iba*."}
  es.a2.unit94.lesson03.exercise03.une_tiempo: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "antes", "right": "before"}, {"left": "ahora", "right": "now"}, {"left": "de niño", "right": "as a boy"}, {"left": "de niña", "right": "as a girl"}, {"left": "siempre", "right": "always"}, {"left": "todos los días", "right": "every day"}, {"left": "a veces", "right": "sometimes"}, {"left": "cada verano", "right": "every summer"}], "status": "correct"}], "feedback": "These words help talk about habits."}
  es.a2.unit94.lesson03.exercise04.ordena_ninez: {"instruction": "Put the words in order to say 'As a boy I played every day.'", "correct_option": "De niño jugaba todos los días", "accepted_answers": [{"value": "De niño jugaba todos los días", "status": "correct"}], "feedback": "*De niño* sets the time; *jugaba todos los días* is the habit."}
  es.a2.unit94.lesson03.exercise05.completa_vivia: {"instruction": "Complete with the imperfect of *vivir*.", "correct_option": "vivía", "accepted_answers": [{"value": "vivía", "status": "correct"}], "feedback": "The past situation uses *vivía*; *ahora vivo* is the present."}
  es.a2.unit94.lesson03.exercise06.traduce_calle: {"instruction": "Translate into Spanish using the imperfect.", "accepted_answers": [{"value": "Antes jugaba en la calle todos los días.", "status": "correct"}, {"value": "Antes jugaba en la calle todos los días", "status": "correct"}, {"value": "Todos los días jugaba en la calle antes.", "status": "correct"}, {"value": "Todos los días jugaba en la calle antes", "status": "correct"}, {"value": "Antes, todos los días jugaba en la calle.", "status": "correct"}, {"value": "Antes, todos los días jugaba en la calle", "status": "correct"}, {"value": "Jugaba en la calle todos los días.", "status": "correct"}, {"value": "Jugaba en la calle todos los días", "status": "correct"}, {"value": "Todos los días jugaba en la calle.", "status": "correct"}, {"value": "Todos los días jugaba en la calle", "status": "correct"}], "feedback": "*Antes jugaba en la calle todos los días.*"}
  es.a2.unit94.lesson03.exercise07.escribe_antes_ahora: {"instruction": "Write exactly two sentences: the imperfect with *antes*, then the present tense with *ahora*.", "correct_option": "Antes vivía en un pueblo. Ahora vivo en una ciudad.", "accepted_answers": [{"value": "Antes vivía en un pueblo. Ahora vivo en una ciudad.", "status": "correct"}, {"value": "Antes vivía en un pueblo. Ahora vivo en una ciudad", "status": "correct"}], "feedback": "*Antes vivía en un pueblo. Ahora vivo en una ciudad.*"}
  es.a2.unit94.lesson04.exercise01.elige_casa: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mi casa era pequeña y tenía un jardín.", "distractors": ["Mi casa era pequeña y tenían un jardín.", "Mi casa eran pequeña y tenía un jardín.", "Mi casa era pequeña y tener un jardín."], "accepted_answers": [{"value": "Mi casa era pequeña y tenía un jardín.", "status": "correct"}], "feedback": "*Casa* is singular: *era* and *tenía*."}
  es.a2.unit94.lesson04.exercise02.elige_escuela: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "En la escuela leíamos y cantábamos.", "distractors": ["En la escuela leían y cantaban.", "En la escuela leía y cantaba.", "En la escuela leer y cantar."], "accepted_answers": [{"value": "En la escuela leíamos y cantábamos.", "status": "correct"}], "feedback": "*Nosotros* takes *leíamos* and *cantábamos*."}
  es.a2.unit94.lesson04.exercise03.une_casa: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Mi casa era pequeña.", "right": "My house was small."}, {"left": "Tenía un jardín.", "right": "It had a garden."}, {"left": "Comía pan con chocolate.", "right": "I used to eat bread with chocolate."}, {"left": "Veíamos la tele.", "right": "We used to watch TV."}, {"left": "Bebía leche.", "right": "I used to drink milk."}, {"left": "Ahora mi casa es grande.", "right": "Now my house is big."}, {"left": "Jugábamos en el jardín.", "right": "We used to play in the garden."}, {"left": "La cocina tenía una mesa.", "right": "The kitchen had a table."}], "status": "correct"}], "feedback": "These sentences describe the old house."}
  es.a2.unit94.lesson04.exercise04.ordena_tele: {"instruction": "Put the words in order to say 'Before, we used to watch TV at night.'", "correct_option": "Antes veíamos la tele por la noche", "accepted_answers": [{"value": "Antes veíamos la tele por la noche", "status": "correct"}], "feedback": "*Veíamos* is the *nosotros* form of *ver*."}
  es.a2.unit94.lesson04.exercise05.completa_era: {"instruction": "Complete with the imperfect of *ser*.", "correct_option": "era", "accepted_answers": [{"value": "era", "status": "correct"}], "feedback": "The past description uses *era*; *ahora* goes with *es*."}
  es.a2.unit94.lesson04.exercise06.traduce_jardin: {"instruction": "Translate into Spanish using the imperfect.", "accepted_answers": [{"value": "Mi casa tenía un jardín grande.", "status": "correct"}, {"value": "Mi casa tenía un jardín grande", "status": "correct"}], "feedback": "*Mi casa tenía un jardín grande.*"}
  es.a2.unit94.lesson04.exercise07.escribe_casa_ahora: {"instruction": "Write exactly two sentences: the imperfect with *antes*, then the present tense with *ahora*.", "correct_option": "Antes mi casa era pequeña. Ahora mi casa es grande.", "accepted_answers": [{"value": "Antes mi casa era pequeña. Ahora mi casa es grande.", "status": "correct"}, {"value": "Antes mi casa era pequeña. Ahora mi casa es grande", "status": "correct"}, {"value": "Antes mi casa era pequeña. Ahora es grande.", "status": "correct"}, {"value": "Antes mi casa era pequeña. Ahora es grande", "status": "correct"}, {"value": "Mi casa antes era pequeña. Ahora mi casa es grande.", "status": "correct"}, {"value": "Mi casa antes era pequeña. Ahora mi casa es grande", "status": "correct"}], "feedback": "*Antes mi casa era pequeña. Ahora mi casa es grande.*"}
  es.a2.unit94.lesson05.exercise01.lee_viaje: {"instruction": "Read Elena's message and choose the answer.", "correct_option": "By train.", "distractors": ["By bike.", "By bus.", "By car."], "accepted_answers": [{"value": "By train.", "status": "correct"}], "feedback": "*Íbamos al pueblo en tren.*"}
