  es.a1.unit11.lesson02.teach.que_talla_usas: {title: "Ask about size", gloss: "What size do you wear?", note: "*¿Qué talla usas?* is the standard way to ask someone's clothing size."}
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana: {title: "State your size", gloss: "I wear medium size.", note: "*Uso* (I use/wear) + *la talla* (the size) + the size word itself."}
  es.a1.unit11.lesson02.teach.me_queda_bien: {title: "Say it fits well", gloss: "It fits me well.", note: "*Me queda bien* uses *quedar* (to fit/suit) -- see the following grammar note."}
  es.a1.unit11.lesson02.teach.me_queda_mal: {title: "Say it fits badly", gloss: "It fits me badly.", note: "The opposite of *me queda bien*, swapping *bien* for *mal*."}
  es.a1.unit11.lesson02.teach.queda_note: {title: "Quedar bien/mal", gloss: "How quedar describes fit, not general quality.", note: "See the card's own text."}

  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal: {title: "Ask the price of the apron", gloss: "How much does this apron cost?", note: "Reuses unit07's *¿Cuánto cuesta?* pattern, now naming a specific item with *este* (this)."}
  es.a1.unit11.lesson03.teach.cuesta_doce: {title: "State the price", gloss: "It costs twelve.", note: "Reuses unit07's *Cuesta [number]* pattern directly."}
  es.a1.unit11.lesson03.teach.este_vs_esta_note: {title: "Este vs. esta", gloss: "How the demonstrative agrees with the noun's gender.", note: "See the card's own text."}

  es.a1.unit11.lesson04.teach.me_gusta_este: {title: "Say you like this one", gloss: "I like this one.", note: "*Este* here stands alone as a pronoun (\"this one\"), referring back to whichever item was just mentioned."}
  es.a1.unit11.lesson04.teach.voy_a_comprarlo: {title: "Say you'll buy it", gloss: "I'm going to buy it.", note: "*Voy a* + infinitive is the near-future construction; *comprarlo* attaches the object pronoun *lo* (it) to the infinitive *comprar*."}
  es.a1.unit11.lesson04.teach.compramos_dos: {title: "Say you're buying two", gloss: "We're buying two.", note: "*Compramos* (we buy/we're buying) is the *nosotros* form, used when Elena and Mateo decide together."}

  es.a1.unit11.lesson05.teach.precios_reading:
    title: "Reading a price list"
    gloss: "At this shop, the shirt costs fifteen, the pants cost twenty, the jacket costs thirty, and the shoes cost twenty-five. The apron is the cheapest: it only costs twelve."
    note: "A realistic shop price list using this unit's own five clothing nouns."
    glosses: {tienda: "shop", camisa: "shirt", cuesta: "costs (from costar)", quince: "fifteen", pantalón: "pants / trousers", veinte: "twenty", chaqueta: "jacket", treinta: "thirty", zapatos: "shoes", cuestan: "cost (from costar)", veinticinco: "twenty-five", delantal: "apron", barato: "cheap", solo: "only", doce: "twelve"}
  es.a1.unit11.lesson05.teach.el_mas_barato_note: {title: "El más barato (the cheapest)", gloss: "How el más + adjective forms a superlative.", note: "See the card's own text."}

  es.a1.unit11.lesson06.teach.line01: {title: "State the need", gloss: "Elena says they need aprons for the workshop.", note: "Reuses lesson01's *el delantal* and *el taller*, now pluralized as *delantales*."}
  es.a1.unit11.lesson06.teach.line02: {title: "Agree and suggest a shop", gloss: "Mateo agrees and suggests going to that shop.", note: "*Tienes razón* was already established in unit10; *esa tienda* (that shop) reuses *tienda* from unit10."}
  es.a1.unit11.lesson06.teach.line03: {title: "The clerk greets them", gloss: "The clerk greets them and offers to help.", note: "*¿Los ayudo?* (shall I help you [plural]?) is a standard shop-clerk greeting, addressing both Elena and Mateo together."}
  es.a1.unit11.lesson06.teach.line04: {title: "State what they're looking for", gloss: "Elena says yes, they're looking for aprons.", note: "*Buscamos* (we're looking for) is the *nosotros* form of *buscar*, first seen in unit08's places content."}
  es.a1.unit11.lesson06.teach.line05: {title: "The clerk shows options and asks size", gloss: "The clerk shows some aprons and asks their size.", note: "*¿Qué talla usan?* uses the plural *usan* (you all wear), addressing both of them, unlike lesson02's singular *usas*."}
  es.a1.unit11.lesson06.teach.line06: {title: "Both state their size", gloss: "Mateo says medium, and Elena says the same.", note: "*Yo también* (me too) reuses the agreement phrase already established in unit01."}
  es.a1.unit11.lesson06.teach.line07: {title: "Ask and state the price", gloss: "The clerk gives the price when asked.", note: "Direct reuse of lesson03's question-and-answer pair, now spoken by the clerk."}
  es.a1.unit11.lesson06.teach.line08: {title: "Confirm fit and decide to buy", gloss: "Elena says it fits well, she likes it, and she'll buy it.", note: "Combines lesson02's *me queda bien* with lesson04's *me gusta este* and *voy a comprarlo* in sequence."}
  es.a1.unit11.lesson06.teach.line09: {title: "Agree and buy two", gloss: "Mateo agrees it fits him too, and they buy two.", note: "*A mí también* (me too, emphatic) reuses the *también* agreement pattern with an added emphatic pronoun; *compramos dos* closes the scene."}

