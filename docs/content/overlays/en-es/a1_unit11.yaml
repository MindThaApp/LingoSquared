teaching:
  es.a1.unit11.lesson01.teach.la_camisa: {title: "The shirt", gloss: "the shirt", note: "*Camisa* is feminine.", example_gloss: "I like this shirt."}
  es.a1.unit11.lesson01.teach.el_pantalon: {title: "The pants", gloss: "the pants", note: "*Pantalón* is grammatically singular in Spanish even though English \"pants\" is plural.", example_gloss: "The pants cost twenty."}
