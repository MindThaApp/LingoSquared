answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit99.se_puede: {"title": "Can I? Is It Allowed?", "description": "Ask whether something is allowed and say what you must do, what is forbidden and what is not necessary, with puedo, se puede, tener que, hay que, no hace falta and prohibido."}
lessons:
  es.a2.unit99.lesson01.puedo_puedes_puede: {"title": "Can I Come In?"}
  es.a2.unit99.lesson02.se_puede_no_se_puede: {"title": "You Can, You Can't"}
  es.a2.unit99.lesson03.tengo_que_hay_que: {"title": "I Have To, You Have To"}
  es.a2.unit99.lesson04.prohibido_o_no_hace_falta: {"title": "Forbidden or Not Necessary"}
  es.a2.unit99.lesson05.reglas_de_la_biblioteca: {"title": "The Library Rules"}
  es.a2.unit99.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit99.lesson01.teach.gn_poder: {"title": "Poder: can", "gloss": "I can, you can, he can, she can, we can, they can", "note": "*Poder* changes its stem: *puedo*, *puedes*, *puede*, *pueden*, but *podemos* keeps *pod-*. Put *poder* before an infinitive to say what someone is able or allowed to do."}
  es.a2.unit99.lesson01.teach.gn_pedir: {"title": "Asking permission", "gloss": "Can I come in? Can I go out? Can I come through?", "note": "*¿Puedo...?* + infinitive asks whether the other person allows you to do something. The infinitive never changes."}
  es.a2.unit99.lesson01.teach.palabras: {"title": "Key words", "gloss": "to go in / to go out / to open / to use / please / now", "note": "*Por favor* makes a request polite. It can come at the end or at the start.", "example_gloss": ["Can I go out now?", "Can you open the door, please?", "Mateo can use the phone.", "Elena can come in now."]}
  es.a2.unit99.lesson01.teach.gn_otro: {"title": "Asking about someone else", "gloss": "Can you open the door? Can Elena come in?", "note": "With *puedes* you ask a friend to do something. With a name, the verb is *puede*, and the name often comes after the infinitive."}
  es.a2.unit99.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Can I come in, please? Can you open the door? Yes, of course."}
  es.a2.unit99.lesson02.teach.gn_se_puede: {"title": "Se puede: it is allowed", "gloss": "You can go in. You can't smoke.", "note": "*Se puede* + infinitive says what is allowed in general, with no particular person. *No se puede* says it is not allowed."}
  es.a2.unit99.lesson02.teach.gn_pregunta: {"title": "Asking if it is allowed", "gloss": "Can you park here? Yes, you can. No, you can't.", "note": "To ask whether something is allowed, use *¿Se puede...?*. A short answer repeats *se puede*."}
  es.a2.unit99.lesson02.teach.palabras: {"title": "Places and actions", "gloss": "to smoke / to park / to take a photo / to use the phone / here", "note": "*Se puede* has the same form for every action, so you only learn the infinitive.", "example_gloss": ["You can't smoke in the museum.", "Can you park here, please?", "You can't use the phone in the library.", "Is it allowed to take a photo in the park?"]}
  es.a2.unit99.lesson02.teach.gn_lugares: {"title": "Starting with the place", "gloss": "You can go into the museum. You can't smoke in the library.", "note": "You can start with the place. The rule that follows does not change."}
  es.a2.unit99.lesson02.teach.frases: {"title": "Three sentences", "gloss": "Can you park here? You can't smoke here. Yes, you can."}
  es.a2.unit99.lesson03.teach.gn_tener_que: {"title": "Tener que: have to", "gloss": "I have to, you have to, he has to, she has to, we have to, they have to", "note": "*Tener que* + infinitive says what a person must do. *Tener* changes with the subject; *que* and the infinitive do not."}
  es.a2.unit99.lesson03.teach.gn_personal: {"title": "A personal duty", "gloss": "I have to leave. Elena has to work.", "note": "With *tener que* the subject matters: *tengo* for *yo*, *tiene* for a single person."}
  es.a2.unit99.lesson03.teach.palabras: {"title": "Duties", "gloss": "to work / to wait / to pay / to arrive early / the ticket", "note": "*Esperar el tren* means to wait for the train: Spanish needs no word for *for*.", "example_gloss": ["Mateo has to work in the office.", "Elena has to wait for the train.", "We have to pay for the ticket.", "You have to arrive early."]}
  es.a2.unit99.lesson03.teach.gn_hay_que: {"title": "Hay que: a general rule", "gloss": "One has to pay for the ticket. I have to pay for the ticket.", "note": "*Hay que* + infinitive is a rule for everyone and never changes. *Tengo que* names one person who has to do it."}
  es.a2.unit99.lesson03.teach.frases: {"title": "Three sentences", "gloss": "I have to leave. You have to wait. One has to pay."}
  es.a2.unit99.lesson04.teach.gn_prohibido: {"title": "No se puede: forbidden", "gloss": "You can't go out. You can't park here.", "note": "*No se puede* means it is forbidden or not allowed. The next cards show that not every *no* means this."}
  es.a2.unit99.lesson04.teach.gn_no_hace_falta: {"title": "Not necessary", "gloss": "There is no need to pay. You don't have to pay. One doesn't have to pay.", "note": "*No hace falta*, *no tienes que* and *no hay que* mean it is not necessary: it is allowed, you just do not need to. Do not confuse them with *no se puede*."}
  es.a2.unit99.lesson04.teach.gn_cartel: {"title": "On signs", "gloss": "No smoking. Parking is forbidden.", "note": "On signs Spanish often uses just *Prohibido* + infinitive. In a full sentence, add *está*."}
  es.a2.unit99.lesson04.teach.gn_contraste: {"title": "Three ideas, one verb", "gloss": "You have to go out. There is no need to go out. You are not allowed to go out.", "note": "The same verb gives three ideas: it must be done, it is not necessary, it is forbidden."}
  es.a2.unit99.lesson04.teach.palabras: {"title": "Signs and rules", "gloss": "the sign / forbidden / in order to / the park", "note": "*Para* + infinitive means in order to: *para entrar* is to go in.", "example_gloss": ["There is a sign in the park.", "Parking is forbidden in the park.", "You don't need to pay to go in.", "Mateo, you don't have to wait."]}
  es.a2.unit99.lesson04.teach.frases: {"title": "Three sentences", "gloss": "No smoking. There is no need to pay. You don't have to wait."}
  es.a2.unit99.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "the book / to speak / quietly / to eat / tomorrow", "note": "*Hablar bajo* means to speak quietly.", "example_gloss": ["Elena has a book.", "Mateo can't talk now.", "You can eat in the office.", "Tomorrow I have to work."]}
  es.a2.unit99.lesson05.teach.gn_repaso: {"title": "Rules in the message", "gloss": "You have to speak very quietly. You can't eat. Using the phone is forbidden. There is no need to pay.", "note": "Look for the four ways the message talks about rules: must, not allowed, forbidden, not necessary."}
  es.a2.unit99.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. I am in the library with a book. Here you have to speak very quietly. You can't eat. Using the phone is forbidden. There is no need to pay. Can you come tomorrow?", "note": "Find the rule in each sentence: must, not allowed, forbidden or not necessary.", "glosses": {"libro": "book", "bajo": "quietly", "mañana": "tomorrow", "hablar": "to speak"}}
  es.a2.unit99.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. Can I go to your office with my dog tomorrow?"}
  es.a2.unit99.lesson06.teach.d2: {"title": "Mateo says no", "gloss": "Mateo: Hi, Elena. I'm sorry, but dogs aren't allowed in the building."}
  es.a2.unit99.lesson06.teach.d3: {"title": "Elena asks about the library", "gloss": "Elena: Oh, and in the library? Can you go in with a dog?"}
  es.a2.unit99.lesson06.teach.d4: {"title": "Mateo explains", "gloss": "Mateo: In the library you can go in, but you have to speak very quietly."}
  es.a2.unit99.lesson06.teach.d5: {"title": "Elena asks about paying", "gloss": "Elena: OK. Do you have to pay?"}
  es.a2.unit99.lesson06.teach.d6: {"title": "Mateo answers", "gloss": "Mateo: No, there is no need to pay. See you tomorrow, Elena!"}
exercises:
  es.a2.unit99.lesson01.exercise01.elige_entrar: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Puedo entrar, por favor?", "distractors": ["¿Puedes entrar, por favor?", "¿Podemos entrar, por favor?", "¿Pueden entrar, por favor?"], "accepted_answers": [{"value": "¿Puedo entrar, por favor?", "status": "correct"}], "feedback": "*Puedo* is the *yo* form: you ask about yourself."}
  es.a2.unit99.lesson01.exercise02.elige_abrir: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Puedes abrir la puerta?", "distractors": ["¿Puedo abrir la puerta?", "¿Podemos abrir la puerta?", "¿Puede Elena abrir la puerta?"], "accepted_answers": [{"value": "¿Puedes abrir la puerta?", "status": "correct"}], "feedback": "To ask a friend, use *puedes*."}
  es.a2.unit99.lesson01.exercise03.une_formas: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "yo puedo", "right": "I can"}, {"left": "tú puedes", "right": "you can"}, {"left": "ella puede", "right": "she can"}, {"left": "nosotros podemos", "right": "we can"}, {"left": "ellos pueden", "right": "they can"}, {"left": "¿Puedo entrar?", "right": "Can I come in?"}, {"left": "por favor", "right": "please"}], "status": "correct"}], "feedback": "Each subject has its own form of *poder*."}
  es.a2.unit99.lesson01.exercise04.ordena_movil: {"instruction": "Put the words in order to say 'Can I use the phone, please?'", "correct_option": "Puedo usar el móvil por favor", "accepted_answers": [{"value": "Puedo usar el móvil por favor", "status": "correct"}], "feedback": "The question starts with *puedo* + infinitive."}
  es.a2.unit99.lesson01.exercise05.completa_puede: {"instruction": "Complete with the correct form of *poder*.", "correct_option": "puede", "accepted_answers": [{"value": "puede", "status": "correct"}], "feedback": "*Mateo* is a single person, so the form is *puede*."}
  es.a2.unit99.lesson01.exercise06.traduce_entrar: {"instruction": "Translate into Spanish. Use *puedo* + infinitive.", "accepted_answers": [{"value": "¿Puedo entrar, por favor?", "status": "correct"}, {"value": "¿Puedo entrar, por favor", "status": "correct"}, {"value": "¿Puedo entrar por favor?", "status": "correct"}, {"value": "¿Puedo entrar por favor", "status": "correct"}, {"value": "Por favor, ¿puedo entrar?", "status": "correct"}, {"value": "Por favor, ¿puedo entrar", "status": "correct"}, {"value": "¿Puedo pasar, por favor?", "status": "correct"}, {"value": "¿Puedo pasar, por favor", "status": "correct"}, {"value": "¿Puedo pasar por favor?", "status": "correct"}, {"value": "¿Puedo pasar por favor", "status": "correct"}, {"value": "Por favor, ¿puedo pasar?", "status": "correct"}, {"value": "Por favor, ¿puedo pasar", "status": "correct"}], "feedback": "*¿Puedo entrar, por favor?* asks permission to come in."}
  es.a2.unit99.lesson01.exercise07.escribe_movil: {"instruction": "Write the question as Elena, using *puedo* + *usar*.", "correct_option": "¿Puedo usar el móvil, por favor?", "accepted_answers": [{"value": "¿Puedo usar el móvil, por favor?", "status": "correct"}, {"value": "¿Puedo usar el móvil, por favor", "status": "correct"}, {"value": "¿Puedo usar el móvil por favor?", "status": "correct"}, {"value": "¿Puedo usar el móvil por favor", "status": "correct"}, {"value": "Por favor, ¿puedo usar el móvil?", "status": "correct"}, {"value": "Por favor, ¿puedo usar el móvil", "status": "correct"}], "feedback": "*¿Puedo usar el móvil, por favor?*"}
  es.a2.unit99.lesson02.exercise01.elige_fumar: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Aquí no se puede fumar.", "distractors": ["Aquí se puede fumar.", "Aquí no se puede aparcar.", "Aquí no se puede entrar."], "accepted_answers": [{"value": "Aquí no se puede fumar.", "status": "correct"}], "feedback": "*No se puede* + *fumar*: smoking is not allowed."}
  es.a2.unit99.lesson02.exercise02.elige_foto: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Se puede sacar una foto aquí?", "distractors": ["¿Se puede aparcar aquí?", "¿Se puede fumar aquí?", "¿Se puede entrar aquí?"], "accepted_answers": [{"value": "¿Se puede sacar una foto aquí?", "status": "correct"}], "feedback": "*Sacar una foto* means to take a photo."}
  es.a2.unit99.lesson02.exercise03.une_palabras: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "fumar", "right": "to smoke"}, {"left": "aparcar", "right": "to park"}, {"left": "entrar", "right": "to go in"}, {"left": "sacar una foto", "right": "to take a photo"}, {"left": "usar el móvil", "right": "to use the phone"}, {"left": "aquí", "right": "here"}, {"left": "No se puede.", "right": "It is not allowed."}, {"left": "¿Se puede?", "right": "Is it allowed?"}], "status": "correct"}], "feedback": "Learn the infinitive: it goes after *se puede*."}
  es.a2.unit99.lesson02.exercise04.ordena_biblioteca: {"instruction": "Put the words in order to say 'You can't use the phone in the library.'", "correct_option": "En la biblioteca no se puede usar el móvil", "accepted_answers": [{"value": "En la biblioteca no se puede usar el móvil", "status": "correct"}], "feedback": "*No se puede* comes before the infinitive."}
  es.a2.unit99.lesson02.exercise05.completa_se: {"instruction": "Complete the sentence about what is allowed in general.", "correct_option": "se", "accepted_answers": [{"value": "se", "status": "correct"}], "feedback": "*No se puede fumar* is the impersonal form."}
  es.a2.unit99.lesson02.exercise06.traduce_aparcar: {"instruction": "Translate into Spanish. Use *no se puede*.", "accepted_answers": [{"value": "No se puede aparcar aquí.", "status": "correct"}, {"value": "No se puede aparcar aquí", "status": "correct"}, {"value": "Aquí no se puede aparcar.", "status": "correct"}, {"value": "Aquí no se puede aparcar", "status": "correct"}], "feedback": "*No se puede aparcar aquí.*"}
  es.a2.unit99.lesson02.exercise07.escribe_biblioteca: {"instruction": "Write the question using *se puede*.", "correct_option": "¿Se puede usar el móvil en la biblioteca?", "accepted_answers": [{"value": "¿Se puede usar el móvil en la biblioteca?", "status": "correct"}, {"value": "¿Se puede usar el móvil en la biblioteca", "status": "correct"}, {"value": "¿En la biblioteca se puede usar el móvil?", "status": "correct"}, {"value": "¿En la biblioteca se puede usar el móvil", "status": "correct"}, {"value": "¿Se puede usar el móvil aquí?", "status": "correct"}, {"value": "¿Se puede usar el móvil aquí", "status": "correct"}], "feedback": "*¿Se puede usar el móvil en la biblioteca?*"}
  es.a2.unit99.lesson03.exercise01.elige_esperar: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena tiene que esperar el tren.", "distractors": ["Elena tengo que esperar el tren.", "Elena tienes que esperar el tren.", "Elena tienen que esperar el tren."], "accepted_answers": [{"value": "Elena tiene que esperar el tren.", "status": "correct"}], "feedback": "*Elena* is a single person: *tiene que*."}
  es.a2.unit99.lesson03.exercise02.elige_hay_que: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Hay que pagar el billete.", "distractors": ["Tengo que pagar el billete.", "Tenemos que pagar el billete.", "Hay que esperar el billete."], "accepted_answers": [{"value": "Hay que pagar el billete.", "status": "correct"}], "feedback": "For a rule that applies to everyone, use *hay que*."}
  es.a2.unit99.lesson03.exercise03.une_obligacion: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "tengo que", "right": "I have to"}, {"left": "tienes que", "right": "you have to"}, {"left": "tiene que", "right": "he or she has to"}, {"left": "tenemos que", "right": "we have to"}, {"left": "tienen que", "right": "they have to"}, {"left": "hay que", "right": "one has to"}, {"left": "esperar", "right": "to wait"}, {"left": "pagar", "right": "to pay"}], "status": "correct"}], "feedback": "*Tener que* changes with the subject; *hay que* does not."}
  es.a2.unit99.lesson03.exercise04.ordena_trabajar: {"instruction": "Put the words in order to say 'Mateo has to work in the office.'", "correct_option": "Mateo tiene que trabajar en la oficina", "accepted_answers": [{"value": "Mateo tiene que trabajar en la oficina", "status": "correct"}], "feedback": "*Tiene que* comes before the infinitive."}
  es.a2.unit99.lesson03.exercise05.completa_tenemos: {"instruction": "Complete with the correct form of *tener*.", "correct_option": "tenemos", "accepted_answers": [{"value": "tenemos", "status": "correct"}], "feedback": "*Nosotros* takes *tenemos*."}
  es.a2.unit99.lesson03.exercise06.traduce_esperar: {"instruction": "Translate into Spanish. Use *tener que*.", "accepted_answers": [{"value": "Tenemos que esperar el tren.", "status": "correct"}, {"value": "Tenemos que esperar el tren", "status": "correct"}, {"value": "Nosotros tenemos que esperar el tren.", "status": "correct"}, {"value": "Nosotros tenemos que esperar el tren", "status": "correct"}], "feedback": "*Tenemos que esperar el tren.*"}
  es.a2.unit99.lesson03.exercise07.escribe_temprano: {"instruction": "Write the sentence using *hay que*.", "correct_option": "Hay que llegar temprano.", "accepted_answers": [{"value": "Hay que llegar temprano.", "status": "correct"}, {"value": "Hay que llegar temprano", "status": "correct"}], "feedback": "*Hay que llegar temprano.*"}
  es.a2.unit99.lesson04.exercise01.elige_no_tienes: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "No tienes que pagar.", "distractors": ["No se puede pagar.", "Hay que pagar.", "Prohibido pagar."], "accepted_answers": [{"value": "No tienes que pagar.", "status": "correct"}], "feedback": "*No tienes que* means it is not necessary; *no se puede* means forbidden."}
  es.a2.unit99.lesson04.exercise02.elige_prohibido: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Está prohibido aparcar aquí.", "distractors": ["No hace falta aparcar aquí.", "Hay que aparcar aquí.", "No tienes que aparcar aquí."], "accepted_answers": [{"value": "Está prohibido aparcar aquí.", "status": "correct"}], "feedback": "*Está prohibido* means forbidden."}
  es.a2.unit99.lesson04.exercise03.une_contraste: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "No se puede salir.", "right": "It is not allowed to go out."}, {"left": "No hace falta salir.", "right": "It isn't necessary to go out."}, {"left": "Hay que salir.", "right": "You have to go out."}, {"left": "No tienes que salir.", "right": "You don't have to go out."}, {"left": "Prohibido fumar", "right": "No smoking"}, {"left": "Está prohibido aparcar.", "right": "Parking is forbidden."}], "status": "correct"}], "feedback": "Forbidden, not necessary and necessary are three different ideas."}
  es.a2.unit99.lesson04.exercise04.ordena_entrar: {"instruction": "Put the words in order to say 'You don't need to pay to go in.'", "correct_option": "Para entrar no hace falta pagar", "accepted_answers": [{"value": "Para entrar no hace falta pagar", "status": "correct"}], "feedback": "*No hace falta* comes before the infinitive."}
  es.a2.unit99.lesson04.exercise05.completa_falta: {"instruction": "Complete the expression for 'there is no need'.", "correct_option": "falta", "accepted_answers": [{"value": "falta", "status": "correct"}], "feedback": "*No hace falta* + infinitive: it is not necessary."}
  es.a2.unit99.lesson04.exercise06.traduce_no_tienes: {"instruction": "Translate into Spanish. Use *no tienes que*.", "accepted_answers": [{"value": "No tienes que esperar.", "status": "correct"}, {"value": "No tienes que esperar", "status": "correct"}, {"value": "Tú no tienes que esperar.", "status": "correct"}, {"value": "Tú no tienes que esperar", "status": "correct"}, {"value": "No hace falta esperar.", "status": "correct"}, {"value": "No hace falta esperar", "status": "correct"}, {"value": "No hay que esperar.", "status": "correct"}, {"value": "No hay que esperar", "status": "correct"}], "feedback": "*No tienes que esperar* = it is not necessary for you."}
  es.a2.unit99.lesson04.exercise07.escribe_cartel: {"instruction": "Write the short sign text with *prohibido*.", "correct_option": "Prohibido aparcar.", "accepted_answers": [{"value": "Prohibido aparcar.", "status": "correct"}, {"value": "Prohibido aparcar", "status": "correct"}, {"value": "Está prohibido aparcar.", "status": "correct"}, {"value": "Está prohibido aparcar", "status": "correct"}], "feedback": "*Prohibido aparcar.* is the usual sign."}
  es.a2.unit99.lesson05.exercise01.lee_donde: {"instruction": "Read Elena's message and choose the answer.", "correct_option": "In the library.", "distractors": ["In the office.", "At the museum.", "At home."], "accepted_answers": [{"value": "In the library.", "status": "correct"}], "feedback": "*Estoy en la biblioteca.*"}
  es.a2.unit99.lesson05.exercise02.lee_prohibido: {"instruction": "Read Elena's message and choose the answer.", "correct_option": "Using the phone.", "distractors": ["Speaking quietly.", "Paying.", "Reading a book."], "accepted_answers": [{"value": "Using the phone.", "status": "correct"}], "feedback": "*Está prohibido usar el móvil.*"}
  es.a2.unit99.lesson05.exercise03.une_mensaje: {"instruction": "Match each line from the message to its meaning.", "accepted_answers": [{"value": [{"left": "Hola, Mateo.", "right": "Hi, Mateo."}, {"left": "Estoy en la biblioteca.", "right": "I am in the library."}, {"left": "Hay que hablar muy bajo.", "right": "You have to speak very quietly."}, {"left": "No se puede comer.", "right": "Eating is not allowed."}, {"left": "Está prohibido usar el móvil.", "right": "Using the phone is forbidden."}, {"left": "No hace falta pagar.", "right": "There is no need to pay."}, {"left": "¿Puedes venir mañana?", "right": "Can you come tomorrow?"}], "status": "correct"}], "feedback": "These lines come from Elena's message."}
  es.a2.unit99.lesson05.exercise04.ordena_hablar: {"instruction": "Put the words in order to say 'Here you have to speak very quietly.'", "correct_option": "Aquí hay que hablar muy bajo", "accepted_answers": [{"value": "Aquí hay que hablar muy bajo", "status": "correct"}], "feedback": "*Hay que* comes before the infinitive."}
