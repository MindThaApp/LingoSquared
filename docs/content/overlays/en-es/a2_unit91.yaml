teaching:
  es.a2.unit91.lesson01.teach.las_vacaciones_las:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Las vacaciones* is almost always plural in Spanish. *Las vacaciones de verano* is the long summer break.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  es.a2.unit91.lesson01.teach.la_semana_que:
    title: When something happens
    gloss: next week / next year / soon
    note: '*Semana* is feminine, so *la semana que viene*. *Año* is masculine, so *el año que viene*. *Pronto* means ''soon''.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Belgium.
    - Soon I have a holiday.
  es.a2.unit91.lesson01.teach.viajar_reservar_quedarse:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: 'These are infinitives. *Reservar* is the verb for booking a hotel or a table. *Quedarse* means ''to stay'' and always has a pronoun: *me quedo*, *nos quedamos*.'
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  es.a2.unit91.lesson01.teach.el_hotel_el:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*El hotel* and *el camping* are both masculine. You sleep *en un hotel* and *en el camping*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  es.a2.unit91.lesson01.teach.que_vas_a:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Here *vas a* works as a helper: *vas a hacer* = you are going to do. The infinitive *hacer* follows directly.'
  es.a2.unit91.lesson01.teach.en_agosto_voy:
    title: 'Near plans: ir a + infinitive'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'To say what you are going to do, use *ir a* + infinitive: *Voy a reservar un hotel*. Only *ir* changes (*voy, vas, va, vamos*); the infinitive stays the same. A time expression can come first: *La semana que viene voy a reservar un hotel*.'
  es.a2.unit91.lesson01.teach.voy_a_reservar:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  es.a2.unit91.lesson02.teach.hacer_un_curso:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Hacer un curso* is the usual phrase for taking a course. *Mudarse* means moving to a new home and takes a pronoun: *me mudo*, *pienso mudarme*.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  es.a2.unit91.lesson02.teach.mas_tarde_dentro:
    title: Further ahead
    gloss: later / in a month
    note: '*Dentro de un mes* means ''a month from now''. It works with other periods too: *dentro de una semana*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  es.a2.unit91.lesson02.teach.dentro_de_un:
    title: A course that starts
    gloss: In a month my course starts.
  es.a2.unit91.lesson02.teach.pienso_hacer_un:
    title: 'Intentions: pienso + infinitive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *pienso* followed directly by the infinitive: *Pienso hacer un curso*. No extra word is needed between them. This is for things you want to do, not for fixed arrangements.'
  es.a2.unit91.lesson02.teach.pienso_mudarme:
    title: Planning to move house
    gloss: I plan to move house.
  es.a2.unit91.lesson02.teach.pienso_ahorrar:
    title: Planning to save
    gloss: I plan to save money.
  es.a2.unit91.lesson02.teach.manana_voy_al:
    title: Voy a or pienso?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use *voy a* for the near, settled future: *Mañana voy al mercado*. Use *pienso* for an intention that is further away or less certain: *Más tarde pienso mudarme*.'
  es.a2.unit91.lesson03.teach.a_lo_mejor:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*A lo mejor* expresses doubt. *Seguro* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  es.a2.unit91.lesson03.teach.este_ano_este:
    title: This year, this summer
    gloss: this year / this summer
    note: '*Año* and *verano* are both masculine, so *este año* and *este verano*.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  es.a2.unit91.lesson03.teach.este_verano_me:
    title: Staying at home
    gloss: This summer I am staying at home.
  es.a2.unit91.lesson03.teach.manana_voy_a:
    title: A lo mejor and the verb
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: '*A lo mejor* is followed by an ordinary present-tense verb: *A lo mejor voy al cine más tarde*. You do not need the subject pronoun *yo*. The same pattern works after a time word: *Mañana voy a trabajar*.'
  es.a2.unit91.lesson03.teach.no_voy_de:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *no* directly before the verb: *No voy de vacaciones*. With *pienso*, *no* also goes before it: *No pienso mudarme*.'
  es.a2.unit91.lesson04.teach.con_quien_cuanto:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Con quién* asks about a person you do something with. *Cuánto tiempo* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  es.a2.unit91.lesson04.teach.adonde_vas:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Adónde* asks about a direction and is written as one word with an accent: *¿Adónde vas?*'
  es.a2.unit91.lesson04.teach.con_quien_vas:
    title: Who with?
    gloss: Who are you going on holiday with?
  es.a2.unit91.lesson04.teach.cuanto_tiempo_te:
    title: How long?
    gloss: How long are you staying there?
  es.a2.unit91.lesson04.teach.voy_con_mi:
    title: Answering
    gloss: I am going with my sister.
  es.a2.unit91.lesson04.teach.una_semana_dos:
    title: Weeks
    gloss: one week / two weeks
    note: The plural of *semana* is *semanas*.
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  es.a2.unit91.lesson04.teach.adonde_vas_con:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first, then the verb: *¿Adónde vas?* *¿Con quién vas?* Question words carry an accent in Spanish. With *vas a* + infinitive: *¿Cuánto tiempo vas a quedarte?*'
  es.a2.unit91.lesson05.teach.hola_elena_pronto:
    title: A message from Nora
    gloss: Hi Elena! Soon I have a holiday. In August I am going to Belgium with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Nora describes near plans with *ir a* and a longer-term intention with *pienso*. Notice that the infinitive follows directly: *quedarnos*, *hacer*.'
    glosses:
      pronto: soon
      vacaciones: holiday
      agosto: August
      hermana: sister
      a: to
      bélgica: Belgium
      hotel: hotel
      quedarnos: to stay
      después: after that
      padres: parents
      días: days
      viene: next
      año: year
      pienso: I plan to (pienso + infinitive)
      curso: course
      hacer: to follow
      mejor: maybe
      mudo: to move house
      entonces: then
      también: also
  es.a2.unit91.lesson06.teach.hola_mateo_ya:
    title: Elena asks Mateo about his plans
    gloss: 'Elena: Hi Mateo! Do you have plans for the summer holiday yet?'
  es.a2.unit91.lesson06.teach.si_en_agosto:
    title: Mateo answers
    gloss: 'Mateo: Yes! In August I am going to Germany. I am going to book a hotel.'
  es.a2.unit91.lesson06.teach.que_bien_con:
    title: Elena asks who he is going with
    gloss: 'Elena: Nice! Who are you going with?'
  es.a2.unit91.lesson06.teach.con_mi_tio:
    title: Mateo says who and how long
    gloss: 'Mateo: With my uncle. We are going to stay for a week.'
  es.a2.unit91.lesson06.teach.y_mas_adelante:
    title: Elena asks about later
    gloss: 'Elena: And later? What do you plan to do?'
  es.a2.unit91.lesson06.teach.el_ano_que:
    title: Mateo names an intention and asks back
    gloss: 'Mateo: Next year I plan to take a course. And you?'
  es.a2.unit91.lesson06.teach.en_julio_voy:
    title: Elena answers
    gloss: 'Elena: In July I am going to work. Maybe I will go to my parents'' after that.'
