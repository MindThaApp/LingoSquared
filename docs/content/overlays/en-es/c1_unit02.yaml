course:
  title: Spanish C1
  description: >-
    Advanced Spanish implicit meaning: grasp and convey inference,
    implication, irony, and understatement -- recognizing and producing
    what is meant beyond what is literally said.

units:
  es.c1.unit02.leer_entre_lineas:
    title: "Reading between the lines"
    description: "Recognize and produce implicit meaning -- irony, understatement, and implication -- distinguishing the literal words from the intended stance."

lessons:
  es.c1.unit02.lesson01.lo_dicho_y_lo_querido:
    title: "What is said and what is meant"
  es.c1.unit02.lesson02.la_ironia:
    title: "Irony"
  es.c1.unit02.lesson03.la_atenuacion:
    title: "Understatement"
  es.c1.unit02.lesson04.la_implicacion:
    title: "Implication"
  es.c1.unit02.lesson05.un_mensaje_entre_lineas:
    title: "A message between the lines"
  es.c1.unit02.lesson06.decirlo_sin_decirlo:
    title: "Saying it without saying it"

teaching:
  es.c1.unit02.lesson01.teach.leer_entre_lineas:
    title: "to read between the lines"
    gloss: "to read between the lines"
    note: "*Leer entre líneas* means to grasp the unstated meaning behind the literal words."
  es.c1.unit02.lesson01.teach.querer_decir:
    title: "to mean"
    gloss: "to mean"
    note: "*Querer decir* names the intended meaning as distinct from the literal words."
    example_gloss: "When he says that, he means something else."
  es.c1.unit02.lesson01.teach.en_realidad:
    title: "actually"
    gloss: "actually / in reality"
    note: "*En realidad* introduces what is really true, often correcting the surface reading."
    example_gloss: "In reality, he doesn't like it at all."
  es.c1.unit02.lesson01.teach.el_tono:
    title: "the tone"
    gloss: "the tone"
    note: "*El tono* is the prosodic cue that reverses or qualifies the literal words."
    example_gloss: "The tone tells you whether he is serious."
  es.c1.unit02.lesson01.teach.lo_dicho:
    title: "The core idea"
    gloss: "You have to read between the lines: what is said is not always what is meant."
    note: "This is the unit's central distinction: *lo que se dice* (the literal words) versus *lo que se quiere decir* (the intended meaning)."

  es.c1.unit02.lesson02.teach.pues_que_bien:
    title: "well, great"
    gloss: "well, great (said ironically)"
    note: "*Pues qué bien* sounds positive but means the opposite: the news is actually bad."
  es.c1.unit02.lesson02.teach.menuda_idea:
    title: "some idea"
    gloss: "some idea (said ironically)"
    note: "*Menuda idea* ironically calls a terrible idea a notable one."
  es.c1.unit02.lesson02.teach.claro_que_si:
    title: "of course"
    gloss: "of course (said ironically)"
    note: "*Claro que sí* can mean 'of course' literally, but with an ironic tone it means 'as if' -- the speaker does not believe it."
  es.c1.unit02.lesson02.teach.la_ironia:
    title: "irony"
    gloss: "irony"
    note: "*La ironía* says the opposite of what is meant, and the tone reveals it."
    example_gloss: "With irony, you say the opposite of what you think."
  es.c1.unit02.lesson02.teach.lo_contrario:
    title: "the opposite"
    gloss: "the opposite"
    note: "*Lo contrario* is what irony actually means under the surface."
    example_gloss: "In irony, one says the opposite of what one means."
  es.c1.unit02.lesson02.teach.ironia_note:
    title: "How irony works"
    gloss: "In irony, one says the opposite of what one means; the tone changes everything."
    note: "The literal words are positive; the tone and context flip them."

  es.c1.unit02.lesson03.teach.no_esta_mal:
    title: "it's not bad"
    gloss: "it's not bad (lukewarm approval)"
    note: "*No está mal* understates: it gives lukewarm approval -- acceptable, but nothing special -- without praising."
  es.c1.unit02.lesson03.teach.podria_ser_peor:
    title: "it could be worse"
    gloss: "it could be worse (understated criticism)"
    note: "*Podría ser peor* concedes it is bad but tolerable -- a way to criticize without complaint."
  es.c1.unit02.lesson03.teach.no_es_lo_mejor:
    title: "it's not the best"
    gloss: "it's not the best (understated criticism)"
    note: "*No es lo mejor* says far less than 'it's bad' while meaning it."
  es.c1.unit02.lesson03.teach.regular:
    title: "so-so"
    gloss: "so-so / mediocre"
    note: "*Regular* is a classic Spanish understatement meaning 'okay at best'. Note: when judging quality it means 'so-so', not 'regular' in the English sense."
    example_gloss: "The new space is, let's say, so-so."
  es.c1.unit02.lesson03.teach.la_atenuacion:
    title: "understatement"
    gloss: "understatement"
    note: "*La atenuación* softens a negative judgement so it can be said politely."
    example_gloss: "With understatement, a negative opinion is softened."
  es.c1.unit02.lesson03.teach.suavizar:
    title: "to soften"
    gloss: "to soften"
    note: "*Suavizar* means to tone something down -- the mechanism behind atenuación."
    example_gloss: "He softens what he thinks so as not to offend."
  es.c1.unit02.lesson03.teach.atenuacion_note:
    title: "How understatement works"
    gloss: "Understatement says little so as not to say something bad: it's not bad, it could be worse."
    note: "The negative judgement is recoverable from the understated surface."

  es.c1.unit02.lesson04.teach.ya_veremos:
    title: "we'll see"
    gloss: "we'll see (implies doubt)"
    note: "*Ya veremos* withholds agreement and implies the speaker doubts the promised outcome."
  es.c1.unit02.lesson04.teach.eso_dice:
    title: "so he says"
    gloss: "so he says (implies disbelief)"
    note: "*Eso dice* reports the words while implying the speaker does not believe them."
  es.c1.unit02.lesson04.teach.si_tu_lo_dices:
    title: "if you say so"
    gloss: "if you say so (implies doubt)"
    note: "*Si tú lo dices* concedes politely while signalling the speaker disagrees."
  es.c1.unit02.lesson04.teach.lo_que_se_sobreentiende:
    title: "what is implied"
    gloss: "what is implied"
    note: "*Lo que se sobreentiende* is the unstated meaning both speakers recover from context."
    example_gloss: "What is implied is not said in so many words."
  es.c1.unit02.lesson04.teach.la_implicacion:
    title: "the implication"
    gloss: "the implication"
    note: "*La implicación* is the suggested meaning carried without being stated."
    example_gloss: "The implication is that he doesn't trust the plan."
  es.c1.unit02.lesson04.teach.implicacion_note:
    title: "How implication works"
    gloss: "Implication suggests without stating: we'll see, so he says, if you say so."
    note: "The speaker never asserts; the listener infers."

  es.c1.unit02.lesson05.teach.memo:
    title: "The company memo"
    gloss: "Dear team: we are moving to a new and more dynamic space. It will be a modern, open and collaborative environment, without individual offices, to encourage communication. The space is a little more reduced, but the closeness with colleagues creates a more agile atmosphere. We are sure it will be a great opportunity for everyone."
    glosses:
      Estimado: dear
      equipo: team
      mudamos: "we move / we are moving"
      espacio: space
      nuevo: new
      dinámico: dynamic
      entorno: environment
      abierto: open
      colaborativo: collaborative
      sin: without
      despachos: "private offices"
      individuales: individual
      fomentar: "to encourage / promote"
      comunicación: communication
      reducido: "reduced / smaller"
      cercanía: closeness
      compañeros: colleagues
      ambiente: atmosphere
      ágil: agile
      gran: great
      oportunidad: opportunity
      todos: everyone
    note: "Read between the lines: each compliment hides a loss -- *más dinámico* (busier), *sin despachos individuales* (no private space), *un poco más reducido* (smaller), *una gran oportunidad* (worse for you)."
  es.c1.unit02.lesson05.teach.eufemismo:
    title: "a euphemism"
    gloss: "a euphemism"
    note: "*El eufemismo* says something bad with pleasant words -- the memo's whole technique."
    example_gloss: "A euphemism says something bad with nice words."
  es.c1.unit02.lesson05.teach.a_primera_vista:
    title: "at first sight"
    gloss: "at first sight"
    note: "*A primera vista* marks the surface reading, before you look between the lines."
    example_gloss: "At first sight, the news sounds good."
  es.c1.unit02.lesson05.teach.sonar_bien:
    title: "to sound good"
    gloss: "to sound good"
    note: "*Sonar bien* describes the positive surface; the reality is elsewhere."
    example_gloss: "The news sounds good, but it isn't."
  es.c1.unit02.lesson05.teach.memo_note:
    title: "Reading it between the lines"
    gloss: "The message sounds positive, but between the lines it announces something negative."
    note: "Distinguish the literal praise from the writer's actual stance."

  es.c1.unit02.lesson06.teach.mateo_pregunta:
    title: "Mateo: What do you think of the new office?"
    gloss: "Mateo: What do you think of the new office?"
    note: "Mateo asks Elena's opinion with *tú* (*te parece*)."
  es.c1.unit02.lesson06.teach.elena_ironia:
    title: "Elena: Well great -- an open space with no offices."
    gloss: "Elena: Well great -- an open space with no offices."
    note: "Elena's *Pues qué bien* is ironic: she means the opposite."
  es.c1.unit02.lesson06.teach.mateo_atenuacion:
    title: "Mateo: And a little smaller, so we're closer."
    gloss: "Mateo: And a little smaller, so we're closer."
    note: "Mateo's *un poco más reducido* understates that the space is cramped."
  es.c1.unit02.lesson06.teach.elena_implicacion:
    title: "Elena: We'll see how dynamic it is."
    gloss: "Elena: We'll see how dynamic it is."
    note: "*Ya veremos* implies doubt about the promised 'dynamic' space."
  es.c1.unit02.lesson06.teach.mensaje_implicito:
    title: "A model implicit message"
    gloss: "The new office is not bad. We'll see."
    note: "This is the model: an understatement (*no está mal*) plus an implication (*ya veremos*) that together convey scepticism without stating it."

exercises:
  es.c1.unit02.lesson01.exercise01.recognize_leer_entre_lineas:
    instruction: "What does leer entre líneas mean?"
    correct_option: "To grasp the meaning behind the literal words."
    distractors: ["To read very quickly.", "To read out loud.", "To read only the first line."]
    accepted_answers: [{value: "To grasp the meaning behind the literal words.", status: correct}]
    feedback: "*Leer entre líneas* means reading between the lines -- recovering what is implied."
  es.c1.unit02.lesson01.exercise02.recognize_querer_decir:
    instruction: "What does querer decir mean?"
    correct_option: "To mean / to intend."
    distractors: ["To want to speak.", "To say goodbye.", "To ask a question."]
    accepted_answers: [{value: "To mean / to intend.", status: correct}]
    feedback: "*Querer decir* = to mean: the intended meaning behind the words."
  es.c1.unit02.lesson01.exercise03.match_leer_entre_lineas:
    instruction: "Match each Spanish phrase to its English meaning."
    accepted_answers:
      - value: {"leer entre líneas": "to read between the lines", "querer decir": "to mean", "en realidad": "actually / in reality", "el tono": "the tone", "lo que se dice": "what is said", "lo que se quiere decir": "what is meant"}
        status: correct
    feedback: "These are the building blocks of reading between the lines."
  es.c1.unit02.lesson01.exercise04.order_leer_entre_lineas:
    instruction: "Put the Spanish words in order to build the idiom for 'to read between the lines'."
    accepted_answers:
      - {value: "Leer entre líneas", status: correct}
    feedback: "*Leer entre líneas* is the unit's core idiom."
  es.c1.unit02.lesson01.exercise05.translate_querer_decir:
    instruction: "Translate into Spanish: He means something else."
    accepted_answers:
      - {value: "Quiere decir otra cosa", status: correct}
      - {value: "Él quiere decir otra cosa", status: correct}
    feedback: "*Quiere decir otra cosa* names the intended meaning behind the words."
  es.c1.unit02.lesson01.exercise06.speak_leer_entre_lineas:
    instruction: "Say aloud in Spanish: You have to read between the lines."
    accepted_answers:
      - {value: "Hay que leer entre líneas", status: correct}
    feedback: "*Hay que leer entre líneas* states the whole lesson's message."

  es.c1.unit02.lesson02.exercise01.recognize_pues_que_bien:
    instruction: "What does Pues qué bien really mean here?"
    correct_option: "The situation is actually bad."
    distractors: ["The situation is genuinely good.", "The speaker is asking a question.", "The speaker is indifferent."]
    accepted_answers: [{value: "The situation is actually bad.", status: correct}]
    feedback: "Said ironically, *Pues qué bien* means the opposite."
  es.c1.unit02.lesson02.exercise02.recognize_menuda_idea:
    instruction: "What does Menuda idea really mean?"
    correct_option: "It is a terrible idea."
    distractors: ["It is a brilliant idea.", "It is a brand-new idea.", "It is a simple idea."]
    accepted_answers: [{value: "It is a terrible idea.", status: correct}]
    feedback: "*Menuda idea* ironically dismisses the idea as bad."
  es.c1.unit02.lesson02.exercise03.match_ironia:
    instruction: "Match each ironic expression to its English meaning."
    accepted_answers:
      - value: {"Pues qué bien": "well, great (said ironically)", "Menuda idea": "some idea (said ironically)", "Claro que sí": "of course (said ironically)", "la ironía": "irony", "lo contrario": "the opposite", "el tono": "the tone"}
        status: correct
    feedback: "Irony says the opposite; the tone reveals the real meaning."
  es.c1.unit02.lesson02.exercise04.order_pues_que_bien:
    instruction: "Put the words in order to say well, great -- ironically."
    accepted_answers:
      - {value: "Pues qué bien", status: correct}
    feedback: "*Pues qué bien* carries the irony on its tone."
  es.c1.unit02.lesson02.exercise05.translate_lo_contrario:
    instruction: "Translate into Spanish: He says the opposite of what he thinks."
    accepted_answers:
      - {value: "Dice lo contrario de lo que piensa", status: correct}
      - {value: "Él dice lo contrario de lo que piensa", status: correct}
    feedback: "*Lo contrario* is the surface of irony."
  es.c1.unit02.lesson02.exercise06.speak_pues_que_bien:
    instruction: "Say aloud in Spanish, with an ironic tone: Well, great."
    accepted_answers:
      - {value: "Pues qué bien", status: correct}
    feedback: "The tone, not the words, carries the irony."

  es.c1.unit02.lesson03.exercise01.recognize_no_esta_mal:
    instruction: "What does No está mal usually convey?"
    correct_option: "It is acceptable, but nothing special."
    distractors: ["It is excellent.", "It is forbidden.", "It is terrible."]
    accepted_answers: [{value: "It is acceptable, but nothing special.", status: correct}]
    feedback: "*No está mal* understates: lukewarm approval rather than praise."
  es.c1.unit02.lesson03.exercise02.recognize_podria_ser_peor:
    instruction: "What does Podría ser peor really mean?"
    correct_option: "It is bad, but tolerable."
    distractors: ["It could improve a lot.", "It is the worst possible.", "It is perfect."]
    accepted_answers: [{value: "It is bad, but tolerable.", status: correct}]
    feedback: "*Podría ser peor* concedes it is bad without complaining."
  es.c1.unit02.lesson03.exercise03.match_atenuacion:
    instruction: "Match each understated expression to its meaning."
    accepted_answers:
      - value: {"no está mal": "it's not bad (lukewarm approval)", "podría ser peor": "it could be worse (understated criticism)", "no es lo mejor": "it's not the best (understated criticism)", "la atenuación": "understatement", "suavizar": "to soften", "regular": "so-so / mediocre"}
        status: correct
    feedback: "Understatement says little while meaning something bad."
  es.c1.unit02.lesson03.exercise04.order_podria_ser_peor:
    instruction: "Put the words in order to say it could be worse."
    accepted_answers:
      - {value: "Podría ser peor", status: correct}
    feedback: "*Podría ser peor* is the classic resigned understatement."
  es.c1.unit02.lesson03.exercise05.translate_no_es_lo_mejor:
    instruction: "Translate into Spanish: It's not the best (that is, it is bad)."
    accepted_answers:
      - {value: "No es lo mejor", status: correct}
      - {value: "No es el mejor", status: correct}
      - {value: "No es la mejor", status: correct}
    feedback: "*No es lo mejor* means far more than it says."
  es.c1.unit02.lesson03.exercise06.speak_podria_ser_peor:
    instruction: "Say aloud in Spanish: It could be worse."
    accepted_answers:
      - {value: "Podría ser peor", status: correct}
    feedback: "A short understatement that criticizes without complaint."

  es.c1.unit02.lesson04.exercise01.recognize_ya_veremos:
    instruction: "What does Ya veremos really mean?"
    correct_option: "The speaker doubts it will happen."
    distractors: ["The speaker is certain.", "The speaker wants details now.", "The speaker is happy."]
    accepted_answers: [{value: "The speaker doubts it will happen.", status: correct}]
    feedback: "*Ya veremos* withholds agreement and implies doubt."
  es.c1.unit02.lesson04.exercise02.recognize_eso_dice:
    instruction: "What does Eso dice really mean?"
    correct_option: "The speaker does not believe it."
    distractors: ["The speaker confirms it.", "The speaker quotes precisely to agree.", "The speaker forgot the name."]
    accepted_answers: [{value: "The speaker does not believe it.", status: correct}]
    feedback: "*Eso dice* reports the words while signalling disbelief."
  es.c1.unit02.lesson04.exercise03.match_implicacion:
    instruction: "Match each implication to its meaning."
    accepted_answers:
      - value: {"ya veremos": "we'll see (implies doubt)", "eso dice": "so he says (implies disbelief)", "si tú lo dices": "if you say so (implies doubt)", "lo que se sobreentiende": "what is implied", "la implicación": "the implication", "sin afirmar": "without stating it directly"}
        status: correct
    feedback: "Implication suggests a judgement without ever stating it."
  es.c1.unit02.lesson04.exercise04.order_ya_veremos:
    instruction: "Put the words in order to say we'll see."
    accepted_answers:
      - {value: "Ya veremos", status: correct}
    feedback: "*Ya veremos* leaves the judgement unstated."
  es.c1.unit02.lesson04.exercise05.translate_ya_veremos:
    instruction: "Translate into Spanish: We'll see (that is, I doubt it)."
    accepted_answers:
      - {value: "Ya veremos", status: correct}
    feedback: "The short form *Ya veremos* carries the doubt."
  es.c1.unit02.lesson04.exercise06.speak_eso_dice:
    instruction: "Say aloud in Spanish, with scepticism: So he says."
    accepted_answers:
      - {value: "Eso dice", status: correct}
    feedback: "*Eso dice* distances the speaker from the claim."

  es.c1.unit02.lesson05.exercise01.read_dinamico:
    instruction: "What does 'más dinámico' really mean here?"
    correct_option: "It will be busier and more disruptive."
    distractors: ["It will be calmer and quieter.", "It will have better furniture.", "It means exactly 'dynamic', nothing more."]
    accepted_answers: [{value: "It will be busier and more disruptive.", status: correct}]
    feedback: "The memo's 'más dinámico' is a euphemism: more change and disruption."
  es.c1.unit02.lesson05.exercise02.read_sin_despachos:
    instruction: "What does 'sin despachos individuales' actually mean?"
    correct_option: "You lose your private office."
    distractors: ["Everyone gets a bigger office.", "Each person gets their own office.", "The offices will be renovated."]
    accepted_answers: [{value: "You lose your private office.", status: correct}]
    feedback: "No individual offices means no private space -- the hidden cost."
  es.c1.unit02.lesson05.exercise03.read_reducido:
    instruction: "What does 'un poco más reducido' really mean?"
    correct_option: "It is actually smaller and more cramped."
    distractors: ["It is slightly bigger.", "It is the same size.", "It has more rooms."]
    accepted_answers: [{value: "It is actually smaller and more cramped.", status: correct}]
    feedback: "'Un poco más reducido' understates that the space is smaller."
  es.c1.unit02.lesson05.exercise04.read_oportunidad:
    instruction: "What does 'una gran oportunidad' really signal?"
    correct_option: "It will probably be worse for you."
    distractors: ["It will clearly be much better.", "It is a promise of a pay rise.", "It means nothing will change."]
    accepted_answers: [{value: "It will probably be worse for you.", status: correct}]
    feedback: "The 'great opportunity' is management's framing, not a real benefit."
  es.c1.unit02.lesson05.exercise05.match_mensaje:
    instruction: "Match each reading word to its meaning."
    accepted_answers:
      - value: {"el eufemismo": "a euphemism", "a primera vista": "at first sight", "sonar bien": "to sound good", "leer entre líneas": "to read between the lines", "lo que se dice": "what is said", "lo que se quiere decir": "what is meant"}
        status: correct
    feedback: "These words decode the memo's surface language."
  es.c1.unit02.lesson05.exercise06.translate_a_primera_vista:
    instruction: "Translate into Spanish: At first sight, the news sounds good."
    accepted_answers:
      - {value: "A primera vista, la noticia suena bien", status: correct}
      - {value: "A primera vista, las noticias suenan bien", status: correct}
    feedback: "*A primera vista* marks the surface, before the implicit meaning shows."

  es.c1.unit02.lesson06.exercise01.listen_implicito:
    instruction: "Listen to Elena and Mateo. How do they really feel about the new office?"
    correct_option: "Sceptical and a little mocking."
    distractors: ["Genuinely enthusiastic.", "Furious and angry.", "Completely indifferent."]
    accepted_answers: [{value: "Sceptical and a little mocking.", status: correct}]
    feedback: "Elena's 'Pues qué bien' and Mateo's 'un poco más reducido' are ironic and understated, not sincere."
