answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on reasons, order, purpose, conditions, indirect questions and passing on messages."
  learning_goal: "Say what you do things for in Spanish with para + infinitive."
units:
  es.a2.unit106.para_que: {"title": "What For", "description": "Say what you do something for, such as errands, learning or saving money, with para + infinitive and ¿para qué?."}
lessons:
  es.a2.unit106.lesson01.para_infinitivo: {"title": "Para + infinitive"}
  es.a2.unit106.lesson02.para_que_pregunta: {"title": "What for?"}
  es.a2.unit106.lesson03.recados: {"title": "Errands"}
  es.a2.unit106.lesson04.para_o_porque: {"title": "Para or porque"}
  es.a2.unit106.lesson05.la_nota_de_mateo: {"title": "Mateo's Note"}
  es.a2.unit106.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit106.lesson01.teach.gn_para: {"title": "Para + infinitive", "gloss": "I save money to travel. I go to the bank to take out money. Elena studies to learn.", "note": "*Para* + infinitive says what you do something for. The verb after *para* never changes: *para viajar*, *para sacar*."}
  es.a2.unit106.lesson01.teach.gn_sujeto: {"title": "Same person", "gloss": "Mateo saves money to travel. I study to speak better. Elena leaves to take the train.", "note": "The person who does the first action also does the second one. Only the first verb is conjugated."}
  es.a2.unit106.lesson01.teach.palabras: {"title": "Verbs of purpose", "gloss": "to save / to travel / to take out money / to learn / to speak / to buy", "note": "*Sacar dinero* is to take out money at the bank or a cash machine.", "example_gloss": ["Mateo saves money to travel.", "I go to the bank to take out money.", "Elena studies to learn.", "I buy a ticket to travel."]}
  es.a2.unit106.lesson01.teach.gn_dos: {"title": "Two more", "gloss": "I buy a ticket to travel. I call Mateo to talk.", "note": "You can use many verbs before *para*. The second verb is always the goal."}
  es.a2.unit106.lesson01.teach.frases: {"title": "Three sentences", "gloss": "I save money to travel. I go to the bank to take out money. I buy a ticket to travel."}
  es.a2.unit106.lesson02.teach.gn_pregunta: {"title": "¿Para qué?", "gloss": "What do you save for? To travel. What do you go to the bank for? To take out money.", "note": "*¿Para qué...?* asks for the goal. The short answer is *para* + infinitive. *Qué* has an accent in the question."}
  es.a2.unit106.lesson02.teach.gn_contraste: {"title": "Para qué or por qué?", "gloss": "What do you study for? To learn. Why do you study? Because I want to learn.", "note": "*¿Para qué?* asks for a goal and is answered with *para*. *¿Por qué?* asks for a reason and is answered with *porque*."}
  es.a2.unit106.lesson02.teach.palabras: {"title": "Errands", "gloss": "to want / to need / money / the bank / the shop / the bread", "note": "*Necesito* is I need. *Quiero* is I want.", "example_gloss": ["What do you need money for?", "I need money to buy the ticket.", "I want to go to the shop.", "Elena buys bread at the shop."]}
  es.a2.unit106.lesson02.teach.gn_respuesta: {"title": "Short answers", "gloss": "What do you need money for? To buy the ticket. What do you buy bread for? For breakfast.", "note": "A short answer can be just *para* + infinitive, or *para* + a noun: *para el desayuno*."}
  es.a2.unit106.lesson02.teach.frases: {"title": "Three sentences", "gloss": "What do you save for? To travel. What do you need money for? To buy the ticket."}
  es.a2.unit106.lesson03.teach.gn_recado: {"title": "Errand + goal", "gloss": "I go to the shop to buy bread. I go to the bank to take out money. I go to the station to buy a ticket.", "note": "Say where you go first, then *para* and what you do there. Remember *a el* becomes *al*: *voy al banco*."}
  es.a2.unit106.lesson03.teach.gn_elena: {"title": "He or she", "gloss": "Elena goes to the shop to buy bread. Mateo goes to the bank to take out money.", "note": "With *él* and *ella* use *va*. The goal verb stays in the infinitive."}
  es.a2.unit106.lesson03.teach.palabras: {"title": "Where and what for", "gloss": "to go / the shop / the station / the ticket / the bread / tomorrow", "note": "*Voy*, *vas* and *va* are forms of *ir*. *Billete* is the ticket for a train.", "example_gloss": ["I go to the shop to buy bread.", "Elena goes to the station to buy a ticket.", "Mateo goes to the bank to take out money.", "Tomorrow I go to the shop."]}
  es.a2.unit106.lesson03.teach.gn_orden: {"title": "Goal first", "gloss": "To buy bread, I go to the shop. I go to the shop to buy bread.", "note": "The *para* clause can start the sentence too (with a comma) and the meaning stays the same."}
  es.a2.unit106.lesson03.teach.frases: {"title": "Three sentences", "gloss": "I go to the shop to buy bread. Elena goes to the station to buy a ticket. Mateo goes to the bank to take out money."}
  es.a2.unit106.lesson04.teach.gn_contraste: {"title": "Goal or reason", "gloss": "I save money to travel. I save money because I want to travel.", "note": "*Para* + infinitive gives the goal. *Porque* gives a reason and needs a conjugated verb. Both sentences say almost the same thing."}
  es.a2.unit106.lesson04.teach.gn_pares: {"title": "Two answers", "gloss": "I go to the shop because I need bread. I go to the shop to buy bread.", "note": "If the next verb is conjugated (*necesito*), use *porque*. If it is an infinitive (*comprar*), use *para*."}
  es.a2.unit106.lesson04.teach.gn_reconocer: {"title": "Only to recognise", "gloss": "I call you so that you know. I write to you so that you come.", "note": "*Para que* also exists, with a different verb form after it. At this level you only need to recognise it; do not use it yet."}
  es.a2.unit106.lesson04.teach.palabras: {"title": "Wanting and needing", "gloss": "to need / to want / to know / to write", "note": "*Quiero* and *necesito* are conjugated, so they follow *porque*, not *para*.", "example_gloss": ["I save because I want to travel.", "I go to the shop because I need bread.", "I write to Mateo to talk.", "I want to know the time."]}
  es.a2.unit106.lesson04.teach.frases: {"title": "Three sentences", "gloss": "I save money to travel. I save money because I want to travel. I go to the shop because I need bread."}
  es.a2.unit106.lesson05.teach.palabras: {"title": "Words for the note", "gloss": "to visit / every week / the train ticket / much or a lot", "note": "*Cada semana* is every week.", "example_gloss": ["I save money every week.", "Mateo buys the train ticket.", "I am going to visit my uncle.", "It is not much."]}
  es.a2.unit106.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "I save money to visit my uncle. I go to the bank to take out money.", "note": "In the note, find every *para* + infinitive and say what each action is for."}
  es.a2.unit106.lesson05.teach.lectura: {"title": "Mateo writes to Elena", "gloss": "Hi, Elena. I save money to visit my uncle in Barcelona. Today I go to the bank to take out money. Tomorrow I go to the station to buy the train ticket. It is not much, but I save every week. And you? What do you save for?", "note": "Find the goal after each *para*.", "glosses": {"visitar": "to visit", "semana": "week", "billete": "ticket", "mucho": "much"}}
  es.a2.unit106.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. Where are you going?"}
  es.a2.unit106.lesson06.teach.d2: {"title": "Mateo answers", "gloss": "Mateo: I am going to the bank to take out money."}
  es.a2.unit106.lesson06.teach.d3: {"title": "Elena asks what for", "gloss": "Elena: What do you need money for?"}
  es.a2.unit106.lesson06.teach.d4: {"title": "Mateo explains", "gloss": "Mateo: To buy the train ticket to Barcelona. I save money to visit my uncle."}
  es.a2.unit106.lesson06.teach.d5: {"title": "Elena shares", "gloss": "Elena: How nice! I am going to the shop to buy bread."}
  es.a2.unit106.lesson06.teach.d6: {"title": "Mateo asks", "gloss": "Mateo: And what do you buy bread for?"}
  es.a2.unit106.lesson06.teach.d7: {"title": "Elena answers", "gloss": "Elena: For tomorrow's breakfast."}
