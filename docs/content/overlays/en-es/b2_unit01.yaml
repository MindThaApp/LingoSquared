course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: defend a position in a discussion --
    state a claim, support it with reasons and evidence (en primer
    lugar, por ejemplo, según las investigaciones), acknowledge the
    strongest opposing point (por un lado ... por otro lado, aunque,
    claro que), and rebut it without conceding (sin embargo, no
    obstante, en cambio, eso no quita que, en resumen), around the
    everyday debate of working from home.

units:
  es.b2.unit01.argumentacion:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  es.b2.unit01.lesson01.tomar_postura:
    title: "Taking a position"
  es.b2.unit01.lesson02.dar_razones:
    title: "Giving reasons and evidence"
  es.b2.unit01.lesson03.el_otro_lado:
    title: "Acknowledging the other side"
  es.b2.unit01.lesson04.rebatir:
    title: "Rebutting"
  es.b2.unit01.lesson05.leer_un_texto:
    title: "Reading an argument"
  es.b2.unit01.lesson06.defender_una_postura:
    title: "Defending a position"

teaching:
  es.b2.unit01.lesson01.teach.teletrabajo:
    title: "working from home"
    gloss: "working from home / telework"
    note: "*El teletrabajo* is the everyday word for working from home. It is the topic this whole unit argues about."
    example_gloss: "Working from home saves time."
  es.b2.unit01.lesson01.teach.ir_a_la_oficina:
    title: "to go to the office"
    gloss: "to go to the office"
    note: "The opposite pole of the debate. *Ir* (to go) + *a la oficina* (to the office)."
  es.b2.unit01.lesson01.teach.postura:
    title: "a position / viewpoint"
    gloss: "a position / a point of view"
    note: "*Tomar una postura* means 'to take a position' -- the claim you are going to defend. This is the thing an argument is built around."
    example_gloss: "I have a clear position."
  es.b2.unit01.lesson01.teach.creo_que:
    title: "I think that..."
    gloss: "I think that..."
    note: "*Creo que...* introduces your own opinion. Unlike some opinion phrases, it takes the indicative here since the speaker is genuinely asserting a view: *creo que trabajar desde casa es mejor*."
  es.b2.unit01.lesson01.teach.en_mi_opinion:
    title: "In my opinion..."
    gloss: "In my opinion..."
    note: "*En mi opinión* is a slightly more formal way to open an opinion than *creo que*, useful for signposting in an argument."
  es.b2.unit01.lesson01.teach.mejor_que:
    title: "better than"
    gloss: "better than"
    note: "*Mejor que* is 'better than' in a comparison. *Mejor* does not change form for gender, but it has a plural, *mejores* (*las mejores opciones*)."
    example_gloss: "This option is better."
  es.b2.unit01.lesson01.teach.claim_model:
    title: "I think that working from home is better than going to the office."
    gloss: "I think that working from home is better than going to the office."
    note: "The model claim for this unit -- the sentence you will build support for and rebut objections to across every lesson."
  es.b2.unit01.lesson01.teach.estoy_de_acuerdo:
    title: "I agree."
    gloss: "I agree."
    note: "*Estoy de acuerdo* = 'I agree'. To agree with something specific, add *con*: *estoy de acuerdo con eso* ('I agree with that')."
  es.b2.unit01.lesson01.teach.grammar_postura:
    title: "I think that working from home is better than going to the office. In my opinion, that is better."
    gloss: "I think that working from home is better than going to the office. In my opinion, that is better."
    note: "A claim is the position you will defend. Both *creo que...* and *en mi opinión...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  es.b2.unit01.lesson02.teach.porque:
    title: because
    gloss: because
    note: "*Porque* gives a reason and normally comes after the main clause: *...porque es más tranquilo*. It rarely opens a sentence, except when answering a *¿por qué?* question."
    example_gloss: "I work from home, because it is quieter."
  es.b2.unit01.lesson02.teach.ya_que:
    title: since
    gloss: "since / given that"
    note: "*Ya que* also means 'because', but leans slightly more formal and often opens the sentence, unlike *porque*, which almost never does."
    example_gloss: "I save time, since I do not travel."
  es.b2.unit01.lesson02.teach.primer_segundo_lugar:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*En primer lugar... en segundo lugar...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  es.b2.unit01.lesson02.teach.ademas:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*Además* adds a further reason and commonly opens the sentence: *Además, ahorras dinero*."
    example_gloss: "In addition, you save money."
  es.b2.unit01.lesson02.teach.por_ejemplo:
    title: "for example"
    gloss: "for example"
    note: "*Por ejemplo* introduces a concrete example that backs up a reason."
    example_gloss: "You save time, for example commute time."
  es.b2.unit01.lesson02.teach.segun_investigaciones:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*Según las investigaciones...* is how you cite evidence in an argument -- literally 'according to the research'."
  es.b2.unit01.lesson02.teach.trayecto:
    title: "commute time"
    gloss: "commute / journey"
    example_gloss: "I save a lot of commute time."
  es.b2.unit01.lesson02.teach.ahorrar:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Ahorrar* = to save. Present forms: *ahorro* (I save), *ahorras* (you save, informal *tú*), *ahorra* (he/she saves)."
    example_gloss: "You can save a lot of time."
  es.b2.unit01.lesson02.teach.mucho:
    title: "a lot / much"
    gloss: "a lot / much"
    example_gloss: "I save a lot of time."
  es.b2.unit01.lesson02.teach.productivo:
    title: "more productive"
    gloss: "more productive"
    example_gloss: "At home I am more productive."
  es.b2.unit01.lesson02.teach.grammar_argumentos:
    title: "Firstly, you save commute time. In addition, you are more productive, because it is calmer at home."
    gloss: "Firstly, you save commute time. In addition, you are more productive, because it is calmer at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*en primer lugar*, *además*), give examples (*por ejemplo*), and cite evidence (*según las investigaciones*) so the argument is easy to follow."

  es.b2.unit01.lesson03.teach.por_un_lado:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Por un lado...* opens a balanced view; it is almost always paired with *por otro lado...* to introduce the opposing point you are about to acknowledge."
  es.b2.unit01.lesson03.teach.por_otro_lado:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Por otro lado...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  es.b2.unit01.lesson03.teach.aunque:
    title: although
    gloss: although
    note: "*Aunque* concedes a point, usually with the indicative when the speaker treats the fact as real: *Aunque es cómodo,...*. It sets up a contrast the main clause will answer."
    example_gloss: "Although it is comfortable, I sometimes prefer to vary."
  es.b2.unit01.lesson03.teach.claro_que:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Claro que* concedes that the opposing point is fair ('of course you miss...') -- a polite way to acknowledge before you push back."
    example_gloss: "Of course you are right."
  es.b2.unit01.lesson03.teach.es_cierto_que:
    title: "It's true that..."
    gloss: "It's true that..."
    note: "*Es cierto que...* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  es.b2.unit01.lesson03.teach.algunos_piensan:
    title: "some people think that..."
    gloss: "some people think that..."
    note: "*Algunos piensan que...* introduces a common objection without owning it yourself -- 'some people think that...' -- so you can then answer it."
  es.b2.unit01.lesson03.teach.a_veces:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work at the office."
  es.b2.unit01.lesson03.teach.companeros:
    title: colleagues
    gloss: colleagues
    note: "*Los compañeros* (colleagues); *tus compañeros* (your colleagues). In an argument, *tú* often works as a generic 'you', just like English 'you miss your colleagues'."
    example_gloss: "Sometimes I miss my colleagues."
  es.b2.unit01.lesson03.teach.echar_de_menos:
    title: "to miss"
    gloss: "to miss (someone/something)"
    note: "*Echar de menos* = to miss. Present forms: *echo* (I miss), *echas* (you miss, informal *tú*), *echa* (he/she misses). Takes personal *a* before a person: *echas de menos a tus compañeros*."
    example_gloss: "I miss the contact with the office."
  es.b2.unit01.lesson03.teach.contacto_con:
    title: "the contact with..."
    gloss: "the contact with..."
    note: "*El contacto con...* = 'the contact with...' -- the social contact with colleagues is the classic point people raise against working from home."
  es.b2.unit01.lesson03.teach.comodo:
    title: "comfortable"
    gloss: "comfortable"
    example_gloss: "Working from home is comfortable."
  es.b2.unit01.lesson03.teach.grammar_concesion:
    title: "On the one hand working from home is comfortable, on the other hand you sometimes miss your colleagues."
    gloss: "On the one hand working from home is comfortable, on the other hand you sometimes miss your colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Por un lado... por otro lado...*, *aunque*, *claro que*, and *es cierto que* all do this without giving up your own position."

  es.b2.unit01.lesson04.teach.sin_embargo:
    title: however
    gloss: "however / yet"
    note: "*Sin embargo* answers a concession: you grant the objection, then *sin embargo...* ('however, ...') reasserts your claim. It is the core rebuttal word of this unit."
    example_gloss: "It is comfortable. However, it has disadvantages."
  es.b2.unit01.lesson04.teach.no_obstante:
    title: nevertheless
    gloss: "nevertheless / notwithstanding"
    note: "*No obstante* is a more formal 'however', closer to written register than everyday speech, but still natural in a careful spoken argument."
    example_gloss: "Nevertheless, the advantages are clear."
  es.b2.unit01.lesson04.teach.en_cambio:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*En cambio* sets one thing directly against another: 'at the office it's busy; at home, by contrast, it's calm'."
  es.b2.unit01.lesson04.teach.eso_no_quita_que:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Eso no quita que...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. Standard Spanish uses the subjunctive after it (*eso no quita que puedas...*, *eso no quita que la libertad pese más*); in relaxed speech you will also hear the indicative (*puedes*, *pesa*), as in this unit's dialogue and reading."
  es.b2.unit01.lesson04.teach.en_resumen:
    title: "in short"
    gloss: "in short"
    note: "*En resumen* signposts your conclusion -- it wraps the argument up: 'in short, ...'."
    example_gloss: "In short, working from home is better."
  es.b2.unit01.lesson04.teach.ventajas:
    title: advantages
    gloss: "advantages (plural of ventaja)"
    example_gloss: "Working from home has many advantages."
  es.b2.unit01.lesson04.teach.inconvenientes:
    title: disadvantages
    gloss: "disadvantages / drawbacks (plural of inconveniente)"
    example_gloss: "Working from home also has disadvantages."
  es.b2.unit01.lesson04.teach.pesar_mas:
    title: "to weigh more"
    gloss: "to weigh more (carry more weight)"
    note: "*Pesar* here means 'to carry weight' in an argument. *Las ventajas pesan más* = 'the advantages weigh more / count for more'."
    example_gloss: "This argument weighs more."
  es.b2.unit01.lesson04.teach.libertad:
    title: freedom
    gloss: freedom
    example_gloss: "Working from home gives a lot of freedom."
  es.b2.unit01.lesson04.teach.tiene_ventajas:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Tiene* = 'has' (from *tener*). *Ir a la oficina tiene ventajas* concedes the other side has advantages -- before you rebut."
  es.b2.unit01.lesson04.teach.grammar_rebatir:
    title: "That's true, but that does not change the fact that the advantages weigh more. In short, working from home is better."
    gloss: "That's true, but that does not change the fact that the advantages weigh more. In short, working from home is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Sin embargo*, *no obstante*, and *eso no quita que...* all pivot back to your position; *en resumen* signposts the conclusion."

  es.b2.unit01.lesson05.teach.texto:
    title: "Reading: working from home is a good development"
    gloss: "More and more people work from home. I am convinced that it is a good development. Firstly, you save a lot of commute time, and research shows that people who work from home tend to be more productive. Of course, some say that at home you miss the contact with colleagues. That's true, but that does not change the fact that you can still call and video-call. In short, the advantages weigh more than the disadvantages."
    glosses:
      Cada: "each (cada vez más = more and more)"
      vez: "time (cada vez más = more and more)"
      personas: "people"
      trabajan: "work (from trabajar, to work)"
      convencida: "convinced (feminine)"
      buen: "good (short form of bueno before a noun)"
      desarrollo: "development"
      lugar: "place (en primer lugar = firstly)"
      trayecto: "commute / journey"
      investigaciones: "research (según las investigaciones = research shows)"
      quienes: "those who / who"
      suelen: "tend to (from soler, to usually do something)"
      ser: "to be"
      productivos: "productive"
      algunos: "some people"
      dicen: "say (from decir, to say)"
      compañeros: "colleagues"
      cierto: "true (es cierto = that's true)"
      quita: "takes away (eso no quita que = that does not take away that)"
      todavía: "still"
      puedes: "can (from poder)"
      llamar: "to call (on the phone)"
      videollamadas: "video calls (hacer videollamadas = to video-call)"
      resumen: "summary (en resumen = in short)"
      ventajas: "advantages"
      pesan: "weigh (carry weight)"
      inconvenientes: "disadvantages"

  es.b2.unit01.lesson06.teach.por_que_crees_eso:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*¿Por qué crees eso?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  es.b2.unit01.lesson06.teach.algo_de_razon:
    title: "You have a point."
    gloss: "You have a point. / There's something to that."
    note: "*Algo de razón tienes* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  es.b2.unit01.lesson06.teach.dialogue_elena_claim:
    title: "Elena: I think working from home is better than going to the office."
    gloss: "Elena: I think working from home is better than going to the office."
  es.b2.unit01.lesson06.teach.dialogue_mateo_why:
    title: "Mateo: Why do you think that?"
    gloss: "Mateo: Why do you think that?"
  es.b2.unit01.lesson06.teach.dialogue_elena_support:
    title: "Elena: Firstly, you save a lot of commute time, and research shows that people who work from home are more productive."
    gloss: "Elena: Firstly, you save a lot of commute time, and research shows that people who work from home are more productive."
  es.b2.unit01.lesson06.teach.dialogue_mateo_objection:
    title: "Mateo: On the other hand, you miss the contact with your colleagues."
    gloss: "Mateo: On the other hand, you miss the contact with your colleagues."
  es.b2.unit01.lesson06.teach.dialogue_elena_rebuttal:
    title: "Elena: That's true, but that does not change the fact that you can video-call. In short, the advantages weigh more."
    gloss: "Elena: That's true, but that does not change the fact that you can video-call. In short, the advantages weigh more."
  es.b2.unit01.lesson06.teach.dialogue_mateo_concede:
    title: "Mateo: You have a point."
    gloss: "Mateo: You have a point."
  es.b2.unit01.lesson06.teach.grammar_argumento_completo:
    title: "I think working from home is better than going to the office. Firstly, you save a lot of commute time. On the other hand, you miss your colleagues. However, the advantages weigh more."
    gloss: "I think working from home is better than going to the office. Firstly, you save a lot of commute time. On the other hand, you miss your colleagues. However, the advantages weigh more."
    note: "A complete argument has four moves: claim (*creo que...*), support (*en primer lugar...*), acknowledged objection (*por otro lado...*), and rebuttal (*sin embargo...*)."

exercises:
  es.b2.unit01.lesson01.exercise01.recognize_postura:
    instruction: "What does this word mean?"
    correct_option: "a position / viewpoint"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "a position / viewpoint", status: correct}]
    feedback: "Una postura is a position or point of view -- the claim you defend."
  es.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that working from home is better than going to the office."
    distractors: ["I think that going to the office is better than working from home.", "I think that working from home is nicer than travelling.", "I know that working from home is better than going to the office."]
    accepted_answers: [{value: "I think that working from home is better than going to the office.", status: correct}]
    feedback: "Creo que trabajar desde casa es mejor que ir a la oficina means I think that working from home is better than going to the office."
  es.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"el teletrabajo": "working from home", "ir a la oficina": "to go to the office", "una postura": "a position / viewpoint", "Creo que...": "I think that...", "En mi opinión...": "In my opinion...", "mejor que": "better than", "trabajar desde casa": "to work from home", "Estoy de acuerdo.": "I agree."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  es.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that working from home is better."
    accepted_answers:
      - {value: "Creo que trabajar desde casa es mejor", status: correct}
    feedback: "Creo que trabajar desde casa es mejor means I think that working from home is better."
  es.b2.unit01.lesson01.exercise05.translate_en_mi_opinion:
    instruction: "Translate into Spanish: In my opinion, working from home is better."
    accepted_answers:
      - {value: "En mi opinión, trabajar desde casa es mejor", status: correct}
      - {value: "En mi opinión trabajar desde casa es mejor", status: correct}
      - {value: "En mi opinión, el teletrabajo es mejor", status: correct}
    feedback: "En mi opinión, trabajar desde casa es mejor means in my opinion, working from home is better."
  es.b2.unit01.lesson01.exercise06.speak_estoy_de_acuerdo:
    instruction: "Say aloud in Spanish: I agree."
    accepted_answers:
      - {value: "Estoy de acuerdo", status: correct}
    feedback: "Estoy de acuerdo means I agree."
  es.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Spanish: I think that working from home is better than going to the office."
    accepted_answers:
      - {value: "Creo que trabajar desde casa es mejor que ir a la oficina", status: correct}
      - {value: "Creo que el teletrabajo es mejor que ir a la oficina", status: correct}
    feedback: "Creo que trabajar desde casa es mejor que ir a la oficina means I think that working from home is better than going to the office."
  es.b2.unit01.lesson01.exercise08.dictation_claim_teletrabajo:
    instruction: "Type what you hear."
    correct_response: "Creo que trabajar desde casa es mejor que ir a la oficina"
