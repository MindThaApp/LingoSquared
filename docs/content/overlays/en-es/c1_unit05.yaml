course:
  title: Spanish C1
  description: >-
    Advanced Spanish hypothesis and counterfactuals: reason about unreal and
    counterfactual situations -- mixed conditionals, hypothetical
    consequences, and regrets -- describing how things could or would have
    been different.

units:
  es.c1.unit05.situaciones_irreales:
    title: "Unreal situations"
    description: "Reason about unreal past conditions, their present consequences, and regrets -- what would have been different."

lessons:
  es.c1.unit05.lesson01.el_pasado_que_no_fue:
    title: "The past that wasn't"
  es.c1.unit05.lesson02.el_condicional_de_lo_que_no_paso:
    title: "The conditional of what did not happen"
  es.c1.unit05.lesson03.el_condicional_mixto:
    title: "The mixed conditional"
  es.c1.unit05.lesson04.el_arrepentimiento:
    title: "Regret"
  es.c1.unit05.lesson05.leer_una_cadena_contrafactual:
    title: "Reading a counterfactual chain"
  es.c1.unit05.lesson06.razonar_contrafactualmente:
    title: "Reasoning counterfactually"

teaching:
  es.c1.unit05.lesson01.teach.el_contrafactual:
    title: "the counterfactual"
    gloss: "the counterfactual"
    note: "*El contrafactual* imagines a past that could have been different."
    example_gloss: "A counterfactual imagines a different past."
  es.c1.unit05.lesson01.teach.la_hipotesis:
    title: "the hypothesis"
    gloss: "the hypothesis"
    note: "*La hipótesis* is a supposition about what did not happen."
    example_gloss: "A hypothesis about the past is a supposition."
  es.c1.unit05.lesson01.teach.el_pasado_irreal:
    title: "the unreal past"
    gloss: "the unreal past"
    note: "*El pasado irreal* describes what did not occur."
    example_gloss: "The unreal past describes what did not happen."
  es.c1.unit05.lesson01.teach.la_consecuencia:
    title: "the consequence"
    gloss: "the consequence"
    note: "*La consecuencia* is what would have followed the condition."
    example_gloss: "Every condition has a consequence."
  es.c1.unit05.lesson01.teach.el_arrepentimiento:
    title: "the regret"
    gloss: "the regret"
    note: "*El arrepentimiento* looks back at the past with sorrow."
    example_gloss: "Regret looks at the past with sorrow."
  es.c1.unit05.lesson01.teach.el_condicional_compuesto:
    title: "the compound conditional"
    gloss: "the compound conditional"
    note: "*El condicional compuesto* (*habría* + participle) names what would have happened."
    example_gloss: "The compound conditional is formed with 'habría' and a participle."
  es.c1.unit05.lesson01.teach.contrafactual_note:
    title: "The counterfactual"
    gloss: "A counterfactual joins an unreal condition in the past to its hypothetical consequence."
    note: "Three parts: an unreal condition, a hypothetical consequence, and (often) a regret."

  es.c1.unit05.lesson02.teach.si_hubiera_aceptado:
    title: "If I had accepted"
    gloss: "If I had accepted"
    note: "*Si + hubiera + participio* opens the past unreal condition."
  es.c1.unit05.lesson02.teach.habria_vivido:
    title: "I would have lived"
    gloss: "I would have lived"
    note: "*Habría + participio* is the past hypothetical consequence."
  es.c1.unit05.lesson02.teach.habria_sido:
    title: "it would have been"
    gloss: "it would have been"
    note: "*Habría sido* names what would have been different."
  es.c1.unit05.lesson02.teach.el_traslado:
    title: "the transfer"
    gloss: "the transfer"
    note: "*El traslado* is a move or posting to another office."
    example_gloss: "The transfer to Barcelona was a promotion."
  es.c1.unit05.lesson02.teach.renunciar:
    title: "to turn down / forgo"
    gloss: "to turn down / forgo"
    note: "*Renunciar a* is to give up or turn down an opportunity."
    example_gloss: "Turning down an opportunity hurts years later."
  es.c1.unit05.lesson02.teach.la_oportunidad:
    title: "the opportunity"
    gloss: "the opportunity"
    note: "*La oportunidad* is a chance that may not come again."
    example_gloss: "An opportunity like that does not come back."
  es.c1.unit05.lesson02.teach.pasado_note:
    title: "The past counterfactual"
    gloss: "For a past counterfactual: si + hubiera + participle, habría + participle."
    note: "*Si hubiera* (condition) then *habría* (consequence)."

  es.c1.unit05.lesson03.teach.ahora_estaria:
    title: "I would now be"
    gloss: "I would now be"
    note: "*Ahora estaría* is the present consequence of a past condition."
  es.c1.unit05.lesson03.teach.ahora_viviria:
    title: "I would be living now"
    gloss: "I would be living now"
    note: "*Ahora viviría* links a past condition to a present result."
  es.c1.unit05.lesson03.teach.ahora_tendria:
    title: "I would now have"
    gloss: "I would now have"
    note: "*Ahora tendría* expresses a present consequence."
  es.c1.unit05.lesson03.teach.la_vida:
    title: "life"
    gloss: "life"
    note: "*La vida* here is the present reality that would be different."
    example_gloss: "Now my life would be different."
  es.c1.unit05.lesson03.teach.la_condicion:
    title: "the condition"
    gloss: "the condition"
    note: "*La condición* is in the past; its consequence is in the present."
    example_gloss: "The condition is in the past, the consequence in the present."
  es.c1.unit05.lesson03.teach.mixto_note:
    title: "The mixed conditional"
    gloss: "Mixed conditional: si + hubiera + participle (past), ahora + simple conditional (present)."
    note: "A past condition with a present consequence."

  es.c1.unit05.lesson04.teach.ojala_hubiera:
    title: "If only I had accepted"
    gloss: "If only I had accepted"
    note: "*Ojalá + hubiera + participio* expresses a wish about the past."
  es.c1.unit05.lesson04.teach.me_arrepiento:
    title: "I regret"
    gloss: "I regret"
    note: "*Me arrepiento de* + *haber* + participle expresses regret."
  es.c1.unit05.lesson04.teach.si_hubiera_sabido:
    title: "If I had known"
    gloss: "If I had known"
    note: "*Si hubiera sabido* frames a regret through what you did not know."
  es.c1.unit05.lesson04.teach.lamentar:
    title: "to regret / lament"
    gloss: "to regret / lament"
    note: "*Lamentar* is a near-synonym of *arrepentirse*."
    example_gloss: "I regret not having tried it."
  es.c1.unit05.lesson04.teach.la_pena:
    title: "the sorrow / pity"
    gloss: "the sorrow / pity"
    note: "*Me da pena* expresses a softer regret."
    example_gloss: "It saddens me not to have tried it."
  es.c1.unit05.lesson04.teach.arrepentimiento_note:
    title: "Expressing regret"
    gloss: "Regret: ojalá + hubiera + participle; me arrepiento de + haber + participle."
    note: "Two regret frames: *ojalá* and *me arrepiento de*."

  es.c1.unit05.lesson05.teach.el_texto:
    title: "A counterfactual chain"
    gloss: "Ten years ago Mateo was offered a transfer to Barcelona and he said no. If he had accepted, he would have lived by the sea. Now he sometimes thinks his life would be different. If only he had accepted, he says to himself. But if he had accepted, he would not be in London."
    glosses:
      Hace: "ago (hace + time)"
      diez: ten
      años: years
      le: "to him"
      ofrecieron: "they offered"
      a: "to"
      Mateo: Mateo
      un: "a / one"
      traslado: transfer
      Barcelona: Barcelona
      y: and
      él: he
      dijo: said
      que: that
      "no": "not"
      Si: if
      si: if
      hubiera: "had (pluperfect subjunctive)"
      aceptado: accepted
      habría: "would have"
      vivido: lived
      junto: "together (junto a = beside)"
      al: "to the"
      mar: sea
      Ahora: now
      veces: "times (a veces = sometimes)"
      piensa: "he thinks"
      su: his
      vida: life
      sería: "would be"
      distinta: different
      Ojalá: "if only"
      se: "himself (to himself)"
      dice: "he says"
      Pero: but
      estaría: "would be"
      en: in
      Londres: London
    note: "The passage separates the fact, the regret, and the hypothetical result."
  es.c1.unit05.lesson05.teach.la_cadena:
    title: "the chain"
    gloss: "the chain"
    note: "*La cadena* is the linked sequence of condition and consequence."
    example_gloss: "A counterfactual chain links past and present."
  es.c1.unit05.lesson05.teach.el_hecho:
    title: "the fact"
    gloss: "the fact"
    note: "*El hecho* is what really happened."
    example_gloss: "The fact is what really happened."
  es.c1.unit05.lesson05.teach.la_alternativa:
    title: "the alternative"
    gloss: "the alternative"
    note: "*La alternativa* is what could have been."
    example_gloss: "The alternative is what could have been."
  es.c1.unit05.lesson05.teach.leer_note:
    title: "Reading a counterfactual chain"
    gloss: "A counterfactual chain distinguishes the fact, the regret, and the hypothetical consequence."
    note: "Separate: what happened, what is regretted, what would have resulted."

  es.c1.unit05.lesson06.teach.mateo_mixto:
    title: "Mateo: If I had accepted the transfer, I would be living in Barcelona now."
    gloss: "Mateo: If I had accepted the transfer, I would be living in Barcelona now."
    note: "A mixed conditional: past condition (*hubiera aceptado*) + present consequence (*viviría*)."
  es.c1.unit05.lesson06.teach.elena_pregunta:
    title: "Elena: And do you regret not having accepted it?"
    gloss: "Elena: And do you regret not having accepted it?"
    note: "Elena asks about the regret."
  es.c1.unit05.lesson06.teach.mateo_arrepentimiento:
    title: "Mateo: I regret not having tried it."
    gloss: "Mateo: I regret not having tried it."
    note: "Mateo's regret: *Me arrepiento de no haberlo intentado*."
  es.c1.unit05.lesson06.teach.elena_pasado:
    title: "Elena: If you had accepted, you would have lived by the sea."
    gloss: "Elena: If you had accepted, you would have lived by the sea."
    note: "Elena's past counterfactual in the *tú* form."
  es.c1.unit05.lesson06.teach.mateo_presente:
    title: "Mateo: Yes, but then I would not be here with you."
    gloss: "Mateo: Yes, but then I would not be here with you."
    note: "Mateo's present consequence."
  es.c1.unit05.lesson06.teach.modelo_analisis:
    title: "A model analysis"
    gloss: "If I had accepted the transfer, I would have lived in Barcelona. If I had accepted, I wouldn't be in this office now. I regret not having tried it."
    note: "Past counterfactual, then mixed conditional, then regret -- in that order."

exercises:
  es.c1.unit05.lesson01.exercise01.recognize_contrafactual:
    instruction: "What does el contrafactual mean?"
    correct_option: "A scenario imagining a past that could have been different."
    distractors: ["A past event that really happened.", "A promise about the future.", "A greeting."]
    accepted_answers: [{value: "A scenario imagining a past that could have been different.", status: correct}]
    feedback: "*El contrafactual* imagines an alternative past."
  es.c1.unit05.lesson01.exercise02.recognize_arrepentimiento:
    instruction: "What does el arrepentimiento mean?"
    correct_option: "Looking back at the past with regret or sorrow."
    distractors: ["A plan for the future.", "A feeling of joy.", "A greeting."]
    accepted_answers: [{value: "Looking back at the past with regret or sorrow.", status: correct}]
    feedback: "*El arrepentimiento* is regret."
  es.c1.unit05.lesson01.exercise03.match_conceptos:
    instruction: "Match each Spanish counterfactual word to its English meaning."
    accepted_answers:
      - value: {"el contrafactual": "the counterfactual", "la hipótesis": "the hypothesis", "el pasado irreal": "the unreal past", "la consecuencia": "the consequence", "el arrepentimiento": "the regret", "el condicional compuesto": "the compound conditional"}
        status: correct
    feedback: "The building blocks of counterfactual reasoning."
  es.c1.unit05.lesson01.exercise04.order_pasado_irreal:
    instruction: "Put the Spanish words in order to say the unreal past did not happen."
    accepted_answers:
      - {value: "El pasado irreal no ocurrió", status: correct}
    feedback: "*El pasado irreal* is what did not occur."
  es.c1.unit05.lesson01.exercise05.translate_contrafactual:
    instruction: "Translate into Spanish: A counterfactual imagines a different past."
    accepted_answers:
      - {value: "Un contrafactual imagina un pasado distinto", status: correct}
    feedback: "*Imagina* -- the counterfactual imagines."
  es.c1.unit05.lesson01.exercise06.speak_hipotesis:
    instruction: "Say aloud in Spanish: A hypothesis about the past is a supposition."
    accepted_answers:
      - {value: "Una hipótesis sobre el pasado es una suposición", status: correct}
    feedback: "*Una hipótesis* is a supposition."

  es.c1.unit05.lesson02.exercise01.recognize_si_hubiera:
    instruction: "What does Si hubiera aceptado begin?"
    correct_option: "A past unreal condition -- something that did not happen."
    distractors: ["A real event.", "A future plan.", "A question."]
    accepted_answers: [{value: "A past unreal condition -- something that did not happen.", status: correct}]
    feedback: "*Si + hubiera + participio* opens the unreal condition."
  es.c1.unit05.lesson02.exercise02.recognize_habria_vivido:
    instruction: "What does habría vivido express?"
    correct_option: "A past hypothetical consequence."
    distractors: ["A real past event.", "A command.", "A present fact."]
    accepted_answers: [{value: "A past hypothetical consequence.", status: correct}]
    feedback: "*Habría + participio* is the hypothetical consequence."
  es.c1.unit05.lesson02.exercise03.match_pasado:
    instruction: "Match each past-counterfactual phrase to its English meaning."
    accepted_answers:
      - value: {"Si hubiera aceptado": "if I had accepted", "habría vivido": "I would have lived", "habría sido": "it would have been", "el traslado": "the transfer", "renunciar": "to turn down / forgo", "la oportunidad": "the opportunity"}
        status: correct
    feedback: "The past counterfactual links condition and consequence."
  es.c1.unit05.lesson02.exercise04.order_habria_vivido:
    instruction: "Put the Spanish words in order to say I would have lived in Barcelona."
    accepted_answers:
      - {value: "Habría vivido en Barcelona", status: correct}
    feedback: "*Habría vivido* -- the past consequence."
  es.c1.unit05.lesson02.exercise05.translate_pasado:
    instruction: "Translate into Spanish: If I had accepted the transfer, I would have lived in Barcelona."
    accepted_answers:
      - {value: "Si hubiera aceptado el traslado, habría vivido en Barcelona", status: correct}
      - {value: "Habría vivido en Barcelona si hubiera aceptado el traslado", status: correct}
    feedback: "*Si hubiera aceptado* (condition), *habría vivido* (consequence)."
  es.c1.unit05.lesson02.exercise06.speak_pasado:
    instruction: "Say aloud in Spanish: I would have accepted the transfer."
    accepted_answers:
      - {value: "Habría aceptado el traslado", status: correct}
    feedback: "*Habría aceptado* -- would have accepted."

  es.c1.unit05.lesson03.exercise01.recognize_ahora_estaria:
    instruction: "What does ahora estaría link?"
    correct_option: "A past condition to a present consequence."
    distractors: ["Two past events.", "Two future events.", "A past event to a past consequence."]
    accepted_answers: [{value: "A past condition to a present consequence.", status: correct}]
    feedback: "*Ahora + condicional simple* expresses the present consequence."
  es.c1.unit05.lesson03.exercise02.recognize_ahora_viviria:
    instruction: "What does ahora viviría express?"
    correct_option: "Where the person would be living now."
    distractors: ["Where they lived.", "Where they will live.", "A question."]
    accepted_answers: [{value: "Where the person would be living now.", status: correct}]
    feedback: "*Ahora viviría* is the present result."
  es.c1.unit05.lesson03.exercise03.match_mixto:
    instruction: "Match each mixed-conditional phrase to its English meaning."
    accepted_answers:
      - value: {"ahora estaría": "I would now be", "ahora viviría": "I would be living now", "ahora tendría": "I would now have", "la vida": "life", "la condición": "the condition", "el pasado irreal": "the unreal past"}
        status: correct
    feedback: "The mixed conditional joins a past condition to a present result."
  es.c1.unit05.lesson03.exercise04.order_ahora_estaria:
    instruction: "Put the Spanish words in order to say I would now be in Barcelona."
    accepted_answers:
      - {value: "Ahora estaría en Barcelona", status: correct}
    feedback: "*Ahora estaría* -- the present consequence."
  es.c1.unit05.lesson03.exercise05.translate_mixto:
    instruction: "Translate into Spanish: If I had accepted, I would be living in Barcelona now."
    accepted_answers:
      - {value: "Si hubiera aceptado, ahora viviría en Barcelona", status: correct}
      - {value: "Si hubiera aceptado, viviría ahora en Barcelona", status: correct}
      - {value: "Ahora viviría en Barcelona si hubiera aceptado", status: correct}
    feedback: "*Si hubiera aceptado* (past), *ahora viviría* (present)."
  es.c1.unit05.lesson03.exercise06.speak_mixto:
    instruction: "Say aloud in Spanish: If I had accepted, my life would be different now."
    accepted_answers:
      - {value: "Si hubiera aceptado, ahora mi vida sería distinta", status: correct}
      - {value: "Si hubiera aceptado, mi vida ahora sería distinta", status: correct}
    feedback: "*Ahora mi vida sería distinta* -- the present consequence."

  es.c1.unit05.lesson04.exercise01.recognize_ojala:
    instruction: "What does Ojalá hubiera aceptado express?"
    correct_option: "A wish that the past had been different -- regret."
    distractors: ["A plan.", "A fact.", "A demand."]
    accepted_answers: [{value: "A wish that the past had been different -- regret.", status: correct}]
    feedback: "*Ojalá + hubiera + participio* regrets the past."
  es.c1.unit05.lesson04.exercise02.recognize_me_arrepiento:
    instruction: "What does Me arrepiento de express?"
    correct_option: "Regret about a past action."
    distractors: ["Joy.", "Indifference.", "A question."]
    accepted_answers: [{value: "Regret about a past action.", status: correct}]
    feedback: "*Me arrepiento de* expresses regret."
  es.c1.unit05.lesson04.exercise03.match_arrepentimiento:
    instruction: "Match each regret phrase to its English meaning."
    accepted_answers:
      - value: {"Ojalá hubiera aceptado": "if only I had accepted", "Me arrepiento de": "I regret", "Si hubiera sabido": "if I had known", "lamentar": "to regret / lament", "la pena": "the sorrow / pity", "el arrepentimiento": "the regret"}
        status: correct
    feedback: "These frames express regret about the past."
  es.c1.unit05.lesson04.exercise04.order_me_arrepiento:
    instruction: "Put the Spanish words in order to say I regret not having tried it."
    accepted_answers:
      - {value: "Me arrepiento de no haberlo intentado", status: correct}
    feedback: "*Me arrepiento de no haberlo intentado* -- genuine regret."
  es.c1.unit05.lesson04.exercise05.translate_ojala:
    instruction: "Translate into Spanish: If only I had accepted the transfer."
    accepted_answers:
      - {value: "Ojalá hubiera aceptado el traslado", status: correct}
    feedback: "*Ojalá hubiera aceptado* -- a wish about the past."
  es.c1.unit05.lesson04.exercise06.speak_arrepentimiento:
    instruction: "Say aloud in Spanish: I regret not having tried it."
    accepted_answers:
      - {value: "Me arrepiento de no haberlo intentado", status: correct}
      - {value: "Lamento no haberlo intentado", status: correct}
    feedback: "*Me arrepiento de no haberlo intentado*."

  es.c1.unit05.lesson05.exercise01.read_hecho:
    instruction: "What actually happened to Mateo in the passage?"
    correct_option: "He was offered a transfer to Barcelona and said no."
    distractors: ["He moved to Barcelona.", "He regrets moving to London.", "He accepted the transfer."]
    accepted_answers: [{value: "He was offered a transfer to Barcelona and said no.", status: correct}]
    feedback: "The fact: Mateo turned down the Barcelona transfer."
  es.c1.unit05.lesson05.exercise02.read_consecuencia:
    instruction: "What would have happened if he had accepted?"
    correct_option: "He would have lived by the sea."
    distractors: ["He would have stayed in London.", "He would have retired.", "Nothing would have changed."]
    accepted_answers: [{value: "He would have lived by the sea.", status: correct}]
    feedback: "The hypothetical result: *habría vivido junto al mar*."
  es.c1.unit05.lesson05.exercise03.read_arrepentimiento:
    instruction: "How does the passage express regret?"
    correct_option: "With 'Ojalá hubiera aceptado'."
    distractors: ["With 'habría vivido'.", "With a direct command.", "It does not express regret."]
    accepted_answers: [{value: "With 'Ojalá hubiera aceptado'.", status: correct}]
    feedback: "*Ojalá hubiera aceptado* is the regret."
  es.c1.unit05.lesson05.exercise04.read_mezcla:
    instruction: "What does the mixed conditional su vida sería distinta link together?"
    correct_option: "A past condition to a present consequence."
    distractors: ["Two past events.", "Two future events.", "A cause to a past result."]
    accepted_answers: [{value: "A past condition to a present consequence.", status: correct}]
    feedback: "*Su vida sería distinta* is the present consequence of a past choice."
  es.c1.unit05.lesson05.exercise05.match_cadena:
    instruction: "Match each counterfactual-chain word to its English meaning."
    accepted_answers:
