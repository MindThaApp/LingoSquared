answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on habits, changes and everyday routines."
  learning_goal: "Talk about habits, changes and routines in Spanish with the right verb chunks."
units:
  es.a2.unit103.empezar_y_dejar: {"title": "Starting and Stopping", "description": "Say what you started, stopped, tried or forgot to do, such as a sport, a habit or screen time, with empezar a, dejar de, intentar, volver a, acabar de and olvidar."}
lessons:
  es.a2.unit103.lesson01.empiezo_a_dejo_de: {"title": "I Start, I Stop"}
  es.a2.unit103.lesson02.he_empezado_he_dejado: {"title": "I Have Started, I Have Stopped"}
  es.a2.unit103.lesson03.intentar_volver_acabar: {"title": "Trying, Again, Just Now"}
  es.a2.unit103.lesson04.he_olvidado_llamar: {"title": "I Forgot to Call"}
  es.a2.unit103.lesson05.el_mensaje_de_mateo: {"title": "Mateo's Message"}
  es.a2.unit103.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit103.lesson01.teach.gn_empezar: {"title": "Empezar a + infinitive", "gloss": "I start running. You start swimming. Elena starts playing tennis. We start running. They start swimming.", "note": "*Empezar a* + infinitive says that you begin an activity. The verb changes with the person, but the infinitive after *a* never changes. Notice the stem change in *empiezo*, *empiezas*, *empieza*, *empiezan*, but not in *empezamos*."}
  es.a2.unit103.lesson01.teach.gn_dejar: {"title": "Dejar de + infinitive", "gloss": "I stop eating sweets. You stop using the phone. Mateo stops watching TV. We stop running. They stop swimming.", "note": "*Dejar de* + infinitive says that you stop doing something, for example a habit. The small word *de* is always there, and the verb after it stays in the infinitive."}
  es.a2.unit103.lesson01.teach.palabras: {"title": "Habits and sports", "gloss": "to run / to swim / to play tennis / to use the phone / to watch TV / to eat sweets", "note": "*El móvil* is the usual word for a mobile phone in Spain; in much of Latin America people say *el celular*. *La tele* is short for *la televisión*.", "example_gloss": ["Mateo starts running in the morning.", "Elena stops eating sweets.", "I stop using the phone at ten.", "We start playing tennis."]}
  es.a2.unit103.lesson01.teach.gn_opuestos: {"title": "Opposites", "gloss": "I start watching TV. I stop watching TV. I start using the phone. I stop using the phone.", "note": "*Empezar a* and *dejar de* are opposites. The same verb can follow either one."}
  es.a2.unit103.lesson01.teach.frases: {"title": "Three sentences", "gloss": "I start running. I stop eating sweets. Elena starts swimming."}
  es.a2.unit103.lesson02.teach.gn_empezado: {"title": "Empezar a in the perfect", "gloss": "I have started running. You have started swimming. Elena has started playing tennis. We have started running. They have started swimming.", "note": "To say what has happened, use *haber* + *empezado* and then *a* + infinitive. Only *haber* changes with the person: *he, has, ha, hemos, han*. *Empezado* never changes."}
  es.a2.unit103.lesson02.teach.gn_dejado: {"title": "Dejar de in the perfect", "gloss": "I have stopped eating sweets. You have stopped using the phone. Mateo has stopped watching TV. We have stopped running. They have stopped swimming.", "note": "Same idea with *dejado*: *haber* + *dejado* + *de* + infinitive. The simple past is not used in this unit; the perfect tells what you have changed in your habits."}
  es.a2.unit103.lesson02.teach.formas: {"title": "Perfect forms", "gloss": "I have started / you have stopped / he or she has started / we have stopped / they have stopped", "note": "The participles *empezado* and *dejado* are regular. *Ha* is used for *él*, *ella* and *usted*.", "example_gloss": ["Elena has started swimming this month.", "Mateo has stopped watching TV at night.", "We have stopped eating sweets.", "I have started running with Mateo."]}
  es.a2.unit103.lesson02.teach.gn_contraste: {"title": "Present or perfect?", "gloss": "I start running. I have started running. I stop eating sweets. I have stopped eating sweets.", "note": "The present (*empiezo a*) is for a current habit or plan. The perfect (*he empezado a*) says that the change has happened in this period of time."}
  es.a2.unit103.lesson02.teach.gn_este_mes: {"title": "This month, this week, today", "gloss": "This month I have started swimming. This week we have stopped watching TV. Today I have stopped using the phone.", "note": "Words like *este mes*, *esta semana* and *hoy* go very well with the perfect, because the period of time is not finished yet."}
  es.a2.unit103.lesson02.teach.frases: {"title": "Three sentences", "gloss": "I have started running. You have stopped eating sweets. Elena has started swimming."}
  es.a2.unit103.lesson03.teach.gn_intentar: {"title": "Intentar + infinitive", "gloss": "I try to sleep. You try to run. Elena tries to swim. I have tried to sleep. Mateo has tried to run.", "note": "*Intentar* is followed directly by the infinitive, with no small word in between. In the perfect, *he intentado dormir* says that you have tried."}
  es.a2.unit103.lesson03.teach.gn_volver: {"title": "Volver a + infinitive", "gloss": "I play football again. Elena swims again. I have started playing football again. Mateo has started running again.", "note": "*Volver a* + infinitive means to do something again. The participle of *volver* is irregular: *vuelto*."}
  es.a2.unit103.lesson03.teach.gn_acabar: {"title": "Acabar de + infinitive", "gloss": "I have just arrived. Elena has just left. Mateo has just eaten. We have just run.", "note": "*Acabar de* + infinitive says that something happened a moment ago. Use *acabar* in the present: *acabo de llegar*, not a perfect form."}
  es.a2.unit103.lesson03.teach.palabras: {"title": "Three useful chunks", "gloss": "to try / to do again / to have just / to sleep / football / to arrive", "note": "*Acabar de* is a very common way to say *just*.", "example_gloss": ["Mateo has tried to sleep early.", "Elena has started playing football again.", "I have just arrived home.", "We have just eaten."]}
  es.a2.unit103.lesson03.teach.gn_contraste: {"title": "Three different ideas", "gloss": "I try to run. I run again. I have just run. I have tried to run. I have started running again.", "note": "Each chunk adds a different idea: *intentar* is an effort, *volver a* is again, *acabar de* is a moment ago."}
  es.a2.unit103.lesson03.teach.frases: {"title": "Three sentences", "gloss": "I have tried to sleep. I have started playing football again. I have just arrived."}
  es.a2.unit103.lesson04.teach.gn_olvidar: {"title": "Olvidar + infinitive", "gloss": "I have forgotten to call my grandmother. You have forgotten to call your uncle. Elena has forgotten to call her grandmother. We have forgotten to call.", "note": "*Olvidar* is followed directly by the infinitive. With the perfect it says that you did not do something you should have done. *Mi*, *tu* and *su* mean my, your and his or her."}
  es.a2.unit103.lesson04.teach.gn_orden: {"title": "Word order", "gloss": "He or she has forgotten to call. Elena has forgotten to call her grandmother. I have not forgotten to call my uncle.", "note": "*Haber* and the participle stay together. *No* goes before *haber*: *no he olvidado*."}
  es.a2.unit103.lesson04.teach.palabras: {"title": "Family and calls", "gloss": "to call / to forget / the grandmother / the uncle / the village", "note": "Elena's grandparents have a house in a village, and Mateo's uncle lives in Barcelona.", "example_gloss": ["Mateo has forgotten to call his uncle.", "Elena has forgotten to call her grandmother.", "My uncle lives in Barcelona.", "Now Mateo no longer eats sweets."]}
  es.a2.unit103.lesson04.teach.gn_cuatro: {"title": "Four ideas", "gloss": "I have started sleeping early. I have stopped eating sweets. I have tried to run. I have forgotten to call my uncle.", "note": "Look at the small words: *empezar a*, *dejar de*, but *intentar* and *olvidar* go straight to the infinitive. All four use the same perfect pattern."}
  es.a2.unit103.lesson04.teach.gn_contraste: {"title": "Tried or forgot?", "gloss": "I have tried to call my grandmother. I have forgotten to call my grandmother.", "note": "*Intentar* means you made an effort. *Olvidar* means it did not happen because you forgot."}
  es.a2.unit103.lesson04.teach.frases: {"title": "Three sentences", "gloss": "I have forgotten to call my grandmother. Elena has tried to sleep. Mateo has stopped eating sweets."}
  es.a2.unit103.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "the routine / new / work / early / easy", "note": "*Nueva* agrees with *rutina*, which is feminine.", "example_gloss": ["I have a new routine.", "Mateo leaves work at six.", "At night I stop using the phone.", "It is not easy to sleep early."]}
  es.a2.unit103.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "I have started running after work. At night I have stopped using the phone.", "note": "In the message, each sentence tells one change with the perfect. Look for *he empezado a*, *he dejado de*, *he intentado* and *he olvidado*."}
  es.a2.unit103.lesson05.teach.lectura: {"title": "Mateo writes to Elena", "gloss": "Hi, Elena. This week I have a new routine. I have started running after work. I have stopped using my phone at night. I have tried to sleep early, but it is not easy. And I have forgotten to call my uncle in Barcelona. And you? Have you stopped looking at your phone on the train?", "note": "Each sentence names a change with *he* + participle.", "glosses": {"rutina": "routine", "después": "after", "trabajo": "work", "noche": "night", "temprano": "early", "fácil": "easy", "mirar": "to look at"}}
  es.a2.unit103.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. How is the new routine?"}
  es.a2.unit103.lesson06.teach.d2: {"title": "Mateo answers", "gloss": "Mateo: Good. I have started going out on my bike after work. And you?"}
  es.a2.unit103.lesson06.teach.d3: {"title": "Elena has stopped", "gloss": "Elena: I have stopped looking at my phone on the train."}
  es.a2.unit103.lesson06.teach.d4: {"title": "Mateo asks more", "gloss": "Mateo: Really? And what do you do now?"}
  es.a2.unit103.lesson06.teach.d5: {"title": "Elena has forgotten", "gloss": "Elena: I look out of the window. It is calmer. But I have forgotten to call my grandmother."}
  es.a2.unit103.lesson06.teach.d6: {"title": "Mateo suggests", "gloss": "Mateo: You have just arrived home. You can call your grandmother now."}
exercises:
  es.a2.unit103.lesson01.exercise01.elige_empiezo: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Empiezo a correr.", "distractors": ["Empiezo correr.", "Empiezo de correr.", "Dejo a correr."], "accepted_answers": [{"value": "Empiezo a correr.", "status": "correct"}], "feedback": "*Empezar a* + infinitive: *Empiezo a correr*."}
  es.a2.unit103.lesson01.exercise02.elige_deja: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena deja de comer dulces.", "distractors": ["Elena deja a comer dulces.", "Elena empieza de comer dulces.", "Elena deja comer dulces."], "accepted_answers": [{"value": "Elena deja de comer dulces.", "status": "correct"}], "feedback": "*Dejar de* + infinitive: *deja de comer*."}
  es.a2.unit103.lesson01.exercise03.une_habitos: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "empezar a correr", "right": "to start running"}, {"left": "dejar de comer dulces", "right": "to stop eating sweets"}, {"left": "nadar", "right": "to swim"}, {"left": "jugar al tenis", "right": "to play tennis"}, {"left": "usar el móvil", "right": "to use the phone"}, {"left": "ver la tele", "right": "to watch TV"}, {"left": "correr", "right": "to run"}, {"left": "comer dulces", "right": "to eat sweets"}], "status": "correct"}], "feedback": "*Empezar a* and *dejar de* take an infinitive."}
  es.a2.unit103.lesson01.exercise04.ordena_correr: {"instruction": "Put the words in order to say 'Mateo starts running in the morning.'", "correct_option": "Mateo empieza a correr por la mañana", "accepted_answers": [{"value": "Mateo empieza a correr por la mañana", "status": "correct"}], "feedback": "The pattern is *empieza a* + infinitive."}
  es.a2.unit103.lesson01.exercise05.completa_empieza: {"instruction": "Complete with the correct form of *empezar*.", "correct_option": "empieza", "accepted_answers": [{"value": "empieza", "status": "correct"}], "feedback": "*Mateo empieza a correr*: *él* takes *empieza*."}
  es.a2.unit103.lesson01.exercise06.traduce_dejo: {"instruction": "Translate into Spanish. Use *dejar de*.", "accepted_answers": [{"value": "Dejo de usar el móvil a las diez.", "status": "correct"}, {"value": "Dejo de usar el móvil a las diez", "status": "correct"}, {"value": "Yo dejo de usar el móvil a las diez.", "status": "correct"}, {"value": "Yo dejo de usar el móvil a las diez", "status": "correct"}, {"value": "A las diez dejo de usar el móvil.", "status": "correct"}, {"value": "A las diez dejo de usar el móvil", "status": "correct"}, {"value": "A las diez yo dejo de usar el móvil.", "status": "correct"}, {"value": "A las diez yo dejo de usar el móvil", "status": "correct"}], "feedback": "*Dejo de usar el móvil a las diez.*"}
  es.a2.unit103.lesson01.exercise07.escribe_tenis: {"instruction": "Write the sentence with *empezar a*.", "correct_option": "Elena empieza a jugar al tenis.", "accepted_answers": [{"value": "Elena empieza a jugar al tenis.", "status": "correct"}, {"value": "Elena empieza a jugar al tenis", "status": "correct"}], "feedback": "*Elena empieza a jugar al tenis.*"}
  es.a2.unit103.lesson02.exercise01.elige_ha: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena ha empezado a nadar.", "distractors": ["Elena ha empezar a nadar.", "Elena has empezado a nadar.", "Elena ha empezado de nadar."], "accepted_answers": [{"value": "Elena ha empezado a nadar.", "status": "correct"}], "feedback": "*Ha empezado a* + infinitive."}
  es.a2.unit103.lesson02.exercise02.elige_hemos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Hemos dejado de ver la tele.", "distractors": ["Hemos dejado a ver la tele.", "Han dejado de ver la tele.", "Hemos dejar de ver la tele."], "accepted_answers": [{"value": "Hemos dejado de ver la tele.", "status": "correct"}], "feedback": "*Nosotros* takes *hemos*, then *dejado de* + infinitive."}
  es.a2.unit103.lesson02.exercise03.une_formas: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "he empezado", "right": "I have started"}, {"left": "has dejado", "right": "you have stopped"}, {"left": "ha empezado", "right": "he or she has started"}, {"left": "hemos dejado", "right": "we have stopped"}, {"left": "han empezado", "right": "they have started"}, {"left": "ha dejado", "right": "he or she has stopped"}, {"left": "empezado", "right": "started (participle)"}, {"left": "dejado", "right": "stopped (participle)"}], "status": "correct"}], "feedback": "Only *haber* changes with the person."}
  es.a2.unit103.lesson02.exercise04.ordena_mes: {"instruction": "Put the words in order to say 'This month I have started swimming.'", "correct_option": "Este mes he empezado a nadar", "accepted_answers": [{"value": "Este mes he empezado a nadar", "status": "correct"}], "feedback": "*Este mes* first, then *he empezado a* + infinitive."}
  es.a2.unit103.lesson02.exercise05.completa_ha: {"instruction": "Complete with the correct form of *haber*.", "correct_option": "ha", "accepted_answers": [{"value": "ha", "status": "correct"}], "feedback": "*Mateo ha dejado*: *él* takes *ha*."}
  es.a2.unit103.lesson02.exercise06.traduce_hemos: {"instruction": "Translate into Spanish. Use *haber* + *empezado a*.", "accepted_answers": [{"value": "Hemos empezado a correr.", "status": "correct"}, {"value": "Hemos empezado a correr", "status": "correct"}, {"value": "Nosotros hemos empezado a correr.", "status": "correct"}, {"value": "Nosotros hemos empezado a correr", "status": "correct"}], "feedback": "*Hemos empezado a correr.*"}
  es.a2.unit103.lesson02.exercise07.escribe_has: {"instruction": "Write the sentence with *dejar de* in the perfect, using *tú*.", "correct_option": "Has dejado de comer dulces.", "accepted_answers": [{"value": "Has dejado de comer dulces.", "status": "correct"}, {"value": "Has dejado de comer dulces", "status": "correct"}, {"value": "Tú has dejado de comer dulces.", "status": "correct"}, {"value": "Tú has dejado de comer dulces", "status": "correct"}], "feedback": "*Has dejado de comer dulces.*"}
  es.a2.unit103.lesson03.exercise01.elige_vuelto: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "He vuelto a jugar al fútbol.", "distractors": ["He vuelto de jugar al fútbol.", "He volver a jugar al fútbol.", "Ha vuelto a jugar al fútbol."], "accepted_answers": [{"value": "He vuelto a jugar al fútbol.", "status": "correct"}], "feedback": "*Haber* + *vuelto a* + infinitive."}
  es.a2.unit103.lesson03.exercise02.elige_acabo: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Acabo de llegar.", "distractors": ["Acabo llegar.", "Acabo a llegar.", "Acabas de llegar."], "accepted_answers": [{"value": "Acabo de llegar.", "status": "correct"}], "feedback": "*Acabar de* + infinitive: *Acabo de llegar*."}
  es.a2.unit103.lesson03.exercise03.une_cadenas: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "intentar dormir", "right": "to try to sleep"}, {"left": "volver a jugar", "right": "to play again"}, {"left": "acabar de llegar", "right": "to have just arrived"}, {"left": "he intentado", "right": "I have tried"}, {"left": "he vuelto a correr", "right": "I have started running again"}, {"left": "acaba de salir", "right": "he or she has just left"}, {"left": "dormir", "right": "to sleep"}, {"left": "el fútbol", "right": "football"}], "status": "correct"}], "feedback": "Match the chunk to its idea: trying, again, just now."}
  es.a2.unit103.lesson03.exercise04.ordena_futbol: {"instruction": "Put the words in order to say 'Elena has started playing football again.'", "correct_option": "Elena ha vuelto a jugar al fútbol", "accepted_answers": [{"value": "Elena ha vuelto a jugar al fútbol", "status": "correct"}], "feedback": "*Ha vuelto a* + infinitive."}
  es.a2.unit103.lesson03.exercise05.completa_de: {"instruction": "Complete with the small word that follows *acabar*.", "correct_option": "de", "accepted_answers": [{"value": "de", "status": "correct"}], "feedback": "*Acabar de* + infinitive."}
  es.a2.unit103.lesson03.exercise06.traduce_dormir: {"instruction": "Translate into Spanish. Use *intentar* in the perfect.", "accepted_answers": [{"value": "Elena ha intentado dormir temprano.", "status": "correct"}, {"value": "Elena ha intentado dormir temprano", "status": "correct"}, {"value": "Ha intentado dormir temprano Elena.", "status": "correct"}, {"value": "Ha intentado dormir temprano Elena", "status": "correct"}], "feedback": "*Elena ha intentado dormir temprano.*"}
  es.a2.unit103.lesson03.exercise07.escribe_acabamos: {"instruction": "Write the sentence with *acabar de*.", "correct_option": "Acabamos de comer.", "accepted_answers": [{"value": "Acabamos de comer.", "status": "correct"}, {"value": "Acabamos de comer", "status": "correct"}, {"value": "Nosotros acabamos de comer.", "status": "correct"}, {"value": "Nosotros acabamos de comer", "status": "correct"}], "feedback": "*Acabamos de comer.*"}
  es.a2.unit103.lesson04.exercise01.elige_olvidado: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "He olvidado llamar a mi abuela.", "distractors": ["He olvidado a llamar a mi abuela.", "He olvidar llamar a mi abuela.", "He olvidado de llamar a mi abuela."], "accepted_answers": [{"value": "He olvidado llamar a mi abuela.", "status": "correct"}], "feedback": "*Olvidar* + infinitive, with no small word."}
  es.a2.unit103.lesson04.exercise02.elige_intentado: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo ha intentado dormir.", "distractors": ["Mateo ha olvidado dormir.", "Mateo ha dejado de dormir.", "Mateo ha empezado a dormir."], "accepted_answers": [{"value": "Mateo ha intentado dormir.", "status": "correct"}], "feedback": "*Intentado* = tried. The other verbs change the meaning."}
  es.a2.unit103.lesson04.exercise03.une_cuatro: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "he empezado a correr", "right": "I have started running"}, {"left": "he dejado de correr", "right": "I have stopped running"}, {"left": "he intentado correr", "right": "I have tried to run"}, {"left": "he olvidado llamar", "right": "I have forgotten to call"}, {"left": "he vuelto a correr", "right": "I have gone back to running"}, {"left": "acabo de correr", "right": "I have just run"}, {"left": "mi tío", "right": "my uncle"}, {"left": "mi abuela", "right": "my grandmother"}, {"left": "llamar", "right": "to call"}], "status": "correct"}], "feedback": "Each verb chunk gives a different meaning."}
  es.a2.unit103.lesson04.exercise04.ordena_abuela: {"instruction": "Put the words in order to say 'Elena has forgotten to call her grandmother.'", "correct_option": "Elena ha olvidado llamar a su abuela", "accepted_answers": [{"value": "Elena ha olvidado llamar a su abuela", "status": "correct"}], "feedback": "*Ha olvidado llamar* + *a su abuela*."}
  es.a2.unit103.lesson04.exercise05.completa_dejado: {"instruction": "Complete with the participle that fits the meaning.", "correct_option": "dejado", "accepted_answers": [{"value": "dejado", "status": "correct"}], "feedback": "*Dejado de*: Mateo has stopped eating sweets."}
  es.a2.unit103.lesson04.exercise06.traduce_olvidado: {"instruction": "Translate into Spanish. Use *olvidar* in the perfect.", "accepted_answers": [{"value": "He olvidado llamar a mi tío.", "status": "correct"}, {"value": "He olvidado llamar a mi tío", "status": "correct"}, {"value": "Yo he olvidado llamar a mi tío.", "status": "correct"}, {"value": "Yo he olvidado llamar a mi tío", "status": "correct"}], "feedback": "*He olvidado llamar a mi tío.*"}
