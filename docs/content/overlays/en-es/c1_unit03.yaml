course:
  title: Spanish C1
  description: >-
    Advanced Spanish register and tone: exercise fine-grained control of
    tone and register, shifting between formal, diplomatic, ironic, and
    emphatic styles to suit the audience and the intent.

units:
  es.c1.unit03.controlar_el_tono:
    title: "Controlling tone and register"
    description: "Shift between formal, diplomatic, ironic, and emphatic registers, choosing the style that fits the audience and the intent."

lessons:
  es.c1.unit03.lesson01.los_registros:
    title: "The registers"
  es.c1.unit03.lesson02.el_registro_formal:
    title: "The formal register"
  es.c1.unit03.lesson03.el_registro_diplomatico:
    title: "The diplomatic register"
  es.c1.unit03.lesson04.el_registro_expresivo:
    title: "The expressive register: emphatic and ironic"
  es.c1.unit03.lesson05.leer_el_tono:
    title: "Reading the tone"
  es.c1.unit03.lesson06.cambiar_de_registro:
    title: "Shifting register"

teaching:
  es.c1.unit03.lesson01.teach.el_registro:
    title: "the register"
    gloss: "register / style of language"
    note: "*El registro* is the variety of language you choose for a given situation -- formal, diplomatic, ironic, or emphatic."
    example_gloss: "Each situation calls for a different register."
  es.c1.unit03.lesson01.teach.formal:
    title: "formal"
    gloss: "formal"
    note: "*Formal* is the register used with a *desconocido* (stranger) -- usted, polite forms, full sentences."
    example_gloss: "With a stranger, the address is formal."
  es.c1.unit03.lesson01.teach.informal:
    title: "informal"
    gloss: "informal"
    note: "*Informal* is the register used with friends -- tú, relaxed vocabulary, short forms."
    example_gloss: "With friends, the address is informal."
  es.c1.unit03.lesson01.teach.el_trato:
    title: "manner of address"
    gloss: "manner of address / treatment"
    note: "*El trato* is the way you address someone -- the tú/usted choice that anchors the register."
    example_gloss: "The formal form of address is more courteous."
  es.c1.unit03.lesson01.teach.el_destinatario:
    title: "the addressee"
    gloss: "the addressee / recipient"
    note: "*El destinatario* is the person you are writing or speaking to; the register is chosen to fit them."
    example_gloss: "The register depends on the addressee."
  es.c1.unit03.lesson01.teach.la_cortesia:
    title: "courtesy"
    gloss: "courtesy / politeness"
    note: "*La cortesía* is the politeness that motivates the formal and diplomatic registers."
    example_gloss: "Courtesy demands respectful treatment."
  es.c1.unit03.lesson01.teach.registro_note:
    title: "The four registers"
    gloss: "The register changes with the addressee: formal, diplomatic, ironic, or emphatic."
    note: "This is the unit's map: one register for each audience and intent."

  es.c1.unit03.lesson02.teach.usted:
    title: "usted (formal you)"
    gloss: "usted (the formal you)"
    note: "*Usted* is the formal 'you'. It takes third-person verb forms: *¿Cómo está usted?* (not *estás*)."
    example_gloss: "How are you, Mr García?"
  es.c1.unit03.lesson02.teach.le:
    title: "le"
    gloss: "to you (formal) / indirect-object pronoun"
    note: "*Le* marks the formal addressee: *Le escribo* (I am writing to you, formal). It also works as an indirect-object pronoun."
    example_gloss: "I am writing to inform you of the fault."
  es.c1.unit03.lesson02.teach.estimado:
    title: "Dear Mr García"
    gloss: "Dear Mr García"
    note: "*Estimado señor García* opens a formal letter. *Estimado* is the formal equivalent of 'Dear'."
  es.c1.unit03.lesson02.teach.le_escribo:
    title: "I am writing to inform you"
    gloss: "I am writing to inform you of the fault."
    note: "*Le escribo para informarle de...* is the standard formal-email opener."
  es.c1.unit03.lesson02.teach.la_calefaccion:
    title: "the heating"
    gloss: "the heating"
    note: "*La calefacción* is the heating -- the subject of the unit's complaint."
    example_gloss: "The heating has been broken down for a week."
  es.c1.unit03.lesson02.teach.le_agradeceria:
    title: "I would be grateful if you"
    gloss: "I would be grateful if you could fix it as soon as possible."
    note: "*Le agradecería que* + subjunctive (*solucionara*) is the key formal, polite request."
  es.c1.unit03.lesson02.teach.atentamente:
    title: "yours faithfully"
    gloss: "yours faithfully / sincerely"
    note: "*Atentamente* is the standard formal letter-closing, placed before the signature."
  es.c1.unit03.lesson02.teach.formal_note:
    title: "How the formal register works"
    gloss: "With the formal form of address you use le, su, and third-person verb forms."
    note: "The formal register shows in three places: the pronoun (*usted*), the object (*le*, *su*), and the verb (*está*, *solucionara*)."

  es.c1.unit03.lesson03.teach.me_gustaria:
    title: "I would like to point out"
    gloss: "I would like to point out that..."
    note: "*Me gustaría señalar que...* opens a point diplomatically -- the conditional *gustaría* softens it."
  es.c1.unit03.lesson03.teach.quizas:
    title: "perhaps"
    gloss: "perhaps / maybe"
    note: "*Quizá* softens a complaint by admitting the other side may have a reason."
    example_gloss: "Perhaps you have not received our message."
  es.c1.unit03.lesson03.teach.podria:
    title: "could you"
    gloss: "Could you, with all due respect, give us a date?"
    note: "*¿Podría...?* makes a request without imposing -- the polite conditional form of *poder*."
  es.c1.unit03.lesson03.teach.entiendo_que:
    title: "I understand that"
    gloss: "I understand that you are very busy."
    note: "*Entiendo que* concedes the other side first, which makes the request that follows sound reasonable."
  es.c1.unit03.lesson03.teach.con_todo_respeto:
    title: "with all due respect"
    gloss: "with all due respect"
    note: "*Con todo respeto* cushions a criticism or request, keeping it diplomatic."
    example_gloss: "With all due respect, this cannot go on."
  es.c1.unit03.lesson03.teach.diplomatico_note:
    title: "How the diplomatic register works"
    gloss: "The diplomatic register softens a complaint with conditionals and courtesy."
    note: "The tools: *me gustaría*, *quizá*, *¿podría...?*, *con todo respeto*, *entiendo que*."

  es.c1.unit03.lesson04.teach.ya_es_suficiente:
    title: "enough is enough"
    gloss: "that's enough"
    note: "*¡Ya es suficiente!* is emphatic: the speaker has run out of patience."
  es.c1.unit03.lesson04.teach.estamos_hartos:
    title: "we are fed up"
    gloss: "we are fed up"
    note: "*Estamos hartos* is the everyday emphatic complaint."
  es.c1.unit03.lesson04.teach.exigimos:
    title: "we demand"
    gloss: "We demand an immediate solution."
    note: "*Exigimos* is the firmest emphatic form -- a demand, not a request."
  es.c1.unit03.lesson04.teach.de_ninguna_manera:
    title: "by no means"
    gloss: "By no means are we going to accept it."
    note: "*De ninguna manera* is an emphatic absolute refusal."
  es.c1.unit03.lesson04.teach.que_maravilla:
    title: "some service"
    gloss: "what wonderful customer service (said ironically)"
    note: "*Qué maravilla de atención al cliente* is ironic: it means the service is terrible."
  es.c1.unit03.lesson04.teach.total_hace_frio:
    title: "it's only cold"
    gloss: "Sure, no rush -- after all, it's only cold (said ironically)"
    note: "*Total, solo hace frío* is ironic: the speaker means it is freezing and urgent."
  es.c1.unit03.lesson04.teach.expresivo_note:
    title: "The expressive registers"
    gloss: "The expressive register either intensifies the stance (emphatic) or says the opposite (ironic)."
    note: "Emphatic adds force (*ya es suficiente*); ironic reverses the words (*qué maravilla*)."

  es.c1.unit03.lesson05.teach.correo_formal:
    title: "The formal email"
    gloss: "Dear Mr García: I am writing to inform you that the heating has been broken down for a week. I would be grateful if you could fix it as soon as possible. Yours faithfully, Elena and Mateo."
    glosses:
      Estimado: dear
      señor: Mr
      García: García
      Le: "to you (formal)"
      escribo: "I write"
      para: "to / in order to"
      informarle: "to inform you"
      calefacción: heating
      lleva: "has been going on for"
      semana: week
      averiada: "broken down"
      agradecería: "I would be grateful"
      solucionara: "would solve"
      antes: before
      posible: possible
      Atentamente: "yours faithfully"
      Elena: Elena
      Mateo: Mateo
    note: "A formal usted email: *Estimado* greeting, *le escribo para informarle* opening, *le agradecería que* request, *atentamente* closing. No tú forms anywhere."
  es.c1.unit03.lesson05.teach.mensaje_informal:
    title: "The informal message"
    gloss: "What a drag! The heating is still broken and the landlord does nothing. We are fed up."
    glosses:
      Qué: "what"
      rollo: "a drag / a pain"
      calefacción: heating
      sigue: "is still"
      rota: broken
      propietario: "landlord / owner"
      hace: does
      nada: nothing
      Estamos: "we are"
      hartos: "fed up"
    note: "An informal, emphatic message among friends: exclamation (*¡qué rollo!*), everyday words (*rota*, *hace nada*), and the emphatic *estamos hartos*. Same goal as the email -- fix the heating -- opposite register."
  es.c1.unit03.lesson05.teach.el_publico:
    title: "the audience"
    gloss: "the audience"
    note: "*El público* is who the text is for; the register is chosen to fit them."
    example_gloss: "Each text has a different audience."
  es.c1.unit03.lesson05.teach.apropiado:
    title: "appropriate"
    gloss: "appropriate"
    note: "*Apropiado* = appropriate. Note: it does NOT mean 'appropriated'."
    example_gloss: "For the landlord, the appropriate thing is a formal register."
  es.c1.unit03.lesson05.teach.leer_tono_note:
    title: "Reading the tone"
    gloss: "The same message sounds different according to the tone: formal, diplomatic, ironic, or emphatic."
    note: "Both texts ask for the same thing; the tone and register reveal the audience and intent."

  es.c1.unit03.lesson06.teach.elena_formal:
    title: "Elena: I would be grateful if you could fix the fault as soon as possible."
    gloss: "Elena: I would be grateful if you could fix the fault as soon as possible."
    note: "Elena's formal register, spoken as if to the landlord: *le agradecería* + subjunctive."
  es.c1.unit03.lesson06.teach.mateo_enfatico:
    title: "Mateo: Enough is enough! We are fed up."
    gloss: "Mateo: Enough is enough! We are fed up."
    note: "Mateo's emphatic register: exclamations and the firm *estamos hartos*."
  es.c1.unit03.lesson06.teach.elena_diplomatico:
    title: "Elena: I understand that you are very busy, but perhaps you could give us a date."
    gloss: "Elena: I understand that you are very busy, but perhaps you could give us a date."
    note: "Elena's diplomatic register: *entiendo que* + *quizá podría*."
  es.c1.unit03.lesson06.teach.modelo_cambio:
    title: "A model register shift"
    gloss: "I would like to point out that the heating is still broken. Enough is enough! We are fed up."
    note: "The model shifts one message from diplomatic (*me gustaría señalar que*) to emphatic (*¡ya es suficiente!*)."

exercises:
  es.c1.unit03.lesson01.exercise01.recognize_registro:
    instruction: "What does el registro mean?"
    correct_option: "The variety of language suited to a situation."
    distractors: ["A list of words to memorize.", "A grammar error.", "A type of verb."]
    accepted_answers: [{value: "The variety of language suited to a situation.", status: correct}]
    feedback: "*El registro* is the style of language you choose for a given situation."
  es.c1.unit03.lesson01.exercise02.recognize_formal:
    instruction: "Which kind of addressee takes the formal register?"
    correct_option: "A stranger or someone you do not know well."
    distractors: ["A close friend.", "A small child.", "Your own pet."]
    accepted_answers: [{value: "A stranger or someone you do not know well.", status: correct}]
    feedback: "With a *desconocido* (stranger), the *trato* is *formal*."
  es.c1.unit03.lesson01.exercise03.match_registros:
    instruction: "Match each Spanish register word to its English meaning."
    accepted_answers:
      - value: {"el registro": "register / style of language", "formal": "formal", "informal": "informal", "el trato": "manner of address", "el destinatario": "the addressee / recipient", "la cortesía": "courtesy / politeness"}
        status: correct
    feedback: "These are the building blocks of register control."
  es.c1.unit03.lesson01.exercise04.order_registro:
    instruction: "Put the Spanish words in order to say the register."
    accepted_answers:
      - {value: "el registro", status: correct}
    feedback: "*El registro* is the unit's central concept."
  es.c1.unit03.lesson01.exercise05.translate_destinatario:
    instruction: "Translate into Spanish: The register changes with the addressee."
    accepted_answers:
      - {value: "El registro cambia con el destinatario", status: correct}
      - {value: "El registro cambia según el destinatario", status: correct}
    feedback: "*El destinatario* is the person you are writing or speaking to."
  es.c1.unit03.lesson01.exercise06.speak_cortesia:
    instruction: "Say aloud in Spanish: Courtesy demands respectful treatment."
    accepted_answers:
      - {value: "La cortesía exige un trato respetuoso", status: correct}
    feedback: "*La cortesía* is the reason the register shifts."

  es.c1.unit03.lesson02.exercise01.recognize_usted:
    instruction: "What does usted signal?"
    correct_option: "Formal address, using the third-person verb forms."
    distractors: ["Informal address between friends.", "A plural you.", "A rude way to speak."]
    accepted_answers: [{value: "Formal address, using the third-person verb forms.", status: correct}]
    feedback: "*Usted* takes third-person forms: *¿Cómo está usted?*"
  es.c1.unit03.lesson02.exercise02.recognize_le:
    instruction: "What is the function of le in Le escribo para informarle?"
    correct_option: "It is the formal you / indirect-object pronoun."
    distractors: ["A definite article.", "A subject pronoun for 'we'.", "A question word."]
    accepted_answers: [{value: "It is the formal you / indirect-object pronoun.", status: correct}]
    feedback: "*Le* marks the formal addressee: *Le escribo para informarle*."
  es.c1.unit03.lesson02.exercise03.match_formal:
    instruction: "Match each formal-register word to its English meaning."
    accepted_answers:
      - value: {"usted": "the formal you", "le": "to you (formal) / indirect-object pronoun", "Estimado señor García": "Dear Mr García", "la avería": "the fault / breakdown", "la calefacción": "the heating", "Atentamente": "yours faithfully / sincerely"}
        status: correct
    feedback: "These forms build the formal usted register."
  es.c1.unit03.lesson02.exercise04.order_usted:
    instruction: "Put the Spanish words in order to ask how someone formal is."
    accepted_answers:
      - {value: "Cómo está usted", status: correct}
    feedback: "*¿Cómo está usted?* uses the formal verb form *está*."
  es.c1.unit03.lesson02.exercise05.translate_le_escribo:
    instruction: "Translate into Spanish, addressing the person formally (usted): I am writing to inform you about the fault."
    accepted_answers:
      - {value: "Le escribo para informarle de la avería", status: correct}
      - {value: "Le escribo para informarle sobre la avería", status: correct}
      - {value: "Le escribo para informarle acerca de la avería", status: correct}
    feedback: "*Le escribo para informarle* is the standard formal-email opener."
  es.c1.unit03.lesson02.exercise06.speak_agradeceria:
    instruction: "Say aloud in Spanish, addressing the landlord formally (usted): I would be grateful if you could fix it as soon as possible."
    accepted_answers:
      - {value: "Le agradecería que lo solucionara lo antes posible", status: correct}
      - {value: "Le agradecería que lo solucionase lo antes posible", status: correct}
    feedback: "*Le agradecería que* + subjunctive is the key formal request."

  es.c1.unit03.lesson03.exercise01.recognize_me_gustaria:
    instruction: "What does Me gustaría señalar que do?"
    correct_option: "It opens a point diplomatically, softening what follows."
    distractors: ["It demands immediate action.", "It mocks the reader.", "It closes the message."]
    accepted_answers: [{value: "It opens a point diplomatically, softening what follows.", status: correct}]
    feedback: "*Me gustaría señalar que* softens a criticism with the conditional."
  es.c1.unit03.lesson03.exercise02.recognize_podria:
    instruction: "What function does ¿Podría...? have?"
    correct_option: "A polite, indirect request."
    distractors: ["A direct order.", "An insult.", "A statement of fact."]
    accepted_answers: [{value: "A polite, indirect request.", status: correct}]
    feedback: "*¿Podría...?* makes a request without imposing."
  es.c1.unit03.lesson03.exercise03.match_diplomatico:
    instruction: "Match each diplomatic device to its English meaning."
    accepted_answers:
      - value: {"Me gustaría señalar que": "I would like to point out that", "quizá": "perhaps", "Podría": "could you (polite request)", "con todo respeto": "with all due respect", "entiendo que": "I understand that", "suavizar": "to soften"}
        status: correct
    feedback: "Diplomacy softens a complaint with conditionals and courtesy."
  es.c1.unit03.lesson03.exercise04.order_podria:
    instruction: "Put the Spanish words in order to make a polite request for a date."
    accepted_answers:
      - {value: "Podría darnos una fecha", status: correct}
    feedback: "*¿Podría darnos una fecha?* asks without demanding."
  es.c1.unit03.lesson03.exercise05.translate_entiendo_que:
    instruction: "Translate into Spanish, addressing the person formally (usted): I understand that you are very busy."
    accepted_answers:
      - {value: "Entiendo que esté muy ocupado", status: correct}
      - {value: "Entiendo que esté muy ocupada", status: correct}
      - {value: "Entiendo que está muy ocupado", status: correct}
      - {value: "Entiendo que está muy ocupada", status: correct}
    feedback: "*Entiendo que* concedes the other side before the request."
  es.c1.unit03.lesson03.exercise06.speak_con_todo_respeto:
    instruction: "Say aloud in Spanish: Could you, with all due respect, give us a date?"
    accepted_answers:
      - {value: "¿Podría, con todo respeto, darnos una fecha?", status: correct}
    feedback: "*Con todo respeto* keeps the request diplomatic."

  es.c1.unit03.lesson04.exercise01.recognize_ya_es_suficiente:
    instruction: "What stance does ¡Ya es suficiente! express?"
    correct_option: "A firm, emphatic refusal to keep waiting."
    distractors: ["A polite request.", "A bored yawn.", "A formal apology."]
    accepted_answers: [{value: "A firm, emphatic refusal to keep waiting.", status: correct}]
    feedback: "*¡Ya es suficiente!* is emphatic: the speaker has run out of patience."
  es.c1.unit03.lesson04.exercise02.recognize_que_maravilla:
    instruction: "What does Qué maravilla de atención al cliente really mean?"
    correct_option: "Ironically, that the customer service is terrible."
    distractors: ["That the service is genuinely excellent.", "That there is no service.", "That the speaker is confused."]
    accepted_answers: [{value: "Ironically, that the customer service is terrible.", status: correct}]
    feedback: "*Qué maravilla* is ironic: it means the opposite."
  es.c1.unit03.lesson04.exercise03.match_expresivo:
    instruction: "Match each expressive phrase to its meaning."
    accepted_answers:
      - value: {"ya es suficiente": "that's enough (emphatic)", "estamos hartos": "we are fed up (emphatic)", "exigimos": "we demand (emphatic)", "de ninguna manera": "by no means (emphatic)", "qué maravilla": "some service (ironic)", "total, solo hace frío": "it's only cold (ironic)"}
        status: correct
    feedback: "Emphatic intensifies; ironic says the opposite."
  es.c1.unit03.lesson04.exercise04.order_exigimos:
    instruction: "Put the Spanish words in order to demand an immediate solution."
    accepted_answers:
      - {value: "Exigimos una solución inmediata", status: correct}
    feedback: "*Exigimos* is the firmest emphatic form."
  es.c1.unit03.lesson04.exercise05.translate_estamos_hartos:
    instruction: "Translate into Spanish: We are fed up."
    accepted_answers:
      - {value: "Estamos hartos", status: correct}
      - {value: "Estamos hartas", status: correct}
    feedback: "*Estamos hartos* is the everyday emphatic complaint."
  es.c1.unit03.lesson04.exercise06.speak_de_ninguna_manera:
    instruction: "Say aloud in Spanish: By no means are we going to accept it."
    accepted_answers:
      - {value: "De ninguna manera vamos a aceptarlo", status: correct}
      - {value: "De ninguna manera lo vamos a aceptar", status: correct}
    feedback: "*De ninguna manera* is an emphatic absolute refusal."

  es.c1.unit03.lesson05.exercise01.read_audiencia:
    instruction: "Who is this email written for, and what register does the greeting signal?"
    correct_option: "The landlord, in a formal usted register."
    distractors: ["A close friend, informally.", "A colleague, with humor.", "A family member, affectionately."]
    accepted_answers: [{value: "The landlord, in a formal usted register.", status: correct}]
