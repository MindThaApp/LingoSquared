  es.a2.unit16.lesson02.teach.el_pasaporte: {title: "The passport", gloss: "the passport", note: "*El pasaporte* -- always needed for any official identity check.", example_gloss: "I need my passport for the procedure."}
  es.a2.unit16.lesson02.teach.contrato_alquiler: {title: "The rental contract", gloss: "the rental contract", note: "*El contrato de alquiler* -- proves where and since when you live somewhere.", example_gloss: "I'm bringing my rental contract."}
  es.a2.unit16.lesson02.teach.comprobante_domicilio: {title: "Proof of address", gloss: "the proof of address", note: "*El comprobante de domicilio* -- a document confirming your address, distinct from the rental contract itself.", example_gloss: "The proof of address confirms my address."}
  es.a2.unit16.lesson02.teach.que_documentos: {title: "Ask what's needed", gloss: "What documents do I need to register?", note: "*¿Qué documentos necesito...?* (What documents do I need...?) -- *qué* + noun asks which specific things; *para* + infinitive gives the purpose."}
