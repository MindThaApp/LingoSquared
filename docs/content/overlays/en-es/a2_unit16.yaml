  es.a2.unit16.lesson05.teach.aviso_reading:
    title: "The office notice"
    gloss: "To register at the office, you need to bring the following documents: a valid passport, your rental contract, and, if applicable, proof of address. Make an appointment before coming. It's important to arrive on time. After registering, you will receive your registration number by mail within a few days."
    note: "A realistic official notice using this unit's own vocabulary and constructions."
    glosses:
      registrarse: "to register (oneself)"
      oficina: "office"
      necesario: "necessary"
      traer: "to bring"
      siguientes: "following"
      documentos: "documents"
      válido: "valid"
      contrato: "contract"
      alquiler: "rental"
      corresponde: "applies (from corresponder)"
      comprobante: "proof / supporting document"
      domicilio: "address / residence"
      Haga: "make (formal command, from hacer)"
      cita: "appointment"
      recibirá: "will receive (from recibir)"
      registro: "registration"
      correo: "mail"
  es.a2.unit16.lesson05.teach.haga_note: {title: "Haga: the formal command", gloss: "How haga relates to the subjunctive forms already taught.", note: "See the card's own text."}

  es.a2.unit16.lesson06.teach.line01: {title: "Greet formally", gloss: "The official greets Mateo and asks how they can help.", note: "*¿En qué puedo ayudarle?* (how can I help you?) -- the standard formal-register office greeting."}
  es.a2.unit16.lesson06.teach.line02: {title: "State the reason", gloss: "Mateo says he has an appointment to register at his new address.", note: "*Tengo una cita para registrarme* -- *para* + infinitive states the purpose of the appointment."}
  es.a2.unit16.lesson06.teach.line03: {title: "Request documents", gloss: "The official politely asks to see his passport and rental contract.", note: "*¿Podría mostrarme...?* (Could you show me...?) -- the polite *podría* + infinitive, with *me* attached to the end of the infinitive."}
  es.a2.unit16.lesson06.teach.line04: {title: "Hand them over", gloss: "Mateo hands them over and confirms he's lived there since last month.", note: "*Aquí tiene* (here you are) is the standard phrase when handing something over; *vivo aquí desde...* uses the present tense (*vivo*) where English uses the present perfect (I've lived)."}
  es.a2.unit16.lesson06.teach.line05: {title: "Confirm and instruct", gloss: "The official confirms everything is in order and says it's necessary that he sign here.", note: "*Es necesario que* + subjunctive: *firmar* (to sign) becomes *firme*."}
  es.a2.unit16.lesson06.teach.line06: {title: "Ask about next steps", gloss: "Mateo asks when he'll receive his registration number.", note: "A new future-tense question (*recibiré*, I will receive)."}
  es.a2.unit16.lesson06.teach.line07: {title: "Explain next steps", gloss: "The official explains it will arrive by mail in a few days and thanks him for his patience.", note: "*Lo recibirá* (you will receive it) -- *lo* stands for the registration number; *por correo* means by mail."}
  es.a2.unit16.lesson06.teach.line08: {title: "Close politely", gloss: "Mateo thanks the official for their help.", note: "*Gracias a usted* (thank YOU, formal) -- a natural formal-register closing exchange."}
