review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English
    glosses match idiomatic pan-Hispanic Spanish, and see the
    realization file's review block for the full priority list
    (quizás/tal vez register, puede que vs es posible que
    distinguishability, debe de vs tiene que strength contrast).
  notes: >-
    Overlay for es's second B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "must" covers both deduction (*debe de*) and near-certainty
    (*tiene que*) -- kept distinct in lesson02's glosses; (2) English
    "maybe/perhaps/possibly" does not signal mood, whereas Spanish
    *puede que*/*es posible que* require the SUBJUNCTIVE (*esté*,
    *tenga*, *haya*) while *quizás*/*a lo mejor* in this file's spoken
    register take the indicative -- flagged explicitly in lesson01 and
    lesson03 notes since this is the single highest-risk confusion for
    an English-speaking learner at this outcome; (3) English "must have"
    for past deduction maps to *debe de haber* + participle, not a
    literal word-for-word calque -- lesson04 notes this explicitly. No
    sibling-direction file (es-en b2) was consulted.

course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: speculate about causes and consequences
    with graded certainty -- say what may, might, must, or cannot be the
    case (quizás, a lo mejor, debe de, tiene que, puede que, es posible
    que), in the present and the past, and distinguish a deduction from
    a guess.

units:
  es.b2.unit02.especulacion:
    title: "Speculation"
    description: Say what may, might, must, or cannot be the case, in the present and the past, and distinguish a deduction from a guess.

lessons:
  es.b2.unit02.lesson01.que_tan_seguro:
    title: "How certain are you?"
  es.b2.unit02.lesson02.deduccion:
    title: "Deduction: it must be so"
  es.b2.unit02.lesson03.suposicion_o_deduccion:
    title: "A guess or a deduction?"
  es.b2.unit02.lesson04.especular_pasado:
    title: "Speculating about the past"
  es.b2.unit02.lesson05.hecho_o_especulacion:
    title: "Fact or speculation?"
  es.b2.unit02.lesson06.especular_en_conversacion:
    title: "Speculating in conversation"

teaching:
  es.b2.unit02.lesson01.teach.quizas:
    title: maybe
    gloss: "maybe / perhaps"
    note: "*Quizás* is the everyday neutral word for 'maybe'. In this unit's everyday spoken register it pairs with the indicative (*quizás está...*); more formal or literary Spanish sometimes prefers the subjunctive here instead -- both are heard."
    example_gloss: "Maybe he or she is right."
  es.b2.unit02.lesson01.teach.tal_vez:
    title: perhaps
    gloss: "perhaps / maybe"
    note: "*Tal vez* is a close synonym of *quizás*, equally common, same register and mood pattern."
    example_gloss: "Perhaps he or she is right."
  es.b2.unit02.lesson01.teach.seguramente:
    title: probably
    gloss: "probably / most likely"
    note: "*Seguramente* signals a higher degree of certainty than *quizás* -- a confident guess, not a fifty-fifty one."
    example_gloss: "He or she is probably right."
  es.b2.unit02.lesson01.teach.a_lo_mejor:
    title: "maybe (colloquial)"
    gloss: "maybe (very colloquial)"
    note: "*A lo mejor* is the most informal way to say 'maybe' -- common in everyday speech, and it always takes the indicative, never the subjunctive."
  es.b2.unit02.lesson01.teach.seguro_que:
    title: "for sure"
    gloss: "for sure / surely"
    note: "*Seguro que* is near the top of the certainty scale -- closer to a confident assertion than a real guess."
  es.b2.unit02.lesson01.teach.no_contesta_telefono:
    title: "isn't answering the phone"
    gloss: "isn't answering the phone"
    note: "The everyday mystery this whole unit speculates about: why *tu amigo* isn't picking up."
  es.b2.unit02.lesson01.teach.amigo:
    title: "your friend"
    gloss: "your friend"
    note: "*Tu amigo* stays generic through lessons 01-05 -- only the culminating lesson06 dialogue names Elena and Mateo directly."
    example_gloss: "Your friend isn't answering the phone."
  es.b2.unit02.lesson01.teach.reunion:
    title: "a meeting"
    gloss: "a meeting"
    example_gloss: "Perhaps he or she has a meeting."
  es.b2.unit02.lesson01.teach.claim_model:
    title: "Maybe your friend is in a meeting."
    gloss: "Maybe your friend is in a meeting."
    note: "The model guess for this lesson -- the lowest-commitment way to speculate, using *quizás* + the indicative."
  es.b2.unit02.lesson01.teach.donde_esta:
    title: "Where is your friend?"
    gloss: "Where is your friend?"
    note: "*¿Dónde está...?* is the question every speculation in this unit answers."
  es.b2.unit02.lesson01.teach.grammar_certeza:
    title: "Maybe he or she is in a meeting. Maybe he or she isn't answering because he or she is busy. He or she is probably arriving soon."
    gloss: "Maybe he or she is in a meeting. Maybe he or she isn't answering because he or she is busy. He or she is probably arriving soon."
    note: "Graded certainty: *quizás*/*a lo mejor* (a real guess), *seguramente* (a confident guess), *seguro que* (near-certain) -- all still short of the deductions and possibilities the next two lessons teach."

  es.b2.unit02.lesson02.teach.deber_de_estar:
    title: "must be"
    gloss: "must be (deduction)"
    note: "*Debe de + infinitive* signals a deduction from evidence, not a bare guess -- 'the facts point to this'. Distinct from the identical-looking *deber* (without *de*), which means obligation ('must do' as duty), not deduction."
    example_gloss: "He or she must be busy."
  es.b2.unit02.lesson02.teach.tiene_que:
    title: "has to be"
    gloss: "has to be (near-certainty)"
    note: "*Tiene que + infinitive* is stronger than *debe de* -- closer to 'there's no other explanation' than 'the evidence suggests'."
  es.b2.unit02.lesson02.teach.ocupado:
    title: busy
    gloss: busy
    example_gloss: "My friend must be busy."
  es.b2.unit02.lesson02.teach.trafico:
    title: traffic
    gloss: traffic
    example_gloss: "There must be a lot of traffic."
  es.b2.unit02.lesson02.teach.haber:
    title: "there to be"
    gloss: "there to be (existential 'there is/are')"
    note: "*Haber* is the existential verb behind *hay* ('there is/are') and the auxiliary behind every compound past tense (*ha salido*, *debe de haber salido*)."
    example_gloss: "There is a lot of traffic today."
  es.b2.unit02.lesson02.teach.claim_model:
    title: "There must be a lot of traffic."
    gloss: "There must be a lot of traffic."
    note: "The model deduction for this lesson -- *debe de* + *haber* (existential) + the fact being deduced."
  es.b2.unit02.lesson02.teach.medico:
    title: "the doctor"
    gloss: "the doctor"
    example_gloss: "He or she must be at the doctor's."
  es.b2.unit02.lesson02.teach.tiene_que_ser_verdad:
    title: "It has to be true."
    gloss: "It has to be true."
    note: "*Tiene que ser verdad* -- the strong-certainty counterpart to *debe de ser verdad*, which would read as a softer deduction."
  es.b2.unit02.lesson02.teach.grammar_deduccion:
    title: "There must be a lot of traffic. Or he or she has to be at the doctor's -- normally he or she is very punctual."
    gloss: "There must be a lot of traffic. Or he or she has to be at the doctor's -- normally he or she is very punctual."
    note: "Deduction reasons from known facts (normally punctual, so something must have happened) rather than just guessing -- one level more committed than lesson01's *quizás*."

  es.b2.unit02.lesson03.teach.puede_que:
    title: "maybe / it could be that"
    gloss: "maybe / it could be that (+ subjunctive)"
    note: "*Puede que* always takes the SUBJUNCTIVE, unlike lesson01's *quizás*/*a lo mejor* in this file's spoken register. Colloquial, very common."
  es.b2.unit02.lesson03.teach.este_subjuntivo:
    title: "is (subjunctive)"
    gloss: "is (subjunctive of estar)"
    note: "*Esté* is the present subjunctive of *estar*, required after *puede que*/*es posible que*/*no puede ser que*."
    example_gloss: "Maybe he or she is busy."
  es.b2.unit02.lesson03.teach.es_posible_que:
    title: "it is possible that"
    gloss: "it is possible that (+ subjunctive, neutral register)"
    note: "*Es posible que* means the same thing as *puede que* but reads slightly more neutral/formal -- both require the subjunctive."
  es.b2.unit02.lesson03.teach.no_puede_ser_que:
    title: "it can't be that"
    gloss: "it can't be that (+ subjunctive)"
    note: "*No puede ser que...* rules a possibility OUT -- the negative counterpart of *puede que*, still followed by the subjunctive."
  es.b2.unit02.lesson03.teach.tenga_subjuntivo:
    title: "has (subjunctive)"
    gloss: "has (subjunctive of tener)"
    example_gloss: "Maybe he or she has an excuse."
  es.b2.unit02.lesson03.teach.excusa:
    title: "an excuse"
    gloss: "an excuse"
    example_gloss: "Maybe he or she has an excuse."
  es.b2.unit02.lesson03.teach.claim_model:
    title: "Maybe he or she is in a meeting."
    gloss: "Maybe he or she is in a meeting."
    note: "Compare to lesson01's *quizás está* (indicative, a guess): *puede que esté* (subjunctive) frames the exact same idea as a structural possibility, not just an offhand guess."
  es.b2.unit02.lesson03.teach.grammar_suposicion:
    title: "Maybe he or she is in a meeting. It's possible that he or she has an excuse. It can't be that it slipped his or her mind."
    gloss: "Maybe he or she is in a meeting. It's possible that he or she has an excuse. It can't be that it slipped his or her mind."
    note: "Possibility (*puede que*, *es posible que*, always + subjunctive) is a distinct register from lesson01's guessing (*quizás*, + indicative) and lesson02's deduction (*debe de*, + infinitive) -- three different ways to speculate at three different levels of commitment."

  es.b2.unit02.lesson04.teach.perder_tren:
    title: "to miss the train"
    gloss: "to miss the train"
    example_gloss: "I don't want to miss the train."
  es.b2.unit02.lesson04.teach.debe_de_haber_perdido:
    title: "must have missed"
    gloss: "must have missed / must have lost"
    note: "*Debe de haber* + past participle is how you deduce about the PAST -- 'the evidence points to this having happened'."
  es.b2.unit02.lesson04.teach.puede_que_haya:
    title: "it's possible that ... has"
    gloss: "it's possible that ... has (present perfect subjunctive)"
    note: "*Puede que haya* + past participle speculates about the past with the same possibility register as lesson03's *puede que esté*, now in the past."
  es.b2.unit02.lesson04.teach.salido:
    title: left
    gloss: "left (past participle of salir)"
    example_gloss: "It's possible that he or she left late."
  es.b2.unit02.lesson04.teach.tarde:
    title: late
    gloss: late
    example_gloss: "He or she must have left late."
  es.b2.unit02.lesson04.teach.claim_model:
    title: "He or she must have missed the train."
    gloss: "He or she must have missed the train."
    note: "The model past deduction: *debe de haber* + *perdido* (missed)."
  es.b2.unit02.lesson04.teach.claim_model_2:
    title: "It's possible that he or she left late."
    gloss: "It's possible that he or she left late."
    note: "The model past possibility: *puede que haya* + *salido* (left)."
  es.b2.unit02.lesson04.teach.grammar_pasado:
    title: "He or she must have missed the train, or maybe left home late."
    gloss: "He or she must have missed the train, or maybe left home late."
    note: "Past speculation uses the same three registers (guess/deduction/possibility) as the present, but with *haber* + past participle instead of a bare infinitive."

  es.b2.unit02.lesson05.teach.texto:
    title: "Reading: fact or speculation"
    gloss: "Your friend isn't answering the phone. You don't know why. Maybe he or she is stuck in traffic. Perhaps he or she has a meeting. He or she must have left late, because normally he or she is punctual. It's possible that he or she missed the train. It's possible that he or she is busy. Nobody knows the truth, but he or she is probably arriving soon."
    glosses:
      sabes: "you know (from saber, to know a fact)"
      atrapado: "stuck / trapped"
      normalmente: normally
      puntual: punctual
      nadie: nobody
      sabe: "knows (from saber)"
      verdad: "truth (la verdad)"
      seguramente: "probably / most likely"
      llega: "arrives (from llegar)"
      pronto: soon
  es.b2.unit02.lesson06.teach.perdon:
    title: "Sorry!"
    gloss: "Sorry! / Excuse me!"
  es.b2.unit02.lesson06.teach.autobus:
    title: "the bus"
    gloss: "the bus"
    example_gloss: "It's possible that he or she missed the bus."
  es.b2.unit02.lesson06.teach.atrapada:
    title: "stuck (feminine)"
    gloss: "stuck / trapped (feminine agreement)"
    note: "*Atrapada* agrees with a feminine subject (*ella*); the masculine form from lesson05's reading was *atrapado*."
    example_gloss: "She is stuck in traffic."
  es.b2.unit02.lesson06.teach.dialogue_mateo_question:
    title: "Mateo: Where is Elena? She isn't answering the phone."
    gloss: "Mateo: Where is Elena? She isn't answering the phone."
  es.b2.unit02.lesson06.teach.dialogue_mateo_guess:
    title: "Mateo: Maybe she is stuck in traffic, or perhaps she has a meeting."
    gloss: "Mateo: Maybe she is stuck in traffic, or perhaps she has a meeting."
  es.b2.unit02.lesson06.teach.dialogue_mateo_deduction:
    title: "Mateo: She must have left home late."
    gloss: "Mateo: She must have left home late."
  es.b2.unit02.lesson06.teach.dialogue_elena_explanation:
    title: "Elena: Sorry! It's possible that I missed the bus."
    gloss: "Elena: Sorry! It's possible that I missed the bus."
  es.b2.unit02.lesson06.teach.dialogue_mateo_concede:
    title: "Mateo: I knew it! It had to be that."
    gloss: "Mateo: I knew it! It had to be that."
  es.b2.unit02.lesson06.teach.grammar_tres_niveles:
    title: "Maybe she is stuck in traffic (a guess). She must have left late (a deduction). It's possible that she missed the bus (a possibility)."
    gloss: "Maybe she is stuck in traffic (a guess). She must have left late (a deduction). It's possible that she missed the bus (a possibility)."
    note: "The culminating pattern: a guess (*quizás* + indicative), a deduction (*debe de* + infinitive/haber), and a possibility (*puede que* + subjunctive) about the same situation -- exactly the three registers this unit teaches, produced together."

exercises:
  es.b2.unit02.lesson01.exercise01.recognize_quizas:
    instruction: "What does this word mean?"
    correct_option: "maybe / perhaps"
    distractors: [never, always, "for sure"]
    accepted_answers: [{value: "maybe / perhaps", status: correct}]
    feedback: "Quizás means maybe / perhaps -- a genuine, uncommitted guess."
  es.b2.unit02.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "Maybe your friend is in a meeting."
    distractors: ["Your friend has a meeting today.", "Maybe your friend is at the office.", "Your friend is probably in a meeting."]
    accepted_answers: [{value: "Maybe your friend is in a meeting.", status: correct}]
    feedback: "Quizás tu amigo está en una reunión means maybe your friend is in a meeting."
  es.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {quizás: "maybe (neutral)", "a lo mejor": "maybe (colloquial)", seguramente: "most likely / probably", "seguro que": "for sure (near-certain)", "tu amigo": "your friend", "una reunión": "a meeting", "no contesta el teléfono": "isn't answering the phone"}
        status: correct
    feedback: "These are this lesson's certainty markers, from a real guess to near-certain."
  es.b2.unit02.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: Maybe your friend is in a meeting."
    accepted_answers:
      - {value: "Quizás tu amigo está en una reunión", status: correct}
    feedback: "Quizás tu amigo está en una reunión means maybe your friend is in a meeting."
  es.b2.unit02.lesson01.exercise05.translate_a_lo_mejor:
    instruction: "Translate into Spanish, using a lo mejor: Maybe your friend isn't answering the phone."
    accepted_answers:
      - {value: "A lo mejor tu amigo no contesta el teléfono", status: correct}
    feedback: "A lo mejor tu amigo no contesta el teléfono means maybe your friend isn't answering the phone."
  es.b2.unit02.lesson01.exercise06.speak_seguramente:
    instruction: "Say aloud in Spanish: He or she is probably in a meeting."
    accepted_answers:
      - {value: "Seguramente está en una reunión", status: correct}
    feedback: "Seguramente está en una reunión means he or she is probably in a meeting."
  es.b2.unit02.lesson01.exercise07.write_donde_esta:
    instruction: "Write in Spanish: Where is your friend?"
    accepted_answers:
      - {value: "¿Dónde está tu amigo?", status: correct}
      - {value: "Dónde está tu amigo", status: correct}
    feedback: "¿Dónde está tu amigo? means where is your friend?"
  es.b2.unit02.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "Quizás tu amigo está en una reunión"
    orthography_strict: true
    feedback: "You heard Quizás tu amigo está en una reunión — maybe your friend is in a meeting."

  es.b2.unit02.lesson02.exercise01.recognize_debe_de:
    instruction: "What does this phrase mean?"
    correct_option: "must be (deduction)"
    distractors: ["has to be", "is not", "used to be"]
    accepted_answers: [{value: "must be (deduction)", status: correct}]
    feedback: "Debe de + infinitive signals a deduction from evidence."
  es.b2.unit02.lesson02.exercise02.listen_trafico:
    instruction: "Listen and select what you hear."
    correct_option: "There must be a lot of traffic."
    distractors: ["There is a little traffic.", "There must be a lot of people.", "There was a lot of traffic."]
    accepted_answers: [{value: "There must be a lot of traffic.", status: correct}]
    feedback: "Debe de haber mucho tráfico means there must be a lot of traffic."
  es.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"debe de estar": "must be (deduction)", "tiene que": "has to be (strong certainty)", ocupado: busy, "el tráfico": traffic, haber: "there to be (existential)", "el médico": "the doctor", verdad: "true"}
        status: correct
    feedback: "These are this lesson's deduction words."
  es.b2.unit02.lesson02.exercise04.order_trafico:
    instruction: "Put the words in order: There must be a lot of traffic."
    accepted_answers:
      - {value: "Debe de haber mucho tráfico", status: correct}
    feedback: "Debe de haber mucho tráfico means there must be a lot of traffic."
  es.b2.unit02.lesson02.exercise05.translate_ocupado:
    instruction: "Translate into Spanish, using debe de: My friend must be busy."
    accepted_answers:
      - {value: "Mi amigo debe de estar ocupado", status: correct}
    feedback: "Mi amigo debe de estar ocupado means my friend must be busy."
  es.b2.unit02.lesson02.exercise06.translate_tiene_que:
    instruction: "Translate into Spanish, using tiene que: It has to be true."
    accepted_answers:
      - {value: "Tiene que ser verdad", status: correct}
    feedback: "Tiene que ser verdad means it has to be true."
  es.b2.unit02.lesson02.exercise07.write_haber_trafico:
    instruction: "Write in Spanish, using debe de: There must be a lot of traffic."
    accepted_answers:
      - {value: "Debe de haber mucho tráfico", status: correct}
    feedback: "Debe de haber mucho tráfico means there must be a lot of traffic."
  es.b2.unit02.lesson02.exercise08.dictation_trafico:
    instruction: "Type what you hear."
    correct_response: "Debe de haber mucho tráfico"
    orthography_strict: true
    feedback: "You heard Debe de haber mucho tráfico — there must be a lot of traffic."

  es.b2.unit02.lesson03.exercise01.recognize_puede_que:
    instruction: "What does this phrase mean?"
    correct_option: "maybe / it could be that"
    distractors: ["it must be that", "it can't be that", "it was that"]
    accepted_answers: [{value: "maybe / it could be that", status: correct}]
    feedback: "Puede que means maybe / it could be that, and always takes the subjunctive."
  es.b2.unit02.lesson03.exercise02.listen_posible:
    instruction: "Listen and select what you hear."
    correct_option: "It's possible that he or she is in a meeting."
    distractors: ["It's not possible that he or she is in a meeting.", "It's possible that he or she was in a meeting.", "He or she is definitely in a meeting."]
    accepted_answers: [{value: "It's possible that he or she is in a meeting.", status: correct}]
    feedback: "Es posible que esté en una reunión means it's possible that he or she is in a meeting."
  es.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"puede que": "maybe / it could be that (colloquial)", "es posible que": "it is possible that (neutral)", "no puede ser que": "it can't be that", esté: "is (subjunctive of estar)", tenga: "has (subjunctive of tener)", "una excusa": "an excuse"}
        status: correct
    feedback: "These are this lesson's possibility words -- all followed by the subjunctive."
  es.b2.unit02.lesson03.exercise04.order_posible:
    instruction: "Put the words in order: Maybe he or she is in a meeting."
    accepted_answers:
      - {value: "Puede que esté en una reunión", status: correct}
    feedback: "Puede que esté en una reunión means maybe he or she is in a meeting."
  es.b2.unit02.lesson03.exercise05.translate_es_posible:
    instruction: "Translate into Spanish, using es posible que: It's possible that he or she has an excuse."
    accepted_answers:
      - {value: "Es posible que tenga una excusa", status: correct}
    feedback: "Es posible que tenga una excusa means it's possible that he or she has an excuse."
  es.b2.unit02.lesson03.exercise06.write_no_puede_ser:
    instruction: "Write in Spanish, using no puede ser que: It can't be that he or she is busy."
    accepted_answers:
      - {value: "No puede ser que esté ocupado", status: correct}
    feedback: "No puede ser que esté ocupado means it can't be that he or she is busy."
  es.b2.unit02.lesson03.exercise07.speak_contrast:
    instruction: "Say aloud in Spanish: Maybe he or she is busy, but it's possible that he or she is in a meeting."
    accepted_answers:
      - {value: "Quizás está ocupado, pero puede que esté en una reunión", status: correct}
      - {value: "Quizás está ocupado pero puede que esté en una reunión", status: correct}
    feedback: "Quizás está ocupado, pero puede que esté en una reunión means maybe he or she is busy, but it's possible that he or she is in a meeting."

  es.b2.unit02.lesson04.exercise01.recognize_perdido:
    instruction: "What does this word mean?"
    correct_option: "lost / missed"
    distractors: [found, left, arrived]
    accepted_answers: [{value: "lost / missed", status: correct}]
    feedback: "Perdido is the past participle of perder, to lose / miss."
  es.b2.unit02.lesson04.exercise02.listen_perdido_tren:
    instruction: "Listen and select what you hear."
    correct_option: "He or she must have missed the train."
    distractors: ["He or she missed the bus.", "He or she must have caught the train.", "He or she must miss the train."]
    accepted_answers: [{value: "He or she must have missed the train.", status: correct}]
    feedback: "Debe de haber perdido el tren means he or she must have missed the train."
  es.b2.unit02.lesson04.exercise03.match_past_speculation_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {perdido: "lost / missed (past participle of perder)", haya: "has (subjunctive of haber)", salido: "left (past participle of salir)", tarde: late, "perder el tren": "to miss the train", "debe de haber": "must have"}
