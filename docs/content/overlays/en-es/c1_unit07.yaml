      coinciden: "they agree (coincidir)"
      en: "in"
      cambio: "change"
      es: "is"
      real: "real"
      pero: "but"
      discrepan: "they disagree (discrepar)"
      sobre: "about"
      sus: "their"
      efectos: "effects"
      Para: "in order to"
      explicarlo: "to explain it"
      un: "a / an"
      "no": "not"
      especialista: "specialist"
      retén: "retain (retener)"
      lo: "the (lo esencial)"
      esencial: "essential"
      y: "and"
      omitas: "omit (omitir)"
      salvedad: "caveat"
    note: "Two sources that agree on one point and conflict on another -- retain both and keep the caveat."
  es.c1.unit07.lesson03.teach.la_salvedad:
    title: "the caveat"
    gloss: "the caveat"
    note: "*La salvedad* is the qualification or warning you must not drop."
    example_gloss: "Do not omit the caveat."
  es.c1.unit07.lesson03.teach.omitir:
    title: "to omit"
    gloss: "to omit"
    note: "*Omitir* means to leave something out."
    example_gloss: "You can omit the technical detail."
  es.c1.unit07.lesson03.teach.retener:
    title: "to retain"
    gloss: "to retain"
    note: "*Retener* means to keep the essential and let the rest go."
    example_gloss: "Retain the essential and let go of the rest."
  es.c1.unit07.lesson03.teach.leer_note:
    title: "Reading for mediation"
    gloss: "When you read, decide what to retain, what to explain, and what to omit."
    note: "Reading for mediation is a three-way decision: retain, explain, or omit."

  es.c1.unit07.lesson04.teach.en_pocas_palabras:
    title: "in a few words"
    gloss: "in a few words"
    note: "*En pocas palabras* introduces a condensed summary."
  es.c1.unit07.lesson04.teach.es_decir:
    title: "that is / in other words"
    gloss: "that is / in other words"
    note: "*Es decir* rephrases something more simply."
  es.c1.unit07.lesson04.teach.en_terminos_sencillos:
    title: "in simple terms"
    gloss: "in simple terms"
    note: "*En términos sencillos* means using plain, accessible language."
  es.c1.unit07.lesson04.teach.sin_entrar_en_tecnicismos:
    title: "without getting into jargon"
    gloss: "without getting into jargon"
    note: "*Sin entrar en tecnicismos* means avoiding specialist jargon."
  es.c1.unit07.lesson04.teach.para_que_te_hagas_una_idea:
    title: "to give you an idea"
    gloss: "to give you an idea"
    note: "*Para que te hagas una idea* frames a quick explanation for a non-specialist."
  es.c1.unit07.lesson04.teach.condensar_note:
    title: "Condensing"
    gloss: "Condense and clarify the terminology for your audience."
    note: "Condense the content, then clarify any specialist term for the audience."

  es.c1.unit07.lesson05.teach.elena_que_contamos:
    title: "Elena: What do we tell your colleague, who is not a specialist?"
    gloss: "Elena: What do we tell your colleague, who is not a specialist?"
    note: "Elena names the audience: *un compañero que no es especialista*."
  es.c1.unit07.lesson05.teach.mateo_lo_esencial:
    title: "Mateo: The essential: there are advantages, but also risks."
    gloss: "Mateo: The essential: there are advantages, but also risks."
    note: "Mateo condenses to *lo esencial*: advantages and risks."
  es.c1.unit07.lesson05.teach.elena_la_salvedad:
    title: "Elena: And do not omit the caveat about commercial interests."
    gloss: "Elena: And do not omit the caveat about commercial interests."
    note: "Elena insists on keeping *la salvedad*: the *intereses comerciales*."
  es.c1.unit07.lesson05.teach.mateo_explico_el_termino:
    title: "Mateo: Besides, I explain the term without jargon."
    gloss: "Mateo: Besides, I explain the term without jargon."
    note: "Mateo clarifies the terminology: *explico el término sin tecnicismos*."
  es.c1.unit07.lesson05.teach.la_conclusion:
    title: "the conclusion"
    gloss: "the conclusion"
    note: "*La conclusión* closes the briefing with the bottom line."
    example_gloss: "The conclusion is clear: more advantages than risks."
  es.c1.unit07.lesson05.teach.el_publico:
    title: "the audience"
    gloss: "the audience"
    note: "*El público* is who you are writing or speaking for."
    example_gloss: "Think of the audience when you write."
  es.c1.unit07.lesson05.teach.seleccion_note:
    title: "Selecting for the audience"
    gloss: "Select for the audience: retain the essential and do not omit the caveat."
    note: "Choose what to keep based on who will read or hear it."

  es.c1.unit07.lesson06.teach.elena_segun_consultora:
    title: "Elena: According to the consultancy, remote work improves productivity."
    gloss: "Elena: According to the consultancy, remote work improves productivity."
    note: "The first source, attributed with *según la consultora*."
  es.c1.unit07.lesson06.teach.mateo_en_cambio:
    title: "Mateo: By contrast, the university maintains that it isolates workers."
    gloss: "Mateo: By contrast, the university maintains that it isolates workers."
    note: "The second source, contrasted with *en cambio*."
  es.c1.unit07.lesson06.teach.elena_coinciden:
    title: "Elena: Both sources agree that the change is real, but disagree about its effects."
    gloss: "Elena: Both sources agree that the change is real, but disagree about its effects."
    note: "Agreement (*coinciden*) and disagreement (*discrepan*) side by side."
  es.c1.unit07.lesson06.teach.mateo_salvedad:
    title: "Mateo: And the caveat is that the consultancy has commercial interests."
    gloss: "Mateo: And the caveat is that the consultancy has commercial interests."
    note: "The caveat (*la salvedad*): *la consultora tiene intereses comerciales*."
  es.c1.unit07.lesson06.teach.modelo_resumen:
    title: "A model briefing"
    gloss: >-
      According to the consultancy, remote work improves productivity. By
      contrast, the university maintains that it isolates workers. Both
      sources agree that the change is real, but disagree about its
      effects. In a few words, there are advantages, but also risks, and
      the caveat is that the consultancy has commercial interests.
    note: "The complete briefing: attribute, contrast, mark the disagreement, and close with the caveat."

exercises:
  es.c1.unit07.lesson01.exercise01.recognize_mediar:
    instruction: "What does mediar mean?"
    correct_option: "To synthesize differing sources while preserving the real disagreement."
    distractors: ["To copy a text.", "To translate word for word.", "To disagree openly."]
    accepted_answers: [{value: "To synthesize differing sources while preserving the real disagreement.", status: correct}]
    feedback: "*Mediar* means synthesizing sources for an audience without erasing real disagreement."
  es.c1.unit07.lesson01.exercise02.recognize_desacuerdo:
    instruction: "What is un desacuerdo?"
    correct_option: "The point on which two sources conflict."
    distractors: ["A complete agreement.", "A translation error.", "A summary."]
    accepted_answers: [{value: "The point on which two sources conflict.", status: correct}]
    feedback: "*El desacuerdo* is the disagreement between sources."
  es.c1.unit07.lesson01.exercise03.match_conceptos:
    instruction: "Match each mediation term to its English meaning."
    accepted_answers:
      - value: {"mediar": "to mediate", "sintetizar": "to synthesize", "la fuente": "the source", "el destinatario": "the audience / recipient", "el desacuerdo": "the disagreement", "el matiz": "the nuance"}
        status: correct
    feedback: "The core vocabulary of mediation."
  es.c1.unit07.lesson01.exercise04.order_mediar:
    instruction: "Put the Spanish words in order to say mediating between two sources is not copying."
    accepted_answers:
      - {value: "Mediar entre dos fuentes no es copiar", status: correct}
    feedback: "*Mediar* between two sources is not *copiar*."
  es.c1.unit07.lesson01.exercise05.translate_mediar:
    instruction: "Translate into Spanish: To mediate is to choose what is essential."
    accepted_answers:
      - {value: "Mediar es elegir lo esencial", status: correct}
      - {value: "Mediar es elegir lo que es esencial", status: correct}
    feedback: "*Mediar es elegir lo esencial*."
  es.c1.unit07.lesson01.exercise06.speak_sintetizar:
    instruction: "Say aloud in Spanish: Synthesizing is not copying."
    accepted_answers:
      - {value: "Sintetizar no es copiar", status: correct}
    feedback: "*Sintetizar no es copiar*."

  es.c1.unit07.lesson02.exercise01.recognize_segun:
    instruction: "What does según do in a briefing?"
    correct_option: "It introduces the source of a claim."
    distractors: ["It adds emphasis.", "It ends the sentence.", "It asks a question."]
    accepted_answers: [{value: "It introduces the source of a claim.", status: correct}]
    feedback: "*Según* introduces the source: *según la consultora*."
  es.c1.unit07.lesson02.exercise02.recognize_discrepan:
    instruction: "What does discrepan sobre mean?"
    correct_option: "They disagree about."
    distractors: ["They agree about.", "They ignore.", "They summarize."]
    accepted_answers: [{value: "They disagree about.", status: correct}]
    feedback: "*Discrepan sobre* marks the conflict."
  es.c1.unit07.lesson02.exercise03.match_atribucion:
    instruction: "Match each attribution frame to its English meaning."
    accepted_answers:
      - value: {"según": "according to", "sostiene que": "claims / maintains that", "mientras que": "whereas", "en cambio": "by contrast", "coinciden en que": "they agree that", "discrepan sobre": "they disagree about"}
        status: correct
    feedback: "These frames attribute ideas and mark agreement or conflict."
  es.c1.unit07.lesson02.exercise04.order_segun:
    instruction: "Put the Spanish words in order to say according to the consultancy, remote work improves productivity."
    accepted_answers:
      - {value: "Según la consultora el teletrabajo mejora la productividad", status: correct}
    feedback: "*Según la consultora* -- according to the consultancy."
  es.c1.unit07.lesson02.exercise05.translate_discrepan:
    instruction: "Translate into Spanish: The two sources disagree about the effects."
    accepted_answers:
      - {value: "Las dos fuentes discrepan sobre los efectos", status: correct}
    feedback: "*Discrepan sobre los efectos* -- they disagree about the effects."
  es.c1.unit07.lesson02.exercise06.speak_coinciden:
    instruction: "Say aloud in Spanish: Both sources agree that the change is real."
    accepted_answers:
      - {value: "Ambas fuentes coinciden en que el cambio es real", status: correct}
    feedback: "*Coinciden en que el cambio es real*."

  es.c1.unit07.lesson03.exercise01.read_informe:
    instruction: "What does the first source claim?"
    correct_option: "That remote work improves productivity."
    distractors: ["That remote work isolates workers.", "That remote work is new.", "That remote work is free."]
    accepted_answers: [{value: "That remote work improves productivity.", status: correct}]
    feedback: "The consultancy maintains that *el teletrabajo mejora la productividad*."
  es.c1.unit07.lesson03.exercise02.read_segundo:
    instruction: "What does the second source claim?"
    correct_option: "That remote work isolates workers."
    distractors: ["That remote work improves productivity.", "That remote work is cheap.", "That remote work is easy."]
    accepted_answers: [{value: "That remote work isolates workers.", status: correct}]
    feedback: "The university points out that *el teletrabajo aísla a los trabajadores*."
  es.c1.unit07.lesson03.exercise03.read_coinciden:
    instruction: "What do the two sources agree on?"
    correct_option: "That the change is real."
    distractors: ["That the effects are identical.", "That there is no change.", "That productivity fell."]
    accepted_answers: [{value: "That the change is real.", status: correct}]
    feedback: "*Coinciden en que el cambio es real* -- but *discrepan sobre sus efectos*."
  es.c1.unit07.lesson03.exercise04.match_leer:
    instruction: "Match each mediation-reading term to its English meaning."
    accepted_answers:
      - value: {"lo esencial": "the essential point", "la salvedad": "the caveat", "omitir": "to omit", "retener": "to retain", "el matiz": "the nuance", "el desacuerdo": "the disagreement"}
        status: correct
    feedback: "These terms drive the retain / explain / omit decision."
  es.c1.unit07.lesson03.exercise05.order_retener:
    instruction: "Put the Spanish words in order to say retain the essential and let go of the rest."
    accepted_answers:
      - {value: "Retén lo esencial y suelta el resto", status: correct}
    feedback: "*Retén lo esencial* -- retain the essential."
  es.c1.unit07.lesson03.exercise06.translate_retener:
    instruction: "Translate into Spanish: Retain the essential point and do not omit the caveat."
    accepted_answers:
      - {value: "Retén lo esencial y no omitas la salvedad", status: correct}
    feedback: "*Retén lo esencial y no omitas la salvedad*."

  es.c1.unit07.lesson04.exercise01.recognize_pocas:
    instruction: "What does en pocas palabras mean?"
    correct_option: "In a few words (a condensed summary)."
    distractors: ["In many words.", "Word by word.", "In a foreign language."]
    accepted_answers: [{value: "In a few words (a condensed summary).", status: correct}]
    feedback: "*En pocas palabras* introduces a short summary."
  es.c1.unit07.lesson04.exercise02.recognize_tecnicismos:
    instruction: "What does sin entrar en tecnicismos mean?"
    correct_option: "Without getting into jargon."
    distractors: ["With technical detail.", "Without any detail.", "With formal language."]
    accepted_answers: [{value: "Without getting into jargon.", status: correct}]
    feedback: "*Sin entrar en tecnicismos* means avoiding specialist jargon."
  es.c1.unit07.lesson04.exercise03.match_condensar:
    instruction: "Match each condensing frame to its English meaning."
    accepted_answers:
      - value: {"en pocas palabras": "in a few words", "es decir": "that is / in other words", "en términos sencillos": "in simple terms", "sin entrar en tecnicismos": "without getting into jargon", "para que te hagas una idea": "to give you an idea", "la terminología": "the terminology"}
        status: correct
    feedback: "These frames adapt complex content to a non-specialist."
  es.c1.unit07.lesson04.exercise04.order_pocas:
    instruction: "Put the Spanish words in order to say in a few words, there are advantages and risks."
    accepted_answers:
      - {value: "En pocas palabras hay ventajas y riesgos", status: correct}
    feedback: "*En pocas palabras* -- in a few words."
  es.c1.unit07.lesson04.exercise05.translate_sencillos:
    instruction: "Translate into Spanish: Explain it in simple terms."
    accepted_answers:
      - {value: "Explícalo en términos sencillos", status: correct}
    feedback: "*En términos sencillos* -- in simple terms."
  es.c1.unit07.lesson04.exercise06.speak_idea:
    instruction: "Say aloud in Spanish: To give you an idea, there are advantages and risks."
    accepted_answers:
      - {value: "Para que te hagas una idea, hay ventajas y riesgos", status: correct}
    feedback: "*Para que te hagas una idea* -- to give you an idea."

  es.c1.unit07.lesson05.exercise01.recognize_conclusion:
    instruction: "What does la conclusión mean?"
    correct_option: "The conclusion (the bottom line)."
    distractors: ["The introduction.", "The footnotes.", "The title."]
    accepted_answers: [{value: "The conclusion (the bottom line).", status: correct}]
    feedback: "*La conclusión* closes the briefing."
  es.c1.unit07.lesson05.exercise02.recognize_intereses:
    instruction: "What are los intereses comerciales here?"
    correct_option: "The commercial interests (a conflict of interest)."
    distractors: ["The university's methods.", "The workers' salaries.", "The remote-work software."]
    accepted_answers: [{value: "The commercial interests (a conflict of interest).", status: correct}]
    feedback: "*Los intereses comerciales* are the caveat: the consultancy has a stake."
  es.c1.unit07.lesson05.exercise03.match_seleccionar:
    instruction: "Match each selection term to its English meaning."
    accepted_answers:
      - value: {"la conclusión": "the conclusion", "el público": "the audience", "la salvedad": "the caveat", "lo esencial": "the essential point", "retener": "to retain", "omitir": "to omit"}
        status: correct
    feedback: "These terms drive what you keep, explain, or drop."
  es.c1.unit07.lesson05.exercise04.order_conclusion:
    instruction: "Put the Spanish words in order to say the conclusion is clear."
    accepted_answers:
      - {value: "La conclusión es clara", status: correct}
    feedback: "*La conclusión es clara*."
  es.c1.unit07.lesson05.exercise05.translate_publico:
    instruction: "Translate into Spanish: Think of the audience when you write."
    accepted_answers:
      - {value: "Piensa en el público al escribir", status: correct}
      - {value: "Piensa en el público cuando escribas", status: correct}
    feedback: "*El público* -- the audience."
  es.c1.unit07.lesson05.exercise06.speak_salvedad:
    instruction: "Say aloud in Spanish: Do not omit the caveat about commercial interests."
    accepted_answers:
      - {value: "No omitas la salvedad de los intereses comerciales", status: correct}
    feedback: "*No omitas la salvedad de los intereses comerciales*."

  es.c1.unit07.lesson06.exercise01.listen_intercambio:
