      que: "that"
      el: "the"
      teletrabajo: "remote work"
      mejora: "improves"
      la: "the"
      productividad: "productivity"
      segundo: "second"
      universidad: "university"
      señala: "points out (señalar)"
      aísla: "isolates"
      a: "to"
      los: "the (plural)"
      trabajadores: "workers"
      Ambas: "both"
