course:
  title: Spanish C1
  description: >-
    Advanced Spanish mediation: distill complex or conflicting sources and
    relay them accurately and appropriately for a specific listener or
    reader, attributing each idea and preserving disagreement.

units:
  es.c1.unit07.mediar_entre_fuentes:
    title: "Mediating between sources"
    description: "Distill complex or conflicting material and relay it accurately for a specific audience."

lessons:
  es.c1.unit07.lesson01.el_oficio_de_mediar:
    title: "The work of mediating"
  es.c1.unit07.lesson02.atribuir_cada_idea:
    title: "Attributing each idea"
  es.c1.unit07.lesson03.leer_fuentes_densas:
    title: "Reading dense sources"
  es.c1.unit07.lesson04.condensar_para_el_publico:
    title: "Condensing for the audience"
  es.c1.unit07.lesson05.seleccionar_para_el_destinatario:
    title: "Selecting for the audience"
  es.c1.unit07.lesson06.el_resumen_completo:
    title: "The complete briefing"

teaching:
  es.c1.unit07.lesson01.teach.mediar:
    title: "to mediate"
    gloss: "to mediate"
    note: "*Mediar* means to synthesize differing sources for an audience while preserving the real disagreement."
    example_gloss: "Mediating between two sources means looking for what is essential."
  es.c1.unit07.lesson01.teach.sintetizar:
    title: "to synthesize"
    gloss: "to synthesize"
    note: "*Sintetizar* means to combine the essential points into a shorter whole."
    example_gloss: "Synthesizing is not copying: it is choosing what matters."
  es.c1.unit07.lesson01.teach.la_fuente:
    title: "the source"
    gloss: "the source"
    note: "*La fuente* is the origin of information -- a report, an article, a person."
    example_gloss: "Each source has its own point of view."
  es.c1.unit07.lesson01.teach.el_destinatario:
    title: "the audience / recipient"
    gloss: "the audience / recipient"
    note: "*El destinatario* is the person you are relaying information to."
    example_gloss: "The audience is not a specialist."
  es.c1.unit07.lesson01.teach.el_desacuerdo:
    title: "the disagreement"
    gloss: "the disagreement"
    note: "*El desacuerdo* is the point on which two sources conflict."
    example_gloss: "There is a disagreement between the two sources."
  es.c1.unit07.lesson01.teach.el_matiz:
    title: "the nuance"
    gloss: "the nuance"
    note: "*El matiz* is a subtle distinction you must not lose when you summarize."
    example_gloss: "Do not lose the nuance when you summarize."
  es.c1.unit07.lesson01.teach.oficio_note:
    title: "The work of mediating"
    gloss: "Mediating means distilling the essential and relaying it well to each audience."
    note: "Mediation has two halves: condense the source, then adapt it to the audience."

  es.c1.unit07.lesson02.teach.segun:
    title: "according to"
    gloss: "according to"
    note: "*Según* introduces the source of a claim: *según la consultora* means according to the consultancy."
  es.c1.unit07.lesson02.teach.sostiene_que:
    title: "claims / maintains that"
    gloss: "claims / maintains that"
    note: "*Sostiene que* attributes a claim to its source -- the source holds that something is so."
  es.c1.unit07.lesson02.teach.mientras_que:
    title: "whereas"
    gloss: "whereas"
    note: "*Mientras que* contrasts two positions side by side."
  es.c1.unit07.lesson02.teach.en_cambio:
    title: "by contrast"
    gloss: "by contrast"
    note: "*En cambio* switches to the opposing view."
  es.c1.unit07.lesson02.teach.coinciden_en_que:
    title: "they agree that"
    gloss: "they agree that"
    note: "*Coinciden en que* marks the point the two sources share."
  es.c1.unit07.lesson02.teach.discrepan_sobre:
    title: "they disagree about"
    gloss: "they disagree about"
    note: "*Discrepan sobre* marks the point the two sources conflict on."
  es.c1.unit07.lesson02.teach.atribucion_note:
    title: "Attribute every idea"
    gloss: "Attribute each idea: say who holds it and on what they disagree."
    note: "When you mediate, every idea must carry its source."

  es.c1.unit07.lesson03.teach.el_texto:
    title: "Two dense sources"
    gloss: >-
      The first report, from a consultancy, maintains that remote work
      improves productivity. The second, from a university, points out that
      remote work isolates workers. Both sources agree that the change is
      real, but they disagree about its effects. To explain it to a
      non-specialist, retain the essential and do not omit the caveat.
