  es.a1.unit12.lesson04.teach.algo_se_quema: {title: "Something is burning", gloss: "Something is burning!", note: "*Se quema* is the reflexive form of *quemar* (to burn) -- \"it burns itself,\" the natural way to say something is burning without naming who's doing it."}
