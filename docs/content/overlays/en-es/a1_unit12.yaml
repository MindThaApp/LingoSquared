  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo: {title: "Suggest starting over", gloss: "We can start again.", note: "*Podemos* (we can) + infinitive; *de nuevo* (again/anew) is a common phrase for redoing something."}
  es.a1.unit12.lesson04.teach.no_te_preocupes_note: {title: "No te preocupes", gloss: "The negative-command pattern behind \"don't worry.\"", note: "See the card's own text."}

  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: "A reflection on the class"
    gloss: "Before class, Elena and Mateo were a little nervous. During class, something burned and they were both worried. But they started again, and in the end, the cake turned out perfect. Now they're both very proud and happy."
    note: "A realistic recap of this unit's own established emotional arc, from pre-class nerves to post-mishap pride."
    glosses: {Antes: "before", clase: "class", estaban: "were (from estar)", poco: "little", nerviosos: "nervous", Durante: "during", algo: "something", quemó: "burned (from quemarse)", dos: "both / two", preocupados: "worried", Pero: "but", empezaron: "started (from empezar)", nuevo: "again / anew", final: "end", pastel: "cake", salió: "turned out (from salir)", perfecto: "perfect", Ahora: "now", están: "are (from estar)", orgullosos: "proud", contentos: "happy"}
  es.a1.unit12.lesson05.teach.plural_adjective_note: {title: "Plural adjective agreement", gloss: "Why a mixed-gender group takes masculine plural adjectives.", note: "See the card's own text."}

  es.a1.unit12.lesson06.teach.line01: {title: "Ask how Mateo feels", gloss: "Elena asks Mateo how he feels before class.", note: "Reuses lesson03's core question directly."}
  es.a1.unit12.lesson06.teach.line02: {title: "Answer with a mixed feeling", gloss: "Mateo says he feels a little nervous, but happy.", note: "Reuses lesson03's answer directly, spoken by Mateo in the masculine form."}
  es.a1.unit12.lesson06.teach.line03: {title: "React to the mishap", gloss: "Elena agrees, then notices something is burning.", note: "*¡Ay, no!* (oh no!) is a common exclamation of alarm, new this unit; reuses lesson04's *algo se quema*."}
  es.a1.unit12.lesson06.teach.line04: {title: "Express worry", gloss: "Mateo says he's worried and asks what to do.", note: "Reuses lesson04's *estoy preocupado*; *¿Qué hacemos?* (what do we do?) is a new practical question."}
  es.a1.unit12.lesson06.teach.line05: {title: "Reassure and suggest a fix", gloss: "Elena tells him not to worry -- they can start again.", note: "Reuses lesson04's *no te preocupes* and *podemos empezar de nuevo* directly."}
  es.a1.unit12.lesson06.teach.line06: {title: "Agree and try again", gloss: "Mateo agrees and suggests trying again.", note: "*Vamos a intentarlo otra vez* (let's try it again) reuses the *vamos a* + infinitive construction from earlier units, now with the object pronoun *lo*."}
  es.a1.unit12.lesson06.teach.line07: {title: "Announce success", gloss: "Elena announces the cake is now perfect.", note: "*¡Mira!* (look!) is a new attention-getting interjection; *el pastel* (the cake) is the dish at the center of the mishap."}
  es.a1.unit12.lesson06.teach.line08: {title: "Celebrate and express pride", gloss: "Mateo celebrates and says he's proud of them both.", note: "*¡Qué bien!* (how great!) reuses the *¡Qué...!* exclamation pattern from unit10's *¡Qué calor!*; *de nosotros* (of us) extends lesson01's *estoy orgulloso de ti* to a group."}
  es.a1.unit12.lesson06.teach.line09: {title: "Share the pride", gloss: "Elena agrees she's proud too -- they did it together.", note: "*Lo logramos juntos* (we achieved it together) is a natural closing line, using *lograr* (to achieve/manage) for the first time."}

