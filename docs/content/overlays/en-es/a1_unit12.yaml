  es.a1.unit12.lesson01.teach.nervioso: {title: "Nervous", gloss: "nervous", note: "*Nervioso* (masculine) / *nerviosa* (feminine) -- a standard -o/-a adjective pair.", example_gloss: ["Mateo is nervous.", "Elena is nervous."]}
