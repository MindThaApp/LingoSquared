  es.a2.unit17.lesson04.teach.extranio_tranquilidad: {title: "Say what you miss", gloss: "I miss the quiet of the old neighborhood.", note: "*Extraño* (I miss) -- a natural follow-up expressing what's lost, not just what's disputed."}
