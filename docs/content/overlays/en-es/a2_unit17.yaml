  es.a2.unit17.lesson05.teach.nota_reading:
    title: "An opinion note"
    gloss: "For me, the new neighborhood is better because there are more shops and it's closer to work. However, I don't think it's as quiet as the old one. Every neighborhood has its advantages."
    note: "A balanced opinion note using this unit's own opener, reason, and concession constructions."
    glosses:
      barrio: "neighborhood"
      nuevo: "new"
      mejor: "better"
      porque: "because"
      hay: "there are (from haber)"
      tiendas: "shops"
      cerca: "near / close"
      trabajo: "work"
      Sin: "without; with embargo: however"
      embargo: "however (in sin embargo)"
      creo: "I think (from creer)"
      sea: "is (subjunctive, from ser)"
      tranquilo: "quiet"
      viejo: "old one"
      ventajas: "advantages"
  es.a2.unit17.lesson05.teach.sin_embargo_note: {title: "Sin embargo: however", gloss: "How sin embargo introduces a contrasting point.", note: "See the card's own text."}

  es.a2.unit17.lesson06.teach.line01: {title: "Ask for an opinion", gloss: "Mateo asks Elena what she thinks of the new neighborhood.", note: "Reuses lesson03's core question directly."}
  es.a2.unit17.lesson06.teach.line02: {title: "Give the opinion", gloss: "Elena says it seems better because there are more shops nearby.", note: "Reuses lesson01's *me parece que* and lesson02's *hay más tiendas* reason."}
  es.a2.unit17.lesson06.teach.line03: {title: "Agree and add a reason", gloss: "Mateo agrees and adds that it's also closer to work.", note: "*Estoy de acuerdo* (I agree) -- a new agreement phrase, then reuses lesson02's second reason."}
  es.a2.unit17.lesson06.teach.line04: {title: "Concede a point", gloss: "Elena agrees but doesn't think it's as quiet as the old one.", note: "Reuses lesson04's *no creo que* + subjunctive construction directly."}
  es.a2.unit17.lesson06.teach.line05: {title: "Acknowledge the point", gloss: "Mateo agrees she has a point -- the old one was quieter.", note: "*Tienes razón* (you're right) -- a natural agreement phrase."}
  es.a2.unit17.lesson06.teach.line06: {title: "Express what's missed", gloss: "Elena says she misses the quiet of the old neighborhood.", note: "Reuses lesson04's *extraño la tranquilidad* directly."}
  es.a2.unit17.lesson06.teach.line07: {title: "Offer a counterpoint", gloss: "Mateo understands, but says he likes this neighborhood's convenience.", note: "*Entiendo* (I understand) + *pero* (but) -- a respectful counterpoint, not a dismissal."}
  es.a2.unit17.lesson06.teach.line08: {title: "Close amicably", gloss: "Elena concludes that every neighborhood has its advantages.", note: "Reuses the reading's own closing line, now as a spoken conclusion to their discussion."}
  es.a2.unit17.lesson06.teach.summary_grammar: {title: "Summary", gloss: "Mateo believes the new neighborhood is better. Elena thinks it's not as quiet as the old one. They both agree that every neighborhood has its advantages.", note: "A summary sentence contrasting creer (affirmed) and pensar que no (negated) side by side."}

