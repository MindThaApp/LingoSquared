teaching:
  es.a2.unit92.lesson01.teach.cambiar_anular:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Cambiar una cita* means to move it to another time. *Anular* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  es.a2.unit92.lesson01.teach.por_desgracia_perdon:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Por desgracia* is a polite way to give bad news. *Perdón* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  es.a2.unit92.lesson01.teach.la_peluqueria:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*La peluquería* is the place; *el peluquero* or *la peluquera* is the person. People often say *ir a la peluquería*.'
    example_gloss: The salon is open from nine to six.
  es.a2.unit92.lesson01.teach.puedo_cambiar_mi:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question can start with the verb: *¿Puedo ...?* The infinitive *cambiar* follows directly.'
  es.a2.unit92.lesson01.teach.por_desgracia_no:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  es.a2.unit92.lesson01.teach.no_puedo_ir:
    title: Puedo + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *puedo* the second verb is an infinitive: *puedo ir*, *puedo cambiar*. In a statement, *no* goes directly before *puedo*: *No puedo ir el jueves*. In a question, *puedo* comes first: *¿Puedo cambiar la cita?* Say *ir* when you go to the other person''s place; the salon, speaking from its side, says *venir*.'
  es.a2.unit92.lesson02.teach.otro_dia:
    title: Another day
    gloss: another day
    note: '*Otro* never takes *un* in front of it: *otro día*, not *un otro día*.'
    example_gloss: Can it also be on another day?
  es.a2.unit92.lesson02.teach.puede_ser_el:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'Spanish uses *el* with a weekday when it means ''on that day'': *el lunes*, *el viernes*.'
  es.a2.unit92.lesson02.teach.le_viene_bien:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Venir bien* means ''to suit''. The polite *usted* takes *le*: *¿Le viene bien el viernes?* With a friend it would be *¿Te viene bien?*'
  es.a2.unit92.lesson02.teach.si_me_viene:
    title: Saying yes
    gloss: Yes, that suits me well.
  es.a2.unit92.lesson02.teach.por_desgracia_no:
    title: Saying no politely
    gloss: Unfortunately not.
  es.a2.unit92.lesson02.teach.le_viene_bien_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: '*Venir bien* means ''to suit'' and takes a pronoun for the person it suits: *le* for the polite *usted*, *me* for yourself. The question is *¿Le viene bien el viernes?* The answer *Sí, me viene bien* confirms. A polite refusal is *Por desgracia no*.'
  es.a2.unit92.lesson03.teach.porque_lo_siento:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Porque* gives the reason. *Lo siento* is a more careful apology than *perdón*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  es.a2.unit92.lesson03.teach.las_molestias:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Perdone las molestias* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  es.a2.unit92.lesson03.teach.no_puedo_ir:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  es.a2.unit92.lesson03.teach.no_puedo_ir_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  es.a2.unit92.lesson03.teach.no_puedo_ir_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: '*Porque* is followed by an ordinary sentence: subject and verb in the usual order. *No puedo ir porque estoy enfermo.* Do not confuse it with *por qué* (two words, with an accent), which asks ''why?''.'
  es.a2.unit92.lesson04.teach.quedar_con_antelacion:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Quedar* is to agree on a time or place together. *Con antelación* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  es.a2.unit92.lesson04.teach.el_lunes_a:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  es.a2.unit92.lesson04.teach.puede_venir_el:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*¿Puede ...?* is the polite *usted* form of *¿Puedes ...?* The infinitive *venir* follows directly.'
  es.a2.unit92.lesson04.teach.entonces_nos_vemos:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  es.a2.unit92.lesson04.teach.entonces_le_doy:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  es.a2.unit92.lesson04.teach.el_lunes_a_2:
    title: Day and time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'To give a day and a time, say *el lunes a las diez*: *el* before the day and *a las* before the hour (*a la una* for one o''clock). In a polite question use *¿Puede ...?* and an infinitive.'
  es.a2.unit92.lesson05.teach.estimado_mateo_su:
    title: A message from the salon
    gloss: Dear Mateo, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. That way we will give you a new appointment. See you Monday! Peluquería Marín
    note: This is a typical short message from a business, so it uses the polite *usted* forms (*su*, *le*, *llámenos*). *Ha sido cambiada* means 'has been moved'.
    glosses:
      estimado: dear
      mateo: Mateo
      su: your (formal)
      cita: appointment
      cambiada: moved
      nueva: new
      lunes: Monday
      diez: ten
      las: o'clock
      viene: suits (komt ... uit)
      le: we
      'no': not
      bien: (part of komt ... uit)
      llámenos: us
      entonces: then
      antes: in advance
      damos: make
      hasta: until, see you
      peluquería: hairdresser's
      marín: Marín (surname)
  es.a2.unit92.lesson06.teach.peluqueria_marin_buenas:
    title: The salon answers
    gloss: 'Hairdresser: Peluquería Marín, good afternoon.'
  es.a2.unit92.lesson06.teach.buenas_tardes_soy:
    title: Mateo explains and asks
    gloss: 'Mateo: Good afternoon, you are speaking to Mateo. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  es.a2.unit92.lesson06.teach.claro_le_viene:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  es.a2.unit92.lesson06.teach.por_desgracia_no:
    title: Mateo suggests Monday
    gloss: 'Mateo: Unfortunately not, because I have to work. Can it also be Monday?'
  es.a2.unit92.lesson06.teach.el_lunes_a:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  es.a2.unit92.lesson06.teach.me_viene_muy:
    title: Mateo accepts and apologises
    gloss: 'Mateo: That suits me well. Thank you very much and sorry for the inconvenience.'
  es.a2.unit92.lesson06.teach.no_hay_problema:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
