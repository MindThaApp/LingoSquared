answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register rather
    than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Numbers 0-100, ages, phone numbers, and recipe quantities, continuing
    unit01's Elena and Mateo at the cooking workshop. English-specific
    guidance highlights tener-based age expressions and gender agreement in
    quantity phrases.

units:
  es.a1.unit02.numbers:
    title: "Numbers in the kitchen"

lessons:
  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: "Numbers zero to ten"
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: "Eleven to a hundred"
  es.a1.unit02.lesson03.asking_age:
    title: "Asking someone's age"
  es.a1.unit02.lesson04.phone_numbers:
    title: "Phone numbers"
  es.a1.unit02.lesson05.recipe_quantities:
    title: "Recipe quantities"
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: "Counting ingredients with Elena and Mateo"

teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: "Zero"
    gloss: "zero"
    note: "*Cero* is used both as the number itself and as a digit when reading a string of digits aloud."
  es.a1.unit02.lesson01.teach.uno:
    title: "One"
    gloss: "one"
    note: >-
      *Uno* shortens to *un* before a masculine singular noun (*un huevo*, one
      egg) and becomes *una* before a feminine one (*una taza*, one cup). Alone,
      as when counting, it stays *uno*.
  es.a1.unit02.lesson01.teach.dos:
    title: "Two"
    gloss: "two"
    note: "*Dos* never changes form regardless of the noun's gender."
  es.a1.unit02.lesson01.teach.tres:
    title: "Three"
    gloss: "three"
    note: "*Tres*, like *dos*, is invariant."
  es.a1.unit02.lesson01.teach.cuatro:
    title: "Four"
    gloss: "four"
    note: "*Cuatro* is invariant."
  es.a1.unit02.lesson01.teach.cinco:
    title: "Five"
    gloss: "five"
    note: "*Cinco* is invariant."
  es.a1.unit02.lesson01.teach.seis:
    title: "Six"
    gloss: "six"
    note: "*Seis* is invariant."
  es.a1.unit02.lesson01.teach.siete:
    title: "Seven"
    gloss: "seven"
    note: "*Siete* is invariant."
  es.a1.unit02.lesson01.teach.ocho:
    title: "Eight"
    gloss: "eight"
    note: "*Ocho* is invariant."
  es.a1.unit02.lesson01.teach.nueve:
    title: "Nine"
    gloss: "nine"
    note: "*Nueve* is invariant."
  es.a1.unit02.lesson01.teach.diez:
    title: "Ten"
    gloss: "ten"
    note: "*Diez* is invariant."

  es.a1.unit02.lesson02.teach.once:
    title: "Eleven"
    gloss: "eleven"
    note: "*Once* through *quince* (11-15) are each single fused words, not built from *diez* the way the twenties are."
  es.a1.unit02.lesson02.teach.doce:
    title: "Twelve"
    gloss: "twelve"
    note: "*Doce* is a fused word, unrelated in form to *dos*."
  es.a1.unit02.lesson02.teach.trece:
    title: "Thirteen"
    gloss: "thirteen"
    note: "*Trece* is a fused word, unrelated in form to *tres*."
  es.a1.unit02.lesson02.teach.catorce:
    title: "Fourteen"
    gloss: "fourteen"
    note: "*Catorce* is a fused word, unrelated in form to *cuatro*."
  es.a1.unit02.lesson02.teach.quince:
    title: "Fifteen"
    gloss: "fifteen"
    note: "*Quince* is the last of the fused teen numbers before the pattern changes at sixteen."
  es.a1.unit02.lesson02.teach.veinte:
    title: "Twenty"
    gloss: "twenty"
    note: >-
      *Veinte* is its own word. From *veintiuno* (21) onward, the tens and units
      fuse into one written word through twenty-nine, a pattern this course
      surfaces again with *veintiocho* in lesson03.
  es.a1.unit02.lesson02.teach.treinta:
    title: "Thirty"
    gloss: "thirty"
    note: >-
      From thirty onward, tens and units join with *y* (and) as three separate
      words rather than fusing, unlike the twenties.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: "Thirty-four"
    gloss: "thirty-four"
    note: "*Treinta y cuatro* is written as three separate words: the ten, *y*, and the unit."
  es.a1.unit02.lesson02.teach.cien:
    title: "One hundred"
    gloss: "one hundred"
    note: "*Cien* is the form used for exactly 100 on its own; *ciento* appears instead when a number continues past it (*ciento uno*, 101), which this unit does not teach yet."

  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: "Ask age informally"
    gloss: "How old are you?"
    note: >-
      Spanish literally asks how many years you have, using *tener* (to
      have), not a form of *ser* or *estar* the way English uses "to be."
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: "Give your age"
    gloss: "I'm twenty-eight."
    note: "*Tengo* is the yo form of *tener*. *Años* (years) is required in Spanish even though English drops \"years\" in casual speech."
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: "Ask age formally"
    gloss: "How old are you?"
    note: "*Tiene* is the *usted* form of *tener*, matching the formal register established in unit01."
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: "Give a compound age"
    gloss: "I'm thirty-one."
    note: "*Treinta y uno* keeps *uno* (not *un*) here because no noun directly follows it in this reply."
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: "Return the age question"
    gloss: "And you, how old are you?"
    note: "*Tienes* without repeating *años* is a natural, common shortening once the topic is already established."

  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: "Ask for a phone number"
    gloss: "What's your phone number?"
    note: "*Cuál*, not *qué*, is the natural choice when asking someone to select or supply one specific item, like a phone number, from a set of possibilities."
  es.a1.unit02.lesson04.teach.numero_elena:
    title: "A number read digit by digit"
    gloss: "Six, one, five, zero, two, nine, seven, three"
    note: "Spanish phone numbers are conventionally read one digit at a time, exactly like English."
  es.a1.unit02.lesson04.teach.es_el:
    title: "Introduce the number"
    gloss: "It's..."
    note: "*El* (masculine \"the\") is used because *número* is a masculine noun."
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: "Ask for repetition"
    gloss: "Can you repeat that, please?"
    note: "*Puedes* is the *tú* form of *poder* (can/to be able to), useful whenever a spoken number goes by too fast to catch."
  es.a1.unit02.lesson04.teach.claro:
    title: "Confirm readily"
    gloss: "Sure; of course"
    note: "*Claro* is a common, friendly way to agree to a request."

  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: "State a needed quantity"
    gloss: "I need three eggs."
    note: "*Necesito* is the yo form of *necesitar* (to need). *Huevos* (eggs) stays plural after any number greater than one."
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: "Ask how many are needed"
    gloss: "How many eggs do you need?"
    note: "*Cuántos* agrees in gender and number with the noun it asks about; *huevos* is masculine plural, so *cuántos* (not *cuántas*) is used."
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: "State a measured quantity"
    gloss: "Two cups of flour"
    note: "*De* links the measuring unit (*tazas*, cups) to what is being measured (*harina*, flour), the same pattern English uses with \"of.\""
  es.a1.unit02.lesson05.teach.media_taza:
    title: "State a half quantity"
    gloss: "Half a cup of sugar"
    note: "*Media* agrees with the feminine noun *taza*; the masculine form *medio* appears with masculine nouns instead."
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: "State what's on hand"
    gloss: "I have four eggs on the table."
    note: "*Tengo* (I have) reports what's already available, distinct from *necesito* (I need), which reports what's still missing."

  es.a1.unit02.lesson06.teach.line01:
    title: "Ask how many eggs"
    gloss: "Elena asks Mateo how many eggs he needs for the recipe."
    note: "Continues unit01's *tú* register between the two peers."
  es.a1.unit02.lesson06.teach.line02:
    title: "State the ingredients"
    gloss: "Mateo says he needs three eggs and two cups of flour."
    note: "*Necesito* names what is still needed for the recipe."
  es.a1.unit02.lesson06.teach.line03:
    title: "Offer what's on hand"
    gloss: "Elena says she has four eggs on the table and asks if he also needs sugar."
    note: "*Tengo* reports what Elena already has available, separate from what Mateo said he needs."
  es.a1.unit02.lesson06.teach.line04:
    title: "Confirm a small amount"
    gloss: "Mateo says yes, a little -- about half a cup."
    note: "*Como* here means \"about\" or \"roughly,\" not its more common sense of \"like\" or \"as.\""
  es.a1.unit02.lesson06.teach.line05:
    title: "Ask for a phone number"
    gloss: "Elena says great, then asks for Mateo's phone number so she can text him about the next class."
    note: "*Así te escribo* (\"so I can text/write to you\") explains why she's asking, a natural conversational habit before requesting contact information."
  es.a1.unit02.lesson06.teach.line06:
    title: "Give the phone number"
    gloss: "Mateo reads his number digit by digit."
    note: "*Es el* introduces the number, matching the masculine noun *número*."
  es.a1.unit02.lesson06.teach.line07:
    title: "Thank him and ask his age"
    gloss: "Elena thanks him, then asks one more question: how old he is."
    note: "*Una pregunta más* (\"one more question\") signals a natural topic shift within the same conversation."
  es.a1.unit02.lesson06.teach.line08:
    title: "State his age"
    gloss: "Mateo says he's twenty-eight and asks Elena the same question."
    note: "*Tengo veintiocho años* uses the fused twenties form, matching lesson02's own pattern."
  es.a1.unit02.lesson06.teach.line09:
    title: "State her age"
    gloss: "Elena says she's thirty-one."
    note: "*Tengo treinta y uno* drops *años* here since the topic (age) is already clear from context -- a natural shortening once established, matching lesson03's pattern of returning the question without repeating *años*."

