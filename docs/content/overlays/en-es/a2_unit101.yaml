answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on polite requests, offers and replies."
  learning_goal: "Make polite requests and offers in Spanish, and accept or decline them kindly."
units:
  es.a2.unit101.me_ayudas: {"title": "Can You Help Me?", "description": "Make a polite request, offer help, and accept or decline an offer or request politely, using puedes, podrías, me das and te ayudo."}
lessons:
  es.a2.unit101.lesson01.me_das_por_favor: {"title": "Could You Give Me, Please?"}
  es.a2.unit101.lesson02.podrias_y_puede: {"title": "Could You Help Me?"}
  es.a2.unit101.lesson03.te_ayudo: {"title": "Shall I Help You?"}
  es.a2.unit101.lesson04.si_gracias_no_hace_falta: {"title": "Yes, Thanks. No Need."}
  es.a2.unit101.lesson05.el_mensaje_de_elena: {"title": "Elena's Message"}
  es.a2.unit101.lesson06.en_la_oficina: {"title": "At Mateo's Office"}
teaching:
  es.a2.unit101.lesson01.teach.gn_puedes: {"title": "Can you...?", "gloss": "Can you open the door? Can you wait a moment? Can you bring the coffee?", "note": "To ask a friend to do something, use *¿Puedes* + infinitive? The infinitive (*abrir*, *esperar*, *traer*) never changes."}
  es.a2.unit101.lesson01.teach.gn_me_das: {"title": "Asking for things", "gloss": "Can you give me the pen? Can you pass me the salt? Can you give me the water?", "note": "To ask for an object, the present tense works as a request: *¿Me das...?* or *¿Me pasas...?* Here *me* means 'to me'."}
  es.a2.unit101.lesson01.teach.palabras: {"title": "Things to ask for", "gloss": "the pen / the salt / the water / the window / please", "note": "*Agua* is feminine but takes *el* in the singular.", "example_gloss": ["Elena, can you give me the pen, please?", "Mateo, can you open the window?", "Can you pass me the salt, please?", "Hi, Mateo. Can you wait a moment?"]}
  es.a2.unit101.lesson01.teach.gn_por_favor: {"title": "Adding por favor", "gloss": "Can you open the window, please? Please, can you pass me the salt?", "note": "*Por favor* can go at the end after a comma, or at the start. It makes a request friendlier."}
  es.a2.unit101.lesson01.teach.gn_nombre: {"title": "Using a name", "gloss": "Mateo, can you wait? Elena, can you give me the water?", "note": "With a friend you use *tú* forms (*puedes*, *pasas*, *das*). Starting with the name shows who you are asking."}
  es.a2.unit101.lesson01.teach.frases: {"title": "Three requests", "gloss": "Can you open the door, please? Can you give me the pen? Can you pass me the salt?"}
  es.a2.unit101.lesson02.teach.gn_podrias: {"title": "Could you...?", "gloss": "Could you open the window? Could you wait a moment?", "note": "*Podrías* is a softer, more polite way to say *puedes*. Learn it as a set form: *¿Podrías* + infinitive?"}
  es.a2.unit101.lesson02.teach.gn_mas_cortes: {"title": "More polite", "gloss": "Can you wait? Could you wait, please?", "note": "Both are fine with a friend. *Podrías* sounds gentler, so it is good for a bigger favour or when you want to be extra kind."}
  es.a2.unit101.lesson02.teach.palabras: {"title": "Useful chunks", "gloss": "to help me / to tell me / the time / the station / excuse me", "note": "*Ayudarme* and *decirme* are chunks: the verb and *me* are joined. Use them after *puedes*, *podrías*, *puede* and *podría*. *Perdone* is formal (excuse me).", "example_gloss": ["Mateo, could you help me, please?", "Could you tell me the time, Elena?", "Excuse me, can you help me?", "Excuse me, could you tell me where the station is?"]}
  es.a2.unit101.lesson02.teach.gn_usted: {"title": "Formal requests", "gloss": "Excuse me, can you help me? Excuse me, could you tell me the time?", "note": "With someone you do not know, use *usted*: *puede* and *podría* (no *-s*)."}
  es.a2.unit101.lesson02.teach.gn_tu_usted: {"title": "Tú or usted", "gloss": "Elena, can you help me? Madam, can you help me?", "note": "With a friend: *puedes*, *podrías*. With a stranger or someone to whom you show respect: *puede*, *podría*."}
  es.a2.unit101.lesson02.teach.frases: {"title": "Three requests", "gloss": "Could you open the window? Excuse me, can you help me? Excuse me, could you tell me the time?"}
  es.a2.unit101.lesson03.teach.gn_te_ayudo: {"title": "Offering help", "gloss": "Shall I help you? Shall I help you with the work?", "note": "To offer help, use the *yo* form as a question: *¿Te ayudo?* Here *te* means 'you'. Add *con* + thing to say what with."}
  es.a2.unit101.lesson03.teach.gn_echo: {"title": "A friendly offer", "gloss": "Shall I give you a hand? Shall I give you a hand with the bag?", "note": "*Echar una mano* is an everyday way to say 'give a hand'. It means the same as *ayudar* but sounds more casual."}
  es.a2.unit101.lesson03.teach.palabras: {"title": "Words for offers", "gloss": "the bag / the coffee / a hand / the work", "note": "Use *con* to say what you help with: *con la bolsa*, *con el trabajo*.", "example_gloss": ["Mateo, would you like a coffee?", "Elena, shall I help you with the bag?", "Shall I give you a hand with the work?", "I can help you with the bag."]}
  es.a2.unit101.lesson03.teach.gn_quieres: {"title": "Offering something", "gloss": "Would you like a coffee? Would you like water?", "note": "To offer something to eat or drink, ask *¿Quieres...?* and name the thing."}
  es.a2.unit101.lesson03.teach.gn_puedo: {"title": "I can...", "gloss": "I can help you. I can open the window.", "note": "*Puedo* + infinitive says what you are able to do. *Ayudarte* is a chunk: 'to help you'."}
  es.a2.unit101.lesson03.teach.frases: {"title": "Three offers", "gloss": "Shall I help you? Shall I give you a hand? Would you like a coffee?"}
  es.a2.unit101.lesson04.teach.gn_aceptar: {"title": "Accepting", "gloss": "Yes, thank you. That is very kind. Yes, please.", "note": "To accept an offer, say *sí* and add *gracias* or *por favor*. *Muy amable* is a warm extra."}
  es.a2.unit101.lesson04.teach.gn_rechazar: {"title": "Declining an offer", "gloss": "No, thank you. There is no need. I will do it myself.", "note": "To say no kindly, add *gracias*. *No hace falta* means 'there is no need'."}
  es.a2.unit101.lesson04.teach.palabras: {"title": "Polite words", "gloss": "very kind / there is no need / I am sorry / now", "note": "*Lo siento* is a polite way to say sorry before you say no.", "example_gloss": ["Thank you, Elena. That is very kind.", "There is no need, thank you.", "I am sorry, Mateo. I cannot right now.", "I will do it myself, thank you."]}
  es.a2.unit101.lesson04.teach.gn_ya_lo_hago: {"title": "I will do it", "gloss": "I will do it myself. I will do it myself, thank you.", "note": "*Ya lo hago yo* is a friendly way to say you do not need help. Learn it as a set phrase."}
  es.a2.unit101.lesson04.teach.gn_no_puedo: {"title": "Declining a request", "gloss": "I am sorry, I cannot right now. I am sorry, I cannot wait right now.", "note": "When you cannot do what someone asks, start with *lo siento* and then *ahora no puedo*."}
  es.a2.unit101.lesson04.teach.frases: {"title": "Three replies", "gloss": "Yes, thank you. Very kind. No, thank you. There is no need. I am sorry, I cannot right now."}
  es.a2.unit101.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "today / tomorrow / but / see you tomorrow", "note": "*Pero* joins two ideas: a polite no and an offer.", "example_gloss": ["I cannot today, but tomorrow I can.", "Thanks for the coffee, Mateo.", "See you tomorrow, Elena.", "Mateo, can you bring the pen today?"]}
  es.a2.unit101.lesson05.teach.gn_pero: {"title": "Softening a no with pero", "gloss": "I am sorry, I cannot today, but tomorrow I can. Thanks, but there is no need.", "note": "*Pero* lets you decline and still sound friendly: *mañana sí* means 'tomorrow, yes'."}
  es.a2.unit101.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. I am sorry, I cannot bring the pen today, but I can tomorrow. Shall I give you a hand with the work? Thanks for the coffee, but there is no need. See you tomorrow!", "note": "Elena says no to one thing, offers help, and politely declines a coffee.", "glosses": {"hoy": "today", "mañana": "tomorrow", "pero": "but", "hasta": "until, see you"}}
  es.a2.unit101.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. Can you open the office window, please?"}
  es.a2.unit101.lesson06.teach.d2: {"title": "Mateo agrees and offers", "gloss": "Mateo: Yes, of course. Would you like a coffee?"}
  es.a2.unit101.lesson06.teach.d3: {"title": "Elena declines and asks", "gloss": "Elena: No, thank you. There is no need. Can you give me a pen, please?"}
  es.a2.unit101.lesson06.teach.d4: {"title": "Mateo offers help", "gloss": "Mateo: Here you are. Shall I give you a hand with the bag?"}
  es.a2.unit101.lesson06.teach.d5: {"title": "Elena accepts", "gloss": "Elena: Yes, thank you. That is very kind."}
  es.a2.unit101.lesson06.teach.d6: {"title": "Mateo says goodbye", "gloss": "Mateo: You are welcome. See you tomorrow!"}
exercises:
  es.a2.unit101.lesson01.exercise01.elige_sal: {"instruction": "Choose the right request.", "correct_option": "¿Me pasas la sal, por favor?", "distractors": ["¿Me das el bolígrafo, por favor?", "¿Puedes abrir la ventana, por favor?", "¿Puedes esperar un momento, por favor?"], "accepted_answers": [{"value": "¿Me pasas la sal, por favor?", "status": "correct"}], "feedback": "*Pasar* means to pass. *¿Me pasas la sal?* asks for the salt."}
  es.a2.unit101.lesson01.exercise02.elige_puerta: {"instruction": "Choose the right request.", "correct_option": "¿Puedes abrir la puerta, por favor?", "distractors": ["¿Puedes abrir la ventana, por favor?", "¿Me das el agua, por favor?", "¿Puedes esperar un momento, por favor?"], "accepted_answers": [{"value": "¿Puedes abrir la puerta, por favor?", "status": "correct"}], "feedback": "*¿Puedes* + *abrir* + *la puerta*: the door, not the window."}
  es.a2.unit101.lesson01.exercise03.une_peticiones: {"instruction": "Match each request to its meaning.", "accepted_answers": [{"value": [{"left": "¿Puedes abrir la puerta?", "right": "Can you open the door?"}, {"left": "¿Puedes esperar un momento?", "right": "Can you wait a moment?"}, {"left": "¿Me das el bolígrafo?", "right": "Can you give me the pen?"}, {"left": "¿Me pasas la sal?", "right": "Can you pass me the salt?"}, {"left": "¿Me das el agua?", "right": "Can you give me the water?"}, {"left": "¿Puedes traer el café?", "right": "Can you bring the coffee?"}, {"left": "por favor", "right": "please"}, {"left": "la ventana", "right": "the window"}], "status": "correct"}], "feedback": "*Puedes* is followed by an infinitive; *me das* and *me pasas* are followed by the thing you want."}
  es.a2.unit101.lesson01.exercise04.ordena_ventana: {"instruction": "Put the words in order to say 'Can you open the window, please?'", "correct_option": "Puedes abrir la ventana por favor", "accepted_answers": [{"value": "Puedes abrir la ventana por favor", "status": "correct"}, {"value": "Por favor puedes abrir la ventana", "status": "correct"}], "feedback": "*¿Puedes* + infinitive, then the object, then *por favor*."}
  es.a2.unit101.lesson01.exercise05.completa_puedes: {"instruction": "Complete the request to Mateo.", "correct_option": "puedes", "accepted_answers": [{"value": "puedes", "status": "correct"}], "feedback": "*Puedes* is followed directly by an infinitive: *puedes esperar*."}
  es.a2.unit101.lesson01.exercise06.traduce_ventana: {"instruction": "Translate into Spanish. Use *puedes* + infinitive.", "accepted_answers": [{"value": "¿Puedes abrir la ventana, por favor?", "status": "correct"}, {"value": "Puedes abrir la ventana, por favor", "status": "correct"}, {"value": "¿Puedes abrir la ventana por favor?", "status": "correct"}, {"value": "Puedes abrir la ventana por favor", "status": "correct"}, {"value": "Por favor, ¿puedes abrir la ventana?", "status": "correct"}, {"value": "Por favor, puedes abrir la ventana", "status": "correct"}, {"value": "¿Puedes abrir por favor la ventana?", "status": "correct"}, {"value": "Puedes abrir por favor la ventana", "status": "correct"}], "feedback": "*¿Puedes abrir la ventana, por favor?*"}
  es.a2.unit101.lesson01.exercise07.escribe_sal: {"instruction": "Write the request to Elena. Use *me pasas* and *por favor*.", "correct_option": "Elena, ¿me pasas la sal, por favor?", "accepted_answers": [{"value": "Elena, ¿me pasas la sal, por favor?", "status": "correct"}, {"value": "Elena, me pasas la sal, por favor", "status": "correct"}, {"value": "Elena, ¿me pasas la sal por favor?", "status": "correct"}, {"value": "Elena, me pasas la sal por favor", "status": "correct"}, {"value": "Por favor, Elena, ¿me pasas la sal?", "status": "correct"}, {"value": "Por favor, Elena, me pasas la sal", "status": "correct"}, {"value": "Elena, por favor, ¿me pasas la sal?", "status": "correct"}, {"value": "Elena, por favor, me pasas la sal", "status": "correct"}], "feedback": "*Elena, ¿me pasas la sal, por favor?*"}
  es.a2.unit101.lesson02.exercise01.elige_hora: {"instruction": "Choose the right request.", "correct_option": "¿Podrías decirme la hora?", "distractors": ["¿Podrías abrir la ventana?", "¿Puedes esperar un momento?", "¿Podrías ayudarme?"], "accepted_answers": [{"value": "¿Podrías decirme la hora?", "status": "correct"}], "feedback": "*¿Podrías decirme la hora?* asks for the time."}
  es.a2.unit101.lesson02.exercise02.elige_usted: {"instruction": "Choose the right request.", "correct_option": "Perdone, ¿podría decirme la hora?", "distractors": ["Perdone, ¿puede ayudarme?", "Perdone, ¿puede esperar un momento?", "Perdone, ¿puede abrir la ventana?"], "accepted_answers": [{"value": "Perdone, ¿podría decirme la hora?", "status": "correct"}], "feedback": "*Decirme la hora* is what you want to be told; the other requests ask for something else."}
  es.a2.unit101.lesson02.exercise03.une_formas: {"instruction": "Match each request to its meaning.", "accepted_answers": [{"value": [{"left": "¿Podrías esperar un momento?", "right": "Could you wait a moment?"}, {"left": "¿Podrías abrir la ventana?", "right": "Could you open the window?"}, {"left": "¿Podrías decirme la hora?", "right": "Could you tell me the time?"}, {"left": "¿Podrías ayudarme?", "right": "Could you help me? (to a friend)"}, {"left": "¿Puede ayudarme?", "right": "Can you help me? (formal)"}, {"left": "Perdone, ¿podría decirme la hora?", "right": "Excuse me, could you tell me the time? (formal)"}, {"left": "perdone", "right": "excuse me (formal)"}, {"left": "la hora", "right": "the time"}], "status": "correct"}], "feedback": "*Podrías* is for friends; *puede* and *podría* are for *usted*."}
  es.a2.unit101.lesson02.exercise04.ordena_hora: {"instruction": "Put the words in order to say 'Excuse me, could you tell me the time?'", "correct_option": "Perdone podría decirme la hora", "accepted_answers": [{"value": "Perdone podría decirme la hora", "status": "correct"}], "feedback": "*Perdone*, then *¿podría* + *decirme* + *la hora*?"}
  es.a2.unit101.lesson02.exercise05.completa_decirme: {"instruction": "Complete the formal request.", "correct_option": "decirme", "accepted_answers": [{"value": "decirme", "status": "correct"}], "feedback": "*Decirme* means 'to tell me', and it goes naturally with *la hora*."}
  es.a2.unit101.lesson02.exercise06.traduce_ayudarme: {"instruction": "Translate into Spanish. Use *podrías* + *ayudarme*.", "accepted_answers": [{"value": "Mateo, ¿podrías ayudarme, por favor?", "status": "correct"}, {"value": "Mateo, podrías ayudarme, por favor", "status": "correct"}, {"value": "Mateo, ¿podrías ayudarme por favor?", "status": "correct"}, {"value": "Mateo, podrías ayudarme por favor", "status": "correct"}, {"value": "Por favor, Mateo, ¿podrías ayudarme?", "status": "correct"}, {"value": "Por favor, Mateo, podrías ayudarme", "status": "correct"}, {"value": "¿Podrías ayudarme, por favor?", "status": "correct"}, {"value": "Podrías ayudarme, por favor", "status": "correct"}, {"value": "¿Podrías ayudarme por favor?", "status": "correct"}, {"value": "Podrías ayudarme por favor", "status": "correct"}, {"value": "Por favor, ¿podrías ayudarme?", "status": "correct"}, {"value": "Por favor, podrías ayudarme", "status": "correct"}], "feedback": "*Mateo, ¿podrías ayudarme, por favor?*"}
  es.a2.unit101.lesson02.exercise07.escribe_hora: {"instruction": "Write the formal request. Use *podría* and *decirme*.", "correct_option": "Perdone, ¿podría decirme la hora?", "accepted_answers": [{"value": "Perdone, ¿podría decirme la hora?", "status": "correct"}, {"value": "Perdone, podría decirme la hora", "status": "correct"}, {"value": "¿Podría decirme la hora?", "status": "correct"}, {"value": "Podría decirme la hora", "status": "correct"}, {"value": "Perdone, ¿podría decirme la hora, por favor?", "status": "correct"}, {"value": "Perdone, podría decirme la hora, por favor", "status": "correct"}, {"value": "¿Podría decirme la hora, por favor?", "status": "correct"}, {"value": "Podría decirme la hora, por favor", "status": "correct"}], "feedback": "*Perdone, ¿podría decirme la hora?*"}
  es.a2.unit101.lesson03.exercise01.elige_oferta: {"instruction": "Choose the right offer.", "correct_option": "¿Te ayudo con la bolsa?", "distractors": ["¿Puedes ayudarme con la bolsa?", "¿Me das la bolsa, por favor?", "¿Quieres un café?"], "accepted_answers": [{"value": "¿Te ayudo con la bolsa?", "status": "correct"}], "feedback": "*¿Te ayudo...?* offers help; *¿Puedes ayudarme...?* asks for help."}
  es.a2.unit101.lesson03.exercise02.elige_cafe: {"instruction": "Choose the right offer.", "correct_option": "¿Quieres un café?", "distractors": ["¿Puedes traer el café?", "¿Te ayudo con el trabajo?", "¿Me das un café?"], "accepted_answers": [{"value": "¿Quieres un café?", "status": "correct"}], "feedback": "*¿Quieres un café?* offers him a coffee."}
  es.a2.unit101.lesson03.exercise03.une_ofertas: {"instruction": "Match each offer to its meaning.", "accepted_answers": [{"value": [{"left": "¿Quieres un café?", "right": "Would you like a coffee?"}, {"left": "¿Quieres agua?", "right": "Would you like some water?"}, {"left": "Puedo ayudarte.", "right": "I can help you."}, {"left": "¿Te ayudo con el trabajo?", "right": "Shall I help you with the work?"}, {"left": "¿Te echo una mano con la bolsa?", "right": "Shall I give you a hand with the bag?"}, {"left": "una mano", "right": "a hand"}, {"left": "la bolsa", "right": "the bag"}], "status": "correct"}], "feedback": "An offer uses *te ayudo*, *te echo una mano* or *quieres*."}
  es.a2.unit101.lesson03.exercise04.ordena_mano: {"instruction": "Put the words in order to say 'Shall I give you a hand with the bag?'", "correct_option": "Te echo una mano con la bolsa", "accepted_answers": [{"value": "Te echo una mano con la bolsa", "status": "correct"}], "feedback": "*Te echo una mano* first, then *con la bolsa*."}
  es.a2.unit101.lesson03.exercise05.completa_ayudo: {"instruction": "Complete the offer to Elena.", "correct_option": "ayudo", "accepted_answers": [{"value": "ayudo", "status": "correct"}], "feedback": "*Te ayudo con la bolsa*: the *yo* form *ayudo* makes the offer."}
  es.a2.unit101.lesson03.exercise06.traduce_ayudo: {"instruction": "Translate into Spanish. Use *te ayudo*.", "accepted_answers": [{"value": "¿Te ayudo con la bolsa?", "status": "correct"}, {"value": "Te ayudo con la bolsa", "status": "correct"}, {"value": "Elena, ¿te ayudo con la bolsa?", "status": "correct"}, {"value": "Elena, te ayudo con la bolsa", "status": "correct"}], "feedback": "*¿Te ayudo con la bolsa?*"}
  es.a2.unit101.lesson03.exercise07.escribe_cafe: {"instruction": "Write the offer to Mateo. Use *quieres* and *un café*.", "correct_option": "Mateo, ¿quieres un café?", "accepted_answers": [{"value": "Mateo, ¿quieres un café?", "status": "correct"}, {"value": "Mateo, quieres un café", "status": "correct"}, {"value": "¿Quieres un café, Mateo?", "status": "correct"}, {"value": "Quieres un café, Mateo", "status": "correct"}, {"value": "¿Quieres un café?", "status": "correct"}, {"value": "Quieres un café", "status": "correct"}], "feedback": "*Mateo, ¿quieres un café?*"}
  es.a2.unit101.lesson04.exercise01.elige_aceptar: {"instruction": "Choose the right reply.", "correct_option": "Sí, gracias. Muy amable.", "distractors": ["No, gracias. No hace falta.", "Lo siento, ahora no puedo.", "Ya lo hago yo, gracias."], "accepted_answers": [{"value": "Sí, gracias. Muy amable.", "status": "correct"}], "feedback": "To accept, say *sí* and thank her."}
  es.a2.unit101.lesson04.exercise02.elige_rechazar: {"instruction": "Choose the right reply.", "correct_option": "Lo siento, ahora no puedo.", "distractors": ["Sí, gracias. Muy amable.", "No hace falta, gracias.", "Ya lo hago yo, gracias."], "accepted_answers": [{"value": "Lo siento, ahora no puedo.", "status": "correct"}], "feedback": "When you cannot do a request, say *lo siento, ahora no puedo*."}
  es.a2.unit101.lesson04.exercise03.une_respuestas: {"instruction": "Match each reply to its meaning.", "accepted_answers": [{"value": [{"left": "Sí, gracias.", "right": "Yes, thank you."}, {"left": "Sí, por favor.", "right": "Yes, please."}, {"left": "Muy amable.", "right": "That is very kind."}, {"left": "No, gracias.", "right": "No, thank you."}, {"left": "No hace falta.", "right": "There is no need."}, {"left": "Ya lo hago yo.", "right": "I will do it myself."}, {"left": "Lo siento.", "right": "I am sorry."}, {"left": "Ahora no puedo.", "right": "I cannot right now."}], "status": "correct"}], "feedback": "Some replies accept, some decline."}
  es.a2.unit101.lesson04.exercise04.ordena_siento: {"instruction": "Put the words in order to say 'I am sorry, I cannot right now.'", "correct_option": "Lo siento ahora no puedo", "accepted_answers": [{"value": "Lo siento ahora no puedo", "status": "correct"}, {"value": "Ahora no puedo lo siento", "status": "correct"}], "feedback": "*Lo siento* first, then *ahora no puedo*."}
