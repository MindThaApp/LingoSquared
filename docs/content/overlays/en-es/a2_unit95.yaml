answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit95.que_pasaba: {"title": "What Was Happening?", "description": "Say what was going on when something else happened, using estaba + gerund for the background and the preterite for the event, with cuando and mientras."}
lessons:
  es.a2.unit95.lesson01.estaba_cocinando: {"title": "I Was Cooking"}
  es.a2.unit95.lesson02.me_estaba_duchando: {"title": "I Was Having a Shower"}
  es.a2.unit95.lesson03.cuando_y_mientras: {"title": "When and While"}
  es.a2.unit95.lesson04.un_pequeno_incidente: {"title": "A Small Incident"}
  es.a2.unit95.lesson05.el_mensaje_de_mateo: {"title": "Mateo's Message"}
  es.a2.unit95.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit95.lesson01.teach.verbos: {"title": "Verbs of activity", "gloss": "to cook / to wait / to read / to sleep / to eat / to work / to rain", "note": "These infinitives name activities. *Llover* is only used with *it*: *llueve*, *lloviendo*.", "example_gloss": ["Elena cooks at home.", "Mateo works in the office.", "I wait for the bus.", "Today it rains a lot."]}
  es.a2.unit95.lesson01.teach.gn_gerundio: {"title": "The gerund: -ando and -iendo", "gloss": "to cook, cooking. to wait, waiting. to work, working. to eat, eating. to write, writing", "note": "Verbs in -ar form the gerund with -ando; verbs in -er and -ir use -iendo. The gerund never changes for gender or number. It is the Spanish '-ing'."}
  es.a2.unit95.lesson01.teach.gn_gerundio_irregular: {"title": "A few irregular gerunds", "gloss": "to read, reading. to sleep, sleeping. to rain, raining", "note": "*Leer* gives *leyendo* (the i between two vowels becomes y). *Dormir* changes its vowel: *durmiendo*. *Llover* is regular: *lloviendo*."}
  es.a2.unit95.lesson01.teach.gn_estar: {"title": "Estar in the imperfect", "gloss": "I was, you were, he was, she was, we were, they were", "note": "The imperfect of *estar* plus a gerund says what was in progress at a moment in the past. Note that *estaba* is used for *yo*, *él* and *ella*; the context tells you who it is."}
  es.a2.unit95.lesson01.teach.frases: {"title": "Three sentences", "gloss": "I was cooking. We were waiting. It was raining.", "note": "Each sentence is *estar* in the imperfect plus a gerund."}
  es.a2.unit95.lesson02.teach.actividades: {"title": "More activities", "gloss": "to have a shower / to walk the dog / to talk on the phone / to walk / to watch TV", "note": "*El perro* is the dog; *pasear al perro* is to walk the dog. *La tele* is short for *la televisión*.", "example_gloss": ["Mateo has a shower in the morning.", "Elena walks the dog.", "I talk on the phone with Mateo.", "I watch TV at home."]}
  es.a2.unit95.lesson02.teach.gn_gerundios2: {"title": "More gerunds", "gloss": "to walk, walking. to talk, talking. to walk, walking. to see, seeing. to do, doing", "note": "These follow the same rule: -ar gives -ando, -er and -ir give -iendo."}
  es.a2.unit95.lesson02.teach.gn_pronombre: {"title": "The pronoun goes before estaba", "gloss": "I was having a shower. You were having a shower. Mateo was having a shower. We were having a shower. They were having a shower.", "note": "A reflexive pronoun (*me, te, se, nos, se*) goes before *estaba*, not before the gerund. Spanish also allows it attached to the gerund (*estaba duchándome*), but in this course we place it before *estaba*."}
  es.a2.unit95.lesson02.teach.gn_pregunta: {"title": "Questions and negatives", "gloss": "What were you doing? I was not sleeping.", "note": "The question word comes first and *estabas* stays before the gerund. *No* goes before *estaba*."}
  es.a2.unit95.lesson02.teach.frases2: {"title": "Three sentences", "gloss": "Elena was walking the dog. I was talking on the phone. Mateo was watching TV."}
  es.a2.unit95.lesson03.teach.sucesos: {"title": "Events: past forms", "gloss": "to arrive / to leave / to see / to call / to ring / to start to rain", "note": "These are forms of the past (the preterite) that say a single event happened and finished. Only a few are taught here.", "example_gloss": ["I arrived at the office.", "I left the house.", "Elena called Mateo.", "The phone rang."]}
  es.a2.unit95.lesson03.teach.gn_indefinido: {"title": "Event forms: yo and él/ella", "gloss": "to arrive, I arrived, he arrived. to leave, I left, he left. to see, I saw, he saw. to call, he called. to ring, it rang. to start, it started", "note": "With *yo* the ending is -é (-ar verbs) or -í (-er and -ir verbs). With *él* and *ella* it is -ó or -ió. Watch the accents: *llegué, llegó, salí, salió*, but *vi* and *vio* have none."}
  es.a2.unit95.lesson03.teach.gn_cuando: {"title": "Background and event with cuando", "gloss": "It was raining when I left. When I arrived, Elena was cooking.", "note": "The action already in progress is the background: *estaba* plus a gerund. The short event that interrupts it uses the preterite and comes with *cuando*. When *cuando* starts the sentence, put a comma after the event."}
  es.a2.unit95.lesson03.teach.gn_mientras: {"title": "Mientras: two actions at the same time", "gloss": "While I was cooking, Mateo was reading.", "note": "*Mientras* links two actions that were in progress together. Both verbs stay in *estaba* plus the gerund; no event interrupts."}
  es.a2.unit95.lesson03.teach.frases3: {"title": "Three sentences", "gloss": "It was raining when I left. Mateo was working when the phone rang. While Elena was walking the dog, I was sleeping."}
  es.a2.unit95.lesson04.teach.incidente: {"title": "Words for an incident", "gloss": "bus / traffic jam / train / street / suddenly / then", "note": "*De repente* introduces something that happens suddenly. *Entonces* means 'then'.", "example_gloss": ["The bus arrived late.", "Today there is a traffic jam in the street.", "Suddenly the phone rang.", "Elena goes by train."]}
  es.a2.unit95.lesson04.teach.gn_iba: {"title": "Iba: was going", "gloss": "Mateo was riding his bike to the office. I was going home.", "note": "*Ir* has the imperfect form *iba*, used for movement in progress. It is the natural way to say 'was going', instead of *estaba yendo*. It is the same for *yo*, *él* and *ella*."}
  es.a2.unit95.lesson04.teach.gn_incidente: {"title": "Telling a small incident", "gloss": "I was waiting for the bus when it started to rain. Mateo was riding his bike when the phone rang.", "note": "Say the background first (*estaba esperando*, *iba*), then *cuando* and the event (*empezó a llover*, *sonó*). You can also start with *cuando* and put a comma after the event."}
  es.a2.unit95.lesson04.teach.gn_de_repente: {"title": "De repente and entonces", "gloss": "I was waiting for the bus. Suddenly it started to rain.", "note": "In a short story the first sentence gives the background and *de repente* announces the event that interrupts it."}
  es.a2.unit95.lesson04.teach.frases4: {"title": "Three sentences", "gloss": "Elena was on the train when Mateo called. Mateo was riding his bike when it started to rain. We were waiting for the bus when Elena called."}
  es.a2.unit95.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "wet (m.) / wet (f.) / uncle / Barcelona / at eight o'clock / who / very", "note": "*Mojado* changes with the speaker: *mojado* for a man, *mojada* for a woman.", "example_gloss": ["I am very wet.", "Elena is wet.", "Mateo has an uncle in Barcelona.", "I leave the house at eight.", "Who is calling?"]}
  es.a2.unit95.lesson05.teach.gn_relato: {"title": "Telling it as a story", "gloss": "I was riding my bike and it was raining a lot. I arrived at nine and I was very wet.", "note": "The background (what was in progress or the state of things) uses *estaba* or *iba*. The events in order (*salí, llegué*) use the preterite."}
  es.a2.unit95.lesson05.teach.gn_pregunta2: {"title": "Asking what was happening", "gloss": "What were you doing when it started to rain? I was working.", "note": "Ask with *¿Qué estabas haciendo cuando...?* and answer with *estaba* plus a gerund."}
  es.a2.unit95.lesson05.teach.lectura: {"title": "Mateo writes to Elena", "gloss": "Hi Elena. What a morning! I left the house at eight. I was riding my bike to the office and it was raining a lot. I arrived at nine and I was very wet. I was working when the phone rang: my uncle from Barcelona called. And you? What were you doing when it started to rain?", "note": "Notice how Mateo gives the background with *iba* and *estaba*, and the events with *salí*, *llegué*, *sonó* and *llamó*.", "glosses": {"mojado": "wet", "tío": "uncle", "sonó": "rang", "llamó": "called", "iba": "was going"}}
  es.a2.unit95.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Mateo, what were you doing when it started to rain?"}
  es.a2.unit95.lesson06.teach.d2: {"title": "Mateo answers", "gloss": "Mateo: I was riding my bike to the office. And you?"}
  es.a2.unit95.lesson06.teach.d3: {"title": "Elena answers", "gloss": "Elena: I was walking the dog. I was very wet when I got home!"}
  es.a2.unit95.lesson06.teach.d4: {"title": "Mateo tells more", "gloss": "Mateo: I was very wet when I arrived at the office. Then the phone rang."}
  es.a2.unit95.lesson06.teach.d5: {"title": "Elena asks who", "gloss": "Elena: Who called?"}
  es.a2.unit95.lesson06.teach.d6: {"title": "Mateo answers", "gloss": "Mateo: My uncle from Barcelona. I was working when he called."}
exercises:
  es.a2.unit95.lesson01.exercise01.elige_cocinando: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena estaba cocinando.", "distractors": ["Elena estaba cocinar.", "Elena estabas cocinando.", "Elena estaba cocinas."], "accepted_answers": [{"value": "Elena estaba cocinando.", "status": "correct"}], "feedback": "With *Elena* the helper is *estaba*, and the gerund of *cocinar* is *cocinando*."}
  es.a2.unit95.lesson01.exercise02.elige_esperando: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Estábamos esperando.", "distractors": ["Estaban esperando.", "Estábamos esperar.", "Estaba esperamos."], "accepted_answers": [{"value": "Estábamos esperando.", "status": "correct"}], "feedback": "*Estábamos* goes with *nosotros*, and *esperar* gives *esperando*."}
  es.a2.unit95.lesson01.exercise03.une_gerundios: {"instruction": "Match each Spanish word to its meaning.", "accepted_answers": [{"value": [{"left": "cocinando", "right": "cooking"}, {"left": "esperando", "right": "waiting"}, {"left": "trabajando", "right": "working"}, {"left": "comiendo", "right": "eating"}, {"left": "leyendo", "right": "reading"}, {"left": "durmiendo", "right": "sleeping"}, {"left": "lloviendo", "right": "raining"}, {"left": "estábamos", "right": "we were"}], "status": "correct"}], "feedback": "Gerunds end in -ando or -iendo."}
  es.a2.unit95.lesson01.exercise04.ordena_trabajando: {"instruction": "Put the words in order to say 'Mateo was working in the office.'", "correct_option": "Mateo estaba trabajando en la oficina", "accepted_answers": [{"value": "Mateo estaba trabajando en la oficina", "status": "correct"}], "feedback": "*Estaba* comes before the gerund *trabajando*."}
  es.a2.unit95.lesson01.exercise05.completa_estaban: {"instruction": "Complete with the imperfect of *estar* for *ellos*.", "correct_option": "estaban", "accepted_answers": [{"value": "estaban", "status": "correct"}], "feedback": "*Ellos estaban comiendo*: *ellos* takes *estaban*."}
  es.a2.unit95.lesson01.exercise06.traduce_lloviendo: {"instruction": "Translate into Spanish using *estar* in the imperfect and a gerund.", "accepted_answers": [{"value": "Estaba lloviendo.", "status": "correct"}, {"value": "Estaba lloviendo", "status": "correct"}], "feedback": "*Estaba lloviendo* = It was raining."}
  es.a2.unit95.lesson01.exercise07.escribe_durmiendo: {"instruction": "Write the sentence using *estar* in the imperfect and a gerund.", "correct_option": "Estaba durmiendo.", "accepted_answers": [{"value": "Estaba durmiendo.", "status": "correct"}, {"value": "Estaba durmiendo", "status": "correct"}, {"value": "Yo estaba durmiendo.", "status": "correct"}, {"value": "Yo estaba durmiendo", "status": "correct"}], "feedback": "*Estaba durmiendo* = I was sleeping."}
  es.a2.unit95.lesson02.exercise01.elige_duchando: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Me estaba duchando.", "distractors": ["Estaba me duchando.", "Me estaba duchado.", "Se estaba duchando."], "accepted_answers": [{"value": "Me estaba duchando.", "status": "correct"}], "feedback": "The pronoun *me* goes before *estaba*: *me estaba duchando*."}
  es.a2.unit95.lesson02.exercise02.elige_haciendo: {"instruction": "Choose the correct Spanish question (to a friend).", "correct_option": "¿Qué estabas haciendo?", "distractors": ["¿Qué estás haciendo?", "¿Qué estabas hacer?", "¿Qué estabas hecho?"], "accepted_answers": [{"value": "¿Qué estabas haciendo?", "status": "correct"}], "feedback": "*Tú* takes *estabas*, and *hacer* gives the gerund *haciendo*."}
  es.a2.unit95.lesson02.exercise03.une_frases2: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Me estaba duchando.", "right": "I was having a shower."}, {"left": "Elena estaba paseando al perro.", "right": "Elena was walking the dog."}, {"left": "Yo estaba hablando por teléfono.", "right": "I was talking on the phone."}, {"left": "Mateo estaba viendo la tele.", "right": "Mateo was watching TV."}, {"left": "Estábamos caminando.", "right": "We were walking."}, {"left": "Mateo no estaba durmiendo.", "right": "Mateo was not sleeping."}, {"left": "¿Qué estabas haciendo?", "right": "What were you doing?"}, {"left": "Te estabas duchando.", "right": "You were having a shower."}], "status": "correct"}], "feedback": "Each sentence is *estar* in the imperfect plus a gerund."}
  es.a2.unit95.lesson02.exercise04.ordena_duchando: {"instruction": "Put the words in order to say 'Elena was having a shower at home.'", "correct_option": "Elena se estaba duchando en casa", "accepted_answers": [{"value": "Elena se estaba duchando en casa", "status": "correct"}], "feedback": "The pronoun *se* goes before *estaba*."}
  es.a2.unit95.lesson02.exercise05.completa_estabamos: {"instruction": "Complete with the imperfect of *estar* for *nosotros*.", "correct_option": "estábamos", "accepted_answers": [{"value": "estábamos", "status": "correct"}], "feedback": "*Nosotros nos estábamos duchando*: *nos* goes with *estábamos*."}
  es.a2.unit95.lesson02.exercise06.traduce_paseando: {"instruction": "Translate into Spanish using *estar* in the imperfect and a gerund.", "accepted_answers": [{"value": "Elena estaba paseando al perro.", "status": "correct"}, {"value": "Elena estaba paseando al perro", "status": "correct"}, {"value": "Elena estaba paseando a su perro.", "status": "correct"}, {"value": "Elena estaba paseando a su perro", "status": "correct"}], "feedback": "*Elena estaba paseando al perro.*"}
  es.a2.unit95.lesson02.exercise07.escribe_nos_duchando: {"instruction": "Write the sentence with the reflexive pronoun *nos* before *estábamos*.", "correct_option": "Nos estábamos duchando.", "accepted_answers": [{"value": "Nos estábamos duchando.", "status": "correct"}, {"value": "Nos estábamos duchando", "status": "correct"}, {"value": "Estábamos duchándonos.", "status": "correct"}, {"value": "Estábamos duchándonos", "status": "correct"}], "feedback": "*Nos estábamos duchando* = We were having a shower."}
  es.a2.unit95.lesson03.exercise01.elige_cuando_sali: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Estaba lloviendo cuando salí.", "distractors": ["Estaba lloviendo cuando salir.", "Estaba lloviendo cuando saliendo.", "Estaba lloviendo cuando salió."], "accepted_answers": [{"value": "Estaba lloviendo cuando salí.", "status": "correct"}], "feedback": "The background is *estaba lloviendo*; the event is *salí* (yo, preterite)."}
  es.a2.unit95.lesson03.exercise02.elige_cuando_llegue: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Cuando llegué, Elena estaba cocinando.", "distractors": ["Cuando llegué, Elena cocinando.", "Cuando llegando, Elena estaba cocinando.", "Cuando llegó, Elena estaba cocinando."], "accepted_answers": [{"value": "Cuando llegué, Elena estaba cocinando.", "status": "correct"}], "feedback": "*Llegué* is the event for *yo*; *llegó* would mean that someone else arrived."}
  es.a2.unit95.lesson03.exercise03.une_fondo_evento: {"instruction": "Match each Spanish word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "estaba lloviendo", "right": "it was raining (background)"}, {"left": "salí", "right": "I left (event)"}, {"left": "estaba cocinando", "right": "was cooking (background)"}, {"left": "llegué", "right": "I arrived (event)"}, {"left": "sonó", "right": "it rang (event)"}, {"left": "estaba durmiendo", "right": "was sleeping (background)"}, {"left": "llamó", "right": "he called (event)"}, {"left": "vi", "right": "I saw (event)"}, {"left": "mientras", "right": "while"}, {"left": "cuando", "right": "when"}], "status": "correct"}], "feedback": "Background uses *estaba* plus a gerund; events use the preterite."}
  es.a2.unit95.lesson03.exercise04.ordena_cuando: {"instruction": "Put the words in order to say 'It was raining when I left the house.'", "correct_option": "Estaba lloviendo cuando salí de casa", "accepted_answers": [{"value": "Estaba lloviendo cuando salí de casa", "status": "correct"}], "feedback": "Background first, then *cuando* and the event."}
  es.a2.unit95.lesson03.exercise05.completa_sono: {"instruction": "Complete with the preterite of *sonar* (the event that interrupts).", "correct_option": "sonó", "accepted_answers": [{"value": "sonó", "status": "correct"}], "feedback": "*Sonó* is the event; *estaba trabajando* is the background."}
  es.a2.unit95.lesson03.exercise06.traduce_cuando_sono: {"instruction": "Translate into Spanish: *estaba* plus a gerund for the background and the preterite for the event.", "accepted_answers": [{"value": "Mateo estaba trabajando cuando sonó el teléfono.", "status": "correct"}, {"value": "Mateo estaba trabajando cuando sonó el teléfono", "status": "correct"}, {"value": "Cuando sonó el teléfono, Mateo estaba trabajando.", "status": "correct"}, {"value": "Cuando sonó el teléfono, Mateo estaba trabajando", "status": "correct"}], "feedback": "*Mateo estaba trabajando cuando sonó el teléfono.*"}
  es.a2.unit95.lesson03.exercise07.escribe_mientras: {"instruction": "Write one sentence with *mientras* and *estaba* plus a gerund in both parts.", "correct_option": "Mientras Elena estaba cocinando, Mateo estaba leyendo.", "accepted_answers": [{"value": "Mientras Elena estaba cocinando, Mateo estaba leyendo.", "status": "correct"}, {"value": "Mientras Elena estaba cocinando, Mateo estaba leyendo", "status": "correct"}, {"value": "Mateo estaba leyendo mientras Elena estaba cocinando.", "status": "correct"}, {"value": "Mateo estaba leyendo mientras Elena estaba cocinando", "status": "correct"}], "feedback": "*Mientras Elena estaba cocinando, Mateo estaba leyendo.*"}
  es.a2.unit95.lesson04.exercise01.elige_iba: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo iba en bici cuando sonó el teléfono.", "distractors": ["Mateo ibas en bici cuando sonó el teléfono.", "Mateo iba bici cuando sonó el teléfono.", "Mateo iba en bici cuando sonar el teléfono."], "accepted_answers": [{"value": "Mateo iba en bici cuando sonó el teléfono.", "status": "correct"}], "feedback": "*Iba* is the background and *sonó* is the event."}
  es.a2.unit95.lesson04.exercise02.elige_empezo: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Estaba esperando el autobús cuando empezó a llover.", "distractors": ["Estaba esperando el autobús cuando empezó llover.", "Estaba esperado el autobús cuando empezó a llover.", "Estaba esperando el autobús cuando empezando a llover."], "accepted_answers": [{"value": "Estaba esperando el autobús cuando empezó a llover.", "status": "correct"}], "feedback": "*Empezar a* plus infinitive: *empezó a llover*."}
  es.a2.unit95.lesson04.exercise03.une_incidente: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Estaba esperando el autobús.", "right": "I was waiting for the bus."}, {"left": "De repente empezó a llover.", "right": "Suddenly it started to rain."}, {"left": "Mateo iba en bici.", "right": "Mateo was riding his bike."}, {"left": "Sonó el teléfono.", "right": "The phone rang."}, {"left": "Elena estaba en el tren.", "right": "Elena was on the train."}, {"left": "El autobús llegó tarde.", "right": "The bus arrived late."}, {"left": "Llegué a casa.", "right": "I got home."}, {"left": "Entonces llamó Elena.", "right": "Then Elena called."}], "status": "correct"}], "feedback": "Background sentences use *estaba* or *iba*; events use the preterite."}
  es.a2.unit95.lesson04.exercise04.ordena_incidente: {"instruction": "Put the words in order to say 'Mateo was riding his bike when it started to rain.'", "correct_option": "Mateo iba en bici cuando empezó a llover", "accepted_answers": [{"value": "Mateo iba en bici cuando empezó a llover", "status": "correct"}], "feedback": "Background first, then *cuando* and the event."}
  es.a2.unit95.lesson04.exercise05.completa_llamo: {"instruction": "Complete with the preterite of *llamar* (Mateo is the one who calls).", "correct_option": "llamó", "accepted_answers": [{"value": "llamó", "status": "correct"}], "feedback": "*Llamó Mateo*: the event that interrupts *estaba en el tren*."}
  es.a2.unit95.lesson04.exercise06.traduce_iba_casa: {"instruction": "Translate into Spanish: *iba* for the background and the preterite for the event.", "accepted_answers": [{"value": "Iba en bici a casa cuando empezó a llover.", "status": "correct"}, {"value": "Iba en bici a casa cuando empezó a llover", "status": "correct"}, {"value": "Iba a casa en bici cuando empezó a llover.", "status": "correct"}, {"value": "Iba a casa en bici cuando empezó a llover", "status": "correct"}, {"value": "Cuando empezó a llover, iba en bici a casa.", "status": "correct"}, {"value": "Cuando empezó a llover, iba en bici a casa", "status": "correct"}], "feedback": "*Iba en bici a casa cuando empezó a llover.*"}
  es.a2.unit95.lesson04.exercise07.escribe_incidente: {"instruction": "Write exactly two sentences: first *estaba* plus a gerund, then *de repente* and *empezó a llover*.", "correct_option": "Estaba esperando el autobús. De repente empezó a llover.", "accepted_answers": [{"value": "Estaba esperando el autobús. De repente empezó a llover.", "status": "correct"}, {"value": "Estaba esperando el autobús. De repente empezó a llover", "status": "correct"}, {"value": "Estaba esperando el autobús. De repente, empezó a llover.", "status": "correct"}, {"value": "Estaba esperando el autobús. De repente, empezó a llover", "status": "correct"}], "feedback": "*Estaba esperando el autobús. De repente empezó a llover.*"}
  es.a2.unit95.lesson05.exercise01.lee_tiempo: {"instruction": "Read Mateo's message and choose the answer.", "correct_option": "It was raining a lot.", "distractors": ["It was very sunny.", "It was snowing.", "It was very windy."], "accepted_answers": [{"value": "It was raining a lot.", "status": "correct"}], "feedback": "*Iba en bici a la oficina y estaba lloviendo mucho.*"}
