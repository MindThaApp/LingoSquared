answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit96.experiencias: {"title": "Experiences", "description": "Ask and say what you have or have never done, and whether you have already done something yet, with the present perfect, alguna vez, nunca, ya and todavía no."}
lessons:
  es.a2.unit96.lesson01.has_estado_alguna_vez: {"title": "Have You Ever Been?"}
  es.a2.unit96.lesson02.nunca_he: {"title": "I Have Never Been"}
  es.a2.unit96.lesson03.ya_todavia_no: {"title": "Already or Not Yet"}
  es.a2.unit96.lesson04.que_has_probado: {"title": "What Have You Tried?"}
  es.a2.unit96.lesson05.la_lista_de_elena: {"title": "Elena's List"}
  es.a2.unit96.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit96.lesson01.teach.lugares_comida: {"title": "Places, food, transport", "gloss": "Barcelona / the train / paella / pizza", "note": "Words for the experiences in this unit.", "example_gloss": ["My uncle lives in Barcelona.", "Elena travels by train.", "Paella is a dish from Spain.", "I like pizza."]}
  es.a2.unit96.lesson01.teach.participios: {"title": "Participles for experiences", "gloss": "been / travelled / tried / seen / eaten", "note": "These participles come from estar, viajar, probar, ver and comer. They work with *haber* like the ones you know.", "example_gloss": ["I have been in Barcelona.", "You have travelled by train.", "Mateo has tried paella.", "We have eaten pizza."]}
  es.a2.unit96.lesson01.teach.alguna_vez: {"title": "Ever, once, twice, never", "gloss": "ever / once / twice / three times / many times / never", "note": "*Alguna vez* asks about any time in a person's life. The plural of *vez* is *veces*.", "example_gloss": ["Have you ever been in Barcelona?", "Yes, once.", "Yes, many times.", "No, never."]}
  es.a2.unit96.lesson01.teach.fr_pregunta: {"title": "Asking: ¿Has ... alguna vez?", "gloss": "Have you ever tried paella? Yes, once. No, never.", "note": "To ask about life experience use *haber* + participle + *alguna vez*. Short answers are enough: *Sí, una vez* or *No, nunca*."}
  es.a2.unit96.lesson01.teach.gn_veces: {"title": "Counting times", "gloss": "once, twice, three times, many times", "note": "*Vez* means 'time' (an occasion). In the plural the z changes to c: *veces*. The expression goes after the participle or alone as an answer."}
  es.a2.unit96.lesson01.teach.frases: {"title": "Two exchanges", "gloss": "Have you ever travelled by train? Yes, many times. Have you seen Barcelona? No, never."}
  es.a2.unit96.lesson02.teach.deportes: {"title": "Sports and more participles", "gloss": "to ski / to swim / to ride a horse / to ride a bike", "note": "The participles are *esquiado*, *nadado* and *montado*. We say *montar a caballo* but *montar en bici*.", "example_gloss": ["I have never skied.", "Elena has swum in the sea.", "Mateo has ridden a bike.", "I have not ridden a horse."]}
  es.a2.unit96.lesson02.teach.gn_nunca_he: {"title": "Nunca before haber", "gloss": "I have never skied. You have never been in Barcelona. Mateo has never tried paella.", "note": "*Nunca* goes before *haber*, and nothing comes between *nunca* and *he/has/ha*. Do not add *no*: *nunca he esquiado*, not *no nunca he esquiado*."}
  es.a2.unit96.lesson02.teach.gn_no_nunca: {"title": "No ... nunca after the participle", "gloss": "I have never skied. You have never been in Barcelona. Mateo has never tried paella.", "note": "If *nunca* comes after the verb, you need *no* before *haber*. The meaning is the same as *nunca he esquiado*. Never put *nunca* between *haber* and the participle."}
  es.a2.unit96.lesson02.teach.jamas: {"title": "Jamás: never ever", "gloss": "never (ever)", "note": "*Jamás* is a stronger *nunca* ('never ever'). It follows the same placement rules.", "example_gloss": ["I have never ridden a horse.", "I have never swum in the sea."]}
  es.a2.unit96.lesson02.teach.gn_respuesta: {"title": "Answering ¿Has ... alguna vez?", "gloss": "Have you ever skied? No, never. No, I have never skied. No, I have never skied.", "note": "A negative answer can be short (*No, nunca*) or full (*Nunca he esquiado* / *No he esquiado nunca*)."}
  es.a2.unit96.lesson02.teach.frases: {"title": "Two negative answers", "gloss": "I have never tried paella. I have never swum in the sea."}
  es.a2.unit96.lesson03.teach.ya_todavia: {"title": "Ya and todavía no", "gloss": "already / not yet / done, made / gone", "note": "*Ya* means 'already' and *todavía no* means 'not yet'. The participle of *hacer* is *hecho* and the participle of *ir* is *ido*.", "example_gloss": ["I have already eaten.", "I have not eaten yet.", "Have you already made the paella?", "I have not tried paella yet."]}
  es.a2.unit96.lesson03.teach.gn_ya: {"title": "Ya: has it happened yet?", "gloss": "Have you eaten already? Yes, I have already eaten. No, I haven't eaten yet.", "note": "Ask with *ya* when you expect something to happen soon. The answer is *ya* (it has happened) or *todavía no* (it has not happened yet)."}
  es.a2.unit96.lesson03.teach.fr_contraste: {"title": "Alguna vez or ya?", "gloss": "Have you ever travelled by train? Have you eaten already?", "note": "*Alguna vez* asks about any time in your whole life: has this experience ever happened? *Ya* asks about a thing you expect: has it happened by now? You answer *alguna vez* with *una vez*, *muchas veces* or *nunca*; you answer *ya* with *ya* or *todavía no*."}
  es.a2.unit96.lesson03.teach.estado_ido: {"title": "Estado en, ido a", "gloss": "to be in, been in. to go to, gone to.", "note": "*Estado en* says you were in a place. *Ido a* says you went to a place; it names the movement and the destination.", "example_gloss": ["I have been in Barcelona.", "I have gone to Barcelona by train.", "Mateo has gone to the office."]}
  es.a2.unit96.lesson03.teach.gn_estado_ido: {"title": "Be or go", "gloss": "I have been in Barcelona. I have gone to Barcelona by train. I haven't gone to Barcelona yet.", "note": "Use *estar en* for being in a place and *ir a* for going to a place. The prepositions do not change: *estado en*, *ido a*."}
  es.a2.unit96.lesson04.teach.comida: {"title": "More food", "gloss": "fish / soup / ice cream", "note": "More food words for asking what someone has tried.", "example_gloss": ["Have you tried the fish?", "Elena has eaten soup.", "I have never tried lemon ice cream."]}
  es.a2.unit96.lesson04.teach.lugares: {"title": "Places for activities", "gloss": "the sea / the mountain / the beach / the countryside", "note": "*Se puede* + infinitive means 'you can' or 'it is possible to'.", "example_gloss": ["On the beach you can swim.", "In the mountains you can ski.", "In the countryside you can ride a horse."]}
  es.a2.unit96.lesson04.teach.gn_se_puede: {"title": "Se puede + infinitivo", "gloss": "You can swim in the sea. You can ski in the mountains.", "note": "*Se puede* + infinitive says what is possible in a place. *Puede* stays singular and the second verb stays in the infinitive."}
  es.a2.unit96.lesson04.teach.fr_preguntas: {"title": "Asking about food, places and sports", "gloss": "Have you ever tried fish? Have you been in the mountains? Have you ever ridden a horse? And you?", "note": "All three questions use *haber* + participle. *¿Y tú?* returns the same question to the other person."}
  es.a2.unit96.lesson04.teach.respuestas: {"title": "Answers", "gloss": "Yes, twice. No, never. Not yet."}
  es.a2.unit96.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "these are / my experiences / I have / a dog / but / right?", "note": "*Tengo* is 'I have' for possession; it is not the helper *haber*. *¿Verdad?* at the end asks the other person to agree.", "example_gloss": ["These are my experiences.", "I have a dog, but I have never ridden a horse.", "You have been in Barcelona, right?"]}
  es.a2.unit96.lesson05.teach.gn_pero: {"title": "Linking with pero", "gloss": "I have travelled by train many times, but I have never been in Barcelona.", "note": "*Pero* joins two experiences that contrast. Each part keeps its own *haber* form."}
  es.a2.unit96.lesson05.teach.gn_orden: {"title": "Where to put the number of times", "gloss": "I have travelled by train many times. I have travelled by train many times.", "note": "*Muchas veces* and *una vez* can come after the participle or at the start of the sentence."}
  es.a2.unit96.lesson05.teach.saludo: {"title": "Opening a message", "gloss": "Hi, Mateo. These are my experiences."}
  es.a2.unit96.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. These are my experiences. I have a dog, but I have never ridden a horse. I have travelled by train many times. I have been on the beach and I have swum in the sea. I have tried paella once. I haven't tried fish yet. I haven't been in Barcelona yet. You have been, right?", "note": "Notice *nunca*, *muchas veces*, *una vez* and *todavía no* in the same short message.", "glosses": {"experiencias": "experiences", "perro": "dog", "pero": "but", "verdad": "right, true"}}
  es.a2.unit96.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Mateo, have you ever been in Barcelona?"}
  es.a2.unit96.lesson06.teach.d2: {"title": "Mateo answers", "gloss": "Mateo: Yes, many times. My uncle lives in Barcelona."}
  es.a2.unit96.lesson06.teach.d3: {"title": "Elena asks about food", "gloss": "Elena: Have you tried paella in Barcelona?"}
  es.a2.unit96.lesson06.teach.d4: {"title": "Mateo asks back", "gloss": "Mateo: Yes, twice. And you? Have you been in Barcelona already?"}
  es.a2.unit96.lesson06.teach.d5: {"title": "Elena answers", "gloss": "Elena: No, I haven't been yet, but I have travelled by train many times."}
  es.a2.unit96.lesson06.teach.d6: {"title": "Mateo encourages", "gloss": "Mateo: Then you have to go. It is a very pretty city."}
exercises:
  es.a2.unit96.lesson01.exercise01.elige_pregunta: {"instruction": "Choose the correct Spanish question.", "correct_option": "¿Has probado la paella alguna vez?", "distractors": ["¿Has probar la paella alguna vez?", "¿Has probado la paella alguna veces?", "¿He probado la paella alguna vez?"], "accepted_answers": [{"value": "¿Has probado la paella alguna vez?", "status": "correct"}], "feedback": "*Tú* takes *has*, and *probar* gives *probado*: *¿Has probado la paella alguna vez?*"}
  es.a2.unit96.lesson01.exercise02.elige_respuesta: {"instruction": "Choose the correct short answer.", "correct_option": "Sí, muchas veces.", "distractors": ["No, nunca.", "Sí, una vez.", "Sí, dos veces."], "accepted_answers": [{"value": "Sí, muchas veces.", "status": "correct"}], "feedback": "*Muchas veces* means 'many times'."}
  es.a2.unit96.lesson01.exercise03.une_palabras: {"instruction": "Match each Spanish word to its meaning.", "accepted_answers": [{"value": [{"left": "estado", "right": "been"}, {"left": "viajado", "right": "travelled"}, {"left": "probado", "right": "tried"}, {"left": "visto", "right": "seen"}, {"left": "comido", "right": "eaten"}, {"left": "alguna vez", "right": "ever"}, {"left": "una vez", "right": "once"}, {"left": "dos veces", "right": "twice"}, {"left": "muchas veces", "right": "many times"}, {"left": "nunca", "right": "never"}], "status": "correct"}], "feedback": "Participles and expressions of frequency."}
  es.a2.unit96.lesson01.exercise04.ordena_pregunta: {"instruction": "Put the words in order to ask 'Have you ever been in Barcelona?'", "correct_option": "Has estado en Barcelona alguna vez", "accepted_answers": [{"value": "Has estado en Barcelona alguna vez", "status": "correct"}, {"value": "Has estado alguna vez en Barcelona", "status": "correct"}], "feedback": "*Has estado en Barcelona alguna vez*: *alguna vez* can also come right after the participle."}
  es.a2.unit96.lesson01.exercise05.completa_probado: {"instruction": "Complete with the participle of *probar*.", "correct_option": "probado", "accepted_answers": [{"value": "probado", "status": "correct"}], "feedback": "*¿Has probado la paella alguna vez?*"}
  es.a2.unit96.lesson01.exercise06.traduce_tren: {"instruction": "Translate into Spanish.", "accepted_answers": [{"value": "¿Has viajado en tren alguna vez?", "status": "correct"}, {"value": "Has viajado en tren alguna vez", "status": "correct"}, {"value": "¿Has viajado alguna vez en tren?", "status": "correct"}, {"value": "Has viajado alguna vez en tren", "status": "correct"}], "feedback": "*¿Has viajado en tren alguna vez?*"}
  es.a2.unit96.lesson01.exercise07.escribe_respuesta: {"instruction": "Write the short answer with *una vez*.", "correct_option": "Sí, una vez.", "accepted_answers": [{"value": "Sí, una vez.", "status": "correct"}, {"value": "Sí, una vez", "status": "correct"}], "feedback": "*Sí, una vez.*"}
  es.a2.unit96.lesson02.exercise01.elige_nunca: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Nunca he esquiado.", "distractors": ["Nunca he esquiar.", "Nunca ha esquiado.", "No nunca he esquiado."], "accepted_answers": [{"value": "Nunca he esquiado.", "status": "correct"}], "feedback": "*Nunca* goes before *he*, and *esquiar* gives *esquiado*."}
  es.a2.unit96.lesson02.exercise02.elige_no_nunca: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "No he estado nunca en Barcelona.", "distractors": ["No estado he nunca en Barcelona.", "No he estada nunca en Barcelona.", "No ha estado nunca en Barcelona."], "accepted_answers": [{"value": "No he estado nunca en Barcelona.", "status": "correct"}], "feedback": "With *nunca* after the verb, use *no he estado nunca*."}
  es.a2.unit96.lesson02.exercise03.une_nunca: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Nunca he esquiado.", "right": "I have never skied."}, {"left": "No he nadado nunca.", "right": "I have never swum."}, {"left": "Jamás he montado a caballo.", "right": "I have never ridden a horse."}, {"left": "Nunca he montado en bici.", "right": "I have never ridden a bike."}, {"left": "No he probado nunca la paella.", "right": "I have never tried paella."}, {"left": "Jamás he estado en Barcelona.", "right": "I have never been in Barcelona."}], "status": "correct"}], "feedback": "All six sentences say 'never'."}
  es.a2.unit96.lesson02.exercise04.ordena_nunca: {"instruction": "Put the words in order to say 'I have never ridden a horse.'", "correct_option": "Nunca he montado a caballo", "accepted_answers": [{"value": "Nunca he montado a caballo", "status": "correct"}], "feedback": "*Nunca he montado a caballo*."}
  es.a2.unit96.lesson02.exercise05.completa_nunca: {"instruction": "Complete with a word for 'never'.", "correct_option": "nunca", "accepted_answers": [{"value": "nunca", "status": "correct"}, {"value": "jamás", "status": "correct"}], "feedback": "*No he esquiado nunca*: after the verb, *nunca* needs *no* before *he*."}
  es.a2.unit96.lesson02.exercise06.traduce_nunca: {"instruction": "Translate into Spanish. Put *nunca* before *he*.", "accepted_answers": [{"value": "Nunca he probado la paella.", "status": "correct"}, {"value": "Nunca he probado la paella", "status": "correct"}, {"value": "Nunca he probado paella.", "status": "correct"}, {"value": "Nunca he probado paella", "status": "correct"}], "feedback": "*Nunca he probado la paella.*"}
  es.a2.unit96.lesson02.exercise07.escribe_no_nunca: {"instruction": "Write the sentence with *no* before the verb and *nunca* after the participle.", "correct_option": "No he esquiado nunca.", "accepted_answers": [{"value": "No he esquiado nunca.", "status": "correct"}, {"value": "No he esquiado nunca", "status": "correct"}], "feedback": "*No he esquiado nunca.*"}
  es.a2.unit96.lesson03.exercise01.elige_ya: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Ya he comido.", "distractors": ["Todavía no he comido.", "Ya he comer.", "Ya ha comido."], "accepted_answers": [{"value": "Ya he comido.", "status": "correct"}], "feedback": "*Ya he comido* = I have already eaten."}
  es.a2.unit96.lesson03.exercise02.elige_estado_en: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "He estado en Barcelona.", "distractors": ["He estado a Barcelona.", "He ido en Barcelona.", "He estar en Barcelona."], "accepted_answers": [{"value": "He estado en Barcelona.", "status": "correct"}], "feedback": "*Estado* goes with *en*; *ido* goes with *a*."}
  es.a2.unit96.lesson03.exercise03.une_ya: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Ya he comido.", "right": "I have already eaten."}, {"left": "Todavía no he comido.", "right": "I haven't eaten yet."}, {"left": "¿Ya has hecho la paella?", "right": "Have you already made the paella?"}, {"left": "He estado en Barcelona.", "right": "I have been in Barcelona."}, {"left": "He ido a Barcelona en tren.", "right": "I have gone to Barcelona by train."}, {"left": "¿Has comido paella alguna vez?", "right": "Have you ever eaten paella?"}, {"left": "Todavía no he probado la paella.", "right": "I haven't tried paella yet."}], "status": "correct"}], "feedback": "Keep *alguna vez* (ever) apart from *ya* (already)."}
  es.a2.unit96.lesson03.exercise04.ordena_todavia: {"instruction": "Put the words in order to say 'I haven't been in Barcelona yet.'", "correct_option": "Todavía no he estado en Barcelona", "accepted_answers": [{"value": "Todavía no he estado en Barcelona", "status": "correct"}], "feedback": "*Todavía no he estado en Barcelona*."}
  es.a2.unit96.lesson03.exercise05.completa_ido_a: {"instruction": "Complete with the preposition that goes with *ir*.", "correct_option": "a", "accepted_answers": [{"value": "a", "status": "correct"}], "feedback": "*Ir* is followed by *a*: *he ido a Barcelona*."}
  es.a2.unit96.lesson03.exercise06.traduce_alguna_vez: {"instruction": "Translate into Spanish using *alguna vez*.", "accepted_answers": [{"value": "¿Has comido paella alguna vez?", "status": "correct"}, {"value": "Has comido paella alguna vez", "status": "correct"}, {"value": "¿Has comido alguna vez paella?", "status": "correct"}, {"value": "Has comido alguna vez paella", "status": "correct"}], "feedback": "*¿Has comido paella alguna vez?*"}
  es.a2.unit96.lesson03.exercise07.escribe_ya_todavia: {"instruction": "Write exactly two sentences: the first with *ya*, the second with *todavía no*.", "correct_option": "Ya he comido. Todavía no he hecho la paella.", "accepted_answers": [{"value": "Ya he comido. Todavía no he hecho la paella.", "status": "correct"}, {"value": "Ya he comido. Todavía no he hecho la paella", "status": "correct"}], "feedback": "*Ya he comido. Todavía no he hecho la paella.*"}
  es.a2.unit96.lesson04.exercise01.elige_se_puede: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Se puede nadar en el mar.", "distractors": ["Se puede nadando en el mar.", "Se pueden nadar en el mar.", "Se puede nadado en el mar."], "accepted_answers": [{"value": "Se puede nadar en el mar.", "status": "correct"}], "feedback": "*Se puede* is followed by the infinitive: *nadar*."}
  es.a2.unit96.lesson04.exercise02.elige_caballo: {"instruction": "Choose the correct Spanish question.", "correct_option": "¿Has montado a caballo alguna vez?", "distractors": ["¿Has montar a caballo alguna vez?", "¿Has montado a caballo alguna veces?", "¿He montado a caballo alguna vez?"], "accepted_answers": [{"value": "¿Has montado a caballo alguna vez?", "status": "correct"}], "feedback": "*Tú* takes *has*, and *montar* gives *montado*."}
  es.a2.unit96.lesson04.exercise03.une_lugares: {"instruction": "Match each Spanish word to its meaning.", "accepted_answers": [{"value": [{"left": "el mar", "right": "the sea"}, {"left": "la montaña", "right": "the mountain"}, {"left": "la playa", "right": "the beach"}, {"left": "el campo", "right": "the countryside"}, {"left": "el pescado", "right": "fish"}, {"left": "la sopa", "right": "soup"}, {"left": "el helado", "right": "ice cream"}, {"left": "esquiar", "right": "to ski"}, {"left": "nadar", "right": "to swim"}], "status": "correct"}], "feedback": "Places, food and sports."}
  es.a2.unit96.lesson04.exercise04.ordena_montana: {"instruction": "Put the words in order to say 'In the mountains you can ski.'", "correct_option": "En la montaña se puede esquiar", "accepted_answers": [{"value": "En la montaña se puede esquiar", "status": "correct"}, {"value": "Se puede esquiar en la montaña", "status": "correct"}], "feedback": "*Se puede esquiar* can also start the sentence."}
  es.a2.unit96.lesson04.exercise05.completa_se_puede: {"instruction": "Complete with the correct present-tense form of *poder* (impersonal *se*).", "correct_option": "puede", "accepted_answers": [{"value": "puede", "status": "correct"}], "feedback": "*Se puede nadar* = you can swim."}
  es.a2.unit96.lesson04.exercise06.traduce_pescado: {"instruction": "Translate into Spanish using *alguna vez*.", "accepted_answers": [{"value": "¿Has probado el pescado alguna vez?", "status": "correct"}, {"value": "Has probado el pescado alguna vez", "status": "correct"}, {"value": "¿Has probado alguna vez el pescado?", "status": "correct"}, {"value": "Has probado alguna vez el pescado", "status": "correct"}, {"value": "¿Has probado pescado alguna vez?", "status": "correct"}, {"value": "Has probado pescado alguna vez", "status": "correct"}, {"value": "¿Has probado alguna vez pescado?", "status": "correct"}, {"value": "Has probado alguna vez pescado", "status": "correct"}], "feedback": "*¿Has probado el pescado alguna vez?*"}
  es.a2.unit96.lesson04.exercise07.escribe_dos_frases: {"instruction": "Write exactly two sentences in the pretérito perfecto: the first with *dos veces*, the second with *nunca*.", "correct_option": "He esquiado dos veces. Nunca he montado a caballo.", "accepted_answers": [{"value": "He esquiado dos veces. Nunca he montado a caballo.", "status": "correct"}, {"value": "He esquiado dos veces. Nunca he montado a caballo", "status": "correct"}, {"value": "He esquiado dos veces. No he montado nunca a caballo.", "status": "correct"}, {"value": "He esquiado dos veces. No he montado nunca a caballo", "status": "correct"}, {"value": "He esquiado dos veces. No he montado a caballo nunca.", "status": "correct"}, {"value": "He esquiado dos veces. No he montado a caballo nunca", "status": "correct"}], "feedback": "*He esquiado dos veces. Nunca he montado a caballo.*"}
  es.a2.unit96.lesson05.exercise01.lee_tren: {"instruction": "Read Elena's message and choose the answer.", "correct_option": "Many times.", "distractors": ["Once.", "Twice.", "Never."], "accepted_answers": [{"value": "Many times.", "status": "correct"}], "feedback": "*He viajado en tren muchas veces.*"}
