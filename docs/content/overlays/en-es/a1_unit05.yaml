    instruction: "Which question asks for the current time?"
    correct_option: "¿Qué hora es?"
    distractors: ["¿Qué fecha es hoy?", "¿A qué hora empieza?"]
    accepted_answers: ["¿Qué hora es?", "Qué hora es"]

