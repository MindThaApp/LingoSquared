answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is
    correct. Do not treat n as a substitute for ñ.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Telling and asking for clock time, parts of the day, and scheduling
    a meeting, continuing Elena and Mateo's cooking-workshop narrative
    from units 01-04. English-specific guidance highlights the es/son
    singular-plural time irregularity and the fraction words cuarto/
    media/menos.

units:
  es.a1.unit05.time:
    title: "The workshop's schedule"

lessons:
  es.a1.unit05.lesson01.decir_la_hora_en_punto:
    title: "Telling time on the hour"
  es.a1.unit05.lesson02.cuarto_y_media:
    title: "Quarter and half hours"
  es.a1.unit05.lesson03.partes_del_dia:
    title: "Parts of the day and the workshop's start time"
  es.a1.unit05.lesson04.proponer_una_hora_para_verse:
    title: "Proposing a time to meet"
  es.a1.unit05.lesson05.leer_el_horario_del_dia:
    title: "Reading the day's schedule"
  es.a1.unit05.lesson06.planear_el_almuerzo_dialogue:
    title: "Elena and Mateo plan lunch"

teaching:
  es.a1.unit05.lesson01.teach.que_hora_es: {title: "Ask the time", gloss: "What time is it?", note: "*Qué hora* (what hour) asks for clock time, distinct from unit04's *qué fecha* (what calendar date)."}
  es.a1.unit05.lesson01.teach.es_la_una: {title: "It's one o'clock", gloss: "It's one o'clock.", note: "See the following grammar note on why *es* (not *son*) is used only for one o'clock."}
  es.a1.unit05.lesson01.teach.es_vs_son_note: {title: "Es vs. son for time", gloss: "Why one o'clock is different from every other hour.", note: "See the card's own text."}
  es.a1.unit05.lesson01.teach.son_las_horas: {title: "Two, four, five, seven o'clock", gloss: "It's two o'clock, it's four o'clock, it's five o'clock, it's seven o'clock.", note: "*Son las...* (plural) is used for every hour except one, matching the previous grammar note.", example_gloss: ["It's two o'clock.", "It's four o'clock.", "It's five o'clock.", "It's seven o'clock."]}

  es.a1.unit05.lesson02.teach.y_cuarto: {title: "Quarter past", gloss: "It's four fifteen (a quarter past four).", note: "*Y cuarto* (and a quarter) adds fifteen minutes to the stated hour."}
  es.a1.unit05.lesson02.teach.y_media: {title: "Half past", gloss: "It's seven thirty (half past seven).", note: "*Y media* (and a half) adds thirty minutes to the stated hour."}
  es.a1.unit05.lesson02.teach.menos_cuarto: {title: "Quarter to", gloss: "It's a quarter to five (four forty-five).", note: "See the following grammar note on how *menos* counts down to the next hour."}
  es.a1.unit05.lesson02.teach.menos_note: {title: "Menos (to/before the hour)", gloss: "How Spanish counts minutes before the next hour.", note: "See the card's own text."}

  es.a1.unit05.lesson03.teach.partes_del_dia: {title: "Morning, afternoon, night", gloss: "in the morning, in the afternoon, in the evening/at night", note: "*De la mañana/tarde/noche* clarifies AM vs. PM the way English adds \"in the morning\" or \"at night\" after a clock time.", example_gloss: ["It's eight in the morning.", "The workshop starts at four in the afternoon.", "It's ten at night."]}
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde: {title: "The workshop starts at four", gloss: "The workshop starts at four in the afternoon.", note: "*Empieza* (starts) is the third-person form of *empezar*, a new verb for this unit."}
  es.a1.unit05.lesson03.teach.a_que_hora_empieza: {title: "Ask what time something starts", gloss: "What time does the workshop start?", note: "*A qué hora* (at what time) is the standard way to ask when a specific event happens, distinct from the general *qué hora es* (what time is it now)."}

  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora: {title: "Ask when to meet", gloss: "What time shall we meet?", note: "*Nos vemos* (we see each other / we'll meet) is a reflexive-style construction used for arranging to meet someone."}
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media: {title: "Propose a meeting time", gloss: "Shall we meet at three thirty?", note: "Combines lesson02's *y media* with lesson04's *nos vemos* to propose a specific time."}
  es.a1.unit05.lesson04.teach.antes_del_taller: {title: "Before the workshop", gloss: "That's before the workshop.", note: "*Antes de* (before) is the opposite of unit04's *después* (after)."}
  es.a1.unit05.lesson04.teach.de_acuerdo: {title: "Agreed / Okay", gloss: "Agreed / Okay", note: "*De acuerdo* is a natural, brief way to confirm a plan, similar in function to unit01's *Muy bien*.", example_gloss: "Agreed, we'll meet at three thirty."}

  es.a1.unit05.lesson05.teach.horario_dia_reading: {title: "Reading the day's schedule", gloss: "The workshop starts at four in the afternoon. Before that, Elena and Mateo meet at three thirty. After the workshop, at six, they eat together. The next day, they meet at one to have lunch.", note: "This short schedule text reuses this lesson's own established times (3:30, 4:00, 6:00) plus a new one-o'clock lunch the following day, the same connected-reading style as unit04 lesson05."}
  es.a1.unit05.lesson05.teach.al_dia_siguiente: {title: "The next day", gloss: "the next day / the following day", note: "*Al día siguiente* (to the following day) is a common way to move a story forward to a new day, distinct from unit04's *la próxima clase* (the next class, a specific event rather than a calendar day)."}

  es.a1.unit05.lesson06.teach.line01: {title: "Ask about eating after the workshop", gloss: "Mateo says the workshop ends at six and asks if Elena is hungry afterward.", note: "*Tienes hambre* (are you hungry) is a new idiom -- literally \"you have hunger,\" the same have-construction pattern as *tener años* (unit02) and *tener hermanos* (unit03)."}
  es.a1.unit05.lesson06.teach.line02: {title: "Agree and suggest the next day", gloss: "Elena says yes, a little, and suggests eating the next day instead.", note: "*¿Comemos mañana?* proposes tomorrow rather than right after the workshop, setting up the following exchange about a specific time."}
  es.a1.unit05.lesson06.teach.line03: {title: "Agree and ask the time", gloss: "Mateo agrees it's a good idea and asks what time.", note: "*Buena idea* (good idea) is a natural, brief way to agree with a suggestion."}
  es.a1.unit05.lesson06.teach.line04: {title: "Propose one o'clock", gloss: "Elena proposes meeting at one o'clock.", note: "Reuses lesson01's *Es la una* pattern within the *nos vemos a la una* construction."}
  es.a1.unit05.lesson06.teach.line05: {title: "Confirm and mention a restaurant", gloss: "Mateo confirms one o'clock works and mentions a nearby restaurant.", note: "*Hay un restaurante cerca de aquí* reuses *cerca de* from unit03's proximity phrase (*cerca de tus padres*), now applied to a place rather than a person -- setting up unit06's food unit."}
  es.a1.unit05.lesson06.teach.line06: {title: "Close warmly", gloss: "Elena reacts happily and says see you tomorrow.", note: "*¡Genial!* (great!) closes the exchange on an enthusiastic note, similar in function to unit03's *¡Qué bien!*."}

exercises:
