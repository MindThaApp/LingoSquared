answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is
    correct. Do not treat n as a substitute for ñ.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Making basic comparisons, continuing Elena and Mateo's storyline as
    they compare Mateo's old and new apartment, and close
    on an equal-footing comparison of their cooking.

units:
  es.a1.unit15.comparisons:
    title: "The new apartment is bigger"

lessons:
  es.a1.unit15.lesson01.mas_menos_tan_vocabulario:
    title: "More, less, as...as"
  es.a1.unit15.lesson02.comparar_los_apartamentos:
    title: "The new one is bigger than the old one"
  es.a1.unit15.lesson03.cual_es_mas_grande:
    title: "Which apartment is bigger?"
  es.a1.unit15.lesson04.tan_bien_como:
    title: "Mateo cooks as well as Elena"
  es.a1.unit15.lesson05.leer_la_comparacion:
    title: "Comparing the two apartments"
  es.a1.unit15.lesson06.comparar_apartamentos_dialogue:
    title: "Elena and Mateo compare the apartments"

teaching:
  es.a1.unit15.lesson01.teach.mas_que: {title: "More...than", gloss: "more...than", note: "*Más...que* compares two different amounts or things -- see the grammar note below.", example_gloss: "The new apartment is bigger than the old one."}
  es.a1.unit15.lesson01.teach.menos_que: {title: "Less...than", gloss: "less...than", note: "*Menos...que*, the opposite of *más...que*.", example_gloss: "The old apartment is less big than the new one."}
  es.a1.unit15.lesson01.teach.tan_como: {title: "As...as", gloss: "as...as", note: "*Tan...como* compares two EQUAL things -- a genuinely different construction from *más/menos*, not just another way to say the same thing.", example_gloss: "Mateo cooks as well as Elena."}
  es.a1.unit15.lesson01.teach.mas_menos_tan_note: {title: "Inequality vs. equality", gloss: "The difference between más/menos...que and tan...como.", note: "See the card's own text."}

  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande: {title: "Compare the new apartment", gloss: "The new apartment is bigger than the old one.", note: "*Más grande que* (bigger than) puts *grande* (big) inside the *más...que* pattern."}
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno: {title: "Compare the old apartment", gloss: "The old apartment is smaller than the new one.", note: "*Más pequeño que* (smaller than) uses *pequeño* (small), stating the comparison from the opposite direction."}

  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande: {title: "Ask which is bigger", gloss: "Which apartment is bigger?", note: "*¿Cuál...?* (which...?) + comparative adjective is the standard way to ask for a comparison."}
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply: {title: "Answer which is bigger", gloss: "The new one is bigger than the old one.", note: "The same comparison, now as a direct answer to the *¿cuál...?* question; *el nuevo* (the new one) drops the repeated noun."}

  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena: {title: "Compare cooking skill equally", gloss: "Mateo cooks as well as Elena.", note: "*Tan bien como* (as well as) uses *tan* + adverb + *como*, the equality pattern applied to a verb's manner rather than a noun's size."}
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo: {title: "Say you're a good team", gloss: "We're a good team.", note: "*Somos* (we are) + *un buen equipo* (a good team) is a natural closing statement after an equality comparison."}

  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: "Comparing the two apartments"
    gloss: "Mateo's old apartment has a small kitchen. The new apartment is bigger, and the kitchen is bigger too. The old one is smaller than the new one, and that's why Mateo wants to move. The new one has more space to cook."
    note: "A realistic summary comparing both apartments."
    glosses:
      viejo: "old"
      tiene: "has (from tener)"
      pequeña: "small"
      nuevo: "new"
      grande: "big"
      también: "also / too"
      pequeño: "small"
      eso: "that"
      quiere: "wants (from querer)"
      mudarse: "to move house"
      espacio: "space"
      cocinar: "to cook"
  es.a1.unit15.lesson05.teach.por_eso_note: {title: "Por eso (that's why)", gloss: "How por eso links a reason to a result.", note: "See the card's own text."}

  es.a1.unit15.lesson06.teach.line01: {title: "Ask if he's seen it", gloss: "Elena asks if Mateo has already seen the new apartment.", note: "*¿Ya viste...?* (have you already seen...?) is a new past-tense question form."}
  es.a1.unit15.lesson06.teach.line02: {title: "Confirm it's bigger", gloss: "Mateo confirms it's bigger than the old one, kitchen included.", note: "A *más...que* comparison, extended with *la cocina también* (the kitchen too)."}
  es.a1.unit15.lesson06.teach.line03: {title: "Ask which is smaller", gloss: "Elena asks which apartment is smaller, then.", note: "*Entonces* (then/so) is a logical connector you've seen before; the question is the *¿Cuál...?* pattern with *pequeño* instead of *grande*."}
  es.a1.unit15.lesson06.teach.line04: {title: "Answer and explain", gloss: "Mateo says the old one is smaller, and that's why he wants to move.", note: "*El viejo es más pequeño que el nuevo* plus *por eso quiero mudarme* (that's why I want to move)."}
  es.a1.unit15.lesson06.teach.line05: {title: "Agree it makes sense", gloss: "Elena says it makes sense -- the new one has more cooking space.", note: "*Tiene mucho sentido* (that makes a lot of sense) is a new agreement phrase; *más espacio para cocinar* means more space to cook."}
  es.a1.unit15.lesson06.teach.line06: {title: "Extend the reasoning", gloss: "Mateo agrees and adds that since Elena cooks just as well as him, they need space for two.", note: "*Tan bien como* (as well as), now applied conversationally with *tú cocinas* (you cook)."}
  es.a1.unit15.lesson06.teach.line07: {title: "Return the compliment", gloss: "Elena agrees enthusiastically and says he cooks just as well as she does.", note: "*¡Es verdad!* (that's true!) + *tú cocinas tan bien como yo* (you cook as well as I do) -- the same *tan bien como* comparison, turned back to Mateo."}
  es.a1.unit15.lesson06.teach.line08: {title: "Close with team spirit", gloss: "Mateo concludes they're a good team.", note: "*Somos un buen equipo* (we're a good team) closes the dialogue."}

