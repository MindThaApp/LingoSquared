answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spanish A1
  description: Beginner Spanish for proposing, accepting, declining, scheduling, reading, and writing simple plans.
units:
  es.a1.unit50.plans:
    title: Making simple plans
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Proposing an activity
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Accepting or declining a plan
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Agreeing on a day and time
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Reading an invitation
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Writing and confirming a plan
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena and Mateo make a plan
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Together
    gloss: together
    note: '*Juntos* makes clear that people do the activity together; it agrees with the people (*juntas* if all are women).'
    example_gloss: Shall we have coffee together?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Have coffee
    gloss: to have coffee
    note: Spanish says *tomar un café* ("to take a coffee"), not "to drink coffee".
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Go to a film
    gloss: to go to a film
    note: '*Ir al cine* ("go to the cinema") is the usual way to say you go to see a film; *al* is *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Shall we have coffee?
    gloss: Shall we have coffee?
    note: '*¿Tomamos ...?* uses the *nosotros* present tense to propose something together.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: Using ¿Tomamos ...?
    gloss: ¿Tomamos + something? is the usual way to propose doing something together.
    note: 'The *nosotros* form (*tomamos*) works like English "shall we": *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Do you feel like going to a film?
    gloss: Do you feel like going to a film?
    note: '*¿Tienes ganas de ...?* asks informally whether someone feels like doing something; an infinitive follows *de*.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Yes, sounds good!
    gloss: Yes, sounds good!
    note: '*¡Sí, qué bien!* is a short, enthusiastic acceptance.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Good idea
    gloss: Good idea!
    note: '*¡Buena idea!* accepts the proposal by praising it.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: That is a good plan
    gloss: That is a good plan.
    note: This is a slightly fuller positive response.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Decline with a reason
    gloss: Sorry, I can't, because I'm working.
    note: '*Lo siento* softens the decline, and *porque* introduces the short reason.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: I don't have time
    gloss: I don't have time.
    note: '*No tengo tiempo* is a direct but ordinary reason for declining; *no* goes before the verb.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: A friendly decline
    gloss: Lo siento + no puedo + a short reason makes a decline friendly.
    note: A reason is optional in conversation, but it makes the model useful and polite.
  es.a1.unit50.lesson03.teach.quedar:
    title: Arrange to meet
    gloss: to arrange to meet
    note: '*Quedar* means to arrange to meet: *¿Quedamos el viernes?* Many Latin American speakers say *¿Nos vemos el viernes?* instead.'
    example_gloss: Shall we meet up on Friday at 2:30?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Meet Friday at half past two
    gloss: Shall we meet Friday at 2:30?
    note: This combines the weekday *el viernes* with *a las* plus the time.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media means half past
    gloss: las dos y media = 2:30; a las dos y media gives the time of the meeting.
    note: 'Spanish counts from the hour just passed: *las dos y media* is 2:30, literally "two and a half".'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: A date and time
    gloss: on Friday 17 April at 3:15
    note: 'Weekdays and months stay lowercase in Spanish, and dates use *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Confirm the time
    gloss: Yes, Friday at 2:30 is good.
    note: '*Me viene bien* ("it suits me") confirms that the proposed time works.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Message, invitation, language café
    gloss: the message, the invitation, the language café
    note: '*Un mensaje* is a short written or digital message, *una invitación* asks someone to join an activity, and *el café de idiomas* is the group''s meeting place.'
    example_gloss:
    - I have a message from Elena.
    - This is an invitation to the language café.
    - We're having coffee at the language café.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Elena's invitation
    gloss: Hi Mateo, do you feel like having coffee at the language café on Saturday 18 April at 2:30? Regards, Elena.
    note: 'Read for four details: activity, date, time, and place.'
    glosses:
      Hola: hi
      ganas: desire (tener ganas de = to feel like)
      sábado: Saturday
      abril: April
      media: half past (y media = half past)
      dos: two
      café: coffee
      tomar: drink / have
      idiomas: language café
      saludo: regards
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: A proposal message
    gloss: Hi Mateo, shall we have coffee Friday at 2:30? Regards, Elena.
    note: The message includes a greeting, activity, day, time, and closing.
    glosses:
      Hola: hi
      vamos: shall
      viernes: Friday
      media: half past (y media = half past)
      dos: two
      café: coffee
      tomar: drink / have
      saludo: regards
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: A confirmation message
    gloss: Hi Elena, yes, sounds good! Friday at 2:30 is good. See you Friday! Mateo.
    note: The reply both accepts the activity and repeats the schedule to confirm it.
    glosses:
      Hola: hi
      bien: nice / sounds good
      viernes: Friday
      media: half past (y media = half past)
      dos: two
      viene: good / works
      Hasta: until / see you
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: What a message includes
    gloss: A short message gives the activity, the day or date, and the time.
    note: A greeting and closing are useful, but the important details are the activity and when it happens.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena proposes coffee
    gloss: 'Elena: Shall we have coffee on Friday? Mateo: Yes, sounds good! What time?'
    note: Mateo accepts the activity before asking for the time.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Elena's first time
    gloss: 'Elena: At 2:30.'
    note: '*Las dos y media* means 2:30, as in the lesson on telling time.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo proposes another time
    gloss: 'Mateo: Sorry, I can''t at 2:30. Can we do 3:15?'
    note: '*¿Puede ser a ...?* is a concise way to ask whether another time works.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: They confirm the final plan
    gloss: 'Elena: Yes, 3:15 is good. Mateo: Good plan. Then we''ll meet Friday at 3:15.'
    note: Here *quedamos* is the *nosotros* form again, now confirming the plan.
