teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: To call
    gloss: to call
    note: The infinitive of the verb for making a phone call.
    example_gloss: I have to call you.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Saying you'll call
    gloss: I'll call you.
    note: '*Llamo* is the *yo* form of *llamar*; with *te* it means "I call you". Spanish uses the present tense here where English says "I''ll call".'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Answering the phone
    gloss: Hello, this is Elena.
    note: Spanish identifies the speaker on the phone with *soy* + name (literally "I am"), where English says "this is".
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo answers the same way
    gloss: Hello, this is Mateo.
    note: Same *soy* + name pattern as *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Asking who's calling
    gloss: Who am I speaking with?
    note: '*¿Con quién hablo?* is the standard phrase when you do not know who is calling.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Identifying yourself formally
    gloss: You're speaking with Elena.
    note: '*Habla con* + name uses the formal *usted* form of *hablar*: the polite counterpart of *soy* + name.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Asking for repetition
    gloss: Can you repeat that?
    note: '*¿Puedes...?* (Can you ...?) plus *repetir* (to repeat) plus *eso* (that).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Asking someone to slow down
    gloss: Don't speak so fast, please.
    note: '*No hables* is the negative informal command of *hablar*; *tan rápido* (so fast) gives the degree.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Saying you can't hear well
    gloss: I can't hear you well.
    note: '*Oír* (to hear) with *no ... bien* (not well) states a hearing problem, distinct from *entender* (to understand); *te oigo* means "I hear you".'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Text message
    gloss: the text message
    note: 'A masculine noun: *el mensaje*. Spanish speakers also say *el SMS* or *el texto*, but *mensaje* is the neutral choice.'
    example_gloss: The text message is from Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Saying you'll send a text
    gloss: I'll send you a text.
    note: '*Enviar* (to send) comes after the pronoun *te* (to you): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Saying you'll call back
    gloss: I'll call you back later.
    note: '*Más tarde* (later) closes the sentence: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Read a text exchange
    gloss: 'Mateo: Hi Elena, can you call me? I need to tell you something. Elena: Yes of course, I''ll call you back in five minutes.'
    note: Track what Mateo asks for, why, and when Elena says she'll call back.
    glosses:
      Hola: hi
      puedes: can
      llamarme: call
      Tengo: need to / must
      algo: something
      contarte: tell
      claro: of course
      llamada: call
      cinco: five
      minutos: minutes
      devuelvo: back
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo answers the call
    gloss: 'Mateo: Hello, this is Mateo.'
    note: 'The same *soy* + name pattern from the first lesson, now used in the actual phone call: the person who picks up speaks first and gives their name.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena identifies herself
    gloss: 'Elena: Hi Mateo, this is Elena. Mateo: Nice that you''re calling!'
    note: '*Gracias por llamar* (thanks for calling) is *gracias por* + infinitive.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena asks about the shift
    gloss: 'Elena: How was your first shift?'
    note: '*Ha ido* is the present perfect of *ir* (here "to turn out"): *ha* + the participle *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo reports good news
    gloss: 'Mateo: It went really well, better than I thought.'
    note: '*Ha ido muy bien* reuses the present perfect from the question; *mejor de lo esperado* (better than expected) compares with *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado are shown with their infinitives
    gloss: ha ido → ir (to go), es → ser (to be), esperado → esperar (to expect)
    note: '*Ha ido*, *es*, and *esperado* are shown with their infinitives: *ir*, *ser*, *esperar*. For now, treat *ha ido muy bien* as a fixed phrase; the present perfect is practised properly later.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena is proud
    gloss: 'Elena: How nice to hear! I''m proud of you.'
    note: '*Orgulloso/a de* (proud of) is a fixed combination with *de*; the adjective agrees with the speaker (*orgullosa* for Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo is touched
    gloss: 'Mateo: Thank you, that means a lot to me.'
    note: '*Significa* is the third-person form of *significar* (to mean); *para mí* (for me) says who it matters to.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: His
    gloss: His first shift went really well.
    note: '*Su* here is the possessive "his" (also "her" or "your" with *usted*); context tells you whose it is.'
