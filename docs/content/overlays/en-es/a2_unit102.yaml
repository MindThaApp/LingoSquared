  es.a2.unit102.lesson02.exercise07.escribe_recomiendo: {"instruction": "Write the sentence in Spanish: I recommend that you rest. Use the verb *recomendar* in the *te recomiendo* pattern.", "correct_option": "Te recomiendo descansar.", "accepted_answers": [{"value": "Te recomiendo descansar.", "status": "correct"}, {"value": "Te recomiendo descansar", "status": "correct"}], "feedback": "*Te recomiendo descansar* = I recommend that you rest."}
  es.a2.unit102.lesson03.exercise01.elige_medico: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Por qué no vas al médico?", "distractors": ["¿Por qué vas al médico?", "¿Por qué no ir al médico?", "¿Por qué no tienes que ir al médico?"], "accepted_answers": [{"value": "¿Por qué no vas al médico?", "status": "correct"}], "feedback": "Use *no* and the present *tú* form: *vas*."}
  es.a2.unit102.lesson03.exercise02.elige_agua: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Por qué no bebes agua?", "distractors": ["¿Por qué no bebo agua?", "¿Por qué no beber agua?", "¿Por qué bebes agua?"], "accepted_answers": [{"value": "¿Por qué no bebes agua?", "status": "correct"}], "feedback": "After *por qué no* use *bebes*, the *tú* form."}
