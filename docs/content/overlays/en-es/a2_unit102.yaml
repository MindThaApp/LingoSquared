  es.a2.unit102.lesson05.exercise01.lee_problema: {"instruction": "Read the message and choose the answer.", "correct_option": "She is very tired and does not sleep well.", "distractors": ["She has no money.", "She has a headache.", "She wants to travel."], "accepted_answers": [{"value": "She is very tired and does not sleep well.", "status": "correct"}], "feedback": "*Estoy muy cansada y no duermo bien.*"}
