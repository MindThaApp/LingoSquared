  es.a2.unit102.lesson05.exercise03.une_mensaje: {"instruction": "Match each line from the messages to its meaning.", "accepted_answers": [{"value": [{"left": "Hola, Mateo.", "right": "Hi, Mateo."}, {"left": "Estoy muy cansada y no duermo bien.", "right": "I am very tired and I do not sleep well."}, {"left": "¿Qué debería hacer?", "right": "What should I do?"}, {"left": "Hola, Elena.", "right": "Hi, Elena."}, {"left": "Deberías dormir ocho horas.", "right": "You should sleep eight hours."}, {"left": "Es mejor beber agua.", "right": "It is better to drink water."}, {"left": "¿Por qué no vas al médico?", "right": "Why don't you go to the doctor?"}], "status": "correct"}], "feedback": "These lines come from the two messages."}
