answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with grammar-led blocks on everyday functions."
  learning_goal: "Use Spanish for everyday functions such as giving advice, with the right structure for each situation."
units:
  es.a2.unit102.un_consejo: {"title": "A Piece of Advice", "description": "Give and respond to simple advice about health, study or money with deberías, es mejor, tienes que, te recomiendo and ¿por qué no...?."}
lessons:
  es.a2.unit102.lesson01.deberias_descansar: {"title": "You Should Rest"}
  es.a2.unit102.lesson02.es_mejor_tienes_que: {"title": "It Is Better, You Have To"}
  es.a2.unit102.lesson03.por_que_no: {"title": "Why Don't You Go to the Doctor?"}
  es.a2.unit102.lesson04.tienes_razon: {"title": "You Are Right"}
  es.a2.unit102.lesson05.el_mensaje_de_elena: {"title": "Elena's Message"}
  es.a2.unit102.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit102.lesson01.teach.gn_formas: {"title": "Should: debería, deberías, deberíamos", "gloss": "I should, you should, we should", "note": "*Debería*, *deberías* and *deberíamos* are set forms for giving advice. Use them with an infinitive: *deberías descansar* = you should rest. You do not need the whole verb yet."}
  es.a2.unit102.lesson01.teach.problemas: {"title": "Problems", "gloss": "I have a headache / I am tired (a man says it) / I am tired (a woman says it) / I have no money / I have an exam / I do not sleep well", "note": "Use *cansado* for a man and *cansada* for a woman. *Me duele la cabeza* literally says that the head hurts me.", "example_gloss": ["Today I have a headache.", "Elena is tired after the trip.", "Mateo has no money this month.", "I have an exam tomorrow."]}
  es.a2.unit102.lesson01.teach.gn_problema_consejo: {"title": "Problem, then advice", "gloss": "You are tired. You should rest. You do not sleep well. You should sleep more.", "note": "First name the problem, then give the advice with *deberías* + infinitive. The verb after *deberías* never changes: *descansar*, *dormir*."}
  es.a2.unit102.lesson01.teach.gn_negativo: {"title": "What not to do", "gloss": "You should not work so much. You should not drink coffee at night.", "note": "Put *no* before *deberías* to say what not to do. The infinitive stays the same."}
  es.a2.unit102.lesson01.teach.frases: {"title": "Three pieces of advice", "gloss": "You should rest. You should drink water. You should sleep more."}
  es.a2.unit102.lesson02.teach.gn_es_mejor: {"title": "Es mejor + infinitive", "gloss": "It is better to rest. It is better to drink water.", "note": "*Es mejor* + infinitive is soft, friendly advice. It does not say who should do it."}
  es.a2.unit102.lesson02.teach.gn_tienes_que: {"title": "Tienes que + infinitive", "gloss": "You have to go to the doctor. You have to study.", "note": "*Tienes que* + infinitive is stronger: it says you really need to do something. Use it when the matter is important."}
  es.a2.unit102.lesson02.teach.gn_te_recomiendo: {"title": "Te recomiendo + infinitive", "gloss": "I recommend that you rest. I recommend that you sleep eight hours.", "note": "*Te recomiendo* + infinitive is polite and personal: you give your opinion to a friend. The verb after it stays in the infinitive."}
  es.a2.unit102.lesson02.teach.gn_fuerza: {"title": "From soft to strong", "gloss": "It is better to rest. I recommend that you rest. You have to rest.", "note": "From softest to strongest: *es mejor*, *te recomiendo*, *tienes que*. *Deberías* is close to *te recomiendo*."}
  es.a2.unit102.lesson02.teach.palabras: {"title": "Advice words", "gloss": "it is better to / you have to / I recommend (to you) / the doctor", "note": "Each of these is followed by an infinitive, except *el médico*, which is a noun.", "example_gloss": ["It is better to rest a little.", "You have to go to the doctor today.", "I recommend that you sleep early.", "It is better to leave early."]}
  es.a2.unit102.lesson02.teach.frases: {"title": "Three pieces of advice", "gloss": "It is better to rest. I recommend that you drink water. You have to go to the doctor."}
  es.a2.unit102.lesson03.teach.gn_por_que_no: {"title": "¿Por qué no...?", "gloss": "Why don't you go to the doctor? Why don't you rest?", "note": "*¿Por qué no...?* is a friendly way to suggest something. It sounds softer than an order."}
  es.a2.unit102.lesson03.teach.gn_presente: {"title": "Present tense after por qué no", "gloss": "to go, you go. to drink, you drink. to sleep, you sleep. to study, you study. to save, you save. to rest, you rest.", "note": "After *¿Por qué no...?* use the present *tú* form of the verb, not the infinitive: *¿Por qué no vas?*"}
  es.a2.unit102.lesson03.teach.gn_amable: {"title": "A friendly suggestion", "gloss": "Why don't you study a little more? Why don't you save money?", "note": "The question form invites your friend to think about it. The advice with *deberías* is more direct."}
  es.a2.unit102.lesson03.teach.gn_temas: {"title": "Health, study, money", "gloss": "Health: drink water, sleep eight hours, go to the doctor. Study: study more. Money: save money.", "note": "These are common topics for advice. Each phrase is an infinitive, so it fits after *deberías*, *es mejor* and *te recomiendo*."}
  es.a2.unit102.lesson03.teach.palabras: {"title": "Advice actions", "gloss": "to rest / to drink water / to study more / to save money / to go to the doctor / to sleep eight hours", "note": "These infinitives are the actions you advise.", "example_gloss": ["Elena sleeps eight hours every night.", "Mateo wants to save money this month.", "Today I drink a lot of water.", "I have an exam and I study more."]}
  es.a2.unit102.lesson03.teach.frases: {"title": "Three suggestions", "gloss": "Why don't you go to the doctor? Why don't you drink water? Why don't you save money?"}
  es.a2.unit102.lesson04.teach.gn_acuerdo: {"title": "Agreeing with advice", "gloss": "You should sleep more. You are right. Why don't you go to the doctor? Good idea.", "note": "Use *tienes razón* when someone says something true. Use *buena idea* when someone suggests something."}
  es.a2.unit102.lesson04.teach.gn_lo_hare: {"title": "I will do it, I will try", "gloss": "I will do it. I will try.", "note": "Learn *lo haré* and *lo intentaré* as ready-made phrases. The future tense has its own unit, so you do not need to build it yet."}
  es.a2.unit102.lesson04.teach.gn_dificil: {"title": "When advice is hard", "gloss": "It is hard, but thank you. It is hard, but I will try.", "note": "If the advice is hard to follow, say so politely with *es difícil, pero...*."}
  es.a2.unit102.lesson04.teach.gn_gracias: {"title": "Thank and promise", "gloss": "You have to go to the doctor. Thank you, I will do it.", "note": "You can thank the person and promise to follow the advice in one short answer."}
  es.a2.unit102.lesson04.teach.palabras: {"title": "Answers to advice", "gloss": "you are right / good idea / I will do it / I will try / it is hard / thank you", "note": "These short answers are useful whenever a friend gives you advice.", "example_gloss": ["You are right, I should sleep more.", "Good idea. Tomorrow I am going to the doctor.", "I will try, but it is hard.", "Thank you, Elena, I will do it."]}
  es.a2.unit102.lesson04.teach.frases: {"title": "Three answers", "gloss": "You are right. I will try. It is hard, but thank you."}
  es.a2.unit102.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "the advice / the night / coffee / late", "note": "*Un consejo* is a piece of advice. *Por la noche* means at night.", "example_gloss": ["Elena drinks coffee at night.", "Thanks for your advice.", "Mateo works in the office until late.", "Elena has to study at night."]}
  es.a2.unit102.lesson05.teach.gn_repaso: {"title": "Three kinds of advice", "gloss": "You should sleep eight hours. It is better to drink water. Why don't you go to the doctor?", "note": "In the reply, Mateo uses three different ways to advise: *deberías*, *es mejor* and *¿por qué no...?*."}
  es.a2.unit102.lesson05.teach.lectura: {"title": "Elena writes", "gloss": "Hi, Mateo. I am very tired and I do not sleep well. What should I do?", "note": "This is Elena's message to Mateo.", "glosses": {"cansada": "tired", "duermo": "I sleep", "debería": "I should", "hacer": "to do"}}
  es.a2.unit102.lesson05.teach.respuesta: {"title": "Mateo replies", "gloss": "Hi, Elena. You should sleep eight hours. It is better to drink water. Why don't you go to the doctor?", "note": "This is Mateo's reply, with three pieces of advice.", "glosses": {"mejor": "better", "horas": "hours", "agua": "water"}}
  es.a2.unit102.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. You are very tired. What's wrong?"}
  es.a2.unit102.lesson06.teach.d2: {"title": "Mateo explains", "gloss": "Mateo: I am tired and I have no money after the holidays."}
  es.a2.unit102.lesson06.teach.d3: {"title": "Elena advises about rest", "gloss": "Elena: Well, you should sleep eight hours. It is better to rest a little."}
  es.a2.unit102.lesson06.teach.d4: {"title": "Mateo agrees", "gloss": "Mateo: You are right. But I also have to save money."}
  es.a2.unit102.lesson06.teach.d5: {"title": "Elena advises about money", "gloss": "Elena: I recommend that you save money this month. Why don't you eat at home?"}
  es.a2.unit102.lesson06.teach.d6: {"title": "Mateo accepts", "gloss": "Mateo: Good idea. It is hard, but I will try. Thank you, Elena!"}
