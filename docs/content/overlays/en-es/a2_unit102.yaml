  es.a2.unit102.lesson01.exercise06.traduce_descansar: {"instruction": "Translate into Spanish. Use *deberías* + infinitive.", "accepted_answers": [{"value": "Deberías descansar.", "status": "correct"}, {"value": "Deberías descansar", "status": "correct"}, {"value": "Tú deberías descansar.", "status": "correct"}, {"value": "Tú deberías descansar", "status": "correct"}], "feedback": "*Deberías descansar* = you should rest."}
  es.a2.unit102.lesson01.exercise07.escribe_beber: {"instruction": "Write the requested sentence with *debería* + *beber*.", "correct_option": "Debería beber agua.", "accepted_answers": [{"value": "Debería beber agua.", "status": "correct"}, {"value": "Debería beber agua", "status": "correct"}, {"value": "Yo debería beber agua.", "status": "correct"}, {"value": "Yo debería beber agua", "status": "correct"}], "feedback": "*Debería beber agua* = I should drink water."}
  es.a2.unit102.lesson02.exercise01.elige_tienes_que: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Tienes que ir al médico.", "distractors": ["Tienes ir al médico.", "Tengo que ir al médico.", "Tienes que estudiar."], "accepted_answers": [{"value": "Tienes que ir al médico.", "status": "correct"}], "feedback": "*Tienes que* + infinitive says you have to."}
