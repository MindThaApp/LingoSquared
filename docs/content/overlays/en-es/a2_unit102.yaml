  es.a2.unit102.lesson03.exercise04.ordena_ahorras: {"instruction": "Put the words in order to say 'Why don't you save money?'", "correct_option": "Por qué no ahorras dinero", "accepted_answers": [{"value": "Por qué no ahorras dinero", "status": "correct"}], "feedback": "*Por qué no* first, then the *tú* form."}
  es.a2.unit102.lesson03.exercise05.completa_ahorras: {"instruction": "Complete with the *tú* form of *ahorrar*.", "correct_option": "ahorras", "accepted_answers": [{"value": "ahorras", "status": "correct"}], "feedback": "*¿Por qué no ahorras dinero?*"}
  es.a2.unit102.lesson03.exercise06.traduce_descansas: {"instruction": "Translate into Spanish. Use *¿Por qué no...?* and the present tense.", "accepted_answers": [{"value": "¿Por qué no descansas?", "status": "correct"}, {"value": "¿Por qué no descansas", "status": "correct"}, {"value": "Por qué no descansas?", "status": "correct"}, {"value": "Por qué no descansas", "status": "correct"}], "feedback": "*¿Por qué no descansas?*"}
  es.a2.unit102.lesson03.exercise07.escribe_ahorras: {"instruction": "Write the requested question with *¿Por qué no...?* and *ahorrar*.", "correct_option": "¿Por qué no ahorras dinero?", "accepted_answers": [{"value": "¿Por qué no ahorras dinero?", "status": "correct"}, {"value": "¿Por qué no ahorras dinero", "status": "correct"}, {"value": "Por qué no ahorras dinero?", "status": "correct"}, {"value": "Por qué no ahorras dinero", "status": "correct"}], "feedback": "*¿Por qué no ahorras dinero?*"}
  es.a2.unit102.lesson04.exercise01.elige_razon: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Tienes razón.", "distractors": ["Tengo razón.", "Es razón.", "Buena razón."], "accepted_answers": [{"value": "Tienes razón.", "status": "correct"}], "feedback": "*Tienes razón* = you are right."}
  es.a2.unit102.lesson04.exercise02.elige_intentare: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Lo intentaré.", "distractors": ["Lo haré.", "No lo intentaré.", "Es difícil."], "accepted_answers": [{"value": "Lo intentaré.", "status": "correct"}], "feedback": "*Lo intentaré* = I will try. *Lo haré* means I will do it."}
  es.a2.unit102.lesson04.exercise03.une_respuestas: {"instruction": "Match each Spanish answer to its meaning.", "accepted_answers": [{"value": [{"left": "Tienes razón.", "right": "You are right."}, {"left": "Buena idea.", "right": "Good idea."}, {"left": "Lo haré.", "right": "I will do it."}, {"left": "Lo intentaré.", "right": "I will try."}, {"left": "Es difícil.", "right": "It is hard."}, {"left": "Es difícil, pero gracias.", "right": "It is hard, but thank you."}, {"left": "Gracias.", "right": "Thank you."}], "status": "correct"}], "feedback": "These are answers to advice."}
  es.a2.unit102.lesson04.exercise04.ordena_dificil: {"instruction": "Put the words in order to say 'It is hard, but I will try.'", "correct_option": "Es difícil pero lo intentaré", "accepted_answers": [{"value": "Es difícil pero lo intentaré", "status": "correct"}], "feedback": "*Es difícil* first, then *pero lo intentaré*."}
  es.a2.unit102.lesson04.exercise05.completa_idea: {"instruction": "Complete the answer to the suggestion.", "correct_option": "idea", "accepted_answers": [{"value": "idea", "status": "correct"}], "feedback": "*Buena idea* = good idea."}
  es.a2.unit102.lesson04.exercise06.traduce_dificil: {"instruction": "Translate into Spanish. Use *es difícil, pero...*.", "accepted_answers": [{"value": "Es difícil, pero lo intentaré.", "status": "correct"}, {"value": "Es difícil, pero lo intentaré", "status": "correct"}, {"value": "Es difícil pero lo intentaré.", "status": "correct"}, {"value": "Es difícil pero lo intentaré", "status": "correct"}], "feedback": "*Es difícil, pero lo intentaré.*"}
