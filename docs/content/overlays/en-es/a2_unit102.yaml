  es.a2.unit102.lesson01.exercise02.elige_beber: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Deberíamos beber agua.", "distractors": ["Debería beber agua.", "Deberías beber agua.", "Deberíamos beber más."], "accepted_answers": [{"value": "Deberíamos beber agua.", "status": "correct"}], "feedback": "*Nosotros* goes with *deberíamos*."}
