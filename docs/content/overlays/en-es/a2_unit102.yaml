  es.a2.unit102.lesson02.exercise03.une_consejos: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "es mejor", "right": "it is better to"}, {"left": "tienes que", "right": "you have to"}, {"left": "te recomiendo", "right": "I recommend (to you)"}, {"left": "el médico", "right": "the doctor"}, {"left": "Es mejor descansar.", "right": "It is better to rest."}, {"left": "Tienes que ir al médico.", "right": "You have to go to the doctor."}, {"left": "Te recomiendo beber agua.", "right": "I recommend that you drink water."}], "status": "correct"}], "feedback": "Each expression is followed by an infinitive."}
