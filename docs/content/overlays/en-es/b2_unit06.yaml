review:
  status: reviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English
    glosses match the intended qualification force (por lo general =
    "generally", no necesariamente = "not necessarily", eso depende de =
    "that depends on"), that every matching_pairs right-hand gloss
    discriminates its left on real meaning, that the respond-to-opposing
    frames read as genuine concession-then-pushback / agree-disagree
    moves rather than stilted textbook Spanish, and that the culminating
    writing/speaking answers (lesson06) accept the punctuation forms a
    correct learner would actually produce. See the realization file's
    review block for the full priority list.
  notes: >-
    Overlay for es's sixth B2 unit (second wave), authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English learners tend to state a flat opinion ("I think
    X") and stop; the unit forces a QUALIFIED opinion (opinion frame + a
    qualifier such as por lo general / no necesariamente) and a DIRECT
    response to an opposing view, not a restatement of one's own; (2) "no
    necesariamente" is "not necessarily", not "not necessary" -- glossed
    as such; (3) "comprendo tu punto de vista, pero..." and "no comparto
    esa opinión, porque..." are concession-then-pushback / disagree-with-
    reason moves that English learners often flatten into a bare "but";
    (4) "eso depende de" takes "de" before its object (English "depends
    on" maps to "on" -> "de", a common preposition-choice error point);
    (5) "por una parte ... por otra parte" is a deliberately different
    lexical choice from unit01's already-taught "por un lado ... por otro
    lado" -- both mean "on one hand ... on the other hand", so recognize
    either if a learner produces the earlier form, but this unit's own
    accepted_answers key on "por una parte ... por otra parte" as taught
    here. No sibling-direction file (es-en b2) was consulted.

    Second-pass review 2026-10-19: 5 fixes -- teach.a_mi_parecer: note
    claimed the verb comes right after a fronted 'a mi parecer' (a Dutch
    V2 rule, false for Spanish; its own example has the subject next);
    rewritten; teach.grammar_opinion_frames + teach.claim_model: ranking
    put the 'tentative' yo diría que above 'measured' a mi parecer,
    contradicting the yo_diria_que card; reordered tentative < measured <
    firm; lesson01.exercise05: added 'Yo diría que es buena idea';
    lesson04.exercise07: added 'Hay también un riesgo para la privacidad'
    and 'También existe un riesgo para la privacidad';
    lesson06.exercise07.respond_qualified: instruction printed the Spanish
    answer clause (la seguridad de la comunidad importa más); now English
    only, and since it never asks for pero, added the two-sentence variant
    without pero.

    Language review 2026-10-20 (native-level es/en editor pass): 4 fixes
    -- lesson04.teach.claim_model title/gloss semicolon mirrored;
    lesson01.exercise03 feedback said the frames run 'from measured to
    firm' (contradicts the tentative < measured < firm card) -> names all
    three; lesson06.exercise05 feedback 'you concede the qualifier'
