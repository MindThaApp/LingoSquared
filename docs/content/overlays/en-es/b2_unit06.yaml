course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: discuss an abstract topic -- ideas and
    values -- by giving a QUALIFIED opinion (a mi parecer / yo diría que
    + por lo general, no necesariamente, eso depende de, en muchos casos)
    and responding directly to an opposing view (comprendo tu punto de
    vista, pero...; no comparto esa opinión, porque...; comparto esa
    opinión), around the everyday debate of whether surveillance cameras
    should be installed in public spaces.

units:
  es.b2.unit06.abstraccion:
    title: "Abstract ideas and values"
    description: Discuss an abstract topic -- weigh a value, give a qualified opinion rather than a flat one, weigh two sides, and respond directly to an opposing view.

lessons:
  es.b2.unit06.lesson01.que_opinas:
    title: "What do you think?"
  es.b2.unit06.lesson02.opinion_matizada:
    title: "A qualified opinion"
  es.b2.unit06.lesson03.responder_opinion_contraria:
    title: "Responding to an opposing view"
  es.b2.unit06.lesson04.los_dos_lados:
    title: "The two sides"
  es.b2.unit06.lesson05.que_opina_el_autor:
    title: "What does the author think?"
  es.b2.unit06.lesson06.en_conversacion:
    title: "In conversation: a qualified opinion"

teaching:
  es.b2.unit06.lesson01.teach.espacio_publico:
    title: "the public space"
    gloss: "the public space"
    note: "*El espacio público* = 'the public space'. This unit debates one abstract question about public spaces: should they have surveillance cameras?"
    example_gloss: "The square is a public space."
  es.b2.unit06.lesson01.teach.camaras_vigilancia:
    title: "the surveillance cameras"
    gloss: "the surveillance cameras"
    note: "*Las cámaras de vigilancia* = 'the surveillance cameras'; *vigilancia* on its own is 'surveillance / watch'."
    example_gloss: "There are more surveillance cameras in the square."
  es.b2.unit06.lesson01.teach.deben_instalarse:
    title: "should be installed"
    gloss: "should be installed"
    note: "*Deben instalarse* uses *deber* ('should/must') + the reflexive-passive *instalarse* ('to be installed'). The debated claim is *deben instalarse cámaras de vigilancia* -- 'surveillance cameras should be installed'."
    example_gloss: "The cameras should be installed in the square."
  es.b2.unit06.lesson01.teach.a_mi_parecer:
    title: "in my view"
    gloss: "in my view / to my mind"
    note: "*A mi parecer* introduces an OPINION -- a touch more measured than a flat 'I think'. It usually opens the sentence, set off by a comma, and the rest of the sentence keeps its normal order: *a mi parecer, la vigilancia ayuda*."
    example_gloss: "In my view, surveillance helps."
  es.b2.unit06.lesson01.teach.yo_diria_que:
    title: "I would say that..."
    gloss: "I would say that..."
    note: "*Yo diría que...* ('I would say that...') is a TENTATIVE opinion frame -- the conditional *diría* softens the claim compared to a flat statement."
    example_gloss: "I would say that it's a good idea."
  es.b2.unit06.lesson01.teach.no_me_cabe_duda:
    title: "I have no doubt that..."
    gloss: "I have no doubt that..."
    note: "*No me cabe duda de que...* = 'I have no doubt that...' -- the strongest opinion frame, for a view you hold firmly. Literally 'no doubt fits in me that...'."
    example_gloss: "I have no doubt that security matters."
  es.b2.unit06.lesson01.teach.claim_model:
    title: "In my view, surveillance cameras should be installed in public spaces."
    gloss: "In my view, surveillance cameras should be installed in public spaces."
    note: "The claim this whole unit debates, stated with *a mi parecer*, the measured middle option of the three opinion frames."
  es.b2.unit06.lesson01.teach.grammar_opinion_frames:
    title: "In my view, surveillance cameras should be installed. I would say that they help. I have no doubt that security matters."
    gloss: "In my view, surveillance cameras should be installed. I would say that they help. I have no doubt that security matters."
    note: "Three ways to open an opinion, from tentative to firm: *yo diría que* (softened by the conditional) < *a mi parecer* (measured) < *no me cabe duda de que* (firm). At B2 you pair one of these with a QUALIFIER (next lesson) so your opinion is nuanced, not flat."

  es.b2.unit06.lesson02.teach.por_lo_general:
    title: generally
    gloss: "generally / on the whole"
    note: "*Por lo general* = 'generally' -- claims something is usually, not always, so. It softens a sweeping statement and often opens the sentence."
    example_gloss: "Generally, cameras help."
  es.b2.unit06.lesson02.teach.no_necesariamente:
    title: "not necessarily"
    gloss: "not necessarily"
    note: "*No necesariamente* = 'not necessarily' (NOT 'not necessary'). It concedes a point may hold sometimes while denying it must always: *eso no es necesariamente malo* = 'that's not necessarily bad'."
    example_gloss: "That's not necessarily bad."
  es.b2.unit06.lesson02.teach.eso_depende_de:
    title: "that depends on"
    gloss: "that depends on / it depends on"
    note: "*Eso depende de...* = 'that depends on...' -- refuses a flat yes/no and signals a conditional view. *Depende* always takes *de* before its object."
    example_gloss: "That depends on the situation."
  es.b2.unit06.lesson02.teach.en_muchos_casos:
    title: "in many cases"
    gloss: "in many cases"
    note: "*En muchos casos* = 'in many cases' -- another hedge that avoids an absolute claim. *En muchos casos, funciona bien* = 'in many cases, it works well'."
    example_gloss: "In many cases, it works well."
  es.b2.unit06.lesson02.teach.privacidad:
    title: privacy
    gloss: privacy
    note: "*La privacidad* ('privacy') is the value that sits opposite security in this debate -- who gets watched, and by whom."
    example_gloss: "Privacy also matters."
  es.b2.unit06.lesson02.teach.claim_model:
    title: "Generally, surveillance helps, but it doesn't necessarily solve everything."
    gloss: "Generally, surveillance helps, but it doesn't necessarily solve everything."
    note: "A QUALIFIED opinion hedges its claim instead of asserting it flat -- *por lo general* grants the general case, *no necesariamente* denies it holds every time."
  es.b2.unit06.lesson02.teach.grammar_matizar:
    title: "Generally, it helps. It doesn't necessarily solve everything. That depends on the situation."
    gloss: "Generally, it helps. It doesn't necessarily solve everything. That depends on the situation."
    note: "Reach for *por lo general*, *no necesariamente*, *eso depende de*, or *en muchos casos* to grant a point partly -- the core B2 move for discussing values without overstating your case."

  es.b2.unit06.lesson03.teach.comprendo_tu_punto:
    title: "I understand your point of view, but..."
    gloss: "I understand your point of view, but..."
    note: "*Comprendo tu punto de vista, pero...* concedes the other person's view THEN pushes back -- the polite spine of a disagreement. You acknowledge before you object, rather than a bare 'but'."
    example_gloss: "I understand your point of view, but I think differently."
  es.b2.unit06.lesson03.teach.no_comparto:
    title: "I don't share that opinion, because..."
    gloss: "I don't share that opinion, because..."
    note: "*No comparto esa opinión, porque...* = 'I don't share that opinion, because...' -- a direct disagreement with a reason attached, not a bare refusal."
    example_gloss: "I don't share that opinion, because privacy matters."
  es.b2.unit06.lesson03.teach.comparto:
    title: "I share that opinion"
    gloss: "I share that opinion / I agree with that"
    note: "*Comparto esa opinión* = 'I share that opinion' -- the positive counterpart, same *comparto esa opinión* frame without *no*."
    example_gloss: "Yes, I share that opinion."
  es.b2.unit06.lesson03.teach.confianza:
    title: trust
    gloss: trust
    note: "*La confianza* ('trust') is another value in play: does more surveillance build public trust, or erode it? *Afectar* = 'to affect'."
    example_gloss: "Surveillance can affect trust."
  es.b2.unit06.lesson03.teach.claim_model:
    title: "I understand your point of view, but I don't share that opinion, because privacy matters."
    gloss: "I understand your point of view, but I don't share that opinion, because privacy matters."
    note: "The model response to an opposing view: concede first (*comprendo tu punto de vista*), then disagree with a reason (*no comparto esa opinión, porque...*)."
  es.b2.unit06.lesson03.teach.grammar_responder:
    title: "I understand your point of view, but I don't share that opinion. Yes, I share that opinion. Surveillance can affect trust."
    gloss: "I understand your point of view, but I don't share that opinion. Yes, I share that opinion. Surveillance can affect trust."
    note: "Responding to an opposing view means engaging with it, not restating your own: concede then push back (*comprendo tu punto de vista, pero...*), disagree with a reason (*no comparto esa opinión, porque...*), or agree outright (*comparto esa opinión*)."

  es.b2.unit06.lesson04.teach.por_una_parte_por_otra:
    title: "on one hand ... on the other hand"
    gloss: "on one hand ... on the other hand"
    note: "*Por una parte ... por otra parte* weighs two sides in one breath -- the hallmark of a balanced B2 opinion. A different, equally natural phrasing from *por un lado ... por otro lado*."
    example_gloss: "On one hand it's useful, on the other hand it's worrying."
  es.b2.unit06.lesson04.teach.beneficio:
    title: "the benefit"
    gloss: "the benefit"
    note: "*El beneficio* = 'the benefit'. Weighing *beneficio* against *riesgo* is how you argue a value instead of just asserting an opinion."
    example_gloss: "The camera has a clear benefit."
  es.b2.unit06.lesson04.teach.riesgo:
    title: "the risk"
    gloss: "the risk"
    note: "*El riesgo* = 'the risk' -- the mirror of *beneficio*. Naming both sides is what makes an opinion balanced rather than one-sided."
    example_gloss: "There is also a risk."
  es.b2.unit06.lesson04.teach.comunidad:
    title: community
    gloss: community
    note: "*La comunidad* ('community') is the collective-value angle: what is good *para la comunidad*, not just for one person. A core abstract noun for values talk."
    example_gloss: "The community needs more security."
  es.b2.unit06.lesson04.teach.claim_model:
    title: "On one hand, surveillance has benefits; on the other hand, there is a risk for the community."
    gloss: "On one hand, surveillance has benefits; on the other hand, there is a risk for the community."
    note: "Weighing a value means holding both sides at once, using *por una parte ... por otra parte* to frame the balance explicitly."
  es.b2.unit06.lesson04.teach.grammar_pesar:
    title: "On one hand, there's a benefit. On the other hand, there's a risk. That is good for the community."
    gloss: "On one hand, there's a benefit. On the other hand, there's a risk. That is good for the community."
    note: "Weighing a value means naming a *beneficio* and a *riesgo*, then judging what's good *para la comunidad* -- not just for the individual."

  es.b2.unit06.lesson05.teach.texto:
    title: "Reading: should public spaces have surveillance cameras?"
    gloss: "In my view, surveillance cameras should be installed in public spaces. On one hand, the community's security improves; on the other hand, privacy also matters. Generally, surveillance helps, but it doesn't necessarily solve everything. I understand that some people worry, but I don't share that opinion entirely. In many cases, the benefit is greater than the risk. I have no doubt that, with clear rules, the community's trust can grow."
    glosses:
      parecer: "view, opinion (a mi parecer = in my view)"
      deben: "should, must (plural)"
      instalarse: "to be installed"
      cámaras: cameras
      vigilancia: surveillance
      espacios: spaces
      públicos: public
      parte: "part, side (por una parte = on one hand)"
      seguridad: security
      comunidad: community
      mejora: "improves (from mejorar)"
      otra: other
      privacidad: privacy
      también: also
      importa: "matters (from importar)"
      general: "general (por lo general = generally)"
      necesariamente: necessarily
      resuelve: "solves (from resolver)"
      todo: "everything, all"
      comprendo: "I understand (from comprender)"
      algunas: some
      personas: people
      preocupan: "worry (from preocupar)"
      comparto: "I share (from compartir)"
      opinión: opinion
      casos: cases
      beneficio: benefit
      mayor: greater
      riesgo: risk
      cabe: "fits (no me cabe duda = I have no doubt)"
      duda: doubt
      reglas: rules
      claras: clear
      confianza: trust
      crecer: "to grow"

  es.b2.unit06.lesson06.teach.afecta_vida_diaria:
    title: "affects your daily life"
    gloss: "affects your daily life"
    note: "*Afecta tu vida diaria* = 'affects your daily life'. *Afecta* is the plain present-tense form of *afectar* (lesson03 taught the infinitive after *puede*)."
    example_gloss: "That doesn't affect your daily life."
  es.b2.unit06.lesson06.teach.dialogue_elena_open:
    title: "Elena: In my view, surveillance cameras should be installed in the square. That improves security."
    gloss: "Elena: In my view, surveillance cameras should be installed in the square. That improves security."
  es.b2.unit06.lesson06.teach.dialogue_mateo_concede:
    title: "Mateo: I understand your point of view, but I'm worried about privacy."
    gloss: "Mateo: I understand your point of view, but I'm worried about privacy."
  es.b2.unit06.lesson06.teach.dialogue_elena_push:
    title: "Elena: Generally, surveillance helps. It doesn't necessarily affect your daily life."
    gloss: "Elena: Generally, surveillance helps. It doesn't necessarily affect your daily life."
  es.b2.unit06.lesson06.teach.dialogue_mateo_qualify:
    title: "Mateo: I don't share that opinion entirely. On the other hand, I understand that security matters."
    gloss: "Mateo: I don't share that opinion entirely. On the other hand, I understand that security matters."
  es.b2.unit06.lesson06.teach.dialogue_elena_conviction:
    title: "Elena: I have no doubt that, with clear rules, trust can grow."
    gloss: "Elena: I have no doubt that, with clear rules, trust can grow."
  es.b2.unit06.lesson06.teach.dialogue_mateo_final:
    title: "Mateo: That depends on the rules, but privacy also matters."
    gloss: "Mateo: That depends on the rules, but privacy also matters."
  es.b2.unit06.lesson06.teach.grammar_conversacion_matizada:
    title: "In my view, cameras should be installed, but that depends on the rules. I don't share that opinion entirely."
    gloss: "In my view, cameras should be installed, but that depends on the rules. I don't share that opinion entirely."
    note: "A real discussion mixes an opinion frame, a qualifier, and a response to the other side: state a view (*a mi parecer*), qualify it (*eso depende de*, *no necesariamente*), and answer the opposing view directly (*comprendo tu punto de vista, pero...* / *no comparto esa opinión*). That is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  es.b2.unit06.lesson01.exercise01.recognize_seguridad:
    instruction: "What does this word mean?"
    correct_option: security
    distractors: [privacy, trust, community]
    accepted_answers: [{value: security, status: correct}]
    feedback: "Seguridad means security -- one of the abstract values this unit weighs."
  es.b2.unit06.lesson01.exercise02.listen_opinion_camaras:
    instruction: "Listen and select what you hear."
    correct_option: "In my view, surveillance cameras should be installed in public spaces."
    distractors: ["I would say surveillance cameras are already installed.", "In my view, cameras should be removed from public spaces.", "I have no doubt that cameras are installed everywhere."]
    accepted_answers: [{value: "In my view, surveillance cameras should be installed in public spaces.", status: correct}]
    feedback: "A mi parecer, deben instalarse cámaras de vigilancia en los espacios públicos means in my view, surveillance cameras should be installed in public spaces -- an opinion frame plus the debated claim."
  es.b2.unit06.lesson01.exercise03.match_opinion_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"a mi parecer": "in my view", "yo diría que": "I would say that", "no me cabe duda de que": "I have no doubt that", "la vigilancia": surveillance, "la seguridad": security, "el espacio público": "the public space", instalar: "to install"}
        status: correct
    feedback: "The three opinion frames run from tentative (yo diría que) through measured (a mi parecer) to firm (no me cabe duda de que); la vigilancia and la seguridad are central to this debate."
  es.b2.unit06.lesson01.exercise04.order_deben_instalarse:
    instruction: "Put the words in order: The cameras should be installed in the square."
    accepted_answers:
      - {value: "Las cámaras deben instalarse en la plaza", status: correct}
    feedback: "Las cámaras deben instalarse en la plaza -- deben + the reflexive-passive instalarse."
  es.b2.unit06.lesson01.exercise05.translate_yo_diria:
    instruction: "Translate into Spanish, using yo diría que: I would say that it's a good idea."
    accepted_answers:
      - {value: "Yo diría que es una buena idea", status: correct}
      - {value: "Yo diría que es buena idea", status: correct}
    feedback: "Yo diría que es una buena idea means I would say that it's a good idea."
  es.b2.unit06.lesson01.exercise06.speak_no_me_cabe_duda:
    instruction: "Say aloud in Spanish, using no me cabe duda de que: I have no doubt that security matters."
    accepted_answers:
      - {value: "No me cabe duda de que la seguridad importa", status: correct}
    feedback: "No me cabe duda de que la seguridad importa means I have no doubt that security matters."
  es.b2.unit06.lesson01.exercise07.write_a_mi_parecer:
    instruction: "Write in Spanish, using a mi parecer: In my view, surveillance helps."
    accepted_answers:
      - {value: "A mi parecer, la vigilancia ayuda", status: correct}
      - {value: "A mi parecer la vigilancia ayuda", status: correct}
    feedback: "A mi parecer, la vigilancia ayuda means in my view, surveillance helps."
  es.b2.unit06.lesson01.exercise08.dictation_opinion_camaras:
    instruction: "Type what you hear."
    correct_response: "A mi parecer, deben instalarse cámaras de vigilancia en los espacios públicos"
    orthography_strict: true
    feedback: "You heard A mi parecer, deben instalarse cámaras de vigilancia en los espacios públicos — in my view, surveillance cameras should be installed in public spaces."

  es.b2.unit06.lesson02.exercise01.recognize_privacidad:
    instruction: "What does this word mean?"
    correct_option: privacy
    distractors: [security, trust, community]
    accepted_answers: [{value: privacy, status: correct}]
    feedback: "Privacidad means privacy -- the value this unit weighs against security."
  es.b2.unit06.lesson02.exercise02.listen_por_lo_general:
    instruction: "Listen and select what you hear."
    correct_option: "Generally, cameras help."
    distractors: ["Cameras always help.", "Cameras never help.", "Generally, cameras are expensive."]
    accepted_answers: [{value: "Generally, cameras help.", status: correct}]
    feedback: "Por lo general, las cámaras ayudan means generally, cameras help -- a hedged, not absolute, claim."
  es.b2.unit06.lesson02.exercise03.match_nuance_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"por lo general": generally, "no necesariamente": "not necessarily", "eso depende de": "that depends on", "en muchos casos": "in many cases", privacidad: privacy, situación: situation}
        status: correct
    feedback: "These are qualifiers: each grants a point only partly, turning a flat opinion into a nuanced one."
  es.b2.unit06.lesson02.exercise04.order_no_necesariamente:
    instruction: "Put the words in order: That's not necessarily bad."
    accepted_answers:
      - {value: "Eso no es necesariamente malo", status: correct}
    feedback: "Eso no es necesariamente malo -- no necesariamente means 'not necessarily', not 'not necessary'."
  es.b2.unit06.lesson02.exercise05.translate_por_lo_general:
    instruction: "Translate into Spanish, using por lo general: Generally, cameras help."
    accepted_answers:
      - {value: "Por lo general, las cámaras ayudan", status: correct}
      - {value: "Por lo general las cámaras ayudan", status: correct}
    feedback: "Por lo general, las cámaras ayudan means generally, cameras help."
  es.b2.unit06.lesson02.exercise06.write_eso_depende_de:
    instruction: "Write in Spanish, using eso depende de: That depends on the situation."
    accepted_answers:
      - {value: "Eso depende de la situación", status: correct}
    feedback: "Eso depende de la situación means that depends on the situation -- depende always takes de before its object."
  es.b2.unit06.lesson02.exercise07.translate_en_muchos_casos:
    instruction: "Translate into Spanish, using en muchos casos: In many cases, it works well."
    accepted_answers:
      - {value: "En muchos casos, funciona bien", status: correct}
      - {value: "En muchos casos funciona bien", status: correct}
    feedback: "En muchos casos, funciona bien means in many cases, it works well."

  es.b2.unit06.lesson03.exercise01.recognize_comparto:
    instruction: "What does this word mean?"
    correct_option: "I share"
    distractors: ["I understand", "I need", "I doubt"]
    accepted_answers: [{value: "I share", status: correct}]
    feedback: "Comparto (from compartir) means 'I share' -- comparto esa opinión means I share that opinion / I agree with that."
  es.b2.unit06.lesson03.exercise02.listen_comprendo_punto:
    instruction: "Listen and select what you hear."
    correct_option: "I understand your point of view, but I don't share that opinion."
    distractors: ["I understand your point of view, and I share that opinion.", "I don't understand your point of view.", "I share that opinion completely."]
    accepted_answers: [{value: "I understand your point of view, but I don't share that opinion.", status: correct}]
    feedback: "Comprendo tu punto de vista, pero no comparto esa opinión means I understand your point of view, but I don't share that opinion -- concede, then push back."
  es.b2.unit06.lesson03.exercise03.match_respond_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
