course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: summarize and evaluate multiple sources
    -- attribute a claim to its source (según, afirma, sostiene, señala
    que), compare two sources side by side (ambas, mientras que, en
    cambio, a diferencia de), name where they agree (coinciden en que)
    and where they conflict (discrepan en, se contradicen), and give a
    reasoned judgement between them (más convincente, más sólida, en
    conjunto, al final), around two conflicting reviews of a new gym.

units:
  es.b2.unit08.sintesis:
    title: "Synthesis"
    description: Summarize and evaluate two sources -- attribute each claim, name where the two reviews agree and where they conflict, weigh which is better supported, and write a synthesis that gives a reasoned judgement between them.

lessons:
  es.b2.unit08.lesson01.quien_dice_que:
    title: "Who says what?"
  es.b2.unit08.lesson02.comparar:
    title: "Comparing two sources"
  es.b2.unit08.lesson03.coincidencias:
    title: "Where do they agree?"
  es.b2.unit08.lesson04.discrepancias:
    title: "Where do they disagree?"
  es.b2.unit08.lesson05.dos_resenas:
    title: "Two reviews side by side"
  es.b2.unit08.lesson06.sintesis_completa:
    title: "Summarize and judge"

teaching:
  es.b2.unit08.lesson01.teach.fitclub:
    title: "FitClub is a new gym."
    gloss: "FitClub is a new gym."
    note: "The situation the whole unit synthesizes: two people have reviewed a new gym, *FitClub*, and you have to weigh what they say. *Un gimnasio* is masculine; *nuevo* agrees with it."
  es.b2.unit08.lesson01.teach.resena:
    title: "the review"
    gloss: "the review"
    note: "*La reseña* = 'the review'. Each review is one of your two sources for this unit. *Leí* = 'I read' (preterite of *leer*); *sobre* = 'about'."
    example_gloss: "I read a review about FitClub."
  es.b2.unit08.lesson01.teach.segun:
    title: "According to Laura, the gym isn't expensive."
    gloss: "According to Laura, the gym isn't expensive."
    note: "*Según X* = 'according to X' -- the simplest way to attribute a claim to its source instead of asserting it yourself. You already know *según* from *según las investigaciones* (unit01); here it attributes a claim to a PERSON instead of a body of research."
  es.b2.unit08.lesson01.teach.marcos_afirma:
    title: "to state / assert"
    gloss: "to state / assert (states)"
    note: "*Afirmar* ('to state, assert', he/she form *afirma*) attributes a plain claim to a source: *Marcos afirma que el gimnasio es caro*. *Que* opens the reported clause."
    example_gloss: "Marcos states that the gym is expensive."
  es.b2.unit08.lesson01.teach.sostiene:
    title: "to argue / maintain"
    gloss: "to argue / maintain (maintains)"
    note: "*Sostener* ('to maintain', form *sostiene*) is a touch stronger than *afirmar* -- it reports a claim the source is holding firm to: *Marcos sostiene que el precio es alto*. *Alto* = 'high'."
    example_gloss: "Marcos maintains that the price is high."
  es.b2.unit08.lesson01.teach.senala:
    title: "to point out / note"
    gloss: "to point out / note (points out)"
    note: "*Señalar* ('to point out', form *señala*) attributes an observation rather than an opinion: *Laura señala que los entrenadores son buenos*. *Entrenadores* = 'trainers'; *buenos* agrees in the masculine plural."
    example_gloss: "Laura points out that the trainers are good."
  es.b2.unit08.lesson01.teach.fuente:
    title: "the source"
    gloss: "the source"
    note: "*La fuente* is the general word for anything you draw information from -- here, a review. Synthesis means weighing more than one *fuente*."
    example_gloss: "Laura and Marcos are the two sources."
  es.b2.unit08.lesson01.teach.grammar_atribuir:
    title: "According to Laura the gym isn't expensive. Marcos states it is expensive. Marcos maintains the price is high. Laura points out the trainers are good."
    gloss: "According to Laura the gym isn't expensive. Marcos states it is expensive. Marcos maintains the price is high. Laura points out the trainers are good."
    note: "Attributing keeps a claim at arm's length -- you report who says it, you don't assert it yourself. Toolkit: *según X*, *X afirma/sostiene/señala que...*. This is the first move of synthesis."

  es.b2.unit08.lesson02.teach.ambas:
    title: "both (feminine)"
    gloss: "both (of them, feminine)"
    note: "*Ambas* = 'both' (feminine, agreeing with *reseñas*): *Ambas reseñas dicen que los entrenadores son buenos*. Use *ambos* for masculine or mixed nouns."
    example_gloss: "Both reviews say the trainers are good."
  es.b2.unit08.lesson02.teach.mientras_que:
    title: "whereas"
    gloss: "whereas (contrastive)"
    note: "*Mientras que* is the CONTRASTIVE 'whereas' -- a fixed two-word phrase, distinct from the bare temporal *mientras* ('while') you already know from unit04. *Laura dice que no es caro, mientras que Marcos dice que es caro* sets one claim directly against the other."
  es.b2.unit08.lesson02.teach.en_cambio:
    title: "on the other hand"
    gloss: "on the other hand / instead"
    note: "*En cambio* -- you already know it from unit01 -- flags a contrasting view, usually set off by commas: *Marcos, en cambio, piensa que es caro*. *Piensa* = 'thinks' (he/she form of *pensar*)."
  es.b2.unit08.lesson02.teach.a_diferencia_de:
    title: "unlike / in contrast to"
    gloss: "unlike / in contrast to"
    note: "*A diferencia de X* = 'unlike X': *A diferencia de Laura, Marcos piensa que es caro*. It sets one source against the other before you state the second view."
    example_gloss: "Unlike Laura, Marcos thinks it is expensive."
  es.b2.unit08.lesson02.teach.claim_comparacion:
    title: "Both reviews say the trainers are good, but Laura thinks the price is low, whereas Marcos thinks it is high."
    gloss: "Both reviews say the trainers are good, but Laura thinks the price is low, whereas Marcos thinks it is high."
    note: "*Bajo* = 'low' -- the opposite of *alto* ('high') here, describing the price."
  es.b2.unit08.lesson02.teach.grammar_comparar:
    title: "Both reviews say the trainers are good. Laura thinks the price is low, whereas Marcos thinks it is high."
    gloss: "Both reviews say the trainers are good. Laura thinks the price is low, whereas Marcos thinks it is high."
    note: "Comparing is the second move of synthesis: line the two sources up. Signal what they SHARE with *ambas*, and what SEPARATES them with *mientras que / en cambio / a diferencia de*."

  es.b2.unit08.lesson03.teach.coincidir:
    title: "to agree / coincide"
    gloss: "to agree / coincide (agree)"
    note: "*Coincidir en que* = 'to agree that' -- the fixed frame for naming a point of agreement: *Laura y Marcos coinciden en que los entrenadores son buenos*."
    example_gloss: "Laura and Marcos agree that the trainers are good."
  es.b2.unit08.lesson03.teach.lo_mismo:
    title: "the same (thing)"
    gloss: "the same (thing)"
    note: "*Lo mismo* = 'the same thing': *Piensan lo mismo sobre los entrenadores* ('they think the same about the trainers'). *Sobre* = 'about'."
    example_gloss: "Laura and Marcos think the same about the trainers."
  es.b2.unit08.lesson03.teach.tema:
    title: "the topic"
    gloss: "the topic"
    note: "*El tema* = 'the topic (under discussion)'. It lets you say exactly WHAT two sources agree or clash on."
    example_gloss: "The topic is the price."
  es.b2.unit08.lesson03.teach.estan_de_acuerdo:
    title: "Laura and Marcos agree that the trainers are good."
    gloss: "Laura and Marcos agree that the trainers are good."
    note: "*Estar de acuerdo en que* = 'to agree that' -- you already know *estoy de acuerdo* ('I agree') from unit01; *están* is the plural of *estar* for 'they'."
  es.b2.unit08.lesson03.teach.claim_acuerdo:
    title: "On the topic of the trainers, both reviews coincide: they are good."
    gloss: "On the topic of the trainers, both reviews coincide: they are good."
  es.b2.unit08.lesson03.teach.grammar_coincidencia:
    title: "Laura and Marcos agree that the trainers are good. They coincide: they think the same about the topic."
    gloss: "Laura and Marcos agree that the trainers are good. They coincide: they think the same about the topic."
    note: "Naming AGREEMENT is the third move of synthesis. Say where the sources line up with *coinciden en que*, *están de acuerdo en que*, or *piensan lo mismo*."

  es.b2.unit08.lesson04.teach.discrepar:
    title: "to disagree / differ"
    gloss: "to disagree / differ (disagree)"
    note: "*Discrepar en* = 'to disagree about' -- the mirror of *coincidir en*: *Laura y Marcos discrepan en el precio*. Don't translate word-for-word from English 'disagree with'."
    example_gloss: "Laura and Marcos disagree about the price."
  es.b2.unit08.lesson04.teach.discrepancia:
    title: "the disagreement"
    gloss: "the disagreement / point of difference"
    note: "*La discrepancia* = 'the disagreement': *La discrepancia es el precio* ('the disagreement is the price'). The noun behind *discrepar*."
    example_gloss: "The disagreement is the price."
  es.b2.unit08.lesson04.teach.contradicen:
    title: "to contradict each other"
    gloss: "to contradict each other"
    note: "*Contradecirse* = 'to contradict each other/oneself'; the *se* marks the mutual/reflexive sense: *Se contradicen sobre el precio*. Stronger than merely differing -- the two claims cannot both be right."
    example_gloss: "They contradict each other about the price."
  es.b2.unit08.lesson04.teach.no_de_acuerdo:
    title: "Laura doesn't agree with Marcos about the price."
    gloss: "Laura doesn't agree with Marcos about the price."
  es.b2.unit08.lesson04.teach.aunque_discrepan:
    title: "Although they agree about the trainers, they disagree about the price."
    gloss: "Although they agree about the trainers, they disagree about the price."
    note: "*Aunque* (you already know it from unit01) can hold an agreement and a disagreement in the same sentence."
  es.b2.unit08.lesson04.teach.grammar_discrepancia:
    title: "Laura and Marcos disagree about the price. They contradict each other: Laura says it isn't expensive, Marcos says it is."
    gloss: "Laura and Marcos disagree about the price. They contradict each other: Laura says it isn't expensive, Marcos says it is."
    note: "Naming CONFLICT is the fourth move of synthesis. Say where the sources clash with *discrepan en X*, *se contradicen*, or by naming *la discrepancia*."

  es.b2.unit08.lesson05.teach.resena_laura:
    title: "Review 1 (Laura)"
    gloss: "FitClub is a great gym. The trainers are very good and the facilities are modern. The price isn't expensive. I'm going back."
    glosses:
      genial: "great / awesome"
      entrenadores: trainers
      instalaciones: facilities
      modernas: modern
      precio: price
      caro: expensive
      voy: "I'm going (1st person of ir); voy a volver = I'm going to go back"
  es.b2.unit08.lesson05.teach.resena_marcos:
    title: "Review 2 (Marcos)"
    gloss: "The gym FitClub has excellent trainers, that's true. But the price is very high: the membership costs forty euros a month. I expected more for that price."
    glosses:
      tiene: "has (3rd person of tener)"
      excelentes: excellent
      eso: that
      verdad: "true"
      precio: price
      mensualidad: "monthly fee / membership"
      cuesta: "costs (3rd person of costar)"
      cuarenta: forty
      euros: euros
      mes: month
      esperaba: "expected (imperfect of esperar)"
      más: more
  es.b2.unit08.lesson05.teach.la_cifra:
    title: "the figure"
    gloss: "the figure / number"
    note: "*La cifra* = 'the figure/number'. *Marcos da una cifra* ('Marcos gives a figure'). Whether a source backs its view with a *cifra* is what makes one review better supported than the other."
    example_gloss: "Marcos gives a figure: forty euros."
  es.b2.unit08.lesson05.teach.mejor_fundamentada:
    title: "better supported"
    gloss: "better supported / better backed up"
    note: "*Fundamentada* = 'backed up with evidence' (agreeing with feminine *reseña*). *Mejor fundamentada* = 'better supported': a review that gives a concrete figure (Marcos names a price) is *mejor fundamentada* than one that only asserts (Laura). *Su* = 'his/her'."
    example_gloss: "Marcos's review is better supported because he gives a figure."
  es.b2.unit08.lesson05.teach.grammar_dos_fuentes:
    title: "Both reviews agree the trainers are good. But they disagree about the price: Marcos gives a figure (forty euros), and that's why his review is better supported."
    gloss: "Both reviews agree the trainers are good. But they disagree about the price: Marcos gives a figure (forty euros), and that's why his review is better supported."
    note: "Reading two sources: first find what they SHARE (both call the trainers good), then the ONE point they CONFLICT on (the price), then judge which side is *mejor fundamentada* -- backs its claim with a figure."

  es.b2.unit08.lesson06.teach.pienso:
    title: "I think"
    gloss: "I think (1st person of pensar)"
    note: "*Pienso* = 'I think': *Yo pienso que es caro* ('I think it's expensive'). You already know *piensa* (he/she) from lesson02."
    example_gloss: "I think it is expensive."
  es.b2.unit08.lesson06.teach.mas_convincente:
    title: "more convincing"
    gloss: "more convincing"
    note: "*Más convincente* -- the core judgement frame: *Tu opinión es más convincente* ('your opinion is more convincing'). This is where you evaluate, not just summarize."
    example_gloss: "Your opinion is more convincing."
  es.b2.unit08.lesson06.teach.mas_solida:
    title: "more solid"
    gloss: "more solid / better supported"
    note: "*Más sólida* -- an alternative judgement frame, agreeing with feminine *opinión*: *Mi opinión es más sólida porque tengo una cifra*. *Tengo* = 'I have' (1st person of *tener*)."
    example_gloss: "My opinion is more solid because I have a figure."
  es.b2.unit08.lesson06.teach.en_conjunto:
    title: "overall / all things considered"
    gloss: "overall / all things considered"
    note: "*En conjunto* opens your final verdict, weighing everything together: *En conjunto, tengo razón* ('overall, I'm right')."
    example_gloss: "Overall, I'm right."
  es.b2.unit08.lesson06.teach.al_final:
    title: "in the end"
    gloss: "in the end / ultimately"
    note: "*Al final* -- another way to open your final verdict: *Al final, tu opinión es mejor* ('in the end, your opinion is better')."
    example_gloss: "In the end, your opinion is better."
  es.b2.unit08.lesson06.teach.cifra_concreta:
    title: "a concrete figure"
    gloss: "a concrete / specific figure"
    note: "*Concreta* = 'concrete, specific' (agreeing with feminine *cifra*): *una cifra concreta* is exactly what makes a judgement well-founded rather than a mere preference."
    example_gloss: "Mateo has a concrete figure."
  es.b2.unit08.lesson06.teach.coincidimos_discrepamos:
    title: "We agree on that, but we disagree about the price."
    gloss: "We agree on that, but we disagree about the price."
    note: "*Coincidimos* / *discrepamos* are the 'we' forms of *coincidir* / *discrepar* -- used when the two people talking are themselves the ones agreeing or disagreeing."
  es.b2.unit08.lesson06.teach.dialogue_mateo_pregunta:
    title: "Mateo: What did you think of FitClub?"
    gloss: "Mateo: What did you think of FitClub?"
  es.b2.unit08.lesson06.teach.dialogue_elena_positiva:
    title: "Elena: I think it's a great gym. The trainers are very good and the facilities are modern. And I think the price isn't expensive."
    gloss: "Elena: I think it's a great gym. The trainers are very good and the facilities are modern. And I think the price isn't expensive."
  es.b2.unit08.lesson06.teach.dialogue_mateo_precio:
    title: "Mateo: I, on the other hand, think it's expensive. The membership costs forty euros a month."
    gloss: "Mateo: I, on the other hand, think it's expensive. The membership costs forty euros a month."
  es.b2.unit08.lesson06.teach.dialogue_elena_entrenadores:
    title: "Elena: But the trainers are excellent, aren't they?"
    gloss: "Elena: But the trainers are excellent, aren't they?"
  es.b2.unit08.lesson06.teach.dialogue_mateo_resumen:
    title: "Mateo: Yes, we agree on that. But on the price, we disagree. Overall, I think my opinion is more solid, because I have a concrete figure."
    gloss: "Mateo: Yes, we agree on that. But on the price, we disagree. Overall, I think my opinion is more solid, because I have a concrete figure."
  es.b2.unit08.lesson06.teach.dialogue_elena_conclusion:
    title: "Elena: You're right. In the end, your opinion is more convincing."
    gloss: "Elena: You're right. In the end, your opinion is more convincing."
  es.b2.unit08.lesson06.teach.grammar_sintesis_completa:
    title: "They agree the trainers are good. They disagree about the price. Mateo's opinion is more convincing because he has a concrete figure: the membership costs forty euros."
    gloss: "They agree the trainers are good. They disagree about the price. Mateo's opinion is more convincing because he has a concrete figure: the membership costs forty euros."
    note: "A full synthesis has THREE named parts: the AGREEMENT (*coinciden en que*), the CONFLICT (*discrepan en*), and a reasoned JUDGEMENT (*más convincente/sólida, porque...*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  es.b2.unit08.lesson01.exercise01.recognize_segun:
    instruction: "What does this word mean?"
    correct_option: "according to"
    distractors: [because, although, "the source"]
    accepted_answers: [{value: "according to", status: correct}]
    feedback: "Según means 'according to' -- it attributes a claim to a source instead of asserting it yourself."
  es.b2.unit08.lesson01.exercise02.listen_segun_laura:
    instruction: "Listen and select what you hear."
    correct_option: "According to Laura, the gym isn't expensive."
    distractors: ["According to Laura, the gym is expensive.", "Marcos claims the gym isn't expensive.", "According to Marcos, the gym is expensive."]
    accepted_answers: [{value: "According to Laura, the gym isn't expensive.", status: correct}]
    feedback: "Según Laura, el gimnasio no es caro means 'according to Laura, the gym isn't expensive' -- the claim is attributed to Laura."
  es.b2.unit08.lesson01.exercise03.match_atribucion_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {según: "according to", afirma: "states / asserts", sostiene: "argues / maintains", señala: "points out / notes", reseña: review, fuente: source, gimnasio: gym, entrenadores: trainers}
        status: correct
    feedback: "These are the words for attributing a claim to a source: según / afirma / sostiene / señala point at who says what."
  es.b2.unit08.lesson01.exercise04.order_marcos_afirma:
    instruction: "Put the words in order: Marcos states that the gym is expensive."
    accepted_answers:
      - {value: "Marcos afirma que el gimnasio es caro", status: correct}
    feedback: "Marcos afirma que el gimnasio es caro -- afirma que introduces the reported claim."
  es.b2.unit08.lesson01.exercise05.translate_sostiene:
    instruction: "Translate into Spanish, using sostener: Marcos maintains that the price is high."
    accepted_answers:
      - {value: "Marcos sostiene que el precio es alto", status: correct}
    feedback: "Marcos sostiene que el precio es alto means 'Marcos maintains that the price is high'."
  es.b2.unit08.lesson01.exercise06.speak_segun_laura:
    instruction: "Say aloud in Spanish, using según: According to Laura, the gym isn't expensive."
    accepted_answers:
      - {value: "Según Laura, el gimnasio no es caro", status: correct}
    feedback: "Según Laura, el gimnasio no es caro means 'according to Laura, the gym isn't expensive'."
  es.b2.unit08.lesson01.exercise07.write_senala:
    instruction: "Write in Spanish, using señalar: Laura points out that the trainers are good."
    accepted_answers:
      - {value: "Laura señala que los entrenadores son buenos", status: correct}
    feedback: "Laura señala que los entrenadores son buenos means 'Laura points out that the trainers are good'."
  es.b2.unit08.lesson01.exercise08.dictation_segun_laura:
    instruction: "Type what you hear."
    correct_response: "Según Laura, el gimnasio no es caro"
    orthography_strict: true
    feedback: "You heard Según Laura, el gimnasio no es caro — according to Laura, the gym isn't expensive."

  es.b2.unit08.lesson02.exercise01.recognize_ambas:
    instruction: "What does this word mean?"
    correct_option: "both (of them, feminine)"
    distractors: ["neither (of them)", "some (of them)", "all (of them)"]
    accepted_answers: [{value: "both (of them, feminine)", status: correct}]
    feedback: "Ambas means 'both' -- it agrees in gender with a feminine noun like reseñas."
  es.b2.unit08.lesson02.exercise02.listen_ambas_entrenadores:
    instruction: "Listen and select what you hear."
    correct_option: "Both reviews say the trainers are good."
    distractors: ["Both reviews say the trainers are bad.", "Only one review says the trainers are good.", "Both reviews disagree about the trainers."]
    accepted_answers: [{value: "Both reviews say the trainers are good.", status: correct}]
    feedback: "Ambas reseñas dicen que los entrenadores son buenos means 'both reviews say the trainers are good' -- the point they agree on."
  es.b2.unit08.lesson02.exercise03.match_comparacion_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ambas: "both (of them, feminine)", "mientras que": whereas, "en cambio": "on the other hand", "a diferencia de": "unlike / in contrast to", bajo: low, alto: high, reseñas: reviews, precio: price}
        status: correct
    feedback: "These line two sources up: ambas for what they share, mientras que / en cambio / a diferencia de for what separates them."
  es.b2.unit08.lesson02.exercise04.order_ambas_entrenadores:
    instruction: "Put the words in order: Both reviews say the trainers are good."
    accepted_answers:
      - {value: "Ambas reseñas dicen que los entrenadores son buenos", status: correct}
