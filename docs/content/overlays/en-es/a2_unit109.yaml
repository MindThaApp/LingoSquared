  es.a2.unit109.lesson06.exercise01.escucha_elena: {"instruction": "Listen and select what Elena says first.", "correct_option": "Hola, Mateo. Mi abuela llama y dice que mañana hace sol.", "distractors": ["Hola, Mateo. Mi abuela llama y pregunta si mañana hace sol.", "Hola, Mateo. Mi abuela llama y dice que mañana llueve.", "Hola, Mateo. Mi tío llama y dice que mañana hace sol."], "accepted_answers": [{"value": "Hola, Mateo. Mi abuela llama y dice que mañana hace sol.", "status": "correct"}], "feedback": "Elena says: *Mi abuela llama y dice que mañana hace sol.*"}
  es.a2.unit109.lesson06.exercise02.entiende_pregunta: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "If Mateo is coming with them.", "distractors": ["What time the train leaves.", "If it is sunny.", "Where Mateo lives."], "accepted_answers": [{"value": "If Mateo is coming with them.", "status": "correct"}], "feedback": "Elena says: *Pregunta si vienes con nosotros.*"}
  es.a2.unit109.lesson06.exercise03.une_dialogo: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "Mi abuela dice que mañana hace sol.", "right": "My grandmother says that it is sunny tomorrow."}, {"left": "¿Y qué más dice?", "right": "And what else does she say?"}, {"left": "Dice que el pueblo está muy bonito.", "right": "She says that the village looks very nice."}, {"left": "Pregunta si vienes con nosotros.", "right": "She asks if you are coming with us."}, {"left": "¿A qué hora sale el tren?", "right": "What time does the train leave?"}, {"left": "Dice que sale a las nueve.", "right": "She says that it leaves at nine."}, {"left": "Entonces voy contigo.", "right": "Then I am going with you."}], "status": "correct"}], "feedback": "Each line comes from the dialogue."}
  es.a2.unit109.lesson06.exercise04.ordena_nueve: {"instruction": "Put the words in order to say 'My grandmother says that it leaves at nine.'", "correct_option": "Mi abuela dice que sale a las nueve", "accepted_answers": [{"value": "Mi abuela dice que sale a las nueve", "status": "correct"}], "feedback": "*Dice que* + present."}
  es.a2.unit109.lesson06.exercise05.responde_mas: {"instruction": "Answer as Elena: say that your grandmother asks if Mateo is coming with you. Use *pregunta si*.", "correct_option": "Pregunta si vienes con nosotros.", "accepted_answers": [{"value": "Pregunta si vienes con nosotros.", "status": "correct"}, {"value": "Pregunta si vienes con nosotros", "status": "correct"}, {"value": "Mi abuela pregunta si vienes con nosotros.", "status": "correct"}, {"value": "Mi abuela pregunta si vienes con nosotros", "status": "correct"}], "feedback": "*Pregunta si vienes con nosotros.*"}
  es.a2.unit109.lesson06.exercise06.traduce_hora: {"instruction": "Translate into Spanish. Use *dice que*.", "accepted_answers": [{"value": "Mi abuela dice que el tren sale a las nueve.", "status": "correct"}, {"value": "Mi abuela dice que el tren sale a las nueve", "status": "correct"}], "feedback": "*Mi abuela dice que el tren sale a las nueve.*"}
  es.a2.unit109.lesson06.exercise07.escribe_dos: {"instruction": "Write exactly two sentences. First use *dice que*, then *pregunta si*.", "correct_option": "Mi abuela dice que mañana hace sol. Pregunta si vienes.", "accepted_answers": [{"value": "Mi abuela dice que mañana hace sol. Pregunta si vienes.", "status": "correct"}, {"value": "Mi abuela dice que mañana hace sol. Pregunta si vienes", "status": "correct"}, {"value": "Mi abuela dice que mañana hace sol y pregunta si vienes.", "status": "correct"}, {"value": "Mi abuela dice que mañana hace sol y pregunta si vienes", "status": "correct"}], "feedback": "*Mi abuela dice que mañana hace sol. Pregunta si vienes.*"}
