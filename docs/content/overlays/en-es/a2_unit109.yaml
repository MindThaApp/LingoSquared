  es.a2.unit109.lesson02.exercise05.completa_si: {"instruction": "Complete with the word for if or whether.", "correct_option": "si", "accepted_answers": [{"value": "si", "status": "correct"}], "feedback": "*Pregunta si Elena viene.*"}
  es.a2.unit109.lesson02.exercise06.traduce_pregunta: {"instruction": "Translate into Spanish. Use *pregunta*.", "accepted_answers": [{"value": "Mi tío pregunta cuánto cuesta el billete.", "status": "correct"}, {"value": "Mi tío pregunta cuánto cuesta el billete", "status": "correct"}], "feedback": "*Mi tío pregunta cuánto cuesta el billete.*"}
  es.a2.unit109.lesson02.exercise07.escribe_viene: {"instruction": "Write the sentence with *pregunta si*.", "correct_option": "Mateo pregunta si Elena viene.", "accepted_answers": [{"value": "Mateo pregunta si Elena viene.", "status": "correct"}, {"value": "Mateo pregunta si Elena viene", "status": "correct"}], "feedback": "*Mateo pregunta si Elena viene.*"}
  es.a2.unit109.lesson03.exercise01.elige_esta: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo dice que está cansado.", "distractors": ["Mateo dice que estoy cansado.", "Mateo dice que estás cansado.", "Mateo dice que estar cansado."], "accepted_answers": [{"value": "Mateo dice que está cansado.", "status": "correct"}], "feedback": "The speaker is now *él*: *está*."}
