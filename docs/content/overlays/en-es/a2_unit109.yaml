  es.a2.unit109.lesson03.exercise04.ordena_me: {"instruction": "Put the words in order to say 'Mateo tells me that he is late.'", "correct_option": "Mateo me dice que llega tarde", "accepted_answers": [{"value": "Mateo me dice que llega tarde", "status": "correct"}], "feedback": "*Me dice que* + present."}
  es.a2.unit109.lesson03.exercise05.completa_tiene: {"instruction": "Complete the verb for *ella*.", "correct_option": "tiene", "accepted_answers": [{"value": "tiene", "status": "correct"}], "feedback": "Now it is *ella*: *tiene*."}
