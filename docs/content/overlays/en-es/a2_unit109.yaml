  es.a2.unit109.lesson04.exercise03.une_recado: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "Mi tío llama.", "right": "My uncle calls."}, {"left": "Dice que llega mañana.", "right": "He says that he arrives tomorrow."}, {"left": "Pregunta si puedes ir a la estación.", "right": "He asks if you can go to the station."}, {"left": "Hay un mensaje para ti.", "right": "There is a message for you."}, {"left": "la nota", "right": "the note"}, {"left": "esperar", "right": "to wait"}, {"left": "el recado", "right": "the message to pass on"}], "status": "correct"}], "feedback": "The three parts of a message."}
  es.a2.unit109.lesson04.exercise04.ordena_estacion: {"instruction": "Put the words in order to say 'He asks if you can go to the station.'", "correct_option": "Pregunta si puedes ir a la estación", "accepted_answers": [{"value": "Pregunta si puedes ir a la estación", "status": "correct"}], "feedback": "*Pregunta si* + present."}
  es.a2.unit109.lesson04.exercise05.completa_dice: {"instruction": "Complete the verb that passes on what he says.", "correct_option": "Dice", "accepted_answers": [{"value": "Dice", "status": "correct"}], "feedback": "*Dice que llega mañana.*"}
  es.a2.unit109.lesson04.exercise06.traduce_nota: {"instruction": "Translate into Spanish. Use *dice que*.", "accepted_answers": [{"value": "Elena llama. Dice que llega tarde.", "status": "correct"}, {"value": "Elena llama. Dice que llega tarde", "status": "correct"}, {"value": "Elena llama y dice que llega tarde.", "status": "correct"}, {"value": "Elena llama y dice que llega tarde", "status": "correct"}], "feedback": "*Elena llama. Dice que llega tarde.*"}
  es.a2.unit109.lesson04.exercise07.escribe_dos: {"instruction": "Write exactly three sentences. Use *dice que* in the second and *pregunta si* in the third.", "correct_option": "Mi tío llama. Dice que llega mañana. Pregunta si puedes ir a la estación.", "accepted_answers": [{"value": "Mi tío llama. Dice que llega mañana. Pregunta si puedes ir a la estación.", "status": "correct"}, {"value": "Mi tío llama. Dice que llega mañana. Pregunta si puedes ir a la estación", "status": "correct"}], "feedback": "*Mi tío llama. Dice que llega mañana. Pregunta si puedes ir a la estación.*"}
  es.a2.unit109.lesson05.exercise01.lee_dice: {"instruction": "Read the text and choose the answer.", "correct_option": "Tomorrow at eight.", "distractors": ["Today at three.", "Tomorrow at three.", "Today at eight."], "accepted_answers": [{"value": "Tomorrow at eight.", "status": "correct"}], "feedback": "*Dice que llega mañana a las ocho.*"}
  es.a2.unit109.lesson05.exercise02.lee_pregunta: {"instruction": "Read the text and choose the answer.", "correct_option": "If he can go to the station.", "distractors": ["If he has a phone.", "Where his house is.", "If he is tired."], "accepted_answers": [{"value": "If he can go to the station.", "status": "correct"}], "feedback": "*Pregunta si puedes ir a la estación.*"}
