answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on reasons, order, purpose, conditions, indirect questions and passing on messages."
  learning_goal: "Pass on what someone says or asks in Spanish with dice que and pregunta si."
units:
  es.a2.unit109.dice_que: {"title": "He Says That", "description": "Pass on what someone says or asks, using the present tense only, for example a phone message or a note."}
lessons:
  es.a2.unit109.lesson01.dice_que: {"title": "He says that"}
  es.a2.unit109.lesson02.pregunta_si: {"title": "He asks if"}
  es.a2.unit109.lesson03.cambio_de_persona: {"title": "Changing person"}
  es.a2.unit109.lesson04.un_recado: {"title": "A phone message"}
  es.a2.unit109.lesson05.la_nota_de_elena: {"title": "Elena's Note"}
  es.a2.unit109.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit109.lesson01.teach.gn_dice: {"title": "Dice que + present", "gloss": "Mateo says he is late. Elena says she has work. My grandmother says it is sunny.", "note": "*Decir que* passes on what someone says. *Que* (that) joins the two parts and the second verb is in the present. *Que* is not translated in English, but Spanish always needs it."}
  es.a2.unit109.lesson01.teach.gn_personas: {"title": "Forms of decir", "gloss": "I say that I am late. You say that you have work. Mateo says that he is late. We say that it is sunny. They say that they are coming.", "note": "*Decir* changes in the stem: *digo*, *dices*, *dice*, *decimos*, *dicen*."}
  es.a2.unit109.lesson01.teach.palabras: {"title": "Words for messages", "gloss": "to say / that / to be late / to have work / to be sunny / my grandmother", "note": "*Mi abuela* is Elena's grandmother. *Dicen* is for *ellos* and *ellas*.", "example_gloss": ["Mateo says that he is late.", "Elena says that she has work.", "My grandmother says it is sunny.", "My grandparents say that they are coming."]}
  es.a2.unit109.lesson01.teach.gn_que: {"title": "Never forget que", "gloss": "He says that he is coming. He says that it rains. He does not say that it rains.", "note": "Do not leave out *que*. In English you can say 'he says he is coming', but in Spanish you must say *dice que viene*."}
  es.a2.unit109.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Mateo says that he is late. Elena says that she has work. My grandmother says that it is sunny."}
  es.a2.unit109.lesson02.teach.gn_pregunta_si: {"title": "Pregunta si", "gloss": "Mateo asks if Elena is coming. Elena asks if there is a café. My grandmother asks if you have time.", "note": "*Preguntar si* passes on a yes-or-no question. After *si* the verb is in the present. *Si* has no accent."}
  es.a2.unit109.lesson02.teach.gn_pregunta_donde: {"title": "Pregunta + question word", "gloss": "Elena asks where the platform is. Mateo asks what time the train leaves. My uncle asks how much the ticket costs.", "note": "To pass on a question with *dónde*, *a qué hora* or *cuánto*, put the question word after *pregunta* with no *que*. Keep the accent."}
  es.a2.unit109.lesson02.teach.gn_dice_pregunta: {"title": "Says or asks", "gloss": "Mateo says that he is coming. Mateo asks if you are coming.", "note": "Use *dice que* for a statement and *pregunta si* for a yes-or-no question."}
  es.a2.unit109.lesson02.teach.palabras: {"title": "Words for questions", "gloss": "to ask / my uncle / the platform / the ticket / the train", "note": "*Preguntar* is to ask a question. It is not the same as *pedir*, which means to ask for something.", "example_gloss": ["Mateo asks if Elena is coming.", "Elena asks where the platform is.", "My uncle asks what time the train leaves.", "My grandmother asks how much the ticket costs."]}
  es.a2.unit109.lesson02.teach.frases: {"title": "Three sentences", "gloss": "Mateo asks if Elena is coming. Elena asks where the platform is. My uncle asks how much the ticket costs."}
  es.a2.unit109.lesson03.teach.gn_cambio: {"title": "Change the verb", "gloss": "Mateo: I am tired. Mateo says that he is tired. Elena: I have work. Elena says that she has work.", "note": "When you pass on what someone said, change the person. *Estoy* becomes *está*, *tengo* becomes *tiene*, because now it is *él* or *ella*."}
  es.a2.unit109.lesson03.teach.gn_me_te: {"title": "Me, te, nos", "gloss": "Mateo tells me that he is late. Elena tells you that she has work. My grandmother tells us that she is coming.", "note": "*Me*, *te* and *nos* go before *dice*. They say who is told."}
  es.a2.unit109.lesson03.teach.gn_mi_tu: {"title": "Mi becomes su", "gloss": "Elena: My dog is tired. Elena says that her dog is tired. Mateo: My uncle is coming. Mateo says that his uncle is coming.", "note": "*Mi* becomes *su* when you speak about someone else. *Su* means his or her."}
  es.a2.unit109.lesson03.teach.palabras: {"title": "Pronouns for messages", "gloss": "his or her / to me / to you / to us / to come / the dog", "note": "*Su perro* is his or her dog. Do not confuse *su* with *tu*: *tu* is your.", "example_gloss": ["Elena says that her dog is tired.", "Mateo tells me that he is late.", "My grandmother tells us that she is coming.", "Elena tells you that she has work."]}
  es.a2.unit109.lesson03.teach.frases: {"title": "Three sentences", "gloss": "Mateo says that he is tired. Elena tells me that she has work. Mateo says that his uncle is coming."}
  es.a2.unit109.lesson04.teach.gn_recado: {"title": "A phone message", "gloss": "My uncle calls. He says that he arrives tomorrow at eight. He asks if you can go to the station.", "note": "A phone message often has three parts: who calls, what they say (*dice que*), and what they ask (*pregunta si*)."}
  es.a2.unit109.lesson04.teach.gn_orden: {"title": "Message order", "gloss": "Elena calls. She says that she is late. She asks if you can wait.", "note": "Say who calls first. Then use one *dice que* for each piece of news and *pregunta si* for each question."}
  es.a2.unit109.lesson04.teach.gn_nota: {"title": "A written note", "gloss": "Note for Mateo: your uncle calls. He says that he arrives tomorrow. He asks if you can go to the station.", "note": "On a written note, use the present for everything: the call, the news and the question."}
  es.a2.unit109.lesson04.teach.palabras: {"title": "Words for messages", "gloss": "the message / the note / the message to pass on / to call / to wait / you can", "note": "*Un recado* is a message you pass on to someone. *Recado* is also an errand.", "example_gloss": ["There is a message for you.", "My uncle calls and says that he arrives tomorrow.", "Elena asks if you can wait.", "Note for Mateo."]}
  es.a2.unit109.lesson04.teach.frases: {"title": "Three sentences", "gloss": "My uncle calls. He says that he arrives tomorrow. He asks if you can go to the station."}
  es.a2.unit109.lesson05.teach.palabras: {"title": "Words for the note", "gloss": "at three / also / your house / he does not have his phone / your uncle", "note": "*Tu* (your) has no accent. *Tú* (you) does.", "example_gloss": ["Your uncle calls at three.", "He also asks where your house is.", "He says that he does not have his phone.", "Mateo has an uncle in Barcelona."]}
  es.a2.unit109.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "He says that he arrives tomorrow at eight. He asks if you can go to the station.", "note": "In the note, find what the uncle says and what he asks."}
  es.a2.unit109.lesson05.teach.lectura: {"title": "Elena writes a note for Mateo", "gloss": "Note for Mateo. Your uncle calls at three. He says that he arrives tomorrow at eight. He asks if you can go to the station. He also asks where your house is. He says that he does not have his phone. Elena.", "note": "Each piece of news uses *dice que*; each question uses *pregunta*.", "glosses": {"nota": "note", "tío": "uncle", "estación": "station", "casa": "house", "móvil": "phone"}}
  es.a2.unit109.lesson06.teach.d1: {"title": "Elena passes on news", "gloss": "Elena: Hi, Mateo. My grandmother calls and says that it is sunny tomorrow."}
  es.a2.unit109.lesson06.teach.d2: {"title": "Mateo asks", "gloss": "Mateo: And what else does she say?"}
  es.a2.unit109.lesson06.teach.d3: {"title": "Elena passes on more", "gloss": "Elena: She says that the village looks very nice. And she asks if you are coming with us."}
  es.a2.unit109.lesson06.teach.d4: {"title": "Mateo asks the time", "gloss": "Mateo: How kind. What time does the train leave?"}
  es.a2.unit109.lesson06.teach.d5: {"title": "Elena passes on the time", "gloss": "Elena: My grandmother says that it leaves at nine."}
  es.a2.unit109.lesson06.teach.d6: {"title": "Mateo decides", "gloss": "Mateo: Perfect. Then I am going with you."}
exercises:
  es.a2.unit109.lesson01.exercise01.elige_dice: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo dice que llega tarde.", "distractors": ["Mateo dice llega tarde.", "Mateo dice de llega tarde.", "Mateo dice que llegar tarde."], "accepted_answers": [{"value": "Mateo dice que llega tarde.", "status": "correct"}], "feedback": "*Dice que* + present verb."}
  es.a2.unit109.lesson01.exercise02.elige_dicen: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mis abuelos dicen que vienen.", "distractors": ["Mis abuelos dice que vienen.", "Mis abuelos dicen que venir.", "Mis abuelos decir que vienen."], "accepted_answers": [{"value": "Mis abuelos dicen que vienen.", "status": "correct"}], "feedback": "*Dicen* is the form for *ellos*."}
  es.a2.unit109.lesson01.exercise03.une_decir: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "digo", "right": "I say"}, {"left": "dices", "right": "you say"}, {"left": "dice", "right": "he or she says"}, {"left": "decimos", "right": "we say"}, {"left": "dicen", "right": "they say"}, {"left": "que", "right": "that"}, {"left": "decir", "right": "to say"}], "status": "correct"}], "feedback": "Present forms of *decir*."}
