  es.a2.unit109.lesson01.exercise05.completa_que: {"instruction": "Complete with the word that joins the two parts.", "correct_option": "que", "accepted_answers": [{"value": "que", "status": "correct"}], "feedback": "*Dice que tiene trabajo.*"}
  es.a2.unit109.lesson01.exercise06.traduce_dice: {"instruction": "Translate into Spanish. Use *dice que*.", "accepted_answers": [{"value": "Elena dice que tiene trabajo.", "status": "correct"}, {"value": "Elena dice que tiene trabajo", "status": "correct"}], "feedback": "*Elena dice que tiene trabajo.*"}
  es.a2.unit109.lesson01.exercise07.escribe_llega: {"instruction": "Write the sentence with *dice que*.", "correct_option": "Mateo dice que llega tarde.", "accepted_answers": [{"value": "Mateo dice que llega tarde.", "status": "correct"}, {"value": "Mateo dice que llega tarde", "status": "correct"}], "feedback": "*Mateo dice que llega tarde.*"}
  es.a2.unit109.lesson02.exercise01.elige_si: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo pregunta si Elena viene.", "distractors": ["Mateo pregunta que Elena viene.", "Mateo pregunta sí Elena viene.", "Mateo dice si Elena viene."], "accepted_answers": [{"value": "Mateo pregunta si Elena viene.", "status": "correct"}], "feedback": "*Pregunta si* for a yes-or-no question."}
  es.a2.unit109.lesson02.exercise02.elige_hora: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mi tío pregunta a qué hora sale el tren.", "distractors": ["Mi tío pregunta que a qué hora sale el tren.", "Mi tío dice a qué hora sale el tren.", "Mi tío pregunta a qué hora salir el tren."], "accepted_answers": [{"value": "Mi tío pregunta a qué hora sale el tren.", "status": "correct"}], "feedback": "*Pregunta* + question word, no *que*."}
  es.a2.unit109.lesson02.exercise03.une_pregunta: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "dice que", "right": "says that"}, {"left": "pregunta si", "right": "asks if"}, {"left": "pregunta dónde", "right": "asks where"}, {"left": "pregunta a qué hora", "right": "asks what time"}, {"left": "pregunta cuánto", "right": "asks how much"}, {"left": "preguntar", "right": "to ask"}, {"left": "mi tío", "right": "my uncle"}], "status": "correct"}], "feedback": "Passing on a statement and passing on a question."}
