  es.a2.unit109.lesson04.exercise01.elige_llama: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mi tío llama. Dice que llega mañana.", "distractors": ["Mi tío llama. Dice llega mañana.", "Mi tío llama. Dice que llegar mañana.", "Mi tío llama. Dice si llega mañana."], "accepted_answers": [{"value": "Mi tío llama. Dice que llega mañana.", "status": "correct"}], "feedback": "*Dice que* + present."}
