answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is correct.
    Do not treat n as a substitute for ñ because ñ is a separate Spanish
    letter. Inverted question and exclamation marks may be omitted in typed
    answers, but the fully punctuated form remains the model answer.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register rather
    than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Learn neutral pan-Hispanic greetings, introductions, and practical small
    talk for a first meeting. English-specific guidance highlights Spanish
    register, agreement, subject omission, and verb forms.

units:
  es.a1.unit01.greetings:
    title: "Greetings and first meetings"

lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: "Choosing tú or usted"
  es.a1.unit01.lesson02.greetings_by_time:
    title: "Greetings and farewells through the day"
  es.a1.unit01.lesson03.names_and_introductions:
    title: "Names and introductions"
  es.a1.unit01.lesson04.origin_and_language:
    title: "Origin, residence, and language"
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: "Small talk at a shared activity"
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: "First meeting at a cooking workshop"

teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: "Respectful you"
    gloss: "you, formal or respectful"
    note: >-
      English uses you across formal and informal relationships. Spanish
      often marks that social choice. Usted is useful with an unfamiliar
      adult or when a respectful tone is appropriate. Although it means you,
      it takes the same verb form as él or ella.

  es.a1.unit01.lesson01.teach.tu:
    title: "Informal you"
    gloss: "you, informal singular"
    note: >-
      Tú is used with one friend, peer, child, or another person when the
      relationship is informal. The accent distinguishes the pronoun tú from
      the possessive tu, meaning your.

  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: "Formal wellbeing question"
    gloss: "How are you?"
    note: >-
      Está is the usted form of estar. Spanish uses estar for someone's
      current condition here. Cómo carries an accent because it is an
      interrogative word.

  es.a1.unit01.lesson01.teach.como_estas:
    title: "Informal wellbeing question"
    gloss: "How are you?"
    note: >-
      Estás is the tú form of estar. English keeps are unchanged in both
      formal and informal questions, while Spanish changes está to estás to
      agree with the kind of you being addressed.

  es.a1.unit01.lesson01.teach.bien_gracias:
    title: "A concise reply"
    gloss: "Fine, thank you."
    note: "Spanish can answer with bien without repeating a subject or verb."

  es.a1.unit01.lesson01.teach.muy_bien:
    title: "A positive reply"
    gloss: "Very well, thank you."
    note: "Muy strengthens bien and does not change form."

  es.a1.unit01.lesson01.teach.and_usted:
    title: "Return the formal question"
    gloss: "And you?"
    note: "Keep usted when returning a respectfully framed question."

  es.a1.unit01.lesson01.teach.and_tu:
    title: "Return the informal question"
    gloss: "And you?"
    note: >-
      Use tú when the exchange is informal. The written accent matters because
      tu without an accent means your.

  es.a1.unit01.lesson02.teach.hola:
    title: "All-purpose greeting"
    gloss: "hello; hi"
    note: "Hola works at any time of day and in both formal and informal encounters."

  es.a1.unit01.lesson02.teach.buenos_dias:
    title: "Morning greeting"
    gloss: "good morning"
    note: >-
      Spanish nouns have grammatical gender, unlike English nouns. Días is
      masculine plural, so the adjective appears as buenos.

  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: "Afternoon greeting"
    gloss: "good afternoon"
    note: >-
      Tardes is feminine plural, so buenas agrees with it. The change from
      buenos to buenas is grammatical agreement, not a change in politeness.

  es.a1.unit01.lesson02.teach.buenas_noches:
    title: "Evening or night greeting"
    gloss: "good evening; good night"
    note: >-
      Noches is feminine plural and therefore takes buenas. The phrase can
      greet someone at night or close an encounter before sleep.

  es.a1.unit01.lesson02.teach.adios:
    title: "Direct farewell"
    gloss: "goodbye"
    note: "Adiós is neutral but can sound more final than a see-you-later expression."

  es.a1.unit01.lesson02.teach.hasta_luego:
    title: "See you later"
    gloss: "see you later"
    note: "Hasta luego is a conventional farewell and does not require a literal word-for-word reading."

  es.a1.unit01.lesson02.teach.nos_vemos:
    title: "Friendly farewell"
    gloss: "see you"
    note: "Literally, nos vemos is closer to we see each other."

  es.a1.unit01.lesson02.teach.good_day:
    title: "Polite closing wish"
    gloss: "Have a good day."
    note: >-
      Tenga is the usted form used in this polite wish. Buen is the shortened
      masculine singular form of bueno before día.

  es.a1.unit01.lesson03.teach.formal_name_question:
    title: "Ask a name formally"
    gloss: "What is your name?"
    note: >-
      Spanish expresses this as roughly what do you call yourself. Se pairs
      with the formal usted form llama. English does not mark this register
      distinction in the verb.

  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: "Give your name"
    gloss: "My name is Lucía."
    note: >-
      Me llamo literally means I call myself. The verb ending already signals
      the speaker, so Spanish normally omits yo here.

  es.a1.unit01.lesson03.teach.informal_name_question:
    title: "Ask a name informally"
    gloss: "What is your name?"
    note: >-
      Te goes with informal tú, and llamas carries the tú ending -as. Compare
      formal se llama with informal te llamas.

  es.a1.unit01.lesson03.teach.i_am_diego:
    title: "Introduce yourself with ser"
    gloss: "I am Diego."
    note: >-
      Soy is the first-person singular form of ser. Spanish uses ser for
      identity. English uses am for both identity and many temporary states,
      while Spanish divides those uses between ser and estar.

  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: "Pleasure at meeting someone"
    gloss: "Nice to meet you."
    note: >-
      Mucho gusto is a fixed, widely understood expression. Unlike adjectives
      such as encantado or encantada, it does not change with the speaker's
      gender.

  es.a1.unit01.lesson03.teach.igualmente:
    title: "Return the sentiment"
    gloss: "Likewise."
    note: "Igualmente is a concise response to Mucho gusto."

  es.a1.unit01.lesson03.teach.este_carlos:
    title: "Introduce a man"
    gloss: "This is Carlos."
    note: >-
      English this has no grammatical gender. Spanish uses este when the
      person or noun being pointed out is grammatically masculine.

  es.a1.unit01.lesson03.teach.esta_ana:
    title: "Introduce a woman"
    gloss: "This is Ana."
    note: >-
      Use esta for a feminine referent. Esta has no accent here; está with an
      accent is a form of estar and means is or is located.

  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: "Ask origin formally"
    gloss: "Where are you from?"
    note: >-
      Es is the usted form of ser. Spanish uses ser, not estar, for origin.
      Dónde has an accent in a direct question.

  es.a1.unit01.lesson04.teach.from_mexico:
    title: "State your origin"
    gloss: "I am from Mexico."
    note: >-
      Soy is the yo form of ser. The subject yo is unnecessary because soy
      already identifies the speaker.

  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: "Ask origin informally"
    gloss: "Where are you from?"
    note: >-
      Eres is the tú form of ser. Compare formal es usted with informal eres.
      English uses are for both.

  es.a1.unit01.lesson04.teach.from_colombia:
    title: "Another origin statement"
    gloss: "I am from Colombia."
    note: "Use soy de followed by a place to state origin."

  es.a1.unit01.lesson04.teach.live_london:
    title: "State where you live"
    gloss: "I live in London."
    note: >-
      Vivo is the yo form of vivir. Spanish does not need yo because the -o
      ending identifies the speaker.

  es.a1.unit01.lesson04.teach.speak_spanish:
    title: "Ask about Spanish formally"
    gloss: "Do you speak Spanish?"
    note: >-
      Spanish forms this yes-or-no question without an equivalent of English
      do. Habla is the usted form; intonation and question marks signal the
      question.

  es.a1.unit01.lesson04.teach.yes_a_little:
    title: "Limited ability"
    gloss: "Yes, a little."
    note: >-
      Sí with an accent means yes. Si without an accent means if, although the
      unaccented spelling is accepted as an A1 typing-tolerance variant here.

  es.a1.unit01.lesson04.teach.still_learning:
    title: "Describe an ongoing situation"
    gloss: "I am still learning."
    note: >-
      Estoy is the yo form of estar. Here estar supports an activity in
      progress, whereas soy in Soy de Colombia expresses origin or identity.
      English uses am in both constructions.

  es.a1.unit01.lesson05.teach.formal_first_time:
    title: "Ask formally about a first visit"
    gloss: "Is this your first time here?"
    note: >-
      Su means your when addressing someone as usted. English your does not
      reveal the relationship, but Spanish su versus tu preserves the formal
      or informal choice.

  es.a1.unit01.lesson05.teach.informal_first_time:
    title: "Ask informally about a first visit"
    gloss: "Is this your first time here?"
    note: >-
      Tu without an accent is the informal possessive your. Compare it with
      the pronoun tú, which carries an accent.

  es.a1.unit01.lesson05.teach.first_time_answer:
    title: "Confirm it is your first visit"
    gloss: "Yes, it is my first time."
    note: >-
      Primera is feminine because it agrees with vez. English adjectives do
      not change for noun gender.

  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: "Name your destination"
    gloss: "I am here for the cooking workshop."
    note: >-
      Vengo is the yo form of venir, meaning I come or I am coming. Al is the
      required contraction of a plus el.

  es.a1.unit01.lesson05.teach.me_too:
    title: "Share the same situation"
    gloss: "Me too."
    note: "Yo también is useful when the other person's statement also applies to you."

  es.a1.unit01.lesson05.teach.like_cooking:
    title: "Ask about an interest"
    gloss: "Do you like cooking?"
    note: >-
      Gustar does not mirror English word order. Te marks the person who
      experiences the liking, while cocinar is what is pleasing. The verb
      remains gusta because the activity is treated as singular.

  es.a1.unit01.lesson05.teach.yes_very_much:
    title: "Express strong interest"
    gloss: "Yes, very much."
    note: "Mucho answers the question about degree and does not change form here."

  es.a1.unit01.lesson05.teach.thats_good:
    title: "Positive reaction"
    gloss: "That's great."
    note: >-
      Qué carries an accent in this exclamation. It introduces a positive
      reaction rather than asking a question.

  es.a1.unit01.lesson06.teach.line01:
    title: "Opening the encounter"
    gloss: "Elena greets Mateo and asks if this is his first time here."
    note: "Both speakers use informal tú forms because they meet as peers in the same activity."
  es.a1.unit01.lesson06.teach.line02:
    title: "Opening the encounter, reply"
    gloss: "Mateo says it's his first time too and explains he's here for the cooking workshop."
    note: "Vengo al taller states the reason for being there, using the present tense for an ongoing situation."

  es.a1.unit01.lesson06.teach.line03:
    title: "Exchange names"
    gloss: "Elena agrees it's her first time too, gives her name, and asks Mateo's."
    note: "Me llamo is a natural way to give a name; Spanish normally leaves out yo because the verb form already identifies the speaker."
  es.a1.unit01.lesson06.teach.line04:
    title: "Exchange names, reply"
    gloss: "Mateo gives his name and says it's nice to meet her."
    note: "Soy is another natural way to give a name, using ser instead of the reflexive llamarse."

  es.a1.unit01.lesson06.teach.line05:
    title: "Ask about origin"
    gloss: "Elena returns the greeting and asks where Mateo is from."
    note: "De dónde eres asks about origin using the informal tú form."
  es.a1.unit01.lesson06.teach.line06:
    title: "Ask about origin, reply"
    gloss: "Mateo is from Colombia but lives in London, then asks Elena the same question."
    note: >-
      Soy de expresses origin, while vivo en expresses present residence.
      Pero links the contrast between those two facts.

  es.a1.unit01.lesson06.teach.line07:
    title: "Discuss an interest"
    gloss: "Elena says she's from Spain and asks if Mateo likes cooking."
    note: "Soy describes origin, the same pattern Mateo just used."
  es.a1.unit01.lesson06.teach.line08:
    title: "Discuss an interest, reply"
    gloss: "Mateo says he likes cooking a lot but is still learning."
    note: >-
      Estoy aprendiendo describes an activity currently in progress. English
      uses am in both places.

  es.a1.unit01.lesson06.teach.line09:
    title: "Close the exchange"
    gloss: "Elena agrees she's learning too and says they'll see each other inside."
    note: "Nos vemos signals an expected encounter later, and dentro specifies where."
  es.a1.unit01.lesson06.teach.line10:
    title: "Close the exchange, reply"
    gloss: "Mateo agrees and confirms they'll see each other."
    note: "Sí simply confirms Elena's suggestion before repeating nos vemos."

exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: "Which form of you is respectful or formal?"
    correct_option: "usted"
    distractors: ["tú", "tu"]
    accepted_answers: ["usted"]
    feedback: "Usted is the respectful singular form and takes third-person verb forms."

  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: "Which form addresses one friend or peer informally?"
    correct_option: "tú"
    distractors: ["usted", "tu"]
    accepted_answers: ["tú", "tu"]
    feedback: "The pronoun is written tú; unaccented tu means your."

  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: "Listen and select the sentence you hear."
    correct_option: "¿Cómo está usted?"
    distractors: ["¿Cómo estás?", "¿Y usted?"]
    accepted_answers: ["¿Cómo está usted?", "Como esta usted"]

  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: "Type the informal question you hear."
    accepted_answers:
      - "¿Cómo estás?"
      - "Cómo estás"
      - "Como estas"

  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: "Put the formal question in order."
    correct_response: ["Cómo", "está", "usted"]

  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: "Select the return question that keeps the respectful register."
    correct_option: "¿Y usted?"
    distractors: ["¿Y tú?", "¿Cómo estás?"]
    accepted_answers: ["¿Y usted?", "Y usted"]

  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: "Select the return question for a friend or peer."
    correct_option: "¿Y tú?"
    distractors: ["¿Y usted?", "¿Cómo está usted?"]
    accepted_answers: ["¿Y tú?", "Y tú", "Y tu"]

  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: "Correct the informal question."
    accepted_answers:
      - "¿Cómo estás?"
      - "Cómo estás"
      - "Como estas"
    feedback: "Tú requires estás; está is used with usted."

  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: "Reply politely to the question."
    accepted_answers:
      - "Bien, gracias."
      - "Bien, gracias"
      - "Muy bien, gracias."
      - "Muy bien, gracias"

  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: "Answer informally, thank the speaker, and return the question."
    accepted_answers:
      - "Muy bien, gracias. ¿Y tú?"
      - "Muy bien, gracias. Y tú?"
      - "Muy bien, gracias. Y tu?"
      - "Muy bien, gracias, ¿y tú?"
      - "Bien, gracias. ¿Y tú?"
      - "Bien, gracias. Y tu?"
      - "Bien, gracias, ¿y tú?"

  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: "Listen and select the greeting."
    correct_option: "Hola"
    distractors: ["Adiós", "Hasta luego"]
    accepted_answers: ["Hola"]

  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: "Type the morning greeting you hear."
    accepted_answers: ["Buenos días", "Buenos dias"]

  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: "Put the afternoon greeting in order."
    correct_response: ["Buenas", "tardes"]

  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: "What does this phrase mean in an evening greeting?"
    correct_option: "Good evening."
    distractors: ["Good morning.", "See you later."]
    accepted_answers: ["Good evening."]

  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Buenas noches"
    distractors: ["Buenos días", "Buenas tardes"]
    accepted_answers: ["Buenas noches"]

  es.a1.unit01.lesson02.exercise06.choose_farewell:
    instruction: "What is the function of this word?"
    correct_option: "It says goodbye."
    distractors: ["It asks a name.", "It says thank you."]
    accepted_answers: ["It says goodbye."]

  es.a1.unit01.lesson02.exercise07.listen_until_later:
    instruction: "Put the farewell you hear in order."
    correct_response: ["Hasta", "luego"]

  es.a1.unit01.lesson02.exercise08.reply_to_afternoon:
    instruction: "Return the greeting and then close the brief exchange."
    accepted_answers:
      - "Buenas tardes. Hasta luego."
      - "Buenas tardes, hasta luego."
      - "Buenas tardes. Adiós."

  es.a1.unit01.lesson02.exercise09.order_good_day:
    instruction: "Build the polite closing wish."
    correct_response: ["Que", "tenga", "un", "buen", "día"]

  es.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: "Say a friendly see-you farewell."
    accepted_answers: ["Nos vemos.", "Nos vemos"]

  es.a1.unit01.lesson03.exercise01.listen_formal_name:
    instruction: "Listen and choose what the speaker is asking."
    correct_option: "The speaker respectfully asks someone's name."
    distractors:
      - "The speaker asks where someone lives."
      - "The speaker informally asks how someone feels."
    accepted_answers: ["The speaker respectfully asks someone's name."]

  es.a1.unit01.lesson03.exercise02.order_name_answer:
    instruction: "Build Lucía's name statement."
    correct_response: ["Me", "llamo", "Lucía"]

  es.a1.unit01.lesson03.exercise03.listen_informal_name:
    instruction: "Type the informal name question you hear."
    accepted_answers:
      - "¿Cómo te llamas?"
      - "Cómo te llamas"
      - "Como te llamas"

  es.a1.unit01.lesson03.exercise04.reply_as_diego:
    instruction: "You are Diego. Answer the question."
    accepted_answers:
      - "Soy Diego."
      - "Soy Diego"
      - "Me llamo Diego."
      - "Me llamo Diego"

  es.a1.unit01.lesson03.exercise05.listen_pleased:
    instruction: "Type the expression you hear."
    accepted_answers: ["Mucho gusto.", "Mucho gusto"]

  es.a1.unit01.lesson03.exercise06.return_pleasure:
    instruction: "Respond naturally to Mucho gusto."
    accepted_answers:
      - "Igualmente."
      - "Igualmente"
      - "Mucho gusto."
      - "Mucho gusto"

  es.a1.unit01.lesson03.exercise07_choose_masculine_intro:
    instruction: "Complete the introduction of Carlos."
    correct_option: "Este"
    distractors: ["Esta", "Está"]
    accepted_answers: ["Este"]
    feedback: "Este agrees with the masculine referent Carlos."

  es.a1.unit01.lesson03.exercise08_choose_feminine_intro:
    instruction: "Complete the introduction of Ana."
    correct_option: "Esta"
    distractors: ["Este", "Está"]
    accepted_answers: ["Esta"]
    feedback: "Esta agrees with the feminine referent Ana and has no accent."

  es.a1.unit01.lesson03.exercise09.match_introductions:
    instruction: "Match each demonstrative with the person it introduces."
    correct_response:
      Este: "Carlos"
      Esta: "Ana"

  es.a1.unit01.lesson03.exercise10.speak_self_introduction:
    instruction: "Greet someone, give Lucía's name, and say it is nice to meet them."
    accepted_answers:
      - "Hola. Me llamo Lucía. Mucho gusto."
      - "Hola, me llamo Lucía. Mucho gusto."
      - "Hola. Soy Lucía. Mucho gusto."

  es.a1.unit01.lesson04.exercise01.choose_formal_origin:
    instruction: "What does this formal question ask?"
    correct_option: "Where are you from?"
    distractors: ["Where do you live?", "What is your name?"]
    accepted_answers: ["Where are you from?"]

  es.a1.unit01.lesson04.exercise02.reply_from_mexico:
    instruction: "Answer that you are from Mexico."
    accepted_answers:
      - "Soy de México."
      - "Soy de México"
      - "Soy de Mexico."
      - "Soy de Mexico"

  es.a1.unit01.lesson04.exercise03.listen_informal_origin:
    instruction: "Type the informal origin question you hear."
    accepted_answers:
      - "¿De dónde eres?"
      - "De dónde eres"
      - "De donde eres"

  es.a1.unit01.lesson04.exercise04.order_colombia:
    instruction: "Build the statement of Colombian origin."
    correct_response: ["Soy", "de", "Colombia"]

  es.a1.unit01.lesson04.exercise05.listen_residence:
    instruction: "Listen and select where the speaker lives."
    correct_option: "Londres"
    distractors: ["México", "Colombia"]
    accepted_answers: ["Londres"]

  es.a1.unit01.lesson04.exercise06_order_residence:
    instruction: "Build the residence statement."
    correct_response: ["Vivo", "en", "Londres"]

  es.a1.unit01.lesson04.exercise07.listen_language_question:
    instruction: "Listen and select the question you hear."
    correct_option: "¿Habla español?"
    distractors: ["¿De dónde eres?", "¿Cómo se llama usted?"]
    accepted_answers: ["¿Habla español?", "Habla español"]

  es.a1.unit01.lesson04.exercise08.reply_language:
    instruction: "Say that you speak a little Spanish."
    accepted_answers:
      - "Sí, un poco."
      - "Sí, un poco"
      - "Si, un poco."

  es.a1.unit01.lesson04.exercise09_order_learning:
    instruction: "Build the sentence describing ongoing learning."
    correct_response: ["Todavía", "estoy", "aprendiendo"]

  es.a1.unit01.lesson04.exercise10.speak_origin_profile:
    instruction: "Say that you are from Colombia, live in London, and are still learning."
