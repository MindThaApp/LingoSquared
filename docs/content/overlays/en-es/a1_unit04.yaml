answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is
    correct. Do not treat n as a substitute for ñ.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Days of the week, months of the year, and asking/stating calendar
    dates and birthdays, continuing Elena and Mateo's cooking-workshop
    narrative from units 01-03. English-specific guidance highlights the
    cardinal-number date convention (contrasted with English ordinals).

units:
  es.a1.unit04.dates:
    title: "Elena and Mateo's workshop schedule"

lessons:
  es.a1.unit04.lesson01.dias_de_la_semana:
    title: "Days of the week"
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: "Months of the year"
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: "Asking and stating the date"
  es.a1.unit04.lesson04.el_cumpleanos:
    title: "Elena and Mateo's birthdays"
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: "Reading the workshop schedule"
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: "Elena and Mateo plan the next class"

teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana: {title: "Monday-Friday", gloss: "Monday, Tuesday, Wednesday, Thursday, Friday", note: "Spanish weekday names are lowercase and not capitalized like in English, except at the start of a sentence.", example_gloss: ["The cooking workshop is on Tuesdays.", "On Thursdays I study Spanish."]}
  es.a1.unit04.lesson01.teach.fin_de_semana: {title: "Saturday, Sunday", gloss: "Saturday, Sunday", note: "*Sábado* and *domingo* are the only two days of the week that take an -s in the plural (*los sábados*, *los domingos*) -- the weekday names stay the same in singular and plural.", example_gloss: ["On Saturdays I go to the market.", "On Sundays I rest."]}
  es.a1.unit04.lesson01.teach.hoy_es_viernes: {title: "Today is Friday", gloss: "Today is Friday.", note: "*Hoy* (today) plus *es* (is) plus the day name states today's day directly, no article needed."}
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes: {title: "The workshop is on Tuesdays", gloss: "The cooking workshop is on Tuesdays.", note: "*Los martes* (with the plural article *los*) means \"on Tuesdays\" as a recurring schedule, not just one specific Tuesday."}

  es.a1.unit04.lesson02.teach.meses_primer_semestre: {title: "January-June", gloss: "January, February, March, April, May, June", note: "Like weekday names, Spanish month names are lowercase unless they start a sentence.", example_gloss: ["My birthday is in March.", "In June it's hot."]}
  es.a1.unit04.lesson02.teach.meses_segundo_semestre: {title: "July-December", gloss: "July, August, September, October, November, December", note: "*Septiembre* keeps the same root as English \"September\" -- most Spanish month names are close cognates of their English equivalents.", example_gloss: ["The cooking workshop starts in July.", "In December I visit my family."]}
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo: {title: "My birthday is in March", gloss: "My birthday is in March.", note: "*En* (in) is used with just the month name, without a specific day."}

  es.a1.unit04.lesson03.teach.que_fecha_es_hoy: {title: "Ask today's date", gloss: "What is today's date?", note: "*Qué fecha* (what date) is the standard way to ask for a calendar date, distinct from *qué hora* (what time), covered in a future unit."}
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio: {title: "State a date", gloss: "Today is the twenty-second of July.", note: "*El veintidós de julio* literally reads \"the twenty-two of July\" -- Spanish uses a plain cardinal number, not an ordinal like English's \"twenty-second.\""}
  es.a1.unit04.lesson03.teach.formato_fecha_note: {title: "Spanish date format", gloss: "How Spanish states calendar dates.", note: "Cardinal number + de + month, with *el primero* as the one common ordinal exception for the first of the month."}
  es.a1.unit04.lesson03.teach.cuando_es_el_taller: {title: "Ask when the workshop is", gloss: "When is the workshop?", note: "*Cuándo* (when) asks generally about timing; *qué fecha* (the other question in this lesson) asks specifically for a calendar date -- both are natural here."}
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio: {title: "State the workshop's date", gloss: "The workshop is on the twenty-second of July.", note: "Reuses the same date pattern from *hoy es el veintidós de julio*, just with a different subject (*el taller*)."}

  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos: {title: "Ask about someone's birthday", gloss: "When is your birthday?", note: "*Tu cumpleaños* (your birthday, informal) uses the *tú* register for friends."}
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo: {title: "State your birthday", gloss: "My birthday is the tenth of March.", note: "Unlike *en marzo* (in March, month only), a full birthday date uses *el* plus the day number, the same pattern as *el veintidós de julio*."}
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto: {title: "State a third person's birthday", gloss: "Mateo's birthday is the twenty-second of August.", note: "*El cumpleaños de Mateo* (Mateo's birthday) uses *de* to show possession, the same construction as *la familia de Elena*."}
  es.a1.unit04.lesson04.teach.felicidades: {title: "Congratulations!", gloss: "Congratulations! / Happy birthday!", note: "*¡Felicidades!* is the general all-purpose congratulations word, commonly used for birthdays as well as other good news.", example_gloss: "Congratulations, Elena! Today is your birthday."}

  es.a1.unit04.lesson05.teach.horario_reading:
    title: "Reading the workshop schedule"
    gloss: "The cooking workshop is on Tuesdays. The next class is the twenty-second of July. After that, there's a class on the twenty-ninth of July. The workshop ends on the twelfth of August."
    note: "This short schedule uses the weekday names and the date pattern you have learned in one connected text."
    glosses: {taller: "workshop", cocina: "cooking", martes: "Tuesdays", próxima: "next", clase: "class", veintidós: "twenty-two", julio: "July", Después: "after that", hay: "there is (from haber)", veintinueve: "twenty-nine", termina: "ends (from terminar)", doce: "twelve", agosto: "August"}
  es.a1.unit04.lesson05.teach.la_proxima_clase: {title: "The next class", gloss: "the next class", note: "*Próxima* (next) agrees with the feminine noun *clase*; the masculine form would be *próximo*."}
  es.a1.unit04.lesson05.teach.despues_note: {title: "Después (after)", gloss: "How *después* links events in sequence.", note: "*Después* = after, afterward."}

  es.a1.unit04.lesson06.teach.line01: {title: "Ask about the next class", gloss: "Mateo asks Elena when the next workshop class is.", note: "*La próxima clase del taller* = the workshop's next class."}
  es.a1.unit04.lesson06.teach.line02: {title: "State the date", gloss: "Elena confirms it's the twenty-second of July, a Tuesday.", note: "Elena adds *un martes* (a Tuesday) after the date, confirming the class is on the workshop's usual day, Tuesday."}
  es.a1.unit04.lesson06.teach.line03: {title: "Ask when the workshop ends", gloss: "Mateo asks when the workshop ends.", note: "*Perfecto* (perfect) is a natural brief acknowledgment before asking a follow-up question."}
  es.a1.unit04.lesson06.teach.line04: {title: "State the end date", gloss: "Elena says it ends the twelfth of August.", note: "The same end date as on the printed schedule."}
  es.a1.unit04.lesson06.teach.line05: {title: "Ask about a birthday, mid-conversation", gloss: "Mateo says \"by the way\" and asks when Elena's birthday is.", note: "*Por cierto* (by the way) naturally introduces a topic change within an ongoing conversation."}
  es.a1.unit04.lesson06.teach.line06: {title: "State the date and return the question", gloss: "Elena says the tenth of March, then asks \"and yours?\"", note: "*¿Y el tuyo?* (and yours?) uses the possessive pronoun *tuyo*, a new short form for returning a question about something already named (*cumpleaños*, masculine, hence *tuyo* not *tuya*)."}
  es.a1.unit04.lesson06.teach.line07: {title: "State Mateo's birthday", gloss: "Mateo says the twenty-second of August.", note: "A short, complete answer reusing the date pattern without repeating \"mi cumpleaños es\" -- natural in a quick spoken exchange."}
  es.a1.unit04.lesson06.teach.line08: {title: "React and note the timing", gloss: "Elena reacts warmly, noting his birthday falls after the workshop ends.", note: "*Es después del taller* (it's after the workshop): 22 August comes after the workshop ends on 12 August."}

