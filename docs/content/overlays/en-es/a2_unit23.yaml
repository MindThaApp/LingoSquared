exercises:
  es.a2.unit23.lesson01.exercise01.choose_uso_movil:
    instruction: "Which sentence means \"I use the mobile phone every day\"?"
    correct_option: "Uso el móvil todos los días."
    distractors: ["Uso mi móvil todo los días.", "Estoy usando el móvil cada días."]
    accepted_answers: ["Uso el móvil todos los días."]
  es.a2.unit23.lesson01.exercise02.listen_uso_movil:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Uso el móvil todos los días."
    distractors: ["Uso el móvil por la mañana.", "Uso el móvil por la noche."]
    accepted_answers: ["Uso el móvil todos los días."]
  es.a2.unit23.lesson01.exercise03.match_movil:
    instruction: "Match each Spanish phrase to its English meaning."
    correct_response:
      "el móvil": "the phone"
      uso: "I use"
      "todos los días": "every day"
  es.a2.unit23.lesson01.exercise04.order_uso_movil:
    instruction: "Build the sentence: I use the mobile phone every day."
    correct_response: ["Uso", "el", "móvil", "todos", "los", "días"]
  es.a2.unit23.lesson01.exercise05.write_phone_habit:
    instruction: "Write in Spanish: I use the mobile phone every day."
    accepted_answers:
      - "Uso el móvil todos los días."
      - "Uso el móvil todos los días"
      - "Yo uso el móvil todos los días."
      - "Uso mi móvil todos los días."
      - "Yo uso mi móvil todos los días."
  es.a2.unit23.lesson02.exercise01_choose_redes:
    instruction: "Which sentence means \"I look at social media at night\"?"
    correct_option: "Miro las redes sociales por la noche."
    distractors: ["Miro las redes social por la noche.", "Veo los medios sociales por la noche."]
    accepted_answers: ["Miro las redes sociales por la noche."]
  es.a2.unit23.lesson02.exercise02_listen_redes:
