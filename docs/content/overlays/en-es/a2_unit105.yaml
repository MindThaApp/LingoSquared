  es.a2.unit105.lesson04.exercise03.une_secuencia: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "primero", "right": "first"}, {"left": "luego", "right": "then"}, {"left": "después", "right": "after that"}, {"left": "por último", "right": "finally"}, {"left": "antes de", "right": "before + infinitive"}, {"left": "después de", "right": "after + infinitive"}, {"left": "cuando", "right": "when + conjugated verb"}], "status": "correct"}], "feedback": "Sequencing words and time clauses."}
