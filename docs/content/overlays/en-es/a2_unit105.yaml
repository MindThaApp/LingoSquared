  es.a2.unit105.lesson04.exercise01.elige_primero: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Primero desayuno. Luego salgo de casa.", "distractors": ["Luego desayuno. Primero salgo de casa.", "Por último desayuno. Primero salgo de casa.", "Luego desayuno. Por último salgo de casa."], "accepted_answers": [{"value": "Primero desayuno. Luego salgo de casa.", "status": "correct"}], "feedback": "*Primero* is the first step, *luego* the next."}
