teaching:
  es.a2.unit105.lesson01.teach.gn_antes: {"title": "Antes de + infinitive", "gloss": "Before going out, Mateo has breakfast. Before eating, Elena washes the fruit. Before sleeping, I read a book.", "note": "*Antes de* + infinitive says what happens first. The verb after *de* stays in the infinitive. The second action is in the present."}
  es.a2.unit105.lesson01.teach.gn_orden: {"title": "The clause can go last", "gloss": "Mateo has breakfast before going out. Elena closes the window before leaving home.", "note": "You can put *antes de* + infinitive at the start (with a comma) or at the end (no comma). The meaning is the same."}
  es.a2.unit105.lesson01.teach.palabras: {"title": "Daily actions", "gloss": "to have breakfast / to have dinner / to eat / to wash the fruit / to close the window / to read a book", "note": "*Desayunar* and *cenar* are verbs in Spanish: *desayuno* is I have breakfast.", "example_gloss": ["I have breakfast at seven.", "Elena has dinner at nine.", "Mateo washes the fruit before eating.", "Before going out, Elena closes the window."]}
  es.a2.unit105.lesson01.teach.gn_dos: {"title": "Longer chunks", "gloss": "Before leaving home, I close the window. Before taking the train, I buy a coffee.", "note": "The infinitive can have its own words after it: *salir de casa*, *tomar el tren*."}
  es.a2.unit105.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Before going out, I have breakfast. Before eating, I wash the fruit. Before sleeping, I read a book."}
  es.a2.unit105.lesson02.teach.gn_despues: {"title": "Después de + infinitive", "gloss": "After having dinner, Elena takes the dog out. After working, Mateo goes out on his bike. After eating, I read.", "note": "*Después de* + infinitive says what happens afterwards. It works like *antes de*: the verb after *de* stays in the infinitive."}
  es.a2.unit105.lesson02.teach.gn_contraste: {"title": "Before and after", "gloss": "Before eating, I wash the fruit. After eating, I read a book.", "note": "The same action can have a before and an after. Do not mix them: *antes de* is first, *después de* is later."}
  es.a2.unit105.lesson02.teach.palabras: {"title": "After the day", "gloss": "to take the dog out / to work / to arrive / to have a coffee / afterwards", "note": "*Sacar al perro* is to take the dog out for a walk. Notice *al* = *a* + *el*.", "example_gloss": ["After having dinner, Elena takes the dog out.", "After working, Mateo goes out on his bike.", "After getting home, I have a coffee.", "Afterwards, Elena sleeps."]}
  es.a2.unit105.lesson02.teach.gn_orden: {"title": "Last position", "gloss": "Elena takes the dog out after having dinner. Mateo goes out on his bike after working.", "note": "Like *antes de*, the *después de* part can come at the end without a comma."}
  es.a2.unit105.lesson02.teach.frases: {"title": "Three sentences", "gloss": "After having dinner, I take the dog out. After working, I go out on my bike. After arriving, I have a coffee."}
  es.a2.unit105.lesson03.teach.gn_cuando: {"title": "Cuando + present", "gloss": "When I get home, I have dinner. When Elena arrives at the station, she calls Mateo. When it rains, Mateo does not go out on his bike.", "note": "*Cuando* introduces a time that is usual or planned. Both verbs are in the present. Unlike *antes de*, the verb after *cuando* is conjugated and has a subject."}
  es.a2.unit105.lesson03.teach.gn_pregunta: {"title": "Cuándo and cuando", "gloss": "When do you have dinner? I have dinner when I get home. When does Elena call? She calls when she arrives.", "note": "The question word has an accent: *¿cuándo?*. In the answer, *cuando* has no accent."}
  es.a2.unit105.lesson03.teach.gn_contraste: {"title": "Two ways", "gloss": "After arriving, I have dinner. When I arrive, I have dinner.", "note": "If the subject is the same, you can use *después de* + infinitive. With *cuando* you conjugate the verb: *cuando llego*."}
  es.a2.unit105.lesson03.teach.palabras: {"title": "The station", "gloss": "the station / to arrive / when / the bike", "note": "*Llego* is I arrive. *Llega* is he or she arrives.", "example_gloss": ["When I arrive at the station, I take the train.", "Elena calls Mateo when she gets home.", "When it rains, I do not go out.", "When does the train arrive?"]}
  es.a2.unit105.lesson03.teach.frases: {"title": "Three sentences", "gloss": "When I get home, I have dinner. When it rains, I do not go out. When does the train arrive?"}
  es.a2.unit105.lesson04.teach.gn_orden: {"title": "Four steps", "gloss": "First I have breakfast. Then I leave home. After that I take the train. Finally I arrive at work.", "note": "*Primero*, *luego*, *después* and *por último* put steps in order. *Luego* and *después* both mean then or afterwards."}
  es.a2.unit105.lesson04.teach.gn_receta: {"title": "A simple recipe", "gloss": "First I wash the tomatoes. Then I cut the tomatoes. After that I add oil. Finally I eat the salad.", "note": "The same words work for a recipe: one verb per step in the present."}
  es.a2.unit105.lesson04.teach.gn_mezcla: {"title": "Mixing the patterns", "gloss": "First I have breakfast. Before going out, I close the window. When I arrive at the station, I take the train.", "note": "In a longer sequence you can mix the sequencing words with *antes de*, *después de* and *cuando*."}
  es.a2.unit105.lesson04.teach.palabras: {"title": "Order words", "gloss": "first / then / after that / finally / the tomatoes / the oil / the salad", "note": "*Luego* can also mean later, but here it means then.", "example_gloss": ["First I wash the tomatoes.", "Then I cut the salad.", "After that I add oil.", "Finally I arrive at the office."]}
  es.a2.unit105.lesson04.teach.frases: {"title": "Three sentences", "gloss": "First I have breakfast. Then I go out. Finally I arrive at work."}
  es.a2.unit105.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "this / the day / the eight o'clock train / to start working", "note": "*Mi día* is my day. *El tren de las ocho* is the train at eight.", "example_gloss": ["This is my day.", "I take the eight o'clock train.", "I start working at nine.", "And your day?"]}
  es.a2.unit105.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "Before leaving home, I close the window. After arriving at work, I have a coffee.", "note": "In the message, look for the order words and the time clauses and put the steps in order."}
  es.a2.unit105.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. This is my day. First I have breakfast and take the dog out. Before leaving home, I close the window. When I arrive at the station, I take the eight o'clock train. After arriving at work, I have a coffee. Finally, I start working. And your day?", "note": "Notice the order words and the time clauses.", "glosses": {"día": "day", "perro": "dog", "ventana": "window", "estación": "station", "café": "coffee"}}
  es.a2.unit105.lesson06.teach.d1: {"title": "Mateo asks", "gloss": "Mateo: Hi, Elena. What do you do in the morning before going out?"}
  es.a2.unit105.lesson06.teach.d2: {"title": "Elena begins", "gloss": "Elena: First I have breakfast and take the dog out. Then I close the window."}
  es.a2.unit105.lesson06.teach.d3: {"title": "Mateo asks about the station", "gloss": "Mateo: And when you arrive at the station?"}
  es.a2.unit105.lesson06.teach.d4: {"title": "Elena answers", "gloss": "Elena: When I arrive at the station, I take the eight o'clock train."}
  es.a2.unit105.lesson06.teach.d5: {"title": "Mateo asks about work", "gloss": "Mateo: And after arriving at work?"}
  es.a2.unit105.lesson06.teach.d6: {"title": "Elena finishes", "gloss": "Elena: After arriving, I have a coffee. Finally, I start working."}
