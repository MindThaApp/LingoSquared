course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on reasons, order, purpose, conditions, indirect questions and passing on messages."
  learning_goal: "Put events in order in Spanish with antes de, después de, cuando and sequencing words."
units:
  es.a2.unit105.antes_y_despues: {"title": "Before and After", "description": "Order daily sequences and travel steps with antes de, después de, cuando and primero, luego, por último."}
