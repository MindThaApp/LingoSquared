answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Spanish with the right tense for each situation."
units:
  es.a2.unit97.ya_habia_pasado: {"title": "It Had Already Happened", "description": "Explain that something had already happened before a certain moment, such as a train that had left before you arrived, with the pluperfect."}
lessons:
  es.a2.unit97.lesson01.el_tren_ya_habia_salido: {"title": "The Train Had Already Left"}
  es.a2.unit97.lesson02.habia_hecho_habia_visto: {"title": "I Had Done, I Had Seen"}
  es.a2.unit97.lesson03.cuando_llegue: {"title": "When I Arrived"}
  es.a2.unit97.lesson04.habia_perdido_las_llaves: {"title": "I Had Lost the Keys"}
  es.a2.unit97.lesson05.el_mensaje_de_elena: {"title": "Elena's Message"}
  es.a2.unit97.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit97.lesson01.teach.gn_habia: {"title": "Haber in the past: había", "gloss": "I had, you had, he had, she had, we had, they had", "note": "The pluscuamperfecto is built with *había* (a past form of *haber*) plus a participle. Notice that *yo*, *él* and *ella* all use *había*, so the subject often has to come from context."}
  es.a2.unit97.lesson01.teach.gn_participio: {"title": "The participle again", "gloss": "to leave, left. to arrive, arrived. to eat, eaten. to look for, looked for", "note": "You already know the participle: -ado for -ar verbs, -ido for -er and -ir verbs. It does not change for gender or number."}
  es.a2.unit97.lesson01.teach.palabras: {"title": "Key words", "gloss": "the train / the station / already / not yet", "note": "*Ya* and *todavía no* usually stand before *había*.", "example_gloss": ["The train had already left.", "Elena had already arrived.", "Mateo had not eaten yet.", "We had arrived at the station."]}
  es.a2.unit97.lesson01.teach.gn_sentido: {"title": "What it means", "gloss": "The train had already left. Elena had already arrived.", "note": "*Había* + participle says that something was finished before another moment in the past. Here the other moment is understood from the story, for example the moment you arrived."}
  es.a2.unit97.lesson01.teach.gn_orden: {"title": "Word order", "gloss": "Elena had already eaten. I had already eaten. They had left.", "note": "*Había* and the participle stay together. *Ya* comes before *había*. If the subject is clear, Spanish often drops it."}
  es.a2.unit97.lesson01.teach.frases: {"title": "Three sentences", "gloss": "The train had already left. They had arrived. I had already eaten."}
  es.a2.unit97.lesson02.teach.gn_irregulares: {"title": "Irregular participles", "gloss": "to do, done. to see, seen. to put, put. to write, written. to go, gone. to come back, come back. to open, opened", "note": "These participles are irregular, but they work with *había* just as they do with *he*: *había hecho*, *había visto*."}
  es.a2.unit97.lesson02.teach.gn_perdido: {"title": "A regular one to add", "gloss": "to lose, lost. to find, found", "note": "These two are regular: *perdido* and *encontrado*. You will use them for lost things."}
  es.a2.unit97.lesson02.teach.cosas: {"title": "Things", "gloss": "dinner / the phone / the door / the message / the table", "note": "*El móvil* is the usual word for a mobile phone in Spain; in Latin America people often say *el celular*.", "example_gloss": ["Mateo had made dinner.", "Elena had written the message.", "I had put the phone on the table.", "They had opened the door."]}
  es.a2.unit97.lesson02.teach.gn_corto: {"title": "Short sentences", "gloss": "I had already seen the message. I had not made dinner yet.", "note": "A short sentence is enough: *ya* or *todavía no*, *había*, participle, and the object."}
  es.a2.unit97.lesson02.teach.frases: {"title": "Three sentences", "gloss": "She had come back. I had gone. They had made dinner."}
  es.a2.unit97.lesson03.teach.indefinido: {"title": "The later event", "gloss": "I arrived / he or she arrived / I left / it rang", "note": "These are forms of the simple past (the preterite). Learn them as chunks for now: they name the later event, the moment you are looking back from.", "example_gloss": ["When I arrived, Mateo had already eaten.", "Elena arrived at nine.", "I left home at eight.", "The phone rang."]}
  es.a2.unit97.lesson03.teach.gn_cuando: {"title": "Cuando + simple past + ya había", "gloss": "When I arrived, the train had already left. The train had already left when I arrived.", "note": "The simple past (*llegué*) names the later moment. *Había salido* names the earlier event. The two parts can go in either order."}
  es.a2.unit97.lesson03.teach.gn_contraste: {"title": "Pluperfect or perfect?", "gloss": "Now I have arrived. When I arrived, the train had already left.", "note": "*He llegado* links to the present (now). *Había salido* looks back from a moment in the past. Use the perfect for now, the pluperfect for before a past moment."}
  es.a2.unit97.lesson03.teach.gn_todavia: {"title": "Ya había or todavía no había", "gloss": "When I arrived, Mateo had already eaten. When I arrived, Mateo had not eaten yet.", "note": "*Ya había* means it had happened. *Todavía no había* means it had not happened yet at that moment."}
  es.a2.unit97.lesson03.teach.gn_antes: {"title": "Antes de", "gloss": "Elena had left before nine.", "note": "*Antes de* + a time says the earlier event happened before that time. It is a good partner for *había* + participle."}
  es.a2.unit97.lesson03.teach.frases: {"title": "Three sentences", "gloss": "When Elena arrived, I had already left. I had already eaten when the phone rang. I had not left yet."}
  es.a2.unit97.lesson04.teach.perdido: {"title": "Lost and found", "gloss": "to lose / to look for / to find / to buy / the keys / the ticket", "note": "These verbs fit a missed-train or lost-item story.", "example_gloss": ["Elena had lost the keys.", "Mateo had bought the ticket.", "I had looked for the phone.", "They had found the keys."]}
  es.a2.unit97.lesson04.teach.gn_mi_historia: {"title": "Telling a mishap", "gloss": "When I arrived at the station, the train had already left. I had lost the keys.", "note": "A short mishap story needs only two or three sentences: the later moment with the simple past, and what had already happened with *había* + participle."}
  es.a2.unit97.lesson04.teach.gn_cuando_final: {"title": "Cuando at the end", "gloss": "Mateo had already eaten when Elena arrived.", "note": "The *cuando* part can come at the end. The tenses do not change: *había comido* is earlier, *llegó* is later."}
  es.a2.unit97.lesson04.teach.gn_todavia_salir: {"title": "Not yet at that moment", "gloss": "When I left, Mateo had not arrived yet. I had not bought the ticket yet.", "note": "*Todavía no había* + participle says something had not happened yet at the moment you are talking about."}
  es.a2.unit97.lesson04.teach.frases: {"title": "Three sentences", "gloss": "I had lost the keys. Mateo had bought the ticket. Elena had already left."}
  es.a2.unit97.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "also, besides / but / the dog / the bed / I came back", "note": "*Volví* is the simple past of *volver*, used for the later moment. *Además* adds one more thing.", "example_gloss": ["I left home, but I arrived late.", "Besides, I had lost the keys.", "The dog is in the bed.", "When I came back home, Mateo had already left."]}
  es.a2.unit97.lesson05.teach.gn_repaso: {"title": "Two moments", "gloss": "When I arrived, the train had already left. When I came back, my dog had already found the phone.", "note": "In the message, each *cuando* sentence gives a later moment and an earlier event. Look for *había* + participle."}
  es.a2.unit97.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi Mateo. What a day! I left home at eight, but when I arrived at the station, the train had already left. Besides, I had lost my phone. When I came back home, my dog had already found the phone in the bed. And you? Had you already arrived at the office?", "note": "Notice that each *cuando* gives a later moment, and *había* + participle gives what had already happened.", "glosses": {"día": "day", "además": "besides", "perro": "dog", "cama": "bed", "volví": "I came back"}}
  es.a2.unit97.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. What happened? You have arrived very late."}
  es.a2.unit97.lesson06.teach.d2: {"title": "Mateo explains", "gloss": "Mateo: Sorry, Elena. When I arrived at the station, the train had already left."}
  es.a2.unit97.lesson06.teach.d3: {"title": "Elena says what she had done", "gloss": "Elena: Oh, what bad luck. I had already made dinner when the phone rang."}
  es.a2.unit97.lesson06.teach.d4: {"title": "Mateo reacts", "gloss": "Mateo: You had already made dinner? When I left the office, I had not eaten yet."}
  es.a2.unit97.lesson06.teach.d5: {"title": "Elena offers", "gloss": "Elena: Well, I had already set the table. Do you want to eat?"}
  es.a2.unit97.lesson06.teach.d6: {"title": "Mateo accepts", "gloss": "Mateo: Yes, please. Thank you, Elena!"}
exercises:
  es.a2.unit97.lesson01.exercise01.elige_tren: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "El tren ya había salido.", "distractors": ["El tren ya había salir.", "El tren ya habías salido.", "El tren ya había salidado."], "accepted_answers": [{"value": "El tren ya había salido.", "status": "correct"}], "feedback": "*Había* + *salido*: the participle of *salir* is *salido*."}
  es.a2.unit97.lesson01.exercise02.elige_comido: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Ya habíamos comido.", "distractors": ["Ya habíamos comer.", "Ya habían comido.", "Ya habíamos comiendo."], "accepted_answers": [{"value": "Ya habíamos comido.", "status": "correct"}], "feedback": "*Nosotros* takes *habíamos*, and *comer* gives *comido*."}
  es.a2.unit97.lesson01.exercise03.une_formas: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "yo había llegado", "right": "I had arrived"}, {"left": "tú habías comido", "right": "you had eaten"}, {"left": "ella había salido", "right": "she had left"}, {"left": "nosotros habíamos llegado", "right": "we had arrived"}, {"left": "ellos habían salido", "right": "they had left"}, {"left": "el tren", "right": "the train"}, {"left": "la estación", "right": "the station"}, {"left": "ya", "right": "already"}], "status": "correct"}], "feedback": "Each subject has its own form of *haber*."}
  es.a2.unit97.lesson01.exercise04.ordena_tren: {"instruction": "Put the words in order to say 'The train had already left.'", "correct_option": "El tren ya había salido", "accepted_answers": [{"value": "El tren ya había salido", "status": "correct"}], "feedback": "*Ya* comes before *había*, and *había* before the participle."}
  es.a2.unit97.lesson01.exercise05.completa_habiamos: {"instruction": "Complete with the past form of *haber* for *nosotros*.", "correct_option": "habíamos", "accepted_answers": [{"value": "habíamos", "status": "correct"}], "feedback": "*Nosotros ya habíamos llegado*: *nosotros* takes *habíamos*."}
  es.a2.unit97.lesson01.exercise06.traduce_comido: {"instruction": "Translate into Spanish. Use *había* + participle.", "accepted_answers": [{"value": "Ya había comido.", "status": "correct"}, {"value": "Ya había comido", "status": "correct"}, {"value": "Yo ya había comido.", "status": "correct"}, {"value": "Yo ya había comido", "status": "correct"}, {"value": "Yo había comido ya.", "status": "correct"}, {"value": "Yo había comido ya", "status": "correct"}, {"value": "Había comido ya.", "status": "correct"}, {"value": "Había comido ya", "status": "correct"}], "feedback": "*Ya había comido* = I had already eaten."}
  es.a2.unit97.lesson01.exercise07.escribe_llegado: {"instruction": "Write the requested sentence with *había* + *llegado*.", "correct_option": "Elena ya había llegado.", "accepted_answers": [{"value": "Elena ya había llegado.", "status": "correct"}, {"value": "Elena ya había llegado", "status": "correct"}, {"value": "Ya había llegado Elena.", "status": "correct"}, {"value": "Ya había llegado Elena", "status": "correct"}, {"value": "Elena había llegado ya.", "status": "correct"}, {"value": "Elena había llegado ya", "status": "correct"}], "feedback": "*Elena ya había llegado* = Elena had already arrived."}
  es.a2.unit97.lesson02.exercise01.elige_hecho: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo había hecho la cena.", "distractors": ["Mateo había hacido la cena.", "Mateo había hace la cena.", "Mateo habías hecho la cena."], "accepted_answers": [{"value": "Mateo había hecho la cena.", "status": "correct"}], "feedback": "The participle of *hacer* is irregular: *hecho*."}
  es.a2.unit97.lesson02.exercise02.elige_escrito: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Yo había escrito el mensaje.", "distractors": ["Yo había escribido el mensaje.", "Yo había escribir el mensaje.", "Yo habíamos escrito el mensaje."], "accepted_answers": [{"value": "Yo había escrito el mensaje.", "status": "correct"}], "feedback": "*Escribir* gives *escrito*, and *yo* takes *había*."}
  es.a2.unit97.lesson02.exercise03.une_participios: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "había hecho", "right": "had done / made"}, {"left": "había visto", "right": "had seen"}, {"left": "había puesto", "right": "had put"}, {"left": "había escrito", "right": "had written"}, {"left": "había ido", "right": "had gone"}, {"left": "había vuelto", "right": "had come back"}, {"left": "había abierto", "right": "had opened"}, {"left": "había perdido", "right": "had lost"}], "status": "correct"}], "feedback": "Seven irregular participles and one regular one."}
  es.a2.unit97.lesson02.exercise04.ordena_mensaje: {"instruction": "Put the words in order to say 'Elena had already written the message.'", "correct_option": "Elena ya había escrito el mensaje", "accepted_answers": [{"value": "Elena ya había escrito el mensaje", "status": "correct"}], "feedback": "*Había escrito*: the participle of *escribir* is *escrito*."}
  es.a2.unit97.lesson02.exercise05.completa_abierto: {"instruction": "Complete with the participle of *abrir*.", "correct_option": "abierto", "accepted_answers": [{"value": "abierto", "status": "correct"}], "feedback": "*Mateo ya había abierto la puerta*: the participle of *abrir* is *abierto*."}
  es.a2.unit97.lesson02.exercise06.traduce_hecho: {"instruction": "Translate into Spanish. Use *habían* + *hecho*.", "accepted_answers": [{"value": "Ellos ya habían hecho la cena.", "status": "correct"}, {"value": "Ellos ya habían hecho la cena", "status": "correct"}, {"value": "Ya habían hecho la cena.", "status": "correct"}, {"value": "Ya habían hecho la cena", "status": "correct"}, {"value": "Ellos habían hecho ya la cena.", "status": "correct"}, {"value": "Ellos habían hecho ya la cena", "status": "correct"}, {"value": "Habían hecho ya la cena.", "status": "correct"}, {"value": "Habían hecho ya la cena", "status": "correct"}], "feedback": "*Ellos ya habían hecho la cena*: *ellos* takes *habían*."}
  es.a2.unit97.lesson02.exercise07.escribe_puesto: {"instruction": "Write the requested sentence with *había* + *puesto*.", "correct_option": "Yo había puesto el móvil en la mesa.", "accepted_answers": [{"value": "Yo había puesto el móvil en la mesa.", "status": "correct"}, {"value": "Yo había puesto el móvil en la mesa", "status": "correct"}, {"value": "Había puesto el móvil en la mesa.", "status": "correct"}, {"value": "Había puesto el móvil en la mesa", "status": "correct"}], "feedback": "*Yo había puesto el móvil en la mesa*: *poner* gives *puesto*."}
  es.a2.unit97.lesson03.exercise01.elige_cuando: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Cuando llegué, el tren ya había salido.", "distractors": ["Cuando llegué, el tren ya habías salido.", "Cuando llegué, el tren ya había salir.", "Cuando llegué, el tren ya habíamos salido."], "accepted_answers": [{"value": "Cuando llegué, el tren ya había salido.", "status": "correct"}], "feedback": "*Llegué* is the later moment; *ya había salido* is the earlier event."}
  es.a2.unit97.lesson03.exercise02.elige_ahora: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Ahora he llegado.", "distractors": ["Ahora había llegado.", "Ahora he llegar.", "Ahora han llegado."], "accepted_answers": [{"value": "Ahora he llegado.", "status": "correct"}], "feedback": "For *now* use the perfect: *he llegado*."}
  es.a2.unit97.lesson03.exercise03.une_contraste: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "Cuando llegué", "right": "When I arrived"}, {"left": "Cuando llegó Elena", "right": "When Elena arrived"}, {"left": "ya había salido", "right": "had already left"}, {"left": "todavía no había salido", "right": "had not left yet"}, {"left": "he llegado", "right": "I have arrived"}, {"left": "antes de las nueve", "right": "before nine"}, {"left": "sonó", "right": "it rang"}, {"left": "salí", "right": "I left"}], "status": "correct"}], "feedback": "Tell the later moment with the simple past and the earlier event with *había*."}
  es.a2.unit97.lesson03.exercise04.ordena_cuando: {"instruction": "Put the words in order to say 'When I arrived, the train had already left.'", "correct_option": "Cuando llegué el tren ya había salido", "accepted_answers": [{"value": "Cuando llegué el tren ya había salido", "status": "correct"}], "feedback": "*Cuando llegué* first, then *el tren ya había salido*."}
  es.a2.unit97.lesson03.exercise05.completa_habia: {"instruction": "Complete with the past form of *haber*. Mateo had already eaten when you arrived.", "correct_option": "había", "accepted_answers": [{"value": "había", "status": "correct"}], "feedback": "*Mateo ya había comido*: the earlier event uses *había* + participle."}
  es.a2.unit97.lesson03.exercise06.traduce_todavia: {"instruction": "Translate into Spanish. Use *cuando llegué* and *todavía no había*.", "accepted_answers": [{"value": "Cuando llegué, Mateo todavía no había comido.", "status": "correct"}, {"value": "Cuando llegué, Mateo todavía no había comido", "status": "correct"}, {"value": "Cuando llegué, Mateo no había comido todavía.", "status": "correct"}, {"value": "Cuando llegué, Mateo no había comido todavía", "status": "correct"}, {"value": "Cuando llegué, todavía no había comido Mateo.", "status": "correct"}, {"value": "Cuando llegué, todavía no había comido Mateo", "status": "correct"}], "feedback": "*Cuando llegué, Mateo todavía no había comido.*"}
  es.a2.unit97.lesson03.exercise07.escribe_llegado: {"instruction": "Write the sentence with *cuando llegó Elena* and *ya había salido*.", "correct_option": "Cuando llegó Elena, yo ya había salido.", "accepted_answers": [{"value": "Cuando llegó Elena, yo ya había salido.", "status": "correct"}, {"value": "Cuando llegó Elena, yo ya había salido", "status": "correct"}, {"value": "Cuando llegó Elena, ya había salido.", "status": "correct"}, {"value": "Cuando llegó Elena, ya había salido", "status": "correct"}, {"value": "Cuando Elena llegó, yo ya había salido.", "status": "correct"}, {"value": "Cuando Elena llegó, yo ya había salido", "status": "correct"}, {"value": "Cuando Elena llegó, ya había salido.", "status": "correct"}, {"value": "Cuando Elena llegó, ya había salido", "status": "correct"}], "feedback": "*Cuando llegó Elena, yo ya había salido.*"}
  es.a2.unit97.lesson04.exercise01.elige_perdido: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena había perdido las llaves.", "distractors": ["Elena había perdida las llaves.", "Elena había perder las llaves.", "Elena habíamos perdido las llaves."], "accepted_answers": [{"value": "Elena había perdido las llaves.", "status": "correct"}], "feedback": "*Perder* gives *perdido*, and *Elena* takes *había*."}
  es.a2.unit97.lesson04.exercise02.elige_comido: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mateo ya había comido cuando llegó Elena.", "distractors": ["Mateo ya había comer cuando llegó Elena.", "Mateo ya habías comido cuando llegó Elena.", "Mateo ya había comido cuando llegar Elena."], "accepted_answers": [{"value": "Mateo ya había comido cuando llegó Elena.", "status": "correct"}], "feedback": "*Había comido* is the earlier event; *llegó Elena* is the later moment."}
  es.a2.unit97.lesson04.exercise03.une_frases: {"instruction": "Match each Spanish sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Había perdido las llaves.", "right": "I had lost the keys."}, {"left": "Mateo había encontrado las llaves.", "right": "Mateo had found the keys."}, {"left": "Habían comprado el billete.", "right": "They had bought the ticket."}, {"left": "Habíamos llegado a la estación.", "right": "We had arrived at the station."}, {"left": "Elena ya había buscado el móvil.", "right": "Elena had already looked for the phone."}, {"left": "El tren ya había salido.", "right": "The train had already left."}, {"left": "Yo todavía no había comprado el billete.", "right": "I had not bought the ticket yet."}], "status": "correct"}], "feedback": "Each sentence uses *había* + participle."}
  es.a2.unit97.lesson04.exercise04.ordena_cuando: {"instruction": "Put the words in order to say 'Mateo had already eaten when Elena arrived.'", "correct_option": "Mateo ya había comido cuando llegó Elena", "accepted_answers": [{"value": "Mateo ya había comido cuando llegó Elena", "status": "correct"}], "feedback": "The earlier event comes first, then *cuando llegó Elena*."}
  es.a2.unit97.lesson04.exercise05.completa_salido: {"instruction": "Complete with the participle of *salir*.", "correct_option": "salido", "accepted_answers": [{"value": "salido", "status": "correct"}], "feedback": "*El tren ya había salido*: the participle of *salir* is *salido*."}
  es.a2.unit97.lesson04.exercise06.traduce_perdido: {"instruction": "Translate into Spanish. Use *había* + *perdido*.", "accepted_answers": [{"value": "Había perdido las llaves.", "status": "correct"}, {"value": "Había perdido las llaves", "status": "correct"}, {"value": "Yo había perdido las llaves.", "status": "correct"}, {"value": "Yo había perdido las llaves", "status": "correct"}], "feedback": "*Había perdido las llaves* = I had lost the keys."}
