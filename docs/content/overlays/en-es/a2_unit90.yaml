      status: correct
    feedback: '*Hice* (from *hacer*) is irregular: the stem changes and there is no accent. *Trabajé, cociné* and *jugué* are regular: stem + *-é*.'
  es.a2.unit90.lesson03.exercise02.listen_stayed_home:
