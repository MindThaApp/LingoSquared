teaching:
  es.a2.unit90.lesson01.teach.el_fin_de:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Fin de semana* is masculine (*el*). *El fin de semana pasado* is the natural phrase for ''last weekend'' when you tell a story about it, and it goes with the past tense.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  es.a2.unit90.lesson01.teach.sabado_domingo:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: Day names are not capitalised in Spanish unless they start a sentence.
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  es.a2.unit90.lesson01.teach.hacer_las_compras:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Hacer las compras* is the usual phrase for shopping for groceries and small errands (in Spain you will also hear *hacer la compra*). *Compras* is plural, so it takes *las*.'
    example_gloss: Every Saturday I do the shopping.
  es.a2.unit90.lesson01.teach.ir_de_visita:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Ir de visita* means to go and see people at their home; add *a casa de* + the person: *ir de visita a casa de mi tío*.'
    example_gloss: I often go and visit my uncle.
  es.a2.unit90.lesson01.teach.el_mercado_el:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*El mercado, el parque* and *el cine* are all masculine. *A* + *el* always becomes *al*: *voy al cine*.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  es.a2.unit90.lesson01.teach.trabajar_cocinar_comer:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  es.a2.unit90.lesson01.teach.que_hiciste_el:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Hiciste* is the *tú* past form of *hacer*, and it comes right after *qué*.
  es.a2.unit90.lesson01.teach.el_sabado_hice:
    title: 'The past tense: one word, no helper verb'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'To say what you did on a finished day, Spanish uses the *pretérito*: a single verb form, with no helper verb. For *yo*, regular *-ar* verbs end in *-é* (*trabajé*) and regular *-er/-ir* verbs end in *-í* (*comí*). The subject *yo* is normally left out, and the day goes first or last: *El sábado hice las compras.* Some verbs are irregular, for example *hacer → hice* and *ir → fui*. Lesson 3 explains more.'
  es.a2.unit90.lesson02.teach.caminar_montar_en:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*Jugar* is used for games and sports with a ball, and *entrenar* means to train or work out in general. *Montar en bici* is the everyday way to say you cycle.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  es.a2.unit90.lesson02.teach.trabajar_trabaje_cocinar:
    title: 'Regular past forms: stem + -é'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'Regular *-ar* verbs form the *yo* past with the stem + *-é*: *trabajar → trabajé*, *cocinar → cociné*, *caminar → caminé*. The stress falls on the last syllable, so the accent mark is required: *trabajé*, not *trabaje*. A few verbs change spelling to keep the sound: *jugar → jugué* (*gu* keeps the hard *g* before *é*). Regular *-er* and *-ir* verbs end in *-í* instead (lesson 3).'
  es.a2.unit90.lesson02.teach.entreno_entrene:
    title: The stress moves to the ending
    gloss: I exercise. I have exercised / I exercised.
    note: 'In the present the stress is on the stem (*entreno*); in the past it moves to the ending (*entrené*). Keep the accent on the final *é*: *entrené*, never *entrene*.'
  es.a2.unit90.lesson02.teach.camine_por_el:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Caminar por* + a place means walking around with no particular destination. With a destination use *ir a*: *fui al parque*.'
  es.a2.unit90.lesson02.teach.jugue_al_futbol:
    title: Playing football
    gloss: I played football.
    note: 'With sports and games, *jugar* takes *a*: *jugar al fútbol → jugué al fútbol*. *A* + *el* becomes *al*.'
  es.a2.unit90.lesson03.teach.tener_ser:
    title: To have and to be
    gloss: to have / to be
    note: '*Tener* and *ser* are two of the most useful verbs. Their past forms are irregular: *tuve* and *fui*. Spanish needs no helper verb for this past tense.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  es.a2.unit90.lesson03.teach.ver_vi_leer:
    title: Regular -í forms and irregular forms
    gloss: see → saw, read → read, sleep → slept, eat → ate, drink → drank, buy → bought (regular), do → did (irregular)
    note: 'Regular *-er/-ir* verbs end in *-í* in the *yo* past: *vi, leí, dormí, comí, bebí*. Mind the accent on *leí* and *dormí*; *vi* has none because it is one syllable. *Comprar* is an *-ar* verb: *compré*. *Hacer* is irregular: *hice*. Irregular forms must be learned as whole words.'
  es.a2.unit90.lesson03.teach.vi_una_pelicula:
    title: Watching a film
    gloss: I saw a film.
    note: '*Ver una película* is the usual way to say you watched a film, at the cinema or at home.'
  es.a2.unit90.lesson03.teach.dormi_mucho_y:
    title: Two actions in one sentence
    gloss: I slept for a long time and read a book.
    note: 'Two actions with the same subject can be joined with *y* without repeating anything: *Dormí mucho y leí un libro.* *Yo* is not needed because each ending already shows who is speaking.'
  es.a2.unit90.lesson03.teach.visite_a_mi:
    title: Visiting someone
    gloss: I visited my uncle.
    note: '*Visitar* (to visit) takes a person directly, with the personal *a*: *Visité a mi tío*. *Ir de visita a casa de mi tío* means nearly the same.'
  es.a2.unit90.lesson03.teach.vi_una_pelicula_2:
    title: One form for each verb
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'Spanish has no helper verb to choose: every verb simply has its own past form. Some are regular (*vi, me quedé*), others irregular (*fui, estuve, se hizo*). *Ir* and *ser* share the form *fui*; the sentence tells you which verb it is. *Estuve en* means ''I was at/in'' a place, and *se hizo tarde* means ''it got late'' (*hacerse* = to become).'
  es.a2.unit90.lesson03.teach.ir_fui_venir:
    title: Irregular forms to learn
    gloss: go → went, come → came, be/stay → was/stayed, be → was, become → became
    note: 'These five verbs have irregular past forms for *yo*: *fui* (*ir*), *vine* (*venir*), *estuve* (*estar*), *fui* (*ser*) and *se hizo* (*hacerse*). None of them carries an accent mark. Learn them as whole words.'
  es.a2.unit90.lesson04.teach.primero_despues:
    title: First and then
    gloss: first / after that
    note: '*Primero* and *después* put actions in order. They are the connectors you need to tell a weekend story in sequence; *luego* works like *después*.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  es.a2.unit90.lesson04.teach.primero_fui_al:
    title: 'Telling it in order: primero, después'
    gloss: First I went to the market, then I cooked.
    note: 'After *primero* or *después* the verb follows straight away, and *yo* is left out: *Después cociné.* A comma separates the two parts: *Primero fui al mercado, después cociné.*'
  es.a2.unit90.lesson04.teach.no_trabaje_no:
    title: 'Saying what you did not do: no'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'Put *no* directly before the verb: *No trabajé*. Objects and places follow the verb as usual: *No leí el libro. No fui a casa de mi tío.* A time word goes first or last: *El sábado no trabajé.* Never put *no* after the verb.'
  es.a2.unit90.lesson04.teach.no_bebi_ningun:
    title: 'Saying you had none: ningún, ninguna'
    gloss: I didn't drink any coffee. I didn't see a film. I didn't have time.
    note: 'To say ''not any'', use *no* + verb + *ningún/ninguna* + noun: *No bebí ningún café*, *No vi ninguna película*. *Ninguno* loses its *-o* before a masculine noun (*ningún café*) and becomes *ninguna* before a feminine one. With things you cannot count, such as *tiempo*, just use *no*: *No tuve tiempo.* *Tuve* is the past of *tener*.'
  es.a2.unit90.lesson04.teach.entrenaste:
    title: Elena asks about exercise
    gloss: 'Elena: Did you exercise?'
    note: 'A yes/no question has the same word order as a statement; only the question marks and the intonation change. The *tú* past of an *-ar* verb ends in *-aste*: *¿Entrenaste?*'
  es.a2.unit90.lesson04.teach.no_no_entrene:
    title: Mateo says no
    gloss: 'Mateo: No, I didn''t exercise.'
  es.a2.unit90.lesson05.teach.hola_elena_fue:
    title: A message from Nora
    gloss: Hi Elena! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Nora is telling Elena about her weekend in order: Saturday morning, afternoon and evening, then Sunday. *Por la mañana, por la tarde* and *por la noche* mark the parts of the day, and *finde* is the casual short form of *fin de semana*.'
    glosses:
      Hola: hi
      tranquilo: quiet, calm
      finde: weekend (casual short form of fin de semana)
      Fue: was (past of ser, from fue)
      mañana: morning (por la mañana)
      mercado: market
      pan: bread
      compré: bought (I, past of comprar)
      tarde: afternoon (por la tarde)
      parque: park
      caminé: walked (I, past of caminar)
      noche: evening (por la noche)
      cociné: cooked (I, past of cocinar)
      'no': not
      entrené: exercised (I, past of entrenar)
      ninguna: no, not any (ninguna, feminine)
      película: film
      vi: saw (I, past of ver)
      domingo: Sunday
      quedé: 'stayed (I, past of quedarse: me quedé)'
      mucho: long, for a long time
      Dormí: slept (I, past of dormir)
      libro: book
      leí: read (I, past of leer)
  es.a2.unit90.lesson06.teach.hola_mateo_que:
    title: Elena asks Mateo about his weekend
    gloss: 'Elena: Hi Mateo! What did you do last weekend?'
  es.a2.unit90.lesson06.teach.el_sabado_fui:
    title: Mateo describes Saturday
    gloss: 'Mateo: On Saturday I went to my uncle''s in Barcelona. I ate at my uncle''s.'
    note: '*A casa de mi tío* is the direction (going to his house) and *en su casa* is the location (at his house): *fui a casa de mi tío*, *comí en su casa*.'
  es.a2.unit90.lesson06.teach.que_bien_y:
    title: Elena asks about Sunday
    gloss: 'Elena: Nice! And Sunday?'
  es.a2.unit90.lesson06.teach.el_domingo_me:
    title: Mateo describes Sunday and asks back
    gloss: 'Mateo: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  es.a2.unit90.lesson06.teach.fui_a_casa:
    title: Elena describes her weekend
    gloss: 'Elena: I went to my parents''. I didn''t do any shopping, but I cooked.'
