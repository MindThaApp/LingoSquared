teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *leer* (to read), *hacer deporte* (to exercise or play sports), and *cocinar* (to cook).'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Free time
    gloss: free time
    note: '*El tiempo libre* is a masculine noun phrase and the key phrase for talking about hobbies.'
    example_gloss: In my free time, I like to read.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Me gusta leer* (I like to read) uses *gustar* + infinitive; *me gusta* stays the same for any activity.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobby verbs: *escuchar música* (to listen to music), *dibujar* (to draw), and *jugar videojuegos* (to play video games).'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Escuchar* takes its object directly, with no preposition: *escuchar música*, unlike English "listen to".'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Con amigos* (with friends) reuses the preposition *con* from earlier lessons.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'The four core frequency adverbs: *siempre* (always), *a menudo* (often), *a veces* (sometimes), *nunca* (never). They usually go before the verb or at the start of the sentence.'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Cada semana* and *cada fin de semana* both mean "every"; *cada* never changes form.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada never changes
    gloss: 'Cada stays the same: cada semana, cada fin de semana.'
    note: '*Cada* never changes: it is the same before feminine (*semana*) and masculine (*fin de semana*) nouns.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena brings up hobbies
    gloss: 'Elena: We often walk together. But what else do you do in your free time, Mateo?'
    note: '*A menudo paseamos juntos* (we often walk together): *paseamos* is the *nosotros* form of *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Mateo's hobbies
    gloss: 'Mateo: I like cooking, at home too. And I exercise often.'
    note: '*También en casa* (at home too) shows that Mateo cooks for fun, not just at his restaurant job.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena is surprised
    gloss: 'Elena: You cook at home too? You already cook all day at your job!'
    note: '*Todo el día* (all day) emphasizes how much Mateo already cooks at work.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo explains
    gloss: 'Mateo: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Cocinar me parece relajante* literally means "cooking seems relaxing to me": *me parece* + adjective is a natural way to give an opinion.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Elena's hobbies
    gloss: 'Elena: I like reading and I often listen to music.'
    note: Combines two hobby verbs from earlier lessons in one sentence with *y* (and).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo asks about gaming
    gloss: 'Mateo: Do you also game?'
    note: A short yes/no question using *jugar videojuegos* from lesson 2; *tú también* (you too) uses the informal *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena answers
    gloss: 'Elena: No, I never game. But I sometimes draw!'
    note: '*Nunca* (never) and *a veces* (sometimes) from lesson 3, contrasted in one answer.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Comparing hobbies
    gloss: Mateo and I often walk together. But we also have other hobbies. Mateo likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Elena's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      paseamos: walk
      menudo: often
      juntos: together
      otras: other
      cocinar: cooks
      gusta: likes to
      casa: at home
      deporte: exercises
      leer: read
      escucho: listen
      música: music
      dibujo: draw
      veces: sometimes
      videojuegos: play video games
      nunca: never
      libre: free
      tiempo: time
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo asks about the weekend
    gloss: 'Mateo: What are you doing this weekend?'
    note: '*Este fin de semana* (this weekend) uses *este* with the masculine noun *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena is undecided
    gloss: 'Elena: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Quiero salir* (I want to go out) is a common way to say you want to leave the house.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo suggests a plan
    gloss: 'Mateo: Shall we walk together? I''ll cook for us afterward.'
    note: '*Después* (afterward) is a sequencing word: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena agrees
    gloss: 'Elena: Good idea! I like both walking and cooking.'
    note: '*Las dos cosas* (both things) shows Elena likes two things equally, not one over the other.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo confirms
    gloss: 'Mateo: Perfect. Then I''ll see you Saturday!'
    note: A friendly closing line confirming the plan for *el sábado* (Saturday); Spanish uses *el* before a specific day.
