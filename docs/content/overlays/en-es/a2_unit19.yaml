teaching:
  es.a2.unit19.lesson01.teach.el_dolor: {title: "The headache", gloss: "the headache", note: "*El dolor de cabeza* -- a headache specifically, *dolor* alone means pain in general.", example_gloss: "I have a terrible headache."}
  es.a2.unit19.lesson01.teach.la_fiebre: {title: "The fever", gloss: "the fever", note: "*La fiebre* -- an elevated body temperature.", example_gloss: "I think I have a fever."}
  es.a2.unit19.lesson01.teach.sentirse_mal: {title: "To feel unwell", gloss: "to feel unwell", note: "*Sentirse mal* -- a general phrase for feeling sick, before naming a specific symptom.", example_gloss: "I feel unwell today."}
  es.a2.unit19.lesson01.teach.me_duele_cabeza: {title: "Describe the symptom", gloss: "My head has been hurting since yesterday.", note: "*Me duele* (see the grammar note below) + duration."}
  es.a2.unit19.lesson01.teach.doler_note: {title: "Doler: works like gustar", gloss: "Why me duele la cabeza isn't \"I hurt my head.\"", note: "The verb agrees with the body part: *me duele la cabeza* (singular), but *me duelen los pies* (my feet hurt, plural)."}

  es.a2.unit19.lesson02.teach.desde_cuando_le_duele: {title: "Ask since when", gloss: "Since when has your head been hurting?", note: "Reuses the *desde cuándo* pattern from an earlier unit, now applied to a symptom's duration."}
  es.a2.unit19.lesson02.teach.tiene_fiebre: {title: "Ask about fever", gloss: "Do you have a fever too?", note: "A natural doctor follow-up question, formal *tiene* (usted form)."}
  es.a2.unit19.lesson02.teach.un_poco_fiebre: {title: "Answer about fever", gloss: "Yes, I have a bit of a fever.", note: "*Un poco de* (a bit of) -- softens the severity, distinct from a high fever."}

  es.a2.unit19.lesson03.teach.el_consultorio: {title: "The doctor's office", gloss: "the doctor's office", note: "*El consultorio* -- where the appointment takes place.", example_gloss: "I arrived at the doctor's office on time."}
  es.a2.unit19.lesson03.teach.que_le_pasa: {title: "Ask what's wrong", gloss: "Good morning, what's wrong?", note: "*¿Qué le pasa?* -- the standard formal-register doctor's opening question."}
  es.a2.unit19.lesson03.teach.doctora_entiendo: {title: "Acknowledge the answer", gloss: "I understand, thank you for explaining.", note: "*Entiendo* (I understand) -- a natural acknowledgment before giving advice."}

  es.a2.unit19.lesson04.teach.le_recomiendo_descanse: {title: "Give a recommendation", gloss: "I recommend that you rest and take these pills.", note: "*Le recomiendo que* + SUBJUNCTIVE (see the grammar note below)."}
  es.a2.unit19.lesson04.teach.es_importante_agua: {title: "Give another instruction", gloss: "It's important that you drink a lot of water.", note: "Reuses the *es importante que* + subjunctive pattern from an earlier unit, applied to a new verb."}
  es.a2.unit19.lesson04.teach.recomiendo_note: {title: "Recomendar que + subjunctive", gloss: "Why a recommendation verb triggers the subjunctive.", note: "*Le recomiendo que descanse* (I recommend that you rest) uses *que* + subjunctive. *Recomendar* can also take a plain infinitive with the same meaning -- *le recomiendo descansar* -- but this unit practices the *que* + subjunctive pattern."}

  es.a2.unit19.lesson05.teach.resumen_reading:
    title: "The visit summary"
    gloss: "Patient: Elena García. Symptom: headache and mild fever since yesterday. Recommendation: rest, take the prescribed pills, and drink a lot of water. Next appointment: only if symptoms continue after three days."
    note: "A realistic after-visit summary using this unit's own vocabulary."
    glosses:
      Paciente: "patient"
      Síntoma: "symptom"
      dolor: "pain / ache"
      cabeza: "head"
      fiebre: "fever"
      leve: "mild"
      desde: "since"
      ayer: "yesterday"
      Recomendación: "recommendation"
      descansar: "to rest"
      tomar: "to take"
      pastillas: "pills"
      recetadas: "prescribed"
      beber: "to drink"
      Próxima: "next"
      síntomas: "symptoms"
      continúan: "continue (from continuar)"
  es.a2.unit19.lesson05.teach.leve_note: {title: "Leve: mild", gloss: "How leve describes symptom severity.", note: "*Leve* has the same form for masculine and feminine nouns: *fiebre leve*, *dolor leve*."}

  es.a2.unit19.lesson06.teach.line01: {title: "Ask what's wrong", gloss: "The doctor greets Elena and asks what's wrong.", note: "Reuses the doctor's opening question from earlier in this unit."}
  es.a2.unit19.lesson06.teach.line02: {title: "Describe the symptom", gloss: "Elena greets the doctor and says her head has been hurting since yesterday.", note: "Reuses the symptom description from earlier in this unit, adding *doctora* to address the doctor."}
  es.a2.unit19.lesson06.teach.line03: {title: "Ask about fever", gloss: "The doctor asks if she also has a fever.", note: "Reuses the fever question from earlier in this unit."}
  es.a2.unit19.lesson06.teach.line04: {title: "Confirm the fever", gloss: "Elena confirms she has a bit of a fever.", note: "Reuses the fever answer from earlier in this unit."}
  es.a2.unit19.lesson06.teach.line05: {title: "Give the recommendation", gloss: "The doctor understands and recommends she rest and take these pills.", note: "Reuses the recommendation from earlier in this unit: *le recomiendo que* + subjunctive."}
  es.a2.unit19.lesson06.teach.line06: {title: "Ask about a follow-up", gloss: "Elena asks if she needs another appointment.", note: "*¿Necesito otra cita?* -- a new, natural follow-up question."}
  es.a2.unit19.lesson06.teach.line07: {title: "Explain the condition", gloss: "The doctor says only if symptoms continue after three days, and adds it's important she drink a lot of water.", note: "*Solo si* (only if) sets the condition for a follow-up, then *es importante que* + subjunctive adds the water instruction from earlier in this unit."}
  es.a2.unit19.lesson06.teach.line08: {title: "Close politely", gloss: "Elena thanks the doctor.", note: "A simple, warm formal-register closing."}
  es.a2.unit19.lesson06.teach.summary_grammar: {title: "Summary", gloss: "Elena had a headache and a mild fever since yesterday. The doctor recommended that she rest and drink a lot of water.", note: "A summary in the past. After a past recommendation (*le recomendó que*), the subjunctive moves into the past too: *descanse* becomes *descansara*, *beba* becomes *bebiera*."}

