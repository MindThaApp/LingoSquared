answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is
    correct. Do not treat n as a substitute for ñ.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Describing your job, continuing Elena and Mateo's storyline during
    a break in the 22 July workshop class as they talk about their day
    jobs -- Mateo the accountant and Elena the teacher -- and agree
    they both prefer cooking together.

