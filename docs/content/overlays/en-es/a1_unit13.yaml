  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar: {title: "State a preference", gloss: "But I prefer to cook.", note: "*Prefiero* (I prefer) was already introduced in unit10; *cocinar* (to cook) is the infinitive form of this whole storyline's central activity."}
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto: {title: "Say you both prefer this", gloss: "We both prefer this.", note: "*Preferimos* is the *nosotros* form of *preferir*, used when Elena and Mateo agree together."}

  es.a1.unit13.lesson05.teach.trabajos_reading: {title: "Reading about their jobs", gloss: "Mateo works in an office in London. He's an accountant. Elena teaches at a school, also in London. She's a teacher and has twenty students. They both like their jobs, but they prefer cooking together on Tuesdays.", note: "A realistic summary of this unit's own established facts about Mateo's and Elena's day jobs."}
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note: {title: "A los dos les gusta", gloss: "How gustar extends to a plural indirect object.", note: "See the card's own text."}

  es.a1.unit13.lesson06.teach.line01: {title: "Ask about Mateo's job", gloss: "Elena asks Mateo what he does for work.", note: "Reuses lesson03's core question directly, now addressed to Mateo by name."}
  es.a1.unit13.lesson06.teach.line02: {title: "Answer with his job", gloss: "Mateo says he works in an office as an accountant.", note: "Reuses lesson03's full answer directly."}
  es.a1.unit13.lesson06.teach.line03: {title: "React and share her own job", gloss: "Elena finds it interesting and shares that she's a teacher.", note: "*Interesante* (interesting) is a new transparent cognate; the rest reuses lesson02's *soy profesora* and *enseño en una escuela*."}
  es.a1.unit13.lesson06.teach.line04: {title: "Ask if she likes teaching", gloss: "Mateo asks if she likes teaching.", note: "*¿Te gusta enseñar?* combines the established *gustar* question pattern with the infinitive *enseñar*."}
  es.a1.unit13.lesson06.teach.line05: {title: "Confirm and add a preference", gloss: "Elena says she likes it a lot, but prefers cooking with him on Tuesdays.", note: "*Contigo* (with you) is a new contracted preposition+pronoun form; *los martes* (on Tuesdays) reuses the day-of-week vocabulary from unit04."}
  es.a1.unit13.lesson06.teach.line06: {title: "Agree with the same preference", gloss: "Mateo says he also likes his job, but prefers cooking.", note: "*A mí también* reuses the emphatic agreement pattern from unit11's clothing-fitting scene."}
  es.a1.unit13.lesson06.teach.line07: {title: "Draw the conclusion", gloss: "Elena concludes they both prefer this (cooking together).", note: "*Entonces* (so/then) is a new logical connector; the rest reuses lesson04's *los dos preferimos esto* directly."}
  es.a1.unit13.lesson06.teach.line08: {title: "Confirm enthusiastically", gloss: "Mateo agrees, definitely.", note: "*Definitivamente* (definitely) is a new transparent cognate adverb closing the scene."}

