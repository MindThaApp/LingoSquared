answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on talking about the future."
  learning_goal: "Predict, guess and promise in Spanish with the simple future."
units:
  es.a2.unit98.manana_llovera: {"title": "Tomorrow It Will Rain", "description": "Predict the weather, say what will probably or possibly happen, and make a simple promise with the simple future."}
lessons:
  es.a2.unit98.lesson01.hablare_comere_vivire: {"title": "I Will Speak, I Will Eat, I Will Live"}
  es.a2.unit98.lesson02.tendre_podre_saldre: {"title": "I Will Have, I Will Be Able, I Will Go Out"}
  es.a2.unit98.lesson03.voy_a_llamar_y_llovera: {"title": "I Am Going to Call, It Will Rain"}
  es.a2.unit98.lesson04.seguro_que_te_lo_prometo: {"title": "Surely, Maybe, I Promise You"}
  es.a2.unit98.lesson05.el_mensaje_de_elena: {"title": "Elena's Message"}
  es.a2.unit98.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit98.lesson01.teach.gn_terminaciones: {"title": "Endings of the future", "gloss": "I will speak, you will speak, he will speak, she will speak, we will speak, they will speak", "note": "The futuro simple is the 'will' form. It is built on the whole infinitive: add -é, -ás, -á, -emos, -án to *hablar*. Every ending except *-emos* carries a written accent."}
  es.a2.unit98.lesson01.teach.gn_comer_vivir: {"title": "The same endings for -er and -ir", "gloss": "to eat: I will eat, you will eat, he or she will eat, we will eat, they will eat. to live: I will live, you will live, he or she will live, we will live, they will live", "note": "Verbs in -er and -ir take exactly the same endings. Nothing is dropped from the infinitive: *comer* becomes *comeré*, *vivir* becomes *viviré*."}
  es.a2.unit98.lesson01.teach.palabras: {"title": "Weather words", "gloss": "to rain / to snow / the wind / the sun / the cold / the heat", "note": "*Llover* and *nevar* are impersonal: they only use the *él/ella* form, *lloverá* and *nevará*.", "example_gloss": ["Tomorrow it will rain in Madrid.", "Tonight it will snow in the mountains.", "Tomorrow it will be sunny, but on Saturday it will be windy.", "It will be hot in Madrid and cold in the mountains."]}
  es.a2.unit98.lesson01.teach.gn_tiempo: {"title": "Weather forecast", "gloss": "Tomorrow it will rain. Tomorrow it will snow. Tomorrow it will be cold. Tomorrow it will be hot. Tomorrow it will be sunny. Tomorrow it will be windy.", "note": "A forecast uses the *él/ella* form with no subject. *Hará* and *habrá* have irregular stems: learn them as chunks now, and lesson 2 explains why."}
  es.a2.unit98.lesson01.teach.gn_sujeto: {"title": "Dropping the subject", "gloss": "Elena will speak with Mateo. She will speak with Mateo. We will eat at home. We will live in Madrid.", "note": "As in the present, the ending shows who does the action, so the subject is usually left out. *Hablará* can mean he or she, so context tells you who."}
  es.a2.unit98.lesson01.teach.frases: {"title": "Three sentences", "gloss": "Tomorrow it will rain. Tonight it will snow. It will be cold in the mountains."}
  es.a2.unit98.lesson02.teach.gn_raices: {"title": "Irregular stems", "gloss": "to do or make: I will do. to have (there is): there will be. to have: I will have. to be able: I will be able. to go out: I will go out. to come: I will come.", "note": "A few common verbs change their stem before the same endings: *har-*, *habr-*, *tendr-*, *podr-*, *saldr-*, *vendr-*. The endings stay -é, -ás, -á, -emos, -án."}
  es.a2.unit98.lesson02.teach.gn_tener_poder: {"title": "Tener and poder", "gloss": "I will have, you will have, he or she will have, we will have, they will have. I will be able, you will be able, he or she will be able, we will be able, they will be able.", "note": "Both verbs lose the vowel of the infinitive ending and add a *d*: *tener* gives *tendr-*, *poder* gives *podr-*."}
  es.a2.unit98.lesson02.teach.gn_salir_venir: {"title": "Salir and venir", "gloss": "I will go out, you will go out, he or she will go out, we will go out, they will go out. I will come, you will come, he or she will come, we will come, they will come.", "note": "The same pattern: *salir* gives *saldr-* and *venir* gives *vendr-*. Learn the stem once and the endings follow."}
  es.a2.unit98.lesson02.teach.tiempo: {"title": "Time words", "gloss": "tomorrow / tonight / on Saturday / next week", "note": "*El sábado* means 'on Saturday': Spanish uses the article where English uses 'on'. Time words can come first or last.", "example_gloss": ["Tomorrow I will have a lot of work at the office.", "Tonight Elena will go out with the dog.", "On Saturday Elena will come to my house.", "Next week I will be able to speak with Mateo."]}
  es.a2.unit98.lesson02.teach.gn_hara: {"title": "Hará and habrá", "gloss": "Tomorrow it will be cold. On Saturday it will be windy. Next week it will be hot.", "note": "*Hará* comes from *hacer* and *habrá* from *haber*. *Habrá* means 'there will be'. Both are third-person singular forms."}
  es.a2.unit98.lesson02.teach.frases: {"title": "Three sentences", "gloss": "Tomorrow I will have work. On Saturday we will go out. Elena will come tonight."}
  es.a2.unit98.lesson03.teach.gn_ir_a: {"title": "Ir a + infinitive", "gloss": "I am going to call, you are going to buy, it is going to rain, we are going to go out, they are going to come", "note": "*Ir a* + infinitive: use the present of *ir* (*voy, vas, va, vamos, van*), then *a*, then the infinitive. The infinitive does not change."}
  es.a2.unit98.lesson03.teach.palabras: {"title": "Words for plans and clouds", "gloss": "to call / to buy / the ticket / the sky / the clouds / look", "note": "*Mira* is a chunk meaning 'look'. Use it as it is for now.", "example_gloss": ["I am going to call Elena tonight.", "Mateo is going to buy the train ticket.", "There are a lot of clouds in the sky.", "Look, it is going to rain now."]}
  es.a2.unit98.lesson03.teach.gn_plan: {"title": "Ir a for plans", "gloss": "I am going to call Elena. Mateo is going to buy the ticket. We are going to leave by train.", "note": "Use *ir a* for plans and intentions you already have in mind."}
  es.a2.unit98.lesson03.teach.gn_evidencia: {"title": "Ir a for evidence", "gloss": "There are a lot of clouds. Look, it is going to rain.", "note": "Use *ir a* when you can see the evidence right now: dark clouds mean it is *going to* rain."}
  es.a2.unit98.lesson03.teach.gn_prediccion: {"title": "The futuro for forecasts", "gloss": "Next week it will rain a lot. On Saturday it will be sunny. I will call Elena. Mateo will buy the ticket.", "note": "The futuro simple fits forecasts and predictions about a later time, and also promises and quick decisions. In daily speech the two forms often overlap. For now: *ir a* for plans and evidence, futuro for forecasts and promises."}
  es.a2.unit98.lesson03.teach.frases: {"title": "Three sentences", "gloss": "I am going to call Elena. Look, it is going to rain. On Saturday it will be sunny."}
  es.a2.unit98.lesson04.teach.gn_certeza: {"title": "How sure are you?", "gloss": "I am sure that it will rain. It will most likely rain. It will probably rain.", "note": "*Seguro que*, *seguramente* and *probablemente* show how sure you are. They go with the futuro, as in a forecast."}
  es.a2.unit98.lesson04.teach.gn_a_lo_mejor: {"title": "A lo mejor + present", "gloss": "Maybe it rains. Maybe it is sunny. Maybe Mateo comes on Saturday. Maybe it is windy.", "note": "*A lo mejor* means 'maybe' and is the least sure. In this course it takes the plain present, not the futuro: *a lo mejor llueve*."}
  es.a2.unit98.lesson04.teach.promesas: {"title": "Words for promises", "gloss": "I promise / I promise you / I will call you / I will not be late", "note": "*Te* means 'you' and goes before the verb: *te llamaré*.", "example_gloss": ["Tomorrow I will call you, I promise.", "I will not be late, I promise.", "I promise to arrive at nine.", "Tonight I will call you at eight."]}
  es.a2.unit98.lesson04.teach.gn_promesa: {"title": "Making a promise", "gloss": "I promise to call Elena. I promise you that I will come. I promise you that I will not be late.", "note": "Two patterns: *prometo* + infinitive, or *te prometo que* + futuro. Both are natural between friends."}
  es.a2.unit98.lesson04.teach.gn_negativa: {"title": "Negative promises and predictions", "gloss": "I will not be late. I will not go out tonight. I will not call you tomorrow.", "note": "*No* goes before the verb, and before *te* if there is one: *no te llamaré*."}
  es.a2.unit98.lesson04.teach.frases: {"title": "Three sentences", "gloss": "It will most likely rain. Maybe it rains. I promise you."}
  es.a2.unit98.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "to bring or take / the bread / Sunday / the bike / but", "note": "*La bici* is the everyday short form of *la bicicleta*.", "example_gloss": ["Elena will bring the bread.", "On Sunday it will be cold.", "Mateo will come by bike.", "It will be sunny, but windy."]}
  es.a2.unit98.lesson05.teach.gn_pregunta: {"title": "Questions in the future", "gloss": "Will you come by bike? Will you go out by train? Will you bring the bread?", "note": "A question uses the same forms as a statement. Only the question marks and the intonation change."}
  es.a2.unit98.lesson05.teach.gn_repaso: {"title": "Forecast and promise", "gloss": "On Saturday it will be sunny, but on Sunday it will probably rain. I promise you I will bring the bread.", "note": "In Elena's message, the forecast is futuro and the promise is *te prometo que* + futuro. Look for both."}
  es.a2.unit98.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. On Saturday it will be sunny, but on Sunday it will probably rain. I will leave by train at eight. I promise you I will bring the bread. Will you come by bike? See you on Saturday!", "note": "The forecast uses the futuro, and the promise uses *te prometo que* + futuro.", "glosses": {"sol": "sun", "pan": "bread", "bici": "bike", "hasta": "until", "llevaré": "I will bring"}}
  es.a2.unit98.lesson06.teach.d1: {"title": "Elena invites Mateo", "gloss": "Elena: Hi, Mateo. On Saturday I am going to go for a walk with my dog. Will you come?"}
  es.a2.unit98.lesson06.teach.d2: {"title": "Mateo asks about the weather", "gloss": "Mateo: Yes, I will come by bike. What will the weather be like?"}
  es.a2.unit98.lesson06.teach.d3: {"title": "Elena gives the forecast", "gloss": "Elena: Tomorrow it will probably rain, but on Saturday it will be sunny."}
  es.a2.unit98.lesson06.teach.d4: {"title": "Mateo sets the time", "gloss": "Mateo: Great. Then on Saturday we will leave at nine."}
  es.a2.unit98.lesson06.teach.d5: {"title": "Elena asks for a call", "gloss": "Elena: Perfect. I will bring the bread. Will you call me on Saturday at eight?"}
  es.a2.unit98.lesson06.teach.d6: {"title": "Mateo promises", "gloss": "Mateo: Yes, I promise you. I will call you at eight."}
exercises:
  es.a2.unit98.lesson01.exercise01.elige_hablara: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena hablará con Mateo.", "distractors": ["Elena hablaré con Mateo.", "Elena hablarán con Mateo.", "Elena hablaremos con Mateo."], "accepted_answers": [{"value": "Elena hablará con Mateo.", "status": "correct"}], "feedback": "*Elena* is one person, so the verb ends in *-á*: *hablará*."}
  es.a2.unit98.lesson01.exercise02.elige_comeremos: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Nosotros comeremos en casa.", "distractors": ["Nosotros comerá en casa.", "Nosotros comerás en casa.", "Nosotros comer en casa."], "accepted_answers": [{"value": "Nosotros comeremos en casa.", "status": "correct"}], "feedback": "*Nosotros* takes *-emos*: *comeremos*."}
  es.a2.unit98.lesson01.exercise03.une_formas: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "hablaré", "right": "I will speak"}, {"left": "hablarás", "right": "you will speak"}, {"left": "hablará", "right": "he or she will speak"}, {"left": "hablaremos", "right": "we will speak"}, {"left": "hablarán", "right": "they will speak"}, {"left": "comeré", "right": "I will eat"}, {"left": "viviré", "right": "I will live"}, {"left": "lloverá", "right": "it will rain"}, {"left": "nevará", "right": "it will snow"}], "status": "correct"}], "feedback": "The ending shows the person; the stem is the whole infinitive."}
  es.a2.unit98.lesson01.exercise04.ordena_nieve: {"instruction": "Put the words in order to say 'Tonight it will snow in the mountains.'", "correct_option": "Esta noche nevará en la montaña", "accepted_answers": [{"value": "Esta noche nevará en la montaña", "status": "correct"}, {"value": "En la montaña nevará esta noche", "status": "correct"}], "feedback": "The verb *nevará* comes after the time phrase *esta noche*."}
  es.a2.unit98.lesson01.exercise05.completa_hablaran: {"instruction": "Complete with the future of *hablar*.", "correct_option": "hablarán", "accepted_answers": [{"value": "hablarán", "status": "correct"}], "feedback": "*Ellos* takes *-án*: *hablarán*, with a written accent."}
  es.a2.unit98.lesson01.exercise06.traduce_hablare: {"instruction": "Translate into Spanish. Use the future of *hablar*.", "accepted_answers": [{"value": "Mañana hablaré con Elena.", "status": "correct"}, {"value": "Mañana hablaré con Elena", "status": "correct"}, {"value": "Hablaré con Elena mañana.", "status": "correct"}, {"value": "Hablaré con Elena mañana", "status": "correct"}, {"value": "Yo hablaré con Elena mañana.", "status": "correct"}, {"value": "Yo hablaré con Elena mañana", "status": "correct"}, {"value": "Mañana yo hablaré con Elena.", "status": "correct"}, {"value": "Mañana yo hablaré con Elena", "status": "correct"}, {"value": "Yo mañana hablaré con Elena.", "status": "correct"}, {"value": "Yo mañana hablaré con Elena", "status": "correct"}], "feedback": "*Mañana hablaré con Elena* = I will speak with Elena tomorrow."}
  es.a2.unit98.lesson01.exercise07.escribe_lloverá: {"instruction": "Write the sentence with the future tense.", "correct_option": "Mañana lloverá.", "accepted_answers": [{"value": "Mañana lloverá.", "status": "correct"}, {"value": "Mañana lloverá", "status": "correct"}, {"value": "Lloverá mañana.", "status": "correct"}, {"value": "Lloverá mañana", "status": "correct"}], "feedback": "*Mañana lloverá* = Tomorrow it will rain."}
  es.a2.unit98.lesson02.exercise01.elige_tendre: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mañana tendré mucho trabajo.", "distractors": ["Mañana tendrás mucho trabajo.", "Mañana tendremos mucho trabajo.", "Mañana tener mucho trabajo."], "accepted_answers": [{"value": "Mañana tendré mucho trabajo.", "status": "correct"}], "feedback": "*Yo* takes *-é* and the stem *tendr-*: *tendré*."}
  es.a2.unit98.lesson02.exercise02.elige_saldra: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Elena saldrá esta noche.", "distractors": ["Elena saldré esta noche.", "Elena saldrán esta noche.", "Elena salir esta noche."], "accepted_answers": [{"value": "Elena saldrá esta noche.", "status": "correct"}], "feedback": "*Elena* takes *-á* and the stem *saldr-*: *saldrá*."}
  es.a2.unit98.lesson02.exercise03.une_raices: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "haré", "right": "I will do / make"}, {"left": "habrá", "right": "there will be"}, {"left": "tendré", "right": "I will have"}, {"left": "podré", "right": "I will be able to"}, {"left": "saldré", "right": "I will go out"}, {"left": "vendré", "right": "I will come"}, {"left": "mañana", "right": "tomorrow"}, {"left": "esta noche", "right": "tonight"}, {"left": "el sábado", "right": "on Saturday"}, {"left": "la semana que viene", "right": "next week"}], "status": "correct"}], "feedback": "Six irregular stems and four time words."}
  es.a2.unit98.lesson02.exercise04.ordena_vendra: {"instruction": "Put the words in order to say 'On Saturday Elena will come to my house.'", "correct_option": "El sábado Elena vendrá a mi casa", "accepted_answers": [{"value": "El sábado Elena vendrá a mi casa", "status": "correct"}, {"value": "Elena vendrá a mi casa el sábado", "status": "correct"}], "feedback": "*El sábado* first, then the subject and *vendrá*."}
  es.a2.unit98.lesson02.exercise05.completa_vendra: {"instruction": "Complete with the future of *venir*.", "correct_option": "vendrá", "accepted_answers": [{"value": "vendrá", "status": "correct"}], "feedback": "*Venir* gives the stem *vendr-*: *Elena vendrá*."}
  es.a2.unit98.lesson02.exercise06.traduce_podre: {"instruction": "Translate into Spanish. Use the future of *poder*.", "accepted_answers": [{"value": "La semana que viene podré venir.", "status": "correct"}, {"value": "La semana que viene podré venir", "status": "correct"}, {"value": "Podré venir la semana que viene.", "status": "correct"}, {"value": "Podré venir la semana que viene", "status": "correct"}, {"value": "Yo podré venir la semana que viene.", "status": "correct"}, {"value": "Yo podré venir la semana que viene", "status": "correct"}, {"value": "La semana que viene yo podré venir.", "status": "correct"}, {"value": "La semana que viene yo podré venir", "status": "correct"}], "feedback": "*Podré venir* = I will be able to come."}
  es.a2.unit98.lesson02.exercise07.escribe_saldre: {"instruction": "Write the sentence with the future of *salir*.", "correct_option": "Esta noche saldré.", "accepted_answers": [{"value": "Esta noche saldré.", "status": "correct"}, {"value": "Esta noche saldré", "status": "correct"}, {"value": "Saldré esta noche.", "status": "correct"}, {"value": "Saldré esta noche", "status": "correct"}, {"value": "Yo saldré esta noche.", "status": "correct"}, {"value": "Yo saldré esta noche", "status": "correct"}, {"value": "Esta noche yo saldré.", "status": "correct"}, {"value": "Esta noche yo saldré", "status": "correct"}], "feedback": "*Esta noche saldré* = Tonight I will go out."}
  es.a2.unit98.lesson03.exercise01.elige_mira: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Mira, va a llover.", "distractors": ["Mira, voy a llover.", "Mira, vamos a llover.", "Mira, van a llover."], "accepted_answers": [{"value": "Mira, va a llover.", "status": "correct"}], "feedback": "You can see the evidence now, so use *ir a*: *va a llover*."}
  es.a2.unit98.lesson03.exercise02.elige_semana: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "La semana que viene lloverá mucho.", "distractors": ["La semana que viene voy a llover mucho.", "La semana que viene vamos a llover mucho.", "La semana que viene llover mucho."], "accepted_answers": [{"value": "La semana que viene lloverá mucho.", "status": "correct"}], "feedback": "A forecast for a later time uses the futuro: *lloverá*."}
  es.a2.unit98.lesson03.exercise03.une_contraste: {"instruction": "Match each Spanish form to its meaning.", "accepted_answers": [{"value": [{"left": "voy a llamar", "right": "I am going to call"}, {"left": "vas a comprar", "right": "you are going to buy"}, {"left": "va a llover", "right": "it is going to rain"}, {"left": "vamos a salir", "right": "we are going to go out"}, {"left": "van a venir", "right": "they are going to come"}, {"left": "lloverá", "right": "it will rain"}, {"left": "comprará", "right": "he or she will buy"}, {"left": "llamaré", "right": "I will call"}], "status": "correct"}], "feedback": "*Ir a* forms have three words; the futuro is one word."}
  es.a2.unit98.lesson03.exercise04.ordena_billete: {"instruction": "Put the words in order to say 'Mateo is going to buy the ticket.'", "correct_option": "Mateo va a comprar el billete", "accepted_answers": [{"value": "Mateo va a comprar el billete", "status": "correct"}], "feedback": "*Va a* comes before the infinitive *comprar*."}
  es.a2.unit98.lesson03.exercise05.completa_va: {"instruction": "Complete with the present of *ir*.", "correct_option": "va", "accepted_answers": [{"value": "va", "status": "correct"}], "feedback": "*Llover* is impersonal, so it takes *va*: *va a llover*."}
  es.a2.unit98.lesson03.exercise06.traduce_mira: {"instruction": "Translate into Spanish. Use *ir a*.", "accepted_answers": [{"value": "Mira, va a llover.", "status": "correct"}, {"value": "Mira, va a llover", "status": "correct"}], "feedback": "*Mira, va a llover* = Look, it is going to rain."}
  es.a2.unit98.lesson03.exercise07.escribe_llamar: {"instruction": "Write the sentence with *ir a* + infinitive.", "correct_option": "Voy a llamar a Elena esta noche.", "accepted_answers": [{"value": "Voy a llamar a Elena esta noche.", "status": "correct"}, {"value": "Voy a llamar a Elena esta noche", "status": "correct"}, {"value": "Esta noche voy a llamar a Elena.", "status": "correct"}, {"value": "Esta noche voy a llamar a Elena", "status": "correct"}, {"value": "Yo voy a llamar a Elena esta noche.", "status": "correct"}, {"value": "Yo voy a llamar a Elena esta noche", "status": "correct"}, {"value": "Esta noche yo voy a llamar a Elena.", "status": "correct"}, {"value": "Esta noche yo voy a llamar a Elena", "status": "correct"}], "feedback": "*Voy a llamar a Elena esta noche* = I am going to call Elena tonight."}
  es.a2.unit98.lesson04.exercise01.elige_a_lo_mejor: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "A lo mejor llueve mañana.", "distractors": ["A lo mejor hace frío mañana.", "A lo mejor hace sol mañana.", "A lo mejor hay viento mañana."], "accepted_answers": [{"value": "A lo mejor llueve mañana.", "status": "correct"}], "feedback": "*A lo mejor llueve*: *llueve* is the present of *llover*."}
  es.a2.unit98.lesson04.exercise02.elige_promesa: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Te prometo que no llegaré tarde.", "distractors": ["Te prometo que llegaré tarde.", "Te prometo que te llamaré.", "Te prometo que llegaré a las nueve."], "accepted_answers": [{"value": "Te prometo que no llegaré tarde.", "status": "correct"}], "feedback": "*No llegaré tarde* = I will not be late."}
  es.a2.unit98.lesson04.exercise03.une_certeza: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "seguro que", "right": "I am sure that"}, {"left": "seguramente", "right": "most likely"}, {"left": "probablemente", "right": "probably"}, {"left": "a lo mejor", "right": "maybe"}, {"left": "te lo prometo", "right": "I promise you"}, {"left": "te llamaré", "right": "I will call you"}, {"left": "no llegaré tarde", "right": "I will not be late"}, {"left": "prometo llamar", "right": "I promise to call"}, {"left": "te prometo que vendré", "right": "I promise you I will come"}], "status": "correct"}], "feedback": "Certainty words on one side, promises on the other."}
  es.a2.unit98.lesson04.exercise04.ordena_promesa: {"instruction": "Put the words in order to say 'I promise you I will not be late.'", "correct_option": "Te prometo que no llegaré tarde", "accepted_answers": [{"value": "Te prometo que no llegaré tarde", "status": "correct"}], "feedback": "*Te prometo que* first, then *no llegaré tarde*."}
  es.a2.unit98.lesson04.exercise05.completa_viene: {"instruction": "Complete with the present of *venir*. (*A lo mejor* takes the present.)", "correct_option": "viene", "accepted_answers": [{"value": "viene", "status": "correct"}], "feedback": "*A lo mejor Mateo viene*: present tense after *a lo mejor*."}
