review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English
    glosses correctly describe the register each Spanish form belongs to
    (informal tú/te/tu vs formal usted/le/su; Hola/Un abrazo vs Estimado
    señor o señora / Atentamente / Le saluda atentamente; puedes +
    imperative vs podría / sería tan amable de / sería posible), that
    "por favor" genuinely does not split by register the way the
    English glosses imply some OTHER forms do, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that the
    culminating writing answers (lesson06 exercise06 and exercise07)
    accept the punctuation forms a correct learner would actually
    produce. See the realization file's review block for the full
    priority list.
  notes: >-
    Overlay for es's fifth B2 unit (register -- adapting formality to the
    audience), authored alongside the realization. English speakers' real
    interference risks for this outcome: (1) English has ONE 'you', so
    the informal tú/te/tu vs formal usted/le/su split -- and the verb
    shift it forces (tiene/puede usted, the 3rd-person-like form) -- has
    no English anchor and is drilled explicitly in lesson01; (2) English
    "please" never changes with the person you're addressing, which is
    actually the SAME as Spanish "por favor" -- lesson03 deliberately
    flags this as a place where Spanish does NOT add a register split,
    unlike the pronoun/verb system, so a learner used to a language that
    DOES split "please" doesn't invent a formal-vs-informal "por favor"
    that doesn't exist; (3) English requests can stay direct and still
    sound polite ('Can you...?'), whereas formal Spanish often softens by
    using the conditional or going indirect (podría / sería tan amable de
    / sería posible) -- lesson03 contrasts the direct informal question +
    imperative against the indirect formal frames so a learner does not
    carry English directness into a formal Spanish letter; (4)
    salutations/closings differ sharply by register (Hola/Un abrazo vs
    Estimado señor o señora / Atentamente / Le saluda atentamente) and
    are taught as fixed formulas in lesson02. This unit DELIBERATELY
    teaches both registers -- each individual exercise stays in one
    consistent register, and every production prompt names the register
    AND the frame wanted so a correct answer in the OTHER register is not
    marked wrong. The culminating lesson06 exercise07 asks for the SAME
    request in BOTH registers; its accepted answers cover the natural
    punctuation variants. No sibling-direction file (es-en b2) was
    consulted.

course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: adapt your register to the audience --
    say the same thing appropriately to a close friend and to an
    institution. Switch between informal tú and formal usted, between
    Hola/Un abrazo and Estimado señor o señora / Atentamente, and between
    a direct request (¿puedes...?) and an indirect polite one (¿sería
    posible...?), around the everyday task of rescheduling an
    appointment.

units:
  es.b2.unit05.registro:
    title: "Register"
    description: Adapt your register to who you are addressing -- deliver the same request appropriately to a close friend and to an institution, switching pronouns, salutations, closings and directness.

lessons:
  es.b2.unit05.lesson01.tu_o_usted:
    title: "You or usted?"
  es.b2.unit05.lesson02.saludos_despedidas:
    title: "Salutations and closings"
  es.b2.unit05.lesson03.directo_o_cortes:
    title: "Direct or polite?"
  es.b2.unit05.lesson04.cambiar_la_cita:
    title: "Rescheduling the appointment"
  es.b2.unit05.lesson05.dos_mensajes:
    title: "Two messages, two readers"
  es.b2.unit05.lesson06.elegir_el_registro:
    title: "Choosing the right register"

teaching:
  es.b2.unit05.lesson01.teach.mensaje:
    title: "Elena is writing a message."
    gloss: "Elena is writing a message."
    note: "The situation this whole unit works with: Elena has to send the same request to two very different readers. *Un mensaje* = 'a message'."
  es.b2.unit05.lesson01.teach.tu:
    title: "you (informal)"
    gloss: "you / your (informal)"
    note: "The informal 'you': *tú* is the subject ('you'), *te* is the object ('you'), *tu* is the possessive ('your'). Use it with friends, family and peers -- like Elena with Mateo."
    example_gloss: "I'm writing you a message."
  es.b2.unit05.lesson01.teach.usted:
    title: "you (formal)"
    gloss: "you / your (formal)"
    note: "The formal 'you': *usted* is the subject, *le* is the (indirect) object -- as in writing TO someone -- and *su* is the possessive ('your'). Use it with strangers, officials and institutions. *Usted* takes the SAME verb form as *él/ella*."
    example_gloss: "I'm writing you a message."
  es.b2.unit05.lesson01.teach.tienes_un_momento:
    title: "Do you have a moment?"
    gloss: "Do you have a moment?"
    note: "Informal. *¿Tienes...?* is the *tú* form of *tener* ('to have'). *Un momento* = 'a moment'. Compare the formal version on the next card -- same question, different register."
  es.b2.unit05.lesson01.teach.tiene_usted_un_momento:
    title: "Do you have a moment? (formal)"
    gloss: "Do you have a moment?"
    note: "Formal. With *usted* the verb takes the same form as *él/ella*: *tiene*, not *tienes*. This verb shift is the heart of switching into the formal register."
  es.b2.unit05.lesson01.teach.puedes_ayudarme:
    title: "Can you help me? (informal)"
    gloss: "Can you help me?"
    note: "Informal. *¿Puedes...?* is the *tú* form of *poder* ('can'). It is direct and perfectly polite between friends."
  es.b2.unit05.lesson01.teach.puede_usted_ayudarme:
    title: "Can you help me? (formal)"
    gloss: "Can you help me?"
    note: "Formal. *¿Puede usted...?* -- again *usted* takes the *él/ella* form (*puede*, not *puedes*). Same question as *¿Puedes ayudarme?*, shifted up in formality."
  es.b2.unit05.lesson01.teach.grammar_tu_usted:
    title: "Do you have a moment? / Do you have a moment? Can you help me? / Can you help me?"
    gloss: "Do you have a moment? (informal / formal). Can you help me? (informal / formal)."
    note: "The core move of this unit: *tú -> usted* changes the verb too. *tienes -> tiene*, *puedes -> puede*. Choose *tú* for a friend and *usted* for an institution."

  es.b2.unit05.lesson02.teach.hola:
    title: "Hi / Hello"
    gloss: "Hi / Hello"
    note: "*Hola* is the everyday informal greeting -- for a friend, a text, a chat. *¡Hola, Mateo!* is exactly how Elena opens a message to Mateo."
    example_gloss: "Hi, Mateo!"
  es.b2.unit05.lesson02.teach.abrazo:
    title: "A hug (sign-off)"
    gloss: "A hug / hugs (informal sign-off)"
    note: "*Un abrazo* is the informal way to sign off a message to a friend, like 'hugs' or 'take care'. Never use it in a formal letter."
    example_gloss: "A hug, Elena."
  es.b2.unit05.lesson02.teach.estimado:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam"
    note: "*Estimado señor o señora* is the standard formal salutation when you don't know the reader's name -- the opener for a letter or e-mail to an institution. *Señor* = 'sir/gentleman', *señora* = 'madam'."
  es.b2.unit05.lesson02.teach.atentamente:
    title: "Sincerely / Regards"
    gloss: "Sincerely / Kind regards"
    note: "*Atentamente* is the everyday formal closing -- the standard way to end a polite e-mail or letter, roughly 'sincerely' or 'kind regards'. *García* is Elena's surname."
    example_gloss: "Sincerely, Elena García."
  es.b2.unit05.lesson02.teach.le_saluda_atentamente:
    title: "Yours faithfully"
    gloss: "Yours faithfully (most formal)"
    note: "*Le saluda atentamente* is the MOST formal sign-off -- literally 'greets you attentively', more distant than plain *Atentamente*, for very official letters. Roughly 'yours faithfully'."
    example_gloss: "Yours faithfully, Elena García."
  es.b2.unit05.lesson02.teach.querido:
    title: "Dear (neutral)"
    gloss: "Dear ... (neutral)"
    note: "*Querido* + a name ('Querido Mateo,') is the neutral middle ground -- warmer than *Hola*, still fine for someone you know a little. It sits between the informal *Hola* and the formal *Estimado*. It agrees in gender: *querido* for a man, *querida* for a woman."
    example_gloss: "Dear Mateo,"
  es.b2.unit05.lesson02.teach.grammar_saludos_despedidas:
    title: "Hi, Mateo! A hug. Dear Sir or Madam, Yours faithfully."
    gloss: "Hi, Mateo! A hug. Dear Sir or Madam, Yours faithfully."
    note: "Salutations and closings come in matched registers. Informal: *Hola* ... *Un abrazo*. Formal: *Estimado señor o señora* ... *Le saluda atentamente*. Mixing them -- 'Estimado señor o señora ... Un abrazo' -- reads as a mistake."

  es.b2.unit05.lesson03.teach.puedes_hacer_esto:
    title: "Can you do this? (informal)"
    gloss: "Can you do this?"
    note: "Informal and direct: *¿Puedes hacer esto?* Between friends a direct question is the normal, friendly choice. *Esto* = 'this', *hacer* = 'to do'."
  es.b2.unit05.lesson03.teach.hazlo:
    title: "Do it."
    gloss: "Do it."
    note: "*Hazlo* is the informal (*tú*) imperative of *hacer* + *lo* ('it'). Direct commands like this are normal and friendly between people who know each other well."
  es.b2.unit05.lesson03.teach.por_favor:
    title: "please"
    gloss: "please"
    note: "*Por favor* means 'please' -- and, unlike the pronouns and verbs, it does NOT change between *tú* and *usted*. Use the exact same word in both registers."
    example_gloss: "Do it, please."
  es.b2.unit05.lesson03.teach.podria_hacer_esto:
    title: "Could you do this?"
    gloss: "Could you do this?"
    note: "Formal and softened. *¿Podría...?* is the conditional of *poder* -- using the conditional instead of the plain present is itself a politeness marker, roughly like English 'could' instead of 'can'."
  es.b2.unit05.lesson03.teach.seria_tan_amable:
    title: "Would you be so kind as to do it?"
    gloss: "Would you be so kind as to do it?"
    note: "The very polite formal frame: *¿Sería usted tan amable de hacerlo?* ('would you be so kind as to do it?'). Reserved for formal requests to an institution. *Tan amable* = 'so kind'."
  es.b2.unit05.lesson03.teach.posible:
    title: "possible"
    gloss: "possible"
    note: "*Posible* = 'possible'. The formula *¿Sería posible + infinitive?* ('would it be possible to...?') is a very common polite, indirect way to make a formal request -- it names no one, which makes it feel respectful."
    example_gloss: "Would it be possible to help?"
  es.b2.unit05.lesson03.teach.grammar_directo_cortes:
    title: "Can you do this? Could you do this? Would it be possible to help?"
    gloss: "Can you do this? Could you do this? Would it be possible to help?"
    note: "Directness is a register signal. Informal: a direct *¿Puedes...?* or an imperative + *por favor*. Formal: the conditional *¿Podría...?*, *¿Sería tan amable de...?*, or *¿Sería posible...?* + the SAME *por favor*. The more indirect, the more formal."

  es.b2.unit05.lesson04.teach.la_cita:
    title: "the appointment"
    gloss: "the appointment"
    note: "*La cita* = 'the appointment' -- a meeting time you've agreed with someone. This is what Elena needs to change."
    example_gloss: "I have an appointment."
  es.b2.unit05.lesson04.teach.cambiar:
    title: "to change / reschedule"
    gloss: "to change / reschedule"
    note: "*Cambiar* = 'to change'. *Cambiar la cita* = 'to reschedule the appointment'. *Quiero* = 'I want' (the *yo* form of *querer*)."
    example_gloss: "I want to reschedule the appointment."
  es.b2.unit05.lesson04.teach.el_lunes:
    title: "Monday"
    gloss: "Monday"
    note: "*El lunes* = 'Monday'. *No puedo el lunes* = 'I can't (make it) on Monday' -- Spanish needs no 'on'. *No* = 'not', *puedo* = 'I can' (the *yo* form of *poder*)."
    example_gloss: "I can't on Monday."
  es.b2.unit05.lesson04.teach.lamentablemente:
    title: "unfortunately"
    gloss: "unfortunately"
    note: "*Lamentablemente* = 'unfortunately' -- a softener that makes a refusal or bad news sound more considerate, useful in both registers. *Lamentablemente, no puedo el lunes* = 'unfortunately I can't on Monday'."
    example_gloss: "Unfortunately I can't on Monday."
  es.b2.unit05.lesson04.teach.la_proxima_semana:
    title: "next week"
    gloss: "next week"
    note: "*La próxima semana* = 'next week'."
  es.b2.unit05.lesson04.teach.pregunta_informal:
    title: "Can we reschedule the appointment? (informal)"
    gloss: "Can we reschedule the appointment?"
    note: "The request in its informal form, to a friend: *¿Podemos cambiar la cita?* Direct, with *podemos* ('we can') and no softening frame."
  es.b2.unit05.lesson04.teach.pregunta_formal:
    title: "Would it be possible to reschedule our appointment? (formal)"
    gloss: "Would it be possible to reschedule our appointment?"
    note: "The SAME request in formal form, to an institution: *¿Sería posible cambiar nuestra cita?* Indirect and polite. *Nuestra* = 'our'."
  es.b2.unit05.lesson04.teach.grammar_cita:
    title: "Can we reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can we reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "One request, two registers. Informal: *¿Podemos cambiar la cita?* Formal: *¿Sería posible cambiar nuestra cita?* Same content, different wrapping for a different reader -- the whole point of this unit."

  es.b2.unit05.lesson05.teach.convenir:
    title: "suits / is convenient"
    gloss: "suits / is convenient"
    note: "*Convenir* = '(for a time) to suit / be convenient'. *¿Le conviene la próxima semana?* = 'does next week suit you?' -- a polite, formal way to propose a new time, the counterpart to the informal *¿Podemos...?* *Para* = 'for/to'."
    example_gloss: "Does next week suit you?"
  es.b2.unit05.lesson05.teach.texto_informal:
    title: "Informal message (to Mateo)"
    gloss: "Hi, Mateo! Can we reschedule the appointment to next week? Unfortunately I can't on Monday. A hug, Elena"
    glosses:
      Hola: "Hi (informal greeting)"
      Podemos: "can we (form of poder)"
      cambiar: "to change / reschedule"
      cita: appointment
      para: "for / to"
      próxima: next
      semana: week
      Lamentablemente: unfortunately
      "no": not
      puedo: "I can (form of poder)"
      lunes: Monday
      Un: a
      abrazo: hug
  es.b2.unit05.lesson05.teach.texto_formal:
    title: "Formal message (to an institution)"
    gloss: "Dear Sir or Madam: Would it be possible to reschedule our appointment to next week? Unfortunately I can't on Monday. Yours faithfully, Elena García"
    glosses:
      Estimado: "Dear (formal salutation)"
      señor: Sir
      o: or
      señora: Madam
      Sería: "would (polite request)"
      posible: possible
      cambiar: "to change / reschedule"
      nuestra: our
      cita: appointment
      para: "for / to"
      próxima: next
      semana: week
      Lamentablemente: unfortunately
      lunes: Monday
      Le: "to him/her (formal)"
      saluda: greets
      atentamente: "attentively (formal closing)"

  es.b2.unit05.lesson06.teach.no_hay_problema:
    title: "No problem."
    gloss: "No problem."
    note: "*No hay problema* = 'no problem' -- a relaxed, informal reply. *Hay* = 'there is/are'."
  es.b2.unit05.lesson06.teach.cuando_si:
    title: "When instead?"
    gloss: "When instead?"
    note: "*¿Cuándo sí?* = 'when instead?' (literally 'when yes?') -- a natural follow-up after someone says they can't make a time. *Y* = 'and'."
  es.b2.unit05.lesson06.teach.ayuntamiento:
    title: "the town hall"
    gloss: "the town hall / municipal office"
    note: "*El ayuntamiento* = 'the town hall' -- your local government office, a classic institution you'd write to formally. *Escribirle* = 'to write to him/her/it (formal)', *al* = 'to the' (a + el), *que* = 'that'."
    example_gloss: "I have to write to the town hall."
  es.b2.unit05.lesson06.teach.todavia:
    title: "still"
    gloss: "still"
    note: "*Todavía* = 'still'. *Todavía tengo que...* = 'I still have to...'"
    example_gloss: "I still have to write to the town hall."
  es.b2.unit05.lesson06.teach.formalidad:
    title: "formally"
    gloss: "formally / with formality"
    note: "*Con formalidad* = 'formally' -- doing something the correct, respectful way. Writing *con formalidad* to an institution means using the formal register throughout."
    example_gloss: "I write formally."
  es.b2.unit05.lesson06.teach.de_otra_manera:
    title: "To the town hall you write differently, of course."
    gloss: "To the town hall you write differently, of course."
    note: "*De otra manera* = 'differently'. *Al ayuntamiento le escribes de otra manera, claro* = 'to the town hall you write differently, of course' -- exactly the skill of this unit. *Claro* = 'of course', *escribes* = 'you write' (*tú* form)."
  es.b2.unit05.lesson06.teach.dialogue_elena_setup:
    title: "Elena: Hi, Mateo. Can we reschedule the appointment? I can't on Monday."
    gloss: "Elena: Hi, Mateo. Can we reschedule the appointment? I can't on Monday."
  es.b2.unit05.lesson06.teach.dialogue_mateo_ok:
    title: "Mateo: No problem. When instead?"
    gloss: "Mateo: No problem. When instead?"
  es.b2.unit05.lesson06.teach.dialogue_elena_ayuntamiento:
    title: "Elena: Next week? And I still have to write to the town hall formally."
    gloss: "Elena: Next week? And I still have to write to the town hall formally."
  es.b2.unit05.lesson06.teach.dialogue_mateo_anders:
    title: "Mateo: Yes, to the town hall you write differently, of course."
    gloss: "Mateo: Yes, to the town hall you write differently, of course."
  es.b2.unit05.lesson06.teach.grammar_ambos_registros:
    title: "Can you reschedule the appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule the appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader. Informal to Mateo: *¿Puedes cambiar la cita?* Formal to an institution: *¿Sería posible cambiar nuestra cita?*"

exercises:
  es.b2.unit05.lesson01.exercise01.recognize_usted:
    instruction: "Who do you address as 'usted'?"
    correct_option: "someone you treat formally (a stranger or an institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (a stranger or an institution)", status: correct}]
    feedback: "Usted is the formal 'you' -- for strangers, officials and institutions. For a friend you use tú."
  es.b2.unit05.lesson01.exercise02.listen_tiene_usted:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have a moment? (formal)"
    distractors: ["Do you have a moment? (informal)", "Can you help me? (formal)", "Do you have time? (informal)"]
    accepted_answers: [{value: "Do you have a moment? (formal)", status: correct}]
    feedback: "¿Tiene usted un momento? is the formal 'do you have a moment?' -- usted takes the él/ella form tiene."
  es.b2.unit05.lesson01.exercise03.match_pronombres:
    instruction: "Match each Spanish word with its meaning and register."
    accepted_answers:
      - value: {tú: "you (informal, subject)", te: "you (informal, object)", tu: "your (informal)", usted: "you (formal)", le: "you (formal, indirect object)", su: "your (formal)", "puedes": "can you (informal)", "puede usted": "can you (formal)"}
        status: correct
    feedback: "tú/te/tu are the informal set; usted/le/su are the formal set -- and the verb follows (puedes vs puede usted)."
  es.b2.unit05.lesson01.exercise04.order_tienes_un_momento:
    instruction: "Put the words in order, informal: Do you have a moment?"
    accepted_answers:
      - {value: "Tienes un momento", status: correct}
    feedback: "¿Tienes un momento? -- the informal tú form of tener."
  es.b2.unit05.lesson01.exercise05.translate_tiene_usted:
    instruction: "Translate into Spanish, formal (addressing the person as usted): Do you have a moment?"
    accepted_answers:
      - {value: "Tiene usted un momento", status: correct}
      - {value: "Usted tiene un momento", status: correct}
    feedback: "¿Tiene usted un momento? -- with usted the verb is tiene, not tienes."
  es.b2.unit05.lesson01.exercise06.translate_puedes_ayudarme:
    instruction: "Translate into Spanish, informal (addressing the person as tú): Can you help me?"
    accepted_answers:
      - {value: "Puedes ayudarme", status: correct}
    feedback: "¿Puedes ayudarme? -- the informal tú form of poder."
  es.b2.unit05.lesson01.exercise07.speak_puede_usted_ayudarme:
    instruction: "Say aloud in Spanish, formal (addressing the person as usted): Can you help me?"
    accepted_answers:
      - {value: "Puede usted ayudarme", status: correct}
      - {value: "Usted puede ayudarme", status: correct}
    feedback: "¿Puede usted ayudarme? -- with usted the verb is puede, not puedes."
  es.b2.unit05.lesson01.exercise08.dictation_tiene_usted:
    instruction: "Type what you hear."
    correct_response: "¿Tiene usted un momento?"
    orthography_strict: true
    feedback: "You heard ¿Tiene usted un momento? -- the formal 'do you have a moment?', with usted the verb takes the él/ella form tiene."

  es.b2.unit05.lesson02.exercise01.recognize_estimado:
    instruction: "When would you write 'Estimado señor o señora'?"
    correct_option: "to open a formal letter to someone whose name you don't know"
    distractors: ["to text a friend", "to sign off a message to your sister", "to greet a child"]
    accepted_answers: [{value: "to open a formal letter to someone whose name you don't know", status: correct}]
    feedback: "Estimado señor o señora is the formal salutation when the reader is unknown -- for an institution, not a friend."
  es.b2.unit05.lesson02.exercise02.listen_atentamente:
    instruction: "Listen and select what you hear."
    correct_option: "Sincerely / Kind regards (formal closing)"
    distractors: ["Hugs (informal sign-off)", "Dear Sir or Madam (formal opening)", "Yours faithfully (most formal closing)"]
    accepted_answers: [{value: "Sincerely / Kind regards (formal closing)", status: correct}]
    feedback: "Atentamente is the everyday formal closing -- 'sincerely' or 'kind regards'."
  es.b2.unit05.lesson02.exercise03.match_saludos_despedidas:
    instruction: "Match each salutation or closing with its meaning and register."
    accepted_answers:
      - value: {Hola: "informal 'hi'", "Un abrazo": "informal sign-off (a hug)", "Estimado señor o señora": "formal salutation (Dear Sir or Madam)", Atentamente: "formal closing (sincerely / regards)", "Le saluda atentamente": "most formal closing (yours faithfully)", Querido: "neutral 'Dear' + name"}
        status: correct
    feedback: "Informal Hola/Un abrazo, neutral Querido, formal Estimado señor o señora / Atentamente, most formal Le saluda atentamente."
  es.b2.unit05.lesson02.exercise04.order_le_saluda_atentamente:
    instruction: "Put the words in order, the most formal closing: Yours faithfully."
    accepted_answers:
      - {value: "Le saluda atentamente", status: correct}
    feedback: "Le saluda atentamente -- the most formal, most distant sign-off."
  es.b2.unit05.lesson02.exercise05.translate_estimado:
    instruction: "Write the formal Spanish salutation for a letter to someone you don't know: Dear Sir or Madam."
    accepted_answers:
      - {value: "Estimado señor o señora", status: correct}
      - {value: "Estimado señor o señora,", status: correct}
      - {value: "Estimado señor o señora:", status: correct}
    feedback: "Estimado señor o señora -- the formal opening when you don't know the reader's name."
  es.b2.unit05.lesson02.exercise06.write_abrazo:
    instruction: "Write an informal Spanish sign-off to a friend, from Elena: Hugs, Elena."
    accepted_answers:
      - {value: "Un abrazo, Elena", status: correct}
      - {value: "Un abrazo Elena", status: correct}
    feedback: "Un abrazo, Elena -- the informal way to close a message to a friend."
  es.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal?"
    correct_option: "Le saluda atentamente"
    distractors: ["Un abrazo", Hola, Querido]
    accepted_answers: [{value: "Le saluda atentamente", status: correct}]
    feedback: "Le saluda atentamente ('yours faithfully') is the most formal sign-off -- more distant than plain Atentamente."

  es.b2.unit05.lesson03.exercise01.recognize_podria:
    instruction: "What does this word mean, and in which register?"
    correct_option: "could (formal, polite)"
    distractors: ["can (informal)", "want (formal)", "will (formal)"]
    accepted_answers: [{value: "could (formal, polite)", status: correct}]
    feedback: "Podría is the conditional of poder -- using the conditional instead of the plain present is itself a formal politeness marker."
  es.b2.unit05.lesson03.exercise02.listen_podria_hacer_esto:
    instruction: "Listen and select what you hear."
    correct_option: "Could you do this? (formal)"
    distractors: ["Can you do this? (informal)", "Do you want to do this? (informal)", "Would it be possible to do this? (formal)"]
    accepted_answers: [{value: "Could you do this? (formal)", status: correct}]
    feedback: "¿Podría hacer esto? is the formal, softened request -- 'could you do this?'."
  es.b2.unit05.lesson03.exercise03.match_directo_cortes:
    instruction: "Match each form with its meaning and register."
    accepted_answers:
      - value: {"puedes": "can you (informal, direct)", "podría": "could you (formal, polite)", "por favor": "please (same word in either register)", "sería tan amable": "would you be so kind (formal)", posible: possible, hacer: "to do", Hazlo: "do it (informal imperative)"}
        status: correct
    feedback: "Informal and direct: puedes, Hazlo, por favor. Formal and indirect: podría, sería tan amable, and the same por favor."
  es.b2.unit05.lesson03.exercise04.order_podria_hacer_esto:
    instruction: "Put the words in order, formal and polite: Could you do this?"
    accepted_answers:
      - {value: "Podría hacer esto", status: correct}
    feedback: "¿Podría hacer esto? -- the conditional softens the request into the formal register."
  es.b2.unit05.lesson03.exercise05.translate_puedes_hacer_esto:
    instruction: "Translate into Spanish, informal and direct (using tú): Can you do this?"
    accepted_answers:
      - {value: "Puedes hacer esto", status: correct}
    feedback: "¿Puedes hacer esto? -- direct is the friendly, normal choice between friends."
  es.b2.unit05.lesson03.exercise06.translate_podria_hacer_esto:
    instruction: "Translate into Spanish, formal and polite (using usted, with podría): Could you do this?"
    accepted_answers:
      - {value: "Podría hacer esto", status: correct}
      - {value: "Podría usted hacer esto", status: correct}
    feedback: "¿Podría (usted) hacer esto? -- the conditional goes formal and polite."
  es.b2.unit05.lesson03.exercise07.speak_seria_posible:
    instruction: "Say aloud in Spanish, formal (using Sería posible): Would it be possible to help?"
    accepted_answers:
      - {value: "Sería posible ayudar", status: correct}
    feedback: "¿Sería posible ayudar? -- a very common polite, indirect formal frame."

  es.b2.unit05.lesson04.exercise01.recognize_cambiar:
    instruction: "What does this word mean?"
    correct_option: "to change / reschedule"
    distractors: ["to cancel", "to confirm", "to attend"]
    accepted_answers: [{value: "to change / reschedule", status: correct}]
    feedback: "Cambiar means to change an appointment to another time -- to reschedule."
  es.b2.unit05.lesson04.exercise02.listen_podemos_cambiar:
    instruction: "Listen and select what you hear."
    correct_option: "Can we reschedule the appointment? (informal)"
    distractors: ["Would it be possible to reschedule the appointment? (formal)", "Can we cancel the appointment? (informal)", "Do we have an appointment? (informal)"]
    accepted_answers: [{value: "Can we reschedule the appointment? (informal)", status: correct}]
    feedback: "¿Podemos cambiar la cita? is the informal form of the request -- direct, no softening frame."
  es.b2.unit05.lesson04.exercise03.match_cita_words:
    instruction: "Match each Spanish word or phrase with its meaning."
    accepted_answers:
      - value: {cita: appointment, cambiar: "to change / reschedule", lunes: Monday, "la próxima semana": "next week", lamentablemente: unfortunately, podemos: "we can"}
        status: correct
    feedback: "These are the words the request is built from -- the same content will be wrapped in either register."
  es.b2.unit05.lesson04.exercise04.order_pregunta_formal:
    instruction: "Put the words in order, formal: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Sería posible cambiar nuestra cita", status: correct}
    feedback: "¿Sería posible cambiar nuestra cita? -- the indirect, polite formal request."
  es.b2.unit05.lesson04.exercise05.translate_pregunta_informal:
    instruction: "Translate into Spanish, informal (to your friend Mateo): Can we reschedule the appointment?"
    accepted_answers:
      - {value: "Podemos cambiar la cita", status: correct}
    feedback: "¿Podemos cambiar la cita? -- direct and informal, for a friend."
  es.b2.unit05.lesson04.exercise06.translate_pregunta_formal:
    instruction: "Translate into Spanish, formal (to an institution, using Sería posible): Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Sería posible cambiar nuestra cita", status: correct}
    feedback: "¿Sería posible cambiar nuestra cita? -- the SAME request, wrapped for an institution."
  es.b2.unit05.lesson04.exercise07.write_lamentablemente:
    instruction: "Write in Spanish, keeping the word order Lamentablemente, no puedo el lunes: Unfortunately I can't on Monday."
    accepted_answers:
      - {value: "Lamentablemente, no puedo el lunes", status: correct}
      - {value: "Lamentablemente no puedo el lunes", status: correct}
    feedback: "Lamentablemente, no puedo el lunes -- lamentablemente softens the refusal, in either register."
  es.b2.unit05.lesson04.exercise08.dictation_podemos_cambiar:
    instruction: "Type what you hear."
    correct_response: "¿Podemos cambiar la cita?"
    orthography_strict: true
    feedback: "You heard ¿Podemos cambiar la cita? -- 'can we reschedule the appointment?', the informal we-form for asking to move a meeting."

  es.b2.unit05.lesson05.exercise01.read_friend:
    instruction: "Which message is written to a close friend?"
    correct_option: "The one that opens 'Hola, Mateo!' and signs off 'Un abrazo'."
    distractors: ["The one that opens 'Estimado señor o señora' and signs off 'Le saluda atentamente'.", "Neither -- both are formal.", "Both are informal."]
    accepted_answers: [{value: "The one that opens 'Hola, Mateo!' and signs off 'Un abrazo'.", status: correct}]
    feedback: "Hola, Mateo! and Un abrazo are informal -- markers of a message to a friend."
  es.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to an institution?"
    correct_option: "The one that opens 'Estimado señor o señora' and signs off 'Le saluda atentamente'."
    distractors: ["The one that opens 'Hola, Mateo!' and signs off 'Un abrazo'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Estimado señor o señora' and signs off 'Le saluda atentamente'.", status: correct}]
    feedback: "Estimado señor o señora and Le saluda atentamente are formal -- markers of a message to an institution."
  es.b2.unit05.lesson05.exercise03.read_same_request:
    instruction: "Both messages make the SAME request. What is it?"
    correct_option: "To reschedule the appointment."
    distractors: ["To cancel the appointment.", "To confirm Monday.", "To ask for directions."]
    accepted_answers: [{value: "To reschedule the appointment.", status: correct}]
    feedback: "Both ask to reschedule (cambiar la cita) -- same content, different register."
  es.b2.unit05.lesson05.exercise04.read_signal:
    instruction: "Which feature marks the second message as the one for an institution?"
    correct_option: "It uses 'Sería posible' and 'Le saluda atentamente', not 'Podemos' and 'Un abrazo'."
    distractors: ["It is shorter.", "It asks about a different day.", "It does not mention the appointment."]
    accepted_answers: [{value: "It uses 'Sería posible' and 'Le saluda atentamente', not 'Podemos' and 'Un abrazo'.", status: correct}]
    feedback: "The formal message marks its audience through the indirect Sería posible frame and the formal closing, in place of usted itself (which stays implicit here)."
  es.b2.unit05.lesson05.exercise05.match_register_features:
    instruction: "Match each register feature with what it is."
    accepted_answers:
      - value: {"Hola Mateo": "informal greeting (to a friend)", "Estimado señor o señora": "formal greeting (to an institution)", "Un abrazo": "informal closing", "Le saluda atentamente": "formal closing", conviene: "suits / is convenient", "la próxima semana": "next week"}
        status: correct
    feedback: "The salutations and closings are what most clearly signal who each message is for."
  es.b2.unit05.lesson05.exercise06.translate_conviene:
    instruction: "Translate into Spanish, formal, using 'convenir': Does next week suit you?"
    accepted_answers:
      - {value: "Le conviene la próxima semana", status: correct}
      - {value: "Le conviene la próxima semana?", status: correct}
    feedback: "¿Le conviene la próxima semana? -- convenir ('to suit') is the polite, formal way to propose a new time."
  es.b2.unit05.lesson05.exercise07.write_proxima_semana:
    instruction: "Write in Spanish, informal: Can we reschedule the appointment to next week?"
    accepted_answers:
      - {value: "Podemos cambiar la cita para la próxima semana", status: correct}
    feedback: "¿Podemos cambiar la cita para la próxima semana? -- the informal way to propose next week to a friend."

  es.b2.unit05.lesson06.exercise01.comprehend_register_fit:
    instruction: "How does Elena address Mateo, and does that register fit the situation?"
    correct_option: "Informally, with 'tú' -- and it fits, because Mateo is a close friend."
    distractors: ["Formally, with 'usted' -- and it fits, because he is a stranger.", "Informally, with 'tú' -- but it does not fit; she should use 'usted'.", "Formally, with 'usted' -- but it does not fit; she should use 'tú'."]
    accepted_answers: [{value: "Informally, with 'tú' -- and it fits, because Mateo is a close friend.", status: correct}]
    feedback: "Elena uses the informal tú with Mateo, which is exactly right for a friend -- the register fits the audience."
  es.b2.unit05.lesson06.exercise02.comprehend_mismatch:
    instruction: "What would it signal if Elena wrote to the ayuntamiento in the SAME informal way she talks to Mateo?"
    correct_option: "It would come across as too casual and disrespectful for an institution."
    distractors: ["It would come across as more efficient and clear.", "It would come across as too formal and distant.", "It would make no difference at all."]
    accepted_answers: [{value: "It would come across as too casual and disrespectful for an institution.", status: correct}]
    feedback: "As Mateo says, 'al ayuntamiento le escribes de otra manera' -- informal register with an institution reads as too casual."
  es.b2.unit05.lesson06.exercise03.comprehend_request:
    instruction: "What does Elena want to do?"
    correct_option: "Reschedule the appointment."
    distractors: ["Cancel the appointment for good.", "Meet Mateo on Monday after all.", "Complain to the town hall."]
    accepted_answers: [{value: "Reschedule the appointment.", status: correct}]
    feedback: "Elena asks '¿podemos cambiar la cita?' -- she wants to reschedule."
  es.b2.unit05.lesson06.exercise04.speak_informal:
    instruction: "Say aloud in Spanish the SAME request, first to your friend Mateo -- informal, using puedes: Can you reschedule the appointment?"
    accepted_answers:
      - {value: "Puedes cambiar la cita", status: correct}
    feedback: "¿Puedes cambiar la cita? -- direct and informal, the right register for Mateo."
  es.b2.unit05.lesson06.exercise05.speak_formal:
    instruction: "Now say aloud in Spanish the SAME request to an institution -- formal, using Sería posible: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "Sería posible cambiar nuestra cita", status: correct}
    feedback: "¿Sería posible cambiar nuestra cita? -- indirect and formal, the right register for an institution."
  es.b2.unit05.lesson06.exercise06.write_rewrite_formal:
    instruction: "Rewrite this informal message to Mateo as a FORMAL one to an institution. Informal: 'Hola, Mateo, ¿podemos cambiar la cita?' Write the formal version as two parts: the salutation Estimado señor o señora, then the request using Sería posible."
    accepted_answers:
      - {value: "Estimado señor o señora, ¿Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Estimado señor o señora, Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Estimado señor o señora: ¿Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Estimado señor o señora: Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Estimado señor o señora, ¿Sería posible cambiar nuestra cita", status: correct}
      - {value: "Estimado señor o señora ¿Sería posible cambiar nuestra cita?", status: correct}
    feedback: "The formal rewrite swaps 'Hola, Mateo' for 'Estimado señor o señora' and the direct question for the indirect '¿Sería posible cambiar nuestra cita?'."
  es.b2.unit05.lesson06.exercise07.write_both_registers:
    instruction: "Write the SAME request TWICE. (1) informally to your friend Mateo, using puedes: Can you reschedule the appointment? (2) formally to an institution, using Sería posible: Would it be possible to reschedule our appointment?"
    accepted_answers:
      - {value: "¿Puedes cambiar la cita? ¿Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Puedes cambiar la cita? Sería posible cambiar nuestra cita?", status: correct}
      - {value: "¿Puedes cambiar la cita? Sería posible cambiar nuestra cita?", status: correct}
      - {value: "Puedes cambiar la cita. Sería posible cambiar nuestra cita.", status: correct}
    feedback: "Same request, two registers: informal '¿Puedes cambiar la cita?' for Mateo, formal '¿Sería posible cambiar nuestra cita?' for an institution."
