  es.a2.unit21.lesson05.teach.se_busca_note: {title: "Se busca: the impersonal se", gloss: "Why job postings phrase the opening this way.", note: "The same pattern appears in signs and ads: *se vende* (for sale), *se alquila* (for rent)."}

