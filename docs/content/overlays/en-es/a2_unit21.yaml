  es.a2.unit21.lesson06.teach.line03: {title: "Ask about motivation", gloss: "The interviewer asks why she's interested in this position.", note: "Reuses the interviewer's question from earlier in this unit."}
  es.a2.unit21.lesson06.teach.line04: {title: "Give the reason", gloss: "Elena says it's because it's closer to her house.", note: "Reuses Elena's answer from earlier in this unit."}
  es.a2.unit21.lesson06.teach.line05: {title: "Invite a question", gloss: "The interviewer acknowledges and asks if she has any questions for them.", note: "A natural interview-closing invitation, before Elena's own clarifying question."}
  es.a2.unit21.lesson06.teach.line06: {title: "Ask about the schedule", gloss: "Elena says yes, and asks what the work schedule is.", note: "Reuses the schedule question from earlier in this unit, after *sí*."}
