answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A2 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: "Spanish A2"
  description: "Intermediate Spanish continuing the Elena and Mateo storyline, now with a grammar-led block on reasons, order, purpose, conditions, indirect questions and passing on messages."
  learning_goal: "Explain reasons and consequences in Spanish with porque, así que, por eso and como."
units:
  es.a2.unit104.porque_asi_que: {"title": "Because and So", "description": "Give a reason and a consequence in one message, for example an excuse or a change of plan, with porque, así que, por eso, como and the question ¿por qué?."}
lessons:
  es.a2.unit104.lesson01.porque: {"title": "Because"}
  es.a2.unit104.lesson02.asi_que: {"title": "So, that is why"}
  es.a2.unit104.lesson03.como: {"title": "Como at the start"}
  es.a2.unit104.lesson04.una_excusa: {"title": "An excuse"}
  es.a2.unit104.lesson05.el_mensaje_de_elena: {"title": "Elena's Message"}
  es.a2.unit104.lesson06.elena_y_mateo: {"title": "Elena and Mateo Talk"}
teaching:
  es.a2.unit104.lesson01.teach.gn_porque: {"title": "Porque gives the reason", "gloss": "Elena arrives late because the train is late. Mateo does not go out because he has work. I am not going because I am tired.", "note": "*Porque* is one word and introduces the reason. The reason comes after it, with a normal verb in the present."}
  es.a2.unit104.lesson01.teach.gn_por_que: {"title": "¿Por qué? and porque", "gloss": "Why are you late? Because the train is late. Why are you not going out? Because it rains.", "note": "Ask with *¿por qué?* (two words, with an accent on *qué*). Answer with *porque* (one word, no accent)."}
  es.a2.unit104.lesson01.teach.palabras: {"title": "Words for excuses", "gloss": "late / tired / the train / the work / it rains / the office", "note": "*Llueve* is the form of *llover* for rain and has no subject. *Cansado* is used for a man; a woman says *cansada*.", "example_gloss": ["Mateo arrives late at the office because it rains.", "I am tired because I have a lot of work.", "Elena does not go out because it rains a lot.", "The train is late."]}
  es.a2.unit104.lesson01.teach.gn_orden: {"title": "The reason comes second", "gloss": "Mateo does not go out because it rains. I cannot go because I have work. Elena sleeps because she is tired.", "note": "First say what happens, then add *porque* and the reason. Both parts are complete sentences."}
  es.a2.unit104.lesson01.teach.frases: {"title": "Three sentences", "gloss": "I am late because the train is late. I am not going out because it rains. Why are you tired?"}
  es.a2.unit104.lesson02.teach.gn_asi_que: {"title": "Así que gives the result", "gloss": "It rains, so Mateo does not go out on his bike. The train is late, so Elena is late. I am tired, so I sleep.", "note": "*Así que* means so. Put the cause first, then *así que* and the result. A comma often comes before it."}
  es.a2.unit104.lesson02.teach.gn_por_eso: {"title": "Por eso starts a new sentence", "gloss": "It rains. That is why Mateo does not go out on his bike. I have work. That is why I am not going.", "note": "*Por eso* means that is why. It usually begins a new sentence and points back to the reason you just gave."}
  es.a2.unit104.lesson02.teach.gn_contraste: {"title": "Same idea, two orders", "gloss": "Mateo does not go out on his bike because it rains. It rains, so Mateo does not go out on his bike.", "note": "With *porque* the reason comes last. With *así que* the result comes last. The meaning is the same."}
  es.a2.unit104.lesson02.teach.palabras: {"title": "Words for results", "gloss": "to go out on a bike / to sleep / a lot / to arrive / also", "note": "*Mucho* before a noun changes with it, but after a verb it does not: *llueve mucho*.", "example_gloss": ["It rains a lot, so I do not go out on my bike.", "I am tired, that is why I sleep.", "Elena is also late.", "Mateo sleeps a lot."]}
  es.a2.unit104.lesson02.teach.frases: {"title": "Three sentences", "gloss": "It rains, so I do not go out. I have work. That is why I am late. I am tired, so I sleep."}
  es.a2.unit104.lesson03.teach.gn_como: {"title": "Como gives the reason first", "gloss": "Since it rains, Mateo does not go out on his bike. Since I am tired, I sleep. Since the train is late, Elena is late.", "note": "*Como* at the start of a sentence gives the reason first, then a comma, then the result. It means since or as."}
  es.a2.unit104.lesson03.teach.gn_como_orden: {"title": "Como or porque?", "gloss": "Since it rains, Mateo does not go out on his bike. Mateo does not go out on his bike because it rains.", "note": "Use *como* only at the beginning, with the reason first. Do not put *como* after the result: *Mateo no sale como llueve* is wrong."}
  es.a2.unit104.lesson03.teach.gn_cambio: {"title": "A change of plan", "gloss": "Since I have work, I cannot go. Since it rains, we cannot go out. Since I am tired, I am not going today.", "note": "This pattern is very useful to explain a change of plan: *Como...*, then *no puedo* or *no podemos*."}
  es.a2.unit104.lesson03.teach.palabras: {"title": "Plan words", "gloss": "since or as / to go / can or to be able / today / to go out", "note": "*Puedo* and *podemos* come from *poder*, which you already know. Use them with an infinitive.", "example_gloss": ["Since I have work, I cannot go.", "Since it rains, we are not going out today.", "Since I am tired, I sleep.", "Since the train is late, Elena calls Mateo."]}
  es.a2.unit104.lesson03.teach.frases: {"title": "Three sentences", "gloss": "Since it rains, I do not go out. Since I have work, I cannot go. Since I am tired, I sleep."}
  es.a2.unit104.lesson04.teach.gn_dos: {"title": "Reason and result together", "gloss": "I cannot go because I have work, so I call Elena. It rains a lot, that is why the train is late.", "note": "You can use a reason and a result in the same message. Say what you cannot do and why, then what follows."}
  es.a2.unit104.lesson04.teach.gn_elegir: {"title": "One idea, three patterns", "gloss": "I am tired. That is why I sleep. I sleep because I am tired. Since I am tired, I sleep.", "note": "All three say the same thing. *Por eso* and *así que* point to the result; *porque* points to the reason; *como* opens with the reason."}
  es.a2.unit104.lesson04.teach.gn_pregunta: {"title": "Ask and answer", "gloss": "Why are you not coming? I am not going because I am tired. Why are you late? I am late because it rains.", "note": "Friends ask *¿por qué?* when a plan changes. The short answer begins with *porque*."}
  es.a2.unit104.lesson04.teach.palabras: {"title": "Words for explaining", "gloss": "to come / to call / a lot / everything / slowly", "note": "*Vienes* is the *tú* form of *venir*. *Despacio* is slowly.", "example_gloss": ["Why are you not coming?", "It rains a lot and everything goes slowly.", "Mateo calls Elena because he is late.", "I am tired, so I am not going."]}
  es.a2.unit104.lesson04.teach.frases: {"title": "Three sentences", "gloss": "Why are you not coming? I cannot go because I have work. It rains a lot, so I call Elena."}
  es.a2.unit104.lesson05.teach.palabras: {"title": "Words for the message", "gloss": "to write / to wait / thanks / slowly / I am sorry", "note": "*Te escribo* means I write to you. *Te* is you.", "example_gloss": ["I am sorry, I am late today.", "I am writing to you because I cannot call.", "Can you wait?", "Thanks, Mateo."]}
  es.a2.unit104.lesson05.teach.gn_repaso: {"title": "Review", "gloss": "Today I am late because the train is late. Since I cannot call, I am writing to you.", "note": "In the message, find the reason with *porque*, the result with *así que* and the opening reason with *como*."}
  es.a2.unit104.lesson05.teach.lectura: {"title": "Elena writes to Mateo", "gloss": "Hi, Mateo. Today I am late because the train is late. It rains a lot, so everything goes slowly. Since I cannot call, I am writing to you. Can you wait? Thanks.", "note": "Look for *porque*, *así que* and *como*.", "glosses": {"tarde": "late", "despacio": "slowly", "escribo": "I write", "esperar": "to wait"}}
  es.a2.unit104.lesson06.teach.d1: {"title": "Elena asks", "gloss": "Elena: Hi, Mateo. Where are you?"}
  es.a2.unit104.lesson06.teach.d2: {"title": "Mateo explains", "gloss": "Mateo: I am at home. It rains a lot today, so I am not going out on my bike."}
  es.a2.unit104.lesson06.teach.d3: {"title": "Elena asks why", "gloss": "Elena: Why are you not going by train?"}
  es.a2.unit104.lesson06.teach.d4: {"title": "Mateo gives the reason", "gloss": "Mateo: Because the train is late. That is why I am waiting at home."}
  es.a2.unit104.lesson06.teach.d5: {"title": "Elena agrees", "gloss": "Elena: Okay. I am also late today."}
  es.a2.unit104.lesson06.teach.d6: {"title": "Mateo asks why", "gloss": "Mateo: Why?"}
  es.a2.unit104.lesson06.teach.d7: {"title": "Elena explains", "gloss": "Elena: Because my train leaves late. Since it rains, everything goes slowly."}
exercises:
  es.a2.unit104.lesson01.exercise01.elige_porque: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Llego tarde porque el tren llega tarde.", "distractors": ["Llego tarde por qué el tren llega tarde.", "Llego tarde porque el tren llegar tarde.", "Porque llego tarde el tren llega tarde."], "accepted_answers": [{"value": "Llego tarde porque el tren llega tarde.", "status": "correct"}], "feedback": "*Porque* is one word and the verb stays in the present: *porque el tren llega tarde*."}
  es.a2.unit104.lesson01.exercise02.elige_por_que: {"instruction": "Choose the correct answer to ¿Por qué no sales?", "correct_option": "Porque llueve.", "distractors": ["Por qué llueve.", "Porque llover.", "Así que llueve."], "accepted_answers": [{"value": "Porque llueve.", "status": "correct"}], "feedback": "The answer to *¿por qué?* starts with *porque*, in one word."}
  es.a2.unit104.lesson01.exercise03.une_causas: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "porque", "right": "because"}, {"left": "¿por qué?", "right": "why?"}, {"left": "tarde", "right": "late"}, {"left": "cansado", "right": "tired"}, {"left": "llueve", "right": "it rains"}, {"left": "el tren", "right": "the train"}, {"left": "el trabajo", "right": "work"}, {"left": "la oficina", "right": "the office"}], "status": "correct"}], "feedback": "*Porque* gives a reason; *¿por qué?* asks for it."}
  es.a2.unit104.lesson01.exercise04.ordena_trabajo: {"instruction": "Put the words in order to say 'Mateo does not go out because he has work.'", "correct_option": "Mateo no sale porque tiene trabajo", "accepted_answers": [{"value": "Mateo no sale porque tiene trabajo", "status": "correct"}], "feedback": "The reason follows *porque*."}
  es.a2.unit104.lesson01.exercise05.completa_porque: {"instruction": "Complete with the one-word connector that gives a reason.", "correct_option": "porque", "accepted_answers": [{"value": "porque", "status": "correct"}], "feedback": "*Porque* introduces the reason."}
  es.a2.unit104.lesson01.exercise06.traduce_cansado: {"instruction": "Translate into Spanish. Use *porque*.", "accepted_answers": [{"value": "No voy porque estoy cansado.", "status": "correct"}, {"value": "No voy porque estoy cansado", "status": "correct"}, {"value": "Yo no voy porque estoy cansado.", "status": "correct"}, {"value": "Yo no voy porque estoy cansado", "status": "correct"}, {"value": "No voy porque estoy cansada", "status": "correct"}, {"value": "Yo no voy porque estoy cansada", "status": "correct"}], "feedback": "*No voy porque estoy cansado.*"}
  es.a2.unit104.lesson01.exercise07.escribe_llueve: {"instruction": "Write the sentence with *porque*.", "correct_option": "Elena no sale porque llueve.", "accepted_answers": [{"value": "Elena no sale porque llueve.", "status": "correct"}, {"value": "Elena no sale porque llueve", "status": "correct"}, {"value": "Elena no sale porque llueve mucho.", "status": "correct"}, {"value": "Elena no sale porque llueve mucho", "status": "correct"}], "feedback": "*Elena no sale porque llueve.*"}
  es.a2.unit104.lesson02.exercise01.elige_asi_que: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Llueve, así que Mateo no sale en bici.", "distractors": ["Llueve, porque Mateo no sale en bici.", "Llueve, así Mateo no sale en bici.", "Así que llueve, Mateo no sale en bici."], "accepted_answers": [{"value": "Llueve, así que Mateo no sale en bici.", "status": "correct"}], "feedback": "*Así que* comes between the cause and the result."}
  es.a2.unit104.lesson02.exercise02.elige_por_eso: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Tengo trabajo. Por eso no voy.", "distractors": ["Tengo trabajo. Porque no voy.", "Tengo trabajo. Por qué no voy.", "Tengo trabajo. Por eso que no voy."], "accepted_answers": [{"value": "Tengo trabajo. Por eso no voy.", "status": "correct"}], "feedback": "*Por eso* means that is why, and it needs no *que*."}
  es.a2.unit104.lesson02.exercise03.une_conectores: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "porque", "right": "because (the reason follows)"}, {"left": "así que", "right": "so (the result follows)"}, {"left": "por eso", "right": "that is why"}, {"left": "¿por qué?", "right": "why? (a question)"}, {"left": "también", "right": "also"}, {"left": "mucho", "right": "a lot"}, {"left": "dormir", "right": "to sleep"}, {"left": "salir en bici", "right": "to go out on a bike"}], "status": "correct"}], "feedback": "Three connectors, three jobs: reason, result, question."}
  es.a2.unit104.lesson02.exercise04.ordena_cansado: {"instruction": "Put the words in order to say 'I am tired, so I sleep.'", "correct_option": "Estoy cansado así que duermo", "accepted_answers": [{"value": "Estoy cansado así que duermo", "status": "correct"}], "feedback": "Cause first, then *así que*, then the result."}
  es.a2.unit104.lesson02.exercise05.completa_asi: {"instruction": "Complete the connector that means so.", "correct_option": "así", "accepted_answers": [{"value": "así", "status": "correct"}], "feedback": "*Así que* means so."}
  es.a2.unit104.lesson02.exercise06.traduce_por_eso: {"instruction": "Translate into Spanish. Use *por eso*.", "accepted_answers": [{"value": "Tengo trabajo. Por eso no voy.", "status": "correct"}, {"value": "Tengo trabajo. Por eso no voy", "status": "correct"}, {"value": "Tengo trabajo, por eso no voy.", "status": "correct"}, {"value": "Tengo trabajo, por eso no voy", "status": "correct"}], "feedback": "*Tengo trabajo. Por eso no voy.*"}
  es.a2.unit104.lesson02.exercise07.escribe_asi_que: {"instruction": "Write the sentence with *así que*.", "correct_option": "El tren llega tarde, así que Elena llega tarde.", "accepted_answers": [{"value": "El tren llega tarde, así que Elena llega tarde.", "status": "correct"}, {"value": "El tren llega tarde, así que Elena llega tarde", "status": "correct"}, {"value": "El tren llega tarde así que Elena llega tarde.", "status": "correct"}, {"value": "El tren llega tarde así que Elena llega tarde", "status": "correct"}], "feedback": "*El tren llega tarde, así que Elena llega tarde.*"}
  es.a2.unit104.lesson03.exercise01.elige_como: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Como llueve, Mateo no sale en bici.", "distractors": ["Mateo no sale en bici como llueve.", "Como llueve Mateo no sale en bici porque.", "Como llueve, porque Mateo no sale en bici."], "accepted_answers": [{"value": "Como llueve, Mateo no sale en bici.", "status": "correct"}], "feedback": "*Como* + reason comes first, then the result."}
  es.a2.unit104.lesson03.exercise02.elige_orden: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "Como tengo trabajo, no puedo ir.", "distractors": ["Tengo trabajo como no puedo ir.", "Como no puedo ir, porque tengo trabajo.", "No puedo ir, como tengo trabajo."], "accepted_answers": [{"value": "Como tengo trabajo, no puedo ir.", "status": "correct"}], "feedback": "Start with *como* and the reason."}
  es.a2.unit104.lesson03.exercise03.une_como: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "Como llueve, no salgo.", "right": "Since it rains, I do not go out."}, {"left": "Llueve, así que no salgo.", "right": "It rains, so I do not go out."}, {"left": "No salgo porque llueve.", "right": "I do not go out because it rains."}, {"left": "Llueve. Por eso no salgo.", "right": "It rains. That is why I do not go out."}, {"left": "Como estoy cansado, duermo.", "right": "Since I am tired, I sleep."}, {"left": "Duermo porque estoy cansado.", "right": "I sleep because I am tired."}], "status": "correct"}], "feedback": "Four ways to link rain and staying in. Look at where the reason stands."}
  es.a2.unit104.lesson03.exercise04.ordena_ir: {"instruction": "Put the words in order to say 'I cannot go because I have work.'", "correct_option": "No puedo ir porque tengo trabajo", "accepted_answers": [{"value": "No puedo ir porque tengo trabajo", "status": "correct"}], "feedback": "*No puedo ir* first, then *porque* and the reason."}
  es.a2.unit104.lesson03.exercise05.completa_como: {"instruction": "Complete with the word that starts the reason.", "correct_option": "Como", "accepted_answers": [{"value": "Como", "status": "correct"}], "feedback": "*Como llueve, Mateo no sale en bici.*"}
  es.a2.unit104.lesson03.exercise06.traduce_como: {"instruction": "Translate into Spanish. Use *como*.", "accepted_answers": [{"value": "Como estoy cansado, duermo.", "status": "correct"}, {"value": "Como estoy cansado, duermo", "status": "correct"}, {"value": "Como estoy cansado duermo.", "status": "correct"}, {"value": "Como estoy cansado duermo", "status": "correct"}, {"value": "Como estoy cansada, duermo.", "status": "correct"}, {"value": "Como estoy cansada, duermo", "status": "correct"}], "feedback": "*Como estoy cansado, duermo.*"}
  es.a2.unit104.lesson03.exercise07.escribe_como: {"instruction": "Write the sentence starting with *Como*.", "correct_option": "Como tengo trabajo, no puedo ir.", "accepted_answers": [{"value": "Como tengo trabajo, no puedo ir.", "status": "correct"}, {"value": "Como tengo trabajo, no puedo ir", "status": "correct"}, {"value": "Como tengo trabajo no puedo ir.", "status": "correct"}, {"value": "Como tengo trabajo no puedo ir", "status": "correct"}], "feedback": "*Como tengo trabajo, no puedo ir.*"}
  es.a2.unit104.lesson04.exercise01.elige_pregunta: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "¿Por qué no vienes?", "distractors": ["¿Porque no vienes?", "¿Por qué no vienes porque?", "¿Así que no vienes?"], "accepted_answers": [{"value": "¿Por qué no vienes?", "status": "correct"}], "feedback": "The question is *¿por qué...?* in two words, with an accent."}
  es.a2.unit104.lesson04.exercise02.elige_respuesta: {"instruction": "Choose the correct Spanish sentence.", "correct_option": "No voy porque estoy cansado.", "distractors": ["No voy así que estoy cansado.", "No voy por qué estoy cansado.", "No voy como estoy cansado."], "accepted_answers": [{"value": "No voy porque estoy cansado.", "status": "correct"}], "feedback": "After the result, the reason follows *porque*."}
  es.a2.unit104.lesson04.exercise03.une_excusa: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "¿Por qué no vienes?", "right": "Why are you not coming?"}, {"left": "No puedo ir porque tengo trabajo.", "right": "I cannot go because I have work."}, {"left": "Como llueve, no salgo.", "right": "Since it rains, I do not go out."}, {"left": "Llueve, así que llamo a Elena.", "right": "It rains, so I call Elena."}, {"left": "El tren llega tarde. Por eso llego tarde.", "right": "The train is late. That is why I am late."}, {"left": "Todo va despacio.", "right": "Everything goes slowly."}], "status": "correct"}], "feedback": "Each line is one step in an excuse."}
  es.a2.unit104.lesson04.exercise04.ordena_llamo: {"instruction": "Put the words in order to say 'It rains a lot, so I call Elena.'", "correct_option": "Llueve mucho así que llamo a Elena", "accepted_answers": [{"value": "Llueve mucho así que llamo a Elena", "status": "correct"}], "feedback": "Cause, *así que*, result."}
  es.a2.unit104.lesson04.exercise05.completa_asi_que: {"instruction": "Complete the connector for the result.", "correct_option": "así", "accepted_answers": [{"value": "así", "status": "correct"}], "feedback": "*Estoy cansado, así que no voy.*"}
  es.a2.unit104.lesson04.exercise06.traduce_excusa: {"instruction": "Translate into Spanish. Use *porque*.", "accepted_answers": [{"value": "No puedo ir porque tengo trabajo.", "status": "correct"}, {"value": "No puedo ir porque tengo trabajo", "status": "correct"}, {"value": "Yo no puedo ir porque tengo trabajo.", "status": "correct"}, {"value": "Yo no puedo ir porque tengo trabajo", "status": "correct"}], "feedback": "*No puedo ir porque tengo trabajo.*"}
  es.a2.unit104.lesson04.exercise07.escribe_dos: {"instruction": "Write exactly two sentences. First use *así que*, then *por eso*.", "correct_option": "Llueve mucho, así que no salgo. Tengo trabajo, por eso llego tarde.", "accepted_answers": [{"value": "Llueve mucho, así que no salgo. Tengo trabajo, por eso llego tarde.", "status": "correct"}, {"value": "Llueve mucho, así que no salgo. Tengo trabajo, por eso llego tarde", "status": "correct"}, {"value": "Llueve mucho, así que no salgo. Tengo trabajo. Por eso llego tarde.", "status": "correct"}, {"value": "Llueve mucho, así que no salgo. Tengo trabajo. Por eso llego tarde", "status": "correct"}], "feedback": "*Llueve mucho, así que no salgo. Tengo trabajo, por eso llego tarde.*"}
  es.a2.unit104.lesson05.exercise01.lee_tarde: {"instruction": "Read the text and choose the answer.", "correct_option": "Because the train is late.", "distractors": ["Because she is tired.", "Because she has work.", "Because Mateo is late."], "accepted_answers": [{"value": "Because the train is late.", "status": "correct"}], "feedback": "*Hoy llego tarde porque el tren llega tarde.*"}
  es.a2.unit104.lesson05.exercise02.lee_lluvia: {"instruction": "Read the text and choose the answer.", "correct_option": "Everything.", "distractors": ["Only Mateo.", "Only the office.", "Nothing."], "accepted_answers": [{"value": "Everything.", "status": "correct"}], "feedback": "*Llueve mucho, así que todo va despacio.*"}
  es.a2.unit104.lesson05.exercise03.une_mensaje: {"instruction": "Match each Spanish expression to its meaning.", "accepted_answers": [{"value": [{"left": "Hoy llego tarde.", "right": "Today I am late."}, {"left": "El tren llega tarde.", "right": "The train is late."}, {"left": "Todo va despacio.", "right": "Everything goes slowly."}, {"left": "Como no puedo llamar, te escribo.", "right": "Since I cannot call, I am writing to you."}, {"left": "¿Puedes esperar?", "right": "Can you wait?"}, {"left": "Gracias.", "right": "Thanks."}], "status": "correct"}], "feedback": "These lines come from Elena's message."}
