    correct_option: "Mateo dice que llega tarde."
    distractors: ["Elena pregunta si tengo la llave.", "Elena dijo que llegó tarde a la reunión."]
    accepted_answers: ["Mateo dice que llega tarde."]
  es.b1.unit34.lesson01.exercise03.match_mateo:
    instruction: "Match each word or phrase to its meaning."
    correct_response:
      "dice": "says"
      "que": "that"
      "llega": "arrives"
      "tarde": "late"
      "Mateo dice que llega tarde": "Mateo says that he's arriving late"
  es.b1.unit34.lesson01.exercise04.order_mateo:
    instruction: "Build the sentence: Mateo says that he's arriving late."
    correct_response: [Mateo, dice, que, llega, tarde]
  es.b1.unit34.lesson01.exercise05.translate_mateo:
    instruction: "Translate to Spanish using the exact opening \"Mateo dice que\": Mateo says that he's arriving late."
