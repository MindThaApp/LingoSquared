exercises:
  es.b1.unit34.lesson01.exercise01.choose_mateo:
    instruction: "Which sentence reports what Mateo said?"
    correct_option: "Mateo dice que llega tarde."
    distractors: ["Elena pregunta si tengo la llave.", "Elena dijo que llegó tarde a la reunión."]
    accepted_answers: ["Mateo dice que llega tarde."]
