  es.c1.unit06.lesson05.teach.el_texto:
    title: "Figurative language in a story"
    gloss: "My student did not sleep a wink last night. I told him not to throw in the towel and to pay attention. Breaking the ice at first was difficult, but in the end everything was a piece of cake. He said to me: 'Thank you, you hit the nail on the head'."
