review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English glosses
    match idiomatic pan-Hispanic Spanish, that every matching_pairs right-hand
    clue discriminates its left on real meaning, that the calque traps
    (hacer una decisión / hacer sentido / pagar atención) are marked wrong and
    the natural collocations (tomar una decisión / tener sentido / prestar
    atención) right, and that the culminating writing answer (lesson06)
    accepts the punctuation forms a correct learner would actually produce.
    See the realization file's review block for the full priority list.
  notes: >-
    Overlay for Spanish's sixth C1 unit, authored alongside the realization
    (no adaptable public-domain Spanish source was used; see the realization
    provenance note). English speakers' real interference risks for this
    outcome: (1) translating idioms word for word (a calque) instead of
    using the natural Spanish idiom -- 'to lend a hand' is not 'prestar una
    mano' but 'echar una mano'; (2) collocation-verb traps -- 'make a
    decision' is 'tomar una decisión', never 'hacer una decisión', and 'make
    sense' is 'tener sentido', never 'hacer sentido'; (3) 'pay attention' is
    'prestar atención', never 'pagar atención'; (4) literal readings of
    metaphors -- 'llover a cántaros' is 'to rain cats and dogs', not about
    real pitchers. No sibling-direction file (es-en) was consulted.

course:
  title: Spanish C1
  description: >-
    Advanced Spanish idiomatic and figurative language: understand and use
    idioms, collocations, and metaphors naturally, choosing
    register-appropriate expressions and avoiding literal calques.

units:
  es.c1.unit06.el_lenguaje_figurado:
    title: "Figurative language"
    description: "Understand and use idioms, collocations, and figurative expressions naturally -- and avoid literal calques."

