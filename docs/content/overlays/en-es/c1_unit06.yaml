exercises:
  es.c1.unit06.lesson01.exercise01.recognize_el_modismo:
    instruction: "What does el modismo mean?"
    correct_option: "A fixed expression whose meaning is not the sum of its words."
    distractors: ["A single word.", "A literal translation.", "A grammar rule."]
    accepted_answers: [{value: "A fixed expression whose meaning is not the sum of its words.", status: correct}]
    feedback: "*El modismo* is a fixed idiomatic expression."
  es.c1.unit06.lesson01.exercise02.recognize_el_calco:
    instruction: "What is un calco?"
    correct_option: "A word-for-word translation of an idiom that sounds wrong."
    distractors: ["A correct, natural idiom.", "A metaphor.", "A rhyme."]
    accepted_answers: [{value: "A word-for-word translation of an idiom that sounds wrong.", status: correct}]
    feedback: "*El calco* is a literal calque -- copying an idiom word for word."
  es.c1.unit06.lesson01.exercise03.match_conceptos:
    instruction: "Match each figurative-language term to its English meaning."
    accepted_answers:
      - value: {"el modismo": "the idiom", "la colocación": "the collocation", "la metáfora": "the metaphor", "el sentido figurado": "the figurative meaning", "el calco": "the calque", "la expresión idiomática": "the idiomatic expression"}
        status: correct
    feedback: "The building blocks of figurative language."
  es.c1.unit06.lesson01.exercise04.order_sentido_figurado:
    instruction: "Put the Spanish words in order to say figurative meaning is not literal."
    accepted_answers:
      - {value: "El sentido figurado no es literal", status: correct}
    feedback: "*El sentido figurado* is not literal."
  es.c1.unit06.lesson01.exercise05.translate_modismo:
