  es.c1.unit06.lesson03.colocaciones_naturales:
    title: "Natural collocations"
  es.c1.unit06.lesson04.metaforas_de_todos_los_dias:
    title: "Everyday metaphors"
  es.c1.unit06.lesson05.leer_el_sentido_figurado:
    title: "Reading figurative language"
  es.c1.unit06.lesson06.hablar_con_naturalidad:
    title: "Speaking naturally"

