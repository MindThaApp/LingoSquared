      Mi: "my"
      alumno: "student"
      "no": "not"
      pegó: "slept (no pegar ojo = to not sleep a wink)"
      ojo: "eye"
      anoche: "last night"
      Le: "to him"
      dije: "I told"
      que: "that"
      tirara: "throw (no tirar la toalla = to not throw in the towel)"
      la: "the"
      toalla: "towel"
      y: "and"
      prestara: "pay (prestar atención = to pay attention)"
      atención: "attention"
      Romper: "to break"
      el: "the"
      hielo: "ice"
      al: "at the"
      principio: "beginning"
      fue: "was"
      difícil: "difficult"
      pero: "but"
      final: "end (al final = in the end)"
      todo: "everything"
      era: "was"
      pan: "bread"
      comido: "eaten (ser pan comido = to be a piece of cake)"
      Me: "to me"
      dijo: "said"
      Gracias: "thank you"
      diste: "you hit (dar en el clavo = to hit the nail on the head)"
      en: "in"
      clavo: "nail"
    note: "The passage mixes an idiom, a collocation, and a metaphor -- each contributes a non-literal meaning."
