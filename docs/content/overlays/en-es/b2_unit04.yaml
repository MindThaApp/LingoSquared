review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Confirm the English
    glosses match idiomatic pan-Hispanic Spanish, and see the
    realization file's review block for the full priority list
    (imperfect/preterite consistency, pluperfect naturalness, and the
    "antes de mi llegada" substitution for the untaught imperfect
    subjunctive).
  notes: >-
    Overlay for es's fourth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English uses one past tense ("I was", "I woke up", "I had left") for
    three grammatically distinct jobs that Spanish marks morphologically
    (imperfect *estaba* for background, preterite *desperté* for a
    foregrounded event, pluperfect *había salido* for the pre-past) --
    this is the single highest-risk confusion for this outcome and is
    flagged explicitly in lesson01/02/04's notes; (2) English "while"
    covers both an ongoing background action (*mientras* + imperfect)
    and a plain conjunction, so the mapping to *mientras* needs to be
    tied specifically to the imperfect in lesson03; (3) "already" in
    English attaches loosely to any past tense, while Spanish *ya* +
    pluperfect is a fixed pattern (*ya se había ido*) -- flagged in
    lesson04. No sibling-direction file (es-en b2) was consulted.

course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: recount a complex sequence of past
    events with shifting time reference -- background versus foreground
    (hacía frío / me desperté), an action interrupted by another
    (mientras esperaba, sonó el teléfono), and something that had
    already happened before the story starts (el autobús ya se había
    ido) -- keeping the timeline unambiguous.

units:
  es.b2.unit04.relato:
    title: "Narrative"
    description: Recount a complex sequence of events with shifting time reference, keeping the timeline unambiguous.

lessons:
  es.b2.unit04.lesson01.el_trasfondo:
    title: "The background: how things were"
  es.b2.unit04.lesson02.el_suceso:
    title: "The event and the sequence"
  es.b2.unit04.lesson03.cuando_mientras:
    title: "When, while"
  es.b2.unit04.lesson04.el_pasado_antes:
    title: "The past before the past"
  es.b2.unit04.lesson05.que_paso_primero:
    title: "What happened first?"
  es.b2.unit04.lesson06.contar_la_historia:
    title: "Telling the whole story"

teaching:
  es.b2.unit04.lesson01.teach.hacia_frio:
    title: "It was cold."
    gloss: "It was cold."
    note: "*Hacía frío* uses the IMPERFECT (*hacía*, not *hizo*) -- weather description is background, not a foregrounded event."
  es.b2.unit04.lesson01.teach.eran_las_siete:
    title: "It was seven in the morning."
    gloss: "It was seven in the morning."
    note: "Telling time in the past always uses the imperfect (*eran las siete*, never *fueron las siete*) -- another background fact, not an event."
  es.b2.unit04.lesson01.teach.cama:
    title: "the bed"
    gloss: "the bed"
    example_gloss: "I was still in bed."
  es.b2.unit04.lesson01.teach.estaba_en_la_cama:
    title: "I was still in bed."
    gloss: "I was still in bed."
    note: "*Estaba* (imperfect) describes an ongoing state at that moment -- the scene the story will interrupt, not an action in the story's timeline."
  es.b2.unit04.lesson01.teach.reunion_importante:
    title: "an important meeting"
    gloss: "an important meeting"
  es.b2.unit04.lesson01.teach.esta_manana:
    title: "this morning"
    gloss: "this morning"
  es.b2.unit04.lesson01.teach.claim_model:
    title: "This morning I arrived late to an important meeting."
    gloss: "This morning I arrived late to an important meeting."
    note: "*Llegué* is PRETERITE -- the one-time foregrounded event the whole story explains. Everything in this lesson (imperfect) sets the scene BEFORE this happened."
  es.b2.unit04.lesson01.teach.grammar_trasfondo:
    title: "It was cold. It was seven o'clock. I was still in bed. The imperfect describes how everything was, the background of the story."
    gloss: "It was cold. It was seven o'clock. I was still in bed. The imperfect describes how everything was, the background of the story."
    note: "Background = the ongoing state of things when the story begins, always in the IMPERFECT (*hacía*, *eran*, *estaba*) -- distinct from the one-time events lesson02 teaches in the preterite."

  es.b2.unit04.lesson02.teach.desperte:
    title: "I woke up"
    gloss: "I woke up (preterite of despertarse)"
    note: "*Me desperté* is PRETERITE -- a single completed event, the first domino in the story's timeline."
    example_gloss: "I woke up late."
  es.b2.unit04.lesson02.teach.sali_de_casa:
    title: "I left home"
    gloss: "I left home (preterite of salir)"
  es.b2.unit04.lesson02.teach.corriendo:
    title: running
    gloss: "running (gerund of correr)"
    example_gloss: "I left home running."
  es.b2.unit04.lesson02.teach.primero_luego_despues:
    title: "first, then, afterward"
    gloss: "first, then, afterward"
    note: "*Primero... luego... después...* sequences foregrounded events explicitly, the same job *en primer lugar* did for arguments back in unit01."
  es.b2.unit04.lesson02.teach.entonces:
    title: "then / so"
    gloss: "then / so"
    example_gloss: "Then I ran to the stop."
  es.b2.unit04.lesson02.teach.parada:
    title: "the (bus) stop"
    gloss: "the bus stop"
    example_gloss: "I waited for the bus at the stop."
  es.b2.unit04.lesson02.teach.claim_model:
    title: "I woke up late. I left home running. First I ran, then I arrived at the stop."
    gloss: "I woke up late. I left home running. First I ran, then I arrived at the stop."
    note: "Every verb here is PRETERITE -- a chain of one-time completed events, the foreground of the story."
  es.b2.unit04.lesson02.teach.grammar_suceso:
    title: "I woke up late. I left home running. The preterite tells the events, one after another, in the foreground."
    gloss: "I woke up late. I left home running. The preterite tells the events, one after another, in the foreground."
    note: "Foreground = the actual chain of events, always in the PRETERITE (*desperté*, *salí*, *llegué*, *corrí*) -- the contrast with lesson01's background imperfect is the core of this unit."

  es.b2.unit04.lesson03.teach.mientras:
    title: while
    gloss: while
    note: "*Mientras* + IMPERFECT sets up an ongoing background action that a foregrounded event (preterite) then interrupts."
    example_gloss: "While I was waiting, a taxi arrived."
  es.b2.unit04.lesson03.teach.esperaba:
    title: "was waiting"
    gloss: "was waiting (imperfect of esperar)"
    example_gloss: "I was waiting for the bus at the stop."
  es.b2.unit04.lesson03.teach.cuando:
    title: when
    gloss: when
    note: "*Cuando* + PRETERITE (*cuando llegué*) marks the foregrounded event itself, unlike *mientras* + imperfect, which marks the ongoing background it interrupts."
    example_gloss: "When I arrived, it was already late."
  es.b2.unit04.lesson03.teach.sono_telefono:
    title: "the phone rang"
    gloss: "the phone rang (preterite of sonar)"
  es.b2.unit04.lesson03.teach.taxi:
    title: "a taxi"
    gloss: "a taxi"
    example_gloss: "A taxi arrived."
  es.b2.unit04.lesson03.teach.claim_model:
    title: "While I was waiting for a taxi, the phone rang."
    gloss: "While I was waiting for a taxi, the phone rang."
    note: "The model interruption: *mientras esperaba* (imperfect, ongoing) + *sonó* (preterite, the interrupting event)."
  es.b2.unit04.lesson03.teach.grammar_interrupcion:
    title: "While I was waiting for a taxi (imperfect, the ongoing action), the phone rang (preterite, the interrupting action)."
    gloss: "While I was waiting for a taxi (imperfect, the ongoing action), the phone rang (preterite, the interrupting action)."
    note: "An interrupted action always pairs an imperfect (the ongoing background action) with a preterite (the single event that cuts across it)."

  es.b2.unit04.lesson04.teach.habia_salido:
    title: "had left"
    gloss: "had left (pluperfect of salir)"
    note: "*Había* + past participle is the PLUPERFECT -- an event that had already finished before the story's own timeline even starts."
  es.b2.unit04.lesson04.teach.se_habia_ido:
    title: "had already left"
    gloss: "had already left / gone away"
  es.b2.unit04.lesson04.teach.claim_model:
    title: "The bus had already left."
    gloss: "The bus had already left."
    note: "The model pre-past event: by the time the narrator's own story catches up to the bus stop, the bus leaving is already finished."
  es.b2.unit04.lesson04.teach.antes_de:
    title: before
    gloss: before
  es.b2.unit04.lesson04.teach.llegada:
    title: "my arrival"
    gloss: "my arrival"
    example_gloss: "Before my arrival, the bus had already left."
  es.b2.unit04.lesson04.teach.claim_model2:
    title: "The bus had already left before my arrival."
    gloss: "The bus had already left before my arrival."
    note: "*Antes de mi llegada* (a noun phrase) sidesteps needing the imperfect subjunctive that a full clause (\"before I arrived\") would require -- a natural, simpler alternative this unit deliberately uses instead."
  es.b2.unit04.lesson04.teach.grammar_pluscuamperfecto:
    title: "The bus had already left. The pluperfect (había + participle) tells the past before the past -- what had already happened when the story begins."
    gloss: "The bus had already left. The pluperfect (había + participle) tells the past before the past -- what had already happened when the story begins."
    note: "The pluperfect is the third and final time layer this unit teaches: background (imperfect) and foreground (preterite) both happen AFTER whatever the pluperfect describes."

  es.b2.unit04.lesson05.teach.texto:
    title: "Reading: a chaotic morning"
    gloss: "It was very cold this morning. It was seven o'clock and I was still in bed. I woke up late and left home running. When I arrived at the stop, the bus had already left. While I was waiting for a taxi, the phone rang: it was my boss. I finally arrived at the meeting, but they had already started."
    glosses:
      jefe: boss
      fin: "end (por fin = finally)"
      habían: "had (third person plural, pluperfect of haber)"
      empezado: "started (past participle of empezar)"
  es.b2.unit04.lesson06.teach.tuve_horrible:
    title: "I had a horrible morning."
    gloss: "I had a horrible morning."
    note: "*Tuve* (preterite of tener) frames the whole account -- a single completed morning being reported as a whole."
  es.b2.unit04.lesson06.teach.que_paso:
    title: "What happened?"
    gloss: "What happened?"
    note: "*¿Qué pasó?* (preterite) is the natural question that invites a full narrative recount."
  es.b2.unit04.lesson06.teach.alarma:
    title: "the alarm"
    gloss: "the alarm"
    example_gloss: "The alarm rang."
  es.b2.unit04.lesson06.teach.tan:
    title: "so (that)"
    gloss: "so / such a"
    example_gloss: "What a horrible morning!"
  es.b2.unit04.lesson06.teach.dialogue_mateo_que_paso:
    title: "Mateo: What happened this morning?"
    gloss: "Mateo: What happened this morning?"
  es.b2.unit04.lesson06.teach.dialogue_elena_background:
    title: "Elena: I had a horrible morning. It was very cold and I was still in bed when the alarm rang."
    gloss: "Elena: I had a horrible morning. It was very cold and I was still in bed when the alarm rang."
  es.b2.unit04.lesson06.teach.dialogue_elena_sequence:
    title: "Elena: I woke up late, left home running, but the bus had already left."
    gloss: "Elena: I woke up late, left home running, but the bus had already left."
  es.b2.unit04.lesson06.teach.dialogue_elena_interruption:
    title: "Elena: While I was waiting for a taxi, the phone rang: it was my boss."
    gloss: "Elena: While I was waiting for a taxi, the phone rang: it was my boss."
  es.b2.unit04.lesson06.teach.dialogue_elena_end:
    title: "Elena: I finally arrived at the meeting, but they had already started."
    gloss: "Elena: I finally arrived at the meeting, but they had already started."
  es.b2.unit04.lesson06.teach.dialogue_mateo_reaction:
    title: "Mateo: What a horrible morning!"
    gloss: "Mateo: What a horrible morning!"
  es.b2.unit04.lesson06.teach.grammar_historia_completa:
    title: "Background (it was cold, I was in bed) + interruption (while I was waiting, the phone rang) + past before the past (the bus had already left) = a complete story."
    gloss: "Background (it was cold, I was in bed) + interruption (while I was waiting, the phone rang) + past before the past (the bus had already left) = a complete story."
    note: "All three time layers together: this is exactly what the speaking and writing tasks of this lesson require you to produce in one account."

exercises:
