teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Asking the total price
    gloss: How much does it cost in total?
    note: '*En total* clarifies that you want the full combined price, not the price of one item.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Stating a total price
    gloss: It costs twenty-five euros in total.
    note: '*Cuesta* is the third-person singular of *costar* (to cost); the stem vowel changes from *o* to *ue* when it is stressed.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Paying by card or in cash
    gloss: to pay by card, to pay cash
    note: '*Pagar con tarjeta* (to pay by card) and *pagar en efectivo* (to pay cash) use different prepositions: *con* for the tool, *en* for the form of money.'
    example_gloss:
    - Can I pay by card here?
    - I'm paying in cash.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Asking if card payment is possible
    gloss: Can I pay by card here?
    note: '*Puedo* (I can) is the *yo* form of *poder*; *aquí* (here) places the question at the current location.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Asking about payment preference
    gloss: Would you like to pay cash or by card?
    note: '*Quiere* is the formal *usted* form of *querer*, used here by an unfamiliar cashier; with a friend you would say *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: The bill
    gloss: the bill
    note: 'A feminine noun: *la cuenta*. In a restaurant it is the bill; at a bank it is the account.'
    example_gloss: Shall we split the bill?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Suggesting to split the bill
    gloss: Shall we split the bill?
    note: '*¿Dividimos...?* uses the *nosotros* form to make a suggestion, like English ''shall we...?''.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Asking to pay separately
    gloss: May I pay separately?
    note: '*Por separado* (separately) says how you pay; *pagar* (to pay) is the everyday verb for it.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: The change
    gloss: the change
    note: 'A masculine noun: *el cambio*. It also means a change of anything, as in *un cambio de planes*.'
    example_gloss: Here's your change.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Handing over change
    gloss: Here's your change.
    note: '*Su* is the possessive that matches formal *usted* (''your''); *Aquí tiene* is the usual polite way to hand something over.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Declining change
    gloss: I don't need change.
    note: '*Necesitar* (to need) takes its object directly, with no preposition: *necesito cambio*; *no* negates the verb.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Thirty-five
    gloss: thirty-five
    note: '*Treinta y cinco* (thirty-five): from 31 to 99 Spanish joins tens and units with *y*, written as separate words.'
    example_gloss: It costs thirty-five euros.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Read a restaurant bill
    gloss: 'Bill: two main courses and two coffees. Total: thirty-five euros. Paid by card.'
    note: Track what was ordered, the total, and how it was paid.
    glosses:
      Cuenta: bill
      dos: two
      platos: main courses
      cafés: coffees
      Total: total
      treinta: thirty-five
      euros: euros
      Pagado: paid
      tarjeta: card
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena asks for the bill
    gloss: 'Elena: Shall we ask for the bill?'
    note: '*Pedir* (to ask for, to order) takes *la cuenta* as its direct object: *pedimos la cuenta* (we ask for the bill).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo asks the total
    gloss: 'Mateo: Yes, good idea. How much does it cost in total?'
    note: Reuses the question *¿cuánto cuesta en total?* from lesson01.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena states the total
    gloss: 'Elena: It''s thirty-five euros. Shall we split it?'
    note: '*Son* is used with amounts of money: *son treinta y cinco euros* takes the plural verb because the amount is plural.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo insists on paying
    gloss: 'Mateo: No, let me pay today. You''ve helped me so much.'
    note: '*Deja que pague yo* (let me pay) uses the subjunctive *pague* after *que*; learn it as a fixed offer for now. *Me has ayudado* is the present perfect (you have helped me).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena is touched
    gloss: 'Elena: That''s sweet of you! Thank you.'
    note: '*¡Qué amable eres!* (how kind you are!) uses *qué* + adjective to react warmly to a generous gesture; *muchas gracias* is a stronger *thank you*.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo asks about paying by card
    gloss: 'Mateo: Can I pay by card here?'
    note: Reuses the question *¿puedo pagar con tarjeta aquí?* from lesson02, now in the actual restaurant.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: the he/she form'
    gloss: Mateo pays the bill.
    note: '*Paga* is the third-person singular of *pagar* (to pay): *Mateo paga la cuenta*.'
