course:
  title: Spanish B2
  description: >-
    Upper-intermediate Spanish: express nuance -- soften a statement (un
    poco, no está mal, no es que... sino que...) or emphasize it (sí que,
    de hecho, sin duda, lo que más me gusta es...) so the same content
    can be delivered tentatively, neutrally, or emphatically.

units:
  es.b2.unit03.matices:
    title: "Nuance"
    description: Soften or strengthen a statement so the same content can be delivered tentatively, neutrally, or emphatically.

lessons:
  es.b2.unit03.lesson01.suavizar:
    title: "Softening a statement"
  es.b2.unit03.lesson02.formular_con_cuidado:
    title: "Formulating carefully"
  es.b2.unit03.lesson03.enfatizar:
    title: "Emphasizing something"
  es.b2.unit03.lesson04.poner_el_foco:
    title: "Putting the focus on it"
  es.b2.unit03.lesson05.leer_una_resena:
    title: "Reading a review"
  es.b2.unit03.lesson06.matices_en_conversacion:
    title: "Nuance in conversation"

teaching:
  es.b2.unit03.lesson01.teach.un_poco:
    title: "a little"
    gloss: "a little / a bit"
    note: "*Un poco* softens an adjective -- 'a little expensive' rather than a flat 'expensive'."
    example_gloss: "The restaurant is a little expensive."
  es.b2.unit03.lesson01.teach.algo:
    title: somewhat
    gloss: "somewhat / a bit"
    note: "*Algo* before an adjective is a close synonym of *un poco* -- 'somewhat expensive'."
    example_gloss: "The restaurant is somewhat expensive."
  es.b2.unit03.lesson01.teach.no_esta_mal:
    title: "not bad"
    gloss: "not bad"
    note: "*No está mal* damns with faint praise, on purpose -- a hedge, not a real compliment."
  es.b2.unit03.lesson01.teach.mas_bien:
    title: rather
    gloss: rather
    note: "*Más bien* softens by reframing: 'rather expensive' presents the claim as a nuance, not a flat verdict."
  es.b2.unit03.lesson01.teach.restaurante:
    title: "the restaurant"
    gloss: "the restaurant"
    example_gloss: "The restaurant isn't bad."
  es.b2.unit03.lesson01.teach.caro:
    title: expensive
    gloss: expensive
    example_gloss: "It's a little expensive."
  es.b2.unit03.lesson01.teach.claim_model:
    title: "The restaurant is a little expensive."
    gloss: "The restaurant is a little expensive."
    note: "A hedged claim: *un poco* softens *caro*, so it reads as a nuanced opinion rather than a flat verdict."
  es.b2.unit03.lesson01.teach.postre:
    title: "the dessert"
    gloss: "the dessert"
    example_gloss: "The dessert isn't bad."
  es.b2.unit03.lesson01.teach.grammar_suavizar:
    title: "The restaurant is a little expensive. The dessert isn't bad. It's more expensive than cheap, if anything."
    gloss: "The restaurant is a little expensive. The dessert isn't bad. It's more expensive than cheap, if anything."
    note: "Hedging = softening a statement so it reads as a nuanced opinion, not a flat verdict. *Un poco*, *algo*, *no está mal*, and *más bien* all do this."

  es.b2.unit03.lesson02.teach.no_es_que_sino_que:
    title: "it's not that... but rather that..."
    gloss: "it's not that... but rather that..."
    note: "*No es que* takes the SUBJUNCTIVE (*sea*, not *es*): you deny one framing. *sino que* then takes the ordinary indicative for the real framing you offer instead."
  es.b2.unit03.lesson02.teach.malo:
    title: bad
    gloss: bad
    example_gloss: "It's not that it's bad."
  es.b2.unit03.lesson02.teach.hasta_cierto_punto:
    title: "up to a point"
    gloss: "up to a point"
    note: "*Hasta cierto punto* concedes a claim only partially -- 'true, but not entirely'."
  es.b2.unit03.lesson02.teach.en_cierto_modo:
    title: "in a way"
    gloss: "in a way / in a sense"
    note: "*En cierto modo* qualifies a claim as true under one reading, without committing fully."
  es.b2.unit03.lesson02.teach.ambiente:
    title: "the atmosphere"
    gloss: "the atmosphere"
    example_gloss: "The atmosphere is pleasant."
  es.b2.unit03.lesson02.teach.agradable:
    title: pleasant
    gloss: pleasant
    example_gloss: "In a way, it's pleasant."
  es.b2.unit03.lesson02.teach.claim_model:
    title: "It's not that it's bad, but rather that it's expensive."
    gloss: "It's not that it's bad, but rather that it's expensive."
    note: "A careful qualification: deny one framing (*no es que sea malo*), offer the real one (*sino que es caro*)."
  es.b2.unit03.lesson02.teach.grammar_cuidado:
    title: "It's not that it's bad, but rather that it's expensive. Up to a point, the atmosphere is pleasant."
    gloss: "It's not that it's bad, but rather that it's expensive. Up to a point, the atmosphere is pleasant."
    note: "Careful qualification = neither a flat yes nor a flat no -- *no es que... sino que...*, *hasta cierto punto*, and *en cierto modo* all narrow a claim precisely instead of overstating it."

  es.b2.unit03.lesson03.teach.si_que:
    title: "really did / really is"
    gloss: "really did / really is (emphatic sí)"
    note: "*Sí que* inserts emphatic *sí* before the verb to underline a claim -- 'it really WAS delicious', reasserting something that might have been doubted."
  es.b2.unit03.lesson03.teach.de_hecho:
    title: "in fact"
    gloss: "in fact"
    note: "*De hecho* adds a stronger fact on top of what was just said."
  es.b2.unit03.lesson03.teach.en_realidad:
    title: actually
    gloss: "actually / in reality"
    note: "*En realidad* corrects or strengthens the previous statement with the real situation."
  es.b2.unit03.lesson03.teach.sin_duda:
    title: "without a doubt"
    gloss: "without a doubt"
    note: "*Sin duda* is the strongest certainty marker in this unit -- no hedge left at all."
  es.b2.unit03.lesson03.teach.delicioso:
    title: delicious
    gloss: delicious
    example_gloss: "The dessert was delicious."
  es.b2.unit03.lesson03.teach.estaba:
    title: was
    gloss: "was (imperfect of estar, describing a state)"
    example_gloss: "The atmosphere was very pleasant."
  es.b2.unit03.lesson03.teach.excelente:
    title: excellent
    gloss: excellent
    example_gloss: "In fact, it's excellent."
  es.b2.unit03.lesson03.teach.claim_model:
    title: "The dessert really was delicious."
    gloss: "The dessert really was delicious."
    note: "An emphasized claim -- compare the hedged *El restaurante es un poco caro*."
  es.b2.unit03.lesson03.teach.grammar_enfatizar:
    title: "The dessert really was delicious. In fact, the whole restaurant is excellent."
    gloss: "The dessert really was delicious. In fact, the whole restaurant is excellent."
    note: "Emphasis = strengthening a claim rather than softening it. *Sí que*, *de hecho*, *en realidad*, and *sin duda* all do this, at increasing levels of force."

  es.b2.unit03.lesson04.teach.lo_que_mas_me_gusta:
    title: "what I like most is..."
    gloss: "what I like most is..."
    note: "*Lo que más me gusta es...* is a cleft sentence: it moves the thing being praised into focus position, instead of a flat 'I like the atmosphere most'."
  es.b2.unit03.lesson04.teach.lo_que_pasa_es_que:
    title: "the thing is that..."
    gloss: "the thing is that..."
    note: "*Lo que pasa es que...* puts the real issue in focus -- a natural way to introduce the actual problem after a compliment."
  es.b2.unit03.lesson04.teach.servicio:
    title: "the service"
    gloss: "the service"
    example_gloss: "What I like most is the service."
  es.b2.unit03.lesson04.teach.lento:
    title: slow
    gloss: slow
    example_gloss: "The service is a little slow."
  es.b2.unit03.lesson04.teach.claim_model:
    title: "What I liked most was the atmosphere."
    gloss: "What I liked most was the atmosphere."
    note: "Past-tense cleft: *lo que más me gustó fue...* (both *gustó* and *fue* in the preterite) -- the form of *ser* follows the tense of the verb inside the *lo que* clause: *me gusta... es*, *me gustó... fue*."
  es.b2.unit03.lesson04.teach.claim_model_2:
    title: "The thing is that the service is slow."
    gloss: "The thing is that the service is slow."
  es.b2.unit03.lesson04.teach.grammar_foco:
    title: "What I liked most was the atmosphere. The thing is that the service is slow."
    gloss: "What I liked most was the atmosphere. The thing is that the service is slow."
    note: "Focus constructions = putting one element of the sentence in the spotlight with *lo que...*, rather than just adding an emphasis word like *sí que* or *de hecho*."

  es.b2.unit03.lesson05.teach.texto:
    title: "Reading: a restaurant review"
    gloss: "The restaurant El Rincón is a little expensive, but without a doubt it's worth it. It's not that the food is perfect, but rather that the atmosphere is really special. The dessert really was delicious. What I liked most was the service, although sometimes it's a bit slow. In short, up to a point it's expensive, but in fact it's worth going back."
    glosses:
      vale: "is worth (vale la pena = it's worth it)"
      pena: "trouble, effort (vale la pena = it's worth the trouble)"
      comida: food
      perfecta: perfect
      especial: special
      merece: "deserves (merece la pena = it's worth it; a common variant of vale la pena, especially in Spain)"
      volver: "to return"
      realmente: really
  es.b2.unit03.lesson06.teach.parecio:
    title: "seemed to me"
    gloss: "seemed to me (from parecer, to seem)"
    note: "*A mí me pareció...* -- *mí* (accented) is the form of 'me' used after a preposition like *a* or *para*, distinct from unaccented *mi* ('my'). Adding *a mí* before *me* stresses 'to ME', in contrast with the other person's view."
    example_gloss: "It seemed expensive to me."
  es.b2.unit03.lesson06.teach.barato:
    title: cheap
    gloss: cheap
    example_gloss: "It isn't cheap."
  es.b2.unit03.lesson06.teach.calidad:
    title: "the quality"
    gloss: "the quality"
    example_gloss: "The quality is very good."
  es.b2.unit03.lesson06.teach.buena:
    title: "good (fem./masc.)"
    gloss: "good"
    note: "*Buena* agrees with feminine nouns (*la calidad es buena*), *bueno* with masculine ones (*el restaurante es bueno*)."
    example_gloss: "The restaurant really is good."
  es.b2.unit03.lesson06.teach.voy_a_te:
    title: "I'm going to..."
    gloss: "I'm going to..."
    note: "*Voy a* + infinitive expresses a plan or near future: *creo que voy a volver*. Elsewhere in this lesson, *te* in *¿Te gusta el restaurante?* is the informal object pronoun 'you'."
  es.b2.unit03.lesson06.teach.dialogue_elena_hedge:
    title: "Elena: The restaurant is a little expensive, but without a doubt it's worth it."
    gloss: "Elena: The restaurant is a little expensive, but without a doubt it's worth it."
  es.b2.unit03.lesson06.teach.dialogue_mateo_disagree:
    title: "Mateo: You think so? It seemed expensive to me."
    gloss: "Mateo: You think so? It seemed expensive to me."
  es.b2.unit03.lesson06.teach.dialogue_elena_careful:
    title: "Elena: It's not that it's cheap, but rather that the quality is very good."
    gloss: "Elena: It's not that it's cheap, but rather that the quality is very good."
  es.b2.unit03.lesson06.teach.dialogue_mateo_agree:
    title: "Mateo: True, the dessert really was delicious."
    gloss: "Mateo: True, the dessert really was delicious."
  es.b2.unit03.lesson06.teach.dialogue_elena_focus:
    title: "Elena: What I liked most was the atmosphere."
    gloss: "Elena: What I liked most was the atmosphere."
  es.b2.unit03.lesson06.teach.dialogue_mateo_concede:
    title: "Mateo: You're right. In fact, I think I'm going to come back."
    gloss: "Mateo: You're right. In fact, I think I'm going to come back."
  es.b2.unit03.lesson06.teach.grammar_modular:
    title: "The restaurant isn't bad (hedged). The restaurant really is good (emphasized). It's the same idea, said two ways."
    gloss: "The restaurant isn't bad (hedged). The restaurant really is good (emphasized). It's the same idea, said two ways."
    note: "The same underlying claim, delivered once hedged and once emphasized: *no está mal* plays it down, *sí que* plays it up."

exercises:
  es.b2.unit03.lesson01.exercise01.recognize_un_poco:
    instruction: "What does this phrase mean?"
    correct_option: "a little"
    distractors: [very, never, "not at all"]
    accepted_answers: [{value: "a little", status: correct}]
    feedback: "Un poco softens an adjective -- a little, a bit."
  es.b2.unit03.lesson01.exercise02.listen_caro:
    instruction: "Listen and select what you hear."
    correct_option: "The restaurant is a little expensive."
    distractors: ["The restaurant is very expensive.", "The restaurant is a little cheap.", "The restaurant isn't expensive."]
    accepted_answers: [{value: "The restaurant is a little expensive.", status: correct}]
    feedback: "El restaurante es un poco caro means the restaurant is a little expensive."
  es.b2.unit03.lesson01.exercise03.match_hedge_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"un poco": "a little", "no está mal": "not bad", "más bien": rather, "el restaurante": "the restaurant", caro: expensive, "el postre": "the dessert"}
        status: correct
    feedback: "These are this lesson's hedging words."
  es.b2.unit03.lesson01.exercise04.order_caro:
    instruction: "Put the words in order: The restaurant is a little expensive."
    accepted_answers:
      - {value: "El restaurante es un poco caro", status: correct}
    feedback: "El restaurante es un poco caro means the restaurant is a little expensive."
  es.b2.unit03.lesson01.exercise05.translate_no_esta_mal:
    instruction: "Translate into Spanish: The dessert isn't bad."
    accepted_answers:
      - {value: "El postre no está mal", status: correct}
    feedback: "El postre no está mal means the dessert isn't bad."
  es.b2.unit03.lesson01.exercise06.speak_mas_bien:
    instruction: "Say aloud in Spanish, using más bien: It's rather expensive."
    accepted_answers:
      - {value: "Es más bien caro", status: correct}
    feedback: "Es más bien caro means it's rather expensive."
  es.b2.unit03.lesson01.exercise07.write_algo:
    instruction: "Write in Spanish, using algo: The restaurant is somewhat expensive."
    accepted_answers:
      - {value: "El restaurante es algo caro", status: correct}
    feedback: "El restaurante es algo caro means the restaurant is somewhat expensive."
  es.b2.unit03.lesson01.exercise08.dictation_caro:
    instruction: "Type what you hear."
    correct_response: "El restaurante es un poco caro"
    orthography_strict: true
    feedback: "You heard El restaurante es un poco caro — the restaurant is a little expensive."

  es.b2.unit03.lesson02.exercise01.recognize_sino_que:
    instruction: "What does this phrase mean?"
    correct_option: "but rather that"
    distractors: ["and also", "because of that", "even though"]
    accepted_answers: [{value: "but rather that", status: correct}]
    feedback: "Sino que completes no es que... with the real framing."
  es.b2.unit03.lesson02.exercise02.listen_no_es_que:
    instruction: "Listen and select what you hear."
    correct_option: "It's not that it's bad, but rather that it's expensive."
    distractors: ["It's bad and expensive.", "It's not bad, and it's not expensive.", "It's not that it's expensive, but rather that it's bad."]
    accepted_answers: [{value: "It's not that it's bad, but rather that it's expensive.", status: correct}]
    feedback: "No es que sea malo, sino que es caro means it's not that it's bad, but rather that it's expensive."
  es.b2.unit03.lesson02.exercise03.match_careful_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"no es que... sino que...": "it's not that... but rather that...", malo: bad, "hasta cierto punto": "up to a point", "en cierto modo": "in a way", "el ambiente": "the atmosphere", agradable: pleasant}
        status: correct
    feedback: "These are this lesson's careful-qualification words."
  es.b2.unit03.lesson02.exercise04.order_no_es_que:
    instruction: "Put the words in order: It's not that it's bad."
    accepted_answers:
      - {value: "No es que sea malo", status: correct}
    feedback: "No es que sea malo means it's not that it's bad."
  es.b2.unit03.lesson02.exercise05.translate_hasta_cierto_punto:
    instruction: "Translate into Spanish, using hasta cierto punto: Up to a point, he or she is right."
    accepted_answers:
      - {value: "Hasta cierto punto, tiene razón", status: correct}
      - {value: "Hasta cierto punto tiene razón", status: correct}
    feedback: "Hasta cierto punto, tiene razón means up to a point, he or she is right."
  es.b2.unit03.lesson02.exercise06.translate_en_cierto_modo:
    instruction: "Translate into Spanish, using en cierto modo: In a way, the atmosphere is pleasant."
    accepted_answers:
      - {value: "En cierto modo, el ambiente es agradable", status: correct}
      - {value: "En cierto modo el ambiente es agradable", status: correct}
    feedback: "En cierto modo, el ambiente es agradable means in a way, the atmosphere is pleasant."
  es.b2.unit03.lesson02.exercise07.write_no_es_que:
    instruction: "Write in Spanish, using no es que... sino que...: It's not that it's bad, but rather that it's expensive."
    accepted_answers:
      - {value: "No es que sea malo, sino que es caro", status: correct}
    feedback: "No es que sea malo, sino que es caro means it's not that it's bad, but rather that it's expensive."
  es.b2.unit03.lesson02.exercise08.dictation_no_es_que:
    instruction: "Type what you hear."
    correct_response: "No es que sea malo, sino que es caro"
    orthography_strict: true
    feedback: "You heard No es que sea malo, sino que es caro — it's not that it's bad, but rather that it's expensive."

  es.b2.unit03.lesson03.exercise01.recognize_si_que:
    instruction: "What does this phrase mean?"
    correct_option: "really did / really is"
    distractors: ["maybe", "not really", "used to be"]
    accepted_answers: [{value: "really did / really is", status: correct}]
    feedback: "Sí que emphasizes a claim -- it really was/is true."
  es.b2.unit03.lesson03.exercise02.listen_delicioso:
    instruction: "Listen and select what you hear."
    correct_option: "The dessert really was delicious."
    distractors: ["The dessert wasn't very good.", "The dessert is delicious.", "The dessert might have been delicious."]
    accepted_answers: [{value: "The dessert really was delicious.", status: correct}]
    feedback: "El postre sí que estaba delicioso means the dessert really was delicious."
  es.b2.unit03.lesson03.exercise03.match_emphasis_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"sí que": "really did / really is (emphatic)", "de hecho": "in fact", "en realidad": "in reality / actually", "sin duda": "without a doubt", delicioso: delicious, estaba: "was (imperfect of estar)", excelente: excellent}
        status: correct
    feedback: "These are this lesson's emphasis words."
  es.b2.unit03.lesson03.exercise04.order_delicioso:
    instruction: "Put the words in order: The dessert really was delicious."
    accepted_answers:
      - {value: "El postre sí que estaba delicioso", status: correct}
    feedback: "El postre sí que estaba delicioso means the dessert really was delicious."
  es.b2.unit03.lesson03.exercise05.translate_de_hecho:
    instruction: "Translate into Spanish, using de hecho: In fact, the restaurant is excellent."
    accepted_answers:
      - {value: "De hecho, el restaurante es excelente", status: correct}
      - {value: "De hecho el restaurante es excelente", status: correct}
    feedback: "De hecho, el restaurante es excelente means in fact, the restaurant is excellent."
  es.b2.unit03.lesson03.exercise06.translate_sin_duda:
    instruction: "Translate into Spanish, using sin duda: Without a doubt, it's the best restaurant."
    accepted_answers:
      - {value: "Sin duda, es el mejor restaurante", status: correct}
      - {value: "Sin duda es el mejor restaurante", status: correct}
    feedback: "Sin duda, es el mejor restaurante means without a doubt, it's the best restaurant."
  es.b2.unit03.lesson03.exercise07.write_en_realidad:
    instruction: "Write in Spanish, using en realidad: Actually, the atmosphere is very pleasant."
    accepted_answers:
      - {value: "En realidad, el ambiente es muy agradable", status: correct}
      - {value: "En realidad el ambiente es muy agradable", status: correct}
    feedback: "En realidad, el ambiente es muy agradable means actually, the atmosphere is very pleasant."

  es.b2.unit03.lesson04.exercise01.recognize_lo_que:
    instruction: "What does this phrase mean?"
    correct_option: "what / the thing that"
    distractors: [because, although, "in short"]
    accepted_answers: [{value: "what / the thing that", status: correct}]
