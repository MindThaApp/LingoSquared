answer_policy:
  accent_marks: >-
    Display and teach all Spanish accent marks. In typed A1 answers, accept a
    variant without acute accents when every other letter and word is
    correct. Do not treat n as a substitute for ñ.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal and place names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation.

course:
  title: "Spanish A1"
  description: >-
    Immediate and extended family vocabulary, possessive adjectives, and
    describing a household, continuing Elena and Mateo's cooking-workshop
    narrative from units 01-02. English-specific guidance highlights
    possessive-adjective register (mi/tu/su) and gender-marked family nouns.

units:
  es.a1.unit03.family:
    title: "Elena and Mateo's families"

lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: "Close family"
  es.a1.unit03.lesson02.possessives_and_asking:
    title: "Possessives: mi, tu, su"
  es.a1.unit03.lesson03.extended_family:
    title: "Extended family"
  es.a1.unit03.lesson04.describing_family_size:
    title: "How many are at home"
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: "Reading a family profile"
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: "Family photos with Elena and Mateo"

teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: "Mother"
    gloss: "mother"
    note: "*Madre* is feminine. *Mamá* is the more common everyday word among family, while *madre* is neutral and used in this course's vocabulary lists."
  es.a1.unit03.lesson01.teach.padre:
    title: "Father"
    gloss: "father"
    note: "*Padre* is masculine. *Papá* is the everyday equivalent, parallel to *madre*/*mamá*."
  es.a1.unit03.lesson01.teach.hermano:
    title: "Brother"
    gloss: "brother"
    note: "*Hermano* is masculine singular."
  es.a1.unit03.lesson01.teach.hermana:
    title: "Sister"
    gloss: "sister"
    note: "*Hermana* is feminine singular."
  es.a1.unit03.lesson01.teach.hijo:
    title: "Son"
    gloss: "son"
    note: "*Hijo* is masculine singular."
  es.a1.unit03.lesson01.teach.hija:
    title: "Daughter"
    gloss: "daughter"
    note: "*Hija* is feminine singular."
  es.a1.unit03.lesson01.teach.padres:
    title: "Parents"
    gloss: "parents"
    note: >-
      *Padres* (masculine plural) covers a mixed-gender pair (mother and
      father together), the same pattern Spanish uses whenever a group
      includes at least one male member.
  es.a1.unit03.lesson01.teach.hermanos:
    title: "Siblings"
    gloss: "siblings; brothers"
    note: >-
      *Hermanos* can mean "brothers" (all male) or "siblings" (mixed group),
      following the same masculine-plural-covers-mixed-groups rule as
      *padres*.

  es.a1.unit03.lesson02.teach.mi_familia:
    title: "My family"
    gloss: "my family"
    note: "*Mi* (no accent) is the possessive adjective \"my\"; it doesn't change for gender, only for number (*mis* for plural nouns)."
  es.a1.unit03.lesson02.teach.tu_familia:
    title: "Your family (informal)"
    gloss: "your family"
    note: "*Tu* (no accent, unlike the pronoun *tú*) is the informal possessive, matching the *tú* register from Unit 1."
  es.a1.unit03.lesson02.teach.su_familia:
    title: "Your/his/her family (formal or third-person)"
    gloss: "his/her/your family"
    note: >-
      *Su* covers "his," "her," AND the formal "your" (*usted*) -- Spanish
      doesn't distinguish these with the possessive alone; context makes
      the meaning clear.
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: "Ask about siblings"
    gloss: "Do you have siblings?"
    note: "*Tienes* is the *tú* form of *tener*, the same verb used for age in Unit 2."
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: "State the number of siblings"
    gloss: "I have two sisters."
    note: "*Tengo* (I have) combined with a number and the family noun is the standard way to describe siblings."
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: "Ask if a family is large"
    gloss: "Is your family big?"
    note: "*Grande* (big) doesn't change form for gender, only for number (*grandes*)."
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: "Describe a small family"
    gloss: "My family is small."
    note: "*Pequeña* agrees with the feminine noun *familia*; the masculine form *pequeño* would appear with a masculine noun instead."

  es.a1.unit03.lesson03.teach.abuelo:
    title: "Grandfather"
    gloss: "grandfather"
    note: "*Abuelo* is masculine singular."
  es.a1.unit03.lesson03.teach.abuela:
    title: "Grandmother"
    gloss: "grandmother"
    note: "*Abuela* is feminine singular."
  es.a1.unit03.lesson03.teach.abuelos:
    title: "Grandparents"
    gloss: "grandparents"
    note: "*Abuelos* (masculine plural) covers a mixed pair, the same pattern as *padres* and *hermanos*."
  es.a1.unit03.lesson03.teach.tio:
    title: "Uncle"
    gloss: "uncle"
    note: "*Tío* carries a written accent because the stress falls on the *í*, breaking what would otherwise be a diphthong."
  es.a1.unit03.lesson03.teach.tia:
    title: "Aunt"
    gloss: "aunt"
    note: "*Tía* carries the same accent pattern as *tío*, for the same reason."
  es.a1.unit03.lesson03.teach.primo:
    title: "Cousin (male)"
    gloss: "cousin (male)"
    note: "*Primo* is masculine singular; unlike English \"cousin,\" Spanish marks the cousin's gender."
  es.a1.unit03.lesson03.teach.prima:
    title: "Cousin (female)"
    gloss: "cousin (female)"
    note: "*Prima* is feminine singular."
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: "My grandparents"
    gloss: "my grandparents"
    note: "*Mis* is the plural form of *mi*, required whenever the noun it modifies is plural, regardless of the noun's gender."

  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: "Ask how many siblings"
    gloss: "How many siblings do you have?"
    note: "*Cuántos* (masculine plural, since *hermanos* covers mixed groups) agrees with the noun it asks about."
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: "State household size"
    gloss: "There are five of us at home."
    note: "*Somos* (we are) is the natural way to state total household size in Spanish, not a literal word-for-word translation of \"there are.\""
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: "Describe a large family"
    gloss: "My family is big."
    note: "*Grande* here modifies *familia* (feminine) but keeps the same form *grande* takes with masculine nouns too, since -e-ending adjectives like *grande* don't change for gender."
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: "State you have many cousins"
    gloss: "I have many cousins."
    note: "*Muchos* (masculine plural) is used because *primos*, like *hermanos* and *padres*, can refer to a mixed-gender group."
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: "Ask about living near parents"
    gloss: "Do you live near your parents?"
    note: "*Tus* is the plural of *tu*, required because *padres* is plural."
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: "State who you live with"
    gloss: "I live with my grandparents."
    note: "*Con* (with) introduces the people someone lives with; *vivo* is the *yo* form of *vivir*, already seen in Unit 1's *vivo en Londres*."

  es.a1.unit03.lesson05.teach.profile_reading:
    title: "Elena's family profile"
    gloss: >-
      My name is Elena. I'm thirty-one and I live with my grandparents in
      Spain. My mother and father live in Barcelona. I have one sister and
      a brother: there are five of us at home. My younger sister is named
      Sofía and she's twenty.
    note: >-
      This profile reuses vocabulary and structures from lessons01-04 in a
      connected short text rather than isolated sentences, the same
      who-is-who reading skill this unit's reading assessment focuses on.
    glosses: {llamo: "am called (from llamarse)", Tengo: "I am / I have (from tener)", treinta: "thirty", años: "years old", vivo: "live (from vivir)", abuelos: "grandparents", madre: "mother", padre: "father", viven: "live (from vivir)", hermana: "sister", hermano: "brother", somos: "we are (from ser)", cinco: "five", casa: "home", menor: "younger", tiene: "is / has (from tener)", veinte: "twenty"}
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: "Younger sister"
    gloss: "younger sister"
    note: "*Menor* (younger) follows the noun it describes and doesn't change form for gender."
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: "Lives (third person)"
    gloss: "lives"
    note: >-
      *Vive* is the third-person singular form of *vivir*, used to talk
      ABOUT someone (*Elena vive*...) rather than as themselves (*vivo*,
      first seen in Unit 1's lesson04 and again in this unit's own
      lesson04).
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: "Her/his/their (plural noun)"
    gloss: "her/his/their"
    note: >-
      *Sus* is the plural of *su*, used the same way *su* covers "his/her/
      your (formal)" for a singular noun -- *sus abuelos* means "her
      grandparents" when talking about Elena in the third person.

  es.a1.unit03.lesson06.teach.line01:
    title: "Show family photos"
    gloss: "Elena shows Mateo a photo, introducing her parents and her younger sister."
    note: "*Estos son* (these are, masculine/mixed plural) introduces the parents; *esta es* (this is, feminine singular) introduces the sister."
  es.a1.unit03.lesson06.teach.line02:
    title: "React and ask about siblings"
    gloss: "Mateo reacts warmly and asks if she has more siblings."
    note: "*Qué bonito* is a natural, warm reaction to seeing a photo, similar in function to Unit 1's *Qué bien*."
  es.a1.unit03.lesson06.teach.line03:
    title: "State household size and return the question"
    gloss: "Elena says she has one sister and a brother -- five at home -- then asks about Mateo's family."
    note: "*Somos cinco en casa* states total household size, continuing lesson04's pattern."
  es.a1.unit03.lesson06.teach.line04:
    title: "Describe a smaller family"
    gloss: "Mateo says his family is smaller -- just three: his parents and him -- but he has many cousins."
    note: "*Pero* (but) signals the contrast between a small immediate family and many extended relatives."
  es.a1.unit03.lesson06.teach.line05:
    title: "Ask about proximity to parents"
    gloss: "Elena asks if Mateo lives near his parents."
    note: "*Cerca de* (near) is a common way to describe physical proximity."
  es.a1.unit03.lesson06.teach.line06:
    title: "Explain distance and staying in touch"
    gloss: "Mateo says no, they live in Colombia, and they talk by phone every week."
    note: "Continues Unit 1's established fact that Mateo is from Colombia but lives in London -- his parents remain in Colombia."
  es.a1.unit03.lesson06.teach.line07:
    title: "Empathize and share your own situation"
    gloss: "Elena says she understands, and that she lives with her grandparents here in Spain."
    note: "*Entiendo* (I understand) is a natural, brief way to acknowledge what someone just shared before adding your own related detail."
  es.a1.unit03.lesson06.teach.line08:
    title: "Close with a warm remark"
    gloss: "Mateo says it's nice to have family close by."
    note: "*Qué bien tener a la familia cerca* closes the exchange on a warm, reflective note, echoing the *qué bien*/*qué bonito* pattern used throughout this dialogue."

exercises:
  es.a1.unit03.lesson01.exercise01.select_madre:
    instruction: "Which word means mother?"
    correct_option: "madre"
    distractors: ["padre", "hermana"]
    accepted_answers: ["madre"]

  es.a1.unit03.lesson01.exercise02.select_hermana:
    instruction: "Which word means sister?"
    correct_option: "hermana"
    distractors: ["hermano", "hija"]
    accepted_answers: ["hermana"]

  es.a1.unit03.lesson01.exercise03.match_family_words:
    instruction: "Match each Spanish word to its English meaning."
    correct_response:
      madre: "mother"
      padre: "father"
      hermano: "brother"
      hermana: "sister"
      hijo: "son"
      hija: "daughter"

  es.a1.unit03.lesson01.exercise04.listen_madre:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Mi madre"
    distractors: ["Mi padre", "Mi hermana"]
    accepted_answers: ["Mi madre"]

  es.a1.unit03.lesson01.exercise05.listen_padre:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Mi padre"
    distractors: ["Mi madre", "Mi hermano"]
    accepted_answers: ["Mi padre"]

  es.a1.unit03.lesson01.exercise06.order_padres:
    instruction: "Which word means parents?"
    correct_response: ["padres"]

  es.a1.unit03.lesson01.exercise07.check_plural_agreement:
    instruction: "Correct the agreement error: what's the plural for a mixed group of siblings?"
    accepted_answers:
      - "Hermano y hermana, juntos: hermanos."
      - "Hermano y hermana, juntos: hermanos"
    feedback: "*Hermanos* (masculine plural) covers a mixed group of brothers and sisters together."

  es.a1.unit03.lesson01.exercise08.speak_own_siblings:
    instruction: "Say that you have a brother or a sister."
    accepted_answers:
      - "Tengo un hermano."
      - "Tengo una hermana."

  es.a1.unit03.lesson02.exercise01.select_mi:
    instruction: "Which phrase means \"my family\"?"
    correct_option: "Mi familia"
    distractors: ["Tu familia", "Su familia"]
    accepted_answers: ["Mi familia"]

  es.a1.unit03.lesson02.exercise02.match_possessives:
    instruction: "Match each possessive phrase to its meaning."
    correct_response:
      "Mi familia": "my family"
      "Tu familia": "your family (informal)"
      "Su familia": "his/her/your family (formal)"

  es.a1.unit03.lesson02.exercise03.listen_tienes_hermanos:
    instruction: "Listen and select the question you hear."
    correct_option: "¿Tienes hermanos?"
    distractors: ["¿Tu familia es grande?", "¿Cuántos años tienes?"]
    accepted_answers: ["¿Tienes hermanos?", "Tienes hermanos"]

  es.a1.unit03.lesson02.exercise04.order_tengo_dos_hermanas:
    instruction: "Build the sentence: I have two sisters."
    correct_response: ["Tengo", "dos", "hermanas"]

  es.a1.unit03.lesson02.exercise05.listen_type_tengo_dos_hermanas:
    instruction: "Type the sentence you hear."
    accepted_answers:
      - "Tengo dos hermanas."
      - "Tengo dos hermanas"

  es.a1.unit03.lesson02.exercise06.reply_tienes_hermanos:
    instruction: "Answer that you have two sisters."
    accepted_answers:
      - "Tengo dos hermanas."
      - "Tengo dos hermanas"

  es.a1.unit03.lesson02.exercise07.check_su_vs_tu:
    instruction: "Correct the register: you are speaking to your teacher (usted)."
    accepted_answers:
      - "Su familia, hablando con el profesor."
      - "Su familia, hablando con el profesor"
    feedback: "*Su*, not *tu*, is used with the *usted* register."

  es.a1.unit03.lesson02.exercise08.speak_describe_family_size:
    instruction: "Say whether your family is big or small."
    accepted_answers:
      - "Mi familia es pequeña."
      - "Mi familia es grande."

  es.a1.unit03.lesson03.exercise01.select_abuela:
    instruction: "Which word means grandmother?"
    correct_option: "abuela"
    distractors: ["abuelo", "tía"]
    accepted_answers: ["abuela"]

  es.a1.unit03.lesson03.exercise02.select_primo:
    instruction: "Which word means male cousin?"
    correct_option: "primo"
    distractors: ["prima", "tío"]
    accepted_answers: ["primo"]

  es.a1.unit03.lesson03.exercise03.match_extended_family:
    instruction: "Match each Spanish word to its English meaning."
    correct_response:
      abuelo: "grandfather"
      abuela: "grandmother"
      tío: "uncle"
      tía: "aunt"
      primo: "cousin (male)"
      prima: "cousin (female)"

  es.a1.unit03.lesson03.exercise04.listen_abuelos:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Mis abuelos"
    distractors: ["Mis padres", "Mis primos"]
    accepted_answers: ["Mis abuelos"]

  es.a1.unit03.lesson03.exercise05.order_mis_abuelos:
    instruction: "Build the phrase: my grandparents."
    correct_response: ["Mis", "abuelos"]

  es.a1.unit03.lesson03.exercise06.fill_plural_possessive:
    instruction: "Complete the sentence with the plural possessive for my."
    accepted_answers: ["Mis"]
    feedback: "*Mis* (not *mi*) is used because *abuelos* is plural."

  es.a1.unit03.lesson03.exercise07.check_gender_agreement:
    instruction: "Correct the gender mismatch in this sentence."
    accepted_answers: ["Mi primo se llama Carlos."]
    feedback: "*Primo* (masculine) matches a male name like Carlos; *prima* is feminine."

  es.a1.unit03.lesson03.exercise08.speak_own_extended_family:
    instruction: "Say that you have an uncle, an aunt, or a cousin."
    accepted_answers:
      - "Tengo un tío."
      - "Tengo una tía."
      - "Tengo un primo."
      - "Tengo una prima."

  es.a1.unit03.lesson04.exercise01.select_family_size_question:
    instruction: "Which question asks how many siblings someone has?"
    correct_option: "¿Cuántos hermanos tienes?"
    distractors: ["¿Tu familia es grande?", "¿Vives cerca de tus padres?"]
    accepted_answers: ["¿Cuántos hermanos tienes?", "Cuántos hermanos tienes"]

  es.a1.unit03.lesson04.exercise02.listen_family_size_answer:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Somos cinco en casa."
    distractors: ["Somos tres en casa.", "Tengo cinco primos."]
    accepted_answers: ["Somos cinco en casa."]

  es.a1.unit03.lesson04.exercise03.order_somos_cinco:
    instruction: "Build the sentence: there are five of us at home."
    correct_response: ["Somos", "cinco", "en", "casa"]

  es.a1.unit03.lesson04.exercise04.fill_muchos_primos:
    instruction: "Complete the sentence to say you have many cousins."
    accepted_answers: ["primos"]

  es.a1.unit03.lesson04.exercise05.reply_own_family_size:
    instruction: "Answer that you have two siblings."
    accepted_answers:
      - "Tengo dos hermanos."
      - "Tengo dos hermanas."

  es.a1.unit03.lesson04.exercise06.listen_type_vives_cerca:
    instruction: "Type the question you hear."
    accepted_answers:
      - "¿Vives cerca de tus padres?"
      - "Vives cerca de tus padres"
      - "Vives cerca de tus padres?"

  es.a1.unit03.lesson02.exercise09.dictation_tengo_dos_hermanas:
    instruction: "Type what you hear."
    correct_option: "Tengo dos hermanas"
    accepted_answers: [{value: "Tengo dos hermanas", status: correct}]
    orthography_strict: true

  es.a1.unit03.lesson04.exercise07.reply_vivo_con_abuelos:
    instruction: "Answer that you live with your grandparents."
    accepted_answers:
      - "Vivo con mis abuelos."
      - "Vivo con mis abuelos"

  es.a1.unit03.lesson04.exercise08.write_own_family_sentence:
    instruction: "Write in Spanish: My family is big. I have many cousins."
    accepted_answers:
      - "Mi familia es grande. Tengo muchos primos."

  es.a1.unit03.lesson05.exercise01.select_where_elena_lives:
    instruction: "According to the profile, who does Elena live with?"
    correct_option: "Her grandparents"
    distractors: ["Her parents", "Her sister"]
    accepted_answers: ["Her grandparents"]

  es.a1.unit03.lesson05.exercise02.select_how_many_siblings:
    instruction: "How many siblings does Elena have?"
    correct_option: "One sister and a brother"
    distractors: ["Two sisters and a brother", "Three sisters"]
    accepted_answers: ["One sister and a brother"]

  es.a1.unit03.lesson05.exercise03.select_sofia_age:
    instruction: "How old is Sofía?"
    correct_option: "Twenty"
    distractors: ["Thirty-one", "Twenty-eight"]
    accepted_answers: ["Twenty", "20"]

  es.a1.unit03.lesson05.exercise04.match_who_is_who:
    instruction: "Match each person to the correct fact from the profile."
    correct_response:
      Elena: "31 years old"
      Sofía: "20 years old, younger sister"
      "madre y padre": "live in Barcelona"

  es.a1.unit03.lesson05.exercise05.fill_hermana_menor:
    instruction: "Complete the sentence: my younger sister is named Sofía."
    accepted_answers: ["menor"]

  es.a1.unit03.lesson05.exercise06.write_profile_summary:
    instruction: "Summarize in one sentence who Elena lives with."
    accepted_answers:
      - "Elena vive con sus abuelos."
