    title: Nina's bird
teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Animal* is the general word and *mascota* means specifically a pet; *mascota* is feminine, even for a male animal.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Elena has a dog.
    - Diego has a cat.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: The same *¿Tienes ...?* question pattern you already know from earlier units.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*No tengo mascota* simply puts *no* before the verb; see the grammar note.'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: saying you do not have something'
    gloss: 'To say you do not have something, put no before tengo: No tengo tiempo, no tengo mascota.'
    note: Reuses the *no tengo* pattern already taught with *No tengo tiempo*; only the noun is new.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*Sacar a pasear* is a fixed phrase: *sacar* ("to take out") + *a pasear* ("for a walk").'
    example_gloss: I walk the dog every day.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear and the personal a
    gloss: 'When the object is an animal or a person, a goes in front: saco al perro a pasear.'
    note: Reuses *saco al perro* from the previous card; the personal *a* appears before animals or people you care about.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: To play with
    gloss: to play with
    example_gloss: Diego plays with his cat.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: '*Sacar a pasear* combines with *todos los días* (every day), already known from an earlier unit; *a* + *el* becomes *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: '*Dar de comer* ("to give to eat") means to feed; *le* stands for the animal: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'The plural ends in -s: perro → perros, gato → gatos. After a consonant it is -es: animal → animales.'
    note: The regular Spanish plural pattern, introduced here for the first time with animal nouns as the example set.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Mateo loves dogs.
    - Lucía loves cats.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: I love animals
    gloss: I love animals.
    note: '*Me encantan* is plural because *los animales* is plural: the verb agrees with the thing you love.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía loves cats, but has no pet
    gloss: Lucía loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo asks about a pet
    gloss: 'Mateo: Do you have a pet, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena has a dog
    gloss: 'Elena: Yes, I have a dog.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo asks what it looks like
    gloss: 'Mateo: What does he look like?'
    note: Reuses *¿Cómo es?* from the earlier appearance unit, now asked about an animal.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena describes her dog
    gloss: 'Elena: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él and lo for animals
    gloss: Él and lo can also refer to an animal, not only to a person.
    note: Every earlier use of *él* in this course referred to a person; this flags the extension to animals explicitly, together with *lo* ("him, it") as an object pronoun.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo asks about walks
    gloss: 'Mateo: Do you walk him every day?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena describes her routine
    gloss: 'Elena: Yes, I walk him every day and I feed him.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía, and Diego on animals
    gloss: 'Mateo and Lucía both love animals, but neither of them has a pet. Mateo loves dogs and Lucía loves cats. Diego does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      encantan: love
      dos: both
      animales: animals
      ninguno: both
      mascota: pet
      perros: dogs
      gatos: cats
      gato: cat
      juega: plays
      da: gives
      todos: every
      comer: food
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego often plays with his cat
    gloss: Diego often plays with his cat.
    note: Reuses *a menudo* (often), already known from earlier units.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena asks Nina
    gloss: 'Elena: Nina, do you have a pet too?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Se llama* ("is called") reuses the name phrase from the very first unit.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Mateo reacts
    gloss: 'Mateo: How nice! What do you do with him every day?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo loves birds too
    gloss: 'Mateo: I love birds too.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena closes the conversation
    gloss: 'Elena: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
