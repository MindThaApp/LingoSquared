  es.a1.unit10.lesson02.teach.hace_calor: {title: "It's hot", gloss: "It's hot.", note: "*Hace calor* (literally \"it makes heat\") is the standard idiom for describing hot weather.", example_gloss: "It's very hot in July."}
  es.a1.unit10.lesson02.teach.hace_frio: {title: "It's cold", gloss: "It's cold.", note: "*Hace frío* follows the same *hace* + noun pattern as *hace calor*.", example_gloss: "In December it's cold."}
  es.a1.unit10.lesson02.teach.hace_sol: {title: "It's sunny", gloss: "It's sunny.", note: "*Hace sol* uses *el sol* (the sun) inside the same idiom pattern."}
  es.a1.unit10.lesson02.teach.llueve: {title: "It's raining", gloss: "It's raining.", note: "*Llueve* is its own verb form (from *llover*, to rain), not the *hace* pattern -- see the following grammar note."}
  es.a1.unit10.lesson02.teach.esta_nublado: {title: "It's cloudy", gloss: "It's cloudy.", note: "*Está nublado* uses *estar* + adjective, a third distinct weather-expression pattern."}
  es.a1.unit10.lesson02.teach.hace_vs_esta_note: {title: "Hace, llueve, está: three patterns", gloss: "Three different grammatical patterns for describing weather.", note: "See the card's own text."}

  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy: {title: "Ask about the weather", gloss: "What's the weather like today?", note: "*¿Qué tiempo hace hoy?* is the standard way to ask about current weather, using *el tiempo* (the weather)."}
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol: {title: "Describe hot, sunny weather", gloss: "It's very hot and sunny.", note: "Combines two *hace* expressions with *y* (and)."}
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento: {title: "Describe hot, windy weather", gloss: "It's hot, but it's windy.", note: "*Pero* (but) contrasts two weather facts -- heat with wind, using *hay* + noun as in *hay mucho viento*."}

  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid: {title: "Talk about winter in Madrid", gloss: "In winter it's very cold in Madrid.", note: "*En invierno* (in winter) introduces a season word, contrasted with *en julio* below."}
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor: {title: "Talk about July heat", gloss: "In July it's too hot.", note: "*Demasiado* (too much) intensifies *calor* beyond plain *mucho* (a lot)."}
  es.a1.unit10.lesson04.teach.necesitamos_agua: {title: "Explain why you need water", gloss: "We need water because it's hot.", note: "*Porque* (because) links a need to its weather cause, a practical, workshop-relevant sentence."}

  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: "Reading a weather forecast"
    gloss: "Today, July 22nd, it's very hot and sunny. There isn't a single cloud. There's also a little wind. It's a good day to go to the cooking workshop, but it's important to bring water."
    note: "A short forecast for 22 July, the day of the cooking class."
    glosses: {Hoy: "today", veintidós: "twenty-second", julio: "July", hace: "it is / the weather is (from hacer)", calor: "hot weather / heat", sol: "sunny / sun", hay: "there is (from haber)", nube: "cloud", También: "also", poco: "little", viento: "wind", buen: "good", día: "day", ir: "to go", taller: "workshop", cocina: "cooking", importante: "important", llevar: "to bring / carry", agua: "water"}
  es.a1.unit10.lesson05.teach.un_poco_de_note: {title: "Un poco de (a little bit of)", gloss: "How un poco de describes a small amount.", note: "See the card's own text."}

  es.a1.unit10.lesson06.teach.line01: {title: "Comment on the heat", gloss: "Elena remarks how hot it is today.", note: "*¡Qué calor hace hoy!* (what heat it's making today / it's so hot today!) is an exclamatory use of the *hace calor* idiom."}
  es.a1.unit10.lesson06.teach.line02: {title: "Agree and add detail", gloss: "Mateo agrees and notes there isn't a single cloud.", note: "Combines *hace mucho calor y hace sol* with *no hay ni una nube*."}
  es.a1.unit10.lesson06.teach.line03: {title: "Suggest bringing water", gloss: "Elena says they need water for the walk.", note: "*El camino* (the way/path) refers to their walk to the workshop."}
  es.a1.unit10.lesson06.teach.line04: {title: "Agree and point out a shop", gloss: "Mateo agrees and mentions a shop nearby.", note: "*Cerca de aquí* (near here) uses the location phrase *cerca de* (near)."}
  es.a1.unit10.lesson06.teach.line05: {title: "Contrast winter and summer", gloss: "Elena contrasts cold Madrid winters with today's excessive July heat.", note: "Combines the two seasonal sentences *en invierno hace mucho frío* and *en julio hace demasiado calor*."}
  es.a1.unit10.lesson06.teach.line06: {title: "Share a preference", gloss: "Mateo says he prefers the heat -- in London it rains almost every day.", note: "*Prefiero* (I prefer) is a new first-person verb form; *casi todos los días* (almost every day) is a useful frequency phrase."}
  es.a1.unit10.lesson06.teach.line07: {title: "Agree and hurry along", gloss: "Elena agrees and says they should go or they'll be late for class.", note: "*Es verdad* means \"that's true\"; *o* (or) here signals a consequence (\"or else\")."}
  es.a1.unit10.lesson06.teach.line08: {title: "Agree and go", gloss: "Mateo agrees she's right and they go.", note: "*Tienes razón* (you're right) is a common agreement phrase."}

