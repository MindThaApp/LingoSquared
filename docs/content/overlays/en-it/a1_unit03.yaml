review: {status: "reviewed", required_next_reviewer: null, notes: "Third en-it overlay, authored against the reviewed it.a1.unit03 realization (numbers 0-10, caffè and phone-number scenarios). 'Ho trent'anni' kept as a fixed age expression per the realization reviewer's note. 2026-07-12 fresh-context review (Claude, isolated from authoring reasoning). Glosses/instructions accurate; compiler 0 errors. Fixes: lesson01 match_digits_words accepted_answers had only 5 pairs while the realization pairs (the displayed tiles) hold all 11 (0-10) -> expanded to 11 so grading matches; lesson02 match_prices lefts used decimal-point money ('€1.00') but the realization tiles use the Italian decimal comma ('€1,00') -> corrected; lesson01 listen_numbers had two distractors ('uno..cinque', 'cinque..dieci') that are contiguous substrings the speaker actually says in the 0-10 count -> replaced with even/odd sequences never spoken contiguously. Native-speaker review still planned.\n\nSecond-pass review 2026-10-18: 5 fixes — teach.ho_trent_anni note: claimed 40 appears in the unit (it never does) -> '30 and 50'; teach.ne_vorrei_tre gloss 'please' -> 'thanks' (grazie), also in lesson02.exercise06 instruction and exercise07 feedback; lesson02.exercise01.choose_price: instruction gave no basis for the price -> states the café price; lesson02.exercise08.write_order: added 'Quanto costa un caffè? Un euro.'; lesson03.exercise06.reply_give_number: added 'Il mio numero di telefono è...' variant. NATIVE FLAGS: none."}

course:
  title: "Italian A1"
  description: "Learn A1-level Italian for everyday greetings and short social exchanges, with detailed English explanations."

units:
  it.a1.unit03.basic_numbers: {title: "Numbers: prices and phone numbers"}

lessons:
  it.a1.unit03.lesson01.contare_da_zero_a_dieci: {title: "Counting from zero to ten"}
  it.a1.unit03.lesson02.quanto_costa_al_bar: {title: "How much is it? Ordering at the café"}
  it.a1.unit03.lesson03.il_numero_di_telefono: {title: "Exchanging phone numbers"}

teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque: {title: "zero, uno, due, tre, quattro, cinque", gloss: "zero, one, two, three, four, five", note: "The first six numbers -- the building blocks for prices, ages, and phone numbers throughout this unit.", example_gloss: ["I have two brothers.", "It's five o'clock."]}
  it.a1.unit03.lesson01.teach.numeri_sei_dieci: {title: "sei, sette, otto, nove, dieci", gloss: "six, seven, eight, nine, ten", note: "Numbers six through ten, completing the 0-10 range.", example_gloss: ["I work eight hours a day.", "The shop opens at ten."]}
  it.a1.unit03.lesson01.teach.quanti_anni: {title: "Quanti anni hai?", gloss: "How old are you?", note: "Literally 'how many years do you have' -- Italian asks about age using *avere* (to have), not 'to be' like English."}
  it.a1.unit03.lesson01.teach.ho_trent_anni: {title: "Ho trent'anni.", gloss: "I'm thirty years old.", note: "A fixed expression for stating your age using *avere* (I have thirty years); 'thirty' itself is not taught here as a counting number -- this unit's number scope stays 0-10, plus 30 and 50 seen only in this fixed phrase and in prices."}
  it.a1.unit03.lesson02.teach.quanto_costa: {title: "Quanto costa un caffè?", gloss: "How much does a coffee cost?", note: "*Quanto costa* is the standard way to ask the price of one item."}
  it.a1.unit03.lesson02.teach.costa_un_euro: {title: "un euro, due euro", gloss: "one euro, two euros", note: "*euro* doesn't change form for the plural in Italian -- *un euro* and *due euro* both use *euro*.", example_gloss: ["It costs one euro.", "That's two euros fifty."]}
  it.a1.unit03.lesson02.teach.un_cornetto: {title: "E un cornetto?", gloss: "And a croissant?", note: "A short follow-up question asking the price of a second item, a *cornetto* (Italian breakfast croissant)."}
  it.a1.unit03.lesson02.teach.due_euro_cinquanta: {title: "Sono due euro e cinquanta.", gloss: "That's two euros fifty.", note: "*e cinquanta* adds the cents -- literally 'and fifty,' used the same way for any price with fifty cents."}
  it.a1.unit03.lesson02.teach.quanti_ne_vuole: {title: "Quanti ne vuole?", gloss: "How many would you like?", note: "The formal way a barista or shopkeeper asks how many of an item you want; *ne* stands in for the item already mentioned."}
  it.a1.unit03.lesson02.teach.ne_vorrei_tre: {title: "Ne vorrei tre, grazie.", gloss: "I'd like three, thanks.", note: "*Ne vorrei* + a number is the polite way to request a quantity, again using *ne* to refer back to the item."}
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero: {title: "Qual è il tuo numero di telefono?", gloss: "What's your phone number?", note: "The informal way to ask for someone's phone number, using *tuo* (your, informal)."}
  it.a1.unit03.lesson03.teach.ti_chiamo_domani: {title: "Ti chiamo domani!", gloss: "I'll call you tomorrow!", note: "A friendly way to end an exchange after getting someone's number."}
  it.a1.unit03.lesson03.teach.il_mio_numero: {title: "il mio numero", gloss: "my number", note: "Italian phone numbers are typically read out digit by digit, using the numbers from lesson01.", example_gloss: "My number is zero, three, four, two, one."}
  it.a1.unit03.lesson03.teach.numero_sam: {title: "Il mio numero è zero, tre, quattro, due, uno.", gloss: "My number is zero, three, four, two, one.", note: "Sam gives his phone number digit by digit, the standard way to read out a phone number in Italian."}
  it.a1.unit03.lesson03.teach.perfetto_grazie: {title: "Perfetto, grazie!", gloss: "Perfect, thanks!", note: "A short, upbeat way to close an exchange after getting the information you needed."}

exercises:
  it.a1.unit03.lesson01.exercise01.choose_number_word:
    instruction: "Which word matches the number 7?"
    correct_option: "sette"
    distractors: ["sei", "otto", "nove"]
    accepted_answers: [{value: "sette", status: "correct"}]
    feedback: "*sette* means seven."
  it.a1.unit03.lesson01.exercise02.listen_numbers:
    instruction: "Listen and select the numbers you hear, in order."
    correct_option: "zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci"
    distractors: ["dieci, nove, otto, sette, sei, cinque, quattro, tre, due, uno, zero", "zero, due, quattro, sei, otto, dieci", "uno, tre, cinque, sette, nove"]
    accepted_answers: [{value: "zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci", status: "correct"}]
    feedback: "The recording counts from zero to ten in order."
  it.a1.unit03.lesson01.exercise03.choose_digit:
    instruction: "Which word matches the number 9?"
    correct_option: "nove"
    distractors: ["otto", "dieci", "sette"]
    accepted_answers: [{value: "nove", status: "correct"}]
    feedback: "*nove* means nine."
  it.a1.unit03.lesson01.exercise04.match_digits_words:
    instruction: "Match each digit to its Italian word."
    accepted_answers:
      - value:
          - {left: "0", right: "zero"}
          - {left: "1", right: "uno"}
          - {left: "2", right: "due"}
          - {left: "3", right: "tre"}
          - {left: "4", right: "quattro"}
          - {left: "5", right: "cinque"}
          - {left: "6", right: "sei"}
          - {left: "7", right: "sette"}
          - {left: "8", right: "otto"}
          - {left: "9", right: "nove"}
          - {left: "10", right: "dieci"}
        status: "correct"
    feedback: "0=zero, 1=uno, 2=due, 3=tre, 4=quattro, 5=cinque, 6=sei, 7=sette, 8=otto, 9=nove, 10=dieci."
  it.a1.unit03.lesson01.exercise05.order_age_question:
    instruction: "Put the words in the correct order to ask 'How old are you?'"
    accepted_answers: [{value: ["Quanti", "anni", "hai"], status: "correct"}]
    feedback: "The correct order is *Quanti anni hai?*"
  it.a1.unit03.lesson01.exercise06.fill_in_age:
    instruction: "Complete the sentence: 'I'm thirty years old.'"
    accepted_answers:
      - {value: "anni", status: "correct"}
    feedback: "*Ho trent'anni.* is a fixed way to say 'I'm thirty years old.'"
  it.a1.unit03.lesson01.exercise07.write_count:
    instruction: "Write the numbers from 0 to 10 in Italian."
    accepted_answers:
      - {value: "zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci", status: "correct"}
      - {value: "zero uno due tre quattro cinque sei sette otto nove dieci", status: "correct"}
    feedback: "0-10 in Italian: zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci."

  it.a1.unit03.lesson02.exercise01.choose_price:
    instruction: "At this café a coffee costs €1. Someone asks 'Quanto costa un caffè?' Choose the price."
    correct_option: "un euro"
    distractors: ["due euro", "due euro e cinquanta", "un euro e cinquanta"]
    accepted_answers: [{value: "un euro", status: "correct"}]
    feedback: "A coffee costs *un euro* (one euro)."
  it.a1.unit03.lesson02.exercise02.listen_price_question:
    instruction: "Listen and select the question you hear."
    correct_option: "Quanto costa un caffè?"
    distractors: ["Quanti ne vuole?", "Qual è il tuo numero di telefono?", "Quanti anni hai?"]
    accepted_answers: [{value: "Quanto costa un caffè?", status: "correct"}]
    feedback: "*Quanto costa un caffè?* asks the price of a coffee."
  it.a1.unit03.lesson02.exercise03.choose_total:
    instruction: "A coffee (1 euro) and a croissant (1 euro 50). Total: ___."
    correct_option: "due euro e cinquanta"
    distractors: ["un euro e cinquanta", "un euro", "due euro"]
    accepted_answers: [{value: "due euro e cinquanta", status: "correct"}]
    feedback: "1 euro + 1.50 euro = *due euro e cinquanta* (two euros fifty)."
  it.a1.unit03.lesson02.exercise04.match_prices:
    instruction: "Match each price to how it's said in Italian."
    accepted_answers:
      - value:
          - {left: "€1,00", right: "un euro"}
          - {left: "€1,50", right: "un euro e cinquanta"}
          - {left: "€2,50", right: "due euro e cinquanta"}
        status: "correct"
    feedback: "€1,00=un euro, €1,50=un euro e cinquanta, €2,50=due euro e cinquanta."
  it.a1.unit03.lesson02.exercise05.listen_order_total:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Sono", "due", "euro", "e", "cinquanta"], status: "correct"}]
    feedback: "The correct order is *Sono due euro e cinquanta.*"
  it.a1.unit03.lesson02.exercise06.reply_how_many:
    instruction: "A barista asks 'Quanti ne vuole?' Reply that you'd like three, thanks."
    accepted_answers:
      - {value: "Ne vorrei tre, grazie.", status: "correct"}
      - {value: "Ne vorrei tre grazie", status: "correct"}
    feedback: "*Ne vorrei tre, grazie.* politely requests three."
  it.a1.unit03.lesson02.exercise07.listen_type_reply:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Ne vorrei tre, grazie.", status: "correct"}
      - {value: "Ne vorrei tre grazie", status: "correct"}
    feedback: "*Ne vorrei tre, grazie.* means 'I'd like three, thanks.'"
  it.a1.unit03.lesson02.exercise08.write_order:
    instruction: "Write a short exchange: ask how much a coffee costs, then say it costs one euro."
    accepted_answers:
      - {value: "Quanto costa un caffè? Costa un euro.", status: "correct"}
      - {value: "Quanto costa un caffè costa un euro", status: "correct"}
      - {value: "Quanto costa un caffè? Un euro.", status: "correct"}
    feedback: "*Quanto costa un caffè? Costa un euro.* asks and answers the price."

  it.a1.unit03.lesson03.exercise01.choose_phone_question:
    instruction: "Which question asks for someone's phone number?"
    correct_option: "Qual è il tuo numero di telefono?"
    distractors: ["Quanto costa un caffè?", "Quanti anni hai?", "Come ti chiami?"]
    accepted_answers: [{value: "Qual è il tuo numero di telefono?", status: "correct"}]
    feedback: "*Qual è il tuo numero di telefono?* asks for a phone number."
  it.a1.unit03.lesson03.exercise02.listen_phone_question:
    instruction: "Listen and select the question you hear."
    correct_option: "Qual è il tuo numero di telefono?"
    distractors: ["Quanto costa un caffè?", "Quanti ne vuole?", "Come ti chiami?"]
    accepted_answers: [{value: "Qual è il tuo numero di telefono?", status: "correct"}]
    feedback: "*Qual è il tuo numero di telefono?* asks for a phone number."
  it.a1.unit03.lesson03.exercise03.choose_digit_sequence:
    instruction: "03421 is read as:"
    correct_option: "zero, tre, quattro, due, uno"
    distractors: ["uno, due, quattro, tre, zero", "tre, quattro, due, uno, zero", "zero, tre, due, quattro, uno"]
    accepted_answers: [{value: "zero, tre, quattro, due, uno", status: "correct"}]
    feedback: "03421 reads as *zero, tre, quattro, due, uno* -- digit by digit, in order."
  it.a1.unit03.lesson03.exercise04.match_digit_sequence:
    instruction: "Match each digit to its Italian word."
    accepted_answers:
      - value:
          - {left: "0", right: "zero"}
          - {left: "3", right: "tre"}
          - {left: "4", right: "quattro"}
          - {left: "2", right: "due"}
          - {left: "1", right: "uno"}
        status: "correct"
    feedback: "0=zero, 3=tre, 4=quattro, 2=due, 1=uno."
  it.a1.unit03.lesson03.exercise05.listen_order_phone_number:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Il", "mio", "numero", "è", "zero", "tre", "quattro", "due", "uno"], status: "correct"}]
    feedback: "The correct order is *Il mio numero è zero, tre, quattro, due, uno.*"
  it.a1.unit03.lesson03.exercise06.reply_give_number:
    instruction: "Someone asks 'Qual è il tuo numero di telefono?' Give Sam's number: zero, three, four, two, one."
    accepted_answers:
      - {value: "Il mio numero è zero, tre, quattro, due, uno.", status: "correct"}
      - {value: "Il mio numero è zero tre quattro due uno", status: "correct"}
      - {value: "Il mio numero di telefono è zero, tre, quattro, due, uno.", status: "correct"}
    feedback: "*Il mio numero è zero, tre, quattro, due, uno.* gives the phone number digit by digit."
  it.a1.unit03.lesson03.exercise07.listen_type_number:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Il mio numero è zero, tre, quattro, due, uno.", status: "correct"}
      - {value: "Il mio numero è zero tre quattro due uno", status: "correct"}
    feedback: "*Il mio numero è zero, tre, quattro, due, uno.* means 'My number is zero, three, four, two, one.'"
  it.a1.unit03.lesson03.exercise08.write_phone_exchange:
    instruction: "Write a short exchange: ask for someone's phone number, then give the number zero, three, four, two, one as your own."
    accepted_answers:
      - {value: "Qual è il tuo numero di telefono? Il mio numero è zero, tre, quattro, due, uno.", status: "correct"}
      - {value: "Qual è il tuo numero di telefono il mio numero è zero tre quattro due uno", status: "correct"}
    feedback: "This combines the question and the reply, as in the dialogue."
  it.a1.unit03.lesson02.exercise09.dictation_neutral:
    instruction: "Type what you hear."
    correct_option: "Ne vorrei tre, grazie"
    accepted_answers: [{value: "Ne vorrei tre, grazie", status: correct}]
    orthography_strict: true
