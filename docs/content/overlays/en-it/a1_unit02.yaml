review: {status: "reviewed", required_next_reviewer: null, notes: "Second en-it overlay, authored against the reviewed it.a1.unit02 realization (Elena/Sam workplace scenario). 2026-07-12 fresh-context review (Claude, isolated from authoring reasoning). Glosses/instructions accurate; compiler 0 errors. Two matching_pairs fixes (same class as unit01): lesson01 match_city_nationality register rights were English (informal/formal) not the realization's Italian tiles (informale/formale); lesson03 match_dialogue_facts had English rights AND its third pair left/right swapped/mistranslated (left 'two years' vs the realization tile 'Quanto resta Sam a Milano?'). Both corrected to mirror the realization pairs exactly so grading works. Native-speaker review still planned."}

course:
  title: "Italian A1"
  description: "Learn A1-level Italian for everyday greetings and short social exchanges, with detailed English explanations."

units:
  it.a1.unit02.origin_nationality_language: {title: "Where you're from, nationality, and language"}

lessons:
  it.a1.unit02.lesson01.di_dove_sei: {title: "Where are you from? Asking and saying your origin"}
  it.a1.unit02.lesson02.parlare_italiano: {title: "Speaking Italian: level and languages"}
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto: {title: "Work and welcome to Milan"}

teaching:
  it.a1.unit02.lesson01.teach.di_dove: {title: "di dove", gloss: "from where", note: "*di dove* is the core building block for asking or stating origin -- it pairs with *sei* (informal) or *è* (formal).", example_gloss: ["Sam, where are you from?", "Elena, where are you from? (formal)"]}
  it.a1.unit02.lesson01.teach.di_dove_sei: {title: "Di dove sei?", gloss: "Where are you from?", note: "The informal question, used with a peer or friend, matching *tu* from unit01."}
  it.a1.unit02.lesson01.teach.di_dov_e_lei: {title: "Di dov'è, Lei?", gloss: "Where are you from? (formal)", note: "The formal question, matching *Lei* from unit01."}
  it.a1.unit02.lesson01.teach.sono_americano_chicago: {title: "Sono americano, di Chicago.", gloss: "I'm American, from Chicago.", note: "States both nationality and city of origin together."}
  it.a1.unit02.lesson01.teach.sono_italiana_milano: {title: "Sono italiana, di Milano.", gloss: "I'm Italian, from Milan.", note: "*italiana* is the feminine form of the nationality, used because Elena is a woman."}
  it.a1.unit02.lesson01.teach.nationalities: {title: "americano/americana, italiano/italiana", gloss: "American (m/f), Italian (m/f)", note: "Italian nationality words change ending to match the speaker's gender: *-o* for a man, *-a* for a woman.", example_gloss: ["Sam is American.", "Elena is Italian."]}

  it.a1.unit02.lesson02.teach.parli_italiano: {title: "Parli italiano?", gloss: "Do you speak Italian?", note: "The informal question, using the *tu*-form of *parlare* (to speak)."}
  it.a1.unit02.lesson02.teach.parla_italiano: {title: "Parla italiano?", gloss: "Do you speak Italian? (formal)", note: "The formal question, using the *Lei*-form of *parlare*."}
  it.a1.unit02.lesson02.teach.parlo_un_po: {title: "Parlo un po' d'italiano", gloss: "I speak a little Italian", note: "A modest, common way to describe your own level -- *un po'* means 'a little.'", example_gloss: "I speak a little Italian, I've been studying for a year."}
  it.a1.unit02.lesson02.teach.parlo_inglese: {title: "Parlo inglese.", gloss: "I speak English.", note: "The same *parlo* (I speak) construction with a different language."}
  it.a1.unit02.lesson02.teach.studio_da_un_anno: {title: "Studio italiano da un anno.", gloss: "I've been studying Italian for a year.", note: "*da un anno* means 'for a year,' describing an action that started in the past and continues now."}
  it.a1.unit02.lesson02.teach.parla_bene: {title: "Parli italiano bene!", gloss: "You speak Italian well!", note: "A friendly compliment on someone's language level, using the informal *tu*-form."}

  it.a1.unit02.lesson03.teach.che_lavoro_fai: {title: "Che lavoro fai?", gloss: "What do you do for work?", note: "The informal question, using the *tu*-form of *fare* (to do)."}
  it.a1.unit02.lesson03.teach.che_lavoro_fa: {title: "Che lavoro fa, Lei?", gloss: "What do you do for work? (formal)", note: "The formal question, using the *Lei*-form of *fare*."}
  it.a1.unit02.lesson03.teach.sono_ingegnere: {title: "Sono ingegnere", gloss: "I'm an engineer", note: "Job titles in Italian usually drop the article: *sono ingegnere*, not *sono un ingegnere*.", example_gloss: "I'm an engineer, I work in Milan."}
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro: {title: "Sono qui per lavoro.", gloss: "I'm here for work.", note: "*per lavoro* explains the reason for being somewhere -- work, not tourism."}
  it.a1.unit02.lesson03.teach.per_due_anni: {title: "Sono qui per due anni.", gloss: "I'm here for two years.", note: "Same construction as *per lavoro*, now stating a duration instead of a reason."}
  it.a1.unit02.lesson03.teach.che_bello_benvenuto: {title: "Che bello, benvenuto a Milano!", gloss: "How nice, welcome to Milan!", note: "*Che bello* is a common, enthusiastic reaction meaning 'how nice/great.'"}
  it.a1.unit02.lesson03.teach.grazie_mille_reprise: {title: "Grazie mille!", gloss: "Thanks a lot!", note: "The same emphatic thanks from unit01, said here in reply to a warm welcome."}

exercises:
  it.a1.unit02.lesson01.exercise01.choose_informal_origin:
    instruction: "Which question informally asks where someone is from?"
    correct_option: "Di dove sei?"
    distractors: ["Di dov'è, Lei?", "Come stai?", "Che lavoro fai?"]
    accepted_answers: [{value: "Di dove sei?", status: "correct"}]
    feedback: "*Di dove sei?* is the informal way to ask where someone is from."
  it.a1.unit02.lesson01.exercise02.listen_formal_origin:
    instruction: "Listen and select the question you hear."
    correct_option: "Di dov'è, Lei?"
    distractors: ["Di dove sei?", "Come sta?", "Parla italiano?"]
    accepted_answers: [{value: "Di dov'è, Lei?", status: "correct"}]
    feedback: "*Di dov'è, Lei?* is the formal way to ask where someone is from."
  it.a1.unit02.lesson01.exercise03.choose_nationality:
    instruction: "Sam is from Chicago. Sam is ___."
    correct_option: "americano"
    distractors: ["italiana", "italiano", "americana"]
    accepted_answers: [{value: "americano", status: "correct"}]
    feedback: "*americano* is the masculine form, matching Sam."
  it.a1.unit02.lesson01.exercise04.match_city_nationality:
    instruction: "Match each item to its meaning."
    accepted_answers:
      - value:
          - {left: "Chicago", right: "americano"}
          - {left: "Milano", right: "italiana"}
          - {left: "Di dove sei?", right: "informale"}
          - {left: "Di dov'è, Lei?", right: "formale"}
        status: "correct"
    feedback: "Chicago=americano, Milano=italiana; Di dove sei? is informale (informal), Di dov'è, Lei? is formale (formal)."
  it.a1.unit02.lesson01.exercise05.order_origin:
    instruction: "Put the words in the correct order to say 'I'm Italian, from Milan.'"
    accepted_answers: [{value: ["Sono", "italiana", "di", "Milano"], status: "correct"}]
    feedback: "The correct order is *Sono italiana di Milano.*"
  it.a1.unit02.lesson01.exercise06.listen_order_origin_informal:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Di", "dove", "sei"], status: "correct"}]
    feedback: "The correct order is *Di dove sei?*"
  it.a1.unit02.lesson01.exercise07.complete_origin:
    instruction: "Complete the sentence: 'I'm American, from Chicago.'"
    accepted_answers:
      - {value: "di", status: "correct"}
    feedback: "*Sono americano, di Chicago.* means 'I'm American, from Chicago.'"
  it.a1.unit02.lesson01.exercise08.write_origin:
    instruction: "Write a sentence saying you're American, from Chicago."
    accepted_answers:
      - {value: "Sono americano, di Chicago.", status: "correct"}
      - {value: "Sono americano di Chicago", status: "correct"}
    feedback: "*Sono americano, di Chicago.* means 'I'm American, from Chicago.'"

  it.a1.unit02.lesson02.exercise01.choose_informal_language:
    instruction: "Which question informally asks if someone speaks Italian?"
    correct_option: "Parli italiano?"
    distractors: ["Parla italiano?", "Di dove sei?", "Che lavoro fai?"]
    accepted_answers: [{value: "Parli italiano?", status: "correct"}]
    feedback: "*Parli italiano?* is the informal way to ask if someone speaks Italian."
  it.a1.unit02.lesson02.exercise02.listen_formal_language:
    instruction: "Listen and select the question you hear."
    correct_option: "Parla italiano?"
    distractors: ["Parli italiano?", "Di dov'è, Lei?", "Che lavoro fa, Lei?"]
    accepted_answers: [{value: "Parla italiano?", status: "correct"}]
    feedback: "*Parla italiano?* is the formal way to ask if someone speaks Italian."
  it.a1.unit02.lesson02.exercise03.choose_reply_level:
    instruction: "Someone asks 'Parli italiano?' Choose the natural reply."
    correct_option: "Parlo un po' d'italiano."
    distractors: ["Sono americano.", "Di dove sei?", "Che lavoro fai?"]
    accepted_answers: [{value: "Parlo un po' d'italiano.", status: "correct"}]
    feedback: "*Parlo un po' d'italiano.* modestly describes your level."
  it.a1.unit02.lesson02.exercise04.match_pronoun_verb:
    instruction: "Match each pronoun to its form of 'to speak.'"
    accepted_answers:
      - value:
          - {left: "(tu)", right: "parli"}
          - {left: "(Lei)", right: "parla"}
          - {left: "(io)", right: "parlo"}
        status: "correct"
    feedback: "(tu)=parli, (Lei)=parla, (io)=parlo."
  it.a1.unit02.lesson02.exercise05.listen_order_level:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Parlo", "un po'", "d'italiano"], status: "correct"}]
    feedback: "The correct order is *Parlo un po' d'italiano.*"
  it.a1.unit02.lesson02.exercise06.reply_about_studying:
    instruction: "Someone says 'Parli italiano bene! Da quanto studi?' Reply that you speak a little Italian and you've been studying for a year."
    accepted_answers:
      - {value: "Parlo un po' d'italiano, studio da un anno.", status: "correct"}
      - {value: "Parlo un po' d'italiano. Studio da un anno.", status: "correct"}
      - {value: "Parlo un po d italiano studio da un anno", status: "correct"}
    feedback: "*Parlo un po' d'italiano, studio da un anno.* describes your level and how long you've studied."
  it.a1.unit02.lesson02.exercise07.listen_type_reply:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Parlo un po' d'italiano.", status: "correct"}
      - {value: "Parlo un po d italiano", status: "correct"}
    feedback: "*Parlo un po' d'italiano.* means 'I speak a little Italian.'"
  it.a1.unit02.lesson02.exercise08.write_language_level:
    instruction: "Write a sentence saying you speak a little Italian and you've been studying for a year."
    accepted_answers:
      - {value: "Parlo un po' d'italiano, studio da un anno.", status: "correct"}
      - {value: "Parlo un po d italiano studio da un anno", status: "correct"}
    feedback: "*Parlo un po' d'italiano, studio da un anno.* covers both your level and how long you've studied."

  it.a1.unit02.lesson03.exercise01.choose_informal_work:
    instruction: "Which question informally asks what someone does for work?"
    correct_option: "Che lavoro fai?"
    distractors: ["Che lavoro fa, Lei?", "Di dove sei?", "Parli italiano?"]
    accepted_answers: [{value: "Che lavoro fai?", status: "correct"}]
    feedback: "*Che lavoro fai?* is the informal way to ask about someone's job."
  it.a1.unit02.lesson03.exercise02.listen_formal_work:
    instruction: "Listen and select the question you hear."
    correct_option: "Che lavoro fa, Lei?"
    distractors: ["Che lavoro fai?", "Di dov'è, Lei?", "Parla italiano?"]
    accepted_answers: [{value: "Che lavoro fa, Lei?", status: "correct"}]
    feedback: "*Che lavoro fa, Lei?* is the formal way to ask about someone's job."
  it.a1.unit02.lesson03.exercise03.choose_job_reply:
    instruction: "Someone asks 'Che lavoro fai?' Choose the natural reply."
    correct_option: "Sono ingegnere."
    distractors: ["Sono qui per lavoro.", "Sono americano.", "Parlo italiano."]
    accepted_answers: [{value: "Sono ingegnere.", status: "correct"}]
    feedback: "*Sono ingegnere.* states your job."
  it.a1.unit02.lesson03.exercise04.match_dialogue_facts:
    instruction: "Match each person or fact from the dialogue."
    accepted_answers:
      - value:
          - {left: "Sam", right: "americano, ingegnere"}
          - {left: "Elena", right: "italiana, di Milano"}
          - {left: "Quanto resta Sam a Milano?", right: "due anni"}
        status: "correct"
    feedback: "Sam=americano, ingegnere (American, engineer); Elena=italiana, di Milano (Italian, from Milan); Quanto resta Sam a Milano? (how long is Sam staying in Milan?)=due anni (two years)."
  it.a1.unit02.lesson03.exercise05.listen_order_here_for_work:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Sono", "qui", "per", "lavoro"], status: "correct"}]
    feedback: "The correct order is *Sono qui per lavoro.*"
  it.a1.unit02.lesson03.exercise06.reply_welcome:
    instruction: "Someone says 'Che bello, benvenuto a Milano!' Reply with an emphatic thanks."
    accepted_answers:
      - {value: "Grazie mille.", status: "correct"}
      - {value: "Grazie mille", status: "correct"}
    feedback: "*Grazie mille.* means 'thanks a lot.'"
  it.a1.unit02.lesson03.exercise07.listen_type_job:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Sono ingegnere.", status: "correct"}
      - {value: "Sono ingegnere", status: "correct"}
    feedback: "*Sono ingegnere.* means 'I'm an engineer.'"
  it.a1.unit02.lesson03.exercise08.write_full_intro:
    instruction: "Write a short introduction: say you're American, from Chicago, an engineer, and here for work."
    accepted_answers:
      - {value: "Sono americano, di Chicago. Sono ingegnere. Sono qui per lavoro.", status: "correct"}
      - {value: "Sono americano di Chicago sono ingegnere sono qui per lavoro", status: "correct"}
    feedback: "This combines origin, job, and reason for being there, as Sam does in the dialogue."
  it.a1.unit02.lesson01.exercise09.dictation_informal:
    instruction: "Type what you hear."
    correct_option: "Di dove sei"
    accepted_answers: [{value: "Di dove sei", status: correct}]
    orthography_strict: true
