source_language: "en"
target_language: "it"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "New A2 en-it overlay; needs fresh-context content review before import."}
course:
  title: "Italian A2"
  description: "Learn A2-level Italian for everyday administrative, service, and work situations, with detailed English explanations."
units:
  it.a2.unit26.opinioni: {title: "Opinions and reasons"}
lessons:
  it.a2.unit26.lesson01.secondo_me: {title: "In my opinion"}
  it.a2.unit26.lesson02.rispondere: {title: "Responding to an opinion"}
teaching:
  it.a2.unit26.lesson01.teach_secondo_me: {title: "Secondo me...", gloss: "In my opinion...", note: "*Secondo me* is the natural chunk for 'in my opinion.' Do not translate word by word as *in mia opinione*.", example_gloss: ["In my opinion the neighborhood is convenient."]}
  it.a2.unit26.lesson01.teach_perche: {title: "perché", gloss: "because / why", note: "*Perché* can mean both 'because' and 'why'; here it introduces a reason.", example_gloss: ["I like it because it is nearby."]}
  it.a2.unit26.lesson01.teach_comodo_rumoroso: {title: "il quartiere, comodo, rumoroso", gloss: "the neighborhood, convenient, noisy", note: "Adjectives usually change ending. This unit uses masculine singular with *il quartiere*.", example_gloss: ["The neighborhood is convenient.", "The bar is noisy."]}
  it.a2.unit26.lesson01.teach_sono_daccordo: {title: "Sono d'accordo.", gloss: "I agree.", note: "Italian uses *sono d'accordo* ('I am in agreement'), not a direct verb like English 'agree.'", example_gloss: ["I agree with you."]}
  it.a2.unit26.lesson01.teach_metropolitana: {title: "la metropolitana", gloss: "the metro", note: "*Metropolitana* is often shortened to *metro* in conversation, but this unit teaches the full form.", example_gloss: ["There is the metro in the neighborhood."]}
  it.a2.unit26.lesson02.teach_capisco_ma: {title: "Capisco, ma...", gloss: "I understand, but...", note: "Use this to respond politely before giving a different opinion.", example_gloss: ["I understand, but in my opinion it is expensive."]}
  it.a2.unit26.lesson02.teach_non_daccordo: {title: "Non sono d'accordo.", gloss: "I don't agree.", note: "Put *non* before *sono*. English speakers often place the negative too late.", example_gloss: ["I don't agree, because it is too noisy."]}
  it.a2.unit26.lesson02.teach_e_vero_pero: {title: "È vero, però...", gloss: "That's true, however...", note: "*Però* is a stronger 'but/however' connector and is useful when you accept part of the other view.", example_gloss: ["That's true, however the shops are useful."]}
  it.a2.unit26.lesson02.teach_troppo_utile: {title: "troppo, utile", gloss: "too much/too, useful", note: "*Troppo rumoroso* means 'too noisy.' *Utile* changes in the plural: *utili*.", example_gloss: ["It is too noisy.", "The bank is useful."]}
exercises:
  it.a2.unit26.lesson01.exercise01.choose_secondo_me:
    instruction: "Which phrase means 'in my opinion'?"
    correct_option: "Secondo me"
    distractors: ["Per favore", "A che ora", "Quanto costa"]
    accepted_answers: [{value: "Secondo me", status: "correct"}]
    feedback: "*Secondo me* introduces an opinion."
  it.a2.unit26.lesson01.exercise02.listen_opinion_reason:
    instruction: "Listen and select the opinion and reason you hear."
    correct_option: "Secondo me il quartiere è comodo perché c'è la metropolitana."
    distractors: ["Secondo me il ristorante è caro perché è elegante.", "Il quartiere è lontano e non mi piace.", "Sono d'accordo perché il museo è aperto."]
    accepted_answers: [{value: "Secondo me il quartiere è comodo perché c'è la metropolitana.", status: "correct"}]
    feedback: "The speaker says the neighborhood is convenient because there is the metro."
  it.a2.unit26.lesson01.exercise03.choose_perche:
    instruction: "Which word introduces a reason?"
    correct_option: "perché"
    distractors: ["però", "quando", "quanto"]
    accepted_answers: [{value: "perché", status: "correct"}]
    feedback: "*Perché* introduces the reason."
  it.a2.unit26.lesson01.exercise04.match_opinion_words:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "in my opinion", right: "secondo me"}
          - {left: "because", right: "perché"}
          - {left: "convenient", right: "comodo"}
          - {left: "noisy", right: "rumoroso"}
          - {left: "I agree.", right: "Sono d'accordo."}
          - {left: "the neighborhood", right: "il quartiere"}
        status: "correct"
    feedback: "These words let you state an opinion and support it."
  it.a2.unit26.lesson01.exercise05.order_secondo_me:
    instruction: "Put the words in order to say 'In my opinion it is convenient.'"
    accepted_answers: [{value: ["Secondo", "me", "è", "comodo"], status: "correct"}]
    feedback: "The correct order is *Secondo me è comodo.*"
  it.a2.unit26.lesson01.exercise06.fill_perche:
    instruction: "Complete the sentence with the word for 'because.'"
    accepted_answers: [{value: "perché", status: "correct"}]
    feedback: "*Mi piace perché è vicino* gives a reason."
  it.a2.unit26.lesson01.exercise07.write_opinion_sentence:
    instruction: "Write the taught opinion sentence: in my opinion the neighborhood is convenient because it is nearby."
    accepted_answers:
      - {value: "Secondo me il quartiere è comodo perché è vicino.", status: "correct"}
      - {value: "Secondo me il quartiere è comodo perche è vicino", status: "acceptable_with_note", note: "Accent *perché* in careful writing."}
    feedback: "*Secondo me il quartiere è comodo perché è vicino.* gives an opinion and a reason."
  it.a2.unit26.lesson02.exercise01.choose_non_daccordo:
    instruction: "Which sentence means 'I don't agree'?"
    correct_option: "Non sono d'accordo."
    distractors: ["Sono d'accordo.", "Secondo me.", "È molto comodo."]
    accepted_answers: [{value: "Non sono d'accordo.", status: "correct"}]
    feedback: "*Non sono d'accordo* means 'I don't agree.'"
  it.a2.unit26.lesson02.exercise02.listen_disagree_reason:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Non sono d'accordo, perché è troppo rumoroso."
    distractors: ["Sono d'accordo, perché è molto comodo.", "Capisco, ma il lavoro è vicino.", "È vero, però i negozi sono utili."]
    accepted_answers: [{value: "Non sono d'accordo, perché è troppo rumoroso.", status: "correct"}]
    feedback: "The speaker disagrees and gives the reason: it is too noisy."
  it.a2.unit26.lesson02.exercise03.choose_pero:
    instruction: "Which phrase accepts part of another opinion and then contrasts?"
    correct_option: "È vero, però..."
    distractors: ["Dov'è la banca?", "Sono dieci euro.", "A che ora arrivi?"]
    accepted_answers: [{value: "È vero, però...", status: "correct"}]
    feedback: "*È vero, però...* means 'That's true, however...'"
  it.a2.unit26.lesson02.exercise04.match_responses:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "I understand, but...", right: "Capisco, ma..."}
          - {left: "I don't agree.", right: "Non sono d'accordo."}
          - {left: "That's true, however...", right: "È vero, però..."}
          - {left: "too noisy", right: "troppo rumoroso"}
          - {left: "useful shops", right: "negozi utili"}
          - {left: "near work", right: "vicino al lavoro"}
        status: "correct"
    feedback: "These phrases respond to another opinion and add a reason."
  it.a2.unit26.lesson02.exercise05.order_non_daccordo:
    instruction: "Put the words in order to say 'I don't agree.'"
    accepted_answers: [{value: ["Non", "sono", "d'accordo"], status: "correct"}]
    feedback: "The correct order is *Non sono d'accordo.*"
  it.a2.unit26.lesson02.exercise06.reply_contrast:
    instruction: "Elena says 'Secondo me il quartiere è comodo.' Reply with the taught contrasting sentence: I understand, but in my opinion it is too noisy."
    accepted_answers:
      - {value: "Capisco, ma secondo me è troppo rumoroso.", status: "correct"}
      - {value: "Capisco ma secondo me è troppo rumoroso", status: "correct"}
    feedback: "*Capisco, ma secondo me è troppo rumoroso* responds to the other opinion."
  it.a2.unit26.lesson02.exercise07.write_opinion_with_reason:
    instruction: "Write: *Secondo me il quartiere è comodo perché è vicino al lavoro. Capisco, ma è troppo rumoroso.*"
    accepted_answers:
      - {value: "Secondo me il quartiere è comodo perché è vicino al lavoro. Capisco, ma è troppo rumoroso.", status: "correct"}
      - {value: "Secondo me il quartiere è comodo perche è vicino al lavoro. Capisco ma è troppo rumoroso", status: "acceptable_with_note", note: "Accent *perché* in careful writing."}
    feedback: "The answer gives an opinion, a reason, and a response to a contrasting opinion."
