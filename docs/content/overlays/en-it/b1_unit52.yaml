  it.b1.unit52.lesson02.teach_riassunto_completo: {title: "in breve... il punto principale è... un dettaglio non essenziale è...", gloss: "in short... the main point is... a non-essential detail is...", note: "A good summary is short and ordered, and it separates the main point from the details.", example_gloss: ["In short, Sam visited three cities in one week. The main point is that he had a lot of fun. A non-essential detail is the steak in Florence."]}
