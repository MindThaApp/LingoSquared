course:
  title: "Italian A2"
  description: "Learn A2-level Italian for everyday administrative, service, and work situations, with detailed English explanations."
units:
  it.a2.unit25.burocrazia: {title: "Registering at the town hall"}
lessons:
  it.a2.unit25.lesson01.documenti: {title: "The documents"}
  it.a2.unit25.lesson02.appuntamento: {title: "The appointment"}
teaching:
  it.a2.unit25.lesson01.teach_refresher_saluti: {title: "Buongiorno, grazie.", gloss: "Good morning, thank you.", note: "A2 starts as its own tier, so this card refreshes common formal greetings before they appear in office messages.", example_gloss: ["Good morning and thank you."]}
  it.a2.unit25.lesson01.teach_refresher_ho_e: {title: "Ho un documento e il codice fiscale.", gloss: "I have a document and the tax code.", note: "*Ho* means 'I have' and *e* means 'and'; both are reused throughout formal A2 service exchanges.", example_gloss: ["I have a document and the form."]}
  it.a2.unit25.lesson01.teach_refresher_essere_vicino: {title: "È vicino al lavoro. C'è la metropolitana.", gloss: "It is near work. There is the metro.", note: "This refreshes *è* ('is'), *c'è* ('there is'), and *vicino al lavoro* ('near work') for the standalone A2 tier.", example_gloss: ["The town hall is near work."]}
  it.a2.unit25.lesson01.teach_documento_codice: {title: "il documento d'identità, il codice fiscale", gloss: "identity document, tax code", note: "*Codice fiscale* is the Italian tax code. English speakers often try to say *codice tax*; keep the Italian noun-adjective order.", example_gloss: ["I have an identity document.", "The tax code is necessary."]}
  it.a2.unit25.lesson01.teach_contratto_modulo: {title: "il contratto d'affitto, il modulo", gloss: "rental contract, form", note: "*D'affitto* means rental/lease. Do not translate 'form' as *forma* here; the official form is *modulo*.", example_gloss: ["I am bringing the rental contract.", "I am filling in the form today."]}
  it.a2.unit25.lesson01.teach_registrare_residenza: {title: "registrare la residenza", gloss: "to register residence", note: "Italian uses *residenza* for official registered residence, not a general word for any home.", example_gloss: ["I have to register residence in Milan."]}
  it.a2.unit25.lesson01.teach_entro_venerdi: {title: "entro venerdì", gloss: "by Friday", note: "*Entro* means a deadline, like 'by' in English. It is not *da venerdì*, which means from Friday.", example_gloss: ["I have to submit the form by Friday."]}
  it.a2.unit25.lesson02.teach_vorrei_appuntamento: {title: "Vorrei prendere un appuntamento.", gloss: "I would like to make an appointment.", note: "*Vorrei* is the polite conditional request form. It fits offices and formal phone calls.", example_gloss: ["I would like to make an appointment at the town hall."]}
  it.a2.unit25.lesson02.teach_in_comune: {title: "in comune", gloss: "at the town hall", note: "Use *in comune* for an appointment or office action at the town hall.", example_gloss: ["I would like to make an appointment at the town hall."]}
  it.a2.unit25.lesson02.teach_per_registrare: {title: "per registrare la residenza", gloss: "to register residence", note: "Use *per* plus infinitive to give the purpose of the appointment.", example_gloss: ["I would like an appointment to register residence."]}
  it.a2.unit25.lesson02.teach_porti_documenti: {title: "Porti un documento d'identità.", gloss: "Bring an identity document.", note: "*Porti* is the formal *Lei* command. The informal form would be *porta*.", example_gloss: ["Bring an identity document, please."]}
  it.a2.unit25.lesson02.teach_entro_quando: {title: "Entro quando devo consegnare il modulo?", gloss: "By when do I have to submit the form?", note: "*Devo* plus infinitive means 'I have to.' English word order changes in questions; Italian keeps *devo consegnare* together.", example_gloss: ["By when do I have to submit the form at the town hall?"]}
exercises:
  it.a2.unit25.lesson01.exercise01.choose_codice:
    instruction: "Which phrase means 'the tax code'?"
    correct_option: "il codice fiscale"
    distractors: ["il documento d'identità", "il contratto d'affitto", "il modulo"]
    accepted_answers: [{value: "il codice fiscale", status: "correct"}]
    feedback: "*Il codice fiscale* is the Italian tax code."
  it.a2.unit25.lesson01.exercise02.listen_documenti:
    instruction: "Listen and select the documents you hear."
    correct_option: "documento d'identità e codice fiscale"
    distractors: ["passaporto e modulo", "contratto d'affitto e ricevuta", "tessera sanitaria e foto"]
    accepted_answers: [{value: "documento d'identità e codice fiscale", status: "correct"}]
    feedback: "The recording says *documento d'identità e codice fiscale*."
  it.a2.unit25.lesson01.exercise03.choose_residenza:
    instruction: "Which phrase means 'to register residence'?"
    correct_option: "registrare la residenza"
    distractors: ["pagare con la carta", "andare dal dottore", "aprire un conto"]
    accepted_answers: [{value: "registrare la residenza", status: "correct"}]
    feedback: "*Registrare la residenza* is the official registration action."
  it.a2.unit25.lesson01.exercise04.match_documenti:
    instruction: "Match each English item to Italian."
    accepted_answers:
      - value:
          - {left: "identity document", right: "il documento d'identità"}
          - {left: "tax code", right: "il codice fiscale"}
          - {left: "rental contract", right: "il contratto d'affitto"}
          - {left: "form", right: "il modulo"}
          - {left: "register residence", right: "registrare la residenza"}
          - {left: "by Friday", right: "entro venerdì"}
        status: "correct"
    feedback: "These are the core town-hall registration words."
  it.a2.unit25.lesson01.exercise05.order_codice_fiscale:
    instruction: "Put the words in order to say 'the tax code.'"
    accepted_answers: [{value: ["il", "codice", "fiscale"], status: "correct"}]
    feedback: "The correct order is *il codice fiscale*."
  it.a2.unit25.lesson01.exercise06.fill_modulo:
    instruction: "Complete the sentence with the word for 'form.'"
    accepted_answers: [{value: "modulo", status: "correct"}]
    feedback: "*Compilo il modulo* means 'I fill in the form.'"
  it.a2.unit25.lesson01.exercise07.write_checklist:
    instruction: "Write these four registration items in Italian, in this order: identity document, tax code, rental contract, form."
    accepted_answers:
      - {value: "documento d'identità, codice fiscale, contratto d'affitto, modulo", status: "correct"}
      - {value: "documento d'identità codice fiscale contratto d'affitto modulo", status: "correct"}
    feedback: "The checklist is *documento d'identità, codice fiscale, contratto d'affitto, modulo*."
  it.a2.unit25.lesson02.exercise01.choose_appuntamento:
    instruction: "Which sentence starts a polite appointment request?"
    correct_option: "Vorrei prendere un appuntamento."
    distractors: ["Prendo il treno.", "Ho lo scontrino.", "Sono molto stanco."]
    accepted_answers: [{value: "Vorrei prendere un appuntamento.", status: "correct"}]
    feedback: "*Vorrei prendere un appuntamento* is a polite formal request."
  it.a2.unit25.lesson02.exercise02.listen_appuntamento:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Vorrei prendere un appuntamento per registrare la residenza."
    distractors: ["Vorrei aprire un conto corrente.", "Vorrei parlare con il medico.", "Vorrei comprare un biglietto."]
    accepted_answers: [{value: "Vorrei prendere un appuntamento per registrare la residenza.", status: "correct"}]
    feedback: "The speaker asks for an appointment to register residence."
  it.a2.unit25.lesson02.exercise03.listen_requisiti:
    instruction: "Listen and select the required items."
    correct_option: "documento d'identità, codice fiscale e contratto d'affitto"
    distractors: ["passaporto, foto e ricevuta", "carta, contanti e scontrino", "telefono, indirizzo e biglietto"]
    accepted_answers: [{value: "documento d'identità, codice fiscale e contratto d'affitto", status: "correct"}]
    feedback: "The official asks for an identity document, tax code, and rental contract."
  it.a2.unit25.lesson02.exercise04.match_formal_exchange:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "I would like to make an appointment.", right: "Vorrei prendere un appuntamento."}
          - {left: "to register residence", right: "per registrare la residenza"}
          - {left: "Bring an identity document.", right: "Porti un documento d'identità."}
          - {left: "By when?", right: "Entro quando?"}
          - {left: "I must submit the form", right: "devo consegnare il modulo"}
          - {left: "at the town hall", right: "in comune"}
        status: "correct"
    feedback: "These phrases keep the exchange formal and clear."
  it.a2.unit25.lesson02.exercise05.order_appuntamento:
    instruction: "Put the words in order to say 'I would like to make an appointment.'"
    accepted_answers: [{value: ["Vorrei", "prendere", "un", "appuntamento"], status: "correct"}]
    feedback: "The correct order is *Vorrei prendere un appuntamento.*"
  it.a2.unit25.lesson02.exercise06.reply_clarify_deadline:
    instruction: "The clerk says 'Porti un documento d'identità e il modulo.' Ask the taught formal question: by when do I have to submit the form?"
    accepted_answers:
      - {value: "Entro quando devo consegnare il modulo?", status: "correct"}
      - {value: "Entro quando devo consegnare il modulo", status: "correct"}
    feedback: "*Entro quando devo consegnare il modulo?* asks for the deadline."
  it.a2.unit25.lesson02.exercise07.write_registration_request:
    instruction: "Write a formal message: start with *Buongiorno*, ask for an appointment to register residence, say you have an identity document and tax code, and end with *Grazie*."
    accepted_answers:
      - {value: "Buongiorno, vorrei prendere un appuntamento per registrare la residenza. Ho un documento d'identità e il codice fiscale. Grazie.", status: "correct"}
      - {value: "Buongiorno vorrei prendere un appuntamento per registrare la residenza ho un documento d'identità e il codice fiscale grazie", status: "correct"}
    feedback: "The message requests the appointment and gives the required details."
  it.a2.unit25.lesson02.exercise08.dictation_appuntamento_residenza:
    instruction: "Type what you hear."
    correct_option: "Vorrei prendere un appuntamento per registrare la residenza"
    accepted_answers: [{value: "Vorrei prendere un appuntamento per registrare la residenza", status: correct}]
    orthography_strict: true
