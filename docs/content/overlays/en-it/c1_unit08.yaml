    title: "The complete appeal"
    gloss: "Who among us has never lost an hour between one meeting and the next? Every meeting distracts us, every notification interrupts us, every break slows us down. This is exactly the moment to change. More time to think, more time to finish. It is worth trying it: let's do it starting Monday."
