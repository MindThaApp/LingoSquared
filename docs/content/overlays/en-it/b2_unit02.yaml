    distractors: [certainly, because, however]
    accepted_answers: [{value: "perhaps / maybe", status: correct}]
    feedback: "*Magari* means perhaps/maybe -- a colloquial guessing word."
  it.b2.unit02.lesson03.exercise02.listen_potrebbe_bloccato:
    instruction: "Listen and select what you hear."
    correct_option: "He might be stuck in traffic."
    distractors: ["He must be stuck in traffic.", "He was stuck in traffic.", "He is stuck at home."]
    accepted_answers: [{value: "He might be stuck in traffic.", status: correct}]
    feedback: "*Potrebbe essere bloccato nel traffico* means he might be stuck in traffic (a tentative guess, weaker than deve)."
  it.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"potrebbe essere": "might be / could be", magari: "perhaps / maybe", "a casa": "at home", "immagino che": "I imagine that", "non ne sono sicuro": "I'm not sure", "scommetto che": "I bet that"}
        status: correct
    feedback: "These are this lesson's possibility and guessing words."
  it.b2.unit02.lesson03.exercise04.order_potrebbe_a_casa:
    instruction: "Put the words in order: He might be at home."
    accepted_answers:
      - {value: "Potrebbe essere a casa", status: correct}
    feedback: "*Potrebbe essere a casa* means he might be at home."
  it.b2.unit02.lesson03.exercise05.translate_potrebbe_a_casa:
    instruction: "Translate into Italian, using potrebbe essere: He might be at home."
    accepted_answers:
      - {value: "Potrebbe essere a casa", status: correct}
    feedback: "*Potrebbe essere a casa* means he might be at home."
  it.b2.unit02.lesson03.exercise06.speak_magari_ancora:
    instruction: "Say aloud in Italian, guessing: Maybe he is still at home."
    accepted_answers:
      - {value: "Magari è ancora a casa", status: correct}
    feedback: "*Magari è ancora a casa* means maybe he is still at home."
  it.b2.unit02.lesson03.exercise07.write_non_sicuro:
    instruction: "Write in Italian, signalling you are only guessing: I'm not sure."
    accepted_answers:
      - {value: "Non ne sono sicuro", status: correct}
    feedback: "*Non ne sono sicuro* means I'm not sure."

  it.b2.unit02.lesson04.exercise01.recognize_perso:
    instruction: "What does this word mean?"
    correct_option: missed
    distractors: [forgotten, happened, "woken up"]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "*Perso* is the past participle of *perdere*, to miss/lose."
  it.b2.unit02.lesson04.exercise02.listen_deve_aver_perso:
    instruction: "Listen and select what you hear."
    correct_option: "He must have missed the train."
