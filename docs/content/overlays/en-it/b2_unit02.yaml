  it.b2.unit02.lesson04.exercise05.translate_deve_aver_perso:
    instruction: "Translate into Italian, using deve aver... (must have): He must have missed the train."
    accepted_answers:
      - {value: "Deve aver perso il treno", status: correct}
    feedback: "*Deve aver perso il treno* means he must have missed the train."
  it.b2.unit02.lesson04.exercise06.write_successo_qualcosa:
    instruction: "Write in Italian, using deve essere... (must have): Something must have happened."
    accepted_answers:
      - {value: "Deve essere successo qualcosa", status: correct}
    feedback: "*Deve essere successo qualcosa* means something must have happened."
  it.b2.unit02.lesson04.exercise07.translate_potrebbe_svegliato:
    instruction: "Translate into Italian, using potrebbe essersi... (might have, reflexive): He might have overslept."
    accepted_answers:
      - {value: "Potrebbe essersi svegliato tardi", status: correct}
    feedback: "*Potrebbe essersi svegliato tardi* means he might have overslept."

  it.b2.unit02.lesson05.exercise01.read_fact:
    instruction: "Which of these does the writer state as a FACT, not as speculation?"
    correct_option: "His car is gone."
    distractors: ["He overslept.", "He is stuck in traffic.", "He forgot the appointment."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "The writer states as a plain fact: *la sua auto non c'è* (his car is gone)."
  it.b2.unit02.lesson05.exercise02.read_guess:
    instruction: "Which cause does the writer only GUESS at, admitting he is not sure?"
    correct_option: "That he overslept."
    distractors: ["That he is stuck in traffic.", "That his phone is off.", "That his car is gone."]
    accepted_answers: [{value: "That he overslept.", status: correct}]
    feedback: "The writer only guesses: *forse si è svegliato tardi, ma non ne sono sicuro* (maybe he overslept, but I'm not sure)."
  it.b2.unit02.lesson05.exercise03.read_deduction:
    instruction: "How certain is the writer that Sam is stuck in traffic, and on what basis?"
    correct_option: "Fairly confident, based on it being rush hour."
    distractors: ["Completely certain, based on a phone call.", "Not sure at all, just a random guess.", "Certain, because Sam texted to say so."]
    accepted_answers: [{value: "Fairly confident, based on it being rush hour.", status: correct}]
    feedback: "*Sarà bloccato nel traffico, perché è ora di punta* -- the epistemic future plus a stated reason (rush hour)."
  it.b2.unit02.lesson05.exercise04.read_evidence:
    instruction: "What is the writer's evidence that Sam is not at home?"
    correct_option: "His car is gone."
    distractors: ["His phone is off.", "It is rush hour.", "He usually arrives late."]
    accepted_answers: [{value: "His car is gone.", status: correct}]
    feedback: "*Non è ancora a casa, perché la sua auto non c'è* (he isn't home yet, because his car is gone)."
  it.b2.unit02.lesson05.exercise05.match_reading_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {stasera: "this evening", "il telefono": "the phone", spento: "off / switched off", "ora di punta": "rush hour", "una cosa": "a thing", certa: "certain (f.)"}
        status: correct
    feedback: "These are the reading's key words."
  it.b2.unit02.lesson05.exercise06.translate_telefono_spento:
    instruction: "Translate into Italian: His phone is off."
    accepted_answers:
      - {value: "Il suo telefono è spento", status: correct}
    feedback: "*Il suo telefono è spento* means his phone is off."
  it.b2.unit02.lesson05.exercise07.write_ora_di_punta:
    instruction: "Write in Italian: It is rush hour."
    accepted_answers:
      - {value: "È ora di punta", status: correct}
    feedback: "*È ora di punta* means it is rush hour."

  it.b2.unit02.lesson06.exercise01.comprehend_first_cause:
    instruction: "What is Marco's first explanation for why Sam is late?"
    correct_option: "He's probably stuck in traffic."
    distractors: ["He probably overslept.", "He probably missed the train.", "He probably forgot."]
    accepted_answers: [{value: "He's probably stuck in traffic.", status: correct}]
    feedback: "Marco's first guess: *Sarà bloccato nel traffico.*"
  it.b2.unit02.lesson06.exercise02.comprehend_certainty:
    instruction: "When Marco says 'No, non può essere' about oversleeping, how certain is he, and why?"
    correct_option: "Completely certain -- he saw Sam that morning."
    distractors: ["Not certain at all, just guessing.", "Fairly certain, based on rush hour.", "Uncertain, because he hasn't spoken to Sam."]
    accepted_answers: [{value: "Completely certain -- he saw Sam that morning.", status: correct}]
    feedback: "Marco rules it out with real evidence: *L'ho visto stamattina* (I saw him this morning)."
  it.b2.unit02.lesson06.exercise03.comprehend_guess:
    instruction: "Is Marco's final line ('Forse. Non ne sono sicuro.') a deduction or a guess?"
    correct_option: "A guess -- he has no evidence for it."
    distractors: ["A deduction from clear evidence.", "A certain fact.", "A repeat of Elena's claim."]
    accepted_answers: [{value: "A guess -- he has no evidence for it.", status: correct}]
    feedback: "*Forse* (maybe) and *non ne sono sicuro* (I'm not sure) mark this as an open guess, not a deduction."
  it.b2.unit02.lesson06.exercise04.order_potrebbe_svegliato:
    instruction: "Put the words in order: He might have overslept."
    accepted_answers:
      - {value: "Potrebbe essersi svegliato tardi", status: correct}
    feedback: "*Potrebbe essersi svegliato tardi* means he might have overslept."
  it.b2.unit02.lesson06.exercise05.speak_deve_bloccato:
    instruction: "Sam's car is gone and it's rush hour, but he isn't here. Speculate aloud about the present cause, using deve essere (deduction): He must be stuck in traffic."
    accepted_answers:
      - {value: "Deve essere bloccato nel traffico", status: correct}
    feedback: "*Deve essere bloccato nel traffico* means he must be stuck in traffic."
  it.b2.unit02.lesson06.exercise06.write_past_and_present:
    instruction: "Write TWO Italian sentences speculating about why Sam is late, at DIFFERENT certainty levels. (1) A PAST cause you are sure of (deduction), using deve aver...: He must have missed the train. (2) A PRESENT cause you are less sure of, using probabilmente: He is probably stuck in traffic."
    accepted_answers:
      - {value: "Deve aver perso il treno. È probabilmente bloccato nel traffico", status: correct}
    feedback: "*Deve aver perso il treno. È probabilmente bloccato nel traffico.*"
  it.b2.unit02.lesson06.exercise07.respond_speculate:
    instruction: "Sam is late. Reply to 'Perché Sam è così in ritardo?' with a confident present deduction."
    accepted_answers:
      - {value: "Sarà bloccato nel traffico", status: correct}
      - {value: "Deve essere bloccato nel traffico", status: correct}
    feedback: "*Sarà bloccato nel traffico* -- a confident present deduction about why he is late."
