course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: speculate about causes and consequences
    with graded certainty (forse, probabilmente, sarà, di sicuro, senza
    dubbio, sicuramente), deduce from evidence (deve essere, non può
    essere) versus guess (potrebbe essere, magari, immagino che), and
    speculate about the PAST (deve aver perso, deve essersi svegliato),
    around the everyday puzzle of a friend running late.

units:
  it.b2.unit02.speculazione:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and tell a deduction from a guess.

lessons:
  it.b2.unit02.lesson01.quanto_sei_sicuro:
    title: "How certain are you?"
  it.b2.unit02.lesson02.deduzione:
    title: "Deduction: it must be so"
  it.b2.unit02.lesson03.supposizione_o_deduzione:
    title: "A guess or a deduction?"
  it.b2.unit02.lesson04.il_passato:
    title: "Speculating about the past"
  it.b2.unit02.lesson05.fatto_o_supposizione:
    title: "Fact or speculation?"
  it.b2.unit02.lesson06.speculare_in_conversazione:
    title: "Speculating in conversation"

teaching:
  it.b2.unit02.lesson01.teach.sam_non_e_qui:
    title: "Sam isn't here yet."
    gloss: "Sam isn't here yet."
  it.b2.unit02.lesson01.teach.perche_cosi_ritardo:
    title: "Why is he so late?"
    gloss: "Why is he so late?"
  it.b2.unit02.lesson01.teach.forse:
    title: maybe
    gloss: maybe
    example_gloss: "Maybe he is late."
  it.b2.unit02.lesson01.teach.probabilmente:
    title: probably
    gloss: probably
    example_gloss: "He is probably late."
  it.b2.unit02.lesson01.teach.sara:
    title: "is probably (future of certainty)"
    gloss: "he's probably / he must be (epistemic future)"
    note: "Italian famously uses the FUTURE TENSE to express present probability: *sarà in ritardo* does not mean 'he will be late' here, it means 'he's probably late / he must be late'. This is a very common everyday construction with no direct English equivalent -- English uses a modal, Italian uses a tense."
    example_gloss: "He's probably late."
  it.b2.unit02.lesson01.teach.di_sicuro:
    title: "for sure"
    gloss: "for sure / surely"
  it.b2.unit02.lesson01.teach.senza_dubbio:
    title: "without a doubt"
    gloss: "without a doubt / undoubtedly"
  it.b2.unit02.lesson01.teach.sicuramente:
    title: certainly
    gloss: "certainly / surely"
    example_gloss: "He is certainly late."
  it.b2.unit02.lesson01.teach.grammar_certezza:
    title: "The certainty scale"
    gloss: "Maybe he is late. He is probably late. He's probably late. He is certainly late."
    note: "A certainty scale, roughly low to high: *forse* (maybe) < *probabilmente* (probably) < *sarà* (epistemic future: he's probably/must be) < *di sicuro*/*senza dubbio* (for sure/without a doubt) < *sicuramente* (certainly)."

  it.b2.unit02.lesson02.teach.deve:
    title: must
    gloss: "must (deduction)"
    note: "*Dovere* (deve = 3rd person) expresses a confident DEDUCTION from evidence, not an obligation here: *deve essere in ufficio* = 'he must be at the office' (I've reasoned this out), not 'he has to be at the office'."
    example_gloss: "He must be at the office."
  it.b2.unit02.lesson02.teach.bloccato_nel_traffico:
    title: "stuck in traffic"
    gloss: "stuck in traffic"
  it.b2.unit02.lesson02.teach.deve_essere_bloccato:
    title: "He must be stuck in traffic."
    gloss: "He must be stuck in traffic."
  it.b2.unit02.lesson02.teach.non_puo_essere:
    title: "cannot be"
    gloss: "cannot be (deduction)"
    note: "*Non può essere* is the negative deduction: ruling something out with confidence, not just saying it's not allowed."
  it.b2.unit02.lesson02.teach.malato:
    title: sick
    gloss: sick
    example_gloss: "He cannot be sick."
  it.b2.unit02.lesson02.teach.perche_evidenza:
    title: "because I saw him just now"
    gloss: "because I saw him just now"
    note: "*L'ho visto poco fa* (I saw him just now) is the kind of concrete evidence that turns a claim into a real deduction rather than a guess."
  it.b2.unit02.lesson02.teach.quindi:
    title: "so / therefore"
    gloss: "so / therefore"
    example_gloss: "So he must be at the office."
  it.b2.unit02.lesson02.teach.auto_non_ce:
    title: "His car is gone."
    gloss: "His car isn't here. / His car is gone."
    note: "*Non c'è* = 'isn't there / is gone' -- everyday evidence used to build a deduction."
  it.b2.unit02.lesson02.teach.grammar_deduzione:
    title: "Deduction from evidence"
    gloss: "His car is gone, so he must be at the office. He cannot be sick, because I saw him just now."
    note: "Deduction = a confident conclusion from real evidence, signalled with *deve*/*non può essere* plus *perché* (giving your evidence) or *quindi* (drawing the conclusion)."

  it.b2.unit02.lesson03.teach.potrebbe_essere:
    title: "might be / could be"
    gloss: "might be / could be"
    note: "*Potrebbe* is the conditional of *potere*, used for a tentative possibility -- weaker than *deve*."
  it.b2.unit02.lesson03.teach.magari:
    title: "perhaps / maybe"
    gloss: "perhaps / maybe (colloquial)"
    example_gloss: "Maybe he's at home."
  it.b2.unit02.lesson03.teach.a_casa:
    title: "at home"
    gloss: "at home"
    example_gloss: "I'm at home."
  it.b2.unit02.lesson03.teach.non_ne_sono_sicuro:
    title: "I'm not sure"
    gloss: "I'm not sure (of it)"
  it.b2.unit02.lesson03.teach.immagino_che:
    title: "I imagine that"
    gloss: "I imagine that / I'd guess that"
    note: "*Immaginare che* is an opinion verb like *credere che* (unit01) and also triggers the congiuntivo: *immagino che sia a casa*, not *è*."
    example_gloss: "I imagine he's at home."
  it.b2.unit02.lesson03.teach.scommetto_che:
    title: "I bet that"
    gloss: "I bet that"
  it.b2.unit02.lesson03.teach.grammar_supposizione:
    title: "Guess versus deduction"
    gloss: "I imagine he's at home, but I'm not sure. His car is gone, so he must be at the office."
    note: "A GUESS (*potrebbe*, *magari*, *immagino che*, *scommetto che*) has no firm evidence behind it; a DEDUCTION (*deve*, *non può essere*) is a confident conclusion from evidence you can name."

  it.b2.unit02.lesson04.teach.perdere_il_treno:
    title: "to miss the train"
    gloss: "to miss the train"
  it.b2.unit02.lesson04.teach.deve_aver_perso:
    title: "He must have missed the train."
    gloss: "He must have missed the train."
    note: "Past deduction is built with *dovere* + *avere* (shortened to *aver* before a participle) + the past participle: *deve aver perso* = 'must have missed'."
  it.b2.unit02.lesson04.teach.succedere:
    title: "to happen"
    gloss: "to happen"
    example_gloss: "Something must have happened."
  it.b2.unit02.lesson04.teach.qualcosa:
    title: something
    gloss: something
    example_gloss: "Something must have happened."
  it.b2.unit02.lesson04.teach.svegliarsi_tardi:
    title: "to oversleep"
    gloss: "to wake up late / to oversleep"
  it.b2.unit02.lesson04.teach.deve_essersi_svegliato:
    title: "He must have overslept."
    gloss: "He must have overslept."
    note: "With a reflexive verb like *svegliarsi*, past deduction uses *essersi* instead of *aver*: *deve essersi svegliato* (must have woken himself up late)."
  it.b2.unit02.lesson04.teach.dimenticare_appuntamento:
    title: "to forget the appointment"
    gloss: "to forget the appointment"
  it.b2.unit02.lesson04.teach.deve_aver_dimenticato:
    title: "He must have forgotten the appointment."
    gloss: "He must have forgotten the appointment."
  it.b2.unit02.lesson04.teach.potrebbe_aver_perso:
    title: "He might have missed the train."
    gloss: "He might have missed the train."
    note: "*Potrebbe* (might) also combines with *aver*/*essersi* + participle for a tentative PAST guess: *potrebbe aver perso* = 'might have missed'."
  it.b2.unit02.lesson04.teach.grammar_passato:
    title: "Speculating about the past"
    gloss: "He must have missed the train. Something must have happened. He might have overslept."
    note: "Past speculation = *dovere*/*potere* + *aver*/*essersi* + past participle. *Deve* gives a confident past deduction; *potrebbe* gives a tentative past guess."

  it.b2.unit02.lesson05.teach.testo:
    title: "Reading: is Sam stuck in traffic?"
    gloss: "Sam isn't here yet this evening. His phone is off. He's probably stuck in traffic, because it's rush hour. Maybe he overslept, but I'm not sure. One thing is certain: he isn't home yet, because his car is gone."
    glosses:
      stasera: "this evening"
      suo: his
      telefono: phone
      spento: "off / switched off"
      ora: hour
      punta: "peak (ora di punta = rush hour)"
      si: "himself (reflexive pronoun, si è svegliato = he woke up)"
      una: a
      cosa: thing
      certa: "certain (feminine, agreeing with cosa)"

  it.b2.unit02.lesson06.teach.allora:
    title: "so / then"
    gloss: "so / then"
    example_gloss: "So he must be at the office."
  it.b2.unit02.lesson06.teach.stamattina:
    title: "this morning"
    gloss: "this morning"
    example_gloss: "I saw him this morning."
  it.b2.unit02.lesson06.teach.no:
    title: "No"
    gloss: "No"
    example_gloss: "No, that can't be."
  it.b2.unit02.lesson06.teach.dialogue_elena_setup:
    title: "Elena: Sam isn't here yet. Why is he so late?"
    gloss: "Elena: Sam isn't here yet. Why is he so late?"
  it.b2.unit02.lesson06.teach.dialogue_marco_deduction:
    title: "Marco: He's probably stuck in traffic. It's rush hour."
    gloss: "Marco: He's probably stuck in traffic. It's rush hour."
  it.b2.unit02.lesson06.teach.dialogue_elena_possibility:
    title: "Elena: Could he have overslept?"
    gloss: "Elena: Could he have overslept?"
  it.b2.unit02.lesson06.teach.dialogue_marco_rule_out:
    title: "Marco: No, that can't be. I saw him this morning."
    gloss: "Marco: No, that can't be. I saw him this morning."
  it.b2.unit02.lesson06.teach.dialogue_elena_past_deduction:
    title: "Elena: Then he must have missed the train."
    gloss: "Elena: Then he must have missed the train."
  it.b2.unit02.lesson06.teach.dialogue_marco_guess:
    title: "Marco: Maybe. I'm not sure."
    gloss: "Marco: Maybe. I'm not sure."
  it.b2.unit02.lesson06.teach.grammar_speculazione_completa:
    title: "Speculating in conversation"
    gloss: "He must have missed the train. He's probably stuck in traffic. He might have overslept, but I'm not sure."
    note: "A full speculation exchange mixes certainty levels naturally, from a confident past deduction (*deve aver perso*) to a hedged present guess (*probabilmente*) to an open guess (*potrebbe*, *non ne sono sicuro*)."

exercises:
