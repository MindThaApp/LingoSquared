teaching:
  it.b1.unit36.lesson01.teach_bisogna_che: {title: "bisogna che", gloss: "it is necessary that", note: "*Bisogna che* is fixed; the verb after *che* changes for the person.", example_gloss: ["It is necessary that Sam submit the form today."]}
