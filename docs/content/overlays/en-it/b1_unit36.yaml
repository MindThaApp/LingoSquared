course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit36.obblighi: {title: "Obligation with the subjunctive"}
lessons:
  it.b1.unit36.lesson01.bisogna_che: {title: "Bisogna che..."}
  it.b1.unit36.lesson02.divieto_rimpianto: {title: "Prohibition and regret"}
teaching:
  it.b1.unit36.lesson01.teach_bisogna_che: {title: "bisogna che", gloss: "it is necessary that", note: "*Bisogna che* is fixed; the verb after *che* changes for the person.", example_gloss: ["It is necessary that Sam submit the form today."]}
  it.b1.unit36.lesson01.teach_consegni: {title: "consegni", gloss: "submits", note: "*Consegni* is the form used after *bisogna che* here.", example_gloss: ["Sam submits the form. It is necessary that Sam submit the form."]}
  it.b1.unit36.lesson01.teach_modulo_oggi: {title: "Sam, il modulo, oggi", gloss: "Sam, the form, today", note: "These basics are reintroduced because this B1 tier starts without crediting earlier tiers.", example_gloss: ["Sam submits the form today."]}
  it.b1.unit36.lesson01.teach_non_bisogna: {title: "non bisogna che", gloss: "one must not / it is prohibited that", note: "Negating *bisogna* gives a prohibition in this unit.", example_gloss: ["Elena must not sign before the confirmation."]}
  it.b1.unit36.lesson02.teach_firmi_conferma: {title: "firmi prima della conferma", gloss: "signs before the confirmation", note: "*Firmi* is the form used after *non bisogna che* here.", example_gloss: ["Elena must not sign before the confirmation."]}
  it.b1.unit36.lesson02.teach_sarebbe_bisognato: {title: "Bisognava che io chiamassi prima, ma non l'ho fatto", gloss: "I should have called earlier, but I did not", note: "*Bisognava che* plus a changed verb can express an unfulfilled obligation; the second clause makes the regret explicit.", example_gloss: ["I should have called earlier, but I did not."]}
  it.b1.unit36.lesson02.teach_chiamassi_prima: {title: "io chiamassi prima", gloss: "that I would call earlier", note: "*Chiamassi* is the embedded verb form used in the regret sentence.", example_gloss: ["I should have called earlier, but I did not."]}
  it.b1.unit36.lesson02.teach_tre_parti: {title: "Bisogna che... Non bisogna che... Bisognava che...", gloss: "It is necessary that... One must not... I should have...", note: "The final task requires all three: present obligation, prohibition, and past regret.", example_gloss: "It is necessary that Sam submit the form today. Elena must not sign before the confirmation. I should have called earlier, but I did not."}
exercises:
  it.b1.unit36.lesson01.exercise01.choose_bisogna_che:
    instruction: "Which phrase means 'it is necessary that'?"
    correct_option: "bisogna che"
    distractors: ["non bisogna che", "bisognava che", "prima della conferma"]
    accepted_answers: [{value: "bisogna che", status: "correct"}]
    feedback: "*Bisogna che* introduces a present obligation."
  it.b1.unit36.lesson01.exercise02.listen_obligation:
    instruction: "Listen and select the exact Italian sentence you hear."
    correct_option: "Bisogna che Sam consegni il modulo oggi."
    distractors: ["Non bisogna che Elena firmi prima della conferma.", "Bisognava che io chiamassi prima, ma non l'ho fatto.", "Sam consegna il modulo ieri."]
    accepted_answers: [{value: "Bisogna che Sam consegni il modulo oggi.", status: "correct"}]
    feedback: "The sentence states a present obligation."
  it.b1.unit36.lesson01.exercise03.match_obligation:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "it is necessary that", right: "bisogna che"}
          - {left: "submit", right: "consegni"}
          - {left: "the form", right: "il modulo"}
          - {left: "today", right: "oggi"}
          - {left: "Sam", right: "Sam"}
          - {left: "Sam submits the form today", right: "Sam consegni il modulo oggi"}
        status: "correct"
    feedback: "These pieces build the present obligation."
  it.b1.unit36.lesson01.exercise04.order_bisogna:
    instruction: "Put the words in order to build the present obligation sentence."
    accepted_answers: [{value: ["Bisogna", "che", "Sam", "consegni", "il", "modulo", "oggi"], status: "correct"}]
    feedback: "The full sentence is *Bisogna che Sam consegni il modulo oggi.*"
  it.b1.unit36.lesson01.exercise05.fill_consegni:
    instruction: "Complete the sentence with the taught embedded verb form *consegni*."
    accepted_answers: [{value: "consegni", status: "correct"}]
    feedback: "After *bisogna che*, use *consegni* here."
  it.b1.unit36.lesson01.exercise06.write_obligation:
    instruction: "Write the exact present obligation with *Bisogna che* and the verb form *consegni*: Sam submits the form today."
    accepted_answers:
      - {value: "Bisogna che Sam consegni il modulo oggi.", status: "correct"}
      - {value: "Bisogna che Sam consegni il modulo oggi", status: "correct"}
    feedback: "This is a present obligation with *bisogna che* plus a changed verb."
  it.b1.unit36.lesson02.exercise01.choose_non_bisogna:
    instruction: "Which phrase expresses the taught prohibition?"
    correct_option: "non bisogna che"
    distractors: ["bisogna che", "bisognava che", "io chiamassi"]
    accepted_answers: [{value: "non bisogna che", status: "correct"}]
    feedback: "*Non bisogna che* expresses the prohibition in this unit."
  it.b1.unit36.lesson02.exercise02.listen_prohibition:
    instruction: "Listen and select the exact Italian sentence you hear."
    correct_option: "Non bisogna che Elena firmi prima della conferma."
    distractors: ["Bisogna che Sam consegni il modulo oggi.", "Bisognava che io chiamassi prima, ma non l'ho fatto.", "Elena firma il modulo oggi."]
    accepted_answers: [{value: "Non bisogna che Elena firmi prima della conferma.", status: "correct"}]
    feedback: "The sentence states what must not happen."
  it.b1.unit36.lesson02.exercise03.match_regret:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "it is prohibited that", right: "non bisogna che"}
          - {left: "signs", right: "firmi"}
          - {left: "before the confirmation", right: "prima della conferma"}
          - {left: "it was necessary that", right: "bisognava che"}
          - {left: "that I would call", right: "io chiamassi"}
          - {left: "I should have called earlier, but I did not", right: "Bisognava che io chiamassi prima, ma non l'ho fatto"}
        status: "correct"
    feedback: "These pieces cover prohibition and regret."
  it.b1.unit36.lesson02.exercise04.order_prohibition:
    instruction: "Put the words in order to build the prohibition sentence."
    accepted_answers: [{value: ["Non", "bisogna", "che", "Elena", "firmi", "prima", "della", "conferma"], status: "correct"}]
    feedback: "The full sentence is *Non bisogna che Elena firmi prima della conferma.*"
  it.b1.unit36.lesson02.exercise05.fill_chiamassi:
    instruction: "Complete the regret sentence with the taught embedded verb form *chiamassi*."
    accepted_answers: [{value: "chiamassi", status: "correct"}]
    feedback: "*Bisognava che io chiamassi prima, ma non l'ho fatto* expresses regret about an unfulfilled obligation."
  it.b1.unit36.lesson02.exercise06.write_full_obligation:
    instruction: "Write exactly three Italian sentences: present obligation with *Bisogna che Sam consegni il modulo oggi*; prohibition with *Non bisogna che Elena firmi prima della conferma*; past regret with *Bisognava che io chiamassi prima, ma non l'ho fatto*."
    accepted_answers:
      - {value: "Bisogna che Sam consegni il modulo oggi. Non bisogna che Elena firmi prima della conferma. Bisognava che io chiamassi prima, ma non l'ho fatto.", status: "correct"}
      - {value: "Bisogna che Sam consegni il modulo oggi Non bisogna che Elena firmi prima della conferma Bisognava che io chiamassi prima ma non l'ho fatto", status: "correct"}
    feedback: "This includes present obligation, prohibition, and past regret."
