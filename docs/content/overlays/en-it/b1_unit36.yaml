  it.b1.unit36.lesson01.teach_non_bisogna: {title: "bisogna che ... non", gloss: "it is necessary that ... not", note: "Put *non* right before the embedded verb to say something must not happen. (*Non bisogna che...* would mean 'it is not necessary that...'.)", example_gloss: ["Elena must not sign before the confirmation."]}
  it.b1.unit36.lesson02.teach_firmi_conferma: {title: "firmi prima della conferma", gloss: "signs before the confirmation", note: "*Firmi* is the form used after *bisogna che* here; *non* goes right before it.", example_gloss: ["Elena must not sign before the confirmation."]}
  it.b1.unit36.lesson02.teach_sarebbe_bisognato: {title: "Bisognava che io chiamassi prima, ma non l'ho fatto", gloss: "I should have called earlier, but I did not", note: "*Bisognava che* plus a changed verb can express an unfulfilled obligation; the second clause makes the regret explicit.", example_gloss: ["I should have called earlier, but I did not."]}
  it.b1.unit36.lesson02.teach_chiamassi_prima: {title: "io chiamassi prima", gloss: "that I called earlier", note: "*Chiamassi* is the embedded verb form used in the regret sentence.", example_gloss: ["I should have called earlier, but I did not."]}
  it.b1.unit36.lesson02.teach_tre_parti: {title: "Bisogna che... Bisogna che ... non... Bisognava che...", gloss: "It is necessary that... It is necessary that ... not... I should have...", note: "Three frames: present obligation (*bisogna che*), prohibition (*bisogna che ... non*), and past regret (*bisognava che*).", example_gloss: "It is necessary that Sam submit the form today. Elena must not sign before the confirmation. I should have called earlier, but I did not."}
