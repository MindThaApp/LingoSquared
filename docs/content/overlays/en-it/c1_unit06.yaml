review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for Italian C1 unit 06 on idiomatic and figurative language.
    English-speaker interference risks: translating idioms word-for-word (a
    literal calque) instead of using the natural Italian expression, and
    writing an open production prompt that could be answered with several
    different taught idioms. The production exercises therefore name the exact
    idiom and accept the exact taught model string, with punctuation variants
    only at the final boundary. No sibling-direction overlay was consulted.

course:
  title: Italian C1
  description: "Advanced Italian: idiomatic, collocational, and figurative language."

units:
  it.c1.unit06.idiomi_e_figurato:
    title: "Idioms and figurative language"
    description: "Understand and use Italian idioms and figurative language naturally, choosing register-appropriate expressions and avoiding literal calques."

lessons:
  it.c1.unit06.idiomi_e_figurato.lesson01.significato_figurato:
    title: "Literal and figurative meaning"
  it.c1.unit06.idiomi_e_figurato.lesson02.essere_al_verde:
    title: "Being broke and taking stock"
  it.c1.unit06.idiomi_e_figurato.lesson03.non_vedere_ora:
    title: "Eagerness and decisiveness"
  it.c1.unit06.idiomi_e_figurato.lesson04.mani_in_pasta:
    title: "Being involved and deflecting"
  it.c1.unit06.idiomi_e_figurato.lesson05.leggere_figurato:
    title: "Reading figurative language"
  it.c1.unit06.idiomi_e_figurato.lesson06.produzione_idiomatica:
    title: "Producing idiomatic Italian"

teaching:
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.idioma:
    title: "the idiom"
    gloss: "the idiom"
    note: "An idiom (*idioma*) is a fixed expression whose meaning is not the sum of its individual words."
    example_gloss: "An idiom has a meaning you cannot grasp from the individual words."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.significato_letterale:
    title: "the literal meaning"
    gloss: "the literal meaning"
    note: "*Il significato letterale* is what the words say at face value."
    example_gloss: "The literal meaning describes the words one by one."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.significato_figurato:
    title: "the figurative meaning"
    gloss: "the figurative meaning"
    note: "*Il significato figurato* is the non-literal, image-based meaning an idiom carries."
    example_gloss: "The figurative meaning hides an image."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.due_piccioni:
    title: "to kill two birds with one stone"
    gloss: "to achieve two goals with one action"
    note: "Literally *prendere due piccioni con una fava* means 'to catch two pigeons with one bean'; idiomatically it means achieving two results with a single action."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.cadere_nuvole:
    title: "to be flabbergasted"
    gloss: "to be taken completely by surprise"
    note: "Literally 'to fall from the clouds' (*cadere dalle nuvole*); idiomatically, to be utterly astonished by unexpected news."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.modello_piccioni:
    title: "A two-for-one result"
    gloss: "I achieved two goals with one action."
    note: "In the past tense (*Ho preso*), this reports a single action that produced two results."
  it.c1.unit06.idiomi_e_figurato.lesson01.teach.modello_nuvole:
    title: "Caught by surprise"
    gloss: "I was flabbergasted."
    note: "*Sono caduto dalle nuvole* uses *caduto* (fallen), the past participle, to describe a reaction of surprise."

  it.c1.unit06.idiomi_e_figurato.lesson02.teach.al_verde:
    title: "to be broke"
    gloss: "to have no money left"
    note: "Literally *essere al verde* means 'to be at the green'; idiomatically it means to be out of money."
  it.c1.unit06.idiomi_e_figurato.lesson02.teach.modello_verde:
    title: "I am broke"
    gloss: "I am broke."
    note: "*Sono al verde* is the conjugated first-person form of *essere al verde*."
  it.c1.unit06.idiomi_e_figurato.lesson02.teach.punto_situazione:
    title: "to take stock of the situation"
    gloss: "to take stock of the situation"
    note: "*Fare il punto della situazione* is a strong collocation meaning to review and sum up where things stand."
  it.c1.unit06.idiomi_e_figurato.lesson02.teach.modello_punto:
    title: "Let's take stock"
    gloss: "Let's take stock of the situation."
    note: "*Facciamo* (we do/make) is the first-person plural of *fare*, used here for the proposal 'let's take stock'."

  it.c1.unit06.idiomi_e_figurato.lesson03.teach.non_vedere_ora:
    title: "to be unable to wait"
    gloss: "to be unable to wait"
    note: "Literally *non vedere l'ora* means 'not to see the hour'; idiomatically, to be very eager for something. It is used with *di* + infinitive."
  it.c1.unit06.idiomi_e_figurato.lesson03.teach.modello_ora:
    title: "I can't wait to leave"
    gloss: "I can't wait to leave."
    note: "*Non vedo l'ora di partire* pairs the idiom with *di* + infinitive (*partire*)."
  it.c1.unit06.idiomi_e_figurato.lesson03.teach.tagliare_testa:
    title: "to settle a matter once and for all"
    gloss: "to settle a matter once and for all"
    note: "Literally *tagliare la testa al toro* means 'to cut the bull's head'; idiomatically, to put a decisive end to a matter."
  it.c1.unit06.idiomi_e_figurato.lesson03.teach.modello_toro:
    title: "Let's settle this"
    gloss: "Let's settle this matter once and for all."
    note: "*Tagliamo la testa al toro* uses the first-person plural to propose a decisive resolution."

  it.c1.unit06.idiomi_e_figurato.lesson04.teach.mani_in_pasta:
    title: "to have a hand in something"
    gloss: "to be directly involved in something"
    note: "Literally *avere le mani in pasta* means 'to have one's hands in the dough'; idiomatically, to be directly involved in a matter."
  it.c1.unit06.idiomi_e_figurato.lesson04.teach.modello_pasta:
    title: "Deeply involved"
    gloss: "I have a hand in this project."
    note: "*Ho le mani in pasta in questo progetto* describes direct involvement in the project."
  it.c1.unit06.idiomi_e_figurato.lesson04.teach.buttarla_ridere:
    title: "to laugh something off"
    gloss: "to make light of something"
    note: "Literally *buttarla sul ridere* means 'to throw it onto laughing'; idiomatically, to deflect something awkward by making light of it."
  it.c1.unit06.idiomi_e_figurato.lesson04.teach.modello_ridere:
    title: "Laughed off"
    gloss: "He laughed it off."
    note: "*L'ha buttata sul ridere* shows the idiom with the clitic pronoun: *l'ha buttata* = he/she threw it."

  it.c1.unit06.idiomi_e_figurato.lesson05.teach.metafora:
    title: "the metaphor"
    gloss: "the metaphor"
    note: "A metaphor (*la metafora*) compares two things without saying *come* (like)."
    example_gloss: "The metaphor creates a comparison without using the word like."
  it.c1.unit06.idiomi_e_figurato.lesson05.teach.collocazione:
    title: "the collocation"
    gloss: "the collocation"
    note: "A collocation (*la collocazione*) is a combination of words that conventionally go together and sound natural."
    example_gloss: "A collocation is a combination of words that sounds natural."
  it.c1.unit06.idiomi_e_figurato.lesson05.teach.passaggio:
    title: "Sam's reflection"
    gloss: "I am broke, but I can't wait to leave. I have a hand in this project. Let's take stock of the situation and settle the matter once and for all. Yesterday I was flabbergasted, but in the end I killed two birds with one stone."
    note: "This passage uses six taught idioms and the collocation *fare il punto della situazione*; each one carries a piece of Sam's situation and tone."

  it.c1.unit06.idiomi_e_figurato.lesson06.teach.modello_riscrittura:
    title: "Idiomatic rewrites"
    gloss: "I am broke. I achieved two goals with one action. I was flabbergasted. Let's settle this matter once and for all."
    note: "These sentences rewrite literal ideas using *essere al verde*, *prendere due piccioni con una fava*, *cadere dalle nuvole*, and *tagliare la testa al toro*."
  it.c1.unit06.idiomi_e_figurato.lesson06.teach.modello_due_idiomi:
    title: "Several idioms, one situation"
    gloss: "I am broke, but I can't wait to leave. I have a hand in this project, so let's take stock of the situation and settle the matter once and for all."
    note: "One natural response that combines *essere al verde*, *non vedere l'ora*, *avere le mani in pasta*, *fare il punto della situazione*, and *tagliare la testa al toro*."

