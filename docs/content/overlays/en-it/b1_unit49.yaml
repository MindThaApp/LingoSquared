course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit49.ipotesi_condizionale: {title: "Unreal hypotheses and the conditional"}
lessons:
  it.b1.unit49.lesson01.ipotesi_irreale: {title: "If I had more time, I would travel more"}
  it.b1.unit49.lesson02.condizionale_per_attenuare: {title: "Could you close the window?"}
teaching:
  it.b1.unit49.lesson01.teach_se_avessi_piu_tempo: {title: "se avessi più tempo", gloss: "if I had more time", note: "*Avessi* is the imperfect subjunctive of *avere*, used after *se* for an unreal present condition.", example_gloss: ["If I had more time, I would travel more."]}
  it.b1.unit49.lesson01.teach_viaggerei_di_piu: {title: "viaggerei di più", gloss: "I would travel more", note: "*Viaggerei* is the present conditional of *viaggiare*, paired with the imperfect-subjunctive *se*-clause.", example_gloss: ["If I had more time, I would travel more with Elena."]}
  it.b1.unit49.lesson01.teach_se_potessi_andrei: {title: "se potessi, andrei in Italia", gloss: "if I could, I would go to Italy", note: "*Potessi* (imperfect subjunctive of *potere*) + conditional *andrei* forms the same unreal-condition pattern.", example_gloss: ["If I could, I would go to Italy with Sam."]}
  it.b1.unit49.lesson02.teach_potresti_chiudere: {title: "potresti chiudere la finestra?", gloss: "could you close the window?", note: "The conditional *potresti* used alone (no *se*-clause) softens a request.", example_gloss: ["Could you close the window, please?"]}
  it.b1.unit49.lesson02.teach_preferirei_restare: {title: "preferirei restare a casa stasera", gloss: "I would prefer to stay home tonight", note: "The conditional *preferirei* used alone softens a stated preference.", example_gloss: ["I would prefer to stay home tonight, I'm tired."]}
  it.b1.unit49.lesson02.teach_ipotesi_completa: {title: "se avessi più tempo, viaggerei di più... potresti chiudere la finestra?", gloss: "if I had more time, I would travel more... could you close the window?", note: "The final task requires both an unreal hypothesis and a softened request using the conditional alone.", example_gloss: ["If I had more time, I would travel more. Could you close the window? I would prefer to stay home tonight."]}
exercises:
  it.b1.unit49.lesson01.exercise01.choose_avessi:
    instruction: "Which phrase states an unreal present condition ('if I had more time')?"
    correct_option: "se avessi più tempo"
    distractors: ["se ho più tempo", "se avrò più tempo", "se ho avuto più tempo"]
    accepted_answers: [{value: "se avessi più tempo", status: "correct"}]
    feedback: "*Se avessi* (imperfect subjunctive) states an unreal condition."
  it.b1.unit49.lesson01.exercise02.listen_ipotesi:
    instruction: "Listen and choose what the sentences say."
    correct_option: "If I had more time, I would travel more. If I could, I would go to Italy with Sam."
    distractors: ["I have more time, so I travel more.", "I will have more time next year.", "I would prefer to stay home tonight."]
    accepted_answers: [{value: "If I had more time, I would travel more. If I could, I would go to Italy with Sam.", status: "correct"}]
    feedback: "The sentences are *Se avessi più tempo, viaggerei di più. Se potessi, andrei in Italia con Sam.*"
  it.b1.unit49.lesson01.exercise03.match_ipotesi:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "if I had more time", right: "se avessi più tempo"}
          - {left: "I would travel more", right: "viaggerei di più"}
          - {left: "if I could", right: "se potessi"}
          - {left: "I would go to Italy", right: "andrei in Italia"}
          - {left: "you should explain", right: "dovresti spiegare"}
          - {left: "if I were you", right: "se fossi in te"}
        status: "correct"
    feedback: "These pieces express unreal hypotheses with se + imperfect subjunctive + conditional."
  it.b1.unit49.lesson01.exercise04.order_ipotesi:
    instruction: "Put the words in order to build the hypothesis."
    accepted_answers: [{value: ["Se", "avessi", "più", "tempo,", "viaggerei", "di", "più"], status: "correct"}]
    feedback: "The sentence is *Se avessi più tempo, viaggerei di più.*"
  it.b1.unit49.lesson01.exercise05.fill_avessi:
    instruction: "Complete the sentence with *avessi*."
    accepted_answers: [{value: "avessi", status: "correct"}]
    feedback: "*Avessi* is the imperfect subjunctive of *avere*."
  it.b1.unit49.lesson01.exercise06.write_ipotesi:
    instruction: "Write exactly one sentence with an unreal present hypothesis, se + imperfect subjunctive + conditional: *Se avessi più tempo, viaggerei di più.*"
    accepted_answers:
      - {value: "Se avessi più tempo, viaggerei di più.", status: "correct"}
      - {value: "Se avessi più tempo, viaggerei di più", status: "correct"}
    feedback: "Se + imperfect subjunctive + conditional states an unreal present hypothesis."
  it.b1.unit49.lesson02.exercise01.choose_potresti:
    instruction: "Which phrase softens a request using the conditional alone (no if-clause)?"
    correct_option: "potresti chiudere la finestra?"
    distractors: ["chiudi la finestra!", "chiuderai la finestra?", "hai chiuso la finestra?"]
    accepted_answers: [{value: "potresti chiudere la finestra?", status: "correct"}]
    feedback: "*Potresti* alone (conditional, no se-clause) softens the request."
  it.b1.unit49.lesson02.exercise02.listen_ipotesi_completa:
    instruction: "Listen and choose what the sentences say."
    correct_option: "If I had more time, I would travel more. Could you close the window? I would prefer to stay home tonight."
    distractors: ["I have more time, so I travel more.", "Close the window right now!", "I will stay home tomorrow."]
    accepted_answers: [{value: "If I had more time, I would travel more. Could you close the window? I would prefer to stay home tonight.", status: "correct"}]
    feedback: "The full passage is *Se avessi più tempo, viaggerei di più. Potresti chiudere la finestra? Preferirei restare a casa stasera.*"
  it.b1.unit49.lesson02.exercise03.match_attenuare:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "could you close", right: "potresti chiudere"}
          - {left: "the window", right: "la finestra"}
          - {left: "I would prefer to stay", right: "preferirei restare"}
          - {left: "at home tonight", right: "a casa stasera"}
          - {left: "I would travel more", right: "viaggerei di più"}
          - {left: "if I had more time", right: "se avessi più tempo"}
        status: "correct"
    feedback: "These pieces use the conditional alone to soften a request and a preference."
  it.b1.unit49.lesson02.exercise04.order_attenuare:
    instruction: "Put the words in order to build the softened request."
    accepted_answers: [{value: ["Potresti", "chiudere", "la", "finestra?"], status: "correct"}]
    feedback: "The sentence is *Potresti chiudere la finestra?*"
  it.b1.unit49.lesson02.exercise05.fill_preferirei:
    instruction: "Complete the sentence with *preferirei*."
    accepted_answers: [{value: "preferirei", status: "correct"}]
    feedback: "*Preferirei* softens a preference using the conditional alone."
  it.b1.unit49.lesson02.exercise06.write_ipotesi_completa:
    instruction: "Write exactly two sentences: an unreal hypothesis, *Se avessi più tempo, viaggerei di più*; and a softened request using the conditional alone, *Potresti chiudere la finestra?*"
    accepted_answers:
      - {value: "Se avessi più tempo, viaggerei di più. Potresti chiudere la finestra?", status: "correct"}
      - {value: "Se avessi più tempo, viaggerei di più Potresti chiudere la finestra?", status: "correct"}
      - {value: "Se avessi più tempo, viaggerei di più. Potresti chiudere la finestra", status: "correct"}
    feedback: "The two sentences show an unreal hypothesis and a softened request, both using the conditional."
