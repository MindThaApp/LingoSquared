course:
  title: Italian C1
  description: "Advanced Italian implicit meaning: recognize and produce irony and understatement."

units:
  it.c1.unit02.ironia:
    title: "Communicating the implicit: irony and understatement"
    description: "Recognize, interpret, and produce irony and understatement to convey skepticism indirectly."

lessons:
  it.c1.unit02.lesson01.riconoscere_sottinteso:
    title: "Recognizing understatement"
  it.c1.unit02.lesson02.contesto_ironia:
    title: "Irony and context"
  it.c1.unit02.lesson03.intenzione_letterale:
    title: "Intention beyond the literal"
  it.c1.unit02.lesson04.ascolto_implicito:
    title: "Listening for the implicit"
  it.c1.unit02.lesson05.produrre_sottinteso:
    title: "Producing understatement"
  it.c1.unit02.lesson06.sintesi_completa:
    title: "Complete synthesis: understanding and producing implicit meaning"

teaching:
  it.c1.unit02.lesson01.teach.non_male:
    title: "not bad / quite good"
    gloss: "not bad (but actually quite good)"
    note: "*Non è male* is classic Italian understatement — the literal words say 'not bad,' but context implies the accomplishment was impressive."
    example_gloss: "Not bad, for a start."
  it.c1.unit02.lesson01.teach.sottinteso:
    title: "the implication / unspoken meaning"
    gloss: "what you mean but do not state"
    note: "*Il sottinteso* is the implied meaning beneath the literal words."
    example_gloss: "The implication is what you mean without saying it."
  it.c1.unit02.lesson01.teach.ironia:
    title: "irony"
    gloss: "saying the opposite of what you mean"
    note: "*L'ironia* is saying what you do not mean, usually for effect or criticism."
    example_gloss: "Irony is saying the opposite of what you think."

  it.c1.unit02.lesson02.teach.contesto:
    title: "context"
    gloss: "the circumstances; the setting"
    note: "*Il contesto* shapes whether an utterance is ironic or genuine."
    example_gloss: "Context explains if a phrase is ironic."

  it.c1.unit02.lesson03.teach.intenzione:
    title: "intention"
    gloss: "what someone actually means to convey"
    note: "*L'intenzione* of ironic speech rarely matches the literal words."
    example_gloss: "Sam's intention is not to praise himself."

  it.c1.unit02.lesson04.teach.indizio:
    title: "clue / cue"
    gloss: "a signal or hint guiding interpretation"
    note: "*L'indizio* in irony can be tone, pause, or word choice signaling the meaning is reversed."
    example_gloss: "Tone of voice is a clue that someone is ironic."
  it.c1.unit02.lesson04.teach.sì:
    title: "yes"
    gloss: "yes"
    note: "*Sì* is the affirmative in Italian. In ironic responses, it can mask disagreement."
    example_gloss: "Yes, naturally."
  it.c1.unit02.lesson04.teach.naturalmente:
    title: "naturally / of course"
    gloss: "of course; naturally"
    note: "*Naturalmente* in ironic contexts signals sarcasm — the speaker means the opposite."
    example_gloss: "Yes, naturally, we have such a relaxing life."
  it.c1.unit02.lesson04.teach.abbiamo:
    title: "we have"
    gloss: "we have"
    note: "*Abbiamo* is the first-person plural present of *avere* (to have)."
    example_gloss: "We have such a relaxing life."
  it.c1.unit02.lesson04.teach.vita:
    title: "life"
    gloss: "life"
    note: "*La vita* means life. In ironic contexts, describing it as relaxing implies the opposite."
    example_gloss: "Life is relaxing."
  it.c1.unit02.lesson04.teach.così:
    title: "so / such"
    gloss: "so; such"
    note: "*Così* intensifies an adjective. *Una vita così rilassante* = such a relaxing life."
    example_gloss: "Life is so relaxing."
  it.c1.unit02.lesson04.teach.rilassante:
    title: "relaxing"
    gloss: "relaxing"
    note: "*Rilassante* is an adjective describing something as relaxing or stress-free."
    example_gloss: "A relaxing life is what we want."

  it.c1.unit02.lesson05.teach.rispondere_ironico:
    title: "to respond with irony"
    gloss: "to craft an ironic response"
    note: "*Rispondere con ironia* means to create a remark whose implied meaning contradicts its literal wording."
    example_gloss: "When you criticize indirectly, you respond with irony."

  it.c1.unit02.lesson06.teach.osservazione:
    title: "observation / remark"
    gloss: "an observation; a remark"
    note: "*L'osservazione* is a statement or comment. Ironically calling an observation *corretta* (correct) signals that you think it is wrong."
    example_gloss: "The boss's observation is correct?"
  it.c1.unit02.lesson06.teach.corretta:
    title: "correct"
    gloss: "correct; right"
    note: "*Corretta* is the feminine form of *corretto*. In ironic contexts, it can mask disagreement."
    example_gloss: "A correct observation is the right one."
  it.c1.unit02.lesson06.teach.progetto:
    title: "project"
    gloss: "a project"
    note: "*Il progetto* is a work undertaking. Saying it is 'davvero facile' (truly easy) ironically implies difficulty."
    example_gloss: "This project is truly easy."
  it.c1.unit02.lesson06.teach.questo:
    title: "this"
    gloss: "this"
    note: "*Questo* is the demonstrative pronoun for 'this' (masculine singular)."
    example_gloss: "This is difficult."
  it.c1.unit02.lesson06.teach.davvero:
    title: "truly / really"
    gloss: "truly; really"
    note: "*Davvero* intensifies a statement. In ironic contexts, it emphasizes the false claim."
    example_gloss: "This project is truly easy."
  it.c1.unit02.lesson06.teach.facile:
    title: "easy"
    gloss: "easy"
    note: "*Facile* means easy. Saying something is *facile* when it is clearly difficult is irony."
    example_gloss: "It is not easy to complete."

exercises:
  it.c1.unit02.lesson01.exercise01.recognize_understatement:
    instruction: "When someone who completed an impressive difficult task says 'Non è male' about their own work, what are they really saying?"
    gloss: "When someone who completed an impressive difficult task says 'Non è male' about their own work, what are they really saying?"
    options:
      - "Downplaying something quite good"
      - "Something genuinely bad"
      - "A literal statement"
    correct_option: "Downplaying something quite good"
    accepted_answers:
      - value: "Downplaying something quite good"
        status: correct
    feedback: "Correct. 'Non è male' is classic Italian understatement."

  it.c1.unit02.lesson02.exercise01.match_context:
    instruction: "Match each Italian term to its meaning."
    gloss: "Match each Italian term to its meaning."
    pairs:
      - {left: "Non è male", right: "Understatement"}
      - {left: "L'ironia", right: "saying the opposite of what you mean"}
      - {left: "Il contesto", right: "Situation"}
    accepted_answers:
      - value:
          - {left: "Non è male", right: "Understatement"}
          - {left: "L'ironia", right: "saying the opposite of what you mean"}
          - {left: "Il contesto", right: "Situation"}
        status: correct
    feedback: "Correct. Each phrase captures part of how implicit meaning works."

  it.c1.unit02.lesson03.exercise01.infer_meaning:
    instruction: "When someone says 'Non è male' about their impressive work, what is their actual attitude?"
    gloss: "When someone says 'Non è male' about their impressive work, what is their actual attitude?"
    options:
      - "They are downplaying it"
      - "It is actually bad"
      - "It is literally not negative"
    correct_option: "They are downplaying it"
    accepted_answers:
      - value: "They are downplaying it"
        status: correct
    feedback: "Correct. By deliberately playing it down, they imply the accomplishment was actually impressive."

  it.c1.unit02.lesson04.exercise01.listen_irony:
    instruction: "Elena has just finished a difficult project that went very well. She says this about it. What does 'Non è male' signal?"
    gloss: "Elena has just finished a difficult project that went very well. She says this about it. What does 'Non è male' signal?"
    options:
      - "Understatement of an accomplishment"
      - "Literal negative statement"
      - "Genuine praise"
    correct_option: "Understatement of an accomplishment"
    accepted_answers:
      - value: "Understatement of an accomplishment"
        status: correct
    feedback: "Correct. The phrase signals understatement when spoken about accomplished work."

  it.c1.unit02.lesson05.exercise01.speak_understatement:
    instruction: "Your boss says you have too much free time at work. Reply ironically in Italian: 'Yes, of course, we have such a relaxing life.' Then say plainly in Italian: 'Life is not so relaxing.'"
    gloss: "Your boss says you have too much free time at work. Reply ironically in Italian: 'Yes, of course, we have such a relaxing life.' Then say plainly in Italian: 'Life is not so relaxing.'"
    accepted_answers:
      - value: "Sì, naturalmente, abbiamo una vita così rilassante. La vita non è così rilassante."
        status: correct
      - value: "Sì, naturalmente, abbiamo una vita così rilassante. La vita non è così rilassante"
        status: correct
    feedback: "Good. You used irony to imply disagreement, then stated the unstated judgement."

  it.c1.unit02.lesson06.exercise01.comprehend_full:
    instruction: "Read the passage. Does the speaker literally mean that the project is easy?"
    gloss: "Read the passage. Does the speaker literally mean that the project is easy?"
    options:
      - "No, the speaker is being ironic"
      - "Yes, the speaker means the project is easy"
      - "The speaker is unsure"
    correct_option: "No, the speaker is being ironic"
    accepted_answers:
      - value: "No, the speaker is being ironic"
        status: correct
    feedback: "Correct. The speaker has just said it is not easy to complete, so *questo progetto è davvero facile* is ironic — the speaker means the opposite of the literal words."

  it.c1.unit02.lesson06.exercise02.write_implicit_judgement:
    instruction: "Write an ironic message in Italian, then state plainly what you mean: 'This project is really easy. The project is not really easy.'"
    gloss: "Write an ironic message in Italian, then state plainly what you mean: 'This project is really easy. The project is not really easy.'"
    accepted_answers:
      - value: "Questo progetto è davvero facile. Il progetto non è davvero facile."
        status: correct
      - value: "Sì, naturalmente, questo progetto è davvero facile. Il progetto non è davvero facile."
        status: correct
      - value: "Questo progetto è davvero facile. Il progetto non è davvero facile"
        status: correct
    feedback: "Good. You used irony to imply the opposite of the literal claim, then stated the unstated judgement."
