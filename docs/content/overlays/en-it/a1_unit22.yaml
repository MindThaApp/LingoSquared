teaching:
  it.a1.unit22.lesson01.teach_felice_triste: {title: "felice, triste", gloss: "happy, sad", note: "*Felice* and *triste* do not change between masculine and feminine in this simple use.", example_gloss: ["I am happy today.", "I am sad today."]}
  it.a1.unit22.lesson01.teach_stanco_nervoso: {title: "stanco, nervoso", gloss: "tired, nervous", note: "These adjectives can change ending; this unit introduces the masculine dictionary forms.", example_gloss: ["Sam is tired.", "I am nervous today."]}
  it.a1.unit22.lesson01.teach_come_ti_senti: {title: "Come ti senti?", gloss: "How do you feel?", note: "*Ti senti* is the informal 'you feel' form used with a friend.", example_gloss: ["How do you feel?"]}
  it.a1.unit22.lesson01.teach_sono_felice: {title: "Sono felice.", gloss: "I am happy.", note: "Use *sono* plus a feeling adjective.", example_gloss: ["I am happy."]}
  it.a1.unit22.lesson02.teach_perche: {title: "perché", gloss: "because / why", note: "In this unit *perché* gives the cause of a feeling.", example_gloss: ["because"]}
  it.a1.unit22.lesson02.teach_sono_felice_perche: {title: "Sono felice perché oggi c'è il sole.", gloss: "I am happy because it is sunny today.", note: "This is a complete feeling-plus-cause sentence.", example_gloss: ["I am happy because it is sunny today."]}
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca: {title: "Sono un po' stanca.", gloss: "I am a little tired.", note: "*Stanca* is feminine here because Elena says it.", example_gloss: ["I am a little tired."]}
  it.a1.unit22.lesson02.teach_ma_sto_bene: {title: "ma sto bene", gloss: "but I am well", note: "*Ma* contrasts the tired feeling with being okay.", example_gloss: ["but I am well"]}
exercises:
  it.a1.unit22.lesson01.exercise01.choose_felice:
    instruction: "Which word means 'happy'?"
    correct_option: "felice"
    distractors: ["triste", "stanco", "nervoso"]
    accepted_answers: [{value: "felice", status: "correct"}]
    feedback: "*felice* means 'happy.'"
  it.a1.unit22.lesson01.exercise02.listen_emotions_words:
    instruction: "Listen and select the feelings in order."
    correct_option: "sono felice, sono triste, sono stanco, sono nervoso"
    distractors: ["sono triste, sono felice, sono nervoso, sono stanco", "sono stanco, sono nervoso, sono felice, sono triste", "sono nervoso, sono stanco, sono triste, sono felice"]
    accepted_answers: [{value: "sono felice, sono triste, sono stanco, sono nervoso", status: "correct"}]
    feedback: "The recording lists four feeling sentences."
  it.a1.unit22.lesson01.exercise03.choose_come_ti_senti:
    instruction: "Which question means 'How do you feel'?"
    correct_option: "Come ti senti?"
    distractors: ["Sono felice.", "E tu?", "Sto bene."]
    accepted_answers: [{value: "Come ti senti?", status: "correct"}]
    feedback: "*Come ti senti?* asks how someone feels."
  it.a1.unit22.lesson01.exercise04.match_emotions:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "happy", right: "felice"}
          - {left: "sad", right: "triste"}
          - {left: "tired", right: "stanco"}
          - {left: "nervous", right: "nervoso"}
          - {left: "How do you feel?", right: "Come ti senti?"}
          - {left: "I am happy.", right: "Sono felice."}
        status: "correct"
    feedback: "These are the basic feeling words and question."
  it.a1.unit22.lesson01.exercise05.order_sono_felice:
    instruction: "Put the words in order to say 'I am happy.'"
    accepted_answers: [{value: ["Sono", "felice"], status: "correct"}]
    feedback: "The correct order is *Sono felice.*"
  it.a1.unit22.lesson01.exercise06.fill_felice:
    instruction: "Complete the sentence with the word for 'happy.'"
    accepted_answers: [{value: "felice", status: "correct"}]
    feedback: "*Sono felice.* means 'I am happy.'"
  it.a1.unit22.lesson01.exercise07.write_emotion_words:
    instruction: "Write these four feeling words in Italian, in this order: happy, sad, tired, nervous."
    accepted_answers:
      - {value: "felice, triste, stanco, nervoso", status: "correct"}
      - {value: "felice triste stanco nervoso", status: "correct"}
    feedback: "The words are: felice, triste, stanco, nervoso."
  it.a1.unit22.lesson02.exercise01_choose_perche:
    instruction: "Which word means 'because'?"
    correct_option: "perché"
    distractors: ["ma", "oggi", "allora"]
    accepted_answers: [{value: "perché", status: "correct"}]
    feedback: "*perché* means 'because' here."
  it.a1.unit22.lesson02.exercise02.listen_felice_perche:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Sono felice perché oggi c'è il sole."
    distractors: ["Sono triste perché oggi c'è il sole.", "Sono felice perché oggi piove.", "Sono felice ma sto bene."]
    accepted_answers: [{value: "Sono felice perché oggi c'è il sole.", status: "correct"}]
    feedback: "The speaker says: *Sono felice perché oggi c'è il sole.*"
  it.a1.unit22.lesson02.exercise03.choose_cause_sentence:
    instruction: "Which sentence gives a feeling and a cause?"
    correct_option: "Sono felice perché oggi c'è il sole."
    distractors: ["Sono un po' stanca.", "Come ti senti?", "ma sto bene"]
    accepted_answers: [{value: "Sono felice perché oggi c'è il sole.", status: "correct"}]
    feedback: "*perché oggi c'è il sole* gives the cause."
  it.a1.unit22.lesson02.exercise04.match_feeling_cause:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "because", right: "perché"}
          - {left: "I am happy because it is sunny today.", right: "Sono felice perché oggi c'è il sole."}
          - {left: "I am a little tired.", right: "Sono un po' stanca."}
          - {left: "but I am well", right: "ma sto bene"}
          - {left: "How do you feel?", right: "Come ti senti?"}
          - {left: "And you?", right: "E tu?"}
        status: "correct"
    feedback: "These phrases ask about feelings and give a cause."
  it.a1.unit22.lesson02.exercise05.order_felice_perche:
    instruction: "Put the words in order to say 'I am happy because it is sunny today.'"
    accepted_answers: [{value: ["Sono", "felice", "perché", "oggi", "c'è", "il", "sole"], status: "correct"}]
    feedback: "The correct order is *Sono felice perché oggi c'è il sole.*"
  it.a1.unit22.lesson02.exercise06.reply_come_ti_senti:
    instruction: "Someone asks 'Come ti senti oggi?' Answer with the taught sentence: I am happy because it is sunny today."
