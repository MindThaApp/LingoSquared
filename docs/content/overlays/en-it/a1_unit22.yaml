    feedback: "The sentence is *Sono felice perché oggi c'è il sole.*"
  it.a1.unit22.lesson02.exercise08.write_feeling_cause:
    instruction: "Write the taught sentence: I am happy because it is sunny today."
    accepted_answers:
      - {value: "Sono felice perché oggi c'è il sole.", status: "correct"}
      - {value: "Sono felice perché oggi c'è il sole", status: "correct"}
