review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the life-experiences unit (mai/già, essere stato/stata, volte, quando). OPEN NATIVE QUESTIONS: none beyond those in the realization."}
course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses and everyday experience."
  learning_goal: "Talk about the past in Italian: what happened, what used to happen, and what had already happened."
units:
  it.a2.unit87.sei_mai_stato: {"title": "Have you ever been to Rome?", "description": "Talk about life experiences with the passato prossimo: ask with mai and già, answer with già, mai and ancora, use essere stato/stata, count the times and say when."}
lessons:
  it.a2.unit87.lesson01.hai_mai_mangiato: {"title": "Have you ever eaten tiramisù?"}
  it.a2.unit87.lesson02.si_ho_gia: {"title": "Yes, I have already seen..."}
  it.a2.unit87.lesson03.sono_stato: {"title": "I have been to Rome"}
  it.a2.unit87.lesson04.quando: {"title": "When?"}
  it.a2.unit87.lesson05.un_messaggio: {"title": "A message from Marco"}
  it.a2.unit87.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about trips"}
teaching:
  it.a2.unit87.lesson01.teach.verbi: {"title": "Verbs and participles", "gloss": "to eat - eaten / to see - seen / to read - read / to do - done / to take - taken / to visit - visited", "note": "*Visto*, *letto*, *fatto* and *preso* are irregular participles; *mangiato* and *visitato* are regular. All these verbs take *avere*.", "example_gloss": ["Have you ever eaten pizza?", "Marco saw the sea.", "Giulia read a book.", "We took the train."]}
  it.a2.unit87.lesson01.teach.cose: {"title": "Things to eat and see", "gloss": "tiramisù / pizza / ice cream / the sea / the museum / the book", "example_gloss": ["We ate ice cream.", "Giulia visited the museum."]}
  it.a2.unit87.lesson01.teach.gn_mai: {"title": "Ever: mai", "gloss": "Have you ever eaten tiramisù? Have you ever seen the sea? Has Marco ever read a book?", "note": "To ask about life experience, use the passato prossimo with *mai* ('ever'). *Mai* goes between the auxiliary and the participle: *hai mai mangiato*."}
  it.a2.unit87.lesson01.teach.gn_gia: {"title": "Already: già", "gloss": "Have you already eaten pizza? Has Giulia already visited the museum?", "note": "*Già* means 'already'. It also goes between the auxiliary and the participle. Compare: *mai* asks 'ever in your life', *già* asks 'by now'."}
  it.a2.unit87.lesson01.teach.domande: {"title": "Two questions", "gloss": "Have you ever taken the train? Have you already read the book?"}
  it.a2.unit87.lesson02.teach.risposte: {"title": "Short answers", "gloss": "yes / no / already / not yet / never", "note": "*Non ancora* means 'not yet'; *non ... mai* means 'never'.", "example_gloss": ["Yes, I have already seen the sea.", "No, I have never seen the sea.", "Not yet.", "I haven't read the book yet."]}
  it.a2.unit87.lesson02.teach.gn_si: {"title": "Saying yes", "gloss": "Yes, I have already eaten pizza. Yes, Marco has already visited the museum.", "note": "To say that you have done something, answer *Sì* and use *già* between the auxiliary and the participle."}
  it.a2.unit87.lesson02.teach.gn_mai_risposta: {"title": "Saying never: non ... mai", "gloss": "No, I have never eaten tiramisù. No, Giulia has never taken the train.", "note": "Italian uses a double negative: *non* goes before the auxiliary and *mai* goes after it, before the participle: *non ho mai mangiato*."}
  it.a2.unit87.lesson02.teach.gn_ancora: {"title": "Saying not yet: non ... ancora", "gloss": "Not yet. I haven't read the book yet. Giulia hasn't visited the museum yet.", "note": "*Non ... ancora* means 'not yet': it suggests that you may still do it. *Non ... mai* means 'never in your life'."}
  it.a2.unit87.lesson03.teach.luoghi: {"title": "Places", "gloss": "Rome / Florence / Naples / Turin / Italy", "note": "*Essere stato* is the passato prossimo of *essere* and means 'to have been'.", "example_gloss": ["Marco has been to Rome and to Florence.", "Giulia has never been to Naples.", "We have been in Italy."]}
  it.a2.unit87.lesson03.teach.volte: {"title": "How many times", "gloss": "once / twice / three times / many times", "note": "*Volta* means 'time' (occasion); the plural is *volte*.", "example_gloss": ["I have been to Rome once (a man speaking).", "Giulia has been to Florence twice.", "We have been to Turin three times."]}
  it.a2.unit87.lesson03.teach.gn_stato: {"title": "Essere stato", "gloss": "I have been, you have been, he has been, we have been, you (plural) have been, they have been", "note": "*Essere stato* takes *essere* as its auxiliary, so *stato* agrees with the subject: *stato* (masculine singular), *stata* (feminine singular), *stati* (masculine or mixed plural), *state* (feminine plural)."}
  it.a2.unit87.lesson03.teach.gn_stata: {"title": "Stato or stata?", "gloss": "Giulia has been to Rome. Marco has been to Rome. Giulia and Marco have been to Rome. I have been to Florence (a woman speaking).", "note": "A woman says *sono stata*, a man says *sono stato*. A mixed group uses the masculine plural *stati*."}
  it.a2.unit87.lesson03.teach.gn_a_in: {"title": "A or in?", "gloss": "I have been to Rome. I have been to Florence. We have been in Italy.", "note": "Use *a* before a city (*a Roma*, *a Napoli*) and *in* before a country (*in Italia*)."}
  it.a2.unit87.lesson03.teach.gn_volte: {"title": "Counting and never", "gloss": "Marco has been to Rome once. Giulia has been to Florence twice. Giulia has never been to Naples.", "note": "Put *una volta*, *due volte*, *molte volte* after the verb. Use *non ... mai* for 'never' and *già* for 'already': *non è mai stata*, *è già stato*."}
  it.a2.unit87.lesson04.teach.quando: {"title": "When?", "gloss": "when / in 2020 / three years ago / two years ago / as a boy / as a girl", "note": "*Da piccolo* is used by a man and *da piccola* by a woman, for 'as a child'.", "example_gloss": ["I went to Rome in 2020 (a man speaking).", "Giulia went to Florence three years ago.", "As a child I saw the sea (a woman speaking)."]}
  it.a2.unit87.lesson04.teach.commenti: {"title": "Comments", "gloss": "it was nice / it was very nice / also / but", "example_gloss": ["I went to Rome three years ago: it was very nice (a man speaking).", "I ate tiramisù in Florence too.", "Giulia visited the museum, but she did not see the sea."]}
  it.a2.unit87.lesson04.teach.gn_quando: {"title": "Asking when", "gloss": "When did you go to Florence? (to a woman) When did you see the sea? When did you go to Rome? (to a man)", "note": "*Quando* asks about a past moment. The verb stays in the passato prossimo, and with *essere stato* the participle agrees with the person you ask."}
  it.a2.unit87.lesson04.teach.gn_tempo: {"title": "Saying when", "gloss": "I went to Rome in 2020. I saw the sea as a child. Giulia went to Florence three years ago.", "note": "Use *nel* + year (*nel duemilaventi*), *da piccolo/piccola* for childhood, and a period + *fa* for 'ago': *tre anni fa*. The expression usually comes at the end."}
  it.a2.unit87.lesson04.teach.racconto: {"title": "A short report", "gloss": "I went to Florence two years ago. I visited the museum and ate ice cream. It was very nice.", "note": "Say where you went and when, add what you did, and finish with a comment."}
  it.a2.unit87.lesson05.teach.gn_io_tu: {"title": "Io and tu", "gloss": "I have been to Rome. Have you ever been to Naples?", "note": "Subject pronouns such as *io* and *tu* are usually left out, but they are used to contrast two people."}
  it.a2.unit87.lesson05.teach.lettura: {"title": "Marco writes to Giulia", "gloss": "Hi Giulia! I have been to Rome and to Florence. I have been to Rome three times and to Florence twice. In Rome I ate tiramisù and visited the museum: it was very nice. Have you ever been to Naples? Marco", "note": "Notice that Marco uses *essere stato* for places and *avere* for what he did there."}
  it.a2.unit87.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Hi Giulia! Have you ever been to Naples?"}
  it.a2.unit87.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: No, I have never been to Naples. And you, have you ever been to Rome?"}
  it.a2.unit87.lesson06.teach.d3: {"title": "Marco answers", "gloss": "Marco: Yes, I went to Rome three years ago and I have been to Florence twice."}
  it.a2.unit87.lesson06.teach.d4: {"title": "Giulia asks more", "gloss": "Giulia: How nice! Did you eat tiramisù in Rome?"}
  it.a2.unit87.lesson06.teach.d5: {"title": "Marco tells more", "gloss": "Marco: Yes, I ate tiramisù and visited the museum. It was very nice!"}
  it.a2.unit87.lesson06.teach.d6: {"title": "Giulia reacts", "gloss": "Giulia: I have already seen the sea, but I have never been to Naples."}
exercises:
  it.a2.unit87.lesson01.exercise01.scegli_tiramisu: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Hai mai mangiato il tiramisù?", "distractors": ["Hai mai mangiare il tiramisù?", "Sei mai mangiato il tiramisù?", "Ho mai mangiato il tiramisù?"], "accepted_answers": [{"value": "Hai mai mangiato il tiramisù?", "status": "correct"}], "feedback": "Use *avere* + *mai* + the participle *mangiato*."}
  it.a2.unit87.lesson01.exercise02.scegli_libro: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco ha mai letto un libro?", "distractors": ["Marco ha mai leggiuto un libro?", "Marco è mai letto un libro?", "Marco hai mai letto un libro?"], "accepted_answers": [{"value": "Marco ha mai letto un libro?", "status": "correct"}], "feedback": "*Leggere* has an irregular participle: *letto*. Marco takes *ha*."}
  it.a2.unit87.lesson01.exercise03.abbina_domande: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Hai mai visto il mare?", "right": "Have you ever seen the sea?"}, {"left": "Hai già mangiato la pizza?", "right": "Have you already eaten pizza?"}, {"left": "Marco ha mai letto un libro?", "right": "Has Marco ever read a book?"}, {"left": "Giulia ha già visitato il museo?", "right": "Has Giulia already visited the museum?"}, {"left": "Hai mai preso il treno?", "right": "Have you ever taken the train?"}, {"left": "Hai già letto il libro?", "right": "Have you already read the book?"}], "status": "correct"}], "feedback": "*Mai* means 'ever' and *già* means 'already'."}
  it.a2.unit87.lesson01.exercise04.ordina_mai: {"instruction": "Put the words in order to ask 'Have you ever eaten tiramisù?'", "correct_option": "Hai mai mangiato il tiramisù", "accepted_answers": [{"value": "Hai mai mangiato il tiramisù", "status": "correct"}], "feedback": "*Mai* sits between *hai* and *mangiato*."}
  it.a2.unit87.lesson01.exercise05.completa_visto: {"instruction": "Complete with the past participle of vedere.", "correct_option": "visto", "accepted_answers": [{"value": "visto", "status": "correct"}], "feedback": "*Vedere* has the irregular participle *visto*."}
  it.a2.unit87.lesson01.exercise06.traduci_museo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Hai mai visitato il museo?", "status": "correct"}, {"value": "Hai mai visitato il museo", "status": "correct"}], "feedback": "*Visitare* gives *visitato*; *mai* goes before it."}
  it.a2.unit87.lesson01.exercise07.scrivi_libro: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Hai già letto il libro?", "status": "correct"}, {"value": "Hai già letto il libro", "status": "correct"}], "feedback": "*Già* goes between *hai* and *letto*.", "correct_option": "Hai già letto il libro?"}
  it.a2.unit87.lesson02.exercise01.scegli_mai: {"instruction": "Choose the correct Italian sentence.", "correct_option": "No, non ho mai mangiato il tiramisù.", "distractors": ["No, ho non mai mangiato il tiramisù.", "No, non ho già mangiato il tiramisù.", "No, mai ho mangiato il tiramisù."], "accepted_answers": [{"value": "No, non ho mai mangiato il tiramisù.", "status": "correct"}], "feedback": "*Non* comes before *ho*, and *mai* comes after it."}
  it.a2.unit87.lesson02.exercise02.scegli_gia: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sì, ho già visto il mare.", "distractors": ["Sì, ho già vedere il mare.", "Sì, ho ancora visto il mare.", "Sì, non ho mai visto il mare."], "accepted_answers": [{"value": "Sì, ho già visto il mare.", "status": "correct"}], "feedback": "*Già* means 'already' and the participle of *vedere* is *visto*."}
  it.a2.unit87.lesson02.exercise03.abbina_risposte: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sì, ho già visto il mare.", "right": "Yes, I have already seen the sea."}, {"left": "No, non ho mai visto il mare.", "right": "No, I have never seen the sea."}, {"left": "Non ancora.", "right": "Not yet."}, {"left": "Non ho ancora letto il libro.", "right": "I haven't read the book yet."}, {"left": "Sì, Marco ha già visitato il museo.", "right": "Yes, Marco has already visited the museum."}, {"left": "No, Giulia non ha mai preso il treno.", "right": "No, Giulia has never taken the train."}], "status": "correct"}], "feedback": "Compare *già* (already), *ancora* (yet) and *mai* (never)."}
  it.a2.unit87.lesson02.exercise04.ordina_mai_no: {"instruction": "Put the words in order to say 'No, I have never eaten tiramisù.'", "correct_option": "No non ho mai mangiato il tiramisù", "accepted_answers": [{"value": "No non ho mai mangiato il tiramisù", "status": "correct"}], "feedback": "*Non ho mai mangiato*: *non* first, *mai* before the participle."}
  it.a2.unit87.lesson02.exercise05.completa_mai: {"instruction": "Fill in the word that means 'never' to say 'I have never eaten pizza.'", "correct_option": "mai", "accepted_answers": [{"value": "mai", "status": "correct"}], "feedback": "*Non ... mai* means 'never'."}
  it.a2.unit87.lesson02.exercise06.traduci_ancora: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non ho ancora letto il libro.", "status": "correct"}, {"value": "Non ho ancora letto il libro", "status": "correct"}, {"value": "Non ho letto ancora il libro.", "status": "correct"}, {"value": "Non ho letto ancora il libro", "status": "correct"}], "feedback": "*Non ... ancora* means 'not yet'."}
  it.a2.unit87.lesson02.exercise07.scrivi_gia_museo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sì, Giulia ha già visitato il museo.", "status": "correct"}, {"value": "Sì Giulia ha già visitato il museo", "status": "correct"}], "feedback": "*Già* goes between *ha* and *visitato*.", "correct_option": "Sì, Giulia ha già visitato il museo."}
  it.a2.unit87.lesson03.exercise01.scegli_roma: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco è stato a Roma.", "distractors": ["Marco ha stato a Roma.", "Marco è stata a Roma.", "Marco è stato in Roma."], "accepted_answers": [{"value": "Marco è stato a Roma.", "status": "correct"}], "feedback": "*Essere stato* uses *è*, masculine *stato*, and *a* before a city."}
  it.a2.unit87.lesson03.exercise02.scegli_napoli: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia non è mai stata a Napoli.", "distractors": ["Giulia non ha mai stata a Napoli.", "Giulia non è mai stato a Napoli.", "Giulia non è già stata a Napoli."], "accepted_answers": [{"value": "Giulia non è mai stata a Napoli.", "status": "correct"}], "feedback": "*Giulia* is feminine, so *stata*; *non ... mai* means 'never'."}
  it.a2.unit87.lesson03.exercise03.abbina_volte: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "sono stata a Firenze", "right": "I have been to Florence (a woman speaking)"}, {"left": "siamo stati in Italia", "right": "we have been in Italy"}, {"left": "una volta", "right": "once"}, {"left": "due volte", "right": "twice"}, {"left": "tre volte", "right": "three times"}, {"left": "molte volte", "right": "many times"}], "status": "correct"}], "feedback": "These expressions tell where and how many times."}
  it.a2.unit87.lesson03.exercise04.ordina_firenze: {"instruction": "Put the words in order to say 'Giulia has been to Florence twice.'", "correct_option": "Giulia è stata a Firenze due volte", "accepted_answers": [{"value": "Giulia è stata a Firenze due volte", "status": "correct"}], "feedback": "*È stata* agrees with Giulia; *due volte* comes at the end."}
  it.a2.unit87.lesson03.exercise05.completa_stata: {"instruction": "Complete with the correct form of stato.", "correct_option": "stata", "accepted_answers": [{"value": "stata", "status": "correct"}], "feedback": "*Stata* is feminine singular, matching *Giulia*."}
  it.a2.unit87.lesson03.exercise06.traduci_italia: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Siamo stati in Italia.", "status": "correct"}, {"value": "Siamo stati in Italia", "status": "correct"}, {"value": "Siamo state in Italia.", "status": "correct"}, {"value": "Siamo state in Italia", "status": "correct"}], "feedback": "*Stati* for a mixed or male group; *state* for an all-female group. Use *in* with a country."}
  it.a2.unit87.lesson03.exercise07.scrivi_roma_firenze: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Marco è stato a Roma e a Firenze.", "status": "correct"}, {"value": "Marco è stato a Roma e a Firenze", "status": "correct"}], "feedback": "*Essere stato* + *a* + each city.", "correct_option": "Marco è stato a Roma e a Firenze."}
  it.a2.unit87.lesson04.exercise01.scegli_quando: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Quando sei stata a Firenze?", "distractors": ["Quando hai stata a Firenze?", "Dove sei stata a Firenze?", "Quando sei stato a Firenze?"], "accepted_answers": [{"value": "Quando sei stata a Firenze?", "status": "correct"}], "feedback": "*Quando* asks when; to a woman, *stata*."}
  it.a2.unit87.lesson04.exercise02.scegli_fa: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho mangiato il tiramisù a Roma tre anni fa.", "distractors": ["Ho mangiato il tiramisù a Roma tre anni.", "Ho mangiato il tiramisù a Roma tre volte.", "Ho mangiato il tiramisù a Roma da tre anni fa."], "accepted_answers": [{"value": "Ho mangiato il tiramisù a Roma tre anni fa.", "status": "correct"}], "feedback": "*Tre anni fa* means 'three years ago'; *tre volte* would mean 'three times'."}
  it.a2.unit87.lesson04.exercise03.abbina_tempo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "tre anni fa", "right": "three years ago"}, {"left": "nel duemilaventi", "right": "in 2020"}, {"left": "da piccolo", "right": "as a child (a man speaking)"}, {"left": "una volta", "right": "once"}, {"left": "molte volte", "right": "many times"}, {"left": "è stato molto bello", "right": "it was very nice"}], "status": "correct"}], "feedback": "Some answer *quando* (when), others *quante volte* (how many times)."}
  it.a2.unit87.lesson04.exercise04.ordina_duemilaventi: {"instruction": "Put the words in order to say 'I went to Rome in 2020' (a man speaking).", "correct_option": "Sono stato a Roma nel duemilaventi", "accepted_answers": [{"value": "Sono stato a Roma nel duemilaventi", "status": "correct"}, {"value": "Nel duemilaventi sono stato a Roma", "status": "correct"}], "feedback": "The time expression comes at the end."}
  it.a2.unit87.lesson04.exercise05.completa_fa: {"instruction": "Complete with the word for 'ago'.", "correct_option": "fa", "accepted_answers": [{"value": "fa", "status": "correct"}], "feedback": "*Tre anni fa* means 'three years ago'."}
  it.a2.unit87.lesson04.exercise06.traduci_quando: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Quando hai visto il mare?", "status": "correct"}, {"value": "Quando hai visto il mare", "status": "correct"}], "feedback": "*Quando* + *hai visto*."}
  it.a2.unit87.lesson04.exercise07.scrivi_racconto: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono stata a Firenze tre anni fa. È stato molto bello.", "status": "correct"}, {"value": "Sono stata a Firenze tre anni fa È stato molto bello", "status": "correct"}, {"value": "Sono stato a Firenze tre anni fa. È stato molto bello.", "status": "correct"}, {"value": "Sono stato a Firenze tre anni fa È stato molto bello", "status": "correct"}], "feedback": "A woman says *sono stata*, a man says *sono stato*.", "correct_option": "Sono stata a Firenze tre anni fa. È stato molto bello."}
  it.a2.unit87.lesson05.exercise01.leggi_volte: {"instruction": "Read the text and choose the answer.", "correct_option": "Twice.", "distractors": ["Once.", "Three times.", "Never."], "accepted_answers": [{"value": "Twice.", "status": "correct"}], "feedback": "*A Firenze due volte.*"}
  it.a2.unit87.lesson05.exercise02.leggi_roma: {"instruction": "Read the text and choose the answer.", "correct_option": "He ate tiramisù and visited the museum.", "distractors": ["He ate pizza and saw the sea.", "He read a book and took the train.", "He ate ice cream and visited Florence."], "accepted_answers": [{"value": "He ate tiramisù and visited the museum.", "status": "correct"}], "feedback": "*Ho mangiato il tiramisù e ho visitato il museo.*"}
  it.a2.unit87.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "tre volte", "right": "three times"}, {"left": "due volte", "right": "twice"}, {"left": "è stato molto bello", "right": "it was very nice"}, {"left": "ho visitato il museo", "right": "I visited the museum"}, {"left": "sono stato a Firenze", "right": "I have been to Florence (a man speaking)"}, {"left": "Tu sei mai stata a Napoli?", "right": "Have you ever been to Naples? (to a woman)"}], "status": "correct"}], "feedback": "These expressions come from Marco's message."}
  it.a2.unit87.lesson05.exercise04.ordina_tre_volte: {"instruction": "Put the words in order to say 'I have been to Rome three times' (a man speaking).", "correct_option": "Sono stato a Roma tre volte", "accepted_answers": [{"value": "Sono stato a Roma tre volte", "status": "correct"}], "feedback": "*Tre volte* comes at the end."}
  it.a2.unit87.lesson05.exercise05.traduci_napoli: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sei mai stata a Napoli?", "status": "correct"}, {"value": "Sei mai stata a Napoli", "status": "correct"}], "feedback": "*Mai* sits between *sei* and *stata*; a man would be asked with *stato*."}
  it.a2.unit87.lesson05.exercise06.detta_tiramisu: {"instruction": "Type what you hear.", "correct_response": "A Roma ho mangiato il tiramisù.", "orthography_strict": true, "feedback": "You heard *A Roma ho mangiato il tiramisù.*"}
  it.a2.unit87.lesson05.exercise07.detta_napoli: {"instruction": "Type what you hear.", "correct_response": "Tu sei mai stata a Napoli?", "orthography_strict": true, "feedback": "You heard *Tu sei mai stata a Napoli?*"}
  it.a2.unit87.lesson06.exercise01.capisci_napoli: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "No, never.", "distractors": ["Yes, once.", "Yes, twice.", "Not yet, but she will go soon."], "accepted_answers": [{"value": "No, never.", "status": "correct"}], "feedback": "Giulia says *non sono mai stata a Napoli*."}
  it.a2.unit87.lesson06.exercise02.capisci_quando: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Three years ago.", "distractors": ["Two years ago.", "In 2020.", "As a child."], "accepted_answers": [{"value": "Three years ago.", "status": "correct"}], "feedback": "He says *tre anni fa*."}
  it.a2.unit87.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sei mai stata a Napoli?", "right": "Have you ever been to Naples? (to a woman)"}, {"left": "No, non sono mai stata a Napoli.", "right": "No, I have never been to Naples."}, {"left": "Sei mai stato a Roma?", "right": "Have you ever been to Rome? (to a man)"}, {"left": "Sono stato a Roma tre anni fa.", "right": "I went to Rome three years ago."}, {"left": "Hai mangiato il tiramisù a Roma?", "right": "Did you eat tiramisù in Rome?"}, {"left": "È stato molto bello!", "right": "It was very nice!"}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  it.a2.unit87.lesson06.exercise04.ordina_mai_stata: {"instruction": "Put the words in order to say 'I have never been to Naples' (a woman speaking).", "correct_option": "Non sono mai stata a Napoli", "accepted_answers": [{"value": "Non sono mai stata a Napoli", "status": "correct"}], "feedback": "*Non sono mai stata*: *non* first, *mai* before the participle."}
  it.a2.unit87.lesson06.exercise05.rispondi_tiramisu: {"instruction": "Answer in Italian: say that you have already eaten tiramisù.", "correct_option": "Sì, ho già mangiato il tiramisù.", "accepted_answers": [{"value": "Sì, ho già mangiato il tiramisù.", "status": "correct"}, {"value": "Sì ho già mangiato il tiramisù", "status": "correct"}, {"value": "Sì, ho mangiato il tiramisù.", "status": "correct"}, {"value": "Sì ho mangiato il tiramisù", "status": "correct"}, {"value": "No, non ho mai mangiato il tiramisù.", "status": "correct"}, {"value": "No, non ho mai mangiato il tiramisù", "status": "correct"}, {"value": "No, non ancora.", "status": "correct"}, {"value": "No, non ancora", "status": "correct"}, {"value": "Sì, ho già mangiato il tiramisù a Roma.", "status": "correct"}, {"value": "Sì, ho già mangiato il tiramisù a Roma", "status": "correct"}], "feedback": "Answer in Italian: say that you have already eaten tiramisù."}
  it.a2.unit87.lesson06.exercise06.traduci_mai_gia: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non ho mai mangiato il tiramisù, ma ho già mangiato la pizza.", "status": "correct"}, {"value": "Non ho mai mangiato il tiramisù ma ho già mangiato la pizza", "status": "correct"}], "feedback": "*Non ... mai* means 'never'; *già* means 'already'."}
  it.a2.unit87.lesson06.exercise07.scrivi_tre: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono stata a Roma una volta. Ho mangiato il tiramisù a Roma. È stato molto bello.", "status": "correct"}, {"value": "Sono stata a Roma una volta Ho mangiato il tiramisù a Roma È stato molto bello", "status": "correct"}, {"value": "Sono stato a Roma una volta. Ho mangiato il tiramisù a Roma. È stato molto bello.", "status": "correct"}, {"value": "Sono stato a Roma una volta Ho mangiato il tiramisù a Roma È stato molto bello", "status": "correct"}], "feedback": "A man would say *sono stato*.", "correct_option": "Sono stata a Roma una volta. Ho mangiato il tiramisù a Roma. È stato molto bello."}
