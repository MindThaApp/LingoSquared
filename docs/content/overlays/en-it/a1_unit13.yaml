teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina: {title: "ieri, stamattina", gloss: "yesterday, this morning", note: "*ieri* (yesterday) and *stamattina* (this morning) are the two timeframes used to talk about recent events.", example_gloss: ["I was home yesterday."]}
  it.a1.unit13.lesson01.teach.sono_andato: {title: "sono andato, sono andata", gloss: "I went (masculine), I went (feminine)", note: "*sono andato/andata* is the passato prossimo of *andare*, using the auxiliary *essere*; the past participle agrees with the subject's gender.", example_gloss: ["I went to work this morning."]}
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri: {title: "Sono andato al cinema ieri.", gloss: "I went to the cinema yesterday.", note: "*Sono andato* (a masculine speaker) plus *al cinema* (to the cinema) plus *ieri* (yesterday) describes a completed past event."}
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film: {title: "Ho visto un bel film!", gloss: "I saw a nice film!", note: "*Ho visto* uses the auxiliary *avere* with the irregular past participle *visto* (from *vedere*, to see)."}

  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino: {title: "Ho mangiato un panino a pranzo.", gloss: "I ate a sandwich for lunch.", note: "*Ho mangiato* uses *avere* plus the regular past participle *mangiato* (from *mangiare*, to eat); *a pranzo* means 'for lunch.'"}
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri: {title: "Cosa hai fatto ieri?", gloss: "What did you do yesterday?", note: "*hai fatto* is the passato prossimo of *fare* (to do), used here to ask about a recent past event.", example_gloss: ["What did you do this morning?"]}
  it.a1.unit13.lesson02.teach.ieri_sera: {title: "ieri sera", gloss: "yesterday evening", note: "*ieri sera* combines *ieri* (yesterday) with *sera* (evening) to name a specific past timeframe.", example_gloss: ["I went to the cinema yesterday evening."]}

  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro: {title: "Stamattina sono andata al lavoro, come sempre.", gloss: "This morning I went to work, as always.", note: "*sono andata* (a feminine speaker) plus *come sempre* (as always) describes a routine past action."}
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto: {title: "E tu, cosa hai fatto stamattina?", gloss: "And you, what did you do this morning?", note: "*E tu* (and you) redirects the question back to the other speaker.", example_gloss: ["And you, what did you do yesterday evening?"]}

