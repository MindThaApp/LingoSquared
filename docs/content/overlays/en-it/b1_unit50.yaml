course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit50.riunioni: {title: "Communicating professionally in meetings"}
lessons:
  it.b1.unit50.lesson01.proposta_formale: {title: "I would suggest postponing the meeting"}
  it.b1.unit50.lesson02.messaggio_professionale: {title: "I will send you an email with the details"}
teaching:
  it.b1.unit50.lesson01.teach_le_proporrei: {title: "Le proporrei di rimandare la riunione", gloss: "I would suggest to you postponing the meeting", note: "*Le proporrei* (formal Lei + conditional) is a softened, formal-register suggestion to a manager or colleague.", example_gloss: ["I would suggest to you postponing the meeting until tomorrow."]}
  it.b1.unit50.lesson01.teach_potremmo_iniziare: {title: "potremmo iniziare alle dieci", gloss: "we could start at ten o'clock", note: "*Potremmo* (conditional of *potere*) proposes a time in a work-meeting exchange.", example_gloss: ["We could start at ten o'clock, if that works for you."]}
  it.b1.unit50.lesson01.teach_come_procede: {title: "come procede il progetto?", gloss: "how is the project going?", note: "A formal-register question a manager asks in a meeting.", example_gloss: ["Good morning Sam, how is the project going?"]}
  it.b1.unit50.lesson02.teach_progetto_quasi_finito: {title: "il progetto è quasi finito", gloss: "the project is almost finished", note: "States project status in a professional update.", example_gloss: ["The project is almost finished, only one detail is missing."]}
  it.b1.unit50.lesson02.teach_manderò_email: {title: "Le manderò un'email con i dettagli", gloss: "I will send you an email with the details", note: "A brief professional written message with formal Lei.", example_gloss: ["I will send you an email with the details by today."]}
  it.b1.unit50.lesson02.teach_riunione_completa: {title: "Le proporrei di rimandare la riunione... potremmo iniziare alle dieci... Le manderò un'email...", gloss: "I would suggest postponing the meeting... we could start at ten... I will send you an email...", note: "The final task requires a formal suggestion, a meeting-exchange line, and a professional message together.", example_gloss: ["I would suggest postponing the meeting until tomorrow. We could start at ten o'clock. I will send you an email with the details."]}
exercises:
  it.b1.unit50.lesson01.exercise01.choose_proporrei:
    instruction: "Which phrase makes a formal, softened suggestion to a manager?"
    correct_option: "Le proporrei di rimandare la riunione"
    distractors: ["Rimanda la riunione!", "Rimandi la riunione?", "Ho rimandato la riunione"]
    accepted_answers: [{value: "Le proporrei di rimandare la riunione", status: "correct"}]
    feedback: "*Le proporrei* (formal Lei + conditional) softens the suggestion."
  it.b1.unit50.lesson01.exercise02.listen_riunione:
    instruction: "Listen and choose what the exchange says."
    correct_option: "I would suggest postponing the meeting until tomorrow. We could start at ten o'clock."
    distractors: ["The meeting already started at ten.", "I will send you an email with the details.", "The project is almost finished."]
    accepted_answers: [{value: "I would suggest postponing the meeting until tomorrow. We could start at ten o'clock.", status: "correct"}]
    feedback: "Sam says *Le proporrei di rimandare la riunione a domani. Potremmo iniziare alle dieci.*"
  it.b1.unit50.lesson01.exercise03.match_riunione:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I would suggest to you", right: "Le proporrei"}
          - {left: "postponing the meeting", right: "di rimandare la riunione"}
          - {left: "we could start", right: "potremmo iniziare"}
          - {left: "at ten o'clock", right: "alle dieci"}
          - {left: "how is the project going?", right: "come procede il progetto?"}
          - {left: "good morning", right: "buongiorno"}
        status: "correct"
    feedback: "These pieces make a formal suggestion and set up the meeting exchange."
  it.b1.unit50.lesson01.exercise04.order_riunione:
    instruction: "Put the words in order to build the formal suggestion."
    accepted_answers: [{value: ["Le", "proporrei", "di", "rimandare", "la", "riunione"], status: "correct"}]
    feedback: "The sentence is *Le proporrei di rimandare la riunione.*"
  it.b1.unit50.lesson01.exercise05.fill_proporrei:
    instruction: "Complete the sentence with *proporrei*."
    accepted_answers: [{value: "proporrei", status: "correct"}]
    feedback: "*Le proporrei* is the formal, softened conditional suggestion."
  it.b1.unit50.lesson01.exercise06.write_riunione:
    instruction: "Write exactly one sentence with a formal-register suggestion softened with Lei: *Le proporrei di rimandare la riunione a domani.*"
    accepted_answers:
      - {value: "Le proporrei di rimandare la riunione a domani.", status: "correct"}
      - {value: "Le proporrei di rimandare la riunione a domani", status: "correct"}
    feedback: "Le + conditional makes a formal, softened suggestion."
  it.b1.unit50.lesson02.exercise01.choose_mandero:
    instruction: "Which phrase is a brief professional written message?"
    correct_option: "Le manderò un'email con i dettagli"
    distractors: ["Le ho mandato un'email", "Mandami un'email!", "Le manderei un'email se potessi"]
    accepted_answers: [{value: "Le manderò un'email con i dettagli", status: "correct"}]
    feedback: "*Le manderò* (futuro semplice, formal) states the professional follow-up."
  it.b1.unit50.lesson02.exercise02.listen_riunione_completa:
    instruction: "Listen and choose what the message says."
    correct_option: "I would suggest postponing the meeting until tomorrow. We could start at ten o'clock. I will send you an email with the details."
    distractors: ["The meeting was postponed last week.", "We started the meeting at nine.", "The project is finished."]
    accepted_answers: [{value: "I would suggest postponing the meeting until tomorrow. We could start at ten o'clock. I will send you an email with the details.", status: "correct"}]
    feedback: "The full passage is *Le proporrei di rimandare la riunione a domani. Potremmo iniziare alle dieci. Le manderò un'email con i dettagli.*"
  it.b1.unit50.lesson02.exercise03.match_messaggio:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "the project is almost finished", right: "il progetto è quasi finito"}
          - {left: "only one detail is missing", right: "manca solo un dettaglio"}
          - {left: "I will send you an email", right: "Le manderò un'email"}
          - {left: "with the details", right: "con i dettagli"}
          - {left: "we could start", right: "potremmo iniziare"}
          - {left: "at ten o'clock", right: "alle dieci"}
        status: "correct"
    feedback: "These pieces give a status update and the follow-up message."
  it.b1.unit50.lesson02.exercise04.order_messaggio:
    instruction: "Put the words in order to build the professional message."
    accepted_answers: [{value: ["Le", "manderò", "un'email", "con", "i", "dettagli"], status: "correct"}]
    feedback: "The sentence is *Le manderò un'email con i dettagli.*"
  it.b1.unit50.lesson02.exercise05.fill_mandero:
    instruction: "Complete the sentence with *manderò*."
    accepted_answers: [{value: "manderò", status: "correct"}]
    feedback: "*Manderò* is the futuro semplice of *mandare*, first person."
  it.b1.unit50.lesson02.exercise06.write_riunione_completa:
    instruction: "Write exactly three sentences for the meeting: a formal suggestion, *Le proporrei di rimandare la riunione a domani*; a line for the meeting exchange, *Potremmo iniziare alle dieci*; and a brief professional message, *Le manderò un'email con i dettagli.*"
    accepted_answers:
      - {value: "Le proporrei di rimandare la riunione a domani. Potremmo iniziare alle dieci. Le manderò un'email con i dettagli.", status: "correct"}
      - {value: "Le proporrei di rimandare la riunione a domani Potremmo iniziare alle dieci Le manderò un'email con i dettagli", status: "correct"}
    feedback: "The three sentences show a formal suggestion, a meeting-exchange line, and a professional message."
