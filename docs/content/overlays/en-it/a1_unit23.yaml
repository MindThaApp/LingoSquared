exercises:
  it.a1.unit23.lesson01.exercise01.choose_pronto:
    instruction: "Which word is used to answer the phone?"
    correct_option: "Pronto?"
    distractors: ["un messaggio", "il telefono", "Come ti senti?"]
    accepted_answers: [{value: "Pronto?", status: "correct"}]
    feedback: "*Pronto?* is the phone-answering word."
  it.a1.unit23.lesson01.exercise02.listen_phone_words:
    instruction: "Listen and select the phone words in order."
    correct_option: "Pronto, chi parla, un messaggio, il telefono"
    distractors: ["chi parla, Pronto, il telefono, un messaggio", "un messaggio, il telefono, Pronto, chi parla", "il telefono, un messaggio, chi parla, Pronto"]
    accepted_answers: [{value: "Pronto, chi parla, un messaggio, il telefono", status: "correct"}]
    feedback: "The recording lists phone phrases and nouns."
  it.a1.unit23.lesson01.exercise03.choose_ciao_sam:
    instruction: "Which sentence means 'Hi Sam, it's Elena'?"
    correct_option: "Ciao Sam, sono Elena."
    distractors: ["Pronto, chi parla?", "Ti mando un messaggio.", "Puoi ripetere?"]
    accepted_answers: [{value: "Ciao Sam, sono Elena.", status: "correct"}]
    feedback: "*Ciao Sam, sono Elena.* identifies the caller."
  it.a1.unit23.lesson01.exercise04.match_phone_words:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "hello? (on the phone)", right: "Pronto?"}
          - {left: "who is speaking?", right: "chi parla?"}
          - {left: "the phone", right: "il telefono"}
          - {left: "a message", right: "un messaggio"}
          - {left: "I am Elena.", right: "Sono Elena."}
          - {left: "Hi Sam, it's Elena.", right: "Ciao Sam, sono Elena."}
        status: "correct"
    feedback: "These are the phone-opening phrases."
  it.a1.unit23.lesson01.exercise05.order_chi_parla:
    instruction: "Put the words in order to ask 'Who is speaking?'"
    accepted_answers: [{value: ["Chi", "parla"], status: "correct"}]
    feedback: "The correct order is *Chi parla?*"
  it.a1.unit23.lesson01.exercise06.fill_messaggio:
    instruction: "Complete the sentence with the word for 'message.'"
    accepted_answers: [{value: "messaggio", status: "correct"}]
    feedback: "*Ti mando un messaggio.* means 'I will send you a message.'"
  it.a1.unit23.lesson01.exercise07.write_phone_words:
    instruction: "Write these four phone words or phrases in Italian, in this order: hello on the phone, who is speaking, the phone, a message."
    accepted_answers:
      - {value: "Pronto, chi parla, il telefono, un messaggio", status: "correct"}
      - {value: "Pronto chi parla il telefono un messaggio", status: "correct"}
    feedback: "The items are: Pronto, chi parla, il telefono, un messaggio."
  it.a1.unit23.lesson02.exercise01.choose_puoi_ripetere:
    instruction: "Which sentence asks 'Can you repeat, please?'"
    correct_option: "Puoi ripetere, per favore?"
    distractors: ["Più piano, per favore.", "Ti mando un messaggio.", "Sì, sono Elena."]
    accepted_answers: [{value: "Puoi ripetere, per favore?", status: "correct"}]
    feedback: "*Puoi ripetere, per favore?* asks for repetition."
  it.a1.unit23.lesson02.exercise02.listen_puoi_ripetere:
    instruction: "Listen and select the sentence you hear."
