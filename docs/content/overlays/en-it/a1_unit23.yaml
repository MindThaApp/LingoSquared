    accepted_answers: [{value: "Puoi ripetere, per favore?", status: "correct"}]
    feedback: "The speaker says: *Puoi ripetere, per favore?*"
  it.a1.unit23.lesson02.exercise03.choose_piu_piano:
    instruction: "Which phrase asks someone to speak more slowly?"
    correct_option: "Più piano, per favore."
    distractors: ["Puoi ripetere, per favore?", "Ti mando un messaggio.", "Chi parla?"]
    accepted_answers: [{value: "Più piano, per favore.", status: "correct"}]
    feedback: "*Più piano, per favore.* asks for slower speech."
  it.a1.unit23.lesson02.exercise04.match_clarification:
