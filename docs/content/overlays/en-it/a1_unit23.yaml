teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla: {title: "Pronto, chi parla?", gloss: "Hello? Who is speaking?", note: "*Pronto* is the normal way to answer the phone in Italian, not *ciao*.", example_gloss: ["Hello, it's Elena."]}
