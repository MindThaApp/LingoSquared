review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed (DRAFT). Confirm every English gloss
    matches idiomatic Italian, that every matching_pairs right-hand gloss
    discriminates its left on real meaning, and that the culminating
    writing/speaking answers (lesson06) accept the punctuation forms a
    correct learner would actually produce. See the realization file's
    review block for the full priority list, including the sembra che +
    congiuntivo vs. sembra + adjective distinction and the focus
    constructions.
  notes: >-
    Overlay for it's third B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1) English
    hedges/emphasizers are mostly single adverbs, while Italian STACKS them
    (davvero estremamente, in realtà abbastanza) -- flagged in lessons
    01/03; (2) "sembra che" triggers the congiuntivo ("sia") but "sembra" +
    adjective alone does not -- flagged in lesson02; (3) the cleft "è ...
    che" has no literal English word-for-word mapping and English speakers
    often skip it in favour of plain stress -- flagged in lesson04. No
    sibling-direction file (it-en b2) was consulted.

course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: express nuance -- soften a statement (in
    realtà, abbastanza, un po', secondo me, sembra che, direi che) or
    strengthen it (davvero, estremamente, assolutamente, the cleft "è ...
    che"), so the same content can be delivered tentatively, neutrally, or
    emphatically, around a restaurant review.

units:
  it.b2.unit03.sfumature:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedging, qualification, emphasis and focus constructions -- so the same content can be delivered tentatively, neutrally, or emphatically.

lessons:
  it.b2.unit03.lesson01.attenuare:
    title: "Softening"
  it.b2.unit03.lesson02.formulare_con_cautela:
    title: "Formulating cautiously"
  it.b2.unit03.lesson03.enfatizzare:
    title: "Emphasizing"
  it.b2.unit03.lesson04.mettere_in_focus:
    title: "Putting in focus"
  it.b2.unit03.lesson05.leggere_recensione:
    title: "Reading a review"
  it.b2.unit03.lesson06.sfumature_in_conversazione:
    title: "Nuance in conversation"

teaching:
  it.b2.unit03.lesson01.teach.base_claim:
    title: "The restaurant is good."
    gloss: "The restaurant is good."
  it.b2.unit03.lesson01.teach.in_realta:
    title: actually
    gloss: actually
    example_gloss: "The restaurant is actually good."
  it.b2.unit03.lesson01.teach.abbastanza:
    title: "quite / fairly"
    gloss: "quite / fairly"
    example_gloss: "The restaurant is fairly good."
  it.b2.unit03.lesson01.teach.un_po:
    title: "a bit"
    gloss: "a bit"
    note: "*Un po'* (short for *un poco*) always keeps the apostrophe in writing, never a full word."
  it.b2.unit03.lesson01.teach.piuttosto:
    title: rather
    gloss: rather
    example_gloss: "The restaurant is rather good."
  it.b2.unit03.lesson01.teach.secondo_me:
    title: "in my opinion"
    gloss: "in my opinion"
  it.b2.unit03.lesson01.teach.a_mio_parere:
    title: "in my view"
    gloss: "in my view"
    note: "*A mio parere* is a slightly more formal synonym of *secondo me* -- both are common hedging openers."
  it.b2.unit03.lesson01.teach.grammar_attenuare:
    title: "Softening a claim"
    gloss: "The restaurant is good. The restaurant is actually quite good, in my opinion."
    note: "Hedging = softening a claim without changing its content. *In realtà*, *abbastanza*, *un po'*, *piuttosto*, *secondo me*, and *a mio parere* all lower how strongly you commit to the statement."

  it.b2.unit03.lesson02.teach.in_un_certo_senso:
    title: "in a sense"
    gloss: "in a sense"
  it.b2.unit03.lesson02.teach.sembra_che:
    title: "it seems that"
    gloss: "it seems that"
    note: "*Sembrare che* is an opinion-like verb that triggers the congiuntivo: *sembra che sia un successo*, not *è*."
    example_gloss: "It seems to be a success."
  it.b2.unit03.lesson02.teach.direi_che:
    title: "I would say that"
    gloss: "I would say that"
    note: "*Direi che* (conditional of *dire*) is a common, natural hedge and does NOT trigger the congiuntivo: *direi che il ristorante è buono* (plain indicative *è*)."
  it.b2.unit03.lesson02.teach.credo_che:
    title: "I believe that"
    gloss: "I believe that"
    note: "*Credo che* DOES trigger the congiuntivo (see unit01) -- included here as a reminder alongside *direi che*, which does not."
  it.b2.unit03.lesson02.teach.forse:
    title: maybe
    gloss: maybe
    example_gloss: "Maybe it's a success."
  it.b2.unit03.lesson02.teach.lento:
    title: slow
    gloss: slow
    example_gloss: "The service is slow."
  it.b2.unit03.lesson02.teach.il_servizio:
    title: "the service"
    gloss: "the service"
    example_gloss: "The service is good."
  it.b2.unit03.lesson02.teach.grammar_cautela:
    title: "Formulating cautiously"
    gloss: "I would say that the restaurant is good. It seems to be a success."
    note: "More tentative framing than lesson01's hedges: *in un certo senso*, *sembra che* (+ congiuntivo), *direi che*, *credo che* (+ congiuntivo), and *forse* all signal you are not fully committing to the claim."

  it.b2.unit03.lesson03.teach.davvero:
    title: really
    gloss: really
    example_gloss: "The restaurant is really good."
  it.b2.unit03.lesson03.teach.molto:
    title: very
    gloss: very
    example_gloss: "The food is very good."
  it.b2.unit03.lesson03.teach.estremamente:
    title: extremely
    gloss: extremely
    example_gloss: "The restaurant is extremely good."
  it.b2.unit03.lesson03.teach.assolutamente:
    title: absolutely
    gloss: absolutely
    example_gloss: "The restaurant is absolutely delicious."
  it.b2.unit03.lesson03.teach.sicuramente:
    title: certainly
    gloss: certainly
    example_gloss: "The restaurant is certainly good."
  it.b2.unit03.lesson03.teach.delizioso:
    title: delicious
    gloss: delicious
    example_gloss: "The food is delicious."
  it.b2.unit03.lesson03.teach.il_cibo:
    title: "the food"
    gloss: "the food"
    example_gloss: "The food is delicious."
  it.b2.unit03.lesson03.teach.vale_la_pena:
    title: "it's worth it"
    gloss: "it's worth it"
    note: "*Valere la pena* takes a subject: *il ristorante vale la pena* ('the restaurant is worth it'), not *il ristorante è vale la pena*."
  it.b2.unit03.lesson03.teach.davvero_estremamente:
    title: "really extremely"
    gloss: "really extremely"
    note: "Italian naturally STACKS intensifiers, unlike English which usually picks one: *davvero estremamente buono* = 'really extremely good'."
    example_gloss: "The restaurant is really extremely good."
  it.b2.unit03.lesson03.teach.grammar_enfatizzare:
    title: "Emphasizing a claim"
    gloss: "The restaurant is good. The restaurant is really extremely good."
    note: "Emphasis = strengthening a claim without changing its content. *Davvero*, *molto*, *estremamente*, *assolutamente*, and *sicuramente* all raise how strongly you commit to the statement, and can be stacked."

  it.b2.unit03.lesson04.teach.cleft_che:
    title: "It's the service that makes the restaurant special."
    gloss: "It's the service that makes the restaurant special."
    note: "The cleft *è ... che* singles out one element for focus -- here, the service specifically (not the food, not the price)."
  it.b2.unit03.lesson04.teach.quello_che_e:
    title: "What is excellent is the service."
    gloss: "What is excellent is the service."
    note: "The pseudo-cleft *quello che ... è ...* does the same job as the cleft, front-loading what you're about to single out."
  it.b2.unit03.lesson04.teach.proprio_questo:
    title: "That's precisely the problem."
    gloss: "That's precisely the problem."
    note: "*Proprio* adds precision/insistence to whatever it modifies -- 'precisely this' or 'just this'."
  it.b2.unit03.lesson04.teach.eccome:
    title: "and how / absolutely"
    gloss: "and how! / absolutely (colloquial insistence)"
    note: "*Eccome*, tacked on after a statement, insists it's true against implied doubt -- like English 'and how!' or 'you bet'."
    example_gloss: "The restaurant is good, and how!"
  it.b2.unit03.lesson04.teach.grammar_focus:
    title: "Putting in focus"
    gloss: "The service makes the restaurant special. It's the service that makes the restaurant special."
    note: "Focus constructions single out one part of a sentence as the important one: the cleft *è ... che*, the pseudo-cleft *quello che ... è ...*, *proprio*, and *eccome* all do this without changing the underlying facts."

  it.b2.unit03.lesson05.teach.testo:
    title: "Reading: is the new restaurant worth it?"
    gloss: "The new restaurant is, in my view, a bit expensive. The beginning of the service is fairly slow. But the food is really extremely delicious. It's precisely the food that saves the restaurant. I would say that the restaurant is worth it."
    glosses:
      nuovo: new
      caro: expensive
      "L'inizio": "the beginning"
      del: "of the"
      ma: but
      salva: saves

  it.b2.unit03.lesson06.teach.cosa_ne_pensi:
    title: "What do you think of it?"
    gloss: "What do you think of the restaurant?"
    note: "*Cosa ne pensi?* is the standard way to ask for someone's opinion; *ne* stands in for 'of it'."
  it.b2.unit03.lesson06.teach.vero:
    title: "true"
    gloss: "true"
    example_gloss: "That's true."
  it.b2.unit03.lesson06.teach.si:
    title: "Yes"
    gloss: "Yes"
    example_gloss: "Yes, that's true."
  it.b2.unit03.lesson06.teach.il_conto:
    title: "the bill"
    gloss: "the bill"
    example_gloss: "The bill is high."
  it.b2.unit03.lesson06.teach.alto:
    title: high
    gloss: high
    example_gloss: "The bill is high."
  it.b2.unit03.lesson06.teach.dialogue_elena_domanda:
    title: "Elena: What do you think of the restaurant?"
    gloss: "Elena: What do you think of the restaurant?"
  it.b2.unit03.lesson06.teach.dialogue_sam_hedge:
    title: "Sam: The service is, in my view, fairly slow, in a sense."
    gloss: "Sam: The service is, in my view, fairly slow, in a sense."
  it.b2.unit03.lesson06.teach.dialogue_elena_emphasis:
    title: "Elena: Yes, but the food is really extremely delicious!"
    gloss: "Elena: Yes, but the food is really extremely delicious!"
  it.b2.unit03.lesson06.teach.dialogue_sam_focus:
    title: "Sam: That's true. It's precisely the food that saves the restaurant."
    gloss: "Sam: That's true. It's precisely the food that saves the restaurant."
  it.b2.unit03.lesson06.teach.dialogue_elena_hedge:
    title: "Elena: I would say it's worth it."
    gloss: "Elena: I would say it's worth it."
  it.b2.unit03.lesson06.teach.dialogue_sam_assolutamente:
    title: "Sam: Absolutely!"
    gloss: "Sam: Absolutely!"
  it.b2.unit03.lesson06.teach.grammar_sfumature:
    title: "Nuance recap"
    gloss: "The restaurant is good. The restaurant is, in my view, actually quite good. The restaurant is really extremely good."
    note: "The same underlying claim, delivered three ways: plain, hedged, and emphatic -- exactly what the speaking and writing tasks of this lesson ask you to produce."

exercises:
  it.b2.unit03.lesson01.exercise01.recognize_in_realta:
    instruction: "What does this phrase mean?"
    correct_option: actually
    distractors: [never, always, "for example"]
    accepted_answers: [{value: actually, status: correct}]
    feedback: "*In realtà* means actually -- a hedge."
  it.b2.unit03.lesson01.exercise02.listen_in_realta_abbastanza:
    instruction: "Listen and select what you hear."
    correct_option: "The restaurant is actually quite good."
    distractors: ["The restaurant is actually quite bad.", "The restaurant is actually very expensive.", "The restaurant is actually rather slow."]
    accepted_answers: [{value: "The restaurant is actually quite good.", status: correct}]
    feedback: "*Il ristorante è in realtà abbastanza buono* means the restaurant is actually quite good."
  it.b2.unit03.lesson01.exercise03.match_hedges:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"in realtà": actually, abbastanza: "quite / fairly", "un po'": "a bit", piuttosto: rather, "secondo me": "in my opinion", "a mio parere": "in my view", buono: good, "il ristorante": "the restaurant"}
        status: correct
    feedback: "These are this lesson's hedging words."
  it.b2.unit03.lesson01.exercise04.order_in_realta_abbastanza:
    instruction: "Put the words in order: The restaurant is actually quite good."
    accepted_answers:
      - {value: "Il ristorante è in realtà abbastanza buono", status: correct}
    feedback: "*Il ristorante è in realtà abbastanza buono* means the restaurant is actually quite good."
  it.b2.unit03.lesson01.exercise05.translate_secondo_me:
    instruction: "Translate into Italian, opening with secondo me: In my opinion the restaurant is good."
    accepted_answers:
      - {value: "Secondo me il ristorante è buono", status: correct}
      - {value: "Secondo me, il ristorante è buono", status: correct}
    feedback: "*Secondo me il ristorante è buono* means in my opinion the restaurant is good."
  it.b2.unit03.lesson01.exercise06.write_soften:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The restaurant is good. Hedge it using in realtà and abbastanza (both after 'è'): The restaurant is actually quite good."
    accepted_answers:
      - {value: "Il ristorante è in realtà abbastanza buono", status: correct}
    feedback: "*Il ristorante è in realtà abbastanza buono* means the restaurant is actually quite good."
  it.b2.unit03.lesson01.exercise07.speak_a_mio_parere:
    instruction: "Say aloud in Italian, opening with a mio parere: In my view the restaurant is good."
    accepted_answers:
      - {value: "A mio parere il ristorante è buono", status: correct}
    feedback: "*A mio parere il ristorante è buono* means in my view the restaurant is good."
  it.b2.unit03.lesson01.exercise08.dictation_in_realta_abbastanza:
    instruction: "Type what you hear."
    correct_response: "Il ristorante è in realtà abbastanza buono"
    orthography_strict: true
    feedback: "You heard *Il ristorante è in realtà abbastanza buono* — the restaurant is actually quite good."

  it.b2.unit03.lesson02.exercise01.recognize_lento:
    instruction: "What does this word mean?"
    correct_option: slow
    distractors: [fast, delicious, expensive]
    accepted_answers: [{value: slow, status: correct}]
    feedback: "*Lento* means slow."
  it.b2.unit03.lesson02.exercise02.listen_direi_che:
    instruction: "Listen and select what you hear."
    correct_option: "I would say that the restaurant is good."
    distractors: ["I would say that the restaurant is bad.", "I believe that the restaurant is a success.", "I would say that the service is slow."]
    accepted_answers: [{value: "I would say that the restaurant is good.", status: correct}]
    feedback: "*Direi che il ristorante è buono* means I would say that the restaurant is good."
  it.b2.unit03.lesson02.exercise03.match_tentative:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"in un certo senso": "in a sense", "sembra che": "it seems that", "direi che": "I would say that", "credo che": "I believe that", forse: maybe, lento: slow, "il servizio": "the service", "un successo": "a success"}
        status: correct
    feedback: "These are this lesson's tentative-framing words."
  it.b2.unit03.lesson02.exercise04.order_direi_che:
    instruction: "Put the words in order: I would say that the restaurant is good."
    accepted_answers:
      - {value: "Direi che il ristorante è buono", status: correct}
    feedback: "*Direi che il ristorante è buono* means I would say that the restaurant is good."
  it.b2.unit03.lesson02.exercise05.translate_sembra_che:
    instruction: "Translate into Italian, using sembra che: It seems that the restaurant is a success."
    accepted_answers:
      - {value: "Sembra che il ristorante sia un successo", status: correct}
    feedback: "*Sembra che il ristorante sia un successo* means it seems that the restaurant is a success."
  it.b2.unit03.lesson02.exercise06.write_hedge_lento:
    instruction: "Soften this blunt statement using sembra (seems) + adjective, no che needed: The service seems slow."
    accepted_answers:
      - {value: "Il servizio sembra lento", status: correct}
    feedback: "*Il servizio sembra lento* means the service seems slow."
  it.b2.unit03.lesson02.exercise07.speak_in_un_certo_senso:
    instruction: "Say aloud in Italian, opening with in un certo senso: In a sense, the service is slow."
    accepted_answers:
      - {value: "In un certo senso il servizio è lento", status: correct}
    feedback: "*In un certo senso il servizio è lento* means in a sense, the service is slow."

  it.b2.unit03.lesson03.exercise01.recognize_estremamente:
    instruction: "What does this word mean?"
    correct_option: extremely
    distractors: [barely, never, because]
    accepted_answers: [{value: extremely, status: correct}]
    feedback: "*Estremamente* means extremely."
  it.b2.unit03.lesson03.exercise02.listen_davvero_estremamente:
    instruction: "Listen and select what you hear."
    correct_option: "The restaurant is really extremely good."
    distractors: ["The restaurant is really extremely bad.", "The restaurant is fairly good.", "The restaurant is really quite slow."]
    accepted_answers: [{value: "The restaurant is really extremely good.", status: correct}]
    feedback: "*Il ristorante è davvero estremamente buono* means the restaurant is really extremely good."
  it.b2.unit03.lesson03.exercise03.match_emphasis:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {davvero: really, molto: very, estremamente: extremely, assolutamente: absolutely, sicuramente: certainly, delizioso: delicious, "vale la pena": "it's worth it", "il cibo": "the food"}
        status: correct
    feedback: "These are this lesson's emphasis words."
  it.b2.unit03.lesson03.exercise04.order_davvero_estremamente:
    instruction: "Put the words in order: The restaurant is really extremely good."
    accepted_answers:
      - {value: "Il ristorante è davvero estremamente buono", status: correct}
    feedback: "*Il ristorante è davvero estremamente buono* means the restaurant is really extremely good."
  it.b2.unit03.lesson03.exercise05.translate_assolutamente:
    instruction: "Translate into Italian, using assolutamente: The restaurant is absolutely worth it."
    accepted_answers:
      - {value: "Il ristorante vale assolutamente la pena", status: correct}
    feedback: "*Il ristorante vale assolutamente la pena* means the restaurant is absolutely worth it."
  it.b2.unit03.lesson03.exercise06.write_emphasize:
    instruction: "Strengthen this weak statement into an emphatic one. Weak: The restaurant is good. Emphasize it using davvero and estremamente (both after 'è'): The restaurant is really extremely good."
    accepted_answers:
      - {value: "Il ristorante è davvero estremamente buono", status: correct}
    feedback: "*Il ristorante è davvero estremamente buono* means the restaurant is really extremely good."
  it.b2.unit03.lesson03.exercise07.speak_davvero_molto:
    instruction: "Say aloud in Italian, emphasizing with davvero molto: The food is really very delicious."
    accepted_answers:
      - {value: "Il cibo è davvero molto delizioso", status: correct}
    feedback: "*Il cibo è davvero molto delizioso* means the food is really very delicious."
  it.b2.unit03.lesson03.exercise08.dictation_davvero_estremamente:
    instruction: "Type what you hear."
    correct_response: "Il ristorante è davvero estremamente buono"
    orthography_strict: true
    feedback: "You heard *Il ristorante è davvero estremamente buono* — the restaurant is really extremely good."

  it.b2.unit03.lesson04.exercise01.recognize_eccome:
    instruction: "What does this word mean?"
    correct_option: "and how / absolutely"
    distractors: [never, maybe, because]
    accepted_answers: [{value: "and how / absolutely", status: correct}]
    feedback: "*Eccome* insists a statement is true against implied doubt -- 'and how!'."
  it.b2.unit03.lesson04.exercise02.listen_cleft_servizio:
    instruction: "Listen and select what you hear."
    correct_option: "It's the service that makes the restaurant special."
    distractors: ["It's the food that makes the restaurant special.", "It's the price that makes the restaurant special.", "The service makes the restaurant slow."]
    accepted_answers: [{value: "It's the service that makes the restaurant special.", status: correct}]
    feedback: "*È il servizio che rende speciale il ristorante* means it's the service that makes the restaurant special."
  it.b2.unit03.lesson04.exercise03.match_focus:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"è ... che": "it is ... that (cleft)", "quello che ... è ...": "what ... is ...", proprio: "precisely / just", eccome: "and how / absolutely", "rende speciale": "makes special", ottimo: excellent, "il problema": "the problem", "il servizio": "the service"}
        status: correct
    feedback: "These are this lesson's focus words."
  it.b2.unit03.lesson04.exercise04.order_cleft_servizio:
    instruction: "Put the words in order: It's the service that makes the restaurant special."
    accepted_answers:
      - {value: "È il servizio che rende speciale il ristorante", status: correct}
    feedback: "*È il servizio che rende speciale il ristorante* means it's the service that makes the restaurant special."
  it.b2.unit03.lesson04.exercise05.translate_quello_che_e:
    instruction: "Translate into Italian, using the focus frame quello che... è...: What is excellent is the service."
    accepted_answers:
      - {value: "Quello che è ottimo è il servizio", status: correct}
    feedback: "*Quello che è ottimo è il servizio* means what is excellent is the service."
  it.b2.unit03.lesson04.exercise06.write_eccome:
    instruction: "Someone doubts the restaurant is any good. Insist it is, using eccome (after the statement): The restaurant is good, and how!"
    accepted_answers:
      - {value: "Il ristorante è buono, eccome", status: correct}
    feedback: "*Il ristorante è buono, eccome* means the restaurant is good, and how!"
  it.b2.unit03.lesson04.exercise07.speak_cleft:
    instruction: "Say aloud in Italian, using the cleft è ... che to put focus on the service: It is the service that makes the restaurant special."
    accepted_answers:
      - {value: "È il servizio che rende speciale il ristorante", status: correct}
    feedback: "*È il servizio che rende speciale il ristorante* means it is the service that makes the restaurant special."

  it.b2.unit03.lesson05.exercise01.read_hedge:
    instruction: "Which opinion does the writer HEDGE -- present tentatively rather than assert flatly?"
    correct_option: "That the restaurant is expensive."
    distractors: ["That the food is delicious.", "That the service is the highlight.", "That the restaurant is worth it."]
    accepted_answers: [{value: "That the restaurant is expensive.", status: correct}]
    feedback: "The writer hedges: *a mio parere un po' caro* (in my view, a bit expensive)."
  it.b2.unit03.lesson05.exercise02.read_hedge_words:
    instruction: "Which words mark the writer's hedge about the restaurant being expensive?"
    correct_option: "a mio parere and un po'"
    distractors: ["davvero and estremamente", "sembra che", "eccome"]
    accepted_answers: [{value: "a mio parere and un po'", status: correct}]
    feedback: "*A mio parere ... un po' caro* softens the claim."
  it.b2.unit03.lesson05.exercise03.read_emphasis:
    instruction: "Which claim does the writer state most emphatically?"
    correct_option: "That the food is delicious."
    distractors: ["That the restaurant is new.", "That the beginning is slow.", "That the restaurant is expensive."]
    accepted_answers: [{value: "That the food is delicious.", status: correct}]
    feedback: "The writer emphasizes: *il cibo è davvero estremamente delizioso* (the food is really extremely delicious)."
  it.b2.unit03.lesson05.exercise04.read_focus:
    instruction: "The writer uses the focus construction 'È proprio il cibo che salva il ristorante.' What does it single out?"
    correct_option: "The food, as the thing that saves the restaurant."
    distractors: ["The service, as the thing that saves the restaurant.", "The price, as the main problem.", "The beginning, as the best part."]
    accepted_answers: [{value: "The food, as the thing that saves the restaurant.", status: correct}]
    feedback: "The cleft singles out *il cibo* (the food) as the specific thing that saves the restaurant."
  it.b2.unit03.lesson05.exercise05.match_reading:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {nuovo: new, caro: expensive, "l'inizio": "the beginning", salva: saves, del: "of the", ma: but}
        status: correct
    feedback: "These are the reading's key words."
  it.b2.unit03.lesson05.exercise06.translate_lento:
    instruction: "Translate into Italian, using abbastanza: The beginning of the service is fairly slow."
    accepted_answers:
      - {value: "L'inizio del servizio è abbastanza lento", status: correct}
    feedback: "*L'inizio del servizio è abbastanza lento* means the beginning of the service is fairly slow."
  it.b2.unit03.lesson05.exercise07.write_hedge_caro:
    instruction: "Soften this blunt statement into a hedged one. Blunt: The restaurant is expensive. Hedge it using a mio parere (opening) and un po': In my view, the restaurant is a bit expensive."
    accepted_answers:
      - {value: "A mio parere il ristorante è un po' caro", status: correct}
    feedback: "*A mio parere il ristorante è un po' caro* means in my view, the restaurant is a bit expensive."

  it.b2.unit03.lesson06.exercise01.classify_hedge:
    instruction: "Sam says the service is 'a mio parere abbastanza lento, in un certo senso'. Is he hedging, stating neutrally, or emphasizing -- and what does that say about his commitment?"
    correct_option: "Hedging -- he is softening a critical claim."
    distractors: ["Emphasizing -- he is fully committed.", "Stating a plain fact with no stance.", "Repeating Elena's opinion exactly."]
    accepted_answers: [{value: "Hedging -- he is softening a critical claim.", status: correct}]
    feedback: "*A mio parere* and *in un certo senso* both soften Sam's criticism."
  it.b2.unit03.lesson06.exercise02.classify_emphasis:
    instruction: "How does Elena present her claim about the food ('Sì, ma il cibo è davvero estremamente delizioso!')?"
    correct_option: "Emphatically -- she is fully committed to the claim."
    distractors: ["As a tentative guess.", "As a hedge.", "As someone else's opinion."]
    accepted_answers: [{value: "Emphatically -- she is fully committed to the claim.", status: correct}]
    feedback: "*Davvero estremamente* stacks two intensifiers -- maximum commitment."
  it.b2.unit03.lesson06.exercise03.classify_focus:
    instruction: "What does Sam do with 'È proprio il cibo che salva il ristorante.'?"
    correct_option: "He singles out the food as the specific thing that saves the restaurant."
    distractors: ["He hedges his opinion about the food.", "He denies the food is good.", "He changes the subject to the service."]
    accepted_answers: [{value: "He singles out the food as the specific thing that saves the restaurant.", status: correct}]
    feedback: "The cleft *è ... che* puts focus specifically on *il cibo*."
  it.b2.unit03.lesson06.exercise04.speak_same_hedged:
    instruction: "Deliver the claim 'The restaurant is good' as a HEDGE that lowers your commitment. Use a mio parere (opening), then abbastanza: The restaurant is, in my view, fairly good."
    accepted_answers:
      - {value: "A mio parere il ristorante è abbastanza buono", status: correct}
    feedback: "*A mio parere il ristorante è abbastanza buono* means the restaurant is, in my view, fairly good."
  it.b2.unit03.lesson06.exercise05.speak_same_emphatic:
    instruction: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using davvero estremamente: The restaurant is really extremely good."
    accepted_answers:
      - {value: "Il ristorante è davvero estremamente buono", status: correct}
    feedback: "*Il ristorante è davvero estremamente buono* means the restaurant is really extremely good."
  it.b2.unit03.lesson06.exercise06.write_both_ways:
    instruction: "Write the SAME claim about the bill TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using un po': The bill is a bit high. (2) EMPHATIC, raising commitment, using davvero molto: The bill is really very high."
    accepted_answers:
      - {value: "Il conto è un po' alto. Il conto è davvero molto alto", status: correct}
    feedback: "*Il conto è un po' alto. Il conto è davvero molto alto.*"
  it.b2.unit03.lesson06.exercise07.respond_emphatic:
    instruction: "Cosa ne pensi del cibo? Reply with an EMPHATIC statement, stacking intensifiers to raise your commitment (e.g. davvero, molto, estremamente, assolutamente, sicuramente): The food is really extremely delicious."
    accepted_answers:
      - {value: "Il cibo è davvero estremamente delizioso", status: correct}
      - {value: "Il cibo è davvero molto delizioso", status: correct}
      - {value: "Il cibo è assolutamente delizioso", status: correct}
      - {value: "Il cibo è sicuramente delizioso", status: correct}
      - {value: "Il cibo è molto delizioso", status: correct}
    feedback: "*Il cibo è davvero estremamente delizioso* means the food is really extremely delicious -- an emphatic reply, strongly committed to the claim."
