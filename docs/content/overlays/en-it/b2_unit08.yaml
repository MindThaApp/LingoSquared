exercises:
  it.b2.unit08.lesson01.exercise01.recognize_secondo:
    instruction: "What does this word mean?"
    correct_option: "according to"
    distractors: [despite, "because of", "instead of"]
    accepted_answers: [{value: "according to", status: correct}]
    feedback: "*Secondo* means according to."
  it.b2.unit08.lesson01.exercise02.listen_secondo_giulia:
    instruction: "Listen and select what you hear."
    correct_option: "According to Giulia, it isn't expensive."
    distractors: ["According to Marco, it isn't expensive.", "According to Giulia, it's expensive.", "According to Giulia, the food isn't good."]
    accepted_answers: [{value: "According to Giulia, it isn't expensive.", status: correct}]
    feedback: "*Secondo Giulia, non è caro* means according to Giulia, it isn't expensive."
  it.b2.unit08.lesson01.exercise03.match_attribution_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {secondo: "according to", sostiene: "maintains / asserts", afferma: "states / claims", "si capisce che": "it's understood that (from evidence)", recensione: review, fonte: source, cibo: food, prezzo: price}
        status: correct
    feedback: "These are this lesson's attribution words."
  it.b2.unit08.lesson01.exercise04.order_secondo_giulia:
    instruction: "Put the words in order: According to Giulia, the food is good."
    accepted_answers:
      - {value: "Secondo Giulia il cibo è buono", status: correct}
    feedback: "*Secondo Giulia, il cibo è buono* means according to Giulia, the food is good."
  it.b2.unit08.lesson01.exercise05.translate_afferma:
    instruction: "Translate into Italian, using affermare: Marco claims that it is too expensive."
    accepted_answers:
      - {value: "Marco afferma che è troppo caro", status: correct}
      - {value: "Marco afferma che sia troppo caro", status: correct}
    feedback: "*Marco afferma che è troppo caro* means Marco claims that it is too expensive -- *affermare* usually takes the indicative (*è*)."
  it.b2.unit08.lesson01.exercise06.speak_secondo_giulia:
    instruction: "Say aloud in Italian, using secondo: According to Giulia, it isn't expensive."
    accepted_answers:
      - {value: "Secondo Giulia non è caro", status: correct}
    feedback: "*Secondo Giulia, non è caro* means according to Giulia, it isn't expensive."
  it.b2.unit08.lesson01.exercise07.write_si_capisce_che:
    instruction: "Write in Italian, using dalla recensione si capisce che: The review shows that the food is good."
    accepted_answers:
      - {value: "Dalla recensione si capisce che il cibo è buono", status: correct}
    feedback: "*Dalla recensione si capisce che il cibo è buono* means the review shows that the food is good."
  it.b2.unit08.lesson01.exercise08.dictation_secondo_giulia:
    instruction: "Type what you hear."
    correct_response: "Secondo Giulia, non è caro"
    orthography_strict: true
    feedback: "You heard *Secondo Giulia, non è caro* — according to Giulia, it isn't expensive."

  it.b2.unit08.lesson02.exercise01.recognize_mentre:
    instruction: "What does this word mean?"
    correct_option: whereas
    distractors: [because, therefore, "and"]
    accepted_answers: [{value: whereas, status: correct}]
    feedback: "*Mentre* means whereas."
  it.b2.unit08.lesson02.exercise02.listen_entrambe_buono:
    instruction: "Listen and select what you hear."
    correct_option: "Both reviews say the food is good."
    distractors: ["Both reviews say the food is expensive.", "One review says the food is good.", "Both reviews say the price is good."]
    accepted_answers: [{value: "Both reviews say the food is good.", status: correct}]
    feedback: "*Entrambe le recensioni dicono che il cibo è buono* means both reviews say the food is good."
  it.b2.unit08.lesson02.exercise03.match_comparison_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {entrambe: "both (of them)", mentre: whereas, "al contrario": "by contrast", "a differenza di": "in contrast to", "da un lato ... dall'altro": "on one hand ... on the other", economico: "cheap / inexpensive"}
        status: correct
    feedback: "These are this lesson's comparison words."
  it.b2.unit08.lesson02.exercise04.order_entrambe_buono:
    instruction: "Put the words in order: Both reviews say the food is good."
    accepted_answers:
      - {value: "Entrambe le recensioni dicono che il cibo è buono", status: correct}
    feedback: "*Entrambe le recensioni dicono che il cibo è buono* means both reviews say the food is good."
  it.b2.unit08.lesson02.exercise05.translate_mentre:
    instruction: "Translate into Italian, using mentre: Giulia is positive, whereas Marco is negative."
    accepted_answers:
      - {value: "Giulia è positiva, mentre Marco è negativo", status: correct}
      - {value: "Giulia è positiva mentre Marco è negativo", status: correct}
    feedback: "*Giulia è positiva, mentre Marco è negativo* means Giulia is positive, whereas Marco is negative."
  it.b2.unit08.lesson02.exercise06.translate_a_differenza_di:
    instruction: "Translate into Italian, using a differenza di: In contrast to Giulia, Marco finds it expensive."
    accepted_answers:
      - {value: "A differenza di Giulia, Marco lo trova caro", status: correct}
      - {value: "A differenza di Giulia Marco lo trova caro", status: correct}
    feedback: "*A differenza di Giulia, Marco lo trova caro* means in contrast to Giulia, Marco finds it expensive."
  it.b2.unit08.lesson02.exercise07.write_da_un_lato:
    instruction: "Write in Italian, using da un lato ... dall'altro ...: On one hand it's good, on the other hand it's expensive."
    accepted_answers:
      - {value: "Da un lato è buono, dall'altro è caro", status: correct}
      - {value: "Da un lato è buono dall'altro è caro", status: correct}
    feedback: "*Da un lato è buono, dall'altro è caro* means on one hand it's good, on the other hand it's expensive."
  it.b2.unit08.lesson02.exercise08.dictation_entrambe_buono:
    instruction: "Type what you hear."
    correct_response: "Entrambe le recensioni dicono che il cibo è buono"
    orthography_strict: true
