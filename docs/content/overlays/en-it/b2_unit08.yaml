course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: synthesize and evaluate multiple sources --
    combine information from two restaurant reviews into a coherent
    summary, note where they agree or conflict, and give a reasoned
    judgement about them.

units:
  it.b2.unit08.sintesi:
    title: "Synthesis"
    description: Synthesize and evaluate -- combine information from more than one source into a coherent summary, note where the sources agree or conflict, and give a reasoned judgement about them.

