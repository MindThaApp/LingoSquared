  notes: >-
    Overlay for Italian C1 unit 04 on concession and proportionate rebuttal.
    English-speaker interference risks: treating concession markers as empty
    politeness, overusing blunt but/ma, and writing open production that could
    be answered many ways. The production exercises therefore name exact taught
    models and accept those strings with punctuation variants only where needed.
    No sibling-direction overlay was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): FIXES:
    lesson01.teach.obiezione_forte example_gloss -> 'It's a strong
    objection, I admit it.' (mirrors realization fix);
    lesson06.teach.mappa_completa title/gloss -> 'concession, qualification,
    counterargument, final weighing', note rewritten as a language note on
    precisazione/controargomentazione/bilanciamento (was 'the C1 argument
    route'); lesson06.teach.modello_completo note no longer refers to 'the
    final speaking and writing tasks' (course-construction wording);
    lesson05.teach.elena_obiezione note 'informal tu/noi' -> 'informal noi'
    (sentence has no tu). NATIVE FLAGS as on the u04 realization; notes
    still say 'C1 rebuttal'/'standard C1 stance' (mild).

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 2 fixes -
    lesson04.exercise03.match_pesatura: 'tuttavia' right 'counterweight' ->
    'however' (was interchangeable with 'counterevidence');
    lesson06.exercise02.match_complete_moves: 'Nel complesso' right 'final
    weighing' -> 'overall / on balance' (was interchangeable with 'balanced
    conclusion'); realization pairs and overlay accepted values kept in sync.
    NATIVE FLAGS: as logged 2026-10-11 ('pesa piu di' / 'pesa meglio' calques,
    'il remoto', mappa_completa terms). DEFERRED: none.

    Second-pass review 2026-10-18: 1 fix (all overlay) -
    lesson05.teach.elena_obiezione note called noi 'informal' -> first-person
     plural framing a shared concern. NATIVE FLAGS: order_qualifica also admits 'Su questo hai ragione ma fino a un certo punto' (not added: validator warns on reordered word_order answers); 'pesa piu di scegliere un solo
    modello' / 'pesa meglio i due bisogni' read as calques ('conta piu di',
    'bilancia meglio le due esigenze'); 'il remoto' as a noun; canon - Elena
    (a teacher) debating a shared office remote-work policy with Sam.

course:
  title: Italian C1
  description: "Advanced Italian argumentation: genuinely concede, qualify scope, rebut proportionately, and weigh competing considerations."

units:
  it.c1.unit04.concedere_controbattere:
    title: "Concede and counter with nuance"
    description: "Grant a strong opposing point, narrow its scope, present counterevidence, and weigh the competing considerations."

lessons:
  it.c1.unit04.concedere_controbattere.lesson01.concedere:
    title: "Concede a valid point"
  it.c1.unit04.concedere_controbattere.lesson02.qualificare:
    title: "Qualify without cancelling"
  it.c1.unit04.concedere_controbattere.lesson03.controbattere:
    title: "Counter proportionately"
  it.c1.unit04.concedere_controbattere.lesson04.pesare_argomento:
    title: "Weigh the considerations"
  it.c1.unit04.concedere_controbattere.lesson05.risposta_orale:
    title: "Prepare the spoken response"
  it.c1.unit04.concedere_controbattere.lesson06.argomento_completo:
    title: "The complete argument"

teaching:
  it.c1.unit04.concedere_controbattere.lesson01.teach.ammetto_che:
    title: "I admit that..."
    gloss: "I admit that..."
    note: "*Ammetto che...* is a genuine concession opener: you grant that the other person's point has substance before you limit or counter it."
  it.c1.unit04.concedere_controbattere.lesson01.teach.presenza_ufficio:
    title: "being in the office"
    gloss: "presence in the office"
    note: "*La presenza in ufficio* names in-person office presence, the opposing point Sam must treat as valid."
  it.c1.unit04.concedere_controbattere.lesson01.teach.favorisce_confronti:
    title: "encourages spontaneous exchanges"
    gloss: "encourages spontaneous exchanges"
    note: "*Favorisce confronti spontanei* gives real weight to the objection: office presence can make informal discussion easier."
  it.c1.unit04.concedere_controbattere.lesson01.teach.obiezione_forte:
    title: "a strong objection"
    gloss: "a strong objection"
    note: "*Un'obiezione forte* is not dismissed. C1 rebuttal starts by recognizing why the objection matters."
    example_gloss: "It's a strong objection, I admit it."
  it.c1.unit04.concedere_controbattere.lesson01.teach.modello_concessione:
    title: "A real concession"
    gloss: "I admit that being in the office encourages spontaneous exchanges."
    note: "This sentence grants the strongest point before any counterargument appears."

  it.c1.unit04.concedere_controbattere.lesson02.teach.hai_ragione:
    title: "you are right about this"
    gloss: "you are right about this"
    note: "*Hai ragione su questo* uses informal tu (*hai*) and keeps the concession interpersonal and direct."
  it.c1.unit04.concedere_controbattere.lesson02.teach.fino_a_un_certo_punto:
    title: "up to a point"
    gloss: "up to a point"
    note: "*Fino a un certo punto* narrows the claim's reach; it does not pretend the claim is worthless."
  it.c1.unit04.concedere_controbattere.lesson02.teach.in_parte:
    title: "partly"
    gloss: "partly"
    note: "*In parte* marks partial agreement and prepares a measured response."
  it.c1.unit04.concedere_controbattere.lesson02.teach.non_del_tutto:
    title: "not completely"
    gloss: "not completely"
    note: "*Non del tutto* limits agreement while preserving some of it."
  it.c1.unit04.concedere_controbattere.lesson02.teach.modello_qualifica:
    title: "A scoped concession"
    gloss: "You are right about this, but up to a point."
    note: "The phrase accepts Elena's point, then limits its scope with *ma fino a un certo punto*."

  it.c1.unit04.concedere_controbattere.lesson03.teach.il_punto_e_che:
    title: "the point is that..."
    gloss: "the point is that..."
    note: "*Il punto è che...* introduces the reason that changes the balance of the argument."
  it.c1.unit04.concedere_controbattere.lesson03.teach.tre_giorni_remoto:
    title: "three remote days"
    gloss: "three days remote"
    note: "*Tre giorni da remoto* keeps the counterargument bounded: the claim is not for permanent remote work."
  it.c1.unit04.concedere_controbattere.lesson03.teach.aumentano_concentrazione:
    title: "increase focus"
    gloss: "increase concentration / focus"
    note: "*Aumentano la concentrazione* supplies counterevidence rather than a bare contradiction."
  it.c1.unit04.concedere_controbattere.lesson03.teach.senza_isolare:
    title: "without isolating the team"
    gloss: "without isolating the team"
    note: "*Senza isolare il team* answers the worry that remote work would cut off collaboration."
  it.c1.unit04.concedere_controbattere.lesson03.teach.daltra_parte:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*D'altra parte* can introduce a balancing consideration, but this unit's core model uses *Il punto è che* for the counterargument."
  it.c1.unit04.concedere_controbattere.lesson03.teach.modello_controprova:
    title: "Counterevidence"
    gloss: "The point is that three remote days increase focus without isolating the team."
    note: "This counterargument is proportionate because it limits the policy and directly answers the conceded worry."

  it.c1.unit04.concedere_controbattere.lesson04.teach.e_vero_che:
    title: "it is true that..."
    gloss: "it is true that..."
    note: "*È vero che...* grants a point explicitly before shifting weight."
  it.c1.unit04.concedere_controbattere.lesson04.teach.decisioni_rapide:
    title: "helps quick decisions"
    gloss: "helps quick decisions"
    note: "*Aiuta le decisioni rapide* specifies where office presence has real value."
  it.c1.unit04.concedere_controbattere.lesson04.teach.tuttavia:
    title: "however"
    gloss: "however"
    note: "*Tuttavia* introduces the counterweight without sounding dismissive."
    example_gloss: "However, deep work requires calm."
  it.c1.unit04.concedere_controbattere.lesson04.teach.analisi_profonda:
    title: "deep analysis"
    gloss: "deep analysis"
    note: "*Analisi profonda* names the condition where remote work carries more weight."
  it.c1.unit04.concedere_controbattere.lesson04.teach.riduce_interruzioni:
    title: "reduces interruptions and improves quality"
    gloss: "reduces interruptions and improves quality"
    note: "The two effects make the counterweight concrete: fewer interruptions and better quality."
  it.c1.unit04.concedere_controbattere.lesson04.teach.nel_complesso:
    title: "overall"
    gloss: "overall / on balance"
    note: "*Nel complesso* announces final weighing rather than a new point."
  it.c1.unit04.concedere_controbattere.lesson04.teach.alternare:
    title: "to alternate the two ways"
    gloss: "to alternate the two ways"
    note: "*Alternare i due modi* is the balanced solution: office and remote work are both kept in the picture."
  it.c1.unit04.concedere_controbattere.lesson04.teach.pesa_piu:
    title: "carries more weight than choosing one model"
    gloss: "weighs more than choosing a single model"
    note: "*Pesa più di...* is the weighing language that closes a subtle counterargument."
  it.c1.unit04.concedere_controbattere.lesson04.teach.argomento_pesato:
    title: "A weighted argument"
    gloss: "It is true that presence helps quick decisions; however, when the work requires deep analysis, remote work reduces interruptions and improves quality; overall, alternating the two ways carries more weight than choosing a single model."
    note: "Follow the structure: concession, counterweight, final weighing."

  it.c1.unit04.concedere_controbattere.lesson05.teach.elena_obiezione:
    title: "Elena's objection"
    gloss: "If we often stay remote, we lose spontaneous exchanges."
    note: "Elena speaks in the first-person plural (*restiamo*, *perdiamo*: 'we'), framing the objection as a shared concern; Sam's answer must treat this objection as valid before countering."
  it.c1.unit04.concedere_controbattere.lesson05.teach.risposta_orale:
    title: "Spoken response model"
    gloss: "I admit that being in the office encourages spontaneous exchanges. You are right about this, but up to a point. The point is that three remote days increase focus without isolating the team."
    note: "This is the required spoken sequence: concede, qualify, counter."
  it.c1.unit04.concedere_controbattere.lesson05.teach.proporzionato:
    title: "proportionate"
    gloss: "proportionate / measured"
    note: "*Proporzionato* means measured against the point being answered."
    example_gloss: "The counterargument is proportionate."
  it.c1.unit04.concedere_controbattere.lesson05.teach.non_respinge:
    title: "does not dismiss the objection"
    gloss: "does not reject the objection"
    note: "*Non respinge l'obiezione* is the standard C1 stance here: the answer absorbs the valid part before rebutting."

  it.c1.unit04.concedere_controbattere.lesson06.teach.modello_completo:
    title: "The complete subtle argument"
    gloss: "I admit that being in the office encourages spontaneous exchanges, so I do not consider it irrelevant. You are right about this, but up to a point: for quick decisions it matters a lot, while for deep analysis it matters less. The point is that three remote days increase focus without isolating the team, because the other two days remain dedicated to exchange. Overall, this solution weighs the two needs better."
    note: "This model combines all four argumentative moves: concession, qualification, counterevidence, and final weighing."
  it.c1.unit04.concedere_controbattere.lesson06.teach.mappa_completa:
    title: "concession, qualification, counterargument, final weighing"
    gloss: "concession, qualification, counterargument, final weighing"
    note: "These four labels name the moves of the complete model: *precisazione* narrows the scope of a claim, *controargomentazione* is the counterargument, and *bilanciamento* is the final weighing-up of both sides."
    example_gloss: "The final weighing makes the argument balanced."

