units:
  it.a2.unit28.dal_medico: {title: "At the doctor's"}
lessons:
  it.a2.unit28.lesson01.sintomi: {title: "Symptoms"}
  it.a2.unit28.lesson02.visita: {title: "The appointment"}
teaching:
  it.a2.unit28.lesson01.teach_mal_gola_febbre: {title: "mal di gola, febbre", gloss: "sore throat, fever", note: "Italian says *ho mal di gola* and *ho la febbre* or *ho un po' di febbre*: literally 'I have,' not 'I am.'", example_gloss: ["I have a sore throat.", "I have a little fever."]}
  it.a2.unit28.lesson01.teach_tosse_forte: {title: "la tosse, forte, leggera", gloss: "cough, strong, mild", note: "*Tosse* is feminine, so *leggera* has feminine ending. *Forte* has the same form here.", example_gloss: ["The cough is strong.", "The cough is mild."]}
  it.a2.unit28.lesson01.teach_da_tre_giorni: {title: "da tre giorni", gloss: "for three days", note: "With ongoing symptoms, Italian uses *da* plus time. English speakers often try *per tre giorni*, but *da tre giorni* is the natural form here.", example_gloss: ["I have had a sore throat for three days."]}
  it.a2.unit28.lesson01.teach_un_poco: {title: "un po' di febbre", gloss: "a little fever", note: "*Un po' di* means 'a little/some.' The apostrophe in *po'* is required.", example_gloss: ["I have a little fever today."]}
  it.a2.unit28.lesson02.teach_cosa_si_sente: {title: "Che sintomi ha?", gloss: "What symptoms do you have?", note: "This is the idiomatic formal *Lei* question a doctor can ask about symptoms.", example_gloss: ["Good morning, what symptoms do you have?"]}
  it.a2.unit28.lesson02.teach_prenda_medicina: {title: "Prenda questa medicina.", gloss: "Take this medicine.", note: "*Prenda* is the formal *Lei* instruction form.", example_gloss: ["Take this medicine twice a day."]}
  it.a2.unit28.lesson02.teach_beva_acqua: {title: "Beva molta acqua.", gloss: "Drink a lot of water.", note: "*Beva* is another formal instruction form. The informal command would be *bevi*.", example_gloss: ["Drink a lot of water and rest."]}
  it.a2.unit28.lesson02.teach_vorrei_visita: {title: "Vorrei prenotare una visita.", gloss: "I would like to book an appointment.", note: "*Visita* means a medical visit/appointment here, not tourism.", example_gloss: ["I would like to book an appointment for today."]}
exercises:
  it.a2.unit28.lesson01.exercise01.choose_gola:
    instruction: "Which phrase means 'sore throat'?"
    correct_option: "mal di gola"
    distractors: ["febbre", "la tosse", "la carta"]
    accepted_answers: [{value: "mal di gola", status: "correct"}]
    feedback: "*Mal di gola* means sore throat."
  it.a2.unit28.lesson01.exercise02.listen_mal_gola:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Ho mal di gola da tre giorni."
    distractors: ["Ho mal di testa da una settimana.", "Ho la tosse da due mesi.", "Ho un appuntamento domani."]
    accepted_answers: [{value: "Ho mal di gola da tre giorni.", status: "correct"}]
    feedback: "The speaker says the sore throat has lasted three days."
  it.a2.unit28.lesson01.exercise03.choose_duration:
    instruction: "Which phrase means 'for three days' with an ongoing symptom?"
    correct_option: "da tre giorni"
    distractors: ["alle tre", "tre euro", "il tre gennaio"]
    accepted_answers: [{value: "da tre giorni", status: "correct"}]
    feedback: "*Da tre giorni* gives symptom duration."
  it.a2.unit28.lesson01.exercise04.match_symptoms:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "sore throat", right: "mal di gola"}
          - {left: "fever", right: "febbre"}
          - {left: "cough", right: "la tosse"}
          - {left: "strong", right: "forte"}
          - {left: "mild", right: "leggera"}
          - {left: "for three days", right: "da tre giorni"}
        status: "correct"
    feedback: "These words let you describe symptoms with duration and severity."
  it.a2.unit28.lesson01.exercise05.order_mal_gola:
    instruction: "Put the words in order to say 'I have a sore throat.'"
    accepted_answers: [{value: ["Ho", "mal", "di", "gola"], status: "correct"}]
    feedback: "The correct order is *Ho mal di gola.*"
  it.a2.unit28.lesson01.exercise06.fill_giorni:
    instruction: "Complete the sentence with the word for 'days.'"
    accepted_answers: [{value: "giorni", status: "correct"}]
    feedback: "*Da tre giorni* means 'for three days.'"
  it.a2.unit28.lesson01.exercise07.write_symptom_detail:
    instruction: "Write the taught symptom sentence: I have a sore throat for three days and a little fever."
    accepted_answers:
      - {value: "Ho mal di gola da tre giorni e ho un po' di febbre.", status: "correct"}
      - {value: "Ho mal di gola da tre giorni e ho un po di febbre", status: "acceptable_with_note", note: "Write *po'* with the apostrophe in careful Italian."}
    feedback: "The sentence gives symptom, duration, and severity."
  it.a2.unit28.lesson02.exercise01.choose_visit:
    instruction: "Which sentence asks to book a doctor's appointment?"
    correct_option: "Vorrei prenotare una visita."
    distractors: ["Vorrei aprire un conto.", "Vorrei registrare la residenza.", "Vorrei un biglietto."]
    accepted_answers: [{value: "Vorrei prenotare una visita.", status: "correct"}]
    feedback: "*Vorrei prenotare una visita* asks for a medical appointment."
  it.a2.unit28.lesson02.exercise02.listen_instructions:
    instruction: "Listen and select the doctor's instructions."
    correct_option: "Prenda questa medicina e beva molta acqua."
    distractors: ["Prenoti una visita e porti il modulo.", "Apra un conto e firmi qui.", "Paghi con la carta e prenda lo scontrino."]
    accepted_answers: [{value: "Prenda questa medicina e beva molta acqua.", status: "correct"}]
    feedback: "The doctor says to take the medicine and drink a lot of water."
  it.a2.unit28.lesson02.exercise03.choose_beva:
    instruction: "Which sentence means 'Drink a lot of water' in formal speech?"
    correct_option: "Beva molta acqua."
    distractors: ["Bevi molta acqua.", "Pago con la carta.", "Ho molta acqua."]
    accepted_answers: [{value: "Beva molta acqua.", status: "correct"}]
    feedback: "*Beva* is the formal instruction form."
  it.a2.unit28.lesson02.exercise04.match_doctor_exchange:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "What symptoms do you have?", right: "Che sintomi ha?"}
          - {left: "Take this medicine.", right: "Prenda questa medicina."}
          - {left: "Drink a lot of water.", right: "Beva molta acqua."}
          - {left: "I would like to book an appointment.", right: "Vorrei prenotare una visita."}
          - {left: "for three days", right: "da tre giorni"}
          - {left: "a little fever", right: "un po' di febbre"}
        status: "correct"
    feedback: "These phrases cover the appointment and the doctor's instructions."
  it.a2.unit28.lesson02.exercise05.order_prenda:
    instruction: "Put the words in order to say 'Take this medicine.'"
    accepted_answers: [{value: ["Prenda", "questa", "medicina"], status: "correct"}]
    feedback: "The correct order is *Prenda questa medicina.*"
  it.a2.unit28.lesson02.exercise06.reply_symptoms:
    instruction: "The doctor asks 'Che sintomi ha?' Reply with the taught sentence: I have a sore throat for three days and a little fever."
    accepted_answers:
      - {value: "Ho mal di gola da tre giorni e ho un po' di febbre.", status: "correct"}
      - {value: "Ho mal di gola da tre giorni e ho un po di febbre", status: "acceptable_with_note", note: "Write *po'* with the apostrophe in careful Italian."}
    feedback: "The reply gives symptom, duration, and severity."
  it.a2.unit28.lesson02.exercise07.write_appointment_request:
    instruction: "Write a formal message to the doctor: start with *Buongiorno*, request an appointment, say you have a sore throat for three days and a little fever, and end with *Grazie*."
    accepted_answers:
      - {value: "Buongiorno, vorrei prenotare una visita. Ho mal di gola da tre giorni e ho un po' di febbre. Grazie.", status: "correct"}
      - {value: "Buongiorno vorrei prenotare una visita ho mal di gola da tre giorni e ho un po di febbre grazie", status: "acceptable_with_note", note: "Write *po'* with the apostrophe in careful Italian."}
    feedback: "The message requests the appointment and describes the symptoms beforehand."
