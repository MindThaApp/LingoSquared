  it.a2.unit98.se_piove.lesson05.lettura.exercise01.leggi1: {"instruction": "Read the text and choose the answer.", "correct_option": "They stay at Giulia's place and watch a film.", "distractors": ["They go to the lake.", "They go to the shop.", "They take Marco's car."], "accepted_answers": [{"value": "They stay at Giulia's place and watch a film.", "status": "correct"}], "feedback": "*Se piove, restiamo da me.*"}
