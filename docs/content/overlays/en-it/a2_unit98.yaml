  it.a2.unit98.se_piove.lesson02.se_futuro.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Se domani piove, resterò a casa.", "status": "correct"}, {"value": "Se domani piove, resterò a casa", "status": "correct"}], "feedback": "*Se* + present, then the future.", "correct_option": "Se domani piove, resterò a casa."}
  it.a2.unit98.se_piove.lesson03.se_imperativo.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se hai fame, mangia qualcosa.", "distractors": ["Se hai fame, mangiare qualcosa.", "Se avere fame, mangia qualcosa.", "Se hai fame, mangiato qualcosa."], "accepted_answers": [{"value": "Se hai fame, mangia qualcosa.", "status": "correct"}], "feedback": "*Se* + present, imperative."}
  it.a2.unit98.se_piove.lesson03.se_imperativo.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se compri due magliette, la terza è gratis.", "distractors": ["Se comprare due magliette, la terza è gratis.", "Se compri due magliette, la terza essere gratis.", "Se comprato due magliette, la terza è gratis."], "accepted_answers": [{"value": "Se compri due magliette, la terza è gratis.", "status": "correct"}], "feedback": "*Se* + present, present."}
