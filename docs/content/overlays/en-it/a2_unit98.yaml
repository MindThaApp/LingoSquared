  it.a2.unit98.se_piove.lesson04.che_cosa_fai.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se perdo il treno, chiamo l'ufficio.", "distractors": ["Se perdere il treno, chiamo l'ufficio.", "Se perdo il treno, chiamare l'ufficio.", "Se perso il treno, chiamo l'ufficio."], "accepted_answers": [{"value": "Se perdo il treno, chiamo l'ufficio.", "status": "correct"}], "feedback": "*Se* + present, present."}
