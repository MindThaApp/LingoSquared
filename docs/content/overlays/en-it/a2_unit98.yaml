  it.a2.unit98.se_piove.lesson01.se_presente.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se fa caldo, andiamo al mare.", "distractors": ["Se fare caldo, andiamo al mare.", "Se fa caldo, andare al mare.", "Se fa caldo andiamo, al mare."], "accepted_answers": [{"value": "Se fa caldo, andiamo al mare.", "status": "correct"}], "feedback": "*Se* + present, present."}
  it.a2.unit98.se_piove.lesson01.se_presente.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Se piove, resto a casa.", "right": "If it rains, I stay at home."}, {"left": "Se fa caldo, andiamo al mare.", "right": "If it is hot, we go to the seaside."}, {"left": "Se sono stanco, dormo.", "right": "If I am tired, I sleep."}, {"left": "Se fa freddo, non andiamo al parco.", "right": "If it is cold, we do not go to the park."}, {"left": "Resto a casa se piove.", "right": "I stay at home if it rains."}, {"left": "se", "right": "if"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit98.se_piove.lesson01.se_presente.exercise04.ordina: {"instruction": "Put the words in order to say 'If it is hot, we go to the seaside.'", "correct_option": "Se fa caldo andiamo al mare", "accepted_answers": [{"value": "Se fa caldo andiamo al mare", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit98.se_piove.lesson01.se_presente.exercise05.completa: {"instruction": "Fill in the word that means 'if'.", "correct_option": "Se", "accepted_answers": [{"value": "Se", "status": "correct"}], "feedback": "*Se* means 'if'."}
  it.a2.unit98.se_piove.lesson01.se_presente.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Se fa freddo, non andiamo al parco.", "status": "correct"}, {"value": "Se fa freddo, non andiamo al parco", "status": "correct"}], "feedback": "*Se* + present."}
  it.a2.unit98.se_piove.lesson01.se_presente.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Se sono stanco, dormo.", "status": "correct"}, {"value": "Se sono stanco, dormo", "status": "correct"}, {"value": "Se sono stanca, dormo.", "status": "correct"}, {"value": "Se sono stanca, dormo", "status": "correct"}], "feedback": "*Se* + present.", "correct_option": "Se sono stanco, dormo."}
  it.a2.unit98.se_piove.lesson02.se_futuro.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se domani fa bel tempo, andremo al lago.", "distractors": ["Se domani fa bel tempo, andiamo lago al.", "Se domani fa bel tempo, andiamo lago al.", "Se domani fa bel tempo, andare al lago."], "accepted_answers": [{"value": "Se domani fa bel tempo, andremo al lago.", "status": "correct"}], "feedback": "After *se*, use the present."}
  it.a2.unit98.se_piove.lesson02.se_futuro.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Se piove, resterò a casa.", "distractors": ["Se piove, resterò casa a.", "Se piove, resteranno a casa.", "Se piove, restare a casa."], "accepted_answers": [{"value": "Se piove, resterò a casa.", "status": "correct"}], "feedback": "The condition is in the present, the result in the future."}
  it.a2.unit98.se_piove.lesson02.se_futuro.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Se domani fa bel tempo, andremo al lago.", "right": "If the weather is nice tomorrow, we will go to the lake."}, {"left": "Se piove, resterò a casa.", "right": "If it rains, I will stay at home."}, {"left": "Se domani piove, guarderemo un film.", "right": "If it rains tomorrow, we will watch a film."}, {"left": "Se Luca è libero, viene con noi.", "right": "If Luca is free, he is coming with us."}, {"left": "domani", "right": "tomorrow"}, {"left": "bel tempo", "right": "nice weather"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit98.se_piove.lesson02.se_futuro.exercise04.ordina: {"instruction": "Put the words in order to say 'If it rains, I will stay at home.'", "correct_option": "Se piove resterò a casa", "accepted_answers": [{"value": "Se piove resterò a casa", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit98.se_piove.lesson02.se_futuro.exercise05.completa: {"instruction": "Fill in the verb in the future: we will watch.", "correct_option": "guarderemo", "accepted_answers": [{"value": "guarderemo", "status": "correct"}], "feedback": "The result can be in the future."}
