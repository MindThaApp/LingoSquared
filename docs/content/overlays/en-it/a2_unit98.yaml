  it.a2.unit98.se_piove.lesson04.che_cosa_fai.exercise05.completa: {"instruction": "Fill in the verb: you do.", "correct_option": "fai", "accepted_answers": [{"value": "fai", "status": "correct"}], "feedback": "*Che cosa fai se...?*"}
