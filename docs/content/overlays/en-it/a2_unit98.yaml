course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit98.se_piove: {"title": "If it rains, I stay at home", "description": "Talk about real conditions with se + present followed by the present, the future or an imperative, for weather plans and shop policies."}
lessons:
  it.a2.unit98.se_piove.lesson01.se_presente: {"title": "If it rains, I stay at home"}
  it.a2.unit98.se_piove.lesson02.se_futuro: {"title": "If the weather is nice tomorrow, we will go to the park"}
  it.a2.unit98.se_piove.lesson03.se_imperativo: {"title": "If you are hungry, eat something"}
  it.a2.unit98.se_piove.lesson04.che_cosa_fai: {"title": "What do you do if...?"}
  it.a2.unit98.se_piove.lesson05.lettura: {"title": "A message for Saturday"}
  it.a2.unit98.se_piove.lesson06.giulia_e_marco: {"title": "Giulia and Marco make a plan"}
teaching:
  it.a2.unit98.se_piove.lesson01.teach.v_se: {"title": "If", "gloss": "if / it rains / it is hot / the sea / the park / we go / I sleep", "note": "*Se* means 'if' and is followed by the present.", "example_gloss": ["If it rains, I stay at home.", "If it is hot, we go to the seaside.", "If I am tired, I sleep.", "If it is cold, we do not go to the park.", "If it rains, I watch a film."]}
  it.a2.unit98.se_piove.lesson01.teach.se_presente: {"title": "Se + present, present", "gloss": "If it rains, I stay at home. If it is hot, we go to the seaside.", "note": "For a real, possible condition, both parts of the sentence are in the present."}
  it.a2.unit98.se_piove.lesson01.teach.se_ordine: {"title": "Either order", "gloss": "If it rains, I stay at home. I stay at home if it rains.", "note": "The *se* part can come first (with a comma) or second (no comma)."}
  it.a2.unit98.se_piove.lesson02.teach.v_bel_tempo: {"title": "Plans", "gloss": "tomorrow / nice weather / the lake / we will go / I will stay / we will watch a film", "note": "The main clause can be in the future.", "example_gloss": ["If the weather is nice tomorrow, we will go to the lake.", "If it rains, I will stay at home.", "If it rains tomorrow, we will watch a film.", "If Luca is free, he is coming with us."]}
  it.a2.unit98.se_piove.lesson02.teach.se_futuro: {"title": "Se + present, future", "gloss": "If the weather is nice tomorrow, we will go to the lake. If it rains, I will stay at home.", "note": "The condition stays in the present; the result can be in the future."}
  it.a2.unit98.se_piove.lesson02.teach.se_no_futuro: {"title": "Future or present?", "gloss": "If it rains tomorrow, we will watch a film. If it rains, we watch a film.", "note": "At this level, use the present after *se*. In the main clause, both the present and the future are fine."}
  it.a2.unit98.se_piove.lesson03.teach.v_negozio: {"title": "Advice and shop rules", "gloss": "the shop / the shirt / free / to be hungry / to change / something / come with us", "note": "After *se*, the main clause can be a command or a rule.", "example_gloss": ["If you are hungry, eat something.", "If you like, come with us.", "If you buy two shirts, the third is free.", "If you do not like it, you can change the shirt."]}
  it.a2.unit98.se_piove.lesson03.teach.se_imperativo: {"title": "Se + present, imperative", "gloss": "If you are hungry, eat something. If you like, come with us.", "note": "The main clause can be an informal command: *mangia*, *vieni*."}
  it.a2.unit98.se_piove.lesson03.teach.se_regole: {"title": "Shop policies", "gloss": "If you buy two shirts, the third is free. If you do not like it, you can change the shirt.", "note": "Shops state their rules with *se* + present, present or *puoi* + infinitive."}
  it.a2.unit98.se_piove.lesson04.teach.v_domande: {"title": "Asking about conditions", "gloss": "what do you do / what happens / you miss / the train / the work / I call / the office", "note": "*Che cosa fai se...?* asks about a possible situation.", "example_gloss": ["What do you do if it rains?", "What happens if you miss the train?", "If I miss the train, I call the office.", "If I do not come to work, I call Marco."]}
  it.a2.unit98.se_piove.lesson04.teach.che_cosa_se: {"title": "Question and answer", "gloss": "What do you do if it rains? If it rains, I stay at home.", "note": "Ask with *Che cosa fai se...?* and answer with *Se...*."}
  it.a2.unit98.se_piove.lesson04.teach.se_non: {"title": "Se non", "gloss": "If I do not come to work, I call Marco. If it does not rain, we go out.", "note": "*Se non* + present gives a negative condition."}
  it.a2.unit98.se_piove.lesson05.teach.sabato: {"title": "A message for Saturday", "gloss": "Hi everyone! On Saturday we go to the lake if the weather is nice. If it rains, we stay at my place and watch a film. If you are hungry, bring something to eat. If Luca comes, we take Marco's car. Giulia", "note": "Find each condition and what follows from it."}
  it.a2.unit98.se_piove.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Giulia, what are we doing on Saturday?"}
  it.a2.unit98.se_piove.lesson06.teach.d2: {"title": "Giulia suggests", "gloss": "Giulia: If the weather is nice, we go to the lake. If it rains, we stay at my place."}
  it.a2.unit98.se_piove.lesson06.teach.d3: {"title": "Marco asks", "gloss": "Marco: Perfect! And if Luca is free, does he come with us?"}
  it.a2.unit98.se_piove.lesson06.teach.d4: {"title": "Giulia answers", "gloss": "Giulia: Yes, if he has time. If he wants, he can bring something to eat."}
  it.a2.unit98.se_piove.lesson06.teach.d5: {"title": "Marco agrees", "gloss": "Marco: All right. If it rains tomorrow, I will call you."}
  it.a2.unit98.se_piove.lesson06.teach.d6: {"title": "Giulia confirms", "gloss": "Giulia: Great! If the weather is nice, we meet at nine."}
