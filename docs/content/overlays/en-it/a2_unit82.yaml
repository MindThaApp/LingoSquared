teaching:
  it.a2.unit82.lesson01.teach.la_vacanza_le:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*La vacanza* is the general word (usually plural, *le vacanze*, for a holiday period); *le vacanze estive* is the long summer break.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  it.a2.unit82.lesson01.teach.la_settimana_prossima:
    title: When something happens
    gloss: next week / next year / soon
    note: '*Prossimo* goes before or after the noun and agrees with it: *la settimana prossima*, *l''anno prossimo*. *Fra poco* means ''soon''.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Belgium.
    - Soon I have a holiday.
  it.a2.unit82.lesson01.teach.viaggiare_prenotare_restare:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: These are infinitives. *Prenotare* means to book (a hotel, a table, a ticket); *restare* means to stay.
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  it.a2.unit82.lesson01.teach.l_hotel_il:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*L''hotel* and *il campeggio* are both masculine. You sleep *in hotel* (or *in un hotel*) and *in campeggio*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  it.a2.unit82.lesson01.teach.che_cosa_fai:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Italian simply uses the present tense for plans: *Che cosa fai durante le vacanze estive?* No helper verb is needed.'
  it.a2.unit82.lesson01.teach.ad_agosto_viaggio:
    title: 'Near plans: present tense + time'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'To say what you are going to do soon, Italian uses the ordinary present tense, usually with a time expression: *Prenoto un hotel*, *La settimana prossima prenoto un hotel*. The time word can come first or last, and the verb form does not change.'
  it.a2.unit82.lesson01.teach.prenoto_un_hotel:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  it.a2.unit82.lesson02.teach.seguire_un_corso:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Seguire un corso* is the fixed phrase for taking a course. *Traslocare* is moving to a new home.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  it.a2.unit82.lesson02.teach.piu_tardi_tra:
    title: Further ahead
    gloss: later / in a month
    note: '*Tra un mese* means ''a month from now''. It works with other periods too: *tra una settimana*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  it.a2.unit82.lesson02.teach.tra_un_mese:
    title: A course that starts
    gloss: In a month my course starts.
  it.a2.unit82.lesson02.teach.ho_intenzione_di:
    title: 'Intentions: avere intenzione di + infinitive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *ho intenzione di* and then the infinitive: *Ho intenzione di seguire un corso*. Note that *di* comes directly before the infinitive. This is for things you want to do, not for fixed arrangements.'
  it.a2.unit82.lesson02.teach.ho_intenzione_di_2:
    title: Planning to move house
    gloss: I plan to move house.
  it.a2.unit82.lesson02.teach.ho_intenzione_di_3:
    title: Planning to save
    gloss: I plan to save money.
  it.a2.unit82.lesson02.teach.domani_vado_al:
    title: Present tense or avere intenzione di?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use the present tense for the near, settled future: *Domani vado al mercato*. Use *avere intenzione di* for an intention that is further away or less certain: *Più tardi ho intenzione di traslocare*.'
  it.a2.unit82.lesson03.teach.forse_sicuramente:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Forse* expresses doubt. *Sicuramente* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  it.a2.unit82.lesson03.teach.quest_anno_quest:
    title: This year, this summer
    gloss: this year / this summer
    note: '*Quest''anno* and *quest''estate* lose the final vowel of *questo/questa* before a vowel.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  it.a2.unit82.lesson03.teach.quest_estate_resto:
    title: Staying at home
    gloss: This summer I am staying at home.
  it.a2.unit82.lesson03.teach.domani_vado_a:
    title: Forse and the verb
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: 'After *forse* the verb stays in its ordinary present form and the word order does not change: *Forse vado al cinema più tardi*. Do not use the infinitive after *forse*. A time word like *domani* also changes nothing: *Domani lavoro*.'
  it.a2.unit82.lesson03.teach.non_vado_in:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *non* directly before the verb: *Non vado in vacanza*. With *avere intenzione di*, *non* goes before *ho*: *Non ho intenzione di traslocare*.'
  it.a2.unit82.lesson04.teach.con_chi_quanto:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Con chi* asks about a person you do something with. *Quanto tempo* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  it.a2.unit82.lesson04.teach.dove_vai:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Dove vai?* asks where you are going. The question word comes first, then the verb.'
  it.a2.unit82.lesson04.teach.con_chi_vai:
    title: Who with?
    gloss: Who are you going on holiday with?
  it.a2.unit82.lesson04.teach.quanto_tempo_resti:
    title: How long?
    gloss: How long are you staying there?
  it.a2.unit82.lesson04.teach.vado_con_mia:
    title: Answering
    gloss: I am going with my sister.
  it.a2.unit82.lesson04.teach.una_settimana_due:
    title: Weeks
    gloss: one week / two weeks
    note: The plural of *settimana* is *settimane*; *una settimana* but *due settimane*.
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  it.a2.unit82.lesson04.teach.dove_vai_con:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first, then the verb in the present tense: *Dove vai?*, *Con chi vai?*, *Quanto tempo resti?* No subject pronoun is needed, because the verb ending already shows who is meant.'
  it.a2.unit82.lesson05.teach.ciao_giulia_fra:
    title: A message from Nina
    gloss: Hi Giulia! Soon I have a holiday. In August I am going to Belgium with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Nina describes near plans with the present tense and a longer-term intention with *avere intenzione di*. Notice the infinitive right after *di*: *seguire*.'
    glosses:
      poco: soon
      vacanze: holiday
      agosto: August
      sorella: sister
      in: to
      belgio: Belgium
      hotel: hotel
      restiamo: to stay
      poi: after that
      genitori: parents
      giorni: days
      prossimo: next
      l'anno: year
      intenzione: intention (avere intenzione di = to plan to)
      corso: course
      seguire: to follow
      forse: maybe
      trasloco: to move house
      allora: then
      anche: also
  it.a2.unit82.lesson06.teach.ciao_marco_hai:
    title: Giulia asks Marco about his plans
    gloss: 'Giulia: Hi Marco! Do you have plans for the summer holiday yet?'
  it.a2.unit82.lesson06.teach.si_ad_agosto:
    title: Marco answers
    gloss: 'Marco: Yes! In August I am going to Germany. I am going to book a hotel.'
  it.a2.unit82.lesson06.teach.bello_con_chi:
    title: Giulia asks who he is going with
    gloss: 'Giulia: Nice! Who are you going with?'
  it.a2.unit82.lesson06.teach.con_mio_zio:
    title: Marco says who and how long
    gloss: 'Marco: With my uncle. We are going to stay for a week.'
  it.a2.unit82.lesson06.teach.e_dopo_che:
    title: Giulia asks about later
    gloss: 'Giulia: And later? What do you plan to do?'
  it.a2.unit82.lesson06.teach.l_anno_prossimo:
    title: Marco names an intention and asks back
    gloss: 'Marco: Next year I plan to take a course. And you?'
  it.a2.unit82.lesson06.teach.a_luglio_lavoro:
    title: Giulia answers
    gloss: 'Giulia: In July I am going to work. Maybe I will go to my parents'' after that.'
