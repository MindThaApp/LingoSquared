  it.a2.unit100.marco_dice_che.lesson05.lettura.exercise01.leggi1: {"instruction": "Read the text and choose the answer.", "correct_option": "That he is arriving at eight.", "distractors": ["That he is not coming.", "To call the office.", "That he is hungry."], "accepted_answers": [{"value": "That he is arriving at eight.", "status": "correct"}], "feedback": "*Dice che arriva alle otto.*"}
