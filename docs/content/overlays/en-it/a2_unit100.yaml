  it.a2.unit100.marco_dice_che.lesson01.dice_che.exercise05.completa: {"instruction": "Fill in the word that links the verb of saying to the message.", "correct_option": "che", "accepted_answers": [{"value": "che", "status": "correct"}], "feedback": "*Dice che* + clause."}
  it.a2.unit100.marco_dice_che.lesson01.dice_che.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Luca dice che non viene.", "status": "correct"}, {"value": "Luca dice che non viene", "status": "correct"}], "feedback": "*Dice che* + present."}
