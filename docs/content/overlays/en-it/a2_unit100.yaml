  it.a2.unit100.marco_dice_che.lesson06.giulia_e_luca.exercise01.capisci1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "At eight.", "distractors": ["At seven.", "At nine.", "Tomorrow."], "accepted_answers": [{"value": "At eight.", "status": "correct"}], "feedback": "She says *dice che arriva alle otto*."}
