  it.a2.unit100.marco_dice_che.lesson04.chi_dice_cosa.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia dice che mi chiama domani.", "distractors": ["Giulia dice che ti chiamo domani.", "Giulia dice che mi chiamo domani.", "Giulia dice che chiamare mi domani."], "accepted_answers": [{"value": "Giulia dice che mi chiama domani.", "status": "correct"}], "feedback": "*Ti chiamo* becomes *mi chiama*."}
