  it.a2.unit100.marco_dice_che.lesson01.dice_che.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Luca dice che non viene.", "distractors": ["Luca dice che non vengo.", "Luca dice non che viene.", "Luca dice che viene non."], "accepted_answers": [{"value": "Luca dice che non viene.", "status": "correct"}], "feedback": "*Dice che* + present."}
  it.a2.unit100.marco_dice_che.lesson01.dice_che.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Marco dice che arriva alle otto.", "right": "Marco says he is arriving at eight."}, {"left": "Giulia dice che sta bene.", "right": "Giulia says she is fine."}, {"left": "Luca dice che non viene.", "right": "Luca says he is not coming."}, {"left": "Che cosa dice Marco?", "right": "What does Marco say?"}, {"left": "dire", "right": "to say"}, {"left": "Arrivo alle otto.", "right": "I arrive at eight."}], "status": "correct"}], "feedback": "Match each expression."}
