course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit100.marco_dice_che: {"title": "Marco says he is arriving at eight", "description": "Pass on a simple message in the present tense with dice che, chiede se and dice di + infinitive, and change the person correctly."}
lessons:
  it.a2.unit100.marco_dice_che.lesson01.dice_che: {"title": "Marco says that..."}
  it.a2.unit100.marco_dice_che.lesson02.chiede_se: {"title": "Giulia asks if..."}
  it.a2.unit100.marco_dice_che.lesson03.dice_di: {"title": "He says to wait"}
  it.a2.unit100.marco_dice_che.lesson04.chi_dice_cosa: {"title": "I, you, he"}
  it.a2.unit100.marco_dice_che.lesson05.lettura: {"title": "Today's messages"}
  it.a2.unit100.marco_dice_che.lesson06.giulia_e_luca: {"title": "Giulia and Luca: the messages"}
teaching:
  it.a2.unit100.marco_dice_che.lesson01.teach.v_dire: {"title": "Reporting", "gloss": "to say / says / that / arrives / at eight / is well / is not coming", "note": "*Dice che* + a clause passes on what someone says.", "example_gloss": ["Marco says he is arriving at eight.", "Giulia says she is fine.", "Luca says he is not coming.", "What does Marco say?"]}
  it.a2.unit100.marco_dice_che.lesson01.teach.dice_che: {"title": "Dice che + present", "gloss": "Marco says he is arriving at eight. Giulia says she is fine.", "note": "After *dice che* the verb is in the present, as in the original message."}
  it.a2.unit100.marco_dice_che.lesson01.teach.persona: {"title": "Change of person", "gloss": "Marco: I arrive at eight. Marco says he arrives at eight.", "note": "The person changes: *arrivo* (I) becomes *arriva* (he)."}
  it.a2.unit100.marco_dice_che.lesson02.teach.v_chiede: {"title": "Passing on a question", "gloss": "to ask / asks / you are hungry / you can / to call / the train / it leaves at nine", "note": "*Chiede se* passes on a yes/no question.", "example_gloss": ["Giulia asks if you are hungry.", "Marco asks if the train leaves at nine.", "Luca asks if you can call.", "What does Giulia ask?"]}
  it.a2.unit100.marco_dice_che.lesson02.teach.chiede_se: {"title": "Chiede se + present", "gloss": "Giulia asks if you are hungry. Marco asks if the train leaves at nine.", "note": "To pass on a yes/no question, use *chiede se* and the present."}
  it.a2.unit100.marco_dice_che.lesson02.teach.domanda_diretta: {"title": "Question to report", "gloss": "Are you hungry? Giulia asks if you are hungry.", "note": "The question mark disappears and the word order stays the same."}
  it.a2.unit100.marco_dice_che.lesson03.teach.v_aspettare: {"title": "Passing on an instruction", "gloss": "to wait / here / Mr Rossi / the office / tomorrow / to buy bread", "note": "To pass on an instruction, use *dice di* + infinitive.", "example_gloss": ["Marco says to wait here.", "Giulia says not to wait.", "Mr Rossi says to call the office.", "Luca says to buy bread."]}
  it.a2.unit100.marco_dice_che.lesson03.teach.dice_di: {"title": "Dice di + infinitive", "gloss": "Marco says to wait here. Luca says to buy bread.", "note": "Learn *dice di* + infinitive as one phrase for a reported command or request."}
  it.a2.unit100.marco_dice_che.lesson03.teach.dice_di_non: {"title": "Dice di non", "gloss": "Giulia says not to wait. Mr Rossi says not to call.", "note": "*Non* goes before the infinitive."}
  it.a2.unit100.marco_dice_che.lesson03.teach.che_o_di: {"title": "Che or di?", "gloss": "Marco says that he arrives. Marco says to wait.", "note": "*Dice che* + clause reports a fact; *dice di* + infinitive reports an instruction."}
  it.a2.unit100.marco_dice_che.lesson04.teach.v_persone: {"title": "Who is speaking", "gloss": "me / you / I am hungry / I write / he phones / tomorrow", "note": "When you pass on a message, check who 'I' and 'you' are now.", "example_gloss": ["Giulia says she will call me tomorrow.", "Marco says I am hungry.", "I write to Marco that I am hungry.", "Luca phones: he says he is arriving late."]}
  it.a2.unit100.marco_dice_che.lesson04.teach.io_lui: {"title": "Ti becomes mi", "gloss": "Giulia: I will call you tomorrow. Giulia says she will call me tomorrow.", "note": "If Giulia says *ti chiamo* to you, you report it as *mi chiama*."}
  it.a2.unit100.marco_dice_che.lesson04.teach.scrivo_che: {"title": "Writing and phoning", "gloss": "I write to Marco that I am hungry. Luca phones: he says he is arriving late.", "note": "*Scrivo a... che...* also passes on a message. The colon after *telefona* introduces what he says."}
  it.a2.unit100.marco_dice_che.lesson05.teach.messaggi: {"title": "Today's messages", "gloss": "Hi Luca, here are today's messages. Marco phones: he says he is arriving at eight and asks if you are hungry. Mr Rossi says to call the office tomorrow. I am going out at seven and coming back late. Giulia", "note": "Find who says what, and who asks what."}
  it.a2.unit100.marco_dice_che.lesson06.teach.d1: {"title": "Luca asks", "gloss": "Luca: Giulia, are there any messages for me?"}
  it.a2.unit100.marco_dice_che.lesson06.teach.d2: {"title": "Giulia reports", "gloss": "Giulia: Yes. Marco phones: he says he is arriving at eight."}
  it.a2.unit100.marco_dice_che.lesson06.teach.d3: {"title": "Luca asks", "gloss": "Luca: And does he ask anything?"}
  it.a2.unit100.marco_dice_che.lesson06.teach.d4: {"title": "Giulia reports more", "gloss": "Giulia: He asks if you are hungry. And Mr Rossi says to call the office tomorrow."}
  it.a2.unit100.marco_dice_che.lesson06.teach.d5: {"title": "Luca answers", "gloss": "Luca: All right. I will write to Marco that I am hungry!"}
  it.a2.unit100.marco_dice_che.lesson06.teach.d6: {"title": "Giulia adds", "gloss": "Giulia: Perfect! Marco also says he is bringing bread."}
exercises:
