  it.a2.unit100.marco_dice_che.lesson02.chiede_se.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia chiede se hai fame.", "distractors": ["Giulia chiede che hai fame.", "Giulia chiede se avere fame.", "Giulia chiede hai se fame."], "accepted_answers": [{"value": "Giulia chiede se hai fame.", "status": "correct"}], "feedback": "*Chiede se* + clause."}
