course:
  title: "Italian A2"
  description: "Learn A2-level Italian for everyday administrative, service, and work situations, with detailed English explanations."
units:
  it.a2.unit29.guasto_in_casa: {title: "A problem at home"}
lessons:
  it.a2.unit29.lesson01.problema: {title: "The problem"}
  it.a2.unit29.lesson02.riparazione: {title: "The repair"}
teaching:
  it.a2.unit29.lesson01.teach_perdita_bagno: {title: "una perdita d'acqua, il bagno", gloss: "a water leak, the bathroom", note: "*Perdita* means leak/loss; with water, use *perdita d'acqua*. Do not say *leak di acqua*.", example_gloss: ["There is a water leak.", "The problem is in the bathroom."]}
  it.a2.unit29.lesson01.teach_lavandino_pavimento: {title: "il lavandino, il pavimento", gloss: "sink, floor", note: "*Lavandino* is the bathroom or kitchen sink; *pavimento* is the floor you walk on.", example_gloss: ["The water comes out of the sink.", "The floor is wet."]}
  it.a2.unit29.lesson01.teach_ce_una_perdita: {title: "C'è una perdita d'acqua.", gloss: "There is a water leak.", note: "*C'è* introduces a problem that exists in the home.", example_gloss: ["There is a water leak in the kitchen."]}
  it.a2.unit29.lesson01.teach_pavimento_bagnato: {title: "Il pavimento è bagnato.", gloss: "The floor is wet.", note: "*Bagnato* is masculine singular because it describes *il pavimento*.", example_gloss: ["The floor is wet in the bathroom."]}
  it.a2.unit29.lesson02.teach_mi_dica: {title: "Mi dica.", gloss: "Tell me. / Go ahead.", note: "In service calls, *Mi dica* is a formal way to invite the caller to explain the problem.", example_gloss: ["Good morning, go ahead."]}
  it.a2.unit29.lesson02.teach_il_tecnico: {title: "il tecnico, la riparazione", gloss: "technician, repair", note: "*Tecnico* is the person who comes; *riparazione* is the repair.", example_gloss: ["The technician is coming tomorrow.", "The repair is urgent."]}
  it.a2.unit29.lesson02.teach_quando_puo_venire: {title: "Quando può venire il tecnico?", gloss: "When can the technician come?", note: "*Può* is the formal 'can' form. The informal form is *puoi*.", example_gloss: ["Excuse me, when can the technician come?"]}
  it.a2.unit29.lesson02.teach_domani_mattina: {title: "domani mattina alle nove", gloss: "tomorrow morning at nine", note: "Use *alle* with clock times: *alle nove*.", example_gloss: ["The technician is coming tomorrow morning at nine."]}
exercises:
  it.a2.unit29.lesson01.exercise01.choose_perdita:
    instruction: "Which phrase means 'a water leak'?"
    correct_option: "una perdita d'acqua"
    distractors: ["il codice fiscale", "la carta inclusa", "mal di gola"]
    accepted_answers: [{value: "una perdita d'acqua", status: "correct"}]
    feedback: "*Una perdita d'acqua* is a water leak."
  it.a2.unit29.lesson01.exercise02.listen_perdita:
    instruction: "Listen and select the problem you hear."
    correct_option: "C'è una perdita d'acqua in bagno."
    distractors: ["C'è un problema con la carta.", "La finestra è rotta in cucina.", "Il riscaldamento non funziona."]
    accepted_answers: [{value: "C'è una perdita d'acqua in bagno.", status: "correct"}]
    feedback: "The recording reports a water leak in the bathroom."
  it.a2.unit29.lesson01.exercise03.choose_pavimento:
    instruction: "Which sentence says the floor is wet?"
    correct_option: "Il pavimento è bagnato."
    distractors: ["Il lavandino è nuovo.", "Il bagno è vicino.", "Il tecnico è pronto."]
    accepted_answers: [{value: "Il pavimento è bagnato.", status: "correct"}]
    feedback: "*Il pavimento è bagnato* describes the result of the leak."
  it.a2.unit29.lesson01.exercise04.match_house_problem:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "water leak", right: "una perdita d'acqua"}
          - {left: "bathroom", right: "il bagno"}
          - {left: "sink", right: "il lavandino"}
          - {left: "floor", right: "il pavimento"}
          - {left: "wet", right: "bagnato"}
          - {left: "There is a leak.", right: "C'è una perdita."}
        status: "correct"
    feedback: "These phrases describe the household problem."
  it.a2.unit29.lesson01.exercise05.order_perdita:
    instruction: "Put the words in order to say 'There is a water leak.'"
    accepted_answers: [{value: ["C'è", "una", "perdita", "d'acqua"], status: "correct"}]
    feedback: "The correct order is *C'è una perdita d'acqua.*"
  it.a2.unit29.lesson01.exercise06.fill_bagnato:
    instruction: "Complete the sentence with the word for 'wet.'"
    accepted_answers: [{value: "bagnato", status: "correct"}]
    feedback: "*Bagnato* describes *il pavimento* here."
  it.a2.unit29.lesson01.exercise07.write_problem:
    instruction: "Write the taught problem report: there is a water leak in the bathroom and the floor is wet."
    accepted_answers:
      - {value: "C'è una perdita d'acqua in bagno e il pavimento è bagnato.", status: "correct"}
      - {value: "C'è una perdita d'acqua in bagno e il pavimento è bagnato", status: "correct"}
    feedback: "The sentence reports the problem and its result."
  it.a2.unit29.lesson02.exercise01.choose_tecnico:
    instruction: "Which word means 'the technician'?"
    correct_option: "il tecnico"
    distractors: ["il medico", "il barista", "il passante"]
    accepted_answers: [{value: "il tecnico", status: "correct"}]
    feedback: "*Il tecnico* is the repair person."
  it.a2.unit29.lesson02.exercise02.listen_tecnico:
    instruction: "Listen and select the repair timing."
    correct_option: "Il tecnico può venire domani mattina."
    distractors: ["Il medico può chiamare stasera.", "La banca apre venerdì.", "Il comune chiude alle tre."]
    accepted_answers: [{value: "Il tecnico può venire domani mattina.", status: "correct"}]
    feedback: "The technician can come tomorrow morning."
  it.a2.unit29.lesson02.exercise03.choose_when:
    instruction: "Which question asks about repair timing?"
    correct_option: "Quando può venire il tecnico?"
    distractors: ["Quanto costa la carta?", "Dov'è la metropolitana?", "Come si chiama il medico?"]
    accepted_answers: [{value: "Quando può venire il tecnico?", status: "correct"}]
    feedback: "*Quando può venire il tecnico?* asks when the repair person can come."
  it.a2.unit29.lesson02.exercise04.match_repair:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "Tell me.", right: "Mi dica."}
          - {left: "technician", right: "il tecnico"}
          - {left: "repair", right: "la riparazione"}
          - {left: "When can the technician come?", right: "Quando può venire il tecnico?"}
          - {left: "tomorrow morning", right: "domani mattina"}
          - {left: "at nine", right: "alle nove"}
        status: "correct"
    feedback: "These phrases arrange the repair."
  it.a2.unit29.lesson02.exercise05.order_when_tecnico:
    instruction: "Put the words in order to ask 'When can the technician come?'"
    accepted_answers: [{value: ["Quando", "può", "venire", "il", "tecnico"], status: "correct"}]
    feedback: "The correct order is *Quando può venire il tecnico?*"
  it.a2.unit29.lesson02.exercise06.reply_repair_time:
    instruction: "The building manager says 'Ho capito, c'è una perdita d'acqua.' Ask when the technician can come."
    accepted_answers:
      - {value: "Quando può venire il tecnico?", status: "correct"}
      - {value: "Quando può venire il tecnico", status: "correct"}
    feedback: "*Quando può venire il tecnico?* asks for the repair timing."
  it.a2.unit29.lesson02.exercise07.write_problem_report:
    instruction: "Write a formal message: start with *Buongiorno*, report a water leak in the bathroom, say the floor is wet, ask when the technician can come, and end with *Grazie*."
    accepted_answers:
      - {value: "Buongiorno, c'è una perdita d'acqua in bagno e il pavimento è bagnato. Quando può venire il tecnico? Grazie.", status: "correct"}
      - {value: "Buongiorno c'è una perdita d'acqua in bagno e il pavimento è bagnato quando può venire il tecnico grazie", status: "correct"}
    feedback: "The message reports the household problem and asks about repair timing."
