teaching:
  it.a2.unit81.lesson01.teach.il_fine_settimana:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Il fine settimana* is masculine (many Italians also say *il weekend*). *Il fine settimana scorso* means the weekend that has just passed, so it is the natural phrase for ''last weekend'' when you tell a story about it.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  it.a2.unit81.lesson01.teach.sabato_domenica:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: 'Day names are not capitalised in Italian unless they start a sentence: *sabato*, *domenica*. With the article, *la domenica* means ''on Sundays''.'
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  it.a2.unit81.lesson01.teach.fare_la_spesa:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Fare la spesa* is the fixed phrase for doing the shopping, usually for food. *La spesa* stays singular in this phrase.'
    example_gloss: Every Saturday I do the shopping.
  it.a2.unit81.lesson01.teach.andare_a_trovare:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Andare a trovare* + a person means to visit someone: *andare a trovare mio zio*. It is a movement verb, so it uses *essere* in the passato prossimo.'
    example_gloss: I often go and visit my uncle.
  it.a2.unit81.lesson01.teach.il_mercato_il:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Il mercato*, *il parco* and *il cinema* are all masculine. After *a* and *in* they merge with the article: *al mercato*, *al cinema*, *nel parco*.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  it.a2.unit81.lesson01.teach.lavorare_cucinare_mangiare:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  it.a2.unit81.lesson01.teach.che_cosa_hai:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Fatto* is the participle of *fare*, and it follows *hai* directly.
  it.a2.unit81.lesson01.teach.sabato_ho_fatto:
    title: 'The passato prossimo: avere/essere + participle'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'The *passato prossimo* is the everyday way to talk about what you did. It has two parts: a present-tense form of *avere* or *essere*, followed directly by the *participio passato* (*fatto*, *andato*). The subject pronoun is usually left out: *Ho fatto la spesa.* Most verbs use *avere*; *andare* uses *essere*. Lesson 3 explains when.'
  it.a2.unit81.lesson02.teach.ballare_giocare_nuotare:
    title: Four weekend activities
    gloss: to dance / to play / to swim / to sing
    note: '*Giocare* takes *a* for games and sports (*giocare a calcio*); for instruments Italian uses *suonare*. *Ballare*, *nuotare* and *cantare* are regular *-are* verbs.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  it.a2.unit81.lesson02.teach.lavorare_lavorato_cucinare:
    title: 'Regular participles: -are → -ato, -ere → -uto, -ire → -ito'
    gloss: work → worked, cook → cooked, dance → danced, play → played, finish → finished, sell → sold
    note: 'Regular verbs build the participle from the infinitive: *-are* becomes *-ato* (*lavorare → lavorato*, *cucinare → cucinato*, *ballare → ballato*, *giocare → giocato*), *-ire* becomes *-ito* (*finire → finito*) and *-ere* becomes *-uto* (*vendere → venduto*). Verbs in *-are* are by far the biggest group.'
  it.a2.unit81.lesson02.teach.finisco_ho_finito:
    title: Verbs in -ire and -ere
    gloss: I finish. I have finished / I finished.
    note: 'Verbs in *-ire* take *-ito* and verbs in *-ere* take *-uto*, never *-ato*: *Finisco → Ho finito*, *Vendo → Ho venduto*, not *finato*.'
  it.a2.unit81.lesson02.teach.ho_fatto_una:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Fare una passeggiata* is the fixed phrase for taking a walk. *Fare* is irregular: its participle is *fatto*.'
  it.a2.unit81.lesson02.teach.ho_giocato_a:
    title: Playing football
    gloss: I played football.
    note: 'For games and sports you use *giocare a*: *giocare a calcio*. The participle is *giocato*.'
  it.a2.unit81.lesson03.teach.avere_essere:
    title: The two auxiliaries
    gloss: to have / to be
    note: 'In the passato prossimo, *avere* and *essere* are the helper verbs. Their present forms: *ho, sono*; *ha, è*; *hai, sei*.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  it.a2.unit81.lesson03.teach.vedere_visto_leggere:
    title: 'Irregular participles: learn them as whole words'
    gloss: see → seen, read → read, do → done, take → taken, write → written, drink → drunk, have → had
    note: 'Many common verbs have an irregular participle that you learn as a whole word: *visto, letto, fatto, preso, scritto, bevuto, avuto*. Many follow the pattern of *-to* or *-so* added to a shortened stem. A good habit is to learn each participle together with its infinitive.'
  it.a2.unit81.lesson03.teach.ho_visto_un:
    title: Watching a film
    gloss: I saw a film.
    note: Italian says *vedere un film* for going to the cinema or for watching at home. *Vedere* has the irregular participle *visto*.
  it.a2.unit81.lesson03.teach.ho_dormito_a:
    title: Two participles in one sentence
    gloss: I slept for a long time and read a book.
    note: 'Each verb keeps its own helper verb, and you repeat it: *Ho dormito a lungo e ho letto un libro.* *A lungo* means ''for a long time''.'
  it.a2.unit81.lesson03.teach.sono_andato_a:
    title: 'Visiting: andare a trovare'
    gloss: I visited my uncle.
    note: '*Andare a trovare* is a movement verb, so it uses *essere*: *Sono andato a trovare mio zio.* It means nearly the same as *Sono andato da mio zio*.'
  it.a2.unit81.lesson03.teach.ho_visto_un_2:
    title: Avere or essere?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I arrived late. I left early.
    note: '*Avere* is the default helper: *Ho lavorato, ho visto un film*. Use *essere* for verbs of movement and change, such as *andare, venire, arrivare, partire, rimanere*, and for reflexive verbs. With *essere* the participle agrees with the subject in gender and number: *Sono andato* (a man), *Sono andata* (a woman), *Siamo andati*. With *avere* the participle does not agree with the subject: *Ho visto*, whoever speaks. Careful: *essere* itself takes *essere*: *È stato un bel weekend*.'
  it.a2.unit81.lesson03.teach.andare_andato_venire:
    title: Verbs of movement and change (with essere)
    gloss: go → gone, come → come, stay → stayed, become → become, be → been
    note: 'These five verbs form the passato prossimo with *essere*: *sono andato, sono venuto, sono rimasto, sono partito, sono arrivato*. A woman ends the participle in *-a*: *sono andata, sono rimasta*.'
  it.a2.unit81.lesson04.teach.prima_poi:
    title: First and then
    gloss: first / after that
    note: '*Prima* and *poi* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  it.a2.unit81.lesson04.teach.prima_sono_andato:
    title: 'Telling it in order: prima, poi'
    gloss: First I went to the market, then I cooked.
    note: 'After *prima* or *poi* the word order does not change: helper verb, then participle, with the subject usually left out. *Poi ho cucinato.* The participle stays right after the helper verb.'
  it.a2.unit81.lesson04.teach.non_ho_lavorato:
    title: 'Saying what you did not do: non'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'In the passato prossimo, *non* goes directly before the helper verb: *Non ho lavorato*, *Non sono andato da mio zio*. Nothing comes between the helper verb and the participle.'
  it.a2.unit81.lesson04.teach.non_ho_bevuto:
    title: 'Saying you had none: nessun'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'To say ''no'' or ''not any'' after *non*, use *nessun* + a singular noun: *Non ho visto nessun film*, *Non ho bevuto nessun caffè*. It works like *un* (*nessuna* with a feminine noun). Some nouns take no article at all after *non*: *Non ho avuto tempo*. *Avuto* is the participle of *avere*.'
  it.a2.unit81.lesson04.teach.hai_fatto_sport:
    title: Giulia asks about exercise
    gloss: 'Giulia: Did you exercise?'
    note: 'In a spoken question the word order is the same as in a statement: *Hai fatto sport?* Only the rising voice shows it is a question.'
  it.a2.unit81.lesson04.teach.no_non_ho:
    title: Marco says no
    gloss: 'Marco: No, I didn''t exercise.'
  it.a2.unit81.lesson05.teach.ciao_giulia_e:
    title: A message from Nina
    gloss: Hi Giulia! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Nina is telling Giulia about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Notice that she writes *sono andata* and *sono rimasta*: with *essere* the participle agrees with the speaker. *Nel pomeriggio* and *la sera* mean ''in the afternoon'' and ''in the evening''. *È stato* (from *essere*) also takes *essere*.'
    glosses:
      Ciao: hi
      tranquillo: quiet, calm
      settimana: week (il fine settimana = the weekend)
      stato: been (participle of essere)
      mattina: morning (sabato mattina = Saturday morning)
      mercato: market
      pane: bread
      comprato: bought (participle of comprare)
      pomeriggio: afternoon (nel pomeriggio = in the afternoon)
      parco: park
      passeggiata: walk (fare una passeggiata = to take a walk)
      sera: evening (la sera = in the evening)
      cucinato: cooked (participle of cucinare)
      non: not
      sport: sport (fare sport = to exercise)
      nessun: no, not any
      film: film
      visto: seen (participle of vedere)
      Domenica: Sunday
      rimasta: stayed (participle of rimanere)
      lungo: long, for a long time
      dormito: slept (participle of dormire)
      libro: book
      letto: read (participle of leggere)
  it.a2.unit81.lesson06.teach.ciao_marco_che:
    title: Giulia asks Marco about his weekend
    gloss: 'Giulia: Hi Marco! What did you do last weekend?'
  it.a2.unit81.lesson06.teach.sabato_sono_andato:
    title: Marco describes Saturday
    gloss: 'Marco: On Saturday I went to my uncle''s in Torino. I ate at my uncle''s.'
    note: '*Da mio zio* means both ''at my uncle''s place'' and ''to my uncle''s'': *da* + a person is how Italian says ''at/to someone''s home''.'
  it.a2.unit81.lesson06.teach.bello_e_domenica:
    title: Giulia asks about Sunday
    gloss: 'Giulia: Nice! And Sunday?'
  it.a2.unit81.lesson06.teach.domenica_sono_rimasto:
    title: Marco describes Sunday and asks back
    gloss: 'Marco: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  it.a2.unit81.lesson06.teach.sono_andata_dai:
    title: Giulia describes her weekend
    gloss: 'Giulia: I went to my parents''. I didn''t do any shopping, but I cooked.'
