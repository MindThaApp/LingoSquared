  it.a1.unit04.calendar_dates: {title: "Days and dates"}

lessons:
  it.a1.unit04.lesson01.i_giorni_della_settimana: {title: "The days of the week"}
  it.a1.unit04.lesson02.che_data_e_oggi: {title: "What's the date today?"}
  it.a1.unit04.lesson03.quando_arrivi_a_roma: {title: "Making plans: when do you arrive?"}

teaching:
  it.a1.unit04.lesson01.teach.giorni_lun_mer: {title: "lunedì, martedì, mercoledì", gloss: "Monday, Tuesday, Wednesday", note: "The first three days of the Italian week. The Italian week starts on Monday, not Sunday.", example_gloss: ["I work in the office on Monday."]}
  it.a1.unit04.lesson01.teach.giorni_gio_dom: {title: "giovedì, venerdì, sabato, domenica", gloss: "Thursday, Friday, Saturday, Sunday", note: "The remaining four days of the week, completing the full list.", example_gloss: ["I don't work on Sundays."]}
  it.a1.unit04.lesson01.teach.che_giorno_e_oggi: {title: "Che giorno è oggi?", gloss: "What day is it today?", note: "The standard way to ask which day of the week it is."}
  it.a1.unit04.lesson01.teach.oggi_e_giovedi: {title: "Oggi è giovedì.", gloss: "Today is Thursday.", note: "*Oggi* (today) + *è* (is) + the day name answers the question directly."}
  it.a1.unit04.lesson01.teach.domani_e_venerdi: {title: "Domani è venerdì.", gloss: "Tomorrow is Friday.", note: "*Domani* (tomorrow) follows the same pattern as *oggi* for naming a day."}
  it.a1.unit04.lesson02.teach.che_data_e_oggi: {title: "Che data è oggi?", gloss: "What's the date today?", note: "*Che data* (what date) is used instead of *che giorno* when asking for the calendar date, not the weekday."}
  it.a1.unit04.lesson02.teach.mesi_gen_apr: {title: "gennaio, febbraio, marzo, aprile", gloss: "January, February, March, April", note: "The first four months of the year in Italian; all months are lowercase.", example_gloss: ["Today is January fifth."]}
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio: {title: "Oggi è il cinque gennaio.", gloss: "Today is January fifth.", note: "Italian dates use *il* + the day number + the month name, with no ordinal suffix like English 'fifth' -- just the plain number *cinque*. The one exception is the 1st of the month, which uses the ordinal *primo* (*il primo gennaio*)."}
  it.a1.unit04.lesson02.teach.il_giorno_del_mese: {title: "il quindici marzo", gloss: "March fifteenth", note: "Another example of the day + month pattern, showing it works the same way for any date."}
  it.a1.unit04.lesson03.teach.quando_arrivi: {title: "Quando arrivi a Roma?", gloss: "When do you arrive in Rome?", note: "*Quando* (when) + *arrivi* (you arrive, informal) asks about a future arrival."}
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio: {title: "Arrivo giovedì pomeriggio.", gloss: "I arrive Thursday afternoon.", note: "*Arrivo* (I arrive) + day + time-of-day gives a complete answer about when you'll arrive."}
  it.a1.unit04.lesson03.teach.parti_di_domani: {title: "oggi, domani, dopodomani", gloss: "today, tomorrow, the day after tomorrow", note: "*Dopodomani* is a single word for 'the day after tomorrow' -- literally *dopo* (after) + *domani* (tomorrow).", example_gloss: ["The day after tomorrow is Saturday."]}
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi: {title: "Ci vediamo giovedì!", gloss: "See you Thursday!", note: "A friendly way to close an exchange after agreeing on a day to meet."}

exercises:
  it.a1.unit04.lesson01.exercise01.choose_day:
    instruction: "Which day comes after Wednesday?"
    correct_option: "giovedì"
    distractors: ["lunedì", "martedì", "venerdì"]
    accepted_answers: [{value: "giovedì", status: "correct"}]
    feedback: "*giovedì* (Thursday) comes right after *mercoledì* (Wednesday)."
  it.a1.unit04.lesson01.exercise02.listen_days:
    instruction: "Listen and select the days you hear, in order."
    correct_option: "lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica"
    distractors: ["domenica, sabato, venerdì, giovedì, mercoledì, martedì, lunedì", "lunedì, mercoledì, venerdì, domenica", "martedì, giovedì, sabato"]
    accepted_answers: [{value: "lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica", status: "correct"}]
    feedback: "The recording lists all seven days of the week, in order starting with Monday."
  it.a1.unit04.lesson01.exercise03.choose_weekend:
    instruction: "Which day is a weekend day?"
    correct_option: "sabato"
    distractors: ["lunedì", "mercoledì", "giovedì"]
    accepted_answers: [{value: "sabato", status: "correct"}]
    feedback: "*sabato* (Saturday) is a weekend day."
  it.a1.unit04.lesson01.exercise04.match_days_order:
    instruction: "Match each number to the day of the week."
    accepted_answers:
      - value:
          - {left: "1", right: "lunedì"}
          - {left: "2", right: "martedì"}
          - {left: "3", right: "mercoledì"}
          - {left: "4", right: "giovedì"}
          - {left: "5", right: "venerdì"}
          - {left: "6", right: "sabato"}
          - {left: "7", right: "domenica"}
        status: "correct"
    feedback: "The Italian week runs 1=lunedì through 7=domenica, starting on Monday."
  it.a1.unit04.lesson01.exercise05.order_che_giorno_e_oggi:
    instruction: "Put the words in the correct order to ask 'What day is it today?'"
    accepted_answers: [{value: ["Che", "giorno", "è", "oggi"], status: "correct"}]
    feedback: "The correct order is *Che giorno è oggi?*"
  it.a1.unit04.lesson01.exercise06.listen_select_oggi_domani:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Oggi è giovedì."
    distractors: ["Oggi è venerdì.", "Domani è venerdì.", "Oggi è lunedì."]
    accepted_answers: [{value: "Oggi è giovedì.", status: "correct"}]
    feedback: "*Oggi è giovedì.* means 'Today is Thursday.'"
  it.a1.unit04.lesson01.exercise07.write_days:
    instruction: "Write the seven days of the week in Italian."
    accepted_answers:
      - {value: "lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica", status: "correct"}
      - {value: "lunedì martedì mercoledì giovedì venerdì sabato domenica", status: "correct"}
    feedback: "The seven days: lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica."

