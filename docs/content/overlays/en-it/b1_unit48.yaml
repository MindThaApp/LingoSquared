  it.b1.unit48.lesson02.teach_forse_restero: {title: "forse resterò un mese in più", gloss: "maybe I'll stay one more month", note: "*Forse* + futuro semplice marks a less certain prediction than *probabilmente*.", example_gloss: ["It isn't certain, but maybe I'll stay one more month."]}
