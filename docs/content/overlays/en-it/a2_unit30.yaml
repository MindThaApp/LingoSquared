teaching:
  it.a2.unit30.lesson01.teach_esperienza_ingegnere: {title: "l'esperienza, l'ingegnere", gloss: "experience, engineer", note: "*Esperienza* is feminine. *Ingegnere* is Sam's established job in this course.", example_gloss: ["I have office experience.", "Sam is an engineer."]}
  it.a2.unit30.lesson01.teach_gruppo_disponibile: {title: "il gruppo, disponibile", gloss: "group/team, available", note: "*In gruppo* is the natural phrase for working in a team. *Disponibile* works for availability.", example_gloss: ["I work well in a team.", "I am available from Monday."]}
  it.a2.unit30.lesson01.teach_refresher_lunedi: {title: "da lunedì", gloss: "from Monday", note: "*Da* + a day marks a starting point: *da lunedì* = from Monday (onwards).", example_gloss: ["I am available from Monday."]}
  it.a2.unit30.lesson01.teach_ho_esperienza: {title: "Ho esperienza come ingegnere.", gloss: "I have experience as an engineer.", note: "Italian uses *come* for 'as' in a role: *come ingegnere*.", example_gloss: ["I have experience as an engineer in Milan."]}
  it.a2.unit30.lesson01.teach_lavoro_bene: {title: "Lavoro bene in gruppo.", gloss: "I work well in a team.", note: "*Bene* goes after the verb here: *lavoro bene*.", example_gloss: ["I work well in a team and speak Italian."]}
  it.a2.unit30.lesson02.teach_mi_parli: {title: "Mi parli della sua esperienza.", gloss: "Tell me about your experience.", note: "*Sua* is formal 'your.' This is the interviewer's formal Lei register.", example_gloss: ["Tell me about your experience, please."]}
  it.a2.unit30.lesson02.teach_quando_disponibile: {title: "Quando è disponibile?", gloss: "When are you available?", note: "*È disponibile* is formal. Informal would be *sei disponibile*.", example_gloss: ["When are you available to start?"]}
  it.a2.unit30.lesson02.teach_da_lunedi: {title: "Sono disponibile da lunedì.", gloss: "I am available from Monday.", note: "Use *da* for the starting point of availability.", example_gloss: ["I am available from Monday morning."]}
  it.a2.unit30.lesson02.teach_orario_lavoro: {title: "Qual è l'orario di lavoro?", gloss: "What are the working hours?", note: "*Orario di lavoro* asks about the schedule for the role, not the office address.", example_gloss: ["Excuse me, what are the working hours?"]}
  it.a2.unit30.lesson02.teach_dalle_alle: {title: "Dalle nove alle cinque.", gloss: "From nine to five.", note: "*Dalle... alle...* frames a time span: from... to...", example_gloss: ["The working hours are from nine to five."]}
  it.a2.unit30.lesson02.teach_confermo_colloquio: {title: "Confermo il colloquio.", gloss: "I confirm the interview.", note: "*Confermo* is useful in formal follow-up messages. *Colloquio* means job interview here.", example_gloss: ["Good morning, I confirm the interview."]}
exercises:
  it.a2.unit30.lesson01.exercise01.choose_esperienza:
    instruction: "Which word means 'experience'?"
    correct_option: "l'esperienza"
    distractors: ["l'indirizzo", "la riparazione", "la febbre"]
    accepted_answers: [{value: "l'esperienza", status: "correct"}]
    feedback: "*L'esperienza* means experience."
  it.a2.unit30.lesson01.exercise02.listen_experience:
    instruction: "Listen and select the interview answer you hear."
    correct_option: "Ho esperienza come ingegnere e sono disponibile da lunedì."
    distractors: ["Ho mal di gola e prenoto una visita.", "Vorrei aprire un conto corrente oggi.", "C'è una perdita d'acqua in bagno."]
    accepted_answers: [{value: "Ho esperienza come ingegnere e sono disponibile da lunedì.", status: "correct"}]
    feedback: "The speaker gives experience and availability."
  it.a2.unit30.lesson01.exercise03.choose_gruppo:
    instruction: "Which sentence means 'I work well in a team'?"
    correct_option: "Lavoro bene in gruppo."
    distractors: ["Lavoro in banca.", "Sono in gruppo domani.", "Il lavoro è vicino."]
    accepted_answers: [{value: "Lavoro bene in gruppo.", status: "correct"}]
    feedback: "*Lavoro bene in gruppo* describes a workplace strength."
  it.a2.unit30.lesson01.exercise04.match_interview_words:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "experience", right: "l'esperienza"}
          - {left: "engineer", right: "l'ingegnere"}
          - {left: "team/group", right: "il gruppo"}
          - {left: "available", right: "disponibile"}
          - {left: "I have experience.", right: "Ho esperienza."}
          - {left: "I work well in a team.", right: "Lavoro bene in gruppo."}
        status: "correct"
    feedback: "These are basic interview words and strengths."
  it.a2.unit30.lesson01.exercise05.order_esperienza:
    instruction: "Put the words in order to say 'I have experience as an engineer.'"
    accepted_answers: [{value: ["Ho", "esperienza", "come", "ingegnere"], status: "correct"}]
    feedback: "The correct order is *Ho esperienza come ingegnere.*"
  it.a2.unit30.lesson01.exercise06.fill_disponibile:
    instruction: "Complete the sentence with the word for 'available.'"
    accepted_answers: [{value: "disponibile", status: "correct"}]
    feedback: "*Sono disponibile da lunedì* means 'I am available from Monday.'"
  it.a2.unit30.lesson01.exercise07.write_experience:
    instruction: "Write the taught interview answer in Italian: I have experience as an engineer and I work well in a team."
    accepted_answers:
      - {value: "Ho esperienza come ingegnere e lavoro bene in gruppo.", status: "correct"}
      - {value: "Ho esperienza come ingegnere e lavoro bene in gruppo", status: "correct"}
    feedback: "The sentence gives relevant experience and a strength."
  it.a2.unit30.lesson02.exercise01.choose_question_experience:
    instruction: "Which formal interview prompt asks about experience?"
    correct_option: "Mi parli della sua esperienza."
    distractors: ["Quando arriva a Roma?", "Quanto costa il conto?", "Dov'è il lavandino?"]
    accepted_answers: [{value: "Mi parli della sua esperienza.", status: "correct"}]
    feedback: "*Mi parli della sua esperienza* is formal interview language."
  it.a2.unit30.lesson02.exercise02.listen_role_question:
    instruction: "Listen and select the clarifying question you hear."
    correct_option: "Qual è l'orario di lavoro?"
    distractors: ["Qual è il codice fiscale?", "Quando può venire il tecnico?", "Dov'è la farmacia?"]
    accepted_answers: [{value: "Qual è l'orario di lavoro?", status: "correct"}]
    feedback: "The speaker asks about the working hours."
  it.a2.unit30.lesson02.exercise03.choose_availability:
    instruction: "Which sentence says 'I am available from Monday'?"
    correct_option: "Sono disponibile da lunedì."
    distractors: ["Sono ingegnere a Milano.", "Lavoro dalle nove alle cinque.", "Sono d'accordo con Elena."]
    accepted_answers: [{value: "Sono disponibile da lunedì.", status: "correct"}]
    feedback: "*Da lunedì* gives the starting point."
  it.a2.unit30.lesson02.exercise04.match_interview_exchange:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "Tell me about your experience.", right: "Mi parli della sua esperienza."}
          - {left: "When are you available?", right: "Quando è disponibile?"}
          - {left: "I am available from Monday.", right: "Sono disponibile da lunedì."}
          - {left: "What are the working hours?", right: "Qual è l'orario di lavoro?"}
          - {left: "from nine to five", right: "dalle nove alle cinque"}
          - {left: "I work well in a team.", right: "Lavoro bene in gruppo."}
        status: "correct"
    feedback: "These phrases cover experience, availability, and a clarifying question."
  it.a2.unit30.lesson02.exercise05.order_orario:
    instruction: "Put the words in order to ask 'What are the working hours?'"
    accepted_answers: [{value: ["Qual", "è", "l'orario", "di", "lavoro"], status: "correct"}]
    feedback: "The correct order is *Qual è l'orario di lavoro?*"
  it.a2.unit30.lesson02.exercise06.reply_interview_answer:
    instruction: "The interviewer asks about experience and availability. Answer that you have experience as an engineer, are available from Monday, and ask the taught question about working hours."
    accepted_answers:
      - {value: "Ho esperienza come ingegnere e sono disponibile da lunedì. Qual è l'orario di lavoro?", status: "correct"}
      - {value: "Ho esperienza come ingegnere. Sono disponibile da lunedì. Qual è l'orario di lavoro?", status: "correct"}
      - {value: "Ho esperienza come ingegnere e sono disponibile da lunedì qual è l'orario di lavoro", status: "correct"}
    feedback: "The reply gives experience, availability, and a clarifying question."
  it.a2.unit30.lesson02.exercise07.write_availability_note:
    instruction: "Write a formal message before the interview: start with *Buongiorno*, confirm the interview, say you are available from Monday, say you have experience as an engineer, ask about working hours, and end with *Grazie*."
    accepted_answers:
      - {value: "Buongiorno, confermo il colloquio. Sono disponibile da lunedì. Ho esperienza come ingegnere. Qual è l'orario di lavoro? Grazie.", status: "correct"}
      - {value: "Buongiorno, confermo il colloquio. Sono disponibile da lunedì e ho esperienza come ingegnere. Qual è l'orario di lavoro? Grazie.", status: "correct"}
      - {value: "Buongiorno confermo il colloquio sono disponibile da lunedì ho esperienza come ingegnere qual è l'orario di lavoro grazie", status: "correct"}
    feedback: "The message confirms the interview, gives availability and experience, and asks a clarifying question."
  it.a2.unit30.lesson02.exercise08.dictation_orario_ruolo:
    instruction: "Type what you hear."
    correct_option: "Qual è l'orario di lavoro"
    accepted_answers: [{value: "Qual è l'orario di lavoro", status: correct}]
    orthography_strict: true
