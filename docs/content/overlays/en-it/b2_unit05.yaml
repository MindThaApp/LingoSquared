  it.b2.unit05.lesson06.teach.dialogue_elena_ok:
    title: "Elena: No problem. When does it suit you?"
    gloss: "Elena: No problem. When does it suit you?"
  it.b2.unit05.lesson06.teach.dialogue_sam_settimana:
    title: "Sam: Next week? And I still have to write to the office."
    gloss: "Sam: Next week? And I still have to write to the office."
  it.b2.unit05.lesson06.teach.dialogue_elena_diversamente:
    title: "Elena: Yes, you obviously write differently to the office."
    gloss: "Elena: Yes, you obviously write differently to the office."
  it.b2.unit05.lesson06.teach.grammar_entrambi_registri:
    title: "The same request, both registers"
    gloss: "Can you reschedule the appointment? Would it be possible to reschedule the appointment?"
    note: "A complete register shift keeps the same content -- rescheduling the appointment -- but changes the pronoun, the verb form, and the politeness markers."

