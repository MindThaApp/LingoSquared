  it.b2.unit05.lesson02.teach.caro:
    title: "Dear"
    gloss: "dear (neutral, + name)"
    example_gloss: "Dear Marco,"
  it.b2.unit05.lesson02.teach.grammar_saluti:
    title: "Greetings and closings"
    gloss: "Hi Elena! See you soon! Dear Sir or Madam, Kind regards. Yours faithfully."
    note: "A ladder from informal to most formal: *Ciao/A presto* -- *Caro/Cara* + name -- *Gentile Signore/Signora* + *Cordiali saluti* -- *Distinti saluti*."

  it.b2.unit05.lesson03.teach.puoi_farlo:
    title: "Can you do it?"
    gloss: "Can you do it?"
  it.b2.unit05.lesson03.teach.per_favore:
    title: "please (informal)"
    gloss: "please (informal)"
    example_gloss: "Can you do it, please?"
  it.b2.unit05.lesson03.teach.per_cortesia:
