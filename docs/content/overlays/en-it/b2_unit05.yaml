  it.b2.unit05.lesson02.teach.cordiali_saluti:
    title: "Kind regards"
    gloss: "kind regards"
    note: "A standard formal closing, roughly matching Lei-register letters."
  it.b2.unit05.lesson02.teach.distinti_saluti:
    title: "Yours faithfully"
    gloss: "yours faithfully"
