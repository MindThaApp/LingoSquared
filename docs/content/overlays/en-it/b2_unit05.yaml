  it.b2.unit05.lesson04.teach.richiesta_informale:
    title: "Can we reschedule the appointment? (informal)"
    gloss: "Can we reschedule the appointment? (informal)"
  it.b2.unit05.lesson04.teach.richiesta_formale:
    title: "Would it be possible to reschedule the appointment? (formal)"
    gloss: "Would it be possible to reschedule the appointment? (formal)"
  it.b2.unit05.lesson04.teach.grammar_richiesta:
    title: "The request, both ways"
    gloss: "Can we reschedule the appointment? Would it be possible to reschedule the appointment?"
    note: "The same request rendered informally (*possiamo*) and formally (*sarebbe possibile*)."

  it.b2.unit05.lesson05.teach.andare_bene:
    title: "to suit / work (be convenient)"
    gloss: "to suit / work (be convenient)"
    note: "*Ti va bene?* (informal) = 'does that suit you?', literally 'does it go well for you?'."
    example_gloss: "Does Monday suit you?"
  it.b2.unit05.lesson05.teach.andrebbe_bene:
    title: "would suit / would work (formal)"
    gloss: "would suit / would work (formal)"
    note: "*Le andrebbe bene?* is the Lei-register conditional form of the same idea, more polite than a plain present tense."
    example_gloss: "Would Monday suit you?"
  it.b2.unit05.lesson05.teach.testo_informale:
    title: "Reading: the informal message"
    gloss: "Hi Elena! Can we reschedule the appointment? I can't on Monday, unfortunately. Does next week suit you? See you soon, Sam"
  it.b2.unit05.lesson05.teach.testo_formale:
    title: "Reading: the formal message"
    gloss: "Dear Sir or Madam, would it be possible to reschedule the appointment? I can't on Monday, unfortunately. Would next week suit you? Kind regards, Sam"

  it.b2.unit05.lesson06.teach.nessun_problema:
