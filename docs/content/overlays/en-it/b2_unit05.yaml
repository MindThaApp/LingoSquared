review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed (DRAFT). Confirm every English gloss
    matches idiomatic Italian, that every matching_pairs right-hand gloss
    discriminates its left on real meaning, and that the culminating
    writing answers (lesson06) accept the punctuation forms a correct
    learner would actually produce. See the realization file's review
    block for the full priority list, including the tu/Lei verb-form pairs
    and the andare bene / andrebbe bene contrast.
  notes: >-
    Overlay for it's fifth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English has one "you" for both registers, so the tu/Lei choice and its
    knock-on verb-form change (hai->ha, puoi->può) has no direct English
    cue -- flagged throughout; (2) English "please" doesn't formally split
    the way per favore/per cortesia does; (3) the closings ladder (Ciao/A
    presto vs Gentile Signore/Signora + Cordiali saluti/Distinti saluti)
    has no single-word English equivalent mapping, so each is glossed with
    its function, not a literal translation. No sibling-direction file
    (it-en b2) was consulted.

course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: adapt register to audience and purpose --
    convey the same request appropriately to a close friend (tu) and to an
    office (Lei), recognizing which forms are too casual or too stiff for a
    given setting -- around rescheduling an appointment.

units:
  it.b2.unit05.registro:
    title: "Register"
    description: Adapt register to audience and purpose -- convey the same message appropriately to a close friend and to an institution, recognizing which forms are too casual or too stiff for a given setting.

