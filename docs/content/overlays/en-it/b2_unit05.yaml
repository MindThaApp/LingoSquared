  it.b2.unit05.lesson03.teach.cosi_gentile:
    title: "Would you be so kind?"
    gloss: "Would you be so kind?"
  it.b2.unit05.lesson03.teach.grammar_direttezza:
    title: "Directness and politeness"
    gloss: "Can you do it? Could you do it? Would it be possible? Would you be so kind?"
    note: "*Puoi* is direct and informal; *Potrebbe*/*Sarebbe possibile*/*Sarebbe così gentile* soften the same request for a more formal or polite setting."

