    title: "Do you have time? (formal)"
    gloss: "Do you have time? (formal)"
    note: "*Ha* is the Lei-form of *avere* -- the same form as 'he/she has'."
  it.b2.unit05.lesson01.teach.puoi_aiutarmi:
    title: "Can you help me? (informal)"
    gloss: "Can you help me? (informal)"
    note: "*Puoi* is the tu-form of *potere*."
  it.b2.unit05.lesson01.teach.puo_aiutarmi:
    title: "Can you help me? (formal)"
    gloss: "Can you help me? (formal)"
    note: "*Può* is the Lei-form of *potere*."
  it.b2.unit05.lesson01.teach.grammar_tu_lei:
    title: "Tu and Lei"
    gloss: "Do you have time? (x2) Can you help me? (x2)"
    note: "Tu takes the 2nd-person-singular verb form (*hai*, *puoi*); Lei takes the SAME form as 'he/she' (*ha*, *può*), even though it means 'you'."

