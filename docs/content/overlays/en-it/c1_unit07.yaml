course:
  title: Italian C1
  description: "Advanced Italian mediation: distilling and relaying complex or conflicting sources for a specific audience."

units:
  it.c1.unit07.mediazione_sintesi:
    title: "Mediation and synthesis"
    description: "Distill two conflicting sources about remote work and relay them accurately for a non-specialist audience."

lessons:
  it.c1.unit07.mediazione_sintesi.lesson01.mediare_sintetizzare:
    title: "Mediating and synthesizing"
  it.c1.unit07.mediazione_sintesi.lesson02.due_fonti_a_confronto:
    title: "Two sources compared"
  it.c1.unit07.mediazione_sintesi.lesson03.selezionare_qualificare:
    title: "Selecting and qualifying"
  it.c1.unit07.mediazione_sintesi.lesson04.riformulare_per_pubblico:
    title: "Reformulating for an audience"
  it.c1.unit07.mediazione_sintesi.lesson05.il_briefing_scritto:
    title: "The written briefing"
  it.c1.unit07.mediazione_sintesi.lesson06.la_mediazione_completa:
    title: "The complete mediation"

teaching:
  it.c1.unit07.mediazione_sintesi.lesson01.teach.mediare:
    title: "to mediate"
    gloss: "to mediate / to act as an intermediary"
    note: "*Mediare* means to relay and reconcile information between sources or parties so each side is understood accurately."
    example_gloss: "We have to mediate between two colleagues."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.sintetizzare:
    title: "to synthesize"
    gloss: "to synthesize / to combine into a summary"
    note: "*Sintetizzare* means to combine several sources into one clear, condensed account."
    example_gloss: "We have to synthesize the information."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.in_sintesi:
    title: "in summary"
    gloss: "in summary / in brief"
    note: "*In sintesi* opens the closing summary of a longer account — the mediation's takeaway."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.l_essenziale:
    title: "the essential"
    gloss: "the essential / what matters most"
    note: "*L'essenziale* is what must be kept when you distill a source down."
    example_gloss: "In the summary we keep only the essential."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.distillare:
    title: "to distill"
    gloss: "to distill / to extract the essence"
    note: "*Distillare* means to reduce a dense source to its essential points."
    example_gloss: "To distill means to keep only the essential."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.rimandare_alla_fonte:
    title: "to refer back to the source"
    gloss: "to refer back to the source"
    note: "*Rimandare alla fonte* means to point the audience back to where a claim came from — part of preserving attribution."
  it.c1.unit07.mediazione_sintesi.lesson01.teach.modello_mediazione:
    title: "A definition of mediation"
    gloss: "Mediating means distilling the essential and referring back to the source."
    note: "This sentence defines mediation: *mediare* = *distillare* the essential + *rimandare* to the source."

  it.c1.unit07.mediazione_sintesi.lesson02.teach.lavorare_da_remoto:
    title: "to work remotely"
    gloss: "to work remotely"
    note: "*Lavorare da remoto* (working remotely) is the topic of the two sources being mediated."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.aumenta_produttivita:
    title: "increases productivity"
    gloss: "increases productivity"
    note: "*Aumenta la produttività* (increases productivity) is the survey's claim."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.l_indagine:
    title: "a survey"
    gloss: "a survey / an investigation"
    note: "*Un'indagine* is the first source — a company survey. Note the elision: *un'* + *indagine*."
    example_gloss: "A survey measures productivity."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.lo_studio:
    title: "a study"
    gloss: "a study"
    note: "*Uno studio* is the second source. Before *studio*, the indefinite article is *uno*."
    example_gloss: "A study describes the team."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.isola_team:
    title: "isolates the team"
    gloss: "isolates the team"
    note: "*Isola il team* (isolates the team) is the study's claim — it contradicts the survey's."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.secondo:
    title: "according to"
    gloss: "according to"
    note: "*Secondo* introduces attribution: *secondo l'indagine* / *secondo lo studio* tell the audience who said what."
    example_gloss: "According to the survey, productivity increases."
  it.c1.unit07.mediazione_sintesi.lesson02.teach.grammar_confronto:
    title: "The two sources compared"
    gloss: "According to a survey, remote work increases productivity. According to a study, remote work isolates the team."
    note: "This is the two-source comparison: the survey's claim first, then the study's claim — a genuine conflict, not a consensus."

  it.c1.unit07.mediazione_sintesi.lesson03.teach.e_da_notare_che:
    title: "it should be noted that"
    gloss: "it should be noted that"
    note: "*È da notare che* flags a point worth keeping — a qualification the audience needs."
  it.c1.unit07.mediazione_sintesi.lesson03.teach.resta_da_chiarire:
    title: "it remains to be clarified"
    gloss: "it remains to be clarified"
    note: "*Resta da chiarire* preserves uncertainty instead of flattening it."
  it.c1.unit07.mediazione_sintesi.lesson03.teach.non_concordano:
    title: "the two sources do not agree"
    gloss: "the two sources do not agree"
    note: "*Non concordano* (they do not agree) states the conflict between the sources plainly."
  it.c1.unit07.mediazione_sintesi.lesson03.teach.il_disaccordo:
    title: "the disagreement"
    gloss: "the disagreement"
    note: "*Il disaccordo* is the material disagreement you must preserve, not smooth over."
    example_gloss: "The disagreement between the sources remains."
  it.c1.unit07.mediazione_sintesi.lesson03.teach.appiattire:
    title: "to flatten"
    gloss: "to flatten / to level out"
    note: "*Appiattire* (to flatten) is what a bad mediator does — turning real disagreement into false consensus."
    example_gloss: "We must not flatten the disagreement."
  it.c1.unit07.mediazione_sintesi.lesson03.teach.grammar_qualificare:
    title: "Qualifying the conflict"
    gloss: "It should be noted that the two sources do not agree. It remains to be clarified whether the gain outweighs the cost."
    note: "This pairs a flag-worthy point (*È da notare che*) with the unresolved conflict (*Resta da chiarire*)."

  it.c1.unit07.mediazione_sintesi.lesson04.teach.riformulare:
    title: "to rephrase"
    gloss: "to rephrase / to reformulate"
    note: "*Riformulare* means to restate something in simpler words for a different audience."
    example_gloss: "We have to rephrase for a different audience."
  it.c1.unit07.mediazione_sintesi.lesson04.teach.in_parole_semplici:
    title: "in simple words"
    gloss: "in simple words"
    note: "*In parole semplici* signals you are condensing and simplifying for a non-specialist."
  it.c1.unit07.mediazione_sintesi.lesson04.teach.non_specialista:
    title: "a non-specialist"
    gloss: "a non-specialist"
    note: "*Un non specialista* is the audience who needs plain language — no jargon."
    example_gloss: "The briefing is for a non-specialist."
  it.c1.unit07.mediazione_sintesi.lesson04.teach.aiuta_alcuni:
    title: "helps some but not everyone"
    gloss: "helps some but not everyone"
    note: "*Aiuta alcuni ma non tutti* (helps some but not everyone) is a balanced, honest relay of a mixed result."
  it.c1.unit07.mediazione_sintesi.lesson04.teach.grammar_relay:
    title: "A spoken relay"
    gloss: "In simple words, remote work helps some but not everyone: on the one hand it increases productivity, on the other it isolates the team."
    note: "This is the spoken relay: condense into plain words and keep both sides — do not flatten the result."

  it.c1.unit07.mediazione_sintesi.lesson05.teach.il_briefing:
    title: "the briefing"
    gloss: "the briefing"
    note: "*Il briefing* is the audience-specific written product of mediation."
    example_gloss: "We prepare a briefing for the director."
  it.c1.unit07.mediazione_sintesi.lesson05.teach.l_attribuzione:
    title: "attribution"
    gloss: "attribution"
    note: "*L'attribuzione* is crediting each point to its source — a core mediation duty."
    example_gloss: "Attributing every point to its source is essential."
  it.c1.unit07.mediazione_sintesi.lesson05.teach.l_incertezza:
    title: "uncertainty"
    gloss: "uncertainty"
    note: "*L'incertezza* is what remains unresolved; a faithful briefing keeps it rather than hiding it."
    example_gloss: "The briefing must preserve the uncertainty."
  it.c1.unit07.mediazione_sintesi.lesson05.teach.grammar_briefing:
    title: "The written briefing"
    gloss: "In summary, the two sources do not agree: according to a survey remote work increases productivity, while according to a study it isolates the team. It remains to be clarified whether the gain outweighs the cost."
    note: "This is the audience-specific briefing: it synthesizes the two sources, attributes each claim, and preserves the open question."

  it.c1.unit07.mediazione_sintesi.lesson06.teach.il_quadro:
    title: "the overview"
    gloss: "the overview / the overall picture"
    note: "*Il quadro* (the picture/overview) is what a good mediation gives the reader."
    example_gloss: "The briefing gives a clear overview."
  it.c1.unit07.mediazione_sintesi.lesson06.teach.briefing_modello:
    title: "The complete briefing"
    gloss: "In summary, the two sources do not agree: according to a survey remote work increases productivity, while according to a study it isolates the team. It remains to be clarified whether the gain outweighs the cost."
    note: "This briefing synthesizes both sources, attributes each claim, and keeps the open question."
  it.c1.unit07.mediazione_sintesi.lesson06.teach.relay_modello:
    title: "The complete spoken relay"
    gloss: "In simple words, remote work helps some but not everyone: on the one hand it increases productivity, on the other it isolates the team. In summary, it remains to be clarified whether the gain outweighs the cost."
    note: "A complete spoken relay: simplify, preserve both sides, close with the unresolved point."

