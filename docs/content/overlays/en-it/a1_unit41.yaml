teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs in the infinitive: *leggere* (to read), *fare sport* (to exercise or play sports) and *cucinare* (to cook). Italian infinitives end in -are, -ere or -ire.'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Free time
    gloss: free time
    note: '*Il tempo libero* is a masculine noun, so it takes *il*. It is the key phrase for talking about hobbies.'
    example_gloss: In my free time, I like to read.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Leggo* is the *io* form of *leggere* (to read). Italian drops the subject pronoun: say *Leggo*, not *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobbies: *ascoltare musica* (to listen to music), *disegnare* (to draw) and *giocare ai videogiochi* (to play video games).'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Ascoltare* takes its object directly: *ascolto musica*, with no word for ''to'' in between.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Con gli amici* means with friends. *Gli* is the plural article before a masculine noun that starts with a vowel.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'Four frequency words. *Mai* (never) needs *non* before the verb: *non gioco mai*.'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Ogni* (every) never changes: *ogni settimana*, *ogni fine settimana*. See the next card.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai needs non; ogni never changes
    gloss: 'With mai the verb also takes non: Non gioco mai. Ogni stays the same for every noun: ogni settimana, ogni fine settimana.'
    note: English says 'I never play'; Italian says *non gioco mai* (literally 'I don't play never'). Unlike English 'every', *ogni* is always followed by a singular noun.
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia brings up hobbies
    gloss: 'Giulia: We often walk together. But what else do you do in your free time, Marco?'
    note: '*Passeggiamo* is the *noi* (we) form of *passeggiare*. *Spesso* goes after the verb.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Marco's hobbies
    gloss: 'Marco: I like cooking, at home too. And I exercise often.'
    note: '*Anche a casa* (at home too) shows that Marco cooks for fun, not only at work. *A casa* means at home, with no article.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia is surprised
    gloss: 'Giulia: You cook at home too? You already cook all day at your job!'
    note: '*Già* (already) and *tutto il giorno* (all day) show how much Marco already cooks at work.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco explains
    gloss: 'Marco: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Cucinare mi rilassa* literally means ''cooking relaxes me'': the activity is the subject and *mi* (me) is the object.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Giulia's hobbies
    gloss: 'Giulia: I like reading and I often listen to music.'
    note: 'Two hobbies joined with *e* (and). Both verbs stay in the *io* form: *leggo* and *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco asks about gaming
    gloss: 'Marco: Do you also game?'
    note: 'A yes/no question keeps the statement order and only the tone rises: *Giochi anche ai videogiochi?* *Anche* means also.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia answers
    gloss: 'Giulia: No, I never game. But I sometimes draw!'
    note: '*Non ... mai* (never) and *a volte* (sometimes) contrasted in one answer. *Ma* means but.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Comparing hobbies
    gloss: Marco and I often walk together. But we also have other hobbies. Marco likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Giulia's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      passeggiamo: we go for a walk
      spesso: often
      insieme: together
      altri: other
      cucina: cooks
      volentieri: gladly
      casa: home (a casa = at home)
      sport: sport (fa sport = does sport)
      leggo: read
      ascolto: listen
      musica: music
      disegno: draw
      volte: times (a volte = sometimes)
      videogiochi: video games
      mai: never
      libero: free
      tempo: time
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco asks about the weekend
    gloss: 'Marco: What are you doing this weekend?'
    note: '*Questo fine settimana* (this weekend) is masculine, so it is *questo*. *Fai* is the *tu* form of *fare* (to do).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia is undecided
    gloss: 'Giulia: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Non lo so ancora* (I don''t know yet): *lo* stands for the thing you don''t know and goes before the verb. *Uscire* means to go out.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco suggests a plan
    gloss: 'Marco: Shall we walk together? I''ll cook for us afterward.'
    note: '*Poi* (then, afterwards) puts the plans in order. *Cucino io* (with *io* after the verb) stresses ''I will cook''.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia agrees
    gloss: 'Giulia: Good idea! I like both walking and cooking.'
    note: '*Sia ... sia ...* means both ... and ...: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco confirms
    gloss: 'Marco: Perfect. Then I''ll see you Saturday!'
    note: '*Ci vediamo sabato* (see you Saturday): no article before the day when it means the coming one.'
