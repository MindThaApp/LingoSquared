course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit97.per_risparmiare: {"title": "I take the bike to save money", "description": "Say what you do something for with per + infinitive, answer 'why' with per, use serve per, and per non + infinitive as a ready-made phrase."}
lessons:
  it.a2.unit97.per_risparmiare.lesson01.per_infinito: {"title": "Per + infinitive"}
  it.a2.unit97.per_risparmiare.lesson02.commissioni: {"title": "Errands and saving money"}
  it.a2.unit97.per_risparmiare.lesson03.serve_per: {"title": "What is it for?"}
  it.a2.unit97.per_risparmiare.lesson04.per_non: {"title": "So as not to miss the train"}
  it.a2.unit97.per_risparmiare.lesson05.lettura: {"title": "Luca's plan"}
  it.a2.unit97.per_risparmiare.lesson06.giulia_e_marco: {"title": "Giulia and Marco: why do you study?"}
teaching:
  it.a2.unit97.per_risparmiare.lesson01.teach.v_per: {"title": "Purpose", "gloss": "for; in order to / the supermarket / to buy / the bread / to learn / to speak / to feel well", "note": "*Per* + infinitive says what you do something for.", "example_gloss": ["I go to the supermarket to buy bread.", "I study Italian to speak with Giulia.", "I run to feel well.", "Why are you going to the supermarket?"]}
  it.a2.unit97.per_risparmiare.lesson01.teach.per_inf: {"title": "Per + infinitive", "gloss": "I go to the supermarket to buy bread. I run to feel well.", "note": "*Per* + infinitive means 'in order to'. The subject of both verbs is the same."}
  it.a2.unit97.per_risparmiare.lesson01.teach.perche_per: {"title": "Answering why with per", "gloss": "Why are you going to the supermarket? To buy bread.", "note": "You can answer *perché* with just *per* + infinitive."}
  it.a2.unit97.per_risparmiare.lesson02.teach.v_soldi: {"title": "Money and errands", "gloss": "the bank / money / to save / the bicycle / the train / to go to work", "note": "*Risparmiare* is to save money.", "example_gloss": ["I go to the bank to get money.", "I take the bike to save money.", "I take the train to go to work.", "Luca is saving for a trip."]}
  it.a2.unit97.per_risparmiare.lesson02.teach.per_inf2: {"title": "More purposes", "gloss": "I take the bike to save money. I go to the bank to get money.", "note": "Use *per* + infinitive after a verb of going or taking."}
  it.a2.unit97.per_risparmiare.lesson02.teach.per_nome: {"title": "Per + noun or person", "gloss": "A present for Luca. I save for a trip.", "note": "*Per* before a noun or a person means 'for'. Before a verb it needs the infinitive."}
  it.a2.unit97.per_risparmiare.lesson03.teach.v_serve: {"title": "What is it for?", "gloss": "to be used / the phone / the key / the alarm clock / to call / to open / to wake up", "note": "*Serve per* + infinitive says what an object is for.", "example_gloss": ["What is the phone for?", "The phone is for calling.", "The key is for opening the door.", "The alarm clock is for waking up early."]}
  it.a2.unit97.per_risparmiare.lesson03.teach.serve_per: {"title": "Serve per", "gloss": "The phone is for calling. The key is for opening the door.", "note": "*Serve per* + infinitive. The verb *servire* agrees with the object: *serve* (one), *servono* (many)."}
  it.a2.unit97.per_risparmiare.lesson03.teach.a_cosa: {"title": "A cosa serve?", "gloss": "What is the alarm clock for? It is for waking up early.", "note": "Ask *A cosa serve...?* and answer with *Serve per...*."}
  it.a2.unit97.per_risparmiare.lesson04.teach.v_presto: {"title": "Avoiding a problem", "gloss": "early / late / to lose or miss / to arrive on time / to set the alarm", "note": "*Per non* + infinitive says what you want to avoid.", "example_gloss": ["I leave early so as not to miss the train.", "I set the alarm so as not to arrive late.", "I run to arrive on time.", "Marco misses the train."]}
  it.a2.unit97.per_risparmiare.lesson04.teach.per_non: {"title": "Per non + infinitive", "gloss": "I leave early so as not to miss the train. I set the alarm so as not to arrive late.", "note": "Learn *per non* + infinitive as one phrase: the purpose is to avoid something."}
  it.a2.unit97.per_risparmiare.lesson04.teach.per_o_per_non: {"title": "Per or per non?", "gloss": "I run to arrive on time. I leave early so as not to arrive late.", "note": "*Per* says what you want; *per non* says what you do not want."}
  it.a2.unit97.per_risparmiare.lesson05.teach.piano: {"title": "Luca's plan", "gloss": "Luca's plan. Luca works on Saturdays to earn more money. He takes the bike to save money. He studies English to speak with tourists. He leaves early so as not to miss the train. At the end of the month he buys a ticket for Rome. Giulia", "note": "Find the purpose after each per."}
  it.a2.unit97.per_risparmiare.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Giulia, why do you study English?"}
  it.a2.unit97.per_risparmiare.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: To speak with tourists at work. And you, why do you take the bike?"}
  it.a2.unit97.per_risparmiare.lesson06.teach.d3: {"title": "Marco answers", "gloss": "Marco: To save money, but also to feel well."}
  it.a2.unit97.per_risparmiare.lesson06.teach.d4: {"title": "Giulia asks", "gloss": "Giulia: Well done! What is the alarm on your phone for?"}
  it.a2.unit97.per_risparmiare.lesson06.teach.d5: {"title": "Marco jokes", "gloss": "Marco: It is to avoid arriving late, but today I am late!"}
  it.a2.unit97.per_risparmiare.lesson06.teach.d6: {"title": "Giulia advises", "gloss": "Giulia: Then tomorrow set the alarm to arrive on time!"}
