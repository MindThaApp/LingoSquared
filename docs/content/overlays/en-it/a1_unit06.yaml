teaching:
  it.a1.unit06.lesson01.teach.madre_padre: {title: "la madre, il padre", gloss: "the mother, the father", note: "Italian nouns carry a gender article -- *la* for feminine, *il* for masculine.", example_gloss: ["This is my father.", "This is my mother."]}
  it.a1.unit06.lesson01.teach.fratello_sorella: {title: "il fratello, la sorella", gloss: "the brother, the sister", note: "*fratello* is masculine (*il*) and *sorella* is feminine (*la*).", example_gloss: ["I have one brother and one sister."]}
  it.a1.unit06.lesson01.teach.questo_e_mio_padre: {title: "Questo è mio padre. Questa è mia madre.", gloss: "This is my father. This is my mother.", note: "*Questo/Questa* (this) agrees in gender with the person it points to: *questo* for a man, *questa* for a woman."}
  it.a1.unit06.lesson01.teach.nonno_nonna: {title: "il nonno, la nonna", gloss: "the grandfather, the grandmother", note: "Same masculine/feminine article pattern as *padre/madre*.", example_gloss: ["My grandfather lives in Rome.", "My grandmother cooks very well."]}
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle: {title: "Hai fratelli o sorelle?", gloss: "Do you have brothers or sisters?", note: "*Hai* (you have) + the family word + *o* (or) is the standard way to ask about siblings."}
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella: {title: "Ho un fratello e una sorella.", gloss: "I have one brother and one sister.", note: "*Ho* (I have) answers the question, using *un* (a/one, masculine) and *una* (a/one, feminine)."}
  it.a1.unit06.lesson02.teach.moglie_marito: {title: "il marito, la moglie", gloss: "the husband, the wife", note: "Another masculine/feminine pair, following the same article pattern.", example_gloss: ["Sam has a wife."]}
  it.a1.unit06.lesson03.teach.hai_figli: {title: "Hai figli?", gloss: "Do you have children?", note: "*figli* (children) is the plural used when asking generally, regardless of how many or their genders."}
  it.a1.unit06.lesson03.teach.ho_due_figli: {title: "Sì, ho due figli. Un maschio e una femmina.", gloss: "Yes, I have two children. One boy and one girl.", note: "*maschio* (male/boy) and *femmina* (female/girl) specify the children's genders after giving the total count."}
  it.a1.unit06.lesson03.teach.figlio_figlia: {title: "il figlio, la figlia", gloss: "the son, the daughter", note: "The singular forms of *figli*, following the usual masculine/feminine article pattern.", example_gloss: ["Elena has one son and one daughter."]}

