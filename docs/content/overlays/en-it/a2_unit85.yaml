course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses and everyday experience."
  learning_goal: "Talk about the past in Italian: what happened, what used to happen, and what had already happened."
units:
  it.a2.unit85.come_era_prima: {"title": "How it used to be", "description": "Describe past habits with the imperfetto: regular verbs, essere, fare and bere, habit markers and the contrast with the present."}
lessons:
  it.a2.unit85.lesson01.giocavo_in_giardino: {"title": "I used to play in the garden"}
  it.a2.unit85.lesson02.leggevo_e_dormivo: {"title": "I used to read and sleep"}
  it.a2.unit85.lesson03.ero_facevo_bevevo: {"title": "I was, I did, I drank"}
  it.a2.unit85.lesson04.una_volta_e_adesso: {"title": "Once and now"}
  it.a2.unit85.lesson05.le_estati_dai_nonni: {"title": "Summers at the grandparents"}
  it.a2.unit85.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about summers"}
teaching:
  it.a2.unit85.lesson01.teach.casa: {"title": "The grandparents house", "gloss": "grandmother / grandfather / house / garden / in summer", "note": "*Nonna* and *nonno* are also used to talk about them directly: *Ciao, nonna!*", "example_gloss": ["My grandmother lived in a house with a garden.", "In summer we used to play in the garden.", "Grandpa used to cook in the garden."]}
  it.a2.unit85.lesson01.teach.verbi1: {"title": "Verbs in -are", "gloss": "to play / to live / to eat / to walk / to cook / to watch", "note": "These are regular -are verbs.", "example_gloss": ["I used to play with Luca.", "We used to eat bread with grandma.", "I used to walk with grandpa.", "Grandma used to cook and I used to watch."]}
  it.a2.unit85.lesson01.teach.gn_are: {"title": "Imperfetto of -are verbs", "gloss": "I used to play, you used to play, he/she used to play, we used to play, you (plural) used to play, they used to play", "note": "The imperfetto describes habits and repeated actions in the past ('used to', 'would'). Take the infinitive, drop *-are* and add *-avo, -avi, -ava, -avamo, -avate, -avano*."}
  it.a2.unit85.lesson01.teach.gn_uso: {"title": "Using the imperfetto", "gloss": "Grandpa used to cook. We used to eat in the garden. I used to walk with grandpa.", "note": "The *io* and *lui/lei* forms are different in the imperfetto (*giocavo*, *giocava*), so the subject pronoun is usually not needed. The stress stays on the *-a-* before the ending."}
  it.a2.unit85.lesson01.teach.frasi1: {"title": "Three sentences", "gloss": "I used to play in the garden. We used to live with grandma. We used to eat bread."}
  it.a2.unit85.lesson02.teach.cose2: {"title": "Things and times", "gloss": "book / newspaper / ice cream / lunch / evening", "note": "*Dopo* means 'after'.", "example_gloss": ["I used to read a book in the garden.", "In the evening grandpa used to read the newspaper.", "We used to have ice cream.", "After lunch I used to sleep."]}
  it.a2.unit85.lesson02.teach.verbi2: {"title": "Verbs in -ere and -ire", "gloss": "to have / to read / to sleep / to finish / to take / to leave", "note": "*Avere* and *prendere* are -ere verbs; *dormire*, *finire* and *partire* are -ire verbs.", "example_gloss": ["My grandparents had a cat.", "I used to sleep until nine.", "We used to finish lunch at two.", "We used to leave early."]}
  it.a2.unit85.lesson02.teach.gn_ere: {"title": "Imperfetto of -ere verbs", "gloss": "I used to read, you used to read, he/she used to read, we used to read, you (plural) used to read, they used to read", "note": "For -ere verbs, drop *-ere* and add *-evo, -evi, -eva, -evamo, -evate, -evano*."}
  it.a2.unit85.lesson02.teach.gn_ire: {"title": "Imperfetto of -ire verbs", "gloss": "I used to sleep, you used to sleep, he/she used to sleep, we used to sleep, you (plural) used to sleep, they used to sleep", "note": "For -ire verbs, drop *-ire* and add *-ivo, -ivi, -iva, -ivamo, -ivate, -ivano*. Verbs like *finire* do not add *-isc-* in the imperfetto."}
  it.a2.unit85.lesson02.teach.gn_avere: {"title": "Imperfetto of avere", "gloss": "I had, you had, he/she had, we had, you (plural) had, they had", "note": "*Avere* is regular in the imperfetto, like other -ere verbs."}
  it.a2.unit85.lesson03.teach.aggettivi: {"title": "Describing words", "gloss": "big / small / happy / tired / hot", "note": "*Faceva caldo* literally means 'it did hot': Italian uses *fare* for weather.", "example_gloss": ["The house was big and the garden was small.", "We were happy.", "Grandpa was tired in the evening.", "In summer it was hot."]}
  it.a2.unit85.lesson03.teach.verbi3: {"title": "Verbs and places", "gloss": "to do, make / to drink / to go / swim / sea / walk", "note": "*Fare il bagno* means 'to go for a swim'; *fare una passeggiata* means 'to go for a walk'.", "example_gloss": ["We used to go for a swim.", "Grandpa used to drink a coffee after lunch.", "I used to go to the sea with grandpa.", "In the evening we used to go for a walk."]}
  it.a2.unit85.lesson03.teach.gn_essere: {"title": "Imperfetto of essere", "gloss": "I was, you were, he/she was, we were, you (plural) were, they were", "note": "*Essere* is irregular in the imperfetto. It describes how things used to be: *la casa era grande*."}
  it.a2.unit85.lesson03.teach.gn_fare_bere: {"title": "Imperfetto of fare and bere", "gloss": "I used to do, you used to do, he/she used to do, we used to do, you (plural) used to do, they used to do. I used to drink, you used to drink, he/she used to drink, we used to drink, you (plural) used to drink, they used to drink", "note": "*Fare* and *bere* use an older stem (*face-*, *beve-*) and then the -ere endings."}
  it.a2.unit85.lesson03.teach.gn_andare: {"title": "Imperfetto of andare", "gloss": "I used to go, you used to go, he/she used to go, we used to go, you (plural) used to go, they used to go", "note": "*Andare* is irregular in the present but regular in the imperfetto: stem *and-* plus *-avo, -avi, -ava*."}
  it.a2.unit85.lesson04.teach.marcatori: {"title": "Habit markers", "gloss": "as a child (m.) / as a child (f.) / usually / every summer / often / always", "note": "These words signal repeated actions in the past, so they go with the imperfetto. *Dai nonni* means 'to the grandparents house'.", "example_gloss": ["As a child I used to go to my grandparents every summer (a woman speaking).", "As a child I used to play in the garden (a man speaking).", "We usually ate in the garden.", "Grandma often used to cook.", "Grandpa was always happy."]}
  it.a2.unit85.lesson04.teach.ora: {"title": "Then and now", "gloss": "once, in the past / now / now / no longer / still", "note": "*Non ... più* means 'no longer'; *ancora* means 'still' here.", "example_gloss": ["Once we used to eat in the garden, now we eat at home.", "Now grandma cooks little.", "Grandma still cooks."]}
  it.a2.unit85.lesson04.teach.gn_contrasto: {"title": "Past habit and present", "gloss": "Once we used to eat in the garden, now we eat at home.", "note": "Use the imperfetto for what used to happen and the present for what happens now. *Una volta* and *ora/adesso* mark the contrast."}
  it.a2.unit85.lesson04.teach.gn_marcatori: {"title": "Words that signal habits", "gloss": "We usually ate in the garden. Every summer I used to go to my grandparents. Grandma always cooked.", "note": "*Di solito, spesso, sempre, ogni estate* tell you that the action was repeated: this is the typical use of the imperfetto."}
  it.a2.unit85.lesson04.teach.gn_non_piu: {"title": "Non più and ancora", "gloss": "I no longer play in the garden. Grandpa no longer cooks. Grandma still cooks.", "note": "*Non ... più* means 'no longer' and surrounds the verb: *non gioco più*. *Ancora* means 'still'."}
  it.a2.unit85.lesson05.teach.parole5: {"title": "Words for the text", "gloss": "afternoon / every day / to remember / but", "note": "*Tutti i giorni* means 'every day'.", "example_gloss": ["In the afternoon we used to play in the garden.", "Every day I used to walk with grandpa.", "I still remember the house.", "I was tired, but happy."]}
  it.a2.unit85.lesson05.teach.gn_andare_presente: {"title": "Andare in the present", "gloss": "I go, you go, he/she goes, we go, you (plural) go, they go", "note": "*Andare* is irregular in the present, but regular in the imperfetto (*andavo*, *andavi*)."}
  it.a2.unit85.lesson05.teach.lettura: {"title": "Giulia remembers her summers", "gloss": "As a child I used to go to my grandparents every summer. The house was big and had a garden. Grandpa used to read the newspaper and drink a coffee. Grandma used to cook and we used to eat in the garden. After lunch I used to sleep, in the afternoon I used to play and in the evening we used to go for a walk. I was always happy. Now I no longer go to my grandparents, but I still remember the house. Giulia", "note": "Notice how the imperfetto describes the habits (*leggeva*, *cucinava*, *dormivo*) and the description (*era grande*, *ero felice*), while the present (*non vado più*, *ricordo*) tells about now."}
  it.a2.unit85.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Giulia, what did you use to do in summer as a child?"}
  it.a2.unit85.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: I used to go to my grandparents every summer. In the morning I used to play in the garden."}
  it.a2.unit85.lesson06.teach.d3: {"title": "Marco shares", "gloss": "Marco: How nice! I often used to go to the sea with grandpa."}
  it.a2.unit85.lesson06.teach.d4: {"title": "Giulia asks more", "gloss": "Giulia: And what did you (plural) use to do at the sea?"}
  it.a2.unit85.lesson06.teach.d5: {"title": "Marco tells", "gloss": "Marco: We used to go for a swim and eat ice cream. We were always happy!"}
  it.a2.unit85.lesson06.teach.d6: {"title": "Giulia reacts", "gloss": "Giulia: What happy summers! I still remember the house and the garden."}
exercises:
  it.a2.unit85.lesson01.exercise01.scegli_giocavo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giocavo in giardino.", "distractors": ["Ho giocato in giardino.", "Giocavano in giardino.", "Giocava in giardino."], "accepted_answers": [{"value": "Giocavo in giardino.", "status": "correct"}], "feedback": "*Giocavo* is the io-form of the imperfetto, for a repeated action."}
  it.a2.unit85.lesson01.exercise02.scegli_cucinava: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Il nonno cucinava.", "distractors": ["Il nonno cucinavo.", "Il nonno cucinavano.", "Il nonno cucinavamo."], "accepted_answers": [{"value": "Il nonno cucinava.", "status": "correct"}], "feedback": "A singular subject like *il nonno* takes the lui-form: *cucinava*."}
  it.a2.unit85.lesson01.exercise03.abbina_giocavo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "giocavo", "right": "I used to play"}, {"left": "giocavi", "right": "you used to play"}, {"left": "giocava", "right": "he/she used to play"}, {"left": "giocavamo", "right": "we used to play"}, {"left": "giocavate", "right": "you (plural) used to play"}, {"left": "giocavano", "right": "they used to play"}], "status": "correct"}], "feedback": "Each ending matches one person."}
  it.a2.unit85.lesson01.exercise04.ordina_mangiavamo: {"instruction": "Put the words in order to say 'We used to eat in the garden.'", "correct_option": "Mangiavamo in giardino", "accepted_answers": [{"value": "Mangiavamo in giardino", "status": "correct"}], "feedback": "*Mangiavamo* is the noi-form."}
  it.a2.unit85.lesson01.exercise05.completa_abitava: {"instruction": "Complete with the imperfetto of abitare.", "correct_option": "abitava", "accepted_answers": [{"value": "abitava", "status": "correct"}], "feedback": "A singular subject takes *abitava*."}
  it.a2.unit85.lesson01.exercise06.traduci_camminavo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Camminavo con il nonno.", "status": "correct"}, {"value": "Camminavo con il nonno", "status": "correct"}, {"value": "Camminavo con mio nonno.", "status": "correct"}, {"value": "Camminavo con mio nonno", "status": "correct"}], "feedback": "*Camminavo* is the io-form of *camminare*."}
  it.a2.unit85.lesson01.exercise07.scrivi_abitavamo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Abitavamo con la nonna.", "status": "correct"}, {"value": "Abitavamo con la nonna", "status": "correct"}], "feedback": "*Abitavamo* is the noi-form of *abitare*.", "correct_option": "Abitavamo con la nonna."}
  it.a2.unit85.lesson02.exercise01.scegli_giornale: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Il nonno leggeva il giornale.", "distractors": ["Il nonno leggevo il giornale.", "Il nonno legge il giornale.", "Il nonno leggevano il giornale."], "accepted_answers": [{"value": "Il nonno leggeva il giornale.", "status": "correct"}], "feedback": "*Leggeva* is the lui-form; *legge* would be the present."}
  it.a2.unit85.lesson02.exercise02.scegli_dormivamo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Dopo il pranzo dormivamo.", "distractors": ["Dopo il pranzo dormiamo.", "Dopo il pranzo dormivo.", "Dopo il pranzo dormevamo."], "accepted_answers": [{"value": "Dopo il pranzo dormivamo.", "status": "correct"}], "feedback": "-ire verbs use *-ivamo* for noi: *dormivamo*."}
  it.a2.unit85.lesson02.exercise03.abbina_ere_ire: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "leggevo", "right": "I used to read"}, {"left": "dormivi", "right": "you used to sleep"}, {"left": "aveva", "right": "he/she had"}, {"left": "avevamo", "right": "we had"}, {"left": "leggevate", "right": "you (plural) used to read"}, {"left": "dormivano", "right": "they used to sleep"}], "status": "correct"}], "feedback": "-ere verbs use *-ev-*; -ire verbs use *-iv-*."}
  it.a2.unit85.lesson02.exercise04.ordina_libro: {"instruction": "Put the words in order to say 'I used to read a book in the garden.'", "correct_option": "Leggevo un libro in giardino", "accepted_answers": [{"value": "Leggevo un libro in giardino", "status": "correct"}], "feedback": "*Leggevo* is the io-form of *leggere*."}
  it.a2.unit85.lesson02.exercise05.completa_leggeva: {"instruction": "Complete with the imperfetto of leggere.", "correct_option": "leggeva", "accepted_answers": [{"value": "leggeva", "status": "correct"}], "feedback": "A singular subject takes *leggeva*."}
  it.a2.unit85.lesson02.exercise06.traduci_gatto: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "I nonni avevano un gatto.", "status": "correct"}, {"value": "I nonni avevano un gatto", "status": "correct"}], "feedback": "*Avevano* is the loro-form of *avere*."}
  it.a2.unit85.lesson02.exercise07.scrivi_dormivo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Dormivo fino alle nove.", "status": "correct"}, {"value": "Dormivo fino alle nove", "status": "correct"}], "feedback": "*Dormivo* is the io-form of *dormire*.", "correct_option": "Dormivo fino alle nove."}
  it.a2.unit85.lesson03.exercise01.scegli_grande: {"instruction": "Choose the correct Italian sentence.", "correct_option": "La casa era grande.", "distractors": ["La casa è grande.", "La casa erano grande.", "La casa essere grande."], "accepted_answers": [{"value": "La casa era grande.", "status": "correct"}], "feedback": "*Era* is the lui/lei-form of *essere* in the imperfetto."}
  it.a2.unit85.lesson03.exercise02.scegli_bagno: {"instruction": "Choose the correct Italian sentence.", "correct_option": "In estate facevamo il bagno.", "distractors": ["In estate facciamo il bagno.", "In estate facevo il bagno.", "In estate fatto il bagno."], "accepted_answers": [{"value": "In estate facevamo il bagno.", "status": "correct"}], "feedback": "*Facevamo* is the noi-form of *fare*."}
  it.a2.unit85.lesson03.exercise03.abbina_irregolari: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "ero", "right": "I was"}, {"left": "eri", "right": "you were"}, {"left": "eravamo", "right": "we were"}, {"left": "facevo", "right": "I used to do"}, {"left": "bevevamo", "right": "we used to drink"}, {"left": "andavano", "right": "they used to go"}], "status": "correct"}], "feedback": "Essere is irregular; fare, bere and andare follow the endings."}
  it.a2.unit85.lesson03.exercise04.ordina_caffe: {"instruction": "Put the words in order to say 'Grandpa used to drink a coffee.'", "correct_option": "Il nonno beveva un caffè", "accepted_answers": [{"value": "Il nonno beveva un caffè", "status": "correct"}], "feedback": "*Beveva* is the lui-form of *bere*."}
  it.a2.unit85.lesson03.exercise05.completa_eravamo: {"instruction": "Complete with the imperfetto of essere.", "correct_option": "eravamo", "accepted_answers": [{"value": "eravamo", "status": "correct"}], "feedback": "The subject is *noi*, so the form is *eravamo*."}
  it.a2.unit85.lesson03.exercise06.traduci_caldo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "In estate faceva caldo.", "status": "correct"}, {"value": "In estate faceva caldo", "status": "correct"}], "feedback": "Weather uses *fare*: *faceva caldo*."}
  it.a2.unit85.lesson03.exercise07.scrivi_mare: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Andavo al mare con il nonno.", "status": "correct"}, {"value": "Andavo al mare con il nonno", "status": "correct"}, {"value": "Andavo al mare con mio nonno.", "status": "correct"}, {"value": "Andavo al mare con mio nonno", "status": "correct"}], "feedback": "*Andavo* is the io-form of *andare*.", "correct_option": "Andavo al mare con il nonno."}
  it.a2.unit85.lesson04.exercise01.scegli_ogni_estate: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ogni estate andavo dai nonni.", "distractors": ["Ogni estate vado dai nonni.", "Ogni estate andare dai nonni.", "Ogni estate andavano dai nonni."], "accepted_answers": [{"value": "Ogni estate andavo dai nonni.", "status": "correct"}], "feedback": "*Ogni estate* marks a habit, so the verb is in the imperfetto."}
  it.a2.unit85.lesson04.exercise02.scegli_non_piu: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non gioco più in giardino.", "distractors": ["Non giocavo più in giardino.", "Non gioco ancora in giardino.", "Gioco non più in giardino."], "accepted_answers": [{"value": "Non gioco più in giardino.", "status": "correct"}], "feedback": "The present *gioco* is used for now, and *non ... più* means 'no longer'."}
  it.a2.unit85.lesson04.exercise03.abbina_marcatori: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "di solito", "right": "usually"}, {"left": "spesso", "right": "often"}, {"left": "sempre", "right": "always"}, {"left": "ogni estate", "right": "every summer"}, {"left": "una volta", "right": "once, in the past"}, {"left": "adesso", "right": "now"}], "status": "correct"}], "feedback": "These words mark habits or the contrast with the present."}
  it.a2.unit85.lesson04.exercise04.ordina_solito: {"instruction": "Put the words in order to say 'We usually ate in the garden.'", "correct_option": "Di solito mangiavamo in giardino", "accepted_answers": [{"value": "Di solito mangiavamo in giardino", "status": "correct"}], "feedback": "*Di solito* opens the sentence."}
  it.a2.unit85.lesson04.exercise05.completa_cucina: {"instruction": "Complete with the present of cucinare.", "correct_option": "cucina", "accepted_answers": [{"value": "cucina", "status": "correct"}], "feedback": "*Ora* signals the present, so *cucina*."}
  it.a2.unit85.lesson04.exercise06.traduci_solito: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Di solito la nonna cucinava.", "status": "correct"}, {"value": "Di solito la nonna cucinava", "status": "correct"}], "feedback": "*Di solito* goes with the imperfetto."}
  it.a2.unit85.lesson04.exercise07.scrivi_ogni: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ogni estate mangiavamo in giardino.", "status": "correct"}, {"value": "Ogni estate mangiavamo in giardino", "status": "correct"}], "feedback": "*Ogni estate* plus the imperfetto.", "correct_option": "Ogni estate mangiavamo in giardino."}
  it.a2.unit85.lesson05.exercise01.leggi_nonno: {"instruction": "Read the text and choose the answer.", "correct_option": "He used to read the newspaper and drink a coffee.", "distractors": ["He used to cook lunch in the garden.", "He used to sleep after lunch.", "He used to walk to the sea."], "accepted_answers": [{"value": "He used to read the newspaper and drink a coffee.", "status": "correct"}], "feedback": "*Il nonno leggeva il giornale e beveva un caffè.*"}
  it.a2.unit85.lesson05.exercise02.leggi_ora: {"instruction": "Read the text and choose the answer.", "correct_option": "She no longer goes to her grandparents, but she still remembers the house.", "distractors": ["She still goes to her grandparents every summer.", "She has forgotten the house.", "She goes to her grandparents more often."], "accepted_answers": [{"value": "She no longer goes to her grandparents, but she still remembers the house.", "status": "correct"}], "feedback": "*Non vado più* means she no longer goes."}
  it.a2.unit85.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "il pomeriggio", "right": "in the afternoon"}, {"left": "la sera", "right": "in the evening"}, {"left": "tutti i giorni", "right": "every day"}, {"left": "ricordo", "right": "I remember"}, {"left": "sempre", "right": "always"}, {"left": "ancora", "right": "still"}], "status": "correct"}], "feedback": "These expressions come from Giulia's text."}
  it.a2.unit85.lesson05.exercise04.ordina_passeggiata: {"instruction": "Put the words in order to say 'In the evening we used to go for a walk.'", "correct_option": "La sera facevamo una passeggiata", "accepted_answers": [{"value": "La sera facevamo una passeggiata", "status": "correct"}], "feedback": "*La sera* marks the time, *facevamo una passeggiata* the habit."}
  it.a2.unit85.lesson05.exercise05.traduci_ricordo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ricordo ancora la casa.", "status": "correct"}, {"value": "Ricordo ancora la casa", "status": "correct"}], "feedback": "*Ancora* means 'still'."}
  it.a2.unit85.lesson05.exercise06.detta_piccola: {"instruction": "Type what you hear.", "correct_response": "Da piccola andavo dai nonni ogni estate.", "orthography_strict": true, "feedback": "You heard *Da piccola andavo dai nonni ogni estate.*"}
  it.a2.unit85.lesson05.exercise07.detta_passeggiata: {"instruction": "Type what you hear.", "correct_response": "La sera facevamo una passeggiata.", "orthography_strict": true, "feedback": "You heard *La sera facevamo una passeggiata.*"}
  it.a2.unit85.lesson06.exercise01.capisci_nonni: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "To her grandparents.", "distractors": ["To the sea.", "To the city.", "To a friend."], "accepted_answers": [{"value": "To her grandparents.", "status": "correct"}], "feedback": "Giulia says: *Andavo dai nonni ogni estate.*"}
  it.a2.unit85.lesson06.exercise02.capisci_bagno: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "They went for a swim and ate ice cream.", "distractors": ["They walked and read the newspaper.", "They cooked lunch and slept.", "They played in the garden and drank coffee."], "accepted_answers": [{"value": "They went for a swim and ate ice cream.", "status": "correct"}], "feedback": "Marco says: *Facevamo il bagno e mangiavamo il gelato.*"}
  it.a2.unit85.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Andavo dai nonni ogni estate.", "right": "I used to go to my grandparents every summer."}, {"left": "Giocavo in giardino.", "right": "I used to play in the garden."}, {"left": "Andavo spesso al mare.", "right": "I often used to go to the sea."}, {"left": "Che cosa facevate al mare?", "right": "What did you (plural) use to do at the sea?"}, {"left": "Facevamo il bagno.", "right": "We used to go for a swim."}, {"left": "Eravamo sempre felici.", "right": "We were always happy."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  it.a2.unit85.lesson06.exercise04.ordina_gelato: {"instruction": "Put the words in order to say 'We used to go for a swim and eat ice cream.'", "correct_option": "Facevamo il bagno e mangiavamo il gelato", "accepted_answers": [{"value": "Facevamo il bagno e mangiavamo il gelato", "status": "correct"}], "feedback": "Both verbs are in the imperfetto, noi-form."}
  it.a2.unit85.lesson06.exercise05.rispondi_estate: {"instruction": "Answer in Italian: say that every summer you used to go to your grandparents.", "correct_option": "Andavo dai nonni ogni estate.", "accepted_answers": [{"value": "Andavo dai nonni ogni estate.", "status": "correct"}, {"value": "Andavo dai nonni ogni estate", "status": "correct"}, {"value": "Ogni estate andavo dai nonni.", "status": "correct"}, {"value": "Ogni estate andavo dai nonni", "status": "correct"}], "feedback": "Answer in Italian: say that every summer you used to go to your grandparents."}
  it.a2.unit85.lesson06.exercise06.traduci_mattina: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "La mattina giocavo in giardino.", "status": "correct"}, {"value": "La mattina giocavo in giardino", "status": "correct"}], "feedback": "*La mattina* marks the time, *giocavo* the habit."}
  it.a2.unit85.lesson06.exercise07.scrivi_tre: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ogni estate andavo dai nonni. Giocavo in giardino. Ero sempre felice.", "status": "correct"}, {"value": "Ogni estate andavo dai nonni Giocavo in giardino Ero sempre felice", "status": "correct"}], "feedback": "Three sentences in the imperfetto.", "correct_option": "Ogni estate andavo dai nonni. Giocavo in giardino. Ero sempre felice."}
