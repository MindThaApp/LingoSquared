  description: "Learn A1-level Italian for everyday greetings and short social exchanges, with detailed English explanations."

units:
  it.a1.unit14.preferences: {title: "What do you prefer?"}

lessons:
  it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te: {title: "Do you prefer coffee or tea?"}
  it.a1.unit14.lesson02.mi_piace_il_cornetto: {title: "I really like the croissant"}
  it.a1.unit14.lesson03.anch_io_preferisco_il_caffe: {title: "Me too, I prefer coffee!"}

teaching:
  it.a1.unit14.lesson01.teach.preferire: {title: "preferire, preferisco", gloss: "to prefer, I prefer", note: "*preferire* (to prefer) is an -ire verb with an -isc- insertion in most present-tense forms; *preferisco* is 'I prefer.'", example_gloss: ["I prefer tea to coffee."]}
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te: {title: "Preferisci il caffè o il tè?", gloss: "Do you prefer coffee or tea?", note: "*Preferisci* (you prefer) plus *o* (or) offers a choice between two items."}
  it.a1.unit14.lesson01.teach.preferisco_il_caffe: {title: "Preferisco il caffè.", gloss: "I prefer coffee.", note: "*Preferisco* (I prefer) plus *il caffè* (the coffee) states a preference."}

  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto: {title: "Mi piace molto il cornetto.", gloss: "I really like the croissant.", note: "*Mi piace* (it is pleasing to me / I like) plus *molto* (a lot) expresses a strong liking."}
  it.a1.unit14.lesson02.teach.non_mi_piace: {title: "Non mi piace il tè la mattina.", gloss: "I don't like tea in the morning.", note: "*Non mi piace* (I don't like) negates the liking construction; *la mattina* means 'in the morning.'", example_gloss: ["I don't like coffee in the evening."]}
  it.a1.unit14.lesson02.teach.e_a_te: {title: "E a te?", gloss: "And you?", note: "*E a te?* (and to you?) asks the other person for their own preference."}

  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe: {title: "Anch'io preferisco il caffè!", gloss: "Me too, I prefer coffee!", note: "*Anch'io* (me too) agrees with a previously stated preference."}
  it.a1.unit14.lesson03.teach.a_me_no: {title: "A me no, preferisco il tè.", gloss: "Not me, I prefer tea.", note: "*A me no* (not me) disagrees with the previous statement before giving one's own preference.", example_gloss: ["Not me, I prefer coffee."]}

