course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit92.potresti_aiutarmi: {"title": "Could you help me?", "description": "Make polite requests and offers: potresti and potrebbe, vorrei, per favore, the imperative for tu and Lei, and how to accept or decline an offer or request."}
lessons:
  it.a2.unit92.potresti_aiutarmi.lesson01.potresti: {"title": "Could you open the window?"}
  it.a2.unit92.potresti_aiutarmi.lesson02.potrebbe: {"title": "Could you help me? (formal)"}
  it.a2.unit92.potresti_aiutarmi.lesson03.imperativo: {"title": "Wait! (tu and Lei)"}
  it.a2.unit92.potresti_aiutarmi.lesson04.offerte: {"title": "Can I help you?"}
  it.a2.unit92.potresti_aiutarmi.lesson05.un_messaggio: {"title": "A message from Giulia"}
  it.a2.unit92.potresti_aiutarmi.lesson06.giulia_e_marco: {"title": "Giulia and Marco at home"}
teaching:
  it.a2.unit92.potresti_aiutarmi.lesson01.teach.richieste: {"title": "Things you ask", "gloss": "to open the window / to close the door / to pass the salt / to repeat / to speak more slowly", "note": "*Potresti* + infinitive is the polite way to ask a friend.", "example_gloss": ["Could you open the window?", "Could you close the door?", "Could you pass the salt?", "Could you repeat?", "Could you speak more slowly?"]}
  it.a2.unit92.potresti_aiutarmi.lesson01.teach.gn_potresti: {"title": "Potresti + infinitive", "gloss": "Could you open the window? Can you open the window? Could you close the door, please?", "note": "*Potresti* is softer than *puoi*. It is the usual way to ask a friend for something."}
  it.a2.unit92.potresti_aiutarmi.lesson01.teach.gn_per_favore: {"title": "Please and thank you", "gloss": "Please. Please. Thank you very much.", "note": "Add *per favore* or *per piacere* at the end of the request; *grazie mille* says thank you warmly."}
  it.a2.unit92.potresti_aiutarmi.lesson01.teach.gn_mi: {"title": "Mi after the infinitive", "gloss": "Could you help me? Could you call me?", "note": "The short pronoun *mi* ('me') attaches to the end of the infinitive, which drops its final e: *aiutare* + *mi* = *aiutarmi*."}
  it.a2.unit92.potresti_aiutarmi.lesson01.teach.gn_vorrei: {"title": "Vorrei", "gloss": "I would like a coffee. I would like to book a table.", "note": "*Vorrei* ('I would like') is the polite way to ask for something. It takes a noun or an infinitive."}
  it.a2.unit92.potresti_aiutarmi.lesson02.teach.gn_potrebbe: {"title": "Potrebbe: formal", "gloss": "Could you open the window, please? Could you repeat?", "note": "With someone you do not know well, say *potrebbe* instead of *potresti*. The rest of the sentence stays the same."}
  it.a2.unit92.potresti_aiutarmi.lesson02.teach.formale: {"title": "Polite phrases", "gloss": "excuse me / tell me / one moment / just a second / please, you are welcome", "note": "*Mi scusi* and *mi dica* are the formal forms. With friends you say *scusa*.", "example_gloss": ["Excuse me, could you repeat?", "Tell me (how can I help?).", "One moment, please.", "Just a second!", "Please, come in!"]}
  it.a2.unit92.potresti_aiutarmi.lesson02.teach.gn_tu_lei: {"title": "Tu or Lei", "gloss": "Could you repeat? (friend) Could you repeat? (formal) Sorry. Excuse me.", "note": "Friends: *potresti*, *scusa*. Strangers, older people, shops and offices: *potrebbe*, *mi scusi*."}
  it.a2.unit92.potresti_aiutarmi.lesson02.teach.gn_con_lei: {"title": "Formal requests", "gloss": "Could you speak more slowly, please? Could you open the door?", "note": "The formal request is built exactly like the informal one."}
  it.a2.unit92.potresti_aiutarmi.lesson02.teach.gn_desidera: {"title": "In a restaurant", "gloss": "Tell me. Can I help you? I would like a table for two.", "note": "Staff say *Mi dica* or *Desidera?* and you answer with *Vorrei...*."}
  it.a2.unit92.potresti_aiutarmi.lesson03.teach.verbi: {"title": "Commands", "gloss": "to wait / to speak / to come in / to excuse / to sit down", "note": "The command form changes with *tu* and *Lei*.", "example_gloss": ["Wait a second! (to a friend)", "Wait a moment, please. (formal)", "Come in! (to a friend)", "Come in! (formal)", "Please sit down! (formal)"]}
  it.a2.unit92.potresti_aiutarmi.lesson03.teach.gn_tu_lei_are: {"title": "Tu or Lei", "gloss": "Wait! (tu) Wait! (Lei) Speak! (tu) Speak! (Lei) Come in! (tu) Come in! (Lei)", "note": "For -are verbs the command for *tu* ends in -a and the command for *Lei* ends in -i."}
  it.a2.unit92.potresti_aiutarmi.lesson03.teach.gn_pure: {"title": "Pure", "gloss": "Go ahead and come in! Please sit down! Wait here, if you like.", "note": "*Pure* makes a command friendlier: it invites rather than orders."}
  it.a2.unit92.potresti_aiutarmi.lesson03.teach.gn_gentile: {"title": "Commands with please", "gloss": "Wait a second, please. (tu) Wait a second, please. (Lei)", "note": "Add *per favore* to keep the command polite."}
  it.a2.unit92.potresti_aiutarmi.lesson03.teach.frasi: {"title": "Phrases for guests", "gloss": "Please sit down. Please, come in. Tell me.", "note": "Useful fixed phrases when welcoming someone."}
  it.a2.unit92.potresti_aiutarmi.lesson04.teach.offerte: {"title": "Offers", "gloss": "to help / to carry / a coffee / a tea / a bag", "note": "Offers are often questions with *posso* or *vuoi*.", "example_gloss": ["Can I help you?", "Can I carry the bag?", "Do you want a coffee?", "Would you like a tea? (formal)", "Can I help you? (formal)"]}
  it.a2.unit92.potresti_aiutarmi.lesson04.teach.gn_offerte: {"title": "Making an offer", "gloss": "Can I help you? Do you need help? Do you want a coffee? Can I carry the bag?", "note": "Offer help with *posso* + infinitive or ask *ti serve...?* ('do you need...?')."}
  it.a2.unit92.potresti_aiutarmi.lesson04.teach.gn_accettare: {"title": "Accepting", "gloss": "Yes, thank you, gladly. Yes, thank you very much!", "note": "Accept an offer with *sì, grazie* and *volentieri* ('gladly')."}
  it.a2.unit92.potresti_aiutarmi.lesson04.teach.gn_rifiutare: {"title": "Declining", "gloss": "No, thank you, there is no need. No, thank you, I will do it. I am sorry, but I cannot.", "note": "Decline politely with *no, grazie* and a short reason. *Faccio io* means 'I will do it myself'."}
  it.a2.unit92.potresti_aiutarmi.lesson04.teach.gn_certo: {"title": "Accepting a request", "gloss": "Of course! Gladly! Here is the salt.", "note": "When someone asks you for something, *certo* and *volentieri* are warm replies. *Ecco* means 'here is'."}
  it.a2.unit92.potresti_aiutarmi.lesson05.teach.lettura: {"title": "Giulia writes to Marco", "gloss": "Hi Marco! On Saturday I am having a party at my place. Could you bring the dessert, please? Luca is taking care of the music and I am making the pasta. Do you need my address? Thank you very much! Giulia", "note": "Notice the polite request, the offer and the thanks."}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d1: {"title": "Giulia asks", "gloss": "Giulia: Marco, could you open the window, please?"}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d2: {"title": "Marco offers", "gloss": "Marco: Of course, gladly! Do you want a coffee too?"}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d3: {"title": "Giulia accepts", "gloss": "Giulia: Yes, thank you. Could you pass the sugar?"}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d4: {"title": "Marco offers help", "gloss": "Marco: Here is the sugar. Can I help you with the work?"}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d5: {"title": "Giulia declines", "gloss": "Giulia: No, thank you, there is no need. But could you close the door, please?"}
  it.a2.unit92.potresti_aiutarmi.lesson06.teach.d6: {"title": "Marco agrees", "gloss": "Marco: Of course, gladly! I will close it right away."}
exercises:
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise01.scegli_potresti: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Potresti aprire la finestra?", "distractors": ["Potresti apri la finestra?", "Potresto aprire la finestra?", "Potresti aprendo la finestra?"], "accepted_answers": [{"value": "Potresti aprire la finestra?", "status": "correct"}], "feedback": "*Potresti* + infinitive."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise02.scegli_mi: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Potresti aiutarmi?", "distractors": ["Potresti aiutaremi?", "Potresti mi aiutare?", "Potresti aiutando?"], "accepted_answers": [{"value": "Potresti aiutarmi?", "status": "correct"}], "feedback": "*Mi* attaches to the infinitive: *aiutarmi*."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise03.abbina_richieste: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Potresti aprire la finestra?", "right": "Could you open the window?"}, {"left": "Potresti chiudere la porta?", "right": "Could you close the door?"}, {"left": "Potresti ripetere?", "right": "Could you repeat?"}, {"left": "Potresti aiutarmi?", "right": "Could you help me?"}, {"left": "Vorrei un caffè.", "right": "I would like a coffee."}, {"left": "Per favore.", "right": "Please."}], "status": "correct"}], "feedback": "These are polite requests to a friend."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise04.ordina_sale: {"instruction": "Put the words in order to say 'Could you pass the salt, please?'", "correct_option": "Potresti passare il sale per favore", "accepted_answers": [{"value": "Potresti passare il sale per favore", "status": "correct"}, {"value": "Per favore potresti passare il sale", "status": "correct"}], "feedback": "The request comes first and *per favore* at the end."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise05.completa_potresti: {"instruction": "Complete the polite request.", "correct_option": "Potresti", "accepted_answers": [{"value": "Potresti", "status": "correct"}, {"value": "Puoi", "status": "correct"}], "feedback": "*Potresti* + infinitive."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise06.traduci_lentamente: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Potresti parlare più lentamente?", "status": "correct"}, {"value": "Potresti parlare più lentamente", "status": "correct"}], "feedback": "*Più lentamente* means 'more slowly'."}
  it.a2.unit92.potresti_aiutarmi.lesson01.exercise07.scrivi_vorrei: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Vorrei un caffè, per favore.", "status": "correct"}, {"value": "Vorrei un caffè per favore", "status": "correct"}, {"value": "Per favore, vorrei un caffè.", "status": "correct"}, {"value": "Per favore vorrei un caffè", "status": "correct"}], "feedback": "*Vorrei* + noun.", "correct_option": "Vorrei un caffè, per favore."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise01.scegli_potrebbe: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Potrebbe aprire la finestra, per favore?", "distractors": ["Potresti aprire la finestra, per favore?", "Potrebbi aprire la finestra, per favore?", "Potrebbe aprendo la finestra, per favore?"], "accepted_answers": [{"value": "Potrebbe aprire la finestra, per favore?", "status": "correct"}], "feedback": "Formal request: *potrebbe*."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise02.scegli_scusi: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Mi scusi, potrebbe ripetere?", "distractors": ["Scusi mi, potrebbe ripetere?", "Mi scusa, potrebbe ripetere?", "Mi scusi, potresti ripetere?"], "accepted_answers": [{"value": "Mi scusi, potrebbe ripetere?", "status": "correct"}], "feedback": "Formal: *mi scusi* and *potrebbe*."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise03.abbina_formale: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Potrebbe ripetere?", "right": "Could you repeat? (formal)"}, {"left": "Potresti ripetere?", "right": "Could you repeat? (to a friend)"}, {"left": "Mi scusi.", "right": "Excuse me. (formal)"}, {"left": "Scusa.", "right": "Sorry. (to a friend)"}, {"left": "Mi dica.", "right": "Tell me. (formal)"}, {"left": "Un momento, per favore.", "right": "One moment, please."}], "status": "correct"}], "feedback": "Formal and informal pairs."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise04.ordina_lentamente: {"instruction": "Put the words in order to say 'Could you speak more slowly? (formal)'", "correct_option": "Potrebbe parlare più lentamente", "accepted_answers": [{"value": "Potrebbe parlare più lentamente", "status": "correct"}], "feedback": "*Potrebbe* is the formal form."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise05.completa_potrebbe: {"instruction": "Complete the formal request.", "correct_option": "potrebbe", "accepted_answers": [{"value": "potrebbe", "status": "correct"}], "feedback": "With *mi scusi* use *potrebbe*."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise06.traduci_porta: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Potrebbe chiudere la porta, per favore?", "status": "correct"}, {"value": "Potrebbe chiudere la porta per favore", "status": "correct"}], "feedback": "*Potrebbe* is the formal form."}
  it.a2.unit92.potresti_aiutarmi.lesson02.exercise07.scrivi_scusi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Mi scusi, potrebbe aiutarmi?", "status": "correct"}, {"value": "Mi scusi potrebbe aiutarmi", "status": "correct"}], "feedback": "*Mi scusi* + *potrebbe*.", "correct_option": "Mi scusi, potrebbe aiutarmi?"}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise01.scegli_lei: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Aspetti un momento, per favore.", "distractors": ["Aspetta un momento, per favore.", "Aspettare un momento, per favore.", "Aspetto un momento, per favore."], "accepted_answers": [{"value": "Aspetti un momento, per favore.", "status": "correct"}], "feedback": "For *Lei* an -are verb ends in -i."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise02.scegli_tu: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Entra pure!", "distractors": ["Entri pure!", "Entrare pure!", "Entro pure!"], "accepted_answers": [{"value": "Entra pure!", "status": "correct"}], "feedback": "For *tu* an -are verb ends in -a."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise03.abbina_imperativo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Aspetta!", "right": "Wait! (to a friend)"}, {"left": "Aspetti!", "right": "Wait! (formal)"}, {"left": "Entra pure!", "right": "Come in! (to a friend)"}, {"left": "Entri pure!", "right": "Come in! (formal)"}, {"left": "Si accomodi!", "right": "Please sit down! (formal)"}, {"left": "Parli più lentamente!", "right": "Speak more slowly! (formal)"}], "status": "correct"}], "feedback": "Tu forms end in -a, Lei forms in -i."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise04.ordina_aspetti: {"instruction": "Put the words in order to say 'Wait a second, please. (formal)'", "correct_option": "Aspetti un attimo per favore", "accepted_answers": [{"value": "Aspetti un attimo per favore", "status": "correct"}], "feedback": "*Aspetti* ends in -i for Lei."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise05.completa_entri: {"instruction": "Complete with the command for Lei (formal) of entrare.", "correct_option": "entri", "accepted_answers": [{"value": "entri", "status": "correct"}], "feedback": "Formal -are command: *entri*."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise06.traduci_aspetta: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Aspetta un attimo!", "status": "correct"}, {"value": "Aspetta un attimo", "status": "correct"}], "feedback": "Friend: *aspetta*."}
  it.a2.unit92.potresti_aiutarmi.lesson03.exercise07.scrivi_accomodi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Si accomodi!", "status": "correct"}, {"value": "Si accomodi", "status": "correct"}, {"value": "Prego, si accomodi!", "status": "correct"}, {"value": "Prego si accomodi", "status": "correct"}], "feedback": "*Si accomodi* is the fixed formal phrase.", "correct_option": "Si accomodi!"}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise01.scegli_posso: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Posso aiutarti?", "distractors": ["Posso aiutare ti?", "Posso aiutando?", "Posso tu aiutare?"], "accepted_answers": [{"value": "Posso aiutarti?", "status": "correct"}], "feedback": "*Ti* attaches to the infinitive: *aiutarti*."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise02.scegli_volentieri: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sì, grazie, volentieri.", "distractors": ["Sì, grazie, volentiere.", "Sì, grazie, volontà.", "Sì, grazie, volentieri io."], "accepted_answers": [{"value": "Sì, grazie, volentieri.", "status": "correct"}], "feedback": "*Volentieri* means 'gladly'."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise03.abbina_offerte: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Posso aiutarti?", "right": "Can I help you?"}, {"left": "Vuoi un caffè?", "right": "Do you want a coffee?"}, {"left": "Sì, grazie, volentieri.", "right": "Yes, thank you, gladly."}, {"left": "No, grazie, non serve.", "right": "No, thank you, there is no need."}, {"left": "No, grazie, faccio io.", "right": "No, thank you, I will do it."}, {"left": "Mi dispiace, ma non posso.", "right": "I am sorry, but I cannot."}], "status": "correct"}], "feedback": "Offers, acceptances and refusals."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise04.ordina_borsa: {"instruction": "Put the words in order to say 'Can I carry the bag?'", "correct_option": "Posso portare la borsa", "accepted_answers": [{"value": "Posso portare la borsa", "status": "correct"}], "feedback": "*Posso* + infinitive."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise05.completa_serve: {"instruction": "Complete to decline politely.", "correct_option": "serve", "accepted_answers": [{"value": "serve", "status": "correct"}], "feedback": "*Non serve* means 'there is no need'."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise06.traduci_caffe: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Vuoi un caffè?", "status": "correct"}, {"value": "Vuoi un caffè", "status": "correct"}], "feedback": "Friend: *vuoi*."}
  it.a2.unit92.potresti_aiutarmi.lesson04.exercise07.scrivi_dispiace: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Mi dispiace, ma non posso.", "status": "correct"}, {"value": "Mi dispiace ma non posso", "status": "correct"}], "feedback": "*Mi dispiace* softens the refusal.", "correct_option": "Mi dispiace, ma non posso."}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise01.leggi_dolce: {"instruction": "Read the text and choose the answer.", "correct_option": "Bring the dessert.", "distractors": ["Bring the music.", "Cook the pasta.", "Open the window."], "accepted_answers": [{"value": "Bring the dessert.", "status": "correct"}], "feedback": "*Potresti portare il dolce, per favore?*"}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise02.leggi_musica: {"instruction": "Read the text and choose the answer.", "correct_option": "Luca.", "distractors": ["Marco.", "Giulia.", "Nobody."], "accepted_answers": [{"value": "Luca.", "status": "correct"}], "feedback": "*Luca pensa alla musica.*"}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sabato faccio una festa.", "right": "On Saturday I am having a party."}, {"left": "Potresti portare il dolce?", "right": "Could you bring the dessert?"}, {"left": "Luca pensa alla musica.", "right": "Luca is taking care of the music."}, {"left": "Io preparo la pasta.", "right": "I am making the pasta."}, {"left": "Ti serve il mio indirizzo?", "right": "Do you need my address?"}, {"left": "Grazie mille!", "right": "Thank you very much!"}], "status": "correct"}], "feedback": "These lines come from Giulia's message."}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise04.ordina_dolce: {"instruction": "Put the words in order to say 'Could you bring the dessert, please?'", "correct_option": "Potresti portare il dolce per favore", "accepted_answers": [{"value": "Potresti portare il dolce per favore", "status": "correct"}], "feedback": "Request first, *per favore* last."}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise05.traduci_serve: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ti serve il mio indirizzo?", "status": "correct"}, {"value": "Ti serve il mio indirizzo", "status": "correct"}], "feedback": "*Ti serve* means 'do you need'."}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise06.detta_dolce: {"instruction": "Type what you hear.", "correct_response": "Potresti portare il dolce, per favore?", "orthography_strict": true, "feedback": "You heard *Potresti portare il dolce, per favore?*"}
  it.a2.unit92.potresti_aiutarmi.lesson05.exercise07.detta_serve: {"instruction": "Type what you hear.", "correct_response": "Ti serve il mio indirizzo?", "orthography_strict": true, "feedback": "You heard *Ti serve il mio indirizzo?*"}
  it.a2.unit92.potresti_aiutarmi.lesson06.exercise01.capisci_caffe: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "A coffee.", "distractors": ["Help with the window.", "A tea.", "The sugar."], "accepted_answers": [{"value": "A coffee.", "status": "correct"}], "feedback": "He says *vuoi anche un caffè?*"}
  it.a2.unit92.potresti_aiutarmi.lesson06.exercise02.capisci_serve: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She declines.", "distractors": ["She accepts.", "She asks for the sugar.", "She asks him to leave."], "accepted_answers": [{"value": "She declines.", "status": "correct"}], "feedback": "She says *no, grazie, non serve*."}
  it.a2.unit92.potresti_aiutarmi.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Potresti aprire la finestra?", "right": "Could you open the window?"}, {"left": "Vuoi anche un caffè?", "right": "Do you want a coffee too?"}, {"left": "Potresti passare lo zucchero?", "right": "Could you pass the sugar?"}, {"left": "Posso aiutarti con il lavoro?", "right": "Can I help you with the work?"}, {"left": "No, grazie, non serve.", "right": "No, thank you, there is no need."}, {"left": "Chiudo subito.", "right": "I will close it right away."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
