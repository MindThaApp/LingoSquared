    instruction: "Listen and select what you hear."
    correct_option: "With hindsight, I would have left earlier and could have asked for more."
    distractors: ["With hindsight, I will leave earlier and could ask for more.", "With hindsight, I left earlier and could have asked for more.", "With hindsight, I would have left earlier but could not ask for more."]
    accepted_answers: [{value: "With hindsight, I would have left earlier and could have asked for more.", status: correct}]
    feedback: "Col senno di poi, sarei partito prima e avrei potuto chiedere di più means with hindsight, I would have left earlier and could have asked for more."
  it.c1.unit05.ipotesi_controfattuali.lesson01.exercise03.match_condizionale:
    instruction: "Match each Italian past-conditional element to its English meaning."
    accepted_answers:
      - value: {"Col senno di poi": "with hindsight", "sarei partito prima": "I would have left earlier", "avrei potuto chiedere": "I could have asked", "di più": "more", "avresti dovuto pensarci": "you should have thought about it", "pensarci": "to think it over"}
        status: correct
    feedback: "These phrases build the past conditional that describes an unreal alternative."
