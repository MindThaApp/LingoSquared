course:
  title: Italian C1
  description: "Advanced Italian reasoning: past counterfactuals, mixed conditionals, and expressions of regret."

units:
  it.c1.unit05.ipotesi_controfattuali:
    title: "Counterfactual hypotheses"
    description: "Reason about unreal situations: past conditionals, mixed conditionals, and regret for a past decision."

lessons:
  it.c1.unit05.ipotesi_controfattuali.lesson01.condizionale_passato:
    title: "The past conditional"
  it.c1.unit05.ipotesi_controfattuali.lesson02.terzo_tipo:
    title: "The third-type conditional"
  it.c1.unit05.ipotesi_controfattuali.lesson03.condizionale_misto:
    title: "The mixed conditional"
  it.c1.unit05.ipotesi_controfattuali.lesson04.rimpianto:
    title: "Expressing regret"
  it.c1.unit05.ipotesi_controfattuali.lesson05.catena_controfattuale:
    title: "The counterfactual chain"
  it.c1.unit05.ipotesi_controfattuali.lesson06.analisi_completa:
    title: "The complete analysis"

teaching:
  it.c1.unit05.ipotesi_controfattuali.lesson01.teach.col_senno_di_poi:
    title: "with hindsight"
    gloss: "with hindsight / in hindsight"
    note: "*Col senno di poi* (with hindsight) opens a reflection on a past choice and sets up a counterfactual."
  it.c1.unit05.ipotesi_controfattuali.lesson01.teach.sarei_partito_prima:
    title: "I would have left earlier"
    gloss: "I would have left earlier"
    note: "*Sarei partito* is the first-person past conditional (*condizionale passato*) of *partire*; *prima* means earlier."
  it.c1.unit05.ipotesi_controfattuali.lesson01.teach.avrei_potuto_chiedere:
    title: "I could have asked for more"
    gloss: "I could have asked for more"
    note: "*Avrei potuto* (I could have) is *avere* in the conditional plus the past participle *potuto*."
  it.c1.unit05.ipotesi_controfattuali.lesson01.teach.avresti_dovuto:
    title: "you should have thought about it"
    gloss: "you should have thought about it"
    note: "*Avresti dovuto* (you should have) keeps informal *tu*: *avresti* is the second-person conditional of *avere*."
  it.c1.unit05.ipotesi_controfattuali.lesson01.teach.modello_condizionale:
    title: "A past-conditional reflection"
    gloss: "With hindsight, I would have left earlier and could have asked for more."
    note: "The past conditional describes what did not actually happen: *sarei partito* and *avrei potuto* are both hypothetical."

  it.c1.unit05.ipotesi_controfattuali.lesson02.teach.se_avessi_accettato:
    title: "if I had accepted the offer"
    gloss: "if I had accepted the offer"
    note: "*Se avessi accettato* uses the *trapassato congiuntivo* (past perfect subjunctive) for a condition that did not come true."
  it.c1.unit05.ipotesi_controfattuali.lesson02.teach.non_avrei_mai_conosciuto:
    title: "I would never have met Elena"
    gloss: "I would never have met Elena"
    note: "*Non avrei mai conosciuto Elena* is the past conditional result; *mai* (never) strengthens the counterfactual."
  it.c1.unit05.ipotesi_controfattuali.lesson02.teach.se_fossi_rimasto:
    title: "if I had stayed in Chicago"
    gloss: "if I had stayed in Chicago"
    note: "*Se fossi rimasto* (if I had stayed) names the alternative past that never happened."
  it.c1.unit05.ipotesi_controfattuali.lesson02.teach.modello_terzo_tipo:
    title: "A third-type conditional"
    gloss: "If I had accepted the offer in Chicago, I would never have met Elena."
    note: "This third-type conditional pairs a past unreal condition (*Se avessi accettato...*) with a past hypothetical result (*non avrei mai conosciuto...*)."

  it.c1.unit05.ipotesi_controfattuali.lesson03.teach.se_non_fossi_venuto:
    title: "if I had not come to Milan"
    gloss: "if I had not come to Milan"
    note: "*Se non fossi venuto a Milano* states the past unreal condition (in fact, he did come to Milan)."
  it.c1.unit05.ipotesi_controfattuali.lesson03.teach.ora_non_parlerei:
    title: "now I would not speak Italian"
    gloss: "now I would not speak Italian"
    note: "*Ora non parlerei italiano* uses the *condizionale presente* to express a present consequence."
  it.c1.unit05.ipotesi_controfattuali.lesson03.teach.sarebbe_diverso:
    title: "now it would be different"
    gloss: "now it would be different"
    note: "*Adesso sarebbe diverso* (now it would be different) is another present-consequence form, this time with *sarebbe*."
  it.c1.unit05.ipotesi_controfattuali.lesson03.teach.modello_misto:
    title: "A mixed conditional"
    gloss: "If I had not come to Milan, I would not now speak Italian."
    note: "A mixed conditional links a past condition to a present consequence (*ora non parlerei*)."

  it.c1.unit05.ipotesi_controfattuali.lesson04.teach.non_avrei_dovuto:
    title: "I should not have waited"
    gloss: "I should not have waited"
    note: "*Non avrei dovuto* (I should not have) is a classic expression of regret for a past action."
  it.c1.unit05.ipotesi_controfattuali.lesson04.teach.l_ultimo_momento:
    title: "the last moment"
    gloss: "the last moment"
    note: "*L'ultimo momento* (the last moment) names the delay that is being regretted."
  it.c1.unit05.ipotesi_controfattuali.lesson04.teach.per_decidere:
    title: "to decide"
    gloss: "to decide"
    note: "*Per decidere* (to decide): *per* + infinitive names the action Sam kept putting off — *aspettare l'ultimo momento per decidere* = to wait until the last moment to decide."
  it.c1.unit05.ipotesi_controfattuali.lesson04.teach.se_solo_avessi:
    title: "if only I had thought more"
    gloss: "if only I had thought more"
    note: "*Se solo avessi riflettuto di più* (if only I had thought more) is the *se solo* regret pattern."
  it.c1.unit05.ipotesi_controfattuali.lesson04.teach.modello_rimpianto:
    title: "An expression of regret"
    gloss: "I should not have waited until the last moment to decide."
    note: "This sentence regrets the delay in deciding — the regret is about the timing, not about the decision itself."

  it.c1.unit05.ipotesi_controfattuali.lesson05.teach.il_fatto:
    title: "I chose Milan and I am happy"
    gloss: "I chose Milan and I am happy"
    note: "*Ho scelto Milano e sono contento* states the real timeline: the fact that actually happened."
  it.c1.unit05.ipotesi_controfattuali.lesson05.teach.condizione_passata:
    title: "if I had chosen Chicago"
    gloss: "if I had chosen Chicago"
    note: "*Se avessi scelto Chicago* is the unreal past alternative to the real choice."
  it.c1.unit05.ipotesi_controfattuali.lesson05.teach.conseguenza_presente:
    title: "now I would not be here in Milan"
    gloss: "now I would not be here in Milan"
    note: "*Ora non sarei qui a Milano* is the present consequence of that unreal past."
  it.c1.unit05.ipotesi_controfattuali.lesson05.teach.catena_modello:
    title: "A counterfactual chain"
    gloss: "If I had chosen Chicago, I would not now be here in Milan with you."
    note: "The chain links an unreal past condition to a present consequence, distinguishing fact from hypothesis."

  it.c1.unit05.ipotesi_controfattuali.lesson06.teach.modello_completo:
    title: "The complete analysis"
    gloss: "If I had accepted the offer in Chicago, I would never have met Elena. If I had not come to Milan, I would not now speak Italian. I should not have waited until the last moment to decide."
    note: "This is the exact model for the final speaking and writing tasks: a past counterfactual, a mixed conditional, and an expression of regret, in that order."
  it.c1.unit05.ipotesi_controfattuali.lesson06.teach.analisi_controfattuale:
    title: "the counterfactual analysis"
    gloss: "the counterfactual analysis"
    note: "*L'analisi controfattuale* (counterfactual analysis) is a written piece that weighs what would have happened, or would be true now, if a past choice had been different."
    example_gloss: "I wrote my counterfactual analysis."

exercises:
