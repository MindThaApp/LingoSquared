    was a second plausible answer); lesson06.teach.analisi_controfattuale
    note no longer says 'this outcome asks you to produce' (internal
    wording) and now describes what the analysis is. NATIVE FLAGS as on the
    u05 realization.

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 1 fix —
