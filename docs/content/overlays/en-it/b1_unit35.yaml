          - {left: "Elena", right: "Elena"}
          - {left: "make sure that", right: "fare in modo che"}
        status: "correct"
    feedback: "These pieces build the past or hypothetical ability sentence."
  it.b1.unit35.lesson02.exercise04.order_past:
    instruction: "Put the words in order to build the past or hypothetical ability sentence."
    accepted_answers: [{value: ["Avrei", "potuto", "fare", "in", "modo", "che", "Elena", "ricevesse", "la", "conferma", "ieri"], status: "correct"}]
    feedback: "The full sentence is *Avrei potuto fare in modo che Elena ricevesse la conferma ieri.*"
