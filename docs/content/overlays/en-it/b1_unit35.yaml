course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit35.capacita: {title: "Abilities with embedded clauses"}
lessons:
  it.b1.unit35.lesson01.posso_fare_in_modo: {title: "I can make sure that..."}
  it.b1.unit35.lesson02.avrei_potuto: {title: "I could have made sure that..."}
teaching:
  it.b1.unit35.lesson01.teach_posso: {title: "posso", gloss: "I can", note: "*Posso* is the present form for saying what you can do now.", example_gloss: ["I can help today."]}
  it.b1.unit35.lesson01.teach_fare_in_modo_che: {title: "fare in modo che", gloss: "to make sure that", note: "This unit uses *posso fare in modo che...* so the ability contains a second clause, not only *can + verb*.", example_gloss: ["I can make sure that it arrives today."]}
  it.b1.unit35.lesson01.teach_riceva: {title: "riceva", gloss: "receives", note: "After *fare in modo che*, Italian uses the present subjunctive: *riceva* (not the indicative *riceve*).", example_gloss: ["I can make sure that Sam receives the form today."]}
  it.b1.unit35.lesson01.teach_modulo_oggi: {title: "Sam, il modulo, oggi", gloss: "Sam, the form, today", note: "Key words for this unit's example sentences.", example_gloss: ["Sam receives the form today."]}
  it.b1.unit35.lesson02.teach_avrei_potuto: {title: "avrei potuto", gloss: "I could have", note: "*Avrei potuto* frames a past or hypothetical ability.", example_gloss: ["I could have helped yesterday."]}
  it.b1.unit35.lesson02.teach_ricevesse: {title: "ricevesse", gloss: "received", note: "With *avrei potuto fare in modo che*, the embedded verb changes to the imperfect subjunctive *ricevesse*.", example_gloss: ["I could have made sure that Elena received the confirmation yesterday."]}
  it.b1.unit35.lesson02.teach_conferma_ieri: {title: "Elena, la conferma, ieri", gloss: "Elena, the confirmation, yesterday", note: "These words support an appointment or administrative follow-up.", example_gloss: ["Elena receives the confirmation."]}
  it.b1.unit35.lesson02.teach_contrasto: {title: "Posso... Avrei potuto...", gloss: "I can... I could have...", note: "Contrast present ability (*posso*) with past or hypothetical ability (*avrei potuto*).", example_gloss: "I can make sure that Sam receives the form today. I could have made sure that Elena received the confirmation yesterday."}
exercises:
  it.b1.unit35.lesson01.exercise01.choose_fare_in_modo:
    instruction: "Which phrase means 'make sure that'?"
    correct_option: "fare in modo che"
    distractors: ["avrei potuto", "la conferma", "ieri"]
    accepted_answers: [{value: "fare in modo che", status: "correct"}]
    feedback: "*Fare in modo che* means make sure that."
  it.b1.unit35.lesson01.exercise02.listen_posso:
    instruction: "Listen and select the exact Italian sentence you hear."
    correct_option: "Posso fare in modo che Sam riceva il modulo oggi."
    distractors: ["Avrei potuto fare in modo che Elena ricevesse la conferma ieri.", "Sam ha ricevuto la conferma ieri.", "Posso aiutare Elena oggi."]
    accepted_answers: [{value: "Posso fare in modo che Sam riceva il modulo oggi.", status: "correct"}]
    feedback: "The sentence states present ability with *Posso fare in modo che...*"
  it.b1.unit35.lesson01.exercise03.match_present_ability:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I can", right: "posso"}
          - {left: "make sure that", right: "fare in modo che"}
          - {left: "receives", right: "riceva"}
          - {left: "the form", right: "il modulo"}
          - {left: "today", right: "oggi"}
          - {left: "that Sam receives the form today", right: "Sam riceva il modulo oggi"}
        status: "correct"
    feedback: "These pieces build the present ability sentence."
  it.b1.unit35.lesson01.exercise04.order_posso:
    instruction: "Put the words in order to build the present ability sentence."
    accepted_answers: [{value: ["Posso", "fare", "in", "modo", "che", "Sam", "riceva", "il", "modulo", "oggi"], status: "correct"}]
    feedback: "The full sentence is *Posso fare in modo che Sam riceva il modulo oggi.*"
  it.b1.unit35.lesson01.exercise05.fill_riceva:
    instruction: "Complete the sentence with the present subjunctive of *ricevere* (Sam receives)."
    accepted_answers: [{value: "riceva", status: "correct"}]
    feedback: "After *fare in modo che*, use *riceva* here."
  it.b1.unit35.lesson01.exercise06.write_present_ability:
    instruction: "Write in Italian, using the taught 'I can make sure that' structure with the subjunctive: I can make sure that Sam receives the form today."
    accepted_answers:
      - {value: "Posso fare in modo che Sam riceva il modulo oggi.", status: "correct"}
      - {value: "Posso fare in modo che Sam riceva il modulo oggi", status: "correct"}
      - {value: "Posso fare in modo che oggi Sam riceva il modulo.", status: "correct"}
    feedback: "This is present ability plus an embedded clause."
  it.b1.unit35.lesson02.exercise01.choose_avrei_potuto:
    instruction: "Which phrase means 'I could have'?"
    correct_option: "avrei potuto"
    distractors: ["posso", "riceva", "oggi"]
    accepted_answers: [{value: "avrei potuto", status: "correct"}]
    feedback: "*Avrei potuto* means I could have."
  it.b1.unit35.lesson02.exercise02.listen_past:
    instruction: "Listen and select the exact Italian sentence you hear."
    correct_option: "Avrei potuto fare in modo che Elena ricevesse la conferma ieri."
    distractors: ["Posso fare in modo che Sam riceva il modulo oggi.", "Elena riceve il modulo oggi.", "Avrei potuto chiamare Sam oggi."]
    accepted_answers: [{value: "Avrei potuto fare in modo che Elena ricevesse la conferma ieri.", status: "correct"}]
    feedback: "The sentence states past or hypothetical ability with an embedded clause."
  it.b1.unit35.lesson02.exercise03.match_past_ability:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
