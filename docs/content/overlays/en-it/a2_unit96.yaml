course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit96.prima_di_uscire: {"title": "Before I go out, I have breakfast", "description": "Put events in order with prima di + infinitive, dopo, dopo aver + participle, quando + present, then prima, poi and alla fine."}
lessons:
  it.a2.unit96.prima_di_uscire.lesson01.prima_di: {"title": "Before going out"}
  it.a2.unit96.prima_di_uscire.lesson02.dopo: {"title": "After work"}
  it.a2.unit96.prima_di_uscire.lesson03.quando: {"title": "When I get home"}
  it.a2.unit96.prima_di_uscire.lesson04.poi: {"title": "First, then, finally"}
  it.a2.unit96.prima_di_uscire.lesson05.lettura: {"title": "Giulia's day"}
  it.a2.unit96.prima_di_uscire.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about the evening"}
teaching:
  it.a2.unit96.prima_di_uscire.lesson01.teach.v_prima: {"title": "Before", "gloss": "before / to go out / to sleep / to eat / to have breakfast / to read a book / the hands", "note": "*Prima di* is followed by the infinitive.", "example_gloss": ["Before going out, I have breakfast.", "Before sleeping, I read a book.", "Before eating, I wash my hands.", "I have breakfast before going out."]}
  it.a2.unit96.prima_di_uscire.lesson01.teach.prima_di: {"title": "Prima di + infinitive", "gloss": "Before going out, I have breakfast. Before sleeping, I read.", "note": "After *prima di* the verb stays in the infinitive; the subject is the same in both parts."}
  it.a2.unit96.prima_di_uscire.lesson01.teach.prima_ordine: {"title": "Either order", "gloss": "Before eating, I wash my hands. I wash my hands before eating.", "note": "The *prima di* part can come first or second; with a comma when it comes first."}
  it.a2.unit96.prima_di_uscire.lesson02.teach.v_dopo: {"title": "After", "gloss": "after / work / the gym / dinner / to watch a film / to have a coffee", "note": "*Dopo* is followed by a noun or by *aver* + participle.", "example_gloss": ["After work, I go to the gym.", "After dinner, I watch a film.", "After breakfast, I go out.", "After eating, I have a coffee."]}
  it.a2.unit96.prima_di_uscire.lesson02.teach.dopo_nome: {"title": "Dopo + noun", "gloss": "After work, I go to the gym. After dinner, I watch a film.", "note": "With a noun, *dopo* is simply followed by the noun; *cena* needs no article here."}
  it.a2.unit96.prima_di_uscire.lesson02.teach.dopo_aver: {"title": "Dopo aver + participle", "gloss": "After eating, I have a coffee. After working, I go out.", "note": "Learn *dopo aver* + participle as a ready-made phrase: it says the first action is finished. The subject is the same in both parts."}
  it.a2.unit96.prima_di_uscire.lesson02.teach.prima_dopo: {"title": "Prima di or dopo aver?", "gloss": "Before going out, I eat. After eating, I go out.", "note": "The same two events can be told in either order: *prima di* + infinitive, or *dopo aver* + participle."}
  it.a2.unit96.prima_di_uscire.lesson03.teach.v_quando: {"title": "When", "gloss": "when / to arrive / to come back / at home / to make dinner / to call / to finish working", "note": "*Quando* introduces a time clause.", "example_gloss": ["When I get home, I eat.", "When I come home, I make dinner.", "When Marco finishes work, he calls Giulia.", "When it rains, I stay at home."]}
  it.a2.unit96.prima_di_uscire.lesson03.teach.quando: {"title": "Quando + present", "gloss": "When I get home, I eat. When it rains, I stay at home.", "note": "After *quando*, Italian uses the present for things that happen regularly."}
  it.a2.unit96.prima_di_uscire.lesson03.teach.quando_futuro: {"title": "Quando and what happens next", "gloss": "When I arrive, I will call you. When Marco finishes, he calls Giulia.", "note": "The present also works for a near future after *quando*: Italian does not need a future tense here."}
  it.a2.unit96.prima_di_uscire.lesson04.teach.v_poi: {"title": "Sequence words", "gloss": "first / then / at the end / the shopping / the vegetables / the pasta / to cook", "note": "*Prima*, *poi* and *alla fine* mark the steps in order.", "example_gloss": ["First I do the shopping, then I cook.", "First I wash the vegetables, then I cook the pasta.", "At the end I eat with Luca.", "First I eat, then I go out."]}
  it.a2.unit96.prima_di_uscire.lesson04.teach.prima_poi: {"title": "Prima, poi, alla fine", "gloss": "First I do the shopping, then I cook, finally I eat.", "note": "Use *prima*, *poi* and *alla fine* with the present tense to list steps."}
  it.a2.unit96.prima_di_uscire.lesson04.teach.poi_dopo: {"title": "Linking all the patterns", "gloss": "Before cooking, I do the shopping. After cooking, I eat.", "note": "You can tell a whole sequence with *prima di*, *dopo aver* and *quando* as well as with *prima* and *poi*."}
  it.a2.unit96.prima_di_uscire.lesson05.teach.giornata: {"title": "Giulia's day", "gloss": "Giulia's day. Before going out, I have breakfast and drink a coffee. After work I go to the gym. When I come home, I make dinner. After dinner I watch a film with Luca and then I go to bed. Giulia", "note": "Spot the time words: prima di, dopo, quando, poi."}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Giulia, what do you do after work?"}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d2: {"title": "Giulia lists her plans", "gloss": "Giulia: First I go to the gym, then I go home."}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d3: {"title": "Marco asks more", "gloss": "Marco: And when you come home, what do you do?"}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d4: {"title": "Giulia answers", "gloss": "Giulia: I make dinner. After dinner I watch a film."}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d5: {"title": "Marco suggests", "gloss": "Marco: Before you watch the film, I will call you, all right? I am free after dinner."}
  it.a2.unit96.prima_di_uscire.lesson06.teach.d6: {"title": "Giulia agrees", "gloss": "Giulia: All right! After eating, I am free."}
exercises:
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Prima di uscire, faccio colazione.", "distractors": ["Prima uscire, faccio colazione.", "Prima di esco, faccio colazione.", "Prima di uscire, faccio uscire colazione."], "accepted_answers": [{"value": "Prima di uscire, faccio colazione.", "status": "correct"}], "feedback": "*Prima di* + infinitive."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Prima di dormire, leggo un libro.", "distractors": ["Prima di dormo, leggo un libro.", "Prima dormire, leggo un libro.", "Prima di dormire, leggere un libro."], "accepted_answers": [{"value": "Prima di dormire, leggo un libro.", "status": "correct"}], "feedback": "The verb after *prima di* is in the infinitive."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Prima di uscire, faccio colazione.", "right": "Before going out, I have breakfast."}, {"left": "Prima di dormire, leggo un libro.", "right": "Before sleeping, I read a book."}, {"left": "Prima di mangiare, mi lavo le mani.", "right": "Before eating, I wash my hands."}, {"left": "Faccio colazione prima di uscire.", "right": "I have breakfast before going out."}, {"left": "uscire", "right": "to go out"}, {"left": "dormire", "right": "to sleep"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise04.ordina: {"instruction": "Put the words in order to say 'Before eating, I wash my hands.'", "correct_option": "Prima di mangiare mi lavo le mani", "accepted_answers": [{"value": "Prima di mangiare mi lavo le mani", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise05.completa: {"instruction": "Fill in the small word that links prima and the infinitive.", "correct_option": "di", "accepted_answers": [{"value": "di", "status": "correct"}], "feedback": "*Prima di* + infinitive."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Mi lavo le mani prima di mangiare.", "status": "correct"}, {"value": "Mi lavo le mani prima di mangiare", "status": "correct"}], "feedback": "*Prima di* + infinitive."}
  it.a2.unit96.prima_di_uscire.lesson01.prima_di.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Prima di uscire, faccio colazione.", "status": "correct"}, {"value": "Prima di uscire, faccio colazione", "status": "correct"}, {"value": "Faccio colazione prima di uscire.", "status": "correct"}, {"value": "Faccio colazione prima di uscire", "status": "correct"}], "feedback": "Either order is correct.", "correct_option": "Prima di uscire, faccio colazione."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Dopo il lavoro, vado in palestra.", "distractors": ["Dopo lavoro il, vado in palestra.", "Dopo il lavoro, vado palestra in.", "Dopo di il lavoro, vado in palestra."], "accepted_answers": [{"value": "Dopo il lavoro, vado in palestra.", "status": "correct"}], "feedback": "*Dopo* + noun."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Dopo aver mangiato, bevo un caffè.", "distractors": ["Dopo mangiare, bevo un caffè aver.", "Dopo avere mangio, bevo un caffè.", "Dopo aver mangiare, bevo un caffè."], "accepted_answers": [{"value": "Dopo aver mangiato, bevo un caffè.", "status": "correct"}], "feedback": "*Dopo aver* + participle."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Dopo il lavoro, vado in palestra.", "right": "After work, I go to the gym."}, {"left": "Dopo cena, guardo un film.", "right": "After dinner, I watch a film."}, {"left": "Dopo la colazione, esco.", "right": "After breakfast, I go out."}, {"left": "Dopo aver mangiato, bevo un caffè.", "right": "After eating, I have a coffee."}, {"left": "Dopo aver lavorato, esco.", "right": "After working, I go out."}, {"left": "Prima di uscire, mangio.", "right": "Before going out, I eat."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise04.ordina: {"instruction": "Put the words in order to say 'After dinner, I watch a film.'", "correct_option": "Dopo cena guardo un film", "accepted_answers": [{"value": "Dopo cena guardo un film", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise05.completa: {"instruction": "Fill in the word that goes with the participle after dopo.", "correct_option": "aver", "accepted_answers": [{"value": "aver", "status": "correct"}], "feedback": "*Dopo aver* + participle."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Dopo il lavoro, vado in palestra.", "status": "correct"}, {"value": "Dopo il lavoro, vado in palestra", "status": "correct"}], "feedback": "*Dopo* + noun."}
  it.a2.unit96.prima_di_uscire.lesson02.dopo.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Dopo aver mangiato, bevo un caffè.", "status": "correct"}, {"value": "Dopo aver mangiato, bevo un caffè", "status": "correct"}], "feedback": "*Dopo aver* + participle.", "correct_option": "Dopo aver mangiato, bevo un caffè."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Quando torno a casa, preparo la cena.", "distractors": ["Quando tornare a casa, preparo la cena.", "Quando torno a casa, preparare la cena.", "Quando a casa torno, preparo cena la."], "accepted_answers": [{"value": "Quando torno a casa, preparo la cena.", "status": "correct"}], "feedback": "*Quando* + present."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Quando Marco finisce di lavorare, chiama Giulia.", "distractors": ["Quando Marco finire di lavorare, chiama Giulia.", "Quando Marco finisce lavorare, chiama Giulia.", "Quando Marco finisce di lavorare, chiamare Giulia."], "accepted_answers": [{"value": "Quando Marco finisce di lavorare, chiama Giulia.", "status": "correct"}], "feedback": "*Finire di* + infinitive, then the main clause."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Quando arrivo a casa, mangio.", "right": "When I get home, I eat."}, {"left": "Quando torno a casa, preparo la cena.", "right": "When I come home, I make dinner."}, {"left": "Quando Marco finisce di lavorare, chiama Giulia.", "right": "When Marco finishes work, he calls Giulia."}, {"left": "Quando piove, resto a casa.", "right": "When it rains, I stay at home."}, {"left": "Quando arrivo, ti chiamo.", "right": "When I arrive, I will call you."}, {"left": "quando", "right": "when"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise04.ordina: {"instruction": "Put the words in order to say 'When I get home, I eat.'", "correct_option": "Quando arrivo a casa mangio", "accepted_answers": [{"value": "Quando arrivo a casa mangio", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise05.completa: {"instruction": "Fill in the word that means 'when'.", "correct_option": "Quando", "accepted_answers": [{"value": "Quando", "status": "correct"}], "feedback": "*Quando* + present."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Quando piove, resto a casa.", "status": "correct"}, {"value": "Quando piove, resto a casa", "status": "correct"}], "feedback": "*Quando* + present."}
  it.a2.unit96.prima_di_uscire.lesson03.quando.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Quando arrivo, ti chiamo.", "status": "correct"}, {"value": "Quando arrivo, ti chiamo", "status": "correct"}], "feedback": "The present after *quando* can mean the future.", "correct_option": "Quando arrivo, ti chiamo."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Prima lavo la verdura, poi cucino la pasta.", "distractors": ["Prima poi lavo la verdura, cucino la pasta.", "Poi lavo la verdura, prima cucino la pasta.", "Prima lavo la verdura, alla fine poi cucino la pasta."], "accepted_answers": [{"value": "Prima lavo la verdura, poi cucino la pasta.", "status": "correct"}], "feedback": "*Prima* ... *poi* ..."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Prima mangio, poi esco.", "distractors": ["Poi mangio, prima esco.", "Prima mangio, prima esco.", "Prima mangio esco, poi."], "accepted_answers": [{"value": "Prima mangio, poi esco.", "status": "correct"}], "feedback": "First step, then second step."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Prima faccio la spesa, poi cucino.", "right": "First I do the shopping, then I cook."}, {"left": "Prima lavo la verdura, poi cucino la pasta.", "right": "First I wash the vegetables, then I cook the pasta."}, {"left": "Alla fine mangio con Luca.", "right": "At the end I eat with Luca."}, {"left": "Prima mangio, poi esco.", "right": "First I eat, then I go out."}, {"left": "prima", "right": "first"}, {"left": "poi", "right": "then"}, {"left": "alla fine", "right": "at the end"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise04.ordina: {"instruction": "Put the words in order to say 'First I do the shopping, then I cook.'", "correct_option": "Prima faccio la spesa poi cucino", "accepted_answers": [{"value": "Prima faccio la spesa poi cucino", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise05.completa: {"instruction": "Fill in the word that means 'then'.", "correct_option": "poi", "accepted_answers": [{"value": "poi", "status": "correct"}], "feedback": "*Poi* means 'then'."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Prima lavo la verdura, poi cucino la pasta.", "status": "correct"}, {"value": "Prima lavo la verdura, poi cucino la pasta", "status": "correct"}], "feedback": "*Prima* ... *poi* ..."}
  it.a2.unit96.prima_di_uscire.lesson04.poi.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Prima faccio la spesa, poi cucino, alla fine mangio con Luca.", "status": "correct"}, {"value": "Prima faccio la spesa, poi cucino, alla fine mangio con Luca", "status": "correct"}], "feedback": "Three steps in order.", "correct_option": "Prima faccio la spesa, poi cucino, alla fine mangio con Luca."}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise01.leggi1: {"instruction": "Read the text and choose the answer.", "correct_option": "She has breakfast and a coffee.", "distractors": ["She goes to the gym.", "She watches a film.", "She makes dinner."], "accepted_answers": [{"value": "She has breakfast and a coffee.", "status": "correct"}], "feedback": "*Prima di uscire, faccio colazione.*"}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise02.leggi2: {"instruction": "Read the text and choose the answer.", "correct_option": "She makes dinner.", "distractors": ["She goes to the gym.", "She goes to bed.", "She calls Luca."], "accepted_answers": [{"value": "She makes dinner.", "status": "correct"}], "feedback": "*Quando torno a casa, preparo la cena.*"}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Faccio colazione e bevo un caffè.", "right": "I have breakfast and drink a coffee."}, {"left": "Dopo il lavoro vado in palestra.", "right": "After work I go to the gym."}, {"left": "Quando torno a casa, preparo la cena.", "right": "When I come home, I make dinner."}, {"left": "Dopo cena guardo un film con Luca.", "right": "After dinner I watch a film with Luca."}, {"left": "Poi vado a letto.", "right": "Then I go to bed."}, {"left": "Prima di uscire, faccio colazione.", "right": "Before going out, I have breakfast."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise04.ordina: {"instruction": "Put the words in order to say 'After work I go to the gym.'", "correct_option": "Dopo il lavoro vado in palestra", "accepted_answers": [{"value": "Dopo il lavoro vado in palestra", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise05.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Dopo cena guardo un film con Luca e poi vado a letto.", "status": "correct"}, {"value": "Dopo cena guardo un film con Luca e poi vado a letto", "status": "correct"}], "feedback": "*Dopo* + noun, then *poi*."}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise06.detta1: {"instruction": "Type what you hear.", "correct_response": "Prima di uscire, faccio colazione e bevo un caffè.", "orthography_strict": true, "feedback": "You heard *Prima di uscire, faccio colazione e bevo un caffè.*"}
  it.a2.unit96.prima_di_uscire.lesson05.lettura.exercise07.detta2: {"instruction": "Type what you hear.", "correct_response": "Quando torno a casa, preparo la cena.", "orthography_strict": true, "feedback": "You heard *Quando torno a casa, preparo la cena.*"}
  it.a2.unit96.prima_di_uscire.lesson06.giulia_e_marco.exercise01.capisci1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She goes to the gym.", "distractors": ["She makes dinner.", "She watches a film.", "She calls Marco."], "accepted_answers": [{"value": "She goes to the gym.", "status": "correct"}], "feedback": "She says *prima vado in palestra*."}
  it.a2.unit96.prima_di_uscire.lesson06.giulia_e_marco.exercise02.capisci2: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "After eating.", "distractors": ["Before work.", "After the film.", "Before the gym."], "accepted_answers": [{"value": "After eating.", "status": "correct"}], "feedback": "She says *dopo aver mangiato, sono libera*."}
