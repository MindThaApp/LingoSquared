review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the busy-morning unit (passato prossimo, reflexives, irregular participles). OPEN NATIVE QUESTIONS: none beyond those in the realization."}
course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses and everyday experience."
  learning_goal: "Talk about the past in Italian: what happened, what used to happen, and what had already happened."
units:
  it.a2.unit84.una_mattina_piena: {"title": "A busy morning", "description": "Describe what you did this morning with the passato prossimo: avere or essere, reflexive verbs and irregular participles."}
lessons:
  it.a2.unit84.lesson01.ho_fatto_colazione: {"title": "I had breakfast"}
  it.a2.unit84.lesson02.mi_sono_alzata: {"title": "I got up"}
  it.a2.unit84.lesson03.avere_o_essere: {"title": "Avere or essere?"}
  it.a2.unit84.lesson04.a_che_ora: {"title": "At what time?"}
  it.a2.unit84.lesson05.che_mattina: {"title": "What a morning!"}
  it.a2.unit84.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about the morning"}
teaching:
  it.a2.unit84.lesson01.teach.mattina: {"title": "Morning words", "gloss": "the morning / breakfast / coffee / milk / bread", "note": "*Fare colazione* means 'to have breakfast'.", "example_gloss": ["This morning I had breakfast.", "Marco drank a coffee with milk.", "We ate bread."]}
  it.a2.unit84.lesson01.teach.verbi: {"title": "Everyday verbs", "gloss": "to prepare / to drink / to eat / to receive / to finish / to call", "note": "These verbs all take *avere* in the passato prossimo.", "example_gloss": ["Giulia prepared lunch.", "I received a message.", "Did you finish the work?", "Marco called Giulia."]}
  it.a2.unit84.lesson01.teach.gn_avere: {"title": "Passato prossimo with avere", "gloss": "I spoke, you spoke, he/she spoke, we spoke, you (plural) spoke, they spoke", "note": "The passato prossimo of most verbs is the present of *avere* plus a past participle. It describes a finished action, and in speech it also covers the English 'have done'."}
  it.a2.unit84.lesson01.teach.gn_participio: {"title": "Regular participles", "gloss": "I prepared the coffee. I received a message. I finished the work.", "note": "Regular participles end in -ato (-are verbs), -uto (-ere verbs) and -ito (-ire verbs): *preparare* gives *preparato*, *ricevere* gives *ricevuto*, *finire* gives *finito*."}
  it.a2.unit84.lesson01.teach.frasi: {"title": "Three sentences", "gloss": "Giulia had breakfast. I drank a coffee. We ate bread.", "note": "*Fatto* and *bevuto* are participles of *fare* and *bere*."}
  it.a2.unit84.lesson02.teach.riflessivi: {"title": "Morning routine verbs", "gloss": "to wake up / to get up / to wash (oneself) / to get dressed", "note": "These are reflexive verbs: the infinitive ends in *-si*.", "example_gloss": ["I woke up at seven (a woman speaking).", "Marco got up early.", "We got dressed in a hurry."]}
  it.a2.unit84.lesson02.teach.quando: {"title": "When and how", "gloss": "at seven / at eight / early / late / in a hurry", "note": "*Alle* is used with hours: *alle sette*, *alle otto*.", "example_gloss": ["I washed at eight (a man speaking).", "I went out late (a man speaking).", "Giulia got dressed in a hurry."]}
  it.a2.unit84.lesson02.teach.gn_riflessivi: {"title": "Reflexive verbs: essere", "gloss": "I got up, you got up, he got up, we got up, you (plural) got up, they got up", "note": "Reflexive verbs always take *essere* in the passato prossimo. The pronoun (*mi, ti, si, ci, vi, si*) comes before *essere*."}
  it.a2.unit84.lesson02.teach.gn_accordo: {"title": "Agreement with essere", "gloss": "Giulia woke up. Marco woke up. Giulia and Marco woke up.", "note": "With *essere* the participle agrees with the subject: *-o* (masculine singular), *-a* (feminine singular), *-i* (masculine or mixed plural), *-e* (feminine plural)."}
  it.a2.unit84.lesson02.teach.gn_movimento: {"title": "Movement verbs: essere", "gloss": "I went out at eight. Marco went out at nine. We left early.", "note": "Verbs of movement such as *uscire* and *partire* also take *essere*, and the participle agrees with the subject."}
  it.a2.unit84.lesson03.teach.participi_irr: {"title": "Irregular participles", "gloss": "to do - done / to take - taken / to see - seen / to write - written / to read - read / to open - opened", "note": "These participles are irregular and must be learned one by one.", "example_gloss": ["I took the train.", "I read a message.", "I wrote to Marco.", "I opened the window.", "I saw Giulia."]}
  it.a2.unit84.lesson03.teach.movimento: {"title": "Movement verbs", "gloss": "to go / to arrive / to go out / to come back / to leave", "note": "These verbs take *essere*. *Ufficio* means 'office'; *casa* means 'home, house'.", "example_gloss": ["I went to the office (a man speaking).", "We arrived at nine.", "Giulia left the house.", "I came back home (a man speaking)."]}
  it.a2.unit84.lesson03.teach.cose: {"title": "Things", "gloss": "the train / the work / the window / the message", "example_gloss": ["The train leaves at eight.", "Work starts at nine."]}
  it.a2.unit84.lesson03.teach.gn_contrasto: {"title": "Avere or essere?", "gloss": "I took the train. I arrived at nine. I worked until six.", "note": "Use *essere* for movement and for reflexive verbs; use *avere* for most other verbs, especially with a direct object (*ho preso il treno*)."}
  it.a2.unit84.lesson03.teach.gn_negativo: {"title": "Negative past", "gloss": "I didn't have breakfast. I didn't go out. I haven't read the message yet.", "note": "*Non* goes before the auxiliary. *Non ... ancora* means 'not yet'; *ancora* goes between the auxiliary and the participle."}
  it.a2.unit84.lesson04.teach.domande: {"title": "Question words", "gloss": "at what time / what / where / when", "example_gloss": ["What time did you get up? (to a man)", "What did you do afterwards?", "Where did you go? (to a woman)", "When did you come back? (to a man)"]}
  it.a2.unit84.lesson04.teach.sequenza: {"title": "Putting things in order", "gloss": "first / then / after / already / yet", "note": "*Già* and *ancora* sit between the auxiliary and the participle.", "example_gloss": ["First I washed, then I had breakfast.", "Have you already had breakfast?", "I haven't called Marco yet."]}
  it.a2.unit84.lesson04.teach.gn_domande: {"title": "Questions in the past", "gloss": "What time did you wake up? What did you do? Where did you go?", "note": "Questions keep the same auxiliary and participle as statements. The participle agrees with the person asked when the verb takes *essere*."}
  it.a2.unit84.lesson04.teach.gn_sequenza: {"title": "Telling the order", "gloss": "First I washed, then I had breakfast, after that I went out.", "note": "*Prima*, *poi* and *dopo* put actions in order. Each action has its own auxiliary."}
  it.a2.unit84.lesson04.teach.che_mattina: {"title": "An exclamation", "gloss": "What a busy morning!", "note": "*Che* + noun makes an exclamation."}
  it.a2.unit84.lesson05.teach.parole: {"title": "Words for the text", "gloss": "and a half / at the office / the messages / but", "note": "*Alle sei e mezza* is 'at half past six'.", "example_gloss": ["I woke up at half past six (a woman speaking).", "I arrived at the office (a woman speaking).", "I read the messages."]}
  it.a2.unit84.lesson05.teach.gn_mezza: {"title": "Half past", "gloss": "At half past six. At half past seven.", "note": "For half past the hour, add *e mezza* to the hour: *alle sei e mezza*."}
  it.a2.unit84.lesson05.teach.gn_ma: {"title": "Contrast with ma", "gloss": "I took the train, but I arrived late.", "note": "*Ma* joins two actions that contrast. Both verbs keep their own auxiliary."}
  it.a2.unit84.lesson05.teach.lettura: {"title": "Giulia writes to a friend", "gloss": "What a morning! I woke up at half past six. I washed and had breakfast: I drank a coffee and ate bread. Then I took the train, but I arrived late at the office. I haven't read the messages yet! Giulia", "note": "Notice how Giulia uses *essere* for her own movements and reflexives (*mi sono svegliata*, *sono arrivata*) and *avere* for everything else."}
  it.a2.unit84.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Hi Giulia! What did you do this morning?"}
  it.a2.unit84.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: What a morning! I woke up late and I didn't have breakfast."}
  it.a2.unit84.lesson06.teach.d3: {"title": "Marco asks more", "gloss": "Marco: And then? Did you go to the office?"}
  it.a2.unit84.lesson06.teach.d4: {"title": "Giulia explains", "gloss": "Giulia: Yes, I took the train and arrived at nine."}
  it.a2.unit84.lesson06.teach.d5: {"title": "Marco tells his morning", "gloss": "Marco: I got up early. I drank a coffee and read a message."}
  it.a2.unit84.lesson06.teach.d6: {"title": "Giulia reacts", "gloss": "Giulia: Well done! Not me."}
exercises:
  it.a2.unit84.lesson01.exercise01.scegli_colazione: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia ha fatto colazione.", "distractors": ["Giulia ho fatto colazione.", "Giulia ha fare colazione.", "Giulia è fatto colazione."], "accepted_answers": [{"value": "Giulia ha fatto colazione.", "status": "correct"}], "feedback": "*Giulia* takes *ha*, followed by the participle *fatto*."}
  it.a2.unit84.lesson01.exercise02.scegli_pane: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Abbiamo mangiato il pane.", "distractors": ["Abbiamo mangiare il pane.", "Siamo mangiato il pane.", "Avete mangiato il pane."], "accepted_answers": [{"value": "Abbiamo mangiato il pane.", "status": "correct"}], "feedback": "*Abbiamo* is the noi-form of *avere*; the participle is *mangiato*."}
  it.a2.unit84.lesson01.exercise03.abbina_participi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "ho preparato", "right": "I prepared"}, {"left": "hai finito", "right": "you finished"}, {"left": "ha bevuto", "right": "he/she drank"}, {"left": "abbiamo mangiato", "right": "we ate"}, {"left": "avete ricevuto", "right": "you (plural) received"}, {"left": "hanno chiamato", "right": "they called"}], "status": "correct"}], "feedback": "Each form is a form of *avere* plus a participle."}
  it.a2.unit84.lesson01.exercise04.ordina_caffe: {"instruction": "Put the words in order to say 'Marco drank a coffee.'", "correct_option": "Marco ha bevuto un caffè", "accepted_answers": [{"value": "Marco ha bevuto un caffè", "status": "correct"}], "feedback": "*Marco ha bevuto un caffè*: the participle follows *ha*."}
  it.a2.unit84.lesson01.exercise05.completa_ricevuto: {"instruction": "Complete with the past participle of ricevere.", "correct_option": "ricevuto", "accepted_answers": [{"value": "ricevuto", "status": "correct"}], "feedback": "*Ricevere* is an -ere verb, so the participle is *ricevuto*."}
  it.a2.unit84.lesson01.exercise06.traduci_lavoro: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ho finito il lavoro.", "status": "correct"}, {"value": "Ho finito il lavoro", "status": "correct"}], "feedback": "*Finire* gives *finito*."}
  it.a2.unit84.lesson01.exercise07.scrivi_pranzo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Giulia ha preparato il pranzo.", "status": "correct"}, {"value": "Giulia ha preparato il pranzo", "status": "correct"}], "feedback": "*Giulia ha preparato il pranzo.*", "correct_option": "Giulia ha preparato il pranzo."}
  it.a2.unit84.lesson02.exercise01.scegli_svegliata: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia si è svegliata alle sette.", "distractors": ["Giulia ha svegliata alle sette.", "Giulia si è svegliato alle sette.", "Giulia si ha svegliata alle sette."], "accepted_answers": [{"value": "Giulia si è svegliata alle sette.", "status": "correct"}], "feedback": "Reflexive verbs use *essere*, and *svegliata* agrees with feminine *Giulia*."}
  it.a2.unit84.lesson02.exercise02.scegli_alzato: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco si è alzato presto.", "distractors": ["Marco si è alzata presto.", "Marco ha alzato presto.", "Marco si sono alzato presto."], "accepted_answers": [{"value": "Marco si è alzato presto.", "status": "correct"}], "feedback": "*Marco* is masculine singular, so *si è alzato*."}
  it.a2.unit84.lesson02.exercise03.abbina_riflessivi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "mi sono lavato", "right": "I washed (masc.)"}, {"left": "ti sei vestita", "right": "you got dressed (fem.)"}, {"left": "si è alzato", "right": "he got up"}, {"left": "ci siamo svegliati", "right": "we woke up"}, {"left": "vi siete alzati", "right": "you (plural) got up"}, {"left": "si sono vestiti", "right": "they got dressed"}], "status": "correct"}], "feedback": "The pronoun changes with the person, and the participle agrees with the subject."}
  it.a2.unit84.lesson02.exercise04.ordina_sette: {"instruction": "Put the words in order to say 'Giulia woke up at seven.'", "correct_option": "Giulia si è svegliata alle sette", "accepted_answers": [{"value": "Giulia si è svegliata alle sette", "status": "correct"}], "feedback": "*Si è svegliata* stays together, with *si* first."}
  it.a2.unit84.lesson02.exercise05.completa_alzato: {"instruction": "Complete with the correct participle of alzarsi.", "correct_option": "alzato", "accepted_answers": [{"value": "alzato", "status": "correct"}], "feedback": "*Alzato* is masculine singular, matching *Marco*."}
  it.a2.unit84.lesson02.exercise06.traduci_partiti: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Siamo partiti presto.", "status": "correct"}, {"value": "Siamo partiti presto", "status": "correct"}, {"value": "Siamo partite presto.", "status": "correct"}, {"value": "Siamo partite presto", "status": "correct"}], "feedback": "*Partire* takes *essere*: *siamo partiti*."}
  it.a2.unit84.lesson02.exercise07.scrivi_vestita: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Mi sono vestita in fretta.", "status": "correct"}, {"value": "Mi sono vestita in fretta", "status": "correct"}, {"value": "Mi sono vestito in fretta.", "status": "correct"}, {"value": "Mi sono vestito in fretta", "status": "correct"}], "feedback": "*Mi sono vestita in fretta.* A man would say *vestito*.", "correct_option": "Mi sono vestita in fretta."}
  it.a2.unit84.lesson03.exercise01.scegli_arrivata: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sono arrivata alle nove.", "distractors": ["Ho arrivato alle nove.", "Sono arrivare alle nove.", "Ho arrivata alle nove."], "accepted_answers": [{"value": "Sono arrivata alle nove.", "status": "correct"}], "feedback": "*Arrivare* takes *essere*, and a woman says *arrivata*."}
  it.a2.unit84.lesson03.exercise02.scegli_treno: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco ha preso il treno.", "distractors": ["Marco ha prendato il treno.", "Marco è preso il treno.", "Marco ha prenduto il treno."], "accepted_answers": [{"value": "Marco ha preso il treno.", "status": "correct"}], "feedback": "*Prendere* takes *avere*; its participle is irregular: *preso*."}
  it.a2.unit84.lesson03.exercise03.abbina_irregolari: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "ho fatto", "right": "I did"}, {"left": "ho preso", "right": "I took"}, {"left": "ho visto", "right": "I saw"}, {"left": "ho scritto", "right": "I wrote"}, {"left": "ho letto", "right": "I read"}, {"left": "ho aperto", "right": "I opened"}], "status": "correct"}], "feedback": "All six participles are irregular."}
  it.a2.unit84.lesson03.exercise04.ordina_nove: {"instruction": "Put the words in order to say 'We arrived at nine.'", "correct_option": "Siamo arrivati alle nove", "accepted_answers": [{"value": "Siamo arrivati alle nove", "status": "correct"}], "feedback": "*Siamo arrivati*: essere plus an agreeing participle."}
  it.a2.unit84.lesson03.exercise05.completa_essere: {"instruction": "Complete with the correct form of essere or avere.", "correct_option": "è", "accepted_answers": [{"value": "è", "status": "correct"}], "feedback": "*Uscire* takes *essere*: *è uscita*."}
  it.a2.unit84.lesson03.exercise06.traduci_colazione: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non ho fatto colazione.", "status": "correct"}, {"value": "Non ho fatto colazione", "status": "correct"}], "feedback": "*Non* comes before *ho*."}
  it.a2.unit84.lesson03.exercise07.scrivi_letto: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Marco ha letto il messaggio.", "status": "correct"}, {"value": "Marco ha letto il messaggio", "status": "correct"}], "feedback": "*Leggere* gives *letto*, with *avere*.", "correct_option": "Marco ha letto il messaggio."}
  it.a2.unit84.lesson04.exercise01.scegli_ora: {"instruction": "Choose the correct Italian sentence.", "correct_option": "A che ora ti sei alzato?", "distractors": ["A che ora hai alzato?", "A che cosa ti sei alzato?", "Quando ora ti sei alzato?"], "accepted_answers": [{"value": "A che ora ti sei alzato?", "status": "correct"}], "feedback": "*A che ora* asks the time, and *alzarsi* takes *essere*."}
  it.a2.unit84.lesson04.exercise02.scegli_ordine: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Prima mi sono lavata, poi ho fatto colazione.", "distractors": ["Prima ho lavata, poi ho fatto colazione.", "Prima mi sono lavata, poi sono fatto colazione.", "Poi mi sono lavata, prima ho fatto colazione."], "accepted_answers": [{"value": "Prima mi sono lavata, poi ho fatto colazione.", "status": "correct"}], "feedback": "*Prima* comes first in time; *lavarsi* takes *essere*, *fare* takes *avere*."}
  it.a2.unit84.lesson04.exercise03.abbina_domande: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "A che ora ti sei svegliato?", "right": "What time did you wake up?"}, {"left": "Che cosa hai fatto?", "right": "What did you do?"}, {"left": "Dove sei andata?", "right": "Where did you go?"}, {"left": "Quando sei tornato?", "right": "When did you come back?"}, {"left": "Hai già fatto colazione?", "right": "Have you already had breakfast?"}, {"left": "Non ho ancora chiamato Marco.", "right": "I haven't called Marco yet."}], "status": "correct"}], "feedback": "Each question word asks for different information."}
  it.a2.unit84.lesson04.exercise04.ordina_gia: {"instruction": "Put the words in order to ask 'Have you already had breakfast?'", "correct_option": "Hai già fatto colazione", "accepted_answers": [{"value": "Hai già fatto colazione", "status": "correct"}], "feedback": "*Già* goes between *hai* and *fatto*."}
  it.a2.unit84.lesson04.exercise05.completa_ancora: {"instruction": "Complete with già or ancora.", "correct_option": "ancora", "accepted_answers": [{"value": "ancora", "status": "correct"}], "feedback": "*Non ... ancora* means 'not yet'."}
  it.a2.unit84.lesson04.exercise06.traduci_dopo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Che cosa hai fatto dopo?", "status": "correct"}, {"value": "Che cosa hai fatto dopo", "status": "correct"}, {"value": "Cosa hai fatto dopo?", "status": "correct"}, {"value": "Cosa hai fatto dopo", "status": "correct"}, {"value": "Che cosa hai fatto poi?", "status": "correct"}, {"value": "Che cosa hai fatto poi", "status": "correct"}, {"value": "Cosa hai fatto poi?", "status": "correct"}, {"value": "Cosa hai fatto poi", "status": "correct"}, {"value": "Che hai fatto dopo?", "status": "correct"}, {"value": "Che hai fatto dopo", "status": "correct"}], "feedback": "*Che cosa hai fatto dopo?*"}
  it.a2.unit84.lesson04.exercise07.scrivi_prima: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Prima mi sono alzato, poi ho fatto colazione.", "status": "correct"}, {"value": "Prima mi sono alzato poi ho fatto colazione", "status": "correct"}, {"value": "Prima mi sono alzata, poi ho fatto colazione.", "status": "correct"}, {"value": "Prima mi sono alzata poi ho fatto colazione", "status": "correct"}], "feedback": "*Prima mi sono alzato, poi ho fatto colazione.* A woman would say *alzata*.", "correct_option": "Prima mi sono alzato, poi ho fatto colazione."}
  it.a2.unit84.lesson05.exercise01.leggi_ora: {"instruction": "Read the text and choose the answer.", "correct_option": "At half past six.", "distractors": ["At six.", "At half past seven.", "At seven."], "accepted_answers": [{"value": "At half past six.", "status": "correct"}], "feedback": "*Alle sei e mezza.*"}
  it.a2.unit84.lesson05.exercise02.leggi_ufficio: {"instruction": "Read the text and choose the answer.", "correct_option": "She arrived late at the office.", "distractors": ["She missed the train.", "She stayed at home.", "She arrived early at the office."], "accepted_answers": [{"value": "She arrived late at the office.", "status": "correct"}], "feedback": "*Sono arrivata tardi in ufficio.*"}
  it.a2.unit84.lesson05.exercise03.abbina_parole: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "alle sei e mezza", "right": "at half past six"}, {"left": "tardi", "right": "late"}, {"left": "presto", "right": "early"}, {"left": "in ufficio", "right": "at the office"}, {"left": "il pane", "right": "the bread"}, {"left": "i messaggi", "right": "the messages"}], "status": "correct"}], "feedback": "These expressions come from Giulia's message."}
  it.a2.unit84.lesson05.exercise04.ordina_tardi: {"instruction": "Put the words in order to say 'I arrived late at the office' (a woman speaking).", "correct_option": "Sono arrivata tardi in ufficio", "accepted_answers": [{"value": "Sono arrivata tardi in ufficio", "status": "correct"}], "feedback": "*Sono arrivata* stays together."}
  it.a2.unit84.lesson05.exercise05.traduci_messaggi: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non ho ancora letto i messaggi.", "status": "correct"}, {"value": "Non ho ancora letto i messaggi", "status": "correct"}, {"value": "Non ho letto ancora i messaggi.", "status": "correct"}, {"value": "Non ho letto ancora i messaggi", "status": "correct"}], "feedback": "*Non ho ancora letto*: *ancora* sits before the participle."}
  it.a2.unit84.lesson05.exercise06.detta_sveglia: {"instruction": "Type what you hear.", "correct_response": "Mi sono svegliata alle sei e mezza.", "orthography_strict": true, "feedback": "You heard *Mi sono svegliata alle sei e mezza.*"}
  it.a2.unit84.lesson05.exercise07.detta_tardi: {"instruction": "Type what you hear.", "correct_response": "Sono arrivata tardi in ufficio.", "orthography_strict": true, "feedback": "You heard *Sono arrivata tardi in ufficio.*"}
  it.a2.unit84.lesson06.exercise01.capisci_colazione: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She woke up late.", "distractors": ["She was not hungry.", "She had no coffee.", "She left home early."], "accepted_answers": [{"value": "She woke up late.", "status": "correct"}], "feedback": "Giulia says: *Mi sono svegliata tardi e non ho fatto colazione.*"}
  it.a2.unit84.lesson06.exercise02.capisci_nove: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "At nine.", "distractors": ["At eight.", "At half past nine.", "At ten."], "accepted_answers": [{"value": "At nine.", "status": "correct"}], "feedback": "She says *sono arrivata alle nove*."}
