teaching:
  it.a2.unit34.lesson01.teach_caricatore_difettoso: {title: "il caricatore, difettoso", gloss: "charger, defective", note: "*Difettoso* is useful for a faulty product.", example_gloss: ["The charger is defective.", "This product is defective."]}
  it.a2.unit34.lesson01.teach_non_funziona: {title: "non funziona", gloss: "it does not work", note: "*Funziona* means works or functions.", example_gloss: ["The charger does not work."]}
  it.a2.unit34.lesson01.teach_scontrino: {title: "lo scontrino", gloss: "receipt", note: "In shops, *lo scontrino* is the receipt you need for a return.", example_gloss: ["I have the receipt."]}
  it.a2.unit34.lesson01.teach_questo_difettoso: {title: "Questo caricatore è difettoso.", gloss: "This charger is defective.", note: "*Questo* points to the item you are returning.", example_gloss: ["Good morning, this charger is defective."]}
  it.a2.unit34.lesson02.teach_rimborso_sostituzione: {title: "il rimborso, la sostituzione", gloss: "refund, replacement", note: "These are the two common resolutions for a return.", example_gloss: ["I would like a refund.", "I would like a replacement."]}
  it.a2.unit34.lesson02.teach_vorrei_rimborso: {title: "Vorrei un rimborso, per favore.", gloss: "I would like a refund, please.", note: "*Vorrei* keeps the request polite in a shop.", example_gloss: ["Good morning, I would like a refund, please."]}
  it.a2.unit34.lesson02.teach_vorrei_sostituzione: {title: "Vorrei una sostituzione.", gloss: "I would like a replacement.", note: "Use this if you want another item rather than money back.", example_gloss: ["If possible, I would like a replacement."]}
  it.a2.unit34.lesson02.teach_entro_quattordici: {title: "entro quattordici giorni", gloss: "within fourteen days", note: "*Entro* sets the return window deadline.", example_gloss: ["The return is possible within fourteen days."]}
exercises:
  it.a2.unit34.lesson01.exercise01.choose_difettoso:
    instruction: "Which word means 'defective'?"
    correct_option: "difettoso"
    distractors: ["sostitutivo", "disponibile", "bagnato"]
    accepted_answers: [{value: "difettoso", status: "correct"}]
    feedback: "*Difettoso* means defective or faulty."
  it.a2.unit34.lesson01.exercise02.listen_problem:
    instruction: "Listen and select the complaint you hear."
    correct_option: "Questo caricatore è difettoso e non funziona."
    distractors: ["Vorrei un rimborso, per favore.", "Ho lo scontrino.", "Il reso è possibile entro quattordici giorni."]
    accepted_answers: [{value: "Questo caricatore è difettoso e non funziona.", status: "correct"}]
    feedback: "The speaker explains what is wrong with the item."
  it.a2.unit34.lesson01.exercise03.choose_scontrino:
    instruction: "Which phrase means 'the receipt'?"
    correct_option: "lo scontrino"
    distractors: ["il caricatore", "il rimborso", "la sostituzione"]
    accepted_answers: [{value: "lo scontrino", status: "correct"}]
    feedback: "*Lo scontrino* is the receipt."
  it.a2.unit34.lesson01.exercise04.match_complaint_words:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "charger", right: "il caricatore"}
          - {left: "defective", right: "difettoso"}
          - {left: "it does not work", right: "non funziona"}
          - {left: "receipt", right: "lo scontrino"}
          - {left: "product", right: "il prodotto"}
          - {left: "this", right: "questo"}
        status: "correct"
    feedback: "These phrases identify the item and the problem."
  it.a2.unit34.lesson01.exercise05.order_problem:
    instruction: "Put the words in order to say 'This charger does not work.'"
    accepted_answers: [{value: ["Questo", "caricatore", "non", "funziona"], status: "correct"}]
    feedback: "The correct order is *Questo caricatore non funziona.*"
  it.a2.unit34.lesson01.exercise06.fill_difettoso:
    instruction: "Complete the sentence with the word for 'defective.'"
    accepted_answers: [{value: "difettoso", status: "correct"}]
    feedback: "*Questo caricatore è difettoso* explains the product problem."
  it.a2.unit34.lesson01.exercise07.write_problem:
    instruction: "Write the taught complaint: this charger is defective and does not work; say that you have the receipt."
    accepted_answers:
      - {value: "Questo caricatore è difettoso e non funziona. Ho lo scontrino.", status: "correct"}
      - {value: "Questo caricatore è difettoso e non funziona ho lo scontrino", status: "correct"}
    feedback: "The complaint states the problem and mentions the receipt."
  it.a2.unit34.lesson02.exercise01.choose_rimborso:
    instruction: "Which phrase means 'the refund'?"
    correct_option: "il rimborso"
    distractors: ["la sostituzione", "lo scontrino", "il caricatore"]
    accepted_answers: [{value: "il rimborso", status: "correct"}]
    feedback: "*Il rimborso* means the refund."
  it.a2.unit34.lesson02.exercise02.listen_resolution:
    instruction: "Listen and select the solution the employee offers."
    correct_option: "Possiamo fare un rimborso oppure una sostituzione."
    distractors: ["Questo caricatore è difettoso e non funziona.", "Vorrei un rimborso, per favore.", "Ho lo scontrino."]
    accepted_answers: [{value: "Possiamo fare un rimborso oppure una sostituzione.", status: "correct"}]
    feedback: "The employee offers a refund or a replacement."
  it.a2.unit34.lesson02.exercise03.choose_sostituzione:
    instruction: "Which phrase means 'a replacement'?"
    correct_option: "una sostituzione"
    distractors: ["un rimborso", "uno scontrino", "un reclamo"]
    accepted_answers: [{value: "una sostituzione", status: "correct"}]
    feedback: "*Una sostituzione* means a replacement."
  it.a2.unit34.lesson02.exercise04.match_resolution:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "refund", right: "il rimborso"}
          - {left: "replacement", right: "la sostituzione"}
          - {left: "I would like", right: "vorrei"}
          - {left: "please", right: "per favore"}
          - {left: "within fourteen days", right: "entro quattordici giorni"}
          - {left: "return", right: "il reso"}
        status: "correct"
    feedback: "These phrases cover the request and the return policy."
  it.a2.unit34.lesson02.exercise05.order_rimborso:
    instruction: "Put the words in order to say 'I would like a refund, please.'"
    accepted_answers: [{value: ["Vorrei", "un", "rimborso", "per", "favore"], status: "correct"}]
    feedback: "The correct order is *Vorrei un rimborso, per favore.*"
  it.a2.unit34.lesson02.exercise06.reply_complaint:
    instruction: "A shop employee says *Buongiorno, mi dica.* Reply with the taught polite complaint: this charger is defective and does not work; I would like a refund, please."
    accepted_answers:
      - {value: "Buongiorno, questo caricatore è difettoso e non funziona. Vorrei un rimborso, per favore.", status: "correct"}
      - {value: "Buongiorno questo caricatore è difettoso e non funziona vorrei un rimborso per favore", status: "correct"}
    feedback: "The reply explains the problem and requests a refund politely."
  it.a2.unit34.lesson02.exercise07.write_complaint_message:
    instruction: "Write a formal message: start with *Buongiorno*, say this charger is defective and does not work, say you have the receipt, ask for a refund with *Vorrei un rimborso, per favore*, and end with *Grazie*."
    accepted_answers:
      - {value: "Buongiorno, questo caricatore è difettoso e non funziona. Ho lo scontrino. Vorrei un rimborso, per favore. Grazie.", status: "correct"}
      - {value: "Buongiorno questo caricatore è difettoso e non funziona ho lo scontrino vorrei un rimborso per favore grazie", status: "correct"}
    feedback: "The message gives the problem, proof of purchase, and the requested refund."
