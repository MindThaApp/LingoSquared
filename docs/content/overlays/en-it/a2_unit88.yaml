review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the trapassato prossimo unit (had eaten, had left, had already happened). OPEN NATIVE QUESTIONS: none beyond those in the realization."}
course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses and everyday experience."
  learning_goal: "Talk about the past in Italian: what happened, what used to happen, and what had already happened."
units:
  it.a2.unit88.il_treno_era_gia_partito: {"title": "The train had already left", "description": "Explain what had happened before another past event with the trapassato prossimo: avere or essere in the imperfetto plus the participle, agreement, reflexives, and the contrast with the passato prossimo."}
lessons:
  it.a2.unit88.lesson01.avevo_gia_mangiato: {"title": "I had already eaten"}
  it.a2.unit88.lesson02.ero_arrivata: {"title": "I had arrived"}
  it.a2.unit88.lesson03.sono_arrivato_ma: {"title": "I arrived, but..."}
  it.a2.unit88.lesson04.perche_ero_in_ritardo: {"title": "Why I was late"}
  it.a2.unit88.lesson05.una_brutta_mattina: {"title": "A bad morning"}
  it.a2.unit88.lesson06.giulia_e_marco: {"title": "Giulia and Marco at the party"}
teaching:
  it.a2.unit88.lesson01.teach.verbi: {"title": "Verbs with avere", "gloss": "to eat / to sleep / to finish / to buy / to prepare", "note": "These verbs take *avere*. *Una torta* means 'a cake'.", "example_gloss": ["I had already eaten.", "Marco had not slept.", "Giulia had bought a cake.", "I had not finished the work yet.", "We had prepared lunch."]}
  it.a2.unit88.lesson01.teach.gn_avevo: {"title": "Trapassato prossimo with avere", "gloss": "I had eaten, you had eaten, he/she had eaten, we had eaten, you (plural) had eaten, they had eaten", "note": "The trapassato prossimo is the imperfetto of *avere* (*avevo, avevi, aveva, avevamo, avevate, avevano*) plus the past participle. It names an action that was already finished before another moment in the past."}
  it.a2.unit88.lesson01.teach.gn_participi: {"title": "Participles", "gloss": "I had finished, you had slept, he/she had bought, we had taken, you (plural) had read, they had done", "note": "The participles are the same as in the passato prossimo: regular ones end in *-ato, -uto, -ito*; *preso, letto, fatto* are irregular."}
  it.a2.unit88.lesson01.teach.gn_gia_ancora: {"title": "Già and ancora", "gloss": "I had already eaten. I had not finished yet.", "note": "*Già* ('already') and *ancora* ('yet') go between the auxiliary and the participle. *Non ... ancora* means 'not yet'."}
  it.a2.unit88.lesson01.teach.frasi: {"title": "Three sentences", "gloss": "I had already eaten. Giulia had not finished yet. We had bought the cake."}
  it.a2.unit88.lesson02.teach.movimento: {"title": "Movement verbs", "gloss": "to arrive / to leave / to go out / to come back / to go", "note": "These verbs take *essere*. *Alla stazione* means 'at the station'; *in ufficio* means 'at the office'.", "example_gloss": ["I had arrived at the station (a woman speaking).", "The train had already left.", "Marco had gone out of the house.", "We had come back home.", "I had gone to the office (a man speaking)."]}
  it.a2.unit88.lesson02.teach.riflessivi: {"title": "Reflexive verbs", "gloss": "to wake up / to get up / to get dressed", "note": "Reflexive verbs always take *essere*.", "example_gloss": ["I had woken up early (a woman speaking).", "Marco had got up late.", "We had got dressed in a hurry."]}
  it.a2.unit88.lesson02.teach.gn_essere: {"title": "Trapassato prossimo with essere", "gloss": "I had arrived, you had arrived, he had arrived, we had arrived, you (plural) had arrived, they had arrived", "note": "With verbs of movement, the trapassato prossimo is the imperfetto of *essere* (*ero, eri, era, eravamo, eravate, erano*) plus the participle."}
  it.a2.unit88.lesson02.teach.gn_accordo: {"title": "Agreement with essere", "gloss": "Giulia had gone out. Marco had left. You had left. We had gone out. You (plural) had gone. The friends had left.", "note": "With *essere* the participle agrees with the subject: *-o* (masculine singular), *-a* (feminine singular), *-i* (masculine or mixed plural), *-e* (feminine plural)."}
  it.a2.unit88.lesson02.teach.gn_riflessivi: {"title": "Reflexive verbs", "gloss": "I had woken up, you had woken up, he had woken up, we had woken up, you (plural) had woken up, they had woken up", "note": "The reflexive pronoun (*mi, ti, si, ci, vi, si*) comes before *ero, eri, era...*, and the participle agrees with the subject."}
  it.a2.unit88.lesson03.teach.parole: {"title": "Linking words", "gloss": "when / because / then / but / already / yet", "note": "*Perché* means both 'why' and 'because'.", "example_gloss": ["I had not eaten yet.", "I was tired because I had not slept.", "I had already finished, then I went out."]}
  it.a2.unit88.lesson03.teach.festa: {"title": "The party", "gloss": "the party / the friends / the cake", "example_gloss": ["When I arrived at the party, the friends had already eaten the cake (a woman speaking).", "I went to the party (a man speaking)."]}
  it.a2.unit88.lesson03.teach.gn_contrasto: {"title": "Passato prossimo or trapassato?", "gloss": "When I arrived, the train had already left. I arrived, but the train had already left.", "note": "The passato prossimo (*sono arrivato*) gives the main event. The trapassato prossimo (*era già partito*) gives what had already happened before it."}
  it.a2.unit88.lesson03.teach.gn_perche: {"title": "Giving a reason", "gloss": "I was tired because I had not slept. Marco was late because he had missed the train.", "note": "*Perché* introduces the reason. The reason happened earlier than the situation it explains, so it uses the trapassato prossimo."}
  it.a2.unit88.lesson03.teach.gn_ordine: {"title": "Order of events", "gloss": "I had already finished, then I went out. When Giulia arrived, the friends had already eaten.", "note": "Use *poi* for the next step in a series. With *quando* plus the passato prossimo, the trapassato prossimo says what was already done."}
  it.a2.unit88.lesson04.teach.motivi: {"title": "Reasons", "gloss": "late / the alarm clock / the phone / the road", "note": "*In ritardo* means 'late' (behind schedule); *tardi* means 'late in the day'.", "example_gloss": ["I was late because I had not heard the alarm clock.", "I went back home because I had forgotten the phone (a man speaking).", "The alarm clock had not rung."]}
  it.a2.unit88.lesson04.teach.participi: {"title": "More participles", "gloss": "to lose, miss - lost / to hear - heard / to ring - rung / to forget - forgotten", "note": "*Perso* is an irregular participle.", "example_gloss": ["I missed the train because I had left late (a man speaking).", "Giulia had lost her way."]}
  it.a2.unit88.lesson04.teach.gn_perche: {"title": "Explaining why", "gloss": "I was late because the alarm clock had not rung.", "note": "To explain a past situation, give the reason with *perché* and the trapassato prossimo."}
  it.a2.unit88.lesson04.teach.gn_effetto: {"title": "Result and cause", "gloss": "I missed the train because I had left late. I went back home because I had forgotten the phone.", "note": "The result is in the passato prossimo (*ho perso, sono tornato*); the earlier cause is in the trapassato prossimo (*ero uscito, avevo dimenticato*)."}
  it.a2.unit88.lesson04.teach.gn_quando: {"title": "Quando plus trapassato", "gloss": "When Marco arrived, Giulia had already gone out.", "note": "After *quando*, the passato prossimo marks the moment (*è arrivato*), and the trapassato prossimo says what was already over (*era già uscita*)."}
  it.a2.unit88.lesson04.teach.successo: {"title": "What had happened?", "gloss": "What had happened?", "note": "*Successo* is the participle of *succedere* ('to happen'), which takes *essere*."}
  it.a2.unit88.lesson05.teach.parole: {"title": "Words for the text", "gloss": "very / well / so / another / at ten / to wait", "note": "*E così* means 'and so'.", "example_gloss": ["I slept very well.", "I waited for another train.", "I arrived at the office at ten (a man speaking)."]}
  it.a2.unit88.lesson05.teach.gn_lettura: {"title": "Cause and effect", "gloss": "The alarm clock had not rung, and so I woke up at eight.", "note": "The earlier cause is in the trapassato prossimo (*non aveva suonato*); the result is in the passato prossimo (*mi sono svegliato*)."}
  it.a2.unit88.lesson05.teach.lettura: {"title": "Marco writes to a friend", "gloss": "What a morning! I was very tired because I had not slept well. The alarm clock had not rung, and so I woke up at eight. I left the house in a hurry, but when I arrived at the station, the train had already left. I waited for another train and arrived at the office at ten. Marco", "note": "Notice how the passato prossimo tells the story and the trapassato prossimo explains what had happened before."}
  it.a2.unit88.lesson06.teach.d1: {"title": "Giulia asks", "gloss": "Giulia: Marco, what happened? You are very late!"}
  it.a2.unit88.lesson06.teach.d2: {"title": "Marco explains", "gloss": "Marco: Sorry, Giulia! The alarm clock had not rung and I woke up late."}
  it.a2.unit88.lesson06.teach.d3: {"title": "Giulia asks about the train", "gloss": "Giulia: And the train? Didn't you take the seven o'clock train?"}
  it.a2.unit88.lesson06.teach.d4: {"title": "Marco tells more", "gloss": "Marco: Yes, but when I arrived at the station, the train had already left. I waited for another train."}
  it.a2.unit88.lesson06.teach.d5: {"title": "Giulia reassures him", "gloss": "Giulia: Luckily you are here! We had already eaten, but the cake is still here."}
  it.a2.unit88.lesson06.teach.d6: {"title": "Marco is happy", "gloss": "Marco: Thank you, Giulia! I had not eaten yet."}
exercises:
  it.a2.unit88.lesson01.exercise01.scegli_mangiato: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Avevo già mangiato.", "distractors": ["Ho già mangiato.", "Avevo già mangiare.", "Avevo già mangiata."], "accepted_answers": [{"value": "Avevo già mangiato.", "status": "correct"}], "feedback": "*Avevo* (imperfetto of *avere*) plus *mangiato* gives 'I had eaten'."}
  it.a2.unit88.lesson01.exercise02.scegli_dormito: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco non aveva dormito.", "distractors": ["Marco non aveva dormire.", "Marco non era dormito.", "Marco non avevo dormito."], "accepted_answers": [{"value": "Marco non aveva dormito.", "status": "correct"}], "feedback": "*Marco* takes *aveva*, followed by the participle *dormito*."}
  it.a2.unit88.lesson01.exercise03.abbina_trapassato: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "avevo finito", "right": "I had finished"}, {"left": "avevi dormito", "right": "you had slept"}, {"left": "aveva comprato", "right": "he/she had bought"}, {"left": "avevamo preso", "right": "we had taken"}, {"left": "avevate letto", "right": "you (plural) had read"}, {"left": "avevano fatto", "right": "they had done"}], "status": "correct"}], "feedback": "Each form is the imperfetto of *avere* plus a participle."}
  it.a2.unit88.lesson01.exercise04.ordina_torta: {"instruction": "Put the words in order to say 'Giulia had bought a cake.'", "correct_option": "Giulia aveva comprato una torta", "accepted_answers": [{"value": "Giulia aveva comprato una torta", "status": "correct"}], "feedback": "*Aveva comprato* stays together."}
  it.a2.unit88.lesson01.exercise05.completa_ancora: {"instruction": "Fill in the word that means 'still' or 'yet' in this sentence.", "correct_option": "ancora", "accepted_answers": [{"value": "ancora", "status": "correct"}], "feedback": "*Non ... ancora* means 'not yet'."}
  it.a2.unit88.lesson01.exercise06.traduci_lavoro: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Avevo già finito il lavoro.", "status": "correct"}, {"value": "Avevo già finito il lavoro", "status": "correct"}], "feedback": "*Già* goes between *avevo* and *finito*."}
  it.a2.unit88.lesson01.exercise07.scrivi_mangiato: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Marco non aveva ancora mangiato.", "status": "correct"}, {"value": "Marco non aveva ancora mangiato", "status": "correct"}], "feedback": "*Non aveva ancora mangiato.*", "correct_option": "Marco non aveva ancora mangiato."}
  it.a2.unit88.lesson02.exercise01.scegli_partito: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Il treno era già partito.", "distractors": ["Il treno aveva già partito.", "Il treno era già partita.", "Il treno erano già partito."], "accepted_answers": [{"value": "Il treno era già partito.", "status": "correct"}], "feedback": "*Partire* takes *essere*, and *treno* is masculine singular: *era partito*."}
  it.a2.unit88.lesson02.exercise02.scegli_arrivata: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia era arrivata alla stazione.", "distractors": ["Giulia era arrivato alla stazione.", "Giulia aveva arrivata alla stazione.", "Giulia erano arrivata alla stazione."], "accepted_answers": [{"value": "Giulia era arrivata alla stazione.", "status": "correct"}], "feedback": "*Arrivare* takes *essere*, and *arrivata* agrees with feminine *Giulia*."}
  it.a2.unit88.lesson02.exercise03.abbina_essere: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "ero arrivato", "right": "I had arrived"}, {"left": "eri partita", "right": "you had left (fem.)"}, {"left": "era uscito", "right": "he had gone out"}, {"left": "eravamo tornati", "right": "we had come back"}, {"left": "eravate andati", "right": "you (plural) had gone"}, {"left": "erano partite", "right": "they had left (fem.)"}], "status": "correct"}], "feedback": "The participle agrees with the subject."}
  it.a2.unit88.lesson02.exercise04.ordina_svegliata: {"instruction": "Put the words in order to say 'I had woken up early' (a woman speaking).", "correct_option": "Mi ero svegliata presto", "accepted_answers": [{"value": "Mi ero svegliata presto", "status": "correct"}], "feedback": "*Mi ero svegliata* stays together, with *mi* first."}
  it.a2.unit88.lesson02.exercise05.completa_arrivata: {"instruction": "Complete with the correct form of arrivare.", "correct_option": "arrivata", "accepted_answers": [{"value": "arrivata", "status": "correct"}], "feedback": "*Arrivata* is feminine singular, matching *Giulia*."}
  it.a2.unit88.lesson02.exercise06.traduci_usciti: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Eravamo già usciti.", "status": "correct"}, {"value": "Eravamo già usciti", "status": "correct"}], "feedback": "*Uscire* takes *essere*: *eravamo usciti*."}
  it.a2.unit88.lesson02.exercise07.scrivi_uscito: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Marco era uscito di casa.", "status": "correct"}, {"value": "Marco era uscito di casa", "status": "correct"}], "feedback": "*Uscire* takes *essere*: *era uscito*.", "correct_option": "Marco era uscito di casa."}
  it.a2.unit88.lesson03.exercise01.scegli_quando: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Quando sono arrivato, il treno era già partito.", "distractors": ["Quando sono arrivato, il treno era già partita.", "Quando ero arrivato, il treno è già partito.", "Quando sono arrivato, il treno aveva già partito."], "accepted_answers": [{"value": "Quando sono arrivato, il treno era già partito.", "status": "correct"}], "feedback": "The arrival uses the passato prossimo; the earlier departure uses the trapassato *era già partito*."}
  it.a2.unit88.lesson03.exercise02.scegli_stanco: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ero stanco perché non avevo dormito.", "distractors": ["Ero stanco perché non avevo dormire.", "Ero stanco perché non ero dormito.", "Ero stanco ma non avevo dormito."], "accepted_answers": [{"value": "Ero stanco perché non avevo dormito.", "status": "correct"}], "feedback": "*Perché* gives the reason, and *dormire* takes *avere*: *non avevo dormito*."}
  it.a2.unit88.lesson03.exercise03.abbina_parole: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "già", "right": "already"}, {"left": "ancora", "right": "yet, still"}, {"left": "perché", "right": "because"}, {"left": "poi", "right": "then"}, {"left": "quando", "right": "when"}, {"left": "ma", "right": "but"}], "status": "correct"}], "feedback": "These words link events in the past."}
  it.a2.unit88.lesson03.exercise04.ordina_quando: {"instruction": "Put the words in order to say 'When I arrived, the train had already left' (a woman speaking).", "correct_option": "Quando sono arrivata il treno era già partito", "accepted_answers": [{"value": "Quando sono arrivata il treno era già partito", "status": "correct"}], "feedback": "The main event comes first, then the earlier one."}
  it.a2.unit88.lesson03.exercise05.completa_gia: {"instruction": "Fill in the word that means 'already' in this sentence.", "correct_option": "già", "accepted_answers": [{"value": "già", "status": "correct"}], "feedback": "*Già* ('already') goes between *era* and *partito*."}
  it.a2.unit88.lesson03.exercise06.traduci_festa: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Quando sono arrivata alla festa, gli amici avevano già mangiato la torta.", "status": "correct"}, {"value": "Quando sono arrivata alla festa gli amici avevano già mangiato la torta", "status": "correct"}, {"value": "Quando sono arrivato alla festa, gli amici avevano già mangiato la torta.", "status": "correct"}, {"value": "Quando sono arrivato alla festa gli amici avevano già mangiato la torta", "status": "correct"}], "feedback": "The arrival uses *essere*; the earlier eating uses *avere* in the trapassato."}
  it.a2.unit88.lesson03.exercise07.scrivi_ma: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono arrivato, ma il treno era già partito.", "status": "correct"}, {"value": "Sono arrivato ma il treno era già partito", "status": "correct"}, {"value": "Sono arrivata, ma il treno era già partito.", "status": "correct"}, {"value": "Sono arrivata ma il treno era già partito", "status": "correct"}], "feedback": "*Sono arrivato* is the main event; *era già partito* happened before it.", "correct_option": "Sono arrivato, ma il treno era già partito."}
  it.a2.unit88.lesson04.exercise01.scegli_sveglia: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ero in ritardo perché la sveglia non aveva suonato.", "distractors": ["Ero in ritardo perché la sveglia non aveva suonata.", "Ero in ritardo perché la sveglia non aveva suonare.", "Ero in ritardo ma la sveglia non aveva suonato."], "accepted_answers": [{"value": "Ero in ritardo perché la sveglia non aveva suonato.", "status": "correct"}], "feedback": "*Suonare* takes *avere* here: *aveva suonato*."}
  it.a2.unit88.lesson04.exercise02.scegli_telefono: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sono tornato a casa perché avevo dimenticato il telefono.", "distractors": ["Sono tornato a casa perché avevo dimenticare il telefono.", "Sono tornato a casa perché ero dimenticato il telefono.", "Ho tornato a casa perché avevo dimenticato il telefono."], "accepted_answers": [{"value": "Sono tornato a casa perché avevo dimenticato il telefono.", "status": "correct"}], "feedback": "*Tornare* takes *essere*; *dimenticare* takes *avere*."}
  it.a2.unit88.lesson04.exercise03.abbina_motivi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ero stanco perché non avevo dormito.", "right": "I was tired because I had not slept."}, {"left": "Ho perso il treno perché ero uscito tardi.", "right": "I missed the train because I had left late."}, {"left": "Giulia aveva perso la strada.", "right": "Giulia had lost her way."}, {"left": "La sveglia non aveva suonato.", "right": "The alarm clock had not rung."}, {"left": "Che cosa era successo?", "right": "What had happened?"}, {"left": "Quando Marco è arrivato, Giulia era già uscita.", "right": "When Marco arrived, Giulia had already gone out."}], "status": "correct"}], "feedback": "Each sentence explains what had happened before."}
  it.a2.unit88.lesson04.exercise04.ordina_sentito: {"instruction": "Put the words in order to say 'I was late because I had not heard the alarm clock.'", "correct_option": "Ero in ritardo perché non avevo sentito la sveglia", "accepted_answers": [{"value": "Ero in ritardo perché non avevo sentito la sveglia", "status": "correct"}], "feedback": "The reason follows *perché*."}
  it.a2.unit88.lesson04.exercise05.completa_dimenticato: {"instruction": "Complete with the past participle of dimenticare.", "correct_option": "dimenticato", "accepted_answers": [{"value": "dimenticato", "status": "correct"}], "feedback": "*Dimenticare* gives *dimenticato*."}
  it.a2.unit88.lesson04.exercise06.traduci_uscita: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Quando Marco è arrivato, Giulia era già uscita.", "status": "correct"}, {"value": "Quando Marco è arrivato Giulia era già uscita", "status": "correct"}, {"value": "Quando è arrivato Marco, Giulia era già uscita.", "status": "correct"}, {"value": "Quando è arrivato Marco, Giulia era già uscita", "status": "correct"}, {"value": "Quando Marco è arrivato, Giulia era già uscita", "status": "correct"}], "feedback": "The moment is in the passato prossimo; the earlier event in the trapassato."}
  it.a2.unit88.lesson04.exercise07.scrivi_perso: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ho perso il treno perché ero uscita tardi.", "status": "correct"}, {"value": "Ho perso il treno perché ero uscita tardi", "status": "correct"}, {"value": "Ho perso il treno perché ero uscito tardi.", "status": "correct"}, {"value": "Ho perso il treno perché ero uscito tardi", "status": "correct"}], "feedback": "*Ho perso* is the result; *ero uscita* is the earlier cause.", "correct_option": "Ho perso il treno perché ero uscita tardi."}
  it.a2.unit88.lesson05.exercise01.leggi_stazione: {"instruction": "Read the text and choose the answer.", "correct_option": "The train had already left.", "distractors": ["The train had not left yet.", "The train was late.", "His friend had already gone home."], "accepted_answers": [{"value": "The train had already left.", "status": "correct"}], "feedback": "*Il treno era già partito.*"}
  it.a2.unit88.lesson05.exercise02.leggi_sveglia: {"instruction": "Read the text and choose the answer.", "correct_option": "The alarm clock had not rung.", "distractors": ["He had gone to bed early.", "He was not tired.", "He wanted to sleep late."], "accepted_answers": [{"value": "The alarm clock had not rung.", "status": "correct"}], "feedback": "*La sveglia non aveva suonato, e così mi sono svegliato alle otto.*"}
  it.a2.unit88.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "la stazione", "right": "the station"}, {"left": "la sveglia", "right": "the alarm clock"}, {"left": "in fretta", "right": "in a hurry"}, {"left": "un altro treno", "right": "another train"}, {"left": "alle dieci", "right": "at ten"}, {"left": "così", "right": "so"}], "status": "correct"}], "feedback": "These expressions come from Marco's text."}
  it.a2.unit88.lesson05.exercise04.ordina_fretta: {"instruction": "Put the words in order to say 'I left the house in a hurry' (a man speaking).", "correct_option": "Sono uscito di casa in fretta", "accepted_answers": [{"value": "Sono uscito di casa in fretta", "status": "correct"}], "feedback": "*Sono uscito* stays together."}
  it.a2.unit88.lesson05.exercise05.traduci_aspettato: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ho aspettato un altro treno.", "status": "correct"}, {"value": "Ho aspettato un altro treno", "status": "correct"}], "feedback": "*Aspettare* takes *avere*: *ho aspettato*."}
