course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (innanzitutto, per
    esempio, una ricerca dimostra che), acknowledge the strongest opposing
    point (da un lato...dall'altro, è vero che, alcuni pensano che), and
    rebut it without conceding (tuttavia, ciò non toglie che, insomma),
    around the everyday debate of remote work.

units:
  it.b2.unit01.argomentazione:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  it.b2.unit01.lesson01.prendere_posizione:
    title: "Taking a position"
  it.b2.unit01.lesson02.dare_argomenti:
    title: "Giving reasons and evidence"
  it.b2.unit01.lesson03.riconoscere_altro_lato:
    title: "Acknowledging the other side"
  it.b2.unit01.lesson04.controbattere:
    title: "Rebutting"
  it.b2.unit01.lesson05.leggere_testo_argomentativo:
    title: "Reading an argument"
  it.b2.unit01.lesson06.difendere_posizione:
    title: "Defending a position"

teaching:
  it.b2.unit01.lesson01.teach.lavorare_da_remoto:
    title: "working remotely"
    gloss: "to work remotely / working remotely"
    note: "*Lavorare da remoto* is the everyday phrase for working remotely. It is the topic this whole unit argues about."
    example_gloss: "Working remotely lets you save time."
  it.b2.unit01.lesson01.teach.lavorare_in_ufficio:
    title: "working in the office"
    gloss: "to work in the office"
    note: "The opposite pole of the debate. *In ufficio* means 'in/at the office'."
  it.b2.unit01.lesson01.teach.punto_di_vista:
    title: "a point of view"
    gloss: "a point of view"
    note: "*Un punto di vista* is the position you are going to defend -- what the whole argument is built around."
    example_gloss: "I have a clear point of view."
  it.b2.unit01.lesson01.teach.credo_che:
    title: "I believe that..."
    gloss: "I believe that..."
    note: "*Credo che...* introduces your own opinion and, crucially, sends the following verb into the congiuntivo (subjunctive): *credo che...sia* (not *credo che...è*). This is the single most common B2 trap for English speakers."
  it.b2.unit01.lesson01.teach.secondo_me:
    title: "In my opinion..."
    gloss: "In my opinion... / According to me..."
    note: "*Secondo me* is a softer, very common way to open an opinion. Unlike *credo che*, it does NOT trigger the congiuntivo: *Secondo me, lavorare da remoto è meglio* (plain indicative *è*)."
  it.b2.unit01.lesson01.teach.e_verbo:
    title: is
    gloss: is
    example_gloss: "The coffee is good."
  it.b2.unit01.lesson01.teach.meglio:
    title: better
    gloss: better
    example_gloss: "It's better to work from home."
  it.b2.unit01.lesson01.teach.che_comparativo:
    title: than
    gloss: than
    note: "*Che* is 'than' in a comparison between two verbs/clauses: *meglio che lavorare in ufficio* = 'better than working in the office'."
    example_gloss: "Drinking tea is better than drinking coffee."
  it.b2.unit01.lesson01.teach.claim_model:
    title: "I believe that working remotely is better than working in the office."
    gloss: "I believe that working remotely is better than working in the office."
    note: "The model claim for this unit. Notice the congiuntivo after *credo che*: *...che lavorare da remoto SIA meglio...*, not *è*."
  it.b2.unit01.lesson01.teach.sono_daccordo:
    title: "I agree."
    gloss: "I agree."
    note: "*Essere d'accordo* = 'to agree'. The opposite is *non essere d'accordo* (to disagree)."
  it.b2.unit01.lesson01.teach.grammar_posizione:
    title: "I believe that working remotely is better than working in the office. In my opinion, working remotely is better."
    gloss: "I believe that working remotely is better than working in the office. In my opinion, working remotely is better."
    note: "A claim is the position you will defend. *Credo che* (+ congiuntivo) and *secondo me* (+ indicativo) both signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  it.b2.unit01.lesson02.teach.perche:
    title: because
    gloss: because
    note: "*Perché* is the everyday, default word for 'because' in Italian, used in both questions and answers."
    example_gloss: "I work from home because it's convenient."
  it.b2.unit01.lesson02.teach.poiche:
    title: "because / since"
    gloss: "because / since (more formal or written)"
    note: "*Poiché* also means 'because', but reads as slightly more formal or written than *perché*. Both are correct and common at B2."
    example_gloss: "I stay home, since I am tired."
  it.b2.unit01.lesson02.teach.innanzitutto:
    title: "first of all"
    gloss: "first of all / firstly"
    note: "*Innanzitutto* numbers your first, strongest reason -- the classic way to open your supporting evidence."
    example_gloss: "First of all, it's important."
  it.b2.unit01.lesson02.teach.inoltre:
    title: "in addition"
    gloss: "in addition / moreover"
    note: "*Inoltre* adds a further reason after *innanzitutto*."
    example_gloss: "In addition, you save time."
  it.b2.unit01.lesson02.teach.per_esempio:
    title: "for example"
    gloss: "for example"
    note: "*Per esempio* introduces a concrete example that backs up a reason."
  it.b2.unit01.lesson02.teach.ricerca_dimostra:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*Una ricerca dimostra che...* is how you cite evidence in an argument. The *che* here does NOT trigger the congiuntivo, because *dimostrare che* states a fact, not an opinion: *dimostra che...è*, not *sia*."
  it.b2.unit01.lesson02.teach.tempo_di_viaggio:
    title: "travel time"
    gloss: "travel time / commute time"
    example_gloss: "You save a lot of travel time."
  it.b2.unit01.lesson02.teach.risparmiare:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Risparmiare* = to save. Everyday informal form: *risparmi* (you save)."
    example_gloss: "You can save a lot of time."
  it.b2.unit01.lesson02.teach.molto:
    title: "a lot / much"
    gloss: "a lot / much"
    example_gloss: "I save a lot of time."
  it.b2.unit01.lesson02.teach.chi_lavora_da_remoto:
    title: "people who work remotely"
    gloss: "the one(s) who work(s) remotely / people who work remotely"
    note: "*Chi* is an indefinite relative pronoun meaning 'the one(s) who' or 'people who' -- it needs no separate noun: *chi lavora da remoto* = 'people who work remotely' (the same meaning as *le persone che lavorano da remoto*, but shorter)."
  it.b2.unit01.lesson02.teach.piu_produttivo:
    title: "more productive"
    gloss: "more productive"
    example_gloss: "At home I am more productive."
  it.b2.unit01.lesson02.teach.grammar_argomenti:
    title: "Firstly, you save a lot of travel time. In addition, people who work remotely are more productive."
    gloss: "Firstly, you save a lot of travel time. In addition, people who work remotely are more productive."
    note: "Support = the reasons and evidence behind your claim. Number them (*innanzitutto*, *inoltre*), give examples (*per esempio*), and cite evidence (*una ricerca dimostra che*) so the argument is easy to follow."

  it.b2.unit01.lesson03.teach.da_un_lato:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Da un lato...* opens a balanced view; it is almost always paired with *dall'altro...* to introduce the opposing point you are about to acknowledge."
  it.b2.unit01.lesson03.teach.dallaltro:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Dall'altro (lato)...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  it.b2.unit01.lesson03.teach.e_vero_che:
    title: "it's true that..."
    gloss: "it's true that..."
    note: "*È vero che...* grants that a point is factually correct -- and, because it states a fact, keeps the plain indicative: *è vero che...mancano*, not a congiuntivo."
  it.b2.unit01.lesson03.teach.certo:
    title: "of course"
    gloss: "of course / certainly"
    note: "*Certo* concedes that the opposing point is fair -- a polite way to acknowledge before you push back."
    example_gloss: "Of course, you're right."
  it.b2.unit01.lesson03.teach.alcuni_pensano_che:
    title: "some people think that the contact with colleagues is missing"
    gloss: "some people think that the contact with colleagues is missing"
    note: "*Alcuni pensano che...* introduces a common objection without owning it yourself. *Pensare che* is an opinion verb, so it triggers the congiuntivo: *pensano che manchi* (agreeing with singular *il contatto*), not *manca*."
  it.b2.unit01.lesson03.teach.colleghi:
    title: colleagues
    gloss: colleagues
    note: "*I colleghi* (plural of *il collega*) -- the classic point people raise against working remotely is missing contact with them."
    example_gloss: "I often see my colleagues."
  it.b2.unit01.lesson03.teach.mancare:
    title: "to miss"
    gloss: "to miss (someone/something)"
    note: "*Mancare* flips the English construction: the thing missed is the GRAMMATICAL SUBJECT, and the person is an indirect object. 'You miss your colleagues' = *ti mancano i colleghi*, literally 'colleagues are missing to you' -- the verb agrees with *i colleghi* (plural: *mancano*), not with 'you'. A singular missed thing takes *manca*: *ti manca il contatto* (you miss the contact)."
    example_gloss: "I miss Italian coffee."
  it.b2.unit01.lesson03.teach.contatto_con:
    title: "the contact with..."
    gloss: "the contact with..."
    note: "*Il contatto con...* -- singular, so it pairs with *manca*, not *mancano*."
  it.b2.unit01.lesson03.teach.a_volte:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work from home."
  it.b2.unit01.lesson03.teach.piacevole:
    title: "pleasant / nice"
    gloss: "pleasant / nice"
    example_gloss: "Working remotely is pleasant."
  it.b2.unit01.lesson03.teach.grammar_concessione:
    title: "On the one hand working remotely is pleasant, on the other hand you sometimes miss your colleagues."
    gloss: "On the one hand working remotely is pleasant, on the other hand you sometimes miss your colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Da un lato... dall'altro...*, *è vero che*, and *alcuni pensano che* all do this without giving up your own position."

  it.b2.unit01.lesson04.teach.tuttavia:
    title: however
    gloss: however
    note: "*Tuttavia* pivots from the acknowledged point back to your claim -- a common, slightly formal 'however'."
    example_gloss: "It's convenient, however it costs more."
  it.b2.unit01.lesson04.teach.pero:
    title: but
    gloss: but
    note: "*Però* is the everyday, more spoken 'but/however' -- interchangeable with *tuttavia* in most everyday arguments, just less formal."
    example_gloss: "It's convenient, but not perfect."
  it.b2.unit01.lesson04.teach.in_ogni_caso:
    title: "in any case"
    gloss: "in any case / at any rate"
  it.b2.unit01.lesson04.teach.cio_non_toglie_che:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Ciò non toglie che...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. It triggers the congiuntivo: *ciò non toglie che...pesino* (agreeing with plural *i vantaggi*) or *...pesi* (agreeing with singular *la libertà*)."
  it.b2.unit01.lesson04.teach.insomma:
    title: "in short"
    gloss: "in short"
    note: "*Insomma* signposts your conclusion -- it wraps the argument up."
    example_gloss: "In short, it's the best choice."
  it.b2.unit01.lesson04.teach.vantaggi:
    title: advantages
    gloss: "advantages (plural of vantaggio)"
    example_gloss: "Working remotely has many advantages."
  it.b2.unit01.lesson04.teach.svantaggi:
    title: disadvantages
    gloss: "disadvantages (plural of svantaggio)"
    example_gloss: "It also has some disadvantages."
  it.b2.unit01.lesson04.teach.pesare_di_piu:
    title: "to weigh more"
    gloss: "to weigh more / to count for more"
    note: "*Pesare* here means 'to carry weight' in an argument. *I vantaggi pesano di più degli svantaggi* = 'the advantages weigh more than the disadvantages' (indicative). After *ciò non toglie che*, the congiuntivo forms *pesino* (plural) / *pesi* (singular) are used instead."
    example_gloss: "The advantages weigh more than the disadvantages."
  it.b2.unit01.lesson04.teach.avere_vantaggi:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Avere* = 'to have'; *ha* is its 3rd-person form. *Lavorare in ufficio ha vantaggi* concedes the other side has advantages -- before you rebut."
  it.b2.unit01.lesson04.teach.liberta:
    title: freedom
    gloss: freedom
    example_gloss: "Working remotely gives a lot of freedom."
  it.b2.unit01.lesson04.teach.grammar_controbattere:
    title: "That's true, however that does not change the fact that the advantages weigh more. In short, the advantages weigh more."
    gloss: "That's true, however that does not change the fact that the advantages weigh more. In short, the advantages weigh more."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Tuttavia*, *però*, and *ciò non toglie che* all pivot back to your position; *insomma* signposts the conclusion."

  it.b2.unit01.lesson05.teach.testo:
    title: "Reading: remote work is a good development"
    gloss: "More and more people work remotely. I believe that this is a good development. Firstly, you save a lot of travel time, and research shows that people who work remotely are often more productive. Of course, some say that at home you miss the contact with colleagues. That's true, but that does not change the fact that you can still call and video-call. In short, the advantages weigh more than the disadvantages."
    glosses:
      Sempre: "always (sempre più = more and more)"
      questo: "this"
      persone: "people"
      lavorano: "work (from lavorare, to work)"
      spesso: "often"
      dicono: "they say (from dire, to say)"
      si: "one / people (impersonal si)"
      possa: "can (congiuntivo of potere, triggered by ciò non toglie che)"
      ancora: "still"
      telefonare: "to phone / to call"
      fare: "to do / to make"
      videochiamate: "video calls"

  it.b2.unit01.lesson06.teach.perche_lo_pensi:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Perché lo pensi?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  it.b2.unit01.lesson06.teach.non_hai_tutti_i_torti:
    title: "You're not entirely wrong."
    gloss: "You're not entirely wrong. / You have a point."
    note: "*Non hai tutti i torti* (literally 'you don't have all the wrongs') is a natural colloquial way to concede that the other person has a fair point in a discussion."
  it.b2.unit01.lesson06.teach.dialogue_elena_claim:
    title: "Elena: I believe that working remotely is better than working in the office."
    gloss: "Elena: I believe that working remotely is better than working in the office."
  it.b2.unit01.lesson06.teach.dialogue_sam_why:
    title: "Sam: Why do you think that?"
    gloss: "Sam: Why do you think that?"
  it.b2.unit01.lesson06.teach.dialogue_elena_support:
    title: "Elena: Firstly, you save a lot of travel time, and research shows that people who work remotely are more productive."
    gloss: "Elena: Firstly, you save a lot of travel time, and research shows that people who work remotely are more productive."
  it.b2.unit01.lesson06.teach.dialogue_sam_objection:
    title: "Sam: Of course, you sometimes miss your colleagues."
    gloss: "Sam: Of course, you sometimes miss your colleagues."
  it.b2.unit01.lesson06.teach.dialogue_elena_rebuttal:
    title: "Elena: That's true, but that does not change the fact that the advantages weigh more."
    gloss: "Elena: That's true, but that does not change the fact that the advantages weigh more."
  it.b2.unit01.lesson06.teach.dialogue_sam_concede:
    title: "Sam: You're not entirely wrong."
    gloss: "Sam: You're not entirely wrong."
  it.b2.unit01.lesson06.teach.grammar_argomento_completo:
    title: "A full argument: claim, support, objection, rebuttal"
    gloss: "I believe that working remotely is better than working in the office. Firstly, you save a lot of travel time. Of course, you sometimes miss your colleagues. That does not change the fact that the advantages weigh more."
    note: "A complete argument has four moves: claim (*credo che...*), support (*innanzitutto...*), acknowledged objection (*certo...*), and rebuttal (*ciò non toglie che...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  it.b2.unit01.lesson01.exercise01.recognize_punto_di_vista:
    instruction: "What does this phrase mean?"
    correct_option: "a point of view"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "a point of view", status: correct}]
    feedback: "*Un punto di vista* is a point of view -- the claim you defend."
  it.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I believe that working remotely is better than working in the office."
    distractors: ["I believe that working in the office is better than working remotely.", "I believe that working remotely is nicer than travelling.", "I know that working remotely is better than working in the office."]
    accepted_answers: [{value: "I believe that working remotely is better than working in the office.", status: correct}]
    feedback: "*Credo che lavorare da remoto sia meglio che lavorare in ufficio* means I believe that working remotely is better than working in the office."
  it.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"lavorare da remoto": "working remotely", "lavorare in ufficio": "working in the office", "un punto di vista": "a point of view", "Credo che...": "I believe that...", "Secondo me...": "In my opinion...", meglio: better, che: than, "Sono d'accordo.": "I agree."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  it.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I believe that working remotely is better."
    accepted_answers:
      - {value: "Credo che lavorare da remoto sia meglio", status: correct}
      - {value: "Credo che sia meglio lavorare da remoto", status: correct}
    feedback: "*Credo che lavorare da remoto sia meglio* means I believe that working remotely is better."
  it.b2.unit01.lesson01.exercise05.translate_secondo_me:
    instruction: "Translate into Italian: In my opinion, working remotely is better."
    accepted_answers:
      - {value: "Secondo me lavorare da remoto è meglio", status: correct}
      - {value: "Secondo me, lavorare da remoto è meglio", status: correct}
      - {value: "Secondo me è meglio lavorare da remoto", status: correct}
    feedback: "*Secondo me lavorare da remoto è meglio* means in my opinion, working remotely is better."
  it.b2.unit01.lesson01.exercise06.speak_daccordo:
    instruction: "Say aloud in Italian: I agree."
    accepted_answers:
      - {value: "Sono d'accordo", status: correct}
    feedback: "*Sono d'accordo* means I agree."
  it.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Italian: I believe that working remotely is better than working in the office."
    accepted_answers:
      - {value: "Credo che lavorare da remoto sia meglio che lavorare in ufficio", status: correct}
      - {value: "Credo che sia meglio lavorare da remoto che lavorare in ufficio", status: correct}
    feedback: "*Credo che lavorare da remoto sia meglio che lavorare in ufficio* means I believe that working remotely is better than working in the office."
  it.b2.unit01.lesson01.exercise08.dictation_credo_meglio:
    instruction: "Type what you hear."
    correct_response: "Credo che lavorare da remoto sia meglio che lavorare in ufficio"
    orthography_strict: true
    feedback: "You heard *Credo che lavorare da remoto sia meglio che lavorare in ufficio* — I believe that working remotely is better than working in the office."

  it.b2.unit01.lesson02.exercise01.recognize_perche:
    instruction: "What does this word mean?"
    correct_option: because
    distractors: [but, although, "for example"]
    accepted_answers: [{value: because, status: correct}]
    feedback: "*Perché* means because."
  it.b2.unit01.lesson02.exercise02.listen_innanzitutto:
    instruction: "Listen and select what you hear."
    correct_option: "First of all, you save a lot of travel time."
    distractors: ["Second of all, you save a lot of travel time.", "First of all, you save a little travel time.", "First of all, you save a lot of money."]
    accepted_answers: [{value: "First of all, you save a lot of travel time.", status: correct}]
    feedback: "*Innanzitutto risparmi molto tempo di viaggio* means first of all, you save a lot of travel time."
