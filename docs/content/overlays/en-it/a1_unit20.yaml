  it.a1.unit20.weather: {title: "What is the weather like?"}
lessons:
  it.a1.unit20.lesson01.il_tempo_oggi: {title: "The weather today"}
  it.a1.unit20.lesson02.restiamo_a_casa: {title: "Let's stay home"}
teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo: {title: "fa caldo, fa freddo", gloss: "it is hot, it is cold", note: "Italian says *fa caldo/freddo* for temperature, not a word-for-word 'it is hot/cold.'", example_gloss: ["Today it is hot.", "Today it is cold."]}
  it.a1.unit20.lesson01.teach.piove_sole: {title: "piove, c'è il sole", gloss: "it is raining, it is sunny", note: "*Piove* is a one-word weather sentence; *c'è il sole* is literally 'there is the sun.'", example_gloss: ["Today it is raining.", "Today it is sunny."]}
  it.a1.unit20.lesson01.teach.che_tempo_fa: {title: "Che tempo fa oggi?", gloss: "What is the weather like today?", note: "*Che tempo fa?* is the standard weather question.", example_gloss: ["What is the weather like today?"]}
  it.a1.unit20.lesson01.teach_oggi_piove: {title: "Oggi piove.", gloss: "Today it is raining.", note: "*Oggi* usually comes before the weather expression.", example_gloss: ["Today it is raining."]}
  it.a1.unit20.lesson02.teach_oggi_piove_freddo: {title: "Oggi piove e fa freddo.", gloss: "Today it is raining and cold.", note: "Join two weather facts with *e*.", example_gloss: ["Today it is raining and cold."]}
  it.a1.unit20.lesson02.teach_restiamo_a_casa: {title: "Restiamo a casa.", gloss: "Let's stay home.", note: "*Restiamo* is a 'we' form used as a simple suggestion.", example_gloss: ["Let's stay home."]}
  it.a1.unit20.lesson02.teach_andiamo_al_museo: {title: "Andiamo al museo.", gloss: "Let's go to the museum.", note: "*Andiamo* can mean 'we go' or 'let's go' in a suggestion.", example_gloss: ["Let's go to the museum."]}
  it.a1.unit20.lesson02.teach_allora: {title: "Allora restiamo a casa?", gloss: "So, shall we stay home?", note: "*Allora* links the weather to the plan.", example_gloss: ["So, shall we stay home?"]}
exercises:
  it.a1.unit20.lesson01.exercise01.choose_fa_caldo:
    instruction: "Which phrase means 'it is hot'?"
    correct_option: "fa caldo"
    distractors: ["fa freddo", "piove", "c'è il sole"]
    accepted_answers: [{value: "fa caldo", status: "correct"}]
    feedback: "*fa caldo* means 'it is hot.'"
  it.a1.unit20.lesson01.exercise02.listen_weather_words:
    instruction: "Listen and select the weather expressions in order."
    correct_option: "fa caldo, fa freddo, piove, c'è il sole"
    distractors: ["fa freddo, fa caldo, c'è il sole, piove", "piove, fa freddo, fa caldo, c'è il sole", "c'è il sole, piove, fa freddo, fa caldo"]
    accepted_answers: [{value: "fa caldo, fa freddo, piove, c'è il sole", status: "correct"}]
    feedback: "The recording lists: fa caldo, fa freddo, piove, c'è il sole."
  it.a1.unit20.lesson01.exercise03.choose_che_tempo:
    instruction: "Which question asks about today's weather?"
    correct_option: "Che tempo fa oggi?"
    distractors: ["Oggi piove.", "Restiamo a casa.", "Andiamo al museo."]
    accepted_answers: [{value: "Che tempo fa oggi?", status: "correct"}]
    feedback: "*Che tempo fa oggi?* asks about today's weather."
  it.a1.unit20.lesson01.exercise04.match_weather_words:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "it is hot", right: "fa caldo"}
          - {left: "it is cold", right: "fa freddo"}
          - {left: "it is raining", right: "piove"}
          - {left: "it is sunny", right: "c'è il sole"}
          - {left: "What is the weather like today?", right: "Che tempo fa oggi?"}
          - {left: "Today it is raining.", right: "Oggi piove."}
        status: "correct"
    feedback: "These are the basic weather expressions for the unit."
  it.a1.unit20.lesson01.exercise05.order_oggi_piove:
    instruction: "Put the words in order to say 'Today it is raining.'"
    accepted_answers: [{value: ["Oggi", "piove"], status: "correct"}]
    feedback: "The correct order is *Oggi piove.*"
  it.a1.unit20.lesson01.exercise06.fill_freddo:
    instruction: "Complete the phrase for 'Today it is cold.'"
    accepted_answers: [{value: "freddo", status: "correct"}]
    feedback: "*Oggi fa freddo.* means 'Today it is cold.'"
  it.a1.unit20.lesson01.exercise07.write_weather_words:
    instruction: "Write these four weather expressions in Italian, in this order: it is hot, it is cold, it is raining, it is sunny."
    accepted_answers:
      - {value: "fa caldo, fa freddo, piove, c'è il sole", status: "correct"}
      - {value: "fa caldo fa freddo piove c'è il sole", status: "correct"}
    feedback: "The expressions are: fa caldo, fa freddo, piove, c'è il sole."
  it.a1.unit20.lesson02.exercise01.choose_restiamo:
    instruction: "Which sentence means 'Let's stay home'?"
    correct_option: "Restiamo a casa."
    distractors: ["Andiamo al museo.", "Che tempo fa oggi?", "Oggi piove."]
    accepted_answers: [{value: "Restiamo a casa.", status: "correct"}]
    feedback: "*Restiamo a casa.* means 'Let's stay home.'"
  it.a1.unit20.lesson02.exercise02.listen_oggi_piove:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Oggi piove, restiamo a casa."
    distractors: ["Oggi c'è il sole, andiamo al museo.", "Oggi fa caldo, restiamo a casa.", "Oggi piove, andiamo alla stazione."]
    accepted_answers: [{value: "Oggi piove, restiamo a casa.", status: "correct"}]
    feedback: "The speaker says: *Oggi piove, restiamo a casa.*"
  it.a1.unit20.lesson02.exercise03.choose_weather_plan:
    instruction: "Which sentence says it is raining and cold today?"
    correct_option: "Oggi piove e fa freddo."
    distractors: ["Oggi c'è il sole.", "Restiamo a casa.", "Andiamo al museo."]
    accepted_answers: [{value: "Oggi piove e fa freddo.", status: "correct"}]
    feedback: "*Oggi piove e fa freddo.* gives two weather facts."
  it.a1.unit20.lesson02.exercise04.match_weather_plan:
    instruction: "Match each English phrase to Italian."
    accepted_answers:
      - value:
          - {left: "Today it is raining and cold.", right: "Oggi piove e fa freddo."}
          - {left: "Let's stay home.", right: "Restiamo a casa."}
          - {left: "Let's go to the museum.", right: "Andiamo al museo."}
          - {left: "So, shall we stay home?", right: "Allora restiamo a casa?"}
          - {left: "What is the weather like today?", right: "Che tempo fa oggi?"}
          - {left: "it is sunny", right: "c'è il sole"}
        status: "correct"
    feedback: "These connect weather to a simple plan."
  it.a1.unit20.lesson02.exercise05.order_restiamo_a_casa:
    instruction: "Put the words in order to say 'Let's stay home.'"
    accepted_answers: [{value: ["Restiamo", "a", "casa"], status: "correct"}]
    feedback: "The correct order is *Restiamo a casa.*"
  it.a1.unit20.lesson02.exercise06.reply_tempo_oggi:
    instruction: "Someone asks 'Che tempo fa oggi?' Answer with the taught sentence: today it is raining and cold."
    accepted_answers:
      - {value: "Oggi piove e fa freddo.", status: "correct"}
      - {value: "Oggi piove e fa freddo", status: "correct"}
    feedback: "*Oggi piove e fa freddo.* answers with today's weather."
  it.a1.unit20.lesson02.exercise07.listen_type_oggi_piove:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Oggi piove, restiamo a casa.", status: "correct"}
      - {value: "Oggi piove restiamo a casa", status: "correct"}
    feedback: "The sentence is *Oggi piove, restiamo a casa.*"
  it.a1.unit20.lesson02.exercise08.write_weather_note:
    instruction: "Write the taught weather note with the plan: today it is raining and cold; let's stay home."
    accepted_answers:
      - {value: "Oggi piove e fa freddo. Restiamo a casa.", status: "correct"}
      - {value: "Oggi piove e fa freddo, restiamo a casa.", status: "correct"}
      - {value: "Oggi piove e fa freddo restiamo a casa", status: "correct"}
    feedback: "*Oggi piove e fa freddo. Restiamo a casa.* describes the weather and gives a plan."
  it.a1.unit20.lesson02.exercise09.dictation_oggi_piove:
    instruction: "Type what you hear."
    correct_option: "Oggi piove, restiamo a casa"
    accepted_answers: [{value: "Oggi piove, restiamo a casa", status: correct}]
    orthography_strict: true
