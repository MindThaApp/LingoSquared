course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit99.sai_dov_e: {"title": "Do you know where the station is?", "description": "Ask politely with an embedded question: sai dove, sai se, sai quando, sa a che ora, mi può dire, all in the indicative."}
lessons:
  it.a2.unit99.sai_dov_e.lesson01.sai_dove: {"title": "Do you know where...?"}
  it.a2.unit99.sai_dov_e.lesson02.sai_se: {"title": "Do you know if...? Do you know when...?"}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e: {"title": "Excuse me, do you know where...?"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come: {"title": "Do you know how much it costs?"}
  it.a2.unit99.sai_dov_e.lesson05.lettura: {"title": "A message to the hotel"}
  it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco: {"title": "Marco asks Giulia"}
teaching:
  it.a2.unit99.sai_dov_e.lesson01.teach.v_dove: {"title": "Do you know where", "gloss": "to know / where / where is / the station / to live / the bathroom", "note": "*Sai dove...?* embeds the question *Dove...?*.", "example_gloss": ["Do you know where the station is?", "Do you know where Luca lives?", "I do not know where the bathroom is.", "Giulia knows where Marco lives."]}
  it.a2.unit99.sai_dov_e.lesson01.teach.sai_dove: {"title": "Sai dove + clause", "gloss": "Do you know where the station is? Do you know where Luca lives?", "note": "The word order after *dove* stays normal: the verb follows the question word. The verb is in the indicative."}
  it.a2.unit99.sai_dov_e.lesson01.teach.non_so: {"title": "Non so", "gloss": "I do not know where the bathroom is. I do not know where Marco lives.", "note": "Use *non so* + question word to say you do not know."}
  it.a2.unit99.sai_dov_e.lesson02.teach.v_se_quando: {"title": "If and when", "gloss": "if; whether / when / at what time / open / closed / the film / it starts", "note": "*Se* here means 'whether' and introduces a yes/no question.", "example_gloss": ["Do you know if the shop is open?", "Do you know when the train arrives?", "Do you know what time the film starts?", "I do not know if it is closed."]}
  it.a2.unit99.sai_dov_e.lesson02.teach.sai_se: {"title": "Sai se...?", "gloss": "Do you know if the shop is open? I do not know if it is closed.", "note": "For a yes/no question, use *se* ('whether') after *sai*."}
  it.a2.unit99.sai_dov_e.lesson02.teach.sai_quando: {"title": "Sai quando / a che ora", "gloss": "Do you know when the train arrives? Do you know what time the film starts?", "note": "Keep the verb after the question word, in the present."}
  it.a2.unit99.sai_dov_e.lesson03.teach.v_scusi: {"title": "Polite questions", "gloss": "excuse me / you know (formal) / can you tell me / the pharmacy / the bank / it opens / it closes", "note": "With strangers, use *sa* and *mi può dire* (formal *Lei*).", "example_gloss": ["Excuse me, do you know where the pharmacy is?", "Can you tell me where the bank is?", "Can you tell me what time it closes?", "Do you know what time the bank opens?"]}
  it.a2.unit99.sai_dov_e.lesson03.teach.lei: {"title": "Formal: sa, mi può dire", "gloss": "Excuse me, do you know where the pharmacy is? Can you tell me where the bank is?", "note": "With a stranger or an older person, use *sa* (not *sai*) and *mi può dire*."}
  it.a2.unit99.sai_dov_e.lesson03.teach.diretta_indiretta: {"title": "Direct and indirect", "gloss": "Where is the bank? Can you tell me where the bank is?", "note": "The indirect question is softer and more polite. The words after *dov'è* stay the same."}
  it.a2.unit99.sai_dov_e.lesson04.teach.v_quanto: {"title": "How much, how, why", "gloss": "how much it costs / what it is called / why / the ticket / the museum / Sunday", "note": "These question words also follow *sai*.", "example_gloss": ["Do you know how much the ticket costs?", "Do you know what the museum is called?", "Do you know why Marco is not coming?", "Do you know if the museum is open on Sunday?"]}
  it.a2.unit99.sai_dov_e.lesson04.teach.sai_quanto: {"title": "Sai quanto / come", "gloss": "Do you know how much the ticket costs? Do you know what the museum is called?", "note": "After the question word, the clause keeps its normal order."}
  it.a2.unit99.sai_dov_e.lesson04.teach.sai_perche: {"title": "Sai perché", "gloss": "Do you know why Marco is not coming? I do not know why he is not coming.", "note": "The verb after *perché* is in the present, in normal order."}
  it.a2.unit99.sai_dov_e.lesson05.teach.hotel: {"title": "Marco's message", "gloss": "Marco is in Bologna. He writes a message to a hotel. Good morning, do you know what time breakfast opens? Can you tell me where the bus stop is? Do you know if the museum is open on Sunday? Do you know how much the ticket costs? Thank you, Marco", "note": "Four indirect questions: one for each question word."}
  it.a2.unit99.sai_dov_e.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Giulia, do you know where the station is? I do not know where to go."}
  it.a2.unit99.sai_dov_e.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: It is near the museum. Do you know if the train for Rome leaves at nine?"}
  it.a2.unit99.sai_dov_e.lesson06.teach.d3: {"title": "Marco answers", "gloss": "Marco: I do not know what time it leaves, but I know how much the ticket costs."}
  it.a2.unit99.sai_dov_e.lesson06.teach.d4: {"title": "Giulia asks", "gloss": "Giulia: Do you know why Luca is not coming with us?"}
  it.a2.unit99.sai_dov_e.lesson06.teach.d5: {"title": "Marco answers", "gloss": "Marco: No, I do not know why. Can you tell me his number?"}
  it.a2.unit99.sai_dov_e.lesson06.teach.d6: {"title": "Giulia agrees", "gloss": "Giulia: Of course! Do you know what his office is called?"}
exercises:
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai dov'è la stazione?", "distractors": ["Sai dove la stazione è?", "Sai dov'è stazione la?", "Sapere dov'è la stazione?"], "accepted_answers": [{"value": "Sai dov'è la stazione?", "status": "correct"}], "feedback": "*Sai dov'è...?*"}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai dove abita Luca?", "distractors": ["Sai dove Luca abitare?", "Sai dove abita a Luca?", "Sai dove abiti Luca?"], "accepted_answers": [{"value": "Sai dove abita Luca?", "status": "correct"}], "feedback": "*Sai dove* + normal clause."}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sai dov'è la stazione?", "right": "Do you know where the station is?"}, {"left": "Sai dove abita Luca?", "right": "Do you know where Luca lives?"}, {"left": "Non so dov'è il bagno.", "right": "I do not know where the bathroom is."}, {"left": "Giulia sa dove abita Marco.", "right": "Giulia knows where Marco lives."}, {"left": "dove", "right": "where"}, {"left": "sapere", "right": "to know"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise04.ordina: {"instruction": "Put the words in order to say 'Do you know where Luca lives?'", "correct_option": "Sai dove abita Luca", "accepted_answers": [{"value": "Sai dove abita Luca", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise05.completa: {"instruction": "Fill in the question word that means 'where'.", "correct_option": "dove", "accepted_answers": [{"value": "dove", "status": "correct"}], "feedback": "*Sai dove...?*"}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non so dov'è il bagno.", "status": "correct"}, {"value": "Non so dov'è il bagno", "status": "correct"}], "feedback": "*Non so* + question word."}
  it.a2.unit99.sai_dov_e.lesson01.sai_dove.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sai dov'è la stazione?", "status": "correct"}, {"value": "Sai dov'è la stazione", "status": "correct"}], "feedback": "*Sai dov'è...?*", "correct_option": "Sai dov'è la stazione?"}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai se il negozio è aperto?", "distractors": ["Sai il negozio se è aperto?", "Sai se è il negozio aperto?", "Sai se il negozio essere aperto?"], "accepted_answers": [{"value": "Sai se il negozio è aperto?", "status": "correct"}], "feedback": "*Sai se...?*"}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai a che ora inizia il film?", "distractors": ["Sai che ora a inizia il film?", "Sai a che ora iniziare il film?", "Sai a che ora il film?"], "accepted_answers": [{"value": "Sai a che ora inizia il film?", "status": "correct"}], "feedback": "*A che ora* + clause."}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sai se il negozio è aperto?", "right": "Do you know if the shop is open?"}, {"left": "Sai quando arriva il treno?", "right": "Do you know when the train arrives?"}, {"left": "Sai a che ora inizia il film?", "right": "Do you know what time the film starts?"}, {"left": "Non so se è chiuso.", "right": "I do not know if it is closed."}, {"left": "aperto", "right": "open"}, {"left": "chiuso", "right": "closed"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise04.ordina: {"instruction": "Put the words in order to say 'Do you know when the train arrives?'", "correct_option": "Sai quando arriva il treno", "accepted_answers": [{"value": "Sai quando arriva il treno", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise05.completa: {"instruction": "Fill in the word that means 'whether'.", "correct_option": "se", "accepted_answers": [{"value": "se", "status": "correct"}], "feedback": "*Sai se...?*"}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sai a che ora inizia il film?", "status": "correct"}, {"value": "Sai a che ora inizia il film", "status": "correct"}], "feedback": "*A che ora* + clause."}
  it.a2.unit99.sai_dov_e.lesson02.sai_se.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sai quando arriva il treno?", "status": "correct"}, {"value": "Sai quando arriva il treno", "status": "correct"}], "feedback": "*Sai quando...?*", "correct_option": "Sai quando arriva il treno?"}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Scusi, sa dov'è la farmacia?", "distractors": ["Scusi, sai dov'è la farmacia?", "Scusi, sa dov'è farmacia la?", "Scusi, sapere dov'è la farmacia?"], "accepted_answers": [{"value": "Scusi, sa dov'è la farmacia?", "status": "correct"}], "feedback": "*Sa* is the formal form."}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Mi può dire a che ora chiude?", "distractors": ["Mi può dire a che ora chiudo?", "Mi può dire che ora a chiude?", "Mi poter dire a che ora chiude?"], "accepted_answers": [{"value": "Mi può dire a che ora chiude?", "status": "correct"}], "feedback": "*Mi può dire* + question word."}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Scusi, sa dov'è la farmacia?", "right": "Excuse me, do you know where the pharmacy is?"}, {"left": "Mi può dire dov'è la banca?", "right": "Can you tell me where the bank is?"}, {"left": "Mi può dire a che ora chiude?", "right": "Can you tell me what time it closes?"}, {"left": "Sa a che ora apre la banca?", "right": "Do you know what time the bank opens?"}, {"left": "Dov'è la banca?", "right": "Where is the bank?"}, {"left": "scusi", "right": "excuse me"}], "status": "correct"}], "feedback": "Match each expression."}
