  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise05.completa: {"instruction": "Fill in the formal verb form: you know.", "correct_option": "sa", "accepted_answers": [{"value": "sa", "status": "correct"}], "feedback": "The formal form is *sa*."}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Scusi, sa dov'è la farmacia?", "status": "correct"}, {"value": "Scusi, sa dov'è la farmacia", "status": "correct"}], "feedback": "*Sa* is formal."}
  it.a2.unit99.sai_dov_e.lesson03.sa_dov_e.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Mi può dire a che ora chiude?", "status": "correct"}, {"value": "Mi può dire a che ora chiude", "status": "correct"}], "feedback": "*Mi può dire* + question word.", "correct_option": "Mi può dire a che ora chiude?"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai quanto costa il biglietto?", "distractors": ["Sai quanto costare il biglietto?", "Sai costa quanto il biglietto?", "Sai quanto il biglietto costa?"], "accepted_answers": [{"value": "Sai quanto costa il biglietto?", "status": "correct"}], "feedback": "*Sai quanto costa...?*"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai perché Marco non viene?", "distractors": ["Sai perché Marco non venire?", "Sai Marco perché non viene?", "Sai perché non Marco viene?"], "accepted_answers": [{"value": "Sai perché Marco non viene?", "status": "correct"}], "feedback": "*Sai perché...?*"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sai quanto costa il biglietto?", "right": "Do you know how much the ticket costs?"}, {"left": "Sai come si chiama il museo?", "right": "Do you know what the museum is called?"}, {"left": "Sai perché Marco non viene?", "right": "Do you know why Marco is not coming?"}, {"left": "Sai se il museo è aperto domenica?", "right": "Do you know if the museum is open on Sunday?"}, {"left": "Non so perché non viene.", "right": "I do not know why he is not coming."}, {"left": "il biglietto", "right": "the ticket"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise04.ordina: {"instruction": "Put the words in order to say 'Do you know how much the ticket costs?'", "correct_option": "Sai quanto costa il biglietto", "accepted_answers": [{"value": "Sai quanto costa il biglietto", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise05.completa: {"instruction": "Fill in the word that means 'how much'.", "correct_option": "quanto", "accepted_answers": [{"value": "quanto", "status": "correct"}], "feedback": "*Quanto costa...?*"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sai perché Marco non viene?", "status": "correct"}, {"value": "Sai perché Marco non viene", "status": "correct"}], "feedback": "*Sai perché...?*"}
  it.a2.unit99.sai_dov_e.lesson04.quanto_come.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sai quanto costa il biglietto?", "status": "correct"}, {"value": "Sai quanto costa il biglietto", "status": "correct"}], "feedback": "*Sai quanto costa...?*", "correct_option": "Sai quanto costa il biglietto?"}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise01.leggi1: {"instruction": "Read the text and choose the answer.", "correct_option": "What time it opens.", "distractors": ["How much it costs.", "Where it is.", "If it is closed."], "accepted_answers": [{"value": "What time it opens.", "status": "correct"}], "feedback": "*Sa a che ora apre la colazione?*"}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise02.leggi2: {"instruction": "Read the text and choose the answer.", "correct_option": "If it is open on Sunday.", "distractors": ["How much it costs.", "Where it is.", "What time it opens."], "accepted_answers": [{"value": "If it is open on Sunday.", "status": "correct"}], "feedback": "*Sa se il museo è aperto domenica?*"}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Marco è a Bologna.", "right": "Marco is in Bologna."}, {"left": "Sa a che ora apre la colazione?", "right": "Do you know what time breakfast opens?"}, {"left": "Mi può dire dov'è la fermata dell'autobus?", "right": "Can you tell me where the bus stop is?"}, {"left": "Sa se il museo è aperto domenica?", "right": "Do you know if the museum is open on Sunday?"}, {"left": "Sa quanto costa il biglietto?", "right": "Do you know how much the ticket costs?"}, {"left": "Grazie, Marco", "right": "Thank you, Marco"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise04.ordina: {"instruction": "Put the words in order to say 'Can you tell me where the bus stop is?'", "correct_option": "Mi può dire dov'è la fermata dell'autobus", "accepted_answers": [{"value": "Mi può dire dov'è la fermata dell'autobus", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise05.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sa se il museo è aperto domenica?", "status": "correct"}, {"value": "Sa se il museo è aperto domenica", "status": "correct"}], "feedback": "*Sa se...?*"}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise06.detta1: {"instruction": "Type what you hear.", "correct_response": "Sa a che ora apre la colazione?", "orthography_strict": true, "feedback": "You heard *Sa a che ora apre la colazione?*"}
  it.a2.unit99.sai_dov_e.lesson05.lettura.exercise07.detta2: {"instruction": "Type what you hear.", "correct_response": "Mi può dire dov'è la fermata dell'autobus?", "orthography_strict": true, "feedback": "You heard *Mi può dire dov'è la fermata dell'autobus?*"}
  it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco.exercise01.capisci1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Where the station is.", "distractors": ["What time the train leaves.", "Why Luca is not coming.", "How much the ticket costs."], "accepted_answers": [{"value": "Where the station is.", "status": "correct"}], "feedback": "He says *Giulia, sai dov'è la stazione?*"}
  it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco.exercise02.capisci2: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Why he is not coming.", "distractors": ["Where he lives.", "What time he arrives.", "How much he pays."], "accepted_answers": [{"value": "Why he is not coming.", "status": "correct"}], "feedback": "She asks *Sai perché Luca non viene con noi?*"}
  it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sai dov'è la stazione?", "right": "Do you know where the station is?"}, {"left": "È vicino al museo.", "right": "It is near the museum."}, {"left": "Sai se il treno per Roma parte alle nove?", "right": "Do you know if the train for Rome leaves at nine?"}, {"left": "So quanto costa il biglietto.", "right": "I know how much the ticket costs."}, {"left": "Sai perché Luca non viene con noi?", "right": "Do you know why Luca is not coming with us?"}, {"left": "Non so perché.", "right": "I do not know why."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco.exercise04.ordina: {"instruction": "Put the words in order to say 'Do you know where the station is?'", "correct_option": "Sai dov'è la stazione", "accepted_answers": [{"value": "Sai dov'è la stazione", "status": "correct"}], "feedback": "Check the word order."}
