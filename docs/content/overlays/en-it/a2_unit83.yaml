teaching:
  it.a2.unit83.lesson01.teach.spostare_annullare:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Spostare un appuntamento* means to move it to another time. *Annullare* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  it.a2.unit83.lesson01.teach.purtroppo_scusa:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Purtroppo* is a polite way to give bad news. *Scusa* is the everyday apology (*mi scusi* when speaking formally).'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  it.a2.unit83.lesson01.teach.il_parrucchiere:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Il parrucchiere* is both the person and the place: people say *vado dal parrucchiere* for the shop.'
    example_gloss: The salon is open from nine to six.
  it.a2.unit83.lesson01.teach.posso_spostare_l:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: '*Posso* (I can) is followed by an infinitive: *Posso spostare l''appuntamento?* The question has the same word order as a statement, only the intonation (and the question mark) changes.'
  it.a2.unit83.lesson01.teach.purtroppo_non_posso:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  it.a2.unit83.lesson01.teach.giovedi_non_posso:
    title: Posso + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *posso* the second verb is an infinitive. In a statement, *non* goes directly before *posso*: *Giovedì non posso venire*. A time word like *giovedì* can come first. A question keeps the same order: *Posso spostare l''appuntamento?*'
  it.a2.unit83.lesson02.teach.un_altro_giorno:
    title: Another day
    gloss: another day
    note: '*Un altro giorno* (another day): *altro* agrees with the noun, so *un altro giorno* but *un''altra volta*.'
    example_gloss: Can it also be on another day?
  it.a2.unit83.lesson02.teach.posso_venire_anche:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'Italian needs no preposition before a weekday here: *lunedì*, not *a lunedì*. *Anche* means ''also''.'
  it.a2.unit83.lesson02.teach.le_va_bene:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Andare bene* means ''to suit'': *Le va bene venerdì?* is the polite question and *Mi va bene* the answer. *Le* is the polite ''to you''; with friends use *ti*: *Ti va bene venerdì?*'
  it.a2.unit83.lesson02.teach.si_mi_va:
    title: Saying yes
    gloss: Yes, that suits me well.
  it.a2.unit83.lesson02.teach.purtroppo_no:
    title: Saying no politely
    gloss: Unfortunately not.
  it.a2.unit83.lesson02.teach.le_va_bene_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: 'To ask whether a time is convenient, use *andare bene* with the person in front: *Le va bene venerdì?* (polite) or *Ti va bene venerdì?* (informal). Answer *Sì, mi va bene* or, politely refusing, *Purtroppo no*.'
  it.a2.unit83.lesson03.teach.perche_mi_dispiace:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Perché* here means ''because'' and gives the reason. *Mi dispiace* is a more careful apology than *scusa*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  it.a2.unit83.lesson03.teach.il_disturbo:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Mi scusi per il disturbo* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  it.a2.unit83.lesson03.teach.non_posso_venire:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  it.a2.unit83.lesson03.teach.non_posso_venire_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  it.a2.unit83.lesson03.teach.non_posso_venire_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'To give a reason, join two sentences with *perché*: *Non posso venire perché sto male.* No comma is needed before *perché* in this kind of sentence. The accent on *perché* is part of the spelling.'
  it.a2.unit83.lesson04.teach.fissare_in_anticipo:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Fissare* is to set a time or place. *In anticipo* means ''beforehand''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  it.a2.unit83.lesson04.teach.lunedi_alle_dieci:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  it.a2.unit83.lesson04.teach.puo_venire_lunedi:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Può venire* is the polite form of *puoi venire*. The infinitive *venire* follows directly.'
  it.a2.unit83.lesson04.teach.allora_l_aspetto:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  it.a2.unit83.lesson04.teach.allora_fisso_un:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  it.a2.unit83.lesson04.teach.lunedi_alle_dieci_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, say the day first and then *alle* + the hour: *lunedì alle dieci*. In a polite question use *Può ...?* and put the infinitive after it.'
  it.a2.unit83.lesson05.teach.gentile_marco_il:
    title: A message from the salon
    gloss: Dear Marco, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this time not suit you? Then call us a day in advance. That way we will arrange a new appointment. See you Monday! Parrucchiere Rossi
    note: This is a typical short message from a business, so it uses the polite *Lei* forms (*Il Suo*, *Le*, *chiami*). *È stato spostato* means 'has been moved'.
    glosses:
      gentile: dear
      marco: Marco
      suo: your (formal)
      appuntamento: appointment
      spostato: moved
      nuovo: new
      lunedì: Monday
      dieci: ten
      alle: "at (time)"
      va: goes (va bene = suits)
      questo: this
      non: not
      bene: well (va bene = suits)
      chiami: call
      ci: us
      allora: then
      prima: in advance
      fissiamo: we arrange
      così: so, that way
      a: until, see you
      parrucchiere: hairdresser's
      rossi: Rossi
  it.a2.unit83.lesson06.teach.parrucchiere_rossi_buonasera:
    title: The salon answers
    gloss: 'Hairdresser: Parrucchiere Rossi, good afternoon.'
  it.a2.unit83.lesson06.teach.buonasera_sono_marco:
    title: Marco explains and asks
    gloss: 'Marco: Good afternoon, you are speaking to Marco. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  it.a2.unit83.lesson06.teach.certo_le_va:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  it.a2.unit83.lesson06.teach.purtroppo_no_perche:
    title: Marco suggests Monday
    gloss: 'Marco: Unfortunately not, because I have to work. Can it also be Monday?'
  it.a2.unit83.lesson06.teach.lunedi_alle_dieci:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  it.a2.unit83.lesson06.teach.mi_va_benissimo:
    title: Marco accepts and apologises
    gloss: 'Marco: That suits me well. Thank you very much and sorry for the inconvenience.'
  it.a2.unit83.lesson06.teach.nessun_problema_a:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
