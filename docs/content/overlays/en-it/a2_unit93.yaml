course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit93.dovresti_dormire_di_piu: {"title": "You should sleep more", "description": "Give and respond to simple advice about health, study and money: dovresti, è meglio and sarebbe meglio, ti consiglio di, perché non, the imperative for tu, and replies like hai ragione."}
lessons:
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.dovresti: {"title": "You should sleep more"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.sarebbe_meglio: {"title": "It would be better..."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.ti_consiglio: {"title": "I advise you to..."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.fai_questo: {"title": "Do this! Don't spend too much"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.un_messaggio: {"title": "Marco has a problem"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.giulia_e_luca: {"title": "Giulia and Luca talk about money"}
teaching:
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.teach.problemi: {"title": "Problems", "gloss": "I have a headache / I am tired (masc.) / I am tired (fem.) / I have a problem", "note": "*Stanco* is for a man and *stanca* for a woman.", "example_gloss": ["I have a headache.", "Marco is tired.", "Giulia is tired.", "I have a problem."]}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.teach.consigli: {"title": "Pieces of advice", "gloss": "to sleep more / to drink more water / to rest / to eat less / to go to the doctor", "note": "*Di più* means 'more' and *meno* means 'less'.", "example_gloss": ["You should sleep more.", "You should drink more water.", "You should rest.", "You should eat less.", "You should go to the doctor."]}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.teach.gn_dovresti: {"title": "Dovresti + infinitive", "gloss": "You should sleep more. You should rest.", "note": "*Dovresti* ('you should') + infinitive is the usual way to give advice to a friend."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.teach.gn_non_dovresti: {"title": "Non dovresti", "gloss": "You should not drink too much coffee. You should not eat late.", "note": "Put *non* before *dovresti* to say what to avoid."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.teach.gn_dovrebbe: {"title": "Dovrebbe", "gloss": "Marco should rest. You (formal) should go to the doctor.", "note": "*Dovrebbe* is used for he/she and for the formal *Lei*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.teach.abitudini: {"title": "Habits", "gloss": "to go to bed / early / late / too much / little", "note": "*Troppo* means 'too much' and *poco* means 'little'.", "example_gloss": ["I go to bed early.", "Marco goes to bed late.", "I drink too much coffee.", "I sleep little."]}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.teach.gn_e_meglio: {"title": "È meglio + infinitive", "gloss": "It is better to rest. It is better to sleep.", "note": "*È meglio* + infinitive gives general advice without naming a person."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.teach.gn_sarebbe: {"title": "Sarebbe meglio", "gloss": "It would be better to go to bed early. It would be better to drink more water.", "note": "*Sarebbe meglio* is a softer, more polite version of *è meglio*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.teach.gn_non_meglio: {"title": "Negative advice", "gloss": "It would be better not to eat late. It is better not to drink too much coffee.", "note": "*Non* goes before the infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.teach.gn_mi_sembra: {"title": "Describing the problem", "gloss": "I sleep little and I drink too much coffee.", "note": "Describing the problem briefly helps the advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.teach.studio: {"title": "Study", "gloss": "to study / every day / the teacher / an exam / a book", "note": "Study is one of the most common topics for advice.", "example_gloss": ["I study every day.", "I talk to the teacher.", "I have an exam on Saturday.", "I read a book."]}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.teach.gn_consiglio_di: {"title": "Ti consiglio di + infinitive", "gloss": "I advise you to study every day. I advise you to talk to the teacher.", "note": "*Ti consiglio di* + infinitive. The *di* is required."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.teach.gn_consiglio_nome: {"title": "Ti consiglio + noun", "gloss": "I recommend a book to you. I recommend the doctor to you.", "note": "*Ti consiglio* also takes a noun, to recommend something."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.teach.gn_perche_non: {"title": "Perché non...?", "gloss": "Why don't you go to the doctor? Why don't you study with Luca?", "note": "*Perché non* + present tense is a friendly suggestion."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.teach.gn_grazie: {"title": "Thanking for advice", "gloss": "Thanks for the advice. Thanks for the advice.", "note": "Both *del* and *per il* are possible."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.teach.verbi: {"title": "Informal commands", "gloss": "study! / drink! / sleep! / do! / go! / save! / spend!", "note": "The command form for *tu* gives direct advice.", "example_gloss": ["Study every day!", "Drink more water!", "Sleep more!", "Go for a walk!", "Go to bed early!", "Save every month!", "Spend less!"]}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.teach.gn_tu_imp: {"title": "Tu command endings", "gloss": "Study! Drink! Sleep! Spend!", "note": "-are verbs end in -a (*studia*); -ere and -ire verbs end in -i (*bevi*, *dormi*, *spendi*)."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.teach.gn_irregolari: {"title": "Fai and vai", "gloss": "Go for a walk! Go to bed early!", "note": "*Fare* gives *fai* and *andare* gives *vai*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.teach.gn_negativo: {"title": "Negative commands", "gloss": "Don't buy useless things! Don't spend too much! Don't eat late!", "note": "For a negative command to *tu*, use *non* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.teach.gn_risposte: {"title": "Replying to advice", "gloss": "You are right. Good idea! Thanks for the advice.", "note": "These are three friendly ways to accept advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.teach.lettura: {"title": "Marco asks and Giulia answers", "gloss": "Hi Giulia! I have a problem: I am always tired and I have a headache. I study until late and sleep little. What should I do? Marco. Hi Marco! You should sleep more. It would be better to go to bed early. I advise you to drink more water and to go for a walk. Giulia", "note": "The message describes the problem, the reply gives three pieces of advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d1: {"title": "Luca asks", "gloss": "Luca: Giulia, I spend too much money. What should I do?"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d2: {"title": "Giulia advises", "gloss": "Giulia: You should save every month."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d3: {"title": "Luca agrees", "gloss": "Luca: You are right, but it is difficult."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d4: {"title": "Giulia adds", "gloss": "Giulia: It would be better not to buy useless things. I advise you to write down your expenses."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d5: {"title": "Luca accepts", "gloss": "Luca: Good idea! I will write down my expenses every day."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d6: {"title": "Giulia jokes", "gloss": "Giulia: Well done! And don't spend too much at the bar!"}
exercises:
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise01.scegli_dovresti: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Dovresti dormire di più.", "distractors": ["Dovresti dormendo di più.", "Devresti dormire di più.", "Dovresti dormo di più."], "accepted_answers": [{"value": "Dovresti dormire di più.", "status": "correct"}], "feedback": "*Dovresti* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise02.scegli_non: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non dovresti bere troppo caffè.", "distractors": ["Dovresti non bere troppo caffè.", "Non dovresti bevi troppo caffè.", "Non dovrebbe bere troppo caffè tu."], "accepted_answers": [{"value": "Non dovresti bere troppo caffè.", "status": "correct"}], "feedback": "*Non* goes before *dovresti*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise03.abbina_consigli: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Dovresti riposare.", "right": "You should rest."}, {"left": "Dovresti bere più acqua.", "right": "You should drink more water."}, {"left": "Dovresti mangiare meno.", "right": "You should eat less."}, {"left": "Dovresti andare dal medico.", "right": "You should go to the doctor."}, {"left": "Ho mal di testa.", "right": "I have a headache."}, {"left": "Marco dovrebbe riposare.", "right": "Marco should rest."}], "status": "correct"}], "feedback": "Advice sentences."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise04.ordina_medico: {"instruction": "Put the words in order to say 'You should go to the doctor.'", "correct_option": "Dovresti andare dal medico", "accepted_answers": [{"value": "Dovresti andare dal medico", "status": "correct"}], "feedback": "*Dovresti* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise05.completa_dovrebbe: {"instruction": "Complete the advice about Marco.", "correct_option": "dovrebbe", "accepted_answers": [{"value": "dovrebbe", "status": "correct"}], "feedback": "With Marco use *dovrebbe*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise06.traduci_acqua: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Dovresti bere più acqua.", "status": "correct"}, {"value": "Dovresti bere più acqua", "status": "correct"}], "feedback": "*Più* means 'more'."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson01.exercise07.scrivi_stanca: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono stanca.", "status": "correct"}, {"value": "Sono stanca", "status": "correct"}], "feedback": "A woman says *stanca*.", "correct_option": "Sono stanca."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise01.scegli_meglio: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sarebbe meglio andare a letto presto.", "distractors": ["Sarebbe meglio vado a letto presto.", "Saria meglio andare a letto presto.", "Sarebbe meglio andando a letto presto."], "accepted_answers": [{"value": "Sarebbe meglio andare a letto presto.", "status": "correct"}], "feedback": "*Sarebbe meglio* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise02.scegli_non_meglio: {"instruction": "Choose the correct Italian sentence.", "correct_option": "È meglio non bere troppo caffè.", "distractors": ["È meglio bere non troppo caffè.", "È meglio non bevo troppo caffè.", "È meglio non bere caffè troppo molto."], "accepted_answers": [{"value": "È meglio non bere troppo caffè.", "status": "correct"}], "feedback": "*Non* goes before the infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise03.abbina_abitudini: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "presto", "right": "early"}, {"left": "tardi", "right": "late"}, {"left": "troppo", "right": "too much"}, {"left": "poco", "right": "little"}, {"left": "andare a letto", "right": "to go to bed"}, {"left": "È meglio riposare.", "right": "It is better to rest."}], "status": "correct"}], "feedback": "Habits and advice words."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise04.ordina_sarebbe: {"instruction": "Put the words in order to say 'It would be better not to eat late.'", "correct_option": "Sarebbe meglio non mangiare tardi", "accepted_answers": [{"value": "Sarebbe meglio non mangiare tardi", "status": "correct"}], "feedback": "*Non* before the infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise05.completa_poco: {"instruction": "Complete the sentence.", "correct_option": "poco", "accepted_answers": [{"value": "poco", "status": "correct"}], "feedback": "*Dormo poco* explains why you are tired."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise06.traduci_meglio: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "È meglio riposare.", "status": "correct"}, {"value": "È meglio riposare", "status": "correct"}], "feedback": "*È meglio* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson02.exercise07.scrivi_sarebbe: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sarebbe meglio bere più acqua.", "status": "correct"}, {"value": "Sarebbe meglio bere più acqua", "status": "correct"}], "feedback": "*Sarebbe meglio* + infinitive.", "correct_option": "Sarebbe meglio bere più acqua."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise01.scegli_consiglio: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ti consiglio di studiare ogni giorno.", "distractors": ["Ti consiglio studiare ogni giorno.", "Ti consiglio a studiare ogni giorno.", "Ti consiglio di studio ogni giorno."], "accepted_answers": [{"value": "Ti consiglio di studiare ogni giorno.", "status": "correct"}], "feedback": "*Ti consiglio di* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise02.scegli_perche_non: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Perché non vai dal medico?", "distractors": ["Perché non andare dal medico?", "Perché non vado dal medico?", "Perché vai non dal medico?"], "accepted_answers": [{"value": "Perché non vai dal medico?", "status": "correct"}], "feedback": "*Perché non* + present of the verb."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise03.abbina_consiglio: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ti consiglio di studiare.", "right": "I advise you to study."}, {"left": "Ti consiglio un libro.", "right": "I recommend a book to you."}, {"left": "Perché non studi con Luca?", "right": "Why don't you study with Luca?"}, {"left": "Studio ogni giorno.", "right": "I study every day."}, {"left": "Ho un esame sabato.", "right": "I have an exam on Saturday."}, {"left": "Grazie del consiglio.", "right": "Thanks for the advice."}], "status": "correct"}], "feedback": "Study advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise04.ordina_professore: {"instruction": "Put the words in order to say 'I advise you to talk to the teacher.'", "correct_option": "Ti consiglio di parlare con il professore", "accepted_answers": [{"value": "Ti consiglio di parlare con il professore", "status": "correct"}], "feedback": "*Di* before the infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise05.completa_di: {"instruction": "Complete with the missing word.", "correct_option": "di", "accepted_answers": [{"value": "di", "status": "correct"}], "feedback": "*Ti consiglio di* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise06.traduci_perche: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Perché non studi con Luca?", "status": "correct"}, {"value": "Perché non studi con Luca", "status": "correct"}], "feedback": "*Perché non* + present."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson03.exercise07.scrivi_libro: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ti consiglio un libro.", "status": "correct"}, {"value": "Ti consiglio un libro", "status": "correct"}], "feedback": "*Ti consiglio* + noun.", "correct_option": "Ti consiglio un libro."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise01.scegli_studia: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Studia ogni giorno!", "distractors": ["Studi ogni giorno!", "Studiare ogni giorno!", "Studio ogni giorno!"], "accepted_answers": [{"value": "Studia ogni giorno!", "status": "correct"}], "feedback": "-are command for *tu* ends in -a."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise02.scegli_non: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non spendere troppo!", "distractors": ["Non spendi troppo!", "Spendere non troppo!", "Non spendendo troppo!"], "accepted_answers": [{"value": "Non spendere troppo!", "status": "correct"}], "feedback": "Negative command: *non* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise03.abbina_comandi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Bevi più acqua!", "right": "Drink more water!"}, {"left": "Dormi di più!", "right": "Sleep more!"}, {"left": "Fai una passeggiata!", "right": "Go for a walk!"}, {"left": "Vai a letto presto!", "right": "Go to bed early!"}, {"left": "Risparmia ogni mese!", "right": "Save every month!"}, {"left": "Non spendere troppo!", "right": "Don't spend too much!"}], "status": "correct"}], "feedback": "Commands to a friend."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise04.ordina_risparmia: {"instruction": "Put the words in order to say 'Save every month.'", "correct_option": "Risparmia ogni mese", "accepted_answers": [{"value": "Risparmia ogni mese", "status": "correct"}], "feedback": "-are command: *risparmia*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise05.completa_fai: {"instruction": "Complete with the command of fare.", "correct_option": "Fai", "accepted_answers": [{"value": "Fai", "status": "correct"}], "feedback": "*Fai* is the command for *tu*."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise06.traduci_non_mangiare: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non mangiare tardi!", "status": "correct"}, {"value": "Non mangiare tardi", "status": "correct"}], "feedback": "*Non* + infinitive."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson04.exercise07.scrivi_buona: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Buona idea! Grazie del consiglio.", "status": "correct"}, {"value": "Buona idea Grazie del consiglio", "status": "correct"}, {"value": "Buona idea! Grazie per il consiglio.", "status": "correct"}, {"value": "Buona idea Grazie per il consiglio", "status": "correct"}], "feedback": "Two friendly replies.", "correct_option": "Buona idea! Grazie del consiglio."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise01.leggi_problema: {"instruction": "Read the text and choose the answer.", "correct_option": "He is tired and has a headache.", "distractors": ["He cannot study.", "He spends too much.", "He has a cough."], "accepted_answers": [{"value": "He is tired and has a headache.", "status": "correct"}], "feedback": "*Sono sempre stanco e ho mal di testa.*"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise02.leggi_consiglio: {"instruction": "Read the text and choose the answer.", "correct_option": "To sleep more.", "distractors": ["To drink coffee.", "To study more.", "To go to the doctor."], "accepted_answers": [{"value": "To sleep more.", "status": "correct"}], "feedback": "*Dovresti dormire di più.*"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sono sempre stanco.", "right": "I am always tired."}, {"left": "Studio fino a tardi.", "right": "I study until late."}, {"left": "Dormo poco.", "right": "I sleep little."}, {"left": "Dovresti dormire di più.", "right": "You should sleep more."}, {"left": "Ti consiglio di bere più acqua.", "right": "I advise you to drink more water."}, {"left": "Fai una passeggiata.", "right": "Go for a walk."}], "status": "correct"}], "feedback": "Problem and advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise04.ordina_dormire: {"instruction": "Put the words in order to say 'You should sleep more.'", "correct_option": "Dovresti dormire di più", "accepted_answers": [{"value": "Dovresti dormire di più", "status": "correct"}], "feedback": "Short piece of advice."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise05.traduci_che_devo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Che cosa devo fare?", "status": "correct"}, {"value": "Che cosa devo fare", "status": "correct"}, {"value": "Cosa devo fare?", "status": "correct"}, {"value": "Cosa devo fare", "status": "correct"}], "feedback": "*Che cosa* and *cosa* both mean 'what'."}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise06.detta_dormire: {"instruction": "Type what you hear.", "correct_response": "Dovresti dormire di più.", "orthography_strict": true, "feedback": "You heard *Dovresti dormire di più.*"}
  it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise07.detta_passeggiata: {"instruction": "Type what you hear.", "correct_response": "Ti consiglio di fare una passeggiata.", "orthography_strict": true, "feedback": "You heard *Ti consiglio di fare una passeggiata.*"}
