    title: Who uses what?
    gloss: Giulia calls Marco every day. She uses her phone, not an app. Marco has no computer at home, but he uses internet on his phone. Luca looks up the weather forecast every morning. Then he goes running. Chiara often sends Giulia a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
