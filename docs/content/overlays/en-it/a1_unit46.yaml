    title: Giulia confirms the plan
    gloss: 'Giulia: I see the message. Shall we exercise Saturday at ten in the park?'
  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco confirms the weather
    gloss: 'Marco: Yes, and it''s sunny on Saturday!'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: Luca's plan
    gloss: 'Luca: I''ll run then. Afterward I''ll also play football.'
    note: '*Poi* (afterwards) puts the actions in order. *Gioco a calcio*: *giocare a* + sport.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: Chiara's plan
    gloss: 'Chiara: I''d rather swim, but I''m coming to the park too.'
    note: '*Preferisco nuotare* (I''d rather swim) is the direct way to state a preference. *Anch''io* (me too) is one word with an apostrophe.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia closes the conversation
    gloss: 'Giulia: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
