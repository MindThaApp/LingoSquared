      app: app
      computer: computer
      casa: home (a casa = at home)
      internet: internet
      cerca: looks up
      mattina: morning
      previsioni: forecast (previsioni del tempo = weather forecast)
      va: goes
      correre: to run
      manda: sends
      spesso: often
      messaggio: message
      usi: you use
