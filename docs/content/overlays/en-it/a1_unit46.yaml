  it.a1.unit46.lesson03.teach.cercare_e_un:
    title: Cercare and usare are regular
    gloss: 'Cercare and usare are regular -are verbs: io cerco, tu cerchi; io uso, tu usi. Cercare adds an h before i.'
    note: 'The h in *cerchi* keeps the hard c sound: compare *cerco* (io) and *cerchi* (tu).'
  it.a1.unit46.lesson03.teach.luca_cerca_le:
    title: Luca looks up the weather forecast
