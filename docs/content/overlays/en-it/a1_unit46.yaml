  it.a1.unit46.lesson02.teach.giulia_manda_un:
    title: Giulia sends a message through the app
    gloss: Giulia sends a message through the app.
    note: '*Mandare* means to send; *con l''app* (through the app): *con* is the preposition for the means.'
  it.a1.unit46.lesson02.teach.marco_legge_il:
    title: Marco reads the message
