course:
  title: Italian C1
  description: >-
    Advanced Italian register control: shift the same message between formal
    Lei, diplomatic softening, emphatic urgency, and controlled irony according
    to audience and intent.

units:
  it.c1.unit03.registro:
    title: "Changing tone and register precisely"
    description: "Recognize and produce formal, diplomatic, emphatic, and ironic versions of the same workplace message."

lessons:
  it.c1.unit03.lesson01.distinguere_toni:
    title: "Distinguish tones"
  it.c1.unit03.lesson02.formale_lei:
    title: "Use formal Lei"
  it.c1.unit03.lesson03.diplomazia:
    title: "Soften diplomatically"
  it.c1.unit03.lesson04.enfasi_ironia:
    title: "Choose emphasis or irony"
  it.c1.unit03.lesson05.stesso_messaggio:
    title: "Same message, two audiences"
  it.c1.unit03.lesson06.riscrittura_completa:
    title: "Rewrite with control"

teaching:
  it.c1.unit03.lesson01.teach.registro:
    title: "register"
    gloss: "level of formality and style"
    note: "*Il registro* is the level of formality and style chosen for a specific audience."
    example_gloss: "Register changes according to the audience."
  it.c1.unit03.lesson01.teach.tono_formale:
    title: "formal tone"
    gloss: "professional, distant tone"
    note: "*Un tono formale* creates distance and respect, especially through *Lei* forms."
  it.c1.unit03.lesson01.teach.tono_diplomatico:
    title: "diplomatic tone"
    gloss: "softened, tactful tone"
    note: "*Un tono diplomatico* softens a request or disagreement without hiding the core message."
  it.c1.unit03.lesson01.teach.tono_enfatico:
    title: "emphatic tone"
    gloss: "strong, urgent tone"
    note: "*Un tono enfatico* makes urgency explicit through intensifiers such as *assolutamente*."
  it.c1.unit03.lesson01.teach.tono_ironico:
    title: "ironic tone"
    gloss: "indirectly critical tone"
    note: "*Un tono ironico* says one thing while the context signals the opposite judgement."
  it.c1.unit03.lesson01.teach.destinatario:
    title: "audience / recipient"
    gloss: "the person being addressed"
    note: "*Il destinatario* determines whether *tu*, *Lei*, diplomacy, emphasis, or irony is appropriate."
    example_gloss: "The recipient determines the register."

  it.c1.unit03.lesson02.teach.le_chiedo:
    title: "I ask you formally"
    gloss: "I ask you; formal Lei"
    note: "*Le chiedo* uses formal *Lei*: *Le* means 'to you' in a respectful professional request."
  it.c1.unit03.lesson02.teach.cortesemente:
    title: "courteously"
    gloss: "kindly; courteously"
    note: "*Cortesemente* softens a formal request without making it vague."
    example_gloss: "I kindly ask you for more time."
  it.c1.unit03.lesson02.teach.concederci:
    title: "to grant us"
    gloss: "to grant us / allow us"
    note: "*Concederci* fits formal requests where the other person has authority to allow something."
    example_gloss: "Can you grant us more time?"
  it.c1.unit03.lesson02.teach.rivedere_relazione:
    title: "review the report"
    gloss: "to review the report"
    note: "*Rivedere la relazione* is the core content preserved across all register shifts."
  it.c1.unit03.lesson02.teach.grammar_lei:
    title: "Formal Lei request"
    gloss: "I kindly ask you to grant us more time to review the report."
    note: "The formal version combines *Le chiedo*, *cortesemente*, and an infinitive request frame."

  it.c1.unit03.lesson03.teach.forse_potremmo:
    title: "perhaps we could"
    gloss: "perhaps we could"
    note: "*Forse potremmo* is diplomatic because it offers the idea as shared consideration, not as a command."
  it.c1.unit03.lesson03.teach.prenderci_tempo:
    title: "take a little more time"
    gloss: "to take a little more time"
    note: "*Prenderci ancora un po' di tempo* keeps the core request but makes it collaborative."
  it.c1.unit03.lesson03.teach.ammorbidire:
    title: "to soften"
    gloss: "to soften"
    note: "*Ammorbidire il tono* means making a message less blunt while keeping its meaning."
    example_gloss: "Perhaps we could soften the tone."
  it.c1.unit03.lesson03.teach.obiezione:
    title: "objection"
    gloss: "objection"
    note: "*L'obiezione* can remain clear even when the wording is diplomatic."
    example_gloss: "The objection remains clear, but the tone is diplomatic."
  it.c1.unit03.lesson03.teach.grammar_diplomazia:
    title: "Diplomatic softening"
    gloss: "Perhaps we could take a little more time to review the report."
    note: "*Forse potremmo* and *ancora un po' di tempo* reduce pressure while preserving the message."

  it.c1.unit03.lesson04.teach.dobbiamo_assolutamente:
    title: "we absolutely must"
    gloss: "we absolutely must"
    note: "*Dobbiamo assolutamente* makes the urgency explicit and leaves little room for delay."
  it.c1.unit03.lesson04.teach.va_rivista:
    title: "needs to be reviewed carefully"
    gloss: "must be reviewed carefully"
    note: "*Va rivista con cura* is a concise impersonal necessity: the report needs careful review."
  it.c1.unit03.lesson04.teach.consegniamola:
    title: "let's submit it"
    gloss: "let's submit it"
    note: "*Consegniamola* attaches *la* to the command: submit it, referring to *la relazione*."
    example_gloss: "Let's submit it only when it is ready."
  it.c1.unit03.lesson04.teach.pure_cosi:
    title: "just like that"
    gloss: "go ahead just like that"
    note: "*Pure così* can sound permissive on the surface, but here it supports irony."
  it.c1.unit03.lesson04.teach.storto:
    title: "wrong"
    gloss: "wrong; off"
    note: "*Cosa potrebbe mai andare storto?* is a recognizable ironic warning when something is clearly risky."
    example_gloss: "What could possibly go wrong?"
  it.c1.unit03.lesson04.teach.grammar_contrasto:
    title: "Emphasis versus irony"
    gloss: "We absolutely must take more time: the report needs to be reviewed carefully. Sure, let's submit it just like that: what could possibly go wrong?"
    note: "The emphatic version states urgency directly; the ironic version criticizes by pretending to agree."

  it.c1.unit03.lesson05.teach.stesso_messaggio:
    title: "same message"
    gloss: "the same message"
    note: "*Lo stesso messaggio* is the core meaning that must survive each register shift."
  it.c1.unit03.lesson05.teach.due_pubblici:
    title: "two different audiences"
    gloss: "two different audiences"
    note: "*Due pubblici diversi* require different choices: formal distance for a director, peer tone with Elena."
  it.c1.unit03.lesson05.teach.alla_direttrice:
    title: "to the director"
    gloss: "to the director"
    note: "*Alla direttrice* cues formal workplace address, so the model uses *Lei*."
  it.c1.unit03.lesson05.teach.a_elena:
    title: "to Elena"
    gloss: "to Elena"
    note: "*A Elena* cues the established informal peer relationship between Sam and Elena."
  it.c1.unit03.lesson05.teach.spostare_registro:
    title: "shift register"
    gloss: "to shift register"
    note: "*Spostare il registro* means changing style while preserving the message."
    example_gloss: "Sam knows how to shift register precisely."

  it.c1.unit03.lesson06.teach.modello_completo:
    title: "complete model"
    gloss: "To the director: I kindly ask you to grant us more time to review the report. To Elena: Sure, let's submit it just like that: what could possibly go wrong?"
    note: "The complete model preserves one idea across two audiences: formal request first, controlled irony second."
  it.c1.unit03.lesson06.teach.controllo_preciso:
    title: "precise control"
    gloss: "precise control"
    note: "*Il controllo preciso* means choosing wording deliberately, not merely sounding polite or strong."
    example_gloss: "Precise control of tone avoids misunderstandings."
  it.c1.unit03.lesson06.teach.fraintendimenti:
    title: "misunderstandings"
    gloss: "misunderstandings"
    note: "*I fraintendimenti* are misunderstandings; precise register helps avoid them."
    example_gloss: "Clear register avoids misunderstandings."

exercises:
  it.c1.unit03.lesson01.exercise01.recognize_formale:
    instruction: "Which tone creates professional distance?"
    correct_option: "formal tone"
    distractors: ["diplomatic tone", "emphatic tone", "ironic tone"]
    accepted_answers:
      - {value: "formal tone", status: correct}
    feedback: "*Un tono formale* creates professional distance."
  it.c1.unit03.lesson02.exercise02.listen_formale:
    instruction: "Listen and select the tone of the sentence."
    correct_option: "Formal Lei request"
    distractors: ["Peer suggestion", "Ironic warning", "Casual complaint"]
    accepted_answers:
      - {value: "Formal Lei request", status: correct}
    feedback: "*Le chiedo cortesemente* signals a formal request."
  it.c1.unit03.lesson01.exercise03.match_toni:
    instruction: "Match each Italian register term to its function."
    accepted_answers:
      - value:
          - {left: "il registro", right: "level of formality"}
          - {left: "un tono formale", right: "professional distance"}
          - {left: "un tono diplomatico", right: "softened disagreement"}
          - {left: "un tono enfatico", right: "strong urgency"}
          - {left: "un tono ironico", right: "indirect criticism"}
          - {left: "il destinatario", right: "the audience addressed"}
        status: correct
    feedback: "The register terms name how wording changes for audience and intent."

  it.c1.unit03.lesson02.exercise01.recognize_lei:
    instruction: "Which wording signals formal Lei address?"
    correct_option: "Le chiedo"
    distractors: ["Ti chiedo", "Ci chiediamo", "Mi chiedo"]
    accepted_answers:
      - {value: "Le chiedo", status: correct}
    feedback: "*Le chiedo* is formal; *Ti chiedo* would be informal."
  it.c1.unit03.lesson02.exercise03.match_formale:
    instruction: "Match the formal-request pieces to their meaning."
    accepted_answers:
      - value:
          - {left: "Le chiedo", right: "I ask you formally"}
          - {left: "cortesemente", right: "courteously"}
          - {left: "concederci", right: "to grant us"}
          - {left: "più tempo", right: "more time"}
          - {left: "rivedere la relazione", right: "review the report"}
          - {left: "un tono formale", right: "formal tone"}
        status: correct
    feedback: "These pieces create a formal, respectful request."
  it.c1.unit03.lesson02.exercise04.order_formale:
    instruction: "Put the Italian words in order to begin the formal request."
    accepted_answers:
      - {value: "Le chiedo cortesemente", status: correct}
    feedback: "*Le chiedo cortesemente* is the formal opening."
  it.c1.unit03.lesson02.exercise05.translate_formale:
    instruction: "Translate into Italian with formal Lei: I kindly ask you to grant us more time to review the report."
    accepted_answers:
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione", status: correct}
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione.", status: correct}
    feedback: "*Le chiedo cortesemente di concederci più tempo per rivedere la relazione* is the formal model."

  it.c1.unit03.lesson03.exercise01.recognize_diplomatico:
    instruction: "Which wording softens the suggestion instead of making a blunt demand?"
    correct_option: "Forse potremmo"
    distractors: ["Dobbiamo assolutamente", "Consegniamola pure così", "Le chiedo"]
    accepted_answers:
      - {value: "Forse potremmo", status: correct}
    feedback: "*Forse potremmo* softens the proposal by making it collaborative."
  it.c1.unit03.lesson03.exercise02.listen_diplomatico:
    instruction: "Listen and select the function of the sentence."
    correct_option: "It diplomatically suggests taking more time."
    distractors: ["It formally grants permission.", "It ironically approves immediate submission.", "It emphatically rejects review."]
    accepted_answers:
      - {value: "It diplomatically suggests taking more time.", status: correct}
    feedback: "*Forse potremmo prenderci ancora un po' di tempo* is a diplomatic suggestion."
  it.c1.unit03.lesson03.exercise03.order_diplomatico:
    instruction: "Put the Italian words in order to form the diplomatic opening."
    accepted_answers:
      - {value: "Forse potremmo prenderci ancora un po' di tempo", status: correct}
    feedback: "*Forse potremmo prenderci ancora un po' di tempo* softens the request."
  it.c1.unit03.lesson03.exercise04.write_diplomatico:
    instruction: "Write the exact taught diplomatic sentence for suggesting more time to review the report."
    accepted_answers:
      - {value: "Forse potremmo prenderci ancora un po' di tempo per rivedere la relazione", status: correct}
      - {value: "Forse potremmo prenderci ancora un po' di tempo per rivedere la relazione.", status: correct}
    feedback: "*Forse potremmo prenderci ancora un po' di tempo per rivedere la relazione* is the taught diplomatic model."

  it.c1.unit03.lesson04.exercise01.recognize_enfatico:
    instruction: "Which opening makes the message emphatic and urgent?"
    correct_option: "Dobbiamo assolutamente"
    distractors: ["Forse potremmo", "Le chiedo cortesemente", "Certo, consegniamola"]
    accepted_answers:
      - {value: "Dobbiamo assolutamente", status: correct}
    feedback: "*Dobbiamo assolutamente* signals urgency."
  it.c1.unit03.lesson04.exercise02.listen_ironico:
    instruction: "Listen and choose what the speaker really means."
    correct_option: "The report should not be submitted like that."
    distractors: ["The report is ready to submit.", "The speaker is formally asking for permission.", "The speaker has no opinion."]
    accepted_answers:
      - {value: "The report should not be submitted like that.", status: correct}
    feedback: "*Cosa potrebbe mai andare storto?* signals controlled irony here."
  it.c1.unit03.lesson04.exercise03.match_contrasto:
    instruction: "Match each Italian expression to its register effect."
    accepted_answers:
      - value:
          - {left: "Dobbiamo assolutamente", right: "urgent emphasis"}
          - {left: "va rivista con cura", right: "must be reviewed carefully"}
          - {left: "Certo", right: "mock agreement"}
          - {left: "consegniamola pure così", right: "let's submit it just like that"}
          - {left: "cosa potrebbe mai andare storto?", right: "what could possibly go wrong?"}
          - {left: "un tono ironico", right: "indirect criticism"}
        status: correct
    feedback: "The emphatic wording states urgency; the ironic wording warns indirectly."
  it.c1.unit03.lesson04.exercise04.translate_enfatico:
    instruction: "Translate into Italian with emphatic urgency: We absolutely must take more time: the report needs to be reviewed carefully."
    accepted_answers:
      - {value: "Dobbiamo assolutamente prenderci più tempo: la relazione va rivista con cura", status: correct}
      - {value: "Dobbiamo assolutamente prenderci più tempo: la relazione va rivista con cura.", status: correct}
    feedback: "*Dobbiamo assolutamente* and *va rivista con cura* create the emphatic version."

  it.c1.unit03.lesson05.exercise01.read_audience:
    instruction: "Which version fits a director, and which fits Elena as a workplace peer?"
    correct_option: "A fits a director; B fits Elena."
    distractors: ["A fits Elena; B fits a director.", "Both are equally formal.", "Both are ironic."]
    accepted_answers:
      - {value: "A fits a director; B fits Elena.", status: correct}
    feedback: "A uses formal *Lei*; B uses controlled irony."
  it.c1.unit03.lesson05.exercise02.match_audience:
    instruction: "Match each audience or tone to the appropriate effect."
    accepted_answers:
      - value:
          - {left: "alla direttrice", right: "formal audience"}
          - {left: "a Elena", right: "peer audience"}
          - {left: "un tono formale", right: "professional distance"}
          - {left: "un tono diplomatico", right: "softened suggestion"}
          - {left: "un tono enfatico", right: "urgent insistence"}
          - {left: "un tono ironico", right: "indirect warning"}
        status: correct
    feedback: "Audience controls whether the same message should be formal, diplomatic, emphatic, or ironic."
  it.c1.unit03.lesson05.exercise03.speak_two_tones:
    instruction: "Say the same message twice: first formally to a director, then ironically to Elena. Use the exact taught models."
    accepted_answers:
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione. Certo, consegniamola pure così: cosa potrebbe mai andare storto?", status: correct}
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione Certo, consegniamola pure così: cosa potrebbe mai andare storto?", status: correct}
    feedback: "The first sentence uses formal *Lei*; the second uses controlled irony."

  it.c1.unit03.lesson06.exercise01.listen_compare:
    instruction: "Listen and choose the tone of the sentence."
    correct_option: "Emphatic urgency"
    distractors: ["Formal distance", "Diplomatic softening", "Controlled irony"]
    accepted_answers:
      - {value: "Emphatic urgency", status: correct}
    feedback: "*Dobbiamo assolutamente* makes the delivery emphatic."
  it.c1.unit03.lesson06.exercise02.read_effect:
    instruction: "What changes between the two versions?"
    correct_option: "The audience and tone change, but the core warning stays the same."
    distractors: ["The subject changes from a report to a bike route.", "Both versions use formal Lei.", "The second version sincerely approves submission."]
    accepted_answers:
      - {value: "The audience and tone change, but the core warning stays the same.", status: correct}
    feedback: "The formal version asks for time; the ironic version warns Elena that submitting now is risky."
  it.c1.unit03.lesson06.exercise03.write_two_registers:
    instruction: "Rewrite the direct idea in two exact taught versions: first formal Lei for a director, then controlled irony for Elena."
    accepted_answers:
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione. Certo, consegniamola pure così: cosa potrebbe mai andare storto?", status: correct}
      - {value: "Le chiedo cortesemente di concederci più tempo per rivedere la relazione Certo, consegniamola pure così: cosa potrebbe mai andare storto?", status: correct}
    feedback: "The answer shifts from formal *Lei* to controlled irony while preserving the same warning."
