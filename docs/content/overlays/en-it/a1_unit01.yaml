review: {status: "reviewed", required_next_reviewer: null, notes: "First en-it overlay, authored against the reviewed it.a1.unit01 realization (Elena/Sam workplace scenario). 2026-07-12 fresh-context review (Claude, isolated from authoring reasoning). Glosses/instructions accurate; choice/listen distractors plausible-but-wrong and never spoken in the referenced single-utterance audio; compiler 0 errors. One fix: exercise04 match_register accepted_answers rights were English glosses (informal/formal/...) but the displayed tiles come from the realization pairs (Italian: informale/formale/...), so grading would never match — corrected to mirror the realization exactly. Native-speaker review still planned.\n\nSecond-pass review 2026-10-18: 6 fixes — lesson01.exercise04.match_register: mirrored Lei -> 'formale' + feedback; lesson02.exercise06.reply_informal: added 'Sto bene, grazie, e tu?'; lesson02.exercise08.write_formal_exchange: instruction now names Buongiorno (Buonasera/no greeting were also valid); lesson03.exercise06.reply_with_name: added 'Io sono Sam'/'Sono Sam' variants; lesson03.exercise08.write_self_intro: added 'Mi chiamo Sam.'/'Sono Sam.' (equally taught, were graded wrong). NATIVE FLAGS: 'Pleased to meet you, Mrs. Elena' example gloss; Elena office-colleague vs later insegnante canon."}

course:
  title: "Italian A1"
  description: "Learn A1-level Italian for everyday greetings and short social exchanges, with detailed English explanations."

units:
  it.a1.unit01.greetings_and_introductions: {title: "Greetings and introductions"}

lessons:
  it.a1.unit01.lesson01.tu_e_lei: {title: "Tu and Lei: greeting informally and formally"}
  it.a1.unit01.lesson02.stare_bene_e_salutarsi: {title: "Replying and saying goodbye"}
  it.a1.unit01.lesson03.presentarsi_in_ufficio: {title: "Introducing yourself: first day at the office"}

teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno: {title: "Ciao, Buongiorno", gloss: "hi / hello, good morning", note: "*Ciao* is a casual, all-purpose greeting used among friends and peers at any time of day. *Buongiorno* is the standard, more formal daytime greeting -- usable any time from morning through the afternoon.", example_gloss: ["Hi, how are you?", "Good morning, how are you?"]}
  it.a1.unit01.lesson01.teach.come_stai_sta: {title: "come stai, come sta", gloss: "how are you (informal), how are you (formal)", note: "*come stai* pairs with *tu* (a friend, a peer); *come sta* pairs with *Lei* (a stranger, a boss, someone shown respect). Same question, different register.", example_gloss: ["Hi, how are you today?", "Good morning, how are you today?"]}
  it.a1.unit01.lesson01.teach.ciao_come_stai: {title: "Ciao, come stai?", gloss: "Hi, how are you?", note: "The casual, informal greeting-plus-question, used with friends, classmates, or peers."}
  it.a1.unit01.lesson01.teach.buongiorno_come_sta: {title: "Buongiorno, come sta?", gloss: "Good morning, how are you?", note: "The formal counterpart, used with someone you'd address respectfully, like a new colleague's manager."}
  it.a1.unit01.lesson01.teach.register_rule: {title: "tu: informale · Lei: formale o rispettoso", gloss: "tu: informal · Lei: formal or respectful", note: "*tu* is the everyday 'you' among friends, classmates, and peers. *Lei* is the polite 'you' for strangers, a workplace hierarchy, or someone you're meeting for the first time -- it takes its own distinct verb forms (compare *tu stai* with *Lei sta*)."}

  it.a1.unit01.lesson02.teach.bene_grazie: {title: "Bene, grazie", gloss: "Good, thanks", note: "A simple, neutral reply to 'how are you,' usable with either register by pairing it with *e tu?* or *e Lei?*", example_gloss: ["Good, thanks, and you?", "Good, thanks, and you? (formal)"]}
  it.a1.unit01.lesson02.teach.e_tu: {title: "E tu?", gloss: "And you? (informal)", note: "The informal way to return the question to a friend or peer."}
  it.a1.unit01.lesson02.teach.e_lei: {title: "E Lei?", gloss: "And you? (formal)", note: "The formal way to return the question, matching the *Lei* register."}
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu: {title: "Bene, grazie, e tu?", gloss: "Good, thanks, and you?", note: "The full informal reply-and-return, said to a friend or peer."}
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei: {title: "Bene, grazie, e Lei?", gloss: "Good, thanks, and you?", note: "The full formal reply-and-return, said to someone you're addressing respectfully."}
  it.a1.unit01.lesson02.teach.buonasera_buonanotte: {title: "Buonasera, Buonanotte", gloss: "good evening, good night", note: "*Buonasera* is a greeting used when arriving somewhere in the evening. *Buonanotte* is a farewell said when someone is going to bed or ending the day -- it is never used as a greeting.", example_gloss: ["Good evening, how are you?", "Good night, see you tomorrow."]}
  it.a1.unit01.lesson02.teach.arrivederla: {title: "Arrivederla, a domani.", gloss: "Goodbye, see you tomorrow.", note: "*Arrivederla* is the formal farewell, used with *Lei*, matching the register of a workplace or a stranger."}
  it.a1.unit01.lesson02.teach.ci_vediamo: {title: "Ciao, ci vediamo domani!", gloss: "Bye, see you tomorrow!", note: "The casual farewell, used with friends and peers you'll see again the next day."}

  it.a1.unit01.lesson03.teach.come_si_chiama: {title: "Come si chiama, scusi?", gloss: "What's your name, excuse me? (formal)", note: "*Come si chiama?* literally asks 'what are you called' in the formal *Lei* register; adding *scusi* ('excuse me') is a natural polite touch when asking a stranger."}
  it.a1.unit01.lesson03.teach.come_ti_chiami: {title: "Come ti chiami?", gloss: "What's your name? (informal)", note: "The informal version, used with a friend, peer, or someone your own age."}
  it.a1.unit01.lesson03.teach.mi_chiamo_elena: {title: "Mi chiamo Elena.", gloss: "My name is Elena.", note: "*chiamarsi* means 'to be called' -- this is the standard way to state your own name, usable in either register."}
  it.a1.unit01.lesson03.teach.io_sono_sam: {title: "Io sono Sam.", gloss: "I am Sam.", note: "A simple alternative to *mi chiamo*, using *essere* (to be) plus your name directly."}
  it.a1.unit01.lesson03.teach.piacere: {title: "Piacere, Piacere di conoscerla", gloss: "pleasure / nice to meet you, pleased to meet you (formal)", note: "*Piacere* on its own is a short, common way to say 'nice to meet you' in either register. *Piacere di conoscerla* is the fuller, formal version, used with *Lei*.", example_gloss: ["My pleasure, Sam!", "Pleased to meet you, Mrs. Elena."]}
  it.a1.unit01.lesson03.teach.benvenuto: {title: "Benvenuto in ufficio!", gloss: "Welcome to the office!", note: "*Benvenuto* is the masculine form of 'welcome' (used for a man; a woman would be welcomed with *Benvenuta*)."}
  it.a1.unit01.lesson03.teach.grazie_mille: {title: "Grazie mille.", gloss: "Thanks a lot. / Thank you very much.", note: "A stronger, more emphatic way to say thanks than a plain *Grazie*."}

exercises:
  it.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: "Which question asks how someone is doing, informally?"
    correct_option: "come stai"
    distractors: ["come sta", "Buongiorno", "Grazie"]
    accepted_answers: [{value: "come stai", status: "correct"}]
    feedback: "*come stai* is the informal way to ask how someone is doing."
  it.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: "Complete the formal greeting."
    correct_option: "come sta"
    distractors: ["come stai", "e tu", "grazie"]
    accepted_answers: [{value: "come sta", status: "correct"}]
    feedback: "*Buongiorno, come sta?* is the formal greeting-plus-question."
  it.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Buongiorno, come sta?"
    distractors: ["Ciao, come stai?", "Buonasera", "Arrivederla, a domani"]
    accepted_answers: [{value: "Buongiorno, come sta?", status: "correct"}]
    feedback: "*Buongiorno, come sta?* is the formal greeting."
  it.a1.unit01.lesson01.exercise04.match_register:
    instruction: "Match each word or phrase to its register."
    accepted_answers:
      - value:
          - {left: "Ciao, come stai?", right: "informale"}
          - {left: "Buongiorno, come sta?", right: "formale"}
          - {left: "tu", right: "informale"}
          - {left: "Lei", right: "formale"}
        status: "correct"
    feedback: "Ciao, come stai? and tu are informale (informal); Buongiorno, come sta? and Lei are formale (formal)."
  it.a1.unit01.lesson01.exercise05.order_formal:
    instruction: "Put the words in the correct order to formally ask how someone is."
    accepted_answers: [{value: ["Buongiorno", "come", "sta"], status: "correct"}]
    feedback: "The correct order is *Buongiorno, come sta?*"
  it.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Ciao", "come", "stai"], status: "correct"}]
    feedback: "The correct order is *Ciao, come stai?*"
  it.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: "Complete the formal greeting."
    accepted_answers:
      - {value: "Buongiorno", status: "correct"}
      - {value: "Buongiorno,", status: "correct"}
    feedback: "*Buongiorno, come sta?* is the formal greeting."
  it.a1.unit01.lesson01.exercise08.listen_type_formal:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Buongiorno, come sta?", status: "correct"}
      - {value: "Buongiorno come sta", status: "correct"}
    feedback: "*Buongiorno, come sta?* means 'Good morning, how are you?'"

  it.a1.unit01.lesson02.exercise01.choose_evening:
    instruction: "Which greeting fits 8:00 PM?"
    correct_option: "Buonasera"
    distractors: ["Buongiorno", "Buonanotte", "Ciao, ci vediamo domani!"]
    accepted_answers: [{value: "Buonasera", status: "correct"}]
    feedback: "*Buonasera* means good evening."
  it.a1.unit01.lesson02.exercise02.listen_night:
    instruction: "Listen and select the word you hear."
    correct_option: "Buonanotte"
    distractors: ["Buonasera", "Buongiorno", "Arrivederla"]
    accepted_answers: [{value: "Buonanotte", status: "correct"}]
    feedback: "*Buonanotte* means good night, said at bedtime."
  it.a1.unit01.lesson02.exercise03.choose_formal_reply:
    instruction: "Someone formally asks 'Buongiorno, come sta?' Choose the natural reply."
    correct_option: "Bene, grazie, e Lei?"
    distractors: ["Bene, grazie, e tu?", "Ciao, come stai?", "Buonanotte"]
    accepted_answers: [{value: "Bene, grazie, e Lei?", status: "correct"}]
    feedback: "*Bene, grazie, e Lei?* replies formally and returns the question in the same register."
  it.a1.unit01.lesson02.exercise04.match_times:
    instruction: "Match each greeting to the time of day it's used."
    accepted_answers:
      - value:
          - {left: "Buongiorno", right: "08:30"}
          - {left: "Buonasera", right: "20:00"}
          - {left: "Buonanotte", right: "23:30"}
        status: "correct"
    feedback: "Buongiorno=08:30, Buonasera=20:00, Buonanotte=23:30."
  it.a1.unit01.lesson02.exercise05.listen_order_formal_reply:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Bene", "grazie", "e", "Lei"], status: "correct"}]
    feedback: "The correct order is *Bene, grazie, e Lei?*"
  it.a1.unit01.lesson02.exercise06.reply_informal:
    instruction: "A friend says 'Ciao! Come stai?' Reply that you're good, thanks, and ask them back informally."
    accepted_answers:
      - {value: "Bene, grazie, e tu?", status: "correct"}
      - {value: "Bene grazie e tu", status: "correct"}
      - {value: "Sto bene, grazie, e tu?", status: "correct"}
    feedback: "*Bene, grazie, e tu?* replies and returns the question informally."
  it.a1.unit01.lesson02.exercise07.complete_close:
    instruction: "Complete the formal farewell."
    accepted_answers:
      - {value: "domani", status: "correct"}
      - {value: "domani.", status: "correct"}
    feedback: "*Arrivederla, a domani.* means 'Goodbye, see you tomorrow.'"
  it.a1.unit01.lesson02.exercise08.write_formal_exchange:
    instruction: "Write the formal exchange: greet with Buongiorno and ask how someone is, then reply that you're good, thanks, and you (formally)."
    accepted_answers:
      - {value: "Buongiorno, come sta? Bene, grazie, e Lei?", status: "correct"}
      - {value: "Buongiorno come sta Bene grazie e Lei", status: "correct"}
    feedback: "*Buongiorno, come sta? Bene, grazie, e Lei?* is the full formal exchange."

  it.a1.unit01.lesson03.exercise01.choose_name_question_informal:
    instruction: "Which question informally asks someone's name?"
    correct_option: "Come ti chiami?"
    distractors: ["Come si chiama, scusi?", "Come stai?", "Piacere"]
    accepted_answers: [{value: "Come ti chiami?", status: "correct"}]
    feedback: "*Come ti chiami?* is the informal way to ask someone's name."
  it.a1.unit01.lesson03.exercise02.listen_formal_name:
    instruction: "Listen and select the question you hear."
    correct_option: "Come si chiama, scusi?"
    distractors: ["Come ti chiami?", "Come sta?", "Piacere di conoscerla"]
    accepted_answers: [{value: "Come si chiama, scusi?", status: "correct"}]
    feedback: "*Come si chiama, scusi?* is the formal way to ask someone's name."
  it.a1.unit01.lesson03.exercise03.choose_natural_answer:
    instruction: "Someone formally asks 'Come si chiama, scusi?' Choose the natural reply."
    correct_option: "Mi chiamo Elena."
    distractors: ["Come ti chiami?", "Buonanotte.", "Bene, grazie, e Lei?"]
    accepted_answers: [{value: "Mi chiamo Elena.", status: "correct"}]
    feedback: "*Mi chiamo Elena.* states your name in reply."
  it.a1.unit01.lesson03.exercise04.order_name:
    instruction: "Put the words in the correct order to say 'I am Sam.'"
    accepted_answers: [{value: ["Io", "sono", "Sam"], status: "correct"}]
    feedback: "The correct order is *Io sono Sam.*"
  it.a1.unit01.lesson03.exercise05.listen_order_intro:
    instruction: "Listen and put the words in the correct order."
    accepted_answers: [{value: ["Mi", "chiamo", "Elena"], status: "correct"}]
    feedback: "The correct order is *Mi chiamo Elena.*"
  it.a1.unit01.lesson03.exercise06.reply_with_name:
    instruction: "Someone says 'Buongiorno! Come si chiama, scusi?' Reply with your name (Sam) and say pleased to meet them, formally."
    accepted_answers:
      - {value: "Mi chiamo Sam, piacere di conoscerla.", status: "correct"}
      - {value: "Mi chiamo Sam. Piacere di conoscerla.", status: "correct"}
      - {value: "Mi chiamo Sam piacere di conoscerla", status: "correct"}
      - {value: "Io sono Sam, piacere di conoscerla.", status: "correct"}
      - {value: "Sono Sam, piacere di conoscerla.", status: "correct"}
    feedback: "*Mi chiamo Sam, piacere di conoscerla.* gives your name and the formal pleasantry."
  it.a1.unit01.lesson03.exercise07.listen_type_pleasure:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "Piacere di conoscerla.", status: "correct"}
      - {value: "Piacere di conoscerla", status: "correct"}
    feedback: "*Piacere di conoscerla* means 'pleased to meet you' (formal)."
  it.a1.unit01.lesson03.exercise08.write_self_intro:
    instruction: "Write a sentence introducing yourself as Sam."
    accepted_answers:
      - {value: "Io sono Sam.", status: "correct"}
      - {value: "Io sono Sam", status: "correct"}
      - {value: "Mi chiamo Sam.", status: "correct"}
      - {value: "Sono Sam.", status: "correct"}
    feedback: "*Io sono Sam.* means 'I am Sam.'"
  it.a1.unit01.lesson01.exercise09.dictation_informal:
    instruction: "Type what you hear."
    correct_option: "Ciao, come stai"
    accepted_answers: [{value: "Ciao, come stai", status: correct}]
    orthography_strict: true
