teaching:
  it.a2.unit33.lesson01.teach_durante_settimana: {title: "durante la settimana", gloss: "during the week", note: "Use this to contrast weekdays with the weekend.", example_gloss: ["During the week I work in the office."]}
  it.a2.unit33.lesson01.teach_ufficio_palestra: {title: "l'ufficio, la palestra", gloss: "office, gym", note: "*In ufficio* and *in palestra* are the natural place phrases.", example_gloss: ["I work in the office.", "I go to the gym on Tuesday."]}
  it.a2.unit33.lesson01.teach_martedi_giovedi: {title: "martedì e giovedì", gloss: "Tuesday and Thursday", note: "Italian weekdays are normally lowercase inside a sentence.", example_gloss: ["On Tuesday I go to the gym and on Thursday I study Italian."]}
  it.a2.unit33.lesson01.teach_poi: {title: "poi", gloss: "then", note: "*Poi* is a simple sequencing connector.", example_gloss: ["I work in the office, then I go to the gym."]}
  it.a2.unit33.lesson02.teach_fine_settimana: {title: "nel fine settimana", gloss: "on the weekend", note: "*Fine settimana* is the standard Italian phrase for weekend.", example_gloss: ["On the weekend I rest."]}
  it.a2.unit33.lesson02.teach_invece: {title: "invece", gloss: "instead / on the other hand", note: "Use *invece* to contrast the weekend with weekdays.", example_gloss: ["On the weekend, on the other hand, I rest."]}
  it.a2.unit33.lesson02.teach_riposo_amici: {title: "riposo, vedo gli amici", gloss: "I rest, I see friends", note: "*Vedo gli amici* is a natural way to say you meet or see friends.", example_gloss: ["On Saturday I rest.", "On Sunday I see friends."]}
  it.a2.unit33.lesson02.teach_prima_poi_invece: {title: "prima, poi, invece", gloss: "first, then, instead", note: "These connectors sequence activities and mark the weekend contrast.", example_gloss: ["First I work, then I study; on the weekend, on the other hand, I rest."]}
exercises:
  it.a2.unit33.lesson01.exercise01.choose_week:
    instruction: "Which phrase means 'during the week'?"
