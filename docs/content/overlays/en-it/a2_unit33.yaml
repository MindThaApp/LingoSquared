    correct_option: "Durante la settimana lavoro in ufficio, poi martedì vado in palestra e giovedì studio italiano."
    distractors: ["Nel fine settimana invece riposo e vedo gli amici.", "Uso i social spesso, ma perdo troppo tempo.", "Il treno parte dal binario tre."]
    accepted_answers: [{value: "Durante la settimana lavoro in ufficio, poi martedì vado in palestra e giovedì studio italiano.", status: "correct"}]
    feedback: "The speaker sequences weekday activities."
