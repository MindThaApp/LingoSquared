      - {value: "Durante la settimana lavoro in ufficio poi martedì vado in palestra e giovedì studio italiano", status: "correct"}
    feedback: "The sentence sequences three weekday activities."
  it.a2.unit33.lesson02.exercise01_choose_weekend:
