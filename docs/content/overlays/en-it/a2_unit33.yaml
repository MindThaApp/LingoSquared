    correct_option: "Nel fine settimana invece riposo e vedo gli amici."
    distractors: ["Durante la settimana lavoro in ufficio.", "Poi martedì vado in palestra.", "Giovedì studio italiano."]
    accepted_answers: [{value: "Nel fine settimana invece riposo e vedo gli amici.", status: "correct"}]
