  it.a2.unit33.lesson01.exercise05.order_poi:
    instruction: "Put the words in order to say 'Then on Tuesday I go to the gym.'"
    accepted_answers: [{value: ["Poi", "martedì", "vado", "in", "palestra"], status: "correct"}]
