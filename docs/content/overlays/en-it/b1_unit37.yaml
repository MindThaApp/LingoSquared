teaching:
  it.b1.unit37.lesson01.teach_se: {title: "se", gloss: "if", note: "*Se* starts a condition.", example_gloss: ["If it arrives today, I will call Sam."]}
  it.b1.unit37.lesson01.teach_arriva: {title: "arriva oggi", gloss: "arrives today", note: "*Arriva* is used for a real or possible condition here.", example_gloss: ["The confirmation arrives today."]}
