course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: discuss an abstract topic -- values,
    culture, and society -- expressing a QUALIFIED opinion and responding
    directly to an opposing view, around whether cities should limit mass
    tourism.

units:
  it.b2.unit06.astrazione:
    title: "Abstract ideas"
    description: Discuss an abstract topic -- ideas, values, and social issues -- expressing an opinion with qualification and responding to another person's view rather than only stating your own.

lessons:
  it.b2.unit06.lesson01.cosa_ne_pensi:
    title: "What do you think?"
  it.b2.unit06.lesson02.unopinione_sfumata:
    title: "A nuanced opinion"
  it.b2.unit06.lesson03.rispondere_a_unobiezione:
    title: "Responding to an objection"
  it.b2.unit06.lesson04.pro_e_contro:
    title: "Pros and cons"
  it.b2.unit06.lesson05.leggere_unopinione:
    title: "Reading an opinion"
  it.b2.unit06.lesson06.in_conversazione:
    title: "In conversation: a nuanced opinion"

teaching:
  it.b2.unit06.lesson01.teach.citta:
    title: "the city"
    gloss: "the city"
    example_gloss: "I live in a city."
  it.b2.unit06.lesson01.teach.turismo_di_massa:
    title: "mass tourism"
    gloss: "mass tourism"
    note: "*Dovrebbero* is the conditional of *dovere* -- 'should'."
    example_gloss: "Cities should limit mass tourism."
  it.b2.unit06.lesson01.teach.cultura:
    title: culture
    gloss: culture
    example_gloss: "Culture is important."
  it.b2.unit06.lesson01.teach.economia:
    title: "the economy"
    gloss: "the economy"
    example_gloss: "The economy also matters."
  it.b2.unit06.lesson01.teach.penso_che:
    title: "I think that"
    gloss: "I think that"
    note: "*Penso che* triggers the congiuntivo: *debbano* (they should), not the indicative *devono*."
    example_gloss: "I think cities should change."
  it.b2.unit06.lesson01.teach.secondo_me:
    title: "in my opinion"
    gloss: "in my opinion"
    example_gloss: "In my opinion, culture is important."
  it.b2.unit06.lesson01.teach.sono_convinto:
    title: "I'm convinced that"
    gloss: "I'm convinced that"
    note: "*Convinto* (masculine speaker) / *convinta* (feminine speaker); *che* here also triggers the congiuntivo (*funzioni*)."
    example_gloss: "I'm convinced it works."
  it.b2.unit06.lesson01.teach.grammar_opinione:
    title: "Opinion frames"
    gloss: "I think cities should change. In my opinion, culture is important. I'm convinced that mass tourism is a problem. It's a good idea."
    note: "*Penso che* and *sono convinto/a che* both take the congiuntivo (debbano, sia); *secondo me* does not change the verb mood."

  it.b2.unit06.lesson02.teach.fino_a_un_certo_punto:
    title: "to a certain extent"
    gloss: "to a certain extent"
    example_gloss: "This is true to a certain extent."
  it.b2.unit06.lesson02.teach.in_generale:
    title: "in general"
    gloss: "in general"
    example_gloss: "In general, the city is better."
  it.b2.unit06.lesson02.teach.in_molti_casi:
    title: "in many cases"
    gloss: "in many cases"
    example_gloss: "In many cases it's right."
  it.b2.unit06.lesson02.teach.non_necessariamente:
    title: "not necessarily"
    gloss: "not necessarily"
    example_gloss: "It's not necessarily negative."
  it.b2.unit06.lesson02.teach.dipende:
    title: "it depends"
    gloss: "it depends"
    example_gloss: "It depends on the city."
  it.b2.unit06.lesson02.teach.responsabilita:
    title: responsibility
    gloss: responsibility
    example_gloss: "Everyone has a responsibility."
  it.b2.unit06.lesson02.teach.grammar_sfumatura:
    title: "Qualifying an opinion"
    gloss: "This is true to a certain extent. In general, the city is better. It depends on the city."
    note: "These frames soften a flat opinion into a QUALIFIED one -- exactly what a B2 speaker uses to avoid overstating a claim."

  it.b2.unit06.lesson03.teach.e_vero_ma:
    title: "that's true, but..."
    gloss: "that's true, but..."
    example_gloss: "That's true, but it's not enough."
  it.b2.unit06.lesson03.teach.capisco_il_tuo_punto:
    title: "I get your point, but..."
    gloss: "I get your point, but..."
    example_gloss: "I get your point, but I think differently."
  it.b2.unit06.lesson03.teach.non_sono_daccordo:
    title: "I disagree, because..."
    gloss: "I disagree, because..."
    example_gloss: "I disagree, because it's too expensive."
  it.b2.unit06.lesson03.teach.sono_daccordo:
    title: "I agree"
    gloss: "I agree"
    example_gloss: "Yes, I agree."
  it.b2.unit06.lesson03.teach.ambiente:
    title: "the environment"
    gloss: "the environment"
    example_gloss: "The environment is important."
  it.b2.unit06.lesson03.teach.grammar_rispondere:
    title: "Responding to an objection"
    gloss: "That's true, but it's not enough. I get your point, but I think differently. I disagree, because it's too expensive."
    note: "A qualified response CONCEDES something before pushing back -- that is what makes it qualified rather than a flat rebuttal."

  it.b2.unit06.lesson04.teach.da_un_lato:
    title: "on one hand ... on the other hand ..."
    gloss: "on one hand ... on the other hand ..."
    example_gloss: "On one hand it's positive, on the other hand it's expensive."
  it.b2.unit06.lesson04.teach.vantaggio:
    title: "the advantage"
    gloss: "the advantage"
    example_gloss: "A car-free city has a big advantage."
  it.b2.unit06.lesson04.teach.svantaggio:
    title: "the disadvantage"
    gloss: "the disadvantage"
    example_gloss: "There is also a disadvantage."
  it.b2.unit06.lesson04.teach.societa:
    title: society
    gloss: society
    example_gloss: "It's positive for society."
  it.b2.unit06.lesson04.teach.piu_sano:
    title: "healthier"
    gloss: "healthier"
    example_gloss: "A city with fewer tourists is healthier."
  it.b2.unit06.lesson04.teach.grammar_pro_contro:
    title: "Weighing two sides"
    gloss: "On one hand there is an advantage, on the other hand there is a disadvantage. It's positive for society."
    note: "*Da un lato ... dall'altro ...* is the standard frame for weighing two sides of an issue."

  it.b2.unit06.lesson05.teach.testo:
    title: "Reading: a qualified opinion"
    gloss: "I think cities should limit mass tourism. I understand that not everyone agrees, because tourism is positive for the economy. To a certain extent that's true. But I'm convinced that a city with fewer tourists is better for society. It's not necessarily easy, but it's worth it."
    glosses:
      tutti: everyone
      migliore: better
      facile: easy
      ne: "of it"
      vale: "is worth"
      pena: "trouble (ne vale la pena = it's worth it)"

  it.b2.unit06.lesson06.teach.dialogue_elena_open:
    title: "Elena: I think cities should limit mass tourism. It's better for culture."
    gloss: "Elena: I think cities should limit mass tourism. It's better for culture."
  it.b2.unit06.lesson06.teach.dialogue_sam_concede:
    title: "Sam: That's true, but not everyone agrees."
    gloss: "Sam: That's true, but not everyone agrees."
  it.b2.unit06.lesson06.teach.dialogue_elena_push:
    title: "Elena: I get your point, but it's better for society too."
    gloss: "Elena: I get your point, but it's better for society too."
  it.b2.unit06.lesson06.teach.dialogue_sam_qualify:
    title: "Sam: I agree with you to a certain extent. But it depends."
    gloss: "Sam: I agree with you to a certain extent. But it depends."
  it.b2.unit06.lesson06.teach.dialogue_elena_conviction:
    title: "Elena: I'm convinced it's worth it."
    gloss: "Elena: I'm convinced it's worth it."
  it.b2.unit06.lesson06.teach.dialogue_sam_final:
    title: "Sam: In my opinion it's not necessarily better."
    gloss: "Sam: In my opinion it's not necessarily better."
  it.b2.unit06.lesson06.teach.grammar_sfumata:
    title: "A full qualified exchange"
    gloss: "I think cities should limit mass tourism, but it depends. I don't necessarily agree on everything."
    note: "A genuinely qualified opinion states a stance AND engages with the other person's view -- not just restating your own."

exercises:
  it.b2.unit06.lesson01.exercise01.recognize_cultura:
    instruction: "What does this word mean?"
    correct_option: culture
    distractors: [agriculture, education, history]
    accepted_answers: [{value: culture, status: correct}]
    feedback: "*Cultura* means culture."
  it.b2.unit06.lesson01.exercise02.listen_opinione_turismo:
    instruction: "Listen and select what you hear."
    correct_option: "I think cities should limit mass tourism."
    distractors: ["I think cities should welcome mass tourism.", "I think the economy should limit tourism.", "I think cities should limit traffic."]
    accepted_answers: [{value: "I think cities should limit mass tourism.", status: correct}]
    feedback: "*Penso che le città debbano limitare il turismo di massa* means I think cities should limit mass tourism."
  it.b2.unit06.lesson01.exercise03.match_opinion_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"penso che": "I think that", "secondo me": "in my opinion", "sono convinto/a che": "I'm convinced that", cultura: culture, economia: economy, "il turismo di massa": "mass tourism", città: cities}
        status: correct
    feedback: "These are this lesson's opinion words."
  it.b2.unit06.lesson01.exercise04.order_penso_che:
    instruction: "Put the words in order: I think cities should change."
    accepted_answers:
      - {value: "Penso che le città debbano cambiare", status: correct}
    feedback: "*Penso che le città debbano cambiare* means I think cities should change."
  it.b2.unit06.lesson01.exercise05.translate_secondo_me:
    instruction: "Translate into Italian, using secondo me: In my opinion, culture is important."
    accepted_answers:
      - {value: "Secondo me la cultura è importante", status: correct}
      - {value: "Secondo me, la cultura è importante", status: correct}
    feedback: "*Secondo me la cultura è importante* means in my opinion, culture is important."
  it.b2.unit06.lesson01.exercise06.speak_sono_convinto:
    instruction: "Say aloud in Italian, using sono convinto/a che: I'm convinced that the economy counts."
    accepted_answers:
      - {value: "Sono convinto che l'economia conti", status: correct}
      - {value: "Sono convinta che l'economia conti", status: correct}
    feedback: "*Sono convinto/a che l'economia conti* means I'm convinced that the economy counts."
  it.b2.unit06.lesson01.exercise07.write_penso_che:
    instruction: "Write in Italian, using penso che: I think it's a good idea."
    accepted_answers:
      - {value: "Penso che sia una buona idea", status: correct}
    feedback: "*Penso che sia una buona idea* means I think it's a good idea."
  it.b2.unit06.lesson01.exercise08.dictation_opinione_turismo:
    instruction: "Type what you hear."
    correct_response: "Penso che le città debbano limitare il turismo di massa"
    orthography_strict: true
    feedback: "You heard *Penso che le città debbano limitare il turismo di massa* — I think cities should limit mass tourism."

  it.b2.unit06.lesson02.exercise01.recognize_responsabilita:
    instruction: "What does this word mean?"
    correct_option: responsibility
    distractors: [responsiveness, respect, response]
    accepted_answers: [{value: responsibility, status: correct}]
    feedback: "*Responsabilità* means responsibility."
  it.b2.unit06.lesson02.exercise02.listen_fino_a_un_certo_punto:
    instruction: "Listen and select what you hear."
    correct_option: "This is true to a certain extent."
    distractors: ["This is completely true.", "This is not true at all.", "This is true in many cases."]
    accepted_answers: [{value: "This is true to a certain extent.", status: correct}]
    feedback: "*Questo è vero fino a un certo punto* means this is true to a certain extent."
  it.b2.unit06.lesson02.exercise03.match_nuance_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"fino a un certo punto": "to a certain extent", "in generale": "in general", "in molti casi": "in many cases", "non necessariamente": "not necessarily", dipende: "it depends", responsabilità: responsibility}
        status: correct
    feedback: "These are this lesson's qualification words."
  it.b2.unit06.lesson02.exercise04.order_non_necessariamente:
    instruction: "Put the words in order: It's not necessarily negative."
    accepted_answers:
      - {value: "Non è necessariamente negativo", status: correct}
    feedback: "*Non è necessariamente negativo* means it's not necessarily negative."
  it.b2.unit06.lesson02.exercise05.translate_in_generale:
    instruction: "Translate into Italian, using in generale: In general, the city is better."
    accepted_answers:
      - {value: "In generale la città è meglio", status: correct}
      - {value: "In generale, la città è meglio", status: correct}
    feedback: "*In generale, la città è meglio* means in general, the city is better."
  it.b2.unit06.lesson02.exercise06.write_dipende:
    instruction: "Write in Italian: It depends."
    accepted_answers:
      - {value: Dipende, status: correct}
    feedback: "*Dipende* means it depends."
  it.b2.unit06.lesson02.exercise07.translate_fino_a_un_certo_punto:
    instruction: "Translate into Italian, using fino a un certo punto: This is true to a certain extent."
    accepted_answers:
      - {value: "Questo è vero fino a un certo punto", status: correct}
      - {value: "Fino a un certo punto questo è vero", status: correct}
    feedback: "*Questo è vero fino a un certo punto* means this is true to a certain extent."

  it.b2.unit06.lesson03.exercise01.recognize_pero:
    instruction: "What does this word mean?"
    correct_option: "but / however"
    distractors: [because, therefore, "and"]
    accepted_answers: [{value: "but / however", status: correct}]
    feedback: "*Però* means but/however, used to push back after conceding a point."
  it.b2.unit06.lesson03.exercise02.listen_e_vero_ma:
    instruction: "Listen and select what you hear."
    correct_option: "That's true, but it's not enough."
    distractors: ["That's not true.", "That's true and it's enough.", "That's true, but it's too late."]
    accepted_answers: [{value: "That's true, but it's not enough.", status: correct}]
    feedback: "*È vero, ma non basta* means that's true, but it's not enough."
  it.b2.unit06.lesson03.exercise03.match_respond_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"è vero, ma": "that's true, but...", "capisco il tuo punto, però": "I get your point, but...", "non sono d'accordo": "I disagree", "sono d'accordo": "I agree", perché: because, ambiente: environment}
        status: correct
    feedback: "These are this lesson's respond-to-opposing words."
  it.b2.unit06.lesson03.exercise04.order_non_sono_daccordo:
    instruction: "Put the words in order: I disagree."
    accepted_answers:
      - {value: "Non sono d'accordo", status: correct}
    feedback: "*Non sono d'accordo* means I disagree."
  it.b2.unit06.lesson03.exercise05.translate_e_vero_ma:
    instruction: "Translate into Italian, conceding then pushing back, using è vero, ma...: That's true, but it's not enough."
    accepted_answers:
      - {value: "È vero, ma non basta", status: correct}
      - {value: "È vero ma non basta", status: correct}
    feedback: "*È vero, ma non basta* means that's true, but it's not enough."
  it.b2.unit06.lesson03.exercise06.speak_non_sono_daccordo:
    instruction: "Say aloud in Italian, disagreeing with a reason, using non sono d'accordo, perché...: I disagree, because it's too expensive."
    accepted_answers:
      - {value: "Non sono d'accordo, perché è troppo costoso", status: correct}
    feedback: "*Non sono d'accordo, perché è troppo costoso* means I disagree, because it's too expensive."
  it.b2.unit06.lesson03.exercise07.write_capisco_il_tuo_punto:
    instruction: "Write in Italian, conceding then disagreeing, using capisco il tuo punto, però...: I get your point, but I think differently."
    accepted_answers:
      - {value: "Capisco il tuo punto, però penso diversamente", status: correct}
      - {value: "Capisco il tuo punto però penso diversamente", status: correct}
    feedback: "*Capisco il tuo punto, però penso diversamente* means I get your point, but I think differently."
  it.b2.unit06.lesson03.exercise08.dictation_e_vero_ma:
    instruction: "Type what you hear."
    correct_response: "È vero, ma non basta"
    orthography_strict: true
    feedback: "You heard *È vero, ma non basta* — that's true, but it's not enough."

  it.b2.unit06.lesson04.exercise01.recognize_vantaggio:
    instruction: "What does this word mean?"
    correct_option: advantage
    distractors: [disadvantage, opportunity, risk]
    accepted_answers: [{value: advantage, status: correct}]
    feedback: "*Vantaggio* means advantage."
  it.b2.unit06.lesson04.exercise02.listen_da_un_lato:
    instruction: "Listen and select what you hear."
    correct_option: "On one hand it's positive, on the other hand it's expensive."
    distractors: ["It's positive and cheap.", "It's negative and expensive.", "On one hand it's negative, on the other hand it's cheap."]
    accepted_answers: [{value: "On one hand it's positive, on the other hand it's expensive.", status: correct}]
    feedback: "*Da un lato è positivo, dall'altro è costoso* means on one hand it's positive, on the other hand it's expensive."
  it.b2.unit06.lesson04.exercise03.match_vantaggi_svantaggi_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"da un lato": "on one hand", "dall'altro": "on the other hand", vantaggio: advantage, svantaggio: disadvantage, società: society, "più sano": healthier}
        status: correct
    feedback: "These are this lesson's weighing-two-sides words."
  it.b2.unit06.lesson04.exercise04.order_piu_sano:
    instruction: "Put the words in order: A city with fewer tourists is healthier."
    accepted_answers:
      - {value: "Una città con meno turisti è più sana", status: correct}
    feedback: "*Una città con meno turisti è più sana* means a city with fewer tourists is healthier."
  it.b2.unit06.lesson04.exercise05.translate_da_un_lato:
    instruction: "Translate into Italian, using da un lato ... dall'altro ...: On one hand it's positive, on the other hand it's expensive."
    accepted_answers:
      - {value: "Da un lato è positivo, dall'altro è costoso", status: correct}
      - {value: "Da un lato è positivo dall'altro è costoso", status: correct}
    feedback: "*Da un lato è positivo, dall'altro è costoso* means on one hand it's positive, on the other hand it's expensive."
  it.b2.unit06.lesson04.exercise06.write_societa:
    instruction: "Write in Italian: It's positive for society."
    accepted_answers:
      - {value: "È positivo per la società", status: correct}
    feedback: "*È positivo per la società* means it's positive (good) for society."
  it.b2.unit06.lesson04.exercise07.translate_svantaggio:
    instruction: "Translate into Italian: It's a big disadvantage for the city."
    accepted_answers:
      - {value: "È un grande svantaggio per la città", status: correct}
    feedback: "*È un grande svantaggio per la città* means it's a big disadvantage for the city."

  it.b2.unit06.lesson05.exercise01.read_stance:
    instruction: "What is the author's overall opinion?"
    correct_option: "Cities should limit mass tourism."
    distractors: ["Cities should welcome unlimited tourism.", "The economy matters more than culture.", "Tourism should be banned entirely."]
    accepted_answers: [{value: "Cities should limit mass tourism.", status: correct}]
    feedback: "The author's overall opinion is that cities should limit mass tourism."
  it.b2.unit06.lesson05.exercise02.read_qualification:
    instruction: "What does the author CONCEDE to the opposing side?"
    correct_option: "That tourism is positive for the economy -- true to a certain extent."
    distractors: ["That mass tourism is harmless.", "That the economy doesn't matter.", "That limiting tourism is easy."]
    accepted_answers: [{value: "That tourism is positive for the economy -- true to a certain extent.", status: correct}]
    feedback: "The author concedes the other side's point -- *il turismo è positivo per l'economia* -- and adds *fino a un certo punto è vero*: to a certain extent that's true."
  it.b2.unit06.lesson05.exercise03.read_final_value:
