      viaggia: travels
      ogni: every
      giorno: day
      treno: train
      lavoro: work
      bicicletta: bike (in bicicletta = by bike)
      solito: usual (di solito = usually)
      piove: rains
      prende: takes
      andare: to go (andare in macchina = to drive)
      preferisce: prefers
      macchina: car
      abita: lives
      vicino: nearby
      piedi: feet (a piedi = on foot)
      vai: you go
