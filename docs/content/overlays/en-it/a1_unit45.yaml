    gloss: 'Luca: I''d rather drive the car.'
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara will walk
    gloss: 'Chiara: I''ll walk, that''s nearby.'
  it.a1.unit45.lesson06.teach.marco_bene_allora:
    title: Marco agrees
    gloss: 'Marco: Good, then I''ll cycle with you, Giulia!'
