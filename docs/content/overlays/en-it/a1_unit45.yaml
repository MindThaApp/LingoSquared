    title: In + vehicle, a piedi on foot
    gloss: 'With transport Italian says in: in treno, in bicicletta, in macchina. On foot is a piedi: vado a piedi.'
    note: 'English says ''by train'', Italian says *in treno*, with no article: *in treno*, not *nel treno*.'
