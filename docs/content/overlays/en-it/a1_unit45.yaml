    title: Who travels how?
    gloss: Giulia travels by train to work every day. Marco usually cycles, but when it rains he also takes the train. Luca prefers to drive the car. Chiara lives nearby and walks to work. How do you travel to work?
    note: 'Contrasts four ways to travel and one condition (*quando piove*, when it rains). *Andare* (to go) is irregular: *vado*, *va*.'
