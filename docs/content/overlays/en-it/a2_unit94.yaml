course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit94.ho_cominciato_a_correre: {"title": "I started running", "description": "Say what you started, stopped, tried or forgot to do with the right preposition: cominciare a, smettere di, provare a, finire di and dimenticare di, in the present and the passato prossimo."}
lessons:
  it.a2.unit94.ho_cominciato_a_correre.lesson01.cominciare_a: {"title": "I started running"}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.smettere_di: {"title": "I stopped looking at the phone"}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.provare_a: {"title": "I tried to..."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.dimenticare_di: {"title": "I forgot to..."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.nuove_abitudini: {"title": "New habits"}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about sport"}
teaching:
  it.a2.unit94.ho_cominciato_a_correre.lesson01.teach.verbi: {"title": "Starting", "gloss": "to begin / to start / to run / to swim / to study", "note": "*Cominciare* and *iniziare* mean the same.", "example_gloss": ["I started running.", "Giulia started swimming.", "Luca starts work at eight.", "Let's start studying."]}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.teach.gn_a: {"title": "Cominciare a + infinitive", "gloss": "I started running. Marco started studying.", "note": "*Cominciare* and *iniziare* take *a* before the infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.teach.gn_participio: {"title": "Passato prossimo with avere", "gloss": "I started. You started. He/she started. We started.", "note": "These verbs use *avere* in the passato prossimo, so the participle does not change."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.teach.tempo: {"title": "When", "gloss": "three months ago / a year ago / every morning / every evening", "note": "*Fa* after a period of time means 'ago'.", "example_gloss": ["Three months ago I started running.", "A year ago Luca started swimming.", "I run every morning.", "I study every evening."]}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.teach.gn_presente: {"title": "Present tense", "gloss": "I start running at seven. We start studying.", "note": "The present works the same way: *comincio a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.teach.verbi: {"title": "Stopping", "gloss": "to stop / to finish / to drink coffee / to eat sweets / to look at the phone / to use the phone", "note": "*Smettere* and *finire* both take *di* before an infinitive.", "example_gloss": ["Marco stopped eating sweets.", "I stopped drinking coffee in the evening.", "I stopped looking at the phone.", "Giulia has finished working."]}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.teach.gn_di: {"title": "Smettere di + infinitive", "gloss": "I stopped drinking coffee. Marco stopped eating sweets.", "note": "*Smettere di* + infinitive means to stop doing something."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.teach.gn_smesso: {"title": "Irregular participle", "gloss": "to stop - stopped. I stopped. He/she stopped.", "note": "The participle of *smettere* is irregular: *smesso*."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.teach.gn_finire: {"title": "Finire di", "gloss": "I finished working. Giulia finished eating.", "note": "*Finire di* means to finish doing something; *smettere di* means to stop, even if not finished."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.teach.sera: {"title": "Screen time", "gloss": "in the evening / more / less / now", "note": "*Più* ('more') and *meno* ('less') go before what you do more or less of.", "example_gloss": ["I look at the phone less.", "I drink more coffee.", "In the evening I do not use the phone."]}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.teach.verbi: {"title": "Trying", "gloss": "to try / to sleep / to read / to walk / to cook", "note": "*Provare a* + infinitive means to try doing something.", "example_gloss": ["I tried running.", "Giulia is trying to sleep early.", "Marco tried reading a book.", "Try cooking!"]}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.teach.gn_provare_a: {"title": "Provare a + infinitive", "gloss": "I tried running. Luca tried swimming.", "note": "*Provare* takes *a* before the infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.teach.gn_prova: {"title": "Prova a...!", "gloss": "Try walking! Try sleeping early!", "note": "The command to a friend is *prova a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.teach.gn_mai: {"title": "Never and ever", "gloss": "I have never tried cooking. Have you ever tried running?", "note": "*Mai* goes between the auxiliary and the participle."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.teach.gn_ma: {"title": "Trying, then stopping", "gloss": "I tried running, but I stopped after a week.", "note": "Combine the verbs with *ma* ('but') to tell a short story."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.teach.verbi: {"title": "Forgetting", "gloss": "to forget / to call / to buy / to bring / bread / shoes", "note": "*Dimenticare di* + infinitive means to forget to do something.", "example_gloss": ["I forgot to call Luca.", "Marco forgot to buy bread.", "I forgot to bring my shoes."]}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.teach.gn_di: {"title": "Dimenticare di", "gloss": "I forgot to call. Giulia forgot to buy bread.", "note": "*Dimenticare* takes *di* before the infinitive. The participle *dimenticato* does not change."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.teach.gn_a_di: {"title": "A or di?", "gloss": "To begin, to try. To stop, to finish, to forget.", "note": "The preposition depends on the verb: *a* with *cominciare/iniziare/provare*; *di* with *smettere/finire/dimenticare*. Learn them as pairs."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.teach.gn_contenta: {"title": "Contento or contenta?", "gloss": "I am happy: I started running (a woman speaking). I am happy: I stopped smoking (a man speaking).", "note": "The adjective agrees with the speaker: *contento* (masculine), *contenta* (feminine)."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.teach.frasi: {"title": "Results", "gloss": "Now I sleep better. Sometimes I forget.", "note": "Say what changed with *ora* ('now')."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.teach.lettura: {"title": "Giulia's new habits", "gloss": "New habits. Three months ago I started running every morning and I stopped looking at my phone in the evening. I tried cooking every evening, but sometimes I forgot to buy vegetables. Now I sleep better and I am happy. Marco stopped eating sweets and Luca started swimming. Giulia", "note": "Notice a after cominciare and provare, di after smettere and dimenticare."}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d1: {"title": "Marco notices", "gloss": "Marco: Giulia, you have changed! What are you doing now?"}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d2: {"title": "Giulia explains", "gloss": "Giulia: I started running every morning and I stopped looking at my phone in the evening."}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d3: {"title": "Marco admits", "gloss": "Marco: Really? I tried running, but I stopped after a week."}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d4: {"title": "Giulia encourages", "gloss": "Giulia: Try again! Every day it gets easier."}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d5: {"title": "Marco decides", "gloss": "Marco: You are right. I forgot to bring my shoes, but tomorrow I start running with you!"}
  it.a2.unit94.ho_cominciato_a_correre.lesson06.teach.d6: {"title": "Giulia agrees", "gloss": "Giulia: Well done! I will wait for you at seven."}
exercises:
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise01.scegli_ho: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho cominciato a correre.", "distractors": ["Ho cominciato correre.", "Ho cominciato di correre.", "Sono cominciato a correre."], "accepted_answers": [{"value": "Ho cominciato a correre.", "status": "correct"}], "feedback": "*Cominciare a* + infinitive, with *avere*."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise02.scegli_iniziare: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia ha iniziato a nuotare.", "distractors": ["Giulia ha iniziato di nuotare.", "Giulia è iniziata a nuotare.", "Giulia ha iniziata a nuotare."], "accepted_answers": [{"value": "Giulia ha iniziato a nuotare.", "status": "correct"}], "feedback": "*Iniziare a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise03.abbina_inizi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ho cominciato a correre.", "right": "I started running."}, {"left": "Giulia ha iniziato a nuotare.", "right": "Giulia started swimming."}, {"left": "Comincio a lavorare alle otto.", "right": "I start work at eight."}, {"left": "Tre mesi fa", "right": "Three months ago"}, {"left": "Corro ogni mattina.", "right": "I run every morning."}, {"left": "Cominciamo a studiare.", "right": "Let's start studying."}], "status": "correct"}], "feedback": "Starting sentences."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise04.ordina_corso: {"instruction": "Put the words in order to say 'Three months ago I started running.'", "correct_option": "Tre mesi fa ho cominciato a correre", "accepted_answers": [{"value": "Tre mesi fa ho cominciato a correre", "status": "correct"}, {"value": "Ho cominciato a correre tre mesi fa", "status": "correct"}], "feedback": "The time expression comes first."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise05.completa_a: {"instruction": "Complete with a or di.", "correct_option": "a", "accepted_answers": [{"value": "a", "status": "correct"}], "feedback": "*Cominciare a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise06.traduci_nuotare: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Un anno fa Luca ha iniziato a nuotare.", "status": "correct"}, {"value": "Un anno fa Luca ha iniziato a nuotare", "status": "correct"}, {"value": "Luca ha iniziato a nuotare un anno fa.", "status": "correct"}, {"value": "Luca ha iniziato a nuotare un anno fa", "status": "correct"}], "feedback": "*Un anno fa* means 'a year ago'."}
  it.a2.unit94.ho_cominciato_a_correre.lesson01.exercise07.scrivi_correre: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Corro ogni mattina.", "status": "correct"}, {"value": "Corro ogni mattina", "status": "correct"}], "feedback": "*Ogni mattina* means 'every morning'.", "correct_option": "Corro ogni mattina."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise01.scegli_smesso: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho smesso di bere caffè.", "distractors": ["Ho smesso a bere caffè.", "Ho smettuto di bere caffè.", "Ho smesso bere caffè."], "accepted_answers": [{"value": "Ho smesso di bere caffè.", "status": "correct"}], "feedback": "*Smettere di*; the participle is *smesso*."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise02.scegli_finito: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia ha finito di lavorare.", "distractors": ["Giulia ha finito a lavorare.", "Giulia è finito di lavorare.", "Giulia ha finita di lavorare."], "accepted_answers": [{"value": "Giulia ha finito di lavorare.", "status": "correct"}], "feedback": "*Finire di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise03.abbina_smettere: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ho smesso di bere caffè.", "right": "I stopped drinking coffee."}, {"left": "Marco ha smesso di mangiare dolci.", "right": "Marco stopped eating sweets."}, {"left": "Ho smesso di guardare il telefono.", "right": "I stopped looking at the phone."}, {"left": "Giulia ha finito di lavorare.", "right": "Giulia has finished working."}, {"left": "Guardo meno il telefono.", "right": "I look at the phone less."}, {"left": "La sera non uso il telefono.", "right": "In the evening I do not use the phone."}], "status": "correct"}], "feedback": "Stopping sentences."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise04.ordina_dolci: {"instruction": "Put the words in order to say 'Marco stopped eating sweets.'", "correct_option": "Marco ha smesso di mangiare dolci", "accepted_answers": [{"value": "Marco ha smesso di mangiare dolci", "status": "correct"}], "feedback": "*Smesso di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise05.completa_di: {"instruction": "Complete with a or di.", "correct_option": "di", "accepted_answers": [{"value": "di", "status": "correct"}], "feedback": "*Smettere di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise06.traduci_telefono: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ho smesso di usare il telefono la sera.", "status": "correct"}, {"value": "Ho smesso di usare il telefono la sera", "status": "correct"}], "feedback": "*Smettere di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson02.exercise07.scrivi_caffe: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Marco ha smesso di bere caffè.", "status": "correct"}, {"value": "Marco ha smesso di bere caffè", "status": "correct"}], "feedback": "*Ha smesso di* + infinitive.", "correct_option": "Marco ha smesso di bere caffè."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise01.scegli_provare: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho provato a correre.", "distractors": ["Ho provato di correre.", "Ho provato correre.", "Sono provato a correre."], "accepted_answers": [{"value": "Ho provato a correre.", "status": "correct"}], "feedback": "*Provare a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise02.scegli_mai: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non ho mai provato a cucinare.", "distractors": ["Non ho provato mai di cucinare.", "Non mai ho provato a cucinare.", "Non sono mai provato a cucinare."], "accepted_answers": [{"value": "Non ho mai provato a cucinare.", "status": "correct"}], "feedback": "*Non ho mai provato a*."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise03.abbina_provare: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ho provato a correre.", "right": "I tried running."}, {"left": "Giulia prova a dormire presto.", "right": "Giulia is trying to sleep early."}, {"left": "Prova a camminare!", "right": "Try walking!"}, {"left": "Non ho mai provato a cucinare.", "right": "I have never tried cooking."}, {"left": "Hai mai provato a correre?", "right": "Have you ever tried running?"}, {"left": "Ho provato a correre, ma ho smesso.", "right": "I tried running, but I stopped."}], "status": "correct"}], "feedback": "Trying sentences."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise04.ordina_prova: {"instruction": "Put the words in order to say 'Try to sleep early.'", "correct_option": "Prova a dormire presto", "accepted_answers": [{"value": "Prova a dormire presto", "status": "correct"}], "feedback": "*Prova a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise05.completa_a: {"instruction": "Complete with a or di.", "correct_option": "a", "accepted_answers": [{"value": "a", "status": "correct"}], "feedback": "*Provare a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise06.traduci_provato: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Hai mai provato a correre?", "status": "correct"}, {"value": "Hai mai provato a correre", "status": "correct"}], "feedback": "*Mai* before the participle."}
  it.a2.unit94.ho_cominciato_a_correre.lesson03.exercise07.scrivi_ma: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ho provato a correre, ma ho smesso.", "status": "correct"}, {"value": "Ho provato a correre ma ho smesso", "status": "correct"}, {"value": "Ho provato a correre ma ho smesso.", "status": "correct"}], "feedback": "*Ma* joins the two verbs.", "correct_option": "Ho provato a correre, ma ho smesso."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise01.scegli_dimenticare: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho dimenticato di chiamare Luca.", "distractors": ["Ho dimenticato a chiamare Luca.", "Ho dimenticato chiamare Luca.", "Ho dimenticata di chiamare Luca."], "accepted_answers": [{"value": "Ho dimenticato di chiamare Luca.", "status": "correct"}], "feedback": "*Dimenticare di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise02.scegli_pane: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco ha dimenticato di comprare il pane.", "distractors": ["Marco ha dimenticato a comprare il pane.", "Marco è dimenticato di comprare il pane.", "Marco ha dimenticato comprare di il pane."], "accepted_answers": [{"value": "Marco ha dimenticato di comprare il pane.", "status": "correct"}], "feedback": "*Ha dimenticato di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise03.abbina_a_di: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "cominciare a", "right": "to begin to"}, {"left": "provare a", "right": "to try to"}, {"left": "smettere di", "right": "to stop"}, {"left": "finire di", "right": "to finish"}, {"left": "dimenticare di", "right": "to forget to"}, {"left": "Ora dormo meglio.", "right": "Now I sleep better."}], "status": "correct"}], "feedback": "Match each verb to its meaning; remember a and di."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise04.ordina_scarpe: {"instruction": "Put the words in order to say 'I forgot to bring my shoes.'", "correct_option": "Ho dimenticato di portare le scarpe", "accepted_answers": [{"value": "Ho dimenticato di portare le scarpe", "status": "correct"}], "feedback": "*Dimenticare di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise05.completa_di: {"instruction": "Complete with a or di.", "correct_option": "di", "accepted_answers": [{"value": "di", "status": "correct"}], "feedback": "*Dimenticare di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise06.traduci_chiamare: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Marco ha dimenticato di chiamare Luca.", "status": "correct"}, {"value": "Marco ha dimenticato di chiamare Luca", "status": "correct"}], "feedback": "*Ha dimenticato di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson04.exercise07.scrivi_contenta: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono contenta.", "status": "correct"}, {"value": "Sono contenta", "status": "correct"}], "feedback": "A woman says *contenta*.", "correct_option": "Sono contenta."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise01.leggi_correre: {"instruction": "Read the text and choose the answer.", "correct_option": "Running every morning.", "distractors": ["Swimming every evening.", "Cooking every day.", "Studying at night."], "accepted_answers": [{"value": "Running every morning.", "status": "correct"}], "feedback": "*Ho cominciato a correre ogni mattina.*"}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise02.leggi_telefono: {"instruction": "Read the text and choose the answer.", "correct_option": "Looking at her phone in the evening.", "distractors": ["Drinking coffee.", "Eating sweets.", "Cooking dinner."], "accepted_answers": [{"value": "Looking at her phone in the evening.", "status": "correct"}], "feedback": "*Ho smesso di guardare il telefono la sera.*"}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ho cominciato a correre.", "right": "I started running."}, {"left": "Ho smesso di guardare il telefono.", "right": "I stopped looking at the phone."}, {"left": "Ho provato a cucinare.", "right": "I tried cooking."}, {"left": "Ho dimenticato di comprare la verdura.", "right": "I forgot to buy vegetables."}, {"left": "Ora dormo meglio.", "right": "Now I sleep better."}, {"left": "Luca ha cominciato a nuotare.", "right": "Luca started swimming."}], "status": "correct"}], "feedback": "These lines come from Giulia's text."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise04.ordina_nuotare: {"instruction": "Put the words in order to say 'Luca started swimming.'", "correct_option": "Luca ha cominciato a nuotare", "accepted_answers": [{"value": "Luca ha cominciato a nuotare", "status": "correct"}], "feedback": "*Cominciare a* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise05.traduci_dolci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Marco ha smesso di mangiare dolci.", "status": "correct"}, {"value": "Marco ha smesso di mangiare dolci", "status": "correct"}], "feedback": "*Smettere di* + infinitive."}
  it.a2.unit94.ho_cominciato_a_correre.lesson05.exercise06.detta_correre: {"instruction": "Type what you hear.", "correct_response": "Ho cominciato a correre ogni mattina.", "orthography_strict": true, "feedback": "You heard *Ho cominciato a correre ogni mattina.*"}
