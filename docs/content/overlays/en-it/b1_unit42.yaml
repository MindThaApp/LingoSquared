course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit42.sequenze: {title: "Describing events with time clauses"}
lessons:
  it.b1.unit42.lesson01.quando_abituale: {title: "When I arrive at the office"}
  it.b1.unit42.lesson02.quando_passato: {title: "When I arrived yesterday"}
teaching:
  it.b1.unit42.lesson01.teach_quando_arrivo: {title: "quando arrivo in ufficio", gloss: "when I arrive at the office", note: "*Quando* + presente marks a habitual time clause.", example_gloss: ["When I arrive at the office, I greet Elena."]}
  it.b1.unit42.lesson01.teach_controllo_email: {title: "controllo le email", gloss: "I check the emails", note: "*Controllo* is present tense first person of *controllare*.", example_gloss: ["Every day I check the emails."]}
  it.b1.unit42.lesson01.teach_frase_abituale: {title: "Quando arrivo in ufficio, controllo le email", gloss: "When I arrive at the office, I check the emails", note: "Both clauses stay in the present for a habitual sequence.", example_gloss: ["When I arrive at the office, I check the emails."]}
  it.b1.unit42.lesson02.teach_quando_sono_arrivato: {title: "quando sono arrivato ieri", gloss: "when I arrived yesterday", note: "*Quando* + passato prossimo marks a past time clause.", example_gloss: ["When I arrived yesterday, I found a message."]}
  it.b1.unit42.lesson02.teach_ho_trovato: {title: "ho trovato un messaggio", gloss: "I found a message", note: "*Ho trovato* is passato prossimo of *trovare*.", example_gloss: ["I found a message from Elena."]}
  it.b1.unit42.lesson02.teach_di_elena: {title: "di Elena", gloss: "from Elena", note: "*Di* marks the sender here.", example_gloss: ["I found a message from Elena."]}
  it.b1.unit42.lesson02.teach_contrasto: {title: "Quando arrivo... Quando sono arrivato...", gloss: "When I arrive... When I arrived...", note: "The final task requires both the habitual/present time clause and the past one.", example_gloss: ["When I arrive at the office, I check the emails. When I arrived yesterday, I found a message from Elena."]}
exercises:
  it.b1.unit42.lesson01.exercise01.choose_quando:
    instruction: "Which word means 'when'?"
    correct_option: "quando"
    distractors: ["mentre", "dopo", "se"]
    accepted_answers: [{value: "quando", status: "correct"}]
    feedback: "*Quando* means when."
  it.b1.unit42.lesson01.exercise02.listen_abituale:
    instruction: "Listen and choose what the sentence says."
    correct_option: "When I arrive at the office, I check the emails."
    distractors: ["When I arrived yesterday, I found a message.", "I check the emails every week.", "Elena arrives at the office at three."]
    accepted_answers: [{value: "When I arrive at the office, I check the emails.", status: "correct"}]
    feedback: "The sentence is *Quando arrivo in ufficio, controllo le email.*"
  it.b1.unit42.lesson01.exercise03.match_abituale:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "when I arrive at the office", right: "quando arrivo in ufficio"}
          - {left: "I check", right: "controllo"}
          - {left: "the emails", right: "le email"}
          - {left: "yesterday", right: "ieri"}
          - {left: "I arrived", right: "sono arrivato"}
          - {left: "the office", right: "ufficio"}
        status: "correct"
    feedback: "These pieces build a habitual present time clause."
  it.b1.unit42.lesson01.exercise04.order_abituale:
    instruction: "Put the words in order to build the habitual sequence."
    accepted_answers: [{value: ["Quando", "arrivo", "in", "ufficio", "controllo", "le", "email"], status: "correct"}]
    feedback: "The sentence is *Quando arrivo in ufficio, controllo le email.*"
  it.b1.unit42.lesson01.exercise05.fill_controllo:
    instruction: "Complete the main clause with *controllo*."
    accepted_answers: [{value: "controllo", status: "correct"}]
    feedback: "*Controllo* is the habitual present action."
  it.b1.unit42.lesson01.exercise06.write_abituale:
    instruction: "Write exactly one Italian sentence with a habitual present time clause: *Quando arrivo in ufficio, controllo le email.*"
    accepted_answers:
      - {value: "Quando arrivo in ufficio, controllo le email.", status: "correct"}
      - {value: "Quando arrivo in ufficio controllo le email", status: "correct"}
    feedback: "*Quando arrivo* marks the habitual time clause, followed by the habitual action."
  it.b1.unit42.lesson02.exercise01.choose_trovato:
    instruction: "Which word means 'found'?"
    correct_option: "trovato"
    distractors: ["arrivato", "controllo", "chiamato"]
    accepted_answers: [{value: "trovato", status: "correct"}]
    feedback: "*Trovato* means found."
  it.b1.unit42.lesson02.exercise02.listen_sequenze:
    instruction: "Listen and choose what the sentences say."
    correct_option: "When I arrive at the office, I check the emails. When I arrived yesterday, I found a message from Elena."
    distractors: ["When Elena arrives, she checks the emails.", "Yesterday I called Sam and found the form.", "I check the emails when Elena calls."]
    accepted_answers: [{value: "When I arrive at the office, I check the emails. When I arrived yesterday, I found a message from Elena.", status: "correct"}]
    feedback: "The pair contrasts a habitual present time clause with a past one."
  it.b1.unit42.lesson02.exercise03.match_passato:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "when I arrived yesterday", right: "quando sono arrivato ieri"}
          - {left: "I found", right: "ho trovato"}
          - {left: "a message", right: "un messaggio"}
          - {left: "from Elena", right: "di Elena"}
          - {left: "the confirmation", right: "la conferma"}
          - {left: "while I was preparing", right: "mentre preparavo"}
        status: "correct"
    feedback: "These pieces build a past time clause and its main event."
  it.b1.unit42.lesson02.exercise04.order_passato:
    instruction: "Put the words in order to build the past sequence."
    accepted_answers: [{value: ["Quando", "sono", "arrivato", "ieri", "ho", "trovato", "un", "messaggio"], status: "correct"}]
    feedback: "The sentence is *Quando sono arrivato ieri, ho trovato un messaggio.*"
  it.b1.unit42.lesson02.exercise05.fill_trovato:
    instruction: "Complete the main clause with *trovato*."
    accepted_answers: [{value: "trovato", status: "correct"}]
    feedback: "*Ho trovato* is passato prossimo for the past main event."
  it.b1.unit42.lesson02.exercise06.write_full_sequenze:
    instruction: "Write exactly two Italian sentences: a habitual present time clause, *Quando arrivo in ufficio, controllo le email*; and a past time clause, *Quando sono arrivato ieri, ho trovato un messaggio di Elena*."
    accepted_answers:
      - {value: "Quando arrivo in ufficio, controllo le email. Quando sono arrivato ieri, ho trovato un messaggio di Elena.", status: "correct"}
      - {value: "Quando arrivo in ufficio controllo le email Quando sono arrivato ieri ho trovato un messaggio di Elena", status: "correct"}
    feedback: "The first sentence sequences a habitual pair in the present; the second sequences a past pair with passato prossimo."
  it.b1.unit42.lesson01.quando_abituale.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Quando arrivo in ufficio, controllo le email."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
