review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for Italian's first C1 unit, authored alongside the realization
    (no adaptable public-domain Italian C1 source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) "da una parte ... dall'altra" renders "on the one
    hand ... on the other hand" but English speakers often reach for
    "d'altro canto" or mis-map "dall'altra" to "from the other side" -- this
    unit teaches only "da una parte ... dall'altra" and keeps the gloss
    distinct; (2) "si" impersonal (si inquina, si rischia, si viaggia)
    has no one-word English equivalent, so it is glossed by effect rather
    than a single word; (3) "temono che" obligatorily triggers the
    congiuntivo ("si rischi"), which English "fear that" + plain indicative
    gives no warning of -- flagged in lesson03; (4) "fa bene alla salute"
    (literally "does well to the health") does not map onto English "is
    good for" word-for-word -- glossed by meaning; (5) English lets a
    speaker drift without signposting, whereas the taught signposts (Parto
    da, da una parte ... dall'altra, apro una piccola parentesi, per
    tornare alla mia idea principale, in definitiva) must actually appear
    -- the culminating lesson06 prompts name the required moves so a
    correct answer is well-determined. No sibling-direction file (it-en)
    was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    reviewed together with realizations/it/c1_unit01_mobilita.yaml (see its
    review block). Fixes: it.c1.unit01.lesson06.exercise04.ordina_struttura
    was graded against an ungrammatical string ('Parto da una parte ...'
    sharing one da, no una before piccola parentesi): added the missing da
    and una tiles so tested_text and the accepted answer are the full
    signpost sequence 'Parto da da una parte dall'altra una piccola
    parentesi per tornare alla mia idea principale in definitiva' (same as
    the sibling lesson06 exercises); lesson02.teach.riduce_lo_stress note
    corrected (lo is the definite article before s + consonant, not a
    pronoun); lesson05.exercise03.match_sintesi dropped the 'tutto sommato'
    pair (confusable with in definitiva) and added 'riduce lo stress' ->
    'reduces stress' (earlier-taught) to keep six pairs, realization
    pairs/tested_text and overlay value in sync;
    lesson05.teach.in_definitiva gloss 'in the end / all things considered'
    -> 'in the end / ultimately'; lesson03.exercise05.translate_temono
    accepts 'Alcuni colleghi temono che si rischi troppo in bicicletta';
    lesson05.exercise02.recognize_in_definitiva instruction 'this sentence'
    -> 'What discourse job does in definitiva perform?';
    lesson01.exercise07.write_direzione feedback no longer says 'Both named
    forms'; lesson01.teach.andare_in_bicicletta note no longer describes
    course construction. NATIVE FLAGS: 'Questa proposta fa bene' (glossed
    'is good for you') may be unidiomatic -- 'è valida/sensata' likelier;
    much C1 lexis is far below C1 (CEFR-fit concern, not a grading defect).
    DEFERRED: lesson06.exercise05.parla_contributo /
    exercise06.scrivi_contributo require an ~80-word monologue verbatim with
    only final-period variants (e.g. no comma-less 'all'ambiente perché'
    variant) -- grading-tolerance design decision; course.description
    differs across en-it C1 overlays (c1_unit01-03) -- owner decision;
    confirm the per-tier self-contained vocabulary assumption with the
    owner.

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 2 fixes -
    lesson05.exercise05.translate_sintesi and
    lesson05.exercise07.write_coesione (overlay accepted answers): added the
    variant with 'andare al lavoro in bicicletta' since the English 'commuting
    by bike' maps to the taught phrase too. NATIVE FLAGS: 'Questa proposta fa
    bene' (a proposal 'doing good') is unidiomatic, 'e valida/sensata'
    likelier; much C1 lexis is below C1. DEFERRED: none new (verbatim
    monologue tasks rely on grader ignoring punctuation and case, which it
    does).

course:
  title: Italian C1
  description: >-
    Advanced Italian discourse: structure an extended spoken or written
    contribution -- signpost its direction, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape.

units:
  it.c1.unit01.mobilita:
    title: "Structuring an extended contribution"
    description: "Signpost a long contribution, develop linked points, bound a digression, return explicitly, and sustain cohesion through a synthesis."

lessons:
  it.c1.unit01.lesson01.annunciare_direzione:
    title: "Announce the direction"
  it.c1.unit01.lesson02.sviluppare_punti:
    title: "Develop the points"
  it.c1.unit01.lesson03.fare_parentesi:
    title: "Make a bounded digression"
  it.c1.unit01.lesson04.tornare_al_punto:
    title: "Return explicitly to the main line"
  it.c1.unit01.lesson05.tenere_filo:
    title: "Sustain reference and synthesize"
  it.c1.unit01.lesson06.contributo_completo:
    title: "The complete contribution"

teaching:
  it.c1.unit01.lesson01.teach.parto_da:
    title: "I start from..."
    gloss: "I start from..."
    note: "*Parto da...* opens a sustained contribution and promises an organized route rather than merely adding a point. It is the preview move every later stage is tied back to."
  it.c1.unit01.lesson01.teach.idea_semplice:
    title: "a simple idea"
    gloss: "a simple idea"
    note: "*Un'idea semplice* is the seed of the whole contribution. The apostrophe in *un'idea* (from *una idea*) is mandatory."
    example_gloss: "I start from a simple idea."
  it.c1.unit01.lesson01.teach.andare_in_bicicletta:
    title: "commuting to work by bike"
    gloss: "to go to work by bike"
    note: "*Andare al lavoro in bicicletta* = to commute to work by bike."
  it.c1.unit01.lesson01.teach.proposta:
    title: "the proposal"
    gloss: "the proposal"
    note: "*La proposta* = the proposal. *Proporre* (to propose) is the verb; *proponi* is its informal 'you' form."
    example_gloss: "The proposal is simple."
  it.c1.unit01.lesson01.teach.prima_di_tutto:
    title: "first of all"
    gloss: "first of all"
    note: "*Prima di tutto* numbers your first, most important step -- the classic way to promise an ordered route."
  it.c1.unit01.lesson01.teach.in_linea_di_massima:
    title: "in broad terms"
    gloss: "in broad terms"
    note: "*In linea di massima* deliberately limits detail and tells the listener to follow the overall shape, not the fine print."
  it.c1.unit01.lesson01.teach.ti_spiego:
    title: "let me explain to you"
    gloss: "I'll explain my reasoning to you"
    note: "*Ti spiego...* is the informal 'you' form of *spiegare* (to explain). It names the reasoning (*il mio ragionamento*) the contribution will lay out."
  it.c1.unit01.lesson01.teach.grammar_direzione:
    title: "A complete roadmap"
    gloss: "I start from a simple idea: commuting to work by bike. First of all, I'll explain my reasoning to you."
    note: "This combines an opening boundary (*Parto da*), the stated topic (*andare al lavoro in bicicletta*), and a promised second stage (*Prima di tutto*)."

  it.c1.unit01.lesson02.teach.da_una_parte:
    title: "on the one hand ... on the other hand"
    gloss: "on the one hand ... on the other hand"
    note: "*Da una parte ... dall'altra ...* numbers the two linked points of the development and keeps each tied to the previewed route."
  it.c1.unit01.lesson02.teach.fa_bene:
    title: "is good for your health"
    gloss: "is good for your health"
    note: "*Fa bene alla salute* = 'it does good to the health', i.e. 'it is good for your health'. *Fa bene* (literally 'does well') is the everyday way to say something is good for you."
  it.c1.unit01.lesson02.teach.in_concreto:
    title: "specifically"
    gloss: "specifically"
    note: "*In concreto* specifies the exact content of a general point -- here, what 'good for your health' actually consists of."
    example_gloss: "Specifically, commuting by bike is good for you."
  it.c1.unit01.lesson02.teach.muoversi:
    title: "to move / get around"
    gloss: "to move / to get around"
    note: "*Muoversi* (reflexive) = to move oneself / get around. Here it means getting daily physical movement."
    example_gloss: "Moving every day keeps you fit."
  it.c1.unit01.lesson02.teach.ogni_giorno:
    title: "every day"
    gloss: "every day"
    note: "*Ogni giorno* = every day -- the frequency that turns commuting into exercise."
  it.c1.unit01.lesson02.teach.tiene_in_forma:
    title: "keeps you fit"
    gloss: "keeps you fit"
    note: "*Tiene in forma* = keeps (you) in shape. *Tenere* (to hold/keep) takes the 3rd-person *tiene* with the impersonal subject *muoversi*."
  it.c1.unit01.lesson02.teach.riduce_lo_stress:
    title: "reduces stress"
    gloss: "reduces stress"
    note: "*Riduce lo stress* = reduces stress. *Lo* is the masculine definite article used before s + consonant (*lo stress*, *lo studente*)."
  it.c1.unit01.lesson02.teach.ambiente:
    title: "the environment"
    gloss: "the environment"
    note: "*L'ambiente* = the environment. With the preposition *a* it contracts to *all'ambiente* (to the environment)."
    example_gloss: "Commuting by bike is good for the environment."
  it.c1.unit01.lesson02.teach.perche:
    title: "because"
    gloss: "because"
    note: "*Perché* gives a reason. It is the everyday default for 'because'."
    example_gloss: "It's good for you, because there is less pollution."
  it.c1.unit01.lesson02.teach.si_inquina_di_meno:
    title: "there is less pollution"
    gloss: "there is less pollution"
    note: "*Si inquina di meno* = 'one pollutes less', i.e. 'there is less pollution'. *Si* here is the impersonal 'one/people'."
  it.c1.unit01.lesson02.teach.vale_a_dire:
    title: "that is to say"
    gloss: "that is to say / in other words"
    note: "*Vale a dire* restates a general point more precisely, much like 'that is to say'."
    example_gloss: "That is to say, there is less pollution."
  it.c1.unit01.lesson02.teach.inoltre:
    title: "in addition"
    gloss: "in addition / moreover"
    note: "*Inoltre* presents the next point as attached to the preceding one, not a fresh start."
    example_gloss: "In addition, it's good for the environment."
  it.c1.unit01.lesson02.teach.grammar_punti:
    title: "Developing two linked points"
    gloss: "On the one hand, it is good for your health: specifically, moving every day keeps you fit and reduces stress. On the other hand, it is good for the environment, because there is less pollution."
    note: "The sequence moves from general claim (*fa bene alla salute*) to specification (*in concreto, ...*) and then to a second, parallel benefit (*dall'altra, fa bene all'ambiente ...*)."

  it.c1.unit01.lesson03.teach.apro_parentesi:
    title: "I open a small aside"
    gloss: "I open a small aside / a brief digression"
    note: "*Apro una piccola parentesi* explicitly marks a temporary, bounded departure from the main line -- the audience is told exactly when the side path begins."
  it.c1.unit01.lesson03.teach.alcuni_temono:
    title: "some colleagues fear that..."
    gloss: "some colleagues fear that..."
    note: "*Alcuni colleghi temono che...* introduces a common objection without owning it yourself. *Temere che* is an opinion/emotion verb, so it triggers the congiuntivo: *temono che ... si rischi* (not *si rischia*)."
  it.c1.unit01.lesson03.teach.preoccupazione:
    title: "an understandable concern"
    gloss: "an understandable concern"
    note: "Calling it *una preoccupazione comprensibile* gives the digression genuine relevance instead of treating it as random detail -- the objection is fair, not dismissed."
    example_gloss: "Traffic is an understandable concern."
  it.c1.unit01.lesson03.teach.rischiare:
    title: "you risk too much"
    gloss: "to risk; you risk too much"
    note: "*Rischiare* = to risk. With impersonal *si*: *si rischia troppo* = 'one risks too much'. After *temono che*, the congiuntivo *si rischi* is used."
    example_gloss: "On a bike you risk too much."
  it.c1.unit01.lesson03.teach.nel_traffico:
    title: "in traffic"
    gloss: "in traffic"
    note: "*Nel traffico* = in (the) traffic. *Nel* = *in + il*."
  it.c1.unit01.lesson03.teach.grammar_parentesi:
    title: "A bounded digression"
    gloss: "I open a small aside: some colleagues fear that on a bike you risk too much in traffic, an understandable concern."
    note: "The boundary marker (*apro una piccola parentesi*) opens the side path, the objection (*alcuni colleghi temono che*) gives it content, and the apposition (*una preoccupazione comprensibile*) validates why it matters."

  it.c1.unit01.lesson04.teach.tornare_al_punto:
    title: "to return to my main idea"
    gloss: "to return to my main idea"
    note: "*Per tornare alla mia idea principale* names both the return and the precise line being resumed -- the explicit signal that the digression is over."
  it.c1.unit01.lesson04.teach.piste_ciclabili:
    title: "the bike lanes"
    gloss: "the bike lanes"
    note: "*Le piste ciclabili* = the bike lanes -- the concrete answer to the digression's safety worry."
    example_gloss: "With the bike lanes, you travel in safety."
  it.c1.unit01.lesson04.teach.in_sicurezza:
    title: "in complete safety"
    gloss: "in complete safety"
    note: "*In tutta sicurezza* = in complete safety. *Tutta* (feminine of *tutto*) intensifies: full, complete safety."
  it.c1.unit01.lesson04.teach.si_viaggia:
    title: "you travel"
    gloss: "one travels / you travel"
    note: "*Si viaggia* = 'one travels'. The impersonal *si* keeps the statement general rather than about one specific person."
  it.c1.unit01.lesson04.teach.tornando_al_punto:
    title: "coming back to the point"
    gloss: "coming back to the point"
    note: "*Tornando al punto* is a shorter alternative return signal: 'coming back to the point'."
  it.c1.unit01.lesson04.teach.grammar_ritorno:
    title: "An explicit return"
    gloss: "But to return to my main idea, with the bike lanes you travel in complete safety."
    note: "*Ma* pivots, the return frame (*per tornare alla mia idea principale*) restores the route, and the bike-lane point reconnects the main idea to the objection."

  it.c1.unit01.lesson05.teach.questa_proposta:
    title: "this proposal"
    gloss: "this proposal"
    note: "*Questa proposta* packages the previously described proposal into one reusable reference, creating cohesion without mechanical repetition."
    example_gloss: "This proposal is good for you."
  it.c1.unit01.lesson05.teach.in_definitiva:
    title: "in the end"
    gloss: "in the end / ultimately"
    note: "*In definitiva* signals that the contribution is drawing its strands together into a conclusion."
    example_gloss: "In the end, commuting by bike is good for you."
  it.c1.unit01.lesson05.teach.significa:
    title: "means"
    gloss: "means"
    note: "*Significa* = means. *Andare in bicicletta significa più salute* = 'commuting by bike means more health'."
    example_gloss: "Commuting by bike means more health."
  it.c1.unit01.lesson05.teach.piu_salute_meno_smog:
    title: "more health and less smog"
    gloss: "more health and less smog"
    note: "*Più salute e meno smog* = more health and less smog -- the two benefits tied together in the synthesis."
  it.c1.unit01.lesson05.teach.tutto_sommato:
    title: "all in all"
    gloss: "all in all"
    note: "*Tutto sommato* = all in all. It is an alternative to *in definitiva* for opening the conclusion."
  it.c1.unit01.lesson05.teach.grammar_sintesi:
    title: "A cohesive synthesis"
    gloss: "This proposal is good for you. In the end, commuting by bike means more health and less smog."
    note: "Repeated concepts are recast as *questa proposta* and *in definitiva*, and the conclusion (*più salute e meno smog*) ties the two benefits together."

  it.c1.unit01.lesson06.teach.elena_domanda:
    title: "Elena: Why do you propose commuting by bike?"
    gloss: "Elena: Why do you propose commuting by bike?"
    note: "Elena uses informal *tu* (*proponi*) to ask Sam to justify his proposal -- the cue that triggers his extended, structured contribution."
  it.c1.unit01.lesson06.teach.contributo_completo:
    title: "The complete structured contribution"
    gloss: "A sustained contribution with roadmap, development, digression, explicit return, and synthesis."
    note: "Track the whole route: *Parto da* → *da una parte ... dall'altra* → *apro una piccola parentesi* → *per tornare alla mia idea principale* → *in definitiva*."

exercises:
  it.c1.unit01.lesson01.exercise01.recognize_parto_da:
    instruction: "What discourse job does Parto da perform?"
    correct_option: "It opens a contribution and previews its direction."
    distractors: ["It closes a contribution.", "It introduces a contradiction.", "It hides the direction."]
    accepted_answers: [{value: "It opens a contribution and previews its direction.", status: correct}]
    feedback: "Parto da explicitly opens the contribution and promises an organized route."
  it.c1.unit01.lesson01.exercise02.listen_preview:
    instruction: "Listen and select what you hear."
    correct_option: "I start from a simple idea: commuting to work by bike."
    distractors: ["I start from a simple idea: commuting to work by car.", "I start from a complex idea: commuting to work by bike.", "I end with a simple idea: commuting to work by bike."]
    accepted_answers: [{value: "I start from a simple idea: commuting to work by bike.", status: correct}]
    feedback: "Parto da un'idea semplice: andare al lavoro in bicicletta means I start from a simple idea: commuting to work by bike."
  it.c1.unit01.lesson01.exercise03.match_direzione:
    instruction: "Match each Italian roadmap element to its English meaning."
    accepted_answers:
      - value: {"Parto da": "I start from", "un'idea semplice": "a simple idea", "andare al lavoro in bicicletta": "commuting to work by bike", "la proposta": "the proposal", "prima di tutto": "first of all", "in linea di massima": "in broad terms", "ti spiego": "let me explain to you"}
        status: correct
    feedback: "These elements announce scope and direction."
  it.c1.unit01.lesson01.exercise04.order_preview:
    instruction: "Put the Italian words in order to open the contribution: I start from a simple idea."
    accepted_answers:
      - {value: "Parto da un'idea semplice", status: correct}
    feedback: "Parto da occupies the opening position and previews the route."
  it.c1.unit01.lesson01.exercise05.translate_prima_di_tutto:
    instruction: "Translate into Italian, using prima di tutto: First of all, I'll explain my reasoning to you."
    accepted_answers:
      - {value: "Prima di tutto ti spiego il mio ragionamento", status: correct}
      - {value: "Prima di tutto, ti spiego il mio ragionamento", status: correct}
    feedback: "The roadmap uses prima di tutto: Prima di tutto ti spiego il mio ragionamento."
  it.c1.unit01.lesson01.exercise06.speak_direzione:
    instruction: "Say aloud in Italian: I start from a simple idea."
    accepted_answers:
      - {value: "Parto da un'idea semplice", status: correct}
    feedback: "Parto da un'idea semplice means I start from a simple idea."
  it.c1.unit01.lesson01.exercise07.write_direzione:
    instruction: "Write in Italian, using Parto da and andare al lavoro in bicicletta: I start from a simple idea: commuting to work by bike."
    accepted_answers:
      - {value: "Parto da un'idea semplice: andare al lavoro in bicicletta", status: correct}
      - {value: "Parto da un'idea semplice: andare al lavoro in bicicletta.", status: correct}
    feedback: "Parto da plus the topic makes the opening move explicit: Parto da un'idea semplice: andare al lavoro in bicicletta."

  it.c1.unit01.lesson02.exercise01.recognize_in_concreto:
    instruction: "What does in concreto do here?"
    correct_option: "It specifies the general point."
    distractors: ["It begins a digression.", "It withdraws the claim.", "It closes the argument."]
    accepted_answers: [{value: "It specifies the general point.", status: correct}]
    feedback: "In concreto introduces the precise content of a general claim."
  it.c1.unit01.lesson02.exercise02.listen_punto:
    instruction: "Listen and select what you hear."
    correct_option: "On the one hand, it is good for your health: specifically, moving every day keeps you fit and reduces stress."
    distractors: ["On the one hand, it is good for your wallet: specifically, moving every day keeps you fit.", "On the other hand, it is good for your health: specifically, sitting every day keeps you fit.", "On the one hand, it is bad for your health: specifically, moving every day adds stress."]
    accepted_answers: [{value: "On the one hand, it is good for your health: specifically, moving every day keeps you fit and reduces stress.", status: correct}]
    feedback: "Da una parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in forma e riduce lo stress means on the one hand, it is good for your health: specifically, moving every day keeps you fit and reduces stress."
  it.c1.unit01.lesson02.exercise03.match_punti:
    instruction: "Match each Italian development element to its English meaning."
    accepted_answers:
      - value: {"Da una parte": "on the one hand", "dall'altra": "on the other hand", "in concreto": "specifically", "vale a dire": "that is to say", "inoltre": "in addition", "fa bene alla salute": "is good for your health", "muoversi ogni giorno": "moving every day", "si inquina di meno": "there is less pollution"}
        status: correct
    feedback: "These forms move, specify, and connect the developed points."
  it.c1.unit01.lesson02.exercise04.order_punto:
    instruction: "Put the Italian words in order to state the first developed point."
    accepted_answers:
      - {value: "Da una parte fa bene alla salute", status: correct}
    feedback: "Da una parte advances the route into the first point."
  it.c1.unit01.lesson02.exercise05.translate_si_inquina:
    instruction: "Translate into Italian, using perché: On the other hand, it is good for the environment, because there is less pollution."
    accepted_answers:
      - {value: "Dall'altra fa bene all'ambiente, perché si inquina di meno", status: correct}
      - {value: "Dall'altra fa bene all'ambiente perché si inquina di meno", status: correct}
    feedback: "Dall'altra fa bene all'ambiente, perché si inquina di meno means on the other hand, it is good for the environment, because there is less pollution."
  it.c1.unit01.lesson02.exercise06.translate_muoversi:
    instruction: "Translate into Italian, using muoversi: Moving every day keeps you fit and reduces stress."
    accepted_answers:
      - {value: "Muoversi ogni giorno tiene in forma e riduce lo stress", status: correct}
    feedback: "Muoversi ogni giorno tiene in forma e riduce lo stress means moving every day keeps you fit and reduces stress."
  it.c1.unit01.lesson02.exercise07.write_due_punti:
    instruction: "Write these two sentences in Italian, using da una parte ... dall'altra, in concreto and perché: On the one hand, it is good for your health: specifically, moving every day keeps you fit and reduces stress. On the other hand, it is good for the environment, because there is less pollution."
    accepted_answers:
      - {value: "Da una parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in forma e riduce lo stress. Dall'altra fa bene all'ambiente, perché si inquina di meno", status: correct}
      - {value: "Da una parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in forma e riduce lo stress. Dall'altra fa bene all'ambiente, perché si inquina di meno.", status: correct}
      - {value: "Da una parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in forma e riduce lo stress. Dall'altra fa bene all'ambiente perché si inquina di meno", status: correct}
    feedback: "Two signposted points: Da una parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in forma e riduce lo stress. Dall'altra fa bene all'ambiente, perché si inquina di meno."

  it.c1.unit01.lesson03.exercise01.recognize_apro_parentesi:
    instruction: "What boundary does this sentence mark?"
    correct_option: "The start of a brief, bounded digression"
    distractors: ["The final conclusion", "The return to the main line", "The initial roadmap"]
    accepted_answers: [{value: "The start of a brief, bounded digression", status: correct}]
    feedback: "Apro una piccola parentesi marks a temporary, bounded departure from the main line."
  it.c1.unit01.lesson03.exercise02.listen_parentesi:
