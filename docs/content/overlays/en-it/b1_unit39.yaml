  it.b1.unit39.lesson01.responsabilita: {title: "I handle the report"}
  it.b1.unit39.lesson02.aggiornamento_aiuto: {title: "Update and request for help"}
teaching:
  it.b1.unit39.lesson01.teach_mi_occupo: {title: "mi occupo di", gloss: "I handle / I take care of", note: "*Mi occupo di* names an area of responsibility.", example_gloss: ["I handle the report."]}
  it.b1.unit39.lesson01.teach_del_rapporto: {title: "del rapporto", gloss: "of the report", note: "*Del rapporto* means of the report; after *mi occupo*, Italian uses *di/del*.", example_gloss: ["The report is ready."]}
  it.b1.unit39.lesson01.teach_ogni_settimana: {title: "ogni settimana", gloss: "every week", note: "This adds how often the responsibility happens.", example_gloss: ["I handle the report every week."]}
  it.b1.unit39.lesson01.teach_responsabile: {title: "sono responsabile del rapporto", gloss: "I am responsible for the report", note: "This is another professional way to name a responsibility.", example_gloss: ["I am responsible for the report."]}
  it.b1.unit39.lesson02.teach_quasi_pronto: {title: "è quasi pronto", gloss: "is almost ready", note: "Use this to give a status update before a task is fully complete.", example_gloss: ["Today the report is almost ready."]}
  it.b1.unit39.lesson02.teach_puoi_controllare: {title: "puoi controllare", gloss: "can you check", note: "This asks a peer colleague for help using *tu*.", example_gloss: ["Can you check the form, please?"]}
  it.b1.unit39.lesson02.teach_per_favore: {title: "per favore", gloss: "please", note: "*Per favore* keeps the request polite in a professional peer message.", example_gloss: ["Can you call Sam, please?"]}
  it.b1.unit39.lesson02.teach_messaggio_lavoro: {title: "Buongiorno, Elena. Oggi il rapporto è quasi pronto. Puoi controllare il modulo, per favore?", gloss: "Good morning, Elena. Today the report is almost ready. Can you check the form, please?", note: "The final task requires a greeting, responsibility, update, and help request.", example_gloss: ["Good morning, Elena. I handle the report every week. Today the report is almost ready. Can you check the form, please?"]}
exercises:
  it.b1.unit39.lesson01.exercise01.choose_mi_occupo:
    instruction: "Which phrase means 'I handle' in a work responsibility?"
    correct_option: "mi occupo di"
    distractors: ["manca la conferma", "sono d'accordo", "puoi controllare"]
    accepted_answers: [{value: "mi occupo di", status: "correct"}]
    feedback: "*Mi occupo di* names what you handle at work."
  it.b1.unit39.lesson01.exercise02.listen_responsibility:
    instruction: "Listen and choose what responsibility the speaker describes."
    correct_option: "The speaker handles the report every week."
    distractors: ["The speaker disagrees about the plan.", "The speaker says the form is missing.", "The speaker asks Elena to call Sam."]
    accepted_answers: [{value: "The speaker handles the report every week.", status: "correct"}]
    feedback: "The sentence is *Mi occupo del rapporto ogni settimana.*"
  it.b1.unit39.lesson01.exercise03.match_responsibility:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I handle", right: "mi occupo di"}
          - {left: "the report", right: "il rapporto"}
          - {left: "of the report", right: "del rapporto"}
          - {left: "every week", right: "ogni settimana"}
          - {left: "responsible", right: "responsabile"}
          - {left: "I handle the report every week", right: "Mi occupo del rapporto ogni settimana"}
        status: "correct"
    feedback: "These pieces describe a work responsibility."
  it.b1.unit39.lesson01.exercise04.order_responsibility:
    instruction: "Put the words in order to build the responsibility sentence."
    accepted_answers: [{value: ["Mi", "occupo", "del", "rapporto", "ogni", "settimana"], status: "correct"}]
    feedback: "The full sentence is *Mi occupo del rapporto ogni settimana.*"
  it.b1.unit39.lesson01.exercise05.fill_rapporto:
    instruction: "Complete the responsibility with the taught word *rapporto*."
    accepted_answers: [{value: "rapporto", status: "correct"}]
    feedback: "*Rapporto* means report."
  it.b1.unit39.lesson01.exercise06.write_responsibility:
    instruction: "Write the exact professional responsibility sentence: *Mi occupo del rapporto ogni settimana*."
    accepted_answers:
      - {value: "Mi occupo del rapporto ogni settimana.", status: "correct"}
      - {value: "Mi occupo del rapporto ogni settimana", status: "correct"}
    feedback: "This names the responsibility and how often it happens."
  it.b1.unit39.lesson02.exercise01.choose_quasi_pronto:
    instruction: "Which phrase means 'is almost ready'?"
    correct_option: "è quasi pronto"
    distractors: ["ogni settimana", "per favore", "sono responsabile"]
    accepted_answers: [{value: "è quasi pronto", status: "correct"}]
    feedback: "*È quasi pronto* gives the task status."
  it.b1.unit39.lesson02.exercise02.listen_update:
    instruction: "Listen and choose what the speaker does."
    correct_option: "The speaker gives an update and asks Elena to check the form."
    distractors: ["The speaker says the report is finished and closes the office.", "The speaker disagrees with Sam about a plan.", "The speaker says Elena must not sign before confirmation."]
    accepted_answers: [{value: "The speaker gives an update and asks Elena to check the form.", status: "correct"}]
    feedback: "The message says the report is almost ready and asks Elena to check the form."
  it.b1.unit39.lesson02.exercise03.match_update_help:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "professional greeting to Elena", right: "Buongiorno, Elena"}
          - {left: "today", right: "oggi"}
          - {left: "the report is almost ready", right: "il rapporto è quasi pronto"}
          - {left: "can you check", right: "puoi controllare"}
          - {left: "the form", right: "il modulo"}
          - {left: "please", right: "per favore"}
        status: "correct"
    feedback: "These pieces build a professional update and help request."
  it.b1.unit39.lesson02.exercise04.order_help_request:
    instruction: "Put the words in order to build the help request."
    accepted_answers: [{value: ["Puoi", "controllare", "il", "modulo", "per", "favore"], status: "correct"}]
    feedback: "The full request is *Puoi controllare il modulo, per favore?*"
  it.b1.unit39.lesson02.exercise05.fill_controllare:
    instruction: "Complete the help request with the taught verb *controllare*."
    accepted_answers: [{value: "controllare", status: "correct"}]
    feedback: "*Puoi controllare...?* asks can you check...?"
  it.b1.unit39.lesson02.exercise06.write_full_work_message:
    instruction: "Write exactly one professional Italian message to Elena with four parts: greeting *Buongiorno, Elena*; responsibility *Mi occupo del rapporto ogni settimana*; update *Oggi il rapporto è quasi pronto*; help request *Puoi controllare il modulo, per favore?*"
    accepted_answers:
      - {value: "Buongiorno, Elena. Mi occupo del rapporto ogni settimana. Oggi il rapporto è quasi pronto. Puoi controllare il modulo, per favore?", status: "correct"}
      - {value: "Buongiorno, Elena Mi occupo del rapporto ogni settimana Oggi il rapporto è quasi pronto Puoi controllare il modulo per favore", status: "correct"}
    feedback: "This covers responsibility, update, and a professional help request."
