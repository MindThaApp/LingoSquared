  it.b1.unit53.lesson01.teach_anche_se_hai_ragione: {title: "anche se hai ragione, preferisco restare", gloss: "even though you're right, I prefer to stay", note: "*Anche se* concedes a valid point on the other side before restating your own position.", example_gloss: ["Even though you're right, I prefer to stay in Milan."]}
  it.b1.unit53.lesson01.teach_nonostante_problema: {title: "nonostante il problema, il progetto continua", gloss: "despite the problem, the project continues", note: "*Nonostante* + noun is another way to concede a point before restating a position.", example_gloss: ["Despite the problem, the project continues well."]}
  it.b1.unit53.lesson01.teach_resto_opinione: {title: "ma resto della mia opinione", gloss: "but I stick to my opinion", note: "Restates your own position after the concession.", example_gloss: ["I understand your point, but I stick to my opinion."]}
  it.b1.unit53.lesson02.teach_tuttavia_credo: {title: "tuttavia, credo che sia necessario cambiare", gloss: "however, I think it's necessary to change something", note: "*Tuttavia* is a stronger, more formal contrastive connector than *ma* or *però*, used to structure a multi-point argument.", example_gloss: ["However, I think it's necessary to change something."]}
  it.b1.unit53.lesson02.teach_primo_punto: {title: "il primo punto è chiaro, tuttavia manca il secondo", gloss: "the first point is clear, however the second is missing", note: "*Tuttavia* links a first point to a second, contrasting point in a multi-point argument.", example_gloss: ["The first point is clear, however the second one is missing."]}
  it.b1.unit53.lesson02.teach_dibattito_completo: {title: "anche se hai ragione... tuttavia, credo che sia necessario...", gloss: "even though you're right... however, I think it's necessary...", note: "The final task requires a concession with *anche se* followed by *tuttavia* to structure the argument.", example_gloss: ["Even though you're right, I prefer to stay. However, I think it's necessary to change something."]}
exercises:
  it.b1.unit53.lesson01.exercise01.choose_anche_se:
    instruction: "Which phrase concedes a valid point before restating a position?"
    correct_option: "anche se hai ragione, preferisco restare"
    distractors: ["hai ragione e preferisco restare", "non hai ragione, preferisco restare", "hai ragione, quindi resto"]
    accepted_answers: [{value: "anche se hai ragione, preferisco restare", status: "correct"}]
    feedback: "*Anche se* concedes the point ('you're right') before restating the position ('I prefer to stay')."
  it.b1.unit53.lesson01.exercise02.listen_concessione:
    instruction: "Listen and choose what the sentences say."
    correct_option: "Even though you're right, I prefer to stay. Despite the problem, the project continues."
    distractors: ["You're right, so I'll stay.", "The problem stopped the project.", "I don't think you're right."]
    accepted_answers: [{value: "Even though you're right, I prefer to stay. Despite the problem, the project continues.", status: "correct"}]
    feedback: "The sentences are *Anche se hai ragione, preferisco restare. Nonostante il problema, il progetto continua.*"
  it.b1.unit53.lesson01.exercise03.match_concessione:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "even though you're right", right: "anche se hai ragione"}
          - {left: "I prefer to stay", right: "preferisco restare"}
          - {left: "despite the problem", right: "nonostante il problema"}
          - {left: "the project continues", right: "il progetto continua"}
          - {left: "but I stick to my opinion", right: "ma resto della mia opinione"}
          - {left: "I understand your point", right: "capisco il tuo punto"}
        status: "correct"
    feedback: "These pieces concede a point before restating a position."
  it.b1.unit53.lesson01.exercise04.order_concessione:
    instruction: "Put the words in order to build the concession."
    accepted_answers: [{value: ["Anche", "se", "hai", "ragione,", "preferisco", "restare"], status: "correct"}]
    feedback: "The sentence is *Anche se hai ragione, preferisco restare.*"
  it.b1.unit53.lesson01.exercise05.fill_ragione:
    instruction: "Complete the sentence with *ragione*."
    accepted_answers: [{value: "ragione", status: "correct"}]
    feedback: "*Avere ragione* means 'to be right'."
  it.b1.unit53.lesson01.exercise06.write_concessione:
    instruction: "Write exactly one sentence that concedes a valid point with *anche se* before restating your position: *Anche se hai ragione, preferisco restare.*"
    accepted_answers:
      - {value: "Anche se hai ragione, preferisco restare.", status: "correct"}
      - {value: "Anche se hai ragione, preferisco restare", status: "correct"}
    feedback: "*Anche se* concedes the point before the restated position."
  it.b1.unit53.lesson02.exercise01.choose_tuttavia:
    instruction: "Which word is a stronger, more formal contrastive connector than *ma*?"
    correct_option: "tuttavia"
    distractors: ["e", "quindi", "perché"]
    accepted_answers: [{value: "tuttavia", status: "correct"}]
    feedback: "*Tuttavia* is a stronger contrastive connector than *ma*, used to structure a multi-point argument."
  it.b1.unit53.lesson02.exercise02.listen_dibattito:
    instruction: "Listen and choose what the sentences say."
    correct_option: "Even though you're right, I prefer to stay. However, I think it's necessary to change something."
    distractors: ["You're right, so nothing needs to change.", "I prefer to stay, and I agree with you completely.", "The first point is missing."]
    accepted_answers: [{value: "Even though you're right, I prefer to stay. However, I think it's necessary to change something.", status: "correct"}]
    feedback: "The sentences are *Anche se hai ragione, preferisco restare. Tuttavia, credo che sia necessario cambiare qualcosa.*"
  it.b1.unit53.lesson02.exercise03.match_tuttavia:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "however", right: "tuttavia"}
          - {left: "I think it's necessary to change something", right: "credo che sia necessario cambiare qualcosa"}
          - {left: "the first point is clear", right: "il primo punto è chiaro"}
          - {left: "the second is missing", right: "manca il secondo"}
          - {left: "even though you're right", right: "anche se hai ragione"}
          - {left: "I prefer to stay", right: "preferisco restare"}
        status: "correct"
    feedback: "These pieces use *tuttavia* to structure a multi-point argument."
  it.b1.unit53.lesson02.exercise04.order_tuttavia:
    instruction: "Put the words in order to build the contrastive statement."
    accepted_answers: [{value: ["Tuttavia,", "credo", "che", "sia", "necessario", "cambiare", "qualcosa"], status: "correct"}]
    feedback: "The sentence is *Tuttavia, credo che sia necessario cambiare qualcosa.*"
  it.b1.unit53.lesson02.exercise05.fill_tuttavia:
    instruction: "Complete the sentence with *tuttavia*."
    accepted_answers: [{value: "tuttavia", status: "correct"}]
    feedback: "*Tuttavia* is the stronger contrastive connector."
  it.b1.unit53.lesson02.exercise06.write_dibattito_completo:
    instruction: "Write exactly two sentences for a nuanced debate: concede a valid point with *anche se*, *Anche se hai ragione, preferisco restare*; then use the stronger contrastive connector than *ma*, *Tuttavia, credo che sia necessario cambiare qualcosa.*"
    accepted_answers:
      - {value: "Anche se hai ragione, preferisco restare. Tuttavia, credo che sia necessario cambiare qualcosa.", status: "correct"}
      - {value: "Anche se hai ragione, preferisco restare Tuttavia, credo che sia necessario cambiare qualcosa", status: "correct"}
    feedback: "The two sentences concede a point, then structure the argument with a stronger contrastive connector."
  it.b1.unit53.lesson01.anche_se.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Anche se hai ragione, preferisco restare. Nonostante il problema, il progetto continua."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
