exercises:
  it.b1.unit53.lesson01.exercise01.choose_anche_se:
    instruction: "Which phrase concedes a valid point before restating a position?"
    correct_option: "anche se hai ragione, preferisco restare"
    distractors: ["hai ragione e preferisco restare", "non hai ragione, preferisco restare", "hai ragione, quindi resto"]
    accepted_answers: [{value: "anche se hai ragione, preferisco restare", status: "correct"}]
    feedback: "*Anche se* concedes the point ('you're right') before restating the position ('I prefer to stay')."
  it.b1.unit53.lesson01.exercise02.listen_concessione:
    instruction: "Listen and choose what the sentences say."
    correct_option: "Even though you're right, I prefer to stay. Despite the problem, the project continues."
    distractors: ["You're right, so I'll stay.", "The problem stopped the project.", "I don't think you're right."]
    accepted_answers: [{value: "Even though you're right, I prefer to stay. Despite the problem, the project continues.", status: "correct"}]
    feedback: "The sentences are *Anche se hai ragione, preferisco restare. Nonostante il problema, il progetto continua.*"
  it.b1.unit53.lesson01.exercise03.match_concessione:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "even though you're right", right: "anche se hai ragione"}
          - {left: "I prefer to stay", right: "preferisco restare"}
          - {left: "despite the problem", right: "nonostante il problema"}
          - {left: "the project continues", right: "il progetto continua"}
          - {left: "but I stick to my opinion", right: "ma resto della mia opinione"}
          - {left: "I understand your point", right: "capisco il tuo punto"}
        status: "correct"
    feedback: "These pieces concede a point before restating a position."
  it.b1.unit53.lesson01.exercise04.order_concessione:
    instruction: "Put the words in order to build the concession."
    accepted_answers: [{value: ["Anche", "se", "hai", "ragione,", "preferisco", "restare"], status: "correct"}]
    feedback: "The sentence is *Anche se hai ragione, preferisco restare.*"
  it.b1.unit53.lesson01.exercise05.fill_ragione:
    instruction: "Complete 'Even if you are right' with the noun used in the expression for 'to be right'."
    accepted_answers: [{value: "ragione", status: "correct"}]
    feedback: "*Avere ragione* means 'to be right'."
  it.b1.unit53.lesson01.exercise06.write_concessione:
    instruction: "Write in Italian a sentence that concedes a point with 'even if' before restating your position: Even if you are right, I prefer to stay."
    accepted_answers:
      - {value: "Anche se hai ragione, preferisco restare.", status: "correct"}
      - {value: "Anche se hai ragione, preferisco restare", status: "correct"}
      - {value: "Anche se ha ragione, preferisco restare.", status: "correct"}
      - {value: "Anche se Lei ha ragione, preferisco restare.", status: "correct"}
    feedback: "*Anche se* concedes the point before the restated position."
  it.b1.unit53.lesson02.exercise01.choose_tuttavia:
    instruction: "Which word is a stronger, more formal contrastive connector than *ma*?"
    correct_option: "tuttavia"
    distractors: ["e", "quindi", "perché"]
    accepted_answers: [{value: "tuttavia", status: "correct"}]
    feedback: "*Tuttavia* is a stronger contrastive connector than *ma*, used to structure a multi-point argument."
  it.b1.unit53.lesson02.exercise02.listen_dibattito:
    instruction: "Listen and choose what the sentences say."
    correct_option: "Even though you're right, I prefer to stay. However, I think it's necessary to change something."
    distractors: ["You're right, so nothing needs to change.", "I prefer to stay, and I agree with you completely.", "The first point is missing."]
    accepted_answers: [{value: "Even though you're right, I prefer to stay. However, I think it's necessary to change something.", status: "correct"}]
    feedback: "The sentences are *Anche se hai ragione, preferisco restare. Tuttavia, credo che sia necessario cambiare qualcosa.*"
  it.b1.unit53.lesson02.exercise03.match_tuttavia:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "however", right: "tuttavia"}
          - {left: "I think it's necessary to change something", right: "credo che sia necessario cambiare qualcosa"}
