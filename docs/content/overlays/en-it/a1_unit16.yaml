teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male: {title: "mi fa male", gloss: "it hurts / ... hurts", note: "*mi fa male* literally means 'it does bad to me' — put a body part after it to say that part hurts.", example_gloss: ["My head hurts."]}
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola: {title: "la testa, la pancia, la gola", gloss: "head, stomach / belly, throat", note: "Three common body parts used with *mi fa male* to describe aches.", example_gloss: ["My stomach hurts.", "My throat hurts."]}
  it.a1.unit16.lesson01.teach.cosa_hai: {title: "Cosa hai?", gloss: "What's wrong?", note: "*Cosa hai?* (literally 'What do you have?') is how you ask someone what's bothering them."}
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa: {title: "Mi fa male la testa.", gloss: "My head hurts.", note: "*la testa* (the head) is feminine, so it takes *la*."}

  it.a1.unit16.lesson02.teach.non_mi_sento_bene: {title: "non mi sento bene", gloss: "I don't feel well", note: "*mi sento* (I feel) plus *bene* (well); *non* negates it to say you don't feel well.", example_gloss: ["I don't feel well today."]}
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse: {title: "la febbre, la tosse", gloss: "fever, cough", note: "Common symptoms, used with *avere* (to have): *Ho la febbre* (I have a fever).", example_gloss: ["I have a fever.", "I have a cough."]}
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase: {title: "Non mi sento bene.", gloss: "I don't feel well.", note: "A general phrase for feeling unwell, useful before naming a specific symptom."}
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse: {title: "Ho la febbre e la tosse.", gloss: "I have a fever and a cough.", note: "*Ho* (I have) plus two symptoms joined with *e* (and)."}

  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa: {title: "il dottore, la dottoressa", gloss: "doctor (male), doctor (female)", note: "*il dottore* and *la dottoressa* are the masculine and feminine forms of 'doctor.'", example_gloss: ["I need to go to the doctor.", "I need to go to the (female) doctor."]}
  it.a1.unit16.lesson03.teach.riposa_la_medicina: {title: "riposa, la medicina", gloss: "rest! (informal), medicine", note: "*riposa* is the informal imperative of *riposare* (to rest); *la medicina* is medicine.", example_gloss: ["Rest today.", "Take this medicine."]}
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore: {title: "Devo andare dal dottore.", gloss: "I need to go to the doctor.", note: "*Devo* (I must/need to) plus *andare dal dottore* (go to the doctor's); *dal* combines *da* + *il*."}
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa: {title: "Prendi questa medicina e riposa.", gloss: "Take this medicine and rest.", note: "*Prendi* (take, informal imperative) plus *questa medicina* (this medicine) and *riposa* (rest)."}

