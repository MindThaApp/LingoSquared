  it.a1.unit10.lesson02.teach.e_lontano_da_qui: {title: "È lontano da qui?", gloss: "Is it far from here?", note: "*È lontano* (is it far) plus *da qui* (from here) asks about distance."}
  it.a1.unit10.lesson02.teach.no_cinque_minuti: {title: "No, sono solo cinque minuti a piedi.", gloss: "No, it's only five minutes on foot.", note: "*a piedi* (on foot) specifies how the distance is measured."}
