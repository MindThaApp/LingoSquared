  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio: {title: "sempre dritto, all'incrocio", gloss: "straight ahead, at the intersection", note: "*sempre dritto* (straight ahead) and *all'incrocio* (at the intersection) describe how and where to turn.", example_gloss: ["Go straight ahead until the intersection."]}
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo: {title: "Scusi, come arrivo al museo?", gloss: "Excuse me, how do I get to the museum?", note: "*Scusi* (excuse me, polite) opens the question before *come arrivo* (how do I get) plus the destination."}
