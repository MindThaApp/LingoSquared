course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit90.posso_entrare: {"title": "May I come in?", "description": "Ask permission and state rules: posso and puoi, si può and non si può, devo and devi, and the difference between non devi (forbidden) and non serve (not necessary)."}
lessons:
  it.a2.unit90.posso_entrare.lesson01.posso: {"title": "May I take a photo?"}
  it.a2.unit90.posso_entrare.lesson02.si_puo: {"title": "You can... You cannot..."}
  it.a2.unit90.posso_entrare.lesson03.devo: {"title": "I must, you must, we must"}
  it.a2.unit90.posso_entrare.lesson04.non_devi: {"title": "Must not or no need?"}
  it.a2.unit90.posso_entrare.lesson05.regole_del_museo: {"title": "The museum rules"}
  it.a2.unit90.posso_entrare.lesson06.giulia_e_marco: {"title": "Giulia and Marco at the museum"}
teaching:
  it.a2.unit90.posso_entrare.lesson01.teach.verbi: {"title": "Things you ask to do", "gloss": "to come in / to take a photo / to use the phone / to sit here / to open the door", "note": "Ask permission with *posso* + infinitive.", "example_gloss": ["May I come in?", "May I take a photo?", "May I use the phone?", "May I open the door?"]}
  it.a2.unit90.posso_entrare.lesson01.teach.gn_posso: {"title": "Posso + infinitive", "gloss": "May I come in? May I take a photo? May I use the phone?", "note": "*Posso* (from *potere*) + infinitive asks for permission. The infinitive comes directly after *posso*."}
  it.a2.unit90.posso_entrare.lesson01.teach.gn_puoi: {"title": "Giving permission to a friend", "gloss": "Yes, you can come in. No, I am sorry, you cannot use the phone.", "note": "With a friend (*tu*) the answer uses *puoi*. *Mi dispiace* softens a refusal."}
  it.a2.unit90.posso_entrare.lesson01.teach.gn_puo: {"title": "Può: Lei or he/she", "gloss": "You (formal) may come in. You (formal) may not take a photo. Marco may open the door.", "note": "*Può* is used for a formal *Lei* and for he or she. The sentence structure stays the same."}
  it.a2.unit90.posso_entrare.lesson01.teach.risposte: {"title": "Replies", "gloss": "Yes, of course. No, I am sorry. Please, come in.", "note": "*Prego, entri* is a polite invitation to a *Lei*."}
  it.a2.unit90.posso_entrare.lesson02.teach.regole: {"title": "Rules", "gloss": "to eat / to smoke / to touch / to talk / forbidden", "note": "*Vietato* means 'forbidden'.", "example_gloss": ["You can eat here.", "You cannot smoke here.", "You must not touch.", "You can talk here.", "Smoking is forbidden."]}
  it.a2.unit90.posso_entrare.lesson02.teach.gn_si_puo: {"title": "Si può", "gloss": "You can come in here. You can take a photo here. You can eat here.", "note": "*Si può* + infinitive states what is allowed for everyone. It is impersonal: it means 'one can'."}
  it.a2.unit90.posso_entrare.lesson02.teach.gn_non_si_puo: {"title": "Non si può", "gloss": "You cannot smoke here. You must not touch. You cannot eat.", "note": "Put *non* before *si*: *non si può* + infinitive. This is the usual way to state a rule."}
  it.a2.unit90.posso_entrare.lesson02.teach.gn_chiedere: {"title": "Asking about a rule", "gloss": "Is it allowed to come in? Is it allowed to take a photo? Is it allowed to use the phone?", "note": "*Si può* + infinitive also asks if something is allowed in general, without naming a person."}
  it.a2.unit90.posso_entrare.lesson02.teach.gn_vietato: {"title": "È vietato", "gloss": "Smoking is forbidden. Eating is forbidden. Using the phone is forbidden.", "note": "*È vietato* + infinitive is common on signs."}
  it.a2.unit90.posso_entrare.lesson03.teach.verbi: {"title": "Things you have to do", "gloss": "to leave the backpack / to pay for the ticket / to show the ticket / to wait here / to leave", "note": "*Biglietto* means 'ticket'.", "example_gloss": ["I must leave my backpack.", "We must pay for the ticket.", "Marco must show his ticket.", "Giulia, you must wait here."]}
  it.a2.unit90.posso_entrare.lesson03.teach.gn_dovere: {"title": "Dovere", "gloss": "I must, you must, he/she must, we must, you (plural) must, they must", "note": "*Dovere* is irregular. Use it with an infinitive, just like *potere*."}
  it.a2.unit90.posso_entrare.lesson03.teach.gn_devi: {"title": "Dovere + infinitive", "gloss": "You must leave the backpack. You (plural) must pay for the ticket. They must wait here.", "note": "*Dovere* + infinitive states an obligation."}
  it.a2.unit90.posso_entrare.lesson03.teach.gn_si_deve: {"title": "Si deve", "gloss": "You have to pay for the ticket. You have to leave the backpack here.", "note": "*Si deve* + infinitive is the impersonal rule: 'one must'."}
  it.a2.unit90.posso_entrare.lesson03.teach.domanda: {"title": "Asking if you must", "gloss": "Do I have to pay? Do I have to leave the backpack? Do we have to wait?", "note": "Questions use the same word order, with a rising voice."}
  it.a2.unit90.posso_entrare.lesson04.teach.bisogno: {"title": "No need", "gloss": "there is no need to / it is not necessary / to book / to touch / the flash", "note": "Italian separates a ban from 'no need'.", "example_gloss": ["There is no need to book.", "Booking is not necessary.", "You must not touch.", "You cannot use the flash."]}
  it.a2.unit90.posso_entrare.lesson04.teach.gn_non_devi: {"title": "Non devi: usually a ban", "gloss": "You must not touch. You must not eat here. You must not use the flash.", "note": "*Non devi* + infinitive usually forbids something. In some contexts it can also mean only 'you do not have to', so for a clear ban prefer *non si può*."}
  it.a2.unit90.posso_entrare.lesson04.teach.gn_non_serve: {"title": "Non serve: not necessary", "gloss": "Booking is not necessary. Paying is not necessary. There is no need to wait.", "note": "To say 'you do not have to', use *non serve* + infinitive or *non c'è bisogno di* + infinitive."}
  it.a2.unit90.posso_entrare.lesson04.teach.gn_confronto: {"title": "The contrast", "gloss": "You must not touch, but you do not need to pay.", "note": "One sentence is a ban, the other is only 'no need'. Do not mix them up."}
  it.a2.unit90.posso_entrare.lesson04.teach.domande: {"title": "Short exchanges", "gloss": "Do I have to book? No, there is no need. Can you pay here? Yes, you can.", "note": "Natural short answers."}
  it.a2.unit90.posso_entrare.lesson05.teach.lettura: {"title": "Museum rules", "gloss": "Museum rules. You can take a photo, but you cannot use the flash. You cannot eat and you must not touch. You have to leave your backpack here. Children do not have to pay for a ticket. There is no need to book.", "note": "This text mixes allowed, forbidden, obligatory and not necessary."}
  it.a2.unit90.posso_entrare.lesson05.teach.gn_non_devono: {"title": "Non devono: no obligation here", "gloss": "Children do not have to pay.", "note": "Here *non devono* means 'they do not have to'. Context tells you whether *non dovere* is a ban or only a lack of obligation. For a clear ban say *non si può*; for no need say *non serve*."}
  it.a2.unit90.posso_entrare.lesson06.teach.d1: {"title": "Giulia asks", "gloss": "Giulia: Marco, may I take a photo here?"}
  it.a2.unit90.posso_entrare.lesson06.teach.d2: {"title": "Marco answers", "gloss": "Marco: Yes, you can take a photo, but you cannot use the flash."}
  it.a2.unit90.posso_entrare.lesson06.teach.d3: {"title": "Giulia asks again", "gloss": "Giulia: Do I have to leave my backpack?"}
  it.a2.unit90.posso_entrare.lesson06.teach.d4: {"title": "Marco explains", "gloss": "Marco: Yes, you have to leave your backpack here. But there is no need to book."}
  it.a2.unit90.posso_entrare.lesson06.teach.d5: {"title": "Giulia is hungry", "gloss": "Giulia: May I eat a sandwich?"}
  it.a2.unit90.posso_entrare.lesson06.teach.d6: {"title": "Marco says no", "gloss": "Marco: No, you cannot eat in the museum. We will eat later."}
exercises:
  it.a2.unit90.posso_entrare.lesson01.exercise01.scegli_entrare: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Posso entrare?", "distractors": ["Posso entro?", "Puoi entrare io?", "Posso entrando?"], "accepted_answers": [{"value": "Posso entrare?", "status": "correct"}], "feedback": "*Posso* + infinitive."}
  it.a2.unit90.posso_entrare.lesson01.exercise02.scegli_puoi: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sì, puoi fare una foto.", "distractors": ["Sì, posso fare una foto.", "Sì, puoi fai una foto.", "Sì, puoi facendo una foto."], "accepted_answers": [{"value": "Sì, puoi fare una foto.", "status": "correct"}], "feedback": "Answer a friend with *puoi* + infinitive."}
  it.a2.unit90.posso_entrare.lesson01.exercise03.abbina_permessi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Posso entrare?", "right": "May I come in?"}, {"left": "Posso fare una foto?", "right": "May I take a photo?"}, {"left": "Sì, certo.", "right": "Yes, of course."}, {"left": "No, mi dispiace.", "right": "No, I am sorry."}, {"left": "Puoi aprire la porta.", "right": "You can open the door."}, {"left": "Può entrare.", "right": "You (formal) may come in."}], "status": "correct"}], "feedback": "These are the basic questions and answers for permission."}
  it.a2.unit90.posso_entrare.lesson01.exercise04.ordina_telefono: {"instruction": "Put the words in order to say 'May I use the phone?'", "correct_option": "Posso usare il telefono", "accepted_answers": [{"value": "Posso usare il telefono", "status": "correct"}], "feedback": "*Posso* comes first, then the infinitive."}
  it.a2.unit90.posso_entrare.lesson01.exercise05.completa_puoi: {"instruction": "Complete with posso or puoi.", "correct_option": "puoi", "accepted_answers": [{"value": "puoi", "status": "correct"}], "feedback": "The answer to a friend uses *puoi*."}
  it.a2.unit90.posso_entrare.lesson01.exercise06.traduci_porta: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Posso aprire la porta?", "status": "correct"}, {"value": "Posso aprire la porta", "status": "correct"}], "feedback": "*Posso aprire* asks for permission."}
  it.a2.unit90.posso_entrare.lesson01.exercise07.scrivi_no: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "No, mi dispiace, non puoi fare una foto.", "status": "correct"}, {"value": "No mi dispiace non puoi fare una foto", "status": "correct"}], "feedback": "*Non puoi* + infinitive says 'you cannot'.", "correct_option": "No, mi dispiace, non puoi fare una foto."}
  it.a2.unit90.posso_entrare.lesson02.exercise01.scegli_si_puo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Qui si può mangiare.", "distractors": ["Qui si puoi mangiare.", "Qui se può mangiare.", "Qui si può mangio."], "accepted_answers": [{"value": "Qui si può mangiare.", "status": "correct"}], "feedback": "*Si può* + infinitive."}
  it.a2.unit90.posso_entrare.lesson02.exercise02.scegli_non_si_puo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Qui non si può fumare.", "distractors": ["Qui si non può fumare.", "Qui non si puoi fumare.", "Qui non si può fumo."], "accepted_answers": [{"value": "Qui non si può fumare.", "status": "correct"}], "feedback": "*Non* goes before *si*."}
  it.a2.unit90.posso_entrare.lesson02.exercise03.abbina_regole: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Qui si può mangiare.", "right": "You can eat here."}, {"left": "Qui non si può fumare.", "right": "You cannot smoke here."}, {"left": "Non si può toccare.", "right": "You must not touch."}, {"left": "Si può entrare?", "right": "Is it allowed to come in?"}, {"left": "È vietato fumare.", "right": "Smoking is forbidden."}, {"left": "Si può fare una foto?", "right": "Is it allowed to take a photo?"}], "status": "correct"}], "feedback": "These sentences state or ask about rules."}
  it.a2.unit90.posso_entrare.lesson02.exercise04.ordina_non_si_puo: {"instruction": "Put the words in order to say 'You cannot smoke here.'", "correct_option": "Qui non si può fumare", "accepted_answers": [{"value": "Qui non si può fumare", "status": "correct"}], "feedback": "*Non si può* is a fixed block."}
  it.a2.unit90.posso_entrare.lesson02.exercise05.completa_si: {"instruction": "Complete with the missing word.", "correct_option": "si", "accepted_answers": [{"value": "si", "status": "correct"}], "feedback": "*Non si può*: the little word *si* is part of the rule."}
  it.a2.unit90.posso_entrare.lesson02.exercise06.traduci_vietato: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "È vietato fumare.", "status": "correct"}, {"value": "È vietato fumare", "status": "correct"}, {"value": "Vietato fumare.", "status": "correct"}, {"value": "Vietato fumare", "status": "correct"}], "feedback": "*È vietato* + infinitive."}
  it.a2.unit90.posso_entrare.lesson02.exercise07.scrivi_si_puo_foto: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Si può fare una foto?", "status": "correct"}, {"value": "Si può fare una foto", "status": "correct"}], "feedback": "*Si può* + infinitive.", "correct_option": "Si può fare una foto?"}
  it.a2.unit90.posso_entrare.lesson03.exercise01.scegli_devo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Devo lasciare lo zaino.", "distractors": ["Devo lasciando lo zaino.", "Dovo lasciare lo zaino.", "Deve lasciare lo zaino io."], "accepted_answers": [{"value": "Devo lasciare lo zaino.", "status": "correct"}], "feedback": "*Devo* + infinitive."}
  it.a2.unit90.posso_entrare.lesson03.exercise02.scegli_dobbiamo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Dobbiamo pagare il biglietto.", "distractors": ["Dobbiamo pagano il biglietto.", "Dovete pagare il biglietto noi.", "Devono pagare il biglietto noi."], "accepted_answers": [{"value": "Dobbiamo pagare il biglietto.", "status": "correct"}], "feedback": "*Dobbiamo* is the noi form."}
  it.a2.unit90.posso_entrare.lesson03.exercise03.abbina_dovere: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "devo", "right": "I must"}, {"left": "devi", "right": "you must"}, {"left": "deve", "right": "he/she must"}, {"left": "dobbiamo", "right": "we must"}, {"left": "dovete", "right": "you (plural) must"}, {"left": "devono", "right": "they must"}], "status": "correct"}], "feedback": "The forms of *dovere* are irregular."}
  it.a2.unit90.posso_entrare.lesson03.exercise04.ordina_mostrare: {"instruction": "Put the words in order to say 'Marco must show his ticket.'", "correct_option": "Marco deve mostrare il biglietto", "accepted_answers": [{"value": "Marco deve mostrare il biglietto", "status": "correct"}], "feedback": "*Deve* goes with Marco."}
  it.a2.unit90.posso_entrare.lesson03.exercise05.completa_devi: {"instruction": "Complete with the correct form of dovere.", "correct_option": "devi", "accepted_answers": [{"value": "devi", "status": "correct"}], "feedback": "Talking to a friend you say *devi*."}
  it.a2.unit90.posso_entrare.lesson03.exercise06.traduci_si_deve: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Si deve pagare il biglietto.", "status": "correct"}, {"value": "Si deve pagare il biglietto", "status": "correct"}], "feedback": "*Si deve* + infinitive."}
  it.a2.unit90.posso_entrare.lesson03.exercise07.scrivi_zaino: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Devo lasciare lo zaino?", "status": "correct"}, {"value": "Devo lasciare lo zaino", "status": "correct"}], "feedback": "*Devo* + infinitive.", "correct_option": "Devo lasciare lo zaino?"}
  it.a2.unit90.posso_entrare.lesson04.exercise01.scegli_divieto: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non devi toccare.", "distractors": ["Non serve toccare.", "Non c'è bisogno di toccare.", "Non serve toccare niente."], "accepted_answers": [{"value": "Non devi toccare.", "status": "correct"}], "feedback": "*Non devi* is the prohibition."}
  it.a2.unit90.posso_entrare.lesson04.exercise02.scegli_bisogno: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non serve prenotare.", "distractors": ["Non serve prenotando.", "Non serve di prenotare.", "Non serve prenotano."], "accepted_answers": [{"value": "Non serve prenotare.", "status": "correct"}], "feedback": "*Non serve* means 'not necessary'."}
  it.a2.unit90.posso_entrare.lesson04.exercise03.abbina_confronto: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Non devi toccare.", "right": "You must not touch."}, {"left": "Non serve prenotare.", "right": "Booking is not necessary."}, {"left": "Non c'è bisogno di pagare.", "right": "There is no need to pay."}, {"left": "Non si può usare il flash.", "right": "You cannot use the flash."}, {"left": "È vietato mangiare.", "right": "Eating is forbidden."}, {"left": "Devo prenotare?", "right": "Do I have to book?"}], "status": "correct"}], "feedback": "Two groups: forbidden and not necessary."}
  it.a2.unit90.posso_entrare.lesson04.exercise04.ordina_serve: {"instruction": "Put the words in order to say 'Booking is not necessary.'", "correct_option": "Non serve prenotare", "accepted_answers": [{"value": "Non serve prenotare", "status": "correct"}], "feedback": "*Non serve* + infinitive."}
  it.a2.unit90.posso_entrare.lesson04.exercise05.completa_non_serve: {"instruction": "Complete with the correct word.", "correct_option": "serve", "accepted_answers": [{"value": "serve", "status": "correct"}], "feedback": "The answer 'no need' is *non serve*."}
  it.a2.unit90.posso_entrare.lesson04.exercise06.traduci_toccare: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non devi toccare.", "status": "correct"}, {"value": "Non devi toccare", "status": "correct"}, {"value": "Non si deve toccare.", "status": "correct"}, {"value": "Non si deve toccare", "status": "correct"}, {"value": "Non si può toccare.", "status": "correct"}, {"value": "Non si può toccare", "status": "correct"}], "feedback": "*Non devi* is the ban."}
  it.a2.unit90.posso_entrare.lesson04.exercise07.scrivi_bisogno: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Non c'è bisogno di pagare.", "status": "correct"}, {"value": "Non c'è bisogno di pagare", "status": "correct"}, {"value": "Non serve pagare.", "status": "correct"}, {"value": "Non serve pagare", "status": "correct"}], "feedback": "Both phrases mean 'no need'.", "correct_option": "Non c'è bisogno di pagare."}
  it.a2.unit90.posso_entrare.lesson05.exercise01.leggi_foto: {"instruction": "Read the text and choose the answer.", "correct_option": "Take a photo without the flash.", "distractors": ["Take a photo with the flash.", "Use the phone.", "Eat a sandwich."], "accepted_answers": [{"value": "Take a photo without the flash.", "status": "correct"}], "feedback": "*Si può fare una foto, ma non si può usare il flash.*"}
  it.a2.unit90.posso_entrare.lesson05.exercise02.leggi_bambini: {"instruction": "Read the text and choose the answer.", "correct_option": "They do not pay for a ticket.", "distractors": ["They must pay.", "They cannot come in.", "They must book."], "accepted_answers": [{"value": "They do not pay for a ticket.", "status": "correct"}], "feedback": "*I bambini non devono pagare.*"}
  it.a2.unit90.posso_entrare.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Si può fare una foto.", "right": "You can take a photo."}, {"left": "Non si può usare il flash.", "right": "You cannot use the flash."}, {"left": "Non si può mangiare.", "right": "You cannot eat."}, {"left": "Si deve lasciare lo zaino.", "right": "You have to leave your backpack."}, {"left": "Non devono pagare il biglietto.", "right": "They do not have to pay for a ticket."}, {"left": "Non c'è bisogno di prenotare.", "right": "There is no need to book."}], "status": "correct"}], "feedback": "These sentences come from the museum rules."}
  it.a2.unit90.posso_entrare.lesson05.exercise04.ordina_zaino: {"instruction": "Put the words in order to say 'You have to leave your backpack here.'", "correct_option": "Si deve lasciare lo zaino qui", "accepted_answers": [{"value": "Si deve lasciare lo zaino qui", "status": "correct"}], "feedback": "*Si deve* + infinitive."}
  it.a2.unit90.posso_entrare.lesson05.exercise05.traduci_mangiare: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non si può mangiare e non si può toccare.", "status": "correct"}, {"value": "Non si può mangiare e non si può toccare", "status": "correct"}, {"value": "Non si può mangiare e non devi toccare.", "status": "correct"}, {"value": "Non si può mangiare e non devi toccare", "status": "correct"}], "feedback": "Both are bans."}
  it.a2.unit90.posso_entrare.lesson05.exercise06.detta_foto: {"instruction": "Type what you hear.", "correct_response": "Si può fare una foto, ma non si può usare il flash.", "orthography_strict": true, "feedback": "You heard *Si può fare una foto, ma non si può usare il flash.*"}
  it.a2.unit90.posso_entrare.lesson05.exercise07.detta_zaino: {"instruction": "Type what you hear.", "correct_response": "Si deve lasciare lo zaino qui.", "orthography_strict": true, "feedback": "You heard *Si deve lasciare lo zaino qui.*"}
  it.a2.unit90.posso_entrare.lesson06.exercise01.capisci_flash: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Yes, but without the flash.", "distractors": ["Yes, with the flash.", "No, never.", "Only outside."], "accepted_answers": [{"value": "Yes, but without the flash.", "status": "correct"}], "feedback": "Marco says *non si può usare il flash*."}
  it.a2.unit90.posso_entrare.lesson06.exercise02.capisci_panino: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "No, it is not allowed.", "distractors": ["Yes, but only a little.", "Yes, in the hall.", "Only after paying."], "accepted_answers": [{"value": "No, it is not allowed.", "status": "correct"}], "feedback": "He says *non si può mangiare*."}
  it.a2.unit90.posso_entrare.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Posso fare una foto qui?", "right": "May I take a photo here?"}, {"left": "Non si può usare il flash.", "right": "You cannot use the flash."}, {"left": "Devo lasciare lo zaino?", "right": "Do I have to leave my backpack?"}, {"left": "Non serve prenotare.", "right": "There is no need to book."}, {"left": "Posso mangiare un panino?", "right": "May I eat a sandwich?"}, {"left": "Non si può mangiare nel museo.", "right": "You cannot eat in the museum."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
