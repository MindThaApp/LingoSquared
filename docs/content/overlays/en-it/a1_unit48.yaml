    title: My birthday is on the eighteenth of April
    gloss: My birthday is on the eighteenth of April.
    note: 'Italian dates use *il* + a cardinal number + the month: *il diciotto aprile*, not ''the eighteenth''. Only the first of the month is *il primo*.'
