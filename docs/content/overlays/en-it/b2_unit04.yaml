course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: recount a complex sequence of events with
    shifting time reference -- background vs. foreground (imperfetto vs.
    passato prossimo), events before other past events (il trapassato
    prossimo), and interrupted vs. ongoing vs. habitual actions (quando vs.
    mentre vs. se) -- around a missed business flight.

units:
  it.b2.unit04.narrativa:
    title: "Narrative"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, events before other past events, and interrupted or ongoing actions -- keeping the timeline unambiguous.

lessons:
  it.b2.unit04.lesson01.lo_sfondo:
    title: "The background: how it was"
  it.b2.unit04.lesson02.levento_e_lordine:
    title: "The event and the order"
  it.b2.unit04.lesson03.quando_mentre_se:
    title: "When, while, if"
  it.b2.unit04.lesson04.il_passato_prima_del_passato:
    title: "The past before the past"
  it.b2.unit04.lesson05.cosa_e_successo_prima:
    title: "What happened first?"
  it.b2.unit04.lesson06.raccontare_tutta_la_storia:
    title: "Telling the whole story"

teaching:
  it.b2.unit04.lesson01.teach.ero_stanco:
    title: "I was tired."
    gloss: "I was tired."
    note: "*Ero* is the imperfetto (1st person) of *essere* -- the tense for background description in a story."
  it.b2.unit04.lesson01.teach.quella_mattina:
    title: "that morning"
    gloss: "that morning"
    example_gloss: "That morning I was tired."
  it.b2.unit04.lesson01.teach.piovere:
    title: "to rain"
    gloss: "to rain"
    note: "*Pioveva* (imperfetto) paints the background scene: 'it was raining', ongoing at the time of the story."
    example_gloss: "It was raining that morning."
  it.b2.unit04.lesson01.teach.fuori:
    title: outside
    gloss: outside
    example_gloss: "Outside it was raining."
  it.b2.unit04.lesson01.teach.freddo:
    title: cold
    gloss: cold
    example_gloss: "Outside it was cold."
  it.b2.unit04.lesson01.teach.avere_fretta:
    title: "I was in a hurry"
    gloss: "I was in a hurry"
    note: "*Avere fretta* = 'to be in a hurry'; *avevo* is the imperfetto -- another background state."
  it.b2.unit04.lesson01.teach.era_ancora_buio:
    title: "It was still dark."
    gloss: "It was still dark."
  it.b2.unit04.lesson01.teach.grammar_imperfetto:
    title: "The imperfetto for background"
    gloss: "It was raining. I was tired. I was in a hurry."
    note: "Background = the scene-setting state of things, expressed with the imperfetto (*pioveva*, *ero*, *avevo*) -- not a completed event, just how things were."

  it.b2.unit04.lesson02.teach.perdere_il_volo:
    title: "to miss the flight"
    gloss: "to miss the flight"
  it.b2.unit04.lesson02.teach.ho_perso_il_volo:
    title: "I missed the flight."
    gloss: "I missed the flight."
    note: "*Ho perso* is the passato prossimo (avere + participle) -- a single completed event, the foreground of the story."
  it.b2.unit04.lesson02.teach.arrivare_in_ritardo:
    title: "to arrive late"
    gloss: "to arrive late"
    note: "*Arrivare* takes *essere* as its auxiliary: *sono arrivato* (I arrived), not *ho arrivato*."
  it.b2.unit04.lesson02.teach.prima:
    title: first
    gloss: "first / earlier"
    example_gloss: "First it was raining."
  it.b2.unit04.lesson02.teach.poi:
    title: "then / after that"
    gloss: "then / after that"
    example_gloss: "Then I was in a hurry."
  it.b2.unit04.lesson02.teach.successivamente:
    title: subsequently
    gloss: subsequently
    example_gloss: "Subsequently I missed the flight."
  it.b2.unit04.lesson02.teach.alla_fine:
    title: "in the end / eventually"
    gloss: "in the end / eventually"
  it.b2.unit04.lesson02.teach.grammar_perfetto:
    title: "The passato prossimo for the foreground event"
    gloss: "I was tired. I was in a hurry. In the end I missed the flight."
    note: "The foregrounded event uses the passato prossimo (*ho perso*), sitting on top of the imperfetto background (*ero*, *avevo*). Sequence markers (*prima*, *poi*, *successivamente*, *alla fine*) make the order explicit."

  it.b2.unit04.lesson03.teach.aeroporto:
    title: "the airport"
    gloss: "the airport"
    example_gloss: "I was at the airport."
  it.b2.unit04.lesson03.teach.partire:
    title: "to depart / leave"
    gloss: "to depart / leave"
    example_gloss: "The plane was leaving."
  it.b2.unit04.lesson03.teach.aereo:
    title: "the plane"
    gloss: "the plane"
    example_gloss: "The plane was leaving."
  it.b2.unit04.lesson03.teach.quando:
    title: "When I arrived at the airport, the plane was leaving."
    gloss: "When I arrived at the airport, the plane was leaving."
    note: "*Quando* marks a single past moment that interrupts an ongoing scene: the imperfetto *partiva* here means 'was in the process of leaving', caught mid-action by the passato prossimo *sono arrivato*."
  it.b2.unit04.lesson03.teach.capo:
    title: "the boss"
    gloss: "the boss"
    example_gloss: "The boss called."
  it.b2.unit04.lesson03.teach.vestirsi:
    title: "to get dressed"
    gloss: "to get dressed"
    example_gloss: "I was getting dressed that morning."
  it.b2.unit04.lesson03.teach.chiamare:
    title: "to call (phone)"
    gloss: "to call (phone)"
    example_gloss: "The boss called."
  it.b2.unit04.lesson03.teach.mentre:
    title: "While I was getting dressed, the boss called."
    gloss: "While I was getting dressed, the boss called."
    note: "*Mentre* marks an ONGOING background action (imperfetto *mi vestivo*) interrupted by a passato prossimo event (*ha chiamato*) -- similar shape to *quando*, but *mentre* frames the background action itself, not just the moment."
  it.b2.unit04.lesson03.teach.se_abitudine:
    title: "If I'm late, I always call the boss."
    gloss: "If I'm late, I always call the boss."
    note: "*Se* here marks a HABIT in the present tense ('if/whenever'), not a single past event. (*Quando* can also express a habit like this; the contrast with the past *quando* above is the tense, not the word.)"
  it.b2.unit04.lesson03.teach.grammar_quando_mentre:
    title: "Quando, mentre, se"
    gloss: "When I arrived, the plane was leaving. While I was getting dressed, the boss called. If I'm late, I always call the boss."
    note: "*Quando* = a single past interruption; *mentre* = an ongoing background action interrupted by an event; *se* = a habitual pattern, not tied to one specific past moment (in the present, *quando* can also mark a habit)."

  it.b2.unit04.lesson04.teach.non:
    title: not
    gloss: not
    example_gloss: "I wasn't tired."
  it.b2.unit04.lesson04.teach.impostare_sveglia:
    title: "to set the alarm"
    gloss: "to set the alarm"
  it.b2.unit04.lesson04.teach.non_avevo_impostato:
    title: "I hadn't set my alarm."
    gloss: "I hadn't set my alarm."
    note: "*Non avevo impostato* is il trapassato prossimo (avevo + participle) -- an event before the OTHER past events in the story, not just background."
  it.b2.unit04.lesson04.teach.sera_prima:
    title: "the evening before"
    gloss: "the evening before"
    example_gloss: "The evening before I was tired."
  it.b2.unit04.lesson04.teach.gia_partito:
    title: "The flight had already left."
    gloss: "The flight had already left."
    note: "*Era già partito* is il trapassato prossimo with *essere* (since *partire* takes *essere*): 'had already left', a fact true before the arrival moment."
  it.b2.unit04.lesson04.teach.prima_di:
    title: before
    gloss: before
    example_gloss: "Before leaving, I was tired."
  it.b2.unit04.lesson04.teach.dopo_che:
    title: after
    gloss: after
    example_gloss: "After he left, I worked."
  it.b2.unit04.lesson04.teach.grammar_trapassato:
    title: "Il trapassato prossimo: the past before the past"
    gloss: "I hadn't set my alarm. The flight had already left."
    note: "Il trapassato prossimo (avevo/ero + participio) marks an event that happened BEFORE another past event already mentioned -- the deepest layer of the timeline."

  it.b2.unit04.lesson05.teach.testo:
    title: "Reading: what happened first?"
    gloss: "In the end I missed the flight. When I arrived at the airport, the flight had already left. It was raining that morning and I was in a hurry. But this had started earlier: the evening before, I hadn't set my alarm. As a result, I woke up late."
    glosses:
      questo: this
      e: and
      ma: but
      iniziato: "begun / started"
      svegliato: "woken up"
      tardi: late

  it.b2.unit04.lesson06.teach.sei:
    title: "you are"
    gloss: "you are"
    note: "*Sei* is the 2nd-person present of *essere*, used here in the passato prossimo question *sei arrivato* (did you arrive)."
    example_gloss: "Are you so tired?"
  it.b2.unit04.lesson06.teach.stamattina:
    title: "this morning"
    gloss: "this morning"
    example_gloss: "Did you arrive this morning?"
  it.b2.unit04.lesson06.teach.eri:
    title: "you were"
    gloss: "you were"
    note: "*Eri* is the 2nd-person imperfetto of *essere*, used for a background state in the past."
    example_gloss: "Were you late?"
  it.b2.unit04.lesson06.teach.capisco:
    title: "I understand"
    gloss: "I understand / I see"
    example_gloss: "I see. First the alarm, then the flight."
  it.b2.unit04.lesson06.teach.esatto:
    title: "exactly"
    gloss: "exactly"
    example_gloss: "Exactly, you missed the flight."
  it.b2.unit04.lesson06.teach.dialogue_elena_domanda:
    title: "Elena: Why did you arrive so late this morning?"
    gloss: "Elena: Why did you arrive so late this morning?"
  it.b2.unit04.lesson06.teach.dialogue_sam_esito:
    title: "Sam: I missed the flight. When I arrived at the airport, it had already left."
    gloss: "Sam: I missed the flight. When I arrived at the airport, it had already left."
  it.b2.unit04.lesson06.teach.dialogue_elena_perche:
    title: "Elena: And why were you late at the airport?"
    gloss: "Elena: And why were you late at the airport?"
  it.b2.unit04.lesson06.teach.dialogue_sam_preterito:
    title: "Sam: I woke up late. The evening before, I hadn't set my alarm."
    gloss: "Sam: I woke up late. The evening before, I hadn't set my alarm."
  it.b2.unit04.lesson06.teach.dialogue_elena_ordine:
    title: "Elena: I see. First the alarm, then the flight."
    gloss: "Elena: I see. First the alarm, then the flight."
  it.b2.unit04.lesson06.teach.dialogue_sam_conferma:
    title: "Sam: Exactly."
    gloss: "Sam: Exactly."
  it.b2.unit04.lesson06.teach.grammar_storia_completa:
    title: "The whole story, three time layers"
    gloss: "It was raining that morning. The evening before, I hadn't set my alarm. In the end I missed the flight."
    note: "A complete narrative has three layers: background (imperfetto), pre-past cause (trapassato prossimo), and foreground outcome (passato prossimo). Telling the events out of order is fine: the tenses show which came first."

exercises:
  it.b2.unit04.lesson01.exercise01.recognize_pioveva:
    instruction: "What does this word mean?"
    correct_option: "it was raining"
    distractors: ["it is raining", "it will rain", "it snowed"]
    accepted_answers: [{value: "it was raining", status: correct}]
    feedback: "*Pioveva* is the imperfetto of *piovere* -- 'it was raining', background."
  it.b2.unit04.lesson01.exercise02.listen_pioveva:
    instruction: "Listen and select what you hear."
    correct_option: "It was raining that morning."
    distractors: ["It is raining this morning.", "It was cold that morning.", "It rained yesterday evening."]
    accepted_answers: [{value: "It was raining that morning.", status: correct}]
    feedback: "*Pioveva quella mattina* means it was raining that morning."
  it.b2.unit04.lesson01.exercise03.match_background_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {"quella mattina": "that morning", piovere: "to rain", "Ero stanco.": "I was tired.", freddo: cold, fuori: outside, "avevo fretta": "I was in a hurry", ancora: still, buio: dark}
        status: correct
    feedback: "These are this lesson's background-setting words."
  it.b2.unit04.lesson01.exercise04.order_ancora_buio:
    instruction: "Put the words in order: It was still dark."
    accepted_answers:
      - {value: "Era ancora buio", status: correct}
    feedback: "*Era ancora buio* means it was still dark."
  it.b2.unit04.lesson01.exercise05.translate_pioveva:
    instruction: "Translate into Italian, setting the background scene with the imperfetto: It was raining that morning."
    accepted_answers:
      - {value: "Pioveva quella mattina", status: correct}
      - {value: "Quella mattina pioveva", status: correct}
    feedback: "*Pioveva quella mattina* means it was raining that morning."
  it.b2.unit04.lesson01.exercise06.write_ero_stanco:
    instruction: "Write in Italian, using the imperfetto for background: I was tired."
    accepted_answers:
      - {value: "Ero stanco", status: correct}
      - {value: "Ero stanca", status: correct}
    feedback: "*Ero stanco* (or *stanca*, said by a woman) means I was tired."
  it.b2.unit04.lesson01.exercise07.speak_avevo_fretta:
    instruction: "Say aloud in Italian, using the imperfetto: I was in a hurry."
    accepted_answers:
      - {value: "Avevo fretta", status: correct}
    feedback: "*Avevo fretta* means I was in a hurry."
  it.b2.unit04.lesson01.exercise08.dictation_pioveva:
    instruction: "Type what you hear."
    correct_response: "Pioveva quella mattina"
    orthography_strict: true
    feedback: "You heard *Pioveva quella mattina* — it was raining that morning."

  it.b2.unit04.lesson02.exercise01.recognize_perso:
    instruction: "What does this word mean?"
    correct_option: missed
    distractors: [forgotten, arrived, delayed]
    accepted_answers: [{value: missed, status: correct}]
    feedback: "*Perso* is the past participle of *perdere*, to miss/lose."
  it.b2.unit04.lesson02.exercise02.listen_ho_perso_volo:
    instruction: "Listen and select what you hear."
    correct_option: "I missed the flight."
    distractors: ["I caught the flight.", "I was late for the flight.", "I booked the flight."]
    accepted_answers: [{value: "I missed the flight.", status: correct}]
    feedback: "*Ho perso il volo* means I missed the flight."
  it.b2.unit04.lesson02.exercise03.match_sequence_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {prima: first, poi: "then / after that", successivamente: subsequently, "alla fine": "in the end / eventually", "il volo": "the flight", "in ritardo": late, perso: missed, arrivato: arrived}
        status: correct
    feedback: "These are this lesson's sequencing words."
  it.b2.unit04.lesson02.exercise04.order_arrivato_in_ritardo:
    instruction: "Put the words in order: I arrived late."
    accepted_answers:
      - {value: "Sono arrivato in ritardo", status: correct}
    feedback: "*Sono arrivato in ritardo* means I arrived late."
  it.b2.unit04.lesson02.exercise05.translate_ho_perso:
    instruction: "Translate into Italian, using the passato prossimo for the completed event: I missed the flight."
    accepted_answers:
      - {value: "Ho perso il volo", status: correct}
    feedback: "*Ho perso il volo* means I missed the flight."
  it.b2.unit04.lesson02.exercise06.write_alla_fine:
    instruction: "Write in Italian, starting with Alla fine (in the end): In the end I missed the flight."
    accepted_answers:
      - {value: "Alla fine ho perso il volo", status: correct}
    feedback: "*Alla fine ho perso il volo* means in the end I missed the flight."
  it.b2.unit04.lesson02.exercise07.write_poi:
    instruction: "Write in Italian, starting with Poi, using the imperfetto: After that I was in a hurry."
    accepted_answers:
      - {value: "Poi avevo fretta", status: correct}
    feedback: "*Poi avevo fretta* means after that I was in a hurry."
  it.b2.unit04.lesson02.exercise08.dictation_ho_perso_volo:
    instruction: "Type what you hear."
    correct_response: "Ho perso il volo"
    orthography_strict: true
    feedback: "You heard *Ho perso il volo* — I missed the flight."

  it.b2.unit04.lesson03.exercise01.recognize_quando:
    instruction: "What does this word mean?"
    correct_option: "when (a single past moment)"
    distractors: ["while (ongoing)", because, "after"]
    accepted_answers: [{value: "when (a single past moment)", status: correct}]
    feedback: "*Quando* marks a single past interruption."
  it.b2.unit04.lesson03.exercise02.listen_quando_aeroporto:
    instruction: "Listen and select what you hear."
    correct_option: "When I arrived at the airport, the plane was leaving."
    distractors: ["When I arrived at the airport, the plane had left.", "While I was at the airport, my boss called.", "When I arrived at the office, the plane was leaving."]
    accepted_answers: [{value: "When I arrived at the airport, the plane was leaving.", status: correct}]
    feedback: "*Quando sono arrivato in aeroporto, l'aereo partiva* means when I arrived at the airport, the plane was leaving."
  it.b2.unit04.lesson03.exercise03.match_time_words:
    instruction: "Match each Italian word or phrase with its meaning."
    accepted_answers:
      - value: {quando: "when (a single past moment)", mentre: "while (at the same time)", se: "if / whenever (a habit)", partire: "to depart / leave", vestirsi: "to get dressed", chiamare: "to call (phone)", "l'aeroporto": "the airport", "il capo": "the boss"}
        status: correct
    feedback: "These are this lesson's time-connector words."
  it.b2.unit04.lesson03.exercise04.order_aereo_partiva:
    instruction: "Put the words in order: The plane was leaving."
    accepted_answers:
      - {value: "L'aereo partiva", status: correct}
    feedback: "*L'aereo partiva* means the plane was leaving."
  it.b2.unit04.lesson03.exercise05.translate_quando:
    instruction: "Translate into Italian, using quando for the single past interruption: When I arrived at the airport, the plane was leaving."
    accepted_answers:
      - {value: "Quando sono arrivato in aeroporto, l'aereo partiva", status: correct}
      - {value: "Quando sono arrivato in aeroporto l'aereo partiva", status: correct}
      - {value: "Quando sono arrivata in aeroporto, l'aereo partiva", status: correct}
      - {value: "Quando sono arrivata in aeroporto l'aereo partiva", status: correct}
    feedback: "*Quando sono arrivato in aeroporto, l'aereo partiva* means when I arrived at the airport, the plane was leaving."
  it.b2.unit04.lesson03.exercise06.translate_mentre:
    instruction: "Translate into Italian, using mentre for the ongoing action: While I was getting dressed, the boss called."
    accepted_answers:
      - {value: "Mentre mi vestivo, il capo ha chiamato", status: correct}
      - {value: "Mentre mi vestivo il capo ha chiamato", status: correct}
    feedback: "*Mentre mi vestivo, il capo ha chiamato* means while I was getting dressed, the boss called."
  it.b2.unit04.lesson03.exercise07.write_se_abitudine:
    instruction: "Write in Italian, using se for a HABIT (not a one-time event): If I'm late, I always call the boss."
    accepted_answers:
      - {value: "Se sono in ritardo, chiamo sempre il capo", status: correct}
      - {value: "Se sono in ritardo chiamo sempre il capo", status: correct}
    feedback: "*Se sono in ritardo, chiamo sempre il capo* means if I'm late, I always call the boss."

  it.b2.unit04.lesson04.exercise01.recognize_impostato:
    instruction: "What does this word mean?"
    correct_option: "set (past participle)"
    distractors: [forgotten, left, called]
    accepted_answers: [{value: "set (past participle)", status: correct}]
    feedback: "*Impostato* is the past participle of *impostare*, to set."
  it.b2.unit04.lesson04.exercise02.listen_non_avevo_impostato:
    instruction: "Listen and select what you hear."
    correct_option: "I hadn't set my alarm."
    distractors: ["I had set my alarm.", "I don't have an alarm.", "I forgot my alarm at home."]
