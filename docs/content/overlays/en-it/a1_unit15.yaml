teaching:
  it.a1.unit15.lesson01.teach.piu_meno: {title: "più, meno", gloss: "more, less", note: "*più* (more) and *meno* (less) are the basic comparative words, used before an adjective or with *di* to compare.", example_gloss: ["I want more coffee, less tea."]}
  it.a1.unit15.lesson01.teach.di: {title: "di", gloss: "than / of", note: "*di* (of) plus an article combines with *più*/*meno* to mean 'than' in a comparison.", example_gloss: ["The coffee costs more than two euros."]}
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori: {title: "Le mele costano più dei pomodori.", gloss: "Apples cost more than tomatoes.", note: "*più dei pomodori* uses *di* + *i* (contracted to *dei*) to compare with *i pomodori*."}
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele: {title: "I pomodori costano meno delle mele.", gloss: "Tomatoes cost less than apples.", note: "*meno delle mele* uses *di* + *le* (contracted to *delle*) to compare with *le mele*."}

  it.a1.unit15.lesson02.teach.quale_preferisci: {title: "Quale preferisci, le mele o i pomodori?", gloss: "Which do you prefer, apples or tomatoes?", note: "*Quale* (which) asks the listener to choose between the two items just named."}
  it.a1.unit15.lesson02.teach.preferisco_le_mele: {title: "Preferisco le mele.", gloss: "I prefer apples.", note: "*Preferisco* (I prefer) plus *le mele* (the apples) answers the question with a choice.", example_gloss: ["I prefer tomatoes."]}

  it.a1.unit15.lesson03.teach.come: {title: "come", gloss: "as / like", note: "*come* (as/like) is used with *buono/a* to compare two things as equal.", example_gloss: ["Tea is as good as coffee."]}
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori: {title: "Le mele sono buone come i pomodori.", gloss: "Apples are as good as tomatoes.", note: "*sono buone* (are good, feminine plural) agrees with *le mele*; *come* introduces the equal comparison."}

