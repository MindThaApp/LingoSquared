review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the what-were-you-doing unit (stare + gerund, imperfect versus passato prossimo). OPEN NATIVE QUESTIONS: none beyond those in the realization."}
course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses and everyday experience."
  learning_goal: "Talk about the past in Italian: what happened, what used to happen, and what had already happened."
units:
  it.a2.unit86.che_cosa_stavi_facendo: {"title": "What were you doing?", "description": "Tell what was happening in the past: stare + gerund, the imperfect for background and the passato prossimo for events that interrupt."}
lessons:
  it.a2.unit86.lesson01.sto_cucinando: {"title": "I am cooking"}
  it.a2.unit86.lesson02.stavo_lavorando: {"title": "I was working"}
  it.a2.unit86.lesson03.pioveva_e_suonato: {"title": "It was raining, the phone rang"}
  it.a2.unit86.lesson04.mentre_cucinavo: {"title": "While I was cooking..."}
  it.a2.unit86.lesson05.le_chiavi_di_marco: {"title": "Marco's keys"}
  it.a2.unit86.lesson06.giulia_e_marco: {"title": "Giulia and Marco talk about last night"}
teaching:
  it.a2.unit86.lesson01.teach.gerundi: {"title": "Gerund forms", "gloss": "cooking / eating / watching / reading / writing / sleeping / doing", "note": "The gerund is the *-ing* form: it is used after *stare* to say what is happening now.", "example_gloss": ["Giulia is cooking.", "Marco is watching television.", "I am reading a book.", "We are eating."]}
  it.a2.unit86.lesson01.teach.adesso: {"title": "Time and things", "gloss": "now / yesterday evening / a book / the television / dinner", "example_gloss": ["Right now I am cooking dinner.", "Yesterday evening I was reading a book."]}
  it.a2.unit86.lesson01.teach.gn_stare: {"title": "Stare + gerund: now", "gloss": "I am eating, you are eating, he/she is eating, we are eating, you (plural) are eating, they are eating", "note": "To say what is happening right now, use the present of *stare* plus the gerund. The gerund never changes."}
  it.a2.unit86.lesson01.teach.gn_gerundio: {"title": "Making the gerund", "gloss": "to cook, cooking. to read, reading. to sleep, sleeping. to do, doing.", "note": "-are verbs take *-ando*; -ere and -ire verbs take *-endo*. *Fare* is irregular: *facendo*."}
  it.a2.unit86.lesson01.teach.gn_stavo: {"title": "Stare + gerund: then", "gloss": "I was cooking, you were cooking, he/she was cooking, we were cooking, you (plural) were cooking, they were cooking", "note": "To say what was happening at a moment in the past, put *stare* in the imperfect (*stavo, stavi, stava...*) and keep the gerund."}
  it.a2.unit86.lesson01.teach.frasi: {"title": "Three sentences", "gloss": "What are you doing? I am reading a book. Yesterday evening I was cooking dinner."}
  it.a2.unit86.lesson02.teach.mentre: {"title": "Linking words", "gloss": "while / when / yesterday afternoon / at home / with / and", "note": "*Mentre* joins two actions that were going on at the same time.", "example_gloss": ["While Giulia was cooking, Marco was reading.", "Yesterday afternoon I was working at home.", "We were watching television with Luca."]}
  it.a2.unit86.lesson02.teach.verbi2: {"title": "More gerunds", "gloss": "to work - working / to listen - listening / to speak - speaking", "example_gloss": ["Were you listening?", "Were you (plural) sleeping?", "Giulia was talking with Luca."]}
  it.a2.unit86.lesson02.teach.gn_stavo_forme: {"title": "All the forms of stavo", "gloss": "What were you doing? I was reading. Giulia was cooking. We were eating. They were working.", "note": "The imperfect of *stare* is *stavo, stavi, stava, stavamo, stavate, stavano*. Only *stare* changes; the gerund stays the same."}
  it.a2.unit86.lesson02.teach.gn_mentre: {"title": "Mentre: two actions together", "gloss": "While I was cooking, you were reading.", "note": "With *mentre* both verbs are in the *stare* + gerund form because both actions were in progress at the same time."}
  it.a2.unit86.lesson02.teach.gn_domanda: {"title": "Asking what someone was doing", "gloss": "What was Giulia doing? She was cooking.", "note": "To ask what was happening, use *Che cosa* plus *stare* in the imperfect plus *facendo*."}
  it.a2.unit86.lesson02.teach.frase: {"title": "One sentence", "gloss": "I was cooking and Marco was reading."}
  it.a2.unit86.lesson03.teach.tempo: {"title": "Setting the scene", "gloss": "it was raining / it was cold / it was late / it was evening", "note": "These imperfect forms describe the weather and the time: the background of the story.", "example_gloss": ["Yesterday evening it was raining.", "It was cold and it was late.", "It was evening and Giulia was reading."]}
  it.a2.unit86.lesson03.teach.eventi: {"title": "Events", "gloss": "to ring / the telephone / the door / suddenly", "note": "*A un tratto* means 'suddenly'.", "example_gloss": ["Suddenly the phone rang.", "Marco arrived home.", "Giulia opened the door."]}
  it.a2.unit86.lesson03.teach.gn_imperfetto: {"title": "The imperfect: background", "gloss": "It was raining. It was cold. It was late. Giulia was reading a book.", "note": "The imperfect describes the situation: weather, time and actions in progress. -are verbs end in *-ava*, -ere and -ire verbs in *-eva*; *essere* gives *era*."}
  it.a2.unit86.lesson03.teach.gn_evento: {"title": "Passato prossimo: events", "gloss": "The phone rang. Marco arrived. Giulia opened the door.", "note": "The passato prossimo tells a single event that happened and was finished. *Suonare* and *arrivare* take *essere* here, so the participle agrees with the subject."}
  it.a2.unit86.lesson03.teach.gn_contrasto: {"title": "Imperfect and passato prossimo", "gloss": "Giulia was reading when the phone rang. It was raining when Marco arrived.", "note": "The imperfect gives the background and the passato prossimo gives the event that interrupts it. *Stava leggendo* can replace *leggeva*."}
  it.a2.unit86.lesson04.teach.chiavi: {"title": "The keys", "gloss": "the keys / the bag / the table / to look for / to find / to lose", "note": "*Nella* means 'in the' and *sul* means 'on the' (with masculine words).", "example_gloss": ["Marco was looking for the keys in the bag.", "I found the keys on the table.", "Marco lost the keys.", "When you called, I was cooking.", "I was looking for the keys."]}
  it.a2.unit86.lesson04.teach.gn_mentre_pp: {"title": "Mentre + event", "gloss": "While I was cooking, the phone rang. While Marco was coming home, he lost the keys.", "note": "After *mentre* put the action in progress (imperfect or *stare* + gerund), then the event in the passato prossimo."}
  it.a2.unit86.lesson04.teach.gn_quando: {"title": "Quando + event", "gloss": "When the phone rang, I was cooking. When Marco arrived, it was raining.", "note": "With *quando* the event is in the passato prossimo and the background in the imperfect. You can put either part first."}
  it.a2.unit86.lesson04.teach.gn_domanda_quando: {"title": "The question with quando", "gloss": "What were you doing when Marco arrived? I was cooking.", "note": "To ask what someone was doing at a given moment, use *Che cosa stavi facendo quando...?* followed by the event in the passato prossimo."}
  it.a2.unit86.lesson04.teach.frase: {"title": "One sentence", "gloss": "I was reading when Marco arrived."}
  it.a2.unit86.lesson05.teach.parole: {"title": "Words for the story", "gloss": "coming back / I was talking / her / but / not / luckily / at home / they were", "note": "*Erano* is the plural of *era*: 'they were'.", "example_gloss": ["I was coming back home.", "I was talking with her.", "The keys were not in the bag.", "Luckily Luca was at home.", "I was looking for the keys, but they were not in the bag."]}
  it.a2.unit86.lesson05.teach.gn_essere: {"title": "Essere in the imperfect", "gloss": "I was, you were, he/she was, we were, you (plural) were, they were", "note": "The imperfect of *essere* is irregular and is used constantly for description: *era tardi*, *erano sul tavolo*."}
  it.a2.unit86.lesson05.teach.gn_ma: {"title": "Contrast with ma", "gloss": "I was looking for the keys, but they were not in the bag.", "note": "*Ma* joins two ideas that contrast; *non* goes right before the verb."}
  it.a2.unit86.lesson05.teach.lettura: {"title": "Marco tells a story", "gloss": "Yesterday evening it was raining and it was cold. It was late. I was coming back home when the phone rang: it was Giulia. While I was talking with her, I was looking for the keys in the bag, but the keys were not in the bag. They were on the table, at home! Luckily Luca was at home and opened the door. Marco", "note": "Notice the background in the imperfect (*pioveva, faceva freddo, era tardi*) and the events in the passato prossimo (*è suonato, ha aperto*)."}
  it.a2.unit86.lesson06.teach.d1: {"title": "Giulia asks", "gloss": "Giulia: Hi Marco! What were you doing yesterday evening when I called?"}
  it.a2.unit86.lesson06.teach.d2: {"title": "Marco answers", "gloss": "Marco: I was coming back home. It was raining and it was cold!"}
  it.a2.unit86.lesson06.teach.d3: {"title": "Giulia asks more", "gloss": "Giulia: And the keys? Where were they?"}
  it.a2.unit86.lesson06.teach.d4: {"title": "Marco explains", "gloss": "Marco: They were on the table! While I was talking with you, I was looking for the keys in the bag."}
  it.a2.unit86.lesson06.teach.d5: {"title": "Giulia reacts", "gloss": "Giulia: What an evening! I was cooking and you were looking for the keys."}
  it.a2.unit86.lesson06.teach.d6: {"title": "Marco ends", "gloss": "Marco: Yes, but luckily Luca was at home."}
exercises:
  it.a2.unit86.lesson01.exercise01.scegli_leggendo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sto leggendo un libro.", "distractors": ["Sto leggere un libro.", "Sono leggendo un libro.", "Sta leggendo un libro."], "accepted_answers": [{"value": "Sto leggendo un libro.", "status": "correct"}], "feedback": "*Sto* goes with *io*, followed by the gerund *leggendo*."}
  it.a2.unit86.lesson01.exercise02.scegli_stava: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia stava cucinando.", "distractors": ["Giulia stava cucinare.", "Giulia stavo cucinando.", "Giulia sta cucinando."], "accepted_answers": [{"value": "Giulia stava cucinando.", "status": "correct"}], "feedback": "*Stava* is the imperfect for *lei*; *sta* would mean 'is cooking' now."}
  it.a2.unit86.lesson01.exercise03.abbina_gerundi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "sto mangiando", "right": "I am eating"}, {"left": "stai leggendo", "right": "you are reading"}, {"left": "sta dormendo", "right": "he/she is sleeping"}, {"left": "stiamo guardando", "right": "we are watching"}, {"left": "stavo scrivendo", "right": "I was writing"}, {"left": "stavano cucinando", "right": "they were cooking"}], "status": "correct"}], "feedback": "Each form is *stare* plus a gerund."}
  it.a2.unit86.lesson01.exercise04.ordina_televisione: {"instruction": "Put the words in order to say 'Marco is watching television.'", "correct_option": "Marco sta guardando la televisione", "accepted_answers": [{"value": "Marco sta guardando la televisione", "status": "correct"}], "feedback": "*Sta guardando* stays together."}
  it.a2.unit86.lesson01.exercise05.completa_sta: {"instruction": "Complete with the correct form of stare.", "correct_option": "sta", "accepted_answers": [{"value": "sta", "status": "correct"}], "feedback": "*Giulia* takes *sta*."}
  it.a2.unit86.lesson01.exercise06.traduci_stai: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Che cosa stai facendo?", "status": "correct"}, {"value": "Che cosa stai facendo", "status": "correct"}], "feedback": "*Fare* gives *facendo*."}
  it.a2.unit86.lesson01.exercise07.scrivi_cena: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ieri sera stavo cucinando la cena.", "status": "correct"}, {"value": "Ieri sera stavo cucinando la cena", "status": "correct"}], "feedback": "*Stavo* is the imperfect of *stare*.", "correct_option": "Ieri sera stavo cucinando la cena."}
  it.a2.unit86.lesson02.exercise01.scegli_ieri_sera: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Che cosa stavi facendo ieri sera?", "distractors": ["Che cosa stai facendo ieri sera?", "Che cosa stavo facendo ieri sera?", "Che cosa stavi fare ieri sera?"], "accepted_answers": [{"value": "Che cosa stavi facendo ieri sera?", "status": "correct"}], "feedback": "*Stavi* is the imperfect for *tu*, followed by *facendo*."}
  it.a2.unit86.lesson02.exercise02.scegli_mentre: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Mentre Giulia stava cucinando, Marco stava leggendo.", "distractors": ["Mentre Giulia sta cucinando, Marco stava leggendo.", "Mentre Giulia stava cucinando, Marco stavano leggendo.", "Mentre Giulia stava cucinare, Marco stava leggendo."], "accepted_answers": [{"value": "Mentre Giulia stava cucinando, Marco stava leggendo.", "status": "correct"}], "feedback": "Both verbs are *stava* plus a gerund."}
  it.a2.unit86.lesson02.exercise03.abbina_stavo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "stavo lavorando", "right": "I was working"}, {"left": "stavi ascoltando", "right": "you were listening"}, {"left": "stava parlando", "right": "he/she was speaking"}, {"left": "stavamo mangiando", "right": "we were eating"}, {"left": "stavate dormendo", "right": "you (plural) were sleeping"}, {"left": "stavano guardando", "right": "they were watching"}], "status": "correct"}], "feedback": "Each form is the imperfect of *stare* plus a gerund."}
  it.a2.unit86.lesson02.exercise04.ordina_giulia: {"instruction": "Put the words in order to ask 'What was Giulia doing?'", "correct_option": "Che cosa stava facendo Giulia", "accepted_answers": [{"value": "Che cosa stava facendo Giulia", "status": "correct"}], "feedback": "*Stava facendo* stays together."}
  it.a2.unit86.lesson02.exercise05.completa_stavo: {"instruction": "Complete with the correct form of stare.", "correct_option": "stavo", "accepted_answers": [{"value": "stavo", "status": "correct"}], "feedback": "*Io* takes *stavo*."}
  it.a2.unit86.lesson02.exercise06.traduci_luca: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Stavamo guardando la televisione con Luca.", "status": "correct"}, {"value": "Stavamo guardando la televisione con Luca", "status": "correct"}], "feedback": "*Noi* takes *stavamo*."}
  it.a2.unit86.lesson02.exercise07.scrivi_mentre: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Mentre Marco stava lavorando, Giulia stava parlando con Luca.", "status": "correct"}, {"value": "Mentre Marco stava lavorando Giulia stava parlando con Luca", "status": "correct"}], "feedback": "Both actions use *stava* plus a gerund.", "correct_option": "Mentre Marco stava lavorando, Giulia stava parlando con Luca."}
  it.a2.unit86.lesson03.exercise01.scegli_pioveva: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Pioveva e faceva freddo.", "distractors": ["Pioveva e ha fatto freddo.", "Piovevo e facevo freddo.", "Pioveva e era freddo."], "accepted_answers": [{"value": "Pioveva e faceva freddo.", "status": "correct"}], "feedback": "Both verbs describe the background, so both use the imperfect."}
  it.a2.unit86.lesson03.exercise02.scegli_tratto: {"instruction": "Choose the correct Italian sentence.", "correct_option": "A un tratto è suonato il telefono.", "distractors": ["A un tratto è suonare il telefono.", "A un tratto sono suonato il telefono.", "A un tratto è suonata il telefono."], "accepted_answers": [{"value": "A un tratto è suonato il telefono.", "status": "correct"}], "feedback": "*È suonato* is the event; *telefono* is masculine, so *suonato*."}
  it.a2.unit86.lesson03.exercise03.abbina_sfondo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "pioveva", "right": "it was raining"}, {"left": "faceva freddo", "right": "it was cold"}, {"left": "era tardi", "right": "it was late"}, {"left": "è suonato il telefono", "right": "the phone rang"}, {"left": "è arrivato Marco", "right": "Marco arrived"}, {"left": "Giulia leggeva", "right": "Giulia was reading"}], "status": "correct"}], "feedback": "The first three and the last describe the background; the other two are events."}
  it.a2.unit86.lesson03.exercise04.ordina_leggeva: {"instruction": "Put the words in order to say 'Giulia was reading when the phone rang.'", "correct_option": "Giulia leggeva quando è suonato il telefono", "accepted_answers": [{"value": "Giulia leggeva quando è suonato il telefono", "status": "correct"}], "feedback": "The imperfect comes first, then *quando* and the event."}
  it.a2.unit86.lesson03.exercise05.completa_faceva: {"instruction": "Complete with the correct imperfect form.", "correct_option": "faceva", "accepted_answers": [{"value": "faceva", "status": "correct"}], "feedback": "Weather in the past uses the imperfect: *faceva freddo*."}
  it.a2.unit86.lesson03.exercise06.traduci_tardi: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Era tardi quando è arrivato Marco.", "status": "correct"}, {"value": "Era tardi quando è arrivato Marco", "status": "correct"}], "feedback": "*Era tardi* is the background and *è arrivato* is the event."}
  it.a2.unit86.lesson03.exercise07.scrivi_leggeva: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Giulia leggeva quando è suonato il telefono.", "status": "correct"}, {"value": "Giulia leggeva quando è suonato il telefono", "status": "correct"}, {"value": "Giulia stava leggendo quando è suonato il telefono.", "status": "correct"}, {"value": "Giulia stava leggendo quando è suonato il telefono", "status": "correct"}], "feedback": "Both the imperfect and *stava leggendo* are possible.", "correct_option": "Giulia leggeva quando è suonato il telefono."}
  it.a2.unit86.lesson04.exercise01.scegli_cucinavo: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Mentre cucinavo, è suonato il telefono.", "distractors": ["Mentre cucinare, è suonato il telefono.", "Mentre cucinavo, sono suonato il telefono.", "Mentre cucinavo, è suonare il telefono."], "accepted_answers": [{"value": "Mentre cucinavo, è suonato il telefono.", "status": "correct"}], "feedback": "The action in progress is imperfect, the event is passato prossimo."}
  it.a2.unit86.lesson04.exercise02.scegli_domanda: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Che cosa stavi facendo quando è arrivato Marco?", "distractors": ["Che cosa stai facendo quando è arrivato Marco?", "Che cosa stavi facendo mentre è arrivato Marco?", "Che cosa stavo facendo quando è arrivato Marco?"], "accepted_answers": [{"value": "Che cosa stavi facendo quando è arrivato Marco?", "status": "correct"}], "feedback": "*Stavi* for *tu*, and *quando* introduces the event."}
  it.a2.unit86.lesson04.exercise03.abbina_chiavi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Mentre cucinavo", "right": "While I was cooking"}, {"left": "Quando è arrivato Marco", "right": "When Marco arrived"}, {"left": "Marco ha perso le chiavi", "right": "Marco lost the keys"}, {"left": "Cercavo le chiavi", "right": "I was looking for the keys"}, {"left": "Ho trovato le chiavi", "right": "I found the keys"}, {"left": "Hai chiamato", "right": "you called"}], "status": "correct"}], "feedback": "Imperfect forms describe what was in progress, passato prossimo forms tell what happened."}
  it.a2.unit86.lesson04.exercise04.ordina_mentre: {"instruction": "Put the words in order to say 'While I was cooking, the phone rang.'", "correct_option": "Mentre cucinavo è suonato il telefono", "accepted_answers": [{"value": "Mentre cucinavo è suonato il telefono", "status": "correct"}, {"value": "è suonato il telefono mentre cucinavo", "status": "correct"}], "feedback": "The comma is not needed in this exercise."}
  it.a2.unit86.lesson04.exercise05.completa_trovato: {"instruction": "Complete with the past participle of trovare.", "correct_option": "trovato", "accepted_answers": [{"value": "trovato", "status": "correct"}], "feedback": "*Trovare* is an -are verb, so the participle is *trovato*."}
  it.a2.unit86.lesson04.exercise06.traduci_cercavo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Cercavo le chiavi quando è suonato il telefono.", "status": "correct"}, {"value": "Cercavo le chiavi quando è suonato il telefono", "status": "correct"}], "feedback": "*Cercavo* is the background; *è suonato* is the event."}
  it.a2.unit86.lesson04.exercise07.scrivi_domanda: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Che cosa stavi facendo quando è suonato il telefono?", "status": "correct"}, {"value": "Che cosa stavi facendo quando è suonato il telefono", "status": "correct"}], "feedback": "*Quando* introduces the event in the passato prossimo.", "correct_option": "Che cosa stavi facendo quando è suonato il telefono?"}
  it.a2.unit86.lesson05.exercise01.leggi_telefono: {"instruction": "Read the text and choose the answer.", "correct_option": "He was coming back home.", "distractors": ["He was cooking dinner.", "He was reading a book.", "He was talking with Luca."], "accepted_answers": [{"value": "He was coming back home.", "status": "correct"}], "feedback": "*Stavo tornando a casa quando è suonato il telefono.*"}
  it.a2.unit86.lesson05.exercise02.leggi_chiavi: {"instruction": "Read the text and choose the answer.", "correct_option": "On the table at home.", "distractors": ["In the bag.", "At the office.", "On the door."], "accepted_answers": [{"value": "On the table at home.", "status": "correct"}], "feedback": "*Erano sul tavolo, a casa.*"}
  it.a2.unit86.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "pioveva", "right": "it was raining"}, {"left": "era tardi", "right": "it was late"}, {"left": "stavo tornando", "right": "I was coming back"}, {"left": "le chiavi", "right": "the keys"}, {"left": "per fortuna", "right": "luckily"}, {"left": "ha aperto la porta", "right": "he opened the door"}], "status": "correct"}], "feedback": "These expressions come from Marco's story."}
  it.a2.unit86.lesson05.exercise04.ordina_tornando: {"instruction": "Put the words in order to say 'I was coming back home when the phone rang.'", "correct_option": "Stavo tornando a casa quando è suonato il telefono", "accepted_answers": [{"value": "Stavo tornando a casa quando è suonato il telefono", "status": "correct"}], "feedback": "*Stavo tornando* stays together."}
  it.a2.unit86.lesson05.exercise05.traduci_fortuna: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Per fortuna Luca era in casa e ha aperto la porta.", "status": "correct"}, {"value": "Per fortuna Luca era in casa e ha aperto la porta", "status": "correct"}], "feedback": "*Era* is the background and *ha aperto* is the event."}
  it.a2.unit86.lesson05.exercise06.detta_pioveva: {"instruction": "Type what you hear.", "correct_response": "Ieri sera pioveva e faceva freddo.", "orthography_strict": true, "feedback": "You heard *Ieri sera pioveva e faceva freddo.*"}
  it.a2.unit86.lesson05.exercise07.detta_chiavi: {"instruction": "Type what you hear.", "correct_response": "Le chiavi non erano nella borsa.", "orthography_strict": true, "feedback": "You heard *Le chiavi non erano nella borsa.*"}
  it.a2.unit86.lesson06.exercise01.capisci_marco: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He was coming back home.", "distractors": ["He was cooking dinner.", "He was working at the office.", "He was reading a book."], "accepted_answers": [{"value": "He was coming back home.", "status": "correct"}], "feedback": "Marco says: *Stavo tornando a casa.*"}
  it.a2.unit86.lesson06.exercise02.capisci_giulia: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She was cooking.", "distractors": ["She was reading a book.", "She was sleeping.", "She was coming back home."], "accepted_answers": [{"value": "She was cooking.", "status": "correct"}], "feedback": "Giulia says: *Io stavo cucinando.*"}
  it.a2.unit86.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Che cosa stavi facendo?", "right": "What were you doing?"}, {"left": "Stavo tornando a casa.", "right": "I was coming back home."}, {"left": "Dove erano le chiavi?", "right": "Where were the keys?"}, {"left": "Erano sul tavolo.", "right": "They were on the table."}, {"left": "Io stavo cucinando.", "right": "I was cooking."}, {"left": "Per fortuna Luca era in casa.", "right": "Luckily Luca was at home."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  it.a2.unit86.lesson06.exercise04.ordina_cucinando: {"instruction": "Put the words in order to say 'I was cooking and you were looking for the keys' (as Giulia says it).", "correct_option": "Io stavo cucinando e tu cercavi le chiavi", "accepted_answers": [{"value": "Io stavo cucinando e tu cercavi le chiavi", "status": "correct"}], "feedback": "One action uses *stare* + gerund, the other the imperfect."}
  it.a2.unit86.lesson06.exercise05.rispondi_ieri: {"instruction": "Answer in Italian: say that you were coming back home when she called.", "correct_option": "Stavo tornando a casa quando hai chiamato.", "accepted_answers": [{"value": "Stavo tornando a casa quando hai chiamato.", "status": "correct"}, {"value": "Stavo tornando a casa quando hai chiamato", "status": "correct"}, {"value": "Stavo cucinando quando hai chiamato.", "status": "correct"}, {"value": "Stavo cucinando quando hai chiamato", "status": "correct"}, {"value": "Stavo leggendo quando hai chiamato.", "status": "correct"}, {"value": "Stavo leggendo quando hai chiamato", "status": "correct"}], "feedback": "Answer in Italian: say that you were coming back home when she called."}
  it.a2.unit86.lesson06.exercise06.traduci_parlavo: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Mentre parlavo con te, cercavo le chiavi nella borsa.", "status": "correct"}, {"value": "Mentre parlavo con te cercavo le chiavi nella borsa", "status": "correct"}], "feedback": "Both actions were in progress, so both are in the imperfect."}
  it.a2.unit86.lesson06.exercise07.scrivi_tre: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Pioveva e faceva freddo. Stavo tornando a casa. È suonato il telefono.", "status": "correct"}, {"value": "Pioveva e faceva freddo Stavo tornando a casa È suonato il telefono", "status": "correct"}], "feedback": "Two background sentences, then the event.", "correct_option": "Pioveva e faceva freddo. Stavo tornando a casa. È suonato il telefono."}
