teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono: {title: "Che ore sono?", gloss: "What time is it?", note: "The standard way to ask the time in Italian; literally 'what hours are they.'"}
  it.a1.unit05.lesson01.teach.sono_le_tre: {title: "Sono le tre.", gloss: "It's three o'clock.", note: "*Sono le* + a number states the time for any hour except one o'clock."}
  it.a1.unit05.lesson01.teach.ore_una_dodici: {title: "l'una, le due, le tre, le dodici", gloss: "one o'clock, two o'clock, three o'clock, twelve o'clock", note: "One o'clock uniquely uses *è l'una* (singular) instead of *sono le* (plural), since 'one' is singular.", example_gloss: ["It's one o'clock.", "It's twelve o'clock."]}
  it.a1.unit05.lesson01.teach.ore_quattro_sei: {title: "le quattro, le cinque, le sei", gloss: "four o'clock, five o'clock, six o'clock", note: "These continue the same *sono le* + number pattern used for three o'clock.", example_gloss: ["It's four o'clock.", "It's six o'clock."]}
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo: {title: "Sono le tre e mezzo.", gloss: "It's three thirty.", note: "*e mezzo* (and a half) adds thirty minutes to the hour."}
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto: {title: "Sono le tre e un quarto.", gloss: "It's a quarter past three.", note: "*e un quarto* (and a quarter) adds fifteen minutes to the hour."}
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto: {title: "Sono le quattro meno un quarto.", gloss: "It's a quarter to four.", note: "*meno un quarto* (minus a quarter) counts back from the NEXT hour, the way English says 'quarter to four.'"}
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo: {title: "A che ora ci vediamo?", gloss: "What time shall we meet?", note: "*A che ora* asks at what time something happens; *ci vediamo* means 'we'll see each other.'"}
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo: {title: "Ci vediamo alle tre e mezzo.", gloss: "We'll meet at three thirty.", note: "*alle* (at the) is used before a specific clock time, unlike *sono le* which just states the time."}
  it.a1.unit05.lesson03.teach.parti_del_giorno: {title: "di mattina, di pomeriggio, di sera", gloss: "in the morning, in the afternoon, in the evening", note: "These specify which part of the day a time refers to, since Italian clock times don't distinguish AM/PM the way English does.", example_gloss: ["Is it a morning or evening meeting?", "It's in the afternoon, at three thirty."]}
  it.a1.unit05.lesson03.teach.e_di_pomeriggio: {title: "È di pomeriggio, alle tre e mezzo.", gloss: "It's in the afternoon, at three thirty.", note: "Combines the part-of-day phrase with the specific clock time to remove any AM/PM ambiguity."}

