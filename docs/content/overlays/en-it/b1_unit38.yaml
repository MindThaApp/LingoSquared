  it.b1.unit38.lesson01.teach_piano_sia_utile: {title: "il piano sia utile", gloss: "the plan is useful", note: "*Sia* is the present subjunctive of *essere* (is); a stance like *sono d'accordo sul fatto che* is usually followed by the subjunctive.", example_gloss: ["Elena thinks the plan is useful."]}
  it.b1.unit38.lesson01.teach_perche_tempo: {title: "perché fa risparmiare tempo", gloss: "because it saves time", note: "*Perché* adds the reason for your agreement.", example_gloss: ["The plan is useful because it saves time."]}
