  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit38.dibattito: {title: "Agreeing and disagreeing with reasons"}
lessons:
  it.b1.unit38.lesson01.accordo_motivo: {title: "I agree because..."}
  it.b1.unit38.lesson02.disaccordo_motivo: {title: "I do not agree because..."}
teaching:
  it.b1.unit38.lesson01.teach_sono_daccordo: {title: "sono d'accordo", gloss: "I agree", note: "*Sono d'accordo* states agreement.", example_gloss: ["I agree with Elena."]}
  it.b1.unit38.lesson01.teach_sul_fatto_che: {title: "sul fatto che", gloss: "about the fact that", note: "*Sul fatto che* lets you refer to another person's view before you answer it.", example_gloss: ["I agree that the plan is useful."]}
  it.b1.unit38.lesson01.teach_piano_sia_utile: {title: "il piano sia utile", gloss: "the plan is useful", note: "*Sia* is the taught form after *sul fatto che* here.", example_gloss: ["Elena thinks the plan is useful."]}
  it.b1.unit38.lesson01.teach_perche_tempo: {title: "perché fa risparmiare tempo", gloss: "because it saves time", note: "*Perché* adds the reason for your agreement.", example_gloss: ["The plan is useful because it saves time."]}
  it.b1.unit38.lesson02.teach_non_sono_daccordo: {title: "non sono d'accordo", gloss: "I do not agree", note: "Add *non* before *sono d'accordo* to disagree.", example_gloss: ["I do not agree with Sam."]}
  it.b1.unit38.lesson02.teach_piano_sia_pronto: {title: "il piano sia pronto", gloss: "the plan is ready", note: "This is the view you disagree with in the final answer.", example_gloss: ["Sam thinks the plan is ready."]}
  it.b1.unit38.lesson02.teach_manca_conferma: {title: "manca la conferma", gloss: "the confirmation is missing", note: "This gives the reason for disagreement.", example_gloss: ["The plan is not ready because the confirmation is missing."]}
  it.b1.unit38.lesson02.teach_risposta_completa: {title: "Non sono d'accordo sul fatto che..., perché...", gloss: "I do not agree that..., because...", note: "The final task requires the other person's view, your stance, and a reason.", example_gloss: ["I do not agree that the plan is ready, because the confirmation is missing."]}
exercises:
  it.b1.unit38.lesson01.exercise01.choose_accordo:
    instruction: "Which phrase means 'I agree'?"
    correct_option: "sono d'accordo"
    distractors: ["non sono d'accordo", "manca la conferma", "sia pronto"]
    accepted_answers: [{value: "sono d'accordo", status: "correct"}]
    feedback: "*Sono d'accordo* means I agree."
  it.b1.unit38.lesson01.exercise02.listen_agreement:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The speaker agrees because the plan saves time."
    distractors: ["The speaker disagrees because the confirmation is missing.", "The speaker asks Sam to submit the form.", "The speaker says the confirmation arrived yesterday."]
    accepted_answers: [{value: "The speaker agrees because the plan saves time.", status: "correct"}]
    feedback: "The sentence is *Sono d'accordo sul fatto che il piano sia utile, perché fa risparmiare tempo.*"
  it.b1.unit38.lesson01.exercise03.match_agreement:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I agree", right: "sono d'accordo"}
          - {left: "about the fact that", right: "sul fatto che"}
          - {left: "the plan", right: "il piano"}
          - {left: "is useful", right: "sia utile"}
          - {left: "because", right: "perché"}
          - {left: "saves time", right: "fa risparmiare tempo"}
        status: "correct"
    feedback: "These pieces build an agreement with a reason."
  it.b1.unit38.lesson01.exercise04.order_agreement:
    instruction: "Put the words in order to build the agreement with a reason."
    accepted_answers: [{value: ["Sono", "d'accordo", "sul", "fatto", "che", "il", "piano", "sia", "utile", "perché", "fa", "risparmiare", "tempo"], status: "correct"}]
    feedback: "The full sentence is *Sono d'accordo sul fatto che il piano sia utile, perché fa risparmiare tempo.*"
  it.b1.unit38.lesson01.exercise05.fill_sia:
    instruction: "Complete the taught phrase with *sia*."
    accepted_answers: [{value: "sia", status: "correct"}]
    feedback: "The taught phrase is *il piano sia utile*."
  it.b1.unit38.lesson01.exercise06.write_agreement:
    instruction: "Write the exact Italian agreement with *sul fatto che* and the reason *perché fa risparmiare tempo*."
    accepted_answers:
      - {value: "Sono d'accordo sul fatto che il piano sia utile, perché fa risparmiare tempo.", status: "correct"}
      - {value: "Sono d'accordo sul fatto che il piano sia utile perché fa risparmiare tempo", status: "correct"}
    feedback: "This states agreement, refers to the view, and gives the reason."
  it.b1.unit38.lesson02.exercise01.choose_disaccordo:
    instruction: "Which phrase means 'I do not agree'?"
    correct_option: "non sono d'accordo"
    distractors: ["sono d'accordo", "fa risparmiare tempo", "il piano sia utile"]
    accepted_answers: [{value: "non sono d'accordo", status: "correct"}]
    feedback: "*Non sono d'accordo* means I do not agree."
  it.b1.unit38.lesson02.exercise02.listen_disagreement:
    instruction: "Listen and choose what the speaker says."
    correct_option: "The speaker disagrees because the confirmation is missing."
    distractors: ["The speaker agrees because the plan saves time.", "The speaker says Sam will call today.", "The speaker asks Elena to sign first."]
    accepted_answers: [{value: "The speaker disagrees because the confirmation is missing.", status: "correct"}]
    feedback: "The sentence is *Non sono d'accordo sul fatto che il piano sia pronto, perché manca la conferma.*"
  it.b1.unit38.lesson02.exercise03.match_disagreement:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I do not agree", right: "non sono d'accordo"}
          - {left: "is ready", right: "sia pronto"}
          - {left: "the confirmation is missing", right: "manca la conferma"}
          - {left: "Sam thinks that", right: "Sam pensa che"}
          - {left: "the plan is ready", right: "il piano sia pronto"}
          - {left: "because the confirmation is missing", right: "perché manca la conferma"}
        status: "correct"
    feedback: "Each left side has a distinct meaning; together they build a disagreement with a reason."
  it.b1.unit38.lesson02.exercise04.order_disagreement:
    instruction: "Put the words in order to build the disagreement with a reason."
    accepted_answers: [{value: ["Non", "sono", "d'accordo", "sul", "fatto", "che", "il", "piano", "sia", "pronto", "perché", "manca", "la", "conferma"], status: "correct"}]
    feedback: "The full sentence is *Non sono d'accordo sul fatto che il piano sia pronto, perché manca la conferma.*"
  it.b1.unit38.lesson02.exercise05.fill_manca:
    instruction: "Complete the reason with the taught word *manca*."
    accepted_answers: [{value: "manca", status: "correct"}]
    feedback: "*Manca la conferma* means the confirmation is missing."
  it.b1.unit38.lesson02.exercise06.write_full_disagreement:
    instruction: "Write exactly two Italian sentences: first *Sam pensa che il piano sia pronto*; then disagree with *Non sono d'accordo sul fatto che il piano sia pronto* and give the reason *perché manca la conferma*."
    accepted_answers:
      - {value: "Sam pensa che il piano sia pronto. Non sono d'accordo sul fatto che il piano sia pronto, perché manca la conferma.", status: "correct"}
      - {value: "Sam pensa che il piano sia pronto Non sono d'accordo sul fatto che il piano sia pronto perché manca la conferma", status: "correct"}
    feedback: "This references Sam's view, states disagreement, and gives the reason."
