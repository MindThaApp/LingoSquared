course:
  title: "Italian B1"
  description: "Learn B1-level Italian for everyday, administrative, and work situations, with detailed English explanations."
units:
  it.b1.unit40.racconto: {title: "Recounting a past experience"}
lessons:
  it.b1.unit40.lesson01.sequenza_passata: {title: "Yesterday I arrived"}
  it.b1.unit40.lesson02.mentre_disse: {title: "While I was preparing, Elena called"}
teaching:
  it.b1.unit40.lesson01.teach_ieri: {title: "ieri", gloss: "yesterday", note: "*Ieri* places the story in the past.", example_gloss: ["Yesterday I called Sam."]}
  it.b1.unit40.lesson01.teach_sono_arrivato: {title: "sono arrivato", gloss: "I arrived", note: "*Sono arrivato* is passato prossimo in the masculine first person.", example_gloss: ["Yesterday I arrived at the office."]}
  it.b1.unit40.lesson01.teach_in_ufficio: {title: "in ufficio", gloss: "at the office", note: "This gives the place in the story.", example_gloss: ["I arrived at the office."]}
  it.b1.unit40.lesson01.teach_dopo_ho_consegnato: {title: "dopo ho consegnato il modulo", gloss: "afterwards I handed in the form", note: "*Dopo* moves the story to the next event.", example_gloss: ["Afterwards I handed in the form."]}
  it.b1.unit40.lesson02.teach_mentre_preparavo: {title: "mentre preparavo il rapporto", gloss: "while I was preparing the report", note: "*Preparavo* is imperfetto for the background action.", example_gloss: ["While I was preparing the report, Elena called."]}
  it.b1.unit40.lesson02.teach_ha_chiamato: {title: "Elena ha chiamato", gloss: "Elena called", note: "*Ha chiamato* is passato prossimo for the main event.", example_gloss: ["Elena called while I was preparing the report."]}
  it.b1.unit40.lesson02.teach_ha_detto_che: {title: "ha detto che", gloss: "said that", note: "*Ha detto che* reports what someone said.", example_gloss: ["Elena said that Sam was waiting for the confirmation."]}
  it.b1.unit40.lesson02.teach_sam_aspettava: {title: "Sam aspettava la conferma", gloss: "Sam was waiting for the confirmation", note: "*Aspettava* reports the background situation Elena mentioned.", example_gloss: ["Elena said that Sam was waiting for the confirmation."]}
  it.b1.unit40.lesson02.teach_racconto_completo: {title: "Ieri... Mentre... Dopo...", gloss: "Yesterday... While... Afterwards...", note: "A full account combines sequence words, a background action (*mentre* + imperfect), the main event (passato prossimo), and reported words.", example_gloss: ["Yesterday I arrived at the office. While I was preparing the report, Elena called and said that Sam was waiting for the confirmation. Afterwards I handed in the form."]}
exercises:
  it.b1.unit40.lesson01.exercise01.choose_ieri:
    instruction: "Which word means 'yesterday'?"
    correct_option: "ieri"
    distractors: ["oggi", "dopo", "mentre"]
    accepted_answers: [{value: "ieri", status: "correct"}]
    feedback: "*Ieri* means yesterday."
  it.b1.unit40.lesson01.exercise02.listen_arrivo:
    instruction: "Listen and choose what happened."
    correct_option: "The speaker arrived at the office yesterday."
    distractors: ["The speaker handed in the form afterwards.", "Elena said Sam was waiting.", "The report is almost ready today."]
    accepted_answers: [{value: "The speaker arrived at the office yesterday.", status: "correct"}]
    feedback: "The sentence is *Ieri sono arrivato in ufficio.*"
  it.b1.unit40.lesson01.exercise03.match_sequence:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "yesterday", right: "ieri"}
          - {left: "I arrived", right: "sono arrivato"}
          - {left: "at the office", right: "in ufficio"}
          - {left: "afterwards", right: "dopo"}
          - {left: "I handed in", right: "ho consegnato"}
          - {left: "the form", right: "il modulo"}
        status: "correct"
    feedback: "These pieces make a simple past sequence."
  it.b1.unit40.lesson01.exercise04.order_arrivo:
    instruction: "Put the words in order to build the first event."
    accepted_answers:
      - {value: ["Ieri", "sono", "arrivato", "in", "ufficio"], status: "correct"}
      - {value: ["sono", "arrivato", "in", "ufficio", "Ieri"], status: "correct"}
      - {value: ["sono", "arrivato", "Ieri", "in", "ufficio"], status: "correct"}
    feedback: "The sentence is *Ieri sono arrivato in ufficio.*"
  it.b1.unit40.lesson01.exercise05.fill_arrivato:
    instruction: "Complete the masculine passato prossimo form *sono arrivato*."
    accepted_answers: [{value: "arrivato", status: "correct"}]
    feedback: "The taught masculine form is *sono arrivato*."
  it.b1.unit40.lesson01.exercise06.write_sequence:
    instruction: "Write exactly two Italian sentences in passato prossimo using the masculine first-person form: *Ieri sono arrivato in ufficio. Dopo ho consegnato il modulo.*"
    accepted_answers:
      - {value: "Ieri sono arrivato in ufficio. Dopo ho consegnato il modulo.", status: "correct"}
      - {value: "Ieri sono arrivato in ufficio Dopo ho consegnato il modulo", status: "correct"}
    feedback: "Both events use passato prossimo and are ordered with *ieri* and *dopo*."
  it.b1.unit40.lesson02.exercise01.choose_mentre:
    instruction: "Which word means 'while'?"
    correct_option: "mentre"
    distractors: ["dopo", "ieri", "perché"]
    accepted_answers: [{value: "mentre", status: "correct"}]
    feedback: "*Mentre* means while."
  it.b1.unit40.lesson02.exercise02.listen_story:
    instruction: "Listen and choose what the story includes."
    correct_option: "The speaker arrived at the office; while he was preparing the report, Elena called and said Sam was waiting for the confirmation; afterwards he handed in the form."
    distractors: ["The speaker disagreed because the confirmation was missing.", "The speaker asked Elena to check the form today.", "The speaker said the plan saves time."]
    accepted_answers: [{value: "The speaker arrived at the office; while he was preparing the report, Elena called and said Sam was waiting for the confirmation; afterwards he handed in the form.", status: "correct"}]
    feedback: "The story includes a sequence, background action, main event, and what Elena said."
  it.b1.unit40.lesson02.exercise03.match_story:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "while I was preparing", right: "mentre preparavo"}
          - {left: "the report", right: "il rapporto"}
          - {left: "Elena called", right: "Elena ha chiamato"}
          - {left: "said that", right: "ha detto che"}
          - {left: "Sam was waiting", right: "Sam aspettava"}
          - {left: "the confirmation", right: "la conferma"}
        status: "correct"
    feedback: "These pieces build the background action, main event, and reported words."
  it.b1.unit40.lesson02.exercise04.order_background_event:
    instruction: "Put the words in order to build the background action and main event."
    accepted_answers:
      - {value: ["Mentre", "preparavo", "il", "rapporto", "Elena", "ha", "chiamato"], status: "correct"}
      - {value: ["Elena", "ha", "chiamato", "Mentre", "preparavo", "il", "rapporto"], status: "correct"}
    feedback: "The sentence is *Mentre preparavo il rapporto, Elena ha chiamato.*"
  it.b1.unit40.lesson02.exercise05.fill_preparavo:
