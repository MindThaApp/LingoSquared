    instruction: "Write exactly three Italian sentences using the masculine first-person narrator form: sentence 1 *Ieri sono arrivato in ufficio*; sentence 2 *Mentre preparavo il rapporto, Elena ha chiamato e ha detto che Sam aspettava la conferma*; sentence 3 *Dopo ho consegnato il modulo*."
