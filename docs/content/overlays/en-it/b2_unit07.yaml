review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed (DRAFT). Confirm every English gloss
    matches idiomatic Italian, that every matching_pairs right-hand gloss
    discriminates its left on real meaning, and that the culminating
    speaking/writing answers (lesson06) accept the punctuation forms a
    correct learner would actually produce. See the realization file's
    review block for the full priority list, including the congiuntivo
    after a condizione che/purché and the pleonastic non after a meno che.
  notes: >-
    Overlay for it's B2 negotiation unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English "unless" doesn't require a second negative the way
    "a meno che...non" does -- flagged in lesson03; (2) "a condizione che"/
    "purché" trigger the congiuntivo (prenoti), which has no direct English
    mood equivalent; (3) English "on condition that" and "provided that"
    both map to different Italian connectives depending on formality --
    glossed by function, not literal word-for-word translation. No
    sibling-direction file (it-en b2) was consulted.

course:
  title: Italian B2
  description: >-
    Upper-intermediate Italian: negotiate an outcome -- propose terms, push
    back on unacceptable ones, offer a conditional concession, and reach or
    decline an agreement while keeping the relationship intact -- around
    planning a weekend trip to the mountains.

units:
  it.b2.unit07.negoziazione:
    title: "Negotiation"
    description: Negotiate an outcome -- propose terms, push back on unacceptable ones, offer a conditional concession, and reach or decline an agreement while keeping the relationship intact.

