review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "New A2 en-it overlay; needs fresh-context content review before import."}
course:
  title: "Italian A2"
  description: "Learn A2-level Italian for everyday administrative, service, travel, and work situations, with detailed English explanations."
units:
  it.a2.unit32.vita_online: {title: "Online habits"}
lessons:
  it.a2.unit32.lesson01.abitudini: {title: "Online habits"}
  it.a2.unit32.lesson02.opinione: {title: "An online opinion"}
teaching:
  it.a2.unit32.lesson01.teach_internet_social: {title: "internet, i social", gloss: "internet, social media", note: "*I social* is the common Italian shorthand for social media.", example_gloss: ["I use the internet every day.", "I use social media often."]}
  it.a2.unit32.lesson01.teach_notizie_messaggi: {title: "le notizie, i messaggi", gloss: "news, messages", note: "*Notizie* are news items; *messaggi* are messages.", example_gloss: ["I read the news online.", "I send messages with the phone."]}
  it.a2.unit32.lesson01.teach_uso_ogni_giorno: {title: "Uso internet ogni giorno.", gloss: "I use the internet every day.", note: "Italian normally says *uso internet* without an article.", example_gloss: ["I use the internet every day at work."]}
  it.a2.unit32.lesson01.teach_per_leggere: {title: "per leggere le notizie", gloss: "to read the news", note: "*Per* plus infinitive gives the purpose: to do something.", example_gloss: ["I use the phone to read the news."]}
  it.a2.unit32.lesson02.teach_spesso_poco: {title: "spesso, poco", gloss: "often, not much", note: "These frequency words help describe habits simply.", example_gloss: ["I use social media often.", "I don’t use the phone much in the evening."]}
  it.a2.unit32.lesson02.teach_secondo_me: {title: "secondo me", gloss: "in my opinion", note: "*Secondo me* is a natural A2 way to introduce a personal opinion.", example_gloss: ["In my opinion the internet is useful."]}
  it.a2.unit32.lesson02.teach_perdo_tempo: {title: "perdo troppo tempo", gloss: "I waste too much time", note: "*Troppo* means too much, not just a lot.", example_gloss: ["In my opinion I waste too much time online."]}
  it.a2.unit32.lesson02.teach_utile_ma: {title: "è utile, ma perdo troppo tempo", gloss: "it is useful, but I waste too much time", note: "*Ma* lets you add a simple contrast after an opinion.", example_gloss: ["The internet is useful, but I waste too much time."]}
exercises:
  it.a2.unit32.lesson01.exercise01.choose_social:
    instruction: "Which phrase means 'social media'?"
    correct_option: "i social"
    distractors: ["le notizie", "i messaggi", "gli amici"]
    accepted_answers: [{value: "i social", status: "correct"}]
    feedback: "*I social* means social media."
  it.a2.unit32.lesson01.exercise02.listen_internet:
    instruction: "Listen and select the online habit you hear."
    correct_option: "Uso internet ogni giorno per leggere le notizie e mandare messaggi."
    distractors: ["Durante la settimana lavoro in ufficio.", "Il treno è in ritardo di venti minuti.", "Vorrei un rimborso, per favore."]
    accepted_answers: [{value: "Uso internet ogni giorno per leggere le notizie e mandare messaggi.", status: "correct"}]
    feedback: "The speaker says how they use the internet every day."
  it.a2.unit32.lesson01.exercise03.choose_notizie:
    instruction: "Which phrase means 'to read the news'?"
    correct_option: "leggere le notizie"
    distractors: ["mandare messaggi", "vedere gli amici", "prendere l'autobus"]
    accepted_answers: [{value: "leggere le notizie", status: "correct"}]
    feedback: "*Leggere le notizie* means to read the news."
  it.a2.unit32.lesson01.exercise04.match_online_words:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "internet", right: "internet"}
          - {left: "social media", right: "i social"}
          - {left: "news", right: "le notizie"}
          - {left: "messages", right: "i messaggi"}
          - {left: "every day", right: "ogni giorno"}
          - {left: "to read", right: "leggere"}
        status: "correct"
    feedback: "These words describe basic online habits."
  it.a2.unit32.lesson01.exercise05.order_uso:
    instruction: "Put the words in order to say 'I use the internet every day.'"
    accepted_answers: [{value: ["Uso", "internet", "ogni", "giorno"], status: "correct"}]
    feedback: "The correct order is *Uso internet ogni giorno.*"
  it.a2.unit32.lesson01.exercise06.fill_notizie:
    instruction: "Complete the sentence with the word for 'news.'"
    accepted_answers: [{value: "notizie", status: "correct"}]
    feedback: "*Le notizie* means the news."
  it.a2.unit32.lesson01.exercise07.write_habit:
    instruction: "Write the taught habit sentence: I use the internet every day to read the news and send messages."
    accepted_answers:
      - {value: "Uso internet ogni giorno per leggere le notizie e mandare messaggi.", status: "correct"}
      - {value: "Uso internet ogni giorno per leggere le notizie e mandare messaggi", status: "correct"}
    feedback: "The sentence gives a habit plus two online activities."
  it.a2.unit32.lesson02.exercise01.choose_secondo_me:
    instruction: "Which phrase means 'in my opinion'?"
    correct_option: "secondo me"
    distractors: ["ogni giorno", "nel fine settimana", "per favore"]
    accepted_answers: [{value: "secondo me", status: "correct"}]
    feedback: "*Secondo me* introduces an opinion."
  it.a2.unit32.lesson02.exercise02.listen_social:
    instruction: "Listen and select the habit and opinion you hear."
    correct_option: "Uso i social spesso, ma secondo me perdo troppo tempo."
    distractors: ["Uso internet ogni giorno per leggere le notizie.", "Secondo me internet è utile.", "Uso il telefono poco la sera."]
    accepted_answers: [{value: "Uso i social spesso, ma secondo me perdo troppo tempo.", status: "correct"}]
    feedback: "The speaker gives a frequency and a simple opinion."
  it.a2.unit32.lesson02.exercise03.choose_troppo_tempo:
    instruction: "Which phrase means 'I waste too much time'?"
    correct_option: "perdo troppo tempo"
    distractors: ["leggo le notizie", "mando messaggi", "uso internet"]
    accepted_answers: [{value: "perdo troppo tempo", status: "correct"}]
    feedback: "*Perdo troppo tempo* gives a negative opinion about a habit."
  it.a2.unit32.lesson02.exercise04.match_habit_opinion:
    instruction: "Match each English word or phrase to Italian."
    accepted_answers:
      - value:
          - {left: "often", right: "spesso"}
          - {left: "a little/not much", right: "poco"}
          - {left: "in my opinion", right: "secondo me"}
          - {left: "useful", right: "utile"}
          - {left: "but", right: "ma"}
          - {left: "I waste too much time", right: "perdo troppo tempo"}
        status: "correct"
    feedback: "These phrases add frequency and opinion to a habit."
  it.a2.unit32.lesson02.exercise05.order_opinion:
    instruction: "Put the words in order to say 'In my opinion the internet is useful.'"
    accepted_answers: [{value: ["Secondo", "me", "internet", "è", "utile"], status: "correct"}]
    feedback: "The correct order is *Secondo me internet è utile.*"
  it.a2.unit32.lesson02.exercise06.reply_online_habit:
    instruction: "Elena asks how you use the internet. Answer with the taught form: I use the internet every day to read the news; in my opinion it is useful."
    accepted_answers:
      - {value: "Uso internet ogni giorno per leggere le notizie. Secondo me è utile.", status: "correct"}
      - {value: "Uso internet ogni giorno per leggere le notizie secondo me è utile", status: "correct"}
    feedback: "The answer gives a habit and an opinion."
  it.a2.unit32.lesson02.exercise07.write_online_message:
    instruction: "Write a message: say you use the internet every day to read the news and send messages, then use *secondo me* to say it is useful, but you waste too much time."
    accepted_answers:
      - {value: "Uso internet ogni giorno per leggere le notizie e mandare messaggi. Secondo me è utile, ma perdo troppo tempo.", status: "correct"}
      - {value: "Uso internet ogni giorno per leggere le notizie e mandare messaggi secondo me è utile ma perdo troppo tempo", status: "correct"}
    feedback: "The message combines habit, opinion, and contrast."
  it.a2.unit32.lesson02.exercise08.dictation_social_spesso:
    instruction: "Type what you hear."
    correct_option: "Uso i social spesso, ma secondo me perdo troppo tempo"
    accepted_answers: [{value: "Uso i social spesso, ma secondo me perdo troppo tempo", status: correct}]
    orthography_strict: true
