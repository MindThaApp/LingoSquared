    title: Marco recognizes Nina
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Tall and short
    gloss: tall / short
    note: '*Alto* describes a tall person and *basso* a short one. Italian adjectives agree with the person: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara is tall.
    - Luca is short.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Old and young
    gloss: old / young
    note: '*Anziano* (old) and *giovane* (young) give a general impression, not an exact number of years. *Giovane* ends in -e, so it is the same for men and women.'
    example_gloss:
    - Grandpa is old.
    - Marco is young.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Age: avere anni or anziano'
    gloss: 'For an exact age Italian uses avere + anni: Quanti anni hai? For a general impression it uses an adjective: Il nonno è anziano.'
    note: English says 'I am 30'; Italian says 'I have 30 years' (*ho trent'anni*). The adjective *anziano* is for how old someone seems.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara is tall and Luca is short
    gloss: Chiara is tall and Luca is short.
    note: 'Two adjectives joined with *e* (and). Each one agrees with its person: *alta* (feminine) and *basso* (masculine).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Hair
    gloss: the hair
    note: '*I capelli* is plural in Italian: Italians speak of hair as ''the hairs''. The singular *il capello* means one single hair.'
    example_gloss: Marco has short black hair.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'Three hair colours in the masculine plural to agree with *capelli*: *biondi*, *castani*, *grigi*. *Neri* (black) is used for hair too.'
    example_gloss:
    - Giulia has blond hair.
    - Luca has brown hair.
    - Grandpa has grey hair.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Lunghi* (long) and *corti* (short) are plural like *capelli*. The word *alto* (tall) is only for people, not for hair.'
    example_gloss:
    - Chiara has long hair.
    - Luca has short hair.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli are plural
    gloss: 'Capelli is plural, so the adjective is plural too: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'The adjective follows the noun and agrees in gender and number: *capelli lunghi* (masculine plural), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Hair and eyes take avere
    gloss: 'To describe a person Italian uses avere with hair and eyes: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Italian also needs the article, unlike English ''has blond hair'': *i capelli*, *gli occhi*. You can say *è bionda* too, but *avere* is the pattern to learn here.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco has short black hair
    gloss: Marco has short black hair.
    note: '*Neri* (black) is the masculine plural, agreeing with *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia has long blond hair
    gloss: Giulia has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Eyes
    gloss: the eyes
    note: '*Occhio* (eye) is masculine; the plural is *occhi* and takes *gli* because it starts with a vowel.'
    example_gloss: Marco has brown eyes.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: 'Eye colours: *azzurri* (blue), *marroni* (brown), *verdi* (green). These plural forms work for both genders.'
    example_gloss:
    - Giulia has blue eyes.
    - Luca has brown eyes.
    - Chiara has green eyes.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Colours agree in the plural
    gloss: 'Eye colours take the plural to match occhi: occhi azzurri, marroni, verdi.'
    note: 'Adjectives that end in -e in the singular (*verde*, *marrone*) end in -i in the plural: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: What does Giulia look like?
    gloss: What does Giulia look like?
    note: '*Com''è?* is the core question for appearance. *Com''è* is *come è* with an apostrophe where the e is dropped.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia has long blond hair and blue eyes
    gloss: Giulia has long blond hair and blue eyes.
    note: 'A model answer: *avere* + hair + *e* + eyes in one sentence.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia introduces Nina
    gloss: 'Giulia: A new girl is coming to the language café. Her name is Nina.'
    note: '*Viene* (is coming) introduces someone new. *Si chiama* means ''her name is'', literally ''she calls herself''.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco asks what she looks like
    gloss: 'Marco: Okay! What does she look like?'
    note: 'The same question again, with no name: the subject is clear from the context.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia describes Nina's height and hair
    gloss: 'Giulia: She is short and she has short blond hair.'
    note: '*È bassa* (she is short) uses the feminine *bassa*; the hair description follows with *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco asks about her eyes
    gloss: 'Marco: And her eyes?'
    note: '*E gli occhi?* leaves out the verb. Italian often drops words that the context makes clear.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia describes Nina's eyes
    gloss: 'Giulia: She has green eyes.'
    note: '*Ha gli occhi verdi*: no subject pronoun is needed because the verb ending already says it is ''she''.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco will recognize her
    gloss: 'Marco: Thanks! Then I''ll recognize her.'
    note: '*La riconosco* (I recognise her): the object pronoun *la* goes before the verb.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Comparing Luca and Chiara
    gloss: Luca and Chiara are brother and sister, but they look different. Luca is short and has short brown hair and brown eyes. Chiara is taller than Luca and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      fratello: brother
      sorella: sister
      sembrano: they look / seem
      diversi: different
      basso: short
      corti: short
      castani: brown
      capelli: hair
      marroni: brown
      occhi: eyes
      alta: tall (più alta = taller)
      lunghi: long
      verdi: green
      come: how (Tu come sei? = What do you look like?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Comparing: più ... di'
    gloss: 'Italian compares with più + adjective + di: Chiara è più alta di Luca.'
    note: 'Put *più* before the adjective and *di* before the person you compare with. The adjective keeps its gender: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara has longer hair than Luca
    gloss: Chiara has longer hair than Luca.
    note: '*I capelli più lunghi di Luca*: the adjective stays plural to agree with *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: '*Ho i capelli corti e castani*: use *avere* to describe your own appearance.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco spots Nina
    gloss: 'Marco: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Guarda* (look) is the *tu* command form. *Quella* means ''that one'' for a woman or girl.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia confirms
    gloss: 'Giulia: Yes, that''s Nina!'
    note: A short, natural confirmation.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina greets Marco
    gloss: 'Nina: Hi, are you Marco?'
    note: '*Sei Marco?* is the informal question: *sei* is the *tu* form of *essere*, so no *tu* is needed.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco greets Nina back
    gloss: 'Marco: Yes! Nice to meet you, Nina.'
    note: '*Piacere di conoscerti* is the phrase for meeting someone for the first time; *-ti* means ''you''.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Marco successfully recognized Nina from Giulia's earlier description.
