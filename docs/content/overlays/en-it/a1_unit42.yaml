course:
  title: Italian A1
  description: 'Beginner Italian for describing a person''s basic physical appearance: height and age impressions, hair and eye colour, the core question Com''è?, and comparing two people''s appearance.'
units:
  it.a1.unit42.aspetto:
    title: Describing appearance
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: Tall, short, old, and young
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: Describing hair
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: Eyes and what does someone look like?
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: Giulia describes Nina
  it.a1.unit42.lesson05.luca_e_chiara_a:
