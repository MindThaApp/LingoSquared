teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno: {title: "la cucina, il soggiorno", gloss: "kitchen, living room", note: "*la cucina* (kitchen) is feminine; *il soggiorno* (living room) is masculine.", example_gloss: ["The kitchen is big.", "The living room is comfortable."]}
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno: {title: "la camera da letto, il bagno", gloss: "bedroom, bathroom", note: "*la camera da letto* is literally 'the room for sleeping'; *il bagno* is the bathroom.", example_gloss: ["The bedroom is small.", "The bathroom is clean."]}
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa: {title: "Questa è la mia casa.", gloss: "This is my house.", note: "*Questa* (this, feminine) agrees with *casa* (house), which is feminine."}
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze: {title: "Ci sono quattro stanze.", gloss: "There are four rooms.", note: "*Ci sono* (there are) plus a number and *stanze* (rooms); *quattro* (four) was taught in unit03."}

  it.a1.unit18.lesson02.teach.il_letto_il_tavolo: {title: "il letto, il tavolo", gloss: "bed, table", note: "*il letto* (bed) and *il tavolo* (table) are both masculine.", example_gloss: ["The bed is in the bedroom.", "The table is in the kitchen."]}
  it.a1.unit18.lesson02.teach.la_sedia_il_divano: {title: "la sedia, il divano", gloss: "chair, sofa", note: "*la sedia* (chair) is feminine; *il divano* (sofa) is masculine.", example_gloss: ["The chair is near the table.", "The sofa is in the living room."]}
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto: {title: "Il letto è nella camera da letto.", gloss: "The bed is in the bedroom.", note: "*nella* combines *in* + *la* to say 'in the.'"}
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno: {title: "Il divano è nel soggiorno.", gloss: "The sofa is in the living room.", note: "*nel* combines *in* + *il* (masculine) to say 'in the.'"}

  it.a1.unit18.lesson03.teach.vicino_a_davanti: {title: "vicino a, davanti a", gloss: "near, in front of", note: "Both are two-word prepositions ending in *a*, which contracts with a following article (*al*, *alla*).", example_gloss: ["The chair is near the table.", "The bed is in front of the window."]}
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto: {title: "dietro, sopra, sotto", gloss: "behind, above / on, under", note: "Three more location words: *dietro* (behind), *sopra* (above/on), *sotto* (under) — none of these need *a* before an article.", example_gloss: ["The sofa is behind the table.", "The book is on the table.", "The cat is under the bed."]}
  it.a1.unit18.lesson03.teach.dove_il_letto: {title: "Dov'è il letto?", gloss: "Where is the bed?", note: "*Dov'è* is the contraction of *dove* (where) + *è* (is)."}
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra: {title: "Il letto è vicino alla finestra.", gloss: "The bed is near the window.", note: "*vicino alla finestra* uses *vicino a* + *la finestra* (the window), contracted to *alla*."}

