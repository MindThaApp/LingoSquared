teaching:
  it.b1.unit43.lesson01.teach_riunione: {title: "la riunione", gloss: "the meeting", note: "*Riunione* is a workplace meeting.", example_gloss: ["The meeting starts at three."]}
  it.b1.unit43.lesson01.teach_inizia_alle_tre: {title: "inizia alle tre", gloss: "starts at three", note: "*Inizia* is present tense third person of *iniziare*.", example_gloss: ["The meeting starts at three."]}
