  it.b1.unit43.lesson02.teach_ha_chiesto: {title: "Sam ha chiesto", gloss: "Sam asked", note: "*Ha chiesto* is passato prossimo of *chiedere*.", example_gloss: ["Sam asked whether the meeting starts at three."]}
  it.b1.unit43.lesson02.teach_se_domanda: {title: "se la riunione inizia alle tre", gloss: "whether the meeting starts at three", note: "*Se* here means 'whether', embedding a reported yes/no question.", example_gloss: ["Sam asked whether the meeting starts at three."]}
  it.b1.unit43.lesson02.teach_contrasto: {title: "Elena ha detto che... Sam ha chiesto se...", gloss: "Elena said that... Sam asked whether...", note: "The final task requires both a reported statement and a reported question.", example_gloss: ["Elena said that the meeting starts at three. Sam asked whether the meeting starts at three."]}
exercises:
  it.b1.unit43.lesson01.exercise01.choose_riunione:
    instruction: "Which word means 'the meeting'?"
    correct_option: "riunione"
    distractors: ["conferma", "modulo", "rapporto"]
    accepted_answers: [{value: "riunione", status: "correct"}]
    feedback: "*Riunione* means the meeting."
  it.b1.unit43.lesson01.exercise02.listen_affermazione:
    instruction: "Listen and choose what the sentence says."
    correct_option: "Elena said that the meeting starts at three."
    distractors: ["Sam asked whether the meeting starts at three.", "The meeting starts at four.", "Elena said the report is ready."]
    accepted_answers: [{value: "Elena said that the meeting starts at three.", status: "correct"}]
    feedback: "The sentence is *Elena ha detto che la riunione inizia alle tre.*"
  it.b1.unit43.lesson01.exercise03.match_affermazione:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "Elena said that", right: "Elena ha detto che"}
          - {left: "the meeting", right: "la riunione"}
          - {left: "starts at three", right: "inizia alle tre"}
          - {left: "the report", right: "il rapporto"}
          - {left: "the form", right: "il modulo"}
          - {left: "please", right: "per favore"}
        status: "correct"
    feedback: "These pieces build a reported statement."
  it.b1.unit43.lesson01.exercise04.order_affermazione:
    instruction: "Put the words in order to build the reported statement."
    accepted_answers: [{value: ["Elena", "ha", "detto", "che", "la", "riunione", "inizia", "alle", "tre"], status: "correct"}]
    feedback: "The sentence is *Elena ha detto che la riunione inizia alle tre.*"
  it.b1.unit43.lesson01.exercise05.fill_riunione:
    instruction: "Complete the reported statement with *riunione*."
    accepted_answers: [{value: "riunione", status: "correct"}]
    feedback: "*La riunione* is the reported subject."
  it.b1.unit43.lesson01.exercise06.write_affermazione:
    instruction: "Write exactly one Italian sentence reporting a statement with *ha detto che*: *Elena ha detto che la riunione inizia alle tre.*"
    accepted_answers:
      - {value: "Elena ha detto che la riunione inizia alle tre.", status: "correct"}
      - {value: "Elena ha detto che la riunione inizia alle tre", status: "correct"}
    feedback: "*Ha detto che* embeds the reported content after the reporting verb."
  it.b1.unit43.lesson02.exercise01.choose_chiesto:
    instruction: "Which word means 'asked'?"
    correct_option: "chiesto"
    distractors: ["detto", "trovato", "consegnato"]
    accepted_answers: [{value: "chiesto", status: "correct"}]
    feedback: "*Chiesto* means asked."
  it.b1.unit43.lesson02.exercise02.listen_discorso:
    instruction: "Listen and choose what the sentences say."
    correct_option: "Elena said that the meeting starts at three. Sam asked whether the meeting starts at three."
    distractors: ["Sam said the meeting starts at three.", "Elena asked whether the report is ready.", "The meeting starts at four."]
    accepted_answers: [{value: "Elena said that the meeting starts at three. Sam asked whether the meeting starts at three.", status: "correct"}]
    feedback: "The pair contrasts a reported statement with a reported question."
  it.b1.unit43.lesson02.exercise03.match_domanda:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "Sam asked", right: "Sam ha chiesto"}
          - {left: "whether the meeting", right: "se la riunione"}
          - {left: "starts at three", right: "inizia alle tre"}
          - {left: "if it rains", right: "se piove"}
          - {left: "we go out", right: "usciamo"}
          - {left: "when I arrive", right: "quando arrivo"}
        status: "correct"
    feedback: "These pieces build a reported yes/no question."
  it.b1.unit43.lesson02.exercise04.order_domanda:
    instruction: "Put the words in order to build the reported question."
    accepted_answers: [{value: ["Sam", "ha", "chiesto", "se", "la", "riunione", "inizia", "alle", "tre"], status: "correct"}]
    feedback: "The sentence is *Sam ha chiesto se la riunione inizia alle tre.*"
  it.b1.unit43.lesson02.exercise05.fill_chiesto:
    instruction: "Complete the reported question with *chiesto*."
    accepted_answers: [{value: "chiesto", status: "correct"}]
    feedback: "*Ha chiesto* introduces the reported question."
  it.b1.unit43.lesson02.exercise06.write_full_discorso:
    instruction: "Write exactly two Italian sentences: the first reports a statement with *ha detto che*, *Elena ha detto che la riunione inizia alle tre*; the second reports a question with *ha chiesto se*, *Sam ha chiesto se la riunione inizia alle tre*."
    accepted_answers:
      - {value: "Elena ha detto che la riunione inizia alle tre. Sam ha chiesto se la riunione inizia alle tre.", status: "correct"}
      - {value: "Elena ha detto che la riunione inizia alle tre Sam ha chiesto se la riunione inizia alle tre", status: "correct"}
    feedback: "The first sentence reports what Elena said; the second reports what Sam asked."
