course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit89.domani_sara_una_bella_giornata: {"title": "Tomorrow will be a nice day", "description": "Make predictions and promises with the futuro semplice: regular and irregular forms, forse and probabilmente, and promises with ti prometto che."}
lessons:
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.parlero: {"title": "Tomorrow I will talk"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.saro_a_casa: {"title": "I will be at home"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.forse_probabilmente: {"title": "Maybe, probably"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.ti_prometto: {"title": "I promise I will come"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson05.un_messaggio: {"title": "A message from Marco"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.giulia_e_marco: {"title": "Giulia and Marco plan the beach"}
teaching:
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.teach.verbi: {"title": "Verbs in the future", "gloss": "to talk - I will talk / to eat - I will eat / to leave - I will leave / to finish - I will finish / to work - I will work", "note": "The futuro semplice is one word: the infinitive stem plus an ending. It is used for plans, predictions and promises.", "example_gloss": ["Tomorrow I will talk to Marco.", "Tomorrow I will eat pizza.", "Giulia will leave tomorrow.", "We will finish the work.", "We will eat ice cream.", "Luca will work at home."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.teach.tempo: {"title": "When in the future", "gloss": "tomorrow / the day after tomorrow / in a week / in a month / in a year", "note": "*Tra* + a period of time means 'in' (from now).", "example_gloss": ["The day after tomorrow we will leave.", "In a week I will finish the work.", "In a month Giulia will leave.", "In a year Marco will work in Rome."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.teach.gn_desinenze: {"title": "The endings", "gloss": "I will talk, you will talk, he/she will talk, we will talk, you (plural) will talk, they will talk", "note": "The endings are -ò, -ai, -à, -emo, -ete, -anno. The -ò and -à at the end carry a written accent and are stressed."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.teach.gn_are_ere_ire: {"title": "-are, -ere and -ire", "gloss": "Tomorrow I will take the train. Marco will take the train. You will leave with us.", "note": "-ere and -ire verbs keep their vowel (*prendere*: *prenderò*; *partire*: *partirò*). -are verbs change a to e: *parlare*: *parlerò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.teach.gn_ortografia: {"title": "Spelling changes", "gloss": "I will eat a pizza. We will start tomorrow. I will pay. I will look for Marco.", "note": "-ciare and -giare verbs lose the i (*mangiare*: *mangerò*, *cominciare*: *comincerò*). -care and -gare verbs add h to keep the hard sound (*pagare*: *pagherò*, *cercare*: *cercherò*)."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.teach.verbi: {"title": "Irregular futures", "gloss": "to be - I will be / to have - I will have / to go - I will go / to do - I will do / to come - I will come", "note": "These verbs have an irregular stem but regular endings.", "example_gloss": ["Tomorrow I will be at home.", "I will have time on Saturday.", "I will go to the sea with Luca.", "Tomorrow I will make a cake.", "Luca will come to the party."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.teach.gn_radici: {"title": "Irregular stems", "gloss": "I will be, I will have, I will go, I will do, I will come, you will be, you will have, you will go, you will do, you will come", "note": "Learn the stem once: sar-, avr-, andr-, far-, verr-. Then add -ò, -ai, -à, -emo, -ete, -anno."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.teach.gn_noi: {"title": "The noi form", "gloss": "We will be at home. We will have time. We will go to the sea. We will come with you.", "note": "The noi form always ends in -emo: *saremo*, *avremo*, *andremo*, *verremo*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.teach.tempo: {"title": "Weather forecast", "gloss": "sun / rain / hot / cold / to rain - it will rain", "note": "Weather in Italian uses *fare*: *farà caldo*. *Ci sarà* means 'there will be'.", "example_gloss": ["Tomorrow there will be sun.", "Tomorrow it will rain.", "Tomorrow it will be hot.", "On Saturday it will be cold."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.teach.gn_previsioni: {"title": "Predictions", "gloss": "Tomorrow there will be sun. Tomorrow it will not rain. Tomorrow it will be hot.", "note": "A prediction uses the future. To make it negative, put *non* before the verb."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.teach.avverbi: {"title": "How sure are you?", "gloss": "maybe / probably / certainly / in my opinion / I do not know", "note": "From least to most sure: *forse*, *probabilmente*, *sicuramente*.", "example_gloss": ["Maybe it will rain tomorrow.", "Giulia will probably arrive late.", "Luca will certainly be at home.", "In my opinion Marco will come.", "I do not know."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.teach.tardi: {"title": "Early and late", "gloss": "late / early / delayed / on time", "note": "*Tardi* and *presto* are adverbs; *in ritardo* and *puntuale* describe a person or thing.", "example_gloss": ["Marco will arrive early.", "Giulia will arrive late.", "Luca will be on time.", "The train will be late."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.teach.gn_posizione: {"title": "Where the adverb goes", "gloss": "Maybe Marco will come. Giulia will probably arrive late. Luca will certainly be on time.", "note": "The adverb usually comes at the start, before the subject or the verb."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.teach.gn_non: {"title": "Negative predictions", "gloss": "Marco will not come. Giulia will not arrive late. Tomorrow I will not work.", "note": "*Non* goes before the future verb."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.teach.gn_secondo_me: {"title": "In my opinion", "gloss": "In my opinion it will rain tomorrow. In my opinion Marco will arrive early.", "note": "After *secondo me* the verb stays in the indicative: a normal future."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.teach.verbi: {"title": "Promises", "gloss": "to promise - I promise / to call - I will call / to write - I will write / to help - I will help / to wait for - I will wait for", "note": "*Ti* means 'you' (to you, for you) and goes before the verb.", "example_gloss": ["I promise you that I will come.", "I will call you tomorrow.", "I will write to you on Saturday.", "I will help you.", "I will wait for you at the station."]}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.teach.gn_prometto_che: {"title": "Promise + future", "gloss": "I promise you that I will come. I promise you that I will not arrive late.", "note": "After *ti prometto che* use the future for what you will do."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.teach.gn_prometto_di: {"title": "Promise + di + infinitive", "gloss": "I promise to arrive early. I promise not to arrive late.", "note": "With one subject you can also use *prometto di* + infinitive. The *non* goes before the infinitive."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.teach.gn_ti: {"title": "Ti before the verb", "gloss": "I will call you tomorrow. I will write to you on Saturday. I will help you.", "note": "The short pronoun *ti* comes right before the future verb."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.teach.certo: {"title": "Accepting a promise", "gloss": "Of course! I will help you. All right! I will wait for you.", "note": "These are friendly ways to answer."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson05.teach.lettura: {"title": "Marco writes to Giulia", "gloss": "Hi Giulia! Tomorrow will be a nice day: it will be sunny and hot. Maybe we will go to the sea with Luca. We will leave at nine and arrive at noon. I promise I will not arrive late! I will call you tomorrow morning. Marco", "note": "Notice that every future verb in the message is one word."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d1: {"title": "Marco asks", "gloss": "Marco: Hi Giulia! What will the weather be like tomorrow?"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d2: {"title": "Giulia predicts", "gloss": "Giulia: In my opinion it will be sunny, but maybe it will rain in the evening."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d3: {"title": "Marco suggests", "gloss": "Marco: So will we go to the sea with Luca?"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d4: {"title": "Giulia confirms", "gloss": "Giulia: Yes! Luca will come with us. We will leave at nine."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d5: {"title": "Marco promises", "gloss": "Marco: I promise I will not arrive late."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson06.teach.d6: {"title": "Giulia replies", "gloss": "Giulia: Well done! I will wait for you at the station."}
exercises:
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise01.scegli_parlero: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Domani parlerò con Marco.", "distractors": ["Domani parlerai con Marco.", "Domani parleremo con Marco.", "Domani parlarò con Marco."], "accepted_answers": [{"value": "Domani parlerò con Marco.", "status": "correct"}], "feedback": "Parlare: the a changes to e, so *parlerò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise02.scegli_partira: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia partirà domani.", "distractors": ["Giulia partirò domani.", "Giulia partiremo domani.", "Giulia parterà domani."], "accepted_answers": [{"value": "Giulia partirà domani.", "status": "correct"}], "feedback": "*Partire* keeps its i: *partirà* for she."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise03.abbina_desinenze: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "parlerò", "right": "I will talk"}, {"left": "parlerai", "right": "you will talk"}, {"left": "parlerà", "right": "he/she will talk"}, {"left": "parleremo", "right": "we will talk"}, {"left": "parlerete", "right": "you (plural) will talk"}, {"left": "parleranno", "right": "they will talk"}], "status": "correct"}], "feedback": "The endings -ò, -ai, -à, -emo, -ete, -anno are the same for every verb."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise04.ordina_pizza: {"instruction": "Put the words in order to say 'Tomorrow I will eat pizza.'", "correct_option": "Domani mangerò la pizza", "accepted_answers": [{"value": "Domani mangerò la pizza", "status": "correct"}, {"value": "Mangerò la pizza domani", "status": "correct"}], "feedback": "The time word can come first or last."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise05.completa_finiremo: {"instruction": "Complete with the future of finire.", "correct_option": "finiremo", "accepted_answers": [{"value": "finiremo", "status": "correct"}], "feedback": "*Noi* takes the ending -emo: *finiremo*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise06.traduci_partira: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Giulia partirà domani.", "status": "correct"}, {"value": "Giulia partirà domani", "status": "correct"}, {"value": "Domani Giulia partirà.", "status": "correct"}, {"value": "Domani Giulia partirà", "status": "correct"}], "feedback": "*Partirà* is the third person of the future."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson01.exercise07.scrivi_gelato: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Domani mangeremo il gelato.", "status": "correct"}, {"value": "Domani mangeremo il gelato", "status": "correct"}, {"value": "Mangeremo il gelato domani.", "status": "correct"}, {"value": "Mangeremo il gelato domani", "status": "correct"}], "feedback": "*Mangiare* loses its i: *mangeremo*.", "correct_option": "Domani mangeremo il gelato."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise01.scegli_saro: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Domani sarò a casa.", "distractors": ["Domani serò a casa.", "Domani essero a casa.", "Domani sarai a casa."], "accepted_answers": [{"value": "Domani sarò a casa.", "status": "correct"}], "feedback": "*Essere* has the irregular stem sar-: *sarò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise02.scegli_verra: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Luca verrà alla festa.", "distractors": ["Luca venirà alla festa.", "Luca verrò alla festa.", "Luca verremo alla festa."], "accepted_answers": [{"value": "Luca verrà alla festa.", "status": "correct"}], "feedback": "*Venire* has the stem verr-: *verrà* for he."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise03.abbina_irregolari: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "sarò", "right": "I will be"}, {"left": "avrò", "right": "I will have"}, {"left": "andrò", "right": "I will go"}, {"left": "farò", "right": "I will do"}, {"left": "verrò", "right": "I will come"}, {"left": "pioverà", "right": "it will rain"}], "status": "correct"}], "feedback": "These stems are irregular but the endings are regular."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise04.ordina_mare: {"instruction": "Put the words in order to say 'I will go to the sea with Luca.'", "correct_option": "Andrò al mare con Luca", "accepted_answers": [{"value": "Andrò al mare con Luca", "status": "correct"}], "feedback": "*Andrò* is the irregular future of *andare*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise05.completa_sole: {"instruction": "Complete with the future of essere.", "correct_option": "sarà", "accepted_answers": [{"value": "sarà", "status": "correct"}], "feedback": "*Ci sarà* means 'there will be'."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise06.traduci_pioverà: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Domani pioverà.", "status": "correct"}, {"value": "Domani pioverà", "status": "correct"}, {"value": "Pioverà domani.", "status": "correct"}, {"value": "Pioverà domani", "status": "correct"}], "feedback": "*Pioverà* is the future of *piovere*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson02.exercise07.scrivi_caldo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Domani farà caldo.", "status": "correct"}, {"value": "Domani farà caldo", "status": "correct"}, {"value": "Farà caldo domani.", "status": "correct"}, {"value": "Farà caldo domani", "status": "correct"}], "feedback": "Weather uses *fare*: *farà caldo*.", "correct_option": "Domani farà caldo."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise01.scegli_forse: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Forse domani pioverà.", "distractors": ["Forse domani pioveva.", "Forse domani pioveremo.", "Forse domani pioverò."], "accepted_answers": [{"value": "Forse domani pioverà.", "status": "correct"}], "feedback": "*Forse* + future expresses a possibility."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise02.scegli_secondo_me: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Secondo me Marco verrà.", "distractors": ["Secondo me Marco verrai.", "Secondo me Marco venirà.", "Secondo me Marco verremo."], "accepted_answers": [{"value": "Secondo me Marco verrà.", "status": "correct"}], "feedback": "*Verrà* is the future of *venire* for he."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise03.abbina_avverbi: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "forse", "right": "maybe"}, {"left": "probabilmente", "right": "probably"}, {"left": "sicuramente", "right": "certainly"}, {"left": "secondo me", "right": "in my opinion"}, {"left": "tardi", "right": "late"}, {"left": "presto", "right": "early"}], "status": "correct"}], "feedback": "These words show how sure you are or when something happens."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise04.ordina_tardi: {"instruction": "Put the words in order to say 'Giulia will probably arrive late.'", "correct_option": "Probabilmente Giulia arriverà tardi", "accepted_answers": [{"value": "Probabilmente Giulia arriverà tardi", "status": "correct"}], "feedback": "*Probabilmente* comes first."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise05.completa_puntuale: {"instruction": "Complete with puntuale or in ritardo.", "correct_option": "puntuale", "accepted_answers": [{"value": "puntuale", "status": "correct"}], "feedback": "*Puntuale* means 'on time'."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise06.traduci_non: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Marco non verrà.", "status": "correct"}, {"value": "Marco non verrà", "status": "correct"}, {"value": "Non verrà Marco.", "status": "correct"}, {"value": "Non verrà Marco", "status": "correct"}], "feedback": "*Non* goes before *verrà*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson03.exercise07.scrivi_presto: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Forse Marco arriverà presto.", "status": "correct"}, {"value": "Forse Marco arriverà presto", "status": "correct"}, {"value": "Marco forse arriverà presto.", "status": "correct"}, {"value": "Marco forse arriverà presto", "status": "correct"}], "feedback": "*Forse* can go first or after the subject.", "correct_option": "Forse Marco arriverà presto."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise01.scegli_prometto: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ti prometto che verrò.", "distractors": ["Ti prometto che sono venuto.", "Ti prometto che venirò.", "Ti prometto che verrai."], "accepted_answers": [{"value": "Ti prometto che verrò.", "status": "correct"}], "feedback": "After *che* the verb is in the future: *verrò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise02.scegli_chiamero: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ti chiamerò domani.", "distractors": ["Ti chiamarò domani.", "Ti chiamerai domani.", "Chiamerò ti domani."], "accepted_answers": [{"value": "Ti chiamerò domani.", "status": "correct"}], "feedback": "*Ti* goes before the verb; *chiamare* becomes *chiamerò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise03.abbina_promesse: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ti prometto che verrò.", "right": "I promise you that I will come."}, {"left": "Ti chiamerò domani.", "right": "I will call you tomorrow."}, {"left": "Ti scriverò sabato.", "right": "I will write to you on Saturday."}, {"left": "Ti aiuterò.", "right": "I will help you."}, {"left": "Prometto di arrivare presto.", "right": "I promise to arrive early."}, {"left": "Ti aspetterò alla stazione.", "right": "I will wait for you at the station."}], "status": "correct"}], "feedback": "These are promises: *ti* goes before the future."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise04.ordina_non_tardi: {"instruction": "Put the words in order to say 'I promise you that I will not arrive late.'", "correct_option": "Ti prometto che non arriverò tardi", "accepted_answers": [{"value": "Ti prometto che non arriverò tardi", "status": "correct"}], "feedback": "*Non* goes before *arriverò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise05.completa_aiutero: {"instruction": "Complete with the future of aiutare.", "correct_option": "aiuterò", "accepted_answers": [{"value": "aiuterò", "status": "correct"}], "feedback": "*Aiutare* gives *aiuterò*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise06.traduci_scrivero: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Ti scriverò sabato.", "status": "correct"}, {"value": "Ti scriverò sabato", "status": "correct"}, {"value": "Sabato ti scriverò.", "status": "correct"}, {"value": "Sabato ti scriverò", "status": "correct"}], "feedback": "*Ti scriverò* is the future of *scrivere* with *ti*."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson04.exercise07.scrivi_presto: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Prometto di arrivare presto.", "status": "correct"}, {"value": "Prometto di arrivare presto", "status": "correct"}], "feedback": "*Prometto di* + infinitive.", "correct_option": "Prometto di arrivare presto."}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson05.exercise01.leggi_tempo: {"instruction": "Read the text and choose the answer.", "correct_option": "Sunny and hot.", "distractors": ["Rainy and cold.", "Cloudy and cold.", "Sunny and cold."], "accepted_answers": [{"value": "Sunny and hot.", "status": "correct"}], "feedback": "*Ci sarà il sole e farà caldo.*"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson05.exercise02.leggi_ora: {"instruction": "Read the text and choose the answer.", "correct_option": "At nine.", "distractors": ["At noon.", "At eight.", "In the evening."], "accepted_answers": [{"value": "At nine.", "status": "correct"}], "feedback": "*Partiremo alle nove.*"}
  it.a2.unit89.domani_sara_una_bella_giornata.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "una bella giornata", "right": "a nice day"}, {"left": "Forse andremo al mare.", "right": "Maybe we will go to the sea."}, {"left": "Partiremo alle nove.", "right": "We will leave at nine."}, {"left": "Arriveremo a mezzogiorno.", "right": "We will arrive at noon."}, {"left": "Ti chiamerò domani mattina.", "right": "I will call you tomorrow morning."}, {"left": "Non arriverò tardi.", "right": "I will not arrive late."}], "status": "correct"}], "feedback": "These phrases come from Marco's message."}
