  it.a2.unit27.lesson02.teach_carta_inclusa_domanda: {title: "La carta è inclusa?", gloss: "Is the card included?", note: "Italian can ask a yes/no question with statement word order plus question intonation or punctuation.", example_gloss: ["Excuse me, is the card included?"]}
