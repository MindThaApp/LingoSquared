units:
  it.b1.unit47.rimpianti: {title: "Expressing regret and past wishes"}
lessons:
  it.b1.unit47.lesson01.avrei_dovuto: {title: "I should have checked the schedule"}
  it.b1.unit47.lesson02.se_avessi_saputo: {title: "If I had known, I wouldn't have missed the train"}
teaching:
  it.b1.unit47.lesson01.teach_avrei_dovuto_controllare: {title: "avrei dovuto controllare l'orario", gloss: "I should have checked the schedule", note: "*Avrei dovuto* + infinito is the standard form for a past regret. Never *sarebbe bisognato*, which is ungrammatical.", example_gloss: ["I should have checked the train schedule."]}
  it.b1.unit47.lesson01.teach_ho_perso_treno: {title: "ho perso il treno", gloss: "I missed the train", note: "*Perso* is the past participle of *perdere*, 'to lose/miss'.", example_gloss: ["I missed the train this morning."]}
  it.b1.unit47.lesson01.teach_avrei_dovuto_partire: {title: "avrei dovuto partire prima", gloss: "I should have left earlier", note: "*Avrei dovuto* + infinito, same construction with a different verb.", example_gloss: ["I should have left home earlier."]}
  it.b1.unit47.lesson02.teach_se_avessi_saputo: {title: "se avessi saputo", gloss: "if I had known", note: "*Avessi saputo* is congiuntivo trapassato of *sapere*, used for a past-hypothetical condition.", example_gloss: ["If I had known, I would have called you earlier."]}
  it.b1.unit47.lesson02.teach_non_avrei_perso: {title: "non avrei perso il treno", gloss: "I wouldn't have missed the train", note: "*Avrei perso* is condizionale passato, paired with the congiuntivo trapassato clause.", example_gloss: ["If I had known, I wouldn't have missed the train."]}
  it.b1.unit47.lesson02.teach_rimpianti_completi: {title: "avrei dovuto... se avessi saputo, non avrei...", gloss: "I should have... if I had known, I wouldn't have...", note: "The final task requires both an avrei dovuto regret and a se avessi saputo past-hypothetical wish.", example_gloss: ["I should have checked the schedule. If I had known, I wouldn't have missed the train. I should have left earlier."]}
exercises:
  it.b1.unit47.lesson01.exercise01.choose_avrei_dovuto:
    instruction: "Which phrase means 'I should have' (regret about the past)?"
    correct_option: "avrei dovuto"
    distractors: ["dovrei", "ho dovuto", "sarebbe bisognato"]
    accepted_answers: [{value: "avrei dovuto", status: "correct"}]
    feedback: "*Avrei dovuto* + infinito expresses a past regret."
  it.b1.unit47.lesson01.exercise02.listen_rimpianto:
    instruction: "Listen and choose what the sentences say."
    correct_option: "I should have checked the schedule. I missed the train."
    distractors: ["I should have left earlier.", "I checked the schedule and caught the train.", "I will check the schedule tomorrow."]
    accepted_answers: [{value: "I should have checked the schedule. I missed the train.", status: "correct"}]
    feedback: "The sentences are *Avrei dovuto controllare l'orario. Ho perso il treno.*"
  it.b1.unit47.lesson01.exercise03.match_rimpianto:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "I should have checked", right: "avrei dovuto controllare"}
          - {left: "the schedule", right: "l'orario"}
          - {left: "I missed the train", right: "ho perso il treno"}
          - {left: "I should have left earlier", right: "avrei dovuto partire prima"}
          - {left: "the heating doesn't work", right: "il riscaldamento non funziona"}
          - {left: "I have already called", right: "ho già chiamato"}
        status: "correct"
    feedback: "These pieces express regret using avrei dovuto + infinito."
  it.b1.unit47.lesson01.exercise04.order_rimpianto:
    instruction: "Put the words in order to build the regret."
    accepted_answers: [{value: ["Avrei", "dovuto", "controllare", "l'orario"], status: "correct"}]
    feedback: "The sentence is *Avrei dovuto controllare l'orario.*"
  it.b1.unit47.lesson01.exercise05.fill_perso:
    instruction: "Complete the sentence with *perso*."
    accepted_answers: [{value: "perso", status: "correct"}]
    feedback: "*Ho perso il treno* means 'I missed the train'."
  it.b1.unit47.lesson01.exercise06.write_rimpianto:
    instruction: "Write exactly one regret with avrei dovuto + infinito: *Avrei dovuto controllare l'orario.*"
    accepted_answers:
      - {value: "Avrei dovuto controllare l'orario.", status: "correct"}
      - {value: "Avrei dovuto controllare l'orario", status: "correct"}
    feedback: "*Avrei dovuto* + infinito is the standard form for a past regret."
  it.b1.unit47.lesson02.exercise01.choose_se_avessi:
    instruction: "Which phrase means 'if I had known'?"
    correct_option: "se avessi saputo"
    distractors: ["se sapevo", "se saprei", "se ho saputo"]
    accepted_answers: [{value: "se avessi saputo", status: "correct"}]
    feedback: "*Se avessi saputo* uses congiuntivo trapassato for a past-hypothetical condition."
  it.b1.unit47.lesson02.exercise02.listen_rimpianti_completi:
    instruction: "Listen and choose what the sentences say."
    correct_option: "I should have checked the schedule. If I had known, I wouldn't have missed the train. I should have left earlier."
    distractors: ["I checked the schedule and caught the train.", "If I had known, I would have missed the train.", "I should have called the technician."]
    accepted_answers: [{value: "I should have checked the schedule. If I had known, I wouldn't have missed the train. I should have left earlier.", status: "correct"}]
    feedback: "The full passage is *Avrei dovuto controllare l'orario. Se avessi saputo, non avrei perso il treno. Avrei dovuto partire prima.*"
  it.b1.unit47.lesson02.exercise03.match_completo:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "if I had known", right: "se avessi saputo"}
          - {left: "I wouldn't have missed", right: "non avrei perso"}
          - {left: "I should have left earlier", right: "avrei dovuto partire prima"}
          - {left: "I should have checked", right: "avrei dovuto controllare"}
          - {left: "the schedule", right: "l'orario"}
          - {left: "I missed the train", right: "ho perso il treno"}
        status: "correct"
    feedback: "These pieces build a full past-hypothetical wish."
  it.b1.unit47.lesson02.exercise04.order_completo:
    instruction: "Put the words in order to build the past-hypothetical wish."
    accepted_answers: [{value: ["Se", "avessi", "saputo", "non", "avrei", "perso", "il", "treno"], status: "correct"}]
    feedback: "The sentence is *Se avessi saputo, non avrei perso il treno.*"
  it.b1.unit47.lesson02.exercise05.fill_saputo:
    instruction: "Complete the sentence with *saputo*."
    accepted_answers: [{value: "saputo", status: "correct"}]
    feedback: "*Se avessi saputo* uses congiuntivo trapassato of sapere."
  it.b1.unit47.lesson02.exercise06.write_rimpianti_completi:
    instruction: "Write exactly two sentences of regret: one with avrei dovuto + infinito, *Avrei dovuto controllare l'orario*; and one with se avessi saputo + condizionale passato, *Se avessi saputo, non avrei perso il treno.*"
    accepted_answers:
      - {value: "Avrei dovuto controllare l'orario. Se avessi saputo, non avrei perso il treno.", status: "correct"}
      - {value: "Avrei dovuto controllare l'orario Se avessi saputo non avrei perso il treno", status: "correct"}
    feedback: "The first sentence names the regretted action; the second is a full past-hypothetical wish."
  it.b1.unit47.lesson01.avrei_dovuto.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Avrei dovuto controllare l'orario. Ho perso il treno."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
