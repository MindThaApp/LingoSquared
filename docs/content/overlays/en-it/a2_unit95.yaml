course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice, habits, reasons, conditions and reported messages."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, make requests, give advice, explain reasons, state conditions, ask indirect questions and pass on messages."
units:
  it.a2.unit95.resto_a_casa: {"title": "I am tired, so I stay at home", "description": "Give a reason and a consequence in one message with perché, siccome, quindi and per questo, all in the present tense."}
lessons:
  it.a2.unit95.resto_a_casa.lesson01.perche: {"title": "Why aren't you coming?"}
  it.a2.unit95.resto_a_casa.lesson02.siccome: {"title": "Since it is raining, I stay at home"}
  it.a2.unit95.resto_a_casa.lesson03.quindi: {"title": "So and that is why"}
  it.a2.unit95.resto_a_casa.lesson04.messaggio: {"title": "A message with a reason and a result"}
  it.a2.unit95.resto_a_casa.lesson05.lettura: {"title": "A message for Marco"}
  it.a2.unit95.resto_a_casa.lesson06.giulia_e_marco: {"title": "Giulia and Marco on the phone"}
teaching:
  it.a2.unit95.resto_a_casa.lesson01.teach.v_perche: {"title": "Reasons", "gloss": "why / because / tired / ill / the headache / a lot of work", "note": "*Perché* means both 'why' (in a question) and 'because' (in the answer).", "example_gloss": ["Why aren't you coming?", "I am not coming because I am tired.", "Giulia is not coming because she has a headache.", "Luca is at home because he is ill."]}
  it.a2.unit95.resto_a_casa.lesson01.teach.perche_risposta: {"title": "Perché asks and answers", "gloss": "Why are you not coming? I am not coming because I have a lot of work.", "note": "The same word asks the question and gives the answer. In writing, *perché* has an accent."}
  it.a2.unit95.resto_a_casa.lesson01.teach.perche_ordine: {"title": "Reason after perché", "gloss": "Marco does not go out because he is tired. Giulia stays at home because she is ill.", "note": "The main fact comes first; *perché* introduces the reason, with the verb in the present."}
  it.a2.unit95.resto_a_casa.lesson02.teach.v_siccome: {"title": "Siccome", "gloss": "since / it rains / it is cold / the jacket / I go to bed", "note": "*Siccome* means 'since' and gives a known reason.", "example_gloss": ["Since it is raining, I stay at home.", "Since it is cold, I take a jacket.", "Since I am tired, I go to bed.", "Since I am ill, I am not going out."]}
  it.a2.unit95.resto_a_casa.lesson02.teach.siccome_prima: {"title": "Siccome comes first", "gloss": "Since it is raining, I stay at home. I stay at home because it is raining.", "note": "*Siccome* starts the sentence and the clause ends with a comma; *perché* usually follows the main fact."}
  it.a2.unit95.resto_a_casa.lesson02.teach.siccome_non: {"title": "Siccome with a negative", "gloss": "Since I have no time, I am not coming.", "note": "Both clauses can be negative."}
  it.a2.unit95.resto_a_casa.lesson03.teach.v_quindi: {"title": "Results", "gloss": "so / for this reason / early / late / in bed", "note": "*Quindi* and *per questo* introduce the result.", "example_gloss": ["I have a headache, so I stay at home.", "I am tired, that is why I go to bed early.", "It is raining, so I am not going out.", "I have no time, so I am not coming."]}
  it.a2.unit95.resto_a_casa.lesson03.teach.quindi: {"title": "Quindi: the result", "gloss": "It is raining, so I stay at home. I have a lot of work, so I am not going out.", "note": "The reason comes first, then a comma, then *quindi* and the result."}
  it.a2.unit95.resto_a_casa.lesson03.teach.per_questo: {"title": "Per questo", "gloss": "I am tired, that is why I go to bed early.", "note": "*Per questo* is a little more explicit than *quindi* and means 'for this reason'."}
  it.a2.unit95.resto_a_casa.lesson03.teach.perche_quindi: {"title": "Reason or result?", "gloss": "I stay at home because it is raining. It is raining, so I stay at home.", "note": "*Perché* introduces the reason; *quindi* introduces the result. The facts are the same, the order is opposite."}
  it.a2.unit95.resto_a_casa.lesson04.teach.v_messaggio: {"title": "Writing a message", "gloss": "I am sorry / I cannot come / I have to work / I feel ill / see you tomorrow", "note": "*Mi dispiace* is a polite way to say you are sorry.", "example_gloss": ["I am sorry, I cannot come.", "I have to work, so I cannot come.", "I feel ill, so I stay in bed.", "We will see each other tomorrow."]}
  it.a2.unit95.resto_a_casa.lesson04.teach.messaggio: {"title": "Reason and result in one message", "gloss": "I am sorry, I cannot come because I have to work. So we will see each other tomorrow.", "note": "One message can give the reason with *perché* and the result with *quindi*."}
  it.a2.unit95.resto_a_casa.lesson04.teach.catena: {"title": "Siccome plus quindi", "gloss": "Since I feel ill, I stay in bed. So I am not coming.", "note": "*Siccome* gives the reason; *quindi* gives what follows."}
  it.a2.unit95.resto_a_casa.lesson04.teach.posso: {"title": "Cannot and have to", "gloss": "I cannot come. I have to work.", "note": "*Non posso* + infinitive means 'I cannot'; *devo* + infinitive means 'I have to'."}
  it.a2.unit95.resto_a_casa.lesson05.teach.messaggio: {"title": "Giulia's message", "gloss": "Hi Marco, tonight I am not coming to the cinema because I am very tired. Today I have a lot of work, so I leave late. Since it is raining, I stay at home and make dinner. Tomorrow I will come to your place, all right? Giulia", "note": "Find the reason and the result in each sentence."}
  it.a2.unit95.resto_a_casa.lesson06.teach.d1: {"title": "Marco asks why", "gloss": "Marco: Giulia, why aren't you coming to the cinema tonight?"}
  it.a2.unit95.resto_a_casa.lesson06.teach.d2: {"title": "Giulia explains", "gloss": "Giulia: I am sorry, I cannot come because I have a lot of work."}
  it.a2.unit95.resto_a_casa.lesson06.teach.d3: {"title": "Marco is sorry", "gloss": "Marco: What a pity! I am staying at home too, because it is raining."}
  it.a2.unit95.resto_a_casa.lesson06.teach.d4: {"title": "Giulia suggests", "gloss": "Giulia: So shall we meet tomorrow? Tomorrow I have no work."}
  it.a2.unit95.resto_a_casa.lesson06.teach.d5: {"title": "Marco agrees", "gloss": "Marco: Yes, I am free tomorrow, so I will come to your place at seven."}
  it.a2.unit95.resto_a_casa.lesson06.teach.d6: {"title": "Giulia confirms", "gloss": "Giulia: Perfect! I will wait for you."}
exercises:
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Non vengo perché sono stanco.", "distractors": ["Non vengo perché sei stanco.", "Non vengo perché è stanco.", "Perché non vengo sono stanco."], "accepted_answers": [{"value": "Non vengo perché sono stanco.", "status": "correct"}], "feedback": "*Perché* + present gives the reason."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia non esce perché ha mal di testa.", "distractors": ["Giulia non esce perché hai mal di testa.", "Giulia non esce perché ho mal di testa.", "Giulia perché non esce ha mal di testa."], "accepted_answers": [{"value": "Giulia non esce perché ha mal di testa.", "status": "correct"}], "feedback": "The verb agrees with the person: *ha*."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Perché non vieni?", "right": "Why aren't you coming?"}, {"left": "Non vengo perché sono stanco.", "right": "I am not coming because I am tired."}, {"left": "Giulia ha mal di testa.", "right": "Giulia has a headache."}, {"left": "Luca è malato.", "right": "Luca is ill."}, {"left": "Ho molto lavoro.", "right": "I have a lot of work."}, {"left": "Marco non esce perché è stanco.", "right": "Marco does not go out because he is tired."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise04.ordina: {"instruction": "Put the words in order to say 'Luca is at home because he is ill.'", "correct_option": "Luca è a casa perché è malato", "accepted_answers": [{"value": "Luca è a casa perché è malato", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise05.completa: {"instruction": "Fill in the word that gives the reason.", "correct_option": "perché", "accepted_answers": [{"value": "perché", "status": "correct"}], "feedback": "*Perché* introduces the reason."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Giulia resta a casa perché è malata.", "status": "correct"}, {"value": "Giulia resta a casa perché è malata", "status": "correct"}], "feedback": "*Malata* is feminine."}
  it.a2.unit95.resto_a_casa.lesson01.perche.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Non vengo perché ho molto lavoro.", "status": "correct"}, {"value": "Non vengo perché ho molto lavoro", "status": "correct"}], "feedback": "*Perché* + present.", "correct_option": "Non vengo perché ho molto lavoro."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Siccome fa freddo, prendo la giacca.", "distractors": ["Siccome fa freddo prendo la giacca perché.", "Fa freddo siccome, prendo la giacca.", "Siccome prendo la giacca, fa freddo."], "accepted_answers": [{"value": "Siccome fa freddo, prendo la giacca.", "status": "correct"}], "feedback": "*Siccome* + reason, then the result."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Siccome sono malato, non esco.", "distractors": ["Siccome sono malato non, esco.", "Non esco, siccome.", "Siccome non esco, sono malato."], "accepted_answers": [{"value": "Siccome sono malato, non esco.", "status": "correct"}], "feedback": "*Siccome* + reason, comma, result."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Siccome piove, resto a casa.", "right": "Since it is raining, I stay at home."}, {"left": "Siccome fa freddo, prendo la giacca.", "right": "Since it is cold, I take a jacket."}, {"left": "Siccome sono stanco, vado a letto.", "right": "Since I am tired, I go to bed."}, {"left": "Resto a casa perché piove.", "right": "I stay at home because it is raining."}, {"left": "Siccome non ho tempo, non vengo.", "right": "Since I have no time, I am not coming."}, {"left": "Siccome sono malata, non esco.", "right": "Since I am ill, I am not going out."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise04.ordina: {"instruction": "Put the words in order to say 'Since it is raining, I stay at home.'", "correct_option": "Siccome piove resto a casa", "accepted_answers": [{"value": "Siccome piove resto a casa", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise05.completa: {"instruction": "Fill in the word that means 'since' at the start of the sentence.", "correct_option": "Siccome", "accepted_answers": [{"value": "Siccome", "status": "correct"}], "feedback": "*Siccome* opens the sentence."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Siccome sono stanco, resto a casa.", "status": "correct"}, {"value": "Siccome sono stanco, resto a casa", "status": "correct"}, {"value": "Siccome sono stanca, resto a casa.", "status": "correct"}, {"value": "Siccome sono stanca, resto a casa", "status": "correct"}], "feedback": "*Stanco* or *stanca*, depending on who speaks."}
  it.a2.unit95.resto_a_casa.lesson02.siccome.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Siccome piove, non esco.", "status": "correct"}, {"value": "Siccome piove, non esco", "status": "correct"}], "feedback": "*Siccome* + reason, then the result.", "correct_option": "Siccome piove, non esco."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Ho mal di testa, quindi resto a casa.", "distractors": ["Ho mal di testa, perché resto a casa.", "Ho mal di testa quindi, resto a casa.", "Quindi ho mal di testa, resto a casa."], "accepted_answers": [{"value": "Ho mal di testa, quindi resto a casa.", "status": "correct"}], "feedback": "*Quindi* introduces the result."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Piove, quindi non esco.", "distractors": ["Piove, perché non esco.", "Piove non, quindi esco.", "Quindi piove, non esco."], "accepted_answers": [{"value": "Piove, quindi non esco.", "status": "correct"}], "feedback": "Reason first, then *quindi* and the result."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Ho mal di testa, quindi resto a casa.", "right": "I have a headache, so I stay at home."}, {"left": "Sono stanca, per questo vado a letto presto.", "right": "I am tired, that is why I go to bed early."}, {"left": "Piove, quindi non esco.", "right": "It is raining, so I am not going out."}, {"left": "Non ho tempo, quindi non vengo.", "right": "I have no time, so I am not coming."}, {"left": "quindi", "right": "so; therefore"}, {"left": "per questo", "right": "for this reason"}, {"left": "perché", "right": "because"}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise04.ordina: {"instruction": "Put the words in order to say 'I have no time, so I am not coming.'", "correct_option": "Non ho tempo quindi non vengo", "accepted_answers": [{"value": "Non ho tempo quindi non vengo", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise05.completa: {"instruction": "Fill in the word or phrase that introduces the result.", "correct_option": "quindi", "accepted_answers": [{"value": "quindi", "status": "correct"}, {"value": "per questo", "status": "correct"}], "feedback": "*Quindi* introduces the result."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sono stanco, quindi vado a letto presto.", "status": "correct"}, {"value": "Sono stanco, quindi vado a letto presto", "status": "correct"}, {"value": "Sono stanca, quindi vado a letto presto.", "status": "correct"}, {"value": "Sono stanca, quindi vado a letto presto", "status": "correct"}, {"value": "Sono stanco, per questo vado a letto presto.", "status": "correct"}, {"value": "Sono stanco, per questo vado a letto presto", "status": "correct"}, {"value": "Sono stanca, per questo vado a letto presto.", "status": "correct"}, {"value": "Sono stanca, per questo vado a letto presto", "status": "correct"}], "feedback": "*Quindi* or *per questo*."}
  it.a2.unit95.resto_a_casa.lesson03.quindi.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Ho molto lavoro, quindi non esco.", "status": "correct"}, {"value": "Ho molto lavoro, quindi non esco", "status": "correct"}, {"value": "Ho molto lavoro, per questo non esco.", "status": "correct"}, {"value": "Ho molto lavoro, per questo non esco", "status": "correct"}], "feedback": "Reason, then *quindi* and the result.", "correct_option": "Ho molto lavoro, quindi non esco."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise01.scegli1: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Mi dispiace, non posso venire perché devo lavorare.", "distractors": ["Mi dispiace, non posso venire quindi devo lavorare.", "Mi dispiace, non vengo perché posso lavorare.", "Mi dispiace, devo venire perché non posso lavorare."], "accepted_answers": [{"value": "Mi dispiace, non posso venire perché devo lavorare.", "status": "correct"}], "feedback": "*Perché* gives the reason."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise02.scegli2: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Siccome sto male, resto a letto. Quindi non vengo.", "distractors": ["Siccome sto male, resto a letto. Perché non vengo.", "Sto male, siccome resto a letto. Quindi non vengo.", "Siccome resto a letto, sto male. Quindi non vengo."], "accepted_answers": [{"value": "Siccome sto male, resto a letto. Quindi non vengo.", "status": "correct"}], "feedback": "*Siccome* for the reason, *quindi* for the result."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Mi dispiace.", "right": "I am sorry."}, {"left": "Non posso venire.", "right": "I cannot come."}, {"left": "Devo lavorare.", "right": "I have to work."}, {"left": "Domani ci vediamo.", "right": "We will see each other tomorrow."}, {"left": "Sto male.", "right": "I feel ill."}, {"left": "Resto a letto.", "right": "I stay in bed."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise04.ordina: {"instruction": "Put the words in order to say 'I am sorry, I cannot come.'", "correct_option": "Mi dispiace non posso venire", "accepted_answers": [{"value": "Mi dispiace non posso venire", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise05.completa: {"instruction": "Fill in the word that gives the reason.", "correct_option": "perché", "accepted_answers": [{"value": "perché", "status": "correct"}], "feedback": "*Perché* gives the reason."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise06.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Mi dispiace, non posso venire perché devo lavorare.", "status": "correct"}, {"value": "Mi dispiace, non posso venire perché devo lavorare", "status": "correct"}], "feedback": "*Perché* + present."}
  it.a2.unit95.resto_a_casa.lesson04.messaggio.exercise07.scrivi: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sto male, quindi non posso venire.", "status": "correct"}, {"value": "Sto male, quindi non posso venire", "status": "correct"}, {"value": "Sto male, per questo non posso venire.", "status": "correct"}, {"value": "Sto male, per questo non posso venire", "status": "correct"}], "feedback": "Reason, then *quindi* and the result.", "correct_option": "Sto male, quindi non posso venire."}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise01.leggi1: {"instruction": "Read the text and choose the answer.", "correct_option": "Because she is very tired.", "distractors": ["Because it is raining.", "Because she is ill.", "Because Marco is busy."], "accepted_answers": [{"value": "Because she is very tired.", "status": "correct"}], "feedback": "*Perché sono molto stanca.*"}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise02.leggi2: {"instruction": "Read the text and choose the answer.", "correct_option": "Because it is raining.", "distractors": ["Because she has a headache.", "Because she has no work.", "Because she is cold."], "accepted_answers": [{"value": "Because it is raining.", "status": "correct"}], "feedback": "*Siccome piove, resto a casa.*"}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise03.abbina: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Stasera non vengo al cinema.", "right": "Tonight I am not coming to the cinema."}, {"left": "Sono molto stanca.", "right": "I am very tired."}, {"left": "Oggi ho molto lavoro.", "right": "Today I have a lot of work."}, {"left": "Esco tardi.", "right": "I leave late."}, {"left": "Siccome piove, resto a casa.", "right": "Since it is raining, I stay at home."}, {"left": "Domani vengo da te.", "right": "Tomorrow I will come to your place."}], "status": "correct"}], "feedback": "Match each expression."}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise04.ordina: {"instruction": "Put the words in order to say 'Today I have a lot of work, so I leave late.'", "correct_option": "Oggi ho molto lavoro quindi esco tardi", "accepted_answers": [{"value": "Oggi ho molto lavoro quindi esco tardi", "status": "correct"}], "feedback": "Check the word order."}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise05.traduci: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Siccome piove, resto a casa e preparo la cena.", "status": "correct"}, {"value": "Siccome piove, resto a casa e preparo la cena", "status": "correct"}], "feedback": "*Siccome* + reason, then the result."}
  it.a2.unit95.resto_a_casa.lesson05.lettura.exercise06.detta1: {"instruction": "Type what you hear.", "correct_response": "Stasera non vengo al cinema perché sono molto stanca.", "orthography_strict": true, "feedback": "You heard *Stasera non vengo al cinema perché sono molto stanca.*"}
