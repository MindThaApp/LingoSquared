  it.a2.unit95.resto_a_casa.lesson06.giulia_e_marco.exercise01.capisci1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She has a lot of work.", "distractors": ["She is ill.", "She is on holiday.", "It is raining."], "accepted_answers": [{"value": "She has a lot of work.", "status": "correct"}], "feedback": "She says *perché ho molto lavoro*."}
