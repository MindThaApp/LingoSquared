  it.b1.unit51.lesson01.relativo_che: {title: "The restaurant that we visited yesterday"}
  it.b1.unit51.lesson02.relativo_cui: {title: "The person I work with"}
teaching:
  it.b1.unit51.lesson01.teach_ristorante_che: {title: "il ristorante che abbiamo visitato ieri", gloss: "the restaurant that we visited yesterday", note: "*Che* combines two facts about the restaurant (which one; that it's close to home) into one sentence.", example_gloss: ["The restaurant that we visited yesterday is close to home."]}
  it.b1.unit51.lesson01.teach_collega_che: {title: "la collega che lavora con Sam", gloss: "the colleague who works with Sam", note: "*Che* also works as subject relative pronoun for people; it doesn't change for gender or number.", example_gloss: ["The colleague who works with Sam is Italian."]}
  it.b1.unit51.lesson01.teach_due_frasi_che: {title: "unire due fatti con che", gloss: "combining two facts with 'that/who'", note: "*Che* joins two facts about a person or thing into a single, richer sentence.", example_gloss: ["'Che' combines two facts about a person or a thing into one sentence."]}
  it.b1.unit51.lesson02.teach_persona_con_cui: {title: "la persona con cui lavoro", gloss: "the person I work with", note: "*Cui* is the relative pronoun used after a preposition (*con cui*, *a cui*, *in cui*), unlike *che*.", example_gloss: ["The person I work with is very nice."]}
  it.b1.unit51.lesson02.teach_citta_in_cui: {title: "la città in cui abito", gloss: "the city I live in", note: "*In cui* combines a place fact with a preposition + relative pronoun.", example_gloss: ["Milan is the city I live in."]}
  it.b1.unit51.lesson02.teach_descrizioni_complete: {title: "il ristorante che abbiamo visitato... la persona con cui lavoro...", gloss: "the restaurant that we visited... the person I work with...", note: "The final task requires one sentence with *che* and one with a preposition + *cui*.", example_gloss: ["The restaurant that we visited yesterday is close to home. The person I work with is very nice."]}
exercises:
  it.b1.unit51.lesson01.exercise01.choose_che:
    instruction: "Which phrase combines two facts about a restaurant using a relative pronoun?"
    correct_option: "il ristorante che abbiamo visitato ieri"
    distractors: ["il ristorante è vicino a casa", "abbiamo visitato il ristorante ieri", "il ristorante era chiuso ieri"]
    accepted_answers: [{value: "il ristorante che abbiamo visitato ieri", status: "correct"}]
    feedback: "*Che* combines 'the restaurant' and 'we visited it yesterday' into one phrase."
  it.b1.unit51.lesson01.exercise02.listen_che:
    instruction: "Listen and choose what the sentences say."
    correct_option: "The restaurant that we visited yesterday is close to home. The colleague who works with Sam is Italian."
    distractors: ["We visited a restaurant last week.", "The colleague who works with Elena is American.", "The restaurant near home is closed."]
    accepted_answers: [{value: "The restaurant that we visited yesterday is close to home. The colleague who works with Sam is Italian.", status: "correct"}]
    feedback: "The sentences are *Il ristorante che abbiamo visitato ieri è vicino a casa. La collega che lavora con Sam è italiana.*"
  it.b1.unit51.lesson01.exercise03.match_che:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "the restaurant that we visited", right: "il ristorante che abbiamo visitato"}
          - {left: "yesterday", right: "ieri"}
          - {left: "the colleague who works", right: "la collega che lavora"}
          - {left: "with Sam", right: "con Sam"}
          - {left: "it's close to home", right: "è vicino a casa"}
          - {left: "she is Italian", right: "è italiana"}
        status: "correct"
    feedback: "These pieces combine two facts about a place and a person using *che*."
  it.b1.unit51.lesson01.exercise04.order_che:
    instruction: "Put the words in order to build the description."
    accepted_answers: [{value: ["Il", "ristorante", "che", "abbiamo", "visitato", "ieri", "è", "vicino", "a", "casa"], status: "correct"}]
    feedback: "The sentence is *Il ristorante che abbiamo visitato ieri è vicino a casa.*"
  it.b1.unit51.lesson01.exercise05.fill_che:
    instruction: "Complete the sentence with *che*."
    accepted_answers: [{value: "che", status: "correct"}]
    feedback: "*Che* is the relative pronoun joining the two facts."
  it.b1.unit51.lesson01.exercise06.write_che:
    instruction: "Write exactly one sentence that combines two facts with *che*: *Il ristorante che abbiamo visitato ieri è vicino a casa.*"
    accepted_answers:
      - {value: "Il ristorante che abbiamo visitato ieri è vicino a casa.", status: "correct"}
      - {value: "Il ristorante che abbiamo visitato ieri è vicino a casa", status: "correct"}
    feedback: "*Che* combines the two facts about the restaurant into one richer sentence."
  it.b1.unit51.lesson02.exercise01.choose_cui:
    instruction: "Which phrase uses a preposition + relative pronoun for 'the person I work with'?"
    correct_option: "la persona con cui lavoro"
    distractors: ["la persona che lavora", "lavoro con una persona", "la persona con la quale non lavoro"]
    accepted_answers: [{value: "la persona con cui lavoro", status: "correct"}]
    feedback: "*Con cui* is the preposition + relative pronoun form, used instead of *che* after a preposition."
  it.b1.unit51.lesson02.exercise02.listen_cui:
    instruction: "Listen and choose what the sentences say."
    correct_option: "The person I work with is very nice. Milan is the city I live in."
    distractors: ["The colleague who works with Sam is Italian.", "I don't live in Milan anymore.", "The restaurant I work near is nice."]
    accepted_answers: [{value: "The person I work with is very nice. Milan is the city I live in.", status: "correct"}]
    feedback: "The sentences are *La persona con cui lavoro è molto simpatica. Milano è la città in cui abito.*"
  it.b1.unit51.lesson02.exercise03.match_cui:
    instruction: "Match each English meaning to the Italian item."
    accepted_answers:
      - value:
          - {left: "the person I work with", right: "la persona con cui lavoro"}
          - {left: "she is very nice", right: "è molto simpatica"}
          - {left: "the city I live in", right: "la città in cui abito"}
          - {left: "Milan is", right: "Milano è"}
          - {left: "the restaurant that we visited", right: "il ristorante che abbiamo visitato"}
          - {left: "the colleague who works with Sam", right: "la collega che lavora con Sam"}
        status: "correct"
    feedback: "These pieces use preposition + *cui* to combine two facts."
  it.b1.unit51.lesson02.exercise04.order_cui:
    instruction: "Put the words in order to build the description."
    accepted_answers: [{value: ["La", "persona", "con", "cui", "lavoro", "è", "molto", "simpatica"], status: "correct"}]
    feedback: "The sentence is *La persona con cui lavoro è molto simpatica.*"
  it.b1.unit51.lesson02.exercise05.fill_cui:
    instruction: "Complete the sentence with *cui*."
    accepted_answers: [{value: "cui", status: "correct"}]
    feedback: "After a preposition, use *cui* instead of *che*."
  it.b1.unit51.lesson02.exercise06.write_descrizioni_complete:
    instruction: "Write exactly two sentences, each combining two facts: one with *che*, *Il ristorante che abbiamo visitato ieri è vicino a casa*; and one with preposition + *cui*, *La persona con cui lavoro è molto simpatica.*"
    accepted_answers:
      - {value: "Il ristorante che abbiamo visitato ieri è vicino a casa. La persona con cui lavoro è molto simpatica.", status: "correct"}
      - {value: "Il ristorante che abbiamo visitato ieri è vicino a casa La persona con cui lavoro è molto simpatica", status: "correct"}
    feedback: "The two sentences show *che* and preposition + *cui* combining two facts each."
  it.b1.unit51.lesson01.relativo_che.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Il ristorante che abbiamo visitato ieri è vicino a casa. La collega che lavora con Sam è italiana."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
