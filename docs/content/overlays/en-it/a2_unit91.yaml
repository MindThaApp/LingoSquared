course:
  title: "Italian A2"
  description: "Grammar-led A2 Italian: past tenses, future, modal verbs, requests, advice and everyday habits."
  learning_goal: "Use Italian grammar in everyday situations: talk about the past, make predictions, ask permission, say what you can do, make requests, give advice and describe habits."
units:
  it.a2.unit91.cosa_so_fare: {"title": "What can I do?", "description": "Say what you can and cannot do and describe your availability: sapere for skills, potere for possibility, bravo/brava a, libero/libera and occupato/occupata."}
lessons:
  it.a2.unit91.cosa_so_fare.lesson01.so_nuotare: {"title": "I can swim"}
  it.a2.unit91.cosa_so_fare.lesson02.bravo_a: {"title": "I am good at cooking"}
  it.a2.unit91.cosa_so_fare.lesson03.posso_venire: {"title": "I can come on Thursday"}
  it.a2.unit91.cosa_so_fare.lesson04.so_o_posso: {"title": "Know how to or be able to?"}
  it.a2.unit91.cosa_so_fare.lesson05.un_messaggio: {"title": "A message from Giulia"}
  it.a2.unit91.cosa_so_fare.lesson06.giulia_e_luca: {"title": "Giulia and Luca plan a dinner"}
teaching:
  it.a2.unit91.cosa_so_fare.lesson01.teach.abilita: {"title": "Skills", "gloss": "to swim / to cook / to drive / to play the guitar / to speak English / to dance", "note": "*Sapere* + infinitive means 'to know how to'. It is used for skills you have learned.", "example_gloss": ["I can swim.", "Marco can cook.", "Can you drive?", "Luca can play the guitar.", "Giulia can speak English.", "We can dance."]}
  it.a2.unit91.cosa_so_fare.lesson01.teach.gn_sapere: {"title": "Sapere", "gloss": "I know, you know, he/she knows, we know, you (plural) know, they know", "note": "*Sapere* is irregular. Followed by an infinitive it means 'can' in the sense of 'know how to'."}
  it.a2.unit91.cosa_so_fare.lesson01.teach.gn_sai: {"title": "Asking about a skill", "gloss": "Can you swim? Can you drive? Can you dance?", "note": "Ask *Sai* + infinitive to ask about a skill."}
  it.a2.unit91.cosa_so_fare.lesson01.teach.gn_non_so: {"title": "Not being able", "gloss": "I cannot swim. I cannot drive. Marco cannot dance.", "note": "Put *non* before *so/sa* to say you lack a skill."}
  it.a2.unit91.cosa_so_fare.lesson01.teach.risposte: {"title": "Short answers", "gloss": "Yes, I can swim. No, I cannot drive.", "note": "Reply with *so* or *non so* and the infinitive."}
  it.a2.unit91.cosa_so_fare.lesson02.teach.livello: {"title": "How well", "gloss": "well / very well / fairly well / badly / not at all", "note": "These words come after the verb.", "example_gloss": ["I swim very well.", "Marco cooks fairly well.", "Giulia drives badly.", "I cannot dance at all."]}
  it.a2.unit91.cosa_so_fare.lesson02.teach.bravo: {"title": "Good at", "gloss": "good (masc.) / good (fem.) / good (plural) / at cooking / at swimming", "note": "*Bravo* is an adjective and agrees with the person.", "example_gloss": ["Marco is good at cooking.", "Giulia is good at swimming.", "Luca and Marco are good at dancing."]}
  it.a2.unit91.cosa_so_fare.lesson02.teach.gn_bravo: {"title": "Bravo or brava?", "gloss": "I am good at swimming (a man speaking). I am good at swimming (a woman speaking). We are good at dancing.", "note": "*Bravo* (masculine), *brava* (feminine), *bravi* (masculine or mixed plural). The adjective agrees with the subject."}
  it.a2.unit91.cosa_so_fare.lesson02.teach.gn_a_inf: {"title": "Bravo a + infinitive", "gloss": "I am good at cooking. Marco is good at playing the guitar.", "note": "After *bravo* use *a* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson02.teach.gn_sapere_bene: {"title": "Sapere + adverb", "gloss": "I can cook very well. Giulia can swim fairly well.", "note": "Put the adverb after the infinitive or verb phrase."}
  it.a2.unit91.cosa_so_fare.lesson03.teach.giorni: {"title": "Days and times", "gloss": "Thursday / Friday / Saturday / Sunday / the evening / the afternoon / the morning", "note": "Use *giovedì sera* for 'on Thursday evening'.", "example_gloss": ["On Thursday evening I can come.", "On Saturday afternoon I cannot.", "On Sunday morning we are free."]}
  it.a2.unit91.cosa_so_fare.lesson03.teach.liberi: {"title": "Free or busy", "gloss": "free (masc.) / free (fem.) / busy (masc.) / busy (fem.) / tired (masc.) / tired (fem.)", "note": "These adjectives end in -o for a man and -a for a woman.", "example_gloss": ["I am free on Thursday (a man speaking).", "I am free on Thursday (a woman speaking).", "I am busy on Saturday (a man speaking).", "I am busy on Saturday (a woman speaking)."]}
  it.a2.unit91.cosa_so_fare.lesson03.teach.gn_posso: {"title": "Potere for availability", "gloss": "I can come. I cannot come. Can you come?", "note": "Use *potere* for possibility and availability: it depends on the situation, not on a skill."}
  it.a2.unit91.cosa_so_fare.lesson03.teach.gn_perche: {"title": "Giving a reason", "gloss": "I cannot come on Saturday because I have to work.", "note": "*Perché* gives the reason. *Devo* + infinitive says what you have to do."}
  it.a2.unit91.cosa_so_fare.lesson03.teach.gn_puo_piovere: {"title": "Può: it might", "gloss": "Tomorrow it might rain. Marco might arrive late.", "note": "*Può* + infinitive also expresses a possibility: 'it might'."}
  it.a2.unit91.cosa_so_fare.lesson04.teach.gn_contrasto: {"title": "Skill vs possibility", "gloss": "I can drive, but today I cannot drive.", "note": "*Sapere* is about a learned skill; *potere* is about the situation today. Both can be translated as 'can'."}
  it.a2.unit91.cosa_so_fare.lesson04.teach.gn_chitarra: {"title": "The guitar example", "gloss": "I can play the guitar, but tonight I cannot play.", "note": "The skill stays; the possibility changes."}
  it.a2.unit91.cosa_so_fare.lesson04.teach.stasera: {"title": "When", "gloss": "today / tonight / tomorrow / maybe / perhaps", "note": "*Forse* and *magari* make the possibility less sure.", "example_gloss": ["Today I cannot swim.", "Tonight I can cook.", "Maybe I can come tomorrow.", "Maybe Marco can come."]}
  it.a2.unit91.cosa_so_fare.lesson04.teach.gn_stanco: {"title": "Reasons", "gloss": "Today I cannot drive: I am tired (a man speaking). Today I cannot swim: I am tired (a woman speaking).", "note": "Say why you cannot do something with the adjective of the person: *stanco* (masculine), *stanca* (feminine)."}
  it.a2.unit91.cosa_so_fare.lesson04.teach.domande: {"title": "Two questions", "gloss": "Can you swim? Can you swim today?", "note": "The first asks about a skill, the second about today."}
  it.a2.unit91.cosa_so_fare.lesson05.teach.lettura: {"title": "Giulia writes to Luca", "gloss": "Hi Luca! On Thursday evening I am not free: I have to work until eight. But on Friday I can come. I can cook pasta, but I cannot make dessert. Marco can play the guitar and can come at eight. On Saturday I cannot: I am busy. Giulia", "note": "Notice *so* for skills and *posso* for availability."}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d1: {"title": "Luca asks", "gloss": "Luca: Giulia, on Saturday we are having a dinner. Are you free?"}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d2: {"title": "Giulia answers", "gloss": "Giulia: Saturday evening I cannot, I am busy. Sunday yes!"}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d3: {"title": "Luca asks about skills", "gloss": "Luca: All right. Can you cook pasta?"}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d4: {"title": "Giulia explains", "gloss": "Giulia: Yes, I can cook pasta, but I cannot make dessert."}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d5: {"title": "Luca adds", "gloss": "Luca: Marco can play the guitar and can come on Sunday."}
  it.a2.unit91.cosa_so_fare.lesson06.teach.d6: {"title": "Giulia agrees", "gloss": "Giulia: How nice! Then on Sunday I can cook."}
exercises:
  it.a2.unit91.cosa_so_fare.lesson01.exercise01.scegli_so: {"instruction": "Choose the correct Italian sentence.", "correct_option": "So nuotare.", "distractors": ["So nuoto.", "Sai nuotare io.", "So nuotando."], "accepted_answers": [{"value": "So nuotare.", "status": "correct"}], "feedback": "*So* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise02.scegli_sa: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Marco sa cucinare.", "distractors": ["Marco so cucinare.", "Marco sai cucinare.", "Marco sa cucino."], "accepted_answers": [{"value": "Marco sa cucinare.", "status": "correct"}], "feedback": "*Sa* goes with Marco."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise03.abbina_sapere: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "so", "right": "I know how to"}, {"left": "sai", "right": "you know how to"}, {"left": "sa", "right": "he/she knows how to"}, {"left": "sappiamo", "right": "we know how to"}, {"left": "sapete", "right": "you (plural) know how to"}, {"left": "sanno", "right": "they know how to"}], "status": "correct"}], "feedback": "The forms of *sapere* are irregular."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise04.ordina_chitarra: {"instruction": "Put the words in order to say 'Luca can play the guitar.'", "correct_option": "Luca sa suonare la chitarra", "accepted_answers": [{"value": "Luca sa suonare la chitarra", "status": "correct"}], "feedback": "*Sa* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise05.completa_sai: {"instruction": "Complete with the correct form of sapere.", "correct_option": "Sai", "accepted_answers": [{"value": "Sai", "status": "correct"}], "feedback": "A question to a friend uses *sai*."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise06.traduci_inglese: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Giulia sa parlare inglese.", "status": "correct"}, {"value": "Giulia sa parlare inglese", "status": "correct"}], "feedback": "*Sa* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson01.exercise07.scrivi_non_so: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Non so guidare.", "status": "correct"}, {"value": "Non so guidare", "status": "correct"}], "feedback": "*Non so* + infinitive.", "correct_option": "Non so guidare."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise01.scegli_brava: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giulia è brava a nuotare.", "distractors": ["Giulia è bravo a nuotare.", "Giulia è bravi a nuotare.", "Giulia è brava nuotare."], "accepted_answers": [{"value": "Giulia è brava a nuotare.", "status": "correct"}], "feedback": "Giulia is feminine, so *brava*."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise02.scegli_bene: {"instruction": "Choose the correct Italian sentence.", "correct_option": "So nuotare molto bene.", "distractors": ["So molto bene nuotare.", "So nuotare molto buono.", "Sono nuotare molto bene."], "accepted_answers": [{"value": "So nuotare molto bene.", "status": "correct"}], "feedback": "The adverb comes after the infinitive."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise03.abbina_livello: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "molto bene", "right": "very well"}, {"left": "abbastanza bene", "right": "fairly well"}, {"left": "male", "right": "badly"}, {"left": "per niente", "right": "not at all"}, {"left": "bravo a cucinare", "right": "good at cooking (masc.)"}, {"left": "brava a nuotare", "right": "good at swimming (fem.)"}], "status": "correct"}], "feedback": "These words describe how well you do something."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise04.ordina_bravo: {"instruction": "Put the words in order to say 'Marco is good at cooking.'", "correct_option": "Marco è bravo a cucinare", "accepted_answers": [{"value": "Marco è bravo a cucinare", "status": "correct"}], "feedback": "*Bravo* agrees with Marco."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise05.completa_brava: {"instruction": "Complete with the correct form of bravo.", "correct_option": "brava", "accepted_answers": [{"value": "brava", "status": "correct"}], "feedback": "*Brava* is feminine singular."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise06.traduci_bravi: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Luca e Marco sono bravi a ballare.", "status": "correct"}, {"value": "Luca e Marco sono bravi a ballare", "status": "correct"}], "feedback": "The masculine plural is *bravi*."}
  it.a2.unit91.cosa_so_fare.lesson02.exercise07.scrivi_bravo: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono brava a nuotare.", "status": "correct"}, {"value": "Sono brava a nuotare", "status": "correct"}, {"value": "Io sono brava a nuotare.", "status": "correct"}, {"value": "Io sono brava a nuotare", "status": "correct"}], "feedback": "A woman says *brava*.", "correct_option": "Sono brava a nuotare."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise01.scegli_posso: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Giovedì sera posso venire.", "distractors": ["Giovedì sera so venire.", "Giovedì sera potere venire.", "Giovedì sera posso venga."], "accepted_answers": [{"value": "Giovedì sera posso venire.", "status": "correct"}], "feedback": "Use *potere* for availability, not *sapere*."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise02.scegli_libera: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sono libera giovedì.", "distractors": ["Sono libero giovedì.", "Sono liberi giovedì.", "Sono libere giovedì."], "accepted_answers": [{"value": "Sono libera giovedì.", "status": "correct"}], "feedback": "A woman says *libera*."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise03.abbina_giorni: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "giovedì", "right": "Thursday"}, {"left": "venerdì", "right": "Friday"}, {"left": "sabato", "right": "Saturday"}, {"left": "domenica", "right": "Sunday"}, {"left": "la sera", "right": "the evening"}, {"left": "il pomeriggio", "right": "the afternoon"}], "status": "correct"}], "feedback": "Days and parts of the day."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise04.ordina_non_posso: {"instruction": "Put the words in order to say 'On Saturday I cannot come.'", "correct_option": "Sabato non posso venire", "accepted_answers": [{"value": "Sabato non posso venire", "status": "correct"}], "feedback": "*Non posso* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise05.completa_occupata: {"instruction": "Complete with the correct form of occupato (a woman speaking).", "correct_option": "occupata", "accepted_answers": [{"value": "occupata", "status": "correct"}], "feedback": "A woman says *occupata*."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise06.traduci_perche: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Non posso venire sabato perché devo lavorare.", "status": "correct"}, {"value": "Non posso venire sabato perché devo lavorare", "status": "correct"}, {"value": "Sabato non posso venire perché devo lavorare.", "status": "correct"}, {"value": "Sabato non posso venire perché devo lavorare", "status": "correct"}], "feedback": "*Perché* introduces the reason."}
  it.a2.unit91.cosa_so_fare.lesson03.exercise07.scrivi_libero: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "Sono libero venerdì.", "status": "correct"}, {"value": "Sono libero venerdì", "status": "correct"}, {"value": "Io sono libero venerdì.", "status": "correct"}, {"value": "Io sono libero venerdì", "status": "correct"}, {"value": "Venerdì sono libero.", "status": "correct"}, {"value": "Venerdì sono libero", "status": "correct"}], "feedback": "A man says *libero*.", "correct_option": "Sono libero venerdì."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise01.scegli_sai: {"instruction": "Choose the correct Italian sentence.", "correct_option": "Sai suonare la chitarra?", "distractors": ["Puoi suonare la chitarra?", "Sai suoni la chitarra?", "Sapere suonare la chitarra?"], "accepted_answers": [{"value": "Sai suonare la chitarra?", "status": "correct"}], "feedback": "*Sai* asks about a skill."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise02.scegli_non_posso: {"instruction": "Choose the correct Italian sentence.", "correct_option": "So guidare, ma oggi non posso guidare.", "distractors": ["So guidare, ma oggi non so guidare.", "So guidare, ma oggi non potere guidare.", "Posso guidare, ma oggi non guidare."], "accepted_answers": [{"value": "So guidare, ma oggi non posso guidare.", "status": "correct"}], "feedback": "The skill uses *so*, today's situation uses *posso*."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise03.abbina_contrasto: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "So nuotare.", "right": "I know how to swim."}, {"left": "Oggi non posso nuotare.", "right": "Today I cannot swim."}, {"left": "Stasera posso cucinare.", "right": "Tonight I can cook."}, {"left": "Forse posso venire domani.", "right": "Maybe I can come tomorrow."}, {"left": "Sono stanca.", "right": "I am tired (a woman speaking)."}, {"left": "Sono stanco.", "right": "I am tired (a man speaking)."}], "status": "correct"}], "feedback": "Skill, possibility and reasons."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise04.ordina_oggi: {"instruction": "Put the words in order to say 'Today I cannot swim.'", "correct_option": "Oggi non posso nuotare", "accepted_answers": [{"value": "Oggi non posso nuotare", "status": "correct"}], "feedback": "*Oggi* sets the day."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise05.completa_so: {"instruction": "Complete with so or posso.", "correct_option": "So", "accepted_answers": [{"value": "So", "status": "correct"}], "feedback": "The skill uses *so*."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise06.traduci_stanco: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Oggi non posso guidare: sono stanco.", "status": "correct"}, {"value": "Oggi non posso guidare sono stanco", "status": "correct"}, {"value": "Oggi non posso guidare, sono stanco.", "status": "correct"}, {"value": "Oggi non posso guidare perché sono stanco.", "status": "correct"}, {"value": "Oggi non posso guidare perché sono stanco", "status": "correct"}], "feedback": "A man says *stanco*."}
  it.a2.unit91.cosa_so_fare.lesson04.exercise07.scrivi_stasera: {"instruction": "Write the requested Italian sentence.", "accepted_answers": [{"value": "So suonare la chitarra, ma stasera non posso.", "status": "correct"}, {"value": "So suonare la chitarra ma stasera non posso", "status": "correct"}], "feedback": "*So* is the skill, *non posso* is tonight.", "correct_option": "So suonare la chitarra, ma stasera non posso."}
  it.a2.unit91.cosa_so_fare.lesson05.exercise01.leggi_giovedi: {"instruction": "Read the text and choose the answer.", "correct_option": "She has to work.", "distractors": ["She is tired.", "She is cooking.", "She is at the sea."], "accepted_answers": [{"value": "She has to work.", "status": "correct"}], "feedback": "*Devo lavorare fino alle otto.*"}
  it.a2.unit91.cosa_so_fare.lesson05.exercise02.leggi_marco: {"instruction": "Read the text and choose the answer.", "correct_option": "Play the guitar and come at eight.", "distractors": ["Cook pasta and come at nine.", "Make dessert.", "Drive Giulia home."], "accepted_answers": [{"value": "Play the guitar and come at eight.", "status": "correct"}], "feedback": "*Sa suonare la chitarra e può venire alle otto.*"}
  it.a2.unit91.cosa_so_fare.lesson05.exercise03.abbina_lettura: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Non sono libera giovedì.", "right": "I am not free on Thursday."}, {"left": "Posso venire venerdì.", "right": "I can come on Friday."}, {"left": "So cucinare la pasta.", "right": "I can cook pasta."}, {"left": "Non so fare il dolce.", "right": "I cannot make dessert."}, {"left": "Marco sa suonare la chitarra.", "right": "Marco can play the guitar."}, {"left": "Sabato sono occupata.", "right": "On Saturday I am busy."}], "status": "correct"}], "feedback": "These sentences come from Giulia's message."}
  it.a2.unit91.cosa_so_fare.lesson05.exercise04.ordina_pasta: {"instruction": "Put the words in order to say 'I can cook pasta.'", "correct_option": "So cucinare la pasta", "accepted_answers": [{"value": "So cucinare la pasta", "status": "correct"}], "feedback": "*So* + infinitive."}
  it.a2.unit91.cosa_so_fare.lesson05.exercise05.traduci_occupata: {"instruction": "Translate into Italian.", "accepted_answers": [{"value": "Sabato non posso: sono occupata.", "status": "correct"}, {"value": "Sabato non posso sono occupata", "status": "correct"}, {"value": "Sabato non posso, sono occupata.", "status": "correct"}, {"value": "Sabato non posso perché sono occupata.", "status": "correct"}, {"value": "Sabato non posso perché sono occupata", "status": "correct"}], "feedback": "A woman says *occupata*."}
  it.a2.unit91.cosa_so_fare.lesson05.exercise06.detta_venerdi: {"instruction": "Type what you hear.", "correct_response": "Venerdì posso venire.", "orthography_strict": true, "feedback": "You heard *Venerdì posso venire.*"}
  it.a2.unit91.cosa_so_fare.lesson05.exercise07.detta_chitarra: {"instruction": "Type what you hear.", "correct_response": "Marco sa suonare la chitarra.", "orthography_strict": true, "feedback": "You heard *Marco sa suonare la chitarra.*"}
  it.a2.unit91.cosa_so_fare.lesson06.exercise01.capisci_sabato: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "No, she is busy.", "distractors": ["Yes, at eight.", "Only after dinner.", "Yes, she will cook."], "accepted_answers": [{"value": "No, she is busy.", "status": "correct"}], "feedback": "She says *sabato sera non posso*."}
  it.a2.unit91.cosa_so_fare.lesson06.exercise02.capisci_dolce: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Make dessert.", "distractors": ["Cook pasta.", "Play the guitar.", "Drive."], "accepted_answers": [{"value": "Make dessert.", "status": "correct"}], "feedback": "She says *non so fare il dolce*."}
  it.a2.unit91.cosa_so_fare.lesson06.exercise03.abbina_dialogo: {"instruction": "Match each Italian expression to its English meaning.", "accepted_answers": [{"value": [{"left": "Sei libera?", "right": "Are you free? (to a woman)"}, {"left": "Sabato non posso.", "right": "On Saturday I cannot."}, {"left": "Sai cucinare la pasta?", "right": "Can you cook pasta?"}, {"left": "Non so fare il dolce.", "right": "I cannot make dessert."}, {"left": "Marco sa suonare la chitarra.", "right": "Marco can play the guitar."}, {"left": "Domenica posso cucinare io.", "right": "On Sunday I can cook."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  it.a2.unit91.cosa_so_fare.lesson06.exercise04.ordina_domenica: {"instruction": "Put the words in order to say 'On Sunday I can cook.'", "correct_option": "Domenica posso cucinare io", "accepted_answers": [{"value": "Domenica posso cucinare io", "status": "correct"}], "feedback": "*Posso* is about Sunday."}
