teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Animale* is the general word; *animale domestico* means a pet (literally a domestic animal).'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Giulia has a dog.
    - Luca has a cat.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: '*Hai ...?* is the *tu* form of *avere*. Only the tone of voice turns the statement into a question.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: 'To say you don''t have something, put *non* before the verb: *non ho*. See the grammar note.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non before the verb
    gloss: 'To say you do not have something, put non before the verb: Non ho tempo, Non ho animali domestici.'
    note: 'After *non ho* the noun usually has no article: *non ho tempo*, *non ho animali*. English uses ''any'' or ''no'' here.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*Portare a spasso* is a fixed phrase for walking an animal. The pronoun goes before the verb: *lo porto a spasso*.'
    example_gloss: I walk the dog every day.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Pronouns go before the verb
    gloss: 'The pronoun lo replaces the dog and goes before the verb: lo porto a spasso, gli do da mangiare.'
    note: 'English puts the pronoun after the verb (''I walk him''); Italian puts *lo* and *gli* in front: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: To play with
    gloss: to play with
    example_gloss: Luca plays with his cat.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: '*Ogni giorno* (every day) goes at the end of the sentence, as in *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: '*Dare da mangiare* (to feed) is literally ''to give to eat''. *Do* is the *io* form of *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Plural: il cane -> i cani'
    gloss: 'The plural changes the last vowel and the article: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: The regular Italian plural pattern, introduced here for the first time with animal nouns as the example set.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Marco loves dogs.
    - Chiara loves cats.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: I love animals
    gloss: I love animals.
    note: '*Amare* (to love) takes its object directly: *amo gli animali*. The plural noun needs the plural article *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara loves cats, but has no pet
    gloss: Chiara loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco asks about a pet
    gloss: 'Marco: Do you have a pet, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia has a dog
    gloss: 'Giulia: Yes, I have a dog.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco asks what it looks like
    gloss: 'Marco: What does he look like?'
    note: '*Com''è?* works for animals too. The answer uses *è* or *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia describes her dog
    gloss: 'Giulia: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Animals are masculine or feminine
    gloss: 'An animal is masculine or feminine like a person: il cane is lui, la gatta is lei.'
    note: 'Italian has no ''it'': every noun is masculine or feminine, so a dog is *lui* and a cat is *lei*, and the pronouns follow (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco asks about walks
    gloss: 'Marco: Do you walk him every day?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia describes her routine
    gloss: 'Giulia: Yes, I walk him every day and I feed him.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara, and Luca on animals
    gloss: 'Marco and Chiara both love animals, but neither of them has a pet. Marco loves dogs and Chiara loves cats. Luca does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      amano: love
      entrambi: both
      animali: animals
      due: two (nessuno dei due = neither of them)
      domestico: domestic (animale domestico = pet)
      cani: dogs
      gatti: cats
      gatto: cat
      gioca: plays
      dà: gives
      ogni: every
      mangiare: to eat (dare da mangiare = to feed)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca often plays with his cat
    gloss: Luca often plays with his cat.
    note: '*Spesso* (often) goes after the verb: *gioca spesso*. *Giocare con* means to play with.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia asks Nina
    gloss: 'Giulia: Nina, do you have a pet too?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Si chiama Pico* means his name is Pico, literally ''he calls himself Pico''.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco reacts
    gloss: 'Marco: How nice! What do you do with him every day?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco loves birds too
    gloss: 'Marco: I love birds too.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia closes the conversation
    gloss: 'Giulia: Nice that the three of us love animals!'
    note: A closing line that ties together the animal facts of all three characters.
