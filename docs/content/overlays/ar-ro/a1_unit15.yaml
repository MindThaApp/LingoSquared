answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: الرومانية A1
  description: التعامل مع رحلة قطار بسيطة بالرومانية -- Tren (قطار)، Bilet (تذكرة)، Peron (رصيف)، وPleacă (يغادر) -- بينما يستقل Mihai قطارًا إلى București وتودّعه Ana في gară.
units:
  ro.a1.unit15.travel:
    title: السفر
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: القطار يغادر
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: تذكرة، من فضلك
  ro.a1.unit15.lesson03.la_gara:
    title: في محطة القطار
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'تذكير: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (محطة قطار) · este (يكون) · la (في/إلى) · ce (ماذا/أي) · oră (ساعة) · ora (الساعة) · nouă (تسع)
    note: كلمة Gară من الوحدة 8/الوحدة 9؛ أما este/la/ce/oră/ora/nouă فمن الوحدة 4 (الوقت) -- تعيد هذه الوحدة استعمال نمط "la ce oră"/"la ora nouă" من الوحدة 4 لغرض جديد، هو السؤال عن قطار بدل السؤال عن حصة.
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: قطار
    gloss: Tren (قطار)
    note: 'اسم محايد ينتهي بحرف ساكن (في المفرد تتصرف الأسماء المحايدة مثل المذكرة: *un tren*) -- يأخذ *-ul* للتعريف «القطار»، وهي النهاية نفسها في *magazin*->*magazinul*؛ أما الأسماء المنتهية بـ *-ă* مثل *gară* فتأخذ *-a* بدلًا منها (*gara*).'
    example_gloss:
    - القطار في المحطة.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: يغادر / ينطلق
    gloss: يغادر / تغادر
    note: الفعل الذي يُقال لمغادرة القطار أو الحافلة أو الطائرة. *Trenul pleacă* -- لا حاجة إلى *este* لأن *pleacă* فعل تام بذاته.
    example_gloss:
    - يغادر القطار.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: يغادر القطار في الساعة التاسعة
    gloss: Trenul pleacă la ora nouă. (يغادر القطار في الساعة التاسعة.)
    note: يجمع بين *trenul* و*pleacă* مع عبارة *la ora nouă* من الوحدة 4 نفسها -- دون حاجة إلى مفردات جديدة للوقت.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: متى يغادر القطار؟
    gloss: La ce oră pleacă trenul? (في أي ساعة يغادر القطار؟)
    note: صيغة السؤال *La ce oră...?* من الوحدة 4، نسأل بها الآن عن *trenul* بدل الحصة الدراسية.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: الرصيف
    gloss: رصيف
    note: رصيف المحطة التي يقف عندها القطار. اسم محايد ينتهي بحرف ساكن، لذا تكون صيغة «الرصيف» *peronul* -- بالنهاية *-ul* نفسها كما في *tren*->*trenul*.
    example_gloss:
    - القطار عند الرصيف رقم ثلاثة.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: من أي رصيف يغادر القطار؟
    gloss: De la ce peron pleacă trenul? (من أي رصيف يغادر القطار؟)
    note: '*De la* (من) + *ce peron* (أي رصيف) -- كل كلمة هنا سبق تعلّمها، وقد جُمعت الآن في سؤال جديد.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'تذكير: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (أودّ) · vă rog (من فضلك، بصيغة المخاطب المحترم) · cât costă (كم يكلّف) · costă (يكلّف) · lei (ليو، العملة)
    note: كلها من الوحدة 6 (الطعام) والوحدة 7 (التسوق) -- تعيد هذه الوحدة استخدام لغة الطلب المهذّب والأسعار نفسها لشراء تذكرة قطار بدل الطعام.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: التذكرة
    gloss: تذكرة
    note: تذكرة القطار. اسم محايد (يأخذ *un* في المفرد مثل المذكر)، لذا تكون «تذكرة» *un bilet*.
    example_gloss:
    - لديّ تذكرة.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: بوخارست
    gloss: بوخارست
    note: عاصمة رومانيا -- وهي الوجهة الطبيعية التي نستخدمها مثالًا في هذه الدورة.
    example_gloss:
    - يغادر القطار متجهًا إلى بوخارست.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: أودّ تذكرة إلى بوخارست، من فضلك
    gloss: Aș dori un bilet la București, vă rog. (أودّ تذكرة إلى بوخارست، من فضلك.)
    note: صيغة المجاملة *Aș dori... vă rog* من الوحدة 6 والوحدة 7، نطلب بها الآن تذكرة بدل الطعام.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: كم تكلّف تذكرة إلى بوخارست؟
    gloss: Cât costă un bilet la București? (كم تكلّف تذكرة إلى بوخارست؟)
    note: سؤال السعر *Cât costă...?* من الوحدة 7، نسأل به الآن عن تذكرة بدل كيلوغرام من البطاطا.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: تكلّف أربعين ليو
    gloss: Costă patruzeci de lei. (تكلّف أربعين ليو.)
    note: العدد Zece (عشرة) ضمن المدى 2-19، فلا حاجة إلى *de* قبل *lei* -- وهي القاعدة نفسها التي مرّت في الوحدة 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'تذكير: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (قطار) · pleacă (يغادر) · peron (رصيف) · bilet (تذكرة) · București (بوخارست) · trei (ثلاثة، من الوحدة 2) · am (لديّ، من الوحدة 2)
    note: الكلمات tren وpleacă وperon وbilet وBucurești من درسَي هذه الوحدة، أما trei وam فتُعاد هنا من الوحدة 2 (الأعداد)، لأن Ana وMihai يستخدمان الآن «peronul trei» و«am un bilet» معًا في المحطة.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'تذكير: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · Ana, Mihai (اسمان)
    note: كلها وردت في وحدات سابقة -- وهي نمط الافتتاح والختام الودّي نفسه الذي اتبعته كل حوارات هذه الدورة.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: رحلة سعيدة
    gloss: رحلة سعيدة / سفرًا موفقًا
    note: عبارة وداع ثابتة تُقال لمن هو على وشك السفر -- معناها الحرفي «طريق طيب»، وتُستعمل كما نقول في العربية «رحلة سعيدة» أو «سفرًا موفقًا».
    example_gloss:
    - رحلة سعيدة يا Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: التحية والسؤال عن القطار
    gloss: تحيّي Ana صديقها Mihai وتسأله في أي ساعة يغادر القطار.
    note: يعيد سؤال الدرس الأول من هذه الوحدة، لكنه يُوجَّه الآن إلى Mihai مباشرة.
  ro.a1.unit15.lesson03.teach.line02:
    title: ذكر موعد المغادرة
    gloss: يقول Mihai إن القطار يغادر في الساعة التاسعة.
    note: يعيد عبارة الدرس الأول من هذه الوحدة كما هي.
  ro.a1.unit15.lesson03.teach.line03:
    title: السؤال عن الرصيف
    gloss: تسأل Ana من أي رصيف.
    note: سؤال متابعة قصير -- سبق أن طُرح *de la ce peron* كاملًا في الدرس الأول؛ وهنا تسأله Ana باختصار، وتنتظر من Mihai أن يكمل الباقي.
  ro.a1.unit15.lesson03.teach.line04:
    title: ذكر الرصيف والتذكرة
    gloss: يقول Mihai إنه الرصيف رقم ثلاثة، وإن لديه تذكرة إلى بوخارست.
    note: يجمع مفردات peron وbilet وBucurești من هذه الوحدة في جواب واحد.
  ro.a1.unit15.lesson03.teach.line05:
    title: تمنّي سفر سعيد والوداع
    gloss: تتمنى Ana لـ Mihai رحلة سعيدة وتودّعه.
    note: يستعمل عبارة *Drum bun* من هذا الدرس -- وداع خاص بالسفر بدل *la revedere* وحدها كما اعتدنا في الدورة.
  ro.a1.unit15.lesson03.teach.line06:
    title: شكرها والوداع
    gloss: يشكر Mihai صديقته Ana ويودّعها.
    note: نمط الختام نفسه الذي انتهت به حوارات الوحدات السابقة كلها.
