teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*Sun* هي صيغة *eu* من الفعل *a suna* («يتصل»)؛ ويأتي *te* («أنتَ») قبل الفعل، وتستعمل الرومانية المضارع هنا للتعبير عن اتصال قريب سيحدث.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: الرد على الهاتف
    gloss: مرحبًا، معك Ana.
    note: تُقال *Alo* عند الرد على الهاتف؛ و*sunt* + الاسم تعرّف بنفسك، مثل «معك فلان» في العربية.
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai يرد بالطريقة نفسها
    gloss: مرحبًا، معك Mihai.
    note: النمط نفسه *Alo, sunt* + الاسم كما في *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*Cu cine vorbesc?* (حرفيًا «مع من أتحدث؟») هي الطريقة المعتادة لسؤال متصل لا تعرفه.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: التعريف بنفسك بصيغة رسمية
    gloss: أنت تتحدث مع Ana.
    note: '*Vorbiți cu* + الاسم هو الجواب الرسمي: *vorbiți* هي صيغة *dumneavoastră* من الفعل *a vorbi* («يتحدث»).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*Poți să* ... («هل تستطيع ...؟») ثم *repeți* («تكرر») ثم *asta* («هذا»).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*Nu vorbi* («لا تتحدث») هي *nu* + صيغة *tu*؛ و*atât de repede* تعني «بهذه السرعة».'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: '*Nu te aud bine*: تعني *aud* «أسمع»، ويأتي *te* («أنتَ») قبل الفعل، وتعني *bine* «جيدًا».'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: '*Mesaj* مذكر في المفرد ومؤنث في الجمع (*un mesaj*، *două mesaje*)؛ وتلتصق أداة التعريف بآخر الكلمة: *mesajul*.'
    example_gloss: الرسالة النصية من Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة.
    note: '*Îți* («لك») ضمير للمفعول به غير المباشر يوضع قبل الفعل: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: 'تأتي *Înapoi* («عائدًا») بعد الفعل: *te sun înapoi* تعني «سأعاود الاتصال بك»، وتعني *mai târziu* «لاحقًا».'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: قراءة محادثة نصية
    gloss: 'Mihai: مرحبًا Ana، هل يمكنك الاتصال بي؟ يجب أن أخبرك بشيء. Ana: نعم بالتأكيد، سأعاود الاتصال بك بعد خمس دقائق.'
    note: تتبّع ما يطلبه Mihai، ولماذا، ومتى تقول Ana إنها ستعاود الاتصال.
    glosses:
      Salut: مرحباً
      poți: تستطيع
      suna: الاتصال
      Trebuie: يجب أن / عليّ
      ceva: شيء ما
      spun: أخبر
      sigur: بالطبع
      sun: الاتصال
      cinci: خمسة
      minute: دقائق
      înapoi: أعيد
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai يرد على المكالمة
    gloss: 'Mihai: مرحبًا، معك Mihai.'
    note: 'نمط *Alo, sunt* + الاسم نفسه من الدرس الأول، يُستعمل الآن في المكالمة الفعلية: من يرد على الهاتف يتكلم أولًا ويذكر اسمه.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana تعرّف بنفسها
    gloss: 'Ana: مرحبًا Mihai، معك Ana. Mihai: ما أجمل أنك تتصلين!'
    note: '*Ce bine că* ... («ما أجمل أن ...») تعبّر عن ردّ فعل إيجابي تجاه حدث ما؛ و*suni* هي صيغة *tu* من الفعل *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana تسأل عن المناوبة
    gloss: 'Ana: كيف كانت مناوبتك الأولى؟'
    note: تعني *A fost* «كان/كانت» (ماضي *a fi*). وهي صيغة الماضي المركّب، مبنية مثل *am mâncat*؛ انظر الملاحظة بعد السطر التالي.
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai يزف خبرًا سارًّا
    gloss: 'Mihai: سارت الأمور على ما يرام، أفضل مما كنت أظن.'
    note: '*A mers* هي صيغة الماضي من *a merge* («يذهب»، وتعني هنا «سارت الأمور»)؛ وتعني *credeam* «كنت أظن» (صيغة ماضٍ من *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'صيغ الماضي: a fost, a mers, credeam'
    gloss: كان ← يكون، ذهب ← يذهب، ظنّ ← يظن
    note: '*A fost* و*a mers* من صيغ الماضي المركّب (*a* + الصيغة الماضية للفعل)، أما *credeam* فمن الماضي المستمر. احفظها الآن كعبارات ثابتة في السياقات التي وردت فيها في هذا الدرس؛ أما قواعد الماضي كاملة فتأتي في مستوى لاحق.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana فخورة
    gloss: 'Ana: كم يسعدني سماع ذلك! أنا فخورة بك.'
    note: '*Mândră de* («فخورة بـ») تركيب ثابت؛ ولا بد من *de*. والرجل يقول *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai متأثر
    gloss: 'Mihai: شكرًا لك، هذا يعني لي الكثير.'
    note: '*Înseamnă* هي صيغة الغائب المفرد (هو/هي/هذا) من *a însemna* («يعني»)؛ و*pentru mine* («بالنسبة لي») تبيّن من يهمّه الأمر.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: 'تعني *Lui* بعد الاسم «له»: *prima lui tură*. (وللمؤنث تُستعمل *ei*.)'
