course:
  title: الرومانية A1
  description: 'التعرّف على الأماكن الشائعة وتحديد مواقعها بالرومانية: السؤال Unde este...? (أين...؟)، والقول إن المكان aproape (قريب) أو departe (بعيد)، واستعمال lângă (بجانب) وvizavi de (مقابل) وîntre (بين) لوصف حيّ بسيط، مع متابعة آنا وميهاي وهما يتحدثان عن التنقّل في المدينة.'
