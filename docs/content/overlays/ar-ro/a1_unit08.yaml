teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'تذكير: unde، este'
    gloss: unde (أين) · este (هو / هي)
    note: 'سبق أن ظهرت الكلمتان: *unde* في *Unde pot să cumpăr ...?* في الوحدة 7، و*este* منذ الوحدة 3 والوحدة 4. وهنا تجتمعان في سؤال الموقع الأساسي لهذه الوحدة.'
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: أين...؟
    gloss: Unde este...? (أين...؟)
    note: 'الطريقة اليومية للسؤال عن مكان شيء: أضف اسم المكان بعد *este*، أو استعملها وحدها هكذا حين يكون المكان واضحًا من السياق.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: محطة القطار، متجر، مصرف
    gloss: gară (محطة القطار) · magazin (متجر) · bancă (مصرف)
    note: 'ثلاثة أماكن شائعة، وكلها تأخذ أداة التعريف عند الحديث عن مكان محدد معروف: *gara*، *magazinul*، *banca*.'
    example_gloss:
    - أين محطة القطار؟
    - المتجر قريب.
    - المصرف بعيد.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: قريب، بعيد
    gloss: aproape (قريب) · departe (بعيد)
    note: طريقة بسيطة لوصف قرب المكان أو بعده دون إعطاء اتجاهات دقيقة.
    example_gloss:
    - المتجر قريب.
    - المصرف بعيد.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: المتجر قريب
    gloss: Magazinul este aproape. (المتجر قريب.)
    note: جملة قصيرة تامّة؛ لا حاجة إلى اسم مكان بعد *aproape* حين يكون المقصود واضحًا.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: المصرف بعيد
    gloss: Banca este departe. (المصرف بعيد.)
    note: عكس *aproape*، وبالنمط البسيط نفسه.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: أين محطة القطار؟
    gloss: Unde este gara? (أين محطة القطار؟)
    note: تجمع *Unde este...?* و*gara* في سؤال كامل واحد.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: مستشفى، مكتب بريد، مكتبة، موقف حافلات
    gloss: spital (مستشفى) · poștă (مكتب بريد) · bibliotecă (مكتبة) · stație de autobuz (موقف حافلات)
    note: 'أربعة أماكن شائعة أخرى؛ وكما في gară/magazin/bancă، تأخذ أداة التعريف للمكان المحدد: *spitalul*، *poșta*، *biblioteca*، *stația de autobuz*.'
    example_gloss:
    - المستشفى مقابل المتجر.
    - مكتب البريد بين المتجر والمستشفى.
    - المكتبة قريبة من محطة القطار.
    - موقف الحافلات بجانب المكتبة.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: بجانب، مقابل، بين
    gloss: lângă (بجانب) · vizavi de (مقابل / في الجهة المقابلة) · între (بين)
    note: ثلاث طرق لتحديد موقع مكان بالنسبة إلى مكان آخر. تحتاج *vizavi de* إلى *de* وتحتاج *între* إلى *și* للربط بالمكان الثاني، أما *lângă* فتتصل به مباشرة.
    example_gloss:
    - المتجر بجانب محطة القطار.
    - المستشفى مقابل المتجر.
    - مكتب البريد بين المتجر والمستشفى.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: المتجر بجانب محطة القطار
    gloss: Magazinul este lângă gară. (المتجر بجانب محطة القطار.)
    note: تتصل *Lângă* مباشرة باسم المكان دون كلمة إضافية.
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: المستشفى مقابل المتجر
    gloss: Spitalul este vizavi de magazin. (المستشفى مقابل المتجر.)
    note: تحتاج *Vizavi de* إلى *de* قبل المكان الثاني.
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: مكتب البريد بين المتجر والمستشفى
    gloss: Poșta este între magazin și spital. (مكتب البريد بين المتجر والمستشفى.)
    note: تأتي *Între* مع مكانين يربط بينهما *și* (و).
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: موقف الحافلات بجانب المكتبة
    gloss: Stația de autobuz este lângă bibliotecă. (موقف الحافلات بجانب المكتبة.)
    note: نمط *lângă* نفسه كما في المتجر ومحطة القطار، وهنا مع موقف الحافلات والمكتبة.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'تذكير: bună، mulțumesc، la revedere، da، Ana، Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · da (نعم) · Ana, Mihai (اسمان)
    note: كلها وردت في الوحدات السابقة؛ وهنا تلتقي آنا وميهاي من جديد، في الحيّ هذه المرة.
  ro.a1.unit08.lesson03.teach.line01:
    title: التحية والسؤال عن مكتب البريد
    gloss: تحيّي آنا ميهاي وتسأله أين مكتب البريد.
    note: تجمع *Unde este* من هذه الوحدة مع تحية الوحدة 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: تحديد الموقع
    gloss: يقول ميهاي إن مكتب البريد بين المتجر والمستشفى.
    note: تعيد استعمال تركيب *poșta* و*între ... și* من هذه الوحدة.
  ro.a1.unit08.lesson03.teach.line03:
    title: السؤال عن المكتبة
    gloss: تسأل آنا هل المكتبة قريبة.
    note: سؤال متابعة قصير يعيد استعمال *este* و*aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: التأكيد وإضافة معلومة
    gloss: يؤكد ميهاي أن المكتبة قريبة من محطة القطار، ويضيف أن موقف الحافلات بجانب المكتبة.
    note: يجمع بين *aproape de* و*lângă*، وكلاهما من حروف الجر في هذه الوحدة، في سطر واحد.
  ro.a1.unit08.lesson03.teach.line05:
    title: الشكر والختام
    gloss: تشكر آنا ميهاي وتودّعه.
    note: '*Mulțumesc* هنا شكر ختامي بسيط، وهي الكلمة نفسها في *Bine, mulțumesc.* من الوحدة 1.'
  ro.a1.unit08.lesson03.teach.line06:
    title: ختام اللقاء
    gloss: يرد ميهاي بالوداع مستعملًا اسم آنا.
    note: نمط الختام الودّي نفسه الذي انتهت به حوارات الوحدات 1 و5 و6 و7.
