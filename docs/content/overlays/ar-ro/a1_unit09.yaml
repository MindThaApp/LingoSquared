teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'تذكير: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (أين) · este (يكون / هو) · gară (محطة القطار) · magazin (متجر) · bancă (مصرف) · aproape (قريب)
    note: كلها مألوفة سابقًا -- unde منذ الوحدة 7، و este منذ الوحدتين 3 و4، و gară و magazin و bancă و aproape منذ الوحدة 8 -- وهنا تجتمع في أسئلة الاتجاهات وأمثلتها في هذه الوحدة.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: كيف يمكنني الوصول إلى...؟
    gloss: Cum pot să ajung...? (كيف يمكنني الوصول إلى...؟)
    note: الطريقة اليومية للسؤال عن كيفية الوصول إلى مكان -- ظهرت *pot* (أستطيع) سابقًا في *Unde pot să cumpăr...?* في الوحدة 7؛ أما *ajung* (أصل) فجديدة.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: اذهب
    gloss: Mergeți (اذهب -- أمر بصيغة رسمية)
    note: '*Mergeți* صيغة أمر بمستوى dumneavoastră -- الطريقة المهذبة لقول «اذهب» لشخص ما، وهي تناسب طريقة حديث Ana و Mihai مع بعضهما.'
    example_gloss:
    - اذهب مباشرةً.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: إلى الأمام مباشرة
    gloss: înainte (إلى الأمام)
    note: تُستعمل مع *Mergeți* لتكوين أبسط اتجاه ممكن.
    example_gloss:
    - اذهب مباشرةً.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: اذهب مباشرة
    gloss: Mergeți înainte. (اذهب مباشرةً.)
    note: اتجاه قصير وكامل -- أبسط جواب ممكن عن *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: كيف يمكنني الوصول إلى محطة القطار؟
    gloss: Cum pot să ajung la gară? (كيف يمكنني الوصول إلى محطة القطار؟)
    note: 'تجمع *Cum pot să ajung...?* و *gară* في سؤال كامل واحد -- و *la* (إلى) تربط السؤال بالوجهة. وبعد *la* يبقى المكان بصيغته البسيطة: *la gară* لا *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: كيف يمكنني الوصول إلى المصرف؟
    gloss: Cum pot să ajung la bancă? (كيف يمكنني الوصول إلى المصرف؟)
    note: النمط نفسه، لكن مع المصرف -- وهو سؤال طبيعي، لأن الوحدة 8 بيّنت سابقًا أن المصرف بعيد.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: إلى اليمين، إلى اليسار
    gloss: la dreapta (إلى اليمين) · la stânga (إلى اليسار)
    note: 'الانعطافتان الأساسيتان -- تعلّم كل واحدة منهما عبارةً ثابتة مع *la* (إلى): *la dreapta*، *la stânga*.'
    example_gloss:
    - اذهب إلى اليمين.
    - اذهب إلى اليسار.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: اذهب إلى اليمين
    gloss: Mergeți la dreapta. (اذهب إلى اليمين.)
    note: أمر *Mergeți* نفسه كما في *Mergeți înainte.*، لكن مع انعطاف بدل الاتجاه المباشر.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: اذهب إلى اليسار
    gloss: Mergeți la stânga. (اذهب إلى اليسار.)
    note: الانعطاف المعاكس -- بالنمط البسيط نفسه.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: هنا، هناك
    gloss: aici (هنا) · acolo (هناك)
    note: طريقة بسيطة لتحديد مكان شيء ما حين تصل أو حين تراه، وهي تختلف عن aproape/departe في الوحدة 8 اللتين تصفان المسافة لا الموضع.
    example_gloss:
    - المتجر هنا.
    - محطة القطار هناك.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: المتجر هنا
    gloss: Magazinul este aici. (المتجر هنا.)
    note: جملة قصيرة وكاملة -- تشير *aici* إلى شيء في المكان الذي أنت فيه.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: محطة القطار هناك
    gloss: Gara este acolo. (محطة القطار هناك.)
    note: تشير *Acolo* إلى شيء مرئي لكنه ليس في مكانك تمامًا -- وهي الطريقة الطبيعية لإنهاء سلسلة من الاتجاهات.
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'تذكير: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · da (نعم) · Ana, Mihai (اسمان)
    note: كلها مألوفة من الوحدات السابقة -- وهنا تسأل Ana السيد Mihai عن الاتجاهات.
  ro.a1.unit09.lesson03.teach.apoi:
    title: ثم
    gloss: apoi (ثم / بعد ذلك)
    note: تربط خطوتين من الاتجاهات في تعليمة واحدة -- وهي الطريقة الطبيعية لإعطاء أكثر من خطوة دفعة واحدة.
    example_gloss:
    - اذهب مباشرةً، ثم إلى اليمين.
  ro.a1.unit09.lesson03.teach.line01:
    title: التحية والسؤال عن كيفية الوصول إلى محطة القطار
    gloss: تحيّي Ana السيد Mihai وتسأله كيف تصل إلى محطة القطار.
    note: تجمع *Cum pot să ajung* من هذه الوحدة مع تحية الوحدة 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: إعطاء خطوتين من الاتجاهات
    gloss: يقول Mihai إنه عليها أن تذهب مباشرةً ثم إلى اليمين.
    note: يعيد استعمال *Mergeți înainte* و *la dreapta* من هذه الوحدة، ويربطهما بـ *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: السؤال عمّا إذا كان المكان قريبًا
    gloss: تسأل Ana هل محطة القطار قريبة.
    note: سؤال متابعة قصير يعيد استعمال *este* و *aproape* من الوحدة 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: التأكيد والإشارة إلى المكان
    gloss: يؤكد Mihai أنها قريبة ويشير إلى أن محطة القطار هناك.
    note: يجمع *aproape* و *acolo* -- المسافة والموضع -- في سطر واحد.
  ro.a1.unit09.lesson03.teach.line05:
    title: الشكر والختام
    gloss: تشكر Ana السيد Mihai وتودّعه.
    note: عبارة الشكر الختامية نفسها التي استُخدمت في حوارات الوحدتين 1 و8.
  ro.a1.unit09.lesson03.teach.line06:
    title: إنهاء اللقاء
    gloss: يودّع Mihai Ana بالمثل، ويذكر اسمها.
    note: نمط الختام الودّي نفسه الذي انتهت به حوارات الوحدات 1 و5 و6 و7 و8.
