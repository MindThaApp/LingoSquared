    gloss: 'ميهاي وإيلينا كلاهما يحب الحيوانات، لكن ليس لدى أي منهما حيوان أليف. ميهاي يحب الكلاب وإيلينا تحب القطط. أما أندريه فلديه حيوان أليف: قطة. يلعب كثيرًا مع قطته ويطعمها كل يوم. هل لديك حيوان أليف؟'
