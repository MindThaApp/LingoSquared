teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'تذكير: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (في الصباح) · seara (في المساء) · noaptea (في الليل) · cafea (القهوة) · pâine (الخبز)
    note: كلها وردت من قبل — dimineața وseara وnoaptea منذ الوحدة 4، وcafea وpâine منذ الوحدة 6 — وهنا تجتمع في جمل هذه الوحدة عن الروتين اليومي.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: أستيقظ
    gloss: Mă trezesc (أستيقظ)
    note: '*Mă* ضمير الانعكاس الذي رأيناه في *mă numesc* و*mă cheamă*؛ فالرومانية تستعمل فعلًا انعكاسيًا للدلالة على «الاستيقاظ»، وحرفيًا: «أوقظ نفسي».'
    example_gloss:
    - أستيقظ في الصباح.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: أستيقظ في الصباح
    gloss: Mă trezesc dimineața. (أستيقظ في الصباح.)
    note: جملة قصيرة تامة — أبسط جملة ممكنة عن الروتين.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: آكل
    gloss: Mănânc (آكل)
    note: لا حاجة إلى ضمير «أنا» — فنهاية الفعل في الرومانية تدل على المتكلم، وهو النمط نفسه الذي رأيناه مع *vreau* و*cumpăr* و*aș dori*.
    example_gloss:
    - آكل الخبز في الصباح.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: أشرب
    gloss: Beau (أشرب)
    note: يقترن بشكل طبيعي بمشروبات تعرفها مثل *cafea* و*ceai*.
    example_gloss:
    - أشرب القهوة في الصباح.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: آكل الخبز وأشرب القهوة في الصباح
    gloss: Mănânc pâine și beau cafea dimineața. (آكل الخبز وأشرب القهوة في الصباح.)
    note: تربط بين فعلين بـ *și* (و)، التي عرفناها من *ora unu și jumătate* في الوحدة 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: أعمل
    gloss: Lucrez (أعمل)
    note: صيغة المتكلم من *lucrează*، التي رأيناها في الوحدة 4 عند الحديث عن عمل Mihai في المساء.
    example_gloss:
    - أعمل في المساء.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: أعمل في المساء
    gloss: Lucrez seara. (أعمل في المساء.)
    note: جملة قصيرة تامة عن وقت العمل.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: أذهب
    gloss: Merg (أذهب)
    note: صيغة المتكلم من *mergeți* التي هي صيغة الأمر التي مرّت معنا — الفعل نفسه بشخص مختلف.
    example_gloss:
    - أذهب إلى البيت.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: المنزل
    gloss: Acasă (البيت)
    note: تُستعمل بلا حرف جر — *merg acasă* وليس *merg la acasă*.
    example_gloss:
    - أذهب إلى البيت ليلًا.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: أذهب إلى البيت ليلًا
    gloss: Merg acasă noaptea. (أذهب إلى البيت ليلًا.)
    note: جملة قصيرة تامة — النهاية الطبيعية ليوم العمل.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: أعمل في المساء وأذهب إلى البيت ليلًا
    gloss: Lucrez seara și merg acasă noaptea. (أعمل في المساء وأذهب إلى البيت ليلًا.)
    note: تجمع جملتَي هذا الدرس في جملة واحدة بواسطة *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'تذكير: cursul, începe, la ora nouă, apoi'
    gloss: cursul (الدرس) · începe (يبدأ) · la ora nouă (في الساعة التاسعة) · apoi (ثم)
    note: وردت Cursul وbegins începe وla ora nouă في الوحدة 4 (يبدأ درس Mihai في التاسعة صباحًا)، ووردت apoi في الوحدة 9 — وهنا تجتمع في حديث Mihai عن روتينه.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'تذكير: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · da (نعم) · Ana, Mihai (اسمان)
    note: كلها وردت في وحدات سابقة — وهنا تسأل Ana ميهاي عن يومه.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: أنام
    gloss: Mă culc (أنام)
    note: 'فعل انعكاسي آخر على النمط نفسه مثل *mă trezesc* — وحرفيًا: «أضع نفسي للنوم».'
    example_gloss:
    - أنام ليلًا.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: أنام ليلًا
    gloss: Mă culc noaptea. (أنام ليلًا.)
    note: خاتمة طبيعية لليوم، تختم الروتين الذي بدأ بـ *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: التحية والسؤال عن موعد الدرس
    gloss: تحيّي Ana صديقها Mihai وتسأله متى يبدأ درسه.
    note: تعيد سؤال الوحدة 4 عن درس Mihai.
  ro.a1.unit10.lesson03.teach.line02:
    title: الجواب بموعد الدرس
    gloss: يقول Mihai إن درسه يبدأ في التاسعة صباحًا.
    note: الجواب نفسه الذي قدّمه Mihai في الوحدة 4، يتكرر هنا ضمن روتينه اليومي الأوسع.
  ro.a1.unit10.lesson03.teach.line03:
    title: السؤال عن المساء
    gloss: 'تطرح Ana سؤالًا قصيرًا للمتابعة: «وفي المساء؟»'
    note: طريقة طبيعية وموجزة لطلب المزيد من الروتين دون أداة استفهام جديدة.
  ro.a1.unit10.lesson03.teach.line04:
    title: وصف بقية اليوم
    gloss: يقول Mihai إنه يعمل في المساء ثم ينام ليلًا.
    note: تجمع بين *lucrez* و*mă culc* من هذه الوحدة بواسطة *apoi* — وهي تتفق مع ما ثبت في الوحدة 4 من أن Mihai يعمل في المساء.
  ro.a1.unit10.lesson03.teach.line05:
    title: الشكر والختام
    gloss: تقول Ana «جيد!» وتشكر Mihai وتودّعه.
    note: عبارة الشكر الختامية نفسها التي وردت في حوارات الوحدات 1 و8 و9.
  ro.a1.unit10.lesson03.teach.line06:
    title: إنهاء اللقاء
    gloss: يودّع Mihai بدوره، ويذكر اسم Ana.
    note: نمط الختام الودي نفسه الذي انتهى به حوار كل وحدة سابقة.
