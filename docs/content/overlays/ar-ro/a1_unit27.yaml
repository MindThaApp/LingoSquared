teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: سعيد وحزين وغاضب
    gloss: سعيد، حزين، غاضب
    note: 'ثلاث كلمات أساسية للمشاعر تُستعمل مع *a fi* (يكون). لكل منها صيغة مؤنثة تنتهي بـ *-ă*: *fericită* و*tristă* و*supărată*.'
    example_gloss:
    - أنا سعيد.
    - أنا حزين.
    - أنا غاضب.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: قول إنك سعيد
    gloss: أنا سعيد.
    note: النمط الأساسي هو *Sunt* (من *a fi*، يكون) + صفة تدل على شعور. في العربية لا نحتاج إلى فعل في الجملة المماثلة (أنا سعيد)، أما في الرومانية فالفعل ضروري. وتقول المرأة *Sunt fericită*.
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: المقارنة بين مشاعر
    gloss: لست غاضبًا، أنا حزين.
    note: 'تجعل *Nu* قبل الفعل الجملة منفية: *Nu sunt supărat*. ثم تذكر الجملة الثانية الشعور الحقيقي.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: السؤال عن السبب
    gloss: لماذا أنت سعيد؟
    note: '*De ce* (لماذا) هي صيغة السؤال المعتادة عن السبب.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: ذكر السبب
    gloss: أنا سعيد لأن لدي شقة جديدة.
    note: 'تُدخل *Pentru că* (لأن) جملة السبب؛ ويبقى ترتيب الكلمات عاديًا: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: سبب سلبي
    gloss: أنا حزين لأن المطر يهطل.
    note: لا فاعل ظاهرًا للفعل *Plouă* (تمطر) في الرومانية، ولذلك يكفي وحده ليكون جملة السبب.
  ro.a1.unit27.lesson03.teach.emotionat:
    title: متوتر
    gloss: متوتر
    note: الكلمة المعتادة للتعبير عن التوتر.
    example_gloss: أنا متوتر قبل أول مناوبة لي.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: ذكر سبب توترك
    gloss: أنا متوتر قبل أول مناوبة لي.
    note: تُدخل *Pentru* (حرفيًا «لأجل») ما يتعلق به التوتر، بينما نقول في العربية عادةً «بسبب» أو «من».
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: طمأنة شخص ما
    gloss: لا تقلق.
    note: '*Nu-ți face griji* (حرفيًا «لا تصنع لنفسك همومًا») عبارة ثابتة معتادة للطمأنة. ومع شخص لا تعرفه: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: السؤال عن شعور شخص ما
    gloss: كيف يشعر ميهاي؟
    note: 'الفعل *A se simți* (يشعر) انعكاسي: *mă simt* (أنا)، *te simți* (أنت)، *se simte* (هو/هي). وهو الطريقة المعتادة للسؤال عن المشاعر ووصفها.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: وصف شعور شخص ما
    gloss: إنه يشعر بالتوتر.
    note: '*Se* ضمير انعكاسي للغائب (هو/هي) ويأتي قبل الفعل: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: السؤال عن سبب شعور شخص ما
    gloss: لماذا يشعر بالتوتر؟
    note: تجمع هذه الجملة بين *de ce* ونمط *se simte* الذي ورد في *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: اقرأ رسالة عن المشاعر
    gloss: مرحبًا آنا، أنا متوتر قليلًا بسبب مناوبتي الأولى وحدي. لكنني سعيد أيضًا، لأن لدي عملًا جديدًا وشقة جديدة. أظن أن كل شيء سيكون على ما يرام.
    note: تتبّع سبب توتر الكاتب، وما يسعده، ونظرته العامة.
    glosses:
      puțin: قليلًا
      emoționat: متوتر
      prima: أول
      tură: مناوبة
      singur: وحده
      fericit: سعيد
      fiindcă: لأن
      nou: جديد
      serviciu: عمل
      apartament: شقة
      cred: يظن
      rezolvă: سيكون على ما يرام
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: آنا تسأل ميهاي عن شعوره
    gloss: 'آنا: مرحبًا ميهاي، كيف تشعر قبل مناوبتك الأولى؟'
    note: تستعمل *Cum te simți* الضمير الانعكاسي *te*؛ وفي *prima ta tură* تتفق صفة الملكية *ta* مع الاسم المؤنث *tură*.
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: ميهاي يعترف بأنه متوتر
    gloss: 'ميهاي: أنا متوتر قليلًا، بصراحة.'
    note: تخفّف *Sincer să fiu* (بصراحة) من وقع الاعتراف.
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: آنا تطمئنه
    gloss: 'آنا: لا تقلق، ستتدبر الأمر جيدًا!'
    note: '*O să te descurci bine* (حرفيًا «ستتدبر أمرك جيدًا») عبارة تشجيع ثابتة؛ و*o să* + فعل تكوّن المستقبل.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: ميهاي يشكرها
    gloss: 'ميهاي: شكرًا، هذا يساعد فعلًا.'
    note: '*Ajută* هي صيغة الغائب المفرد (هو/هي) من *a ajuta* (يساعد)؛ ومعناها هنا «يساعد».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: آنا تتوقع النتيجة
    gloss: 'آنا: وبعد ذلك ستكون بالتأكيد سعيدًا جدًا وفخورًا.'
    note: تعبّر *Sigur* (بالتأكيد) عن توقع واثق؛ و*mândru* (فخور) صفة جديدة مفيدة (*mândră* للمرأة).
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: ميهاي يوافق
    gloss: 'ميهاي: نعم، وأنا أظن ذلك أيضًا.'
    note: '*Și eu cred asta* (حرفيًا «وأنا أظن هذا») طريقة طبيعية للموافقة على رأي أحدهم.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: خلاصة مع este وlui وîl
    gloss: ميهاي متوتر بسبب مناوبته الأولى. آنا تساعده.
    note: '*Este* هي صيغة الغائب (هو/هي) من *a fi* (يكون)؛ و*lui* بعد الاسم تعني «له» أو «ـه»؛ و*îl* تعني «ـه» (مفعولًا به) وتأتي قبل الفعل: *îl ajută*. ثلاث كلمات صغيرة لكنها أساسية للحديث عن شخص آخر.'
