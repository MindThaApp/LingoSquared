teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'تذكير: cafea, ceai, pâine'
    gloss: cafea (قهوة) · ceai (شاي) · pâine (خبز)
    note: كلها مقررة في الوحدة 6، وهنا تجتمع مع قواعد الإعجاب وعدمه الجديدة في هذه الوحدة.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: يعجبني
    gloss: Îmi place (يعجبني)
    note: 'حرفيًا «يروق لي»: *îmi* (لي) مع *place* (يروق) الثابتة لا تتغير. وللحديث عن حب شيء بوجه عام تستعمل الرومانية صيغة الاسم المعرّفة (*cafeaua* لا *cafea* المعروفة من الوحدة 6)، وهذا قريب من العربية التي تقول «تعجبني القهوة» بالتعريف.'
    example_gloss:
    - تعجبني القهوة.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: تعجبني القهوة
    gloss: Îmi place cafeaua. (تعجبني القهوة.)
    note: 'النمط الكامل: Îmi place + الاسم المعرّف.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: يعجبني الشاي
    gloss: Îmi place ceaiul. (يعجبني الشاي.)
    note: النمط نفسه كما في *Îmi place cafeaua* مع مشروب آخر؛ و*ceaiul* هي الصيغة المعرّفة من *ceai* المعروفة من الوحدة 6.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: لا يعجبني
    gloss: Nu-mi place (لا يعجبني)
    note: نفي *Îmi place*؛ تختصر الرومانية *nu îmi* إلى *nu-mi* في الكلام اليومي، فهذه الصيغة القصيرة بالواصلة هي الطبيعية وليست مجرد اختصار.
    example_gloss:
    - لا يعجبني الخبز.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: لا يعجبني الخبز
    gloss: Nu-mi place pâinea. (لا يعجبني الخبز.)
    note: '*Pâinea* هي الصيغة المعرّفة من *pâine* المعروفة من الوحدة 6، بالنمط نفسه مثل *cafeaua* و*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'تذكير: Îmi place, Nu-mi place'
    gloss: Îmi place (يعجبني) · Nu-mi place (لا يعجبني)
    note: كلتاهما من الدرس الأول في هذه الوحدة، وهنا تُضاف إليهما صيغة السؤال.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'تذكير: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (القهوة) · ceaiul (الشاي) · pâinea (الخبز)
    note: كلها من الدرس الأول في هذه الوحدة، وتُستعمل هنا في صيغتي السؤال والتفضيل.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: هل تحب...؟
    gloss: Vă place...? (هل يعجبك...؟)
    note: صيغة السؤال الرسمية من *Îmi place*؛ تحلّ *vă* (لك، للمخاطب باحترام) محل *îmi* (لي)، وهو مستوى *dumneavoastră* نفسه المستعمل في *aveți* و*faceți*. أضف بعدها اسمًا معرّفًا، أو استعملها وحدها إذا كان الموضوع واضحًا.
    example_gloss:
    - هل تعجبك القهوة؟
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: هل تعجبك القهوة؟
    gloss: Vă place cafeaua? (هل تعجبك القهوة؟)
    note: 'النمط الكامل: Vă place + الاسم المعرّف، مع نغمة سؤال صاعدة.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: أفضّل
    gloss: Prefer (أفضّل)
    note: 'كلمة شفافة قريبة من أصلها اللاتيني؛ لا حاجة إلى تركيب «لي»، فـ*prefer* فعل عادي مثل «أفضّل»: *Prefer* + الشيء المفضّل في صيغته المعرّفة كما في *Îmi place*.'
    example_gloss:
    - أفضّل القهوة.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: أفضّل القهوة
    gloss: Prefer cafeaua. (أفضّل القهوة.)
    note: عبارة أقوى من *Îmi place cafeaua*، ومفيدة عند الاختيار بين شيئين.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: أو
    gloss: Sau (أو)
    note: تربط بين خيارين عند عرض الاختيار أو السؤال عنه، وتختلف عن *și* (و) في الوحدة 10 والوحدة 12 التي تربط بين شيئين صحيحين معًا.
    example_gloss:
    - قهوة أم شاي؟
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: قهوة أم شاي؟
    gloss: قهوة أم شاي؟
    note: 'طريقة قصيرة وطبيعية لعرض خيار: تُستعمل هنا صيغتا النكرة البسيطتان (*cafea* و*ceai*) لا صيغتا المعرفة *cafeaua*/*ceaiul*، لأن هذا عرض مفتوح وليس كلامًا عامًا عن القهوة أو الشاي.'
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'تذكير: Vă place, Prefer, Sau'
    gloss: هل يعجبكم؟ · أفضّل · أو
    note: كلها من الدرس الثاني في هذه الوحدة، وهنا تستعملها Ana وMihai معًا.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'تذكير: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: يعجبني · لا يعجبني · القهوة · الشاي · الخبز
    note: كلها من الدرس الأول في هذه الوحدة، وهنا تقول Ana وMihai كل منهما ما يعجبه وما لا يعجبه.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'تذكير: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: مرحبًا · شكرًا · إلى اللقاء · اسما شخصين
    note: كلها وردت في وحدات سابقة، وهي نمط الافتتاح والختام الودّي نفسه الذي اتبعته كل حوارات هذه الدورة.
  ro.a1.unit13.lesson03.teach.line01:
    title: التحية والسؤال عن القهوة أو الشاي
    gloss: Mihai يحيّي Ana ويسألها هل تحب القهوة أم الشاي.
    note: يجمع بين *Vă place...?* من هذه الوحدة و*sau* لعرض الخيارين في سؤال واحد.
  ro.a1.unit13.lesson03.teach.line02:
    title: التعبير عن تفضيل وعن عدم إعجاب
    gloss: تقول Ana إنها تفضّل القهوة ولا يعجبها الشاي.
    note: يجمع بين *Prefer* و*Nu-mi place*؛ وتفضيلها للقهوة يوافق اختيارها المعروف في الوحدة 6 والوحدة 12.
  ro.a1.unit13.lesson03.teach.line03:
    title: التعبير عن تفضيل معاكس
    gloss: يقول Mihai إن الشاي يعجبه ولا تعجبه القهوة.
    note: يوافق اختيار Mihai المعروف في الوحدة 6 والوحدة 12 (الشاي دائمًا وليس القهوة).
  ro.a1.unit13.lesson03.teach.line04:
    title: السؤال عن الخبز أيضًا
    gloss: تسأل Ana هل يحب Mihai الخبز أيضًا.
    note: تبدأ بالسؤال القصير *Și pâinea?* (وماذا عن الخبز؟)، ثم تسأل بالصيغة الكاملة *Vă place...?* عن موضوع جديد هو *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: الموافقة والشكر والوداع
    gloss: يقول Mihai نعم، الخبز يعجبه، ويشكر Ana ويودّعها.
    note: يوافق اختيار Mihai المعروف في الوحدة 6 (الخبز)، وهو نمط الختام نفسه الذي انتهت به حوارات الوحدات السابقة.
  ro.a1.unit13.lesson03.teach.line06:
    title: إنهاء المحادثة
    gloss: تردّ Ana بالوداع مناديةً Mihai باسمه.
    note: نمط الختام الودّي نفسه الذي انتهت به حوارات الوحدات السابقة.
