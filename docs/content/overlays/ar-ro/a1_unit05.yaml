answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: الرومانية A1
  description: 'الحديث عن العائلة بالرومانية: الوالدان والإخوة والأبناء والحالة الاجتماعية، مع استخدام زوج الملكية meu/mea ونفس التقابل بين tu وdumneavoastră في أسئلة العمر من الوحدة الثانية، ومتابعة آنا وميهاي وهما يتعرفان على عائلتي بعضهما.'
units:
  ro.a1.unit05.family:
    title: العائلة
