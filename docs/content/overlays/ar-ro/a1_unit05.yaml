teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'تذكير: am وun وo وși وmare'
    gloss: 'am (لدي) · un/o (أداة نكرة: مذكر/مؤنث) · și (و) · mare (كبير)'
    note: ظهرت الكلمات الخمس في وحدات سابقة (*și* في الوحدة 1، و*am* و*o* في الوحدة 2، و*mare* في ملاحظة «الحرف الكبير» في الوحدة 3، و*un* في الوحدة 4)، وتعود هنا للحديث عن العائلة.
  ro.a1.unit05.lesson01.teach.familie:
    title: العائلة
    gloss: عائلة
    note: اسم مؤنث، يُستعمل مع *o* وصفة مثل *mare* للتعبير عن «عائلة كبيرة».
    example_gloss: لدي عائلة كبيرة.
  ro.a1.unit05.lesson01.teach.mama:
    title: الأم
    gloss: أم
    note: الكلمة المعجمية العادية لـ«أم»، وستأتي بعد بضع بطاقات طريقة قول «أمي».
    example_gloss: لدى ميهاي أم وأب.
  ro.a1.unit05.lesson01.teach.tata:
    title: الأب
    gloss: أب
    note: الكلمة المعجمية العادية لـ«أب».
    example_gloss: والدي معلّم.
  ro.a1.unit05.lesson01.teach.parintii:
    title: الوالدان
    gloss: الوالدان
    note: تشمل الأب والأم معًا، مثل كلمة «الوالدان» في العربية.
    example_gloss: والداي يعيشان في رومانيا.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'ياء المتكلم: meu وmea'
    gloss: meu (لي، للمذكر) / mea (لي، للمؤنث)
    note: 'تتوافق كلمة الملكية («ي» في «أبي» و«أمي») في الرومانية مع جنس الشيء المملوك لا مع جنس المالك: *meu* مع اسم مذكر مثل *tată*، و*mea* مع اسم مؤنث مثل *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: أمي
    gloss: أمي
    note: تصبح mamă ‏mama (تُضاف أداة التعريف) قبل أن تتصل بها mea؛ وهذه هي الصيغة المركّبة الفعلية لقول «أمي».
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: أبي
    gloss: أبي
    note: تصبح tată ‏tatăl (تُضاف أداة التعريف بصيغة شاذة مع -l) قبل أن تتصل بها meu.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: أمي وأبي
    gloss: أمي وأبي.
    note: تجمع صيغتي الملكية في جملة واحدة، لكل منهما توافقها الصحيح في الجنس.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'تذكير: câți وai وaveți وdoi وnu'
    gloss: 'câți (كم عدد) · ai/aveți (لديك: غير رسمي/رسمي) · doi (اثنان) · nu (لا)'
    note: ظهرت *Câți* و*ai* و*aveți* أول مرة في الوحدة 2 في سؤال العمر ("Câți ani ai?")، وتُستعمل هنا للسؤال عن الإخوة والأبناء. أما *doi* فمن أعداد الوحدة 2، و*nu* من الوحدة 3.
  ro.a1.unit05.lesson02.teach.da:
    title: نعم
    gloss: نعم
    note: الكلمة اليومية لقول «نعم»، وتقابل *nu* («لا») من الوحدة 3.
    example_gloss: نعم، لدي أخ.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: الأخ، الأخت
    gloss: أخ / أخت
    note: اسما قرابة مذكر ومؤنث، يُستعملان مع un/o كأي اسم آخر.
    example_gloss:
    - لدي أخ.
    - لدي أخت.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: إخوة، أخوات
    gloss: إخوة / أخوات
    note: صيغتا الجمع تُستعملان للسؤال عن الإخوة عمومًا؛ فالرومانيون يسألون عادةً "Ai frați?" (هل لديك إخوة؟) بمعنى «هل لديك إخوة وأخوات؟»، وغالبًا يتبعونه بـ"Surori?" للتأكد من وجود أخوات تحديدًا.
    example_gloss: هل لديك إخوة أو أخوات؟
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: هل لديك إخوة؟ (غير رسمي)
    gloss: هل لديك إخوة؟
    note: الطريقة اليومية غير الرسمية للسؤال، وتتصل بصيغة *tu* من الوحدة 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: هل لديكم إخوة؟ (رسمي)
    gloss: هل لديكم إخوة؟
    note: الصيغة المهذبة، وهي نفسها *aveți* المستعملة في سؤال العمر في الوحدة 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: طفل، أطفال
    gloss: طفل / أطفال
    note: copil من الجموع الصعبة في الرومانية؛ فجمعها copii لا ينتهي بـ -i أو -e بصورة منتظمة، ويحسن حفظها كصيغة قائمة بذاتها.
    example_gloss: لدي طفلان.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: الابن، الابنة
    gloss: ابن / ابنة
    note: الكلمتان المخصصتان للابن والابنة، وتختلفان عن الكلمة العامة copil/copii.
    example_gloss:
    - لدي ابن.
    - لدي ابنة.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: كم طفلًا لديك؟
    gloss: كم طفلًا لديك؟
    note: Câți (كم عدد) + copii (أطفال) + ai (لديك) -- والكلمات الثلاث مألوفة لديك.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: متزوج
    gloss: متزوج
    note: سؤال شخصي شائع في المحادثات اليومية، مثل السؤال عن العمر.
    example_gloss: هل أنت متزوج؟
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'تذكير: bine وla revedere وAna وMihai'
    gloss: bine (جيد/بخير) · la revedere (إلى اللقاء) · Ana، Mihai (اسمان)
    note: مراجعة لمفردات سبق تعلمها في وحدات سابقة، وتُستعمل من جديد في حوار هذا الدرس.
  ro.a1.unit05.lesson03.teach.line01:
    title: السؤال عن الإخوة
    gloss: تسأل آنا ميهاي إن كان لديه إخوة.
    note: تُستعمل صيغة *aveți* المهذبة، بما يوافق الأسلوب الذي اعتاده الاثنان في الحديث.
  ro.a1.unit05.lesson03.teach.line02:
    title: الإجابة والسؤال بالمثل
    gloss: يقول ميهاي إن لديه أخًا وأختًا، ويسأل آنا إن كان لديها أطفال.
    note: يعيد استعمال مفردات هذه الوحدة frate/soră وcopii في تبادل واحد.
  ro.a1.unit05.lesson03.teach.line03:
    title: الإجابة وإعادة السؤال
    gloss: تقول آنا إن لديها ابنة، وتوجه إلى ميهاي السؤال نفسه.
    note: '*Și dumneavoastră?* («وأنتم؟») هي نفس صيغة رد السؤال التي وردت في تعارف الوحدة 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: الإجابة
    gloss: يقول ميهاي إن لديه ابنًا.
    note: إجابة قصيرة ومباشرة باستعمال كلمة fiu من هذه الوحدة.
  ro.a1.unit05.lesson03.teach.line05:
    title: الرد والختام
    gloss: تعبّر آنا عن ارتياحها وتودّع.
    note: '*Bine!* هنا ردّ إيجابي قصير، وهي الكلمة نفسها الواردة في *Bine, mulțumesc.* من الوحدة 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: ختام اللقاء
    gloss: يودّع ميهاي آنا بدوره مناديًا إياها باسمها.
    note: هو نمط الختام الودي نفسه الذي انتهى به حوارا الوحدة 1 والوحدة 4.
