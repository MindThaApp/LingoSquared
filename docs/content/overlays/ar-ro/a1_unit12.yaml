teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'تذكير: parc, cinema'
    gloss: parc (الحديقة) · cinema (السينما)
    note: الكلمتان وردتا في الوحدة 11 -- وتجتمعان هنا مع قواعد الزمن الماضي الجديدة في هذه الوحدة.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'تذكير: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (اليوم) · mâine (غدًا) · duminică (الأحد) · sâmbătă (السبت)
    note: كلها وردت في الوحدة 3 والوحدة 11 -- وهي تمهّد هنا للمقابلة مع الكلمة الجديدة *ieri* (أمس) في هذا الدرس.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: كنت / ذهبت
    gloss: Am fost (كنت / ذهبت)
    note: الماضي المركب للفعل *a fi* (يكون) -- الكلمة *am* فعل مساعد ثابت يُستعمل مع «أنا» و«نحن»، و*fost* هي صيغة الماضي الثابتة. ومع المكان، تُعد *am fost la...* الطريقة اليومية الطبيعية لقول «ذهبت إلى...» -- وهي أكثر شيوعًا في الكلام من فعل حرفي للمشي أو السفر.
    example_gloss:
    - ذهبت إلى الحديقة.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: ذهبت إلى الحديقة
    gloss: Am fost la parc. (ذهبت إلى الحديقة.)
    note: 'النمط الكامل: am fost + la + المكان.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: ذهبت إلى السينما
    gloss: Am fost la cinema. (ذهبت إلى السينما.)
    note: النمط نفسه كما في *Am fost la parc*، مع مكان مختلف.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: أمس
    gloss: Ieri (أمس)
    note: سبق أن وردت في الوحدة 3 إلى جانب *astăzi* (اليوم) و*mâine* (غدًا) -- وتُستعمل الآن مع الزمن الماضي، وتوضع في بداية الجملة لتحديد وقت الحدث.
    example_gloss:
    - بالأمس ذهبت إلى الحديقة.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: بالأمس ذهبت إلى الحديقة
    gloss: Ieri am fost la parc. (بالأمس ذهبت إلى الحديقة.)
    note: إضافة *ieri* في أول *Am fost la parc* تحدد الوقت بدقة.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'تذكير: mănânc, beau'
    gloss: mănânc (آكل) · beau (أشرب)
    note: كلتاهما وردتا في الروتين اليومي في الوحدة 10 -- وهذا الدرس يحوّلهما إلى صيغتي الماضي.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'تذكير: pâine, cafea, ceai, și'
    gloss: pâine (الخبز) · cafea (القهوة) · ceai (الشاي) · și (و)
    note: كلها وردت في الوحدة 6 والوحدة 10 -- وتُستعمل هنا في جمل الماضي الخاصة بهذا الدرس.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: أكلت
    gloss: Am mâncat (أكلت)
    note: الماضي المركب للفعل *a mânca* (يأكل)، الذي رأيناه بصيغة *mănânc* (آكل، الوحدة 10) -- الفعل نفسه في الزمن الماضي. Am + mâncat، النمط نفسه كما في *am fost*.
    example_gloss:
    - أكلت خبزًا.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: أكلت خبزًا
    gloss: Am mâncat pâine. (أكلت خبزًا.)
    note: 'النمط الكامل: am mâncat + الطعام.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: شربت
    gloss: Am băut (شربت)
    note: الماضي المركب للفعل *a bea* (يشرب)، الذي رأيناه بصيغة *beau* (أشرب، الوحدة 10) -- الفعل نفسه في الزمن الماضي.
    example_gloss:
    - شربت شايًا.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: شربت شايًا
    gloss: Am băut ceai. (شربت شايًا.)
    note: 'النمط الكامل: am băut + المشروب.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: أكلت خبزًا وشربت شايًا
    gloss: Am mâncat pâine și am băut ceai. (أكلت خبزًا وشربت شايًا.)
    note: فعلان في الماضي يربط بينهما *și* -- أداة الربط نفسها التي استعملتها الوحدة 10 لروتين الحاضر.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'تذكير: am fost, ieri, parc, cinema'
    gloss: am fost (كنت / ذهبت) · ieri (أمس) · parc (الحديقة) · cinema (السينما)
    note: كلها من الدرس الأول في هذه الوحدة -- وهي تمهّد هنا لاستعادة أحداث يوم الأحد.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'تذكير: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (أكلت) · am băut (شربت) · pâine (الخبز) · cafea (القهوة) · ceai (الشاي)
    note: كلها من الدرس الثاني في هذه الوحدة -- وهنا يقول آنا وميهاي كل منهما ما تناوله.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'تذكير: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (كيف، الوحدة 1/الوحدة 9) · duminică (الأحد، الوحدة 3) · bine (جيد، الوحدة 1) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · Ana, Mihai (اسمان)
    note: 'كلها وردت في وحدات سابقة -- ظهرت *cum* أول مرة في السؤال عن اسم شخص (الوحدة 1) وعن الاتجاهات (الوحدة 9)، وهي هنا تفتتح نوعًا آخر من الأسئلة: كيف سار أمر ما.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: كان / كانت
    gloss: A fost (كان / كانت)
    note: صيغة أخرى للفعل نفسه الذي في *am fost* -- الكلمة *a* مساعد للغائب «هو / هي»، لا لـ«أنا / نحن». تعلّم *Cum a fost...?* و*A fost bine!* عبارتين ثابتتين الآن، لا نمطًا كاملًا للتركيب الحر.
    example_gloss:
    - كان جيدًا!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: كان جيدًا!
    gloss: A fost bine! (كان جيدًا!)
    note: طريقة قصيرة وطبيعية لقول إن الأمر سار على ما يرام -- وهي جواب *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: كيف كان يوم الأحد؟
    gloss: Cum a fost duminică? (كيف كان يوم الأحد؟)
    note: طريقة طبيعية لبدء حديث عن يوم مضى، حتى مع شخص كان حاضرًا أيضًا، فتدعوه إلى أن يشاركك شعوره أو ما لفت انتباهه.
  ro.a1.unit12.lesson03.teach.line01:
    title: نحيّي ونسأل كيف كان يوم الأحد
    gloss: يحيّي ميهاي آنا ويسألها كيف كان يوم الأحد.
    note: يجمع بين *Cum a fost duminică?* من هذه الوحدة و*Bună* المعروفة سابقًا.
  ro.a1.unit12.lesson03.teach.line02:
    title: نجيب ونذكر المكان
    gloss: تقول آنا إنه كان جيدًا وإنها ذهبت إلى الحديقة.
    note: يجمع بين *A fost bine!* و*Am fost la parc* من الدرس الأول.
  ro.a1.unit12.lesson03.teach.line03:
    title: نقول ماذا أكل وماذا شرب
    gloss: يقول ميهاي إنه أكل خبزًا وشرب شايًا.
    note: يعيد استعمال *Am mâncat pâine și am băut ceai* من الدرس الثاني، بالترتيب نفسه الذي اعتاده ميهاي في الوحدة 6 (pâine ثم ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: نقول ماذا شربت
    gloss: تقول آنا إنها شربت قهوة.
    note: يوافق ما اعتادته آنا في الوحدة 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: نشكر ونودّع
    gloss: يشكر ميهاي آنا ويودّعها.
    note: خاتمة الحوار نفسها التي انتهت بها حوارات الوحدات السابقة.
  ro.a1.unit12.lesson03.teach.line06:
    title: نختم المحادثة
    gloss: تودّع آنا ميهاي بدورها وتنادي باسمه.
    note: الخاتمة الودّية نفسها التي انتهت بها حوارات الوحدات السابقة.
