  description: 'رومانية للمبتدئين لوصف المظهر الجسدي الأساسي للشخص: انطباع الطول والعمر، ولون الشعر والعينين، والسؤال الأساسي Cum arată ...؟، ومقارنة مظهر شخصين.'
