teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: طويل وقصير
    gloss: طويل / قصير
    note: '*Înalt* يصف الشخص الطويل و*scund* يصف الشخص القصير. ولكل منهما صيغة مؤنثة: *înaltă*، *scundă*.'
    example_gloss:
    - إيلينا طويلة.
    - أندريه قصير.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: 'يصف *Bătrân* و*tânăr* هنا انطباعًا عامًا عن العمر لا عددًا محددًا من السنوات. الصيغتان المؤنثتان: *bătrână*، *tânără*.'
    example_gloss:
    - الجد كبير في السن.
    - ميهاي شاب.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: انطباع أم رقم'
    gloss: للسؤال عن العمر بدقة تقول Câți ani ai?، أما bătrân فيدل على انطباع عام، كما في Bunicul este bătrân.
    note: يمكنك السؤال عن العمر بدقة بـ *Câți ani ai?* أما هنا فـ *bătrân* يصف كم يبدو الشخص كبيرًا في السن، دون ذكر رقم.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: إيلينا طويلة وأندريه قصير
    gloss: إيلينا طويلة وأندريه قصير.
    note: 'جملة مركبة بسيطة بحرف العطف *și* (و)، تمهّد للمقارنة المباشرة في الدرس 5؛ والصفة تطابق المبتدأ: *înaltă* لإيلينا و*scund* لأندريه.'
  ro.a1.unit31.lesson02.teach.parul:
    title: الشعر
    gloss: الشعر
    note: '*Păr* اسم مذكر؛ وتلتصق أداة التعريف بآخره: *părul* («الشعر»).'
    example_gloss: ميهاي له شعر أسود قصير.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: ثلاثة ألوان للشعر. تأتي بعد الاسم *păr* (مذكر)، فتقول *părul blond* و*păr maro* و*păr cărunt*.
    example_gloss:
    - آنا شعرها أشقر.
    - شعر أندريه بني.
    - شعر الجد رمادي.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*Lung* (طويل) و*scurt* (قصير) يصفان طول الشعر؛ وكما في الألوان، تأتي بعد الاسم.'
    example_gloss:
    - إيلينا شعرها طويل.
    - أندريه شعره قصير.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: الصفة تأتي بعد الاسم
    gloss: 'تأتي الصفة بعد الاسم: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: 'في الرومانية تأتي الصفة بعد الاسم (*păr scurt*)، كما في العربية: «شعر قصير».'
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: «له» و«لها» تأتيان بعد الاسم
    gloss: 'يأتي ضمير الملكية بعد الاسم: părul ei («شعرها»)، ochii lui («عيناه»).'
    note: '*Ei* تعني «لها» و*lui* تعني «له»؛ وكلاهما يأتي بعد الاسم: *părul ei*. ويبيّن السياق من المقصود.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: ميهاي له شعر أسود قصير
    gloss: ميهاي له شعر أسود قصير.
    note: '*Negru* (أسود) صفة لون؛ وتأتي بعد الاسم: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: آنا لها شعر أشقر طويل
    gloss: آنا لها شعر أشقر طويل.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  ro.a1.unit31.lesson03.teach.ochii:
    title: العيون
    gloss: العيون
    note: '*Ochi* («عين/عيون») له الشكل نفسه في المفرد والجمع؛ وتبيّن أداة التعريف العدد: *ochiul* («العين»)، *ochii* («العيون»).'
    example_gloss: ميهاي له عينان بنيتان.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: '*Albastru* (أزرق) و*maro* (بني) و*verde* (أخضر) صفات ألوان. أما *maro* فلا يتغير أبدًا؛ و*albastru* يصبح *albaștri* و*verde* يصبح *verzi* في الجمع.'
    example_gloss:
    - آنا عيناها زرقاوان.
    - أندريه عيناه بنيتان.
    - إيلينا عيناها خضراوان.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: الصفات في الجمع
    gloss: 'تتغير الصفة في الجمع: ochi albaștri, ochi maro, ochi verzi.'
    note: مع *ochi* بصيغة الجمع تأخذ الصفة صيغة الجمع (*albaștri*، *verzi*)؛ ويبقى *maro* كما هو. قارن المفرد *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: كيف تبدو آنا؟
    gloss: كيف تبدو آنا؟
    note: '*Cum arată ...?* هو السؤال الأساسي في هذه الوحدة؛ استخدمه لتسأل عن مظهر أي شخص.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: شعر آنا طويل أشقر وعيناها زرقاوان
    gloss: شعر آنا طويل أشقر وعيناها زرقاوان.
    note: جواب نموذجي يجمع الشعر والعينين في جملة واحدة بالحرف *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: آنا تقدّم نينا
    gloss: 'آنا: ستأتي فتاة جديدة إلى مقهى اللغات الأجنبية. اسمها نينا.'
    note: تقدّم *Vine o fată nouă* ("ستأتي فتاة جديدة") شخصًا جديدًا؛ وتذكر *O cheamă Nina* اسمها.
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: ميهاي يسأل عن مظهرها
    gloss: 'ميهاي: حسنًا! كيف تبدو؟'
    note: 'يعيد السؤال الأساسي في هذه الوحدة من دون ذكر الاسم: *Cum arată?* (فالشخص معروف من السياق).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: آنا تصف طول نينا وشعرها
    gloss: 'آنا: هي قصيرة القامة وشعرها قصير أشقر.'
    note: يجمع بين كلمة *scundă* من الدرس الأول ومفردات الشعر من الدرس الثاني.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: ميهاي يسأل عن عينيها
    gloss: 'ميهاي: وعيناها؟'
    note: '*Și ochii?* ("والعينان؟") سؤال متابعة قصير؛ والشخص مفهوم من السياق.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: آنا تصف عيني نينا
    gloss: 'آنا: عيناها خضراوان.'
    note: يعيد استخدام *ochi verzi* من الدرس الثالث.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: ميهاي سيتعرّف عليها
    gloss: 'ميهاي: شكرًا! إذن سأتعرّف عليها بالتأكيد.'
    note: 'معنى *O recunosc* هو "سأتعرّف عليها": الكلمة *o* ضمير مفعول به بمعنى "إياها" وتأتي قبل الفعل.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: مقارنة بين أندريه وإيلينا
    gloss: أندريه وإيلينا أخ وأخت، لكنهما يختلفان في المظهر. أندريه قصير القامة وله شعر قصير بنّي وعينان بنّيتان. إيلينا أطول من أندريه ولها شعر طويل بنّي وعينان خضراوان. وأنت، كيف تبدو؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      frate: أخ
      soră: أخت
      arată: مظهر
      diferit: مختلف
      scund: قصير
      scurt: قصير
      maro: بني
      părul: الشعر
      ochi: العيون
      înaltă: أطول
      lung: طويل
      verzi: أخضر
      arăți: يبدو (في مظهره)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: المقارنة باستخدام mai ... decât
    gloss: 'تُكوَّن صيغة المقارنة بـ mai + الصفة + decât: Elena este mai înaltă decât Andrei.'
    note: 'تضع الرومانية *mai* ("أكثر") قبل الصفة و*decât* ("من") قبل الشخص الثاني: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: شعر إيلينا أطول من شعر أندريه
    gloss: شعر إيلينا أطول من شعر أندريه.
    note: 'تعمل *Mai lung* بالطريقة نفسها قبل *decât*: *părul mai lung decât Andrei*؛ وتبقى الصفة بعد *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم باستخدام *Am ...*، جاهزة لوصف مظهرك أنت.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: ميهاي يلمح نينا
    gloss: 'ميهاي: انظري، هل هذه نينا؟ شعرها قصير أشقر وعيناها خضراوان.'
    note: تلفت *Uite* (انظر) الانتباه إلى شيء ما؛ وتسأل *ea e Nina?* "هل هذه نينا؟".
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: آنا تؤكد
    gloss: 'آنا: نعم، هذه نينا!'
    note: تأكيد قصير وطبيعي.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: نينا تحيّي ميهاي
    gloss: 'نينا: مرحبًا، هل أنت ميهاي؟'
    note: 'سؤال تحية بسيط وغير رسمي: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: ميهاي يردّ التحية على نينا
    gloss: 'ميهاي: نعم! تشرفت بمعرفتك يا نينا.'
    note: '*Mă bucur să te cunosc* ("يسعدني التعرف إليك") هي العبارة المعتادة عند اللقاء الأول.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: 'تُختتم بها المحادثة: فقد تعرّف ميهاي على نينا من وصف آنا السابق.'
