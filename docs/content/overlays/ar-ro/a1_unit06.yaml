teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'تذكير: un، o، și'
    gloss: un/o (أداة تنكير) · și (و)
    note: ظهرت الكلمات الثلاث في وحدات سابقة (*și* في الوحدة 1، و*o* في الوحدة 2، و*un* في الوحدة 4)، وها هي تعود هنا للحديث عن الطعام والمشروبات.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: أريد ...
    gloss: Aș dori ... (أود ...)
    note: الطريقة المهذبة المعتادة لطلب شيء بالرومانية. هي صيغة شرطية ثابتة لا تتغير بحسب ما يأتي بعدها.
  ro.a1.unit06.lesson01.teach.apa:
    title: الماء
    gloss: apă (ماء)
    note: اسم مؤنث. لا يأخذ أداة تنكير حين لا تُحدَّد الكمية، كما في العربية حيث نقول «ماء» دون تنوين الكمية أو عدد.
    example_gloss: أود ماءً.
  ro.a1.unit06.lesson01.teach.cafea:
    title: قهوة
    gloss: cafea (قهوة)
    note: اسم مؤنث، ويأتي مع *o* (أداة التنكير للمؤنث) كما يأتي أي اسم مؤنث آخر.
    example_gloss: أود فنجان قهوة.
  ro.a1.unit06.lesson01.teach.ceai:
    title: شاي
    gloss: ceai (شاي)
    note: يأتي مع *un* وليس *o*، لأن ceai اسم مذكر أو محايد.
    example_gloss: أود كوب شاي.
  ro.a1.unit06.lesson01.teach.suc:
    title: عصير
    gloss: suc (عصير)
    note: يأتي أيضًا مع *un*، على نمط ceai نفسه.
    example_gloss: أود كوب عصير.
  ro.a1.unit06.lesson01.teach.lapte:
    title: حليب
    gloss: lapte (حليب)
    note: مثل apă، يُقال عادةً دون أداة تنكير حين لا تُحدَّد الكمية.
    example_gloss: أود حليبًا.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: أنا عطشان
    gloss: Mi-e sete (أنا عطشان)
    note: تعبير ثابت، ومعناه الحرفي أقرب إلى «العطش لي» منه إلى «أنا عطشان» كلمةً بكلمة.
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: أريد قهوة
    gloss: أريد قهوة.
    note: تجمع عبارة الطلب واسم مشروب مؤنث في جملة كاملة واحدة.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'تذكير: mulțumesc، bine، da، nu'
    gloss: mulțumesc (شكرًا) · bine (جيد/بخير) · da (نعم) · nu (لا)
    note: ظهرت *Mulțumesc* و*bine* أولًا في تحيات الوحدة 1، وظهرت *da* و*nu* في الوحدة 3 والوحدة 5. وها هي تعود هنا في سياق الطعام واللطف.
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: أنا جائع
    gloss: Mi-e foame (أنا جائع)
    note: التعبير الثابت نفسه مثل *Mi-e sete*، مع foame (جوع) بدل sete (عطش).
  ro.a1.unit06.lesson02.teach.paine:
    title: خبز
    gloss: pâine (خبز)
    note: يُقال عادةً دون أداة تنكير، كما نقول في العربية «خبز» دون تحديد.
    example_gloss: أنا جائع. أود خبزًا.
  ro.a1.unit06.lesson02.teach.mancare:
    title: الطعام
    gloss: mâncare (طعام)
    note: الكلمة العامة التي تعني «الطعام»، لا طبقًا بعينه.
    example_gloss: أود طعامًا.
  ro.a1.unit06.lesson02.teach.carne:
    title: لحم
    gloss: carne (لحم)
    note: الكلمة العامة التي تعني «اللحم». الأنواع المحددة (carne de vită، carne de porc) تُضيف النوع بعدها.
    example_gloss: أود لحمًا.
  ro.a1.unit06.lesson02.teach.pui:
    title: الدجاج
    gloss: pui (دجاج)
    note: الكلمة الخاصة بالدجاج (طعامًا)، وتختلف عن الكلمة العامة carne.
    example_gloss: أود دجاجًا.
  ro.a1.unit06.lesson02.teach.fructe:
    title: الفاكهة
    gloss: fructe (فاكهة)
    note: صيغة الجمع المعتادة، وتُستعمل للدلالة على الفاكهة عمومًا، كما نقول في العربية «فاكهة» أو «فواكه».
    example_gloss: أود فاكهة.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: من فضلك (رسمي)
    gloss: vă rog (من فضلك، رسمي)
    note: الطريقة المهذبة لقول «من فضلك»، وتناسب أسلوب dumneavoastră الذي ظهر في الوحدتين 1 و2.
    example_gloss: قهوة من فضلك.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: من فضلك (غير رسمي)
    gloss: te rog (من فضلك، غير رسمي)
    note: الصيغة اليومية التي تُستعمل مع الأصدقاء ومن تخاطبهم بـ*tu*، وتناسب أسلوب tu الذي ظهر في الوحدة 1.
    example_gloss: شاي، من فضلك.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'تذكير: bună، ziua، bine، la revedere، Ana، Mihai'
    gloss: bună ziua (يومٌ طيب / مرحبًا) · bine (جيد) · la revedere (إلى اللقاء) · Ana, Mihai (اسمان)
    note: ظهرت كلها في حوارات الوحدتين 1 و5. وهنا تلتقي آنا وميهاي من جديد، هذه المرة في مقهى.
  ro.a1.unit06.lesson03.teach.line01:
    title: التحية وقول إنك جائع
    gloss: تحيّي آنا ميهاي وتقول إنها جائعة.
    note: تستعمل *Mi-e foame* من هذه الوحدة في التحية نفسها.
  ro.a1.unit06.lesson03.teach.line02:
    title: طلب الطعام
    gloss: يقول ميهاي إنه يود خبزًا ودجاجًا.
    note: يستعمل مفردات pâine/pui من هذه الوحدة مع عبارة Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: طلب مشروب بأدب
    gloss: تقول آنا إنها تود فنجان قهوة، من فضلك.
    note: تجمع Aș dori وcafea وvă rog، وهي ثلاثة أشياء تعلمتها في هذه الوحدة كلًّا على حدة.
  ro.a1.unit06.lesson03.teach.line04:
    title: طلب مشروب أيضًا
    gloss: يقول ميهاي إنه يود كوب شاي، من فضلك.
    note: النمط نفسه كما في جملة آنا، مع ceai بدل cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: الشكر والختام
    gloss: تشكر آنا ميهاي وتودّعه.
    note: '*Mulțumesc* هنا شكر بسيط في الختام، وهي الكلمة نفسها في *Bine, mulțumesc.* من الوحدة 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: إنهاء اللقاء
    gloss: يرد ميهاي بالوداع مناديًا آنا باسمها.
    note: نمط الختام الودي نفسه الذي انتهت به حوارات الوحدتين 1 و5.
