teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'تذكير: Vreau, Un, Ce'
    gloss: Vreau (أريد) · Un (أداة تنكير للمذكر والمحايد) · Ce (ماذا / أي)
    note: '*Vreau* (أريد) و*un* (أداة تنكير) و*ce* (ماذا، كما في *Ce mai faceți?*) كلمات تعرفها سابقًا، نعيد استخدامها هنا لطلب قطعة ملابس.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: قميص
    gloss: Tricou (قميص)
    note: اسم محايد، يأخذ *un* (لا *o*) مثل الأسماء المذكرة والمحايدة التي مرّت، كما في *un leu*.
    example_gloss:
    - أريد قميصًا.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: لون
    gloss: Culoare (لون)
    note: اسم مؤنث، مفيد للسؤال عن ألوان الشيء المتاحة.
    example_gloss:
    - أي لون؟
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: أحمر
    gloss: Roșu (أحمر)
    note: 'يأتي بعد الاسم الذي يصفه، وهذا هو الترتيب المعتاد للصفة في الرومانية، كما في العربية: *tricou roșu* أي «قميص أحمر».'
    example_gloss:
    - أريد قميصًا أحمر.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: أزرق
    gloss: Albastru (أزرق)
    note: 'النمط نفسه مثل *roșu*: يوضع بعد الاسم، *tricou albastru*.'
    example_gloss:
    - أريد قميصًا أزرق.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: أريد قميصًا أحمر.
    gloss: Vreau un tricou roșu.
    note: 'الطلب الأساسي: *vreau* (أريد) + *un tricou* (قميصًا) + *roșu* (أحمر)، واللون بعد الاسم.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'تذكير: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (بكم هو؟) · Vă rog (من فضلك، بصيغة رسمية)
    note: '*Cât costă?* مرّت في درس السوق؛ و*vă rog* هي «من فضلك» الرسمية. نستخدمهما هنا للسؤال عن سعر قطعة ملابس وتلطيف الطلب.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'تذكير: Mic, Mică, Mare'
    gloss: 'Mic/Mică (صغير: للمذكر والمحايد / للمؤنث) · Mare (كبير، بصيغة واحدة للمذكر والمؤنث في المفرد)'
    note: كلمات الحجم التي تعرفها من مقارنة الطعام والشراب، نعيد استخدامها هنا لمقاسات الملابس.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: بنطال
    gloss: Pantaloni (بنطال)
    note: يُستعمل عادةً بصيغة الجمع في الرومانية، كما يُقال في العربية «سروال» للقطعة الواحدة؛ فـ*pantaloni* تعني بنطالًا واحدًا.
    example_gloss:
    - أريد بنطالًا.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: المقاس
    gloss: Mărime (مقاس)
    note: اسم مؤنث، يأتي مع *mică* المؤنثة (صغيرة) التي مرّت قبل قليل، ومع *mare* (كبيرة) غير المتغيرة.
    example_gloss:
    - ما المقاس؟
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: أي مقاس؟
    gloss: Ce mărime? (أي مقاس؟)
    note: سؤال شائع عند طاولة المحل، قصير وبلا فعل، بالشكل نفسه الناقص لـ*Ce culoare?* (أي لون؟).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: مقاس صغير، من فضلك.
    gloss: Mărime mică, vă rog.
    note: '*Mică* هي صيغة المؤنث من *mic*، وتتفق مع *mărime* المؤنثة. وتُجمع مع *vă rog* التي مرّت لذكر مقاسك بلباقة.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: بكم البنطال؟
    gloss: Cât costă pantalonii? (بكم البنطال؟)
    note: '*Pantalonii* هي صيغة التعريف من *pantaloni* («البنطال»). الأسماء المذكرة في الجمع تضيف *-i* للتعريف (*pantaloni* ← *pantalonii*). وتُجمع مع *cât costă* التي مرّت.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'تذكير: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (مرحبًا) · Mulțumesc (شكرًا) · Bine (جيد) · La revedere (إلى اللقاء) · Și (و)
    note: تحيات يومية مع *și* (و)، نعيد استخدامها هنا لافتتاح حوار المحل وختمه.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'تذكير: Zece, Douăzeci, De, Lei'
    gloss: Zece (عشرة) · Douăzeci (عشرون) · De (حرف يُستعمل قبل lei من العدد 20 فما فوق) · Lei (العملة، جمع leu)
    note: الأعداد والعملة *leu/lei* التي تعرفها، نعيد استخدامها هنا لسعر القميص والبنطال.
  ro.a1.unit20.lesson03.teach.line01:
    title: حيِّ ميهاي واطلب قميصًا أحمر
    gloss: تحيي آنا ميهاي وتقول إنها تريد قميصًا أحمر.
    note: 'عبارة الطلب من الدرس الأول: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: اسأل عن المقاس
    gloss: يسأل ميهاي عن المقاس الذي تريده.
    note: السؤال اليومي في المحل *Ce mărime?* (أي مقاس؟).
  ro.a1.unit20.lesson03.teach.line03:
    title: اذكر المقاس بلباقة واسأل عن السعر
    gloss: تطلب آنا مقاسًا صغيرًا، ثم تسأل عن السعر.
    note: '*Mărime mică, vă rog* (مقاس صغير، من فضلك)، ثم *Cât costă?* (بكم هو؟).'
  ro.a1.unit20.lesson03.teach.line04:
    title: اذكر السعر
    gloss: يقول ميهاي إن سعره خمسون ليو.
    note: تستعمل *cincizeci de lei* التي مرّت.
  ro.a1.unit20.lesson03.teach.line05:
    title: وافق واسأل عن البنطال أيضًا
    gloss: توافق آنا، ثم تقول إنها تريد بنطالًا أيضًا وتسأل عن سعره.
    note: '*Și* تعني هنا «أيضًا»: *Vreau și pantaloni* أي «أريد بنطالًا أيضًا».'
  ro.a1.unit20.lesson03.teach.line06:
    title: اذكر سعر البنطال
    gloss: يقول ميهاي إن البنطال يكلّف مئة وعشرين ليو.
    note: 'من العدد عشرين فما فوق، تضع الرومانية *de* بين العدد والاسم: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: اشكر ميهاي وودّعه
    gloss: تشكره آنا وتودّعه.
    note: شكر مهذّب ووداع.
  ro.a1.unit20.lesson03.teach.line08:
    title: قل إلى اللقاء
    gloss: يودّع ميهاي.
    note: وداع بسيط مع ذكر اسم آنا.
