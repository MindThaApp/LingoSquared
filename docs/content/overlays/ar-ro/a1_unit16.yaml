teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'تذكير: mă, vă, ce, sau'
    gloss: mă (أنا، ضمير المفعول) · vă (أنتم/حضرتك، للمخاطب باحترام) · ce (ماذا) · sau (أو)
    note: Mă من الوحدة 1 والوحدة 10 (mă numesc, mă trezesc)؛ وvă من الوحدات 1 و6 و7 و13 (vă rog)؛ وce من الوحدات 1 و3 و4 و15؛ وsau من الوحدة 13. تعيد هذه الوحدة استعمال الكلمات الأربع لغرض جديد، هو الحديث عمّا يؤلم.
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: يؤلم
    gloss: يؤلم
    note: 'فعل غير شخصي؛ فالرومانية تقول حرفيًا «يؤلمني» (*mă doare*) ولا تقول «أنا أؤلم». تعني *mă doare* وحدها «يؤلمني (شيء ما)»؛ وأضف الجزء المصاب لتحدد موضع الألم: *Mă doare capul*.'
    example_gloss:
    - إنه يؤلم.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: الرأس
    gloss: رأس
    note: اسم محايد ينتهي بحرف ساكن؛ يأخذ اللاحقة *-ul* للتعريف («الرأس»)، وهي اللاحقة نفسها في *tren* و*trenul* وفي *peron* و*peronul*.
    example_gloss:
    - رأسي يؤلمني.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: ما الذي يؤلمك؟
    gloss: ما الذي يؤلمك؟
    note: '*Ce* (ماذا) + *vă* (ضمير المخاطب الرسمي في موضع المفعول) + *doare*؛ كل كلمة هنا سبق تعلّمها أو قُدّمت للتو، وقد جُمعت في سؤال جديد.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: البطن
    gloss: معدة
    note: اسم محايد ينتهي بحرف ساكن، لذا تكون «المعدة» *stomacul*؛ وهي اللاحقة *-ul* نفسها كما في *cap* و*capul*.
    example_gloss:
    - معدتي تؤلمني.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: هل يؤلمك رأسك أم معدتك؟
    gloss: هل يؤلمك رأسك أم معدتك؟
    note: استعمال *Vă* (ضمير المخاطب الرسمي) بدل *mă* يحوّل الجملة إلى سؤال عن الشخص الآخر؛ وتربط *sau* (أو، من الوحدة 13) بين عضوين تعلّمناهما للتو.
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'تذكير: nu, bine, am, un, de'
    gloss: لا · جيدًا / بخير · لديّ · أداة نكرة (للمذكر والمحايد) · من
    note: Nu وbine من الوحدات 1 و6 و11؛ وam من الوحدات 2 و5 و15؛ وun وde من الوحدات 6 و7 و15. تعيد هذه الوحدة استعمال الكلمات الخمس للحديث عن الشعور بالتعب والحاجة إلى طبيب.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: أشعر
    gloss: أشعر
    note: فعل انعكاسي، معناه حرفيًا «أشعر بنفسي»؛ وهو النمط نفسه *mă* + الفعل كما في *mă trezesc* و*mă culc* من الوحدة 10.
    example_gloss:
    - أشعر أنني بخير.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: لا أشعر أنني بخير
    gloss: لا أشعر أنني بخير.
    note: تنفي *Nu* العبارة *mă simt bine*؛ وهي أبسط طريقة للقول إن هناك مشكلة دون تحديد عَرَض معيّن بعد.
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: مريض
    gloss: مريض (للمذكر)
    note: صيغة المذكر من الصفة، كما يقولها ميهاي (*Sunt bolnav*). وتقول المرأة *Sunt bolnavă* (صيغة المؤنث).
    example_gloss:
    - أنا مريض.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: أحتاج إلى طبيب
    gloss: أحتاج إلى طبيب.
    note: '*Am nevoie de* (أحتاج إلى، وحرفيًا «لديّ حاجة إلى») + *un doctor*؛ تعبير ثابت يفيد في طلب المساعدة في أي شيء، لا في الطبيب وحده.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: طبيب
    note: اسم مذكر، لذا تكون عبارة «طبيب» *un doctor*.
    example_gloss:
    - أحتاج إلى طبيب.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'تذكير: Ce mai faceți?, Aveți, Da'
    gloss: كيف حالكم؟ (رسمي) · لديكم (رسمي) · نعم
    note: Ce mai faceți من الوحدة 1؛ وAveți من الوحدة 5؛ وDa من الوحدتين 6 و11. وكلها مستعملة من جديد في حوار هذه الوحدة.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'تذكير: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: مرحبًا · شكرًا · إلى اللقاء · آنا وميهاي (اسمان)
    note: كلها وردت في الوحدات السابقة، وهي نمط البداية والختام الودّي نفسه الذي اتبعته كل حوارات هذه الدورة.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'تذكير: Spitalul este vizavi de magazin'
    gloss: المستشفى قبالة المتجر.
    note: جملة مأخوذة مباشرة من الوحدة 8؛ فموقع المستشفى لم يتغير، وملاحظة القراءة في هذه الوحدة تعود إليه.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: راحة
    gloss: راحة
    note: اسم مؤنث؛ وهي ما ينصح به الطبيب (أو الصديق) حين لا تكون بخير.
    example_gloss:
    - أنت بحاجة إلى الراحة.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: الكثير من الماء
    gloss: الكثير من الماء
    note: تتفق *Multă* (كثير، بصيغة المؤنث) مع الاسم المؤنث *apă* (ماء، من الوحدة 6)؛ وهو تركيب ثابت من النوع الذي قد يوصي به الطبيب.
    example_gloss:
    - الراحة والكثير من الماء.
  ro.a1.unit16.lesson03.teach.line01:
    title: التحية والسؤال عن الحال
    gloss: تحيّي آنا ميهاي وتسأله عن حاله.
    note: تعيد استعمال تحية *Ce mai faceți?* من الوحدة 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: قل إنك لا تشعر أنك بخير
    gloss: يقول ميهاي إنه لا يشعر أنه بخير وإن رأسه يؤلمه.
    note: تجمع بين عبارتين من هذه الوحدة، إحداهما من الدرس الثاني والأخرى من الدرس الأول.
  ro.a1.unit16.lesson03.teach.line03:
    title: اسأل إن كان يحتاج إلى طبيب
    gloss: تسأل آنا هل يحتاج إلى طبيب.
    note: تعيد استعمال عبارة الدرس الثاني من هذه الوحدة على هيئة سؤال، مع *aveți* من الوحدة 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: أكّد أنك مريض وتحتاج إلى طبيب
    gloss: يقول ميهاي نعم، إنه مريض ويحتاج إلى طبيب.
    note: تجمع بين *sunt bolnav* و*am nevoie de un doctor* من هذه الوحدة.
  ro.a1.unit16.lesson03.teach.line05:
    title: قدّم نصيحة ثم ودّع
    gloss: تنصحه آنا بالراحة وشرب الكثير من الماء، ثم تودّعه.
    note: تستعمل عبارة *Odihnă și multă apă* من هذا الدرس؛ نصيحة صحية بدل الوداع البسيط وحده كما اعتادت الدورة.
  ro.a1.unit16.lesson03.teach.line06:
    title: اشكرها ثم ودّعها
    gloss: يشكر ميهاي آنا ويودّعها.
    note: نمط الختام نفسه الذي انتهت به حوارات الوحدات السابقة.
