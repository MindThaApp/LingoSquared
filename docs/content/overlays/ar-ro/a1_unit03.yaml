answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: الرومانية A1
  description: أيام الأسبوع وأشهر السنة وطريقة التعبير عن التاريخ في الرومانية (عدد أصلي عادي + اسم الشهر، إلا اليوم الأول الذي يستعمل الكلمة الخاصة întâi) -- مع متابعة Ana وMihai وهما يحدّدان موعد لقائهما القادم.
units:
  ro.a1.unit03.dates:
    title: الأيام والتواريخ
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: أيام الأسبوع
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: أشهر السنة وكيف نقول التاريخ
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: متى نلتقي مجددًا؟
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'تذكير: este'
    gloss: هو / إنه
    note: ظهرت *Este* سابقًا في الوحدة 2 (*Care este numărul...?*). وهي لا تتغير -- الكلمة نفسها سواء كان الفاعل يومًا أو تاريخًا أو أي شيء آخر، ولا تختلف بين tu وdumneavoastră.
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: اليوم، غدًا
    gloss: astăzi (اليوم) / mâine (غدًا)
    note: كلتاهما كلمتا زمن لا تتغيران، وتأتيان في أول الجملة التي تذكر اليوم أو التاريخ.
    example_gloss:
    - اليوم هو الاثنين.
    - غدًا الثلاثاء.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: الاثنين، الثلاثاء
    gloss: luni (الاثنين) / marți (الثلاثاء)
    note: لذكر اسم اليوم (Astăzi este luni) استعمل الصيغة المجردة المعروضة هنا. ولأسماء الأيام صيغ معرّفة -- lunea، marțea -- تعني «أيام الاثنين» و«أيام الثلاثاء» عمومًا؛ وستتعرف عليها لاحقًا.
    example_gloss:
    - اليوم الاثنين.
    - غدًا الثلاثاء.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: الأربعاء، الخميس
    gloss: miercuri (الأربعاء) / joi (الخميس)
    note: مثل luni وmarți، يحتفظ miercuri وjoi بالصيغة نفسها في المفرد والجمع.
    example_gloss:
    - اليوم هو الأربعاء.
    - غدًا الخميس.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: الجمعة، السبت
    gloss: vineri (الجمعة) / sâmbătă (السبت)
    note: تحتفظ Sâmbătă بالحرف â في وسط الكلمة وفق الإملاء الحديث، بخلاف الصيغة القديمة sîmbătă.
    example_gloss:
    - اليوم الجمعة.
    - غدًا السبت.
  ro.a1.unit03.lesson01.teach.duminica:
    title: الأحد
    gloss: الأحد
    note: تُكمل Duminică الأسبوع. لقول اليوم استعمل هذه الصيغة المجردة؛ أما الصيغة المعرّفة duminica فتعني «أيام الأحد».
    example_gloss: اليوم هو الأحد.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: اسأل عن اليوم
    gloss: أيّ يوم هو اليوم؟
    note: الطريقة اليومية للسؤال عن يوم الأسبوع -- zi (يوم) هي الكلمة الجديدة هنا، إلى جانب ce وeste وastăzi المألوفة.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: أسبوع، أمس، الأسبوع الماضي والقادم
    gloss: săptămână (أسبوع) / ieri (أمس) / săptămâna trecută (الأسبوع الماضي) / săptămâna viitoare (الأسبوع القادم)
    note: مجموعة مفردات إضافية مرتبطة بأسماء الأيام -- مفيدة للحديث عن التواريخ بصورة نسبية، ولا يُدرَّب عليها في تمارين هذه الوحدة بقدر ما يُدرَّب على أسماء الأيام نفسها.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: الأيام تُكتب بحروف صغيرة
    gloss: 'لا تُكتب أسماء الأيام بحرف كبير: luni, vineri.'
    note: الكتابة العربية لا تعرف الحروف الكبيرة، أما في الرومانية فتُكتب أسماء الأيام بحرف صغير في وسط الجملة -- *luni* وليس *Luni*، إلا إذا افتتحت الكلمة الجملة.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: يناير، فبراير، مارس
    gloss: ianuarie (يناير) / februarie (فبراير) / martie (مارس)
    note: بخلاف أسماء الأيام، فإن عدة أسماء أشهر قريبة الشبه بأسماء الأشهر الشائعة في العربية (يناير، فبراير، مارس) لأن أصلها لاتيني.
    example_gloss:
    - إنه شهر يناير.
    - إنه شهر فبراير.
    - إنه شهر مارس.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: أبريل، مايو، يونيو
    gloss: أبريل / مايو / يونيو
    note: كلمة mai (مايو) قصيرة لكنها تختلف عن mai الظرف (أكثر) المستخدم في مواضع أخرى من هذا المساق (ce mai faci)، والسياق يحدد المعنى دائمًا.
    example_gloss:
    - إنه شهر أبريل.
    - إنه شهر مايو.
    - إنه شهر يونيو.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: يوليو، أغسطس، سبتمبر
    gloss: يوليو / أغسطس / سبتمبر
    note: تُشبه كلمة august في نطقها كلمة «أغسطس» العربية إلى حد كبير، وهي من أوضح الكلمات المتشابهة في هذه المجموعة.
    example_gloss:
    - إنه شهر يوليو.
    - إنه شهر أغسطس.
    - إنه شهر سبتمبر.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: أكتوبر، نوفمبر، ديسمبر
    gloss: أكتوبر / نوفمبر / ديسمبر
    note: تُكمل الأشهر الثلاثة الأخيرة مجموعة الأشهر الاثني عشر، وكلها أسماء لا تتغير صيغتها.
    example_gloss:
    - إنه شهر أكتوبر.
    - إنه شهر نوفمبر.
    - إنه شهر ديسمبر.
  ro.a1.unit03.lesson02.teach.intai:
    title: الأول (من الشهر)
    gloss: الأول
    note: 'هذه قاعدة رومانية خاصة: في الاستعمال المعياري لا يُسمّى اليوم الأول من الشهر *unu* (أي «واحد» العادية)، بل له كلمته الخاصة *întâi*. (قد تسمع *unu* في الكلام العفوي، لكن *întâi* هي الصيغة التي يجب تعلّمها.) أما كل التواريخ الأخرى، من اليوم الثاني فصاعدًا، فتستخدم العدد الأصلي العادي.'
    example_gloss: اليوم هو الأول من أغسطس.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: كيف نذكر التاريخ في اللغة الرومانية
    gloss: 'اليوم الأول: întâi · من اليوم الثاني فما بعده: العدد العادي (doi, trei, patru...)'
    note: بعد اليوم الأول، يكون التاريخ في الرومانية العدد الأصلي العادي (الذي مرّ سابقًا) متبوعًا بالشهر، دون صيغة ترتيبية ودون كلمة إضافية، مثل *trei aprilie* (الثالث من أبريل، وحرفيًا «ثلاثة أبريل»).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: السؤال عن التاريخ
    gloss: ما تاريخ اليوم؟
    note: Dată (تاريخ) كلمة جديدة هنا؛ أما بقية السؤال فتعيد استخدام ce وeste وastăzi تمامًا كما في سؤال اليوم في الدرس الأول.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: ذكر التاريخ
    gloss: اليوم هو الثالث من أبريل.
    note: Trei (ثلاثة) هو من أعداد الوحدة الثانية؛ ولا تُضاف نهاية ترتيبية ولا كلمة إضافية قبل aprilie.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: تهنئة في مناسبة خاصة
    gloss: عيد ميلاد سعيد! / سنة جديدة سعيدة!
    note: حرفيًا «لسنوات عديدة»، وهي أكثر عبارات التهنئة الرومانية شيوعًا في عيد الميلاد أو عيد الاسم أو رأس السنة، وتعيد استخدام *ani* (سنوات) من محتوى العمر في الوحدة الثانية.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: أسماء الأشهر تُكتب بحرف صغير أيضًا
    gloss: 'لا تُكتب أسماء الأشهر بحرف كبير: ianuarie, mai.'
    note: 'هي القاعدة نفسها المتعلقة بأسماء أيام الأسبوع في الدرس الأول: تبقى أسماء الأشهر الرومانية بحرف صغير في وسط الجملة.'
  ro.a1.unit03.lesson03.teach.cand:
    title: متى؟
    gloss: متى؟
    note: تفتتح كلمة Când سؤالًا عن الوقت، وتؤدي الدور نفسه الذي تؤديه «متى» في العربية.
    example_gloss: متى الاجتماع؟
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: الاجتماع
    gloss: الاجتماع
    note: Întâlnirea هي صيغة التعريف (الاجتماع)، أما الاسم المجرّد فهو întâlnire.
    example_gloss: الاجتماع يوم الاثنين.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: اسأل عن موعد شيء ما
    gloss: متى الاجتماع؟
    note: تجمع هذه الجملة بين când وeste المألوفة وكلمة întâlnirea الجديدة في هذا الدرس.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: اذكر تاريخ حدث ما
    gloss: الاجتماع يوم الجمعة، الأول من أغسطس.
    note: يمكن ذكر يوم الأسبوع والتاريخ معًا مفصولين بفاصلة، كما في العربية.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: لا حاجة إلى de مع الأيام والتواريخ
    gloss: 'الأيام والتواريخ لا تحتاج إلى «de»: vineri, întâi august.'
    note: 'هذا يقابل قاعدة الوحدة الثانية: الأعداد من 20 فما فوق تحتاج إلى *de* قبل الاسم العادي (*treizeci de ani*)، أما يوم الأسبوع أو التاريخ فيأتي مباشرة دون *de* إطلاقًا.'
  ro.a1.unit03.lesson03.teach.line01:
    title: اسأل متى الاجتماع
    gloss: تسأل آنا ميهاي متى موعد اجتماعهما.
    note: سؤال بسيط محايد في درجة الرسمية، فلا تتغير este مع tu أو dumneavoastră.
  ro.a1.unit03.lesson03.teach.line02:
    title: ذكر التاريخ
    gloss: يقول ميهاي إن الاجتماع يوم الجمعة، الأول من أغسطس.
    note: 'يعيد ميهاي نمط التاريخ نفسه من الدرس الثاني: يوم الأسبوع، ثم întâi + الشهر، دون de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: الرد والختام
    gloss: تشكره آنا وتودّعه.
    note: La revedere، التي تعلّمناها في الوحدة الأولى، تختم الحوار بالطريقة المعتادة نفسها.
  ro.a1.unit03.lesson03.teach.line04:
    title: ختام اللقاء
    gloss: يردّ ميهاي الوداع مستخدمًا اسم آنا.
    note: ترديد la revedere مع اسم الشخص الآخر طريقة طبيعية وودودة لختام الحديث.
