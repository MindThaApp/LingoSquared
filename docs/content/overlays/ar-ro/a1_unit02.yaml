answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: الرومانية A1
  description: الأعداد من الصفر إلى المئة، بما فيها أنماط تكوين الأعداد من 11 إلى 19 (-sprezece) والعقود (-zeci)، والفرق بين doi و două بحسب الجنس، واستعمال الأعداد للسؤال عن العمر ورقم الهاتف والإجابة عنهما، مع متابعة شخصيتَي Ana و Mihai من الوحدة الأولى.
units:
  ro.a1.unit02.numbers:
    title: الأعداد
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: الأعداد من صفر إلى عشرة
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: الأعداد من أحد عشر إلى مئة
  ro.a1.unit02.lesson03.age_and_phone:
    title: العمر ورقم الهاتف
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: '*Zero* لا يتغيّر، ويُستعمل أيضًا لقراءة رقم واحد داخل عدد أطول أو رقم هاتف.'
    example_gloss: صفر، واحد، اثنان.
  ro.a1.unit02.lesson01.teach.unu:
    title: واحد
    gloss: واحد
    note: '*Unu* هي الصيغة المستعملة عند العدّ وحده. قبل اسم مذكر أو محايد تُختصر إلى *un* (*un câine*، كلب واحد)؛ وقبل اسم مؤنث تصبح *o* (*o sută*، مئة).'
    example_gloss: واحد، اثنان، ثلاثة.
  ro.a1.unit02.lesson01.teach.doi:
    title: اثنان (مذكر)
    gloss: اثنان
    note: يُستعمل *Doi* مع الأسماء المذكرة (*doi bărbați*، رجلان). أما الأسماء المؤنثة، والمحايدة التي تعامَل معاملة المؤنث في الجمع، فتأخذ صيغة أخرى؛ انظر البطاقة التالية.
    example_gloss: اثنان، ثلاثة، أربعة.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: يتغيّر العدد اثنان بحسب الجنس
    gloss: doi (للمذكر) / două (للمؤنث والمحايد)
    note: كما يتغيّر العدد «اثنان» في العربية بحسب الجنس (اثنان/اثنتان)، فللعدد *doi* في الرومانية صيغة مؤنثة هي *două*، تلزم مع الأسماء المؤنثة (*două femei*، امرأتان) ومع الأسماء المحايدة التي تأخذ صيغة المؤنث في الجمع (*două numere*، رقمان). وما عدا الواحد (*un*/*o*) والاثنين، تبقى الأعداد من *trei* إلى *zece* على حالها مع كل الأجناس.
  ro.a1.unit02.lesson01.teach.trei:
    title: ثلاثة
    gloss: ثلاثة
    note: '*Trei* لا يتغيّر مع أي جنس.'
    example_gloss: ثلاثة، أربعة، خمسة.
  ro.a1.unit02.lesson01.teach.patru:
    title: أربعة
    gloss: أربعة
    note: '*Patru* لا يتغيّر. انتبه إلى صيغته المختصرة غير المنتظمة في الأعداد من 11 إلى 19: *paisprezece* (14) وليس *patrusprezece*.'
    example_gloss: أربعة، خمسة، ستة.
  ro.a1.unit02.lesson01.teach.cinci:
    title: خمسة
    gloss: خمسة
    note: '*Cinci* لا يتغيّر.'
    example_gloss: خمسة، ستة، سبعة.
  ro.a1.unit02.lesson01.teach.sase:
    title: ستة
    gloss: ستة
    note: '*Șase* لا يتغيّر.'
    example_gloss: ستة، سبعة، ثمانية.
  ro.a1.unit02.lesson01.teach.sapte:
    title: سبعة
    gloss: سبعة
    note: '*Șapte* لا يتغيّر.'
    example_gloss: سبعة، ثمانية، تسعة.
  ro.a1.unit02.lesson01.teach.opt:
    title: ثمانية
    gloss: ثمانية
    note: '*Opt* لا يتغير شكله.'
    example_gloss: ثمانية، تسعة، عشرة.
  ro.a1.unit02.lesson01.teach.noua:
    title: تسعة
    gloss: تسعة
    note: '*Nouă* لا يتغير شكله. لو كُتب دون العلامة فوق الحرف لصار مطابقًا لـ*noua* («الجديدة» بصيغة المؤنث)، لذا اكتب *ă*: تُفحص الإجابات المكتوبة مع علاماتها.'
    example_gloss: تسعة، عشرة... انتهينا!
  ro.a1.unit02.lesson01.teach.zece:
    title: عشرة
    gloss: عشرة
    note: '*Zece* لا يتغير شكله، وهو أساس كل الأعداد من أحد عشر فما فوق (*zece* + *-sprezece*).'
    example_gloss: عشرة! أحسنت!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: أحد عشر
    gloss: أحد عشر
    note: '*Unsprezece* مبني حرفيًا من *unu* + *spre* + *zece* («واحد فوق عشرة»)، وهو النمط الذي تسير عليه الأعداد من 11 إلى 19.'
    example_gloss: عشرة، أحد عشر، اثنا عشر.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: من اثني عشر إلى تسعة عشر
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'يُلحِق كل عدد من هذه الأعداد *-sprezece* بالصيغة العادية للرقم: *doi* → *doisprezece*، *trei* → *treisprezece*، وهكذا حتى *nouă* → *nouăsprezece*. وفي عددين شذوذ: الرقم أربعة عشر، إذ يُختصر *patru* إلى *pai-* (*paisprezece* وليس *patrusprezece*)، والرقم ستة عشر، إذ يصبح *șase* هو *șai-* (*șaisprezece* وليس *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: عشرون
    gloss: عشرون
    note: '*Douăzeci* («عشرتان») كلمة قائمة بذاتها، وهي أساس الأعداد من 21 إلى 29.'
    example_gloss: تسعة عشر، عشرون...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: واحد وعشرون
    gloss: واحد وعشرون
    note: 'ابتداءً من واحد وعشرين، تربط الرومانية العشرة بالوحدة بالكلمة *și* («و»): *douăzeci și unu*، *douăzeci și doi*، وهكذا، بخلاف الأعداد من 11 إلى 19 التي تندمج في كلمة واحدة.'
    example_gloss: عشرون، واحد وعشرون، اثنان وعشرون.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: من ثلاثين إلى تسعين
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'كل عقد من الثلاثين فصاعدًا هو الرقم + *-zeci* («عشرات») -- *trei* → *treizeci*، *patru* → *patruzeci*، وهكذا. التغيير الإملائي الوحيد في الستين: يصبح *șase* هو *șai-* فنحصل على *șaizeci* (وهو *șai-* نفسه في *șaisprezece*). ولا يوجد في الرومانية عدّ بالعشرينات للأعداد 70 و80 و90 كما في الفرنسية.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: مئة
    gloss: مئة
    note: تستعمل *O sută* الكلمة *o* (صيغة المؤنث لـ«واحد») لا *un*، لأن *sută* اسم مؤنث.
    example_gloss: تسعون، مئة!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: السؤال عن العمر بصيغة غير رسمية
    gloss: كم عمرك؟
    note: حرفيًا «كم سنةً تملك»، فالرومانية تستعمل الفعل *avea* (يملك) للتعبير عن العمر، بخلاف العربية التي تقول «كم عمرك»، وكما في الفرنسية *avoir*. وتتفق *Câți* (كم، للمذكر) مع *ani* (سنوات، مذكر).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: اذكر عمرك (أقل من عشرين)
    gloss: عمري تسعة عشر عامًا.
    note: '*Am* هي صيغة *eu* من الفعل *avea*. لا حاجة إلى *de* قبل *ani* مع الأعداد الأقل من عشرين.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: السؤال عن العمر بصيغة رسمية
    gloss: كم عمرك؟
    note: '*Aveți* هي صيغة *dumneavoastră* من الفعل *avea*، بما يوافق مستوى التأدب الذي ورد في الوحدة 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: اذكر عمرك (عشرون فما فوق)
    gloss: عمري ثلاثون عامًا.
    note: تظهر *De* هنا لأن *treizeci* عدد يبلغ عشرين أو أكثر -- انظر البطاقة التالية للقاعدة الكاملة.
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: متى نضيف de قبل الاسم
    gloss: '2-19: بدون de (doi ani) / 20 فما فوق: تُضاف de (treizeci de ani)'
    note: 'قاعدة خاصة بالرومانية ولا نظير لها في العربية: الأعداد من 2 إلى 19 تتصل بالاسم مباشرة (*doi ani*: سنتان، *nouăsprezece ani*: تسع عشرة سنة)، أما من 20 فما فوق فتلزم *de* بين العدد والاسم (*treizeci de ani*: ثلاثون سنة، *o sută de ani*: مئة سنة). والعدد «واحد» حالة خاصة (*un an*: سنة واحدة -- مفرد، دون *de* في الحالتين).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: اسأل عن رقم الهاتف بصيغة غير رسمية
    gloss: ما رقم هاتفك؟
    note: تُستعمل *Care* (أيّ / ما) عند السؤال عن رقم محدد موجود، لا *ce*. و*Număr* اسم محايد؛ وفي المفرد يتبع اسمَ المذكر في التوافق، فضمير المخاطب *ـك* هنا هو *tău* لا *ta*.
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: اسأل عن رقم الهاتف بصيغة رسمية
    gloss: ما رقم هاتفك؟
    note: '*Este* هي الصيغة الكاملة من *e*، وهي أكثر شيوعًا في الكلام المتأنّي أو الرسمي. وتُبقي *Dumneavoastră* الحوار مؤدبًا، وهي الكلمة نفسها التي وردت في الوحدة 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: اذكر رقم هاتف رقمًا رقمًا
    gloss: 'إنه: صفر، سبعة، اثنان، واحد، أربعة، خمسة، ستة، سبعة، ثمانية، تسعة.'
    note: تكتفي هذه الوحدة بقراءة الأرقام رقمًا رقمًا، وهو التبسيط نفسه الذي اتبعته الوحدة 1 في اختيار مستوى الخطاب -- وقد يجمع المتحدث الفعلي الأرقام مثنى مثنى، لكن الأرقام المفردة مفهومة دائمًا.
