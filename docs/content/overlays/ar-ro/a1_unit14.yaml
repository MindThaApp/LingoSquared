teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'تذكير: mare'
    gloss: كبير
    note: ورد سابقًا في الوحدة 3 ("literă mare"، أي حرف كبير) والوحدة 5 ("o familie mare"، أي أسرة كبيرة)، وله هنا شريك حقيقي للمقارنة هو *mic/mică*.
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'تذكير: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: القهوة · الشاي · الخبز · قهوة · شاي
    note: كلها من الوحدة 6 والوحدة 13؛ تستعمل هذه الوحدة الصيغ المعرّفة بوصفها الأشياء التي يُقارَن حجمها، وتعيد استعمال الصيغ النكرة في تمرين المطابقة في هذا الدرس.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: صغير
    gloss: صغير (مذكر/محايد) · صغيرة (مؤنث)
    note: 'تتطابق الصفات الرومانية مع الاسم الذي تصفه: فـ *ceai* (شاي) يأخذ صيغة المذكر/المحايد *mic*، أما *cafea* (قهوة) و*pâine* (خبز) فمؤنثتان وتأخذان *mică*. أما *Mare* (كبير) فلها الصيغة نفسها للمذكر والمؤنث في المفرد، ولهذا لم تحتج إلى هذا التفريق.'
    example_gloss:
    - الشاي صغير.
    - القهوة صغيرة.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: الشاي صغير
    gloss: الشاي صغير.
    note: '*Ceaiul* محايد، لذلك يأخذ صيغة المذكر/المحايد *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: القهوة صغيرة
    gloss: القهوة صغيرة.
    note: '*Cafeaua* مؤنثة، لذلك تأخذ صيغة المؤنث *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: الخبز صغير
    gloss: Pâinea e mică. (الخبز صغير.)
    note: '*Pâinea* مؤنثة أيضًا، لذلك تأخذ *mică* مثل *cafeaua* تمامًا.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'تذكير: Mare, Mic, Mică'
    gloss: Mare (كبير) · Mic (صغير، للمذكر/المحايد) · Mică (صغيرة، للمؤنث)
    note: كلها من الدرس الأول في هذه الوحدة -- وهنا تظهر لها صيغة المقارنة.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'تذكير: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (القهوة) · ceaiul (الشاي) · pâinea (الخبز)
    note: كلها من الوحدة 13، وتُستعمل هنا مرة أخرى بوصفها الأشياء التي تتم المقارنة بينها.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: أكثر (للمقارنة)
    gloss: Mai (أكثر، أداة المقارنة)
    note: 'ليست *mai* بمعنى الشهر (مايو، الوحدة 3). إنها الكلمة الصغيرة نفسها التي رأيتها في ''Ce mai faceți?'' (الوحدة 1)، لكنها هنا تؤدي وظيفة أخرى بوصفها أداة المقارنة: ضع *mai* قبل الصفة لتعني «أكثر ___»، وهذه هي الطريقة المعتادة في الرومانية لتكوين المقارنة.'
    example_gloss:
    - القهوة أكبر.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: القهوة أكبر
    gloss: Cafeaua e mai mare. (القهوة أكبر.)
    note: '*Mai* + الصفة -- دون أي تغيير آخر.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: من
    gloss: Decât (من، في المقارنة)
    note: تُكمل المقارنة -- *mai* + الصفة + *decât* + الشيء الثاني الذي تتم مقارنته.
    example_gloss:
    - القهوة أكبر من الشاي.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: القهوة أكبر من الشاي
    gloss: Cafeaua e mai mare decât ceaiul. (القهوة أكبر من الشاي.)
    note: 'نمط المقارنة الكامل: [الشيء] + e + mai + [الصفة] + decât + [الشيء الثاني].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: الخبز أصغر من القهوة
    gloss: Pâinea e mai mică decât cafeaua. (الخبز أصغر من القهوة.)
    note: النمط نفسه مع *mică*، صيغة المؤنث لكلمة «صغير» من الدرس الأول في هذه الوحدة.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'تذكير: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (أكثر) · Decât (من) · Mare (كبير) · Mic (صغير، للمذكر/المحايد) · Mică (صغيرة، للمؤنث)
    note: كلها من الدرسين الأول والثاني في هذه الوحدة -- وهنا تستعملها Ana وMihai معًا.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'تذكير: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (القهوة) · ceaiul (الشاي) · pâinea (الخبز)
    note: كلها من الوحدة 13 -- الأشياء الثلاثة التي تقارن بينها Ana وMihai.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'تذكير: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · Ana, Mihai (اسمان)
    note: كلها وردت في وحدات سابقة -- نمط الافتتاح والختام الودي نفسه الذي استعملته كل حوارات هذه الدورة.
  ro.a1.unit14.lesson03.teach.line01:
    title: التحية والسؤال عن الحجم
    gloss: يحيّي Mihai الفتاة Ana ويسأل هل القهوة كبيرة أم صغيرة.
    note: يستعمل *mare sau mică* (كبيرة أم صغيرة) من هذه الوحدة ليفتح سؤالًا عن الحجم، وهو شكل «X sau Y؟» نفسه لعرض خيارين، الذي ظهر في *cafea sau ceai?* في الوحدة 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: وصف حجم المشروبين
    gloss: تقول Ana إن القهوة كبيرة والشاي صغير.
    note: تذكر حقيقة بسيطة عن الحجم لا تفضيلًا -- فهذا الحوار لا يقول من يحب أو يطلب أي مشروب، بل فقط ما حجم كل منهما.
  ro.a1.unit14.lesson03.teach.line03:
    title: السؤال للتأكد من المقارنة
    gloss: يسأل Mihai هل القهوة أكبر من الشاي.
    note: يحوّل الحقيقتين المنفصلتين اللتين ذكرتهما Ana (السطر الثاني) إلى مقارنة مباشرة باستعمال *mai mare decât*، وهي البنية الأساسية في هذه الوحدة.
  ro.a1.unit14.lesson03.teach.line04:
    title: التأكيد وإضافة الخبز
    gloss: تؤكد Ana، ثم تقول إن الخبز أصغر من القهوة.
    note: تعيد استعمال *mai ... decât* مع الشيء الثالث *pâinea*، وهذه المرة بصيغة المقارنة *mai mică*.
  ro.a1.unit14.lesson03.teach.line05:
    title: التأكيد والشكر والوداع
    gloss: يؤكد Mihai أن الخبز صغير، ويشكر Ana، ويودّعها.
    note: نمط الختام نفسه الذي انتهت به حوارات كل الوحدات السابقة.
  ro.a1.unit14.lesson03.teach.line06:
    title: إنهاء المحادثة
    gloss: تردّ Ana بالوداع وتذكر اسم Mihai.
    note: نمط الختام الودي نفسه الذي انتهت به حوارات كل الوحدات السابقة.
