teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'تذكير: un، doi، cinci، zece، douăzeci'
    gloss: un (واحد) · doi (اثنان) · cinci (خمسة) · zece (عشرة) · douăzeci (عشرون)
    note: وردت كلها في وحدات سابقة (*un* في الوحدة 4، والأعداد في الوحدة 2)، وها هي تعود هنا للحديث عن الأسعار.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: بكم هذا؟
    gloss: Cât costă? (كم سعره؟)
    note: 'الطريقة اليومية للسؤال عن السعر بالرومانية: أضف اسم السلعة بعدها، أو استخدمها وحدها هكذا عندما تكون السلعة واضحة من السياق.'
  ro.a1.unit07.lesson01.teach.leu:
    title: ليو (العملة)
    gloss: leu (وحدة العملة الرومانية، وجمعها lei)
    note: عملة رومانيا. Leu مفرد (ليو واحد)، أما الجمع lei فجمع شاذ، وليس leu مع نهاية عادية.
    example_gloss: سعره ليو واحد.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: سعره ثمانية lei
    gloss: Costă opt lei. (سعره ثمانية ليو.)
    note: مع الأعداد من 2 إلى 19 تبقى lei كما هي، دون كلمة إضافية قبلها.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: سعره ثلاثون lei
    gloss: Costă treizeci de lei. (سعره ثلاثون ليو.)
    note: ابتداءً من العدد 20 تضيف الرومانية *de* قبل المعدود، وهي القاعدة نفسها التي علّمتها الوحدة 2 مع *ani* (سنوات)، وتُطبَّق الآن على *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'قاعدة: leu ← lei، ومتى نضيف de'
    gloss: 'leu ← lei · الأعداد 2-19: بلا *de* · الأعداد 20 فما فوق: نضيف *de*'
    note: النمط نفسه تمامًا الخاص بقاعدة *ani* في الوحدة 2 (câți ani ai / am treizeci de ani)؛ فإذا عرفته مع اسم واحد، ينطبق بالطريقة نفسها على lei.
  ro.a1.unit07.lesson01.teach.scump:
    title: غالٍ
    gloss: scump (غالٍ)
    note: ردّ فعل شائع على سعر تراه مرتفعًا جدًا.
    example_gloss: ثمانية ليو؟ غالٍ!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: رخيص
    gloss: ieftin (رخيص)
    note: عكس scump، أي سعر جيد.
    example_gloss: ليو واحد؟ رخيص!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'تذكير: un، o، și، aș dori، vă rog، te rog'
    gloss: un/o (أداة التنكير) · și (و) · aș dori (أود) · vă rog (من فضلك، رسمي) · te rog (من فضلك، غير رسمي)
    note: ظهرت *Aș dori* و*vă rog* و*te rog* أول مرة في مشهد المقهى في الوحدة 6، وها هي تعود هنا في السوق.
  ro.a1.unit07.lesson02.teach.piata:
    title: السوق
    gloss: piață (سوق)
    note: 'اسم مؤنث: السوق المكشوفة أو المغطاة التي تُشترى منها المواد الغذائية الطازجة.'
    example_gloss: كم سعره في السوق؟
  ro.a1.unit07.lesson02.teach.rosii:
    title: الطماطم
    gloss: roșii (طماطم)
    note: جمع roșie (حبة طماطم)، ويُستخدم الجمع عند الحديث عن شرائها عمومًا.
    example_gloss: أودّ طماطم.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: البطاطس
    gloss: cartofi (بطاطس)
    note: جمع cartof (حبة بطاطس)، على النمط نفسه مثل roșii.
    example_gloss: أود بعض البطاطس.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (كيلوغرام)
    note: 'الوحدة المعتادة لشراء الخضار بالوزن. تربطها *de* بما يُشترى: *kilogram de roșii* أي «كيلوغرام من الطماطم».'
    example_gloss: كيلوغرام من الطماطم.
  ro.a1.unit07.lesson02.teach.vreau:
    title: أريد
    gloss: vreau (أريد)
    note: أبسط وأكثر مباشرة من *aș dori* («أود»)؛ وكلاهما مقبول في السوق، لكن vreau أقل رسمية.
    example_gloss: أريد بطاطس.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: أين يمكنني أن أشتري ...؟
    gloss: Unde pot să cumpăr roșii? (أين يمكنني أن أشتري الطماطم؟)
    note: سؤال مفيد عندما لا تعرف أين تتسوق؛ بدّل roșii بأي سلعة أخرى تبحث عنها.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: كم سعر كيلوغرام الطماطم؟
    gloss: Cât costă un kilogram de roșii? (كم سعر كيلوغرام من الطماطم؟)
    note: يجمع Cât costă وتركيب kilogram de ... في سؤال كامل واحد.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: أريد كيلوغرامًا من البطاطس
    gloss: Vreau un kilogram de cartofi. (أريد كيلوغرامًا من البطاطس.)
    note: نمط kilogram de ... نفسه، لكن هذه المرة في جملة خبرية مع vreau بدل السؤال.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'تذكير: bună، ziua، mulțumesc، bine، la revedere، Ana، Mihai'
    gloss: bună ziua (نهارك سعيد / مرحبًا) · mulțumesc (شكرًا) · bine (جيد / بخير) · la revedere (إلى اللقاء) · Ana، Mihai (اسمان)
    note: سبق أن تعلمتها كلها في حوارات الوحدتين 1 و6؛ وهنا تلتقي آنا وميهاي من جديد، لكن في السوق.
  ro.a1.unit07.lesson03.teach.line01:
    title: التحية والسؤال عن السعر
    gloss: تحيّي آنا ميهاي وتسأله عن سعر كيلوغرام من الطماطم.
    note: يجمع بين Cât costă من هذه الوحدة وتحية الوحدة 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: ذكر السعر
    gloss: يقول ميهاي إن سعره ثمانية ليو، ويعلّق بأنه رخيص.
    note: يعيد استخدام costă وopt lei وieftin من هذه الوحدة.
  ro.a1.unit07.lesson03.teach.line03:
    title: الطلب بأدب وإضافة سلعة
    gloss: توافق آنا، وتطلب كيلوغرامًا من الطماطم بأدب، وتضيف أنها تريد البطاطس أيضًا.
    note: يجمع aș dori وvă rog وvreau، أي مستويَي الكلام من مفردات هذه الوحدة في سطر واحد.
  ro.a1.unit07.lesson03.teach.line04:
    title: ذكر السعر الثاني
    gloss: يقول ميهاي إن كيلوغرامًا من البطاطس سعره خمسة ليو.
    note: يعيد استخدام zece (عشرة) من الوحدة 2، التي سبق أن ذُكّرتَ بها في الدرس الأول من هذه الوحدة.
  ro.a1.unit07.lesson03.teach.line05:
    title: الشكر والختام
    gloss: تشكر آنا ميهاي وتودّعه.
    note: '*Mulțumesc* هنا مجرد شكر ختامي بسيط، وهي الكلمة نفسها في *Bine, mulțumesc.* من الوحدة 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: إنهاء اللقاء
    gloss: يرد ميهاي بالوداع مستخدمًا اسم آنا.
    note: نمط الختام الودي نفسه الذي انتهت به حوارات الوحدات 1 و5 و6.
