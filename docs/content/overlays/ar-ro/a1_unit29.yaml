teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: السؤال عن السعر الإجمالي
    gloss: كم يكلّف في المجموع؟
    note: '*În total* («في المجموع») توضح أنك تريد السعر الكلي لا سعر قطعة واحدة؛ و*Cât costă?* تسأل «كم يكلّف؟».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: ذكر السعر الإجمالي
    gloss: تكلّف مئة ليو في المجموع.
    note: '*Costă* هي صيغة الغائب المفرد من *a costa* (يكلّف). بعد الأعداد فوق 19 تضيف الرومانية *de* قبل الاسم: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: '*A plăti cu cardul* تعني الدفع بالبطاقة و*a plăti în numerar* تعني الدفع نقدًا؛ *cu* تعني «بـ» و*în* تعني «في».'
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: '*Pot plăti* («يمكنني أن أدفع») هي *a putea* + فعل؛ و*aici* («هنا») تحدد أن السؤال عن المكان الذي أنت فيه.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*Doriți să plătiți ...?* صيغة رسمية (*dumneavoastră*) يستخدمها أمين الصندوق مع شخص لا يعرفه؛ ومع صديق تقول *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: الفاتورة
    gloss: الفاتورة
    note: 'اسم مؤنث: *o notă*، *nota* (أداة التعريف تلتصق بنهاية الكلمة).'
    example_gloss: هل نقسّم الفاتورة؟
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: '*Hai să* + فعل تقترح فعل شيء معًا.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: '*Separat* («بشكل منفصل») تأتي بعد *a plăti*؛ و*Pot plăti separat?* هو الطلب المعتاد حين يدفع كل شخص حصته.'
  ro.a1.unit29.lesson04.teach.restul:
    title: الباقي
    gloss: الباقي
    note: '*Restul* تعني حرفيًا «الباقي»، وبها تسمّي الرومانية المبلغ الذي تستعيده؛ وأداة التعريف تلتصق بنهاية الكلمة.'
    example_gloss: تفضّل، هذا هو الباقي.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: تسليم الباقي
    gloss: تفضّل، هذا هو الباقي.
    note: '*Poftiți* صيغة رسمية (*dumneavoastră*) بمعنى «تفضّل/تفضّلوا»، وتناسب الأسلوب الرسمي عند الصندوق.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: '*A avea nevoie de* («يحتاج إلى») تأتي مع *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: خمسة وثلاثون
    gloss: خمسة وثلاثون
    note: 'تكوّن الرومانية الأعداد من 21 إلى 99 باستخدام *și*: *treizeci și cinci* (حرفيًا «ثلاثون وخمسة»)، وتضيف *de* قبل الاسم: *o sută treizeci și cinci de lei*.'
    example_gloss: تكلّف مئة وخمسة وثلاثين ليو.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان رئيسيان وقهوتان. المجموع: مئة وخمسة وثلاثون ليو. مدفوعة بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      Nota: فاتورة
      două: اثنان
      feluri: أطباق رئيسية
      cafele: قهوتان
      Total: المجموع
      '135': مئة وخمسة وثلاثون
      lei: ليو
      Plătit: مدفوعة
      cardul: بطاقة
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: آنا تطلب الفاتورة
    gloss: 'آنا: هل نطلب الفاتورة؟'
    note: '*A cere* («يطلب») يأخذ *nota* مفعولًا به مباشرًا؛ و*Hai să cerem nota?* تقترح طلبها معًا.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: ميهاي يسأل عن المجموع
    gloss: 'ميهاي: نعم، فكرة جيدة. كم يكلّف في المجموع؟'
    note: يعيد استخدام سؤال *Cât costă în total?* من الدرس الأول.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: آنا تذكر المجموع
    gloss: 'آنا: المجموع مئة وخمسة وثلاثون ليو. هل نقسمها؟'
    note: '*Împărțim* هي صيغة *noi* (نحن) من *a împărți* (يقسّم)؛ و*nota* مفهومة من السياق.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: ميهاي يصرّ على الدفع
    gloss: 'ميهاي: لا، دعيني أدفع أنا اليوم. لقد ساعدتني كثيرًا.'
    note: '*Lasă-mă să* ... («دعني أن ...») هي الطريقة المعتادة لعرض القيام بشيء؛ و*m-ai ajutat* («لقد ساعدتني») صيغة ماضية.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: آنا متأثرة
    gloss: 'آنا: كم هذا لطيف منك! شكرًا جزيلًا.'
    note: '*Ce drăguț din partea ta!* («كم هذا لطيف منك») مجاملة دافئة شائعة لموقف كريم.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: ميهاي يسأل عن الدفع بالبطاقة
    gloss: 'ميهاي: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يعيد استخدام سؤال *Pot plăti cu cardul aici?* من الدرس الثاني، وهنا في المطعم فعلًا.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: صيغة الغائب المفرد'
    gloss: ميهاي يدفع الفاتورة.
    note: '*Plătește* هي صيغة الغائب المفرد من *a plăti* (يدفع).'
