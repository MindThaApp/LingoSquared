teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'تذكير: Ana, Este, Și'
    gloss: Ana (اسم) · Este (هو / يكون) · Și (و)
    note: Ana هو اسم الشخصية منذ الوحدة 1؛ و*este* من محتوى الأماكن في الوحدة 8؛ و*și* من الوحدة 5 — تعيد هذه الوحدة استخدام الثلاث لوصف طقس اليوم.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'تذكير: Astăzi'
    gloss: Astăzi (اليوم)
    note: من مفردات التاريخ في الوحدة 3 — تُستعمل هنا للحديث عن طقس اليوم.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: الطقس
    gloss: Vreme (الطقس)
    note: '*Vremea* هي صيغة التعريف من *vreme* — «الطقس»: اسم مؤنث ينتهي بـ -e يأخذ -a، مثل *baie* ← *baia* (الحمّام) في الوحدة 18.'
    example_gloss:
    - كيف الطقس؟
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: كيف الطقس؟
    gloss: Cum este vremea? (كيف الطقس؟)
    note: الطريقة المعتادة للسؤال عن الطقس — *cum* من الوحدة 1 والوحدة 9 والوحدة 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: شمس / مشمس
    gloss: Soare (شمس / مشمس)
    note: 'تُستعمل مع *este* لوصف الجو المشمس: *Este soare* حرفيًا «هو شمس»، ومعناها «الجو مشمس».'
    example_gloss:
    - الجو اليوم مشمس.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: دافئ / حار
    gloss: Cald (دافئ / حار)
    note: كلمة طقس ثابتة الصيغة — تُستعمل *Este cald* دائمًا بالصيغة نفسها دون أي تطابق.
    example_gloss:
    - الجو اليوم دافئ.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: الجو اليوم مشمس. إنه دافئ.
    gloss: Astăzi este soare. Este cald.
    note: كل كلمة هنا سبق تعلمها أو قُدّمت للتو، وقد جُمعت في جملتين جديدتين تصفان طقس اليوم.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'تذكير: Mihai, Mâine'
    gloss: Mihai (اسم) · Mâine (غدًا)
    note: Mihai هو اسم الشخصية منذ الوحدة 1؛ و*mâine* من الوحدة 3 والوحدة 12 — تعيد هذه الوحدة استخدامهما لوصف توقعات الغد.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'تذكير: Nu, Mergem, La parc'
    gloss: Nu (لا / ليس) · Mergem (نذهب) · La parc (إلى الحديقة)
    note: كلها من مفردات التخطيط والاتفاق في الوحدة 11 — تُستعمل هنا لتقرير ما إذا كان الطقس يسمح بالذهاب إلى الحديقة.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: المطر يهطل
    gloss: Plouă (تمطر)
    note: صيغة فعل غير شخصية — لا تحتاج إلى فاعل، كما أن *Este cald* لا تحتاج إليه.
    example_gloss:
    - غدًا تمطر.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: ريح
    gloss: Vânt (ريح)
    note: 'تُستعمل مع *este* بالطريقة نفسها مثل *soare*: *Este vânt*، أي «الجو عاصف».'
    example_gloss:
    - غدًا الجو عاصف.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: بارد
    gloss: Frig (بارد)
    note: 'تُستعمل مع *este*: *Este frig*، أي «الجو بارد».'
    example_gloss:
    - غدًا الجو بارد.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: غدًا تمطر. الجو عاصف وبارد.
    gloss: Mâine plouă. Este vânt și este frig.
    note: كل كلمة هنا سبق تعلمها أو قُدّمت للتو، وقد جُمعت في توقعات كاملة لطقس الغد.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: لا نذهب إلى الحديقة غدًا.
    gloss: Nu mergem la parc mâine. (لا نذهب إلى الحديقة غدًا.)
    note: الخطة المبنية على الطقس التي يتجه إليها هذا الدرس — تعيد استخدام *mergem* و*la parc* من الوحدة 11 مع *nu* قبلهما.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'تذكير: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (مرحبًا) · Ce mai faceți? (كيف حالكم؟ بصيغة رسمية) · Bine, mulțumesc (بخير، شكرًا)
    note: كلها من تحية الافتتاح في الوحدة 1، وتُستعمل هنا لبدء حوار هذه الوحدة.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'تذكير: Sâmbătă, La revedere'
    gloss: Sâmbătă (السبت) · La revedere (إلى اللقاء)
    note: '*Sâmbătă* من الوحدة 3 والوحدة 11 والوحدة 12؛ و*la revedere* من الوحدة 1 — وتُستعمل كلتاهما في حوار خطة عطلة نهاية الأسبوع.'
  ro.a1.unit19.lesson03.teach.line01:
    title: حيِّ Mihai واسأله عن حاله
    gloss: تحيّي Ana صديقها Mihai وتسأله عن حاله.
    note: تعيد استخدام تحية *Ce mai faceți?* من الوحدة 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: أجب واسأل عن طقس الغد
    gloss: يجيب Mihai، ثم يسأل Ana كيف سيكون الطقس غدًا.
    note: تجمع *Bine, mulțumesc* من الوحدة 1 مع عبارة الدرس الأول في هذه الوحدة *Cum este vremea?*، مع إضافة *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: صف توقعات الغد
    gloss: تخبره Ana أنها ستمطر غدًا، وأن الجو سيكون عاصفًا وباردًا.
    note: تعيد استخدام عبارة الدرس الثاني في هذه الوحدة كما هي.
  ro.a1.unit19.lesson03.teach.line04:
    title: اقترح عدم الذهاب إلى الحديقة والذهاب يوم السبت بدلًا من ذلك
    gloss: يقول Mihai إنهما لن يذهبا إلى الحديقة غدًا، ويسأل عن يوم السبت بدلًا من ذلك.
    note: تجمع عبارة الدرس الثاني في هذه الوحدة مع *mergem* من الوحدة 11 و*sâmbătă* من هذه الوحدة.
  ro.a1.unit19.lesson03.teach.line05:
    title: وافق مع ذكر أن الجو يوم السبت مشمس
    gloss: تقول Ana إن الجو يوم السبت سيكون مشمسًا، وتوافق على الخطة.
    note: تجمع *soare* مع عبارة الموافقة *Da, bine!* من الوحدة 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: قل وداعًا
    gloss: يودّع Mihai.
    note: نمط الختام نفسه الذي انتهى به حوار كل وحدة سابقة.
  ro.a1.unit19.lesson03.teach.line07:
    title: قل وداعًا
    gloss: تودّع Ana.
    note: نمط الختام نفسه الذي انتهى به حوار كل وحدة سابقة.
