  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: متى يبدأ الدرس؟
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'تذكير: este'
    gloss: يكون / هو
    note: ظهرت *Este* من قبل في الوحدتين الثانية والثالثة. وتبقى الكلمة نفسها تمامًا سواء ذكرت عددًا أو يومًا أو تاريخًا، أو الآن وقتًا.
  ro.a1.unit04.lesson01.teach.ora:
    title: الساعة
    gloss: الساعة
    note: اسم مؤنث؛ تُوضع *ora* مباشرة قبل العدد لذكر وقت على الساعة، مثل *ora unu* (الساعة الواحدة).
    example_gloss: الساعة الواحدة.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: الساعة الواحدة
    gloss: الساعة الواحدة
    note: 'حرفيًا «الساعة واحد»: تأتي كلمة ora أولًا ثم العدد.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: الساعة الثانية
    gloss: الساعة الثانية
    note: يأخذ العدد هنا صيغة المؤنث *două* ليتوافق مع *ora* المؤنثة. ستجد النمط الكامل في البطاقة التالية.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'شذوذ حقيقي: unu يبقى unu'
    gloss: ora unu (وليس "ora una") / ora două (وليس "ora doi")
    note: 'الأعداد التي لها صيغة مؤنثة تأخذها عادةً مع الاسم المؤنث (*doi* ← *două* مع اسم مؤنث مثل *ora*)، لكن *unu* هو الاستثناء الوحيد في قول الوقت: نقول دائمًا *ora unu* وليس *ora una*، مع أن *ora* مؤنثة.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: الساعة الثالثة
    gloss: الساعة الثالثة
    note: لا تتغير صيغة Trei بحسب الجنس إطلاقًا، بخلاف unu/una أو doi/două، فهذا أمر أقل تحتاج إلى تذكره.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: النصف
    gloss: نصف
    note: 'تُستعمل مع și (و) لقول «والنصف»: X și jumătate.'
    example_gloss: الواحدة والنصف.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: الواحدة والنصف
    gloss: الساعة الآن الواحدة والنصف.
    note: 'حرفيًا «الساعة واحد ونصف»: تركيب مباشر وواضح.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: 'الطريقة اليومية للسؤال عن الوقت: cât (كم، وهي قريبة من câți في الوحدة 2) + este + ora (الساعة).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: الربع
    gloss: ربع
    note: ربع ساعة، أي 15 دقيقة. يرتبط بـ și (و) أو fără (بدون) للدلالة على «والربع» أو «إلا ربعًا».
    example_gloss: الساعة الواحدة والربع.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și مقابل fără مع الربع أو النصف
    gloss: și un sfert = +15 دقيقة · fără un sfert = -15 دقيقة
    note: '*Și* (و) تضيف الدقائق إلى الساعة التي مضت، أما *fără* (بدون) فتطرح الدقائق من الساعة القادمة. وهذا قريب جدًا من العربية: «الثانية والربع» مقابل «الثالثة إلا ربعًا».'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: الثانية والربع
    gloss: الساعة الثانية والربع.
    note: Ora două (2:00) زائد și un sfert (+15 دقيقة) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: بدون / إلا
    gloss: بدون / إلا
    note: 'تطرح الدقائق من الساعة التالية، وتؤدي الدور نفسه الذي تؤديه «إلا» في العربية: «الثالثة إلا ربعًا».'
    example_gloss: الساعة الثالثة إلا ربعًا.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: الثالثة إلا ربعًا
    gloss: الساعة الثالثة إلا ربعًا.
    note: Ora trei (3:00) ناقص fără un sfert (-15 دقيقة) = 2:45. تُسمّي الرومانية الوقت بالساعة التي تقترب منها، لا بالساعة التي مضت.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: اسأل في أي ساعة
    gloss: في أي ساعة؟
    note: 'La (في) + ce (أي) + oră (ساعة، بصيغة النكرة هنا لا ora): الطريقة اليومية للسؤال عن موعد حدوث شيء.'
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: قل متى يحدث شيء
    gloss: في الساعة التاسعة.
    note: 'La (في) + ora (الساعة، بصيغة المعرفة هنا) + العدد: نمط الجواب عن ''La ce oră?''.'
  ro.a1.unit04.lesson02.teach.tarziu:
    title: متأخرًا
    gloss: متأخر
    note: كلمة شائعة ومفيدة للتعليق عند معرفة الوقت.
    example_gloss: لقد تأخر الوقت!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'تذكير: când'
    gloss: متى؟
    note: ظهرت Când في الوحدة 3 للسؤال عن موعد حدث ما، وهنا تعود للسؤال عن موعد بدء شيء.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: أجزاء اليوم
    gloss: الصباح / بعد الظهر / المساء / الليل
    note: كل كلمة من هذه الكلمات اسم بصيغة المعرفة يُستعمل ظرفًا. تقول الرومانية «في الصباح» مباشرة دون حرف جر، بخلاف العربية التي تحتاج عادةً إلى «في».
    example_gloss:
    - الدرس في الصباح.
    - الدرس بعد الظهر.
    - يعمل ميهاي في المساء.
    - تنام آنا في الليل.
  ro.a1.unit04.lesson03.teach.cursul:
    title: الحصة
    gloss: الدرس / المقرر
    note: صيغة المعرفة من curs (درس أو مقرر). المقصود هنا درس اللغة الرومانية لآنا وميهاي.
    example_gloss: تبدأ الحصة في الساعة التاسعة.
  ro.a1.unit04.lesson03.teach.incepe:
    title: يبدأ
    gloss: يبدأ
    note: 'صيغة المضارع للغائب أو الغائبة: أي فاعل مفرد غير «أنا» و«أنت»، مثل cursul (الدرس).'
    example_gloss: يبدأ الدرس في الصباح.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: اسأل متى يبدأ الدرس
    gloss: متى يبدأ الدرس؟
    note: تجمع هذه الجملة când مع începe وcursul الجديدتين في هذا الدرس.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: قل متى يبدأ الدرس
    gloss: يبدأ الدرس في الساعة التاسعة صباحًا.
    note: يُضاف ظرف جزء اليوم (dimineața) في آخر الجملة بعد فاصلة، كما أضافت الوحدة 3 التاريخ بعد يوم الأسبوع.
  ro.a1.unit04.lesson03.teach.line01:
    title: اسأل متى يبدأ الدرس
    gloss: تسأل آنا ميهاي متى يبدأ الدرس.
    note: 'سؤال بسيط محايد في مستوى الكلام: لا تتغير este وîncepe مع tu أو dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: قل الوقت
    gloss: يقول ميهاي إن الدرس يبدأ في التاسعة صباحًا.
    note: يستعمل ميهاي نمط الوقت وجزء اليوم الذي تعلمته في هذا الدرس.
  ro.a1.unit04.lesson03.teach.line03:
    title: اشكر وأنهِ الحديث
    gloss: تشكره آنا وتودّعه.
    note: La revedere، التي تعلمتها في الوحدة 1، تُنهي الحوار بالطريقة نفسها دائمًا.
  ro.a1.unit04.lesson03.teach.line04:
    title: أنهِ اللقاء
    gloss: يرد ميهاي بالوداع ويذكر اسم آنا.
    note: ترديد la revedere مع اسم الشخص الآخر طريقة طبيعية ودودة لإنهاء الحديث.
