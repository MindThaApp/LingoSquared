teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'تذكير: este وla وMihai'
    gloss: este (يكون) · la (في / عند) · Mihai (اسم)
    note: وردت Este في الوحدات 3 و4 و8؛ ووردت la في الوحدة 4 في *la ora nouă* (في الساعة التاسعة)؛ أما Mihai فهو اسم الشخصية منذ الوحدة 1 -- وتعيد هذه الوحدة استعمال الثلاثة للحديث عن عمله.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'تذكير: lucrez وlucrează'
    gloss: lucrez (أنا أعمل) · lucrează (هو / هي يعمل / تعمل)
    note: كلتاهما من الروتين اليومي في الوحدة 10 (*Lucrez seara.*) -- وتعيد هذه الوحدة استعمالهما للحديث عن المهنة بدل وقت اليوم.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: مهندس
    gloss: مهندس
    note: مذكر -- يستعمله Mihai وحده في هذه الوحدة (*Sunt inginer*)، فلا حاجة بعدُ إلى صيغة المؤنث.
    example_gloss:
    - Mihai مهندس.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: مكتب
    gloss: مكتب
    note: مكان العمل الذي يعمل فيه Mihai، مع حرف الجر *la* (في / عند) الذي سبق تعلمه في الوحدة 4.
    example_gloss:
    - هو يعمل في المكتب.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai مهندس. يعمل في المكتب.
    gloss: Mihai este inginer. Lucrează la birou.
    note: كل كلمة هنا سبق تعلمها أو قُدمت للتو، وجُمعت في جملتين جديدتين عن مهنة Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'تذكير: sunt وunde وAna'
    gloss: sunt (أنا) · unde (أين) · Ana (اسم)
    note: وردت Sunt في الوحدة 16 (*Sunt bolnav*)؛ ووردت unde في الوحدتين 7 و8 (*Unde pot să cumpăr...?* و*Unde este...?*)؛ أما Ana فهي اسم الشخصية منذ الوحدة 1 -- وتعيد هذه الوحدة استعمال الثلاثة للحديث عن عملها.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: معلّم
    gloss: معلمة
    note: مؤنث -- تستعمله Ana وحدها في هذه الوحدة (*Sunt profesoară*)، فلا حاجة بعدُ إلى صيغة المذكر.
    example_gloss:
    - أنا معلمة.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: مدرسة
    gloss: مدرسة
    note: مكان العمل الذي تعمل فيه Ana، مع استعمال *la* بالطريقة نفسها كما في *la birou*.
    example_gloss:
    - أعمل في المدرسة.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: أنا معلمة. أعمل في المدرسة.
    gloss: Sunt profesoară. Lucrez la școală.
    note: كلام Ana عن مهنتها، يجمع بين كلمتي هذا الدرس الجديدتين و*sunt* التي سبق تعلمها في الوحدة 16.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: أين تعمل؟
    gloss: أين تعملون؟ (صيغة الاحترام)
    note: '*Lucrați* هي صيغة الاحترام لـ «أنتم تعملون»، وتنتهي بـ -ați/-eți كما في *aveți* و*faceți* اللتين مرتا بنا -- وهي مفيدة لسؤال أي شخص عن عمله.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'تذكير: Bună وCe mai faceți? وBine, mulțumesc'
    gloss: Bună (مرحبًا) · Ce mai faceți? (كيف حالكم؟ بصيغة الاحترام) · Bine, mulțumesc (بخير، شكرًا)
    note: كلها من تحية الوحدة 1 الافتتاحية، وتُستعمل هنا لبدء حوار هذه الوحدة.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'تذكير: Și dumneavoastră? وLa revedere'
    gloss: Și dumneavoastră? (وأنتم؟ بصيغة الاحترام) · La revedere (إلى اللقاء)
    note: كلتاهما من الوحدة 1، وتُستعملان هنا سؤالًا تابعًا طبيعيًا وعبارة ختام.
  ro.a1.unit17.lesson03.teach.line01:
    title: التحية والسؤال عن الحال
    gloss: تحيّي Ana السيد Mihai وتسأله عن حاله.
    note: تعيد استعمال تحية *Ce mai faceți?* من الوحدة 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: الجواب ثم السؤال عن مكان عملها
    gloss: يجيب Mihai، ثم يسأل Ana أين تعمل.
    note: تجمع بين *Bine, mulțumesc* من الوحدة 1 و*Unde lucrați?* من هذه الوحدة.
  ro.a1.unit17.lesson03.teach.line03:
    title: ذكر المهنة ومكان العمل ثم رد السؤال
    gloss: تقول Ana إنها تعمل معلمة في مدرسة، ثم تسأل Mihai السؤال نفسه.
    note: تجمع بين عبارة الدرس الثاني في هذه الوحدة و*Și dumneavoastră?* من الوحدة 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: ذكر المهنة ومكان العمل
    gloss: يقول Mihai إنه يعمل مهندسًا في مكتب.
    note: تعيد استعمال عبارة الدرس الأول في هذه الوحدة تقريبًا كما هي.
  ro.a1.unit17.lesson03.teach.line05:
    title: إنهاء المحادثة
    gloss: تودّع Ana.
    note: النمط الختامي نفسه الذي انتهت به حوارات الوحدات السابقة.
  ro.a1.unit17.lesson03.teach.line06:
    title: التوديع
    gloss: يودّع Mihai.
    note: النمط الختامي نفسه الذي انتهت به حوارات الوحدات السابقة.
