teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'تذكير: da, bine, nu, mulțumesc'
    gloss: da (نعم) · bine (جيد / حسنًا) · nu (لا) · mulțumesc (شكرًا)
    note: كلها مألوفة منذ الوحدة 6 -- وهنا تجتمع لتكوّن طريقة قبول الخطة في هذه الوحدة، ولتمرين مطابقة مفردات هذا الدرس.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: لنذهب / نذهب
    gloss: Mergem (لنذهب / نذهب)
    note: صيغة المتكلمين (نحن) من الفعل *a merge*، وقد مرّت بنا *merg* (أذهب، الوحدة 10) و*mergeți* (الأمر بصيغة الاحترام، الوحدة 9) -- الفعل نفسه بشخص وعدد آخر. وتُستعمل وحدها بنبرة صاعدة، فتكون طريقة طبيعية لاقتراح فعل شيء معًا.
    example_gloss:
    - هل نذهب إلى السينما؟
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: السينما
    gloss: Cinema (السينما)
    note: كلمة قريبة جدًا من الكلمة العربية «سينما» -- يسهل التعرف عليها.
    example_gloss:
    - هل نذهب إلى السينما؟
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: هل نذهب إلى السينما؟
    gloss: Mergem la cinema? (هل نذهب إلى السينما؟)
    note: دعوة كاملة -- لا حاجة إلى عبارة إضافية مثل «هل تريد»، فعلامة الاستفهام وحدها تحوّل «نذهب» إلى اقتراح.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: الحديقة
    gloss: Parc (الحديقة)
    note: كلمة أخرى سهلة التذكر، مثل *cinema*.
    example_gloss:
    - هل نذهب إلى الحديقة؟
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: هل نذهب إلى الحديقة؟
    gloss: Mergem la parc? (هل نذهب إلى الحديقة؟)
    note: نمط الدعوة نفسه في *Mergem la cinema?* مع مكان مختلف.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: نعم، حسنًا!
    gloss: Da, bine! (نعم، حسنًا!)
    note: طريقة قصيرة وطبيعية لقبول خطة -- كلمات معروفة في تركيب جديد.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'تذكير: nu, pot'
    gloss: nu (لا / ليس) · pot (أستطيع)
    note: 'Nu مألوفة منذ الوحدة 6؛ وpot مألوفة من عبارة *cum pot să ajung* (كيف أصل) في الوحدة 9. وحين تأتي *nu* قبل الفعل فهي تعني «لا»: *nu pot* تعني «لا أستطيع» -- وهي طريقة هذه الوحدة في رفض الخطة.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'تذكير: sâmbătă, duminică'
    gloss: sâmbătă (السبت) · duminică (الأحد)
    note: كلتاهما مألوفة من أيام الأسبوع في الوحدة 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: هل نذهب إلى الحديقة يوم السبت؟
    gloss: Mergem la parc sâmbătă? (هل نذهب إلى الحديقة يوم السبت؟)
    note: دعوة الدرس الأول مع إضافة يوم -- تجمع بين *Mergem la parc?* واسم يوم.
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: لا أستطيع يوم السبت
    gloss: Nu pot sâmbătă. (لا أستطيع يوم السبت.)
    note: رفض بسيط -- *nu pot* مع اليوم الذي يُرفض.
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: إذن / في هذه الحالة
    gloss: Atunci (إذن / في هذه الحالة)
    note: تختلف عن *apoi* («ثم» في الوحدة 9 التي تُرتّب فعلين متتابعين) -- فـ *atunci* تقترح بديلًا أو تستخلص نتيجة، وهي الكلمة الطبيعية لقول «في هذه الحالة، ما رأيك في...؟» عند تغيير الموعد.
    example_gloss:
    - إذن، يوم الأحد؟
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: إذن، يوم الأحد؟
    gloss: Atunci, duminică? (إذن، يوم الأحد؟)
    note: اقتراح مضاد قصير بعد الرفض -- يكفي ذكر يوم جديد دون إعادة الدعوة كاملة.
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: نعم، حسنًا! يوم الأحد.
    gloss: Da, bine! Duminică. (نعم، حسنًا! يوم الأحد.)
    note: قبول اليوم الجديد بالنمط القصير نفسه في *Da, bine!* من الدرس الأول.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'تذكير: la ce oră, la ora, patru'
    gloss: la ce oră (في أي ساعة) · la ora (في الساعة...) · patru (أربعة)
    note: La ce oră/la ora مألوفتان من الوحدة 4 (السؤال عن الوقت وقوله)؛ وpatru مألوفة من أعداد الوحدة 2 -- وهنا تجتمع لتحديد موعد اللقاء في هذه الوحدة.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'تذكير: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (مرحبًا) · mulțumesc (شكرًا) · la revedere (إلى اللقاء) · da (نعم) · Ana, Mihai (اسمان)
    note: كلها مألوفة من الوحدات السابقة -- وهنا تتفق Ana وMihai على موعد لخطتهما.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: بالتأكيد
    gloss: Sigur (بالتأكيد)
    note: طريقة شائعة لتأكيد خطة بكلمة واحدة -- تقابل «بالتأكيد!» أو «طبعًا!» في العربية.
    example_gloss:
    - بالتأكيد! في الساعة الرابعة.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: بالتأكيد! في الساعة الرابعة.
    gloss: Sigur! La ora patru. (بالتأكيد! في الساعة الرابعة.)
    note: يؤكد الخطة والموعد المحدد معًا في ردّ قصير واحد.
  ro.a1.unit11.lesson03.teach.line01:
    title: التحية واقتراح الحديقة
    gloss: تحيّي Ana صديقها Mihai وتسأله هل يذهبان إلى الحديقة يوم الأحد.
    note: تجمع بين دعوة هذه الوحدة *Mergem la parc?* وكلمة *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: القبول والسؤال عن الساعة
    gloss: يقبل Mihai ويسأل عن الساعة.
    note: يعيد استعمال سؤال الوحدة 4 *La ce oră?*.
  ro.a1.unit11.lesson03.teach.line03:
    title: اقتراح ساعة
    gloss: تقترح Ana الساعة الرابعة.
    note: سؤال قصير يعيد استعمال نمط *la ora* من الوحدة 4 مع *patru* من هذه الوحدة.
  ro.a1.unit11.lesson03.teach.line04:
    title: التأكيد والشكر
    gloss: يؤكد Mihai بقوله «بالتأكيد!» ويشكر Ana.
    note: يجمع بين *sigur* من هذه الوحدة و*mulțumesc* المعروفة.
  ro.a1.unit11.lesson03.teach.line05:
    title: قول وداعًا
    gloss: تودّع Ana صديقها.
    note: نمط الختام نفسه الذي انتهت به حوارات الوحدات السابقة.
  ro.a1.unit11.lesson03.teach.line06:
    title: إنهاء اللقاء
    gloss: يردّ Mihai على الوداع مناديًا Ana باسمها.
    note: عبارة الختام الودية نفسها التي انتهى بها حوار كل وحدة سابقة.
