teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *a citi* (يقرأ)، و*a face sport* (يمارس الرياضة)، و*a găti* (يطبخ). تبدأ صيغة المصدر الرومانية في القاموس بـ *a*.'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Timpul liber* (وقت الفراغ) مبنية على الاسم المذكر *timp* مع أداة التعريف الملتصقة به. وهي العبارة الأساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Citesc* هي صيغة المتكلم *eu* من *a citi* (يقرأ)؛ وبعد *îmi place să* يبقى الفعل بالصيغة نفسها.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث عبارات أخرى للهوايات: *a asculta muzică* (يستمع إلى الموسيقى)، و*a desena* (يرسم)، و*a juca jocuri video* (يلعب ألعاب الفيديو).'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: '*Îmi place să ascult muzică*: التركيب *îmi place* («يعجبني») + *să* + فعل هو الطريقة المعتادة للقول إنك تحب فعل شيء ما.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: 'تعني *Cu prietenii* «مع الأصدقاء»: *cu* («مع») حرف جر، و*prietenii* جمع معرّف بالأداة.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'أربعة ظروف أساسية للتكرار: *mereu* و*des* و*uneori* و*niciodată*. وتأتي عادةً بعد الفعل: *Citesc des*.'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: تعني *În fiecare săptămână* و*în fiecare weekend* «كل»؛ والكلمة *fiecare* لا تتغير، انظر البطاقة التالية.
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: الكلمة fiecare لا تتغير
    gloss: 'الكلمة fiecare لا تتغير: în fiecare săptămână (كل أسبوع)، în fiecare weekend (كل عطلة نهاية أسبوع).'
    note: تبقى *Fiecare* على حالها قبل *săptămână* و*weekend* وأي اسم آخر، فلا داعي لاختيار صيغة.
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: آنا تفتح موضوع الهوايات
    gloss: 'آنا: نتنزه معًا كثيرًا. لكن ماذا تفعل أيضًا في وقت فراغك يا ميهاي؟'
    note: '*Ne plimbăm* («نتنزه») هي صيغة *noi* من الفعل الانعكاسي *a se plimba*؛ وتشير إلى النزهات التي يستمتع بها الصديقان.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: هوايات ميهاي
    gloss: 'ميهاي: أحب الطبخ، وفي البيت أيضًا. وأمارس الرياضة كثيرًا.'
    note: تبيّن *Și acasă* (وفي البيت أيضًا) أن ميهاي يطبخ للمتعة، وليس فقط في عمله بالمطعم.
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: آنا متفاجئة
    gloss: 'آنا: وتطبخ في البيت أيضًا؟ أنت تطبخ طوال اليوم في عملك أصلًا!'
    note: تؤكد *Toată ziua* (طوال اليوم) كثرة ما يطبخه ميهاي في العمل؛ وتعني *deja* «أصلًا» أو «من قبل».
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: ميهاي يوضح
    gloss: 'ميهاي: نعم، لكنني أجد الطبخ مريحًا. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: 'معنى *Gătitul mi se pare relaxant* حرفيًا «الطبخ يبدو لي مريحًا»: التعبير *mi se pare* طريقة شائعة لإبداء الرأي.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: هوايات آنا
    gloss: 'آنا: أحب القراءة، وأستمع إلى الموسيقى كثيرًا.'
    note: تجمع بين فعلين للهوايات من الدرسين الأول والثاني في جملة واحدة بالحرف *și* (و).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: ميهاي يسأل عن الألعاب
    gloss: 'ميهاي: وهل تلعبين ألعاب الفيديو أيضًا؟'
    note: سؤال قصير جوابه نعم أو لا يستعمل *jocuri video* من الدرس الثاني؛ و*joci* هي صيغة المخاطب *tu* من *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: آنا تجيب
    gloss: 'آنا: لا، لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: '*Niciodată* («أبدًا») و*uneori* («أحيانًا») من الدرس الثالث، في مقابلة داخل جواب واحد؛ والتركيب *nu ... niciodată* نفي مزدوج.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: مقارنة الهوايات
    gloss: ميهاي وأنا نتنزه معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. ميهاي يحب الطبخ، وفي البيت أيضًا، ويمارس الرياضة كثيرًا. وأنا أحب القراءة وأستمع إلى الموسيقى كثيرًا. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخّص رسالة آنا معلومات من الدروس السابقة، وتنتهي بسؤال القارئ السؤال الأساسي للوحدة.
    glosses:
      plimbăm: يتنزه
      des: غالبًا
      împreună: معًا
      alte: أخرى
      gătească: يطبخ
      place: يحب
      acasă: في البيت
      sport: يمارس الرياضة
      citesc: القراءة
      ascult: أستمع
      muzică: موسيقى
      desenez: أرسم
      uneori: أحيانًا
      joc: ألعب ألعاب الفيديو
      niciodată: أبدًا
      liber: فراغ
      timpul: وقت
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: ميهاي يسأل عن عطلة نهاية الأسبوع
    gloss: 'ميهاي: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: تستعمل *În acest weekend* (في عطلة نهاية الأسبوع هذه) الكلمة *acest* بمعنى «هذا».
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: آنا لم تقرر بعد
    gloss: 'آنا: لا أعرف بعد. أحب القراءة، لكنني أريد أن أخرج أيضًا.'
    note: '*Să ies afară* (أن أخرج) طريقة شائعة للقول إنك تريد مغادرة البيت؛ وتعني *vreau să* + فعل «أريد أن ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: ميهاي يقترح خطة
    gloss: 'ميهاي: هيا نتنزه معًا! وبعد ذلك أطبخ لنا.'
    note: '*După aceea* (بعد ذلك) عبارة لترتيب الأحداث؛ والتركيب *Hai să* + فعل يقترح فعل شيء معًا.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: آنا توافق
    gloss: 'آنا: فكرة جيدة! أحب التنزه والطبخ كليهما.'
    note: يبيّن التركيب *Și ..., și ...* («كلا ... و...») أن آنا تحب الأمرين بالقدر نفسه، ولا تفضّل أحدهما على الآخر.
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: ميهاي يؤكد الموعد
    gloss: 'ميهاي: ممتاز. إذن نلتقي يوم السبت!'
    note: عبارة ختام ودّية تؤكد الخطة ليوم *sâmbătă* (السبت)؛ وتعني *ne vedem* «نرى بعضنا» أي «نلتقي».
