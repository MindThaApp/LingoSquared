teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: تحية يومية
    gloss: مرحبًا
    note: Bună تحية يومية خفيفة الرسمية، تناسب الأصدقاء والأقران ومعظم اللقاءات العابرة في النهار.
    example_gloss: مرحبًا يا Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: تحية غير رسمية
    gloss: أهلًا؛ إلى اللقاء
    note: Salut تحية غير رسمية بين الأصدقاء والأقران. يمكن أن تُقال عند اللقاء أو عند الوداع، لكنها ليست الخيار الأضمن مع شخص بالغ لا تعرفه.
    example_gloss: مرحبًا يا Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: تحية رسمية
    gloss: طاب يومك (رسمي)
    note: Bună ziua هي التحية المهذّبة الآمنة مع شخص بالغ لا تعرفه أو مع بائع أو مع أي شخص تخاطبه بـ dumneavoastră. معناها الحرفي «يوم طيب»، لكنها تُستعمل تحية مهذّبة عامة وليست مقصورة على منتصف النهار.
    example_gloss: طاب يومك يا Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: وداع محايد
    gloss: مع السلامة
    note: La revedere تصلح في المواقف الرسمية وغير الرسمية على حدّ سواء.
    example_gloss: طاب يومك! إلى اللقاء!
  ro.a1.unit01.lesson01.teach.tu:
    title: ضمير المخاطب المفرد غير الرسمي
    gloss: أنتَ/أنتِ (للمفرد في المقام غير الرسمي)
    note: في العربية يكفي ضمير المخاطب (أنتَ/أنتِ) في معظم المواقف دون تمييز في درجة الرسمية. أما في الرومانية فـ tu تخاطب بها صديقًا واحدًا أو طفلًا أو شخصًا تربطك به علاقة غير رسمية صراحةً، ولها صيغها الفعلية الخاصة (faci وليس faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: ضمير المخاطب المهذّب أو الجمع
    gloss: أنتَ/أنتِ للتوقير، أو أنتم
    note: Dumneavoastră هي الخيار الأضمن لمخاطبة شخص بالغ واحد لا تعرفه، وتصلح أيضًا لمخاطبة مجموعة بأدب. أصلها domnia voastră (سيادتكم)، وتأخذ صيغ الفعل الخاصة بالجمع (faceți, numiți) حتى حين يكون المخاطَب شخصًا واحدًا.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: سؤال رسمي عن الحال
    gloss: كيف حالك؟
    note: Faceți هي صيغة dumneavoastră من الفعل a face (يفعل / يصنع). وهذا سؤال مهذّب متعارف عليه، وليس استفسارًا حرفيًا عمّا يفعله الشخص.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: سؤال غير رسمي عن الحال
    gloss: كيف حالك؟
    note: Faci هي صيغة tu من الفعل a face. لا يتغيّر بين صيغتَي هذا السؤال المهذّبة وغير الرسمية إلا آخر الفعل، أما ce mai فتبقى كما هي.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: ردّ معتاد بالإيجاب
    gloss: بخير، شكرًا.
    note: Bine, mulțumesc جواب عن ce mai faci/faceți أيًّا كانت درجة الرسمية، فالردّ نفسه لا يتغيّر.
    example_gloss: كيف حالك؟ بخير، شكرًا.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: مطابقة التحية للعلاقة
    gloss: Bună ziua مع dumneavoastră؛ و Salut مع tu
    note: هذه قواعد افتراضية مفيدة وليست قوانين مطلقة. يمكن أن تفتتح Bună ziua حديثًا رسميًا يستمر بعدها بـ dumneavoastră؛ أما الجمع بين Salut و dumneavoastră فيُرسل عادةً إشارات اجتماعية متعارضة.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: قدّم اسمك (الصيغة المعتادة)
    gloss: اسمي Ana.
    note: Mă numesc تعني حرفيًا «أسمّي نفسي»، وهي الطريقة المحايدة التي تصلح في كل موقف لذكر اسمك.
    example_gloss: مرحبًا! اسمي Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: السؤال عن الاسم بتهذيب
    gloss: ما اسمك؟
    note: Numiți هي صيغة dumneavoastră من الفعل a se numi (يُسمّى). و vă هو الضمير الانعكاسي المقابل لـ dumneavoastră، وهو واجب هنا.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: قدّم اسمك (الصيغة الحوارية)
    gloss: اسمي Mihai.
    note: Mă cheamă هي الطريقة الأكثر حوارية لذكر الاسم، ومعناها الحرفي «يدعوني». كلتا العبارتين mă numesc و mă cheamă صحيحة وشائعة، لكن mă cheamă أقل رسمية قليلًا.
    example_gloss: مرحبًا! اسمي Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: السؤال عن الاسم بصيغة غير رسمية
    gloss: ما اسمك؟
    note: Te ضمير انعكاسي يقابل tu. وهذه هي الطريقة اليومية التي يسأل بها الأصدقاء والأقران بعضهم عن الاسم.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: عند التعرّف إلى شخص
    gloss: سررت بلقائك!
    note: Îmi pare bine تعني حرفيًا «يبدو لي حسنًا»، وهي عبارة اصطلاحية ثابتة لا تُترجم كلمة بكلمة. ولا تتغيّر صيغتها بحسب جنس المتكلم.
    example_gloss: اسمي Mihai. سررت بلقائك!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: ردّ المجاملة
    gloss: وأنا أيضًا سررت بلقائك!
    note: Și mie تضيف معنى «أنا أيضًا» إلى بداية العبارة الثابتة نفسها التي افتُتح بها الحديث.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: إعادة السؤال بتهذيب
    gloss: وأنت؟
    note: استعمل dumneavoastră للحفاظ على المستوى المهذّب أو لمخاطبة مجموعة.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟
    note: استعمل tu بعد și عند مخاطبة صديق واحد أو قرين بصورة غير رسمية.
  ro.a1.unit01.lesson03.teach.line01:
    title: افتتاح اللقاء
    gloss: تحيّي Ana السيد Mihai تحية رسمية وتذكر اسمها.
    note: تبدأ Ana بـ bună ziua المهذّبة، وهي مناسبة للقاء شخص لا تعرفه.
  ro.a1.unit01.lesson03.teach.line02:
    title: 'افتتاح اللقاء: الرد'
    gloss: يبادلها Mihai الشعور نفسه، ويذكر اسمه، ويسألها عن حالها.
    note: يحافظ Mihai على المستوى المهذّب نفسه الذي بدأت به Ana، فيسأل ce mai faceți وليس ce mai faci.
  ro.a1.unit01.lesson03.teach.line03:
    title: أجب ثم أعد السؤال
    gloss: تقول Ana إنها بخير وتسأل Mihai السؤال نفسه بأدب.
    note: Și dumneavoastră تُبقي الحديث رسميًا، مطابقًا لطريقة بدايته.
  ro.a1.unit01.lesson03.teach.line04:
    title: أجب ثم ودّع
    gloss: يقول Mihai إنه بخير أيضًا ثم يودّع.
    note: La revedere وداع محايد، يناسب الحديث سواء كان رسميًا أو غير رسمي.
  ro.a1.unit01.lesson03.teach.line05:
    title: اختم اللقاء
    gloss: تردّ Ana بعبارة الوداع نفسها.
    note: إعادة la revedere هي الطريقة الطبيعية لتأكيد ختام ودّي.
