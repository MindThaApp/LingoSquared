teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'تذكير: Ana, mare'
    gloss: Ana (اسم) · mare (كبير)
    note: آنا هو اسم الشخصية منذ الوحدة 1؛ وكلمة *mare* وردت في الوحدة 5 والوحدة 14. تعيد هذه الوحدة استخدامهما لوصف بيتها.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'تذكير: un, o, și, trei'
    gloss: 'un/o (أداة تنكير: واحد/واحدة) · și (و) · trei (ثلاثة)'
    note: وردت *un* و*o* و*și* في الوحدة 5، ووردت *trei* في عدّ الوحدة 2. تعيد هذه الوحدة استخدام الكلمات الأربع لعدّ الغرف ووصفها.
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: لديه / لديها
    gloss: Are (لديه / لديها)
    note: 'صيغة جديدة من الفعل *a avea* (يملك / لدى): عرفتَ سابقًا *am* (لديّ، من الوحدة 2 والوحدة 5) و*aveți* (لديكم، للمخاطب المحترم). أما *are* فهي صيغة الغائب للفعل نفسه، وتُستخدم للتعبير عمّا يملكه شخص أو شيء.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: بيت
    gloss: Casă (بيت)
    note: المكان الذي يسكن فيه المرء.
    example_gloss:
    - لدى آنا بيت كبير.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: غرفة
    gloss: Cameră (غرفة)
    note: كلمة عامة للغرفة في المنزل.
    example_gloss:
    - لدى آنا غرفة كبيرة.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (غرفة) · camere (غرف)
    note: جمع *cameră* هو *camere*، ويُستعمل عند الحديث عن أكثر من غرفة واحدة.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: غرفة النوم
    gloss: Dormitor (غرفة نوم)
    note: الغرفة التي ينام فيها المرء.
    example_gloss:
    - لدى آنا غرفة نوم.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: مطبخ
    gloss: Bucătărie (مطبخ)
    note: الغرفة التي يطبخ فيها المرء.
    example_gloss:
    - لدى آنا مطبخ.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: الحمّام
    gloss: Baie (حمّام)
    note: الغرفة التي فيها حوض الاستحمام أو الدُّش والمرحاض.
    example_gloss:
    - لدى آنا حمّام.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'لدى آنا بيت كبير. في البيت ثلاث غرف: غرفة نوم ومطبخ وحمّام.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'كل كلمة هنا سبق تعلّمها أو قُدّمت للتو، وقد جُمعت في جملتين جديدتين عن بيت آنا. *Casa* هي صيغة التعريف من *casă* أي «البيت»: الاسم المؤنث المنتهي بـ -ă يستبدل به -a، مثل *banca* (المصرف) في الوحدة 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'تذكير: Mihai, mic'
    gloss: Mihai (اسم) · mic (صغير)
    note: ميهاي هو اسم الشخصية منذ الوحدة 1؛ وكلمة *mic* وردت في الوحدة 14. تعيد هذه الوحدة استخدامهما لوصف شقته.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'تذكير: unde, este, două'
    gloss: unde (أين) · este (هو / هي) · două (اثنتان، للمؤنث)
    note: وردت *unde* و*este* في الوحدتين 8 و9، أما *două* فهي صيغة المؤنث للعدد «اثنان» من الوحدة 2. تعيد هذه الوحدة استخدام الكلمات الثلاث للسؤال عن الغرف وعدّها.
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: شقة
    gloss: Apartament (شقة)
    note: منزل ميهاي، وهو أصغر من بيت آنا.
    example_gloss:
    - لدى ميهاي شقة صغيرة.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: نافذة
    gloss: Fereastră (نافذة)
    note: '*Apartamentul* هي صيغة التعريف من *apartament* أي «الشقة»: الاسم المحايد المنتهي بحرف ساكن يضيف -ul، مثل *magazinul* (المتجر) في الوحدة 8 (أما المؤنث *casă* فيصبح *casa*).'
    example_gloss:
    - في الشقة نافذة كبيرة.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'لدى ميهاي شقة صغيرة. فيها غرفتان: غرفة نوم ومطبخ.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: كل كلمة هنا سبق تعلّمها أو قُدّمت للتو، وقد جُمعت في جملتين جديدتين عن شقة ميهاي.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: أين الحمّام؟
    gloss: Unde este baia؟ (أين الحمّام؟)
    note: '*Baia* هي صيغة التعريف من *baie* أي «الحمّام». سؤال مفيد في الحياة الواقعية عند زيارة بيت أحدهم.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'تذكير: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (مرحبًا) · Ce mai faceți? (كيف حالكم؟ للمخاطب المحترم) · Bine, mulțumesc (بخير، شكرًا)
    note: كلها من تحية الوحدة 1 الافتتاحية، وتُستخدم هنا لبدء حوار هذه الوحدة.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'تذكير: La revedere, Mea, Aproape, Am'
    gloss: 'La revedere (إلى اللقاء) · Mea (my: ـي، للمؤنث) · Aproape (قريب) · Am (لديّ)'
    note: وردت *La revedere* في الوحدة 1، و*mea* في *Mama mea* من الوحدة 5، و*aproape* في أجوبة *Unde este...?* من الوحدتين 8 و9، و*am* في الوحدتين 2 و5. وكلها تُستخدم هنا في حوار زيارة البيت.
  ro.a1.unit18.lesson03.teach.line01:
    title: حيِّ آنا واسألها عن حالها
    gloss: يحيّي ميهاي آنا ويسألها عن حالها.
    note: تعيد استخدام تحية *Ce mai faceți?* من الوحدة 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: أجب ثم صف بيتك
    gloss: تجيب آنا، ثم تخبر ميهاي أن بيتها كبير وفيه ثلاث غرف.
    note: تجمع بين *Bine, mulțumesc* من الوحدة 1 وعبارة الدرس الأول من هذه الوحدة.
  ro.a1.unit18.lesson03.teach.line03:
    title: اسأل عن مكان الحمّام
    gloss: يسأل ميهاي آنا أين الحمّام.
    note: تعيد استخدام عبارة الدرس الثاني من هذه الوحدة تقريبًا كما هي.
  ro.a1.unit18.lesson03.teach.line04:
    title: أجب عن مكان الحمّام
    gloss: تخبره آنا أنه قريب.
    note: تجمع بين *baia* و*aproape*، وهو نمط الجواب نفسه عن «أين...؟» الذي ورد في الوحدتين 8 و9.
  ro.a1.unit18.lesson03.teach.line05:
    title: صف شقتك ثم ودّع
    gloss: يقول ميهاي إن لديه شقة صغيرة فيها غرفتان، ثم يودّع.
    note: تجمع بين عبارة الدرس الثاني من هذه الوحدة وجملة الختام من الوحدة 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: قل إلى اللقاء
    gloss: تودّع آنا.
    note: نمط الختام نفسه الذي انتهى به حوار كل وحدة سابقة.
