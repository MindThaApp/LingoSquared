  en.a1.unit08.lesson02.teach.two_dollars_a_pound:
    title: They're two dollars a pound.
    gloss: Elles coûtent deux dollars la livre.
    note: '*a pound* en fin de phrase signifie ici « la livre », exactement comme *per pound*.'
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds:
    title: Can I have two pounds, please?
    gloss: Puis-je avoir deux livres, s’il vous plaît ?
    note: '*Can I have...?* est une formule de commande polie quand on fait ses courses.'
  en.a1.unit08.lesson02.teach.is_it_fresh:
    title: Is it fresh?
    gloss: C’est frais ?
    note: Une question utile pour les produits frais comme les fruits ou les légumes.
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: la livre (prix au poids)
    note: '*per pound* indique le prix par unité de poids, par exemple sur les étiquettes.'
    example_gloss: Les pommes coûtent deux dollars la livre.
  en.a1.unit08.lesson03.teach.label_text:
    title: Étiquette de prix
    gloss: 'Pommes : 2 dollars la livre. Œufs : 4 dollars la douzaine. Riz : 3 dollars le sachet.'
    note: Le signe dollar se place AVANT le nombre (*$2*), alors que le symbole euro se place APRÈS le nombre.
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: Ça fait huit dollars.
    note: '*That’s X dollars* correspond à « Ça fait X dollars. »'
  en.a1.unit08.lesson04.teach.q_price:
    title: Question de Daniel
    gloss: 'Daniel : Combien coûtent les pommes ?'
    note: Daniel ouvre la conversation par une question sur le prix.
  en.a1.unit08.lesson04.teach.a_price:
    title: Réponse de Leila
    gloss: 'Leila : Elles coûtent deux dollars la livre.'
    note: Leila donne le prix à la livre.
  en.a1.unit08.lesson04.teach.q_two_pounds:
    title: Commande de Daniel
    gloss: 'Daniel : D’accord, je peux avoir deux livres, s’il vous plaît ?'
    note: '*OK* montre que Daniel accepte le prix avant de commander.'
  en.a1.unit08.lesson04.teach.a_sure_anything_else:
    title: Relance de Leila
    gloss: 'Leila : Bien sûr. Et avec ça ?'
    note: '*Sure* signifie ici « bien sûr » ou « avec plaisir ».'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Commande supplémentaire de Daniel
    gloss: 'Daniel : Oui, une douzaine d’œufs aussi.'
    note: '*too* en fin de phrase signifie « aussi ».'
  en.a1.unit08.lesson04.teach.a_total:
    title: Conclusion de Leila
    gloss: 'Leila : Ça fait huit dollars.'
    note: Leila donne le prix total pour les pommes et les œufs ensemble.
