  en.a1.unit67.lesson03.teach.dialogue_line1:
    title: Mia demande des nouvelles de la famille
    gloss: 'Mia dit : Salut Daniel. Comment va ta famille ?'
    note: '*How is your family?* est la question principale du dialogue.'
  en.a1.unit67.lesson03.teach.dialogue_line2:
    title: Daniel a une bonne nouvelle
    gloss: 'Daniel dit : Ils vont bien. J’ai une bonne nouvelle.'
    note: '*They are well* signifie ils vont bien.'
  en.a1.unit67.lesson03.teach.dialogue_line3:
    title: Mia demande quelle est la nouvelle
    gloss: 'Mia dit : Quelle est la nouvelle ?'
    note: '*What is...?* demande plus d’informations.'
  en.a1.unit67.lesson03.teach.dialogue_line4:
    title: La sœur a un bébé
    gloss: 'Daniel dit : Ma sœur a un bébé.'
    note: '*My sister has a baby* partage une nouvelle de la famille.'
  en.a1.unit67.lesson03.teach.dialogue_line5:
    title: Mia réagit chaleureusement
    gloss: 'Mia dit : C’est merveilleux.'
    note: '*wonderful* a un ton chaleureux et positif.'
  en.a1.unit67.lesson03.teach.dialogue_line6:
    title: Daniel va rendre visite
    gloss: 'Daniel dit : Merci. Nous viendrons bientôt vous voir.'
    note: '*soon* signifie bientôt.'
  en.a1.unit67.lesson03.teach.dialogue_line7:
    title: Mia dit que Daniel doit être fier
    gloss: 'Mia dit : Tu dois être fier.'
    note: '*must be* exprime ce qui est probablement vrai.'
  en.a1.unit67.lesson03.teach.dialogue_line8:
    title: Daniel est fier
    gloss: 'Daniel dit : Je suis fier d’elle.'
    note: '*of her* renvoie à sa sœur.'
  en.a1.unit67.lesson04.teach.family_note:
    title: Message de famille
    gloss: 'Message de famille : Bonne nouvelle. Ma sœur a un bébé. Nous viendrons bientôt vous voir.'
    note: Le message partage brièvement une bonne nouvelle et annonce une visite.
  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Texte : Une bonne nouvelle dans la famille'
    gloss: 'Une bonne nouvelle dans la famille : Mia a demandé à Daniel des nouvelles de sa famille. Daniel a dit qu’ils allaient bien. Puis il a partagé une bonne nouvelle : sa sœur avait eu un bébé. Mia a dit que la nouvelle était merveilleuse. Daniel a dit que lui et sa famille viendraient bientôt rendre visite. Il était fier de sa sœur. Plus tard, Mia a envoyé un court message : Je suis heureuse pour ta famille.'
    note: '*shared good news* signifie a partagé une bonne nouvelle.'
