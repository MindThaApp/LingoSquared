  en.a1.unit37.lesson02.teach.invite_someone_to:
    title: invite someone to
    gloss: inviter quelqu’un à
    note: '*invite someone to* signifie « inviter quelqu’un à » quelque chose.'
    example_gloss: J’invite mes collègues à ma fête d’anniversaire.
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: féliciter quelqu’un pour
    note: Après *congratulate someone*, on utilise toujours la préposition *on*, et non *for* ni *with*, alors que le français dit « féliciter pour » ou « féliciter de ».
    example_gloss: Nous le félicitons pour sa promotion.
