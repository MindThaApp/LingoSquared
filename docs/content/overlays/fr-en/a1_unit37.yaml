    title: Do you want to come to my party?
    gloss: Tu veux venir à ma fête ?
    note: Une façon amicale et décontractée d’inviter quelqu’un.
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: La question de Leila
    gloss: 'Leila demande : Tu savais que l’anniversaire de Daniel est le 12 octobre ?'
    note: '*Did you know ...?* est une façon naturelle de lancer une conversation avec une nouvelle information.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: La réaction de Mia
    gloss: 'Mia répond : Non, je ne savais pas ! C’est vendredi prochain.'
    note: '*No, I didn''t!* est une courte réponse négative à une question avec *Did you know ...?* : « Non, je ne savais pas. »'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: La proposition de Leila
    gloss: 'Leila dit : Organisons une fête surprise pour lui au bureau.'
    note: '*Let''s* + verbe sert à faire une proposition, comme « Et si on... » ou la forme en « -ons » (« Organisons... ») en français.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: La réaction de Mia
    gloss: 'Mia dit : Bonne idée ! Je peux inviter le reste de l’équipe.'
    note: '*the rest of the team* signifie « le reste de l’équipe ».'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'Leila dit : Parfait. Je lui achèterai un cadeau, peut-être de nouvelles chaussures de course, puisqu’il adore courir.'
    note: '*since* signifie ici « puisque » ou « comme » (une raison), et non « depuis » (le temps).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: La proposition de Mia
    gloss: 'Mia dit : C’est une bonne idée. On prend aussi un gâteau ?'
    note: '*Should we ...?* sert à prendre une décision ensemble.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Oui, bien sûr ! Nous lui souhaiterons tous ensemble un joyeux anniversaire.'
    note: '*We''ll all wish him a happy birthday* signifie : nous lui souhaiterons tous un joyeux anniversaire.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Texte sur la fête surprise
    gloss: Daniel ne savait pas que Leila et Mia lui préparaient une fête surprise. Le 12 octobre, jour de son anniversaire, il est arrivé au travail et a trouvé des ballons et un gâteau dans la salle de pause. Tout le monde lui a dit « Joyeux anniversaire ! ». Leila lui a offert une nouvelle paire de chaussures de course. Mia lui a offert une photo encadrée des trois collègues ensemble, qu’elle avait prise elle-même. Daniel était très heureux et a remercié tout le monde pour cette merveilleuse surprise.
    note: '*he arrived at work and found* : passé de *arrive* et de *find* (il est arrivé au travail et a trouvé ...).'
