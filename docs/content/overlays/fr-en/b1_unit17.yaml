teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: regret
    note: '*regret* désigne un sentiment de tristesse à propos de quelque chose qu''on a fait ou qu''on n''a pas fait.'
    example_gloss: Daniel regrettait d'avoir raté l'échéance.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: souhait, vœu
    note: '*wish* veut dire désirer que les choses se soient passées autrement qu''elles ne se sont réellement passées.'
    example_gloss: Daniel avait un souhait à propos de la semaine passée.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: erreur
    note: '*mistake* désigne ce qu''on a mal fait à cause d''un mauvais jugement.'
    example_gloss: Attendre si longtemps avant de demander de l'aide était une erreur.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: avec le recul, après coup
    note: '*hindsight* désigne la compréhension d''un événement qu''on n''a qu''après coup.'
    example_gloss: Avec le recul, Daniel aurait dû parler plus tôt.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: remettre à plus tard, procrastiner
    note: '*procrastinate* veut dire repousser une chose qu''on devrait faire.'
    example_gloss: Daniel a tendance à remettre les tâches à plus tard quand elles lui paraissent difficiles.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: retard
    note: '*delay* désigne un laps de temps qui fait que quelque chose arrive plus tard que prévu.'
    example_gloss: Ce retard a fait que Daniel a raté sa première échéance.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + Partizip
    gloss: J'aurais dû demander de l'aide plus tôt.
    note: '*I wish I had asked* exprime un souhait à propos de quelque chose qui ne s''est pas produit dans le passé.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + Partizip
    gloss: J'aurais dû parler à mon responsable plus tôt.
    note: '*I should have talked* dit ce qu''il aurait fallu faire avec le recul.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + Partizip, I would have + Partizip
    gloss: Si j'avais demandé de l'aide à Mia dès la première semaine, j'aurais fini à temps.
    note: '*if I had asked..., I would have finished...* décrit une conséquence irréelle dans le passé.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Formen, um Bedauern über die Vergangenheit auszudrücken
    gloss: Pour exprimer un regret à propos du passé, on utilise wish + past perfect (I wish I had asked...), should have + participe passé (I should have talked...) ou if + past perfect avec would have + participe passé (If I had asked..., I would have finished...). Les trois décrivent ce qui ne s'est pas vraiment passé.
    note: 'Forme : choisis entre wish + had, should have ou if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: avec le recul, en y repensant
    note: '*looking back* introduit une réflexion sur le passé.'
    example_gloss: En y repensant, Daniel regrette de ne pas avoir demandé de l'aide plus tôt.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: échéance manquée
    note: '*missed deadline* désigne une date limite qui n''a pas été respectée.'
    example_gloss: Daniel a raté une échéance avant de demander de l'aide.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Lesetext: Rückblick auf einen anstrengenden Monat'
    gloss: Salut Leila, en y repensant, j'aurais dû demander de l'aide plus tôt. J'aurais dû parler plus tôt de ma charge de travail à mon responsable. Quand je l'ai fait, j'avais déjà raté une échéance. Si j'avais demandé de l'aide à Mia dès la première semaine, j'aurais terminé les deux projets à temps. C'était une erreur d'attendre si longtemps. Daniel
    note: Un message bref et pensif.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel beginnt mit einer Reflexion
    gloss: 'Daniel dit : En y repensant, j''aurais dû demander de l''aide plus tôt.'
    note: '*looking back* ouvre une conversation pleine de réflexion.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila fragt nach
    gloss: 'Leila dit : Qu''est-ce qui s''est passé ?'
    note: Une question brève et ouverte pour en savoir plus.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel erklärt, was er hätte tun sollen
    gloss: 'Daniel dit : J''aurais dû parler plus tôt de ma charge de travail à mon responsable. Quand je l''ai fait, j''avais déjà raté une échéance.'
    note: '*should have talked* et *had already missed* associent le regret à une conséquence concrète.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila beruhigt Daniel
    gloss: 'Leila dit : Ne t''inquiète pas, tu as fini par régler ça.'
    note: '*Don''t worry* rassure quelqu''un qui se sent coupable.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel beschreibt, was anders hätte sein können
    gloss: 'Daniel dit : C''est vrai. Si j''avais demandé de l''aide à Mia dès la première semaine, j''aurais terminé les deux projets à temps.'
    note: '*if I had asked..., I would have finished...* décrit une conséquence irréelle dans le passé.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila schließt aufmunternd ab
    gloss: 'Leila dit : Eh bien, maintenant tu sais pour la prochaine fois.'
    note: Une conclusion brève et positive pour la conversation.
