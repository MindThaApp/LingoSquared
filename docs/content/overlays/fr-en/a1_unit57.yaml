teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: cinéma
    note: '*cinema* signifie cinéma. Le mot s’écrit presque pareil en français, mais se prononce différemment en anglais.'
    example_gloss: Ce cinéma est très fréquenté.
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: billet
    note: '*ticket* signifie billet.'
    example_gloss: Je dois acheter un billet.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: horaire de la séance
    note: '*showtime* signifie horaire de la séance, c’est-à-dire le moment où le film commence.'
    example_gloss: À quelle heure commence le film ?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: siège / place
    note: '*seat* signifie siège ou place.'
    example_gloss: Cette place est-elle libre ?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: écran
    note: '*screen* signifie écran.'
    example_gloss: L’écran est très grand.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: pop-corn
    note: '*popcorn* signifie pop-corn.'
    example_gloss: Nous achetons toujours du pop-corn au cinéma.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: À quelle heure commence le film ?
    note: '*does the film start* utilise l’auxiliaire *does* pour former la question, car le verbe principal est *start*.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Deux billets pour la séance de sept heures, s’il vous plaît.
    note: '*for the seven o''clock show* relie les billets à une séance précise.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Puis-je avoir du pop-corn, s’il vous plaît ?
    note: '*Can I have...?* est une façon directe et courante de demander quelque chose.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Combien cela fait-il en tout ?
    note: '*in total* signifie en tout ; on l’emploie pour demander le prix final.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: Cela fait vingt dollars, s’il vous plaît.
    note: '*That''s* + prix est une façon courante d’annoncer un montant.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: J’ai vraiment aimé !
    note: L’anglais utilise ici le verbe *like* avec le complément *it*. En français, le pronom se place avant le verbe (« je l’ai aimé »), donc l’ordre des mots est différent. Apprends cette phrase en bloc, pas mot à mot.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel demande l’heure de la séance
    gloss: 'Daniel dit : Salut ! À quelle heure commence le film ?'
    note: '*does the film start* utilise l’auxiliaire *does* pour former la question.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: L’horaire de la séance
    gloss: 'Le caissier dit : La prochaine séance est à sept heures.'
    note: '*at seven o''clock* utilise la préposition *at* pour une heure précise ; elle correspond ici à « à » (à sept heures).'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel prend des billets
    gloss: 'Daniel dit : Super. Pouvons-nous avoir deux billets, s’il vous plaît ?'
    note: 'Un fait distinct : le nombre de billets (deux).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Le prix des billets
    gloss: 'Le caissier dit : Bien sûr. Cela fait seize dollars.'
    note: 'Un fait distinct : le prix des deux billets ensemble.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila commande du pop-corn
    gloss: 'Leila dit : Pouvons-nous avoir du pop-corn, s’il vous plaît ?'
    note: Une demande, pas un nouveau prix.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Le prix du pop-corn
    gloss: 'Le caissier dit : Bien sûr. Le pop-corn coûte quatre dollars.'
    note: 'Un deuxième fait distinct : le prix du pop-corn, séparé de celui des billets.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel demande le total
    gloss: 'Daniel dit : Combien cela fait-il en tout ?'
    note: '*in total* demande la somme de tous les prix.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Le montant total
    gloss: 'Le caissier dit : Cela fait vingt dollars, s’il vous plaît.'
    note: 'Un troisième fait distinct : le montant total, différent des prix séparés des billets et du pop-corn.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila a hâte
    gloss: 'Leila dit : Merci ! J’ai hâte de le voir.'
    note: '*I can''t wait to...* est une expression toute faite pour exprimer son enthousiasme.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Programme du cinéma
    gloss: 'Programme du cinéma : Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: Le programme indique trois films avec leur horaire et leur prix.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Texte : Une soirée au cinéma'
    gloss: Un soir, Daniel et Leila ont décidé d’aller voir un film au cinéma. Ils ont demandé à quelle heure il commençait, et le caissier a répondu que la prochaine séance, Star Journey, était à sept heures. Ils ont acheté deux billets pour seize dollars et un sachet de pop-corn pour quatre dollars. Cela faisait vingt dollars en tout. Ils ont regardé le film ensemble ; il parlait d’explorateurs de l’espace. Il était très drôle. Quand il s’est terminé, Leila a dit qu’elle l’avait vraiment aimé, et Daniel a dit qu’il voulait aussi voir le suivant.
    note: '*watched* est le passé de *watch* (regarder).'
