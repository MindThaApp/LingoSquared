    gloss: carte / menu
    note: '*menu* signifie carte, la liste des plats proposés.'
    example_gloss: Pourrais-je voir la carte, s’il vous plaît ?
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: commander
    note: '*order* signifie commander.'
    example_gloss: Je voudrais commander le poulet.
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: addition
    note: '*bill* signifie addition.'
