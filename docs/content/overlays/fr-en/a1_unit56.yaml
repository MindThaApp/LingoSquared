  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: Cette table est-elle libre ?
    note: '*free* signifie ici libre, non occupé, comme en français.'
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: Puis-je commander maintenant ?
    note: '*Can I...?* est une façon directe de demander quelque chose, moins formelle que *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Je prendrai la salade, s’il vous plaît.
    note: '*I''d like*, contraction de *I would like*, est la façon polie de commander. Elle correspond au conditionnel français « je voudrais ».'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: Combien coûte la salade ?
    note: '*How much is...?* demande le prix.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Pourrions-nous avoir l’addition, s’il vous plaît ?
    note: '*Could we have...?* est la façon polie de demander. Comme le conditionnel français (« pourrions-nous... »), *could* adoucit la demande ; c’est la forme naturelle et courtoise en anglais.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Bon appétit !
    note: '*Enjoy your meal!* est une expression toute faite que le serveur dit avant que vous commenciez à manger. Littéralement, elle veut dire « profitez de votre repas », mais le français « Bon appétit ! » est construit autrement. Apprends cette phrase comme un tout, et non mot à mot.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila demande si la table est libre
    gloss: 'Leila dit : Bonjour ! Cette table est-elle libre ?'
    note: '*Is this table free?* utilise *free* pour dire libre, non occupé.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Le serveur indique une table
    gloss: 'Le serveur dit : Oui, installez-vous ici.'
    note: '*please sit here* est une invitation brève et polie.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia demande la carte
    gloss: 'Mia dit : Pourrais-je voir la carte, s’il vous plaît ?'
    note: '*Could I see...?* : là encore, le *could* poli, comme dans *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Le serveur donne la carte
    gloss: 'Le serveur dit : Bien sûr, tenez.'
    note: '*Of course, here you are* est une formule toute faite pour tendre quelque chose à quelqu’un.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: La commande de Leila
    gloss: 'Leila dit : Je prendrai le poulet, s’il vous plaît.'
    note: 'Une information distincte : Leila commande du poulet.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: La commande de Mia
    gloss: 'Mia dit : Je prendrai la salade, s’il vous plaît.'
    note: 'Une information distincte : Mia commande de la salade.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Le serveur souhaite un bon repas
    gloss: 'Le serveur dit : Excellent choix ! Bon appétit !'
    note: '*Enjoy your meal!* est la formule habituelle avant que les clients commencent à manger.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila demande le prix du poulet
    gloss: 'Leila dit : Combien coûte le poulet ?'
    note: '*How much is...?* demande le prix.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Le prix du poulet
    gloss: 'Le serveur dit : Le poulet coûte douze dollars.'
    note: 'Une information distincte : le prix du poulet, indépendant de la salade et de l’addition totale.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia demande le prix de la salade
    gloss: 'Mia dit : Combien coûte la salade ?'
    note: '*How much is...?* : la même forme de question que pour le poulet.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Le prix de la salade
    gloss: 'Le serveur dit : La salade coûte sept dollars.'
    note: 'Une deuxième information distincte : le prix de la salade.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila demande l'addition"
    gloss: 'Leila dit : Pourrions-nous avoir l’addition, s’il vous plaît ?'
    note: '*Could we have...?* : là encore, le *could* poli.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: L’addition totale
    gloss: 'Le serveur dit : Cela fait dix-neuf dollars, s’il vous plaît.'
    note: 'Une troisième information distincte : l’addition totale, différente des prix du poulet et de la salade.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Carte
    gloss: 'Carte du restaurant : Poulet - $12. Salade - $7. Pizza - $10. Jus - $3.'
    note: La carte présente quatre plats avec leur prix.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Texte : Un repas au restaurant'
    gloss: Un soir, Leila et Mia ont décidé d’essayer un nouveau restaurant du centre-ville. Un serveur les a conduites à une table près de la fenêtre. Il leur a apporté une carte proposant du poulet, de la salade, de la pizza et du jus. Leila a commandé le poulet, et Mia la salade. Le poulet coûtait douze dollars, et la salade sept dollars. Pendant qu’elles mangeaient, elles ont parlé du cours de photographie de Mia. Quand elles ont terminé, le serveur a apporté l’addition. Cela faisait dix-neuf dollars pour les deux. Leila a dit que le restaurant était excellent, et Mia a dit qu’elle voulait y emmener Daniel la prochaine fois.
    note: '*ordered* est le passé de *order* (commander).'
