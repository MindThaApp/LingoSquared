  en.a1.unit56.lesson01.teach.restaurant:
    title: restaurant
    gloss: restaurant
    note: '*restaurant* signifie restaurant. Le mot s’écrit presque pareil en français, mais se prononce différemment en anglais.'
    example_gloss: Ce restaurant est ouvert tous les soirs.
