    title: What's your name?
    gloss: Comment tu t’appelles ? / Comment vous appelez-vous ?
    note: '*What’s your name?* s’emploie en anglais aussi bien dans un contexte formel qu’informel : contrairement au français, il n’y a pas de choix à faire entre tu et vous.'
  en.a1.unit02.lesson01.teach.my_name_is:
    title: My name is Leila.
    gloss: Je m’appelle Leila.
    note: La forme standard pour dire son nom.
  en.a1.unit02.lesson01.teach.im_leila:
    title: I'm Leila.
    gloss: Je suis Leila. / Je m’appelle Leila.
    note: Une alternative plus courte et tout aussi courante à *My name is Leila*.
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Enchanté(e).
    note: On le dit quand on rencontre quelqu’un pour la première fois.
  en.a1.unit02.lesson02.teach.i_am_student:
    title: I am a student.
    gloss: Je suis étudiant(e).
    note: '*a* s’emploie devant un nom de métier ou de rôle au singulier ; en français, l’article disparaît ici (Je suis étudiant, et non un étudiant).'
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: Are you a teacher?
    gloss: Êtes-vous enseignant(e) ? / Es-tu enseignant(e) ?
    note: La forme interrogative avec *Are you...?* convient dans tous les registres.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: Yes, I am.
    gloss: Oui, c’est le cas.
    note: Une réponse courte et complète à des questions comme *Are you a teacher?*
  en.a1.unit02.lesson02.teach.no_im_student:
    title: No, I'm a student.
    gloss: Non, je suis étudiant(e).
    note: Une réponse négative qui corrige son propre rôle.
  en.a1.unit02.lesson02.teach.are_you_member:
    title: Are you a new member?
    gloss: Êtes-vous un nouvel adhérent ?
    note: Demande si la personne est adhérente, par exemple d’une bibliothèque ou d’une association.
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: He is a teacher.
    gloss: Il est enseignant.
    note: Troisième personne du singulier, masculin.
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: She is an engineer.
    gloss: Elle est ingénieure.
    note: 'Troisième personne du singulier, féminin : *an* au lieu de *a*, parce que *engineer* commence par une voyelle.'
  en.a1.unit02.lesson03.teach.library:
    title: library
    gloss: la bibliothèque
    note: Un endroit où l’on peut emprunter des livres.
    example_gloss: Je suis à la bibliothèque.
  en.a1.unit02.lesson03.teach.library_assistant:
    title: library assistant
    gloss: assistant(e) de bibliothèque
    note: Une personne qui travaille dans une bibliothèque.
  en.a1.unit02.lesson03.teach.opening:
    title: Daniel ouvre la conversation
    gloss: 'Daniel dit : Bonjour. Je suis Daniel.'
    note: Une ouverture formelle et aimable.
  en.a1.unit02.lesson03.teach.request:
    title: Daniel demande le nom
    gloss: 'Daniel dit : Comment vous appelez-vous ?'
    note: 'Juste après la présentation : Daniel et Leila ne se connaissent pas encore, la conversation reste donc dans le registre formel du vouvoiement.'
  en.a1.unit02.lesson03.teach.names:
    title: Leila répond
    gloss: 'Leila dit : Salut. Je suis Leila. Je suis étudiante. Enchantée.'
    note: Leila donne son nom, son rôle et la formule de politesse habituelle.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel demande des infos sur l'abonnement
    gloss: 'Daniel dit : Enchanté aussi. Êtes-vous une nouvelle adhérente ? Leila dit : Oui, c’est le cas.'
    note: Daniel répond à la formule de politesse et demande si elle est adhérente, toujours en vouvoyant.
  en.a1.unit02.lesson03.teach.role:
    title: Daniel dit son métier
    gloss: 'Daniel dit : Je suis ingénieur.'
    note: Devant un métier, l’anglais met *a* ou *an* (*I’m an engineer*) ; en français, l’article disparaît.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel et Leila concluent la conversation
    gloss: 'Daniel dit : Bienvenue à la bibliothèque. Leila dit : Merci.'
    note: Une conclusion aimable et polie.
