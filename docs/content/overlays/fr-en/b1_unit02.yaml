teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: être capable de / pouvoir
    note: '*be able to* signifie qu’on a la capacité ou la possibilité de faire quelque chose.'
    example_gloss: Je peux renouveler mon permis de conduire en ligne.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: réussir à faire quelque chose
    note: '*manage to* signifie qu’on y arrive, souvent malgré un peu de difficulté.'
    example_gloss: J’ai réussi à remplir le formulaire en dix minutes.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: renouveler / prolonger
    note: '*renew* signifie faire prolonger un document avant qu’il n’expire.'
    example_gloss: Je dois renouveler mon permis de conduire.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: permis de conduire
    note: Ici, *license* désigne un document officiel qui autorise à conduire (abréviation de *driver’s license*). L’anglais britannique écrit le nom *licence*.
    example_gloss: Mon permis de conduire expire ce mois-ci.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: en ligne
    note: '*online* signifie par Internet, et non dans un lieu physique.'
    example_gloss: On peut maintenant le renouveler en ligne.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: en personne / sur place
    note: '*in person* signifie se déplacer soi-même quelque part, et non passer par Internet.'
    example_gloss: L’année dernière, j’ai dû m’y rendre en personne.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: eine gegenwärtige Möglichkeit ausdrücken
    gloss: Je peux maintenant renouveler mon permis de conduire en ligne.
    note: '*I am able to* exprime une possibilité au présent.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: eine vergangene Möglichkeit verneinen
    gloss: L’année dernière, je n’ai pas pu le faire en ligne.
    note: '*was not able to* exprime qu’une possibilité n’existait pas dans le passé.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: sagen, dass etwas gelungen ist
    gloss: J’ai réussi à remplir le formulaire en dix minutes.
    note: '*managed to* insiste sur le fait qu’on a réussi, souvent malgré la difficulté.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: Je peux le renouveler. J’ai pu le renouveler. Je pourrais t’aider.
    note: '*am able to* (présent), *was able to* (passé) et *would be able to* (hypothèse ou proposition) sont des formes de la même construction.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: ami(e)
    note: '*friend* désigne un ami ou une amie.'
    example_gloss: Mon amie a renouvelé son permis de conduire la semaine dernière.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: système
    note: '*system* désigne une manière organisée de faire quelque chose.'
    example_gloss: Le nouveau système est beaucoup plus rapide.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: L’année dernière, les gens ne pouvaient pas renouveler leur permis en ligne. Tout le monde devait se rendre au bureau en personne. Cette année, le système a changé. Maintenant, les gens peuvent tout renouveler depuis chez eux. Mon amie Mia a pu terminer le sien en dix minutes.
    note: Un court texte qui montre comment le nouveau système simplifie le renouvellement.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'Leila dit : As-tu pu renouveler ton permis en ligne ?'
    note: '*were you able to* pose une question sur une possibilité dans le passé.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'Daniel dit : Non, je n’ai pas pu. J’ai dû aller au bureau en personne.'
    note: '*wasn’t able to* est la forme contractée, utilisée à l’oral, de *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'Leila dit : Vraiment ? Moi, j’ai réussi à le faire en ligne en dix minutes.'
    note: '*managed to* souligne que Leila y est arrivée rapidement et sans problème.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel denkt an nächstes Mal
    gloss: 'Daniel dit : La prochaine fois, je pourrais gagner du temps si je le faisais aussi en ligne.'
    note: '*would be able to* exprime ici une possibilité hypothétique dans le futur.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'Leila dit : Je pourrais t’aider la prochaine fois, si tu veux.'
    note: '*would be able to* sert ici à faire une proposition polie.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'Daniel dit : Merci, avec plaisir.'
    note: '*I’d like that* est une façon naturelle d’accepter une proposition avec gratitude.'
