teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: valeur
    note: '*value* désigne ici un principe que les gens jugent important, pas seulement une valeur financière.'
    example_gloss: L’équité est une valeur.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: équité, justesse
    note: '*fairness* concerne le traitement raisonnable des personnes. C’est plus fort et plus abstrait que simplement *nice*.'
    example_gloss: L’équité signifie traiter les gens de façon raisonnable.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: commodité, côté pratique
    note: '*convenience* signifie « commodité » : ne le confonds pas avec « convenance », et ne le traduis pas par *easiness* dans ce contexte B2.'
    example_gloss: La commodité facilite la vie de tous les jours.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: souplesse, capacité d’adaptation
    note: '*flexibility* est la capacité de s’adapter quand les circonstances changent.'
    example_gloss: La souplesse permet de changer quand les conditions changent.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: nuancer, restreindre
    note: '*qualify* signifie ici nuancer ou restreindre ton opinion. Il ne signifie pas obtenir un diplôme.'
    example_gloss: Tu peux nuancer une opinion en la restreignant.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: donner la priorité à
    note: '*prioritize fairness* signifie que tu fais passer l’équité avant une autre valeur.'
    example_gloss: Donner la priorité à l’équité, c’est la considérer comme plus importante.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Mettre des valeurs en balance
    gloss: En principe, la commodité compte, mais l’équité devrait peser davantage.
    note: '*In principle* signifie ici « en principe ». Attention à *eventually* : ce n’est pas « éventuellement » ; *eventually* signifie « finalement ».'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Limiter ta position
    gloss: Je ne plaide pas pour le silence partout.
    note: '*I am not arguing for...* limite ta thèse. C’est préférable à un vague *a little* calqué sur le français.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Répondre directement à l’autre camp
    gloss: C’est un point juste, et je suis d’accord que les entreprises ont besoin de souplesse.
    note: '*That is fair* reconnaît le point de l’autre sans abandonner ta propre valeur.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Construire une opinion abstraite
    gloss: Une opinion abstraite solide nomme une valeur, nuance l’affirmation et répond directement au point de vue de l’autre.
    note: Utilise des expressions précises de niveau B2 comme *in principle*, *fairness* et *carry more weight*, plutôt que *a bit* à chaque fois pour nuancer.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: clair, facile à comprendre
    note: '*transparent rules* sont des règles faciles à comprendre et à contrôler.'
    example_gloss: Les règles claires sont faciles à comprendre.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: marchand, lié aux affaires
    note: '*commercial activity* est l’activité qui concerne les entreprises et les profits.'
    example_gloss: L’activité commerciale est liée aux entreprises.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Texte à lire : des espaces publics calmes'
    gloss: 'Amara soutient que les espaces publics calmes doivent être protégés, même si cela limite une partie de l’activité commerciale. Sa position n’est pas absolue : elle ne plaide pas pour le silence partout, et elle accepte que les entreprises aient besoin d’une certaine souplesse. Le point de vue opposé de Leo est que les règles peuvent rendre la survie des entreprises plus difficile. Amara répond directement à ce point en disant que la commodité compte, mais que l’équité devrait peser davantage quand un espace appartient à tout le monde. Sa position est nuancée parce qu’elle soutient des règles limitées et claires, pas des restrictions illimitées.'
    note: 'C’est de l’anglais abstrait : nomme des valeurs et limite ta thèse avec précision.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara expose sa position
    gloss: 'Amara dit : Je pense qu’une ville devrait protéger les espaces publics calmes, même si cela limite une partie de l’activité commerciale.'
    note: '*even if* montre qu’elle reconnaît un inconvénient.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo nomme l’autre valeur
    gloss: 'Leo dit : J’apprécie aussi le calme, mais les entreprises ont besoin de souplesse pour survivre.'
    note: Leo oppose la souplesse à l’accent mis par Amara sur l’espace public.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara nuance
    gloss: 'Amara dit : C’est juste, et je ne plaide pas pour le silence partout. Mon point est que les espaces partagés ne devraient pas être façonnés uniquement par le profit.'
    note: '*not arguing for silence everywhere* évite que sa position paraisse absolue.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo nomme la valeur
    gloss: 'Leo dit : Donc la valeur à laquelle tu donnes la priorité, c’est l’équité, pas seulement le confort ?'
    note: '*prioritizing* signifie ici : faire passer en premier dans la balance.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara met les valeurs en balance
    gloss: 'Amara dit : Exactement. En principe, la commodité compte, mais l’équité devrait peser davantage quand un espace appartient à tout le monde.'
    note: '*carry more weight* est l’anglais naturel pour « peser davantage ».'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo accepte sous condition
    gloss: 'Leo dit : Je peux l’accepter si les règles sont limitées et claires.'
    note: L’acceptation dépend du caractère limité et clair des règles.
