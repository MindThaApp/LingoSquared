course:
  title: Anglais B2
  description: Apprendre l’anglais au niveau B2 pour des conversations nuancées, des arguments, des hypothèses et des discussions professionnelles, avec des explications en français courant.
units:
  en.b2.unit02.speculation:
    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must et cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: 'Lecture : que s''est-il probablement passé ?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
    title: A deduction, not just a guess
teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: il se peut que, pouvoir (possibilité)
    note: '*may* exprime la possibilité. Ici, il ne s''agit pas de la permission, comme dans *May I...?*.'
    example_gloss: Cela peut être vrai.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: il se pourrait que, peut-être
    note: '*might* exprime une possibilité prudente, souvent un peu moins sûre que *may*.'
    example_gloss: Cela pourrait être vrai.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: doit sûrement, forcément
    note: '*must* exprime ici une forte conclusion fondée sur des preuves, et non une obligation.'
    example_gloss: Cela doit forcément être vrai.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: ne peut pas, est impossible
    note: '*cannot* s''emploie quand les preuves excluent quelque chose. Au passé, cela donne *cannot have been*.'
    example_gloss: Cela ne peut pas être vrai.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: déduction, conclusion tirée de preuves
    note: '*deduction* consiste à raisonner à partir d''indices, et non à deviner au hasard.'
    example_gloss: La déduction de Mia repose sur des preuves.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: conjectures, supputations
    note: '*guesswork* est une supposition avec peu ou pas de preuves.'
    example_gloss: Sans preuves, l'explication ne serait que conjecture.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May et might se recoupent souvent. Tous deux indiquent une explication possible ; might paraît souvent un peu plus prudent.
    note: Ne traduis pas systématiquement « peut-être » par *maybe*. Dans une phrase soignée, *may* et *might* sont souvent plus élégants.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Forte déduction sur le passé
    gloss: Le serveur a dû tomber en panne pendant la nuit, car aucun rapport n'a été généré.
    note: 'Le français « a dû + infinitif » se rend en anglais par *must have* + participe passé : *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Cause possible dans le passé
    gloss: Les rapports ont peut-être échoué pendant la nuit.
    note: '*may have failed* indique une cause possible, et non une conclusion certaine.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Possibilité prudente
    gloss: Il s'agissait peut-être plutôt d'un problème de droits d'accès.
    note: '*might have been* laisse la cause ouverte et sonne plus prudent que *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Exclure quelque chose
    gloss: Il ne peut pas s'être agi seulement d'un problème de rapport.
    note: « Ne peut pas avoir été » ou « n'a pas pu être » se rend ici par *cannot have been* ou, à l'oral, *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Les modaux de la spéculation
    gloss: Utilise must be pour une forte déduction sur le présent et must have been pour une forte déduction sur le passé. Utilise may/might pour une possibilité présente, et may have/might have pour une possibilité passée. Utilise cannot/cannot have been quand les preuves excluent une explication.
    note: 'Attention : *must* ne signifie pas ici l''obligation, mais « il faut que ce soit ainsi » : une conclusion.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: panne, interruption de service
    note: '*outage* est une panne pendant laquelle un système ou un service ne fonctionne pas.'
    example_gloss: Une panne du système a empêché les rapports de s'exécuter.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: conséquence
    note: '*consequence* est ce qui découle d''une cause ou d''un problème.'
    example_gloss: Une conséquence est que le tableau de bord peut afficher d'anciennes données.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Texte : que s''est-il probablement passé ?'
    gloss: Les rapports de nuit ne se sont pas exécutés, et la page de supervision est vide. Mia dit que le serveur a dû tomber en panne pendant la nuit. Daniel suggère qu'il pourrait s'agir d'un problème de droits d'accès, mais cela ne peut pas expliquer la page de supervision vide. L'équipe financière n'a peut-être pas les chiffres du matin, et le tableau de bord client pourrait afficher d'anciennes données jusqu'à la reconstruction des rapports. Mia n'est pas tout à fait sûre, mais son explication est une déduction tirée des preuves disponibles, et non de la pure conjecture.
    note: Le texte distingue les faits, les causes possibles, les fortes déductions, les explications exclues et les conséquences possibles.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel énonce le fait
    gloss: 'Daniel dit : Aucun des rapports de nuit n''a été généré.'
    note: C'est le fait connu, pas encore une spéculation.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia tire une forte conclusion
    gloss: 'Mia dit : Le serveur a dû tomber en panne pendant la nuit.'
    note: '*must have gone down* est une forte déduction sur le passé.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel évoque une cause possible
    gloss: 'Daniel dit : Il s''agissait peut-être plutôt d''un problème de droits d''accès.'
    note: '*might have been* laisse l''option ouverte, sans la rendre certaine.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia exclut une explication trop étroite
    gloss: 'Mia dit : Peut-être, mais la page de supervision est vide aussi, donc il ne peut pas s''agir seulement d''un problème de rapport.'
    note: '*cannot have been only...* exclut l''explication parce que les preuves sont plus larges.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel demande les conséquences
    gloss: 'Daniel demande : Quelles conséquences devons-nous attendre ?'
    note: Après la cause vient la question des conséquences possibles.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia évoque des conséquences possibles
    gloss: 'Mia dit : L''équipe financière n''a peut-être pas les chiffres du matin, et le tableau de bord client pourrait afficher d''anciennes données.'
    note: '*may be missing* et *might show* indiquent des conséquences possibles, pas des faits certains.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel vérifie le degré de certitude
    gloss: 'Daniel dit : Donc c''est une déduction, pas juste une supposition ?'
    note: Daniel demande si le raisonnement de Mia repose sur des preuves.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia nuance sa conclusion
    gloss: 'Mia dit : Oui. Les preuves sont limitées, mais elles indiquent une panne du système.'
    note: Une forte conclusion peut quand même reconnaître les limites des preuves.
