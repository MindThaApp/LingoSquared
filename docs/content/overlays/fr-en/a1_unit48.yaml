teaching:
  en.a1.unit48.lesson01.teach.library:
    title: library
    gloss: bibliothèque
    note: '*library* signifie « bibliothèque ». Attention : en anglais, *library* ne désigne jamais une librairie (*bookstore*).'
    example_gloss: Je vais à la bibliothèque chaque semaine.
  en.a1.unit48.lesson01.teach.borrow:
    title: borrow
    gloss: emprunter
    note: '*borrow* signifie « emprunter » (prendre quelque chose à quelqu’un pour le rendre ensuite).'
    example_gloss: Je voudrais emprunter ce livre.
  en.a1.unit48.lesson01.teach.return:
    title: return
    gloss: rendre / rapporter
    note: '*return* signifie ici « rendre » ou « rapporter ».'
    example_gloss: Je peux rendre ce livre ?
  en.a1.unit48.lesson01.teach.due:
    title: due
    gloss: à rendre / date de retour
    note: '*due* se traduit en français par une tournure : « à rendre pour le ... » ou « la date de retour est ... ». L’anglais l’exprime en un seul mot.'
    example_gloss: C’est à rendre pour quand ?
  en.a1.unit48.lesson01.teach.card:
    title: library card
    gloss: carte de bibliothèque
    note: '*library card* signifie « carte de bibliothèque ».'
    example_gloss: Voici ma carte de bibliothèque.
  en.a1.unit48.lesson02.teach.do_you_have_a_library_card:
    title: Do you have a library card?
    gloss: Avez-vous une carte de bibliothèque ?
    note: '*Do you have a library card?* signifie « avez-vous une carte de bibliothèque ? ».'
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card:
    title: Yes, here's my library card.
    gloss: Oui, voici ma carte de bibliothèque.
    note: '*here''s* est la contraction de *here is*.'
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book:
    title: I'd like to borrow this book.
    gloss: Je voudrais emprunter ce livre.
    note: '*I''d like to...* signifie « je voudrais... », la même forme polie que dans l’unité 47.'
  en.a1.unit48.lesson02.teach.when_is_this_book_due:
    title: When is this book due?
    gloss: Ce livre est à rendre pour quand ?
    note: 'Encore le mot *due*, rendu en français par une tournure : « à rendre pour ... ».'
  en.a1.unit48.lesson02.teach.can_i_return_this_book:
    title: Can I return this book?
    gloss: Je peux rendre ce livre ?
    note: '*Can I return this book?* signifie « je peux rendre ce livre ? ».'
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday:
    title: Your book is due on Friday.
    gloss: Votre livre est à rendre vendredi.
    note: '*due on Friday* utilise *on* devant un jour précis.'
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: La proposition de Leila
    gloss: 'Leila dit : Je dois rendre ce livre à la bibliothèque. Tu veux venir avec moi ?'
    note: '*Do you want to come with me?* signifie « tu veux venir avec moi ? ».'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: La réaction de Daniel
    gloss: 'Daniel dit : Bien sûr ! Je crois que je n’ai jamais emprunté de livre dans une bibliothèque.'
    note: '*I don''t think I''ve ever ...* signifie « je crois que je n’ai jamais ... », avec le present perfect (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila à l’accueil
    gloss: 'Leila dit : Bonjour, je voudrais rendre ce livre, et j’aimerais aussi en emprunter un nouveau.'
    note: '*and I''d like to ... too* signifie « et j’aimerais aussi ... ».'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: La bibliothécaire demande
    gloss: 'La bibliothécaire dit : Très bien, merci. Vous avez votre carte de bibliothèque ?'
    note: '*Do you have your library card?* signifie « vous avez votre carte de bibliothèque ? ».'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Oui, la voici.'
    note: '*here it is* signifie « la/le voici ».'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: La bibliothécaire explique
    gloss: 'La bibliothécaire dit : Parfait. Ce nouveau livre est à rendre dans trois semaines.'
    note: '*due back in three weeks* signifie « à rendre dans trois semaines ».'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel veut aussi emprunter
    gloss: 'Daniel dit : Je peux aussi avoir une carte de bibliothèque ? J’aimerais emprunter un livre de cuisine.'
    note: '*Can I get ... too?* signifie « je peux aussi avoir ... ? ».'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: La bibliothécaire aide Daniel
    gloss: 'La bibliothécaire dit : Bien sûr ! Remplissez simplement ce formulaire.'
    note: '*fill out this form* signifie « remplir ce formulaire » ; en anglais, *fill out* est un verbe à particule, dont le sens dépend de la petite particule *out*.'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Texte sur le fonctionnement d’une bibliothèque
    gloss: 'Visiter la bibliothèque : la plupart des bibliothèques te permettent d’emprunter des livres, et parfois d’autres objets, pour quelques semaines. Pour emprunter quelque chose, il faut en général une carte de bibliothèque. Quand tu empruntes un livre, le bibliothécaire t’indique la date de retour -- le jour où tu dois le rendre. Si tu n’as pas fini d’ici là, tu peux souvent demander un délai supplémentaire au bibliothécaire. Depuis que Leila a emménagé dans son nouvel appartement, elle a moins de livres qu’avant, alors elle s’est mise à les emprunter à la bibliothèque au lieu de les acheter. La semaine dernière, elle a rendu un livre et en a pris un nouveau, et son ami Daniel l’a accompagnée. Il n’avait jamais emprunté de livre à la bibliothèque, alors il a obtenu sa propre carte et a emprunté un livre de cuisine pour s’entraîner aux recettes que Mia lui apprend. La bibliothécaire leur a rappelé à tous les deux de rapporter leurs livres avant la date de retour. Mia ne va pas souvent à la bibliothèque, mais elle a déjà emprunté un livre de photographie pour son cours.'
    note: '*checked out a cookbook* signifie « a emprunté un livre de cuisine » (*check out* est l’expression habituelle pour emprunter dans une bibliothèque).'
