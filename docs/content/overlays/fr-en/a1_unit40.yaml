teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: bureau de poste
    note: '*post office* signifie « bureau de poste » (ou « la poste »).'
    example_gloss: Je vais à la poste pour envoyer des lettres.
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: lettre
    note: '*letter* signifie « lettre ».'
    example_gloss: J’écris une lettre à mon ami.
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: colis / paquet
    note: '*package* signifie « colis » ou « paquet ».'
    example_gloss: J’envoie un colis à ma sœur.
  en.a1.unit40.lesson01.teach.stamp:
    title: stamp
    gloss: timbre
    note: '*stamp* signifie « timbre ».'
    example_gloss: J’ai besoin d’un timbre pour cette lettre.
  en.a1.unit40.lesson01.teach.envelope:
    title: envelope
    gloss: enveloppe
    note: '*envelope* signifie « enveloppe ».'
    example_gloss: Je mets la lettre dans une enveloppe.
  en.a1.unit40.lesson01.teach.mailbox:
    title: mailbox
    gloss: boîte aux lettres
    note: '*mailbox* signifie « boîte aux lettres ».'
    example_gloss: La boîte aux lettres est à côté de la poste.
  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: envoyer une lettre
    note: '*send a letter* signifie « envoyer une lettre ».'
    example_gloss: Je veux envoyer une lettre à mes parents.
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: acheter un timbre
    note: '*buy a stamp* signifie « acheter un timbre ».'
    example_gloss: Je dois acheter un timbre pour cette carte postale.
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: écrire l’adresse
    note: '*write the address* signifie « écrire l’adresse ».'
    example_gloss: Écrivez l’adresse sur le colis, s’il vous plaît.
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: combien de temps ça prend
    note: '*how long will it take* signifie « combien de temps ça va prendre ».'
    example_gloss: Combien de temps ça va prendre pour arriver ?
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: courrier express / envoi express
    note: '*express mail* signifie « courrier express » -- un envoi plus rapide, mais plus cher.'
    example_gloss: Le courrier express est plus rapide que le courrier normal.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: Combien ça coûte d’envoyer ça ?
    note: '*How much does it cost to ...?* demande le prix d’une action.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: La demande de Daniel
    gloss: 'Daniel dit : Bonjour, je voudrais envoyer ce colis, s’il vous plaît.'
    note: '*I''d like to* + verbe est une façon polie de demander quelque chose. C’est bien plus poli que *I want*, qui sonne plutôt sec à un guichet.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: L’employé demande
    gloss: 'L’employé dit : Bien sûr ! Où va-t-il ?'
    note: '*Where is it going?* demande la destination.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : À Chicago. C’est un cadeau d’anniversaire pour ma sœur.'
    note: '*It''s a birthday gift for my sister* signifie « c’est un cadeau d’anniversaire pour ma sœur ».'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: L’employé demande
    gloss: 'L’employé dit : Vous voulez du courrier normal ou express ? L’express prend environ deux jours.'
    note: '*regular or express mail* signifie « courrier normal ou express ».'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Le choix de Daniel
    gloss: 'Daniel dit : Je prends l’express, s’il vous plaît. Ça fait combien ?'
    note: '*I''ll take ...* est une façon naturelle de faire son choix auprès d’un prestataire de service.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: L’employé répond
    gloss: 'L’employé dit : Ça fait douze dollars. Voici votre reçu.'
    note: '*Here''s your receipt* signifie « voici votre reçu ».'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Le remerciement de Daniel
    gloss: 'Daniel dit : Merci ! Bonne journée.'
    note: '*Have a good day* est une formule polie pour prendre congé.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Texte sur trois visites à la poste
    gloss: Daniel, Leila et Mia connaissent tous très bien la poste. La semaine dernière, Daniel a envoyé un colis d’anniversaire à sa sœur à Chicago. Il a payé pour du courrier express parce qu’il voulait qu’il arrive vite, et il n’a mis que deux jours. Leila s’apprête à déménager près de chez Mia, alors elle est allée à la poste pour envoyer de vieux livres à ses parents. L’employé a pesé le colis et lui a donné un timbre. Leila a demandé combien de temps le colis mettrait, et l’employé a répondu environ une semaine, puisqu’elle avait choisi le courrier normal. Mia n’envoie pas souvent de colis, mais elle achète toujours un timbre pour les lettres qu’elle écrit à sa grand-mère. Elle dit qu’une lettre avec un timbre fait plus personnel qu’un SMS.
    note: '*getting ready to move* signifie « se préparer à déménager ».'
