teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: arrière-plan, contexte
    note: '*background* désigne ce qui était déjà en cours ou ce qui donne le contexte. Dans un récit anglais, on met souvent l''arrière-plan au past continuous.'
    example_gloss: Les informations de contexte disent ce qui se passait déjà.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: événement principal
    note: '*foreground* est l''événement vers lequel le récit avance. En anglais, on emploie souvent le simple past, et non automatiquement le present perfect.'
    example_gloss: L'événement principal est l'événement le plus important du récit.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: antérieur, préalable
    note: '*prior* signifie antérieur à un autre moment du passé. On emploie souvent le past perfect : *had moved*.'
    example_gloss: Un événement antérieur s'est produit avant un autre événement du passé.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: interrompre
    note: '*interrupt* s''emploie quand un événement bref vient couper quelque chose qui était en cours.'
    example_gloss: Un problème soudain peut interrompre une action.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: en cours
    note: '*ongoing* correspond à « en cours ». Pour une action en cours dans le passé, l''anglais emploie souvent *was/were + -ing*, là où le français utilise l''imparfait ou « était en train de ».'
    example_gloss: Une action en cours dure un certain temps.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: chronologie, ordre réel des faits
    note: '*chronology* est l''ordre réel des événements, même si le récit les raconte dans un autre ordre.'
    example_gloss: La chronologie est l'ordre réel des événements.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Quelque chose s'était déjà produit avant
    gloss: Quand je suis arrivé, le coordinateur avait déjà déplacé le matériel à l'intérieur.
    note: '*had already moved* indique que cela s''est produit avant *I arrived*. Le français emploie ici le plus-que-parfait (avait déplacé) ; en anglais, dis donc *had moved* et non *has moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Action en cours et interruption
    gloss: Pendant que je vérifiais le système de sonorisation, le courant a été coupé.
    note: '*was checking* correspond à l''imparfait ou à « était en train de vérifier ». L''interruption elle-même est au simple past : *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Arriver pendant une action de fond
    gloss: Quand je suis arrivé, les bénévoles étaient en train d'installer les chaises.
    note: Utilise *were setting up* pour ce qui était en cours quand l'événement principal s'est produit.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Les plans temporels d'un récit
    gloss: Utilise le past continuous pour l'action d'arrière-plan, le simple past pour les événements principaux et le past perfect pour ce qui s'était déjà produit avant.
    note: 'En français, le passé composé sert souvent à raconter ; en anglais narratif, on emploie plutôt le simple past : *the power went out*, et non *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: lieu, site de l'événement
    note: '*venue* est l''endroit où se déroule un événement.'
    example_gloss: Le lieu est l'endroit où se tient un événement.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: retardé, reporté
    note: '*delayed* signifie que quelque chose commence ou se produit plus tard que prévu.'
    example_gloss: L'événement a commencé avec vingt minutes de retard.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Texte : le problème sur le site'
    gloss: Simon n'a pas raconté l'histoire dans un strict ordre chronologique. Avant son arrivée sur le site, le coordinateur avait déplacé le matériel à l'intérieur parce que de la pluie était prévue. Quand Simon est arrivé, les bénévoles installaient les chaises. Pendant qu'il vérifiait le système de sonorisation, le courant a été coupé. Il a appelé la responsable du bâtiment, qui lui a expliqué qu'une équipe de réparation avait travaillé à proximité plus tôt dans la matinée. L'équipe a retardé le début de vingt minutes, mais au moment où les invités sont entrés, la lumière était revenue.
    note: 'Observe les plans temporels de l''anglais : *had moved* pour l''antérieur, *were setting up* pour l''arrière-plan et *went out* pour l''événement principal.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper demande le récit
    gloss: 'Harper demande : Peux-tu me raconter pas à pas ce qui s''est passé sur le site ?'
    note: '*walk me through* signifie guider quelqu''un pas à pas à travers un événement.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon combine les plans temporels
    gloss: 'Simon dit : Bien sûr. Quand je suis arrivé, les bénévoles installaient les chaises, mais le coordinateur avait déjà déplacé le matériel à l''intérieur parce que de la pluie était prévue.'
    note: Un bon récit combine une action d'arrière-plan avec un événement antérieur.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper vérifie l'ordre
    gloss: 'Harper demande : Donc le matériel était à l''abri avant que tu arrives ?'
    note: 'La question porte sur l''ordre : le matériel était déjà à l''abri avant l''arrivée de Simon.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon évoque l'interruption
    gloss: 'Simon dit : Exactement. Ensuite, pendant que je vérifiais le système de sonorisation, le courant a été coupé.'
    note: '*while I was checking* est l''action en cours ; *the power went out* est l''interruption.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper demande l'étape suivante
    gloss: 'Harper demande : Qu''as-tu fait ensuite ?'
    note: '*What did you do...?* emploie le simple past avec *did* pour une question sur une étape terminée.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon donne un contexte antérieur
    gloss: 'Simon dit : J''ai appelé la responsable du bâtiment, et elle m''a dit qu''une équipe de réparation avait travaillé à proximité plus tôt dans la matinée.'
    note: '*had been working* montre que ce travail était déjà en cours plus tôt dans la matinée.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper demande des nouvelles de l'événement
    gloss: 'Harper demande : Et l''événement ?'
    note: La question brève demande quelle a été la conséquence pour l'événement.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon conclut
    gloss: 'Simon dit : Nous avons retardé le début de vingt minutes, mais au moment où les invités sont entrés, la lumière était revenue.'
    note: '*had come back on* s''est produit avant le moment où les invités sont entrés.'
