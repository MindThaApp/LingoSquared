teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: qui (pour une personne)
    note: '*who* renvoie à une personne dans une proposition relative.'
    example_gloss: Daniel, qui a rejoint l’équipe en mars, dirige déjà deux projets.
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: qui, que (pour une chose)
    note: '*which* renvoie à une chose dans une proposition relative.'
    example_gloss: Le cours de design que Leila a choisi commence en juin.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: qui, que (relative déterminative)
    note: '*that* renvoie à une personne ou à une chose dans une relative déterminative.'
    example_gloss: Le client qui a appelé ce matin veut un rendez-vous.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: dont
    note: '*whose* exprime la possession dans une proposition relative.'
    example_gloss: Le client dont ils terminent le projet a déjà validé la maquette.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: où
    note: '*where* renvoie à un lieu dans une proposition relative.'
    example_gloss: Le bureau où travaille Daniel se trouve en centre-ville.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: collègue
    note: '*coworker* désigne une personne avec qui on travaille.'
    example_gloss: Mia a une collègue qui étudie l’espagnol le soir.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who im bestimmenden Relativsatz
    gloss: La collègue qui est assise à côté de Mia est très organisée.
    note: '*who* introduit ici une information nécessaire pour savoir de qui on parle.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who im nicht bestimmenden Relativsatz
    gloss: Daniel, qui a rejoint l’équipe en mars, dirige déjà deux projets.
    note: Les virgules montrent que la proposition relative apporte une information supplémentaire, pas nécessaire pour identifier la personne.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Bestimmende und nicht bestimmende Relativsätze
    gloss: 'Utilise une relative déterminative, sans virgules, pour préciser exactement de qui ou de quoi tu parles : The colleague who sits next to Mia is organized. Utilise une relative non déterminative, entre virgules, pour ajouter une information sur quelqu’un que l’on a déjà identifié : Daniel, who joined in March, already leads two projects. Comme en français, la virgule signale l’information supplémentaire.'
    note: 'Forme : déterminative = pas de virgules, elle précise qui ou quoi ; non déterminative = virgules, elle ajoute une information.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: échéance, date limite
    note: '*deadline* désigne la date ou l’heure avant laquelle quelque chose doit être terminé.'
    example_gloss: La collègue qui est assise à côté de Mia respecte toujours ses échéances.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: valider, approuver
    note: '*approve* signifie accepter officiellement quelque chose.'
    example_gloss: Le client a déjà validé la première maquette.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue Büro'
    gloss: Mia travaille avec plusieurs personnes qui lui facilitent la tâche. Daniel, qui a rejoint l’équipe en mars, dirige déjà deux projets. La collègue qui est assise à côté de Mia est très organisée et respecte toujours ses échéances. Leur bureau, qui est au cinquième étage, a une petite cuisine où tout le monde déjeune ensemble. Le client dont ils terminent le projet a déjà validé la première maquette.
    note: Un court texte avec des relatives déterminatives et non déterminatives.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia stellt die neue Kollegin vor
    gloss: 'Mia dit : Leila, tu as déjà rencontré la femme qui vient d’arriver dans notre équipe ?'
    note: '*who* renvoie ici à *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila fragt nach dem Platz der neuen Kollegin
    gloss: 'Leila dit : Pas encore. C’est la personne dont le bureau est près de la fenêtre ?'
    note: '*whose* exprime la possession : *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia beschreibt die neue Kollegin
    gloss: 'Mia dit : Oui, c’est elle. C’est la graphiste qui a terminé le projet du logo.'
    note: '*who* renvoie à *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila erinnert sich an das Projekt
    gloss: 'Leila dit : Ah oui, je me souviens. C’est le projet qui a remporté le prix le mois dernier ?'
    note: '*which* renvoie à *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia erzählt von ihrem früheren Büro
    gloss: 'Mia dit : Exactement. Le bureau où elle travaillait avant était beaucoup plus petit que le nôtre.'
    note: '*where* renvoie à un lieu : *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila versteht, warum sie die Küche mag
    gloss: 'Leila dit : Ça explique pourquoi elle aime autant la cuisine où tout le monde déjeune ensemble.'
    note: '*where* renvoie à *the kitchen*.'
