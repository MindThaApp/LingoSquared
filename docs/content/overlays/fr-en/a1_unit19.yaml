teaching:
  en.a1.unit19.lesson01.teach.like:
    title: like
    gloss: aimer (bien)
    note: '*like* veut dire aimer bien ou apprécier.'
    example_gloss: J’aime le café.
  en.a1.unit19.lesson01.teach.dont_like:
    title: don't like
    gloss: ne pas aimer
    note: '*don''t like* est la forme négative de *like*.'
    example_gloss: Je n’aime pas le thé.
  en.a1.unit19.lesson01.teach.prefer:
    title: prefer
    gloss: préférer
    note: Avec *prefer*, tu dis ce que tu choisis plutôt qu’autre chose quand tu as le choix.
    example_gloss: Je préfère le café.
  en.a1.unit19.lesson01.teach.love:
    title: love
    gloss: adorer
    note: '*love* veut dire aimer énormément.'
    example_gloss: J’adore ma famille.
  en.a1.unit19.lesson01.teach.hate:
    title: hate
    gloss: détester
    note: '*hate* est le contraire de *love*.'
    example_gloss: Je déteste être en retard.
  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: Tu aimes le café ou le thé ?
    note: Tu utilises cette phrase pour demander de choisir entre deux possibilités.
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: Je préfère le thé.
    note: Avec *I prefer...*, tu dis ce que tu préfères.
  en.a1.unit19.lesson02.teach.because_reason:
    title: I like tea because it's milder.
    gloss: J’aime le thé parce qu’il est plus doux.
    note: Tu utilises *because* pour donner la raison d’une préférence.
  en.a1.unit19.lesson03.teach.very_much:
    title: very much
    gloss: beaucoup
    note: '*very much* veut dire beaucoup.'
    example_gloss: J’aime beaucoup le café.
  en.a1.unit19.lesson03.teach.preference_text:
    title: Un texte sur les préférences
    gloss: J’aime le thé, mais je n’aime pas le café. Je préfère le thé parce qu’il est plus doux.
    note: Dans ce court texte, quelqu’un dit ce qu’il aime et pourquoi.
  en.a1.unit19.lesson04.teach.too_strong:
    title: It's too strong.
    gloss: C’est trop fort.
    note: '*too strong* veut dire trop fort.'
  en.a1.unit19.lesson04.teach.q_coffee_or_tea:
    title: Demander café ou thé
    gloss: 'Leila demande : Tu aimes le café ou le thé ?'
    note: C’est la même question que dans la deuxième leçon.
  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : Je préfère le thé. Je n’aime pas trop le café.'
    note: Daniel dit sa préférence, puis ajoute un détail.
  en.a1.unit19.lesson04.teach.q_why_not:
    title: Why not?
    gloss: Pourquoi pas ?
    note: Avec *Why not?*, tu demandes la raison quand quelqu’un n’aime pas quelque chose.
  en.a1.unit19.lesson04.teach.a_too_strong_calmer:
    title: La réponse complète de Daniel
    gloss: 'Daniel dit : Je trouve que c’est trop fort. J’aime le thé parce qu’il est plus doux.'
    note: Daniel explique pourquoi il n’aime pas le café et pourquoi il préfère le thé.
  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: Il préfère le thé. Il trouve que c’est trop fort.
    note: '*prefers* et *thinks* sont des formes de la troisième personne du singulier (*he*/*she*), avec un *-s* à la fin.'
