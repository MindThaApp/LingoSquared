teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: chambre
    note: '*bedroom* signifie chambre. Il se compose de *bed* (lit) et *room* (pièce), mais en anglais il se prononce avec l’accent sur la première partie : *BED-room*.'
    example_gloss: Ma chambre est à côté de la salle de bains.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: cuisine
    note: '*kitchen* signifie cuisine. Il se prononce *KITCH-en* ; le *t* ne se prononce pas.'
    example_gloss: La cuisine est à côté du salon.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: salle de bains
    note: '*bathroom* signifie salle de bains. Aux États-Unis, c’est souvent aussi le mot pour les toilettes.'
    example_gloss: La salle de bains a une douche.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: salon
    note: '*living room* signifie salon ou salle de séjour. Ce sont deux mots écrits séparément.'
    example_gloss: Nous regardons la télé dans le salon.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: jardin
    note: '*garden* signifie jardin. Aux États-Unis, pour le jardin derrière la maison, on dit souvent aussi *yard*.'
    example_gloss: Il n’y a pas de jardin, mais il y a un balcon.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Voici la cuisine.
    note: 'Avec *This is ...*, tu montres quelque chose. *the* renvoie à quelque chose de précis : la cuisine de cet appartement.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Combien y a-t-il de pièces ?
    note: Avec *How many...are there?*, tu demandes une quantité. *many* s’emploie avec des noms dénombrables au pluriel ; *are* est employé parce que *rooms* est au pluriel.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Il y a une petite cuisine.
    note: 'Avec *There''s...* (*there is*), tu dis qu’il y a quelque chose quelque part. Cela correspond au « il y a » français, mais en anglais le verbe varie : *there is* pour une chose, *there are* pour plusieurs.'
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: à côté de
    note: '*next to* signifie à côté de. Ce sont deux mots qui restent toujours ensemble.'
    example_gloss: La chaise est à côté de la table.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: appartement
    note: '*apartment* signifie appartement (anglais américain ; en anglais britannique, on dit *flat*).'
    example_gloss: L’appartement de Daniel a deux chambres.
  en.a1.unit24.lesson03.teach.home_text:
    title: Texte sur un appartement
    gloss: Mon appartement a deux chambres et une salle de bains. Il y a une petite cuisine à côté du salon.
    note: Dans ce court texte, une personne décrit son appartement et indique le nombre de pièces.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: Quelle est ta pièce préférée ?
    note: '*favorite* signifie préféré.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Demander de décrire l’appartement
    gloss: 'Leila dit : Parle-moi de ton appartement.'
    note: Avec *Tell me about...*, tu demandes à quelqu’un de décrire quelque chose.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Réponse de Daniel
    gloss: 'Daniel dit : Il a deux chambres et une salle de bains. Il y a une petite cuisine à côté du salon.'
    note: Daniel donne le nombre de pièces et dit où se trouve la cuisine.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Demander s’il y a un jardin
    gloss: 'Leila demande : Il y a un jardin ?'
    note: Avec *Is there...?*, tu demandes si quelque chose existe.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Réponse de Daniel
    gloss: 'Daniel dit : Non, il n’y en a pas, mais il y a un petit balcon.'
    note: Daniel dit d’abord non, puis cite une autre possibilité.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Dernière réponse de Daniel
    gloss: 'Daniel dit : Ma pièce préférée est le salon. Il est près de la cuisine, donc c’est facile d’y dîner.'
    note: Daniel dit quelle est sa pièce préférée et en donne la raison.
