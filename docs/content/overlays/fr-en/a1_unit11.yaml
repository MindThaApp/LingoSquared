    gloss: venteux
    note: '*windy* signifie venteux.'
    example_gloss: Aujourd’hui, il y a du vent.
  en.a1.unit11.lesson02.teach.whats_weather_like:
    title: What's the weather like today?
    gloss: Quel temps fait-il aujourd’hui ?
    note: '*What’s the weather like?* est la question habituelle pour demander le temps qu’il fait.'
  en.a1.unit11.lesson02.teach.its_sunny:
    title: It's sunny and warm.
    gloss: Il y a du soleil et il fait chaud.
    note: '*It’s* + adjectif décrit le temps actuel.'
  en.a1.unit11.lesson02.teach.its_raining:
    title: It's raining.
    gloss: Il pleut.
    note: '*It’s raining* est au present progressive (forme en -ing) ; en français, on dit simplement « Il pleut ».'
  en.a1.unit11.lesson02.teach.take_umbrella:
    title: You should take an umbrella.
    gloss: Tu devrais prendre un parapluie.
    note: '*should* exprime une recommandation, comme « tu devrais » en français.'
  en.a1.unit11.lesson03.teach.tomorrow:
    title: tomorrow
    gloss: demain
    note: '*tomorrow* signifie demain (le jour suivant).'
    example_gloss: Je te vois demain.
  en.a1.unit11.lesson03.teach.forecast_text:
    title: Prévisions météo
    gloss: Demain, il y aura du soleil et il fera chaud. Samedi, il pleuvra.
    note: '*will* + verbe forme le futur anglais, un peu comme le futur simple en français (« il pleuvra »).'
  en.a1.unit11.lesson04.teach.lets_go:
    title: Let's go to the park.
    gloss: Allons au parc.
    note: '*Let’s* + verbe signifie « Allons... », « Faisons... » : c’est une proposition.'
  en.a1.unit11.lesson04.teach.q_weather:
    title: Question de Leila
    gloss: 'Leila : Quel temps fait-il aujourd’hui ?'
    note: Leila ouvre la conversation par une question sur la météo.
  en.a1.unit11.lesson04.teach.a_sunny_warm:
    title: Réponse de Daniel
    gloss: 'Daniel : Il y a du soleil et il fait chaud.'
    note: Daniel décrit le temps actuel.
  en.a1.unit11.lesson04.teach.suggest_park:
    title: Proposition de Leila
    gloss: 'Leila : Super, allons au parc.'
    note: '*Great* exprime l’enthousiasme face au beau temps.'
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow:
    title: Réponse de Daniel
    gloss: 'Daniel : Bonne idée. Mais il va pleuvoir samedi, alors allons-y aujourd’hui.'
    note: '*so* relie la cause (la pluie samedi) à la conséquence (y aller aujourd’hui).'
