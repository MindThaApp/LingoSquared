    note: '*cold* signifie froid.'
    example_gloss: Il fait très froid dehors.
  en.a1.unit11.lesson01.teach.hot:
    title: hot
    gloss: chaud
    note: '*hot* signifie chaud.'
    example_gloss: En été, il fait chaud.
  en.a1.unit11.lesson01.teach.windy:
