  en.a1.unit11.lesson01.teach.rainy:
    title: rainy
    gloss: pluvieux
    note: '*rainy* signifie pluvieux.'
    example_gloss: Je n’aime pas les jours de pluie.
  en.a1.unit11.lesson01.teach.cloudy:
