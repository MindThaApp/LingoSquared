course:
  title: Anglais B1
  description: 'Apprends l’anglais au niveau B1 : obligations, possibilités, situations hypothétiques et récits du quotidien, avec des explications détaillées en français.'
units:
  en.b1.unit03.hypotheticals:
    title: S’il pleut, si j’avais le temps
lessons:
  en.b1.unit03.lesson01.conditional_vocabulary:
    title: If, rain et free time
  en.b1.unit03.lesson02.real_conditions:
    title: If it rains, we will stay home
