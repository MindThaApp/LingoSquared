teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: si (condition)
    note: '*if* introduit une condition, comme « si » en français. Pour parler du moment (« quand », « dès que »), on utilise *when*, pas *if*.'
    example_gloss: S’il pleut, nous restons à la maison.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: pluie / pleuvoir
    note: '*rain* désigne l’eau qui tombe du ciel, ou le verbe « pleuvoir ».'
    example_gloss: Il pourrait pleuvoir ce week-end.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: rester à la maison
    note: '*stay home* signifie ne pas sortir et rester chez soi.'
    example_gloss: S’il pleut, nous restons à la maison.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: week-end
    note: '*weekend* désigne le samedi et le dimanche.'
    example_gloss: Quels sont tes projets pour le week-end ?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: temps libre
    note: '*free time* désigne le temps pendant lequel on ne travaille pas et on n’est pas occupé.'
    example_gloss: Je n’ai pas beaucoup de temps libre en ce moment.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: peindre
    note: '*paint* signifie faire un tableau avec de la peinture.'
    example_gloss: Leila aime peindre le week-end.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: S’il pleut demain, nous resterons à la maison.
    note: '*if + present, will* + verbe à l’infinitif exprime une condition réelle et possible dans le futur.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: Si j’ai du temps libre ce week-end, je peindrai.
    note: 'La même construction : *if + present, will* + verbe à l’infinitif.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: S’il pleut, nous restons à la maison. Si j’ai le temps, je peindrai.
    note: Après *if*, l’anglais emploie ici le présent, même pour parler du futur ; on ne dit pas *will rain*.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: ferait / ferais (conditionnel)
    note: '*would* + verbe à l’infinitif exprime une situation irréelle ou hypothétique au présent.'
    example_gloss: Si j’avais plus de temps, je peindrais tous les jours.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: cours / atelier
    note: '*class* désigne un cours organisé, donné par un enseignant.'
    example_gloss: Il y avait un cours de peinture près de chez elle.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: Leila aime peindre, mais elle n’a pas beaucoup de temps libre. Si elle avait plus de temps libre, elle peindrait tous les jours. Le mois dernier, il y avait un cours de peinture près de chez elle. Si elle l’avait su plus tôt, elle se serait inscrite. Maintenant, elle cherche de nouveaux cours chaque semaine.
    note: Un court texte avec une situation irréelle au présent et une situation irréelle dans le passé.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: 'Daniel dit : Quels sont tes projets pour le week-end ?'
    note: Une question ouverte simple pour engager la conversation.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: 'Leila dit : S’il ne pleut pas, j’irai me promener. S’il pleut, je resterai à la maison et je peindrai.'
    note: Deux conditions réelles qui se suivent, selon la météo.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: 'Daniel dit : Ça a l’air bien. Tu as suivi ce cours de peinture le mois dernier ?'
    note: Une question de suivi sur quelque chose qui s’est passé.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: 'Leila dit : Non. Si je l’avais su plus tôt, je me serais inscrite.'
    note: '*if + past perfect, would have* + participe passé exprime une situation irréelle dans le passé ou un regret.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: 'Daniel dit : Dommage. S’il y en a un autre, tu devrais t’y inscrire.'
    note: Daniel emploie *should* pour encourager Leila à saisir la prochaine occasion.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: 'Leila dit : Tu as raison. Si j’en vois un, je m’inscrirai tout de suite.'
    note: Une nouvelle condition réelle à propos du futur, qui n’est plus hypothétique.
