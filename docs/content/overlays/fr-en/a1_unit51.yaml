    note: '*Can I help you?* signifie puis-je vous aider ?'
  en.a1.unit51.lesson02.teach.i_have_a_bad_cough_and_a_runny_nose:
    title: I have a bad cough and a runny nose.
    gloss: J’ai une forte toux et le nez qui coule.
    note: '*a bad cough* signifie une forte toux.'
  en.a1.unit51.lesson02.teach.do_you_have_something_for_a_sore_throat:
    title: Do you have something for a sore throat?
    gloss: Avez-vous quelque chose contre le mal de gorge ?
    note: '*something for ...* signifie quelque chose contre…, pour parler d’un remède qui soulage un symptôme.'
  en.a1.unit51.lesson02.teach.take_one_tablet_every_four_hours:
    title: Take one tablet every four hours.
    gloss: Prenez un comprimé toutes les quatre heures.
    note: En anglais, *every four hours* correspond à toutes les quatre heures en français.
  en.a1.unit51.lesson02.teach.how_much_is_that:
    title: How much is that?
    gloss: Ça coûte combien ?
    note: '*How much is that?* signifie ça coûte combien ?'
  en.a1.unit51.lesson02.teach.thats_nine_dollars:
    title: That's nine dollars.
    gloss: Ça fait neuf dollars.
    note: '*That''s nine dollars.* signifie ça fait neuf dollars.'
  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Le pharmacien accueille les clients
    gloss: 'Le pharmacien dit : Bonjour, puis-je vous aider ?'
    note: '*Hi, can I help you?* signifie bonjour, puis-je vous aider ?'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Les symptômes de Leila
    gloss: 'Leila dit : Oui, j’ai une forte toux et le nez qui coule.'
    note: C’est une phrase déjà apprise.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Le pharmacien conseille un sirop
    gloss: 'Le pharmacien dit : J’ai un sirop contre la toux qui devrait vous soulager. Prenez-le avant de vous coucher.'
    note: '*before bed* signifie avant de se coucher ; cette indication concerne le sirop contre la toux, pas les comprimés.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: La question de Daniel
    gloss: 'Daniel demande : Avez-vous aussi quelque chose contre le mal de gorge ?'
    note: '*too*, placé à la fin, signifie aussi.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Le pharmacien conseille des comprimés
    gloss: 'Le pharmacien dit : Oui, ces comprimés sont efficaces contre le mal de gorge. Prenez-en un toutes les quatre heures.'
    note: 'Il s’agit de la posologie des comprimés : toutes les quatre heures. Le sirop se prend à un autre moment, avant de se coucher.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: La décision de Leila
    gloss: 'Leila dit : Parfait, je prends les deux. Ça coûte combien ?'
    note: '*I''ll take both.* signifie je prends les deux.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Le prix
    gloss: 'Le pharmacien dit : Ça fait neuf dollars.'
    note: C’est une phrase déjà apprise.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila paie
    gloss: 'Leila dit : Voilà. Merci !'
    note: '*Here you go.* signifie voilà, lorsqu’on tend quelque chose à quelqu’un.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Texte sur une visite à la pharmacie
    gloss: 'Une visite à la pharmacie : Quelques jours après son excursion à la montagne avec Mia, Leila a attrapé un rhume. Elle avait une forte toux, le nez qui coulait et mal à la gorge. Daniel l’a accompagnée à la pharmacie près de son appartement. Le pharmacien a écouté Leila décrire ses symptômes et lui a recommandé du sirop contre la toux et des comprimés. Il lui a dit de prendre le sirop avant de se coucher et un comprimé toutes les quatre heures. Leila a payé neuf dollars pour les deux. Sur le chemin du retour, Daniel lui a aussi acheté une boîte de mouchoirs. Leila a pris les médicaments ce soir-là et, à l’approche du week-end, sa toux allait déjà beaucoup mieux.'
    note: '*by the weekend* signifie d’ici le week-end ou à l’approche du week-end.'
