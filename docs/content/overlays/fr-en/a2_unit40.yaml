course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit40.online_order_problem:
    title: Un problème avec une commande en ligne
lessons:
  en.a2.unit40.lesson01.online_order_vocabulary:
    title: Commandes, livraisons et colis endommagés
  en.a2.unit40.lesson02.explaining_the_problem:
    title: Expliquer le problème et demander un remplacement
  en.a2.unit40.lesson03.reading_a_return_message:
    title: Lire la réponse de la boutique
  en.a2.unit40.lesson04.online_order_dialogue:
    title: Appeler à propos de la lampe cassée
teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: commande
    note: '*order* est la commande elle-même. Comme verbe, *to order* signifie commander.'
    example_gloss: Ma commande est arrivée avec deux jours de retard.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: livraison
    note: '*delivery* est le moment où ta commande t’est apportée chez toi.'
    example_gloss: La livraison est arrivée mardi matin.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: colis
    note: '*parcel* est le paquet emballé qui est déposé à ta porte.'
    example_gloss: Le colis a été laissé dehors, devant ma porte.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: endommagé
    note: '*damaged* dit que quelque chose a été abîmé en route, mais fonctionne peut-être encore. On le dit surtout de l’emballage.'
    example_gloss: Le carton était endommagé à son arrivée.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: cassé
    note: '*broken* est plus fort que *damaged* : la chose ne fonctionne plus.'
    example_gloss: La lampe dans le colis était cassée.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: remplacement, article de remplacement
    note: '*replacement* est un nouvel exemplaire à la place de celui qui est cassé. *refund* est le remboursement de l’argent.'
    example_gloss: J’ai demandé un remplacement et non le remboursement.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived und has not arrived yet
    gloss: Ma commande est arrivée hier. Ma commande n’est pas encore arrivée.
    note: On emploie *arrived* avec un moment passé. *has not arrived yet* dit que tu l’attends toujours maintenant.
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Sagen, wofür Sie anrufen
    gloss: Je voudrais signaler un problème avec ma commande.
    note: '*I''d like to report a problem with ...* est la même forme polie que pour la fuite de l’unité 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Sagen, was nicht stimmt
    gloss: La lampe est arrivée cassée.
    note: '*arrived broken* signifie : elle était déjà cassée à son arrivée.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Zwischen Ersatz und Rückerstattung wählen
    gloss: Pourrais-je avoir un remplacement plutôt qu’un remboursement ?
    note: '*instead of* oppose deux possibilités : tu choisis la première, pas la seconde.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Ihre Bestellnummer nennen
    gloss: Mon numéro de commande est le 8154.
    note: Donne ton numéro de commande dès qu’on te le demande ; c’est ainsi que l’employé retrouve ta commande.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of zum Auswählen
    gloss: Pourrais-je avoir un remplacement plutôt qu’un remboursement ? Je voudrais un remboursement plutôt qu’un échange.
    note: 'Après *instead of*, on met un nom ou une forme en -ing (*instead of a refund*, *instead of getting a refund*), jamais le verbe à l’infinitif : pas *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: carton, boîte
    note: '*box* est le carton dans lequel se trouve ta commande. *parcel* est le colis entier, tel qu’il est livré.'
    example_gloss: La lampe était dans un grand carton.
  en.a2.unit40.lesson03.teach.return_message:
    title: Die Antwort des Shops
    gloss: Merci pour votre message. Nous sommes désolés que votre lampe soit arrivée cassée. Veuillez remettre la lampe dans le carton et l’apporter au bureau de poste. Une nouvelle lampe sera expédiée sous trois jours ouvrables. Numéro de commande 8154.
    note: 'Une réponse du service client mentionne toujours : le problème, ce que tu dois faire et ce que la boutique va faire.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Was Sie mit der kaputten Lampe tun sollen
    gloss: Veuillez remettre la lampe dans le carton et l’apporter au bureau de poste.
    note: '*put ... back in ...* signifie remettre quelque chose là où il était.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila ruft den Online-Shop an
    gloss: 'Leila dit : Bonjour, je voudrais signaler un problème avec ma commande.'
    note: Au téléphone, tu dis tout de suite pourquoi tu appelles.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Der Mitarbeiter fragt nach
    gloss: 'L’employé dit : Je suis désolé de l’apprendre. Quel est le problème ?'
    note: '*I''m sorry to hear that* est la réaction polie et toute faite d’un employé face à une mauvaise nouvelle.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila erklärt das Problem
    gloss: 'Leila dit : La lampe est arrivée cassée. Le carton était endommagé.'
    note: 'Remarque la différence : le carton est *damaged*, la lampe est *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Der Mitarbeiter fragt nach der Bestellnummer
    gloss: 'L’employé dit : Je vois. Pourriez-vous m’indiquer votre numéro de commande ?'
    note: C’est la même forme de question indirecte *Could you tell me ...?* que dans l’unité 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila nennt ihre Bestellnummer
    gloss: 'Leila dit : Mon numéro de commande est le 8154.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet zwei Möglichkeiten an
    gloss: 'L’employé dit : Merci. Souhaitez-vous un remboursement ou un remplacement ?'
    note: '*or* place ici deux possibilités côte à côte ; tu en choisis une.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wählt den Ersatz
    gloss: 'Leila dit : Pourrais-je avoir un remplacement plutôt qu’un remboursement ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Der Mitarbeiter regelt es
    gloss: 'L’employé dit : Bien sûr. Une nouvelle lampe sera expédiée sous trois jours ouvrables.'
    note: C’est la même promesse que dans le message de la leçon 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Mitarbeiter
    gloss: 'Leila dit : Merci beaucoup.'
    note: '*very much* rend le remerciement un peu plus appuyé.'
