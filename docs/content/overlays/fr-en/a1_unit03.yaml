  en.a1.unit03.lesson01.teach.nine:
    title: nine
    gloss: neuf
    note: '*nine* est le nombre anglais 9.'
    example_gloss: J’ai neuf pommes.
  en.a1.unit03.lesson01.teach.ten:
    title: ten
    gloss: dix
    note: '*ten* est le nombre anglais 10.'
    example_gloss: J’ai dix pommes.
  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: onze
    note: '*eleven* est irrégulier, comme onze en français.'
    example_gloss: J’habite au numéro onze.
  en.a1.unit03.lesson02.teach.twelve:
    title: twelve
    gloss: douze
    note: '*twelve* est lui aussi irrégulier, comme douze.'
    example_gloss: J’habite au numéro douze.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: treize
    note: 'De 13 à 19, l’anglais ajoute *-teen* au nombre de base, un peu comme le français ajoute -ze (quatorze, quinze…). Pour *thirteen*, le début du mot change pourtant : *thir-* au lieu de *three*.'
    example_gloss: J’habite au numéro treize.
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: quinze
    note: '*fifteen*, et non *fiveteen* : une petite irrégularité de l’anglais.'
    example_gloss: J’habite au numéro quinze.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: vingt
    note: '*twenty* est le nombre anglais 20.'
    example_gloss: J’habite au numéro vingt.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: vingt et un
    note: 'Comme en français (vingt et un), on dit d’abord la dizaine, puis l’unité ; mais en anglais, on les relie par un trait d’union, sans et : *twenty-one*.'
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: trente
    note: '*thirty* est le nombre anglais 30.'
    example_gloss: Ça coûte trente dollars.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: quarante
    note: 'Attention : *forty*, et non *fourty* ; le *u* de *four* disparaît.'
    example_gloss: Ça coûte quarante dollars.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: cinquante
    note: '*fifty* est le nombre anglais 50.'
    example_gloss: Ça coûte cinquante dollars.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: cent
    note: En anglais, *hundred* est toujours précédé de *one* ou de *a* (*one hundred*, *a hundred*) ; en français, on dit simplement cent.
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: Quel âge as-tu ? / Quel âge avez-vous ?
    note: '*How old are you?* convient dans tous les registres : en anglais, il n’y a pas de choix à faire entre tu et vous.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: J’ai vingt-cinq ans.
    note: 'Même ordre des éléments qu’en français, mais l’anglais dit « je suis » : I’m + nombre + *years old*, là où le français dit « j’ai … ans ».'
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: Combien ça coûte ?
    note: Pour demander le prix de quelque chose.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: Ça coûte dix dollars.
    note: La réponse habituelle à une question sur le prix.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: Quel est ton numéro de téléphone ? / Quel est votre numéro de téléphone ?
    note: Pour demander un numéro de téléphone.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: C’est le cinq-cinq-cinq, un-deux-trois-quatre.
    note: En anglais, on donne un numéro de téléphone chiffre par chiffre, avec des pauses entre les groupes.
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: le marché
    note: Un endroit où l’on achète des produits alimentaires et d’autres marchandises.
    example_gloss: Nous sommes au marché.
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: des pommes
    note: Pluriel de *apple*.
    example_gloss: Les pommes sont fraîches.
  en.a1.unit03.lesson04.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Daniel demande : Combien ça coûte ?'
    note: Une simple question sur le prix.
  en.a1.unit03.lesson04.teach.price_five:
    title: Leila antwortet
    gloss: 'Leila répond : Ça coûte cinq dollars.'
    note: La réponse à la question de Daniel sur le prix.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Daniel fragt nach den Äpfeln
    gloss: 'Daniel demande : Et combien coûtent les pommes ?'
    note: '*And* relie cette question à la précédente.'
  en.a1.unit03.lesson04.teach.price_two:
    title: Leila antwortet
    gloss: 'Leila répond : Elles coûtent deux dollars.'
    note: On emploie *They’re* parce que *apples* est au pluriel.
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Daniel fragt nach dem Alter des Ladens
    gloss: 'Daniel dit : D’accord, quel âge a cette boutique ?'
    note: '*How old* peut aussi s’appliquer à des choses, pas seulement à des personnes.'
  en.a1.unit03.lesson04.teach.shop_age:
    title: Leila antwortet
    gloss: 'Leila dit : Elle a vingt ans !'
    note: 'Même construction que pour les personnes : *years old* s’emploie aussi pour les choses.'
