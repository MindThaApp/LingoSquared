teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: laverie automatique
    note: '*laundromat* signifie laverie automatique : un endroit équipé de machines à laver où l’on lave son linge en payant.'
    example_gloss: Je vais à la laverie aujourd’hui.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: machine à laver
    note: '*washing machine* signifie machine à laver.'
    example_gloss: La machine à laver est en panne.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: sèche-linge
    note: '*dryer* signifie sèche-linge.'
    example_gloss: Mets tes vêtements dans le sèche-linge.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: pièces de 25 cents (monnaie américaine)
    note: '*quarters* désigne les pièces américaines de vingt-cinq cents, souvent nécessaires pour faire fonctionner les machines d’une laverie. Le français n’a pas de mot courant pour cela : on dit « pièces de vingt-cinq cents », et *quarters* reste le mot à connaître en anglais.'
    example_gloss: Les machines acceptent les pièces de 25 cents.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: lessive
    note: '*detergent* signifie lessive (le produit pour laver le linge).'
    example_gloss: Il faut de la lessive pour nettoyer tes vêtements.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: une machine de linge
    note: '*load* signifie ici une machine de linge : la quantité de linge que l’on lave en une seule fois.'
    example_gloss: J’ai une grosse machine de linge à faire.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Je voudrais laver quelques affaires, s’il vous plaît.
    note: '*I''d like to*, contraction de *I would like to*, est la façon polie de demander quelque chose.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: Avez-vous de la monnaie pour les machines ?
    note: '*change* signifie ici la monnaie (les pièces), et non le changement.'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Combien de temps dure le cycle de lavage ?
    note: '*take* signifie ici durer (demander un certain temps), un emploi très différent de celui de *the machines take quarters*, où *take* signifie accepter. En français aussi, on utilise deux verbes différents : durer et accepter.'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: C’est trois dollars pour une machine.
    note: '*for one load* signifie pour une machine de linge.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: À quelle heure fermez-vous ?
    note: '*do you close* utilise l’auxiliaire *do* pour former la question.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Veuillez venir chercher votre linge avant neuf heures.
    note: '*pick up* signifie venir chercher ; *by nine o''clock* signifie avant neuf heures (au plus tard à cette heure-là).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: L’employé les accueille
    gloss: 'L’employé dit : Bonjour ! Avez-vous besoin d’une machine à laver ?'
    note: '*Do you need...?* utilise l’auxiliaire *do* pour former la question.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: La raison de Leila
    gloss: 'Leila dit : Oui, s’il vous plaît. Ma machine à laver est en panne à la maison.'
    note: '*at home* signifie à la maison.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: La demande de Daniel
    gloss: 'Daniel dit : J’ai aussi une petite machine de linge. Puis-je aussi utiliser une machine ?'
    note: '*too* signifie ici aussi, en fin de phrase ; *as well* a le même sens et se trouve dans la deuxième phrase.'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: L’employé parle des pièces
    gloss: 'L’employé dit : Bien sûr ! Les machines acceptent les pièces de 25 cents.'
    note: '*take* signifie ici accepter (comme moyen de paiement) ; attention à la différence avec *take* dans *The wash cycle takes thirty minutes* plus loin, où *take* signifie durer.'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila a des pièces
    gloss: 'Leila dit : Oui, j’ai des pièces de 25 cents.'
    note: Une courte confirmation, pas une information nouvelle.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: La durée du cycle de lavage
    gloss: 'L’employé dit : Le cycle de lavage dure trente minutes.'
    note: '*take* signifie ici durer, un sens différent de *take* dans *take quarters* ci-dessus.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel demande le prix
    gloss: 'Daniel dit : Et combien ça coûte ?'
    note: '*How much does it cost?* : là encore, l’auxiliaire *does* sert à former la question.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Le prix
    gloss: 'L’employé dit : C’est trois dollars pour une machine.'
    note: Une information distincte, indépendante du nombre de pièces et de la durée.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: L’heure de fermeture
    gloss: 'L’employé dit : La laverie ferme à neuf heures, alors venez chercher votre linge avant.'
    note: '*so* signifie ici alors, donc : il relie l’heure de fermeture à la consigne de venir à temps.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Texte : Une visite à la laverie'
    gloss: Un après-midi, la machine à laver de Leila est tombée en panne à la maison. Elle a décidé d’aller à la laverie au bout de la rue. Daniel l’a accompagnée parce qu’il avait lui aussi une petite machine de linge à faire. À la laverie, l’employé leur a expliqué que les machines acceptent les pièces de 25 cents et que le cycle de lavage dure trente minutes. Cela coûtait trois dollars pour une machine. Pendant que leurs vêtements lavaient, Daniel et Leila ont bavardé et pris un café dans le café d’à côté. La laverie ferme à neuf heures, alors ils ont veillé à venir chercher leur linge à temps. Leila était reconnaissante à Daniel de lui avoir tenu compagnie, et elle a dit que la machine à laver de la maison serait probablement réparée d’ici le week-end.
    note: '*would be fixed* signifie serait réparée : Leila s’attend à ce que la machine soit réparée, mais ce n’est pas encore certain.'
