  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Appelez le 911 !
    note: Aux États-Unis, en cas d’urgence, on appelle le *911*, et non le *112* ou le *15* comme en France -- une différence importante à retenir.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: J’ai besoin d’aide !
    note: '*I need help!* signifie « j’ai besoin d’aide ! ».'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: Envoyez la police, s’il vous plaît.
    note: '*Send the police, please.* signifie « envoyez la police, s’il vous plaît ».'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Envoyez une ambulance, s’il vous plaît.
    note: '*Send an ambulance, please.* signifie « envoyez une ambulance, s’il vous plaît ».'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: Il y a un incendie !
    note: '*There''s a fire!* signifie « il y a un incendie ! ».'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Quelle est votre urgence ?
    note: C’est la question habituelle d’un centre d’appels d’urgence américain dès que tu appelles le 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila sent de la fumée
    gloss: 'Leila demande : Daniel, quelque chose brûle ? Je sens de la fumée !'
    note: '*smell* + nom, sans préposition : I smell smoke = je sens de la fumée. Attention : *I smell of smoke* a un autre sens (je sens la fumée, c’est-à-dire j’en ai l’odeur sur moi).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: L’explication de Daniel
    gloss: 'Daniel dit : Oh non, la poêle a pris feu ! Je préparais le dîner.'
    note: '*caught fire* est une expression figée qui signifie « prendre feu » soudainement.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Les consignes de Leila
    gloss: 'Leila dit : Reste calme. Éteins la cuisinière ! Je vais appeler à l’aide.'
    note: '*call for help* signifie « appeler à l’aide ». N’oublie pas le mot *for* ici.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: L’avertissement de Daniel
    gloss: 'Daniel dit : Vite, le feu grandit !'
    note: '*getting bigger* signifie « devenir plus grand » -- get + adjectif pour exprimer un changement.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila appelle les secours
    gloss: 'Leila dit : Allô, c’est une urgence. Il y a un incendie dans la cuisine de mon ami. Envoyez les pompiers, s’il vous plaît.'
    note: 'Voici à quoi ressemble un appel aux secours aux États-Unis : on y appelle le 911, pas le 112.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Le soulagement de Daniel
    gloss: 'Daniel dit : Dieu merci. Je pense qu’il est éteint maintenant, mais attendons dehors, au cas où.'
    note: '*just in case* signifie « au cas où ».'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Le conseil de Leila
    gloss: 'Leila dit : Bonne idée. Il est plus prudent d’attendre dehors jusqu’à leur arrivée.'
    note: '*safer* est le comparatif de *safe*, formé avec -er ; en français, on dit « plus sûr » ou « plus prudent ».'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Texte sur les consignes d’urgence
    gloss: 'En cas d’incendie : premièrement, reste calme. Deuxièmement, quitte le bâtiment immédiatement. N’utilise pas l’ascenseur ; utilise l’escalier. Troisièmement, une fois dehors, appelle le 911 et donne ton adresse. Enfin, attends dehors jusqu’à l’arrivée des pompiers. Après l’incendie dans la cuisine de Daniel, lui et Leila ont attendu dehors, exactement comme l’indiquait l’avis. Les pompiers sont arrivés rapidement et se sont assurés que tout était en sécurité. Plus tard, Mia est passée voir comment ils allaient et a été soulagée que personne ne soit blessé.'
    note: '*elevator* est le mot américain pour « ascenseur ». En anglais britannique, on dit *lift*.'
