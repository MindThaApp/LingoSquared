teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: Quelle heure est-il ?
    note: '*What time is it?* demande l’heure de façon tout à fait générale.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: Il est trois heures.
    note: '*It’s three o’clock.* donne l’heure pleine.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: Il est trois heures et demie.
    note: '*half past three* signifie 3 h 30, comme « trois heures et demie » en français : la demi-heure s’ajoute après l’heure indiquée (past = après).'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: Il est cinq heures.
    note: '*It’s five o’clock.* donne l’heure pleine, 5 h 00.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: Il est trois heures et quart.
    note: '*It’s a quarter past three.* signifie 3 h 15.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: Il est quatre heures moins le quart.
    note: '*It’s a quarter to four.* signifie 3 h 45.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: Il est quatre heures dix.
    note: '*It’s ten past four.* signifie 4 h 10.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: Il est cinq heures moins dix.
    note: '*It’s ten to five.* signifie 4 h 50.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: matin
    note: '*morning* désigne le matin, environ de 6 h à 12 h.'
    example_gloss: Bonjour, Daniel !
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: après-midi
    note: '*afternoon* désigne l’après-midi, environ de 12 h à 17 h.'
    example_gloss: Je travaille l’après-midi.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: soir
    note: '*evening* désigne le soir, environ de 17 h à 21 h ; les limites sont floues.'
    example_gloss: Bonsoir, Leila !
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: nuit
    note: '*night* désigne la nuit, environ de 21 h à 6 h.'
    example_gloss: Bonne nuit, Daniel !
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: Le magasin ouvre à neuf heures du matin.
    note: 'Devant l’heure, l’anglais met *at*, comme le français met à : *at nine* (à neuf heures).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: Le magasin ferme à 18 h (six heures du soir).
    note: En anglais, on donne souvent l’heure sur 12 heures avec le moment de la journée (*six in the evening*), alors que le français emploie volontiers le format 24 heures pour les horaires officiels (18 h).
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: ouvre à
    note: '*opens at* + heure signifie ouvre à + heure.'
    example_gloss: La bibliothèque ouvre à neuf heures.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: ferme à
    note: '*closes at* + heure signifie ferme à + heure.'
    example_gloss: La bibliothèque ferme à six heures.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel demande l'heure d'ouverture
    gloss: 'Daniel : À quelle heure ouvre la bibliothèque ?'
    note: '*What time does ...?* demande une heure précise. Comme la question contient *does*, on dit *open*, sans -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Réponse sur l'heure d'ouverture
    gloss: 'Leila : Elle ouvre à neuf heures du matin.'
    note: Une réponse complète donne l’heure exacte et le moment de la journée.
  en.a1.unit05.lesson04.teach.q_close:
    title: Demander l'heure de fermeture
    gloss: 'Daniel : Et à quelle heure ferme-t-elle ?'
    note: '*And* introduit la deuxième question de la même conversation.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Réponse sur l'heure de fermeture
    gloss: 'Leila : Elle ferme à 18 h (six heures du soir).'
    note: Là encore, une réponse complète donne l’heure exacte.
  en.a1.unit05.lesson04.teach.closing:
    title: Terminer la conversation
    gloss: 'Daniel : Parfait, à neuf heures alors !'
    note: '*See you at nine!* veut dire qu’on se revoit à neuf heures.'
