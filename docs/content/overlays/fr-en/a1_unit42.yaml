teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: sympathique / aimable
    note: '*friendly* signifie « sympathique » : agréable et facile à aborder.'
    example_gloss: Mon voisin est très sympathique.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: drôle
    note: '*funny* signifie « drôle » -- quelqu’un qui fait rire les autres.'
    example_gloss: Mon frère est vraiment drôle.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: travailleur
    note: '*hardworking* signifie « travailleur », quelqu’un qui ne baisse pas les bras.'
    example_gloss: C’est une employée très travailleuse.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: timide
    note: '*shy* signifie « timide », mal à l’aise ou nerveux avec les gens qu’on ne connaît pas.'
    example_gloss: Il est un peu timide au début.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: calme
    note: '*calm* signifie « calme » -- quelqu’un qui ne s’énerve pas et ne s’inquiète pas facilement.'
    example_gloss: Ma mère est très calme.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: bavard
    note: '*talkative* signifie « bavard » -- quelqu’un qui parle beaucoup.'
    example_gloss: Ma sœur est très bavarde.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: un peu timide
    note: '*a little* signifie ici « un peu » (degré), pas « petit » (taille) -- ne le traduis pas littéralement par « petit timide ».'
    example_gloss: Il est un peu timide au début, mais il se met vite à l’aise.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: très travailleur
    note: '*very hardworking* signifie « très travailleur ».'
    example_gloss: Mon collègue est très travailleur.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: avoir un excellent sens de l’humour
    note: '*have a great sense of humor* signifie « avoir un excellent sens de l’humour ».'
    example_gloss: Daniel a un excellent sens de l’humour.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: s’entendre bien avec tout le monde
    note: '*get along with everyone* signifie « s’entendre bien avec tout le monde ».'
    example_gloss: Mia s’entend bien avec tout le monde au travail.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: se mettre vite à l’aise
    note: '*warm up quickly* signifie se mettre vite à l’aise avec de nouvelles personnes.'
    example_gloss: Il est timide, mais il se met vite à l’aise dès qu’il te connaît.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: Comment est-il ?
    note: '*What''s he like?* demande quel est son caractère, pas à quoi il ressemble.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: La question de Mia
    gloss: 'Mia demande : Je commence un nouveau projet avec Daniel la semaine prochaine. Comment est-il ?'
    note: '*What''s he like?* demande quel est le caractère de quelqu’un.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Il est très sympathique, et il est vraiment drôle aussi.'
    note: '*and he''s really funny too* signifie « et il est vraiment drôle aussi ».'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: La question de Mia
    gloss: 'Mia dit : Ça me fait plaisir à entendre ! C’est facile de travailler avec lui ?'
    note: '*Is he easy to work with?* demande s’il est agréable de travailler avec quelqu’un.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Oui, il est aussi très travailleur. Il termine toujours ses tâches à temps.'
    note: '*finishes his tasks on time* signifie « termine ses tâches à temps ».'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: La question de Mia
    gloss: 'Mia demande : Est-il parfois timide en réunion ?'
    note: '*ever* signifie ici « parfois, déjà ».'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Un peu, mais il est plus à l’aise dès qu’il te connaît.'
    note: '*once he knows you* signifie « dès qu’il te connaît ».'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Le remerciement de Mia
    gloss: 'Mia dit : Merci, Leila. Maintenant, je me sens plus détendue pour ce projet.'
    note: '*I feel more relaxed* signifie « je me sens plus détendue », plus tranquille.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Texte sur trois personnalités
    gloss: Daniel, Leila et Mia sont des amis proches, mais ils ont des personnalités très différentes. Daniel est sympathique et drôle -- il fait toujours rire ses amis. Il est un peu timide quand il rencontre de nouvelles personnes, mais il se met vite à l’aise. Leila est calme et créative. Elle adore peindre parce que ça l’aide à se détendre, et elle s’énerve rarement pour quoi que ce soit. Mia est extravertie et organisée. Elle aime faire des plans pour le groupe, et elle est très patiente quand elle apprend quelque chose de nouveau à ses amis -- elle a appris à Daniel à cuisiner. Même s’ils sont tous différents, ils s’entendent bien et aiment passer du temps ensemble.
    note: '*even though* signifie « même si », « bien que ».'
