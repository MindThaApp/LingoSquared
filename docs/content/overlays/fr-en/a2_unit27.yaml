teaching:
  en.a2.unit27.lesson01.teach.checking_account:
    title: checking account
    gloss: compte courant
    note: '*checking account* désigne le compte courant, celui qui sert aux paiements de la vie quotidienne.'
    example_gloss: Je voudrais ouvrir un compte courant.
  en.a2.unit27.lesson01.teach.debit_card:
    title: debit card
    gloss: carte de débit (carte bancaire)
    note: '*debit card* est une carte avec laquelle on paie directement depuis son compte.'
    example_gloss: Je paie mes courses avec ma carte bancaire.
  en.a2.unit27.lesson01.teach.monthly_fee:
    title: monthly fee
    gloss: frais mensuels
    note: '*monthly fee* désigne les frais que la banque prélève chaque mois.'
    example_gloss: Ce compte n'a pas de frais mensuels.
  en.a2.unit27.lesson01.teach.minimum_balance:
    title: minimum balance
    gloss: solde minimum
    note: '*minimum balance* désigne le montant minimal qui doit rester sur le compte.'
    example_gloss: Vous devez maintenir un solde minimum de 500 dollars.
  en.a2.unit27.lesson01.teach.direct_deposit:
    title: direct deposit
    gloss: virement direct du salaire
    note: '*direct deposit* signifie que le salaire est versé directement sur le compte.'
    example_gloss: Mon salaire est versé directement sur mon compte.
  en.a2.unit27.lesson02.teach.i_was_wondering_what_documents:
    title: I was wondering what documents I would need to open an account.
    gloss: Je voulais savoir quels documents il me faut pour ouvrir un compte.
    note: C'est une question indirecte polie.
  en.a2.unit27.lesson02.teach.same_as_dmv:
    title: You'll need a photo ID and one proof of residency, just like at the DMV.
    gloss: Il vous faut une pièce d'identité avec photo et un justificatif de domicile, exactement comme au DMV.
    note: Le DMV est l'administration américaine chargée des permis de conduire et des véhicules ; c'est là que Daniel a changé son adresse dans l'unité 25.
  en.a2.unit27.lesson03.teach.business_days:
    title: business days
    gloss: jours ouvrés
    note: '*business days* désigne les jours ouvrés, c''est-à-dire les jours hors week-end.'
    example_gloss: La carte arrive dans un délai de cinq à sept jours ouvrés.
  en.a2.unit27.lesson03.teach.features_text:
    title: Text über Kontomerkmale
    gloss: Il n'y a pas de frais mensuels si vous maintenez un solde minimum de 500 dollars. Votre carte de débit arrivera dans un délai de cinq à sept jours ouvrés.
    note: 'Une communication formelle : elle indique une condition et un délai.'
  en.a2.unit27.lesson04.teach.that_sounds_good:
    title: That sounds good.
    gloss: Ça me convient.
    note: Avec *That sounds good*, tu montres qu'une proposition te plaît.
  en.a2.unit27.lesson04.teach.q_what_documents:
    title: Nach Unterlagen fragen
    gloss: 'Daniel dit : Je voulais savoir quels documents il me faut pour ouvrir un compte courant.'
    note: C'est la même question que dans la deuxième leçon.
  en.a2.unit27.lesson04.teach.a_id_and_proof:
    title: Antwort des Bankangestellten
    gloss: 'L''employé de la banque dit : Il vous faut une pièce d''identité avec photo et un justificatif de domicile, exactement comme au DMV.'
    note: L'employé fait référence à la précédente visite de Daniel au DMV.
  en.a2.unit27.lesson04.teach.q_is_there_fee:
    title: Nach Gebühren fragen
    gloss: 'Daniel dit : J''ai les deux sur moi. Y a-t-il des frais mensuels ?'
    note: Daniel confirme d'abord qu'il a les documents, puis il pose une autre question.
  en.a2.unit27.lesson04.teach.a_no_fee_condition:
    title: Antwort zu den Gebühren
    gloss: 'L''employé de la banque dit : Il n''y a pas de frais mensuels si vous maintenez un solde minimum de 500 dollars.'
    note: L'employé indique la condition pour qu'il n'y ait pas de frais mensuels, comme dans le texte de la leçon 3.
  en.a2.unit27.lesson04.teach.q_when_card:
    title: Nach der Debitkarte fragen
    gloss: 'Daniel dit : Ça me convient. Quand est-ce que je recevrai ma carte de débit ?'
    note: Daniel réagit avec satisfaction, puis pose la question suivante.
  en.a2.unit27.lesson04.teach.a_five_to_seven_days:
    title: Antwort zur Debitkarte
    gloss: 'L''employé de la banque dit : Elle arrivera dans un délai de cinq à sept jours ouvrés.'
    note: 'Cela correspond au texte de la leçon 3 : cinq à sept jours ouvrés.'
