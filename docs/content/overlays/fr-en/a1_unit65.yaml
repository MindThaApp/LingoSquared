teaching:
  en.a1.unit65.lesson01.teach.return:
    title: return
    gloss: rapporter / retourner
    note: '*return* signifie rapporter un article au magasin.'
    example_gloss: Je veux rapporter ceci.
  en.a1.unit65.lesson01.teach.exchange:
    title: exchange
    gloss: échanger
    note: '*exchange* signifie échanger un article contre un autre.'
    example_gloss: Puis-je l’échanger ?
  en.a1.unit65.lesson01.teach.receipt:
    title: receipt
    gloss: ticket de caisse / reçu
    note: '*receipt* signifie le ticket qui prouve un achat.'
    example_gloss: Vous avez le ticket de caisse ?
  en.a1.unit65.lesson01.teach.size:
    title: size
    gloss: taille
    note: '*size* signifie la taille, par exemple pour des vêtements.'
    example_gloss: J’ai besoin d’une taille au-dessus.
  en.a1.unit65.lesson01.teach.refund:
    title: refund
    gloss: remboursement
    note: '*refund* signifie l’argent qui vous est rendu.'
    example_gloss: Vous pouvez être remboursé.
  en.a1.unit65.lesson01.teach.small:
    title: small
    gloss: petit
    note: '*small* signifie petit.'
    example_gloss: Cette taille est trop petite.
  en.a1.unit65.lesson02.teach.want_return:
    title: I want to return this.
    gloss: Je veux rapporter ceci.
    note: '*I want to return this* est une phrase directe à dire au comptoir des retours.'
  en.a1.unit65.lesson02.teach.can_exchange:
    title: Can I exchange it?
    gloss: Puis-je l’échanger ?
    note: '*Can I...?* demande si quelque chose est possible ou permis.'
  en.a1.unit65.lesson02.teach.have_receipt:
    title: Do you have the receipt?
    gloss: Vous avez le ticket de caisse ?
    note: '*receipt* est le ticket qui montre que tu as payé.'
  en.a1.unit65.lesson02.teach.too_small:
    title: This size is too small.
    gloss: Cette taille est trop petite.
    note: '*too small* signifie trop petit.'
  en.a1.unit65.lesson02.teach.larger_size:
    title: I need a larger size.
    gloss: J’ai besoin d’une taille au-dessus.
    note: '*larger* signifie plus grand.'
  en.a1.unit65.lesson02.teach.get_refund:
    title: You can get a refund.
    gloss: Vous pouvez être remboursé.
    note: '*get a refund* signifie se faire rembourser.'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Daniel veut rapporter un article
    gloss: 'Daniel dit : Bonjour. Je veux rapporter cette chemise.'
    note: '*return this shirt* signifie rapporter cette chemise.'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: L’employé demande le ticket de caisse
    gloss: 'L’employé dit : Vous avez le ticket de caisse ?'
    note: '*Do you have...?* demande si quelqu’un a quelque chose sur lui.'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: Daniel a son ticket de caisse
    gloss: 'Daniel dit : Oui, le voici. La taille est trop petite.'
    note: '*Here it is* signifie le voici.'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: L’employé propose un échange
    gloss: 'L’employé dit : Nous pouvons l’échanger contre une taille au-dessus.'
    note: '*for a larger size* indique contre quoi l’article est échangé.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Daniel dit oui"
    gloss: 'Daniel dit : Oui, volontiers.'
    note: '*Yes, please* est une façon polie d’accepter.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: Il y a une taille au-dessus
    gloss: 'L’employé dit : Nous avons une taille au-dessus en bleu.'
    note: '*We have...* indique ce qui est disponible.'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Daniel ne veut pas de remboursement
    gloss: 'Daniel dit : Super. Je n’ai pas besoin d’un remboursement.'
    note: '*I do not need* signifie je n’ai pas besoin de.'
  en.a1.unit65.lesson04.teach.return_note:
    title: Bon de retour
    gloss: 'Bon de retour : Chemise bleue. Taille petite. Échange contre une taille au-dessus. Ticket de caisse obligatoire.'
    note: Le bon mentionne l’article, la taille, l’action et le ticket de caisse.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Texte : Un échange au magasin'
    gloss: 'Un échange au magasin : Daniel a acheté une chemise bleue, mais la taille était trop petite. Il est retourné au magasin avec le ticket de caisse. L’employé a demandé le ticket et a proposé une taille au-dessus. Daniel a échangé la chemise. Il n’avait pas besoin d’être remboursé, car la chemise bleue plus grande allait bien.'
    note: '*exchanged* est le passé de *exchange*.'
