teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: rendez-vous, arrangement convenu
    note: '*arrangement* désigne un projet déjà fixé avec quelqu''un d''autre, par exemple à une heure convenue.'
    example_gloss: Mia a rendez-vous avec Leila vendredi.
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: intention, projet
    note: '*intention* désigne ce qu''on a décidé de faire, sans avoir encore fixé d''horaire avec quelqu''un d''autre.'
    example_gloss: Daniel a l'intention de terminer le projet en avance.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: prévision, pronostic
    note: '*prediction* désigne une estimation de ce qui va se passer, fondée sur des indices.'
    example_gloss: Ma prévision, c'est que le projet sera terminé à temps.
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: sans aucun doute, à coup sûr
    note: '*definitely* montre qu''on est tout à fait certain que quelque chose va arriver.'
    example_gloss: Daniel va terminer le rapport aujourd'hui, c'est certain.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: probablement
    note: '*probably* montre qu''on est assez sûr, mais pas totalement.'
    example_gloss: Le projet va probablement durer deux mois.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: peut-être, pourrait
    note: '*might* montre que ce n''est qu''une faible possibilité.'
    example_gloss: Daniel demandera peut-être à Leila de rejoindre l'équipe.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (feste Vereinbarung)
    gloss: Je déjeune avec Leila vendredi.
    note: '*I am meeting Leila for lunch on Friday* utilise le present continuous (forme progressive) pour un arrangement ferme, à un moment précis déjà convenu.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (Absicht)
    gloss: Je vais lancer un nouveau projet avec l'équipe de design.
    note: '*I am going to start a new project* utilise going to pour une décision déjà prise, sans moment fixé.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Feste Vereinbarungen und Absichten
    gloss: 'Utilise le present continuous (I am meeting Leila on Friday) pour un arrangement ferme : un moment précis déjà convenu avec quelqu''un d''autre. Utilise going to (I am going to start a new project) pour une intention ou une décision que tu as déjà prise, même sans moment fixé. En anglais, il faut choisir entre les deux formes selon la situation.'
    note: 'Forme : choisis entre le present continuous pour un arrangement ferme et going to pour une intention.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: à l'heure, à temps
    note: '*on time* veut dire exactement à l''heure ou à la date prévue.'
    example_gloss: Daniel pense que le projet sera terminé à temps.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: confiant
    note: '*confident* veut dire se sentir sûr que les choses vont bien se passer.'
    example_gloss: Daniel est confiant à propos du nouveau projet.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Pläne für nächsten Monat'
    gloss: Daniel va lancer un nouveau projet avec l'équipe de design le mois prochain. Il les rencontre vendredi matin pour planifier les premières étapes. Daniel est confiant, mais il n'est pas tout à fait sûr que le projet sera terminé à temps. Il prévoit que cela prendra probablement environ deux mois. Il demandera peut-être à Leila de rejoindre l'équipe, car elle a une bonne expérience en design. Si elle accepte, le projet avancera à coup sûr plus vite.
    note: Un court texte sur des projets et des prévisions.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia fragt nach Daniels Plänen
    gloss: 'Mia dit : Daniel, qu''est-ce que tu as prévu pour le mois prochain ?'
    note: Une question ouverte pour lancer la conversation.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel nennt sein Vorhaben
    gloss: 'Daniel dit : Je vais lancer un nouveau projet avec l''équipe de design.'
    note: '*going to* indique une décision déjà prise.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia fragt weiter
    gloss: 'Mia dit : Ça a l''air passionnant. Tu les rencontres cette semaine ?'
    note: Une question de suivi sur un arrangement ferme.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel bestätigt die feste Vereinbarung
    gloss: 'Daniel dit : Oui, je les rencontre vendredi matin.'
    note: '*I am meeting... on Friday morning* est le present continuous pour un arrangement ferme.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia fragt nach dem Termin
    gloss: 'Mia dit : Tu crois que le projet sera terminé à temps ?'
    note: Une question sur une prévision.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel gibt eine Vorhersage ab
    gloss: 'Daniel dit : Je n''en suis pas sûr, mais ça prendra probablement environ deux mois.'
    note: '*probably* montre une certitude assez forte, mais pas complète.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia ist optimistisch
    gloss: 'Mia dit : Eh bien, je suis sûre que ça se passera bien.'
    note: Une remarque encourageante.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel nennt eine schwache Möglichkeit
    gloss: 'Daniel dit : Merci. Je demanderai peut-être aussi à Leila de rejoindre l''équipe.'
    note: '*might* montre une faible possibilité.'
