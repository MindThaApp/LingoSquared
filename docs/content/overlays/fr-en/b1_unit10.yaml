    title: 'Texte : des objectifs clairs'
    gloss: Daniel et Leila ont tous les deux des objectifs clairs. Daniel suit un cours du soir pour améliorer son anglais pour le travail. Il s’entraîne à écrire de courts comptes rendus pour avoir un ton plus professionnel. Leila économise pour pouvoir suivre un cours de design l’année prochaine. Elle lit des descriptifs de cours pour choisir la bonne formation.
    note: Un court texte sur les objectifs avec *in order to* et *so that*.
