  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' et ''so that'''
    gloss: J’étudie pour améliorer mon anglais. J’étudie pour pouvoir retenir plus de choses.
    note: '*in order to* se place devant un verbe ; *so that* se place devant une proposition complète. Le « pour » + infinitif du français correspond à *in order to*, et « pour que » + proposition correspond à *so that*.'
