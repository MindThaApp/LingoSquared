teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: se réveiller
    note: '*wake up* signifie se réveiller. C’est un verbe à particule, écrit en deux mots. En anglais, il n’y a pas de pronom réfléchi : on ne dit pas *wake yourself up*.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: s’habiller
    note: '*get dressed* signifie s’habiller. L’anglais n’a pas de pronom réfléchi comme le *se* français : on ne dit pas *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: aller au travail
    note: '*go to work* signifie aller au travail. Dans cette expression figée, il n’y a pas d’article devant *work*.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: dîner
    note: '*have dinner* signifie dîner. Les repas s’emploient sans article : *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: aller se coucher
    note: '*go to bed* signifie aller se coucher pour dormir. Ici aussi, il n’y a pas d’article devant *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: À quelle heure te réveilles-tu ?
    note: 'Avec *What time do you wake up?*, tu demandes à quelle heure quelqu’un se réveille. La question avec *do* demande l’auxiliaire : on ne dit pas *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Je me réveille à sept heures tous les jours.
    note: '*every day* s’emploie pour une habitude quotidienne. Il se place à la fin ou au début de la phrase.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Je m’habille le matin.
    note: '*in the morning* indique un moment de la journée, pas une heure précise. Notre « le matin » se dit *in the morning*, avec *in* et *the*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: D’habitude, je vais me coucher à onze heures.
    note: '*usually* signifie d’habitude ; il décrit une habitude qui n’est pas toujours exactement la même. Attention à l’ordre des mots : en anglais, *usually* se place devant le verbe principal (*I usually go*). Contrairement au français (« D’habitude, je vais… », « Je vais d’habitude… »), il ne peut pas se déplacer librement ; *I go usually to bed* est faux.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: puis/ensuite
    note: '*then* signifie puis ou ensuite ; il indique l’ordre des événements.'
    example_gloss: Je prends mon petit-déjeuner, puis je vais au travail.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Texte sur une routine quotidienne
    gloss: Tous les jours, je me réveille à sept heures. Ensuite, je m’habille et je prends mon petit-déjeuner.
    note: C’est une courte description d’une routine du matin.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Qu’est-ce que tu fais après ?
    note: Avec *What do you do after that?*, tu demandes ce qui vient ensuite dans une routine quotidienne.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Demander l’heure du réveil
    gloss: 'Leila demande : À quelle heure te réveilles-tu ?'
    note: C’est la même question que tout à l’heure.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Réponse sur le réveil
    gloss: 'Daniel dit : Je me réveille à sept heures tous les jours.'
    note: Une réponse complète donne à la fois l’heure et la répétition quotidienne.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Demander ce qui vient après
    gloss: 'Leila demande : Qu’est-ce que tu fais après ?'
    note: Cette question prolonge naturellement la conversation sur la routine quotidienne.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Décrire toute la routine
    gloss: 'Daniel dit : Je m’habille, je prends mon petit-déjeuner et je vais au travail. D’habitude, je me couche à onze heures.'
    note: Daniel cite plusieurs activités à la suite, dans le bon ordre.
