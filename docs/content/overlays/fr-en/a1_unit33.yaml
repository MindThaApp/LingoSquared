teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: bus
    note: '*bus* signifie « bus ». Le verbe qui l’accompagne est *take* : *take the bus*. Attention : en français, « prendre » convient pour le bus ou le train, mais on dit « conduire » pour la voiture et « faire du vélo » ; en anglais, chaque moyen de transport a son propre verbe (*take*, *drive*, *ride*). Il faut les apprendre séparément.'
    example_gloss: Je prends le bus.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: train
    note: '*train* signifie « train ». Comme pour *bus*, on utilise ici *take* : *take the train*.'
    example_gloss: Elle prend le train.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: voiture
    note: '*car* signifie « voiture ». Pour une voiture, on n’utilise pas *take* mais *drive* : *drive my car*. C’est un autre verbe que pour le bus ou le train.'
    example_gloss: Je vais au travail en voiture.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: vélo
    note: '*bike* signifie « vélo ». Ici, on utilise encore un autre verbe : *ride a bike* (ni *take* ni *drive*).'
    example_gloss: Je vais au travail à vélo tous les jours.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: marcher
    note: '*walk* signifie « marcher ». Ici, pas besoin d’un verbe supplémentaire comme *take*, *drive* ou *ride*, car *walk* est lui-même le verbe : *walk to work*, et non *take a walk to work*.'
    example_gloss: Je vais au travail à pied.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Comment vas-tu au travail ?
    note: 'Cette question commence par l’auxiliaire *do*, car le verbe principal est *get*. En anglais, on ne peut pas simplement inverser le sujet et le verbe comme en français : on ajoute *do*.'
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: en général
    note: '*usually* signifie « en général ». En anglais, cet adverbe se place le plus souvent entre le sujet et le verbe principal : *I usually take the bus*.'
    example_gloss: Je prends en général le bus.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: minutes
    note: '*minutes* signifie « minutes ». Dans *It takes twenty minutes*, *it* est un sujet vide, sans sens propre : il occupe seulement la place du sujet. Le français « Il faut vingt minutes » fonctionne de la même façon, donc cette phrase te sera familière. Mais toutes les phrases anglaises sur la durée ne se construisent pas ainsi.'
    example_gloss: Ça prend vingt minutes.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: en retard
    note: '*late* signifie « en retard » (arriver plus tard que prévu) : *The bus is often late.*'
    example_gloss: Le bus est souvent en retard.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: plus rapide
    note: '*faster* signifie « plus rapide » : c’est le comparatif de *fast*, formé avec *-er*. Pour comparer, on utilise *than* : *faster than the bus*.'
    example_gloss: Le train est plus rapide que le bus.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: La question de Leila
    gloss: 'Leila demande : Comment vas-tu au travail, Daniel ?'
    note: Début du dialogue avec *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Réponse de Daniel"
    gloss: 'Daniel répond : En général, je prends le bus. Ça prend environ vingt minutes.'
    note: 'Deux choses à la fois : le verbe *take* pour le bus, et le sujet vide *it* dans *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: La question de Leila
    gloss: 'Leila demande : Ça te plaît ?'
    note: Question fermée avec *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Réponse de Daniel"
    gloss: 'Daniel répond : Ça va, mais le bus est souvent en retard. Et toi ?'
    note: '*How about you?* signifie « Et toi ? » : une manière courte de renvoyer la question.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Réponse de Leila"
    gloss: 'Leila répond : Je viens en voiture. C’est plus rapide, mais se garer est difficile.'
    note: Pour la voiture, on utilise le verbe *drive*, pas *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Texte sur Leila et Daniel
    gloss: Leila va au travail en voiture tous les jours. Le trajet dure environ quinze minutes, mais se garer près de son bureau est difficile. Daniel n’a pas de voiture, alors il prend le bus. Son trajet en bus dure vingt minutes et le bus est parfois en retard, mais il n’a pas à s’inquiéter pour le stationnement.
    note: 'Attention : on utilise *take* pour le bus et le train, *drive* pour la voiture.'
