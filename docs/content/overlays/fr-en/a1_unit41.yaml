    note: '*What are you ...ing?* demande ce que quelqu’un est en train de faire en ce moment.'
  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: L’invitation de Mia
    gloss: 'Mia demande : Je fais des pâtes ce soir. Tu veux m’aider à cuisiner ?'
    note: '*Do you want to help me* + verbe*?* est une façon naturelle de proposer à quelqu’un de donner un coup de main.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: La réponse de Daniel
    gloss: 'Daniel dit : Bien sûr ! Mais je ne suis pas très bon cuisinier.'
    note: '*though* à la fin d’une phrase marque un léger contraste, un peu comme « pourtant » ou « quand même » en français.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: L’encouragement de Mia
    gloss: 'Mia dit : Pas de souci, je vais te montrer. Tu peux hacher ces oignons ?'
    note: '*I''ll show you* signifie « je vais te montrer ».'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: La question de Daniel
    gloss: 'Daniel dit : Pas de problème. Je les coupe en morceaux de quelle taille ?'
    note: '*should* sert ici à demander un conseil.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: L’explication de Mia
    gloss: 'Mia dit : En petits morceaux, comme ça. Maintenant, faisons cuire les pâtes.'
    note: '*like this* signifie « comme ça », de cette façon.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: La réponse de Daniel
    gloss: 'Daniel dit : Je peux goûter la sauce ? Elle est délicieuse !'
    note: '*Can I* + verbe*?* sert à demander la permission.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: La conclusion de Mia
    gloss: 'Mia dit : Super ! Le dîner est presque prêt.'
    note: '*almost ready* signifie « presque prêt ».'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Texte sur le fait de cuisiner ensemble
    gloss: Daniel, Leila et Mia ont chacun un niveau différent en cuisine. Depuis que Leila a emménagé dans un nouvel appartement près de chez Mia, les trois amis cuisinent souvent le dîner ensemble. Leila est une bonne cuisinière. Elle prépare souvent des pâtes avec l’ancienne recette de sa mère. Mia adore cuisiner aussi, et elle a appris à Daniel à hacher des oignons sans se couper les doigts. Daniel n’est pas encore un grand cuisinier, mais il apprend vite. Hier soir, Mia a demandé à Daniel de l’aider à préparer des pâtes. Il a haché les oignons pendant que Mia faisait cuire les pâtes et préparait la sauce. Daniel a goûté la sauce et a dit qu’elle était délicieuse. Leila est arrivée juste au moment où le dîner était prêt, et tous les trois ont mangé ensemble dans la cuisine de Mia.
    note: '*arrived just as dinner was ready* signifie « est arrivée juste au moment où le dîner était prêt ».'
