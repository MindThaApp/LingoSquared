course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit35.prescription:
    title: Récupérer une ordonnance à la pharmacie
lessons:
  en.a2.unit35.lesson01.pharmacy_vocabulary:
    title: Comprimés, posologie et effets secondaires
  en.a2.unit35.lesson02.asking_at_the_counter:
    title: Demander la posologie et les effets secondaires
  en.a2.unit35.lesson03.reading_a_pharmacy_label:
    title: Lire une étiquette de pharmacie
  en.a2.unit35.lesson04.pharmacy_dialogue:
