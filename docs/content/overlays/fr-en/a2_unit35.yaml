teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: pharmacie
    note: '*pharmacy* est le magasin où l’on obtient ses médicaments.'
    example_gloss: Il y a une pharmacie à côté du cabinet médical.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: pharmacien / pharmacienne
    note: '*pharmacist* est la personne qui remet les médicaments.'
    example_gloss: Le pharmacien m’a expliqué comment prendre le médicament.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: comprimé
    note: '*tablet* est un morceau solide de médicament que l’on avale.'
    example_gloss: Je prends un comprimé le matin et un autre le soir.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: dose
    note: '*dose* est la quantité de médicament que l’on prend en une fois.'
    example_gloss: La dose est d’un comprimé, deux fois par jour.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: renouvellement / réapprovisionnement
    note: '*refill* est une nouvelle boîte du même médicament, sans devoir retourner chez le médecin.'
    example_gloss: J’ai besoin d’un renouvellement, car mes comprimés sont presque terminés.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: effets secondaires
    note: '*side effects* sont les effets supplémentaires qu’un médicament peut avoir sur le corps.'
    example_gloss: Le pharmacien m’a expliqué les effets secondaires de ce médicament.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: une fois par jour, deux fois par jour, trois fois par jour, toutes les huit heures
    note: '*once a day* = une fois par jour, *twice a day* = deux fois par jour, *three times a day* = trois fois par jour, *every eight hours* = toutes les huit heures.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: Je voudrais récupérer une ordonnance.
    note: '*I''d like to...* est la formule polie habituelle pour dire ce que l’on souhaite.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: Prenez un comprimé deux fois par jour, pendant les repas.
    note: '*with food* signifie pendant les repas, donc pas à jeun.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: Pendant combien de jours dois-je le prendre ?
    note: '*How many...?* s’emploie avec des éléments dénombrables, comme des jours.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: Y a-t-il des effets secondaires ?
    note: '*Are there any...?* est la façon habituelle de demander s’il existe quelque chose.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: Vous devriez le prendre pendant les repas. Vous ne devriez pas arrêter trop tôt.
    note: '*should* donne un conseil ou une consigne ; *shouldn''t* en est la forme négative.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: au coucher
    note: '*before bed* signifie avant d’aller dormir.'
    example_gloss: Certains médicaments agissent mieux si on les prend au coucher.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'Médicament contre le rhume. Prendre un comprimé deux fois par jour pendant les repas, pendant cinq jours. Ne pas arrêter de prendre les comprimés trop tôt. Effets secondaires possibles : vous pouvez vous sentir fatigué(e). Renouvellements : un.'
    note: 'Une étiquette de pharmacie est brève et concise : des phrases courtes et aucune formule de politesse.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: Ne pas arrêter de prendre les comprimés trop tôt.
    note: '*Do not...* est l’interdiction à l’impératif, telle qu’on la voit sur les étiquettes et les panneaux.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'Daniel dit : Bonjour, je voudrais récupérer une ordonnance.'
    note: '*Hi* est plus décontracté que *Hello*, mais tout à fait courant au comptoir.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'Le pharmacien dit : Bien sûr. Comment vous appelez-vous ?'
    note: '*Of course* signifie ici : volontiers, pas de problème.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'Daniel dit : Daniel. Le médecin m’a prescrit un médicament contre un gros rhume.'
    note: 'Cela reprend la consultation médicale de l’unité 28 : c’est le même rhume.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'Le pharmacien dit : Voici. Prenez un comprimé deux fois par jour, pendant les repas.'
    note: On dit *Here it is* quand on tend quelque chose à quelqu’un.
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'Daniel demande : Pendant combien de jours dois-je le prendre ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'Le pharmacien dit : Pendant cinq jours. N’arrêtez pas de prendre les comprimés trop tôt.'
    note: C’est la même consigne que sur l’étiquette de la leçon 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'Daniel demande : Y a-t-il des effets secondaires ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'Le pharmacien dit : Vous pourriez vous sentir fatigué, mais c’est tout.'
    note: '*but that''s all* signifie ici : mais rien de plus.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'Daniel dit : Merci beaucoup.'
    note: '*very much* rend le remerciement plus appuyé.'
