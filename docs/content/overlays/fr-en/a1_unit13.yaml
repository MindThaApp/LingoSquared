teaching:
  en.a1.unit13.lesson01.teach.happy:
    title: happy
    gloss: heureux / content
    note: '*happy* signifie heureux.'
    example_gloss: Je suis heureux aujourd’hui.
  en.a1.unit13.lesson01.teach.sad:
    title: sad
    gloss: triste
    note: '*sad* signifie triste.'
    example_gloss: Elle a l’air triste.
  en.a1.unit13.lesson01.teach.tired:
    title: tired
    gloss: fatigué
    note: '*tired* signifie fatigué.'
    example_gloss: Je suis très fatigué.
  en.a1.unit13.lesson01.teach.excited:
    title: excited
    gloss: enthousiaste / impatient
    note: '*excited* signifie enthousiaste ou impatient face à quelque chose de positif, et non nerveux au sens négatif (pour cela, on dit *worried*).'
    example_gloss: J’ai hâte d’être à demain.
  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: inquiet
    note: '*worried* signifie inquiet ou nerveux à cause de quelque chose qui pourrait arriver.'
    example_gloss: Il est inquiet pour demain.
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: Comment te sens-tu aujourd’hui ?
    note: '*How are you feeling?* demande précisément l’état émotionnel du moment, contrairement à *How are you?*, plus général.'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: Je suis un peu inquiet parce que j’ai un gros examen demain.
    note: '*because* signifie « parce que » et introduit la raison d’un sentiment.'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: Je suis content parce que le cours est bientôt terminé.
    note: '*almost over* signifie « presque terminé ».'
  en.a1.unit13.lesson03.teach.message_text:
    title: Un message sur les sentiments
    gloss: Salut, je suis un peu inquiet parce que j’ai un gros examen demain. Mais j’ai aussi hâte, parce que c’est le dernier de l’année !
    note: Un message peut exprimer plusieurs sentiments, même opposés, dans de courtes phrases reliées entre elles.
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: L’auteur du message est inquiet et plein d’enthousiasme.
    note: '*writer* désigne la personne qui a écrit le message.'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: Ah, je comprends.
    note: '*I understand* signifie « je comprends » : cela montre de l’empathie quand on écoute.'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: Question de Leila
    gloss: 'Leila : Comment te sens-tu aujourd’hui ?'
    note: Leila ouvre la conversation en demandant à Daniel comment il se sent.
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: Réponse de Daniel
    gloss: 'Daniel : Je suis un peu inquiet parce que j’ai un gros examen demain.'
    note: Daniel dit ce qu’il ressent et pourquoi.
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: Réaction de Leila
    gloss: 'Leila : Ah, je comprends. Tu as hâte, toi aussi ?'
    note: Leila montre qu’elle comprend et demande un autre sentiment.
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: Réponse de Daniel
    gloss: 'Daniel : Oui, un peu. Je suis content que le cours soit bientôt terminé.'
    note: Daniel confirme brièvement et exprime un deuxième sentiment, positif.
