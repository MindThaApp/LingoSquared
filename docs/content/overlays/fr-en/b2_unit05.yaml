teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: registre de langue, niveau de formalité
    note: '*register* désigne le degré de formalité de ton langage. L’anglais n’a pas de distinction entre tu et vous comme le français ; le ton passe surtout par la formulation.'
    example_gloss: Le registre change quand le destinataire change.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: informel, décontracté
    note: '*casual* convient à un ami ou à une connaissance. C’est plus direct, mais pas forcément impoli.'
    example_gloss: Un message informel convient à un ami.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: professionnel, poli et sérieux
    note: '*professional* convient à un collègue : poli et clair, mais pas excessivement formel.'
    example_gloss: Un message professionnel convient à un collègue.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: formel
    note: '*formal* convient à un organisme. En anglais, on l’exprime souvent par des demandes plus longues et plus indirectes.'
    example_gloss: Un message formel convient à un organisme.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: public visé, destinataire
    note: '*audience* désigne la personne ou le groupe à qui tu écris ou parles.'
    example_gloss: Ton public influence ton choix de mots.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: établissement, organisme
    note: '*institution* désigne un organisme comme une clinique, une banque ou une université.'
    example_gloss: Une clinique est un établissement.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Demande formelle
    gloss: Je vous serais reconnaissant(e) de bien vouloir confirmer si mon rendez-vous peut être déplacé à vendredi.
    note: '*I would be grateful if you could...* est formel. L’anglais n’a pas besoin d’un autre mot que *you* pour cela ; la politesse est dans toute la construction.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Demande informelle
    gloss: Tu peux le déplacer à vendredi ?
    note: '*Can you...?* convient très bien à un ami, mais sonne vite trop direct pour un organisme.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Demande professionnelle
    gloss: On pourrait déplacer le rendez-vous à vendredi, si cela vous convient toujours ?
    note: '*Could we...?* sonne collaboratif et poli pour un collègue.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Chère équipe de planification,
    note: '*Dear...* est une formule d’appel formelle tout à fait normale. C’est moins raide que beaucoup de formules d’ouverture de lettre en français.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Changer de registre
    gloss: Garde le même contenu quand tu changes de registre. L’anglais informel peut utiliser des questions directes. L’anglais professionnel utilise souvent could. L’anglais formel utilise souvent I would be grateful if you could.
    note: 'Ne pense pas seulement à tu et vous : en anglais, c’est toute la phrase qui change.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: raide, trop formel
    note: '*stiff* signifie qu’un message est inutilement formel pour la situation.'
    example_gloss: Un message raide paraît trop formel pour la situation.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: approprié, adapté
    note: '*appropriate* signifie que la formulation convient au destinataire et à la situation.'
    example_gloss: Un message approprié convient au destinataire.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Texte à lire : le même message, trois destinataires'
    gloss: 'Nina doit déplacer un rendez-vous à vendredi. À un ami, elle écrit : Can you move it to Friday? Le message est direct et informel. À un collègue, elle écrit : Could we move the appointment to Friday if that still works for you? Le message est professionnel et poli. À la clinique, elle écrit : I would be grateful if you could confirm whether my appointment can be moved to Friday. Le contenu est le même dans les trois textes, mais le registre change avec le destinataire.'
    note: En anglais, le registre change par la formulation, pas par un mot distinct pour le vouvoiement.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina s’interroge sur la formulation
    gloss: 'Nina dit : Je dois demander si mon rendez-vous peut être déplacé. Je peux simplement écrire : ''Can you move it?'''
    note: '*just write* montre qu’elle se demande si la forme directe convient.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar attire l’attention sur le registre
    gloss: 'Oscar dit : À un ami, oui. À la clinique, ça sonne trop informel.'
    note: Ici aussi, tu emploies simplement *you* en anglais, mais la phrase elle-même est trop directe pour la clinique.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina demande le registre pour un collègue
    gloss: 'Nina demande : Qu’est-ce que tu écrirais à un collègue ?'
    note: Un collègue appelle un registre professionnel, pas le registre le plus formel.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar donne la version pour un collègue
    gloss: 'Oscar dit : J’écrirais : ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* et *if that still works for you* adoucissent la demande.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina demande pour la clinique
    gloss: 'Nina demande : Et à la clinique ?'
    note: Un organisme appelle une structure de demande plus formelle.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar donne la version formelle
    gloss: 'Oscar dit : J’écrirais : ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: Cette version ne demande pas sèchement d’agir, mais de confirmer.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina résume
    gloss: 'Nina dit : Même message, registre différent.'
    note: 'Le contenu reste le même : déplacer le rendez-vous à vendredi.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar confirme
    gloss: 'Oscar dit : Exactement. Le contenu reste le même, mais le niveau de formalité change.'
    note: C’est l’essentiel de la maîtrise du registre au niveau B2.
