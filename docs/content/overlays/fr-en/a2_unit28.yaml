course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit28.doctor:
    title: Aller à un rendez-vous chez le médecin
lessons:
  en.a2.unit28.lesson01.health_followup_vocabulary:
    title: Médicaments et rendez-vous
  en.a2.unit28.lesson02.calling_to_make_an_appointment:
    title: Appeler pour prendre rendez-vous
  en.a2.unit28.lesson03.reading_an_appointment_confirmation:
    title: Lire une confirmation de rendez-vous
  en.a2.unit28.lesson04.doctor_appointment_dialogue:
    title: Chez le médecin
teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: médicament
    note: '*medicine* signifie médicament.'
    example_gloss: Le médecin m'a donné un médicament contre mon mal de tête.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: ordonnance
    note: '*prescription* désigne l''ordonnance que le médecin établit.'
    example_gloss: Le médecin m'a fait une ordonnance pour le médicament.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: consultation de suivi
    note: '*follow-up appointment* désigne un autre rendez-vous au cours duquel le médecin vérifie comment tu vas.'
    example_gloss: Si ça ne va pas mieux, vous aurez besoin d'une consultation de suivi.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: s'aggraver, empirer
    note: '*getting worse* signifie que les symptômes s''aggravent.'
    example_gloss: Mon mal de tête empire, il ne s'améliore pas.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: carte d'assurance maladie
    note: '*insurance card* est la carte de ton assurance maladie ; en France, c''est la carte Vitale.'
    example_gloss: Apportez votre carte d'assurance maladie au rendez-vous.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Frühere Beschwerden
    gloss: mal de tête, mal de gorge, fièvre
    note: Tu as déjà appris ces mots dans l'unité 22 ; nous les revoyons ici.
    example_gloss:
    - J'ai mal à la tête.
    - J'ai mal à la gorge.
    - J'ai de la fièvre.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Um einen Termin bitten
    gloss: Je voudrais prendre rendez-vous avec un médecin, s'il vous plaît.
    note: Avec *I'd like to...*, tu demandes poliment un rendez-vous.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Sagen, wie lange Sie schon Beschwerden haben
    gloss: J'ai mal à la tête et à la gorge depuis trois jours, et ça empire.
    note: 'Pour parler de quelque chose qui dure depuis un certain temps, l''anglais emploie le *present perfect* (*I''ve had ... for three days*). En français, on utilise le présent avec « depuis » : J''ai mal à la tête depuis trois jours.'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: arriver dix minutes à l'avance
    note: '*arrive ten minutes early* signifie arriver dix minutes avant le rendez-vous.'
    example_gloss: Veuillez arriver dix minutes avant votre rendez-vous.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Text der Bestätigung
    gloss: Votre rendez-vous est confirmé pour aujourd'hui à 15 h. Veuillez apporter votre carte d'assurance maladie et arriver dix minutes à l'avance. Le numéro de confirmation est le 7724.
    note: Une confirmation formelle avec l'heure, ce que tu dois faire et un numéro.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Je vois.
    note: Avec *I see*, tu montres que tu as compris quelque chose.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Fragen, was los ist
    gloss: 'Le médecin demande : Qu''est-ce qui ne va pas ?'
    note: C'est la même question que celle posée par Leila dans l'unité 22, mais cette fois par le médecin.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Daniels Antwort zu den Beschwerden
    gloss: 'Daniel dit : J''ai mal à la tête et à la gorge depuis trois jours, et ça empire.'
    note: C'est la même phrase que dans la leçon 2.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: Die Diagnose des Arztes
    gloss: 'Le médecin dit : Je vois. Vous avez un gros rhume.'
    note: Un diagnostic simple et courant, rien de grave.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Nach Medikamenten fragen
    gloss: 'Daniel demande : Dois-je prendre un médicament ?'
    note: Daniel pose une question sur le traitement après avoir entendu le diagnostic.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Anweisungen zum Medikament
    gloss: 'Le médecin dit : Oui, prenez ce médicament deux fois par jour pendant cinq jours, et buvez beaucoup d''eau.'
    note: 'Une consigne précise : deux fois par jour, pendant cinq jours.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Nach einem Folgetermin fragen
    gloss: 'Daniel demande : Dois-je revenir si ça ne va pas mieux ?'
    note: Daniel emploie la même condition (*if it doesn't get better*) que Leila dans l'unité 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Antwort des Arztes zum Folgetermin
    gloss: 'Le médecin dit : Oui, si ça ne va pas mieux d''ici une semaine, revenez pour une consultation de suivi.'
    note: 'Le médecin dit précisément quand Daniel doit revenir : si ça ne va pas mieux d''ici une semaine.'
