teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: espèces
    note: '*cash* désigne l’argent liquide (billets et pièces). En anglais, le mot est indénombrable : *some cash*, jamais *a cash*.'
    example_gloss: J’ai un peu d’argent liquide.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: carte
    note: '*card* est le mot général pour toute carte de paiement en plastique.'
    example_gloss: Ma carte est bleue.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: carte de crédit
    note: '*credit card* est une carte avec laquelle on emprunte de l’argent et on rembourse plus tard. L’expression correspond à « carte de crédit ».'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: carte de débit
    note: '*debit card* est une carte dont le montant est prélevé tout de suite sur le compte. Ce que l’on appelle souvent « carte bancaire » en France est le plus souvent une *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: total
    note: '*total* est la somme complète que tu dois payer.'
    example_gloss: Quel est le total ?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Vous acceptez les cartes de crédit ?
    note: '*Do you take credit cards?* est la question habituelle avant de payer. Ici, *take* signifie « accepter ».'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Désolé, uniquement en espèces.
    note: '*Sorry, cash only.* est la réponse habituelle des magasins qui n’acceptent pas les cartes.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Oui, je paierai par carte.
    note: '*Yes, I''ll pay by card.* exprime le choix final du moyen de paiement. Après *by*, *card* s’emploie sans article.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: taxe
    note: '*tax* est la taxe ; dans la plupart des magasins américains, elle s’ajoute au prix à la caisse (contrairement à la TVA française, déjà comprise dans le prix affiché).'
    example_gloss: La taxe est d’un dollar.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Texte du ticket de caisse
    gloss: 'Café : 3 dollars. Sandwich : 6 dollars. Taxe : 1 dollar. Total : 10 dollars.'
    note: Voici un vrai ticket de caisse.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Le total est de 10 dollars.
    note: Cette phrase résume le total du ticket en une phrase complète.
  en.a1.unit15.lesson04.teach.q_total:
    title: Demander le total
    gloss: Leila demande quel est le total
    note: '*How much is the total?* est la question habituelle pour connaître le montant final. *is* est au singulier parce que *the total* est une somme.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Réponse sur le total
    gloss: 'Le caissier dit : Ça fait quinze dollars.'
    note: '*It''s fifteen dollars.* est une réponse complète à la question sur le total.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Demander si les cartes sont acceptées
    gloss: Leila demande si les cartes de crédit sont acceptées
    note: C’est la même question que tout à l’heure.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Réponse sur les cartes
    gloss: 'Le caissier dit : Oui, bien sûr.'
    note: '*Yes, we do.* est une réponse courte complète. En anglais, on reprend l’auxiliaire *do* au lieu de dire seulement « oui ».'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Choix final du paiement
    gloss: 'Leila dit : Super, je paierai par carte.'
    note: Cette phrase termine la conversation avec le choix final du paiement.
