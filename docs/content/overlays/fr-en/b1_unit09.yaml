teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: a dit que
    note: On utilise *said that* pour rapporter ce que quelqu’un d’autre a dit.
    example_gloss: Elle a dit qu’elle était très occupée.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: m’a dit que
    note: On utilise *told me that* quand quelqu’un nous a donné une information à nous.
    example_gloss: Il m’a dit que la réunion était annulée.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: a demandé si
    note: '*asked whether* rapporte une question fermée (oui/non) et sonne un peu plus soutenu que *asked if*.'
    example_gloss: Mia a demandé si nous avions besoin d’aide.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: a demandé si
    note: '*asked if* rapporte une question fermée (oui/non) dans la langue courante.'
    example_gloss: Mia a demandé si nous avions besoin d’aide.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: message
    note: '*message* désigne un court message écrit ou oral.'
    example_gloss: Leila a envoyé un message après le déjeuner.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: confirmer
    note: '*confirm* signifie dire que quelque chose est sûr ou exact.'
    example_gloss: Confirme l’heure avant de partir, s’il te plaît.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: disponible
    note: '*available* signifie libre ou en mesure de se retrouver.'
    example_gloss: Mia est disponible après le déjeuner.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Eine Aussage wiedergeben
    gloss: Mia a dit qu’elle était disponible après le déjeuner.
    note: 'Au discours indirect, *is* devient souvent *was* : *Mia said that she was available*. Comme en français (« elle a dit qu’elle était disponible »), le verbe passe au passé.'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Informationen an Sie wiedergeben
    gloss: Leila m’a dit qu’il y avait beaucoup de monde au bureau.
    note: On utilise *told me that* quand quelqu’un t’a transmis l’information directement.
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Direkte und indirekte Rede
    gloss: 'Mia dit : « Je suis disponible. » Mia a dit qu’elle était disponible.'
    note: 'Direct : *I am available*. Indirect : *Mia said that she was available*. Au discours indirect, l’énoncé d’origine recule souvent d’un temps.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: bref résumé
    note: '*short summary* désigne une version courte qui ne contient que les points essentiels.'
    example_gloss: Un bref résumé suffit pour la réunion d’aujourd’hui.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: rapport complet
    note: '*full report* désigne le rapport entier, pas seulement la version courte.'
    example_gloss: Mia a demandé si nous avions besoin du rapport complet.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Lesetext: der Nachrichtenverlauf'
    gloss: Leila a lu le message de Mia et a appelé Daniel. Elle a dit que Mia était disponible après le déjeuner. Elle a aussi dit que Mia avait fini les chiffres. Mia a demandé si l’équipe avait besoin du rapport complet aujourd’hui. Daniel a dit à Leila qu’un bref résumé suffisait, car la réunion ne durait que quinze minutes.
    note: Un court texte sur la façon de rapporter des affirmations et des questions.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel fragt nach Mias Antwort
    gloss: 'Daniel dit : Mia a répondu pour la réunion de relecture ?'
    note: Une question fermée sur un message précédent.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila gibt Mias Aussage wieder
    gloss: 'Leila dit : Oui, elle a dit qu’elle était disponible après le déjeuner.'
    note: '*she said that she was available* rapporte ce que Mia a dit.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel fragt weiter
    gloss: 'Daniel dit : Très bien. Elle a demandé autre chose ?'
    note: Une question pour savoir si le message contenait une autre question.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila gibt Mias Frage wieder
    gloss: 'Leila dit : Elle a demandé si on avait besoin du rapport complet aujourd’hui.'
    note: '*asked if* transforme une question fermée directe en discours indirect.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel fragt nach Leilas Antwort
    gloss: 'Daniel dit : Qu’est-ce que tu lui as répondu ?'
    note: Une question sur l’information que Leila a transmise.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila gibt ihre Antwort wieder
    gloss: 'Leila dit : Je lui ai dit qu’un bref résumé suffisait.'
    note: '*I told her that...* rapporte une information que tu as donnée à quelqu’un d’autre.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel beendet den Nachrichtenverlauf
    gloss: 'Daniel dit : Parfait. Je dirai à l’équipe qu’on peut se retrouver à deux heures.'
    note: Daniel emploie à nouveau *tell ... that* pour transmettre une information.
