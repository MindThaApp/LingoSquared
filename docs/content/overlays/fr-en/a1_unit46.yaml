teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: perdu
    note: '*lost* signifie ici « perdu ». C’est le prétérit de *lose* : en anglais, on dit simplement *I lost my wallet*, là où le français dit « j’ai perdu » (passé composé).'
    example_gloss: J’ai perdu mon portefeuille.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: trouvé
    note: '*found* est à la fois le prétérit et le participe passé de *find* : I found your keys = j’ai trouvé tes clés.'
    example_gloss: J’ai trouvé tes clés !
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: clés
    note: '*keys* signifie « clés ».'
    example_gloss: Ce sont mes clés.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: portefeuille
    note: '*wallet* signifie « portefeuille ».'
    example_gloss: C’est ton portefeuille ?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: sac à dos
    note: '*backpack* signifie « sac à dos ».'
    example_gloss: Mon sac à dos est noir.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: J’ai perdu mon portefeuille.
    note: 'Mot à mot, « je perdis mon portefeuille » : l’anglais utilise ici le prétérit simple *lost*, alors que le français dit plutôt « j’ai perdu » au passé composé.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: Tu as vu mes clés ?
    note: '*Have you seen ...?* signifie « as-tu vu ... ? » -- l’anglais utilise l’auxiliaire *have* + participe passé, comme le passé composé français, mais avec l’auxiliaire *have* et non « être ».'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: Quelqu’un a-t-il trouvé un sac à dos ?
    note: '*Has anyone found ...?* signifie « quelqu’un a-t-il trouvé ... ? ».'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: Il est noir avec une sangle rouge.
    note: '*It''s black with a red strap.* signifie « il est noir avec une sangle rouge ».'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Où est le bureau des objets trouvés ?
    note: '*the lost and found* est le nom anglais courant du bureau des objets trouvés, littéralement « le perdu et trouvé ».'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Oui, nous l’avons trouvé !
    note: '*Yes, we found it!* signifie « oui, nous l’avons trouvé ! ».'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel demande : Mia, où est ton sac à dos ? Tu l’avais près de la fontaine.'
    note: '*had* est le prétérit de *have*, ici l’équivalent de l’imparfait français « tu avais ».'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: La frayeur de Mia
    gloss: 'Mia dit : Oh non, tu as raison ! Je ne l’ai pas. Mon appareil photo est dedans !'
    note: '*My camera is inside!* signifie « mon appareil photo est dedans ! ».'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: La proposition de Daniel
    gloss: 'Daniel dit : Ne t’inquiète pas, appelons le bureau du parc pour demander.'
    note: '*Don''t worry* signifie « ne t’inquiète pas ».'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel belt
    gloss: 'Daniel dit : Bonjour, nous avons perdu un sac à dos noir près de la fontaine. Quelqu’un en a-t-il trouvé un ?'
    note: '*we lost a black backpack* signifie « nous avons perdu un sac à dos noir » -- l’anglais utilise ici simplement le prétérit *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: La question de Mia
    gloss: 'Mia dit : Qu’est-ce qu’ils ont dit ?'
    note: '*did they say* utilise *did* comme auxiliaire au passé.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: La bonne nouvelle de Daniel
    gloss: 'Daniel dit : Ils l’ont trouvé ! Il est noir avec une sangle jaune, n’est-ce pas ? Ils le gardent à l’accueil.'
    note: '*right?* en fin de phrase est une courte question de confirmation, comparable à « n’est-ce pas ? » ou « non ? » en français.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Le soulagement de Mia
    gloss: 'Mia dit : Oui, c’est bien lui ! Allons le chercher tout de suite. Dieu merci.'
    note: '*Let''s go get it* signifie « allons le chercher », avec deux verbes à la suite sans *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Texte sur les objets trouvés
    gloss: 'Les objets trouvés : si tu perds un objet dans le parc, pense d’abord à l’endroit où tu l’avais en dernier. Rends-toi ensuite au bureau du parc, près de l’entrée principale, et décris l’objet -- indique sa couleur et ses détails particuliers. Donne ton nom et ton numéro de téléphone pour que le personnel puisse t’appeler s’il le retrouve plus tard. Après que Mia a perdu son sac à dos près de la fontaine, elle et Daniel ont tout de suite appelé le bureau du parc. Le personnel l’avait déjà trouvé et le gardait à l’accueil. Mia a été très soulagée de récupérer son appareil photo sain et sauf. Plus tard, elle a raconté toute l’histoire à Leila, et Leila a dit qu’elle aiderait Mia à mieux surveiller ses affaires la prochaine fois.'
    note: '*keep better track of your things* signifie « mieux surveiller tes affaires ».'
