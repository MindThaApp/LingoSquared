teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: téléphone, portable
    note: '*phone* signifie téléphone. Dans la vie courante, *phone* désigne le plus souvent le portable.'
    example_gloss: Mon portable est ici.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: appeler / appel
    note: '*call* peut être un appel ou signifier « appeler » : *a call* (nom), *to call* (verbe).'
    example_gloss: Je peux t’appeler.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: message
    note: '*message* signifie message.'
    example_gloss: Laissez un message.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: messagerie vocale, message vocal
    note: '*voicemail* est un message parlé laissé par téléphone (la messagerie vocale).'
    example_gloss: Le message vocal est court.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: répéter
    note: '*repeat* signifie dire encore une fois.'
    example_gloss: Répétez cela, s’il vous plaît.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: lentement
    note: '*slowly* signifie lentement. C’est un adverbe en *-ly* ; en français, l’adverbe « lentement » se forme avec *-ment*.'
    example_gloss: Parlez lentement, s’il vous plaît.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Allô, c’est Leila.
    note: Au téléphone, en anglais, on dit *this is...* pour dire qui appelle. *My name is...* sonne bizarrement au téléphone.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Puis-je parler à Mia ?
    note: '*speak to* signifie parler à. Le français « à » se dit ici *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Répétez cela, s’il vous plaît.
    note: '*Please repeat that* demande poliment de répéter.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Parlez lentement, s’il vous plaît.
    note: '*slowly* se place ici après le verbe *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Laissez un message.
    note: '*leave a message* est l’expression figée pour « laisser un message ».'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Je rappellerai plus tard.
    note: '*call back* signifie rappeler. La particule *back* se place après le verbe.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia décroche
    gloss: 'Mia dit : Allô, c’est Mia.'
    note: '*this is Mia* sonne naturel au téléphone.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila dit qui appelle
    gloss: 'Leila dit : Salut Mia, c’est Leila.'
    note: Utilise *this is* pour te présenter toi-même au téléphone.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila entend mal
    gloss: 'Leila dit : Je ne t’entends pas bien.'
    note: '*can''t hear you well* signifie « ne pas pouvoir t’entendre bien ».'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila demande de parler lentement
    gloss: 'Leila dit : Parle lentement, s’il te plaît.'
    note: '*Please speak slowly* est une demande polie.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia donne l’heure
    gloss: 'Mia dit : Bien sûr. La réunion est à quatre heures.'
    note: '*at four* emploie *at* pour une heure.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila demande de répéter
    gloss: 'Leila dit : Répète, s’il te plaît.'
    note: '*repeat that* renvoie à ce qui vient d’être dit.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: Mia répète quatre heures
    gloss: 'Mia dit : Quatre heures.'
    note: '*Four o''clock* est une heure pleine.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila rappellera plus tard
    gloss: 'Leila dit : Merci. Je rappellerai plus tard.'
    note: '*I''ll* est la forme abrégée de *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Message téléphonique
    gloss: 'Message téléphonique : Mia a appelé à 3 h 00. Réunion en salle 5. Merci de rappeler.'
    note: Le message indique qui a appelé, l’heure, la salle et ce qu’il faut faire.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Texte : Un court appel'
    gloss: 'Un court appel : Mia a appelé Leila dans l’après-midi. Le son n’était pas clair, alors Leila a demandé à Mia de parler lentement. Mia a dit que la réunion était à quatre heures en salle 5. Leila a demandé à Mia de répéter l’heure. Plus tard, Leila a écrit un message téléphonique. Le message disait que Mia avait appelé à 3 h 00 et lui demandait de rappeler.'
    note: '*called* est le passé de *call*.'
