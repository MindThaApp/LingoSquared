course:
  title: Anglais A1
  description: 'Apprends l’anglais au niveau A1 : salutations et courtes conversations du quotidien, avec des explications détaillées en français.'
units:
  en.a1.unit62.phone_calls:
    title: Conversations téléphoniques
lessons:
  en.a1.unit62.lesson01.phone_words:
    title: Mots pour parler au téléphone
  en.a1.unit62.lesson02.phone_phrases:
    title: Phrases pour le téléphone
  en.a1.unit62.lesson03.dialogue_on_the_phone:
