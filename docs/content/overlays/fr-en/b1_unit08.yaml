teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: avant (que)
    note: '*before* signifie plus tôt qu’un autre événement.'
    example_gloss: Lave-toi les mains avant de cuisiner.
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: après (que)
    note: '*after* signifie plus tard qu’un autre événement.'
    example_gloss: Appelle-moi après avoir fini de travailler.
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: dès que
    note: '*as soon as* signifie immédiatement quand quelque chose se produit.'
    example_gloss: Dès que j’arrive, je t’envoie un message.
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: d’ici à ce que
    note: '*by the time* signifie au plus tard au moment où quelque chose se produit.'
    example_gloss: D’ici à l’arrivée de Mia, le dîner sera prêt.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: prévenir qu’on est bien arrivé
    note: '*check in* signifie prévenir quelqu’un, en peu de mots, qu’on est arrivé ou qu’on est en sécurité.'
    example_gloss: Fais-moi signe quand tu seras arrivé à l’hôtel.
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: fermer à clé
    note: '*lock up* signifie fermer et sécuriser une pièce ou un bâtiment.'
    example_gloss: Je ferme à clé avant de quitter le bureau.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: Faire quelque chose juste après
    gloss: Dès que je suis rentré, je t’appelle.
    note: '*as soon as* montre que la deuxième action se produit tout de suite après la première.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: Faire d'abord quelque chose
    gloss: Regarde le courrier avant de monter, s’il te plaît.
    note: '*before* montre quelle action doit avoir lieu en premier.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Le présent dans les propositions de temps
    gloss: Quand je rentrerai, je t’appellerai. Regarde le courrier avant de monter, s’il te plaît.
    note: 'Dans une proposition de temps en anglais, on met le présent pour l’événement futur : *when I get home*, et non *when I will get home*.'
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: porte d’entrée
    note: '*front door* désigne la porte principale, à l’avant d’une maison ou d’un bâtiment.'
    example_gloss: Daniel ferme la porte d’entrée à clé après avoir regardé le courrier.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: prêt
    note: '*ready* signifie préparé ou prêt à être utilisé.'
    example_gloss: D’ici à l’arrivée de Mia, le dîner sera prêt.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Texte : le programme de la soirée'
    gloss: Daniel a une routine du soir très soignée. Quand il rentre, il regarde d’abord le courrier. Après avoir regardé le courrier, il ferme la porte d’entrée à clé. Avant de commencer le dîner, il se lave les mains et débarrasse la table. Quand Mia arrive, la cuisine est prête et le repas est chaud.
    note: Un court texte avec *when*, *after*, *before* et *by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila demande un appel
    gloss: 'Leila dit : Daniel, tu peux m’appeler quand tu rentres ?'
    note: Une question avec *when* pour indiquer le moment de l’action.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel promet d'appeler tout de suite
    gloss: 'Daniel dit : Bien sûr. Dès que je serai rentré, je t’appellerai.'
    note: '*as soon as* montre qu’il appelle immédiatement.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila donne une première tâche
    gloss: 'Leila dit : Regarde le courrier avant de monter, s’il te plaît.'
    note: '*before* montre que le courrier passe en premier.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel indique la prochaine étape
    gloss: 'Daniel dit : Promis. Après avoir regardé le courrier, je fermerai la porte d’entrée à clé.'
    note: '*after* montre l’ordre entre deux actions.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila indique le moment
    gloss: 'Leila dit : Parfait. D’ici à l’arrivée de Mia, tout devrait être prêt.'
    note: '*by the time* signifie que tout doit être prêt à ce moment-là, ou avant.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel finalise le plan
    gloss: 'Daniel dit : Alors on pourra commencer le dîner quand elle arrivera.'
    note: '*when she arrives* indique le moment où ils pourront commencer.'
