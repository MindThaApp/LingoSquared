teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: symptôme
    note: '*symptom* signifie symptôme, quelque chose que tu ressens dans ton corps. L’orthographe est différente de « symptôme » : *symptom* s’écrit avec *y* et se termine par *-om*, sans accent.'
    example_gloss: C’est un symptôme.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: toux
    note: '*cough* signifie toux. Il se prononce *kof* ; le *gh* se prononce ici comme *f*.'
    example_gloss: J’ai de la toux.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: fièvre
    note: '*fever* signifie fièvre. Les deux mots ne se ressemblent pas à l’écrit, apprends-le donc comme un mot nouveau.'
    example_gloss: Tu as de la fièvre ?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: gorge
    note: '*throat* signifie gorge (la partie intérieure) ; pour la partie extérieure du cou, on dit *neck*.'
    example_gloss: J’ai mal à la gorge.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: mal de tête
    note: '*headache* signifie mal de tête (en anglais, au singulier).'
    example_gloss: J’ai mal à la tête.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: médicament
    note: '*medicine* signifie médicament ou médecine. Le mot est indénombrable : *some medicine*.'
    example_gloss: Prends ce médicament.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: J’ai de la toux.
    note: En anglais, tu dis *have a cough* avec *a* ; en français, on dit souvent « j’ai de la toux » ou « je tousse », sans cette structure.
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: J’ai mal à la gorge.
    note: '*hurts* signifie « fait mal ». En anglais, le sujet est la partie du corps avec *my* (*my throat hurts*) ; il n’y a pas de « j’ai mal à » comme en français.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: J’ai mal à la tête.
    note: En anglais, tu dis *have a headache* avec *a* ; en français, on dit « j’ai mal à la tête » avec *avoir mal*.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: Avez-vous un médicament ?
    note: '*Do you have...?* demande si quelque chose est disponible.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Prenez ceci avec de l’eau.
    note: '*with water* se place à la fin de la phrase.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Veuillez consulter un médecin.
    note: '*Please* rend la phrase polie.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila cite un mal
    gloss: 'Leila dit : Bonjour. J’ai de la toux.'
    note: '*I have a cough* indique un mal.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: Le pharmacien demande s’il y a de la fièvre
    gloss: 'Le pharmacien dit : Avez-vous de la fièvre ?'
    note: '*Do you have a fever?* est une question à laquelle on répond par oui ou par non.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila n’a pas de fièvre
    gloss: 'Leila dit : Non, je n’ai pas de fièvre. J’ai mal à la gorge.'
    note: '*No, I do not have...* nie un mal. En anglais, on nie avec *do not*, et *have* garde l’article : *I do not have a fever*.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: Le pharmacien demande s’il y a un mal de tête
    gloss: 'Le pharmacien dit : Avez-vous mal à la tête ?'
    note: '*headache* signifie mal de tête.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila a mal à la tête
    gloss: 'Leila dit : Oui, j’ai mal à la tête.'
    note: '*Yes* signifie oui.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Conseil du pharmacien
    gloss: 'Le pharmacien dit : Prenez ce médicament avec de l’eau. Veuillez consulter un médecin si vous vous sentez plus mal.'
    note: '*if you feel worse* signifie « si vous vous sentez plus mal ».'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila remercie
    gloss: 'Leila dit : Merci.'
    note: '*Thank you* est la formule courte de remerciement.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Mot de la pharmacie
    gloss: 'Mot de la pharmacie : Toux et mal de gorge. Pas de fièvre. Prendre le médicament avec de l’eau. Consulter un médecin si ça empire.'
    note: Le mot indique des maux et des conseils simples.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Texte : Une visite à la pharmacie'
    gloss: 'Une visite à la pharmacie : Leila est allée à la pharmacie parce qu’elle toussait et avait mal à la gorge. Le pharmacien lui a demandé si elle avait de la fièvre. Leila a dit qu’elle n’avait pas de fièvre, mais qu’elle avait mal à la tête. Le pharmacien lui a donné un médicament et lui a dit de le prendre avec de l’eau. Le mot disait de consulter un médecin si elle se sentait plus mal.'
    note: '*felt worse* est le passé de *feel worse*.'
