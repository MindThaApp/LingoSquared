teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: musée
    note: '*museum* signifie musée. Le mot est très proche du français, mais se prononce différemment en anglais.'
    example_gloss: Ce musée est très ancien.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: billet
    note: '*ticket* désigne un titre d’entrée, que l’on appelle en français un « billet ».'
    example_gloss: Il me faut un billet, s’il vous plaît.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: exposition
    note: '*exhibition* désigne un ensemble d’œuvres d’art ou d’objets à voir.'
    example_gloss: Il y a une nouvelle exposition.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: tableau
    note: '*painting* désigne une œuvre d’art réalisée avec de la peinture.'
    example_gloss: J’aime beaucoup ce tableau.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: sculpture
    note: '*sculpture* désigne une œuvre d’art en pierre, en bois ou en métal ; le mot s’écrit comme en français, mais se prononce autrement.'
    example_gloss: Cette sculpture est très ancienne aussi.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: guide
    note: '*guide* désigne une personne qui fait visiter les lieux aux visiteurs et leur donne des explications.'
    example_gloss: Y a-t-il un guide aujourd’hui ?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: À quelle heure ouvre le musée ?
    note: Cette question commence par *what time*, suivi de l’auxiliaire *does* car le verbe principal est *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: À quelle heure ferme le musée ?
    note: Même structure que *What time does the museum open?*, avec *close* à la place de *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Deux billets, s’il vous plaît.
    note: '*please* à la fin rend la demande polie, comme quand on commande à manger.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: Y a-t-il un guide pour l’exposition ?
    note: '*Is there...?* sert à demander si quelque chose est présent, ici un guide.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Le musée est ouvert tous les jours.
    note: '*every day* signifie tous les jours et se place à la fin de la phrase.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: J’ai vraiment apprécié les tableaux !
    note: '*enjoyed* est le passé de *enjoy* (apprécier), utilisé pour évoquer un bon moment.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel dit : Salut ! À quelle heure ferme le musée ?'
    note: '*Hi!* est une salutation informelle.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: L’employé répond
    gloss: 'L’employé dit : Nous fermons à cinq heures.'
    note: '*at* + heure indique le moment où quelque chose se passe, comme dans *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: La demande de Mia
    gloss: 'Mia dit : Parfait. Pouvons-nous avoir deux billets, s’il vous plaît ?'
    note: '*Can we have...?* est une façon polie de demander ou de commander quelque chose.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Le prix
    gloss: 'L’employé dit : Bien sûr. Cela fait douze dollars.'
    note: '*That''s* + montant sert à annoncer un prix.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: La question de Daniel sur le guide
    gloss: 'Daniel demande : Y a-t-il un guide pour l’exposition ?'
    note: Même structure *Is there...?* que celle vue plus haut dans cette unité.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: L’employé parle du guide
    gloss: 'L’employé dit : Oui, il y a un guide près de l’entrée.'
    note: '*there''s* est la contraction de *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia demande le nom
    gloss: 'Mia demande : Comment s’appelle l’exposition ?'
    note: '*What is ... called?* est la façon habituelle de demander le nom de quelque chose.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Le nom de l’exposition
    gloss: 'L’employé dit : Elle s’appelle Colors of the City.'
    note: '*It''s called...* est la réponse à la question *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: La conclusion de Daniel
    gloss: 'Daniel dit : Merci ! J’ai hâte de voir les tableaux.'
    note: '*can''t wait to...* signifie avoir très envie de faire quelque chose.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Panneau du musée
    gloss: 'Musée de la ville : ouvert tous les jours, de 9 h à 17 h. Billet adulte : 6 dollars. Exposition en cours : Colors of the City, salle 2.'
    note: Le panneau indique les horaires d’ouverture, le prix et le nom de l’exposition.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Texte sur Daniel et Mia
    gloss: 'Une visite au musée : Un samedi après-midi, Daniel et Mia ont décidé de visiter ensemble le musée de la ville. À l’entrée, l’employé leur a dit que le musée fermait à cinq heures. Ils ont acheté deux billets pour douze dollars. Daniel a demandé s’il y avait un guide, et l’employé a répondu qu’il y en avait un près de l’entrée. Ils ont visité l’exposition, Colors of the City, et ont vu beaucoup de beaux tableaux dans la salle 2. Daniel a aimé un tableau de la vieille place de la ville, et Mia a aimé un tableau de la rivière au coucher du soleil. En partant, Mia a dit qu’elle voulait visiter l’exposition de sculptures la prochaine fois.'
    note: '*decided to visit* utilise *to* + infinitif après *decided*, pour dire ce que quelqu’un a décidé de faire.'
