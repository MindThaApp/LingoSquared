course:
  title: Anglais B2
  description: Apprendre l’anglais au niveau B2 pour des conversations nuancées, des arguments, des hypothèses et des discussions professionnelles, avec des explications en français courant.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Accord, contradiction et fondement des affirmations
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Lecture : une enquête et un rapport de l’exploitant'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: origine de l’information
    note: '*source* est ce d’où vient une information. N’emploie pas *according to* partout ; il s’agit parfois d’accord ou de conflit entre les sources.'
    example_gloss: Une origine de l’information fournit des renseignements.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: faire la synthèse de, réunir en un tout
    note: '*synthesize* signifie combiner des informations venant de plusieurs sources en une réponse cohérente.'
    example_gloss: Faire la synthèse, c’est combiner des informations provenant de sources.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: évaluer, apprécier
    note: '*evaluate* signifie juger la solidité de quelque chose.'
    example_gloss: Évaluer, c’est estimer la solidité de quelque chose.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: accord, concordance
    note: '*agreement* signifie que les sources disent la même chose sur un point.'
    example_gloss: La concordance signifie que les sources disent la même chose.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: contradiction, désaccord
    note: '*conflict* signifie que les sources se contredisent ou diffèrent sur un point.'
    example_gloss: La contradiction signifie que les sources ne sont pas d’accord.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: jugement argumenté, appréciation réfléchie
    note: '*judgment* est un jugement fondé sur la force respective des sources. En anglais américain, on écrit *judgment* ; en anglais britannique, on trouve aussi *judgement*.'
    example_gloss: Un jugement argumenté explique quelle source est la plus solide.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Accord plus contradiction
    gloss: Les deux sources s’accordent sur le fait que la demande a augmenté, mais elles divergent sur la cause.
    note: '*Both sources agree... but they disagree...* vaut mieux que deux phrases séparées avec *according to* à chaque fois.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: en revanche, par opposition
    note: Utilise *By contrast* quand tu opposes réellement deux sources ou deux points. N’en fais pas un simple mot de remplissage pour « en revanche ».
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: mieux étayé
    note: '*better supported on the cause* signifie que les preuves de la cause sont plus solides.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Construire une synthèse
    gloss: Une synthèse doit dire sur quoi les sources concordent, sur quoi elles divergent et quel compte rendu est le mieux étayé.
    note: Utilise *agree*, *conflict* et *better supported* pour préciser le lien entre les sources.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: enquête, sondage
    note: '*survey* recueille les réponses ou les remarques de plusieurs personnes.'
    example_gloss: Une enquête peut recueillir beaucoup de remarques.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: compte rendu, récit
    note: '*account* est un compte rendu ou une explication de ce qui s’est passé.'
    example_gloss: Un compte rendu explique ce qui s’est passé.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Source A : l’enquête auprès des voyageurs indique que les bus en retard sont devenus plus fréquents après l’ouverture du nouvel hôpital. De nombreux voyageurs disent que la ligne est maintenant bondée, surtout le matin. L’enquête soutient que la cause principale est une demande plus forte.'
    note: La source A contient beaucoup de remarques de voyageurs, mais ce n’est pas automatiquement la meilleure preuve de la cause.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Source B : le rapport de l’exploitant admet que la demande a augmenté après l’ouverture de l’hôpital, mais il identifie le manque de conducteurs comme la cause principale du service en retard. Le rapport comprend les registres du personnel pour la même période.'
    note: '*staffing records* donnent une preuve plus solide de la cause que la seule expérience des voyageurs.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa présente la source A
    gloss: 'Tessa dit : J’ai lu deux comptes rendus sur le service de bus en retard. L’enquête auprès des voyageurs indique que la demande a augmenté après l’ouverture du nouvel hôpital.'
    note: Cela présente une source et un point sur la hausse de la demande.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan présente la source B
    gloss: 'Rowan dit : Le rapport de l’exploitant admet que la demande a augmenté, mais il dit que le principal problème était le manque de conducteurs.'
    note: La source B confirme un point, mais diffère sur la cause.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa fait la synthèse
    gloss: 'Tessa dit : Donc les sources s’accordent sur la hausse de la demande, mais divergent sur la cause.'
    note: '*agree on* et *conflict about* résument le lien entre les sources.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan s’interroge sur les preuves
    gloss: 'Rowan demande : Quel compte rendu est le mieux étayé ?'
    note: Il demande un jugement, pas seulement un résumé.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa compare les preuves
    gloss: 'Tessa dit : L’enquête contient beaucoup de remarques de voyageurs, mais le rapport de l’exploitant comprend les registres du personnel.'
    note: 'C’est une question de preuves : des remarques contre des données.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan demande un jugement
    gloss: 'Rowan demande : Alors, ton jugement ?'
    note: '*judgment* demande une conclusion argumentée.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa donne son jugement
    gloss: 'Tessa dit : Le rapport de l’exploitant est mieux étayé sur la cause, même si l’enquête est utile pour montrer l’expérience des voyageurs.'
    note: '*although* garde les deux sources en vue tout en donnant un jugement.'
