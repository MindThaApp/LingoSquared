teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: louer
    note: '*rent* signifie louer. En anglais, le même verbe *rent* peut désigner le fait de prendre un bien en location ou de le donner en location : le contexte indique le sens.'
    example_gloss: Je veux louer un vélo.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: caution
    note: '*deposit* signifie caution : c’est la somme versée à l’avance que l’on récupère si le vélo est rendu en bon état.'
    example_gloss: La caution est de vingt dollars.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: rendre
    note: '*return* signifie ici rendre quelque chose, et non revenir.'
    example_gloss: Veuillez rendre le vélo aujourd’hui.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: heure
    note: '*hour* signifie heure.'
    example_gloss: Cela coûte dix dollars de l’heure.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: taille
    note: '*size* signifie taille.'
    example_gloss: De quelle taille avez-vous besoin ?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: casque
    note: '*helmet* signifie casque.'
    example_gloss: Avez-vous un casque ?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Je voudrais louer un vélo, s’il vous plaît.
    note: '*I''d like to*, contraction de *I would like to*, permet de formuler une demande polie, plus courtoise que la tournure directe *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Combien cela coûte-t-il par heure ?
    note: 'Dans *does it cost*, on emploie l’auxiliaire *does* parce que le verbe principal est *cost* : c’est la même structure avec *do* que dans les autres questions en anglais.'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: J’ai besoin d’un petit vélo.
    note: Dans *need a small bike*, l’anglais emploie simplement le verbe *need* suivi du groupe nominal. En français, on utilise généralement la tournure « avoir besoin de ».
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Puis-je avoir un casque, s’il vous plaît ?
    note: '*Can I have ...?* est une formule courante et polie pour demander quelque chose dans un magasin. Elle correspond naturellement à « Puis-je avoir… ? » en français.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Quand dois-je le rendre ?
    note: Dans *do I need to*, on retrouve l’auxiliaire *do* qui sert à construire la question.
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: C’est dix dollars de l’heure.
    note: 'Dans ce contexte, *an hour* signifie « par heure » : l’article *an* exprime ici un tarif pour chaque heure, comme *a* avec d’autres unités de temps.'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Le loueur les accueille
    gloss: 'Le loueur dit : Bonjour ! Que puis-je faire pour vous aujourd’hui ?'
    note: '*How can I help you today?* est une formule d’accueil polie courante dans les commerces et les services.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: La demande de Mia
    gloss: 'Mia dit : Nous voudrions louer deux vélos. Nous voulons faire du vélo le long de la rivière.'
    note: Dans *We'd like to rent*, le verbe *rent* désigne ici le fait de louer les vélos auprès du magasin.
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Le loueur demande la taille
    gloss: 'Le loueur dit : Bien sûr. De quelle taille avez-vous besoin ?'
    note: Dans *What size do you need?*, on emploie là encore l’auxiliaire *do* pour construire la question.
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: La taille de Leila
    gloss: 'Leila dit : Il m’en faut un petit.'
    note: Ici, *one* remplace le mot *bike* pour éviter de le répéter. En français, le nom peut aussi être sous-entendu dans « un petit », mais en anglais, *one* doit être exprimé.
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: La taille de Mia
    gloss: 'Mia dit : Et il m’en faut un de taille moyenne.'
    note: Ici encore, *one* remplace *bike*, comme dans la phrase précédente de Leila.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Le prix et la caution
    gloss: 'Le loueur dit : Parfait, voici vos vélos. C’est dix dollars de l’heure, et la caution est de vingt dollars.'
    note: 'Cette phrase donne deux informations distinctes, le tarif horaire et le montant de la caution : veille à ne pas les confondre.'
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia demande quand rendre les vélos
    gloss: 'Mia dit : Quand devons-nous les rendre ?'
    note: Ici, *them* renvoie aux vélos, qui sont au pluriel.
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: L’heure de retour
    gloss: 'Le loueur dit : Veuillez les rendre au plus tard à cinq heures.'
    note: '*by five o''clock* signifie au plus tard à cinq heures, et non après.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila remercie le loueur
    gloss: 'Leila dit : Parfait, merci !'
    note: '*Great, thank you!* est une formule courte et courante pour terminer poliment un échange.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Texte sur une balade à vélo le long de la rivière
    gloss: Par un après-midi chaud, Mia proposa à Leila de faire du vélo le long de la rivière près de son appartement. Aucune des deux n’avait de vélo, alors elles allèrent ensemble dans un magasin de location. Le loueur leur demanda de quelle taille elles avaient besoin. Leila prit un petit vélo, tandis que Mia en prit un de taille moyenne. La location coûtait dix dollars de l’heure, et la caution pour les deux vélos était de vingt dollars. Elles devaient rendre les vélos au plus tard à cinq heures. La balade le long de la rivière était magnifique, et elles virent des gens promener leur chien et profiter du beau temps. Elles rendirent les vélos juste à temps et récupérèrent leur caution. Ensuite, elles racontèrent leur balade à Daniel, qui leur dit qu’il voulait les accompagner la prochaine fois.
    note: '*owned* est le prétérit de *own*, qui signifie posséder. *Neither of them owned a bike* signifie qu’aucune des deux n’avait de vélo.'
