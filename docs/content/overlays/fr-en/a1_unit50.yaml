  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia à la réception
    gloss: 'Mia dit : Bonjour, nous avons une réservation pour deux nuits.'
    note: '*we have a reservation* signifie « nous avons une réservation ».'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: Le réceptionniste les accueille
    gloss: 'Le réceptionniste dit : Bienvenue ! À quel nom est la réservation ?'
    note: '*What''s the name on the reservation?* signifie « à quel nom est la réservation ? ».'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Elle est à mon nom, Leila.'
    note: '*it''s under my name* se traduit par « elle est à mon nom » ; l’anglais dit littéralement « sous mon nom » avec la préposition *under*.'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: Le réceptionniste donne la clé
    gloss: 'Le réceptionniste dit : Parfait. Voici votre clé. Votre chambre a deux lits.'
    note: '*Your room has two beds.* signifie « votre chambre a deux lits ».'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: La question de Mia sur le wifi
    gloss: 'Mia demande : Est-ce que la chambre a le wifi ?'
    note: Reprise de la question déjà apprise.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: Le réceptionniste parle du petit-déjeuner
    gloss: 'Le réceptionniste dit : Oui, et le petit-déjeuner est en bas, de sept heures à dix heures.'
    note: '*from seven to ten* signifie « de sept heures à dix heures ».'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: La question de Leila sur le départ
    gloss: 'Leila dit : Merci ! À quelle heure est le départ ?'
    note: Reprise de la question déjà apprise, *What time is check-out?*
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: Le réceptionniste parle du départ
    gloss: 'Le réceptionniste dit : Le départ est à onze heures.'
    note: '*Check-out is at eleven o''clock.* signifie « le départ est à onze heures ».'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Texte sur un week-end à la maison d’hôtes
    gloss: 'Un week-end à la maison d’hôtes : Mia et Leila ont fait un court voyage à la montagne pour le week-end. Mia adore prendre des photos, et Leila adore peindre, c’était donc l’endroit idéal pour se détendre. En arrivant à la maison d’hôtes, elles ont dit au réceptionniste qu’elles avaient une réservation pour deux nuits, du 14 au 16 novembre. Le réceptionniste a demandé le nom de la réservation, et Leila a dit qu’elle était à son nom. Leur chambre avait deux lits et le wifi, et le petit-déjeuner était inclus chaque matin de sept heures à dix heures. Le départ était à onze heures. Mia a pris beaucoup de photos des montagnes, et Leila a peint un petit tableau de la vue depuis leur fenêtre. Daniel est resté chez lui ce week-end-là et s’est préparé le dîner, avec une recette du livre de cuisine qu’il a emprunté à la bibliothèque. Quand Mia et Leila sont rentrées, elles lui ont montré leurs photos et le tableau, et il les a adorés.'
    note: '*Their room had two beds and wifi* signifie « leur chambre avait deux lits et le wifi ».'
