units:
  en.a2.unit30.job_interview:
    title: Passer un entretien d’embauche
lessons:
  en.a2.unit30.lesson01.interview_vocabulary:
    title: Expérience, poste et points forts
  en.a2.unit30.lesson02.talking_about_experience_and_availability:
    title: Parler de son expérience et de sa disponibilité
  en.a2.unit30.lesson03.reading_a_job_posting:
    title: Lire une offre d’emploi
  en.a2.unit30.lesson04.interview_dialogue:
    title: L’entretien d’embauche
teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: expérience
    note: '*experience* désigne l’expérience, surtout professionnelle.'
    example_gloss: J’ai deux ans d’expérience dans le marketing.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: poste
    note: '*position* désigne le poste ou la fonction occupée dans une entreprise.'
    example_gloss: Ce poste est destiné à un coordinateur ou une coordinatrice marketing.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: disponibilité
    note: '*availability* désigne les moments où l’on est libre, par exemple pour commencer à travailler.'
    example_gloss: L’intervieweuse m’a interrogé sur ma disponibilité.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: point fort
    note: '*strength* désigne ce que l’on sait faire particulièrement bien.'
    example_gloss: L’un de mes points forts, c’est que je suis bien organisé(e).
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: exigence / condition requise
    note: '*requirement* désigne ce qui est demandé pour le poste.'
    example_gloss: Deux ans d’expérience professionnelle sont requis pour ce poste.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Décrire sa propre expérience
    gloss: J’ai deux ans d’expérience dans le marketing des réseaux sociaux.
    note: Cette phrase te sert, en entretien d’embauche, à décrire ton expérience professionnelle.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Citer un point fort
    gloss: L’un de mes points forts, c’est que je suis bien organisé(e).
    note: '*One of my strengths is...* est la façon habituelle de citer un point fort en entretien d’embauche.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Indiquer sa disponibilité
    gloss: Je peux commencer lundi prochain.
    note: Avec *I'm available to start...*, tu indiques à partir de quand tu peux commencer.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: CV
    note: '*resume* signifie CV. Ce mot s’emploie surtout en anglais américain.'
    example_gloss: Veuillez apporter votre CV à l’entretien.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: échéance / date limite
    note: '*deadline* désigne la date limite à laquelle quelque chose doit être terminé. En français, on dit aussi parfois « deadline », mais « date limite » ou « échéance » sont plus courants.'
    example_gloss: Au travail, je respecte toujours mes délais.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Texte de l'offre d'emploi
    gloss: 'Bright Path Marketing recherche un coordinateur ou une coordinatrice marketing. Profil demandé : deux ans d’expérience professionnelle, une bonne maîtrise de l’écrit et une disponibilité immédiate. Veuillez apporter votre CV à l’entretien.'
    note: Une offre d’emploi formelle, avec les exigences du poste et une consigne.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Parler de sa façon de travailler
    gloss: Je respecte les délais et je travaille bien en équipe.
    note: '*I meet deadlines* et *I work well in a team* sont des phrases utiles pour décrire sa façon de travailler.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: La recruteuse demande l'expérience
    gloss: 'L’intervieweuse dit : Merci d’être venu aujourd’hui. Pouvez-vous me parler de votre expérience ?'
    note: '*Thank you for coming in today* est une façon polie d’ouvrir un entretien d’embauche.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Réponse de Mia sur son expérience
    gloss: 'Mia dit : J’ai deux ans d’expérience dans le marketing des réseaux sociaux. J’ai aussi dirigé une petite équipe.'
    note: 'C’est la même phrase sur l’expérience que dans la leçon 2, avec un détail en plus : elle a dirigé une équipe.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Demander un point fort
    gloss: 'L’intervieweuse dit : Très bien. Quel est l’un de vos points forts ?'
    note: L’intervieweuse réagit positivement, puis pose la question suivante.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Réponse de Mia sur son point fort
    gloss: 'Mia dit : Je suis très organisée et je respecte les délais.'
    note: Mia cite son point fort (être organisée) et donne un exemple concret (respecter les délais).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Demander s'il y a d'autres questions
    gloss: 'L’intervieweuse demande : Avez-vous des questions sur le poste ?'
    note: Une question presque toujours posée à la fin d’un entretien d’embauche.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia pose sa propre question
    gloss: 'Mia dit : Oui, j’aimerais savoir à quoi ressemble une semaine type à ce poste.'
    note: '*I was wondering...* est une façon polie de poser soi-même une question.'
