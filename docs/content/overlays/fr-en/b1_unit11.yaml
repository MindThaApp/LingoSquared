teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: conditionnel (ferais, irais…)
    note: '*would* + verbe à l’infinitif exprime un résultat imaginé ou une préférence polie.'
    example_gloss: Je participerais si j’avais plus de temps.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: préférer, aimer mieux
    note: '*would rather* signifie qu’on préfère faire une chose plutôt qu’une autre.'
    example_gloss: Je préférerais suivre le cours du week-end.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: si j’étais
    note: '*if I were* introduit une situation irréelle qui concerne soi-même.'
    example_gloss: Si j’étais libre ce soir, j’irais.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: occasion, opportunité
    note: '*opportunity* désigne une bonne occasion de faire quelque chose.'
    example_gloss: Ce cours est une belle occasion pour Leila.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: regret
    note: '*regret* désigne le regret éprouvé à propos d’une décision passée.'
    example_gloss: 'Elle a un regret : ne pas avoir commencé à économiser plus tôt.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: tenter sa chance, prendre un risque
    note: '*take a chance* signifie tenter quelque chose même si la réussite n’est pas certaine.'
    example_gloss: Si le cours était moins cher, elle tenterait sa chance.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Eine unwirkliche Situation in der Gegenwart
    gloss: Si j’avais plus de temps, je suivrais un cours de design.
    note: 'Pour une situation irréelle au présent, on met le verbe au prétérit après *if* : *If I had more time*. Comme en français, où l’on emploie l’imparfait après « si » (« si j’avais »), suivi du conditionnel.'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: S’il était moins cher, je m’inscrirais aujourd’hui.
    note: '*were* sonne naturel dans une condition irréelle, même avec *it*.'
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Unwirkliche Bedingungen in der Gegenwart
    gloss: S’il était moins cher, je m’inscrirais.
    note: 'Forme : *if* + prétérit, puis *would* + verbe à l’infinitif.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: plus tôt
    note: '*sooner* signifie plus tôt que le moment où la chose s’est réellement produite.'
    example_gloss: Si elle l’avait su plus tôt, elle aurait économisé plus d’argent.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: sûr de soi, confiant
    note: '*confident* signifie qu’on se sent capable de bien faire quelque chose.'
    example_gloss: Si Daniel participait, Leila se sentirait plus sûre d’elle.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Lesetext: eine verpasste Gelegenheit'
    gloss: 'Leila a trouvé un cours de design qu’elle a vraiment envie de suivre. Il est utile, mais cher. S’il était moins cher, elle s’inscrirait aujourd’hui. Si Daniel suivait aussi le cours, elle se sentirait plus sûre d’elle. Son seul regret concerne le moment : si elle avait connu ce cours plus tôt, elle aurait économisé plus d’argent.'
    note: Un court texte avec des conditions irréelles au présent et au passé.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia stellt eine hypothetische Frage
    gloss: 'Mia dit : Leila, est-ce que tu suivrais le cours de design s’il était moins cher ?'
    note: Une question hypothétique et polie avec *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila nennt das vorgestellte Ergebnis
    gloss: 'Leila dit : Absolument. S’il était moins cher, je m’inscrirais aujourd’hui.'
    note: '*If it were cheaper, I would...* décrit ce qu’elle ferait dans une autre situation.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia schlägt ein weiteres Szenario vor
    gloss: 'Mia dit : Et si Daniel participait aussi ?'
    note: '*What if...* introduit une possibilité imaginée.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila beschreibt ihr Gefühl
    gloss: 'Leila dit : Si Daniel participait, je me sentirais plus sûre de moi.'
    note: '*joined* est au prétérit parce que la situation est seulement imaginée.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia nennt ihre Vorliebe
    gloss: 'Mia dit : Je préférerais suivre le cours du week-end plutôt que celui du soir.'
    note: '*would rather ... than ...* compare deux préférences.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila spricht über ein Bedauern in der Vergangenheit
    gloss: 'Leila dit : Moi aussi. Si je l’avais su plus tôt, j’aurais économisé plus d’argent.'
    note: '*if + past perfect, would have + participe passé* décrit une situation irréelle dans le passé.'
