teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: grand, grande
    note: '*tall* signifie grand (pour la taille d’une personne).'
    example_gloss: Mon frère est grand.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: petit, petite
    note: '*short* signifie ici petit (pour une personne) ; *short* signifie aussi « court », par exemple pour les cheveux.'
    example_gloss: Ma sœur est petite.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: cheveux
    note: '*hair* signifie cheveux. En anglais, le mot est indénombrable : *her hair is long*, pas *her hairs are long*.'
    example_gloss: Elle a les cheveux longs.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: blond, blonde
    note: '*blond* signifie blond.'
    example_gloss: Il a les cheveux blonds.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: bouclé, frisé
    note: '*curly* signifie bouclé ou frisé.'
    example_gloss: Leila a les cheveux bouclés.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: yeux
    note: '*eyes* signifie yeux (pluriel).'
    example_gloss: J’ai les yeux marron.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: bleu
    note: '*blue* signifie bleu.'
    example_gloss: Elle a les yeux bleus.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: marron
    note: '*brown* signifie marron.'
    example_gloss: J’ai les yeux marron.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: vert
    note: '*green* signifie vert.'
    example_gloss: Il a les yeux verts.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: lunettes
    note: '*glasses* signifie lunettes. Le mot est toujours au pluriel ; *wears glasses* signifie « porte des lunettes ».'
    example_gloss: Mon père porte des lunettes.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Elle est comment ?
    note: 'Fais attention à la construction : en français, on demande « Elle est comment ? » avec le verbe *être*, sans auxiliaire. En anglais, avec un verbe ordinaire (*look*), il faut toujours *does* ou *do* : *What does she look like?*, jamais *What looks she like?*. Oublier l’auxiliaire *does* (la construction avec *do*) est l’erreur la plus fréquente.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Début de Leila
    gloss: 'Leila dit : Une nouvelle collègue commence aujourd’hui. Elle s’appelle Mia.'
    note: '*starting today* signifie « à partir d’aujourd’hui ».'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Question de Daniel
    gloss: 'Daniel demande : Elle est comment ?'
    note: 'Encore la construction avec *do* : n’omets pas *does* et n’inverse pas le sujet et le verbe comme en français.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Description de Leila
    gloss: 'Leila dit : Elle est grande et elle a les cheveux bouclés et blonds.'
    note: '*She''s* est la forme abrégée de *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Autre question de Daniel
    gloss: 'Daniel demande : Elle porte des lunettes ?'
    note: 'Ici aussi, tu as besoin de la construction avec *do* : *Does she wear glasses?*, pas *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Réponse de Leila
    gloss: 'Leila dit : Oui. Elle a aussi les yeux verts.'
    note: '*Yes, she does* est une courte réponse affirmative où l’on reprend l’auxiliaire *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Dernière remarque de Daniel
    gloss: 'Daniel dit : D’accord, je crois que je la vois à la porte maintenant.'
    note: '*at the door* signifie « à la porte ».'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Texte sur Daniel et Leila
    gloss: Daniel et Leila sont de bons amis, mais ils ne se ressemblent pas. Daniel est grand et il a les cheveux courts et noirs. Il porte des lunettes. Leila est petite et elle a les cheveux longs, bouclés et châtains. Elle a les yeux bleus, et Daniel a les yeux marron. Ils aiment tous les deux beaucoup rire.
    note: '*don''t look the same* signifie « ne se ressemblent pas ». Ici aussi, tu as besoin de la construction avec *do* (*don''t* = *do not*), même à la forme négative.'
