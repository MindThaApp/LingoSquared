teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: conseil
    note: '*advice* désigne l''avis qu''on donne à quelqu''un sur ce qu''il devrait faire.'
    example_gloss: Leila a donné un conseil utile à Daniel.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: proposer, suggérer
    note: '*suggest* veut dire proposer une idée à examiner.'
    example_gloss: Leila a suggéré une façon de gérer sa charge de travail.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: débordé
    note: '*overwhelmed* décrit le sentiment d''avoir plus à faire que ce qu''on peut gérer.'
    example_gloss: Daniel se sentait débordé par ses deux projets.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: établir des priorités, prioriser
    note: '*prioritize* veut dire s''occuper d''abord de la tâche la plus importante.'
    example_gloss: Daniel a décidé de donner la priorité au projet dont l'échéance était la plus proche.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: charge de travail
    note: '*workload* désigne la quantité totale de travail qu''une personne doit accomplir.'
    example_gloss: La charge de travail de Daniel a augmenté après son arrivée dans l'équipe en mars.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: refuser, décliner
    note: '*decline* veut dire refuser poliment une proposition ou une offre.'
    example_gloss: Daniel pouvait suivre ce conseil ou le refuser poliment.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + infinitif
    gloss: À ta place, je parlerais à ton responsable.
    note: '*if I were you, I would* est la formule de l''hypothèse irréelle qui sert à donner un conseil.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + infinitif
    gloss: Tu devrais donner la priorité au projet dont l'échéance est la plus proche.
    note: '*you should* est une recommandation directe.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: Et si tu demandais de l'aide à un collègue ?
    note: '*how about + -ing* est une façon plus douce de faire une suggestion.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Les formes pour donner un conseil
    gloss: 'Pour donner un conseil ou faire une suggestion, on dispose de plusieurs formes : If I were you, I would... (une hypothèse irréelle), You should... (une recommandation directe) et How about + -ing...? (une suggestion plus douce). Choisis une forme plus ou moins forte selon l''assurance que tu veux montrer.'
    note: 'Forme : choisis entre une hypothèse irréelle, une recommandation directe ou une suggestion douce.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: échéance, date limite
    note: '*deadline* désigne la date à laquelle quelque chose doit être terminé.'
    example_gloss: La prochaine échéance de Daniel est vendredi prochain.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Ça me paraît logique. Je vais essayer.
    note: '*that makes sense* montre qu''on comprend le conseil et qu''on l''accepte.'
    example_gloss: Ça me paraît logique. Je vais essayer cette semaine.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Texte : conseils en cas de surcharge de travail'
    gloss: Salut Leila, je me sens débordé cette semaine. Je dirige deux projets et, en plus, j'ai mon cours du soir. Un conseil ? Salut Daniel, à ta place, je parlerais à ton responsable de ta charge de travail. Tu devrais aussi donner la priorité au projet dont l'échéance est la plus proche. Et si tu demandais à Mia de t'aider sur l'autre ? Merci, ça me paraît logique. Je vais essayer et je te dirai comment ça se passe.
    note: Un conseil bref et chaleureux entre collègues.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel explique son problème
    gloss: 'Daniel dit : Je me sens un peu débordé. Je dirige deux projets, et j''ai encore mon cours du soir trois fois par semaine.'
    note: '*a little overwhelmed* décrit le fait d''avoir un peu trop de travail.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila donne son premier conseil
    gloss: 'Leila dit : À ta place, je parlerais à ton responsable de ta charge de travail.'
    note: '*if I were you, I would* est la forme de l''hypothèse irréelle.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel hésite
    gloss: 'Daniel dit : C''est une bonne idée, mais je ne veux pas donner l''impression de ne pas y arriver.'
    note: '*I don''t want to seem like* exprime la crainte de l''image qu''on donne.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila fait deux propositions concrètes
    gloss: 'Leila dit : Tu devrais d''abord donner la priorité au projet dont l''échéance est la plus proche. Et si tu demandais à un collègue de t''aider sur l''autre ?'
    note: '*you should* et *how about* associent une suggestion directe et une suggestion douce.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel accepte le conseil
    gloss: 'Daniel dit : Ça me plaît. Je vais demander à Mia si elle a le temps cette semaine.'
    note: '*I like that* montre qu''on accepte le conseil.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila confirme le plan
    gloss: 'Leila dit : Ça me paraît un plan solide.'
    note: Une conclusion brève et encourageante pour la conversation.
