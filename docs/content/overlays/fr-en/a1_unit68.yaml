  en.a1.unit68.lesson02.teach.borrow_umbrella:
    title: Can I borrow your umbrella?
    gloss: Je peux t’emprunter ton parapluie ?
    note: '*Can I borrow...?* demande si tu peux emprunter quelque chose à quelqu’un.'
  en.a1.unit68.lesson02.teach.lend_charger:
    title: Can you lend me a charger?
    gloss: Tu peux me prêter un chargeur ?
    note: '*Can you lend me...?* demande si quelqu’un peut te prêter quelque chose.'
  en.a1.unit68.lesson02.teach.lend_to_you:
    title: I can lend it to you.
    gloss: Je peux te le prêter.
    note: '*lend it to you* signifie te le prêter.'
  en.a1.unit68.lesson02.teach.return_tomorrow:
    title: Please return it tomorrow.
    gloss: Rends-le-moi demain, s’il te plaît.
    note: '*Please return it...* demande poliment à quelqu’un de rendre quelque chose.'
  en.a1.unit68.lesson02.teach.thanks_lending:
    title: Thank you for lending it.
    gloss: Merci de me le prêter.
    note: '*Thank you for...* utilise *for* pour indiquer la raison du remerciement.'
  en.a1.unit68.lesson02.teach.need_today:
    title: I need it today.
    gloss: J’en ai besoin aujourd’hui.
    note: '*today* signifie aujourd’hui.'
  en.a1.unit68.lesson03.teach.dialogue_line1:
    title: Leila demande le parapluie
    gloss: 'Leila dit : Salut Mia. Je peux t’emprunter ton parapluie ?'
    note: '*Can I borrow your umbrella?* est la demande.'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: Mia prête le parapluie
    gloss: 'Mia dit : Oui, je peux te le prêter.'
    note: '*lend it to you* dit que Mia le prête.'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: Leila remercie Mia
    gloss: 'Leila dit : Merci. Il pleut aujourd’hui.'
    note: '*It is raining today* explique pourquoi elle a besoin du parapluie.'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: Mia demande qu’on le lui rende
    gloss: 'Mia dit : Rends-le-moi demain, s’il te plaît.'
    note: '*tomorrow* indique quand le parapluie doit être rendu.'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: Leila propose un chargeur
    gloss: 'Leila dit : Bien sûr. Tu as besoin d’un chargeur ?'
    note: '*Of course* signifie bien sûr.'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: Mia veut emprunter un chargeur
    gloss: 'Mia dit : Oui, tu peux me prêter un chargeur ?'
    note: '*Can you lend me...?* demande à emprunter quelque chose.'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: Leila en prête un
    gloss: 'Leila dit : Bien sûr. Je peux t’en prêter un.'
    note: '*one* renvoie à un chargeur.'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: Mot d’emprunt
    gloss: 'Mot d’emprunt : Leila a le parapluie de Mia aujourd’hui. À rendre demain. Mia a le chargeur de Leila.'
    note: Le mot indique qui a quel objet et quand le parapluie doit être rendu.
  en.a1.unit68.lesson04.teach.reading_passage:
    title: 'Texte : Des amies qui partagent'
    gloss: 'Des amies qui partagent : Il pleuvait, alors Leila a demandé un parapluie à Mia. Mia a dit qu’elle pouvait le lui prêter. Mia a demandé à Leila de le lui rendre demain. Ensuite, Mia a eu besoin d’un chargeur. Leila a prêté un chargeur à Mia. Les deux amies ont écrit un petit mot pour se rappeler ce qu’il fallait rendre.'
    note: '*lent* est le passé de *lend*.'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: J’ai emprunté ton parapluie.
    note: '*borrowed* est le passé de *borrow*.'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: Je te le rendrai demain.
    note: '*will* + verbe décrit ce que tu vas faire dans le futur.'
