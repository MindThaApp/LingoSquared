  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: Tu es libre samedi ?
    note: '*on Saturday* utilise *on* devant un jour de la semaine. En français, on dit simplement « samedi ».'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: Voudrais-tu venir dîner ?
    note: '*Would you like to...?* est une façon polie d’inviter quelqu’un.'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: Apporte une boisson, s’il te plaît.
    note: '*bring* signifie ici apporter quelque chose au rendez-vous.'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: Je peux venir.
    note: Cette phrase accepte une invitation de façon courte et claire.
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: Désolé, je ne peux pas venir.
    note: '*can''t* est la contraction de *cannot*.'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: À six heures !
    note: '*at six* utilise *at* devant une heure ; il correspond ici à « à » (à six heures).'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Leila demande si Daniel est libre
    gloss: 'Leila dit : Salut Daniel ! Tu es libre samedi ?'
    note: '*Are you free...?* demande si quelqu’un est disponible.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel est libre
    gloss: 'Daniel dit : Oui, je suis libre.'
    note: '*I am free* signifie je suis disponible.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila invite Daniel
    gloss: 'Leila dit : Voudrais-tu venir dîner ?'
    note: '*Would you like to come...?* est poli et aimable.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Daniel accepte
    gloss: 'Daniel dit : Oui, avec plaisir.'
    note: '*I''d love to* est une façon chaleureuse de dire oui.'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Leila demande une boisson
    gloss: 'Leila dit : Apporte une boisson, s’il te plaît.'
    note: '*Please bring...* est une demande polie.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel demande l’heure
    gloss: 'Daniel dit : D’accord. À quelle heure ?'
    note: '*What time?* est une question courte et naturelle.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila donne six heures
    gloss: 'Leila dit : À six heures !'
    note: '*at six* utilise *at* devant une heure.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel remercie Leila
    gloss: 'Daniel dit : Super. Merci pour l’invitation.'
    note: '*Thank you for...* utilise *for* pour introduire la raison du remerciement.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Invitation
    gloss: 'Invitation à dîner : samedi à 6:00. Apporte une boisson, s’il te plaît. Adresse : 18 Park Street.'
    note: L’invitation indique le jour, l’heure, ce que Daniel doit apporter et l’adresse.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Texte : Dîner chez Leila'
    gloss: 'Dîner chez Leila : Leila a invité Daniel à dîner samedi. Elle lui a demandé d’apporter une boisson. Daniel a dit qu’il pouvait venir. L’invitation indiquait que le dîner avait lieu à 6:00 au 18 Park Street. Daniel a noté l’adresse dans son téléphone. Il voulait arriver à l’heure. Leila était contente parce que son ami pouvait venir.'
    note: '*invited Daniel to dinner* signifie que Leila a invité Daniel à dîner.'
