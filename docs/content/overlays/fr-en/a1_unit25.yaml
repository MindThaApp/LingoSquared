    title: sometimes
    gloss: parfois
    note: '*sometimes* signifie parfois. En français, on dit Parfois, je vais courir, avec l’adverbe en début de phrase. En anglais, *Sometimes I go running* garde aussi le sujet avant le verbe ; mais le plus courant est de placer l’adverbe de fréquence entre le sujet et le verbe : *I sometimes go running*.'
