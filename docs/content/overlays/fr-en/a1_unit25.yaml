  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: J’aime lire.
    note: '*I like* + un verbe en *-ing* sert à dire que tu aimes faire quelque chose.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: La question de Leila
    gloss: 'Leila demande : Que fais-tu pendant ton temps libre, Daniel ?'
    note: Leila ouvre la conversation par une question directe à Daniel.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Réponse de Daniel"
    gloss: 'Daniel répond : Je vais souvent courir. Et je cuisine parfois. Et toi ?'
    note: Daniel cite deux loisirs avec leur fréquence et renvoie la question avec *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila parle de peinture
    gloss: 'Leila dit : J’adore peindre. Je peins presque tous les week-ends.'
    note: '*almost every weekend* signifie presque tous les week-ends.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: La question suivante de Daniel
    gloss: 'Daniel dit : C’est génial ! Est-ce que tu joues parfois aux jeux vidéo ?'
    note: On utilise *Do you ever...?* pour demander si quelqu’un fait parfois quelque chose.
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: La dernière réponse de Leila
    gloss: 'Leila dit : Rarement. Je préfère lire un livre.'
    note: '*I prefer...* signifie : je préfère..., j’aime mieux...'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Texte sur les loisirs
    gloss: Daniel et Leila ont des loisirs différents. Daniel va toujours courir le samedi matin et cuisine parfois pour ses amis. Leila ne va jamais courir, mais elle peint souvent le week-end. Ils aiment tous les deux les jeux vidéo, mais ils jouent rarement ensemble.
    note: Ce texte compare directement les loisirs de Daniel et de Leila et leur fréquence.
