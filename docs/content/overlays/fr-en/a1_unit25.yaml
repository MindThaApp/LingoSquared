  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: souvent
    note: '*often* signifie souvent. Fais attention à l’ordre des mots en anglais : *She often cooks dinner* (sujet, *often*, verbe), sans inversion. En français, on peut aussi placer l’adverbe au début de la phrase (Souvent, elle prépare le dîner pour sa famille), mais en anglais l’adverbe de fréquence se place normalement entre le sujet et le verbe.'
