teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: aider / aide
    note: '*help* peut être le verbe « aider » ou le nom « aide ». En français, on dit « aider quelqu’un » ; en anglais, il n’y a pas de préposition devant la personne : *help me* se dit sans *to*.'
    example_gloss: Tu peux m’aider ?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: porter
    note: '*carry* signifie tenir quelque chose et l’emporter d’un endroit à un autre.'
    example_gloss: Je peux le porter.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: lourd
    note: '*heavy* signifie lourd (de poids).'
    example_gloss: C’est lourd.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: sac
    note: '*bag* signifie sac, aussi sachet.'
    example_gloss: Ce sac est lourd.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: porte
    note: '*door* signifie porte.'
    example_gloss: Ouvre la porte.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: étagère, rayon
    note: '*shelf* signifie étagère ou rayon, par exemple au mur ou dans une armoire. Le pluriel est *shelves*.'
    example_gloss: Mets-le sur l’étagère.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Tu peux m’aider ?
    note: '*Can you...?* est une façon directe et courante de demander de l’aide.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Ce sac est lourd.
    note: Utilise *this bag* pour le sac qui est près de toi.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Pourrais-tu ouvrir la porte ?
    note: '*Could you...?* est plus poli que *Can you...?*. Cela correspond au conditionnel français « Pourrais-tu... ? ».'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Je peux aider.
    note: Cette phrase propose de l’aide.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Merci pour ton aide.
    note: '*Thank you for...* emploie *for* pour la raison du remerciement, comme « merci pour ».'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Mets-le sur l’étagère.
    note: '*put it on...* signifie poser ou mettre quelque chose sur quelque chose. L’anglais emploie *put* aussi bien pour « poser » que pour « mettre ».'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila demande de l’aide
    gloss: 'Leila dit : Salut Daniel. Tu peux m’aider ?'
    note: '*Can you help me?* est la phrase de base pour demander de l’aide.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel demande ce qu’il faut
    gloss: 'Daniel dit : Bien sûr. De quoi as-tu besoin ?'
    note: '*Of course* signifie bien sûr.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: Le sac est lourd
    gloss: 'Leila dit : Ce sac est lourd.'
    note: '*heavy* explique pourquoi il faut de l’aide.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel peut porter le sac
    gloss: 'Daniel dit : Je peux le porter.'
    note: '*carry it* renvoie au sac. L’anglais emploie *it* pour les choses ; il ne distingue pas le masculin et le féminin comme le français (« le » / « la »).'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila demande d’ouvrir la porte
    gloss: 'Leila dit : Pourrais-tu aussi ouvrir la porte ?'
    note: '*Could you...?* rend la demande polie.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel parle de l’étagère
    gloss: 'Daniel dit : Oui. Je peux poser le sac sur l’étagère ?'
    note: Avec *Can I ...?*, Daniel propose de poser le sac sur l’étagère.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila remercie Daniel
    gloss: 'Leila dit : Oui, s’il te plaît. Merci pour ton aide.'
    note: '*Thank you for your help* est une formule de remerciement figée.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel répond
    gloss: 'Daniel dit : Pas de problème.'
    note: '*No problem* est une réponse courte et aimable.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Mot d’aide
    gloss: 'Mot d’aide : Le sac bleu est lourd. Merci de le poser sur l’étagère près de la porte.'
    note: Le mot indique de quel sac il s’agit et où il doit aller.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Texte : Un voisin serviable'
    gloss: 'Un voisin serviable : Leila avait un sac bleu très lourd. Elle a vu Daniel près de la porte et lui a demandé de l’aide. Daniel a porté le sac à l’intérieur. Leila lui a aussi demandé d’ouvrir la porte. Puis Daniel a posé le sac sur l’étagère près de la porte. Leila a remercié Daniel pour son aide. Daniel a dit : Pas de problème. Plus tard, Leila a écrit un petit mot : Le sac bleu est sur l’étagère.'
    note: '*carried* est le passé de *carry*.'
