teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: pendant que
    note: '*while* signifie que quelque chose se passe en même temps que autre chose.'
    example_gloss: Pendant que je conduisais, il s’est mis à pleuvoir.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: crevaison, pneu crevé
    note: '*flat tire* désigne un pneu dégonflé, qui ne fonctionne plus.'
    example_gloss: Mon pneu a crevé sur l’autoroute.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: se garer sur le bas-côté
    note: '*pull over* signifie arrêter sa voiture sur le bord de la route.'
    example_gloss: J’ai dû me garer tout de suite sur le bas-côté.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: inconnu
    note: '*stranger* désigne une personne qu’on ne connaît pas.'
    example_gloss: Un inconnu s’est arrêté pour m’aider.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: mécanicien
    note: '*mechanic* désigne une personne qui répare les voitures.'
    example_gloss: Le mécanicien a réparé mon pneu rapidement.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: a dit que
    note: On utilise *said that* pour rapporter ce que quelqu’un d’autre a dit.
    example_gloss: Il a dit qu’il pouvait aider.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: Pendant que je roulais vers le travail, mon pneu a crevé.
    note: '*while* + passé avec *was/were* + -ing décrit l’action en arrière-plan, interrompue par autre chose.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: Quand je me suis garé sur le bas-côté, un inconnu s’est arrêté pour aider.
    note: '*when* introduit l’événement suivant dans l’histoire.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: Pendant que je roulais, mon pneu a crevé. Quand je me suis garé sur le bas-côté, un inconnu m’a aidé.
    note: '*while* marque l’arrière-plan (une action en cours) ; *when* marque l’événement suivant, plus court, qui se produit à ce moment-là.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: avait déjà appelé
    note: '*had already* + participe passé décrit quelque chose qui s’était déjà produit avant un autre moment du passé.'
    example_gloss: Quand il est arrivé, j’avais déjà appelé Daniel.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: a tenu parole
    note: '*kept his word* signifie que quelqu’un a fait ce qu’il avait promis.'
    example_gloss: Il a tenu parole et l’a réparé en dix minutes.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: Hier matin, pendant que Leila roulait vers le travail, son pneu a soudain crevé. Elle s’est garée dans une rue calme. Un inconnu s’est arrêté et lui a proposé son aide. Quand le mécanicien est arrivé, Leila avait déjà appelé Daniel pour lui dire qu’elle serait en retard. Le mécanicien a dit qu’il pouvait réparer le pneu en dix minutes. Il a tenu parole, et Leila n’est arrivée au travail qu’avec vingt minutes de retard.
    note: Un récit au passé avec une action en arrière-plan (*while*), une succession d’événements (*when*) et quelque chose qui s’était déjà produit avant (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: 'Daniel dit : Tu es en retard ! Qu’est-ce qui s’est passé ?'
    note: Une question directe et inquiète, par laquelle l’histoire commence.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: 'Leila dit : Pendant que je roulais vers le travail, mon pneu a soudain crevé.'
    note: '*while* marque l’arrière-plan, pendant lequel autre chose s’est produit.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: 'Daniel dit : Oh non ! Qu’est-ce que tu as fait ?'
    note: Une courte question pour en savoir plus sur l’histoire.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: 'Leila dit : Je me suis garée sur le bas-côté, et un inconnu s’est arrêté pour m’aider.'
    note: L’événement suivant de l’histoire, après l’action en arrière-plan.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: 'Daniel dit : C’était gentil de sa part. Tu as appelé un mécanicien ?'
    note: '*that was kind of him* est une réaction naturelle à la gentillesse de quelqu’un.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: 'Leila dit : Oui, j’en avais déjà appelé un avant que l’inconnu n’arrive. Le mécanicien a dit qu’il pouvait le réparer en dix minutes, et il l’a fait !'
    note: '*had already called* montre ce qui s’était déjà passé avant l’arrivée de l’inconnu.'
