course:
  title: Anglais B2
  description: Apprendre l’anglais au niveau B2 pour des conversations nuancées, des arguments, des hypothèses et des discussions professionnelles, avec des explications en français courant.
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Thèse, preuves et réfutation
  en.b2.unit01.lesson02.building_an_argument:
