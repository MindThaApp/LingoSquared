teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: thèse, affirmation défendue
    note: '*claim* désigne la position que tu défends. Ici, ce n''est ni une réclamation ni une demande d''indemnisation.'
    example_gloss: Sa thèse est que le plan doit se poursuivre.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: preuves, éléments à l'appui
    note: '*evidence* désigne les faits, les chiffres ou les exemples qui appuient ta thèse.'
    example_gloss: Cet exemple fournit à Mia des preuves pour sa thèse.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: contre-argument
    note: '*counterargument* est un point qui va à l''encontre de ta thèse. En anglais, il s''écrit en un seul mot, sans trait d''union.'
    example_gloss: Daniel avance un contre-argument.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: réfuter
    note: '*rebut* signifie répondre à un contre-argument sans abandonner sa propre thèse.'
    example_gloss: Mia réfute l'objection preuves à l'appui.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: concéder, reconnaître
    note: '*concede* signifie reconnaître qu''une partie de l''autre point de vue est raisonnable. Cela ne veut pas dire abandonner toute ta thèse.'
    example_gloss: Tu peux reconnaître une inquiétude sans abandonner ta thèse principale.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: l'emporter sur, peser plus lourd que
    note: '*outweigh* s''emploie quand un avantage, un risque ou une raison est plus important que autre chose.'
    example_gloss: Des preuves solides peuvent l'emporter sur une inquiétude.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Reconnaître un risque et maintenir sa position
    gloss: Je suis d'accord que le plan comporte des risques, mais les preuves plaident toujours en faveur de sa poursuite.
    note: '*I agree..., but...* reconnaît d''abord le point de l''autre. Ensuite, *but the evidence still supports...* montre que ta position tient toujours.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Donner ta raison principale
    gloss: La raison la plus forte est que les résultats de l'enquête étaient cohérents.
    note: '*The strongest reason is that...* introduit ton argument principal. Attention à l''ordre après *that* : sujet puis verbe.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Reconnaître une inquiétude légitime
    gloss: C'est une inquiétude légitime ; cependant, les données indiquent le contraire.
    note: '*That is a fair concern; however,...* sonne professionnel : tu reconnais l''inquiétude, puis tu la réfutes avec des données.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Défendre une position
    gloss: Énonce ta thèse, donne des preuves, reconnais le contre-argument le plus fort, puis réfute-le. Des formules comme *That is a fair concern* et *However* te permettent de paraître raisonnable sans abandonner ta thèse.
    note: 'Garde l''ordre normal sujet + verbe dans la proposition : *the data points in the other direction*, et non *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: fidélisation des employés, maintien des effectifs
    note: '*retention* signifie ici que les employés restent au lieu de partir.'
    example_gloss: Une meilleure fidélisation signifie que moins d'employés quittent l'équipe.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: collaboration, travail en commun
    note: '*collaboration* désigne le fait de travailler ensemble sur une tâche ou un projet. En français, « collaboration » peut aussi évoquer l''Occupation ; en anglais, le mot est neutre dans ce sens.'
    example_gloss: Une bonne collaboration aide une équipe à terminer son travail.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Texte : défendre un planning hybride'
    gloss: 'Mia soutient que l''entreprise devrait conserver le planning hybride le trimestre prochain. Sa thèse principale est que le travail hybride améliore la fidélisation sans réduire la performance. La preuve la plus solide est l''enquête auprès du personnel : les employés des équipes hybrides disaient moins souvent chercher un autre emploi. Le contre-argument le plus fort est que la collaboration risque de pâtir du fait que les gens ne sont pas au bureau tous les jours. Mia reconnaît cette inquiétude, mais elle la réfute avec des données de projet : les équipes hybrides ont livré dans les délais, et leurs notes d''évaluation étaient légèrement meilleures. Pour cette raison, elle conclut que les avantages l''emportent sur les risques.'
    note: 'Le texte construit un argument complet : thèse, preuve, contre-argument, réfutation et conclusion.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia énonce sa thèse
    gloss: 'Mia dit : Je pense que nous devrions garder le planning hybride pour le trimestre prochain.'
    note: Mia commence par une position claire et défendable.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel demande la raison
    gloss: 'Daniel dit : Quelle est ta raison la plus forte ?'
    note: Daniel ne demande pas un avis général, mais l'argument principal.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia apporte une preuve
    gloss: 'Mia dit : La raison la plus forte est la fidélisation. Dans l''enquête auprès du personnel, les gens qui travaillaient en mode hybride disaient moins souvent chercher un autre emploi.'
    note: Mia s'appuie sur les résultats d'une enquête comme preuve, pas seulement sur une impression.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel avance le contre-argument
    gloss: 'Daniel dit : Certains managers disent que la collaboration est plus faible quand les gens ne sont pas au bureau tous les jours.'
    note: C'est le contre-argument auquel Mia devra répondre ensuite.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia réfute avec des données
    gloss: 'Mia dit : C''est une inquiétude légitime. Cependant, les données du projet ne l''appuient pas. Les équipes hybrides ont livré leur travail dans les délais, et leurs notes d''évaluation étaient légèrement meilleures.'
    note: '*does not support it* utilise *does* parce que l''anglais exige l''auxiliaire *do* à la forme négative.'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel résume la position
    gloss: 'Daniel dit : Donc ta position est que les avantages l''emportent sur les risques ?'
    note: '*outweigh* exprime la mise en balance des avantages et des risques.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia conclut par une solution
    gloss: 'Mia dit : Exactement. Nous devrions améliorer les routines de réunion, pas abandonner le planning.'
    note: Mia défend le plan, mais propose aussi une amélioration concrète.
