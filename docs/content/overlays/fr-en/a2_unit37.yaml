course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit37.video_calls:
    title: Parler des appels vidéo
lessons:
  en.a2.unit37.lesson01.video_call_vocabulary:
    title: Caméra, micro et connexion
  en.a2.unit37.lesson02.describing_your_video_calls:
    title: Raconter tes appels vidéo et dire ce que tu préfères
  en.a2.unit37.lesson03.reading_about_video_calls:
    title: Lire comment quelqu’un d’autre utilise les appels vidéo
  en.a2.unit37.lesson04.video_calls_dialogue:
