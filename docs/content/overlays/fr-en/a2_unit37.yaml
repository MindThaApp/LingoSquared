teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: appel vidéo
    note: '*video call* est une conversation où l’on peut aussi se voir. En français, on dit aussi visioconférence ou « visio ».'
    example_gloss: J’ai un appel vidéo avec mon équipe tous les lundis.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: caméra
    note: '*camera* est l’appareil qui transmet ton image.'
    example_gloss: Allume ta caméra avant que la réunion commence, s’il te plaît.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: micro
    note: '*microphone* est l’appareil qui transmet ta voix.'
    example_gloss: Mon micro était coupé, donc les autres ne m’ont pas entendu.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: connexion
    note: '*connection* est la liaison entre ton ordinateur et Internet.'
    example_gloss: La connexion était mauvaise, donc l’image s’est figée.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: couper le micro
    note: '*mute* signifie couper ton propre son pour que les autres ne t’entendent pas.'
    example_gloss: Je coupe mon micro quand je ne parle pas.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: en personne, face à face
    note: '*face to face* signifie être dans la même pièce plutôt que de se parler à travers un écran.'
    example_gloss: Certaines réunions sont mieux en personne qu’en ligne.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Comparer avec faster than et less ... than
    gloss: Un appel vidéo est plus rapide qu’une visite. Un appel vidéo est moins personnel qu’une rencontre en face à face.
    note: Avec un adjectif court, on ajoute *-er* et on place *than* après (*faster than*). Avec un adjectif plus long, on emploie *less ... than* ou *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Dire à quelle fréquence vous avez des visioconférences
    gloss: J’ai un appel vidéo avec mon équipe tous les lundis.
    note: '*every Monday* signifie tous les lundis et décrit une habitude régulière.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Demander à quelqu'un d'allumer sa caméra
    gloss: Peux-tu allumer ta caméra ?
    note: '*turn on* signifie allumer ; le contraire est *turn off* (éteindre).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Dire que quelqu'un était en sourdine
    gloss: Désolé, ton micro était coupé.
    note: '*you were on mute* est l’expression toute faite quand on n’entendait pas quelqu’un parce que son micro était coupé.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Donner son avis avec une préférence
    gloss: Je trouve les appels vidéo pratiques, mais je préfère rencontrer les gens en personne.
    note: Avec *I think ... but I prefer ...*, tu donnes d’abord ton avis, puis ta préférence.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Je préfère les appels vidéo aux appels téléphoniques. Je préfère les rencontres en personne aux appels vidéo.
    note: 'Attention : après *prefer*, on emploie *to* et non *than*, comme dans « préférer ... à ... » : *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: casque audio
    note: '*headphones* s’emploie toujours au pluriel en anglais, même si tu n’utilises qu’un seul casque.'
    example_gloss: J’utilise un casque pour que ma famille n’entende pas la réunion.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Message de Leila
    gloss: Mes cours en ligne sont maintenant tous en appel vidéo. J’allume ma caméra, mais je coupe mon micro jusqu’à ce que la prof pose une question. J’utilise un casque parce que ma connexion est meilleure avec. Je trouve que les appels vidéo font gagner beaucoup de temps, mais je préfère quand même retrouver mes camarades en personne.
    note: Un message décontracté de Leila sur ses propres cours en ligne.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Dire quand vous coupez votre micro
    gloss: Je coupe mon micro jusqu’à ce que la prof pose une question.
    note: '*until* signifie « jusqu’à ce que » : quelque chose dure jusqu’à un moment précis.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila demande des nouvelles du travail de Daniel
    gloss: 'Leila demande : Tu as beaucoup d’appels vidéo au travail ?'
    note: '*a lot of* signifie beaucoup et s’emploie aussi bien avec des mots dénombrables qu’avec des mots non dénombrables.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel parle de son rendez-vous fixé
    gloss: 'Daniel dit : Oui, j’ai un appel vidéo avec mon équipe tous les lundis.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila demande des infos sur la caméra
    gloss: 'Leila demande : Tu allumes ta caméra ?'
    note: Une courte question de relance pour en savoir plus.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Habitude de Daniel en visioconférence
    gloss: 'Daniel dit : Toujours, mais je coupe mon micro quand je ne parle pas.'
    note: '*when I am not speaking* signifie ici : aux moments où je ne parle pas.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila parle de ses cours
    gloss: 'Leila dit : Mes cours en ligne sont maintenant tous en appel vidéo.'
    note: Cela renvoie à ses cours du lundi et du mercredi de l’unité 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel demande son avis
    gloss: 'Daniel demande : Qu’en penses-tu ?'
    note: '*What do you think about them?* demande ton avis sur quelque chose dont on vient de parler.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila donne son avis
    gloss: 'Leila dit : Je trouve les appels vidéo pratiques, mais je préfère rencontrer les gens en personne.'
    note: C’est le même avis que dans la leçon 2.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel est d'accord avec elle
    gloss: 'Daniel dit : Je suis d’accord. Un appel vidéo est plus rapide qu’une visite, mais il est moins personnel.'
    note: Avec *I agree*, tu exprimes ton accord. Ensuite, on donne en général sa raison.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila confirme
    gloss: 'Leila dit : Exactement.'
    note: '*Exactly* est une façon brève de dire que tu es tout à fait d’accord.'
