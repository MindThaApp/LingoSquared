units:
  en.a2.unit31.travel_disruption:
    title: Faire face aux perturbations de voyage
lessons:
  en.a2.unit31.lesson01.disruption_vocabulary:
    title: Retards, suppressions et solutions de remplacement
  en.a2.unit31.lesson02.asking_about_alternatives:
    title: Demander des solutions de remplacement
  en.a2.unit31.lesson03.reading_a_disruption_notice:
