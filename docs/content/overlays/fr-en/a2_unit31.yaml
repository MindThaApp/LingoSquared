teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: retard
    note: '*delay* signifie retard.'
    example_gloss: Le train de 5 h 15 a 45 minutes de retard.
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: annulé / supprimé
    note: '*cancelled* signifie que quelque chose n’a pas lieu. Pour un train, on dit plutôt « Le train est supprimé ».'
    example_gloss: Le train de 5 h 15 n’est pas supprimé, il est seulement en retard.
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: solution de remplacement / alternative
    note: '*alternative* désigne une autre possibilité.'
    example_gloss: 'L’agent a proposé une solution de remplacement : un bus à 5 h 30.'
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: avis / affiche
    note: '*notice* désigne un avis écrit destiné aux voyageurs, par exemple une affiche en gare.'
    example_gloss: J’ai lu en gare un avis concernant le retard.
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: problème de signalisation
    note: '*signal problem* désigne une panne ou un incident sur les signaux de la voie ferrée.'
    example_gloss: Le retard est dû à un problème de signalisation sur la voie.
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: Höflich nach dem Grund fragen
    gloss: Je me demandais pourquoi le train est en retard.
    note: '*I was wondering why...* est une façon polie et indirecte de demander la raison de quelque chose.'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: Nach einer Alternative fragen
    gloss: Y a-t-il un autre moyen de rentrer chez moi ce soir ?
    note: Avec *Is there another way to...?*, tu demandes s’il existe d’autres solutions.
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: Den Grund für die Verspätung nennen
    gloss: Le train a du retard à cause d’un problème de signalisation.
    note: Avec *has been delayed because of...*, tu indiques la cause d’un retard.
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: heure de départ
    note: '*departure time* signifie heure de départ.'
    example_gloss: Le nouvel horaire de départ est 6 h 00.
  en.a2.unit31.lesson03.teach.notice_text:
    title: Text der Mitteilung
    gloss: 'Avis : Le train de 5 h 15 a du retard à cause d’un problème de signalisation. Le nouvel horaire de départ est 6 h 00. Un bus est disponible à 5 h 30 devant la gare.'
    note: Un avis officiel qui donne la cause, le nouvel horaire et une solution de remplacement.
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: Die eigene Entscheidung mitteilen
    gloss: Je prendrai le bus à la place.
    note: '*instead* signifie à la place.'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: Der Mitarbeiter bietet Hilfe an
    gloss: 'L’agent demande : Puis-je vous aider ?'
    note: '*Can I help you?* est une question courante du personnel de gare.'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Daniel fragt nach dem Grund
    gloss: 'Daniel dit : Oui, je me demandais pourquoi le train est en retard.'
    note: C’est la même question polie que dans la leçon 2.
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: Der Mitarbeiter erklärt die Verspätung
    gloss: 'L’agent dit : Il y a un problème de signalisation sur la voie. Le nouvel horaire de départ est 6 h 00.'
    note: L’agent donne la cause et le nouvel horaire de départ.
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Daniel fragt nach einer Alternative
    gloss: 'Daniel dit : Y a-t-il un autre moyen de rentrer chez moi ce soir ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: Der Mitarbeiter nennt die Alternative
    gloss: 'L’agent dit : Il y a un bus qui part à 5 h 30 devant la gare.'
    note: L’agent propose une solution concrète, avec l’heure et le lieu.
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: Daniels abschließende Entscheidung
    gloss: 'Daniel dit : Merci. Je prendrai donc le bus à la place.'
    note: Daniel remercie l’agent et lui annonce sa décision.
