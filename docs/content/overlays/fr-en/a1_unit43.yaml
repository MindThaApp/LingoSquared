  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: bleu foncé
    note: '*dark blue* s’écrit en deux mots séparés en anglais, comme « bleu foncé » en français -- mais attention à l’ordre : en anglais, l’adjectif de nuance (*dark*) vient avant la couleur, alors qu’en français « foncé » vient après.'
    example_gloss: Il porte une chemise bleu foncé.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: vert clair
    note: '*light green* s’écrit en deux mots séparés, comme *dark blue*, et la nuance (*light*) vient avant la couleur -- en français, « clair » vient après : « vert clair ».'
    example_gloss: Elle a peint sa chambre en vert clair.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: va bien avec
    note: '*goes well with* signifie que deux couleurs ou deux vêtements vont bien ensemble.'
    example_gloss: Cette chemise bleue va bien avec un pantalon noir.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: trop vif
    note: '*too bright* signifie « trop vif », trop voyant comme couleur.'
    example_gloss: Le jaune est une couleur joyeuse, mais trop vive pour le travail.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: Quelle est ta couleur préférée ?
    note: '*What''s your favorite ...?* demande la préférence de quelqu’un.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Ma couleur préférée est le bleu.
    note: '*My favorite ... is ...* est la façon habituelle d’exprimer une préférence.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel demande : J’ai besoin d’une nouvelle chemise pour notre présentation de la semaine prochaine. Tu peux m’aider à choisir une couleur ?'
    note: '*Can you help me* + verbe*?* sert à demander de l’aide.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: La question de Mia
    gloss: 'Mia dit : Bien sûr ! Quelles couleurs te plaisent ?'
    note: '*What colors do you like?* demande quelles couleurs quelqu’un aime.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : J’aime le bleu et le vert, mais je ne sais pas trop ce qui fait professionnel.'
    note: '*I''m not sure what looks professional* signifie « je ne sais pas trop ce qui fait professionnel ».'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Le conseil de Mia
    gloss: 'Mia dit : Le bleu foncé est un excellent choix. Ça fait professionnel, et ça va bien avec un pantalon noir.'
    note: '*It looks professional* signifie « ça fait professionnel ».'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: La question de Daniel
    gloss: 'Daniel demande : Et celle-ci, la jaune ?'
    note: '*What about ...?* propose une autre possibilité.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Le conseil de Mia
    gloss: 'Mia dit : Le jaune est une couleur joyeuse, mais trop vive pour une présentation. Je choisirais la chemise bleu foncé.'
    note: '*I''d choose* signifie « je choisirais ».'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: La décision de Daniel
    gloss: 'Daniel dit : Merci, Mia. Ce sera bleu foncé !'
    note: '*Dark blue it is!* est une façon informelle de confirmer une décision.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Texte sur trois couleurs préférées
    gloss: Daniel, Leila et Mia ont chacun une couleur préférée différente. La couleur préférée de Daniel est le bleu. Il dit que c’est une couleur apaisante, et qu’elle va bien avec presque tout ce qu’il porte pour aller travailler. La couleur préférée de Leila est le vert, la couleur des plantes et des jardins qu’elle aime peindre. Elle trouve le vert clair particulièrement beau. La couleur préférée de Mia est le jaune, parce qu’il lui rappelle le soleil et la rend toujours heureuse. Même s’ils aiment tous des couleurs différentes, ils s’accordent à dire que les couleurs rendent chaque jour plus joyeux.
    note: '*reminds her of the sun* signifie « lui rappelle le soleil ».'
