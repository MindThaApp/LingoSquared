  en.a1.unit61.lesson02.teach.im_sorry:
    title: I'm sorry.
    gloss: Je suis désolé.
    note: '*I''m sorry* est la phrase standard pour s’excuser.'
  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: Je suis en retard.
    note: '*late* signifie ici en retard, et non tard dans la soirée.'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: Le bus est en retard.
    note: 'En anglais, on emploie la même structure pour une personne et pour un bus : *is late*.'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: Ce n’est pas grave.
    note: '*That''s okay* accepte des excuses avec gentillesse.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: Pas de problème.
    note: '*No problem* est une réponse courte et informelle à des excuses ou à un remerciement.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: J’ai fait une erreur.
    note: L’anglais dit *make a mistake*, comme le français « faire une erreur » ; on ne dit pas *do a mistake*.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel s'excuse"
    gloss: 'Daniel dit : Salut Mia. Je suis désolé d’être en retard.'
    note: '*I''m sorry I''m late* associe l’excuse et la raison.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia accepte
    gloss: 'Mia dit : Ce n’est pas grave.'
    note: '*That''s okay* est aimable et simple.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: Le bus est en retard
    gloss: 'Daniel dit : Le bus est en retard.'
    note: Cette phrase donne la raison.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia dit qu’on peut attendre
    gloss: 'Mia dit : Pas de problème. On peut attendre.'
    note: '*We can wait* signifie qu’attendre est possible.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel s’est trompé d’heure
    gloss: 'Daniel dit : Je me suis trompé sur l’heure.'
    note: '*with the time* signifie en ce qui concerne l’heure.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: Le cours commence à trois heures
    gloss: 'Mia dit : Ce n’est rien. Le cours commence à trois heures.'
    note: '*at three* utilise *at* devant une heure.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel remercie Mia
    gloss: 'Daniel dit : Merci d’avoir attendu.'
    note: '*Thank you for waiting* utilise *for* suivi de la forme en -ing.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Message du cours
    gloss: 'Message du cours : le cours commence à 3:00. Merci d’arriver à l’heure. Si tu es en retard, envoie un message.'
    note: Le message dit ce qu’il faut faire si tu es en retard.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Texte : Des excuses avant le cours'
    gloss: 'Des excuses avant le cours : Daniel était en retard au cours parce que le bus était en retard. Il a retrouvé Mia devant la salle de classe. Daniel a dit qu’il était désolé. Il a aussi dit qu’il s’était trompé sur l’heure. Mia a dit que ce n’était pas grave. Le cours était à 3:00. Daniel a envoyé un court message au professeur. Le message disait : « Je suis désolé d’être en retard. Le bus est en retard. »'
    note: '*because* donne la raison : parce que le bus était en retard.'
