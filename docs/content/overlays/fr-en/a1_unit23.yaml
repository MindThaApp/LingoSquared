teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: professeur, enseignant
    note: '*teacher* signifie professeur ou enseignant(e). L’anglais ne distingue pas le genre ici : *teacher* vaut pour les deux.'
    example_gloss: Leila est professeure.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: infirmier, infirmière
    note: '*nurse* signifie infirmier ou infirmière. Le mot est le même pour les femmes et les hommes.'
    example_gloss: Je suis infirmier/infirmière.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: ingénieur, ingénieure
    note: '*engineer* signifie ingénieur ou ingénieure. Devant une voyelle, on emploie *an* : *an engineer*.'
    example_gloss: Daniel est ingénieur.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: cuisinier, cuisinière
    note: '*cook* signifie cuisinier ou cuisinière ; le mot est aussi un verbe (« cuisiner »).'
    example_gloss: Mon frère est cuisinier.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: conducteur, conductrice
    note: '*driver* signifie conducteur ou conductrice. Dans *bus driver*, il est associé au véhicule, qui vient devant en anglais : « conducteur de bus ».'
    example_gloss: Il est conducteur de bus.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Qu’est-ce que tu fais dans la vie ?
    note: Avec *What do you do?*, tu demandes le métier de quelqu’un. C’est littéralement « Qu’est-ce que tu fais ? », mais cela veut dire « Qu’est-ce que tu fais dans la vie ? ».
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Je suis infirmier/infirmière.
    note: 'Avec *I''m a...*, tu dis ton métier. Attention : en français, on dit « Je suis professeur » sans article ; en anglais, *a* ou *an* se place devant le métier.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Où travailles-tu ?
    note: Avec *Where do you work?*, tu demandes le lieu de travail.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: patients
    note: '*patients* signifie patients (pluriel). Le mot se prononce *PEI-chents*.'
    example_gloss: J’aide des patients tous les jours.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Texte sur un profil professionnel
    gloss: Je suis infirmier/infirmière. Je travaille dans un hôpital. J’aide des patients et j’écris des rapports tous les jours.
    note: Dans ce court profil, une personne parle de son métier et de son travail quotidien.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: C’est un travail intéressant.
    note: '*interesting* signifie intéressant.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Demander son métier à Daniel
    gloss: 'Leila demande : Daniel, tu fais quoi dans la vie ?'
    note: C’est la même question que dans la deuxième leçon, cette fois avec un prénom.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Réponse de Daniel
    gloss: 'Daniel dit : Je suis ingénieur. Je travaille dans une petite entreprise du centre-ville.'
    note: Daniel dit son métier et où il travaille.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Demander les tâches quotidiennes
    gloss: 'Leila demande : Qu’est-ce que tu fais chaque jour ?'
    note: Cette question porte sur les tâches quotidiennes.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Réponse de Daniel
    gloss: 'Daniel dit : J’écris des rapports et je réponds aux e-mails. Parfois, je rencontre des clients.'
    note: Daniel cite quelques choses qu’il fait chaque jour.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Demander si Daniel aime son travail
    gloss: 'Leila demande : Ton travail te plaît ?'
    note: Avec *Do you like your job?*, tu demandes si quelqu’un aime son travail.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Réponse de Daniel
    gloss: 'Daniel dit : Oui, beaucoup. C’est un travail intéressant.'
    note: Daniel dit oui et donne aussi la raison.
