teaching:
  en.a1.unit20.lesson01.teach.bigger:
    title: bigger
    gloss: plus grand
    note: bigger est le comparatif de big.
    example_gloss: Cette veste est plus grande que celle-là.
  en.a1.unit20.lesson01.teach.smaller:
    title: smaller
    gloss: plus petit
    note: smaller est le comparatif de small.
    example_gloss: Ce t-shirt est plus petit que celui-là.
  en.a1.unit20.lesson01.teach.cheaper:
    title: cheaper
    gloss: moins cher
    note: cheaper est le comparatif de cheap.
    example_gloss: Ce t-shirt est moins cher que celui-là.
  en.a1.unit20.lesson01.teach.more_expensive:
    title: more expensive
    gloss: plus cher
    note: Les adjectifs longs comme *expensive* prennent *more* au lieu de *-er*.
    example_gloss: Cette veste est plus chère que celle-là.
  en.a1.unit20.lesson01.teach.faster:
    title: faster
    gloss: plus rapide
    note: '*faster* est le comparatif de *fast*.'
    example_gloss: Ma voiture est plus rapide que la sienne.
  en.a1.unit20.lesson02.teach.which_is_cheaper:
    title: Which bag is cheaper, the small one or the big one?
    gloss: Quel sac est le moins cher, le petit ou le grand ?
    note: 'Avec *Which...?*, tu demandes lequel de deux choses correspond le mieux à une qualité, ici : lequel est le moins cher.'
  en.a1.unit20.lesson02.teach.small_cheaper_than_big:
    title: The small bag is cheaper than the big bag.
    gloss: Le petit sac est moins cher que le grand sac.
    note: than s'emploie pour comparer directement deux choses.
  en.a1.unit20.lesson02.teach.big_bag_nicer:
    title: The big bag is nicer than the small bag.
    gloss: Le grand sac est plus joli que le petit sac.
    note: nicer est le comparatif de nice.
  en.a1.unit20.lesson03.teach.cheapest:
    title: cheapest
    gloss: le moins cher
    note: cheapest est le superlatif de cheap (pour trois choses ou plus).
    example_gloss: C'est le t-shirt le moins cher du magasin.
  en.a1.unit20.lesson03.teach.car_comparison_text:
    title: 'Texte : comparer des voitures'
    gloss: La voiture rouge est plus rapide que la voiture bleue, mais la bleue est moins chère. La voiture blanche est la moins chère des trois.
    note: 'Ce texte compare trois voitures : la rouge est plus rapide que la bleue, la bleue est moins chère que la rouge, et la blanche est la moins chère.'
  en.a1.unit20.lesson04.teach.how_much_cheaper:
    title: How much cheaper?
    gloss: Moins cher de combien ?
    note: How much...? sert à demander l'importance d'une différence.
  en.a1.unit20.lesson04.teach.by_five_dollars:
    title: cheaper by five dollars
    gloss: moins cher de cinq dollars
    note: by five dollars indique la différence exacte.
  en.a1.unit20.lesson04.teach.q_which_bag:
    title: Poser une question sur le sac
    gloss: 'Leila demande : Quel sac te plaît, le petit ou le grand ?'
    note: Cette question ressemble à celle de la deuxième leçon, mais ici Leila demande à Daniel quel sac lui plaît.
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : Le grand est plus joli, mais le petit est moins cher.'
    note: Avec *but*, Daniel oppose deux comparaisons.
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: Demander la différence
    gloss: 'Leila demande : Moins cher de combien ?'
    note: C'est la même question que plus haut.
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars:
    title: Les prix exacts
    gloss: 'Daniel dit : Le petit fait dix dollars, et le grand quinze dollars.'
    note: 'Daniel donne le prix des deux sacs : dix et quinze dollars.'
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: La conclusion de Leila
    gloss: 'Leila dit : D''accord, le petit est moins cher de cinq dollars. Je prends le petit.'
    note: Quinze moins dix font cinq, donc le petit sac est moins cher de cinq dollars.
