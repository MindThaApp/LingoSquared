teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: attestation
    note: '*certificate* désigne le document officiel qu’une administration te délivre ; *registration certificate* est l’attestation d’enregistrement de ton domicile.'
    example_gloss: Mon attestation d’enregistrement est arrivée deux semaines après le rendez-vous.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: erreur
    note: '*mistake* désigne quelque chose qui a été mal écrit ou mal fait.'
    example_gloss: Il y a une erreur dans mon adresse sur ce formulaire.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: écrit, orthographié
    note: '*spelled* indique avec quelles lettres, et dans quel ordre, un mot s’écrit.'
    example_gloss: Mon nom s’écrit avec un seul L, pas avec deux.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: rectifier, corriger
    note: 'Ici, *correct* est un verbe : rendre juste ce qui était faux.'
    example_gloss: L’agent peut corriger mon nom de famille aujourd’hui.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: copie
    note: '*copy* est un deuxième exemplaire identique d’un document.'
    example_gloss: L’administration garde une copie de chaque document.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: passeport
    note: '*passport* est le document de voyage qui porte ta photo.'
    example_gloss: Je prends toujours mon passeport quand j’ai un rendez-vous à l’administration.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is und there are
    gloss: Il y a une erreur sur mon attestation. Il y a deux erreurs sur mon attestation.
    note: On emploie *there is* pour une seule chose et *there are* pour plusieurs.
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Sagen, dass ein Fehler vorliegt
    gloss: Il y a une erreur sur mon attestation d’enregistrement.
    note: '*There is a mistake on...* est la manière factuelle et formelle de signaler une erreur.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Sagen, was genau falsch ist
    gloss: Mon nom de famille est mal orthographié.
    note: '*last name* est le nom de famille ; *first name* est le prénom.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Fragen, ob es berichtigt werden kann
    gloss: Pourriez-vous la corriger, s’il vous plaît ?
    note: '*Could you...?* est plus poli que *Can you...?* et convient à un guichet administratif.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Fragen, wie lange es dauert
    gloss: Combien de temps va prendre la rectification ?
    note: '*How long...?* interroge sur une durée, pas sur une longueur.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: zwei höfliche Bitten
    gloss: Pourriez-vous la corriger, s’il vous plaît ? Serait-il possible d’obtenir une nouvelle attestation ?
    note: '*Could you...?* demande de faire quelque chose ; *Would it be possible to...?* est encore plus prudent et demande si la chose est seulement possible.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: jours ouvrables
    note: '*working days* sont les jours du lundi au vendredi, donc sans le week-end.'
    example_gloss: L’administration répond à chaque courrier sous cinq jours ouvrables.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Das Schreiben zur Berichtigung
    gloss: Demande de rectification reçue. Votre attestation d’enregistrement sera corrigée sous cinq jours ouvrables. Veuillez apporter votre passeport et le présent courrier au bureau. Numéro de référence 3092.
    note: 'Un courrier officiel est bref et factuel : ce qui s’est passé, ce qui va se passer et ce que vous devez faire.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: was man mitbringen soll
    gloss: Veuillez apporter votre passeport et le présent courrier au bureau.
    note: '*bring ... to ...* signifie apporter quelque chose à un endroit.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila meldet den Fehler
    gloss: 'Leila dit : Bonjour, il y a une erreur sur mon attestation d’enregistrement.'
    note: '*Hello* est plus neutre que *Hi* et convient mieux à un guichet.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Der Sachbearbeiter fragt nach
    gloss: 'L’agent dit : Je vois. Qu’est-ce qui ne va pas ?'
    note: '*I see* signifie ici : je comprends, je vous écoute.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila erklärt den Fehler und bittet um Berichtigung
    gloss: 'Leila dit : Mon nom de famille est mal orthographié. Pourriez-vous le corriger, s’il vous plaît ?'
    note: Ce sont les mêmes deux phrases que dans la leçon 2, maintenant l’une après l’autre.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Der Sachbearbeiter fragt nach dem Reisepass
    gloss: 'L’agent dit : Bien sûr. Avez-vous votre passeport sur vous ?'
    note: '*Do you have ... with you?* signifie : l’avez-vous sur vous en ce moment ?'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila reicht ihren Reisepass
    gloss: 'Leila dit : Oui, le voici.'
    note: On dit *Here it is* en tendant quelque chose à quelqu’un.
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Der Sachbearbeiter erklärt, was er tut
    gloss: 'L’agent dit : Merci beaucoup. Je fais une copie et j’envoie la rectification dès aujourd’hui.'
    note: '*make a copy* est une expression figée : faire une copie.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila fragt, wie lange es dauert
    gloss: 'Leila demande : Combien de temps va prendre la rectification ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Die Antwort des Sachbearbeiters
    gloss: 'L’agent dit : Sous cinq jours ouvrables.'
    note: '*within* signifie dans un délai donné : cela prendra cinq jours ouvrables au maximum.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Sachbearbeiter
    gloss: 'Leila dit : Merci beaucoup.'
    note: '*very much* donne plus de force au remerciement.'
