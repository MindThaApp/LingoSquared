course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit36.document_correction:
    title: Faire corriger une erreur dans un document officiel
lessons:
  en.a2.unit36.lesson01.document_vocabulary:
    title: Attestations, erreurs et copies
  en.a2.unit36.lesson02.asking_for_a_correction:
    title: Demander une rectification
  en.a2.unit36.lesson03.reading_a_correction_notice:
    title: Lire un courrier de rectification
  en.a2.unit36.lesson04.correction_dialogue:
