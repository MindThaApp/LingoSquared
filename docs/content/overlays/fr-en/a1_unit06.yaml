  en.a1.unit06.lesson04.teach.q_family:
    title: Leila fragt nach der Familie
    gloss: 'Leila : Est-ce votre famille ?'
    note: '*Is this your family?* demande si la photo montre sa propre famille.'
  en.a1.unit06.lesson04.teach.a_parents:
    title: Antwort über die Eltern
    gloss: 'Daniel : Oui. Voici ma mère et voici mon père.'
    note: Une réponse complète présente les deux parents l’un après l’autre.
  en.a1.unit06.lesson04.teach.q_who:
    title: Nach einer Person fragen
    gloss: 'Leila : Qui est-ce ?'
    note: '*Who is this?* demande qui est la personne montrée.'
  en.a1.unit06.lesson04.teach.a_sister_teacher:
    title: Antwort über die Schwester
    gloss: 'Daniel : C’est ma sœur. Elle est enseignante.'
    note: '*She’s a teacher.* indique la profession.'
  en.a1.unit06.lesson04.teach.q_brothers:
    title: Nach Brüdern fragen
    gloss: 'Leila : Avez-vous des frères ?'
    note: '*Do you have any brothers?* demande précisément s’il y a des frères, et pas de façon générale des frères et sœurs.'
  en.a1.unit06.lesson04.teach.a_no_one_sister:
    title: Antwort über Geschwister
    gloss: 'Daniel : Non, je n’en ai pas. Je n’ai qu’une sœur.'
    note: '*I just have one sister.* précise la réponse précédente.'
