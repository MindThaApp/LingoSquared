  en.a1.unit06.lesson02.teach.cousin:
    title: cousin
    gloss: cousin / cousine
    note: L’anglais n’a qu’UN seul mot, *cousin*, pour les deux genres, alors que le français distingue cousin (masculin) et cousine (féminin).
    example_gloss: C’est mon cousin / ma cousine.
  en.a1.unit06.lesson02.teach.my_mother:
    title: my mother
    gloss: ma mère
    note: '*my* correspond à mon / ma / mes ; ici ma, car « mère » est féminin.'
  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: ton père / votre père
    note: '*your* correspond à ton / ta / tes (quand on tutoie) ou à votre / vos (quand on vouvoie) ; le choix dépend de la personne à qui l’on parle. En français, la forme du possessif s’accorde en plus avec le nom qui suit : ici ton / votre, car « père » est masculin singulier (pour « mère », ce serait ta / votre). L’anglais *your* ne change jamais.'
  en.a1.unit06.lesson02.teach.his_sister:
    title: his sister
    gloss: sa sœur
    note: '*his* correspond à son / sa / ses ; ici sa, car « sœur » est féminin, bien que le possesseur soit un homme.'
  en.a1.unit06.lesson02.teach.her_brother:
    title: her brother
    gloss: son frère
    note: '*her* correspond à son / sa / ses ; ici son, car « frère » est masculin.'
  en.a1.unit06.lesson03.teach.this_is_my_sister:
    title: This is my sister.
    gloss: C’est ma sœur.
    note: '*This is my sister.* présente une personne sur une photo.'
  en.a1.unit06.lesson03.teach.she_is_20:
    title: She's twenty years old.
    gloss: Elle a vingt ans.
    note: '*She’s twenty years old.* donne l’âge.'
  en.a1.unit06.lesson03.teach.i_have_two_brothers:
    title: I have two brothers.
    gloss: J’ai deux frères.
    note: '*brothers* est le pluriel de *brother*.'
  en.a1.unit06.lesson03.teach.do_you_have_siblings:
    title: Do you have any siblings?
    gloss: As-tu des frères et sœurs ? / Avez-vous des frères et sœurs ?
    note: '*Do you have any siblings?* demande de façon générale si la personne a des frères et sœurs.'
  en.a1.unit06.lesson03.teach.no_i_dont:
    title: No, I don't. I'm an only child.
    gloss: Non, je n’en ai pas. Je suis enfant unique.
