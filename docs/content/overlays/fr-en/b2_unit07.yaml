course:
  title: Anglais B2
  description: Apprendre l’anglais au niveau B2 pour des conversations nuancées, des arguments, des hypothèses et des discussions professionnelles, avec des explications en français courant.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Conditions, refus et concessions
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Lecture : qu’est-ce qui a été convenu ?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: clause, élément d’un accord
    note: '*term* désigne un élément d’un accord. Ici, il ne s’agit ni d’un « terme » au sens de mot, ni d’un trimestre scolaire.'
    example_gloss: Une clause est un élément d’un accord.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: proposition, offre
    note: '*proposal* est une proposition de conditions possibles.'
    example_gloss: Une proposition suggère des clauses possibles.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: refus, rejet
    note: '*refusal* dit qu’une clause n’est pas acceptable. En anglais, un refus net sonne souvent mieux avec une raison.'
    example_gloss: Un refus dit qu’une clause n’est pas acceptable.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: fait de céder sur un point
    note: '*concession* signifie que tu abandonnes une partie de ta position pour rendre un accord possible.'
    example_gloss: Céder sur un point, c’est abandonner une partie de sa position.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: étendue du travail
    note: '*scope* est la quantité de travail incluse. Dans une négociation, tu peux mettre en balance le délai et le *scope*.'
    example_gloss: L’étendue du travail est la quantité de travail incluse.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: exigence préalable
    note: '*condition* est ce qui doit être rempli avant que l’accord prenne effet.'
    example_gloss: Une exigence préalable doit être remplie avant que l’accord prenne effet.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Céder sous condition
    gloss: Je peux accepter l’échéance plus proche à condition que le périmètre soit réduit.
    note: '*I can agree... on condition that...* est clair mais professionnel. Il ne s’adoucit pas en devenant vague.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Refuser clairement
    gloss: Je ne peux pas accepter mardi comme échéance avec le périmètre complet.
    note: '*I cannot agree to...* sonne plus professionnel qu’un refus brut du type *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Accepter avec if
    gloss: Je peux l’accepter si l’annexe complète suit la semaine prochaine.
    note: '*I can accept that if...* rend la condition explicite.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Refuser tout en continuant à négocier
    gloss: Utilise I cannot agree pour poser clairement une limite. Utilise I can agree on condition that pour proposer une concession sous condition.
    note: Une franchise trop directe peut sembler dure en anglais. Donne la limite, la raison et la condition.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: synthèse destinée à la direction
    note: '*executive summary* est le court résumé des points principaux d’un rapport.'
    example_gloss: Une synthèse destinée à la direction donne les points principaux d’un rapport.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: graphiques, diagrammes
    note: '*charts* présentent l’information visuellement.'
    example_gloss: Les graphiques présentent l’information visuellement.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Texte à lire : conditions révisées'
    gloss: 'Priya a d’abord proposé jeudi pour le rapport complet. Marcus a répliqué parce que le client avait besoin de quelque chose plus tôt. Priya a refusé mardi avec le périmètre complet parce que cela risquait de nuire à la qualité. Elle a ensuite proposé une concession sous condition : mardi était possible si le périmètre était réduit à la synthèse et aux graphiques. Marcus a accepté cette condition, mais a ajouté une clause : l’annexe complète devait suivre la semaine suivante. Le résultat convenu était mardi pour la synthèse et les graphiques, et la semaine suivante pour l’annexe.'
    note: 'La négociation est ferme mais professionnelle : refus, raison, condition et accord.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya fait une proposition
    gloss: 'Priya dit : Nous pouvons livrer le rapport jeudi si le périmètre reste tel que prévu.'
    note: Elle lie tout de suite l’échéance au périmètre.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus répond
    gloss: 'Marcus dit : Jeudi, c’est trop tard pour le client. Tu peux le livrer mardi ?'
    note: Il demande une échéance plus proche sans changer tout de suite le périmètre.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya refuse en donnant une raison
    gloss: 'Priya dit : Je ne peux pas accepter mardi avec le périmètre complet. Cela nuirait à la qualité.'
    note: La raison rend le refus professionnel et moins brutal.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus demande les conditions
    gloss: 'Marcus dit : Qu’est-ce qui rendrait mardi possible ?'
    note: Cette question ouvre la porte à une concession sous condition.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya propose une condition
    gloss: 'Priya dit : Je peux accepter l’échéance plus proche à condition que le périmètre soit réduit à la synthèse et aux graphiques.'
    note: '*on condition that* est explicite et professionnel.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus accepte avec une condition supplémentaire
    gloss: 'Marcus dit : Je peux l’accepter si l’annexe complète suit la semaine prochaine.'
    note: Il accepte, mais fixe à quel moment le reste sera livré.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya conclut l’accord
    gloss: 'Priya dit : D’accord. Mardi pour la synthèse et les graphiques, et la semaine prochaine pour l’annexe.'
    note: '*Agreed* conclut la négociation de façon brève et claire.'
