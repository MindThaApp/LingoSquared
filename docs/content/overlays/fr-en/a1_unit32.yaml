  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: animal de compagnie
    note: '*pet* veut dire animal de compagnie ; *pets* en est le pluriel. Fais attention à *any* dans la question *Do you have any pets?* En anglais, on emploie *any* dans les questions et les phrases négatives avec un pluriel ou un nom indénombrable. En français, on dit simplement « Tu as des animaux ? », avec « des » ; en anglais, on ne peut pas omettre *any* ici.'
    example_gloss: Tu as des animaux ?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Elle s’appelle Luna.
    note: En anglais, on emploie *her*/*his* (et *she*/*he*) pour un animal dès que son sexe est connu. En français, le pronom suit plutôt le genre grammatical du nom (« un chat » → il, « une souris » → elle), même si l’animal est de l’autre sexe. *Her name is Luna* parle donc d’une femelle.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: jouer
    note: '*play* veut dire jouer.'
    example_gloss: Mon chien aime jouer.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: promener
    note: '*walk* veut dire ici promener ton animal.'
    example_gloss: Je promène mon chien tous les jours.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: gentil
    note: '*friendly* veut dire gentil, sympathique.'
    example_gloss: Sa chatte est très gentille.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: petit
    note: '*small* veut dire petit.'
    example_gloss: Le poisson est petit.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel demande : Mia, tu as des animaux ?'
    note: 'En français, la question contient « des » (« Tu as des animaux ? »), mais en anglais il faut *any* dans la question : on ne peut pas l’omettre.'
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Oui, j’ai une chatte. Elle s’appelle Luna.'
    note: '*She* et *her* pour la chatte, car son sexe (femelle) est connu. En français, le pronom suit plutôt le genre du nom (« un chat » → il) ; en anglais, on choisit d’après le sexe réel de l’animal.'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: La suite de Daniel
    gloss: 'Daniel dit : Comme c’est sympa ! Elle aime jouer ?'
    note: '*Does* est ici l’auxiliaire avec *she* (do-support), comme dans les questions sur l’apparence.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Oui, elle adore jouer à la balle. Et toi ?'
    note: '*What about you?* est une façon courte et naturelle de renvoyer la même question à l’autre personne.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : J’ai un petit poisson, mais je voudrais un chien.'
    note: '*but* relie ici deux idées opposées : il a déjà un animal, mais il en veut un autre.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Texte sur Leila et Daniel
    gloss: Leila a un chien qui s’appelle Max. Il est grand et très gentil. Elle le promène tous les matins. Daniel n’a pas de chien, mais il a un petit poisson. Le poisson n’a pas besoin d’être promené, mais Daniel aime quand même le regarder nager.
    note: '*He* pour Max, car c’est un animal mâle. Ici aussi, tu choisis *she* ou *he* d’après le sexe réel de l’animal, et non d’après le genre du nom comme en français.'
