    example_gloss: Tournez à gauche au coin de la rue.
  en.a1.unit10.lesson02.teach.how_do_i_get_to:
    title: How do I get to the bank?
    gloss: Comment est-ce que je vais à la banque ?
    note: '*How do I get to...?* demande le chemin pour aller à un endroit précis.'
  en.a1.unit10.lesson02.teach.go_straight_then_left:
    title: Go straight, then turn left at the corner.
    gloss: Allez tout droit, puis tournez à gauche au coin.
    note: '*then* relie deux consignes qui se suivent.'
  en.a1.unit10.lesson02.teach.is_it_far:
    title: Is it far?
    gloss: C’est loin ?
    note: Une courte question sur la distance.
  en.a1.unit10.lesson02.teach.two_minutes:
    title: It's just two minutes from here.
    gloss: C’est à seulement deux minutes d’ici.
    note: '*just* souligne ici que c’est tout près.'
  en.a1.unit10.lesson02.teach.cant_miss_it:
    title: You can't miss it.
    gloss: Vous ne pouvez pas le rater.
    note: '*You can’t miss it* est une expression toute faite qui assure qu’un endroit est facile à trouver.'
  en.a1.unit10.lesson03.teach.first_street:
    title: Take the first street on the left.
    gloss: Prenez la première rue à gauche.
    note: '*Take the first street* signifie « prendre la première rue », donc tourner dans la première rue.'
  en.a1.unit10.lesson03.teach.second_street:
    title: Take the second street on the right.
    gloss: Prenez la deuxième rue à droite.
    note: '*second* signifie « deuxième ».'
  en.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: 'Itinéraire jusqu’à la pharmacie : allez tout droit. Prenez la première rue à gauche. La pharmacie est sur la droite.'
    note: Les indications écrites enchaînent de courtes phrases à l’impératif, une étape après l’autre.
  en.a1.unit10.lesson04.teach.q_bank:
    title: Frage von Daniel
    gloss: 'Daniel : Excusez-moi, comment est-ce que je vais à la banque ?'
    note: Daniel aborde poliment Leila avec *Excuse me*.
  en.a1.unit10.lesson04.teach.a_route:
    title: Antwort von Leila
    gloss: 'Leila : Allez tout droit, puis tournez à gauche au coin.'
    note: Leila donne un itinéraire en deux étapes.
  en.a1.unit10.lesson04.teach.confirm_route:
    title: Nachfrage von Daniel
    gloss: 'Daniel : À gauche au coin, d’accord. C’est loin ?'
    note: Daniel répète la consigne pour s’assurer de l’avoir bien comprise.
  en.a1.unit10.lesson04.teach.a_close_cant_miss:
    title: Antwort von Leila
    gloss: 'Leila : Non, c’est à seulement deux minutes d’ici. Vous ne pouvez pas le rater.'
    note: 'Leila rassure Daniel : le trajet est court et facile à trouver.'
