teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: cours
    note: '*class* signifie « cours » (une séance où l’on apprend quelque chose).'
    example_gloss: J’ai cours tous les mardis soirs.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: formation
    note: '*course* signifie « formation » ou « cours » (une série de leçons sur un même sujet).'
    example_gloss: Il suit une formation d’informatique cette année.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: étudiant / élève
    note: '*student* signifie « étudiant » ou « élève » : une personne qui apprend à l’école ou dans un cours.'
    example_gloss: Elle est étudiante dans un établissement local de formation pour adultes.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: devoirs
    note: '*homework* signifie « devoirs » (à faire à la maison).'
    example_gloss: Je fais mes devoirs après le dîner.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: matière
    note: '*subject* signifie « matière » (un sujet qu’on étudie).'
    example_gloss: Les maths sont ma matière préférée.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: contrôle
    note: '*test* signifie « contrôle » (ou « examen », « interrogation »).'
    example_gloss: Nous avons un contrôle vendredi.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: suivre un cours
    note: '*take a class* est la combinaison anglaise habituelle pour « suivre un cours ». Même si le français dit « suivre », ne traduis pas par *follow a class* (ça sonne bizarrement en anglais) : on utilise toujours *take*.'
    example_gloss: Je suis un cours tous les mardis soirs.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: faire ses devoirs
    note: '*do homework* : le verbe est *do*, comme dans « faire ses devoirs » en français. Ne dis pas *make homework*.'
    example_gloss: Il fait ses devoirs après le dîner.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: réviser pour un contrôle
    note: '*study for a test* signifie « réviser pour un contrôle ». *For* indique ici le but (pourquoi on étudie).'
    example_gloss: Je révise pour un contrôle tous les vendredis.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: établissement local de formation pour adultes
    note: '*community college* est un établissement américain où des adultes suivent surtout des cours en plus de leur travail. Il n’existe pas d’équivalent exact en français ; on garde donc souvent le terme anglais ou on l’explique.'
    example_gloss: Elle étudie dans un établissement local de formation pour adultes.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: le soir
    note: '*in the evening* signifie « le soir ».'
    example_gloss: Mon cours a lieu le soir.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Qu’est-ce que tu étudies ?
    note: Cette question utilise le présent continu (*are you studying*) pour parler de ce qu’on fait en ce moment dans sa vie, et non le présent simple.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel demande : Tu fais quelque chose après le travail aujourd’hui ?'
    note: '*anything* signifie ici « quelque chose » ou « n’importe quoi » et s’emploie dans une question.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Réponse de Mia"
    gloss: 'Mia répond : Oui, j’ai un cours de photographie ce soir.'
    note: '*tonight* signifie « ce soir ».'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: La réaction de Daniel
    gloss: 'Daniel dit : Oh, super ! Où est-ce que tu le suis ?'
    note: '*Where do you take it?* : ici aussi, *take* va avec le fait de suivre un cours ou une formation, comme dans *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Réponse de Mia"
    gloss: 'Mia répond : À l’établissement de formation du centre-ville. C’est deux fois par semaine.'
    note: '*twice a week* : ici aussi, *a* veut dire « par ».'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: La question de Daniel
    gloss: 'Daniel demande : Comment ça se passe jusqu’ici ?'
    note: '*so far* signifie « jusqu’ici ».'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Réponse de Mia"
    gloss: 'Mia répond : Ça me plaît beaucoup. J’apprends à mieux utiliser mon appareil photo.'
    note: '*I''m learning how to ...* : présent continu pour une compétence qu’on est en train de développer.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: La dernière remarque de Daniel
    gloss: 'Daniel dit : Génial ! Peut-être que tu pourras me l’apprendre un jour.'
    note: '*sometime* signifie « un jour » ou « à l’occasion » : une indication de temps vague dans le futur.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Texte sur Daniel, Leila et Mia
    gloss: Daniel, Leila et Mia apprennent tous quelque chose de nouveau en dehors du travail. Daniel suit une formation d’informatique le lundi soir pour acquérir de nouvelles compétences pour son travail. Leila apprend l’espagnol parce qu’elle veut voyager au Mexique un jour. Mia a un cours de photographie deux fois par semaine dans l’établissement de formation pour adultes, et elle prend déjà de bien meilleures photos. Parfois, ils parlent ensemble de leurs cours à l’heure du déjeuner.
    note: '*takes a computer course* : on utilise *take*, pas *follow*, même si le français dit « suivre » ; c’est le même piège que pour *take a class*.'
