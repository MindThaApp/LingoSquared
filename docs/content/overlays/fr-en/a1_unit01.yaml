teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Bonjour
    note: '*Hello* est la salutation neutre et universelle, adaptée à presque toutes les situations.'
    example_gloss: Bonjour, Daniel !
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Salut
    note: '*Hi* est plus décontracté que *Hello*, comme salut entre amis en français.'
    example_gloss: Salut, Leila !
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Bonjour (le matin)
    note: '*Good morning* s’emploie le matin, comme bonjour en début de journée.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Bonjour (l’après-midi)
    note: '*Good afternoon* s’emploie l’après-midi. En anglais, il n’existe pas de salutation unique comme bonjour qui convienne à toute la journée.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Bonsoir
    note: '*Good evening* s’emploie le soir, comme bonsoir.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: Au revoir
    note: '*Goodbye* est la formule d’adieu neutre et universelle.'
    example_gloss: Au revoir, à demain !
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Salut (en partant)
    note: '*Bye* est plus décontracté que *Goodbye*, comme salut ou ciao en français.'
    example_gloss: Salut, à bientôt !
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: Comment allez-vous ? / Comment vas-tu ?
    note: '*How are you?* s’emploie aussi bien dans un contexte formel qu’informel. Contrairement au français, il n’y a pas de choix à faire entre tu et vous.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: Je vais bien, merci.
    note: Une réponse simple et neutre.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: Je vais bien, merci.
    note: Cela veut dire la même chose que *I’m fine, thanks* ; les deux sont aussi courants dans la vie de tous les jours.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: Pas mal, merci.
    note: 'Une réponse décontractée et un peu réservée : ni particulièrement bien, ni mal.'
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: Et vous ? / Et toi ?
    note: Pour renvoyer la question. Cela convient dans tous les registres, formels ou informels.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: Tout va bien ?
    note: '*Are you okay?* demande plutôt si quelque chose ne va pas à ce moment-là, alors que *How are you?* est une question de salutation générale.'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Enchanté(e). / Ravi(e) de faire votre connaissance.
    note: On le dit quand on rencontre quelqu’un pour la première fois.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Moi aussi, enchanté(e).
    note: La réponse qui convient à *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: À tout à l’heure.
    note: On l’emploie quand on va revoir la personne le jour même, comme à tout à l’heure en français.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: Bonne journée.
    note: Une formule d’au revoir aimable qui souhaite à la personne une bonne suite de journée.
