teaching:
  en.a1.unit18.lesson01.teach.went:
    title: went
    gloss: est allé (passé du verbe aller)
    note: '*went* est le passé irrégulier de *go*.'
    example_gloss: Je suis allé au parc hier.
  en.a1.unit18.lesson01.teach.saw:
    title: saw
    gloss: a vu (passé du verbe voir)
    note: '*saw* est le passé irrégulier de *see*.'
    example_gloss: J’ai vu mon ami hier.
  en.a1.unit18.lesson01.teach.ate:
    title: ate
    gloss: a mangé (passé du verbe manger)
    note: '*ate* est le passé irrégulier de *eat*.'
    example_gloss: J’ai pris mon petit-déjeuner ce matin.
  en.a1.unit18.lesson01.teach.visited:
    title: visited
    gloss: a visité (passé du verbe visiter)
    note: '*visited* est le passé régulier de *visit* (avec *-ed*).'
    example_gloss: J’ai rendu visite à mes parents la semaine dernière.
  en.a1.unit18.lesson01.teach.worked:
    title: worked
    gloss: a travaillé (passé du verbe travailler)
    note: '*worked* est le passé régulier de *work* (avec *-ed*).'
    example_gloss: J’ai travaillé hier.
  en.a1.unit18.lesson02.teach.what_did_you_do:
    title: What did you do yesterday?
    gloss: Qu’est-ce que tu as fait hier ?
    note: On utilise *What did you do...?* pour demander ce qu’on a fait dans le passé.
  en.a1.unit18.lesson02.teach.i_worked:
    title: I worked in the morning.
    gloss: J’ai travaillé le matin.
    note: Cette réponse donne à la fois l’activité et le moment.
  en.a1.unit18.lesson02.teach.last_week:
    title: I saw a movie last week.
    gloss: J’ai vu un film la semaine dernière.
    note: '*last week* veut dire « la semaine dernière ».'
  en.a1.unit18.lesson03.teach.together:
    title: together
    gloss: ensemble
    note: '*together* veut dire « ensemble ».'
    example_gloss: Nous avons regardé un film ensemble.
  en.a1.unit18.lesson03.teach.event_text:
    title: Un texte sur un événement
    gloss: Hier, j’ai rendu visite à mes parents. Nous avons dîné ensemble et regardé un film.
    note: Voici une courte description d’un événement récent.
  en.a1.unit18.lesson03.teach.the_writers_parents:
    title: the writer's parents
    gloss: les parents de l’auteur
    note: '*writer''s* veut dire « de l’auteur » : *''s* marque la possession.'
  en.a1.unit18.lesson04.teach.it_was_great:
    title: It was great.
    gloss: C’était génial.
    note: '*It was great* veut dire qu’on a vécu un très bon moment.'
  en.a1.unit18.lesson04.teach.q_last_weekend:
    title: Demander ce qu’il a fait le week-end dernier
    gloss: Leila demande à Daniel ce qu’il a fait le week-end dernier.
    note: '*last weekend* veut dire « le week-end dernier ».'
  en.a1.unit18.lesson04.teach.a_visited_parents:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : J’ai rendu visite à mes parents.'
    note: La réponse décrit un événement simple du passé.
  en.a1.unit18.lesson04.teach.q_good_time:
    title: Demander si c’était bien
    gloss: 'Leila demande : Tu t’es bien amusé ?'
    note: Avec *Did you have a good time?*, on demande à quelqu’un s’il s’est bien amusé.
  en.a1.unit18.lesson04.teach.a_yes_great:
    title: La réponse complète de Daniel
    gloss: 'Daniel dit : Oui, nous avons dîné ensemble et regardé un film. C’était génial.'
    note: Daniel dit ce qu’ils ont fait ensemble, puis ce qu’il en a pensé.
  en.a1.unit18.lesson04.teach.his_parents:
    title: his parents
    gloss: ses parents
    note: '*his* est l’adjectif possessif qui correspond à *he* : « son », « sa », « ses », comme dans « ses parents ».'
