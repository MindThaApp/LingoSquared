teaching:
  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Tu veux voir un film ce week-end ?
    note: Avec *Do you want to...?*, tu proposes une activité. Après *to*, le verbe est à l’infinitif, sans aucune terminaison.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Ça te dirait d’aller faire une promenade ?
    note: '*Would you like to...?* est une variante un peu plus polie de *Do you want to...?* Elle correspond à « Ça te dirait de… ? » ou « Aimerais-tu… ? ».'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Bien sûr, avec plaisir !
    note: Avec *I'd love to*, tu acceptes avec enthousiasme. *I'd* est la forme abrégée de *I would* ; après *to*, on omet le verbe, car il figure déjà dans la question.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Désolé, je ne peux pas. Je suis occupé samedi.
    note: Avec cette phrase, tu refuses et tu donnes la raison. *can't* est la forme abrégée de *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Peut-être une autre fois ?
    note: Tu montres ainsi que tu viendrais volontiers une autre fois.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: déjeuner
    note: '*have lunch* signifie déjeuner. Comme pour les autres repas, il n’y a pas d’article.'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: Texte de l’invitation
    gloss: Salut ! Tu veux déjeuner vendredi ? Qu’est-ce que tu dirais de 13 h au café ?
    note: C’est une invitation à déjeuner.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: Dimanche me convient.
    note: '*works for me* signifie que quelque chose te convient bien.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: Question sur le film
    gloss: Daniel demande s’ils vont voir un film ce week-end
    note: C’est la même question que dans la première leçon.
  en.a1.unit17.lesson04.teach.a_love_to_what_day:
    title: Accepter et demander le jour
    gloss: 'Leila dit : Bien sûr, avec plaisir ! Quel jour ?'
    note: Leila accepte d’abord, puis demande le jour.
  en.a1.unit17.lesson04.teach.q_saturday:
    title: Proposer samedi
    gloss: 'Daniel dit : Et si on disait samedi ?'
    note: Avec *How about...?*, tu proposes un moment précis.
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: Refuser et proposer dimanche
    gloss: 'Leila dit : Désolée, je ne peux pas. Je suis occupée samedi. Et dimanche ?'
    note: Leila refuse samedi et propose dimanche.
  en.a1.unit17.lesson04.teach.a_sunday_works:
    title: D’accord pour dimanche
    gloss: 'Daniel dit : Dimanche me convient.'
    note: 'Daniel est d’accord pour dimanche : le projet est donc fixé.'
