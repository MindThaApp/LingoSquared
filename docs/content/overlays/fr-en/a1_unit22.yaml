teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: mal de tête
    note: '*headache* signifie mal de tête. En français, on dit « j’ai mal à la tête » (avec le verbe *avoir mal*) ; en anglais, on dit *I have a headache*, avec *have* et l’article *a*.'
    example_gloss: J’ai mal à la tête.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: mal au ventre
    note: '*stomachache* signifie mal au ventre ou mal à l’estomac. Ici aussi : singulier avec article (*a stomachache*).'
    example_gloss: J’ai mal au ventre.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: fièvre
    note: '*fever* signifie fièvre. On dit *have a fever*, pas *have fever* : en anglais, il y a un article.'
    example_gloss: Je crois que j’ai de la fièvre.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: toux
    note: '*cough* signifie toux. Le mot est à la fois nom et verbe : *a cough* (la toux), *to cough* (tousser).'
    example_gloss: Daniel tousse beaucoup.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: mal de gorge
    note: '*sore throat* signifie mal de gorge. *sore* veut dire « douloureux » ; ici aussi il y a un article : *a sore throat*.'
    example_gloss: J’ai mal à la gorge.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Qu’est-ce qui ne va pas ?
    note: Avec *What's wrong?*, tu demandes quel est le problème. *What's* est la forme abrégée de *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: J’ai mal à la tête.
    note: Avec *I have a...*, tu nommes un mal. C’est littéralement « j’ai un... » ; en français, on dit aussi « j’ai mal à… », mais en anglais on emploie *have*.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: J’ai chaud.
    note: 'Avec *I feel...*, tu dis comment tu te sens physiquement. *I feel hot* signifie littéralement « je me sens chaud », mais veut dire « j’ai chaud ». En anglais, on n’emploie pas *have* pour la chaleur : on ne dit pas *I have hot*.'
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: se reposer
    note: '*rest* signifie se reposer.'
    example_gloss: J’ai besoin de me reposer.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Texte sur des maux
    gloss: J’ai mal à la tête et à la gorge. Je crois que j’ai aussi de la fièvre. J’ai besoin de me reposer.
    note: Dans ce court texte, une personne décrit plusieurs maux à la fois.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Tu devrais aller chez le médecin.
    note: 'Avec *You should...*, tu donnes un conseil simple : « tu devrais... ». Après *should*, le verbe est sans *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Demander ce qui ne va pas
    gloss: 'Leila dit : Tu n’as pas bonne mine. Qu’est-ce qui ne va pas ?'
    note: '*You don''t look well* signifie : Tu n’as pas bonne mine.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Réponse de Daniel
    gloss: 'Daniel dit : J’ai mal à la tête et à la gorge.'
    note: Daniel cite deux maux ensemble.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Demander s’il y a de la fièvre
    gloss: 'Leila demande : Tu as de la fièvre ?'
    note: Avec *Do you have a fever?*, tu demandes si quelqu’un a un mal précis.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Réponse de Daniel
    gloss: 'Daniel dit : Je ne suis pas sûr, mais j’ai chaud.'
    note: Daniel n’est pas sûr, mais il dit comment il se sent.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Conseil de Leila
    gloss: 'Leila dit : Tu devrais te reposer et boire de l’eau. Si ça ne va pas mieux, tu devrais aller chez le médecin.'
    note: Leila donne d’abord un conseil simple, puis dit quand Daniel devrait aller chez le médecin.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Dernière réponse de Daniel
    gloss: 'Daniel dit : D’accord, merci. Je me reposerai aujourd’hui.'
    note: Daniel accepte le conseil et dit ce qu’il fera aujourd’hui.
