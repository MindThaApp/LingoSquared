teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: responsable de
    note: '*responsible for* signifie que c’est à toi de t’occuper de quelque chose.'
    example_gloss: Je suis responsable du rapport mensuel.
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: point d’avancement, informations à jour
    note: '*update* désigne de nouvelles informations sur l’avancement de quelque chose.'
    example_gloss: Je fais un point chaque semaine à mon équipe.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: échéance, date limite
    note: '*deadline* désigne la date à laquelle quelque chose doit être terminé.'
    example_gloss: L’échéance du rapport est vendredi.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: rapport
    note: '*report* désigne un document écrit sur un travail ou des résultats.'
    example_gloss: J’écris un rapport de ventes chaque mois.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: dans les temps
    note: '*on schedule* signifie que les choses se déroulent comme prévu, sans retard.'
    example_gloss: Le projet avance dans les temps.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: en retard sur le planning
    note: '*behind schedule* signifie que les choses avancent plus lentement que prévu.'
    example_gloss: Nous avons un peu de retard cette semaine.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: Je suis responsable du rapport mensuel.
    note: '*I’m responsible for...* est une façon directe de décrire une tâche au travail.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: Le projet avance dans les temps.
    note: '*on schedule* signifie qu’il n’y a pas de retard.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: J’ai un peu de retard, mais j’aurai terminé d’ici vendredi.
    note: '*I’m a little behind schedule, but I’ll finish by...* est une façon honnête de signaler un retard tout en donnant une date précise.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: Je suis responsable du rapport. Le projet avance dans les temps. J’ai du retard.
    note: Ces trois phrases sont des formules courantes pour parler des responsabilités et de l’avancement au travail.
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: équipe
    note: '*team* désigne un groupe de personnes qui travaillent ensemble.'
    example_gloss: Il fait un petit point à son équipe chaque semaine.
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: problème technique
    note: '*technical problem* désigne un problème lié à un appareil ou à un logiciel.'
    example_gloss: Il a du retard à cause d’un problème technique.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: Daniel est responsable du rapport mensuel des ventes. Chaque semaine, il fait un court point à son équipe. Cette semaine, il a un peu de retard à cause d’un problème technique, mais il pense avoir terminé d’ici vendredi. Il dit toujours la vérité à son équipe sur les retards.
    note: Un court texte qui montre comment Daniel parle honnêtement d’un retard.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: 'Daniel dit : Mia, pourrais-tu m’aider à relire ce rapport avant que je l’envoie ?'
    note: '*could you help me...* est une façon polie de demander de l’aide à un collègue.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: 'Mia dit : Bien sûr. De quoi as-tu besoin ?'
    note: '*of course* est une façon aimable et directe de dire oui.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: 'Daniel dit : Je veux m’assurer que les chiffres sont corrects.'
    note: '*make sure* signifie vérifier que quelque chose est correct.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: 'Mia dit : Pas de problème. Je le regarde cet après-midi et je t’envoie mes remarques.'
    note: '*I’ll check it this afternoon* est une promesse concrète avec un moment précis.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel dit : Merci, je t’en suis vraiment reconnaissant.'
    note: '*I really appreciate it* est une façon sincère d’exprimer sa reconnaissance.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: 'Mia dit : Avec plaisir. Dis-moi si tu as besoin d’autre chose.'
    note: '*let me know if...* laisse la porte ouverte à une aide supplémentaire.'
