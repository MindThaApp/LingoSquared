teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: être d’accord
    note: '*agree* signifie penser que quelqu’un d’autre a raison.'
    example_gloss: Je suis d’accord avec toi.
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: ne pas être d’accord
    note: '*disagree* signifie penser que quelqu’un d’autre a tort.'
    example_gloss: Je ne suis pas d’accord avec cet avis.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: opinion, avis
    note: '*opinion* désigne ce que l’on pense personnellement de quelque chose.'
    example_gloss: Chacun a un avis différent.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: croire, penser
    note: '*believe* signifie penser que quelque chose est vrai.'
    example_gloss: Je crois que c’est une bonne idée.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: raison
    note: '*reason* désigne l’explication qui se trouve derrière une opinion.'
    example_gloss: Pour quelle raison penses-tu cela ?
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: gagner du temps
    note: '*save time* signifie avoir besoin de moins de temps pour faire quelque chose.'
    example_gloss: Le télétravail m’aide à gagner du temps.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: Zustimmen und einen Grund nennen
    gloss: Je suis d’accord pour dire que travailler à la maison est mieux, parce qu’on gagne du temps.
    note: '*I agree that... because...* relie une opinion à une raison.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Widersprechen und einen Grund nennen
    gloss: Je ne suis pas d’accord pour dire que c’est mieux, parce que les collègues nous manquent.
    note: '*I disagree that... because...* relie une opinion contraire à une raison.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Je suis d’accord pour dire que c’est mieux. Je ne suis pas d’accord pour dire que c’est mieux.
    note: Après *agree*/*disagree*, *that* introduit la proposition qui énonce l’opinion à laquelle on adhère ou non. En anglais, il n’y a pas de virgule avant *that*.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: se concentrer
    note: '*focus* signifie porter son attention sur quelque chose.'
    example_gloss: Elle se concentre plus facilement à la maison.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: respecter
    note: '*respect* signifie tenir compte de l’opinion de l’autre, même si l’on n’est pas d’accord.'
    example_gloss: Ils respectent l’opinion de l’autre.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: zwei Meinungen'
    gloss: Mia pense que travailler à la maison est mieux, parce qu’elle s’y concentre plus facilement. Leila n’est pas d’accord. Elle croit qu’il vaut mieux aller au bureau, parce qu’elle aime voir ses collègues tous les jours. Ils ne sont pas du même avis, mais ils respectent l’opinion de l’autre.
    note: Un court texte avec deux opinions opposées.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel eröffnet die Debatte
    gloss: 'Daniel dit : Tu penses que travailler à la maison est mieux que travailler au bureau ?'
    note: Une question ouverte pour lancer un désaccord.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila sieht das anders
    gloss: 'Leila dit : Je ne suis pas d’accord pour dire que c’est mieux. Je pense qu’on rate des conversations importantes avec les collègues.'
    note: Leila donne son opinion et une raison.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung
    gloss: 'Daniel dit : Ce n’est pas faux, mais je suis d’accord pour dire que ça fait gagner beaucoup de temps.'
    note: '*that’s a fair point* reconnaît l’opinion de l’autre avant d’exprimer la sienne.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe
    gloss: 'Leila dit : Je suis d’accord pour dire que ça fait gagner du temps, mais je préfère quand même le bureau.'
    note: Leila concède un point sans changer son opinion générale.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel beendet das Gespräch
    gloss: 'Daniel dit : Je comprends. Chacun a un avis différent.'
    note: Une façon naturelle et aimable de conclure un désaccord.
