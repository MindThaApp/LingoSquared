teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: quartier
    note: '*neighborhood* signifie « quartier » : la zone autour de chez toi, avec les rues et les bâtiments proches.'
    example_gloss: J’adore mon quartier.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: voisin / voisine
    note: '*neighbor* signifie « voisin » : une personne qui habite à côté de chez toi ou près de chez toi.'
    example_gloss: Mon voisin est très serviable.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: près d’ici / à proximité
    note: '*nearby* signifie « à proximité », pas loin.'
    example_gloss: Il y a un parc près d’ici.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: calme / tranquille
    note: '*quiet* signifie « calme », sans beaucoup de bruit.'
    example_gloss: Ma rue est très calme la nuit.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: bruyant
    note: '*noisy* signifie « bruyant », plein de bruits forts.'
    example_gloss: La rue à côté de la mienne est bruyante.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: sympathique / aimable
    note: '*friendly* signifie « sympathique », aimable avec les autres.'
    example_gloss: Mes voisins sont très sympathiques.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: habiter dans un quartier
    note: '*live in a neighborhood* signifie « habiter dans un quartier ».'
    example_gloss: J’habite dans un quartier calme.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: bien s’entendre avec ses voisins
    note: '*get along with your neighbors* signifie avoir de bons rapports, aimables, avec les gens qui habitent près de chez toi.'
    example_gloss: Je m’entends bien avec mes voisins.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: près de
    note: '*close to* signifie « près de » (un lieu).'
    example_gloss: Mon appartement est près d’un supermarché.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: cinq minutes à pied
    note: '*a five-minute walk* est un schéma anglais fixe (nombre + nom, avec un trait d’union, et *walk* reste au singulier) -- le français dit plutôt « à cinq minutes à pied », sans trait d’union et avec « minutes » au pluriel.'
    example_gloss: Le parc est à cinq minutes à pied de chez moi.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: dire bonjour à
    note: '*say hello to* signifie « dire bonjour à » quelqu’un.'
    example_gloss: Je dis toujours bonjour à mon voisin le matin.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Comment est ton quartier ?
    note: '*What''s ... like?* demande une description, pas une préférence.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: La question de Leila
    gloss: 'Leila dit : Je vais peut-être bientôt déménager. Comment est ton quartier, Mia ?'
    note: '*might* + verbe exprime une possibilité -- peut-être que oui, peut-être que non.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Je l’aime vraiment bien. C’est calme, et il y a un parc près d’ici.'
    note: '*there''s a park nearby* signifie « il y a un parc à proximité ».'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: La question de Leila
    gloss: 'Leila dit : Ça a l’air sympa. C’est près d’un supermarché ?'
    note: '*That sounds nice* est une réaction naturelle à une bonne nouvelle.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Oui, il y en a un à seulement cinq minutes à pied de mon immeuble.'
    note: '*just* signifie ici « seulement » -- il souligne que la distance est courte.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: La question de Leila
    gloss: 'Leila demande : Et tes voisins ? Ils sont sympathiques ?'
    note: '*What about ...?* est une façon naturelle d’aborder un nouveau sujet.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Très sympathiques ! Mon voisin, M. Lopez, arrose mes plantes quand je suis absente.'
    note: '*waters my plants* signifie « arrose mes plantes » -- en anglais, *water* est ici un verbe.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: La réaction de Leila
    gloss: 'Leila dit : C’est adorable. Je crois que j’aimerais habiter près de chez toi !'
    note: '*I''d like to* + verbe signifie « j’aimerais » + verbe.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Texte sur trois quartiers
    gloss: Daniel, Leila et Mia habitent tous les trois dans un quartier différent. Le quartier de Daniel est animé, avec des restaurants et des commerces près de son immeuble. Il connaît plusieurs de ses voisins et leur dit souvent bonjour dans le couloir. Leila habite dans un quartier calme, près de la piscine où elle nage. Sa voisine d’en face a un gros chien qui aboie beaucoup. Le quartier de Mia est calme lui aussi, avec un supermarché à cinq minutes à pied de son immeuble. Son voisin, M. Lopez, est très sympathique et arrose ses plantes quand elle est absente. Après avoir parlé avec Mia, Leila a décidé de chercher un appartement près d’elle.
    note: '*decided she wants to look for* signifie « a décidé qu’elle voulait chercher ».'
