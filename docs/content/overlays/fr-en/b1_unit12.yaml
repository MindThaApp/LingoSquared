teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: bien que
    note: '*although* introduit une opposition dans la même phrase, avec une proposition complète.'
    example_gloss: Bien que le bureau soit calme, Mia préfère travailler à la maison.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: même si, bien que
    note: '*even though* insiste davantage sur l’opposition que *although*.'
    example_gloss: Leila reste concentrée même si son appartement est petit.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: malgré
    note: Après *despite*, on met un nom ou une forme en -ing, jamais une proposition complète.
    example_gloss: Malgré les distractions, Daniel termine son rapport à temps.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: cependant, pourtant
    note: '*however* commence une nouvelle phrase après un point ou un point-virgule.'
    example_gloss: Le bureau est calme. Pourtant, Mia préfère travailler à la maison.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: argument valable, bon argument
    note: '*valid point* désigne un argument raisonnable ou convaincant.'
    example_gloss: C’est un argument valable en ce qui concerne la concentration.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: convaincre
    note: '*convince* signifie amener quelqu’un à croire ou à accepter quelque chose.'
    example_gloss: Leila a essayé de convaincre Mia de revenir au bureau.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: Bien que le bureau soit calme, Mia préfère travailler à la maison.
    note: '*although* + sujet + verbe forme une proposition complète exprimant l’opposition.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: Malgré les distractions, Daniel termine son rapport à temps.
    note: Après *despite* vient un nom, pas une proposition complète.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: 'Although et even though introduisent une proposition complète : Although the office is quiet, Mia prefers home. Despite est suivi d’un nom ou d’une forme en -ing, pas d’une proposition : Despite the distractions, Daniel finishes his report. However commence une nouvelle phrase après un point ou un point-virgule : The office is quiet. However, Mia prefers home.'
    note: 'Forme : *although/even though* + proposition ; *despite* + nom/forme en -ing ; *however* comme adverbe de phrase après un point.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: flexibilité
    note: '*flexibility* désigne la capacité à changer facilement de plans ou de façon de travailler.'
    example_gloss: Mia et Leila s’accordent toutes les deux à dire que la flexibilité est importante.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: travail d’équipe
    note: '*teamwork* signifie travailler ensemble en équipe.'
    example_gloss: Leila pense que le bureau favorise un meilleur travail d’équipe.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: Mia et Leila ne sont pas d’accord sur le lieu de travail. Mia travaille à la maison parce que c’est confortable. Bien qu’elle regrette de ne plus voir ses collègues, elle avance davantage chez elle. Leila préfère le bureau. Malgré le bruit, elle aime discuter avec ses collègues pendant les pauses. Même si Mia a raison sur la concentration, Leila pense toujours que le bureau favorise un meilleur travail d’équipe. Pourtant, toutes les deux s’accordent à dire que la flexibilité est importante.
    note: Un court texte sur des oppositions.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: 'Mia dit : Leila, bien que le bureau soit agréable, j’avance davantage à la maison.'
    note: '*although* + proposition complète en début de phrase.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: 'Leila dit : Je comprends, mais malgré le bruit, j’aime vraiment discuter avec les gens pendant les pauses.'
    note: '*despite* + nom (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: 'Mia dit : C’est un argument valable. Pourtant, je pense toujours me concentrer mieux seule.'
    note: '*however* commence ici une nouvelle phrase après un point.'
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: 'Leila dit : Même si je préfère le bureau, je ne peux pas te convaincre de changer d’avis, n’est-ce pas ?'
    note: '*even though* insiste sur l’opposition.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: 'Mia dit : Probablement pas ! Cependant, nous pouvons convenir que la flexibilité compte le plus.'
    note: '*however* relie deux idées opposées en commençant une nouvelle phrase.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: 'Leila dit : Malgré nos préférences différentes, nous finissons tout à temps.'
    note: '*despite* + nom (*our different preferences*).'
