  en.b1.unit12.lesson01.concession_vocabulary:
    title: 'Oppositions : although, despite, however'
  en.b1.unit12.lesson02.concession_clauses:
    title: 'Although et despite : proposition ou groupe nominal'
  en.b1.unit12.lesson03.reading_where_to_work:
