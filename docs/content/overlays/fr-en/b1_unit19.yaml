teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: point principal, idée essentielle
    note: '*main point* désigne l''idée la plus importante d''un texte ou d''une conversation.'
    example_gloss: Le point principal de la réunion était le budget.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: détail
    note: '*detail* désigne une petite information supplémentaire qui vient appuyer le point principal.'
    example_gloss: Mia a ajouté un petit détail sur le calendrier.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: en résumé
    note: '*in summary* introduit, à la fin d''une longue explication, un résumé condensé.'
    example_gloss: En résumé, le projet sera terminé le mois prochain.
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: bref, en deux mots
    note: '*in short* est une façon rapide et familière d''aller droit au but dans une conversation.'
    example_gloss: Bref, l'équipe s'est mise d'accord sur le plan.
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: avec tes propres mots
    note: '*in your own words* demande une explication qui ne reprend pas simplement le texte d''origine.'
    example_gloss: Explique le plan avec tes propres mots.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (faire un résumé)
    gloss: En résumé, la réunion a porté sur le budget et le nouveau client.
    note: '*In summary, the meeting covered...* ouvre un résumé court et condensé de ce qui a été abordé.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (indiquer le point principal)
    gloss: Le point principal, c'est que nous sommes en dessous du budget ce mois-ci.
    note: '*The main point was that...* énonce l''idée la plus importante, à part des détails secondaires.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: La structure d'un résumé
    gloss: Commence un résumé par une expression comme In summary ou In short, puis donne seulement les points principaux dans l'ordre, en gardant des phrases courtes. Utilise The main point was that... pour mettre en avant l'unique idée la plus importante, à part des détails secondaires.
    note: 'Forme : commence par In summary/In short et utilise The main point was that... pour le point principal.'
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: condensé, abrégé
    note: '*condensed* décrit un résumé raccourci qui garde les points principaux.'
    example_gloss: Mia a fait à Daniel un résumé condensé de la réunion.
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: article d'origine, article original
    note: '*original article* désigne le texte complet d''origine, avant qu''il soit résumé.'
    example_gloss: Le résumé de Leila suivait de près l'article d'origine.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Texte : résumer un court article'
    gloss: 'Leila a lu un long article sur la communication en milieu professionnel pour son cours de design. L''article d''origine contenait beaucoup d''exemples et d''informations de contexte, mais Leila n''avait besoin que des points principaux. Avec ses propres mots, elle a rédigé un résumé condensé : la communication au travail fonctionne mieux quand les messages sont clairs et courts, et quand on pose des questions au lieu de deviner. Elle a laissé de côté la plupart des exemples, car c''étaient des détails et non des points principaux. Son professeur a dit que le résumé avait gardé les idées importantes dans le bon ordre.'
    note: Un court texte à lire.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel demande une explication
    gloss: 'Daniel dit : J''ai raté la réunion. Tu peux me dire ce qui s''est passé ?'
    note: Une question ouverte pour demander un résumé.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia fait un bref résumé
    gloss: 'Mia dit : Bien sûr. En deux mots, on a parlé du budget et du nouveau client.'
    note: '*in short* ouvre un résumé rapide et familier.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel demande le point principal
    gloss: 'Daniel dit : Quel était le point principal sur le budget ?'
    note: Une question ciblée sur le point principal.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia indique le point principal
    gloss: 'Mia dit : Le point principal, c''est que nous sommes en dessous du budget ce mois-ci.'
    note: '*the main point was that...* met en avant l''idée la plus importante.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel demande des détails
    gloss: 'Daniel dit : Bien. Y avait-il d''autres détails ?'
    note: Une question de suivi sur des détails secondaires.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia mentionne un petit détail
    gloss: 'Mia dit : Juste un petit détail : la réunion avec le client a été décalée à la semaine prochaine.'
    note: '*just one small detail* introduit un petit fait complémentaire.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Daniel remercie Mia
    gloss: 'Daniel dit : Merci pour le résumé. C''est très utile.'
    note: Une conclusion brève et reconnaissante pour la conversation.
