course:
  title: Anglais B1
  description: 'Apprends l’anglais au niveau B1 : obligations, possibilités, situations hypothétiques et récits du quotidien, avec des explications détaillées en français.'
units:
  en.b1.unit01.necessity:
    title: Ce que je dois faire ou devrais faire
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to et should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don’t have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: devoir (obligation personnelle forte)
    note: '*must* exprime une obligation personnelle forte : quelque chose que tu juges toi-même très important.'
    example_gloss: Je dois terminer cette tâche aujourd’hui.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: devoir (obligation venant de l’extérieur)
    note: '*have to* exprime une obligation qui vient de l’extérieur, par exemple d’une règle ou d’une échéance.'
    example_gloss: Je dois payer le loyer d’ici vendredi.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: je devrais / tu devrais
    note: '*should* exprime un conseil, pas une obligation stricte.'
    example_gloss: Tu devrais appeler le dentiste bientôt.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: tâche
    note: '*task* désigne une tâche ou un travail qui doit être fait.'
    example_gloss: J’ai encore une tâche à terminer.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: loyer
    note: '*rent* désigne l’argent que l’on paie pour se loger.'
    example_gloss: Le loyer est à payer vendredi.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: rendez-vous
    note: '*appointment* désigne un rendez-vous fixé avec quelqu’un, par exemple chez le médecin.'
    example_gloss: J’ai un rendez-vous chez le dentiste cette semaine.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: eine starke Pflicht ausdrücken
    gloss: Je dois terminer cette tâche aujourd’hui.
    note: '*I must* exprime une obligation personnelle forte.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: eine Pflicht von außen ausdrücken
    gloss: Je dois payer le loyer d’ici vendredi.
    note: '*I have to* exprime une obligation qui vient de l’extérieur, comme une date limite de paiement.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Form bei 'she'
    gloss: Elle doit prendre rendez-vous.
    note: Avec *he/she/it*, *have to* devient *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: eine Empfehlung geben
    gloss: Tu devrais appeler et confirmer le rendez-vous.
    note: '*should* donne un conseil, pas une obligation stricte comme *must* ou *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formen von 'have to'
    gloss: Je dois partir. Elle doit partir. Nous devons partir. Ils doivent partir.
    note: Seulement avec *he/she/it*, *have* devient *has* ; avec toutes les autres personnes, on garde *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Reue über die Vergangenheit ausdrücken
    gloss: J’aurais dû appeler plus tôt.
    note: '*should have* + participe passé exprime un regret à propos de quelque chose qu’on n’a pas fait.'
    example_gloss: J’aurais dû appeler plus tôt.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: ne doit pas / il est interdit de
    note: '*must not* exprime une interdiction : quelque chose n’est absolument pas permis. Attention : *must not* ne veut pas dire « n’a pas besoin de » ; pour cela, on dit *don’t have to*.'
    example_gloss: Tu ne dois pas l’oublier encore une fois.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: n’a pas besoin de / n’est pas obligé de
    note: '*don’t have to* signifie que quelque chose n’est pas obligatoire ; c’est différent de *must not* (interdiction).'
    example_gloss: Tu n’es pas obligé de venir si tu es occupé.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Reue, Verbot und keine Pflicht
    gloss: J’aurais dû appeler. Je l’ai oublié. Tu ne dois pas l’oublier encore une fois. Tu n’es pas obligé de venir.
    note: '*should have* + participe passé exprime un regret à propos du passé. *must not* est une interdiction ; *don’t have to* signifie qu’il n’y a pas d’obligation, mais que c’est permis.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Lesetext: das Fitnessstudio'
    gloss: Hier, Daniel a oublié de renouveler son abonnement à la salle de sport. Il aurait dû programmer un rappel sur son téléphone. Maintenant, il doit payer des frais de retard. Il ne doit pas l’oublier encore le mois prochain.
    note: Un court texte sur l’erreur de Daniel et ses conséquences.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila fragt nach der Mitgliedschaft
    gloss: 'Leila dit : Daniel, as-tu renouvelé ton abonnement à la salle de sport ?'
    note: Une question directe pour vérifier si quelque chose a déjà été fait.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Daniels Antwort: vergessen'
    gloss: 'Daniel dit : Oh non, j’ai oublié ! J’aurais dû le faire la semaine dernière.'
    note: '*I should have done that* exprime un regret à propos de quelque chose qui n’a pas été fait.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila warnt Daniel
    gloss: 'Leila dit : Tu dois les appeler aujourd’hui, sinon tu paieras des frais de retard.'
    note: '*must* exprime ici un avertissement personnel urgent.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel nennt weitere Pflichten
    gloss: 'Daniel dit : Tu as raison. Je dois aussi payer le loyer d’ici vendredi, et je devrais aussi appeler le dentiste.'
    note: Daniel associe *have to* (obligation) et *should* (conseil) dans une même réponse.
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila beruhigt Daniel
    gloss: 'Leila dit : Tu n’as pas besoin de tout faire aujourd’hui. Mais tu ne dois pas oublier encore la salle de sport.'
    note: Leila oppose *don’t have to* (pas d’obligation) à *must not* (interdiction).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel fasst einen Vorsatz
    gloss: 'Daniel dit : Je sais. Je dois être mieux organisé ce mois-ci.'
    note: '*I must be* exprime ici une résolution personnelle.'
