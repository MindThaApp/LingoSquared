  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: Je voudrais acheter un billet, s’il vous plaît.
    note: '*I''d like to*, contraction de *I would like to*, est la façon polie de demander quelque chose.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: Où sont les casiers ?
    note: '*Where are...?* place le verbe avant le sujet, comme c’est le cas dans les questions anglaises ; en français, on peut aussi inverser (« Où sont... ? »).'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: À quelle heure ouvrez-vous ?
    note: '*do you open* utilise l’auxiliaire *do* pour former la question.'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: C’est cinq dollars le billet.
    note: '*for one ticket* signifie pour un billet.'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: Ai-je besoin d’un bonnet de bain ?
    note: '*Do I need...?* utilise l’auxiliaire *do* pour former la question.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Nous fermons à huit heures.
    note: '*at eight o''clock* : l’anglais emploie *at* pour une heure précise, là où le français dit « à » (à huit heures).'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Le maître-nageur les accueille
    gloss: 'Le maître-nageur dit : Bonjour ! Vous venez nager aujourd’hui ?'
    note: '*Are you here to swim today?* utilise *to swim* pour exprimer le but, comme « pour nager » en français.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Les billets de Daniel
    gloss: 'Daniel dit : Oui, deux billets, s’il vous plaît.'
    note: Une demande courte et directe de deux billets.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Le prix
    gloss: 'Le maître-nageur dit : Bien sûr ! C’est cinq dollars le billet.'
    note: 'Une information distincte : le prix d’un billet.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia pose une question sur le bonnet de bain
    gloss: 'Mia dit : Avons-nous besoin d’un bonnet de bain ?'
    note: '*Do we need...?* : là encore, l’auxiliaire *do* sert à former la question.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: La règle du bonnet de bain
    gloss: 'Le maître-nageur dit : Oui, le bonnet de bain est obligatoire dans la piscine.'
    note: '*swim caps are required* est une forme passive, une manière formelle d’énoncer une règle, souvent employée sur les panneaux des piscines et par le personnel. En français, on dit de même « est obligatoire » ou « il faut porter un bonnet de bain ».'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel demande où sont les casiers
    gloss: 'Daniel dit : Où sont les casiers ?'
    note: Une question courte, sans information nouvelle sur le prix ou l’heure.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: L’emplacement des casiers
    gloss: 'Le maître-nageur dit : Les casiers sont près de l’entrée.'
    note: 'Une information distincte : l’emplacement des casiers, différente de ce dont ils ont besoin pour fonctionner.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Ce dont les casiers ont besoin
    gloss: 'Le maître-nageur dit : Il leur faut une pièce d’un dollar.'
    note: '*a dollar coin* est formé de deux mots anglais (*dollar* + *coin*) écrits séparément. En français, on dit « une pièce d’un dollar », avec la préposition « de » ou « d’ ».'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia demande l’heure de fermeture
    gloss: 'Mia dit : À quelle heure fermez-vous ?'
    note: '*What time do you close?* utilise l’auxiliaire *do* pour former la question.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: L’heure de fermeture
    gloss: 'Le maître-nageur dit : Nous fermons à huit heures.'
    note: 'Une quatrième information distincte : l’heure de fermeture.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Texte : Une journée à la piscine'
    gloss: 'Par un chaud après-midi de juillet, Daniel et Mia ont décidé de se rafraîchir à la piscine municipale. Près de l’entrée, un panneau énumérait le règlement de la piscine : interdiction de courir, et bonnet de bain obligatoire dans le bassin. Ils ont demandé deux billets au maître-nageur. C’était cinq dollars le billet. Le maître-nageur leur a expliqué que les casiers se trouvaient près de l’entrée et qu’il fallait une pièce d’un dollar. Daniel et Mia ont rangé leurs sacs dans un casier et ont nagé pendant près de deux heures. Avant de partir, ils ont relu le panneau : la piscine ferme à huit heures. Mia a dit qu’elle voulait revenir le week-end suivant pour essayer le plongeoir.'
    note: '*required* est une forme passive : *swim caps are required* signifie que le bonnet de bain est obligatoire.'
