teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: joli / sympa / gentil
    note: '*nice* signifie joli, agréable ou gentil, selon la situation.'
    example_gloss: C’est sympa.
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: génial / super
    note: '*great* est plus fort que *nice* et signifie génial.'
    example_gloss: Tu es superbe.
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: magnifique / très joli
    note: '*lovely* sonne chaleureux et aimable.'
    example_gloss: Quel beau sourire.
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: gentil
    note: '*kind* signifie aimable et bienveillant envers quelqu’un.'
    example_gloss: C’est très gentil.
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: sourire
    note: '*smile* signifie sourire.'
    example_gloss: Quel beau sourire.
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: veste
    note: '*jacket* signifie veste.'
    example_gloss: J’aime beaucoup ta veste.
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: C’est sympa.
    note: '*That is nice* est une courte réaction positive.'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Tu es superbe.
    note: '*look* signifie ici avoir l’air, et non regarder.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: J’aime beaucoup ta veste.
    note: '*I like your...* est une façon courante de faire un compliment sur ce qui appartient à quelqu’un.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Quel beau sourire.
    note: '*What a...* sert à faire un compliment sous forme d’exclamation.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: C’est très gentil.
    note: '*very* renforce *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Merci beaucoup.
    note: '*Thank you very much* est une formule de remerciement polie et chaleureuse.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia fait un compliment"
    gloss: 'Mia dit : Salut Leila. Tu es superbe aujourd’hui.'
    note: '*You look great* est un compliment direct.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila remercie Mia
    gloss: 'Leila dit : Merci, Mia.'
    note: '*Thank you* signifie merci.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia parle de la veste verte
    gloss: 'Mia dit : J’aime beaucoup ta veste verte.'
    note: '*I like your green jacket* complimente un vêtement.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila répond gentiment
    gloss: 'Leila dit : C’est très gentil.'
    note: '*That is very kind* répond à quelque chose d’aimable que dit quelqu’un.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia parle du sourire
    gloss: 'Mia dit : Quel beau sourire tu as aussi ! Regarde, voici ma photo.'
    note: '*too* signifie ici aussi.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila complimente la photo
    gloss: 'Leila dit : Merci beaucoup. Ta photo est jolie.'
    note: '*Your photo is nice* rend un compliment.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia explique pour la photo
    gloss: 'Mia dit : Merci. Elle est pour Daniel.'
    note: '*Thanks* est plus court que *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Message gentil
    gloss: 'Message gentil : Ta veste verte est magnifique. Ta photo est jolie. Merci d’être si gentil(le).'
    note: Le message contient deux compliments et un remerciement.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Texte : Un compliment pour une amie'
    gloss: 'Un compliment pour une amie : Mia a vu Leila dans une veste verte. Mia a dit que Leila était superbe. Elle a aussi dit que Leila avait un beau sourire. Leila a remercié Mia. Puis Leila a regardé la photo de Mia et a dit qu’elle était jolie. Mia était contente parce que la photo était pour Daniel. Plus tard, Leila a écrit un court message : Ta veste verte est magnifique.'
    note: '*looked great* est le passé de *look great*.'
