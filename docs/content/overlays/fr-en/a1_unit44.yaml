    gloss: les fleurs éclosent
    note: '*flowers bloom* signifie « les fleurs éclosent ».'
    example_gloss: Les fleurs éclosent au printemps.
  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: Quelle est ta saison préférée ?
    note: '*What''s your favorite season?* demande quelle est la saison préférée de quelqu’un.'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: Ma saison préférée est l’automne.
    note: '*My favorite season is ...* est la façon habituelle d’exprimer une préférence.'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: La question de Mia
    gloss: 'Mia demande : Quelle est ta saison préférée, Leila ?'
    note: '*What''s your favorite ...?* demande la préférence de quelqu’un.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Réponse de Leila"
    gloss: 'Leila dit : L’automne. Les feuilles changent de couleur, et il fait un temps idéal pour peindre dehors.'
    note: '*great weather for painting outside* signifie « un temps idéal pour peindre dehors ».'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: La réaction de Mia
    gloss: 'Mia dit : Ça a l’air chouette. Ma saison préférée est le printemps.'
    note: '*My favorite season is spring* signifie « ma saison préférée est le printemps ».'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: La question de Leila
    gloss: 'Leila demande : Pourquoi le printemps ?'
    note: '*Why spring?* est une façon courte de demander la raison.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Les fleurs éclosent, et j’adore les prendre en photo pour mon cours de photographie.'
    note: '*I love taking photos* signifie « j’adore prendre des photos ».'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: La question de Leila
    gloss: 'Leila dit : Ça se comprend ! Il fait chaud ou froid au printemps là où tu habites ?'
    note: '*That makes sense!* est une réaction naturelle à une bonne explication.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Réponse de Mia"
    gloss: 'Mia dit : En général, il fait chaud, avec un peu de pluie. Parfait pour se promener dehors.'
    note: '*with a little rain* signifie « avec un peu de pluie ».'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Texte sur trois saisons préférées
    gloss: Daniel, Leila et Mia ont chacun une saison préférée différente. La saison préférée de Daniel est l’été. Il adore jouer au foot et faire du jogging quand il fait chaud et ensoleillé. La saison préférée de Leila est l’automne, parce qu’elle adore peindre les feuilles pendant qu’elles changent de couleur. La saison préférée de Mia est le printemps. Elle prend les fleurs en photo pour son cours de photographie. Même s’ils aiment tous des saisons différentes, ils trouvent toujours le temps de profiter ensemble du plein air.
    note: '*even though* signifie « même si », « bien que ».'
