  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: en été
    note: '*in the summer* signifie « en été ». En anglais, l’article est souvent facultatif avec les saisons : *in summer* et *in the summer* sont tous deux corrects (de même *in spring*, *in fall* et *in winter*). En français, c’est la préposition qui change selon la saison : « au printemps », « en été », « en automne », « en hiver ».'
    example_gloss: Nous allons à la plage en été.
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: les feuilles changent de couleur
