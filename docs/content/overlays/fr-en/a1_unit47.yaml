teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: rendez-vous
    note: '*appointment* signifie « rendez-vous » (chez un médecin, un coiffeur, etc.).'
    example_gloss: J’ai rendez-vous jeudi.
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: disponible / libre
    note: '*available* signifie « disponible » ou « libre ».'
    example_gloss: Es-tu disponible jeudi ?
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: réserver
    note: '*book* signifie ici « réserver », et non le nom « livre ».'
    example_gloss: Je voudrais prendre rendez-vous.
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: confirmer
    note: '*confirm* signifie « confirmer ».'
    example_gloss: Peux-tu confirmer l’heure ?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: reporter
    note: '*reschedule* signifie « reporter » ou « déplacer » un rendez-vous à un autre moment.'
    example_gloss: On peut le reporter à vendredi ?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Je voudrais prendre rendez-vous.
    note: '*I''d* est la contraction de *I would* : *I''d like to* correspond au « je voudrais » français, plus poli que *I want to*.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: Es-tu disponible vendredi ?
    note: '*on Friday* utilise toujours la préposition *on* devant un jour de la semaine ; le français n’en met pas (« vendredi »).'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: Quelle heure te convient ?
    note: '*works for you* signifie ici « te convient » -- une expression figée, pas « travailler » au sens littéral.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Cette heure me convient.
    note: '*That time works for me.* signifie « cette heure me convient ».'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: On peut le reporter à lundi ?
    note: '*reschedule for ...* utilise *for*, et non *to*, pour indiquer la nouvelle date.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Votre rendez-vous est confirmé.
    note: '*Your appointment is confirmed.* signifie « votre rendez-vous est confirmé ».'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: La question de Mia
    gloss: 'Mia demande : Leila, est-ce que Max va bien ? Il a l’air un peu fatigué ces derniers temps.'
    note: '*He seems a little tired lately.* signifie « il a l’air un peu fatigué ces derniers temps ».'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: L’explication de Leila
    gloss: 'Leila dit : Il va bien, ne t’inquiète pas. Il est simplement bon pour son bilan annuel. Je dois appeler le vétérinaire.'
    note: '*due for* signifie « être censé avoir / devoir passer » : *he''s due for a checkup* = « c’est l’heure de son bilan ».'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila appelle le vétérinaire
    gloss: 'Leila dit : Bonjour, je voudrais prendre rendez-vous pour le bilan de mon chien.'
    note: '*I''d like to* est plus poli que *I want to*, comme « je voudrais » est plus poli que « je veux » en français.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: La question de Mia
    gloss: 'Mia demande : Qu’est-ce qu’ils ont dit ?'
    note: '*did they say* utilise *did* comme auxiliaire au passé.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Réponse de Leila"
    gloss: 'Leila dit : Ils sont disponibles jeudi à 15 h.'
    note: '*at 3pm* utilise *at* pour une heure précise.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: La question de confirmation de Mia
    gloss: 'Mia demande : Cette heure te convient ?'
    note: '*Does that time work for you?* est la forme interrogative de *that time works for you*, avec l’auxiliaire *do* comme dans les questions précédentes.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: La confirmation de Leila
    gloss: 'Leila dit : Oui, ça me convient. Jeudi à 15 h -- merci ! Le rendez-vous de Max est confirmé.'
    note: '*Max''s appointment* utilise le possessif en *''s* ; en français, on dit « le rendez-vous de Max » avec « de ».'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Texte sur la prise de rendez-vous
    gloss: 'Comment prendre rendez-vous : si tu dois voir un médecin, un dentiste ou un autre service, il faut en général prendre rendez-vous d’abord. Appelle et dis que tu voudrais prendre rendez-vous. La réceptionniste t’indiquera quels jours et quelles heures sont disponibles. Choisis une heure qui te convient, et ils confirmeront ton rendez-vous. Si quelque chose change, rappelle et demande à reporter. La semaine dernière, Leila a appelé le vétérinaire pour prendre rendez-vous pour le bilan annuel de son chien Max. Ils étaient disponibles jeudi à 15 h, et Leila a confirmé l’heure. Daniel a aussi un rendez-vous -- il va chez le dentiste lundi matin pour un contrôle. Il a dit qu’il n’est pas nerveux, juste un peu occupé cette semaine.'
    note: '*a little busy this week* signifie « un peu occupé cette semaine ».'
