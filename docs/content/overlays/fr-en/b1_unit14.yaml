teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: serait-il possible de
    note: '*would it be possible to* demande poliment si quelque chose est envisageable.'
    example_gloss: Serait-il possible de déplacer la réunion à jeudi ?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: je me demandais si
    note: '*I was wondering if* rend une demande indirecte et prudente.'
    example_gloss: Je me demandais si tu pourrais relire mon rapport aujourd’hui.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: pourrions-nous éventuellement
    note: '*could we possibly* demande poliment quelque chose que l’on ferait ensemble.'
    example_gloss: Pourrions-nous éventuellement commencer la réunion cinq minutes plus tard ?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: je vous serais reconnaissant si
    note: '*I would appreciate it if* dit qu’on serait reconnaissant si quelqu’un faisait quelque chose.'
    example_gloss: Je te serais reconnaissant de m’envoyer bientôt le compte rendu.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: ordre du jour
    note: '*agenda* désigne la liste des sujets à traiter pendant une réunion.'
    example_gloss: Daniel a ajouté un point de plus à l’ordre du jour.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: relancer, faire un suivi
    note: '*follow up* signifie reprendre contact après une réunion ou une tâche.'
    example_gloss: Mia fera un suivi par e-mail après la réunion.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: Serait-il possible de déplacer la réunion à jeudi ?
    note: '*would it be possible to* + verbe à l’infinitif demande poliment un changement.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: Je me demandais si tu pourrais relire mon rapport aujourd’hui.
    note: '*I was wondering if you could* est une façon indirecte et polie de demander.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Demandes atténuées au travail
    gloss: Dans les demandes formelles au travail, utilise une forme de conditionnel atténuée comme Would it be possible to... ou I was wondering if... plutôt qu’un ordre direct. Ces formes sonnent plus poli que Move the meeting ou Review my report.
    note: 'Forme : utilise une forme de conditionnel atténuée plutôt qu’un ordre direct.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: point budgétaire
    note: '*budget update* désigne un rapport sur la façon dont l’argent est dépensé.'
    example_gloss: Daniel a préparé le point budgétaire pour la réunion.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: ensuite, après
    note: '*afterward* signifie après autre chose, dans le temps.'
    example_gloss: Nous pourrons relire les notes ensuite.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Texte : un message avant la réunion'
    gloss: Bonjour Daniel, j’espère que tu vas bien. Serait-il possible d’ajouter le point budgétaire à l’ordre du jour de la réunion de demain ? Je te serais reconnaissante si tu pouvais apporter les derniers chiffres. Pourrions-nous éventuellement commencer dix minutes plus tôt afin d’avoir du temps pour les questions ensuite ? Merci, Mia
    note: Un court message professionnel avec des demandes atténuées.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: La responsable d'équipe ouvre poliment la réunion
    gloss: 'Le manager dit : Bonjour Mia. Serait-il possible de commencer par le point budgétaire aujourd’hui ?'
    note: '*would it be possible to* demande poliment de changer l’ordre de la réunion.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia fait une demande supplémentaire
    gloss: 'Mia dit : Bien sûr. Je me demandais si nous pourrions aussi ajouter le nouveau client à l’ordre du jour.'
    note: '*I was wondering if we could* est une façon indirecte et polie de faire une proposition.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: La responsable d'équipe demande une courte réunion
    gloss: 'Le manager dit : Bonne idée. Pourrions-nous éventuellement faire durer cette réunion moins de trente minutes ?'
    note: '*could we possibly* demande poliment quelque chose que les deux feraient ensemble.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia demande quelque chose pour la prochaine fois
    gloss: 'Mia dit : Je ferai de mon mieux. Je serais reconnaissante si tout le monde envoyait ses questions à l’avance la prochaine fois.'
    note: '*I would appreciate it if* dit qu’on serait reconnaissant.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: La responsable d'équipe est d'accord et promet de relancer
    gloss: 'Le manager dit : C’est une demande légitime. Je ferai un rappel avant la prochaine réunion.'
    note: '*follow up* signifie ici : y revenir plus tard.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia conclut par une confirmation
    gloss: 'Mia dit : Merci. J’enverrai l’ordre du jour mis à jour cet après-midi.'
    note: Une conclusion courte et polie de la conversation.
