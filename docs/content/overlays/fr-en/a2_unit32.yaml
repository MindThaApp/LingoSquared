    title: Donner son avis avec un contre-argument
    gloss: À mon avis, c’est pratique pour rester en contact, mais on peut y perdre beaucoup de temps.
    note: Avec *In my opinion..., but...*, tu donnes ton avis et tu ajoutes aussitôt une objection.
