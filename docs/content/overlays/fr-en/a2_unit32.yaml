    title: Message de Mia
    gloss: Salut ! J’utilise beaucoup mon téléphone tous les jours. Je poste des photos sur les réseaux sociaux presque tous les soirs et je regarde mes notifications plusieurs fois par jour. Je sais que c’est trop de temps d’écran, mais j’aime partager des photos avec mes amis.
