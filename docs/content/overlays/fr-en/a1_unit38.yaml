teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: corvée / tâche ménagère
    note: '*chore* désigne une tâche qu’on fait régulièrement pour garder sa maison propre et rangée.'
    example_gloss: Faire la vaisselle est la corvée que j’aime le moins.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: vaisselle
    note: '*dishes* signifie « vaisselle » : les assiettes, les tasses et les couverts qu’on lave.'
    example_gloss: Je fais la vaisselle après le dîner.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: linge / lessive
    note: '*laundry* signifie « linge » ou « lessive » : les vêtements qu’on lave, sèche et plie.'
    example_gloss: Elle fait la lessive le dimanche.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: passer l’aspirateur
    note: '*vacuum* signifie « passer l’aspirateur ».'
    example_gloss: Il passe l’aspirateur dans le salon tous les samedis.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: ordures / déchets
    note: '*trash* signifie « ordures » ou « déchets ».'
    example_gloss: Peux-tu sortir les poubelles ?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: nettoyer
    note: '*clean* signifie « nettoyer ».'
    example_gloss: Nous nettoyons l’appartement ensemble.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: faire la vaisselle
    note: '*wash the dishes* signifie littéralement « laver la vaisselle ». *Do the dishes* est tout aussi courant et signifie la même chose (« faire la vaisselle »).'
    example_gloss: Je fais la vaisselle tous les soirs.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: faire la lessive
    note: '*do the laundry* signifie « faire la lessive » ou « faire le linge ».'
    example_gloss: Elle fait la lessive le dimanche.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: sortir les poubelles
    note: '*take out the trash* utilise *take out*, et non *do*. Contrairement à *do the laundry* ou *do the dishes*, on ne peut donc pas utiliser *do* ici.'
    example_gloss: Peux-tu sortir les poubelles ?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: nettoyer la salle de bain
    note: '*clean the bathroom* signifie « nettoyer la salle de bain ».'
    example_gloss: Il nettoie la salle de bain le week-end.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: devoir
    note: '*need to* signifie « devoir » ou « avoir besoin de » faire quelque chose.'
    example_gloss: Je dois passer l’aspirateur dans le salon ce week-end.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Peux-tu m’aider avec la vaisselle ?
    note: Une façon polie de demander de l’aide pour une corvée.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Mia dit : Mon appartement est un vrai désordre. J’ai du monde qui vient ce week-end.'
    note: '*a mess* signifie « un désordre » ou « un fouillis ».'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: La proposition de Daniel
    gloss: 'Daniel demande : Tu veux un coup de main pour le nettoyer ?'
    note: '*Do you want some help ...ing?* est une façon naturelle de proposer de l’aide.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Réponse de Mia"
    gloss: 'Mia répond : Oui, volontiers ! Je dois passer l’aspirateur dans le salon et faire la vaisselle.'
    note: '*I need to* + verbe signifie « je dois » + verbe.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: La proposition de Daniel
    gloss: 'Daniel dit : Je peux passer l’aspirateur à ta place. Toi, tu peux faire la vaisselle.'
    note: '*for you* signifie ici « pour toi », au sens de « à ta place ».'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Ce que Mia ajoute
    gloss: 'Mia dit : Merci ! Je dois encore faire la lessive aussi.'
    note: '*still need to* signifie « devoir encore ».'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: La proposition de Daniel
    gloss: 'Daniel dit : Je n’ai pas le temps pour ça aujourd’hui, mais je peux sortir les poubelles avant de partir.'
    note: '*before I leave* signifie « avant de partir ».'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Le remerciement de Mia
    gloss: 'Mia dit : Ça m’aiderait beaucoup. Merci infiniment !'
    note: '*That would help a lot* signifie « ça aiderait beaucoup ». *Would* rend la phrase plus polie ici.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Texte sur les corvées à la maison
    gloss: Daniel, Leila et Mia ont chacun leurs habitudes pour les corvées. Daniel fait la vaisselle tous les soirs après le dîner et passe l’aspirateur chez lui le samedi. Leila ne déteste pas faire la lessive, mais elle déteste nettoyer la salle de bain. La chatte de Mia, Luna, laisse des poils partout, alors Mia passe l’aspirateur dans son appartement presque tous les jours. Le week-end dernier, Mia avait des invités, alors Daniel lui a proposé de l’aider. Il a passé l’aspirateur dans le salon et a sorti les poubelles à sa place. Mia lui était très reconnaissante pour son aide.
    note: '*doesn''t mind* signifie « ne trouve pas ça gênant » ou « ne déteste pas ».'
