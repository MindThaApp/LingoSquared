teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: football
    note: '*soccer* signifie « football ». Le verbe qui l’accompagne est *play* : *play soccer*. En français, on dit « jouer au football », avec la préposition « à » ; en anglais, il n’y a pas de préposition après *play*. Selon le sport, il faut aussi retenir le bon verbe : *play*, *go* ou *do*.'
    example_gloss: Nous jouons au football le samedi.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: tennis
    note: '*tennis* signifie « tennis ». Comme pour *soccer*, on utilise ici *play* : *play tennis*. En français, on dit « jouer au tennis » ; en anglais, il n’y a pas de préposition : *play tennis*.'
    example_gloss: Elle joue au tennis tous les week-ends.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: basket-ball
    note: '*basketball* signifie « basket-ball ». Ici aussi, on utilise *play* : *play basketball*, comme pour *soccer* et *tennis*. Pour les sports de balle, l’anglais emploie toujours *play* + le nom du sport.'
    example_gloss: Ils jouent au basket-ball au parc.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: nager
    note: '*swimming* signifie « nager » (ou « la natation »). Ici, le verbe change : *go swimming* (et non *play swimming*). L’anglais emploie *go* + la forme en *-ing* pour des activités comme la natation ou la course à pied. En français, on dit simplement « nager » ou « aller nager ».'
    example_gloss: Je vais nager deux fois par semaine.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: yoga
    note: '*yoga* signifie « yoga ». Le verbe est *do* : *do yoga*. L’anglais emploie *do* pour des activités individuelles comme le yoga, pas *play* ni *go*. En français, on dit aussi « faire du yoga », donc ce verbe correspond. Mais l’anglais a trois verbes (*play*, *go*, *do*) à retenir selon le type de sport.'
    example_gloss: Il fait du yoga le matin.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: faire du sport
    note: '*exercise* signifie « faire du sport » ou « faire de l’exercice » : un mot général pour l’activité physique. Contrairement à *soccer*, *swimming* et *yoga*, on peut aussi employer *exercise* comme verbe, sans *play*, *go* ni *do* : *Do you exercise every day?*'
    example_gloss: Fais-tu du sport tous les jours ?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: deux fois par semaine
    note: '*twice a week* signifie « deux fois par semaine ». Ici, le mot *a* ne veut pas dire « un » mais « par » : nombre + *a* + unité de temps indique la fréquence au cours de cette période. En français, on emploie « par » (deux fois par semaine).'
    example_gloss: Il joue au tennis deux fois par semaine.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: trois fois par semaine
    note: '*three times a week* signifie « trois fois par semaine ». Comme pour *twice a week*, *a* veut dire ici « par », et non « un » : *times* (fois) plus *a week* (par semaine) indique la fréquence hebdomadaire.'
    example_gloss: Elle nage trois fois par semaine.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: le week-end
    note: '*on weekends* signifie « le week-end » (de façon habituelle). L’anglais emploie *on* avec les jours et les week-ends, et le pluriel *weekends* pour une habitude ; le français utilise simplement l’article « le ».'
    example_gloss: Nous jouons au basket-ball le week-end.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: salle de sport
    note: '*gym* signifie « salle de sport » : un lieu avec des appareils et des cours pour faire du sport.'
    example_gloss: Il fait du yoga à la salle de sport.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: piscine
    note: '*pool* signifie « piscine » : un lieu rempli d’eau pour nager.'
    example_gloss: Je nage à la piscine.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: À quelle fréquence fais-tu du sport ?
    note: 'Cette question commence par *how often* (à quelle fréquence). Vient ensuite l’auxiliaire *do*, car le verbe principal est *exercise* : c’est le même *do* que dans les autres questions anglaises.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: La question de Daniel
    gloss: 'Daniel demande : Tu veux jouer au football avec nous samedi ?'
    note: Début du dialogue avec une invitation à jouer au football. Avec *soccer*, on utilise *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Réponse de Leila"
    gloss: 'Leila répond : Je n’aime pas trop le football. Je préfère nager.'
    note: '*don''t really like* signifie « ne pas trop aimer » : une façon plus douce de dire non.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : Pas de problème ! À quelle fréquence vas-tu nager ?'
    note: '*go swimming* : pour la natation, on utilise *go*, pas *play* ni *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Réponse de Leila"
    gloss: 'Leila répond : Deux fois par semaine, en général à la piscine près de chez moi.'
    note: '*Twice a week* : ici aussi, *a* veut dire « par ».'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Réponse de Daniel"
    gloss: 'Daniel dit : Super ! Je fais aussi du yoga de temps en temps, mais la course à pied reste ma préférée.'
    note: '*do yoga* : pour le yoga, on utilise *do*, à part de *play* et *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Texte sur Daniel, Leila et Mia
    gloss: Daniel, Leila et Mia restent actifs chacun à leur manière. Daniel va courir tous les matins avant le travail. Leila préfère nager ; elle va à la piscine deux fois par semaine. Mia est nouvelle dans l’équipe, mais elle joue déjà au tennis tous les dimanches avec sa voisine. Le samedi, ils jouent parfois au football ensemble au parc, mais le football n’est le sport préféré de personne.
    note: 'Ce texte utilise les trois verbes : *goes running* (*go*), *plays tennis* et *play soccer* (*play*). Chaque sport a son propre verbe.'
