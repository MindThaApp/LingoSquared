  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter:
    title: Can you make it a little shorter?
    gloss: Pouvez-vous le faire un peu plus court ?
    note: La construction *make it* suivie d’un adjectif signifie rendre quelque chose ainsi ; ici, la faire plus courte.
