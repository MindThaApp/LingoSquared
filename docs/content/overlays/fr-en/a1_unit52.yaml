  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: L’accueil du coiffeur
    gloss: 'Le coiffeur dit : Bonjour, que puis-je faire pour vous aujourd’hui ?'
    note: '*How can I help you today?* signifie que puis-je faire pour vous aujourd’hui ?'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: La demande de Daniel
    gloss: 'Daniel dit : Je voudrais une coupe, s’il vous plaît. Ma sœur vient nous rendre visite la semaine prochaine.'
    note: Dans *I'd like a haircut*, le nom *haircut* correspond à « une coupe » en français.
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "Le coiffeur demande"
    gloss: 'Le coiffeur demande : Bien sûr, quelle coupe voulez-vous ?'
    note: '*what style do you want* signifie quelle coupe voulez-vous.'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Le souhait de Daniel
    gloss: 'Daniel dit : La même coupe, juste un peu plus courte.'
    note: '*just a little shorter* signifie juste un peu plus court.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: La question de Mia
    gloss: 'Mia demande : Pouvez-vous d’abord lui laver les cheveux ?'
    note: '*Can you wash his hair first?* signifie pouvez-vous d’abord lui laver les cheveux ?'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: La confirmation du coiffeur
    gloss: 'Le coiffeur dit : Bien sûr, et le shampoing est compris dans la coupe.'
    note: '*included with* signifie compris dans.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: La question de Daniel sur le prix
    gloss: 'Daniel demande : Parfait. C’est combien ?'
    note: '*Great.* signifie ici parfait ou super et s’emploie comme une réaction brève.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: Le prix
    gloss: 'Le coiffeur dit : C’est vingt dollars.'
    note: Cette phrase a déjà été étudiée plus tôt.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Texte sur une visite chez le coiffeur
    gloss: 'Une visite chez le coiffeur : La sœur de Daniel devait venir de Chicago la semaine suivante, alors il a décidé d’aller se faire couper les cheveux. Mia lui a recommandé son coiffeur préféré, dans un petit salon près de chez elle, et l’a accompagné. Le coiffeur lui a demandé quelle coupe il voulait et Daniel a répondu qu’il voulait la même, juste un peu plus courte. Elle lui a d’abord lavé les cheveux ; le shampoing était compris dans la coupe. La coupe a coûté vingt dollars. Quand ils ont eu fini, Mia lui a dit que sa nouvelle coupe lui allait très bien. En rentrant, ils ont retrouvé Leila autour d’un café. Elle se sentait beaucoup mieux depuis son rhume et, elle aussi, elle a adoré la nouvelle coupe de Daniel.'
    note: '*looked great* signifie allait très bien.'
