teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: rendez-vous
    note: '*appointment* désigne un rendez-vous fixé à l''avance, par exemple dans une administration.'
    example_gloss: J'ai rendez-vous vendredi au DMV (le service des permis de conduire et de l'immatriculation).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: document
    note: '*document* désigne un document officiel ou une pièce écrite.'
    example_gloss: Veuillez apporter un document comme justificatif de domicile.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: justificatif de domicile
    note: '*proof of residency* désigne un document qui montre où l''on habite.'
    example_gloss: Une facture d'électricité peut servir de justificatif de domicile.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: formulaire
    note: '*form* désigne un formulaire que l''on remplit.'
    example_gloss: Veuillez remplir ce formulaire avant votre rendez-vous.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: numéro de confirmation
    note: '*confirmation number* désigne le numéro qui confirme le rendez-vous.'
    example_gloss: Votre numéro de confirmation est le 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Je voulais savoir si je pourrais prendre rendez-vous.
    note: '*I was wondering whether...* est une façon polie et formelle de demander quelque chose.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: Serait-il possible de venir ce vendredi ?
    note: '*Would it be possible...?* est une demande très polie.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Je dois faire changer mon adresse, parce que j'ai déménagé le mois dernier.
    note: '*because* introduit une proposition qui donne la raison.'
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: pièce d'identité avec photo
    note: '*photo ID* désigne une pièce d''identité avec photo, par exemple une carte d''identité ou un permis de conduire.'
    example_gloss: Vous avez besoin d'une pièce d'identité avec photo et d'un justificatif de domicile.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: facture d'électricité, de gaz ou d'eau
    note: '*utility bill* désigne la facture d''électricité, de gaz ou d''eau.'
    example_gloss: Une facture d'électricité est un exemple courant de justificatif de domicile.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: Pour changer votre adresse, veuillez apporter une pièce d'identité avec photo et un justificatif de domicile, par exemple une facture d'électricité. Si vous n'avez pas de facture d'électricité, vous pouvez apporter votre bail.
    note: 'Un avis formel : il indique ce qu''il faut apporter et ce que l''on peut apporter à la place.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: J'apporterai une pièce d'identité avec photo.
    note: Avec *will*, on dit ce que l'on va faire (le futur).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: Pouvez-vous me dire ce que je dois apporter ?
    note: '*Could you tell me...?* est une question indirecte polie. Après *what*, l''ordre des mots reste celui d''une phrase affirmative : *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 'L''employé demande : Depuis combien de temps habitez-vous à la nouvelle adresse ?'
    note: '*How long have you lived...?* demande depuis combien de temps quelque chose dure. L''anglais emploie ici le present perfect (*have lived*), alors qu''en français on dit « depuis combien de temps habitez-vous » avec le présent. La réponse peut commencer par *since* : *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: 'Daniel dit : Depuis le mois dernier.'
    note: '*Since last month* signifie « depuis le mois dernier ». Une réponse courte suffit ici.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: 'Daniel demande : Serait-il possible de venir ce vendredi ?'
    note: C'est la même question que dans la deuxième leçon.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 'L''employé dit : Oui, vendredi à 10 h, c''est possible. Votre numéro de confirmation est le 4471.'
    note: L'employé confirme l'heure et donne le numéro de confirmation.
