teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: téléphone
    note: '*phone* signifie « téléphone ».'
    example_gloss: J’appelle ma mère avec mon téléphone.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: ordinateur portable
    note: '*laptop* signifie « ordinateur portable ».'
    example_gloss: Elle utilise son ordinateur portable pour le travail.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tablette
    note: '*tablet* signifie « tablette ».'
    example_gloss: Il lit des livres sur sa tablette.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: ordinateur
    note: '*computer* signifie « ordinateur ».'
    example_gloss: Nous avons un ordinateur à la maison.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: appli
    note: '*app* signifie « appli » (application).'
    example_gloss: J’ai une nouvelle appli sur mon téléphone.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: appareil photo
    note: '*camera* signifie « appareil photo » (ou « caméra »).'
    example_gloss: Cet appareil photo prend de superbes photos.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: passer un appel
    note: '*make a call* est une combinaison fixe verbe + nom à retenir ensemble : on dit *make a call*, et non *do a call*. En français, on peut dire « passer un appel » ou simplement « appeler » ; en anglais, *call* peut aussi être un verbe, mais ici on apprend la combinaison avec *make*.'
    example_gloss: J’appelle mon frère tous les dimanches.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: envoyer un SMS
    note: '*send a text* est, comme *make a call*, une combinaison fixe verbe + nom. Elle correspond au français « envoyer un SMS » ou « envoyer un texto ». En anglais, on dit le plus souvent *send a text*.'
    example_gloss: Elle envoie un SMS à son amie tous les matins.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: télécharger une appli
    note: '*download an app* : *download* ressemble beaucoup au français « télécharger », donc c’est la plus facile des trois combinaisons fixes.'
    example_gloss: Il télécharge une nouvelle appli chaque semaine.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: wifi
    note: '*wifi* signifie « wifi ».'
    example_gloss: Le wifi chez moi est rapide.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: batterie
    note: '*battery* signifie « batterie ».'
    example_gloss: La batterie de mon téléphone est presque vide.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Comment utilises-tu ton téléphone ?
    note: '*Do you use ...?* utilise le même auxiliaire *do* que les autres questions anglaises.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: La plainte de Mia
    gloss: 'Mia dit : Mon téléphone est tellement vieux. Il est vraiment lent.'
    note: '*so* + adjectif (*so old*) renforce le sens, comme « tellement », « si » ou « vraiment » en français.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Le conseil de Leila
    gloss: 'Leila dit : Tu devrais en acheter un nouveau. Pour quoi l’utilises-tu le plus ?'
    note: '*What do you use it for most?* se termine par la préposition *for*. En français, la préposition se place avant le mot interrogatif (« Pour quoi l’utilises-tu ? »). En anglais, on commence par *what* et *for* reste à la fin.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Réponse de Mia"
    gloss: 'Mia dit : J’envoie surtout des messages à ma sœur et je prends des photos.'
    note: '*text* peut aussi s’employer comme verbe (*I text my sister*). C’est plus courant que *send a text* ; les deux sont de l’anglais correct.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: L’usage de Leila
    gloss: 'Leila dit : J’appelle mes parents tous les week-ends avec mon téléphone. J’utilise aussi beaucoup d’applis.'
    note: '*call* comme verbe (*I call my parents*) est la manière courante et familière. *Make a call* est la combinaison fixe vue dans la leçon 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: La question de Mia
    gloss: 'Mia demande : Quelles applis utilises-tu ?'
    note: '*Which apps do you use?* : *which* demande de choisir parmi un groupe (d’applis), comme « quelles » en français.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Leila dit : J’utilise une appli de cuisine et une appli de cartes. Tu veux les télécharger ?'
    note: '*Do you want to ...?* utilise l’auxiliaire *do*, même si *want* est un verbe ordinaire.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Oui, s’il te plaît, envoie-moi les noms !'
    note: '*please* se place ici avant le verbe (*please send ...*) et rend la demande plus polie.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Texte sur Daniel, Leila et Mia
    gloss: Daniel, Leila et Mia utilisent tous leur téléphone différemment. Daniel n’aime pas écrire des messages ; il préfère appeler. Leila utilise son téléphone pour les cartes. Elle utilise aussi une appli de cuisine quand elle essaie de nouvelles recettes. Mia prend beaucoup de photos et les envoie à sa famille. Ils utilisent tous un ordinateur portable pour le travail, et ils font des appels vidéo avec des amis le week-end.
    note: '*He prefers to call people instead* : *instead* en fin de phrase signifie « plutôt », « à la place » (au lieu d’écrire des messages).'
