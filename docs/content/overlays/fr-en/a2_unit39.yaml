course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit39.after_the_interview:
    title: Après l’entretien d’embauche
lessons:
  en.a2.unit39.lesson01.offer_vocabulary:
    title: Offre, contrat et date de début
  en.a2.unit39.lesson02.following_up:
    title: Relancer et accepter l’offre
  en.a2.unit39.lesson03.reading_an_offer_message:
    title: Lire une offre d’emploi
  en.a2.unit39.lesson04.offer_call_dialogue:
