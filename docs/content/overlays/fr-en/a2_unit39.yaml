teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: offre
    note: Ici, *offer* est l’offre d’un poste. Comme verbe, *to offer* signifie proposer.
    example_gloss: J’ai reçu une offre d’emploi de Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: contrat
    note: '*contract* est l’accord écrit entre toi et l’entreprise.'
    example_gloss: Le contrat dure un an.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: salaire
    note: '*salary* est la somme que l’on gagne par mois ou par an.'
    example_gloss: Nous pourrons parler du salaire la semaine prochaine.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: accepter
    note: '*accept* signifie dire oui à quelque chose qu’on te propose.'
    example_gloss: Je voudrais accepter le poste.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: date de début
    note: '*start date* est le premier jour de ton nouveau poste.'
    example_gloss: La date de début est le premier lundi du mois.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: réponse
    note: '*reply* est à la fois la réponse à un message et le verbe répondre.'
    example_gloss: J’ai envoyé une réponse le jour même.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to pour un souhait poli
    gloss: Je voudrais accepter l’offre. Je voudrais commencer lundi.
    note: '*I would like to ...* est plus poli que *I want to ...* et convient aux échanges professionnels.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Commencer le message
    gloss: Merci pour l’entretien d’hier.
    note: '*Thank you for ...* est le début habituel d’un bref message de remerciement professionnel.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Dire que vous êtes toujours intéressé
    gloss: Je suis toujours très intéressé(e) par le poste.
    note: '*still* signifie toujours, encore, et se place avant l’adjectif.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Demander poliment la date de début
    gloss: Pourriez-vous m’indiquer la date de début ?
    note: '*Could you tell me ...?* est une question indirecte, plus polie que *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Accepter l'offre
    gloss: Je voudrais accepter l’offre.
    note: C’est la phrase classique pour accepter un poste.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Questions indirectes avec Could you tell me
    gloss: Pourriez-vous m’indiquer la date de début ? Pourriez-vous me parler des horaires de travail ?
    note: 'Après *Could you tell me*, on n’utilise plus l’ordre des mots d’une question : on dit *the start date*, et non *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: temps plein
    note: '*full time* correspond à une semaine de travail complète ; le contraire est *part time* (temps partiel).'
    example_gloss: Le poste est à temps plein, pas seulement deux jours par semaine.
  en.a2.unit39.lesson03.teach.offer_message:
    title: Le message avec l'offre
    gloss: Chère Mia, merci d’être venue mardi. Nous aimerions vous proposer le poste de coordinatrice marketing. Le contrat est à temps plein et la date de début est lundi. Merci de nous répondre avant vendredi. Bright Path Marketing.
    note: 'Un message d’offre d’emploi mentionne toujours quatre choses : le poste, le type de contrat, la date de début et le délai pour ta réponse.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Le délai de réponse
    gloss: Merci de répondre avant vendredi.
    note: '*by Friday* signifie au plus tard vendredi : le vendredi lui-même est donc encore possible.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: La recruteuse appelle Mia
    gloss: 'La recruteuse dit : Bonjour Mia, je vous appelle au sujet de l’entretien de mardi.'
    note: '*I am calling about ...* est la façon habituelle d’ouvrir un appel professionnel.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia dit qu'elle est toujours intéressée
    gloss: 'Mia dit : Merci de votre appel. Je suis toujours très intéressée par le poste.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: La recruteuse propose le poste
    gloss: 'La recruteuse dit : Parfait, car nous aimerions vous proposer le poste.'
    note: '*because* relie ici la réponse de Mia à la bonne nouvelle qui suit.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia réagit et demande la date de début
    gloss: 'Mia dit : Ce sont d’excellentes nouvelles. Pourriez-vous m’indiquer la date de début ?'
    note: On réagit d’abord brièvement à la nouvelle, puis on pose la question.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: La recruteuse indique la date et le contrat
    gloss: 'La recruteuse dit : La date de début est lundi, et le contrat est à temps plein.'
    note: Ce sont les mêmes deux informations que dans le message de la leçon 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia demande les horaires de travail
    gloss: 'Mia demande : Pourriez-vous me parler des horaires de travail ?'
    note: C’est la même forme de question indirecte que pour la date de début.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: La recruteuse indique les horaires de travail
    gloss: 'La recruteuse dit : De neuf heures à dix-sept heures, avec une heure pour le déjeuner.'
    note: '*from nine to five* est l’expression toute faite pour décrire une journée de travail.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia accepte l'offre
    gloss: 'Mia dit : Merci. Je voudrais accepter l’offre.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: La recruteuse termine l'entretien
    gloss: 'La recruteuse dit : Merveilleux. Nous vous envoyons le contrat aujourd’hui même.'
    note: '*Wonderful* est une réaction chaleureuse et positive, tout à fait courante aussi dans l’anglais professionnel.'
