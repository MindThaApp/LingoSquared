  en.a2.unit29.lesson02.teach.report_problem:
    title: Ein Problem melden
    gloss: Je voudrais signaler un problème avec l'évier de ma cuisine.
    note: Avec *I'd like to report...*, tu signales poliment un problème.
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: Erklären, wie lange das Problem besteht
    gloss: Ça fuit depuis ce matin.
    note: 'Pour quelque chose qui dure depuis un moment, l''anglais emploie *It''s been leaking since...*, comme *I''ve had ... for* dans l''unité 28. En français, on utilise le présent avec « depuis » : Ça fuit depuis ce matin.'
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: Fragen, wann repariert wird
    gloss: Quand quelqu'un peut-il venir le réparer ?
    note: Avec *When can someone come to fix it?*, tu demandes poliment quand la réparation peut avoir lieu.
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: entre 14 h et 16 h
    note: '*between 2pm and 4pm* signifie entre 14 h et 16 h. En anglais, on écrit l''heure avec *pm* (système sur 12 heures) plutôt qu''avec le décompte sur 24 heures.'
    example_gloss: Le plombier viendra entre 14 h et 16 h.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: Text der Reparaturmitteilung
    gloss: Votre signalement concernant un évier de cuisine qui fuit a bien été reçu. Un plombier viendra demain entre 14 h et 16 h. Le numéro de réparation est le 6180.
    note: 'Une confirmation formelle : le signalement est bien reçu, avec en plus une heure et un numéro.'
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: Dem Hausmeister das Problem melden
    gloss: 'Daniel dit : Je voudrais signaler un problème avec l''évier de ma cuisine.'
    note: C'est la même phrase que dans la leçon 2.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: Nach dem Problem mit dem Spülbecken fragen
    gloss: 'Le gestionnaire de l''immeuble demande : Qu''est-ce qui ne va pas avec l''évier ?'
    note: C'est la même forme de question que celle employée par le médecin dans l'unité 28 (*What's wrong?*), mais cette fois pour l'évier et non pour la santé.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: Daniels Antwort zur Dauer und die Frage nach dem Reparaturtermin
    gloss: 'Daniel dit : Ça fuit depuis ce matin. Quand quelqu''un peut-il venir le réparer ?'
    note: Les deux phrases de la leçon 2, cette fois l'une après l'autre.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: Die Antwort des Hausmeisters zum Klempner
    gloss: 'Le gestionnaire de l''immeuble dit : Je vois. J''enverrai un plombier demain entre 14 h et 16 h.'
    note: Le gestionnaire de l'immeuble indique le moment de la réparation après avoir entendu le problème.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: Fragen, ob man zu Hause sein muss
    gloss: 'Daniel demande : Est-ce que je dois être chez moi ?'
    note: Daniel pose cette question après avoir entendu le moment de la réparation.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: Die letzte Bestätigung des Hausmeisters
    gloss: 'Le gestionnaire de l''immeuble dit : Oui, soyez chez vous entre 14 h et 16 h. Voici votre numéro de réparation : 6180.'
    note: Le gestionnaire de l'immeuble donne l'heure exacte et le numéro de réparation.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: Abschließendes Dankeschön
    gloss: 'Daniel dit : Merci beaucoup.'
    note: '*Thank you very much* est une façon polie et formelle de remercier, exactement comme à la fin de la conversation de l''unité 25.'
