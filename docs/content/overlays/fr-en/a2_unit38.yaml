course:
  title: Anglais A2
  description: Apprends l’anglais au niveau A2 pour des situations du quotidien un peu plus formelles, avec des explications détaillées en français.
units:
  en.a2.unit38.repair_visit:
    title: Reporter un rendez-vous de réparation et le confirmer
lessons:
  en.a2.unit38.lesson01.repair_visit_vocabulary:
    title: Reporter, clé et voisins
  en.a2.unit38.lesson02.moving_the_appointment:
    title: Décaler le rendez-vous à un autre moment
  en.a2.unit38.lesson03.reading_a_rescheduling_message:
    title: Lire un message sur le nouveau rendez-vous
  en.a2.unit38.lesson04.repair_visit_dialogue:
    title: Appeler pour reporter la réparation
teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: reporter, déplacer
    note: '*reschedule* signifie déplacer un rendez-vous à un autre moment.'
    example_gloss: Je dois reporter la réparation, parce que je serai au travail.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: voisin, voisine
    note: '*neighbor* désigne la personne qui habite à côté de chez toi. Le mot anglais ne dit pas si c’est un homme ou une femme.'
    example_gloss: Ma voisine peut ouvrir la porte au plombier.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: clé
    note: '*key* est le petit objet en métal avec lequel on ouvre la porte.'
    example_gloss: Je laisse la clé à ma voisine.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: fuite
    note: 'Ici, *leak* est un nom : l’endroit même d’où l’eau s’échappe. Le verbe *to leak* signifie fuir.'
    example_gloss: La fuite sous mon évier empire.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: réparé
    note: '*fixed* est le participe de *to fix* (réparer) et signifie que quelque chose n’est plus en panne.'
    example_gloss: L’évier est réparé maintenant, et l’eau ne coule plus.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: après-midi
    note: '*afternoon* est la partie de la journée après midi ; le matin se dit *morning*.'
    example_gloss: Le plombier est venu l’après-midi, pas le matin.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't et won't quand quelque chose ne marche pas
    gloss: Je ne peux pas être chez moi entre 14 h et 16 h. Je ne serai pas chez moi l’après-midi.
    note: '*can''t* dit que quelque chose n’est pas possible. *won''t* dit qu’à l’avenir, ce ne sera tout simplement pas le cas.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Dire que vous souhaitez reporter le rendez-vous
    gloss: Je dois reporter la réparation.
    note: '*I need to ...* est factuel et neutre : c’est nécessaire, mais cela ne sonne pas impoli.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Demander une autre heure
    gloss: Serait-il possible de venir plutôt le matin ?
    note: '*Would it be possible to ...?* est la façon la plus prudente de demander quelque chose. *instead* signifie plutôt, à la place.'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Dire où est la clé
    gloss: Je laisse la clé à ma voisine.
    note: '*leave something with someone* signifie laisser ou confier quelque chose à quelqu’un.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Demander si le problème est résolu
    gloss: La fuite est-elle réparée, maintenant ?
    note: '*Is ... fixed?* demande le résultat, pas le travail lui-même.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Donner une raison avec because
    gloss: Je ne peux pas être chez moi entre 14 h et 16 h, parce que je suis au travail.
    note: '*because* relie le problème à la raison. L’ordre des mots ne change pas ensuite : le verbe reste à sa place habituelle.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: message
    note: '*message* désigne n’importe quel court message écrit : un SMS, un message de messagerie ou un bref e-mail.'
    example_gloss: J’ai reçu un message sur le nouvel horaire de la réparation.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Le message sur le nouveau rendez-vous
    gloss: La réparation 6180 a été reportée. Le plombier viendra demain entre 9 h et 11 h. Votre voisine ouvrira la porte. Veuillez confirmer ce nouvel horaire par message aujourd’hui.
    note: 'Un message de la gérance est bref et factuel : ce qui a changé, quand, et ce qu’il vous reste à faire.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Être invité à confirmer
    gloss: Veuillez confirmer ce nouvel horaire par message aujourd’hui.
    note: '*confirm* signifie confirmer ; *by message* signifie par message.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel appelle la gestion immobilière
    gloss: 'Daniel dit : Bonjour, je dois reporter la réparation.'
    note: Au téléphone, on commence par *Hello*, puis on donne tout de suite la raison de l’appel.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: La gestion immobilière demande quelle réparation
    gloss: 'La gérance dit : Pas de problème. De quelle réparation s’agit-il ?'
    note: '*Which repair is it?* demande de choisir une chose parmi un groupe connu.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel donne le numéro de réparation
    gloss: 'Daniel dit : La réparation 6180, la fuite sous mon évier de cuisine.'
    note: 'C’est le même numéro de réparation que dans l’unité 29 : le même évier qui fuit.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: La gestion immobilière demande la raison
    gloss: 'La gérance dit : Je vois. Pourquoi ne pouvez-vous pas être chez vous ?'
    note: '*Why can''t you ...?* demande la raison pour laquelle quelque chose ne marche pas.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel donne la raison et demande la matinée
    gloss: 'Daniel dit : Je ne peux pas être chez moi entre 14 h et 16 h, parce que je suis au travail. Serait-il possible de venir plutôt le matin ?'
    note: 'D’abord la raison, puis la demande : cela sonne plus poli que d’exiger tout de suite quelque chose.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: La gestion immobilière propose une nouvelle période
    gloss: 'La gérance dit : Oui, le plombier peut venir entre 9 h et 11 h.'
    note: '*between 9am and 11am* est le nouveau créneau.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel s'occupe de la clé
    gloss: 'Daniel dit : Merci beaucoup. Je laisse la clé à ma voisine.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: La gestion immobilière demande une confirmation
    gloss: 'La gérance dit : Bien. Veuillez confirmer ce nouvel horaire par message aujourd’hui.'
    note: C’est la même demande que dans le message de la leçon 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel dit quand il confirmera
    gloss: 'Daniel dit : Je le confirme cet après-midi.'
    note: '*this afternoon* signifie cet après-midi, donc aujourd’hui après midi.'
