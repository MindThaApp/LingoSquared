    note: '*need* signifie avoir besoin de ; le complément vient directement après : *need cash*.'
  en.a1.unit59.lesson02.teach.where_is_the_atm:
    title: Where is the ATM?
    gloss: Où est le distributeur ?
    note: '*Where is...?* est la forme habituelle pour demander où se trouve un lieu.'
  en.a1.unit59.lesson02.teach.check_my_balance:
    title: I want to check my balance.
    gloss: Je veux vérifier mon solde.
    note: '*check my balance* est une expression courante à la banque pour vérifier son solde.'
  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: Puis-je utiliser cette carte ?
    note: '*Can I use...?* demande si quelque chose est possible ou autorisé.'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: Veuillez saisir votre code PIN.
    note: '*enter* signifie ici saisir. *PIN* est le code secret lui-même.'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: Le distributeur est dehors.
    note: '*outside* se place à la fin : *is outside*.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Mia demande où est le distributeur
    gloss: 'Mia dit : Salut ! Où est le distributeur ?'
    note: '*Where is...?* demande où se trouve un lieu.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: L’emplacement du distributeur
    gloss: 'L’employé dit : Le distributeur est dehors.'
    note: '*outside* signifie dehors.'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Leila demande pour sa carte
    gloss: 'Leila dit : Puis-je utiliser cette carte ?'
    note: '*this card* désigne la carte qu’elle a sur elle.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: La carte fonctionne
    gloss: 'L’employé dit : Oui, vous pouvez utiliser cette carte.'
    note: '*Yes* signifie oui ; *that card* désigne la carte de Leila.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia veut vérifier son solde
    gloss: 'Mia dit : Je veux vérifier mon solde.'
    note: '*want to check* utilise *to* devant le second verbe.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: Le code PIN
    gloss: 'L’employé dit : Veuillez saisir votre code PIN.'
    note: '*Please* rend la consigne polie.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Leila a aussi besoin d’espèces
    gloss: 'Leila dit : J’ai aussi besoin d’espèces.'
    note: '*too* signifie aussi et se place ici à la fin.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: Retirer vingt dollars
    gloss: 'L’employé dit : Vous pouvez retirer vingt dollars.'
    note: '*take out* signifie ici retirer de l’argent.'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Mia remercie l’employé
    gloss: 'Mia dit : Merci ! C’est très utile.'
    note: '*helpful* signifie utile ou serviable.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Avis de la banque
    gloss: 'Avis de la banque : ouverte de 9 h à 16 h. Distributeur dehors. Limite de retrait aujourd’hui : $100. Cartes acceptées.'
    note: L’avis donne les horaires d’ouverture, l’emplacement du distributeur et la limite.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Texte : Un petit passage à la banque'
    gloss: 'Un petit passage à la banque : Un matin, Mia et Leila sont allées ensemble à la banque. Mia voulait vérifier son solde et Leila avait besoin d’espèces. L’employé a dit que le distributeur était dehors. Leila a utilisé sa carte et a retiré vingt dollars. Mia a saisi son code PIN et a vérifié son solde. Avant de partir, elles ont lu l’avis. La banque était ouverte de 9 h à 16 h et la limite de retrait était de $100. Mia a dit que la visite avait été facile.'
    note: '*took out* est le passé de *take out* au sens de retirer de l’argent.'
