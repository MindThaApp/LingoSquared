  en.a1.unit12.lesson03.teach.label_text:
    title: Kleidungsetikett
    gloss: 'Chemise. Taille : M. Couleur : bleu. Prix : 20 dollars.'
    note: Le signe dollar se place AVANT le nombre (*$20*), alors que le symbole euro se place APRÈS le nombre.
  en.a1.unit12.lesson03.teach.label_summary_sentence:
    title: The shirt is a medium and it's blue.
    gloss: La chemise est en taille M et elle est bleue.
    note: Un résumé complet de la taille et de la couleur en une seule phrase.
  en.a1.unit12.lesson04.teach.here_you_go:
    title: Here you go.
    gloss: Voilà.
    note: '*Here you go* se dit quand on tend quelque chose à quelqu’un.'
  en.a1.unit12.lesson04.teach.ill_take_it:
    title: I'll take it, thanks.
    gloss: Je le prends, merci.
    note: '*I’ll take it* montre qu’on a décidé d’acheter.'
  en.a1.unit12.lesson04.teach.q_medium:
    title: Frage von Leila
    gloss: 'Leila : Excusez-moi, vous avez cette chemise en taille M ?'
    note: Leila demande poliment une autre taille.
  en.a1.unit12.lesson04.teach.a_here_you_go:
    title: Antwort des Verkäufers
    gloss: 'Vendeur : Oui, voilà.'
    note: Le vendeur tend à Leila la chemise dans la taille demandée.
  en.a1.unit12.lesson04.teach.q_blue:
    title: Nachfrage von Leila
    gloss: 'Leila : Super. Vous l’avez en bleu ?'
    note: Leila demande maintenant une autre couleur.
  en.a1.unit12.lesson04.teach.a_yes_we_do:
    title: Antwort des Verkäufers
    gloss: 'Vendeur : Oui, nous l’avons.'
    note: '*we do* confirme brièvement que la couleur est disponible.'
  en.a1.unit12.lesson04.teach.closing_ill_take_it:
    title: Abschluss von Leila
    gloss: 'Leila : Je le prends, merci.'
    note: Leila décide d’acheter.
