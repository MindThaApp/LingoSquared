teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: si
    note: '*if* introduit une condition possible.'
    example_gloss: Si le bus est en retard, je t’appelle.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: à moins que, sauf si
    note: '*unless* signifie à peu près *if not* : quelque chose se produit, sauf si la condition se réalise.'
    example_gloss: À moins que le plan ne change, on se retrouve à dix heures.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: condition
    note: '*condition* désigne la situation qui doit d’abord être remplie.'
    example_gloss: 'La condition est claire : on commence si tout le monde est arrivé.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: résultat, conséquence
    note: '*result* désigne ce qui se passe à cause d’une condition.'
    example_gloss: Le résultat, c’est qu’on se réunit en ligne.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: retard
    note: '*delay* signifie que quelque chose arrive plus tard que prévu.'
    example_gloss: Un retard peut faire arriver tout le monde en retard.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: reporter à une autre date
    note: '*reschedule* signifie choisir un nouvel horaire pour un rendez-vous ou une réunion.'
    example_gloss: Si le médecin est très occupée, on reporte le rendez-vous.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Une condition réelle avec son résultat
    gloss: Si la réunion commence en retard, j’envoie un message à tout le monde.
    note: 'Pour une condition réelle dans le futur, on met le présent après *if* : *If the meeting starts late*, et non *will start*.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Une condition négative
    gloss: Si le rapport n’est pas prêt, nous reporterons la relecture.
    note: '*if ... not* rend la condition négative.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Conditions réelles au futur
    gloss: Si ça commence en retard, j’envoie un message. Si le rapport n’est pas prêt, nous reporterons la relecture.
    note: Après *if*, on met le présent, et dans le résultat on trouve souvent *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: plan de secours, plan B
    note: '*backup plan* désigne un plan supplémentaire pour le cas où le premier ne fonctionne pas.'
    example_gloss: Il nous faut un plan de secours au cas où la salle serait occupée.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: reporter la mise à jour
    note: '*move the update* signifie traiter la mise à jour à un autre moment.'
    example_gloss: Si Leila est en retard, on reporte sa mise à jour à demain.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Texte : le plan de secours'
    gloss: Daniel rédige un plan de secours pour la réunion d’équipe. Si la salle de conférence est libre, l’équipe s’y retrouvera à dix heures. Si la salle est occupée, ils se réuniront en ligne. À moins que Leila ne se connecte avant dix heures, Daniel reportera sa mise à jour à demain. Si le rapport n’est pas prêt, Mia enverra à la place une mise à jour plus courte.
    note: Un court texte avec des conditions réelles, des résultats et *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia demande des infos sur le plan
    gloss: 'Mia dit : Daniel, qu’est-ce qu’on fait si la réunion commence en retard ?'
    note: Une question sur le résultat d’une condition possible.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel donne le résultat
    gloss: 'Daniel dit : Si ça commence en retard, j’enverrai un message à tout le monde.'
    note: '*If it starts late, I will...* relie une possibilité réelle à une action concrète.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia demande des nouvelles de Leila
    gloss: 'Mia dit : Et si Leila ne peut pas se joindre à nous ?'
    note: Une courte question de relance avec la même structure conditionnelle.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel utilise 'unless'
    gloss: 'Daniel dit : À moins qu’elle ne nous rejoigne avant dix heures, on reportera sa mise à jour à demain.'
    note: '*unless she joins by ten* signifie : si elle ne nous rejoint pas d’ici dix heures.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia demande des infos sur la salle
    gloss: 'Mia dit : Ça me paraît raisonnable. Et si la salle est encore occupée, on se réunit en ligne ?'
    note: Mia vérifie le plan de secours pour une salle occupée.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel confirme le plan en ligne
    gloss: 'Daniel dit : Oui, si la salle est occupée, on se réunira en ligne à la place.'
    note: '*instead* signifie que ce plan remplace l’autre.'
