course:
  title: Anglais B1
  description: 'Apprends l’anglais au niveau B1 : obligations, possibilités, situations hypothétiques et récits du quotidien, avec des explications détaillées en français.'
units:
  en.b1.unit07.conditions:
    title: Si cela arrive, on fait ça
lessons:
  en.b1.unit07.lesson01.condition_vocabulary:
    title: If, unless, condition et result
  en.b1.unit07.lesson02.real_conditions:
    title: If it starts late, I will send a message
  en.b1.unit07.lesson03.reading_a_meeting_plan:
