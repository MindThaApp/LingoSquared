teaching:
  en.a2.unit34.lesson01.teach.refund:
    title: refund
    gloss: remboursement
    note: '*refund* signifie qu’on récupère son argent.'
    example_gloss: Je voudrais être remboursé(e) pour ce mixeur.
  en.a2.unit34.lesson01.teach.exchange:
    title: exchange
    gloss: échange / échanger
    note: '*exchange* signifie échanger un article contre un autre.'
    example_gloss: Souhaitez-vous un remboursement ou préférez-vous un échange ?
  en.a2.unit34.lesson01.teach.receipt:
    title: receipt
    gloss: ticket de caisse
    note: '*receipt* désigne le ticket de caisse qui prouve qu’on a acheté quelque chose.'
    example_gloss: Avez-vous votre ticket de caisse ?
  en.a2.unit34.lesson01.teach.return_policy:
    title: return policy
    gloss: conditions de retour
    note: '*return policy* désigne les règles d’un magasin sur la façon dont les articles peuvent être retournés.'
    example_gloss: Selon les conditions de retour du magasin, vous avez 30 jours.
  en.a2.unit34.lesson01.teach.defective:
    title: defective
    gloss: défectueux
    note: '*defective* signifie cassé ou qui ne fonctionne pas correctement.'
    example_gloss: Le mixeur était défectueux, alors je l’ai rapporté.
  en.a2.unit34.lesson02.teach.return_blender_stopped_working:
    title: Rapporter un article défectueux
    gloss: Je voudrais rapporter ce mixeur. Il a cessé de fonctionner après une seule utilisation.
    note: '*I''d like to return...* est une façon polie de rapporter un article.'
  en.a2.unit34.lesson02.teach.refund_or_exchange_question:
    title: La vendeuse propose un choix
    gloss: Souhaitez-vous un remboursement ou un échange ?
    note: Avec *Would you like...or...?*, tu proposes un choix.
  en.a2.unit34.lesson02.teach.id_like_a_refund:
    title: Demander un remboursement
    gloss: Je voudrais être remboursé(e), s’il vous plaît.
    note: '*I''d like..., please* est une façon polie de demander quelque chose.'
  en.a2.unit34.lesson03.teach.within_30_days:
    title: Dire dans quel délai on peut retourner un article
    gloss: Les articles peuvent être retournés dans un délai de 30 jours, sur présentation du ticket de caisse.
    note: '*within 30 days* signifie dans un délai de 30 jours.'
  en.a2.unit34.lesson03.teach.policy_text:
    title: Texte d'une politique de retour
    gloss: 'Conditions de retour : les articles peuvent être retournés dans un délai de 30 jours, sur présentation du ticket de caisse. Les articles défectueux peuvent être échangés ou remboursés à tout moment.'
    note: Des conditions de retour formelles, avec un délai et une exception pour les articles défectueux.
  en.a2.unit34.lesson03.teach.i_have_my_receipt:
    title: Dire qu'on a son ticket de caisse
    gloss: J’ai mon ticket de caisse de la semaine dernière.
    note: '*from last week* signifie de la semaine dernière.'
  en.a2.unit34.lesson04.teach.q_return_blender:
    title: Leila rapporte le mixeur
    gloss: 'Leila dit : Bonjour, je voudrais rapporter ce mixeur. Il a cessé de fonctionner après une seule utilisation.'
    note: Ce sont les mêmes phrases que dans la leçon 2, cette fois avec une formule de salutation.
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt:
    title: Le vendeur demande le ticket de caisse
    gloss: 'Le vendeur dit : Je suis désolé de l’apprendre. Avez-vous votre ticket de caisse ?'
    note: '*I''m sorry to hear that* est une façon polie de montrer de la compassion.'
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week:
    title: Leila confirme l'achat
    gloss: 'Leila dit : Oui, le voici. J’ai acheté le mixeur la semaine dernière.'
    note: Leila présente son ticket de caisse et dit quand elle a acheté le mixeur.
  en.a2.unit34.lesson04.teach.a_refund_or_exchange:
    title: Le vendeur propose un choix
    gloss: 'Le vendeur dit : Merci. Souhaitez-vous un remboursement ou un échange ?'
    note: C’est la même question que dans la leçon 2.
  en.a2.unit34.lesson04.teach.q_id_like_a_refund:
    title: Leila choisit le remboursement
    gloss: 'Leila dit : Je voudrais être remboursée, s’il vous plaît.'
    note: C’est la même phrase que dans la leçon 2.
  en.a2.unit34.lesson04.teach.a_refund_thirty_five:
    title: Le vendeur rembourse l'argent
    gloss: 'Le vendeur dit : Pas de problème. Voici votre remboursement : trente-cinq dollars.'
    note: Le vendeur règle la réclamation et indique le montant exact.
