teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: se plaindre, faire une réclamation
    note: '*complain* signifie dire officiellement que quelque chose ne va pas ou n’est pas satisfaisant.'
    example_gloss: Mia a décidé de faire une réclamation au sujet de la chaise endommagée.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: endommagé, abîmé
    note: '*damaged* décrit un produit cassé ou abîmé.'
    example_gloss: La chaise est arrivée endommagée.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: remboursement
    note: '*refund* désigne l’argent rendu pour un produit retourné ou défectueux.'
    example_gloss: Mia a demandé un remboursement.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: remplacement, article de remplacement
    note: '*replacement* désigne un nouvel article donné à la place d’un article défectueux.'
    example_gloss: L’entreprise a proposé un remplacement à la place.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: résoudre, régler
    note: '*resolve* signifie régler complètement un problème.'
    example_gloss: Le conseiller a promis de régler rapidement le problème.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: problème, souci
    note: '*issue* désigne un problème dont il faut s’occuper.'
    example_gloss: Mia a expliqué clairement le problème.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + Nomen
    gloss: Je vous écris pour me plaindre d’un produit endommagé.
    note: '*I''m writing to complain about* ouvre poliment une réclamation écrite.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + Nomen
    gloss: Je voudrais un remboursement pour cet article.
    note: '*I would like a refund for* demande poliment le remboursement de l’argent.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Der Aufbau einer höflichen Beschwerde
    gloss: 'Une réclamation écrite polie comporte généralement trois parties : nommer le problème (I''m writing to complain about...), dire ce qui s’est déjà passé (it arrived damaged / it stopped working) et demander une solution précise (I would like a refund / I would like a replacement).'
    note: 'Forme : nommer le problème, dire ce qui s’est passé, demander une solution précise.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: chaise de bureau
    note: '*desk chair* désigne une chaise sur laquelle on s’assoit à un bureau.'
    example_gloss: Mia a commandé une nouvelle chaise de bureau pour son bureau à domicile.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: dès que possible
    note: '*as soon as possible* signifie sans retard inutile.'
    example_gloss: Mia a demandé à recevoir un remplacement dès que possible.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Beschwerde über einen Bürostuhl'
    gloss: Madame, Monsieur, équipe GreenDesk, je vous écris pour me plaindre d’un produit endommagé. J’ai commandé la semaine dernière une chaise de bureau pour mon bureau à domicile, mais elle est arrivée avec une roulette cassée. Je voudrais un remplacement dès que possible. Merci de m’indiquer comment procéder. Cordialement, Mia
    note: Une courte lettre de réclamation polie.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia ruft an, um sich über den Bürostuhl zu beschweren
    gloss: 'Mia dit : Bonjour, j’appelle pour faire une réclamation au sujet d’une chaise de bureau que j’ai commandée.'
    note: '*I''m calling to complain about* ouvre poliment une réclamation par téléphone.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Der Mitarbeiter fragt nach dem Problem
    gloss: 'Le conseiller dit : Je suis désolé de l’apprendre. Quel est le problème ?'
    note: '*I''m sorry to hear that* est une réaction polie et empathique.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia beschreibt das Problem
    gloss: 'Mia dit : Elle est arrivée avec une roulette cassée, donc je ne peux pas l’utiliser.'
    note: '*it arrived with a broken wheel* explique ce qui s’est déjà passé.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet eine Lösung an
    gloss: 'Le conseiller dit : Je comprends. Souhaitez-vous un remboursement ou un remplacement ?'
    note: '*would you like... or...* donne un choix au client.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia entscheidet sich für einen Ersatz
    gloss: 'Mia dit : Je préférerais un remplacement, si c’est possible.'
    note: '*I would prefer a replacement, if that''s possible* exprime poliment une préférence.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Der Mitarbeiter bestätigt die Lösung
    gloss: 'Le conseiller dit : Bien sûr. Nous allons régler cela et vous envoyer une nouvelle chaise d’ici vendredi.'
    note: '*we''ll resolve this and send... by Friday* est une promesse concrète, avec une date.'
