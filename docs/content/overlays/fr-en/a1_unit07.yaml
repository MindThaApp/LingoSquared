    title: No, that's all, thanks.
    gloss: Non, ce sera tout, merci.
    note: '*that’s all* veut dire « ce sera tout ».'
  en.a1.unit07.lesson02.teach.for_here_or_to_go:
    title: For here or to go?
    gloss: Sur place ou à emporter ?
    note: '*For here* veut dire « sur place » (tu manges ou bois au café), *to go* veut dire « à emporter ».'
  en.a1.unit07.lesson03.teach.menu:
    title: menu
    gloss: la carte
    note: '*menu* désigne la carte, la liste des plats et des boissons proposés.'
    example_gloss: Je lis la carte.
