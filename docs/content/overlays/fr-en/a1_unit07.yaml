  en.a1.unit07.lesson03.teach.menu_text:
    title: Cafe Menu
    gloss: 'Carte du café : Café - 3 dollars. Thé - 2 dollars. Soupe - 5 dollars. Sandwich - 6 dollars.'
    note: Le signe du dollar se place AVANT le nombre (*$3*), alors qu’en français le symbole de l’euro se place APRÈS (3 €).
  en.a1.unit07.lesson04.teach.thats_x_dollars:
    title: That's nine dollars.
    gloss: Ça fait neuf dollars.
    note: En anglais américain, on paie en *dollars* et non en euros ; la structure *That’s X dollars* correspond au français « Ça fait X euros ».
  en.a1.unit07.lesson04.teach.q_order:
    title: Leila commande
    gloss: 'Leila : Bonjour, je voudrais un café et un sandwich, s’il vous plaît.'
    note: '*Hi* est une salutation décontractée, courante dans un café.'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: Relance du serveur
    gloss: 'Le serveur : Bien sûr. Autre chose ?'
    note: '*Sure* veut dire ici « bien sûr » ou « avec plaisir ».'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Réponse de Leila
    gloss: 'Leila : Non, ce sera tout, merci.'
    note: Une réponse complète confirme que la commande est terminée.
  en.a1.unit07.lesson04.teach.q_for_here:
    title: Question du serveur
    gloss: 'Le serveur : Sur place ou à emporter ?'
    note: On entend souvent cette question dans les cafés américains après la commande.
  en.a1.unit07.lesson04.teach.reply_for_here:
    title: Réponse de Leila
    gloss: 'Leila : Sur place, s’il vous plaît.'
    note: '*For here* montre que Leila veut rester au café.'
  en.a1.unit07.lesson04.teach.closing_price:
    title: Fin de l'échange avec le serveur
    gloss: 'Le serveur : D’accord, ça fait neuf dollars.'
    note: '*OK* introduit le prix final.'
