  en.a1.unit09.lesson04.teach.excuse_me:
    title: Excuse me, where is the pharmacy?
    gloss: Excusez-moi, où est la pharmacie ?
    note: '*Excuse me* sert à aborder poliment un inconnu.'
  en.a1.unit09.lesson04.teach.q_pharmacy:
    title: Question de Daniel
    gloss: 'Daniel : Excusez-moi, où est la pharmacie ?'
    note: Daniel aborde poliment Leila avec *Excuse me*.
  en.a1.unit09.lesson04.teach.a_across:
    title: Réponse de Leila
    gloss: 'Leila : Elle est en face de l’hôpital.'
    note: Leila indique l’emplacement par rapport à l’hôpital.
