    title: Relance de Daniel
    gloss: 'Daniel : C’est loin d’ici ?'
    note: Daniel veut savoir s’il peut y aller à pied.
  en.a1.unit09.lesson04.teach.a_not_far_between:
    title: Réponse plus précise de Leila
    gloss: 'Leila : Non, ce n’est pas loin. Elle est entre la banque et le parc.'
    note: Leila rassure Daniel et donne une description plus précise de l’emplacement.
