teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: atténuer ses propos, formuler avec prudence
    note: '*hedge* signifie rendre une affirmation moins catégorique. Ne traduis pas systématiquement « un peu » par *a little*.'
    example_gloss: Leila utilise seems pour formuler plus prudemment son affirmation sur la politique.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: restreindre ou nuancer
    note: '*qualify* signifie restreindre une affirmation par une condition ou une exception.'
    example_gloss: L'expression « provided we agree » restreint le soutien de Leila.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: mettre en avant, insister sur
    note: '*emphasize* signifie renforcer une partie de ton message.'
    example_gloss: Daniel insiste sur le problème de la charge de travail.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: dans une certaine mesure
    note: '*to some extent* sonne souvent plus naturel que d''employer *a little* partout.'
    example_gloss: Dans une certaine mesure, la politique répond aux inquiétudes de l'équipe.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: globalement, dans l'ensemble
    note: '*broadly* exprime un soutien ou une vérité d''ordre général, avec une marge pour les exceptions.'
    example_gloss: La proposition est globalement utile, même si elle n'est pas parfaite.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: à condition que, pourvu que
    note: '*provided* introduit une condition. Il correspond à « à condition que », mais en anglais il sonne souvent formel et professionnel.'
    example_gloss: Nous pouvons soutenir la politique, à condition que nous soyons d'accord.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Prudence et insistance
    gloss: La politique semble raisonnable, mais elle crée bel et bien du travail supplémentaire pour l'équipe.
    note: '*seems* rend l''affirmation positive plus prudente ; *does create* insiste sur le fait que le travail supplémentaire apparaît réellement. En français, on le rend par « bel et bien » : elle crée bel et bien du travail en plus.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Se concentrer sur une inquiétude
    gloss: Ce qui m'inquiète, c'est le travail supplémentaire pour l'équipe.
    note: '*What worries me is...* place un point en tête pour le mettre en avant. Garde ensuite l''ordre anglais : *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Soutien général sous condition
    gloss: C'est globalement utile, à condition que le calendrier soit ajusté.
    note: '*broadly useful, provided...* exprime un soutien assorti d''une condition claire.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Nuance et insistance
    gloss: Utilise seems, broadly ou to some extent pour atténuer ou restreindre une affirmation. Utilise do ou does devant le verbe principal pour insister sur le fait que quelque chose est vrai. Utilise What matters is... ou What worries me is... pour attirer l'attention sur un point.
    note: 'Pour un francophone, c''est surtout *does create* qui est nouveau : cela ne veut pas dire « fait créer », mais renforce *create*, un peu comme « bel et bien » en français.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: dans l'ensemble, globalement
    note: '*overall* porte sur l''ensemble, même s''il y a des détails ou des exceptions.'
    example_gloss: Dans l'ensemble, Leila soutient la politique.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: condition
    note: '*condition* est ce qui doit être rempli avant que quelque chose s''applique.'
    example_gloss: Sa condition est que le calendrier soit ajusté.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Texte : un soutien sous conditions'
    gloss: 'Le retour de Leila est positif, mais soigneusement nuancé. Elle dit que la politique de relecture semble raisonnable dans l''ensemble, ce qui atténue son propos et évite de paraître catégorique. Elle dit aussi qu''elle est globalement utile, à condition que le calendrier soit ajusté. Cette condition limite son soutien : elle n''accepte pas la politique telle qu''elle est écrite. Daniel insiste sur un autre point avec une construction de mise en relief : ce qui l''inquiète, c''est le travail supplémentaire pour l''équipe. Les deux soutiennent la politique sur le principe, mais leur langage montre des degrés d''engagement différents.'
    note: Le texte montre comment rendre un même contenu plus doux, plus fort ou plus conditionnel.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila formule avec prudence
    gloss: 'Leila dit : La nouvelle politique de relecture semble raisonnable dans l''ensemble.'
    note: '*seems reasonable overall* est plus positif qu''une critique, mais n''est pas catégorique.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel perçoit la prudence
    gloss: 'Daniel dit : Cela sonne un peu prudent. Tu veux dire qu''elle n''est pas tout à fait prête ?'
    note: Daniel remarque que Leila ne dit pas simplement *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila nuance davantage
    gloss: 'Leila dit : Exactement. Elle est peut-être applicable, mais elle a besoin d''échéances plus claires.'
    note: '*may be workable* laisse place au doute ; *but* énonce la restriction.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel met l'accent
    gloss: 'Daniel dit : Je suis d''accord. Ce qui m''inquiète, c''est le travail supplémentaire pour l''équipe.'
    note: '*What worries me is...* met l''accent sur une inquiétude.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila insiste avec does
    gloss: 'Leila dit : C''est juste. La politique apporte bel et bien de meilleurs contrôles de qualité, mais elle ajoute aussi une étape d''approbation.'
    note: '*does create* insiste sur le fait que cet avantage existe réellement, malgré la restriction qui suit.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel résume la condition
    gloss: 'Daniel dit : Donc nous devrions la soutenir sous conditions ?'
    note: Il résume le soutien nuancé de Leila.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila donne un soutien conditionnel
    gloss: 'Leila dit : Oui. Je dirais qu''elle est globalement utile, à condition que le calendrier soit ajusté.'
    note: '*provided* signifie ici « à condition que » : le soutien ne vaut que si la condition est remplie.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Même contenu, trois degrés de force
    gloss: La politique crée du travail supplémentaire. La politique semble créer du travail supplémentaire. La politique crée bel et bien du travail supplémentaire.
    note: Les trois phrases font travailler la forme neutre, la forme plus prudente avec *seems to*, et la forme plus insistante avec *does*.
