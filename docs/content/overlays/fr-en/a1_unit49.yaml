  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in:
    title: Which bin does this go in?
    gloss: Dans quelle poubelle ça va ?
    note: '*go in* signifie ici « aller dans », au sens de « avoir sa place dans ».'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: Ça va dans la poubelle de recyclage.
    note: '*This goes in the recycling bin.* signifie « ça va dans la poubelle de recyclage ».'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: La poubelle verte est pour le verre.
    note: '*is for ...* signifie « est pour ... » ou « sert à ... », pour dire à quoi quelque chose est destiné.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Tu peux sortir les poubelles ?
    note: '*take out* est un verbe à particule séparable : *take out the trash* et *take the trash out* sont tous deux corrects. Le français, lui, n’a pas de particule : « sortir » se place simplement avant son complément.'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: Le jour de collecte est mardi.
    note: '*Collection day is on Tuesday.* signifie « le jour de collecte est mardi ».'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: Et le papier et les déchets alimentaires ?
    note: '*What about ...?* signifie « et ... ? » ou « qu’en est-il de ... ? », pour poser une question sur autre chose.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: L’avertissement de Mia
    gloss: 'Mia dit : Attends, ce bocal en verre ne va pas dans les ordures !'
    note: '*doesn''t go in the trash* signifie « ne va pas dans les ordures ».'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Les excuses de Daniel
    gloss: 'Daniel dit : Oh non, pardon ! Dans quelle poubelle ça va ?'
    note: '*Which bin does it go in?* reprend la forme de question qu’on vient d’apprendre.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia explique
    gloss: 'Mia dit : Ça va dans la poubelle verte. Ici, on recycle le verre.'
    note: '*We recycle glass here.* signifie « ici, on recycle le verre ».'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: La question de Daniel
    gloss: 'Daniel demande : Et le papier et les déchets alimentaires ?'
    note: Reprise de la question *What about ...?* déjà apprise.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: L’explication de Mia
    gloss: 'Mia dit : Le papier va dans la poubelle bleue, et les déchets alimentaires vont dans la poubelle marron.'
    note: '*goes in ..., and ... goes in ...* reprend la même structure pour deux types de déchets différents.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: La question de Daniel sur le jour de collecte
    gloss: 'Daniel dit : Compris. C’est quand, le jour de collecte ?'
    note: '*Got it.* est une façon familière de dire « compris ».'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Réponse de Mia"
    gloss: 'Mia dit : Les bacs de recyclage sortent le mardi, et les ordures le vendredi.'
    note: 'Remarque : Mia donne ici deux jours différents pour deux types de déchets -- mardi pour le recyclage, vendredi pour les ordures ordinaires.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: La promesse de Daniel
    gloss: 'Daniel dit : Merci ! La prochaine fois, je trierai tout correctement.'
    note: '*I''ll sort everything correctly next time.* signifie « la prochaine fois, je trierai tout correctement ».'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Texte sur le fonctionnement du tri des déchets
    gloss: 'Comment trier ses déchets : dans beaucoup d’immeubles, il y a des poubelles différentes pour chaque type de déchets. Le verre va généralement dans la poubelle verte, et le papier dans la poubelle bleue. Les déchets alimentaires vont dans la poubelle marron, et tout le reste dans la poubelle noire des ordures ordinaires. Il est utile de connaître ton jour de collecte, car les poubelles ne sont ramassées qu’une fois par semaine. Daniel s’exerce aux recettes du livre de cuisine qu’il a emprunté à la bibliothèque, et il cuisine souvent avec Mia chez elle. Hier soir, il a préparé une recette du livre, et ensuite il a failli jeter un bocal en verre dans les ordures ordinaires. Mia l’a arrêté et lui a montré comment son immeuble trie les déchets. Elle lui a expliqué que les bacs de recyclage sortent le mardi, et les ordures ordinaires le vendredi. Daniel l’a remerciée et a dit qu’il triera tout correctement désormais.'
    note: '*almost put a glass jar in the regular trash* signifie « a failli jeter un bocal en verre dans les ordures ordinaires ».'
