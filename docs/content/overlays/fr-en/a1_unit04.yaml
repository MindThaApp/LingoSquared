teaching:
  en.a1.unit04.lesson01.teach.monday:
    title: Monday
    gloss: lundi
    note: '*Monday* veut dire lundi ; en anglais, les jours de la semaine prennent toujours une majuscule, contrairement au français.'
    example_gloss: Je suis disponible lundi.
  en.a1.unit04.lesson01.teach.tuesday:
    title: Tuesday
    gloss: mardi
    note: '*Tuesday* veut dire mardi.'
    example_gloss: Je suis disponible mardi.
  en.a1.unit04.lesson01.teach.wednesday:
    title: Wednesday
    gloss: mercredi
    note: '*Wednesday* veut dire mercredi ; le premier *d* ne se prononce pas.'
    example_gloss: Je suis disponible mercredi.
  en.a1.unit04.lesson01.teach.thursday:
    title: Thursday
    gloss: jeudi
    note: '*Thursday* veut dire jeudi.'
    example_gloss: Je suis disponible jeudi.
  en.a1.unit04.lesson01.teach.friday:
    title: Friday
    gloss: vendredi
    note: '*Friday* veut dire vendredi ; dans le calendrier américain, c’est un jour ouvré normal, pas un jour de congé.'
    example_gloss: Je suis disponible vendredi.
  en.a1.unit04.lesson01.teach.saturday:
    title: Saturday
    gloss: samedi
    note: '*Saturday* veut dire samedi ; dans le calendrier américain, il fait partie du week-end.'
    example_gloss: Je suis disponible samedi.
  en.a1.unit04.lesson01.teach.sunday:
    title: Sunday
    gloss: dimanche
    note: '*Sunday* veut dire dimanche ; dans le calendrier américain, la semaine commence en général par le dimanche, et non par le lundi comme en France.'
    example_gloss: Je suis disponible dimanche.
  en.a1.unit04.lesson01.teach.what_day:
    title: What day is it today?
    gloss: Quel jour est-on aujourd’hui ?
    note: '*What day is it today?* demande le jour de la semaine, pas la date complète.'
  en.a1.unit04.lesson02.teach.january:
    title: January
    gloss: janvier
    note: '*January* est le premier mois de l’année.'
    example_gloss: Mon anniversaire est en janvier.
  en.a1.unit04.lesson02.teach.march:
    title: March
    gloss: mars
    note: '*March* est le troisième mois de l’année.'
    example_gloss: Mon anniversaire est en mars.
  en.a1.unit04.lesson02.teach.july:
    title: July
    gloss: juillet
    note: '*July* est le septième mois de l’année.'
    example_gloss: Mon anniversaire est en juillet.
  en.a1.unit04.lesson02.teach.september:
    title: September
    gloss: septembre
    note: '*September* est le neuvième mois de l’année.'
    example_gloss: Mon anniversaire est en septembre.
  en.a1.unit04.lesson02.teach.december:
    title: December
    gloss: décembre
    note: '*December* est le dernier mois de l’année.'
    example_gloss: Mon anniversaire est en décembre.
  en.a1.unit04.lesson02.teach.which_month:
    title: Which month is it?
    gloss: Quel mois sommes-nous ?
    note: '*Which month is it?* demande le mois en cours.'
  en.a1.unit04.lesson03.teach.whats_the_date:
    title: What's today's date?
    gloss: On est le combien aujourd’hui ?
    note: '*What’s today’s date?* demande la date complète, pas seulement le jour de la semaine.'
  en.a1.unit04.lesson03.teach.its_july_7:
    title: It's July 7th.
    gloss: On est le 7 juillet.
    note: 'En anglais américain, le mois se place AVANT le jour : *July 7th*. C’est l’inverse de l’ordre français, où le jour passe en premier (7 juillet).'
  en.a1.unit04.lesson03.teach.its_tuesday_july_7:
    title: It's Tuesday, July 7th.
    gloss: On est mardi 7 juillet.
    note: 'Le jour de la semaine précède la date complète : [jour de la semaine], [mois] [jour].'
  en.a1.unit04.lesson03.teach.numeric_form:
    title: You can also write it as 7/7.
    gloss: On peut aussi l’écrire 7/7.
    note: 'Attention : dans l’écriture américaine des dates, le format est mois/jour (*7/7* = 7 juillet), et non jour/mois comme en français (7/7). Cette différence crée de vraies confusions : *7/9* signifie le 9 juillet, et non le 7 septembre.'
  en.a1.unit04.lesson03.teach.birthday_question:
    title: When's your birthday?
    gloss: Quand est ton anniversaire ? / Quand est votre anniversaire ?
    note: '*When’s your birthday?* demande la date de naissance.'
  en.a1.unit04.lesson03.teach.birthday_answer:
    title: My birthday is March 3rd.
    gloss: Mon anniversaire est le 3 mars.
    note: Pour l’anniversaire, on emploie le verbe *is*, comme pour la date du jour.
  en.a1.unit04.lesson04.teach.opens:
    title: opens
    gloss: ouvre
    note: '*opens* est la troisième personne du singulier de *open* (ouvrir).'
    example_gloss: La bibliothèque ouvre jeudi.
  en.a1.unit04.lesson04.teach.again:
    title: again
    gloss: de nouveau / à nouveau
    note: '*again* veut dire de nouveau ou à nouveau.'
    example_gloss: On se revoit bientôt !
  en.a1.unit04.lesson04.teach.q_date:
    title: Daniel demande la date
    gloss: 'Daniel : On est le combien aujourd’hui ?'
    note: La même question que celle apprise plus haut, cette fois dans une vraie conversation.
  en.a1.unit04.lesson04.teach.a_date:
    title: Réponse sur la date
    gloss: 'Leila : On est mardi 7 juillet.'
    note: Une réponse complète donne à la fois le jour de la semaine et la date.
  en.a1.unit04.lesson04.teach.q_library:
    title: Demander quand ça rouvre
    gloss: 'Daniel : Quand est-ce que la bibliothèque rouvre ?'
    note: '*When’s the library open again?* demande la date de réouverture.'
  en.a1.unit04.lesson04.teach.a_library:
    title: Réponse sur la réouverture
    gloss: 'Leila : Elle ouvre jeudi 9 juillet.'
    note: '*It opens on Thursday, July 9th* ; la préposition *on* se place devant le jour de la semaine (en français, on n’en met pas : « jeudi »).'
  en.a1.unit04.lesson04.teach.closing:
    title: Terminer la conversation
    gloss: 'Daniel dit : Parfait, à ce moment-là, alors !'
    note: '*See you then* veut dire qu’on se reverra au moment dont on vient de parler.'
