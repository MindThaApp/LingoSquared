  it.a1.unit56.lesson05.teach.al_caffe_linguistico:
    title: Текст о пожаре
    gloss: 'В языковом кафе в библиотеке пожар. Сотрудник говорит: «Идите к аварийному выходу!» Нине нужна помощь. Джулия с Ниной. Марко вызывает пожарных. Все снаружи. Всё хорошо!'
    note: Краткий пересказ сцены с пожаром в настоящем времени, слова сотрудника переданы прямой речью.
    glosses:
      caffè: кафе (caffè linguistico = языковое кафе)
      biblioteca: библиотека
      incendio: пожар
      dipendente: сотрудник
      dice: говорит
      Andate: идти (andate = идите, повелительное наклонение во мн. числе)
      emergenza: аварийный (uscita di emergenza = аварийный выход)
      aiuto: помощь
      bisogno: нужда (ho bisogno di = мне нужно)
      chiama: звонит, вызывает
      vigili: пожарные (vigili del fuoco = пожарная служба)
      tutti: все
      fuori: снаружи
      bene: хорошо (va bene = всё хорошо)
  it.a1.unit56.lesson05.teach.sono_tutti_fuori:
    title: Все снаружи
    gloss: Все снаружи. Это хорошо.
  it.a1.unit56.lesson06.teach.luca_ciao_cosa:
    title: Лука спрашивает, что случилось
    gloss: 'Лука: Привет! Что происходит?'
  it.a1.unit56.lesson06.teach.marco_il_dipendente:
    title: Марко пересказывает объявление
    gloss: 'Марко: Сотрудник говорит: «Идите к аварийному выходу! Пожар!»'
  it.a1.unit56.lesson06.teach.giulia_calma_luca:
    title: Джулия успокаивает Луку
    gloss: 'Джулия: Спокойно, Лука. Все снаружи. Всё хорошо.'
