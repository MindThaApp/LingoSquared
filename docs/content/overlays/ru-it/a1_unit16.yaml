teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male:
    title: mi fa male
    gloss: болит / болят
    note: '*mi fa male* буквально значит «мне делает больно»: после этого выражения называют часть тела, которая болит.'
    example_gloss:
    - У меня болит голова.
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: голова, живот, горло
    note: Три распространённые части тела, которые употребляются с *mi fa male*, когда говорят о боли.
    example_gloss:
    - У меня болит живот.
    - У меня болит горло.
  it.a1.unit16.lesson01.teach.cosa_hai:
    title: Cosa hai?
    gloss: Что случилось?
    note: '*Cosa hai?* (буквально «Что у тебя?») — так спрашивают, что беспокоит человека.'
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: У меня болит голова.
    note: '*la testa* (голова) — существительное женского рода, поэтому с ним употребляется *la*.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: я плохо себя чувствую
    note: '*mi sento* (я чувствую себя) плюс *bene* (хорошо); *non* добавляет отрицание: так говорят, что чувствуют себя плохо.'
    example_gloss:
    - Сегодня я плохо себя чувствую.
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: температура, кашель
    note: 'Распространённые симптомы; они употребляются с глаголом *avere* (иметь): *Ho la febbre* (У меня температура).'
    example_gloss:
    - У меня температура.
    - У меня кашель.
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase:
    title: Non mi sento bene.
    gloss: Я плохо себя чувствую.
    note: Общая фраза о плохом самочувствии; её удобно сказать перед тем, как назвать конкретный симптом.
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse:
    title: Ho la febbre e la tosse.
    gloss: У меня температура и кашель.
    note: '*Ho* (у меня есть) плюс два симптома, соединённых союзом *e* (и).'
  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa:
    title: il dottore, la dottoressa
    gloss: врач (мужчина), врач (женщина)
    note: '*il dottore* и *la dottoressa* — мужская и женская формы слова «врач».'
    example_gloss:
    - Мне нужно к врачу.
    - Мне нужно к врачу (женщине).
  it.a1.unit16.lesson03.teach.riposa_la_medicina:
    title: riposa, la medicina
    gloss: отдыхай!, лекарство
    note: '*riposa* — повелительное наклонение на «ты» от глагола *riposare* (отдыхать); *la medicina* — лекарство.'
    example_gloss:
    - Сегодня отдыхай.
    - Прими это лекарство.
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore:
    title: Devo andare dal dottore.
    gloss: Мне нужно к врачу.
    note: '*Devo* (я должен / мне нужно) плюс *andare dal dottore* (пойти к врачу); *dal* — это слияние *da* + *il*.'
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa:
    title: Prendi questa medicina e riposa.
    gloss: Прими это лекарство и отдыхай.
    note: '*Prendi* (прими, повелительное наклонение на «ты») плюс *questa medicina* (это лекарство) и *riposa* (отдыхай).'
