teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: кофе, круассан
    note: 'Оба существительных мужского рода (*il*): *caffè* — обычный итальянский эспрессо, *cornetto* — типичная выпечка к завтраку. В русском слово «кофе» тоже мужского рода, а вот «круассан» итальянцы называют cornetto.'
    example_gloss:
    - Мне, пожалуйста, кофе.
    - Мне, пожалуйста, круассан.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: бутерброд, вода
    note: '*panino* мужского рода (*il*); *acqua* женского рода, но перед гласной принимает *l''*.'
    example_gloss:
    - Мне, пожалуйста, бутерброд.
    - Мне, пожалуйста, воду.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: Что вы желаете?
    note: Вежливый вопрос на *Lei* (на «вы»), который бариста задаёт клиенту.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Мне, пожалуйста, кофе и круассан.
    note: '*Vorrei* («я хотел бы») — вежливый способ сделать заказ; *e* («и») добавляет второй пункт.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Два кофе, пожалуйста.
    note: '*due* («два») ставится вместо артикля, когда заказывают больше одного.'
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: А для вас?
    note: '*E per Lei?* — вопрос ко второму клиенту, что он желает, с вежливым *Lei* (на «вы»).'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: Это всё, спасибо.
    note: Стандартная фраза, чтобы завершить заказ, когда больше ничего не нужно.
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: меню, счёт
    note: Оба существительных мужского рода (*il*).
    example_gloss:
    - Счёт, пожалуйста.
  it.a1.unit07.lesson03.teach.panino_acqua_conto:
    title: Un panino e un'acqua, per favore.
    gloss: Бутерброд и воду, пожалуйста.
    note: В *un'acqua* используется форма *una* с апострофом перед словом *acqua*, которое начинается с гласной.
