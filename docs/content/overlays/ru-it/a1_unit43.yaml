course:
  title: Итальянский язык A1
  description: 'Итальянский для начинающих: разговор о домашних и других животных — как их называть, как за ними ухаживать (гулять, кормить, играть), как сказать, что любишь животных, даже если у тебя их нет, и как образуется множественное число в итальянском.'
units:
  it.a1.unit43.animali:
    title: Животные и питомцы
