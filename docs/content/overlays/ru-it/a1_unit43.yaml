    title: Птица Нины
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Animale* — общее слово; *animale domestico* значит «домашнее животное» (буквально «домашний зверь»).'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Джулии есть собака.
    - У Луки есть кот.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: '*Hai ...?* — форма *tu* глагола *avere*. Утверждение становится вопросом только благодаря интонации.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: 'Чтобы сказать, что у тебя чего-то нет, поставь *non* перед глаголом: *non ho*. Смотри пояснение по грамматике.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non перед глаголом
    gloss: 'Чтобы сказать, что у тебя чего-то нет, поставь non перед глаголом: Non ho tempo, Non ho animali domestici.'
    note: 'После *non ho* существительное обычно идёт без артикля: *non ho tempo*, *non ho animali*. В русском в таких случаях используется родительный падеж («нет времени»), в итальянском падежей нет.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*Portare a spasso* — устойчивое выражение: «выгуливать животное». Местоимение стоит перед глаголом: *lo porto a spasso*.'
    example_gloss: Я выгуливаю собаку каждый день.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Местоимения стоят перед глаголом
    gloss: 'Местоимение lo заменяет слово «собака» и стоит перед глаголом: lo porto a spasso, gli do da mangiare.'
    note: 'В русском местоимение обычно стоит после глагола («гуляю с ним»), а в итальянском *lo* и *gli* ставятся перед глаголом: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Играть с
    gloss: играть с
    example_gloss: Лука играет со своим котом.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: '*Ogni giorno* («каждый день») ставится в конце предложения: *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: '*Dare da mangiare* («кормить») буквально значит «давать есть». *Do* — форма *io* глагола *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Множественное число: il cane -> i cani'
    gloss: 'Во множественном числе меняются последняя гласная и артикль: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Здесь впервые вводится правильная модель образования множественного числа в итальянском; примеры — названия животных.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Марко любит собак.
    - Кьяра любит кошек.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: '*Amare* («любить») употребляется без предлога: *amo gli animali*. Существительное во множественном числе требует артикля *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Кьяра любит кошек, но у неё нет домашнего животного
    gloss: Кьяра любит кошек, но у неё нет домашнего животного.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Марко спрашивает о домашнем животном
    gloss: 'Марко: У тебя есть домашнее животное, Джулия?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: У Джулии есть собака
    gloss: 'Джулия: Да, у меня есть собака.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Марко спрашивает, как она выглядит
    gloss: 'Марко: Какой он?'
    note: '*Com''è?* подходит и для животных. В ответе используются *è* или *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Джулия описывает свою собаку
    gloss: 'Джулия: У него каштановая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Животные мужского и женского рода
    gloss: 'Животное бывает мужского или женского рода, как человек: il cane — это lui, la gatta — это lei.'
    note: 'В итальянском нет среднего рода: каждое существительное мужского или женского рода, поэтому собака — *lui*, а кошка — *lei*, и местоимения подстраиваются (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Марко спрашивает о прогулках
    gloss: 'Марко: Ты гуляешь с ним каждый день?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Джулия рассказывает о своём распорядке
    gloss: 'Джулия: Да, я гуляю с ним каждый день и кормлю его.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Марко, Кьяра и Лука о животных
    gloss: Марко и Кьяра оба любят животных, но ни у одного из них нет домашнего питомца. Марко любит собак, а Кьяра — кошек. А вот у Луки есть питомец — кот. Он часто играет со своим котом и каждый день его кормит. А у тебя есть домашнее животное?
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      amano: обожать
      entrambi: оба
      animali: животные
      due: два (nessuno dei due = ни один из двух)
      domestico: домашний (animale domestico = домашнее животное)
      cani: собаки
      gatti: коты
      gatto: кот
      gioca: играет
      dà: даёт
      ogni: каждый
      mangiare: есть (dare da mangiare = кормить)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Лука часто играет со своим котом
    gloss: Лука часто играет со своим котом.
    note: '*Spesso* («часто») стоит после глагола: *gioca spesso*. *Giocare con* значит «играть с».'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Джулия спрашивает Нину
    gloss: 'Джулия: Нина, а у тебя тоже есть домашнее животное?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: У Nina есть птица по имени Pico
    gloss: 'Nina: Да, у меня есть птица. Её зовут Pico.'
    note: '*Si chiama Pico* значит «его зовут Пико», буквально «он называет себя Пико».'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Реакция Марко
    gloss: 'Марко: Как здорово! Что ты делаешь с ним каждый день?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina кормит птицу каждый день
    gloss: 'Nina: Я кормлю его каждый день.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Марко тоже любит птиц
    gloss: 'Марко: Я тоже люблю птиц.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Джулия завершает разговор
    gloss: 'Джулия: Как здорово, что мы все трое любим животных!'
    note: Заключительная реплика, которая объединяет всё, что говорилось о животных у всех трёх героев.
