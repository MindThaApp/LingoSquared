teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: счастливый, грустный
    note: '*Felice* и *triste* оканчиваются на *-e*, поэтому форма одна и та же для мужского и женского рода (*Sam è felice*, *Elena è felice*).'
    example_gloss:
    - Сегодня я счастлив.
    - Сегодня мне грустно.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: уставший, нервный
    note: Эти прилагательные меняют окончание; в этом уроке даны словарные формы мужского рода.
    example_gloss:
    - Сэм устал.
    - Сегодня я нервничаю.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: Как ты себя чувствуешь?
    note: '*Ti senti* — неформальная форма «ты себя чувствуешь», которую используют с другом.'
    example_gloss:
    - Как ты себя сегодня чувствуешь?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Я счастлив.
    note: Используй *sono* и прилагательное, обозначающее чувство.
    example_gloss:
    - Сегодня я счастлив.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: потому что / почему
    note: В этом уроке *perché* указывает причину чувства.
    example_gloss:
    - Я счастлив, потому что сегодня солнечно.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Я счастлив, потому что сегодня солнечно.
    note: 'Это полное предложение: чувство и его причина.'
    example_gloss:
    - В Милане я счастлив, потому что сегодня солнечно.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Я немного устала.
    note: '*Stanca* здесь женского рода, потому что это говорит Элена.'
