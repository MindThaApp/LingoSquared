teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: вчера, сегодня утром
    note: '*ieri* («вчера») и *stamattina* («сегодня утром») — два отрезка времени, с помощью которых рассказывают о недавних событиях.'
    example_gloss:
    - Вчера я был дома.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: я ходил (м.), я ходила (ж.)
    note: '*sono andato/andata* — passato prossimo глагола *andare* со вспомогательным глаголом *essere*; причастие согласуется с подлежащим в роде.'
    example_gloss:
    - Сегодня утром я ходил на работу.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Вчера я ходил в кино.
    note: '*Sono andato* (говорит мужчина) + *al cinema* («в кино») + *ieri* («вчера») — рассказ о завершённом событии в прошлом.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: Я посмотрел хороший фильм!
    note: В *Ho visto* используется вспомогательный глагол *avere* и неправильное причастие *visto* (от *vedere*, «видеть»).
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: На обед я съел сэндвич.
    note: В *Ho mangiato* используется *avere* и правильное причастие *mangiato* (от *mangiare*, «есть, кушать»); *a pranzo* означает «на обед».
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Что ты делал вчера?
    note: '*hai fatto* — passato prossimo глагола *fare* («делать»); здесь с его помощью спрашивают о недавнем событии в прошлом.'
    example_gloss:
    - Что ты делал сегодня утром?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: вчера вечером
    note: '*ieri sera* соединяет *ieri* («вчера») и *sera* («вечер») и называет конкретный момент в прошлом.'
    example_gloss:
    - Вчера вечером я ходил в кино.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Сегодня утром я пошла на работу, как всегда.
    note: '*sono andata* (говорит женщина) + *come sempre* («как всегда») — рассказ о привычном действии в прошлом.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: А ты что делал сегодня утром?
    note: '*E tu* («а ты») возвращает вопрос собеседнику.'
    example_gloss:
    - А ты что делал вчера вечером?
