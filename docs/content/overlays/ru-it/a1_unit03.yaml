course:
  title: Итальянский язык A1
  description: Выучи итальянский уровня A1 для повседневных приветствий и коротких разговоров, с подробными объяснениями на русском.
units:
  it.a1.unit03.basic_numbers:
    title: 'Числа: цены и номера телефонов'
lessons:
  it.a1.unit03.lesson01.contare_da_zero_a_dieci:
    title: Считаем от нуля до десяти
  it.a1.unit03.lesson02.quanto_costa_al_bar:
    title: Сколько это стоит? Заказываем в кафе
  it.a1.unit03.lesson03.il_numero_di_telefono:
    title: Обмениваемся номерами телефонов
teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: ноль, один, два, три, четыре, пять
    note: Первые шесть чисел — основа для цен, возраста и номеров телефонов во всём этом уроке.
    example_gloss:
    - У меня два брата.
    - Пять часов.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: шесть, семь, восемь, девять, десять
    note: Числа от шести до десяти завершают ряд от 0 до 10.
    example_gloss:
    - Я работаю по восемь часов в день.
    - Магазин открывается в десять.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Сколько тебе лет?
    note: 'Буквально: «сколько лет ты имеешь». Возраст по-итальянски выражается через *avere* (иметь), а не через глагол «быть».'
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Мне тридцать лет.
    note: 'Устойчивое выражение для возраста с *avere* (буквально «я имею тридцать лет»). Число «тридцать» здесь не вводится как числительное для счёта: в этом уроке мы считаем от 0 до 10, а 30 и 50 встречаются только в этой фразе и в ценах.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Сколько стоит кофе?
    note: '*Quanto costa* — стандартный способ спросить цену одного товара.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: один евро, два евро
    note: 'Слово *euro* в итальянском не меняется во множественном числе, как и в русском: и в *un euro*, и в *due euro* используется *euro*.'
    example_gloss:
    - Стоит один евро.
    - Это два евро пятьдесят.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: А круассан?
    note: Короткий встречный вопрос о цене второго товара — *cornetto* (итальянский круассан к завтраку).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Это два евро пятьдесят.
    note: '*e cinquanta* добавляет центы — буквально «и пятьдесят»; так говорят о любой цене с пятьюдесятью центами.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Сколько вам?
    note: Вежливый вопрос бариста или продавца о том, сколько штук вам нужно; *ne* заменяет уже названный предмет.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Я бы взял три, спасибо.
    note: '*Ne vorrei* + число — вежливый способ назвать количество; *ne* снова указывает на уже упомянутый предмет.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Какой у тебя номер телефона?
    note: Неформальный вопрос о номере телефона с *tuo* («твой»).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Я позвоню тебе завтра!
    note: Дружелюбный способ закончить разговор, когда ты получил номер.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: мой номер
    note: Итальянские номера телефонов обычно читают по одной цифре, используя числа, которые ты уже знаешь.
    example_gloss: 'Мой номер: ноль, три, четыре, два, один.'
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: 'Мой номер: ноль, три, четыре, два, один.'
    note: Сэм называет свой номер телефона по одной цифре — так в итальянском принято читать номера.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Отлично, спасибо!
    note: Короткий бодрый способ завершить разговор, когда ты получил нужную информацию.
