    title: Кто есть кто в районе?
    gloss: Марко живёт в красивом районе в Болонье, в двух шагах от супермаркета. Паоло — сосед Марко, а Анна — соседка Марко. Паоло очень приветливый и каждый день здоровается с Марко. Марко хорошо знает Паоло и Анну.
