course:
  title: Итальянский язык A1
  description: Выучи итальянский уровня A1 для повседневных приветствий и коротких разговоров, с подробными объяснениями на русском.
units:
  it.a1.unit02.origin_nationality_language:
    title: 'Откуда ты: национальность и язык'
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: Откуда ты? Как спросить и рассказать, откуда ты родом
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'Говорим по-итальянски: уровень и языки'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: Работа и добро пожаловать в Милан
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: откуда
    note: '*di dove* — основа вопроса и ответа о происхождении. Сочетается с *sei* (на «ты») или *è* (на «Вы»).'
    example_gloss:
    - Сэм, ты откуда?
    - Элена, Вы откуда?
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: Откуда вы?
    note: Вопрос на «ты», для ровесника или друга; соответствует *tu* из Урока 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: Вы откуда?
    note: Вопрос на «Вы»; соответствует *Lei* из Урока 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Я американец, из Чикаго.
    note: Здесь вместе названы национальность и город, откуда ты родом.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Я итальянка, из Милана.
    note: '*italiana* — женская форма национальности: так говорит Элена, потому что она женщина.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: американец/американка, итальянец/итальянка
    note: 'Как и в русском, итальянские слова для национальности меняют окончание в зависимости от пола человека: *-o* для мужчины, *-a* для женщины (*Sam è americano*, *Elena è italiana*).'
    example_gloss:
    - Сэм — американец.
    - Элена — итальянка.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Ты говоришь по-итальянски?
    note: Вопрос на «ты», с формой *tu* глагола *parlare* (говорить).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Вы говорите по-итальянски?
    note: Вопрос на «Вы», с формой *Lei* глагола *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Я немного говорю по-итальянски
    note: 'Скромный и очень распространённый способ описать свой уровень: *un po''* значит «немного».'
    example_gloss: Я немного говорю по-итальянски, учу его уже год.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Я говорю по-английски.
    note: Та же конструкция с *parlo* («я говорю»), но с другим языком.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Я учу итальянский уже год.
    note: '*da un anno* значит «уже год»: действие началось в прошлом и продолжается сейчас.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: Как давно ты учишь?
    note: '*Da quanto* («с каких пор») + настоящее время *studi* («ты учишь») спрашивает, как давно длится действие. Отвечай по той же схеме: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Ты хорошо говоришь по-итальянски!
    note: Дружеская похвала уровню языка собеседника, с неформальной формой *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Кем ты работаешь?
    note: Вопрос на «ты», с формой *tu* глагола *fare* (делать).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Кем Вы работаете?
    note: Вопрос на «Вы», с формой *Lei* глагола *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Я инженер
    note: 'Название профессии в итальянском обычно идёт без артикля: *sono ingegnere*, а не *sono un ingegnere*.'
    example_gloss: Я инженер, работаю в Милане.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Я здесь по работе.
    note: '*per lavoro* объясняет причину пребывания: работа, а не туризм.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Я здесь на два года.
    note: Та же конструкция, что и *per lavoro*, но теперь она называет срок, а не причину.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Как здорово, добро пожаловать в Милан!
    note: '*Che bello* — частая восторженная реакция: «как здорово», «как красиво».'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Большое спасибо!
    note: Та же эмоциональная благодарность из Урока 1, здесь в ответ на тёплый приём.
