    title: Кто как добирается?
    gloss: Джулия каждый день ездит на работу на поезде. Марко обычно ездит на велосипеде, но когда идёт дождь, тоже садится на поезд. Лука предпочитает ездить на машине. Кьяра живёт рядом и ходит на работу пешком. А как ты добираешься до работы?
    note: 'Здесь сопоставляются четыре способа передвижения и одно условие (*quando piove* — когда идёт дождь). Глагол *andare* (ехать, идти) неправильный: *vado*, *va*.'
    glosses:
      viaggia: ездит
      ogni: каждый
      giorno: день
      treno: поезд
      lavoro: работать
      bicicletta: велосипед (in bicicletta = на велосипеде)
      solito: обычный (di solito = обычно)
      piove: идёт дождь
      prende: едет, садится (на транспорт)
      andare: ехать, идти (andare in macchina = ехать на машине)
      preferisce: предпочитает
      macchina: машина
      abita: живёт
      vicino: близко
      piedi: ноги (a piedi = пешком)
      vai: ты идёшь, ты едешь
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Кьяра живёт рядом и ходит на работу пешком
    gloss: Кьяра живёт рядом и ходит на работу пешком.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
