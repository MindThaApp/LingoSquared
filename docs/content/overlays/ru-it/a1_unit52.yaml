    title: Джулия и Марко готовят вместе
    gloss: Джулия и Марко вместе готовят на кухне у Марко в Болонье. Джулия режет лук. Марко жарит помидор на сковороде. Марко готовит ужин. Джулия пробует ужин. Ужин вкусный!
    note: Краткий пересказ того, что Джулия и Марко делали во время готовки.
