    example_gloss:
    - Какая сегодня погода?
  it.a1.unit20.lesson01.teach_oggi_piove:
    title: Oggi piove.
    gloss: Сегодня идёт дождь.
    note: '*Oggi* чаще стоит в начале, но *Piove oggi.* тоже правильно.'
