teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: жарко, холодно
    note: 'Для температуры в итальянском говорят *fa caldo/freddo*, а не дословное «оно жарко/холодно»: в русском есть безличные «жарко» и «холодно», но в итальянском используется глагол fare.'
    example_gloss:
    - Сегодня жарко.
    - Сегодня холодно.
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: идёт дождь, солнечно
    note: '*Piove* — предложение из одного слова о погоде; *c''è il sole* буквально значит «есть солнце».'
    example_gloss:
    - Сегодня идёт дождь.
    - Сегодня солнечно.
  it.a1.unit20.lesson01.teach.che_tempo_fa:
