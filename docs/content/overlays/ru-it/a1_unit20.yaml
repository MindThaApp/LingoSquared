  it.a1.unit20.lesson02.teach_oggi_piove_freddo:
    title: Oggi piove e fa freddo.
    gloss: Сегодня идёт дождь и холодно.
    note: Два факта о погоде соединяются с помощью *e*.
    example_gloss:
    - Сегодня идёт дождь и холодно.
  it.a1.unit20.lesson02.teach_restiamo_a_casa:
    title: Restiamo a casa.
    gloss: Давай останемся дома.
    note: '*Restiamo* — форма «мы», которая здесь звучит как простое предложение.'
