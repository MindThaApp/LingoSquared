teaching:
  it.a1.unit09.lesson01.teach.farmacia_banca:
    title: la farmacia, la banca
    gloss: аптека, банк
    note: Оба существительных женского рода (*la*).
    example_gloss:
    - Извините, где находится аптека?
  it.a1.unit09.lesson01.teach.stazione_ufficio_postale:
    title: la stazione, l'ufficio postale
    gloss: вокзал, почта
    note: '*stazione* — женского рода (*la*); *ufficio* — мужского рода, но перед гласной артикль сокращается до *l''*.'
    example_gloss:
    - Вокзал рядом.
  it.a1.unit09.lesson01.teach.scusi_dove_la_farmacia:
    title: Scusi, dov'è la farmacia?
    gloss: Извините, где находится аптека?
    note: '*Scusi* («извините», вежливая форма) стоит в начале вопроса перед *dov''è* («где находится»).'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: Это рядом, на улице Рома.
    note: После *qui vicino* («рядом, поблизости») можно назвать улицу, чтобы указать место точнее.
  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: Здесь поблизости есть банк?
    note: '*C''è* («есть») спрашивает о наличии чего-либо; дальше следует *qui vicino* («поблизости»).'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: Да, один есть поблизости.
    note: '*ce n''è una* («один такой есть») отвечает на вопросы с *c''è* и заменяет существительное женского рода *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: Рядом с вокзалом.
    note: '*accanto a* («рядом с») с артиклем точно указывает положение относительно ориентира.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Большое спасибо.
    note: Буквально «тысяча благодарностей» — более сильная благодарность, чем просто *grazie*.
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: Где находится вокзал?
    note: '*Dov''è* («где находится») с существительным спрашивает о местоположении конкретного места.'
    example_gloss:
    - Вокзал находится рядом с банком.
