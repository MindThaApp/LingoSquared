teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: работа
    note: '*il lavoro* — существительное мужского рода; оно означает и «работа» как место или занятие, и «работа» вообще.'
    example_gloss:
    - Моя работа интересная.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: учитель, продавец
    note: '*insegnante* (учитель) одинаково для мужчин и женщин; *commesso* (продавец) — мужской род, женская форма — *commessa*.'
    example_gloss:
    - Я учитель, а не продавец.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Кем ты работаешь?
    note: '*Che lavoro fai?* (буквально «Какую работу ты делаешь?») — стандартный способ спросить о профессии.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Я учитель.
    note: 'Перед названием профессии без определения артикль не ставится: *Sono insegnante*, а не *Sono un insegnante*. В русском артиклей нет, поэтому просто не добавляй его.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Я продавец.
    note: Та же модель без артикля, что и в *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: офис, школа
    note: У *l'ufficio* (офис) артикль элидируется перед гласной; *la scuola* (школа) — женского рода.
    example_gloss:
    - Я работаю в офисе.
    - Я работаю в школе.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Где ты работаешь?
    note: '*Dove* (где) плюс *lavori* (ты работаешь, неформально).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Я работаю в офисе.
    note: '*Lavoro in* (я работаю в) плюс *un ufficio* (офис).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Я работаю в школе.
    note: Та же модель с *una scuola* (школа).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: я начинаю, я заканчиваю
    note: '*inizio* (я начинаю) и *finisco* (я заканчиваю) — формы 1-го лица настоящего времени глаголов *iniziare* и *finire*.'
    example_gloss:
    - Я начинаю в девять.
    - Я заканчиваю в пять.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: Во сколько ты начинаешь?
    note: '*A che ora* (во сколько) плюс *inizi* (ты начинаешь, неформально).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Я начинаю в девять и заканчиваю в пять.
    note: '*alle nove* / *alle cinque* (в девять / в пять): перед часом используется *alle*, как в фразах о времени в Уроке 5.'
