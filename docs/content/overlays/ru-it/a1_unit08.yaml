teaching:
  it.a1.unit08.lesson01.teach.mele_banane:
    title: le mele, le banane
    gloss: яблоки, бананы
    note: Оба существительных — женского рода, множественного числа (*le*).
    example_gloss:
    - Я бы хотел килограмм яблок.
  it.a1.unit08.lesson01.teach.pomodori_patate:
    title: i pomodori, le patate
    gloss: помидоры, картофель
    note: '*pomodori* — мужской род, множественное число (*i*); *patate* — женский род, множественное число (*le*).'
    example_gloss:
    - Сколько стоят помидоры?
  it.a1.unit08.lesson01.teach.quanto_costano:
    title: Quanto costano le mele?
    gloss: Сколько стоят яблоки?
    note: '*Quanto costano?* говорят о предметах во множественном числе — «сколько они стоят».'
  it.a1.unit08.lesson01.teach.costano_tre_euro:
    title: Costano tre euro al chilo.
    gloss: Они стоят три евро за килограмм.
    note: '*al chilo* («за килограмм») указывает цену за единицу веса.'
  it.a1.unit08.lesson02.teach.quanto_costa_questo:
    title: Quanto costa questo?
    gloss: Сколько это стоит?
    note: '*Quanto costa?* (единственное число) спрашивают о цене одного предмета.'
  it.a1.unit08.lesson02.teach.un_euro_e_cinquanta:
    title: Un euro e cinquanta.
    gloss: Один евро пятьдесят.
    note: 'В итальянском между суммой в евро и центами стоит *e* («и»): по-русски мы обычно говорим «один евро пятьдесят» без союза.'
  it.a1.unit08.lesson02.teach.vorrei_un_chilo:
    title: Vorrei un chilo di mele, per favore.
    gloss: Я бы хотел килограмм яблок, пожалуйста.
    note: '*un chilo di* («килограмм чего-то») сначала называет количество, а затем товар.'
  it.a1.unit08.lesson03.teach.va_bene_lo_prendo:
    title: Va bene, lo prendo.
    gloss: Хорошо, я беру.
    note: '*lo prendo* («я беру это») подтверждает покупку; *lo* отсылает к только что названному товару.'
  it.a1.unit08.lesson03.teach.un_chilo_mezzo_chilo:
    title: un chilo, mezzo chilo
    gloss: килограмм, полкилограмма
    note: '*mezzo* («половина») стоит перед *chilo* и обозначает меньшее количество.'
    example_gloss:
    - Я бы хотел полкилограмма картофеля.
