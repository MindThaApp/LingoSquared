teaching:
  it.a1.unit19.lesson01.teach.treno_stazione:
    title: il treno, la stazione
    gloss: поезд, вокзал
    note: '*il treno* — мужского рода; *la stazione* — женского рода.'
    example_gloss:
    - Поезд стоит на вокзале.
  it.a1.unit19.lesson01.teach.binario_biglietto:
    title: il binario, il biglietto
    gloss: платформа, билет
    note: '*binario* — это платформа (путь); *biglietto* — это билет.'
    example_gloss:
    - Билет до Рима.
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: Он отправляется в восемь.
    note: О транспорте *parte* значит «отправляется».
    example_gloss:
    - Поезд отправляется в восемь.
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: с третьей платформы
    note: '*dal* — это слияние *da* + *il*: «от/с + артикль».'
    example_gloss:
    - Он отправляется с третьей платформы.
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: Во сколько отправляется поезд?
    note: Для времени отправления по расписанию используй *A che ora...?*
    example_gloss:
    - Во сколько отправляется поезд до Рима?
  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: Я хотел бы билет до Рима на восемь часов, пожалуйста.
    note: '*Vorrei* — вежливая форма для покупки или просьбы; *alle otto* уточняет время поездки.'
    example_gloss:
    - Доброе утро, я хотел бы билет до Рима, пожалуйста.
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: поезд до Рима
    note: Для пункта назначения используй *per*.
    example_gloss:
    - Поезд до Рима отправляется в восемь.
  it.a1.unit19.lesson02.teach.hai_il_biglietto:
    title: Hai il biglietto?
