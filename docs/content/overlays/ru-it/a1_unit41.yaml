teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для хобби в инфинитиве: *leggere* (читать), *fare sport* (заниматься спортом) и *cucinare* (готовить). Итальянские инфинитивы оканчиваются на -are, -ere или -ire.'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Свободное время
    gloss: свободное время
    note: '*Il tempo libero* — существительное мужского рода, поэтому с артиклем *il*. Это ключевое выражение для разговора о хобби.'
    example_gloss: В свободное время я люблю читать.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Leggo* — форма *io* (я) глагола *leggere* (читать). В итальянском местоимение-подлежащее обычно опускают, как и в русском «Читаю»: говорят *Leggo*, а не *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три хобби: *ascoltare musica* (слушать музыку), *disegnare* (рисовать) и *giocare ai videogiochi* (играть в видеоигры).'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'После *ascoltare* дополнение идёт сразу, без предлога: *ascolto musica*.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Con gli amici* значит «с друзьями». *Gli* — артикль множественного числа перед существительным мужского рода, начинающимся с гласной.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: 'Четыре слова частоты. *Mai* (никогда) требует *non* перед глаголом: *non gioco mai*.'
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Ogni* («каждый») не изменяется: *ogni settimana*, *ogni fine settimana*. См. следующую карточку.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai требует non; ogni не изменяется
    gloss: 'С mai перед глаголом нужно также non: Non gioco mai. Ogni остаётся неизменным с любым существительным: ogni settimana, ogni fine settimana.'
    note: 'Как и в русском «я никогда не играю», в итальянском есть двойное отрицание: *non gioco mai* (буквально «не играю никогда»). После *ogni* («каждый») всегда стоит существительное в единственном числе, а само ogni не меняется по родам.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Джулия заговаривает о хобби
    gloss: 'Джулия: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Марко?'
    note: '*Passeggiamo* — форма *noi* (мы) глагола *passeggiare*. *Spesso* стоит после глагола.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Хобби Марко
    gloss: 'Марко: Я люблю готовить, и дома тоже. А ещё часто занимаюсь спортом.'
    note: '*Anche a casa* («и дома») показывает, что Марко готовит для удовольствия, а не только на работе. *A casa* значит «дома», без артикля.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Джулия удивлена
    gloss: 'Джулия: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: '*Già* («уже») и *tutto il giorno* («целый день») показывают, как много Марко уже готовит на работе.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Марко объясняет
    gloss: 'Марко: Да, но готовка меня расслабляет. А ты, что тебе нравится делать?'
    note: '*Cucinare mi rilassa* буквально значит «готовка меня расслабляет»: занятие — подлежащее, а *mi* («меня») — дополнение.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Хобби Джулии
    gloss: 'Джулия: Я люблю читать и часто слушаю музыку.'
    note: 'Два занятия, соединённые союзом *e* («и»). Оба глагола стоят в форме *io*: *leggo* и *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Марко спрашивает об играх
    gloss: 'Марко: Ты ещё и в видеоигры играешь?'
    note: 'Вопрос без вопросительного слова сохраняет порядок слов утверждения, меняется только интонация: *Giochi anche ai videogiochi?* *Anche* значит «тоже», «ещё и».'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Ответ Джулии
    gloss: 'Джулия: Нет, я никогда не играю в видеоигры. Зато иногда рисую!'
    note: '*Non ... mai* («никогда») и *a volte* («иногда») противопоставлены в одном ответе. *Ma* значит «но».'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Сравниваем увлечения
    gloss: Мы с Марко часто гуляем вместе. Но у нас есть и другие хобби. Марко любит готовить, и дома тоже, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда рисую, но никогда не играю в видеоигры. А что тебе нравится делать в свободное время?
    note: В сообщении Джулия повторяет факты из диалога и в конце задаёт читателю главный вопрос урока.
    glosses:
      passeggiamo: мы гуляем
      spesso: часто
      insieme: вместе
      altri: другие
      cucina: готовит
      volentieri: охотно, с удовольствием
      casa: дом (a casa = дома)
      sport: спорт (fa sport = занимается спортом)
      leggo: читать
      ascolto: слушаю
      musica: музыка
      disegno: рисую
      volte: разы (a volte = иногда)
      videogiochi: видеоигры
      mai: никогда
      libero: свободное
      tempo: время
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Марко спрашивает о выходных
    gloss: 'Марко: Что ты делаешь в эти выходные?'
    note: '*Questo fine settimana* («эти выходные») — мужского рода, поэтому *questo*. *Fai* — форма *tu* (ты) глагола *fare* («делать»).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Джулия ещё не решила
    gloss: 'Джулия: Я ещё не знаю. Я люблю читать, но ещё хочу куда-нибудь выйти.'
    note: '*Non lo so ancora* («я ещё не знаю»): *lo* заменяет то, чего ты не знаешь, и стоит перед глаголом. *Uscire* значит «выходить», «идти гулять».'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Марко предлагает план
    gloss: 'Марко: Может, погуляем вместе? Потом я приготовлю для нас.'
    note: '*Poi* («потом») выстраивает планы по порядку. *Cucino io* (с *io* после глагола) подчёркивает: «приготовлю именно я».'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Джулия соглашается
    gloss: 'Джулия: Хорошая идея! Мне нравится и гулять, и готовить.'
    note: '*Sia ... sia ...* значит «и ... и ...»: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Марко подтверждает
    gloss: 'Марко: Отлично. Тогда увидимся в субботу!'
    note: '*Ci vediamo sabato* («увидимся в субботу»): когда речь о ближайшей субботе, артикля перед днём недели нет.'
