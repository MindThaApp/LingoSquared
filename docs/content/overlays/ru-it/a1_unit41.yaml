course:
  title: Итальянский язык A1
  description: 'Итальянский для начинающих: рассказ о занятиях в свободное время. Лексика о хобби, слова частоты, вопросы и ответы о том, чем человек занимается в свободное время, сравнение увлечений двух людей.'
