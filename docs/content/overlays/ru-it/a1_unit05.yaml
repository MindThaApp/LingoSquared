teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Который час?
    note: Стандартный способ спросить время по-итальянски; буквально «какие сейчас часы».
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Три часа.
    note: '*Sono le* + число называет время для любого часа, кроме часа дня или ночи (один час).'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: час, два часа, три часа, двенадцать часов
    note: Только «час» говорится *è l'una* (единственное число), а не *sono le* (множественное), потому что «один» — в единственном числе.
    example_gloss:
    - Час.
    - Двенадцать часов.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: четыре часа, пять часов, шесть часов
    note: Здесь продолжается та же схема *sono le* + число, что и для трёх часов.
    example_gloss:
    - Четыре часа.
    - Шесть часов.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Три тридцать.
    note: '*e mezzo* («и половина») добавляет к часу тридцать минут.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Четверть четвёртого.
    note: '*e un quarto* («и четверть») добавляет к часу пятнадцать минут.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Без четверти четыре.
    note: '*meno un quarto* («минус четверть») отсчитывает назад от СЛЕДУЮЩЕГО часа — так же, как в русском «без четверти четыре».'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Во сколько встретимся?
    note: '*A che ora* спрашивает, в какое время что-то происходит; *ci vediamo* означает «увидимся».'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: Увидимся в три тридцать.
    note: '*alle* («в» + артикль) ставится перед конкретным временем, а *sono le* просто называет время.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: утром, днём, вечером
    note: 'Эти выражения уточняют, к какой части суток относится время: в итальянском часы обычно называют по 12-часовому кругу, без обозначений AM/PM.'
    example_gloss:
    - Встреча утром или вечером?
    - Днём, в три тридцать.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Днём, в три тридцать.
    note: Часть суток сочетается с точным временем, чтобы не было неясности, утро это или вечер.
