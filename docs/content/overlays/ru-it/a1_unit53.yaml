    title: Нина узнаёт о каждом
    gloss: Нина новичок в языковом кафе. Она спрашивает Марко, какие остальные. Марко рассказывает. Джулия добрая и терпеливая; она работает медсестрой. Лука забавный и ходит на курс испанского. Кьяра любознательная; ей нравится узнавать новое. Сам Марко спокойный.
    note: Краткий обзор черт характера участников группы.
