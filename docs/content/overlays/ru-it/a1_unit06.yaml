teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: мать, отец
    note: 'В итальянском у существительных есть род, и он виден по артиклю: *la* — женский род, *il* — мужской. В русском род тоже есть, но артиклей нет.'
    example_gloss:
    - Это мой отец.
    - Это моя мать.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: брат, сестра
    note: '*fratello* — мужского рода (*il*), а *sorella* — женского (*la*).'
    example_gloss:
    - У меня есть брат и сестра.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Это мой отец. Это моя мать.
    note: '*Questo/Questa* («этот/эта») согласуется в роде с тем, на кого указывает: *questo* — о мужчине, *questa* — о женщине.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: дедушка, бабушка
    note: Те же артикли мужского и женского рода, что и в паре *padre/madre*.
    example_gloss:
    - Мой дедушка живёт в Риме.
    - Моя бабушка очень вкусно готовит.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: У тебя есть братья или сёстры?
    note: '*Hai* («у тебя есть») + слово о родственнике + *o* («или») — обычный способ спросить о братьях и сёстрах.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: У меня есть брат и сестра.
    note: '*Ho* («у меня есть») открывает ответ; дальше идут *un* («один», мужской род) и *una* («одна», женский род).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: муж, жена
    note: Ещё одна пара мужского и женского рода с теми же артиклями.
    example_gloss:
    - У Сэма есть жена.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: У тебя есть дети?
    note: '*figli* («дети») — форма множественного числа, которую используют в общем вопросе, независимо от числа и пола детей.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Да, у меня двое детей. Мальчик и девочка.
    note: '*maschio* («мальчик», мужского пола) и *femmina* («девочка», женского пола) уточняют пол детей после общего числа.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: сын, дочь
    note: Это формы единственного числа от *figli*; артикли мужского и женского рода обычные.
    example_gloss:
    - У Елены есть сын и дочь.
