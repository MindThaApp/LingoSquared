teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: больше, меньше
    note: '*più* («больше») и *meno* («меньше») — основные слова для сравнения; они ставятся перед прилагательным или употребляются с *di*, чтобы сравнивать.'
    example_gloss:
    - Я хочу больше кофе, меньше чая.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: чем / из
    note: 'После *più*/*meno* предлог *di* значит «чем» (*più di due euro*); перед определённым артиклем он сливается с ним: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - Кофе стоит больше двух евро.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Яблоки стоят дороже, чем помидоры.
    note: В *più dei pomodori* используется *di* + *i* (слитно *dei*), чтобы сравнить с *i pomodori*.
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Помидоры стоят дешевле, чем яблоки.
    note: В *meno delle mele* используется *di* + *le* (слитно *delle*), чтобы сравнить с *le mele*.
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: 'Что ты предпочитаешь: яблоки или помидоры?'
    note: '*Quale* («какой, что из...») просит собеседника выбрать одно из двух только что названных.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Я предпочитаю яблоки.
    note: '*Preferisco* («я предпочитаю») и *le mele* («яблоки») — это ответ на вопрос с выбором.'
    example_gloss:
    - Я предпочитаю помидоры.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: как
    note: '*come* («как») употребляется с *buono/a*, чтобы сказать, что две вещи одинаковы.'
    example_gloss:
    - Чай такой же вкусный, как кофе.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Яблоки такие же вкусные, как помидоры.
    note: '*sono buone* («вкусные», женский род, мн. число) согласуется с *le mele*; *come* вводит сравнение «такой же, как».'
