teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: Алло? Кто говорит?
    note: '*Pronto* — обычный способ ответить на звонок по-итальянски; *ciao* для этого не используется, в отличие от русского «привет».'
    example_gloss:
    - Алло, это Элена.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: телефон, сообщение
    note: '*Messaggio* — мужского рода; говорим *un messaggio*.'
    example_gloss:
    - Я отправлю тебе сообщение.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: Я Элена.
    note: 'По телефону в итальянском обычно представляются так: *sono* + имя.'
    example_gloss:
    - Алло, это Елена.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Привет, Сэм, это Елена.
    note: '*Sono Elena* — естественный способ сказать «это Елена» в телефонном разговоре.'
    example_gloss:
    - Привет, Сэм, это Елена по телефону.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: Ты можешь повторить, пожалуйста?
    note: '*Puoi* — неформальная форма (на «ты»), подходит для общения Елены и Сэма.'
    example_gloss:
    - Сэм, ты можешь повторить, пожалуйста?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Помедленнее, пожалуйста.
    note: '*Più piano* значит «помедленнее»; так обычно просят говорить медленнее.'
    example_gloss:
    - Говори помедленнее, пожалуйста.
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Я отправлю тебе сообщение.
    note: '*Ti mando* значит «я посылаю тебе» в неформальной речи.'
    example_gloss:
    - Привет, Сэм, я отправлю тебе сообщение.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Да, это я, Елена.
    note: '*Sì* пишется с акцентом; не пиши *si* без акцента в значении «да».'
    example_gloss:
    - Да, это Елена на телефоне.
