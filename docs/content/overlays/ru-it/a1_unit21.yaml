teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: футболка, брюки
    note: '*Maglietta* — существительное женского рода в единственном числе, а *pantaloni* в итальянском стоит во множественном числе (как и «брюки» в русском).'
    example_gloss:
    - Футболка синяя.
    - Брюки для Элены.
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: туфли, куртка
    note: '*Scarpe* — множественное число; *giacca* — женский род, единственное число.'
    example_gloss:
    - Туфли удобные.
    - Куртка большая.
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: синий
    note: '*Blu* не изменяется по родам.'
    example_gloss:
    - Футболка синяя.
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: Футболка синяя.
    note: Чтобы описать цвет одного предмета, используй *è*.
    example_gloss:
    - Футболка синяя.
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: маленький размер, средний, большой
    note: '*Taglia* — размер одежды. Это слово женского рода, поэтому слова-размеры согласуются с ним: *taglia piccola*, *taglia media*; *grande* одинаково для обоих родов.'
    example_gloss:
    - Я бы хотел средний размер.
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: Я бы хотел синюю футболку среднего размера.
    note: '*Vorrei* делает просьбу в магазине вежливой.'
    example_gloss:
    - Я бы хотел синюю футболку среднего размера.
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: Сколько это стоит?
    note: Для одного предмета используется *costa* в единственном числе.
    example_gloss:
    - Сколько это стоит?
  it.a1.unit21.lesson02.teach_costa_dieci_euro:
    title: Costa dieci euro.
    gloss: Это стоит десять евро.
    note: В стандартном употреблении *euro* после числительного обычно не изменяется.
    example_gloss:
    - Это стоит десять евро.
