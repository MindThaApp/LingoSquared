course:
  title: Итальянский язык A1
  description: Выучи итальянский уровня A1 для повседневных приветствий и коротких разговоров, с подробными объяснениями на русском.
units:
  it.a1.unit01.greetings_and_introductions:
    title: Приветствия и знакомство
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: 'Tu и Lei: неформальное и формальное приветствие'
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: Отвечаем и прощаемся
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 'Знакомимся: первый день в офисе'
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: привет, добрый день / доброе утро
    note: '*Ciao* — непринуждённое универсальное приветствие между друзьями и ровесниками в любое время суток. *Buongiorno* — обычное, более официальное приветствие в дневное время: его можно говорить с утра и до второй половины дня.'
    example_gloss:
    - Привет, как дела?
    - Доброе утро, как поживаете?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: как дела (на «ты»), как поживаете (на «вы»)
    note: '*come stai* употребляется с *tu* (друг, ровесник), *come sta* — с *Lei* (незнакомый человек, начальник, тот, к кому ты относишься с уважением). Вопрос один и тот же, различается уровень вежливости.'
    example_gloss:
    - Привет, как дела сегодня?
    - Добрый день, как поживаете сегодня?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Привет, как дела?
    note: 'Неформальное приветствие с вопросом: так говорят друзьям, одногруппникам, ровесникам.'
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Доброе утро, как поживаете?
    note: 'Формальный вариант: так говорят человеку, к которому обращаются уважительно, например начальнику нового коллеги.'
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: неформальное обращение · Lei: формальное или уважительное'
    note: '*tu* — повседневное «ты» между друзьями, одногруппниками и ровесниками. *Lei* — вежливое «вы» для незнакомых людей, в рабочей иерархии и при первой встрече. Как и русское «вы», оно требует своих форм глагола (сравни *tu stai* и *Lei sta*), но в итальянском это форма 3-го лица единственного числа.'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Хорошо, спасибо
    note: Простой нейтральный ответ на вопрос «как дела?». Подходит и для «ты», и для «вы» — достаточно добавить *e tu?* или *e Lei?*
    example_gloss:
    - Хорошо, спасибо, а у тебя?
    - Хорошо, спасибо, а у Вас? (формально)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: А ты? (неформально)
    note: Неформальный способ задать вопрос в ответ другу или ровеснику.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: А Вы? (формально)
    note: Формальный способ задать вопрос в ответ, в соответствии с обращением *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Хорошо, спасибо, а ты?
    note: 'Полный неформальный ответ с встречным вопросом: так говорят другу или ровеснику.'
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Хорошо, спасибо, а Вы?
    note: 'Полный формальный ответ с встречным вопросом: так говорят человеку, к которому обращаются уважительно.'
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: добрый вечер, спокойной ночи
    note: '*Buonasera* — приветствие, когда приходишь куда-то вечером. *Buonanotte* — пожелание на прощание, когда кто-то идёт спать или заканчивает день; как приветствие оно никогда не используется.'
    example_gloss:
    - Добрый вечер, как поживаете?
    - Спокойной ночи, до завтра.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: До свидания, до завтра.
    note: '*Arrivederla* — формальное прощание, которое говорят на «вы» (*Lei*): подходит для работы или общения с незнакомым человеком.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Пока, до завтра!
    note: Непринуждённое прощание с друзьями и ровесниками, с которыми вы увидитесь на следующий день.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Как Вас зовут, извините? (формально)
    note: '*Come si chiama?* буквально значит «как Вас называют» и относится к формальному обращению *Lei*; добавить *scusi* («извините») — естественная вежливая деталь, когда спрашиваешь незнакомого человека.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Как тебя зовут? (неформально)
    note: 'Неформальный вариант: его используют с другом, ровесником или человеком твоего возраста.'
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Меня зовут Элена.
    note: '*chiamarsi* значит «называться» — это стандартный способ назвать своё имя, подходящий для любого обращения.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Я Сэм.
    note: 'Простая альтернатива *mi chiamo*: глагол *essere* («быть») и сразу имя.'
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: приятно познакомиться, очень приятно (формально)
    note: '*Piacere* само по себе — короткий распространённый способ сказать «приятно познакомиться» при любом обращении. *Piacere di conoscerla* — более полная формальная версия, которую говорят на «вы» (*Lei*).'
    example_gloss:
    - Очень приятно, Сэм!
    - Очень приятно, синьора Элена.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Добро пожаловать в офис!
    note: '*Benvenuto* — мужская форма слова «добро пожаловать» (для мужчины; женщину приветствуют словом *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Большое спасибо.
    note: Более сильный и эмоциональный способ поблагодарить, чем простое *Grazie*.
