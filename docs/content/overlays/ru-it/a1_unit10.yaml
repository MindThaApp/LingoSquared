teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: направо, налево
    note: '*a destra* (направо) и *a sinistra* (налево) — два основных направления поворота.'
    example_gloss:
    - Поверните направо, пожалуйста.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: прямо, на перекрёстке
    note: '*sempre dritto* (всё время прямо) и *all''incrocio* (на перекрёстке) показывают, как идти и где поворачивать.'
    example_gloss:
    - Идите прямо до перекрёстка.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Извините, как пройти в музей?
    note: '*Scusi* (извините, вежливая форма) начинает вопрос, за которым идут *come arrivo* (как добраться) и место назначения.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Идите прямо, потом на перекрёстке поверните направо.
    note: '*Vada* и *giri* — вежливые формы повелительного наклонения (Lei): так незнакомому человеку объясняют дорогу.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: Это далеко отсюда?
    note: '*È lontano* (это далеко) и *da qui* (отсюда) — вопрос о расстоянии.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: Нет, это всего пять минут пешком.
    note: '*a piedi* (пешком) уточняет, как измеряется расстояние.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Большое спасибо, вы очень любезны.
