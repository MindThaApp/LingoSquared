  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: Идите, поверните, продолжайте.
    note: Три глагола в вежливой форме повелительного наклонения (Lei), которые часто звучат вместе, когда объясняют дорогу.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
