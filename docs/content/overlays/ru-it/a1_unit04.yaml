  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: Какой сегодня день?
    note: Стандартный способ спросить, какой сегодня день недели.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Сегодня четверг.
    note: '*Oggi* («сегодня») + *è* («есть») + название дня — прямой ответ на вопрос.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Завтра пятница.
    note: '*Domani* («завтра») строится по той же схеме, что и *oggi*, когда называют день.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Какое сегодня число?
    note: '*Che data* (какое число) используется вместо *che giorno*, когда спрашивают о календарной дате, а не о дне недели.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: январь, февраль, март, апрель
    note: Первые четыре месяца года по-итальянски; названия всех месяцев пишутся со строчной буквы.
    example_gloss:
    - Сегодня пятое января.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Сегодня пятое января.
    note: 'В итальянских датах используется *il* + число + название месяца, причём число обычное, количественное: *cinque*, а не порядковое, как русское «пятое». Исключение — первое число месяца: для него используется порядковое *primo* (*il primo gennaio*).'
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: пятнадцатое марта
    note: 'Ещё один пример схемы «число + месяц»: для любой даты она работает одинаково.'
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: Когда ты приезжаешь в Рим?
    note: '*Quando* (когда) + *arrivi* (ты приезжаешь) — вопрос о будущем приезде.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Я приезжаю в четверг днём.
    note: '*Arrivo* (я приезжаю) + день + время суток — это полный ответ на вопрос, когда ты приедешь.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: сегодня, завтра, послезавтра
    note: '*Dopodomani* — одно слово, как и русское «послезавтра»: буквально *dopo* (после) + *domani* (завтра).'
    example_gloss:
    - Послезавтра суббота.
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi:
    title: Ci vediamo giovedì!
    gloss: До встречи в четверг!
    note: Дружеская фраза, которой завершают разговор, когда договорились о дне встречи.
