teaching:
  it.a1.unit04.lesson01.teach.giorni_lun_mer:
    title: lunedì, martedì, mercoledì
    gloss: понедельник, вторник, среда
    note: Первые три дня итальянской недели. Как и в русском, неделя в Италии начинается с понедельника.
    example_gloss:
    - В понедельник я работаю в офисе.
