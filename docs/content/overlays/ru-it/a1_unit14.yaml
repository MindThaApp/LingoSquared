teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: предпочитать, я предпочитаю
    note: '*preferire* («предпочитать») — глагол на -ire, у которого в большинстве форм настоящего времени появляется вставка -isc-; *preferisco* — «я предпочитаю».'
    example_gloss:
    - Я предпочитаю чай кофе.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: Ты предпочитаешь кофе или чай?
    note: '*Preferisci* («ты предпочитаешь») вместе с *o* («или») предлагает выбор из двух вариантов.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Я предпочитаю кофе.
    note: '*Preferisco* («я предпочитаю») и *il caffè* («кофе») выражают предпочтение.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: Мне очень нравится круассан.
    note: '*Mi piace* («мне нравится») вместе с *molto* («очень») выражает сильную симпатию.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: Я не люблю чай по утрам.
    note: '*Non mi piace* («мне не нравится») — отрицание конструкции со mi piace; *la mattina* значит «по утрам».'
    example_gloss:
    - Я не люблю кофе по вечерам.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: А вы?
    note: '*E a te?* («а тебе?») — вопрос о предпочтениях собеседника.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Я тоже предпочитаю кофе!
    note: '*Anch''io* («я тоже») выражает согласие с предпочтением, только что названным через *preferisco*. (Чтобы согласиться с фразой со *mi piace*, по-итальянски говорят *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Я нет, я предпочитаю чай.
    note: '*A me no* («мне нет») выражает несогласие с фразой со *mi piace* (повторяет *a me* из конструкции с «нравиться»), после чего называют своё предпочтение. Чтобы не согласиться с фразой с *preferisco*, по-итальянски говорят *Io no*.'
    example_gloss:
    - Я нет, я предпочитаю кофе.
