teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: кухня, гостиная
    note: '*la cucina* (кухня) — женского рода; *il soggiorno* (гостиная) — мужского рода.'
    example_gloss:
    - Кухня большая.
    - Гостиная удобная.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: спальня, ванная
    note: '*la camera da letto* буквально значит «комната для кровати» (*letto* = кровать); *il bagno* — ванная.'
    example_gloss:
    - Спальня маленькая.
    - Ванная чистая.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Это мой дом.
    note: '*Questa* («эта», женский род) согласуется со словом *casa* (дом), которое в итальянском женского рода.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Есть четыре комнаты.
    note: '*Ci sono* («есть», «имеются») + число + *stanze* (комнаты); *quattro* (четыре) было в Уроке 3.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: кровать, стол
    note: '*il letto* (кровать) и *il tavolo* (стол) — оба мужского рода.'
    example_gloss:
    - Кровать в спальне.
    - Стол на кухне.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: стул, диван
    note: '*la sedia* (стул) — женского рода; *il divano* (диван) — мужского рода.'
    example_gloss:
    - Стул рядом со столом.
    - Диван в гостиной.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Кровать в спальне.
    note: '*nella* — слияние *in* + *la*, значит «в» с определённым артиклем.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: Диван в гостиной.
    note: '*nel* — слияние *in* + *il* (мужской род), значит «в» с определённым артиклем.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: рядом с, перед
    note: Оба — предлоги из двух слов, оканчивающиеся на *a*, которое сливается со следующим артиклем (*al*, *alla*).
    example_gloss:
    - Стул рядом со столом.
    - Кровать перед окном.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: за, над / на, под
    note: 'Ещё три слова места: *dietro* (за), *sopra* (над/на), *sotto* (под) — перед артиклем им *a* не нужно.'
    example_gloss:
    - Диван стоит за столом.
    - Книга лежит на столе.
    - Кошка под кроватью.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Где кровать?
    note: '*Dov''è* — сокращённая форма от *dove* (где) + *è* (есть, находится).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Кровать рядом с окном.
    note: В *vicino alla finestra* используется *vicino a* + *la finestra* (окно), которые сливаются в *alla*.
