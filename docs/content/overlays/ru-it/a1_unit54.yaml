    gloss: В субботу Нина и Джулия идут на цветочный рынок. Какой цвет хочет Джулия? Джулия хотела бы красный. Какой цвет хочет Нина? Нина хотела бы жёлтый. Они покупают пять тюльпанов. Это стоит десять евро. Тюльпаны просто прекрасны!
