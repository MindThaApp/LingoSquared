course:
  title: Итальянский язык A1
  description: 'Итальянский для начинающих: описание внешности человека — рост и впечатление о возрасте, цвет волос и глаз, основной вопрос Com''è? и сравнение внешности двух людей.'
units:
  it.a1.unit42.aspetto:
    title: Описываем внешность
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: Высокий, низкий, пожилой и молодой
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: Описываем волосы
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: Глаза и вопрос «Как выглядит человек?»
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: Джулия описывает Нину
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: Сравниваем Луку и Кьяру
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: Марко узнаёт Нину
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Alto* — высокий человек, *basso* — низкий. Итальянские прилагательные согласуются с человеком в роде, как и русские: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Кьяра высокая.
    - Лука низкий.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Anziano* (пожилой) и *giovane* (молодой) дают общее впечатление, а не точное число лет. *Giovane* оканчивается на -e, поэтому одинаково для мужчин и женщин.'
    example_gloss:
    - Дедушка пожилой.
    - Марко молод.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Возраст: avere anni или anziano'
    gloss: 'Для точного возраста в итальянском используется avere + anni: Quanti anni hai? Для общего впечатления — прилагательное: Il nonno è anziano.'
    note: По-русски говорят «мне 30 лет», а по-итальянски — «я имею 30 лет» (*ho trent'anni*). Прилагательное *anziano* — о том, насколько пожилым человек выглядит.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Кьяра высокая, а Лука низкий
    gloss: Кьяра высокая, а Лука низкий.
    note: 'Два прилагательных соединены союзом *e* («и»). Каждое согласуется со своим человеком: *alta* (женский род) и *basso* (мужской род).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Волосы
    gloss: волосы
    note: '*I capelli* — множественное число: по-итальянски волосы это «волосы» во множественном числе, как и в русском. Форма единственного числа *il capello* означает один волос.'
    example_gloss: У Марко короткие чёрные волосы.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'Три цвета волос в мужском роде множественного числа, согласованные с *capelli*: *biondi*, *castani*, *grigi*. Для волос используется и *neri* (чёрные).'
    example_gloss:
    - У Джулии светлые волосы.
    - У Луки каштановые волосы.
    - У дедушки седые волосы.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Lunghi* (длинные) и *corti* (короткие) стоят во множественном числе, как и *capelli*. Слово *alto* (высокий) говорят только о людях, не о волосах.'
    example_gloss:
    - У Кьяры длинные волосы.
    - У Луки короткие волосы.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli — множественное число
    gloss: 'Capelli — множественное число, поэтому и прилагательное во множественном числе: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'Прилагательное стоит после существительного и согласуется с ним в роде и числе: *capelli lunghi* (мужской род, мн. число), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: 'Волосы и глаза: глагол avere'
    gloss: 'Чтобы описать человека, в итальянском используют avere с волосами и глазами: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'В отличие от русского «у неё светлые волосы», в итальянском нужен ещё артикль: *i capelli*, *gli occhi*. Можно сказать и *è bionda*, но здесь нужно выучить конструкцию с *avere*.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: У Марко короткие чёрные волосы
    gloss: У Марко короткие чёрные волосы.
    note: '*Neri* (чёрные) — мужской род множественного числа, согласуется с *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: У Джулии длинные светлые волосы
    gloss: У Джулии длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Глаза
    gloss: глаза
    note: '*Occhio* (глаз) — мужского рода; во множественном числе *occhi* с артиклем *gli*, потому что слово начинается с гласной.'
    example_gloss: У Марко карие глаза.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: 'Цвета глаз: *azzurri* (голубые), *marroni* (карие), *verdi* (зелёные). Эти формы множественного числа подходят и мужчинам, и женщинам.'
    example_gloss:
    - У Джулии голубые глаза.
    - У Луки карие глаза.
    - У Кьяры зелёные глаза.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Цвета согласуются во множественном числе
    gloss: 'Цвета глаз стоят во множественном числе, как и occhi: occhi azzurri, marroni, verdi.'
    note: 'Прилагательные, которые в единственном числе оканчиваются на -e (*verde*, *marrone*), во множественном оканчиваются на -i: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Как выглядит Giulia?
    gloss: Как выглядит Джулия?
    note: '*Com''è?* — главный вопрос о внешности. *Com''è* — это *come è*: буква e выпадает, вместо неё ставится апостроф.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: У Джулии длинные светлые волосы и голубые глаза
    gloss: У Джулии длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: *avere* + волосы + *e* + глаза в одном предложении.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Джулия рассказывает о Нине
    gloss: 'Джулия: В языковое кафе придёт новая девушка. Её зовут Нина.'
    note: '*Viene* («придёт», «приходит») вводит нового человека. *Si chiama* значит «её зовут», буквально «она называет себя».'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Марко спрашивает, как она выглядит
    gloss: 'Марко: Хорошо! Как она выглядит?'
    note: 'Тот же вопрос, но без имени: подлежащее понятно из контекста.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Джулия описывает рост и волосы Нины
    gloss: 'Джулия: Она невысокая, у неё короткие светлые волосы.'
    note: В *È bassa* («она невысокая») стоит форма женского рода *bassa*; описание волос продолжается с *ha*.
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Марко спрашивает о её глазах
    gloss: 'Марко: А глаза?'
    note: В *E gli occhi?* нет глагола. Как и в русском, в итальянском часто опускают слова, которые понятны из контекста.
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Джулия описывает глаза Нины
    gloss: 'Джулия: У неё зелёные глаза.'
    note: '*Ha gli occhi verdi*: местоимение не нужно, потому что окончание глагола уже показывает, что речь о «ней».'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Марко узнает её
    gloss: 'Марко: Спасибо! Тогда я её узнаю.'
    note: '*La riconosco* («я её узнаю»): местоимение-дополнение *la* стоит перед глаголом.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Сравниваем Luca и Chiara
    gloss: Лука и Кьяра — брат и сестра, но они совсем не похожи. Лука невысокий, у него короткие каштановые волосы и карие глаза. Кьяра выше Луки, у неё длинные каштановые волосы и зелёные глаза. А ты как выглядишь?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      fratello: брат
      sorella: сестра
      sembrano: они выглядят / кажутся
      diversi: разный
      basso: невысокий
      corti: невысокий
      castani: карий
      capelli: волосы
      marroni: карий
      occhi: глаза
      alta: высокий (più alta = выше)
      lunghi: длинный
      verdi: зелёный
      come: как (Tu come sei? = Как ты выглядишь?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Сравнение: più ... di'
    gloss: 'В итальянском сравнивают так: più + прилагательное + di: Chiara è più alta di Luca.'
    note: 'Поставь *più* перед прилагательным, а *di* — перед тем, с кем сравниваешь. Прилагательное сохраняет род: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: У Кьяры волосы длиннее, чем у Луки
    gloss: У Кьяры волосы длиннее, чем у Луки.
    note: '*I capelli più lunghi di Luca*: прилагательное остаётся во множественном числе, чтобы согласоваться с *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: '*Ho i capelli corti e castani*: чтобы описать свою внешность, используй *avere*.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Марко замечает Нину
    gloss: 'Марко: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Guarda* («смотри») — повелительная форма на *ty*. *Quella* значит «вон та» о женщине или девушке.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Джулия подтверждает
    gloss: 'Джулия: Да, это Нина!'
    note: Короткое естественное подтверждение.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Нина здоровается с Марко
    gloss: 'Нина: Привет, ты Марко?'
    note: '*Sei Marco?* — неформальный вопрос: *sei* — форма *ty* глагола *essere*, поэтому местоимение *tu* не нужно.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Марко отвечает на приветствие
    gloss: 'Марко: Да! Приятно познакомиться, Нина.'
    note: '*Piacere di conoscerti* — фраза для первого знакомства; *-ti* значит «тебя».'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Марко узнал Нину по описанию Джулии.'
