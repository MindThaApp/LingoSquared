    title: Mi piace + время года
    gloss: 'Mi piace + время года выражает, как ты относишься к сезону: Mi piace l''estate. Для двух сезонов используется mi piacciono: Mi piacciono l''estate e l''inverno.'
    note: 'В итальянском то, что нравится, — подлежащее, поэтому глагол с ним согласуется: mi piace l''estate (одно), mi piacciono l''estate e l''inverno (два). Это похоже на русское «мне нравится лето» и «мне нравятся лето и зима», только порядок слов в итальянском другой.'
