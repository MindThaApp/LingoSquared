    title: Ответ Джулии
    gloss: 'Джулия: Я люблю зиму. Зимой мы катаемся на коньках.'
  it.a1.unit55.lesson06.teach.luca_trovo_bello:
    title: Ответ Луки
    gloss: 'Лука: Осень, по-моему, прекрасна. Осенью так спокойно.'
