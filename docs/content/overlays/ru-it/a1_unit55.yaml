    gloss: 'Марко: Мне нравится лето. Летом мы плаваем!'
  it.a1.unit55.lesson05.teach.adesso_e_primavera:
    title: Разговор о временах года
    gloss: 'Сейчас весна. Тюльпаны красивые. Нина спрашивает: Какое время года ты находишь самым красивым? Марко говорит: Мне нравится лето. Летом мы плаваем. Джулия говорит: Мне нравится зима. Зимой мы катаемся на коньках.'
    note: 'Краткий пересказ разговора в языковом кафе: реплики героев переданы прямой речью.'
    glosses:
      primavera: весна
      tulipani: тюльпаны
      belli: красивые (мн. ч.)
      chiede: спрашивает
      stagione: время года
      trovi: ты находишь
      dice: говорит
      estate: лето
      piace: нравится (mi piace = мне нравится)
      nuotiamo: мы плаваем
      inverno: зима
      pattiniamo: мы катаемся на коньках (sul ghiaccio = на льду)
  it.a1.unit55.lesson05.teach.la_conversazione_sulle:
    title: Разговор интересный
    gloss: Разговор о временах года интересный.
  it.a1.unit55.lesson06.teach.luca_ciao_a:
    title: Лука присоединяется к компании
    gloss: 'Лука: Всем привет! Какое время года ты находишь самым красивым, Джулия?'
