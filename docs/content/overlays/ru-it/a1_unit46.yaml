  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: План Кьяры
    gloss: 'Кьяра: Я предпочитаю плавать, но в парк я тоже приду.'
    note: '*Preferisco nuotare* (я предпочитаю плавать) — прямой способ сказать о предпочтении. *Anch''io* (я тоже) пишется одним словом с апострофом.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Джулия завершает разговор
    gloss: 'Джулия: Отлично! До субботы в парке!'
    note: Одной фразой завершает переписку этого урока и план из темы спорта.
