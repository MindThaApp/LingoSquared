    title: Кто чем пользуется?
    gloss: Джулия звонит Марко каждый день. Она пользуется телефоном, а не приложением. У Марко нет дома компьютера, но он выходит в интернет с телефона. Лука каждое утро ищет прогноз погоды. Потом идёт бегать. Кьяра часто отправляет Джулии сообщения. А ты пользуешься телефоном каждый день?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
