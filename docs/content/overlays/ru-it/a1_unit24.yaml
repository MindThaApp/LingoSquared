teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: деньги, карта
    note: '*Soldi* в итальянском только во множественном числе (как и русское «деньги»); *carta* — обычное краткое название платёжной карты.'
    example_gloss:
    - У меня есть деньги.
    - Я плачу картой.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: наличные, чек
    note: '*Contanti* — слово во множественном числе; *scontrino* — обычный кассовый чек в магазине.'
    example_gloss:
    - Я плачу наличными.
    - Вот чек.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Я плачу картой.
    note: Для оплаты картой используй *con la carta*.
    example_gloss:
    - В кафе я плачу картой.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Я плачу наличными.
    note: Для оплаты наличными используй *in contanti*.
    example_gloss:
    - Сегодня я плачу наличными.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: Можно заплатить картой?
    note: '*Posso pagare...?* — так спрашивают, принимают ли такой способ оплаты.'
    example_gloss:
    - Можно сегодня заплатить картой?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Это десять евро.
    note: С ценами в итальянском часто используют *sono* во множественном числе (в русском глагола здесь нет).
    example_gloss:
    - Футболка стоит десять евро.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Да, конечно.
    note: Для «да» пиши *Sì* с акцентом; *si* без акцента означает другое.
    example_gloss:
    - Да, конечно, я плачу картой.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Вот чек.
    note: '*Ecco* указывает на что-то: вот.'
    example_gloss:
    - Спасибо, вот чек.
