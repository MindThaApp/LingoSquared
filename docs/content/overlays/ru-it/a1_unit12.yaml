  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: Встретимся в восемь перед кинотеатром.
    note: '*davanti a* (перед) с артиклем указывает место встречи.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Отлично, тогда до вечера!
    note: '*a stasera* (до вечера) — прощание, в котором названо оговорённое время.'
    example_gloss:
