    example_gloss:
    - Хорошо, пойдём вместе.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: Пойдём сегодня вечером в кино?
    note: '*Andiamo* в вопросе — это предложение сделать что-то вместе.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: Хорошо, пойдём!
    note: '*Va bene* принимает предложение, а *andiamo* с энтузиазмом повторяет приглашение.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Во сколько встретимся?
