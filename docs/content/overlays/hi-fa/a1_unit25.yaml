teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: वह
    gloss: वह
    note: '*او* यहाँ फिर से रूप-रंग के वर्णन में कर्ता के रूप में आता है।'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: कद
    gloss: कद
    note: '*قد* यहाँ फिर से आया है। *قدش* में *-ش* स्वामित्व प्रत्यय जुड़ा है (उसका कद), ठीक वैसे ही जैसे यूनिट 20 के *امتحانش* में।'
    example_gloss: नीमा लंबा है।
  fa.a1.unit25.lesson01.teach.boland_word:
    title: लंबा
    gloss: लंबा
    note: '*بلند* का मतलब है लंबा (या ऊँचा)। *قدش بلنده* का शाब्दिक अर्थ है ''उसका कद लंबा है'' -- किसी को लंबा बताने का यह बोलचाल का स्वाभाविक तरीका है।'
    example_gloss: उसका कद लंबा है।
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: छोटा
    gloss: छोटा
    note: '*کوتاه* का मतलब है छोटा।'
    example_gloss: उसका कद छोटा है।
  fa.a1.unit25.lesson02.teach.mo_word:
    title: बाल
    gloss: बाल
    note: '*مو* का मतलब है बाल। *موی* इज़ाफ़े (जोड़ने वाला) रूप है, जो विशेषण से पहले आता है, जैसे *موی بلند* (लंबे बाल)।'
    example_gloss: उसके बाल लंबे हैं।
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: उसके बाल
    gloss: उसके बाल
    note: '*موهاش* में बहुवचन *موها* (बाल) और स्वामित्व प्रत्यय *-ش* जुड़े हैं -- ''उसके बाल''।'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: काला
    gloss: काला
    note: '*مشکی* बालों/आँखों के काले रंग के लिए रोज़मर्रा का बोलचाल का शब्द है -- यहाँ यह यूनिट 20 के *سیاه* से ज़्यादा स्वाभाविक है, क्योंकि سیاه कपड़ों के लिए ज़्यादा उपयुक्त है, बालों के लिए कम।'
    example_gloss: उसके बाल काले हैं।
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: सुनहरा (ब्लोंड)
    gloss: सुनहरे बालों वाला
    note: '*بلوند* (एक उधार लिया शब्द) का मतलब है सुनहरा/भूरा-सुनहरा (ब्लोंड)।'
    example_gloss: उसके बाल सुनहरे हैं।
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: आँख
    gloss: आँख
    note: '*چشم* का मतलब है आँख। *چشمای* बोलचाल का बहुवचन + इज़ाफ़े वाला रूप है (...की आँखें), जैसे *چشمای آبی* (नीली आँखें)।'
    example_gloss: उसकी आँखें भूरी हैं।
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: उसकी आँखें
    gloss: उसकी आँखें
    note: '*چشماش* में बोलचाल का बहुवचन *چشما* और स्वामित्व प्रत्यय *-ش* जुड़े हैं -- ''उसकी आँखें''। ध्यान दें कि *چشماش آبیه* में *چشما* बहुवचन होने पर भी एकवचन अंत *-ه* आता है -- फ़ारसी में यह सामान्य है, क्योंकि जो बहुवचन चीज़ें लोग नहीं होतीं, उनके साथ आमतौर पर एकवचन क्रिया आती है।'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: भूरा
    gloss: भूरा
    note: '*قهوه‌ای* (शाब्दिक अर्थ ''कॉफ़ी के रंग का'') का मतलब है भूरा।'
    example_gloss: उसकी आँखें भूरी हैं।
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: हरा
    gloss: हरा
    note: '*سبز* का मतलब है हरा।'
    example_gloss: उसकी आँखें हरी हैं।
  fa.a1.unit25.lesson03.teach.abi_review:
    title: नीला
    gloss: नीला
    note: '*آبی* यहाँ आँखों के रंग के लिए फिर से आया है।'
    example_gloss: उसकी आँखें नीली हैं।
  fa.a1.unit25.lesson04.teach.man_review:
    title: मैं
    gloss: मैं
    note: '*من*, जो पहले से अच्छी तरह सीखा जा चुका है, यहाँ अपना वर्णन करने के लिए फिर से आया है।'
    example_gloss: मेरे बाल भूरे हैं।
  fa.a1.unit25.lesson04.teach.daram_review:
    title: मेरे पास है / उसके पास है
    gloss: मेरे पास है / उसके पास है
    note: '*دارم*/*داره* शारीरिक विशेषता के साथ भी उसी तरह काम करते हैं: *موی مشکی دارم* का मतलब है ''मेरे बाल काले हैं।'''
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: चश्मा
    gloss: चश्मा
    note: '*عینک* का मतलब है चश्मा।'
    example_gloss: वह चश्मा पहनता है।
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: वह पहनता/पहनती है
    gloss: वह पहनता/पहनती है
    note: '*می‌زنه* (शाब्दिक अर्थ ''मारता है'') चश्मा पहनने के लिए स्वाभाविक क्रिया है -- *عینک می‌زنه* का मतलब है ''चश्मा पहनता है''; यह यूनिट 8/यूनिट 24 के *می‌کنم* (करना) से अलग क्रिया है।'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: वह कैसा/कैसी दिखता/दिखती है?
    gloss: वह कैसा/कैसी दिखता/दिखती है?
    note: '*چه شکلیه؟* का शाब्दिक अर्थ है ''यह किस शक्ल का है?'' -- किसी के रूप-रंग के बारे में पूछने का यह मानक बोलचाल का तरीका है।'
  fa.a1.unit25.lesson04.teach.va_review:
    title: और
    gloss: और
    note: '*و* का मतलब है ''और'' -- इसे हम यूनिट 14/यूनिट 24 में पहले ही इसी तरह इस्तेमाल कर चुके हैं।'
    example_gloss: उसका कद लंबा है और उसके बाल काले हैं।
  fa.a1.unit25.lesson05.teach.nima_review:
    title: नीमा
    gloss: नीमा
    note: '*نیما*, जो यूनिट 11 में एक पात्र के रूप में आया था, यहाँ फिर से आता है।'
    example_gloss: नीमा सारा का दोस्त है।
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'पाठ: नीमा का रूप-रंग'
    gloss: नीमा लंबा है। उसके बाल काले हैं और उसकी आँखें भूरी हैं। वह चश्मा पहनता है।
    note: यह पाठ पाठ 1-4 की हर संरचना को दोहराता है -- लगभग कोई नया शब्द नहीं, बस जुड़े हुए पाठ में उन्हें पहचानना है।
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: मरयम
    gloss: मरयम
    note: '*مریم* एक नया पात्र है -- सारा की सहेली, जिससे نیما अभी तक नहीं मिला है।'
    example_gloss: मरयम सारा की सहेली है।
  fa.a1.unit25.lesson06.teach.alan_review:
    title: अभी
    gloss: अभी
    note: '*الان* यहाँ फिर से आया है।'
    example_gloss: मरयम अभी आ रही है।
  fa.a1.unit25.lesson06.teach.miad_word:
    title: आ रहा/रही है
    gloss: आ रहा/रही है
    note: '*میاد* क्रिया *آمدن* (आना) का बोलचाल का वर्तमान काल रूप है।'
    example_gloss: मरयम अभी आ रही है।
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: यह किस रंग का है?
    gloss: यह किस रंग का है?
    note: '*چه رنگیه؟* में *چه* (क्या/कौन-सा, पाठ 4 से), *رنگی* (रंग वाला, *رنگ* + *-ی* से) और *-ه* (है) जुड़े हैं -- ''यह किस रंग का है?'''
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: ठीक है, धन्यवाद
    gloss: ठीक है, धन्यवाद
    note: '*باشه* और *ممنون*, जो दोनों पहले आ चुके हैं, यहाँ बातचीत के स्वाभाविक अंत के रूप में साथ आते हैं।'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'सारा: मरयम अभी आ रही है।'
    gloss: मरयम अभी आ रही है।
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'नीमा: मरयम कैसी दिखती है?'
    gloss: मरयम कैसी दिखती है?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'सारा: वह लंबी है और उसके बाल काले हैं।'
    gloss: उसका कद लंबा है और उसके बाल काले हैं।
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'नीमा: उसकी आँखें किस रंग की हैं?'
    gloss: उसकी आँखें किस रंग की हैं?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'सारा: उसकी आँखें भूरी हैं।'
    gloss: उसकी आँखें भूरी हैं।
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'नीमा: ठीक है, धन्यवाद।'
    gloss: ठीक है, धन्यवाद।
