teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: घंटा / घड़ी
    gloss: घंटा / घड़ी
    note: ساعت का अर्थ "घंटा" भी है और "घड़ी" भी; समय बताने का यही मूल शब्द है।
    example_gloss: कितने बजे हैं?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: मिनट
    gloss: मिनट
    note: دقیقه मिनट के लिए शब्द है।
    example_gloss: पाँच मिनट रुकिए।
  fa.a1.unit09.lesson01.teach.half_word:
    title: आधा
    gloss: आधा
    note: نیم का अर्थ आधा है; यह आधे घंटे के लिए इस्तेमाल होता है।
    example_gloss: साढ़े सात बजे हैं।
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: चौथाई
    gloss: चौथाई
    note: ربع का अर्थ चौथाई है; यह घंटे के चौथाई हिस्से (15 मिनट) के लिए इस्तेमाल होता है।
    example_gloss: आठ बजने में पंद्रह मिनट हैं।
  fa.a1.unit09.lesson01.teach.va_word:
    title: और
    gloss: और
    note: و इस इकाई में हर जगह इस्तेमाल होने वाला आम जोड़ने वाला शब्द है।
    target_text: و (और)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: ساعت چنده؟ समय पूछने का रोज़मर्रा का बोलचाल वाला तरीका है।
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: बोलचाल का संक्षिप्त रूप -e (दोहराव)
    gloss: چنده, چند است का रोज़ बोली जाने वाली भाषा में छोटा रूप है।
    note: यही संक्षेप का तरीका मौसम और खरीदारी के शब्दों, जैसे آفتابیه और تومنه, में पहले देखा जा चुका है।
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: '"साढ़े तीन बजे हैं" कहना'
    gloss: साढ़े तीन बजे हैं।
    note: ساعت سه و نیمه में घंटा, و (और) और संक्षिप्त रूप نیمه (आधा) एक साथ आते हैं।
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: बोलचाल का संक्षिप्त रूप -e, نیم पर लागू
    gloss: نیمه, نیم است का रोज़ बोली जाने वाली भाषा में छोटा रूप है।
    note: वही तरीका जो چنده में है, यहाँ چند की जगह نیم पर लागू हुआ है।
  fa.a1.unit09.lesson04.teach.sobh:
    title: सुबह
    gloss: सुबह
    note: صبح दिन के सुबह वाले हिस्से का नाम है।
    example_gloss: मैं सुबह जल्दी उठता हूँ।
  fa.a1.unit09.lesson04.teach.zohr:
    title: दोपहर बारह बजे
    gloss: दोपहर (12 बजे)
    note: ظهر दोपहर का नाम है।
    example_gloss: दोपहर को मैं खाना खाता हूँ।
  fa.a1.unit09.lesson04.teach.asr:
    title: दोपहर बाद / शाम से पहले
    gloss: दोपहर बाद
    note: عصر दिन के दोपहर बाद और शाम के शुरुआती हिस्से का नाम है।
    example_gloss: मैं दोपहर बाद काम करता/करती हूँ।
  fa.a1.unit09.lesson04.teach.shab:
    title: रात
    gloss: रात
    note: شب रात का नाम है।
    example_gloss: मैं रात को जल्दी सो जाता हूँ।
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: अपॉइंटमेंट
    gloss: मुलाकात (पहले से तय)
    note: قرار पहले से तय की गई मुलाकात या अपॉइंटमेंट के लिए इस्तेमाल होने वाला आम शब्द है।
    example_gloss: मेरी एक मुलाकात तय है।
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: पूछें कि मुलाकात कितने बजे है
    gloss: मुलाकात कितने बजे है?
    note: قرار ساعت چنده؟ में पाठ 2 का समय पूछने वाला सवाल किसी खास मुलाकात के लिए इस्तेमाल हुआ है।
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: दिन के हिस्से के साथ समय बताएँ
    gloss: शाम के चार बजे (दोपहर बाद चार बजे)
    note: ساعت چهار عصر में घंटे के साथ عصر जुड़ा है, ताकि सुबह और दोपहर बाद का फ़र्क़ साफ़ हो जाए।
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: कल (दोहराव)
    gloss: कल
    note: فردا पिछली यूनिट में आ चुका है; यहाँ इसे मुलाकात की बात शुरू करने के लिए इस्तेमाल किया गया है।
    example_gloss: कल मेरी एक मुलाकात है।
  fa.a1.unit09.lesson06.teach.late_word:
    title: कहें कि आपको थोड़ी देर होगी
    gloss: मुझे थोड़ी देर हो जाएगी।
    note: '*یکم دیر می‌شه* में बोलचाल का *یکم* (थोड़ा) और *دیر* (देर) इस्तेमाल हुआ है।'
  fa.a1.unit09.lesson06.teach.turn01:
    title: निगार कल की मुलाकात का समय पूछती है
    gloss: निगार पूछती है कि कल की मुलाकात कितने बजे है।
    note: قرار فردا ساعت چنده؟ में पाठ 5 का मुलाकात वाला सवाल فردا (कल) के साथ जुड़ा है।
  fa.a1.unit09.lesson06.teach.turn02:
    title: आरश अनिश्चित होकर जवाब देता है
    gloss: आरश कहता है कि उसे लगता है चार बजे है।
    note: فکر کنم (मुझे लगता है) जवाब को नरम बना देता है, क्योंकि आरश को पूरा यक़ीन नहीं है।
  fa.a1.unit09.lesson06.teach.turn03:
    title: निगार पूछती है कि सुबह या दोपहर बाद
    gloss: निगार पूछती है कि चार बजे दोपहर बाद के हैं या सुबह के।
    note: इससे उलझन दूर होती है, क्योंकि सिर्फ़ ساعت چهار से पता नहीं चलता कि कौन-से चार बजे।
  fa.a1.unit09.lesson06.teach.turn04:
    title: आरश साफ़ करता है
    gloss: 'आरश कहता है: दोपहर बाद।'
    note: जब सवाल से संदर्भ साफ़ हो चुका हो, तो एक शब्द का जवाब स्वाभाविक लगता है।
  fa.a1.unit09.lesson06.teach.turn05:
    title: निगार मान जाती है और आने का समय बदल देती है
    gloss: निगार मान जाती है और कहती है कि वह सवा चार बजे आएगी।
    note: ساعت چهار و ربع में घंटे के साथ ربع (चौथाई) जुड़ा है।
  fa.a1.unit09.lesson06.teach.turn06:
    title: आरश पूछता है कि यह अतिरिक्त चौथाई घंटा क्यों
    gloss: आरश पूछता है कि वह सवा क्यों कह रही है।
    note: '*چرا ربع؟* "चौथाई क्यों?" पूछने का छोटा तरीक़ा है।'
  fa.a1.unit09.lesson06.teach.turn07:
    title: निगार बताती है कि उसे थोड़ी देर होगी
    gloss: निगार बताती है कि काम से निकलने में उसे थोड़ी देर हो जाएगी।
    note: '*چون* (क्योंकि) कारण बताता है, और इसके साथ *یکم دیر می‌شه* (मुझे थोड़ी देर होगी) आया है, जो आपने इसी पाठ में सीखा।'
  fa.a1.unit09.lesson06.teach.turn08:
    title: आरश उसे तसल्ली देता है
    gloss: 'आरश कहता है: ठीक है, कोई दिक़्क़त नहीं।'
    note: مشکلی نیست (कोई दिक़्क़त नहीं) निगार को भरोसा दिलाता है कि थोड़ी देर होना ठीक है।
