  fa.a1.unit06.lesson06.teach.turn08:
    title: ग्राहक खाने की तारीफ़ करता है और बिल माँगता है
    gloss: ग्राहक कहता है कि बहुत स्वादिष्ट था और बिल माँगता है।
    note: दोनों वाक्यांश सीधे पाठ 05 की शब्दावली का दोबारा प्रयोग करते हैं।
  fa.a1.unit06.lesson06.teach.turn09:
    title: वेटर बिल लाता है
    gloss: वेटर हामी भरता है और कहता है कि वह अभी लाता है।
    note: البته (बिल्कुल) यहाँ एक स्वाभाविक और विनम्र सहमति है।
