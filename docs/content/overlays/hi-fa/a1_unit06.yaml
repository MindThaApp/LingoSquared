  fa.a1.unit06.lesson06.teach.turn06:
    title: ग्राहक पूरा ऑर्डर देता है
    gloss: ग्राहक मान जाता है और चावल के साथ चिकन कबाब और एक चाय का ऑर्डर देता है।
    note: यहाँ می‌خواستم का प्रयोग हुआ है, जो ऐसे वेटर के लिए उचित है जिसे ग्राहक व्यक्तिगत रूप से नहीं जानता।
  fa.a1.unit06.lesson06.teach.turn07:
    title: वेटर ऑर्डर स्वीकार करता है
    gloss: वेटर कहता है कि वह अभी लाता है।
