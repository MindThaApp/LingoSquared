  fa.a1.unit06.lesson06.teach.turn02:
    title: ग्राहक मेन्यू माँगता है
    gloss: ग्राहक वेटर को नमस्ते कहता है और मेन्यू माँगता है।
    note: منو دارید؟ से ऑर्डर की बातचीत शुरू होती है।
  fa.a1.unit06.lesson06.teach.turn03:
