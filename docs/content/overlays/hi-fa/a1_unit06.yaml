  fa.a1.unit06.lesson06.teach.turn04:
    title: ग्राहक सुझाव माँगता है
    gloss: ग्राहक पूछता है कि वेटर क्या सुझाता है।
    note: چی توصیه می‌کنید؟ पाठ 3 से।
  fa.a1.unit06.lesson06.teach.turn05:
    title: वेटर एक व्यंजन सुझाता है
    gloss: वेटर कहता है कि चिकन कबाब आज बहुत अच्छा है।
