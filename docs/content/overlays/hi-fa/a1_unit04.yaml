  fa.a1.unit04.lesson01.teach.khahar:
    title: बहन
    gloss: बहन
    note: خواهر, बहन के लिए मानक शब्द।
    example_gloss: मेरी बहन छात्रा है।
  fa.a1.unit04.lesson01.teach.register_note:
    title: औपचारिक और रोज़मर्रा के शब्द
    gloss: मम्मी-पापा का मतलब माँ-पिता जैसा ही है, लेकिन ये ज़्यादा घरेलू शब्द हैं।
    note: फ़ारसी में माता-पिता के लिए दो असली रूप हैं, औपचारिक/अनौपचारिक का कोई सख़्त बँटवारा नहीं -- مامان/بابا वे शब्द हैं जिनसे ज़्यादातर लोग अपने माता-पिता को बुलाते हैं, शिष्ट बातचीत में भी।
  fa.a1.unit04.lesson02.teach.daram:
    title: मेरे पास है
    gloss: मेरे पास है
    note: '*دارم* क्रिया *داشتن* (''होना/पास होना'') का उत्तम पुरुष रूप है -- परिवार बताने की मुख्य क्रिया।'
  fa.a1.unit04.lesson02.teach.yek:
    title: एक
    gloss: एक
    note: یک गिने जाने वाली संज्ञा से पहले आता है, जैसे یک برادر (एक भाई)।
    example_gloss: मेरी एक बहन है।
  fa.a1.unit04.lesson02.teach.one_brother:
    title: मेरा एक भाई है।
    gloss: मेरा एक भाई है।
    note: 'शब्द-क्रम: कर्ता, संख्या+संज्ञा, क्रिया -- फ़ारसी का विशिष्ट SOV क्रम, जो हिंदी जैसा ही है।'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: मेरी कोई बहन नहीं है।
    gloss: मेरी कोई बहन नहीं है।
    note: ندارم दارم का निषेध रूप है; 'एक' के लिए अलग शब्द की ज़रूरत नहीं।
  fa.a1.unit04.lesson02.teach.family_big:
    title: मेरा परिवार बड़ा है।
    gloss: मेरा परिवार बड़ा है।
    note: بزرگه बोलचाल का रूप है, जो 'بزرگ است' (बड़ा है) का संक्षिप्त रूप है।
  fa.a1.unit04.lesson02.teach.family_small:
    title: हमारा परिवार छोटा है।
    gloss: हमारा परिवार छोटा है।
    note: کوچیکه बोलचाल का रूप है, जो 'کوچک است' (छोटा है) का संक्षिप्त रूप है, और इसमें लिखित کوچک की जगह बोलचाल का उच्चारण کوچیک है।
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: दादा / नाना
    gloss: दादा / नाना
    note: پدربزرگ, शाब्दिक अर्थ 'बड़े पिता' -- ननिहाल और ददिहाल, दोनों तरफ़ के लिए इस्तेमाल होता है।
    example_gloss: मेरे दादा/नाना बूढ़े हैं।
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: दादी / नानी
    gloss: दादी / नानी
    note: مادربزرگ, शाब्दिक अर्थ 'बड़ी माँ' -- ननिहाल और ददिहाल, दोनों तरफ़ के लिए इस्तेमाल होता है।
    example_gloss: मेरी दादी/नानी दयालु हैं।
  fa.a1.unit04.lesson03.teach.amoo:
    title: चाचा/ताऊ (पिता के भाई)
    gloss: चाचा (पिता के भाई)
    note: عمو का मतलब ख़ास तौर पर पिता का भाई है, यह किसी भी 'अंकल' के लिए सामान्य शब्द नहीं है।
    example_gloss: मेरे चाचा तेहरान में रहते हैं।
  fa.a1.unit04.lesson03.teach.amme:
    title: बुआ (पिता की बहन)
    gloss: बुआ (पिता की बहन)
    note: عمه का मतलब ख़ास तौर पर पिता की बहन है।
    example_gloss: मेरी बुआ शिक्षिका हैं।
  fa.a1.unit04.lesson03.teach.dayi:
    title: मामा (माँ के भाई)
    gloss: मामा (माँ के भाई)
    note: دایی का मतलब ख़ास तौर पर माँ का भाई है -- हिंदी की तरह फ़ारसी में भी हर चाचा-मामा, बुआ-मौसी का रिश्ता परिवार के किस पक्ष से है, यह अलग शब्द से बताया जाता है।
    example_gloss: मेरे मामा इंजीनियर हैं।
  fa.a1.unit04.lesson03.teach.khale:
    title: मौसी (माँ की बहन)
    gloss: मौसी (माँ की बहन)
    note: خاله का मतलब ख़ास तौर पर माँ की बहन है।
    example_gloss: मेरी मौसी इस्फ़हान में रहती हैं।
  fa.a1.unit04.lesson03.teach.register_note:
    title: पिता का पक्ष और माँ का पक्ष
    gloss: चाचा और बुआ पिता की तरफ़ के हैं; मामा और मौसी माँ की तरफ़ के हैं।
    note: 'चार रिश्तों का यह बँटवारा (عمو/عمه बनाम دایی/خاله) हिंदी जैसा ही है: चाचा/बुआ पिता की तरफ़ के और मामा/मौसी माँ की तरफ़ के होते हैं।'
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: कितने
    gloss: कितने
    note: چند تا अनौपचारिक रूप से लोगों या चीज़ों को गिनने से पहले इस्तेमाल होता है।
    example_gloss: आपकी कितनी बहनें हैं?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: आपके कितने भाई-बहन हैं? (शिष्ट)
    gloss: आपके कितने भाई-बहन हैं?
    note: دارید 'होना/पास होना' का शिष्ट/बहुवचन रूप है, जो شما के साथ आता है।
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: तुम्हारे कितने भाई-बहन हैं? (अनौपचारिक)
    gloss: आपके कितने भाई-बहन हैं?
    note: داری अनौपचारिक एकवचन रूप है, जो बराबर वाले या छोटे के साथ इस्तेमाल होता है।
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: आपके परिवार में कितने लोग हैं?
    gloss: आपके परिवार में कितने लोग हैं?
    note: نفر लोगों के लिए गिनती-शब्द है; نفرن बोलचाल का रूप है, जो 'نفر هستند' (... लोग हैं) का संक्षिप्त रूप है।
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'हम चार लोग हैं: मैं, मेरी मम्मी, मेरे पापा और मेरा भाई।'
    gloss: 'हम चार लोग हैं: मैं, मेरी मम्मी, मेरे पापा और मेरा भाई।'
    note: نفریم = 'نفر هستیم' (हम ... लोग हैं) का संक्षिप्त बोलचाल का रूप।
  fa.a1.unit04.lesson05.teach.showhar:
    title: पति
    gloss: पति
    note: شوهر, पति के लिए मानक शब्द।
    example_gloss: मेरे पति इंजीनियर हैं।
  fa.a1.unit04.lesson05.teach.zan:
    title: पत्नी
    gloss: पत्नी
    note: زن का अर्थ आम तौर पर 'औरत' भी होता है; संदर्भ से मतलब साफ़ हो जाता है।
    example_gloss: मेरी पत्नी शिक्षिका हैं।
  fa.a1.unit04.lesson05.teach.motahel:
    title: विवाहित
    gloss: विवाहित
    note: متأهل, वैवाहिक स्थिति बताने वाला तटस्थ और आम तौर पर इस्तेमाल होने वाला विशेषण।
    example_gloss: वह विवाहित है।
  fa.a1.unit04.lesson05.teach.mojarad:
    title: अविवाहित
    gloss: अविवाहित
    note: مجرد, अविवाहित के लिए मानक शब्द।
    example_gloss: मैं अविवाहित हूँ।
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: मैं अविवाहित हूँ।
    gloss: मैं अविवाहित हूँ।
    note: مجردم = مجرد + م ('मैं हूँ'), वही उत्तम पुरुष प्रत्यय जो خوبم ('मैं ठीक हूँ') में है।
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: मैं विवाहित हूँ।
    gloss: मैं विवाहित हूँ।
    note: متأهلم = متأهل + م ('मैं हूँ'), مجردم जैसा ही ढाँचा।
  fa.a1.unit04.lesson05.teach.nave:
    title: नाती/पोता
    gloss: नाती/पोता (पोता या पोती)
    note: نوه में पोता-पोती और नाती-नातिन, सभी आ जाते हैं -- फ़ारसी में यहाँ लिंग बताना ज़रूरी नहीं।
    example_gloss: उसका एक नाती/पोता है।
  fa.a1.unit04.lesson05.teach.example:
    title: मेरा भाई विवाहित है; उसका एक बेटा है।
    gloss: मेरा भाई विवाहित है; उसका एक बेटा है।
    note: متأهله = 'متأهل است' (विवाहित है) का संक्षिप्त बोलचाल रूप; داره = 'دارد' (है/पास है) का बोलचाल रूप।
  fa.a1.unit04.lesson06.teach.in_photo:
    title: क्या यह तुम्हारे परिवार की तस्वीर है?
    gloss: क्या यह तुम्हारे परिवार की तस्वीर है?
    note: خانواده‌ته = 'خانواده‌ی تو است' (तुम्हारा परिवार है) का संक्षिप्त रूप -- बोलचाल का बहुत आम ढाँचा।
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: हाँ। ये मेरी मम्मी हैं, ये मेरे पापा।
    gloss: हाँ। ये मेरी मम्मी हैं, ये मेरे पापा।
    note: '*آره* बोलचाल का ''हाँ'' है (औपचारिक *بله* के मुक़ाबले)। *مامانمه* यानी *مامانم* (''मेरी मम्मी'') के साथ बोलचाल का ''है'' वाला अंत।'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: ये साहब कौन हैं?
    gloss: ये साहब कौन हैं?
    note: کیه = 'کی است' (कौन है) का संक्षिप्त बोलचाल रूप।
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: ये मेरे भाई हैं। मेरा एक भाई है, बहन नहीं है।
    gloss: ये मेरे भाई हैं। मेरा एक भाई है, बहन नहीं है।
    note: داداش भाई के लिए स्नेहपूर्ण, रोज़मर्रा का शब्द है, जो यहाँ पहले पाठ के ज़्यादा तटस्थ برادر की जगह इस्तेमाल हुआ है।
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: मेरा परिवार उलटा है; मेरी दो बहनें हैं, भाई नहीं है।
    gloss: मेरा परिवार उलटा है; मेरी दो बहनें हैं, भाई नहीं है।
    note: برعکسه = 'برعکس است' (उलटा है) का संक्षिप्त रूप।
  fa.a1.unit04.lesson06.teach.closing:
    title: तो तुम्हारा परिवार भी रौनक़ वाला है!
    gloss: तो तुम्हारा परिवार भी रौनक़ वाला है!
    note: شلوغه = 'شلوغ است' (भरा-पूरा/रौनक़ वाला है) का संक्षिप्त रूप -- कई बच्चों वाले परिवार को बताने का एक आत्मीय, आम तरीक़ा।
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'औपचारिक रूप: है / नहीं है / हैं'
    gloss: 'बोलचाल में: داره, نداره। औपचारिक लेखन में: دارد, ندارد; वह मेरा भाई है।'
    note: دارد/ندارد/است बोलचाल के داره/نداره रूपों के औपचारिक लिखित रूप हैं, जो इस संवाद में आए हैं -- ध्यान दें कि औपचारिक लेखन में स्नेहपूर्ण داداش की जगह तटस्थ برادر आता है।
