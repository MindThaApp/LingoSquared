    example_gloss: मेरे पिता डॉक्टर हैं।
  fa.a1.unit04.lesson01.teach.baba:
    title: पापा
    gloss: पापा
    note: بابا बोलचाल का वह रोज़मर्रा का शब्द है जिसे ज़्यादातर परिवार सचमुच इस्तेमाल करते हैं।
