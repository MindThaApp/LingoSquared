  fa.a1.unit26.lesson06.teach.sagame_word:
    title: यह मेरा कुत्ता है
    gloss: यह मेरा कुत्ता है
    note: '*سگمه* में पाठ 3 का *سگم* (मेरा कुत्ता) और *منه* वाला ही ''है'' के अर्थ का अंत *-ه* जुड़ा है -- ''यह मेरा कुत्ता है।'''
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: प्यारा
    gloss: प्यारा
    note: '*خوشگل* का अर्थ प्यारा या सुंदर है। *خیلی* का अर्थ ''बहुत'' है।'
    example_gloss: सारा की बिल्ली बहुत प्यारी है।
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: धन्यवाद
    gloss: शुक्रिया
    note: '*ممنون* यहाँ बातचीत के स्वाभाविक अंत के रूप में फिर आया है।'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'नीमा: यह बिल्ली किसकी है?'
    gloss: यह बिल्ली किसकी है?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'सारा: यह मेरी बिल्ली है। इसका नाम पशमक है।'
    gloss: यह मेरी बिल्ली है। इसका नाम पशमक है।
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'नीमा: यह किस रंग की है?'
    gloss: यह किस रंग की है?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'सारा: सफ़ेद और छोटी।'
    gloss: सफ़ेद और छोटी।
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'नीमा: बहुत प्यारी है!'
    gloss: बहुत प्यारी है!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'सारा: शुक्रिया!'
    gloss: शुक्रिया!
