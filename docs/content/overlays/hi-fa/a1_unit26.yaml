    gloss: यह
    note: '*این* का अर्थ ''यह'' है।'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: यह किसका है?
    gloss: यह किसका है?
    note: '*کیه* यहाँ यह पूछने के लिए इस्तेमाल हुआ है कि कोई पालतू जानवर किसका है।'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: यह मेरा है
    gloss: यह मेरा है
