    note: '*داری* यहाँ उसी अनौपचारिक मध्यम पुरुष रूप में फिर आता है।'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या तुम्हारे पास कोई पालतू जानवर है?
    note: '*حیوان خونگی داری؟* पाठ 1 के *حیوان خونگی* को *داری* के साथ जोड़ता है -- किसी से पूछने का स्वाभाविक तरीका कि क्या उसके पास कोई पालतू जानवर है।'
  fa.a1.unit26.lesson02.teach.are_review:
    title: हाँ
    gloss: हाँ
    note: '*آره* ''हाँ'' कहने का रोज़मर्रा की बोलचाल वाला शब्द है।'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: नाम
    gloss: नाम
    note: '*اسم* पालतू जानवर के नाम के लिए भी इसी तरह इस्तेमाल होता है।'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: इसका नाम क्या है?
    gloss: इसका नाम क्या है?
    note: '*اسمش چیه؟* में स्वामित्व वाला प्रत्यय *-ش* (जो आप यूनिट 25 में *قدش*/*موهاش* में देख चुके हैं) और यूनिट 2 का *چیه؟* जुड़े हैं -- ''इसका/उसका नाम क्या है?'''
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: खाना
    gloss: खाना
    note: '*غذا* वही शब्द है जो पालतू जानवर के खाने के लिए भी इस्तेमाल होता है।'
    example_gloss: मुझे खाना पसंद है।
  fa.a1.unit26.lesson03.teach.midam_word:
    title: मैं देता हूँ / खिलाता हूँ
    gloss: मैं देता हूँ / खिलाता हूँ
    note: '*می‌دم* (शाब्दिक अर्थ ''मैं देता हूँ''), जो यूनिट 24 के *گوش می‌دم* में पहले दिख चुका है, *غذا* के साथ पालतू जानवर को खिलाने के लिए स्वाभाविक क्रिया है।'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: मेरा कुत्ता
    gloss: मेरा कुत्ता
    note: '*سگم* में *سگ* के साथ स्वामित्व वाला प्रत्यय *-م* जुड़ा है -- ''मेरा कुत्ता''; यह यूनिट 2 के *اسمم* जैसा ही जुड़ा हुआ रूप है।'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: मैं अपने कुत्ते को खाना खिलाता हूँ।
    gloss: मैं अपने कुत्ते को खाना खिलाता हूँ।
    note: '*سگم رو غذا می‌دم* में *رو* (कर्म-चिह्न, जो यूनिट 14 के *قهوه رو بیشتر دوست دارم* में आ चुका है) *سگم* को खिलाए जाने वाले कर्म के रूप में चिह्नित करता है।'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: यह किस रंग का है?
    gloss: यह किस रंग का है?
    note: '*چه رنگیه؟* पालतू जानवर का रंग बताने के लिए भी इसी तरह इस्तेमाल होता है।'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: सफ़ेद
    gloss: सफ़ेद
    note: '*سفید* यहाँ पालतू जानवर के रंग के लिए फिर आया है। *گربه‌ی* में *گربه* का इज़ाफ़े वाला रूप है, जो स्वामी से पहले आता है, जैसे *گربه‌ی من* (मेरी बिल्ली) -- यूनिट 19 के *خونه‌ی من* जैसा ही पैटर्न, जो स्वर-अंत वाले संज्ञा शब्दों में जुड़े प्रत्यय की जगह इस्तेमाल होता है।'
    example_gloss: मेरी बिल्ली सफ़ेद है।
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: छोटा
    gloss: छोटा
    note: '*کوچیک* यहाँ पालतू जानवर के आकार के लिए फिर आया है।'
    example_gloss: मेरी मछली छोटी है।
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: बड़ा
    gloss: बड़ा
    note: '*بزرگ* यहाँ पालतू जानवर के आकार के लिए फिर आया है।'
    example_gloss: मेरा कुत्ता बड़ा है।
  fa.a1.unit26.lesson05.teach.sara_review:
    title: सारा
    gloss: सारा
    note: '*سارا*, जो यूनिट 2 में एक पात्र के रूप में आई थी, यहाँ फिर आती है।'
    example_gloss: सारा के पास एक बिल्ली है।
  fa.a1.unit26.lesson05.teach.yek_review:
    title: एक
    gloss: एक
    note: '*یک* यहाँ अनिश्चितता बताने वाले ''एक'' के रूप में इस्तेमाल हुआ है।'
  fa.a1.unit26.lesson05.teach.va_review:
    title: और
    gloss: और
    note: '*و* का अर्थ ''और'' है -- यह यूनिट 14, 24 और 25 में भी इसी तरह आ चुका है।'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: पशमक
    gloss: पशमक
    note: '*پشمک* (शाब्दिक अर्थ ''रूई की मिठाई'', यानी कॉटन कैंडी) ईरान में पालतू जानवर का आम नाम है -- यह सारा की बिल्ली का नाम है।'
    example_gloss: सारा की बिल्ली का नाम पशमक है।
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: हर दिन
    gloss: हर दिन
    note: '*هر روز* यहाँ पालतू जानवर को खिलाने के संदर्भ में भी इसी तरह इस्तेमाल होता है।'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: वह देता है / खिलाता है
    gloss: वह देता है / खिलाता है
    note: '*می‌ده* उसी क्रिया का अन्य पुरुष की बोलचाल वाला रूप है, जिसका रूप पाठ 3 में *می‌دم* (मैं देता/खिलाता हूँ) था।'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'पठन: सारा की बिल्ली'
    gloss: सारा के पास एक बिल्ली है। उसका नाम पशमक है। पशमक सफ़ेद और छोटी है। सारा हर दिन पशमक को खाना खिलाती है।
    note: इस पठन में पाठ 1-4 की सभी रचनाएँ दोहराई गई हैं -- लगभग कोई नया शब्द नहीं है, बस जुड़े हुए पाठ में उन्हें पहचानना है।
  fa.a1.unit26.lesson06.teach.in_word:
