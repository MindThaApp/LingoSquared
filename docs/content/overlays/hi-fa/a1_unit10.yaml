    gloss: कोई बात नहीं, मंगलवार को मिलते हैं।
    note: مشکلی نیست (कोई बात नहीं) रज़ा के मना करने को शिष्टता से स्वीकार करता है, और می‌بینمت का मतलब है 'मैं तुम्हें देखूँगा/मिलूँगा' — इससे मंगलवार मीटिंग का दिन पक्का होता है, जो पहली और चौथी बातों से मेल खाता है।
  fa.a1.unit10.lesson06.teach.va_and:
    title: और
    gloss: और
    note: '*و* का मतलब है ''और''। यह दो दिनों को जोड़ सकता है, जैसे *دوشنبه و سه‌شنبه*, या दो जुड़े सवालों को, जैसे *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: सोमवार और मंगलवार को मेरी क्लास होती है।
