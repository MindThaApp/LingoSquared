    gloss: आपको कौन-सा साइज़ चाहिए?
  fa.a1.unit20.lesson06.teach.turn04:
    title: नीमा साइज़ बताता है और पहनकर देखने को कहता है
    gloss: मध्यम साइज़। क्या मैं इसे पहनकर देख सकता हूँ?
  fa.a1.unit20.lesson06.teach.turn05:
    title: दुकानदार हामी भरता है
    gloss: हाँ, ज़रूर।
  fa.a1.unit20.lesson06.teach.turn06:
    title: नीमा को पसंद आती है और वह दाम पूछता है
    gloss: बहुत सुंदर है। यह कितने की है?
  fa.a1.unit20.lesson06.teach.turn07:
    title: दुकानदार दाम बताता है
    gloss: तीस हज़ार तोमान की है।
  fa.a1.unit20.lesson06.teach.turn08:
    title: नीमा नकद देने को राज़ी होता है
    gloss: ठीक है, मैं नकद दूँगा। धन्यवाद।
