    gloss: पतलून
    note: شلوار का मतलब पतलून/पैंट है।
    example_gloss: ये पतलूनें कितने की हैं?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: जूते
    gloss: जूते
    note: کفش का मतलब जूते हैं।
    example_gloss: क्या आपके पास जूते हैं?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: जैकेट
    gloss: जैकेट
    note: کت का मतलब जैकेट है (जैसे सूट की जैकेट या ब्लेज़र); भारी सर्दी के कोट के लिए आम तौर पर कोई और शब्द इस्तेमाल होता है।
    example_gloss: मुझे एक जैकेट चाहिए।
  fa.a1.unit20.lesson01.teach.nice_word:
    title: सुंदर / अच्छा
    gloss: सुंदर
    note: قشنگ "सुंदर/अच्छा" के लिए रोज़मर्रा का आम शब्द है, जो अक्सर -e संक्षिप्त रूप (قشنگه) के साथ आता है।
    example_gloss: यह जैकेट सुंदर है।
  fa.a1.unit20.lesson01.teach.want_word:
    title: मुझे चाहिए (दोहराव)
    gloss: मुझे चाहिए
    note: '*می‌خوام* बोलचाल में *می‌خواهم* का रूप है। आप इसे पिछली यूनिट में देख चुके हैं; इस यूनिट में कपड़े माँगने के लिए इसका बार-बार इस्तेमाल होता है।'
    target_text: می‌خوام (मैं चाहता/चाहती हूँ)
  fa.a1.unit20.lesson01.teach.va_word:
    title: और (दोहराव)
    gloss: और
    note: '*و* "और" के लिए जोड़ने वाला आम शब्द है, जो पिछली यूनिट में आ चुका है।'
    target_text: و (और)
  fa.a1.unit20.lesson02.teach.color_word:
    title: रंग
    gloss: रंग
    note: رنگ रंग के लिए सामान्य शब्द है।
    example_gloss: आपको कौन-सा रंग चाहिए?
  fa.a1.unit20.lesson02.teach.red_word:
    title: लाल
    gloss: लाल
    note: قرمز का मतलब लाल है।
    example_gloss: यह कमीज़ लाल है।
  fa.a1.unit20.lesson02.teach.blue_word:
    title: नीला
    gloss: नीला
    note: آبی का मतलब नीला है; "नीला है" कहने के लिए -e संक्षिप्त रूप (آبیه) लगता है।
    example_gloss: मेरी पतलून नीली है।
  fa.a1.unit20.lesson02.teach.black_word:
    title: काला
    gloss: काला
    note: سیاه का मतलब है काला।
    example_gloss: काले जूते अच्छे हैं।
  fa.a1.unit20.lesson02.teach.white_word:
