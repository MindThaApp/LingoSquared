    gloss: सफ़ेद
    note: سفید का मतलब है सफ़ेद।
    example_gloss: मुझे एक सफ़ेद जैकेट चाहिए।
  fa.a1.unit20.lesson03.teach.size_word:
    title: साइज़
    gloss: साइज़
    note: سایز कपड़ों के साइज़ के लिए रोज़मर्रा का शब्द है।
    example_gloss: आपको कौन-सा साइज़ चाहिए?
  fa.a1.unit20.lesson03.teach.big_word:
    title: बड़ा
    gloss: बड़ा
    note: بزرگ का मतलब है बड़ा।
    example_gloss: मुझे बड़ा साइज़ चाहिए।
  fa.a1.unit20.lesson03.teach.small_word:
    title: छोटा
    gloss: छोटा
    note: کوچیک का मतलब है छोटा; "है" के लिए बोलचाल का रूप -ه (کوچیکه) जुड़ता है।
    example_gloss: ये जूते छोटे हैं।
  fa.a1.unit20.lesson03.teach.medium_word:
    title: मध्यम
    gloss: मध्यम
    note: متوسط का मतलब है मध्यम/औसत साइज़।
    example_gloss: क्या आपके पास मध्यम साइज़ है?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: पहनकर देखने के लिए पूछना
    gloss: क्या मैं इसे पहनकर देख सकता हूँ?
    note: می‌تونم امتحانش کنم؟ कपड़ा पहनकर देखने की अनुमति माँगने का रोज़मर्रा का बोलचाल वाला तरीक़ा है।
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: हाँ, ज़रूर
    gloss: हाँ, ज़रूर।
    note: '*بله، بفرمایید* दुकानदार के हामी भरने का विनम्र तरीक़ा है; इसमें पिछली यूनिट का *بفرمایید* दोबारा आया है।'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: बोलचाल का रूप می‌تونم (दोहराव)
    gloss: मैं कर सकता हूँ (बोलचाल का रूप)
    note: 'रोज़मर्रा की बोलचाल में लिखित -ان- अक्सर -ون- बन जाता है: *می‌توانم* से *می‌تونم* (मैं कर सकता हूँ)। यही बदलाव आप *تومن* में पहले देख चुके हैं, जो *تومان* का बोलचाल रूप है।'
  fa.a1.unit20.lesson05.teach.label_text:
    title: कपड़े का लेबल
    gloss: 'साइज़: बड़ा। रंग: लाल।'
    note: कपड़ों पर लगे असली लेबल या टैग जैसा एक छोटा लेबल।
  fa.a1.unit20.lesson06.teach.please_review:
    title: कृपया / जी, लीजिए (दोहराव)
    gloss: कृपया / जी, लीजिए
    note: पिछली यूनिट से दोहराव।
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: धन्यवाद (दोहराव)
    gloss: धन्यवाद
    note: पिछली यूनिट से दोहराव।
  fa.a1.unit20.lesson06.teach.ok_review:
