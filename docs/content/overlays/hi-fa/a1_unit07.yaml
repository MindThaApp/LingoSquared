  fa.a1.unit07.lesson06.teach.coat_review:
    title: कोट पहनने का सुझाव देना
    gloss: हमें कोट पहनना चाहिए
    note: کت بپوشیم में वही بهتره + क्रिया वाला ढाँचा है जो چتر ببریم में है, यहाँ ठंडे मौसम के लिए।
    example_gloss: ठंड है, कोट पहन लेते हैं।
  fa.a1.unit07.lesson06.teach.turn01:
    title: सारा आज के मौसम के बारे में पूछती है
    gloss: सारा पूछती है कि आज मौसम कैसा है।
