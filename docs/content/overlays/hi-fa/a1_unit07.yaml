  fa.a1.unit07.lesson06.teach.turn02:
    title: रेज़ा कहता है कि बारिश हो रही है
    gloss: रेज़ा कहता है कि उसे लगता है बारिश हो रही है।
    note: فکر کنم (मुझे लगता है) बात को नरम कर देता है, क्योंकि वह अंदाज़ा लगा रहा है, पक्का नहीं जानता।
  fa.a1.unit07.lesson06.teach.turn03:
    title: सारा छाता ले जाने का सुझाव देती है
    gloss: सारा कहती है कि तब तो हमें छाता ले जाना चाहिए।
    note: پس (तो / इसलिए) मौसम की बात को सुझाव से जोड़ता है।
  fa.a1.unit07.lesson06.teach.turn04:
    title: रेज़ा सहमत होता है और कल के बारे में पूछता है
    gloss: रेज़ा सहमत होता है और पूछता है कि कल कैसा रहेगा।
    note: فردا چی؟ अगले दिन के बारे में पूछने का स्वाभाविक और संक्षिप्त तरीका है।
  fa.a1.unit07.lesson06.teach.turn05:
    title: सारा कल के मौसम का वर्णन करती है
    gloss: सारा कहती है कि कल धूप खिली होगी और गर्मी होगी।
    note: آفتابیه و گرمه में मौसम के दो शब्द संक्षिप्त रूप में و से जुड़े हैं।
  fa.a1.unit07.lesson06.teach.turn06:
    title: रेज़ा पार्क जाने का सुझाव देता है
    gloss: रेज़ा कहता है कि बढ़िया, तो पार्क चलते हैं।
    note: عالیه (बढ़िया) योजना रखने से पहले अच्छी प्रतिक्रिया दिखाता है।
  fa.a1.unit07.lesson06.teach.turn07:
    title: सारा सहमत होती है और विदा लेती है
    gloss: सारा सहमत होती है और कहती है कि कल मिलते हैं।
    note: باشه (ठीक है) किसी योजना पर सहमति जताने का आम बोलचाल का तरीका है।
