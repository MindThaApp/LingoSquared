    note: چون بارونیه، بهتره چتر ببریم मौसम से जुड़े कारण को सुझाव के साथ जोड़ता है।
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: कोट पहनने का सुझाव देना
    gloss: ठंड है, इसलिए हमें कोट पहनना चाहिए।
