  fa.a1.unit03.lesson01.teach.zero:
    title: शून्य
    gloss: 0 — शून्य
    note: صفر का प्रयोग शून्य के लिए होता है, फ़ोन नंबर जैसी लंबी संख्या के अंक के रूप में भी।
    example_gloss: शून्य एक संख्या है।
  fa.a1.unit03.lesson01.teach.one:
    title: एक
    gloss: 1 — एक
    note: یک का अर्थ एक है।
    example_gloss: मेरे पास एक किताब है।
  fa.a1.unit03.lesson01.teach.two:
    title: दो
    gloss: 2 — दो
    note: دو का अर्थ दो है।
    example_gloss: मेरे पास दो सेब हैं।
  fa.a1.unit03.lesson01.teach.three:
    title: तीन
    gloss: 3 — तीन
    note: سه का अर्थ तीन है।
    example_gloss: उसके तीन भाई हैं।
  fa.a1.unit03.lesson01.teach.four:
    title: चार
    gloss: 4 — चार
    note: چهار का अर्थ चार है।
    example_gloss: चार बजे हैं।
  fa.a1.unit03.lesson01.teach.five:
    title: पाँच
    gloss: 5 — पाँच
    note: پنج का अर्थ पाँच है।
    example_gloss: पाँच मिनट प्रतीक्षा कीजिए।
  fa.a1.unit03.lesson01.teach.six:
    title: छह
    gloss: 6 — छह
    note: شش का अर्थ छह है।
    example_gloss: छह कुर्सियाँ हैं।
  fa.a1.unit03.lesson01.teach.seven:
    title: सात
    gloss: 7 — सात
    note: هفت का अर्थ सात है।
    example_gloss: एक सप्ताह में सात दिन होते हैं।
  fa.a1.unit03.lesson01.teach.eight:
    title: आठ
    gloss: 8 — आठ
    note: هشت का अर्थ आठ है।
    example_gloss: आठ बजे मिलते हैं।
  fa.a1.unit03.lesson01.teach.nine:
    title: नौ
    gloss: 9 — नौ
    note: نه का अर्थ नौ है। यह 'नहीं' का सामान्य शब्द भी है — गिनती या संख्या में सुनने पर संदर्भ से पता चल जाता है कि कौन-सा अर्थ है।
    example_gloss: यहाँ नौ विद्यार्थी हैं।
  fa.a1.unit03.lesson01.teach.ten:
    title: दस
    gloss: 10 — दस
    note: ده का अर्थ दस है।
    example_gloss: मेरी दस उँगलियाँ हैं।
  fa.a1.unit03.lesson02.teach.eleven:
    title: ग्यारह
    gloss: 11 — ग्यारह
    note: یازده का अर्थ ग्यारह है।
    example_gloss: मेरी ग्यारह बजे कक्षा है।
  fa.a1.unit03.lesson02.teach.twelve:
    title: बारह
    gloss: 12 — बारह
    note: دوازده का अर्थ बारह है।
    example_gloss: एक साल में बारह महीने होते हैं।
  fa.a1.unit03.lesson02.teach.thirteen:
    title: तेरह
    gloss: 13 — तेरह
    note: سیزده का अर्थ तेरह है।
    example_gloss: वह तेरह साल का/की है।
  fa.a1.unit03.lesson02.teach.fourteen:
    title: चौदह
    gloss: 14 — चौदह
    note: چهارده का अर्थ चौदह है।
    example_gloss: मैं चौदह दिन बाद आऊँगा/आऊँगी।
  fa.a1.unit03.lesson02.teach.fifteen:
    title: पंद्रह
    gloss: 15 — पंद्रह
    note: پانزده का अर्थ पंद्रह है।
    example_gloss: उसके पास पंद्रह किताबें हैं।
  fa.a1.unit03.lesson02.teach.sixteen:
    title: सोलह
    gloss: 16 — सोलह
    note: شانزده का अर्थ सोलह है — यह شش (छह) + ده (दस) से अनुमानित नहीं होता, इसलिए इसे अलग शब्द के रूप में सीखना अच्छा है।
    example_gloss: वह सोलह साल का/की है।
  fa.a1.unit03.lesson02.teach.seventeen:
    title: सत्रह
    gloss: 17 — सत्रह
    note: هفده का अर्थ सत्रह है।
    example_gloss: सत्रह लोग आए।
  fa.a1.unit03.lesson02.teach.eighteen:
    title: अठारह
    gloss: 18 — अठारह
    note: هجده का अर्थ अठारह है।
    example_gloss: वह अठारह साल का/की है।
  fa.a1.unit03.lesson02.teach.nineteen:
    title: उन्नीस
    gloss: 19 — उन्नीस
    note: نوزده का अर्थ उन्नीस है।
    example_gloss: उन्नीस दिन बचे हैं।
  fa.a1.unit03.lesson02.teach.twenty:
    title: बीस
    gloss: 20 — बीस
    note: بیست का अर्थ बीस है।
    example_gloss: मेरे पास बीस किताबें हैं।
  fa.a1.unit03.lesson02.teach.thirty:
    title: तीस
    gloss: 30 — तीस
    note: سی का अर्थ तीस है।
    example_gloss: इस महीने में तीस दिन हैं।
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: चालीस से नब्बे तक
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود बाक़ी दहाइयाँ हैं।
    example_gloss:
    - वह चालीस साल का/की है।
    - पचास कुर्सियाँ हैं।
    - साठ मिनट एक घंटा होता है।
    - इस किताब में सत्तर पन्ने हैं।
    - उसके पास अस्सी किताबें हैं।
    - वह नब्बे साल का/की है।
  fa.a1.unit03.lesson02.teach.combining:
    title: दहाई और इकाई को जोड़ना
    gloss: पच्चीस
    note: بیست و پنج का शाब्दिक अर्थ 'बीस और पाँच' है — दहाई का शब्द, و, फिर इकाई का शब्द।
  fa.a1.unit03.lesson03.teach.shomare:
    title: नंबर (किसी चीज़ का)
    gloss: संख्या
    note: شماره का प्रयोग पहचान वाले नंबर, जैसे फ़ोन या मकान नंबर, के लिए होता है; यह عدد के 'संख्या' वाले सामान्य अर्थ से अलग है।
    example_gloss: यह मेरा फ़ोन नंबर है।
  fa.a1.unit03.lesson03.teach.telefon:
    title: टेलीफ़ोन
    gloss: टेलीफ़ोन / फ़ोन
    note: تلفن सामान्य रूप से फ़ोन के लिए इस्तेमाल होता है, इसमें मोबाइल फ़ोन भी शामिल हैं।
    example_gloss: मेरे पास फ़ोन नहीं है।
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: फ़ोन नंबर पूछना
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: शماره تلفنتون چنده؟ फ़ोन नंबर पूछने का सामान्य और शिष्ट तरीका है। नंबर को एक-एक अंक करके पढ़ना हमेशा समझ में आता है और शुरुआती लोगों के लिए सबसे सुरक्षित तरीका है; असल बोलचाल में अंकों को जोड़कर बोलना भी आम है, लेकिन इस पाठ में पहले सरल तरीके, यानी एक-एक अंक पढ़ने, का अभ्यास किया जाता है।
  fa.a1.unit03.lesson03.teach.chande:
    title: कितना / क्या है?
    gloss: यह क्या है? / यह कितने का है?
    note: چنده؟ چند است का संक्षिप्त रूप है और संदर्भ के अनुसार संख्या, मात्रा या कीमत पूछता है।
  fa.a1.unit03.lesson03.teach.read_number:
    title: नंबर को एक-एक अंक करके पढ़ें
    gloss: शून्य, नौ, एक, दो, तीन, चार, पाँच, छह, सात, आठ, आठ
    note: इस पाठ में संख्याओं को एक-एक अंक करके पढ़ने का अभ्यास किया जाता है। ईरान के असली मोबाइल नंबर में 11 अंक होते हैं और वह 0 से शुरू होता है, जैसे 0912 345 6788।
  fa.a1.unit03.lesson04.teach.sal:
    title: साल
    gloss: साल
    note: سال का इस्तेमाल कैलेंडर के साल और किसी की उम्र गिनने, दोनों के लिए होता है।
    example_gloss: मेरी उम्र बीस साल है।
  fa.a1.unit03.lesson04.teach.man_recap:
    title: मैं (दोहराव)
    gloss: मैं
    note: من की एक छोटी याद-दिहानी, क्योंकि यहाँ पूरे वाक्य में अपनी उम्र बताने के लिए इसकी ज़रूरत है।
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: किसी की उम्र पूछना (अनौपचारिक)
    gloss: तुम्हारी उम्र कितनी है?
    note: چند سالته؟ अनौपचारिक एकवचन रूप है; चند سالتونه؟ इसका शिष्ट रूप है।
  fa.a1.unit03.lesson04.teach.salame:
    title: अपनी उम्र बताना
    gloss: मैं 25 साल का/की हूँ।
    note: سالمه में سال के साथ सीधे अधिकारसूचक प्रत्यय ـم (मेरा) जुड़ता है और फिर बोलचाल का क्रियारूप ـه (है) आता है, यानी शाब्दिक अर्थ "मेरा-साल-है"।
  fa.a1.unit03.lesson04.teach.ta:
    title: गिनती का वर्गकारक
    gloss: (गिनती में लगने वाला शब्द, हिंदी में इसका सीधा समकक्ष नहीं है)
    note: 'تا ज़्यादातर चीज़ों को गिनते समय इस्तेमाल होने वाला सामान्य गणना-शब्द है: संख्या + تا + संज्ञा।'
  fa.a1.unit03.lesson04.teach.sib:
    title: सेब
    gloss: सेब
    note: سیب यानी सेब।
    example_gloss: मुझे सेब पसंद हैं।
  fa.a1.unit03.lesson04.teach.ketab:
    title: किताब
    gloss: किताब
    note: کتاب यानी किताब।
    example_gloss: यह एक अच्छी किताब है।
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: मात्रा बताकर माँगना
    gloss: मुझे दो सेब चाहिए।
    note: دو تا سیب می‌خوام में, تا के साथ हमेशा की तरह, गिनी जाने वाली संख्या संज्ञा से पहले आती है।
  fa.a1.unit03.lesson05.teach.gheymat:
    title: कीमत
    gloss: कीमत
    note: قیمت कीमत के लिए सामान्य शब्द है।
    example_gloss: इसकी कीमत क्या है?
  fa.a1.unit03.lesson05.teach.toman:
    title: तोमान
    gloss: तोमान (ईरान की मुद्रा, रोज़मर्रा में)
    note: ईरान की आधिकारिक मुद्रा रियाल है, लेकिन रोज़ की बोलचाल में कीमतें लगभग हमेशा तोमान में बताई जाती हैं (1 तोमान = 10 रियाल)।
    example_gloss: यह दस हज़ार तोमान का है।
  fa.a1.unit03.lesson05.teach.hezar:
    title: हज़ार
    gloss: हज़ार
    note: هزار यानी हज़ार; कीमतें आमतौर पर हज़ार तोमान की इकाई में बोली जाती हैं।
    example_gloss: मेरे पास एक हज़ार तोमान हैं।
  fa.a1.unit03.lesson05.teach.ask_price:
    title: कीमत पूछें
    gloss: यह कितने का है?
    note: این چنده؟ सामने रखी किसी चीज़ की कीमत पूछने का सामान्य तरीका है।
  fa.a1.unit03.lesson05.teach.price_answer:
    title: कीमत बताना
    gloss: यह 30,000 तोमान का है।
    note: 'تومنه تومن است का संक्षिप्त रूप है; पूरा ढाँचा है: संख्या + هزار + تومنه।'
  fa.a1.unit03.lesson06.teach.practice_together:
    title: सारा साथ अभ्यास करने का सुझाव देती है
    gloss: सारा कहती है कि वह चाहती है कि वे साथ मिलकर फ़ारसी का अभ्यास करें और मीना का फ़ोन नंबर पूछती है।
    note: باهم का अर्थ है 'साथ में'; می‌خوام ... تمرین کنیم का अर्थ है 'मैं चाहती हूँ कि हम अभ्यास करें'। अकेला تمرین کنیم, प्रश्न के रूप में, 'क्या हम अभ्यास करें?' भी हो सकता है।
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: मीना अपना नंबर बताती है
    gloss: मीना राज़ी हो जाती है और अपना 11 अंकों का नंबर एक-एक अंक करके पढ़ती है।
    note: شماره‌ام شماره من का संक्षिप्त रूप है; هشته هشت است का संक्षिप्त रूप है, जो गिनती को समाप्त करता है।
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: सारा जाँचती है कि उसने नंबर सही लिखा है
    gloss: सारा मीना से रुकने को कहती है ताकि वह नंबर लिख सके, फिर पुष्टि के लिए उसे दोहराकर पढ़ती है।
    note: درسته؟ ('क्या यह सही है?') अभी सुने हुए नंबर या बात की पुष्टि करने का आम तरीका है।
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: मीना पुष्टि करती है और बदले में पूछती है
    gloss: मीना पुष्टि करती है कि नंबर सही है और सारा का नंबर पूछती है।
    note: آره अनौपचारिक 'हाँ' है, بله से ज़्यादा बोलचाल वाला।
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: सारा अपना नंबर बताती है
    gloss: सारा अपना 11 अंकों का नंबर एक-एक अंक करके पढ़ती है।
    note: یکه یک است का संक्षिप्त रूप है और गिनती को उसी तरह समाप्त करता है जैसे هشته ने मीना के नंबर को समाप्त किया था।
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: मीना फ़ोन करने के लिए राज़ी होती है
    gloss: मीना कहती है कि वह कल सारा को फ़ोन करेगी।
