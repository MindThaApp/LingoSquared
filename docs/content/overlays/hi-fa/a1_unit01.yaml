    correct_option: سلام
    distractors:
    - سام
    - لام
    - ماس
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام शब्द salâm का पूरा लिखित रूप है।
  fa.a1.unit01.lesson01.exercise02.recognize_seen:
    instruction: कौन-सा अक्षर «स» की ध्वनि देता है?
    correct_option: س
    distractors:
    - ل
    - ا
    - م
    accepted_answers:
    - value: س
      status: correct
    feedback: س «स» की ध्वनि दर्शाता है।
  fa.a1.unit01.lesson01.exercise03.recognize_lam:
    instruction: कौन-सा अक्षर «ल» की ध्वनि देता है?
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: ل «ल» की ध्वनि दर्शाता है।
  fa.a1.unit01.lesson01.exercise04.build_salam:
    instruction: अक्षरों को क्रम में लगाकर سلام बनाएँ।
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: सही क्रम में लगे अक्षरों से سلام बनता है।
  fa.a1.unit01.lesson01.exercise05.select_missing_lam:
    instruction: छूटा हुआ फ़ारसी अक्षर चुनिए।
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: छूटा हुआ अक्षर ل है।
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: हर फ़ारसी अक्षर को उसकी लगभग समान लैटिन ध्वनि से मिलाइए।
