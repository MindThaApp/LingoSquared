teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: फ़ारसी दाएँ से बाएँ लिखी जाती है
    gloss: फ़ारसी दाएँ से बाएँ लिखी जाती है।
    note: फ़ारसी को दाएँ किनारे से बाएँ की ओर पढ़ें।
  fa.a1.unit01.lesson01.teach.seen:
    title: अक्षर س
    gloss: स
    note: س सामान्यतः «स» की ध्वनि दर्शाता है।
  fa.a1.unit01.lesson01.teach.lam:
    title: अक्षर ل
    gloss: ल
    note: ل «ल» की ध्वनि दर्शाता है और आस-पास के अक्षरों से जुड़ता है।
  fa.a1.unit01.lesson01.teach.alef:
    title: अक्षर ا
    gloss: ā / a
    note: ا अक्सर दीर्घ «आ» (ā) को दर्शाता है और अगले अक्षर से नहीं जुड़ता।
  fa.a1.unit01.lesson01.teach.mim:
    title: अक्षर م
    gloss: m
    note: م «म» की ध्वनि दर्शाता है और जुड़ने पर अपना रूप बदलता है।
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: سلام बनाएँ
    gloss: नमस्ते
    note: سلام को salâm पढ़ा जाता है। फ़ारसी लेखन में छोटे स्वर आम तौर पर नहीं लिखे जाते।
    example_gloss: नमस्ते! मैं नीमा हूँ।
  fa.a1.unit01.lesson02.teach.salam:
    title: नमस्ते
    gloss: नमस्ते
    note: سلام औपचारिक और अनौपचारिक, दोनों स्थितियों में उपयुक्त है।
    example_gloss: नमस्ते, आप कैसे हैं?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: सुप्रभात
    gloss: सुप्रभात
    note: صبح بخیر सुबह का सामान्य शिष्ट अभिवादन है।
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: शुभ दोपहर या शुभ संध्या
    gloss: शुभ अपराह्न / शुभ संध्या
    note: عصر بخیر देर दोपहर से शाम तक कहा जाता है।
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: अलविदा
    gloss: अलविदा
    note: خداحافظ को khodâhâfez पढ़ा जाता है और यह विदा का सामान्य, मानक रूप है।
    example_gloss: अलविदा, बाद में मिलते हैं!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: धन्यवाद
    gloss: धन्यवाद
    note: ممنون आम और स्वाभाविक है; متشکرم थोड़ा अधिक औपचारिक है।
    example_gloss: बहुत-बहुत धन्यवाद।
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: आपका स्वागत है
    gloss: आपका स्वागत है
    note: خواهش می‌کنم धन्यवाद के उत्तर में कहा जाने वाला प्रचलित वाक्य है।
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: आप कैसे हैं? शिष्ट बोलचाल का रूप
    gloss: आप कैसे हैं?
    note: حالتون چطوره؟ ईरानी फ़ारसी की तटस्थ-शिष्ट बोलचाल का रूप है। حال شما چطور است؟ इसका अधिक औपचारिक या लिखित रूप है।
  fa.a1.unit01.lesson02.teach.khoobam:
    title: मैं ठीक हूँ
    gloss: मैं ठीक हूँ
    note: خوبم में خوب के साथ उत्तम पुरुष का प्रत्यय ـم जुड़ा है।
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: शुभ दिन
    gloss: शुभ दिन
    note: روز بخیر शिष्ट है, पर आम बोलचाल में سلام से कम प्रयोग होता है।
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: शुभ रात्रि
    gloss: शुभ रात्रि
    note: شب بخیر आम तौर पर विदा या सोते समय की शुभकामना है, मिलने पर का अभिवादन नहीं।
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: स्वागत है
    gloss: स्वागत है
    note: خوش آمدید एक या अधिक मेहमानों के लिए प्रयुक्त शिष्ट रूप है।
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: फिर मिलने की आशा
    gloss: फिर मिलने की आशा के साथ / जब तक फिर न मिलें
    note: به امید دیدار एक परिष्कृत, तटस्थ-शिष्ट विदाई है।
  fa.a1.unit01.lesson03.teach.fealan:
    title: अभी के लिए अलविदा
    gloss: अभी चलता हूँ, फिर मिलेंगे
    note: فعلاً बोलचाल का रूप है और خداحافظ से कम औपचारिक है।
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: आपका दिन शुभ हो
    gloss: आपका दिन शुभ हो
    note: इस स्थिर विदाई-वाक्य में باشید शिष्ट रूप को दर्शाता है।
  fa.a1.unit01.lesson04.teach.formal_question:
    title: तटस्थ-शिष्ट बोलचाल का रूप
    gloss: आप कैसे हैं?
    note: किसी अपरिचित वयस्क से या सामान्य शिष्ट बातचीत में حالتون چطوره؟ का प्रयोग करें। स्पष्ट रूप से औपचारिक या लिखित रूप حال شما چطور است؟ है।
  fa.a1.unit01.lesson04.teach.informal_question:
    title: अनौपचारिक
    gloss: आप कैसे हैं?
    note: چطوری؟ बोलचाल का रूप है और रिश्ता अनुमति दे तो दोस्तों, परिवार और हमउम्र लोगों के साथ उपयुक्त है।
  fa.a1.unit01.lesson04.teach.to:
    title: अनौपचारिक "तुम"
    gloss: तू / तुम
    note: تو एकवचन और अनौपचारिक है; किसी अपरिचित वयस्क के लिए इसे सामान्य रूप में न अपनाएँ।
  fa.a1.unit01.lesson04.teach.very_well:
    title: बहुत अच्छा
    gloss: मैं बहुत ठीक हूँ
    note: خیلی خوبم के भाव को और बढ़ा देता है।
  fa.a1.unit01.lesson04.teach.not_bad:
    title: बुरा नहीं
    gloss: बुरा नहीं हूँ, धन्यवाद
    note: بد نیستم शिकायत नहीं, बल्कि एक स्वाभाविक, मध्यम उत्तर है।
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: और आप? शिष्ट रूप
    gloss: और आप?
    note: वही प्रश्न शिष्टता से लौटाने के लिए شما چطور؟ का प्रयोग करें।
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: और तुम? अनौपचारिक
    gloss: और आप?
    note: تو چطور؟ अनौपचारिक रिश्ते के अनुरूप है।
  fa.a1.unit01.lesson05.teach.chai:
    title: चाय
    gloss: चाय
    note: '*چای* पेय है। आप इसे *چای بفرمایید* (चाय लीजिए) जैसे प्रस्ताव में सुनेंगे।'
    example_gloss: लीजिए, क्या आप चाय लेंगे?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: कृपया, आइए
    gloss: कृपया / आइए / लीजिए
    note: '*بفرمایید* का अर्थ स्थिति के अनुसार बदलता है: यह «लीजिए» (चाय देते समय), «कृपया अंदर आइए» (दरवाज़े पर) या «पहले आप» हो सकता है।'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: आपकी मेहरबानी है
    gloss: आप बहुत दयालु हैं
    note: لطف دارید तारीफ़ का शिष्टता से उत्तर देता है।
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: कृपया तकलीफ़ न करें
    gloss: कृपया कष्ट न करें
    note: زحمت نکشید किसी ठोस प्रस्ताव पर सच्चा इनकार भी हो सकता है या शुरुआती शिष्ट उत्तर भी।
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: आपकी कृपा के लिए धन्यवाद
    gloss: आपकी कृपा के लिए धन्यवाद
    note: यह केवल ممنون से अधिक आत्मीय और स्पष्ट है।
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: तआरोफ़
    gloss: संदर्भ के अनुसार बदलने वाली ईरानी शिष्टाचार की रीतियाँ
    note: तआरोफ़ का अर्थ है प्रस्ताव रखने, मना करने, धन्यवाद देने और सम्मान जताने की संदर्भ-आधारित रीतियाँ। इनका चलन रिश्ते, पीढ़ी, क्षेत्र और स्थिति के अनुसार बदलता है; इनकार या दोहराव की कोई तय संख्या यह तय नहीं करती कि प्रस्ताव सच्चा है या नहीं।
  fa.a1.unit01.lesson06.teach.line01:
    title: स्वागत है
    gloss: अली नरगिस का स्वागत करता है।
    note: बातचीत परिचय से पहले अभिवादन से शुरू होती है।
  fa.a1.unit01.lesson06.teach.line02:
    title: स्वागत का उत्तर
    gloss: नरगिस उसे नमस्ते कहती है और धन्यवाद देती है।
    note: स्वागत के उत्तर में ممنون (धन्यवाद) कहना स्वाभाविक है।
  fa.a1.unit01.lesson06.teach.line03:
    title: नामों का आदान-प्रदान
    gloss: अली बताता है कि वह कौन है।
    note: '*من علی هستم* का अर्थ है «मैं अली हूँ»। *هستم* (हूँ) वाक्य के अंत में आता है।'
  fa.a1.unit01.lesson06.teach.line04:
    title: नामों का आदान-प्रदान, उत्तर
    gloss: नरगिस बताती है कि वह कौन है।
    note: वही *من ... هستم* ढाँचा, जो अली ने अभी प्रयोग किया।
  fa.a1.unit01.lesson06.teach.line05:
    title: आपसे मिलकर ख़ुशी हुई
    gloss: अली कहता है कि उसे उससे मिलकर खुशी हुई।
    note: '*خوشوقتم* का अर्थ है «मुझे खुशी है»। *از آشنایی با شما* के साथ यह किसी से मिलने पर कहा जाने वाला मानक शिष्ट वाक्य है।'
  fa.a1.unit01.lesson06.teach.line06:
    title: मिलने की खुशी का उत्तर
    gloss: नरगिस भी यही भाव लौटाती है।
    note: इस उत्तर में همین‌طور का अर्थ है «वैसे ही» या «मुझे भी»।
  fa.a1.unit01.lesson06.teach.line07:
    title: किसी का हाल पूछें
    gloss: अली शिष्टता से उसका हाल पूछता है।
    note: यह पहली शिष्ट मुलाक़ात है, इसलिए अली तटस्थ-शिष्ट बोलचाल का ـتون रूप प्रयोग करता है।
  fa.a1.unit01.lesson06.teach.line08:
    title: हाल पूछने का उत्तर
    gloss: नरगिस उत्तर देती है और वही प्रश्न लौटाती है।
    note: شما چطور؟ उसी प्रश्न को वापस पूछने का आम छोटा तरीक़ा है।
  fa.a1.unit01.lesson06.teach.line09:
    title: निमंत्रण
    gloss: अली कहता है कि वह भी ठीक है और नरगिस को अंदर बुलाता है।
    note: '*بفرمایید داخل* का अर्थ है «कृपया अंदर आइए»। *داخل* (अंदर) बताता है कि क्या प्रस्तावित है।'
  fa.a1.unit01.lesson06.teach.line10:
    title: शिष्ट इनकार
    gloss: नरगिस उसे धन्यवाद देती है, पर बताती है कि उसे जाना है।
    note: शिष्ट इनकार भी इनकार से पहले धन्यवाद से शुरू होता है। *ولی باید برم* का अर्थ है «पर मुझे जाना होगा»।
  fa.a1.unit01.lesson06.teach.line11:
    title: बातचीत समाप्त करना
    gloss: अली उसके उत्तर को स्वीकार करता है और फिर मिलने की आशा जताता है।
    note: ठुकराया गया निमंत्रण अब स्वाभाविक रूप से विदाई की ओर ले जाता है।
  fa.a1.unit01.lesson06.teach.line12:
    title: बातचीत समाप्त करना, उत्तर
    gloss: नरगिस अलविदा कहती है।
    note: '*خداحافظ* सामान्य, मानक अलविदा है।'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
