teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: अक्षर ن और ت
    gloss: न (n) और त (t)
    note: ن का उच्चारण न (n) है। ت का उच्चारण त (t) है; दोनों दोनों ओर से जुड़ते हैं।
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: अक्षर ش और چ
    gloss: श (sh) और च (ch)
    note: ش का उच्चारण श (sh) और چ का उच्चारण च (ch) है।
  fa.a1.unit02.lesson01.teach.ye_he:
    title: अक्षर ی और ه
    gloss: य / दीर्घ ई और ह
    note: ی का उच्चारण य या दीर्घ ई (ī) जैसा होता है। ه ह (h) है और जुड़ने पर इसका रूप बदल जाता है।
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: अक्षर ک और گ
    gloss: क (k) और ग (g)
    note: ک का उच्चारण क (k) है; टाइप करते समय फ़ारसी ک का प्रयोग कीजिए, मिलते-जुलते अरबी अक्षर का नहीं। گ में ک के ऊपर एक अतिरिक्त रेखा होती है और यह ग (g) है।
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: अक्षर ج और د
    gloss: ज (j) और द (d)
    note: ج का उच्चारण ज (j) है। د का उच्चारण द (d) है और यह बाईं ओर आगे नहीं जुड़ता।
  fa.a1.unit02.lesson01.teach.re_fe:
    title: अक्षर ر और ف
    gloss: र (r) और फ़ (f)
    note: ر का उच्चारण र (r) है और यह आगे नहीं जुड़ता; ف का उच्चारण फ़ (f) है।
  fa.a1.unit02.lesson01.teach.vav_be:
    title: अक्षर و और ب
    gloss: व / ओ / ऊ और ब (b)
    note: و व (v) या स्वर की ध्वनि दे सकता है और आगे नहीं जुड़ता। ب का उच्चारण ब (b) है।
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: अक्षर خ और ز
    gloss: ख़ (kh) और ज़ (z)
    note: خ वह ध्वनि है जिसे आम तौर पर kh लिखा जाता है, यानी ख़; ز का उच्चारण ज़ (z) है।
  fa.a1.unit02.lesson02.teach.esm:
    title: नाम
    gloss: नाम
    note: सामान्य ईरानी फ़ारसी में اسم को «एस्म» (esm) पढ़ा जाता है।
    example_gloss: मेरा नाम सारा है।
  fa.a1.unit02.lesson02.teach.man:
    title: मैं
    gloss: मैं
    note: من उत्तम पुरुष एकवचन सर्वनाम है, यानी «मैं»।
  fa.a1.unit02.lesson02.teach.sara:
    title: सारा
    gloss: सारा
    note: سارا ईरान में प्रचलित एक नाम है।
    example_gloss: सारा मेरी दोस्त है।
  fa.a1.unit02.lesson02.teach.formal_name:
    title: औपचारिक या लिखित परिचय
    gloss: मेरा नाम सारा है।
    note: '*اسم من سارا است* सही है, पर औपचारिक है; यह ज़्यादातर लिखित रूप में दिखेगा।'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: बोलचाल का स्वाभाविक परिचय
    gloss: मेरा नाम सारा है।
    note: اسمم, اسم من का संक्षिप्त रूप है, जबकि ساراست में سارا और است जुड़े हुए हैं।
  fa.a1.unit02.lesson02.teach.polite_question:
    title: शिष्टता से नाम पूछना
    gloss: तुम्हारा नाम क्या है?
    note: اسم شما چیه؟ ईरानी फ़ारसी की सामान्य, तटस्थ-शिष्ट बोलचाल का वाक्य है।
  fa.a1.unit02.lesson02.teach.informal_question:
    title: अनौपचारिक रूप से नाम पूछना
    gloss: तुम्हारा नाम क्या है?
    note: اسمت چیه؟ एकवचन और अनौपचारिक है; इसे तभी बोलिए जब आपका रिश्ता इसकी अनुमति दे।
  fa.a1.unit02.lesson03.teach.man:
    title: मैं
    gloss: मैं
    note: من में कोई व्याकरणिक लिंग नहीं होता।
  fa.a1.unit02.lesson03.teach.to:
    title: तुम, अनौपचारिक एकवचन
    gloss: तुम
    note: تو अनौपचारिक एकवचन है; शिष्ट संबोधन में आम तौर पर شما का प्रयोग होता है।
  fa.a1.unit02.lesson03.teach.oo:
    title: वह (पुरुष या स्त्री)
    gloss: वह
    note: او लिंग-निरपेक्ष है और पुरुष या स्त्री, दोनों के लिए प्रयुक्त हो सकता है।
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: मैं हूँ
    gloss: मैं हूँ
    note: هستم، بودن का उत्तम पुरुष एकवचन का पूर्ण रूप है।
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: तुम हो
    gloss: आप हैं
    note: هستی अनौपचारिक एकवचन تو के साथ आता है।
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: वह है
    gloss: वह है; वह मौजूद है
    note: هست अन्य पुरुष एकवचन का पूर्ण रूप है और अक्सर अस्तित्व या ज़ोर का भाव देता है।
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: औपचारिक पहचान-वाचक वाक्य
    gloss: वह ईरानी है।
    note: सामान्य औपचारिक लिखित पहचान-वाक्य में است तृतीय पुरुष की सामान्य सहायक क्रिया (है) है।
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: बोलचाल में पहचान बताने वाला विधेय
    gloss: वह ईरानी है।
    note: ایرانیه, ایرانی است का बोलचाल में प्रचलित संक्षिप्त रूप है।
  fa.a1.unit02.lesson04.teach.iran:
    title: ईरान
    gloss: ईरान
    note: ایران एक देश का नाम है।
    example_gloss: मैं ईरान से हूँ।
  fa.a1.unit02.lesson04.teach.iranian:
    title: ईरानी
    gloss: ईरानी
    note: ایرانی राष्ट्रीयता या मूल बता सकता है।
    example_gloss: मैं ईरानी हूँ।
  fa.a1.unit02.lesson04.teach.england:
    title: इंग्लैंड
    gloss: इंग्लैंड
    note: '*انگلیس* का सामान्य अर्थ इंग्लैंड है; रोज़मर्रा की बातचीत में ईरानी लोग अक्सर इसे पूरे यूके के लिए भी इस्तेमाल करते हैं।'
    example_gloss: मैं इंग्लैंड से हूँ।
  fa.a1.unit02.lesson04.teach.english:
    title: अंग्रेज़ी
    gloss: अंग्रेज़ / इंग्लैंड का
    note: انگلیسی राष्ट्रीयता, भाषा या इंग्लैंड से जुड़ी किसी चीज़ को बता सकता है; अर्थ संदर्भ से तय होता है।
    example_gloss: मैं अंग्रेज़ हूँ।
  fa.a1.unit02.lesson04.teach.france:
    title: फ़्रांस
    gloss: फ़्रांस
    note: فرانسه देश का नाम फ़्रांस है।
    example_gloss: मैं फ़्रांस से हूँ।
  fa.a1.unit02.lesson04.teach.french:
    title: फ़्रांसीसी
    gloss: फ़्रांसीसी
    note: فرانسوی राष्ट्रीयता या फ़्रांस से जुड़ी किसी चीज़ को बता सकता है।
    example_gloss: मैं फ़्रांसीसी हूँ।
  fa.a1.unit02.lesson04.teach.country:
    title: देश
    gloss: देश
    note: کشور देश के लिए सामान्य शब्द है।
    example_gloss: ईरान एक देश है।
  fa.a1.unit02.lesson04.teach.nationality:
    title: राष्ट्रीयता
    gloss: राष्ट्रीयता
    note: ملیت राष्ट्रीयता के लिए औपचारिक संज्ञा है।
    example_gloss: आपकी राष्ट्रीयता क्या है?
  fa.a1.unit02.lesson05.teach.ahl:
    title: का / मूल रूप से कहीं का
    gloss: का / मूल रूप से कहीं का
    note: اهل व्यक्ति को उसके मूल स्थान से जोड़ता है; इसका अर्थ केवल यह नहीं कि वह अभी वहाँ रहता है।
    example_gloss: वह इंग्लैंड का है।
  fa.a1.unit02.lesson05.teach.koja:
    title: कहाँ
    gloss: कहाँ
    note: کجا जगह के बारे में पूछता है।
    example_gloss: आप कहाँ के हैं?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: औपचारिक मानक प्रश्न
    gloss: आप कहाँ से हैं?
    note: اهل کجا هستید؟ विनम्र मानक फ़ारसी है और औपचारिक बोलचाल या सावधानी से किए गए लेखन-पठन में उपयुक्त है।
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: सामान्य विनम्र बोलचाल का प्रश्न
    gloss: आप कहाँ से हैं?
    note: اهل کجا هستین؟ ईरानी फ़ारसी में सामान्य विनम्र बोलचाल का रूप है।
  fa.a1.unit02.lesson05.teach.informal_question:
    title: अनौपचारिक प्रश्न
    gloss: आप कहाँ से हैं?
    note: اهل کجایی؟ अनौपचारिक एकवचन रूप है (हिंदी के "तुम" जैसा)।
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: अपना मूल स्थान बताना
    gloss: मैं ईरान का हूँ।
    note: من اهل ایران هستم मूल स्थान बताता है, वर्तमान निवास नहीं।
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: राष्ट्रीयता का संक्षिप्त उत्तर
    gloss: मैं ईरानी हूँ।
    note: '*ایرانی‌ام* में *ایرانی* के साथ अंत *ـام* (मैं हूँ) जुड़ा है, और अंत से पहले एक छोटा अर्ध-स्थान लिखा जाता है।'
  fa.a1.unit02.lesson06.teach.arrival:
    title: जगह की पुष्टि करना
    gloss: सारा पूछती है कि क्या यह फ़ारसी की कक्षा है।
    note: ببخشید किसी व्यावहारिक प्रश्न से पहले विनम्रता से ध्यान खींचता है।
  fa.a1.unit02.lesson06.teach.yes:
    title: हाँ
    gloss: हाँ
    note: بله "हाँ" के लिए सामान्य विनम्र शब्द है।
    example_gloss: हाँ, बिल्कुल।
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: मीना अपना परिचय देती है
    gloss: मीना जगह की पुष्टि करती है, अपना परिचय देती है और सारा का नाम पूछती है।
    note: बोलचाल का विनम्र प्रश्न कक्षा में मिल रहे दो वयस्कों के लिए उपयुक्त है।
  fa.a1.unit02.lesson06.teach.sara_name:
    title: सारा अपना नाम बताती है
    gloss: मेरा नाम सारा है।
    note: सारा पहले सिखाया गया संक्षिप्त बोलचाल का रूप इस्तेमाल करती है।
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: मीना मूल स्थान पूछती है
    gloss: आप कहाँ से हैं?
    note: هستین बातचीत को विनम्र रखता है, फिर भी सहज।
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: मूल स्थान का आदान-प्रदान
    gloss: सारा कहती है कि वह इंग्लैंड से है और पूछती है कि क्या मीना ईरान से है।
    note: दोनों वक्ता विनम्र रूप बनाए रखते हैं क्योंकि वे अभी मिले हैं।
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: मूल स्थान की बातचीत, जवाब
    gloss: मीना पुष्टि करती है कि वह ईरानी है।
    note: '*ایرانی‌ام*, *ایرانی هستم* (मैं ईरानी हूँ) का संक्षिप्त रूप है।'
  fa.a1.unit02.lesson06.teach.pleased:
    title: परिचय का उत्तर देना
    gloss: सारा कहती है कि उसे मीना से मिलकर खुशी हुई।
    note: از آشنایی با شما خوشوقتم उनकी बातचीत का स्वाभाविक समापन है।
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: अभिवादन लौटाना और कक्षा में आना
    gloss: मीना कहती है कि उसे भी खुशी हुई और सारा को अंदर बुलाती है।
    note: من هم همین‌طور सारा के विनम्र अभिवादन का उत्तर देता है, फिर بفرمایید داخل कक्षा वाले प्रसंग को आगे बढ़ाता है।
