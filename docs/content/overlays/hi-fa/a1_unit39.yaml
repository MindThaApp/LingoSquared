teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: 'दोहराव: मदद'
    gloss: मदद
    note: '*کمک* (''मदद'') पहले सिखाया जा चुका है।'
  fa.a1.unit39.lesson01.teach.lazame:
    title: ज़रूरी
    gloss: ज़रूरत है
    note: '*لازمه* एक ही शब्द है जिसका अर्थ है ''ज़रूरत है''; यह *قشنگه* (''सुंदर है'') और *گرمه* (''गरम है'') की तरह ही बना है।'
    example_gloss: मदद की ज़रूरत है!
  fa.a1.unit39.lesson01.teach.polis:
    title: पुलिस
    gloss: पुलिस
    note: '*پلیس* का अर्थ है ''पुलिस''। यह एक उधार लिया हुआ शब्द है, जो रोज़मर्रा की बोलचाल में इस्तेमाल होता है।'
    example_gloss: पुलिस की ज़रूरत है!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: एम्बुलेंस
    gloss: एम्बुलेंस
    note: '*آمبولانس* का अर्थ है ''एम्बुलेंस''।'
    example_gloss: एम्बुलेंस की ज़रूरत है!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: दमकल विभाग
    gloss: दमकल विभाग
    note: '*آتش‌نشانی* का अर्थ है ''दमकल विभाग'' या ''फ़ायर ब्रिगेड''।'
    example_gloss: दमकल विभाग की ज़रूरत है!
  fa.a1.unit39.lesson02.teach.atash:
    title: आग
    gloss: आग
    note: '*آتش* का अर्थ है ''आग''। यह *آتش‌نشانی* (''दमकल विभाग'') का मूल शब्द है।'
    example_gloss: आग! दमकल विभाग की ज़रूरत है!
  fa.a1.unit39.lesson02.teach.khatar:
    title: ख़तरा
    gloss: ख़तरा
    note: '*خطر* का अर्थ है ''ख़तरा''।'
    example_gloss: ख़तरा! पुलिस की ज़रूरत है!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'दोहराव: औपचारिक और अनौपचारिक आदेश'
    gloss: कीजिए! (औपचारिक) / कर! (अनौपचारिक)
    note: '*کنید* औपचारिक या बहुवचन आदेश का रूप है। अनौपचारिक *کن*, जो आपने दोस्तों के लिए *استراحت کن* (''आराम कर/करो'') में इस्तेमाल किया था, उस एक व्यक्ति के लिए है जिसे आप अच्छी तरह जानते हैं।'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: मदद!
    gloss: मदद कीजिए!
    note: '*کمک کنید!* मदद के लिए पुकारने का शिष्ट तरीका है, जो अजनबियों और आपातकालीन सेवाओं के कर्मचारियों के लिए ठीक रहता है।'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: दुर्घटना
    gloss: दुर्घटना
    note: '*تصادف* का अर्थ है ''दुर्घटना''।'
    example_gloss: दुर्घटना! मदद कीजिए!
  fa.a1.unit39.lesson03.teach.orjans:
    title: आपातकाल
    gloss: आपातकाल
    note: '*اورژانس* का अर्थ है ''आपातकाल''। यही शब्द अस्पताल के आपातकालीन विभाग के लिए भी इस्तेमाल होता है।'
    example_gloss: आपातकाल है! मदद कीजिए!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'दोहराव: हेलो / ठीक है / धन्यवाद'
    gloss: हेलो (फ़ोन पर) / ठीक है / धन्यवाद
    note: '*الو*, *باشه* और *ممنون* पहले सिखाए जा चुके हैं।'
  fa.a1.unit39.lesson04.teach.review_miad:
    title: आ रहा है
    gloss: आ रहा है
    note: '*میاد* (''वह आ रहा है/रही है'') में वही पुरुष-प्रत्यय का ढर्रा है जो *میام* (''मैं आ रहा हूँ'') में है, जो आप पहले सीख चुके हैं।'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: जल्दी आइए!
    gloss: जल्दी आइए!
    note: '*زود* का अर्थ है ''जल्दी''; *بیایید* ''आइए!'' का शिष्ट आदेश-रूप है।'
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: फ़ोन कीजिए!
    gloss: फ़ोन कीजिए!
    note: '*زنگ بزنید!* क्रिया *زنگ زدن* (''फ़ोन करना'') का शिष्ट आदेश-रूप है, जो आप पहले सीख चुके हैं।'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'नीमा: हेलो! मदद कीजिए! पुलिस की ज़रूरत है!'
    gloss: हेलो! मदद कीजिए! पुलिस की ज़रूरत है!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'सारा: ठीक है। पुलिस आ रही है।'
    gloss: ठीक है। पुलिस आ रही है।
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'नीमा: धन्यवाद! जल्दी आइए!'
    gloss: धन्यवाद! जल्दी आइए!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'सारा: ठीक है!'
    gloss: ठीक है!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: इस सूचना के बारे में
    gloss: दुर्घटना / ख़तरा / आग
    note: सूचना में हर प्रकार के आपातकाल के बाद प्रश्नचिह्न है, मानो पूछ रहे हों 'दुर्घटना हो तो?'। जिस सेवा को बुलाना है, वह उसके तुरंत बाद आती है।
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'पठन: आपातकालीन सूचना'
    gloss: दुर्घटना? एम्बुलेंस की ज़रूरत है! ख़तरा? पुलिस की ज़रूरत है! आग? दमकल विभाग की ज़रूरत है! जल्दी फ़ोन कीजिए!
    note: एक छोटी सूचना, जो बताती है कि हर तरह के आपातकाल में किस सेवा को बुलाना है।
  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: पुलिस की ज़रूरत है! मदद कीजिए!
    gloss: पुलिस की ज़रूरत है! मदद कीजिए!
