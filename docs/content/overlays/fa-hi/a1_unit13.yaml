teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'مرور: چای، قهوه'
    gloss: چای، قهوه
    note: مرور سریع واژه‌های درس ۶ که برای صحبت دربارهٔ چیزهای دوست‌داشتنی و نداشتنی در این درس لازم است.
    example_gloss:
    - چای می‌خواهم.
    - قهوه می‌خواهم.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'مرور: به من'
    gloss: به من
    note: ضمیر مفعولیِ غیرمستقیمی که قبلاً یاد گرفتید و در درس‌های ۶، ۷ و ۱۱ مدام به کار رفت -- این درس یک گزارهٔ تازه برایش می‌آورد.
    example_gloss: چای می‌خواهم.
  hi.a1.unit13.lesson01.teach.pasand:
    title: علاقه / مورد پسند
    gloss: علاقه / مورد پسند
    note: اسمی به معنی «علاقه و پسند» (نه «محبوب») -- همراه نهادِ «به من/به تو» (mujhe/tumhein) و فعل ربطی hai/hain، عبارت «دوست دارم...» را می‌سازد.
    example_gloss: چای دوست دارم.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = دوست دارم
    gloss: '''Pasand hai'' یعنی «X برای من خوشایند است»، یعنی «X را دوست دارم». مثل ''mujhe...chahiye'' (درس ۶) با mujhe/tumhein شروع می‌شود، ولی بعد از ''chahiye'' هیچ ''hai'' نمی‌آید، در حالی که بعد از ''pasand'' همیشه ''hai'' یا ''hain'' می‌آید.'
    note: تفاوت ساختاری chahiye (خواستن/نیاز) و pasand hai (دوست داشتن) را صریح می‌گوید تا این دو ساختار با هم قاطی نشوند.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: موسیقی
    gloss: موسیقی
    note: اسمی تازه که برای تمرین ساختار pasand hai با نهاد مفرد و ناشمارا به کار می‌رود.
    example_gloss: من موسیقی دوست دارم.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'مرور: بله، نه'
    gloss: بله، نه
    note: مرور سریع دو واژهٔ ابتدایی که برای جواب دادن و منفی کردن سؤال‌های علاقه در این درس لازم است.
    example_gloss:
    - بله، موسیقی دوست دارم.
    - نه، قهوه دوست ندارم.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: قهوه دوست ندارم.
    gloss: من قهوه دوست ندارم.
    note: منفی کردن دقیقاً مثل جمله‌های hai که قبلاً یاد گرفتید است (مثلاً '«yoga class nahin hai»' در درس ۳) -- nahin درست قبل از hai می‌آید.
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: کتاب / کتاب‌ها
    gloss: کتاب / کتاب‌ها
    note: یک جفت اسم تازه، مفرد و جمع، تا نشان دهد 'hai'/'hain' بعد از pasand با تعداد چیزِ موردعلاقه هماهنگ می‌شود.
    example_gloss:
    - این کتاب را دوست دارم.
    - کتاب‌ها را دوست دارم.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai یا hain بعد از pasand
    gloss: '''Hai'' یا ''hain'' بعد از ''pasand'' با تعداد چیزِ موردعلاقه هماهنگ می‌شود -- دقیقاً مثل ''mere paas...hai/hain'' (درس ۲): chai/sangeet pasand hai (مفرد)، kitaaben pasand hain (جمع).'
    note: قاعدهٔ هماهنگی hai/hain با تعداد، که در درس ۲ یاد گرفتید، در موقعیتی تازه ادامه پیدا می‌کند؛ مفهوم دستوری جدیدی نیست.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'مرور: به تو (خودمانی)'
    gloss: به تو (خودمانی)
    note: اولین بار در درس ۶ با chahiye یاد گرفتید ('tumhein...chahiye?') -- این درس همان ضمیر را این بار با pasand hai به کار می‌برد.
    example_gloss: موسیقی دوست داری؟
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' در ابتدای جمله نشانهٔ سؤال بله/نه است (درس ۱)؛ ''tumhein'' همان قالب سؤالِ ''tumhein...chahiye?'' (درس ۶) را تکرار می‌کند -- اینجا ''pasand hai'' جای ''chahiye'' می‌نشیند.'
    note: تأیید می‌کند که این فقط کاربرد دوبارهٔ قالب سؤالی آشناست، نه نکتهٔ دستوری تازه.
  hi.a1.unit13.lesson02.teach.khel:
    title: ورزش / بازی
    gloss: ورزش / بازی
    note: اسمی تازه. در مثال‌ها با 'yah' (این) می‌آید تا مفرد بودنش روشن باشد، چون 'khel' خودش در مفرد و جمع تغییر نمی‌کند.
    example_gloss: این ورزش را دوست دارم.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'مرور: این'
    gloss: این
    note: اولین بار در درس ۷ آمد ('mujhe yah chahiye') -- اینجا دوباره می‌آید تا اشاره به 'khel' به‌صورت مفرد روشن باشد.
    example_gloss: این کتاب خوب است.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'مرور: یا'
    gloss: یا
    note: اولین بار در درس ۶/۷ برای سفارش غذا و خرید آمد -- اینجا دوباره می‌آید تا دربارهٔ علاقه‌ها سؤال انتخابی بپرسیم.
    example_gloss: چای یا قهوه؟
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: چای دوست دارید یا قهوه؟
    gloss: چای دوست داری یا قهوه؟
    note: قالب سؤالِ tumhein این درس را با ya (یا) که قبلاً یاد گرفتید ترکیب می‌کند تا از زبان‌آموز بخواهد انتخاب کند.
  hi.a1.unit13.lesson02.teach.zyada:
    title: بیشتر
    gloss: بیشتر
    note: واژه‌ای تازه که درست قبل از 'pasand hai' می‌نشیند تا ترجیح یکی از دو چیزِ نام‌برده‌شده را بیان کند.
    example_gloss: چای را بیشتر دوست دارم.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = ترجیح می‌دهم
    gloss: '''X zyada pasand hai'' یعنی ترجیح دادن یکی از دو چیز -- ''mujhe chai zyada pasand hai'' یعنی «چای را بیشتر دوست دارم» / «چای را ترجیح می‌دهم».'
    note: گسترش واژگانی است، نه دستور تازه -- 'zyada' فقط 'pasand hai' را که قبلاً یاد گرفتید توصیف می‌کند.
    target_text: '''X ज़्यादा पसंद है'' یعنی از بین دو چیز، یکی را ترجیح دادن (prefer) -- ''मुझे चाय ज़्यादा पसंद है'' یعنی ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (چای را بیشتر دوست دارم / چای را ترجیح می‌دهم).'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'مرور: موسیقی، ورزش، کتاب‌ها'
    gloss: موسیقی، ورزش/بازی، کتاب‌ها
    note: مرور سریع اسم‌های کلیدی این درس که برای گفت‌وگو و نکتهٔ خواندن لازم است.
    example_gloss:
    - من موسیقی دوست دارم.
    - این ورزش را دوست ندارم.
    - کتاب‌ها را دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: ارجون دربارهٔ موسیقی می‌پرسد
    gloss: پریا، موسیقی دوست داری؟
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید خیلی دوستش دارد
    gloss: آره، موسیقی خیلی دوست دارم. تو چی؟
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: ارجون موافقت می‌کند و ورزش را اضافه می‌کند
    gloss: من هم! و ورزش هم دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: پریا کتاب را به این بازی ترجیح می‌دهد
    gloss: آه، خوبه! این بازی را دوست ندارم. کتاب دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: ارجون می‌پرسد چای یا قهوه
    gloss: باشه. چای دوست داری یا قهوه؟
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: پریا چای را ترجیح می‌دهد
    gloss: چای را بیشتر دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: ارجون موافقت می‌کند
    gloss: عالیه! من هم چای دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: حرف آخر پریا
    gloss: باشه! فردا دوباره همدیگه رو ببینیم؟
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: سه الگوی مرتبط
    gloss: 'سه الگوی این درس: بعد از ''chahiye'' (خواستن/نیاز داشتن، درس ۶) ''hai'' نمی‌آید؛ ''pasand hai/hain'' (همین درس) بسته به تعداد چیزی که دوست دارید عوض می‌شود؛ ''zyada pasand hai'' یعنی از بین دو چیز یکی را ترجیح دادن.'
    note: جمع‌بندی پایانی که دستور کل این درس را به هم وصل می‌کند.
    target_text: 'سه نکته در این درس: بعد از ''चाहिए'' (خواستن/نیاز، درس ۶) ''है'' نمی‌آید؛ ''पसंद है/हैं'' (این درس) با تعداد چیزِ موردعلاقه عوض می‌شود؛ ''ज़्यादा पसंद है'' یعنی از بین دو چیز یکی را ترجیح دادن (prefer).'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: یادداشت پریا
    gloss: ارجون، من موسیقی رو خیلی دوست دارم. کتاب هم دوست دارم. این بازی رو دوست ندارم. چای رو بیشتر دوست دارم. - پریا
    note: یادداشتی کوتاه که دقیقاً همان چیزهایی را که در گفت‌وگو آمد دوباره می‌گوید، بدون مطلب تازه.
    glosses:
      संगीत: موسیقی
      बहुत: خیلی
      पसंद: دوست‌داشتنی / مورد پسند
      किताबें: کتاب‌ها
      खेल: بازی
      नहीं: نه / نیست
      चाय: چای
      ज़्यादा: بیشتر / ترجیحاً
