teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'مرور: مکان‌ها'
    gloss: بانک، مدرسه، بیمارستان، پارک، ایستگاه، پستخانه
    note: مروری سریع بر کلمه‌های مکان از واحد قبل -- در این واحد زیاد از آن‌ها استفاده می‌شود.
    example_gloss:
    - بانک اینجاست.
    - پستخانه نزدیک بانک است.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'مرور: است، کجا، اینجا، آنجا، از، ِ (اضافه)، باشه'
    gloss: است، کجا، اینجا، آنجا، از، ِ (اضافه)، باشه
    note: مروری سریع بر کلمه‌های کوچک دستوری از واحدهای قبل که تمرین‌های این واحد دوباره از آن‌ها استفاده می‌کنند.
    example_gloss:
    - بانک کجاست؟
    - پارک آنجاست.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: مستقیم، چپ، راست
    gloss: مستقیم، چپ، راست
    note: سه کلمهٔ اصلی جهت در این واحد.
    example_gloss:
    - مستقیم بروید.
    - به چپ بپیچید.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: برو!، بپیچ!
    gloss: برو!، بپیچ! (امر صمیمی)
    note: امرهای با «تم» -- لحن طبیعی برای دو دوست که به هم آدرس می‌دهند.
    example_gloss:
    - مستقیم بروید.
    - به راست بپیچید.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: از اینجا مستقیم برو
    gloss: از اینجا مستقیم برو.
    note: کلمه‌های تازهٔ این درس را با 'yahaan se' (از اینجا) ترکیب می‌کند.
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: پیچیدن به چپ
    gloss: به چپ بپیچ.
    note: یک دستور مستقل که می‌توانید مستقیم به کار ببرید.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: پیچیدن به راست
    gloss: به راست بپیچ.
    note: دستور قرینهٔ 'baaen muro'.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: پایان امر -o
    gloss: '''Jaao'' و ''muro'' امرهای صمیمی (با «تم») هستند، مثل ''bataao'' و ''gino'' -- همه به ''-o'' ختم می‌شوند.'
    note: الگوی مشترک امر صمیمی را با دو کلمه‌ای نشان می‌دهد که قبلاً یاد گرفته‌اید (bataao در واحد ۷، gino در واحد ۲).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: چطور به بانک برسم؟
    gloss: چطور به بانک برسم؟
    note: سؤال اصلی برای پرسیدن آدرس، با شکل اول‌شخص «بروم؟».
  hi.a1.unit09.lesson02.teach.tak:
    title: تا / تا نزدیکی
    gloss: تا
    note: قبلاً در درس ۲ برای شمارش دیده‌اید ('«zero se das tak»')؛ اینجا در معنای مکانی‌اش، که به همان اندازه رایج است، دوباره به کار رفته.
    example_gloss: مستقیم برو تا بانک.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: مستقیم برو تا بانک
    gloss: مستقیم برو تا بانک.
    note: یک جملهٔ نمونه با 'tak' در معنای مکانی.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: اول، بعد
    gloss: اول، بعد
    note: یک جفت کلمه برای پشت‌سرهم گفتن دو مرحله از مسیر.
    example_gloss:
    - اول مستقیم برو.
    - بعد به چپ بپیچ.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: اول مستقیم، بعد چپ
    gloss: اول مستقیم برو، بعد به چپ بپیچ.
    note: '''pahle'' و ''phir'' را در یک دستور دو مرحله‌ای کنار هم می‌گذارد.'
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle و phir
    gloss: '''Pahle'' و ''phir'' دو مرحله را به هم وصل می‌کنند؛ کار اول با ''pahle'' می‌آید و کار دوم با ''phir''، مثل ''pahle seedhe jaao, phir baaen muro.'''
    note: یک نکتهٔ دستوری واقعی و کاربردی دربارهٔ پشت‌سرهم گفتن مرحله‌های مسیر.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: سر نبش
    gloss: سر نبش
    note: یک کلمهٔ مکانی تازه برای گفت‌وگوی پایانی این درس که با 'par' (در/روی) می‌آید.
    example_gloss:
    - بانک سر نبش است.
    - پارک پشت مدرسه است.
  hi.a1.unit09.lesson03.teach.bas:
    title: فقط / همین
    gloss: فقط / همین
    note: در هندی، این کلمه به معنی «اتوبوس» (وسیلهٔ نقلیه) هم رایج است، ولی آن معنی در این دوره آموزش داده نمی‌شود، پس اینجا ابهامی وجود ندارد.
    example_gloss: فقط یک کم دیگر برو.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: فهمیدم / متوجه شدم
    gloss: فهمیدم / متوجه شدم
    note: 'یک عبارت دوکلمه‌ای رایج: ''samajh'' (ریشهٔ ''samajhna''، فهمیدن) به‌علاوهٔ ''gaya'' (رفت) که نشان می‌دهد کار انجام شده است. این شکل مذکر است؛ پریا می‌گوید ''samajh gayi''.'
    example_gloss: فهمیدم. / متوجه شدم.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: باشه! خیلی ممنون!
    gloss: باشه! خیلی ممنون!
    note: '''accha''، ''bahut'' و ''shukriya'' را از درس‌های قبل دوباره به کار می‌برد.'
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: مشکلی نیست! باز همدیگر را می‌بینیم.
    gloss: مشکلی نیست! باز همدیگر را می‌بینیم.
    note: جملهٔ پایانی همیشگی این دوره که عیناً از درس ۸ تکرار شده است.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: آرجون دربارهٔ پست‌خانه می‌پرسد
    gloss: آرجون از پریا می‌پرسد چطور به پست‌خانه برود.
    note: الگوی سؤال ابتدای همین درس را از درس ۲ دوباره به کار می‌برد.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: پریا مسیر را شروع می‌کند
    gloss: 'پریا می‌گوید: از اینجا اول مستقیم برو.'
    note: '''yahaan se'' و ''pahle'' را از اول همین درس دوباره به کار می‌برد.'
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: آرجون می‌پرسد بعدش چه کار کند
    gloss: آرجون می‌گوید باشه و می‌پرسد بعدش چه کار کند.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: پریا ادامه می‌دهد
    gloss: 'پریا می‌گوید: بعد سر نبش بانک به چپ بپیچ.'
    note: '''nukkad'' (نبش خیابان) را در متن گفت‌وگو معرفی می‌کند.'
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: آرجون تأیید می‌کند و دوباره می‌پرسد
    gloss: آرجون «چپ» را تکرار می‌کند، می‌گوید باشه و می‌پرسد بعدش چه کار کند.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: پریا مسیر اول را تمام می‌کند
    gloss: 'پریا می‌گوید: فقط یک کم دیگر برو؛ پست‌خانه همان‌جاست، نزدیک بانک.'
    note: '''bas'' (فقط/همین) را معرفی می‌کند و با آنچه در درس ۸ آمد، یعنی نزدیک بودن پست‌خانه به بانک، سازگار است.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: آرجون می‌فهمد و دربارهٔ پارک می‌پرسد
    gloss: آرجون می‌گوید فهمیدم و می‌پرسد چطور به پارک برود.
    note: عبارت 'samajh gaya' را معرفی می‌کند.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: پریا مسیر دوم را می‌گوید
    gloss: 'پریا می‌گوید: پارک؟ اول مستقیم برو، بعد به راست بپیچ؛ پارک پشت مدرسه است.'
    note: با آنچه در درس ۸ آمد، یعنی اینکه پارک پشت مدرسه است، سازگار است.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: آرجون از پریا تشکر می‌کند
    gloss: آرجون می‌گوید فهمیدم و از پریا خیلی تشکر می‌کند.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: پریا خداحافظی می‌کند
    gloss: پریا می‌گوید مشکلی نیست، باز همدیگر را می‌بینیم.
    note: همان جملهٔ پایانی گفت‌وگوی درس ۸ که عیناً تکرار شده است.
