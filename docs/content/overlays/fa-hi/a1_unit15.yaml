teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'مرور: ایستگاه، برای من، هست'
    gloss: ایستگاه، برای من، هست
    note: مرور سریع اسم مکان و فعل ربطی که برای ساختن ساختار «باید» در این درس لازم است.
    example_gloss:
    - ایستگاه اینجاست.
    - من کار دارم.
  hi.a1.unit15.lesson01.teach.jaana:
    title: رفتن
    gloss: رفتن (مصدر)
    note: مصدر فعلی که قبلاً به شکل امر «تو» یعنی *jao* (درس ۹) یاد گرفته‌اید. در این درس خودِ مصدر معرفی می‌شود.
    example_gloss: من باید بروم.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + فعل + hai = باید
    gloss: '«Mujhe» را قبلاً با «chahiye» (درس ۶، با اسم) و با «hai» (درس ۱۱، مثل «mujhe kaam hai»، یعنی کار دارم) یاد گرفته‌اید. حالا با فعل هم می‌آید: «mujhe jana hai» یعنی «باید بروم». دقت کنید: با «jana»، «hai» همان‌طور می‌ماند و هیچ‌وقت «hain» نمی‌شود؛ با گوینده مطابقت نمی‌کند.'
    note: سومین کاربرد الگوی ضمیر + فعل ربطی که قبلاً آموخته شده است؛ هر دو کاربرد قبلی با شمارهٔ درس آمده‌اند و بعد جایگاه فعل تازه معرفی می‌شود.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: باید به ایستگاه بروم.
    gloss: باید به ایستگاه بروم.
    note: اولین جملهٔ کامل این درس برای ساختار «باید».
  hi.a1.unit15.lesson01.teach.tiket:
    title: بلیت
    gloss: بلیت
    note: اسمی تازه که در سراسر این درسِ سفر لازم است.
    example_gloss: بلیت من کجاست؟
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'مرور: می‌خواهم / لازم دارم'
    gloss: می‌خواهم / لازم دارم
    note: اولین بار در درس ۶ با نوشیدنی‌ها آمد و اینجا با بلیت دوباره به کار می‌رود.
    example_gloss: من چای می‌خواهم.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: من بلیت می‌خواهم.
    gloss: من بلیت می‌خواهم.
    note: الگوی آشنای *mujhe...chahiye* روی اسم تازهٔ همین درس.
  hi.a1.unit15.lesson01.teach.train:
    title: قطار
    gloss: قطار
    note: یک اسم تازه.
    example_gloss: قطار بزرگ است.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'مرور: دهلی، مالِ / از'
    gloss: دهلی، مالِ / از (نشانهٔ مالکیت)
    note: دهلی در درس ۵ آمد؛ نشانهٔ مالکیت *ka* هم در سراسر دوره به کار رفته است (مثلاً درس‌های ۵ تا ۱۴). اینجا برای گفتن مقصد بلیت دوباره می‌آید.
    example_gloss:
    - برادرم در دهلی زندگی می‌کند.
    - این کیف آرجون است.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: یک بلیت به مقصد دهلی می‌خواهم.
    gloss: یک بلیت به مقصد دهلی می‌خواهم.
    note: اسم این درس را با الگوی نشانهٔ مالکیت ترکیب می‌کند تا مقصد مشخصی را بگوید.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'مرور: کجا، برای تو'
    gloss: کجا، برای تو / به تو
    note: هر دو قبلاً یاد گرفته شده‌اند (درس ۸ و درس ۶)؛ اینجا برای پرسیدن اینکه کسی باید کجا برود به کار می‌روند.
    example_gloss:
    - بانک کجاست؟
    - چه می‌خواهید؟
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'مرور: شماره'
    gloss: شماره
    note: اولین بار در درس ۲ برای شمارهٔ تلفن آمد و اینجا برای شمارهٔ سکو به کار می‌رود.
    example_gloss: شمارهٔ تلفن شما چند است؟
  hi.a1.unit15.lesson02.teach.platform:
    title: سکو
    gloss: سکو
    note: اسمی تازه؛ واژهٔ رایج هندی برای سکوی ایستگاه قطار که وام‌واژه است و الگویش مثل *phone* در درس ۲ است.
    example_gloss: سکو بزرگ است.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: شمارهٔ سکو چند است؟
    gloss: شمارهٔ سکو چند است؟
    note: الگوی سؤالی آشنای *kya hai* (مثل شمارهٔ تلفن، قیمت، سن) برای موضوعی تازه.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: شمارهٔ سکو ۳ است.
    gloss: شمارهٔ سکو ۳ است.
    note: پاسخ جملهٔ کامل و طبیعی به سؤال بالا.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (مطابقت مؤنث)
    gloss: «Jaati hai» از قاعدهٔ -ta/-ti/-te + hai/hain در درس ۱۰ استفاده می‌کند، این بار با فعل تازهٔ «jana». «Train» (قطار) در هندی مؤنث است، برای همین «jaati hai» می‌شود، نه «jaata hai».
    note: گسترش مستقیم و صریح الگوی مطابقت حال عادتی که قبلاً آموخته شده، روی یک فعل تازه و یک اسم تازهٔ مؤنث.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'مرور: از'
    gloss: از
    note: اولین بار در درس ۹ برای آدرس دادن آمد و اینجا برای سکویی که قطار از آن حرکت می‌کند به کار می‌رود.
    example_gloss: از اینجا مستقیم بروید.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: قطار از سکوی شمارهٔ ۳ حرکت می‌کند.
    gloss: قطار از سکوی شمارهٔ ۳ حرکت می‌کند.
    note: شکل فعل حال عادتی این درس را با حرف اضافهٔ «از» که قبلاً یاد گرفته‌اید ترکیب می‌کند.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'مرور: چه ساعتی'
    gloss: چه ساعتی
    note: اولین بار در درس ۴ برای گفتن ساعت آمد و اینجا برای پرسیدن ساعت حرکت به کار می‌رود.
    example_gloss: ساعت چند است؟
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: قطار ساعت چند حرکت می‌کند؟
    gloss: قطار ساعت چند حرکت می‌کند؟
    note: سؤال «چه ساعتی» دربارهٔ زمان حرکت طبق برنامه، نه ساعت فعلی.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: قطار ساعت ۶ حرکت می‌کند.
    gloss: قطار ساعت ۶ حرکت می‌کند.
    note: پاسخ جملهٔ کامل و طبیعی که از شکل جمع *baje* در درس ۴ استفاده می‌کند (شش استثنای *baja* نیست؛ آن فقط برای ساعت یک است).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: بلیت چند است؟
    gloss: بلیت چند است؟
    note: سؤال قیمت *kitne ka/ki* از درس ۷ دوباره می‌آید. *Tikat* معمولاً مذکر حساب می‌شود (*ka*)؛ بسیاری از گویشوران آن را مؤنث هم می‌گیرند (*kitne ki*) که آن هم درست است.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'مرور: روپیه، پنجاه'
    gloss: روپیه، پنجاه
    note: هر دو اولین بار در درس ۲ برای قیمت و مقدار آمدند و اینجا برای قیمت بلیت به کار می‌روند.
    example_gloss: من پنجاه روپیه دارم.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: بلیت ۵۰ روپیه است.
    gloss: بلیت ۵۰ روپیه است.
    note: پاسخ جملهٔ کامل و طبیعی به سؤال قیمت بالا.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: ما، برای ما
    gloss: ما، برای ما / به ما
    note: «Hum» (ما) قبلاً در درس ۱۱ به عنوان اولین ضمیر اول‌شخص جمع دوره معرفی شد؛ «hamein» شکل مفعول غیرمستقیم آن است و برای گفتگوی سفرِ مشترک لازم است.
    example_gloss:
    - ما خوبیم.
    - ما باید به ایستگاه برویم.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: چهارمین ضمیر مفعول غیرمستقیم'
    gloss: «Hamein» شکل مفعول غیرمستقیم «hum» (درس ۱۱) است، درست مثل «mujhe» (main) و «tumhein» (tum). اینجا هم با «jana»، «hai» همان‌طور می‌ماند و هیچ‌وقت «hain» نمی‌شود؛ با «hum»/«hamein» مطابقت نمی‌کند.
    note: هر سه ضمیر قبلی را با شمارهٔ درس نام می‌برد و بعد چهارمی را اضافه می‌کند؛ نکتهٔ ثابت‌ماندن «hai» در درس اول را هم دوباره یادآوری می‌کند.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: ما باید به ایستگاه برویم.
    gloss: ما باید به ایستگاه برویم.
    note: ساختار «باید» با ضمیر جمع تازه.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'مرور: مالِ / از (مؤنث)'
    gloss: مالِ / از (نشانهٔ مالکیت، مؤنث)
    note: اولین بار در درس ۷ کنار *ka*/*kitne* آمد؛ اینجا دوباره می‌آید چون «قطار» در هندی مؤنث است و شکل مالکیتش «ki» است، نه «ka».
    example_gloss: این قطار دهلی است.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: آرجون می‌گوید باید بروند
    gloss: پریا، ما باید به ایستگاه برویم.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: پریا بلیت دهلی لازم دارد
    gloss: باشه. من یک بلیت به مقصد دهلی می‌خواهم.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: آرجون قیمت را می‌پرسد
    gloss: من هم. بلیت چند است؟
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: پریا قیمت را می‌گوید
    gloss: بلیت ۵۰ روپیه است.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: آرجون ساعت حرکت را می‌پرسد
    gloss: خوب. قطار چه ساعتی حرکت می‌کند؟
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: پریا ساعت و سکو را می‌گوید
    gloss: قطار ساعت ۶ از سکوی شماره ۳ حرکت می‌کنه.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: ارجون می‌فهمه و می‌گه بریم
    gloss: فهمیدم. بریم!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: پریا موافقت می‌کنه
    gloss: بریم!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (۱) ''mujhe/tumhein/hamein + «verb» + hai'' یعنی «باید ___»؛ (۲) ''X kitne ka/ki hai?'' برای پرسیدن قیمته؛ (۳) ''X [time] baje [«place»] se jaati hai'' زمان و مکان حرکت رو می‌گه.'
    note: جمع‌بندی پایانی که دستور کل این واحد را کنار هم می‌گذارد، درست مثل نکتهٔ دستوری واحد ۱۴ که الگوها را به هم وصل می‌کرد.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: خواندن یک بلیت
    gloss: 'بلیت: دهلی. سکوی شماره ۳. ساعت ۶.'
    note: یک متن کوتاه و تکه‌تکه، درست مثل بلیت واقعی، که همان اطلاعات گفتگو را بدون هیچ مطلب تازه‌ای دوباره می‌آورد.
    glosses:
      टिकट: بلیت
      प्लेटफ़ॉर्म: سکو
      नंबर: شماره
      बजे: ساعت
