teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: پالتو، پلیور
    gloss: پالتو، پلیور
    note: '*जैकेट* مؤنث است و *स्वेटर* مذکر؛ این را در کلماتی که همراهشان می‌آیند می‌بینید: *मेरी जैकेट*، *मेरा स्वेटर*.'
    example_gloss:
    - دنبال یک پالتو می‌گردم.
    - من یک پلیور دارم.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: شلوار، کفش
    gloss: شلوار، کفش‌ها
    note: '*पैंट* برای یک شلوار یک کلمهٔ مفرد است (*मेरी पैंट*) و *जूते* جمع *जूता* است: اسم مذکر مختوم به *-आ* در جمع به *-ए* تبدیل می‌شود.'
    example_gloss:
    - دنبال یک شلوار می‌گردم.
    - دنبال کفش می‌گردم.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: گفتن اینکه دنبال چه چیزی می‌گردید
    gloss: دنبال یک پالتو می‌گردم.
    note: 'فعل آخر جمله می‌آید: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* معنی «دارم دنبالش می‌گردم» (در حال انجام) را می‌دهد و *रहा* شکل مذکر است (خانم‌ها *रही* می‌گویند).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: سایز
    gloss: سایز
    note: '*साइज़* اسم مذکر است، پس کلمات همراهش هم مذکرند: *मेरा साइज़*.'
    example_gloss: چه سایزی می‌پوشید؟
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: پرسیدن دربارهٔ سایز
    gloss: چه سایزی می‌پوشید؟
    note: '*कौन सा* («کدام») دربارهٔ انتخاب یکی از چند مورد می‌پرسد و *सा* با اسم مطابقت دارد: *कौन सा साइज़*، ولی *कौन सी जैकेट*. *आप* «شما»ی محترمانه برای فروشنده است.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: گفتن سایز خودتان
    gloss: من سایز M هستم.
    note: 'هندی اینجا از فعل «داشتن» استفاده نمی‌کند: *मेरा साइज़ एम है* یعنی تحت‌اللفظی «سایز من M است» و *मेरा* با *साइज़* مذکر مطابقت دارد.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: مشکی، آبی
    gloss: مشکی، آبی
    note: دو صفت رنگ پایه در این درس.
    example_gloss:
    - پالتو را به رنگ مشکی می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: درخواست یک رنگ
    gloss: پالتو را به رنگ مشکی می‌خواهم.
    note: '*मुझे ... चाहिए* راه گفتن «می‌خواهم» در هندی است: خواسته «برای من» (*मुझे*) پیش می‌آید و چیزِ موردنظر درست قبل از *चाहिए* می‌آید.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: پرسیدن دربارهٔ رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*आपके पास ... है?* («نزد شما ... هست؟») راه مؤدبانهٔ پرسیدن «... دارید؟» است و *भी* («هم») بعد از کلمه‌ای می‌آید که به آن اضافه می‌کند.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: پرسیدن دربارهٔ اندازه بودن
    gloss: این پالتو اندازه است؟
    note: 'هندی دربارهٔ لباس می‌گوید «درست می‌آید»: *ठीक आती है*. فعل با آن چیز مطابقت دارد؛ پس برای *जैकेट* مؤنث *आती* می‌آید و برای *स्वेटर* مذکر *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: تأیید اندازه بودن
    gloss: اندازه‌ام است.
    note: '*एकदम* («کاملاً») آن را به «دقیقاً اندازه است» تبدیل می‌کند؛ *आती है* با *जैकेट* مؤنث مطابقت دارد.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: خیلی کوچک است
    gloss: خیلی کوچک است.
    note: '*बहुत* قبل از صفت می‌آید و اینجا معنی «زیادی» می‌دهد: *बहुत छोटी*. صفت با *जैकेट* مؤنث مطابقت دارد.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: خیلی بزرگ است
    gloss: خیلی بزرگ است.
    note: 'همان الگو با *बड़ी*: *बड़ा* برای اسم مؤنث به *बड़ी* تبدیل می‌شود، پس *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: نهصد
    gloss: نهصد
    note: '*नौ सौ* عدد ۹۰۰ است که در قیمت کت به کار رفته.'
    example_gloss: قیمت کت نهصد روپیه است.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: گفتن قیمت
    gloss: قیمت کت نهصد روپیه است.
    note: 'هندی می‌گوید «قیمتِ کت ... است»: *जैकेट की कीमत नौ सौ रुपये है*. *की* با *कीमत* مؤنث مطابقت دارد، نه با *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: خواندن رسید فروشگاه
    gloss: 'کت زمستانی: سایز M، رنگ مشکی. قیمت: نهصد روپیه. این کت دقیقاً اندازه و گرم است.'
    note: به سایز، رنگ، قیمت و دو ویژگی‌ای که دربارهٔ پالتو آمده توجه کنید.
    glosses:
      सर्दी: (کت) زمستانی
      साइज़: سایز
      रंग: رنگ
      काला: مشکی
      कीमत: قیمت
      नौ: نُه
      सौ: صد
      रुपये: روپیه
      जैकेट: پالتو
      आती: اندازه است
      गर्म: گرم
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: پریا کت را می‌بیند
    gloss: 'پریا: این کت خیلی قشنگه! سایز تو چنده؟'
    note: '*अच्छी* با *जैकेट* مؤنث مطابقت دارد. *तुम्हारा* «مال تو»ی صمیمی است که بین دوستان به کار می‌رود.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: آرجون می‌خواهد کت را امتحان کند
    gloss: 'آرجون: سایز من M است. می‌شود امتحانش کنم؟'
    note: '*पहनकर देखना* («پوشیدن و دیدن») راه گفتن «امتحان کردن» در هندی است. *सकता हूँ* یعنی «می‌توانم» یا «می‌شود» و خانم‌ها *सकती हूँ* می‌گویند.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: پریا دربارهٔ اندازه می‌پرسد
    gloss: 'پریا: حتماً. اندازه‌ات هست؟'
    note: '*यह* یعنی «این» یا «آن» و *आती* با *जैकेट* مؤنث مطابقت دارد.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: آرجون تأیید می‌کند
    gloss: 'آرجون: آره، دقیقاً اندازه‌م هست و گرمه هم.'
    note: دقیقاً با رسیدی که در درس پنجم خواندید یکی است؛ این همان پالتو است.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: پریا دربارهٔ رنگ می‌پرسد
    gloss: 'پریا: عالیه! مشکی‌شو برمی‌داری یا آبی؟'
    note: '*या* («یا») یک انتخاب پیشنهاد می‌کند. *रंग* دوم را می‌شود حذف کرد: *काले रंग में ... या नीले में*. *तुम* صمیمی است.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: آرجون تصمیم می‌گیرد
    gloss: 'آرجون: مشکی‌شو برمی‌دارم.'
    note: '*लूँगा* آیندهٔ *लेना* («گرفتن، برداشتن») است؛ فعل معمول برای تصمیم خرید در مغازه. خانم‌ها *लूँगी* می‌گویند.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ و लेता है
    gloss: من برمی‌دارم، او برمی‌دارد.
    note: '*-ता* پایانهٔ عادت است و با فاعل مطابقت دارد، در حالی که *हूँ* با *मैं* و *है* با *वह* می‌آید.'
