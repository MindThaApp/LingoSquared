teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: خوشحال، ناراحت و عصبانی
    gloss: خوشحال، ناراحت، عصبانی
    note: '*खुश*، *उदास* و *नाराज़* واژه‌های پایهٔ احساس‌اند که با *हूँ* یا *है* (هستم، است) می‌آیند؛ برای مذکر و مؤنث تغییر نمی‌کنند.'
    example_gloss:
    - من خوشحالم.
    - غمگینم.
    - من عصبانی هستم.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: گفتن اینکه خوشحالید
    gloss: من خوشحالم.
    note: '*मैं खुश हूँ* الگوی *मैं* + احساس + *हूँ* را دارد، درست مثل «من ... هستم».'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: مقایسه‌ی احساسات
    gloss: من عصبانی نیستم، ناراحتم.
    note: '*नहीं* درست قبل از *हूँ* می‌آید: *नाराज़ नहीं हूँ*. بخش دوم احساس واقعی را می‌گوید.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: پرسیدن دلیل
    gloss: چرا خوشحالی؟
    note: '*क्यों* (چرا) قبل از کلمهٔ اصلی می‌آید: *तुम खुश क्यों हो?*. *तुम* «تو»ی غیررسمی است.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: گفتن دلیل
    gloss: من خوشحالم چون آپارتمان جدیدی دارم.
    note: '*क्योंकि* دلیل را معرفی می‌کند. *मेरे पास ... है* یعنی «من ... دارم» و فعل *है* آخر جمله می‌آید.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: یک دلیل منفی
    gloss: من ناراحتم چون دارد باران می‌آید.
    note: '*बारिश हो रही है* یعنی «دارد باران می‌آید» (تحت‌اللفظی: باران در حال رخ دادن است).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: مضطرب
    gloss: مضطرب
    note: کلمه‌ی معمول برای استرس و دلهره.
    example_gloss: از اولین شیفت کاری‌ام استرس دارم.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: گفتن اینکه برای چه چیزی دلشوره دارید
    gloss: از اولین شیفت کاری‌ام استرس دارم.
    note: '*को लेकर* یعنی «دربارهٔ / بابت» و بعد از اسم می‌آید: *शिफ़्ट को लेकर*. *अपनी* (مالِ خودم) با *शिफ़्ट* که مؤنث است مطابقت دارد.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: دلداری دادن به کسی
    gloss: نگران نباش.
    note: '*चिंता मत करो* یعنی «نگران نباش» به شکل دوستانه: *मत* + *करो* دستور برای *तुम* با معنی نهی است.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: پرسیدن حال کسی
    gloss: آرجون چه حسی دارد؟
    note: '*कैसा महसूस कर रहा है* یعنی «چه حسی دارد». *कैसा* با شخص مطابقت دارد، پس برای یک زن *कैसी* می‌گویند.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: توصیف حال کسی
    gloss: او استرس دارد.
    note: 'در هندی اینجا واژهٔ جداگانه‌ای برای «خودش» لازم نیست: *वह नर्वस महसूस कर रहा है* فقط از *वह* و *रहा है* استفاده می‌کند.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: پرسیدن دلیل حال کسی
    gloss: چرا استرس دارد؟
    note: '*क्यों* درست قبل از گروه فعلی می‌آید: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: خواندن یک پیام درباره‌ی احساسات
    gloss: سلام پریا، من بابت اولین شیفتم که تنها هستم کمی دلواپسم. ولی خوشحال هم هستم، چون یک شغل جدید و یک آپارتمان جدید دارم. فکر می‌کنم همه‌چیز خوب می‌شود.
    note: دقت کنید نویسنده برای چه چیزی دلشوره دارد، چه چیزی او را خوشحال می‌کند و دید کلی‌اش چیست.
    glosses:
      थोड़ा: یک کم
      नर्वस: عصبی
      पहली: اولین
      शिफ़्ट: شیفت
      अकेले: تنها
      खुश: خوشحال
      क्योंकि: چون
      नई: جدید
      नौकरी: شغل
      नया: جدید
      फ़्लैट: آپارتمان
      लगता: فکر کردن
      होगा: 'درست می‌شود (اینجا: همه‌چیز درست می‌شود)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: پریا می‌پرسد آرجون چه حسی دارد
    gloss: 'پریا: سلام آرجون، بابت اولین شیفتت چه حسی داری؟'
    note: 'دوباره *को लेकर* آمده: *अपनी पहली शिफ़्ट को लेकर* (بابت اولین شیفتت). *तुम* غیررسمی است.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: آرجون اعتراف می‌کند دلواپس است
    gloss: 'آرجون: راستش کمی دلواپسم.'
    note: '*सच कहूँ तो* (اگر راستش را بگویم) اعتراف را ملایم‌تر می‌کند.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: پریا به او دلگرمی می‌دهد
    gloss: 'پریا: نگران نباش، تو می‌توانی این کار را خوب انجام بدهی!'
    note: '*तुम यह अच्छे से कर सकते हो* یعنی «تو می‌توانی این را خوب انجام بدهی» و *अच्छे से* یعنی «خوب».'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: آرجون از او تشکر می‌کند
    gloss: 'آرجون: ممنون، واقعاً کمک می‌کند.'
    note: '*इससे मदद मिलती है* تحت‌اللفظی یعنی «از این، کمک گرفته می‌شود»: کمک‌کننده با *से* مشخص می‌شود.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: پریا نتیجه را پیش‌بینی می‌کند
    gloss: 'پریا: و بعدش حتماً خیلی خوشحال می‌شوی و به خودت افتخار می‌کنی.'
    note: '*ज़रूर* (حتماً) پیش‌بینی را مطمئن می‌کند و *तुम्हें गर्व होगा* یعنی «احساس افتخار خواهی کرد».'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: آرجون موافقت می‌کند
    gloss: 'آرجون: آره، من هم همین‌طور فکر می‌کنم.'
    note: '*मुझे भी ऐसा ही लगता है* (به من هم همین‌طور می‌رسد) روش طبیعی برای موافقت است و *मुझे* نشان می‌دهد چه کسی این حس را دارد.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'ضمیر: उसकी'
    gloss: آرجون دلواپس است. پریا به او کمک می‌کند.
    note: '*उसकी* یعنی «مالِ او» و با *मदद* که مؤنث است مطابقت دارد، پس *उसकी मदद करना* یعنی «به او کمک کردن»؛ *है* و *करती है* فعل‌های سوم شخص‌اند.'
