    example_gloss: بله، من هم خوشم آمد.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: ارجن از پریا دربارهٔ شغلش می‌پرسد
    gloss: پریا، تو چه کاره‌ای؟
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید معلم یک مدرسه است
    gloss: من معلم هستم. در یک مدرسه کار می‌کنم.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: ارجن می‌پرسد هر روز به مدرسه می‌رود یا نه
    gloss: چه خوب! هر روز به مدرسه می‌روی؟
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: پریا تأیید می‌کند و همین سؤال را از ارجن می‌پرسد
    gloss: بله، هر روز به مدرسه می‌روم. تو چه کاره‌ای؟
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: ارجن می‌گوید مهندس است و در یک دفتر کار می‌کند
    gloss: من مهندس هستم. در یک دفتر کار می‌کنم.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
