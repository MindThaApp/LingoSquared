    gloss: عالیه! تو هم هر روز به دفتر می‌روی؟
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: ارجن تأیید می‌کند
    gloss: بله، هر روز به دفتر می‌روم.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: پریا از او تشکر می‌کند
    gloss: باشه، ممنون.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این درس: (۱) با «mein + شغل + hoon» شغل را می‌گویید (مثلاً «mein shikshika hoon») و بعضی شغل‌ها با جنسیت خودِ گوینده عوض می‌شوند؛ (۲) با «[محل] + mein + kaam karta/karti hoon» محل کار را می‌گویید (مثلاً «mein daftar mein kaam karta hoon»)؛ (۳) با «roz [محل] jata/jati hoon» عادت روزانه را می‌گویید، با همان قاعدهٔ -ta/-ti از درس ۱۰.'
    note: جمع‌بندی پایانی که دستور کل درس را به هم وصل می‌کند، مثل نکته‌های دستوری جمع‌بندی درس ۱۵ و ۱۶.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: خواندن یک معرفی کوتاه
    gloss: پریا معلم است. او در یک مدرسه کار می‌کند. ارجن مهندس است. او در یک دفتر کار می‌کند.
    note: یک معرفی کوتاه و مستقیم که دقیقاً همان اطلاعات گفت‌وگو را تکرار می‌کند، بدون ادعای تازه؛ مناسب هدف «خواندن یک معرفی کوتاه از کار و شغل».
    glosses:
      शिक्षिका: معلم (زن)
      स्कूल: مدرسه
      काम: کار کردن
      करती: انجام می‌دهد / کار می‌کند (مؤنث، از करना)
      इंजीनियर: مهندس
      दफ़्तर: دفتر
      करता: انجام می‌دهد / کار می‌کند (مذکر، از करना)
