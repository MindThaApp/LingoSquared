    gloss: می‌روی (تو، زن، خودمانی)، می‌روی (تو، مرد، خودمانی)، می‌روم (من، مرد)
    note: شکل‌های -ta/-ti/-te از *jana* (رفتن) که در درس ۱۰ معرفی شدند و اینجا برای رفت‌وآمد روزانه به محل کار دوباره می‌آیند.
    example_gloss:
    - من هر روز به مدرسه می‌روم (گوینده زن).
    - تو هر روز به دفتر می‌روی؟ (خطاب به مرد)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'مرور: هم، بله'
    gloss: هم، بله
