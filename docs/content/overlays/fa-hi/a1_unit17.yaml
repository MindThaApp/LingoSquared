  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + شغل + hoon
    gloss: با «Mein + شغل + hoon» شغل را می‌گویید؛ همان ساختار قدیمی «mein...hoon» از درس ۱. بعضی شغل‌ها با جنسیت خودِ گوینده عوض می‌شوند -- «shikshak» (مرد)، «shikshika» (زن)، درست مثل پایان فعل -ta/-ti که در درس ۱۰ عوض می‌شد. «Doctor» و «engineer» عوض نمی‌شوند -- برای هر دو جنس یک کلمه است.
    note: 'تفاوت دو دسته را از همان اول روشن می‌کند: اسم‌هایی که با جنسیت تغییر می‌کنند و واژه‌های قرضی که ثابت می‌مانند، پیش از آنکه تمرینی به آن تکیه کند.'
