    note: یک جفت اسم شغلی جدید. برخلاف بیشتر اسم‌هایی که تا اینجا یاد گرفته‌اید، این یکی بسته به جنسیت خودِ گوینده عوض می‌شود -- به نکتهٔ دستوری همین درس نگاه کنید.
    example_gloss:
