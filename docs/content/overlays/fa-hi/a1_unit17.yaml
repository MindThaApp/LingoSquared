  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: من در دفتر کار می‌کنم.
    gloss: من در دفتر کار می‌کنم.
    note: الگوی محل کار با «دفتر»، به شکل مذکر.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: محل + mein + kaam karta/karti hoon
    gloss: '«[محل] + mein + kaam karta/karti hoon» سه بخش آشنا را کنار هم می‌گذارد: «mein» (درس ۱، «London mein rehta hoon»)، «kaam» (درس ۱۰/۱۱) و شکل -ta/-ti/-te از «karna» («nashta karta hoon» در درس ۱۰ و «kya tum yog karti ho?» در درس ۱). این دستور تازه‌ای نیست؛ فقط برای اولین بار هر سه در یک جمله کنار هم می‌آیند.'
    note: هر بخشِ قبلاً آموخته‌شده را با شمارهٔ درسش نام می‌برد و بعد آن‌ها را ترکیب می‌کند، همان‌طور که در همهٔ نکته‌های دستوری قبلی بود.
