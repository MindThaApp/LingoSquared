  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این درس: (۱) ''[مکان] + mein + [عدد] + [اسم] + hai/hain'' برای گفتن اینکه توی خانه چه چیزهایی هست و چند تا است؛ (۲) اسم‌های مذکری که به ''-a'' ختم می‌شوند، در جمع ''-e'' می‌گیرند (kamra ← kamre)؛ (۳) اسم‌های مؤنثی که به ''-i'' ختم می‌شوند، در جمع ''-iyan'' می‌گیرند (kursi ← kursiyan، khidki ← khidkiyan).'
    note: جمع‌بندی پایانی که دستور کل درس را کنار هم می‌گذارد، مثل یادداشت‌های دستوری درس‌های ۱۵ تا ۱۷.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: خواندن دربارهٔ دو خانه
    gloss: خانهٔ پریا کوچک است. توی خانه دو اتاق هست، یک آشپزخانه و یک حمام. خانهٔ آرجون بزرگ است. توی خانه سه اتاق خواب و یک آشپزخانهٔ بزرگ هست.
    note: یک معرفی کوتاه و مستقیم که دقیقاً همان اطلاعات گفت‌وگو را تکرار می‌کند، بدون هیچ ادعای تازه‌ای.
    glosses:
      घर: خانه
      छोटा: کوچک
      कमरे: اتاق‌ها
      रसोई: آشپزخونه
      बाथरूम: حمام
      बड़ा: بزرگ
      बेडरूम: اتاق خواب‌ها
      बड़ी: بزرگ (مؤنث)
