  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: باید برم پیش دکتر.
    gloss: باید برم دکتر.
    note: '*ke paas* را با ساختار الزام *mujhe...jana hai* از واحد ۱۵ ترکیب می‌کند.'
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: معنای سوم'
    gloss: 'دو معنای اول ''Ke paas'' را قبلاً یاد گرفته‌اید: نزدیکی (واحد ۸: ''bank school ke paas hai'') و داشتن (واحد ۲: ''mere paas ek kitab hai''). حالا کاربرد سوم: رفتن پیش یک آدم، یعنی رفتن به دیدن او. ''doctor ke paas jana hai'' یعنی «باید پیش دکتر بروم». همان ساختار ''mujhe...jana hai'' از واحد ۱۵ هم دوباره آمده است.'
    note: پیش از معرفی معنای سوم، هر دو معنای قبلی را با شمارهٔ واحد یادآوری می‌کند و به تکرار ساختار الزام هم اشاره می‌کند.
