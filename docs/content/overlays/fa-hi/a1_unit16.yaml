  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: کاربرد دوبارهٔ قاعدهٔ امر با -o'
    gloss: '''Karo'' از همان قاعدهٔ امر برای «تو» ساخته می‌شود که قبلاً یاد گرفته‌اید (''jao''، ''muro''، ''batao''، ''gino'' -- همه به ''-o'' ختم می‌شوند). اینجا از ''karna'' (همان ''maaf karna'' واحد ۱۱) ساخته می‌شود: ریشهٔ ''kar'' به‌علاوهٔ ''-o'' می‌شود ''karo'' یعنی «بکن!». ''Aaraam karo'' یعنی «استراحت کن!»'
    note: ادامهٔ مستقیم و صریح قاعدهٔ امر که قبلاً یاد گرفته‌اید، روی فعلی که یادگیرنده آن را قبلاً به شکل مصدر می‌شناسد.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: استراحت کن!
    gloss: استراحت کن!
