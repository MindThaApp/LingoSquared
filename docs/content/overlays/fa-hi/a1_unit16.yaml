  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + علامت + hai
    gloss: 'الگوی ''mujhe + اسم + hai'' را قبلاً در واحد ۱۱ یاد گرفته‌اید (''mujhe kaam hai'' = «من کار دارم»). حالا برای بیان علائم بیماری هم به کار می‌رود: ''mujhe sir dard hai'' یعنی «سردرد دارم». ''sir dard'' (sir = سر، dard = درد) با هم «سردرد» را می‌سازند. این دستور تازه‌ای نیست؛ همان الگوی قبلی است.'
    note: دومین کاربرد الگوی «mujhe + اسم + hai» را نشان می‌دهد که قبلاً یاد گرفته‌اید و پیش از کاربرد آن برای علائم بیماری، به واحد قبلی اشاره می‌کند.
    target_text: '''मुझे + संज्ञा + है'' را قبلاً در واحد ۱۱ یاد گرفتید (''मुझे काम है'' = «کار دارم»). حالا از همین الگو برای گفتن علائم بیماری هم استفاده می‌شود: ''मुझे सिर दर्द है'' یعنی «سردرد دارم» -- ''सिर दर्द'' (सिर = سر، दर्द = درد) با هم «سردرد» را می‌سازند. این دستور تازه‌ای نیست، همان الگوی قبلی است.'
