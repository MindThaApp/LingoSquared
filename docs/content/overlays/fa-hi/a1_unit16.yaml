    gloss: برای تو / به تو، رفتن
    note: هر دو قبلاً یاد گرفته شده‌اند (واحد ۶ و واحد ۱۵) و اینجا برای حرف زدن دربارهٔ رفتن پیش دکتر دوباره به کار می‌روند.
    example_gloss:
