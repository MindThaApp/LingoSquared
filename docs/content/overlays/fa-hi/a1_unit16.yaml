    gloss: استراحت کن. برو پیش دکتر.
    note: یک دستور کوتاه و مستقیم، مثل توصیه‌های واقعی در گفتار، که دقیقاً همان چیزهایی را تکرار می‌کند که در گفتگو آمد، بدون ادعای تازه.
    glosses:
