  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (۱) ''mujhe/tumhein + علامت + hai'' برای گفتن مشکل جسمی (مثلاً ''mujhe bukhar hai'')؛ (۲) ''tumhein/mujhe + چیز + chahiye'' برای گفتن نیاز (مثلاً ''tumhein aaraam chahiye'')؛ (۳) ''X ke paas jana hai'' می‌گوید باید پیش چه کسی رفت (مثلاً ''doctor ke paas jana hai'').'
    note: جمع‌بندی پایانی که دستور کل واحد را به هم وصل می‌کند، مثل نکتهٔ دستوری واحد ۱۵ که الگوها را کنار هم می‌گذاشت.
