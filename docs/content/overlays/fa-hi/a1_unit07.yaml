teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: مغازه، بازار
    gloss: مغازه، بازار
    note: دو جای رایج برای خرید که در سراسر این واحد استفاده می‌شوند.
    example_gloss:
    - این یک مغازه است.
    - این یک بازار است.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: مغازه‌دار
    gloss: مغازه‌دار
    note: یک شخصیت جدید در این واحد -- کسی که مغازه‌ای را اداره می‌کند و چون غریبه است، با او با aap صحبت می‌کنیم.
    example_gloss: این مغازه‌دار است.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: پیراهن، کیف، کلاه
    gloss: پیراهن، کیف، کلاه
    note: سه چیز رایج برای خرید که در این واحد برای تمرین الگوی *mujhe ... chahiye* از واحد غذا به کار می‌روند.
    example_gloss:
    - یک پیراهن می‌خواهم.
    - یک کیف می‌خواهم.
    - یک کلاه می‌خواهم.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: این را می‌خواهم
    gloss: این را می‌خواهم.
    note: یک عبارت عمومی برای خواستن یک چیز؛ همان *mujhe ... chahiye* از درس غذا، این بار با *yah* (این).
  hi.a1.unit07.lesson01.teach.ji:
    title: جی (عنوان محترمانه)
    gloss: یک ادات محترمانه، مثل اضافه کردن «آقا» یا «خانم»
    note: بعد از اسم یا عنوان می‌آید تا مؤدبانه‌تر به نظر برسید؛ وقتی با یک غریبه مثل مغازه‌دار صحبت می‌کنید رایج است.
    example_gloss: سلام، آقای مغازه‌دار.
  hi.a1.unit07.lesson01.teach.sirf:
    title: فقط
    gloss: فقط
    note: برای این به کار می‌رود که بگویید فقط یک چیز می‌خواهید، نه چند تا.
    example_gloss: فقط یک پیراهن می‌خواهم.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: چیز دیگری میل دارید؟ (رسمی)
    gloss: چیز دیگری میل دارید؟
    note: سؤال رسمی و طبیعی که مغازه‌دار بعد از گرفتن بخشی از سفارش می‌پرسد؛ با *aapko* و *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: نه، فقط این
    gloss: نه، فقط این.
    note: راهی طبیعی و مؤدبانه برای رد کردن چیزهای بیشتر؛ با *ji* و *sirf* از همین درس.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: بگو چه می‌خواهی
    gloss: بگو چه می‌خواهی.
    note: عبارت غیررسمی تمرین که این دوره برای خواستن جواب گفتاری به کار می‌برد، مثل نسخه‌ی درس غذا.
  hi.a1.unit07.lesson02.teach.keemat:
    title: قیمت
    gloss: قیمت
    note: از درس ۲ (عددها و قیمت) آمده و اینجا در موقعیت خرید دوباره آموزش داده می‌شود.
    example_gloss: قیمتش چقدر است؟
  hi.a1.unit07.lesson02.teach.rupaye:
    title: روپیه
    gloss: روپیه
    note: واژه‌ی واحد پول، از درس ۲؛ اینجا با دو قیمت متفاوت تمرین می‌شود.
    example_gloss:
    - قیمتش دویست روپیه است.
    - قیمتش پانصد روپیه است.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: قیمتش چقدر است؟
    gloss: قیمتش چقدر است؟
    note: روش استاندارد پرسیدن قیمت، مستقیم از درس ۲.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: قیمتش دویست روپیه است
    gloss: قیمتش دویست روپیه است.
    note: یک پاسخ نمونه به سؤال قیمت بالا.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: «Yah kitne ka hai?» برای چیزهای مذکر است و «Yah kitne ki hai?» برای چیزهای مؤنث. *kitne* هیچ‌وقت عوض نمی‌شود، فقط *ka/ki* عوض می‌شود؛ درست مثل تغییر -a/-i در *mera/meri* و *tumhara/tumhari* که می‌شناسید.
    note: روش دوم و خیلی رایج برای پرسیدن قیمت، بر پایه‌ی همان الگوی مطابقت جنس که از صفت‌های ملکی یاد گرفتید؛ فقط ka/ki عوض می‌شود، نه kitne.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: این چنده؟ (مذکر)
    gloss: این چنده؟
    note: برای چیز مذکر استفاده می‌شود، مثل کیف.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: این چنده؟ (مؤنث)
    gloss: این چنده؟
    note: برای چیز مؤنث استفاده می‌شود، مثل کلاه.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: ارزان، گران
    gloss: ارزان، گران
    note: یک جفت صفت رایج برای واکنش به قیمت؛ اینجا شکل‌های مذکر آمده است.
    example_gloss:
    - این کیف ارزان است.
    - این کیف گران است.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti و mehengi
    gloss: «Sasta» و «mehenga» هم مثل «mera/meri» برای مذکر و مؤنث عوض می‌شوند؛ با کلمه‌های مؤنث «sasti» و «mehengi» می‌گوییم، مثل «yah topi sasti hai» (این کلاه ارزان است) یا «yah kameez mehengi hai» (این پیراهن گران است).
    note: نمونه‌ی دوم واقعی از همان الگوی مطابقت جنس که این دوره مدام به آن اشاره می‌کند.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: خریدن
    gloss: خریدن
    note: همان ساختار «فعل + na chahta/chahti hun» (می‌خواهم ... بکنم) که در درس ۱ برای یادگیری یوگا آمد، اینجا برای خریدن به کار می‌رود.
    example_gloss:
    - می‌خواهم این پیراهن را بخرم.
    - می‌خواهم این کلاه را بخرم.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: بیا چیزی بخریم!
    gloss: بیا چیزی بخریم!
    note: روش دوستانه و ثابت برای پیشنهاد خرید با هم، آغاز گفتگوی پایانی این واحد؛ مثل «chalo, kuch khate hain!» در درس غذا.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: ارجون پیشنهاد خرید می‌دهد
    gloss: ارجون می‌گوید بیا چیزی بخریم.
    note: عبارت آغازین همین واحد دوباره به کار رفته است.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: پریا موافقت می‌کند
    gloss: 'پریا موافقت می‌کند و می‌پرسد: پیراهن یا کلاه؟'
    note: '*ya* (یا) را معرفی می‌کند تا بین دو چیز انتخاب بدهید.'
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: مغازه‌دار به آن‌ها خوشامد می‌گوید
    gloss: مغازه‌دار سلام می‌کند و می‌پرسد چه می‌خواهند.
    note: احوال‌پرسی رسمی با «aap»؛ *aapko kya chahiye* از درس ۱ دوباره آمده است.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: پریا درباره‌ی یک پیراهن می‌پرسد
    gloss: پریا مؤدبانه به مغازه‌دار سلام می‌کند، یک پیراهن می‌خواهد و بعد قیمتش را می‌پرسد.
    note: '*ji*، *mujhe ... chahiye* و *iski keemat kya hai* را با هم ترکیب می‌کند.'
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: مغازه‌دار قیمت را می‌گوید
    gloss: مغازه‌دار می‌گوید قیمتش سیصد روپیه است.
    note: الگوی *iski keemat ... rupaye hai* با یک عدد تازه دوباره آمده است.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: پریا واکنش نشان می‌دهد و تصمیم می‌گیرد
    gloss: پریا می‌گوید سیصد روپیه؟ ارزان است! این پیراهن را می‌خواهم.
    note: '*sasti* از نکته‌ی دستوری درس ۲ دوباره آمده است.'
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: ارجون درباره‌ی یک کلاه می‌پرسد
    gloss: ارجون می‌گوید یک کلاه می‌خواهد و می‌پرسد چند است.
    note: شکل مؤنث *kitne ki hai* از درس ۲ دوباره آمده است.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: مغازه‌دار جواب می‌دهد
    gloss: مغازه‌دار می‌گوید این کلاه پانصد روپیه است.
    note: '*paanch sau* (پانصد) از درس ۲ دوباره آمده است.'
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: ارجون واکنش نشان می‌دهد و باز هم می‌خرد
    gloss: ارجون می‌گوید پانصد روپیه؟ گران است! باشه، این کلاه را می‌خواهم.
    note: '*mehengi* از نکته‌ی دستوری درس ۲ دوباره آمده و بعد با این حال تصمیم به خرید می‌گیرد.'
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: مغازه‌دار می‌پرسد همین بود یا نه
    gloss: مغازه‌دار می‌گوید باشه، چیز دیگری میل دارید؟
    note: '*aapko aur kuch chahiye* از درس ۱ دوباره آمده است.'
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: پریا سفارش را تمام می‌کند
    gloss: پریا می‌گوید نه، فقط این، ممنون!
    note: '*ji nahin, sirf yah* از درس ۱ به‌همراه *shukriya* دوباره آمده است.'
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: مغازه‌دار خداحافظی می‌کند
    gloss: مغازه‌دار تشکر می‌کند و می‌گوید باز هم می‌بینیمتان.
    note: عبارت پایانی استاندارد همین دوره دوباره آمده است.
