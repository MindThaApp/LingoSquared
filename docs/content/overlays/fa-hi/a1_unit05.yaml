  hi.a1.unit05.lesson01.exercise08.fill_meri_behan:
    instruction: 'جمله را کامل کنید: این خواهرم است.'
    accepted_answers:
    - मेरी
    feedback: Yeh meri behan hai -- meri با behan که مؤنث است مطابقت دارد.
  hi.a1.unit05.lesson01.exercise09.fix_behan_agreement:
    instruction: جمله را درست کنید؛ behan مؤنث است، پس «مالِ من» باید شکل مؤنث بگیرد.
    accepted_answers:
    - यह मेरी बहन है।
    - यह मेरी बहन है
    feedback: Yeh meri behan hai -- mera مذکر است و با behan که مؤنث است مطابقت ندارد.
  hi.a1.unit05.lesson01.exercise10.reply_who_is_this:
