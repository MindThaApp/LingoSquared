    - मेरा एक भाई है
    - मेरी एक बहन है।
    - मेरी एक बहन है
  hi.a1.unit05.lesson02.exercise01.select_dada:
    instruction: کدام واژه یعنی «پدربزرگ پدری»؟
    correct_option: दादा
    distractors:
    - नाना
    - पिता
    accepted_answers:
    - दादा
  hi.a1.unit05.lesson02.exercise02.select_nani:
    instruction: کدام واژه یعنی «مادربزرگ مادری»؟
    correct_option: नानी
    distractors:
    - दादी
    - माँ
    accepted_answers:
    - नानी
  hi.a1.unit05.lesson02.exercise03.select_dada_nana_note_meaning:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: پدر و مادرِ پدر را dada-dadi می‌گویند.
    distractors:
    - پدر و مادرِ مادر را dada-dadi می‌گویند.
    - dada و nana یک معنی دارند.
    accepted_answers:
