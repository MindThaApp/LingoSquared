teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: خانواده
    gloss: خانواده
    note: کلمه‌ی کلی برای «خانواده» که در سراسر این واحد به کار می‌رود.
    example_gloss: خانواده‌ی من در هند است.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: پدر، مادر
    gloss: پدر، مادر
    note: هر دو برای احترام، موقع معرفی به جای *hai* با شکل جمع *hain* می‌آیند و *pita* به جای *mera* با *mere* می‌آید -- یادداشت احترام را بعداً در همین درس ببینید.
    example_gloss:
    - این پدر من است.
    - این مادر من است.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: برادر، خواهر
    gloss: برادر، خواهر
    note: 'جفت اصلی این واحد برای تفاوت mera/meri: *mera bhai*، *meri behan*.'
    example_gloss:
    - من یک برادر دارم.
    - من یک خواهر دارم.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek به معنی «یک» (a/an)
    gloss: '*Ek* هم در شمارش «یک» است و هم نقش «یک (حرف نشانه‌ی نکره)» دارد: *mera ek bhai hai*.'
    note: همان کلمه‌ای است که قبلاً به عنوان عدد ۱ یاد گرفتید -- هندی حرف تعریف نکره‌ی جداگانه‌ای ندارد.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: پدر و مادر
    gloss: پدر و مادر
    note: ترکیبی از *mata* (مادر، رسمی) و *pita* (پدر) -- کلمه‌ی استاندارد برای «پدر و مادر».
    example_gloss: پدر و مادرم در دهلی زندگی می‌کنند.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera یا meri
    gloss: '*Mera* با کلمه‌های مذکر می‌آید و *meri* با کلمه‌های مؤنث: *mera bhai*، *meri behan*.'
    note: نکته‌ی اصلی دستوری این واحد -- صفت ملکی با چیزی یا کسی که به او تعلق دارد هم‌خوانی پیدا می‌کند، نه با گوینده.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: «مِرے» برای بزرگ‌ترها
    gloss: 'از روی احترام به بزرگ‌ترها، *mera* به *mere* و *hai* به *hain* تبدیل می‌شود، حتی وقتی فقط درباره‌ی یک نفر صحبت می‌کنید: *yeh mere pita hain* (این پدرم است).'
    note: این یک قاعده‌ی واقعی و درست است، نه اشتباه. بزرگ‌ترهای مفرد و محترم خانواده (پدر، پدربزرگ) این شکلِ شبیه جمع را می‌گیرند. برای مادر و مادربزرگ، *meri* می‌ماند، ولی فعل به همین دلیل باز هم جمع می‌شود (*hain*).
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: این برادر من است
    gloss: این برادر من است.
    note: شکل ساده‌ی مذکر؛ برای برادر به هیچ شکل احترام‌آمیزی نیازی نیست.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: این خواهرم است
    gloss: این خواهرم است.
    note: شکل ساده‌ی مؤنث که با *behan* مطابقت دارد.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: این کیست؟
    gloss: این کیه؟
    note: یک سؤال ساده و پرکاربرد برای معرفی اعضای خانواده.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: پدربزرگ و مادربزرگ پدری
    gloss: پدربزرگ پدری، مادربزرگ پدری
    note: مخصوصاً پدر و مادرِ پدرتان؛ در یادداشتی که بعداً در همین درس می‌آید، با پدر و مادرِ مادرتان مقایسه می‌شوند.
    example_gloss:
    - پدربزرگم در دهلی زندگی می‌کند.
    - مادربزرگم در دهلی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: پدربزرگ و مادربزرگ مادری
    gloss: پدربزرگ مادری، مادربزرگ مادری
    note: پدر و مادرِ مادرتان؛ هندی برای آن‌ها جفت‌واژه‌ای کاملاً متفاوت از پدر و مادرِ پدر دارد.
    example_gloss:
    - پدربزرگم (از طرف مادر) در بمبئی زندگی می‌کند.
    - مادربزرگم (از طرف مادر) در بمبئی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: دهلی، بمبئی
    gloss: دهلی، بمبئی
    note: دو شهر بزرگ هند که در مثال‌های این درس برای محل زندگی اعضای خانواده به کار می‌روند.
    example_gloss:
    - خانواده‌ام در دهلی زندگی می‌کنند.
    - برادرم در بمبئی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: دو جفت پدربزرگ و مادربزرگ
    gloss: 'پدر و مادرِ پدر: *dada-dadi*. پدر و مادرِ مادر: *nana-nani*.'
    note: در فارسی برای هر دو طرف خانواده از «پدربزرگ» و «مادربزرگ» استفاده می‌کنیم و فقط با «پدری» یا «مادری» فرق می‌گذاریم، اما هندی بسته به طرف خانواده واژه‌های کاملاً جدا دارد.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: زندگی می‌کند (rehna)
    gloss: زندگی می‌کند (مذکر / مؤنث / جمعِ احترام)
    note: 'فعل «زندگی کردن / ساکن بودن»: *rehta hai* برای مرد، *rehti hai* برای زن، *rehte hain* برای بیش از یک نفر یا یک بزرگ‌تر محترم.'
    example_gloss:
    - برادرم در دهلی زندگی می‌کند.
    - خواهرم در بمبئی زندگی می‌کند.
    - پدربزرگ و مادربزرگم در دهلی زندگی می‌کنند.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: مال تو (خودمانی)
    gloss: مال تو، ـت (خودمانی، مذکر / مؤنث)
    note: صفت ملکی در سطح خودمانیِ *tum*؛ دقیقاً مثل *mera/meri* با اسمِ مورد نظر مطابقت می‌کند.
    example_gloss:
    - برادرت کجا زندگی می‌کند؟
    - خواهرت کجا زندگی می‌کند؟
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: mera و tumhara با هم
    gloss: '*Mera* و *tumhara* هر دو با واژه‌های مذکر می‌آیند؛ *meri* و *tumhari* هر دو با واژه‌های مؤنث: *mera bhai*/*tumhara bhai*، *meri behan*/*tumhari behan*.'
    note: همان الگوی مطابقت که در درس اول دیدید؛ حالا می‌بینید که درباره‌ی *tumhara* هم صدق می‌کند.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: بزرگ‌تر / بزرگ
    gloss: بزرگ‌تر، بزرگ (مذکر / مؤنث)
    note: 'در فارسی برای برادر یا خواهر بزرگ‌تر از ترکیب «برادر بزرگ‌تر» استفاده می‌کنیم و صفت تغییر نمی‌کند؛ اما در هندی این صفت با جنسِ اسم مطابقت می‌کند: bada bhai، badi behan.'
    example_gloss:
    - برادر بزرگ‌ترم در دهلی زندگی می‌کند.
    - خواهر بزرگ‌ترم در بمبئی زندگی می‌کند.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: کوچک‌تر / کوچک
    gloss: کوچک‌تر، کوچک (مذکر / مؤنث)
    note: مقابل *bada/badi*؛ برای برادر یا خواهر کوچک‌تر.
    example_gloss:
    - برادر کوچک‌ترم الان دانش‌آموز است.
    - خواهر کوچک‌ترم الان دانش‌آموز است.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: مطابقتِ bada/chota
    gloss: '*Bada* و *chota* با واژه‌های مذکر می‌آیند و *badi* و *choti* با واژه‌های مؤنث: *bada bhai*، *badi behan*.'
    note: همان مطابقتِ مذکر و مؤنثِ صفت که قبلاً با *mera/meri* دیدید؛ این بار برای واژه‌هایی که سن را توصیف می‌کنند.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: و، اما، هم
    gloss: و، اما، هم
    note: سه حرف ربط پایه که در گفتگوی پایانیِ این درس دوباره به کار می‌روند.
    example_gloss:
    - برادرم و خواهرم در دهلی زندگی می‌کنند.
    - برادرم در دهلی زندگی می‌کند، اما خواهرم در بمبئی زندگی می‌کند.
    - من هم یک خواهر دارم.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: باشه، بعداً می‌بینمت
    gloss: باشه! بعداً می‌بینیم‌تان.
    note: یک خداحافظی دوستانه که از واژگان خداحافظیِ درس دوم تکرار شده است.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: باشه، به‌زودی می‌بینمت
    gloss: باشه، به‌زودی همدیگر را می‌بینیم!
    note: پاسخ خودمانی به خداحافظیِ بالا، مثل گفتگوهای پایانیِ درس‌های قبل.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: ارجون درباره‌ی خانواده‌ی پریا می‌پرسد
    gloss: ارجون می‌پرسد خانواده‌ی پریا کجا زندگی می‌کنند.
    note: الگوی *parivar kahan rehta hai* را از همین درس دوباره به کار می‌برد.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: پریا پدر و مادر و برادرش را توصیف می‌کند
    gloss: پریا می‌گوید پدر و مادرش در دهلی زندگی می‌کنند و یک برادر بزرگ‌تر هم دارد.
    note: '*mata-pita*، *rehte hain* و *bada bhai bhi hai* را با هم ترکیب می‌کند.'
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: ارجون درباره‌ی پدربزرگ و مادربزرگ او می‌پرسد
    gloss: 'ارجون می‌گوید «آها!» و می‌پرسد: پدربزرگ و مادربزرگت چطور؟'
    note: '*Tumhare* شکل احترام‌آمیزِ *tumhara* است که برای بزرگ‌ترها به کار می‌رود، دقیقاً مثل *mere* برای *mera* (یادداشت احترام در همین درس).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: پریا هر دو جفت پدربزرگ و مادربزرگش را توصیف می‌کند
    gloss: پریا می‌گوید پدربزرگ و مادربزرگ پدری‌اش در دهلی زندگی می‌کنند، اما پدربزرگ و مادربزرگ مادری‌اش در بمبئی.
    note: با *lekin* شهرِ دو جفت پدربزرگ و مادربزرگ را در تقابل می‌گذارد و تفاوت dada-dadi و nana-nani را تقویت می‌کند.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: ارجون از خواهر خودش می‌گوید
    gloss: ارجون می‌گوید او هم یک خواهر کوچک‌تر دارد.
    note: '*bhi* و *choti behan* را دوباره به کار می‌برد.'
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا می‌گوید باشه، بعداً می‌بینیم‌تان.
    note: عبارت پایانیِ همین درس را دوباره به کار می‌برد.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: ارجون جواب می‌دهد
    gloss: ارجون موافقت می‌کند و می‌گوید به‌زودی همدیگر را می‌بینیم.
    note: عبارت پاسخِ همین درس را دوباره به کار می‌برد.
