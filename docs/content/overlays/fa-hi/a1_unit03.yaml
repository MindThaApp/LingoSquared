teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: امروز
    gloss: امروز
    note: کلمه‌ای که تقریباً در همه‌ی جمله‌های این درس دوباره به کارش می‌برید.
    example_gloss: امروز هوا خوب است.
  hi.a1.unit03.lesson01.teach.somvar:
    title: دوشنبه
    gloss: دوشنبه
    note: از سوم (सोम، ماه) گرفته شده؛ در فارسی هم «دوشنبه» نام خاصی دارد، اما در هندی نام این روز یعنی «روزِ ماه».
    example_gloss: کلاس یوگا دوشنبه است.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: سه‌شنبه
    gloss: سه‌شنبه
    note: از مंगल (مریخ) گرفته شده؛ بیشتر نام روزهای هفته در هندی همین الگو را دارند.
    example_gloss: امروز سه‌شنبه است.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: چهارشنبه
    gloss: چهارشنبه
    note: از बुध (عطارد) گرفته شده.
    example_gloss: امروز چهارشنبه است.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: پنجشنبه
    gloss: پنجشنبه
    note: از गुरु (مشتری) گرفته شده.
    example_gloss: امروز پنجشنبه است.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: جمعه
    gloss: جمعه
    note: از शुक्र (زهره) گرفته شده.
    example_gloss: جمعه کلاس یوگا نیست.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: شنبه
    gloss: شنبه
    note: از शनि (کیوان/زحل) گرفته شده.
    example_gloss: امروز شنبه است.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: یکشنبه
    gloss: یکشنبه
    note: از रवि گرفته شده که نامی سانسکریت برای خورشید است؛ یعنی «روزِ خورشید».
    example_gloss: امروز یکشنبه است.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: پرسیدن اینکه امروز چه روزی است
    gloss: امروز چه روزی است؟
    note: '*Kaun sa* («کدام») با اسم مذکر *din* («روز») هماهنگ است؛ شکل مؤنثش، *kaun si*، را بعداً با اسم‌های مؤنث می‌بینید.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: گفتن اینکه رویدادی در چه روزی است
    gloss: کلاس یوگا دوشنبه است.
    note: '*Ko* بعد از نام روز یعنی «در/به» (مثل «دوشنبه‌ها/در روز دوشنبه»)؛ *somvar ko* یعنی «دوشنبه»، و این الگو برای همه‌ی روزهای هفته یکسان است.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: گفتن اینکه رویدادی در فلان روز نیست
    gloss: جمعه کلاس یوگا نیست.
    note: Nahin جمله را منفی می‌کند؛ ko همچنان روز را مشخص می‌کند و اینجا برای تأکید اول جمله آمده است.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: ژانویه، فوریه، مارس
    gloss: ژانویه، فوریه، مارس
    note: نام ماه‌های هندی بیشتر وام‌گرفته‌اند و وقتی الگویشان را بدانید راحت شناخته می‌شوند؛ اینجا دستور تازه‌ای نیست، فقط واژگان است.
    example_gloss:
    - تولدم در ژانویه است.
    - تعطیلی بعدی در فوریه است.
    - تولدم در ماه مارس است.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: آوریل، مه، ژوئن
    gloss: آوریل، مه، ژوئن
    note: همان الگوی آشنای سه ماه اول.
    example_gloss:
    - تعطیلی بعدی در آوریل است.
    - تولدم در مه است.
    - تعطیلی بعدی در ژوئن است.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: ژوئیه، اوت، سپتامبر
    gloss: ژوئیه، اوت، سپتامبر
    note: Sitambar اینجا با انوسوارا (सितंबर) نوشته شده؛ املای با m نیم‌حرف (सितम्बर) هم رایج و به همان اندازه درست است.
    example_gloss:
    - تولدم در ژوئیه است.
    - تعطیلی بعدی در اوت است.
    - تولدم در سپتامبر است.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: اکتبر، نوامبر، دسامبر
    gloss: اکتبر، نوامبر، دسامبر
    note: Navambar و disambar هم مثل sitambar با انوسوارا نوشته شده‌اند؛ नवम्बर و दिसम्बर (با m نیم‌حرف) هم رایج و به همان اندازه درست‌اند.
    example_gloss:
    - تعطیلی بعدی در اکتبر است.
    - تولد من در نوامبر است.
    - تعطیلی بعدی در دسامبر است.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: تاریخ
    gloss: تاریخ
    note: '*Tareekh* اسم مؤنث است؛ پس کلمه‌ی پرسشی‌اش شکل مؤنث می‌گیرد (*kitni tareekh*، نه *kitna tareekh*)، همان الگوی هماهنگی‌ای که در درس دوم با *keemat* و *umra* یاد گرفتید.'
    example_gloss: امروز سوم است.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: در (با نام ماه)
    gloss: در — همراه نام ماه
    note: '*Mein* برای ماه همان کاری را می‌کند که *ko* برای روز می‌کند: *janvari mein* یعنی «در ژانویه»، و هرگز *janvari ko* نمی‌گویند.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: پرسیدن تاریخ
    gloss: امروز چندم است؟
    note: تحت‌اللفظی «تاریخ امروز چندتاست» — kitni با اسم مؤنث tareekh هماهنگ است.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: گفتن تاریخ فقط با عدد
    gloss: امروز سوم است.
    note: در هندی تاریخ با عدد اصلی ساده (*teen*، «سه») گفته می‌شود، نه با عدد ترتیبی؛ «واژه‌ی مخصوص تاریخ» جداگانه‌ای برای یادگرفتن نیست، فقط همان عددهایی که می‌دانید.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: گفتن تاریخ همراه با ماه
    gloss: امروز سوم ژانویه است.
    note: همان الگوی عدد اصلی، این بار با نام ماه بعد از آن.
  hi.a1.unit03.lesson03.teach.kab:
    title: کی / چه موقع
    gloss: کی / چه وقت
    note: یک کلمه‌ی پرسشی ساده و پرکاربرد.
    example_gloss: کلاس بعدی کی است؟
  hi.a1.unit03.lesson03.teach.agli:
    title: بعدی
    gloss: بعدی
    note: '*Agli* شکل مؤنث است؛ *class* (क्लास) در هندی روزمره مؤنث حساب می‌شود، پس *agli* می‌گیرد، نه *agla* مذکر.'
    example_gloss: کلاس بعدی سه‌شنبه است.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: ده
    gloss: ده
    note: از درس دوم تکرار شده؛ اینجا برای یک تاریخ واقعی لازم است.
    example_gloss: کلاس بعدی دهم است.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: تولد
    gloss: تولد
    note: اسم مذکر است — mera janmadin، نه meri janmadin.
    example_gloss: تولدم در دسامبر است.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: پرسیدن تولد کسی، غیررسمی
    gloss: تولدت کی است؟ (غیررسمی)
    note: Tumhara با janmadin مذکر هماهنگ است.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: گفتن تاریخ تولد خودتان
    gloss: تولد من در ژانویه است.
    note: پاسخ کامل و طبیعی به Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: پرسیدن اینکه کلاس بعدی کی است
    gloss: کلاس بعدی کی است؟
    note: agli (مؤنث، هماهنگ با «class») و kab را با هم می‌آورد.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: گفتن کامل روز و تاریخ
    gloss: کلاس بعدی سه‌شنبه، دهم مارس است.
    note: 'روز هفته و تاریخ با هم گفته می‌شوند: اول روز، بعد عدد تاریخ و ماه.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: آرجون درباره‌ی کلاس بعدی می‌پرسد
    gloss: آرجون می‌پرسد کلاس یوگای بعدی کی است.
    note: همان سؤال همین درس است، فقط برای وضوح yog به آن اضافه شده.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: پریا روز و تاریخ را می‌گوید
    gloss: پریا می‌گوید کلاس بعدی سه‌شنبه، دهم مارس است.
    note: دقیقاً همان جمله‌ی روز و تاریخ همین درس است.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: آرجون از او تشکر می‌کند
    gloss: آرجون می‌گوید باشه، ممنون.
    note: Theek hai و shukriya هر دو از واژگان درس اول هستند.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید قابلی ندارد.
    note: Koi baat nahin راه خیلی رایج و طبیعی برای گفتن «قابلی نداره» یا «مشکلی نیست» است.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: آرجون تولد پریا را می‌پرسد
    gloss: آرجون می‌پرسد تولد پریا کی است.
    note: دقیقاً همان سؤال غیررسمی تولد همین درس است.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید تولدش در ژانویه است.
    note: دقیقاً همان جمله‌ی پاسخ همین درس است.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: آرجون واکنش نشان می‌دهد و تولد خودش را می‌گوید
    gloss: آرجون با خوشحالی واکنش نشان می‌دهد، بعد می‌گوید تولد خودش در دسامبر است.
    note: Accha از واژگان درس اول است؛ دسامبر هم قبلاً در درس دوم همین واحد آمده بود.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: پریا گفت‌وگو را تمام می‌کند
    gloss: پریا موافقت می‌کند و خداحافظی دوستانه‌ای می‌کند.
    note: Theek hai و phir milte hain هر دو از واژگان خداحافظی درس اول هستند.
