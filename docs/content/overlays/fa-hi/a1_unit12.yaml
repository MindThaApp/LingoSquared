teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'مرور: مشغول'
    gloss: مشغول
    note: مرور سریع صفتی از درس ۱۱ -- این درس برای تمرین گذشتهٔ فعل ربطی جدید دوباره از آن استفاده می‌کند.
    example_gloss: ارجن مشغوله.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: بود (مذکر / مؤنث)
    gloss: بود
    note: گذشتهٔ فعل ربطی (است/هستم/هستی)، مقابل مستقیم hai/hoon/hain. «Tha» با فاعل مذکر می‌آید و «thi» با فاعل مؤنث.
    example_gloss:
    - ارجن دیروز مشغول بود.
    - پریا دیروز مشغول بود.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha در برابر thi
    gloss: '«Tha» با فاعل مذکر می‌آید و «thi» با فاعل مؤنث -- جایشان همان جای «hai» است، ولی برخلاف «hai» با جنسیت عوض می‌شوند: ارجن مشغول است، ارجن مشغول بود، پریا مشغول بود.'
    note: الگوی مطابقت جنسیت را صریح می‌گوید و صرف آشنای فعل ربطی را به گذشته گسترش می‌دهد.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'مرور: دیروز'
    gloss: دیروز
    note: اولین بار در درس ۴ آمد، جایی که «kal» هم «فردا» بود و هم «دیروز» و فقط زمان فعل فرقشان را مشخص می‌کرد. این اولین درسی است که از معنی گذشتهٔ آن («دیروز») استفاده می‌کند.
    example_gloss: دیروز شنبه بود.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: چطور (مذکر)
    gloss: چطور
    note: الگویی را کامل می‌کند که دو سوم آن را از قبل دارید -- «kaise» و «kaisi» (از «حالتان چطوره؟» در درس ۱) قبلاً آمده بود؛ این فقط شکل مذکر مفرد جاافتاده است، برای فاعل‌هایی مثل «din» (روز).
    example_gloss: روز چطور بود؟
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: دیروز چطور بود؟
    gloss: دیروز چطور بود؟
    note: سؤال اصلی و تکرارشوندهٔ این درس که همهٔ کلمه‌های تا اینجا را کنار هم می‌گذارد.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: روز خوبی بود.
    gloss: روز خوبی بود.
    note: پاسخ آمادهٔ «دیروز چطور بود؟» با شکل مذکر (چون din مذکر است).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: فیلم خوب بود.
    gloss: فیلم خوب بود.
    note: همین الگو با فاعل مؤنث (film مؤنث است)، با اشاره به واژگان درس ۱۱.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '«Kaisa» با فاعل مذکر مفرد می‌آید (روز چطور بود؟)، «kaisi» با مؤنث (چای چطور بود؟)، و «kaise» با aap/tum وقتی از یک مرد می‌پرسید (حالتان چطوره؟؛ از یک زن: «aap kaisi hain?») -- هر سه شکل‌های یک کلمه‌اند.'
    note: برای اولین بار الگوی کامل را کنار هم می‌گذارد -- kaise/kaisi از درس ۱ آشنا بودند و kaisa اضافهٔ همین درس است.
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'مرور: من، ارجن، پریا'
    gloss: من، ارجن، پریا
    note: مرور سریع پیش از مثال‌های گذشتهٔ اول‌شخص در این درس.
    example_gloss:
    - من ارجن هستم.
    - من پریا هستم.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: رفت (مذکر / مؤنث)
    gloss: رفت
    note: گذشتهٔ «jaana» (رفتن)، با همان ریشه‌ای که در درس ۹ به‌صورت امر «jao» (برو!) آمد. مثل «tha»/«thi» با جنسیت فاعل مطابقت دارد.
    example_gloss:
    - ارجن به بازار رفت.
    - پریا به خانه رفت.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = گذشتهٔ jaana
    gloss: «Gaya»/«gai» گذشتهٔ «jaana» (رفتن، jao در درس ۹) است و با جنسیت فاعل عوض می‌شود -- درست مثل «tha»/«thi».
    note: گذشتهٔ جدید را صریحاً به ریشهٔ امر آشنا وصل می‌کند.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'مرور: بازار، خانه'
    gloss: بازار، خانه
    note: مرور سریع دو کلمهٔ مکان از درس ۷ و ۸ که برای گفتن اینکه کسی کجا رفت لازم‌اند.
    example_gloss:
    - اینجا بازار است.
    - اینجا خانه است.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: ملاقات کرد (مذکر / مؤنث)
    gloss: ملاقات کرد
    note: گذشتهٔ «milna» (ملاقات کردن)، با همان ریشه‌ای که در «milte hain» عادتی درس‌های ۱/۴/۱۰/۱۱ آمد. با جنسیت فاعل مطابقت دارد.
    example_gloss:
    - ارجون با پریا ملاقات کرد.
    - پریا با ارجون ملاقات کرد.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: '''se'' اینجا یعنی «با»، نه «از»'
    gloss: اینجا 'se' به معنی «از» نیست؛ 'X se milna' یعنی «با X ملاقات کردن»، در حالی که در 'main Bharat se hoon' همین کلمهٔ 'se' به معنی «از» بود.
    note: این یک کلمهٔ آشناست که دو کاربرد واقعی دارد و اینجا صریح توضیح داده شده است.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'مرور: آنجا'
    gloss: آنجا
    note: مروری سریع از درس ۸ و ۹؛ اینجا برای گفتنِ محل ملاقات استفاده می‌شود.
    example_gloss: مدرسه آنجاست.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: دیروز به بازار رفتم.
    gloss: دیروز به بازار رفتم.
    note: گذشتهٔ جدیدِ این درس را با 'kal' از درس اول ترکیب می‌کند.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: من آنجا پریا را دیدم.
    gloss: من آنجا پریا را دیدم.
    note: '''mila'' از این درس را با ''se'' («با») و ''wahan'' (آنجا) ترکیب می‌کند.'
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'مرور: با هم'
    gloss: با هم
    note: مروری سریع از درس ۱۱.
    example_gloss: ما با هم چای می‌خوریم.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'مرور: چای، مغازه، غذا'
    gloss: چای، مغازه، غذا
    note: مروری سریع از سه اسم در درس‌های ۶ و ۷ که در گفتگو و یادداشتِ این درس لازم‌اند.
    example_gloss:
    - چای خوب است.
    - مغازه خوب است.
    - غذا خوب است.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'مرور: «مالِ» (ka)، چطور (مؤنث)'
    gloss: مالِ / ـِ (ka)، چطور (مؤنث، kaisi)
    note: '''ka'' (از ''kitne ka'' قبلی و ''raat ka khana'' در درس ۱۰) و ''kaisi'' (قبلاً آمده) اینجا دوباره به کار رفته‌اند و دستور تازه‌ای نیستند.'
    example_gloss:
    - دیروز روز خوبی بود.
    - چایی‌خانه چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: ارجون می‌پرسد دیروز چطور بود
    gloss: پریا، دیروز چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید خوب بود
    gloss: خیلی خوب بود! همدیگر را دیدیم.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: ارجون از بازار می‌گوید
    gloss: آره! من اول هم به بازار رفتم.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: پریا دربارهٔ بازار می‌پرسد
    gloss: جالب! توی بازار چی بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: ارجون جواب می‌دهد
    gloss: غذا خوب بود.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: پریا دربارهٔ چایی‌خانه می‌پرسد
    gloss: جالب! و چایی‌خانه چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: ارجون جواب می‌دهد
    gloss: چایی‌خانه خیلی خوب بود.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: پریا صحبت را تمام می‌کند
    gloss: خوبه! پس فردا دوباره همدیگر را ببینیم؟
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: tum/hum/ve شکلِ جمع را در گذشته می‌گیرند
    gloss: '''tum''، ''hum'' و ''ve'' در گذشته همان شکلی را می‌گیرند که در حال با ''-te'' می‌گیرند: ''«the»'' (به جای ''tha'')، ''gaye'' (به جای ''gaya'')، ''mile'' (به جای ''mila'') -- مثل ''hum milte hain'' که می‌شود ''hum mile''.'
    note: الگوی کامل‌تر برای درک بهتر آمده است، اما در تمرین‌های این درس فقط 'mile' کار می‌شود؛ '«the»' و 'gaye' فقط برای شناختن‌اند و تنها در همین توضیح دیده می‌شوند.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: یادداشتِ پریا
    gloss: ارجون، دیروز خیلی خوب بود. غذا خوب بود و چایی‌خانه هم خوب بود. - پریا
    note: یادداشتی کوتاه که همان چیزهایی را که در گفتگو آمد دوباره می‌گوید، بدون واژهٔ تازه.
    glosses:
      कल: دیروز
      दिन: روز
      अच्छा: خوب (مذکر)
      था: بود (مذکر)
      खाना: غذا
      दुकान: مغازه
      अच्छी: خوب (مؤنث)
      थी: بود (مؤنث)
