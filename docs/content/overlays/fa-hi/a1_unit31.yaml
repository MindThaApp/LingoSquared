teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*लंबा* و *छोटा* قد را توصیف می‌کنند و معمولاً با *कद* («قد») می‌آیند: *नेहा का कद लंबा है*. برای اسم مذکر به *-ा* و برای اسم مؤنث به *-ी* ختم می‌شوند.'
    example_gloss:
    - نیها قدبلند است.
    - ویکرام کوتاه‌قد است.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*बूढ़ा* و *जवान* توصیف می‌کنند که کسی چند ساله به نظر می‌رسد، بدون ذکر عدد.'
    example_gloss:
    - پدربزرگ مسنه.
    - آرجون جوان است.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र و बूढ़ा
    gloss: چند سال دارید؟ پدربزرگ پیر است.
    note: برای پرسیدن سن دقیق، هندی از *उम्र* («سن») استفاده می‌کند، ولی *बूढ़ा* فرد سالخورده را بدون ذکر عدد توصیف می‌کند.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: نیها قدبلند است و ویکرام کوتاه‌قد
    gloss: نیها قدبلند است و ویکرام کوتاه‌قد.
    note: '*और* («و») دو توصیف را به هم وصل می‌کند و هر *का कद* با *कद* که مذکر است مطابقت دارد.'
  hi.a1.unit31.lesson02.teach.bal:
    title: مو
    gloss: مو
    note: '*बाल* («مو») در هندی مذکر و جمع است، برای همین صفت‌هایش به *-े* ختم می‌شوند: *लंबे बाल*.'
    example_gloss: آرجون موهای کوتاه و مشکی دارد.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: بلوند، قهوه‌ای و سفید
    gloss: بلوند / قهوه‌ای / سفید
    note: 'سه رنگ مو: *सुनहरे*، *भूरे* و *सफ़ेद*؛ پیش از *बाल* به *-े* ختم می‌شوند.'
    example_gloss:
    - پریا موهای بلوند دارد.
    - ویکرام موهای قهوه‌ای دارد.
    - پدربزرگ موهای سفید دارد.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*लंबे* («بلند») و *छोटे* («کوتاه») مو را توصیف می‌کنند و چون *बाल* جمع است به *-े* ختم می‌شوند.'
    example_gloss:
    - نیها موهای بلند دارد.
    - ویکرام موهای کوتاه دارد.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: صفت‌ها پیش از बाल
    gloss: موی بلند، موی کوتاه، موی بلوند، موی قهوه‌ای، موی سفید، موی مشکی.
    note: '*बाल* مذکر جمع است، پس صفتِ پیش از آن به *-े* ختم می‌شود: *लंबे बाल*، *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: او (مرد یا زن)'
    gloss: موهای او بلند است.
    note: '*उसके* هم «مال او (مرد)» و هم «مال او (زن)» معنی می‌دهد؛ در فارسی هم «او» جنسیت ندارد و فقط از متن می‌فهمید کدام مراد است. اینجا با *बाल* که جمع است مطابقت دارد.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: آرجون موهای کوتاه و مشکی دارد
    gloss: آرجون موهای کوتاه و مشکی دارد.
    note: '*काले* دوباره آمده، این بار برای مو، و چون *बाल* جمع است به *-े* ختم می‌شود.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: پریا موهای بلند و بلوند دارد
    gloss: پریا موهای بلند و بلوند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*आँखें* («چشم‌ها») اسم مؤنث جمع است؛ مفردش *आँख* است.'
    example_gloss: آرجون چشم‌های قهوه‌ای دارد.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: 'سه رنگ چشم: *नीला*، *भूरा* و *हरा*؛ پیش از *आँखें* که مؤنث است به *नीली*، *भूरी* و *हरी* تبدیل می‌شوند.'
    example_gloss:
    - پریا چشم‌های آبی دارد.
    - ویکرام چشم‌های قهوه‌ای دارد.
    - نیها چشم‌های سبز دارد.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: صفت‌ها پیش از आँखें
    gloss: چشم‌های آبی، چشم‌های قهوه‌ای، چشم‌های سبز.
    note: '*आँखें* مؤنث است، پس صفتِ پیش از آن به *-ी* ختم می‌شود: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: پریا چه شکلی است؟
    gloss: پریا چه شکلی است؟
    note: '*कैसी दिखती है?* («چه شکلی است؟») پرسش اصلی است: برای یک زن *कैसी* و *दिखती* مؤنث‌اند و برای یک مرد *कैसा* و *दिखता* مذکر.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: پریا موهای بلند و بلوند و چشم‌های آبی دارد
    gloss: پریا موهای بلند و بلوند و چشم‌های آبی دارد.
    note: 'یک پاسخ نمونه: مو و چشم با *और* به هم وصل شده‌اند. صاحب‌شان برای *बाल* که جمع است *के* می‌گیرد و برای *आँखें* که مؤنث است *की*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: پریا نینا را معرفی می‌کند
    gloss: 'پریا: یک دختر تازه به کافهٔ زبان می‌آید. اسمش نینا است.'
    note: '*आ रही है* («دارد می‌آید») کسی تازه را معرفی می‌کند و *उसका नाम ... है* اسم را می‌گوید.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: آرجون می‌پرسد او چه شکلی است
    gloss: 'آرجون: باشه! چه شکلی است؟'
    note: '*वह देखने में कैसी है?* یعنی «از نظر ظاهر چه جوری است؟»؛ *वह* هم «او (مرد)» و هم «او (زن)» معنی می‌دهد.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: پریا قد و موهای نینا را توصیف می‌کند
    gloss: 'پریا: کوتاه‌قد است و موهای کوتاه و بلوند دارد.'
    note: 'این جمله قد و مو را به هم وصل می‌کند: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: آرجون دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'آرجون: چشم‌هایش چطور؟'
    note: '*उसकी आँखें* یعنی «چشم‌های او»؛ *उसकी* مؤنث است تا با *आँखें* مطابقت داشته باشد.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: پریا چشم‌های نینا را توصیف می‌کند
    gloss: 'پریا: چشم‌هایش سبز است.'
    note: '*हरी* به *-ी* ختم می‌شود چون *आँखें* مؤنث است.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: آرجون او را خواهد شناخت
    gloss: 'آرجون: مرسی! پس من او را می‌شناسم.'
    note: '*पहचान लूँगा* («خواهم شناخت») آیندهٔ *पहचानना* است و *उसे* یعنی «او را».'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: مقایسهٔ ویکرام و نیها
    gloss: ویکرام و نیها برادر و خواهرند، ولی شکل‌شان فرق دارد. ویکرام کوتاه‌قد است و موهای کوتاه و قهوه‌ای و چشم‌های قهوه‌ای دارد. نیها از ویکرام قدبلندتر است و موهای بلند و قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      भाई: برادر
      बहन: خواهر
      दिखते: به نظر رسیدن
      अलग: متفاوت
      छोटा: کوتاه‌قد
      छोटे: کوتاه‌قد
      भूरे: قهوه‌ای
      बाल: مو
      भूरी: قهوه‌ای
      आँखें: چشم‌ها
      लंबी: قدبلندتر
      लंबे: بلند
      हरी: سبز
      कैसे: چطور (مثل «چه شکلی هستید»)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: مقایسه با से
    gloss: ویکرام از نیها کوتاه‌تر است.
    note: '*से* اینجا یعنی «از» (در مقایسه) و بعد از کسی می‌آید که با او مقایسه می‌کنید: *नेहा से छोटा*؛ صفت درست پیش از فعل می‌آید.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: موهای نیها از ویکرام بلندتر است
    gloss: موهای نیها از موهای ویکرام بلندتر است.
    note: '*लंबे* با *बाल* که جمع است مطابقت دارد و *विक्रम से* مقایسه را می‌رساند.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: '*मेरे बाल छोटे और भूरे हैं* («موهای من کوتاه و قهوه‌ای است») جملهٔ نمونه برای توصیف خودتان است؛ *मेरे* با *बाल* که جمع است مطابقت دارد.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: آرجون نینا را می‌بیند
    gloss: 'آرجون: ببین، اون نینا است؟ موهای کوتاه و بلوند و چشم‌های سبز دارد.'
    note: '*देखो* («نگاه کن») شکل غیررسمی فعل امر است که به دوست می‌گویید.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: پریا تأیید می‌کند
    gloss: 'پریا: آره، اون نیناست!'
    note: یک تأیید کوتاه و طبیعی.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: نینا به آرجون سلام می‌کند
    gloss: 'نینا: سلام، شما آرجون هستید؟'
    note: '*क्या तुम अर्जुन हो?* یک سؤال ساده و غیررسمی است برای کسی که هم‌سن و سال خودتان است.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: آرجون به نینا جواب سلام می‌دهد
    gloss: 'آرجون: بله! از آشنایی با شما خوشحالم، نینا.'
    note: '*तुमसे मिलकर अच्छा लगा* عبارت معمول برای اولین دیدار است؛ در هندی این حس «برای» شما پیش می‌آید، برای همین کلمه‌ای برای «من» لازم نیست.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: 'پایان گفت‌وگو: آرجون نینا را از توصیفی که پریا قبلاً داده بود شناخت.'
