teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*करूँगा* آیندهٔ *करना* است و هندی برای «زنگ می‌زنم» به‌عنوان قول یا قصد از آن استفاده می‌کند. کسی که بهش زنگ می‌زنید *तुम्हें* («به تو») می‌گیرد.'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: جواب دادن به تلفن
    gloss: الو، پریا هستم.
    note: پشت تلفن می‌گویید *मैं ... बोल रही हूँ* («دارم صحبت می‌کنم»)؛ *रही* مؤنث است چون پریا زن است.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: آرجون هم همین‌طور جواب می‌دهد
    gloss: الو، آرجون هستم.
    note: 'همین الگو با *रहा* مذکر: *मैं अर्जुन बोल रहा हूँ*، چون آرجون مرد است.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*किससे* («با چه کسی») از *कौन* («کی») به‌اضافهٔ *से* ساخته می‌شود و *से* کسی را که با او صحبت می‌کنید نشان می‌دهد.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: معرفی رسمی خود
    gloss: شما با پریا صحبت می‌کنید.
    note: '*आप* «شما»ی محترمانه برای غریبه است. در *प्रिया से बात कर रहे हैं* بعد از اسم *से* می‌آید و *हैं* با *आप* می‌آید.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*सकते हो* یعنی «می‌تونی» و بعد از فعل اصلی می‌آید: *कह सकते हो*. *क्या* در ابتدای جمله آن را سؤالی می‌کند.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*मत बोलो* با *तुम* همان «حرف نزن» دوستانه است و *इतना तेज़* یعنی «اینقدر تند».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: 'هندی می‌گوید «صدای تو نمی‌آید»: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. گوینده *मुझे* می‌گیرد و صدا نهاد جمله است.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: پیامک
    gloss: پیامک
    note: '*मैसेज* وام‌واژه‌ای رایج و مذکر است: *एक मैसेज*، *यह मैसेज ... का है*.'
    example_gloss: این پیامک از پریاست.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: برایتان پیامک می‌فرستم.
    note: 'ترتیب این است: شخص، بعد چیز، بعد فعل: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* یعنی «فرستادن».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: '*वापस फ़ोन करना* یعنی «دوباره زنگ زدن» و *वापस* قبل از *फ़ोन करना* می‌آید؛ *बाद में* یعنی «بعداً».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: خواندن گفتگوی پیامکی
    gloss: 'آرجون: سلام پریا، می‌تونی به من زنگ بزنی؟ باید یه چیز مهمی بهت بگم. پریا: آره، حتماً، پنج دقیقهٔ دیگه دوباره بهت زنگ می‌زنم.'
    note: دقت کنید آرجون چه چیزی می‌خواهد، چرا، و پریا کی می‌گوید دوباره زنگ می‌زند.
    glosses:
      हाय: سلام
      सकती: می‌تونی
      फ़ोन: زنگ زدن
      ज़रूरी: 'مهم (مثلاً: چیز مهمی برای گفتن)'
      कुछ: یه چیزی
      बतानी: گفتن
      ज़रूर: حتماً
      करूँगी: زنگ می‌زند
      पाँच: پنج
      मिनट: دقیقه
      वापस: پس دادن
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: آرجون تلفن را جواب می‌دهد
    gloss: 'آرجون: الو، آرجون هستم.'
    note: کسی که جواب می‌دهد اول اسم خودش را با *मैं ... बोल रहा हूँ* می‌گوید، اینجا با *रहा* مذکر.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: پریا خودش را معرفی می‌کند
    gloss: 'پریا: سلام آرجون، پریا هستم. آرجون: چه خوب که زنگ زدی!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* یعنی «چه خوب که زنگ زدی»؛ *तुमने ... किया* گذشته با *ने* است.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: پریا دربارهٔ شیفت می‌پرسد
    gloss: 'پریا: اولین شیفتت چطور بود؟'
    note: '*कैसी रही* یعنی «چطور بود»؛ *कैसी* مؤنث است چون *शिफ़्ट* مؤنث است.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: آرجون خبر خوب می‌دهد
    gloss: 'آرجون: خیلی خوب بود، بهتر از چیزی که فکر می‌کردم.'
    note: '*अच्छी रही* («خوب گذشت») با *शिफ़्ट* مؤنث جور می‌شود و *जितना मैंने सोचा था उससे भी बेहतर* یعنی «حتی بهتر از چیزی که فکر می‌کردم».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था و थी: «بود»'
    gloss: او (مرد) عصبی بود، او (زن) خوشحال بود.
    note: '*था* برای نهاد مذکر و *थी* برای نهاد مؤنث «بود» است؛ پایانه با کسی یا چیزی که توصیف می‌شود جور می‌شود.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: پریا افتخار می‌کند
    gloss: 'پریا: شنیدنش خیلی خوب بود! بهت افتخار می‌کنم.'
    note: '*तुम पर गर्व है* («افتخار روی توست») از *पर* استفاده می‌کند و کسی که افتخار می‌کند *मुझे* می‌گیرد.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: آرجون تحت تأثیر قرار می‌گیرد
    gloss: 'آرجون: خیلی ممنون، این برام خیلی ارزش داره.'
    note: '*मेरे लिए* یعنی «برای من» و *इसका बहुत मतलब है* یعنی «برایش خیلی ارزش دارد».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*उसकी* یعنی «مال او» (برای مرد و زن یکی است) و با *शिफ़्ट* مؤنث جور می‌شود.'
