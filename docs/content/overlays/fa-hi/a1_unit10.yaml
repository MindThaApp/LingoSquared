teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'مرور: ساعت، صبح، ظهر، عصر، شب، در'
    gloss: ساعت، صبح، بعدازظهر، عصر، شب، در (برای زمان‌های کلی)
    note: مرور سریع کلمات زمان از درس ۴ -- این درس زیاد از آن‌ها استفاده می‌کند.
    example_gloss:
    - الان ساعت ۸ صبحه.
    - شب‌ها کلاس نیست.
  hi.a1.unit10.lesson01.teach.uthna:
    title: بلند می‌شم
    gloss: بلند می‌شم (گوینده مرد / گوینده زن)
    note: اولین فعل حال عادتیِ این درس -- الگوی -ta/-tee که در درس ۵ دیدید (rahta hai/rahtee hai) با hoon به اول شخص می‌رسد.
    example_gloss:
    - من ساعت ۷ صبح بلند می‌شم.
    - من ساعت ۶ صبح بلند می‌شم.
  hi.a1.unit10.lesson01.teach.roz:
    title: هر روز
    gloss: هر روز
    note: قید تازه‌ای برای توصیف کارهای هر روز.
    example_gloss: هر روز صبح بلند می‌شم.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: صبحانه می‌خورم
    gloss: صبحانه می‌خورم (گوینده مرد / گوینده زن)
    note: '''Nashta'' (صبحانه) با ''karta/kartee hoon'' (می‌کنم) ترکیب می‌شود.'
    example_gloss:
    - صبح‌ها صبحانه می‌خورم.
    - صبح‌ها صبحانه می‌خورم.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: می‌رم سر کار
    gloss: می‌رم سر کار (گوینده مرد / گوینده زن)
    note: '''Kaam par jaana'' (رفتن سر کار) به کلمه‌ی ''par'' نیاز دارد -- یک عبارت ثابت؛ برخلاف ''school jaana'' که بعداً در همین درس می‌آید و کلمه‌ی اضافه نمی‌خواهد.'
    example_gloss:
    - بعد می‌رم سر کار.
    - بعد می‌رم سر کار.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: الگوی حال عادتی
    gloss: 'برای گفتن کارهای هر روز، فعل -ta/-tee/-te می‌گیرد و بسته به فاعل hoon/ho/hai/hain اضافه می‌شود: من بلند می‌شم (مرد/زن) ''hoon''، تو بلند می‌شی ''ho''، او بلند می‌شه ''hai''، آن‌ها بلند می‌شن ''hain''.'
    note: کل الگو از ابتدا گفته می‌شود تا تمرین‌های این درس از شما نخواهند شکلِ آموزش‌ندیده‌ای را حدس بزنید.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: صبح من، قدم‌به‌قدم
    gloss: هر روز صبح ساعت ۷ بلند می‌شم، بعد صبحانه می‌خورم، بعد می‌رم سر کار.
    note: سه فعل روزمره‌ی این درس را در یک جمله‌ی پشت‌سرهم و طبیعی کنار هم می‌آورد.
  hi.a1.unit10.lesson02.teach.sona:
    title: می‌خوابم
    gloss: می‌خوابم (گوینده مرد / گوینده زن)
    note: همان الگوی -ta/-tee + hoon برای یک فعل تازه.
    example_gloss:
    - ساعت ۱۱ شب می‌خوابم.
    - ساعت ۱۰ شب می‌خوابم.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: می‌رم مدرسه
    gloss: می‌رم مدرسه (گوینده مرد / گوینده زن)
    note: برخلاف 'kaam par jaana'، قبل از 'jaana' در 'school jaana' کلمه‌ی اضافه‌ای لازم نیست.
    example_gloss:
    - هر روز صبح ساعت ۸ می‌رم مدرسه.
    - هر روز صبح ساعت ۸ می‌رم مدرسه.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'شکل tum: -te/-tee + ho'
    gloss: 'با ''tum'' (تو، غیررسمی) فعل -te/-tee و ''ho'' می‌گیرد: بلند می‌شی (از مرد می‌پرسید) / بلند می‌شی (از زن می‌پرسید)، می‌خوابی (از مرد می‌پرسید) / می‌خوابی (از زن می‌پرسید).'
    note: بخش دوم‌شخصِ همان الگویی که در درس ۱ معرفی شد.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: فعل شکل tum با جنسیت چه کسی مطابقت می‌کند؟
    gloss: 'فعل شکل tum با جنسیت کسی که از او می‌پرسید مطابقت دارد، نه گوینده -- از پریا: ''کی بلند می‌شی؟'' (شکل مؤنث)؛ از آرجون: ''کی بلند می‌شی؟'' (شکل مذکر).'
    note: نکته‌ای که راحت از دست می‌رود؛ با همه‌ی جمله‌های شکل tum در گفتگوی درس ۳ بررسی شده است.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: کی بلند می‌شی؟
    gloss: کی بلند می‌شی؟ (از مرد می‌پرسید)
    note: یک سؤال آماده با شکل tumِ تازه‌ی این درس.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: اول بلند می‌شم، بعد صبحانه می‌خورم
    gloss: اول بلند می‌شم، بعد صبحانه می‌خورم.
    note: '''Pahle''/''phir'' (اول/بعد) از ترتیب‌دادن مسیر در درس ۹ را این بار برای ترتیب کارهای روزمره به کار می‌برد.'
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par در برابر school
    gloss: '''Kaam par jaana'' (رفتن سر کار) ''par'' لازم دارد، ولی ''school jaana'' (رفتن به مدرسه) کلمه‌ی اضافه نمی‌خواهد -- هر دو درست و رایج‌اند.'
    note: یک تفاوت اصطلاحیِ واقعی، نه یک قاعده‌ی کلی با یک استثنا.
