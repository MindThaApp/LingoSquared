    note: '''Raat'' (شب)، ''ka'' (مالکیت) و ''khana'' (غذا) را که قبلاً یاد گرفته‌اید دوباره به کار می‌برد.'
    example_gloss: شام خیلی خوشمزه است.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: آرجون می‌پرسد پریا کی بلند می‌شود
    gloss: آرجون از پریا می‌پرسد هر روز ساعت چند بلند می‌شود.
    note: از شکل مؤنثِ tum استفاده می‌کند، چون مخاطب پریاست.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: جواب پریا
    gloss: 'پریا می‌گوید: هر روز صبح ساعت ۶ بلند می‌شم. بعد صبحانه می‌خورم.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: آرجون برنامه‌ی روزانه‌ی خودش را می‌گوید
    gloss: 'آرجون می‌گوید: آها! من ساعت ۷ بلند می‌شم. من هم صبحانه می‌خورم، بعد می‌رم سر کار.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: پریا می‌پرسد آرجون کی برمی‌گردد
    gloss: پریا از آرجون می‌پرسد کی برمی‌گردد.
    note: از شکل مذکرِ tum استفاده می‌کند، چون مخاطب آرجون است. 'vaapas aana' را در بافت معرفی می‌کند.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: ارجون شب‌اش را توصیف می‌کند
    gloss: 'ارجون می‌گوید: من ساعت 6 عصر برمی‌گردم. بعد شام می‌خورم، بعد می‌خوابم.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: پریا عصرش را توصیف می‌کند
    gloss: 'پریا می‌گوید: من هم عصر برمی‌گردم، بعد غذا می‌خورم.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: ارجون می‌پرسد پریا کی می‌خوابد
    gloss: ارجون می‌پرسد پریا ساعت چند می‌خوابد.
    note: دوباره شکل مؤنثِ तुम، که درست برای خطاب به پریا به کار رفته است.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: پریا جواب می‌دهد و خداحافظی می‌کند
    gloss: 'پریا می‌گوید: من ساعت 11 شب می‌خوابم. باشه، فردا همدیگه رو می‌بینیم!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: ارجون خداحافظی می‌کند
    gloss: 'ارجون می‌گوید: باشه، بازم همدیگه رو می‌بینیم!'
