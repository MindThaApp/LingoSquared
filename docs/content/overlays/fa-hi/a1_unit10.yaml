    note: یک فعل تازه با همان الگوی حال عادتیِ آموخته‌شده.
    example_gloss:
    - عصرها برمی‌گردم.
    - عصرها برمی‌گردم.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: غذا می‌خورم
    gloss: غذا می‌خورم (گوینده مرد / گوینده زن)
    note: '''Khana'' به‌عنوان اسم (غذا، از درس ۶) و ''khana'' به‌عنوان فعل (خوردن) -- تکرارِ طبیعی در هندی است، نه غلط تایپی.'
