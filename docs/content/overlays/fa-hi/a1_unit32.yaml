  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*जानवर* کلمه‌ی کلی برای «حیوان» است و *पालतू जानवर* (به معنی «حیوان اهلی») یعنی حیوان خانگی.'
