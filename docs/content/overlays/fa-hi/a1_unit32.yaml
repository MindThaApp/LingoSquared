    note: '*तुम्हारे पास ... है?* (تحت‌اللفظی: «نزد تو ... هست؟») یعنی «... داری؟» و *कोई* («هیچ/یک») سؤال را باز نگه می‌دارد.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
