  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: من هر روز به گربه غذا می‌دهم
    gloss: من هر روز به گربه غذا می‌دهم.
    note: '*खाना देना* («غذا دادن») کسی را که غذا می‌گیرد با *को* نشان می‌دهد: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: شکل‌های جمع
    gloss: یک سگ، دو سگ؛ یک گربه، دو گربه. اسم مذکر که به *-आ* ختم می‌شود، در جمع به *-ए* تبدیل می‌شود (*कुत्ता* به *कुत्ते*)، ولی اسم مؤنث که به *-ई* ختم می‌شود، *-याँ* می‌گیرد (*बिल्ली* به *बिल्लियाँ*).
    note: الگوی جمع باقاعده در هندی که برای اولین بار اینجا با اسم حیوانات به‌عنوان نمونه معرفی می‌شود.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
