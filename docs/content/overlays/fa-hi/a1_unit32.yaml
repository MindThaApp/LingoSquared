    gloss: او سگ را برای قدم زدن بیرون می‌برد.
    note: حیوان *को* می‌گیرد (*कुत्ते को*) و *घुमाने ले जाती है* آخر جمله می‌آید؛ *ले जाना* («با خود بردن») دو کلمه و کنار هم می‌ماند.
  hi.a1.unit32.lesson02.teach.khana_dena:
