  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: آرجون می‌پرسد شبیه چیست
    gloss: 'آرجون: چه شکلی است؟'
    note: '*वह कैसा दिखता है?* برای حیوانات هم به کار می‌رود و *कैसा* مذکر است چون سگ نر است.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: پریا سگش را توصیف می‌کند
    gloss: 'پریا: موهایش قهوه‌ای است و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह برای حیوانات
    gloss: این سگ من است. من خیلی دوستش دارم.
    note: '*वह* و *उसे* هم برای حیوانات و هم برای آدم‌ها به کار می‌روند؛ هندی اینجا کلمه‌ی جداگانه‌ای برای «آن» (غیرانسان) ندارد.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: آرجون درباره‌ی قدم زدن می‌پرسد
    gloss: 'آرجون: تو هر روز او را بیرون می‌بری قدم بزند؟'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: پریا برنامه‌ی روزانه‌اش را توضیح می‌دهد
    gloss: 'پریا: آره، هر روز او را بیرون می‌برم و بهش غذا می‌دهم.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: آرجون، نیها و ویکرام درباره‌ی حیوانات
    gloss: 'آرجون و نیها هر دو حیوانات را خیلی دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارد. آرجون سگ‌ها را دوست دارد و نیها گربه‌ها را. ویکرام حیوان خانگی دارد: یک گربه. او اغلب با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      पसंद: خیلی دوست دارد
      दोनों: هر دو
      जानवर: حیوان‌ها
      किसी: هیچ‌کدام از آن‌ها
      पालतू: حیوان خانگی
      कुत्ते: سگ‌ها
      बिल्लियाँ: گربه‌ها
      बिल्ली: گربه
      खेलता: بازی می‌کند
      देता: می‌دهد
      रोज़: هر
      खाना: غذا
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: ویکرام اغلب با گربه‌اش بازی می‌کند
    gloss: ویکرام اغلب با گربه‌اش بازی می‌کند.
    note: '*अक्सर* («اغلب») قبل از فعل می‌آید و *अपनी* با *बिल्ली* که مؤنث است هماهنگ شده است.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: پریا از نینا می‌پرسد
    gloss: 'پریا: نینا، تو هم حیوان خانگی داری؟'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: نینا یک پرنده به اسم Pico دارد
    gloss: 'نینا: آره، یه پرنده دارم. اسمش Pico‌ـه.'
    note: '*उसका नाम पीको है* (یعنی «اسمش پیکو است») *का* دارد چون *नाम* مذکر است.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: واکنش آرجون
    gloss: 'آرجون: وای، چه عالی! هر روز با او چه کار می‌کنی؟'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: نینا هر روز غذا می‌دهد
    gloss: 'نینا: هر روز بهش غذا می‌دم.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: آرجون هم پرنده‌ها را دوست دارد
    gloss: 'آرجون: من هم پرنده‌ها را خیلی دوست دارم.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: پریا گفتگو را تمام می‌کند
    gloss: 'پریا: چه خوب که هر سه‌مان حیوانات را خیلی دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره‌ی حیوان‌ها در این درس را کنار هم جمع‌بندی می‌کند.
