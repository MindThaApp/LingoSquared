    note: '*मुझे जानवर बहुत पसंद हैं* (تحت‌اللفظی: «برای من حیوانات خیلی دوست‌داشتنی‌اند») یعنی «من حیوانات را دوست دارم»؛ *हैं* جمع است چون *जानवर* جمع است.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: نیها گربه‌ها را دوست دارد، ولی حیوان خانگی ندارد
