    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: '*कोई ... नहीं है* (یعنی «هیچ ... نیست») می‌گوید که چیزی ندارید.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: من حیوان خانگی ندارم.
    note: '*कोई* («هیچ») همراه *नहीं है* نداشتن چیزی را بیان می‌کند: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: بردنِ حیوان به پیاده‌روی
    gloss: حیوان را به پیاده‌روی بردن
    note: '*घुमाने ले जाना* (تحت‌اللفظی: «برای گشتن بردن») یعنی حیوان را بیرون بردن و قدم زدن؛ بعد از *घुमाने* همیشه *ले जाना* می‌آید.'
    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
