teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: «شما»ی محترمانه
    gloss: شما (رسمی، محترمانه)
    note: 'فارسی هم «شما» و «تو» دارد و هندی هم یک انتخاب اجتماعی واقعی دارد: *aap* را برای کسی که بزرگ‌تر است، آشنا نیست یا رابطه‌ی حرفه‌ای و محترمانه‌ای با شما دارد به کار می‌برند. از نظر دستوری *aap* جمع حساب می‌شود، حتی برای یک نفر؛ یعنی فعل‌هایی که با aap می‌آیند همان پایان‌های جمع (مثل hain) را می‌گیرند، درست شبیه «شما هستید» در فارسی.'
  hi.a1.unit01.lesson01.teach.tum:
    title: «تو» به شکل صمیمی
    gloss: تو (صمیمی، خودمانی)
    note: '*Tum* را با دوست، هم‌سن‌وسال، آدم کوچک‌تر یا اعضای خانواده به کار می‌برند؛ رابطه‌ای واقعاً خودمانی، ولی همچنان محترمانه (با *tu* که صمیمی‌تر است فرق دارد و در این دوره آموزش داده نمی‌شود). *Tum* پایان‌های فعلی مخصوص به خودش را دارد، متفاوت از *aap* و *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: احوال‌پرسی رسمی با یک آقا
    gloss: حال شما چطوره؟ (رسمی، از یک مرد)
    note: '*Kaise* با جنسیتِ کسی که از او می‌پرسید هماهنگ می‌شود، نه جنسیتِ گوینده؛ این شکل برای خطاب به یک مرد است. در فارسی «حال شما چطور است؟» برای زن و مرد یکسان است، ولی در هندی صفت عوض می‌شود.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: احوال‌پرسی رسمی با یک خانم
    gloss: حال شما چطوره؟ (رسمی، از یک زن)
    note: همان سؤال و همان سطح محترمانه‌ی *aap*؛ فقط *kaisi* به‌جای *kaise* می‌آید و با مخاطب زن هماهنگ می‌شود. خودِ فعل *hain* هیچ‌وقت عوض نمی‌شود؛ فقط صفت تغییر می‌کند.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: پرسیدن حال به شکل صمیمی
    gloss: چطوری؟ / حالت چطوره؟ (دوستانه)
    note: با *tum* فعل *ho* است، نه *hain*؛ رسمی *Aap kaise/kaisi hain?* را با خودمانی *Tum kaise ho?* مقایسه کنید. این بهترین جفتِ کمینه برای شنیدن تفاوت aap و tum در خودِ فعل است.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: یک پاسخ معمول
    gloss: خوبم، ممنون.
    note: '*Theek* («خوب/اوکی») با جنسیت یا سطح رسمی بودن تغییر نمی‌کند؛ برخلاف *kaise/kaisi*، فرقی نمی‌کند چه کسی حرف می‌زند یا مخاطب کیست، همین یک شکل را دارد.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: برگرداندن سؤال به شکل رسمی
    gloss: شما چطورید؟ (رسمی)
    note: راهی کوتاه برای پس‌دادن سؤال در سطح محترمانه‌ی aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: برگرداندن سؤال به شکل صمیمی
    gloss: تو چطوری؟ (خودمانی)
    note: با tum سؤال را به یک دوست یا هم‌سن‌وسال برمی‌گردانید.
  hi.a1.unit01.lesson02.teach.namaste:
    title: سلامِ همه‌کاره
    gloss: سلام؛ (برای خداحافظی هم به کار می‌رود)
    note: '*Namaste* در هر ساعتی از روز، در موقعیت رسمی و غیررسمی، و هم برای شروع و هم برای پایان گفتگو کاربرد دارد؛ یعنی واقعاً همه‌کاره است و برای سلام و خداحافظی دو واژه‌ی جدا لازم نیست.'
    example_gloss: سلام! حال شما چطوره؟
  hi.a1.unit01.lesson02.teach.namaskar:
    title: سلام محترمانه
    gloss: سلام (رسمی‌تر و محترمانه‌تر از namaste)
    note: '*Namaskar* تقریباً همان معنی *namaste* را دارد، ولی لحنش رسمی‌تر و محترمانه‌تر است؛ برای بزرگ‌تر‌ها، جمع بزرگ یا محیط کاری مناسب است.'
    example_gloss: نَمَسکار! شما چطورید؟
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: باز می‌بینمتان (آینده)
    gloss: باز می‌بینیم‌تون؛ بعداً می‌بینیم
    note: تحت‌اللفظی یعنی «[ما] دوباره همدیگر را خواهیم دید»؛ روشی معمول و خنثی برای خداحافظی وقتی انتظار دارید باز آن شخص را ببینید.
  hi.a1.unit01.lesson02.teach.alvida:
    title: خداحافظی رسمی
    gloss: خداحافظ؛ بدرود
    note: '*Alvida* واژه‌ای کاملاً درست برای خداحافظی در هندی است، ولی در کاربرد روزمره لحنی قطعی‌تر، رسمی‌تر و حتی کمی احساسی‌تر از *namaste* یا *phir milenge* دارد؛ به «بدرود» نزدیک‌تر است تا یک «خداحافظ» ساده.'
    example_gloss: خداحافظ! باز می‌بینیم‌تون.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: می‌بینمت (خودمانی/عادی)
    gloss: می‌بینمت؛ تا بعد
    note: تحت‌اللفظی یعنی «[ما] دوباره همدیگر را می‌بینیم»، با شکل فعلِ استمراری/عادتی به‌جای آینده؛ معادلی کمی خودمانی‌تر و روزمره‌تر برای *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: شب بخیر
    gloss: شب بخیر
    note: وقتی کسی برای شب می‌رود یا می‌خوابد این را می‌گویند؛ مثل «شب بخیر» در فارسی، یک خداحافظی است و هیچ‌وقت برای شروع گفتگو به کار نمی‌رود، برخلاف *namaste*.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: آرزوی مؤدبانه هنگام خداحافظی
    gloss: روز خوبی داشته باشید.
    note: تحت‌اللفظی یعنی «روزتان خوب بماند»؛ آرزویی مؤدبانه هنگام خداحافظی که چه رابطه رسمی باشد چه خودمانی مناسب است.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: پرسیدن اسم، رسمی
    gloss: اسم شما چیه؟ (رسمی)
    note: '*Aapka* («مال شما») با اسم مذکر *naam* («نام») هماهنگ می‌شود؛ در هندی صفت ملکی با چیزِ مالکیت‌شده هماهنگ می‌شود، نه با مالک. در فارسی چنین تغییری نداریم («نام شما»، «نام او» همیشه یک‌شکل است).'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: پرسیدن نام، به‌صورت خودمانی
    gloss: اسمت چیه؟ (غیررسمی)
    note: همان الگو با *tumhara* («مال تو»، خودمانی) به‌جای *aapka*. *Aapka naam kya hai?* ی رسمی را با *Tumhara naam kya hai?* ی خودمانی مقایسه کنید.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: گفتن اسم خودتان
    gloss: اسم من پریا است.
    note: '*Mera* («مال من») هم چون *naam* مذکر است با آن هماهنگ می‌شود؛ دقت کنید پایانش همان پایان مذکرِ *aapka* و *tumhara* است، چون هر سه یک اسم را توصیف می‌کنند.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: ابراز خوشحالی از آشنایی، به‌صورت رسمی
    gloss: از آشنایی با شما خوشحالم. (رسمی)
    note: تحت‌اللفظی یعنی «پس از ملاقات با شما، شادی رخ داد»؛ عبارتی ثابت و پرکاربرد برای اولین دیدار محترمانه.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: جواب دادن به همان احساس
    gloss: من هم.
    note: پاسخی کوتاه و طبیعی به Aapse milkar khushi hui یا Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: پرسیدن زادگاه، به‌صورت رسمی
    gloss: اهل کجایید؟ (رسمی)
    note: Kahan یعنی «کجا» و se یعنی «از».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: گفتن اهل کجا بودن
    gloss: من اهل هندوستان هستم.
    note: Bharat نام هندیِ کشور هند است و در گفتار روزمره مدام به کار می‌رود.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: پرسیدن اهل کجا بودن، صمیمی
    gloss: اهل کجایی؟ (غیررسمی)
    note: همان سؤال، با *tum* و *ho* به‌جای *aap* و *hain*؛ همان الگوی پایان‌های رسمی/خودمانی فعل که در سراسر این درس دیدید.
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: شروع آشنایی
    gloss: پریا به آرجون سلام می‌کند و می‌پرسد اولین بارش است که اینجا می‌آید.
    note: هر دو گوینده از همان ابتدا خودمانی و با *tum* حرف می‌زنند؛ برای دو هم‌سن‌وسالی که در یک کلاس محلی اتفاقی آشنا می‌شوند طبیعی است. *Tumhari* («مال تو») با اسم مؤنث *baar* («بار/دفعه») هماهنگ می‌شود، نه با جنسیت هیچ‌کدام از دو گوینده.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: شروع آشنایی، پاسخ
    gloss: آرجون می‌گوید بله، اولین بارش است و می‌خواهد یوگا یاد بگیرد.
    note: '*Chahta hoon* («می‌خواهم») اینجا شکل مذکر است چون آرجون، گوینده، مرد است؛ این فعل با جنسیتِ گوینده هماهنگ می‌شود، برخلاف *kaisi*/*kaise* که قبلاً با جنسیتِ مخاطب هماهنگ می‌شد.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: گفتن اسم
    gloss: پریا می‌گوید «من هم!»، اسمش را می‌گوید و اسم آرجون را می‌پرسد.
    note: '*Main bhi!* («من هم!») جواب جمله‌ی آرجون یعنی *main ... chahta hoon* است: وقتی فاعل جمله‌ی طرف مقابل *main* باشد، «من هم» می‌شود *main bhi*. *Mujhe bhi* جواب جمله‌هایی از نوع *mujhe* است، مثل *Tumse milkar accha laga*. *Mera naam...hai* روشی ساده و طبیعی برای گفتن نام است.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: گفتن اسم، پاسخ
    gloss: آرجون اسمش را می‌گوید و به‌صورت خودمانی می‌گوید از آشنایی با او خوشحال است.
    note: '*Tumse milkar accha laga* معادل خودمانیِ *Aapse milkar khushi hui* ی رسمی همین درس است؛ هر دو تقریباً یعنی «از آشنایی با شما خوشحالم» و با سطح رسمی بودن جور شده‌اند.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: پرسیدن دربارهٔ اصالت
    gloss: پریا همین احساس را پس می‌دهد و می‌پرسد آرجون اهل کجاست.
    note: Tum kahan se ho با همان سطح خودمانی که قبلاً یاد گرفتید درباره‌ی زادگاه می‌پرسد.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: پرسیدن دربارهٔ اصالت، پاسخ
    gloss: آرجون اهل هند است ولی فعلاً در لندن زندگی می‌کند، بعد همان سؤال را برمی‌گرداند.
    note: '*Rahta hoon* («زندگی می‌کنم») مذکر است و با آرجون به‌عنوان گوینده هماهنگ می‌شود؛ همان الگوی *chahta hoon* در جمله‌ی دوم. *Lekin* («ولی») تضاد میان زادگاه و محل زندگی فعلی را وصل می‌کند.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: صحبت درباره‌ی زادگاه و یک علاقه
    gloss: پریا می‌گوید اهل آمریکاست و او هم می‌خواهد یوگا یاد بگیرد.
    note: '*Chahti hoon* شکل مؤنثِ همان فعلی است که آرجون در جمله‌ی دوم به کار برد (*chahta hoon*)؛ هر دو با جنسیت گویندهٔ خودشان هماهنگ‌اند و مقایسه‌ی مستقیمی به دست می‌دهند.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: پرسیدن درباره‌ی فعالیت مشترک
    gloss: آرجون با خوشحالی واکنش نشان می‌دهد و می‌پرسد پریا یوگا می‌کند.
    note: '*Karti ho* («انجام می‌دهی؟») مؤنث است و با پریا به‌عنوان کسی که از او پرسیده می‌شود هماهنگ است؛ مثل *kaisi* قبلی، این شکل فعل جنسیتِ مخاطب را دنبال می‌کند، نه گوینده را.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: پاسخ به پرسش درباره‌ی فعالیت مشترک
    gloss: پریا می‌گوید نه، اولین بارش است و هنوز دارد یاد می‌گیرد.
    note: '*Seekh rahi hoon* («دارم یاد می‌گیرم») شکل استمراریِ مؤنث است و با پریا به‌عنوان گوینده هماهنگ می‌شود؛ همتای زمان حال استمراریِ *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: تمام کردن گفتگو
    gloss: 'آرجون قبول می‌کند که شروع کنند و بعد خداحافظی می‌کند: «بعداً می‌بینمت.»'
    note: '*Chalo shuru karte hain* («بیایید شروع کنیم») روشی ثابت و طبیعی برای پیشنهاد شروع کاری با هم است. *Phir milte hain* گفتگو را با همان خداحافظی خودمانی که در درس ۲ یاد گرفتید تمام می‌کند.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: کدام واژه روش رسمی و محترمانه‌ی گفتن «شما» است؟
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap را با کسی که بزرگ‌تر است، آشنا نیست یا رابطه‌ی محترمانه‌ای با شما دارد به کار می‌برند.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: کدام کلمه برای خطاب صمیمی به یک دوست یا هم‌سن‌وسال است؟
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum را با دوستان، هم‌سن‌وسال‌ها و رابطه‌های خودمانی ولی محترمانه به کار می‌برند.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: این سؤال چه می‌پرسد و خطاب به چه کسی است؟
    correct_option: حال شما چطوره؟ (رسمی، از یک زن)
    distractors:
    - حال شما چطوره؟ (رسمی، از یک مرد)
    - و شما؟
