teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'هندی سرگرمی‌ها را با فعلی که به *-ना* ختم می‌شود می‌گوید: *पढ़ना*، *कसरत करना* و *खाना बनाना* («خواندن»، «ورزش کردن»، «آشپزی کردن»).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*खाली समय* («وقت خالی») عبارت اصلی برای صحبت درباره‌ی سرگرمی‌هاست، و *में* معنی «در» می‌دهد: *खाली समय में*.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*मुझे ... पढ़ना पसंद है* («برای من، خواندن مورد پسند است») روش هندی برای گفتن «دوست دارم بخوانم» است؛ *मुझे* نشان می‌دهد چه کسی دوست دارد.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *संगीत सुनना*، *चित्र बनाना* و *गेम खेलना*؛ *गेम* وام‌واژه است و در فارسی هم شبیه آن («گیم») به کار می‌رود.'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: 'برای *संगीत सुनना* («گوش دادن به موسیقی») به حرف اضافه‌ی دیگری نیاز نیست: مفعول مستقیم پیش از فعل می‌آید.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: در *दोस्तों के साथ* («با دوستان»)، *दोस्त* به شکل جمع مایل (*दोस्तों*) می‌آید، چون پیش از *के साथ* قرار گرفته است.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: قیدهای بسامد مثل *हमेशा*، *अक्सर*، *कभी-कभी* و *कभी नहीं* معمولاً پیش از فعل می‌آیند، و *कभी नहीं* یعنی «هرگز».
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*हर* («هر») هیچ‌وقت تغییر نمی‌کند، و واژه‌ی زمانی بعد از آن هم به شکل ساده می‌ماند: *हर हफ़्ते*، *हर वीकेंड*.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर تغییر نمی‌کند
    gloss: هر هفته، هر آخر هفته.
    note: '*हर* با هر اسمی که بعد از آن بیاید ثابت می‌ماند، پس شکلی برای انتخاب کردن نیست: *हर हफ़्ते*، *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: پریا بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'پریا: ما اغلب با هم قدم می‌زنیم. ولی آرجون، تو در وقت آزادت دیگه چه کار می‌کنی؟'
    note: '*टहलते हैं* جمع است چون فاعل *हम* («ما») است، و *अक्सर* پیش از فعل می‌آید.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: سرگرمی‌های آرجون
    gloss: 'آرجون: من آشپزی کردن رو دوست دارم، توی خونه هم. و اغلب ورزش می‌کنم.'
    note: '*घर पर भी* («توی خونه هم») نشان می‌دهد آرجون برای تفریح آشپزی می‌کند، نه فقط سر کار.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: پریا تعجب می‌کند
    gloss: 'پریا: توی خونه هم آشپزی می‌کنی؟ تو که تمام روز سر کار آشپزی می‌کنی!'
    note: '*पूरा दिन* («تمام روز») تأکید می‌کند که او سر کار هم خیلی آشپزی می‌کند، و *तो* تأکید اضافه می‌کند.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: آرجون توضیح می‌دهد
    gloss: 'آرجون: آره، ولی آشپزی کردن بهم آرامش می‌ده. تو چی؟ تو چه کاری رو دوست داری؟'
    note: '*खाना बनाने से सुकून मिलता है* یعنی «آشپزی به من آرامش می‌دهد» (تحت‌اللفظی: «از آشپزی، آرامش به دست می‌آید»)؛ *बनाना* پیش از *से* به *बनाने* تبدیل می‌شود.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: سرگرمی‌های پریا
    gloss: 'پریا: من خواندن رو دوست دارم و اغلب به موسیقی گوش می‌دم.'
    note: '*और* («و») دو سرگرمی را به هم وصل می‌کند، و *सुनती हूँ* مؤنث است چون پریا دارد حرف می‌زند.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: آرجون درباره‌ی بازی ویدیویی می‌پرسد
    gloss: 'آرجون: تو بازی ویدیویی هم می‌کنی؟'
    note: 'یک سؤال کوتاه بله/خیر: *क्या* آن را شروع می‌کند، و *खेलती हो* مؤنث است چون آرجون از پریا می‌پرسد.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: پریا جواب می‌دهد
    gloss: 'پریا: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*कभी ... नहीं* («هرگز») و *कभी-कभी* («گاهی») در یک جواب در مقابل هم آمده‌اند.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و آرجون اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگری هم داریم. آرجون آشپزی کردن رو دوست داره، توی خونه هم، و اغلب ورزش می‌کنه. من خواندن رو دوست دارم و اغلب به موسیقی گوش می‌دم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو توی وقت آزادت چه کاری رو دوست داری؟
    note: پیام پریا موارد درس قبل را مرور می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      टहलते: قدم می‌زنیم
      अक्सर: اغلب
      साथ: با هم
      और: دیگر
      बनाना: درست کردن (آشپزی)
      पसंद: دوست دارد
      घर: توی خانه
      कसरत: ورزش می‌کند
      पढ़ना: بخوانم
      सुनती: گوش می‌دهم
      संगीत: موسیقی
      चित्र: تصویر (نقاشی)
      कभी-कभी: گاهی
      गेम: بازی ویدیویی می‌کنم
      कभी: هرگز (با فعل منفی)
      खाली: آزاد
      समय: وقت
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: آرجون درباره‌ی آخر هفته می‌پرسد
    gloss: 'آرجون: این آخر هفته چه کار می‌کنی؟'
    note: در *इस वीकेंड* («این آخر هفته»)، *इस* پیش از اسم می‌آید، و *कर रही हो* شکل استمراری «داری انجام می‌دهی» است، مؤنث چون مخاطب پریاست.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: پریا هنوز تصمیم نگرفته
    gloss: 'پریا: هنوز نمی‌دونم. خواندن رو دوست دارم، ولی می‌خوام بیرون هم برم.'
    note: '*बाहर जाना चाहती हूँ* یعنی «می‌خوام بیرون برم»؛ *चाहती* مؤنث است و بعد از *जाना* می‌آید.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: آرجون یک برنامه پیشنهاد می‌دهد
    gloss: 'آرجون: بیا با هم قدم بزنیم؟ بعدش من برای هردومون غذا درست می‌کنم.'
    note: '*उसके बाद* («بعد از آن») دو برنامه را پشت سر هم قرار می‌دهد، و *चलो ... टहलें* اولی را پیشنهاد می‌کند.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: پریا موافقت می‌کند
    gloss: 'پریا: فکر خوبیه! من هم قدم زدن رو دوست دارم هم آشپزی کردن رو.'
    note: '*दोनों पसंद हैं* نشان می‌دهد پریا هر دو را به یک اندازه دوست دارد، و فعل جمع *हैं* است.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: آرجون قرار را قطعی می‌کند
    gloss: 'آرجون: عالیه. پس شنبه می‌بینمت!'
    note: '*शनिवार को मिलते हैं* («شنبه همدیگر را می‌بینیم») برای یک برنامه‌ی قطعی از زمان حال استفاده می‌کند، و *को* روز را مشخص می‌کند.'
