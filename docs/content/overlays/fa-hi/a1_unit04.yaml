teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: ساعت
    gloss: ساعت (برای دو و بیشتر)
    note: با هر ساعتی به‌جز یک به کار می‌رود — شکل ویژهٔ *ساعت یک* را بعداً در همین درس می‌بینید.
    example_gloss: الان ساعت پنج است.
  hi.a1.unit04.lesson01.teach.abhi:
    title: الان
    gloss: الان
    note: کلمهٔ ساده‌ای برای زمان که موقع گفتن ساعت فعلی مدام به کار می‌برید.
    example_gloss: الان ساعت ده است.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: یک، دو، سه
    gloss: یک، دو، سه
    note: از واحد ۲ تکرار شده و اینجا برای گفتن ساعت لازم است — توجه کنید *ek* با *baja* ویژه می‌آید، ولی *do* و *teen* با *baje* معمولی.
    example_gloss:
    - الان ساعت یک است.
    - الان ساعت دو است.
    - الان ساعت سه است.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: چهار، پنج، شش
    gloss: چهار، پنج، شش
    note: از واحد ۲ تکرار شده — هر سه با *baje* معمولی می‌آیند.
    example_gloss:
    - الان ساعت چهار است.
    - الان ساعت پنج است.
    - الان ساعت شش است.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: هفت، هشت، نه
    gloss: هفت، هشت، نه
    note: از واحد ۲ تکرار شده.
    example_gloss:
    - الان ساعت هفت است.
    - الان ساعت هشت است.
    - الان ساعت نه است.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: ده، یازده، دوازده
    gloss: ده، یازده، دوازده
    note: از واحد ۲ تکرار شده — آخرین عددهای ساعتی که لازم دارید.
    example_gloss:
    - الان ساعت ده است.
    - الان ساعت یازده است.
    - الان ساعت دوازده است.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja و baje
    gloss: '*Baja* با *یک* می‌آید و *baje* با بقیهٔ عددها: *ek baja hai*، *do baje hain*.'
    note: یک استثنای واقعی و مهم در هماهنگی است، نه ساده‌سازی — *ek baja hai* تنها ساعتی است که شکل مفرد دارد.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: تحت‌اللفظی یعنی «چند ساعت است» — روش استاندارد پرسیدن ساعت.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: گفتن ساعت
    gloss: الان ساعت پنج است.
    note: پاسخ کامل و طبیعی به *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: کلاس یوگا
    gloss: کلاس یوگا
    note: از واحد ۱ تکرار شده — مثال اصلی این درس برای برنامه‌ریزی.
    example_gloss: کلاس یوگا امروز است.
  hi.a1.unit04.lesson02.teach.subah:
    title: صبح
    gloss: صبح
    note: یکی از چهار کلمهٔ بخش‌های روز که این درس یاد می‌دهد.
    example_gloss: کلاس یوگا صبح است.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: ظهر / بعدازظهر
    gloss: بعدازظهر، ظهر
    note: هم نیمروز (ظهر) را در بر می‌گیرد و هم اوایل بعدازظهر را.
    example_gloss: بعدازظهر کلاس نداریم.
  hi.a1.unit04.lesson02.teach.shaam:
    title: عصر
    gloss: عصر / شب (اول شب)
    note: بازهٔ روز بعد از *dopahar* و قبل از *raat*.
    example_gloss: کلاس بعدی ساعت پنج عصر است.
  hi.a1.unit04.lesson02.teach.raat:
    title: شب
    gloss: شب
    note: آخرین کلمه از چهار کلمهٔ بخش‌های روز.
    example_gloss: شب کلاس نداریم.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko با زمان کلی
    gloss: '*Ko* وقتی ساعت مشخصی گفته نشود با کلمهٔ بخش روز می‌آید: *dopahar ko*، *raat ko*.'
    note: همان *ko* که روز هفته را نشان می‌داد (واحد ۳)، حالا یک بازهٔ کلی از روز را نشان می‌دهد — ساختاری واقعی و طبیعی، نه تنها ساختاری که این واحد یاد می‌دهد (برای ساعت مشخص، یادداشت بعدی را ببینید).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: کلمهٔ بخش روز درست قبل از baje
    gloss: 'برای ساعت مشخص، کلمهٔ بخش روز درست قبل از *baje* می‌آید و هیچ کلمه‌ای بینشان نیست: *subah saat baje*، *shaam paanch baje*.'
    note: اینجا *ko* نمی‌آید — آن برای بازهٔ کلی روز بدون ساعت مشخص است، همان‌طور که یادداشت قبلی گفت.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: پرسیدن ساعت کلاس
    gloss: کلاس ساعت چند است؟
    note: همان الگوی *kitne baje* از درس ۱، حالا برای پرسیدن دربارهٔ یک رویداد، نه ساعت فعلی.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: گفتن ساعت یک رویداد
    gloss: کلاس ساعت هفت صبح است.
    note: '*subah* را مستقیم با *saat baje* ترکیب می‌کند، طبق یادداشت دستوری بالا.'
  hi.a1.unit04.lesson03.teach.kal:
    title: فردا / دیروز
    gloss: فردا، دیروز
    note: هندی برای هر دو معنی (دیروز و فردا) یک کلمه دارد؛ بافت جمله (و زمان فعل) مشخص می‌کند کدام منظور است. در این درس همیشه یعنی «فردا».
    example_gloss: کلاس فردا ساعت پنج عصره.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: بعدی
    gloss: بعدی
    note: شکل مؤنث است، چون با *class* که مؤنث است هم‌خوانی دارد. این کلمه در درس ۳ هم آمده بود.
    example_gloss: کلاس بعدی فرداست.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: باشه، ممنون
    gloss: باشه، ممنون!
    note: هر دو کلمه از واژگان خداحافظی درس ۱ تکرار شده‌اند.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: همدیگه رو می‌بینیم / می‌بینمتون
    gloss: همدیگه رو می‌بینیم / می‌بینمتون
    note: از خداحافظی پایان درس ۳ تکرار شده و حالا با *kal* می‌آید و یعنی «فردا می‌بینمتون».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: پرسیدن ساعت کلاس بعدی
    gloss: کلاس بعدی ساعت چنده؟
    note: '*agli* (مؤنث، هم‌خوان با «کلاس») را با الگوی *kitne baje* همین درس ترکیب می‌کند.'
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: گفتن ساعت کلاس بعدی
    gloss: کلاس بعدی ساعت پنج عصره.
    note: جواب کامل و طبیعی برای سؤال بالا.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: خداحافظی با قرار فردا
    gloss: باشه، فردا می‌بینیم‌تون!
    note: روش طبیعی برای تمام کردن گفتگو، وقتی ساعت قرار مشخص شده.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: ارجون درباره‌ی کلاس بعدی می‌پرسد
    gloss: ارجون می‌پرسد کلاس بعدی ساعت چنده.
    note: دقیقاً همان سؤال همین درس تکرار شده است.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: پریا ساعت را می‌گوید
    gloss: پریا می‌گوید کلاس بعدی ساعت پنج عصره.
    note: دقیقاً همان جمله‌ی جواب همین درس تکرار شده است.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: ارجون از او تشکر می‌کند
    gloss: ارجون می‌گوید باشه، ممنون.
    note: از واژگان درس ۱ تکرار شده است.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا موافقت می‌کند و می‌گوید فردا می‌بینیم‌تون.
    note: دقیقاً همان جمله‌ی پایانی همین درس تکرار شده است.
