teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: '*कुल* یعنی «جمع»، و *कितना हुआ?* («چقدر شد؟») روش رایج پرسیدن جمع کل است.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: گفتن قیمت کل
    gloss: روی‌هم دویست و پنجاه روپیه می‌شود.
    note: '*हुए* با *रुपये* که جمع است مطابقت دارد: *कुल दो सौ पचास रुपये हुए* به‌صورت تحت‌اللفظی یعنی «روی‌هم دویست و پنجاه روپیه آمد».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: هندی می‌گوید *कार्ड से पेमेंट करना* («پرداخت با کارت کردن») و *नकद पेमेंट करना*؛ *से* وسیله‌ی پرداخت را نشان می‌دهد.
    example_gloss:
    - می‌شود اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌شود اینجا با کارت پرداخت کنم؟
    note: '*यहाँ* («اینجا») مکان را مشخص می‌کند، و *सकता हूँ* («می‌توانم») بعد از عبارت اصلی می‌آید؛ یک زن *सकती हूँ* می‌گوید.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*आप ... करेंगे* سؤالِ مؤدبانه‌ی آینده است که صندوقدار می‌پرسد، و *आप* فعل جمع *करेंगे* می‌گیرد.'
  hi.a1.unit29.lesson03.teach.bil:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: '*बिल* اسم مذکر است: *एक बिल*، *बिल का*.'
    example_gloss: صورت‌حساب را تقسیم کنیم؟
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: صورت‌حساب را تقسیم کنیم؟
    note: '*बाँट लें?* («تقسیمش کنیم؟») بدون گفتنِ *हम* یک پیشنهاد مشترک می‌دهد؛ *लें* شکلِ «بیا ... کنیم» از *लेना* است.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*अलग से* یعنی «جداگانه» و قبل از *पेमेंट कर सकता हूँ* می‌آید.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: باقی‌مانده پول
    gloss: باقی‌مانده پول
    note: '*बाकी पैसे* («پولِ باقی‌مانده») جمع است و یعنی پول خردی که پس می‌گیرید.'
    example_gloss: بفرمایید، این هم باقی‌مانده پولتان.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، این هم باقی‌مانده پولتان.
    note: '*आपके* شکلِ مؤدبانه‌ی «مالِ شما» است (*आप* + *के*) و با *पैसे* که جمع است مطابقت دارد.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: '*मुझे ... नहीं चाहिए* («برای من ... لازم نیست») روشِ هندی برای گفتنِ «نمی‌خواهم» است؛ *नहीं* قبل از *चाहिए* می‌آید.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: سیصد و پنجاه
    gloss: سیصد و پنجاه
    note: '*तीन सौ पचास* یعنی ۳۵۰: اول صدگان را بگویید، بعد دهگان را.'
    example_gloss: سیصد و پنجاه روپیه قیمتش است.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو تالی و دو چای. جمع: سیصد و پنجاه روپیه. پرداخت: با کارت.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      बिल: صورت‌حساب
      दो: دو
      थाली: تالی‌ها
      चाय: چای‌ها
      कुल: مجموع
      तीन: سه
      सौ: صد
      पचास: پنجاه
      रुपये: روپیه
      पेमेंट: پرداخت
      कार्ड: کارت
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: پریا صورت‌حساب را می‌خواهد
    gloss: 'پریا: صورت‌حساب را بخواهیم؟'
    note: '*माँग लें?* («بخواهیمش؟») دوباره از شکلِ «بیا ... کنیم» از *लेना* استفاده می‌کند، و *माँगना* یعنی «خواستن».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: آرجون جمع کل را می‌پرسد
    gloss: 'آرجون: آره، فکر خوبیه. روی‌هم چقدر شد؟'
    note: '*कुल कितना हुआ?* همان سؤالِ جمع کل از قبل است، این بار سرِ میز.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: پریا جمع کل را می‌گوید
    gloss: 'پریا: سیصد و پنجاه روپیه شد. تقسیمش کنیم؟'
    note: '*तीन सौ पचास रुपये हुए* جمع کل را می‌گوید، و *बाँट लें?* یعنی «تقسیمش کنیم؟»'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: آرجون اصرار دارد خودش پرداخت کند
    gloss: 'آرجون: نه، امروز بذار من حساب کنم. شما خیلی کمکم کردی.'
    note: '*मुझे पेमेंट करने दो* یعنی «بذار من پرداخت کنم»، و *तुमने मेरी बहुत मदद की है* *ने* دارد چون فعل در گذشته است.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: پریا تحت‌تأثیر قرار گرفته
    gloss: 'پریا: چقدر مهربونی! خیلی ممنون.'
    note: '*तुम कितने अच्छे हो!* («چقدر مهربانی!») تعریفی گرم است، و *शुक्रिया* یعنی «ممنون».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: آرجون درباره‌ی پرداخت با کارت می‌پرسد
    gloss: 'آرجون: می‌شود اینجا با کارت پرداخت کنم؟'
    note: سؤال *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* دوباره به کار می‌رود، این بار در یک رستورانِ واقعی.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: او پرداخت می‌کند'
    gloss: آرجون صورت‌حساب را پرداخت می‌کند.
    note: '*देता है* شکلِ *वह* از *देना* («دادن») است؛ هندی برای «پرداخت کردنِ صورت‌حساب» می‌گوید «صورت‌حساب می‌دهد».'
