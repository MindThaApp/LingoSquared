teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'مرور: امروز'
    gloss: امروز
    note: در درس ۳ آموخته شد -- کلمهٔ زمانیِ تکرارشوندهٔ همین بخش، در کنار *kal* (فردا) در درس ۳.
    example_gloss: امروز سوم ماه است.
  hi.a1.unit19.lesson01.teach.mausam:
    title: آب‌وهوا
    gloss: هوا
    note: اسمی تازه و کلمهٔ موضوعی همین بخش. مذکر است -- به نکته‌های دستوریِ مطابقت جنسیت در همین بخش نگاه کنید.
    example_gloss: امروز هوا چطور است؟
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'مرور: چطور / چه‌جور'
    gloss: چطور / چه‌جور
    note: در بخش ۱۲ آموخته شد -- اینجا برای پرسیدن دربارهٔ هوا دوباره به کار می‌رود.
    example_gloss: خانهٔ شما چطور است؟
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'مرور: است، هستند'
    gloss: است (مفرد)، هستند (جمع)
    note: جفت فعل مفرد/جمع که الگوی «وجود» برای هوا در همین بخش به آن وابسته است.
    example_gloss:
    - امروز هوا خوب است.
    - در خانه سه اتاق هست.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: آفتاب
    gloss: آفتاب
    note: 'اسمی تازه. به‌صورت جملهٔ ساده‌ٔ وجودی گفته می‌شود: *aaj dhoop hai* = «امروز آفتابی است» (تحت‌اللفظی: «امروز آفتاب هست»).'
    example_gloss: امروز هوا آفتابیه.
  hi.a1.unit19.lesson01.teach.baarish:
    title: باران
    gloss: باران
    note: 'اسمی تازه. به‌صورت جملهٔ ساده‌ٔ وجودی گفته می‌شود: *aaj baarish hai* = «امروز باران می‌آید».'
    example_gloss: امروز بارون میاد.
  hi.a1.unit19.lesson01.teach.hawa:
    title: باد
    gloss: باد
    note: 'اسمی تازه. به‌صورت جملهٔ ساده‌ٔ وجودی گفته می‌شود: *aaj hawa hai* = «امروز باد می‌آید».'
    example_gloss: امروز باد می‌آید.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: الگوی وجودی برای هوا
    gloss: برای توصیف هوا می‌گویید «aaj/kal + [واژهٔ هوا] + hai» -- مثلاً «aaj dhoop hai»، «aaj baarish hai»، «aaj hawa hai». این همان ساختار hai/hain است که در بخش ۱۸ برای خانه یاد گرفتید، ولی اینجا بدون عدد و مستقیم در نقش نهاد.
    note: اولین نکتهٔ دستوری این بخش که واژه‌های تازه را به ساختار جملهٔ آشنا وصل می‌کند.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'مرور: هوا'
    gloss: هوا
    note: از درس ۱ همین بخش دوباره آمده است.
    example_gloss: امروز هوا چطور است؟
  hi.a1.unit19.lesson02.teach.garam:
    title: گرم
    gloss: گرم
    note: صفتی تازه. با جنسیت تغییر نمی‌کند -- به نکتهٔ دستوری همین درس نگاه کنید.
    example_gloss: امروز هوا گرم است.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: سرد (مذکر / مؤنث)
    gloss: سرد (مذکر)، سرد (مؤنث)
    note: صفتی تازه. برخلاف *garm* با جنسیت تغییر می‌کند -- با *mausam* مذکر، *thanda* می‌آید و با اسم‌های مؤنث (مثل *rasoi* در بخش ۱۸) *thandi* -- به نکتهٔ دستوری همین درس نگاه کنید.
    example_gloss:
    - امروز هوا سرد است.
    - امروز آشپزخانه سرد است.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: صفت‌های ثابت و صفت‌های مطابق با جنسیت
    gloss: «Garm» صفتی است که به همخوان ختم می‌شود و با جنسیت تغییر نمی‌کند -- در «mausam garm hai» همیشه «garm» می‌آید. ولی «thanda»/«thandi» صفتی است که به «-a» ختم می‌شود و با جنسیت تغییر می‌کند، درست مثل «bada»/«badi» (بخش ۱۴) -- با «mausam» مذکر، «thanda» می‌آید و با اسم مؤنث، «thandi».
    note: تقابل دستوریِ اصلی این بخش که جفت‌صفتِ تازه را به قاعدهٔ آموخته‌شده در بخش ۱۴ وصل می‌کند.
  hi.a1.unit19.lesson02.teach.baadal:
    title: ابر
    gloss: ابر
    note: 'اسمی تازه که در این بخش فقط به شکل جمعِ وجودی به کار می‌رود: *aaj baadal hain* = «امروز ابر هست» / «امروز هوا ابری است».'
    example_gloss: امروز هوا ابری است.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'مرور: خوب'
    gloss: خوب
    note: در بخش ۹ آموخته شد -- اینجا برای توصیف هوا دوباره به کار می‌رود.
    example_gloss: امروز هوا خوب است.
  hi.a1.unit19.lesson02.teach.bura:
    title: بد
    gloss: بد
    note: صفتی تازه که در مقابل *accha* (خوب) که قبلاً یاد گرفتید قرار می‌گیرد. در این بخش فقط به شکل مذکر و مطابق با *mausam* به کار می‌رود.
    example_gloss: امروز هوا بد است.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'مرور: خیلی'
    gloss: خیلی
    note: در بخش ۶ آموخته شد -- اینجا برای تأکید بر توصیف هوا دوباره به کار می‌رود.
    example_gloss: امروز هوا خیلی سرد است.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'مرور: فردا (به معنی «دیروز» هم)'
    gloss: فردا (بسته به متن، «دیروز» هم معنی می‌دهد)
    note: در بخش ۴ آموخته شد و در بخش ۱۲ برای «دیروز» به کار رفت -- در هندیِ واقعی واقعاً مبهم است و فقط از روی متن معلوم می‌شود. جمله‌های این بخش همه دربارهٔ آینده و برنامه‌ریزی‌اند، پس اینجا «kal» یعنی «فردا».
    example_gloss: فردا باران می‌آید.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'مرور: خانه'
    gloss: خانه
    note: در بخش ۸ آموخته شد -- اینجا برای برنامهٔ حاصل (در خانه ماندن) دوباره به کار می‌رود.
    example_gloss: این یک خانه است.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'مرور: در'
    gloss: در
    note: در بخش ۱ آموخته شد -- اینجا در «ghar mein» (در خانه) دوباره به کار می‌رود.
    example_gloss: در خانه سه اتاق هست.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'مرور: ما'
    gloss: ما
    note: در بخش ۱۱ آموخته شد -- اینجا به‌عنوان نهاد برنامه‌ریزی در این درس دوباره به کار می‌رود.
    example_gloss: ما یک فیلم تماشا می‌کنیم.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'مرور: (آن‌ها/ما) زندگی می‌کنند / می‌مانند'
    gloss: (آن‌ها/ما) زندگی می‌کنند / می‌مانند
    note: اولین بار در درس ۵ آموزش داده شد (با یک پدربزرگِ مفرد، از طریق مطابقت جمعِ مذکر برای احترام). این درس برای اولین بار آن را با فاعلِ واقعاً جمع، «hum» (ما)، به کار می‌برد؛ همان شکل فعل، فقط ساده‌تر.
    example_gloss: پدربزرگ من در دهلی زندگی می‌کند.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'مرور: بیا / بریم'
    gloss: بیا / بریم
    note: اولین بار در درس ۱ آموزش داده شد و در درس‌های ۶، ۷ و ۱۱ با فعل جمعِ عادتی برای معنی «بیایید … کنیم» به کار رفت؛ اینجا هم به همان شکل به کار می‌رود.
    example_gloss: بیا یک چیزی بخوریم!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'مرور: رفتن'
    gloss: رفتن
    note: اولین بار در درس ۱۵ به صورت مصدرِ ساده آموزش داده شد. این درس آن را به شکل جمعِ عادتی «jaate hain» (ما می‌رویم) گسترش می‌دهد، همان ساختاری که درس ۱۱ برای «dekhte hain» و «peete hain» به کار برد.
    example_gloss: من باید به ایستگاه بروم.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'مرور: و'
    gloss: و
    note: اولین بار در درس ۱ آموزش داده شد. اینجا برای وصل کردن هوا و دمای فردا به کار می‌رود.
    example_gloss: فردا بارون می‌آد و هوا سرد می‌شه.
  hi.a1.unit19.lesson03.teach.bahar:
    title: بیرون
    gloss: بیرون
    note: یک واژهٔ جدید، مخصوص واژگان برنامه‌ریزیِ این درس.
    example_gloss: بیا بریم بیرون!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: بیا بریم بیرون!
    gloss: بیا بریم بیرون!
    note: «Chalo» + فعل جمعِ عادتیِ «jaate hain» (از «jaana»، رفتن). همان الگوی «بیا … کنیم» که در درس‌های ۱، ۶، ۷ و ۱۱ آمده بود.
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: ارجون از پریا دربارهٔ هوای امروز می‌پرسد
    gloss: پریا، امروز هوا چطوره؟
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: پریا هوای امروز را توصیف می‌کند
    gloss: امروز آفتابیه و هوا گرمه.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: ارجون پیشنهاد می‌دهد بروند بیرون
    gloss: عالیه! بیا بریم بیرون.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: پریا دربارهٔ هوای فردا می‌پرسد
    gloss: باشه! فردا هوا چطوره؟
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: ارجون هوای فردا را توصیف می‌کند
    gloss: فردا بارون می‌آد و هوا سرده.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: پریا پیشنهاد می‌دهد در خانه بمانند
    gloss: پس فردا خونه می‌مونیم؟
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: ارجون موافقت می‌کند
    gloss: آره، فردا خونه می‌مونیم.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: پریا موافقت می‌کند
    gloss: باشه!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این درس: (۱) برای گفتن وضع هوا می‌گویند «aaj/kal + [واژهٔ هوا] + hai/hain». (۲) «garm» با جنسیت عوض نمی‌شود، ولی «thanda»/«thandi» عوض می‌شود، درست مثل «bada»/«badi». (۳) «chalo» + فعل جمعِ عادتی (مثل «jaate hain») پیشنهاد می‌سازد: «chalo, bahar jaate hain!».'
    note: یک جمع‌بندیِ پایانی که دستور کل درس را کنار هم می‌گذارد، مثل نکتهٔ دستوریِ جمع‌کنندهٔ درس‌های ۱۵ تا ۱۸.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: خواندن دربارهٔ امروز و فردا
    gloss: امروز هوا گرمه و آفتابیه. بیا بریم بیرون! فردا بارون می‌آد و هوا سرده. فردا خونه می‌مونیم.
    note: یک متن کوتاه و ساده (بدون چارچوب داستانیِ تازه) که دقیقاً همان اطلاعات گفتگو را تکرار می‌کند و چیز جدیدی اضافه نمی‌کند؛ مستقیماً به هدف «خواندن یک پیش‌بینی کوتاه هوا» کمک می‌کند.
    glosses:
      आज: امروز
      मौसम: هوا
      गर्म: گرم
      धूप: آفتاب
      चलो: بیا بریم
      बाहर: بیرون
      जाते: رفتن (از جانا)
      कल: فردا
      बारिश: بارون
      ठंडा: سرد
      रहते: زندگی کردن / ماندن (از رهنا)
