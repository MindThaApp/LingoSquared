    - پارک پشت مدرسه است.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne و peeche
    gloss: '«Samne» و «peeche» هم مثل «paas» با «ke» می‌آیند -- و متضاد هم‌اند: «paark school ke peeche hai» و «school paark ke samne hai» هر دو دقیقاً یک رابطه‌ی واقعی را می‌گویند، فقط از دو دیدگاه متفاوت.'
    note: یک واقعیت به دو شکل -- نکته‌ی دستوری واقعی و مفید درباره‌ی رابطه‌ی این دو واژه.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: مدرسه روبه‌روی پارک است
    gloss: مدرسه روبه‌روی پارک است.
    note: طرف دیگرِ همان واقعیتِ *paark school ke peeche hai* بالا.
