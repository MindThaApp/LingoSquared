    example_gloss: ایستگاه دور است.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: «Ke paas» یعنی نزدیکِ یک مکان، مثل «school bank ke paas hai» (مدرسه نزدیک بانک است). همان «paas»ی است که قبلاً در «mere paas» (دارم) آمده بود، اما آنجا یعنی «در اختیار من» و اینجا یعنی «نزدیک» -- یک کلمه، دو کاربرد متفاوت.
    note: یک حرف اضافه‌ی پسین جدید که روی واژه‌ای ساخته شده که قبلاً دیده‌اید؛ معنای قبلی‌اش صریحاً یادآوری شده تا دو کاربرد با هم قاطی نشوند.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (دارم), और यहाँ इसका मतलब है ''नज़दीक'' (نزدیک) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: مدرسه نزدیک بانک است
    gloss: مدرسه نزدیک بانک است.
    note: یک جمله‌ی نمونه با *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: روبه‌روی، پشت
    gloss: روبه‌روی، پشت
    note: یک جفت دیگر از واژه‌های مکان که آن‌ها هم با *ke* می‌آیند.
    example_gloss:
