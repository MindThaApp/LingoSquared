    gloss: ارجون از پریا می‌پرسد اداره‌ی پست کجاست.
    note: دوباره از عبارت آغازین همین درس استفاده می‌کند.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید نزدیک بانک است.
    note: دوباره از *ke paas* در درس ۲ استفاده می‌کند.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: ارجون درباره‌ی بیمارستان می‌پرسد
    gloss: ارجون می‌گوید باشه و می‌پرسد بیمارستان کجاست.
    note: دوباره از *achchha* (باشه / آهان) در واحدهای قبل استفاده می‌کند.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید بیمارستان روبه‌روی ایستگاه است.
    note: دوباره از *ke samne* در درس ۲ استفاده می‌کند.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: ارجون می‌پرسد دور است یا نه
    gloss: 'ارجون می‌پرسد: ایستگاه دور است؟'
    note: دوباره از *door* در درس ۲ استفاده می‌کند.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: پریا تأیید می‌کند و مقایسه می‌کند
    gloss: پریا می‌گوید بله، کمی دور است -- بانک نزدیک است.
    note: '*thoda* (کمی) را معرفی می‌کند و با دور بودن ایستگاه و نزدیک ماندن بانک هماهنگ است.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: ارجون درباره‌ی پارک می‌پرسد
    gloss: ارجون می‌گوید باشه و می‌پرسد پارک کجاست.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید پارک پشت مدرسه است.
    note: عبارت *ke peeche* از درس ۲ دوباره استفاده شده است.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: آرجون به جواب می‌رسد
    gloss: 'آرجون می‌گوید: پس مدرسه روبه‌روی پارک است!'
    note: '*to* (پس / در این صورت) معرفی می‌شود و این نتیجه‌گیری به نکتهٔ دستوری *samne*/*peeche* در درس ۲ وصل می‌شود.'
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: پریا تأیید می‌کند
    gloss: پریا می‌گوید بله، درست است!
    note: '*sahi* (درست) معرفی می‌شود.'
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: آرجون از پریا تشکر می‌کند
    gloss: آرجون می‌گوید خیلی ممنون، پریا!
    note: '*bahut* (خیلی) و *shukriya* از درس‌های قبل دوباره استفاده شده‌اند.'
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا می‌گوید قابلی ندارد! باز همدیگر را می‌بینیم.
    note: عبارت‌های پایانی رایج همین دوره از درس‌های قبل دوباره استفاده شده‌اند.
