teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'مرور: چای، قهوه'
    gloss: چای، قهوه
    note: مروری سریع بر واژه‌های نوشیدنی از درس 6 -- در این درس دوباره از آن‌ها برای پیشنهاد برنامه استفاده می‌کنیم.
    example_gloss:
    - چای می‌خواهم.
    - قهوه می‌خواهم.
  hi.a1.unit11.lesson01.teach.filma:
    title: فیلم
    gloss: فیلم
    note: یک اسم تازه برای موضوع این درس، یعنی برنامه‌ریزی.
    example_gloss: این فیلم خوبه.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: تماشا می‌کنیم / بیا تماشا کنیم
    gloss: (ما) تماشا می‌کنیم / بیا تماشا کنیم
    note: صورت جمعِ زمان حال عادتیِ «dekhna» (تماشا کردن) که اینجا برای پیشنهاد دادنِ یک کار دسته‌جمعی به کار رفته است.
    example_gloss: ما فیلم تماشا می‌کنیم.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: بیا فیلم ببینیم!
    gloss: بیا فیلم ببینیم!
    note: «Chalo» + فعل جمعِ عادتی، راه همیشگی پیشنهاد دادنِ یک کار با هم است. این الگو قبلاً در درس‌های ۱، ۶ و ۷ هم بی‌آنکه به آن اشاره شود آمده بود («chalo shuru karte hain»، «chalo, kuch khaate hain»، «chalo, kuch khareedte hain»)؛ این درس آن را رسمی‌تر و گسترده‌تر می‌کند.
  hi.a1.unit11.lesson01.teach.saath:
    title: با هم
    gloss: با هم
    note: برای پیشنهاد انجام دادنِ یک کار با هم به کار می‌رود.
    example_gloss: بیا با هم فیلم ببینیم!
  hi.a1.unit11.lesson01.teach.peena:
    title: می‌نوشیم / بیا بنوشیم
    gloss: (ما) می‌نوشیم / بیا بنوشیم
    note: صورت جمعِ زمان حال عادتیِ «peena» (نوشیدن)، با همان الگوی «dekhte hain».
    example_gloss: ما چای می‌نوشیم.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: بیا با هم چای بخوریم!
    gloss: بیا با هم چای بخوریم!
    note: «saath» و «peete hain» این درس را در پیشنهاد دومی کنار هم می‌گذارد، با همان الگوی «chalo» که در پیشنهاد فیلم بود.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + فعل-te + hain = بیا ... کنیم
    gloss: 'برای پیشنهاد دادنِ یک کار با هم، «chalo» + فعل-te + hain می‌گویید: بیا فیلم ببینیم! بیا با هم چای بخوریم!'
    note: کل الگو را صریح بیان می‌کند و چیزی را که قبلاً سه بار در درس‌های پیشین به‌طور ضمنی آمده بود، رسمی می‌کند.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: فکر خوبیه!
    gloss: فکر خوبیه!
    note: عبارتی آماده برای پذیرفتنِ یک پیشنهاد با اشتیاق.
  hi.a1.unit11.lesson02.teach.vyast:
    title: مشغول
    gloss: مشغول
    note: صفتی تازه که با فعل ربطیِ آشنا (hoon/ho/hai) می‌آید تا بگوید کسی وقت ندارد.
    example_gloss: من امروز سرم شلوغه.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: ببخشید / متأسفم
    gloss: ببخشید / متأسفم
    note: عبارتی مؤدبانهٔ ثابت که برای نرم‌تر کردنِ یک رد کردن به کار می‌رود.
    example_gloss: ببخشید، سرم شلوغه.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: ببخشید، سرم شلوغه.
    gloss: ببخشید، سرم شلوغه.
    note: جملهٔ پایهٔ رد کردن که دو عبارت تازهٔ این درس را کنار هم می‌گذارد.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: کار دارم.
    gloss: کار دارم.
    note: الگوی «mujhe...hai» (من ... دارم) را به کار می‌برد، همان که شبیه «mujhe...chahiye» (می‌خواهم/لازم دارم) در درس‌های قبل بود؛ اینجا دلیلی برای نپذیرفتن است.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: چطور مؤدبانه رد کنیم
    gloss: برای اینکه مؤدبانه یک برنامه را رد کنید، «maaf karna» (ببخشید) می‌گویید و بعد وضعیتتان (مثلاً «سرم شلوغه») یا دلیلتان (مثلاً «کار دارم») را می‌گویید.
    note: عمداً از دستوری که قبلاً آموخته شده (فعل ربطی و الگوی مالکیت با «را») استفاده می‌کند، نه ساختار تازه‌ای برای «می‌توانم».
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: ما
    gloss: ما
    note: 'نخستین ضمیر اول شخص جمع در این دوره. صورت فعلِ حال عادتیِ آن (-te + hain) همان است که برای ve (آن‌ها) آموخته شد؛ فقط ضمیر تازه است، نه صرف تازه. (tum هم -te می‌گیرد، اما با «ho»: tum milte ho.)'
    example_gloss: ما هر روز همدیگر را می‌بینیم.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: کی همدیگر را ببینیم؟
    gloss: کی همدیگر را ببینیم؟
    note: «hum» را با «kab» (درس ۱۰) و «milte hain» (که از خداحافظی‌های درس ۱ می‌شناسید و معمولاً فاعلش حذف می‌شد) ترکیب می‌کند.
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'مرور: شنبه، یکشنبه'
    gloss: شنبه، یکشنبه
    note: مرور سریع دو نام روز هفته از درس ۳، که برای قرار گذاشتن لازم است.
    example_gloss:
    - امروز شنبه است.
    - فردا یکشنبه است.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'مرور: ساعت ۴، ساعت چند'
    gloss: ساعت ۴، ساعت چند
    note: مرور سریع واژه‌های ساعت از درس ۴، که برای قرار گذاشتن لازم است.
    example_gloss:
    - الان ساعت ۴ است.
    - الان ساعت چند است؟
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: یکشنبه خوبه؟
    gloss: یکشنبه خوبه؟
    note: باز هم «kya» را برای پرسش بله/خیر به کار می‌برد، همان که از درس ۱ آمده («kya yeh tumhari pahli baar hai?»، «kya tum yoga karti ho?»)، نه یک واژهٔ پرسشیِ تازه برای «کدام روز».
  hi.a1.unit11.lesson03.teach.sandesh:
    title: پیام
    gloss: پیام
    note: اسمی تازه که در بخش دعوت‌نامهٔ نوشتاریِ این درس به کار می‌رود.
    example_gloss: این پیام آرجون است.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: آرجون پیشنهاد فیلم در روز شنبه می‌دهد
    gloss: پریا، بیا شنبه فیلم ببینیم؟
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: پریا با ذکر دلیل رد می‌کند
    gloss: ببخشید، شنبه سرم شلوغه. کار دارم.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: آرجون می‌پرسد کی می‌شود همدیگر را دید
    gloss: باشه. کی همدیگر را ببینیم؟
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: پریا به‌جایش یکشنبه را پیشنهاد می‌کند
    gloss: یکشنبه خوبه؟ بیا با هم چای بخوریم!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: آرجون می‌پذیرد و ساعت را می‌پرسد
    gloss: فکر خوبیه! یکشنبه ساعت چند؟
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: پریا ساعتی پیشنهاد می‌کند
    gloss: ساعت ۴ خوبه؟
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: آرجون تأیید می‌کند
    gloss: آره، ساعت ۴ خوبه. پس می‌بینمت!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: پریا گفتگو را تمام می‌کند
    gloss: باشه، یکشنبه می‌بینمت!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: پیام پریا
    gloss: سلام آرجون، بیا یکشنبه ساعت ۴ همدیگر را ببینیم و چای بخوریم. خوبه؟ - پریا
    note: دعوت‌نامه‌ای کوتاه و نوشتاری که قراری را که گفتگو همین الان قطعی کرد دوباره بیان می‌کند.
    glosses:
      चलो: بیا ... کنیم
      रविवार: یکشنبه
      मिलते: همدیگر را ببینیم (از مِلنا)
      चाय: چای
      पीते: بنوشیم (از پیِنا)
      ठीक: باشه / خوب
