lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: '... می‌خواهم'
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: غذا و مقدار
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: وعده‌ی غذایی پریا و آرجون
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: غذا
    gloss: غذا، وعده‌ی غذایی
    note: واژه‌ی عمومی برای غذا که در این درس همه‌جا به کار می‌رود.
    example_gloss: غذای من الان آماده است.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: چای، قهوه
    gloss: چای، قهوه
    note: دو نوشیدنی رایج که در این درس برای تمرین الگوی *mujhe ... chahiye* به کار می‌روند.
    example_gloss:
    - من چای می‌خواهم.
    - من قهوه می‌خواهم.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: آب، آب‌میوه
    gloss: آب، آب‌میوه
    note: دو نوشیدنی رایج دیگر؛ لازم نیست چیزی را با جنسیت هماهنگ کنید چون *chahiye* تغییر نمی‌کند.
    example_gloss:
    - آب می‌خواستم.
    - من آب‌میوه می‌خواهم.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* یعنی «... می‌خواهم». با جنسیت گوینده تغییر نمی‌کند (برخلاف *chahta/chahti*) و بعدش هرگز *hai* نمی‌آید.'
    note: نکته‌ی اصلی این درس -- اشتباه رایج زبان‌آموزان این است که بعد از *chahiye* کلمه‌ی *hai* می‌گذارند، چون تقریباً همه‌ی جمله‌هایی که تا اینجا یاد گرفته‌اید با آن تمام می‌شوند. *Chahiye* خودش گزاره‌ی کاملی است.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: چه می‌خواهید؟ (رسمی)
    gloss: چه میل دارید؟
    note: سؤال رسمی با *aap*؛ گارسون یا میزبان با آن مؤدبانه از کسی می‌پرسد.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: چی می‌خوای؟ (غیررسمی)
    gloss: چه میل دارید؟
    note: ضمیر مفعولی غیررسمی با *tum*، مشابه *mujhe* و مثل *tumhara/tumhari* که در درس پنجم دیدید.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: چای می‌خواهم، ممنون
    gloss: چای می‌خواهم، ممنون.
    note: جواب مؤدبانه و طبیعی برای سفارش دادن که *shukriya* را از درس‌های قبل دوباره به کار می‌برد.
  hi.a1.unit06.lesson01.teach.bahut:
    title: خیلی
    gloss: خیلی، بسیار
    note: قیدی رایج برای تأکید که در این درس برای توصیف غذا و نوشیدنی به کار می‌رود.
    example_gloss: این چای خیلی خوب است.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: خوشمزه
    gloss: خوشمزه، لذیذ
    note: واژه‌ای مفید برای واکنش به غذا -- در نکته‌ی دستوری درس ۳ می‌بینید که چرا با جنسیت تغییر نمی‌کند.
    example_gloss: این غذا خیلی خوشمزه است.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: نان، برنج
    gloss: نان تخت، برنج
    note: دو غذای اصلی در وعده‌ی روزمره‌ی هندی.
    example_gloss:
    - نان می‌خواهم.
    - من برنج می‌خواهم.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: خوراک سبزیجات، عدس
    gloss: خوراک سبزیجات، عدس (دال)
    note: دو غذای اصلی دیگر که معمولاً با روتی و برنج خورده می‌شوند.
    example_gloss:
    - من خوراک سبزیجات می‌خواهم.
    - من عدس می‌خواهم.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: فنجان، لیوان، بشقاب
    gloss: فنجان، لیوان، بشقاب
    note: ظرف‌های رایج که هنگام سفارش با *ek* («یک») برای مشخص کردن مقدار به کار می‌روند.
    example_gloss:
    - من یک فنجان چای می‌خواهم.
    - من یک لیوان آب می‌خواهم.
    - من یک بشقاب برنج می‌خواهم.
  hi.a1.unit06.lesson02.teach.kripya:
    title: لطفاً
    gloss: لطفاً
    note: واژه‌ی ساده‌ی ادب برای درخواست. بیشتر اوقات اول جمله می‌آید (*kripya mujhe ...*)، ولی آخر جمله هم شنیده می‌شود.
    example_gloss: یک فنجان چای می‌خواهم، لطفاً.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: چیز دیگری نمی‌خواهید؟
    gloss: چیز دیگری می‌خواهید؟ / چیز دیگری میل دارید؟
    note: سؤال طبیعی که گارسون بعد از گرفتن بخشی از سفارش می‌پرسد.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: نه، همین‌قدر کافی است، ممنون
    gloss: نه، همین بود، ممنون.
    note: راهی مؤدبانه و طبیعی برای تمام کردن سفارش که *nahin* و *shukriya* را از درس‌های قبل دوباره به کار می‌برد.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: این خوراک سبزیجات خیلی خوشمزه است
    gloss: این خوراک سبزیجات خیلی خوشمزه است.
    note: '*bahut* و *swadisht* همین درس را با اسم غذای جدید به کار می‌برد، تا برای نکته‌ی دستوری درس ۳ آماده شوید که می‌گوید *swadisht* با جنسیت تغییر نمی‌کند.'
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: بیا یه چیزی بخوریم!
    gloss: بیا یه چیزی بخوریم!
    note: عبارتی ثابت و دوستانه برای پیشنهاد غذا خوردن با هم که گفت‌وگوی پایانی این درس را شروع می‌کند.
  hi.a1.unit06.lesson03.teach.ya:
    title: یا
    gloss: یا
    note: واژه‌ی ربط ساده‌ای که برای پیشنهاد انتخاب بین دو چیز به کار می‌رود.
    example_gloss: چای می‌خوای یا قهوه؟
  hi.a1.unit06.lesson03.teach.haan:
    title: بله
    gloss: بله
    note: یک پاسخ مثبت ساده که در گفت‌وگوی پایانی این درس دوباره به کار می‌رود.
    example_gloss: بله، من چای می‌خواهم.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht هیچ‌وقت تغییر نمی‌کند
    gloss: '*Swadisht* با واژه‌های مذکر و مؤنث یکسان می‌ماند -- مثل *achha/achhi* تغییر نمی‌کند.'
    note: 'یک استثنای مهم: برخلاف صفت‌های هماهنگ‌شونده‌ای که تا حالا یاد گرفته‌اید (achha/achhi، bada/badi، mera/meri)، صفت‌هایی که به صامت ختم می‌شوند، مثل *swadisht*، هرگز با جنسیت تغییر نمی‌کنند.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: باشه، بعداً می‌بینمت
    gloss: باشه! بعداً می‌بینمت.
    note: خداحافظی دوستانه که از واژگان خداحافظی درس‌های قبل دوباره آمده است.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: باشه، به‌زودی می‌بینمت
    gloss: باشه، به‌زودی می‌بینمت!
    note: پاسخ غیررسمی به خداحافظی بالا، مثل گفت‌وگوهای پایانی درس‌های قبل.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: آرجون پیشنهاد غذا خوردن می‌دهد
    gloss: آرجون می‌گوید بیا یه چیزی بخوریم.
    note: عبارت آغازین همین درس را دوباره به کار می‌برد.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: پریا می‌پرسد چه می‌خواهد
    gloss: پریا موافقت می‌کند و می‌پرسد آرجون چه می‌خواهد.
    note: سؤال غیررسمی *tumhein kya chahiye* را از درس ۱ دوباره به کار می‌برد.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: آرجون غذا سفارش می‌دهد
    gloss: ارجون می‌گوید یک بشقاب نان رotی و سبزی می‌خواهد.
    note: این درس اسم‌های غذایی این واحد، الگوی ظرف مثل *ek plate* و *chahiye* را با هم ترکیب می‌کند.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: پریا یک نوشیدنی پیشنهاد می‌دهد
    gloss: پریا می‌گوید «عالیه!» و می‌پرسد آرجون چای می‌خواهد یا قهوه.
    note: از *ya* که در همین واحد یاد گرفتید برای انتخاب بین دو نوشیدنی استفاده شده است.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: آرجون قهوه را انتخاب می‌کند
    gloss: آرجون می‌گوید قهوه می‌خواهد، لطفاً.
    note: '*kripya* از درس ۲ دوباره آمده است.'
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: پریا درباره غذا نظر می‌دهد
    gloss: پریا می‌گوید باشه، و این غذا خیلی خوشمزه است.
    note: '*bahut swadisht* از درس ۱ دوباره آمده است.'
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: آرجون موافقت می‌کند
    gloss: آرجون می‌گوید بله، خیلی ممنون.
    note: '*haan* و *shukriya* دوباره آمده‌اند.'
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا می‌گوید «عالیه! باز همدیگر را می‌بینیم.»
    note: عبارت خداحافظی همین درس دوباره آمده است.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: آرجون جواب می‌دهد
    gloss: آرجون موافقت می‌کند و می‌گوید «به‌زودی همدیگر را می‌بینیم.»
    note: عبارت پاسخ همین درس دوباره آمده است.
