teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: صفر
    gloss: صفر
    note: نقطهٔ شروع همهٔ اعداد این واحد.
    example_gloss: امروز دما صفر است.
  hi.a1.unit02.lesson01.teach.ek:
    title: یک
    gloss: یک
    note: اعداد ۱۱ تا ۹۹ در هندی هر کدام کلمه‌ای مستقل‌اند و بر الگوی «ده + یک» ساخته نشده‌اند. در درس ۲ می‌بینید که बीस (۲۰) و तीस (۳۰) هیچ بخش مشترکی با एक (۱) یا दो (۲) ندارند.
    example_gloss: من یک کتاب دارم.
  hi.a1.unit02.lesson01.teach.do:
    title: دو
    gloss: دو
    note: عددی ساده و پرکاربرد؛ شکل امری غیررسمیِ «بده» هم هست، ولی از موقعیت، معنی همیشه روشن است.
    example_gloss: من دو برادر دارم.
  hi.a1.unit02.lesson01.teach.teen:
    title: سه
    gloss: سه
    note: '*Chahiye* («لازم است») ساختاری بی‌شخص و رایج است: *mujhe teen seb chahiye* تحت‌اللفظی یعنی «برای من سه سیب لازم است» و راهی بسیار طبیعی برای گفتن «من ... لازم دارم» است.'
    example_gloss: من سه تا سیب لازم دارم.
  hi.a1.unit02.lesson01.teach.chaar:
    title: چهار
    gloss: چهار
    note: اینجا بی‌قاعدگی‌ای نیست؛ chaar مثل بقیهٔ اعداد کوچک رفتار می‌کند.
    example_gloss: من چهار تا دوست دارم.
  hi.a1.unit02.lesson01.teach.paanch:
    title: پنج
    gloss: پنج
    note: با چاندرابیندو (पाँच) نوشته می‌شود، نه انوسوار؛ نشانهٔ مصوت aa (ा) بالای حرف نمی‌رود و به همین دلیل به‌جای نقطهٔ ساده چاندرابیندو می‌آید، همان الگویی که در واحد ۱ در हाँ/कहाँ دیدید.
    example_gloss: من پنج روپیه دارم.
  hi.a1.unit02.lesson01.teach.chhah:
    title: شش
    gloss: شش
    note: در متن‌های قدیمی‌تر گاهی छः هم نوشته می‌شود؛ छह املای استاندارد امروزی است.
    example_gloss: من شش کتاب دارم.
  hi.a1.unit02.lesson01.teach.saat:
    title: هفت
    gloss: هفت
    note: عددی مفید برای حرف زدن دربارهٔ روزهای هفته.
    example_gloss: هفته هفت روز دارد.
  hi.a1.unit02.lesson01.teach.aath:
    title: هشت
    gloss: هشت
    note: بی‌قاعدگی ندارد؛ aath مثل بقیهٔ اعداد کوچک رفتار می‌کند.
    example_gloss: در این اتاق هشت صندلی هست.
  hi.a1.unit02.lesson01.teach.nau:
    title: نه
    gloss: نه
    note: اینجا به نشانهٔ خیشومی نیازی نیست، برخلاف بعضی از اعداد اطرافش.
    example_gloss: کلاس یوگا ساعت نه صبح شروع می‌شود.
  hi.a1.unit02.lesson01.teach.das:
    title: ده
    gloss: ده
    note: آخرین عدد این دستهٔ اول؛ درس ۲ با عددهای بعد از ده و دهگان‌ها ادامه پیدا می‌کند که از اینجا به بعد قابل پیش‌بینی نیستند.
    example_gloss: من روی دست‌هایم ده تا انگشت دارم.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: یازده
    gloss: یازده
    note: از اینجا به بعد هر عدد هندی کلمه‌ای مستقل و بی‌قاعده است؛ gyaarah به‌روشنی شامل das (۱۰) یا ek (۱) نیست. میان‌بری وجود ندارد و هر کدام را باید جداگانه یاد گرفت.
    example_gloss: در این کلاس یازده دانش‌آموز هست.
  hi.a1.unit02.lesson02.teach.baarah:
    title: دوازده
    gloss: دوازده
    note: یکی دیگر که فقط باید حفظش کرد؛ هیچ الگوی قابل پیش‌بینی‌ای آن را به do (۲) وصل نمی‌کند.
    example_gloss: سال دوازده ماه دارد.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: پانزده
    gloss: پانزده
    note: برای حرف زدن دربارهٔ مدت‌های کوتاه، مثل یک استراحت پانزده‌دقیقه‌ای، رایج است.
    example_gloss: من پانزده دقیقه وقت لازم دارم.
  hi.a1.unit02.lesson02.teach.bees:
    title: بیست
    gloss: بیست
    note: کلمه‌ای واقعاً تازه، نه ترکیبی از das (۱۰) و do (۲)؛ این الگو برای همهٔ دهگان‌ها از اینجا به بعد ادامه دارد.
    example_gloss: خواهرم بیست ساله است.
  hi.a1.unit02.lesson02.teach.tees:
    title: سی
    gloss: سی
    note: دوباره کلمه‌ای مستقل؛ کمی شبیه teen (۳) است، ولی از teen و das ساخته نمی‌شود، پس آن را جدا یاد بگیرید.
    example_gloss: قیمت بلیت سی روپیه است.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: پنجاه
    gloss: پنجاه
    note: عددی رُند و بسیار پرکاربرد، به‌خصوص در قیمت‌ها.
    example_gloss: من پنجاه روپیه دارم.
  hi.a1.unit02.lesson02.teach.sau:
    title: صد
    gloss: صد
    note: عددی رُند و ساده که در قیمت‌های روزمره خیلی رایج است.
    example_gloss: قیمت این کتاب صد روپیه است.
  hi.a1.unit02.lesson02.teach.keemat:
    title: قیمت
    gloss: قیمت؛ بها
    note: '*Keemat* اسم مؤنث است؛ ملکی‌اش همیشه شکل مؤنث می‌گیرد (*iski keemat*، «قیمتش»)، فرقی نمی‌کند قیمتِ چه چیزی پرسیده شود.'
    example_gloss: قیمت این بلیت چقدر است؟
  hi.a1.unit02.lesson02.teach.rupaye:
    title: روپیه
    gloss: روپیه
    note: '*Rupaya* شکل مفرد است (برای دقیقاً یک روپیه)؛ *rupaye* برای هر مقدار بیشتر به کار می‌رود.'
    example_gloss: این پنجاه روپیه است.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: پرسیدن قیمت
    gloss: قیمتش چقدره؟
    note: '*Iski* («مالِ این») با اسم مؤنث *keemat* («قیمت») مطابقت می‌کند، نه با شیئی که قیمتش پرسیده می‌شود؛ همان الگوی مطابقت ملکی که واحد ۱ با *mera naam* معرفی کرد.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: گفتن قیمت
    gloss: قیمتش پنجاه روپیه است.
    note: پاسخ کامل و طبیعی به Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: پرسیدن شمارهٔ تلفن، به شکل رسمی
    gloss: شمارهٔ تلفن شما چنده؟ (رسمی)
    note: '*Number* (नंबर) وام‌واژه است و در هندی روزمره مدام به کار می‌رود. *Aapka* با اسم مذکر *number* مطابقت می‌کند.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: پرسیدن شماره تلفن، خودمانی
    gloss: شمارهٔ تلفنت چنده؟ (غیررسمی)
    note: Tumhara موقع صحبت با دوست یا هم‌سن‌وسال جای aapka می‌آید، همان الگوی واحد ۱.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: شروع گفتن شماره
    gloss: شمارهٔ من ...
    note: راهی طبیعی برای شروع، پیش از خواندن رقم‌ها یکی‌یکی.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: یک شماره تلفن نمونه
    gloss: شش، دو، هشت، سه، پنج.
    note: شمارهٔ تلفن در هندی رقم‌به‌رقم خوانده می‌شود؛ همهٔ رقم‌های اینجا را قبلاً در درس ۱ یاد گرفته‌اید.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: پرسیدن سن، رسمی
    gloss: سن شما چنده؟ (رسمی)
    note: '*Umra* («سن») اسم مؤنث است، پس *aapki* اینجا شکل مؤنث می‌گیرد؛ همان الگوی *iski keemat*، این بار برای سنِ یک نفر به‌جای قیمت.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: پرسیدن سن، خودمانی
    gloss: سنت چنده؟ (غیررسمی)
    note: Tumhari موقع صحبت با دوست یا هم‌سن‌وسال جای aapki می‌آید.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: گفتن سن
    gloss: سن من سی سال است.
    note: '*Meri* با *umra* (مؤنث) مطابقت می‌کند، نه با جنسیت خود گوینده؛ برخلاف شکل‌های فعلی *chahta/chahti* که در واحد ۱ آمد، این ملکی هر کسی که حرف بزند تغییر نمی‌کند.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: ارجُن شمارهٔ پریا را می‌پرسد
    gloss: ارجُن به شکل غیررسمی شمارهٔ تلفن پریا را از او می‌پرسد.
    note: دقیقاً همان سؤال غیررسمیِ شمارهٔ تلفن این درس را به کار می‌برد.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: پریا شمارهٔ خودش را می‌گوید و می‌پرسد
    gloss: پریا شمارهٔ تلفنش را رقم‌به‌رقم می‌خواند، بعد شمارهٔ ارجُن را می‌پرسد.
    note: همهٔ رقم‌های اینجا را قبلاً در درس ۱ این واحد یاد گرفته‌اید.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: ارجُن شمارهٔ خودش را می‌گوید
    gloss: ارجُن شمارهٔ تلفن خودش را رقم‌به‌رقم می‌خواند.
    note: باز هم همهٔ رقم‌ها از واژگان درس ۱ هستند.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: پریا سن ارجُن را می‌پرسد
    gloss: پریا تشکر می‌کند و به شکل غیررسمی سنش را می‌پرسد.
    note: Shukriya («ممنون») با سطح رسمیت عوض نمی‌شود، مثل کارت shukriya در واحد ۱.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: ارجُن سنش را می‌گوید و سؤال را برمی‌گرداند
    gloss: ارجُن می‌گوید بیست سال دارد، بعد سن پریا را می‌پرسد.
    note: Tumhari? به‌تنهایی راهی کوتاه و طبیعی برای برگرداندن سؤال است.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: پریا سنش را می‌گوید
    gloss: پریا می‌گوید سی سال دارد.
    note: Meri umra tees saal hai همان الگوی جمله‌ای است که پیش‌تر در این درس آمد.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: ارجُن گفتگو را تمام می‌کند
    gloss: ارجُن با خوشحالی واکنش نشان می‌دهد و می‌گوید باز همدیگر را می‌بینند.
    note: Accha و phir milenge هر دو از واژگان خداحافظی واحد ۱ هستند.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا موافقت می‌کند و دوستانه خداحافظی می‌کند.
    note: Theek hai و phir milte hain هر دو از واژگان خداحافظی واحد ۱ هستند.
