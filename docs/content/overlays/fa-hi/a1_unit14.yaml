teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'مرور: آرجون، پریا، است'
    gloss: آرجون، پریا، است
    note: مرور سریع اسم این دو شخصیت و فعل ربطی «hai» که برای ساختن جمله‌های مقایسه‌ای این درس لازم است.
    example_gloss:
    - آرجون خوب است.
    - پریا خوب است.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'مرور: بزرگ / بزرگ‌تر'
    gloss: بزرگ / بزرگ‌تر (مذکر / مؤنث)
    note: اولین بار در درس ۵ برای سن خواهر و برادر آمد؛ در این درس برای مقایسهٔ مستقیم هر دو شخص یا چیز به کار می‌رود.
    example_gloss:
    - برادر بزرگ‌ترم در دهلی زندگی می‌کند.
    - خواهر بزرگ‌ترم در دهلی زندگی می‌کند.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'مرور: کوچک / کوچک‌تر'
    gloss: کوچک / کوچک‌تر (مذکر / مؤنث)
    note: اولین بار در درس ۵ برای سن خواهر و برادر آمد؛ اینجا هم مثل bada/badi به کار می‌رود.
    example_gloss:
    - برادر کوچک‌ترم الان دانش‌آموز است.
    - خواهر کوچک‌ترم الان دانش‌آموز است.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = از (در مقایسه)
    gloss: 'قبلاً «se» را با معنی «از (مبدأ)» (درس ۹، «yahan se seedhe jao») و «با» (درس ۱۲، «Priya se mila») یاد گرفتید. حالا برای مقایسه هم می‌آید: «X, Y se ADJ hai» یعنی «X از Y ADJ‌تر است»، مثل «Priya Arjun se badi hai».'
    note: سومین کاربرد کلمه‌ای که قبلاً آموخته‌اید؛ پیش از معرفی کاربرد جدید، دو کاربرد قبلی با شمارهٔ درس یادآوری شده است.
    target_text: '''से'' را قبلاً در ''यहाँ से सीधे जाओ'' (درس ۹، معنی «از») و ''प्रिया से मिला'' (درس ۱۲، معنی «با») یاد گرفتید؛ حالا برای مقایسه هم می‌آید: ''X, Y से ADJ है'' یعنی «X از Y ADJ‌تر است» -- مثل ''प्रिया अर्जुन से बड़ी है''.'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: پریا از آرجون بزرگ‌تر است.
    gloss: پریا از آرجون بزرگ‌تر است.
    note: اولین جملهٔ کامل این درس با ساختار مقایسه‌ای با se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: قدبلند / بلند
    gloss: قدبلند / بلند (مذکر / مؤنث)
    note: یک جفت صفت جدید که از همان الگوی مذکر/مؤنث -a/-i پیروی می‌کند (bada/badi، chota/choti).
    example_gloss:
    - برادرم قدبلند است.
    - خواهرم قدبلند است.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: صفت با نهاد مطابقت می‌کند
    gloss: در جملهٔ مقایسه‌ای، صفت (مثل bada/badi، chota/choti) همیشه با جنسیت نهاد مطابقت می‌کند، نه با کلمه‌ای که بعد از «se» می‌آید؛ مثلاً در «Arjun Priya se chota hai»، صفت «chota» با آرجون (نهاد مذکر) مطابقت دارد، نه با پریا.
    note: ادامهٔ مستقیم و صریح الگوی مطابقت صفت‌های -a/-i که قبلاً آمده، این بار در جمله‌های مقایسه‌ای.
    target_text: در جملهٔ مقایسه‌ای، صفت (مثل बड़ा/बड़ी، छोटा/छोटी) همیشه با جنسِ نهاد (subject) مطابقت دارد، نه با کلمهٔ بعد از 'से' -- مثلاً در 'अर्जुन प्रिया से छोटा है'، 'छोटा' با अर्जुन (نهاد مذکر) مطابقت دارد، نه با प्रिया.
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: آرجون از پریا کوچک‌تر است.
    gloss: آرجون از پریا کوچک‌تر است.
    note: بیان همان واقعیت از سمت دیگر؛ مطابقت صفت با نهاد مذکر را نشان می‌دهد.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'مرور: چه کسی، یا'
    gloss: چه کسی، یا
    note: هر دو قبلاً آمده‌اند (درس ۵ و درس ۶/۱۳)؛ اینجا برای پرسیدن یک سؤال مقایسه‌ای به کار می‌روند.
    example_gloss: چه کسی بزرگ‌تر است، آرجون یا پریا؟
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'مرور: کلاه، کیف'
    gloss: کلاه، کیف
    note: هر دو اسم اولین بار در درس خرید (درس ۷) آمدند؛ اینجا دو چیزی هستند که با هم مقایسه می‌شوند.
    example_gloss:
    - این کلاه قشنگ است.
    - این کیف قشنگ است.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'مرور: ارزان، گران'
    gloss: ارزان، گران
    note: اولین بار در درس ۷ آمد؛ اینجا برای مقایسهٔ اشیا به کار می‌رود.
    example_gloss:
    - کیف ارزان است.
    - کیف گران است.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'شکل‌های مؤنث: sasti، mehngi'
    gloss: «Sasta» و «mehnga» با کلمه‌های مؤنث به «sasti» و «mehngi» تبدیل می‌شوند؛ مثل «topi sasti hai» (کلاه ارزان است).
    note: یادآوری سریع قاعدهٔ مطابقت جنسیت در درس ۷؛ چون «topi» (کلاه) مؤنث است، به آن نیاز داریم.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: کلاه از کیف ارزان‌تر است.
    gloss: کلاه از کیف ارزان‌تر است.
    note: ساختار مقایسه‌ای با se، این بار برای دو شیء و نه دو شخص.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'مرور: بیشتر'
    gloss: بیشتر
    note: اولین بار در درس ۱۳ فقط همراه «pasand hai» (برای بیان ترجیح) آمد؛ این درس کاربرد آن را گسترش می‌دهد.
    example_gloss: من چای را بیشتر دوست دارم.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada در هر مقایسه‌ای
    gloss: قبلاً «zyada» را فقط با «pasand hai» یاد گرفتید (درس ۱۳). حالا می‌تواند پیش از هر صفتی در مقایسه هم بیاید؛ «bag topi se zyada mehnga hai» یعنی «کیف از کلاه گران‌تر است»، دقیقاً مثل «bag topi se mehnga hai». «Zyada» اختیاری است و فقط «بیشتر» را صریح‌تر می‌گوید.
    note: تعمیم جایگاه کلمه‌ای که قبلاً آموخته‌اید؛ نکتهٔ دستوری جدید نیست.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: کیف از کلاه گران‌تر است.
    gloss: کیف از کلاه گران‌تر است.
    note: همان ساختار مقایسه‌ای با se، این بار با «zyada» (بیشتر) که اختیاری است و صریح آمده.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: نو
    gloss: نو (مذکر / مؤنث)
    note: یک جفت صفت جدید که از همان الگوی مطابقت -a/-i مثل بقیهٔ صفت‌های این درس پیروی می‌کند.
    example_gloss:
    - کیف نو است.
    - کلاه نو است.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: کلاه از کیف نوتر است.
    gloss: کلاه از کیف نوتر است.
    note: یک ویژگی مقایسه‌ای دیگر (تازگی) بین همان دو شیء، هم‌راستا با مقایسهٔ قیمت که قبلاً آمد.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'مرور: بزرگ، کوچک، قدبلند، نو'
    gloss: بزرگ/بزرگ‌تر، کوچک/کوچک‌تر، قدبلند/بلند، نو
    note: مرور سریع صفت‌های اصلی این درس که برای گفت‌وگو و متن خواندنی لازم است.
    example_gloss:
    - پریا بزرگ‌تر است.
    - آرجون کوچک‌تر است.
    - آرجون قدبلند است.
    - کیف نو است.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'مرور: من، هستم'
    gloss: من، هستم
    note: اولین بار در درس ۱ آمد («main theek hun»)؛ برای اینکه آرجون در گفت‌وگو دربارهٔ خودش حرف بزند لازم است.
    example_gloss: من خوبم.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'مرور: و، هم'
    gloss: و، هم
    note: هر دو کلمه قبلاً در متن گفت‌وگوها آمده‌اند، اما اینجا برای اولین بار به‌عنوان واژگان قابل آزمون معرفی می‌شوند.
    example_gloss:
    - من چای و قهوه دوست دارم.
    - من هم دوستش دارم.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'مرور: نشانهٔ مالکیت (مال)'
    gloss: مال (نشانهٔ مالکیت)
    note: نشانهٔ مالکیتی که در سراسر دوره (مثلاً درس‌های ۵ تا ۱۱) به کار رفته؛ اینجا برای گفتن اینکه کیفِ چه کسی مقایسه می‌شود، دوباره می‌آید.
    example_gloss: کیف آرجون نو است.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: آرجون کیف نویش را نشان می‌دهد
    gloss: پریا، این کیف نوی من است.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید کلاه ارزان‌تر است
    gloss: کیف قشنگی است! ولی کلاه از کیف ارزان‌تر است.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: آرجون قبول می‌کند که کیفش گران است
    gloss: آره. کیف من گران است؛ از کلاه گران‌تر است.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: پریا می‌پرسد چه کسی بزرگ‌تر است
    gloss: باشه، باشه! آرجون، چه کسی بزرگ‌تر است، تو یا من؟
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: آرجون جواب می‌دهد
    gloss: تو بزرگ‌تری، ولی من قدبلندم!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: پریا می‌گوید کلاه نوتر هم هست
    gloss: باشه، باشه! ولی کلاه از کیف نوتر هم هست.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: آرجون قبول می‌کند و گفت‌وگو را تمام می‌کند
    gloss: آره، درست است. فردا دوباره همدیگر را ببینیم؟
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: پریا گفت‌وگو را تمام می‌کند
    gloss: باشه! فردا می‌بینیم‌تان.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این درس: (۱) «X, Y se ADJ hai» یعنی «X از Y ADJ‌تر است»؛ (۲) صفت همیشه با جنسیت نهاد (X) مطابقت می‌کند، نه Y؛ (۳) «zyada» را هم می‌شود پیش از صفت آورد، مثل «X, Y se zyada ADJ hai»؛ معنی همان می‌ماند («ADJ‌تر از»).'
    note: جمع‌بندی پایانی که دستور کل این درس را به هم وصل می‌کند، شبیه نکتهٔ دستوری درس ۱۳.
    target_text: 'سه قاعدهٔ اصلی این درس: (۱) ''X, Y से ADJ है'' یعنی «X از Y ADJ‌تر است»؛ (۲) ADJ همیشه با جنسِ نهاد (X) مطابقت دارد، نه با Y؛ (۳) قبل از ADJ می‌توانید ''ज़्यादा'' هم اضافه کنید، مثل ''X, Y से ज़्यादा ADJ है'' -- معنی همان می‌ماند («ADJ‌تر از»).'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: یادداشت پریا
    gloss: من از ارجون بزرگ‌ترم، ولی ارجون قدبلنده. کلاهم هم قشنگه -- کلاه از کیف ارزون‌تره و از کیف نوتر هم هست. - پریا
    note: یادداشتی کوتاه که دقیقاً همان نکته‌هایی را که در گفت‌وگو آمد دوباره می‌گوید، بدون هیچ مطلب تازه‌ای.
    glosses:
      बड़ी: بزرگ‌تر
      लंबा: قدبلند
      टोपी: کلاه
      अच्छी: خوب
      बैग: کیف
      सस्ती: ارزان‌تر / ارزان
      नई: نوتر / نو
