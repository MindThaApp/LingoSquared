teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: привет
    note: '*Hallo* — неформальное универсальное приветствие, которое подходит в любое время суток, как русское «привет».'
    example_gloss: Привет, Феликс!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: доброе утро
    note: '*Guten Morgen* говорят утром, примерно до конца утра.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: добрый день / здравствуйте
    note: '*Guten Tag* — стандартное, чуть более официальное приветствие в дневное время: с конца утра и до вечера.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: добрый вечер
    note: '*Guten Abend* говорят, когда приходят куда-то вечером: это приветствие, а не прощание.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: пока
    note: '*Tschüss* — неформальный и очень распространённый способ попрощаться с друзьями и знакомыми.'
    example_gloss: Пока, до скорого!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: до свидания
    note: '*Auf Wiedersehen* буквально значит «до тех пор, пока мы снова не увидимся»: это стандартное, более официальное прощание, уместное с незнакомыми людьми и в деловой обстановке.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: до скорого
    note: '*Bis bald* — дружеское прощание, когда вы рассчитываете скоро снова увидеть человека.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: до скорого
    note: '*Bis später* говорят, когда вы увидитесь с человеком позже в тот же день.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: спокойной ночи
    note: '*Gute Nacht* говорят, когда кто-то идёт спать или заканчивает день. В отличие от *Guten Abend*, это прощание, а не приветствие.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: вы (вежливое)
    note: '*Sie* — вежливое «вы». Оно всегда пишется с большой буквы, даже в середине предложения, и употребляется с незнакомыми людьми, старшими по возрасту и в официальных или деловых ситуациях. Это то же различие, что между «ты» и «вы» в русском языке.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: ты
    note: '*du* — неформальное «ты», его используют с друзьями, родными и детьми. Если обратиться на *du* к незнакомому человеку, это может прозвучать слишком фамильярно или даже грубо.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Как у вас дела?
    note: Вежливый способ спросить, как у человека дела. *Ihnen* — это «вы» в дательном падеже в вежливой форме, она соответствует *Sie*.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Как дела?
    note: '*Wie geht''s* — сокращение от *Wie geht es*: обычный неформальный вопрос о том, как дела.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Хорошо, спасибо.
    note: Простой нейтральный ответ, подходящий и для официального, и для неформального общения.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Очень хорошо, спасибо.
    note: Более бодрый ответ, чем *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: А у вас?
    note: Вежливый способ задать встречный вопрос, в том же регистре, что и *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: А у тебя?
    note: 'Неформальный способ задать встречный вопрос: *dir* — это «ты» в дательном падеже, оно соответствует *du*.'
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: спасибо
    note: '*Danke* уже встречалось в ответах выше, а здесь это отдельное слово.'
    example_gloss: Большое спасибо!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: пожалуйста
    note: 'У слова *Bitte* действительно два распространённых значения, в зависимости от ситуации: «пожалуйста» в просьбе и «пожалуйста», «не за что» в ответ на благодарность. Какое из них имеется в виду, понятно из контекста. Это не совпадение и не ошибка: оба употребления совершенно нормальны.'
    example_gloss:
    - Кофе, пожалуйста.
    - Не за что!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: извините / простите
    note: '*Entschuldigung* используют и чтобы вежливо привлечь внимание, и чтобы коротко извиниться.'
    example_gloss: Извините, где туалет?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: без проблем
    note: Непринуждённый дружеский ответ, по тону похожий на русское «без проблем».
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: не за что
    note: Более полный и явный способ сказать «не за что», чем короткое *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Анна здоровается с Феликсом
    gloss: 'Анна говорит: Добрый день!'
    note: Анна и Феликс впервые встречаются как соседи по дому.
  de.a1.unit01.lesson05.teach.line02:
    title: Феликс отвечает на приветствие и спрашивает, как у неё дела
    gloss: 'Феликс говорит: Добрый день! Как у вас дела?'
    note: Феликс говорит ей *Sie*, потому что они только что познакомились.
  de.a1.unit01.lesson05.teach.line03:
    title: Анна отвечает и задаёт встречный вопрос
    gloss: 'Анна говорит: Спасибо, хорошо. А у вас?'
    note: Анна отвечает и вежливо возвращает вопрос, как и Феликс.
  de.a1.unit01.lesson05.teach.line04:
    title: Феликс отвечает
    gloss: 'Феликс говорит: Очень хорошо, спасибо.'
    note: Чуть более бодрый ответ, чем простое *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Анна прощается
    gloss: 'Анна говорит: До свидания!'
    note: Анна использует более официальное прощание, как и во всём остальном разговоре на *Sie*.
  de.a1.unit01.lesson05.teach.line06:
    title: Феликс прощается и говорит «до скорого»
    gloss: 'Феликс говорит: До свидания, до скорого!'
    note: Феликс соединяет официальное прощание с «до скорого» и остаётся в рамках *Sie*, на котором оба говорили всю первую встречу.
