teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: Который час?
    note: Буквально «Как поздно?» — стандартный способ спросить, который час.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Три часа.
    note: '*Uhr* = «час» (ровно столько-то часов). Целый час — это число + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Половина четвёртого (3:30).
    note: 'Половину часа немцы называют по следующему часу, как и в русском «половина четвёртого»: *halb vier* = «половина четвёртого» = 3:30, а не 4:30.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Пять часов.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Четверть четвёртого (3:15).
    note: '*Viertel* — «четверть»; *nach* — «после».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Без четверти четыре (3:45).
    note: '*vor* — «до, перед».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Десять минут пятого (4:10).
    note: 'Сначала минуты, затем *nach* и час, который уже прошёл: zehn nach vier = 4:10.'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Без десяти пять (4:50).
    note: 'Сначала минуты, затем *vor* и ближайший следующий час, как в русском «без десяти пять»: zehn vor fünf = 4:50.'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: утро
    note: '*Morgen* — существительное «утро», примерно с 6 до 12 часов.'
    example_gloss: Доброе утро, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: полдень
    note: '*Mittag* — это сам полдень, середина между Morgen и Nachmittag.'
    example_gloss: Сейчас полдень.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: время после полудня
    note: '*Nachmittag* — примерно с 12 до 18 часов.'
    example_gloss: Я работаю во второй половине дня.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: вечер
    note: '*Abend* — примерно с 18 до 22 часов.'
    example_gloss: Добрый вечер, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: ночь
    note: '*Nacht* — примерно с 22 до 6 часов.'
    example_gloss: Спокойной ночи, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: полночь
    note: '*Mitternacht* — это ровно 12 часов ночи, то есть 0 Uhr.'
    example_gloss: Вечеринка заканчивается в полночь.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: восемнадцать
    note: '*achtzehn* = 18; здесь используется 24-часовой формат для официального времени работы (achtzehn Uhr = 18:00).'
    example_gloss: Магазин закрывается в 18:00.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: Магазин открывается в девять утра.
    note: '*um* + время = «в» такое-то время; *morgens* = «утром».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: Магазин закрывается в 18:00.
    note: '*schließt* = «закрывается». Официальные часы работы указывают в 24-часовом формате.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: когда
    note: '*Wann* начинает вопрос о времени.'
    example_gloss: Когда вы придёте?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: открывается
    note: '*öffnet* — форма 3-го лица единственного числа от *öffnen* («открывать(ся)»); *die* — определённый артикль женского рода и множественного числа, он стоит при *die Bibliothek*.'
    example_gloss: Когда открывается библиотека?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: библиотека
    note: '*Bibliothek* — существительное женского рода (*die Bibliothek*), то же место, что и в разделе 4.'
    example_gloss: Я иду в библиотеку.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: она; они
    note: 'Здесь *sie* — местоимение 3-го лица, которое заменяет существительное женского рода *die Bibliothek*: «она». Не путай его с *Sie* с заглавной буквы (вежливое «вы»): так Anna и Felix обращаются друг к другу.'
    example_gloss: Мне нравится библиотека. Я часто бываю в ней.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: тогда
    note: '*dann* здесь входит в прощание *Bis dann!* («До встречи!»).'
    example_gloss: До встречи!
  de.a1.unit05.lesson04.teach.line01:
    title: Феликс спрашивает о библиотеке
    gloss: 'Феликс говорит: Когда открывается библиотека?'
  de.a1.unit05.lesson04.teach.line02:
    title: Анна отвечает
    gloss: 'Анна говорит: Она открывается в девять утра.'
    note: '*Sie* здесь значит «она» и относится к *die Bibliothek*. С заглавной буквы оно написано только потому, что стоит в начале предложения.'
  de.a1.unit05.lesson04.teach.line03:
    title: Феликс задаёт уточняющий вопрос
    gloss: 'Феликс говорит: А когда она закрывается?'
  de.a1.unit05.lesson04.teach.line04:
    title: Анна отвечает снова
    gloss: 'Анна говорит: Она закрывается в 18:00.'
  de.a1.unit05.lesson04.teach.line05:
    title: Феликс прощается
    gloss: 'Феликс говорит: Хорошо, до встречи!'
  de.a1.unit05.lesson04.teach.schild:
    title: Табличка на двери
    gloss: 'Часы работы: с 9:00 до 18:00.'
    note: '*Öffnungszeiten* = «часы работы»; *bis* = «до».'
