  de.a1.unit11.lesson02.teach.line02:
    title: Анна рассказывает о своём утре
    gloss: 'Анна: Я встаю в семь часов. Потом я завтракаю.'
    note: Два действия распорядка дня по порядку.
    example_gloss: 'В контексте: Я встаю в семь часов.'
  de.a1.unit11.lesson02.teach.line03:
    title: Феликс спрашивает о работе
    gloss: 'Феликс: Вы сегодня работаете?'
    note: Вежливое *Sie* и форма глагола *arbeiten*.
  de.a1.unit11.lesson02.teach.line04:
    title: Анна рассказывает об остальной части дня
    gloss: 'Анна: Да, днём я работаю в кафе. Вечером я учу немецкий, а в десять часов ложусь спать.'
    note: Связный рассказ о распорядке дня можно построить из нескольких коротких предложений.
    example_gloss: 'В контексте: Да, днём я работаю в кафе.'
