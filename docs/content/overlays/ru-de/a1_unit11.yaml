  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: Потом я завтракаю.
    note: 'После *dann* в немецком глагол обычно стоит сразу следом: *Dann frühstücke ich*, а не *Dann ich frühstücke*. В русском порядок слов свободнее, а в немецком глагол здесь должен быть на втором месте.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: Когда вы встаёте?
    note: Вопрос с вежливым *Sie*; отделяемая приставка *auf* стоит в конце.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: Я встаю в семь часов.
