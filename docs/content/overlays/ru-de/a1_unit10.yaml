teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Поверни налево.
    note: '*abbiegen* (поворачивать) — глагол с отделяемой приставкой: приставка *ab* уходит в самый конец предложения: *Biegen Sie... ab*, а не *Sie biegen ab* и не *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Поверни направо.
