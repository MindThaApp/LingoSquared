    title: Wegbeschreibung zur Apotheke
    gloss: Как пройти к аптеке
    note: Короткое письменное объяснение дороги из нескольких уже знакомых фраз.
  de.a1.unit10.lesson04.teach.line01:
    title: Феликс спрашивает дорогу
    gloss: 'Феликс: Извините, как мне пройти к банку?'
    note: Та же вежливая фраза для начала разговора, что и в уроке 9, но теперь вопрос о маршруте, а не просто о месте.
  de.a1.unit10.lesson04.teach.line02:
    title: Анна объясняет маршрут
    gloss: 'Анна: Идите прямо, потом на углу поверните налево.'
    note: Полный ответ соединяет два шага маршрута словом *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Феликс уточняет и спрашивает дальше
    gloss: 'Феликс: На углу налево, хорошо. Это далеко?'
    note: Феликс повторяет указание, чтобы убедиться, что понял, и задаёт естественный дополнительный вопрос.
  de.a1.unit10.lesson04.teach.line04:
    title: Анна отвечает, как далеко идти
    gloss: 'Анна: Нет, это всего в двух минутах отсюда. Вы не пропустите.'
    note: Полный и успокаивающий ответ.
