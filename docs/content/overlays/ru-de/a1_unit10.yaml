  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Иди прямо.
    note: '*geradeaus* значит «прямо»: отделяемой приставки здесь нет, это более простая вежливая форма повелительного наклонения.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Остановитесь здесь.
    note: '*anhalten* (останавливаться) тоже с отделяемой приставкой: *an* уходит в конец, как и в *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: угол
    note: '*Ecke* значит «угол»; существительное женского рода: *die Ecke*.'
    example_gloss: На углу поверните налево.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Как мне пройти к банку?
    note: '*zur* — слитная форма от *zu der* (дательный падеж женского рода, die Bank). Так же слиты von и dem в *vom* из урока 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Идите прямо, потом на углу поверните налево.
    note: '*dann* (потом) связывает два шага маршрута; *an der Ecke* (на углу) — это артикль женского рода в дательном падеже, как в предлогах места из урока 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: Это далеко?
    note: '*weit* значит «далеко».'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: Это всего в двух минутах отсюда.
    note: '*nur* значит «только», «всего».'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Вы не пропустите.
    note: '*verfehlen* значит «пропустить» (не найти). Буквально: «Это можете вы не пропустить».'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Поверните в первую улицу налево.
    note: '*erste* значит «первый»: это порядковое числительное. Как и в русском, оно согласуется с существительным, поэтому здесь у него окончание.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Поверните во вторую улицу направо.
    note: '*zweite* значит «второй».'
