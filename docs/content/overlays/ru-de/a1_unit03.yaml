teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: ноль, один, два, три, четыре
    note: Немецкие цифры от 0 до 4.
    example_gloss:
    - У меня ноль яблок.
    - Я номер один!
    - У меня два яблока.
    - У меня три яблока.
    - У меня четыре яблока.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: пять, шесть, семь, восемь, девять, десять
    note: Немецкие цифры от 5 до 10.
    example_gloss:
    - У меня пять яблок.
    - У меня шесть яблок.
    - У меня семь яблок.
    - У меня восемь яблок.
    - У меня девять яблок.
    - У меня десять яблок.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: одиннадцать, двенадцать
    note: '*elf* и *zwölf* образуются нерегулярно: они не следуют модели, по которой строятся числа начиная с 13. В русском 11 и 12 тоже образуются по-своему, на -надцать.'
    example_gloss:
    - Номер моего дома — одиннадцать.
    - Номер моего дома — двенадцать.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: тринадцать, четырнадцать, пятнадцать, шестнадцать
    note: 'Начиная с 13 немецкие числительные образуются из основы + *-zehn*, как русские числительные на «-надцать» (ср. также суффикс *-teen* в других языках). Обрати внимание: *sechzehn*, а не *sechszehn* — буква *s* выпадает.'
    example_gloss:
    - Номер моего дома — тринадцать.
    - Номер моего дома — четырнадцать.
    - Номер моего дома — пятнадцать.
    - Номер моего дома — шестнадцать.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: семнадцать, восемнадцать, девятнадцать, двадцать
    note: 'Обрати внимание: *siebzehn*, а не *siebenzehn* — окончание *-en* в слове *sieben* перед *-zehn* пропадает.'
    example_gloss:
    - Номер моего дома — семнадцать.
    - Номер моего дома — восемнадцать.
    - Номер моего дома — девятнадцать.
    - Номер моего дома — двадцать.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: тридцать, сорок, пятьдесят
    note: 'Обрати внимание: *dreißig*, а не *dreizig* — число 30 оканчивается на *-ßig*, а не на *-zig* (20, *zwanzig*, тоже образуется нерегулярно).'
    example_gloss:
    - Это стоит тридцать евро.
    - Это стоит сорок евро.
    - Это стоит пятьдесят евро.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: шестьдесят, семьдесят, восемьдесят, девяносто
    note: 'Начиная с 40 модель регулярная: цифра + *-zig* (с теми же сокращениями *sech-* и *sieb-*, что и в числах от 13 до 19).'
    example_gloss:
    - Это стоит шестьдесят евро.
    - Это стоит семьдесят евро.
    - Это стоит восемьдесят евро.
    - Это стоит девяносто евро.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: сто
    note: '*hundert* само по себе означает «сто» — *ein* перед ним не нужно (возможно и *einhundert*, но в повседневной речи это встречается реже).'
    example_gloss: Это стоит сто евро.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: двадцать один
    note: 'В немецких составных числах от 21 до 99 порядок обратный русскому: сначала единицы, потом *und* («и»), потом десятки, и всё это одно слово. *einundzwanzig* = *ein* (один) + *und* (и) + *zwanzig* (двадцать), буквально «один-и-двадцать».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: тридцать два
    note: 'Та же модель: *zwei* (два) + *und* + *dreißig* (тридцать) = «два-и-тридцать» = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Сколько вам лет? (вежливо)
    note: '*alt* означает «старый»; буквально: «как стары вы».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Сколько тебе лет? (неформально)
    note: Неформальный вариант, с *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Мне двадцать восемь лет.
    note: '*Jahre alt* («лет») всегда стоит после числа. Немецкая конструкция другая: не «мне ... лет», а буквально «я есть ... лет старый»: Ich bin ... Jahre alt.'
  de.a1.unit03.lesson05.teach.line01:
    title: Феликс спрашивает, сколько Анне лет
    gloss: 'Феликс говорит: Сколько вам лет, если можно спросить?'
    note: '*wenn ich fragen darf* («если можно спросить») смягчает вопрос, который иначе мог бы прозвучать слишком прямо. Это вежливая формула, уместная при их обращении на *Sie*.'
  de.a1.unit03.lesson05.teach.line02:
    title: Анна отвечает и спрашивает в ответ
    gloss: 'Анна говорит: Мне двадцать восемь лет. А вам?'
    note: Анна называет свой возраст и задаёт встречный вопрос — так же, как в уроке 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Феликс отвечает
    gloss: 'Феликс говорит: Мне тридцать один год.'
    note: Выходит, Феликс старше Анны на три года.
