  de.a1.unit06.lesson04.teach.line03:
    title: Феликс спрашивает, кто это
    gloss: 'Феликс говорит: Кто это?'
  de.a1.unit06.lesson04.teach.line04:
    title: Анна представляет свою сестру
    gloss: 'Анна говорит: Это моя сестра. Моя сестра — учительница.'
    note: 'Перед названием профессии в немецком нет артикля: *Meine Schwester ist Lehrerin* = «Моя сестра — учительница». *Lehrerin* — женская форма от *Lehrer*.'
  de.a1.unit06.lesson04.teach.line05:
    title: Феликс спрашивает о братьях
    gloss: 'Феликс говорит: У вас есть братья?'
