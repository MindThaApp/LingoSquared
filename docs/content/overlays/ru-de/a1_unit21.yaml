units:
  de.a1.unit21.kleidung:
    title: Одежда
teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: одежда
    note: '*Kleidung* — общее слово для одежды.'
    example_gloss: Я покупаю одежду.
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: рубашка
    note: '*Hemd* — рубашка, часто на пуговицах.'
    example_gloss: Я ищу рубашку.
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: брюки
    note: 'По-русски говорят «брюки» во множественном числе, а *Hose* в немецком — единственное число: так называют одни брюки.'
    example_gloss: Я ищу брюки.
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: куртка
    note: '*Jacke* — существительное женского рода: die Jacke.'
    example_gloss: Куртка тёплая.
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: Я ищу рубашку.
    note: '*suche* пригодится в магазине: «я ищу».'
    example_gloss: Я ищу куртку.
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: размер
    note: '*Größe* — это размер одежды.'
    example_gloss: Размер M, пожалуйста.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: синий
    note: Говоря о цвете, по-немецки можно сказать *in Blau* (буквально «в синем»).
    example_gloss: Я ищу рубашку синего цвета.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: красный
    note: '*rot* означает «красный».'
    example_gloss: Куртка красная.
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: Рубашка подходит.
    note: Про одежду *passt* значит «подходит по размеру».
    example_gloss: 'В контексте: Да, рубашка подходит.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: Я ищу синюю рубашку, размер M.
    note: В просьбе названы вещь, цвет и размер.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: этикетка на одежде
    note: На этикетке могут быть указаны цвет, размер и цена.
    example_gloss: 'Цвет: синий. Размер: M.'
  de.a1.unit21.lesson02.teach.line01:
    title: Продавец спрашивает
    gloss: 'Продавец: Здравствуйте. Что вы ищете?'
    note: Продавец спрашивает покупателя, что он ищет.
    example_gloss: Что вы ищете?
  de.a1.unit21.lesson02.teach.line02:
    title: Феликс называет вещь, цвет и размер
    gloss: 'Феликс: Я ищу синюю рубашку, размер M.'
    note: Феликс называет все три нужные детали.
  de.a1.unit21.lesson02.teach.line03:
    title: Продавец предлагает рубашку
    gloss: 'Продавец: Пожалуйста. Хотите купить её?'
    note: Вежливое *Sie* сохраняет вежливый тон разговора в магазине.
    example_gloss: Хотите купить её?
  de.a1.unit21.lesson02.teach.line04:
    title: Феликс проверяет, подходит ли рубашка, и спрашивает цену
    gloss: 'Феликс: Да, рубашка подходит. Сколько она стоит?'
    note: Феликс говорит, что рубашка подходит, и спрашивает цену.
    example_gloss: 'В контексте: Да, рубашка подходит.'
