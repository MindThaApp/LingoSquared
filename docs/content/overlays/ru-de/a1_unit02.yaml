teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: Как вас зовут?
    note: '*Wie heißen Sie?* буквально спрашивает «как вы называетесь», с вежливым *Sie* из раздела 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Меня зовут Анна.
    note: '*heißen* значит «называться, зваться» — так обычно говорят своё имя.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: Как тебя зовут?
    note: Неформальный вариант с *du* из раздела 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Меня зовут Феликс.
    note: Та же конструкция, что и *Ich heiße Anna*, только другое имя.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Приятно познакомиться.
    note: Короткий и распространённый способ сказать, что рад знакомству; подходит и для «вы», и для «ты».
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Взаимно.
    note: Естественный ответ на *Freut mich* — буквально «полностью с моей стороны».
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: я
    note: '*ich* пишется со строчной буквы, кроме начала предложения (как в *Ich bin Anna.*) — так же, как русское «я».'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: ты
    note: Уже встречалось в разделе 1 — здесь повторяем как подлежащее в полном предложении.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Я Анна.
    note: '*bin* — форма глагола *sein* («быть») для *ich*.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Ты Феликс.
    note: '*bist* — форма глагола *sein* для *du*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Германия
    note: 'Названия стран в немецком обычно употребляются без артикля: просто *Deutschland*, а не *das Deutschland*.'
    example_gloss: Я из Германии.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Англия
    note: Читается по-немецки, примерно «Энглант».
    example_gloss: Я из Англии.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Франция
    note: 'Обрати внимание на немецкое написание: Frankreich, а не *France*.'
    example_gloss: Я из Франции.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: Италия
    note: Читается примерно «италиен», ударение на второй слог.
    example_gloss: Я из Италии.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: Испания
    note: Читается примерно «шпаниен», ударение на первый слог.
    example_gloss: Я из Испании.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: Россия
    note: Состоит из *Russ-* и *-land*, как *Deutschland*.
    example_gloss: Я из России.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: Откуда вы?
    note: '*Woher* значит «откуда»: в одном слове уже заключено «из», как и в русском «откуда».'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Я из Германии.
    note: '*aus* и название страны указывают происхождение; слова для национальности пока не нужны.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: Откуда ты?
    note: Неформальный вариант с *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: Я из Англии.
    note: Та же конструкция, что и *Ich komme aus Deutschland*, только другая страна.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: А вы?
    note: Короткий способ задать встречный вопрос в том же вежливом регистре, с *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Феликс приветствует Анну
    gloss: 'Феликс говорит: «Добрый день!»'
    note: Феликс и Анна — соседи, которые уже встречались раньше (раздел 1), но не называли друг другу имён. Сейчас они снова столкнулись на автобусной остановке.
  de.a1.unit02.lesson05.teach.line02:
    title: Анна отвечает на приветствие и спрашивает его имя
    gloss: 'Анна говорит: Добрый день! Как вас зовут?'
    note: Анна обращается на вежливое *Sie* — так же, как они говорили друг с другом, будучи незнакомыми, в Модуле 1.
  de.a1.unit02.lesson05.teach.line03:
    title: Феликс называет своё имя и спрашивает в ответ
    gloss: 'Феликс говорит: Меня зовут Феликс. А вас?'
    note: Феликс отвечает и вежливо задаёт тот же вопрос в ответ.
  de.a1.unit02.lesson05.teach.line04:
    title: Анна называет своё имя
    gloss: 'Анна говорит: Меня зовут Анна. Приятно познакомиться.'
    note: Анна отвечает тем же и добавляет вежливую фразу.
  de.a1.unit02.lesson05.teach.line05:
    title: Феликс отвечает и спрашивает, откуда она
    gloss: 'Феликс говорит: Мне тоже. Откуда вы?'
    note: Феликс отвечает на вежливую фразу и переводит разговор на то, откуда они родом.
  de.a1.unit02.lesson05.teach.line06:
    title: Анна отвечает и спрашивает в ответ
    gloss: 'Анна говорит: Я из Германии. А вы?'
    note: 'Это подтверждает, что Анна немка: она и Феликс живут по соседству в немецкоязычном городе.'
  de.a1.unit02.lesson05.teach.line07:
    title: Феликс отвечает
    gloss: 'Феликс говорит: Я из Англии.'
    note: Теперь мы узнаём, что Феликс родом из Англии — это сосед-англичанин, живущий в Германии.
  de.a1.unit02.lesson05.teach.line08:
    title: Анна прощается
    gloss: 'Анна говорит: До свидания!'
    note: Вежливое прощание из Модуля 1 — оно соответствует их общению на *Sie*.
  de.a1.unit02.lesson05.teach.line09:
    title: Феликс прощается
    gloss: 'Феликс говорит: До свидания!'
    note: Феликс заканчивает так же, сохраняя тот же стиль общения на протяжении всей встречи.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Короткая анкета
    gloss: 'Имя: Феликс. Страна: Англия.'
    note: Простая анкета с именем и одним фактом о человеке — теми же сведениями, которые Феликс назвал вслух в диалоге.
