course:
  title: Немецкий язык A1
  description: 'Немецкий для начинающих: как описать основную внешность человека — рост и впечатление о возрасте, цвет волос и глаз, главный вопрос Wie sieht ... aus? и сравнение внешности двух людей.'
units:
  de.a1.unit55.aussehen:
    title: Описываем внешность
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Высокий, низкий, пожилой и молодой
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Описываем волосы
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Глаза и вопрос «Как выглядит человек?»
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna описывает Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Сравниваем Jonas и Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix узнаёт Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Groß* описывает высокого человека, а *klein* — невысокого. О росте людей по-немецки говорят groß (буквально «большой»), а не lang («длинный»).'
    example_gloss:
    - Lena высокая.
    - Jonas невысокий.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Alt* и *jung* здесь передают общее впечатление о возрасте, а не точное число лет.'
    example_gloss:
    - Дедушка пожилой.
    - Felix молодой.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: число или впечатление'
    gloss: Alt может стоять с числом лет, как в Ich bin dreißig Jahre alt, или передавать общее впечатление, как в Opa ist alt.
    note: 'Точный возраст можно спросить так: *Wie alt bist du?* Здесь же *alt* описывает, насколько старым человек ВЫГЛЯДИТ, без указания числа.'
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena высокая, а Jonas невысокий
    gloss: Lena высокая, а Jonas невысокий.
    note: Простое сложное предложение с *und* («и»); оно готовит прямое сравнение в уроке 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Волосы
    gloss: волосы
    note: '*Haare* — существительное во множественном числе: *die Haare*. В немецком есть и единственное число das Haar, но о волосах на голове обычно говорят Haare.'
    example_gloss: У Felix короткие чёрные волосы.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'Три цвета волос: blond, braun, grau. Перед существительным во множественном числе без артикля они получают окончание -e: blonde, braune, graue Haare.'
    example_gloss:
    - У Anna светлые волосы.
    - У Jonas каштановые волосы.
    - У дедушки седые волосы.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Kurz* («короткий») и *lang* («длинный») описывают длину волос. Снова окончание -e: kurze Haare, lange Haare.'
    example_gloss:
    - У Lena длинные волосы.
    - У Jonas короткие волосы.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: У Haare окончание -e
    gloss: 'Haare — это множественное число без артикля, поэтому прилагательное оканчивается на -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Без артикля прилагательное перед существительным во множественном числе получает окончание -e. Это та же модель, что и с *Augen* в уроке 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: её'
    gloss: 'Ihre здесь значит «её»: ihre Haare = её волосы. У Anna длинные волосы, и её волосы светлые.'
    note: '*Ihre* с маленькой буквы — притяжательное «её», оно согласуется с существительным во множественном числе Haare. С большой буквы *Ihre* означает «ваши» (вежливая форма).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: У Felix короткие чёрные волосы
    gloss: У Felix короткие чёрные волосы.
    note: 'Снова *schwarz* («чёрный»), теперь для волос: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: У Anna длинные светлые волосы
    gloss: У Anna длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Глаза
    gloss: глаза
    note: '*Augen* — множественное число от *das Auge*. По-немецки обычно говорят во множественном числе, ведь глаз два.'
    example_gloss: У Felix карие глаза.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: 'Цвета: blau («синий, голубой»), braun («коричневый, карий») и grün («зелёный»).'
    example_gloss:
    - У Anna голубые глаза.
    - У Jonas карие глаза.
    - У Lena зелёные глаза.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: У Augen окончание -e
    gloss: 'Augen — множественное число, поэтому прилагательное оканчивается на -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'То же правило, что и для Haare: отсутствие артикля и существительное во множественном числе дают окончание -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Как выглядит Anna?
    gloss: Как выглядит Anna?
    note: '*Wie sieht ... aus?* — главный вопрос этого раздела. Глагол *aussehen* отделяемый: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: У Anna длинные светлые волосы и голубые глаза
    gloss: У Anna длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза в одном предложении через *und*.'
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna представляет Nina
    gloss: 'Anna: В языковое кафе приходит новая девушка. Её зовут Nina.'
    note: '*Ein neues Mädchen kommt* вводит нового человека. После *kommt* направление *ins* (in das) Sprachcafé требует аккузатива.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix спрашивает, как она выглядит
    gloss: 'Felix: Хорошо! Как она выглядит?'
    note: 'Снова главный вопрос раздела, теперь с *sie* («она») вместо имени: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna описывает рост и волосы Nina
    gloss: 'Anna: Она невысокая, и у неё короткие светлые волосы.'
    note: 'Здесь *klein* сочетается с лексикой о волосах из урока 02. Второе *sie* опущено: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix спрашивает о её глазах
    gloss: 'Felix: А её глаза?'
    note: '*Ihre* здесь значит «её» (притяжательное), а не форма от «вы». Оно согласуется с существительным во множественном числе Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Анна описывает глаза Нины
    gloss: 'Анна: У неё зелёные глаза.'
    note: Повторяется выражение *grüne Augen* из урока 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Феликс узнает её
    gloss: 'Феликс: Спасибо! Тогда я её точно узнаю.'
    note: '*Dann erkenne ich sie bestimmt* означает «тогда я её точно узнаю». После *dann* глагол стоит на втором месте: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Сравниваем Йонаса и Лену
    gloss: Йонас и Лена — брат и сестра, но выглядят они по-разному. Йонас невысокий, у него короткие каштановые волосы и карие глаза. Лена выше Йонаса, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      Bruder: брат
      Schwester: сестра
      sehen: выглядеть
      unterschiedlich: разный
      klein: невысокий
      kurze: невысокий
      braune: карий
      Haare: волосы
      Augen: глаза
      größer: выше
      lange: длинный
      grüne: зелёный
      aus: (часть глагола 'aussehen' = выглядеть)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: Снова сравнительная степень
    gloss: 'Ты уже знаешь модель: прилагательное + -er + als («чем»). Здесь она используется для людей: Lena ist größer als Jonas — Лена выше Йонаса.'
    note: 'Та же модель *-er + als*, что и в теме о сравнениях. Groß превращается в größer: гласная получает умлаут.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: У Лены волосы длиннее, чем у Йонаса
    gloss: У Лены волосы длиннее, чем у Йонаса.
    note: '*Längere Haare*: länger перед существительным во множественном числе без артикля принимает окончание -e, а lang в сравнительной степени получает умлаут.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: Образец предложения от первого лица с *Ich habe ...*; его можно использовать, когда ты описываешь свою внешность.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Феликс замечает Нину
    gloss: 'Феликс: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Schau mal* («взгляни-ка») — дружелюбный способ на что-то указать. Это форма повелительного наклонения для ty.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Анна подтверждает
    gloss: 'Анна: Да, это Нина!'
    note: Короткое естественное подтверждение.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Нина здоровается с Феликсом
    gloss: 'Нина: Привет, ты Феликс?'
    note: 'Простой неформальный вопрос: *bist du ...?* («ты ...?»). Bist — форма sein для du.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Феликс отвечает на приветствие Нины
    gloss: 'Феликс: Да! Приятно познакомиться, Нина.'
    note: '*Freut mich* — стандартная фраза при первой встрече, как в уроке 2. Тому, кого ты уже знаешь, скажешь *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Диалог завершается: Феликс успешно узнал Нину по описанию Анны.'
