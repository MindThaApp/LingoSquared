    title: Ausführen — отделяемый глагол
    gloss: 'Ausführen — отделяемый глагол, как и aufstehen: ich führe den Hund aus.'
    note: Тот же образец отделяемых глаголов (основа + ... + приставка в конце), что и у глаголов распорядка дня.
  de.a1.unit56.lesson02.teach.futter_geben:
