  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Множественное число в немецком образуется по-разному: der Hund → die Hunde, die Katze → die Katzen, der Vogel → die Vögel. Учи множественное число вместе с каждым существительным.'
    note: Здесь впервые показаны типичные способы образования множественного числа — на примере названий животных.
