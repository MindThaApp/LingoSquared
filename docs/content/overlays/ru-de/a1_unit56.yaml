    gloss: Феликс и Лена оба любят животных, но ни у одного из них нет питомца. Феликс любит собак, а Лена любит кошек. А у Йонаса есть питомец — кошка. Он часто играет со своей кошкой и каждый день её кормит. А у тебя есть домашнее животное?
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
