  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: 'Тот же вопросительный образец *Hast du ...?*, который ты знаешь из прежних уроков: глагол стоит на первом месте.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: '*Kein* отрицает существительное *ein Haustier*: см. грамматическую заметку.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: отрицание существительного'
    gloss: 'Kein говорит «нет» существительному, при котором стоял бы ein-: Ich habe einen Hund, но Ich habe kein Haustier.'
    note: '*Kein* заменяет *ein* в отрицательном предложении и принимает те же окончания: ein Haustier → kein Haustier, einen Hund → keinen Hund. Для отрицания глаголов и прилагательных используется *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
