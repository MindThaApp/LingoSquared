    title: gestern
    gloss: вчера
    note: '*gestern* помещает событие в недавнее прошлое.'
    example_gloss: Вчера я был в парке.
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: Что вы делали вчера?
    note: О недавних завершённых событиях в немецком языке часто говорят с помощью *haben* и причастия прошедшего времени.
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: Я купил хлеб.
    note: Причастие *gekauft* стоит в конце.
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: Я съел суп.
    note: '*gegessen* — причастие прошедшего времени от *essen*.'
    example_gloss: 'В контексте: Я купил хлеб и съел суп.'
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: Я ходил на рынок.
    note: Движение к какому-то месту выражается с *bin ... gegangen*, а не с *habe ... gegangen*.
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: Было очень хорошо.
    note: '*war* — простое прошедшее время от *sein* (быть): *es ist* («это есть») превращается в *es war* («это было»).'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: краткий рассказ
    note: В рассказе несколько завершённых действий следуют одно за другим.
    example_gloss: Вчера я ходил на рынок.
  de.a1.unit13.lesson02.teach.line01:
    title: Феликс спрашивает о вчерашнем дне
    gloss: 'Феликс: Что вы делали вчера?'
    note: Стандартный способ спросить о вчерашнем дне.
  de.a1.unit13.lesson02.teach.line02:
    title: Анна рассказывает о своём дне
    gloss: 'Анна: Я ходила на рынок. Я купила хлеб и съела суп.'
    note: Анна использует *bin* для хождения и *habe* для покупки и еды.
    example_gloss: 'В контексте: Я купила хлеб.'
  de.a1.unit13.lesson02.teach.line03:
    title: Феликс спрашивает, как всё прошло
    gloss: 'Феликс: Было хорошо?'
    note: '*War es gut?* — вопрос о том, как прошло событие.'
  de.a1.unit13.lesson02.teach.line04:
    title: Анна говорит, что было хорошо
    gloss: 'Анна: Да, было очень хорошо.'
    note: Простая заключительная оценка.
