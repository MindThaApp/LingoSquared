teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: понедельник
    note: В немецкоязычных странах *Montag* — первый день недели, как и в России.
    example_gloss: В понедельник у меня есть время.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: вторник
    note: '*Dienstag* — второй день недели.'
    example_gloss: Во вторник у меня есть время.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: среда
    note: '*Mittwoch* буквально значит «середина недели» — это действительно средний день немецкой рабочей недели. Русское слово «среда» устроено так же.'
    example_gloss: В среду у меня есть время.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: четверг
    note: Название *Donnerstag* происходит от имени германского бога Донара (Тора).
    example_gloss: В четверг у меня есть время.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: пятница
    note: Название *Freitag* происходит от имени германской богини Фригг.
    example_gloss: В пятницу у меня есть время.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: суббота
    note: '*Samstag* — стандартное слово для субботы в большей части Германии; *Sonnabend* — региональный вариант (север и восток Германии).'
    example_gloss: В субботу у меня есть время.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: воскресенье
    note: '*Sonntag* буквально значит «день солнца».'
    example_gloss: В воскресенье у меня есть время.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Какой сегодня день?
    note: '*heute* значит «сегодня»; *Welcher Tag* — «какой день».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: январь
    note: '*Januar* — первый месяц года.'
    example_gloss: Мой день рождения в январе.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: март
    note: '*März* — третий месяц года.'
    example_gloss: Мой день рождения в марте.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: май
    note: '*Mai* — короткое слово, которое легко запомнить.'
    example_gloss: Мой день рождения в мае.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: июль
    note: '*Juli* — седьмой месяц года.'
    example_gloss: Мой день рождения в июле.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: сентябрь
    note: '*September* — девятый месяц года; слово похоже на русское «сентябрь».'
    example_gloss: Мой день рождения в сентябре.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: декабрь
    note: '*Dezember* — последний месяц года.'
    example_gloss: Мой день рождения в декабре.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Какой сейчас месяц?
    note: '*Monat* значит «месяц»; *es* — «это».'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Какое сегодня число?
    note: Буквально «который сегодня по счёту?» — стандартный способ спросить дату по-немецки.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Сегодня 7 июля.
    note: 'Как и в русском, по-немецки сначала называют день, потом месяц: *der siebte Juli* — «седьмое июля». Выучи *der siebte Juli* как целое выражение.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Сегодня вторник, 7 июля.
    note: Перед датой добавляется день недели, отделённый запятой.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: Можно также написать 7.7.
    note: 'В немецких числовых датах сначала идёт день, затем месяц, и после каждого числа ставится точка: 7.7. = 7 июля. Порядок тот же, что и в русском.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Когда у вас день рождения?
    note: 'Буквально это «Когда вы имеете день рождения?»: по-немецки день рождения *имеют*, а не говорят «у вас есть».'
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Мой день рождения — 3 марта.
    note: '*Mein Geburtstag* — «мой день рождения»; *der dritte März* — «3 марта» (сначала день, потом месяц).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: открывается
    note: '*öffnet* — форма 3-го лица единственного числа от *öffnen* (открывать); так говорят об открытии магазина, библиотеки и т. п.'
    example_gloss: Магазин открывается в понедельник.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: снова
    note: '*wieder* значит «снова»; здесь слово используется, чтобы спросить, когда что-то откроется вновь.'
    example_gloss: Библиотека снова открывается в понедельник.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: определённый артикль (жен. р. / мн. ч.)
    note: '*die* — определённый артикль для женского рода в единственном числе и для всех существительных во множественном числе; здесь он стоит при существительном женского рода *Bibliothek*.'
    example_gloss: Библиотека большая.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: библиотека
    note: '*Bibliothek* — существительное женского рода (*die Bibliothek*).'
    example_gloss: Я иду в библиотеку.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: в, на
    note: '*am* — слитная форма от *an dem*; употребляется с днями недели и датами (*am Montag* — «в понедельник»).'
    example_gloss: В понедельник я работаю.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: определённый артикль (муж. р., винительный падеж)
    note: '*den* — форма винительного падежа мужского рода от *der*. Она встречается в полных датах после дня недели, например *am Donnerstag, den neunten Juli*. Выучи это как готовую модель, не разбирая падеж на этом уровне. (После *am* можно встретить и *dem* — это тоже правильно.)'
    example_gloss: Мы встречаемся в четверг, девятого июля.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: девятый
    note: '*neunten* — склонённая форма порядкового числительного от *neun* (девять), которая используется в датах: *der neunte Juli* (именительный падеж) в такой полной дате превращается в *den neunten Juli*.'
    example_gloss: Мой день рождения девятого июля.
  de.a1.unit04.lesson04.teach.line01:
    title: Феликс спрашивает дату
    gloss: 'Феликс говорит: Какое сегодня число?'
  de.a1.unit04.lesson04.teach.line02:
    title: Анна называет дату
    gloss: 'Анна говорит: Сегодня вторник, 7 июля.'
  de.a1.unit04.lesson04.teach.line03:
    title: Феликс спрашивает про библиотеку
    gloss: 'Феликс говорит: Когда библиотека снова откроется?'
  de.a1.unit04.lesson04.teach.line04:
    title: Анна отвечает
    gloss: 'Анна говорит: Она снова откроется в четверг, 9 июля.'
    note: '*Sie* здесь значит «она» — слово относится к *die Bibliothek* (существительное женского рода).'
  de.a1.unit04.lesson04.teach.line05:
    title: Феликс прощается
    gloss: 'Феликс говорит: Хорошо, до четверга.'
    note: '*bis Donnerstag* — «до четверга»; так обычно говорят «до встречи в четверг».'
  de.a1.unit04.lesson04.teach.notiz:
    title: Записка на двери
    gloss: Закрыто до четверга, 9 июля.
    note: '*Geschlossen* значит «закрыто».'
