teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для хобби: *lesen* (читать), *Sport treiben* (заниматься спортом) и *kochen* (готовить). Sport — существительное, поэтому пишется с большой буквы.'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Свободное время
    gloss: свободное время
    note: '*Die Freizeit* — существительное женского рода: всегда учи его вместе с артиклем die. Это ключевое слово для разговора о хобби.'
    example_gloss: В свободное время я люблю читать.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Lese* — форма ich от глагола *lesen* (читать). Предложение начинается с обстоятельства времени, но глагол всё равно стоит на втором месте: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три выражения о хобби: *Musik hören* (слушать музыку), *zeichnen* (рисовать) и *Videospiele spielen* (играть в видеоигры). Musik и Videospiele — существительные, поэтому они пишутся с большой буквы.'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'По-немецки говорят *Musik hören*: глагол сочетается с существительным напрямую, без предлога.'
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Mit Freunden* (с друзьями): после mit всегда стоит датив, поэтому Freunde превращается в Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: 'Четыре основных наречия частоты: immer, oft, manchmal, nie. Обычно они стоят сразу после глагола: ich spiele nie.'
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Jede Woche* и *jedes Wochenende* значат «каждую неделю» и «каждые выходные», но окончание зависит от рода существительного: смотри следующую карточку.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede и jedes
    gloss: Die Woche — женского рода, поэтому jede Woche. Das Wochenende — среднего рода, поэтому jedes Wochenende.
    note: '*Woche* — женского рода (*die Woche*), поэтому с ним стоит *jede*; *Wochenende* — среднего рода (*das Wochenende*), поэтому с ним стоит *jedes*. Учи каждое существительное с артиклем, и окончание будет понятно.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Анна заводит разговор о хобби
    gloss: 'Анна: Мы часто вместе ходим гулять. А чем ты ещё занимаешься в свободное время, Феликс?'
    note: 'В предложении *Wir gehen oft zusammen spazieren* используется gehen и второй глагол: спрягаемый глагол gehen стоит на втором месте, а инфинитив spazieren уходит в конец.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Хобби Феликса
    gloss: 'Феликс: Я люблю готовить, и дома тоже. И я часто занимаюсь спортом.'
    note: '*Auch zu Hause* (и дома тоже) уточняет, что Феликс готовит для удовольствия, а не только на работе в ресторане.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Анна удивлена
    gloss: 'Анна: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: '*Den ganzen Tag* (весь день) стоит в аккузативе, поэтому der Tag становится den Tag. Выражения, обозначающие длительность времени, употребляются в аккузативе.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Феликс объясняет
    gloss: 'Феликс: Да, но готовить для меня — это расслабляет. А ты, что ты любишь делать?'
    note: В *Kochen finde ich entspannend* слово Kochen вынесено на первое место для выделения. Глагол всё равно остаётся на втором месте, поэтому ich идёт после него.
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Хобби Анны
    gloss: 'Анна: Я люблю читать и часто слушаю музыку.'
    note: Два глагола о хобби из уроков 01–02 объединены в одном предложении с помощью *und* (и).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Феликс спрашивает про игры
    gloss: 'Феликс: А ты играешь в видеоигры?'
    note: 'Короткий вопрос без вопросительного слова: глагол стоит на первом месте, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Анна отвечает
    gloss: 'Анна: Нет, я никогда не играю в видеоигры. Зато я иногда рисую!'
    note: '*Nie* (никогда) и *manchmal* (иногда) из урока 03 противопоставлены в одном ответе. Оба слова стоят сразу после глагола.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Сравниваем увлечения
    gloss: Мы с Феликсом часто ходим вместе гулять. Но у нас есть и другие хобби. Феликс любит готовить, и дома тоже, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Я иногда рисую, но никогда не играю в видеоигры. А чем ты любишь заниматься в свободное время?
    note: Сообщение Анны напоминает факты из урока 04 и заканчивается главным вопросом этого раздела к читателю.
    glosses:
      spazieren: гуляем
      oft: часто
      zusammen: вместе
      andere: другие
      kocht: готовит
      gern: нравится
      Hause: дома
      Sport: занимается спортом
      lese: читать
      höre: слушаю
      Musik: музыка
      zeichne: рисую
      manchmal: иногда
      spiele: играть в видеоигры
      nie: никогда
      freien: свободное
      Zeit: время
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Феликс спрашивает о выходных
    gloss: 'Феликс: Что ты делаешь на этих выходных?'
    note: У *dieses Wochenende* (эти выходные) окончание среднего рода -es, потому что das Wochenende — среднего рода.
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Анна ещё не решила
    gloss: 'Анна: Я ещё не знаю. Я люблю читать, но мне хочется и на улицу.'
    note: '*Nach draußen* (на улицу, буквально «наружу») — распространённый способ сказать, что хочется выйти из дома.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Феликс предлагает план
    gloss: 'Феликс: Пойдём вместе погуляем? А потом я приготовлю для нас.'
    note: '*Danach* (потом) стоит на первом месте, поэтому дальше идёт глагол, а за ним подлежащее: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Анна соглашается
    gloss: 'Анна: Отличная идея! Я люблю гулять, и готовить тоже люблю.'
    note: '*Gern* после глагола показывает, что тебе это нравится: ich gehe gern spazieren, ich koche gern. Оно сочетается почти с любым глаголом.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Феликс подтверждает
    gloss: 'Феликс: Отлично. Тогда увидимся в субботу!'
    note: 'Дружеская заключительная реплика, подтверждающая план на *Samstag* (субботу). С днями недели употребляется *am*: am Samstag.'
