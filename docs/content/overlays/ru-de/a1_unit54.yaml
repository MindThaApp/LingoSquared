course:
  title: Немецкий язык A1
  description: 'Немецкий для начинающих: как рассказать о занятиях в свободное время. Лексика о хобби, слова частоты, вопросы и ответы о том, чем человек занимается на досуге, и сравнение увлечений двух людей.'
