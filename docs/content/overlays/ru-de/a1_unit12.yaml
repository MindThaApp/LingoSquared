  de.a1.unit12.lesson01.teach.zeit_haben:
    title: Haben Sie morgen Zeit?
    gloss: У вас завтра есть время?
    note: В немецком для вопроса «есть ли время» используется сочетание *Zeit haben*, буквально «иметь время». В русском чаще говорят «есть время» без глагола «иметь».
  de.a1.unit12.lesson01.teach.gehen_wir:
    title: Gehen wir ins Museum?
    gloss: Пойдём в музей?
    note: '*Gehen wir...?* — краткий способ предложить что-то сделать вместе.'
  de.a1.unit12.lesson01.teach.ja_gern:
    title: Ja, gern.
    gloss: Да, с удовольствием.
    note: '*gern* делает согласие тёплым и естественным.'
  de.a1.unit12.lesson01.teach.leider:
    title: leider
    gloss: к сожалению
    note: '*Leider* смягчает отказ.'
    example_gloss: 'В контексте: К сожалению, я не могу.'
  de.a1.unit12.lesson01.teach.kann_nicht:
    title: Leider kann ich nicht.
    gloss: К сожалению, я не могу.
    note: После *Leider* в начале предложения глагол *kann* стоит перед *ich*.
  de.a1.unit12.lesson02.teach.am_abend:
    title: am Abend
    gloss: вечером
    note: '*am* употребляется с частями суток.'
    example_gloss: 'В контексте: Да, вечером.'
  de.a1.unit12.lesson02.teach.um_wie_viel_uhr:
    title: Um wie viel Uhr?
    gloss: Во сколько?
    note: Так спрашивают о точном времени по часам.
  de.a1.unit12.lesson02.teach.vor_dem_museum:
    title: um achtzehn Uhr vor dem Museum
    gloss: в 18:00 перед музеем
    note: В немецком расписания часто указывают в 24-часовом формате. В русском тоже так бывает в расписаниях, но в разговоре чаще говорят «шесть вечера».
  de.a1.unit12.lesson02.teach.einladung_text:
    title: Nachricht von Anna
    gloss: сообщение от Анны
    note: Короткое приглашение может содержать занятие, день, время и место.
    example_gloss: Сообщение от Анны.
  de.a1.unit12.lesson02.teach.line01:
    title: Анна спрашивает, свободен ли Феликс
    gloss: 'Анна: У вас завтра есть время?'
    note: План начинается с выяснения, свободен ли человек.
  de.a1.unit12.lesson02.teach.line02:
    title: Феликс говорит, когда он свободен
    gloss: 'Феликс: Да, вечером.'
    note: В коротком ответе можно назвать подходящую часть суток.
  de.a1.unit12.lesson02.teach.line03:
    title: Анна предлагает сходить в музей
    gloss: 'Анна: Пойдём в музей?'
    note: Так предлагают занятие.
  de.a1.unit12.lesson02.teach.line04:
    title: Феликс соглашается
    gloss: 'Феликс: Да, с удовольствием. Во сколько?'
    note: Феликс соглашается и спрашивает о времени.
    example_gloss: 'В контексте: Во сколько?'
  de.a1.unit12.lesson02.teach.line05:
    title: Анна называет время и место
    gloss: 'Анна: В 18:00 перед музеем.'
    note: В ответе названы и время, и место встречи.
  de.a1.unit12.lesson02.teach.line06:
    title: Феликс подтверждает
    gloss: 'Феликс: Хорошо, до завтра.'
    note: Естественное завершение разговора, когда план согласован.
