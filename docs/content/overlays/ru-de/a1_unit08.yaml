course:
  title: Немецкий язык A1
  description: 'Изучай немецкий на уровне A1: повседневные приветствия и короткие диалоги, с подробными объяснениями на русском.'
units:
  de.a1.unit08.einkaufen:
    title: 'Покупки: цены и количества'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: фунт яблок
    note: В Германии *Pfund* до сих пор часто употребляют в разговорной речи. Немецкий *Pfund* — это ровно 500 г (полкило), хотя страна официально использует метрическую систему.
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: дюжина яиц
    note: '*Dutzend* означает «дюжина» (двенадцать).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: бутылка воды
    note: '*Flasche* означает «бутылка».'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: пакет риса
    note: '*Tüte* означает «пакет».'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: килограмм помидоров
    note: '*Kilo* — стандартная метрическая единица веса; для всего, кроме обычных повседневных покупок, его используют гораздо чаще, чем *Pfund*.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Сколько стоят яблоки?
    note: '*kosten* означает «стоить» — буквально: «Что стоят яблоки?»'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Два евро за фунт.
    note: 'Здесь *Sie* означает «они» (про яблоки), а не вежливое «вы». Вежливое *Sie* и *sie* («они») имеют одну и ту же форму глагола (*kosten*), а в начале предложения оба пишутся с большой буквы, так что различить их помогает только контекст: речь идёт о яблоках, а не о человеке.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Можно мне два фунта, пожалуйста?
    note: Вежливая формула просьбы, похожая на *Ich möchte..., bitte* из урока 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: Это свежее?
    note: '*frisch* означает «свежий». *es* здесь соответствует существительному среднего рода (как das Brot). О предмете мужского рода скажут *Ist er frisch?* (der Reis), а о предмете женского рода — *Ist sie frisch?* (die Milch): местоимение меняется в зависимости от рода существительного, а не остаётся всегда *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: за фунт
    note: '*pro* означает «за, на каждый» — используется и на ценниках, и в устной речи при назывании цены.'
    example_gloss: Яблоки стоят два евро за фунт.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Рыночный ценник
    note: Простой ценник с тремя товарами и ценами за единицу.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: С вас восемь евро.
    note: '*Das macht...* — стандартный способ назвать общую сумму; эта фраза уже встречалась в уроке 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Феликс спрашивает цену
    gloss: 'Феликс говорит: Сколько стоят яблоки?'
    note: Тот же вопрос, что и в уроке 2, но теперь в настоящем разговоре.
  de.a1.unit08.lesson04.teach.line02:
    title: Анна называет цену
    gloss: 'Анна говорит: Два евро за фунт.'
    note: В полном ответе цена указывается за единицу товара.
  de.a1.unit08.lesson04.teach.line03:
    title: Феликс делает заказ
    gloss: 'Феликс говорит: Хорошо, можно мне два фунта, пожалуйста?'
    note: '*Gut* здесь означает «хорошо, ладно»: покупатель принимает цену перед тем, как заказать.'
  de.a1.unit08.lesson04.teach.line04:
    title: Анна спрашивает, нужно ли что-то ещё
    gloss: 'Анна говорит: Конечно. Что-нибудь ещё?'
    note: '*Natürlich* означает «конечно, разумеется».'
  de.a1.unit08.lesson04.teach.line05:
    title: Феликс заказывает ещё
    gloss: 'Феликс говорит: Да, ещё дюжину яиц.'
    note: '*auch* означает «тоже, также».'
  de.a1.unit08.lesson04.teach.line06:
    title: Анна называет общую сумму
    gloss: 'Анна говорит: С вас восемь евро.'
    note: Два фунта яблок (4 €) плюс дюжина яиц (4 €) — всего восемь евро.
