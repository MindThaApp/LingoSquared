  description: 'Изучай немецкий на уровне A1: повседневные приветствия и короткие диалоги, с подробными объяснениями на русском.'
units:
  de.a1.unit09.orte:
    title: Популярные места и местоположения
teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: банк
    note: '*Bank* означает «банк» — существительное женского рода, *die Bank*.'
    example_gloss: Мне нужно сходить в банк.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: больница
    note: '*Krankenhaus* буквально значит «дом больных». Существительное среднего рода: *das Krankenhaus*.'
    example_gloss: Мой друг в больнице.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: аптека
    note: '*Apotheke* значит «аптека». Существительное женского рода: *die Apotheke*.'
    example_gloss: Аптека сегодня открыта.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: парк
    note: '*Park* значит «парк». Существительное мужского рода: *der Park*.'
    example_gloss: Мы любим гулять в парке.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: ресторан
    note: '*Restaurant* значит «ресторан». Существительное среднего рода: *das Restaurant*.'
    example_gloss: В этом ресторане вкусная еда.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: Аптека рядом с парком.
    note: '*neben* значит «рядом с». Это предлог, который может требовать дательного или винительного падежа; для указания местонахождения (как здесь) он требует дательного, поэтому *der Park* (мужской род) превращается в *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: Аптека напротив больницы.
    note: '*gegenüber von* значит «напротив». *vom* — обычное слияние *von dem* (дательный падеж среднего рода, *das Krankenhaus*); оно используется и в речи, и на письме.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: Аптека между банком и парком.
    note: '*zwischen* значит «между». Обрати внимание на обе формы дательного падежа: *der Bank* (женский род) и *dem Park* (мужской род).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Ресторан за банком.
    note: '*hinter* значит «за, позади». *der Bank* — форма дательного падежа женского рода.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Парк перед больницей.
    note: '*vor* значит «перед». *dem Krankenhaus* — форма дательного падежа среднего рода.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Где находится банк?
    note: '*Wo ist...?* — стандартный способ спросить, где что-то находится.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Он рядом с парком.
    note: '*Sie* здесь значит «она» (о *die Bank*, женский род). Оно написано с заглавной буквы только потому, что стоит в начале предложения. Глагол *ist* показывает, что это не вежливое «вы»: тогда было бы *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: Это далеко отсюда?
    note: '*weit* значит «далеко». *es* здесь — безличное подлежащее, обозначающее ситуацию в целом; оно не согласуется в роде ни с каким существительным.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: Нет, это недалеко.
    note: '*nicht* отрицает слово *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Извините, где аптека?
    note: '*Entschuldigung* уже встречалось как «извините / простите». Здесь оно вежливо начинает вопрос.'
  de.a1.unit09.lesson04.teach.line01:
    title: Феликс спрашивает дорогу
    gloss: 'Феликс говорит: Извините, где аптека?'
    note: Та же вежливая формула, что и в отдельной фразе выше, но теперь в настоящем разговоре.
  de.a1.unit09.lesson04.teach.line02:
    title: Анна объясняет, где аптека
    gloss: 'Анна говорит: Она напротив больницы.'
    note: Полный ответ называет местонахождение аптеки относительно известного ориентира.
  de.a1.unit09.lesson04.teach.line03:
    title: Феликс спрашивает, далеко ли это
    gloss: 'Феликс говорит: Это далеко отсюда?'
    note: Естественный следующий вопрос, когда общее направление уже известно.
  de.a1.unit09.lesson04.teach.line04:
    title: Анна отвечает про расстояние
    gloss: 'Анна говорит: Нет, недалеко. Она между банком и парком.'
    note: Полный ответ сначала успокаивает насчёт расстояния, а затем называет ещё один, более точный ориентир.
