review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  notes: >-
    Paired with ar a1_unit05_time.
    Review 2026-10-19: 8 fixes - 9 example_glosses dropped the Layla/Yusuf said: frame; dialogue_current_time distractor 5:00 is a time Layla says in the audio (lesson time), replaced with 4:00; translate/write five-in-the-morning/evening now also accept the في الصباح / في المساء phrasing and the short الخامسة صباحا/مساء (with note); answer_time accepts the short الثالثة (with note); write_schedule_time accepts الدرس الساعة الخامسة (no في); notes now give transliterations (as-sāʿa, ath-thālitha, al-khāmisa, ṣabāḥan, masāʾan, matā) and explain the feminine ordinal agreeing with الساعة. NATIVE FLAGS: none.

course:
  title: Arabic A1
  description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."

units:
  ar.a1.unit05.time:
    title: "Time"

lessons:
  ar.a1.unit05.lesson01.ask_time: {title: "What time is it?"}
  ar.a1.unit05.lesson02.time_exchange: {title: "Lesson time"}

teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: "The time"
    gloss: "the time / the hour"
    note: "الساعة (as-sāʿa) literally means the hour (also the clock); clock-time answers start with it."
    example_gloss: "It is three o'clock."
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: "What time is it?"
    gloss: "What time is it?"
    note: "كم الساعة؟ literally asks 'how much is the hour?'"
    example_gloss: "Layla said: What time is it?"
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: "Three o'clock"
    gloss: "It is three o'clock."
    note: "الثالثة (ath-thālitha) is the feminine ordinal 'third', agreeing with feminine الساعة: literally 'the third hour'."
    example_gloss: "Layla said: It is three o'clock."
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: "Five o'clock"
    gloss: "It is five o'clock."
    note: "الخامسة (al-khāmisa), 'the fifth (hour)'. This A1 unit keeps to whole hours."
    example_gloss: "Layla said: It is five o'clock."
  ar.a1.unit05.lesson01.teach.sabah:
    title: "In the morning"
    gloss: "in the morning"
    note: "صباحا (ṣabāḥan) can clarify a time as morning; في الصباح says the same thing."
    example_gloss: "It is five in the morning."
  ar.a1.unit05.lesson01.teach.masaa:
    title: "In the evening"
    gloss: "in the evening"
    note: "مساء (masāʾan) can clarify a time as evening; في المساء says the same thing."
    example_gloss: "It is five in the evening."
  ar.a1.unit05.lesson02.teach.mata:
    title: "When"
    gloss: "when"
    note: "متى (matā) asks when something happens."
    example_gloss: "When is the lesson?"
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: "When is the lesson?"
    gloss: "When is the lesson?"
    note: "Arabic can omit 'is' in this simple question."
    example_gloss: "Yusuf said: When is the lesson?"
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: "The lesson is at five"
    gloss: "The lesson is at five o'clock."
    note: "الساعة can also introduce a scheduled time."
    example_gloss: "Layla said: The lesson is at five o'clock."
  ar.a1.unit05.lesson02.teach.line01:
    title: "Ask the time"
    gloss: "Yusuf asks the time."
    note: "كم الساعة؟ asks for the current time."
    example_gloss: "Yusuf said: What time is it?"
  ar.a1.unit05.lesson02.teach.line02:
    title: "Tell the time"
    gloss: "Layla says it is three."
    note: "The answer starts with الساعة."
    example_gloss: "Layla said: It is three o'clock."
  ar.a1.unit05.lesson02.teach.line03:
    title: "Ask when"
    gloss: "Yusuf asks when the lesson is."
    note: "و links this question to the previous exchange."
    example_gloss: "Yusuf said: And when is the lesson?"
  ar.a1.unit05.lesson02.teach.line04:
    title: "Give the scheduled time"
    gloss: "Layla says the lesson is at five."
    note: "This is the schedule answer."
    example_gloss: "Layla said: The lesson is at five o'clock."

exercises:
  ar.a1.unit05.lesson01.exercise07.dictation_time_question:
    instruction: "Type what you hear."
    correct_option: "كم الساعة"
    accepted_answers: [{value: "كم الساعة", status: correct}]
    orthography_strict: true

  ar.a1.unit05.lesson01.exercise01.recognize_clock:
    instruction: "Select the meaning."
    correct_option: "the time"
    distractors: [date, today, name]
    accepted_answers: [{value: "the time", status: correct}]
    feedback: "الساعة means the time or the hour."
  ar.a1.unit05.lesson01.exercise02.listen_time_question:
    instruction: "Listen and select what you hear."
    correct_option: "What time is it?"
    distractors: ["What is today's date?", "How much is this?", "What is your name?"]
    accepted_answers: [{value: "What time is it?", status: correct}]
    feedback: "You heard كم الساعة؟"
  ar.a1.unit05.lesson01.exercise03.match_time_words:
    instruction: "Match each Arabic time word with its meaning."
    accepted_answers:
      - value: {الساعة: "the time", صباحا: "in the morning", مساء: "in the evening"}
        status: correct
    feedback: "These words support basic time answers."
  ar.a1.unit05.lesson01.exercise04.order_time_question:
    instruction: "Arrange the words to ask What time is it?"
    accepted_answers: [{value: [كم, الساعة], status: correct}]
    feedback: "كم الساعة؟ asks the time."
  ar.a1.unit05.lesson01.exercise05.translate_three:
    instruction: "Translate into Arabic: It is five in the morning."
    accepted_answers:
      - {value: "الساعة الخامسة صباحا", status: correct}
      - {value: "الساعة الخامسة صباحا.", status: correct}
      - {value: "الساعة الخامسة في الصباح", status: correct}
      - {value: "الخامسة صباحا", status: acceptable_with_note, note: "Correct; the full answer starts with الساعة."}
    feedback: "الساعة الخامسة صباحا means it is five in the morning."
  ar.a1.unit05.lesson01.exercise06.write_evening_time:
    instruction: "Type It is five in the evening in Arabic."
    accepted_answers:
      - {value: "الساعة الخامسة مساء", status: correct}
      - {value: "الساعة الخامسة مساء.", status: correct}
      - {value: "الساعة الخامسة في المساء", status: correct}
      - {value: "الخامسة مساء", status: acceptable_with_note, note: "Correct; the full answer starts with الساعة."}
    feedback: "الساعة الخامسة مساء means it is five in the evening."

  ar.a1.unit05.lesson02.exercise01.recognize_when:
    instruction: "Select the meaning."
    correct_option: when
    distractors: [where, today, price]
    accepted_answers: [{value: when, status: correct}]
    feedback: "متى means when."
  ar.a1.unit05.lesson02.exercise02.dialogue_current_time:
    instruction: "What time is it in the dialogue?"
    correct_option: "3:00"
    distractors: ["4:00", "6:00", "10:00"]
    accepted_answers: [{value: "3:00", status: correct}]
    feedback: "ليلى says الساعة الثالثة."
  ar.a1.unit05.lesson02.exercise03.match_schedule_times:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"الساعة الثالثة": "3:00", "الدرس في الساعة الخامسة": "lesson at 5:00"}
        status: correct
    feedback: "الساعة marks both current and scheduled times."
  ar.a1.unit05.lesson02.exercise04.order_lesson_at_five:
    instruction: "Arrange the Arabic words for The lesson is at five o'clock."
    accepted_answers: [{value: [الدرس, في, الساعة, الخامسة], status: correct}]
    feedback: "الدرس في الساعة الخامسة is a simple schedule sentence."
  ar.a1.unit05.lesson02.exercise05.answer_time:
    instruction: "Answer كم الساعة؟ with It is three o'clock."
    accepted_answers:
      - {value: "الساعة الثالثة", status: correct}
      - {value: "الساعة الثالثة.", status: correct}
      - {value: "الثالثة", status: acceptable_with_note, note: "Correct; the full answer starts with الساعة."}
    feedback: "الساعة الثالثة is the expected answer."
  ar.a1.unit05.lesson02.exercise06.write_schedule_time:
    instruction: "Type The lesson is at five o'clock in Arabic."
    accepted_answers:
      - {value: "الدرس في الساعة الخامسة", status: correct}
      - {value: "الدرس في الساعة الخامسة.", status: correct}
      - {value: "الدرس الساعة الخامسة", status: correct}
    feedback: "الدرس في الساعة الخامسة means the lesson is at five o'clock."
