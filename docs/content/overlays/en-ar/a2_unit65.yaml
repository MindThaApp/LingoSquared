  ar.a2.unit65.lesson03.exercise03.match_amlt_shahdt_tbkht:
    instruction: 'Match each past form to its type of verb: sound (the stem stays the same) or weak (the stem changes).'
    accepted_answers:
    - value:
      - left: عملت
        right: a sound verb
      - left: شاهدت
        right: a sound verb
      - left: طبخت
        right: a sound verb
      - left: كنت
        right: a weak verb (the stem changes)
      - left: نمت
        right: a weak verb (the stem changes)
      - left: زرت
        right: a weak verb (the stem changes)
      - left: مشيت
        right: a weak verb (the stem changes)
      - left: بقيت
        right: a weak verb (the stem changes)
      status: correct
    feedback: 'Sound verbs keep their stem (*عملت، شاهدت، طبخت*). Weak verbs change it: *كنت* (from *كان*), *نمت* (from *نام*), *زرت* (from *زار*), *مشيت* (from *مشى*) and *بقيت* (from *بقي*).'
