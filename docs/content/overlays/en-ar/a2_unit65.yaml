      status: correct
    feedback: '*ركبت الدراجة* = I rode the bike (rakibtu ad-darrāja). Add *ت* to the stem for ''I''. *ركب* is ''he rode'', *أركب* is ''I ride'' and *ركبنا* is ''we rode''.'
  ar.a2.unit65.lesson02.exercise02.listen_rkbt_aldraja:
