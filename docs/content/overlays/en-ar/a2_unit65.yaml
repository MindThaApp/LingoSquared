    - value: ذهبت إلى عمي يوم الأحد
      status: correct
    feedback: '*يوم الأحد ذهبت إلى عمي* = On Sunday I went to my uncle''s. *ذهبت إلى عمي يوم الأحد* is also correct.'
  ar.a2.unit65.lesson02.exercise01.choose_rkbt_aldraja:
    instruction: Which is the correct past tense ('I') of *ركب* (to ride)?
    correct_option: ركبت الدراجة
    distractors:
    - ركب الدراجة
    - أركب الدراجة
    - ركبنا الدراجة
    accepted_answers:
