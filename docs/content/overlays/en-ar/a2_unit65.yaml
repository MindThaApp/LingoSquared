    feedback: '*ذهبت إلى عمي* = I went to my uncle''s (dhahabtu ilā ʿammī). *إلى* means ''to''.'
  ar.a2.unit65.lesson01.exercise06.complete_ywm_alsbt_tswqt:
    instruction: Complete the sentence with the past tense ('I') of *تسوق* (to shop).
    correct_option: تسوقت
    accepted_answers:
    - value: تسوقت
      status: correct
    feedback: '*يوم السبت تسوقت* = On Saturday I did the shopping. Add *ت* (-tu) to the past stem *تسوق*.'
  ar.a2.unit65.lesson01.exercise07.translate_ywm_alahd_dhhbt:
