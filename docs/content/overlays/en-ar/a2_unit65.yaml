  ar.a2.unit65.lesson03.exercise01.choose_nmt:
    instruction: Which of these past forms ('I') comes from a weak verb, one whose stem changes before *ت*?
    correct_option: نمت
    distractors:
    - عملت
    - طبخت
    - لعبت
    accepted_answers:
    - value: نمت
      status: correct
    feedback: '*نمت* (nimtu) comes from *نام* (nāma, to sleep): the long vowel *ا* drops before *ت*. *عملت* and *طبخت* and *لعبت* come from sound verbs, whose stem stays the same.'
  ar.a2.unit65.lesson03.exercise02.listen_bqyt_fy_albyt:
