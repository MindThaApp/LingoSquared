teaching:
  ar.a2.unit65.lesson01.teach.atla_nhaya_alasbwa:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*عطلة نهاية الأسبوع* (ʿuṭlat nihāyat al-usbūʿ) means ''weekend'', literally ''the holiday at the end of the week''. Add *الماضية* (al-māḍiya, ''the past one'') to say ''last weekend''.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  ar.a2.unit65.lesson01.teach.alsbt_alahd:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: 'Days of the week are written with the attached article: *السبت* (as-sabt). With *يوم* (''day'') you say *يوم السبت*, ''on Saturday''.'
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  ar.a2.unit65.lesson01.teach.altswq:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*التسوق* (at-tasawwuq) means shopping. The verb is *تسوق* (tasawwaqa, ''he shopped''): *أتسوق* (atasawwaq) is ''I shop'' and *تسوقت* (tasawwaqtu) is ''I shopped''.'
    example_gloss: Every Saturday I do the shopping.
  ar.a2.unit65.lesson01.teach.zyara_shkhs_ma:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*زيارة شخص ما* (ziyārat shakhṣ mā) means visiting someone. The verb is *زار* (zāra): *أزور عمي* (azūru ʿammī) is ''I visit my uncle''.'
    example_gloss: I often go and visit my uncle.
  ar.a2.unit65.lesson01.teach.alswq_alhdyqa_alsynma:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*السوق* (as-sūq), *الحديقة* (al-ḥadīqa) and *السينما* (as-sinimā) all take the attached article *ال*. *الحديقة* ends in the feminine marker *ة*, so it is a feminine noun.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  ar.a2.unit65.lesson01.teach.aml_tbkh_akl:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the dictionary forms of the verbs (the 'he' past). Later in this unit you will build the 'I' forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  ar.a2.unit65.lesson01.teach.madha_falt_fy:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *فعلت* (faʿalta) is the past tense of *فعل* (faʿala, 'to do'). In unvocalised writing it is spelled the same for a man and a woman, so the question works for both.
  ar.a2.unit65.lesson01.teach.ywm_alsbt_tswqt:
    title: 'The past tense: verb + ت (-tu)'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'Arabic forms the past tense (الماضي, al-māḍī) by adding a personal ending to the past stem, so there is no helper verb. For ''I'' the ending is *ت* (-tu): *ذهب* (dhahaba, ''he went'') becomes *ذهبت* (dhahabtu, ''I went''). In unvocalised writing the same *ت* also spells ''you'' (dhahabta to a man, dhahabti to a woman), and *ذهبت* can also mean ''she went'' (dhahabat), so the context tells you who is meant. The time word usually comes first: *يوم السبت تسوقت*.'
  ar.a2.unit65.lesson02.teach.tjwl_rkb_aldraja:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*لعب* (laʿiba) is used for games and sports with a ball: *لعبت كرة القدم*. *مارس الرياضة* (māras ar-riyāḍa) means ''to practise sport'' in general.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  ar.a2.unit65.lesson02.teach.aml_amlt_tbkh:
    title: 'Sound verbs: past stem + ت'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'A sound verb keeps its stem and simply takes the ending: *عمل ← عملت* (ʿamila → ʿamiltu), *طبخ ← طبخت* (ṭabakha → ṭabakhtu), *تجول ← تجولت* (tajawwala → tajawwaltu), *لعب ← لعبت*, *ركب ← ركبت*. The dictionary form of an Arabic verb is the ''he'' past form, so the cards show it first. The ending *ت* is the same for every sound verb.'
  ar.a2.unit65.lesson02.teach.amars_alryada_marst:
    title: Longer verbs
    gloss: I exercise. I exercised.
    note: 'Longer verbs take the same ending: *مارس ← مارست* (māras → mārastu). The ending *ت* is written joined to the verb.'
  ar.a2.unit65.lesson02.teach.tjwlt_fy_alhdyqa:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*تجول* (tajawwala) means to stroll around; *في الحديقة* (fī l-ḥadīqa) says where. For walking to a particular place you would use *ذهب* or *مشى*.'
  ar.a2.unit65.lesson02.teach.labt_kra_alqdm:
    title: Playing football
    gloss: I played football.
    note: 'A ball sport takes *لعب* directly with the name of the game: *لعبت كرة القدم* (laʿibtu kurat al-qadam).'
  ar.a2.unit65.lesson03.teach.kan_bqy:
    title: To be and to stay
    gloss: to be / to stay
    note: '*كان* (kāna) means ''to be'' and *بقي* (baqiya) means ''to stay''. Both are weak verbs, so the stem changes before *ت*: *كنت* (kuntu), *بقيت* (baqītu).'
    example_gloss:
    - I want to stay at home too.
    - It can be fun.
  ar.a2.unit65.lesson03.teach.nam_nmt_zar:
    title: 'Weak verbs: the stem changes'
    gloss: sleep → slept. visit → visited. say → said. be → was. walk → walked. stay → stayed. see → saw.
    note: 'Verbs with a long vowel or *ي / و* in the stem change before *ت*. A hollow verb (middle letter *ا*) drops the long vowel: *نام ← نمت* (nāma → nimtu), *زار ← زرت*, *قال ← قلت*, *كان ← كنت*. A verb ending in *ى* or *ي* shows *ي* before *ت*: *مشى ← مشيت*, *بقي ← بقيت*, *رأى ← رأيت*. Learn these forms as whole words.'
  ar.a2.unit65.lesson03.teach.shahdt_fylma:
    title: Watching a film
    gloss: I saw a film.
    note: '*شاهد* (shāhada) means to watch (a film, a match). *رأى* (raʾā) means to see in general.'
  ar.a2.unit65.lesson03.teach.nmt_twyla_thm:
    title: Two verbs, one subject
    gloss: I slept for a long time and read a book.
    note: 'Two actions by the same person: each verb keeps its own *ت*, and *ثم* (thumma, ''then'') or *و* (wa, ''and'') links them: *نمت طويلا ثم قرأت كتابا*.'
  ar.a2.unit65.lesson03.teach.zrt_amy:
    title: Visiting someone
    gloss: I visited my uncle.
    note: '*زار* (zāra) is a hollow verb: *زرت عمي* (zurtu ʿammī) is ''I visited my uncle''. It means nearly the same as *ذهبت إلى عمي*, but *زار* takes the person directly, with no *إلى*.'
  ar.a2.unit65.lesson03.teach.shahdt_fylma_dhhbt:
    title: Sound or weak verb?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'To choose the right form, look at the verb. Sound verbs (*عمل، شاهد، طبخ*) keep their stem: *شاهدت*. Weak verbs change it: hollow verbs (middle *ا*) drop the long vowel (*كان ← كنت*), and verbs ending in *ي* or *ى* show *ي* before *ت* (*بقي ← بقيت*). When the subject is a thing, as in ''it got late'', use the ''he'' form with no ending: *تأخر الوقت* (taʾakhkhara l-waqt).'
  ar.a2.unit65.lesson03.teach.dhhb_dhhbt_jaa:
    title: Verbs of movement and change
    gloss: go → went, come → came, stay → stayed, become → became, be → was
    note: 'These five verbs are common in a weekend story: *ذهبت* (I went), *جئت* (jiʾtu, I came), *بقيت* (I stayed), *أصبحت* (aṣbaḥtu, I became) and *كنت* (I was). *ذهب* and *أصبح* are sound; *جاء* is hollow, and *بقي* and *كان* are weak. Notice the hamza written on the *ي* in *جئت*.'
  ar.a2.unit65.lesson04.teach.awla_bad_dhlk:
    title: First and then
    gloss: first / after that
    note: '*أولا* (awwalan) and *بعد ذلك* (baʿda dhālika, ''after that'') put actions in order. *ثم* (thumma, ''then'') works too.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  ar.a2.unit65.lesson04.teach.awla_dhhbt_ila:
    title: 'Telling it in order: أولا، بعد ذلك'
    gloss: First I went to the market, then I cooked.
    note: 'Both connectors come first and the verb follows right after them: *بعد ذلك طبخت*. A comma usually separates the two parts: *أولا ذهبت إلى السوق، بعد ذلك طبخت*.'
  ar.a2.unit65.lesson04.teach.lm_aaml_lm:
    title: 'Saying what you did not do: لم'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'To negate a past action, put *لم* (lam) before the present-tense verb: *أعمل* (aʿmal, ''I work'') becomes *لم أعمل* (lam aʿmal, ''I did not work''). The past ending *ت* disappears, because *لم* already carries the past meaning. Never write *لم عملت*.'
  ar.a2.unit65.lesson04.teach.lm_ashrb_qhwa:
    title: 'Saying you had none: لم يكن، أي'
    gloss: I didn't drink any coffee. I didn't have time. I didn't see a single film.
    note: '''I did not have X'' is *لم يكن عندي X*: *لم يكن عندي وقت* (lam yakun ʿindī waqt). Here *كان* takes the ''he'' form *يكن* because *وقت* (time) is masculine. To say ''not any'', add *أي* (ayy) after the negative: *لم أشاهد أي فيلم* (lam ushāhid ayya film).'
  ar.a2.unit65.lesson04.teach.hl_marst_alryada:
    title: Layla asks about exercise
    gloss: 'Layla: Did you exercise?'
    note: 'A yes/no question starts with *هل* (hal): *هل مارست الرياضة؟* (hal mārasta ar-riyāḍa?). The answer repeats the verb with *لم*: *لا، لم أمارس الرياضة*.'
  ar.a2.unit65.lesson04.teach.la_lm_amars:
    title: Yusuf says no
    gloss: 'Yusuf: No, I didn''t exercise.'
  ar.a2.unit65.lesson05.teach.mrhba_ya_lyla:
    title: A message from Nour
    gloss: Hi Layla! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Nour tells Layla about her weekend in order. Every past verb in the first person ends in *ت*: *ذهبت، واشتريت، تجولت، طبخت، بقيت، نمت، قرأت*. *كانت* (kānat) means ''it was'', because *عطلة* is feminine. *بعد الظهر* (baʿda aẓ-ẓuhr) means ''in the afternoon'' and *في المساء* (fī l-masāʾ) ''in the evening''.'
    glosses:
      مرحبا: hi
      هادئة: quiet, calm
      عطلة: holiday, weekend
      كانت: was (past of كان)
      صباح: morning
      السوق: market
      خبزا: bread
      واشتريت: and bought (past of اشترى)
      الظهر: noon (بعد الظهر = in the afternoon)
      الحديقة: park
      تجولت: strolled (past of تجول)
      المساء: evening
      طبخت: cooked (past of طبخ)
      لم: not
      أمارس: practise (present form, after لم)
      أي: any
      فيلم: film
      أشاهد: watch (present form, after لم)
      الأحد: Sunday
      بقيت: stayed (past of بقي)
      طويلا: long, for a long time
      نمت: slept (past of نام)
      كتابا: book
      قرأت: read (past of قرأ)
  ar.a2.unit65.lesson06.teach.mrhba_ya_ywsf:
    title: Layla asks Yusuf about his weekend
    gloss: 'Layla: Hi Yusuf! What did you do last weekend?'
  ar.a2.unit65.lesson06.teach.ywm_alsbt_dhhbt:
    title: Yusuf describes Saturday
    gloss: 'Yusuf: On Saturday I went to my uncle''s in Beirut. I ate at my uncle''s.'
    note: '*إلى عمي* (ilā ʿammī) is the direction (''to my uncle''s''); *عند عمي* (ʿinda ʿammī) is the place (''at my uncle''s''). *أكلت* (akaltu) comes from *أكل* (akala), ''to eat''.'
  ar.a2.unit65.lesson06.teach.raia_wmadha_an:
    title: Layla asks about Sunday
    gloss: 'Layla: Nice! And Sunday?'
  ar.a2.unit65.lesson06.teach.ywm_alahd_bqyt:
    title: Yusuf describes Sunday and asks back
    gloss: 'Yusuf: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  ar.a2.unit65.lesson06.teach.dhhbt_ila_byt:
    title: Layla describes her weekend
    gloss: 'Layla: I went to my parents''. I didn''t do any shopping, but I cooked.'
