course:
  title: Arabic A1
  description: >-
    Beginner Modern Standard Arabic (fusha) -- reading the script,
    everyday greetings, and handling short polite exchanges.

units:
  ar.a1.unit03.numbers:
    title: "Numbers"

lessons:
  ar.a1.unit03.lesson01.numbers_one_to_five: {title: "Numbers 1-5"}
  ar.a1.unit03.lesson02.numbers_six_to_ten: {title: "Numbers 6-10"}
  ar.a1.unit03.lesson03.using_numbers: {title: "Using numbers"}

teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: "One"
    gloss: "one"
    note: "واحد (wāḥid) is also used on its own, without a noun, to answer 'how many?'"
    example_gloss: "I have one book."
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: "Two"
    gloss: "two"
    note: "اثنان (ithnān) is the independent citation form of two."
    example_gloss: "I have two brothers."
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: "Three"
    gloss: "three"
    note: "ثلاثة (thalātha) is the independent citation form of three."
    example_gloss: "One, two, three."
  ar.a1.unit03.lesson01.teach.arbaa:
    title: "Four"
    gloss: "four"
    note: "أربعة (arbaʿa) is the independent citation form of four."
    example_gloss: "I have four books."
  ar.a1.unit03.lesson01.teach.khamsa:
    title: "Five"
    gloss: "five"
    note: "خمسة (khamsa) is the independent citation form of five."
    example_gloss: "I have five books."

  ar.a1.unit03.lesson02.teach.sitta:
    title: "Six"
    gloss: "six"
    note: "ستة (sitta) is the independent citation form of six."
    example_gloss: "I have six books."
  ar.a1.unit03.lesson02.teach.sabaa:
    title: "Seven"
    gloss: "seven"
    note: "سبعة (sabʿa) is the independent citation form of seven."
    example_gloss: "I have seven books."
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: "Eight"
    gloss: "eight"
    note: "ثمانية (thamāniya) is the independent citation form of eight."
    example_gloss: "I have eight books."
  ar.a1.unit03.lesson02.teach.tisaa:
    title: "Nine"
    gloss: "nine"
    note: "تسعة (tisʿa) is the independent citation form of nine."
    example_gloss: "I have nine dirhams."
  ar.a1.unit03.lesson02.teach.ashara:
    title: "Ten"
    gloss: "ten"
    note: "عشرة (ʿashara) is the independent citation form of ten."
    example_gloss: "I have ten dinars."

  ar.a1.unit03.lesson03.teach.kam:
    title: "How much is this?"
    gloss: "How much is this?"
    note: "كم هذا؟ (kam hādhā) is the standard way to ask a price."
  ar.a1.unit03.lesson03.teach.raqam:
    title: "Number"
    gloss: "number"
    note: "رقم (raqam) is the general word for a number, as in a phone number."
    example_gloss: "My number is one."
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: "Ask the price"
    gloss: "Yusuf asks how much something costs."
    note: "كم هذا؟ opens the exchange."
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: "Give the price"
    gloss: "Layla says it costs five."
    note: "بخمسة attaches the preposition بـ (for/at) directly onto the number."
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: "Ask about another item"
    gloss: "Yusuf points to something else."
    note: "وهذا؟ shortens the question by reusing the previous context."
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: "Give the price, reply"
    gloss: "Layla answers and Yusuf thanks her."
    note: "بعشرة follows the same pattern as بخمسة."

exercises:
  ar.a1.unit03.lesson01.exercise01.recognize_waahid:
    instruction: "Select the number this word means."
    correct_option: "1"
    distractors: ["2", "3", "4"]
    accepted_answers: [{value: "1", status: correct}]
    feedback: "واحد means one."
  ar.a1.unit03.lesson01.exercise02.recognize_thalaatha:
    instruction: "Select the number this word means."
    correct_option: "3"
    distractors: ["1", "2", "5"]
    accepted_answers: [{value: "3", status: correct}]
    feedback: "ثلاثة means three."
  ar.a1.unit03.lesson01.exercise03.recognize_khamsa:
    instruction: "Select the number this word means."
    correct_option: "5"
    distractors: ["2", "3", "4"]
    accepted_answers: [{value: "5", status: correct}]
    feedback: "خمسة means five."
  ar.a1.unit03.lesson01.exercise04.match_numbers_1to5:
    instruction: "Match each Arabic number word with its digit."
    accepted_answers:
      - value: {واحد: "1", اثنان: "2", ثلاثة: "3", أربعة: "4", خمسة: "5"}
        status: correct
    feedback: "These are the numbers 1 through 5."
  ar.a1.unit03.lesson01.exercise05.listen_count_to_three:
    instruction: "Listen and select what you hear."
    correct_option: "One, two, three."
    distractors: ["Four, five, six.", "Eight, nine, ten.", "How much is this?"]
    accepted_answers: [{value: "One, two, three.", status: correct}]
    feedback: "You heard واحد، اثنان، ثلاثة -- one, two, three."
  ar.a1.unit03.lesson01.exercise06.order_count_to_three:
    instruction: "Arrange the numbers 1, 2, 3 in order."
    accepted_answers: [{value: [واحد, اثنان, ثلاثة], status: correct}]
    feedback: "واحد، اثنان، ثلاثة means one, two, three."
  ar.a1.unit03.lesson01.exercise07.translate_four:
    instruction: "Translate into Arabic: four."
    accepted_answers:
      - {value: أربعة, status: correct}
    feedback: "أربعة means four."
  ar.a1.unit03.lesson01.exercise08.writing_five:
    instruction: "Type the Arabic word for this number."
    accepted_answers:
      - {value: خمسة, status: correct}
    feedback: "خمسة means five."

  ar.a1.unit03.lesson02.exercise01.recognize_sitta:
    instruction: "Select the number this word means."
    correct_option: "6"
    distractors: ["7", "8", "9"]
    accepted_answers: [{value: "6", status: correct}]
    feedback: "ستة means six."
  ar.a1.unit03.lesson02.exercise02.recognize_thamaaniya:
    instruction: "Select the number this word means."
    correct_option: "8"
    distractors: ["6", "7", "9"]
    accepted_answers: [{value: "8", status: correct}]
    feedback: "ثمانية means eight."
  ar.a1.unit03.lesson02.exercise03.recognize_ashara:
    instruction: "Select the number this word means."
    correct_option: "10"
    distractors: ["7", "8", "9"]
    accepted_answers: [{value: "10", status: correct}]
    feedback: "عشرة means ten."
  ar.a1.unit03.lesson02.exercise04.match_numbers_1to10:
    instruction: "Match each Arabic number word with its digit."
    accepted_answers:
      - value: {واحد: "1", اثنان: "2", ثلاثة: "3", أربعة: "4", خمسة: "5", ستة: "6", سبعة: "7", ثمانية: "8", تسعة: "9", عشرة: "10"}
        status: correct
    feedback: "These are the numbers 1 through 10."
  ar.a1.unit03.lesson02.exercise05.order_count_8_9_10:
    instruction: "Arrange the numbers 8, 9, 10 in order."
    accepted_answers: [{value: [ثمانية, تسعة, عشرة], status: correct}]
    feedback: "ثمانية، تسعة، عشرة means eight, nine, ten."
  ar.a1.unit03.lesson02.exercise06.translate_seven:
    instruction: "Translate into Arabic: seven."
    accepted_answers:
      - {value: سبعة, status: correct}
    feedback: "سبعة means seven."
  ar.a1.unit03.lesson02.exercise07.writing_nine:
    instruction: "Type the Arabic word for this number."
    accepted_answers:
      - {value: تسعة, status: correct}
    feedback: "تسعة means nine."
  ar.a1.unit03.lesson02.exercise08.speak_ten:
    instruction: "Repeat the number."
    accepted_answers: [{value: عشرة, status: correct}]
    feedback: "The expected word is عشرة."

  ar.a1.unit03.lesson03.exercise01.listen_kam_haadha:
    instruction: "Listen and select what you hear."
    correct_option: "How much is this?"
    distractors: ["What is your name?", "Where are you from?", "Good morning."]
    accepted_answers: [{value: "How much is this?", status: correct}]
    feedback: "You heard كم هذا؟, how much is this?"
  ar.a1.unit03.lesson03.exercise02.recognize_raqam:
    instruction: "What does this word mean?"
    correct_option: number
    distractors: [name, country, price]
    accepted_answers: [{value: number, status: correct}]
    feedback: "رقم means number."
  ar.a1.unit03.lesson03.exercise03.comprehend_price_five:
    instruction: "How much does the first item cost?"
    correct_option: "5"
    distractors: ["3", "10", "1"]
    accepted_answers: [{value: "5", status: correct}]
    feedback: "هذا بخمسة means this is for five."
  ar.a1.unit03.lesson03.exercise04.comprehend_price_ten:
    instruction: "How much does the second item cost?"
    correct_option: "10"
    distractors: ["5", "8", "2"]
    accepted_answers: [{value: "10", status: correct}]
    feedback: "هذا بعشرة means this is for ten."
  ar.a1.unit03.lesson03.exercise05.order_ask_price:
    instruction: "Arrange the words to ask How much is this?"
    accepted_answers: [{value: [كم, هذا], status: correct}]
    feedback: "كم هذا؟ means how much is this?"
  ar.a1.unit03.lesson03.exercise06.dialogue_response_price:
    instruction: "Answer كم هذا؟ by saying it costs five."
    accepted_answers:
      - {value: "هذا بخمسة", status: correct}
      - {value: "هذا بخمسة.", status: correct}
      - {value: بخمسة, status: acceptable_with_note, note: "Correct but omits the demonstrative هذا."}
    feedback: "هذا بخمسة means this is for five."
  ar.a1.unit03.lesson03.exercise07.translate_this_is_ten:
    instruction: "Translate into Arabic: This is for ten."
    accepted_answers:
      - {value: "هذا بعشرة", status: correct}
      - {value: "هذا بعشرة.", status: correct}
    feedback: "هذا بعشرة means this is for ten."
  ar.a1.unit03.lesson03.exercise08.speak_ask_price:
    instruction: "Repeat the question."
    accepted_answers: [{value: "كم هذا", status: correct}]
    feedback: "The expected words are كم هذا."
