  ar.a1.unit09.lesson01.teach.here: {title: "Here", gloss: "here", note: "هنا comes after the place in these simple sentences.", example_gloss: "The cafe is here."}
  ar.a1.unit09.lesson02.teach.where_library: {title: "Where is the library?", gloss: "Where is the library?", note: "أين asks where.", example_gloss: "Where is the library?"}
