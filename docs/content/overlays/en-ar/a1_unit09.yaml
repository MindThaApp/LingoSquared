teaching:
  ar.a1.unit09.lesson01.teach.place: {title: "Place", gloss: "place", note: "مكان (makān) is the general word for a place. هذا (this) was taught with numbers.", example_gloss: "This is a place."}
  ar.a1.unit09.lesson01.teach.library: {title: "Library", gloss: "library", note: "مكتبة (maktaba) can mean library or bookshop; here it is a library. المكتبة (al-maktaba) is 'the library'.", example_gloss: "The library is here."}
  ar.a1.unit09.lesson01.teach.market: {title: "Market", gloss: "market", note: "سوق (sūq) means market; السوق (as-sūq) is 'the market'.", example_gloss: "The market is here."}
  ar.a1.unit09.lesson01.teach.cafe: {title: "Cafe", gloss: "cafe", note: "مقهى (maqhā) means cafe; it is related to قهوة (coffee). المقهى (al-maqhā) is 'the cafe'.", example_gloss: "The cafe is here."}
  ar.a1.unit09.lesson01.teach.here: {title: "Here", gloss: "here", note: "هنا (hunā) usually comes after the place: المقهى هنا, the cafe is here. Arabic needs no word for 'is' in this sentence.", example_gloss: "The cafe is here."}
  ar.a1.unit09.lesson02.teach.where_library: {title: "Where is the library?", gloss: "Where is the library?", note: "أين (ayna) asks where; you met it in من أين أنت؟ (where are you from?).", example_gloss: "Yusuf said: Where is the library?"}
  ar.a1.unit09.lesson02.teach.near: {title: "Near", gloss: "near", note: "قرب (qurba) means near and comes before the place it refers to: قرب المكتبة, near the library. بالقرب من (bi-l-qurbi min) means the same.", example_gloss: "The cafe is near the library."}
  ar.a1.unit09.lesson02.teach.library_near_market: {title: "The library is near the market", gloss: "The library is near the market", note: "Arabic does not need a separate word for 'is' here.", example_gloss: "Layla said: The library is near the market."}
  ar.a1.unit09.lesson02.teach.line01: {title: "Ask where", gloss: "Yusuf asks where the library is.", note: "أين starts the location question.", example_gloss: "Yusuf said: Where is the library?"}
  ar.a1.unit09.lesson02.teach.line02: {title: "Locate the library", gloss: "Layla says the library is here near the market.", note: "هنا and قرب can appear together: here, near the market.", example_gloss: "Layla said: The library is here near the market."}
  ar.a1.unit09.lesson02.teach.line03: {title: "Ask about the cafe", gloss: "Yusuf asks where the cafe is.", note: "و (wa, and) is written joined to the next word: وأين (wa-ayna), and where.", example_gloss: "Yusuf said: And where is the cafe?"}
  ar.a1.unit09.lesson02.teach.line04: {title: "Locate the cafe", gloss: "Layla says the cafe is near the library.", note: "Place + قرب + second place: المقهى قرب المكتبة, the cafe is near the library.", example_gloss: "Layla said: The cafe is near the library."}
exercises:
  ar.a1.unit09.lesson01.exercise07.dictation_place_location:
    instruction: "Type what you hear."
    correct_option: "المقهى هنا"
    accepted_answers: [{value: "المقهى هنا", status: correct}]
    orthography_strict: true

  ar.a1.unit09.lesson01.exercise01.recognize_library:
    instruction: "Select the meaning."
    correct_option: library
    distractors: [market, cafe, family]
    accepted_answers: [{value: library, status: correct}]
    feedback: "مكتبة means library here."
  ar.a1.unit09.lesson01.exercise02.listen_place_here:
    instruction: "Listen and select the location sentence."
    correct_option: "The cafe is here."
    distractors: ["The market is here.", "The library is near.", "Where is the cafe?"]
    accepted_answers: [{value: "The cafe is here.", status: correct}]
    feedback: "You heard المقهى هنا."
  ar.a1.unit09.lesson01.exercise03.match_places:
    instruction: "Match each Arabic word with its meaning."
    accepted_answers:
      - value: {مكتبة: library, سوق: market, مقهى: cafe, هنا: here}
        status: correct
    feedback: "These are common places and a basic location word."
  ar.a1.unit09.lesson01.exercise04.order_cafe_here:
    instruction: "Arrange the Arabic words for The cafe is here."
    accepted_answers: [{value: [المقهى, هنا], status: correct}]
    feedback: "المقهى هنا means The cafe is here."
  ar.a1.unit09.lesson01.exercise05.translate_market_here:
    instruction: "Translate into Arabic: The market is here."
    accepted_answers:
      - {value: "السوق هنا", status: correct}
      - {value: "السوق هنا.", status: correct}
      - {value: "هنا السوق", status: correct}
    feedback: "السوق هنا means The market is here."
  ar.a1.unit09.lesson01.exercise06.write_library_here:
    instruction: "Type The library is here in Arabic."
    accepted_answers:
      - {value: "المكتبة هنا", status: correct}
      - {value: "المكتبة هنا.", status: correct}
      - {value: "هنا المكتبة", status: correct}
    feedback: "المكتبة هنا means The library is here."
  ar.a1.unit09.lesson02.exercise01.recognize_near:
    instruction: "Select the meaning."
    correct_option: near
    distractors: [here, when, price]
    accepted_answers: [{value: near, status: correct}]
    feedback: "قرب means near."
  ar.a1.unit09.lesson02.exercise02.dialogue_library_location:
    instruction: "Where is the library?"
    correct_option: "here near the market"
    distractors: ["near the school", "in Lebanon", "at five o'clock"]
    accepted_answers: [{value: "here near the market", status: correct}]
    feedback: "Layla says المكتبة هنا قرب السوق."
  ar.a1.unit09.lesson02.exercise03.match_locations:
    instruction: "Match each Arabic location sentence with its meaning."
    accepted_answers:
      - value: {"المكتبة هنا": "The library is here", "المقهى قرب المكتبة": "The cafe is near the library"}
        status: correct
    feedback: "These sentences locate common places."
  ar.a1.unit09.lesson02.exercise04.order_near_library:
    instruction: "Arrange the Arabic words for The cafe is near the library."
    accepted_answers: [{value: [المقهى, قرب, المكتبة], status: correct}]
    feedback: "المقهى قرب المكتبة locates the cafe."
  ar.a1.unit09.lesson02.exercise05.state_location:
    instruction: "Answer أين المقهى؟ with The cafe is near the library."
    accepted_answers:
      - {value: "المقهى قرب المكتبة", status: correct}
      - {value: "المقهى قرب المكتبة.", status: correct}
      - {value: "هو قرب المكتبة", status: correct}
      - {value: "المقهى بالقرب من المكتبة", status: correct}
      - {value: "قرب المكتبة", status: acceptable_with_note, note: "Correct as a short answer; the full sentence is المقهى قرب المكتبة."}
    feedback: "المقهى قرب المكتبة is the requested location answer."
  ar.a1.unit09.lesson02.exercise06.write_location:
    instruction: "Type The library is near the market in Arabic."
    accepted_answers:
      - {value: "المكتبة قرب السوق", status: correct}
      - {value: "المكتبة قرب السوق.", status: correct}
      - {value: "المكتبة بالقرب من السوق", status: correct}
      - {value: "المكتبة قريبة من السوق", status: correct}
    feedback: "المكتبة قرب السوق means The library is near the market."
