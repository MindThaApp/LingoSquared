course:
  title: Arabic A1
  description: >-
    Beginner Modern Standard Arabic (fusha) -- reading the script,
    everyday greetings, and handling short polite exchanges.

units:
  ar.a1.unit01.greetings:
    title: "Greetings and farewells"

lessons:
  ar.a1.unit01.lesson01.script_ramp: {title: "Read your first Arabic word"}
  ar.a1.unit01.lesson02.everyday_greetings: {title: "Everyday greetings"}
  ar.a1.unit01.lesson03.time_and_farewells: {title: "Greetings and farewells through the day"}
  ar.a1.unit01.lesson04.wellbeing_exchange: {title: "Asking how someone is"}

teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: "Arabic runs right to left"
    gloss: "Arabic is written from right to left."
    note: "Read Arabic from the right edge toward the left."
  ar.a1.unit01.lesson01.teach.mim:
    title: "The letter م"
    gloss: "m"
    note: "م represents an m sound and changes shape depending on its position in a word."
  ar.a1.unit01.lesson01.teach.ra:
    title: "The letter ر"
    gloss: "r"
    note: "ر represents a rolled r sound and does not connect to the letter after it."
  ar.a1.unit01.lesson01.teach.ha:
    title: "The letter ح"
    gloss: "ḥ"
    note: "ح is a breathy h sound made deep in the throat, distinct from the plain English h."
  ar.a1.unit01.lesson01.teach.ba:
    title: "The letter ب"
    gloss: "b"
    note: "ب represents a b sound and connects to surrounding letters."
  ar.a1.unit01.lesson01.teach.alef:
    title: "The letter ا"
    gloss: "ā / a"
    note: "ا marks a long ā vowel and does not connect onward to the next letter."
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: "Build مرحبا"
    gloss: "hello"
    note: "مرحبا is read marḥaban. Short vowels are normally omitted in Arabic writing."
    example_gloss: "Hello! I'm Sara."

  ar.a1.unit01.lesson02.teach.marhaba:
    title: "Hello"
    gloss: "hello"
    note: "مرحبا is a warm, all-purpose greeting suitable in almost any situation."
    example_gloss: "Hi, how are you?"
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: "Good morning"
    gloss: "good morning"
    note: "صباح الخير is read ṣabāḥ al-khayr, literally 'morning of goodness.'"
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: "Good afternoon or evening"
    gloss: "good afternoon / good evening"
    note: "مساء الخير is read masāʾ al-khayr and is used from later afternoon into the evening."
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: "Goodbye"
    gloss: "goodbye"
    note: "مع السلامة is read maʿa as-salāma, literally 'with safety' -- the standard general farewell."
    example_gloss: "Thanks, goodbye!"
  ar.a1.unit01.lesson02.teach.shukran:
    title: "Thank you"
    gloss: "thank you"
    note: "شكرا is read shukran and works in every register."
    example_gloss: "Thank you very much."
  ar.a1.unit01.lesson02.teach.afwan:
    title: "You're welcome"
    gloss: "you're welcome"
    note: "عفوا (ʿafwan) is the conventional reply to شكرا; it can also mean 'excuse me' in a different context."

  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: "Good night"
    gloss: "good night"
    note: "تصبح على خير (tuṣbiḥ ʿalā khayr) is said when parting for the night or going to bed, not an opening greeting."
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: "Welcome"
    gloss: "welcome"
    note: "أهلا وسهلا (ahlan wa sahlan) welcomes a guest or greets someone warmly on arrival."
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: "See you"
    gloss: "see you / until we meet again"
    note: "إلى اللقاء (ilā al-liqāʾ) is a polished, neutral farewell."
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: "Good morning, reply"
    gloss: "good morning [reply]"
    note: "صباح النور (ṣabāḥ an-nūr, 'morning of light') is the conventional answer to صباح الخير."
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: "Good evening, reply"
    gloss: "good evening [reply]"
    note: "مساء النور (masāʾ an-nūr) is the conventional answer to مساء الخير."
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: "Have a nice day"
    gloss: "have a nice day"
    note: "يوما سعيدا (yawman saʿīdan) is a warm closing wish."

  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: "How are you?"
    gloss: "How are you?"
    note: "كيف حالك؟ (kayfa ḥāluk) is the standard way to ask how someone is; unvocalized, the written form works for any listener."
  ar.a1.unit01.lesson04.teach.gender_note:
    title: "Masculine and feminine you"
    gloss: "you (m.) / you (f.)"
    note: "Spoken Arabic distinguishes أنتَ (anta, to a man) from أنتِ (anti, to a woman) -- and حالَك from حالِك the same way. Without the diacritics shown here, the written forms used in this course are identical for both."
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: "Fine / well"
    gloss: "fine / well"
    note: "بخير (bikhayr) is the standard positive answer to كيف حالك؟"
    example_gloss: "I'm fine today."
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: "Thank God"
    gloss: "thank God / praise be to God"
    note: "الحمد لله (al-ḥamdu lillāh) very commonly follows بخير in an answer, regardless of the speaker's own religious practice -- it functions as an ordinary conversational closer, much like 'thankfully' in English."
    example_gloss: "Fine, thank God."
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: "And you?"
    gloss: "And you?"
    note: "وأنت؟ (wa anta) returns the question."
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: "Excellent"
    gloss: "excellent / great"
    note: "ممتاز (mumtāz) is an enthusiastic upgrade from بخير."
    example_gloss: "I'm doing great today!"
  ar.a1.unit01.lesson04.teach.la_bas:
    title: "Not bad"
    gloss: "not bad"
    note: "لا بأس (lā baʾs) is a natural moderate answer, not a complaint."

exercises:
  ar.a1.unit01.lesson01.exercise01.recognize_marhaba:
    instruction: "Select the Arabic word for hello."
    correct_option: مرحبا
    distractors: [محارب, رحبام, بحمرا]
    accepted_answers: [{value: مرحبا, status: correct}]
    feedback: "مرحبا is the complete written word marḥaban."
  ar.a1.unit01.lesson01.exercise02.recognize_mim:
    instruction: "Which letter makes the m sound?"
    correct_option: م
    distractors: [ر, ح, ب]
    accepted_answers: [{value: م, status: correct}]
    feedback: "م represents the m sound."
  ar.a1.unit01.lesson01.exercise03.recognize_ha:
    instruction: "Which letter makes the breathy ḥ sound?"
    correct_option: ح
    distractors: [م, ر, ب]
    accepted_answers: [{value: ح, status: correct}]
    feedback: "ح represents the ḥ sound."
  ar.a1.unit01.lesson01.exercise05.select_missing_ra:
    instruction: "Select the missing Arabic letter."
    correct_option: ر
    distractors: [م, ح, ب]
    accepted_answers: [{value: ر, status: correct}]
    feedback: "The missing letter is ر."
  ar.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: "Is this Arabic word read starting from the right?"
    correct_option: "Yes"
    distractors: ["No"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "Arabic is read from right to left."
  ar.a1.unit01.lesson01.exercise04.build_marhaba:
    instruction: "Arrange the letters to build مرحبا."
    accepted_answers: [{value: [م, ر, ح, ب, ا], status: correct}]
    feedback: "The ordered letters form مرحبا."
  ar.a1.unit01.lesson01.exercise06.match_letters:
    instruction: "Match each Arabic letter with its approximate Latin sound."
    accepted_answers:
      - value: {م: m, ر: r, ح: "ḥ", ب: b, ا: "ā"}
        status: correct
    feedback: "These five associations build مرحبا."
  ar.a1.unit01.lesson01.exercise08.romanize_marhaba:
    instruction: "Type a common Latin-letter transliteration of مرحبا."
    answer_language_code: en
    accepted_answers:
      - {value: marhaban, status: correct}
      - {value: "marḥaban", status: correct}
      - {value: marhaba, status: correct}
      - {value: "marḥaba", status: correct}
    feedback: "The course form is marḥaban; marḥaba is also accepted."

  ar.a1.unit01.lesson02.exercise01.listen_marhaba:
    instruction: "Listen and select the word you hear."
    correct_option: مرحبا
    distractors: [مساء الخير, شكرا, عفوا]
    accepted_answers: [{value: مرحبا, status: correct}]
    feedback: "You heard مرحبا, hello."
  ar.a1.unit01.lesson02.exercise02.recognize_morning_reading:
    instruction: "What does this greeting mean?"
    correct_option: "good morning"
    distractors: ["good afternoon / good evening", goodbye, hello]
    accepted_answers: [{value: "good morning", status: correct}]
    feedback: "صباح الخير is the standard morning greeting."
  ar.a1.unit01.lesson02.exercise03.goodbye_meaning:
    instruction: "Select the meaning of مع السلامة."
    correct_option: goodbye
    distractors: [hello, "thank you", "good evening"]
    accepted_answers: [{value: goodbye, status: correct}]
    feedback: "مع السلامة is the standard general farewell."
  ar.a1.unit01.lesson02.exercise04.recognize_evening_reading:
    instruction: "What does this greeting mean?"
    correct_option: "good afternoon / good evening"
    distractors: ["good morning", goodbye, hello]
    accepted_answers: [{value: "good afternoon / good evening", status: correct}]
    feedback: "مساء الخير is used later in the day."
  ar.a1.unit01.lesson02.exercise05.order_goodbye:
    instruction: "Arrange the Arabic words for goodbye."
    accepted_answers: [{value: [مع, السلامة], status: correct}]
    feedback: "مع السلامة is the standard farewell."
  ar.a1.unit01.lesson02.exercise06.reply_thanks:
    instruction: "Reply to شكرا with you're welcome."
    accepted_answers:
      - {value: عفوا, status: correct}
      - {value: "عفوا.", status: correct}
    feedback: "عفوا is the conventional response to thanks."
  ar.a1.unit01.lesson02.exercise07.produce_evening:
    instruction: "Translate into Arabic: Good evening."
    accepted_answers:
      - {value: "مساء الخير", status: correct}
    feedback: "مساء الخير means good evening."
  ar.a1.unit01.lesson02.exercise08.romanize_goodbye:
    instruction: "Type a common Latin-letter transliteration of مع السلامة."
    answer_language_code: en
    accepted_answers:
      - {value: "maa alsalama", status: correct}
      - {value: "ma'a as-salama", status: correct}
      - {value: "maa as-salama", status: correct}
      - {value: "ma salama", status: acceptable_with_note, note: "A common casual English-oriented spelling."}
    feedback: "The course form is maʿa as-salāma."

  ar.a1.unit01.lesson03.exercise01.night_meaning:
    instruction: "Select the normal use of تصبح على خير."
    correct_option: "good night when leaving or going to bed"
    distractors: ["good morning", "welcome", "thank you"]
    accepted_answers: [{value: "good night when leaving or going to bed", status: correct}]
    feedback: "تصبح على خير normally closes an evening interaction."
  ar.a1.unit01.lesson03.exercise02.welcome_meaning:
    instruction: "Select the meaning of أهلا وسهلا."
    correct_option: welcome
    distractors: [goodbye, "good night", "excellent"]
    accepted_answers: [{value: welcome, status: correct}]
    feedback: "أهلا وسهلا greets a guest or someone arriving."
  ar.a1.unit01.lesson03.exercise03.recognize_see_you_reading:
    instruction: "What does this phrase mean?"
    correct_option: "see you / until we meet again"
    distractors: ["good night", "welcome", "I'm well"]
    accepted_answers: [{value: "see you / until we meet again", status: correct}]
    feedback: "إلى اللقاء means see you again."
  ar.a1.unit01.lesson03.exercise04.order_see_you:
    instruction: "Arrange the farewell for see you again."
    accepted_answers: [{value: [إلى, اللقاء], status: correct}]
    feedback: "إلى اللقاء means see you again."
  ar.a1.unit01.lesson03.exercise05.build_good_day:
    instruction: "Arrange the words to say Have a nice day."
    accepted_answers: [{value: [يوما, سعيدا], status: correct}]
    feedback: "The complete phrase is يوما سعيدا."
  ar.a1.unit01.lesson03.exercise06.translate_night:
    instruction: "Translate into Arabic: Good night."
    accepted_answers:
      - {value: "تصبح على خير", status: correct}
    feedback: "تصبح على خير means good night."
  ar.a1.unit01.lesson03.exercise07.welcome_response:
    instruction: "Choose a natural reply to أهلا وسهلا."
    accepted_answers:
      - {value: "أهلا بك", status: correct}
      - {value: "أهلا بك.", status: correct}
      - {value: شكرا, status: correct}
      - {value: "أهلا فيك", status: correct}
    feedback: "أهلا بك (welcome to you too) and شكرا are both natural replies."
  ar.a1.unit01.lesson03.exercise08.reply_morning:
    instruction: "Reply to صباح الخير with the conventional answer."
    accepted_answers:
      - {value: "صباح النور", status: correct}
      - {value: "صباح النور.", status: correct}
    feedback: "صباح النور is the standard reply to صباح الخير."

  ar.a1.unit01.lesson04.exercise01.listen_how_are_you:
    instruction: "Listen and select what you hear."
    correct_option: "How are you?"
    distractors: ["Good morning.", "Thank you.", "Goodbye."]
    accepted_answers: [{value: "How are you?", status: correct}]
    feedback: "You heard كيف حالك؟, how are you?"
  ar.a1.unit01.lesson04.exercise02.recognize_fine_reading:
    instruction: "What does this word mean?"
    correct_option: "fine / well"
    distractors: [excellent, "not bad", goodbye]
    accepted_answers: [{value: "fine / well", status: correct}]
    feedback: "بخير means fine or well."
  ar.a1.unit01.lesson04.exercise03.recognize_excellent:
    instruction: "What does this word mean?"
    correct_option: "excellent / great"
    distractors: ["fine / well", "not bad", welcome]
    accepted_answers: [{value: "excellent / great", status: correct}]
    feedback: "ممتاز means excellent or great."
  ar.a1.unit01.lesson04.exercise04.recognize_not_bad:
    instruction: "What does this phrase mean?"
    correct_option: "not bad"
    distractors: ["excellent / great", goodbye, "thank you"]
    accepted_answers: [{value: "not bad", status: correct}]
    feedback: "لا بأس means not bad."
  ar.a1.unit01.lesson04.exercise05.order_fine_thanks:
    instruction: "Arrange the words for Fine, thank God."
    accepted_answers: [{value: [بخير, الحمد, لله], status: correct}]
    feedback: "بخير، الحمد لله means fine, thank God."
  ar.a1.unit01.lesson04.exercise06.reply_how_are_you:
    instruction: "Reply to كيف حالك؟ and ask the question back."
    accepted_answers:
      - {value: "بخير، الحمد لله. وأنت؟", status: correct}
      - {value: "بخير الحمد لله وأنت", status: correct}
      - {value: "بخير، وأنت؟", status: correct}
      - {value: "أنا بخير، الحمد لله. وأنت؟", status: correct}
      - {value: بخير, status: acceptable_with_note, note: "Correct but omits the polite thanks and return question."}
    feedback: "بخير، الحمد لله. وأنت؟ means I'm fine, thank God. And you?"
  ar.a1.unit01.lesson04.exercise07.translate_not_bad:
    instruction: "Translate into Arabic: Not bad."
    accepted_answers:
      - {value: "لا بأس", status: correct}
    feedback: "لا بأس means not bad."
  ar.a1.unit01.lesson04.exercise08.speak_how_are_you:
    instruction: "Repeat the question."
    accepted_answers: [{value: "كيف حالك", status: correct}]
    feedback: "The expected words are كيف حالك."
