teaching:
  ar.a1.unit06.lesson01.teach.family: {title: "Family", gloss: "family", note: "عائلة (ʿāʾila) is the general word for family. In the example, هذه is the feminine form of هذا (this), used because عائلة is feminine.", example_gloss: "This is a family."}
  ar.a1.unit06.lesson01.teach.father: {title: "Father", gloss: "father", note: "أب (ab) means father.", example_gloss: "I have a father."}
  ar.a1.unit06.lesson01.teach.mother: {title: "Mother", gloss: "mother", note: "أم (umm) means mother.", example_gloss: "I have a mother."}
  ar.a1.unit06.lesson01.teach.brother: {title: "Brother", gloss: "brother", note: "أخ (akh) means brother.", example_gloss: "I have a brother."}
  ar.a1.unit06.lesson01.teach.sister: {title: "Sister", gloss: "sister", note: "أخت (ukht) means sister.", example_gloss: "I have a brother and a sister."}
  ar.a1.unit06.lesson01.teach.i_have: {title: "I have", gloss: "I have", note: "عندي (ʿindī, literally 'with me') is the simple A1 way to say you have something; لدي (ladayya) is a more formal equivalent.", example_gloss: "I have a sister."}
  ar.a1.unit06.lesson02.teach.in_family: {title: "In your family", gloss: "in your family", note: "Here من is man, 'who', not min 'from' as in من أين أنت؟ - the two are written the same. عائلتك means your family: ʿāʾilatuka to a man, ʿāʾilatuki to a woman.", example_gloss: "Who is in your family?"}
  ar.a1.unit06.lesson02.teach.sister_name: {title: "Her name is Nour", gloss: "her name is Nour", note: "اسمها means her name.", example_gloss: "Yusuf said: Her name is Nour."}
  ar.a1.unit06.lesson02.teach.line01: {title: "Ask about family", gloss: "Layla asks who is in Yusuf's family.", note: "من (man) means who here. يا يوسف addresses Yusuf by name.", example_gloss: "Layla said: Who is in your family, Yusuf?"}
  ar.a1.unit06.lesson02.teach.line02: {title: "Describe family", gloss: "Yusuf says he has a father, mother, and sister.", note: "و joins family members.", example_gloss: "Yusuf said: I have a father, a mother, and a sister."}
  ar.a1.unit06.lesson02.teach.line03: {title: "Ask the sister's name", gloss: "Layla asks his sister's name.", note: "أختك means your sister: ukhtuka to a man, ukhtuki to a woman. Here Layla is asking Yusuf, so ukhtuka.", example_gloss: "Layla said: What is your sister's name?"}
  ar.a1.unit06.lesson02.teach.line04: {title: "Give her name", gloss: "Yusuf says her name is Nour.", note: "The ending ـها means her: اسمها (ismuhā), her name.", example_gloss: "Yusuf said: Her name is Nour."}

exercises:
  ar.a1.unit06.lesson01.exercise07.dictation_family_intro:
    instruction: "Type what you hear."
    correct_option: "عندي أخ وأخت"
    accepted_answers: [{value: "عندي أخ وأخت", status: correct}]
    orthography_strict: true

  ar.a1.unit06.lesson01.exercise01.recognize_family:
    instruction: "Select the meaning."
    correct_option: family
    distractors: [date, lesson, number]
    accepted_answers: [{value: family, status: correct}]
    feedback: "عائلة means family."
  ar.a1.unit06.lesson01.exercise02.listen_siblings:
    instruction: "Listen and select what the speaker has."
    correct_option: "a brother and a sister"
    distractors: ["a father and a mother", "a father and a brother", "a mother and a sister"]
    accepted_answers: [{value: "a brother and a sister", status: correct}]
    feedback: "عندي أخ وأخت means I have a brother and a sister."
  ar.a1.unit06.lesson01.exercise03.match_family:
    instruction: "Match each Arabic family word with its meaning."
    accepted_answers:
      - value: {أب: father, أم: mother, أخ: brother, أخت: sister}
        status: correct
    feedback: "These are close family members."
  ar.a1.unit06.lesson01.exercise04.order_i_have_sister:
    instruction: "Arrange the Arabic words for I have a sister."
    accepted_answers: [{value: [عندي, أخت], status: correct}]
    feedback: "عندي أخت means I have a sister."
  ar.a1.unit06.lesson01.exercise05.translate_i_have_brother:
    instruction: "Translate into Arabic: I have a brother."
    accepted_answers:
      - {value: "عندي أخ", status: correct}
      - {value: "عندي أخ.", status: correct}
      - {value: "لدي أخ", status: correct}
    feedback: "عندي أخ means I have a brother."
  ar.a1.unit06.lesson01.exercise06.write_family_sentence:
    instruction: "Type I have a mother in Arabic."
    accepted_answers:
      - {value: "عندي أم", status: correct}
      - {value: "عندي أم.", status: correct}
      - {value: "لدي أم", status: correct}
    feedback: "عندي أم means I have a mother."
  ar.a1.unit06.lesson02.exercise01.recognize_sister_name:
    instruction: "Select the meaning."
    correct_option: "Her name is Nour."
    distractors: ["My name is Nour.", "His name is Yusuf.", "What is her name?"]
    accepted_answers: [{value: "Her name is Nour.", status: correct}]
    feedback: "اسمها نور means Her name is Nour."
  ar.a1.unit06.lesson02.exercise02.dialogue_relationships:
    instruction: "Who is in Yusuf's family?"
    correct_option: "father, mother, and sister"
    distractors: ["father, brother, and sister", "mother and brother", "sister only"]
    accepted_answers: [{value: "father, mother, and sister", status: correct}]
    feedback: "Yusuf says عندي أب وأم وأخت."
  ar.a1.unit06.lesson02.exercise03.match_profile:
    instruction: "Match each person with the family detail."
    accepted_answers:
      - value: {يوسف: "has a sister", نور: "Yusuf's sister", ليلى: "asks about the family"}
        status: correct
    feedback: "The dialogue identifies Nour as Yusuf's sister."
  ar.a1.unit06.lesson02.exercise04.order_her_name:
    instruction: "Arrange the Arabic words for Her name is Nour."
    accepted_answers: [{value: [اسمها, نور], status: correct}]
    feedback: "اسمها نور means Her name is Nour."
  ar.a1.unit06.lesson02.exercise05.describe_family:
    instruction: "Answer من في عائلتك؟ by saying you have a father, mother, and sister."
    accepted_answers:
      - {value: "عندي أب وأم وأخت", status: correct}
      - {value: "عندي أب وأم وأخت.", status: correct}
      - {value: "لدي أب وأم وأخت", status: correct}
      - {value: "عندي أب و أم و أخت", status: acceptable_with_note, note: "Correct; و is written joined to the next word: وأم، وأخت."}
    feedback: "عندي أب وأم وأخت is the requested family description."
  ar.a1.unit06.lesson02.exercise06.write_family_member:
    instruction: "Type Her name is Nour in Arabic."
    accepted_answers:
      - {value: "اسمها نور", status: correct}
      - {value: "اسمها نور.", status: correct}
    feedback: "اسمها نور means Her name is Nour."
