teaching:
  ar.b1.unit52.lesson01.teach.law_takarramtum: {title: "Would you kindly", gloss: "would you kindly", note: "*لو تكرمتم* (lit. if you would be so kind) is a formal softened-conditional request; the result (I would be grateful) is left unsaid. تكرمتم is the plural you, used here as a respectful form even to one person; to one colleague you can also say لو تكرمتَ (to a man) or لو تكرمتِ (to a woman).", example_gloss: "Would you kindly review the report."}
  ar.b1.unit52.lesson01.teach.bimurajaat_altaqrir: {title: "Reviewing the report", gloss: "reviewing the report", note: "*بمراجعة التقرير* means reviewing the report; تكرم takes بـ + a verbal noun: لو تكرمتم بمراجعة... (would you kindly review...).", example_gloss: "Would you kindly review the report."}
  ar.b1.unit52.lesson01.teach.qabl_alijtimaa: {title: "Before the next meeting", gloss: "before the next meeting", note: "*قبل الاجتماع القادم* means before the next meeting.", example_gloss: "Would you kindly review the report before the next meeting."}
  ar.b1.unit52.lesson01.teach.yusuf_law_takarramtum: {title: "Yusuf makes a formal request", gloss: "Would you kindly review the report before the next meeting.", note: "*لو تكرمتم* softens a formal-register request.", example_gloss: "Yusuf said formally: Would you kindly review the report before the next meeting."}
  ar.b1.unit52.lesson02.teach.hal_yumkinuna: {title: "Can we", gloss: "can we", note: "*هل يمكننا* opens a polite meeting-transition question.", example_gloss: "Can we move to the next point?"}
  ar.b1.unit52.lesson02.teach.alintiqal_ila_alnuqta: {title: "Moving to the next point", gloss: "moving to the next point", note: "*الانتقال إلى النقطة التالية* means moving to the next point.", example_gloss: "Can we move to the next point?"}
  ar.b1.unit52.lesson02.teach.laila_hal_yumkinuna: {title: "Layla moves the meeting along", gloss: "Can we move to the next point?", note: "A short, professional way to transition between agenda points in a meeting.", example_gloss: "Layla said in the meeting: Can we move to the next point?"}
  ar.b1.unit52.lesson03.teach.hal_hunaka_mulahazat: {title: "Are there any comments on the report?", gloss: "are there any comments on the report?", note: "This opens the meeting exchange.", example_gloss: "Layla said: Are there any comments on the report?"}
  ar.b1.unit52.lesson03.teach.laila_bialtabi: {title: "Of course", gloss: "of course", note: "*بالطبع* is a short professional acknowledgment.", example_gloss: "Layla said: Of course."}
exercises:
