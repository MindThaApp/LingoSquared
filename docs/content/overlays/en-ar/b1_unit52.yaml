    distractors: ["You reviewed the report", "Would you kindly ignore the report", "Would you kindly write the report"]
    accepted_answers: [{value: "Would you kindly review the report", status: correct}]
    feedback: "*لو تكرمتم بمراجعة التقرير* is a formal softened request."
  ar.b1.unit52.lesson01.exercise02.recognize_law_takarramtum_full:
    instruction: "Select the meaning."
