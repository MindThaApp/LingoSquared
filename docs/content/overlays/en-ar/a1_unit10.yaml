review: {status: reviewed, required_next_reviewer: native_speaker_review, notes: "Paired with ar a1_unit10_directions. Review 2026-10-19: 7 fixes - 6 example_glosses dropped the Yusuf/Layla said: frame; forward note falsely implied Arabic has no front-word (الأمام literally is the front), rewritten; امش is masculine-only and the note gave no feminine: walk and line02 notes now give امشي, and give_route / write_two_steps accept امشي variants; route note was internal-jargon (culminating route pattern), now explains step + ثم + step; forward/to_right example_glosses follow the realization examples that replaced the untaught امش; right/left glosses disambiguated as directions (right is also correct in English); recognize_right correct option now right (direction); transliterations added. NATIVE FLAGS: none."}
