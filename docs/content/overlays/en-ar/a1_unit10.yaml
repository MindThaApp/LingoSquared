  ar.a1.unit10.lesson01.direction_words: {title: "Right and left"}
  ar.a1.unit10.lesson02.basic_route: {title: "The way to the library"}
teaching:
  ar.a1.unit10.lesson01.teach.right: {title: "Right", gloss: "right (direction)", note: "يمين (yamīn) names the right side; اليمين (al-yamīn) is 'the right'.", example_gloss: "To the right."}
  ar.a1.unit10.lesson01.teach.left: {title: "Left", gloss: "left (direction)", note: "يسار (yasār) names the left side; اليسار (al-yasār) is 'the left'.", example_gloss: "To the left."}
  ar.a1.unit10.lesson01.teach.forward: {title: "Straight ahead", gloss: "straight ahead", note: "إلى الأمام (ilā l-amām) literally means 'to the front'; it is the usual way to say straight ahead or forward.", example_gloss: "The library is straight ahead."}
  ar.a1.unit10.lesson01.teach.to_right: {title: "To the right", gloss: "to the right", note: "إلى (ilā) marks movement toward a direction or place.", example_gloss: "The market is to the right."}
  ar.a1.unit10.lesson02.teach.walk: {title: "Walk", gloss: "walk", note: "امش (imshi) is the command 'walk!' said to a man; to a woman it is امشي (imshī). It is the usual verb for giving walking directions.", example_gloss: "Walk straight ahead."}
  ar.a1.unit10.lesson02.teach.then: {title: "Then", gloss: "then", note: "ثم (thumma) joins two route steps in order.", example_gloss: "Walk straight ahead, then to the right."}
  ar.a1.unit10.lesson02.teach.route: {title: "Two route steps", gloss: "Walk straight ahead, then to the right", note: "Step one + ثم + step two. The verb is not repeated after ثم.", example_gloss: "Layla said: Walk straight ahead, then to the right."}
  ar.a1.unit10.lesson02.teach.line01: {title: "Ask for the library", gloss: "Yusuf asks where the library is.", note: "أين المكتبة؟ was already used for places.", example_gloss: "Yusuf said: Where is the library?"}
  ar.a1.unit10.lesson02.teach.line02: {title: "Give directions", gloss: "Layla gives two basic route steps.", note: "Layla says امش because she is speaking to a man; to a woman she would say امشي.", example_gloss: "Layla said: Walk straight ahead, then to the right."}
  ar.a1.unit10.lesson02.teach.line03: {title: "Thank someone", gloss: "Yusuf says thank you.", note: "شكرا closes the help exchange politely.", example_gloss: "Yusuf said: Thank you."}
  ar.a1.unit10.lesson02.teach.line04: {title: "Confirm the place", gloss: "Layla says the library is near the market.", note: "This reuses قرب from the places unit: the library is near the market.", example_gloss: "Layla said: The library is near the market."}
exercises:
  ar.a1.unit10.lesson01.exercise01.recognize_right:
    instruction: "Select the meaning."
    correct_option: "right (direction)"
    distractors: ["left (direction)", market, price]
    accepted_answers: [{value: "right (direction)", status: correct}]
    feedback: "يمين means right."
  ar.a1.unit10.lesson01.exercise02.listen_right:
    instruction: "Listen and select what you hear."
    correct_option: "to the right"
    distractors: ["to the left", "straight ahead", "near the market"]
    accepted_answers: [{value: "to the right", status: correct}]
    feedback: "You heard إلى اليمين."
  ar.a1.unit10.lesson01.exercise03.match_directions:
    instruction: "Match each Arabic direction with its meaning."
    accepted_answers:
      - value: {يمين: right, يسار: left, "إلى الأمام": "straight ahead"}
        status: correct
    feedback: "These are the direction words for a short route."
  ar.a1.unit10.lesson01.exercise04.order_to_right:
    instruction: "Arrange the Arabic words for to the right."
    accepted_answers: [{value: [إلى, اليمين], status: correct}]
    feedback: "إلى اليمين means to the right."
  ar.a1.unit10.lesson01.exercise05.translate_forward:
    instruction: "Translate into Arabic: Straight ahead."
    accepted_answers:
      - {value: "إلى الأمام", status: correct}
      - {value: "إلى الأمام.", status: correct}
    feedback: "إلى الأمام means straight ahead."
  ar.a1.unit10.lesson01.exercise06.write_to_left:
    instruction: "Type to the left in Arabic."
    accepted_answers:
      - {value: "إلى اليسار", status: correct}
      - {value: "إلى اليسار.", status: correct}
    feedback: "إلى اليسار means to the left."
  ar.a1.unit10.lesson02.exercise01.recognize_walk:
    instruction: "Select the meaning."
    correct_option: walk
    distractors: [sleep, drink, ask]
    accepted_answers: [{value: walk, status: correct}]
    feedback: "امش means walk as a direction command."
  ar.a1.unit10.lesson02.exercise02.dialogue_destination:
    instruction: "What directions does Layla give?"
    correct_option: "walk straight ahead, then right"
    distractors: ["turn left, then stop", "go to the cafe", "ask at the market"]
    accepted_answers: [{value: "walk straight ahead, then right", status: correct}]
    feedback: "Layla says امش إلى الأمام ثم إلى اليمين."
  ar.a1.unit10.lesson02.exercise03.match_route_steps:
    instruction: "Match each Arabic route word or phrase with its meaning."
    accepted_answers:
      - value: {امش: walk, "إلى الأمام": "straight ahead", "إلى اليمين": "to the right", ثم: then}
        status: correct
    feedback: "These parts make a two-step route."
  ar.a1.unit10.lesson02.exercise04.order_route:
    instruction: "Arrange the Arabic words for Walk straight ahead, then to the right."
    accepted_answers: [{value: [امش, إلى, الأمام, ثم, إلى, اليمين], status: correct}]
    feedback: "امش إلى الأمام ثم إلى اليمين gives the route."
  ar.a1.unit10.lesson02.exercise05.give_route:
    instruction: "Type the Arabic route answer: Walk straight ahead, then to the right."
    accepted_answers:
      - {value: "امش إلى الأمام ثم إلى اليمين", status: correct}
      - {value: "امش إلى الأمام ثم إلى اليمين.", status: correct}
      - {value: "امشي إلى الأمام ثم إلى اليمين", status: correct}
    feedback: "امش إلى الأمام ثم إلى اليمين is the expected two-step direction."
  ar.a1.unit10.lesson02.exercise06.write_two_steps:
    instruction: "Type the Arabic question and route: Where is the library? Walk straight ahead, then to the right."
    accepted_answers:
      - {value: "أين المكتبة؟ امش إلى الأمام ثم إلى اليمين.", status: correct}
      - {value: "أين المكتبة؟ امش إلى الأمام ثم إلى اليمين", status: correct}
      - {value: "أين المكتبة امش إلى الأمام ثم إلى اليمين.", status: correct}
      - {value: "أين المكتبة امش إلى الأمام ثم إلى اليمين", status: correct}
      - {value: "أين المكتبة؟ امشي إلى الأمام ثم إلى اليمين.", status: correct}
      - {value: "أين المكتبة امشي إلى الأمام ثم إلى اليمين", status: correct}
    feedback: "أين المكتبة؟ امش إلى الأمام ثم إلى اليمين. asks for the place and gives a two-step route."
