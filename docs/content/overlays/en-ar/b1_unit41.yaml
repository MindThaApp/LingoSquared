    instruction: "Arrange the Arabic words for If it does not rain, we will go to the park."
    accepted_answers: [{value: [إذا, لم, تمطر, فسنذهب, إلى, الحديقة], status: correct}]
    feedback: "*إذا لم تمطر فسنذهب إلى الحديقة* negates the condition with إذا لم."
  ar.b1.unit41.lesson02.exercise06.write_negated_condition:
    instruction: "Write exactly this negated real/possible conditional sentence with إذا لم + a jussive verb + a result marked with فـ and the future prefix س: If it does not rain, we will go to the park."
    accepted_answers:
      - {value: "إذا لم تمطر فسنذهب إلى الحديقة", status: correct}
