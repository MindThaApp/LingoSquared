teaching:
  ar.b1.unit41.lesson01.teach.amtarat: {title: "It rains / it rained", gloss: "it rains / rained", note: "*أمطرت* means it rained/rains, used here as the condition verb.", example_gloss: "If it rains, we will stay home."}
  ar.b1.unit41.lesson01.teach.sanabqa: {title: "We will stay", gloss: "we will stay", note: "*سنبقى* means we will stay, marked with the future prefix س.", example_gloss: "We will stay home."}
  ar.b1.unit41.lesson01.teach.albayt: {title: "The house", gloss: "the house", note: "*البيت* means the house/home.", example_gloss: "If it rains, we will stay home."}
  ar.b1.unit41.lesson01.teach.laila_idha_amtarat: {title: "Layla states the real condition", gloss: "If it rains, we will stay home.", note: "*إذا* + a past-tense condition verb + a س-marked result states a real/possible condition. In formal Arabic the result clause takes *فـ* when it starts with سـ/سوف, لن, قد, ما, a noun phrase, a command, a لا-prohibition or a question: *فسنبقى* (fa-sa-nabqā), 'then we will stay'. After *لو* the result takes *لـ* instead, never *فـ*.", example_gloss: "Layla said: If it rains, we will stay home."}
  ar.b1.unit41.lesson02.teach.lam_tumtir: {title: "It does not rain", gloss: "it does not rain", note: "*لم تمطر* negates the condition verb with لم + the jussive form of the present-tense verb; after إذا it refers to the future: if it does not rain.", example_gloss: "If it does not rain, we will go to the park."}
  ar.b1.unit41.lesson02.teach.sanadhab: {title: "We will go", gloss: "we will go", note: "*سنذهب* means we will go.", example_gloss: "We will go to the park."}
  ar.b1.unit41.lesson02.teach.alhadiqa: {title: "The park", gloss: "the park", note: "*الحديقة* means the park.", example_gloss: "We will go to the park."}
  ar.b1.unit41.lesson02.teach.laila_idha_lam_tumtir: {title: "Layla negates the condition", gloss: "If it does not rain, we will go to the park.", note: "*إذا لم* negates the real condition to express \"if not.\" The س-result again takes *فـ*: *فسنذهب* (fa-sa-nadh·hab).", example_gloss: "Layla said: If it does not rain, we will go to the park."}
  ar.b1.unit41.lesson03.teach.nihaya_alusbua: {title: "The weekend", gloss: "the weekend", note: "*نهاية الأسبوع* means the weekend.", example_gloss: "What will you do on the weekend?"}
  ar.b1.unit41.lesson03.teach.yusuf_ask_plans: {title: "Yusuf asks about the weekend", gloss: "Yusuf says: What will you do on the weekend?", note: "This opens the dialogue.", example_gloss: "What will you do on the weekend?"}
  ar.b1.unit41.lesson03.teach.laila_full_plan: {title: "Layla states the condition and its negation", gloss: "If it rains, we will stay home. If it does not rain, we will go to the park.", note: "This closes the exchange, stating both the real condition and its negation.", example_gloss: "Layla said: If it rains, we will stay home. If it does not rain, we will go to the park."}
exercises:
  ar.b1.unit41.lesson01.exercise01.recognize_idha_amtarat:
    instruction: "Select the meaning."
    correct_option: "If it rains"
    distractors: ["If it rained yesterday", "It rains a lot", "Because it rains"]
    accepted_answers: [{value: "If it rains", status: correct}]
    feedback: "*إذا أمطرت* states the real/possible condition."
  ar.b1.unit41.lesson01.exercise02.recognize_sanabqa_albayt:
    instruction: "Select the meaning."
    correct_option: "We will stay home"
    distractors: ["We stayed home", "We will not stay home", "We are staying at a friend's house"]
    accepted_answers: [{value: "We will stay home", status: correct}]
    feedback: "*سنبقى في البيت* is the future-marked result."
  ar.b1.unit41.lesson01.exercise03.listen_select_real_condition:
    instruction: "Listen and select what Layla says."
    correct_option: "If it rains, we will stay home."
    distractors: ["It rained yesterday, so we stayed home.", "If it rains, we will go to the park.", "We will stay home this weekend."]
    accepted_answers: [{value: "If it rains, we will stay home.", status: correct}]
    feedback: "You heard *إذا أمطرت، فسنبقى في البيت*."
  ar.b1.unit41.lesson01.exercise04.match_real_condition:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {إذا: if, أمطرت: "it rains", سنبقى: "we will stay", البيت: "the house", "إذا أمطرت": "If it rains", "سنبقى في البيت": "we will stay home"}
        status: correct
    feedback: "These phrases cover the real/possible condition and its result."
  ar.b1.unit41.lesson01.exercise05.order_real_condition:
    instruction: "Arrange the Arabic words for If it rains, we will stay home."
    accepted_answers: [{value: [إذا, أمطرت, فسنبقى, في, البيت], status: correct}]
    feedback: "*إذا أمطرت فسنبقى في البيت* states a real/possible condition with a س-marked result."
  ar.b1.unit41.lesson01.exercise06.write_real_condition:
    instruction: "Write exactly this real/possible conditional sentence with إذا + a result marked with فـ and the future prefix س: If it rains, we will stay home."
    accepted_answers:
      - {value: "إذا أمطرت فسنبقى في البيت", status: correct}
      - {value: "إذا أمطرت، فسنبقى في البيت.", status: correct}
      - {value: "سنبقى في البيت إذا أمطرت", status: correct}
      - {value: "إذا أمطرت سنبقى في البيت", status: acceptable_with_note, note: "Formal Arabic puts فـ before a result starting with سـ: فسنبقى."}
      - {value: "إذا أمطرت، سنبقى في البيت.", status: acceptable_with_note, note: "Formal Arabic puts فـ before a result starting with سـ: فسنبقى."}
    feedback: "*إذا أمطرت، فسنبقى في البيت.* is the requested sentence."
  ar.b1.unit41.lesson02.exercise01.recognize_lam_tumtir:
    instruction: "Select the meaning."
    correct_option: "If it does not rain"
    distractors: ["If it did not rain yesterday", "It never rains", "Although it does not rain"]
    accepted_answers: [{value: "If it does not rain", status: correct}]
    feedback: "*إذا لم تمطر* negates the condition to express \"if not.\""
  ar.b1.unit41.lesson02.exercise02.recognize_sanadhab_alhadiqa:
    instruction: "Select the meaning."
    correct_option: "We will go to the park"
    distractors: ["We went to the park", "We will not go to the park", "We will go to a café"]
    accepted_answers: [{value: "We will go to the park", status: correct}]
    feedback: "*سنذهب إلى الحديقة* is the future-marked result."
  ar.b1.unit41.lesson02.exercise03.listen_select_negated_condition:
    instruction: "Listen and select what Layla says."
    correct_option: "If it does not rain, we will go to the park."
    distractors: ["If it rains, we will go to the park.", "We did not go to the park.", "We will go to the park this weekend."]
    accepted_answers: [{value: "If it does not rain, we will go to the park.", status: correct}]
    feedback: "You heard *إذا لم تمطر، فسنذهب إلى الحديقة*."
  ar.b1.unit41.lesson02.exercise04.match_negated_condition:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"لم تمطر": "it does not rain", سنذهب: "we will go", الحديقة: "the park", "إذا لم تمطر": "If it does not rain", "سنذهب إلى الحديقة": "we will go to the park", "إلى الحديقة": "to the park"}
        status: correct
    feedback: "These phrases cover the negated condition and its result."
