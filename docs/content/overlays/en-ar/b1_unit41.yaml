review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar/b1_unit41_shurut.yaml. Review 2026-10-19: 7 fixes - false grammar: lam_tumtir note and the write_negated_condition / write_full_condition_and_negation instructions called the verb after لم a subjunctive (it is jussive); reply_weekend_plans and write_full_condition_and_negation did not name the results or the we-form (any other plan graded wrong) - pinned; added the valid result-first order to order_real_condition, order_negated_condition and the two single-sentence writing tasks, the front-adverbial order to order_plans_question, and jawab-fa (فسنبقى / فسنذهب) and و-joined variants to the writing and reply tasks. NATIVE FLAGS: whether the taught model lines should carry the jawab ف (see realization notes). Review 2026-10-19 (consistency): jawab fa made canonical (فسنبقى / فسنذهب) in feedback, word_order answers (tiles now فسنبقى / فسنذهب; the result-first order answers [سنبقى في البيت إذا أمطرت] / [سنذهب إلى الحديقة إذا لم تمطر] were dropped because they cannot be built from the new tiles - the typed tasks still accept the result-first order), writing and reply answers (ف-less forms kept as acceptable_with_note), choose_condition_for_rain option/distractor/answer, match_dialogue_shurut keys and the write instructions; the laila_idha_amtarat / laila_idha_lam_tumtir notes now state the فـ rule (لـ, never فـ, after لو)."}
course: {title: Arabic B1, description: "Intermediate Modern Standard Arabic (fusha): compound modal-plus-embedded-clause constructions for abilities, obligations, conditions, debate, workplace communication, sequenced narrative, real conditions, time clauses, reported speech, and purpose."}
