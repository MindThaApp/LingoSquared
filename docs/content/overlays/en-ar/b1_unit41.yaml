    feedback: "*إذا لم تمطر، فسنذهب إلى الحديقة.* is the requested sentence."
  ar.b1.unit41.lesson03.exercise01.choose_condition_for_rain:
    instruction: "Which answer states what Layla will do IF IT RAINS?"
    correct_option: "إذا أمطرت، فسنبقى في البيت"
    distractors: ["إذا لم تمطر، فسنذهب إلى الحديقة", "سنبقى في البيت طوال الأسبوع", "ذهبنا إلى الحديقة أمس"]
    accepted_answers: [{value: "إذا أمطرت، فسنبقى في البيت", status: correct}]
