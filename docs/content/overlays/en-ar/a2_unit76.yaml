review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings. Masculine and feminine you (fadlika/fadliki, samahta/samahti, yumkinuka/yumkinuki) differ only by a vowel, so feminine variants are accepted. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit76.law_samaht: {"title": "Excuse me, could you", "description": "Make a polite request, offer help, and accept or decline an offer or request politely, with min fadlika, hal yumkinuka an and law samaht."}
lessons:
  ar.a2.unit76.law_samaht.lesson01.min_fadlika: {"title": "Please"}
  ar.a2.unit76.law_samaht.lesson02.hal_yumkinuka: {"title": "Could you?"}
  ar.a2.unit76.law_samaht.lesson03.law_samaht: {"title": "Excuse me"}
  ar.a2.unit76.law_samaht.lesson04.offers: {"title": "Offers"}
  ar.a2.unit76.law_samaht.lesson05.reading_restaurant: {"title": "At the restaurant"}
  ar.a2.unit76.law_samaht.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit76.law_samaht.lesson01.teach.things: {"title": "Things to ask for", "gloss": "the water / the tea / the coffee / the bread", "example_gloss": ["Please give me the water.", "Please bring me the tea."]}
  ar.a2.unit76.law_samaht.lesson01.teach.req: {"title": "Asking for things", "gloss": "please / give me / bring me", "example_gloss": ["Please give me the bread.", "Please bring me the coffee."]}
  ar.a2.unit76.law_samaht.lesson01.teach.gn_fadlika: {"title": "مِنْ فَضْلِكَ", "gloss": "Give me the water. Please give me the water.", "note": "A bare command can sound rude. Add *مِنْ فَضْلِكَ* (please) in front to make a polite request."}
  ar.a2.unit76.law_samaht.lesson01.teach.gn_fem: {"title": "To a man, to a woman", "gloss": "Please bring me the tea (to a man). Please bring me the tea (to a woman).", "note": "Speaking to a woman: *فَضْلِكِ* ends in *-i*, and the command ends in *-ī* (*أَحْضِرِي*)."}
  ar.a2.unit76.law_samaht.lesson02.teach.words: {"title": "Around the house", "gloss": "the door / the window / you close / you open / you help me", "example_gloss": ["Can you close the door?", "Can you open the window?", "Can you help me?"]}
  ar.a2.unit76.law_samaht.lesson02.teach.gn_hal: {"title": "هَلْ يُمْكِنُكَ أَنْ", "gloss": "Can you close the door?", "note": "*هَلْ يُمْكِنُكَ أَنْ ...؟* is a polite way to ask someone to do something. It is softer than a command. The verb ends in *-a*."}
  ar.a2.unit76.law_samaht.lesson02.teach.gn_fem: {"title": "To a woman", "gloss": "Can you (fem.) open the window?", "note": "To a woman say *يُمْكِنُكِ* and end the verb in *-ī*: *تَفْتَحِي*. Without vowel marks only the verb ending differs."}
  ar.a2.unit76.law_samaht.lesson03.teach.words: {"title": "Words for getting attention", "gloss": "excuse me, if you please / I want / the bill / close!", "example_gloss": ["Excuse me, I want the bill.", "Close the door."]}
  ar.a2.unit76.law_samaht.lesson03.teach.gn_law: {"title": "لَوْ سَمَحْتَ", "gloss": "Excuse me, I want the bill. Excuse me (to a woman), I want the bill.", "note": "*لَوْ سَمَحْتَ* gets someone's attention politely, like excuse me or if you please. To a woman it is *لَوْ سَمَحْتِ*; in unvocalised text the two look the same."}
  ar.a2.unit76.law_samaht.lesson03.teach.gn_combo: {"title": "Putting it together", "gloss": "Excuse me, can you close the door?", "note": "You can open with *لَوْ سَمَحْتَ* and then ask with *هَلْ يُمْكِنُكَ أَنْ*."}
  ar.a2.unit76.law_samaht.lesson03.teach.gn_level: {"title": "Three levels of politeness", "gloss": "Close the door. Please close the door. Excuse me, can you close the door?", "note": "From a bare command, to a command with please, to a full polite question. Use the last form with strangers."}
  ar.a2.unit76.law_samaht.lesson04.teach.words: {"title": "Offering help", "gloss": "you want / I help you / I carry / the bag", "example_gloss": ["Do you want me to help you?", "Do you want me to carry the bag?"]}
  ar.a2.unit76.law_samaht.lesson04.teach.answers: {"title": "Accepting and declining", "gloss": "thanks / fine, well / with pleasure / here you are", "example_gloss": ["No thanks, I am fine.", "Can you help me? With pleasure."]}
  ar.a2.unit76.law_samaht.lesson04.teach.gn_offer: {"title": "Offering: هَلْ تُرِيدُ أَنْ", "gloss": "Do you want me to help you?", "note": "To offer help, ask *هَلْ تُرِيدُ أَنْ ...؟* with the verb in the first person. It means do you want me to..."}
  ar.a2.unit76.law_samaht.lesson04.teach.gn_accept: {"title": "Accepting", "gloss": "Do you want me to help you? Yes, thanks.", "note": "Accept with *نَعَمْ، شُكْرًا*."}
  ar.a2.unit76.law_samaht.lesson04.teach.gn_decline: {"title": "Declining", "gloss": "No thanks, I am fine.", "note": "Decline with *لَا شُكْرًا*, then give a reason such as *أَنَا بِخَيْر*."}
  ar.a2.unit76.law_samaht.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "the restaurant / the waiter / I said / he said / you bring", "example_gloss": ["I am at the restaurant.", "I said thank you to the waiter."]}
  ar.a2.unit76.law_samaht.lesson05.teach.reading: {"title": "Yusuf at the restaurant", "gloss": "I am at the restaurant. I said to the waiter: Excuse me, can you bring the water? He said: With pleasure! Then he said: Do you want the bread? I said: No thanks, I am fine.", "note": "A polite request, an answer and a polite refusal."}
  ar.a2.unit76.law_samaht.lesson06.teach.d1: {"title": "Layla asks for help", "gloss": "Layla: Yusuf, excuse me, can you help me?"}
  ar.a2.unit76.law_samaht.lesson06.teach.d2: {"title": "Yusuf offers", "gloss": "Yusuf: With pleasure! Do you want me to open the window?"}
  ar.a2.unit76.law_samaht.lesson06.teach.d3: {"title": "Layla declines and asks", "gloss": "Layla: No thanks. Please bring me the bread."}
  ar.a2.unit76.law_samaht.lesson06.teach.d4: {"title": "Yusuf hands it over", "gloss": "Yusuf: Here you are."}
  ar.a2.unit76.law_samaht.lesson06.teach.d5: {"title": "Layla thanks him", "gloss": "Layla: Thank you, Yusuf."}
  ar.a2.unit76.law_samaht.lesson06.teach.d6: {"title": "Yusuf answers", "gloss": "Yusuf: You're welcome."}
