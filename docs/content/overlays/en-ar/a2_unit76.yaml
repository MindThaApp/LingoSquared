  ar.a2.unit76.law_samaht.lesson01.exercise02.bring_tea: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "مِنْ فَضْلِكَ، أَحْضِرْ لِي الشَّاي.", "distractors": ["مِنْ فَضْلِكَ، أَحْضِرْ لِي الْقَهْوَة.", "مِنْ فَضْلِكَ، أَحْضِرْ لِي الْمَاء.", "مِنْ فَضْلِكَ، أَعْطِنِي الْخُبْز."], "accepted_answers": [{"value": "مِنْ فَضْلِكَ، أَحْضِرْ لِي الشَّاي.", "status": "correct"}], "feedback": "*أَحْضِرْ لِي* = bring me."}
