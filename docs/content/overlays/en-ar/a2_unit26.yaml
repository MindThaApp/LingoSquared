  ar.a2.unit26.lesson01.teach.opinion: {title: "Opinion", gloss: "opinion", note: "*رأي* means opinion; *ما رأيك؟* asks for someone's opinion.", example_gloss: "What is your opinion?"}
  ar.a2.unit26.lesson01.teach.i_think: {title: "I think that", gloss: "I think that", note: "*أعتقد أن* introduces your opinion.", example_gloss: "I think the lesson is useful."}
