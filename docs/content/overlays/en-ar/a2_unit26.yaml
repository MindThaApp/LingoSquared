  ar.a2.unit26.lesson02.teach.easier: {title: "Easier for me", gloss: "easier for me", note: "*أسهل لي* gives a personal reason.", example_gloss: "The morning is easier for me."}
  ar.a2.unit26.lesson02.teach.line01: {title: "Noor asks", gloss: "Noor asks Yusuf for his opinion about the morning lesson.", note: "نور is Yusuf's sister from the earlier family unit.", example_gloss: "What is your opinion of the morning lesson?"}
  ar.a2.unit26.lesson02.teach.line02: {title: "Yusuf's opinion", gloss: "Yusuf thinks the morning lesson is better because it is quiet.", note: "Opinion plus reason with *لأنه*.", example_gloss: "I think the morning lesson is better because it is quiet."}
  ar.a2.unit26.lesson02.teach.line03: {title: "Noor disagrees", gloss: "Noor disagrees and says the evening lesson is better because it suits her work.", note: "This gives a contrasting opinion and reason.", example_gloss: "I disagree with you. I see that the evening lesson is better because it suits my work."}
  ar.a2.unit26.lesson02.teach.line04: {title: "Yusuf responds", gloss: "Yusuf understands her opinion but says morning is easier for him.", note: "*لكن* marks the contrast.", example_gloss: "I understand your opinion, but the morning is easier for me."}
exercises:
  ar.a2.unit26.lesson01.exercise01.recognize_opinion:
    instruction: "Select the meaning."
    correct_option: opinion
    distractors: [appointment, passport, phone]
    accepted_answers: [{value: opinion, status: correct}]
    feedback: "*رأي* means opinion."
  ar.a2.unit26.lesson01.exercise02.listen_reason:
    instruction: "Listen and select what you hear."
    correct_option: "because the lesson is useful"
    distractors: ["because the passport is ready", "because the appointment is Tuesday", "because the phone is new"]
    accepted_answers: [{value: "because the lesson is useful", status: correct}]
    feedback: "You heard *لأن الدرس مفيد*."
  ar.a2.unit26.lesson01.exercise03.match_opinion_words:
    instruction: "Match each Arabic opinion word with its meaning."
    accepted_answers:
      - value: {رأي: opinion, أعتقد: "I think", لأن: because, الدرس: "the lesson", مفيد: useful, سهل: easy, هادئ: quiet}
        status: correct
    feedback: "These words build an opinion with a reason."
  ar.a2.unit26.lesson01.exercise04.order_opinion_reason:
    instruction: "Arrange the Arabic words for I think the lesson is useful because it is easy."
    accepted_answers: [{value: [أعتقد, أن, الدرس, مفيد, لأنه, سهل], status: correct}]
    feedback: "*أعتقد أن الدرس مفيد لأنه سهل* gives an opinion and a reason."
  ar.a2.unit26.lesson01.exercise05.write_opinion_reason:
    instruction: "Type exactly this Arabic opinion-plus-reason sentence: I think the lesson is useful because it is easy."
    accepted_answers:
      - {value: "أعتقد أن الدرس مفيد لأنه سهل", status: correct}
      - {value: "أعتقد أن الدرس مفيد لأنه سهل.", status: correct}
    feedback: "*أعتقد أن الدرس مفيد لأنه سهل* is the requested opinion-plus-reason sentence."
  ar.a2.unit26.lesson02.exercise01.recognize_better:
    instruction: "Select the meaning."
    correct_option: better
    distractors: [quiet, useful, easy]
    accepted_answers: [{value: better, status: correct}]
    feedback: "*أفضل* means better."
  ar.a2.unit26.lesson02.exercise02.dialogue_opinion_reason:
    instruction: "What is Yusuf's opinion and reason?"
    correct_option: "The morning lesson is better because it is quiet."
    distractors: ["The evening lesson is better because it suits work.", "The form is needed because the office is open.", "The phone number is better because it is short."]
    accepted_answers: [{value: "The morning lesson is better because it is quiet.", status: correct}]
    feedback: "Yusuf says *الدرس الصباحي أفضل لأنه هادئ*."
  ar.a2.unit26.lesson02.exercise03.match_opinion_lines:
    instruction: "Match each Arabic opinion line with its meaning."
    accepted_answers:
      - value: {"ما رأيك؟": "What is your opinion?", "الدرس الصباحي": "the morning lesson", "لأنه هادئ": "because it is quiet", "لا أوافقك الرأي": "I disagree with you", "الدرس المسائي": "the evening lesson", "يناسب عملي": "suits my work", "أفهم رأيك، لكن": "I understand your opinion, but", "أسهل لي": "easier for me"}
        status: correct
    feedback: "These lines ask, state, support, and respond to opinions."
  ar.a2.unit26.lesson02.exercise04.order_disagree_reason:
    instruction: "Arrange the Arabic words for I see that the evening lesson is better because it suits my work."
    accepted_answers: [{value: [أرى, أن, الدرس, المسائي, أفضل, لأنه, يناسب, عملي], status: correct}]
    feedback: "*أرى أن الدرس المسائي أفضل لأنه يناسب عملي* gives a contrasting opinion and reason."
  ar.a2.unit26.lesson02.exercise05.write_full_opinion_response:
    instruction: "Type exactly these two Arabic sentences: first state the opinion that the morning lesson is better because it is quiet; then respond to a contrasting opinion by saying you disagree and that the evening lesson is better because it suits your work."
    accepted_answers:
      - {value: "أعتقد أن الدرس الصباحي أفضل لأنه هادئ. لا أوافقك الرأي. أرى أن الدرس المسائي أفضل لأنه يناسب عملي.", status: correct}
      - {value: "أعتقد أن الدرس الصباحي أفضل لأنه هادئ، لا أوافقك الرأي. أرى أن الدرس المسائي أفضل لأنه يناسب عملي.", status: correct}
      - {value: "أعتقد أن الدرس الصباحي أفضل لأنه هادئ ولا أوافقك الرأي. أرى أن الدرس المسائي أفضل لأنه يناسب عملي.", status: correct}
    feedback: "*أعتقد أن الدرس الصباحي أفضل لأنه هادئ. لا أوافقك الرأي. أرى أن الدرس المسائي أفضل لأنه يناسب عملي.* states an opinion, gives a reason, and responds to a contrasting opinion."
