teaching:
  ar.a1.unit21.lesson01.teach.clothes: {title: "Clothes", gloss: "clothes", note: "ملابس (malābis) is a plural noun meaning clothes.", example_gloss: "I want clothes."}
  ar.a1.unit21.lesson01.teach.shirt: {title: "Shirt", gloss: "shirt", note: "قميص (qamīṣ) means shirt; after أريد it takes the object ending -an: قميصا (qamīṣan).", example_gloss: "I want a shirt."}
  ar.a1.unit21.lesson01.teach.blue: {title: "Blue", gloss: "blue", note: "أزرق (azraq) is the masculine form, matching قميص; with a feminine noun it becomes زرقاء (zarqāʾ). After أريد, أزرق takes no extra alif: قميصا أزرق.", example_gloss: "I want a blue shirt."}
  ar.a1.unit21.lesson01.teach.blue_shirt: {title: "A blue shirt", gloss: "a blue shirt", note: "In Arabic the color comes after the item: قميصا أزرق (qamīṣan azraq).", example_gloss: "I want a blue shirt."}
  ar.a1.unit21.lesson02.teach.size: {title: "Size", gloss: "the size", note: "مقاس (maqās) means size; ما المقاس؟ (mā l-maqās) asks for the size.", example_gloss: "What size?"}
  ar.a1.unit21.lesson02.teach.medium: {title: "Medium size", gloss: "medium size", note: "متوسط (mutawassiṭ) means medium; after أريد both words take the object ending: مقاسا متوسطا (maqāsan mutawassiṭan).", example_gloss: "I want a medium size."}
  ar.a1.unit21.lesson02.teach.price: {title: "Ten dirhams", gloss: "ten dirhams", note: "بعشرة (bi-ʿashara) means for ten: the بـ prefix marks the price, as in the shopping unit.", example_gloss: "The shirt is ten dirhams."}
  ar.a1.unit21.lesson02.teach.line01: {title: "Request item", gloss: "Layla asks for a blue shirt.", note: "من فضلك keeps the request polite.", example_gloss: "Layla said: I want a blue shirt, please."}
  ar.a1.unit21.lesson02.teach.line02: {title: "Ask size", gloss: "The seller asks what size.", note: "The seller asks for the size: ما المقاس؟", example_gloss: "The seller said: What size?"}
  ar.a1.unit21.lesson02.teach.line03: {title: "Give size", gloss: "Layla says medium size.", note: "This answers the size question directly.", example_gloss: "Layla said: Medium size."}
  ar.a1.unit21.lesson02.teach.line04: {title: "Give item and price", gloss: "The seller gives the shirt and the price.", note: "تفضلي (tafaḍḍalī) is said to a woman when handing something over; to a man: تفضل (tafaḍḍal).", example_gloss: "The seller said: Here you are. The shirt is ten dirhams."}
exercises:
  ar.a1.unit21.lesson01.exercise01.recognize_shirt:
    instruction: "Select the meaning."
    correct_option: shirt
    distractors: [clothes, size, table]
    accepted_answers: [{value: shirt, status: correct}]
    feedback: "قميص means shirt."
  ar.a1.unit21.lesson01.exercise02.listen_blue_shirt:
    instruction: "Listen and select what you hear."
    correct_option: "I want a blue shirt."
    distractors: ["I want medium size.", "The shirt is ten dirhams.", "I want a blue table."]
    accepted_answers: [{value: "I want a blue shirt.", status: correct}]
    feedback: "You heard أريد قميصا أزرق."
  ar.a1.unit21.lesson01.exercise03.match_clothing_words:
    instruction: "Match each Arabic clothing word with its meaning."
    accepted_answers:
      - value: {ملابس: clothes, قميص: shirt, أزرق: blue}
        status: correct
    feedback: "These words describe an item and color."
  ar.a1.unit21.lesson01.exercise04.order_blue_shirt:
    instruction: "Arrange the Arabic words for I want a blue shirt."
    accepted_answers: [{value: [أريد, قميصا, أزرق], status: correct}]
    feedback: "أريد قميصا أزرق requests the item and color."
  ar.a1.unit21.lesson01.exercise05.write_blue_shirt:
    instruction: "Type exactly this Arabic clothing request: I want a blue shirt."
    accepted_answers:
      - {value: "أريد قميصا أزرق", status: correct}
      - {value: "أريد قميصا أزرق.", status: correct}
    feedback: "أريد قميصا أزرق is the requested clothing sentence."
  ar.a1.unit21.lesson01.exercise06.dictation_blue_shirt: {correct_response: "أريد قميصا أزرق.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit21.lesson02.exercise01.recognize_size:
    instruction: "Select the meaning."
    correct_option: size
    distractors: [shirt, price, platform]
    accepted_answers: [{value: size, status: correct}]
    feedback: "المقاس means the size."
  ar.a1.unit21.lesson02.exercise02.dialogue_clothing:
    instruction: "What size does Layla ask for?"
    correct_option: "Medium size."
    distractors: ["Small size.", "Large size.", "Extra large size."]
    accepted_answers: [{value: "Medium size.", status: correct}]
    feedback: "Layla says مقاس متوسط."
  ar.a1.unit21.lesson02.exercise03.match_clothing_details:
    instruction: "Match each Arabic clothing detail with its meaning."
    accepted_answers:
      - value: {"قميصا أزرق": "a blue shirt", "مقاس متوسط": "medium size", "عشرة دراهم": "ten dirhams"}
        status: correct
    feedback: "The details cover item, size, and price."
  ar.a1.unit21.lesson02.exercise04.order_medium_size:
    instruction: "Arrange the Arabic words for medium size."
    accepted_answers: [{value: [مقاس, متوسط], status: correct}]
    feedback: "مقاس متوسط gives the requested size."
  ar.a1.unit21.lesson02.exercise05.write_clothing_request:
    instruction: "Type exactly this Arabic clothing request: I want a blue shirt, medium size."
    accepted_answers:
      - {value: "أريد قميصا أزرق، مقاس متوسط.", status: correct}
