exercises:
  ar.a1.unit21.lesson01.exercise01.recognize_shirt:
    instruction: "Select the meaning."
    correct_option: shirt
    distractors: [clothes, size, table]
    accepted_answers: [{value: shirt, status: correct}]
    feedback: "قميص means shirt."
  ar.a1.unit21.lesson01.exercise02.listen_blue_shirt:
    instruction: "Listen and select what you hear."
    correct_option: "I want a blue shirt."
    distractors: ["I want medium size.", "The shirt is ten dirhams.", "I want a blue table."]
    accepted_answers: [{value: "I want a blue shirt.", status: correct}]
    feedback: "You heard أريد قميصا أزرق."
  ar.a1.unit21.lesson01.exercise03.match_clothing_words:
    instruction: "Match each Arabic clothing word with its meaning."
    accepted_answers:
      - value: {ملابس: clothes, قميص: shirt, أزرق: blue}
        status: correct
    feedback: "These words describe an item and color."
  ar.a1.unit21.lesson01.exercise04.order_blue_shirt:
    instruction: "Arrange the Arabic words for I want a blue shirt."
    accepted_answers: [{value: [أريد, قميصا, أزرق], status: correct}]
    feedback: "أريد قميصا أزرق requests the item and color."
  ar.a1.unit21.lesson01.exercise05.write_blue_shirt:
    instruction: "Type exactly this Arabic clothing request: I want a blue shirt."
    accepted_answers:
      - {value: "أريد قميصا أزرق", status: correct}
      - {value: "أريد قميصا أزرق.", status: correct}
    feedback: "أريد قميصا أزرق is the requested clothing sentence."
  ar.a1.unit21.lesson02.exercise01.recognize_size:
    instruction: "Select the meaning."
    correct_option: size
    distractors: [shirt, price, platform]
    accepted_answers: [{value: size, status: correct}]
    feedback: "المقاس means the size."
  ar.a1.unit21.lesson02.exercise02.dialogue_clothing:
    instruction: "What size does Layla ask for?"
    correct_option: "Medium size."
    distractors: ["Small size.", "Blue size.", "Ten dirhams."]
    accepted_answers: [{value: "Medium size.", status: correct}]
    feedback: "Layla says مقاس متوسط."
  ar.a1.unit21.lesson02.exercise03.match_clothing_details:
    instruction: "Match each Arabic clothing detail with its meaning."
    accepted_answers:
      - value: {"قميصا أزرق": "a blue shirt", "مقاس متوسط": "medium size", "عشرة دراهم": "ten dirhams"}
        status: correct
    feedback: "The details cover item, size, and price."
  ar.a1.unit21.lesson02.exercise04.order_medium_size:
    instruction: "Arrange the Arabic words for medium size."
    accepted_answers: [{value: [مقاس, متوسط], status: correct}]
    feedback: "مقاس متوسط gives the requested size."
  ar.a1.unit21.lesson02.exercise05.write_clothing_request:
    instruction: "Type exactly this Arabic clothing request: I want a blue shirt, medium size."
    accepted_answers:
      - {value: "أريد قميصا أزرق، مقاس متوسط.", status: correct}
      - {value: "أريد قميصا أزرق مقاس متوسط", status: correct}
      - {value: "أريد قميصا أزرق، مقاس متوسط", status: correct}
    feedback: "أريد قميصا أزرق، مقاس متوسط. requests item, color, and size."
