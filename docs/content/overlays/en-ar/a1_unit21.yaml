      - {value: "أريد قميصا أزرق، مقاس متوسط", status: correct}
      - {value: "أريد قميصا أزرق، مقاسا متوسطا", status: correct}
    feedback: "أريد قميصا أزرق، مقاس متوسط. requests item, color, and size."
