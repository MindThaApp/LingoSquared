  ar.b1.unit40.lesson03.teach.yusuf_ask: {title: "Yusuf asks about her day", gloss: "Yusuf says: What happened today?", note: "This opens the dialogue.", example_gloss: "What happened today?"}
  ar.b1.unit40.lesson03.teach.nour_reported: {title: "Nour reports what her friend said", gloss: "Nour says: She told me she is moving to another city.", note: "This closes the narrative with reported speech.", example_gloss: "She told me she is moving to another city."}
exercises:
  ar.b1.unit40.lesson01.exercise01.recognize_baynama_antazir:
    instruction: "Select the meaning."
    correct_option: "While I was waiting for the bus"
    distractors: ["After I waited for the bus", "Because I waited for the bus", "Before I waited for the bus"]
    accepted_answers: [{value: "While I was waiting for the bus", status: correct}]
    feedback: "*بينما كنت أنتظر الحافلة* marks a background action."
  ar.b1.unit40.lesson01.exercise02.recognize_qabaltu_sadiqati:
    instruction: "Select the meaning."
    correct_option: "I met my old friend"
    distractors: ["I called my old friend", "I am meeting my old friend", "I met my new friend"]
    accepted_answers: [{value: "I met my old friend", status: correct}]
    feedback: "*قابلت صديقتي القديمة* is the main-line event."
  ar.b1.unit40.lesson01.exercise03.listen_select_background_event:
    instruction: "Listen and select what Nour says."
    correct_option: "While I was waiting for the bus, I met my old friend."
    distractors: ["I was waiting for the bus and no one came.", "I met my old friend at a café.", "While I was waiting for the bus, I called my brother."]
    accepted_answers: [{value: "While I was waiting for the bus, I met my old friend.", status: correct}]
    feedback: "You heard *بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة*."
  ar.b1.unit40.lesson01.exercise04.match_background_event:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {بينما: while, "كنت أنتظر": "I was waiting", الحافلة: "the bus", قابلت: "I met", صديقتي: "my friend", القديمة: old}
        status: correct
    feedback: "These phrases cover the background action and the main-line event."
  ar.b1.unit40.lesson01.exercise05.order_background_event:
    instruction: "Arrange the Arabic words for While I was waiting for the bus, I met my old friend."
    accepted_answers: [{value: [بينما, كنت, أنتظر, الحافلة, قابلت, صديقتي, القديمة], status: correct}]
    feedback: "*بينما كنت أنتظر الحافلة قابلت صديقتي القديمة* marks the background action against the main-line event."
  ar.b1.unit40.lesson01.exercise06.write_background_event:
    instruction: "As Nour, write exactly this sentence marking a background action against a main-line event with بينما: While I was waiting for the bus, I met my old friend."
    accepted_answers:
      - {value: "بينما كنت أنتظر الحافلة قابلت صديقتي القديمة", status: correct}
      - {value: "بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة.", status: correct}
    feedback: "*بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة.* is the requested sentence."
  ar.b1.unit40.lesson02.exercise01.recognize_thumma_dhahabna:
    instruction: "Select the meaning."
    correct_option: "Then we went to a café"
    distractors: ["Before we went to a café", "We never went to a café", "We are going to a café"]
    accepted_answers: [{value: "Then we went to a café", status: correct}]
    feedback: "*ثم ذهبنا إلى مقهى* is the next event in the sequence."
  ar.b1.unit40.lesson02.exercise02.recognize_tahadathna_kathiran:
    instruction: "Select the meaning."
    correct_option: "We talked a lot there"
    distractors: ["We did not talk there", "We will talk a lot there", "We talked a little there"]
    accepted_answers: [{value: "We talked a lot there", status: correct}]
    feedback: "*تحدثنا كثيرا هناك* continues the main-line event."
  ar.b1.unit40.lesson02.exercise03.listen_select_main_event:
    instruction: "Listen and select what Nour says."
    correct_option: "Then we went to a café. We talked a lot there."
    distractors: ["Then we went home. We did not talk.", "We went to a café yesterday.", "Then we waited for the bus."]
    accepted_answers: [{value: "Then we went to a café. We talked a lot there.", status: correct}]
    feedback: "You heard *ثم ذهبنا إلى مقهى. تحدثنا كثيرا هناك.*"
  ar.b1.unit40.lesson02.exercise04.match_main_event:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {ثم: then, ذهبنا: "we went", مقهى: "a café", تحدثنا: "we talked", كثيرا: "a lot", هناك: there}
        status: correct
    feedback: "These phrases cover the main-line sequence of events."
  ar.b1.unit40.lesson02.exercise05.order_main_event:
    instruction: "Arrange the Arabic words for Then we went to a café."
    accepted_answers: [{value: [ثم, ذهبنا, إلى, مقهى], status: correct}]
    feedback: "*ثم ذهبنا إلى مقهى* continues the sequence with ثم."
  ar.b1.unit40.lesson02.exercise06.write_main_event:
    instruction: "As Nour, write exactly this two-sentence main-line event with the sequencing connector ثم: Then we went to a café. We talked a lot there."
    accepted_answers:
      - {value: "ثم ذهبنا إلى مقهى تحدثنا كثيرا هناك", status: correct}
      - {value: "ثم ذهبنا إلى مقهى. تحدثنا كثيرا هناك.", status: correct}
    feedback: "*ثم ذهبنا إلى مقهى. تحدثنا كثيرا هناك.* is the requested sentence."
  ar.b1.unit40.lesson03.exercise01.choose_reported_speech:
    instruction: "Which answer reports what the friend said, using reported-speech subordination?"
    correct_option: "قالت لي إنها ستنتقل إلى مدينة أخرى"
    distractors: ["ستنتقل إلى مدينة أخرى", "أنا سأنتقل إلى مدينة أخرى", "هل ستنتقل إلى مدينة أخرى؟"]
    accepted_answers: [{value: "قالت لي إنها ستنتقل إلى مدينة أخرى", status: correct}]
    feedback: "*قالت لي إنها ستنتقل إلى مدينة أخرى* reports the friend's words with قالت لي إن."
  ar.b1.unit40.lesson03.exercise02.dialogue_comprehension_narrative:
    instruction: "Listen to the dialogue and answer."
    correct_option: "While waiting for the bus, Nour met an old friend; they went for coffee, and the friend said she is moving to another city."
    distractors: ["Nour missed the bus and went home.", "Nour's friend is moving in with her.", "Nour did not meet anyone today."]
    accepted_answers: [{value: "While waiting for the bus, Nour met an old friend; they went for coffee, and the friend said she is moving to another city.", status: correct}]
    feedback: "Nour marks the background action with بينما, continues the sequence with ثم, and reports her friend's words with قالت لي إن."
  ar.b1.unit40.lesson03.exercise03.match_dialogue_narrative:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"ماذا حدث اليوم؟": "What happened today?", "بينما كنت أنتظر الحافلة": "While I was waiting for the bus", "قابلت صديقتي القديمة": "I met my old friend", "ثم ذهبنا إلى مقهى": "Then we went to a café", "قالت لي إنها ستنتقل": "She told me she is moving", "مدينة أخرى": "another city"}
        status: correct
    feedback: "These lines cover the full sequenced narrative with reported speech."
  ar.b1.unit40.lesson03.exercise04.order_reported_speech:
    instruction: "Arrange the Arabic words for She told me she is moving to another city."
    accepted_answers: [{value: [قالت, لي, إنها, ستنتقل, إلى, مدينة, أخرى], status: correct}]
    feedback: "*قالت لي إنها ستنتقل إلى مدينة أخرى* reports the friend's words."
  ar.b1.unit40.lesson03.exercise05.reply_recount_day:
    instruction: "Yusuf asks: What happened today? Reply as Nour, marking the background action against the main-line event."
    accepted_answers:
      - {value: "بينما كنت أنتظر الحافلة قابلت صديقتي القديمة", status: correct}
      - {value: "بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة.", status: correct}
    feedback: "*بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة.* is Nour's reply."
  ar.b1.unit40.lesson03.exercise06.write_full_sequenced_narrative:
    instruction: "As Nour, write a short narrative recounting your afternoon to Yusuf: mark the background action against the main-line event with بينما (while you were waiting for the bus, you met your old friend), continue the sequence with ثم (then you went to a café and talked a lot there), and report what your friend said with قالت لي إن (she told me she is moving to another city)."
    accepted_answers:
      - {value: "بينما كنت أنتظر الحافلة قابلت صديقتي القديمة ثم ذهبنا إلى مقهى تحدثنا كثيرا هناك قالت لي إنها ستنتقل إلى مدينة أخرى", status: correct}
      - {value: "بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة. ثم ذهبنا إلى مقهى. تحدثنا كثيرا هناك. قالت لي إنها ستنتقل إلى مدينة أخرى.", status: correct}
    feedback: "*بينما كنت أنتظر الحافلة، قابلت صديقتي القديمة. ثم ذهبنا إلى مقهى. تحدثنا كثيرا هناك. قالت لي إنها ستنتقل إلى مدينة أخرى.* marks the background action, continues the sequence with ثم, and reports the friend's words with قالت لي إن, as required."
