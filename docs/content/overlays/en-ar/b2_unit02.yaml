review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for ar's second B2 unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English "must" covers both epistemic certainty (لا بد
    أن) and obligation -- only the epistemic-deduction sense is taught
    here, flagged in lesson02's note; (2) English "must have + past
    participle" maps to لا بد أن + a PLAIN PAST-TENSE verb in Arabic
    (لا بد أنه نسي, not a periphrastic perfect) -- flagged in lesson03;
    (3) أستنتج أن (deduction from stated evidence, always paired with a
    لأن reason) and أخمّن أن (pure guesswork, no evidence given) both
    gloss loosely as "I think/guess" in English but are NOT
    interchangeable -- kept distinct in lesson04. No sibling-direction
    file (ar-en b2) was consulted.
    Review 2026-10-19: 8 fixes - the name after أن was left nominative
    (أن كريم مشغول) although the subject of أنّ is accusative and the
    course writes accusative tanwin with alif (مشغولا), so every أن كريم
    became أن كريما (models, tested_text, word banks, audio text,
    overlay answers/feedback; the old forms are kept as accepted
    answers) and the lesson02 note that called this a plain nominal
    sentence was corrected; الاتصال matching gloss 'the call' now
    'calling / the call' to fit حاول الاتصال; write_simple 'I guess it's
    simple' was underdetermined (أنه بسيط) and now asks for 'the matter
    is simple'; added ربما هو مشغول, ربما هو في اجتماع طوال اليوم, VSO
    لم يصل الزميل بعد, and feminine متأكدة variants of the guess
    sentence. NATIVE FLAGS: confirm كريما after أن reads right to a
    native editor (the uninflected form stays accepted); whether فاتته
    الحافلة is the preferred idiom; the reading/dialogue line لا بد أنه
    حاول الاتصال، لكن هاتفه مغلق is slightly odd logically (he tried to
    call, yet his phone is off).

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: speculate about causes
    and consequences with graded certainty -- say what may, might,
    must, or cannot be the case, for both present and past situations
    (قد، ربما، لا بد أن، من المستحيل أن), and distinguish a reasoned
    deduction (أستنتج أن...لأن) from a plain guess (أخمّن أن), around
    the everyday scenario of a colleague who hasn't arrived at the
    office.

units:
  ar.b2.unit02.altakhmin: {title: "Speculation"}

lessons:
  ar.b2.unit02.lesson01.altakhmin_alasasi: {title: "Basic speculation"}
  ar.b2.unit02.lesson02.alyaqin_alqawi: {title: "Strong certainty"}
  ar.b2.unit02.lesson03.altakhmin_hawl_almadi: {title: "Speculating about the past"}
  ar.b2.unit02.lesson04.alistintaj_waltakhmin: {title: "Deduction versus guesswork"}
  ar.b2.unit02.lesson05.qiraat_nass_takhmini: {title: "Reading a speculative text"}
  ar.b2.unit02.lesson06.hiwar_takhmini_kamil: {title: "A full speculative dialogue"}

teaching:
  ar.b2.unit02.lesson01.teach.alzamil:
    title: "the colleague"
    gloss: "the colleague"
    example_gloss: "The new colleague is nice."
  ar.b2.unit02.lesson01.teach.lam_yasil_bad:
    title: "hasn't arrived yet"
    gloss: "hasn't arrived yet"
    note: "*لم* negates a past event using the jussive mood (*لم يصل* = 'has not arrived'), always paired with *بعد* (yet) here."
  ar.b2.unit02.lesson01.teach.ijtimaa:
    title: "a meeting"
    gloss: "a meeting"
    example_gloss: "We have an important meeting today."
  ar.b2.unit02.lesson01.teach.qad:
    title: "may / might"
    gloss: "may / might (weak possibility)"
    note: "*قد* before a present-tense verb marks a weak possibility -- the softest level of certainty this unit teaches."
    example_gloss: "He might come tomorrow."
  ar.b2.unit02.lesson01.teach.yakoun:
    title: "to be (might be)"
    gloss: "to be / might be"
    note: "*يكون* is the present/subjunctive form of *كان* used after *قد* and *ربما* to speculate about a state."
    example_gloss: "He might be sick."
  ar.b2.unit02.lesson01.teach.claim_model:
    title: "Karim might be in a meeting now."
    gloss: "Karim might be in a meeting now."
    note: "The model weak-possibility speculation for this unit, about a PRESENT situation."
  ar.b2.unit02.lesson01.teach.rubbama:
    title: "perhaps / maybe"
    gloss: "perhaps / maybe"
    note: "*ربما* is interchangeable with *قد* + present verb for a weak, present-tense guess."
    example_gloss: "Maybe he is in the office."
  ar.b2.unit02.lesson01.teach.alt_model:
    title: "Maybe Karim is busy."
    gloss: "Maybe Karim is busy."
    note: "*مشغولا* takes the written accusative alif because it is the predicate of *يكون* (a كان-family verb) -- contrast with plain *مشغول* (lesson02), the predicate of a simple nominal sentence with no كان."
  ar.b2.unit02.lesson01.teach.grammar_takhmin_asasi:
    title: "Karim might be in a meeting now. Maybe he is busy."
    gloss: "Karim might be in a meeting now. Maybe he is busy."
    note: "Basic speculation uses *قد* or *ربما* before a present-tense verb (or *يكون* + accusative predicate) to mark a guess as merely possible, not certain."

  ar.b2.unit02.lesson02.teach.la_budda_an:
    title: "must be..."
    gloss: "must be... / it must be that..."
    note: "*لا بد أن* marks a STRONG, near-certain deduction -- much stronger than *قد*/*ربما*. This is epistemic certainty (a confident guess), not obligation."
  ar.b2.unit02.lesson02.teach.mashghul:
    title: busy
    gloss: "busy (plain nominal predicate, no written accusative alif)"
    example_gloss: "He is busy today."
  ar.b2.unit02.lesson02.teach.jiddan:
    title: very
    gloss: very
    example_gloss: "The meeting is very important."
  ar.b2.unit02.lesson02.teach.deduction_model:
    title: "Karim must be very busy."
    gloss: "Karim must be very busy."
    note: "*لا بد أن كريما مشغول* -- after *أن* (that) the subject of the following sentence takes the accusative case, which is why the name is written *كريما* with the accusative alif; the predicate *مشغول* stays unchanged."
  ar.b2.unit02.lesson02.teach.min_almustaheel:
    title: "it's impossible that..."
    gloss: "it's impossible that..."
    note: "*من المستحيل أن* is the strong NEGATIVE certainty counterpart to *لا بد أن* -- ruling a possibility out entirely."
  ar.b2.unit02.lesson02.teach.tiwal_alyawm:
    title: "all day"
    gloss: "all day / throughout the day"
  ar.b2.unit02.lesson02.teach.impossibility_model:
    title: "It's impossible that he is in a meeting all day."
    gloss: "It's impossible that he is in a meeting all day."
  ar.b2.unit02.lesson02.teach.grammar_yaqin:
    title: "Karim must be very busy. It's impossible that he is in a meeting all day."
    gloss: "Karim must be very busy. It's impossible that he is in a meeting all day."
    note: "*لا بد أن* (must be) and *من المستحيل أن* (impossible that) are the two STRONG certainty poles -- one confidently asserting, one confidently ruling out."

  ar.b2.unit02.lesson03.teach.annahu:
    title: "that he"
    gloss: "that he"
    note: "*أنه* fuses *أن* (that) with the attached pronoun *ه* (he), needed whenever the following clause has no separate noun subject."
  ar.b2.unit02.lesson03.teach.nasiya:
    title: forgot
    gloss: "forgot (past tense)"
    example_gloss: "He forgot his key at home."
  ar.b2.unit02.lesson03.teach.aljtimaa_definite:
    title: "the meeting"
    gloss: "the meeting"
    example_gloss: "The meeting just started."
  ar.b2.unit02.lesson03.teach.past_deduction_model:
    title: "He must have forgotten the meeting."
    gloss: "He must have forgotten the meeting."
    note: "*لا بد أنه نسي* (must + he-forgot, a plain past-tense verb) is how MSA expresses 'must have forgotten' -- there is no separate periphrastic perfect form the way English uses one."
  ar.b2.unit02.lesson03.teach.alhafila:
    title: "the bus"
    gloss: "the bus"
    example_gloss: "The bus is slow today."
  ar.b2.unit02.lesson03.teach.fatathu:
    title: "missed (it passed him)"
    gloss: "missed him / passed him by"
    note: "*فاتته* literally means 'it (feminine subject) passed him by' -- the standard MSA idiom for missing a bus, train, or opportunity."
    example_gloss: "He missed the opportunity."
  ar.b2.unit02.lesson03.teach.hatha_alsabah:
    title: "this morning"
    gloss: "this morning"
  ar.b2.unit02.lesson03.teach.past_guess_model:
    title: "Maybe he missed the bus this morning."
    gloss: "Maybe he missed the bus this morning."
    note: "*ربما* + a plain past-tense verb (*فاتته*) speculates about a PAST cause, at the weak-possibility level."
  ar.b2.unit02.lesson03.teach.grammar_madi:
    title: "He must have forgotten the meeting. Maybe he missed the bus this morning."
    gloss: "He must have forgotten the meeting. Maybe he missed the bus this morning."
    note: "Speculating about the past uses the SAME modals as the present (*لا بد أن*, *ربما*), just followed by a past-tense verb instead of *يكون*/present."

  ar.b2.unit02.lesson04.teach.astantij_anna:
    title: "I deduce that..."
    gloss: "I deduce that..."
    note: "*أستنتج أن* introduces a conclusion drawn from stated evidence -- always paired with a *لأن* (because) reason in this lesson."
  ar.b2.unit02.lesson04.teach.akhammin_anna:
    title: "I guess that..."
    gloss: "I guess that..."
    note: "*أخمّن أن* introduces a PURE guess with no supporting evidence -- weaker and more tentative than *أستنتج أن*, often paired with an admission of uncertainty (*لكنني لست متأكدا*)."
  ar.b2.unit02.lesson04.teach.hatifuhu:
    title: "his phone"
    gloss: "his phone"
    example_gloss: "His phone is new."
  ar.b2.unit02.lesson04.teach.mughlaq:
    title: "off / turned off"
    gloss: "off / turned off / closed"
    example_gloss: "The restaurant is closed today."
  ar.b2.unit02.lesson04.teach.deduction_reason_model:
    title: "I deduce that Karim is busy, because his phone is off."
    gloss: "I deduce that Karim is busy, because his phone is off."
    note: "A deduction names its evidence with *لأن* -- that is what separates *أستنتج أن* from a bare guess."
  ar.b2.unit02.lesson04.teach.lidhalik:
    title: therefore
    gloss: "therefore / as a result"
    example_gloss: "The weather is cold, therefore I wear a coat."
  ar.b2.unit02.lesson04.teach.consequence_model:
    title: "His phone is off, therefore he doesn't answer the call."
    gloss: "His phone is off, therefore he doesn't answer the call."
    note: "*لذلك* signposts a CONSEQUENCE, the mirror image of *لأن* (a cause) -- both connect a cause to an effect, in opposite directions."
  ar.b2.unit02.lesson04.teach.guess_model:
    title: "I guess Karim is asleep, but I'm not sure."
    gloss: "I guess Karim is asleep, but I'm not sure."
    note: "*لست متأكدا* (I am not sure) openly flags the guess as unconfirmed -- exactly the tentativeness that separates *أخمّن أن* from *أستنتج أن*."
  ar.b2.unit02.lesson04.teach.grammar_istintaj:
    title: "I deduce that Karim is busy, because his phone is off. I guess Karim is asleep, but I'm not sure."
    gloss: "I deduce that Karim is busy, because his phone is off. I guess Karim is asleep, but I'm not sure."
    note: "*أستنتج أن...لأن* (deduction, with evidence) versus *أخمّن أن...لكنني لست متأكدا* (guesswork, no evidence) -- the outcome's key distinction between reasoning and guessing."

  ar.b2.unit02.lesson05.teach.nass_takhmini:
    title: "Reading: why hasn't Karim arrived?"
    gloss: "Karim hasn't arrived at the office yet. He might be in a meeting, or maybe he missed the bus this morning. He must have tried to call, but his phone is off. I guess it's simple."
    glosses:
      إلى: to
      المكتب: "the office"
      حاول: tried
      الاتصال: "the call / calling"
      أو: or
      الأمر: "the matter"
      بسيط: simple

  ar.b2.unit02.lesson06.teach.ayna_birayik:
    title: "Where is he, in your opinion?"
    gloss: "Where is he, in your opinion?"
    note: "*برأيك* (in your opinion) invites a debating or speculating partner to venture a guess."
  ar.b2.unit02.lesson06.teach.sayasil_qariban:
    title: "He'll arrive soon."
    gloss: "He'll arrive soon."
  ar.b2.unit02.lesson06.teach.dialogue_yusuf_ask:
    title: "Yusuf: Karim hasn't arrived at the office yet. Where is he, in your opinion?"
    gloss: "Yusuf: Karim hasn't arrived at the office yet. Where is he, in your opinion?"
  ar.b2.unit02.lesson06.teach.dialogue_layla_guess:
    title: "Layla: He might be in a meeting, or maybe he missed the bus this morning."
    gloss: "Layla: He might be in a meeting, or maybe he missed the bus this morning."
  ar.b2.unit02.lesson06.teach.dialogue_yusuf_deduce:
    title: "Yusuf: He must have tried to call, but his phone is off."
    gloss: "Yusuf: He must have tried to call, but his phone is off."
  ar.b2.unit02.lesson06.teach.dialogue_layla_deduce:
    title: "Layla: I deduce that Karim is very busy today."
    gloss: "Layla: I deduce that Karim is very busy today."
  ar.b2.unit02.lesson06.teach.dialogue_yusuf_guess:
    title: "Yusuf: I guess it's simple."
    gloss: "Yusuf: I guess it's simple."
  ar.b2.unit02.lesson06.teach.dialogue_layla_close:
    title: "Layla: Maybe. He'll arrive soon."
    gloss: "Layla: Maybe. He'll arrive soon."
  ar.b2.unit02.lesson06.teach.grammar_takhmin_kamil:
    title: "He might be in a meeting. He must have tried to call. I deduce that Karim is very busy. I guess it's simple."
    gloss: "He might be in a meeting. He must have tried to call. I deduce that Karim is very busy. I guess it's simple."
    note: "A full speculation moves through certainty levels: *قد* (weak, present), *لا بد أن* (strong, past cause), *أستنتج أن* (reasoned deduction), *أخمّن أن* (open guess) -- exactly what the speaking and writing tasks of this lesson require."

exercises:
