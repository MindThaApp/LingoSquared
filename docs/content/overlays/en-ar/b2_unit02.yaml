    feedback: "You heard *قد يكون كريم في اجتماع الآن* -- Karim might be in a meeting now."

  ar.b2.unit02.lesson02.exercise01.recognize_la_budda:
    instruction: "What does this phrase mean?"
    correct_option: "must be..."
    distractors: ["might be...", "it's impossible that...", "in short"]
