    accepted_answers: [{value: "He must have forgotten the meeting.", status: correct}]
    feedback: "*لا بد أنه نسي الاجتماع* means he must have forgotten the meeting."
  ar.b2.unit02.lesson03.exercise03.match_past_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
