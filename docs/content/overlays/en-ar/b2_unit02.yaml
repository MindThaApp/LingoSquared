    feedback: "*لا بد أن كريما مشغول جدا.* means Karim must be very busy."
  ar.b2.unit02.lesson02.exercise08.dictation_deduction:
    instruction: "Type what you hear."
    accepted_answers:
      - {value: "لا بد أن كريما مشغول جدا", status: correct}
      - {value: "لا بد أن كريم مشغول جدا", status: correct}
