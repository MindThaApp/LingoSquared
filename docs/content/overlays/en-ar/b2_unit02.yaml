    feedback: "*الزميل لم يصل بعد.* means the colleague hasn't arrived yet."
  ar.b2.unit02.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "قد يكون كريم في اجتماع الآن"
