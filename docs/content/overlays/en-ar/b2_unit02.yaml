  ar.b2.unit02.lesson01.exercise06.speak_claim:
    instruction: "Say aloud in Arabic: Karim might be in a meeting now."
    accepted_answers:
      - {value: "قد يكون كريم في اجتماع الآن", status: correct}
    feedback: "*قد يكون كريم في اجتماع الآن* means Karim might be in a meeting now."
  ar.b2.unit02.lesson01.exercise07.write_not_arrived:
