    instruction: "What does this word mean?"
    correct_option: "may / might"
    distractors: [therefore, because, "in short"]
    accepted_answers: [{value: "may / might", status: correct}]
    feedback: "*قد* before a present verb marks a weak possibility."
  ar.b2.unit02.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "Karim might be in a meeting now."
    distractors: ["Karim is in a meeting now.", "Karim might be in the office now.", "Karim was in a meeting yesterday."]
    accepted_answers: [{value: "Karim might be in a meeting now.", status: correct}]
    feedback: "*قد يكون كريم في اجتماع الآن* means Karim might be in a meeting now."
  ar.b2.unit02.lesson01.exercise03.match_claim_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {الزميل: "the colleague", "لم يصل بعد": "hasn't arrived yet", اجتماع: "a meeting", قد: "may / might", يكون: "to be (might be)", ربما: "perhaps / maybe", في: "in / at", الآن: now}
        status: correct
    feedback: "These are this lesson's basic speculation words."
  ar.b2.unit02.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: Karim might be in a meeting."
    accepted_answers:
      - {value: "قد يكون كريم في اجتماع", status: correct}
    feedback: "*قد يكون كريم في اجتماع* means Karim might be in a meeting."
  ar.b2.unit02.lesson01.exercise05.translate_alt:
    instruction: "Translate into Arabic: Maybe he is busy."
    accepted_answers:
      - {value: "ربما يكون مشغولا", status: correct}
