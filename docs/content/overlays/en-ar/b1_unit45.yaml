teaching:
  ar.b1.unit45.lesson01.teach.mutaaba: {title: "Tired", gloss: "tired", note: "*متعبة* means tired (feminine).", example_gloss: "I am very tired at work."}
  ar.b1.unit45.lesson01.teach.laila_mutaaba: {title: "Laila says she is tired", gloss: "I am very tired at work these days.", note: "This opens the dialogue.", example_gloss: "Laila said: I am very tired at work these days."}
  ar.b1.unit45.lesson01.teach.law_kunt_makanaki: {title: "If I were in your place", gloss: "if I were in your place", note: "*لو كنت مكانك* introduces unreal advice: if I were you. Said to a woman (here Laila) it is read law kuntu makānaki; to a man, law kuntu makānaka - the spelling is the same.", example_gloss: "If I were in your place, I would take a short vacation."}
  ar.b1.unit45.lesson01.teach.la_akhadhtu_ijaza: {title: "I would take a short vacation", gloss: "I would take a short vacation", note: "*لأخذت إجازة قصيرة* is the لو-conditional result: I would take a short vacation.", example_gloss: "If I were in your place, I would take a short vacation."}
  ar.b1.unit45.lesson01.teach.yusuf_nasiha: {title: "Yusuf gives advice", gloss: "If I were in your place, I would take a short vacation.", note: "*لو* + a past-tense verb links an unreal premise to its result.", example_gloss: "Yusuf said: If I were in your place, I would take a short vacation."}
  ar.b1.unit45.lesson02.teach.la_astatiu: {title: "I cannot take a vacation now", gloss: "I cannot take a vacation now", note: "*لا أستطيع أخذ إجازة الآن* means I cannot take a vacation now.", example_gloss: "Laila said: I cannot take a vacation now."}
  ar.b1.unit45.lesson02.teach.lamadha_la: {title: "Why don't", gloss: "why don't", note: "*لماذا لا* + a present-tense verb makes a suggestion.", example_gloss: "Why don't you sleep early this week?"}
  ar.b1.unit45.lesson02.teach.tanamin_mubakkiran: {title: "You (f.) sleep early", gloss: "you sleep early", note: "*تنامين مبكرا* means you (feminine) sleep early.", example_gloss: "Why don't you sleep early this week?"}
  ar.b1.unit45.lesson02.teach.hadha_alusbu: {title: "This week", gloss: "this week", note: "*هذا الأسبوع* means this week.", example_gloss: "Why don't you sleep early this week?"}
  ar.b1.unit45.lesson02.teach.yusuf_iqtirah: {title: "Yusuf makes a suggestion", gloss: "Why don't you sleep early this week?", note: "*لماذا لا* + a present-tense verb is a common suggestion form.", example_gloss: "Yusuf said: Why don't you sleep early this week?"}
  ar.b1.unit45.lesson03.teach.fikra_jayyida: {title: "This is a good idea", gloss: "this is a good idea", note: "*هذه فكرة جيدة* is how Laila accepts the suggestion.", example_gloss: "Laila said: This is a good idea."}
  ar.b1.unit45.lesson03.teach.hal_yajib: {title: "Should I also stop drinking coffee?", gloss: "should I also stop drinking coffee?", note: "*هل يجب أن أتوقف عن شرب القهوة أيضا؟* is Laila's follow-up question.", example_gloss: "Laila said: Should I also stop drinking coffee?"}
  ar.b1.unit45.lesson03.teach.idhan: {title: "Then / so", gloss: "then / so", note: "*إذن* links to the next suggestion after the first one was declined.", example_gloss: "Then why don't you sleep early this week?"}
  ar.b1.unit45.lesson03.teach.yusuf_idhan: {title: "Yusuf continues with إذن", gloss: "Then why don't you sleep early this week?", note: "This continues the dialogue after Laila declines the first suggestion.", example_gloss: "Yusuf said: Then why don't you sleep early this week?"}
exercises:
  ar.b1.unit45.lesson01.exercise01.recognize_mutaaba:
    instruction: "Select the meaning."
    correct_option: "I am very tired at work"
    distractors: ["I am very happy at work", "I was tired at work yesterday", "I am not tired at work"]
    accepted_answers: [{value: "I am very tired at work", status: correct}]
    feedback: "*أنا متعبة جدا في العمل* states the problem."
  ar.b1.unit45.lesson01.exercise02.recognize_law_kunt_makanaki:
    instruction: "Select the meaning."
    correct_option: "If I were in your place, I would take a short vacation"
    distractors: ["Because I took a short vacation", "If I am in your place, I will take a short vacation", "Although I did not take a vacation"]
    accepted_answers: [{value: "If I were in your place, I would take a short vacation", status: correct}]
    feedback: "*لو كنت مكانك لأخذت إجازة قصيرة* is unreal advice with لو."
  ar.b1.unit45.lesson01.exercise03.listen_select_nasiha_law:
    instruction: "Listen and select what Yusuf says."
    correct_option: "If I were in your place, I would take a short vacation."
    distractors: ["If I were in your place, I would take a long vacation.", "I took a short vacation last week.", "You should take a long vacation."]
    accepted_answers: [{value: "If I were in your place, I would take a short vacation.", status: correct}]
    feedback: "You heard *لو كنت مكانك لأخذت إجازة قصيرة*."
  ar.b1.unit45.lesson01.exercise04.match_nasiha_law:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {لو: if, "كنت مكانك": "I were in your place", لأخذت: "I would take", إجازة: vacation, قصيرة: short, متعبة: tired, "لو كنت مكانك": "If I were in your place", "إجازة قصيرة": "a short vacation"}
        status: correct
    feedback: "These phrases cover the unreal-advice construction and its parts."
  ar.b1.unit45.lesson01.exercise05.order_nasiha_law:
    instruction: "Arrange the Arabic words for If I were in your place, I would take a short vacation."
    accepted_answers: [{value: [لو, كنت, مكانك, لأخذت, إجازة, قصيرة], status: correct}]
    feedback: "*لو كنت مكانك لأخذت إجازة قصيرة* links the unreal premise to its result with لو."
  ar.b1.unit45.lesson01.exercise06.write_nasiha_law:
    instruction: "Write exactly this piece of advice using لو + a past-tense verb for an unreal condition: If I were in your place, I would take a short vacation."
    accepted_answers:
      - {value: "لو كنت مكانك لأخذت إجازة قصيرة", status: correct}
      - {value: "لو كنت مكانك لأخذت إجازة قصيرة.", status: correct}
    feedback: "*لو كنت مكانك لأخذت إجازة قصيرة.* is the requested sentence."
  ar.b1.unit45.lesson02.exercise01.recognize_la_astatiu:
    instruction: "Select the meaning."
    correct_option: "I cannot take a vacation now"
    distractors: ["I could not take a vacation last year", "I do not want a vacation", "I can take a vacation now"]
    accepted_answers: [{value: "I cannot take a vacation now", status: correct}]
    feedback: "*لا أستطيع أخذ إجازة الآن* is Laila's objection."
  ar.b1.unit45.lesson02.exercise02.recognize_lamadha_la:
    instruction: "Select the meaning."
    correct_option: "Why don't you sleep early this week?"
    distractors: ["Why did you sleep early this week?", "Why do you never sleep early?", "You should not sleep early this week."]
    accepted_answers: [{value: "Why don't you sleep early this week?", status: correct}]
    feedback: "*لماذا لا تنامين مبكرا هذا الأسبوع؟* is a suggestion with لماذا لا."
  ar.b1.unit45.lesson02.exercise03.listen_select_iqtirah:
    instruction: "Listen and select what Yusuf says."
    correct_option: "Why don't you sleep early this week?"
    distractors: ["Why don't you take a vacation this week?", "You slept early this week.", "Why don't you sleep early next month?"]
    accepted_answers: [{value: "Why don't you sleep early this week?", status: correct}]
    feedback: "You heard *لماذا لا تنامين مبكرا هذا الأسبوع؟*."
  ar.b1.unit45.lesson02.exercise04.match_iqtirah:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"لماذا لا": "why don't", تنامين: "you (f.) sleep", مبكرا: early, "هذا الأسبوع": "this week", "لا أستطيع": "I cannot", الآن: now, "لا أستطيع أخذ إجازة الآن": "I cannot take a vacation now", "تنامين مبكرا": "you sleep early"}
        status: correct
    feedback: "These phrases cover the objection and the suggestion."
  ar.b1.unit45.lesson02.exercise05.order_iqtirah:
    instruction: "Arrange the Arabic words for Why don't you sleep early this week?"
    accepted_answers: [{value: [لماذا, لا, تنامين, مبكرا, هذا, الأسبوع], status: correct}]
    feedback: "*لماذا لا تنامين مبكرا هذا الأسبوع؟* is a suggestion with لماذا لا."
  ar.b1.unit45.lesson02.exercise06.write_iqtirah:
    instruction: "Write exactly this suggestion using لماذا لا + a present-tense verb: Why don't you sleep early this week?"
    accepted_answers:
      - {value: "لماذا لا تنامين مبكرا هذا الأسبوع", status: correct}
      - {value: "لماذا لا تنامين مبكرا هذا الأسبوع؟", status: correct}
    feedback: "*لماذا لا تنامين مبكرا هذا الأسبوع؟* is the requested sentence."
  ar.b1.unit45.lesson03.exercise01.choose_response_accept:
    instruction: "Which answer shows Laila ACCEPTING Yusuf's suggestion?"
    correct_option: "هذه فكرة جيدة"
    distractors: ["لا أستطيع أخذ إجازة الآن", "أنا متعبة جدا في العمل", "لو كنت مكانك لأخذت إجازة قصيرة"]
    accepted_answers: [{value: "هذه فكرة جيدة", status: correct}]
    feedback: "*هذه فكرة جيدة* is Laila accepting the suggestion."
  ar.b1.unit45.lesson03.exercise02.dialogue_comprehension_nasiha:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Laila declines a vacation but accepts sleeping early, then asks whether she should also stop drinking coffee."
    distractors: ["Laila accepts taking a vacation right away.", "Laila rejects both of Yusuf's suggestions.", "Laila is not tired and needs no advice."]
    accepted_answers: [{value: "Laila declines a vacation but accepts sleeping early, then asks whether she should also stop drinking coffee.", status: correct}]
    feedback: "Laila declines the first suggestion, accepts the second, and asks a follow-up question about coffee."
  ar.b1.unit45.lesson03.exercise03.match_dialogue_nasiha:
    instruction: "Match each Arabic sentence with its meaning."
    accepted_answers:
      - value: {"أنا متعبة جدا في العمل هذه الأيام.": "I am very tired at work these days.", "لو كنت مكانك لأخذت إجازة قصيرة.": "If I were in your place, I would take a short vacation.", "لا أستطيع أخذ إجازة الآن.": "I cannot take a vacation now.", "إذن، لماذا لا تنامين مبكرا هذا الأسبوع؟": "Then why don't you sleep early this week?", "هذه فكرة جيدة.": "This is a good idea.", "هل يجب أن أتوقف عن شرب القهوة أيضا؟": "Should I also stop drinking coffee?"}
        status: correct
    feedback: "These lines cover the full advice exchange."
  ar.b1.unit45.lesson03.exercise04.order_fikra_jayyida:
    instruction: "Arrange the Arabic words for This is a good idea."
    accepted_answers: [{value: [هذه, فكرة, جيدة], status: correct}]
    feedback: "*هذه فكرة جيدة* accepts the suggestion."
  ar.b1.unit45.lesson03.exercise05.reply_advice_response:
    instruction: "Yusuf asks: Why don't you sleep early this week? Reply as Laila, accepting the suggestion by saying: This is a good idea."
    accepted_answers:
      - {value: "هذه فكرة جيدة", status: correct}
      - {value: "هذه فكرة جيدة.", status: correct}
      - {value: "فكرة جيدة", status: correct}
    feedback: "*هذه فكرة جيدة.* is Laila's accepting reply."
  ar.b1.unit45.lesson03.exercise06.write_full_nasiha:
    instruction: "As Yusuf, write two sentences of advice to Laila: first, tell her that if you were in her place, you would take a short vacation (using لو + a past-form verb); then suggest that she sleep early this week (using لماذا لا + a present-tense verb)."
    accepted_answers:
      - {value: "لو كنت مكانك لأخذت إجازة قصيرة لماذا لا تنامين مبكرا هذا الأسبوع", status: correct}
      - {value: "لو كنت مكانك لأخذت إجازة قصيرة. لماذا لا تنامين مبكرا هذا الأسبوع؟", status: correct}
    feedback: "*لو كنت مكانك لأخذت إجازة قصيرة. لماذا لا تنامين مبكرا هذا الأسبوع؟* links the unreal-advice and suggestion forms as required."
