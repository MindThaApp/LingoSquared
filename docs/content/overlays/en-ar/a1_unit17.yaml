    instruction: "Select the meaning."
    correct_option: pain
    distractors: [ticket, train, coffee]
    accepted_answers: [{value: pain, status: correct}]
    feedback: "ألم means pain."
  ar.a1.unit17.lesson01.exercise02.listen_headache:
    instruction: "Listen and select what you hear."
    correct_option: "I have a pain in the head."
    distractors: ["I have a pain in the stomach.", "Drink water.", "I need a ticket."]
    accepted_answers: [{value: "I have a pain in the head.", status: correct}]
    feedback: "You heard عندي ألم في الرأس."
  ar.a1.unit17.lesson01.exercise03.match_body_words:
    instruction: "Match each Arabic health word with its meaning."
    accepted_answers:
      - value: {ألم: pain, الرأس: head, البطن: stomach}
        status: correct
    feedback: "These words state a basic health problem."
