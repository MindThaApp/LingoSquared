teaching:
  ar.a1.unit17.lesson01.teach.pain: {title: "Pain", gloss: "pain", note: "ألم (alam) means pain; عندي ألم (ʿindī alam) is I have (a) pain.", example_gloss: "I have pain."}
  ar.a1.unit17.lesson01.teach.head: {title: "Head", gloss: "the head", note: "الرأس (ar-raʾs) is the head. Arabic says عندي ألم في الرأس, a pain in the head, where English usually says I have a headache.", example_gloss: "I have pain in the head."}
  ar.a1.unit17.lesson01.teach.stomach: {title: "Stomach", gloss: "the stomach", note: "البطن (al-baṭn) is the stomach or belly area.", example_gloss: "I have pain in the stomach."}
  ar.a1.unit17.lesson01.teach.problem_sentence: {title: "Pain in the head", gloss: "I have a pain in the head", note: "عندي ألم, literally with me (is) pain, is how Arabic says I have pain; في + the body part says where.", example_gloss: "Layla said: I have a pain in the head."}
  ar.a1.unit17.lesson02.teach.problem_question: {title: "What is the problem?", gloss: "What is the problem?", note: "ما (mā) asks what; المشكلة (al-mushkila) means the problem.", example_gloss: "What is the problem, Layla?"}
  ar.a1.unit17.lesson02.teach.drink: {title: "Drink water", gloss: "drink water", note: "اشربي (ishrabī) is the command drink! said to a woman, here Layla; to a man it is اشرب (ishrab).", example_gloss: "Yusuf said: Drink water."}
  ar.a1.unit17.lesson02.teach.rest: {title: "Rest", gloss: "rest", note: "استريحي (istarīḥī) is the command rest! said to a woman; to a man it is استرح (istariḥ).", example_gloss: "Rest today."}
  ar.a1.unit17.lesson02.teach.need_help: {title: "I need help", gloss: "I need help", note: "أحتاج (aḥtāj) means I need and مساعدة (musāʿada) means help. You will also meet أحتاج إلى مساعدة, with إلى; both are correct.", example_gloss: "I have pain. I need help."}
  ar.a1.unit17.lesson02.teach.line01: {title: "Ask the problem", gloss: "Yusuf asks Layla what the problem is.", note: "يا ليلى addresses Layla by name.", example_gloss: "Yusuf said: What is the problem, Layla?"}
  ar.a1.unit17.lesson02.teach.line02: {title: "State the symptom", gloss: "Layla says she has pain in her head.", note: "The symptom is stated directly.", example_gloss: "Layla said: I have a pain in the head."}
  ar.a1.unit17.lesson02.teach.line03: {title: "Simple advice", gloss: "Yusuf tells Layla to drink water and rest.", note: "Both commands are feminine because Yusuf is speaking to Layla; و (wa, and) is written joined to the next word: واستريحي.", example_gloss: "Yusuf said: Drink water and rest."}
  ar.a1.unit17.lesson02.teach.line04: {title: "Thanks", gloss: "Layla says thanks.", note: "شكرا closes the short exchange.", example_gloss: "Layla said: Thanks."}
exercises:
