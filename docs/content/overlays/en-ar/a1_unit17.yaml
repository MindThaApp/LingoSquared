exercises:
  ar.a1.unit17.lesson01.exercise01.recognize_pain:
    instruction: "Select the meaning."
    correct_option: pain
    distractors: [ticket, train, coffee]
    accepted_answers: [{value: pain, status: correct}]
    feedback: "ألم means pain."
  ar.a1.unit17.lesson01.exercise02.listen_headache:
    instruction: "Listen and select what you hear."
    correct_option: "I have a pain in the head."
    distractors: ["I have a pain in the stomach.", "Drink water.", "I need a ticket."]
    accepted_answers: [{value: "I have a pain in the head.", status: correct}]
    feedback: "You heard عندي ألم في الرأس."
  ar.a1.unit17.lesson01.exercise03.match_body_words:
    instruction: "Match each Arabic health word with its meaning."
    accepted_answers:
      - value: {ألم: pain, الرأس: head, البطن: stomach}
        status: correct
    feedback: "These words state a basic health problem."
  ar.a1.unit17.lesson01.exercise04.order_headache:
    instruction: "Arrange the Arabic words for I have a pain in the head."
    accepted_answers: [{value: [عندي, ألم, في, الرأس], status: correct}]
    feedback: "عندي ألم في الرأس states the problem."
  ar.a1.unit17.lesson01.exercise05.write_health_problem:
    instruction: "Type exactly this Arabic health problem: I have a pain in the head."
    accepted_answers:
      - {value: "عندي ألم في الرأس", status: correct}
      - {value: "عندي ألم في الرأس.", status: correct}
    feedback: "عندي ألم في الرأس is the requested health problem."
  ar.a1.unit17.lesson01.exercise06.dictation_head_pain: {correct_response: "عندي ألم في الرأس.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit17.lesson02.exercise01.recognize_rest:
    instruction: "Select the meaning."
    correct_option: rest
    distractors: [drink, ask, buy]
    accepted_answers: [{value: rest, status: correct}]
    feedback: "استريحي means rest when speaking to Layla."
  ar.a1.unit17.lesson02.exercise02.dialogue_health:
    instruction: "What problem does Layla state?"
    correct_option: "Pain in the head."
    distractors: ["Pain in the stomach.", "A late train.", "No coffee."]
    accepted_answers: [{value: "Pain in the head.", status: correct}]
    feedback: "Layla says عندي ألم في الرأس."
  ar.a1.unit17.lesson02.exercise03.match_problem_advice:
    instruction: "Match each Arabic health line with its meaning."
    accepted_answers:
      - value: {"عندي ألم في الرأس": "I have a pain in the head", "اشربي ماء": "Drink water", استريحي: "Rest"}
        status: correct
    feedback: "The exchange states a problem and gives simple advice."
  ar.a1.unit17.lesson02.exercise04.order_advice:
    instruction: "Arrange the Arabic words for Drink water and rest."
    accepted_answers: [{value: [اشربي, ماء, واستريحي], status: correct}]
    feedback: "اشربي ماء واستريحي gives simple advice to Layla."
  ar.a1.unit17.lesson02.exercise05.write_health_message:
    instruction: "Type exactly this Arabic health message: I have a pain in the head. I need help."
    accepted_answers:
      - {value: "عندي ألم في الرأس. أحتاج مساعدة.", status: correct}
      - {value: "عندي ألم في الرأس أحتاج مساعدة", status: correct}
      - {value: "عندي ألم في الرأس. أحتاج مساعدة", status: correct}
    feedback: "عندي ألم في الرأس. أحتاج مساعدة. states the problem and asks for help."
