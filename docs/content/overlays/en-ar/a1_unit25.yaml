course:
  title: Arabic A1
  description: 'Beginner Arabic for describing free-time activities: hobby vocabulary, frequency expressions, asking and answering what someone does in their free time, and comparing two people''s hobbies.'
units:
  ar.a1.unit25.hobbies:
    title: Hobbies and free time
