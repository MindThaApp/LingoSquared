teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: القراءة (al-qirāʾa) is reading, ممارسة الرياضة (mumārasat ar-riyāḍa) is doing sport and الطبخ (aṭ-ṭabkh) is cooking. Each is a noun, so the article ال is attached.
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Free time
    gloss: free time
    note: وقت الفراغ (waqt al-farāgh) is literally the time of free space. The first word has no ال; only the second word takes it.
    example_gloss: In my free time, I like to read.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: أحب (uḥibb) means I like and is the same for a man and a woman. The ي at the end of فراغي (farāghī) means my.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) is listening to music, الرسم (ar-rasm) is drawing and لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) is playing video games.
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: 'الاستماع (al-istimāʿ) needs إلى (ilā, to) before what you listen to: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: 'مع (maʿa) means with: مع الأصدقاء (maʿa al-aṣdiqāʾ). The article ال stays attached to الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) and أبدا (abadan) are adverbs, so they never change for gender. The final ا (alif) is written without any marks.
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: كل أسبوع (kull usbūʿ) and كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) both use كل (kull, every); see the next card.
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Every: كل'
    gloss: 'After كل (kull, every) the noun is singular and has no ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) never changes: the same word is used before a masculine noun like أسبوع and a feminine noun like عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla brings up hobbies
    gloss: 'Layla: We often walk together. But what else do you do in your free time, Yusuf?'
    note: The opening letter ن (na-) on نتمشى (natamashshā) means we, so Arabic needs no separate word for we. معا (maʿan) means together.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Yusuf's hobbies
    gloss: 'Yusuf: I like cooking, at home too. And I exercise often.'
    note: في البيت أيضا (fī al-bayt ayḍan) adds at home too. وأمارس (wa-umāris) joins و (and) to the verb and is written as one word.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla is surprised
    gloss: 'Layla: You cook at home too? You already cook all day at your job!'
    note: تطبخ (taṭbukh) is the you-verb for a man; to a woman you say تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) means all day long.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf explains
    gloss: 'Yusuf: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: 'أجد (ajid) means I find and مريحا (murīḥan) means relaxing. وأنت (wa-anta) joins و to أنت: and you.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Layla's hobbies
    gloss: 'Layla: I like reading and I often listen to music.'
    note: 'و joins the two hobbies: أحب القراءة (uḥibb al-qirāʾa) and وأستمع (wa-astamiʿ, and I listen). It is written attached to the next word.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf asks about gaming
    gloss: 'Yusuf: Do you also game?'
    note: تلعبين (talʿabīn) is the you-verb for a woman, because Yusuf is asking Layla; for a man it is تلعب (talʿab). هل (hal) starts a yes/no question.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla answers
    gloss: 'Layla: No, I never game. But I sometimes draw!'
    note: 'أبدا (abadan) means never and أحيانا (aḥyānan) sometimes. The verb is negated with لا (lā): لا ألعب (lā alʿab) means I do not play.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Comparing hobbies
    gloss: Yusuf and I often walk together. But we also have other hobbies. Yusuf likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Layla's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      نتمشى: walk
      كثيرا: often
      معا: together
      أخرى: other
      يطبخ: cooks
      يحب: likes to
      البيت: the house (at home)
      ويمارس: exercises
      أقرأ: read
      وأستمع: listen
      الموسيقى: music
      أرسم: draw
      أحيانا: sometimes
      ألعب: play (video games)
      أبدا: never
      فراغك: your free (time)
      وقت: time
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf asks about the weekend
    gloss: 'Yusuf: What are you doing this weekend?'
    note: 'ستفعلين (sa-tafʿalīn) is future: the opening letter س (sa-) marks it, and the ending ين is for a woman. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) is the weekend.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla is undecided
    gloss: 'Layla: I don''t know yet. I like reading, but I also want to go outside.'
    note: لا أعرف بعد (lā aʿrif baʿd) means I do not know yet. أن أخرج (an akhruj) means to go out.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf suggests a plan
    gloss: 'Yusuf: Shall we walk together? I''ll cook for us afterward.'
    note: 'هل نتمشى (hal natamashshā) is the usual way to suggest something together: هل + a we-verb. لنا (lanā) is ل (for) + نا (us), written as one word.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla agrees
    gloss: 'Layla: Good idea! I like both walking and cooking.'
    note: 'كليهما (kilayhimā) means both and comes at the end, referring to the two things: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf confirms
    gloss: 'Yusuf: Perfect. Then I''ll see you Saturday!'
    note: يوم السبت (yawm as-sabt) means on Saturday. The ل of ال is not pronounced before س, a sun letter, so we write as-sabt.
