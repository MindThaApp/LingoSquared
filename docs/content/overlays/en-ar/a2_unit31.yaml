exercises:
  ar.a2.unit31.lesson01.exercise01.recognize_delayed:
    instruction: "Select the meaning."
    correct_option: delayed
    distractors: [platform, alternative, technical]
    accepted_answers: [{value: delayed, status: correct}]
    feedback: "*متأخر* means delayed."
  ar.a2.unit31.lesson01.exercise02.listen_delay_half_hour:
    instruction: "Listen and select what you hear."
    correct_option: "The train is delayed half an hour."
    distractors: ["The train is cancelled.", "The platform has changed.", "The train arrived early."]
    accepted_answers: [{value: "The train is delayed half an hour.", status: correct}]
    feedback: "You heard *القطار متأخر نصف ساعة*."
  ar.a2.unit31.lesson01.exercise03.match_travel_words:
    instruction: "Match each Arabic travel word or phrase with its meaning."
    accepted_answers:
      - value: {متأخر: delayed, "نصف ساعة": "half an hour", "مشكلة فنية": "technical problem", بسبب: "because of", "قطار بديل": "alternative train", "الرصيف رقم اثنين": "platform number two"}
        status: correct
    feedback: "These words describe the delay and the alternative."
  ar.a2.unit31.lesson01.exercise04.order_delay_reason:
    instruction: "Arrange the Arabic words for The train is delayed half an hour because of a technical problem."
    accepted_answers: [{value: [القطار, متأخر, نصف, ساعة, بسبب, مشكلة, فنية], status: correct}]
    feedback: "*القطار متأخر نصف ساعة بسبب مشكلة فنية* explains the delay."
  ar.a2.unit31.lesson01.exercise05.write_delay_reason:
    instruction: "Type exactly this formal Arabic sentence: The train is delayed half an hour because of a technical problem."
    accepted_answers:
      - {value: "القطار متأخر نصف ساعة بسبب مشكلة فنية", status: correct}
      - {value: "القطار متأخر نصف ساعة بسبب مشكلة فنية.", status: correct}
    feedback: "*القطار متأخر نصف ساعة بسبب مشكلة فنية* is the requested delay explanation."
  ar.a2.unit31.lesson02.exercise01.recognize_alternative_train:
    instruction: "Select the meaning."
    correct_option: "alternative train"
    distractors: [delayed, "half an hour", "technical problem"]
    accepted_answers: [{value: "alternative train", status: correct}]
    feedback: "*قطار بديل* means alternative train."
  ar.a2.unit31.lesson02.exercise02.dialogue_next_train:
    instruction: "When does the alternative train leave, and from where?"
    correct_option: "In ten minutes, from platform number two."
    distractors: ["In half an hour, from platform one.", "Immediately, from platform three.", "Tomorrow, from platform two."]
    accepted_answers: [{value: "In ten minutes, from platform number two.", status: correct}]
    feedback: "The agent says *يوجد قطار آخر بعد عشر دقائق من الرصيف رقم اثنين*."
  ar.a2.unit31.lesson02.exercise03.match_alternative_lines:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"هل يوجد قطار بديل؟": "Is there an alternative train?", "قطار آخر بعد عشر دقائق": "another train in ten minutes", "الرصيف رقم اثنين": "platform number two", "هل سيصل في نفس الوقت تقريبا؟": "Will it arrive around the same time?", "سيتأخر فقط عشر دقائق": "it will only be ten minutes late", نعم: "Yes"}
        status: correct
    feedback: "These phrases cover asking about and confirming the alternative train."
  ar.a2.unit31.lesson02.exercise04.order_ask_alternative:
    instruction: "Arrange the Arabic words for Is there an alternative train?"
    accepted_answers: [{value: [هل, يوجد, قطار, بديل], status: correct}]
    feedback: "*هل يوجد قطار بديل؟* asks about the alternative."
  ar.a2.unit31.lesson02.exercise05.write_disruption_message:
    instruction: "Write a short formal Arabic message with exactly this content: apologize and say the train is delayed because of a technical problem, and ask if there is an alternative train."
    accepted_answers:
      - {value: "عذرا، القطار متأخر بسبب مشكلة فنية. هل يوجد قطار بديل؟", status: correct}
      - {value: "عذرا، القطار متأخر بسبب مشكلة فنية، هل يوجد قطار بديل؟", status: correct}
      - {value: "عذرا القطار متأخر بسبب مشكلة فنية. هل يوجد قطار بديل؟", status: correct}
    feedback: "*عذرا، القطار متأخر بسبب مشكلة فنية. هل يوجد قطار بديل؟* reports the disruption and asks about the alternative."
