exercises:
  ar.a1.unit24.lesson01.exercise06.dictation_money_card:
    instruction: "Type what you hear."
    correct_option: "سأدفع بالبطاقة"
    accepted_answers: [{value: "سأدفع بالبطاقة", status: correct}]
    orthography_strict: true
    feedback: "Type the sentence exactly as you hear it."
  ar.a1.unit24.lesson01.exercise01.recognize_card:
    instruction: "Select the meaning."
    correct_option: card
    distractors: [cash, money, price]
    accepted_answers: [{value: card, status: correct}]
    feedback: "بطاقة means card."
  ar.a1.unit24.lesson01.exercise02.listen_card_payment:
    instruction: "Listen and select what you hear."
    correct_option: "I will pay by card."
    distractors: ["I pay cash.", "The amount is ten dirhams.", "Can I pay by card?"]
    accepted_answers: [{value: "I will pay by card.", status: correct}]
    feedback: "You heard سأدفع بالبطاقة."
  ar.a1.unit24.lesson01.exercise03.match_payment_words:
    instruction: "Match each Arabic payment word with its meaning."
    accepted_answers:
      - value: {مال: money, أدفع: "I pay", بطاقة: card, نقدا: cash, عشرة: ten, دراهم: dirhams}
        status: correct
    feedback: "These words name money and payment methods."
  ar.a1.unit24.lesson01.exercise04.order_pay_card:
    instruction: "Arrange the Arabic words for I will pay by card."
    accepted_answers: [{value: [سأدفع, بالبطاقة], status: correct}]
    feedback: "سأدفع بالبطاقة states the payment method."
  ar.a1.unit24.lesson01.exercise05.write_payment_method:
    instruction: "Type exactly this Arabic payment-method sentence: I will pay by card."
    accepted_answers:
      - {value: "سأدفع بالبطاقة", status: correct}
      - {value: "سأدفع بالبطاقة.", status: correct}
      - {value: "سوف أدفع بالبطاقة", status: correct}
    feedback: "سأدفع بالبطاقة is the requested payment-method sentence."
  ar.a1.unit24.lesson02.exercise01.recognize_amount:
    instruction: "Select the meaning."
    correct_option: amount
    distractors: [card, cash, phone]
    accepted_answers: [{value: amount, status: correct}]
    feedback: "المبلغ means the amount."
  ar.a1.unit24.lesson02.exercise02.dialogue_payment:
    instruction: "How does Layla choose to pay?"
    correct_option: "By card."
    distractors: ["Cash.", "With apples.", "With a ticket."]
    accepted_answers: [{value: "By card.", status: correct}]
    feedback: "Layla says سأدفع بالبطاقة."
  ar.a1.unit24.lesson02.exercise03.match_payment_lines:
    instruction: "Match each Arabic payment line with its meaning."
    accepted_answers:
      - value: {"كم المبلغ؟": "How much is the amount?", "عشرة دراهم": "ten dirhams", بالبطاقة: "by card", نقدا: cash, أدفع: "I pay", المبلغ: "the amount"}
        status: correct
    feedback: "These lines cover the amount and payment methods."
  ar.a1.unit24.lesson02.exercise04.order_payment_question:
    instruction: "Arrange the Arabic words for Can I pay by card?"
    accepted_answers: [{value: [هل, أستطيع, الدفع, بالبطاقة], status: correct}]
    feedback: "هل أستطيع الدفع بالبطاقة؟ asks about a payment method."
  ar.a1.unit24.lesson02.exercise05.write_payment_note:
    instruction: "Type exactly this Arabic payment exchange note with method question, amount, and chosen method: Can I pay by card? The amount is ten dirhams. I will pay by card."
    accepted_answers:
      - {value: "هل أستطيع الدفع بالبطاقة؟ المبلغ عشرة دراهم. سأدفع بالبطاقة.", status: correct}
      - {value: "هل أستطيع الدفع بالبطاقة؟ المبلغ عشرة دراهم. سأدفع بالبطاقة", status: correct}
    feedback: "هل أستطيع الدفع بالبطاقة؟ المبلغ عشرة دراهم. سأدفع بالبطاقة. asks about the method, states the amount, and gives the chosen method."
