review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the past-habits unit (kana plus imperfect, frequency words, kana with adjectives, questions). OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit69.kayfa_kanat_alhayat: {"title": "How life used to be", "description": "Describe how life used to be, in childhood or in another place, with kana plus the present-tense verb for habits, and say how it differs from now."}
lessons:
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.kuntu_askun: {"title": "I used to live in the village"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.kull_yawm: {"title": "Every day"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.past_and_now: {"title": "Then and now"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.questions: {"title": "Did you use to play?"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.reading_yusuf: {"title": "Yusuf's childhood"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.teach.places: {"title": "Places", "gloss": "the village / the city / my grandfather's house / the school", "example_gloss": ["I used to live in the village.", "My grandfather's house was in the village."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.teach.verbs: {"title": "Present-tense verbs: I", "gloss": "I live / I play / I go / I study", "note": "The present tense (al-mudari') starts with a prefix: *أ* for I.", "example_gloss": ["I used to go to school.", "I used to play in the village.", "Yusuf used to go to school."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.teach.gn_kana: {"title": "كَانَ: to be, in the past", "gloss": "I was, you (masc.) were, you (fem.) were, he was, she was, we were, they were", "note": "*كَانَ* is a hollow verb like *نَامَ*: the long vowel shortens before -tu, -ta, -ti and -na (*كُنْتُ*, *كُنَّا*)."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.teach.gn_imperfect: {"title": "The present tense of a verb", "gloss": "I live, you (masc.) live, you (fem.) live, he lives, she lives, we live, they live", "note": "Prefixes show the person: أ (I), ت (you, and she), ي (he, they), ن (we). Only 'you (fem.)' and 'they' also add an ending (-īna, -ūna)."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.teach.gn_habit: {"title": "Habit in the past: كَانَ + present tense", "gloss": "I used to live in the village. Yusuf used to play in the village. Layla used to play in the village.", "note": "To say 'used to', put *كَانَ* (in the right person) first and the present-tense verb after it. Both parts agree with the subject."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.teach.frequency: {"title": "How often", "gloss": "every day / every morning / always / sometimes", "example_gloss": ["I used to play every day.", "I always used to go to school."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.teach.family: {"title": "Family", "gloss": "my grandfather / my grandmother / my father / my mother", "example_gloss": ["My grandfather used to work every day.", "My grandmother used to read every morning."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.teach.verbs2: {"title": "More present-tense verbs", "gloss": "he works / she reads / he eats / we play / they play", "example_gloss": ["My grandfather used to eat every day.", "We used to play every day.", "They used to play every day."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.teach.gn_plural: {"title": "We and they", "gloss": "We used to play. They used to play.", "note": "For 'we' use *كُنَّا* + *نَ-*. For 'they' (masculine) use *كَانُوا* + *يَ-...-ونَ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.teach.gn_order: {"title": "Where the time word goes", "gloss": "We used to play every day. Every day we used to play. We always used to play.", "note": "*كُلَّ يَوْم* can open or close the sentence; *دَائِمًا* usually stands right after *كَانَ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.teach.adjectives: {"title": "Describing words", "gloss": "small / big / quiet / crowded / old", "note": "After *كَانَ* the describing word ends in *-an* and agrees in gender: *صَغِيرًا* (masc.), *هَادِئَةً* (fem.).", "example_gloss": ["The house was small.", "The village was quiet."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.teach.then_now: {"title": "Then and now", "gloss": "now / in the past / but", "example_gloss": ["In the past I used to live in the village.", "But now I live in the city."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.teach.gn_adj: {"title": "كَانَ with a describing word", "gloss": "The house was small. The house was big. The house was old. The village was quiet. The city was crowded.", "note": "Use *كَانَ* for masculine nouns and *كَانَتْ* for feminine ones. Before a word starting with *ال* the *ت* takes a kasra: *كَانَتِ الْقَرْيَة*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.teach.gn_contrast: {"title": "Now: no verb needed", "gloss": "The village was quiet. Now the city is crowded. The village is quiet.", "note": "In the present, Arabic needs no verb 'to be'. The past needs *كَانَ*, so the contrast is easy to see."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.teach.qwords: {"title": "Question words", "gloss": "where / with whom / there / with my friends", "example_gloss": ["Where did you use to live? (to a man)", "Who did you use to play with? (to a woman)", "I used to play there with my friends."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.teach.gn_you: {"title": "You: masculine and feminine", "gloss": "You (masc.) used to play. You (fem.) used to play.", "note": "Both parts change for a woman: *كُنْتِ* and *تَلْعَبِينَ*. The longer ending makes the feminine visible even without vowel marks."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.teach.gn_yesno: {"title": "Yes/no questions and answers", "gloss": "Did you use to play there? Yes, I used to play there.", "note": "Put *هَلْ* first and keep the rest of the statement. Answer with *نَعَمْ* and the same verbs."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "when / and it (fem.) is", "example_gloss": ["When I was small I used to live in the village.", "When I was small (a woman speaking) I used to play.", "The city is crowded and it is big."]}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.teach.gn_wa: {"title": "Joining two past habits", "gloss": "My grandmother used to read and my grandfather used to work.", "note": "Repeat *كَانَ* for each new subject, and attach *وَ* to it."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.teach.reading: {"title": "Yusuf remembers", "gloss": "When I was small I used to live in the village. My grandfather's house was small and the village was quiet. I used to go to school every morning and play with my friends. My grandmother used to read every day and my grandfather used to work. Now I live in the city, and it is crowded.", "note": "Habits use *كَانَ* + present tense; the description of the place uses *كَانَ* + describing word."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Where did you use to live when you were small?"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: I used to live in the village with my grandfather and grandmother."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: Did you use to play there?"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d4: {"title": "Yusuf explains", "gloss": "Yusuf: Yes, I used to play with my friends every day."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d5: {"title": "Layla shares", "gloss": "Layla: And I used to live in the city, and it was crowded."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.teach.d6: {"title": "Yusuf sums up", "gloss": "Yusuf: And now we live in the city!"}
exercises:
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise01.choose_used_live: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "distractors": ["أَسْكُنُ فِي الْقَرْيَة.", "كَانَ يَسْكُنُ فِي الْقَرْيَة.", "كُنَّا نَسْكُنُ فِي الْقَرْيَة."], "accepted_answers": [{"value": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "status": "correct"}], "feedback": "*كُنْتُ* + *أَسْكُنُ* = I used to live."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise02.choose_layla_play: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَتْ لَيْلَى تَلْعَبُ فِي الْقَرْيَة.", "distractors": ["كَانَ يُوسُف يَلْعَبُ فِي الْقَرْيَة.", "كَانَتْ لَيْلَى تَلْعَبُ فِي الْمَدْرَسَة.", "كَانَتْ لَيْلَى تَسْكُنُ فِي الْقَرْيَة."], "accepted_answers": [{"value": "كَانَتْ لَيْلَى تَلْعَبُ فِي الْقَرْيَة.", "status": "correct"}], "feedback": "A feminine subject: *كَانَتْ* and *تَلْعَبُ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise03.match_words: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "الْقَرْيَة", "right": "the village"}, {"left": "الْمَدِينَة", "right": "the city"}, {"left": "بَيْت جَدِّي", "right": "my grandfather's house"}, {"left": "الْمَدْرَسَة", "right": "the school"}, {"left": "أَسْكُنُ", "right": "I live"}, {"left": "أَلْعَبُ", "right": "I play"}], "status": "correct"}], "feedback": "Words for talking about childhood."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise04.order_school: {"instruction": "Put the words in order to say 'I used to go to school.'", "correct_option": "كُنْتُ أَذْهَبُ إِلَى الْمَدْرَسَة", "accepted_answers": [{"value": "كُنْتُ أَذْهَبُ إِلَى الْمَدْرَسَة", "status": "correct"}], "feedback": "*كُنْتُ* comes first, then the present-tense verb."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise05.complete_kuntu: {"instruction": "Write the form of 'to be' that means 'I was'.", "correct_option": "كُنْتُ", "accepted_answers": [{"value": "كُنْتُ", "status": "correct"}], "feedback": "*كُنْتُ أَلْعَبُ* = I used to play."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise06.translate_city: {"instruction": "Translate into Arabic.", "correct_option": "كُنَّا نَسْكُنُ فِي الْمَدِينَة.", "accepted_answers": [{"value": "كُنَّا نَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "كُنَّا نَسْكُنُ فِي الْمَدِينَة", "status": "correct"}], "feedback": "*كُنَّا نَسْكُنُ* = we used to live."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson01.exercise07.write_yusuf_school: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَ يُوسُف يَذْهَبُ إِلَى الْمَدْرَسَة.", "accepted_answers": [{"value": "كَانَ يُوسُف يَذْهَبُ إِلَى الْمَدْرَسَة.", "status": "correct"}, {"value": "كَانَ يُوسُف يَذْهَبُ إِلَى الْمَدْرَسَة", "status": "correct"}, {"value": "يُوسُف كَانَ يَذْهَبُ إِلَى الْمَدْرَسَة.", "status": "correct"}, {"value": "يُوسُف كَانَ يَذْهَبُ إِلَى الْمَدْرَسَة", "status": "correct"}], "feedback": "*كَانَ* and *يَذْهَبُ* both agree with Yusuf (he)."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise01.choose_grandfather: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ جَدِّي يَعْمَلُ كُلَّ يَوْم.", "distractors": ["كَانَ جَدِّي يَعْمَلُ أَحْيَانًا.", "كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ يَوْم.", "كَانَ جَدِّي يَأْكُلُ كُلَّ يَوْم."], "accepted_answers": [{"value": "كَانَ جَدِّي يَعْمَلُ كُلَّ يَوْم.", "status": "correct"}], "feedback": "*كُلَّ يَوْم* = every day; *أَحْيَانًا* = sometimes."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise02.choose_they_play: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانُوا يَلْعَبُونَ كُلَّ يَوْم.", "distractors": ["كَانَ يَلْعَبُ كُلَّ يَوْم.", "كُنَّا نَلْعَبُ كُلَّ يَوْم.", "كَانُوا يَلْعَبُونَ أَحْيَانًا."], "accepted_answers": [{"value": "كَانُوا يَلْعَبُونَ كُلَّ يَوْم.", "status": "correct"}], "feedback": "'They' = *كَانُوا* + *يَلْعَبُونَ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise03.match_frequency: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "كُلَّ يَوْم", "right": "every day"}, {"left": "كُلَّ صَبَاح", "right": "every morning"}, {"left": "دَائِمًا", "right": "always"}, {"left": "أَحْيَانًا", "right": "sometimes"}, {"left": "جَدِّي", "right": "my grandfather"}, {"left": "جَدَّتِي", "right": "my grandmother"}], "status": "correct"}], "feedback": "Frequency and family words."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise04.order_read_morning: {"instruction": "Put the words in order to say 'We used to play every morning.'", "correct_option": "كُنَّا نَلْعَبُ كُلَّ صَبَاح", "accepted_answers": [{"value": "كُنَّا نَلْعَبُ كُلَّ صَبَاح", "status": "correct"}, {"value": "كُلَّ صَبَاح كُنَّا نَلْعَبُ", "status": "correct"}], "feedback": "*كُلَّ صَبَاح* can also open the sentence."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise05.complete_play_they: {"instruction": "Write the present-tense verb that means 'they play'.", "correct_option": "يَلْعَبُونَ", "accepted_answers": [{"value": "يَلْعَبُونَ", "status": "correct"}], "feedback": "*يَلْعَبُونَ* = they play."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise06.translate_grandma: {"instruction": "Translate into Arabic.", "correct_option": "كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ صَبَاح.", "accepted_answers": [{"value": "كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ صَبَاح.", "status": "correct"}, {"value": "كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ صَبَاح", "status": "correct"}, {"value": "كُلَّ صَبَاح كَانَتْ جَدَّتِي تَقْرَأُ.", "status": "correct"}, {"value": "كُلَّ صَبَاح كَانَتْ جَدَّتِي تَقْرَأُ", "status": "correct"}], "feedback": "*كَانَتْ ... تَقْرَأُ* = she used to read."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson02.exercise07.write_always_play: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كُنَّا دَائِمًا نَلْعَبُ فِي الْقَرْيَة.", "accepted_answers": [{"value": "كُنَّا دَائِمًا نَلْعَبُ فِي الْقَرْيَة.", "status": "correct"}, {"value": "كُنَّا دَائِمًا نَلْعَبُ فِي الْقَرْيَة", "status": "correct"}, {"value": "كُنَّا نَلْعَبُ فِي الْقَرْيَة دَائِمًا.", "status": "correct"}, {"value": "كُنَّا نَلْعَبُ فِي الْقَرْيَة دَائِمًا", "status": "correct"}, {"value": "كُنَّا نَلْعَبُ دَائِمًا فِي الْقَرْيَة.", "status": "correct"}, {"value": "كُنَّا نَلْعَبُ دَائِمًا فِي الْقَرْيَة", "status": "correct"}], "feedback": "*دَائِمًا* stays near *كُنَّا*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise01.choose_house_small: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ الْبَيْت صَغِيرًا.", "distractors": ["كَانَ الْبَيْت كَبِيرًا.", "الْبَيْت صَغِير الْآن.", "كَانَ الْبَيْت قَدِيمًا."], "accepted_answers": [{"value": "كَانَ الْبَيْت صَغِيرًا.", "status": "correct"}], "feedback": "*كَانَ الْبَيْت صَغِيرًا* = the house was small."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise02.choose_city_now: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "الْآن الْمَدِينَة مُزْدَحِمَة.", "distractors": ["كَانَتِ الْمَدِينَة مُزْدَحِمَةً.", "الْآن الْقَرْيَة مُزْدَحِمَة.", "الْآن الْمَدِينَة هَادِئَة."], "accepted_answers": [{"value": "الْآن الْمَدِينَة مُزْدَحِمَة.", "status": "correct"}], "feedback": "No *كَانَ* in the present."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise03.match_adjectives: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "صَغِير", "right": "small"}, {"left": "كَبِير", "right": "big"}, {"left": "هَادِئ", "right": "quiet"}, {"left": "مُزْدَحِم", "right": "crowded"}, {"left": "قَدِيم", "right": "old"}, {"left": "الْآن", "right": "now"}], "status": "correct"}], "feedback": "Describing words for then and now."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise04.order_quiet_village: {"instruction": "Put the words in order to say 'The village was quiet.'", "correct_option": "كَانَتِ الْقَرْيَة هَادِئَةً", "accepted_answers": [{"value": "كَانَتِ الْقَرْيَة هَادِئَةً", "status": "correct"}], "feedback": "Feminine noun, so *كَانَتِ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise05.complete_kana_house: {"instruction": "Write the form of 'to be' that means 'was' (masculine).", "correct_option": "كَانَ", "accepted_answers": [{"value": "كَانَ", "status": "correct"}], "feedback": "*كَانَ الْبَيْت* = the house was."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise06.translate_then_now: {"instruction": "Translate into Arabic.", "correct_option": "فِي الْمَاضِي كُنْتُ أَسْكُنُ فِي الْقَرْيَة، لَكِنِّي الْآن أَسْكُنُ فِي الْمَدِينَة.", "accepted_answers": [{"value": "فِي الْمَاضِي كُنْتُ أَسْكُنُ فِي الْقَرْيَة، لَكِنِّي الْآن أَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "فِي الْمَاضِي كُنْتُ أَسْكُنُ فِي الْقَرْيَة، لَكِنِّي الْآن أَسْكُنُ فِي الْمَدِينَة", "status": "correct"}, {"value": "فِي الْمَاضِي كُنْتُ أَسْكُنُ فِي الْقَرْيَة لَكِنِّي الْآن أَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "فِي الْمَاضِي كُنْتُ أَسْكُنُ فِي الْقَرْيَة لَكِنِّي الْآن أَسْكُنُ فِي الْمَدِينَة", "status": "correct"}], "feedback": "*كُنْتُ أَسْكُنُ* (past habit) against *أَسْكُنُ* (now)."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson03.exercise07.write_big_house: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَ الْبَيْت كَبِيرًا.", "accepted_answers": [{"value": "كَانَ الْبَيْت كَبِيرًا.", "status": "correct"}, {"value": "كَانَ الْبَيْت كَبِيرًا", "status": "correct"}], "feedback": "*كَبِيرًا* agrees with the masculine *الْبَيْت*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise01.choose_where_live: {"instruction": "Choose the correct Arabic question.", "correct_option": "أَيْنَ كُنْتَ تَسْكُنُ؟", "distractors": ["أَيْنَ كَانَ يَسْكُنُ؟", "أَيْنَ تَسْكُنُ الْآن؟", "مَعَ مَنْ كُنْتَ تَسْكُنُ؟"], "accepted_answers": [{"value": "أَيْنَ كُنْتَ تَسْكُنُ؟", "status": "correct"}], "feedback": "*أَيْنَ* = where; *كُنْتَ تَسْكُنُ* = you (masc.) used to live."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise02.choose_play_friends: {"instruction": "Choose the correct Arabic answer.", "correct_option": "نَعَمْ، كُنْتُ أَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي.", "distractors": ["نَعَمْ، كُنْتُ أَسْكُنُ هُنَاكَ مَعَ أَصْدِقَائِي.", "نَعَمْ، كُنَّا نَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي.", "نَعَمْ، كَانَ يَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي."], "accepted_answers": [{"value": "نَعَمْ، كُنْتُ أَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي.", "status": "correct"}], "feedback": "I = *كُنْتُ أَلْعَبُ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise03.match_questions: {"instruction": "Match each Arabic phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "أَيْنَ", "right": "where"}, {"left": "مَعَ مَنْ", "right": "with whom"}, {"left": "هُنَاكَ", "right": "there"}, {"left": "مَعَ أَصْدِقَائِي", "right": "with my friends"}, {"left": "كُنْتَ تَلْعَبُ", "right": "you (masc.) used to play"}, {"left": "كُنْتِ تَلْعَبِينَ", "right": "you (fem.) used to play"}], "status": "correct"}], "feedback": "Questions about the past."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise04.order_where_live_f: {"instruction": "Put the words in order to ask a woman 'Where did you use to live?'", "correct_option": "أَيْنَ كُنْتِ تَسْكُنِينَ", "accepted_answers": [{"value": "أَيْنَ كُنْتِ تَسْكُنِينَ", "status": "correct"}], "feedback": "Question word, *كَانَ*, then the verb."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise05.complete_play_fem: {"instruction": "Write the present-tense verb that means 'you (fem.) play'.", "correct_option": "تَلْعَبِينَ", "accepted_answers": [{"value": "تَلْعَبِينَ", "status": "correct"}], "feedback": "*تَلْعَبِينَ* = you (fem.) play."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise06.translate_where_play: {"instruction": "Translate into Arabic.", "correct_option": "أَيْنَ كُنْتَ تَلْعَبُ؟", "accepted_answers": [{"value": "أَيْنَ كُنْتَ تَلْعَبُ؟", "status": "correct"}, {"value": "أَيْنَ كُنْتَ تَلْعَبُ", "status": "correct"}], "feedback": "Use *كُنْتَ تَلْعَبُ* for a man and *كُنْتِ تَلْعَبِينَ* for a woman."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson04.exercise07.write_yes_play: {"instruction": "Write the requested Arabic sentence.", "correct_option": "نَعَمْ، كُنْتُ أَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي.", "accepted_answers": [{"value": "نَعَمْ، كُنْتُ أَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي.", "status": "correct"}, {"value": "نَعَمْ، كُنْتُ أَلْعَبُ هُنَاكَ مَعَ أَصْدِقَائِي", "status": "correct"}], "feedback": "A full answer with the same verbs as the question."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise01.read_where: {"instruction": "Read the text and choose the answer.", "correct_option": "In a quiet village.", "distractors": ["In a big city.", "In a crowded town.", "Near the station."], "accepted_answers": [{"value": "In a quiet village.", "status": "correct"}], "feedback": "*كُنْتُ أَسْكُنُ فِي الْقَرْيَة.*"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise02.read_grandmother: {"instruction": "Read the text and choose the answer.", "correct_option": "She read.", "distractors": ["She worked.", "She played with Yusuf.", "She went to school."], "accepted_answers": [{"value": "She read.", "status": "correct"}], "feedback": "*كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ يَوْم.*"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise03.match_text: {"instruction": "Match each Arabic sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "right": "I used to live in the village."}, {"left": "كَانَ بَيْت جَدِّي صَغِيرًا.", "right": "My grandfather's house was small."}, {"left": "كُنْتُ أَلْعَبُ مَعَ أَصْدِقَائِي.", "right": "I used to play with my friends."}, {"left": "كَانَ جَدِّي يَعْمَلُ.", "right": "My grandfather used to work."}, {"left": "الْآن أَسْكُنُ فِي الْمَدِينَة.", "right": "Now I live in the city."}, {"left": "الْمَدِينَة مُزْدَحِمَة.", "right": "The city is crowded."}], "status": "correct"}], "feedback": "Sentences from Yusuf's text."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise04.order_school_morning: {"instruction": "Put the words in order to say 'I used to go to school every morning.'", "correct_option": "كُنْتُ أَذْهَبُ إِلَى الْمَدْرَسَة كُلَّ صَبَاح", "accepted_answers": [{"value": "كُنْتُ أَذْهَبُ إِلَى الْمَدْرَسَة كُلَّ صَبَاح", "status": "correct"}], "feedback": "Habit: *كُنْتُ* + *أَذْهَبُ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise05.translate_when_small: {"instruction": "Translate into Arabic.", "correct_option": "عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "accepted_answers": [{"value": "عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "status": "correct"}, {"value": "عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي الْقَرْيَة", "status": "correct"}, {"value": "عِنْدَمَا كُنْتُ صَغِيرَةً كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "status": "correct"}, {"value": "عِنْدَمَا كُنْتُ صَغِيرَةً كُنْتُ أَسْكُنُ فِي الْقَرْيَة", "status": "correct"}], "feedback": "A woman says *صَغِيرَةً*; a man says *صَغِيرًا*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise06.dictation_small: {"instruction": "Type what you hear.", "correct_response": "عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "orthography_strict": true, "feedback": "You heard *عِنْدَمَا كُنْتُ صَغِيرًا كُنْتُ أَسْكُنُ فِي الْقَرْيَة.*"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson05.exercise07.dictation_grandmother: {"instruction": "Type what you hear.", "correct_response": "كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ يَوْم.", "orthography_strict": true, "feedback": "You heard *كَانَتْ جَدَّتِي تَقْرَأُ كُلَّ يَوْم.*"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise01.listen_open: {"instruction": "Listen and select Layla's opening question.", "correct_option": "أَيْنَ كُنْتَ تَسْكُنُ عِنْدَمَا كُنْتَ صَغِيرًا؟", "distractors": ["أَيْنَ كُنْتَ تَلْعَبُ عِنْدَمَا كُنْتَ صَغِيرًا؟", "مَعَ مَنْ كُنْتَ تَسْكُنُ عِنْدَمَا كُنْتَ صَغِيرًا؟", "أَيْنَ تَسْكُنُ الْآن؟"], "accepted_answers": [{"value": "أَيْنَ كُنْتَ تَسْكُنُ عِنْدَمَا كُنْتَ صَغِيرًا؟", "status": "correct"}], "feedback": "Layla asks *أَيْنَ كُنْتَ تَسْكُنُ ...؟*"}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise02.comprehend_who: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "With his grandparents.", "distractors": ["With his parents.", "With his friends.", "With Layla."], "accepted_answers": [{"value": "With his grandparents.", "status": "correct"}], "feedback": "Yusuf says he lived with his grandfather and grandmother."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise03.match_dialogue: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "أَيْنَ كُنْتَ تَسْكُنُ؟", "right": "Where did you use to live?"}, {"left": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة.", "right": "I used to live in the village."}, {"left": "هَلْ كُنْتَ تَلْعَبُ هُنَاكَ؟", "right": "Did you use to play there?"}, {"left": "كُنْتُ أَلْعَبُ كُلَّ يَوْم.", "right": "I used to play every day."}, {"left": "كَانَتْ مُزْدَحِمَةً.", "right": "It was crowded."}, {"left": "نَحْنُ نَسْكُنُ فِي الْمَدِينَة.", "right": "We live in the city."}], "status": "correct"}], "feedback": "Past habits and the present contrast."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise04.order_play_there: {"instruction": "Put the words in order to ask 'Did you (masc.) use to play there?'", "correct_option": "هَلْ كُنْتَ تَلْعَبُ هُنَاكَ", "accepted_answers": [{"value": "هَلْ كُنْتَ تَلْعَبُ هُنَاكَ", "status": "correct"}], "feedback": "*هَلْ* first."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise05.respond_where_live: {"instruction": "Answer in Arabic: say you used to live in the village with your grandfather and grandmother.", "correct_option": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة مَعَ جَدِّي وَجَدَّتِي.", "accepted_answers": [{"value": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة مَعَ جَدِّي وَجَدَّتِي.", "status": "correct"}, {"value": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة مَعَ جَدِّي وَجَدَّتِي", "status": "correct"}], "feedback": "Habit in the past: *كُنْتُ أَسْكُنُ*."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise06.translate_now_city: {"instruction": "Translate into Arabic.", "correct_option": "الْآن نَحْنُ نَسْكُنُ فِي الْمَدِينَة.", "accepted_answers": [{"value": "الْآن نَحْنُ نَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "الْآن نَحْنُ نَسْكُنُ فِي الْمَدِينَة", "status": "correct"}, {"value": "الْآن نَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "الْآن نَسْكُنُ فِي الْمَدِينَة", "status": "correct"}, {"value": "نَحْنُ الْآن نَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "نَحْنُ الْآن نَسْكُنُ فِي الْمَدِينَة", "status": "correct"}], "feedback": "*نَحْنُ* may be dropped: the prefix *نَ* already means 'we'."}
  ar.a2.unit69.kayfa_kanat_alhayat.lesson06.exercise07.write_three: {"instruction": "Write exactly three Arabic sentences, following the numbered requirements in the prompt.", "correct_option": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة. كُنْتُ أَلْعَبُ كُلَّ يَوْم. الْآن أَسْكُنُ فِي الْمَدِينَة.", "accepted_answers": [{"value": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة. كُنْتُ أَلْعَبُ كُلَّ يَوْم. الْآن أَسْكُنُ فِي الْمَدِينَة.", "status": "correct"}, {"value": "كُنْتُ أَسْكُنُ فِي الْقَرْيَة. كُنْتُ أَلْعَبُ كُلَّ يَوْم. الْآن أَسْكُنُ فِي الْمَدِينَة", "status": "correct"}], "feedback": "Two past habits and one present fact."}
