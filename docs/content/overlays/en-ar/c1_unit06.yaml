  notes: 'Overlay for Arabic C1 unit 06; verify English glosses and Arabic accepted strings. Review 2026-10-19: 9 fixes - 36 move-card titles/glosses glossed the Arabic label with its example sentence (now the label''s own meaning, example moved to note); hamza-less spellings normalised (label أثر الأسلوب, أقوى, أن) in tested text/tiles/models/titles (hamza-less forms kept as accepted answers); lesson03/06 calque ''المشروع يسير على خيط رفيع بسبب الوقت'' replaced by the established idiom ''المشروع معلق بخيط رفيع بسبب ضيق الوقت'' (English ''hanging by a thread because time is short'') everywhere; lesson04 English gloss ''We say he takes a decision, not he makes a decision'' was confusing in English - now names the two Arabic verbs with transliteration; lesson04 word_order cut mid-clause at ''في'' and lesson06 word_order cut at ''يسير على'' (both now complete sentences); fixed ''.?'' typo in lesson06 recognize prompt; replaced ''unit model'' wording and made the matching instruction describe the label-to-example task; added SVO accepted variants for lessons 01-02. NATIVE FLAGS: ملازمة طبيعية as the label for ''collocation'' (standard term is التلازم اللفظي / المتلازمات اللفظية); the lesson04 claim that one does not say يصنع قرارا (صنع القرار is common MSA for ''decision-making''; the contrast holds only for the verb phrase).'
