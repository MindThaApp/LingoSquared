review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the life-experience unit (hal sabaqa an, counting times, lam plus the jussive with qattu, bi-l-fi'l and ba'du). OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit71.hal_sabaqa_an: {"title": "Have you ever travelled?", "description": "Ask and say what you have or have never done, with hal sabaqa an plus the past tense, how many times, lam plus the short present form with qattu, and already or not yet."}
lessons:
  ar.a2.unit71.hal_sabaqa_an.lesson01.hal_sabaqa: {"title": "Have you ever?"}
  ar.a2.unit71.hal_sabaqa_an.lesson02.kam_marra: {"title": "How many times?"}
  ar.a2.unit71.hal_sabaqa_an.lesson03.lam_qattu: {"title": "Never"}
  ar.a2.unit71.hal_sabaqa_an.lesson04.already_not_yet: {"title": "Already or not yet"}
  ar.a2.unit71.hal_sabaqa_an.lesson05.reading_yusuf: {"title": "Yusuf travels"}
  ar.a2.unit71.hal_sabaqa_an.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit71.hal_sabaqa_an.lesson01.teach.places: {"title": "Places and transport", "gloss": "Egypt / Lebanon / the plane / the train", "example_gloss": ["I visited Egypt.", "I took the plane."]}
  ar.a2.unit71.hal_sabaqa_an.lesson01.teach.verbs: {"title": "Verbs of travel", "gloss": "he visited / he travelled / he took (a vehicle) / he went", "example_gloss": ["I travelled to Lebanon.", "I went to Egypt.", "I took the train."]}
  ar.a2.unit71.hal_sabaqa_an.lesson01.teach.gn_hal_sabaqa: {"title": "Have you ever...?", "gloss": "Have you (masc.) ever visited Egypt? Have you (fem.) ever visited Egypt? Have we ever visited Egypt?", "note": "*هَلْ سَبَقَ أَنْ* ('has it ever happened that') never changes. The verb after *أَنْ* is the past tense in the right person: -ta for a man, -ti for a woman."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.teach.gn_more: {"title": "More questions", "gloss": "Have you (masc.) ever taken a plane? Have you (masc.) ever been to Egypt? Have you (fem.) ever been to Egypt? Have you (masc.) ever travelled?", "note": "The same frame works with every verb."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.teach.gn_answer: {"title": "Answering", "gloss": "Yes, I have visited Egypt. Yes, I visited Egypt.", "note": "A short answer drops *سَبَقَ أَنْ* and simply uses the past tense."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.teach.counts: {"title": "Counting times", "gloss": "once / twice / three times / many times / how many times", "example_gloss": ["I visited Egypt twice.", "I travelled three times."]}
  ar.a2.unit71.hal_sabaqa_an.lesson02.teach.gn_kam: {"title": "Asking how many times", "gloss": "How many times have you visited Egypt? I have visited Egypt three times.", "note": "*كَمْ مَرَّة* opens the question. The number goes after the verb: *مَرَّة وَاحِدَة*, *مَرَّتَيْنِ* (a special dual form), then *ثَلَاث مَرَّات* and up."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.teach.gn_many: {"title": "A few more times", "gloss": "I have taken the plane many times. I have taken the train once.", "note": "*مَرَّات* is the plural of *مَرَّة*; with 3 to 10 it is used after the number."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.teach.never: {"title": "Never", "gloss": "ever, at all (with a negative) / did not, has not / never (in answers)", "example_gloss": ["I have never visited Egypt.", "I have never taken a plane."]}
  ar.a2.unit71.hal_sabaqa_an.lesson03.teach.gn_lam: {"title": "لَمْ + short present form", "gloss": "I did not visit, I did not go, I did not take the plane.", "note": "After *لَمْ* the present-tense verb loses its final vowel (it ends in a sukun): *أَذْهَبُ* becomes *لَمْ أَذْهَبْ*. This negates the past. A middle long vowel shortens too (*أَزُورُ* becomes *لَمْ أَزُرْ*), and before *ال* a helping kasra appears (*أَرْكَبِ*)."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.teach.gn_lam_forms: {"title": "لَمْ with every person", "gloss": "I did not go, you (masc.) did not go, you (fem.) did not go, he did not go, she did not go, we did not go, they did not go", "note": "The ending -īna of the feminine 'you' and -ūna of 'they' lose their final *n*: *تَذْهَبِينَ* gives *لَمْ تَذْهَبِي*, and *يَذْهَبُونَ* gives *لَمْ يَذْهَبُوا*."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.teach.gn_qattu: {"title": "Never: لَمْ ... قَطُّ", "gloss": "She has never gone to Lebanon. Yusuf has never visited Lebanon.", "note": "*قَطُّ* comes at the end and strengthens the negative: 'never in my life'."}
  ar.a2.unit71.hal_sabaqa_an.lesson04.teach.already: {"title": "Already and not yet", "gloss": "already / yet (in a negative sentence) / the film / he watched", "example_gloss": ["I have already watched the film.", "I have not watched the film yet."]}
  ar.a2.unit71.hal_sabaqa_an.lesson04.teach.gn_already: {"title": "Already: بِالْفِعْل", "gloss": "Have you already watched the film? Yes, I have already watched the film.", "note": "*بِالْفِعْل* ('in fact') stands at the end for 'already'."}
  ar.a2.unit71.hal_sabaqa_an.lesson04.teach.gn_not_yet: {"title": "Not yet: لَمْ ... بَعْدُ", "gloss": "No, I have not watched the film yet. I have not watched. I have not travelled yet.", "note": "For 'not yet' use *لَمْ* + short present form and end with *بَعْدُ*; compare *قَطُّ* for 'never'."}
  ar.a2.unit71.hal_sabaqa_an.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "a lot / Tunisia / the sea", "example_gloss": ["I have travelled a lot.", "I have never visited Tunisia."]}
  ar.a2.unit71.hal_sabaqa_an.lesson05.teach.gn_wa: {"title": "Two experiences", "gloss": "I have visited Egypt twice and Lebanon three times.", "note": "Repeat the verb after *وَ* for the second place."}
  ar.a2.unit71.hal_sabaqa_an.lesson05.teach.reading: {"title": "Yusuf talks about his trips", "gloss": "I have travelled a lot. I have visited Egypt twice and Lebanon three times. I have taken the plane many times. But I have never visited Tunisia, and I have not seen the sea there.", "note": "Experiences use the plain past tense; things not done use *لَمْ* + short present form."}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Have you ever travelled, Yusuf?"}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: Yes, I have visited Egypt twice."}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And have you ever visited Lebanon?"}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d4: {"title": "Yusuf explains", "gloss": "Yusuf: Yes, three times. And you?"}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d5: {"title": "Layla says", "gloss": "Layla: I have never visited Lebanon."}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d6: {"title": "Yusuf asks, Layla answers", "gloss": "Yusuf: And you have not taken a plane?"}
  ar.a2.unit71.hal_sabaqa_an.lesson06.teach.d7: {"title": "Layla corrects", "gloss": "Layla: Yes I have, I have taken the plane once."}
exercises:
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise01.choose_have_visited: {"instruction": "Choose the correct Arabic question.", "correct_option": "هَلْ سَبَقَ أَنْ زُرْتَ مِصْر؟", "distractors": ["هَلْ سَبَقَ أَنْ زُرْتَ لُبْنَان؟", "هَلْ سَبَقَ أَنْ رَكِبْتَ الطَّائِرَة؟", "هَلْ سَبَقَ أَنْ زُرْنَا مِصْر؟"], "accepted_answers": [{"value": "هَلْ سَبَقَ أَنْ زُرْتَ مِصْر؟", "status": "correct"}], "feedback": "*هَلْ سَبَقَ أَنْ زُرْتَ مِصْر؟* = have you ever visited Egypt?"}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise02.choose_yes_lebanon: {"instruction": "Choose the correct Arabic answer.", "correct_option": "نَعَمْ، سَافَرْتُ إِلَى لُبْنَان.", "distractors": ["نَعَمْ، سَافَرْتُ إِلَى مِصْر.", "نَعَمْ، رَكِبْتُ الْقِطَار إِلَى لُبْنَان.", "نَعَمْ، سَافَرَ إِلَى لُبْنَان."], "accepted_answers": [{"value": "نَعَمْ، سَافَرْتُ إِلَى لُبْنَان.", "status": "correct"}], "feedback": "*سَافَرْتُ إِلَى لُبْنَان* = I travelled to Lebanon."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise03.match_travel: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "مِصْر", "right": "Egypt"}, {"left": "لُبْنَان", "right": "Lebanon"}, {"left": "الطَّائِرَة", "right": "the plane"}, {"left": "الْقِطَار", "right": "the train"}, {"left": "زَارَ", "right": "he visited"}, {"left": "سَافَرَ", "right": "he travelled"}], "status": "correct"}], "feedback": "Travel words."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise04.order_have_you: {"instruction": "Put the words in order to ask 'Have you (masc.) ever taken a plane?'", "correct_option": "هَلْ سَبَقَ أَنْ رَكِبْتَ الطَّائِرَة", "accepted_answers": [{"value": "هَلْ سَبَقَ أَنْ رَكِبْتَ الطَّائِرَة", "status": "correct"}], "feedback": "*هَلْ سَبَقَ أَنْ* opens the question."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise05.complete_visited_f: {"instruction": "Write the past-tense verb that means 'you (fem.) visited'.", "correct_option": "زُرْتِ", "accepted_answers": [{"value": "زُرْتِ", "status": "correct"}], "feedback": "-ti marks a woman: *زُرْتِ*."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise06.translate_ever_went: {"instruction": "Translate into Arabic.", "correct_option": "هَلْ سَبَقَ أَنْ ذَهَبْتَ إِلَى لُبْنَان؟", "accepted_answers": [{"value": "هَلْ سَبَقَ أَنْ ذَهَبْتَ إِلَى لُبْنَان؟", "status": "correct"}, {"value": "هَلْ سَبَقَ أَنْ ذَهَبْتَ إِلَى لُبْنَان", "status": "correct"}, {"value": "هَلْ سَبَقَ أَنْ زُرْتَ لُبْنَان؟", "status": "correct"}, {"value": "هَلْ سَبَقَ أَنْ زُرْتَ لُبْنَان", "status": "correct"}, {"value": "هَلْ سَبَقَ أَنْ سَافَرْتَ إِلَى لُبْنَان؟", "status": "correct"}, {"value": "هَلْ سَبَقَ أَنْ سَافَرْتَ إِلَى لُبْنَان", "status": "correct"}], "feedback": "Several verbs work. A woman would use -ti."}
  ar.a2.unit71.hal_sabaqa_an.lesson01.exercise07.write_yes_visited: {"instruction": "Write the requested Arabic sentence.", "correct_option": "نَعَمْ، زُرْتُ مِصْر.", "accepted_answers": [{"value": "نَعَمْ، زُرْتُ مِصْر.", "status": "correct"}, {"value": "نَعَمْ، زُرْتُ مِصْر", "status": "correct"}, {"value": "نَعَمْ، سَبَقَ أَنْ زُرْتُ مِصْر.", "status": "correct"}, {"value": "نَعَمْ، سَبَقَ أَنْ زُرْتُ مِصْر", "status": "correct"}], "feedback": "A short answer uses just the past tense."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise01.choose_twice: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "زُرْتُ مِصْر مَرَّتَيْنِ.", "distractors": ["زُرْتُ مِصْر مَرَّة وَاحِدَة.", "زُرْتُ مِصْر ثَلَاث مَرَّات.", "زُرْتُ لُبْنَان مَرَّتَيْنِ."], "accepted_answers": [{"value": "زُرْتُ مِصْر مَرَّتَيْنِ.", "status": "correct"}], "feedback": "*مَرَّتَيْنِ* = twice."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise02.choose_how_many: {"instruction": "Choose the correct Arabic question.", "correct_option": "كَمْ مَرَّة زُرْتَ مِصْر؟", "distractors": ["كَمْ مَرَّة زُرْتَ لُبْنَان؟", "كَمْ مَرَّة رَكِبْتَ الطَّائِرَة؟", "كَمْ مَرَّة زُرْنَا مِصْر؟"], "accepted_answers": [{"value": "كَمْ مَرَّة زُرْتَ مِصْر؟", "status": "correct"}], "feedback": "*كَمْ مَرَّة* = how many times."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise03.match_counts: {"instruction": "Match each Arabic phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "مَرَّة وَاحِدَة", "right": "once"}, {"left": "مَرَّتَيْنِ", "right": "twice"}, {"left": "ثَلَاث مَرَّات", "right": "three times"}, {"left": "مَرَّات كَثِيرَة", "right": "many times"}, {"left": "كَمْ مَرَّة", "right": "how many times"}, {"left": "زُرْتُ", "right": "I visited"}], "status": "correct"}], "feedback": "Counting how often."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise04.order_three_times: {"instruction": "Put the words in order to say 'I travelled three times.'", "correct_option": "سَافَرْتُ ثَلَاث مَرَّات", "accepted_answers": [{"value": "سَافَرْتُ ثَلَاث مَرَّات", "status": "correct"}], "feedback": "Verb first, then the number."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise05.complete_twice: {"instruction": "Write the word that means 'twice'.", "correct_option": "مَرَّتَيْنِ", "accepted_answers": [{"value": "مَرَّتَيْنِ", "status": "correct"}], "feedback": "*مَرَّتَيْنِ* is the dual of *مَرَّة*."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise06.translate_many_times: {"instruction": "Translate into Arabic.", "correct_option": "رَكِبْتُ الطَّائِرَة مَرَّات كَثِيرَة.", "accepted_answers": [{"value": "رَكِبْتُ الطَّائِرَة مَرَّات كَثِيرَة.", "status": "correct"}, {"value": "رَكِبْتُ الطَّائِرَة مَرَّات كَثِيرَة", "status": "correct"}], "feedback": "*مَرَّات كَثِيرَة* = many times."}
  ar.a2.unit71.hal_sabaqa_an.lesson02.exercise07.write_once_train: {"instruction": "Write the requested Arabic sentence.", "correct_option": "رَكِبْتُ الْقِطَار مَرَّة وَاحِدَة.", "accepted_answers": [{"value": "رَكِبْتُ الْقِطَار مَرَّة وَاحِدَة.", "status": "correct"}, {"value": "رَكِبْتُ الْقِطَار مَرَّة وَاحِدَة", "status": "correct"}, {"value": "مَرَّة وَاحِدَة رَكِبْتُ الْقِطَار.", "status": "correct"}, {"value": "مَرَّة وَاحِدَة رَكِبْتُ الْقِطَار", "status": "correct"}], "feedback": "*مَرَّة وَاحِدَة* = once."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise01.choose_never_egypt: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "لَمْ أَزُرْ مِصْر قَطُّ.", "distractors": ["لَمْ أَزُرْ لُبْنَان قَطُّ.", "لَمْ أَرْكَبِ الطَّائِرَة قَطُّ.", "زُرْتُ مِصْر مَرَّتَيْنِ."], "accepted_answers": [{"value": "لَمْ أَزُرْ مِصْر قَطُّ.", "status": "correct"}], "feedback": "*لَمْ أَزُرْ ... قَطُّ* = I have never visited."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise02.choose_she_never: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "لَمْ تَذْهَبْ إِلَى لُبْنَان قَطُّ.", "distractors": ["لَمْ يَذْهَبْ إِلَى لُبْنَان قَطُّ.", "لَمْ نَذْهَبْ إِلَى لُبْنَان قَطُّ.", "لَمْ تَذْهَبْ إِلَى مِصْر قَطُّ."], "accepted_answers": [{"value": "لَمْ تَذْهَبْ إِلَى لُبْنَان قَطُّ.", "status": "correct"}], "feedback": "The prefix *تَ-* shows 'she'."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise03.match_lam: {"instruction": "Match each Arabic phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "لَمْ أَذْهَبْ", "right": "I did not go"}, {"left": "لَمْ تَذْهَبْ", "right": "she did not go"}, {"left": "لَمْ نَذْهَبْ", "right": "we did not go"}, {"left": "لَمْ يَذْهَبُوا", "right": "they did not go"}, {"left": "لَمْ تَذْهَبِي", "right": "you (fem.) did not go"}, {"left": "قَطُّ", "right": "ever, at all"}], "status": "correct"}], "feedback": "The negative of the past with *لَمْ*."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise04.order_never_plane: {"instruction": "Put the words in order to say 'I have never taken a plane.'", "correct_option": "لَمْ أَرْكَبِ الطَّائِرَة قَطُّ", "accepted_answers": [{"value": "لَمْ أَرْكَبِ الطَّائِرَة قَطُّ", "status": "correct"}], "feedback": "*لَمْ* first, *قَطُّ* last."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise05.complete_qattu: {"instruction": "Write the word that means 'ever' in a negative sentence.", "correct_option": "قَطُّ", "accepted_answers": [{"value": "قَطُّ", "status": "correct"}], "feedback": "*قَطُّ* closes a negative sentence."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise06.translate_yusuf_never: {"instruction": "Translate into Arabic.", "correct_option": "لَمْ يَزُرْ يُوسُف لُبْنَان قَطُّ.", "accepted_answers": [{"value": "لَمْ يَزُرْ يُوسُف لُبْنَان قَطُّ.", "status": "correct"}, {"value": "لَمْ يَزُرْ يُوسُف لُبْنَان قَطُّ", "status": "correct"}, {"value": "يُوسُف لَمْ يَزُرْ لُبْنَان قَطُّ.", "status": "correct"}, {"value": "يُوسُف لَمْ يَزُرْ لُبْنَان قَطُّ", "status": "correct"}], "feedback": "Both orders are possible."}
  ar.a2.unit71.hal_sabaqa_an.lesson03.exercise07.write_never_train: {"instruction": "Write the requested Arabic sentence.", "correct_option": "لَمْ أَرْكَبِ الْقِطَار قَطُّ.", "accepted_answers": [{"value": "لَمْ أَرْكَبِ الْقِطَار قَطُّ.", "status": "correct"}, {"value": "لَمْ أَرْكَبِ الْقِطَار قَطُّ", "status": "correct"}], "feedback": "Note the helping kasra: *أَرْكَبِ الْقِطَار*."}
  ar.a2.unit71.hal_sabaqa_an.lesson04.exercise01.choose_already: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "شَاهَدْتُ الْفِيلْم بِالْفِعْل.", "distractors": ["لَمْ أُشَاهِدِ الْفِيلْم بَعْدُ.", "شَاهَدْتُ الْفِيلْم مَرَّتَيْنِ.", "لَمْ أُشَاهِدِ الْفِيلْم قَطُّ."], "accepted_answers": [{"value": "شَاهَدْتُ الْفِيلْم بِالْفِعْل.", "status": "correct"}], "feedback": "*بِالْفِعْل* = already."}
