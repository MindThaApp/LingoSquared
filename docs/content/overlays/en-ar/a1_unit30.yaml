    title: Do you have internet at home?
    gloss: Do you have internet at home?
  ar.a1.unit30.lesson01.teach.astkhdm_hatfy_kl:
    title: I use my phone every day
    gloss: I use my phone every day.
    note: أستخدم (astakhdim) means I use. The ي at the end of هاتفي means my.
  ar.a1.unit30.lesson02.teach.alttbyq:
    title: The app
    gloss: the app
    example_gloss: I have an app for the weather forecast.
  ar.a1.unit30.lesson02.teach.alrsala:
    title: The message
    gloss: the message
    example_gloss: I'll send a message through the app.
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Message: send and read'
    gloss: رسالة (risāla) means a message that you send (أرسل رسالة, ursil risāla) or read (أقرأ رسالة, aqraʾ risāla).
    note: Links the new word to the weather forecast text and to the messages people send and read.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla sends a message through the app
    gloss: Layla sends a message through the app.
    note: 'ترسل (tursil) means she sends: the opening letter ت (ta-) marks she. عبر (ʿabra) means through or via.'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf reads the message
    gloss: Yusuf reads the message.
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: To look up
    gloss: to look up
    example_gloss: I look up the weather forecast.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: A verb with عن
    gloss: 'The verb أبحث (abḥath) is followed by عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). But أستخدم (astakhdim) takes its object directly: أستخدم هاتفي.'
    note: عن (ʿan) means about or for. Each Arabic verb has its own preposition, so learn them together.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim looks up the weather forecast
    gloss: Karim looks up the weather forecast.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Then he goes running
    gloss: Then he goes running.
    note: 'ثم (thumma) means then and is a separate word, unlike و. يذهب للركض (yadhhab li-r-rakḍ) means he goes running: ل + الركض becomes للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla proposes
    gloss: 'Layla: Shall we exercise Saturday at ten?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf agrees
    gloss: 'Yusuf: Good idea! I''ll look up the weather forecast.'
    note: 'فكرة جيدة (fikra jayyida): the adjective جيدة ends in ة like the noun, because both are feminine. سأبحث (sa-abḥath) is the future: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf checks the weather
    gloss: 'Yusuf: It''s sunny on Saturday!'
    note: الجو مشمس (al-jaww mushmis) means the weather is sunny, with no word for is. مشمس is masculine to agree with الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim sees the message
    gloss: 'Karim: I see the message. See you Saturday!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + a day
    gloss: 'You know إلى اللقاء (ilā al-liqāʾ, goodbye). You can add a day: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Extends the greetings unit's farewell pattern to a specific day.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Who uses what?
    gloss: Layla calls Yusuf every day. She uses her phone, not an app. Yusuf has no computer at home, but he uses internet on his phone. Karim looks up the weather forecast every morning. Then he goes running. Sara often sends Layla a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
    glosses:
      تتصل: calls
      كل: every
      يوم: day
      تستخدم: uses
      هاتفها: phone
      تطبيقا: app
      حاسوب: computer
      البيت: at home
      الإنترنت: internet
      يبحث: looks up
      صباح: morning
      توقعات: forecast (weather forecast)
      يذهب: goes
      للركض: for running
      ترسل: sends
      كثيرا: often
      رسالة: message
      تستعمل: use
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim looks up the forecast every morning
    gloss: Karim looks up the weather forecast every morning.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Sara often messages Layla
    gloss: Sara often sends Layla a message.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Layla confirms the plan
    gloss: 'Layla: I see the message. Shall we exercise Saturday at ten in the park?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf confirms the weather
    gloss: 'Yusuf: Yes, and it''s sunny on Saturday!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: Karim's plan
    gloss: 'Karim: I''ll run then. Afterward I''ll also play football.'
    note: 'سأركض (sa-arkuḍ) means I will run: س marks the future. بعد ذلك (baʿda dhālik) means afterwards.'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Sara's plan
    gloss: 'Sara: I''d rather swim, but I''m coming to the park too.'
    note: أفضل (ufaḍḍil) means I prefer. لكنني (lākinnanī) means but I, and سآتي (sa-ātī) means I will come.
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla closes the conversation
    gloss: 'Layla: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
