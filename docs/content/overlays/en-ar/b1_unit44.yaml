      - {value: "أذاكر كل يوم حتى أنجح في الامتحان", status: correct}
      - {value: "أذاكر كل يوم حتى أنجح في الامتحان.", status: correct}
    feedback: "*أذاكر كل يوم حتى أنجح في الامتحان.* is the requested sentence."
