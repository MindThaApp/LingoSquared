    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf studies English in order to travel abroad, and studies every day so that he succeeds in the exam."
    distractors: ["Yusuf studies English so that he succeeds in the exam.", "Yusuf does not have any goals for his studying.", "Yusuf studies every day in order to travel abroad."]
    accepted_answers: [{value: "Yusuf studies English in order to travel abroad, and studies every day so that he succeeds in the exam.", status: correct}]
    feedback: "Yusuf links studying English to travel with لكي, and daily study to the exam with حتى."
  ar.b1.unit44.lesson03.exercise03.match_dialogue_ahdaf:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"لماذا تدرس الإنجليزية؟": "Why do you study English?", "أدرس الإنجليزية لكي أسافر إلى الخارج.": "I study English in order to travel abroad.", "ولماذا تذاكر كثيرا؟": "And why do you study so much?", "أذاكر كل يوم حتى أنجح في الامتحان.": "I study every day so that I succeed in the exam.", لماذا: why, كثيرا: "a lot"}
        status: correct
