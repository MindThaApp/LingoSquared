      - {value: "أدرس الإنجليزية لكي أسافر إلى الخارج. أذاكر كل يوم حتى أنجح في الامتحان.", status: correct}
    feedback: "*أدرس الإنجليزية لكي أسافر إلى الخارج. أذاكر كل يوم حتى أنجح في الامتحان.* links both actions to their purposes with لكي and حتى, as required."
