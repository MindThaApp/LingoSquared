    feedback: "*أدرس الإنجليزية لكي أسافر إلى الخارج.* is the requested sentence."
  ar.b1.unit44.lesson02.exercise01.recognize_udhakir_kulla_yawm:
    instruction: "Select the meaning."
    correct_option: "I study every day"
    distractors: ["I studied yesterday", "I never study", "I study once a week"]
    accepted_answers: [{value: "I study every day", status: correct}]
    feedback: "*أذاكر كل يوم* is the action."
  ar.b1.unit44.lesson02.exercise02.recognize_hatta_anjah:
    instruction: "Select the meaning."
