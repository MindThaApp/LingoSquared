exercises:
  ar.b1.unit44.lesson01.exercise01.recognize_adrus_alinjliziyya:
    instruction: "Select the meaning."
    correct_option: "I study English"
    distractors: ["I studied English", "I teach English", "I do not study English"]
    accepted_answers: [{value: "I study English", status: correct}]
    feedback: "*أدرس الإنجليزية* is the action."
  ar.b1.unit44.lesson01.exercise02.recognize_likay_usafir:
    instruction: "Select the meaning."
    correct_option: "In order to travel abroad"
    distractors: ["Because I traveled abroad", "After I travel abroad", "Although I do not travel abroad"]
    accepted_answers: [{value: "In order to travel abroad", status: correct}]
    feedback: "*لكي أسافر إلى الخارج* is the purpose clause."
  ar.b1.unit44.lesson01.exercise03.listen_select_purpose_likay:
    instruction: "Listen and select what Yusuf says."
    correct_option: "I study English in order to travel abroad."
    distractors: ["I studied English because I traveled abroad.", "I study English every day.", "I study French in order to travel abroad."]
    accepted_answers: [{value: "I study English in order to travel abroad.", status: correct}]
    feedback: "You heard *أدرس الإنجليزية لكي أسافر إلى الخارج*."
  ar.b1.unit44.lesson01.exercise04.match_purpose_likay:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {لكي: "in order to", أسافر: "I travel", الخارج: abroad, الإنجليزية: English, "أدرس الإنجليزية": "I study English", "أسافر إلى الخارج": "I travel abroad"}
        status: correct
    feedback: "These phrases cover the action and its purpose."
  ar.b1.unit44.lesson01.exercise05.order_purpose_likay:
    instruction: "Arrange the Arabic words for I study English in order to travel abroad."
    accepted_answers: [{value: [أدرس, الإنجليزية, لكي, أسافر, إلى, الخارج], status: correct}, {value: [لكي, أسافر, إلى, الخارج, أدرس, الإنجليزية], status: correct}]
    feedback: "*أدرس الإنجليزية لكي أسافر إلى الخارج* links the action to its purpose with لكي."
  ar.b1.unit44.lesson01.exercise06.write_purpose_likay:
    instruction: "Write exactly this purpose-clause sentence with لكي + a subjunctive verb: I study English in order to travel abroad."
    accepted_answers:
      - {value: "أدرس الإنجليزية لكي أسافر إلى الخارج", status: correct}
      - {value: "أدرس الإنجليزية لكي أسافر إلى الخارج.", status: correct}
