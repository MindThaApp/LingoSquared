  ar.b1.unit44.lesson03.exercise05.reply_purpose_english:
    instruction: "Nour asks: Why do you study English? Reply as Yusuf, stating your purpose with لكي: you study English in order to travel abroad."
    accepted_answers:
      - {value: "أدرس الإنجليزية لكي أسافر إلى الخارج", status: correct}
      - {value: "أدرس الإنجليزية لكي أسافر إلى الخارج.", status: correct}
      - {value: "لكي أسافر إلى الخارج", status: correct}
    feedback: "*أدرس الإنجليزية لكي أسافر إلى الخارج.* is Yusuf's reply."
