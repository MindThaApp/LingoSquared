  ar.b1.unit44.lesson02.exercise04.match_purpose_hatta:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {حتى: "so that", أنجح: "I succeed", الامتحان: "the exam", "أذاكر كل يوم": "I study every day", "أنجح في الامتحان": "I succeed in the exam", "كل يوم": "every day"}
        status: correct
    feedback: "These phrases cover the action and its purpose."
  ar.b1.unit44.lesson02.exercise05.order_purpose_hatta:
    instruction: "Arrange the Arabic words for I study every day so that I succeed in the exam."
