    distractors: ["أذاكر كل يوم حتى أنجح في الامتحان", "أدرس الإنجليزية كل يوم", "سافرت إلى الخارج أمس"]
    accepted_answers: [{value: "أدرس الإنجليزية لكي أسافر إلى الخارج", status: correct}]
    feedback: "*أدرس الإنجليزية لكي أسافر إلى الخارج* states why Yusuf studies English."
