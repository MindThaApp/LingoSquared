    instruction: "As Yusuf, write two sentences explaining the purpose behind your actions to Nour: why you study English (using لكي + a subjunctive verb: in order to travel abroad), and why you study every day (using حتى + a subjunctive verb: so that you succeed in the exam)."
    accepted_answers:
