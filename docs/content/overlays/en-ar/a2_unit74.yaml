review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings; the subjunctive after an keeps the fatha ending. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit74.hal_yajuzu: {"title": "May I? You must, you may not", "description": "Ask whether something is allowed and state what must be done, what is not allowed and what is not necessary, using yajuzu, yajibu an and la da'i li-an with the subjunctive."}
lessons:
  ar.a2.unit74.hal_yajuzu.lesson01.yajuzu_an: {"title": "May I?"}
  ar.a2.unit74.hal_yajuzu.lesson02.yajibu_an: {"title": "You must"}
  ar.a2.unit74.hal_yajuzu.lesson03.la_yajuz: {"title": "Not allowed, no need"}
  ar.a2.unit74.hal_yajuzu.lesson04.istiara: {"title": "May I borrow?"}
  ar.a2.unit74.hal_yajuzu.lesson05.reading_rules: {"title": "The library rules"}
  ar.a2.unit74.hal_yajuzu.lesson06.dialogue: {"title": "Yusuf and Layla"}
teaching:
  ar.a2.unit74.hal_yajuzu.lesson01.teach.words: {"title": "Library words", "gloss": "the library / here / the coffee / I sit / I enter / I drink", "example_gloss": ["May I sit here?", "May I enter the library?", "May I drink the coffee here?"]}
  ar.a2.unit74.hal_yajuzu.lesson01.teach.gn_yajuzu: {"title": "هَلْ يَجُوزُ أَنْ", "gloss": "May I sit here?", "note": "*يَجُوزُ* means it is allowed. *هَلْ يَجُوزُ أَنْ ...؟* asks for permission. The verb after *أَنْ* ends in *-a*."}
  ar.a2.unit74.hal_yajuzu.lesson01.teach.gn_an: {"title": "After أَنْ: every person", "gloss": "I may sit. You may sit. We may sit.", "note": "After *أَنْ* the verb keeps its person prefix (*أ* I, *ت* you, *ن* we). Only the ending changes from *-u* to *-a*."}
  ar.a2.unit74.hal_yajuzu.lesson02.teach.words: {"title": "Things and actions", "gloss": "the book / the phone / you return / you turn off", "example_gloss": ["You must return the book.", "You must turn off the phone."]}
  ar.a2.unit74.hal_yajuzu.lesson02.teach.gn_yajibu: {"title": "يَجِبُ أَنْ", "gloss": "You must turn off the phone.", "note": "*يَجِبُ أَنْ* means it is necessary that: must. It has the same shape as *يَجُوزُ أَنْ*, but the middle vowel is different: *يَجُوزُ* may, *يَجِبُ* must."}
  ar.a2.unit74.hal_yajuzu.lesson02.teach.gn_pers: {"title": "Must, for each person", "gloss": "I must return the book. You must return the book. We must turn off the phone.", "note": "The verb after *أَنْ* shows who must do it: *أُعِيدَ* I, *تُعِيدَ* you, *نُطْفِئَ* we."}
  ar.a2.unit74.hal_yajuzu.lesson02.teach.gn_contrast: {"title": "May or must?", "gloss": "You may turn off the phone. You must turn off the phone.", "note": "The two sentences differ in one word. *يَجُوزُ* gives permission, *يَجِبُ* gives an obligation."}
  ar.a2.unit74.hal_yajuzu.lesson03.teach.words: {"title": "Verbs and free", "gloss": "you pay / you wait / you speak / free", "example_gloss": ["There is no need to pay.", "Entry is free."]}
  ar.a2.unit74.hal_yajuzu.lesson03.teach.gn_la_yajuz: {"title": "لَا يَجُوزُ أَنْ", "gloss": "You may not drink coffee here.", "note": "*لَا يَجُوزُ أَنْ* says something is not allowed. Put *لَا* before *يَجُوزُ*; the verb after *أَنْ* still ends in *-a*."}
  ar.a2.unit74.hal_yajuzu.lesson03.teach.gn_la_daa: {"title": "لَا دَاعِيَ لِأَنْ", "gloss": "There is no need to pay. There is no need to wait.", "note": "*لَا دَاعِيَ لِأَنْ* says that something is not necessary. *لِأَنْ* is *لِـ* plus *أَنْ*, and the verb ends in *-a*."}
  ar.a2.unit74.hal_yajuzu.lesson03.teach.gn_three: {"title": "Must, not allowed, not necessary", "gloss": "You must turn off the phone. You may not speak here. There is no need to pay.", "note": "Three different rules: *يَجِبُ* is an obligation, *لَا يَجُوزُ* a prohibition, *لَا دَاعِيَ* means you do not have to."}
  ar.a2.unit74.hal_yajuzu.lesson04.teach.words: {"title": "Borrowing and eating", "gloss": "I borrow / you eat / but", "example_gloss": ["May I borrow the book?", "You may not eat here."]}
  ar.a2.unit74.hal_yajuzu.lesson04.teach.gn_borrow: {"title": "Asking and answering", "gloss": "May I borrow the book? Yes, you may, but you must return it.", "note": "Answer a permission question with *نَعَمْ، يَجُوزُ* or *لَا، لَا يَجُوزُ*. The ending *-هُ* on *تُعِيدَهُ* means it."}
  ar.a2.unit74.hal_yajuzu.lesson04.teach.gn_no: {"title": "Saying no", "gloss": "No, you may not eat here.", "note": "The first *لَا* is the answer no, the second belongs to *لَا يَجُوزُ*."}
  ar.a2.unit74.hal_yajuzu.lesson05.teach.text_words: {"title": "Words for the sign", "gloss": "rules / you borrow / three books / or", "example_gloss": ["The library rules.", "You may borrow three books."]}
  ar.a2.unit74.hal_yajuzu.lesson05.teach.reading: {"title": "The sign in the library", "gloss": "The library rules. You must turn off the phone. You may not eat or drink here. You may borrow three books. There is no need to pay.", "note": "A sign with a rule of each kind: must, not allowed, allowed and not necessary."}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: Hello, Layla. May I enter the library now?"}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d2: {"title": "Layla answers", "gloss": "Layla: Yes, you may. But you must turn off the phone."}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d3: {"title": "Yusuf asks more", "gloss": "Yusuf: And may I drink coffee here?"}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d4: {"title": "Layla refuses", "gloss": "Layla: No, you may not drink here."}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d5: {"title": "Yusuf asks about paying", "gloss": "Yusuf: And do I have to pay?"}
  ar.a2.unit74.hal_yajuzu.lesson06.teach.d6: {"title": "Layla reassures him", "gloss": "Layla: No, there is no need to pay. Entry is free."}
