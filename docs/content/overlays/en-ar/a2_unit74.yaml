  ar.a2.unit74.hal_yajuzu.lesson01.exercise06.tr_enter: {"instruction": "Translate into Arabic.", "correct_option": "هَلْ يَجُوزُ أَنْ أَدْخُلَ الْمَكْتَبَة؟", "accepted_answers": [{"value": "هَلْ يَجُوزُ أَنْ أَدْخُلَ الْمَكْتَبَة؟", "status": "correct"}, {"value": "هَلْ يَجُوزُ أَنْ أَدْخُلَ الْمَكْتَبَة", "status": "correct"}], "feedback": "Ask with *هَلْ يَجُوزُ أَنْ*."}
  ar.a2.unit74.hal_yajuzu.lesson01.exercise07.wr_coffee: {"instruction": "Write the requested Arabic sentence.", "correct_option": "هَلْ يَجُوزُ أَنْ أَشْرَبَ الْقَهْوَة هُنَا؟", "accepted_answers": [{"value": "هَلْ يَجُوزُ أَنْ أَشْرَبَ الْقَهْوَة هُنَا؟", "status": "correct"}, {"value": "هَلْ يَجُوزُ أَنْ أَشْرَبَ الْقَهْوَة هُنَا", "status": "correct"}], "feedback": "*أَشْرَبَ* after *أَنْ*."}
