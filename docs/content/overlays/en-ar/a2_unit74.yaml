  ar.a2.unit74.hal_yajuzu.lesson01.exercise03.match_library: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "الْمَكْتَبَة", "right": "the library"}, {"left": "هُنَا", "right": "here"}, {"left": "الْقَهْوَة", "right": "the coffee"}, {"left": "يَجُوزُ", "right": "it is allowed"}, {"left": "أَجْلِسَ", "right": "I sit"}, {"left": "أَدْخُلَ", "right": "I enter"}], "status": "correct"}], "feedback": "Words for asking permission."}
