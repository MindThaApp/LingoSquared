review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) confirmation needed (DRAFT). Confirm every
    English gloss matches idiomatic MSA, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation/joining forms a correct learner would actually produce
    -- Arabic is graded fully byte-strict with zero typo tolerance and
    no internal-punctuation stripping. See the realization file's
    review block for the full priority list.
  notes: >-
    Overlay for ar's third B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English has no single equivalent for the نوعا ما / إلى حد ما
    distinction (both loosely "somewhat") -- kept as two separate,
    equally valid hedges rather than forcing a false distinction; (2)
    the ما...إلا restrictive-emphatic construction has no direct
    English calque (literally "not...except", functionally "nothing
    but / truly") -- glossed by function, not word-for-word; (3) the
    الذي...هو cleft construction reorders information the way English
    "what really pleased me is..." does, but a learner may try to omit
    the copula هو -- flagged in lesson04's note. No sibling-direction
    file (ar-en b2) was consulted.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: express nuance by
    softening (نوعا ما، إلى حد ما، من الممكن أن، في الغالب) or
    strengthening (بالتأكيد، فعلا، حقا، ما...إلا، the الذي...هو cleft)
    a statement, so the same content can be delivered tentatively or
    emphatically, around the everyday scenario of comparing opinions
    about a film.

units:
  ar.b2.unit03.altaleen_waltawkid: {title: "Hedging and Emphasis"}

lessons:
  ar.b2.unit03.lesson01.altaleen_alasasi: {title: "Basic hedging"}
  ar.b2.unit03.lesson02.mazid_min_altaleen: {title: "More hedging"}
  ar.b2.unit03.lesson03.altawkid_alasasi: {title: "Basic emphasis"}
  ar.b2.unit03.lesson04.adawat_tawkid_aqwa: {title: "Stronger emphasis and focus"}
  ar.b2.unit03.lesson05.qiraat_nass_mukhtalit: {title: "Reading a mixed-register text"}
  ar.b2.unit03.lesson06.nafs_alraay_bitaleen_watawkid: {title: "The same opinion, hedged and emphasized"}

teaching:
  ar.b2.unit03.lesson01.teach.alfilm:
    title: "the film"
    gloss: "the film"
    example_gloss: "I watched the film yesterday."
  ar.b2.unit03.lesson01.teach.jayid:
    title: good
    gloss: good
    example_gloss: "This food is good."
  ar.b2.unit03.lesson01.teach.nawan_ma:
    title: "somewhat / kind of"
    gloss: "somewhat / kind of"
    note: "*نوعا ما* softens a claim without retracting it -- 'good, kind of' still means good, just less confidently stated."
  ar.b2.unit03.lesson01.teach.hedge_model1:
    title: "The film is good, somewhat."
    gloss: "The film is good, somewhat."
    note: "The mildest hedge in this unit: the claim (good) is unchanged, only the confidence behind it is softened."
  ar.b2.unit03.lesson01.teach.ila_hadd_ma:
    title: "to some extent"
    gloss: "to some extent"
    note: "*إلى حد ما* is interchangeable with *نوعا ما* as a mild hedge."
  ar.b2.unit03.lesson01.teach.hedge_model2:
    title: "The film is good to some extent."
    gloss: "The film is good to some extent."
  ar.b2.unit03.lesson01.teach.aetaqid_an:
    title: "I think that..."
    gloss: "I think that..."
    note: "*أعتقد أن* frames what follows as your own opinion rather than a stated fact -- itself a mild hedge."
  ar.b2.unit03.lesson01.teach.hedge_model3:
    title: "I think the film is good, but I'm not entirely sure."
    gloss: "I think the film is good, but I'm not entirely sure."
    note: "*لكنني لست متأكدا تماما* openly names the uncertainty -- the strongest hedge in this lesson, explicitly qualifying the claim."
  ar.b2.unit03.lesson01.teach.grammar_taleen_asasi:
    title: "The film is good, somewhat. The film is good to some extent."
    gloss: "The film is good, somewhat. The film is good to some extent."
    note: "Basic hedging softens a claim's FORCE without changing its content: *نوعا ما* and *إلى حد ما* are interchangeable mild hedges added after the claim."

  ar.b2.unit03.lesson02.teach.min_almumkin_an:
    title: "it's possible that..."
    gloss: "it's possible that..."
    note: "*من الممكن أن* is a stronger hedge than *نوعا ما* -- it frames the WHOLE claim as merely possible, not just softened."
  ar.b2.unit03.lesson02.teach.alqissa:
    title: "the story"
    gloss: "the story"
    example_gloss: "The story is long."
  ar.b2.unit03.lesson02.teach.daifa:
    title: weak
    gloss: "weak (feminine form)"
    example_gloss: "The signal is weak here."
  ar.b2.unit03.lesson02.teach.takoun:
    title: "to be (might be, feminine)"
    gloss: "to be / might be (feminine agreement)"
    note: "*تكون* is the feminine counterpart of *يكون*, agreeing with a feminine subject like *القصة*."
    example_gloss: "The story might be complicated."
  ar.b2.unit03.lesson02.teach.possibility_model:
    title: "It's possible that the story is somewhat weak."
    gloss: "It's possible that the story is somewhat weak."
    note: "Two hedges stacked together (*من الممكن أن* + *نوعا ما*) make an even softer claim than either alone."
  ar.b2.unit03.lesson02.teach.fi_alghalib:
    title: "most likely"
    gloss: "most likely / generally"
  ar.b2.unit03.lesson02.teach.probability_model:
    title: "Most likely, the film is good."
    gloss: "Most likely, the film is good."
  ar.b2.unit03.lesson02.teach.grammar_mazid_taleen:
    title: "It's possible that the story is somewhat weak. Most likely, the film is good."
    gloss: "It's possible that the story is somewhat weak. Most likely, the film is good."
    note: "*من الممكن أن* (it's possible that) and *في الغالب* (most likely) hedge the WHOLE claim, a stronger softening than a single tag word like *نوعا ما*."

  ar.b2.unit03.lesson03.teach.biltaakid:
    title: definitely
    gloss: "definitely / certainly"
    example_gloss: "I will definitely come."
  ar.b2.unit03.lesson03.teach.filan:
    title: really
    gloss: "really / actually"
    example_gloss: "This is really useful."
  ar.b2.unit03.lesson03.teach.raie:
    title: wonderful
    gloss: "wonderful / great"
    example_gloss: "The view is wonderful."
  ar.b2.unit03.lesson03.teach.emphasis_model1:
    title: "The film is really good."
    gloss: "The film is really good."
    note: "*فعلا* strengthens the same claim (good) instead of softening it -- the mirror image of *نوعا ما* in lesson01."
  ar.b2.unit03.lesson03.teach.emphasis_model2:
    title: "Definitely, the film is wonderful."
    gloss: "Definitely, the film is wonderful."
  ar.b2.unit03.lesson03.teach.haqqan:
    title: truly
    gloss: truly
    example_gloss: "I am truly happy."
  ar.b2.unit03.lesson03.teach.aajabani:
    title: "it pleased me"
    gloss: "it pleased me / I liked it"
    note: "*أعجبني* literally means 'it pleased me' -- the grammatical subject is the thing liked (*الفيلم أعجبني* = 'the film pleased me' = 'I liked the film')."
    example_gloss: "I liked the food a lot."
  ar.b2.unit03.lesson03.teach.emphasis_model3:
    title: "I truly liked the film."
    gloss: "I truly liked the film."
  ar.b2.unit03.lesson03.teach.grammar_tawkid_asasi:
    title: "The film is really good. Definitely, the film is wonderful. I truly liked the film."
    gloss: "The film is really good. Definitely, the film is wonderful. I truly liked the film."
    note: "Basic emphasis strengthens a claim's FORCE without changing its content: *فعلا*, *بالتأكيد*, and *حقا* all intensify rather than soften."

  ar.b2.unit03.lesson04.teach.illa:
    title: "except / but"
    gloss: "except / but (used with ما for emphasis)"
    example_gloss: "This is nothing but my opinion."
  ar.b2.unit03.lesson04.teach.restriction_model:
    title: "This film is nothing but wonderful."
    gloss: "This film is nothing but wonderful."
    note: "*ما...إلا* (literally 'not...except') is a classic MSA emphatic-restrictive frame -- 'this film is NOT [anything] EXCEPT wonderful' means 'this film is truly, simply wonderful'."
  ar.b2.unit03.lesson04.teach.alladhi:
    title: "that which / what"
    gloss: "that which / what (masculine relative pronoun)"
    example_gloss: "The film that we watched is excellent."
  ar.b2.unit03.lesson04.teach.aajabani_haqqan:
    title: "truly pleased me"
    gloss: "truly pleased me"
  ar.b2.unit03.lesson04.teach.altamthil:
    title: "the acting"
    gloss: "the acting"
    example_gloss: "The acting was strong."
  ar.b2.unit03.lesson04.teach.cleft_model:
    title: "What truly pleased me is the acting."
    gloss: "What truly pleased me is the acting."
    note: "*الذي...هو* is a focus/cleft construction: *الذي أعجبني حقا* (what truly pleased me) + *هو* (is) + *التمثيل* (the acting) -- moves the emphasized element to the front. The copula *هو* is required; don't drop it."
  ar.b2.unit03.lesson04.teach.grammar_tawkid_aqwa:
    title: "The film is good, somewhat. This film is nothing but wonderful. What truly pleased me is the acting."
    gloss: "The film is good, somewhat. This film is nothing but wonderful. What truly pleased me is the acting."
    note: "*ما...إلا* and the *الذي...هو* cleft are the STRONGEST emphasis devices in this unit -- reserved for a claim you want to make impossible to soften."

  ar.b2.unit03.lesson05.teach.nass_mukhtalit:
    title: "Reading: a mixed review of the film"
    gloss: "We watched the film yesterday. I think the story was somewhat slow. But it's possible that was intentional. The acting was really wonderful. Definitely, what truly pleased me is the last scene."
    glosses:
      شاهدنا: "we watched"
      أمس: yesterday
      كانت: "was (feminine)"
      بطيئة: slow
      ذلك: that
      مقصودا: intentional
      كان: "was (masculine)"
      المشهد: "the scene"
      الأخير: "the last"

  ar.b2.unit03.lesson06.teach.ma_rayik_fi:
    title: "What's your opinion of...?"
    gloss: "what's your opinion of...?"
  ar.b2.unit03.lesson06.teach.hal_anti_mutaakida:
    title: "Are you sure?"
    gloss: "are you (fem.) sure?"
    note: "*متأكدة* is the feminine form, addressed to ليلى."
  ar.b2.unit03.lesson06.teach.naam:
    title: "Yes"
    gloss: "Yes"
    example_gloss: "Yes, I agree."
  ar.b2.unit03.lesson06.teach.attafiq_maak_tamaman:
    title: "I agree with you completely."
    gloss: "I agree with you completely."
  ar.b2.unit03.lesson06.teach.dialogue_yusuf_ask:
    title: "Yusuf: What's your opinion of the film?"
    gloss: "Yusuf: What's your opinion of the film?"
  ar.b2.unit03.lesson06.teach.dialogue_layla_hedge:
    title: "Layla: I think the film is good, somewhat."
    gloss: "Layla: I think the film is good, somewhat."
  ar.b2.unit03.lesson06.teach.dialogue_yusuf_check:
    title: "Yusuf: Are you sure?"
    gloss: "Yusuf: Are you sure?"
  ar.b2.unit03.lesson06.teach.dialogue_layla_emphatic:
    title: "Layla: Yes, definitely! The film is really wonderful."
    gloss: "Layla: Yes, definitely! The film is really wonderful."
  ar.b2.unit03.lesson06.teach.dialogue_yusuf_cleft:
    title: "Yusuf: What truly pleased me is the acting."
    gloss: "Yusuf: What truly pleased me is the acting."
  ar.b2.unit03.lesson06.teach.dialogue_layla_agree:
    title: "Layla: I agree with you completely."
    gloss: "Layla: I agree with you completely."
  ar.b2.unit03.lesson06.teach.grammar_nafs_alraay:
    title: "I think the film is good, somewhat. Definitely, the film is really wonderful."
    gloss: "I think the film is good, somewhat. Definitely, the film is really wonderful."
    note: "Same claim (the film is good/wonderful), two force levels: Layla first hedges (*أعتقد أن...نوعا ما*), then -- pressed -- restates it emphatically (*بالتأكيد...فعلا*), with no change in what she actually means."

exercises:
  ar.b2.unit03.lesson01.exercise01.recognize_nawan_ma:
    instruction: "What does this phrase mean?"
