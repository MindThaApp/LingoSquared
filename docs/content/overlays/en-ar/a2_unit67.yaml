teaching:
  ar.a2.unit67.lesson01.teach.tghyyr_almwad_ilghaa:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*تغيير الموعد* (taghyīr al-mawʿid) means to move an appointment to another time. *إلغاء الموعد* (ilghāʾ al-mawʿid) means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  ar.a2.unit67.lesson01.teach.llasf_adhra:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*للأسف* (lil-asaf) is a polite way to give bad news. *عذرا* (ʿudhran) is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  ar.a2.unit67.lesson01.teach.salwn_alhlaqa:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*صالون الحلاقة* (ṣālūn al-ḥilāqa) is the place; *الحلاق* (al-ḥallāq) is the barber, the person.'
    example_gloss: The salon is open from nine to six.
  ar.a2.unit67.lesson01.teach.hl_ymknny_tghyyr:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: A yes/no question starts with *هل*. *يمكنني* ('I can') is followed by a verbal noun, here *تغيير* (changing).
  ar.a2.unit67.lesson01.teach.llasf_la_asttya:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  ar.a2.unit67.lesson01.teach.la_asttya_alhdwr:
    title: Can I ... / I cannot ...
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'To ask permission use *هل يمكنني* + a verbal noun: *هل يمكنني تغيير الموعد؟* To say you are unable, use *لا أستطيع* + a verbal noun: *لا أستطيع الحضور*. The day can come at the end: *لا أستطيع الحضور يوم الخميس*.'
  ar.a2.unit67.lesson02.teach.fy_ywm_akhr:
    title: Another day
    gloss: another day
    note: '*آخر* (ākhar, ''another'') follows the noun and agrees with it: *يوم آخر* (masculine). With a feminine noun it is *أخرى*: *مرة أخرى*.'
    example_gloss: Can it also be on another day?
  ar.a2.unit67.lesson02.teach.hl_ymkn_ywm:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'Arabic puts *يوم* (''day'') before the weekday: *يوم الاثنين* means ''on Monday''.'
  ar.a2.unit67.lesson02.teach.hl_ynasbk_ywm:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*يناسبك* (yunāsibuka) means ''it suits you'': the verb *يناسب* with the ending *ـك* (''you''). Written without vowels it is the same for a man and a woman, and it is polite enough for someone you do not know well.'
  ar.a2.unit67.lesson02.teach.nam_hdha_ynasbny:
    title: Saying yes
    gloss: Yes, that suits me well.
  ar.a2.unit67.lesson02.teach.llasf_la:
    title: Saying no politely
    gloss: Unfortunately not.
  ar.a2.unit67.lesson02.teach.hl_ynasbk_ywm_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: '*يناسب* (''suits'') takes the person as an ending: *يناسبك* (you), *يناسبني* (me). The question starts with *هل*: *هل يناسبك يوم الجمعة؟* The answer *نعم، هذا يناسبني* confirms. A polite refusal is *للأسف لا*.'
  ar.a2.unit67.lesson03.teach.lan_yusfny:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*لأن* (li-anna) joins two parts of a sentence and gives the reason. *يؤسفني* (yuʾsifuni) is a more careful apology than *عذرا*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  ar.a2.unit67.lesson03.teach.alizaaj:
    title: Inconvenience
    gloss: the inconvenience
    note: '*عذرا على الإزعاج* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  ar.a2.unit67.lesson03.teach.la_asttya_alhdwr:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  ar.a2.unit67.lesson03.teach.la_asttya_alhdwr_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  ar.a2.unit67.lesson03.teach.la_asttya_alhdwr_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'After *لأن* (''because'') the reason follows, and a pronoun ending is attached to it: *لأنني* (because I), *لأنك* (because you), *لأنه* (because he). With a noun there is no ending: *لأن الصالون مغلق*. Compare *لكن* (''but''), which starts a contrast.'
  ar.a2.unit67.lesson04.teach.alatfaq_msbqa:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*الاتفاق* (al-ittifāq) is to agree on a time or place together. *مسبقا* (musbaqan) means ''beforehand'' or ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  ar.a2.unit67.lesson04.teach.ywm_alathnyn_fy:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  ar.a2.unit67.lesson04.teach.hl_ymknk_alhdwr:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*هل يمكنك* (''can you'') is polite and works with anyone. It is followed by a verbal noun, here *الحضور* (coming).'
  ar.a2.unit67.lesson04.teach.idhn_arak_ywm:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  ar.a2.unit67.lesson04.teach.idhn_ahdd_mwada:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  ar.a2.unit67.lesson04.teach.ywm_alathnyn_fy_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, say the day first, then *في الساعة* + the ordinal number: *يوم الاثنين في الساعة العاشرة*. In a polite question use *هل يمكنك* + a verbal noun.'
  ar.a2.unit67.lesson05.teach.azyzy_ywsf_tm:
    title: A message from the salon
    gloss: Dear Yusuf, your appointment has been moved. Your new appointment is Monday at ten o'clock. Is this not suitable for you? Then call us a day in advance. We will arrange a new appointment for you. See you Monday! Al-Anaqa Salon
    note: This is a typical short message from a business, so it uses the polite ending *ـك* ('your'). *تم تغيير* means 'has been moved'.
    glosses:
      عزيزي: dear
      يوسف: Yusuf
      موعدك: your (formal)
      موعدا: appointment
      تغيير: moved
      الجديد: new
      الاثنين: Monday
      العاشرة: ten (lit. 'the tenth')
      الساعة: the hour (o'clock)
      مناسب: suitable (in 'is this not suitable for you?')
      هذا: this
      غير: not
      لك: for you (completes 'not suitable for you')
      اتصل: call
      بنا: us
      إذن: then
      قبل: in advance
      سنحدد: make
      ونحن: we
      اللقاء: until, see you
      صالون: hairdresser's
      الأناقة: Al-Anaqa
  ar.a2.unit67.lesson06.teach.salwn_alanaqa_msaa:
    title: The salon answers
    gloss: 'Hairdresser: Al-Anaqa Salon, good afternoon.'
  ar.a2.unit67.lesson06.teach.msaa_alkhyr_mak:
    title: Yusuf explains and asks
    gloss: 'Yusuf: Good afternoon, you are speaking to Yusuf. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  ar.a2.unit67.lesson06.teach.baltakyd_hl_ynasbk:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  ar.a2.unit67.lesson06.teach.llasf_la_lan:
    title: Yusuf suggests Monday
    gloss: 'Yusuf: Unfortunately not, because I have to work. Can it also be Monday?'
  ar.a2.unit67.lesson06.teach.ywm_alathnyn_fy:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  ar.a2.unit67.lesson06.teach.hdha_ynasbny_shkra:
    title: Yusuf accepts and apologises
    gloss: 'Yusuf: That suits me well. Thank you very much and sorry for the inconvenience.'
  ar.a2.unit67.lesson06.teach.la_mshkla_ila:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
