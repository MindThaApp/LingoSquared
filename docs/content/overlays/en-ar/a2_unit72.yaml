review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the past-perfect unit (qad plus past, kana qad plus past, indama, li-dhalika). Understanding is the main aim. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit72.alqitar_qad_ghadar: {"title": "The train had already left", "description": "Explain that something had already happened before a certain point, with kana plus qad plus the past tense, and understand it in short stories (the main aim is recognition)."}
lessons:
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.qad_madi: {"title": "It has already left"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.kuntu_qad: {"title": "I had already"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.indama_wasaltu: {"title": "When I arrived"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.lidhalika: {"title": "That is why"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson05.reading_yusuf: {"title": "Yesterday at the station"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.dialogue: {"title": "Yusuf and Layla"}
teaching:
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.teach.things: {"title": "Places and things", "gloss": "the train / the station / the shop / the party", "example_gloss": ["I arrived at the station.", "The party began."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.teach.verbs: {"title": "Past-tense verbs", "gloss": "he left / he began / he closed / he ate", "example_gloss": ["The train left the station.", "The shop closed.", "I ate the bread."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.teach.gn_qad: {"title": "قَدْ + past tense", "gloss": "The train left. The train has already left.", "note": "*قَدْ* before a past-tense verb stresses that the action is completed: 'has already...'."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.teach.gn_kana_qad: {"title": "كَانَ قَدْ + past tense", "gloss": "The train had already left.", "note": "Put *كَانَ* before the subject and *قَدْ* + the past-tense verb after it. This is the past perfect: an action completed before another moment in the past."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.teach.gn_agree: {"title": "Agreement", "gloss": "The party had already begun. The shop had already closed.", "note": "Both *كَانَ* and the past-tense verb agree with the subject: *كَانَتْ ... بَدَأَتْ* for a feminine subject, *كَانَ ... أَغْلَقَ* for a masculine one."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.teach.people: {"title": "More verbs, more people", "gloss": "he arrived / he went out / we ate", "example_gloss": ["I had already eaten.", "We had already eaten."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.teach.gn_paradigm: {"title": "كَانَ قَدْ with every person", "gloss": "I had eaten, you (masc.) had eaten, you (fem.) had eaten, he had eaten, she had eaten, we had eaten, they had eaten", "note": "Both words change: *كَانَ* gives the person, the past-tense verb repeats it."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.teach.gn_other: {"title": "Other verbs", "gloss": "Yusuf had already gone out. Layla had already arrived.", "note": "When the subject is a name, *كَانَ* stays first and the name follows."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.teach.when: {"title": "When and before that", "gloss": "when / before that / the next", "example_gloss": ["When I arrived at the station, the train had already left.", "I waited for the next train."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.teach.gn_indama_qad: {"title": "Two moments in the past", "gloss": "When I arrived at the station, the train had already left. The train had already left when I arrived. When we arrived, the party had already begun.", "note": "The later moment is in the simple past (*وَصَلْتُ*), the earlier one in *كَانَ قَدْ* + past tense. The two clauses can swap places."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.teach.gn_contrast: {"title": "Compare the order of events", "gloss": "I arrived, then the train left. The train left before that.", "note": "Without *كَانَ قَدْ*, events are told in the order they happened. *قَبْلَ ذَلِكَ* marks an earlier event."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.teach.reasons: {"title": "Because and so", "gloss": "so, that is why / because / but", "example_gloss": ["The train had already left, so I waited for the next train.", "I was late because the train had already left."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.teach.gn_lidhalika: {"title": "Result: لِذَلِكَ", "gloss": "The shop had already closed, so we went home.", "note": "*لِذَلِكَ* introduces the result: first the earlier event, then what you did."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.teach.gn_because: {"title": "Reason: لِأَنَّ", "gloss": "I was late because the train had already left.", "note": "After *لِأَنَّ* a noun follows directly, then the clause with *كَانَ قَدْ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "yesterday / I came back", "example_gloss": ["Yesterday I went to the station.", "I came back home."]}
  ar.a2.unit72.alqitar_qad_ghadar.lesson05.teach.gn_but: {"title": "لَكِنَّ: but", "gloss": "I went to the shop, but it had already closed.", "note": "*لَكِنَّهُ* = but it. *لَكِنَّ* takes the pronoun ending *-hu* (it, masculine) when no noun follows."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson05.teach.reading: {"title": "Yusuf tells what happened", "gloss": "Yesterday I went to the station. When I arrived the train had already left. So I went to the shop, but it had already closed. I came back home and ate bread.", "note": "Two uses of *كَانَ قَدْ* give the earlier events; the rest is told in the simple past."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Why were you late for the party, Yusuf?"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.teach.d2: {"title": "Yusuf explains", "gloss": "Yusuf: I arrived at the station, but the train had already left."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And what did you do?"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.teach.d4: {"title": "Yusuf answers", "gloss": "Yusuf: I waited for the next train. And when I arrived, the party had already begun!"}
  ar.a2.unit72.alqitar_qad_ghadar.lesson06.teach.d5: {"title": "Layla ends", "gloss": "Layla: Yes, we had already eaten."}
exercises:
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise01.choose_train_left: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ الْقِطَار قَدْ غَادَرَ.", "distractors": ["كَانَ الْقِطَار قَدْ وَصَلَ.", "كَانَ الْقِطَار قَدْ أَغْلَقَ.", "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ."], "accepted_answers": [{"value": "كَانَ الْقِطَار قَدْ غَادَرَ.", "status": "correct"}], "feedback": "*كَانَ ... قَدْ غَادَرَ* = had already left."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise02.choose_party_begun: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "distractors": ["كَانَ الْحَفْلَة قَدْ بَدَأَ.", "كَانَتِ الْحَفْلَة قَدْ وَصَلَتْ.", "كَانَ الْمَتْجَر قَدْ أَغْلَقَ."], "accepted_answers": [{"value": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "status": "correct"}], "feedback": "A feminine subject: *كَانَتْ ... قَدْ بَدَأَتْ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise03.match_words: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "الْقِطَار", "right": "the train"}, {"left": "الْمَحَطَّة", "right": "the station"}, {"left": "الْمَتْجَر", "right": "the shop"}, {"left": "الْحَفْلَة", "right": "the party"}, {"left": "غَادَرَ", "right": "he left"}, {"left": "أَغْلَقَ", "right": "he closed"}], "status": "correct"}], "feedback": "Words for the unit."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise04.order_shop_closed: {"instruction": "Put the words in order to say 'The shop had already closed.'", "correct_option": "كَانَ الْمَتْجَر قَدْ أَغْلَقَ", "accepted_answers": [{"value": "كَانَ الْمَتْجَر قَدْ أَغْلَقَ", "status": "correct"}], "feedback": "*كَانَ* + subject + *قَدْ* + verb."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise05.complete_qad: {"instruction": "Write the word that means 'already' before a past-tense verb.", "correct_option": "قَدْ", "accepted_answers": [{"value": "قَدْ", "status": "correct"}], "feedback": "*قَدْ* stresses completion."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise06.translate_party_begun: {"instruction": "Translate into Arabic.", "correct_option": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "accepted_answers": [{"value": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "status": "correct"}, {"value": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ", "status": "correct"}], "feedback": "*كَانَتْ ... قَدْ بَدَأَتْ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson01.exercise07.write_train_left: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَ الْقِطَار قَدْ غَادَرَ الْمَحَطَّة.", "accepted_answers": [{"value": "كَانَ الْقِطَار قَدْ غَادَرَ الْمَحَطَّة.", "status": "correct"}, {"value": "كَانَ الْقِطَار قَدْ غَادَرَ الْمَحَطَّة", "status": "correct"}], "feedback": "*كَانَ* + subject + *قَدْ* + verb + place."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise01.choose_i_had_eaten: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كُنْتُ قَدْ أَكَلْتُ.", "distractors": ["كُنَّا قَدْ أَكَلْنَا.", "كَانَ قَدْ أَكَلَ.", "كُنْتُ قَدْ وَصَلْتُ."], "accepted_answers": [{"value": "كُنْتُ قَدْ أَكَلْتُ.", "status": "correct"}], "feedback": "*كُنْتُ قَدْ أَكَلْتُ* = I had already eaten."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise02.choose_layla_arrived: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَتْ لَيْلَى قَدْ وَصَلَتْ.", "distractors": ["كَانَ يُوسُف قَدْ وَصَلَ.", "كَانَتْ لَيْلَى قَدْ أَكَلَتْ.", "كَانَ يُوسُف قَدْ خَرَجَ."], "accepted_answers": [{"value": "كَانَتْ لَيْلَى قَدْ وَصَلَتْ.", "status": "correct"}], "feedback": "Feminine: *كَانَتْ ... وَصَلَتْ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise03.match_perfect: {"instruction": "Match each Arabic phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "كُنْتُ قَدْ أَكَلْتُ", "right": "I had eaten"}, {"left": "كُنَّا قَدْ أَكَلْنَا", "right": "we had eaten"}, {"left": "كَانُوا قَدْ أَكَلُوا", "right": "they had eaten"}, {"left": "كَانَتْ قَدْ أَكَلَتْ", "right": "she had eaten"}, {"left": "كَانَ قَدْ أَكَلَ", "right": "he had eaten"}, {"left": "كُنْتِ قَدْ أَكَلْتِ", "right": "you (fem.) had eaten"}], "status": "correct"}], "feedback": "The past perfect for every person."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise04.order_yusuf_out: {"instruction": "Put the words in order to say 'Yusuf had already gone out.'", "correct_option": "كَانَ يُوسُف قَدْ خَرَجَ", "accepted_answers": [{"value": "كَانَ يُوسُف قَدْ خَرَجَ", "status": "correct"}], "feedback": "*كَانَ* first, then the subject."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise05.complete_we_had: {"instruction": "Write the past-tense verb that means 'we ate'.", "correct_option": "أَكَلْنَا", "accepted_answers": [{"value": "أَكَلْنَا", "status": "correct"}], "feedback": "*أَكَلْنَا* = we ate."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise06.translate_i_had_eaten: {"instruction": "Translate into Arabic.", "correct_option": "كُنَّا قَدْ أَكَلْنَا.", "accepted_answers": [{"value": "كُنَّا قَدْ أَكَلْنَا.", "status": "correct"}, {"value": "كُنَّا قَدْ أَكَلْنَا", "status": "correct"}], "feedback": "*كُنَّا قَدْ أَكَلْنَا*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson02.exercise07.write_layla_arrived: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَتْ لَيْلَى قَدْ وَصَلَتْ.", "accepted_answers": [{"value": "كَانَتْ لَيْلَى قَدْ وَصَلَتْ.", "status": "correct"}, {"value": "كَانَتْ لَيْلَى قَدْ وَصَلَتْ", "status": "correct"}, {"value": "كَانَتْ قَدْ وَصَلَتْ لَيْلَى.", "status": "correct"}, {"value": "كَانَتْ قَدْ وَصَلَتْ لَيْلَى", "status": "correct"}], "feedback": "Feminine: *كَانَتْ* and *وَصَلَتْ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise01.choose_when_arrived: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "عِنْدَمَا وَصَلْتُ إِلَى الْمَحَطَّة، كَانَ الْقِطَار قَدْ غَادَرَ.", "distractors": ["عِنْدَمَا وَصَلْتُ إِلَى الْمَحَطَّة، غَادَرَ الْقِطَار.", "عِنْدَمَا وَصَلَ الْقِطَار، كُنْتُ قَدْ أَكَلْتُ.", "عِنْدَمَا وَصَلْتُ إِلَى الْمَحَطَّة، كَانَ الْمَتْجَر قَدْ أَغْلَقَ."], "accepted_answers": [{"value": "عِنْدَمَا وَصَلْتُ إِلَى الْمَحَطَّة، كَانَ الْقِطَار قَدْ غَادَرَ.", "status": "correct"}], "feedback": "The train left first: *كَانَ ... قَدْ غَادَرَ*."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise02.choose_before_that: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "غَادَرَ الْقِطَار قَبْلَ ذَلِكَ.", "distractors": ["وَصَلْتُ قَبْلَ ذَلِكَ.", "وَصَلْتُ ثُمَّ غَادَرَ الْقِطَار.", "كَانَ الْقِطَار قَدْ وَصَلَ."], "accepted_answers": [{"value": "غَادَرَ الْقِطَار قَبْلَ ذَلِكَ.", "status": "correct"}], "feedback": "*قَبْلَ ذَلِكَ* = before that."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise03.match_when: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "عِنْدَمَا", "right": "when"}, {"left": "قَبْلَ ذَلِكَ", "right": "before that"}, {"left": "التَّالِي", "right": "the next"}, {"left": "غَادَرَ", "right": "he left"}, {"left": "كُنْتُ قَدْ", "right": "I had already"}, {"left": "كَانَ قَدْ", "right": "he had already"}], "status": "correct"}], "feedback": "Words for ordering two past events."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise04.order_waited_next: {"instruction": "Put the words in order to say 'I waited for the next train.'", "correct_option": "انْتَظَرْتُ الْقِطَار التَّالِي", "accepted_answers": [{"value": "انْتَظَرْتُ الْقِطَار التَّالِي", "status": "correct"}], "feedback": "Verb, object, adjective."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise05.complete_indama: {"instruction": "Write the word that means 'when'.", "correct_option": "عِنْدَمَا", "accepted_answers": [{"value": "عِنْدَمَا", "status": "correct"}], "feedback": "*عِنْدَمَا* introduces the later moment."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise06.translate_when_party: {"instruction": "Translate into Arabic.", "correct_option": "عِنْدَمَا وَصَلْتُ، كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "accepted_answers": [{"value": "عِنْدَمَا وَصَلْتُ، كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ.", "status": "correct"}, {"value": "عِنْدَمَا وَصَلْتُ، كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ", "status": "correct"}, {"value": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ عِنْدَمَا وَصَلْتُ.", "status": "correct"}, {"value": "كَانَتِ الْحَفْلَة قَدْ بَدَأَتْ عِنْدَمَا وَصَلْتُ", "status": "correct"}], "feedback": "Both orders are possible."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson03.exercise07.write_when_shop: {"instruction": "Write the requested Arabic sentence.", "correct_option": "عِنْدَمَا وَصَلْنَا، كَانَ الْمَتْجَر قَدْ أَغْلَقَ.", "accepted_answers": [{"value": "عِنْدَمَا وَصَلْنَا، كَانَ الْمَتْجَر قَدْ أَغْلَقَ.", "status": "correct"}, {"value": "عِنْدَمَا وَصَلْنَا، كَانَ الْمَتْجَر قَدْ أَغْلَقَ", "status": "correct"}, {"value": "كَانَ الْمَتْجَر قَدْ أَغْلَقَ عِنْدَمَا وَصَلْنَا.", "status": "correct"}, {"value": "كَانَ الْمَتْجَر قَدْ أَغْلَقَ عِنْدَمَا وَصَلْنَا", "status": "correct"}], "feedback": "*وَصَلْنَا* = we arrived."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.exercise01.choose_so_waited: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ الْقِطَار قَدْ غَادَرَ، لِذَلِكَ انْتَظَرْتُ الْقِطَار التَّالِي.", "distractors": ["كَانَ الْقِطَار قَدْ غَادَرَ، لِذَلِكَ عُدْنَا إِلَى الْبَيْت.", "كَانَ الْمَتْجَر قَدْ أَغْلَقَ، لِذَلِكَ انْتَظَرْتُ الْقِطَار التَّالِي.", "غَادَرَ الْقِطَار لِأَنَّ انْتَظَرْتُ."], "accepted_answers": [{"value": "كَانَ الْقِطَار قَدْ غَادَرَ، لِذَلِكَ انْتَظَرْتُ الْقِطَار التَّالِي.", "status": "correct"}], "feedback": "*لِذَلِكَ* = so."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.exercise02.choose_late_because: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "تَأَخَّرْتُ لِأَنَّ الْقِطَار كَانَ قَدْ غَادَرَ.", "distractors": ["تَأَخَّرْتُ لِأَنَّ الْمَتْجَر كَانَ قَدْ أَغْلَقَ.", "تَأَخَّرْتُ لِذَلِكَ غَادَرَ الْقِطَار.", "وَصَلْتُ لِأَنَّ الْقِطَار كَانَ قَدْ غَادَرَ."], "accepted_answers": [{"value": "تَأَخَّرْتُ لِأَنَّ الْقِطَار كَانَ قَدْ غَادَرَ.", "status": "correct"}], "feedback": "*لِأَنَّ* = because."}
  ar.a2.unit72.alqitar_qad_ghadar.lesson04.exercise03.match_reasons: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "لِذَلِكَ", "right": "so, that is why"}, {"left": "لِأَنَّ", "right": "because"}, {"left": "تَأَخَّرْتُ", "right": "I was late"}, {"left": "عُدْنَا", "right": "we went back"}, {"left": "الْمَتْجَر", "right": "the shop"}, {"left": "الْقِطَار التَّالِي", "right": "the next train"}], "status": "correct"}], "feedback": "Reasons and results."}
