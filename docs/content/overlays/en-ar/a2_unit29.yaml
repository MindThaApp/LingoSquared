  ar.a2.unit29.lesson02.teach.line07: {title: "Presence instruction", gloss: "The employee says to please be at home at nine o'clock.", note: "This gives the exact time to be present.", example_gloss: "Yes, please be at home at nine o'clock."}
exercises:
  ar.a2.unit29.lesson01.exercise01.recognize_leak:
    instruction: "Select the meaning."
    correct_option: "water leak"
    distractors: [technician, repair, "two days"]
    accepted_answers: [{value: "water leak", status: correct}]
    feedback: "*تسرب ماء* means water leak."
  ar.a2.unit29.lesson01.exercise02.listen_water_leak:
    instruction: "Listen and select what you hear."
    correct_option: "water leak"
    distractors: [technician, "since when", "getting worse"]
    accepted_answers: [{value: "water leak", status: correct}]
    feedback: "You heard *تسرب ماء*."
  ar.a2.unit29.lesson01.exercise03.match_problem_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"تسرب ماء": "water leak", "منذ متى": "since when", يومين: "two days", "تزداد سوءا": "getting worse", فني: technician, إصلاح: repair}
        status: correct
    feedback: "These words cover reporting a problem and its urgency."
  ar.a2.unit29.lesson01.exercise04.order_kitchen_problem:
    instruction: "Arrange the Arabic words for I have a problem in the kitchen, there is a water leak."
    accepted_answers: [{value: [عندي, مشكلة, في, المطبخ, هناك, تسرب, ماء], status: correct}]
    feedback: "*عندي مشكلة في المطبخ، هناك تسرب ماء* reports the problem."
  ar.a2.unit29.lesson01.exercise05.write_problem_report:
    instruction: "Type exactly this formal Arabic sentence: I have a problem in the kitchen; there has been a water leak for two days."
    accepted_answers:
      - {value: "عندي مشكلة في المطبخ، هناك تسرب ماء منذ يومين", status: correct}
      - {value: "عندي مشكلة في المطبخ، هناك تسرب ماء منذ يومين.", status: correct}
      - {value: "عندي مشكلة في المطبخ، وهناك تسرب ماء منذ يومين", status: correct}
    feedback: "*عندي مشكلة في المطبخ، هناك تسرب ماء منذ يومين* is the requested problem report."
  ar.a2.unit29.lesson02.exercise01.recognize_technician:
    instruction: "Select the meaning."
    correct_option: technician
    distractors: [repair, "water leak", "two days"]
    accepted_answers: [{value: technician, status: correct}]
    feedback: "*فني* means technician."
  ar.a2.unit29.lesson02.exercise02.dialogue_repair_timing:
    instruction: "When will the technician come?"
    correct_option: "Tomorrow morning."
    distractors: ["Next Monday.", "This evening.", "Next week."]
    accepted_answers: [{value: "Tomorrow morning.", status: correct}]
    feedback: "The employee says *غدا صباحا*."
  ar.a2.unit29.lesson02.exercise03.match_repair_lines:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"سنرسل فنيا": "We will send a technician", "غدا صباحا": "tomorrow morning", "أحتاج أن أكون في البيت": "I need to be at home", "كن في البيت الساعة التاسعة": "Be at home at nine o'clock", "تسرب ماء": "water leak", "منذ متى": "since when"}
        status: correct
    feedback: "These lines cover the repair timing and presence arrangement."
  ar.a2.unit29.lesson02.exercise04.order_send_technician:
    instruction: "Arrange the Arabic words for We will send a technician tomorrow morning to repair the problem."
    accepted_answers: [{value: [سنرسل, فنيا, غدا, صباحا, لإصلاح, المشكلة], status: correct}]
    feedback: "*سنرسل فنيا غدا صباحا لإصلاح المشكلة* gives the repair plan."
  ar.a2.unit29.lesson02.exercise05.write_full_report:
    instruction: "Write a short formal Arabic message with exactly this content: report a problem in the kitchen, a water leak for two days that is getting worse, and ask when the repair is."
    accepted_answers:
      - {value: "عندي مشكلة في المطبخ. هناك تسرب ماء منذ يومين، والمشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ، هناك تسرب ماء منذ يومين، والمشكلة تزداد سوءا، متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ. هناك تسرب ماء منذ يومين. والمشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ، هناك تسرب ماء منذ يومين. والمشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ. هناك تسرب ماء منذ يومين. المشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ، وهناك تسرب ماء منذ يومين، والمشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
      - {value: "عندي مشكلة في المطبخ، وهناك تسرب ماء منذ يومين، المشكلة تزداد سوءا. متى الإصلاح؟", status: correct}
    feedback: "*عندي مشكلة في المطبخ. هناك تسرب ماء منذ يومين، والمشكلة تزداد سوءا. متى الإصلاح؟* is the requested formal maintenance report."
