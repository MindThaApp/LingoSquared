  ar.a2.unit29.lesson01.teach.since_when: {title: "Since when", gloss: "since when", note: "*منذ متى* asks how long a problem has existed.", example_gloss: "Since when has the leak existed?"}
  ar.a2.unit29.lesson01.teach.two_days: {title: "Two days", gloss: "two days", note: "*يومين* is the dual of يوم (day), meaning two days. This -ayn ending is used after a preposition such as منذ; as a sentence subject the dual is يومان.", example_gloss: "For two days."}
  ar.a2.unit29.lesson01.teach.getting_worse: {title: "Getting worse", gloss: "getting worse", note: "*تزداد سوءا* says a problem is worsening.", example_gloss: "The problem is getting worse."}
