  ar.a2.unit29.lesson02.teach.tomorrow_morning: {title: "Tomorrow morning", gloss: "tomorrow morning", note: "*غدا صباحا* gives the repair timing.", example_gloss: "We will send a technician tomorrow morning to repair the problem."}
