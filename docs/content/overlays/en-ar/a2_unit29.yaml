  ar.a2.unit29.lesson02.teach.be_home_at_nine: {title: "Be home at nine", gloss: "be at home at nine o'clock", note: "*كن في البيت الساعة التاسعة* gives the exact time.", example_gloss: "Please be at home at nine o'clock."}
  ar.a2.unit29.lesson02.teach.when_repair: {title: "When is the repair", gloss: "when is the repair?", note: "*متى الإصلاح؟* asks about repair timing.", example_gloss: "I have a problem in the kitchen. When is the repair?"}
  ar.a2.unit29.lesson02.teach.line01: {title: "Employee greeting", gloss: "The employee greets Yusuf and offers help.", note: "Formal service greeting.", example_gloss: "Good morning, how can I help you?"}
  ar.a2.unit29.lesson02.teach.line02: {title: "Yusuf reports problem", gloss: "Yusuf says there is a water leak in the kitchen.", note: "This states the problem and its location.", example_gloss: "I have a problem in the kitchen, there is a water leak."}
  ar.a2.unit29.lesson02.teach.line03: {title: "Ask duration", gloss: "The employee asks since when the leak has existed.", note: "This checks how long the problem has existed.", example_gloss: "Since when has the leak existed?"}
  ar.a2.unit29.lesson02.teach.line04: {title: "Yusuf gives duration", gloss: "Yusuf says it has been two days, and the problem is getting worse.", note: "This gives the duration and urgency.", example_gloss: "For two days, and the problem is getting worse."}
