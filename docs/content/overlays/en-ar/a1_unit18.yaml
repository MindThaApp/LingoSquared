  ar.a1.unit18.lesson02.teach.line01: {title: "Ask work", gloss: "Layla asks Yusuf about his work.", note: "يا يوسف addresses Yusuf by name.", example_gloss: "What is your work, Yusuf?"}
  ar.a1.unit18.lesson02.teach.line02: {title: "State job", gloss: "Yusuf says he is an engineer.", note: "No separate word for am is needed.", example_gloss: "I am an engineer."}
  ar.a1.unit18.lesson02.teach.line03: {title: "State workplace", gloss: "Yusuf says he works in an office.", note: "أعمل في gives the workplace.", example_gloss: "I work in an office."}
  ar.a1.unit18.lesson02.teach.line04: {title: "Ask activity", gloss: "Layla asks what Yusuf does every day.", note: "This reuses the routine question.", example_gloss: "What do you do every day?"}
