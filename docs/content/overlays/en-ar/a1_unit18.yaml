exercises:
  ar.a1.unit18.lesson01.exercise01.recognize_engineer:
    instruction: "Select the meaning."
    correct_option: engineer
    distractors: [office, train, ticket]
    accepted_answers: [{value: engineer, status: correct}]
    feedback: "مهندس means engineer."
  ar.a1.unit18.lesson01.exercise02.listen_engineer:
    instruction: "Listen and select what you hear."
    correct_option: "I am an engineer."
    distractors: ["I work in an office.", "I am a student.", "I write at work."]
    accepted_answers: [{value: "I am an engineer.", status: correct}]
    feedback: "You heard أنا مهندس."
  ar.a1.unit18.lesson01.exercise03.match_work_words:
    instruction: "Match each Arabic work word with its meaning."
    accepted_answers:
      - value: {عمل: work, مهندس: engineer, مكتب: office}
        status: correct
    feedback: "These words describe basic work."
  ar.a1.unit18.lesson01.exercise04.order_workplace:
    instruction: "Arrange the Arabic words for I work in an office."
    accepted_answers: [{value: [أعمل, في, مكتب], status: correct}]
    feedback: "أعمل في مكتب states the workplace."
  ar.a1.unit18.lesson01.exercise05.write_job:
    instruction: "Type exactly this Arabic job sentence: I am an engineer."
    accepted_answers:
      - {value: "أنا مهندس", status: correct}
      - {value: "أنا مهندس.", status: correct}
    feedback: "أنا مهندس is the requested job sentence."
  ar.a1.unit18.lesson01.exercise06.dictation_engineer: {correct_response: "أنا مهندس.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit18.lesson02.exercise01.recognize_write:
    instruction: "Select the meaning."
    correct_option: "I write"
    distractors: ["I read", "I sleep", "I buy"]
    accepted_answers: [{value: "I write", status: correct}]
    feedback: "أكتب means I write."
  ar.a1.unit18.lesson02.exercise02.dialogue_work:
    instruction: "Where does Yusuf work?"
    correct_option: "In an office."
    distractors: ["In a market.", "At a cafe.", "On a train."]
    accepted_answers: [{value: "In an office.", status: correct}]
    feedback: "Yusuf says أعمل في مكتب."
  ar.a1.unit18.lesson02.exercise03.match_work_lines:
    instruction: "Match each Arabic work sentence with its meaning."
    accepted_answers:
      - value: {"أنا مهندس": "I am an engineer", "أعمل في مكتب": "I work in an office", "أكتب وأقرأ في العمل": "I write and read at work"}
        status: correct
    feedback: "Together these lines describe job, workplace, and activity."
  ar.a1.unit18.lesson02.exercise04.order_activity:
    instruction: "Arrange the Arabic words for I write and read at work."
    accepted_answers: [{value: [أكتب, وأقرأ, في, العمل], status: correct}]
    feedback: "أكتب وأقرأ في العمل gives a simple work activity."
  ar.a1.unit18.lesson02.exercise05.write_work_profile:
    instruction: "Type exactly this Arabic work profile: I am an engineer. I work in an office. I write at work."
    accepted_answers:
      - {value: "أنا مهندس. أعمل في مكتب. أكتب في العمل.", status: correct}
      - {value: "أنا مهندس أعمل في مكتب أكتب في العمل", status: correct}
      - {value: "أنا مهندس. أعمل في مكتب. أكتب في العمل", status: correct}
    feedback: "أنا مهندس. أعمل في مكتب. أكتب في العمل. gives basic work facts."
