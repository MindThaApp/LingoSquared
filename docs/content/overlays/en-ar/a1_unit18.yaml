  ar.a1.unit18.lesson01.teach.office: {title: "Office", gloss: "office", note: "في مكتب means in an office.", example_gloss: "I work in an office."}
  ar.a1.unit18.lesson01.teach.workplace_sentence: {title: "I work in an office", gloss: "I work in an office", note: "أعمل states the workplace.", example_gloss: "I work in an office."}
  ar.a1.unit18.lesson02.teach.write: {title: "I write", gloss: "I write", note: "أكتب is a simple work activity.", example_gloss: "I write at work."}
