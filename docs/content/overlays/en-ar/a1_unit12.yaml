    distractors: ["the market today at three", "the library tomorrow at ten", "the lesson today at five"]
    accepted_answers: [{value: "the cafe tomorrow at five", status: correct}]
    feedback: "They plan the cafe tomorrow at five."
  ar.a1.unit12.lesson02.exercise03.match_plan_lines:
