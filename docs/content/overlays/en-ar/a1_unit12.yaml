review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar a1_unit12_plans. Review 2026-10-19: 8 fixes - 5 example_glosses dropped the Layla/Yusuf said: frame; decline example_gloss follows the realization fix (a lesson tomorrow, not today, when declining a plan for tomorrow); line03 example_gloss See you now Goodbye, matching how إلى اللقاء is taught in unit 01; accept note was vague (may add it is), go note now explains the we-prefix and present-for-plan use; translate_tomorrow_time, accept_plan and write_plan_message accept forms without في (الساعة الخامسة as a time adverb); write_go_tomorrow and write_plan_message accept غدا in other valid positions; decline_plan accepts لدي for عندي; transliterations added. NATIVE FLAGS: none."}
course: {title: Arabic A1, description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."}
units:
  ar.a1.unit12.plans: {title: "Making plans"}
lessons:
  ar.a1.unit12.lesson01.time_for_plans: {title: "Tomorrow"}
  ar.a1.unit12.lesson02.make_a_plan: {title: "Shall we go?"}
teaching:
  ar.a1.unit12.lesson01.teach.tomorrow: {title: "Tomorrow", gloss: "tomorrow", note: "غدا (ghadan) places an action in the near future.", example_gloss: "I study tomorrow."}
  ar.a1.unit12.lesson01.teach.go: {title: "We go", gloss: "we go / we are going", note: "نذهب (nadh-hab) means we go; the ن at the start marks 'we'. With غدا the present-tense verb describes a plan.", example_gloss: "We go to the cafe."}
  ar.a1.unit12.lesson01.teach.plan_time: {title: "Tomorrow at five", gloss: "tomorrow at five o'clock", note: "في الساعة (at the hour) comes before the clock time, as in the time unit.", example_gloss: "We go tomorrow at five o'clock."}
  ar.a1.unit12.lesson02.teach.propose: {title: "Propose a plan", gloss: "Shall we go to the cafe tomorrow?", note: "هل (hal) turns a statement into a yes-or-no question; with نذهب it works as a proposal: shall we go?", example_gloss: "Layla said: Shall we go to the cafe tomorrow?"}
  ar.a1.unit12.lesson02.teach.accept: {title: "Accept with a time", gloss: "Yes, at five o'clock", note: "You can answer with just نعم plus the time; no verb is needed.", example_gloss: "Yusuf said: Yes, at five o'clock."}
  ar.a1.unit12.lesson02.teach.decline: {title: "Decline simply", gloss: "No, I have a lesson", note: "لا gives a simple decline, followed by a reason with عندي (I have).", example_gloss: "No, I have a lesson tomorrow."}
  ar.a1.unit12.lesson02.teach.line01: {title: "Layla proposes", gloss: "Layla proposes going to the cafe tomorrow.", note: "This line starts the planning exchange.", example_gloss: "Layla said: Shall we go to the cafe tomorrow?"}
  ar.a1.unit12.lesson02.teach.line02: {title: "Yusuf accepts", gloss: "Yusuf accepts and gives the time.", note: "The plan now has an activity, day, and time.", example_gloss: "Yusuf said: Yes, at five o'clock."}
  ar.a1.unit12.lesson02.teach.line03: {title: "Layla confirms", gloss: "Layla says good and goodbye.", note: "جيد (jayyid) means good; here it confirms the plan. إلى اللقاء is the goodbye from the greetings unit.", example_gloss: "Layla said: Good. Goodbye."}
exercises:
  ar.a1.unit12.lesson01.exercise01.recognize_tomorrow:
    instruction: "Select the meaning."
    correct_option: tomorrow
    distractors: [today, market, right]
    accepted_answers: [{value: tomorrow, status: correct}]
    feedback: "غدا means tomorrow."
  ar.a1.unit12.lesson01.exercise02.listen_plan_time:
    instruction: "Listen and select what you hear."
    correct_option: "tomorrow at five o'clock"
    distractors: ["today at three o'clock", "tomorrow at ten o'clock", "near the cafe"]
    accepted_answers: [{value: "tomorrow at five o'clock", status: correct}]
    feedback: "You heard غدا في الساعة الخامسة."
  ar.a1.unit12.lesson01.exercise03.match_plan_words:
    instruction: "Match each Arabic planning word or phrase with its meaning."
    accepted_answers:
      - value: {غدا: tomorrow, نذهب: "we go", المقهى: cafe, "الساعة الخامسة": "five o'clock"}
        status: correct
    feedback: "These pieces support a simple plan."
  ar.a1.unit12.lesson01.exercise04.order_go_cafe:
    instruction: "Arrange the Arabic words for We go to the cafe."
    accepted_answers: [{value: [نذهب, إلى, المقهى], status: correct}]
    feedback: "نذهب إلى المقهى means We go to the cafe."
  ar.a1.unit12.lesson01.exercise05.translate_tomorrow_time:
    instruction: "Translate into Arabic: Tomorrow at five o'clock."
    accepted_answers:
      - {value: "غدا في الساعة الخامسة", status: correct}
      - {value: "غدا في الساعة الخامسة.", status: correct}
