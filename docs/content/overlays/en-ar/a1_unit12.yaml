    accepted_answers:
      - value: {"هل نذهب إلى المقهى غدا؟": "Shall we go to the cafe tomorrow?", "نعم، في الساعة الخامسة": "Yes, at five o'clock", "لا، عندي درس": "No, I have a lesson"}
        status: correct
