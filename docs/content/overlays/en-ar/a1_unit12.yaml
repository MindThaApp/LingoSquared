    feedback: "غدا في الساعة الخامسة gives the day and time."
  ar.a1.unit12.lesson01.exercise06.write_go_tomorrow:
    instruction: "Type We go to the cafe tomorrow in Arabic."
    accepted_answers:
      - {value: "نذهب إلى المقهى غدا", status: correct}
      - {value: "نذهب إلى المقهى غدا.", status: correct}
      - {value: "نذهب غدا إلى المقهى", status: correct}
      - {value: "غدا نذهب إلى المقهى", status: correct}
    feedback: "نذهب إلى المقهى غدا states the planned activity."
  ar.a1.unit12.lesson02.exercise01.recognize_proposal:
