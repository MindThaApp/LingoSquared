review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) confirmation needed (DRAFT). Confirm every
    English gloss matches idiomatic MSA, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation/joining forms a correct learner would actually produce
    -- Arabic is graded fully byte-strict with zero typo tolerance and
    no internal-punctuation stripping, so a missing comma is NOT
    forgiven the way it would be in a typo-tolerant Latin-script course.
    See the realization file's review block for the full priority list.
  notes: >-
    Overlay for ar's first B2 unit, authored alongside the realization
    (no adaptable upper-intermediate public-domain Arabic source
    exists; see the realization provenance note). English speakers'
    real interference risks for this outcome: (1) English "but" covers
    both لكن (coordinating, normal word order) and the more formal إلا
    أن -- kept distinct in lesson04's glosses; (2) English lets a
    learner drop connectives entirely and still sound coherent, whereas
    the taught signposts (أولاً, من ناحية أخرى, مع ذلك) must actually
    appear -- the culminating lesson06 prompts name the required
    signposts so a correct answer is well-determined; (3) مواقع (a
    broken plural referring to non-human sites) takes FEMININE SINGULAR
    agreement throughout (مفيدة, ضارة, تسهّل, تضيّع, هي) -- English has
    no equivalent concord and a learner may default to a masculine or
    plural form, flagged in lesson01's grammar note. No sibling-
    direction file (ar-en b2) was consulted.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: defend a position in a
    discussion -- state a claim, support it with reasons and evidence
    (أولاً، بالإضافة إلى ذلك، تشير الدراسات إلى أن), acknowledge the
    strongest opposing point (من ناحية...من ناحية أخرى، صحيح أن، البعض
    يرى أن), and rebut it without conceding (لكن، هذا لا يغير حقيقة أن،
    باختصار), around the everyday debate of social media use.

units:
  ar.b2.unit01.aldifae_an_alraay: {title: "Defending an Opinion"}

lessons:
  ar.b2.unit01.lesson01.tabanni_mawqif: {title: "Taking a position"}
  ar.b2.unit01.lesson02.tabrir_biladillah: {title: "Supporting it with evidence"}
  ar.b2.unit01.lesson03.alieteraf_bilraay_alaakhar: {title: "Acknowledging the other side"}
  ar.b2.unit01.lesson04.alradd_ala_alietiradd: {title: "Rebutting"}
  ar.b2.unit01.lesson05.qiraat_nass_hijaji: {title: "Reading an argument"}
  ar.b2.unit01.lesson06.aldifae_an_mawqif: {title: "Defending a position"}

teaching:
  ar.b2.unit01.lesson01.teach.tawasul_ijtimai:
    title: "social media sites"
    gloss: "social media sites / social networking"
    note: "*مواقع التواصل الاجتماعي* is the everyday term for social media sites -- literally 'sites of social communication'. It is the topic this whole unit argues about, and treated as feminine singular in agreement (a non-human plural)."
    example_gloss: "I use social media sites every day."
  ar.b2.unit01.lesson01.teach.alinternet:
    title: "the internet"
    gloss: "the internet"
    example_gloss: "I use the internet every day."
  ar.b2.unit01.lesson01.teach.mufid:
    title: useful
    gloss: useful
    example_gloss: "The internet is useful for learning."
  ar.b2.unit01.lesson01.teach.dar:
    title: harmful
    gloss: harmful
    example_gloss: "Some habits are harmful."
  ar.b2.unit01.lesson01.teach.ara_anna:
    title: "I think that..."
    gloss: "I think that... / I see that..."
    note: "*أرى أن...* (literally 'I see that') introduces your own opinion, the claim you will defend."
  ar.b2.unit01.lesson01.teach.min_wijhat_nazari:
    title: "From my point of view..."
    gloss: "from my point of view... / in my view..."
    note: "*من وجهة نظري* is a softer, very common way to open an opinion, interchangeable with *أرى أن* as a claim-opener."
  ar.b2.unit01.lesson01.teach.akthar_mimma:
    title: "more than"
    gloss: "more than (what)"
    note: "*أكثر مما* compares two qualities of the same thing: 'more X than [it is] Y'. *مما* fuses 'than' + 'what'."
  ar.b2.unit01.lesson01.teach.claim_model:
    title: "I think that social media sites are more useful than harmful."
    gloss: "I think that social media sites are more useful than harmful."
    note: "The model claim for this unit. *مواقع* (non-human plural) takes feminine agreement throughout: *مفيدة*, and the pronoun *هي* referring back to it."
  ar.b2.unit01.lesson01.teach.attafiq_maak:
    title: "I agree with you on this."
    gloss: "I agree with you on this."
    note: "*أتفق معك في هذا* = 'I agree with you on this' -- *أتفق مع* + person + *في* + the point being agreed on."
  ar.b2.unit01.lesson01.teach.grammar_mawqif:
    title: "I think that social media sites are more useful than harmful. From my point of view, this is correct."
    gloss: "I think that social media sites are more useful than harmful. From my point of view, this is correct."
    note: "A claim is the position you will defend. Both *أرى أن...* and *من وجهة نظري...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  ar.b2.unit01.lesson02.teach.awwalan:
    title: firstly
    gloss: firstly
    note: "*أولاً* numbers your first reason -- the classic way to open your support."
    example_gloss: "Firstly, this is important."
  ar.b2.unit01.lesson02.teach.thanian:
    title: secondly
    gloss: secondly
    example_gloss: "Secondly, this is difficult."
  ar.b2.unit01.lesson02.teach.ala_sabil_almithal:
    title: "for example"
    gloss: "for example"
    note: "*على سبيل المثال* introduces a concrete example that backs up a reason."
  ar.b2.unit01.lesson02.teach.bilidafa_ila_dhalik:
    title: "in addition to that"
    gloss: "in addition to that / besides that"
    note: "*بالإضافة إلى ذلك* adds a further reason after the first."
  ar.b2.unit01.lesson02.teach.tushir_aldirasat:
    title: "studies indicate that..."
    gloss: "studies indicate that..."
    note: "*تشير الدراسات إلى أن...* is how you cite evidence in an argument -- *الدراسات* (studies, feminine plural) takes the feminine-singular verb *تشير* in this verb-first order."
  ar.b2.unit01.lesson02.teach.tusahhil:
    title: facilitates
    gloss: "facilitates / makes easier"
    note: "*تسهّل* (feminine form, agreeing with *هذه المواقع*) = facilitates."
    example_gloss: "These sites facilitate communication."
  ar.b2.unit01.lesson02.teach.bayn_alasdiqa:
    title: "between friends and family"
    gloss: "between friends and family"
  ar.b2.unit01.lesson02.teach.liltaallum:
    title: "for learning"
    gloss: "for learning"
    example_gloss: "This is useful for learning."
  ar.b2.unit01.lesson02.teach.support_model:
    title: "Firstly, these sites facilitate communication between friends and family."
    gloss: "Firstly, these sites facilitate communication between friends and family."
  ar.b2.unit01.lesson02.teach.evidence_model:
    title: "In addition, studies indicate that these sites are useful for learning."
    gloss: "In addition, studies indicate that these sites are useful for learning."
  ar.b2.unit01.lesson02.teach.grammar_adilla:
    title: "Firstly, these sites facilitate communication. In addition, studies indicate that these sites are useful."
    gloss: "Firstly, these sites facilitate communication. In addition, studies indicate that these sites are useful."
    note: "Support = the reasons and evidence behind your claim. Number them (*أولاً*, and *ثانياً* if you need a second), give examples (*على سبيل المثال*), and cite evidence (*تشير الدراسات إلى أن*) so the argument is easy to follow."

  ar.b2.unit01.lesson03.teach.min_nahiya:
    title: "On the one hand, ..."
    gloss: "on the one hand, ..."
    note: "*من ناحية...* opens a balanced view; it is almost always paired with *من ناحية أخرى...* to introduce the opposing point you are about to acknowledge."
  ar.b2.unit01.lesson03.teach.min_nahiya_ukhra:
    title: "On the other hand, ..."
    gloss: "on the other hand, ..."
    note: "*من ناحية أخرى...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  ar.b2.unit01.lesson03.teach.sahih_anna:
    title: "It's true that..."
    gloss: "it's true that... / it's correct that..."
    note: "*صحيح أن...* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  ar.b2.unit01.lesson03.teach.albad_yara:
    title: "Some people think that..."
    gloss: "some people think that..."
    note: "*البعض يرى أن...* introduces a common objection without owning it yourself, so you can then answer it."
  ar.b2.unit01.lesson03.teach.tudi:
    title: wastes
    gloss: "wastes (feminine agreement form)"
    example_gloss: "This habit wastes time."
  ar.b2.unit01.lesson03.teach.alwaqt:
    title: "the time"
    gloss: "the time"
    example_gloss: "Time is important for everyone."
  ar.b2.unit01.lesson03.teach.alkathir_min:
    title: "a lot of"
    gloss: "a lot of / much of"
  ar.b2.unit01.lesson03.teach.objection_model:
    title: "Some people think these sites waste a lot of time."
    gloss: "Some people think these sites waste a lot of time."
  ar.b2.unit01.lesson03.teach.concession_model:
    title: "On the one hand these sites facilitate communication. On the other hand these sites waste a lot of time."
    gloss: "On the one hand these sites facilitate communication. On the other hand these sites waste a lot of time."
  ar.b2.unit01.lesson03.teach.grammar_iaetiraf:
    title: "It's true that some people think these sites waste time. On the other hand, these sites are useful."
    gloss: "It's true that some people think these sites waste time. On the other hand, these sites are useful."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *من ناحية...من ناحية أخرى...*, *صحيح أن*, and *البعض يرى أن* all do this without giving up your own position."

  ar.b2.unit01.lesson04.teach.lakinna:
    title: but
    gloss: but
    note: "*لكن* is the everyday contrast word, joining two clauses with normal word order. It pivots from the acknowledged point back to your claim -- the core rebuttal word of this unit."
    example_gloss: "The weather is nice but cold."
  ar.b2.unit01.lesson04.teach.illa_anna:
    title: however
    gloss: "however / except that"
    note: "*إلا أن* is a more formal 'however', similar job to *لكن* but higher register."
  ar.b2.unit01.lesson04.teach.hatha_la_yughayyir:
    title: "this does not change the fact that..."
    gloss: "this does not change the fact that..."
    note: "*هذا لا يغير حقيقة أن...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim."
  ar.b2.unit01.lesson04.teach.maa_dhalik:
    title: nevertheless
    gloss: "nevertheless / despite that"
    note: "*مع ذلك* answers a concession: you grant the objection, then *مع ذلك...* ('nevertheless, ...') reasserts your claim."
    example_gloss: "The weather is cold; nevertheless I go out for a walk."
  ar.b2.unit01.lesson04.teach.bikhtisar:
    title: "in short"
    gloss: "in short"
    note: "*باختصار* signposts your conclusion -- it wraps the argument up."
    example_gloss: "In short, this is my opinion."
  ar.b2.unit01.lesson04.teach.alfawaid:
    title: benefits
    gloss: "benefits (plural)"
    example_gloss: "The benefits are many."
  ar.b2.unit01.lesson04.teach.aladrar:
    title: harms
    gloss: "harms (plural)"
    example_gloss: "The harms are few."
  ar.b2.unit01.lesson04.teach.tafuq:
    title: outweighs
    gloss: "outweighs / exceeds"
    note: "*تفوق* (feminine agreement, matching *الفوائد*) = 'outweighs' in an argument."
    example_gloss: "The benefits sometimes outweigh the harms."
  ar.b2.unit01.lesson04.teach.rebuttal_model:
    title: "It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms."
    gloss: "It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms."
  ar.b2.unit01.lesson04.teach.conclusion_model:
    title: "In short, the benefits outweigh the harms."
    gloss: "In short, the benefits outweigh the harms."
  ar.b2.unit01.lesson04.teach.grammar_radd:
    title: "It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms. In short, the benefits outweigh the harms."
    gloss: "It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms. In short, the benefits outweigh the harms."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *لكن*, *إلا أن*, and *هذا لا يغير حقيقة أن...* all pivot back to your position; *باختصار* signposts the conclusion."

  ar.b2.unit01.lesson05.teach.nass_hijaji:
    title: "Reading: social media use is a good development"
    gloss: "The use of social media sites is increasing among people. I think this is a good development. Firstly, these sites facilitate communication between friends and family. In addition, studies indicate that these sites are useful for learning too. It's true that some think it wastes a lot of time. This does not change the fact that the benefits outweigh the harms. In short, social media sites are more useful than harmful."
    glosses:
      يتزايد: "increases / is on the rise"
      استخدام: "the use (of)"
      الناس: people
      تطور: development
      جيد: good
      أيضا: also
      أنها: "that it (referring to مواقع)"
  ar.b2.unit01.lesson06.teach.limadha_tarayn:
    title: "Why do you think that?"
    gloss: "Why do you (fem.) think that?"
    note: "*لماذا ترين ذلك؟* asks a debating partner to support their claim -- *ترين* is the feminine-addressee form, since it's addressed to ليلى."
  ar.b2.unit01.lesson06.teach.shay_min_alsihha:
    title: "There's something to that."
    gloss: "There's something true in this. / You have a point."
    note: "*في هذا شيء من الصحة* concedes that the other person's argument has some merit -- a natural MSA way to partially concede without fully giving up your own claim."
  ar.b2.unit01.lesson06.teach.dialogue_layla_claim:
    title: "Layla: I think social media sites are more useful than harmful."
    gloss: "Layla: I think social media sites are more useful than harmful."
  ar.b2.unit01.lesson06.teach.dialogue_yusuf_why:
    title: "Yusuf: Why do you think that?"
    gloss: "Yusuf: Why do you think that?"
  ar.b2.unit01.lesson06.teach.dialogue_layla_support:
    title: "Layla: Firstly, these sites facilitate communication between friends and family. In addition, studies indicate that these sites are useful for learning."
    gloss: "Layla: Firstly, these sites facilitate communication between friends and family. In addition, studies indicate that these sites are useful for learning."
  ar.b2.unit01.lesson06.teach.dialogue_yusuf_objection:
    title: "Yusuf: On the other hand, these sites waste a lot of time."
    gloss: "Yusuf: On the other hand, these sites waste a lot of time."
  ar.b2.unit01.lesson06.teach.dialogue_layla_rebuttal:
    title: "Layla: It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms. In short, the benefits outweigh the harms."
    gloss: "Layla: It's true that these sites waste some time, but this does not change the fact that the benefits outweigh the harms. In short, the benefits outweigh the harms."
  ar.b2.unit01.lesson06.teach.dialogue_yusuf_concede:
    title: "Yusuf: There's something to that."
    gloss: "Yusuf: There's something to that."
  ar.b2.unit01.lesson06.teach.grammar_hijaj_kamil:
    title: "I think social media sites are more useful than harmful. Firstly, these sites facilitate communication. On the other hand, they waste a lot of time. Nevertheless, the benefits outweigh the harms."
    gloss: "I think social media sites are more useful than harmful. Firstly, these sites facilitate communication. On the other hand, they waste a lot of time. Nevertheless, the benefits outweigh the harms."
    note: "A complete argument has four moves: claim (*أرى أن...*), support (*أولاً...*), acknowledged objection (*من ناحية أخرى...*), and rebuttal (*مع ذلك...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  ar.b2.unit01.lesson01.exercise01.recognize_tawasul:
    instruction: "What does this phrase mean?"
    correct_option: "social media sites"
    distractors: ["news sites", "shopping sites", "a phone call"]
    accepted_answers: [{value: "social media sites", status: correct}]
    feedback: "*مواقع التواصل الاجتماعي* is the topic this whole unit debates."
  ar.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that social media sites are more useful than harmful."
    distractors: ["I think that social media sites are more harmful than useful.", "I think that the internet is more useful than harmful.", "I know that social media sites are more useful than harmful."]
    accepted_answers: [{value: "I think that social media sites are more useful than harmful.", status: correct}]
    feedback: "*أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة* means I think that social media sites are more useful than harmful."
  ar.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"مواقع التواصل الاجتماعي": "social media sites", الإنترنت: "the internet", مفيد: useful, ضار: harmful, "أرى أن...": "I think that...", "من وجهة نظري...": "from my point of view...", "أكثر مما": "more than", "أتفق معك في هذا": "I agree with you on this"}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  ar.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that social media sites are useful."
    accepted_answers:
      - {value: "أرى أن مواقع التواصل الاجتماعي مفيدة", status: correct}
    feedback: "*أرى أن مواقع التواصل الاجتماعي مفيدة* means I think that social media sites are useful."
  ar.b2.unit01.lesson01.exercise05.translate_wijhat_nazari:
    instruction: "Translate into Arabic: From my point of view, the internet is useful."
    accepted_answers:
      - {value: "من وجهة نظري الإنترنت مفيد", status: correct}
      - {value: "من وجهة نظري، الإنترنت مفيد", status: correct}
    feedback: "*من وجهة نظري، الإنترنت مفيد* means from my point of view, the internet is useful."
  ar.b2.unit01.lesson01.exercise06.speak_attafiq:
    instruction: "Say aloud in Arabic: I agree with you on this."
    accepted_answers:
      - {value: "أتفق معك في هذا", status: correct}
    feedback: "*أتفق معك في هذا* means I agree with you on this."
  ar.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Arabic: I think that social media sites are more useful than harmful."
    accepted_answers:
      - {value: "أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة", status: correct}
      - {value: "أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة.", status: correct}
    feedback: "*أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة.* means I think that social media sites are more useful than harmful."
  ar.b2.unit01.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة"
    orthography_strict: true
    feedback: "You heard *أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة* -- I think that social media sites are more useful than harmful."

  ar.b2.unit01.lesson02.exercise01.recognize_awwalan:
    instruction: "What does this word mean?"
    correct_option: firstly
    distractors: [secondly, but, however]
    accepted_answers: [{value: firstly, status: correct}]
    feedback: "*أولاً* opens your first supporting reason."
  ar.b2.unit01.lesson02.exercise02.listen_support:
    instruction: "Listen and select what you hear."
    correct_option: "Firstly, these sites facilitate communication between friends and family."
    distractors: ["Secondly, these sites facilitate communication between friends and family.", "Firstly, these sites make communication between friends and family harder.", "Firstly, these sites facilitate communication between colleagues."]
    accepted_answers: [{value: "Firstly, these sites facilitate communication between friends and family.", status: correct}]
    feedback: "*أولاً، تسهّل هذه المواقع التواصل بين الأصدقاء والعائلة* means firstly, these sites facilitate communication between friends and family."
  ar.b2.unit01.lesson02.exercise03.match_support_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {أولاً: firstly, ثانياً: secondly, "على سبيل المثال": "for example", "بالإضافة إلى ذلك": "in addition to that", "تشير الدراسات إلى أن...": "studies indicate that...", تسهّل: facilitates, "بين الأصدقاء والعائلة": "between friends and family", للتعلم: "for learning"}
        status: correct
    feedback: "These are this lesson's reason- and evidence-signposting words."
  ar.b2.unit01.lesson02.exercise04.order_support:
    instruction: "Put the words in order: Firstly, these sites facilitate communication."
    accepted_answers:
      - {value: "أولاً تسهّل هذه المواقع التواصل", status: correct}
    feedback: "*أولاً تسهّل هذه المواقع التواصل* means firstly, these sites facilitate communication."
  ar.b2.unit01.lesson02.exercise05.translate_support:
    instruction: "Translate into Arabic, using أولاً: Firstly, these sites facilitate communication between friends and family."
    accepted_answers:
      - {value: "أولاً تسهّل هذه المواقع التواصل بين الأصدقاء والعائلة", status: correct}
      - {value: "أولاً، تسهّل هذه المواقع التواصل بين الأصدقاء والعائلة", status: correct}
    feedback: "*أولاً، تسهّل هذه المواقع التواصل بين الأصدقاء والعائلة* means firstly, these sites facilitate communication between friends and family."
  ar.b2.unit01.lesson02.exercise06.translate_evidence:
    instruction: "Translate into Arabic: Studies indicate that these sites are useful for learning."
    accepted_answers:
      - {value: "تشير الدراسات إلى أن هذه المواقع مفيدة للتعلم", status: correct}
    feedback: "*تشير الدراسات إلى أن هذه المواقع مفيدة للتعلم* means studies indicate that these sites are useful for learning."
  ar.b2.unit01.lesson02.exercise07.write_two_reasons:
    instruction: "Write these two sentences in Arabic, using أولاً and بالإضافة إلى ذلك: Firstly, these sites facilitate communication between friends and family. In addition, studies indicate that these sites are useful for learning."
