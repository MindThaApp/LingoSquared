teaching:
  ar.a1.unit08.lesson01.teach.price: {title: "Price", gloss: "price", note: "سعر (siʿr) means price.", example_gloss: "How much are the apples?"}
  ar.a1.unit08.lesson01.teach.apple: {title: "Apples", gloss: "apples", note: "تفاح (tuffāḥ) is a collective word for apples; one apple is تفاحة (tuffāḥa).", example_gloss: "The apples are for ten dirhams."}
  ar.a1.unit08.lesson01.teach.dirhams: {title: "Dirhams", gloss: "dirhams", note: "دراهم (darāhim) is the plural of درهم (dirham), the currency of Morocco and the UAE; after numbers 3-10 the plural is used.", example_gloss: "I have ten dirhams."}
  ar.a1.unit08.lesson01.teach.how_much_price: {title: "How much are the apples?", gloss: "How much are the apples?", note: "كم سعر التفاح؟ (kam siʿr at-tuffāḥ) literally asks how much is the price of the apples. ما سعر التفاح؟ (what is the price) and بكم التفاح؟ (for how much are the apples) are also standard.", example_gloss: "Layla said: How much are the apples?"}
  ar.a1.unit08.lesson01.teach.ten_dirhams: {title: "For ten dirhams", gloss: "for ten dirhams", note: "The بـ prefix (bi-) marks the price: بعشرة (bi-ʿashara), for ten.", example_gloss: "The apples are for ten dirhams."}
  ar.a1.unit08.lesson02.teach.two_apples: {title: "Two apples", gloss: "two apples", note: "تفاحتين (tuffāḥatayn) is the dual of تفاحة (one apple), in the object form used after أريد.", example_gloss: "Two apples."}
  ar.a1.unit08.lesson02.teach.want_two: {title: "I want two apples", gloss: "I want two apples", note: "Keep أريد before the item.", example_gloss: "I want two apples."}
  ar.a1.unit08.lesson02.teach.line01: {title: "Ask the price", gloss: "Layla asks the apple price.", note: "This is the same price-question pattern.", example_gloss: "Layla said: How much are the apples?"}
  ar.a1.unit08.lesson02.teach.line02: {title: "Say the price", gloss: "The seller says the apples are ten dirhams.", note: "بعشرة attaches the price marker to عشرة.", example_gloss: "The seller said: The apples are for ten dirhams."}
  ar.a1.unit08.lesson02.teach.line03: {title: "Request a quantity", gloss: "Layla asks for two apples politely.", note: "من فضلك keeps the request polite.", example_gloss: "Layla said: I want two apples, please."}
  ar.a1.unit08.lesson02.teach.line04: {title: "Hand over the item", gloss: "The seller says here you are.", note: "تفضلي was introduced in the food unit; it is said to a woman (to a man: تفضل).", example_gloss: "The seller said: Here you are."}
exercises:
  ar.a1.unit08.lesson01.exercise01.recognize_price:
    instruction: "Select the meaning."
    correct_option: price
    distractors: [time, date, family]
    accepted_answers: [{value: price, status: correct}]
    feedback: "سعر means price."
  ar.a1.unit08.lesson01.exercise02.listen_price_question:
    instruction: "Listen and select what you hear."
    correct_option: "How much are the apples?"
    distractors: ["I want two apples.", "The apples are ten dirhams.", "What time is it?"]
    accepted_answers: [{value: "How much are the apples?", status: correct}]
    feedback: "You heard كم سعر التفاح؟"
  ar.a1.unit08.lesson01.exercise03.match_market_words:
    instruction: "Match each Arabic market word with its meaning."
    accepted_answers:
      - value: {سعر: price, تفاح: apples, دراهم: dirhams}
        status: correct
    feedback: "These words support a simple market exchange."
  ar.a1.unit08.lesson01.exercise04.order_price_question:
    instruction: "Arrange the Arabic words for How much are the apples?"
    accepted_answers: [{value: [كم, سعر, التفاح], status: correct}]
    feedback: "كم سعر التفاح؟ asks the price of apples."
  ar.a1.unit08.lesson01.exercise05.translate_price:
    instruction: "Translate into Arabic: The apples are for ten dirhams."
    accepted_answers:
      - {value: "التفاح بعشرة دراهم", status: correct}
      - {value: "التفاح بعشرة دراهم.", status: correct}
      - {value: "سعر التفاح عشرة دراهم", status: correct}
    feedback: "التفاح بعشرة دراهم states the price."
  ar.a1.unit08.lesson01.exercise06.write_price_question:
    instruction: "Type How much are the apples? in Arabic."
    accepted_answers:
      - {value: "كم سعر التفاح", status: correct}
      - {value: "كم سعر التفاح؟", status: correct}
      - {value: "ما سعر التفاح", status: correct}
      - {value: "بكم التفاح", status: correct}
    feedback: "كم سعر التفاح؟ is the expected price question."
  ar.a1.unit08.lesson01.exercise07.dictation_price_apples: {correct_response: "كم سعر التفاح؟", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit08.lesson02.exercise01.recognize_two_apples:
    instruction: "Select the meaning."
    correct_option: "two apples"
    distractors: ["one apple", "ten apples", "apple price"]
    accepted_answers: [{value: "two apples", status: correct}]
    feedback: "تفاحتين means two apples in this request."
  ar.a1.unit08.lesson02.exercise02.dialogue_price:
    instruction: "What is the price?"
    correct_option: "ten dirhams"
    distractors: ["five dirhams", "two dirhams", "one dirham"]
    accepted_answers: [{value: "ten dirhams", status: correct}]
    feedback: "The seller says التفاح بعشرة دراهم."
  ar.a1.unit08.lesson02.exercise03.match_purchase_lines:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"كم سعر التفاح؟": "How much are the apples?", "أريد تفاحتين": "I want two apples", تفضلي: "here you are"}
        status: correct
    feedback: "These lines make a price-and-quantity exchange."
  ar.a1.unit08.lesson02.exercise04.order_two_apples:
    instruction: "Arrange the Arabic words for I want two apples."
    accepted_answers: [{value: [أريد, تفاحتين], status: correct}]
    feedback: "أريد تفاحتين means I want two apples."
  ar.a1.unit08.lesson02.exercise05.ask_price_response:
    instruction: "Type the Arabic question for How much are the apples?"
    accepted_answers:
      - {value: "كم سعر التفاح", status: correct}
      - {value: "كم سعر التفاح؟", status: correct}
      - {value: "ما سعر التفاح", status: correct}
      - {value: "بكم التفاح", status: correct}
    feedback: "كم سعر التفاح؟ asks the price."
