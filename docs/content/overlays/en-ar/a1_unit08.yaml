review: {status: reviewed, required_next_reviewer: native_speaker_review, notes: "Paired with ar a1_unit08_shopping. Review 2026-10-19: 8 fixes - market dialogue had Yusuf (canon: engineer, Layla's colleague) selling apples, so the seller is now an unnamed البائع (the seller) in realization, glosses and dialogue_price feedback; 5 example_glosses dropped the Layla/seller said: frame; how_much_price note implied any كم-question without سعر is wrong, now presents ما سعر / بكم as standard alternatives and the price-question production exercises accept ما سعر التفاح and بكم التفاح; translate_price accepts سعر التفاح عشرة دراهم; dirhams note was vague (now: plural of درهم, currency of Morocco and the UAE); تفضلي note gives masculine تفضل; transliterations added. NATIVE FLAGS: none."}
