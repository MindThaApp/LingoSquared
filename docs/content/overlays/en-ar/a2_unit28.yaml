teaching:
  ar.a2.unit28.lesson01.teach.throat: {title: "Throat", gloss: "throat", note: "*الحلق* means throat.", example_gloss: "I have pain in my throat."}
  ar.a2.unit28.lesson01.teach.since_three_days: {title: "For three days", gloss: "for three days", note: "*منذ ثلاثة أيام* gives the duration of a symptom.", example_gloss: "I have pain in my throat for three days."}
  ar.a2.unit28.lesson01.teach.severe: {title: "Severe", gloss: "severe", note: "*شديد* describes strong pain.", example_gloss: "The pain is severe."}
  ar.a2.unit28.lesson01.teach.mild: {title: "Mild", gloss: "mild", note: "*بسيط* describes weak pain.", example_gloss: "Is the pain severe or mild?"}
  ar.a2.unit28.lesson01.teach.fever: {title: "Fever", gloss: "fever", note: "*حمى* means fever.", example_gloss: "I also have a fever."}
  ar.a2.unit28.lesson01.teach.also: {title: "Also", gloss: "also", note: "*أيضا* adds a second detail.", example_gloss: "The pain is severe, and I also have a fever."}
  ar.a2.unit28.lesson01.teach.what_is_your_problem: {title: "What's the problem", gloss: "What's your problem today?", note: "*مشكلتك* means \"your problem.\"", example_gloss: "Hello, what's your problem today?"}
  ar.a2.unit28.lesson02.teach.medicine: {title: "Medicine", gloss: "medicine", note: "*دواء* means medicine.", example_gloss: "Take this medicine."}
  ar.a2.unit28.lesson02.teach.twice_a_day: {title: "Twice a day", gloss: "twice a day", note: "*مرتين في اليوم* gives a dosage frequency.", example_gloss: "Take this medicine twice a day."}
  ar.a2.unit28.lesson02.teach.a_lot: {title: "A lot", gloss: "a lot", note: "*كثيرا* means a lot.", example_gloss: "Drink a lot of water."}
  ar.a2.unit28.lesson02.teach.another_appointment: {title: "Another appointment", gloss: "another appointment", note: "*موعد آخر* means another appointment.", example_gloss: "Do I need another appointment?"}
  ar.a2.unit28.lesson02.teach.after_a_week: {title: "After a week", gloss: "after a week", note: "*بعد أسبوع* means after a week.", example_gloss: "Come back after a week."}
  ar.a2.unit28.lesson02.teach.if_not_improve: {title: "If you don't improve", gloss: "if you do not improve", note: "*إذا لم تتحسني* is a conditional follow-up instruction.", example_gloss: "Come back after a week if you do not improve."}
  ar.a2.unit28.lesson02.teach.line01: {title: "Doctor greeting", gloss: "The doctor greets Layla and asks about her problem.", note: "Formal medical greeting.", example_gloss: "Hello, what's your problem today?"}
  ar.a2.unit28.lesson02.teach.line02: {title: "Layla describes symptom", gloss: "Layla says she has had throat pain for three days.", note: "This gives the symptom and its duration.", example_gloss: "I have pain in my throat for three days."}
  ar.a2.unit28.lesson02.teach.line03: {title: "Doctor asks severity", gloss: "The doctor asks whether the pain is severe or mild.", note: "This checks the severity of the symptom.", example_gloss: "Is the pain severe or mild?"}
  ar.a2.unit28.lesson02.teach.line04: {title: "Layla confirms severity", gloss: "Layla says the pain is severe and she also has a fever.", note: "This gives the severity plus a second symptom.", example_gloss: "The pain is severe, and I also have a fever."}
  ar.a2.unit28.lesson02.teach.line05: {title: "Treatment instructions", gloss: "The doctor tells Layla to take medicine twice a day and drink lots of water.", note: "This is the treatment instruction.", example_gloss: "Take this medicine twice a day, and drink lots of water."}
  ar.a2.unit28.lesson02.teach.line06: {title: "Layla asks about follow-up", gloss: "Layla asks whether she needs another appointment.", note: "This asks about follow-up.", example_gloss: "Do I need another appointment?"}
  ar.a2.unit28.lesson02.teach.line07: {title: "Follow-up instructions", gloss: "The doctor says to come back after a week if Layla does not improve.", note: "This is the follow-up instruction.", example_gloss: "\"Yes,\" come back after a week if you do not improve."}
exercises:
  ar.a2.unit28.lesson01.exercise01.recognize_severe:
    instruction: "Select the meaning."
    correct_option: severe
    distractors: [mild, fever, medicine]
    accepted_answers: [{value: severe, status: correct}]
    feedback: "*شديد* means severe."
  ar.a2.unit28.lesson01.exercise02.listen_throat_pain:
    instruction: "Listen and select what you hear."
    correct_option: "pain in the throat"
    distractors: [fever, "another appointment", medicine]
    accepted_answers: [{value: "pain in the throat", status: correct}]
    feedback: "You heard *ألم في الحلق*."
  ar.a2.unit28.lesson01.exercise03.match_symptom_words:
    instruction: "Match each Arabic symptom word with its meaning."
    accepted_answers:
      - value: {الحلق: throat, "منذ ثلاثة أيام": "for three days", شديد: severe, بسيط: mild, حمى: fever, أيضا: also}
        status: correct
    feedback: "These words describe a symptom, its duration, and its severity."
  ar.a2.unit28.lesson01.exercise04.order_throat_duration:
    instruction: "Arrange the Arabic words for I have pain in my throat for three days."
    accepted_answers: [{value: [عندي, ألم, في, الحلق, منذ, ثلاثة, أيام], status: correct}]
    feedback: "*عندي ألم في الحلق منذ ثلاثة أيام* gives the symptom and its duration."
  ar.a2.unit28.lesson01.exercise05.write_symptom_detail:
    instruction: "Type exactly this formal Arabic sentence: I have pain in my throat for three days and the pain is severe."
    accepted_answers:
      - {value: "عندي ألم في الحلق منذ ثلاثة أيام والألم شديد", status: correct}
      - {value: "عندي ألم في الحلق منذ ثلاثة أيام والألم شديد.", status: correct}
    feedback: "*عندي ألم في الحلق منذ ثلاثة أيام والألم شديد* is the requested symptom description."
  ar.a2.unit28.lesson02.exercise01.recognize_medicine:
    instruction: "Select the meaning."
    correct_option: medicine
    distractors: [fever, "a lot", "another appointment"]
    accepted_answers: [{value: medicine, status: correct}]
    feedback: "*دواء* means medicine."
  ar.a2.unit28.lesson02.exercise02.dialogue_treatment_instructions:
    instruction: "How often should Layla take the medicine?"
    correct_option: "Twice a day."
    distractors: ["Once a week.", "Three times a day.", "Once a day."]
    accepted_answers: [{value: "Twice a day.", status: correct}]
    feedback: "The doctor says *مرتين في اليوم*."
  ar.a2.unit28.lesson02.exercise03.match_treatment_lines:
    instruction: "Match each Arabic treatment word or phrase with its meaning."
    accepted_answers:
      - value: {دواء: medicine, "مرتين في اليوم": "twice a day", كثيرا: "a lot", "موعد آخر": "another appointment", "بعد أسبوع": "after a week", "إذا لم تتحسني": "if you do not improve"}
        status: correct
    feedback: "These cover the treatment instructions and the follow-up plan."
  ar.a2.unit28.lesson02.exercise04.order_medicine_instruction:
    instruction: "Arrange the Arabic words for Take this medicine twice a day."
    accepted_answers: [{value: [خذي, هذا, الدواء, مرتين, في, اليوم], status: correct}]
    feedback: "*خذي هذا الدواء مرتين في اليوم* gives the treatment instruction."
  ar.a2.unit28.lesson02.exercise05.write_appointment_request:
    instruction: "Write a short formal Arabic message with exactly this content: say you have had throat pain and a fever for three days; say the pain is severe; ask whether you need medicine; and ask whether you need another appointment."
    accepted_answers:
      - {value: "عندي ألم في الحلق وحمى منذ ثلاثة أيام. والألم شديد. هل أحتاج دواء؟ وهل أحتاج موعدا آخر؟", status: correct}
    feedback: "*عندي ألم في الحلق وحمى منذ ثلاثة أيام. والألم شديد. هل أحتاج دواء؟ وهل أحتاج موعدا آخر؟* is the requested formal symptom and follow-up message."
