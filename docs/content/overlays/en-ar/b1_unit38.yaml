    instruction: "As Layla, write two sentences to Yusuf: first agree with his opinion that working from home is better, referencing his view with في أن and giving your reason about focus (using أوافقك الرأي في أن ... لأن); then disagree with his opinion that short meetings are better, referencing his view with في أن and giving your reason about important topics needing more time (using لا أوافقك الرأي في أن ... لأن)."
    accepted_answers:
      - {value: "أوافقك الرأي في أن العمل من المنزل أفضل لأن التركيز أسهل في المنزل. لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل لأن المواضيع المهمة تحتاج وقتا أطول.", status: correct}
      - {value: "أوافقك الرأي في أن العمل من المنزل أفضل، لأن التركيز أسهل في المنزل. لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل، لأن المواضيع المهمة تحتاج وقتا أطول.", status: correct}
    feedback: "*أوافقك الرأي في أن العمل من المنزل أفضل، لأن التركيز أسهل في المنزل. لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل، لأن المواضيع المهمة تحتاج وقتا أطول.* combines agreement and disagreement, each referencing Yusuf's view with a reason, as required."
