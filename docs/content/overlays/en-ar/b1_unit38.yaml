    instruction: "Match each Arabic sentence with its meaning."
    accepted_answers:
      - value: {"أعتقد أن العمل من المنزل أفضل من العمل في المكتب.": "I think working from home is better than working in the office.", "أوافقك الرأي في أن العمل من المنزل أفضل": "I agree with you that working from home is better", "أعتقد أن الاجتماعات القصيرة أفضل من الاجتماعات الطويلة.": "I think short meetings are better than long meetings.", "لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل": "I disagree with you that short meetings are better", "لأن التركيز أسهل في المنزل": "because focus is easier at home", "لأن المواضيع المهمة تحتاج وقتا أطول": "because important topics need more time"}
        status: correct
    feedback: "These lines cover both opinions and both referenced responses."
  ar.b1.unit38.lesson03.exercise04.order_disagree_line:
    instruction: "Arrange the Arabic words for I disagree with you that short meetings are better, because important topics need more time."
    accepted_answers: [{value: [لا, أوافقك, الرأي, في, أن, الاجتماعات, القصيرة, أفضل, لأن, المواضيع, المهمة, تحتاج, وقتا, أطول], status: correct}]
