exercises:
  ar.b1.unit38.lesson01.exercise01.recognize_yusuf_opinion:
    instruction: "Select the meaning."
    correct_option: "I think working from home is better"
    distractors: ["I know working from home is better", "I think working from home is easy", "I think the office is better"]
    accepted_answers: [{value: "I think working from home is better", status: correct}]
    feedback: "*أعتقد أن العمل من المنزل أفضل* states Yusuf's opinion."
  ar.b1.unit38.lesson01.exercise02.recognize_layla_agree:
    instruction: "Select the meaning."
    correct_option: "I agree with you that working from home is better"
    distractors: ["I think working from home is better", "I disagree with you that working from home is better", "I agree with you that the office is better"]
    accepted_answers: [{value: "I agree with you that working from home is better", status: correct}]
    feedback: "*أوافقك الرأي في أن العمل من المنزل أفضل* agrees while referencing Yusuf's stated view."
  ar.b1.unit38.lesson01.exercise03.listen_select_agree_reason:
    instruction: "Listen and select what Layla says."
    correct_option: "I agree with you that working from home is better, because focus is easier at home."
    distractors: ["I disagree with you that working from home is better.", "I think the office is better, because focus is easier there.", "I agree with you that meetings should be short."]
    accepted_answers: [{value: "I agree with you that working from home is better, because focus is easier at home.", status: correct}]
    feedback: "You heard *أوافقك الرأي في أن العمل من المنزل أفضل، لأن التركيز أسهل في المنزل*."
  ar.b1.unit38.lesson01.exercise04.match_agree_reason:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"أعتقد أن العمل من المنزل أفضل": "I think working from home is better", المكتب: "the office", "أوافقك الرأي في أن": "I agree with you that", التركيز: focus, "أسهل في المنزل": "easier at home", المنزل: "the home"}
        status: correct
    feedback: "These phrases cover the agree-with-reference construction."
  ar.b1.unit38.lesson01.exercise05.order_agree_reason:
    instruction: "Arrange the Arabic words for I agree with you that working from home is better."
    accepted_answers: [{value: [أوافقك, الرأي, في, أن, العمل, من, المنزل, أفضل], status: correct}]
    feedback: "*أوافقك الرأي في أن العمل من المنزل أفضل* agrees while referencing the stated opinion."
  ar.b1.unit38.lesson01.exercise06.write_agree_reason:
    instruction: "Write exactly this agreement sentence with أوافقك الرأي في أن + the referenced opinion + a لأن reason: I agree with you that working from home is better, because focus is easier at home."
    accepted_answers:
      - {value: "أوافقك الرأي في أن العمل من المنزل أفضل لأن التركيز أسهل في المنزل", status: correct}
      - {value: "أوافقك الرأي في أن العمل من المنزل أفضل، لأن التركيز أسهل في المنزل.", status: correct}
    feedback: "*أوافقك الرأي في أن العمل من المنزل أفضل، لأن التركيز أسهل في المنزل.* is the requested agreement sentence."
  ar.b1.unit38.lesson02.exercise01.recognize_yusuf_opinion2:
