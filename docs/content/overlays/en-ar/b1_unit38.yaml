      - {value: "لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل، لأن المواضيع المهمة تحتاج وقتا أطول.", status: correct}
    feedback: "*لا أوافقك الرأي في أن الاجتماعات القصيرة أفضل، لأن المواضيع المهمة تحتاج وقتا أطول.* is Layla's reply."
