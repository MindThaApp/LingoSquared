exercises:
  ar.a2.unit25.lesson01.exercise01.recognize_form:
    instruction: "Select the meaning."
    correct_option: form
    distractors: [passport, appointment, address]
    accepted_answers: [{value: form, status: correct}]
    feedback: "*استمارة* means form."
  ar.a2.unit25.lesson01.exercise02.listen_form:
    instruction: "Listen and select what you hear."
    correct_option: form
    distractors: [passport, appointment, address]
    accepted_answers: [{value: form, status: correct}]
    feedback: "You heard *استمارة*."
  ar.a2.unit25.lesson01.exercise03.match_documents:
    instruction: "Match each Arabic registration word with its meaning."
    accepted_answers:
      - value: {تسجيل: registration, السلطات: authorities, استمارة: form, "جواز سفر": passport, موعد: appointment, "يوم الثلاثاء": Tuesday, "الساعة العاشرة": "ten o'clock"}
        status: correct
    feedback: "These words cover documents, appointments, and registration."
  ar.a2.unit25.lesson01.exercise04.order_need_form:
    instruction: "Arrange the Arabic words for I need a form."
    accepted_answers: [{value: [أحتاج, إلى, استمارة], status: correct}]
    feedback: "*أحتاج إلى استمارة* means I need a form."
  ar.a2.unit25.lesson01.exercise05.write_form_need:
    instruction: "Type exactly this Arabic sentence in formal register: I need a form."
    accepted_answers:
      - {value: "أحتاج إلى استمارة", status: correct}
      - {value: "أحتاج إلى استمارة.", status: correct}
    feedback: "*أحتاج إلى استمارة* is the requested formal sentence."
  ar.a2.unit25.lesson02.exercise01.recognize_address:
    instruction: "Select the meaning."
    correct_option: address
    distractors: [passport, appointment, form]
    accepted_answers: [{value: address, status: correct}]
    feedback: "*العنوان* means address."
  ar.a2.unit25.lesson02.exercise02.dialogue_documents:
    instruction: "Which documents does the clerk request?"
    correct_option: "A form and a passport."
    distractors: ["A bank card and cash.", "A phone and a ticket.", "A letter and a photo."]
    accepted_answers: [{value: "A form and a passport.", status: correct}]
    feedback: "The clerk asks for *استمارة وجواز سفر*."
  ar.a2.unit25.lesson02.exercise03.match_registration_lines:
    instruction: "Match each Arabic registration line with its meaning."
    accepted_answers:
      - value: {"صباح الخير": "Good morning", "أريد تسجيل عنواني الجديد": "I want to register my new address", "اسمي ليلى حسن": "My name is Layla Hasan", "العنوان شارع النور": "The address is Al-Nour Street", "رقم الهاتف": "the phone number", "هل أحتاج إلى استمارة؟": "Do I need a form?"}
        status: correct
    feedback: "These lines give identity, address, phone, and a clarifying question."
  ar.a2.unit25.lesson02.exercise04.order_registration_request:
    instruction: "Arrange the Arabic words for I want to register my new address."
    accepted_answers: [{value: [أريد, تسجيل, عنواني, الجديد], status: correct}]
    feedback: "*أريد تسجيل عنواني الجديد* is the formal request."
  ar.a2.unit25.lesson02.exercise05.complete_registration_exchange:
    instruction: "Answer the clerk in formal Arabic with exactly this content: request to register your new address, give the full name Layla Hasan, give the address Al-Nour Street building five and phone number zero seven five five, then ask the clarifying question Do I need a form?"
    accepted_answers:
      - {value: "أريد تسجيل عنواني الجديد. اسمي ليلى حسن. العنوان شارع النور، بناية خمسة، ورقم الهاتف صفر سبعة خمسة خمسة. هل أحتاج إلى استمارة؟", status: correct}
      - {value: "أريد تسجيل عنواني الجديد، اسمي ليلى حسن، العنوان شارع النور، بناية خمسة، ورقم الهاتف صفر سبعة خمسة خمسة. هل أحتاج إلى استمارة؟", status: correct}
      - {value: "أريد تسجيل عنواني الجديد واسمي ليلى حسن. العنوان شارع النور، بناية خمسة، ورقم الهاتف صفر سبعة خمسة خمسة. هل أحتاج إلى استمارة؟", status: correct}
    feedback: "*أريد تسجيل عنواني الجديد. اسمي ليلى حسن. العنوان شارع النور، بناية خمسة، ورقم الهاتف صفر سبعة خمسة خمسة. هل أحتاج إلى استمارة؟* completes the registration exchange."
