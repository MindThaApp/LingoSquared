course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit81.li_wa_likay: {"title": "In order to", "description": "Say why you do things with li + a verbal noun and likay + a verb, for example why you go to the market, the pharmacy or study a language."}
lessons:
  ar.a2.unit81.li_wa_likay.lesson01.li_masdar: {"title": "To do something"}
  ar.a2.unit81.li_wa_likay.lesson02.likay_verb: {"title": "So that I can"}
  ar.a2.unit81.li_wa_likay.lesson03.two_ways: {"title": "Two ways"}
  ar.a2.unit81.li_wa_likay.lesson04.why_questions: {"title": "Why questions"}
  ar.a2.unit81.li_wa_likay.lesson05.reading_yusuf: {"title": "Yusuf's errands"}
  ar.a2.unit81.li_wa_likay.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit81.li_wa_likay.lesson01.teach.places: {"title": "Places and things", "gloss": "the market / the library / the bread / the books / my friend", "example_gloss": ["I went to the market.", "I went to the library."]}
  ar.a2.unit81.li_wa_likay.lesson01.teach.masdar: {"title": "Verbal nouns", "gloss": "buying / reading / visiting / I went / he went / she went / Layla / Yusuf / to", "example_gloss": ["to buy bread", "to read books", "to visit my friend"]}
  ar.a2.unit81.li_wa_likay.lesson01.teach.gn_li: {"title": "لِ + verbal noun", "gloss": "I went to the market to buy bread. Layla went to the library to read books.", "note": "To say the purpose, put *لِ* before a verbal noun: *لِشِرَاء* (for buying), *لِقِرَاءَة* (for reading). It joins the next word."}
  ar.a2.unit81.li_wa_likay.lesson01.teach.gn_q: {"title": "Why? To ...", "gloss": "Why did you go to the market? I went to buy bread. I went to the library to visit my friend.", "note": "*لِمَاذَا* asks about the purpose, and the answer can start with *لِ* + a verbal noun."}
  ar.a2.unit81.li_wa_likay.lesson02.teach.words: {"title": "In order to", "gloss": "in order to / I buy / I read / I visit / he buys / we visit / our friend", "example_gloss": ["I went in order to buy bread.", "We went in order to visit our friend."]}
  ar.a2.unit81.li_wa_likay.lesson02.teach.gn_likay: {"title": "لِكَيْ + verb", "gloss": "I went to the market in order to buy bread. I went to the library in order to read books.", "note": "*لِكَيْ* is followed by a present-tense verb that ends in *-a*: *أَشْتَرِيَ*, *أَقْرَأَ*. The verb has the same person as the subject."}
  ar.a2.unit81.li_wa_likay.lesson02.teach.gn_likay2: {"title": "Other persons", "gloss": "Yusuf went to the market in order to buy bread. We went in order to visit our friend.", "note": "The prefix matches the subject: *يَشْتَرِيَ* he, *نَزُورَ* we."}
  ar.a2.unit81.li_wa_likay.lesson03.teach.words: {"title": "Study and travel", "gloss": "I study / English / I travel / I travel (after that) / London", "example_gloss": ["I study English.", "I travel to London."]}
  ar.a2.unit81.li_wa_likay.lesson03.teach.gn_two: {"title": "Two ways, one meaning", "gloss": "I went to buy bread. I went in order to buy bread.", "note": "*لِ* + verbal noun and *لِكَيْ* + verb say the same thing. Use the verbal noun when you have a noun for the action."}
  ar.a2.unit81.li_wa_likay.lesson03.teach.gn_study: {"title": "Study and travel", "gloss": "I study English in order to travel to London. I travel to London to visit my friend.", "note": "The same two patterns work with any action: studying, travelling, visiting."}
  ar.a2.unit81.li_wa_likay.lesson04.teach.words: {"title": "Pharmacy and questions", "gloss": "the pharmacy / the medicine / you go / you study", "example_gloss": ["Why do you go to the pharmacy?", "Why do you study English?"]}
  ar.a2.unit81.li_wa_likay.lesson04.teach.gn_qa: {"title": "Ask and answer", "gloss": "Why do you go to the pharmacy? To buy medicine. Why do you study English? In order to travel to London.", "note": "A short answer can be just the purpose: *لِشِرَاء الدَّوَاء* or *لِكَيْ أَسَافِرَ*."}
  ar.a2.unit81.li_wa_likay.lesson04.teach.gn_full: {"title": "Full answers", "gloss": "I went to the pharmacy to buy medicine. I went to the pharmacy in order to buy medicine.", "note": "Both patterns give a full answer."}
  ar.a2.unit81.li_wa_likay.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "yesterday / then", "example_gloss": ["Yesterday I went to the market.", "I went to the market, then I went to the pharmacy."]}
  ar.a2.unit81.li_wa_likay.lesson05.teach.reading: {"title": "Yusuf's errands", "gloss": "Yesterday I went to the market to buy bread, then I went to the pharmacy in order to buy medicine. I study English in order to travel to London.", "note": "Three purposes in one short text."}
  ar.a2.unit81.li_wa_likay.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Why did you go to the market yesterday, Yusuf?"}
  ar.a2.unit81.li_wa_likay.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: I went to buy bread, then I went to the pharmacy in order to buy medicine."}
  ar.a2.unit81.li_wa_likay.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And why do you study English?"}
  ar.a2.unit81.li_wa_likay.lesson06.teach.d4: {"title": "Yusuf explains", "gloss": "Yusuf: In order to travel to London."}
  ar.a2.unit81.li_wa_likay.lesson06.teach.d5: {"title": "Layla reacts", "gloss": "Layla: A lovely idea!"}
exercises:
  ar.a2.unit81.li_wa_likay.lesson01.exercise01.market_bread: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "ذَهَبْتُ إِلَى السُّوق لِشِرَاء الْخُبْز.", "distractors": ["ذَهَبْتُ إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "ذَهَبَ يُوسُف إِلَى السُّوق لِشِرَاء الْخُبْز.", "لِمَاذَا ذَهَبْتَ إِلَى السُّوق؟"], "accepted_answers": [{"value": "ذَهَبْتُ إِلَى السُّوق لِشِرَاء الْخُبْز.", "status": "correct"}], "feedback": "*لِشِرَاء الْخُبْز* = to buy bread."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise02.layla_library: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "ذَهَبَتْ لَيْلَى إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "distractors": ["ذَهَبَتْ لَيْلَى إِلَى السُّوق لِشِرَاء الْخُبْز.", "ذَهَبْتُ إِلَى الْمَكْتَبَة لِزِيَارَة صَدِيقِي.", "ذَهَبَ يُوسُف إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب."], "accepted_answers": [{"value": "ذَهَبَتْ لَيْلَى إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "status": "correct"}], "feedback": "*ذَهَبَتْ* = she went."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise03.match_li: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "السُّوق", "right": "the market"}, {"left": "الْمَكْتَبَة", "right": "the library"}, {"left": "الْخُبْز", "right": "the bread"}, {"left": "الْكُتُب", "right": "the books"}, {"left": "لِشِرَاء", "right": "to buy, for buying"}, {"left": "لِقِرَاءَة", "right": "to read, for reading"}, {"left": "لِزِيَارَة", "right": "to visit, for visiting"}, {"left": "صَدِيقِي", "right": "my friend"}], "status": "correct"}], "feedback": "Places and purposes."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise04.order_market: {"instruction": "Put the words in order to say 'I went to the market to buy bread.'", "correct_option": "ذَهَبْتُ إِلَى السُّوق لِشِرَاء الْخُبْز", "accepted_answers": [{"value": "ذَهَبْتُ إِلَى السُّوق لِشِرَاء الْخُبْز", "status": "correct"}], "feedback": "The purpose comes last."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise05.fill_li: {"instruction": "Fill in the missing word.", "correct_option": "لِقِرَاءَة", "accepted_answers": [{"value": "لِقِرَاءَة", "status": "correct"}], "feedback": "*لِقِرَاءَة* = to read."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise06.tr_why_market: {"instruction": "Translate into Arabic.", "correct_option": "لِمَاذَا ذَهَبْتَ إِلَى السُّوق؟", "accepted_answers": [{"value": "لِمَاذَا ذَهَبْتَ إِلَى السُّوق؟", "status": "correct"}, {"value": "لِمَاذَا ذَهَبْتَ إِلَى السُّوق", "status": "correct"}], "feedback": "*لِمَاذَا* = why."}
  ar.a2.unit81.li_wa_likay.lesson01.exercise07.wr_library: {"instruction": "Write the requested Arabic sentence.", "correct_option": "ذَهَبْتُ إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "accepted_answers": [{"value": "ذَهَبْتُ إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "status": "correct"}, {"value": "ذَهَبْتُ إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب", "status": "correct"}], "feedback": "*لِقِرَاءَة* + the object."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise01.buy_bread: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "ذَهَبْتُ إِلَى السُّوق لِكَيْ أَشْتَرِيَ الْخُبْز.", "distractors": ["ذَهَبْتُ إِلَى الْمَكْتَبَة لِكَيْ أَقْرَأَ الْكُتُب.", "ذَهَبَ يُوسُف إِلَى السُّوق لِكَيْ يَشْتَرِيَ الْخُبْز.", "ذَهَبْتُ إِلَى السُّوق لِكَيْ أَزُورَ صَدِيقِي."], "accepted_answers": [{"value": "ذَهَبْتُ إِلَى السُّوق لِكَيْ أَشْتَرِيَ الْخُبْز.", "status": "correct"}], "feedback": "*لِكَيْ أَشْتَرِيَ* = in order to buy."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise02.we_visit: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "ذَهَبْنَا لِكَيْ نَزُورَ صَدِيقَنَا.", "distractors": ["ذَهَبْتُ لِكَيْ أَزُورَ صَدِيقِي.", "ذَهَبَ يُوسُف لِكَيْ يَشْتَرِيَ الْخُبْز.", "ذَهَبْتُ لِكَيْ أَقْرَأَ الْكُتُب."], "accepted_answers": [{"value": "ذَهَبْنَا لِكَيْ نَزُورَ صَدِيقَنَا.", "status": "correct"}], "feedback": "*نَزُورَ* = we visit."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise03.match_likay: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "لِكَيْ", "right": "in order to"}, {"left": "أَشْتَرِيَ", "right": "I buy"}, {"left": "أَقْرَأَ", "right": "I read"}, {"left": "أَزُورَ", "right": "I visit"}, {"left": "يَشْتَرِيَ", "right": "he buys"}, {"left": "نَزُورَ", "right": "we visit"}, {"left": "صَدِيقَنَا", "right": "our friend"}], "status": "correct"}], "feedback": "In order to."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise04.order_read: {"instruction": "Put the words in order to say 'I went to the library in order to read books.'", "correct_option": "ذَهَبْتُ إِلَى الْمَكْتَبَة لِكَيْ أَقْرَأَ الْكُتُب", "accepted_answers": [{"value": "ذَهَبْتُ إِلَى الْمَكْتَبَة لِكَيْ أَقْرَأَ الْكُتُب", "status": "correct"}], "feedback": "*لِكَيْ* then the verb ending in *-a*."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise05.fill_likay: {"instruction": "Fill in the missing word.", "correct_option": "لِكَيْ", "accepted_answers": [{"value": "لِكَيْ", "status": "correct"}], "feedback": "*لِكَيْ* = in order to."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise06.tr_yusuf_buy: {"instruction": "Translate into Arabic.", "correct_option": "ذَهَبَ يُوسُف إِلَى السُّوق لِكَيْ يَشْتَرِيَ الْخُبْز.", "accepted_answers": [{"value": "ذَهَبَ يُوسُف إِلَى السُّوق لِكَيْ يَشْتَرِيَ الْخُبْز.", "status": "correct"}, {"value": "ذَهَبَ يُوسُف إِلَى السُّوق لِكَيْ يَشْتَرِيَ الْخُبْز", "status": "correct"}], "feedback": "*يَشْتَرِيَ* = he buys."}
  ar.a2.unit81.li_wa_likay.lesson02.exercise07.wr_we_visit: {"instruction": "Write the requested Arabic sentence.", "correct_option": "ذَهَبْنَا لِكَيْ نَزُورَ صَدِيقَنَا.", "accepted_answers": [{"value": "ذَهَبْنَا لِكَيْ نَزُورَ صَدِيقَنَا.", "status": "correct"}, {"value": "ذَهَبْنَا لِكَيْ نَزُورَ صَدِيقَنَا", "status": "correct"}], "feedback": "*نَزُورَ* = we visit."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise01.study_london: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَسَافِرَ إِلَى لَنْدَن.", "distractors": ["أَسَافِرُ إِلَى لَنْدَن لِزِيَارَة صَدِيقِي.", "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَقْرَأَ الْكُتُب.", "أَدْرُسُ الْإِنْجْلِيزِيَّة لِزِيَارَة صَدِيقِي."], "accepted_answers": [{"value": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَسَافِرَ إِلَى لَنْدَن.", "status": "correct"}], "feedback": "*أَسَافِرَ* ends in *-a* after *لِكَيْ*."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise02.london_friend: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَسَافِرُ إِلَى لَنْدَن لِزِيَارَة صَدِيقِي.", "distractors": ["أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَسَافِرَ إِلَى لَنْدَن.", "ذَهَبْتُ إِلَى الْمَكْتَبَة لِقِرَاءَة الْكُتُب.", "أَسَافِرُ إِلَى لَنْدَن لِشِرَاء الْخُبْز."], "accepted_answers": [{"value": "أَسَافِرُ إِلَى لَنْدَن لِزِيَارَة صَدِيقِي.", "status": "correct"}], "feedback": "*لِزِيَارَة صَدِيقِي* = to visit my friend."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise03.match_two: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "أَدْرُسُ", "right": "I study"}, {"left": "الْإِنْجْلِيزِيَّة", "right": "English"}, {"left": "أَسَافِرُ", "right": "I travel"}, {"left": "لَنْدَن", "right": "London"}, {"left": "لِكَيْ", "right": "in order to"}, {"left": "لِزِيَارَة", "right": "to visit"}, {"left": "لِشِرَاء", "right": "to buy"}], "status": "correct"}], "feedback": "Study and travel."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise04.order_study: {"instruction": "Put the words in order to say 'I study English in order to travel to London.'", "correct_option": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَسَافِرَ إِلَى لَنْدَن", "accepted_answers": [{"value": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَسَافِرَ إِلَى لَنْدَن", "status": "correct"}], "feedback": "Purpose last."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise05.fill_lizyara: {"instruction": "Fill in the missing word.", "correct_option": "لِزِيَارَة", "accepted_answers": [{"value": "لِزِيَارَة", "status": "correct"}], "feedback": "*لِزِيَارَة* + the noun."}
  ar.a2.unit81.li_wa_likay.lesson03.exercise06.tr_study_books: {"instruction": "Translate into Arabic.", "correct_option": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَقْرَأَ الْكُتُب.", "accepted_answers": [{"value": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَقْرَأَ الْكُتُب.", "status": "correct"}, {"value": "أَدْرُسُ الْإِنْجْلِيزِيَّة لِكَيْ أَقْرَأَ الْكُتُب", "status": "correct"}], "feedback": "*لِكَيْ أَقْرَأَ*."}
