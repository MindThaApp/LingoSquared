teaching:
  ar.b1.unit47.lesson01.teach.laytani: {title: "I wish I had", gloss: "I wish I had", note: "*ليتني* + a past-tense verb expresses a wish about the past.", example_gloss: "I wish I had attended the party."}
  ar.b1.unit47.lesson01.teach.hadartu_hafla: {title: "I attended a party", gloss: "I attended a party", note: "*حضرت حفلة* means I attended a party.", example_gloss: "I wish I had attended your birthday party."}
  ar.b1.unit47.lesson01.teach.id_miladik: {title: "Your birthday", gloss: "your birthday", note: "*عيد ميلادك* means your birthday. Said to a man (here Yusuf) it is read ʿīd mīlādika; to a woman, ʿīd mīlādiki - the spelling is the same.", example_gloss: "I wish I had attended your birthday party."}
  ar.b1.unit47.lesson01.teach.alshahr_almadi: {title: "Last month", gloss: "last month", note: "*الشهر الماضي* means last month.", example_gloss: "I wish I had attended your birthday party last month."}
  ar.b1.unit47.lesson01.teach.laila_laytani: {title: "Layla expresses a past wish", gloss: "I wish I had attended your birthday party last month.", note: "*ليتني* + a past-tense verb links the wish to the missed event.", example_gloss: "Layla said: I wish I had attended your birthday party last month."}
  ar.b1.unit47.lesson02.teach.kuntu_maridatan: {title: "I was sick that night", gloss: "I was sick that night", note: "*كنت مريضة تلك الليلة* means I was sick that night.", example_gloss: "Layla said: I was sick that night."}
  ar.b1.unit47.lesson02.teach.kana_yajib_an: {title: "I should have", gloss: "I should have", note: "*كان يجب أن* + a subjunctive present verb expresses a should-have-done regret.", example_gloss: "I should have told you about that earlier."}
  ar.b1.unit47.lesson02.teach.ukhbiruka_bidhalika: {title: "Tell you about that earlier", gloss: "tell you about that earlier", note: "*أخبرك بذلك مبكرا* means tell you about that earlier. After أن the verb is in the subjunctive: ʾukhbiraka (to a man, here Yusuf) or ʾukhbiraki (to a woman) - the spelling is the same.", example_gloss: "I should have told you about that earlier."}
  ar.b1.unit47.lesson02.teach.laila_kana_yajib: {title: "Layla states her regret", gloss: "I should have told you about that earlier.", note: "*كان يجب أن* + a subjunctive present verb links the past situation to what she should have done.", example_gloss: "Layla said: I should have told you about that earlier."}
  ar.b1.unit47.lesson03.teach.lamadha_lam_tahduri: {title: "Why didn't you attend?", gloss: "why didn't you attend?", note: "*لماذا لم تحضري؟* asks Layla why she missed the party. لم + the jussive makes a past negative: تحضري (to a woman) has no final ن (compare تحضرين, you attend); to a man it is لماذا لم تحضر؟", example_gloss: "Yusuf said: Why didn't you attend?"}
  ar.b1.unit47.lesson03.teach.laila_answer: {title: "Layla explains and regrets", gloss: "I was sick that night. I should have told you about that earlier.", note: "This continues the dialogue, giving the reason and the regret.", example_gloss: "Layla said: I was sick that night. I should have told you about that earlier."}
