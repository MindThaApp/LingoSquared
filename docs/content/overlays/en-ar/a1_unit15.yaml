review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar a1_unit15_comparisons. Review 2026-10-19: 8 fixes - 6 example_glosses dropped the Layla/Yusuf/Noor said: frame; line04 gloss/note/example_gloss follow the realization dialogue fix (Noor: And the market is bigger than the cafe); line01 note was vague (links preferences to comparisons) and ماذا تفضل؟ is masculine-only, now gives تفضلين; than note now says من is the same word as from (unit 02); bigger/smaller notes were vague, now explain the shared a- comparative pattern (أكبر from كبير) and that it does not change for masculine/feminine; closer gloss disambiguated as closer (nearer) (closer is also one who closes); transliterations added. NATIVE FLAGS: none."}
course: {title: Arabic A1, description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."}
units:
  ar.a1.unit15.comparisons: {title: "Comparisons"}
lessons:
  ar.a1.unit15.lesson01.basic_comparisons: {title: "Bigger and smaller"}
  ar.a1.unit15.lesson02.compare_choices: {title: "Closer and cheaper"}
teaching:
  ar.a1.unit15.lesson01.teach.than: {title: "Than", gloss: "than", note: "من (min) is the same word as from (أنا من لبنان); after a comparison word it means than.", example_gloss: "The market is bigger than the cafe."}
  ar.a1.unit15.lesson01.teach.bigger: {title: "Bigger", gloss: "bigger", note: "أكبر (akbar) comes from كبير (kabīr, big). Comparison words like أكبر, أصغر, أقرب and أرخص all start with أ and keep the same form for masculine and feminine nouns.", example_gloss: "The market is bigger than the cafe."}
  ar.a1.unit15.lesson01.teach.smaller: {title: "Smaller", gloss: "smaller", note: "أصغر (aṣghar), smaller, has the same أ pattern as أكبر.", example_gloss: "The cafe is smaller than the market."}
  ar.a1.unit15.lesson01.teach.nearer: {title: "Closer", gloss: "closer (nearer)", note: "أقرب (aqrab) compares distance: closer, nearer.", example_gloss: "The cafe is closer than the market."}
  ar.a1.unit15.lesson01.teach.bigger_sentence: {title: "The market is bigger", gloss: "The market is bigger than the cafe", note: "Arabic does not need a separate word for 'is' in this comparison.", example_gloss: "Yusuf said: The market is bigger than the cafe."}
  ar.a1.unit15.lesson02.teach.nearer: {title: "Closer", gloss: "closer (nearer)", note: "أقرب (aqrab) compares distance: closer, nearer.", example_gloss: "The cafe is closer than the market."}
  ar.a1.unit15.lesson02.teach.cheaper: {title: "Cheaper", gloss: "cheaper", note: "أرخص (arkhaṣ) compares price: cheaper.", example_gloss: "Water is cheaper than coffee."}
  ar.a1.unit15.lesson02.teach.nearer_sentence: {title: "The cafe is closer", gloss: "The cafe is closer than the market", note: "Keep من before the second item.", example_gloss: "Yusuf said: The cafe is closer than the market."}
  ar.a1.unit15.lesson02.teach.line01: {title: "Ask a preference", gloss: "Layla asks what Yusuf prefers.", note: "Layla says تفضل (tufaḍḍil) because she is asking a man; to a woman: ماذا تفضلين؟", example_gloss: "Layla said: What do you prefer?"}
  ar.a1.unit15.lesson02.teach.line02: {title: "Prefer the cafe", gloss: "Yusuf says he prefers the cafe.", note: "أفضل can take a place as the preferred option.", example_gloss: "Yusuf said: I prefer the cafe."}
  ar.a1.unit15.lesson02.teach.line03: {title: "Compare distance", gloss: "Yusuf says the cafe is closer than the market.", note: "أقرب من gives the reason.", example_gloss: "Yusuf said: The cafe is closer than the market."}
  ar.a1.unit15.lesson02.teach.line04: {title: "Compare size", gloss: "Noor adds that the market is bigger than the cafe.", note: "والسوق (was-sūq) is و (and) joined to السوق: and the market.", example_gloss: "Noor said: And the market is bigger than the cafe."}
exercises:
  ar.a1.unit15.lesson01.exercise01.recognize_bigger:
    instruction: "Select the meaning."
    correct_option: bigger
    distractors: [smaller, cheaper, tomorrow]
    accepted_answers: [{value: bigger, status: correct}]
    feedback: "أكبر means bigger."
  ar.a1.unit15.lesson01.exercise02.listen_nearer:
    instruction: "Listen and select what you hear."
    correct_option: "The cafe is closer than the market."
    distractors: ["The cafe is smaller than the market.", "The market is bigger than the cafe.", "Water is cheaper than coffee."]
    accepted_answers: [{value: "The cafe is closer than the market.", status: correct}]
    feedback: "You heard المقهى أقرب من السوق."
  ar.a1.unit15.lesson01.exercise03.match_comparison_words:
    instruction: "Match each Arabic comparison word with its meaning."
    accepted_answers:
      - value: {أكبر: bigger, أصغر: smaller, من: than, السوق: market}
        status: correct
    feedback: "These words build a basic comparison."
  ar.a1.unit15.lesson01.exercise04.order_bigger:
    instruction: "Arrange the Arabic words for The market is bigger than the cafe."
    accepted_answers: [{value: [السوق, أكبر, من, المقهى], status: correct}]
    feedback: "السوق أكبر من المقهى is a basic comparison."
  ar.a1.unit15.lesson01.exercise05.translate_smaller:
    instruction: "Translate into Arabic: The cafe is smaller than the market."
    accepted_answers:
      - {value: "المقهى أصغر من السوق", status: correct}
      - {value: "المقهى أصغر من السوق.", status: correct}
    feedback: "المقهى أصغر من السوق compares cafe and market."
  ar.a1.unit15.lesson01.exercise06.write_bigger:
    instruction: "Type The market is bigger than the cafe in Arabic."
    accepted_answers:
      - {value: "السوق أكبر من المقهى", status: correct}
      - {value: "السوق أكبر من المقهى.", status: correct}
    feedback: "السوق أكبر من المقهى is the requested comparison."
  ar.a1.unit15.lesson01.exercise07.dictation_nearer_cafe: {correct_response: "المقهى أقرب من السوق.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit15.lesson02.exercise01.recognize_cheaper:
    instruction: "Select the meaning."
    correct_option: cheaper
    distractors: [closer, bigger, every]
    accepted_answers: [{value: cheaper, status: correct}]
    feedback: "أرخص means cheaper."
  ar.a1.unit15.lesson02.exercise02.dialogue_comparison:
    instruction: "Why does Yusuf prefer the cafe?"
    correct_option: "It is closer than the market."
    distractors: ["It is cheaper than water.", "It is bigger than the market.", "It is at five o'clock."]
    accepted_answers: [{value: "It is closer than the market.", status: correct}]
    feedback: "Yusuf says المقهى أقرب من السوق."
  ar.a1.unit15.lesson02.exercise03.match_comparison_lines:
    instruction: "Match each Arabic comparison with its meaning."
    accepted_answers:
      - value: {"المقهى أقرب من السوق": "The cafe is closer than the market", "الماء أرخص من القهوة": "Water is cheaper than coffee"}
        status: correct
    feedback: "Both sentences compare two familiar options."
  ar.a1.unit15.lesson02.exercise04.order_cheaper:
    instruction: "Arrange the Arabic words for Water is cheaper than coffee."
    accepted_answers: [{value: [الماء, أرخص, من, القهوة], status: correct}]
    feedback: "الماء أرخص من القهوة compares price."
  ar.a1.unit15.lesson02.exercise05.say_comparison:
    instruction: "Type the Arabic comparison: The cafe is closer than the market."
    accepted_answers:
      - {value: "المقهى أقرب من السوق", status: correct}
      - {value: "المقهى أقرب من السوق.", status: correct}
    feedback: "المقهى أقرب من السوق is the requested comparison."
  ar.a1.unit15.lesson02.exercise06.write_basic_comparison:
    instruction: "Type Water is cheaper than coffee in Arabic."
    accepted_answers:
      - {value: "الماء أرخص من القهوة", status: correct}
      - {value: "الماء أرخص من القهوة.", status: correct}
    feedback: "الماء أرخص من القهوة writes a basic comparison."
