  ar.a2.unit78.bada_tu_ajri.lesson01.exercise02.we_started_swim: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَدَأْنَا نَسْبَحُ.", "distractors": ["بَدَأْتُ أَسْبَحُ.", "بَدَأَ يُوسُف يَسْبَحُ.", "بَدَأْتَ تَسْبَحُ."], "accepted_answers": [{"value": "بَدَأْنَا نَسْبَحُ.", "status": "correct"}], "feedback": "*بَدَأْنَا نَسْبَحُ* = we started swimming."}
