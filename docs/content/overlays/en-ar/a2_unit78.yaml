  ar.a2.unit78.bada_tu_ajri.lesson03.exercise06.tr_yusuf_tried: {"instruction": "Translate into Arabic.", "correct_option": "حَاوَلَ يُوسُف أَنْ يَنَامَ مُبَكِّرًا.", "accepted_answers": [{"value": "حَاوَلَ يُوسُف أَنْ يَنَامَ مُبَكِّرًا.", "status": "correct"}, {"value": "حَاوَلَ يُوسُف أَنْ يَنَامَ مُبَكِّرًا", "status": "correct"}], "feedback": "*يَنَامَ* = he sleeps."}
  ar.a2.unit78.bada_tu_ajri.lesson03.exercise07.wr_we_tried: {"instruction": "Write the requested Arabic sentence.", "correct_option": "حَاوَلْنَا أَنْ نَقْرَأَ الْكِتَاب.", "accepted_answers": [{"value": "حَاوَلْنَا أَنْ نَقْرَأَ الْكِتَاب.", "status": "correct"}, {"value": "حَاوَلْنَا أَنْ نَقْرَأَ الْكِتَاب", "status": "correct"}], "feedback": "*نَقْرَأَ* = we read."}
