review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings; the subjunctive after an keeps the fatha ending; bada'a takes a bare present verb, tawaqqafa takes 'an plus a verbal noun. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit78.bada_tu_ajri: {"title": "I started running", "description": "Say what you started, stopped, tried or forgot to do, for example a sport, a habit or screen time, with bada'a, tawaqqafa 'an, hawala an and nasiya an."}
lessons:
  ar.a2.unit78.bada_tu_ajri.lesson01.badatu: {"title": "I started"}
  ar.a2.unit78.bada_tu_ajri.lesson02.tawaqqaftu: {"title": "I stopped"}
  ar.a2.unit78.bada_tu_ajri.lesson03.hawaltu_an: {"title": "I tried to"}
  ar.a2.unit78.bada_tu_ajri.lesson04.nasitu_an: {"title": "I forgot to"}
  ar.a2.unit78.bada_tu_ajri.lesson05.reading_yusuf: {"title": "Yusuf's habits"}
  ar.a2.unit78.bada_tu_ajri.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit78.bada_tu_ajri.lesson01.teach.words: {"title": "Sports words", "gloss": "football / the gym / I run / I play / I swim", "example_gloss": ["I started running.", "I started playing football.", "I started going to the gym."]}
  ar.a2.unit78.bada_tu_ajri.lesson01.teach.time: {"title": "Since and month", "gloss": "since, ago / month", "example_gloss": ["I started playing football a month ago.", "Yusuf started swimming a month ago."]}
  ar.a2.unit78.bada_tu_ajri.lesson01.teach.gn_bada: {"title": "بَدَأَ + present tense", "gloss": "I started running. Yusuf started running.", "note": "After *بَدَأَ* put the present-tense verb directly, with no *أَنْ*. Both verbs agree with the person: *بَدَأْتُ أَجْرِي*, *بَدَأَ يَجْرِي*."}
  ar.a2.unit78.bada_tu_ajri.lesson01.teach.gn_pers: {"title": "Started, for each person", "gloss": "I started swimming. We started swimming. You (masc.) started swimming. You (fem.) started swimming.", "note": "Both verbs change: *بَدَأْتُ أَسْبَحُ*, *بَدَأْنَا نَسْبَحُ*. For a woman the endings are *بَدَأْتِ تَسْبَحِينَ*."}
  ar.a2.unit78.bada_tu_ajri.lesson02.teach.words: {"title": "Habits to stop", "gloss": "staying up late / running / drinking coffee / using the phone / the night", "example_gloss": ["I stopped staying up late.", "I stopped using the phone at night."]}
  ar.a2.unit78.bada_tu_ajri.lesson02.teach.gn_tawaqqaf: {"title": "تَوَقَّفَ عَنْ + noun", "gloss": "I stopped running. I stopped drinking coffee.", "note": "*تَوَقَّفَ عَنْ* means stop. After *عَنْ* comes a noun that names the activity, not a verb. *عَنْ* becomes *عَنِ* before *ال*."}
  ar.a2.unit78.bada_tu_ajri.lesson02.teach.gn_contrast: {"title": "Start or stop", "gloss": "I started running. I stopped running.", "note": "Start takes a verb directly (*أَجْرِي*). Stop takes *عَنْ* and a noun (*الْجَرْي*)."}
  ar.a2.unit78.bada_tu_ajri.lesson02.teach.gn_pers: {"title": "Other persons", "gloss": "Yusuf stopped drinking coffee. We stopped using the phone.", "note": "Only the verb ending changes with the person: *تَوَقَّفَ* he, *تَوَقَّفْنَا* we."}
  ar.a2.unit78.bada_tu_ajri.lesson03.teach.words: {"title": "Things I tried", "gloss": "I sleep / I read / early / the book", "example_gloss": ["I tried to sleep early.", "I tried to read the book."]}
  ar.a2.unit78.bada_tu_ajri.lesson03.teach.gn_hawal: {"title": "حَاوَلَ أَنْ", "gloss": "I tried to sleep early.", "note": "*حَاوَلَ أَنْ* means try to. After *أَنْ* the verb ends in *-a*, and it has the same person as the first verb."}
  ar.a2.unit78.bada_tu_ajri.lesson03.teach.gn_pers: {"title": "Tried, for each person", "gloss": "Yusuf tried to sleep early. We tried to read the book.", "note": "*حَاوَلَ* he tried, *حَاوَلْنَا* we tried. The second verb takes the matching prefix: *يَنَامَ*, *نَقْرَأَ*."}
  ar.a2.unit78.bada_tu_ajri.lesson03.teach.gn_contrast: {"title": "Start or try", "gloss": "I started reading. I tried to read.", "note": "After *بَدَأَ* there is no *أَنْ* and the verb ends in *-u*. After *حَاوَلَ* there is *أَنْ* and the verb ends in *-a*."}
  ar.a2.unit78.bada_tu_ajri.lesson04.teach.words: {"title": "Things I forgot", "gloss": "I forgot / he forgot / I close / I turn off / I bring / the door / the phone", "example_gloss": ["I forgot to close the door.", "I forgot to bring the book."]}
  ar.a2.unit78.bada_tu_ajri.lesson04.teach.gn_nasiya: {"title": "نَسِيَ أَنْ + verb", "gloss": "I forgot to close the door. I forgot the book.", "note": "*نَسِيَ أَنْ* + verb means forget to do something. *نَسِيَ* + a noun means forget a thing."}
  ar.a2.unit78.bada_tu_ajri.lesson04.teach.gn_pers: {"title": "Forgot, for each person", "gloss": "Yusuf forgot to turn off the phone. We forgot to close the door.", "note": "*نَسِيَ* he, *نَسِينَا* we. The verb after *أَنْ* ends in *-a* and has the matching prefix."}
  ar.a2.unit78.bada_tu_ajri.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "every morning / but / yesterday", "example_gloss": ["I started running every morning.", "I forgot to turn off the phone yesterday."]}
  ar.a2.unit78.bada_tu_ajri.lesson05.teach.reading: {"title": "Yusuf's new habits", "gloss": "A month ago I started running every morning. I stopped staying up late. I tried to sleep early, but I forgot to turn off the phone yesterday.", "note": "Start, stop, try and forget in one short text."}
  ar.a2.unit78.bada_tu_ajri.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Have you started a new sport, Yusuf?"}
  ar.a2.unit78.bada_tu_ajri.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: Yes, Layla, I started running a month ago."}
  ar.a2.unit78.bada_tu_ajri.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And did you stop staying up late?"}
  ar.a2.unit78.bada_tu_ajri.lesson06.teach.d4: {"title": "Yusuf admits", "gloss": "Yusuf: I tried to sleep early, but I forgot to turn off the phone yesterday."}
  ar.a2.unit78.bada_tu_ajri.lesson06.teach.d5: {"title": "Layla reassures him", "gloss": "Layla: Never mind! I also forgot to close the door."}
exercises:
