review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for ar's fifth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English has one general "please"/"could you" register ladder;
    Arabic's casual-vs-formal split here is lexical and structural
    (ممكن vs. هل يمكن/أرجو), not just politeness marking -- kept
    distinct per lesson; (2) the fixed opening/closing formulas (تحية
    طيبة وبعد / وتفضلوا بقبول فائق الاحترام) have no compositional
    English translation -- glossed as fixed formulas, not word-for-word;
    (3) سيادتكم (your excellency, formal plural-of-respect) has no
    direct English equivalent -- glossed by function. No sibling-
    direction file (ar-en b2) was consulted.
    Review 2026-10-19: 11 fixes - lesson04 listen_formal_institution
    keyed 'Greetings.' and fed back 'You heard تحية طيبة وبعد' although
    its audio is أرجو من سيادتكم تغيير الموعد، من فضلكم (answer,
    distractors, feedback rewritten); lesson06
    comprehend_casual/formal_phrasing used distractors Layla herself
    says in the audio (replaced); match_friend_words paired تمام
    'perfect / all set' with طيب 'alright' (interchangeable, طيب pair
    swapped for نغيّر review); لكل مقام مقال glossed with the
    wrong-sense English idiom 'there's a saying for every occasion' (now
    'every situation calls for its own words'); الموعد غدا example
    glossed 'I have an appointment tomorrow' (now 'The appointment is
    tomorrow'); listen_casual distractor 'Is it possible to change the
    appointment?' was a valid rendering of ممكن نغيّر الموعد (replaced);
    garbled listen_tahiyya feedback; added accepted answers طيب لا
    مشكلة, vocative without يا (صديقي ممكن نغيّر الموعد...), شكرا
    لتعاونكم without و; Arabic comma/question mark added to four
    teaching examples. NATIVE FLAGS: whether ممكن نغيّر الموعد reads as
    casual written MSA rather than colloquial; سيادتكم vs حضرتكم for an
    unnamed institution; أرجو ... من فضلكم double politeness; Layla
    calling her colleague Yusuf يا صديقي; pre-existing hamza-less
    accepted variants (ان, الاولى) kept under add-never-remove.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: adapt register to
    audience and purpose -- convey the same request appropriately to a
    close friend (casual, direct MSA: ممكن، مرحبا، مع تحياتي) and to an
    institution (formal MSA: هل يمكن، أرجو، سيادتكم، تحية طيبة وبعد،
    وتفضلوا بقبول فائق الاحترام), recognizing which forms are too
    casual or too stiff for a given setting.

