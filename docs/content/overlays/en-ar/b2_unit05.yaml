    feedback: "*وتفضلوا بقبول فائق الاحترام* is the formal-institution closing; *مع تحياتي* is the casual one."
  ar.b2.unit05.lesson02.exercise08.dictation_tahiyya:
    instruction: "Type what you hear."
    correct_response: "تحية طيبة وبعد"
