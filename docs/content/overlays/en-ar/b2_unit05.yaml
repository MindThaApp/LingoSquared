    gloss: "my friend"
    example_gloss: "My friend works with me."
  ar.b2.unit05.lesson03.teach.ya:
    title: "O (vocative)"
    gloss: "O... (vocative particle, used before a name or term of address)"
    example_gloss: "My friend, are you here?"
  ar.b2.unit05.lesson03.teach.casual_friend_model:
    title: "My friend, can we change the appointment? Okay?"
    gloss: "My friend, can we change the appointment? Okay?"
    note: "A vocative address (*يا صديقي*) plus a casual tag question (*تمام؟*) -- the everyday texture of addressing a friend."
  ar.b2.unit05.lesson03.teach.la_mushkila:
    title: "no problem"
