  ar.b2.unit05.lesson02.teach.formal_greeting_model:
    title: "Greetings. Is it possible to change the appointment? Please accept the utmost respect."
    gloss: "Greetings. Is it possible to change the appointment? Please accept the utmost respect."
    note: "A complete formal message: formal opener + formal request + formal closer."
  ar.b2.unit05.lesson02.teach.alsayyid_almuhtaram:
    title: "Dear Sir"
    gloss: "dear sir / esteemed Mister (formal salutation)"
  ar.b2.unit05.lesson02.teach.grammar_tahiyya:
    title: "Hi, regards. Greetings, please accept the utmost respect."
    gloss: "Hi, regards. Greetings, please accept the utmost respect."
    note: "The opening/closing ladder: *مرحبا* / *مع تحياتي* (casual) versus *تحية طيبة وبعد* / *وتفضلوا بقبول فائق الاحترام* (formal) -- fixed pairs, not mixed across registers."

  ar.b2.unit05.lesson03.teach.tamam:
