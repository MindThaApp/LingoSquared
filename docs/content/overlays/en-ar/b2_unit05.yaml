  ar.b2.unit05.lesson01.teach.formal_model2:
    title: "I request changing the appointment."
    gloss: "I request changing the appointment."
    note: "*أرجو* + verbal noun is even more formal than *هل يمكن* -- a direct written request, common in official correspondence."
