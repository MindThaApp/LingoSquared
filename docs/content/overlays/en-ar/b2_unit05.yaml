    feedback: "*تحية طيبة وبعد. هل يمكن تغيير الموعد؟ وتفضلوا بقبول فائق الاحترام.* is the full formal message."
  ar.b2.unit05.lesson02.exercise07.recognize_most_formal_closing:
    instruction: "Which closing is more formal?"
