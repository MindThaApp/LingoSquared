  ar.b2.unit05.lesson02.exercise01.recognize_marhaban:
    instruction: "What does this word mean?"
    correct_option: "hi (casual)"
    distractors: ["greetings (formal)", "regards (casual)", "thank you"]
    accepted_answers: [{value: "hi (casual)", status: correct}]
    feedback: "*مرحبا* is the casual greeting."
  ar.b2.unit05.lesson02.exercise02.listen_tahiyya:
    instruction: "Listen and select what you hear."
    correct_option: "Greetings."
    distractors: ["Hi.", "Regards.", "Please accept the utmost respect."]
    accepted_answers: [{value: "Greetings.", status: correct}]
    feedback: "*تحية طيبة وبعد* opens formal correspondence -- it means roughly 'greetings, and then...' (the letter continues)."
  ar.b2.unit05.lesson02.exercise03.match_greeting_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {مرحبا: "hi (casual)", "مع تحياتي": "regards (casual)", "تحية طيبة وبعد": "greetings (formal opener)", "وتفضلوا بقبول فائق الاحترام": "please accept the utmost respect (formal closer)", "السيد المحترم": "dear sir (formal salutation)", الموعد: "the appointment (review)"}
        status: correct
