      - {value: "هل يمكن أن نغيّر الموعد", status: correct}
      - {value: "هل يمكن أن نغيّر الموعد؟", status: correct}
      - {value: "هل يمكن ان نغيّر الموعد", status: correct}
      - {value: "هل يمكن ان نغيّر الموعد؟", status: correct}
    feedback: "*هل يمكن تغيير الموعد؟* means is it possible to change the appointment?"
  ar.b2.unit05.lesson01.exercise06.translate_arju:
    instruction: "Translate into Arabic: I request changing the appointment."
    accepted_answers:
      - {value: "أرجو تغيير الموعد", status: correct}
      - {value: "أرجو تغيير الموعد.", status: correct}
    feedback: "*أرجو تغيير الموعد* means I request changing the appointment."
  ar.b2.unit05.lesson01.exercise07.write_casual:
    instruction: "Write in Arabic, casual register: Can we change the appointment?"
    accepted_answers:
      - {value: "ممكن نغيّر الموعد", status: correct}
      - {value: "ممكن نغيّر الموعد؟", status: correct}
    feedback: "*ممكن نغيّر الموعد؟* means can we change the appointment?"
  ar.b2.unit05.lesson01.exercise08.dictation_casual:
    instruction: "Type what you hear."
    correct_response: "ممكن نغيّر الموعد"
