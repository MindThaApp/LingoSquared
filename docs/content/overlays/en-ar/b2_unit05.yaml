exercises:
  ar.b2.unit05.lesson01.exercise01.recognize_mumkin:
    instruction: "What does this word mean?"
    correct_option: "can...? (casual)"
    distractors: ["is it possible...? (formal)", "I request (formal)", "thank you"]
    accepted_answers: [{value: "can...? (casual)", status: correct}]
    feedback: "*ممكن* is the everyday casual way to ask permission or make a request."
  ar.b2.unit05.lesson01.exercise02.listen_casual:
    instruction: "Listen and select what you hear."
    correct_option: "Can we change the appointment?"
    distractors: ["Can we cancel the appointment?", "Can we change the plan?", "Can we change the meeting?"]
    accepted_answers: [{value: "Can we change the appointment?", status: correct}]
    feedback: "*ممكن نغيّر الموعد؟* means can we change the appointment?"
  ar.b2.unit05.lesson01.exercise03.match_request_forms:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {الموعد: "the appointment", "ممكن...؟": "can...? (casual)", نغيّر: "we change", "هل يمكن...؟": "is it possible...? (formal)", تغيير: changing, أرجو: "I request (formal)", "أرجو تغيير الموعد": "I request changing the appointment"}
        status: correct
    feedback: "These are this lesson's request-making words, casual and formal."
  ar.b2.unit05.lesson01.exercise04.order_casual:
    instruction: "Put the words in order: Can we change the appointment?"
    accepted_answers:
