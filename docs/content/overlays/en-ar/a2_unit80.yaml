  ar.a2.unit80.qabla_an_wa_baada_an.lesson02.exercise06.tr_arrived: {"instruction": "Translate into Arabic.", "correct_option": "بَعْدَ أَنْ وَصَلْتُ إِلَى الْبَيْت، نِمْتُ.", "accepted_answers": [{"value": "بَعْدَ أَنْ وَصَلْتُ إِلَى الْبَيْت، نِمْتُ.", "status": "correct"}, {"value": "بَعْدَ أَنْ وَصَلْتُ إِلَى الْبَيْت، نِمْتُ", "status": "correct"}, {"value": "نِمْتُ بَعْدَ أَنْ وَصَلْتُ إِلَى الْبَيْت.", "status": "correct"}, {"value": "نِمْتُ بَعْدَ أَنْ وَصَلْتُ إِلَى الْبَيْت", "status": "correct"}], "feedback": "Both verbs are past forms."}
