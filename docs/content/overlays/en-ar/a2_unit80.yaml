course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit80.qabla_an_wa_baada_an: {"title": "Before, after, when", "description": "Put events in order with qabla an, ba3da an, 3indama, awwalan and thumma, for example when you say what you did after work."}
lessons:
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.qabla_an: {"title": "Before"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson02.baada_an: {"title": "After"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson03.indama_thumma: {"title": "When and then"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson04.tartib: {"title": "Ordering events"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson05.reading_yusuf: {"title": "Yusuf's evening"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.teach.words: {"title": "Daily actions", "gloss": "I drink / the coffee / I go / to / work / I read / the message / I sleep", "example_gloss": ["I drink coffee.", "I read the message."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.teach.other: {"title": "Other persons", "gloss": "he drinks / he reads / he sleeps / we drink", "example_gloss": ["Yusuf reads the message before he sleeps."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.teach.gn_qabla: {"title": "قَبْلَ أَنْ + verb", "gloss": "I drink coffee before I go to work. I read the message before I sleep.", "note": "*قَبْلَ أَنْ* means before. The verb after it is in the present form with the ending *-a*: *أَذْهَبَ*, *أَنَامَ*."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.teach.gn_qabla2: {"title": "Other persons", "gloss": "Yusuf drinks coffee before he goes to work. We drink coffee before we go to work.", "note": "Both verbs have the same subject and the same person prefix: *يَشْرَبُ ... يَذْهَبَ*, *نَشْرَبُ ... نَذْهَبَ*."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson02.teach.words: {"title": "Past actions", "gloss": "breakfast / the tea / I ate / he ate / I drank / he drank / I arrived / the house, home", "example_gloss": ["I ate breakfast.", "Yusuf drank tea.", "I arrived at home."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson02.teach.gn_baada: {"title": "بَعْدَ أَنْ + past verb", "gloss": "After I ate breakfast, I went to work. After I arrived at home, I slept.", "note": "*بَعْدَ أَنْ* means after. The verb after it is a past form: *أَكَلْتُ*, *وَصَلْتُ*."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson02.teach.gn_baada2: {"title": "Either order", "gloss": "After Yusuf ate breakfast, he drank tea. I drank coffee after I ate.", "note": "The *بَعْدَ أَنْ* clause can come first or last. The meaning is the same."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson03.teach.words: {"title": "When, first, then", "gloss": "when / first / then / dinner / she cooked / Layla / he arrived", "example_gloss": ["When I arrived at work, I drank coffee.", "First I ate breakfast, then I went to work."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson03.teach.gn_indama: {"title": "عِنْدَمَا + past verb", "gloss": "When I arrived at work, I drank coffee. When Yusuf arrived at home, Layla cooked dinner.", "note": "*عِنْدَمَا* means when. Like *بَعْدَ أَنْ*, it is followed by a past form: *وَصَلْتُ*, *وَصَلَ*."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson03.teach.gn_thumma: {"title": "أَوَّلًا ... ثُمَّ", "gloss": "First I ate breakfast, then I went to work.", "note": "*أَوَّلًا* first and *ثُمَّ* then give the order of two actions in two short clauses."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson04.teach.words: {"title": "I read", "gloss": "I read (past)", "example_gloss": ["I read the message before I slept."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson04.teach.gn_contrast: {"title": "Before or after", "gloss": "I drank tea before I slept. I drank tea after I ate dinner.", "note": "After *قَبْلَ أَنْ* the verb ends in *-a*, even when the story is in the past. After *بَعْدَ أَنْ* it is a past form."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson04.teach.gn_front: {"title": "Clause first", "gloss": "Before I sleep, I read the message. After I ate dinner, I drank tea.", "note": "Any time clause can come at the start of the sentence, followed by a comma."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson05.teach.text_words: {"title": "Evening", "gloss": "evening", "example_gloss": ["Yusuf's evening."]}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson05.teach.reading: {"title": "Yusuf's evening", "gloss": "When I arrived at home, I ate dinner. After I ate, I read the message. Before I slept, I drank tea.", "note": "Three events in order with *عِنْدَمَا*, *بَعْدَ أَنْ* and *قَبْلَ أَنْ*."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: What did you do yesterday after work, Yusuf?"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: When I arrived at home, I ate dinner."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And what did you do after that?"}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.teach.d4: {"title": "Yusuf continues", "gloss": "Yusuf: I read the message, then I drank tea before I slept."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson06.teach.d5: {"title": "Layla agrees", "gloss": "Layla: I also drink tea before I sleep."}
exercises:
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.exercise01.coffee_work: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَشْرَبُ الْقَهْوَة قَبْلَ أَنْ أَذْهَبَ إِلَى الْعَمَل.", "distractors": ["أَقْرَأُ الرِّسَالَة قَبْلَ أَنْ أَنَامَ.", "أَشْرَبُ الْقَهْوَة قَبْلَ أَنْ أَنَامَ.", "يَشْرَبُ يُوسُف الْقَهْوَة قَبْلَ أَنْ يَذْهَبَ إِلَى الْعَمَل."], "accepted_answers": [{"value": "أَشْرَبُ الْقَهْوَة قَبْلَ أَنْ أَذْهَبَ إِلَى الْعَمَل.", "status": "correct"}], "feedback": "*قَبْلَ أَنْ أَذْهَبَ* = before I go."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.exercise02.yusuf_coffee: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "يَشْرَبُ يُوسُف الْقَهْوَة قَبْلَ أَنْ يَذْهَبَ إِلَى الْعَمَل.", "distractors": ["أَشْرَبُ الْقَهْوَة قَبْلَ أَنْ أَذْهَبَ إِلَى الْعَمَل.", "نَشْرَبُ الْقَهْوَة قَبْلَ أَنْ نَذْهَبَ إِلَى الْعَمَل.", "يَقْرَأُ يُوسُف الرِّسَالَة قَبْلَ أَنْ يَنَامَ."], "accepted_answers": [{"value": "يَشْرَبُ يُوسُف الْقَهْوَة قَبْلَ أَنْ يَذْهَبَ إِلَى الْعَمَل.", "status": "correct"}], "feedback": "*يَذْهَبَ* = he goes."}
  ar.a2.unit80.qabla_an_wa_baada_an.lesson01.exercise03.match_before: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "قَبْلَ أَنْ", "right": "before"}, {"left": "أَشْرَبُ", "right": "I drink"}, {"left": "أَذْهَبُ", "right": "I go"}, {"left": "أَقْرَأُ", "right": "I read"}, {"left": "أَنَامُ", "right": "I sleep"}, {"left": "الرِّسَالَة", "right": "the message"}, {"left": "الْعَمَل", "right": "work"}], "status": "correct"}], "feedback": "Before and daily actions."}
