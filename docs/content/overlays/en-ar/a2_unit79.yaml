course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit79.li_anna_wa_lidhalika: {"title": "Because and so", "description": "Give a reason with li'anna and a consequence with lidhalika, for example when you explain why you stayed at home or why you were late."}
lessons:
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.li_anna_noun: {"title": "Because"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.li_anna_pronoun: {"title": "Because he, because I"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.lidhalika: {"title": "So"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson04.sabab_wa_natija: {"title": "Reason and result"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson05.reading_layla: {"title": "Layla's day"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.teach.words: {"title": "Home and weather", "gloss": "the house, home / the weather / cold / the rain / heavy, strong", "example_gloss": ["The weather is cold.", "The rain is heavy."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.teach.why: {"title": "Why and because", "gloss": "why / because / I stayed / you (masc.) stayed / in, at", "example_gloss": ["Why did you stay at home?", "I stayed at home because the weather is cold."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.teach.gn_lianna: {"title": "لِأَنَّ + noun", "gloss": "I stayed at home because the weather is cold. Yusuf stayed at home because the rain is heavy.", "note": "*لِأَنَّ* means because. It opens the reason, and a noun follows it directly: *لِأَنَّ الطَّقْس بَارِد*."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.teach.gn_answer: {"title": "Question and answer", "gloss": "Why did Yusuf stay at home? Yusuf stayed at home because the rain is heavy.", "note": "The question starts with *لِمَاذَا*; the answer starts with *لِأَنَّ*."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.teach.words: {"title": "Why people stay in", "gloss": "sick (masc.) / sick (fem.) / tired (masc.) / tired (fem.) / tired (plural) / busy (masc.) / busy (fem.)", "example_gloss": ["Yusuf is sick.", "Layla is tired."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.teach.verbs: {"title": "Stayed", "gloss": "he stayed / she stayed / we stayed / Layla", "example_gloss": ["Layla stayed at home.", "We stayed at home."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.teach.gn_pron: {"title": "لِأَنَّ + he, she", "gloss": "Yusuf stayed at home because he is sick. Layla stayed at home because she is tired.", "note": "With a pronoun the suffix joins *لِأَنَّ*: *لِأَنَّهُ* because he, *لِأَنَّهَا* because she. The adjective agrees: *مَرِيض*, *مُتْعَبَة*."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.teach.gn_pron2: {"title": "لِأَنَّنِي, لِأَنَّنَا", "gloss": "I stayed at home because I am busy. We stayed at home because we are tired.", "note": "*لِأَنَّنِي* because I, *لِأَنَّنَا* because we. A woman says *مَشْغُولَة*."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.teach.words: {"title": "Results", "gloss": "so, therefore / I took / umbrella / I went / to / the doctor / I slept / early / I", "example_gloss": ["The rain is heavy, so I took an umbrella.", "I am sick, so I went to the doctor."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.teach.gn_lidhalika: {"title": "لِذَلِكَ + result", "gloss": "The rain is heavy, so I took an umbrella. I am tired, so I slept early.", "note": "*لِذَلِكَ* opens the result. First say the reason, then a comma, then *لِذَلِكَ* and what you did."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.teach.gn_contrast: {"title": "Because or so", "gloss": "I stayed at home because the weather is cold. The weather is cold, so I stayed at home.", "note": "The same two facts, in two orders. *لِأَنَّ* introduces the reason; *لِذَلِكَ* introduces the result."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson04.teach.words: {"title": "Being late", "gloss": "I was late / the bus / late (fem.) / work / I arrived / late", "example_gloss": ["I was late because the bus is late.", "I arrived at work late."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson04.teach.gn_late: {"title": "Both orders", "gloss": "I was late because the bus is late. The bus is late, so I was late.", "note": "Choose the order that fits: result then *لِأَنَّ* + reason, or reason then *لِذَلِكَ* + result."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson04.teach.gn_late2: {"title": "A longer result", "gloss": "The bus is late, so I arrived at work late.", "note": "The result clause can be longer. *الْحَافِلَة* is feminine, so its adjective is *مُتَأَخِّرَة*."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "yesterday / and the rain", "example_gloss": ["Yesterday I stayed at home.", "The weather is cold and the rain is heavy."]}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson05.teach.reading: {"title": "Layla's day", "gloss": "Yesterday I stayed at home because I was sick. The weather is cold and the rain is heavy, so I slept early.", "note": "A reason and a result in one short text."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: Why did you stay at home yesterday, Layla?"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.teach.d2: {"title": "Layla explains", "gloss": "Layla: I stayed at home because I was sick."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.teach.d3: {"title": "Yusuf asks more", "gloss": "Yusuf: And did you go to the doctor?"}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.teach.d4: {"title": "Layla answers", "gloss": "Layla: No, the weather is cold and the rain is heavy, so I slept early."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson06.teach.d5: {"title": "Yusuf wishes her well", "gloss": "Yusuf: Get well soon, Layla!"}
exercises:
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise01.stayed_cold: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَقِيتُ فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "distractors": ["بَقِيتُ فِي الْبَيْت لِأَنَّ الْمَطَر شَدِيد.", "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "لِمَاذَا بَقِيتَ فِي الْبَيْت؟"], "accepted_answers": [{"value": "بَقِيتُ فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "status": "correct"}], "feedback": "*لِأَنَّ الطَّقْس بَارِد* = because the weather is cold."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise02.yusuf_rain: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الْمَطَر شَدِيد.", "distractors": ["بَقِيتُ فِي الْبَيْت لِأَنَّ الْمَطَر شَدِيد.", "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "لِمَاذَا بَقِيَ يُوسُف فِي الْبَيْت؟"], "accepted_answers": [{"value": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الْمَطَر شَدِيد.", "status": "correct"}], "feedback": "*بَقِيَ يُوسُف* = Yusuf stayed."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise03.match_basic: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "الْبَيْت", "right": "the house, home"}, {"left": "الطَّقْس", "right": "the weather"}, {"left": "بَارِد", "right": "cold"}, {"left": "الْمَطَر", "right": "the rain"}, {"left": "شَدِيد", "right": "heavy, strong"}, {"left": "لِمَاذَا", "right": "why"}, {"left": "لِأَنَّ", "right": "because"}], "status": "correct"}], "feedback": "Home, weather and because."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise04.order_cold: {"instruction": "Put the words in order to say 'I stayed at home because the weather is cold.'", "correct_option": "بَقِيتُ فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد", "accepted_answers": [{"value": "بَقِيتُ فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد", "status": "correct"}], "feedback": "*لِأَنَّ* opens the reason."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise05.fill_lianna: {"instruction": "Fill in the missing word.", "correct_option": "لِأَنَّ", "accepted_answers": [{"value": "لِأَنَّ", "status": "correct"}], "feedback": "*لِأَنَّ* = because."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise06.tr_why: {"instruction": "Translate into Arabic.", "correct_option": "لِمَاذَا بَقِيتَ فِي الْبَيْت؟", "accepted_answers": [{"value": "لِمَاذَا بَقِيتَ فِي الْبَيْت؟", "status": "correct"}, {"value": "لِمَاذَا بَقِيتَ فِي الْبَيْت", "status": "correct"}], "feedback": "*لِمَاذَا* = why."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson01.exercise07.wr_yusuf_cold: {"instruction": "Write the requested Arabic sentence.", "correct_option": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "accepted_answers": [{"value": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد.", "status": "correct"}, {"value": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّ الطَّقْس بَارِد", "status": "correct"}], "feedback": "*بَقِيَ يُوسُف*, then *لِأَنَّ* and the reason."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise01.yusuf_sick: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّهُ مَرِيض.", "distractors": ["بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مَرِيضَة.", "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّهُ مَشْغُول.", "بَقِينَا فِي الْبَيْت لِأَنَّنَا مُتْعَبُونَ."], "accepted_answers": [{"value": "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّهُ مَرِيض.", "status": "correct"}], "feedback": "*لِأَنَّهُ* = because he."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise02.we_tired: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَقِينَا فِي الْبَيْت لِأَنَّنَا مُتْعَبُونَ.", "distractors": ["بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُول.", "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مُتْعَبَة.", "بَقِيَ يُوسُف فِي الْبَيْت لِأَنَّهُ مَرِيض."], "accepted_answers": [{"value": "بَقِينَا فِي الْبَيْت لِأَنَّنَا مُتْعَبُونَ.", "status": "correct"}], "feedback": "*لِأَنَّنَا* = because we."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise03.match_pron: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "مَرِيض", "right": "sick (masc.)"}, {"left": "مَرِيضَة", "right": "sick (fem.)"}, {"left": "مُتْعَب", "right": "tired (masc.)"}, {"left": "مَشْغُول", "right": "busy (masc.)"}, {"left": "لِأَنَّهُ", "right": "because he"}, {"left": "لِأَنَّهَا", "right": "because she"}, {"left": "لِأَنَّنِي", "right": "because I"}, {"left": "لِأَنَّنَا", "right": "because we"}], "status": "correct"}], "feedback": "Pronouns after because."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise04.order_layla: {"instruction": "Put the words in order to say 'Layla stayed at home because she is tired.'", "correct_option": "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مُتْعَبَة", "accepted_answers": [{"value": "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مُتْعَبَة", "status": "correct"}], "feedback": "*لِأَنَّهَا* matches Layla."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise05.fill_lianna_hu: {"instruction": "Fill in the missing word.", "correct_option": "لِأَنَّهُ", "accepted_answers": [{"value": "لِأَنَّهُ", "status": "correct"}], "feedback": "*لِأَنَّهُ* = because he."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise06.tr_busy: {"instruction": "Translate into Arabic.", "correct_option": "بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُول.", "accepted_answers": [{"value": "بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُول.", "status": "correct"}, {"value": "بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُول", "status": "correct"}, {"value": "بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُولَة.", "status": "correct"}, {"value": "بَقِيتُ فِي الْبَيْت لِأَنَّنِي مَشْغُولَة", "status": "correct"}], "feedback": "*لِأَنَّنِي* = because I."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson02.exercise07.wr_layla_sick: {"instruction": "Write the requested Arabic sentence.", "correct_option": "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مَرِيضَة.", "accepted_answers": [{"value": "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مَرِيضَة.", "status": "correct"}, {"value": "بَقِيَتْ لَيْلَى فِي الْبَيْت لِأَنَّهَا مَرِيضَة", "status": "correct"}], "feedback": "*بَقِيَتْ* and *لِأَنَّهَا* are feminine."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.exercise01.rain_umbrella: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "الْمَطَر شَدِيد، لِذَلِكَ أَخَذْتُ مِظَلَّة.", "distractors": ["الْمَطَر شَدِيد، لِذَلِكَ ذَهَبْتُ إِلَى الطَّبِيب.", "الطَّقْس بَارِد، لِذَلِكَ أَخَذْتُ مِظَلَّة.", "أَخَذْتُ مِظَلَّة، لِذَلِكَ الْمَطَر شَدِيد."], "accepted_answers": [{"value": "الْمَطَر شَدِيد، لِذَلِكَ أَخَذْتُ مِظَلَّة.", "status": "correct"}], "feedback": "*أَخَذْتُ مِظَلَّة* = I took an umbrella."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.exercise02.sick_doctor: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَنَا مَرِيض، لِذَلِكَ ذَهَبْتُ إِلَى الطَّبِيب.", "distractors": ["أَنَا مُتْعَب، لِذَلِكَ نِمْتُ مُبَكِّرًا.", "أَنَا مَرِيض، لِذَلِكَ أَخَذْتُ مِظَلَّة.", "ذَهَبْتُ إِلَى الطَّبِيب، لِذَلِكَ أَنَا مَرِيض."], "accepted_answers": [{"value": "أَنَا مَرِيض، لِذَلِكَ ذَهَبْتُ إِلَى الطَّبِيب.", "status": "correct"}], "feedback": "*ذَهَبْتُ إِلَى* = I went to."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.exercise03.match_result: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "لِذَلِكَ", "right": "so, therefore"}, {"left": "أَخَذْتُ", "right": "I took"}, {"left": "مِظَلَّة", "right": "umbrella"}, {"left": "ذَهَبْتُ", "right": "I went"}, {"left": "إِلَى", "right": "to"}, {"left": "الطَّبِيب", "right": "the doctor"}, {"left": "نِمْتُ", "right": "I slept"}, {"left": "مُبَكِّرًا", "right": "early"}], "status": "correct"}], "feedback": "Results."}
  ar.a2.unit79.li_anna_wa_lidhalika.lesson03.exercise04.order_tired: {"instruction": "Put the words in order to say 'I am tired, so I slept early.'", "correct_option": "أَنَا مُتْعَب لِذَلِكَ نِمْتُ مُبَكِّرًا", "accepted_answers": [{"value": "أَنَا مُتْعَب لِذَلِكَ نِمْتُ مُبَكِّرًا", "status": "correct"}], "feedback": "Reason, then *لِذَلِكَ*, then the result."}
