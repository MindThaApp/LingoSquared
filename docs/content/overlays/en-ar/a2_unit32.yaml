exercises:
  ar.a2.unit32.lesson01.exercise01.recognize_smart_phone:
    instruction: "Select the meaning."
    correct_option: smartphone
    distractors: [daily, "social media", "two hours"]
    accepted_answers: [{value: smartphone, status: correct}]
    feedback: "*الهاتف الذكي* means smartphone."
  ar.a2.unit32.lesson01.exercise02.listen_two_hours:
    instruction: "Listen and select what you hear."
    correct_option: "two hours a day"
    distractors: [daily, smartphone, "social media"]
    accepted_answers: [{value: "two hours a day", status: correct}]
    feedback: "You heard *ساعتين في اليوم*."
  ar.a2.unit32.lesson01.exercise03.match_digital_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"الهاتف الذكي": smartphone, أستخدم: "I use", يوميا: daily, "وسائل التواصل الاجتماعي": "social media", "ساعتين في اليوم": "two hours a day", نعم: "Yes"}
        status: correct
    feedback: "These words describe daily smartphone and social-media use."
  ar.a2.unit32.lesson01.exercise04.order_daily_use:
    instruction: "Arrange the Arabic words for I use my phone about two hours a day."
    accepted_answers: [{value: [أستخدم, هاتفي, حوالي, ساعتين, في, اليوم], status: correct}]
    feedback: "*أستخدم هاتفي حوالي ساعتين في اليوم* describes daily phone use."
  ar.a2.unit32.lesson01.exercise05.write_daily_use:
    instruction: "Type exactly this formal Arabic sentence: I use my phone about two hours a day, especially for social media."
    accepted_answers:
      - {value: "أستخدم هاتفي حوالي ساعتين في اليوم، خاصة لوسائل التواصل الاجتماعي", status: correct}
      - {value: "أستخدم هاتفي حوالي ساعتين في اليوم، خاصة لوسائل التواصل الاجتماعي.", status: correct}
      - {value: "أستخدم هاتفي حوالي ساعتين في اليوم خاصة لوسائل التواصل الاجتماعي.", status: correct}
    feedback: "*أستخدم هاتفي حوالي ساعتين في اليوم، خاصة لوسائل التواصل الاجتماعي* is the requested habit description."
  ar.a2.unit32.lesson02.exercise01.recognize_useful:
    instruction: "Select the meaning."
    correct_option: "useful for communicating with friends"
    distractors: [smartphone, daily, "takes a lot of time"]
    accepted_answers: [{value: "useful for communicating with friends", status: correct}]
    feedback: "*مفيدة للتواصل مع الأصدقاء* means useful for communicating with friends."
  ar.a2.unit32.lesson02.exercise02.dialogue_leila_opinion:
    instruction: "What is Leila's opinion of social media?"
    correct_option: "Useful for friends, but it takes a lot of time."
    distractors: ["Not useful at all.", "Only good for work.", "She has no opinion."]
    accepted_answers: [{value: "Useful for friends, but it takes a lot of time.", status: correct}]
    feedback: "Leila says *أعتقد أنها مفيدة للتواصل مع الأصدقاء، لكنها تأخذ وقتا كثيرا*."
  ar.a2.unit32.lesson02.exercise03.match_opinion_lines:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"كم ساعة تستخدمين هاتفك يوميا؟": "How many hours do you use your phone daily?", "خاصة لوسائل التواصل الاجتماعي": "especially for social media", "ما رأيك في وسائل التواصل الاجتماعي؟": "What's your opinion of social media?", "مفيدة للتواصل مع الأصدقاء": "useful for communicating with friends", "تأخذ وقتا كثيرا": "it takes a lot of time", نعم: "Yes"}
        status: correct
    feedback: "These phrases cover asking about and giving the online-habits opinion."
  ar.a2.unit32.lesson02.exercise04.order_opinion_question:
    instruction: "Arrange the Arabic words for What's your opinion of social media?"
    accepted_answers: [{value: [ما, رأيك, في, وسائل, التواصل, الاجتماعي], status: correct}]
    feedback: "*ما رأيك في وسائل التواصل الاجتماعي؟* asks for the opinion."
  ar.a2.unit32.lesson02.exercise05.write_habit_opinion:
    instruction: "Write a short formal Arabic message with exactly this content: say you use your phone about two hours a day, especially for social media; then say you think it's useful for communicating with friends, but it takes a lot of time."
    accepted_answers:
      - {value: "أستخدم هاتفي حوالي ساعتين في اليوم، خاصة لوسائل التواصل الاجتماعي. أعتقد أنها مفيدة للتواصل مع الأصدقاء، لكنها تأخذ وقتا كثيرا.", status: correct}
      - {value: "أستخدم هاتفي حوالي ساعتين في اليوم خاصة لوسائل التواصل الاجتماعي. أعتقد أنها مفيدة للتواصل مع الأصدقاء لكنها تأخذ وقتا كثيرا.", status: correct}
    feedback: "*أستخدم هاتفي حوالي ساعتين في اليوم، خاصة لوسائل التواصل الاجتماعي. أعتقد أنها مفيدة للتواصل مع الأصدقاء، لكنها تأخذ وقتا كثيرا.* is the requested habit-plus-opinion message."
