    feedback: "أريد تذكرة إلى القاهرة is the requested ticket sentence."
  ar.a1.unit16.lesson01.exercise06.dictation_ticket_cairo: {correct_response: "أريد تذكرة إلى القاهرة.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
