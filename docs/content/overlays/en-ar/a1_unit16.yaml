exercises:
  ar.a1.unit16.lesson01.exercise01.recognize_ticket:
    instruction: "Select the meaning."
    correct_option: ticket
    distractors: [train, market, lesson]
    accepted_answers: [{value: ticket, status: correct}]
    feedback: "تذكرة means ticket."
  ar.a1.unit16.lesson01.exercise02.listen_ticket:
    instruction: "Listen and select what you hear."
    correct_option: "I want a ticket to Cairo."
    distractors: ["I want coffee in Cairo.", "The train is at five o'clock.", "From platform two."]
    accepted_answers: [{value: "I want a ticket to Cairo.", status: correct}]
    feedback: "You heard أريد تذكرة إلى القاهرة."
  ar.a1.unit16.lesson01.exercise03.match_travel_words:
    instruction: "Match each Arabic travel word with its meaning."
    accepted_answers:
      - value: {تذكرة: ticket, القطار: train, القاهرة: Cairo}
        status: correct
    feedback: "These are basic travel words."
  ar.a1.unit16.lesson01.exercise04.order_ticket_request:
    instruction: "Arrange the Arabic words for I want a ticket to Cairo."
    accepted_answers: [{value: [أريد, تذكرة, إلى, القاهرة], status: correct}]
    feedback: "أريد تذكرة إلى القاهرة is the ticket request."
  ar.a1.unit16.lesson01.exercise05.write_ticket_request:
    instruction: "Type exactly this Arabic ticket request: I want a ticket to Cairo."
    accepted_answers:
      - {value: "أريد تذكرة إلى القاهرة", status: correct}
      - {value: "أريد تذكرة إلى القاهرة.", status: correct}
    feedback: "أريد تذكرة إلى القاهرة is the requested ticket sentence."
  ar.a1.unit16.lesson02.exercise01.recognize_platform:
    instruction: "Select the meaning."
    correct_option: platform
    distractors: [ticket, cafe, family]
    accepted_answers: [{value: platform, status: correct}]
    feedback: "الرصيف means platform."
  ar.a1.unit16.lesson02.exercise02.dialogue_departure:
    instruction: "What time is the train?"
    correct_option: "At five o'clock."
    distractors: ["At three o'clock.", "Tomorrow.", "From the market."]
    accepted_answers: [{value: "At five o'clock.", status: correct}]
    feedback: "Yusuf says القطار في الساعة الخامسة."
  ar.a1.unit16.lesson02.exercise03.match_journey_details:
    instruction: "Match each Arabic journey detail with its role."
    accepted_answers:
      - value: {القاهرة: destination, "الساعة الخامسة": "departure time", "الرصيف الثاني": platform}
        status: correct
    feedback: "The details give destination, time, and platform."
  ar.a1.unit16.lesson02.exercise04.order_platform_question:
    instruction: "Arrange the Arabic words for From which platform?"
    accepted_answers: [{value: [من, أي, رصيف], status: correct}]
    feedback: "من أي رصيف؟ asks for the platform."
  ar.a1.unit16.lesson02.exercise05.write_journey_message:
    instruction: "Type exactly this Arabic journey message: I want a ticket to Cairo. The train is at five o'clock."
    accepted_answers:
      - {value: "أريد تذكرة إلى القاهرة. القطار في الساعة الخامسة.", status: correct}
      - {value: "أريد تذكرة إلى القاهرة القطار في الساعة الخامسة", status: correct}
      - {value: "أريد تذكرة إلى القاهرة. القطار في الساعة الخامسة", status: correct}
    feedback: "أريد تذكرة إلى القاهرة. القطار في الساعة الخامسة. gives the destination and time."
