teaching:
  ar.b1.unit48.lesson01.teach.sayakun_hunaka: {title: "There will be", gloss: "there will be", note: "*سيكون هناك* + a noun states a fixed future arrangement.", example_gloss: "There will be a meeting."}
  ar.b1.unit48.lesson01.teach.ijtiman: {title: "Meeting", gloss: "meeting", note: "*اجتماع* means meeting.", example_gloss: "There will be a meeting on Monday."}
  ar.b1.unit48.lesson01.teach.yawm_alithnayn: {title: "On Monday", gloss: "on Monday", note: "*يوم الاثنين* means on Monday.", example_gloss: "There will be a meeting on Monday."}
  ar.b1.unit48.lesson01.teach.yusuf_sa: {title: "Yusuf states a fixed arrangement", gloss: "There will be a meeting on Monday.", note: "*سيكون* + a present-tense verb form states a certain future fact.", example_gloss: "Yusuf said: There will be a meeting on Monday."}
  ar.b1.unit48.lesson02.teach.anwi: {title: "I intend", gloss: "I intend", note: "*أنوي* + a verbal noun expresses an intention.", example_gloss: "I intend to learn German."}
  ar.b1.unit48.lesson02.teach.taallum_alalmaniyya: {title: "Learning German", gloss: "learning German", note: "*تعلم اللغة الألمانية* means learning the German language.", example_gloss: "I intend to learn German."}
  ar.b1.unit48.lesson02.teach.hadha_alaam: {title: "This year", gloss: "this year", note: "*هذا العام* means this year.", example_gloss: "I intend to learn German this year."}
  ar.b1.unit48.lesson02.teach.yusuf_anwi: {title: "Yusuf states an intention", gloss: "I intend to learn German this year.", note: "*أنوي* + a verbal noun expresses a personal intention, less certain than a fixed arrangement.", example_gloss: "Yusuf said: I intend to learn German this year."}
  ar.b1.unit48.lesson03.teach.madha_fi_barnamajik: {title: "What is on your schedule this week?", gloss: "what is on your schedule this week?", note: "This opens the dialogue about the week's plans.", example_gloss: "Laila said: What is on your schedule this week?"}
  ar.b1.unit48.lesson03.teach.qad_yantahi: {title: "The project might finish late", gloss: "the project might finish late", note: "*قد ينتهي المشروع متأخرا* is an uncertain prediction with قد + present.", example_gloss: "Yusuf said: The project might finish late."}
  ar.b1.unit48.lesson03.teach.lastu_mutaakkidan: {title: "I am not sure", gloss: "I am not sure", note: "*لست متأكدا* means I am not sure, marking the degree of certainty.", example_gloss: "The project might finish late, I am not sure."}
  ar.b1.unit48.lesson03.teach.yusuf_qad: {title: "Yusuf makes an uncertain prediction", gloss: "The project might finish late, I am not sure.", note: "*قد* + a present-tense verb marks a probable but uncertain prediction.", example_gloss: "Yusuf said: The project might finish late, I am not sure."}
exercises:
  ar.b1.unit48.lesson01.exercise01.recognize_sayakun_hunaka:
    instruction: "Select the meaning."
    correct_option: "There will be a meeting"
    distractors: ["There was a meeting", "There might be a meeting", "There is no meeting"]
    accepted_answers: [{value: "There will be a meeting", status: correct}]
    feedback: "*سيكون هناك اجتماع* is a certain future fact."
  ar.b1.unit48.lesson01.exercise02.recognize_sayakun_full:
    instruction: "Select the meaning."
    correct_option: "There will be a meeting on Monday"
    distractors: ["There was a meeting on Monday", "There might be a meeting on Monday", "There will be a meeting on Tuesday"]
    accepted_answers: [{value: "There will be a meeting on Monday", status: correct}]
    feedback: "*سيكون هناك اجتماع يوم الاثنين* is a fixed arrangement."
  ar.b1.unit48.lesson01.exercise03.listen_select_sa:
    instruction: "Listen and select what Yusuf says."
    correct_option: "There will be a meeting on Monday."
    distractors: ["There might be a meeting on Monday.", "There was a meeting on Monday.", "There will be a meeting on Tuesday."]
    accepted_answers: [{value: "There will be a meeting on Monday.", status: correct}]
    feedback: "You heard *سيكون هناك اجتماع يوم الاثنين*."
  ar.b1.unit48.lesson01.exercise04.match_sa:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {سيكون: "will be", هناك: there, اجتماع: meeting, "يوم الاثنين": "on Monday", "سيكون هناك": "there will be", "سيكون هناك اجتماع": "there will be a meeting"}
        status: correct
    feedback: "These phrases cover the fixed future arrangement."
  ar.b1.unit48.lesson01.exercise05.order_sa:
    instruction: "Arrange the Arabic words for There will be a meeting on Monday."
    accepted_answers: [{value: [سيكون, هناك, اجتماع, يوم, الاثنين], status: correct}]
    feedback: "*سيكون هناك اجتماع يوم الاثنين* is a fixed arrangement with سيكون."
  ar.b1.unit48.lesson01.exercise06.write_sa:
    instruction: "Write exactly this fixed future arrangement using سـ + a present-tense verb: There will be a meeting on Monday."
    accepted_answers:
      - {value: "سيكون هناك اجتماع يوم الاثنين", status: correct}
      - {value: "سيكون هناك اجتماع يوم الاثنين.", status: correct}
    feedback: "*سيكون هناك اجتماع يوم الاثنين.* is the requested sentence."
  ar.b1.unit48.lesson02.exercise01.recognize_anwi:
    instruction: "Select the meaning."
    correct_option: "I intend to learn German"
    distractors: ["I learned German", "I will definitely learn German", "I do not intend to learn German"]
    accepted_answers: [{value: "I intend to learn German", status: correct}]
    feedback: "*أنوي تعلم اللغة الألمانية* is an intention."
  ar.b1.unit48.lesson02.exercise02.recognize_anwi_full:
    instruction: "Select the meaning."
    correct_option: "I intend to learn German this year"
    distractors: ["I learned German this year", "I intend to learn French this year", "I do not intend to learn German this year"]
    accepted_answers: [{value: "I intend to learn German this year", status: correct}]
    feedback: "*أنوي تعلم اللغة الألمانية هذا العام* states the intention and its timeframe."
  ar.b1.unit48.lesson02.exercise03.listen_select_anwi:
    instruction: "Listen and select what Yusuf says."
    correct_option: "I intend to learn German this year."
    distractors: ["I intend to learn French this year.", "I learned German this year.", "I intend to learn German next year."]
    accepted_answers: [{value: "I intend to learn German this year.", status: correct}]
    feedback: "You heard *أنوي تعلم اللغة الألمانية هذا العام*."
  ar.b1.unit48.lesson02.exercise04.match_anwi:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {أنوي: "I intend", تعلم: "learning", "اللغة الألمانية": "the German language", "هذا العام": "this year", "أنوي تعلم": "I intend to learn", العام: year}
        status: correct
    feedback: "These phrases cover the intention and its parts."
  ar.b1.unit48.lesson02.exercise05.order_anwi:
    instruction: "Arrange the Arabic words for I intend to learn German this year."
    accepted_answers: [{value: [أنوي, تعلم, اللغة, الألمانية, هذا, العام], status: correct}]
    feedback: "*أنوي تعلم اللغة الألمانية هذا العام* is an intention with أنوي."
  ar.b1.unit48.lesson02.exercise06.write_anwi:
    instruction: "Write exactly this intention using أنوي + a verbal noun: I intend to learn German this year."
    accepted_answers:
      - {value: "أنوي تعلم اللغة الألمانية هذا العام", status: correct}
      - {value: "أنوي تعلم اللغة الألمانية هذا العام.", status: correct}
    feedback: "*أنوي تعلم اللغة الألمانية هذا العام.* is the requested sentence."
  ar.b1.unit48.lesson03.exercise01.choose_uncertain_prediction:
    instruction: "Which answer is an UNCERTAIN prediction, not a fixed plan?"
    correct_option: "قد ينتهي المشروع متأخرا"
    distractors: ["سيكون هناك اجتماع يوم الاثنين", "أنوي تعلم اللغة الألمانية هذا العام", "ماذا في برنامجك هذا الأسبوع؟"]
    accepted_answers: [{value: "قد ينتهي المشروع متأخرا", status: correct}]
    feedback: "*قد ينتهي المشروع متأخرا* uses قد for an uncertain prediction, unlike the fixed arrangement with سيكون."
  ar.b1.unit48.lesson03.exercise02.dialogue_comprehension_khutat:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf has a fixed meeting Monday, intends to learn German this year, and is unsure whether the project will finish late."
    distractors: ["Yusuf is certain the project will finish late.", "Yusuf has no plans for the week.", "Yusuf already learned German this year."]
    accepted_answers: [{value: "Yusuf has a fixed meeting Monday, intends to learn German this year, and is unsure whether the project will finish late.", status: correct}]
    feedback: "Yusuf distinguishes a fixed arrangement, an intention, and an uncertain prediction."
  ar.b1.unit48.lesson03.exercise03.match_dialogue_khutat:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"ماذا في برنامجك هذا الأسبوع؟": "What is on your schedule this week?", "سيكون هناك اجتماع يوم الاثنين.": "There will be a meeting on Monday.", "أنوي تعلم اللغة الألمانية هذا العام.": "I intend to learn German this year.", "قد ينتهي المشروع متأخرا، لست متأكدا.": "The project might finish late, I am not sure.", سيكون: "will be", أنوي: "I intend"}
        status: correct
    feedback: "These lines cover the fixed plan, the intention, and the uncertain prediction."
  ar.b1.unit48.lesson03.exercise04.order_madha_fi_barnamajik:
    instruction: "Arrange the Arabic words for What is on your schedule this week?"
    accepted_answers: [{value: [ماذا, في, برنامجك, هذا, الأسبوع], status: correct}]
    feedback: "*ماذا في برنامجك هذا الأسبوع؟* asks about the week's plans."
  ar.b1.unit48.lesson03.exercise05.reply_future_plans:
    instruction: "Laila asks: What is on your schedule this week? Reply as Yusuf, stating the fixed meeting and your intention."
    accepted_answers:
      - {value: "سيكون هناك اجتماع يوم الاثنين أنوي تعلم اللغة الألمانية هذا العام", status: correct}
      - {value: "سيكون هناك اجتماع يوم الاثنين. أنوي تعلم اللغة الألمانية هذا العام.", status: correct}
    feedback: "*سيكون هناك اجتماع يوم الاثنين. أنوي تعلم اللغة الألمانية هذا العام.* is Yusuf's reply."
  ar.b1.unit48.lesson03.exercise06.write_full_khutat:
    instruction: "As Yusuf, write two sentences: first, a fixed arrangement using سـ + a present-tense verb (there will be a meeting on Monday); then an uncertain prediction using قد + a present-tense verb (the project might finish late)."
    accepted_answers:
      - {value: "سيكون هناك اجتماع يوم الاثنين قد ينتهي المشروع متأخرا", status: correct}
      - {value: "سيكون هناك اجتماع يوم الاثنين. قد ينتهي المشروع متأخرا.", status: correct}
    feedback: "*سيكون هناك اجتماع يوم الاثنين. قد ينتهي المشروع متأخرا.* contrasts the fixed arrangement with the uncertain prediction, as required."
