    feedback: "*فجأة* marks a sudden foreground event."
  ar.b2.unit04.lesson01.exercise02.listen_combined:
    instruction: "Listen and select what you hear."
    correct_option: "While I was walking in the street, the phone suddenly rang."
    distractors: ["While I was walking in the street, the phone did not ring.", "I was walking in the street, then the phone rang later.", "While I was sitting at home, the phone suddenly rang."]
