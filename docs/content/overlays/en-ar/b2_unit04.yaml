review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) confirmation needed (DRAFT). Confirm every
    English gloss matches idiomatic MSA, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation/joining forms a correct learner would actually produce
    -- Arabic is graded fully byte-strict with zero typo tolerance and
    no internal-punctuation stripping. See the realization file's
    review block for the full priority list.
  notes: >-
    Overlay for ar's fourth B2 unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English "had forgotten" (pluperfect) maps to كنت قد +
    a PLAIN PAST-TENSE verb in Arabic (كنت قد نسيت), not a separate
    periphrastic form -- flagged in lesson02; (2) English "was walking"
    (past continuous, background) maps to كان + a PRESENT-TENSE verb
    (كنت أسير), which looks tense-backwards to an English speaker who
    expects a past form -- flagged in lesson01; (3) عندما (when,
    introducing an interrupting event) and بينما (while, introducing
    the background action it interrupts) are NOT interchangeable --
    kept distinct across lesson01 and lesson03; (4) the culminating
    dialogue deliberately narrates events OUT OF chronological order,
    mirroring the outcome's listening requirement -- learners must not
    assume Yusuf's telling order is the real event order. No sibling-
    direction file (ar-en b2) was consulted.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: recount a complex
    sequence of events with shifting time reference -- background
    versus foreground (كنت + مضارع vs. plain ماضي), an event that had
    happened before other past events (كنت قد + ماضي), and interrupted
    or ongoing actions (بينما / عندما), keeping the timeline
    unambiguous, around the everyday scenario of recounting a chaotic,
    late morning.

units:
  ar.b2.unit04.alsard_almurakkab: {title: "Complex Narrative"}

lessons:
  ar.b2.unit04.lesson01.alkhalfiyya_walhadath_alraysi: {title: "Background and the main event"}
  ar.b2.unit04.lesson02.alhadath_alsabiq_lilsabiq: {title: "The event before the earlier event"}
  ar.b2.unit04.lesson03.alhadath_almuqataa: {title: "The interrupted event"}
  ar.b2.unit04.lesson04.tasalsul_alahdath: {title: "Sequencing events"}
  ar.b2.unit04.lesson05.qiraat_nass_sardi_murakkab: {title: "Reading a complex narrative"}
  ar.b2.unit04.lesson06.sard_kamil: {title: "A full recount: dialogue and production"}

teaching:
  ar.b2.unit04.lesson01.teach.kuntu_asir:
    title: "I was walking"
    gloss: "I was walking"
    note: "*كنت أسير* (كان + present-tense verb) is how MSA expresses continuous/background past -- it looks tense-backwards to an English speaker (a PRESENT verb after 'was'), but this is the standard construction."
  ar.b2.unit04.lesson01.teach.fi_alshari:
    title: "in the street"
    gloss: "in the street"
  ar.b2.unit04.lesson01.teach.background_model:
    title: "I was walking in the street."
    gloss: "I was walking in the street."
    note: "A pure BACKGROUND statement -- sets the scene, with no foreground event yet."
  ar.b2.unit04.lesson01.teach.fajaa:
    title: suddenly
    gloss: suddenly
    example_gloss: "Suddenly, the car stopped."
  ar.b2.unit04.lesson01.teach.ranna:
    title: rang
    gloss: "rang (past tense)"
    example_gloss: "The doorbell rang."
  ar.b2.unit04.lesson01.teach.alhatif:
    title: "the phone"
    gloss: "the phone"
    example_gloss: "The phone is new."
  ar.b2.unit04.lesson01.teach.foreground_model:
    title: "Suddenly, the phone rang."
    gloss: "Suddenly, the phone rang."
    note: "A FOREGROUND event -- a plain past-tense verb (*رنّ*), the main narrated action."
  ar.b2.unit04.lesson01.teach.baynama:
    title: while
    gloss: while
    note: "*بينما* joins a background clause (كان + present) to a foreground clause (plain past) -- the background is interrupted by the foreground event."
    example_gloss: "While I was working, my friend called me."
  ar.b2.unit04.lesson01.teach.combined_model:
    title: "While I was walking in the street, the phone suddenly rang."
    gloss: "While I was walking in the street, the phone suddenly rang."
    note: "Background (*كنت أسير*) + foreground (*رنّ*), joined by *بينما* -- the core background/foreground contrast of this lesson."
  ar.b2.unit04.lesson01.teach.grammar_khalfiyya:
    title: "I was walking in the street. Suddenly, the phone rang."
    gloss: "I was walking in the street. Suddenly, the phone rang."
    note: "Background (كان + present-tense verb, ongoing) sets the scene; foreground (a plain past-tense verb) is the event that actually happens within that scene."

  ar.b2.unit04.lesson02.teach.kuntu_qad:
    title: "I had..."
    gloss: "I had... (pluperfect auxiliary)"
    note: "*كنت قد* + a plain past-tense verb marks an event that happened BEFORE another past event already being narrated -- MSA's pluperfect."
  ar.b2.unit04.lesson02.teach.nasitu:
    title: "I forgot"
    gloss: "I forgot (past tense)"
    example_gloss: "I forgot his name."
  ar.b2.unit04.lesson02.teach.miftah_almanzil:
    title: "the house key"
    gloss: "the house key"
  ar.b2.unit04.lesson02.teach.pluperfect_model:
    title: "I had forgotten the house key."
    gloss: "I had forgotten the house key."
    note: "*كنت قد نسيت* = 'I had forgotten' -- there is no separate periphrastic perfect form in Arabic the way English uses one; the plain past verb (*نسيت*) does the work, with *كنت قد* marking it as earlier than the surrounding narration."
  ar.b2.unit04.lesson02.teach.rajatu:
    title: "I returned"
    gloss: "I returned / I went back"
    example_gloss: "I returned home in the evening."
  ar.b2.unit04.lesson02.teach.liakhudhahu:
    title: "to get it"
    gloss: "to get it / to take it"
    note: "*لآخذه* = *لـ* (in order to) + *آخذ* (I take, subjunctive) + *ه* (it) -- a purpose clause."
  ar.b2.unit04.lesson02.teach.lidhalik:
    title: therefore
    gloss: "therefore / so"
    example_gloss: "The weather is cold, therefore I stay home."
  ar.b2.unit04.lesson02.teach.return_model:
    title: "So I went back to get it."
    gloss: "So I went back to get it."
  ar.b2.unit04.lesson02.teach.grammar_sabiq_lilsabiq:
    title: "I had forgotten the house key, so I went back to get it."
    gloss: "I had forgotten the house key, so I went back to get it."
    note: "The pre-past event (*كنت قد نسيت*, the earliest link in the chain) explains a later action (*رجعت*) -- exactly the 'event before other past events' this outcome targets."

  ar.b2.unit04.lesson03.teach.kuntu_abhath_an:
    title: "I was looking for"
    gloss: "I was looking for"
    note: "*كنت أبحث عن* (كان + present) -- another background/ongoing action, like *كنت أسير* in lesson01."
  ar.b2.unit04.lesson03.teach.almiftah:
    title: "the key"
    gloss: "the key"
    example_gloss: "The key is on the table."
  ar.b2.unit04.lesson03.teach.indama:
    title: when
    gloss: when
    note: "*عندما* introduces the INTERRUPTING foreground event -- distinct from *بينما* (while), which introduces the background being interrupted."
    example_gloss: "When I arrived, the weather was rainy."
  ar.b2.unit04.lesson03.teach.wasalat:
    title: arrived
    gloss: "arrived (feminine agreement)"
    example_gloss: "The bus arrived late."
  ar.b2.unit04.lesson03.teach.interrupt_model:
    title: "I was looking for the key when the bus arrived."
    gloss: "I was looking for the key when the bus arrived."
    note: "Background (*كنت أبحث عن المفتاح*) interrupted by a foreground event (*وصلت الحافلة*), joined by *عندما*."
  ar.b2.unit04.lesson03.teach.fi_tilka_allahza:
    title: "at that moment"
    gloss: "at that moment"
  ar.b2.unit04.lesson03.teach.moment_model:
    title: "At that moment, I found the key."
    gloss: "At that moment, I found the key."
  ar.b2.unit04.lesson03.teach.grammar_muqataa:
    title: "I was looking for the key when the bus arrived. At that moment, I found the key."
    gloss: "I was looking for the key when the bus arrived. At that moment, I found the key."
    note: "*عندما* marks the moment an ongoing background action gets interrupted by a foreground event -- the timeline stays unambiguous because the two verb forms (كان+present vs. plain past) mark which is which."

  ar.b2.unit04.lesson04.teach.thumma:
    title: then
    gloss: then
    example_gloss: "I ate, then I slept."
  ar.b2.unit04.lesson04.teach.bad_dhalik:
    title: "after that"
    gloss: "after that"
  ar.b2.unit04.lesson04.teach.akhiran:
    title: finally
    gloss: finally
    example_gloss: "Finally, I arrived."
  ar.b2.unit04.lesson04.teach.rakadtu:
    title: "I ran"
    gloss: "I ran"
    example_gloss: "I ran toward the door."
  ar.b2.unit04.lesson04.teach.ila_almahatta:
    title: "to the station"
    gloss: "to the station"
  ar.b2.unit04.lesson04.teach.sequence_model1:
    title: "I found the key, then I ran to the station."
    gloss: "I found the key, then I ran to the station."
    note: "*ثم* chains two sequential foreground events in the order they happened."
  ar.b2.unit04.lesson04.teach.fi_alwaqt_almunasib:
    title: "on time"
    gloss: "on time / at the right time"
  ar.b2.unit04.lesson04.teach.sequence_model2:
    title: "After that I ran. Finally, I arrived on time."
    gloss: "After that I ran. Finally, I arrived on time."
  ar.b2.unit04.lesson04.teach.grammar_tasalsul:
    title: "I found the key. Then I ran to the station. Finally, I arrived on time."
    gloss: "I found the key. Then I ran to the station. Finally, I arrived on time."
    note: "*ثم*, *بعد ذلك*, and *أخيرا* chain a sequence of foreground events in clear order, closing out the narrative."

  ar.b2.unit04.lesson05.teach.nass_sardi:
    title: "Reading: a chaotic morning, told out of order"
    gloss: "I arrived at the office late this morning. I had forgotten the house key, so I went back to get it. While I was walking in the street, the phone suddenly rang. I was looking for the key when the bus arrived. At that moment, I finally found the key. Then I ran to the station."
    glosses:
      إلى: to
      المكتب: "the office"
      متأخرا: late
      هذا: this
      الصباح: "the morning"

  ar.b2.unit04.lesson06.teach.limadha_taakharta:
    title: "Why were you late this morning?"
    gloss: "Why were you late this morning?"
  ar.b2.unit04.lesson06.teach.qabla_dhalik:
    title: "Before that, ..."
    gloss: "before that, ..."
    note: "*قبل ذلك* explicitly signals a flashback to an EARLIER event -- the marker that makes an out-of-order account unambiguous."
  ar.b2.unit04.lesson06.teach.ya_lahu_min:
    title: "What a busy morning!"
    gloss: "what a busy morning!"
    note: "*يا له من...* is a classic MSA exclamative frame: 'what a...!'."
  ar.b2.unit04.lesson06.teach.dialogue_layla_ask:
    title: "Layla: Why were you late this morning?"
    gloss: "Layla: Why were you late this morning?"
  ar.b2.unit04.lesson06.teach.dialogue_yusuf_interrupt:
    title: "Yusuf: I was looking for the key when the bus arrived."
    gloss: "Yusuf: I was looking for the key when the bus arrived."
    note: "Yusuf starts with an event that is NOT the earliest one -- the account begins out of chronological order."
  ar.b2.unit04.lesson06.teach.dialogue_yusuf_pluperfect:
    title: "Yusuf: Before that, I had forgotten the house key, so I went back to get it."
    gloss: "Yusuf: Before that, I had forgotten the house key, so I went back to get it."
    note: "*قبل ذلك* signals a flashback to the TRUE earliest event in the account."
  ar.b2.unit04.lesson06.teach.dialogue_yusuf_background:
    title: "Yusuf: While I was walking in the street after that, the phone suddenly rang."
    gloss: "Yusuf: While I was walking in the street after that, the phone suddenly rang."
  ar.b2.unit04.lesson06.teach.dialogue_yusuf_sequence:
    title: "Yusuf: I finally found the key, then I ran to the station."
    gloss: "Yusuf: I finally found the key, then I ran to the station."
  ar.b2.unit04.lesson06.teach.dialogue_layla_close:
    title: "Layla: What a busy morning!"
    gloss: "Layla: What a busy morning!"
  ar.b2.unit04.lesson06.teach.grammar_sard_kamil:
    title: "I had forgotten the house key. I went back to get it. While I was walking in the street, the phone rang. I was looking for the key when the bus arrived. I found the key, then I ran to the station."
    gloss: "I had forgotten the house key. I went back to get it. While I was walking in the street, the phone rang. I was looking for the key when the bus arrived. I found the key, then I ran to the station."
    note: "The TRUE chronological order, for comparison against Yusuf's out-of-order telling: pre-past event first, then background/interruption, then the interrupted search, then the closing sequence."

exercises:
