review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for ar's eighth and final B2 unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English marks the dual/plural distinction only on the
    noun ("the two studies" vs "studies"); Arabic marks it on BOTH noun
    (الدراستان) and, in some positions, the verb (تختلفان) -- flagged
    in the realization's dual-agreement note; (2) "تضر بالنوم" (harms
    sleep) uses a verb+preposition pairing (تضر بـ) that has no direct
    one-to-one English preposition match; (3) "أكثر إقناعا لأن" (more
    convincing because) requires a REASON clause -- a bare preference
    ("I like the second study more") would not satisfy the outcome's
    reasoned-judgement requirement, flagged in lesson04. No sibling-
    direction file (ar-en b2) was consulted.
    Review 2026-10-19: 6 fixes - source1 note wrote تقول...أن although
    the unit (correctly) uses إن after قال, now explained; تضر بـ note
    falsely said the verb cannot take a direct object, rewritten; added
    valid subject-first accepted answers الدراسة الأولى تقول إن... (3
    exercises), الدراسة الثانية تشير إلى أن... (2), الدراستان تتفقان على
    أن... with full dual agreement (4), and لكنهما تختلفان في... (3).
    NATIVE FLAGS: تضر بالنوم vs تضرّ النوم; Layla's 'larger sample'
    justification is not grounded in the reading text; pre-existing
    hamza-less accepted variants kept under add-never-remove.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: synthesize and evaluate
    two sources -- combine their claims into a coherent summary (تقول
    الدراسة الأولى إن، تشير الدراسة الثانية إلى أن), note where they
    agree or conflict (تتفق الدراستان على أن، لكن تختلفان في), and give
    a reasoned judgement about them (في رأيي...أكثر إقناعا لأن), around
    two studies on coffee's effect on focus and sleep.

