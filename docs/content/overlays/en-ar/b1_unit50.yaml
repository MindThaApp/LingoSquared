    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"على الرغم من أن": although, الأمر: "the matter", يحمل: carries, مخاطرة: risk, أؤيد: "I support", فتح: opening, "مكتب ثانٍ": "a second office", "أنا أؤيد فتح مكتب ثانٍ": "I support opening a second office"}
        status: correct
    feedback: "These phrases cover the concession and restated position."
  ar.b1.unit50.lesson01.exercise05.order_ala_alraghm:
    instruction: "Arrange the Arabic words for Although it carries risk, I support opening a second office."
    accepted_answers: [{value: [على, الرغم, من, أن, الأمر, يحمل, مخاطرة, أنا, أؤيد, فتح, مكتب, ثانٍ], status: correct}]
    feedback: "*على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ* concedes then restates."
  ar.b1.unit50.lesson01.exercise06.write_ala_alraghm:
    instruction: "Write exactly this concession using على الرغم من أن: Although it carries risk, I support opening a second office."
    accepted_answers:
      - {value: "على الرغم من أن الأمر يحمل مخاطرة أنا أؤيد فتح مكتب ثانٍ", status: correct}
      - {value: "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ.", status: correct}
    feedback: "*على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ.* is the requested sentence."
  ar.b1.unit50.lesson02.exercise01.recognize_ghayr_anna:
    instruction: "Select the meaning."
    correct_option: "However, we must set a precise plan"
    distractors: ["Although we must set a precise plan", "However, we set a precise plan", "However, we must not set a precise plan"]
    accepted_answers: [{value: "However, we must set a precise plan", status: correct}]
    feedback: "*غير أن علينا أن نضع خطة دقيقة* is a stronger contrastive point."
  ar.b1.unit50.lesson02.exercise02.recognize_ghayr_anna_full:
    instruction: "Select the meaning."
    correct_option: "However, we must set a precise plan first"
    distractors: ["Although we must set a precise plan first", "However, we set a precise plan first", "However, we must not set a precise plan first"]
    accepted_answers: [{value: "However, we must set a precise plan first", status: correct}]
    feedback: "*غير أن علينا أن نضع خطة دقيقة أولا* is the full contrastive point."
  ar.b1.unit50.lesson02.exercise03.listen_select_ghayr_anna:
    instruction: "Listen and select what Yusuf says."
    correct_option: "However, we must set a precise plan first."
    distractors: ["Although we must set a precise plan first.", "However, we set a precise plan first.", "However, we must not set a precise plan first."]
    accepted_answers: [{value: "However, we must set a precise plan first.", status: correct}]
    feedback: "You heard *غير أن، علينا أن نضع خطة دقيقة أولا*."
  ar.b1.unit50.lesson02.exercise04.match_ghayr_anna:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"غير أن": however, علينا: "we must", نضع: "put/set", خطة: plan, دقيقة: precise, أولا: first, "خطة دقيقة": "a precise plan", "علينا أن نضع": "we must set"}
        status: correct
