    accepted_answers: [{value: "Although it carries risk, I support opening a second office", status: correct}]
    feedback: "*على الرغم من أن الأمر يحمل مخاطرة أنا أؤيد فتح مكتب ثانٍ* concedes the risk, then restates support."
  ar.b1.unit50.lesson01.exercise03.listen_select_ala_alraghm:
    instruction: "Listen and select what Yusuf says."
    correct_option: "Although it carries risk, I support opening a second office."
    distractors: ["Because it carries risk, I support opening a second office.", "Although it carries risk, I oppose opening a second office.", "Although it carries risk, I opened a second office."]
    accepted_answers: [{value: "Although it carries risk, I support opening a second office.", status: correct}]
    feedback: "You heard *على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ*."
