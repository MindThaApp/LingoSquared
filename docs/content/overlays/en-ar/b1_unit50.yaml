  ar.b1.unit50.lesson02.exercise05.order_ghayr_anna:
    instruction: "Arrange the Arabic words for However, we must set a precise plan first."
    accepted_answers: [{value: [غير, أن, علينا, أن, نضع, خطة, دقيقة, أولا], status: correct}]
    feedback: "*غير أن علينا أن نضع خطة دقيقة أولا* adds a second, stronger argument point."
  ar.b1.unit50.lesson02.exercise06.write_ghayr_anna:
    instruction: "Write exactly this contrastive point using غير أن: However, we must set a precise plan first."
    accepted_answers:
      - {value: "غير أن علينا أن نضع خطة دقيقة أولا", status: correct}
      - {value: "غير أن علينا أن نضع خطة دقيقة أولا.", status: correct}
    feedback: "*غير أن علينا أن نضع خطة دقيقة أولا.* is the requested sentence."
  ar.b1.unit50.lesson03.exercise01.choose_concession:
    instruction: "Which answer CONCEDES a valid point before restating a position?"
    correct_option: "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ"
    distractors: ["غير أن علينا أن نضع خطة دقيقة أولا", "ما رأيك في فتح مكتب ثانٍ في مدينة أخرى؟", "غير أن علينا أن نضع خطة دقيقة"]
    accepted_answers: [{value: "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ", status: correct}]
    feedback: "*على الرغم من أن* concedes the risk before restating support; *غير أن* only adds a further contrastive point."
  ar.b1.unit50.lesson03.exercise02.dialogue_comprehension_niqash:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf concedes the risk but supports a second office, then adds that they must plan carefully first."
    distractors: ["Yusuf opposes opening a second office entirely.", "Yusuf says there is no risk at all.", "Yusuf says a plan is unnecessary."]
    accepted_answers: [{value: "Yusuf concedes the risk but supports a second office, then adds that they must plan carefully first.", status: correct}]
    feedback: "Yusuf concedes, restates his position, then adds a stronger contrastive point."
  ar.b1.unit50.lesson03.exercise03.match_dialogue_niqash:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"ما رأيك في فتح مكتب ثانٍ في مدينة أخرى؟": "What do you think of opening a second office in another city?", "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ.": "Although it carries risk, I support opening a second office.", "غير أن علينا أن نضع خطة دقيقة أولا.": "However, we must set a precise plan first.", "على الرغم من أن": although, "غير أن": however, مخاطرة: risk}
        status: correct
    feedback: "These lines cover the full nuanced debate."
  ar.b1.unit50.lesson03.exercise04.order_ma_rayuki:
    instruction: "Arrange the Arabic words for What do you think of opening a second office in another city?"
    accepted_answers: [{value: [ما, رأيك, في, فتح, مكتب, ثانٍ, في, مدينة, أخرى], status: correct}]
    feedback: "*ما رأيك في فتح مكتب ثانٍ في مدينة أخرى؟* opens the debate."
  ar.b1.unit50.lesson03.exercise05.reply_debate_office:
    instruction: "Laila asks: What do you think of opening a second office in another city? Reply as Yusuf, conceding the risk, restating your support, then adding a stronger contrastive point."
    accepted_answers:
      - {value: "على الرغم من أن الأمر يحمل مخاطرة أنا أؤيد فتح مكتب ثانٍ غير أن علينا أن نضع خطة دقيقة أولا", status: correct}
      - {value: "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ. غير أن علينا أن نضع خطة دقيقة أولا.", status: correct}
    feedback: "*على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ. غير أن علينا أن نضع خطة دقيقة أولا.* is Yusuf's full reply."
  ar.b1.unit50.lesson03.exercise06.write_full_niqash:
    instruction: "As Yusuf, answer in two sentences: first, concede the risk using على الرغم من أن and restate your support (although it carries risk, I support opening a second office); then add a stronger contrastive point using غير أن (however, we must set a precise plan first)."
    accepted_answers:
      - {value: "على الرغم من أن الأمر يحمل مخاطرة أنا أؤيد فتح مكتب ثانٍ غير أن علينا أن نضع خطة دقيقة أولا", status: correct}
      - {value: "على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ. غير أن علينا أن نضع خطة دقيقة أولا.", status: correct}
    feedback: "*على الرغم من أن الأمر يحمل مخاطرة، أنا أؤيد فتح مكتب ثانٍ. غير أن علينا أن نضع خطة دقيقة أولا.* links a concession-plus-restated-position to a stronger contrastive point, as required."
