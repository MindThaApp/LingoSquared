  ar.a1.unit60.lesson06.exercise04.match_kys_mkhbz_mndda:
    instruction: Match each Arabic word or sentence to its meaning.
    accepted_answers:
    - value:
      - left: كيس
        right: bag
      - left: ليلى معها كيس كرواسانات.
        right: Layla has a bag of croissants.
      - left: كيف كان المخبز؟
        right: How was the bakery?
