    instruction: Listen to the dialogue and choose what was fresh, according to Yusuf.
    correct_option: The croissants.
    distractors:
    - The bread.
    - It was expensive.
    - He doesn't say.
    accepted_answers:
    - value: The croissants.
      status: correct
    feedback: 'Yusuf says: جيد جدا! كانت الكرواسانات طازجة (jayyid jiddan! kānat al-kruwāsānāt ṭāzija). A plural of things takes a feminine singular verb and adjective: كانت and طازجة.'
  ar.a1.unit60.lesson06.exercise03.comprehend_hl_ndhhb_ila:
