        right: bakery
      - left: منضدة
        right: counter
      - left: خبز
        right: bread
      - left: معجنات
        right: pastry
      - left: كرواسان
        right: croissant
      - left: موظف
        right: employee
      status: correct
    feedback: كيس (kīs) means bag. With ال it is الكيس (al-kīs), and ك is a moon letter, so ال is pronounced al-.
