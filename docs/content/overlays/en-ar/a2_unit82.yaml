  ar.a2.unit82.idha.lesson03.exercise05.fill_kunta: {"instruction": "Fill in the missing word.", "correct_option": "كُنْتَ", "accepted_answers": [{"value": "كُنْتَ", "status": "correct"}], "feedback": "*كُنْتَ* = you are."}
