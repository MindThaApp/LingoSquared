  ar.a2.unit82.idha.lesson02.exercise07.wr_tired: {"instruction": "Write the requested Arabic sentence.", "correct_option": "إِذَا تَعِبْتُ، سَأَنَامُ مُبَكِّرًا.", "accepted_answers": [{"value": "إِذَا تَعِبْتُ، سَأَنَامُ مُبَكِّرًا.", "status": "correct"}, {"value": "إِذَا تَعِبْتُ، سَأَنَامُ مُبَكِّرًا", "status": "correct"}], "feedback": "*تَعِبْتُ* = I get tired."}
  ar.a2.unit82.idha.lesson03.exercise01.you_busy: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "إِذَا كُنْتَ مَشْغُولًا، سَأَذْهَبُ وَحْدِي.", "distractors": ["إِذَا كُنْتُ مَشْغُولًا، سَأَذْهَبُ وَحْدِي.", "إِذَا كُنْتَ مُتْعَبًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا كَانَ يُوسُف مَشْغُولًا، سَأَذْهَبُ وَحْدِي."], "accepted_answers": [{"value": "إِذَا كُنْتَ مَشْغُولًا، سَأَذْهَبُ وَحْدِي.", "status": "correct"}], "feedback": "*كُنْتَ* = you are (masc.)."}
  ar.a2.unit82.idha.lesson03.exercise02.yusuf_sick: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "إِذَا كَانَ يُوسُف مَرِيضًا، سَنَبْقَى فِي الْبَيْت.", "distractors": ["إِذَا كَانَ يُوسُف مَرِيضًا، سَأَذْهَبُ وَحْدِي.", "إِذَا كُنْتَ مَرِيضًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت."], "accepted_answers": [{"value": "إِذَا كَانَ يُوسُف مَرِيضًا، سَنَبْقَى فِي الْبَيْت.", "status": "correct"}], "feedback": "*مَرِيضًا* = sick."}
  ar.a2.unit82.idha.lesson03.exercise03.match_kana: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "كُنْتَ", "right": "you are (masc.)"}, {"left": "كُنْتُ", "right": "I am"}, {"left": "كَانَ", "right": "he is"}, {"left": "مَشْغُولًا", "right": "busy"}, {"left": "مُتْعَبًا", "right": "tired"}, {"left": "مَرِيضًا", "right": "sick"}, {"left": "وَحْدِي", "right": "alone, by myself"}], "status": "correct"}], "feedback": "Persons after if."}
