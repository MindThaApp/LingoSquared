  ar.a2.unit82.idha.lesson03.exercise07.wr_busy_me: {"instruction": "Write the requested Arabic sentence.", "correct_option": "إِذَا كُنْتُ مَشْغُولًا، سَأَذْهَبُ وَحْدِي.", "accepted_answers": [{"value": "إِذَا كُنْتُ مَشْغُولًا، سَأَذْهَبُ وَحْدِي.", "status": "correct"}, {"value": "إِذَا كُنْتُ مَشْغُولًا، سَأَذْهَبُ وَحْدِي", "status": "correct"}], "feedback": "*كُنْتُ مَشْغُولًا*."}
