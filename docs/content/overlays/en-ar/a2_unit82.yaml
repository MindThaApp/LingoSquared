  ar.a2.unit82.idha.lesson02.exercise03.match_verbs: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "أَمْطَرَتِ السَّمَاء", "right": "it rains"}, {"left": "تَعِبْتُ", "right": "I get tired"}, {"left": "وَصَلَ", "right": "he arrives"}, {"left": "مَعًا", "right": "together"}, {"left": "سَنَأْكُلُ", "right": "we will eat"}, {"left": "سَأَنَامُ", "right": "I will sleep"}, {"left": "مُبَكِّرًا", "right": "early"}], "status": "correct"}], "feedback": "Conditions with a verb."}
