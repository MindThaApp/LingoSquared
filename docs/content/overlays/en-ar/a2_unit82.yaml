course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit82.idha: {"title": "If", "description": "Talk about real conditions and what you will do with idha, for example plans that depend on the weather or on how you feel."}
lessons:
  ar.a2.unit82.idha.lesson01.idha_kana: {"title": "If it is"}
  ar.a2.unit82.idha.lesson02.idha_past_verb: {"title": "If + verb"}
  ar.a2.unit82.idha.lesson03.idha_persons: {"title": "If you are"}
  ar.a2.unit82.idha.lesson04.what_will_you_do: {"title": "What will you do?"}
  ar.a2.unit82.idha.lesson05.reading_layla: {"title": "Layla's plans"}
  ar.a2.unit82.idha.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit82.idha.lesson01.teach.words: {"title": "Weather plans", "gloss": "the garden, the park / the weather / nice (after kana) / cold (after kana) / at home", "example_gloss": ["The weather is nice.", "The weather is cold."]}
  ar.a2.unit82.idha.lesson01.teach.future: {"title": "If and will", "gloss": "if / it is, he is (here: after if) / we will go / we will stay", "example_gloss": ["If the weather is nice, we will go to the park.", "If the weather is cold, we will stay at home."]}
  ar.a2.unit82.idha.lesson01.teach.gn_idha: {"title": "إِذَا + كَانَ", "gloss": "If the weather is nice, we will go to the park. If the weather is cold, we will stay at home.", "note": "*إِذَا* means if. After it comes *كَانَ* and the adjective ends in *-an* (*جَمِيلًا*, *بَارِدًا*). The result uses the future with *سَـ*."}
  ar.a2.unit82.idha.lesson01.teach.gn_future: {"title": "The result: future", "gloss": "We will go to the park. We will stay at home.", "note": "The result of a real condition is a future (*سَـ* + verb), as in English: if A, then B will happen."}
  ar.a2.unit82.idha.lesson02.teach.words: {"title": "Events", "gloss": "it rained (the sky rained) / the sky / I got tired / he arrived / Yusuf / early / together / we will eat / I will sleep", "example_gloss": ["If it rains, we will stay at home.", "If I get tired, I will sleep early."]}
  ar.a2.unit82.idha.lesson02.teach.gn_past: {"title": "إِذَا + past form", "gloss": "If it rains, we will stay at home. If I get tired, I will sleep early.", "note": "After *إِذَا* a verb is often in the past form, but the meaning is present or future: *أَمْطَرَتِ* means it rains, *تَعِبْتُ* means I get tired."}
  ar.a2.unit82.idha.lesson02.teach.gn_past2: {"title": "The subject", "gloss": "If Yusuf arrives early, we will eat together.", "note": "The verb comes first and the subject follows: *وَصَلَ يُوسُف*. The result is still *سَـ* + verb."}
  ar.a2.unit82.idha.lesson03.teach.words: {"title": "Persons", "gloss": "you are (masc.) / I am / busy / tired / sick / alone, by myself / I will go", "example_gloss": ["If you are busy, I will go alone."]}
  ar.a2.unit82.idha.lesson03.teach.gn_kana: {"title": "كَانَ for each person", "gloss": "If you are busy, I will go alone. If I am tired, I will sleep early.", "note": "*كَانَ* changes with the person: *كُنْتُ* (I), *كُنْتَ* (you, masc.), *كَانَ* (he). The adjective after it ends in *-an*."}
  ar.a2.unit82.idha.lesson03.teach.gn_kana2: {"title": "With a name", "gloss": "If Yusuf is sick, we will stay at home.", "note": "With a name the verb is *كَانَ*, as for *he*."}
  ar.a2.unit82.idha.lesson04.teach.words: {"title": "Asking about plans", "gloss": "what / you will do / I will stay", "example_gloss": ["What will you do if it rains?", "I will stay at home."]}
  ar.a2.unit82.idha.lesson04.teach.gn_q: {"title": "A question with if", "gloss": "What will you do if it rains? I will stay at home.", "note": "Ask with *مَاذَا سَتَفْعَلُ* and put the condition after it. The answer is the result clause."}
  ar.a2.unit82.idha.lesson04.teach.gn_order: {"title": "Result first", "gloss": "I will stay at home if it rains. I will go to the park if the weather is nice.", "note": "The condition can also come last, with no comma."}
  ar.a2.unit82.idha.lesson05.teach.text_words: {"title": "Tomorrow", "gloss": "tomorrow", "example_gloss": ["Tomorrow I will go to the park."]}
  ar.a2.unit82.idha.lesson05.teach.reading: {"title": "Layla's plans", "gloss": "If the weather is nice tomorrow, I will go to the park. If it rains, I will stay at home. And if I get tired, I will sleep early.", "note": "Three plans, each with its condition."}
  ar.a2.unit82.idha.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: What will you do tomorrow, Yusuf?"}
  ar.a2.unit82.idha.lesson06.teach.d2: {"title": "Yusuf answers", "gloss": "Yusuf: If the weather is nice, I will go to the park."}
  ar.a2.unit82.idha.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And what will you do if it rains?"}
  ar.a2.unit82.idha.lesson06.teach.d4: {"title": "Yusuf continues", "gloss": "Yusuf: I will stay at home and I will read the book."}
  ar.a2.unit82.idha.lesson06.teach.d5: {"title": "Layla suggests", "gloss": "Layla: Good, we will go to the park together if the weather is nice!"}
exercises:
  ar.a2.unit82.idha.lesson01.exercise01.nice_park: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "distractors": ["إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَذْهَبُ إِلَى الْحَدِيقَة."], "accepted_answers": [{"value": "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "status": "correct"}], "feedback": "*جَمِيلًا* = nice."}
  ar.a2.unit82.idha.lesson01.exercise02.cold_home: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "distractors": ["إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَذْهَبُ إِلَى الْحَدِيقَة."], "accepted_answers": [{"value": "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "status": "correct"}], "feedback": "*سَنَبْقَى* = we will stay."}
  ar.a2.unit82.idha.lesson01.exercise03.match_idha: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "إِذَا", "right": "if"}, {"left": "كَانَ", "right": "it is, he is (after if)"}, {"left": "الْحَدِيقَة", "right": "the garden, the park"}, {"left": "جَمِيلًا", "right": "nice"}, {"left": "بَارِدًا", "right": "cold"}, {"left": "سَنَذْهَبُ", "right": "we will go"}, {"left": "سَنَبْقَى", "right": "we will stay"}, {"left": "فِي الْبَيْت", "right": "at home"}], "status": "correct"}], "feedback": "If and the future."}
  ar.a2.unit82.idha.lesson01.exercise04.order_nice: {"instruction": "Put the words in order to say 'If the weather is nice, we will go to the park.'", "correct_option": "إِذَا كَانَ الطَّقْس جَمِيلًا سَنَذْهَبُ إِلَى الْحَدِيقَة", "accepted_answers": [{"value": "إِذَا كَانَ الطَّقْس جَمِيلًا سَنَذْهَبُ إِلَى الْحَدِيقَة", "status": "correct"}], "feedback": "*إِذَا كَانَ* first."}
  ar.a2.unit82.idha.lesson01.exercise05.fill_kana: {"instruction": "Fill in the missing word.", "correct_option": "كَانَ", "accepted_answers": [{"value": "كَانَ", "status": "correct"}], "feedback": "*إِذَا كَانَ* + noun + adjective."}
  ar.a2.unit82.idha.lesson01.exercise06.tr_nice: {"instruction": "Translate into Arabic.", "correct_option": "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "accepted_answers": [{"value": "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "status": "correct"}, {"value": "إِذَا كَانَ الطَّقْس جَمِيلًا، سَنَذْهَبُ إِلَى الْحَدِيقَة", "status": "correct"}], "feedback": "*إِذَا* + *كَانَ*."}
  ar.a2.unit82.idha.lesson01.exercise07.wr_cold: {"instruction": "Write the requested Arabic sentence.", "correct_option": "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "accepted_answers": [{"value": "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "status": "correct"}, {"value": "إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت", "status": "correct"}], "feedback": "The result uses *سَنَبْقَى*."}
  ar.a2.unit82.idha.lesson02.exercise01.rain_stay: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "إِذَا أَمْطَرَتِ السَّمَاء، سَنَبْقَى فِي الْبَيْت.", "distractors": ["إِذَا كَانَ الطَّقْس بَارِدًا، سَنَبْقَى فِي الْبَيْت.", "إِذَا أَمْطَرَتِ السَّمَاء، سَنَذْهَبُ إِلَى الْحَدِيقَة.", "إِذَا تَعِبْتُ، سَأَنَامُ مُبَكِّرًا."], "accepted_answers": [{"value": "إِذَا أَمْطَرَتِ السَّمَاء، سَنَبْقَى فِي الْبَيْت.", "status": "correct"}], "feedback": "*أَمْطَرَتِ السَّمَاء* = it rains."}
