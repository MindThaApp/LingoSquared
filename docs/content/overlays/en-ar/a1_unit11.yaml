exercises:
  ar.a1.unit11.lesson01.exercise01.recognize_study:
    instruction: "Select the meaning."
    correct_option: "I study"
    distractors: ["I sleep", "I want", "I ask"]
    accepted_answers: [{value: "I study", status: correct}]
    feedback: "أدرس means I study."
  ar.a1.unit11.lesson01.exercise02.listen_study_time:
    instruction: "Listen and select what you hear."
    correct_option: "I study at nine o'clock."
    distractors: ["I sleep at ten o'clock.", "I wake up at seven o'clock.", "The lesson is at five o'clock."]
    accepted_answers: [{value: "I study at nine o'clock.", status: correct}]
    feedback: "You heard أدرس في الساعة التاسعة."
  ar.a1.unit11.lesson01.exercise03.match_actions:
    instruction: "Match each Arabic routine phrase with its meaning."
    accepted_answers:
      - value: {أستيقظ: "I wake up", أدرس: "I study", أنام: "I sleep", "كل يوم": "every day"}
        status: correct
    feedback: "These are common routine words."
  ar.a1.unit11.lesson01.exercise04.order_study_time:
    instruction: "Arrange the Arabic words for I study at nine o'clock."
    accepted_answers: [{value: [أدرس, في, الساعة, التاسعة], status: correct}]
    feedback: "أدرس في الساعة التاسعة gives an activity and time."
  ar.a1.unit11.lesson01.exercise05.translate_sleep:
    instruction: "Translate into Arabic: I sleep at ten o'clock."
    accepted_answers:
      - {value: "أنام في الساعة العاشرة", status: correct}
      - {value: "أنام في الساعة العاشرة.", status: correct}
    feedback: "أنام في الساعة العاشرة means I sleep at ten o'clock."
  ar.a1.unit11.lesson01.exercise06.write_wake:
    instruction: "Type I wake up at seven o'clock in Arabic."
    accepted_answers:
      - {value: "أستيقظ في الساعة السابعة", status: correct}
      - {value: "أستيقظ في الساعة السابعة.", status: correct}
    feedback: "أستيقظ في الساعة السابعة is the expected sentence."
  ar.a1.unit11.lesson02.exercise01.recognize_question:
    instruction: "Select the meaning."
    correct_option: "What do you do every day?"
    distractors: ["Where is the library?", "How much are the apples?", "What is your name?"]
    accepted_answers: [{value: "What do you do every day?", status: correct}]
    feedback: "ماذا تفعل كل يوم؟ asks about a daily routine."
  ar.a1.unit11.lesson02.exercise02.dialogue_routine_time:
    instruction: "What is Yusuf's routine?"
    correct_option: "wake at seven, study at nine, sleep at ten"
    distractors: ["study at seven, sleep at nine, wake at ten", "go to the market, then the cafe", "ask for the library, then turn right"]
    accepted_answers: [{value: "wake at seven, study at nine, sleep at ten", status: correct}]
    feedback: "Yusuf says three daily activities with times."
  ar.a1.unit11.lesson02.exercise03.match_routine_times:
    instruction: "Match each Arabic routine sentence with its meaning."
    accepted_answers:
      - value: {"أستيقظ في الساعة السابعة": "I wake up at seven", "أدرس في الساعة التاسعة": "I study at nine", "أنام في الساعة العاشرة": "I sleep at ten"}
        status: correct
    feedback: "Each sentence combines an activity with a time."
  ar.a1.unit11.lesson02.exercise04.order_question:
    instruction: "Arrange the Arabic words for What do you do every day?"
    accepted_answers: [{value: [ماذا, تفعل, كل, يوم], status: correct}]
    feedback: "ماذا تفعل كل يوم؟ asks about routine."
  ar.a1.unit11.lesson02.exercise05.answer_routine:
    instruction: "Type the Arabic answer: I study at nine o'clock."
    accepted_answers:
      - {value: "أدرس في الساعة التاسعة", status: correct}
      - {value: "أدرس في الساعة التاسعة.", status: correct}
    feedback: "أدرس في الساعة التاسعة answers with one routine activity."
  ar.a1.unit11.lesson02.exercise06.write_daily_routine:
    instruction: "Type the three Arabic routine sentences exactly: I wake up at seven. I study at nine. I sleep at ten."
    accepted_answers:
      - {value: "أستيقظ في الساعة السابعة. أدرس في الساعة التاسعة. أنام في الساعة العاشرة.", status: correct}
    feedback: "أستيقظ في الساعة السابعة. أدرس في الساعة التاسعة. أنام في الساعة العاشرة. gives several connected routine sentences."
