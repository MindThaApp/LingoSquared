  ar.a2.unit73.sawfa_yumtir.lesson03.exercise01.promise_early: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَعِدُكَ، سَأَصِلُ مُبَكِّرًا.", "distractors": ["أَعِدُكَ، سَنَصِلُ مُبَكِّرًا.", "أَعِدُكَ، سَأُسَاعِدُكَ غَدًا.", "أَعِدُكَ، سَأَذْهَبُ مُبَكِّرًا."], "accepted_answers": [{"value": "أَعِدُكَ، سَأَصِلُ مُبَكِّرًا.", "status": "correct"}], "feedback": "*أَعِدُكَ* = I promise you."}
