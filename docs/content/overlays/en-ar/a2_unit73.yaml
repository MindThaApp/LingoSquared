  ar.a2.unit73.sawfa_yumtir.lesson02.exercise04.order_uni: {"instruction": "Put the words in order to say 'We will go to the university next week.'", "correct_option": "سَنَذْهَبُ إِلَى الْجَامِعَة الْأُسْبُوع الْقَادِم", "accepted_answers": [{"value": "سَنَذْهَبُ إِلَى الْجَامِعَة الْأُسْبُوع الْقَادِم", "status": "correct"}, {"value": "الْأُسْبُوع الْقَادِم سَنَذْهَبُ إِلَى الْجَامِعَة", "status": "correct"}], "feedback": "Verb, place, time."}
  ar.a2.unit73.sawfa_yumtir.lesson02.exercise05.fill_yusuf: {"instruction": "Fill in the missing word.", "correct_option": "سَيَذْهَبُ", "accepted_answers": [{"value": "سَيَذْهَبُ", "status": "correct"}], "feedback": "A masculine name takes the prefix *يَ*."}
  ar.a2.unit73.sawfa_yumtir.lesson02.exercise06.tr_sea_week: {"instruction": "Translate into Arabic.", "correct_option": "سَنَذْهَبُ إِلَى الْبَحْر الْأُسْبُوع الْقَادِم.", "accepted_answers": [{"value": "سَنَذْهَبُ إِلَى الْبَحْر الْأُسْبُوع الْقَادِم.", "status": "correct"}, {"value": "سَنَذْهَبُ إِلَى الْبَحْر الْأُسْبُوع الْقَادِم", "status": "correct"}, {"value": "الْأُسْبُوع الْقَادِم سَنَذْهَبُ إِلَى الْبَحْر.", "status": "correct"}, {"value": "الْأُسْبُوع الْقَادِم سَنَذْهَبُ إِلَى الْبَحْر", "status": "correct"}], "feedback": "*سَنَذْهَبُ* = we will go."}
