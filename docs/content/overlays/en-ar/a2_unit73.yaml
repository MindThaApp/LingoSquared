  ar.a2.unit73.sawfa_yumtir.lesson03.exercise03.match_promise: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "أَعِدُكَ", "right": "I promise you"}, {"left": "مُبَكِّرًا", "right": "early"}, {"left": "أَصِلُ", "right": "I arrive"}, {"left": "أُسَاعِدُكَ", "right": "I help you"}, {"left": "سَوْفَ", "right": "will (separate word)"}, {"left": "غَدًا", "right": "tomorrow"}], "status": "correct"}], "feedback": "Words for promises."}
  ar.a2.unit73.sawfa_yumtir.lesson03.exercise04.order_sawfa: {"instruction": "Put the words in order to say 'I will arrive early tomorrow.'", "correct_option": "سَوْفَ أَصِلُ مُبَكِّرًا غَدًا", "accepted_answers": [{"value": "سَوْفَ أَصِلُ مُبَكِّرًا غَدًا", "status": "correct"}, {"value": "غَدًا سَوْفَ أَصِلُ مُبَكِّرًا", "status": "correct"}], "feedback": "*سَوْفَ*, verb, adverbs."}
  ar.a2.unit73.sawfa_yumtir.lesson03.exercise05.fill_early: {"instruction": "Fill in the missing word.", "correct_option": "مُبَكِّرًا", "accepted_answers": [{"value": "مُبَكِّرًا", "status": "correct"}], "feedback": "*مُبَكِّرًا* = early."}
