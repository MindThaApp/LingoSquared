review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings; subjunctive after lan keeps the fatha. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit73.sawfa_yumtir: {"title": "Tomorrow the weather will be sunny", "description": "Predict what will happen with sa- plus the present tense, use sawfa and lan, say what might happen with qad, and make a simple promise."}
lessons:
  ar.a2.unit73.sawfa_yumtir.lesson01.sa_yakun: {"title": "It will be tomorrow"}
  ar.a2.unit73.sawfa_yumtir.lesson02.sa_persons: {"title": "I will go, we will go"}
  ar.a2.unit73.sawfa_yumtir.lesson03.sawfa_wa3d: {"title": "Sawfa and a promise"}
  ar.a2.unit73.sawfa_yumtir.lesson04.lan_qad: {"title": "Will not and might"}
  ar.a2.unit73.sawfa_yumtir.lesson05.reading_layla: {"title": "Layla's forecast"}
  ar.a2.unit73.sawfa_yumtir.lesson06.dialogue: {"title": "Yusuf and Layla"}
teaching:
  ar.a2.unit73.sawfa_yumtir.lesson01.teach.weather: {"title": "Weather and days", "gloss": "the weather / the rain / sunny / cold / tomorrow / today", "example_gloss": ["Tomorrow the weather will be sunny.", "Today the weather is cold."]}
  ar.a2.unit73.sawfa_yumtir.lesson01.teach.gn_sa: {"title": "سَـ + present tense", "gloss": "The weather is sunny today. The weather will be sunny tomorrow.", "note": "Put *سَـ* in front of the present-tense verb to say what will happen. It is written as one word with the verb: *يَكُونُ* becomes *سَيَكُونُ*."}
  ar.a2.unit73.sawfa_yumtir.lesson01.teach.gn_rain: {"title": "The verb for rain", "gloss": "It is raining today. It will rain tomorrow.", "note": "*يُمْطِرُ* means it rains and has no separate subject. Add *سَـ* for the future."}
  ar.a2.unit73.sawfa_yumtir.lesson01.teach.gn_fem: {"title": "Feminine subject: سَتَكُونُ", "gloss": "The party will be fun tomorrow.", "note": "With a feminine subject the prefix changes: *سَيَكُونُ* for masculine, *سَتَكُونُ* for feminine. The word after *تَكُونُ* takes the ending *-an*."}
  ar.a2.unit73.sawfa_yumtir.lesson02.teach.places: {"title": "Places and time", "gloss": "the sea / the university / next week", "example_gloss": ["I will go to the sea tomorrow.", "We will go to the university next week."]}
  ar.a2.unit73.sawfa_yumtir.lesson02.teach.gn_paradigm: {"title": "سَـ with every person", "gloss": "I will go, you (masc.) will go, you (fem.) will go, he will go, she will go, we will go, they will go", "note": "The prefix letter of the present tense shows the person: *أ* I, *ت* you or she, *ي* he or they, *ن* we. *سَتَذْهَبُ* can mean you (masc.) will go or she will go; the context decides."}
  ar.a2.unit73.sawfa_yumtir.lesson02.teach.gn_people: {"title": "A name as subject", "gloss": "Yusuf will go to the sea. Layla will go to the university.", "note": "When the verb comes first it agrees in gender with the name: *سَيَذْهَبُ* for Yusuf, *سَتَذْهَبُ* for Layla."}
  ar.a2.unit73.sawfa_yumtir.lesson03.teach.words: {"title": "Words for promises", "gloss": "will / I promise you / early / I help you / I arrive", "example_gloss": ["I promise you, I will arrive early.", "I will help you tomorrow.", "I promise you, I will help you.", "Yusuf will help you tomorrow."]}
  ar.a2.unit73.sawfa_yumtir.lesson03.teach.gn_sawfa: {"title": "سَوْفَ", "gloss": "I will arrive early. I will arrive early. We will arrive early.", "note": "*سَوْفَ* means the same as *سَـ* but is a separate word. It often sounds a little more formal or points to a more distant future."}
  ar.a2.unit73.sawfa_yumtir.lesson03.teach.gn_promise: {"title": "Promising", "gloss": "I promise you, Yusuf, I will arrive early. I promise you, Layla, I will help you.", "note": "A promise is *أَعِدُكَ* plus a sentence with *سَـ*. Speaking to a woman the last vowel changes: *أَعِدُكِ*, *أُسَاعِدُكِ*. In unvocalised writing the two look the same."}
  ar.a2.unit73.sawfa_yumtir.lesson04.teach.words: {"title": "Will not and might", "gloss": "will not / may, might / I am late / I forget / the bread", "example_gloss": ["I will not be late.", "I will not forget the bread."]}
  ar.a2.unit73.sawfa_yumtir.lesson04.teach.gn_lan: {"title": "لَنْ: will not", "gloss": "I will be late. I will not be late.", "note": "*لَنْ* is the negative of the future. It replaces *سَـ*, and the verb after it ends in *-a* (*أَتَأَخَّرَ*), not *-u*."}
  ar.a2.unit73.sawfa_yumtir.lesson04.teach.gn_lan_rain: {"title": "لَنْ with another verb", "gloss": "It will rain tomorrow. It will not rain tomorrow.", "note": "The same pattern works for every verb: *لَنْ* plus the present tense with the ending *-a*."}
  ar.a2.unit73.sawfa_yumtir.lesson04.teach.gn_qad: {"title": "قَدْ + present: might", "gloss": "It might rain tomorrow. It will rain tomorrow. I might be late.", "note": "*قَدْ* before a present-tense verb means maybe or might. *سَيُمْطِرُ* says you are sure. Do not confuse it with *قَدْ* before a past verb, which means already."}
  ar.a2.unit73.sawfa_yumtir.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "but / (calling someone)", "example_gloss": ["It will not rain, but it might be cold.", "I promise you, Yusuf."]}
  ar.a2.unit73.sawfa_yumtir.lesson05.teach.reading: {"title": "Layla's plan for tomorrow", "gloss": "Tomorrow the weather will be sunny. It will not rain, but it might be cold. We will go to the sea. I promise you, Yusuf, I will arrive early and I will not forget the bread.", "note": "A forecast (*سَيَكُونُ*, *لَنْ*, *قَدْ*) followed by a promise."}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: Will it rain tomorrow, Layla?"}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d2: {"title": "Layla answers", "gloss": "Layla: No, it will not rain. The weather will be sunny."}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d3: {"title": "Yusuf asks more", "gloss": "Yusuf: And will we go to the sea?"}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d4: {"title": "Layla warns", "gloss": "Layla: Yes, we will go. But the weather might be cold."}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d5: {"title": "Yusuf promises", "gloss": "Yusuf: I promise you, I will arrive early and I will not forget the bread."}
  ar.a2.unit73.sawfa_yumtir.lesson06.teach.d6: {"title": "Layla thanks him", "gloss": "Layla: Thank you, Yusuf!"}
exercises:
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise01.sunny_tomorrow: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "غَدًا سَيَكُونُ الْجَوّ مُشْمِسًا.", "distractors": ["الْيَوْم يَكُونُ الْجَوّ مُشْمِسًا.", "غَدًا سَيَكُونُ الْجَوّ بَارِدًا.", "سَيُمْطِرُ غَدًا."], "accepted_answers": [{"value": "غَدًا سَيَكُونُ الْجَوّ مُشْمِسًا.", "status": "correct"}], "feedback": "*سَيَكُونُ* = will be."}
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise02.rain_tomorrow: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "سَيُمْطِرُ غَدًا.", "distractors": ["يُمْطِرُ الْيَوْم.", "سَيَكُونُ الْجَوّ بَارِدًا غَدًا.", "غَدًا سَيَكُونُ الْجَوّ مُشْمِسًا."], "accepted_answers": [{"value": "سَيُمْطِرُ غَدًا.", "status": "correct"}], "feedback": "*سَيُمْطِرُ* = it will rain."}
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise03.match_weather: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "الْجَوّ", "right": "the weather"}, {"left": "الْمَطَر", "right": "the rain"}, {"left": "مُشْمِسًا", "right": "sunny"}, {"left": "بَارِدًا", "right": "cold"}, {"left": "غَدًا", "right": "tomorrow"}, {"left": "الْيَوْم", "right": "today"}], "status": "correct"}], "feedback": "Weather words and day words."}
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise04.order_party: {"instruction": "Put the words in order to say 'The party will be fun tomorrow.'", "correct_option": "سَتَكُونُ الْحَفْلَة مُمْتِعَةً غَدًا", "accepted_answers": [{"value": "سَتَكُونُ الْحَفْلَة مُمْتِعَةً غَدًا", "status": "correct"}, {"value": "غَدًا سَتَكُونُ الْحَفْلَة مُمْتِعَةً", "status": "correct"}], "feedback": "Future verb, subject, predicate, day."}
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise05.fill_sa: {"instruction": "Fill in the missing word.", "correct_option": "سَيَكُونُ", "accepted_answers": [{"value": "سَيَكُونُ", "status": "correct"}], "feedback": "*سَـ* joins the verb."}
  ar.a2.unit73.sawfa_yumtir.lesson01.exercise06.tr_cold: {"instruction": "Translate into Arabic.", "correct_option": "سَيَكُونُ الْجَوّ بَارِدًا غَدًا.", "accepted_answers": [{"value": "سَيَكُونُ الْجَوّ بَارِدًا غَدًا.", "status": "correct"}, {"value": "سَيَكُونُ الْجَوّ بَارِدًا غَدًا", "status": "correct"}, {"value": "غَدًا سَيَكُونُ الْجَوّ بَارِدًا.", "status": "correct"}, {"value": "غَدًا سَيَكُونُ الْجَوّ بَارِدًا", "status": "correct"}], "feedback": "*سَيَكُونُ* then the subject."}
