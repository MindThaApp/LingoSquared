  ar.a2.unit73.sawfa_yumtir.lesson02.exercise01.i_go_sea: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "سَأَذْهَبُ إِلَى الْبَحْر غَدًا.", "distractors": ["سَنَذْهَبُ إِلَى الْبَحْر غَدًا.", "سَيَذْهَبُ يُوسُف إِلَى الْبَحْر غَدًا.", "سَأَذْهَبُ إِلَى الْجَامِعَة غَدًا."], "accepted_answers": [{"value": "سَأَذْهَبُ إِلَى الْبَحْر غَدًا.", "status": "correct"}], "feedback": "*سَأَذْهَبُ* = I will go."}
