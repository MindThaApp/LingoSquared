  ar.a1.unit57.lesson06.exercise01.listen_kyf_kant_mdyna:
    instruction: Listen to the dialogue and choose what Layla asks.
    correct_option: How was the amusement park?
    distractors:
    - Did you buy a ticket?
    - Is the roller coaster tall?
    - Do you want a snack?
    accepted_answers:
    - value: How was the amusement park?
      status: correct
    feedback: 'Layla asks: كيف كانت مدينة الملاهي؟ (kayfa kānat madīnat al-malāhī). كانت (kānat) means was, and it ends in ت because مدينة is feminine.'
  ar.a1.unit57.lesson06.exercise02.comprehend_mmtaa_jda_alafawanya:
    instruction: Listen to the dialogue and choose what was exciting, according to Yusuf.
    correct_option: The roller coaster.
    distractors:
    - The Ferris wheel.
    - It was boring.
    - He doesn't say.
    accepted_answers:
    - value: The roller coaster.
      status: correct
    feedback: 'Yusuf says: ممتعة جدا! الأفعوانية كانت مثيرة (mumtiʿa jiddan! al-afʿawāniyya kānat muthīra). The verb كانت and the adjective مثيرة are feminine to agree with الأفعوانية.'
  ar.a1.unit57.lesson06.exercise03.comprehend_hl_ndhhb_ila:
    instruction: Listen to the dialogue and choose what Layla suggests.
    correct_option: Going to the theatre together next week.
    distractors:
    - Going to the amusement park again.
    - Going to the football match again.
    - She doesn't suggest anything.
    accepted_answers:
    - value: Going to the theatre together next week.
      status: correct
    feedback: 'Layla asks: هل نذهب إلى المسرح معا الأسبوع القادم؟ (hal nadhhab ilā al-masraḥ maʿan al-usbūʿ al-qādim). نذهب (nadhhab) means we go, and هل (hal) makes it a question: shall we go.'
