exercises:
  ar.a2.unit34.lesson01.exercise01.recognize_defect:
    instruction: "Select the meaning."
    correct_option: "there's a defect"
    distractors: [return, "this shirt", "slightly torn"]
    accepted_answers: [{value: "there's a defect", status: correct}]
    feedback: "*فيه عيب* means there's a defect."
  ar.a2.unit34.lesson01.exercise02.listen_slightly_torn:
    instruction: "Listen and select what you hear."
    correct_option: "slightly torn"
    distractors: [return, "the size is wrong", "there's a defect"]
    accepted_answers: [{value: "slightly torn", status: correct}]
    feedback: "You heard *ممزق قليلا*."
  ar.a2.unit34.lesson01.exercise03.match_complaint_words:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {إرجاع: return, القميص: shirt, عيب: defect, "الحجم غير صحيح": "the size is wrong", "ممزق قليلا": "slightly torn", نعم: "Yes"}
        status: correct
    feedback: "These words describe returning a defective shirt."
  ar.a2.unit34.lesson01.exercise04.order_problem:
    instruction: "Arrange the Arabic words for There's a defect: the size is wrong and it's slightly torn."
    accepted_answers: [{value: [فيه, عيب, الحجم, غير, صحيح, وممزق, قليلا], status: correct}]
    feedback: "*فيه عيب، الحجم غير صحيح وممزق قليلا* describes the defect."
  ar.a2.unit34.lesson01.exercise05.write_problem:
    instruction: "Type exactly this formal Arabic sentence: I want to return this shirt; there's a defect, the size is wrong and it's slightly torn."
    accepted_answers:
      - {value: "أريد إرجاع هذا القميص، فيه عيب، الحجم غير صحيح وممزق قليلا", status: correct}
      - {value: "أريد إرجاع هذا القميص. فيه عيب، الحجم غير صحيح وممزق قليلا.", status: correct}
      - {value: "أريد إرجاع هذا القميص، فيه عيب، الحجم غير صحيح وممزق قليلا.", status: correct}
    feedback: "*أريد إرجاع هذا القميص، فيه عيب، الحجم غير صحيح وممزق قليلا.* explains the defect."
  ar.a2.unit34.lesson02.exercise01.recognize_refund:
    instruction: "Select the meaning."
    correct_option: refund
    distractors: [receipt, exchange, please]
    accepted_answers: [{value: refund, status: correct}]
    feedback: "*استرداد المال* means refund."
  ar.a2.unit34.lesson02.exercise02.dialogue_yusuf_wants:
    instruction: "What does Yusuf ask for at the end of the conversation?"
    correct_option: "A refund."
    distractors: ["An exchange.", "A repair.", "Nothing, he keeps the shirt."]
    accepted_answers: [{value: "A refund.", status: correct}]
    feedback: "Yusuf says *أريد استرداد المال، من فضلك*."
  ar.a2.unit34.lesson02.exercise03.match_refund_lines:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"أريد إرجاع هذا القميص.": "I want to return this shirt.", "ما المشكلة فيه؟": "What's wrong with it?", "هل معك الإيصال؟": "Do you have the receipt?", "استرداد المال أم استبدال القميص": "a refund or an exchange of the shirt", "من فضلك": please, نعم: "Yes"}
        status: correct
    feedback: "These lines cover the return, the receipt check, and the resolution options."
  ar.a2.unit34.lesson02.exercise04.order_want_refund:
    instruction: "Arrange the Arabic words for I want a refund, please."
    accepted_answers: [{value: [أريد, استرداد, المال, من, فضلك], status: correct}]
    feedback: "*أريد استرداد المال، من فضلك* requests the refund."
  ar.a2.unit34.lesson02.exercise05.write_complaint_refund:
    instruction: "Write a short formal Arabic message with exactly this content: say you want to return this shirt; say it has a defect, the size is wrong and it's slightly torn; and ask for a refund, please."
    accepted_answers:
      - {value: "أريد إرجاع هذا القميص. فيه عيب، الحجم غير صحيح وممزق قليلا. أريد استرداد المال، من فضلك.", status: correct}
      - {value: "أريد إرجاع هذا القميص، فيه عيب، الحجم غير صحيح وممزق قليلا. أريد استرداد المال من فضلك.", status: correct}
    feedback: "*أريد إرجاع هذا القميص. فيه عيب، الحجم غير صحيح وممزق قليلا. أريد استرداد المال، من فضلك.* is the requested complaint-plus-refund message."
