  ar.b1.unit51.lesson01.law_madi: {title: "If + past... (unreal past condition)"}
  ar.b1.unit51.lesson02.law_takhfif: {title: "If only... (softened suggestion)"}
  ar.b1.unit51.lesson03.hiwar_iftiradiyat: {title: "Dialogue: reflecting on the project"}
teaching:
  ar.b1.unit51.lesson01.teach.law_kana_ladayna_waqt: {title: "If we had had more time", gloss: "if we had had more time", note: "*لو كان لدينا وقت أكثر* opens an unreal past condition with لو + past.", example_gloss: "If we had had more time, we would have finished the project."}
  ar.b1.unit51.lesson01.teach.lakunna_anhayna: {title: "We would have finished the project", gloss: "we would have finished the project", note: "*لكنا أنهينا المشروع* is the لـ+past result clause of a لو conditional.", example_gloss: "If we had had more time, we would have finished the project."}
  ar.b1.unit51.lesson01.teach.yusuf_law_kana: {title: "Yusuf states the unreal past condition", gloss: "If we had had more time, we would have finished the project.", note: "*لو* + past + *لـ*+past is the classic MSA unreal-past conditional.", example_gloss: "Yusuf said: If we had had more time, we would have finished the project."}
  ar.b1.unit51.lesson02.teach.law_rakkazna: {title: "If only we focused on the budget", gloss: "if only we focused on the budget", note: "*لو ركزنا على الميزانية* uses لو alone (no result clause) to soften a suggestion.", example_gloss: "If only we focused on the budget first."}
  ar.b1.unit51.lesson02.teach.awwalan_takhfif: {title: "First", gloss: "first", note: "*أولا* means first.", example_gloss: "If only we focused on the budget first."}
  ar.b1.unit51.lesson02.teach.yusuf_law_rakkazna: {title: "Yusuf softens a suggestion", gloss: "If only we focused on the budget first.", note: "لو with no stated result clause softens a suggestion or preference.", example_gloss: "Yusuf said gently: If only we focused on the budget first."}
  ar.b1.unit51.lesson03.teach.hal_kunna_sanunhi: {title: "Would we have finished the project on time?", gloss: "would we have finished the project on time?", note: "This opens the reflection on the finished project.", example_gloss: "Laila said: Would we have finished the project on time?"}
  ar.b1.unit51.lesson03.teach.yusuf_full_reply: {title: "Yusuf's full hypothetical reply", gloss: "If we had had more time, we would have finished the project. If only we focused on the budget first.", note: "An unreal past condition with its result, then a softened suggestion using لو alone.", example_gloss: "Yusuf said: If we had had more time, we would have finished the project. If only we focused on the budget first."}
exercises:
  ar.b1.unit51.lesson01.exercise01.recognize_law_kana:
    instruction: "Select the meaning."
    correct_option: "If we had had more time"
    distractors: ["Because we had more time", "If we have more time", "We had more time"]
    accepted_answers: [{value: "If we had had more time", status: correct}]
    feedback: "*لو كان لدينا وقت أكثر* opens an unreal past condition."
  ar.b1.unit51.lesson01.exercise02.recognize_law_kana_full:
    instruction: "Select the meaning."
    correct_option: "If we had had more time, we would have finished the project"
    distractors: ["If we have more time, we will finish the project", "If we had had more time, we finished the project", "Because we had more time, we finished the project"]
    accepted_answers: [{value: "If we had had more time, we would have finished the project", status: correct}]
    feedback: "*لو كان لدينا وقت أكثر لكنا أنهينا المشروع* is the full unreal-past conditional with its result."
  ar.b1.unit51.lesson01.exercise03.listen_select_law_kana:
    instruction: "Listen and select what Yusuf says."
    correct_option: "If we had had more time, we would have finished the project."
    distractors: ["If we have more time, we will finish the project.", "If we had had more time, we finished the project.", "Because we had more time, we finished the project."]
    accepted_answers: [{value: "If we had had more time, we would have finished the project.", status: correct}]
    feedback: "You heard *لو كان لدينا وقت أكثر، لكنا أنهينا المشروع*."
  ar.b1.unit51.lesson01.exercise04.match_law_kana:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {لو: if, كان: "was/had", لدينا: "we had", "وقت أكثر": "more time", لكنا: "we would have", أنهينا: finished, المشروع: "the project", "لكنا أنهينا المشروع": "we would have finished the project"}
        status: correct
    feedback: "These phrases cover the unreal past condition and its result."
  ar.b1.unit51.lesson01.exercise05.order_law_kana:
    instruction: "Arrange the Arabic words for If we had had more time, we would have finished the project."
    accepted_answers: [{value: [لو, كان, لدينا, وقت, أكثر, لكنا, أنهينا, المشروع], status: correct}]
    feedback: "*لو كان لدينا وقت أكثر، لكنا أنهينا المشروع* is the unreal-past conditional with its result."
  ar.b1.unit51.lesson01.exercise06.write_law_kana:
    instruction: "Write exactly this unreal past condition using لو: If we had had more time, we would have finished the project."
    accepted_answers:
      - {value: "لو كان لدينا وقت أكثر لكنا أنهينا المشروع", status: correct}
      - {value: "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع.", status: correct}
    feedback: "*لو كان لدينا وقت أكثر، لكنا أنهينا المشروع.* is the requested sentence."
  ar.b1.unit51.lesson02.exercise01.recognize_law_rakkazna:
    instruction: "Select the meaning."
    correct_option: "If only we focused on the budget"
    distractors: ["Because we focused on the budget", "If we focus on the budget", "We focused on the budget"]
    accepted_answers: [{value: "If only we focused on the budget", status: correct}]
    feedback: "*لو ركزنا على الميزانية* softens a suggestion using لو alone."
  ar.b1.unit51.lesson02.exercise02.recognize_law_rakkazna_full:
    instruction: "Select the meaning."
    correct_option: "If only we focused on the budget first"
    distractors: ["Because we focused on the budget first", "If we focus on the budget first", "We focused on the budget first"]
    accepted_answers: [{value: "If only we focused on the budget first", status: correct}]
    feedback: "*لو ركزنا على الميزانية أولا* is the full softened suggestion."
  ar.b1.unit51.lesson02.exercise03.listen_select_law_rakkazna:
    instruction: "Listen and select what Yusuf says."
    correct_option: "If only we focused on the budget first."
    distractors: ["Because we focused on the budget first.", "If we focus on the budget first.", "We focused on the budget first."]
    accepted_answers: [{value: "If only we focused on the budget first.", status: correct}]
    feedback: "You heard *لو ركزنا على الميزانية أولا*."
  ar.b1.unit51.lesson02.exercise04.match_law_rakkazna:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {لو: "if only", ركزنا: "we focused", على: "on", الميزانية: "the budget", أولا: first, "لو ركزنا": "if only we focused", "على الميزانية": "on the budget", "ركزنا على الميزانية": "we focused on the budget"}
        status: correct
    feedback: "These phrases cover the softened suggestion."
  ar.b1.unit51.lesson02.exercise05.order_law_rakkazna:
    instruction: "Arrange the Arabic words for If only we focused on the budget first."
    accepted_answers: [{value: [لو, ركزنا, على, الميزانية, أولا], status: correct}]
    feedback: "*لو ركزنا على الميزانية أولا* softens a suggestion with no stated result clause."
  ar.b1.unit51.lesson02.exercise06.write_law_rakkazna:
    instruction: "Write exactly this softened suggestion using لو alone (no result clause): If only we focused on the budget first."
    accepted_answers:
      - {value: "لو ركزنا على الميزانية أولا", status: correct}
      - {value: "لو ركزنا على الميزانية أولا.", status: correct}
    feedback: "*لو ركزنا على الميزانية أولا.* is the requested sentence."
  ar.b1.unit51.lesson03.exercise01.choose_unreal_past:
    instruction: "Which answer expresses an UNREAL PAST condition with its result, not a softened suggestion?"
    correct_option: "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع"
    distractors: ["لو ركزنا على الميزانية أولا", "هل كنا سننهي المشروع في الوقت المحدد؟", "لو ركزنا على الميزانية"]
    accepted_answers: [{value: "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع", status: correct}]
    feedback: "*لو + الماضي + لكنا + الماضي* is a full unreal-past condition with its result; *لو ركزنا على الميزانية* alone is a softened suggestion with no result clause."
  ar.b1.unit51.lesson03.exercise02.dialogue_comprehension_iftiradiyat:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf says they would have finished the project with more time, and gently suggests focusing on the budget first."
    distractors: ["Yusuf says the project is already finished.", "Yusuf says more time would not have helped.", "Yusuf refuses to discuss the budget."]
    accepted_answers: [{value: "Yusuf says they would have finished the project with more time, and gently suggests focusing on the budget first.", status: correct}]
    feedback: "Yusuf states the unreal past condition first, then softens a suggestion using لو alone."
  ar.b1.unit51.lesson03.exercise03.match_dialogue_iftiradiyat:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"هل كنا سننهي المشروع في الوقت المحدد؟": "Would we have finished the project on time?", "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع.": "If we had had more time, we would have finished the project.", "لو ركزنا على الميزانية أولا.": "If only we focused on the budget first.", لو: "if / if only", لكنا: "we would have", الميزانية: budget}
        status: correct
    feedback: "These lines cover the hypothetical reflection and softened suggestion."
  ar.b1.unit51.lesson03.exercise04.order_hal_kunna:
    instruction: "Arrange the Arabic words for Would we have finished the project on time?"
    accepted_answers: [{value: [هل, كنا, سننهي, المشروع, في, الوقت, المحدد], status: correct}]
    feedback: "*هل كنا سننهي المشروع في الوقت المحدد؟* opens the reflection."
  ar.b1.unit51.lesson03.exercise05.reply_hypothetical_project:
    instruction: "Laila asks: Would we have finished the project on time? Reply as Yusuf, giving the unreal past condition with its result, then a softened suggestion."
    accepted_answers:
      - {value: "لو كان لدينا وقت أكثر لكنا أنهينا المشروع لو ركزنا على الميزانية أولا", status: correct}
      - {value: "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع. لو ركزنا على الميزانية أولا.", status: correct}
    feedback: "*لو كان لدينا وقت أكثر، لكنا أنهينا المشروع. لو ركزنا على الميزانية أولا.* is Yusuf's full reply."
  ar.b1.unit51.lesson03.exercise06.write_full_iftiradiyat:
    instruction: "As Yusuf, answer in two sentences: first, an unreal past condition with its result using لو + الماضي (if we had had more time, we would have finished the project); then a softened suggestion using لو alone with no result clause (if only we focused on the budget first)."
    accepted_answers:
      - {value: "لو كان لدينا وقت أكثر لكنا أنهينا المشروع لو ركزنا على الميزانية أولا", status: correct}
      - {value: "لو كان لدينا وقت أكثر، لكنا أنهينا المشروع. لو ركزنا على الميزانية أولا.", status: correct}
    feedback: "*لو كان لدينا وقت أكثر، لكنا أنهينا المشروع. لو ركزنا على الميزانية أولا.* links an unreal past condition to a softened suggestion, as required."
