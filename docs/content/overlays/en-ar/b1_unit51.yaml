review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar/b1_unit51_iftiradiyat.yaml. Second of the ar B1 50-53 wave. Check the لو + past + لـ+past law-conditional grammar carefully per root CLAUDE.md footgun #6. Review 2026-10-19: 9 fixes - lesson02 notes/feedback/titles called لو + past alone a softened suggestion; after an unreal-past reflection it is a wish/regret, now taught as such (vs ليتني); If only we focused -> If only we had focused throughout; dialogue_comprehension option now says he wishes they had focused on the budget; لدينا glossed we had and overlapping with كان was/had -> we have (lit. with us) / was (past); lakunna note now explains لـ + كنا + past; reply prompt pins both sentences; Laila -> Layla. NATIVE FLAGS: none."}
course: {title: Arabic B1, description: "Intermediate Modern Standard Arabic (fusha): compound modal-plus-embedded-clause constructions for abilities, obligations, conditions, debate, workplace communication, sequenced narrative, real conditions, time clauses, reported speech, purpose, advice and suggestions, complaints, past regret, future plans, summarizing, nuanced debate, hypotheticals, professional meetings, and relative clauses."}
units:
  ar.b1.unit51.iftiradiyat: {title: "Hypotheticals"}
