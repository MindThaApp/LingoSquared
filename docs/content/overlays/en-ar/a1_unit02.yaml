course:
  title: Arabic A1
  description: >-
    Beginner Modern Standard Arabic (fusha) -- reading the script,
    everyday greetings, and handling short polite exchanges.

units:
  ar.a1.unit02.introductions:
    title: "Introductions"

lessons:
  ar.a1.unit02.lesson01.names: {title: "What's your name?"}
  ar.a1.unit02.lesson02.where_from: {title: "Where are you from?"}
  ar.a1.unit02.lesson03.closing_the_exchange: {title: "Closing a first meeting"}
  ar.a1.unit02.lesson04.first_meeting_dialogue: {title: "First-meeting dialogue"}

teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: "What's your name?"
    gloss: "What is your name?"
    note: "ما اسمك؟ (mā ismuk) is the standard way to ask a name; unvocalized, the written form works for any listener."
  ar.a1.unit02.lesson01.teach.ismee:
    title: "My name is"
    gloss: "my name [is]"
    note: "اسمي (ismī) combines اسم (name) with the possessive ending ـي (my)."
    example_gloss: "My name is Karim."
  ar.a1.unit02.lesson01.teach.ana:
    title: "I"
    gloss: "I"
    note: "أنا (anā) is the independent pronoun for I; Arabic verbs also mark person on their own, but أنا is used for emphasis and in simple equational sentences like this one."
    example_gloss: "I'm Sara."
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: "Nice to meet you"
    gloss: "nice to meet you"
    note: "تشرفنا (tasharrafnā), literally 'we are honored,' is the standard mutual response when meeting someone -- either person can say it first."

  ar.a1.unit02.lesson02.teach.min_ayna:
    title: "Where are you from?"
    gloss: "Where are you from?"
    note: "من أين أنت؟ (min ayna anta) asks for someone's origin."
  ar.a1.unit02.lesson02.teach.ana_min:
    title: "I'm from"
    gloss: "I'm from"
    note: "أنا من (anā min) is followed directly by a country or city name."
  ar.a1.unit02.lesson02.teach.lubnan:
    title: "Lebanon"
    gloss: "Lebanon"
    note: "لبنان (lubnān) takes no definite article, unlike most of the other countries in this lesson."
    example_gloss: "I'm from Lebanon."
  ar.a1.unit02.lesson02.teach.misr:
    title: "Egypt"
    gloss: "Egypt"
    note: "مصر (miṣr) also takes no definite article."
    example_gloss: "I'm from Egypt."
  ar.a1.unit02.lesson02.teach.urdun:
    title: "Jordan"
    gloss: "Jordan"
    note: "الأردن (al-ʾurdun) always carries the definite article الـ, as most Arabic country names do."
    example_gloss: "I'm from Jordan."
  ar.a1.unit02.lesson02.teach.maghrib:
    title: "Morocco"
    gloss: "Morocco"
    note: "المغرب (al-maghrib) literally means 'the west' -- the same root used for the sunset/evening prayer time."
    example_gloss: "I'm from Morocco."
  ar.a1.unit02.lesson02.teach.soorya:
    title: "Syria"
    gloss: "Syria"
    note: "سوريا (sūryā) takes no definite article."
    example_gloss: "I'm from Syria."
  ar.a1.unit02.lesson02.teach.iraq:
    title: "Iraq"
    gloss: "Iraq"
    note: "العراق (al-ʿirāq) carries the definite article."
    example_gloss: "I'm from Iraq."

  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: "Are you from...?"
    gloss: "Are you from Egypt?"
    note: "هل (hal) is a yes/no question marker placed at the start of a sentence; it has no independent meaning of its own."
  ar.a1.unit02.lesson03.teach.naam:
    title: "Yes"
    gloss: "yes"
    note: "نعم (naʿam) is the standard affirmative answer."
    example_gloss: "Yes, I'm from Egypt."
  ar.a1.unit02.lesson03.teach.laa:
    title: "No"
    gloss: "no"
    note: "لا (lā) is the standard negative answer."
    example_gloss: "No, I'm from Lebanon."
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: "I was pleased to meet you"
    gloss: "I was pleased to meet you"
    note: "سعدت بلقائك (saʿidtu bi-liqāʾik) is a warmer closing phrase than تشرفنا, often used just before parting."
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: "Welcome to you"
    gloss: "welcome to you / you're welcome here"
    note: "مرحبا بك (marḥaban bik) attaches the pronoun suffix ـك (you) directly onto مرحبا."

  ar.a1.unit02.lesson04.teach.line01:
    title: "Opening greeting"
    gloss: "Yusuf greets Layla."
    note: "The exchange opens with a simple مرحبا before any names are exchanged."
  ar.a1.unit02.lesson04.teach.line02:
    title: "Opening greeting, reply"
    gloss: "Layla greets him back."
    note: "The same word مرحبا works for both sides of a greeting."
  ar.a1.unit02.lesson04.teach.line03:
    title: "Ask a name"
    gloss: "Yusuf asks her name."
    note: "ما اسمك؟ opens the introduction."
  ar.a1.unit02.lesson04.teach.line04:
    title: "Ask a name, reply"
    gloss: "Layla answers and asks him back."
    note: "وأنت؟ reuses the question rather than repeating the whole phrase, a common shortcut."
  ar.a1.unit02.lesson04.teach.line05:
    title: "Answer and mutual pleasure"
    gloss: "Yusuf gives his name and says he's pleased to meet her."
    note: "تشرفنا closes the name exchange."
  ar.a1.unit02.lesson04.teach.line06:
    title: "Mutual pleasure, reply"
    gloss: "Layla returns the same phrase."
    note: "تشرفنا is naturally said by both people, not just one."
  ar.a1.unit02.lesson04.teach.line07:
    title: "Ask origin"
    gloss: "Yusuf asks where she's from."
    note: "من أين أنت؟ moves the conversation to origin."
  ar.a1.unit02.lesson04.teach.line08:
    title: "Ask origin, reply"
    gloss: "Layla answers and asks him back."
    note: "She reuses وأنت؟ again, the same shortcut as line04."
  ar.a1.unit02.lesson04.teach.line09:
    title: "State origin"
    gloss: "Yusuf says he's from Lebanon."
    note: "أنا من لبنان follows the same pattern taught in lesson02."
  ar.a1.unit02.lesson04.teach.line10:
    title: "Close the exchange"
    gloss: "Layla says she was pleased to meet him."
    note: "سعدت بلقائك signals the conversation is naturally winding down."
  ar.a1.unit02.lesson04.teach.line11:
    title: "Farewell"
    gloss: "Yusuf welcomes her back anytime and says goodbye."
    note: "دائما (always/anytime) softens مرحبا بك into an open invitation before the farewell مع السلامة."
  ar.a1.unit02.lesson04.teach.line12:
    title: "Farewell, reply"
    gloss: "Layla says goodbye."
    note: "مع السلامة closes the exchange, taught in a1_unit01."

exercises:
  ar.a1.unit02.lesson01.exercise01.listen_name_question:
    instruction: "Listen and select what you hear."
    correct_option: "What is your name?"
    distractors: ["Where are you from?", "Nice to meet you.", "Good morning."]
    accepted_answers: [{value: "What is your name?", status: correct}]
    feedback: "You heard ما اسمك؟, what is your name?"
  ar.a1.unit02.lesson01.exercise02.recognize_ismee_reading:
    instruction: "What does this word mean?"
    correct_option: "my name [is]"
    distractors: [I, "your name", welcome]
    accepted_answers: [{value: "my name [is]", status: correct}]
    feedback: "اسمي means my name."
  ar.a1.unit02.lesson01.exercise03.recognize_ana:
    instruction: "What does this word mean?"
    correct_option: I
    distractors: [you, "my name", welcome]
    accepted_answers: [{value: I, status: correct}]
    feedback: "أنا means I."
  ar.a1.unit02.lesson01.exercise04.recognize_pleased_reading:
    instruction: "What does this word mean?"
    correct_option: "nice to meet you"
    distractors: [goodbye, "thank you", "good morning"]
    accepted_answers: [{value: "nice to meet you", status: correct}]
    feedback: "تشرفنا means nice to meet you."
  ar.a1.unit02.lesson01.exercise05.order_name_question:
    instruction: "Arrange the words to ask What is your name?"
    accepted_answers: [{value: [ما, اسمك], status: correct}]
    feedback: "ما اسمك؟ means what is your name?"
  ar.a1.unit02.lesson01.exercise06.build_self_intro:
    instruction: "Arrange the words to say My name is Sara."
    accepted_answers: [{value: [اسمي, سارة], status: correct}]
    feedback: "اسمي سارة means my name is Sara."
  ar.a1.unit02.lesson01.exercise07.reply_pleased:
    instruction: "Reply to تشرفنا with the same phrase."
    accepted_answers:
      - {value: تشرفنا, status: correct}
      - {value: "تشرفنا.", status: correct}
    feedback: "تشرفنا is naturally said back by both people."
  ar.a1.unit02.lesson01.exercise08.translate_my_name:
    instruction: "Translate into Arabic: My name is Karim."
    accepted_answers:
      - {value: "اسمي كريم", status: correct}
      - {value: "اسمي كريم.", status: correct}
    feedback: "اسمي كريم means my name is Karim."

  ar.a1.unit02.lesson02.exercise01.recognize_where_from:
    instruction: "What does this question mean?"
    correct_option: "Where are you from?"
    distractors: ["What is your name?", "How are you?", "Nice to meet you."]
    accepted_answers: [{value: "Where are you from?", status: correct}]
    feedback: "من أين أنت؟ means where are you from?"
  ar.a1.unit02.lesson02.exercise02.recognize_lebanon:
    instruction: "Select the meaning of لبنان."
    correct_option: Lebanon
    distractors: [Egypt, Jordan, Syria]
    accepted_answers: [{value: Lebanon, status: correct}]
    feedback: "لبنان means Lebanon."
  ar.a1.unit02.lesson02.exercise03.recognize_egypt:
    instruction: "Select the meaning of مصر."
    correct_option: Egypt
    distractors: [Lebanon, Iraq, Morocco]
    accepted_answers: [{value: Egypt, status: correct}]
    feedback: "مصر means Egypt."
  ar.a1.unit02.lesson02.exercise04.match_countries:
    instruction: "Match each Arabic country name with its English meaning."
    accepted_answers:
      - value: {لبنان: Lebanon, مصر: Egypt, الأردن: Jordan, المغرب: Morocco, سوريا: Syria, العراق: Iraq}
        status: correct
    feedback: "These are the six countries introduced in this lesson."
  ar.a1.unit02.lesson02.exercise05.order_where_from:
    instruction: "Arrange the words to ask Where are you from?"
    accepted_answers: [{value: [من, أين, أنت], status: correct}]
    feedback: "من أين أنت؟ means where are you from?"
  ar.a1.unit02.lesson02.exercise06.order_im_from_morocco:
    instruction: "Arrange the words to say I'm from Morocco."
    accepted_answers: [{value: [أنا, من, المغرب], status: correct}]
    feedback: "أنا من المغرب means I'm from Morocco."
  ar.a1.unit02.lesson02.exercise07.translate_from_syria:
    instruction: "Translate into Arabic: I'm from Syria."
    accepted_answers:
      - {value: "أنا من سوريا", status: correct}
      - {value: "أنا من سوريا.", status: correct}
    feedback: "أنا من سوريا means I'm from Syria."
  ar.a1.unit02.lesson02.exercise08.reply_where_from:
    instruction: "Answer with any country you learned in this lesson."
    accepted_answers:
      - {value: "أنا من لبنان", status: correct}
      - {value: "أنا من مصر", status: correct}
      - {value: "أنا من الأردن", status: correct}
      - {value: "أنا من المغرب", status: correct}
      - {value: "أنا من سوريا", status: correct}
      - {value: "أنا من العراق", status: correct}
    feedback: "Any of the six countries taught in this lesson is a natural answer."

  ar.a1.unit02.lesson03.exercise01.recognize_are_you_from:
    instruction: "What does this question mean?"
    correct_option: "Are you from Egypt?"
    distractors: ["I'm from Egypt.", "Where are you from?", "Nice to meet you."]
    accepted_answers: [{value: "Are you from Egypt?", status: correct}]
    feedback: "هل أنت من مصر؟ asks a yes/no question about origin."
  ar.a1.unit02.lesson03.exercise02.recognize_yes:
    instruction: "What does this word mean?"
    correct_option: "yes"
    distractors: ["no", welcome, goodbye]
    accepted_answers: [{value: "yes", status: correct}]
    feedback: "نعم means yes."
  ar.a1.unit02.lesson03.exercise03.recognize_no:
    instruction: "What does this word mean?"
    correct_option: "no"
    distractors: ["yes", "thank you", welcome]
    accepted_answers: [{value: "no", status: correct}]
    feedback: "لا means no."
  ar.a1.unit02.lesson03.exercise04.recognize_pleased_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I was pleased to meet you"
    distractors: ["nice to meet you", "where are you from", "welcome to you"]
    accepted_answers: [{value: "I was pleased to meet you", status: correct}]
    feedback: "سعدت بلقائك means I was pleased to meet you."
  ar.a1.unit02.lesson03.exercise05.order_welcome_to_you:
    instruction: "Arrange the words for welcome to you."
    accepted_answers: [{value: [مرحبا, بك], status: correct}]
    feedback: "مرحبا بك means welcome to you."
  ar.a1.unit02.lesson03.exercise06.answer_yes_no:
    instruction: "Answer هل أنت من لبنان؟ either way, naturally."
    accepted_answers:
      - {value: "نعم، أنا من لبنان", status: correct}
      - {value: "نعم أنا من لبنان", status: correct}
      - {value: "لا، أنا من مصر", status: correct}
      - {value: "لا أنا من مصر", status: correct}
      - {value: نعم, status: acceptable_with_note, note: "Correct but a fuller answer is more natural."}
      - {value: لا, status: acceptable_with_note, note: "Correct but a fuller answer is more natural."}
    feedback: "Either نعم or لا with a short follow-up is a natural answer."
  ar.a1.unit02.lesson03.exercise07.translate_pleased:
    instruction: "Translate into Arabic: I was pleased to meet you."
    accepted_answers:
      - {value: "سعدت بلقائك", status: correct}
      - {value: "سعدت بلقائك.", status: correct}
    feedback: "سعدت بلقائك means I was pleased to meet you."
  ar.a1.unit02.lesson03.exercise08.speak_welcome:
    instruction: "Repeat the phrase."
    accepted_answers: [{value: "مرحبا بك", status: correct}]
    feedback: "The expected words are مرحبا بك."

  ar.a1.unit02.lesson04.exercise01.listen_who_starts:
    instruction: "Listen and select who greets first."
    correct_option: Yusuf
    distractors: [Layla, "Both of them", "Neither of them"]
    accepted_answers: [{value: Yusuf, status: correct}]
    feedback: "Yusuf opens the exchange with مرحبا."
  ar.a1.unit02.lesson04.exercise02.select_layla_intro:
    instruction: "Choose Layla's self-introduction."
    correct_option: "اسمي ليلى"
    distractors: ["اسمي يوسف", "من أين أنت؟", "مع السلامة"]
    accepted_answers: [{value: "اسمي ليلى", status: correct}]
    feedback: "اسمي ليلى means my name is Layla."
  ar.a1.unit02.lesson04.exercise03.comprehend_origin:
    instruction: "Where is Layla from?"
    correct_option: Egypt
    distractors: [Lebanon, Jordan, Morocco]
    accepted_answers: [{value: Egypt, status: correct}]
    feedback: "Layla says أنا من مصر, I'm from Egypt."
  ar.a1.unit02.lesson04.exercise04.choose_farewell:
    instruction: "Select the two expressions used to close the dialogue."
    correct_option: "سعدت بلقائك / مع السلامة"
    distractors: ["مرحبا / تشرفنا", "ما اسمك / اسمي", "نعم / لا"]
    accepted_answers:
      - {value: "سعدت بلقائك / مع السلامة", status: correct}
      - {value: "مع السلامة / سعدت بلقائك", status: correct}
    feedback: "The speakers close with سعدت بلقائك and مع السلامة; selection order does not matter."
  ar.a1.unit02.lesson04.exercise05.order_yusuf_intro:
    instruction: "Arrange Yusuf's self-introduction."
    accepted_answers: [{value: [اسمي, يوسف], status: correct}]
    feedback: "اسمي يوسف means my name is Yusuf."
  ar.a1.unit02.lesson04.exercise06.role_response:
    instruction: "Choose Layla's natural reply."
    accepted_answers:
      - {value: تشرفنا, status: correct}
      - {value: "تشرفنا.", status: correct}
    feedback: "تشرفنا returns the pleased-to-meet-you sentiment."
  ar.a1.unit02.lesson04.exercise07.translate_pleased_meeting:
    instruction: "Translate into Arabic: Nice to meet you."
    accepted_answers:
      - {value: تشرفنا, status: correct}
      - {value: "تشرفنا.", status: correct}
    feedback: "تشرفنا means nice to meet you."
  ar.a1.unit02.lesson04.exercise08.speak_first_meeting:
    instruction: "Reply as Yusuf by greeting and introducing yourself."
    accepted_answers:
      - {value: "مرحبا، اسمي يوسف", status: correct}
      - {value: "مرحبا اسمي يوسف", status: correct}
      - {value: "مرحبا، اسمي يوسف. تشرفنا.", status: acceptable_with_note, note: "A natural expanded response."}
    feedback: "A suitable response begins with a greeting and Yusuf's self-introduction."
