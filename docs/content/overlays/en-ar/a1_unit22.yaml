review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar a1_unit22_emotions. Review 2026-10-19: 9 fixes - write_feeling_cause (first-person I am happy) accepted only masculine سعيد, now also accepts سعيدة; happy/sad notes said سعيد/حزين are used by a male speaker (now: describe a man, with the feminine for a woman, so both are correct for I am); tired note and recognize_tired feedback tied متعبة to Layla only (now give متعب/متعبة); how_feel note now gives the feminine كيف تشعرين؟; line04 note explains أنت read anti for Layla; 5 dialogue example_glosses dropped the Layla/Yusuf said: frame, including a stray quoted \"Yes,\" artifact; write_feelings_exchange instruction now names who asks and who answers; transliterations added. NATIVE FLAGS: none."}
course: {title: Arabic A1, description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."}
units:
  ar.a1.unit22.emotions: {title: "Emotions"}
lessons:
  ar.a1.unit22.lesson01.feeling_cause: {title: "I am happy"}
  ar.a1.unit22.lesson02.ask_feelings: {title: "How do you feel?"}
teaching:
  ar.a1.unit22.lesson01.teach.feeling: {title: "Feeling", gloss: "feeling", note: "شعور (shuʿūr) means a feeling.", example_gloss: "This is a feeling."}
  ar.a1.unit22.lesson01.teach.happy: {title: "Happy", gloss: "happy", note: "سعيد (saʿīd) describes a man; a woman says أنا سعيدة (anā saʿīda).", example_gloss: "I am happy."}
  ar.a1.unit22.lesson01.teach.sad: {title: "Sad", gloss: "sad", note: "حزين (ḥazīn) describes a man; a woman says أنا حزينة (anā ḥazīna).", example_gloss: "I am sad."}
  ar.a1.unit22.lesson01.teach.because: {title: "Because", gloss: "because", note: "لأن (li-anna) introduces a reason.", example_gloss: "I am happy because the weather is sunny."}
  ar.a1.unit22.lesson02.teach.how_feel: {title: "How do you feel?", gloss: "How do you feel?", note: "كيف تشعر؟ (kayfa tashʿur) asks a man how he feels; to a woman: كيف تشعرين؟ (kayfa tashʿurīn).", example_gloss: "How do you feel, Yusuf?"}
  ar.a1.unit22.lesson02.teach.tired: {title: "Tired", gloss: "tired", note: "متعب (mutʿab) describes a man; متعبة (mutʿaba) describes a woman, so Layla says أنا متعبة.", example_gloss: "I am tired."}
  ar.a1.unit22.lesson02.teach.okay: {title: "Okay", gloss: "okay", note: "بخير (bi-khayr) means okay, literally in good (health).", example_gloss: "Are you okay?"}
  ar.a1.unit22.lesson02.teach.line01: {title: "Ask feeling", gloss: "Layla asks how Yusuf feels.", note: "يا (yā) comes before the name of the person addressed.", example_gloss: "Layla said: How do you feel, Yusuf?"}
  ar.a1.unit22.lesson02.teach.line02: {title: "Feeling and cause", gloss: "Yusuf says he is happy because the weather is sunny.", note: "This line gives both the feeling and the cause.", example_gloss: "Yusuf said: I am happy because the weather is sunny."}
  ar.a1.unit22.lesson02.teach.line03: {title: "Another feeling", gloss: "Layla says she is tired because she has work.", note: "متعبة agrees with Layla.", example_gloss: "Layla said: I am tired because I have work."}
  ar.a1.unit22.lesson02.teach.line04: {title: "Check okay", gloss: "Yusuf asks if Layla is okay.", note: "هل (hal) starts a yes-or-no question. Yusuf is asking Layla, so أنت is read anti (to a man: anta).", example_gloss: "Yusuf said: Are you okay?"}
  ar.a1.unit22.lesson02.teach.line05: {title: "Say yes", gloss: "Layla says yes and thanks him.", note: "نعم is the yes answer.", example_gloss: "Layla said: Yes, thank you."}
exercises:
  ar.a1.unit22.lesson01.exercise01.recognize_happy:
    instruction: "Select the meaning."
    correct_option: happy
    distractors: [sad, tired, cold]
    accepted_answers: [{value: happy, status: correct}]
    feedback: "سعيد means happy."
  ar.a1.unit22.lesson01.exercise02.listen_happy_cause:
    instruction: "Listen and select what you hear."
    correct_option: "I am happy because the weather is sunny."
    distractors: ["I am sad because I have work.", "I am tired because I have a lesson.", "Are you okay?"]
    accepted_answers: [{value: "I am happy because the weather is sunny.", status: correct}]
    feedback: "You heard أنا سعيد لأن الجو مشمس."
  ar.a1.unit22.lesson01.exercise03.match_feelings:
    instruction: "Match each Arabic feeling word with its meaning."
    accepted_answers:
      - value: {شعور: feeling, سعيد: happy, حزين: sad, لأن: because, أنا: I, الجو: weather}
        status: correct
    feedback: "These words state a feeling and give a cause."
  ar.a1.unit22.lesson01.exercise04.order_happy_cause:
    instruction: "Arrange the Arabic words for I am happy because the weather is sunny."
    accepted_answers: [{value: [أنا, سعيد, لأن, الجو, مشمس], status: correct}]
    feedback: "أنا سعيد لأن الجو مشمس gives a feeling and a cause."
  ar.a1.unit22.lesson01.exercise05.write_feeling_cause:
    instruction: "Type exactly this Arabic feeling-and-cause sentence: I am happy because the weather is sunny."
    accepted_answers:
      - {value: "أنا سعيد لأن الجو مشمس", status: correct}
      - {value: "أنا سعيد لأن الجو مشمس.", status: correct}
      - {value: "أنا سعيدة لأن الجو مشمس", status: correct}
    feedback: "أنا سعيد لأن الجو مشمس is the requested feeling-and-cause sentence; a woman writes أنا سعيدة لأن الجو مشمس."
  ar.a1.unit22.lesson01.exercise06.dictation_happy_cause: {correct_response: "أنا سعيد لأن الجو مشمس.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit22.lesson02.exercise01.recognize_tired:
    instruction: "Select the meaning."
    correct_option: tired
    distractors: [happy, sad, blue]
    accepted_answers: [{value: tired, status: correct}]
    feedback: "متعبة means tired (said of a woman; for a man: متعب)."
  ar.a1.unit22.lesson02.exercise02.dialogue_feelings:
    instruction: "Why is Yusuf happy?"
    correct_option: "The weather is sunny."
    distractors: ["He has work.", "He has a lesson.", "He is at the market."]
    accepted_answers: [{value: "The weather is sunny.", status: correct}]
    feedback: "Yusuf says أنا سعيد لأن الجو مشمس."
  ar.a1.unit22.lesson02.exercise03.match_feeling_lines:
    instruction: "Match each Arabic feeling line with its meaning."
    accepted_answers:
      - value: {"كيف تشعر؟": "How do you feel?", "أنا سعيد": "I am happy", "أنا متعبة": "I am tired", "بخير": okay, لأن: because, الجو: weather}
        status: correct
    feedback: "These lines ask about and state feelings."
  ar.a1.unit22.lesson02.exercise04.order_feeling_question:
    instruction: "Arrange the Arabic words for How do you feel, Yusuf?"
    accepted_answers: [{value: [كيف, تشعر, يا, يوسف], status: correct}]
    feedback: "كيف تشعر يا يوسف؟ asks Yusuf how he feels."
  ar.a1.unit22.lesson02.exercise05.write_feelings_exchange:
    instruction: "Type exactly this Arabic feelings exchange. Layla asks: How do you feel, Yusuf? Yusuf answers: I am happy because the weather is sunny."
    accepted_answers:
      - {value: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس.", status: correct}
      - {value: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس", status: correct}
    feedback: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس. asks about a feeling and answers with a cause."
