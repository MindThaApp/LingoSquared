  ar.a1.unit22.lesson01.feeling_cause: {title: "I am happy"}
  ar.a1.unit22.lesson02.ask_feelings: {title: "How do you feel?"}
teaching:
  ar.a1.unit22.lesson01.teach.feeling: {title: "Feeling", gloss: "feeling", note: "شعور names a feeling.", example_gloss: "This is a feeling."}
  ar.a1.unit22.lesson01.teach.happy: {title: "Happy", gloss: "happy", note: "سعيد is used by a male speaker; سعيدة is the female form.", example_gloss: "I am happy."}
  ar.a1.unit22.lesson01.teach.sad: {title: "Sad", gloss: "sad", note: "حزين is used by a male speaker; حزينة is the female form.", example_gloss: "I am sad."}
  ar.a1.unit22.lesson01.teach.because: {title: "Because", gloss: "because", note: "لأن introduces a simple reason.", example_gloss: "I am happy because the weather is sunny."}
  ar.a1.unit22.lesson02.teach.how_feel: {title: "How do you feel?", gloss: "How do you feel?", note: "كيف تشعر asks Yusuf about his feeling.", example_gloss: "How do you feel, Yusuf?"}
  ar.a1.unit22.lesson02.teach.tired: {title: "Tired", gloss: "tired", note: "متعبة is the form Layla uses for herself.", example_gloss: "I am tired."}
  ar.a1.unit22.lesson02.teach.okay: {title: "Okay", gloss: "okay", note: "بخير answers that someone is okay.", example_gloss: "Are you okay?"}
  ar.a1.unit22.lesson02.teach.line01: {title: "Ask feeling", gloss: "Layla asks how Yusuf feels.", note: "The question names Yusuf directly.", example_gloss: "How do you feel, Yusuf?"}
  ar.a1.unit22.lesson02.teach.line02: {title: "Feeling and cause", gloss: "Yusuf says he is happy because the weather is sunny.", note: "This line gives both the feeling and the cause.", example_gloss: "I am happy because the weather is sunny."}
  ar.a1.unit22.lesson02.teach.line03: {title: "Another feeling", gloss: "Layla says she is tired because she has work.", note: "متعبة agrees with Layla.", example_gloss: "I am tired because I have work."}
  ar.a1.unit22.lesson02.teach.line04: {title: "Check okay", gloss: "Yusuf asks if Layla is okay.", note: "هل starts the yes-or-no question.", example_gloss: "Are you okay?"}
  ar.a1.unit22.lesson02.teach.line05: {title: "Say yes", gloss: "Layla says yes and thanks him.", note: "نعم is the yes answer.", example_gloss: "\"Yes,\" thank you."}
exercises:
  ar.a1.unit22.lesson01.exercise01.recognize_happy:
    instruction: "Select the meaning."
    correct_option: happy
    distractors: [sad, tired, cold]
    accepted_answers: [{value: happy, status: correct}]
    feedback: "سعيد means happy."
  ar.a1.unit22.lesson01.exercise02.listen_happy_cause:
    instruction: "Listen and select what you hear."
    correct_option: "I am happy because the weather is sunny."
    distractors: ["I am sad because I have work.", "I am tired because I have a lesson.", "Are you okay?"]
    accepted_answers: [{value: "I am happy because the weather is sunny.", status: correct}]
    feedback: "You heard أنا سعيد لأن الجو مشمس."
  ar.a1.unit22.lesson01.exercise03.match_feelings:
    instruction: "Match each Arabic feeling word with its meaning."
    accepted_answers:
      - value: {شعور: feeling, سعيد: happy, حزين: sad, لأن: because, أنا: I, الجو: weather}
        status: correct
    feedback: "These words state a feeling and give a cause."
  ar.a1.unit22.lesson01.exercise04.order_happy_cause:
    instruction: "Arrange the Arabic words for I am happy because the weather is sunny."
    accepted_answers: [{value: [أنا, سعيد, لأن, الجو, مشمس], status: correct}]
    feedback: "أنا سعيد لأن الجو مشمس gives a feeling and a cause."
  ar.a1.unit22.lesson01.exercise05.write_feeling_cause:
    instruction: "Type exactly this Arabic feeling-and-cause sentence: I am happy because the weather is sunny."
    accepted_answers:
      - {value: "أنا سعيد لأن الجو مشمس", status: correct}
      - {value: "أنا سعيد لأن الجو مشمس.", status: correct}
    feedback: "أنا سعيد لأن الجو مشمس is the requested feeling-and-cause sentence."
  ar.a1.unit22.lesson02.exercise01.recognize_tired:
    instruction: "Select the meaning."
    correct_option: tired
    distractors: [happy, sad, blue]
    accepted_answers: [{value: tired, status: correct}]
    feedback: "متعبة means tired when Layla speaks about herself."
  ar.a1.unit22.lesson02.exercise02.dialogue_feelings:
    instruction: "Why is Yusuf happy?"
    correct_option: "The weather is sunny."
    distractors: ["He has work.", "He has a lesson.", "He is at the market."]
    accepted_answers: [{value: "The weather is sunny.", status: correct}]
    feedback: "Yusuf says أنا سعيد لأن الجو مشمس."
  ar.a1.unit22.lesson02.exercise03.match_feeling_lines:
    instruction: "Match each Arabic feeling line with its meaning."
    accepted_answers:
      - value: {"كيف تشعر؟": "How do you feel?", "أنا سعيد": "I am happy", "أنا متعبة": "I am tired", "بخير": okay, لأن: because, الجو: weather}
        status: correct
    feedback: "These lines ask about and state feelings."
  ar.a1.unit22.lesson02.exercise04.order_feeling_question:
    instruction: "Arrange the Arabic words for How do you feel, Yusuf?"
    accepted_answers: [{value: [كيف, تشعر, يا, يوسف], status: correct}]
    feedback: "كيف تشعر يا يوسف؟ asks Yusuf how he feels."
  ar.a1.unit22.lesson02.exercise05.write_feelings_exchange:
    instruction: "Type exactly this Arabic feelings exchange: How do you feel, Yusuf? I am happy because the weather is sunny."
    accepted_answers:
      - {value: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس.", status: correct}
      - {value: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس", status: correct}
    feedback: "كيف تشعر يا يوسف؟ أنا سعيد لأن الجو مشمس. asks about a feeling and answers with a cause."
