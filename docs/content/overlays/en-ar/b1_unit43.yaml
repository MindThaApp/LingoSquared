  ar.b1.unit43.lesson01.qalat_inaha: {title: "She said that... (reported statement)"}
  ar.b1.unit43.lesson02.saalat_idha: {title: "She asked whether... (reported question)"}
  ar.b1.unit43.lesson03.hiwar_kalam_manqul: {title: "Dialogue: about the interview"}
teaching:
  ar.b1.unit43.lesson01.teach.noor_name: {title: "Nour", gloss: "Nour", note: "*نور* is a person's name.", example_gloss: "Nour said that she worked in this field."}
  ar.b1.unit43.lesson01.teach.amiltu: {title: "I worked", gloss: "I worked", note: "*عملت* means I worked.", example_gloss: "I worked in this field for two years."}
  ar.b1.unit43.lesson01.teach.hadha_almajal: {title: "This field", gloss: "this field", note: "*هذا المجال* means this field (of work).", example_gloss: "I worked in this field for two years."}
  ar.b1.unit43.lesson01.teach.qalat_inaha: {title: "She said that she", gloss: "she said that she", note: "*قالت إنها* reports a statement, shifting the original speaker's \"I\" to \"she.\"", example_gloss: "Nour said that she worked in this field for two years."}
  ar.b1.unit43.lesson01.teach.limudat_sanatayn: {title: "For two years", gloss: "for two years", note: "*لمدة سنتين* means for a period of two years.", example_gloss: "I worked in this field for two years."}
  ar.b1.unit43.lesson01.teach.yusuf_reports_noor: {title: "Yusuf reports what Nour said", gloss: "Nour said that she worked in this field for two years.", note: "*قالت إن* embeds the reported content after the reporting verb, without quoting Nour directly.", example_gloss: "Yusuf said: Nour said that she worked in this field for two years."}
  ar.b1.unit43.lesson02.teach.utla: {title: "Holiday / off day", gloss: "holiday / off day", note: "*عطلة* means holiday or day off.", example_gloss: "The weekend holiday."}
  ar.b1.unit43.lesson02.teach.almudira: {title: "The manager", gloss: "the manager", note: "*المديرة* means the (female) manager.", example_gloss: "The manager asked Nour."}
  ar.b1.unit43.lesson02.teach.saalat_idha: {title: "She asked whether", gloss: "she asked whether", note: "*سألت إذا* reports a yes/no question, shifting the original \"you\" to \"she.\"", example_gloss: "The manager asked Nour whether she was available."}
  ar.b1.unit43.lesson02.teach.kanat_mutaha: {title: "She was available", gloss: "she was available", note: "*كانت متاحة* means she was available.", example_gloss: "The manager asked Nour whether she was available on the weekend."}
  ar.b1.unit43.lesson02.teach.yusuf_reports_almudira: {title: "Yusuf reports what the manager asked", gloss: "The manager asked Nour whether she was available on the weekend.", note: "*سألت إذا* embeds the reported question after the reporting verb, without quoting the manager directly.", example_gloss: "Yusuf said: The manager asked Nour whether she was available on the weekend."}
  ar.b1.unit43.lesson03.teach.layla_ask_noor: {title: "Laila asks about Nour", gloss: "Laila says: What did Nour say about the interview?", note: "This opens the dialogue.", example_gloss: "What did Nour say about the interview?"}
  ar.b1.unit43.lesson03.teach.layla_ask_almudira: {title: "Laila asks what the manager asked", gloss: "Laila says: And what did the manager ask her?", note: "This continues the dialogue, asking about the reported question.", example_gloss: "And what did the manager ask her?"}
exercises:
  ar.b1.unit43.lesson01.exercise01.recognize_qalat_inaha:
    instruction: "Select the meaning."
    correct_option: "Nour said that she worked in this field"
    distractors: ["Nour said she will work in this field", "Nour asked if she worked in this field", "Nour worked in this field"]
    accepted_answers: [{value: "Nour said that she worked in this field", status: correct}]
    feedback: "*نور قالت إنها عملت في هذا المجال* reports Nour's statement with a person shift."
  ar.b1.unit43.lesson01.exercise02.recognize_limudat_sanatayn:
    instruction: "Select the meaning."
    correct_option: "For two years"
    distractors: ["For two months", "In two years", "Two years ago"]
    accepted_answers: [{value: "For two years", status: correct}]
    feedback: "*لمدة سنتين* means for a period of two years."
  ar.b1.unit43.lesson01.exercise03.listen_select_reported_statement:
    instruction: "Listen and select what Yusuf says."
    correct_option: "Nour said that she worked in this field for two years."
    distractors: ["Nour said that she will work in this field for two years.", "Nour asked if she could work in this field.", "Nour worked in this field for one year."]
    accepted_answers: [{value: "Nour said that she worked in this field for two years.", status: correct}]
    feedback: "You heard *نور قالت إنها عملت في هذا المجال لمدة سنتين*."
  ar.b1.unit43.lesson01.exercise04.match_reported_statement:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"قالت إنها": "she said that she", "هذا المجال": "this field", "لمدة سنتين": "for two years", "نور قالت إنها عملت في هذا المجال.": "Nour said that she worked in this field.", عملت: "(I/she) worked", سنتين: "two years"}
        status: correct
    feedback: "These phrases cover the reported statement and person shift."
  ar.b1.unit43.lesson01.exercise05.order_reported_statement:
    instruction: "Arrange the Arabic words for Nour said that she worked in this field for two years."
    accepted_answers: [{value: [نور, قالت, إنها, عملت, في, هذا, المجال, لمدة, سنتين], status: correct}]
    feedback: "*نور قالت إنها عملت في هذا المجال لمدة سنتين* reports Nour's own statement with a person shift."
  ar.b1.unit43.lesson01.exercise06.write_reported_statement:
    instruction: "Write exactly this reported-speech sentence with قالت إن + a person shift from I to she: Nour said that she worked in this field for two years."
    accepted_answers:
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين", status: correct}
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين.", status: correct}
    feedback: "*نور قالت إنها عملت في هذا المجال لمدة سنتين.* is the requested sentence."
  ar.b1.unit43.lesson02.exercise01.recognize_almudira_saalat:
    instruction: "Select the meaning."
    correct_option: "The manager asked Nour"
    distractors: ["Nour asked the manager", "The manager told Nour", "The manager will ask Nour"]
    accepted_answers: [{value: "The manager asked Nour", status: correct}]
    feedback: "*المديرة سألت نور* is the reporting clause."
  ar.b1.unit43.lesson02.exercise02.recognize_idha_kanat_mutaha:
    instruction: "Select the meaning."
    correct_option: "Whether she was available"
    distractors: ["Whether she will be available", "That she was available", "If she is available now"]
    accepted_answers: [{value: "Whether she was available", status: correct}]
    feedback: "*إذا كانت متاحة* embeds the reported yes/no question."
  ar.b1.unit43.lesson02.exercise03.listen_select_reported_question:
    instruction: "Listen and select what Yusuf says."
    correct_option: "The manager asked Nour whether she was available on the weekend."
    distractors: ["The manager told Nour she was available on the weekend.", "Nour asked the manager if she was available.", "The manager asked Nour whether she works weekends every week."]
    accepted_answers: [{value: "The manager asked Nour whether she was available on the weekend.", status: correct}]
    feedback: "You heard *المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع*."
  ar.b1.unit43.lesson02.exercise04.match_reported_question:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"سألت إذا": "she asked whether", "كانت متاحة": "she was available", المديرة: "the manager", "المديرة سألت نور.": "The manager asked Nour.", "نهاية الأسبوع": "the weekend", "عطلة نهاية الأسبوع": "the weekend holiday"}
        status: correct
    feedback: "These phrases cover the reported question and person shift."
  ar.b1.unit43.lesson02.exercise05.order_reported_question:
    instruction: "Arrange the Arabic words for The manager asked Nour whether she was available."
    accepted_answers: [{value: [المديرة, سألت, نور, إذا, كانت, متاحة], status: correct}]
    feedback: "*المديرة سألت نور إذا كانت متاحة* reports the manager's question with a person shift."
  ar.b1.unit43.lesson02.exercise06.write_reported_question:
    instruction: "Write exactly this reported-speech sentence with سألت إذا + a person shift from you to she: The manager asked Nour whether she was available on the weekend."
    accepted_answers:
      - {value: "المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع", status: correct}
      - {value: "المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع.", status: correct}
    feedback: "*المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع.* is the requested sentence."
  ar.b1.unit43.lesson03.exercise01.choose_reported_statement_vs_question:
    instruction: "Which answer reports what NOUR SAID about her own experience?"
    correct_option: "نور قالت إنها عملت في هذا المجال لمدة سنتين"
    distractors: ["المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع", "نور سألت إذا كانت متاحة", "المديرة قالت إنها عملت في هذا المجال"]
    accepted_answers: [{value: "نور قالت إنها عملت في هذا المجال لمدة سنتين", status: correct}]
    feedback: "*نور قالت إنها عملت في هذا المجال لمدة سنتين* reports Nour's own statement."
  ar.b1.unit43.lesson03.exercise02.dialogue_comprehension_kalam_manqul:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf reports that Nour said she has two years of experience in the field, and that the manager asked her whether she was available on the weekend."
    distractors: ["Yusuf reports that Nour asked the manager for a raise.", "Yusuf reports that the manager offered Nour the job.", "Yusuf reports that Nour has no experience in the field."]
    accepted_answers: [{value: "Yusuf reports that Nour said she has two years of experience in the field, and that the manager asked her whether she was available on the weekend.", status: correct}]
    feedback: "Yusuf reports Nour's statement with قالت إن and the manager's question with سألت إذا, without quoting either directly."
  ar.b1.unit43.lesson03.exercise03.match_dialogue_kalam_manqul:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"ماذا قالت نور عن المقابلة؟": "What did Nour say about the interview?", "نور قالت إنها عملت في هذا المجال لمدة سنتين.": "Nour said that she worked in this field for two years.", "وماذا سألتها المديرة؟": "And what did the manager ask her?", "المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع.": "The manager asked Nour whether she was available on the weekend.", المقابلة: "the interview", سألتها: "asked her"}
        status: correct
    feedback: "These lines cover the reported statement and the reported question."
  ar.b1.unit43.lesson03.exercise04.order_ask_about_interview:
    instruction: "Arrange the Arabic words for What did Nour say about the interview?"
    accepted_answers: [{value: [ماذا, قالت, نور, عن, المقابلة], status: correct}]
    feedback: "*ماذا قالت نور عن المقابلة؟* asks about the reported statement."
  ar.b1.unit43.lesson03.exercise05.reply_report_noor_statement:
    instruction: "Laila asks: What did Nour say about the interview? Reply as Yusuf, reporting Nour's statement without quoting her directly."
    accepted_answers:
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين", status: correct}
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين.", status: correct}
    feedback: "*نور قالت إنها عملت في هذا المجال لمدة سنتين.* is Yusuf's reply."
  ar.b1.unit43.lesson03.exercise06.write_full_reported_statement_and_question:
    instruction: "As Yusuf, write two sentences reporting the interview to Laila, without quoting either speaker directly: report what Nour said about her experience (using قالت إن + a person shift from I to she), then report what the manager asked Nour (using سألت إذا + a person shift from you to she)."
    accepted_answers:
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع", status: correct}
      - {value: "نور قالت إنها عملت في هذا المجال لمدة سنتين. المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع.", status: correct}
    feedback: "*نور قالت إنها عملت في هذا المجال لمدة سنتين. المديرة سألت نور إذا كانت متاحة في عطلة نهاية الأسبوع.* reports both the statement and the question with the correct person shift, as required."
