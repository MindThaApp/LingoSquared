  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: The verb changes with the person
    gloss: 'The verb changes with the person: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'The first letter of the verb shows who does it: أ (a-) is I, ي (ya-) is he and ت (ta-) is you or she.'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Yusuf reacts
    gloss: 'Yusuf: How nice, I often play football there.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla and Sara on sport
    gloss: Layla does yoga twice a week. She loves moving calmly. Sara doesn't do yoga, but she loves swimming. Sara swims often, almost every week. What sport do you do?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) and سارة تسبح (sāra tasbaḥ) use verbs that begin with ت (ta-) because both are women. لا before a verb makes it negative.
    glosses:
      تمارس: does
      مرتين: twice (two times)
      الأسبوع: week
      اليوغا: yoga
      تحب: loves
      بهدوء: calmly
      تتحرك: move
      السباحة: swimming
      تسبح: swims
      كثيرا: often
      تقريبا: almost
      ما: which
      الرياضة: sport
