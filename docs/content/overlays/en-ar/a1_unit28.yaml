    title: To love swimming
    gloss: to love swimming
    example_gloss: Sara loves swimming.
  ar.a1.unit28.lesson03.teach.sara_thb_alsbaha:
    title: Sara loves swimming
    gloss: Sara loves swimming.
    note: 'تحب (tuḥibb) means she loves: the opening letter ت (ta-) marks she. السباحة (as-sibāḥa) starts with a sun letter, so we write as-sibāḥa.'
