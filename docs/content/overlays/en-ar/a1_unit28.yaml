    title: Suggesting something together
    gloss: 'To suggest something together, use هل (hal) + a we-verb: هل نتمشى؟ (hal natamashshā?) and هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Reuses the exact plan-proposing construction from the plans unit.
