    title: What sport do you do?
    gloss: What sport do you do?
  ar.a1.unit28.lesson01.teach.alab_kra_alqdm:
    title: I play football
    gloss: I play football.
    note: 'ألعب (alʿab) is the verb for ball games: ألعب كرة القدم (alʿab kurat al-qadam). Literally, كرة القدم is the ball of the foot.'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Verbs for sport: أمارس and ألعب'
    gloss: 'Say أمارس (umāris, I practise) before most sports: أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). For ball games say ألعب (alʿab, I play): ألعب كرة القدم.'
    note: أمارس (umāris) covers most sports, but ball games take ألعب (alʿab), so learn the verb together with the sport.
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Times a week
    gloss: times a week
    example_gloss: I do yoga twice a week.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Times a week
    gloss: كثيرا (kathīran) and كل يوم (kull yawm) are general; مرتين في الأسبوع (marratayn fī al-usbūʿ) says exactly how often. مرتين is the dual of مرة (marra, time).
    note: Extends the frequency vocabulary already established in the hobbies unit.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
    title: I do yoga twice a week
    gloss: I do yoga twice a week.
  ar.a1.unit28.lesson02.teach.ywsf_ylab_kra:
    title: Yusuf often plays football
    gloss: Yusuf often plays football.
    note: 'يلعب (yalʿab) means he plays: the opening letter ي (ya-) marks he. كثيرا (kathīran) means often.'
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Two ways to talk about sport
    gloss: أمارس الرياضة (umāris ar-riyāḍa) talks about sport in general, while أمارس اليوغا (umāris al-yūghā) names the specific sport. Both are correct.
    note: رياضة (riyāḍa) is a feminine noun, and اليوغا (al-yūghā) is a sport name with ال attached.
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
    title: To exercise
    gloss: to exercise / do sport
    example_gloss: I exercise every day.
