  ar.b1.unit37.lesson01.teach.naam_refresher: {title: "Yes, I have a job interview tomorrow", gloss: "Yes, I have a job interview tomorrow.", note: "*نعم* means yes -- a refresher from earlier units.", example_gloss: "Nour said: Yes, I have a job interview tomorrow."}
  ar.b1.unit37.lesson01.teach.muqabala: {title: "The interview", gloss: "the interview", note: "*المقابلة* means the interview.", example_gloss: "If I succeed in the interview, I will travel to Dubai."}
  ar.b1.unit37.lesson01.teach.idha_najahtu: {title: "If I succeed in the interview, I will travel to Dubai", gloss: "If I succeed in the interview, I will travel to Dubai.", note: "*إذا* + a condition, with a future-marked result using س, expresses a real/possible future condition.", example_gloss: "Nour said: If I succeed in the interview, I will travel to Dubai."}
  ar.b1.unit37.lesson01.teach.madha_satafaleen: {title: "What will you do if you succeed in the interview?", gloss: "What will you do if you succeed in the interview?", note: "*ماذا ستفعلين إذا* asks about the real/possible condition.", example_gloss: "Yusuf said: What will you do if you succeed in the interview?"}
  ar.b1.unit37.lesson02.teach.law_kuntu_ghaniya: {title: "If I were rich, I would travel around the world", gloss: "If I were rich, I would travel around the world.", note: "*لو* + a past-tense verb, with a لـ-marked past-tense result, expresses an unreal/counterfactual present condition.", example_gloss: "Nour said: If I were rich, I would travel around the world."}
  ar.b1.unit37.lesson02.teach.imtihan_refresher: {title: "The exam", gloss: "the exam", note: "*الامتحان* means the exam.", example_gloss: "If I had studied more, I would have succeeded in the exam."}
  ar.b1.unit37.lesson02.teach.law_dhakartu: {title: "If I had studied more, I would have succeeded in the exam", gloss: "If I had studied more, I would have succeeded in the exam.", note: "This is the same لو construction applied to an unreal/counterfactual past condition.", example_gloss: "Nour said: If I had studied more, I would have succeeded in the exam."}
  ar.b1.unit37.lesson03.teach.yusuf_ask: {title: "Yusuf asks about the interview", gloss: "Yusuf asks: Do you have a job interview tomorrow?", note: "This opens the dialogue.", example_gloss: "Do you have a job interview tomorrow?"}
  ar.b1.unit37.lesson03.teach.nour_real: {title: "Nour states the real condition", gloss: "Nour says: Yes. If I succeed in the interview, I will travel to Dubai for work.", note: "This is the real/possible future condition.", example_gloss: "Yes. If I succeed in the interview, I will travel to Dubai for work."}
  ar.b1.unit37.lesson03.teach.yusuf_ask_unreal: {title: "Yusuf asks about the alternative", gloss: "Yusuf asks: And what if you don't succeed?", note: "This prompts the unreal/counterfactual contrast.", example_gloss: "And what if you don't succeed?"}
  ar.b1.unit37.lesson03.teach.nour_unreal: {title: "Nour states the unreal condition", gloss: "Nour says: If I didn't succeed, I would look for another job here.", note: "This is the unreal/counterfactual condition, contrasting with the real one.", example_gloss: "If I didn't succeed, I would look for another job here."}
exercises:
  ar.b1.unit37.lesson01.exercise01.recognize_idha_najahtu:
    instruction: "Select the meaning."
    correct_option: "If I succeed in the interview"
    distractors: ["Because I succeeded in the interview", "When I succeeded in the interview", "Even though I succeeded in the interview"]
    accepted_answers: [{value: "If I succeed in the interview", status: correct}]
    feedback: "*إذا نجحت في المقابلة* introduces a real/possible future condition."
  ar.b1.unit37.lesson01.exercise02.recognize_sasafiru:
    instruction: "Select the meaning."
    correct_option: "I will travel to Dubai"
    distractors: ["I traveled to Dubai", "I want to travel to Dubai", "I would travel to Dubai"]
    accepted_answers: [{value: "I will travel to Dubai", status: correct}]
    feedback: "*سأسافر إلى دبي* is the future-marked result of a real condition."
  ar.b1.unit37.lesson01.exercise03.listen_select_real_condition:
    instruction: "Listen and select what the speaker will do."
    correct_option: "If she succeeds in the interview, she will travel to Dubai."
    distractors: ["She already traveled to Dubai.", "She will travel to Dubai no matter what.", "If she were rich, she would travel to Dubai."]
    accepted_answers: [{value: "If she succeeds in the interview, she will travel to Dubai.", status: correct}]
    feedback: "You heard *إذا نجحت في المقابلة، سأسافر إلى دبي*."
  ar.b1.unit37.lesson01.exercise04.match_real_condition:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"إذا نجحت في المقابلة": "If I succeed in the interview", "سأسافر إلى دبي": "I will travel to Dubai", المقابلة: "the interview", "ماذا ستفعلين إذا نجحت؟": "What will you do if you succeed?", نجحت: "(I) succeeded / succeed", "إلى دبي": "to Dubai"}
        status: correct
    feedback: "These phrases cover the real/possible conditional construction."
  ar.b1.unit37.lesson01.exercise05.order_real_condition:
    instruction: "Arrange the Arabic words for If I succeed in the interview, I will travel to Dubai."
    accepted_answers: [{value: [إذا, نجحت, في, المقابلة, سأسافر, إلى, دبي], status: correct}]
    feedback: "*إذا نجحت في المقابلة سأسافر إلى دبي* is a real/possible future condition with a matching future result."
  ar.b1.unit37.lesson01.exercise06.write_real_condition:
    instruction: "Write exactly this real/possible conditional sentence with إذا + a future-marked result with س: If I succeed in the interview, I will travel to Dubai."
    accepted_answers:
      - {value: "إذا نجحت في المقابلة سأسافر إلى دبي", status: correct}
      - {value: "إذا نجحت في المقابلة، سأسافر إلى دبي.", status: correct}
    feedback: "*إذا نجحت في المقابلة، سأسافر إلى دبي.* is the requested real/possible conditional sentence."
  ar.b1.unit37.lesson02.exercise01.recognize_law_kuntu:
    instruction: "Select the meaning."
    correct_option: "If I were rich (unreal/counterfactual)"
    distractors: ["If I am rich (real condition)", "Because I am rich", "When I become rich"]
    accepted_answers: [{value: "If I were rich (unreal/counterfactual)", status: correct}]
    feedback: "*لو كنت غنية* introduces an unreal/counterfactual present condition."
  ar.b1.unit37.lesson02.exercise02.recognize_lakuntu_najahtu:
    instruction: "Select the meaning."
    correct_option: "I would have succeeded in the exam"
    distractors: ["I succeeded in the exam", "I will succeed in the exam", "I want to succeed in the exam"]
    accepted_answers: [{value: "I would have succeeded in the exam", status: correct}]
    feedback: "*لكنت نجحت في الامتحان* is the لـ-marked past-tense result of an unreal past condition."
  ar.b1.unit37.lesson02.exercise03.listen_select_unreal_condition:
    instruction: "Listen and select what the speaker says."
    correct_option: "If she were rich she would travel the world; if she had studied more she would have succeeded."
    distractors: ["She is rich and travels the world.", "She will succeed in the interview tomorrow.", "She studied enough and succeeded."]
    accepted_answers: [{value: "If she were rich she would travel the world; if she had studied more she would have succeeded.", status: correct}]
    feedback: "You heard *لو كنت غنية، لسافرت حول العالم. لو ذاكرت أكثر، لكنت نجحت في الامتحان.*"
  ar.b1.unit37.lesson02.exercise04.match_unreal_condition:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"لو كنت غنية": "If I were rich", "لسافرت حول العالم": "I would travel around the world", "لو ذاكرت أكثر": "If I had studied more", "لكنت نجحت في الامتحان": "I would have succeeded in the exam", "حول العالم": "around the world", أكثر: more}
        status: correct
    feedback: "These phrases cover the unreal/counterfactual conditional construction for present and past."
  ar.b1.unit37.lesson02.exercise05.order_unreal_condition:
    instruction: "Arrange the Arabic words for If I had studied more, I would have succeeded in the interview."
    accepted_answers: [{value: [لو, ذاكرت, أكثر, لكنت, نجحت, في, الامتحان], status: correct}]
    feedback: "*لو ذاكرت أكثر لكنت نجحت في الامتحان* is an unreal/counterfactual past condition with a matching past result."
  ar.b1.unit37.lesson02.exercise06.write_unreal_condition:
    instruction: "Write exactly this unreal/counterfactual past-conditional sentence with لو + a past-tense verb + لـ + a past-tense result: If I had studied more, I would have succeeded in the exam."
    accepted_answers:
      - {value: "لو ذاكرت أكثر لكنت نجحت في الامتحان", status: correct}
      - {value: "لو ذاكرت أكثر، لكنت نجحت في الامتحان.", status: correct}
    feedback: "*لو ذاكرت أكثر، لكنت نجحت في الامتحان.* is the requested unreal/counterfactual conditional sentence."
  ar.b1.unit37.lesson03.exercise01.choose_real_vs_unreal:
    instruction: "Which answer states the real/possible condition about tomorrow's interview?"
    correct_option: "إذا نجحت في المقابلة سأسافر إلى دبي للعمل"
    distractors: ["لو نجحت في المقابلة لسافرت إلى دبي", "لو كنت غنية لسافرت إلى دبي", "سافرت إلى دبي أمس"]
    accepted_answers: [{value: "إذا نجحت في المقابلة سأسافر إلى دبي للعمل", status: correct}]
    feedback: "*إذا نجحت في المقابلة، سأسافر إلى دبي للعمل.* is the real/possible future condition, using إذا + a future-marked result."
  ar.b1.unit37.lesson03.exercise02.dialogue_comprehension_conditions:
    instruction: "Listen to the dialogue and answer."
    correct_option: "If she succeeds she'll travel to Dubai for work; if not, she'll look for another job here."
    distractors: ["She has no job interview tomorrow.", "She will travel to Dubai no matter what happens.", "She already knows she failed the interview."]
    accepted_answers: [{value: "If she succeeds she'll travel to Dubai for work; if not, she'll look for another job here.", status: correct}]
    feedback: "Nour contrasts the real/possible outcome with the unreal/counterfactual alternative."
  ar.b1.unit37.lesson03.exercise03.match_dialogue_conditions:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"هل عندك مقابلة عمل غدا؟": "Do you have a job interview tomorrow?", "إذا نجحت في المقابلة، سأسافر إلى دبي للعمل.": "If I succeed in the interview, I will travel to Dubai for work.", "وماذا لو لم تنجحي؟": "And what if you don't succeed?", "لو لم أنجح": "If I didn't succeed", "لبحثت عن وظيفة أخرى هنا": "I would look for another job here", "وظيفة أخرى": "another job"}
        status: correct
    feedback: "These lines cover the real/possible condition and its unreal/counterfactual contrast."
  ar.b1.unit37.lesson03.exercise04.order_unreal_reply:
    instruction: "Arrange the Arabic words for If I didn't succeed, I would look for another job here."
    accepted_answers: [{value: [لو, لم, أنجح, لبحثت, عن, وظيفة, أخرى, هنا], status: correct}]
    feedback: "*لو لم أنجح لبحثت عن وظيفة أخرى هنا* is Nour's unreal/counterfactual alternative."
  ar.b1.unit37.lesson03.exercise05.reply_unreal_condition:
    instruction: "Yusuf asks: And what if you don't succeed? Reply as Nour with the unreal/counterfactual alternative."
    accepted_answers:
      - {value: "لو لم أنجح لبحثت عن وظيفة أخرى هنا", status: correct}
      - {value: "لو لم أنجح، لبحثت عن وظيفة أخرى هنا.", status: correct}
    feedback: "*لو لم أنجح، لبحثت عن وظيفة أخرى هنا.* is Nour's reply."
  ar.b1.unit37.lesson03.exercise06.write_full_condition_contrast:
    instruction: "As Nour, write two sentences: state the real/possible condition (if you succeed in the interview, using إذا + a future-marked result with س), then state the unreal/counterfactual result if you do not succeed (using لو + a past-tense verb + a لـ-past-tense result)."
    accepted_answers:
      - {value: "إذا نجحت في المقابلة سأسافر إلى دبي للعمل. لو لم أنجح لبحثت عن وظيفة أخرى هنا.", status: correct}
      - {value: "إذا نجحت في المقابلة، سأسافر إلى دبي للعمل. لو لم أنجح، لبحثت عن وظيفة أخرى هنا.", status: correct}
    feedback: "*إذا نجحت في المقابلة، سأسافر إلى دبي للعمل. لو لم أنجح، لبحثت عن وظيفة أخرى هنا.* contrasts the real/possible condition with the unreal/counterfactual one, as required."
