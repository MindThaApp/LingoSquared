course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit68.sabah_mashghul: {"title": "A busy morning", "description": "Describe a busy morning step by step with the Arabic past tense: endings for I, you, he, she, we and they, hollow verbs and sequence words."}
lessons:
  ar.a2.unit68.sabah_mashghul.lesson01.this_morning: {"title": "This morning"}
  ar.a2.unit68.sabah_mashghul.lesson02.sequence: {"title": "First, then"}
  ar.a2.unit68.sabah_mashghul.lesson03.getting_there: {"title": "How did you get there?"}
  ar.a2.unit68.sabah_mashghul.lesson04.hollow_verbs: {"title": "I slept a little"}
  ar.a2.unit68.sabah_mashghul.lesson05.reading_layla: {"title": "Layla's morning"}
  ar.a2.unit68.sabah_mashghul.lesson06.dialogue: {"title": "Yusuf and Layla"}
teaching:
  ar.a2.unit68.sabah_mashghul.lesson01.teach.morning_words: {"title": "Morning words", "gloss": "the morning / coffee / tea / bread", "note": "Nouns are written without case endings here, so *الْقَهْوَة* is read al-qahwa.", "example_gloss": ["This morning I drank coffee.", "Yusuf ate bread."]}
  ar.a2.unit68.sabah_mashghul.lesson01.teach.verbs: {"title": "Verbs: he did", "gloss": "he woke up / he drank / he ate / he washed / he put on / he went out", "note": "The dictionary form of an Arabic verb is the past tense for *he* (the simplest form), for example *شَرِبَ* (shariba).", "example_gloss": ["Yusuf woke up early.", "I woke up early.", "Yusuf left the house."]}
  ar.a2.unit68.sabah_mashghul.lesson01.teach.gn_endings: {"title": "Past tense endings", "gloss": "I drank, you (masc.) drank, you (fem.) drank, he drank, she drank, we drank, they (masc.) drank", "note": "The past tense (al-madi) adds an ending to the stem: -tu (I), -ta (you, masc.), -ti (you, fem.), no ending (he), -at (she), -na (we), -u (they, masc.). The vowel on the ending is what separates -ta from -ti."}
  ar.a2.unit68.sabah_mashghul.lesson01.teach.gn_eat: {"title": "The same endings on another verb", "gloss": "I ate, you (masc.) ate, you (fem.) ate, he ate, she ate, we ate, they ate. I drank the tea and ate the bread.", "note": "Every regular verb takes these same endings, so once you know one paradigm you know them all."}
  ar.a2.unit68.sabah_mashghul.lesson01.teach.gn_agree: {"title": "A verb that comes first", "gloss": "Yusuf drank the coffee. Layla drank the tea.", "note": "When the verb comes before the subject it agrees in gender (he/she) but is always singular. The verb-first order is the most natural in written Arabic."}
  ar.a2.unit68.sabah_mashghul.lesson02.teach.times: {"title": "Times of the morning", "gloss": "six o'clock / seven o'clock / eight o'clock / late", "note": "*فِي السَّاعَة* + an ordinal number gives the time: 'at the sixth hour'.", "example_gloss": ["I woke up at seven o'clock.", "Yusuf woke up late."]}
  ar.a2.unit68.sabah_mashghul.lesson02.teach.sequence_words: {"title": "Putting steps in order", "gloss": "first / then / after that / finally", "example_gloss": ["First I drank coffee, then I ate bread.", "And after that I left the house.", "Finally I arrived."]}
  ar.a2.unit68.sabah_mashghul.lesson02.teach.gn_you: {"title": "You: masculine and feminine", "gloss": "What did you do, Yusuf? What did you do, Layla?", "note": "-ta speaks to a man and -ti to a woman. In unvocalised writing both are written the same, so the name after يَا and the context show whom you address."}
  ar.a2.unit68.sabah_mashghul.lesson02.teach.gn_we_they: {"title": "We and they", "gloss": "We drank the tea and they ate the bread. What did we do? What did they do? We woke up early.", "note": "-na is 'we'. For 'they' (masculine) the ending is -u; the alef written after it is silent."}
  ar.a2.unit68.sabah_mashghul.lesson03.teach.places: {"title": "Places and transport", "gloss": "the bus / the station / the office / work", "example_gloss": ["I took the bus to work.", "Yusuf went to the station."]}
  ar.a2.unit68.sabah_mashghul.lesson03.teach.verbs2: {"title": "More past-tense verbs", "gloss": "he arrived / he rode, he took (a vehicle) / he went / he waited", "example_gloss": ["I arrived at the office.", "We went to the station.", "Yusuf waited for the bus."]}
  ar.a2.unit68.sabah_mashghul.lesson03.teach.gn_same_pattern: {"title": "The same endings on every verb", "gloss": "I took, you (masc.) took, he took, she took, we took, they took", "note": "Regular verbs use the same endings as *شَرِبَ*, so one pattern covers hundreds of verbs."}
  ar.a2.unit68.sabah_mashghul.lesson03.teach.gn_more: {"title": "More forms to notice", "gloss": "he arrived, she arrived, we arrived. he went, she went. I waited, we waited. I took the bus and arrived.", "note": "Notice -at for she, -na for we, -tu for I on every verb."}
  ar.a2.unit68.sabah_mashghul.lesson03.teach.gn_question: {"title": "Questions with هَلْ", "gloss": "Did you arrive late? Yes, I arrived late.", "note": "*هَلْ* at the start turns a statement into a yes/no question; the word order does not change."}
  ar.a2.unit68.sabah_mashghul.lesson04.teach.verbs3: {"title": "Verbs with a long middle vowel", "gloss": "he slept / he came back / he visited / he said", "example_gloss": ["I slept a little.", "I came back home.", "I visited my friend."]}
  ar.a2.unit68.sabah_mashghul.lesson04.teach.gn_hollow: {"title": "The middle vowel shortens", "gloss": "he slept, I slept, you (masc.) slept, you (fem.) slept, she slept, we slept, they slept. he came back, she came back, I came back, we came back, they came back. he said, I said", "note": "In *نَامَ*, *عَادَ*, *زَارَ*, *قَالَ* the long middle vowel stays in he, she and they, and becomes short before -tu, -ta, -ti and -na: *نِمْتُ*, *عُدْتُ*, *زُرْتُ*, *قُلْتُ*."}
  ar.a2.unit68.sabah_mashghul.lesson04.teach.gn_because: {"title": "Giving a reason with لِأَنَّ", "gloss": "I slept a little because I came back late. And she slept a little because she came back late.", "note": "*لِأَنَّنِي* = because I; the -nī at the end is the pronoun 'I'. With a noun: *لِأَنَّ يُوسُف ...*."}
  ar.a2.unit68.sabah_mashghul.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "minute / ten minutes / busy", "example_gloss": ["I waited ten minutes.", "a busy morning"]}
  ar.a2.unit68.sabah_mashghul.lesson05.teach.gn_wa: {"title": "Joining actions with وَ", "gloss": "I went out and took the bus.", "note": "The word 'and' is a single letter written attached to the next word: *وَرَكِبْتُ*. Each verb keeps its own ending."}
  ar.a2.unit68.sabah_mashghul.lesson05.teach.gn_hal: {"title": "Late: masculine and feminine", "gloss": "Yusuf arrived late. Layla arrived late.", "note": "A describing word of this kind agrees with the doer: *مُتَأَخِّرًا* (masc.) and *مُتَأَخِّرَةً* (fem.). A woman speaking about herself uses the feminine."}
  ar.a2.unit68.sabah_mashghul.lesson05.teach.reading: {"title": "Layla writes about her morning", "gloss": "I woke up at six o'clock. First I drank coffee and ate bread. Then I left the house and took the bus. I waited ten minutes and arrived at the office late. A busy morning!", "note": "Layla uses a chain of past-tense verbs, all with -tu, linked by *أَوَّلًا*, *ثُمَّ* and *وَ*."}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: Good morning, Layla! What did you do this morning?"}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d2: {"title": "Layla answers", "gloss": "Layla: I woke up at six o'clock, then I drank coffee."}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d3: {"title": "Yusuf asks more", "gloss": "Yusuf: And after that? Did you take the bus?"}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d4: {"title": "Layla explains", "gloss": "Layla: Yes, I waited ten minutes and arrived late."}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d5: {"title": "Yusuf shares", "gloss": "Yusuf: And I slept a little and arrived late too!"}
  ar.a2.unit68.sabah_mashghul.lesson06.teach.d6: {"title": "Layla sums up", "gloss": "Layla: What a busy morning!"}
exercises:
  ar.a2.unit68.sabah_mashghul.lesson01.exercise01.choose_coffee: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "شَرِبْتُ الْقَهْوَة.", "distractors": ["شَرِبَ الْقَهْوَة.", "أَكَلْتُ الْقَهْوَة.", "شَرِبْنَا الْقَهْوَة."], "accepted_answers": [{"value": "شَرِبْتُ الْقَهْوَة.", "status": "correct"}], "feedback": "*شَرِبْتُ* = I drank; the ending -tu marks the speaker."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise02.choose_layla_ate: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "أَكَلَتْ لَيْلَى الْخُبْز.", "distractors": ["أَكَلَ لَيْلَى الْخُبْز.", "أَكَلْتُ لَيْلَى الْخُبْز.", "أَكَلُوا لَيْلَى الْخُبْز."], "accepted_answers": [{"value": "أَكَلَتْ لَيْلَى الْخُبْز.", "status": "correct"}], "feedback": "With a feminine subject the verb takes -at: *أَكَلَتْ لَيْلَى*."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise03.match_verbs: {"instruction": "Match each Arabic verb to its English meaning.", "accepted_answers": [{"value": [{"left": "اسْتَيْقَظَ", "right": "he woke up"}, {"left": "شَرِبَ", "right": "he drank"}, {"left": "أَكَلَ", "right": "he ate"}, {"left": "غَسَلَ", "right": "he washed"}, {"left": "لَبِسَ", "right": "he put on"}, {"left": "خَرَجَ", "right": "he went out"}], "status": "correct"}], "feedback": "These are the morning verbs of this lesson."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise04.order_drank: {"instruction": "Put the words in order to say 'Yusuf drank the coffee.'", "correct_option": "شَرِبَ يُوسُف الْقَهْوَة", "accepted_answers": [{"value": "شَرِبَ يُوسُف الْقَهْوَة", "status": "correct"}, {"value": "يُوسُف شَرِبَ الْقَهْوَة", "status": "correct"}], "feedback": "The verb comes first and agrees with *يُوسُف* (he)."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise05.complete_woke: {"instruction": "Write the verb that means 'I woke up'.", "correct_option": "اسْتَيْقَظْتُ", "accepted_answers": [{"value": "اسْتَيْقَظْتُ", "status": "correct"}], "feedback": "*اسْتَيْقَظْتُ* = I woke up (stem + -tu)."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise06.translate_bread_coffee: {"instruction": "Translate into Arabic.", "correct_option": "شَرِبْتُ الْقَهْوَة وَأَكَلْتُ الْخُبْز.", "accepted_answers": [{"value": "شَرِبْتُ الْقَهْوَة وَأَكَلْتُ الْخُبْز.", "status": "correct"}, {"value": "شَرِبْتُ الْقَهْوَة وَأَكَلْتُ الْخُبْز", "status": "correct"}], "feedback": "*شَرِبْتُ ... وَأَكَلْتُ ...*: both verbs take -tu."}
  ar.a2.unit68.sabah_mashghul.lesson01.exercise07.write_yusuf_woke: {"instruction": "Write the requested Arabic sentence.", "correct_option": "اسْتَيْقَظَ يُوسُف بَاكِرًا.", "accepted_answers": [{"value": "اسْتَيْقَظَ يُوسُف بَاكِرًا.", "status": "correct"}, {"value": "اسْتَيْقَظَ يُوسُف بَاكِرًا", "status": "correct"}, {"value": "يُوسُف اسْتَيْقَظَ بَاكِرًا.", "status": "correct"}, {"value": "يُوسُف اسْتَيْقَظَ بَاكِرًا", "status": "correct"}], "feedback": "*اسْتَيْقَظَ يُوسُف بَاكِرًا* = Yusuf woke up early."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise01.choose_what_did_you: {"instruction": "Choose the correct Arabic question.", "correct_option": "مَاذَا فَعَلْتِ يَا لَيْلَى؟", "distractors": ["مَاذَا فَعَلْنَا يَا لَيْلَى؟", "مَاذَا فَعَلُوا يَا لَيْلَى؟", "مَاذَا أَكَلْتِ يَا لَيْلَى؟"], "accepted_answers": [{"value": "مَاذَا فَعَلْتِ يَا لَيْلَى؟", "status": "correct"}], "feedback": "Layla is a woman, so the ending is -ti."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise02.choose_seven: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة.", "distractors": ["اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة.", "اسْتَيْقَظْتُ فِي السَّاعَة الثَّامِنَة.", "اسْتَيْقَظَ يُوسُف فِي السَّاعَة السَّابِعَة."], "accepted_answers": [{"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة.", "status": "correct"}], "feedback": "*السَّابِعَة* = the seventh (hour)."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise03.match_sequence: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "أَوَّلًا", "right": "first"}, {"left": "ثُمَّ", "right": "then"}, {"left": "بَعْدَ ذَلِكَ", "right": "after that"}, {"left": "أَخِيرًا", "right": "finally"}, {"left": "بَاكِرًا", "right": "early"}, {"left": "مُتَأَخِّرًا", "right": "late"}], "status": "correct"}], "feedback": "These words order the steps of a morning."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise04.order_first_then: {"instruction": "Put the words in order to say 'First I drank coffee, then I ate bread.'", "correct_option": "أَوَّلًا شَرِبْتُ الْقَهْوَة ثُمَّ أَكَلْتُ الْخُبْز", "accepted_answers": [{"value": "أَوَّلًا شَرِبْتُ الْقَهْوَة ثُمَّ أَكَلْتُ الْخُبْز", "status": "correct"}], "feedback": "*أَوَّلًا* opens the first step and *ثُمَّ* the second."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise05.complete_then: {"instruction": "Write the word that means 'then'.", "correct_option": "ثُمَّ", "accepted_answers": [{"value": "ثُمَّ", "status": "correct"}], "feedback": "*ثُمَّ* = then."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise06.translate_bread_house: {"instruction": "Translate into Arabic.", "correct_option": "أَوَّلًا أَكَلْتُ الْخُبْز، ثُمَّ خَرَجْتُ مِنَ الْبَيْت.", "accepted_answers": [{"value": "أَوَّلًا أَكَلْتُ الْخُبْز، ثُمَّ خَرَجْتُ مِنَ الْبَيْت.", "status": "correct"}, {"value": "أَوَّلًا أَكَلْتُ الْخُبْز، ثُمَّ خَرَجْتُ مِنَ الْبَيْت", "status": "correct"}, {"value": "أَوَّلًا أَكَلْتُ الْخُبْز، وَبَعْدَ ذَلِكَ خَرَجْتُ مِنَ الْبَيْت.", "status": "correct"}, {"value": "أَوَّلًا أَكَلْتُ الْخُبْز، وَبَعْدَ ذَلِكَ خَرَجْتُ مِنَ الْبَيْت", "status": "correct"}, {"value": "أَوَّلًا أَكَلْتُ الْخُبْز ثُمَّ خَرَجْتُ مِنَ الْبَيْت.", "status": "correct"}, {"value": "أَوَّلًا أَكَلْتُ الْخُبْز ثُمَّ خَرَجْتُ مِنَ الْبَيْت", "status": "correct"}], "feedback": "*أَوَّلًا ... ثُمَّ ...* orders the two steps."}
  ar.a2.unit68.sabah_mashghul.lesson02.exercise07.write_eight: {"instruction": "Write the requested Arabic sentence.", "correct_option": "اسْتَيْقَظْنَا فِي السَّاعَة الثَّامِنَة.", "accepted_answers": [{"value": "اسْتَيْقَظْنَا فِي السَّاعَة الثَّامِنَة.", "status": "correct"}, {"value": "اسْتَيْقَظْنَا فِي السَّاعَة الثَّامِنَة", "status": "correct"}, {"value": "فِي السَّاعَة الثَّامِنَة اسْتَيْقَظْنَا.", "status": "correct"}, {"value": "فِي السَّاعَة الثَّامِنَة اسْتَيْقَظْنَا", "status": "correct"}], "feedback": "*اسْتَيْقَظْنَا* = we woke up (stem + -na)."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise01.choose_bus: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "رَكِبْنَا الْحَافِلَة.", "distractors": ["رَكِبُوا الْحَافِلَة.", "رَكِبْتُ الْحَافِلَة.", "انْتَظَرْنَا الْحَافِلَة."], "accepted_answers": [{"value": "رَكِبْنَا الْحَافِلَة.", "status": "correct"}], "feedback": "*رَكِبْنَا* = we took."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise02.choose_layla_office: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "وَصَلَتْ لَيْلَى إِلَى الْمَكْتَب.", "distractors": ["وَصَلَ لَيْلَى إِلَى الْمَكْتَب.", "ذَهَبَتْ لَيْلَى إِلَى الْمَكْتَب.", "وَصَلَتْ لَيْلَى إِلَى الْمَحَطَّة."], "accepted_answers": [{"value": "وَصَلَتْ لَيْلَى إِلَى الْمَكْتَب.", "status": "correct"}], "feedback": "A feminine subject needs *وَصَلَتْ*."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise03.match_places: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "الْحَافِلَة", "right": "the bus"}, {"left": "الْمَحَطَّة", "right": "the station"}, {"left": "الْمَكْتَب", "right": "the office"}, {"left": "الْعَمَل", "right": "work"}, {"left": "وَصَلَ", "right": "he arrived"}, {"left": "انْتَظَرَ", "right": "he waited"}], "status": "correct"}], "feedback": "Words for getting to work."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise04.order_station: {"instruction": "Put the words in order to say 'We went to the station.'", "correct_option": "ذَهَبْنَا إِلَى الْمَحَطَّة", "accepted_answers": [{"value": "ذَهَبْنَا إِلَى الْمَحَطَّة", "status": "correct"}], "feedback": "Verb first, then the place."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise05.complete_arrived: {"instruction": "Write the verb that means 'she arrived'.", "correct_option": "وَصَلَتْ", "accepted_answers": [{"value": "وَصَلَتْ", "status": "correct"}], "feedback": "*وَصَلَتْ* = she arrived."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise06.translate_late_q: {"instruction": "Translate into Arabic.", "correct_option": "هَلْ وَصَلْتَ مُتَأَخِّرًا يَا يُوسُف؟", "accepted_answers": [{"value": "هَلْ وَصَلْتَ مُتَأَخِّرًا يَا يُوسُف؟", "status": "correct"}, {"value": "هَلْ وَصَلْتَ مُتَأَخِّرًا يَا يُوسُف", "status": "correct"}, {"value": "هَلْ وَصَلْتَ يَا يُوسُف مُتَأَخِّرًا؟", "status": "correct"}, {"value": "هَلْ وَصَلْتَ يَا يُوسُف مُتَأَخِّرًا", "status": "correct"}], "feedback": "*هَلْ* + past tense is a yes/no question."}
  ar.a2.unit68.sabah_mashghul.lesson03.exercise07.write_bus_office: {"instruction": "Write the requested Arabic sentence.", "correct_option": "رَكِبْتُ الْحَافِلَة وَوَصَلْتُ إِلَى الْمَكْتَب.", "accepted_answers": [{"value": "رَكِبْتُ الْحَافِلَة وَوَصَلْتُ إِلَى الْمَكْتَب.", "status": "correct"}, {"value": "رَكِبْتُ الْحَافِلَة وَوَصَلْتُ إِلَى الْمَكْتَب", "status": "correct"}, {"value": "رَكِبْتُ الْحَافِلَة ثُمَّ وَصَلْتُ إِلَى الْمَكْتَب.", "status": "correct"}, {"value": "رَكِبْتُ الْحَافِلَة ثُمَّ وَصَلْتُ إِلَى الْمَكْتَب", "status": "correct"}], "feedback": "Two verbs, both with -tu."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise01.choose_slept: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "نِمْتُ قَلِيلًا.", "distractors": ["نَامَ قَلِيلًا.", "نِمْنَا قَلِيلًا.", "نَامَتْ قَلِيلًا."], "accepted_answers": [{"value": "نِمْتُ قَلِيلًا.", "status": "correct"}], "feedback": "Before -tu the middle vowel is short: *نِمْتُ*."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise02.choose_layla_home: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "عَادَتْ لَيْلَى إِلَى الْبَيْت.", "distractors": ["عَادَ يُوسُف إِلَى الْبَيْت.", "عُدْنَا إِلَى الْبَيْت.", "عَادُوا إِلَى الْبَيْت."], "accepted_answers": [{"value": "عَادَتْ لَيْلَى إِلَى الْبَيْت.", "status": "correct"}], "feedback": "*عَادَتْ* keeps the long vowel for 'she'."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise03.match_hollow: {"instruction": "Match each Arabic verb form to its English meaning.", "accepted_answers": [{"value": [{"left": "نِمْتُ", "right": "I slept"}, {"left": "نَامَتْ", "right": "she slept"}, {"left": "عُدْتُ", "right": "I came back"}, {"left": "عَادُوا", "right": "they came back"}, {"left": "قُلْتُ", "right": "I said"}, {"left": "قَالَ", "right": "he said"}], "status": "correct"}], "feedback": "Short vowel for I, long vowel for he, she and they."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise04.order_came_back: {"instruction": "Put the words in order to say 'I came back home late.'", "correct_option": "عُدْتُ إِلَى الْبَيْت مُتَأَخِّرًا", "accepted_answers": [{"value": "عُدْتُ إِلَى الْبَيْت مُتَأَخِّرًا", "status": "correct"}], "feedback": "Verb, place, then the adverb."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise05.complete_slept: {"instruction": "Write the verb that means 'I slept'.", "correct_option": "نِمْتُ", "accepted_answers": [{"value": "نِمْتُ", "status": "correct"}], "feedback": "*نِمْتُ* = I slept."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise06.translate_came_house: {"instruction": "Translate into Arabic.", "correct_option": "عُدْنَا إِلَى الْبَيْت.", "accepted_answers": [{"value": "عُدْنَا إِلَى الْبَيْت.", "status": "correct"}, {"value": "عُدْنَا إِلَى الْبَيْت", "status": "correct"}], "feedback": "*عُدْنَا* = we came back."}
  ar.a2.unit68.sabah_mashghul.lesson04.exercise07.write_because_late: {"instruction": "Write the requested Arabic sentence.", "correct_option": "نِمْتُ قَلِيلًا لِأَنَّنِي عُدْتُ مُتَأَخِّرًا.", "accepted_answers": [{"value": "نِمْتُ قَلِيلًا لِأَنَّنِي عُدْتُ مُتَأَخِّرًا.", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا لِأَنَّنِي عُدْتُ مُتَأَخِّرًا", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا لِأَنَّنِي عُدْتُ مُتَأَخِّرَةً.", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا لِأَنَّنِي عُدْتُ مُتَأَخِّرَةً", "status": "correct"}], "feedback": "A woman writes *مُتَأَخِّرَةً*; both forms are accepted."}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise01.read_first: {"instruction": "Read the text and choose the answer.", "correct_option": "She drank coffee and ate bread.", "distractors": ["She took the bus.", "She went to the office.", "She waited ten minutes."], "accepted_answers": [{"value": "She drank coffee and ate bread.", "status": "correct"}], "feedback": "*أَوَّلًا شَرِبْتُ الْقَهْوَة وَأَكَلْتُ الْخُبْز.*"}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise02.read_late: {"instruction": "Read the text and choose the answer.", "correct_option": "Late, after waiting ten minutes for the bus.", "distractors": ["Early, by train.", "On time, on foot.", "Late, because she slept little."], "accepted_answers": [{"value": "Late, after waiting ten minutes for the bus.", "status": "correct"}], "feedback": "*انْتَظَرْتُ عَشْر دَقَائِق وَوَصَلْتُ ... مُتَأَخِّرَةً.*"}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise03.match_text: {"instruction": "Match each Arabic sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة.", "right": "I woke up at six o'clock."}, {"left": "شَرِبْتُ الْقَهْوَة.", "right": "I drank coffee."}, {"left": "خَرَجْتُ مِنَ الْبَيْت.", "right": "I left the house."}, {"left": "رَكِبْتُ الْحَافِلَة.", "right": "I took the bus."}, {"left": "انْتَظَرْتُ عَشْر دَقَائِق.", "right": "I waited ten minutes."}, {"left": "وَصَلْتُ إِلَى الْمَكْتَب.", "right": "I arrived at the office."}], "status": "correct"}], "feedback": "These are the steps of Layla's morning."}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise04.order_bus_ten: {"instruction": "Put the words in order to say 'I waited ten minutes and arrived.'", "correct_option": "انْتَظَرْتُ عَشْر دَقَائِق وَوَصَلْتُ", "accepted_answers": [{"value": "انْتَظَرْتُ عَشْر دَقَائِق وَوَصَلْتُ", "status": "correct"}], "feedback": "Two verbs joined by *وَ*."}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise05.translate_busy: {"instruction": "Translate into Arabic.", "correct_option": "صَبَاح مَشْغُول!", "accepted_answers": [{"value": "صَبَاح مَشْغُول!", "status": "correct"}, {"value": "صَبَاح مَشْغُول", "status": "correct"}], "feedback": "In Arabic there is no verb here: 'a busy morning'."}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise06.dictation_woke_six: {"instruction": "Type what you hear.", "correct_response": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة.", "orthography_strict": true, "feedback": "You heard *اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة.*"}
  ar.a2.unit68.sabah_mashghul.lesson05.exercise07.dictation_bus: {"instruction": "Type what you hear.", "correct_response": "رَكِبْتُ الْحَافِلَة وَوَصَلْتُ مُتَأَخِّرَةً.", "orthography_strict": true, "feedback": "You heard *رَكِبْتُ الْحَافِلَة وَوَصَلْتُ مُتَأَخِّرَةً.*"}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise01.listen_open: {"instruction": "Listen and select Yusuf's opening question.", "correct_option": "صَبَاحَ الْخَيْر يَا لَيْلَى! مَاذَا فَعَلْتِ هَذَا الصَّبَاح؟", "distractors": ["صَبَاحَ الْخَيْر يَا لَيْلَى! مَاذَا أَكَلْتِ هَذَا الصَّبَاح؟", "صَبَاحَ الْخَيْر يَا لَيْلَى! مَاذَا شَرِبْتِ هَذَا الصَّبَاح؟", "صَبَاحَ الْخَيْر يَا يُوسُف! مَاذَا فَعَلْتَ هَذَا الصَّبَاح؟"], "accepted_answers": [{"value": "صَبَاحَ الْخَيْر يَا لَيْلَى! مَاذَا فَعَلْتِ هَذَا الصَّبَاح؟", "status": "correct"}], "feedback": "Yusuf opens with *مَاذَا فَعَلْتِ هَذَا الصَّبَاح؟*"}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise02.comprehend_late: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "She waited ten minutes for the bus.", "distractors": ["She slept a little.", "She missed the train.", "She went to the station first."], "accepted_answers": [{"value": "She waited ten minutes for the bus.", "status": "correct"}], "feedback": "Layla says she waited ten minutes and arrived late."}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise03.match_dialogue: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "مَاذَا فَعَلْتِ هَذَا الصَّبَاح؟", "right": "What did you do this morning?"}, {"left": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة.", "right": "I woke up at six o'clock."}, {"left": "هَلْ رَكِبْتِ الْحَافِلَة؟", "right": "Did you take the bus?"}, {"left": "وَصَلْتُ مُتَأَخِّرَةً.", "right": "I arrived late."}, {"left": "وَأَنَا نِمْتُ قَلِيلًا.", "right": "And I slept a little."}, {"left": "يَا لَهُ مِنْ صَبَاح مَشْغُول!", "right": "What a busy morning!"}], "status": "correct"}], "feedback": "Questions use -ti for a woman; answers use -tu."}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise04.order_did_you_take: {"instruction": "Put the words in order to ask Layla 'Did you take the bus?'", "correct_option": "هَلْ رَكِبْتِ الْحَافِلَة", "accepted_answers": [{"value": "هَلْ رَكِبْتِ الْحَافِلَة", "status": "correct"}], "feedback": "*هَلْ* comes first."}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise05.respond_what_did: {"instruction": "Answer in Arabic: say you woke up at six o'clock and then drank coffee.", "correct_option": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة، ثُمَّ شَرِبْتُ الْقَهْوَة.", "accepted_answers": [{"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة، ثُمَّ شَرِبْتُ الْقَهْوَة.", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة، ثُمَّ شَرِبْتُ الْقَهْوَة", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة ثُمَّ شَرِبْتُ الْقَهْوَة.", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّادِسَة ثُمَّ شَرِبْتُ الْقَهْوَة", "status": "correct"}], "feedback": "Both a man and a woman say *اسْتَيْقَظْتُ ... شَرِبْتُ*."}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise06.translate_i_slept_late: {"instruction": "Translate into Arabic.", "correct_option": "نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرًا أَيْضًا.", "accepted_answers": [{"value": "نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرًا أَيْضًا.", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرًا أَيْضًا", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرَةً أَيْضًا.", "status": "correct"}, {"value": "نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرَةً أَيْضًا", "status": "correct"}, {"value": "وَأَنَا نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرًا أَيْضًا.", "status": "correct"}, {"value": "وَأَنَا نِمْتُ قَلِيلًا وَوَصَلْتُ مُتَأَخِّرًا أَيْضًا", "status": "correct"}], "feedback": "A woman says *مُتَأَخِّرَةً*; a man says *مُتَأَخِّرًا*."}
  ar.a2.unit68.sabah_mashghul.lesson06.exercise07.write_three: {"instruction": "Write exactly three Arabic sentences, following the numbered requirements in the prompt.", "correct_option": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة. شَرِبْتُ الشَّاي. خَرَجْتُ مِنَ الْبَيْت.", "accepted_answers": [{"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة. شَرِبْتُ الشَّاي. خَرَجْتُ مِنَ الْبَيْت.", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة. شَرِبْتُ الشَّاي. خَرَجْتُ مِنَ الْبَيْت", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة. شَرِبْتُ الشَّاي. ثُمَّ خَرَجْتُ مِنَ الْبَيْت.", "status": "correct"}, {"value": "اسْتَيْقَظْتُ فِي السَّاعَة السَّابِعَة. شَرِبْتُ الشَّاي. ثُمَّ خَرَجْتُ مِنَ الْبَيْت", "status": "correct"}], "feedback": "Three past-tense sentences with -tu."}
