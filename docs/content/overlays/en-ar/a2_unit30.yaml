exercises:
  ar.a2.unit30.lesson01.exercise01.recognize_experience:
    instruction: "Select the meaning."
    correct_option: experience
    distractors: [field, available, weekend]
    accepted_answers: [{value: experience, status: correct}]
    feedback: "*خبرة* means experience."
  ar.a2.unit30.lesson01.exercise02.listen_experience_field:
    instruction: "Listen and select what you hear."
    correct_option: "experience in this field"
    distractors: [weekend, "for two years", "working hours"]
    accepted_answers: [{value: "experience in this field", status: correct}]
    feedback: "You heard *خبرة في هذا المجال*."
  ar.a2.unit30.lesson01.exercise03.match_interview_words:
    instruction: "Match each Arabic interview word or phrase with its meaning."
    accepted_answers:
      - value: {خبرة: experience, مجال: field, عملت: "I worked", "لمدة سنتين": "for two years", متاحة: available, "عطلة نهاية الأسبوع": weekend}
        status: correct
    feedback: "These words cover experience and availability."
  ar.a2.unit30.lesson01.exercise04.order_worked_two_years:
    instruction: "Arrange the Arabic words for I worked in this field for two years."
    accepted_answers: [{value: [عملت, في, هذا, المجال, لمدة, سنتين], status: correct}]
    feedback: "*عملت في هذا المجال لمدة سنتين* describes the experience."
  ar.a2.unit30.lesson01.exercise05.write_experience:
    instruction: "Type exactly this formal Arabic sentence: I worked in this field for two years and I am available on the weekend."
    accepted_answers:
      - {value: "عملت في هذا المجال لمدة سنتين وأنا متاحة في عطلة نهاية الأسبوع", status: correct}
      - {value: "عملت في هذا المجال لمدة سنتين وأنا متاحة في عطلة نهاية الأسبوع.", status: correct}
    feedback: "*عملت في هذا المجال لمدة سنتين وأنا متاحة في عطلة نهاية الأسبوع* is the requested experience and availability statement."
  ar.a2.unit30.lesson02.exercise01.recognize_working_hours:
    instruction: "Select the meaning."
    correct_option: "working hours"
    distractors: [experience, weekend, "any question"]
    accepted_answers: [{value: "working hours", status: correct}]
    feedback: "*ساعات العمل* means working hours."
  ar.a2.unit30.lesson02.exercise02.dialogue_availability:
    instruction: "When is Nour available to work?"
    correct_option: "On the weekend."
    distractors: ["Only on weekdays.", "By appointment only.", "Never on weekends."]
    accepted_answers: [{value: "On the weekend.", status: correct}]
    feedback: "Nour says *أنا متاحة في عطلة نهاية الأسبوع*."
  ar.a2.unit30.lesson02.exercise03.match_interview_lines:
    instruction: "Match each Arabic interview phrase with its meaning."
    accepted_answers:
      - value: {"أخبريني عن خبرتك": "Tell me about your experience", "متاحة للعمل": "available to work", "أي سؤال عن الوظيفة": "any question about the job", "ساعات العمل": "working hours", "من الثامنة صباحا حتى الرابعة مساء": "from eight am to four pm", خبرة: experience, عملت: "I worked"}
        status: correct
    feedback: "These phrases cover the interview questions and the working hours."
  ar.a2.unit30.lesson02.exercise04.order_working_hours_question:
    instruction: "Arrange the Arabic words for What are the working hours?"
    accepted_answers: [{value: [ما, ساعات, العمل], status: correct}]
    feedback: "*ما ساعات العمل؟* asks the clarifying question."
  ar.a2.unit30.lesson02.exercise05.write_interview_answer:
    instruction: "Write a short formal Arabic message with exactly this content: say you worked in this field for two years; say you are available on the weekend; and ask what the working hours are."
    accepted_answers:
      - {value: "عملت في هذا المجال لمدة سنتين، وأنا متاحة في عطلة نهاية الأسبوع. ما ساعات العمل؟", status: correct}
      - {value: "عملت في هذا المجال لمدة سنتين. وأنا متاحة في عطلة نهاية الأسبوع. ما ساعات العمل؟", status: correct}
      - {value: "عملت في هذا المجال لمدة سنتين، وأنا متاحة في عطلة نهاية الأسبوع، ما ساعات العمل؟", status: correct}
      - {value: "عملت في هذا المجال لمدة سنتين وأنا متاحة في عطلة نهاية الأسبوع. ما ساعات العمل؟", status: correct}
    feedback: "*عملت في هذا المجال لمدة سنتين، وأنا متاحة في عطلة نهاية الأسبوع. ما ساعات العمل؟* is the requested formal interview answer."
