exercises:
  ar.b1.unit42.lesson01.exercise01.recognize_indama_astayqiz:
    instruction: "Select the meaning."
    correct_option: "When I wake up"
    distractors: ["After I woke up", "Before I wake up", "Because I woke up"]
    accepted_answers: [{value: "When I wake up", status: correct}]
    feedback: "*عندما أستيقظ* marks a habitual/present time clause."
  ar.b1.unit42.lesson01.exercise02.recognize_ashrab_alqahwa:
    instruction: "Select the meaning."
    correct_option: "I drink coffee"
    distractors: ["I drank coffee", "I do not drink coffee", "I drink tea"]
    accepted_answers: [{value: "I drink coffee", status: correct}]
    feedback: "*أشرب القهوة* is the habitual result."
  ar.b1.unit42.lesson01.exercise03.listen_select_habitual_time_clause:
    instruction: "Listen and select what Yusuf says."
    correct_option: "When I wake up, I drink coffee."
    distractors: ["After I woke up, I drank coffee.", "When I wake up, I read a book.", "I do not drink coffee in the morning."]
    accepted_answers: [{value: "When I wake up, I drink coffee.", status: correct}]
    feedback: "You heard *عندما أستيقظ، أشرب القهوة*."
  ar.b1.unit42.lesson01.exercise04.match_habitual_time_clause:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {عندما: when, أستيقظ: "I wake up", أشرب: "I drink", القهوة: "the coffee", "عندما أستيقظ": "When I wake up", "أشرب القهوة": "I drink coffee"}
        status: correct
    feedback: "These phrases cover the habitual time clause and its result."
  ar.b1.unit42.lesson01.exercise05.order_habitual_time_clause:
    instruction: "Arrange the Arabic words for When I wake up, I drink coffee."
    accepted_answers: [{value: [عندما, أستيقظ, أشرب, القهوة], status: correct}]
    feedback: "*عندما أستيقظ أشرب القهوة* marks a habitual/present time clause."
  ar.b1.unit42.lesson01.exercise06.write_habitual_time_clause:
    instruction: "Write exactly this habitual/present time-clause sentence with عندما: When I wake up, I drink coffee."
    accepted_answers:
      - {value: "عندما أستيقظ أشرب القهوة", status: correct}
      - {value: "عندما أستيقظ، أشرب القهوة.", status: correct}
    feedback: "*عندما أستيقظ، أشرب القهوة.* is the requested sentence."
  ar.b1.unit42.lesson02.exercise01.recognize_bada_an_ittasaltu:
    instruction: "Select the meaning."
    correct_option: "After I woke up yesterday, I called Nour."
    distractors: ["Before I woke up yesterday, I called Nour.", "I called Nour today.", "I woke up and did not call anyone."]
    accepted_answers: [{value: "After I woke up yesterday, I called Nour.", status: correct}]
    feedback: "*بعد أن استيقظت أمس، اتصلت بنور* marks a past time clause."
  ar.b1.unit42.lesson02.exercise02.recognize_qabla_an_qaraatu:
    instruction: "Select the meaning."
    correct_option: "Before I slept, I read a book."
    distractors: ["After I slept, I read a book.", "I did not read anything before I slept.", "I slept before I read a book."]
    accepted_answers: [{value: "Before I slept, I read a book.", status: correct}]
    feedback: "*قبل أن نمت، قرأت كتابا* marks a past time clause."
  ar.b1.unit42.lesson02.exercise03.listen_select_past_time_clauses:
    instruction: "Listen and select what Yusuf says."
    correct_option: "After I woke up yesterday, I called Nour. Before I slept, I read a book."
    distractors: ["When I wake up, I call Nour.", "After I woke up yesterday, I read a book.", "Before I woke up yesterday, I called Nour."]
    accepted_answers: [{value: "After I woke up yesterday, I called Nour. Before I slept, I read a book.", status: correct}]
    feedback: "You heard *بعد أن استيقظت أمس، اتصلت بنور. قبل أن نمت، قرأت كتابا.*"
  ar.b1.unit42.lesson02.exercise04.match_past_time_clauses:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"بعد أن": after, "قبل أن": before, "اتصلت بنور": "I called Nour", "قرأت كتابا": "I read a book", "بعد أن استيقظت أمس": "After I woke up yesterday", "قبل أن نمت": "Before I slept"}
        status: correct
    feedback: "These phrases cover both past time clauses."
  ar.b1.unit42.lesson02.exercise05.order_past_time_clause:
    instruction: "Arrange the Arabic words for After I woke up yesterday, I called Nour."
    accepted_answers: [{value: [بعد, أن, استيقظت, أمس, اتصلت, بنور], status: correct}]
    feedback: "*بعد أن استيقظت أمس اتصلت بنور* marks a past time clause with بعد أن."
  ar.b1.unit42.lesson02.exercise06.write_past_time_clauses:
    instruction: "Write exactly these two past time-clause sentences: After I woke up yesterday, I called Nour (using بعد أن). Before I slept, I read a book (using قبل أن)."
    accepted_answers:
      - {value: "بعد أن استيقظت أمس اتصلت بنور قبل أن نمت قرأت كتابا", status: correct}
      - {value: "بعد أن استيقظت أمس، اتصلت بنور. قبل أن نمت، قرأت كتابا.", status: correct}
    feedback: "*بعد أن استيقظت أمس، اتصلت بنور. قبل أن نمت، قرأت كتابا.* is the requested pair of sentences."
  ar.b1.unit42.lesson03.exercise01.choose_habitual_vs_past:
    instruction: "Which answer states Yusuf's HABITUAL/PRESENT time-clause routine, not a specific past event?"
    correct_option: "عندما أستيقظ، أشرب القهوة"
    distractors: ["بعد أن استيقظت أمس، اتصلت بك", "قبل أن نمت، قرأت كتابا", "استيقظت أمس ولم أشرب القهوة"]
    accepted_answers: [{value: "عندما أستيقظ، أشرب القهوة", status: correct}]
    feedback: "*عندما أستيقظ، أشرب القهوة* is the habitual/present routine, marked with عندما."
  ar.b1.unit42.lesson03.exercise02.dialogue_comprehension_tasalsul:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf drinks coffee when he wakes up; yesterday, after waking up he called Nour, and before sleeping he read a book."
    distractors: ["Yusuf never drinks coffee in the morning.", "Yusuf called Nour before he woke up yesterday.", "Yusuf read a book when he woke up."]
    accepted_answers: [{value: "Yusuf drinks coffee when he wakes up; yesterday, after waking up he called Nour, and before sleeping he read a book.", status: correct}]
    feedback: "Yusuf states his habitual routine with عندما, then recounts yesterday with بعد أن and قبل أن."
  ar.b1.unit42.lesson03.exercise03.match_dialogue_tasalsul:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"ماذا تفعل عندما تستيقظ؟": "What do you do when you wake up?", "عندما أستيقظ، أشرب القهوة.": "When I wake up, I drink coffee.", "وماذا فعلت أمس؟": "And what did you do yesterday?", "بعد أن استيقظت أمس، اتصلت بك.": "After I woke up yesterday, I called you.", "قبل أن نمت، قرأت كتابا.": "Before I slept, I read a book.", أمس: yesterday}
        status: correct
    feedback: "These lines cover both the habitual routine and the specific past day."
  ar.b1.unit42.lesson03.exercise04.order_ask_routine:
    instruction: "Arrange the Arabic words for What do you do when you wake up?"
    accepted_answers: [{value: [ماذا, تفعل, عندما, تستيقظ], status: correct}]
    feedback: "*ماذا تفعل عندما تستيقظ؟* asks about a habitual routine."
  ar.b1.unit42.lesson03.exercise05.reply_routine_question:
    instruction: "Nour asks: What do you do when you wake up? Reply as Yusuf, stating your habitual/present routine."
    accepted_answers:
      - {value: "عندما أستيقظ أشرب القهوة", status: correct}
      - {value: "عندما أستيقظ، أشرب القهوة.", status: correct}
    feedback: "*عندما أستيقظ، أشرب القهوة.* is Yusuf's reply."
  ar.b1.unit42.lesson03.exercise06.write_full_routine_and_past_day:
    instruction: "As Yusuf, write three sentences to Nour: state your habitual/present morning routine (when you wake up, using عندما, you drink coffee), then recount yesterday specifically (after you woke up yesterday, using بعد أن, you called her; before you slept, using قبل أن, you read a book)."
    accepted_answers:
      - {value: "عندما أستيقظ أشرب القهوة بعد أن استيقظت أمس اتصلت بك قبل أن نمت قرأت كتابا", status: correct}
      - {value: "عندما أستيقظ، أشرب القهوة. بعد أن استيقظت أمس، اتصلت بك. قبل أن نمت، قرأت كتابا.", status: correct}
    feedback: "*عندما أستيقظ، أشرب القهوة. بعد أن استيقظت أمس، اتصلت بك. قبل أن نمت، قرأت كتابا.* distinguishes the habitual/present routine from the specific past day, as required."
