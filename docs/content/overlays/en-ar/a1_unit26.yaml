course:
  title: Arabic A1
  description: 'Beginner Arabic for describing a person''s basic appearance: height and age, hair and eye colour, the question كيف تبدو؟ (kayfa tabdū?) and comparing two people with أطول من (aṭwal min).'
units:
  ar.a1.unit26.appearance:
    title: Describing appearance
lessons:
  ar.a1.unit26.lesson01.twyl_wqsyr_wkbyr_fy:
    title: Tall, short, old, and young
  ar.a1.unit26.lesson02.wsf_alshar:
    title: Describing hair
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: Eyes and what does someone look like?
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: Layla describes Nour
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
