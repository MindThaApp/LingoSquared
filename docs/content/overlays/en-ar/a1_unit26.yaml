  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: Yusuf recognizes Nour
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Tall and short
    gloss: tall / short
    note: 'طويل (ṭawīl) means tall and قصير (qaṣīr) short. For a woman they take ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara is tall.
    - Karim is short.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Old and young
    gloss: old / young
    note: كبير في السن (kabīr fī as-sinn) and صغير في السن (ṣaghīr fī as-sinn) describe a general impression of age, not an exact number of years.
    example_gloss:
    - Grandpa is old.
    - Yusuf is young.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Age: a number or an impression'
    gloss: كم عمرك؟ (kam ʿumruka?) asks for a number of years, while كبير في السن (kabīr fī as-sinn) gives a general impression with no number, as in الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Use كم عمرك؟ to ask exactly how old someone is. Here كبير في السن only describes how old someone looks.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara is tall and Karim is short
    gloss: Sara is tall and Karim is short.
    note: 'و (wa-) joins the two sentences and is written attached to the next word: وكريم (wa-karīm). The adjectives agree: سارة طويلة is feminine and كريم قصير is masculine.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Hair
    gloss: the hair
    note: 'الشعر (ash-shaʿr) means the hair. ش is a sun letter, so the ل of ال is not pronounced: ash-shaʿr.'
    example_gloss: Yusuf has short black hair.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'أشقر (ashqar), بني (bunnī) and رمادي (ramādī) describe hair and come after the noun: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla has blond hair.
    - Karim has brown hair.
    - Grandpa has grey hair.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: 'طويل (ṭawīl) and قصير (qaṣīr) also describe hair: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). They follow شعر, which is masculine.'
    example_gloss:
    - Sara has long hair.
    - Karim has short hair.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Adjectives follow the noun
    gloss: 'In Arabic the adjective comes after the noun and agrees with it: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) is masculine, so its adjectives are masculine too. With an indefinite noun neither word takes ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Hair and her hair
    gloss: شعر (shaʿr) means hair. Add the pronoun ها (hā, her) to get شعرها (shaʿruhā, her hair).
    note: 'The ending ها marks the owner: شعرها (her hair), اسمها (her name), عيناها (her eyes). It is written joined to the word.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf has short black hair
    gloss: Yusuf has short black hair.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) before a name means has, and it is joined to the name.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla has long blond hair
    gloss: Layla has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Eyes
    gloss: the eyes
    note: 'العينان (al-ʿaynān) means the eyes. It is a dual noun: Arabic has a special ending ان for exactly two.'
    example_gloss: Yusuf has brown eyes.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: 'أزرق (azraq) blue, بني (bunnī) brown and أخضر (akhḍar) green are the masculine forms. With عينان the dual forms are used: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla has blue eyes.
    - Karim has brown eyes.
    - Sara has green eyes.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Dual eyes, dual adjective
    gloss: 'عينان (ʿaynān) is dual, so its adjective is dual too: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: In the dual the ending ان is added to both the noun and the adjective. The adjective is also feminine because عين is a feminine noun.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: What does Layla look like?
    gloss: What does Layla look like?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) asks what Layla looks like. تبدو (tabdū) is feminine because Layla is a woman; for a man it is يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla has long blond hair and blue eyes
    gloss: Layla has long blond hair and blue eyes.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + a name means has, and و joins hair and eyes.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla introduces Nour
    gloss: 'Layla: A new girl is coming to the language café. Her name is Nour.'
    note: 'ستأتي (sa-taʾtī) means she will come: س (sa-) marks the future and ت (ta-) means she. اسمها (ismuhā) means her name.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf asks what she looks like
    gloss: 'Yusuf: Okay! What does she look like?'
    note: 'كيف تبدو؟ (kayfa tabdū?) has no name this time: the verb تبدو already means she looks.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla describes Nour's height and hair
    gloss: 'Layla: She is short and she has short blond hair.'
    note: قصيرة (qaṣīra) is feminine because Nour is a woman, but شعر قصير أشقر stays masculine because شعر is a masculine noun.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf asks about her eyes
    gloss: 'Yusuf: And her eyes?'
    note: 'وعيناها (wa-ʿaynāhā) means and her eyes: و (wa-) is joined to the noun, and ها (hā) at the end means her.'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla describes Nour's eyes
    gloss: 'Layla: She has green eyes.'
    note: 'لها (lahā) means she has: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) is a dual noun with a dual adjective.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf will recognize her
    gloss: 'Yusuf: Thanks! Then I''ll recognize her.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) means I will recognize her: س (sa-) marks the future and ها on عليها means her.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Comparing Karim and Sara
    gloss: Karim and Sara are brother and sister, but they look different. Karim is short and has short brown hair and brown eyes. Sara is taller than Karim and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      أخ: brother
      أخت: sister
      تبدو: look
      مختلفان: different
      القامة: short (in height)
      قصير: short
      بني: brown
      شعر: hair
      بنيتان: brown
      وعينان: eyes
      أطول: taller
      طويل: long
      خضراوان: green
      المظهر: appearance (how someone looks)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Comparing with أفعل
    gloss: 'To compare, use the أفعل (afʿal) form + من (min): سارة أطول من كريم (sāra aṭwal min karīm), Sara is taller than Karim.'
    note: طويل (ṭawīl) becomes أطول (aṭwal) in the comparative, and من (min) means than. The form does not change for a woman.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara has longer hair than Karim
    gloss: Sara has longer hair than Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول stays masculine because شعر is a masculine noun.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: 'لدي (ladayya) means I have; Arabic has no verb to have. The adjectives follow the noun: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf spots Nour
    gloss: 'Yusuf: Look, is that Nour? She has short blond hair and green eyes.'
    note: انظري (unẓurī) is the command to a woman, because Yusuf speaks to Layla; to a man it is انظر (unẓur). هذه (hādhihi) means this, for a feminine noun.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla confirms
    gloss: 'Layla: Yes, that''s Nour!'
    note: A short, natural confirmation.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour greets Yusuf
    gloss: 'Nour: Hi, are you Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) is a yes/no question: هل (hal) + a sentence with no verb to be.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf greets Nour back
    gloss: 'Yusuf: Yes! Nice to meet you, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) is the polite phrase for a first meeting. ب (bi-) is joined to معرفتك, and the ك at the end means you.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour returns the greeting
    gloss: 'Nour: Nice to meet you too!'
    note: Closes the dialogue -- Yusuf successfully recognized Nour from Layla's earlier description.
