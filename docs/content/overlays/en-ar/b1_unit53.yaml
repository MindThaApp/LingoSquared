review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar/b1_unit53_jumal_mawsula.yaml. Fourth and final unit of the ar B1 50-53 wave, completing the 19-outcome B1 tier. Review 2026-10-19: 6 fixes - alzamil_alladhi note now states agreement (الذي/التي/الذين) and that no relative pronoun follows an indefinite noun (زميل يعمل في المكتب); almabna_alladhi and yusuf_almabna_alladhi notes misdescribed الذي as combining with the preposition - now explain the returning pronoun ـه in عنه; alsharika_allati note adds feminine معها; reply_describe_colleague did not pin the content - now names both sentences; Laila -> Layla; almabna audio voice fixed in the realization. NATIVE FLAGS: none. Dialogue note: Yusuf adds the building sentence to a question about the new colleague (weak coherence, left as is)."}
course: {title: Arabic B1, description: "Intermediate Modern Standard Arabic (fusha): compound modal-plus-embedded-clause constructions for abilities, obligations, conditions, debate, workplace communication, sequenced narrative, real conditions, time clauses, reported speech, purpose, advice and suggestions, complaints, past regret, future plans, summarizing, nuanced debate, hypotheticals, professional meetings, and relative clauses."}
units:
  ar.b1.unit53.jumal_mawsula: {title: "Relative Clauses"}
lessons:
  ar.b1.unit53.lesson01.alladhi: {title: "Who... (describing the colleague)"}
  ar.b1.unit53.lesson02.alati_wa_harf_jarr: {title: "That... + preposition, and feminine that (the building we talked about; the company we worked with)"}
  ar.b1.unit53.lesson03.hiwar_wasf: {title: "Dialogue: describing the colleague and the building"}
teaching:
  ar.b1.unit53.lesson01.teach.alzamil_alladhi: {title: "The colleague who works in the office", gloss: "the colleague who works in the office", note: "*الذي* is the masculine singular relative pronoun (who/that). It agrees with its noun: التي for a feminine noun, الذين for masculine human plurals. It is used only after a DEFINITE noun (الزميل); after an indefinite noun Arabic uses no relative pronoun at all: زميل يعمل في المكتب (a colleague who works in the office).", example_gloss: "The colleague who works in the office, his name is Karim."}
  ar.b1.unit53.lesson01.teach.ismuhu_karim: {title: "His name is Karim", gloss: "his name is Karim", note: "*اسمه كريم* means his name is Karim.", example_gloss: "The colleague who works in the office, his name is Karim."}
  ar.b1.unit53.lesson01.teach.yusuf_alzamil_alladhi: {title: "Yusuf describes a colleague", gloss: "The colleague who works in the office, his name is Karim.", note: "الذي combines two facts about the colleague into one richer sentence.", example_gloss: "Yusuf said: The colleague who works in the office, his name is Karim."}
  ar.b1.unit53.lesson02.teach.almabna_alladhi: {title: "The building that we talked about", gloss: "the building that we talked about", note: "*الذي* is followed by a clause that must refer back to المبنى with a pronoun: عنه = عن (about) + ـه (it). English leaves this pronoun out (the building that we talked about); Arabic requires it.", example_gloss: "The building that we talked about is near the office."}
  ar.b1.unit53.lesson02.teach.qarib_min_almaktab: {title: "Near the office", gloss: "near the office", note: "*قريب من المكتب* means near the office.", example_gloss: "The building that we talked about is near the office."}
  ar.b1.unit53.lesson02.teach.yusuf_almabna_alladhi: {title: "Yusuf describes the building", gloss: "The building that we talked about is near the office.", note: "After الذي, the preposition carries a pronoun pointing back to the noun: تحدثنا عنه (we talked about it), referring to المبنى.", example_gloss: "Yusuf said: The building that we talked about is near the office."}
  ar.b1.unit53.lesson02.teach.alsharika_allati: {title: "The company that we worked with", gloss: "the company that we worked with", note: "*التي* is the feminine singular relative pronoun (who/that), agreeing with the feminine noun الشركة (the company) — contrast with masculine الذي used for المبنى (the building). The pronoun pointing back is feminine too: معها (with it), not معه.", example_gloss: "The company that we worked with is near the office."}
  ar.b1.unit53.lesson03.teach.man_huwa_alzamil: {title: "Who is the new colleague?", gloss: "who is the new colleague?", note: "This opens the descriptive exchange.", example_gloss: "Layla said: Who is the new colleague?"}
  ar.b1.unit53.lesson03.teach.yusuf_full_reply: {title: "Yusuf's full description", gloss: "The colleague who works in the office, his name is Karim. The building that we talked about is near the office.", note: "Two relative-clause descriptions in a row, one plain and one combined with a preposition.", example_gloss: "Yusuf said: The colleague who works in the office, his name is Karim. The building that we talked about is near the office."}
exercises:
  ar.b1.unit53.lesson01.exercise01.recognize_alzamil_alladhi:
    instruction: "Select the meaning."
    correct_option: "The colleague who works in the office"
    distractors: ["The colleague who worked in the office", "The colleague who does not work in the office", "The office where the colleague works"]
    accepted_answers: [{value: "The colleague who works in the office", status: correct}]
    feedback: "*الزميل الذي يعمل في المكتب* combines two facts about the colleague."
  ar.b1.unit53.lesson01.exercise02.recognize_alzamil_alladhi_full:
    instruction: "Select the meaning."
    correct_option: "The colleague who works in the office, his name is Karim"
    distractors: ["The colleague who worked in the office, his name is Karim", "The colleague who works in the office, her name is Karim", "The colleague who does not work in the office, his name is Karim"]
    accepted_answers: [{value: "The colleague who works in the office, his name is Karim", status: correct}]
    feedback: "*الزميل الذي يعمل في المكتب اسمه كريم* is the full descriptive sentence."
  ar.b1.unit53.lesson01.exercise03.listen_select_alzamil_alladhi:
    instruction: "Listen and select what Yusuf says."
    correct_option: "The colleague who works in the office, his name is Karim."
    distractors: ["The colleague who worked in the office, his name is Karim.", "The colleague who works in the office, her name is Karim.", "The colleague who does not work in the office, his name is Karim."]
    accepted_answers: [{value: "The colleague who works in the office, his name is Karim.", status: correct}]
    feedback: "You heard *الزميل الذي يعمل في المكتب اسمه كريم*."
  ar.b1.unit53.lesson01.exercise04.match_alzamil_alladhi:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {الزميل: "the colleague", الذي: "who (masc.)", يعمل: works, "في المكتب": "in the office", اسمه: "his name is", كريم: Karim, "الزميل الذي": "the colleague who", "يعمل في المكتب": "works in the office"}
        status: correct
    feedback: "These phrases cover the relative-clause description."
  ar.b1.unit53.lesson01.exercise05.order_alzamil_alladhi:
    instruction: "Arrange the Arabic words for The colleague who works in the office, his name is Karim."
    accepted_answers: [{value: [الزميل, الذي, يعمل, في, المكتب, اسمه, كريم], status: correct}]
    feedback: "*الزميل الذي يعمل في المكتب اسمه كريم* combines two facts with الذي."
  ar.b1.unit53.lesson01.exercise06.write_alzamil_alladhi:
    instruction: "Write exactly this sentence combining two facts with الذي: The colleague who works in the office, his name is Karim."
    accepted_answers:
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم", status: correct}
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم.", status: correct}
    feedback: "*الزميل الذي يعمل في المكتب اسمه كريم.* is the requested sentence."
  ar.b1.unit53.lesson02.exercise01.recognize_almabna_alladhi:
    instruction: "Select the meaning."
    correct_option: "The building that we talked about"
    distractors: ["The building that we will talk about", "The building that we did not talk about", "The office that we talked about"]
    accepted_answers: [{value: "The building that we talked about", status: correct}]
    feedback: "*المبنى الذي تحدثنا عنه* uses الذي combined with the preposition عن (about it)."
  ar.b1.unit53.lesson02.exercise02.recognize_almabna_alladhi_full:
    instruction: "Select the meaning."
    correct_option: "The building that we talked about is near the office"
    distractors: ["The building that we will talk about is near the office", "The building that we talked about is far from the office", "The office that we talked about is near the building"]
    accepted_answers: [{value: "The building that we talked about is near the office", status: correct}]
    feedback: "*المبنى الذي تحدثنا عنه قريب من المكتب* is the full descriptive sentence."
  ar.b1.unit53.lesson02.exercise03.listen_select_almabna_alladhi:
    instruction: "Listen and select what Yusuf says."
    correct_option: "The building that we talked about is near the office."
    distractors: ["The building that we will talk about is near the office.", "The building that we talked about is far from the office.", "The office that we talked about is near the building."]
    accepted_answers: [{value: "The building that we talked about is near the office.", status: correct}]
    feedback: "You heard *المبنى الذي تحدثنا عنه قريب من المكتب*."
  ar.b1.unit53.lesson02.exercise04.match_almabna_alladhi:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {المبنى: "the building", "الذي ... عنه": "that ... about (it)", تحدثنا: "we talked", قريب: near, من: "from/of", "قريب من المكتب": "near the office", "تحدثنا عنه": "we talked about it", "المبنى الذي تحدثنا عنه": "the building that we talked about"}
        status: correct
    feedback: "These phrases cover the relative pronoun combined with a preposition."
  ar.b1.unit53.lesson02.exercise05.order_almabna_alladhi:
    instruction: "Arrange the Arabic words for The building that we talked about is near the office."
    accepted_answers: [{value: [المبنى, الذي, تحدثنا, عنه, قريب, من, المكتب], status: correct}]
    feedback: "*المبنى الذي تحدثنا عنه قريب من المكتب* combines الذي with a preposition."
  ar.b1.unit53.lesson02.exercise06.write_almabna_alladhi:
    instruction: "Write exactly this sentence, using الذي combined with a preposition (عنه, about it): The building that we talked about is near the office."
    accepted_answers:
      - {value: "المبنى الذي تحدثنا عنه قريب من المكتب", status: correct}
      - {value: "المبنى الذي تحدثنا عنه قريب من المكتب.", status: correct}
    feedback: "*المبنى الذي تحدثنا عنه قريب من المكتب.* is the requested sentence."
  ar.b1.unit53.lesson02.exercise07.recognize_alsharika_allati:
    instruction: "Select the meaning."
    correct_option: "The company that we worked with"
    distractors: ["The company that we will work with", "The company that we did not work with", "The office that we worked with"]
    accepted_answers: [{value: "The company that we worked with", status: correct}]
    feedback: "*الشركة التي عملنا معها* uses the FEMININE relative pronoun التي, agreeing with الشركة (the company)."
  ar.b1.unit53.lesson02.exercise08.match_alsharika_allati:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {الشركة: "the company", التي: "who/that (fem.)", عملنا: "we worked", معها: "with it/her", قريبة: "near (fem.)", "عملنا معها": "we worked with it", "الشركة التي": "the company that", "الشركة التي عملنا معها": "the company that we worked with"}
        status: correct
    feedback: "These phrases cover the feminine relative pronoun التي, agreeing with الشركة."
  ar.b1.unit53.lesson02.exercise09.order_alsharika_allati:
    instruction: "Arrange the Arabic words for The company that we worked with is near the office."
    accepted_answers: [{value: [الشركة, التي, عملنا, معها, قريبة, من, المكتب], status: correct}]
    feedback: "*الشركة التي عملنا معها قريبة من المكتب* uses the feminine التي and قريبة, both agreeing with الشركة."
  ar.b1.unit53.lesson02.exercise10.write_alsharika_allati:
    instruction: "Write exactly this sentence, using the FEMININE relative pronoun التي (agreeing with الشركة, the company): The company that we worked with is near the office."
    accepted_answers:
      - {value: "الشركة التي عملنا معها قريبة من المكتب", status: correct}
      - {value: "الشركة التي عملنا معها قريبة من المكتب.", status: correct}
    feedback: "*الشركة التي عملنا معها قريبة من المكتب.* is the requested sentence, using feminine agreement throughout."
  ar.b1.unit53.lesson03.exercise01.choose_prep_relative:
    instruction: "Which answer uses a relative pronoun COMBINED WITH A PREPOSITION (about it), not a simple subject relative clause?"
    correct_option: "المبنى الذي تحدثنا عنه قريب من المكتب"
    distractors: ["الزميل الذي يعمل في المكتب اسمه كريم", "من هو الزميل الجديد؟", "الزميل الذي يعمل في المكتب"]
    accepted_answers: [{value: "المبنى الذي تحدثنا عنه قريب من المكتب", status: correct}]
    feedback: "*الذي ... عنه* combines the relative pronoun with the preposition عن; *الزميل الذي يعمل* is a plain subject relative clause."
  ar.b1.unit53.lesson03.exercise02.dialogue_comprehension_wasf:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf describes the new colleague, Karim, who works in the office, and the building they discussed, which is near the office."
    distractors: ["Yusuf says there is no new colleague.", "Yusuf says the building is far from the office.", "Yusuf refuses to describe the colleague."]
    accepted_answers: [{value: "Yusuf describes the new colleague, Karim, who works in the office, and the building they discussed, which is near the office.", status: correct}]
    feedback: "Yusuf combines two facts about the colleague, then two facts about the building, both using الذي."
  ar.b1.unit53.lesson03.exercise03.match_dialogue_wasf:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"من هو الزميل الجديد؟": "Who is the new colleague?", "الزميل الذي يعمل في المكتب اسمه كريم.": "The colleague who works in the office, his name is Karim.", "المبنى الذي تحدثنا عنه قريب من المكتب.": "The building that we talked about is near the office.", الذي: "who/that (masc.)", عنه: "about it", الزميل: "the colleague"}
        status: correct
    feedback: "These lines cover the full description with relative clauses."
  ar.b1.unit53.lesson03.exercise04.order_man_huwa_alzamil:
    instruction: "Arrange the Arabic words for Who is the new colleague?"
    accepted_answers: [{value: [من, هو, الزميل, الجديد], status: correct}]
    feedback: "*من هو الزميل الجديد؟* opens the descriptive exchange."
  ar.b1.unit53.lesson03.exercise05.reply_describe_colleague:
    instruction: "Layla asks: Who is the new colleague? Reply as Yusuf in two sentences, each with الذي: the colleague who works in the office, his name is Karim; the building that we talked about is near the office."
    accepted_answers:
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم المبنى الذي تحدثنا عنه قريب من المكتب", status: correct}
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم. المبنى الذي تحدثنا عنه قريب من المكتب.", status: correct}
    feedback: "*الزميل الذي يعمل في المكتب اسمه كريم. المبنى الذي تحدثنا عنه قريب من المكتب.* is Yusuf's full reply."
  ar.b1.unit53.lesson03.exercise06.write_full_wasf:
    instruction: "As Yusuf, answer in two sentences, each combining two facts with الذي: first, describe the colleague (the colleague who works in the office, his name is Karim); then describe the building using الذي combined with a preposition (the building that we talked about is near the office)."
    accepted_answers:
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم المبنى الذي تحدثنا عنه قريب من المكتب", status: correct}
      - {value: "الزميل الذي يعمل في المكتب اسمه كريم. المبنى الذي تحدثنا عنه قريب من المكتب.", status: correct}
    feedback: "*الزميل الذي يعمل في المكتب اسمه كريم. المبنى الذي تحدثنا عنه قريب من المكتب.* links two relative-clause descriptions, as required."
