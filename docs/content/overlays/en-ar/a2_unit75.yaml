review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings; adverbs and the predicate after kana take tanwin-fatha; masculine and feminine you differ only by a vowel, so feminine variants are accepted. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit75.astatii_an: {"title": "I can swim", "description": "Say what you can and cannot do and what is possible for you, with astatii' an and yumkinuni an plus the subjunctive, and describe your availability."}
lessons:
  ar.a2.unit75.astatii_an.lesson01.astatii_an: {"title": "I can"}
  ar.a2.unit75.astatii_an.lesson02.la_astatii: {"title": "I cannot"}
  ar.a2.unit75.astatii_an.lesson03.yumkinuni_an: {"title": "It is possible for me"}
  ar.a2.unit75.astatii_an.lesson04.mutafarrigh: {"title": "I am free"}
  ar.a2.unit75.astatii_an.lesson05.reading_yusuf: {"title": "Yusuf's week"}
  ar.a2.unit75.astatii_an.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit75.astatii_an.lesson01.teach.verbs: {"title": "Things I can do", "gloss": "I swim / I cook / I drive / the car / well", "example_gloss": ["I can drive the car.", "I can cook well."]}
  ar.a2.unit75.astatii_an.lesson01.teach.gn_astatii: {"title": "أَسْتَطِيعُ أَنْ", "gloss": "I can swim.", "note": "*أَسْتَطِيعُ* means I can. It is followed by *أَنْ* and a second verb with the same person prefix, ending in *-a*."}
  ar.a2.unit75.astatii_an.lesson01.teach.gn_pers: {"title": "Can, for each person", "gloss": "I can swim. You (masc.) can swim. You (fem.) can swim. He can swim. We can swim.", "note": "Both verbs change together. For a woman, *تَسْتَطِيعِينَ* is followed by a verb ending in *-ī* (*تَسْبَحِي*)."}
  ar.a2.unit75.astatii_an.lesson02.teach.words: {"title": "Sorry, I can't", "gloss": "unfortunately / I go / I attend / the meeting", "example_gloss": ["Unfortunately, I cannot attend the meeting.", "I cannot go tomorrow."]}
  ar.a2.unit75.astatii_an.lesson02.teach.gn_neg: {"title": "لَا أَسْتَطِيعُ: I cannot", "gloss": "I cannot drive the car. Yusuf cannot swim.", "note": "Put *لَا* before *أَسْتَطِيعُ* or *يَسْتَطِيعُ*. The second verb stays as it is, ending in *-a*."}
  ar.a2.unit75.astatii_an.lesson02.teach.gn_sorry: {"title": "Saying no politely", "gloss": "Unfortunately, I cannot go tomorrow.", "note": "Start with *لِلْأَسَف* (unfortunately) to soften a refusal."}
  ar.a2.unit75.astatii_an.lesson02.teach.gn_yusuf: {"title": "A name as subject", "gloss": "Yusuf cannot drive the car.", "note": "With a name the first verb comes before it and uses the *يَـ* prefix for a man."}
  ar.a2.unit75.astatii_an.lesson03.teach.days: {"title": "Days and visiting", "gloss": "day / Monday / Tuesday / Friday / I visit you", "example_gloss": ["I can visit you on Monday.", "I cannot visit you on Friday."]}
  ar.a2.unit75.astatii_an.lesson03.teach.gn_yumkinuni: {"title": "يُمْكِنُنِي أَنْ", "gloss": "I can visit you on Monday.", "note": "*يُمْكِنُنِي* means it is possible for me. It is used like *أَسْتَطِيعُ*, with *أَنْ* and a verb ending in *-a*, and it often talks about time and circumstances."}
  ar.a2.unit75.astatii_an.lesson03.teach.gn_neg: {"title": "Not possible", "gloss": "I cannot visit you on Friday.", "note": "Add *لَا* before *يُمْكِنُنِي*."}
  ar.a2.unit75.astatii_an.lesson03.teach.gn_you: {"title": "Other persons", "gloss": "You can visit me. We can visit you.", "note": "The ending shows who: *يُمْكِنُنِي* me, *يُمْكِنُكَ* you (masc.), *يُمْكِنُنَا* us. For a woman, *يُمْكِنُكِ*."}
  ar.a2.unit75.astatii_an.lesson04.teach.words: {"title": "Free and busy", "gloss": "free / busy / in the morning / in the evening / I am", "example_gloss": ["I am free in the morning.", "I am busy in the evening."]}
  ar.a2.unit75.astatii_an.lesson04.teach.gn_free: {"title": "Free or busy", "gloss": "I am free on Monday. I am busy on Friday.", "note": "A woman says *أَنَا مُتَفَرِّغَة* and *أَنَا مَشْغُولَة*. There is no verb for am in this sentence."}
  ar.a2.unit75.astatii_an.lesson04.teach.gn_qad: {"title": "قَدْ أَكُونُ: I might be", "gloss": "I might be busy. I might be free.", "note": "*قَدْ* before a present-tense verb means might. After *أَكُونُ* the word takes the ending *-an*: *مَشْغُولًا*, *مُتَفَرِّغًا*."}
  ar.a2.unit75.astatii_an.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "my week / Layla", "example_gloss": ["This is my week.", "I can visit Layla."]}
  ar.a2.unit75.astatii_an.lesson05.teach.reading: {"title": "Yusuf describes his week", "gloss": "This is my week. On Monday I am free, I can visit Layla. On Tuesday I am busy, I cannot attend the meeting. I might be free on Friday.", "note": "Availability: free, busy and might be free."}
  ar.a2.unit75.astatii_an.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: Can you visit me on Tuesday, Yusuf?"}
  ar.a2.unit75.astatii_an.lesson06.teach.d2: {"title": "Yusuf refuses", "gloss": "Yusuf: Unfortunately, I cannot. I am busy."}
  ar.a2.unit75.astatii_an.lesson06.teach.d3: {"title": "Layla tries another day", "gloss": "Layla: And on Monday?"}
  ar.a2.unit75.astatii_an.lesson06.teach.d4: {"title": "Yusuf agrees", "gloss": "Yusuf: On Monday I can visit you in the evening."}
  ar.a2.unit75.astatii_an.lesson06.teach.d5: {"title": "Layla asks more", "gloss": "Layla: Great! And can you cook?"}
  ar.a2.unit75.astatii_an.lesson06.teach.d6: {"title": "Yusuf boasts", "gloss": "Yusuf: Yes, I can cook well!"}
exercises:
