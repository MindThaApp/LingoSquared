  ar.a2.unit75.astatii_an.lesson01.exercise04.order_cook: {"instruction": "Put the words in order to say 'I can cook well.'", "correct_option": "أَسْتَطِيعُ أَنْ أَطْبُخَ جَيِّدًا", "accepted_answers": [{"value": "أَسْتَطِيعُ أَنْ أَطْبُخَ جَيِّدًا", "status": "correct"}], "feedback": "*أَسْتَطِيعُ أَنْ* then the verb and the adverb."}
