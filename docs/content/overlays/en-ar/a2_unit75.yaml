  ar.a2.unit75.astatii_an.lesson01.exercise07.wr_cook: {"instruction": "Write the requested Arabic sentence.", "correct_option": "أَسْتَطِيعُ أَنْ أَطْبُخَ جَيِّدًا.", "accepted_answers": [{"value": "أَسْتَطِيعُ أَنْ أَطْبُخَ جَيِّدًا.", "status": "correct"}, {"value": "أَسْتَطِيعُ أَنْ أَطْبُخَ جَيِّدًا", "status": "correct"}], "feedback": "*جَيِّدًا* at the end."}
