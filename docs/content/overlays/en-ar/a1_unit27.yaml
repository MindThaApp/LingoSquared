teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Animal, a pet
    gloss: the animal / a pet
    note: حيوان (ḥayawān) means animal and حيوان أليف (ḥayawān alīf) means pet. أليف (alīf) is an adjective meaning tame, so it follows the noun.
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Layla has a dog.
    - Karim has a cat.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nour has a bird.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: 'هل لديك (hal ladayka) asks do you have. To a woman it is written the same, but the last vowel is i: ladayki. هل (hal) opens a yes/no question.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: 'ليس لدي (laysa ladayya) means I do not have: ليس (laysa) negates, and لدي (ladayya) means I have.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Not having: ليس لدي'
    gloss: 'To say you do not have something, use ليس لدي (laysa ladayya): ليس لدي وقت (I have no time), ليس لدي حيوان أليف (I have no pet).'
    note: ليس لدي works with any noun and does not change for gender. For he and she say ليس لديه (laysa ladayhi) and ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) literally means taking the animal on an outing. The verb is أخذ, to take.
    example_gloss: I walk the dog every day.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: The verb changes with the person
    gloss: 'The verb changes with the person: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), I take the dog on a walk; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), Karim takes his dog on a walk.'
    note: The opening letter أ (a-) marks I and ي (ya-) marks he. نزهة (nuzha) is a walk or a short outing.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: To play with
    gloss: to play with
    example_gloss: Karim plays with his cat.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: 'كل يوم (kull yawm) means every day: كل + a singular noun without ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: أطعم (uṭʿim) means I feed. القطة (al-qiṭṭa) is feminine, and the ال is attached to the noun.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Plurals: كلب → كلاب'
    gloss: 'Many plurals are irregular, so learn them with the noun: كلب (kalb) becomes كلاب (kilāb), قطة (qiṭṭa) becomes قطط (qiṭaṭ) and طائر (ṭāʾir) becomes طيور (ṭuyūr).'
    note: Arabic plurals are mostly broken plurals, so each plural is learned together with its noun; the plural of animals takes a feminine singular adjective.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Yusuf loves dogs.
    - Sara loves cats.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: I love animals
    gloss: I love animals.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) means I love animals. The plural ends in ات and takes the article ال attached.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara loves cats, but has no pet
    gloss: Sara loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf asks about a pet
    gloss: 'Yusuf: Do you have a pet, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla has a dog
    gloss: 'Layla: Yes, I have a dog.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf asks what it looks like
    gloss: 'Yusuf: What does he look like?'
    note: كيف يبدو؟ (kayfa yabdū?) asks what he looks like. يبدو (yabdū) is masculine because كلب, dog, is a masculine noun.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla describes her dog
    gloss: 'Layla: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Pronouns for animals
    gloss: 'Every animal word is masculine or feminine: the dog is هو (huwa, he) and the cat is هي (hiya, she). The ending ه in أطعمه (uṭʿimuhu) means him or it.'
    note: A masculine animal word like كلب takes masculine pronouns and adjectives; a feminine one like قطة takes feminine ones.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf asks about walks
    gloss: 'Yusuf: Do you walk him every day?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla describes her routine
    gloss: 'Layla: Yes, I walk him every day and I feed him.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara, and Karim on animals
    gloss: 'Yusuf and Sara both love animals, but neither of them has a pet. Yusuf loves dogs and Sara loves cats. Karim does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      يحبان: love
      كلاهما: both
      الحيوانات: animals
      منهما: of them (neither of them)
      أليف: pet (lit. tame)
      الكلاب: dogs
      القطط: cats
      قطة: cat
      يلعب: plays
      ويعطي: gives
      كل: every
      طعاما: food
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim often plays with his cat
    gloss: Karim often plays with his cat.
    note: 'قطته (qiṭṭatuhu) means his cat: the ending ه (hu) means his, and the ة of قطة becomes ت before it.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla asks Nour
    gloss: 'Layla: Nour, do you have a pet too?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour has a bird named Pico
    gloss: 'Nour: Yes, I have a bird. His name is Pico.'
    note: اسمه (ismuhu) means his name; the ه at the end means his. بيكو (bīkū) is the bird's name.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reacts
    gloss: 'Yusuf: How nice! What do you do with him every day?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour feeds him every day
    gloss: 'Nour: I feed him every day.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Yusuf loves birds too
    gloss: 'Yusuf: I love birds too.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla closes the conversation
    gloss: 'Layla: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
