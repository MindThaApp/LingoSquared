  ar.b1.unit36.lesson03.exercise06.write_full_obligation_contrast:
    instruction: "As Layla, write a two-sentence message: say you must bring all the papers tomorrow (using يجب أن), then say you should have brought the papers yesterday (using كان يجب أن)."
    accepted_answers:
