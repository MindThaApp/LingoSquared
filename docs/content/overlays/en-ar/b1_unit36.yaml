    correct_option: "She must bring all the papers and her passport tomorrow, and regrets not bringing them yesterday."
    distractors: ["She already brought all the papers yesterday.", "She must not go to the municipality.", "She has no papers to bring."]
    accepted_answers: [{value: "She must bring all the papers and her passport tomorrow, and regrets not bringing them yesterday.", status: correct}]
