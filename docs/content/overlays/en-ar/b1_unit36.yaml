  ar.b1.unit36.lesson01.exercise03.listen_select_present_obligation:
    instruction: "Listen and select what the speaker must do."
    correct_option: "She must go to the municipality tomorrow."
    distractors: ["She went to the municipality yesterday.", "She wants to go to the municipality.", "She must not go to the municipality."]
    accepted_answers: [{value: "She must go to the municipality tomorrow.", status: correct}]
    feedback: "You heard *يجب أن أذهب إلى البلدية غدا*."
  ar.b1.unit36.lesson01.exercise04.match_present_obligation:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"يجب أن أذهب": "I must go", البلدية: "the municipality", غدا: tomorrow, "يجب أن تحضري": "you must bring", "كل الأوراق": "all the papers", "من فضلك": please}
        status: correct
    feedback: "These phrases cover the present-obligation construction."
  ar.b1.unit36.lesson01.exercise05.order_present_obligation:
    instruction: "Arrange the Arabic words for I must go to the municipality tomorrow."
    accepted_answers: [{value: [يجب, أن, أذهب, إلى, البلدية, غدا], status: correct}]
    feedback: "*يجب أن أذهب إلى البلدية غدا* states present obligation with a conjugated subordinate verb."
  ar.b1.unit36.lesson01.exercise06.write_present_obligation:
    instruction: "Write exactly this present-obligation sentence with the fixed modal يجب أن + a conjugated subordinate verb: I must go to the municipality tomorrow."
    accepted_answers:
      - {value: "يجب أن أذهب إلى البلدية غدا", status: correct}
      - {value: "يجب أن أذهب إلى البلدية غدا.", status: correct}
    feedback: "*يجب أن أذهب إلى البلدية غدا.* is the requested present-obligation sentence."
  ar.b1.unit36.lesson02.exercise01.recognize_yajib_alla:
    instruction: "Select the meaning."
    correct_option: "you must not forget"
    distractors: ["you don't need to forget", "you forgot", "you can't forget"]
    accepted_answers: [{value: "you must not forget", status: correct}]
    feedback: "*يجب ألا تنسي* negates the fixed modal for prohibition."
  ar.b1.unit36.lesson02.exercise02.recognize_kana_yajib:
    instruction: "Select the meaning."
    correct_option: "I should have brought (past regret)"
    distractors: ["I must bring (present obligation)", "I will bring", "I want to bring"]
    accepted_answers: [{value: "I should have brought (past regret)", status: correct}]
    feedback: "*كان يجب أن أحضر* expresses past regret about an unfulfilled obligation."
  ar.b1.unit36.lesson02.exercise03.listen_select_past_regret:
