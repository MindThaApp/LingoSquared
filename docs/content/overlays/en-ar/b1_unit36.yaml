    instruction: "Write exactly this past-regret sentence with كان يجب أن + a conjugated subordinate verb: I should have brought the papers yesterday."
    accepted_answers:
      - {value: "كان يجب أن أحضر الأوراق أمس", status: correct}
      - {value: "كان يجب أن أحضر الأوراق أمس.", status: correct}
