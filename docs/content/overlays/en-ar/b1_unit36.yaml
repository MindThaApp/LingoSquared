    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"يجب أن تحضري كل الأوراق.": "You must bring all the papers.", "يجب أن أذهب إلى البلدية غدا": "I must go to the municipality tomorrow", "يجب ألا تنسي جواز سفرك أيضا.": "You must not forget your passport too.", "كان يجب أن أحضر الأوراق أمس": "I should have brought the papers yesterday", "لكن نسيت": "but I forgot", حسنا: "OK"}
        status: correct
    feedback: "These lines cover the present obligation, the prohibition, and the past regret."
  ar.b1.unit36.lesson03.exercise04.order_prohibition_line:
    instruction: "Arrange the Arabic words for You must not forget your passport too."
    accepted_answers: [{value: [يجب, ألا, تنسي, جواز, سفرك, أيضا], status: correct}]
    feedback: "*يجب ألا تنسي جواز سفرك أيضا.* is the clerk's prohibition."
