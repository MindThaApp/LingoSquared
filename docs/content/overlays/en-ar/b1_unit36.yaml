    accepted_answers: [{value: "She should have brought the papers yesterday, but didn't.", status: correct}]
    feedback: "You heard *كان يجب أن أحضر الأوراق أمس*."
  ar.b1.unit36.lesson02.exercise04.match_prohibition_and_regret:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"يجب ألا تنسي": "you must not forget", "جواز سفرك": "your passport", "كان يجب أن أحضر": "I should have brought", الأوراق: "the papers", أمس: yesterday, تنسي: "(you) forget"}
        status: correct
    feedback: "These phrases cover the prohibition and the past-regret construction."
