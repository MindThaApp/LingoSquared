      - {value: "يجب أن أحضر كل الأوراق غدا، كان يجب أن أحضر الأوراق أمس.", status: correct}
      - {value: "يجب أن أحضر كل الأوراق غدا. كان يجب أن أحضر كل الأوراق أمس.", status: correct}
      - {value: "يجب أن أحضر كل الأوراق غدا، كان يجب أن أحضر كل الأوراق أمس.", status: correct}
    feedback: "*يجب أن أحضر كل الأوراق غدا. كان يجب أن أحضر الأوراق أمس.* contrasts present obligation with past regret, as required."
