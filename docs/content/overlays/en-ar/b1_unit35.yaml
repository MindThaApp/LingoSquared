  ar.b1.unit35.lesson01.qudra_hadera: {title: "I can (say)..."}
  ar.b1.unit35.lesson02.qudra_madiya: {title: "I could / I couldn't (say)..."}
  ar.b1.unit35.lesson03.hiwar_taqrir: {title: "Dialogue: the report"}
teaching:
  ar.b1.unit35.lesson01.teach.ahlan_refresher: {title: "Hello, Layla", gloss: "Hello, Layla.", note: "*أهلا* means hello -- a refresher from earlier units.", example_gloss: "Yusuf said: Hello, Layla."}
  ar.b1.unit35.lesson01.teach.report: {title: "The report", gloss: "the report", note: "*التقرير* means the report.", example_gloss: "I can write the report today."}
  ar.b1.unit35.lesson01.teach.astatee_an: {title: "I can write the report today", gloss: "I can write the report today.", note: "*أستطيع أن* + a subjunctive verb (not a bare modal) expresses present ability.", example_gloss: "Yusuf said: I can write the report today."}
  ar.b1.unit35.lesson01.teach.la_astatee: {title: "I can't write the report today", gloss: "I can't write the report today.", note: "*لا* negates the modal for present inability.", example_gloss: "Yusuf said: I can't write the report today."}
  ar.b1.unit35.lesson01.teach.hal_tastatee: {title: "Can you write the report tomorrow?", gloss: "Can you write the report tomorrow?", note: "*هل تستطيع أن* asks about someone else's present ability.", example_gloss: "Layla said: Can you write the report tomorrow?"}
  ar.b1.unit35.lesson02.teach.istataatu: {title: "I was able to write the report yesterday", gloss: "I was able to write the report yesterday.", note: "*استطعت أن* is the past-ability form of the same modal-plus-embedded-clause construction.", example_gloss: "Yusuf said: I was able to write the report yesterday."}
  ar.b1.unit35.lesson02.teach.lam_astatee: {title: "I was not able to write the report yesterday", gloss: "I was not able to write the report yesterday.", note: "*لم أستطع أن* negates the past-ability form.", example_gloss: "Yusuf said: I was not able to write the report yesterday."}
  ar.b1.unit35.lesson02.teach.law_ittasalti: {title: "If you had called me, I could have helped you", gloss: "If you had called me, I could have helped you.", note: "*لو...لاستطعت أن* expresses hypothetical ability -- a light preview of the full لو-contrast taught in the next unit.", example_gloss: "Yusuf said: If you had called me, I could have helped you."}
  ar.b1.unit35.lesson03.teach.layla_ask_today: {title: "Layla asks about today", gloss: "Layla asks: Can you write the report today?", note: "This opens the dialogue.", example_gloss: "Can you write the report today?"}
  ar.b1.unit35.lesson03.teach.yusuf_contrast: {title: "Yusuf contrasts today and tomorrow", gloss: "Yusuf says he can't write it today, but he can write it tomorrow.", note: "This contrasts present inability with present ability.", example_gloss: "I can't write it today, but I can write it tomorrow."}
  ar.b1.unit35.lesson03.teach.layla_ask_yesterday: {title: "Layla asks about yesterday", gloss: "Layla asks: Were you able to write part of it yesterday?", note: "This shifts to the past-ability question.", example_gloss: "Were you able to write part of it yesterday?"}
  ar.b1.unit35.lesson03.teach.yusuf_past_and_gap: {title: "Yusuf answers about yesterday", gloss: "Yusuf says: Yes, I was able to write part of it yesterday. But I could not finish it.", note: "This gives the past-ability answer plus a gap.", example_gloss: "Yes, I was able to write part of it yesterday. But I could not finish it."}
exercises:
  ar.b1.unit35.lesson01.exercise01.recognize_astatee:
    instruction: "Select the meaning."
    correct_option: "I can write"
    distractors: ["I wrote", "I want to write", "I will write"]
    accepted_answers: [{value: "I can write", status: correct}]
    feedback: "*أستطيع أن أكتب* means I can write, using the modal-plus-subjunctive construction."
  ar.b1.unit35.lesson01.exercise02.recognize_hal_tastatee:
    instruction: "Select the meaning."
    correct_option: "Can you write the report tomorrow?"
    distractors: ["Did you write the report yesterday?", "Do you want to write the report?", "Will you write the report?"]
    accepted_answers: [{value: "Can you write the report tomorrow?", status: correct}]
    feedback: "*هل تستطيع أن تكتب التقرير غدا؟* asks about present ability."
  ar.b1.unit35.lesson01.exercise03.listen_select_present_ability:
    instruction: "Listen and select what the speaker can do."
    correct_option: "He can write the report today."
    distractors: ["He wrote the report yesterday.", "He will write the report next week.", "He can't write the report."]
    accepted_answers: [{value: "He can write the report today.", status: correct}]
    feedback: "You heard *أستطيع أن أكتب التقرير اليوم*."
  ar.b1.unit35.lesson01.exercise04.match_present_ability:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"أستطيع أن أكتب": "I can write", التقرير: "the report", اليوم: today, "لا أستطيع أن": "I can't", "هل تستطيع أن تكتب...؟": "Can you write...?", غدا: tomorrow}
        status: correct
    feedback: "These phrases cover the present-ability construction and its negation."
  ar.b1.unit35.lesson01.exercise05.order_present_ability:
    instruction: "Arrange the Arabic words for I can write the report today."
    accepted_answers: [{value: [أستطيع, أن, أكتب, التقرير, اليوم], status: correct}]
    feedback: "*أستطيع أن أكتب التقرير اليوم* states present ability with an embedded أن-clause."
  ar.b1.unit35.lesson01.exercise06.write_present_ability:
    instruction: "Write exactly this present-ability sentence with أن + subjunctive: I can write the report today."
    accepted_answers:
      - {value: "أستطيع أن أكتب التقرير اليوم", status: correct}
      - {value: "أستطيع أن أكتب التقرير اليوم.", status: correct}
    feedback: "*أستطيع أن أكتب التقرير اليوم.* is the requested present-ability sentence."
  ar.b1.unit35.lesson02.exercise01.recognize_istataatu:
    instruction: "Select the meaning."
    correct_option: "I was able to write (past ability)"
    distractors: ["I can write (present ability)", "I will be able to write", "I want to write"]
    accepted_answers: [{value: "I was able to write (past ability)", status: correct}]
    feedback: "*استطعت أن أكتب* means I was able to write, using the past-ability form."
  ar.b1.unit35.lesson02.exercise02.recognize_lam_astatee:
    instruction: "Select the meaning."
    correct_option: "I was not able to write / I could not write"
    distractors: ["I don't want to write", "I will not write", "I am not able to write (now)"]
    accepted_answers: [{value: "I was not able to write / I could not write", status: correct}]
    feedback: "*لم أستطع أن أكتب* negates the past-ability form."
  ar.b1.unit35.lesson02.exercise03.listen_select_past_ability:
    instruction: "Listen and select what happened."
    correct_option: "He was not able to write the report yesterday."
    distractors: ["He is not able to write the report today.", "He wrote the report yesterday.", "He will not be able to write the report tomorrow."]
    accepted_answers: [{value: "He was not able to write the report yesterday.", status: correct}]
    feedback: "You heard *لم أستطع أن أكتب التقرير أمس*."
  ar.b1.unit35.lesson02.exercise04.match_past_hypothetical_ability:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"استطعت أن أكتب": "I was able to write", أمس: yesterday, "لم أستطع أن": "I could not", "لو اتصلت بي": "If you had called me", "لاستطعت أن أساعدك": "I could have helped you", بي: me}
        status: correct
    feedback: "These phrases cover past ability, its negation, and a hypothetical-ability preview."
  ar.b1.unit35.lesson02.exercise05.order_past_ability:
    instruction: "Arrange the Arabic words for I was not able to write the report yesterday."
    accepted_answers: [{value: [لم, أستطع, أن, أكتب, التقرير, أمس], status: correct}]
    feedback: "*لم أستطع أن أكتب التقرير أمس* negates past ability with an embedded أن-clause."
  ar.b1.unit35.lesson02.exercise06.write_past_ability:
    instruction: "Write exactly this past-ability sentence with أن + subjunctive: I was not able to write the report yesterday."
    accepted_answers:
      - {value: "لم أستطع أن أكتب التقرير أمس", status: correct}
      - {value: "لم أستطع أن أكتب التقرير أمس.", status: correct}
    feedback: "*لم أستطع أن أكتب التقرير أمس.* is the requested past-ability sentence."
  ar.b1.unit35.lesson03.exercise01.choose_embedded_ability:
    instruction: "Which answer states a present ability with an embedded أن-clause?"
    correct_option: "أستطيع أن أكتبه غدا"
    distractors: ["كتبته أمس", "سأكتبه ربما", "أريد أن أكتبه"]
    accepted_answers: [{value: "أستطيع أن أكتبه غدا", status: correct}]
    feedback: "*أستطيع أن أكتبه غدا* uses the modal-plus-subjunctive-embedded-clause construction for present ability."
  ar.b1.unit35.lesson03.exercise02.dialogue_comprehension_ability:
    instruction: "Listen to the dialogue and answer."
    correct_option: "He could write part of it yesterday but couldn't finish it, and he can finish it tomorrow."
    distractors: ["He finished the whole report yesterday.", "He can't write the report at all.", "He wrote the report today already."]
    accepted_answers: [{value: "He could write part of it yesterday but couldn't finish it, and he can finish it tomorrow.", status: correct}]
    feedback: "Yusuf contrasts today's inability, tomorrow's ability, and yesterday's partial past ability."
  ar.b1.unit35.lesson03.exercise03.match_dialogue_ability:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"هل تستطيع أن تكتب التقرير اليوم؟": "Can you write the report today?", "لا أستطيع أن أكتبه اليوم": "I can't write it today", "أستطيع أن أكتبه غدا": "I can write it tomorrow", "هل استطعت أن تكتب جزءا منه أمس؟": "Were you able to write part of it yesterday?", "استطعت أن أكتب جزءا منه": "I was able to write part of it", "لم أستطع أن أنهيه": "I could not finish it"}
        status: correct
    feedback: "These lines cover the present/tomorrow ability contrast and the past-ability report."
  ar.b1.unit35.lesson03.exercise04.order_could_not_finish:
    instruction: "Arrange the Arabic words for But I could not finish it."
    accepted_answers: [{value: [لكن, لم, أستطع, أن, أنهيه], status: correct}]
    feedback: "*لكن لم أستطع أن أنهيه* negates past ability for the finishing action."
  ar.b1.unit35.lesson03.exercise05.reply_present_ability:
    instruction: "Layla asks: Can you write the report today? Reply as Yusuf, contrasting today with tomorrow."
    accepted_answers:
      - {value: "لا أستطيع أن أكتبه اليوم لكن أستطيع أن أكتبه غدا", status: correct}
      - {value: "لا أستطيع أن أكتبه اليوم، لكن أستطيع أن أكتبه غدا.", status: correct}
    feedback: "*لا أستطيع أن أكتبه اليوم، لكن أستطيع أن أكتبه غدا.* is Yusuf's reply."
  ar.b1.unit35.lesson03.exercise06.write_full_ability_contrast:
    instruction: "As Yusuf, write a two-sentence message to Layla: say you can write the report tomorrow (using أستطيع أن), then say you were not able to finish it yesterday (using لم أستطع أن)."
    accepted_answers:
      - {value: "أستطيع أن أكتب التقرير غدا. لم أستطع أن أنهيه أمس.", status: correct}
      - {value: "أستطيع أن أكتب التقرير غدا، لم أستطع أن أنهيه أمس.", status: correct}
    feedback: "*أستطيع أن أكتب التقرير غدا. لم أستطع أن أنهيه أمس.* contrasts present ability with past inability, as required."
