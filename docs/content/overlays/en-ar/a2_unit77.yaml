review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay. Characters Layla and Yusuf (canon). Every exercise token is introduced earlier in the unit. Dialogue audio and dialogue cards correspond one-for-one. Fully vocalised MSA without case endings; the subjunctive after an keeps the fatha, and for a woman the verb ends in -i. Masculine and feminine you differ in the verb ending, so feminine variants are accepted. OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit77.yanbaghi_an: {"title": "You should sleep", "description": "Give and respond to simple advice about health, study and money, with yanbaghi an, ansahuka bi and min al-afdal an."}
lessons:
  ar.a2.unit77.yanbaghi_an.lesson01.yanbaghi_an: {"title": "You should"}
  ar.a2.unit77.yanbaghi_an.lesson02.ansahuka_bi: {"title": "I advise you"}
  ar.a2.unit77.yanbaghi_an.lesson03.min_alafdal: {"title": "It is better to"}
  ar.a2.unit77.yanbaghi_an.lesson04.problem_advice: {"title": "Problem and advice"}
  ar.a2.unit77.yanbaghi_an.lesson05.reading_yusuf: {"title": "Yusuf's problem"}
  ar.a2.unit77.yanbaghi_an.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit77.yanbaghi_an.lesson01.teach.words: {"title": "Problem and advice words", "gloss": "I have / a headache / tired / you sleep / you drink / you rest", "example_gloss": ["I have a headache.", "You should sleep.", "You should drink water."]}
  ar.a2.unit77.yanbaghi_an.lesson01.teach.gn_yanbaghi: {"title": "يَنْبَغِي أَنْ", "gloss": "I am tired. You should sleep.", "note": "*يَنْبَغِي أَنْ* means one should. After *أَنْ* the verb shows who should do it and ends in *-a*."}
  ar.a2.unit77.yanbaghi_an.lesson01.teach.gn_pers: {"title": "Should, for each person", "gloss": "I should sleep. You should sleep. Yusuf should sleep. We should sleep.", "note": "Only the prefix of the second verb changes: *أَنَامَ*, *تَنَامَ*, *يَنَامَ*, *نَنَامَ*. For a woman: *تَنَامِي*."}
  ar.a2.unit77.yanbaghi_an.lesson01.teach.gn_ask: {"title": "Asking for advice", "gloss": "What should I do? What should you do? Should I sleep?", "note": "Ask for advice with *مَاذَا يَنْبَغِي أَنْ أَفْعَلَ؟* or with *هَلْ يَنْبَغِي أَنْ ...؟* for a yes-or-no question."}
  ar.a2.unit77.yanbaghi_an.lesson02.teach.words: {"title": "Things to advise", "gloss": "sleep / rest / exercise / studying / drinking water / every day", "example_gloss": ["I advise you to sleep.", "I advise you to drink water.", "I advise you to study every day.", "I advise you to exercise."]}
  ar.a2.unit77.yanbaghi_an.lesson02.teach.gn_nasaha: {"title": "أَنْصَحُكَ بِـ", "gloss": "I advise you (masc.) to sleep. I advise you (fem.) to rest.", "note": "*أَنْصَحُكَ بِـ* means I advise you, and it is followed by a noun, not a verb. *بِـ* attaches to the noun: *بِالنَّوْم*. To a woman: *أَنْصَحُكِ*."}
  ar.a2.unit77.yanbaghi_an.lesson02.teach.gn_contrast: {"title": "A verb or a noun", "gloss": "You should sleep. I advise you to sleep.", "note": "After *أَنْ* comes a verb; after *بِـ* comes a noun. The advice is the same, the structure is different."}
  ar.a2.unit77.yanbaghi_an.lesson02.teach.gn_ask: {"title": "Asking for advice", "gloss": "What do you advise me?", "note": "*بِمَاذَا* = with what, about what. Use it with *تَنْصَحُنِي* (you advise me)."}
  ar.a2.unit77.yanbaghi_an.lesson03.teach.words: {"title": "Health, money, study", "gloss": "the doctor / the money / you go / you save / you study / in the morning", "example_gloss": ["It is better to go to the doctor.", "It is better to save money.", "It is better to study in the morning."]}
  ar.a2.unit77.yanbaghi_an.lesson03.teach.gn_afdal: {"title": "مِنَ الْأَفْضَل أَنْ", "gloss": "It is better to go to the doctor.", "note": "*مِنَ الْأَفْضَل أَنْ* means it is better to. It is a gentle way to give advice. The verb after *أَنْ* ends in *-a*."}
  ar.a2.unit77.yanbaghi_an.lesson03.teach.gn_three: {"title": "Three ways to say it", "gloss": "You should study. I advise you to study. It is better to study.", "note": "The three patterns give the same advice with different strength: *يَنْبَغِي* is a clear should, *أَنْصَحُكَ* is personal, *مِنَ الْأَفْضَل* is gentle."}
  ar.a2.unit77.yanbaghi_an.lesson03.teach.gn_hal: {"title": "Asking", "gloss": "Is it better for me to go to the doctor?", "note": "Put *هَلْ* in front to turn the sentence into a question."}
  ar.a2.unit77.yanbaghi_an.lesson04.teach.words: {"title": "Problem and reply", "gloss": "problem / advice / a good idea / I will do that / early", "example_gloss": ["I have a problem. I do not sleep well.", "Good idea! I will do that.", "Thank you for your advice."]}
  ar.a2.unit77.yanbaghi_an.lesson04.teach.gn_problem: {"title": "Describing a problem", "gloss": "I have a problem. I do not sleep well.", "note": "Say what the problem is before asking for advice. *جَيِّدًا* means well."}
  ar.a2.unit77.yanbaghi_an.lesson04.teach.gn_advice: {"title": "Giving advice", "gloss": "I advise you to exercise. It is better to sleep early.", "note": "Combine the patterns: a noun after *بِـ* and a verb after *أَنْ*."}
  ar.a2.unit77.yanbaghi_an.lesson04.teach.gn_reply: {"title": "Responding to advice", "gloss": "Good idea! I will do that. Thank you for your advice.", "note": "To respond, say that the idea is good, promise to do it with *سَأَفْعَلُ ذَلِكَ*, and thank the other person. To a woman: *نَصِيحَتِكِ*."}
  ar.a2.unit77.yanbaghi_an.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "every day / she said to me / I said", "example_gloss": ["I am tired every day.", "Layla said thank you to me."]}
  ar.a2.unit77.yanbaghi_an.lesson05.teach.reading: {"title": "Yusuf writes about his problem", "gloss": "I have a problem. I do not sleep well and I am tired every day. Layla said to me: It is better to sleep early, and I advise you to exercise. I said: Good idea, I will do that!", "note": "A problem, two kinds of advice and a reply."}
  ar.a2.unit77.yanbaghi_an.lesson06.teach.d1: {"title": "Layla explains", "gloss": "Layla: I have a problem, Yusuf. I have an exam tomorrow and I have a headache."}
  ar.a2.unit77.yanbaghi_an.lesson06.teach.d2: {"title": "Layla asks for advice", "gloss": "Layla: What should I do?"}
  ar.a2.unit77.yanbaghi_an.lesson06.teach.d3: {"title": "Yusuf advises", "gloss": "Yusuf: You should drink water and sleep now. And it is better to study tomorrow morning."}
  ar.a2.unit77.yanbaghi_an.lesson06.teach.d4: {"title": "Layla thanks him", "gloss": "Layla: Good idea! I will do that. Thank you for your advice."}
  ar.a2.unit77.yanbaghi_an.lesson06.teach.d5: {"title": "Yusuf adds", "gloss": "Yusuf: You're welcome. I also advise you to rest."}
exercises:
