  ar.a2.unit77.yanbaghi_an.lesson01.exercise06.tr_rest: {"instruction": "Translate into Arabic.", "correct_option": "يَنْبَغِي أَنْ تَرْتَاحَ.", "accepted_answers": [{"value": "يَنْبَغِي أَنْ تَرْتَاحَ.", "status": "correct"}, {"value": "يَنْبَغِي أَنْ تَرْتَاحَ", "status": "correct"}, {"value": "يَنْبَغِي أَنْ تَرْتَاحِي.", "status": "correct"}, {"value": "يَنْبَغِي أَنْ تَرْتَاحِي", "status": "correct"}], "feedback": "*تَرْتَاحَ* = you rest."}
