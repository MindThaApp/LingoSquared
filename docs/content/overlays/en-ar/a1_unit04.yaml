  status: reviewed
  required_next_reviewer: native_speaker_review
  notes: >-
    Paired with ar a1_unit04_dates. All teaching entries include example
    glosses for schema_version 1.1 authoring.
    Review 2026-10-19: 3 fixes - five example_glosses omitted the قالت/قال ليلى/يوسف frame present in the Arabic example (ma_tareekh, line01-04); may/june notes now give the Levantine/Iraqi names أيار/حزيران and the translation/writing exercises accept them; reply_with_date accepts the short الخامس من مايو with a note. NATIVE FLAGS: none.

course:
  title: Arabic A1
  description: >-
    Beginner Modern Standard Arabic (fusha) for everyday exchanges.

units:
  ar.a1.unit04.dates:
    title: "Dates"

lessons:
  ar.a1.unit04.lesson01.date_words: {title: "Today's date"}
  ar.a1.unit04.lesson02.state_dates: {title: "The fifth of May"}

teaching:
  ar.a1.unit04.lesson01.teach.tareekh:
    title: "Date"
    gloss: "date"
    note: "تاريخ means a calendar date in this question."
    example_gloss: "What is today's date?"
  ar.a1.unit04.lesson01.teach.al_yawm:
    title: "Today"
    gloss: "today"
    note: "اليوم is used both as 'today' and 'the day' depending on context."
    example_gloss: "What is today's date?"
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: "What is today's date?"
    gloss: "What is today's date?"
    note: "Arabic keeps the question word ما before the noun phrase تاريخ اليوم."
    example_gloss: "Layla said: What is today's date?"
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: "Of May"
    gloss: "of May"
    note: "Dates use من before the month: الخامس من مايو."
    example_gloss: "Today is the fifth of May."
  ar.a1.unit04.lesson01.teach.may:
    title: "May"
    gloss: "May"
    note: "مايو (māyū) is the name for May used in Egypt and much of the Arab world; in Lebanon, Syria, Jordan and Iraq the same month is called أيار (ayyār)."
    example_gloss: "Today is the fifth of May."
  ar.a1.unit04.lesson01.teach.june:
    title: "June"
    gloss: "June"
    note: "يونيو (yūnyū) is the name for June used in Egypt and much of the Arab world; in Lebanon, Syria, Jordan and Iraq the same month is called حزيران (ḥazīrān)."
    example_gloss: "Today is the sixth of June."
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: "The fifth"
    gloss: "the fifth"
    note: "الخامس is the ordinal form used for day 5 in this simple date."
    example_gloss: "Today is the fifth of May."
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: "The sixth"
    gloss: "the sixth"
    note: "السادس is the ordinal form used for day 6."
    example_gloss: "Today is the sixth of June."
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: "May 5"
    gloss: "the fifth of May"
    note: "Use من, not a direct English-style month-day order."
    example_gloss: "The fifth of May."
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: "June 6"
    gloss: "the sixth of June"
    note: "This gives an unambiguous day-month date."
    example_gloss: "The sixth of June."
  ar.a1.unit04.lesson02.teach.line01:
    title: "Ask the date"
    gloss: "Layla asks today's date."
    note: "ما تاريخ اليوم؟ asks for a calendar date, not the time."
    example_gloss: "Layla said: What is today's date?"
  ar.a1.unit04.lesson02.teach.line02:
    title: "State the date"
    gloss: "Yusuf says it is May 5."
    note: "The answer begins with اليوم."
    example_gloss: "Yusuf said: Today is the fifth of May."
  ar.a1.unit04.lesson02.teach.line03:
    title: "Mention a lesson"
    gloss: "Layla says she has a lesson today."
    note: "عندي means 'I have' and was used earlier with numbers."
    example_gloss: "Layla said: Thanks. I have a lesson today."
  ar.a1.unit04.lesson02.teach.line04:
    title: "Locate the lesson date"
    gloss: "Yusuf states the lesson date."
    note: "في marks when the lesson happens."
    example_gloss: "Yusuf said: The lesson is on the fifth of May."

exercises:
  ar.a1.unit04.lesson01.exercise07.dictation_date_question:
    instruction: "Type what you hear."
    correct_option: "ما تاريخ اليوم"
    accepted_answers: [{value: "ما تاريخ اليوم", status: correct}]
    orthography_strict: true

  ar.a1.unit04.lesson01.exercise01.recognize_date:
    instruction: "Select the meaning."
    correct_option: date
    distractors: [today, name, number]
    accepted_answers: [{value: date, status: correct}]
    feedback: "تاريخ means date."
  ar.a1.unit04.lesson01.exercise02.listen_date_question:
    instruction: "Listen and select what you hear."
    correct_option: "What is today's date?"
    distractors: ["What is your name?", "How much is this?", "Where are you from?"]
    accepted_answers: [{value: "What is today's date?", status: correct}]
    feedback: "You heard ما تاريخ اليوم؟"
  ar.a1.unit04.lesson01.exercise03.match_date_words:
    instruction: "Match each Arabic word with its meaning."
    accepted_answers:
      - value: {تاريخ: date, اليوم: today, مايو: May, يونيو: June}
        status: correct
    feedback: "These words let you ask and answer a simple date question."
  ar.a1.unit04.lesson01.exercise04.order_date_question:
    instruction: "Arrange the words to ask What is today's date?"
    accepted_answers: [{value: [ما, تاريخ, اليوم], status: correct}]
    feedback: "ما تاريخ اليوم؟ asks today's date."
  ar.a1.unit04.lesson01.exercise05.translate_today_may:
    instruction: "Translate into Arabic: May."
    accepted_answers:
      - {value: "مايو", status: correct}
      - {value: "مايو.", status: correct}
      - {value: "أيار", status: correct}
    feedback: "مايو means May."
  ar.a1.unit04.lesson01.exercise06.write_date_question:
    instruction: "Type the Arabic question for What is today's date?"
    accepted_answers:
      - {value: "ما تاريخ اليوم", status: correct}
      - {value: "ما تاريخ اليوم؟", status: correct}
    feedback: "ما تاريخ اليوم؟ is the question."

  ar.a1.unit04.lesson02.exercise01.recognize_fifth:
    instruction: "Select the meaning."
    correct_option: "the fifth"
    distractors: ["the sixth", "today", "May"]
    accepted_answers: [{value: "the fifth", status: correct}]
    feedback: "الخامس means the fifth."
  ar.a1.unit04.lesson02.exercise02.dialogue_date:
    instruction: "What date does Yusuf say?"
    correct_option: "May 5"
    distractors: ["June 6", "May 6", "June 5"]
    accepted_answers: [{value: "May 5", status: correct}]
    feedback: "اليوم الخامس من مايو means today is May 5."
  ar.a1.unit04.lesson02.exercise03.match_dates:
    instruction: "Match each Arabic date with its English date."
    accepted_answers:
      - value: {"الخامس من مايو": "May 5", "السادس من يونيو": "June 6"}
        status: correct
    feedback: "Arabic puts the day before the month with من."
  ar.a1.unit04.lesson02.exercise04.order_fifth_may:
    instruction: "Arrange the Arabic words for May 5."
    accepted_answers: [{value: [الخامس, من, مايو], status: correct}]
    feedback: "الخامس من مايو means May 5."
  ar.a1.unit04.lesson02.exercise05.reply_with_date:
    instruction: "Answer ما تاريخ اليوم؟ with Today is May 5."
    accepted_answers:
      - {value: "اليوم الخامس من مايو", status: correct}
      - {value: "اليوم الخامس من مايو.", status: correct}
      - {value: "الخامس من مايو", status: acceptable_with_note, note: "Correct; the full answer starts with اليوم (today)."}
    feedback: "اليوم الخامس من مايو is a complete date answer."
  ar.a1.unit04.lesson02.exercise06.write_supplied_date:
    instruction: "Type June 6 in Arabic words."
    accepted_answers:
      - {value: "السادس من يونيو", status: correct}
      - {value: "السادس من يونيو.", status: correct}
      - {value: "السادس من حزيران", status: correct}
    feedback: "السادس من يونيو means June 6."
