teaching:
  ar.b1.unit39.lesson01.teach.ana_refresher: {title: "I", gloss: "I", note: "*أنا* means I -- a refresher from earlier units.", example_gloss: "I am an engineer."}
  ar.b1.unit39.lesson01.teach.masul: {title: "Responsible", gloss: "responsible", note: "*مسؤول* means responsible.", example_gloss: "I am responsible for the report."}
  ar.b1.unit39.lesson01.teach.yusuf_responsibility: {title: "Yusuf names his responsibility", gloss: "I am responsible for the report.", note: "This is Yusuf's stated responsibility.", example_gloss: "Yusuf said: I am responsible for the report."}
  ar.b1.unit39.lesson01.teach.hal_anti_masula: {title: "Yusuf asks Layla about responsibility", gloss: "Are you responsible for this too?", note: "*مسؤولة* is the feminine form of responsible, used because Yusuf is addressing Layla.", example_gloss: "Yusuf said: Are you responsible for this too?"}
  ar.b1.unit39.lesson02.teach.intahaytu: {title: "I finished", gloss: "I finished", note: "*انتهيت* means I finished.", example_gloss: "I finished the first part."}
  ar.b1.unit39.lesson02.teach.aljuz_alawwal: {title: "The first part", gloss: "the first part", note: "*الجزء الأول* means the first part.", example_gloss: "I finished the first part of the report."}
  ar.b1.unit39.lesson02.teach.ma_zilt_aamal: {title: "I am still working on", gloss: "I am still working on", note: "*ما زلت أعمل على* means I am still working on.", example_gloss: "I am still working on the second part."}
  ar.b1.unit39.lesson02.teach.aljuz_athani: {title: "The second part", gloss: "the second part", note: "*الجزء الثاني* means the second part.", example_gloss: "I am still working on the second part."}
  ar.b1.unit39.lesson02.teach.yusuf_update: {title: "Yusuf gives a status update", gloss: "I finished the first part of the report. I am still working on the second part.", note: "This is Yusuf's status update.", example_gloss: "Yusuf said: I finished the first part of the report. I am still working on the second part."}
  ar.b1.unit39.lesson03.teach.yumkinuk: {title: "Can you", gloss: "can you", note: "*يمكنك* means can you -- gender-neutral, used to politely ask someone for help.", example_gloss: "Can you help me?"}
  ar.b1.unit39.lesson03.teach.musaadati: {title: "Helping me", gloss: "helping me / help me", note: "*مساعدتي* means helping me.", example_gloss: "Can you help me with the second part?"}
  ar.b1.unit39.lesson03.teach.yusuf_ask_help: {title: "Yusuf asks for help", gloss: "Can you help me with the second part?", note: "This politely asks a colleague for professional help.", example_gloss: "Yusuf said: Can you help me with the second part?"}
  ar.b1.unit39.lesson03.teach.layla_ask_status: {title: "Layla asks for a status update", gloss: "Layla says: Have you finished the report?", note: "This opens the dialogue.", example_gloss: "Have you finished the report?"}
  ar.b1.unit39.lesson03.teach.layla_accept_help: {title: "Layla agrees to help", gloss: "Layla says: Yes, I can help you.", note: "This closes the exchange.", example_gloss: "Yes, I can help you."}
exercises:
  ar.b1.unit39.lesson01.exercise01.recognize_ana_masul:
    instruction: "Select the meaning."
    correct_option: "I am responsible for the report"
    distractors: ["I finished the report", "I wrote the report", "I am reading the report"]
    accepted_answers: [{value: "I am responsible for the report", status: correct}]
    feedback: "*أنا مسؤول عن التقرير* states Yusuf's responsibility."
  ar.b1.unit39.lesson01.exercise02.recognize_hal_anti_masula:
    instruction: "Select the meaning."
    correct_option: "Are you responsible for this too?"
    distractors: ["Am I responsible for this too?", "Are you finished with this too?", "Is he responsible for this too?"]
    accepted_answers: [{value: "Are you responsible for this too?", status: correct}]
    feedback: "*هل أنت مسؤولة عن هذا أيضا؟* asks Layla about her responsibility."
  ar.b1.unit39.lesson01.exercise03.listen_select_responsibility:
    instruction: "Listen and select what Yusuf says."
    correct_option: "I am responsible for the report."
    distractors: ["I finished the report.", "I need help with the report.", "I am responsible for the meeting."]
    accepted_answers: [{value: "I am responsible for the report.", status: correct}]
    feedback: "You heard *أنا مسؤول عن التقرير*."
  ar.b1.unit39.lesson01.exercise04.match_responsibility:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"أنا مسؤول عن": "I am responsible for", التقرير: "the report", "هل أنت مسؤولة عن...؟": "Are you responsible for...?", هذا: "this", أيضا: "also", أنا: "I"}
        status: correct
    feedback: "These phrases cover naming a work responsibility."
  ar.b1.unit39.lesson01.exercise05.order_responsibility:
    instruction: "Arrange the Arabic words for I am responsible for the report."
    accepted_answers: [{value: [أنا, مسؤول, عن, التقرير], status: correct}]
    feedback: "*أنا مسؤول عن التقرير* names the responsibility."
  ar.b1.unit39.lesson01.exercise06.write_responsibility:
    instruction: "As Yusuf, write exactly this sentence naming your work responsibility with أنا مسؤول عن: I am responsible for the report."
    accepted_answers:
      - {value: "أنا مسؤول عن التقرير", status: correct}
      - {value: "أنا مسؤول عن التقرير.", status: correct}
    feedback: "*أنا مسؤول عن التقرير.* is the requested sentence."
  ar.b1.unit39.lesson02.exercise01.recognize_intahaytu:
    instruction: "Select the meaning."
    correct_option: "I finished the first part"
    distractors: ["I am still working on the first part", "I will finish the first part", "I lost the first part"]
    accepted_answers: [{value: "I finished the first part", status: correct}]
    feedback: "*انتهيت من الجزء الأول* reports a completed status."
  ar.b1.unit39.lesson02.exercise02.recognize_ma_zilt:
    instruction: "Select the meaning."
    correct_option: "I am still working on the second part"
    distractors: ["I finished the second part", "I have not started the second part", "I am responsible for the second part"]
    accepted_answers: [{value: "I am still working on the second part", status: correct}]
    feedback: "*ما زلت أعمل على الجزء الثاني* reports an in-progress status."
  ar.b1.unit39.lesson02.exercise03.listen_select_update:
    instruction: "Listen and select what Yusuf says."
    correct_option: "I finished the first part of the report. I am still working on the second part."
    distractors: ["I finished the whole report.", "I have not started the report.", "I am still working on the first part."]
    accepted_answers: [{value: "I finished the first part of the report. I am still working on the second part.", status: correct}]
    feedback: "You heard *انتهيت من الجزء الأول من التقرير. ما زلت أعمل على الجزء الثاني.*"
  ar.b1.unit39.lesson02.exercise04.match_update:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"انتهيت من": "I finished", "الجزء الأول": "the first part", "ما زلت أعمل على": "I am still working on", "الجزء الثاني": "the second part", الأول: first, الثاني: second}
        status: correct
    feedback: "These phrases cover a task status update."
  ar.b1.unit39.lesson02.exercise05.order_update:
    instruction: "Arrange the Arabic words for I am still working on the second part."
    accepted_answers: [{value: [ما, زلت, أعمل, على, الجزء, الثاني], status: correct}]
    feedback: "*ما زلت أعمل على الجزء الثاني* reports the in-progress status."
  ar.b1.unit39.lesson02.exercise06.write_update:
    instruction: "As Yusuf, write exactly this two-sentence status update: I finished the first part of the report. I am still working on the second part."
    accepted_answers:
      - {value: "انتهيت من الجزء الأول من التقرير ما زلت أعمل على الجزء الثاني", status: correct}
      - {value: "انتهيت من الجزء الأول من التقرير. ما زلت أعمل على الجزء الثاني.", status: correct}
    feedback: "*انتهيت من الجزء الأول من التقرير. ما زلت أعمل على الجزء الثاني.* is the requested status update."
  ar.b1.unit39.lesson03.exercise01.choose_help_request:
    instruction: "Which answer politely asks a colleague for professional help?"
    correct_option: "هل يمكنك مساعدتي في الجزء الثاني؟"
    distractors: ["أنا مسؤول عن الجزء الثاني", "ما زلت أعمل على الجزء الثاني", "انتهيت من الجزء الثاني"]
    accepted_answers: [{value: "هل يمكنك مساعدتي في الجزء الثاني؟", status: correct}]
    feedback: "*هل يمكنك مساعدتي في الجزء الثاني؟* politely asks for help."
  ar.b1.unit39.lesson03.exercise02.dialogue_comprehension_workplace:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf is responsible for the report, has finished part one, and asks Layla to help with part two."
    distractors: ["Yusuf has finished the whole report alone.", "Layla is responsible for the report.", "Yusuf refuses Layla's help."]
    accepted_answers: [{value: "Yusuf is responsible for the report, has finished part one, and asks Layla to help with part two.", status: correct}]
    feedback: "Yusuf names his responsibility, gives a status update, and asks Layla for help; she agrees."
  ar.b1.unit39.lesson03.exercise03.match_dialogue_workplace:
    instruction: "Match each Arabic sentence with its meaning."
    accepted_answers:
      - value: {"أنا مسؤول عن التقرير.": "I am responsible for the report.", "هل انتهيت من التقرير؟": "Have you finished the report?", "انتهيت من الجزء الأول": "I finished the first part", "ما زلت أعمل على الجزء الثاني": "I am still working on the second part", "هل يمكنك مساعدتي؟": "Can you help me?", "نعم، أستطيع أن أساعدك.": "Yes, I can help you."}
        status: correct
    feedback: "These lines cover the full workplace exchange."
  ar.b1.unit39.lesson03.exercise04.order_help_request:
    instruction: "Arrange the Arabic words for Can you help me with the second part?"
    accepted_answers: [{value: [هل, يمكنك, مساعدتي, في, الجزء, الثاني], status: correct}]
    feedback: "*هل يمكنك مساعدتي في الجزء الثاني؟* asks for help with the second part."
  ar.b1.unit39.lesson03.exercise05.reply_accept_help:
    instruction: "Yusuf asks: Can you help me with the second part? Reply as Layla, agreeing to help."
    accepted_answers:
      - {value: "نعم أستطيع أن أساعدك", status: correct}
      - {value: "نعم، أستطيع أن أساعدك.", status: correct}
    feedback: "*نعم، أستطيع أن أساعدك.* is Layla's reply."
  ar.b1.unit39.lesson03.exercise06.write_full_workplace_update:
    instruction: "As Yusuf, write a professional message to Layla: say you are responsible for the report, give a status update (you finished the first part, you are still working on the second part), and ask her if she can help you with the second part."
    accepted_answers:
      - {value: "أنا مسؤول عن التقرير. انتهيت من الجزء الأول من التقرير. ما زلت أعمل على الجزء الثاني. هل يمكنك مساعدتي في الجزء الثاني؟", status: correct}
      - {value: "أنا مسؤول عن التقرير انتهيت من الجزء الأول من التقرير ما زلت أعمل على الجزء الثاني هل يمكنك مساعدتي في الجزء الثاني", status: correct}
    feedback: "*أنا مسؤول عن التقرير. انتهيت من الجزء الأول من التقرير. ما زلت أعمل على الجزء الثاني. هل يمكنك مساعدتي في الجزء الثاني؟* names the responsibility, gives the status update, and asks for help, as required."
