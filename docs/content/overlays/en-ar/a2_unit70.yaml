  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise06.dictation_waiting: {"instruction": "Type what you hear.", "correct_response": "أَمْس كُنْتُ أَنْتَظِرُ الْحَافِلَة فِي الشَّارِع.", "orthography_strict": true, "feedback": "You heard *أَمْس كُنْتُ أَنْتَظِرُ الْحَافِلَة فِي الشَّارِع.*"}
  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise07.dictation_rain: {"instruction": "Type what you hear.", "correct_response": "كَانَ الْجَوّ بَارِدًا وَكَانَ الْمَطَر يَنْزِلُ.", "orthography_strict": true, "feedback": "You heard *كَانَ الْجَوّ بَارِدًا وَكَانَ الْمَطَر يَنْزِلُ.*"}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise01.listen_open: {"instruction": "Listen and select Yusuf's opening question.", "correct_option": "مَاذَا كُنْتِ تَفْعَلِينَ أَمْس عِنْدَمَا رَنَّ الْهَاتِف؟", "distractors": ["مَاذَا كُنْتِ تَقْرَئِينَ أَمْس عِنْدَمَا رَنَّ الْهَاتِف؟", "مَاذَا كُنْتِ تَفْعَلِينَ أَمْس عِنْدَمَا بَدَأَ الْمَطَر؟", "مَاذَا كُنْتِ تَفْعَلِينَ أَمْس عِنْدَمَا وَصَلَتِ الْحَافِلَة؟"], "accepted_answers": [{"value": "مَاذَا كُنْتِ تَفْعَلِينَ أَمْس عِنْدَمَا رَنَّ الْهَاتِف؟", "status": "correct"}], "feedback": "Yusuf asks what Layla was doing."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise02.comprehend_cooking: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "He was cooking.", "distractors": ["He was reading.", "He was waiting for the bus.", "He was walking."], "accepted_answers": [{"value": "He was cooking.", "status": "correct"}], "feedback": "Yusuf says: *وَأَنَا كُنْتُ أَطْبُخُ فِي الْبَيْت.*"}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise03.match_dialogue: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "مَاذَا كُنْتِ تَفْعَلِينَ؟", "right": "What were you doing?"}, {"left": "كُنْتُ أَنْتَظِرُ الْحَافِلَة.", "right": "I was waiting for the bus."}, {"left": "وَكُنْتِ تَقْرَئِينَ؟", "right": "And were you reading?"}, {"left": "رَنَّ الْهَاتِف.", "right": "The phone rang."}, {"left": "كُنْتُ أَطْبُخُ.", "right": "I was cooking."}, {"left": "وَصَلَتِ الْحَافِلَة.", "right": "The bus arrived."}], "status": "correct"}], "feedback": "Progressive questions and answers."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise04.order_cooking_home: {"instruction": "Put the words in order to say 'And I was cooking at home.'", "correct_option": "وَأَنَا كُنْتُ أَطْبُخُ فِي الْبَيْت", "accepted_answers": [{"value": "وَأَنَا كُنْتُ أَطْبُخُ فِي الْبَيْت", "status": "correct"}], "feedback": "Pronoun, *كُنْتُ*, verb, place."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise05.respond_what_doing: {"instruction": "Answer in Arabic: say you were waiting for the bus when the phone rang.", "correct_option": "كُنْتُ أَنْتَظِرُ الْحَافِلَة عِنْدَمَا رَنَّ الْهَاتِف.", "accepted_answers": [{"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة عِنْدَمَا رَنَّ الْهَاتِف.", "status": "correct"}, {"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة عِنْدَمَا رَنَّ الْهَاتِف", "status": "correct"}, {"value": "عِنْدَمَا رَنَّ الْهَاتِف كُنْتُ أَنْتَظِرُ الْحَافِلَة.", "status": "correct"}, {"value": "عِنْدَمَا رَنَّ الْهَاتِف كُنْتُ أَنْتَظِرُ الْحَافِلَة", "status": "correct"}], "feedback": "Background with *كُنْتُ*, event with the simple past."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise06.translate_reading_message: {"instruction": "Translate into Arabic.", "correct_option": "بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة، رَنَّ الْهَاتِف.", "accepted_answers": [{"value": "بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة، رَنَّ الْهَاتِف.", "status": "correct"}, {"value": "بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة، رَنَّ الْهَاتِف", "status": "correct"}, {"value": "رَنَّ الْهَاتِف بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة.", "status": "correct"}, {"value": "رَنَّ الْهَاتِف بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة", "status": "correct"}], "feedback": "Progressive plus simple past."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.exercise07.write_three: {"instruction": "Write exactly three Arabic sentences, following the numbered requirements in the prompt.", "correct_option": "كُنْتُ أَنْتَظِرُ الْحَافِلَة. كَانَ الْمَطَر يَنْزِلُ. رَنَّ الْهَاتِف.", "accepted_answers": [{"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة. كَانَ الْمَطَر يَنْزِلُ. رَنَّ الْهَاتِف.", "status": "correct"}, {"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة. كَانَ الْمَطَر يَنْزِلُ. رَنَّ الْهَاتِف", "status": "correct"}], "feedback": "Two progressive sentences and one event."}
