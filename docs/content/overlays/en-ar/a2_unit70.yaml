review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the was-happening unit (kana plus present tense as a progressive, indama and baynama, weather and traffic as background). OPEN NATIVE QUESTIONS: see the realization."}
course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit70.madha_kana_yahduth: {"title": "What was happening?", "description": "Say what was going on when something else happened, using kana plus the present-tense verb for the background and the simple past for the event, with the linking words when and while."}
lessons:
  ar.a2.unit70.madha_kana_yahduth.lesson01.kuntu_antazir: {"title": "I was waiting"}
  ar.a2.unit70.madha_kana_yahduth.lesson02.indama: {"title": "When"}
  ar.a2.unit70.madha_kana_yahduth.lesson03.baynama: {"title": "While"}
  ar.a2.unit70.madha_kana_yahduth.lesson04.weather_traffic: {"title": "The weather and the street"}
  ar.a2.unit70.madha_kana_yahduth.lesson05.reading_layla: {"title": "Yesterday in the street"}
  ar.a2.unit70.madha_kana_yahduth.lesson06.dialogue: {"title": "Yusuf and Layla"}
teaching:
  ar.a2.unit70.madha_kana_yahduth.lesson01.teach.things: {"title": "Things around us", "gloss": "the rain / the street / the phone / the bus", "example_gloss": ["The rain was falling in the street.", "I was waiting for the bus."]}
  ar.a2.unit70.madha_kana_yahduth.lesson01.teach.verbs: {"title": "Present-tense verbs: I", "gloss": "I wait / I walk / I read / I cook", "example_gloss": ["I was walking in the street.", "I was reading a message.", "I was cooking."]}
  ar.a2.unit70.madha_kana_yahduth.lesson01.teach.gn_prog: {"title": "كَانَ + present tense: was doing", "gloss": "I was waiting, you (masc.) were waiting, you (fem.) were waiting, he was waiting, she was waiting, we were waiting, they were waiting", "note": "The same pattern as the past habit: *كَانَ* in the right person plus the present-tense verb in the same person."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.teach.gn_meaning: {"title": "Habit or action in progress?", "gloss": "Yusuf was reading the book. Yusuf was cooking.", "note": "With a single moment in the past (yesterday at five), *كَانَ* + present tense means 'was doing'. With words like 'every day' it means 'used to'."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.teach.events: {"title": "Things that happened", "gloss": "it began / it rang / it fell / it arrived (fem.)", "example_gloss": ["The rain began.", "The phone rang.", "The book fell.", "The bus arrived."]}
  ar.a2.unit70.madha_kana_yahduth.lesson02.teach.when: {"title": "Linking words", "gloss": "when / suddenly / yesterday", "example_gloss": ["I was waiting for the bus when the rain began.", "Suddenly the phone rang.", "Yesterday I was reading."]}
  ar.a2.unit70.madha_kana_yahduth.lesson02.teach.gn_indama: {"title": "Background and event", "gloss": "I was reading when the phone rang. When the phone rang I was reading.", "note": "The longer action in the background is *كَانَ* + present tense; the short event that interrupts it is the simple past, right after *عِنْدَمَا*. The two clauses can swap places."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.teach.gn_which: {"title": "Which tense for which part", "gloss": "When the book fell, Yusuf was walking.", "note": "Ask yourself which action lasts (progressive) and which one happens at a point in time (simple past)."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.teach.while: {"title": "While", "gloss": "while / together / at the same time", "example_gloss": ["While I was reading, Layla was cooking.", "We were at home together."]}
  ar.a2.unit70.madha_kana_yahduth.lesson03.teach.gn_baynama: {"title": "بَيْنَمَا: two things at once", "gloss": "While I was reading, Layla was cooking. Yusuf was cooking while Layla was reading.", "note": "*بَيْنَمَا* (or *بَيْنَ مَا*) joins two actions that go on at the same time: *كَانَ* + present tense in both clauses."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.teach.gn_baynama_event: {"title": "بَيْنَمَا with a sudden event", "gloss": "While I was walking, the book fell.", "note": "After *بَيْنَمَا* the long action is progressive; the sudden event that follows is in the simple past."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.teach.ph_together: {"title": "A sentence to learn", "gloss": "We were together at the same time."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.teach.weather: {"title": "Weather and traffic", "gloss": "the weather / cold / crowded / the cars", "example_gloss": ["The weather was cold.", "The street was crowded."]}
  ar.a2.unit70.madha_kana_yahduth.lesson04.teach.gn_weather: {"title": "Setting the scene", "gloss": "The weather was cold and the rain was falling.", "note": "Describe the scene with *كَانَ* + describing word, or *كَانَ* + present tense for something in progress. The describing word ends in *-an*."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.teach.gn_not_moving: {"title": "A negative background", "gloss": "The cars were not moving.", "note": "To say something was not going on, put *لَا* before the present-tense verb: *كَانَتْ ... لَا تَتَحَرَّكُ*. A plural of things takes the feminine singular."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.teach.gn_cars: {"title": "Cars waiting", "gloss": "The cars were moving. The cars were not waiting. The weather was cold and the cars were not moving.", "note": "Compare the affirmative and the negative: only *لَا* changes."}
  ar.a2.unit70.madha_kana_yahduth.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "a message / after / ten minutes", "example_gloss": ["The rain began after ten minutes.", "Yusuf was at the station."]}
  ar.a2.unit70.madha_kana_yahduth.lesson05.teach.gn_wa: {"title": "Linking the scene", "gloss": "The rain was falling and the street was crowded.", "note": "Each background description gets its own *كَانَ*."}
  ar.a2.unit70.madha_kana_yahduth.lesson05.teach.reading: {"title": "Layla tells what happened", "gloss": "Yesterday I was waiting for the bus in the street. The weather was cold and the rain was falling. While I was reading a message, the phone rang. It was Yusuf! The bus arrived after ten minutes.", "note": "Background in the progressive (*كُنْتُ أَنْتَظِرُ*, *كَانَ الْمَطَر يَنْزِلُ*), events in the simple past (*رَنَّ*, *وَصَلَتْ*)."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: What were you doing yesterday when the phone rang?"}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d2: {"title": "Layla answers", "gloss": "Layla: I was waiting for the bus in the street, and the rain was falling."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d3: {"title": "Yusuf guesses", "gloss": "Yusuf: And were you reading?"}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d4: {"title": "Layla confirms", "gloss": "Layla: Yes, while I was reading a message, the phone rang."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d5: {"title": "Yusuf shares", "gloss": "Yusuf: And I was cooking at home."}
  ar.a2.unit70.madha_kana_yahduth.lesson06.teach.d6: {"title": "Layla ends", "gloss": "Layla: And the bus arrived after ten minutes!"}
exercises:
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise01.choose_waiting: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كُنْتُ أَنْتَظِرُ الْحَافِلَة.", "distractors": ["كُنْتُ أَمْشِي فِي الشَّارِع.", "كَانَ يَنْتَظِرُ الْحَافِلَة.", "كُنَّا نَنْتَظِرُ الْحَافِلَة."], "accepted_answers": [{"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة.", "status": "correct"}], "feedback": "*كُنْتُ أَنْتَظِرُ* = I was waiting."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise02.choose_rain_falling: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ الْمَطَر يَنْزِلُ فِي الشَّارِع.", "distractors": ["كَانَ يُوسُف يَقْرَأُ فِي الشَّارِع.", "كُنْتُ أَقْرَأُ فِي الشَّارِع.", "كَانَ يُوسُف يَنْتَظِرُ فِي الشَّارِع."], "accepted_answers": [{"value": "كَانَ الْمَطَر يَنْزِلُ فِي الشَّارِع.", "status": "correct"}], "feedback": "*الْمَطَر* is masculine here, so *كَانَ ... يَنْزِلُ*."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise03.match_words: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "الْمَطَر", "right": "the rain"}, {"left": "الشَّارِع", "right": "the street"}, {"left": "الْهَاتِف", "right": "the phone"}, {"left": "أَنْتَظِرُ", "right": "I wait"}, {"left": "أَمْشِي", "right": "I walk"}, {"left": "أَطْبُخُ", "right": "I cook"}], "status": "correct"}], "feedback": "Words for describing what was going on."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise04.order_walking: {"instruction": "Put the words in order to say 'I was walking in the street.'", "correct_option": "كُنْتُ أَمْشِي فِي الشَّارِع", "accepted_answers": [{"value": "كُنْتُ أَمْشِي فِي الشَّارِع", "status": "correct"}], "feedback": "*كُنْتُ* first, then the present-tense verb."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise05.complete_we_wait: {"instruction": "Write the present-tense verb that means 'we wait'.", "correct_option": "نَنْتَظِرُ", "accepted_answers": [{"value": "نَنْتَظِرُ", "status": "correct"}], "feedback": "*نَنْتَظِرُ* = we wait."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise06.translate_they_waiting: {"instruction": "Translate into Arabic.", "correct_option": "كَانُوا يَنْتَظِرُونَ الْحَافِلَة.", "accepted_answers": [{"value": "كَانُوا يَنْتَظِرُونَ الْحَافِلَة.", "status": "correct"}, {"value": "كَانُوا يَنْتَظِرُونَ الْحَافِلَة", "status": "correct"}], "feedback": "*كَانُوا يَنْتَظِرُونَ* = they were waiting."}
  ar.a2.unit70.madha_kana_yahduth.lesson01.exercise07.write_yusuf_message: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَ يُوسُف يَقْرَأُ رِسَالَة.", "accepted_answers": [{"value": "كَانَ يُوسُف يَقْرَأُ رِسَالَة.", "status": "correct"}, {"value": "كَانَ يُوسُف يَقْرَأُ رِسَالَة", "status": "correct"}, {"value": "يُوسُف كَانَ يَقْرَأُ رِسَالَة.", "status": "correct"}, {"value": "يُوسُف كَانَ يَقْرَأُ رِسَالَة", "status": "correct"}], "feedback": "*كَانَ ... يَقْرَأُ* = he was reading."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise01.choose_reading_phone: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كُنْتُ أَقْرَأُ عِنْدَمَا رَنَّ الْهَاتِف.", "distractors": ["كُنْتُ أَقْرَأُ عِنْدَمَا بَدَأَ الْمَطَر.", "كُنْتُ أَنْتَظِرُ عِنْدَمَا رَنَّ الْهَاتِف.", "كُنْتُ أَقْرَأُ عِنْدَمَا سَقَطَ الْكِتَاب."], "accepted_answers": [{"value": "كُنْتُ أَقْرَأُ عِنْدَمَا رَنَّ الْهَاتِف.", "status": "correct"}], "feedback": "Background: *كُنْتُ أَقْرَأُ*. Event: *رَنَّ الْهَاتِف*."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise02.choose_rain_yusuf: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "عِنْدَمَا بَدَأَ الْمَطَر كَانَ يُوسُف يَمْشِي.", "distractors": ["عِنْدَمَا بَدَأَ الْمَطَر كَانَ يُوسُف يَقْرَأُ.", "عِنْدَمَا رَنَّ الْهَاتِف كَانَ يُوسُف يَمْشِي.", "عِنْدَمَا بَدَأَ الْمَطَر كُنْتُ أَمْشِي."], "accepted_answers": [{"value": "عِنْدَمَا بَدَأَ الْمَطَر كَانَ يُوسُف يَمْشِي.", "status": "correct"}], "feedback": "*عِنْدَمَا* introduces the event; Yusuf's action is the background."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise03.match_linkers: {"instruction": "Match each Arabic word to its English meaning.", "accepted_answers": [{"value": [{"left": "عِنْدَمَا", "right": "when"}, {"left": "فَجْأَة", "right": "suddenly"}, {"left": "أَمْس", "right": "yesterday"}, {"left": "بَدَأَ", "right": "it began"}, {"left": "رَنَّ", "right": "it rang"}, {"left": "سَقَطَ", "right": "it fell"}], "status": "correct"}], "feedback": "Words that mark an interruption."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise04.order_rain_began: {"instruction": "Put the words in order to say 'I was waiting for the bus when the rain began.'", "correct_option": "كُنْتُ أَنْتَظِرُ الْحَافِلَة عِنْدَمَا بَدَأَ الْمَطَر", "accepted_answers": [{"value": "كُنْتُ أَنْتَظِرُ الْحَافِلَة عِنْدَمَا بَدَأَ الْمَطَر", "status": "correct"}, {"value": "عِنْدَمَا بَدَأَ الْمَطَر كُنْتُ أَنْتَظِرُ الْحَافِلَة", "status": "correct"}], "feedback": "Background first, event after *عِنْدَمَا*."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise05.complete_rang: {"instruction": "Write the past-tense verb that means 'it rang'.", "correct_option": "رَنَّ", "accepted_answers": [{"value": "رَنَّ", "status": "correct"}], "feedback": "*رَنَّ الْهَاتِف* = the phone rang."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise06.translate_suddenly: {"instruction": "Translate into Arabic.", "correct_option": "فَجْأَة رَنَّ الْهَاتِف.", "accepted_answers": [{"value": "فَجْأَة رَنَّ الْهَاتِف.", "status": "correct"}, {"value": "فَجْأَة رَنَّ الْهَاتِف", "status": "correct"}, {"value": "رَنَّ الْهَاتِف فَجْأَة.", "status": "correct"}, {"value": "رَنَّ الْهَاتِف فَجْأَة", "status": "correct"}], "feedback": "*فَجْأَة* may open or close the sentence."}
  ar.a2.unit70.madha_kana_yahduth.lesson02.exercise07.write_walking_rain: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كُنْتُ أَمْشِي فِي الشَّارِع عِنْدَمَا بَدَأَ الْمَطَر.", "accepted_answers": [{"value": "كُنْتُ أَمْشِي فِي الشَّارِع عِنْدَمَا بَدَأَ الْمَطَر.", "status": "correct"}, {"value": "كُنْتُ أَمْشِي فِي الشَّارِع عِنْدَمَا بَدَأَ الْمَطَر", "status": "correct"}, {"value": "عِنْدَمَا بَدَأَ الْمَطَر كُنْتُ أَمْشِي فِي الشَّارِع.", "status": "correct"}, {"value": "عِنْدَمَا بَدَأَ الْمَطَر كُنْتُ أَمْشِي فِي الشَّارِع", "status": "correct"}], "feedback": "Progressive plus simple past."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise01.choose_while_cooking: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَيْنَمَا كُنْتُ أَقْرَأُ، كَانَتْ لَيْلَى تَطْبُخُ.", "distractors": ["بَيْنَمَا كُنْتُ أَطْبُخُ، كَانَتْ لَيْلَى تَقْرَأُ.", "بَيْنَمَا كُنْتُ أَقْرَأُ، كَانَ يُوسُف يَطْبُخُ.", "بَيْنَمَا كُنْتُ أَقْرَأُ، رَنَّ الْهَاتِف."], "accepted_answers": [{"value": "بَيْنَمَا كُنْتُ أَقْرَأُ، كَانَتْ لَيْلَى تَطْبُخُ.", "status": "correct"}], "feedback": "Two parallel actions: *كُنْتُ أَقْرَأُ* and *كَانَتْ ... تَطْبُخُ*."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise02.choose_while_book: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "بَيْنَمَا كُنْتُ أَمْشِي، سَقَطَ الْكِتَاب.", "distractors": ["بَيْنَمَا كُنْتُ أَمْشِي، رَنَّ الْهَاتِف.", "بَيْنَمَا كُنْتُ أَقْرَأُ، سَقَطَ الْكِتَاب.", "بَيْنَمَا كَانَ يُوسُف يَمْشِي، سَقَطَ الْكِتَاب."], "accepted_answers": [{"value": "بَيْنَمَا كُنْتُ أَمْشِي، سَقَطَ الْكِتَاب.", "status": "correct"}], "feedback": "Progressive, then the simple past event."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise03.match_progressive: {"instruction": "Match each Arabic phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "كَانَتْ تَطْبُخُ", "right": "she was cooking"}, {"left": "كَانَ يَقْرَأُ", "right": "he was reading"}, {"left": "كَانُوا يَنْتَظِرُونَ", "right": "they were waiting"}, {"left": "بَيْنَمَا", "right": "while"}, {"left": "مَعًا", "right": "together"}, {"left": "فِي نَفْس الْوَقْت", "right": "at the same time"}], "status": "correct"}], "feedback": "Progressive forms and the linker."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise04.order_yusuf_cooking: {"instruction": "Put the words in order to say 'Yusuf was cooking while Layla was reading.'", "correct_option": "كَانَ يُوسُف يَطْبُخُ بَيْنَمَا كَانَتْ لَيْلَى تَقْرَأُ", "accepted_answers": [{"value": "كَانَ يُوسُف يَطْبُخُ بَيْنَمَا كَانَتْ لَيْلَى تَقْرَأُ", "status": "correct"}], "feedback": "Two clauses joined by *بَيْنَمَا*."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise05.complete_while: {"instruction": "Write the word that means 'while'.", "correct_option": "بَيْنَمَا", "accepted_answers": [{"value": "بَيْنَمَا", "status": "correct"}], "feedback": "*بَيْنَمَا* = while."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise06.translate_while_yusuf: {"instruction": "Translate into Arabic.", "correct_option": "بَيْنَمَا كَانَ يُوسُف يَقْرَأُ، كَانَتْ لَيْلَى تَطْبُخُ.", "accepted_answers": [{"value": "بَيْنَمَا كَانَ يُوسُف يَقْرَأُ، كَانَتْ لَيْلَى تَطْبُخُ.", "status": "correct"}, {"value": "بَيْنَمَا كَانَ يُوسُف يَقْرَأُ، كَانَتْ لَيْلَى تَطْبُخُ", "status": "correct"}, {"value": "كَانَتْ لَيْلَى تَطْبُخُ بَيْنَمَا كَانَ يُوسُف يَقْرَأُ.", "status": "correct"}, {"value": "كَانَتْ لَيْلَى تَطْبُخُ بَيْنَمَا كَانَ يُوسُف يَقْرَأُ", "status": "correct"}], "feedback": "Each clause has its own *كَانَ*."}
  ar.a2.unit70.madha_kana_yahduth.lesson03.exercise07.write_while_phone: {"instruction": "Write the requested Arabic sentence.", "correct_option": "بَيْنَمَا كُنْتُ أَمْشِي، رَنَّ الْهَاتِف.", "accepted_answers": [{"value": "بَيْنَمَا كُنْتُ أَمْشِي، رَنَّ الْهَاتِف.", "status": "correct"}, {"value": "بَيْنَمَا كُنْتُ أَمْشِي، رَنَّ الْهَاتِف", "status": "correct"}, {"value": "رَنَّ الْهَاتِف بَيْنَمَا كُنْتُ أَمْشِي.", "status": "correct"}, {"value": "رَنَّ الْهَاتِف بَيْنَمَا كُنْتُ أَمْشِي", "status": "correct"}], "feedback": "Progressive, then the simple past."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise01.choose_cold_rain: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَ الْجَوّ بَارِدًا وَكَانَ الْمَطَر يَنْزِلُ.", "distractors": ["كَانَ الْجَوّ بَارِدًا وَكَانَ الشَّارِع مُزْدَحِمًا.", "كَانَ الْجَوّ مُزْدَحِمًا وَكَانَ الْمَطَر يَنْزِلُ.", "كَانَ الْجَوّ بَارِدًا وَكَانَ الْمَطَر يَنْتَظِرُ."], "accepted_answers": [{"value": "كَانَ الْجَوّ بَارِدًا وَكَانَ الْمَطَر يَنْزِلُ.", "status": "correct"}], "feedback": "Weather first, then what was in progress."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise02.choose_cars_not_moving: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "كَانَتِ السَّيَّارَات لَا تَتَحَرَّكُ.", "distractors": ["كَانَتِ السَّيَّارَات تَتَحَرَّكُ.", "كَانَتِ السَّيَّارَات لَا تَنْتَظِرُ.", "كَانَ الشَّارِع لَا يَنْزِلُ."], "accepted_answers": [{"value": "كَانَتِ السَّيَّارَات لَا تَتَحَرَّكُ.", "status": "correct"}], "feedback": "*لَا* + present tense after *كَانَتْ* gives a negative progressive."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise03.match_scene: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "الْجَوّ", "right": "the weather"}, {"left": "بَارِد", "right": "cold"}, {"left": "مُزْدَحِم", "right": "crowded"}, {"left": "السَّيَّارَات", "right": "the cars"}, {"left": "لَا تَتَحَرَّكُ", "right": "she/it is not moving"}, {"left": "يَنْزِلُ", "right": "it falls, it is falling"}], "status": "correct"}], "feedback": "Words for describing a scene."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise04.order_street_rain: {"instruction": "Put the words in order to say 'The street was crowded and the rain was falling.'", "correct_option": "كَانَ الشَّارِع مُزْدَحِمًا وَكَانَ الْمَطَر يَنْزِلُ", "accepted_answers": [{"value": "كَانَ الشَّارِع مُزْدَحِمًا وَكَانَ الْمَطَر يَنْزِلُ", "status": "correct"}], "feedback": "Two scene descriptions joined by *وَ*."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise05.complete_cold: {"instruction": "Write the word that means 'cold' (masculine, after كَانَ).", "correct_option": "بَارِدًا", "accepted_answers": [{"value": "بَارِدًا", "status": "correct"}], "feedback": "*بَارِدًا* = cold."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise06.translate_street_crowded: {"instruction": "Translate into Arabic.", "correct_option": "كَانَ الشَّارِع مُزْدَحِمًا.", "accepted_answers": [{"value": "كَانَ الشَّارِع مُزْدَحِمًا.", "status": "correct"}, {"value": "كَانَ الشَّارِع مُزْدَحِمًا", "status": "correct"}], "feedback": "*مُزْدَحِمًا* agrees with the masculine *الشَّارِع*."}
  ar.a2.unit70.madha_kana_yahduth.lesson04.exercise07.write_cold_cars: {"instruction": "Write the requested Arabic sentence.", "correct_option": "كَانَ الْجَوّ بَارِدًا وَكَانَتِ السَّيَّارَات لَا تَتَحَرَّكُ.", "accepted_answers": [{"value": "كَانَ الْجَوّ بَارِدًا وَكَانَتِ السَّيَّارَات لَا تَتَحَرَّكُ.", "status": "correct"}, {"value": "كَانَ الْجَوّ بَارِدًا وَكَانَتِ السَّيَّارَات لَا تَتَحَرَّكُ", "status": "correct"}], "feedback": "Weather plus a negative background."}
  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise01.read_what_doing: {"instruction": "Read the text and choose the answer.", "correct_option": "Waiting for the bus.", "distractors": ["Walking to the station.", "Cooking.", "Talking to Yusuf."], "accepted_answers": [{"value": "Waiting for the bus.", "status": "correct"}], "feedback": "*أَمْس كُنْتُ أَنْتَظِرُ الْحَافِلَة فِي الشَّارِع.*"}
  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise02.read_phone: {"instruction": "Read the text and choose the answer.", "correct_option": "Reading a message.", "distractors": ["Waiting for the bus at the station.", "Cooking.", "Walking home."], "accepted_answers": [{"value": "Reading a message.", "status": "correct"}], "feedback": "*بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة، رَنَّ الْهَاتِف.*"}
  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise03.match_text: {"instruction": "Match each Arabic sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "كُنْتُ أَنْتَظِرُ الْحَافِلَة.", "right": "I was waiting for the bus."}, {"left": "كَانَ الْجَوّ بَارِدًا.", "right": "The weather was cold."}, {"left": "كَانَ الْمَطَر يَنْزِلُ.", "right": "The rain was falling."}, {"left": "رَنَّ الْهَاتِف.", "right": "The phone rang."}, {"left": "كَانَ يُوسُف!", "right": "It was Yusuf!"}, {"left": "وَصَلَتِ الْحَافِلَة.", "right": "The bus arrived."}], "status": "correct"}], "feedback": "Sentences from Layla's story."}
  ar.a2.unit70.madha_kana_yahduth.lesson05.exercise04.order_reading_rang: {"instruction": "Put the words in order to say 'While I was reading a message, the phone rang.'", "correct_option": "بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة رَنَّ الْهَاتِف", "accepted_answers": [{"value": "بَيْنَمَا كُنْتُ أَقْرَأُ رِسَالَة رَنَّ الْهَاتِف", "status": "correct"}], "feedback": "Progressive first, event second."}
