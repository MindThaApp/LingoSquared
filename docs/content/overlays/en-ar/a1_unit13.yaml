  ar.a1.unit13.lesson02.recent_event: {title: "What did you do?"}
teaching:
  ar.a1.unit13.lesson01.teach.yesterday: {title: "Yesterday", gloss: "yesterday", note: "أمس (ams) means yesterday. It goes with a past-tense verb such as ذهبت, and can come at the end or at the start of the sentence.", example_gloss: "I went to the market yesterday."}
  ar.a1.unit13.lesson01.teach.went: {title: "I went", gloss: "I went", note: "ذهبت (dhahabtu) means I went: the past-tense ending -tu marks I. Without vowel marks the same letters can also be read dhahabta / dhahabti (you went, to a man / to a woman) or dhahabat (she went); context tells you which.", example_gloss: "I went to the market."}
  ar.a1.unit13.lesson01.teach.bought: {title: "I bought", gloss: "I bought", note: "اشتريت (ishtaraytu) means I bought; like ذهبت, it ends in -tu for I.", example_gloss: "I bought apples."}
  ar.a1.unit13.lesson01.teach.apples_object: {title: "Apples", gloss: "apples", note: "تفاحا (tuffāḥan) is تفاح (apples, from the shopping unit) as the object of the verb; the extra ا spells the -an ending.", example_gloss: "I bought apples."}
  ar.a1.unit13.lesson02.teach.what_did: {title: "What did you do yesterday?", gloss: "What did you do yesterday?", note: "ماذا (mādhā) asks what; فعلت here means you did: faʿalta to a man, faʿalti to a woman (the written word is the same). Yusuf asks Layla, so he says faʿalti.", example_gloss: "Yusuf said: What did you do yesterday?"}
  ar.a1.unit13.lesson02.teach.drank: {title: "I drank", gloss: "I drank", note: "شربت (sharibtu) means I drank; it has the same -tu (I) ending as ذهبت and اشتريت.", example_gloss: "I drank coffee."}
  ar.a1.unit13.lesson02.teach.event_sequence: {title: "Recent event sequence", gloss: "I went to the market. I bought apples. I drank coffee.", note: "A few short past-tense sentences in a row tell what you did. Each verb ends in -tu for I.", example_gloss: "Yesterday, I went to the market. I bought apples. I drank coffee."}
  ar.a1.unit13.lesson02.teach.line01: {title: "Ask about yesterday", gloss: "Yusuf asks what Layla did yesterday.", note: "Yusuf is asking Layla, a woman, so فعلت is read faʿalti here; to a man it is faʿalta.", example_gloss: "Yusuf said: What did you do yesterday?"}
  ar.a1.unit13.lesson02.teach.line02: {title: "Went to the market", gloss: "Layla says she went to the market.", note: "ذهبت shows completed movement.", example_gloss: "Layla said: I went to the market."}
  ar.a1.unit13.lesson02.teach.line03: {title: "Bought apples", gloss: "Layla says she bought apples.", note: "This adds a second completed action.", example_gloss: "Layla said: I bought apples."}
  ar.a1.unit13.lesson02.teach.line04: {title: "Drank coffee", gloss: "Layla says she drank coffee.", note: "This completes the short event account.", example_gloss: "Layla said: I drank coffee."}
exercises:
  ar.a1.unit13.lesson01.exercise01.recognize_yesterday:
    instruction: "Select the meaning."
    correct_option: yesterday
    distractors: [tomorrow, today, market]
    accepted_answers: [{value: yesterday, status: correct}]
    feedback: "أمس means yesterday."
  ar.a1.unit13.lesson01.exercise02.listen_went_market:
    instruction: "Listen and select what you hear."
    correct_option: "I went to the market yesterday."
    distractors: ["I go to the cafe tomorrow.", "I study at nine.", "The market is here."]
    accepted_answers: [{value: "I went to the market yesterday.", status: correct}]
    feedback: "You heard ذهبت إلى السوق أمس."
  ar.a1.unit13.lesson01.exercise03.match_past_words:
    instruction: "Match each Arabic past-event word with its meaning."
    accepted_answers:
      - value: {أمس: yesterday, ذهبت: "I went", اشتريت: "I bought", تفاحا: apples}
        status: correct
    feedback: "These words build a recent event."
  ar.a1.unit13.lesson01.exercise04.order_went_market:
    instruction: "Arrange the Arabic words for I went to the market yesterday."
    accepted_answers:
      - {value: [ذهبت, إلى, السوق, أمس], status: correct}
      - {value: [أمس, ذهبت, إلى, السوق], status: correct}
      - {value: [ذهبت, أمس, إلى, السوق], status: correct}
    feedback: "ذهبت إلى السوق أمس states a completed event."
  ar.a1.unit13.lesson01.exercise05.translate_bought:
    instruction: "Translate into Arabic: I bought apples."
    accepted_answers:
      - {value: "اشتريت تفاحا", status: correct}
      - {value: "اشتريت تفاحا.", status: correct}
      - {value: "أنا اشتريت تفاحا", status: correct}
    feedback: "اشتريت تفاحا means I bought apples."
  ar.a1.unit13.lesson01.exercise06.write_went_yesterday:
    instruction: "Type I went to the market yesterday in Arabic."
    accepted_answers:
      - {value: "ذهبت إلى السوق أمس", status: correct}
      - {value: "ذهبت إلى السوق أمس.", status: correct}
      - {value: "أمس ذهبت إلى السوق", status: correct}
      - {value: "ذهبت أمس إلى السوق", status: correct}
    feedback: "ذهبت إلى السوق أمس is the requested past sentence."
  ar.a1.unit13.lesson01.exercise07.dictation_went_market: {correct_response: "ذهبت إلى السوق أمس.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit13.lesson02.exercise01.recognize_drank:
    instruction: "Select the meaning."
    correct_option: "I drank"
    distractors: ["I bought", "I sleep", "I go"]
    accepted_answers: [{value: "I drank", status: correct}]
    feedback: "شربت means I drank."
  ar.a1.unit13.lesson02.exercise02.dialogue_event:
    instruction: "What did Layla do?"
    correct_option: "went to the market, bought apples, drank coffee"
    distractors: ["went to the library, studied, slept", "asked directions, turned right, thanked Yusuf", "planned the cafe tomorrow at five"]
    accepted_answers: [{value: "went to the market, bought apples, drank coffee", status: correct}]
    feedback: "Layla gives three completed actions."
  ar.a1.unit13.lesson02.exercise03.match_event_lines:
    instruction: "Match each Arabic event sentence with its meaning."
    accepted_answers:
      - value: {"ذهبت إلى السوق": "I went to the market", "اشتريت تفاحا": "I bought apples", "شربت قهوة": "I drank coffee"}
        status: correct
    feedback: "These sentences form a short account of yesterday."
  ar.a1.unit13.lesson02.exercise04.order_question:
    instruction: "Arrange the Arabic words for What did you do yesterday?"
    accepted_answers: [{value: [ماذا, فعلت, أمس], status: correct}]
    feedback: "ماذا فعلت أمس؟ asks about a recent completed event."
  ar.a1.unit13.lesson02.exercise05.answer_event:
    instruction: "Type the Arabic answer: I went to the market."
    accepted_answers:
      - {value: "ذهبت إلى السوق", status: correct}
      - {value: "ذهبت إلى السوق.", status: correct}
      - {value: "ذهبت إلى السوق أمس", status: correct}
      - {value: "أمس ذهبت إلى السوق", status: correct}
      - {value: "ذهبت أمس إلى السوق", status: correct}
    feedback: "ذهبت إلى السوق answers with a completed action."
  ar.a1.unit13.lesson02.exercise06.write_recent_event:
    instruction: "Type the three Arabic past-event sentences exactly: I went to the market. I bought apples. I drank coffee."
    accepted_answers:
      - {value: "ذهبت إلى السوق. اشتريت تفاحا. شربت قهوة.", status: correct}
      - {value: "ذهبت إلى السوق واشتريت تفاحا وشربت قهوة", status: acceptable_with_note, note: "Correct; this joins the three sentences into one with و (and)."}
    feedback: "ذهبت إلى السوق. اشتريت تفاحا. شربت قهوة. gives several completed actions."
