  ar.a1.unit13.lesson02.teach.line01: {title: "Ask about yesterday", gloss: "Yusuf asks what Layla did yesterday.", note: "This question prompts a past-event answer.", example_gloss: "What did you do yesterday?"}
  ar.a1.unit13.lesson02.teach.line02: {title: "Went to the market", gloss: "Layla says she went to the market.", note: "ذهبت shows completed movement.", example_gloss: "I went to the market."}
  ar.a1.unit13.lesson02.teach.line03: {title: "Bought apples", gloss: "Layla says she bought apples.", note: "This adds a second completed action.", example_gloss: "I bought apples."}
