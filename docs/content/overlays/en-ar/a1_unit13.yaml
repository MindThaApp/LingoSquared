  ar.a1.unit13.lesson01.teach.yesterday: {title: "Yesterday", gloss: "yesterday", note: "أمس marks the event as completed recently.", example_gloss: "I went yesterday."}
  ar.a1.unit13.lesson01.teach.went: {title: "I went", gloss: "I went", note: "ذهبت is the first-person past form used here.", example_gloss: "I went to the market yesterday."}
  ar.a1.unit13.lesson01.teach.bought: {title: "I bought", gloss: "I bought", note: "اشتريت describes a completed purchase.", example_gloss: "I bought apples."}
  ar.a1.unit13.lesson01.teach.apples_object: {title: "Apples", gloss: "apples", note: "تفاحا is the object form in اشتريت تفاحا.", example_gloss: "I bought apples."}
  ar.a1.unit13.lesson02.teach.what_did: {title: "What did you do yesterday?", gloss: "What did you do yesterday?", note: "ماذا فعلت أمس؟ asks for a recent completed event.", example_gloss: "What did you do yesterday?"}
  ar.a1.unit13.lesson02.teach.drank: {title: "I drank", gloss: "I drank", note: "شربت is another first-person past form.", example_gloss: "I drank coffee."}
