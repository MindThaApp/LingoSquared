review: {status: reviewed, required_next_reviewer: native_speaker_review, notes: "Paired with ar a1_unit13_past_events. Review 2026-10-19: 9 fixes - 5 example_glosses dropped the Yusuf/Layla said: frame; event_sequence note leaked internal jargon (The spine outcome requires...), rewritten, and its example_gloss dropped Yesterday; yesterday note was vague/false (marks the event as completed recently), now says أمس means yesterday and goes with a past verb; ماذا فعلت أمس؟ is read faʿalta to a man / faʿalti to a woman - what_did and line01 notes now give both (Yusuf asks Layla: faʿalti); went/bought/drank notes explain the -tu (I) ending and that ذهبت can also read you/she went; apples_object note explains تفاحا as تفاح with the -an object ending; yesterday/went example_glosses follow the realization card reorder; order_went_market, write_went_yesterday and answer_event accept أمس in other valid positions (and answer_event accepts the answer with أمس); translate_bought accepts أنا اشتريت تفاحا; write_recent_event accepts the sentences joined with و (with note); transliterations added. NATIVE FLAGS: none."}
course: {title: Arabic A1, description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."}
