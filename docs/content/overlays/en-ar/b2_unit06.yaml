review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) confirmation needed (DRAFT). Confirm every
    English gloss matches idiomatic MSA, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation/joining forms a correct learner would actually produce
    -- Arabic is graded fully byte-strict with zero typo tolerance and
    no internal-punctuation stripping. See the realization file's
    review block for the full priority list.
  notes: >-
    Overlay for ar's sixth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    "وإن كنت أتفهم أن" is a concessive QUALIFIER ("even though I
    understand that..."), not a full concession -- a learner must not
    read it as agreeing with the other view; (2) "ردا على ما قلت"
    (in response to what you said) explicitly engages the other
    speaker's own words -- distinct from just restating one's own
    opinion again, which is the exact failure mode this outcome guards
    against; (3) "يعتمد على" (depends on) takes a following noun/verbal
    noun directly, with no extra preposition the way English "depends
    ON" might tempt a learner to double up. No sibling-direction file
    (ar-en b2) was consulted.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: discuss an abstract
    topic -- give a qualified opinion (أعتقد أن...، وإن كنت أتفهم أن...)
    and respond directly to another person's view (ردا على ما قلت،
    بخصوص، على الرغم من) rather than only stating your own, around the
    abstract question of what "success" means.

