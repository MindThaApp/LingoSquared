  ar.b1.unit46.lesson01.teach.taqdim_shakwa: {title: "I want to file a complaint", gloss: "I want to file a complaint", note: "*أريد تقديم شكوى* means I want to file a complaint.", example_gloss: "Yusuf said: I want to file a complaint, please."}
  ar.b1.unit46.lesson01.teach.alintirnit: {title: "The internet", gloss: "the internet", note: "*الإنترنت* means the internet.", example_gloss: "The internet in my house is disconnected."}
  ar.b1.unit46.lesson01.teach.maqtu_mundhu_ams: {title: "Disconnected since yesterday", gloss: "disconnected since yesterday", note: "*مقطوع منذ أمس* means disconnected since yesterday.", example_gloss: "The internet in my house has been disconnected since yesterday."}
  ar.b1.unit46.lesson01.teach.fi_bayti: {title: "In my house", gloss: "in my house", note: "*في بيتي* means in my house.", example_gloss: "The internet in my house has been disconnected since yesterday."}
  ar.b1.unit46.lesson01.teach.yusuf_mushkila: {title: "Yusuf describes the problem", gloss: "The internet in my house has been disconnected since yesterday.", note: "This states what is wrong, the first step of a complaint.", example_gloss: "Yusuf said: The internet in my house has been disconnected since yesterday."}
  ar.b1.unit46.lesson02.teach.ittasaltu_ams: {title: "I called yesterday and no one solved the problem", gloss: "I called yesterday and no one solved the problem", note: "*اتصلت أمس ولم يحل أحد المشكلة* describes what already happened.", example_gloss: "Yusuf said: I called yesterday and no one solved the problem."}
