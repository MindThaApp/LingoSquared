exercises:
  ar.b1.unit46.lesson01.exercise01.recognize_taqdim_shakwa:
    instruction: "Select the meaning."
    correct_option: "I want to file a complaint"
    distractors: ["I want to cancel my complaint", "I filed a complaint yesterday", "I do not have a complaint"]
    accepted_answers: [{value: "I want to file a complaint", status: correct}]
    feedback: "*أريد تقديم شكوى* opens the call."
  ar.b1.unit46.lesson01.exercise02.recognize_maqtu_mundhu_ams:
    instruction: "Select the meaning."
    correct_option: "The internet in my house has been disconnected since yesterday"
    distractors: ["The internet in my house was disconnected last month", "The internet in my house works well", "The internet in my office is disconnected since yesterday"]
    accepted_answers: [{value: "The internet in my house has been disconnected since yesterday", status: correct}]
    feedback: "*الإنترنت في بيتي مقطوع منذ أمس* states the problem."
  ar.b1.unit46.lesson01.exercise03.listen_select_mushkila:
    instruction: "Listen and select what Yusuf says."
    correct_option: "The internet in my house has been disconnected since yesterday."
    distractors: ["The internet in my office has been disconnected since yesterday.", "The internet in my house has been disconnected since last week.", "The internet in my house works fine."]
    accepted_answers: [{value: "The internet in my house has been disconnected since yesterday.", status: correct}]
    feedback: "You heard *الإنترنت في بيتي مقطوع منذ أمس*."
  ar.b1.unit46.lesson01.exercise04.match_wasf_mushkila:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {شكوى: complaint, الإنترنت: internet, مقطوع: disconnected, منذ: since, أمس: yesterday, بيتي: "my house", "أريد تقديم شكوى": "I want to file a complaint", "الإنترنت في بيتي مقطوع": "The internet in my house is disconnected"}
        status: correct
    feedback: "These phrases cover the complaint and the problem it describes."
  ar.b1.unit46.lesson01.exercise05.order_wasf_mushkila:
    instruction: "Arrange the Arabic words for The internet in my house has been disconnected since yesterday."
    accepted_answers: [{value: [الإنترنت, في, بيتي, مقطوع, منذ, أمس], status: correct}]
    feedback: "*الإنترنت في بيتي مقطوع منذ أمس* describes the problem."
  ar.b1.unit46.lesson01.exercise06.write_wasf_mushkila:
    instruction: "Write exactly this sentence describing the problem: The internet in my house has been disconnected since yesterday."
    accepted_answers:
      - {value: "الإنترنت في بيتي مقطوع منذ أمس", status: correct}
      - {value: "الإنترنت في بيتي مقطوع منذ أمس.", status: correct}
    feedback: "*الإنترنت في بيتي مقطوع منذ أمس.* is the requested sentence."
  ar.b1.unit46.lesson02.exercise01.recognize_ittasaltu_ams:
    instruction: "Select the meaning."
    correct_option: "I called yesterday and no one solved the problem"
    distractors: ["I called today and someone solved the problem", "I never called about this problem", "I called yesterday and the problem was solved"]
    accepted_answers: [{value: "I called yesterday and no one solved the problem", status: correct}]
    feedback: "*اتصلت أمس ولم يحل أحد المشكلة* describes what already happened."
  ar.b1.unit46.lesson02.exercise02.recognize_zayara_fanniyya:
    instruction: "Select the meaning."
    correct_option: "I want a technical visit to fix the problem today"
    distractors: ["I want a refund today", "I had a technical visit yesterday", "I do not want a technical visit"]
    accepted_answers: [{value: "I want a technical visit to fix the problem today", status: correct}]
    feedback: "*أريد زيارة فنية لإصلاح المشكلة اليوم* asks for a concrete resolution."
  ar.b1.unit46.lesson02.exercise03.listen_select_hal:
    instruction: "Listen and select what Yusuf says."
    correct_option: "I want a technical visit to fix the problem."
    distractors: ["I want a refund to fix the problem.", "I had a technical visit to fix the problem.", "I want a technical visit next month."]
    accepted_answers: [{value: "I want a technical visit to fix the problem.", status: correct}]
    feedback: "You heard *أريد زيارة فنية لإصلاح المشكلة*."
  ar.b1.unit46.lesson02.exercise04.match_talab_hal:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {اتصلت: "I called", "لم يحل أحد": "no one solved", المشكلة: "the problem", زيارة: visit, فنية: technical, لإصلاح: "to fix", اليوم: today, "أريد زيارة فنية": "I want a technical visit"}
        status: correct
    feedback: "These phrases cover the history of the complaint and the requested resolution."
  ar.b1.unit46.lesson02.exercise05.order_talab_hal:
    instruction: "Arrange the Arabic words for I want a technical visit to fix the problem today."
    accepted_answers: [{value: [أريد, زيارة, فنية, لإصلاح, المشكلة, اليوم], status: correct}]
    feedback: "*أريد زيارة فنية لإصلاح المشكلة اليوم* asks for a concrete resolution."
  ar.b1.unit46.lesson02.exercise06.write_talab_hal:
    instruction: "Write exactly this request for a resolution: I want a technical visit to fix the problem today."
    accepted_answers:
      - {value: "أريد زيارة فنية لإصلاح المشكلة اليوم", status: correct}
      - {value: "أريد زيارة فنية لإصلاح المشكلة اليوم.", status: correct}
    feedback: "*أريد زيارة فنية لإصلاح المشكلة اليوم.* is the requested sentence."
  ar.b1.unit46.lesson03.exercise01.choose_second_call:
    instruction: "Which answer shows this is Yusuf's SECOND time calling about the same problem?"
    correct_option: "نعم، اتصلت أمس ولم يحل أحد المشكلة"
    distractors: ["ما المشكلة؟", "أريد تقديم شكوى، من فضلك", "الإنترنت في بيتي مقطوع منذ أمس"]
    accepted_answers: [{value: "نعم، اتصلت أمس ولم يحل أحد المشكلة", status: correct}]
    feedback: "*نعم، اتصلت أمس ولم يحل أحد المشكلة* shows he already called once before."
  ar.b1.unit46.lesson03.exercise02.dialogue_comprehension_shakwa:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf reports that his home internet has been down since yesterday, that he already called once with no fix, and asks for a technician visit today."
    distractors: ["Yusuf reports a new problem he has not called about before.", "Yusuf says the internet problem has already been fixed.", "Yusuf asks for a refund instead of a technician visit."]
    accepted_answers: [{value: "Yusuf reports that his home internet has been down since yesterday, that he already called once with no fix, and asks for a technician visit today.", status: correct}]
    feedback: "Yusuf describes the problem, notes the earlier unresolved call, and requests a concrete resolution."
  ar.b1.unit46.lesson03.exercise03.match_dialogue_shakwa:
    instruction: "Match each Arabic sentence with its meaning."
    accepted_answers:
      - value: {"أريد تقديم شكوى، من فضلك.": "I want to file a complaint, please.", "ما المشكلة؟": "What is the problem?", "الإنترنت في بيتي مقطوع منذ أمس.": "The internet in my house has been disconnected since yesterday.", "هل اتصلت بنا من قبل؟": "Have you called us before?", "نعم، اتصلت أمس ولم يحل أحد المشكلة.": "Yes, I called yesterday and no one solved the problem.", "أريد زيارة فنية لإصلاح المشكلة اليوم.": "I want a technical visit to fix the problem today."}
        status: correct
    feedback: "These lines cover the full phone complaint."
  ar.b1.unit46.lesson03.exercise04.order_ma_almushkila:
    instruction: "Arrange the Arabic words for What is the problem?"
    accepted_answers: [{value: [ما, المشكلة], status: correct}]
    feedback: "*ما المشكلة؟* opens the representative's question."
  ar.b1.unit46.lesson03.exercise05.reply_describe_problem:
    instruction: "The representative asks: What is the problem? Reply as Yusuf, describing the problem."
    accepted_answers:
      - {value: "الإنترنت في بيتي مقطوع منذ أمس", status: correct}
      - {value: "الإنترنت في بيتي مقطوع منذ أمس.", status: correct}
    feedback: "*الإنترنت في بيتي مقطوع منذ أمس.* is Yusuf's description of the problem."
  ar.b1.unit46.lesson03.exercise06.write_full_shakwa:
    instruction: "As Yusuf, write two sentences to the internet company: describe the problem (the internet in your house has been disconnected since yesterday), then ask for a concrete resolution (a technical visit to fix the problem today)."
    accepted_answers:
      - {value: "الإنترنت في بيتي مقطوع منذ أمس أريد زيارة فنية لإصلاح المشكلة اليوم", status: correct}
      - {value: "الإنترنت في بيتي مقطوع منذ أمس. أريد زيارة فنية لإصلاح المشكلة اليوم.", status: correct}
    feedback: "*الإنترنت في بيتي مقطوع منذ أمس. أريد زيارة فنية لإصلاح المشكلة اليوم.* links the problem to a concrete resolution request, as required."
