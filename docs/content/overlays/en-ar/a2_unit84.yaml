  ar.a2.unit84.qala_inna.lesson03.exercise06.tr_layla_asked: {"instruction": "Translate into Arabic.", "correct_option": "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ مَشْغُولًا.", "accepted_answers": [{"value": "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ مَشْغُولًا.", "status": "correct"}, {"value": "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ مَشْغُولًا", "status": "correct"}], "feedback": "*سَأَلَتْنِي*."}
  ar.a2.unit84.qala_inna.lesson03.exercise07.wr_yusuf_home: {"instruction": "Write the requested Arabic sentence.", "correct_option": "سَأَلَنِي يُوسُف إِنْ كُنْتُ فِي الْبَيْت.", "accepted_answers": [{"value": "سَأَلَنِي يُوسُف إِنْ كُنْتُ فِي الْبَيْت.", "status": "correct"}, {"value": "سَأَلَنِي يُوسُف إِنْ كُنْتُ فِي الْبَيْت", "status": "correct"}], "feedback": "*سَأَلَنِي*."}
