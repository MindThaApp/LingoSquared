  ar.a2.unit84.qala_inna.lesson03.exercise01.yusuf_asked_home: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "سَأَلَنِي يُوسُف إِنْ كُنْتُ فِي الْبَيْت.", "distractors": ["سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ فِي الْبَيْت.", "سَأَلَنِي يُوسُف إِنْ كُنْتُ مَشْغُولًا.", "قَالَ لِي يُوسُف إِنَّهُ فِي الْبَيْت."], "accepted_answers": [{"value": "سَأَلَنِي يُوسُف إِنْ كُنْتُ فِي الْبَيْت.", "status": "correct"}], "feedback": "*إِنْ كُنْتُ* = whether I was."}
  ar.a2.unit84.qala_inna.lesson03.exercise02.layla_asked_busy: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ مَشْغُولًا.", "distractors": ["سَأَلَنِي يُوسُف إِنْ كُنْتُ مَشْغُولًا.", "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ فِي الْبَيْت.", "قَالَتْ لِي لَيْلَى إِنَّهَا مَشْغُولَة."], "accepted_answers": [{"value": "سَأَلَتْنِي لَيْلَى إِنْ كُنْتُ مَشْغُولًا.", "status": "correct"}], "feedback": "*سَأَلَتْنِي* = she asked me."}
