  ar.a2.unit84.qala_inna.lesson02.exercise02.layla_told: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "قَالَتْ لِي لَيْلَى إِنَّهَا مُتْعَبَة.", "distractors": ["قَالَ لِي يُوسُف إِنَّهُ مَرِيض.", "قَالَتْ لَيْلَى إِنَّهَا سَتَصِلُ مُبَكِّرًا.", "قَالَتْ لِي لَيْلَى إِنَّهَا مَشْغُولَة."], "accepted_answers": [{"value": "قَالَتْ لِي لَيْلَى إِنَّهَا مُتْعَبَة.", "status": "correct"}], "feedback": "*قَالَتْ لِي* = she told me."}
