course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit84.qala_inna: {"title": "He said that", "description": "Pass on a simple message with yaqul inna, qala inna and sa'ala in kana, for example when you tell someone what a friend said or asked."}
lessons:
  ar.a2.unit84.qala_inna.lesson01.yaqulu_inna: {"title": "He says that"}
  ar.a2.unit84.qala_inna.lesson02.qala_inna: {"title": "He said that"}
  ar.a2.unit84.qala_inna.lesson03.saala_in: {"title": "He asked whether"}
  ar.a2.unit84.qala_inna.lesson04.direct_to_reported: {"title": "From his words to mine"}
  ar.a2.unit84.qala_inna.lesson05.reading_layla: {"title": "Yusuf called"}
  ar.a2.unit84.qala_inna.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit84.qala_inna.lesson01.teach.words: {"title": "Says that", "gloss": "he says / she says / that he / that she / Layla / Yusuf", "example_gloss": ["Yusuf says that he is busy.", "Layla says that she is tired."]}
  ar.a2.unit84.qala_inna.lesson01.teach.adj: {"title": "Busy, tired, sick", "gloss": "busy (masc.) / busy (fem.) / tired (fem.) / sick (masc.)", "example_gloss": ["Yusuf says that he is sick.", "Layla says that she is busy."]}
  ar.a2.unit84.qala_inna.lesson01.teach.gn_inna: {"title": "يَقُولُ إِنَّ ...", "gloss": "Yusuf says that he is busy. Layla says that she is tired.", "note": "To report what someone says, use *يَقُولُ* (he says) or *تَقُولُ* (she says), then *إِنَّ* with a pronoun suffix: *إِنَّهُ* (that he), *إِنَّهَا* (that she)."}
  ar.a2.unit84.qala_inna.lesson01.teach.gn_inna2: {"title": "Pronoun and adjective", "gloss": "Yusuf says that he is sick. Layla says that she is busy.", "note": "The suffix and the adjective follow the person you talk about: he is masculine (*مَرِيض*), she is feminine (*مَشْغُولَة*)."}
  ar.a2.unit84.qala_inna.lesson02.teach.words: {"title": "Said and arrive", "gloss": "he said / she said / to me / he will arrive / she will arrive / late / early", "example_gloss": ["Yusuf said that he will arrive late.", "Layla told me that she is busy."]}
  ar.a2.unit84.qala_inna.lesson02.teach.gn_qala: {"title": "قَالَ إِنَّ ...", "gloss": "Yusuf said that he will arrive late. Layla said that she will arrive early.", "note": "For a past message use *قَالَ* / *قَالَتْ*, then *إِنَّهُ* / *إِنَّهَا*. A future plan keeps *سَـ*: *سَيَصِلُ*, *سَتَصِلُ*."}
  ar.a2.unit84.qala_inna.lesson02.teach.gn_lee: {"title": "قَالَ لِي", "gloss": "Yusuf told me that he is busy. Layla told me that she is tired.", "note": "*لِي* (to me) goes right after the verb: *قَالَ لِي*, *قَالَتْ لِي*."}
  ar.a2.unit84.qala_inna.lesson03.teach.words: {"title": "Asked whether", "gloss": "he asked me / she asked me / whether (if) / I was / in, at / the house, home / busy (after kana)", "example_gloss": ["Yusuf asked me whether I was at home.", "Layla asked me whether I was busy."]}
  ar.a2.unit84.qala_inna.lesson03.teach.gn_in: {"title": "سَأَلَ إِنْ كَانَ", "gloss": "Yusuf asked me whether I was at home. Layla asked me whether I was busy.", "note": "To report a yes/no question use *سَأَلَ* + *إِنْ* + *كَانَ*. The suffix on the verb says who was asked: *سَأَلَنِي* (me)."}
  ar.a2.unit84.qala_inna.lesson03.teach.gn_direct: {"title": "Question and report", "gloss": "Are you busy? He asked me whether I was busy.", "note": "The direct question uses *هَلْ*; the reported one uses *إِنْ* and the verb *كَانَ*, with *كُنْتُ* for I."}
  ar.a2.unit84.qala_inna.lesson04.teach.words: {"title": "I said, we said", "gloss": "I said / we said / that I / that we / I / tired (masc.) / tired (plural)", "example_gloss": ["I said that I am busy.", "We said that we are tired."]}
  ar.a2.unit84.qala_inna.lesson04.teach.gn_shift: {"title": "From I to he", "gloss": "Yusuf said: I am tired. Yusuf said that he is tired.", "note": "When you pass on a message, *أَنَا* (I) becomes *إِنَّهُ* (that he) or *إِنَّهَا* (that she)."}
  ar.a2.unit84.qala_inna.lesson04.teach.gn_shift2: {"title": "Your own words", "gloss": "I said that I am busy. We said that we are tired.", "note": "If you report your own words, use *إِنَّنِي* (that I) or *إِنَّنَا* (that we)."}
  ar.a2.unit84.qala_inna.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "he called me / yesterday / and that he / and he asked me", "example_gloss": ["Yusuf called me yesterday.", "He said that he is busy and that he will arrive late."]}
  ar.a2.unit84.qala_inna.lesson05.teach.reading: {"title": "Yusuf called", "gloss": "Yusuf called me yesterday. He said that he is busy and that he will arrive late. And he asked me whether I was at home.", "note": "A message with a statement and a question."}
  ar.a2.unit84.qala_inna.lesson06.teach.d1: {"title": "Layla asks", "gloss": "Layla: What did the manager say, Yusuf?"}
  ar.a2.unit84.qala_inna.lesson06.teach.d2: {"title": "Yusuf passes it on", "gloss": "Yusuf: He said that he is busy and that he will arrive late."}
  ar.a2.unit84.qala_inna.lesson06.teach.d3: {"title": "Layla asks more", "gloss": "Layla: And did he ask whether I was at work?"}
  ar.a2.unit84.qala_inna.lesson06.teach.d4: {"title": "Yusuf answers", "gloss": "Yusuf: Yes, he asked whether you were at work, and I said that you are here."}
  ar.a2.unit84.qala_inna.lesson06.teach.d5: {"title": "Layla thanks him", "gloss": "Layla: Thank you, Yusuf!"}
exercises:
  ar.a2.unit84.qala_inna.lesson01.exercise01.yusuf_busy: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "يَقُولُ يُوسُف إِنَّهُ مَشْغُول.", "distractors": ["تَقُولُ لَيْلَى إِنَّهَا مَشْغُولَة.", "يَقُولُ يُوسُف إِنَّهُ مَرِيض.", "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة."], "accepted_answers": [{"value": "يَقُولُ يُوسُف إِنَّهُ مَشْغُول.", "status": "correct"}], "feedback": "*إِنَّهُ* = that he."}
  ar.a2.unit84.qala_inna.lesson01.exercise02.layla_tired: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة.", "distractors": ["يَقُولُ يُوسُف إِنَّهُ مَشْغُول.", "تَقُولُ لَيْلَى إِنَّهَا مَشْغُولَة.", "يَقُولُ يُوسُف إِنَّهُ مَرِيض."], "accepted_answers": [{"value": "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة.", "status": "correct"}], "feedback": "*إِنَّهَا* = that she."}
  ar.a2.unit84.qala_inna.lesson01.exercise03.match_says: {"instruction": "Match each Arabic word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "يَقُولُ", "right": "he says"}, {"left": "تَقُولُ", "right": "she says"}, {"left": "إِنَّهُ", "right": "that he"}, {"left": "إِنَّهَا", "right": "that she"}, {"left": "مَشْغُول", "right": "busy (masc.)"}, {"left": "مَشْغُولَة", "right": "busy (fem.)"}, {"left": "مُتْعَبَة", "right": "tired (fem.)"}, {"left": "مَرِيض", "right": "sick (masc.)"}], "status": "correct"}], "feedback": "Says that."}
  ar.a2.unit84.qala_inna.lesson01.exercise04.order_layla_busy: {"instruction": "Put the words in order to say 'Layla says that she is busy.'", "correct_option": "تَقُولُ لَيْلَى إِنَّهَا مَشْغُولَة", "accepted_answers": [{"value": "تَقُولُ لَيْلَى إِنَّهَا مَشْغُولَة", "status": "correct"}], "feedback": "*إِنَّهَا* matches Layla."}
  ar.a2.unit84.qala_inna.lesson01.exercise05.fill_innahu: {"instruction": "Fill in the missing word.", "correct_option": "إِنَّهُ", "accepted_answers": [{"value": "إِنَّهُ", "status": "correct"}], "feedback": "*إِنَّهُ* = that he."}
  ar.a2.unit84.qala_inna.lesson01.exercise06.tr_yusuf_busy: {"instruction": "Translate into Arabic.", "correct_option": "يَقُولُ يُوسُف إِنَّهُ مَشْغُول.", "accepted_answers": [{"value": "يَقُولُ يُوسُف إِنَّهُ مَشْغُول.", "status": "correct"}, {"value": "يَقُولُ يُوسُف إِنَّهُ مَشْغُول", "status": "correct"}], "feedback": "*يَقُولُ ... إِنَّهُ*."}
  ar.a2.unit84.qala_inna.lesson01.exercise07.wr_layla_tired: {"instruction": "Write the requested Arabic sentence.", "correct_option": "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة.", "accepted_answers": [{"value": "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة.", "status": "correct"}, {"value": "تَقُولُ لَيْلَى إِنَّهَا مُتْعَبَة", "status": "correct"}], "feedback": "*تَقُولُ ... إِنَّهَا*."}
