teaching:
  ar.a2.unit66.lesson01.teach.alatla_atla_alsyf:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*العطلة* (al-ʿuṭla) is the general word for a holiday; *عطلة الصيف* (ʿuṭlat aṣ-ṣayf) is the long summer break. Two nouns side by side like this mean ''the holiday of the summer''.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  ar.a2.unit66.lesson01.teach.alasbwa_alqadm_alaam:
    title: When something happens
    gloss: next week / next year / soon
    note: '*القادم* (al-qādim, ''coming'') follows the noun and takes the article too: *الأسبوع القادم* (next week), *العام القادم* (next year). *قريبا* (qarīban) means ''soon''.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Jordan.
    - Soon I have a holiday.
  ar.a2.unit66.lesson01.teach.alsfr_alhjz_albqaa:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: 'These are verbal nouns (maṣdar), the dictionary-style form of a verb: *السفر* (as-safar, travelling), *الحجز* (al-ḥajz, booking), *البقاء* (al-baqāʾ, staying).'
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  ar.a2.unit66.lesson01.teach.alfndq_almkhym:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*الفندق* (al-funduq) is a hotel and *المخيم* (al-mukhayyam) is a campsite. You stay *في فندق* (in a hotel) or *في المخيم* (at the campsite).'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  ar.a2.unit66.lesson01.teach.madha_stfal_fy:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: '*ستفعل* (sa-tafʿal) is *سـ* (''will'') attached to the present-tense verb *تفعل* (''you do''): the future is built by putting *سـ* in front of the present.'
  ar.a2.unit66.lesson01.teach.fy_aghsts_sasafr:
    title: 'Near plans: سـ / سوف + present'
    gloss: In August I am going to travel to Turkey. I am going to book a hotel.
    note: 'To say what you are going to do, put *سـ* in front of the present-tense verb (*سأسافر*, ''I will travel'') or use the separate word *سوف* before it (*سوف أحجز*, ''I will book''). Both mean the same; *سـ* is written joined to the verb. A time word can come first: *في أغسطس سأسافر*.'
  ar.a2.unit66.lesson01.teach.swf_ahjz_fndqa:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  ar.a2.unit66.lesson02.teach.alalthaq_bdwra_alantqal:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: 'These are verbal nouns again: *الالتحاق بدورة* (al-iltiḥāq bi-dawra, joining a course), *الانتقال* (al-intiqāl, moving), *الادخار* (al-iddikhār, saving).'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  ar.a2.unit66.lesson02.teach.lahqa_bad_shhr:
    title: Further ahead
    gloss: later / in a month
    note: '*بعد شهر* (baʿda shahr) means ''a month from now''. It works with other periods too: *بعد أسبوع* (in a week).'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  ar.a2.unit66.lesson02.teach.bad_shhr_tbda:
    title: A course that starts
    gloss: In a month my course starts.
  ar.a2.unit66.lesson02.teach.anwy_an_althq:
    title: 'Intentions: أنوي أن ...'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *أنوي أن* (''I intend to'') and then a verb in the present form: *أنوي أن ألتحق بدورة*. The little word *أن* links the two verbs. This is for things you want to do, not for fixed arrangements.'
  ar.a2.unit66.lesson02.teach.anwy_an_antql:
    title: Planning to move house
    gloss: I plan to move house.
  ar.a2.unit66.lesson02.teach.anwy_an_adkhr:
    title: Planning to save
    gloss: I plan to save money.
  ar.a2.unit66.lesson02.teach.ghda_sadhhb_ila:
    title: سـ or أنوي أن?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use *سـ* for the near, settled future: *غدا سأذهب إلى السوق*. Use *أنوي أن* for an intention that is further away or less certain: *لاحقا أنوي أن أنتقل إلى بيت جديد*.'
  ar.a2.unit66.lesson03.teach.rbma_baltakyd:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*ربما* (rubbamā) expresses doubt. *بالتأكيد* (bi-t-taʾkīd) means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  ar.a2.unit66.lesson03.teach.hdha_alaam_hdha:
    title: This year, this summer
    gloss: this year / this summer
    note: '*هذا* (hādhā) means ''this'' with a masculine noun: *هذا العام* (this year) and *هذا الصيف* (this summer), because both *العام* and *الصيف* are masculine.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  ar.a2.unit66.lesson03.teach.hdha_alsyf_sabqa:
    title: Staying at home
    gloss: This summer I am staying at home.
  ar.a2.unit66.lesson03.teach.ghda_saaml_rbma:
    title: ربما and the verb
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: '*ربما* (''maybe'') is followed directly by the present-tense verb, with no *أن* in between: *ربما أذهب لاحقا إلى السينما*. A time word can also come first: *غدا سأعمل*.'
  ar.a2.unit66.lesson03.teach.ln_akhdh_atla:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'For a future ''not'', use *لن* + the present form: *لن آخذ عطلة* (''I will not take a holiday''). With *أنوي* the negative is *لا أنوي أن*: *لا أنوي أن أنتقل إلى بيت جديد*.'
  ar.a2.unit66.lesson04.teach.ma_mn_km:
    title: Two question phrases
    gloss: with whom / how long
    note: '*مع من* (maʿa man) asks about the person you do something with. *كم من الوقت* (kam min al-waqt) asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  ar.a2.unit66.lesson04.teach.ila_ayn_stdhhb:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*إلى أين* (ilā ayna) is literally ''to where'' and asks about a direction. For a place without movement use *أين* (''where'').'
  ar.a2.unit66.lesson04.teach.ma_mn_stsafr:
    title: Who with?
    gloss: Who are you going on holiday with?
  ar.a2.unit66.lesson04.teach.km_mn_alwqt:
    title: How long?
    gloss: How long are you staying there?
  ar.a2.unit66.lesson04.teach.sadhhb_ma_akhty:
    title: Answering
    gloss: I am going with my sister.
  ar.a2.unit66.lesson04.teach.asbwa_asbwaan:
    title: Weeks
    gloss: one week / two weeks
    note: '''Two weeks'' is the dual: *أسبوعان* (as the subject) or *أسبوعين* (after a verb or a preposition), not a numeral plus a plural.'
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  ar.a2.unit66.lesson04.teach.ila_ayn_stdhhb_2:
    title: Questions with سـ
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first, then the verb with *سـ*: *إلى أين ستذهب؟* *مع من ستسافر؟* *كم من الوقت ستبقى؟* The verb shows who is addressed: *ستذهب* to a man, *ستذهبين* to a woman.'
  ar.a2.unit66.lesson05.teach.mrhba_ya_lyla:
    title: A message from Nour
    gloss: Hi Layla! Soon I have a holiday. In August I am going to Jordan with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Nour describes near plans with *سـ* and a longer-term intention with *أنوي أن*. Notice that the verb after *سـ* and *أنوي أن* is in the present form: *سأسافر*, *سنقيم*, *ألتحق*.'
    glosses:
      قريبا: soon
      عطلة: holiday
      أغسطس: August
      أختي: sister
      إلى: to
      الأردن: Jordan
      فندق: hotel
      سنقيم: to stay
      بعد: after that
      أهلي: parents
      يومين: days
      القادم: next
      العام: year
      أنوي: plan (*أنوي* = I plan to)
      بدورة: course
      ألتحق: to join (a course)
      ربما: maybe
      أنتقل: to move house
      حينها: then
      أيضا: also
  ar.a2.unit66.lesson06.teach.mrhba_ya_ywsf:
    title: Layla asks Yusuf about his plans
    gloss: 'Layla: Hi Yusuf! Do you have plans for the summer holiday yet?'
  ar.a2.unit66.lesson06.teach.nam_fy_aghsts:
    title: Yusuf answers
    gloss: 'Yusuf: Yes! In August I am going to Turkey. I am going to book a hotel.'
  ar.a2.unit66.lesson06.teach.raia_ma_mn:
    title: Layla asks who he is going with
    gloss: 'Layla: Nice! Who are you going with?'
  ar.a2.unit66.lesson06.teach.ma_amy_snqym:
    title: Yusuf says who and how long
    gloss: 'Yusuf: With my uncle. We are going to stay for a week.'
  ar.a2.unit66.lesson06.teach.wbad_dhlk_madha:
    title: Layla asks about later
    gloss: 'Layla: And later? What do you plan to do?'
  ar.a2.unit66.lesson06.teach.alaam_alqadm_anwy:
    title: Yusuf names an intention and asks back
    gloss: 'Yusuf: Next year I plan to take a course. And you?'
  ar.a2.unit66.lesson06.teach.fy_ywlyw_saaml:
    title: Layla answers
    gloss: 'Layla: In July I am going to work. Maybe I will go to my parents'' after that.'
