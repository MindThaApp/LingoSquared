review: {status: reviewed, required_next_reviewer: null, notes: "Paired with ar a1_unit14_preferences. Review 2026-10-19: 9 fixes - 5 example_glosses dropped the Nour/Yusuf said: frame (and the vocative Yusuf); ماذا تفضل؟ is masculine-only (tufaḍḍil) and no note gave the feminine: what_prefer and line01 notes now give تفضلين and write_preference accepts ماذا تفضلين؟; what_prefer note now warns that تفضل (you prefer) is a different word from تفضل (here you are) taught in unit 07; line02 note was false (أفضل is stronger than أحب), now explains choosing one option; prefer note was vague; like/tea/water notes now explain that Arabic uses ال for things in general (أحب القهوة = I like coffee); translate_dislike_tea, write_like_water, answer_preference and write_preference accept the forms with أنا (used in the unit's own line04); transliterations added. NATIVE FLAGS: none."}
course: {title: Arabic A1, description: "Beginner Modern Standard Arabic (fusha) for everyday exchanges."}
units:
  ar.a1.unit14.preferences: {title: "Preferences"}
lessons:
  ar.a1.unit14.lesson01.likes: {title: "Like and do not like"}
  ar.a1.unit14.lesson02.choices: {title: "What do you prefer?"}
teaching:
  ar.a1.unit14.lesson01.teach.like: {title: "I like", gloss: "I like", note: "أحب (uḥibbu) means I like. Arabic uses ال (the) for things in general, so I like coffee is أحب القهوة, literally I like the coffee.", example_gloss: "I like coffee."}
  ar.a1.unit14.lesson01.teach.tea: {title: "Tea", gloss: "tea", note: "شاي (shāy) is tea; الشاي (ash-shāy) adds ال, as Arabic does when talking about tea in general.", example_gloss: "I do not like tea."}
  ar.a1.unit14.lesson01.teach.dislike: {title: "I do not like", gloss: "I do not like", note: "English speakers may try a separate helping verb; Arabic uses لا before أحب.", example_gloss: "I do not like tea."}
  ar.a1.unit14.lesson01.teach.water: {title: "Water", gloss: "water", note: "الماء (al-māʾ) is ماء (water, from the food unit) with ال, used for water in general.", example_gloss: "I like water."}
  ar.a1.unit14.lesson01.teach.and_not: {title: "And not", gloss: "and not", note: "ولا (wa-lā) is و (and) joined to لا (not): it adds a dislike after a like.", example_gloss: "I like coffee and I do not like tea."}
  ar.a1.unit14.lesson02.teach.prefer: {title: "I prefer", gloss: "I prefer", note: "أفضل (ufaḍḍilu) means I prefer: you choose one option over another.", example_gloss: "I prefer coffee."}
  ar.a1.unit14.lesson02.teach.what_prefer: {title: "What do you prefer?", gloss: "What do you prefer?", note: "تفضل here is tufaḍḍil, you prefer, said to a man; to a woman it is تفضلين (tufaḍḍilīn). It is a different word from تفضل (tafaḍḍal, here you are) in the food unit, although it is written the same.", example_gloss: "Nour said: What do you prefer, Yusuf?"}
  ar.a1.unit14.lesson02.teach.line01: {title: "Nour asks", gloss: "Nour asks Yusuf what he prefers.", note: "نور (Nour) is Yusuf's sister. She says تفضل because she is asking a man; to a woman: ماذا تفضلين؟", example_gloss: "Nour said: What do you prefer, Yusuf?"}
  ar.a1.unit14.lesson02.teach.line02: {title: "Yusuf prefers coffee", gloss: "Yusuf says he prefers coffee.", note: "أفضل picks one option over the others; أحب simply says you like something.", example_gloss: "Yusuf said: I prefer coffee."}
  ar.a1.unit14.lesson02.teach.line03: {title: "Yusuf dislikes tea", gloss: "Yusuf says he does not like tea.", note: "لا أحب expresses dislike simply.", example_gloss: "Yusuf said: I do not like tea."}
  ar.a1.unit14.lesson02.teach.line04: {title: "Nour likes water", gloss: "Nour says she likes water.", note: "أنا can be included for emphasis.", example_gloss: "Nour said: I like water."}
exercises:
  ar.a1.unit14.lesson01.exercise07.dictation_preference_coffee:
    instruction: "Type what you hear."
    correct_option: "أحب القهوة"
    accepted_answers: [{value: "أحب القهوة", status: correct}]
    orthography_strict: true

  ar.a1.unit14.lesson01.exercise01.recognize_like:
    instruction: "Select the meaning."
    correct_option: "I like"
    distractors: ["I do not like", "I bought", "I went"]
    accepted_answers: [{value: "I like", status: correct}]
    feedback: "أحب means I like."
  ar.a1.unit14.lesson01.exercise02.listen_like_coffee:
    instruction: "Listen and select what you hear."
    correct_option: "I like coffee."
    distractors: ["I like tea.", "I do not like coffee.", "I prefer water."]
    accepted_answers: [{value: "I like coffee.", status: correct}]
    feedback: "You heard أحب القهوة."
  ar.a1.unit14.lesson01.exercise03.match_likes:
    instruction: "Match each Arabic preference sentence with its meaning."
    accepted_answers:
      - value: {"أحب القهوة": "I like coffee", "لا أحب الشاي": "I do not like tea"}
        status: correct
    feedback: "لا before أحب changes the preference to a dislike."
  ar.a1.unit14.lesson01.exercise04.order_like_coffee:
    instruction: "Arrange the Arabic words for I like coffee."
    accepted_answers: [{value: [أحب, القهوة], status: correct}]
    feedback: "أحب القهوة means I like coffee."
  ar.a1.unit14.lesson01.exercise05.translate_dislike_tea:
    instruction: "Translate into Arabic: I do not like tea."
    accepted_answers:
      - {value: "لا أحب الشاي", status: correct}
      - {value: "لا أحب الشاي.", status: correct}
      - {value: "أنا لا أحب الشاي", status: correct}
    feedback: "لا أحب الشاي means I do not like tea."
  ar.a1.unit14.lesson01.exercise06.write_like_water:
    instruction: "Type I like water in Arabic."
    accepted_answers:
      - {value: "أحب الماء", status: correct}
      - {value: "أحب الماء.", status: correct}
      - {value: "أنا أحب الماء", status: correct}
    feedback: "أحب الماء states a simple like."
  ar.a1.unit14.lesson02.exercise01.recognize_prefer:
    instruction: "Select the meaning."
    correct_option: "I prefer"
    distractors: ["you prefer", "I sleep", "I ask"]
    accepted_answers: [{value: "I prefer", status: correct}]
    feedback: "أفضل means I prefer."
  ar.a1.unit14.lesson02.exercise02.dialogue_preference:
    instruction: "What does Yusuf prefer?"
    correct_option: coffee
    distractors: [tea, water, apples]
    accepted_answers: [{value: coffee, status: correct}]
    feedback: "Yusuf says أفضل القهوة."
  ar.a1.unit14.lesson02.exercise03.match_preference_lines:
    instruction: "Match each Arabic preference line with its meaning."
    accepted_answers:
      - value: {"ماذا تفضل؟": "What do you prefer?", "أفضل القهوة": "I prefer coffee", "أحب الماء": "I like water"}
        status: correct
    feedback: "These lines ask and answer about preferences."
  ar.a1.unit14.lesson02.exercise04.order_question:
    instruction: "Arrange the Arabic words for What do you prefer?"
    accepted_answers: [{value: [ماذا, تفضل], status: correct}]
    feedback: "ماذا تفضل؟ asks for a preference."
  ar.a1.unit14.lesson02.exercise05.answer_preference:
    instruction: "Type the Arabic answer: I prefer coffee."
    accepted_answers:
      - {value: "أفضل القهوة", status: correct}
      - {value: "أفضل القهوة.", status: correct}
      - {value: "أنا أفضل القهوة", status: correct}
    feedback: "أفضل القهوة is the requested preference answer."
  ar.a1.unit14.lesson02.exercise06.write_preference:
    instruction: "Type the Arabic question and answer: What do you prefer? I prefer coffee."
    accepted_answers:
      - {value: "ماذا تفضل؟ أفضل القهوة.", status: correct}
      - {value: "ماذا تفضل؟ أفضل القهوة", status: correct}
      - {value: "ماذا تفضل أفضل القهوة.", status: correct}
      - {value: "ماذا تفضل أفضل القهوة", status: correct}
      - {value: "ماذا تفضلين؟ أفضل القهوة.", status: correct}
      - {value: "ماذا تفضل؟ أنا أفضل القهوة.", status: correct}
      - {value: "ماذا تفضلين؟ أنا أفضل القهوة.", status: correct}
    feedback: "ماذا تفضل؟ أفضل القهوة. asks about and states a preference."
