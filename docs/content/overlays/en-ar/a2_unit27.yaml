exercises:
  ar.a2.unit27.lesson01.exercise01.recognize_account:
    instruction: "Select the meaning."
    correct_option: account
    distractors: [form, appointment, opinion]
    accepted_answers: [{value: account, status: correct}]
    feedback: "*حساب* means account."
  ar.a2.unit27.lesson01.exercise02.listen_bank_account:
    instruction: "Listen and select what you hear."
    correct_option: "bank account"
    distractors: ["proof of address", passport, "monthly fees"]
    accepted_answers: [{value: "bank account", status: correct}]
    feedback: "You heard *حساب بنكي*."
  ar.a2.unit27.lesson01.exercise03.match_bank_words:
    instruction: "Match each Arabic banking word with its meaning."
    accepted_answers:
      - value: {بنك: bank, حساب: account, "حساب بنكي": "bank account", فتح: opening, "جواز سفر": passport, "إثبات عنوان": "proof of address", عندي: "I have"}
        status: correct
    feedback: "These words cover an account request and required documents."
  ar.a2.unit27.lesson01.exercise04.order_open_account:
    instruction: "Arrange the Arabic words for I want to open a bank account."
    accepted_answers: [{value: [أريد, فتح, حساب, بنكي], status: correct}]
    feedback: "*أريد فتح حساب بنكي* requests a bank account."
  ar.a2.unit27.lesson01.exercise05.write_account_request:
    instruction: "Type exactly this formal Arabic bank request: I want to open a bank account."
    accepted_answers:
      - {value: "أريد فتح حساب بنكي", status: correct}
      - {value: "أريد فتح حساب بنكي.", status: correct}
    feedback: "*أريد فتح حساب بنكي* is the requested formal bank request."
  ar.a2.unit27.lesson02.exercise01.recognize_fee:
    instruction: "Select the meaning."
    correct_option: "monthly fees"
    distractors: ["bank card", "proof of address", passport]
    accepted_answers: [{value: "monthly fees", status: correct}]
    feedback: "*رسوم شهرية* means monthly fees."
  ar.a2.unit27.lesson02.exercise02.dialogue_account_requirements:
    instruction: "Which documents does the bank employee request?"
    correct_option: "A passport and proof of address."
    distractors: ["A form and a passport.", "A phone and a ticket.", "Cash and a bank card."]
    accepted_answers: [{value: "A passport and proof of address.", status: correct}]
    feedback: "The employee asks for *جواز سفر وإثبات عنوان*."
  ar.a2.unit27.lesson02.exercise03.match_bank_lines:
    instruction: "Match each Arabic bank line with its meaning."
    accepted_answers:
      - value: {"أريد فتح حساب بنكي": "I want to open a bank account", "جواز سفر": passport, "إثبات عنوان": "proof of address", "اسمي يوسف خوري": "My name is Yusuf Khoury", "العنوان شارع النور": "The address is Al-Nour Street", "بطاقة بنكية": "bank card", "رسوم شهرية": "monthly fees", "الحساب الأساسي": "the basic account"}
        status: correct
    feedback: "These lines cover the account request, documents, identity, address, and features."
  ar.a2.unit27.lesson02.exercise04.order_documents:
    instruction: "Arrange the Arabic words for I have a passport and proof of address."
    accepted_answers: [{value: [عندي, جواز, سفر, وإثبات, عنوان], status: correct}]
    feedback: "*عندي جواز سفر وإثبات عنوان* states the required documents."
  ar.a2.unit27.lesson02.exercise05.complete_bank_request:
    instruction: "Answer the bank employee in formal Arabic with exactly this content: request to open a bank account, confirm that you have a passport and proof of address, give the name Yusuf Khoury and the address Al-Nour Street building five, then ask whether there is a bank card."
    accepted_answers:
      - {value: "أريد فتح حساب بنكي. نعم، عندي جواز سفر وإثبات عنوان. اسمي يوسف خوري، والعنوان شارع النور، بناية خمسة. هل توجد بطاقة بنكية؟", status: correct}
      - {value: "أريد فتح حساب بنكي، نعم، عندي جواز سفر وإثبات عنوان. اسمي يوسف خوري، والعنوان شارع النور، بناية خمسة. هل توجد بطاقة بنكية؟", status: correct}
      - {value: "أريد فتح حساب بنكي ونعم، عندي جواز سفر وإثبات عنوان. اسمي يوسف خوري، والعنوان شارع النور، بناية خمسة. هل توجد بطاقة بنكية؟", status: correct}
    feedback: "*أريد فتح حساب بنكي. نعم، عندي جواز سفر وإثبات عنوان. اسمي يوسف خوري، والعنوان شارع النور، بناية خمسة. هل توجد بطاقة بنكية؟* completes the bank-account request."
