course:
  title: "Arabic A2"
  description: "Intermediate Arabic continuing the Layla and Yusuf storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Arabic: what happened, what used to happen, what was happening and what had already happened."
units:
  ar.a2.unit83.hal_taarif_ayna: {"title": "Do you know where?", "description": "Ask and answer polite indirect questions with hal ta3rif ayna, matta and ma idha kana, for example to find a station or to check when a shop opens."}
lessons:
  ar.a2.unit83.hal_taarif_ayna.lesson01.ayna: {"title": "Do you know where"}
  ar.a2.unit83.hal_taarif_ayna.lesson02.matta: {"title": "Do you know when"}
  ar.a2.unit83.hal_taarif_ayna.lesson03.ma_idha_kana: {"title": "Whether"}
  ar.a2.unit83.hal_taarif_ayna.lesson04.azunnu: {"title": "I think that"}
  ar.a2.unit83.hal_taarif_ayna.lesson05.reading_yusuf: {"title": "Yusuf in a new city"}
  ar.a2.unit83.hal_taarif_ayna.lesson06.dialogue: {"title": "Layla and Yusuf"}
teaching:
  ar.a2.unit83.hal_taarif_ayna.lesson01.teach.places: {"title": "Places in town", "gloss": "the station / the bank / the pharmacy / the shop / there", "example_gloss": ["The station is over there.", "Where is the bank?"]}
  ar.a2.unit83.hal_taarif_ayna.lesson01.teach.verbs: {"title": "Know and where", "gloss": "question word for yes/no / you know (masc.) / I know / I don't know / where", "example_gloss": ["Do you know where the station is?", "I know where the station is.", "I don't know where the bank is."]}
  ar.a2.unit83.hal_taarif_ayna.lesson01.teach.gn_polite: {"title": "هَلْ تَعْرِفُ أَيْنَ ...؟", "gloss": "Do you know where the station is? I know where the station is.", "note": "A polite way to ask is *هَلْ تَعْرِفُ أَيْنَ* + the place. After *أَيْنَ* the words keep the order of a statement."}
  ar.a2.unit83.hal_taarif_ayna.lesson01.teach.gn_direct: {"title": "Direct and indirect", "gloss": "Where is the bank? Do you know where the bank is? I don't know where the bank is.", "note": "The same words *أَيْنَ الْبَنْك* can stand alone or after *تَعْرِفُ* / *أَعْرِفُ* / *لَا أَعْرِفُ*."}
  ar.a2.unit83.hal_taarif_ayna.lesson02.teach.words: {"title": "When it opens", "gloss": "when / it opens, he opens / it closes, he closes", "example_gloss": ["When does the shop open?", "When does the bank close?"]}
  ar.a2.unit83.hal_taarif_ayna.lesson02.teach.gn_matta: {"title": "هَلْ تَعْرِفُ مَتَى ...؟", "gloss": "Do you know when the shop opens? I don't know when the shop opens.", "note": "After *مَتَى* comes a verb: *يَفْتَحُ* (opens). The question stays a statement in form."}
  ar.a2.unit83.hal_taarif_ayna.lesson02.teach.gn_matta2: {"title": "Where or when", "gloss": "Do you know when the bank closes? I know when the bank closes.", "note": "With *أَيْنَ* a place follows (*أَيْنَ الْبَنْك*); with *مَتَى* a verb follows (*مَتَى يُغْلِقُ الْبَنْك*)."}
  ar.a2.unit83.hal_taarif_ayna.lesson03.teach.words: {"title": "Open or closed", "gloss": "whether (literally: what if it is) / open / closed", "example_gloss": ["Do you know whether the shop is open?"]}
  ar.a2.unit83.hal_taarif_ayna.lesson03.teach.words2: {"title": "Parts of the phrase", "gloss": "what / if / it is", "example_gloss": ["The shop is open."]}
  ar.a2.unit83.hal_taarif_ayna.lesson03.teach.gn_whether: {"title": "مَا إِذَا كَانَ", "gloss": "Do you know whether the shop is open? I don't know whether the bank is closed.", "note": "Use *مَا إِذَا كَانَ* for a yes/no question inside a sentence. After it comes the noun and then the adjective with the ending *-an*."}
  ar.a2.unit83.hal_taarif_ayna.lesson03.teach.gn_whether2: {"title": "The same pattern", "gloss": "Do you know whether the bank is closed?", "note": "The pattern is always *مَا إِذَا كَانَ* + noun + adjective."}
  ar.a2.unit83.hal_taarif_ayna.lesson04.teach.words: {"title": "Price", "gloss": "how much / price / the bread / the medicine / cheap / but", "example_gloss": ["Do you know how much the bread costs?", "I don't know, but I think it is cheap."]}
  ar.a2.unit83.hal_taarif_ayna.lesson04.teach.gn_zann: {"title": "أَظُنُّ أَنَّهُ", "gloss": "I don't know how much the bread costs, but I think it is cheap.", "note": "*أَظُنُّ أَنَّ* means I think that. With a pronoun it becomes *أَنَّهُ* (that it, masc.)."}
  ar.a2.unit83.hal_taarif_ayna.lesson04.teach.gn_zann2: {"title": "أَظُنُّ أَنَّ + noun", "gloss": "I think the station is over there. I think the bank is open.", "note": "With a noun, say *أَنَّ* then the noun and what you think about it."}
  ar.a2.unit83.hal_taarif_ayna.lesson05.teach.text_words: {"title": "Words for the text", "gloss": "I / in / city / new / and not", "example_gloss": ["I am in a new city."]}
  ar.a2.unit83.hal_taarif_ayna.lesson05.teach.reading: {"title": "Yusuf in a new city", "gloss": "I am in a new city. I don't know where the station is, and I don't know when the bank opens. Do you know whether the shop is open?", "note": "A short message with three indirect questions."}
  ar.a2.unit83.hal_taarif_ayna.lesson06.teach.d1: {"title": "Yusuf asks", "gloss": "Yusuf: Excuse me, Layla, do you know where the station is?"}
  ar.a2.unit83.hal_taarif_ayna.lesson06.teach.d2: {"title": "Layla answers", "gloss": "Layla: Yes, I know. The station is over there."}
  ar.a2.unit83.hal_taarif_ayna.lesson06.teach.d3: {"title": "Yusuf asks more", "gloss": "Yusuf: And do you know when the bank opens?"}
  ar.a2.unit83.hal_taarif_ayna.lesson06.teach.d4: {"title": "Layla is not sure", "gloss": "Layla: I don't know, but I think it is open now."}
  ar.a2.unit83.hal_taarif_ayna.lesson06.teach.d5: {"title": "Yusuf thanks her", "gloss": "Yusuf: Thank you, Layla!"}
