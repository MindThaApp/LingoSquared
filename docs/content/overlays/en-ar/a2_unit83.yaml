  ar.a2.unit83.hal_taarif_ayna.lesson01.exercise02.dont_know_bank: {"instruction": "Choose the correct Arabic sentence.", "correct_option": "لَا أَعْرِفُ أَيْنَ الْبَنْك.", "distractors": ["أَعْرِفُ أَيْنَ الْبَنْك.", "لَا أَعْرِفُ أَيْنَ الْمَحَطَّة.", "هَلْ تَعْرِفُ أَيْنَ الْبَنْك؟"], "accepted_answers": [{"value": "لَا أَعْرِفُ أَيْنَ الْبَنْك.", "status": "correct"}], "feedback": "*لَا أَعْرِفُ* = I don't know."}
