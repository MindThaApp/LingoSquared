    title: Yusuf answers
    gloss: 'Yusuf: I usually cycle, it''s not far.'
  ar.a1.unit29.lesson04.teach.sara_wmadha_lw:
    title: Sara asks about rain
    gloss: 'Sara: And when it rains?'
  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: The verb changes with the person
    gloss: 'The verb changes with the person: أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī), يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi).'
    note: The opening letter أ (a-) marks I and ي (ya-) marks he. The ending ي on عملي means my, and the ending ه on عمله means his.
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: Yusuf answers
    gloss: 'Yusuf: Then I take the train, together with Layla.'
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Who travels how?
    gloss: Layla travels by train to work every day. Yusuf usually cycles, but when it rains he also takes the train. Karim prefers to drive the car. Sara lives nearby and walks to work. How do you travel to work?
    note: The verbs of the women (تسافر, تسكن, تمشي) begin with ت (ta-), and the verbs of the men (يركب, يذهب, يقود, يفضل) begin with ي (ya-).
    glosses:
      تسافر: travels
      كل: every
      يوم: day
      بالقطار: by train
      عملها: work
      يركب: cycles
      غالبا: usually
      أمطرت: rains
      يذهب: takes
      يقود: drives
      يفضل: prefers
      السيارة: car
      تسكن: lives
      قريبا: nearby
      وتمشي: walks
      تذهب: travel
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: Sara lives nearby and walks to work
    gloss: Sara lives nearby and walks to work.
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
    title: Layla proposes
    gloss: 'Layla: Shall we cycle together to the language cafe?'
  ar.a1.unit29.lesson06.teach.krym_afdl_an:
    title: Karim prefers the car
    gloss: 'Karim: I''d rather drive the car.'
  ar.a1.unit29.lesson06.teach.sara_amshy_fhw:
    title: Sara will walk
    gloss: 'Sara: I''ll walk, that''s nearby.'
  ar.a1.unit29.lesson06.teach.ywsf_hsna_idhn:
    title: Yusuf agrees
    gloss: 'Yusuf: Good, then I''ll cycle with you, Layla!'
