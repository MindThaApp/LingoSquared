  ar.a1.unit29.lesson02.teach.kthyra_wkl_ywm:
    title: The same words for transport
    gloss: 'كثيرا (kathīran) and كل يوم (kull yawm) are already familiar, and they work with transport too: أركب الدراجة كثيرا (arkab ad-darrāja kathīran), أسافر بالقطار كل يوم (usāfir bi-l-qiṭār kull yawm).'
    note: Reuses the frequency vocabulary established for hobbies/sport, now applied to commuting.
