  ar.a1.unit29.lesson03.teach.and_shbak_altdhakr:
    title: 'Polite requests: من فضلك'
    gloss: 'At a ticket counter say من فضلك (min faḍlik, please) to ask politely: تذكرة إلى القاهرة، من فضلك. It is written the same for a man and a woman.'
    note: Reuses the formal-register precedent already established for service interactions.
  ar.a1.unit29.lesson03.teach.tdhkra_ila_alqahra:
    title: A ticket to Cairo, please
    gloss: A ticket to Cairo, please.
