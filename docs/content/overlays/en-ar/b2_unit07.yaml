review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Overlay for ar's seventh B2 unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) English "can" covers both ability and negotiated
    permission; *يمكنني أن* here specifically marks a NEGOTIATED
    concession, not general ability -- flagged in lesson03; (2)
    *بشرط أن* attaches a real CONDITION to the concession -- a learner
    must not drop it and produce an unconditional "yes", which would
    misrepresent the negotiation; (3) *اتفقنا* (we agreed) is a fixed
    past-tense idiom functioning like an interjection ("deal!") as much
    as a literal statement -- flagged in lesson04/lesson06. No sibling-
    direction file (ar-en b2) was consulted.
    Review 2026-10-19: 6 fixes - the concession 'I can finish on Friday,
    provided I get extra time' was circular (moving Thursday to Friday
    already is the extra time), condition changed to بشرط أن أحصل على
    مساعدة ('provided I get help') across audio, cards, reading,
    exercises and overlay; يمكنني أن gloss/note falsely claimed it marks
    a negotiated concession rather than general ability (it is the
    ordinary 'I can'); comprehend_proposal distractor 'Finishing the
    project on Friday' clashed with Yusuf's own agreement to Friday
    (replaced); added accepted answers without يوم (اتفقنا على الجمعة)
    to write_agree and translate_agree_friday; Arabic commas in two
    examples; provenance note typo يوسف ويوسف -> ليلى ويوسف. NATIVE
    FLAGS: whether أحصل على مساعدة is the most natural condition here;
    ما رأيك لو + past and its English rendering 'What do you think if we
    postponed'.

course:
  title: Arabic B2
  description: >-
    Upper-intermediate Modern Standard Arabic: negotiate an outcome --
    propose terms (أقترح أن، ما رأيك لو), push back on an unacceptable
    one (لا أستطيع الموافقة على), offer a conditional concession
    (يمكنني أن...، بشرط أن...), and reach or decline an agreement
    (اتفقنا / لم نتوصل إلى اتفاق) while keeping the relationship
    intact, around the everyday scenario of negotiating a project
    deadline.

