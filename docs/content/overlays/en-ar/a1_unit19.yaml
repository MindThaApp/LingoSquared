  ar.a1.unit19.lesson01.exercise02.listen_one_room:
    instruction: "Listen and select what you hear."
    correct_option: "In my house there is one room."
    distractors: ["My house is near the library.", "I have a table in the room.", "In my house there is a kitchen."]
    accepted_answers: [{value: "In my house there is one room.", status: correct}]
    feedback: "You heard في بيتي غرفة واحدة."
  ar.a1.unit19.lesson01.exercise03.match_home_words:
    instruction: "Match each Arabic home word with its meaning."
    accepted_answers:
      - value: {بيت: house, غرفة: room, مطبخ: kitchen}
        status: correct
    feedback: "These words describe a basic home."
  ar.a1.unit19.lesson01.exercise04.order_one_room:
    instruction: "Arrange the Arabic words for In my house there is one room."
    accepted_answers: [{value: [في, بيتي, غرفة, واحدة], status: correct}]
    feedback: "في بيتي غرفة واحدة gives a room and quantity."
  ar.a1.unit19.lesson01.exercise05.write_room_sentence:
    instruction: "Type exactly this Arabic home sentence: In my house there is one room."
    accepted_answers:
      - {value: "في بيتي غرفة واحدة", status: correct}
      - {value: "في بيتي غرفة واحدة.", status: correct}
    feedback: "في بيتي غرفة واحدة is the requested home sentence."
  ar.a1.unit19.lesson01.exercise06.dictation_one_room: {correct_response: "في بيتي غرفة واحدة.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit19.lesson02.exercise01.recognize_table:
    instruction: "Select the meaning."
    correct_option: table
    distractors: [room, office, platform]
    accepted_answers: [{value: table, status: correct}]
    feedback: "طاولة means table."
  ar.a1.unit19.lesson02.exercise02.dialogue_home:
    instruction: "Where is Yusuf's house?"
    correct_option: "Near the library."
    distractors: ["Near the market.", "In the office.", "On platform two."]
    accepted_answers: [{value: "Near the library.", status: correct}]
    feedback: "Yusuf says بيتي قرب المكتبة."
  ar.a1.unit19.lesson02.exercise03.match_home_details:
    instruction: "Match each Arabic home detail with its meaning."
    accepted_answers:
      - value: {"بيتي قرب المكتبة": "My house is near the library", "غرفة واحدة": "one room", "طاولة في الغرفة": "a table in the room"}
        status: correct
    feedback: "These details cover location, quantity, and an object."
  ar.a1.unit19.lesson02.exercise04.order_table_room:
    instruction: "Arrange the Arabic words for I have a table in the room."
    accepted_answers: [{value: [عندي, طاولة, في, الغرفة], status: correct}]
    feedback: "عندي طاولة في الغرفة locates the object."
  ar.a1.unit19.lesson02.exercise05.write_home_description:
    instruction: "Type exactly this Arabic home description: My house is near the library. In my house there is one room. I have a table in the room."
    accepted_answers:
      - {value: "بيتي قرب المكتبة. في بيتي غرفة واحدة. عندي طاولة في الغرفة.", status: correct}
      - {value: "بيتي قرب المكتبة في بيتي غرفة واحدة عندي طاولة في الغرفة", status: correct}
      - {value: "بيتي قرب المكتبة. في بيتي غرفة واحدة. عندي طاولة في الغرفة", status: correct}
    feedback: "بيتي قرب المكتبة. في بيتي غرفة واحدة. عندي طاولة في الغرفة. describes location, room, and object."
