teaching:
  ar.a1.unit19.lesson01.teach.house: {title: "House", gloss: "house", note: "بيت (bayt) is a house; the ending ـي means my, so بيتي (baytī) is my house.", example_gloss: "My house is near the library."}
  ar.a1.unit19.lesson01.teach.room: {title: "Room", gloss: "room", note: "غرفة (ghurfa) is feminine (it ends in ة), so the feminine واحدة follows it.", example_gloss: "In my house there is one room."}
  ar.a1.unit19.lesson01.teach.kitchen: {title: "Kitchen", gloss: "kitchen", note: "مطبخ (maṭbakh) is a kitchen. Arabic has no word for there is here: starting with في بيتي (in my house) does that job.", example_gloss: "In my house there is a kitchen."}
  ar.a1.unit19.lesson01.teach.one_room: {title: "One room", gloss: "one room", note: "The number one comes after the noun and agrees with it: غرفة واحدة (ghurfa wāḥida); with a masculine noun it is واحد.", example_gloss: "In my house there is one room."}
  ar.a1.unit19.lesson02.teach.table: {title: "Table", gloss: "table", note: "طاولة (ṭāwila) is a table; like غرفة it ends in ة and is feminine.", example_gloss: "I have a table in the room."}
  ar.a1.unit19.lesson02.teach.in_room: {title: "In the room", gloss: "in the room", note: "الغرفة (al-ghurfa) means the room.", example_gloss: "The table is in the room."}
  ar.a1.unit19.lesson02.teach.near_library: {title: "Near the library", gloss: "near the library", note: "قرب (qurb) means near; المكتبة is the library from the places unit.", example_gloss: "My house is near the library."}
  ar.a1.unit19.lesson02.teach.line01: {title: "Ask where", gloss: "Layla asks where Yusuf's house is.", note: "أين asks where; بيتك (baytuka) means your house, said to a man; to a woman it is baytuki, written the same.", example_gloss: "Layla said: Where is your house, Yusuf?"}
  ar.a1.unit19.lesson02.teach.line02: {title: "House location", gloss: "Yusuf says his house is near the library.", note: "بيتي means my house.", example_gloss: "Yusuf said: My house is near the library."}
  ar.a1.unit19.lesson02.teach.line03: {title: "Rooms", gloss: "Yusuf says his house has one room and a kitchen.", note: "و (wa, and) joins the two home features and is written joined to the next word: ومطبخ.", example_gloss: "Yusuf said: In my house there is one room and a kitchen."}
  ar.a1.unit19.lesson02.teach.line04: {title: "Ask object", gloss: "Layla asks if Yusuf has a table.", note: "هل begins a yes-or-no question; عندك (ʿindaka) means you have, said to a man; to a woman it is ʿindaki, written the same.", example_gloss: "Layla said: Do you have a table?"}
  ar.a1.unit19.lesson02.teach.line05: {title: "Object location", gloss: "Yusuf says he has a table in the room.", note: "عندي states possession.", example_gloss: "Yusuf said: Yes, I have a table in the room."}
