exercises:
  ar.a1.unit07.lesson01.exercise07.dictation_food_order:
    instruction: "Type what you hear."
    correct_option: "أريد ماء وقهوة"
    accepted_answers: [{value: "أريد ماء وقهوة", status: correct}]
    orthography_strict: true

  ar.a1.unit07.lesson01.exercise01.recognize_water:
    instruction: "Select the meaning."
    correct_option: water
    distractors: [coffee, bread, date]
    accepted_answers: [{value: water, status: correct}]
    feedback: "ماء means water."
  ar.a1.unit07.lesson01.exercise02.listen_food_order:
    instruction: "Listen and select the order."
    correct_option: "water and coffee"
    distractors: ["water and bread", "coffee and bread", "bread only"]
    accepted_answers: [{value: "water and coffee", status: correct}]
    feedback: "You heard أريد ماء وقهوة."
  ar.a1.unit07.lesson01.exercise03.match_food:
    instruction: "Match each Arabic item with its meaning."
    accepted_answers:
      - value: {ماء: water, قهوة: coffee, خبز: bread}
        status: correct
    feedback: "These are simple cafe items."
  ar.a1.unit07.lesson01.exercise04.order_i_want_water:
    instruction: "Arrange the Arabic words for I want water."
    accepted_answers: [{value: [أريد, ماء], status: correct}]
    feedback: "أريد ماء means I want water."
  ar.a1.unit07.lesson01.exercise05.translate_coffee:
    instruction: "Translate into Arabic: I want coffee."
    accepted_answers:
      - {value: "أريد قهوة", status: correct}
      - {value: "أريد قهوة.", status: correct}
    feedback: "أريد قهوة means I want coffee."
  ar.a1.unit07.lesson01.exercise06.write_polite_water:
    instruction: "Type I want water, please in Arabic."
    accepted_answers:
      - {value: "أريد ماء من فضلك", status: correct}
      - {value: "أريد ماء من فضلك.", status: correct}
    feedback: "أريد ماء من فضلك is the polite request."
  ar.a1.unit07.lesson02.exercise01.recognize_here_you_are:
    instruction: "Select the meaning."
    correct_option: "here you are"
    distractors: [please, "thank you", "goodbye"]
    accepted_answers: [{value: "here you are", status: correct}]
    feedback: "تفضلي means here you are."
  ar.a1.unit07.lesson02.exercise02.dialogue_requested_items:
    instruction: "What does Layla ask for?"
    correct_option: "water, coffee, and one piece of bread"
    distractors: ["water and coffee only", "coffee and two pieces of bread", "bread and tea"]
    accepted_answers: [{value: "water, coffee, and one piece of bread", status: correct}]
    feedback: "Layla orders ماء، قهوة، وقطعة خبز واحدة."
  ar.a1.unit07.lesson02.exercise03.match_order_lines:
    instruction: "Match each Arabic phrase with its meaning."
    accepted_answers:
      - value: {"أريد ماء": "I want water", "من فضلك": please, تفضلي: "here you are"}
        status: correct
    feedback: "These phrases build a simple order."
  ar.a1.unit07.lesson02.exercise04.order_one_bread:
    instruction: "Arrange the Arabic words for one piece of bread."
    accepted_answers: [{value: [قطعة, خبز, واحدة], status: correct}]
    feedback: "قطعة خبز واحدة means one piece of bread."
  ar.a1.unit07.lesson02.exercise05.place_order:
    instruction: "Type the polite Arabic order for water and coffee."
    accepted_answers:
      - {value: "أريد ماء وقهوة من فضلك", status: correct}
      - {value: "أريد ماء وقهوة من فضلك.", status: correct}
    feedback: "أريد ماء وقهوة من فضلك is the requested order."
  ar.a1.unit07.lesson02.exercise06.respond_followup:
    instruction: "Answer هل تريدين خبزا؟ with Yes, I want one piece of bread."
    accepted_answers:
      - {value: "نعم، أريد قطعة خبز واحدة", status: correct}
      - {value: "نعم أريد قطعة خبز واحدة", status: correct}
      - {value: "نعم، أريد قطعة خبز واحدة.", status: correct}
    feedback: "نعم، أريد قطعة خبز واحدة answers the follow-up question."
