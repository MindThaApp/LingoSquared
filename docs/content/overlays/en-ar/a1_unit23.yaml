teaching:
  ar.a1.unit23.lesson01.teach.phone: {title: "Phone", gloss: "phone", note: "هاتف (hātif) means phone.", example_gloss: "This is a phone."}
  ar.a1.unit23.lesson01.teach.hear: {title: "I hear you", gloss: "I hear you", note: "أسمعك (asmaʿuka to a man, asmaʿuki to a woman) means I hear you; لا أسمعك (lā asmaʿuk) means I cannot hear you.", example_gloss: "I cannot hear you."}
  ar.a1.unit23.lesson01.teach.repeat: {title: "Repeat", gloss: "repeat", note: "أعد (aʿid) is said to a man; to a woman: أعيدي (aʿīdī). أعد من فضلك politely asks someone to repeat.", example_gloss: "I cannot hear you. Please repeat."}
  ar.a1.unit23.lesson01.teach.slowly: {title: "Speak slowly", gloss: "speak slowly", note: "تكلم ببطء (takallam bi-buṭʾ) is said to a man; to a woman: تكلمي ببطء (takallamī bi-buṭʾ).", example_gloss: "Please speak slowly."}
  ar.a1.unit23.lesson02.teach.message: {title: "Message", gloss: "message", note: "رسالة (risāla) is a message; it can also mean a letter.", example_gloss: "This is a message."}
  ar.a1.unit23.lesson02.teach.appointment: {title: "Appointment", gloss: "the appointment", note: "موعد (mawʿid) means appointment; الموعد (al-mawʿid) is the appointment.", example_gloss: "The appointment is at five o'clock."}
  ar.a1.unit23.lesson02.teach.line01: {title: "Answer phone", gloss: "Yusuf greets Layla on the phone and gives his name.", note: "On the phone, أنا يوسف (anā Yūsuf) says who is calling.", example_gloss: "Yusuf said: Hello, I am Yusuf."}
  ar.a1.unit23.lesson02.teach.line02: {title: "Cannot hear", gloss: "Layla says she cannot hear Yusuf.", note: "This sets up the clarification request.", example_gloss: "Layla said: Hello Yusuf, I cannot hear you."}
  ar.a1.unit23.lesson02.teach.line03: {title: "Ask slow speech", gloss: "Layla asks Yusuf to speak slowly.", note: "من فضلك keeps the request polite; Layla says تكلم because she is speaking to a man.", example_gloss: "Layla said: Please speak slowly."}
  ar.a1.unit23.lesson02.teach.line04: {title: "Key detail", gloss: "Yusuf says the appointment is at five o'clock.", note: "في الساعة الخامسة (fī s-sāʿa l-khāmisa) means at five o'clock.", example_gloss: "Yusuf said: The appointment is at five o'clock."}
  ar.a1.unit23.lesson02.teach.line05: {title: "Ask repeat", gloss: "Layla asks Yusuf to repeat.", note: "أعد من فضلك is the repeat request.", example_gloss: "Layla said: Please repeat."}
  ar.a1.unit23.lesson02.teach.line06: {title: "Repeat detail", gloss: "Yusuf repeats the appointment time.", note: "The repeated line confirms the time.", example_gloss: "Yusuf said: The appointment is at five o'clock."}
exercises:
  ar.a1.unit23.lesson01.exercise01.recognize_repeat:
    instruction: "Select the meaning."
    correct_option: repeat
    distractors: [phone, message, appointment]
    accepted_answers: [{value: repeat, status: correct}]
    feedback: "أعد means repeat (said to a man; to a woman: أعيدي)."
  ar.a1.unit23.lesson01.exercise02.listen_repeat:
    instruction: "Listen and select what you hear."
    correct_option: "Please repeat."
    distractors: ["Please speak slowly.", "I cannot hear you.", "The appointment is at five o'clock."]
    accepted_answers: [{value: "Please repeat.", status: correct}]
    feedback: "You heard أعد من فضلك."
  ar.a1.unit23.lesson01.exercise03.match_phone_words:
    instruction: "Match each Arabic phone word with its meaning."
    accepted_answers:
      - value: {هاتف: phone, أسمعك: "I hear you", أعد: repeat, ببطء: slowly, تكلم: speak, "من فضلك": please}
        status: correct
    feedback: "These words help manage a phone call."
  ar.a1.unit23.lesson01.exercise04.order_repeat_request:
    instruction: "Arrange the Arabic words for Please repeat."
    accepted_answers: [{value: [أعد, من, فضلك], status: correct}]
    feedback: "أعد من فضلك asks someone to repeat."
  ar.a1.unit23.lesson01.exercise05.write_slow_request:
    instruction: "Type exactly this Arabic phone clarification request: Please speak slowly."
    accepted_answers:
      - {value: "تكلم ببطء من فضلك", status: correct}
      - {value: "تكلم ببطء من فضلك.", status: correct}
      - {value: "تكلمي ببطء من فضلك", status: correct}
      - {value: "من فضلك تكلم ببطء", status: correct}
      - {value: "من فضلك تكلمي ببطء", status: correct}
    feedback: "تكلم ببطء من فضلك is the requested phone clarification (to a woman: تكلمي ببطء من فضلك)."
  ar.a1.unit23.lesson01.exercise06.dictation_repeat: {correct_response: "أعد من فضلك.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ar.a1.unit23.lesson02.exercise01.recognize_message:
    instruction: "Select the meaning."
    correct_option: message
    distractors: [phone, market, lesson]
    accepted_answers: [{value: message, status: correct}]
    feedback: "رسالة means message."
  ar.a1.unit23.lesson02.exercise02.dialogue_phone:
    instruction: "What is the key detail of the phone call?"
    correct_option: "The appointment is at five o'clock."
    distractors: ["The train is at five o'clock.", "The lesson is at nine o'clock.", "The market is near the library."]
    accepted_answers: [{value: "The appointment is at five o'clock.", status: correct}]
    feedback: "Yusuf says الموعد في الساعة الخامسة."
  ar.a1.unit23.lesson02.exercise03.match_message_lines:
    instruction: "Match each Arabic phone or message line with its meaning."
    accepted_answers:
      - value: {رسالة: message, الموعد: appointment, "لا أسمعك": "I cannot hear you", "أعد من فضلك": "Please repeat", ببطء: slowly, "الساعة الخامسة": "five o'clock"}
        status: correct
    feedback: "These lines cover a phone problem, a repeat request, and the message detail."
  ar.a1.unit23.lesson02.exercise04.order_appointment:
    instruction: "Arrange the Arabic words for The appointment is at five o'clock."
    accepted_answers: [{value: [الموعد, في, الساعة, الخامسة], status: correct}]
    feedback: "الموعد في الساعة الخامسة gives the key detail."
  ar.a1.unit23.lesson02.exercise05.write_phone_message:
    instruction: "Reply in Arabic to Yusuf's phone greeting with these four lines: Hello Yusuf. I cannot hear you. Please speak slowly. Please repeat."
    accepted_answers:
      - {value: "مرحبا يا يوسف. لا أسمعك. تكلم ببطء من فضلك. أعد من فضلك.", status: correct}
      - {value: "مرحبا يا يوسف، لا أسمعك. تكلم ببطء من فضلك. أعد من فضلك.", status: correct}
      - {value: "مرحبا يا يوسف لا أسمعك تكلم ببطء من فضلك أعد من فضلك", status: correct}
      - {value: "مرحبا يا يوسف، لا أسمعك. من فضلك تكلم ببطء. من فضلك أعد.", status: correct}
      - {value: "مرحبا يا يوسف، لا أسمعك. من فضلك تكلم ببطء. أعد من فضلك.", status: correct}
    feedback: "The reply handles the live call with clarification requests."
  ar.a1.unit23.lesson02.exercise06.write_appointment_message:
    instruction: "Type exactly this Arabic message detail: The appointment is at five o'clock."
    accepted_answers:
      - {value: "الموعد في الساعة الخامسة.", status: correct}
      - {value: "الموعد في الساعة الخامسة", status: correct}
    feedback: "الموعد في الساعة الخامسة. gives the appointment detail."
