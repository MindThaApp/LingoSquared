exercises:
  ar.b1.unit49.lesson01.exercise01.recognize_bikhtisar:
    instruction: "Select the meaning."
    correct_option: "In short, the government will build a new bridge"
    distractors: ["In short, the government built a new bridge", "In detail, the government will build a new bridge", "In short, the government will not build a new bridge"]
    accepted_answers: [{value: "In short, the government will build a new bridge", status: correct}]
    feedback: "*باختصار ستبني الحكومة جسرا جديدا* is the main-point summary."
  ar.b1.unit49.lesson01.exercise02.recognize_bikhtisar_full:
    instruction: "Select the meaning."
    correct_option: "In short, the government will build a new bridge next year"
    distractors: ["In short, the government built a new bridge last year", "In short, the government will build a new road next year", "In detail, the government will build a new bridge next year"]
    accepted_answers: [{value: "In short, the government will build a new bridge next year", status: correct}]
    feedback: "*باختصار ستبني الحكومة جسرا جديدا العام القادم* is the article's main point."
  ar.b1.unit49.lesson01.exercise03.listen_select_bikhtisar:
    instruction: "Listen and select what Yusuf says."
    correct_option: "In short, the government will build a new bridge next year."
    distractors: ["In short, the government built a new bridge last year.", "In short, the government will build a new road next year.", "In detail, the government will build a new bridge next year."]
    accepted_answers: [{value: "In short, the government will build a new bridge next year.", status: correct}]
    feedback: "You heard *باختصار، ستبني الحكومة جسرا جديدا العام القادم*."
  ar.b1.unit49.lesson01.exercise04.match_bikhtisar:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {باختصار: "in short", ستبني: "will build", الحكومة: "the government", جسرا: bridge, جديدا: new, "العام القادم": "next year", "ستبني الحكومة": "the government will build", "جسرا جديدا": "a new bridge"}
        status: correct
    feedback: "These phrases cover the main-point summary."
  ar.b1.unit49.lesson01.exercise05.order_bikhtisar:
    instruction: "Arrange the Arabic words for In short, the government will build a new bridge next year."
    accepted_answers: [{value: [باختصار, ستبني, الحكومة, جسرا, جديدا, العام, القادم], status: correct}]
    feedback: "*باختصار، ستبني الحكومة جسرا جديدا العام القادم* is a one-sentence main-point summary."
  ar.b1.unit49.lesson01.exercise06.write_bikhtisar:
    instruction: "Write exactly this one-sentence main-point summary using باختصار: In short, the government will build a new bridge next year."
    accepted_answers:
      - {value: "باختصار ستبني الحكومة جسرا جديدا العام القادم", status: correct}
      - {value: "باختصار، ستبني الحكومة جسرا جديدا العام القادم.", status: correct}
    feedback: "*باختصار، ستبني الحكومة جسرا جديدا العام القادم.* is the requested sentence."
  ar.b1.unit49.lesson02.exercise01.recognize_bialidafa:
    instruction: "Select the meaning."
    correct_option: "In addition to that, the bridge will reduce travel time"
    distractors: ["In addition to that, the bridge reduced travel time", "In short, the bridge will reduce travel time", "In addition to that, the bridge will increase travel time"]
    accepted_answers: [{value: "In addition to that, the bridge will reduce travel time", status: correct}]
    feedback: "*بالإضافة إلى ذلك سيقلل الجسر وقت السفر* is a supporting detail."
  ar.b1.unit49.lesson02.exercise02.recognize_bialidafa_full:
    instruction: "Select the meaning."
    correct_option: "In addition to that, the bridge will reduce travel time between the two cities"
    distractors: ["In addition to that, the bridge reduced travel time between the two cities", "In short, the bridge will reduce travel time between the two cities", "In addition to that, the bridge will increase travel time between the two cities"]
    accepted_answers: [{value: "In addition to that, the bridge will reduce travel time between the two cities", status: correct}]
    feedback: "*بالإضافة إلى ذلك سيقلل الجسر وقت السفر بين المدينتين* adds the supporting detail."
  ar.b1.unit49.lesson02.exercise03.listen_select_bialidafa:
    instruction: "Listen and select what Yusuf says."
    correct_option: "In addition to that, the bridge will reduce travel time between the two cities."
    distractors: ["In addition to that, the bridge reduced travel time between the two cities.", "In short, the bridge will reduce travel time between the two cities.", "In addition to that, the bridge will increase travel time between the two cities."]
    accepted_answers: [{value: "In addition to that, the bridge will reduce travel time between the two cities.", status: correct}]
    feedback: "You heard *بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين*."
  ar.b1.unit49.lesson02.exercise04.match_bialidafa:
    instruction: "Match each Arabic word or phrase with its meaning."
    accepted_answers:
      - value: {"بالإضافة إلى ذلك": "in addition to that", سيقلل: "will reduce", الجسر: "the bridge", "وقت السفر": "travel time", "بين المدينتين": "between the two cities", "سيقلل الجسر": "the bridge will reduce", المدينتين: "the two cities", وقت: time}
        status: correct
    feedback: "These phrases cover the supporting detail."
  ar.b1.unit49.lesson02.exercise05.order_bialidafa:
    instruction: "Arrange the Arabic words for In addition to that, the bridge will reduce travel time between the two cities."
    accepted_answers: [{value: [بالإضافة, إلى, ذلك, سيقلل, الجسر, وقت, السفر, بين, المدينتين], status: correct}]
    feedback: "*بالإضافة إلى ذلك سيقلل الجسر وقت السفر بين المدينتين* adds a supporting detail."
  ar.b1.unit49.lesson02.exercise06.write_bialidafa:
    instruction: "Write exactly this supporting detail using بالإضافة إلى ذلك: In addition to that, the bridge will reduce travel time between the two cities."
    accepted_answers:
      - {value: "بالإضافة إلى ذلك سيقلل الجسر وقت السفر بين المدينتين", status: correct}
      - {value: "بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.", status: correct}
    feedback: "*بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.* is the requested sentence."
  ar.b1.unit49.lesson03.exercise01.choose_main_point:
    instruction: "Which answer states the MAIN POINT of the article, not a supporting detail?"
    correct_option: "باختصار، ستبني الحكومة جسرا جديدا العام القادم"
    distractors: ["بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين", "هل قرأت شيئا مثيرا للاهتمام اليوم؟", "نعم، قرأت مقالا عن مشروع جديد"]
    accepted_answers: [{value: "باختصار، ستبني الحكومة جسرا جديدا العام القادم", status: correct}]
    feedback: "*باختصار، ستبني الحكومة جسرا جديدا العام القادم* is the main point; the travel-time sentence is a supporting detail."
  ar.b1.unit49.lesson03.exercise02.dialogue_comprehension_talkhis:
    instruction: "Listen to the dialogue and answer."
    correct_option: "Yusuf retells an article: the government will build a new bridge next year, and it will also reduce travel time between the two cities."
    distractors: ["Yusuf says the bridge was already built last year.", "Yusuf has not read anything interesting today.", "Yusuf says the government will not build the bridge."]
    accepted_answers: [{value: "Yusuf retells an article: the government will build a new bridge next year, and it will also reduce travel time between the two cities.", status: correct}]
    feedback: "Yusuf gives the main point first, then adds the supporting detail."
  ar.b1.unit49.lesson03.exercise03.match_dialogue_talkhis:
    instruction: "Match each Arabic sentence or phrase with its meaning."
    accepted_answers:
      - value: {"هل قرأت شيئا مثيرا للاهتمام اليوم؟": "Did you read something interesting today?", "نعم، قرأت مقالا عن مشروع جديد.": "Yes, I read an article about a new project.", "باختصار، ستبني الحكومة جسرا جديدا العام القادم.": "In short, the government will build a new bridge next year.", "بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.": "In addition to that, the bridge will reduce travel time between the two cities.", باختصار: "in short", "بالإضافة إلى ذلك": "in addition to that"}
        status: correct
    feedback: "These lines cover the full retelling of the article."
  ar.b1.unit49.lesson03.exercise04.order_hal_qarat:
    instruction: "Arrange the Arabic words for Did you read something interesting today?"
    accepted_answers: [{value: [هل, قرأت, شيئا, مثيرا, للاهتمام, اليوم], status: correct}]
    feedback: "*هل قرأت شيئا مثيرا للاهتمام اليوم؟* opens the request to retell."
  ar.b1.unit49.lesson03.exercise05.reply_summarize_article:
    instruction: "Laila says: Yes, I read an article about a new project. Reply as Yusuf, giving the main point and one supporting detail."
    accepted_answers:
      - {value: "باختصار ستبني الحكومة جسرا جديدا العام القادم بالإضافة إلى ذلك سيقلل الجسر وقت السفر بين المدينتين", status: correct}
      - {value: "باختصار، ستبني الحكومة جسرا جديدا العام القادم. بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.", status: correct}
    feedback: "*باختصار، ستبني الحكومة جسرا جديدا العام القادم. بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.* is Yusuf's retelling."
  ar.b1.unit49.lesson03.exercise06.write_full_talkhis:
    instruction: "As Yusuf, retell the article in two sentences: first, the main point using باختصار (in short, the government will build a new bridge next year); then a supporting detail using بالإضافة إلى ذلك (in addition to that, the bridge will reduce travel time between the two cities)."
    accepted_answers:
      - {value: "باختصار ستبني الحكومة جسرا جديدا العام القادم بالإضافة إلى ذلك سيقلل الجسر وقت السفر بين المدينتين", status: correct}
      - {value: "باختصار، ستبني الحكومة جسرا جديدا العام القادم. بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.", status: correct}
    feedback: "*باختصار، ستبني الحكومة جسرا جديدا العام القادم. بالإضافة إلى ذلك، سيقلل الجسر وقت السفر بين المدينتين.* links the main point to a supporting detail, as required."
