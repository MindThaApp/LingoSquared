teaching:
  ar.a1.unit20.lesson01.teach.weather: {title: "Weather", gloss: "the weather", note: "الجو (al-jaww) is the everyday word for the weather; الطقس (aṭ-ṭaqs), in the unit title, also means weather.", example_gloss: "How is the weather today?"}
  ar.a1.unit20.lesson01.teach.sunny: {title: "Sunny", gloss: "sunny", note: "مشمس (mushmis) means sunny; it is masculine to agree with الجو.", example_gloss: "The weather is sunny today."}
  ar.a1.unit20.lesson01.teach.cold: {title: "Cold", gloss: "cold", note: "بارد (bārid) means cold.", example_gloss: "The weather is cold today."}
  ar.a1.unit20.lesson01.teach.sunny_today: {title: "Sunny today", gloss: "The weather is sunny today", note: "Arabic does not need a separate word for is.", example_gloss: "Yusuf said: The weather is sunny today."}
  ar.a1.unit20.lesson02.teach.hot: {title: "Hot", gloss: "hot", note: "حار (ḥārr) means hot.", example_gloss: "The weather is hot."}
  ar.a1.unit20.lesson02.teach.weather_question: {title: "How is the weather?", gloss: "How is the weather today?", note: "كيف (kayfa) asks how, as in كيف حالك؟", example_gloss: "Layla said: How is the weather today?"}
  ar.a1.unit20.lesson02.teach.drink_water_plan: {title: "Let's drink water", gloss: "let's drink water", note: "هيا (hayyā) + a we-verb means let's; نشرب (nashrab) means we drink.", example_gloss: "The weather is hot. Let's drink water."}
  ar.a1.unit20.lesson02.teach.line01: {title: "Ask weather", gloss: "Layla asks about today's weather.", note: "اليوم means today.", example_gloss: "Layla said: How is the weather today?"}
  ar.a1.unit20.lesson02.teach.line02: {title: "Sunny and hot", gloss: "Yusuf says the weather is sunny and hot.", note: "و (wa, and) joins the two weather words and is written joined to the next word: وحار.", example_gloss: "Yusuf said: The weather is sunny and hot."}
  ar.a1.unit20.lesson02.teach.line03: {title: "Suggest the cafe", gloss: "Layla suggests going to the cafe.", note: "هل نذهب asks shall we go.", example_gloss: "Layla said: Shall we go to the cafe?"}
  ar.a1.unit20.lesson02.teach.line04: {title: "Water plan", gloss: "Yusuf says yes and suggests drinking water.", note: "هيا نشرب means let's drink.", example_gloss: "Yusuf said: Yes, let's drink water."}
