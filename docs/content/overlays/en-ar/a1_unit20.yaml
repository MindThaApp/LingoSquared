exercises:
  ar.a1.unit20.lesson01.exercise01.recognize_sunny:
    instruction: "Select the meaning."
    correct_option: sunny
    distractors: [cold, hot, close]
    accepted_answers: [{value: sunny, status: correct}]
    feedback: "مشمس means sunny."
  ar.a1.unit20.lesson01.exercise02.listen_sunny:
    instruction: "Listen and select what you hear."
    correct_option: "The weather is sunny today."
    distractors: ["The weather is cold today.", "The weather is hot today.", "We drink water today."]
    accepted_answers: [{value: "The weather is sunny today.", status: correct}]
    feedback: "You heard الجو مشمس اليوم."
  ar.a1.unit20.lesson01.exercise03.match_weather_words:
    instruction: "Match each Arabic weather word with its meaning."
    accepted_answers:
      - value: {الجو: weather, مشمس: sunny, بارد: cold}
        status: correct
    feedback: "These words describe basic weather."
  ar.a1.unit20.lesson01.exercise04.order_sunny_today:
    instruction: "Arrange the Arabic words for The weather is sunny today."
    accepted_answers: [{value: [الجو, مشمس, اليوم], status: correct}]
    feedback: "الجو مشمس اليوم describes today's weather."
  ar.a1.unit20.lesson01.exercise05.write_weather_note:
    instruction: "Type exactly this Arabic weather note: The weather is sunny today."
    accepted_answers:
      - {value: "الجو مشمس اليوم", status: correct}
      - {value: "الجو مشمس اليوم.", status: correct}
    feedback: "الجو مشمس اليوم is the requested weather note."
  ar.a1.unit20.lesson02.exercise01.recognize_hot:
    instruction: "Select the meaning."
    correct_option: hot
    distractors: [sunny, cold, cheaper]
    accepted_answers: [{value: hot, status: correct}]
    feedback: "حار means hot."
  ar.a1.unit20.lesson02.exercise02.dialogue_weather:
    instruction: "How is the weather?"
    correct_option: "Sunny and hot."
    distractors: ["Cold and rainy.", "Close and cheap.", "Late and busy."]
    accepted_answers: [{value: "Sunny and hot.", status: correct}]
    feedback: "Yusuf says الجو مشمس وحار."
  ar.a1.unit20.lesson02.exercise03.match_weather_plan:
    instruction: "Match each Arabic weather or plan line with its meaning."
    accepted_answers:
      - value: {"الجو مشمس وحار": "The weather is sunny and hot", "نذهب إلى المقهى": "We go to the cafe", "نشرب ماء": "We drink water"}
        status: correct
    feedback: "The lines connect the weather to a simple plan."
  ar.a1.unit20.lesson02.exercise04.order_drink_water:
    instruction: "Arrange the Arabic words for We drink water."
    accepted_answers: [{value: [نشرب, ماء], status: correct}]
    feedback: "نشرب ماء is a simple plan."
  ar.a1.unit20.lesson02.exercise05.describe_weather_plan:
    instruction: "Type exactly this Arabic weather sentence and plan: The weather is hot today. We drink water."
    accepted_answers:
      - {value: "الجو حار اليوم. نشرب ماء.", status: correct}
      - {value: "الجو حار اليوم نشرب ماء", status: correct}
      - {value: "الجو حار اليوم. نشرب ماء", status: correct}
    feedback: "الجو حار اليوم. نشرب ماء. describes the weather and gives a plan."
