teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Animale* کلمهٔ عمومی است؛ *animale domestico* یعنی حیوان خانگی (لفظاً حیوان اهلی).'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم است.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: سگ و پشک
    gloss: سگ / پشک
    example_gloss:
    - Giulia یک سگ دارد.
    - Luca یک پشک دارد.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدرکلان یک ماهی دارد.
    - Nina یک پرنده دارد.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: '*Hai ...?* شکل *tu* فعل *avere* است. فقط لحن صدا جمله را به سوال تبدیل می‌کند.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: بلی، سگ دارم
    gloss: بلی، یک سگ دارم.
    note: یک جواب مثبت ساده با واژه‌های جدید این درس.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'برای گفتن اینکه چیزی نداری، *non* را پیش از فعل بگذار: *non ho*. به یادداشت گرامر نگاه کن.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non پیش از فعل
    gloss: 'برای گفتن اینکه چیزی نداری، non را پیش از فعل بگذار: Non ho tempo, Non ho animali domestici.'
    note: 'بعد از *non ho* معمولاً اسم بدون حرف تعریف می‌آید: *non ho tempo*, *non ho animali*.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: گشت دادن (حیوان)
    gloss: حیوان را به گشت بردن
    note: '*Portare a spasso* یک عبارت ثابت برای قدم زدن با حیوان است. ضمیر پیش از فعل می‌آید: *lo porto a spasso*.'
    example_gloss: من هر روز سگ را به گشت می‌برم.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: ضمیر پیش از فعل می‌آید
    gloss: 'ضمیر lo به جای سگ می‌آید و پیش از فعل قرار می‌گیرد: lo porto a spasso, gli do da mangiare.'
    note: 'در ایتالیایی ضمیرهای *lo* و *gli* پیش از فعل می‌آیند: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به پشک غذا می‌دهم.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: Luca با پشکش بازی می‌کند.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: من هر روز سگ را به گشت می‌برم
    gloss: من هر روز سگ را به گشت می‌برم.
    note: '*Ogni giorno* (هر روز) در آخر جمله می‌آید، مثل *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: من هر روز به پشک غذا می‌دهم
    gloss: من هر روز به پشک غذا می‌دهم.
    note: '*Dare da mangiare* (غذا دادن) لفظاً «دادن برای خوردن» است. *Do* شکل *io* فعل *dare* است.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'جمع: il cane -> i cani'
    gloss: 'در جمع، مصوت آخر و حرف تعریف تغییر می‌کند: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: الگوی عادی جمع در ایتالیایی، که اینجا برای بار اول با اسم‌های حیوانات نشان داده می‌شود.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: سگ‌ها و پشک‌ها
    gloss: سگ‌ها / پشک‌ها
    example_gloss:
    - Marco سگ‌ها را دوست دارد.
    - Chiara پشک‌ها را دوست دارد.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - کاکا پرنده‌ها را خیلی دوست دارد.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: من حیوانات را خیلی دوست دارم
    gloss: من حیوانات را خیلی دوست دارم.
    note: '*Amare* (دوست داشتن) مفعولش را مستقیم می‌گیرد: *amo gli animali*. اسم جمع حرف تعریف جمع *gli* لازم دارد.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara پشک‌ها را دوست دارد، اما حیوان خانگی ندارد
    gloss: Chiara پشک‌ها را دوست دارد، اما حیوان خانگی ندارد.
    note: زمینه را برای تضادی آماده می‌کند که متن خواندنی بعدی بر آن ساخته شده است.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco در مورد حیوان خانگی می‌پرسد
    gloss: 'Marco: Giulia، تو حیوان خانگی داری؟'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia یک سگ دارد
    gloss: 'Giulia: بلی، یک سگ دارم.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco می‌پرسد سگ چطور است
    gloss: 'Marco: چطور است؟'
    note: '*Com''è?* برای حیوانات هم استفاده می‌شود. در جواب *è* یا *ha* می‌آید: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia سگش را توصیف می‌کند
    gloss: 'Giulia: موی قهوه‌یی دارد و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر و قیافه دوباره آمده‌اند، این بار برای توصیف پشم یک حیوان، نه موی یک شخص.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: حیوانات مذکر یا مؤنث‌اند
    gloss: 'حیوان مثل انسان مذکر یا مؤنث است: il cane یعنی lui، la gatta یعنی lei.'
    note: در ایتالیایی هر اسم مذکر یا مؤنث است و برای چیز بی‌جان ضمیر جداگانه‌یی وجود ندارد؛ پس سگ *lui* و پشک ماده *lei* است و ضمیرها هم از آن پیروی می‌کنند (*lo*, *la*).
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco در مورد قدم زدن می‌پرسد
    gloss: 'Marco: هر روز او را به قدم زدن می‌بری؟'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia برنامهٔ روزانه‌اش را می‌گوید
    gloss: 'Giulia: بلی، هر روز او را به قدم زدن می‌برم و به او غذا می‌دهم.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco، Chiara و Luca در مورد حیوانات
    gloss: 'Marco و Chiara هر دو حیوانات را دوست دارند، اما هیچ‌کدام شان حیوان خانگی ندارد. Marco سگ‌ها را دوست دارد و Chiara پشک‌ها را. اما Luca حیوان خانگی دارد: یک پشک. او اکثراً با پشکش بازی می‌کند و هر روز به آن غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      amano: خیلی دوست دارند
      entrambi: هر دو
      animali: حیوانات
      due: دو (nessuno dei due = هیچ‌کدام از آن دو)
      domestico: اهلی (animale domestico = حیوان خانگی)
      cani: سگ‌ها
      gatti: پشک‌ها
      gatto: پشک
      gioca: بازی می‌کند
      dà: می‌دهد
      ogni: هر
      mangiare: خوردن (dare da mangiare = غذا دادن)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca اکثراً با پشکش بازی می‌کند
    gloss: Luca اکثراً با پشکش بازی می‌کند.
    note: '*Spesso* (اکثراً) بعد از فعل می‌آید: *gioca spesso*. *Giocare con* یعنی با کسی بازی کردن.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia از Nina می‌پرسد
    gloss: 'Giulia: Nina، تو هم حیوان خانگی داری؟'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina یک پرنده به نام Pico دارد
    gloss: 'Nina: بلی، یک پرنده دارم. نامش Pico است.'
    note: '*Si chiama Pico* یعنی نامش Pico است، لفظاً «خود را Pico صدا می‌کند».'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: واکنش Marco
    gloss: 'Marco: چه خوب! هر روز با او چه کار می‌کنی؟'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina هر روز به او غذا می‌دهد
    gloss: 'Nina: هر روز به او غذا می‌دهم.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco هم پرنده‌ها را دوست دارد
    gloss: 'Marco: من هم پرنده‌ها را دوست دارم.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia صحبت را تمام می‌کند
    gloss: 'Giulia: چه خوب که هر سه ما حیوانات را دوست داریم!'
    note: جملهٔ پایانی که معلومات حیوانات هر سه شخصیت را به هم وصل می‌کند.
