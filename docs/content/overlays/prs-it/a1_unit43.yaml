course:
  title: ایتالیایی A1
  description: 'ایتالیایی مبتدی برای صحبت در مورد حیوانات خانگی و حیوانات معمولی: نام بردن آن‌ها، مراقبت ساده (قدم زدن، غذا دادن، بازی کردن)، گفتن اینکه کدام حیوان را دوست داری حتی اگر نداشته باشی، و جمع در ایتالیایی.'
