teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: ترجیح دادن، ترجیح می‌دهم
    note: '*preferire* (ترجیح دادن) فعل گروه -ire است و در بیشتر شکل‌های زمان حال -isc- می‌گیرد؛ *preferisco* یعنی «ترجیح می‌دهم».'
    example_gloss:
    - چای را به قهوه ترجیح می‌دهم.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: قهوه را ترجیح می‌دهی یا چای؟
    note: '*Preferisci* (ترجیح می‌دهی) همراه با *o* (یا) انتخاب بین دو چیز را می‌پرسد.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: من قهوه را ترجیح می‌دهم.
    note: '*Preferisco* (ترجیح می‌دهم) همراه با *il caffè* (قهوه) یک ترجیح را بیان می‌کند.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: کروسانت را خیلی دوست دارم.
    note: '*Mi piace* (برایم خوشایند است / دوست دارم) همراه با *molto* (خیلی) علاقهٔ زیاد را می‌رساند.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: صبح‌ها چای را دوست ندارم.
    note: '*Non mi piace* (دوست ندارم) ساختار دوست‌داشتن را منفی می‌کند؛ *la mattina* یعنی «صبح‌ها».'
    example_gloss:
    - شب‌ها قهوه را دوست ندارم.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: و شما؟
    note: '*E a te?* (و به تو؟) از طرف مقابل می‌پرسد که خودش چه ترجیحی دارد.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: من هم قهوه را ترجیح می‌دهم!
    note: '*Anch''io* (من هم) با چیزی موافقت می‌کند که کسی با *preferisco* گفته است. (برای موافقت با جملهٔ *mi piace*، در ایتالیایی می‌گویند *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: من نه، من چای را ترجیح می‌دهم.
    note: '*A me no* (من نه) با جملهٔ *mi piace* مخالفت می‌کند و بعد ترجیح خود را می‌گوید (مثل *a me* در ساختار دوست‌داشتن). برای مخالفت با جملهٔ *preferisco*، در ایتالیایی به جای آن می‌گویند *Io no*.'
    example_gloss:
    - من نه، من قهوه را ترجیح می‌دهم.
