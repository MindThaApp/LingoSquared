teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل معمول سرگرمی در مصدر: *leggere* (خواندن)، *fare sport* (ورزش کردن) و *cucinare* (آشپزی کردن). مصدرهای ایتالیایی به -are، -ere یا -ire ختم می‌شوند.'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Il tempo libero* اسم مذکر است، به همین دلیل *il* می‌گیرد. این عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌هاست.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Leggo* شکل *io* فعل *leggere* (خواندن) است. مثل دری، ایتالیایی هم ضمیر فاعل را می‌اندازد: بگویین *Leggo*، نه *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *ascoltare musica* (موسیقی گوش دادن)، *disegnare* (نقاشی کشیدن) و *giocare ai videogiochi* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*Ascoltare* مفعولش را مستقیم می‌گیرد: *ascolto musica*، بدون هیچ حرف اضافه در میان. در دری می‌گوییم «به موسیقی گوش می‌دهم»، ولی در ایتالیایی حرف اضافه نمی‌آید.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*Con gli amici* یعنی با دوستان. *Gli* حرف تعریف جمع پیش از اسم مذکری است که با مصوت شروع می‌شود.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید تکرار. *Mai* (هیچ‌وقت) پیش از فعل *non* می‌خواهد: *non gioco mai*.'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Ogni* (هر) هیچ‌وقت تغییر نمی‌کند: *ogni settimana*، *ogni fine settimana*. کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai با non می‌آید؛ ogni تغییر نمی‌کند
    gloss: 'با mai فعل، non هم می‌گیرد: Non gioco mai. Ogni برای همهٔ اسم‌ها یکسان می‌ماند: ogni settimana, ogni fine settimana.'
    note: 'در دری هم فعل منفی با «هیچ‌وقت» می‌آید: «بازی نمی‌کنم هیچ‌وقت»؛ ایتالیایی هم می‌گوید *non gioco mai*. بعد از *ogni* همیشه اسم مفرد می‌آید.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: جولیا صحبت سرگرمی‌ها را شروع می‌کند
    gloss: 'جولیا: ما اغلب با هم قدم می‌زنیم. ولی تو در وقت فارغ دیگر چه کار می‌کنی، مارکو؟'
    note: '*Passeggiamo* شکل *noi* (ما) فعل *passeggiare* است. *Spesso* بعد از فعل می‌آید.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: سرگرمی‌های مارکو
    gloss: 'مارکو: من با علاقه آشپزی می‌کنم، در خانه هم. و اغلب ورزش می‌کنم.'
    note: '*Anche a casa* (در خانه هم) نشان می‌دهد که مارکو برای تفریح آشپزی می‌کند، نه فقط در کار. *A casa* یعنی در خانه، بدون حرف تعریف.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: جولیا تعجب می‌کند
    gloss: 'جولیا: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کار آشپزی می‌کنی!'
    note: '*Già* (قبلاً، همین حالا هم) و *tutto il giorno* (تمام روز) نشان می‌دهند که مارکو در کار چقدر آشپزی می‌کند.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: مارکو توضیح می‌دهد
    gloss: 'مارکو: بلی، ولی آشپزی به من آرامش می‌دهد. و تو، چه کار کردن را دوست داری؟'
    note: '*Cucinare mi rilassa* تحت‌اللفظی یعنی «آشپزی مرا آرام می‌کند»: کار، فاعل جمله است و *mi* (مرا) مفعول.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: سرگرمی‌های جولیا
    gloss: 'جولیا: با علاقه کتاب می‌خوانم و اغلب موسیقی گوش می‌دهم.'
    note: 'دو سرگرمی که با *e* (و) وصل شده‌اند. هر دو فعل به شکل *io* می‌مانند: *leggo* و *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: مارکو دربارهٔ بازی می‌پرسد
    gloss: 'مارکو: بازی ویدیویی هم می‌کنی؟'
    note: 'سؤال بلی/نخیر ترتیب جملهٔ خبری را نگه می‌دارد و فقط آهنگ صدا بالا می‌رود: *Giochi anche ai videogiochi?* *Anche* یعنی هم.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: جولیا جواب می‌دهد
    gloss: 'جولیا: نخیر، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Non ... mai* (هیچ‌وقت) و *a volte* (گاهی) در یک جواب در برابر هم آمده‌اند. *Ma* یعنی ولی.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و مارکو اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. مارکو با علاقه آشپزی می‌کند، در خانه هم، و اغلب ورزش می‌کند. من با علاقه کتاب می‌خوانم و اغلب موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو در وقت فارغ چه کار کردن را دوست داری؟
    note: پیام جولیا آنچه را در این درس آمده خلاصه می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      passeggiamo: قدم می‌زنیم
      spesso: اکثراً
      insieme: با هم
      altri: دیگر
      cucina: آشپزی می‌کند
      volentieri: با علاقه
      casa: خانه (a casa = در خانه)
      sport: ورزش (fa sport = ورزش می‌کند)
      leggo: خواندن
      ascolto: گوش می‌کنم
      musica: موسیقی
      disegno: نقاشی می‌کنم
      volte: بار (a volte = گاهی)
      videogiochi: بازی‌های ویدیویی
      mai: هرگز
      libero: آزاد
      tempo: وقت
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: مارکو دربارهٔ آخر هفته می‌پرسد
    gloss: 'مارکو: این آخر هفته چه کار می‌کنی؟'
    note: '*Questo fine settimana* (این آخر هفته) مذکر است، پس *questo* می‌آید. *Fai* شکل *tu* فعل *fare* (کردن) است.'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: جولیا هنوز تصمیم نگرفته
    gloss: 'جولیا: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*Non lo so ancora* (هنوز نمی‌دانم): *lo* به چیزی اشاره دارد که نمی‌دانید و پیش از فعل می‌آید. *Uscire* یعنی بیرون رفتن.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: مارکو یک برنامه پیشنهاد می‌کند
    gloss: 'مارکو: با هم قدم بزنیم؟ بعد از آن من برای ما آشپزی می‌کنم.'
    note: '*Poi* (بعد، بعد از آن) برنامه‌ها را به ترتیب می‌آورد. *Cucino io* (با *io* بعد از فعل) روی «من آشپزی می‌کنم» تأکید می‌کند.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: جولیا موافقت می‌کند
    gloss: 'جولیا: فکر خوبی است! هم قدم زدن را دوست دارم هم آشپزی را.'
    note: '*Sia ... sia ...* یعنی هم ... هم ...: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: مارکو تأیید می‌کند
    gloss: 'مارکو: عالی. پس شنبه همدیگر را می‌بینیم!'
    note: '*Ci vediamo sabato* (شنبه می‌بینیمت): وقتی منظور شنبهٔ آینده باشد، پیش از نام روز حرف تعریف نمی‌آید.'
