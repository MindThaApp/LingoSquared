  it.a1.unit03.lesson01.contare_da_zero_a_dieci:
    title: شمردن از صفر تا ده
  it.a1.unit03.lesson02.quanto_costa_al_bar:
    title: قیمتش چند است؟ سفارش در کافه
  it.a1.unit03.lesson03.il_numero_di_telefono:
    title: عوض کردن نمبر تلیفون
teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: صفر، یک، دو، سه، چهار، پنج
    note: شش عدد اول، اساس قیمت‌ها، سن و نمبر تلیفون در این بخش.
    example_gloss:
    - من دو برادر دارم.
    - ساعت پنج است.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: شش، هفت، هشت، نه، ده
    note: عددهای شش تا ده که دامنهٔ ۰ تا ۱۰ را تکمیل می‌کنند.
    example_gloss:
    - من روزانه هشت ساعت کار می‌کنم.
    - دوکان ساعت ده باز می‌شود.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: عمرت چند سال است؟
    note: در اصل یعنی «چند سال داری» — ایتالوی برای پرسیدن سن از *avere* (داشتن) استفاده می‌کند. در دری هم می‌گوییم «چند ساله استی»، اما در ایتالوی فعل «داشتن» می‌آید.
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: من سی ساله استم.
    note: یک عبارت ثابت برای گفتن سن با *avere* (سی سال دارم)؛ «سی» اینجا به‌حیث عدد شمارشی آموزش داده نمی‌شود -- دامنهٔ اعداد این واحد از ۰ تا ۱۰ است، و ۳۰ و ۵۰ فقط در همین عبارت و در قیمت‌ها دیده می‌شوند.
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: قیمت یک قهوه چند است؟
    note: '*Quanto costa* راه معمول پرسیدن قیمت یک جنس است.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: یک یورو، دو یورو
    note: '*euro* در جمع تغییر نمی‌کند -- هم *un euro* و هم *due euro* با همان *euro* ساخته می‌شوند.'
    example_gloss:
    - یک یورو تمام می‌شود.
    - دو یورو و پنجاه سنت است.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: و یک کروسان؟
    note: یک پرسش کوتاه ادامه‌دار برای پرسیدن قیمت جنس دوم، یعنی *cornetto* (کروسان ایتالیایی که با ناشتا خورده می‌شود).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: دو یورو و پنجاه سنت است.
    note: '*e cinquanta* سنت‌ها را اضافه می‌کند -- لفظاً «و پنجاه» -- و برای هر قیمتی که پنجاه سنت داشته باشد به همین شکل به کار می‌رود.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: چند دانه می‌خواهین؟
    note: راه محترمانهٔ پرسیدن مقدار که کارمند کافه یا دوکاندار می‌پرسد؛ *ne* جای جنسی را می‌گیرد که قبلاً گفته شده.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: سه دانه می‌خواستم، تشکر.
    note: '*Ne vorrei* + عدد راه مؤدبانهٔ درخواست مقدار است، و باز هم *ne* به جنس گفته‌شده اشاره می‌کند.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: نمبر تیلفونت چند است؟
    note: راه غیررسمی پرسیدن شمارهٔ تیلفون کسی، با *tuo* (از تو، غیررسمی).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: فردا برایت زنگ می‌زنم!
    note: راه دوستانه برای ختم گفتگو بعد از گرفتن شمارهٔ کسی.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: شمارهٔ من
    note: شماره‌های تیلفون در ایتالیایی معمولاً رقم به رقم خوانده می‌شوند، با همان اعدادی که در درس اول یاد گرفتید.
    example_gloss: شمارهٔ من صفر، سه، چهار، دو، یک است.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: شمارهٔ من صفر، سه، چهار، دو، یک است.
    note: سم شمارهٔ تیلفونش را رقم به رقم می‌گوید؛ این راه معمول گفتن شمارهٔ تیلفون در ایتالیایی است.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: عالی، تشکر!
    note: راه کوتاه و شاد برای ختم گفتگو بعد از گرفتن معلوماتی که لازم داشتید.
