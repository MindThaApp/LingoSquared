teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: قهوه، کروسان
    note: 'هر دو اسم مذکر استند (*il*): *caffè* اسپرسوی معمول ایتالیایی است و *cornetto* نان شیرینی معمول ناشته.'
    example_gloss:
    - یک قهوه می‌خواهم، لطفاً.
    - یک کروسان می‌خواهم، لطفاً.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: ساندویچ، آب
    note: '*panino* مذکر است (*il*)؛ *acqua* مؤنث است اما پیش از مصوت *l''* می‌گیرد.'
    example_gloss:
    - یک ساندویچ می‌خواهم، لطفاً.
    - یک آب می‌خواهم، لطفاً.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: چه می‌خواهین؟
    note: سوال رسمی با شکل *Lei* که کارمند بار از مشتری می‌پرسد.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: یک قهوه و یک کروسان می‌خواهم، لطفاً.
    note: '*Vorrei* (می‌خواهم) راه مؤدبانهٔ سفارش دادن است و با *e* (و) چیز دومی را اضافه می‌کنین.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: دو قهوه می‌خواهم، لطفاً.
    note: وقتی بیشتر از یکی سفارش می‌تین، *due* (دو) به جای حرف تعریف می‌آید.
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: و برای شما؟
    note: '*E per Lei?* از مشتری دوم می‌پرسد چه می‌خواهد، با شکل مؤدبانهٔ *Lei*.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: همین کافی است، تشکر.
    note: راه معمول ختم سفارش، وقتی دیگر چیزی نمی‌خواهید.
