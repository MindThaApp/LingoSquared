  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: حالم خوب نیست
    note: '*mi sento* (احساس می‌کنم) + *bene* (خوب)؛ *non* آن را منفی می‌کند تا بگویین حالتان خوب نیست.'
