    gloss: من ساعت هفت چاشت می‌خورم و بعد سر کار می‌روم.
    note: '*alle sette* (ساعت هفت) برای گفتن وقت از *alle* به‌اضافهٔ عدد ساعت استفاده می‌کند.'
