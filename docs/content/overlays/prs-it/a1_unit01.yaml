    title: سلام و معرفی
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: 'Tu و Lei: سلام غیررسمی و رسمی'
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: جواب دادن و خداحافظی
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 'معرفی خود: روز اول در دفتر'
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: سلام، صبح بخیر
    note: '*Ciao* سلام غیررسمی و همه‌منظوره است که میان دوستان و هم‌سن‌وسالان در هر وقت روز گفته می‌شود. *Buongiorno* سلام معمول و رسمی‌تر روز است و از صبح تا بعد از ظهر گفته می‌شود.'
    example_gloss:
    - سلام، چطور استی؟
    - صبح بخیر، چطور استید؟
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: چطور استی (غیررسمی)، چطور استید (رسمی)
    note: '*come stai* با *tu* (دوست، هم‌سن‌وسال) می‌آید؛ *come sta* با *Lei* (ناآشنا، رئیس، کسی که به او احترام می‌گذارید). پرسش یکی است، اما سطح رسمی بودنش فرق دارد.'
    example_gloss:
    - سلام، امروز چطور استی؟
    - صبح بخیر، امروز چطور استید؟
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: سلام، چطور استی؟
    note: سلام و پرسش غیررسمی که با دوستان، همصنفی‌ها یا هم‌سن‌وسالان گفته می‌شود.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: صبح بخیر، چطور استید؟
    note: شکل رسمی آن، برای کسی که باید به او احترام بگذارین، مثلاً مدیر یک همکار تازه.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: غیررسمی · Lei: رسمی یا محترمانه'
    note: '*tu* «تو»ی روزمره میان دوستان، همصنفی‌ها و هم‌سن‌وسالان است. *Lei* «شما»ی محترمانه برای ناآشنایان، محیط کار یا کسی است که اولین بار او را می‌بینین. فعل آن هم شکل جداگانه دارد (*tu stai* را با *Lei sta* مقایسه کنید).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: خوبم، تشکر
    note: جواب ساده و بی‌طرف به «چطور استی؟» که با افزودن *e tu?* یا *e Lei?* هم در حالت غیررسمی و هم رسمی کار می‌دهد.
    example_gloss:
    - خوبم، تشکر، و تو؟
    - خوبم، تشکر، و شما؟ (رسمی)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: تو چطور؟ (غیررسمی)
    note: راه غیررسمی برگرداندن پرسش به دوست یا هم‌سن‌وسال.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: شما چطور؟ (رسمی)
    note: راه رسمی برگرداندن پرسش، مطابق با سطح *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: خوبم، تشکر، و تو؟
    note: جواب کامل غیررسمی همراه با برگرداندن پرسش، به دوست یا هم‌سن‌وسال.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: خوبم، تشکر، و شما؟
    note: جواب کامل رسمی همراه با برگرداندن پرسش، به کسی که به او احترام می‌گذارید.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: عصر بخیر، شب بخیر
    note: '*Buonasera* سلامی است که وقت رسیدن به جایی در عصر یا شام گفته می‌شود. *Buonanotte* خداحافظی است که وقت خواب یا پایان روز گفته می‌شود و هرگز به‌حیث سلام استفاده نمی‌شود.'
    example_gloss:
    - عصر بخیر، چطور استید؟
    - شب بخیر، فردا می‌بینمت.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: خداحافظ، فردا می‌بینمتان.
    note: '*Arrivederla* خداحافظی رسمی است که با *Lei* گفته می‌شود، مناسب محیط کار یا برای یک ناآشنا.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: خداحافظ، فردا می‌بینمت!
    note: خداحافظی غیررسمی با دوستان و هم‌سن‌وسالانی که فردا دوباره می‌بینین.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: معذرت، نام شما چیست؟ (رسمی)
    note: '*Come si chiama?* در سطح رسمی *Lei* در اصل می‌پرسد «شما را چه صدا می‌کنند؟»؛ افزودن *scusi* («معذرت») هنگام پرسیدن از یک ناآشنا مؤدبانه است.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: نامت چیست؟ (غیررسمی)
    note: شکل غیررسمی آن، برای دوست، هم‌سن‌وسال یا کسی هم‌عمر خودتان.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: نامم Elena است.
    note: '*chiamarsi* یعنی «نامیده شدن»؛ این راه معمول گفتن نام خودتان است و در هر دو سطح کار می‌دهد.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: من Sam استم.
    note: راه ساده دیگر به‌جای *mi chiamo*، با *essere* («بودن») و نام خودتان.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: خوشحال شدم، از آشنایی با شما خوشحال شدم (رسمی)
    note: '*Piacere* به‌تنهایی راه کوتاه و رایج گفتن «خوشحال شدم» در هر دو سطح است. *Piacere di conoscerla* شکل کامل و رسمی آن است که با *Lei* گفته می‌شود.'
    example_gloss:
    - خوشحال شدم، Sam!
    - از آشنایی با شما خوشحال شدم، خانم Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: به دفتر خوش آمدید!
    note: '*Benvenuto* شکل مذکر «خوش آمدید» است (برای مرد؛ به زن *Benvenuta* گفته می‌شود).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: خیلی تشکر.
    note: راه قوی‌تر و پرتأکیدتر تشکر کردن نسبت به *Grazie* ساده.
