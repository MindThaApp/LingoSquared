  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: ساعت سه و نیم همدیگر را می‌بینیم.
    note: '*alle* (در ساعت) پیش از وقت مشخص ساعت می‌آید، برخلاف *sono le* که فقط ساعت را می‌گوید.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: صبح، بعد از چاشت، شب
    note: اینها مشخص می‌کنند ساعت مربوط کدام بخش روز است، چون خود ساعت دوازده‌ساعته در ایتالیایی نشان نمی‌دهد که صبح است یا بعد از ظهر.
    example_gloss:
    - جلسه صبح است یا شب؟
    - بعد از چاشت است، ساعت سه و نیم.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: بعد از چاشت است، ساعت سه و نیم.
