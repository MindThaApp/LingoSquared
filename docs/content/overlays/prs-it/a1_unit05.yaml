    title: Che ore sono?
    gloss: ساعت چند است؟
    note: راه معمول پرسیدن ساعت در ایتالیایی؛ در اصل یعنی «ساعت‌ها چند استند».
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: ساعت سه است.
    note: '*Sono le* + عدد، ساعت را برای هر وقت جز ساعت یک می‌گوید.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: ساعت یک، ساعت دو، ساعت سه، ساعت دوازده
    note: ساعت یک تنها با *è l'una* (مفرد) گفته می‌شود، نه *sono le* (جمع)، چون «یک» مفرد است.
    example_gloss:
    - ساعت یک است.
    - ساعت دوازده است.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: ساعت چهار، ساعت پنج، ساعت شش
    note: اینها همان ساختار *sono le* + عدد را که برای ساعت سه بود، ادامه می‌دهند.
    example_gloss:
    - ساعت چهار است.
    - ساعت شش است.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: ساعت سه و نیم است.
    note: '*e mezzo* (و نیم) سی دقیقه به ساعت اضافه می‌کند.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: ساعت سه و یک ربع است.
    note: '*e un quarto* (و یک ربع) پانزده دقیقه به ساعت اضافه می‌کند.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: یک ربع کم چهار است.
    note: '*meno un quarto* (منهای یک ربع) از ساعت بعدی به عقب می‌شمارد، مثل «ربع کم چهار» در دری.'
