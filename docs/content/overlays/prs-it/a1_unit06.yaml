teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: مادر، پدر
    note: 'در ایتالیایی پیش از اسم حرف تعریف می‌آید که جنسیت دارد: *la* برای مؤنث و *il* برای مذکر.'
    example_gloss:
    - این پدرم است.
    - این مادرم است.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: برادر، خواهر
    note: '*fratello* مذکر است (*il*) و *sorella* مؤنث است (*la*).'
    example_gloss:
    - من یک برادر و یک خواهر دارم.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: این پدرم است. این مادرم است.
    note: '*Questo/Questa* (این) با جنسیت کسی که نشان داده می‌شود هماهنگ است: *questo* برای مرد و *questa* برای زن.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: پدرکلان، مادرکلان
    note: همان الگوی حرف تعریف مذکر و مؤنث *padre/madre* است.
    example_gloss:
    - پدرکلانم در روم زندگی می‌کند.
    - مادرکلانم خیلی خوب آشپزی می‌کند.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: برادر یا خواهر داری؟
    note: '*Hai* (داری) + واژهٔ خانواده + *o* (یا) راه معمول پرسیدن دربارهٔ برادر و خواهر است.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: من یک برادر و یک خواهر دارم.
    note: '*Ho* (دارم) برای جواب دادن است و با *un* (یک، مذکر) و *una* (یک، مؤنث) می‌آید.'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: شوهر، زن
    note: یک جوڑ مذکر و مؤنث دیگر با همان الگوی حرف تعریف.
    example_gloss:
    - سام زن دارد.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: بچه داری؟
    note: '*figli* (بچه‌ها) جمعی است که در پرسش عمومی به کار می‌رود، بدون توجه به تعداد یا جنسیت.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: بلی، دو بچه دارم. یک پسر و یک دختر.
    note: '*maschio* (پسر) و *femmina* (دختر) بعد از گفتن تعداد کل، جنسیت بچه‌ها را مشخص می‌کنند.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: پسر، دختر
    note: شکل مفرد *figli* با همان الگوی معمول حرف تعریف مذکر و مؤنث.
    example_gloss:
    - الینا یک پسر و یک دختر دارد.
