  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: آیا می‌توانم با کارت پرداخت کنم؟
    note: '*Posso pagare...?* میپرسد که آیا این روش پرداخت قبول است یا نه.'
    example_gloss:
    - امروز میتانم با کارت پرداخت کنم؟
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: ده یورو میشود.
