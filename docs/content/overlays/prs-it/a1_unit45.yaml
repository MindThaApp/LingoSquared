    gloss: 'با وسیله‌های نقلیه ایتالیایی in می‌گوید: in treno, in bicicletta, in macchina. برای پیاده رفتن a piedi می‌گوید: vado a piedi.'
    note: 'ایتالیایی *in treno* می‌گوید، بدون حرف تعریف: *in treno*، نه *nel treno*.'
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: Marco جواب می‌دهد
    gloss: 'Marco: پس من همراه Giulia با ریل می‌روم.'
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: کی چطور سفر می‌کند؟
    gloss: Giulia هر روز برای رفتن سر کار با ریل سفر می‌کند. Marco معمولاً با بایسکل می‌رود، ولی وقتی باران می‌بارد با ریل هم می‌رود. Luca ترجیح می‌دهد با موتر برود. Chiara نزدیک زندگی می‌کند و پیاده سر کار می‌رود. تو چطور سر کار می‌روی؟
    note: 'چهار راه سفر و یک شرط (*quando piove*، وقتی باران می‌بارد) را در مقابل هم می‌گذارد. *Andare* (رفتن) بی‌قاعده است: *vado*، *va*.'
    glosses:
      viaggia: سفر می‌کند
      ogni: هر
      giorno: روز
      treno: ریل
      lavoro: کار کردن
      bicicletta: بایسکل (in bicicletta = با بایسکل)
      solito: معمول (di solito = معمولاً)
      piove: باران می‌بارد
      prende: می‌گیرد
      andare: رفتن (andare in macchina = با موتر رفتن)
      preferisce: ترجیح می‌دهد
      macchina: موتر
      abita: زندگی می‌کند
      vicino: نزدیک
      piedi: پاها (a piedi = پیاده)
      vai: تو می‌روی
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara نزدیک زندگی می‌کند و پیاده سر کار می‌رود
    gloss: Chiara نزدیک زندگی می‌کند و پیاده سر کار می‌رود.
