course:
  title: ایتالیایی A1
  description: 'ایتالیایی مبتدی برای توصیف ظاهر اصلی یک شخص: قد و تأثیر سن، رنگ مو و چشم، سوال اساسی Com''è? و مقایسه ظاهر دو نفر.'
units:
  it.a1.unit42.aspetto:
    title: توصیف ظاهر
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: قدبلند، قدکوتاه، پیر و جوان
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: توصیف مو
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: چشم‌ها و اینکه کسی چطور شکلی دارد
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: جولیا نینا را توصیف می‌کند
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: مقایسه لوکا و کیارا
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: مارکو نینا را می‌شناسد
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Alto* برای شخص قدبلند و *basso* برای شخص قدکوتاه است. صفت‌های ایتالیایی با شخص هماهنگ می‌شوند: *alto/alta*، *basso/bassa*.'
    example_gloss:
    - کیارا قدبلند است.
    - لوکا قدکوتاه است.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Anziano* (سالخورده) و *giovane* (جوان) یک تأثیر عمومی می‌دهند، نه تعداد دقیق سال‌ها. *Giovane* به -e ختم می‌شود، پس برای مرد و زن یکسان است.'
    example_gloss:
    - بابه کلان پیر است.
    - مارکو جوان است.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'سن: avere anni یا anziano'
    gloss: 'برای سن دقیق در ایتالیایی avere + anni به کار می‌رود: Quanti anni hai؟ برای تأثیر عمومی یک صفت به کار می‌رود: Il nonno è anziano.'
    note: در ایتالیایی برای سن می‌گویند «سی سال دارم» (*ho trent'anni*)، مثل دری که می‌گوییم «سی ساله استم/سی سال دارم». صفت *anziano* برای این است که شخص چقدر پیر معلوم می‌شود.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: کیارا قدبلند است و لوکا قدکوتاه
    gloss: کیارا قدبلند است و لوکا قدکوتاه.
    note: 'دو صفت که با *e* (و) وصل شده‌اند. هر کدام با شخص خود هماهنگ است: *alta* (مؤنث) و *basso* (مذکر).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: مو
    gloss: مو
    note: '*I capelli* در ایتالیایی جمع است: ایتالیایی‌ها مو را «تارهای مو» می‌گویند. مفرد آن، *il capello*، یک تار مو است.'
    example_gloss: مارکو موی کوتاه و سیاه دارد.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'سه رنگ مو به شکل جمع مذکر تا با *capelli* هماهنگ شوند: *biondi*، *castani*، *grigi*. *Neri* (سیاه) هم برای مو به کار می‌رود.'
    example_gloss:
    - جولیا موی بور دارد.
    - لوکا موی قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lunghi* (بلند) و *corti* (کوتاه) مثل *capelli* جمع اند. کلمه *alto* (قدبلند) فقط برای اشخاص است، نه برای مو.'
    example_gloss:
    - کیارا موی بلند دارد.
    - لوکا موی کوتاه دارد.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli جمع است
    gloss: 'Capelli جمع است، پس صفت هم جمع می‌شود: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'صفت بعد از اسم می‌آید و در جنسیت و تعداد با آن هماهنگ می‌شود: *capelli lunghi* (جمع مذکر)، *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: مو و چشم با avere می‌آیند
    gloss: 'برای توصیف شخص در ایتالیایی با مو و چشم فعل avere به کار می‌رود: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'در ایتالیایی حرف تعریف هم لازم است: *i capelli*، *gli occhi*. می‌توانین *è bionda* هم بگویین، اما اینجا الگوی *avere* را یاد بگیرین.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: مارکو موی کوتاه و سیاه دارد
    gloss: مارکو موی کوتاه و سیاه دارد.
    note: '*Neri* (سیاه) جمع مذکر است و با *capelli* هماهنگ می‌شود.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: جولیا موی بلند و بور دارد
    gloss: جولیا موی بلند و بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Occhio* (چشم) مذکر است؛ جمع آن *occhi* است و چون با مصوت شروع می‌شود، *gli* می‌گیرد.'
    example_gloss: مارکو چشم‌های قهوه‌یی دارد.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: 'رنگ‌های چشم: *azzurri* (آبی)، *marroni* (قهوه‌یی)، *verdi* (سبز). این شکل‌های جمع برای هر دو جنس به کار می‌روند.'
    example_gloss:
    - جولیا چشم‌های آبی دارد.
    - لوکا چشم‌های قهوه‌یی دارد.
    - کیارا چشم‌های سبز دارد.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: رنگ‌ها در جمع هماهنگ می‌شوند
    gloss: 'رنگ‌های چشم برای هماهنگی با occhi جمع می‌شوند: occhi azzurri, marroni, verdi.'
    note: 'صفت‌هایی که در مفرد به -e ختم می‌شوند (*verde*، *marrone*) در جمع به -i ختم می‌شوند: *verdi*، *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: جولیا چطور معلوم می‌شود؟
    gloss: جولیا چطور معلوم می‌شود؟
    note: '*Com''è?* سوال اساسی برای ظاهر است. *Com''è* همان *come è* است که e حذف شده و apostrophe آمده است.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: جولیا موی بلند و بور و چشم‌های آبی دارد
    gloss: جولیا موی بلند و بور و چشم‌های آبی دارد.
    note: 'یک جواب نمونه: *avere* + مو + *e* + چشم در یک جمله.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: جولیا نینا را معرفی می‌کند
    gloss: 'جولیا: به کافه زبان یک دختر تازه می‌آید. نامش نینا است.'
    note: '*Viene* (می‌آید) کسی تازه را معرفی می‌کند. *Si chiama* یعنی «نامش ... است»، به معنای لفظی «خود را صدا می‌کند».'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: مارکو می‌پرسد او چطور معلوم می‌شود
    gloss: 'مارکو: خوب است! چطور معلوم می‌شود؟'
    note: 'باز همان سوال، بدون نام: فاعل از موقعیت معلوم است.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: جولیا قد و موی نینا را توصیف می‌کند
    gloss: 'جولیا: قدکوتاه است و موی کوتاه و بور دارد.'
    note: '*È bassa* (قدکوتاه است) شکل مؤنث *bassa* را دارد؛ توصیف مو با *ha* دنبال می‌شود.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: مارکو درباره چشم‌هایش می‌پرسد
    gloss: 'مارکو: و چشم‌هایش؟'
    note: '*E gli occhi?* فعل ندارد. در ایتالیایی هم مثل دری، کلمه‌هایی که از موقعیت معلوم اند اکثراً حذف می‌شوند.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: جولیا چشم‌های نینا را توصیف می‌کند
    gloss: 'جولیا: چشم‌های سبز دارد.'
    note: '*Ha gli occhi verdi*: ضمیر فاعلی لازم نیست، چون آخر فعل نشان می‌دهد که «او» است.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: مارکو او را می‌شناسد
    gloss: 'مارکو: تشکر! پس او را می‌شناسم.'
    note: '*La riconosco* (او را می‌شناسم): ضمیر مفعولی *la* پیش از فعل می‌آید.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: مقایسه لوکا و کیارا
    gloss: لوکا و کیارا برادر و خواهر اند، اما فرق دارند. لوکا قدکوتاه است و موی کوتاه و قهوه‌یی و چشم‌های قهوه‌یی دارد. کیارا از لوکا قدبلندتر است و موی بلند و قهوه‌یی و چشم‌های سبز دارد. شما چطور استید؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      fratello: برادر
      sorella: خواهر
      sembrano: معلوم می‌شوند / به نظر می‌رسند
      diversi: فرق دار
      basso: کوتاه
      corti: کوتاه
      castani: قهوه‌یی
      capelli: مو
      marroni: قهوه‌یی
      occhi: چشم‌ها
      alta: قدبلند (più alta = قدبلندتر)
      lunghi: دراز
      verdi: سبز
      come: چطور (Tu come sei? = تو چطور استی؟)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'مقایسه: più ... di'
    gloss: 'ایتالیایی با più + صفت + di مقایسه می‌کند: Chiara è più alta di Luca.'
    note: '*Più* را پیش از صفت و *di* را پیش از شخصی بگذارین که با او مقایسه می‌کنین. صفت جنسیت خود را نگه می‌دارد: *più alta*، *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: کیارا از لوکا موی درازتر دارد
    gloss: کیارا از لوکا موی درازتر دارد.
    note: '*I capelli più lunghi di Luca*: صفت جمع می‌ماند تا با *capelli* مطابقت کند.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: '*Ho i capelli corti e castani*: برای توصیف ظاهر خودتان از *avere* استفاده کنید.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco، Nina را می‌بیند
    gloss: 'Marco: ببین، او Nina است؟ موهای کوتاه و طلایی و چشم‌های سبز دارد.'
    note: '*Guarda* (ببین) شکل امری *tu* است. *Quella* برای یک زن یا دختر یعنی «آن یکی».'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia تأیید می‌کند
    gloss: 'Giulia: بلی، Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina به Marco سلام می‌دهد
    gloss: 'Nina: سلام، تو Marco استی؟'
    note: '*Sei Marco?* پرسش غیررسمی است: *sei* شکل *tu* فعل *essere* است، پس به گفتن *tu* ضرورت نیست.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco جواب سلام Nina را می‌دهد
    gloss: 'Marco: بلی! از آشنایی با تو خوشحال شدم، Nina.'
    note: '*Piacere di conoscerti* عبارتی است برای وقتی که کسی را اولین بار می‌بینین؛ *-ti* یعنی «تو را».'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را تمام می‌کند -- Marco، Nina را از روی توصیف قبلی Giulia درست شناخت.
