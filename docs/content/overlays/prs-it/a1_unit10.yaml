teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: به طرف راست، به طرف چپ
    note: '*a destra* (به طرف راست) و *a sinistra* (به طرف چپ) دو جهت اصلی پیچیدن استند.'
    example_gloss:
    - لطفاً به طرف راست بپیچید.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: مستقیم، سر چهارراهی
    note: '*sempre dritto* (مستقیم) و *all''incrocio* (سر چهارراهی) می‌گویند چطور و کجا باید پیچید.'
    example_gloss:
    - مستقیم بروید تا چهارراهی.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: معذرت، به موزیم چطور برسم؟
    note: '*Scusi* (معذرت، رسمی) سوال را شروع می‌کند و بعدش *come arrivo* (چطور برسم) با مقصد می‌آید.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: مستقیم بروید، بعد سر چهارراهی به طرف راست بپیچید.
    note: '*Vada* و *giri* امر رسمی (Lei) استند، شکل مؤدبانه‌ای که یک ناآشنا برای راه نشان دادن به کار می‌برد.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: از اینجا دور است؟
    note: '*È lontano* (دور است) با *da qui* (از اینجا) فاصله را می‌پرسد.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: نی، فقط پنج دقیقه پیاده است.
    note: '*a piedi* (پیاده) نشان می‌دهد فاصله چطور اندازه شده است.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: بسیار تشکر، خیلی مهربانی کردید.
    note: '*molto gentile* (خیلی مهربان) بعد از تشکر برای کمک، گرمی بیشتری می‌دهد.'
    example_gloss:
    - خیلی مهربان، باز هم تشکر.
  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: بروید، بپیچید، ادامه بتین.
    note: سه فعل امری رسمی (شکل Lei) که هنگام راه‌نشان دادن اغلب با هم استفاده می‌شوند.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
    title: Dov'è il museo?
    gloss: موزیم کجاست؟
    note: '*Dov''è* (کجاست) با اسم بعد از آن، جای یک مکان را می‌پرسد.'
    example_gloss:
    - موزیم از اینجا دور است.
