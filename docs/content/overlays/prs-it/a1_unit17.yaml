teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: کار
    note: '*il lavoro* اسم مذکر است و هم «شغل» و هم «کار» به‌طور عموم معنی می‌دهد.'
    example_gloss:
    - شغل من جالب است.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: معلم، فروشنده
    note: '*insegnante* (معلم) برای مرد و زن یک شکل دارد؛ *commesso* (فروشنده) مذکر است — شکل مؤنث آن *commessa* است.'
    example_gloss:
    - من معلم استم، فروشنده نیستم.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: شما چه کار می‌کنین؟
    note: '*Che lavoro fai?* (لفظ به لفظ «چه کاری می‌کنی؟») راه معمول پرسیدن شغل کسی است.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: من معلمه استم.
    note: 'مثل دری که می‌گوییم «من معلم استم» (بدون «یک»)، در ایتالیایی هم پیش از شغلِ بدون صفت حرف تعریف نمی‌آید: *Sono insegnante*، نه *Sono un insegnante*.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: من فروشنده استم.
    note: همان الگوی بدون حرف تعریف مثل *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: دفتر، مکتب
    note: در *l'ufficio* (دفتر) حرف تعریف پیش از مصوت کوتاه می‌شود؛ *la scuola* (مکتب) مؤنث است.
    example_gloss:
    - من در یک دفتر کار می‌کنم.
    - من در یک مکتب کار می‌کنم.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: در کجا کار می‌کنی؟
    note: '*Dove* (کجا) به‌علاوهٔ *lavori* (کار می‌کنی، غیررسمی).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: من در یک دفتر کار می‌کنم.
    note: '*Lavoro in* (کار می‌کنم در) به‌علاوهٔ *un ufficio* (یک دفتر).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: من در یک مکتب کار می‌کنم.
    note: همان الگو با *una scuola* (یک مکتب).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: شروع می‌کنم، ختم می‌کنم
    note: '*inizio* (شروع می‌کنم) و *finisco* (ختم می‌کنم) شکل «من» در زمان حال فعل‌های *iniziare* و *finire* اند.'
    example_gloss:
    - من ساعت نُه شروع می‌کنم.
    - من ساعت پنج ختم می‌کنم.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: ساعت چند شروع می‌کنی؟
    note: '*A che ora* (ساعت چند) به‌علاوهٔ *inizi* (شروع می‌کنی، غیررسمی).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: من ساعت نُه شروع می‌کنم و ساعت پنج ختم می‌کنم.
    note: '*alle nove* / *alle cinque* (ساعت نُه / ساعت پنج) پیش از ساعت از *alle* استفاده می‌کند، مثل عبارت‌های ساعت در واحد ۵.'
