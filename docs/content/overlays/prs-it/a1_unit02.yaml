course:
  title: ایتالیایی A1
  description: ایتالیایی سطح A1 را برای سلام‌واحوالپرسی روزمره و گفت‌وگوهای کوتاه اجتماعی بیاموزید، با توضیحات مفصل به دری.
units:
  it.a1.unit02.origin_nationality_language:
    title: اهل کجا استید، ملیت و زبان
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: اهل کجا استید؟ پرسیدن و گفتن محل اصلی
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'صحبت به زبان ایتالیایی: سطح و زبان‌ها'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: کار و خوش آمدید به میلان
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: از کجا
    note: '*di dove* بخش اصلی پرسیدن یا گفتن محل اصلی شخص است؛ با *sei* (غیررسمی) یا *è* (رسمی) می‌آید.'
    example_gloss:
    - سام، تو از کجا استی؟
    - الینا، شما از کجا استید؟ (رسمی)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: شما از کجا استید؟
    note: سوال غیررسمی که با همسن یا دوست استفاده می‌شود و با *tu* در بخش اول مطابقت دارد.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: شما از کجا استید؟ (رسمی)
    note: سوال رسمی که با *Lei* در بخش اول مطابقت دارد.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: من امریکایی استم، از شیکاگو.
    note: ملیت و شهر اصلی را با هم می‌گوید.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: من ایتالوی استم، از میلان.
    note: '*italiana* شکل مونث ملیت است و چون الینا زن است، استفاده شده.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: امریکایی (مذکر/مونث)، ایتالوی (مذکر/مونث)
    note: 'در ایتالوی، کلمه‌های ملیت مطابق جنسیت شخص آخرشان تغییر می‌کند: *-o* برای مرد و *-a* برای زن (*Sam è americano*، *Elena è italiana*). در دری چنین تغییری وجود ندارد.'
    example_gloss:
    - سام امریکایی است.
    - الینا ایتالوی است.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: ایتالوی حرف می‌زنی؟
    note: سوال غیررسمی که شکل *tu* فعل *parlare* (حرف زدن) را دارد.
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: ایتالوی حرف می‌زنید؟ (رسمی)
    note: سوال رسمی که شکل *Lei* فعل *parlare* را دارد.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: کمی ایتالوی حرف می‌زنم
    note: راه متواضعانهٔ معمول برای گفتن سطح خودتان؛ *un po'* یعنی «کمی».
    example_gloss: کمی ایتالوی حرف می‌زنم، یک سال است که می‌خوانم.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: انگلیسی حرف می‌زنم.
    note: همان ساختار *parlo* (حرف می‌زنم) با زبان دیگر.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: یک سال است که ایتالوی می‌خوانم.
    note: '*da un anno* یعنی «برای یک سال» و کاری را نشان می‌دهد که در گذشته شروع شده و حالا هم ادامه دارد.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: چند وقت است که می‌خوانی؟
    note: '*Da quanto* (از چند وقت) + زمان حال *studi* (می‌خوانی، غیررسمی) می‌پرسد که کاری چند وقت است ادامه دارد. با همین ساختار جواب بتین: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: ایتالوی را خوب حرف می‌زنی!
    note: تعریف دوستانه از سطح زبان کسی، با شکل غیررسمی *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: شما چه کار می‌کنین؟
    note: سوال غیررسمی که شکل *tu* فعل *fare* (کردن) را دارد.
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: شما چه کار می‌کنین؟ (رسمی)
    note: سوال رسمی که شکل *Lei* فعل *fare* را دارد.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: من انجنیر استم
    note: 'نام وظیفه‌ها در ایتالوی معمولاً بدون حرف تعریف می‌آید: *sono ingegnere*، نه *sono un ingegnere*.'
    example_gloss: من انجنیر استم، در میلان کار می‌کنم.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: من برای کار اینجا استم.
    note: '*per lavoro* دلیل بودن در یک جا را می‌گوید: کار، نه سیاحت.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: من دو سال اینجا استم.
    note: همان ساختار *per lavoro*، حالا به جای دلیل، مدت را می‌گوید.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: چه خوب، خوش آمدید به میلان!
    note: '*Che bello* واکنش معمول و پر از شوق است به معنای «چه خوب».'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: خیلی تشکر!
    note: همان تشکر گرم بخش اول که اینجا در جواب خوش‌آمدید گفته می‌شود.
