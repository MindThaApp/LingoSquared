teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: امشب، فردا
    note: '*stasera* (امشب) و *domani* (فردا) دو زمانی استند که برای پیشنهاد یک برنامه به کار می‌روند.'
