  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: خوب است / باشه، بریم
    note: '*va bene* (خوب است) یک پیشنهاد را قبول می‌کند؛ *andiamo* (بریم) شکل «ما» فعل *andare* است و برای دعوت به کار می‌رود.'
    example_gloss:
    - خوب است، با هم بریم.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: امشب به سینما برویم؟
    note: '*Andiamo* وقتی به شکل پرسش بیاید، پیشنهاد انجام کاری با هم است.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: خوب است، بریم!
    note: '*Va bene* پیشنهاد را قبول می‌کند و بعد از آن *andiamo* دعوت را با شوق تکرار می‌کند.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: چه وقت همدیگر را ببینیم؟
    note: '*ci vediamo* (همدیگر را می‌بینیم) شکل متقابل فعل *vedersi* است.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: ساعت هشت مقابل سینما همدیگر را می‌بینیم.
    note: '*davanti a* (مقابل) همراه با حرف تعریف، جای ملاقات را نشان می‌دهد.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: عالی، پس امشب می‌بینمت!
    note: '*a stasera* (امشب می‌بینمت) یک خداحافظی است که وقت قرار را می‌گوید.'
    example_gloss:
    - عالی، پس فردا می‌بینمت!
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: اگر امشب نشد، فردا برویم.
    note: '*Se* (اگر) یک برنامهٔ دیگر را معرفی می‌کند، برای وقتی که برنامهٔ اول نشود.'
