teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: بیشتر، کمتر
    note: '*più* (بیشتر) و *meno* (کمتر) کلمه‌های اصلی مقایسه استند؛ پیش از صفت یا همراه با *di* برای مقایسه به کار می‌روند.'
    example_gloss:
    - من قهوهٔ بیشتر و چای کمتر می‌خواهم.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: از / تر از
    note: 'بعد از *più* یا *meno*، کلمهٔ *di* معنی «از» را می‌دهد (*più di due euro*)؛ پیش از حرف تعریف کوتاه می‌شود: *di* + *i* = *dei*، *di* + *le* = *delle*.'
    example_gloss:
    - قهوه بیشتر از دو یورو قیمت دارد.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: سیب از بادرنگ بیشتر قیمت دارد.
    note: '*più dei pomodori* از *di* + *i* (که به *dei* کوتاه شده) برای مقایسه با *i pomodori* کار می‌گیرد.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: بادرنگ از سیب کمتر قیمت دارد.
    note: '*meno delle mele* از *di* + *le* (که به *delle* کوتاه شده) برای مقایسه با *le mele* کار می‌گیرد.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: کدام را بیشتر دوست داری، سیب را یا بادرنگ را؟
    note: '*Quale* (کدام) از شنونده می‌خواهد که میان دو چیزی که همین حالا نام برده شد، یکی را انتخاب کند.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: من سیب را بیشتر دوست دارم.
    note: '*Preferisco* (من ترجیح می‌دهم) همراه با *le mele* (سیب‌ها) با انتخاب جواب می‌دهد.'
    example_gloss:
    - من بادرنگ را بیشتر دوست دارم.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: مثل / به اندازهٔ
    note: '*come* (مثل) با *buono/a* برای برابر دانستن دو چیز به کار می‌رود.'
