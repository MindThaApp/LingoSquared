    title: متنی دربارهٔ آتش‌سوزی
    gloss: 'در کافهٔ زبان در کتابخانه آتش‌سوزی است. کارمند می‌گوید: به دروازهٔ اضطراری بروید! نینا به کمک ضرورت دارد. جولیا با نینا است. مارکو به آتش‌نشانی زنگ می‌زند. همه بیرون اند. خوب است!'
    note: مرور صحنهٔ آتش‌سوزی در زمان حال، با سخنان کارمند به شکل نقل مستقیم.
    glosses:
      caffè: کافه (caffè linguistico = کافهٔ زبان)
      biblioteca: کتابخانه
      incendio: آتش‌سوزی
      dipendente: کارمند
      dice: می‌گوید
      Andate: بروید (andate = بروید، امر جمع)
      emergenza: اضطراری (uscita di emergenza = دروازهٔ اضطراری)
      aiuto: کمک
      bisogno: ضرورت دارم (ho bisogno di = ضرورت دارم)
      chiama: زنگ می‌زند
      vigili: آتش‌نشان‌ها (vigili del fuoco = آتش‌نشانی)
      tutti: همه
      fuori: بیرون
      bene: خوب، درست (va bene = خوب است)
  it.a1.unit56.lesson05.teach.sono_tutti_fuori:
    title: همه بیرون استند
    gloss: همه بیرون استند. این خوب است.
