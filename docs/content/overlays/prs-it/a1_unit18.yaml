teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: آشپزخانه، اتاق نشیمن
    note: '*la cucina* (آشپزخانه) مؤنث است؛ *il soggiorno* (اتاق نشیمن) مذکر است.'
    example_gloss:
    - آشپزخانه بزرگ است.
    - اتاق نشیمن راحت است.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: اتاق خواب، حمام
    note: '*la camera da letto* لفظ به لفظ «اتاقِ برای چارپایی» است (*letto* = چارپایی)؛ *il bagno* حمام است.'
    example_gloss:
    - اتاق خواب کوچک است.
    - حمام پاک است.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: این خانهٔ من است.
    note: '*Questa* (این، مؤنث) با *casa* (خانه) که مؤنث است، مطابقت دارد.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: چهار اتاق هست.
    note: '*Ci sono* (هست، موجود است) همراه با عدد و *stanze* (اتاق‌ها)؛ *quattro* (چهار) در واحد ۳ آموزش داده شد.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: تخت، میز
    note: '*il letto* (تخت) و *il tavolo* (میز) هر دو مذکر استند.'
    example_gloss:
    - تخت در اتاق خواب است.
    - میز در آشپزخانه است.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: چوکی، صوفه
    note: '*la sedia* (چوکی) مؤنث است؛ *il divano* (صوفه) مذکر است.'
    example_gloss:
    - چوکی نزدیک میز است.
    - صوفه در اتاق نشیمن است.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: تخت در اتاق خواب است.
    note: '*nella* از *in* + *la* ساخته می‌شود و معنی «در» را با حرف تعریف مؤنث می‌دهد.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: صوفه در اتاق نشیمن است.
    note: '*nel* از *in* + *il* (مذکر) ساخته می‌شود و معنی «در» را با حرف تعریف مذکر می‌دهد.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: نزدیک، روبروی
    note: هر دو حرف اضافهٔ دوکلمه‌یی استند که به *a* ختم می‌شوند و a با حرف تعریفِ بعدی یکجا می‌شود (*al*، *alla*).
    example_gloss:
    - چوکی نزدیک میز است.
    - تخت روبروی کلکین است.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: پشت، بالا / روی، زیر
    note: 'سه کلمهٔ دیگر برای گفتن جای چیزی: *dietro* (پشت)، *sopra* (بالا / روی)، *sotto* (زیر) — پیش از حرف تعریف، هیچ‌کدام *a* نمی‌خواهند.'
    example_gloss:
    - صوفه پشت میز است.
    - کتاب روی میز است.
    - پشک زیر تخت است.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: تخت کجاست؟
    note: '*Dov''è* شکل کوتاه‌شدهٔ *dove* (کجا) + *è* (است) می‌باشد.'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: تخت نزدیک کلکین است.
    note: '*vicino alla finestra* از *vicino a* + *la finestra* (کلکین) ساخته شده و به *alla* تبدیل می‌شود.'
