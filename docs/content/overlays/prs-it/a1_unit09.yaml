    title: Scusi, dov'è la farmacia?
    gloss: معذرت، دواخانه کجاست؟
    note: '*Scusi* (معذرت، رسمی) پیش از *dov''è* (کجاست) می‌آید و سوال را شروع می‌کند.'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: نزدیک اینجاست، در Via Roma.
