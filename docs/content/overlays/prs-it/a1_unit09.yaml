  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: نزدیک اینجا بانک هست؟
    note: '*C''è* (هست) درباره موجود بودن چیزی می‌پرسد و بعدش *qui vicino* (نزدیک اینجا) می‌آید.'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: بلی، یکی نزدیک اینجا هست.
    note: '*ce n''è una* (یکی‌اش هست) جواب سوال‌های *c''è* است و به اسم مؤنث *banca* اشاره دارد.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: پهلوی ایستگاه.
    note: '*accanto a* (پهلوی) همراه با حرف تعریف، جای دقیق را نسبت به یک نشانه نشان می‌دهد.'
