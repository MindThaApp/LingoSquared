teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: 바나나
    gloss: 바나나
    note: 흔한 과일로, 시장이나 가게 어디서나 개수나 무게로 팔아요.
    example_gloss: 이것은 바나나예요.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: 토마토, 오이
    gloss: 토마토; 오이
    note: 둘 다 무생물 남성 명사예요. 이 단원 뒤에서 킬로 단위로 살 때 복수 속격 형태(pomidorów, ogórków)가 중요해집니다.
    example_gloss:
    - 이것은 토마토예요.
    - 이것은 오이예요.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: 감자, 양파
    gloss: 감자; 양파
    note: Ziemniak은 무생물 남성 명사로(banan, pomidor와 같이 복수 속격이 -ów인 유형), cebula는 여성 명사예요.
    example_gloss:
    - 이것은 감자예요.
    - 이것은 양파예요.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: 싼, 비싼
    gloss: 싸게; 비싸게
    note: '*Tanio*와 *drogo*는 부사이고, 폴란드어에서는 이 부사를 *kosztować*("값이 나가다")와 바로 함께 씁니다. *To kosztuje drogo*는 직역하면 "그것은 비싸게 값이 나간다"이고, 곧 "그건 비싸요"라는 뜻이에요.'
    example_gloss:
    - 아주 싸요!
    - 아주 비싸요!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: '값이 나가다: kosztuje, kosztują'
    gloss: '값이 나가다: 하나일 때 kosztuje, 여러 개일 때 kosztują -- 바나나는 싸요. 바나나들은 싸요.'
    note: '*Kosztować*는 "값이 나가다"라는 동사예요. 하나일 때는 *kosztuje*, 여러 개일 때는 *kosztują*를 씁니다. *jest*/*są*처럼 수에 따라 달라지는데, 가격에 쓰는 것이죠. 상인은 어느 쪽으로 말해도 알아듣지만, 원어민은 *banany kosztują*라고 말해요.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: 바나나는 얼마예요?
    gloss: 바나나는 얼마예요?
    note: 가격 흥정을 시작할 때 쓰는 일상적인 질문이에요. *Ile*(얼마)에 단수 *kosztuje*를 붙입니다. 바나나 하나에 대해 묻기 때문이에요.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: 자몽
    gloss: 자몽
    note: pomidor, ziemniak처럼 무생물 남성 명사라서 proszę o 뒤에서 어미가 바뀌지 않아요.
    example_gloss: 이것은 자몽이에요.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: 귤, 오렌지
    gloss: 귤; 오렌지
    note: 음식 단원의 kawa, herbata처럼 둘 다 여성 명사예요. 목적격에서는 -a가 -ę로 바뀌지만, 이 과에서는 기본형만 쓰입니다.
    example_gloss:
    - 이것은 귤이에요.
    - 이것은 오렌지예요.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: 1킬로, 반 킬로
    gloss: 1킬로; 반 킬로
    note: '*Kilo*는 무엇을 재든, 몇 킬로를 주문하든 어미가 바뀌지 않아요. 바뀌는 것은 *kilo* 뒤에 오는 명사이며, 이 과의 문법 설명에서 다룹니다.'
    example_gloss:
    - 토마토 1킬로 주세요.
    - 바나나 반 킬로 주세요.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: ~ 주세요
    gloss: ~ 주세요
    note: '*Poproszę*는 음식 단원의 *proszę o*보다 조금 더 세련된 일상 표현이에요. 둘 다 대략 "~ 주세요"라는 뜻이고, 폴란드 사람들은 두 표현을 자유롭게 섞어 써요. *Poproszę* 뒤에는 원하는 것이 바로 오고, *o*는 필요 없어요.'
    example_gloss: 자몽 하나 주세요.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: '''kilo'' 뒤: -ów 어미'
    gloss: '''kilo'' 뒤의 복수 속격: banan -> 바나나의, pomidor -> 토마토의, ziemniak -> 감자의.'
    note: '*kilo*, *pół kilo*처럼 무게로 양을 말할 때는 뒤따르는 명사가 복수 속격이라는 다른 형태로 바뀝니다. 규칙적인 남성 명사 세 개는 *-ów*만 붙이면 돼요. *banan*은 *bananów*, *pomidor*는 *pomidorów*, *ziemniak*은 *ziemniaków*가 됩니다.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: 토마토 1킬로 주세요
    gloss: 토마토 1킬로 주세요.
    note: 문법 설명의 -ów 규칙을 실제 주문에 적용한 문장이에요. kilo 뒤에서 pomidor가 pomidorów가 됩니다.
  pl.a1.unit07.lesson03.teach.dla:
    title: ~를 위한
    gloss: ~를 위한
    note: '''~을 위한''이라는 뜻의 간단한 전치사예요. 상인은 *Co dla pani?*(직역하면 "부인을 위해 무엇을?")라고 하여 손님에게 격식 있게 무엇을 원하는지 물어요.'
    example_gloss: 이건 당신을 위한 거예요.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: 신선한, 아주
    gloss: 신선한; 아주
    note: 시장 상인이 늘 입에 달고 쓰는 두 단어예요. 얼마나 신선한지, 또는 얼마나 싼지·비싼지를 말할 때 쓰죠.
    example_gloss:
    - 토마토가 신선해요.
    - 아주 싸요!
  pl.a1.unit07.lesson03.teach.trochę:
    title: 조금
    gloss: 조금 / 약간
    note: 불만을 부드럽게 표현해 줘요. 친근한 흥정에서는 그냥 drogo라고 하는 것보다 trochę drogo("조금 비싸요")가 훨씬 자연스러워요.
    example_gloss: 조금 비싸요.
  pl.a1.unit07.lesson03.teach.razem:
    title: 합계 / 함께
    gloss: 합계 / 함께
    note: 상인이 내야 할 최종 금액을 말하기 직전에 하는 말이에요.
    example_gloss: 합쳐서 10즈워티예요.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: 무엇을 드릴까요?
    gloss: 무엇을 드릴까요?
    note: 직역하면 "손님(존칭)을 위해 무엇을"이라는 뜻으로, 상인이 손님에게 건네는 자연스러운 첫 질문이에요.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: 상인이 에바에게 인사해요
    gloss: 상인이 인사하고 에바에게 무엇을 드릴지 물어요.
    note: Dzień dobry는 1단원 인사말에서 이미 나온 표현이에요.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: 에바가 바나나에 대해 물어요
    gloss: 에바가 바나나가 얼마인지 물어요.
    note: Kosztują는 이 단원 문법 노트에 나온 복수형이에요. 바나나를 여러 개 묶어서 묻고 있기 때문이에요.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: 상인이 가격을 말해요
    gloss: 상인이 1킬로에 5즈워티이고 아주 신선하다고 말해요.
    note: 동사를 생략한 자연스러운 가격 표현이에요. 폴란드 상인은 "[가격] kilo"로 킬로당 가격을 말하며, "당"에 해당하는 말은 따로 필요 없어요.
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: 에바가 바나나를 주문해요
    gloss: 에바가 좋다고 말하고 바나나 1킬로를 달라고 해요.
    note: poproszę에 kilo + bananów를 붙인 표현으로, 2과 문법 노트에 나온 패턴 그대로예요.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: 상인이 토마토를 권해요
    gloss: 상인이 토마토는 어떠냐고 묻고, 1킬로에 8즈워티라고 말해요.
    note: 3번째 줄과 같은 생략형 가격 표현이고, 이번에는 다른 품목에 쓰였어요.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: 에바가 슬쩍 깎아 보려다 주문해요
    gloss: 에바가 좀 비싸지만 반 킬로를 사겠다고 말해요.
    note: Trochę drogo는 불만을 부드럽게 해 주는 말이에요. 에바는 그래도 사지만 양을 줄여요.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: 상인이 합계를 말해요
    gloss: 상인이 여기 있다고 하며, 합쳐서 9즈워티라고 말해요.
    note: 바나나 5즈워티에 토마토 반 킬로 4즈워티를 더하면 합계 9즈워티예요. 장면에서 앞서 말한 가격과 맞아요.
