answer_policy:
  diacritics: 'Same standing policy as unit01-09: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: 폴란드어 A1
units:
  pl.a1.unit10.routines:
    title: 나의 하루
lessons:
  pl.a1.unit10.lesson01.rano:
    title: 아침에
  pl.a1.unit10.lesson02.praca_i_dom:
    title: 일과 집
  pl.a1.unit10.lesson03.rozmowa_o_dniu:
    title: 하루 이야기하기
teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: 일어나다, 일어나요
    gloss: 일어나다; 일어나요
    note: Wstawać는 동사원형이고, wstaję는 자기 일과를 말할 때 일상적으로 쓰는 1인칭 형태예요.
    example_gloss: 저는 아침 7시에 일어나요.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: 먹다, 먹어요
    gloss: 먹다; 먹어요
    note: Jeść는 약간 불규칙하지만, jem('먹어요')이 가장 많이 쓰는 형태예요. 폴란드 사람들은 어떤 식사에든 이렇게 말해요.
    example_gloss: 저는 아침에 아침을 먹어요.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: 아침 식사
    gloss: 아침 식사
    note: Śniadanie는 jem 뒤에서 형태가 변하지 않아요. '아침을 먹어요'는 그냥 jem śniadanie이고, 따로 배울 어미가 없어요.
    example_gloss: 아침에 저는 아침을 먹어요.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: 마시다, 마셔요
    gloss: 마시다; 마셔요
    note: Pić는 동사원형이고, piję는 1인칭 형태예요. jem, wstaję와 같은 방식으로 써요.
    example_gloss: 저는 아침에 커피를 마셔요.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: 나 자신에 대해 말하기
    gloss: Wstaję, jem, piję -- 이 단원에서는 자기 하루를 설명하듯이 나 자신, 즉 1인칭(ja)에 대해서만 말해요.
    note: 이 단원은 모든 동사를 일부러 '나'를 뜻하는 형태로만 다뤄요. *wstaję*(일어나요), *jem*(먹어요), *piję*(마셔요)처럼요. 그래서 '너', '그', '그녀'에 따라 동사가 어떻게 바뀌는지를 한꺼번에 배우지 않고 내 일과를 말하는 데에만 집중할 수 있어요.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: 저는 아침 7시에 일어나요
    gloss: 저는 아침 7시에 일어나요.
    note: 문법 노트의 패턴을 실제로 쓴 문장이에요. o + 시각의 처격형(siódmej)은 앞선 시간 단원에서 배운 것처럼 그 시각 '에'를 나타내요.
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: 저는 아침을 먹고 커피를 마셔요
    gloss: 저는 아침을 먹고 커피를 마셔요.
    note: i(그리고)로 1인칭 동사 두 개를 이은 문장이에요. 아침에 하는 일을 나열하기에 자연스러운 방법이에요.
  pl.a1.unit10.lesson02.teach.obiad:
    title: 점심
    gloss: 점심 / 낮에 먹는 식사
    note: śniadanie처럼 obiad도 jem 뒤에서 형태가 변하지 않아요. jem obiad는 그냥 '점심을 먹어요'라는 뜻이에요.
    example_gloss: 저는 정오에 점심을 먹어요.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: 일하다, 일해요
    gloss: 일하다; 일해요
    note: Pracować는 쇼핑 단원의 kosztować -> kosztuje와 같은 -ować -> -uję 패턴을 따라요. 이번에는 1인칭일 뿐이에요.
    example_gloss: 저는 오후에 일해요.
  pl.a1.unit10.lesson02.teach.dom:
    title: 집
    gloss: 집
    note: 집을 뜻하는 일상적인 단어로, '집에 가요', '집에 와요'라는 표현에서 자주 나와요.
    example_gloss: 집은 저기에 있어요.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: 집으로
    gloss: '집으로 -- do 뒤에는 생격이 오고, dom의 생격은 -u로 끝나요: domu. bank -> banku, park -> parku, hotel -> hotelu와 똑같은 패턴이에요.'
    note: '*Do domu*("집으로", "집에"라는 뜻으로 "집에 가요"처럼 쓰여요)는 *do* 뒤에서 bank, hotel, park와 함께 이미 배운 속격 어미 *-u*를 똑같이 씁니다. 같은 규칙을 따르는 명사가 하나 더 늘었어요.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: 돌아가다, 돌아가요
    gloss: 돌아가다 / 돌아오다; 돌아가요 / 돌아와요
    note: do domu와 함께 써서 '집에 가요', '집에 돌아와요'라고 말해요. 폴란드어에서 가장 흔한 일상 표현 중 하나예요.
    example_gloss: 저는 저녁에 집에 돌아가요.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: 정오에, 오후에, 저녁에
    gloss: 정오에; 오후에; 저녁에
    note: '앞선 시간 단원 복습: rano, w nocy와 함께 이 시간대 표현들로 하루 전체를 말할 수 있어요.'
    example_gloss:
    - 저는 정오에 점심을 먹어요.
    - 저는 오후에 일해요.
    - 저는 저녁에 집에 돌아가요.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: 오후에 일하고, 그다음에 집에 가요
    gloss: 오후에 일하고, 그다음에 집에 돌아가요.
    note: 길 안내 단원에서 배운 쉼표 + potem으로 잇는 패턴을, 이번에는 하루 일과의 두 부분을 연결하는 데 써요.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: 자다, 자요
    gloss: 자다; 자요
    note: Śpię는 동사원형 spać에서 모음이 바뀐 것처럼 보이지만, 아주 자주 쓰는 동사이니 그대로 외워 두세요.
    example_gloss: 저는 밤에 자요.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: 너는요? 나도요.
    gloss: 너는요? / 나도요.
    note: A ty?는 대화를 상대방에게 넘기는 간단한 방법이고, ja też는 '나도요'라는 뜻이에요. 둘 다 일상적인 가벼운 대화에서 늘 나와요.
    example_gloss: 저도 아침에 아침을 먹어요.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: 하지만, 차, 아니
    gloss: 하지만; 차(목적어); 아니
    note: Ale는 대조를 이끌어요. nie가 동사 앞이 아니라 단어 바로 앞에 오면 '~이/가 아니라'라는 뜻이에요. piję herbatę, nie kawę는 '저는 커피가 아니라 차를 마셔요'라는 뜻이에요.
    example_gloss: 저는 차는 마시지만 커피는 안 마셔요.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: 일찍, 10시에
    gloss: 일찍; 10시에 -- 앞선 과의 czwartej, siódmej처럼 'o' 뒤의 시각에 붙는 같은 -ej 어미예요.
    note: '*O dziesiątej*(''10시에'')는 이미 배운 시각 패턴을 그대로 써요. *czwarta* -> *czwartej*, *siódma* -> *siódmej*처럼 *dziesiąta*도 *o* 뒤에서 *dziesiątej*가 돼요.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: 에바가 아침 일과를 이야기해요
    gloss: 에바는 아침 7시에 일어나서 커피를 마신다고 말해요.
    note: 이 단원에서 가장 먼저 배운 문장 패턴을 이번에는 실제 대화 속에서 써요.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: 에바가 하루 이야기를 이어가요
    gloss: 에바는 아침을 먹고, 그다음 오후에 일한다고 말해요.
    note: potem으로 1인칭 활동 두 가지를 잇는 패턴이에요. 2과에서 배운 것과 같아요.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: 에바가 이야기를 마치고 마레크에게 물어요
    gloss: 에바는 저녁에 집에 돌아간다고 말해요. 너는요?
    note: A ty?는 새로운 의문문 문법 없이도 대화를 마레크에게 넘겨 줘요.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: 마레크가 자기 아침을 이야기해요
    gloss: 마레크는 자기도 7시에 일어난다고 말해요! 하지만 커피가 아니라 차를 마셔요.
    note: Ja też로 공통점(일어나는 시각)을 확인한 뒤, ale...nie로 음료는 다르다고 대조해요.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: 마레크가 자기 하루를 설명해요
    gloss: 마레크는 아침에 일하고, 그다음 정오에 점심을 먹는다고 말해요.
    note: 에바와는 하루 순서가 달라요. 먼저 일하고, 그다음 낮에 식사를 해요.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: 마레크가 잠에 대해 이야기해요
    gloss: 마레크는 저녁 10시에 일찍 잔다고 말해요.
    note: 새로 배운 동사 spać/śpię와 이번 과에서 다시 쓴 시각 패턴으로 대화를 마무리해요.
