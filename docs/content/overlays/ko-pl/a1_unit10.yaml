  pl.a1.unit10.lesson01.exercise08.fix_locative_hour:
    instruction: 틀린 곳을 고치세요. 폴란드어에서는 시각을 말할 때 'o siódma'가 아니라 'o siódmej'라고 해요.
    accepted_answers:
