teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: 가다, 도착하다
    gloss: 가다; 도착하다
    note: 서로 밀접한 두 이동 동사예요 -- iść는 일반적인 '가다/걷다'이고, dojść는 목적지에 '다다르다/도착하다'라는 뜻으로 이번 과에서 배우는 질문 패턴에 쓰여요.
    example_gloss:
    - 직진해 주세요.
    - 은행에 어떻게 가요?
  pl.a1.unit09.lesson01.teach.prosto:
    title: 직진
    gloss: 곧장
    note: 가장 기본적인 방향 표현이에요 -- '직진하세요'라고 말할 때 iść 바로 뒤에 써요.
    example_gloss: 공원까지 직진해 주세요.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: 거기, 그다음
    gloss: 거기; 그다음에
    note: Tam은 장소를 가리키고, potem은 순서('먼저 이것, 그다음 저것')를 이어 줘요 -- 둘 다 길 안내를 이어서 말할 때 꼭 필요해요.
    example_gloss:
    - 은행은 저기에 있어요.
    - 그다음에는 직진해 주세요.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Proszę + 부정사
    gloss: 'Proszę + 부정사 -- Proszę(~해 주세요) 뒤에 동사의 부정사(사전에 나오는 형태)를 붙이면, 별도의 명령형 없이 길을 안내할 수 있는 일상적이고 공손한 표현이 돼요: 직진해 주세요.'
    note: '*Proszę*에 부정사 동사를 붙이면 폴란드어에서 공손하게 무언가를 부탁하는 말이 돼요 -- *Proszę iść prosto*("직진해 주세요"). 모르는 사람에게 쓰기에 안전하고 공손한 표현이라, 길을 안내하거나 알아들을 때 별도의 "명령형"이 필요하지 않아요. (친구 사이에서는 보통 그 명령형을 대신 쓰는데, 나중에 배워요.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: '[장소]에 어떻게 가요?'
    gloss: '~에 어떻게 가요? -- Jak(어떻게)와 dojść(~에 도착하다, 가다)를 함께 쓰면 장소로 가는 길을 물어요: 은행에 어떻게 가요? 호텔에 어떻게 가요? 공원에 어떻게 가요? ''do'' 뒤의 명사는 지난 단원에서 ''next to''/''across from'' 뒤에 썼던 것과 같은 -u 속격 어미를 취해요: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?*는 어떤 장소에 가는 방법을 묻는 일상적인 질문이에요. *do* 뒤에 오는 장소 이름은 *obok*/*naprzeciwko* 뒤에서 이미 배운 *-u* 속격 어미를 똑같이 취해요. *bank*는 *banku*, *hotel*은 *hotelu*, *park*는 *parku*가 돼요. 전치사만 새로울 뿐 규칙은 똑같아요.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: 은행에 어떻게 가요?
    gloss: 은행에 어떻게 가요?
    note: 문법 설명의 규칙을 이번 과의 첫 번째 목적지에 적용해 봐요.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: 오른쪽, 왼쪽
    gloss: 오른쪽; 왼쪽
    note: na 뒤에 써서 무언가가 어디에 있는지, 또는 어느 쪽으로 돌지 말해요. na prawo는 오른쪽(으로), na lewo는 왼쪽(으로)이라는 뜻이에요.
    example_gloss:
    - 은행은 오른쪽에 있어요.
    - 공원은 왼쪽에 있어요.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: 돌다
    gloss: 돌다
    note: 방향을 바꿀 때 쓰는 동사예요. na prawo/na lewo와 함께 쓰면 '오른쪽으로 돌다'/'왼쪽으로 돌다'라는 뜻이 돼요.
    example_gloss: 오른쪽으로 도세요.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: 왼쪽으로 도세요
    gloss: 왼쪽으로 도세요.
    note: Proszę + 동사원형 구조가 똑같아요. 이번에는 skręcić와 na lewo를 써요.
  pl.a1.unit09.lesson02.teach.ulica:
    title: 거리, 길
    gloss: 거리
    note: 어떤 거리에든 쓰는 평범한 단어예요. 길 안내에서 특정 거리 이름을 말할 때 유용해요.
    example_gloss: 그 길은 저기에 있어요.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: potem으로 길 안내 이어 말하기
    gloss: 똑바로 가다가 오른쪽으로 도세요. -- 쉼표와 potem(그다음에)이라는 말로 여러 방향 안내를 이을 수 있어요. 먼저 한 동작을 하고, 그다음에 다음 동작을 해요.
    note: 방향을 연달아 안내할 때는 쉼표와 *potem*으로 이어 주면 돼요. *Proszę iść prosto, potem skręcić na prawo* ("똑바로 가다가 오른쪽으로 도세요"). 실제로 여러 단계의 길 안내를 들으면 바로 이런 식으로 되어 있어요.
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: 이해해요
    gloss: 이해해요
    note: 길 안내를 알아들었다고 확인한 뒤에 이어서 질문할 때 쓰기 좋은 표현이에요.
    example_gloss: 이해했어요, 감사합니다.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: 에바가 공원에 가는 길을 물어요
    gloss: 에바가 실례합니다 하고 공원에 어떻게 가는지 물어요.
    note: Przepraszam으로 질문을 시작해요. 앞 단원의 장소 대화에서 배운 공손한 습관과 같아요.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: 지나가던 사람이 공원 가는 길을 알려 줘요
    gloss: 지나가던 사람이 똑바로 가다가 왼쪽으로 돌라고 말해요. 공원은 저기에 있어요.
    note: 이번 문법 설명에서 본 대로 potem을 써서 두 가지 방향을 이어 말해요.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: 에바가 알겠다고 하고 은행 가는 길을 물어요
    gloss: 에바가 이해했다고 말하고, 은행에 어떻게 가는지 물어요.
    note: Rozumiem은 첫 번째 안내를 알아들었다고 확인하는 말이에요. 그다음에 새 질문을 해요.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: 지나가던 사람이 은행 가는 길을 알려 줘요
    gloss: 지나가던 사람이 오른쪽으로 돌고 나서 똑바로 가라고 말해요. 은행은 오른쪽에 있어요.
    note: 공원 가는 길과는 다른 두 단계 경로예요. 같은 Proszę + 동사원형 구조를 다시 써요.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: 에바가 감사 인사를 해요
    gloss: 에바가 정말 감사하다고 말해요.
    note: Dziękuję bardzo는 쇼핑 단원과 장소 단원에서 이미 나온 표현이에요.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: 지나가던 사람이 대답해요
    gloss: 지나가던 사람이 천만에요라고 말해요.
    note: Proszę bardzo는 감사 인사에 대한 기본적인 대답이에요. 앞 단원에서도 나왔어요.
