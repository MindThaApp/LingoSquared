teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: 전체 가격 묻기
    gloss: 합쳐서 얼마예요?
    note: '*W sumie*(전부 해서)는 물건 하나의 가격이 아니라 합친 전체 가격을 알고 싶다는 뜻을 분명히 해 줘요.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: 전체 가격 말하기
    gloss: 전부 해서 100즈워티예요.
    note: '*Kosztuje*는 *kosztować*(값이 나가다)의 *on/ona/ono* 형태예요. 5 이상의 수는 복수 속격을 써요: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: 카드나 현금으로 계산하기
    gloss: 카드로 계산하다, 현금으로 계산하다
    note: '*Płacić kartą*(카드로 결제하다)와 *płacić gotówką*(현금으로 내다)는 모두 *płacić* 뒤에 조격을 써요: *kartą*, *gotówką*.'
    example_gloss:
    - 여기서 카드로 계산할 수 있나요?
    - 현금으로 계산할게요.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: 카드 결제가 되는지 묻기
    gloss: 여기서 카드로 계산할 수 있나요?
    note: '*Tu*(여기)는 질문을 지금 있는 장소에 두는 말이에요. *czy*는 예/아니요 질문을 열고, *mogę*는 ''할 수 있어요''라는 뜻이에요.'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: 결제 방법 묻기
    gloss: 현금으로 계산하시겠어요, 카드로 계산하시겠어요?
    note: '*Czy chce pan ...?*는 *Czy chcesz ...?*의 격식체로, 여기서는 낯선 계산원이 써요(남성에게는 *pan*, 여성에게는 *pani*).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: 계산서
    gloss: 계산서
    note: '남성 명사예요: *rachunek*(속격 *rachunku*).'
    example_gloss: 계산을 나눠서 낼까요?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: 계산 나누자고 제안하기
    gloss: 계산을 나눠서 낼까요?
    note: '*Może podzielimy ...?*는 함께 무언가를 하자고 공손하게 제안하는 표현이에요. *podzielimy*는 *podzielić*의 *my* 형태예요.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: 따로 계산해도 되는지 묻기
    gloss: 따로 계산해도 될까요?
    note: '*Osobno*(따로)는 *zapłacić*(지불하다, 완료상: 한 번으로 끝나는 지불)와 함께 써요.'
  pl.a1.unit23.lesson04.teach.reszta:
    title: 거스름돈
    gloss: 거스름돈
    note: '여성 명사예요: *reszta*(속격 *reszty*, *nie potrzebuję reszty*처럼).'
    example_gloss: 거스름돈 여기 있습니다.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: 거스름돈 건네기
    gloss: 거스름돈 여기 있습니다.
    note: '*Pana*는 격식을 갖춘 ''당신의''예요(남성에게는 pana, 여성에게는 *pani*). 계산대에서 쓰는 격식 있는 말투에 맞아요.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: 거스름돈 사양하기
    gloss: 거스름돈은 필요 없어요.
    note: '*Nie potrzebuję* + 속격: 부정문에서는 목적어가 속격이 되어서 *reszty*가 돼요.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: '35'
    gloss: 서른다섯
    note: '*Trzydzieści pięć*는 두 단어로 써요. 십의 자리가 먼저, 일의 자리가 나중에 와요(30 + 5).'
    example_gloss: 140즈워티예요.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: 식당 계산서 읽기
    gloss: '계산서: 메인 요리 2개와 커피 2잔. 합계: 140즈워티. 카드로 결제했어요.'
    note: 무엇을 주문했는지, 총액이 얼마인지, 어떻게 결제했는지 확인하세요.
    glosses:
      Rachunek: 계산서
      dwa: 둘
      dania: 메인 요리 (dania główne)
      kawy: 커피
      Razem: 총액
      złotych: 즈워티
      Zapłacono: 결제된
      kartą: 카드
      sto: 백
      czterdzieści: 마흔
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa가 계산서를 부탁해요
    gloss: 'Ewa: 계산서 부탁할까요?'
    note: '*Poprosić o*(~을 부탁하다) 뒤에는 대격이 와요: *o rachunek*. *Poprosimy*는 완료상 미래형이에요.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek이 총액을 물어요
    gloss: 'Marek: 네, 좋은 생각이에요. 전부 해서 얼마예요?'
    note: 1과에 나온 *Ile to kosztuje w sumie?* 질문을 다시 써요.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa가 총액을 말해요
    gloss: 'Ewa: 140즈워티예요. 나눠 낼까요?'
    note: '*Podzielimy się?*(직역: ''우리 나눌까요?'')는 재귀 표현 *się*를 써서 계산서를 나눈다는 뜻을 나타내요.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek이 자기가 내겠다고 해요
    gloss: 'Marek: 아니요, 오늘은 제가 낼게요. 저를 정말 많이 도와줬잖아요!'
    note: '*Dzisiaj ja płacę*(직역: ''오늘은 내가 낸다'')는 자기가 내겠다고 할 때 쓰는 표준 표현이에요. *pomogłaś*는 *pomóc*(돕다)의 여성 과거형으로, Marek이 Ewa에게 말하기 때문이에요.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa가 감동해요
    gloss: 'Ewa: 정말 친절하시네요! 고마워요.'
    note: '*Miło z twojej strony*(친절하시네요)는 너그러운 행동에 하는 따뜻하고 흔한 칭찬이에요. *z* + 생격: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek이 카드 결제가 되는지 물어봐요
    gloss: 'Marek: 여기서 카드로 결제할 수 있나요?'
    note: 2과에서 나온 *Czy mogę tu zapłacić kartą?* 질문을 이번에는 실제 식당에서 다시 써요.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: 그/그녀 형태'
    gloss: Marek이 계산서를 계산해요.
    note: '*Płaci*는 *płacić*(지불하다)의 *on/ona/ono* 형태예요.'
