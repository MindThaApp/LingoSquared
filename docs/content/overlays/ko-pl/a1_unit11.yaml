teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: 원하다, 나는 원해요
    gloss: 원하다; 나는 원해요
    note: Chcieć는 부정사이고, chcę는 내가 원하는 것을 말할 때 일상적으로 쓰는 1인칭 형태예요.
    example_gloss: 저는 영화관에 가고 싶어요.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: 너는 원해
    gloss: 너는 원해 (친근한 말투)
    note: Chcesz는 친근한 '너' 형태로, masz, jesteś와 같은 방식으로 쓰여요. 친구에게 무엇을 원하는지 물을 때 바로 쓰는 말이에요.
    example_gloss: 커피 마실래요?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: 나는 원해요, 너는 원해
    gloss: Chcę, chcesz -- masz (mieć), jesteś (być)와 같은 패턴이에요. chcesz는 '너'(2인칭) 형태로, 상대방이 무언가를 원하는지 물을 때 써요.
    note: 이 단원에서는 '나'뿐 아니라 '너'도 필요해요. *chcę*(나는 원해요)와 *chcesz*(너는 원해)는 이미 아는 *masz*, *jesteś*와 똑같은 인칭 패턴이고, 새로운 동사에 적용한 것일 뿐이에요.
  pl.a1.unit11.lesson01.teach.kino:
    title: 영화관
    gloss: 영화관
    note: 영화관을 가리키는 일상적인 말로, 약속을 잡을 때 자주 나와요.
    example_gloss: 여기는 영화관이에요.
  pl.a1.unit11.lesson01.teach.razem:
    title: 함께
    gloss: 함께
    note: Razem은 쇼핑 상황에서는 '합계'라는 뜻이기도 해요(쇼핑 단원에서 본 기억이 날 거예요). 여기서는 또 다른 일상적인 뜻인 '함께'로 쓰였어요.
    example_gloss: 같이 갈래요?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: 영화관에 갈래요?
    gloss: 영화관에 갈래요?
    note: Czy는 예/아니요 질문을 시작하고, chcesz iść do kina는 상대방이 무엇을 하고 싶은지 물어요. 약속을 제안하는 핵심 표현이에요.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: 금요일에 같이 영화관에 갈래요?
    gloss: 금요일에 같이 영화관에 갈래요?
    note: 완전한 제안이에요. 방금 배운 질문에 razem(함께)과 w piątek(금요일에)을 덧붙였어요.
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: 할 수 있다, 나는 할 수 있어요
    gloss: 할 수 있다; 나는 할 수 있어요
    note: Móc는 부정사이고, mogę는 1인칭 형태예요. 앞선 날짜·시간 단원에서 본 możemy('우리는 할 수 있어요')와 같은 동사이고, 단수형일 뿐이에요.
    example_gloss: 저는 금요일에 갈 수 있어요.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: 너는 할 수 있어
    gloss: 너는 할 수 있어 (친근한 말투)
    note: Możesz는 친근한 '너' 형태로, chcesz와 같은 2인칭 패턴이에요. 상대방이 무언가를 할 수 있는지 물을 때 써요.
    example_gloss: 토요일에 시간 돼요?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: 오다
    gloss: 오다
    note: 누군가를 만나러 올 때 쓰는 동사로, mogę/możesz와 함께 쓰면 누가 올 수 있는지 또는 없는지를 자연스럽게 말할 수 있어요.
    example_gloss: 저는 금요일에 오고 싶어요.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: 나는 할 수 있어요, 너는 할 수 있어
    gloss: 'Móc: mogę, możesz -- chcesz와 같은 2인칭(너)이에요. Mogę 뒤에 부정사를 붙이면 내가 할 수 있는 일을 말해요: mogę przyjść(나는 올 수 있어요), mogę iść(나는 갈 수 있어요).'
    note: '*Mogę* 뒤에 동사 원형을 붙이면 할 수 있는 일을 말할 수 있어요. *mogę przyjść*("나는 올 수 있어요")와 *mogę iść*("나는 갈 수 있어요")는 모두 이 간단한 패턴을 따라요.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: 기꺼이
    gloss: 기꺼이
    note: 계획을 따뜻하고 반갑게 받아들이는 표현이에요. 더 정다운 느낌을 주려고 tak(예)나 bardzo(매우)와 함께 쓰는 경우가 많아요.
    example_gloss: 네, 아주 기꺼이요!
  pl.a1.unit11.lesson02.teach.niestety:
    title: 안타깝게도
    gloss: 안타깝게도
    note: 계획을 정중하게 거절할 때 쓰는 자연스러운 완충 표현이에요. 거의 항상 뒤에 nie mogę(할 수 없어요)가 이어져요.
    example_gloss: 안타깝지만 안 돼요.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: 토요일에
    gloss: 'W + 요일: 남성 요일(piątek, poniedziałek, czwartek)은 어미가 변하지 않아요 -- w piątek. 여성 요일(sobota, środa, niedziela)은 kawa -> kawę처럼 대격 어미 -ę가 붙어요 -- w sobotę.'
    note: '*w* 뒤에서 모든 요일이 같은 방식으로 쓰이지는 않아요. *sobota* 같은 여성 요일은 *sobotę*로 바뀌는데, *kawa* -> *kawę*, *herbata* -> *herbatę*에서 이미 배운 *-a* -> *-ę* 어미와 똑같아요. *piątek* 같은 남성 요일은 그대로 두어요.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: 토요일에 올 수 있어요?
    gloss: 토요일에 올 수 있어요?
    note: możesz, przyjść, 그리고 새로 배운 w sobotę 형태를 합친 표현으로, 다른 요일을 제안하며 물을 때 쓰는 완전한 문장이에요.
  pl.a1.unit11.lesson03.teach.moze:
    title: 아마, ~는 어때요?
    gloss: 아마 / ~는 어때요?
    note: 다른 안을 제안할 때 쓰는 말이에요. 첫 번째 계획이 안 될 때 다른 것을 제안하고 싶으면 자주 나와요.
    example_gloss: 토요일은 어때요?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może와 mogę의 차이
    gloss: Może와 mogę는 비슷해 보이지만 뜻이 달라요. może('아마')는 새로운 것을 제안하고, mogę(동사의 '나' 형태, '나는 할 수 있어요')는 내가 할 수 있는 일을 말해요.
    note: 글로 보면 헷갈리기 쉬워요. *może*("아마", 여기서는 무언가를 제안할 때 쓰여요)와 *mogę*("나는 할 수 있어요", 1인칭 동사)는 같은 어근에서 왔지만 문장에서 하는 역할이 달라요. 마지막 글자를 잘 보세요.
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: 몇 시에요?
    gloss: 몇 시에요?
    note: 요일이 이미 정해졌을 때 구체적인 시간을 묻는 표준 표현이에요. 앞선 시간 단원에서 o której를 본 기억이 날 거예요.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: 에바가 영화관에 가자고 제안해요
    gloss: 에바가 마렉에게 금요일에 영화관에 가고 싶은지 물어요.
    note: 이 단원에서 가장 먼저 배운 질문을 이제 실제 대화 속에서 다시 써요.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: 마렉은 금요일에 안 돼요
    gloss: 마렉이 안타깝지만 금요일에는 안 된다고 말해요.
    note: Niestety가 거절을 부드럽게 하고, 그다음 nie mogę가 분명하게 말해 줘요.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: 마렉이 토요일을 제안해요
    gloss: 마렉이 토요일은 어떠냐고 물어요.
    note: Może는 거절하고 대화를 끝내는 대신 다른 안을 내놓아요.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: 에바가 기꺼이 수락해요
    gloss: '에바가 말해요: 토요일이요? 기꺼이요!'
    note: 제안받은 요일을 (w sobotę 형태 그대로) 따라 말한 뒤 chętnie로 수락해요.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: 에바가 시간을 물어요
    gloss: '에바가 물어요: 몇 시에요?'
    note: 요일이 정해졌으니 마지막으로 정할 것은 시간이에요.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: 마렉이 시간을 확정해요
    gloss: '마렉이 말해요: 오후 네 시에요.'
    note: 앞선 시간 단원과 일과 단원에서 배운 시각 표현을 다시 써서 구체적인 시간으로 약속을 마무리해요.
