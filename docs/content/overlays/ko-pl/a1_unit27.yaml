  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: '*codziennie*(매일)와 *często*(자주)는 이미 알고 있어요. *Dwa razy w tygodniu*(일주일에 두 번)는 빈도를 더 구체적으로 말하는 새로운 표현이에요.'
    note: 취미 단원에서 배운 빈도 표현을 넓혀 줘요.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: 저는 일주일에 두 번 요가를 해요
    gloss: 저는 일주일에 두 번 요가를 해요.
