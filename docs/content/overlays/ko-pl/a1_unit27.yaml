    gloss: 마레크는 축구를 자주 해요.
    note: '*Często*(자주)는 빈도 부사이고 동사 앞에 와요: *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport와 gram w의 차이
    gloss: '*Uprawiam sport*는 운동을 한다고 일반적으로 말하는 표현이에요. *gram w piłkę nożną* 같은 동사 표현은 구체적인 운동 종목을 말해요. 둘 다 올바른 폴란드어예요.'
    note: '*Uprawiać sport*는 취미 수업에서 배운 일반적인 동사이고, *grać w* 같은 동사는 구체적인 종목을 말해요. 하나는 일반적이고 다른 하나는 구체적이에요.'
