    note: 계획 단원에서 배운 제안 구문을 그대로 다시 써요.
  pl.a1.unit27.lesson06.teach.kasia_tak_fajnie:
    title: 카시아가 동의해요
    gloss: '카시아: 네, 좋아요! 저는 수영을 아주 좋아해요.'
  pl.a1.unit27.lesson06.teach.marek_wole_grac:
    title: 마레크는 축구를 더 좋아해요
    gloss: '마레크: 저는 축구를 하는 게 더 좋아요.'
  pl.a1.unit27.lesson06.teach.tomek_a_ja:
    title: 토메크는 달리기를 좋아해요
    gloss: '토메크: 저는 달리기를 좋아해요.'
