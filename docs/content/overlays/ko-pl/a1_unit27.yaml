    gloss: '마레크: 어디에서 달려요?'
  pl.a1.unit27.lesson04.teach.tomek_w_parku:
    title: 토메크가 장소를 대답해요
    gloss: '토메크: 공원에서요, 우리 집 근처에 있어요.'
  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać는 사람에 따라 변해요
    gloss: '*Biegać*(달리다)는 사람에 따라 어미가 변해요: *biegam*(나는 달려요), *biegasz*(너는 달려요), *biega*(그는 달려요).'
    note: '폴란드어 동사는 사람마다 어미가 달라서 주어 대명사를 보통 생략해요: *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: 마레크가 반응해요
    gloss: '마레크: 좋네요, 저도 거기서 축구를 자주 해요.'
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: 에바와 카시아의 운동 이야기
    gloss: 에바는 일주일에 두 번 요가를 해요. 차분한 움직임을 아주 좋아해요. 카시아는 요가는 하지 않지만 수영을 아주 좋아해요. 카시아는 거의 매주 자주 수영해요. 여러분은 어떤 운동을 하나요?
    note: 짧은 글 하나에서 서로 다른 두 운동과 서로 다른 두 빈도 표현을 대조해 보여 줘요.
