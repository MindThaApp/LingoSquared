    title: 저는 축구를 해요
    gloss: 저는 축구를 해요.
    note: '*Gram w piłkę nożną*은 *grać w* + 대격을 쓴 표현이에요(직역하면 ''축구에서 경기한다''). 다른 운동에는 다른 동사를 써요. 문법 설명을 참고하세요.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: 운동마다 다른 동사
    gloss: '운동마다 자기만의 동사가 있어요: *gram w piłkę nożną*(축구를 해요), *biegam*(달려요), *pływam*(수영해요), *ćwiczę jogę*(요가를 해요).'
    note: 이 단계에서는 운동마다 다른 동사를 따로 외울 필요 없이, 위의 두 가지 구문이면 모든 운동을 말할 수 있어요.
