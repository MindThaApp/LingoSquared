teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: 이다/있다, 이것은, 주세요 -- 다시 한번
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- 앞선 수업에서 이미 배운 단어들이에요.
    note: 이번 수업에서 옷 쇼핑 이야기에 쓰기 전에 간단히 복습해요.
  pl.a1.unit20.lesson01.teach.sklep:
    title: 가게
    gloss: 가게 / 상점
    note: 가게를 두루 가리키는 말이에요.
    example_gloss: 가게에 가요.
  pl.a1.unit20.lesson01.teach.koszula:
    title: 셔츠
    gloss: 셔츠
    note: 여성 명사예요 -- 여성형 형용사와 함께 쓰여요.
    example_gloss: 이것은 셔츠예요.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: 바지
    gloss: 바지
    note: 한 벌이어도 폴란드어에서는 항상 복수예요 -- 단수형이 없어요.
    example_gloss: 이것은 바지예요.
  pl.a1.unit20.lesson01.teach.kupic:
    title: 사다
    gloss: 사다
    note: '''*chcę*''(원해요) 뒤에 쓰며, 앞선 수업의 ''*iść*''(가다)와 같아요: ''*chcę kupić*'' -- 사고 싶어요.'
    example_gloss: 셔츠를 사고 싶어요.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: 바지를 사고 싶어요
    gloss: 바지를 사고 싶어요.
    note: chcę + 동사원형 패턴을 바지에 그대로 적용한 문장이에요.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: 셔츠는 얼마예요?
    gloss: 셔츠는 얼마예요?
    note: 특정 물건의 가격을 묻는 자연스러운 표현이에요. 쇼핑 수업의 '*Ile kosztuje*'를 다시 썼어요.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: 어떤 -- 남성형
    gloss: Jaki, Jaka -- '*Jaki*'는 남성 명사에 대해, '*Jaka*'는 여성 명사에 대해 물어요 ('*Jaka*'는 날씨 수업에서 이미 배웠어요).
    note: '''*Kolor*''(색)는 남성 명사라서 ''*Jaka*''가 아니라 ''*Jaki*''와 함께 써요.'
  pl.a1.unit20.lesson02.teach.kolor:
    title: 색
    gloss: 색
    note: 남성 명사예요.
    example_gloss: 무슨 색이에요?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: 원피스
    gloss: 원피스
    note: '''*koszula*''처럼 이것도 여성 명사예요.'
    example_gloss: 이것은 원피스예요.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: 파란색
    gloss: Koszula jest niebieska. -- '*niebieska*'는 '*koszula*'처럼 여성 명사와 일치해요.
    note: 이 형태만 해당돼요 -- 지금까지 이 코스에서는 '*koszula*'와 짝을 이뤄요.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: 빨간색
    gloss: Sukienka jest czerwona. -- '*czerwona*'도 '*niebieska*'처럼 여성 명사와 일치해요.
    note: '''*niebieska*''가 ''*koszula*''와 짝인 것처럼, 여기서 이 형태는 ''*sukienka*''와 짝이에요.'
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: 셔츠는 파란색이에요
    gloss: 셔츠는 파란색이에요.
    note: 마레크가 셔츠를 살 때 이 단원에서 다시 쓰이는 문장이에요.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: 원피스는 빨간색이에요
    gloss: 원피스는 빨간색이에요.
    note: 다른 물건에도 같은 jest + 색깔 패턴을 써요.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: 안녕하세요, 주세요, 매우 -- 다시 한번
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- 앞선 수업에서 이미 배운 단어들이에요.
    note: 이번 수업의 가게 대화에 앞서 간단히 복습해요.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: 사이즈
    gloss: 치수
    note: 폴란드의 옷 사이즈는 보통 S, M, L처럼 알파벳으로 나타내요.
    example_gloss: 어떤 사이즈예요?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: 선생님, 원하다
    gloss: Co pan chce kupić? -- '*pan*'은 남성을 높여 부르는 말로, 여성에게 쓰는 '*pani*'와 같아요 ('*pani*'는 쇼핑 수업에서 이미 배웠어요).
    note: '''*chce*''는 ''*chcieć*''의 그/그녀 형태예요 -- ''*chcę*''(나는 원해요)와 ''*chcesz*''(너는 원해요)는 이미 알고 있어요.'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: 무엇을 사고 싶으세요, 선생님?
    gloss: 무엇을 사고 싶으세요, 선생님?
    note: 점원이 남자 손님에게 공손하게 말을 거는 방법이에요.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: 점원이 Marek에게 인사해요
    gloss: 안녕하세요! 무엇을 사고 싶으세요, 손님?
    note: Sprzedawca(점원)는 앞선 쇼핑 단원에서 시장 상인이 썼던 것과 같은 공손한 말투로 말을 시작해요.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek이 원하는 것을 말해요
    gloss: 셔츠와 바지를 사고 싶어요.
    note: Marek은 사려는 물건 두 가지를 모두 말해요.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: 점원이 사이즈를 물어요
    gloss: 어떤 사이즈예요?
    note: 짧고 자연스러운 후속 질문이에요.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek이 자기 사이즈를 말해요
    gloss: M 사이즈요.
    note: Marek은 사이즈 글자만 말해서 자연스럽게 대답해요.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: 점원이 재고와 가격을 알려 줘요
    gloss: 파란색 셔츠와 바지가 있어요. 전부 100즈워티예요.
    note: '''*Mamy*''는 ''우리는 가지고 있다''라는 뜻이에요(''*mam*'', ''*masz*''와 같은 동사예요). 이 동사 뒤에서 ''*koszula*''는 ''*koszulę*''로, ''*niebieska*''는 ''*niebieską*''로 바뀌어요. ''*Chcę kupić koszulę*''에서 본 것과 같은 변화예요. 색깔은 2과의 파란 셔츠와 같아요.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek이 수락해요
    gloss: 좋아요, 그걸로 할게요.
    note: Marek이 구매를 확정하며 대화를 마무리해요.
