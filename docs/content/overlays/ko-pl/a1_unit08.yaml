teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: 은행, 우체국
    gloss: 은행; 우체국
    note: 일상에서 흔히 가는 두 곳이에요. bank는 한국어 '뱅크'와 비슷하게 알아보기 쉽고, poczta는 편지나 소포를 부치러 가는 곳이에요.
    example_gloss:
    - 여기는 은행이에요.
    - 여기는 우체국이에요.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: 약국, 식당
    gloss: 약국; 식당
    note: Apteka는 약을 사는 곳이고 일반 상점이 아니에요. restauracja는 '레스토랑'과 비슷해서 알아보기 쉬워요.
    example_gloss:
    - 여기는 약국이에요.
    - 여기는 식당이에요.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: 호텔; 공원
    note: 둘 다 한국어와 발음이 비슷해서, 글로 보나 소리로 들으나 쉽게 알아볼 수 있어요.
    example_gloss:
    - 여기는 호텔이에요.
    - 여기는 공원이에요.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: '[장소]은(는) 어디에 있어요?'
    gloss: '[장소]은(는) 어디에 있어요? -- Gdzie(어디)와 jest(있다)가 합쳐져 위치를 물어요: 은행은 어디에 있어요? 약국은 어디에 있어요?'
    note: '*Gdzie*는 "어디", *jest*는 "있다"라는 뜻이에요. 합친 *Gdzie jest...?*는 어떤 장소든 어디 있는지 물을 때 쓰는 일상적인 질문 패턴이에요. 장소가 하나일 때 이 형태 그대로 쓰고, 장소가 여러 곳이면 폴란드어는 jest 대신 *są*("있다"의 복수형)를 써요.'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: 은행은 어디에 있어요?
    gloss: 은행은 어디에 있나요?
    note: 문법 노트의 패턴에 이번 과의 첫 장소 단어를 넣어 실제로 쓴 문장이에요.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: 가깝다, 멀다
    gloss: 가깝다; 멀다
    note: 간단한 반대말 쌍이에요. jest 바로 뒤에 써서 장소가 얼마나 가깝거나 먼지 말해요.
    example_gloss:
    - 공원은 가까워요.
    - 호텔은 멀어요.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: 멀지 않다
    gloss: 멀지 않아요
    note: 문자 그대로 *nie*(아니다)와 *daleko*(멀리)가 한 단어로 합쳐진 말이에요. 어떤 곳이 쉽게 갈 수 있는 거리라고 안심시킬 때 쓰는, 더 부드럽고 아주 흔한 표현이에요.
    example_gloss: 약국은 멀지 않아요.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: 옆에, 맞은편에
    gloss: 옆에; 맞은편에
    note: 둘 다 얼마나 가까운지가 아니라, 기준이 되는 장소에 대한 위치를 나타내요. 뒤에 오는 명사는 둘 다 속격으로 바뀌어야 해요 -- 이번 과의 문법 설명을 보세요.
    example_gloss:
    - 약국은 은행 옆에 있어요.
    - 식당은 호텔 맞은편에 있어요.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: '''obok''/''naprzeciwko''/''blisko + 명사'' 뒤: 속격'
    gloss: '''옆에''/''맞은편에''/''근처에'' + 장소 뒤에는 속격을 써요 -- bank -> 은행의, hotel -> 호텔의, park -> 공원의. 약국은 은행 옆에 있어요. 식당은 호텔 맞은편에 있어요. 식당은 공원 근처에 있어요.'
    note: '*Obok*, *naprzeciwko*, 그리고 *blisko*(혼자 쓰이지 않고 뒤에 장소가 올 때)는 모두 속격을 취해서, 뒤에 오는 명사의 어미가 바뀌어요. 규칙적인 남성 명사 세 개는 *-u*를 붙이면 돼요. *bank*는 *banku*, *hotel*은 *hotelu*, *park*는 *parku*가 돼요. *blisko*를 혼자 쓸 때는 속격이 전혀 필요 없어요 -- *To jest blisko*("가까워요")도 *blisko parku*("공원 근처")만큼 올바른 표현이에요.'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: 약국은 은행 옆에 있어요
    gloss: 약국은 은행 옆에 있어요.
    note: 문법 설명의 -u 패턴을 실제 문장에 적용해 봐요 -- obok 뒤에서 bank가 banku가 돼요.
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: 실례합니다
    gloss: 실례합니다 / 죄송합니다
    note: 모르는 사람의 주의를 끌 때 쓰는 일상적인 표현이에요 -- 질문 뒤가 아니라 질문 앞에 말해요.
    example_gloss: 실례합니다, 은행이 어디예요?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa가 약국을 물어요
    gloss: Ewa가 실례합니다라고 말하고 약국이 어디인지 물어요.
    note: Przepraszam은 이번 과의 어휘 설명처럼 질문을 여는 말이에요 -- Marek처럼 아는 사람에게도, 무언가를 묻기 전에 말을 걸 때 쓰는 공손한 표현이에요.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek이 약국의 위치를 알려 줘요
    gloss: Marek이 약국은 멀지 않고 은행 옆에 있다고 말해요.
    note: niedaleko와 obok + banku를 함께 썼어요. 둘 다 2과 문법 설명에 나와요.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa가 Marek에게 고마워하고 식당에 대해 물어요
    gloss: Ewa가 고맙다고 말하고, 식당이 어디인지 물어요.
    note: Dziękuję는 앞 단원에서 이미 나왔어요. A(그리고)는 새 질문을 앞의 말에 이어 줘요.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek이 식당의 위치를 알려 줘요
    gloss: Marek이 식당은 호텔 맞은편, 공원 근처에 있다고 말해요.
    note: Naprzeciwko + hotelu(속격, banku와 같은 패턴)에, 두 번째 기준 장소를 말하는 blisko가 더해졌어요.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa가 Marek에게 다시 고마워해요
    gloss: Ewa가 정말 고맙다고 말해요.
    note: Bardzo(매우)는 proszę bardzo에서처럼 dziękuję의 뜻을 강조해요.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek이 대답해요
    gloss: Marek이 천만에요라고 말해요.
    note: Proszę bardzo는 고맙다는 말에 대한 기본 대답이에요. 쇼핑 단원에서 이미 나왔어요.
