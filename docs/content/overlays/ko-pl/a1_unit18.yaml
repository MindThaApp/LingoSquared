    example_gloss: Ewa는 아파트가 있어요.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: 큰
    gloss: 집이 커요. -- '*duży*'는 '*dom*' 같은 남성 명사에 쓰여요.
    note: 이 코스에서 크기를 나타내는 단어가 나오는 것은 처음이에요. 지금은 '*dom*'에만 쓰여요.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Marek의 집
    gloss: Marek은 집이 있어요. 집이 커요.
    note: 이 단원이 Marek에 대해 계속 이어 가는 내용이에요.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Ewa의 집
    gloss: Ewa는 아파트가 있어요.
    note: 이 단원이 Ewa에 대해 계속 이어 가는 내용이에요.
  pl.a1.unit18.lesson01.teach.pokoj:
