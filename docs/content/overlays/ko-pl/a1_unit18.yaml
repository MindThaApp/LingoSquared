  pl.a1.unit18.lesson03.teach.recap_words:
    title: 네, 그리고, ~이 있다 -- 복습
    gloss: Tak, i, są, A, ja, jeden -- 앞 수업에서 이미 배운 단어예요.
    note: 이 수업의 대화에 앞서 간단히 복습해요.
  pl.a1.unit18.lesson03.teach.lodowka:
