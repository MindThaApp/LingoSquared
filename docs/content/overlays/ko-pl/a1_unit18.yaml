    note: Ewa가 자연스럽게 이어서 질문해요.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek의 대답
    gloss: 방이 두 개 있어요. 집에는 부엌, 침실, 욕실이 있어요.
    note: Marek이 방의 개수를 말하고 집에 있는 방들을 차례로 말해요.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa가 자기 집을 설명해요
    gloss: 그리고 저는 아파트가 있어요. 방이 하나 있어요.
    note: Ewa가 더 작은 자기 집 이야기를 해요.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa가 부엌에 대해 물어요
    gloss: 부엌이 작아요?
    note: Ewa가 Marek의 부엌에 대해 이어서 질문해요.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek의 대답
    gloss: 네, 부엌이 작아요. 부엌에 냉장고와 오븐이 있어요.
    note: Marek이 부엌의 크기를 확인해 주고 부엌에 있는 물건 두 가지를 말해요.
