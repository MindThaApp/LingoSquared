    title: 방에, 부엌에...
    gloss: 'W + 방, 부엌, 침실, 욕실: w pokoju, w kuchni, w sypialni, w łazience -- w szkole(학교에), w biurze(사무실에)와 같은 방식이에요.'
    note: 이미 배운 직장 관련 단어와 같은 원리예요. 그 방 '안에'를 나타내려고 어미가 조금 바뀌어요.
