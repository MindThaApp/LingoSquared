    title: 방이 몇 개예요?
    gloss: 방이 몇 개 있어요? 방이 두 개 있어요. -- 'Ile', 숫자, 'mam'/'masz'는 앞 수업에서 이미 배웠어요. '*pokoi*'와 '*pokoje*'는 '*pokój*'의 형태예요.
    note: '''*Pokoi*''는 ''*Ile*'' 바로 뒤에 쓰고, ''*pokoje*''는 ''*dwa*'', ''*trzy*'', ''*cztery*''(둘, 셋, 넷) 바로 뒤에 써요.'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: 방이 몇 개예요?
    gloss: 방이 몇 개예요?
