  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: 집, ~이다/있다, 가지고 있다 -- 복습
    gloss: 'Dom, jest, ma, Marek, Ewa -- 앞 수업에서 이미 배운 단어예요. 예: ''Dom jest tam'' (집이 저기 있어요).'
