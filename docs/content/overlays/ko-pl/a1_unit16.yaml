teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: 아파요
    gloss: 'Boleć(아프다)의 현재형: boli(그/그녀/그것)와 bolą(그들). Głowa mnie boli는 ''머리가 아파요''라는 뜻이에요 -- 직역하면 ''머리가 나를 아프게 해요''.'
    note: 아픈 곳을 말할 때 *boleć*의 현재형은 이 두 가지 형태만 써요 -- 신체 부위가 주어이고 *mnie*가 누구의 것인지 알려 주기 때문에, '내가 아프다'에 해당하는 형태는 여기서 배울 필요가 없어요.
  pl.a1.unit16.lesson01.teach.glowa:
    title: 머리
    gloss: 머리
    note: 아프다고 말할 때 가장 흔히 쓰는 부위예요.
    example_gloss: 머리가 아파요.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: 목
    gloss: 목
    note: 감기에 걸렸거나 목이 아플 때 설명하기 좋아요.
    example_gloss: 목이 아파요.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: 배
    gloss: 배
    note: 과식한 뒤나 속이 안 좋을 때 유용해요.
    example_gloss: 배가 아파요.
  pl.a1.unit16.lesson01.teach.zeby:
    title: 치아
    gloss: 치아
    note: 여기서는 항상 복수로 써요. 폴란드어 원어민도 그렇게 말해요 -- 그래서 *boli*가 아니라 *bolą*를 써요.
    example_gloss: 이가 아파요.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: 어디가 아파요?
    gloss: 어디가 아파요?
    note: 몸이 안 좋은 사람에게 건네는 자연스러운 질문이에요.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: 기분이 어때요?
    gloss: 'Czuć się(느끼다, 몸 상태가 ~하다): czuję się(나), czujesz się(너). 몸은 좀 어때요?'
    note: 지금은 두 가지 형태만 배워요 -- 자신에게는 *czuję*, 상대에게 물을 때는 *czujesz*.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: 좋아요와 안 좋아요
    gloss: 컨디션이 좋아요. 몸이 안 좋아요. -- dobrze는 이미 알고 있고, źle는 그 반대말이에요.
    note: 첫 수업부터 써 온 *dobrze*가 이제 반대말과 짝을 이뤄요.
  pl.a1.unit16.lesson02.teach.zle:
    title: 안 좋게
    gloss: 안 좋게
    note: 몸이 안 좋다고 말할 때 필요한 단어예요.
    example_gloss: 몸이 안 좋아요.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: 열
    gloss: 열
    note: 증상 중 기본적이고 흔한 표현이에요.
    example_gloss: 열이 나요.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma -- 다시 한번
    gloss: Ewa, ma -- 이 이름과 동사 mieć(가지다)의 이 형태는 앞선 수업에서 이미 배웠어요 (Mam, masz, ma).
    note: 이 수업에서 둘 다 쓰기 전에 짧게 복습해요.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: 아픈
    gloss: 아픈 (남성) / 아픈 (여성)
    note: '*młodszy/starsza*에서 이미 배운 -y/-a 패턴과 같아요 -- 남자는 *chory*, 여자는 *chora*예요.'
    example_gloss:
    - 그는 아파요.
    - 그녀는 아파요.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa는 몸이 안 좋아요
    gloss: 몸이 안 좋아요. 열이 있어요.
    note: Ewa가 자신의 증상을 말해요. 이 단원의 대화에서도 같은 말을 다시 해요.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: 다시 Marek
    gloss: Marek -- 이 이름은 앞선 수업에서 이미 배웠어요.
    note: 이번 수업의 대화 전에 간단히 복습해요.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: 다시 '그리고'
    gloss: I -- 이 단어는 앞선 수업에서 이미 배웠어요.
    note: 이번 수업의 대화 전에 간단히 복습해요.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: 다시 '부탁합니다'와 '물'
    gloss: Proszę와 wodę -- 두 단어 모두 앞선 수업에서 이미 배웠어요.
    note: 이번 수업의 대화 전에 간단히 복습해요.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: 다시 '감사합니다'
    gloss: Dziękuję -- 이 단어는 앞선 수업에서 이미 배웠어요.
    note: 이번 수업의 대화 전에 간단히 복습해요.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: 쉬다
    gloss: 쉬다
    note: '*Proszę*와 함께 써요. 이미 배운 ''직진하세요'', ''이쪽으로 도세요''처럼 *Proszę* + 동사원형 형태이고, 명령형은 필요 없어요.'
    example_gloss: 쉬세요.
  pl.a1.unit16.lesson03.teach.pic:
    title: 마시다
    gloss: 마시다
    note: '*Proszę* 뒤에 같은 방식으로 오는 또 다른 동사원형이에요.'
    example_gloss: 물을 마시세요.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek이 Ewa의 상태를 물어요
    gloss: Ewa, 몸은 어때요?
    note: Marek은 Ewa가 평소와 다르다는 것을 알아채고 바로 물어봐요.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa가 증상을 말해요
    gloss: 몸이 안 좋아요. 목이 아프고 열이 있어요.
    note: Ewa는 이 단원 앞부분에서 이미 말한 두 가지 증상을 분명하게 말해요.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek이 간단한 조언을 해요
    gloss: 쉬고 물을 마시세요.
    note: 진단이 아닌 간단한 조언이에요. 의학적 지시가 아니라 상식적인 말이에요.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa가 Marek에게 고마워해요
    gloss: 알겠어요, 고마워요, Marek.
    note: 익숙하고 간단한 대화의 마무리예요.
