teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: 역
    gloss: 역
    note: 기차와 버스가 오가는 곳이에요. 이번 단원 전체의 출발점이에요.
    example_gloss: 역은 호텔에서 가까워요.
  pl.a1.unit15.lesson01.teach.bilet:
    title: 표
    gloss: 승차권
    note: 기차나 버스를 타기 전에 꼭 필요해요.
    example_gloss: 표는 20즈워티예요.
  pl.a1.unit15.lesson01.teach.peron:
    title: 승강장
    gloss: 승강장
    note: 기차를 기다리며 실제로 서 있는 곳이에요.
    example_gloss: 1번 승강장은 저쪽이에요.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: 1번 승강장, 2번 승강장…
    gloss: '승강장 번호를 말할 때는 Peron numer + 숫자로 말하면 돼요: Peron numer jeden, Peron numer dwa.'
    note: 보기보다 간단해요. *peron* + *numer* + 이미 아는 평범한 숫자만 쓰면 돼요. (역 안내 방송에서는 *peron pierwszy*(1번 승강장)처럼 서수를 쓰기도 하지만, *peron numer jeden*도 언제나 알아들어요.)
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: 다시 기차
    gloss: Pociąg odjeżdża o czwartej po południu -- 시간 수업에서 이미 배운 문장이에요.
    note: 시간 단원에서 배운 내용을 이번에는 여행 장면에서 써 봐요.
  pl.a1.unit15.lesson01.teach.krakow:
    title: 크라쿠프
    gloss: 크라쿠프
    note: 폴란드의 실제 도시예요. 이번 단원의 첫 번째 목적지예요.
    example_gloss: 크라쿠프는 멀어요.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: 크라쿠프로
    gloss: '어딘가로 갈 때는 do + 도시 이름의 다른 형태를 써요: do Krakowa (do Kraków가 아니에요). 이 형태를 통째로 외워 두세요.'
    note: '*Krakowa*를 규칙으로 만들어 내려 하지 말고, 지금은 *do Krakowa*를 하나의 고정된 표현으로 외우세요.'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: 크라쿠프행 표 한 장 주세요
    gloss: 크라쿠프행 표 한 장 주세요.
    note: 매표소에서 그대로 쓸 수 있는 표현이에요.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: (탈것으로) 가다
    gloss: 'Jechać(탈것으로 가다): jadę(저는 가요), jedzie(그/그녀는 가요). 내일 저는 크라쿠프에 가요. Marek은 크라쿠프에 가요.'
    note: 지금은 두 가지 형태만 알면 돼요. 자기 자신에게는 *jadę*, 다른 사람에게는 *jedzie*를 써요.
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek은 크라쿠프에 가요
    gloss: Marek은 내일 크라쿠프에 가요.
    note: Marek의 여행이에요. 그의 이야기는 이번 단원의 대화로 이어져요.
  pl.a1.unit15.lesson02.teach.autobus:
    title: 버스
    gloss: 버스
    note: 도시 사이를 오가는 또 하나의 흔한 교통수단이에요.
    example_gloss: 버스는 역에 있어요.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: 바르샤바
    gloss: 바르샤바
    note: 폴란드의 수도예요. 이번 단원의 두 번째 목적지예요.
    example_gloss: 바르샤바는 멀어요.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: 바르샤바로
    gloss: 'Warszawa는 Kraków와 다르게 바뀌어요: do Warszawy (do Warszawa가 아니에요). 도시마다 자기만의 형태가 있으니 둘을 따로 외우세요.'
    note: '*Krakowa*와 *Warszawy*는 서로 같은 방식으로 바뀌지 않아요. 그래서 하나의 공통 규칙이 아니라 각각 따로 외워요.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: 어디로
    gloss: 어디로
    note: 이미 있는 위치가 아니라 목적지를 물어요. 어떤 것이 '어디에' 있는지 묻는 말과는 달라요.
    example_gloss: 버스는 어디로 가요?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: 다시 7시에
    gloss: Siódmej -- 시간 수업에서 배운 시각 형태예요 (o siódmej = 7시에).
    note: 같은 처격 시각 형태를 이번에는 출발 시간에 다시 써요.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: 바르샤바행 버스는 7시에 출발해요
    gloss: 바르샤바행 버스는 7시에 출발해요.
    note: 이번 수업의 목적지 표현과 시간 표현을 하나의 실제 문장으로 합쳤어요.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: 다시 언제
    gloss: Kiedy -- 날짜 수업에서 이미 배운 단어예요. 버스는 언제 출발해요?
    note: 여행 전에 자연스럽게 하는 질문이에요.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa는 바르샤바에 가요
    gloss: Ewa는 내일 바르샤바에 가요.
    note: Ewa의 여행이에요. 그녀의 이야기는 Marek의 이야기와 함께 이번 단원의 대화로 이어져요.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: 다시 '저'
    gloss: Ja -- 앞선 수업에서 이미 배운 단어예요.
    note: 이번 수업의 대화 전에 짧게 복습해요.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: 다시 '나의'
    gloss: Mój -- 가족 수업에서 이미 배운 단어예요.
    note: 이번 수업의 대화 전에 짧게 복습해요.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: 다시 오전 10시에
    gloss: Dziesiątej와 rano -- 두 형태 모두 시간 수업에서 이미 배웠어요 (o dziesiątej rano = 오전 10시에).
    note: 이번 수업의 대화 전에 짧게 복습해요.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: 감사 인사와 작별 인사
    gloss: Dziękuję와 Do zobaczenia -- 앞선 수업에서 이미 배운 표현이에요.
    note: 이번 수업의 대화 전에 짧게 복습해요.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: 즐거운 여행 되세요!
    gloss: Miłej podróży!는 누군가에게 즐거운 여행을 빌어 줄 때 하는 말이에요. 단어별로 풀지 않고 하나의 표현으로 써요.
    note: 관용적인 고정 작별 인사예요. *Dzień dobry*를 배웠던 것처럼 한 덩어리로 외우세요.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek은 내일 크라쿠프에 가요
    gloss: 내일 저는 크라쿠프에 가요. 제 기차는 오후 4시에 출발해요.
    note: Marek이 자신의 여행 계획을 먼저 말해요. 1과에서 그에 대해 이미 알려 준 내용과 같아요.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa는 내일 바르샤바에 가요
    gloss: 저는 바르샤바에 가요. 제 버스는 오전 10시에 출발해요.
    note: Ewa가 자신의 계획을 이야기해요. 2과에서 그녀에 대해 이미 알려 준 내용과 같아요.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek이 Ewa에게 즐거운 여행을 빌어 줘요
    gloss: 즐거운 여행 되세요!
    note: Marek이 이번 수업에서 배운 관용 표현으로 Ewa에게 좋은 여행을 빌어 줘요.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa가 Marek에게 감사하고 작별 인사를 해요
    gloss: 감사합니다! 또 만나요!
    note: 익숙하고 간단한 말로 대화를 마무리해요.
