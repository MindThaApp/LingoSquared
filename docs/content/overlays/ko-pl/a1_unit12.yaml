teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: 어제
    gloss: 어제
    note: 최근에 끝난 하루를 이야기할 때 쓰는 기본 시간 표현이에요. 이 단원에서 배우는 과거형과 자연스럽게 어울려요.
    example_gloss: 어제 영화관에 있었어요.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: 어제 무슨 일이 있었어요?
    gloss: 어제 무슨 일이 있었어요?
    note: 최근 일어난 일을 이야기해 달라고 할 때 쓰는 자연스러운 표현이에요. było는 대답하는 사람에 따라 바뀌지 않아서 누구에게 물어도 쓸 수 있어요.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było는 być(~이다, 있다)의 과거형 중 ''그것''에 해당하는 중성형이에요. co(무엇)와 호응하기 때문에 일반적으로 무슨 일이 있었는지 물을 때 써요: Co było wczoraj? 누가 대답하든 같은 단어예요.'
    note: '*Było*는 ''그것이 ~였다''에 해당하는 중성형이에요. 묻는 상대가 아니라 *co*(무엇)에 호응하기 때문에, *Co było wczoraj?*처럼 열린 질문에서는 ''무슨 일이 있었어요?''라는 뜻이 돼요.'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: 나는 있었다 (남성 / 여성)
    gloss: 나는 있었다 (남성이 말할 때) / 나는 있었다 (여성이 말할 때)
    note: 폴란드어 과거형은 말하는 사람의 성별을 나타내요. 남성이 말하면 byłem, 여성이 말하면 byłam이에요. 둘 다 뜻은 똑같이 '나는 ~에 있었다'예요.
    example_gloss:
    - 어제 영화관에 있었어요.
    - 어제 영화관에 있었어요.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: '과거형: -em과 -am'
    gloss: 과거형 동사는 말하는 사람의 성별에 따라 어미가 달라요. 남성이 말하면 -em(byłem), 여성이 말하면 -am(byłam)이에요. 이는 być뿐 아니라 모든 과거형 동사에 적용돼요.
    note: 끝 글자를 눈여겨보세요. *-em*은 남성이, *-am*은 여성이 말한다는 표시예요. 이 단원의 모든 과거형 동사에서 같은 패턴을 보게 될 거예요.
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: 영화관에서
    gloss: Kino는 w 뒤에서 어미가 바뀌어요. idę do kina(어디로?)는 jestem w kinie(어디에서?)와 다른 형태를 써요. W kinie는 처소격으로, 누군가가 어디로 가는지가 아니라 어디에서 일이 일어나는지를 나타내요.
    note: 어미가 두 가지이고 질문도 두 가지예요. *do kina*는 '어디로?'에 답하고(계획 단원에서 배웠어요), *w kinie*는 '어디에서?'에 답해요. 헷갈리지 마세요.
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: 어제 영화관에 있었어요 (남성)
    gloss: 어제 영화관에 있었어요.
    note: byłem, wczoraj, w kinie를 합친 문장이에요. 남성이 자신이 어디에 있었는지 말하는 방식이에요.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: 어제 영화관에 있었어요 (여성)
    gloss: 어제 영화관에 있었어요.
    note: 같은 문장에 byłam을 쓴 거예요. 여성이 자신이 어디에 있었는지 말하는 방식이에요.
  pl.a1.unit12.lesson02.teach.film:
    title: 영화
    gloss: 영화
    note: 무엇을 봤는지 이야기할 때 쓰는 일상적인 단어예요. 영화관에 다녀온 일을 이야기할 때 자주 나와요.
    example_gloss: 좋은 영화를 봤어요.
  pl.a1.unit12.lesson02.teach.dobry:
    title: 좋은
    gloss: 좋은
    note: dobry는 dzień dobry(안녕하세요) 안에서 이미 본 적이 있죠. 여기서는 단독으로 쓰이는 평범한 형용사 '좋은'이에요.
    example_gloss: 아주 좋은 영화예요!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: 나는 봤다 (남성 / 여성)
    gloss: 나는 봤다 (남성이 말할 때) / 나는 봤다 (여성이 말할 때)
    note: Zobaczyć는 한 번 끝난 '보는 행위'를 나타내요(계속 보는 widzieć와 달라요). 남성이 말하면 zobaczyłem, 여성이 말하면 zobaczyłam이고, byłem/byłam과 같은 -em/-am 패턴이에요.
    example_gloss:
    - 좋은 영화를 봤어요.
    - 좋은 영화를 봤어요.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: byłem/byłam과 같은 패턴
    gloss: byłem/byłam과 같은 패턴이에요. zobaczyłem은 남성이, zobaczyłam은 여성이 말해요. Zobaczyć는 완료상 동사로, 한 번 끝난 일을 나타내요.
    note: 어미는 같고 동사만 새로워요. *zobaczyłem/zobaczyłam*은 방금 배운 *byłem/byłam*과 똑같은 패턴을 따라요.
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: 나는 만들었다 / 했다 (남성 / 여성)
    gloss: 나는 만들었다 / 했다 (남성이 말할 때) / 나는 만들었다 / 했다 (여성이 말할 때)
    note: Zrobić는 한 번 끝난 행동에 대해 '만들다'와 '하다'를 모두 나타내요. 남성은 zrobiłem, 여성은 zrobiłam이고, 같은 패턴이에요.
    example_gloss:
    - 점심을 만들었어요.
    - 점심을 만들었어요.
  pl.a1.unit12.lesson02.teach.obiad:
    title: 점심
    gloss: 점심 / 낮 식사
    note: 일과 단원에서 obiad를 본 기억이 있을 거예요. 여기서는 Marek이 하루의 주된 식사로 만드는 음식이에요.
    example_gloss: 정말 맛있는 점심이에요.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: 맛있는
    gloss: 맛있는
    note: 음식을 칭찬할 때 쓰는 따뜻하고 일상적인 표현이에요. obiad 바로 뒤에 자연스럽게 나와요.
    example_gloss: 정말 맛있는 점심이에요.
  pl.a1.unit12.lesson03.teach.jaki:
    title: 어떤
    gloss: 어떤
    note: 전화번호와 요일을 물을 때 jaki를 이미 본 적이 있어요. 여기서도 같은 방식으로 구체적인 내용을 물어요. 어떤 영화일까요?
    example_gloss: 이 영화는 무슨 영화예요?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: 한 단어로 하는 짧은 질문
    gloss: 대화에서는 한 단어만으로 짧게 질문할 수 있어요. 예를 들어 전체 질문 Czy obiad był pyszny? 대신 Pyszny?라고 해요. 일상 대화처럼 자연스럽고 빠르게 들려요.
    note: 실제 대화에서는 문맥상 분명하면 완전한 문장을 생략해요. *Pyszny?*만으로도 "맛있었어요?"라는 뜻이에요.
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek이 무슨 일이 있었는지 물어요
    gloss: 안녕, Ewa! 어제 무슨 일 있었어?
    note: 이 단원에서 가장 처음 배운 질문을 다시 써서 이제 실제 대화를 시작해요.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa는 영화관에 있었어요
    gloss: 영화관에 있었어요! 좋은 영화를 봤어요.
    note: Byłam(여성형)과 zobaczyłam(여성형) 둘 다 말하는 사람이 Ewa, 즉 여성임을 보여 줘요.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek이 어떤 영화인지 물어요
    gloss: 무슨 영화?
    note: jaki를 사용한 짧고 자연스러운 되묻기 질문이에요.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa가 대답하고 되물어요
    gloss: 아주 좋은 영화야! 너는?
    note: A ty?(너는?)는 새로운 문법 없이 대화를 Marek에게 다시 넘겨요.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek이 점심을 만들었어요
    gloss: 점심을 만들었어!
    note: Zrobiłem(남성형)은 말하는 사람이 Marek임을 보여 줘요. 그날 그가 끝낸 일이에요.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa가 맛있었는지 물어요
    gloss: 맛있었어?
    note: 한 단어로 하는 질문이에요. 이번 단원 문법 설명에서 배운 바로 그 형태예요.
