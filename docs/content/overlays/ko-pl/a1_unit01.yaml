answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: 폴란드어 A1
  description: 폴란드어로 인사하고, 안부를 묻고, 자기소개를 하고, 기본적인 개인 정보를 주고받는 법을 배워요. 한국어의 존댓말과 반말처럼 폴란드어도 격식 차이를 구분하는데, 폴란드어는 이를 pan/pani/ty 체계로 나타내요. 이 과정에서는 이 격식 체계, 동사 어미의 일치, 상황에 맞는 말투 선택을 중점적으로 안내해요.
units:
  pl.a1.unit01.greetings:
    title: 인사와 첫 만남
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani, ty: 안부를 묻는 법'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: 하루 중 때에 따른 인사와 작별 인사
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: 이름, 성, 그리고 출신
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: 남성에 대한 격식 호칭
    gloss: ~님, 선생님 (남성에 대한 격식 호칭)
    note: 폴란드어는 상대와의 사회적 관계에 따라 호칭을 고르는데, *pan*은 잘 모르는 남성이나 직업상 존중해야 할 남성을 부를 때 써요. 문법적으로 *pan*은 3인칭 주어처럼 쓰여요. "pan jest"는 글자 그대로 "그 신사분이 ~이다"라는 뜻이고, 실제로는 "당신은 ~이다"의 의미로 쓰지만 진짜 2인칭 형태는 아니에요.
  pl.a1.unit01.lesson01.teach.pani:
    title: 여성에 대한 격식 호칭
    gloss: ~님, 선생님 (여성에 대한 격식 호칭)
    note: '*pan*의 여성형이에요. 잘 모르는 여성이나 직업상 존중해야 할 여성에게 *pani*를 써요. 결혼 여부와 상관없이 모든 성인 여성을 *pani*라고 불러요. 일상 호칭에서 미혼과 기혼을 나누지 않아요.'
  pl.a1.unit01.lesson01.teach.ty:
    title: 격식 없는 '너'
    gloss: 너 (친한 사이, 단수)
    note: '*Ty*는 친구, 또래, 가족, 아이처럼 편한 사이인 한 사람에게 써요. *pan*/*pani*와 달리 *ty*는 진짜 2인칭 동사 어미를 취해요. 예를 들어 3인칭 형태가 아니라 *masz*("너는 가지고 있다/~이다")를 써요.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: 남성에게 하는 격식 있는 안부 질문
    gloss: 안녕하세요? (남성에게, 격식)
    note: 글자 그대로는 "그 신사분은 어떻게 지내십니까"예요. *Ma*는 동사의 3인칭 형태로(*pan*이 문법상 주어라서 일치해요), *on*("그")에 쓰는 어미와 같아요.
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: 여성에게 하는 격식 있는 안부 질문
    gloss: 안녕하세요? (여성에게, 격식)
    note: '*Jak się pan ma?*와 같은 형태이고 *pan* 자리에 *pani*가 들어가요. 동사 형태 *ma*는 변하지 않아요. 상대의 성별과 상관없이 같은 3인칭 어미예요.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: 격식 없는 안부 질문
    gloss: 잘 지내? (친한 사이)
    note: '*ty*와 함께 쓰면 동사는 *ma*가 아니라 진짜 2인칭 어미 *masz*를 취해요. 격식 있는 *Jak się pan/pani ma?*와 친근한 *Jak się masz?*를 비교해 보세요. pan/pani와 ty의 차이를 동사에서 직접 들을 수 있는 가장 유용한 짝이에요.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: 기본적인 대답
    gloss: 잘 지내요, 고마워요.
    note: '*Dziękuję*("감사합니다")는 말투에 따라 달라지지 않아요. *pan*, *pani*, *ty* 누구에게 대답하든 같은 단어예요. 격식 차이는 질문에서만 드러나요.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: 격식 있는 질문 되묻기
    gloss: 당신은요? (남성에게, 격식)
    note: 격식을 차려 대하는 남성에게 질문을 되돌려 주는 짧은 표현이에요. 여성에게 되묻을 때는 *pan* 대신 *pani*("A pani?")를 써요.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: 격식 없는 질문 되묻기
    gloss: 너는?
    note: 친구나 또래에게 질문을 되돌려 줄 때는 *ty*를 써요.
  pl.a1.unit01.lesson02.teach.czesc:
    title: 친근한 인사와 작별 인사
    gloss: 안녕 (만날 때도 헤어질 때도, 친한 사이)
    note: '*Cześć*는 폴란드어 인사 중 독특하게, 친근한 말투에서 만날 때와 헤어질 때 모두 쓰여요. 한국어의 "안녕"이 둘 다 되는 것과 비슷해요. *ty*로 말하는 사이에서만 쓰고, *pan*/*pani*에게는 쓰지 않아요.'
    example_gloss: 안녕, 잘 지내?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: 하루 종일 쓰는 인사
    gloss: 안녕하세요 (아침, 낮 인사)
    note: '*Dzień dobry*는 저녁 전까지 언제든 쓸 수 있고, *cześć*와 달리 말투에 구애받지 않아요. *pan*, *pani*, *ty* 누구에게나 쓸 수 있어요. 잘 모르는 사람에게 하는 가장 안전한 기본 인사예요.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: 저녁 인사
    gloss: 좋은 저녁이에요
    note: 저녁이 되면 *dzień dobry* 대신 쓰는 인사예요. 말투에 구애받지 않는 점은 같아요.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: 밤 작별 인사
    gloss: 잘 자요
    note: '*dzień dobry*/*dobry wieczór*와 달리 *dobranoc*은 만날 때 하는 인사가 아니라 작별 인사예요. 밤에 헤어지거나 잠자리에 들 때 하는 말이고, 대화를 시작할 때는 쓰지 않아요.'
    example_gloss: 안녕히 주무세요, 피오트르!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: 기본 작별 인사
    gloss: 안녕히 가세요
    note: 말투에 구애받지 않는 무난한 작별 인사로, *pan*, *pani*, *ty* 누구에게나 쓸 수 있어요. *do zobaczenia*보다 더 마지막 인사처럼 들려요.
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: '"또 봐요" 작별 인사'
    gloss: 또 봐요
    note: 글자 그대로는 "(서로) 볼 때까지"예요. 다시 만나기를 기대한다는 뜻을 담고 있어서, 더 중립적인 *do widzenia*와 달라요.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: 공손한 마무리 인사
    gloss: 좋은 하루 보내세요!
    note: '*Miłego dnia*는 바람을 나타내는 표현에서 속격을 쓴 것으로, *smacznego*("맛있게 드세요")와 같은 형태예요. 지금 단계에서는 격을 하나하나 분석하기보다 통째로 외워 두는 고정 표현이에요.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: 격식 있게 이름 묻기
    gloss: 성함이 어떻게 되세요? (남성에게, 격식)
    note: 글자 그대로는 "그 신사분은 스스로를 어떻게 부릅니까"예요. *nazywać się*는 "~라고 불리다"라는 뜻의 재귀동사예요. 여성에게 격식을 차려 물을 때는 *pan* 대신 *pani*를 써요.
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: 친근하게 이름 묻기
    gloss: 이름이 뭐야?
    note: 다른 관용 표현인 *mieć na imię*("이름으로 ~를 가지다")를 쓰고, 성이나 전체 이름이 아니라 이름만 묻는 표현이에요. 또래에게 이름을 물을 때 쓰는 자연스러운 친근한 표현이에요.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: 성과 이름 전체 말하기
    gloss: 제 이름은 안나 코발스카예요.
    note: '*nazywać się*의 1인칭 형태로, 보통 이름과 성을 함께 말해요. 자기소개를 더 격식 있고 갖추어 하는 방식이에요.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: 이름만 말하기
    gloss: 제 이름은 안나예요.
    note: '*mieć na imię*의 1인칭 형태로, 보통 이름만 말해요. *Nazywam się...*의 편한 버전이에요.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: 만나서 반갑다는 인사
    gloss: 만나서 정말 반가워요.
    note: 처음 만났을 때 널리 쓰는 고정 표현으로, 격식 있는 자리에서도 편한 자리에서도 쓸 수 있어요.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: 친근하게 출신 묻기
    gloss: 어디에서 오셨어요?
    note: '*Skąd*는 "어디에서"라는 뜻이에요. 여기서는 *ty*를 쓰는 친근한 형태를 보여 주고, 격식 있는 *Skąd pan/pani jest?*는 이 단원의 마지막 대화에 나와요.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: 출신 말하기
    gloss: 저는 캐나다 출신이에요.
    note: '*Z*("~에서")는 속격을 취하기 때문에 *Kanada*가 *Kanady*로 바뀌어요. 대부분의 나라 이름이 *z* 뒤에서 이 같은 패턴을 따라요.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: 사는 곳 말하기
    gloss: 저는 바르샤바에 살아요.
    note: '*W*("~에")는 여기서 처격을 취하기 때문에 *Warszawa*가 *Warszawie*로 바뀌어요. 출신(*z*)과 현재 거주지(*w*)는 지명에 쓰는 격이 달라요. 예외로 외우기보다 하나의 패턴으로 알아 두세요.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: 만남의 시작
    gloss: 에바가 마레크에게 인사하고 격식을 갖춰 이름을 물어요.
    note: 에바는 방금 만난 사람에게 격식 있는 *pan*을 써요. 처음 만나는 업무상 자리나 낯선 사이에서 가장 안전한 기본 방식이에요.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: 만남의 시작, 대답
    gloss: 마레크가 자기 이름을 전부 말하고 만나서 반갑다고 해요.
    note: 격식 있는 이름 질문에는 *Nazywam się*와 성과 이름 전체로 대답하는 것이 자연스럽고 완전한 방식이에요.
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: 출신 묻기
    gloss: 에바도 반갑다고 답하고, 마레크의 출신을 격식 있게 물어요.
    note: '*Skąd pan jest?*는 이 단원의 *Skąd jesteś?*에 해당하는 격식 있는 표현이에요. *pan jest*/*pan ma*에서 이미 본 것처럼 3인칭 동사 *jest*를 써요.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: 출신 묻기, 대답
    gloss: 마레크는 캐나다 출신이지만 바르샤바에 산다고 말해요.
    note: '*Ale*("하지만")는 마레크의 원래 출신지와 현재 사는 곳의 대비를 이어 줘요. *jestem z*/*mieszkam w*가 보여 주는 구분과 같아요.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: 언어 실력 묻기
    gloss: 에바가 마레크에게 폴란드어를 할 줄 아는지 격식 있게 물어요.
    note: '*Czy*는 예/아니요 질문을 시작해요. 한국어는 "-까요?", "-요?" 같은 어미로 의문문을 만들지만, 폴란드어는 문장 앞에 *czy*를 두어 질문임을 알려요.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: 언어 실력 묻기, 대답, 마무리
    gloss: 마레크는 조금 할 줄 알고 아직 배우는 중이라고 말한 뒤 작별 인사를 해요.
    note: '*Jeszcze się uczę*("아직 배우는 중이에요")는 계속 노력하는 중이라는 것을 겸손하게 표현하는 자연스러운 말이에요. 실제 학습자인 여러분도 자신에 대해 말할 때 유용해요.'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: 남성을 격식 있게 존중하여 부르는 말은 어느 것일까요?
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: Pan은 남성을 격식 있게 부르는 말이고 3인칭 동사 형태를 취해요.
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: 여성을 격식 있게 존중하여 부르는 말은 어느 것일까요?
    correct_option: pani
    distractors:
    - 빵
    - ty
    accepted_answers:
    - pani
    feedback: Pani는 여성을 격식 있게 부르는 말이고 pan과 같은 3인칭 동사 형태를 취해요.
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: 친구나 또래 한 사람을 친근하게 부르는 말은 어느 것일까요?
    correct_option: ty
    distractors:
    - 빵
    - pani
    accepted_answers:
    - ty
    feedback: Ty는 친구, 또래 등 편한 관계에서 쓰고 진짜 2인칭 동사 어미를 취해요.
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: 남성에게 하는 격식 있는 안부 질문이 되도록 순서대로 배열하세요.
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: 친근한 안부 질문이 되도록 순서대로 배열하세요.
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: 격식을 유지하면서 질문을 되돌려 보세요.
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan?/A pani?는 질문을 되돌려 줄 때 격식을 유지하는 표현이에요.
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: 친구나 또래에게 질문을 되돌려 보세요.
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty?는 질문을 친근하게 되돌려 주는 표현이에요.
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 친근한 질문을 고쳐 보세요. ty에 맞지 않는 동사 어미가 섞여 있어요.
    accepted_answers:
    - Jak się masz?
    - Jak się masz
