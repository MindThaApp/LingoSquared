answer_policy:
  diacritics: 'Same standing policy as 1단원: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: 폴란드어 A1
units:
  pl.a1.unit02.numbers:
    title: 숫자
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0부터 10까지의 숫자
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: 11부터 100까지의 숫자와 가격
  pl.a1.unit02.lesson03.phone_and_age:
    title: 전화번호와 나이
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 영
    note: 이 단원에서 이어지는 모든 숫자의 출발점이에요.
    example_gloss: 오늘은 영하도 영상도 아닌 0도예요.
  pl.a1.unit02.lesson01.teach.jeden:
    title: 일
    gloss: 일
    note: '*Jeden* 뒤에는 이 단원의 다른 숫자와 달리 보통의 단수 명사가 와요.'
    example_gloss: 저는 전화기가 한 대 있어요.
  pl.a1.unit02.lesson01.teach.dwa:
    title: 이
    gloss: 이
    note: '*Dwa*, *trzy*, *cztery* 뒤에는 *psy*(개)처럼 특별한 복수 명사형이 와요. *pięć* 이상 뒤에 쓰는 복수형과는 달라요.'
    example_gloss: 저는 개가 두 마리 있어요.
  pl.a1.unit02.lesson01.teach.trzy:
    title: 삼
    gloss: 삼
    note: '*dwa*와 같은 복수 패턴이에요. *trzy złote*라고 하고 *trzy złotych*라고 하지 않아요.'
    example_gloss: 커피는 3 złoty예요.
  pl.a1.unit02.lesson01.teach.cztery:
    title: 사
    gloss: 사
    note: 이 복수 패턴을 공유하는 세 숫자(*dwa*, *trzy*, *cztery*) 중 마지막이에요.
    example_gloss: 저는 책이 네 권 있어요.
  pl.a1.unit02.lesson01.teach.piec:
    title: 오
    gloss: 오
    note: '*pięć*부터는 다른 복수 명사형(복수 속격, 예: *minuty*가 아니라 *minut*)을 써요. 이 단원 끝까지 이 패턴이 계속 나와요.'
    example_gloss: 저는 5분 있어요.
  pl.a1.unit02.lesson01.teach.szesc:
    title: 육
    gloss: 육
    note: '*pięć*와 같은 복수 속격 패턴이에요: *sześć jabłek*(사과 여섯 개).'
    example_gloss: 사과가 여섯 개 있어요.
  pl.a1.unit02.lesson01.teach.siedem:
    title: 칠
    gloss: 칠
    note: 요일을 말할 때 알아 두면 유용한 숫자예요.
    example_gloss: 일주일은 7일이에요.
  pl.a1.unit02.lesson01.teach.osiem:
    title: 팔
    gloss: 팔
    note: '*Mam osiem lat*는 직역하면 ''저는 여덟 해를 가지고 있어요''라는 뜻이에요. 한국어는 ''여덟 살이에요''처럼 ''이다''로 나이를 말하지만, 폴란드어는 ''가지다''라는 뜻의 *mieć*로 말해요. 이 패턴은 3과에서 자세히 연습해요.'
    example_gloss: 저는 여덟 살이에요.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: 구
    gloss: 구
    note: '여기서도 복수 속격이에요: *dziewięć osób*(아홉 명).'
    example_gloss: 아홉 명이 줄을 서서 기다리고 있어요.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: 십
    gloss: 십
    note: 한 자리 숫자 중 마지막이에요. 2과에서는 10대와 십 단위 숫자로 이어져요.
    example_gloss: 저는 손가락이 열 개 있어요.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: 십일
    gloss: 십일
    note: '11부터 19까지의 숫자는 *-naście*로 끝나요. *pięć* 이상의 숫자처럼 복수 속격을 써요: *jedenaście osób*.'
    example_gloss: 그 반에는 열한 명이 있어요.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: 십이
    gloss: 십이
    note: '*jedenaście*와 같은 *-naście* 패턴이에요.'
    example_gloss: 1년은 12개월이에요.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: 십오
    gloss: 십오
    note: '여기서도 *-naście* 패턴이에요: *piętnaście minut*(15분).'
    example_gloss: 저는 쉬는 시간이 15분 있어요.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: 이십
    gloss: 이십
    note: 20부터 40까지의 숫자는 *-dzieści*로 끝나요. *-naście*로 끝나는 10대와는 다른 패턴이에요. *Dwadzieścia* 자체는 복수 속격(*dwadzieścia lat*)을 쓰지만, 그 뒤에 일의 자리 숫자가 붙으면 어떻게 되는지는 3과에서 살펴보세요.
    example_gloss: 저는 스무 살이에요.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: 스물하나
    gloss: 스물하나
    note: 합성 숫자는 십의 자리 뒤에 일의 자리를 연결하는 말 없이 그대로 붙여서 만들어요. 한국어의 '이십일'과 같은 방식이에요.
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: 삼십
    gloss: 삼십
    note: '*dwadzieścia*와 같은 *-dzieści* 패턴이에요.'
    example_gloss: 표는 30 złoty예요.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: 오십
    gloss: 오십
    note: 50부터 90까지의 숫자는 *-dzieści*가 아니라 세 번째 패턴인 *-dziesiąt*로 끝나요.
    example_gloss: 저는 50 złoty가 있어요.
  pl.a1.unit02.lesson02.teach.sto:
    title: 백
    gloss: 백
    note: 합성 어미를 신경 쓸 필요가 없는 깔끔한 어림수예요.
    example_gloss: 그건 100 złoty예요.
  pl.a1.unit02.lesson02.teach.ile:
    title: 얼마 / 몇
    gloss: 얼마; 몇 개
    note: 수량이나 가격을 물을 때 쓰는 의문사예요.
    example_gloss: 이건 얼마예요?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: 가격 묻기
    gloss: 이건 얼마예요?
    note: '*Kosztować*(''값이 나가다'')가 동사이고, *to*(''이것/그것'')가 주어예요. 이 질문 전체가 아주 흔히 쓰는 고정 표현이에요.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: 가격 말하기
    gloss: 이건 20 złoty예요.
    note: '*Złotych*는 *złoty*(폴란드의 화폐)의 복수 속격이에요. *dwadzieścia* 자체가 이미 요구하는 복수 패턴과 같아요.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: 남자에게 전화번호 묻기
    gloss: 전화번호가 어떻게 되세요? (남자에게, 공손하게)
    note: 직역하면 '그 신사분의 전화번호는 무엇입니까'예요. *Pana*는 *pan*의 소유 형태(속격)로, '그 신사분의', 즉 '당신의'라는 뜻이에요.
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: 여자에게 전화번호 묻기
    gloss: 전화번호가 어떻게 되세요? (여자에게, 공손하게)
    note: 1단원의 패턴처럼 *pana* 대신 *pani*를 쓰면 여자에게 공손하게 말하는 표현이 돼요.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: 편한 사이에서 전화번호 묻기
    gloss: 전화번호가 뭐야? (편한 말투)
    note: 친구나 또래와 말할 때는 *pana*/*pani* 대신 *twój*('너의')를 써요.
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 번호 알려 주기, 시작하는 말
    gloss: 번호는...
    note: 숫자를 하나씩 읽기 전에 쓰는 짧고 자연스러운 시작 표현이에요. 폴란드 사람들이 전화번호를 소리 내어 말할 때 흔히 이렇게 해요.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: 전화번호 예시
    gloss: 육, 일, 오, 영, 이.
    note: 폴란드어에서는 한국어처럼 전화번호를 숫자 하나씩 읽어요. 여기 나온 숫자는 모두 이 단원에서 이미 배운 것이에요.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: 편한 사이에서 나이 묻기
    gloss: 몇 살이야?
    note: 직역하면 '몇 해를 가지고 있어?'라는 뜻이에요. 폴란드어는 '가지다'라는 뜻의 *mieć*로 나이를 말해요. 앞서 *osiem* 카드에서 미리 본 패턴이에요.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: 공손하게 나이 묻기
    gloss: 연세가 어떻게 되세요? (남자에게, 공손하게)
    note: '*Ma*는 1단원의 *pan jest*/*pan ma*에서 본 것과 같은 3인칭 동사형이에요. *pan*은 문법적으로 ''그 신사분''이라는 3인칭 주어로 취급돼요.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: 나이 말하기
    gloss: 저는 스물여덟 살이에요.
    note: '*Mam*은 *mieć*(''가지다'')의 1인칭 형태예요. *Dwadzieścia osiem*은 *osiem*(8)으로 끝나므로, 5~9로 끝나는 다른 숫자처럼 *lat*를 써요. 이어지는 대화에서 다르게 끝나는 숫자를 눈여겨보세요.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa가 Marek의 번호를 물어요
    gloss: Ewa가 Marek에게 공손하게 전화번호를 물어요.
    note: 이 단원에서 배운 공손한 전화번호 질문을 그대로 다시 써요.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek이 번호를 알려 줘요
    gloss: Marek이 전화번호를 숫자 하나씩 읽어 줘요.
    note: 여기 나온 숫자는 모두 이 단원 앞부분에서 이미 배웠어요.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa가 Marek의 나이를 물어요
    gloss: Ewa가 고맙다고 말하고 공손하게 나이를 물어요.
    note: '*Dziękuję*(''감사합니다'')와 *A*(''그리고, 그럼'')는 말투에 따라 달라지지 않아요. 1단원의 *dziękuję* 카드와 같아요.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek이 나이를 말하고 되물어요
    gloss: Marek이 스물여덟 살이라고 말하고, Ewa의 나이를 공손하게 되물어요.
    note: '*A pani?*는 여자에게 공손하게 되묻는 표현이에요. 1단원에서 배운 *A pan?*과 같은 짧은 패턴이에요.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa가 나이를 말해요
    gloss: Ewa가 서른두 살이라고 말해요.
    note: '*Trzydzieści dwa*는 *dwa*(2)로 끝나요. 그래서 osiem(8)으로 끝나 *lat*를 쓰는 *dwadzieścia osiem*과 달리 *lata*를 써요. 10대를 제외하고 2, 3, 4로 끝나는 숫자는 이 다른 복수형을 써요. *lat*와 *lata*는 서로 바꿔 쓸 수 없고, 어느 쪽이 맞는지는 숫자의 마지막 자리에 따라 달라지는 실제 문법 규칙이에요.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek이 대화를 마무리해요
    gloss: Marek이 이야기 나누어서 즐거웠다고 말하고 작별 인사를 해요.
    note: '*Do zobaczenia*는 1단원에서 배운 ''또 만나요'' 인사를 다시 쓴 거예요.'
exercises:
  pl.a1.unit02.lesson01.exercise01.select_dwa:
    instruction: 숫자 2를 뜻하는 단어는 무엇일까요?
    correct_option: dwa
    distractors:
    - jeden
    - trzy
    accepted_answers:
    - dwa
  pl.a1.unit02.lesson01.exercise02.select_siedem:
    instruction: 숫자 7을 뜻하는 단어는 무엇일까요?
    correct_option: siedem
    distractors:
    - sześć
    - osiem
    accepted_answers:
    - siedem
  pl.a1.unit02.lesson01.exercise03.select_dziesiec:
    instruction: 숫자 10을 뜻하는 단어는 무엇일까요?
    correct_option: dziesięć
    distractors:
    - dziewięć
    - jeden
    accepted_answers:
    - dziesięć
  pl.a1.unit02.lesson01.exercise04.match_digits_zero_to_ten:
    instruction: 폴란드어 숫자 단어와 알맞은 숫자를 짝지어 보세요.
    correct_response:
      zero: '0'
      jeden: '1'
      dwa: '2'
      trzy: '3'
      cztery: '4'
      pięć: '5'
      sześć: '6'
      siedem: '7'
      osiem: '8'
      dziewięć: '9'
      dziesięć: '10'
    pairs:
    - left: zero
      right: '0'
    - left: jeden
      right: '1'
    - left: dwa
      right: '2'
    - left: trzy
      right: '3'
    - left: cztery
      right: '4'
    - left: pięć
      right: '5'
    - left: sześć
      right: '6'
    - left: siedem
      right: '7'
    - left: osiem
      right: '8'
    - left: dziewięć
      right: '9'
    - left: dziesięć
      right: '10'
  pl.a1.unit02.lesson01.exercise05.order_count_to_three:
    instruction: '숫자를 순서대로 놓아 보세요: 하나, 둘, 셋.'
    correct_response:
    - jeden
    - dwa
    - trzy
  pl.a1.unit02.lesson01.exercise06.order_count_four_to_six:
    instruction: '숫자를 순서대로 놓아 보세요: 넷, 다섯, 여섯.'
    correct_response:
    - cztery
    - pięć
    - sześć
  pl.a1.unit02.lesson01.exercise07.order_count_eight_to_ten:
    instruction: 여덟, 아홉, 열을 순서대로 배열하세요.
    correct_response:
    - osiem
    - dziewięć
    - dziesięć
  pl.a1.unit02.lesson01.exercise08.fill_week_days:
    instruction: 일주일의 날 수에 대해 맞는 문장이 되도록 완성하세요.
    accepted_answers:
    - siedem
    feedback: Siedem -- 일주일은 7일이에요.
  pl.a1.unit02.lesson01.exercise09.speak_count_to_ten:
    instruction: 0부터 10까지 폴란드어로 소리 내어 세어 보세요.
    accepted_answers:
    - Zero, jeden, dwa, trzy, cztery, pięć, sześć, siedem, osiem, dziewięć, dziesięć.
    - zero jeden dwa trzy cztery pięć sześć siedem osiem dziewięć dziesięć
  pl.a1.unit02.lesson02.exercise01.select_dwadziescia:
    instruction: 숫자 20을 뜻하는 단어는 무엇일까요?
    correct_option: dwadzieścia
    distractors:
    - dwanaście
    - trzydzieści
    accepted_answers:
    - dwadzieścia
  pl.a1.unit02.lesson02.exercise02.select_sto:
    instruction: 숫자 100을 뜻하는 단어는 무엇일까요?
    correct_option: sto
    distractors:
    - dziesięć
    - pięćdziesiąt
    accepted_answers:
    - sto
  pl.a1.unit02.lesson02.exercise03.match_teens_and_tens:
    instruction: 폴란드어 숫자 단어와 알맞은 숫자를 짝지어 보세요.
    correct_response:
      jedenaście: '11'
      dwanaście: '12'
      piętnaście: '15'
      dwadzieścia: '20'
      trzydzieści: '30'
      pięćdziesiąt: '50'
      sto: '100'
    pairs:
    - left: jedenaście
      right: '11'
    - left: dwanaście
      right: '12'
    - left: piętnaście
      right: '15'
    - left: dwadzieścia
      right: '20'
    - left: trzydzieści
      right: '30'
    - left: pięćdziesiąt
      right: '50'
    - left: sto
      right: '100'
  pl.a1.unit02.lesson02.exercise04.order_twenty_one:
    instruction: 숫자 21을 만들어 보세요.
    correct_response:
    - dwadzieścia
    - jeden
  pl.a1.unit02.lesson02.exercise05.order_cost_question:
    instruction: 가격을 묻는 질문을 순서대로 배열하세요.
    correct_response:
    - Ile
