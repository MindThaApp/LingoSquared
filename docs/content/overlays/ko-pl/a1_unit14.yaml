teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: 젊은
    gloss: 젊은
    note: 기본적인 형용사예요. 이 단원에서 배울 비교형의 출발점이에요.
    example_gloss: Marek은 젊어요.
  pl.a1.unit14.lesson01.teach.stary:
    title: 나이 든
    gloss: 나이가 많은
    note: młody의 반대말이에요. 이 단원에서 비교형으로 바꿔 볼 또 다른 형용사예요.
    example_gloss: 할아버지는 연세가 많으세요.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: '비교하기: -szy 붙이기'
    gloss: stary, młody처럼 짧은 형용사는 끝의 -y를 -szy로 바꿔요. stary는 starszy, młody는 młodszy가 돼요. 모든 형용사가 이렇게 바뀌는 것은 아니에요.
    note: 이 두 단어에는 간단한 규칙이 있어요. 끝의 *-y*를 빼고 *-szy*를 붙이면 비교형이 돼요. 다른 많은 형용사는 다른 어미를 쓰니까 모든 단어에 적용하지는 마세요.
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: 더 나이 많은
    gloss: 더 나이 많은
    note: Starszy는 남자(on)에게, starsza는 여자(ona)에게 써요. stary의 비교형이에요.
    example_gloss:
    - 할아버지는 아버지보다 나이가 많아요.
    - 할머니는 어머니보다 나이가 많아요.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: 더 어린
    gloss: 더 어린
    note: Młodszy는 남자에게, młodsza는 여자에게 써요. młody의 비교형이에요.
    example_gloss:
    - 아버지는 할아버지보다 젊어요.
    - 어머니는 할머니보다 젊어요.
  pl.a1.unit14.lesson01.teach.niz:
    title: ~보다
    gloss: ~보다
    note: Niż는 비교하는 두 대상을 이어 줘요. niż 뒤에 오는 단어는 기본 형태 그대로 써요.
    example_gloss: 아들은 아버지보다 어려요.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: 비교형은 성에 따라 달라져요
    gloss: Starszy/starsza와 młodszy/młodsza는 byłem/byłam처럼 성에 따라 형태가 바뀌어요. 남자(on)에게는 starszy, młodszy를, 여자(ona)에게는 starsza, młodsza를 써요.
    note: '*byłem*/*byłam*과 같은 방식이에요. 남자 이야기인지 여자 이야기인지에 따라 어미가 달라져요.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa는 Marek보다 나이가 많아요
    gloss: Ewa는 Marek보다 나이가 많아요.
    note: 두 등장인물에 관한 실제 사실이에요. Ewa는 32살, Marek은 28살이에요.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek은 Ewa보다 어려요
    gloss: Marek은 Ewa보다 어려요.
    note: 같은 사실을 반대로 말한 거예요.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: 다시 만난 '좋은'
    gloss: Dobry(좋은)는 Dzień dobry에서 이미 만난 단어예요.
    note: 첫 단원부터 봐 온 바로 그 형용사예요. 이제 비교형을 만드는 데 쓰여요.
  pl.a1.unit14.lesson02.teach.zly:
    title: 나쁜
    gloss: 나쁜
    note: dobry의 반대말이에요. 이번 단원에서 처음 나오는 새 단어예요.
    example_gloss: 오늘은 안 좋은 날이에요.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry와 zły는 불규칙이에요
    gloss: Dobry와 zły는 불규칙이에요. dobry는 lepszy, zły는 gorszy가 돼요. -szy를 붙이지 않아요.
    note: '*stary*/*młody*와 달리 이 두 단어는 규칙적인 *-szy* 형태를 따르지 않아요. 비교형을 따로 외워야 해요.'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: 더 나은
    gloss: 더 나은, 더 좋게
    note: Lepszy는 남자에게, lepsza는 여자나 kawa 같은 여성 명사에 써요. dobry의 불규칙 비교형이에요.
    example_gloss:
    - 그는 저보다 나아요.
    - 커피가 차보다 더 좋아요.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: 더 나쁜
    gloss: 더 나쁜
    note: Gorszy/gorsza는 zły의 불규칙 비교형이에요.
    example_gloss:
    - 그는 저보다 못해요.
    - 차가 커피보다 못해요.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: 다시 만난 커피와 차
    gloss: Kawa와 herbata는 음료에 관한 앞 수업에서 이미 배운 단어예요.
    note: 이 단어들로 비교해 보기 전에 간단히 되짚어 봐요.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: 앞에서 본 것과 같은 규칙
    gloss: Lepszy/lepsza와 gorszy/gorsza도 지난 수업의 starszy/starsza처럼 성에 따라 형태가 바뀌어요.
    note: 방금 배운 남성형과 여성형의 구분을 새로운 단어 쌍에 그대로 적용해요.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: 나, 저는 ~이에요, 너
    gloss: Ja, jestem, ty는 앞 수업에서 이미 배운 단어예요.
    note: 이번 수업의 대화를 보기 전에 간단히 되짚어 봐요.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: 네, 아니요, 좋아요
    gloss: Tak, nie, dobrze도 이미 아는 단어예요.
    note: 대화를 보기 전에 한 번 더 간단히 되짚어 봐요.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: 다시 만난 '하지만'
    gloss: Ale(하지만)는 앞 수업에서 이미 배운 단어예요. 서로 대조되는 두 문장을 이어 줘요.
    note: 대조를 나타내는 짧은 접속사예요. 한국어의 '하지만'과 비슷하게 쓰여요.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek은 차가 더 좋다고 말해요
    gloss: 차가 커피보다 더 좋아요!
    note: Marek은 취향 수업에서 이미 말한 대로 자기 의견으로 말을 시작해요.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa는 반대해요
    gloss: 아니, 아니야! 커피가 차보다 더 좋아!
    note: Ewa도 앞서 말한 것과 같이 자기 의견으로 맞서요.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek은 나이 이야기로 화제를 바꿔요
    gloss: 알았어, 알았어. 그래도 나는 너보다 어려!
    note: Marek은 음료 논쟁을 포기하고 자신 있는 다른 이야기를 꺼내요.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa는 인정하면서도 자기 의견을 다시 말해요
    gloss: 맞아, 내가 나이가 더 많지. 그래도 커피가 더 좋아!
    note: Ewa는 나이에 관한 사실을 인정한 다음, 커피에 대한 자기 의견으로 돌아가요.
