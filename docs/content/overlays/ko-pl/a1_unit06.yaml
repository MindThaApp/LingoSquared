teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: 빵
    gloss: 빵
    note: 기본 주식을 가리키는 말로, 어떤 식사에서든 늘 나와요.
    example_gloss: 이것은 빵이에요.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: 버터, 치즈
    gloss: 버터; 치즈
    note: 앞의 것은 중성 명사, 뒤의 것은 비활성 남성 명사예요. 둘 다 이 과의 문법 노트에서 설명하듯 proszę o 뒤에서 어미가 바뀌지 않아요.
    example_gloss:
    - 이것은 버터예요.
    - 이것은 치즈예요.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: 물, 우유
    gloss: 물; 우유
    note: Woda는 여성 명사예요(대격 형태 wodę는 이 과의 문법 노트에 나와요). mleko는 중성 명사이고 절대 변하지 않아요.
    example_gloss:
    - 이것은 물이에요.
    - 이것은 우유예요.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: 커피, 차
    gloss: 커피; 차
    note: 둘 다 여성 명사예요. 주문할 때 실제로 말하는 것은 대격 형태인 kawę/herbatę이고, 이 과의 문법 노트에서 다뤄요.
    example_gloss:
    - 이것은 커피예요.
    - 이것은 차예요.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: '주문하기: proszę o + 대격'
    gloss: '~을 부탁해요 + 대격: 커피 -> kawę, 차 -> herbatę, 물 -> wodę. 빵, 치즈, 우유는 바뀌지 않아요.'
    note: '*Proszę o*(''~ 주세요'', 문자 그대로는 ''~을 부탁해요'') 뒤에는 대격이 와요. *kawa*, *herbata*, *woda* 같은 여성 명사는 끝의 *-a*가 *-ę*로 바뀌어요. *chleb*, *ser* 같은 비활성 남성 명사와 *mleko* 같은 중성 명사는 사전에 실린 형태 그대로 써요.'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: 커피 주세요
    gloss: 커피 주세요.
    note: 한 가지를 주문할 때 일상적으로 쓰는 공손한 표현이에요. 문법 노트의 패턴을 완전한 요청에 적용한 거예요.
  pl.a1.unit06.lesson02.teach.zupa:
    title: 수프
    gloss: 수프
    note: 점심이나 저녁에 흔히 먹는 음식이고, 이 단원의 식당 장면처럼 오늘의 요리인 경우도 많아요.
    example_gloss: 이것은 수프예요.
  pl.a1.unit06.lesson02.teach.sok:
    title: 주스
    gloss: 주스
    note: chleb, ser처럼 비활성 남성 명사예요. 주문할 때 어미가 바뀌지 않아요.
    example_gloss: 이것은 주스예요.
  pl.a1.unit06.lesson02.teach.cukier:
    title: 설탕
    gloss: 설탕
    note: 커피나 차에 쓰는 말이에요. 이것도 비활성 남성 명사라서 어미가 바뀌지 않아요.
    example_gloss: 이것은 설탕이에요.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: 계산서
    gloss: 계산서
    note: 식사가 끝날 때 부탁하는 말이에요. proszę o rachunek은 계산서를 공손하게 요청하는 표준 표현이에요.
    example_gloss: 계산서 부탁드려요.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: '좋아하다: lubię, lubi'
    gloss: '좋아하다: 나는 좋아해요, 그/그녀는 좋아해요 -- 저는 커피를 좋아해요. 그는 수프를 좋아해요.'
    note: '*Lubić*는 ''좋아하다''라는 동사예요. 여기서는 1인칭(*lubię*)과 3인칭(*lubi*) 형태만 배워요. *Lubić*도 *proszę o*와 같은 대격을 취해요 -- *lubię kawę*라고 하고 *lubię kawa*라고 하지 않아요.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: 저는 수프를 좋아해요
    gloss: 저는 수프를 좋아해요.
    note: Zupa는 대격에서 zupę가 돼요. 1과 문법 노트에서 본 여성 명사의 -a → -ę 변화와 같아요.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: 오늘의 요리
    gloss: 오늘의 요리는 수프예요.
    note: '*Dnia*는 *dzień*(날)의 생격이에요. *danie dnia*는 문자 그대로 ''그날의 요리''이고, 메뉴에서 쓰는 고정된 표현이에요.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: '추천하다: polecam, poleca'
    gloss: '추천하다: 저는 추천해요, 그/그녀는 추천해요 -- 저는 커피를 추천해요. 그는 수프를 추천해요.'
    note: '*Polecać*는 ''추천하다''라는 동사예요. 웨이터는 요리를 권할 때 쓰고, 손님은 같은 동사로 추천을 부탁해요. 이 동사도 *proszę o*, *lubić*와 같은 대격 패턴을 취해요.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: 뭘 추천하세요?
    gloss: 뭘 추천하세요?
    note: '*Co*(무엇)에 존칭 *pan*을 붙인 말이에요. 웨이터에게 묻는 자연스러운 질문이고, 1단원에서 배운 존칭 호칭을 그대로 써요.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: 여기 있습니다 / 천만에요
    gloss: 여기 있습니다.
    note: 일상에서 폭넓게 쓰는 표현이에요. 무언가를 내줄 때 말하고, dziękuję(감사합니다)에 대한 대답으로도 자연스러워요.
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: 바로 갖다 드릴게요
    gloss: 바로 갖다 드릴게요.
    note: 문자 그대로는 '이미 내가 내오고 있어요'라는 뜻이에요. 주문을 알아들었다고 확인해 주는 웨이터의 표준 대답이에요.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: 웨이터가 오늘의 요리를 알려 줘요
    gloss: 웨이터가 인사하고 오늘의 요리가 수프라고 알려 줘요.
    note: Dzień dobry는 1단원의 인사말에서 다시 쓴 표현이에요.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa가 추천을 부탁해요
    gloss: Ewa가 웨이터에게 무엇을 추천하는지 물어요.
    note: 공손하고 격식 있는 질문이에요. pan으로 웨이터를 정중하게 불러요.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: 웨이터가 커피를 추천해요
    gloss: 웨이터가 커피를 추천해요.
    note: Polecam은 이 과의 문법 노트에서 배운 1인칭 형태예요.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa가 주문해요
    gloss: Ewa가 좋다고 말하고 커피와 수프를 주문해요.
    note: proszę o에 가족 단원에서 배운 연결어 i(그리고)를 합친 문장이에요. 1과의 주문 패턴과 2과의 수프 어휘를 함께 다시 써요.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: 웨이터가 확인해 줘요
    gloss: 웨이터가 바로 갖다 주겠다고 말해요.
    note: 음식이 나오기 전에 하는 짧고 자연스러운 확인의 말이에요.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa가 계산서를 부탁해요
    gloss: Ewa가 감사 인사를 하고 계산서를 부탁해요.
    note: 1단원의 dziękuję와 2과의 proszę o + rachunek을 다시 써요.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: 웨이터가 계산서를 건네요
    gloss: 웨이터가 '여기 있습니다'라고 말해요.
    note: 이 과 앞에서 배운 proszę bardzo가 이번에는 계산서를 건넬 때도 쓰여요.
