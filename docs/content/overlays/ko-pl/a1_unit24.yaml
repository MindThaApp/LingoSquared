teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '흔한 취미 동사 세 가지: *czytać*(읽다), *uprawiać sport*(운동하다), *gotować*(요리하다).'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: 여가 시간
    gloss: 시간
    note: '*Wolny czas*는 취미를 이야기할 때 꼭 필요한 표현이에요. 형용사 *wolny*(자유로운)는 남성 명사 *czas*와 성을 맞추고, *w wolnym czasie*에서는 둘 다 전치격이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Lubię*(나는 좋아해요) 뒤에는 동사원형이 와요: *lubię czytać*. *W wolnym czasie*는 *w* + 전치격을 써요.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 세 가지를 더 배워요: *słuchać muzyki*(음악을 듣다), *rysować*(그림을 그리다), *grać w gry*(게임을 하다).'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Słuchać*는 항상 생격을 써요: *muzyka*가 아니라 *słucham muzyki*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Z przyjaciółmi*(친구들과)는 *z* + 복수 조격을 써요.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '기본 빈도 부사 네 가지: *zawsze*, *często*, *czasami*, *nigdy*. 형태가 변하지 않으며, *nigdy*는 동사 앞에 *nie*가 필요해요: *Nigdy nie gram.*'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Co tydzień*과 *co weekend*는 둘 다 ''매 ~''라는 뜻이에요. *co* 뒤에는 대격이 오고 co는 변하지 않아요. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + 대격
    gloss: '*Co* + 대격은 ''매 ~''라는 뜻이에요: 매주, 매 주말, 매달.'
    note: '*Co*는 어떤 명사가 와도 ''매 ~''를 뜻하는 고정된 한 단어예요. *tydzień*, *weekend*, *miesiąc* 같은 무생물 남성 명사는 주격과 대격의 형태가 같아요.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa가 취미 이야기를 꺼내요
    gloss: 'Ewa: 우리는 자주 함께 산책하죠. 그런데 Marek, 여가 시간에 또 뭘 해요?'
    note: '*Spacerujemy*는 *spacerować*의 *my*(우리) 형태이고, *Marku*는 누군가를 직접 부를 때 쓰는 호격이에요.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Marek의 취미
    gloss: 'Marek: 저는 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Także w domu*(집에서도)는 Marek이 식당 일 때문만이 아니라 즐거움으로도 요리한다는 것을 보여 줘요. *w domu*는 전치격이에요.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa가 놀라요
    gloss: 'Ewa: 집에서도 요리해요? 직장에서 하루 종일 요리하잖아요!'
    note: '*Cały dzień*(하루 종일)은 Marek이 직장에서 이미 요리를 많이 한다는 것을 강조하고, *przecież*는 ''그래도 그렇지, 설마''라는 뜻을 더해요.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek이 설명해요
    gloss: 'Marek: 네, 하지만 요리하면 마음이 편안해져요. 당신은요, 뭘 하는 걸 좋아해요?'
    note: '*Gotowanie mnie odpręża*는 직역하면 ''요리가 나를 편안하게 해 준다''예요. 폴란드어는 활동을 주어로 삼고 *mnie*(나를)를 대격으로 쓰는 경우가 많아요.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Ewa의 취미
    gloss: 'Ewa: 저는 책 읽는 걸 좋아하고 음악을 자주 들어요.'
    note: 1과와 2과의 취미 동사 두 개를 *i*(그리고)로 한 문장에 묶었어요.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek이 게임에 대해 물어봐요
    gloss: 'Marek: 너도 게임해?'
    note: 2과의 *grać w gry*를 쓴 짧은 예/아니요 질문이에요. *też*는 '~도'라는 뜻이에요.
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa가 대답해요
    gloss: 'Ewa: 아니, 나는 게임은 전혀 안 해. 하지만 가끔 그림은 그려!'
    note: 3과에서 배운 *nigdy*(전혀 ~ 않다)와 *czasami*(가끔)를 한 대답에서 대비해 썼어요. 이중 부정 *nigdy nie gram*에 주의하세요.
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: 취미 비교하기
    gloss: Marek과 나는 자주 함께 산책해요. 하지만 다른 취미도 있어요. Marek은 요리하는 것을 좋아하고, 집에서도 요리하며, 운동도 자주 해요. 저는 책 읽는 것을 좋아하고 음악을 자주 들어요. 가끔 그림을 그리지만 게임은 전혀 하지 않아요. 여러분은 여가 시간에 무엇을 하는 것을 좋아하세요?
    note: Ewa의 메시지는 4과의 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      spacerujemy: 산책하다
      często: 자주
      razem: 함께
      inne: 다른
      gotować: 요리하다
      lubi: 즐겨
      domu: 집에서
      uprawia: 운동하다
      czytać: 읽다
      słucham: 듣다
      muzyki: 음악
      rysuję: 그리다
      czasami: 가끔
      gram: 게임하다
      nigdy: 전혀 하지 않다
      wolnym: 자유로운
      czasie: 시간
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek이 주말 계획을 물어봐요
    gloss: 'Marek: 이번 주말에 뭐 해?'
    note: '*W ten weekend*(이번 주말)는 시간 표현으로 *w* + 대격을 써요.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa는 아직 정하지 못했어요
    gloss: 'Ewa: 아직 모르겠어. 책 읽는 것도 좋지만, 밖에도 나가고 싶어.'
    note: '*Wyjść na dwór*(밖에 나가다)는 집을 나서고 싶다고 말할 때 흔히 쓰는 표현이에요. *chcę* + 부정사는 ''~하고 싶다''라는 뜻이에요.'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek이 계획을 제안해요
    gloss: 'Marek: 같이 산책하러 갈까? 그다음에 우리를 위해 뭔가 요리할게.'
    note: '*Potem*(그다음에)은 순서를 나타내는 말이에요. *ugotuję*는 요리가 끝나는 결과를 나타내므로 완료상이에요.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa가 동의해요
    gloss: 'Ewa: 좋은 생각이야! 나는 산책도 요리도 다 좋아해.'
    note: '*Lubię i ..., i ...*(''~도 ~도 다'')는 Ewa가 두 가지를 똑같이 좋아한다는 뜻이에요. 어느 한쪽을 더 좋아하는 것이 아니에요.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek이 약속을 확정해요
    gloss: 'Marek: 좋아. 그럼 토요일에 보자!'
    note: 토요일 계획을 확인하는 다정한 마무리 인사예요. *w sobotę*는 요일을 나타내는 *w* + 대격이에요.
