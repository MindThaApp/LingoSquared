    title: 동사 두 개, 격 두 개
    gloss: '*Sprawdzam*은 대격을 취해요: *prognozę pogody*. *Używam*은 속격을 취해요: *telefonu*.'
    note: 대부분의 동사는 대격을 취하지만, *używać*는 예외로 속격이 필요해요.
