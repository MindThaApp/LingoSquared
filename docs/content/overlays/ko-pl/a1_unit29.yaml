  description: 기술에 관해 이야기하는 폴란드어 초급 과정이에요. 휴대폰, 컴퓨터, 인터넷의 이름을 익히고, 앱으로 메시지를 보내고 읽고, 온라인으로 정보를 찾아보고, 이를 모두 활용해 친구들과 실제 약속을 잡아 봅니다.
