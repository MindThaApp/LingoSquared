    - czerwiec
    accepted_answers:
    - maj
  pl.a1.unit03.lesson02.exercise02.select_pazdziernik:
    instruction: 10월을 뜻하는 단어는 무엇일까요?
    correct_option: październik
    distractors:
    - listopad
    - wrzesień
    accepted_answers:
    - październik
