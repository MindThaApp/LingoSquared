    correct_option: piątek
    distractors:
    - środa
    - sobota
    accepted_answers:
    - piątek
  pl.a1.unit03.lesson01.exercise03.select_niedziela:
    instruction: 일요일을 뜻하는 단어는 무엇일까요?
    correct_option: niedziela
    distractors:
    - sobota
    - czwartek
