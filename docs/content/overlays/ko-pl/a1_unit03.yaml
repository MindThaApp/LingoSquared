  notes: 'Derived from en-pl by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Same standing policy as 1단원/unit02: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani/ci vs formal-only) rather than written punctuation or diacritics.
course:
  title: 폴란드어 A1
units:
  pl.a1.unit03.dates:
    title: 요일과 날짜
lessons:
  pl.a1.unit03.lesson01.dni_tygodnia:
    title: 요일
  pl.a1.unit03.lesson02.miesiace_i_daty:
    title: 달과 날짜
  pl.a1.unit03.lesson03.umawiamy_sie:
    title: 만날 약속 잡기
teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: 월요일
    gloss: 월요일
    note: 폴란드에서는 한 주가 월요일부터 시작하기 때문에, 월요일이 한 주의 첫날이에요.
    example_gloss: 오늘은 월요일이에요.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: 화요일
    gloss: 화요일
    note: 이 단어는 주의하세요 -- '화요일에'라고 할 때 *wtorek* 앞에는 *w*가 아니라 *we*가 와요. 이 레슨 뒤에서 더 자세히 다뤄요.
    example_gloss: 오늘은 화요일이에요.
  pl.a1.unit03.lesson01.teach.sroda:
    title: 수요일
    gloss: 수요일
    note: 다른 대부분의 요일과 달리 여성 명사예요.
    example_gloss: 오늘은 수요일이에요.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: 목요일
    gloss: 목요일
    note: '*poniedziałek*, *wtorek*, *piątek*과 같은 남성 명사 유형이에요.'
    example_gloss: 오늘은 목요일이에요.
  pl.a1.unit03.lesson01.teach.piatek:
    title: 금요일
    gloss: 금요일
    note: 이 요일은 이 단원 뒤에서 다시 나와요 -- 에바와 마레크가 다시 만나기로 한 날이에요.
    example_gloss: 오늘은 금요일이에요.
  pl.a1.unit03.lesson01.teach.sobota:
    title: 토요일
    gloss: 토요일
    note: 주말에 속하는 날이에요. 폴란드어에서는 외래어 *weekend*도 많이 써요.
    example_gloss: 오늘은 토요일이에요.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: 일요일
    gloss: 일요일
    note: 이 레슨에서 배우는 일주일 7일 중 마지막 날이에요.
    example_gloss: 오늘은 일요일이에요.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: 요일 묻기
    gloss: 오늘은 무슨 요일이에요?
    note: 직접 묻는 질문 형태예요 -- *dzień tygodnia*는 문자 그대로 '주의 날', 즉 요일이라는 뜻이에요.
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: w/we 예외
    gloss: 월요일에, 목요일에, 금요일에 -- 하지만 화요일에는 (발음하기 쉽게).
    note: 대부분의 요일은 '*w* + [요일]'로 '[요일]에'를 나타내요. *Wtorek*만 유일한 진짜 예외로, 폴란드 사람들은 *w wtorek*가 아니라 *we wtorek*라고 해요. 단지 발음하기 더 쉽기 때문이며, 오타가 아니라 실제 불규칙이에요.
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: 금요일에 영화관에 가요
    gloss: 금요일에 영화관에 가요.
    note: '*Piątek*은 *w* 뒤에서 형태가 변하지 않아요 -- *środa*, *sobota*, *niedziela*만 변하는데, A1에서는 간단히 하려고 이 레슨에서 다루지 않아요.'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: 1월, 2월, 3월
    gloss: 1월; 2월; 3월
    note: '*Luty*는 문법적으로 특이해요 -- 일반 명사가 아니라 형용사처럼 변해요(''2월에'' 형태는 이 단원 뒤에서 나와요).'
    example_gloss:
    - 제 생일은 1월이에요.
    - 저는 2월에 바르샤바에 가요.
    - 제 생일은 3월이에요.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: 4월, 5월, 6월
    gloss: 4월; 5월; 6월
    note: '*Maj*는 이 단원 이야기에서 두 날짜 모두에 쓰이는 달이에요.'
    example_gloss:
    - 저는 4월에 바르샤바에 가요.
    - 제 생일은 5월이에요.
    - 저는 6월에 바르샤바에 가요.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: 7월, 8월, 9월
    gloss: 7월; 8월; 9월
    note: '여기에도 진짜 불규칙이 있어요: ''9월에''는 *w wrześniu*가 아니라 *we wrześniu*예요 -- *wtorek*에서 이미 본 것처럼 발음하기 쉽게 *we*로 바꾸는 거예요.'
    example_gloss:
    - 저는 7월에 휴가예요.
    - 저는 8월에 바르샤바에 가요.
    - 제 생일은 9월이에요.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: 10월, 11월, 12월
    gloss: 10월; 11월; 12월
    note: 한 해의 마지막 세 달로, 열두 달이 모두 갖춰져요.
    example_gloss:
    - 저는 10월에 바르샤바에 가요.
    - 제 생일은 11월이에요.
    - 저는 12월에 휴가예요.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: 생일
    gloss: 생일
    note: '*Urodziny*는 한 사람의 생일 하루를 말할 때도 폴란드어에서는 항상 복수예요 -- 그래서 단수형 *jest*가 아니라 항상 복수형 *są*와 함께 써요. 이 레슨 뒤의 연습에서 바로 이 점을 연습해요.'
    example_gloss: 제 생일은 5월이에요.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: 언제
    gloss: 언제
    note: 어떤 시점이든 물을 때 쓰는 의문사예요.
    example_gloss: 회의가 언제예요?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: 상대방의 생일 묻기
    gloss: 생일이 언제예요?
    note: '*jest*가 아니라 *są*예요. 복수형 *urodziny*에 맞춘 거예요 -- *urodziny* 카드에서 짚은 패턴이에요.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: 내 생일 말하기
    gloss: 제 생일은 5월 10일이에요.
    note: '*Dziesiątego maja* -- 날짜는 *-ego*로, 달은 *-a*로 끝나며 전치사는 전혀 쓰지 않아요. 폴란드어에서 특정 날짜를 말하는 표준 방식이에요. 전체 패턴은 이 레슨 뒤의 문법 노트를 보세요.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: 회의가 언제인지 묻기
    gloss: 회의가 언제예요?
    note: '*Spotkanie*(회의)는 3과 대화에서 다시 보게 될 단어예요.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: 회의 날짜 말하기
    gloss: 회의는 5월 15일이에요.
    note: '*dziesiątego maja*와 같은 *-ego* + *-a* 날짜 패턴이고, 날짜 숫자만 달라요.'
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: 폴란드어로 날짜 말하기
    gloss: '날짜: 일은 -ego로, 월은 -a로 끝나요(단, 2월은 lutego). 전치사는 쓰지 않아요 -- 5월 10일, 5월 15일.'
    note: '''금요일에''(*w piątek*, 전치사 *w*가 필요해요)와 비교해 보세요 -- 특정 달력 날짜를 말할 때는 방식이 달라서 전치사를 전혀 쓰지 않아요.'
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: 다시 만나자고 제안하기
    gloss: 우리 언제 다시 만날 수 있을까요?
    note: '*Znowu*는 ''다시''라는 뜻이에요 -- 또 한 번의 만남 일정을 이야기하기 시작할 때 쓰는 자연스러운 표현이에요.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: 남성에게 격식 있게 금요일이 괜찮은지 묻기
    gloss: 금요일 괜찮으세요? (남성에게, 격식)
    note: '*Panu*는 *pan*의 여격형이에요. *odpowiadać*("~에게 맞다")는 항상 목적어를 여격으로 써요. 한국어의 "금요일이 선생님께 괜찮으세요?"처럼 "~께"에 해당하는 말이 필요한데, 폴란드어에서는 그 자리에 *panu*를 써요.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: 여성에게 격식 있게 금요일이 괜찮은지 묻기
    gloss: 금요일 괜찮으세요? (여성에게, 격식)
    note: 여성에게 격식 있게 말하려면 *panu* 대신 *pani*를 쓰세요 -- *pani*는 여기서 주격과 여격의 형태가 같아요. *pan*/*panu*와는 달라요.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: 친구에게 금요일이 괜찮은지 편하게 묻기
    gloss: 금요일 괜찮아? (친구에게)
    note: 친구나 또래와 이야기할 때는 *panu*/*pani* 대신 *ci*를 써요. 친근한 말투의 여격 "너에게"예요.
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: 금요일이 괜찮다고 말하기
    gloss: 금요일 괜찮아요.
    note: '*Mi*는 1인칭 여격이에요. *panu*/*pani*/*ci*와 같은 격 패턴이고, "당신/너" 대신 "나"를 가리킬 뿐이에요.'
  pl.a1.unit03.lesson03.teach.data:
    title: 날짜
    gloss: 날짜 (달력의 날짜)
    note: 달력의 날짜를 뜻해요. 한국어의 "데이트"처럼 연인과 만나는 약속을 뜻하지는 않아요.
    example_gloss: 날짜가 어떻게 되나요?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: 날짜가 어떻게 되는지 묻기
    gloss: 날짜가 어떻게 되나요?
    note: 요일은 정했지만 정확한 날짜는 아직 정하지 않았을 때 자연스럽게 이어서 하는 질문이에요.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: 에바가 다시 만나자고 제안해요
    gloss: 에바가 마레크에게 언제 다시 만날 수 있는지 물어요.
    note: 이 수업의 첫 질문을 그대로 다시 써요.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: 마레크가 격식을 갖춰 금요일을 제안해요
    gloss: 마레크가 에바에게 격식을 갖춰 금요일이 괜찮은지 물어요.
    note: 첫 번째 단원부터 써 온 격식체대로 에바를 *pani*로 불러요.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: 에바가 동의하고 날짜를 물어요
    gloss: 에바가 금요일이 괜찮다고 말한 뒤 정확한 날짜를 물어요.
    note: 1단원에서 배운 *Tak*("네")로 에바가 동의하며 말을 시작하고, 이어서 정확한 날짜를 물어요.
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: 마레크가 날짜를 알려 줘요
    gloss: 마레크가 5월 15일이라고 말해요.
    note: 여기에 나온 두 단어는 이 단원의 2과에서 이미 배웠어요.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: 에바가 확인하고 작별 인사를 해요
    gloss: 에바가 좋다고 말하고 5월 15일에 보자고 인사해요.
    note: '*Do zobaczenia*는 1단원에서 배운 작별 인사인데, 여기서는 구체적인 날짜와 함께 쓰였어요.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: 마레크가 대화를 마무리해요
    gloss: 마레크도 작별 인사를 해요.
    note: 가장 짧은 마무리 인사로, 작별 인사만 말해요.
