teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: 음악
    gloss: 음악
    note: 좋아하는 것과 싫어하는 것을 이야기할 때 자주 나오는 주제예요.
    example_gloss: 저는 음악을 좋아해요.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: lubić(좋아하다) 뒤에 목적어가 오면 muzyka는 muzykę로 바뀌어요. kawa가 kawę로 바뀌는 것과 같아요. Lubię muzykę이고, Lubię muzyka가 아니에요.
    note: 이미 아는 패턴이에요. *muzyka*는 *lubię*의 목적어가 되면 *muzykę*로 바뀌어요. *kawa*가 *kawę*로 바뀌는 것과 같아요.
  pl.a1.unit13.lesson01.teach.lubisz:
    title: 너는 좋아해요
    gloss: (너는) 좋아해요 (친근한 사이, ty)
    note: lubić의 'ty' 형태예요. 친구에게 무언가를 좋아하는지 직접 물을 때 필요한 형태예요.
    example_gloss: 음악을 좋아해요?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić(좋아하다): lubię (나), lubisz (너), lubi (그/그녀). lubię와 lubi는 이미 알고 있어요. lubisz는 대화 상대를 가리키는 새로운 형태예요.'
    note: '*Lubię*와 *lubi*는 이제 익숙하죠. *lubisz*는 같은 동사에서 빠져 있던 "너" 형태예요.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: 음악을 좋아해요?
    gloss: 음악을 좋아해요?
    note: Czy는 예/아니요 질문을 시작하는 말이에요. 친구에게 취향을 묻는 자연스러운 방법이에요.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: 네, 좋아해요.
    gloss: 네, 좋아해요.
    note: 짧고 자연스러운 대답이에요. muzykę라는 단어를 반복할 필요가 없어요.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: 아니요, 안 좋아해요.
    gloss: 아니요, 좋아하지 않아요.
    note: Nie nie lubię는 nie가 겹쳐 보이지만 실수가 아니에요. 첫 번째 nie는 질문에 대한 대답이고, 두 번째 nie는 lubię를 부정해요.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: 짧은 대답
    gloss: '짧은 대답: Tak, lubię. / Nie, nie lubię. -- 질문에서 무엇에 대한 이야기인지 이미 알 수 있으니 muzykę라는 단어를 반복할 필요가 없어요.'
    note: '*Pyszny?*가 혼자서도 문장이 되듯이, *Tak, lubię.*도 무엇에 대해 말하는지 다시 말할 필요가 없어요. 맥락이 이미 알려 주니까요.'
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: 저는 음악을 아주 좋아해요
    gloss: 저는 음악을 아주 좋아해요.
    note: Bardzo(아주, 매우)는 단순한 취향을 더 강하게 만들어 줘요. bardzo는 첫 번째 단원부터 계속 봐 왔어요.
  pl.a1.unit13.lesson02.teach.wole:
    title: 저는 ~을 더 좋아해요
    gloss: 저는 ~을 더 좋아해요
    note: 이번 단원의 새 동사 woleć(더 좋아하다)예요. 여기서는 lubię처럼 '나'에 해당하는 형태만 배워요.
    example_gloss: 저는 차를 더 좋아해요.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: 이번 단원에서는 wolę만'
    gloss: 'Woleć(더 좋아하다): wolę(나) -- 이번 수업에서는 lubię처럼 ''나''에 해당하는 형태만 배워요. Wolę kawę. = 저는 커피를 더 좋아해요.'
    note: 지금은 *woleć*의 *ja*(나) 형태만 배워요. *lubię*를 처음 배울 때와 똑같은 범위예요.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: 다시 커피와 차
    gloss: 'Wolę + 목적어: kawa는 kawę, herbata는 herbatę가 돼요. 이미 아는 것과 같은 패턴이에요.'
    note: '앞에서 배운 것과 같은 biernik(대격) 패턴이고 동사만 새로워요: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: 저는 커피를 더 좋아해요
    gloss: 저는 커피를 더 좋아해요.
    note: wolę를 사용해 취향을 담담하게 말하는 문장이에요.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: 저는 차를 더 좋아해요
    gloss: 저는 차를 더 좋아해요.
    note: kawę 대신 herbatę를 쓴 같은 패턴이에요.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: '''또는''으로 쓰인 czy'
    gloss: Kawa czy herbata?의 czy는 예/아니요 질문을 여는 czy와 달라요. 여기서는 두 가지 선택지를 '또는'의 뜻으로 이어 줘요. Kawa czy herbata? = 커피예요, 차예요?
    note: 주의하세요. *czy*는 보통 예/아니요 질문을 열지만, 이렇게 두 명사 사이에 오면 '또는'이라는 뜻이에요.
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: 커피 드실래요, 차 드실래요?
    gloss: 커피, 아니면 차?
    note: 상대에게 선택지를 건네는 짧고 자연스러운 표현이에요.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: 저도요
    gloss: 저도요 / 나도
    note: 방금 상대가 한 말에 동의할 때 쓰는 짧은 표현이에요.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: 다시 만난 Ja też
    gloss: Ja też는 '저도요' / '나도'라는 뜻이에요. 일과 수업에서 이미 배웠어요(Ja też wstaję o siódmej, '저도 7시에 일어나요').
    note: 이 표현이 앞에서 나왔다는 것을 짚어 주는 짧은 복습이에요.
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata?에는 동사가 필요 없어요
    gloss: 지난 단원의 Pyszny?처럼, 짧은 질문 Kawa czy herbata?에도 동사가 필요 없어요. 맥락만으로 충분해요.
    note: '*Pyszny?*와 같은 패턴이에요. 동사 없는 짧은 질문이지만 맥락 덕분에 뜻이 분명해요.'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: 마레크가 에바에게 음악을 좋아하는지 물어요
    gloss: 음악 좋아해요?
    note: 마레크가 이번 단원에서 배운 질문으로 대화를 시작해요.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: 에바가 좋아한다고 답하고 되물어요
    gloss: 네, 아주 좋아해요! 당신은요?
    note: A ty?(당신은요?)로 질문을 마레크에게 되돌려 줘요. 앞 단원에서 본 것과 같은 패턴이에요.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: 마레크가 공감하고 음료를 물어요
    gloss: 저도요. 커피, 아니면 차?
    note: Ja też lubię로 맞장구친 뒤, 마레크는 새로운 선택 질문으로 화제를 바꿔요.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: 에바는 커피를 더 좋아해요
    gloss: 저는 커피를 더 좋아해요.
    note: wolę를 사용한 에바 자신의 취향이에요. 일과 단원에서 만난, 커피를 즐기는 바로 그 에바예요.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: 마레크는 차를 더 좋아해요
    gloss: 저는 차를 더 좋아해요.
    note: 마레크 자신의 취향으로, 에바와는 반대의 선택이에요.
