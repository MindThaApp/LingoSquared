teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 거는 동사의 원형이에요.
    example_gloss: 너에게 전화해야 해요.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: 전화하겠다고 말하기
    gloss: 제가 전화할게요.
    note: '*Zadzwonię*는 *zadzwonić*(전화하다, 한 번)의 완료상 미래형이에요. 폴란드어에서는 ''전화할게요''처럼 약속할 때 이 형태를 써요.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: 전화 받기
    gloss: 여보세요, Ewa예요.
    note: '*Tu* + 이름(직역하면 ''여기 ...'')은 전화로 자신을 밝힐 때 쓰는 표준 표현이에요.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek도 같은 방식으로 받아요
    gloss: 여보세요, Marek이에요.
    note: '*Halo, tu Ewa*와 같은 *tu* + 이름 패턴이에요.'
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: 누가 전화했는지 묻기
    gloss: 누구세요?
    note: '*Z kim rozmawiam?*(직역하면 ''제가 누구와 이야기하고 있나요?'')은 모르는 사람이 전화했을 때 쓰는 표준 표현이에요. *kim*은 *z* 뒤에 오는 조격이에요.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: 격식 있게 자신을 밝히기
    gloss: Ewa 씨와 통화하고 계세요.
    note: '*Rozmawia pan z Ewą*는 격식 있는 표현이에요. *pan*(남성에게) 또는 *pani*(여성에게)에 3인칭 동사를 쓰고, *z* + 조격을 써요.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어요?
    note: '*Możesz*(~할 수 있어요?, *móc*) + 동사원형 *powtórzyć*(반복하다) + *to*(그것)예요.'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 주세요.
    note: '*Nie mów*는 부정 명령형(말하지 마세요)이고, *tak szybko*는 ''그렇게 빨리''라는 뜻이에요.'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려요.
    note: '*Nie słyszę cię dobrze*는 잘 들리지 않는다고 말하는 표현이에요. *cię*는 *ty*의 대격이고 *dobrze*는 ''잘''이라는 뜻이에요.'
  pl.a1.unit22.lesson04.teach.sms:
    title: 문자 메시지
    gloss: 문자 메시지
    note: '*SMS*는 외래어에서 온 남성 명사예요: *ten SMS*.'
    example_gloss: 문자 메시지는 Ewa가 보낸 거예요.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: 문자 보내겠다고 말하기
    gloss: 문자 보낼게요.
    note: '*Wysłać*(보내다)는 받는 사람에는 여격 *ci*(너에게)를, 보내는 물건에는 대격을 써요: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: '*Oddzwonić*(다시 전화하다)는 폴란드어에서 동사 하나예요: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: 문자 대화 읽기
    gloss: 'Marek: 안녕 Ewa, 나한테 전화해 줄 수 있어? 할 말이 있어. Ewa: 응, 물론이지. 5분 뒤에 다시 전화할게.'
    note: Marek이 무엇을, 왜 부탁하는지, 그리고 Ewa가 언제 다시 전화하겠다고 하는지 살펴보세요.
    glosses:
      Cześć: 안녕
      możesz: ~할 수 있다
      zadzwonić: 전화하다
      Muszę: ~해야 하다
      coś: 무언가
      powiedzieć: 말해 주다
      oczywiście: 물론
      oddzwonię: 전화하다
      pięć: 다섯
      minut: 분
      za: 다시 (전화) 걸다
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek이 전화를 받아요
    gloss: 'Marek: 여보세요, Marek이에요.'
    note: 1과에서 배운 *tu* + 이름 패턴을 이제 실제 통화에서 써요. 전화를 받은 사람이 먼저 말하고 자기 이름을 밝혀요.
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa가 자신을 밝혀요
    gloss: 'Ewa: 안녕 Marek, 나 Ewa야. Marek: 전화해 줘서 좋다!'
    note: '*Fajnie, że* ...(~해서 좋다)는 어떤 일에 대한 긍정적인 반응을 나타내요. *że*가 뒤따르는 절을 이끌어요.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa가 근무에 대해 물어요
    gloss: 'Ewa: 첫 근무는 어땠어?'
    note: '*Jak ci poszła ...?*(직역하면 ''...가 너에게 어떻게 갔어?'')는 이미 지나간 일에 대해 물어요. *Ci*는 *ty*의 여격이고, *poszła*는 여성 명사 *zmiana*와 일치해요.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek이 좋은 소식을 전해요
    gloss: 'Marek: 아주 잘 됐어, 생각했던 것보다 더 좋았어.'
    note: '*Poszło*는 *iść*의 과거형에 어미 *-o*(''그것''을 나타내며, 여기서는 ''~하게 되다''라는 뜻)가 붙은 거예요. *myślałem*은 *myśleć*(생각하다)의 과거형으로, 남성 화자의 어미예요.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: '과거 시제: było, poszło, myślałem'
    gloss: '과거 시제: *było*(~였다)는 *być*(~이다), *poszło*(갔다)는 *iść*(가다), *myślałem*(나는 생각했다)은 *myśleć*(생각하다)에서 나왔어요.'
    note: '폴란드어 과거형은 *-ł-*에 성에 따른 어미를 붙여 만들어요: *myślał*(남성), *myślała*(여성), *było*(중성). 지금은 *było*, *poszło*, *myślałem*을 이 수업에 나온 상황에서 쓰는 고정된 형태로 익혀 두세요.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa가 자랑스러워해요
    gloss: 'Ewa: 정말 기쁜 소식이네요! 당신이 자랑스러워요.'
    note: '*Dumny z*(~이 자랑스럽다)는 굳어진 표현이에요: *z* + 속격이라서 *z ciebie*가 돼요. Ewa는 여성이라 *dumna*라고 해요.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek이 감동해요
    gloss: 'Marek: 정말 고마워요. 저한테 큰 의미가 있어요.'
    note: '*Znaczy*는 *znaczyć*(의미하다)의 *on/ona/ono* 형태예요. *dla mnie*(나에게)는 누구에게 중요한지를 나타내요.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 됐어요.
    note: '*Jego*(그의)는 형태가 변하지 않고 명사 앞에 와요: *jego pierwsza zmiana*. 여성 명사라도 jego에는 영향을 주지 않아요.'
