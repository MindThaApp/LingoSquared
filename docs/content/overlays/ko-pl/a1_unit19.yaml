teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: 어떤, ~이다, 오늘, 아니다 -- 다시 확인해요
    gloss: Jaka, jest, Dziś, nie -- 앞선 수업에서 이미 배운 단어예요.
    note: 이번 수업에서 날씨를 말할 때 쓰기 전에 가볍게 복습해요.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: 날씨
    gloss: 날씨
    note: 날씨나 기상 상태를 가리키는 일반적인 단어예요.
    example_gloss: 날씨가 어때요?
  pl.a1.unit19.lesson01.teach.zimno:
    title: 추위
    gloss: 추운
    note: 기온을 나타내는 말이며, 성에 따라 형태가 변하지 않아요.
    example_gloss: 추워요.
  pl.a1.unit19.lesson01.teach.goraco:
    title: 더운
    gloss: 더운
    note: '''*zimno*''의 반대말이에요. 이 단어도 성에 따라 형태가 변하지 않아요.'
    example_gloss: 더워요.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: 추워요, 더워요
    gloss: Jest zimno. Jest gorąco. -- 폴란드어에서 날씨를 말하는 방식이에요. '*jest*'에 날씨 단어를 붙이면 되고, 성을 맞출 필요가 없어요.
    note: 이 단원의 모든 날씨 단어에 이 간단한 패턴을 쓸 수 있어요.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: 날씨가 어때요?
    gloss: 날씨가 어때요?
    note: 지금 날씨를 물을 때 쓰는 자연스러운 표현이에요.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: 오늘은 추워요
    gloss: 오늘은 추워요.
    note: 이 단원 전체의 바탕이 되는, 오늘 날씨를 말하는 문장이에요.
  pl.a1.unit19.lesson02.teach.pada:
    title: 비가 와요
    gloss: 비가 와요 / 비가 내려요
    note: 주어 없이 혼자 쓰는 말이에요. 폴란드어에서 비가 온다고 할 때 이렇게 말하는 것이 보통이에요.
    example_gloss: 오늘은 비가 와요.
  pl.a1.unit19.lesson02.teach.snieg:
    title: 눈
    gloss: 눈
    note: 눈을 뜻하는 단어예요. '*pada*'와 함께 쓰면 '눈이 와요'라는 뜻이 돼요.
    example_gloss: 눈이 와요.
  pl.a1.unit19.lesson02.teach.mgla:
    title: 안개
    gloss: 안개
    note: 또 하나의 흔한 날씨 상태예요.
    example_gloss: 안개가 꼈어요.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: 좋은
    gloss: Pogoda jest dobra. -- '*dobra*'는 '*pogoda*' 같은 여성 명사와 어울려요.
    note: '''*dobry*''의 여성형이에요(''*Dzień dobry*''에서 보았죠). *chory/chora*와 같은 -y/-a 패턴이에요.'
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: 끔찍한
    gloss: Jaka straszna pogoda! -- '*straszna*'도 '*dobra*'처럼 '*pogoda*'와 어울려요.
    note: 강한 표현이에요. 정말 나쁜 날씨에만 쓰세요.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: 날씨가 정말 끔찍하네요!
    gloss: 날씨가 정말 끔찍하네요!
    note: 나쁜 날씨에 대해 감탄할 때 쓰는 자연스러운 표현이에요.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: 날씨가 좋아요
    gloss: 날씨가 좋아요.
    note: 이 수업 앞부분에서 배운 날씨 단어를 다시 써요.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: 네, 그리고, 나, 또한 -- 다시 확인해요
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- 앞선 수업에서 이미 배운 단어예요.
    note: 이번 수업의 대화에 앞서 가볍게 복습해요.
  pl.a1.unit19.lesson03.teach.bo:
    title: 왜냐하면
    gloss: 왜냐하면 / ~해서
    note: 계획과 그 뒤에 있는 날씨라는 이유를 연결해 줘요.
    example_gloss: 비가 와서 공원에 안 가요.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: 비가 와서 가고 싶지 않아요
    gloss: 비가 와서 공원에 가고 싶지 않아요.
    note: 날씨 묘사와 실제 계획을 함께 말하는 문장으로, 이 단원이 목표로 하는 표현이에요.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: 크라쿠프에서 -- 다시 확인해요
    gloss: 'W Krakowie -- 앞선 수업에서 이미 배웠어요. 예: ''Ona mieszka w Krakowie''(그녀는 크라쿠프에 살아요).'
    note: 두 곳의 날씨를 비교하는 이번 대화에 앞서 가볍게 복습해요.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: 마레크가 날씨를 물어요
    gloss: 오늘 날씨가 어때요?
    note: 마레크가 오늘 날씨를 물으며 대화를 시작해요.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: 에바가 대답해요
    gloss: 비가 와요. 추워요.
    note: 에바가 오늘의 실제 날씨를 설명해요.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: 마레크가 반응하고 계획을 말해요
    gloss: 날씨가 정말 끔찍하네요! 비가 와서 공원에 가고 싶지 않아요.
    note: 마레크가 날씨에 반응하고, 그 때문에 세운 계획을 말해요.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: 에바가 동의해요
    gloss: 저도 공원에 안 가요.
    note: 에바도 마레크와 같은 계획을 세워요.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: 마레크가 크라쿠프에 대해 물어요
    gloss: 크라쿠프는요? 거기는 날씨가 어때요?
    note: 마레크가 다른 도시의 날씨로 화제를 돌려요.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: 에바가 대답해요
    gloss: 크라쿠프에는 눈이 와요. 거기는 아주 추워요.
    note: 에바가 크라쿠프의 더 추운 날씨 상태를 설명해요.
