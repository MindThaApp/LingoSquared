teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: 가족
    gloss: 가족
    note: 가족 전체를 가리키는 일반적인 단어예요. 특정한 한 관계가 아니라 온 식구를 뜻해요.
    example_gloss: 이 사람들은 제 가족이에요.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: 어머니, 아버지
    gloss: 어머니; 아버지
    note: 부모를 가리키는 기본 단어 두 개예요. 일상 대화에서는 애정을 담은 mama, tata도 자주 듣지만, 여기서는 중립적인 표준형 matka와 ojciec을 배워요.
    example_gloss:
    - 이분은 제 어머니예요.
    - 이분은 제 아버지예요.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: 형제, 자매
    gloss: 형제; 자매
    note: 둘 다 일반적인 명사예요. brat는 남성, siostra는 여성이며, 이 단원 문법 노트의 mój/moja 일치와 관련이 있어요.
    example_gloss:
    - 이 사람은 제 남자 형제예요.
    - 이 사람은 제 여자 형제예요.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: 부모님
    gloss: 부모님
    note: Rodzice는 남성 인칭 복수 명사라서 mój/moja가 아니라 고유한 소유 형태 moi를 써요. 이 단원의 예문과 문법 노트에서 볼 수 있어요.
    example_gloss: 저희 부모님은 바르샤바에 사세요.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: '나의: mój, moja, moi'
    gloss: 나의 아버지, 나의 형제 -- 나의 어머니, 나의 자매 -- 나의 부모님.
    note: 폴란드어 소유 표현은 꾸미는 명사의 성에 일치해요. 남성 명사 앞에는 *mój*(*mój ojciec*, *mój brat*), 여성 명사 앞에는 *moja*(*moja matka*, *moja siostra*)를 쓰고, 남성 인칭 복수 *rodzice* 앞에서만 불규칙한 별도 형태 *moi*를 써요.
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: 이분은 제 아버지예요
    gloss: 이분은 제 아버지예요.
    note: '*To jest*(이것은 ~예요)는 명사의 성과 상관없이 똑같이 쓰고, 소유 표현 mój/moja만 바뀌어요.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: 할아버지, 할머니
    gloss: 할아버지; 할머니
    note: 할아버지와 할머니를 가리키는 일상적인 표준 단어로, 아이와 어른 모두 써요.
    example_gloss:
    - 이분은 제 할아버지예요.
    - 이분은 제 할머니예요.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: 삼촌, 이모/고모
    gloss: 삼촌; 이모·고모
    note: 한국어에는 삼촌, 외삼촌, 이모, 고모처럼 구분하는 말이 있지만, 폴란드어는 부모의 형제나 자매, 그리고 그 배우자까지 이 한 단어로 불러요.
    example_gloss:
    - 이분은 제 삼촌이에요.
    - 이분은 제 이모예요.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: 아들, 딸
    gloss: 아들; 딸
    note: 예문에는 *mieć*(가지다) 뒤에 필요한 대격 형태가 나와요. *syn*은 *syna*, *córka*는 *córkę*가 돼요. 왜 어미가 바뀌는지는 뒤의 문법 노트에서 설명해요.
    example_gloss:
    - 저는 아들이 있어요.
    - 저는 딸이 있어요.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: '가지다: mam, masz, ma'
    gloss: '가지다: 나는 가지고 있다, 너는 가지고 있다, 그/그녀는 가지고 있다 -- 나는 형제가 있어요, 너는 자매가 있어요, 그/그녀는 아들이 있어요.'
    note: '*Mieć*는 ''가지다, 있다''라는 뜻의 동사예요. *Mam*(나는 가지고 있다)과 *ma*(그/그녀는 가지고 있다)가 이번 단원의 주요 새 형태이고, *masz*(너는 가지고 있다)는 2단원에서 나이를 되물을 때 이미 봤어요.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: 가진 것 말하기
    gloss: '''가지다'' 뒤에서는 명사의 어미가 바뀌어요: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: 이것이 대격이에요. *mieć* 같은 동사의 직접 목적어가 될 때 명사가 취하는 형태예요. *brat*, *syn*처럼 사람(과 동물)을 가리키는 남성 명사는 *-a*를 붙이고, *siostra*, *córka*처럼 여성 명사는 끝의 *-a*가 *-ę*로 바뀌어요.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: 저는 남자 형제 한 명과 여자 형제 한 명이 있어요
    gloss: 저는 남자 형제 한 명과 여자 형제 한 명이 있어요.
    note: 문법 노트에서 배운 대격 어미를 완전한 문장에 적용해 보고, 새 연결어 *i*(그리고)도 함께 익혀요.
  pl.a1.unit05.lesson03.teach.lub:
    title: 또는
    gloss: 또는
    note: 두 가지 선택지를 제시하는 예/아니요 질문에서 쓰는 '또는'이에요.
    example_gloss: 형제나 자매가 있어요?
  pl.a1.unit05.lesson03.teach.tylko:
    title: 오직
    gloss: 오직
    note: 한정하려는 말 바로 앞에 와요. 한국어의 '만'이 말 뒤에 붙는 것과 위치가 달라요.
    example_gloss: 저는 여동생만 있어요.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: 어디
    gloss: 어디
    note: 기본적인 의문사예요. 이 단원의 대화처럼 mieszkać(살다)와 자연스럽게 함께 쓰여요.
    example_gloss: 당신의 형제는 어디에 살아요?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: 그, 그녀 -- 그리고 '살다'
    gloss: '그, 그녀 -- 살다: 나는 살아요, 그/그녀는 살아요. 그는 Gdańsk에 살아요. 그녀는 Kraków에 살아요.'
    note: '*On*(그)과 *ona*(그녀)는 3인칭 대명사예요. *Mieszkać*(살다)는 *mieć*와 같은 1인칭/3인칭 변화를 해요. *mieszkam*(나는 살아요, 1단원의 *Mieszkam w Warszawie*)과 *mieszka*(그/그녀는 살아요)예요. 지명은 *w* 뒤에서 위치격이 돼요. *Gdańsk*는 *w Gdańsku*, *Kraków*는 *w Krakowie*가 되며, 1단원의 *Mieszkam w Warszawie*와 같은 w + 위치격 방식이에요.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek이 형제자매에 대해 물어요
    gloss: Marek이 Ewa에게 형제나 자매가 있는지 물어요.
    note: '*Czy*를 쓴 예/아니요 질문이에요. 1단원에서 본 의문 표지와 같아요. Ewa와 Marek은 이제 서로 잘 알아서 격식체 *pan*/*pani* 대신 편한 *ty*(*masz*, *A ty?*, *twój*)를 써요.'
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa가 대답하고 되물어요
    gloss: Ewa는 형제와 자매가 있다고 말한 뒤, Marek에게 같은 질문을 되물어요.
    note: '*A ty?*("너는?")는 질문한 사람에게 같은 질문을 돌려줄 때 쓰는 간단하고 자연스러운 표현이에요.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek이 대답해요
    gloss: Marek은 여동생만 있고 그녀가 Kraków에 산다고 말한 뒤, Ewa의 오빠에 대해 물어요.
    note: Marek에게는 형제가 없고 *tylko siostrę*(자매만)뿐이에요. Ewa가 이미 형제가 있다고 했으니, Ewa의 형제에 대해 묻는 것은 자연스러워요.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa가 대답해요
    gloss: Ewa는 자기 형제가 Gdańsk에 살고 아들과 딸이 있다고 말해요.
    note: 이 단원 2과에서 배운 syn/córka의 대격 형태를 다시 써요.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek이 반응해요
    gloss: Marek이 "멋진 가족이네요!"라고 말해요.
    note: '*Fajna*는 ''멋진'', ''근사한''을 뜻하는 일상적이고 편한 말이에요. 대화를 마무리하는 자연스러운 반응이며, 4단원의 *Świetnie!*와 같은 수준의 말투예요.'
