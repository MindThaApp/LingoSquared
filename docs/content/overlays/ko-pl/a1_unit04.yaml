  pl.a1.unit04.time:
    title: 시간과 시각
lessons:
  pl.a1.unit04.lesson01.ktora_godzina:
    title: 몇 시예요?
  pl.a1.unit04.lesson02.o_ktorej_godzinie:
    title: 몇 시에
  pl.a1.unit04.lesson03.ustalamy_godzine_spotkania:
    title: 만나는 시간 정하기
teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: 1시, 2시, 3시
    gloss: 1시; 2시; 3시
    note: 폴란드어는 시각을 여성형 서수로 말해요. 말하지 않아도 이해되는 여성 명사 *godzina*(시간)에 맞춘 형태예요. *pierwsza*는 문자 그대로 "첫 번째 (시간)"이라는 뜻이에요.
    example_gloss:
    - 1시예요.
    - 2시예요.
    - 3시예요.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: 4시, 5시, 6시
    gloss: 4시; 5시; 6시
    note: '*pierwsza*, *druga*, *trzecia*와 같은 여성형 서수 패턴이에요.'
    example_gloss:
    - 4시예요.
    - 5시예요.
    - 6시예요.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: 7시, 8시, 9시
    gloss: 7시; 8시; 9시
    note: 12시간 중 가운데 세 개로, 같은 패턴이에요.
    example_gloss:
    - 7시예요.
    - 8시예요.
    - 9시예요.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: 10시, 11시, 12시
    gloss: 10시; 11시; 12시
    note: 1부터 12까지 전체 시각을 완성하는 마지막 세 시간이에요.
    example_gloss:
    - 10시예요.
    - 11시예요.
    - 12시예요.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: 시간 묻기
    gloss: 몇 시예요?
    note: 직역하면 "어느 것이 시간이에요?"라는 뜻이에요. *która*는 여성 명사 *godzina*에 맞춘 형태이고, 이 단원 전체에서 같은 일치 방식을 보게 돼요.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina는 여성 명사예요
    gloss: 시각을 말할 때는 pierwsza, druga, trzecia라고 하고, pierwszy, drugi, trzeci라고 하지 않아요.
    note: '*Pierwszy*, *drugi*, *trzeci*는 같은 서수의 남성형으로, 폴란드어에서 남성 명사에 쓰여요. 하지만 *godzina*가 여성 명사이기 때문에 시각을 말할 때는 쓰지 않아요.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: 아침, 정오, 오후
    gloss: 아침에; 정오에; 오후에
    note: '*Rano*는 전치사 없이 혼자 쓰이고, *w południe*와 *po południu*는 각각 고정된 전치사를 함께 써요. 이 세 표현은 일반 규칙으로 풀기보다 하나의 표현으로 외워 두는 게 좋아요.'
    example_gloss:
    - 아침에 저는 커피를 마셔요.
    - 저는 정오에 점심을 먹어요.
    - 저는 오후에 일해요.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: 저녁, 밤
    gloss: 저녁에; 밤에
    note: '*Wieczorem*은 고정된 부사 형태라 전치사가 필요 없어요. *w nocy*는 *w*와 *noc*(밤)의 전치격 형태를 함께 쓴 표현이에요.'
    example_gloss:
    - 저녁에 저는 텔레비전을 봐요.
    - 밤에 저는 자요.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: 몇 시에인지 묻기
    gloss: 몇 시에요?
    note: 지금 몇 시인지가 아니라 어떤 일이 언제 일어나는지 물을 때 *Która jest godzina?* 대신 이 표현을 써요.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: '"~시에" 말하기'
    gloss: 4시, 7시, 10시 -- 하지만 4시에, 7시에, 10시에.
    note: '*o*("~에") 뒤에서는 시각 단어의 끝 *-a*가 *-ej*로 바뀌어요. *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*처럼요. 모든 시각이 같은 방식을 따르지만, 철자에서 *druga* → *o drugiej*만 *g* 뒤에 *i*가 더해져요.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: 에바는 일찍 일어나요
    gloss: 에바는 아침 7시에 일어나요.
    note: '*Wstaje*는 *wstawać*(일어나다)의 3인칭 단수형이에요.'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: 기차 출발 시간
    gloss: 기차는 오후 4시에 출발해요.
    note: '*Odjeżdża*는 *odjeżdżać*(출발하다)의 3인칭 단수형이에요.'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: 회의, 만남
    gloss: 회의; 만남
    note: 3단원에서 에바와 마렉이 다시 만날 요일과 날짜를 정할 때 나왔던 단어예요(*Kiedy jest spotkanie?*).
    example_gloss: 회의는 금요일이에요.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: 만날 시간 묻기
    gloss: 5월 15일 금요일 몇 시에 만날 수 있어요?
    note: 이 단원의 *o której godzinie*와 3단원의 요일·날짜를 합친 표현이에요. 에바와 마렉은 이미 5월 15일 금요일로 정했고, 이제 정확한 시간을 정해야 해요.
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: 시간 제안하기
    gloss: 오후 4시는 어때요?
    note: '*Może*만 쓰면 "어쩌면"이라는 뜻이에요. 시간을 부드럽게 제안할 때 쓰는 자연스러운 말이에요.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: 시간이 괜찮다고 확인하기
    gloss: 오후 4시가 저는 좋아요.
    note: 3과의 *Piątek mi odpowiada*와 같은 *[time] + mi + odpowiada* 패턴이에요. 시간 자체가 문법상 주어이고, *odpowiadać*는 사람을 항상 여격(*mi*, "나에게")으로 써요.
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: 계획 전체 확인하기
    gloss: 5월 15일 4시에 만나요!
    note: 1단원의 작별 인사 *Do zobaczenia*에 이제 날짜와 시간을 함께 붙인 표현이에요.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: 에바가 시간을 물어요
    gloss: 에바가 마렉에게 5월 15일 금요일 몇 시에 만날 수 있는지 물어요.
    note: 이번 수업 처음에 나온 질문을 그대로 다시 쓴 거예요.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: 마렉이 오후 4시를 제안해요
    gloss: 마렉이 오후 4시를 제안해요.
    note: 단정이 아니라 부드러운 제안이에요. *może*가 그런 느낌을 줘요.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: 에바가 수락해요
    gloss: 에바가 오후 4시가 좋다고 말해요.
    note: 3단원의 "금요일이 좋아요" 대화와 같은 여격 구조예요.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: 마렉이 계획을 마무리해요
    gloss: 마렉이 좋다고 하면서 5월 15일 4시에 만나자고 말해요.
    note: '*Świetnie*는 3단원에서 나온 기쁨을 나타내는 감탄 표현이에요.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: 에바가 작별 인사를 해요
    gloss: 에바도 작별 인사를 해요.
    note: 가장 짧은 마무리 인사로, 작별 인사 그 자체예요.
