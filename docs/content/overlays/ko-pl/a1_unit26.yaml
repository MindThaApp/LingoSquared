  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek이 어떻게 생겼는지 물어요
    gloss: 'Marek: 어떻게 생겼어요?'
    note: 앞선 수업의 *Jak wygląda ...?* 질문을 이번에는 동물에게 써요. *on*은 개를 가리킬 수도 있어요.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa가 자기 개를 묘사해요
    gloss: 'Ewa: 털이 갈색이고 작아요.'
    note: 외모 단원에서 배운 머리 색과 크기 표현을 이번에는 사람의 머리카락이 아니라 동물의 털을 설명하는 데 써요.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: 동물을 가리키는 On과 ona
    gloss: 동물에게도 문법적 성이 있어요. *pies*와 *kot*에는 *on*('그')을, *ryba*에는 *ona*('그녀')를 써요. 이 대명사는 사람뿐만 아니라 동물도 가리킬 수 있어요.
    note: 대명사는 명사의 성을 따라요. *pies*와 *ptak*에는 *on*을, *ryba*에는 *ona*를, *zwierzę*에는 *ono*를 써요.
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek이 산책에 대해 물어요
    gloss: 'Marek: 매일 그 아이를 산책시켜요?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa가 일과를 이야기해요
    gloss: 'Ewa: 네, 매일 산책시키고 먹이도 줘요.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia, Tomek이 동물에 대해 이야기해요
    gloss: Marek과 Kasia는 둘 다 동물을 사랑하지만, 둘 중 누구도 반려동물이 없어요. Marek은 개를 좋아하고 Kasia는 고양이를 좋아해요. Tomek은 반려동물이 있어요. 바로 고양이예요. 그는 고양이와 자주 놀아 주고 매일 먹이를 줘요. 여러분은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      kochają: 사랑해요
      oboje: 둘 다
      zwierzęta: 동물들
      zwierzaka: 반려동물
      psy: 개들
      koty: 고양이들
      kota: 고양이
      bawi: 놀아요
      daje: 줘요
      co: 매
      jeść: 먹이
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek은 고양이와 자주 놀아요
    gloss: Tomek은 고양이와 자주 놀아요.
    note: '*Bawić się z*는 ''~와 놀다''라는 뜻이고 조격을 써요: *z kotem*. *Często*는 ''자주''를 뜻하는 빈도 부사예요.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: 저는 개를 좋아해요. 반려동물은 없어요.
    gloss: 저는 개를 좋아해요. 반려동물은 없어요.
    note: 이 단원의 쓰기 과제에 그대로 쓸 수 있는 두 문장짜리 모범 답안이에요.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa가 Nina에게 물어요
    gloss: 'Ewa: Nina, 너도 반려동물 있어?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: 니나에게는 피코라는 새가 있어요
    gloss: '니나: 응, 새를 키워. 이름은 피코야.'
    note: '*Ma na imię*(''이름이 ~예요'')는 앞에서 이름을 소개할 때 쓴 표현과 같아요.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek의 반응
    gloss: 'Marek: 정말 좋네요! 매일 그 아이와 뭘 해요?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: 니나가 매일 먹이를 줘요
    gloss: '니나: 매일 먹이를 줘.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek도 새를 좋아해요
    gloss: 'Marek: 저도 새를 좋아해요.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa가 대화를 마무리해요
    gloss: 'Ewa: 우리 셋 모두 동물을 좋아하다니 정말 좋네요!'
    note: 이 단원에 나온 세 사람의 동물 이야기를 하나로 마무리해요.
