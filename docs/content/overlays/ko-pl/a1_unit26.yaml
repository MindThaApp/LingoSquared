teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: 동물, 반려동물
    gloss: 동물 / 반려동물
    note: '*Zwierzę*는 ''동물''을 뜻하는 일반적인 단어이고, *zwierzak*는 ''반려동물''을 뜻하는 일상적인 단어예요.'
    example_gloss:
    - 개는 동물이에요.
    - 개는 반려동물이기도 해요.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: 개와 고양이
    gloss: 개 / 고양이
    example_gloss:
    - Ewa는 개를 키워요.
    - Tomek은 고양이를 키워요.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: 물고기와 새
    gloss: 물고기 / 새
    example_gloss:
    - 할아버지에게는 물고기가 있어요.
    - Nina에게는 새가 있어요.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: 앞선 단원에서 이미 배운 *Masz ...?* 질문 형태와 같아요. *masz*는 *mieć*의 *ty*에 해당하는 형태예요.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: 이 단원의 새 어휘를 사용한 간단한 긍정 대답이에요.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: '*Nie mam* + 생격은 갖고 있지 않은 것을 부정해요: *zwierzaka*. 문법 설명을 보세요.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + 생격
    gloss: '*nie mam* 뒤에서 목적어는 생격으로 써요: *Nie mam czasu*(저는 시간이 없어요), 여기서는 *Nie mam zwierzaka*(저는 반려동물이 없어요).'
    note: '*Nie mam czasu*와 같은 형태이고 명사만 새로워요. *zwierzak*처럼 생물인 남성 명사는 대격과 생격의 형태가 같지만, 여성 명사는 형태가 바뀌어요(*Mam rybę* → *Nie mam ryby*).'
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: '*Wyprowadzać na spacer*는 동물을 산책시킬 때 쓰는 관용 표현이에요. 습관이라서 동사는 불완료상이에요. 문법 설명을 보세요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: 습관에는 불완료상
    gloss: '*Wyprowadzać*(불완료상)는 습관을 나타내요: *Codziennie wyprowadzam psa.* 완료상 *wyprowadzić*는 한 번 끝난 산책에 써요.'
    note: '상의 짝: 불완료상(*wyprowadzać*)은 반복되는 일에, 완료상(*wyprowadzić*)은 한 번 완결된 행동에 써요.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: 먹이를 주다
    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: Tomek은 자기 고양이와 놀아요.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: '*wyprowadzać na spacer*와 *codziennie*(매일)를 합친 표현이에요. 목적어 *psa*는 대격이에요.'
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: '*Karmić*(먹이를 주다)는 동물을 대격으로 받아요: *karmię kota*. 여기서는 *codziennie*와 함께 쓰였어요.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: '복수형: pies, psy'
    gloss: '복수형: *pies*는 *psy*, *kot*는 *koty*, *ryba*는 *ryby*, *ptak*는 *ptaki*가 돼요. 대부분의 복수형은 *-y*로 끝나고, k와 g 뒤에서는 *-i*로 끝나요.'
    note: 동물 명사를 예로 들어 처음 소개하는 폴란드어의 규칙적인 복수형이에요.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: 개와 고양이
    gloss: 개들 / 고양이들
    example_gloss:
    - Marek은 개를 아주 좋아해요.
    - Kasia는 고양이를 아주 좋아해요.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: 물고기와 새 (복수)
    gloss: 물고기들 / 새들
    example_gloss:
    - 저는 물고기를 아주 좋아해요.
    - 할아버지는 새를 아주 좋아하세요.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: 저는 동물을 아주 좋아해요
    gloss: 저는 동물을 정말 좋아해요.
    note: '*Kocham*은 *kochać*의 *ja*에 해당하는 형태예요. 목적어 *zwierzęta*는 복수 대격이에요.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia는 고양이를 좋아하지만 반려동물은 없어요
    gloss: Kasia는 고양이를 아주 좋아하지만 반려동물은 없어요.
    note: 이 단원의 읽기 글에 나오는 대비를 미리 보여 주는 문장이에요.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek이 반려동물에 대해 물어요
    gloss: 'Marek: Ewa, 반려동물 있어요?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa는 개를 키워요
