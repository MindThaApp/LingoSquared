teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Wysoki*는 키가 큰 사람을, *niski*는 키가 작은 사람을 나타내요. 여자에게는 *wysoka* 또는 *niska*를 써요.'
    example_gloss:
    - Kasia는 키가 커요.
    - Tomek은 키가 작아요.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: 여기서 *stary*와 *młody*는 정확한 나이가 아니라 전반적인 인상을 나타내요.
    example_gloss:
    - 할아버지는 나이가 많으세요.
    - 마레크는 젊어요.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: 인상인가 나이인가'
    gloss: '*Stary*는 *Dziadek jest stary*처럼 전반적인 인상을 나타내요. 정확한 나이를 말할 때 폴란드어는 다른 구조를 써요: *Ile masz lat?*'
    note: 어때 보이는지는 *stary*나 *młody*로 말하고, 정확한 나이는 *Ile masz lat?*로 묻고 *mam ... lat*(저는 ...살이에요)으로 답해요.
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: 카시아는 키가 크고 토메크는 키가 작아요
    gloss: 카시아는 키가 크고 토메크는 키가 작아요.
    note: 대조의 뜻으로 쓰인 *a*(그리고, 반면에)로 이어진 간단한 문장이에요. *Wysoka*와 *niski*는 각각 여성 주어와 남성 주어에 맞춘 형태이며, 5과의 비교를 준비해요.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: 머리카락
    gloss: 머리카락
    note: '*Włosy*는 폴란드어에서 항상 복수예요: *długie włosy*(긴 머리).'
    example_gloss: Marek은 짧은 검은 머리예요.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: 머리 색 세 가지예요. *Blond*는 형태가 변하지 않고, *brązowe*와 *siwe*는 *włosy*에 맞춘 복수형이에요.
    example_gloss:
    - 에바는 금발이에요.
    - 토메크는 갈색 머리예요.
    - 할아버지는 백발이에요.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Długie*(긴)와 *krótkie*(짧은)는 *włosy*에 맞춘 복수형이에요.'
    example_gloss:
    - 카시아는 긴 머리예요.
    - 토메크는 짧은 머리예요.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy는 복수 형용사와 함께 써요
    gloss: '*Włosy*는 복수이므로 형용사도 복수형이에요: 긴 머리, 짧은 머리, 갈색 머리, 검은 머리.'
    note: '남성 사람이 아닌 복수 명사에는 *-e*로 끝나는 형용사가 와요: *długie włosy*. *Blond*는 예외로, 형태가 변하지 않아요(*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: 항상 복수'
    gloss: '*Włosy*(머리카락)는 항상 복수예요: *jej włosy są długie*(그녀는 머리가 길어요. 문자 그대로는 ''그녀의 머리카락들은 길어요''). *Jej*는 ''그녀의''라는 뜻이에요.'
    note: 폴란드어에서 머리카락은 복수 명사여서 동사와 형용사도 복수에 맞춰요. *Jej*('그녀의')는 소유하는 것이 몇 개든 변하지 않아요.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: 마레크는 짧은 검은 머리예요
    gloss: Marek은 짧은 검은 머리예요.
    note: '*Czarne*(검은)는 *włosy*에 맞춘 복수형이에요.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: 에바는 긴 금발이에요
    gloss: Ewa는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  pl.a1.unit25.lesson03.teach.oczy:
    title: 눈
    gloss: 눈
    note: '*Oczy*는 *oko*의 복수형이에요. 폴란드어에서는 보통 두 눈을 복수로 말해요.'
    example_gloss: 마레크는 갈색 눈이에요.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '눈 색 세 가지이며, *oczy*에 맞춰 복수형으로 써요: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa는 눈이 파란색이에요.
    - Tomek은 눈이 갈색이에요.
    - Kasia는 눈이 초록색이에요.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy에는 -e가 붙어요
    gloss: '*Oczy*는 복수이므로 형용사가 *-e*로 끝나요: 파란 눈, 갈색 눈, 초록색 눈.'
    note: '2과의 *włosy*와 같은 복수 어미예요: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Ewa는 어떻게 생겼어요?
    gloss: Ewa는 어떻게 생겼어요?
    note: '*Jak wygląda ...?*는 이 단원의 핵심 질문이에요. 누구의 외모든 물을 때 다시 쓸 수 있어요.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: 에바는 긴 금발에 파란 눈이에요
    gloss: 에바는 긴 금발에 파란 눈이에요.
    note: '*i*(그리고)로 머리와 눈을 한 문장에 묶은 모범 답이에요.'
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: 에바가 니나를 소개해요
    gloss: '에바: 어학 카페에 새로운 여자애가 와요. 이름은 니나예요.'
    note: '*Przychodzi*(온다)는 장면에 새로운 사람이 등장함을 나타내요. *do kawiarni językowej*에서는 *do* 뒤에 생격을 써요.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: 마레크가 어떻게 생겼는지 물어요
    gloss: '마레크: 좋아요! 어떻게 생겼어요?'
    note: 이 단원의 핵심 질문을 다시 쓰되, 이름 대신 *ona*(그녀)를 써요.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: 에바가 니나의 키와 머리를 설명해요
    gloss: '에바: 키가 작고 짧은 금발이에요.'
    note: 1과의 *niska*(*niski*의 여성형)와 2과의 머리 관련 어휘를 합쳤어요.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: 마레크가 눈에 대해 물어요
    gloss: '마레크: 그럼 눈은요?'
    note: 여기서 *jej*는 소유를 나타내는 '그녀의'라서 *jej oczy*는 '그녀의 눈'이에요. *jej*는 변하지 않아요.
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: 에바가 니나의 눈을 설명해요
    gloss: '에바: 초록색 눈이에요.'
    note: 3과의 *zielone oczy*를 다시 썼어요.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: 마레크가 니나를 알아볼 거예요
    gloss: '마레크: 고마워요! 그럼 알아볼 수 있겠어요.'
    note: '*Rozpoznam*은 완료상 미래(''알아볼 거예요'')이고, *ją*는 *ona*(그녀)의 대격이에요.'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Tomek과 Kasia 비교하기
    gloss: 토메크와 카시아는 남매이지만 생김새가 달라요. 토메크는 키가 작고, 짧은 갈색 머리에 갈색 눈이에요. 카시아는 토메크보다 키가 크고, 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      brat: 남자 형제
      siostra: 여자 형제
      wyglądają: ~해 보이다
      inaczej: 다른
      niski: 키가 작은
      krótkie: 키가 작은
      brązowe: 갈색의
      włosy: 머리카락
      oczy: 눈
      wyższa: 키가 더 큰
      długie: 긴
      zielone: 초록색
      wyglądasz: 너는 ~하게 보여(반말), 겉모습이 어떤지 말할 때
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: 비교급 다시 쓰기
    gloss: '비교급: *wysoki*(키가 큰)는 *wyższy*(더 큰)가 되고, 비교 대상은 *niż*(~보다) 뒤에 와요: 카시아는 토메크보다 키가 커요.'
    note: '폴란드어는 형용사의 어미를 바꿔 비교급을 만들고, 이때도 성에 일치해요: 카시아(여성)에게는 *wyższa*를 써요.'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: 카시아는 토메크보다 머리가 길어요
    gloss: 카시아는 토메크보다 머리가 길어요.
    note: '*Dłuższe*(더 긴)는 *włosy*에 맞춘 복수형이고, *niż*(~보다)는 비교 대상을 이끌어요.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*Mam ...*을 쓴 1인칭 모범 문장이에요. 내 외모를 말할 때 그대로 쓸 수 있어요.'
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: 마레크가 니나를 발견해요
    gloss: '마레크: 저기 봐요, 저 사람 니나예요? 짧은 금발에 초록색 눈이에요.'
    note: '*Patrz*(보세요)는 *patrzeć*의 명령형이에요. *Czy to Nina?*는 ''저 사람이 니나예요?''라는 뜻이에요.'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: 에바가 확인해 줘요
    gloss: '에바: 네, 니나예요!'
    note: 짧고 자연스러운 확인 표현이에요.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: 니나가 마레크에게 인사해요
    gloss: '니나: 안녕하세요, 마레크예요?'
    note: '간단한 친근한 인사 질문이에요. *być* 뒤에서 이름은 조격을 써요: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: 마레크도 니나에게 인사해요
    gloss: '마레크: 네! 만나서 반가워요, 니나.'
    note: '*Miło cię poznać*는 처음 만났을 때 쓰는 표준 표현이에요(''만나서 반가워요''; *poznać*는 ''알게 되다''). 니나를 부를 때는 호격 *Nino*를 써요.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. 마레크는 앞서 에바가 한 설명 덕분에 니나를 알아봤어요.
exercises:
  pl.a1.unit25.lesson01.exercise01.choose_kasia_jest_wysoka:
    instruction: '''Kasia jest wysoka.''의 뜻을 고르세요.'
    correct_option: Kasia는 키가 커요.
    distractors:
    - 카시아는 키가 작아요.
    - 카시아는 나이가 많아요.
    - 카시아는 젊어요.
    accepted_answers:
    - value: Kasia는 키가 커요.
      status: correct
    feedback: Kasia jest wysoka.
  pl.a1.unit25.lesson01.exercise02.listen_tomek_jest_niski:
    instruction: 듣고 화자가 말하는 내용을 고르세요.
    correct_option: Tomek은 키가 작아요.
    distractors:
    - 토메크는 키가 커요.
    - 토메크는 나이가 많아요.
    - 토메크는 젊어요.
    accepted_answers:
    - value: Tomek은 키가 작아요.
      status: correct
    feedback: Tomek jest niski.
  pl.a1.unit25.lesson01.exercise03.match_wysoki_niski_stary:
    instruction: 각 폴란드어 단어나 표현을 그 뜻과 연결하세요.
    accepted_answers:
    - value:
      - left: wysoki
        right: 키가 큰
      - left: niski
        right: 키가 작은
      - left: stary
        right: 나이가 많은
      - left: młody
        right: 젊은
      - left: Kasia jest wysoka.
        right: Kasia는 키가 커요.
      - left: Tomek jest niski.
        right: Tomek은 키가 작아요.
      - left: Dziadek jest stary.
        right: 할아버지는 나이가 많으세요.
      status: correct
    feedback: Wysoki/niski/stary/młody는 키와 나이에 대한 전반적인 인상을 나타내요.
    pairs:
    - left: wysoki
      right: 키가 큰
    - left: niski
      right: 키가 작은
    - left: stary
      right: 나이가 많은
    - left: młody
      right: 젊은
    - left: Kasia jest wysoka.
      right: Kasia는 키가 커요.
    - left: Tomek jest niski.
      right: Tomek은 키가 작아요.
    - left: Dziadek jest stary.
      right: 할아버지는 나이가 많으세요.
  pl.a1.unit25.lesson01.exercise04.order_kasia_jest_wysoka:
    instruction: 단어를 순서대로 놓아 '카시아는 키가 크고 토메크는 키가 작아요.'라고 말해 보세요.
    correct_option: Kasia jest wysoka a Tomek jest niski
    accepted_answers:
    - value: Kasia jest wysoka a Tomek jest niski
      status: correct
    feedback: Kasia jest wysoka, a Tomek jest niski.
  pl.a1.unit25.lesson01.exercise05.listen_dziadek_jest_stary:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Dziadek jest stary
    accepted_answers:
    - value: Dziadek jest stary
      status: correct
