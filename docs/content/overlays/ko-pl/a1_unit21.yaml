      status: correct
    feedback: '*Bo*(왜냐하면)는 이유를 이끌어요. *Mieszkanie*는 *-e*로 끝나서 형용사가 *nowe*가 돼요. *mam*(나는 가지고 있다) 뒤에서는 명사가 대격이지만 여기서는 형태가 같아요: *nowe mieszkanie*.'
    prompt_blocks:
    - 새 아파트가 생겨서 기뻐요.
  pl.a1.unit21.lesson02.exercise02.listen_jestem_smutny_bo:
