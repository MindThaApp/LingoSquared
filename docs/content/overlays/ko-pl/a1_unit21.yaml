  pl.a1.unit21.lesson02.exercise01.choose_jestem_szczesliwy_bo:
    instruction: '''저는 새 아파트가 생겨서 행복해요.''라는 뜻의 폴란드어 문장을 고르세요.'
    correct_option: Jestem szczęśliwy, bo mam nowe mieszkanie.
    distractors:
    - Jestem szczęśliwy, bo mam nowy mieszkanie.
    - Jestem szczęśliwy, bo ma nowe mieszkanie.
    - Jestem szczęśliwy, bo mam nowe mieszkaniem.
    accepted_answers:
