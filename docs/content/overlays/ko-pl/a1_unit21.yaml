teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: 기쁜, 슬픈, 화난
    gloss: 기쁜, 슬픈, 화난
    note: '*jestem*(나는 ~이다)과 함께 쓰는 기본 감정 단어 세 개예요. 남성형이고, 여성은 *szczęśliwa, smutna, zła*라고 해요.'
    example_gloss:
    - 저는 기뻐요.
    - 저는 슬퍼요.
    - 저는 화가 나요.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: 기쁘다고 말하기
    gloss: 저는 기뻐요.
    note: '폴란드어에서는 ''나는 ~해요''를 *jestem*(*być*의 형태) + 형용사로 말해요. 한국어는 형용사 자체를 활용하지만, 폴란드어는 동사와 형용사를 따로 써요. 형용사는 말하는 사람에 맞춰요: *szczęśliwy*(남성), *szczęśliwa*(여성).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: 대조되는 감정 말하기
    gloss: 저는 화난 게 아니라 슬퍼요.
    note: '*Nie*는 동사 바로 앞에 와요: *Nie jestem zły*. 두 번째 절에서 실제 감정을 말해요.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: 이유 묻기
    gloss: 왜 기뻐요?
    note: '*Dlaczego*(왜)는 이유를 묻는 기본 의문사예요.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: 이유 말하기
    gloss: 새 아파트가 생겨서 기뻐요.
    note: '*Bo*(왜냐하면)가 이유를 이끌어요. *mam*(나는 가지고 있다) 뒤에서 명사는 대격이 돼요: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: 부정적인 이유
    gloss: 저는 비가 와서 슬퍼요.
    note: '*Pada deszcz*(비가 와요, 직역하면 ''비가 떨어진다'')는 날씨를 말할 때 흔히 쓰는 표현이고, 여기서는 이유로 쓰였어요.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: 긴장한
    gloss: 긴장한
    note: 긴장한 상태를 나타내는 기본 단어예요.
    example_gloss: 첫 근무를 앞두고 긴장돼요.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: 무엇 때문에 긴장하는지 말하기
    gloss: 첫 근무를 앞두고 긴장돼요.
    note: '*Przed*(직역하면 ''~ 앞에'')와 조격을 함께 써서 무엇 때문에 긴장하는지 나타내요: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: 안심시키기
    gloss: 걱정하지 마세요.
    note: '*Nie martw się*(직역하면 ''자신을 걱정하게 하지 마'')는 안심시킬 때 쓰는 기본 표현이에요. *się*는 재귀 대명사예요.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: 다른 사람의 기분 묻기
    gloss: Marek은 기분이 어때요?
    note: '*Czuć się*(느끼다, 재귀 동사)는 감정 상태를 묻거나 말하는 기본 방법이에요: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: 다른 사람의 기분 설명하기
    gloss: 그는 긴장하고 있어요.
    note: '*Się*는 동사와 함께 있어요: *on czuje się*. 형용사는 *on*에 맞춰 남성형이에요: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: 왜 그런 기분인지 묻기
    gloss: 그는 왜 긴장해요?
    note: '*dlaczego*(왜)를 *On czuje się zdenerwowany*의 *czuje się* 패턴과 합친 문장이에요.'
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: 감정에 관한 메시지 읽기
    gloss: 안녕, Ewa. 혼자 하는 첫 근무 때문에 조금 긴장돼. 하지만 새 직장과 새 아파트가 생겨서 행복하기도 해. 잘될 거라고 생각해.
    note: 글쓴이가 무엇 때문에 긴장하는지, 무엇 때문에 기쁜지, 전반적으로 어떻게 전망하는지 살펴보세요.
    glosses:
      trochę: 조금
      zdenerwowany: 긴장한
      pierwszą: 첫 번째의
      zmianą: 근무
      samodzielną: 혼자
      szczęśliwy: 기쁜
      bo: 왜냐하면
      nową: 새로운
      pracę: 일
      nowe: 새로운
      mieszkanie: 아파트
      myślę: 생각하다
      będzie: 잘 되다 (여기서는 괜찮을 것이다)
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa가 Marek의 기분을 물어요
    gloss: 'Ewa: 안녕, Marek, 첫 근무를 앞두고 기분이 어때?'
    note: '*Przed pierwszą zmianą*(첫 근무를 앞두고)는 3과에서 본 *przed* + 조격 패턴을 다시 쓴 거예요. *Czujesz się*는 *ty*(너) 형태예요.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek이 긴장된다고 털어놓아요
    gloss: 'Marek: 솔직히 말하면 조금 긴장돼요.'
    note: '*Szczerze mówiąc*(솔직히 말하면, 직역하면 ''솔직하게 말하자면'')은 고백을 부드럽게 해 줘요.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa가 그를 안심시켜요
    gloss: 'Ewa: 걱정하지 마, 잘 해낼 거야!'
    note: '*Dobrze sobie poradzisz*(직역하면 ''잘 해낼 거야'')는 격려할 때 쓰는 굳어진 표현이에요. *poradzisz*는 *poradzić sobie*의 *ty*(너) 미래형이에요.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek이 고마워해요
    gloss: 'Marek: 고마워요, 정말 힘이 돼요.'
    note: '*Pomaga*는 *pomagać*(돕다)의 *on/ona/ono* 형태이고, *dzięki*는 ''고마워''에 해당하는 친근한 표현이에요.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa가 결과를 예상해요
    gloss: 'Ewa: 그리고 나중에는 분명히 아주 행복하고 자랑스러울 거야.'
    note: '*Na pewno*(분명히)는 확신에 찬 예측을 나타내요. *dumny*(자랑스러운)는 새롭고 유용한 형용사예요. *Będziesz*는 *być*의 미래형이에요.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek이 동의해요
    gloss: 'Marek: 네, 저도 그렇게 생각해요.'
    note: '*Ja też tak myślę*(직역하면 ''나도 그렇게 생각해요'')는 동의할 때 쓰는 자연스러운 표현이에요. 여기서는 강조를 위해 *ja*를 덧붙였어요.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: jest와 mu로 요약하기
    gloss: Marek은 첫 근무 때문에 긴장하고 있어요. Ewa가 그를 도와줘요.
    note: '*Jest*는 *być*(~이다)의 *on/ona*형이고, *mu*는 ''그에게''라는 뜻이에요(*pomagać*가 여격을 취하기 때문에 여격이에요). 작은 단어지만 다른 사람에 대해 말할 때 꼭 필요해요.'
exercises:
  pl.a1.unit21.lesson01.exercise01.choose_jestem_szczesliwy:
    instruction: '''저는 행복해요.''라는 뜻의 폴란드어 문장을 고르세요.'
    correct_option: Jestem szczęśliwy.
    distractors:
    - Jestem zły.
    - Mam szczęśliwy.
    - Jestem smutny.
    accepted_answers:
    - value: Jestem szczęśliwy.
      status: correct
    feedback: '*jestem*(나는 ~이다, *być*) + 형용사를 써요: *Jestem szczęśliwy*. 남자는 *szczęśliwy*, 여자는 *szczęśliwa*라고 해요.'
    prompt_blocks:
    - 저는 기뻐요.
  pl.a1.unit21.lesson01.exercise02.listen_nie_jestem_zly:
