teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: نام تان چیست؟ (رسمی)؛ نام تو چیست؟ (غیررسمی)
    note: Как вас зовут? شکل رسمی вас را دارد و با آدم‌های ناآشنا یا در محیط مؤدبانه استفاده می‌شود. Как тебя зовут? شکل غیررسمی тебя را دارد و با دوستان، طفل‌ها و هم‌سن‌ها استفاده می‌شود.
    example_gloss:
    - سلام! نام تان چیست؟
    - سلام! نام تو چیست؟
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: نام من ویکتور است.
    note: Меня зовут (در اصل «مرا صدا می‌کنند») راه معمول گفتن نام در روسی است، در هر سطح رسمی بودن.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: نام من آنا است.
    note: همین الگو، Меня зовут ...، با نام دیگر -- این عبارت به جنسیت گوینده تغییر نمی‌کند.
  ru.a1.unit02.lesson01.teach.register_note:
    title: انتخاب پرسش درست
    gloss: Как вас зовут? مؤدبانه است یا برای آدم‌های ناآشنا. Как тебя зовут? برای دوستان، طفل‌ها و هم‌سن‌ها است.
    note: این فرق رسمی و غیررسمی مثل فرق вы و ты است که در ادامه کامل یاد می‌گیرین -- вас و тебя شکل‌های مفعولی вы و ты استند.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: شما (رسمی)؛ تو (غیررسمی)
    note: در دری هم «شما» و «تو» داریم، و روسی نیز همین فرق را دارد -- вы با آدم‌های ناآشنا، بزرگ‌ترها و در محیط کار استفاده می‌شود؛ ты با دوستان، فامیل و طفل‌ها.
    example_gloss:
    - شما از کجا استید؟ (رسمی)
    - تو از کجا استی؟ (غیررسمی)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: کدام یک را کجا استفاده کنیم
    gloss: 'Вы رسمی است: با آدم‌های ناآشنا، در محیط کار، با بزرگ‌ترها. Ты غیررسمی است: با دوستان، فامیل، طفل‌ها.'
    note: اگر با کسی که انتظار вы دارد ты بگویین، ممکن بی‌ادبانه یا زیاده بی‌تکلف معلوم شود -- وقتی شک دارید، با вы شروع کنید.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: آیا می‌شود که به ты (غیررسمی) صحبت کنیم؟
    note: راه مؤدبانه برای پیشنهاد گذشتن از вы رسمی به ты غیررسمی، وقتی رابطه دوستانه شده باشد.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: بیایین به ты غیررسمی صحبت کنیم.
    note: راه کمی مستقیم‌تر و دعوت‌کننده‌تر برای همین پیشنهاد تغییر سطح مثل Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: شما از کجا استید؟ (رسمی)
    note: вы رسمی را دارد، که به ملاقات اول یا محیط کار می‌خورد.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: تو از کجا استی؟ (غیررسمی)
    note: شکل غیررسمی آن، که با کسی استفاده می‌شود که او را خوب می‌شناسید.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: من از کانادا استم.
    note: Из («از») حالت اضافی (родительный) می‌گیرد، پس Канада در اینجا Канады می‌شود -- این الگوی نشان‌دادن مبدأ قابل توجه است، هرچند دستور کامل حالت‌ها بعداً می‌آید.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: من از مسکو استم.
    note: 'همان الگوی مبدأ مثل Я из Канады: Москва بعد از из به Москвы تبدیل می‌شود.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: بیایین آشنا شویم.
    note: راه مؤدبانه و معمول برای آغاز معرفی بین دو نفری که اولین بار همدیگر را می‌بینند.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: از آشنایی تان خوشحال شدم
    note: جواب معمول و مؤدبانه بعد از این که کسی نامش را گفت.
    example_gloss: نام من جان است. -- از آشنایی تان خوشحال شدم.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: ایرینا پطروونا معرفی را آغاز می‌کند
    gloss: 'ایرینا پطروونا می‌گوید: سلام! بیایین آشنا شویم. نام من ایرینا پطروونا است.'
    note: ایرینا پطروونا اولین بار در یک دفتر رسمی با جان ملاقات می‌کند، پس Здравствуйте مؤدبانه و سطح вы را در تمام گفتگو استفاده می‌کند.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: جان با نامش جواب می‌دهد
    gloss: 'جان می‌گوید: از آشنایی تان خوشحال شدم. نام من جان است.'
    note: جان با Очень приятно به سطح رسمی و مؤدبانهٔ ایرینا پطروونا جواب می‌دهد.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: ایرینا پطروونا می‌پرسد جان از کجا است
    gloss: 'ایرینا پطروونا می‌پرسد: شما از کجا استید، جان؟'
    note: او Откуда вы رسمی را استفاده می‌کند، که به محیط دفتر می‌خورد.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: جان جواب می‌دهد و می‌پرسد
    gloss: 'جان می‌گوید: من از کانادا استم. و شما از کجا استید؟'
    note: جان از کجا بودنش را می‌گوید و با А вы откуда? مؤدبانه پرسش را برمی‌گرداند.
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: ایرینا پطروونا جواب می‌دهد
    gloss: 'ایرینا پطروونا می‌گوید: من از مسکو استم.'
    note: او گفتگو را تمام می‌کند، با همان الگوی مبدأ که قبلاً دیدیم.
