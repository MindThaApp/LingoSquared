teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: امروز چه روز است؟
    note: Какой با اسم مذکر день («روز») مطابقت می‌کند.
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: دوشنبه، سه‌شنبه
    note: در روسی نام روزهای هفته با حرف بزرگ نوشته نمی‌شود.
    example_gloss:
    - امروز دوشنبه است.
    - امروز سه‌شنبه است.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: چهارشنبه، پنجشنبه
    note: مثل همهٔ نام‌های روزهای هفته در روسی، среда و четверг با حرف کوچک نوشته می‌شوند؛ فقط اول جمله بزرگ می‌شوند.
    example_gloss:
    - امروز چهارشنبه است.
    - امروز پنجشنبه است.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: جمعه، شنبه
    note: суббота دو б دارد — اشتباه رایج املایی.
    example_gloss:
    - امروز جمعه است.
    - امروز شنبه است.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: یکشنبه
    note: آخرین روز در فهرست روزهای هفتهٔ روسی.
    example_gloss: امروز یکشنبه است.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: امروز ... است
    note: Сегодня با نام روز بدون فعل ربطی می‌آید؛ در دری هم «امروز جمعه» بدون فعل گفته می‌شود، اما «است» هم می‌توان گفت.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: تاریخ امروز چند است؟
    note: Какое با اسم خنثی число («تاریخ/عدد») مطابقت می‌کند، برخلاف какой день در بالا.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: اول، سوم
    note: عدد ترتیبی در تاریخ، ختم خنثی (-ое/-ье) می‌گیرد، چون با اسم نگفتهٔ число هماهنگ می‌شود.
    example_gloss:
    - امروز اول جنوری است.
    - امروز سوم جنوری است.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: پنجم، دهم
    note: همان الگوی ترتیبی خنثی مثل первое/третье.
    example_gloss:
    - امروز پنجم اکتوبر است.
    - امروز دهم اپریل است.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: جنوری، اپریل
    note: بعد از تاریخ، نام ماه به حالت اضافی (родительный) می‌آید؛ پس январь می‌شود января و апрель می‌شود апреля.
    example_gloss:
    - امروز سوم جنوری است.
    - امروز دهم اپریل است.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: اکتوبر
    note: شکل اضافی (родительный) کلمهٔ октябрь، با همان الگوی بعد از تاریخ مثل января/апреля.
    example_gloss: امروز پنجم اکتوبر است.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: تاریخ امروز چند است؟
    note: شیوهٔ عادی پرسیدن تاریخ تقویم.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: روز سه‌شنبه
    note: 'حرف اضافه в برای راحتی تلفظ پیش از вторник به во تبدیل می‌شود؛ خود вторник در اینجا تغییر نمی‌کند (نام روزهای مؤنث تغییر می‌کنند: в среду، в пятницу، в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: جلسه
    note: اسم عام برای جلسه یا ملاقات که وقتش مشخص شده باشد.
    example_gloss: جلسه روز سه‌شنبه است.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: انا روز را می‌پرسد
    gloss: 'انا: امروز چه روز است؟'
    note: انا گفتگو را با سؤال день از درس 1 شروع می‌کند.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: ویکتور با روز و تاریخ جواب می‌دهد
    gloss: 'ویکتور: امروز چهارشنبه، سوم جنوری است.'
    note: ویکتور روز هفته و تاریخ ترتیبی را با هم می‌گوید و شکل اضافی ماه، января، را به کار می‌برد.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: انا سه‌شنبه را پیشنهاد می‌کند
    gloss: 'انا: خوب. جلسه روز سه‌شنبه است؟'
    note: Хорошо جواب ویکتور را تأیید می‌کند، بعد انا سؤال بعدی‌اش را می‌پرسد.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: ویکتور تاریخ را تأیید می‌کند
    gloss: 'ویکتور: بلی، روز سه‌شنبه، نهم جنوری.'
    note: 'Да تأیید می‌کند، بعد ویکتور روز و تاریخ را دوباره می‌گوید. برای گفتن اینکه چیزی در کدام تاریخ واقع می‌شود، خود عدد ترتیبی به حالت اضافی می‌آید: девятого января («در نهم جنوری»)؛ با Сегодня девятое января («امروز نهم جنوری است») مقایسه کنید.'
