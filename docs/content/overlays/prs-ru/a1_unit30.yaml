    gloss: 'ایگور: پس من می‌دوم. بعد از آن فوتبال هم بازی می‌کنم.'
    note: '*Потом* (بعد از آن) پلان دوم را بعد از پلان اول می‌آورد و *побегаю* فعل کامل است: «کمی می‌دوم».'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: برنامهٔ لینا
    gloss: 'لینا: من شنا کردن را ترجیح می‌دهم، اما به پارک هم می‌آیم.'
    note: '*Я лучше поплаваю* یعنی «ترجیح می‌دهم شنا کنم». *Лучше* پیش از فعل ترجیح دادن را نشان می‌دهد.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
