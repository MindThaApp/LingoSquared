    title: موافقت دیما
    gloss: 'دیما: فکر خوب است! پیش‌بینی هوا را جستجو می‌کنم.'
    note: '*Хорошая идея* صفت مؤنث با اسم مؤنث است. *Поищу* آیندهٔ تام (совершенный вид) است، یعنی «جستجو می‌کنم».'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: دیما هوا را بررسی می‌کند
    gloss: 'دیما: روز شنبه آفتابی است!'
    note: '*Солнечно* کلمهٔ مربوط به هوا است. به فعل «بودن» ضرورت نیست: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
