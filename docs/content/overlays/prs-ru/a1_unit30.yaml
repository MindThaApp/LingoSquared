    title: До با حالت родительный
    gloss: 'شما *До свидания!* را می‌دانین. می‌توانین نام روز را هم بگویین: *До субботы!*، *До завтра!* بعد از *до* اسم در حالت родительный می‌آید.'
    note: الگوی خداحافظی بخش سلام و احوالپرسی را به یک روز مشخص گسترش می‌دهد.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: کی از چه چیز استفاده می‌کند؟
    gloss: نستیا هر روز به دیما زنگ می‌زند. او از تلفون استفاده می‌کند، نه از اپلیکیشن. دیما در خانه کمپیوتر ندارد، اما از انترنت تلفونش استفاده می‌کند. ایگور هر صبح پیش‌بینی هوا را جستجو می‌کند. بعد برای دویدن می‌رود. لینا اکثراً برای نستیا پیام می‌فرستد. شما هم هر روز از تلفون استفاده می‌کنین؟
    note: عادت‌های استفاده از وسایل هر چهار شخصیت را مقایسه می‌کند، مثل متن مقایسه‌ای بخش ورزش.
