  ru.a1.unit23.lesson01.teach.allo_eto_dima:
    title: Алло, это Дима.
    gloss: الو، من دیما استم.
    note: Алло وقتی به تلفون جواب می‌تین یا تماس را شروع می‌کنین گفته می‌شود.
    example_gloss: الو، ناستیا؟ من دیما استم.
