    title: Повтори, пожалуйста.
    gloss: لطفاً تکرار کن.
    note: Повтори غیررسمی است و برای دوست مناسب است.
    example_gloss: دیما، لطفاً تکرار کن.
  ru.a1.unit23.lesson02.teach.napishi:
