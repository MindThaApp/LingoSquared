  ru.a1.unit23.lesson03.teach.dima_allo_nastya:
    title: دیما تماس را شروع می‌کند
    gloss: 'دیما: الو، ناستیا؟ من دیما استم.'
    note: دیما در تلفون خودش را واضح معرفی می‌کند.
  ru.a1.unit23.lesson03.teach.nastya_govori_medlenno:
    title: ناستیا از او می‌خواهد آهسته صحبت کند
    gloss: 'ناستیا: سلام، دیما. لطفاً آهسته صحبت کن.'
    note: Говори медленно, пожалуйста از کسی می‌خواهد آهسته صحبت کند؛ Привет سلام غیررسمی برای دوست است.
